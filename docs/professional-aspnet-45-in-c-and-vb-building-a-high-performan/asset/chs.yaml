  \ Hanselman\n\n# 作者简介\n\n![image](img/fix-01.jpg)\n\n**JASON N. G** 是宾夕法尼亚州威尔克斯巴雷\
  \ United One Resources 的应用程序开发人员技术总监。他的编程生涯始于一个简单的 `GOTO` 语句，并持续了 15 多年的 Windows\
  \ 和 Web 应用程序开发。在此期间，Jason 有机会规划、构建、测试和部署多个企业应用程序，包括与会计和系统的集成，以及美国一些顶级银行使用的 B2B Web\
  \ 应用程序。\n\n日常活动之外，Jason 还撰写博客、演讲并组织技术活动，包括 `TECHbash` 和 `NEPA GiveCamp`。他是 `.NET\
  \ Valley` 技术用户小组的组长。最近，Jason 连续 10 年被评微软 MVP。他一直是 `ASPInsiders` 的成员，该小组直接向 `ASP.NET`\
  \ 团队提供产品反馈。您可以通过访问他的网站 [`jasongaylord.com`](http://jasongaylord.com) 更多关于他的信息。您可以在\
  \ Twitter 上通过 `@jgaylord` 关注他。\n\n![image](img/fix-02.jpg)\n\n**CHRISTIAN WZ** 从\
  \ 1993 年开始几乎专门从事 Web 技术，从此再未回头。作为开发人员和项目经理，他负责过从中型公司到大型国际企业的网站。作为作者，他编写或合著了 100\
  \ 多本书，这些书籍被翻译成 10 种语言。作为顾问，他帮助公司和开发团队使其应用程序更可靠、性能更好且更安全。Christian 经常为各种 IT 杂志写文章，是全球开发者大会上备受欢迎的演讲者，并乐于与他人分享他热衷的技术。为多个开源项目做出贡献，是微软\
  \ `ASP.NET` MVP 和 `ASInsider`，并是多项开发者认证的合著者。您可以在 Twitter 上通过 `@chwenz` 关注他。\n\n\
  ![image](img/fix-03.jpg)\n\n\n\n\n\n`PRANAV RASTOGI` 是微软 ASP.NET 产品团队的成员，常驻西雅图。在过去的几年里，Pranav\
  \ 参与了多个领域，如 ASP.NET Web Forms、Dynamic Data 以及最近的 ASP.NET SignalR。他致力于通过微软技术栈理解 Web\
  \ 开发人员的困扰，并助力增强微软技术栈 Web 开发体验的工具、包或库。Pranav 经常在世界各大会议上就各种 ASP.NET 相关主题进行演讲。他在 [`http://blogs.msdn.com/b/pranav_rastogi/`](http://blogs.msdn.com/b/pranav_rastogi/)\
  \ 博客分享他的经验。在加入微软之前，Pranav 毕业于佛罗里达大学，获得计算机科学硕士。\n\nPranav 还是一个美食爱好者，有时会在家里担任主厨（Chef\
  \ de Cuisine）。他是一个冒险寻求者，经常出现在荒野背徒旅行中。在闲暇时间，Pranav 经常向朋友们展示他的调酒技巧。如果你认识任何想举办派对并需要调酒师的人，尽管联系他。你可以在\
  \ Twitter 上关注 `@rustd` 的 Pranav。\n\n![image](img/fx-01.jpg)\n\n`TODD MIRANDA` 是\
  \ .NET 技术和整体软件工艺的活跃倡导者。他在各种平台上已开发了超过 20 年，并从 2000 年 .NET 预览以来就参与了其中工作。他使用过许多 .NET\
  \ 平台，但主要关注 ASP.NET。他是 NxtDimension Solutions 的所有者，提供微软技术栈的咨询和培训。作为微软 MVP，Todd 与微软保持紧密合作。他是\
  \ Birmingham .NET 用户组的联合创始人，并在开发社区中保持活跃。他录制了数百个关于微软开发主题的在线培训视频，包括安全、JavaScript、Silverlight、WPF、Expression\
  \ 和 ASP.NET。他是一位 INETA 演讲者，经常在用户组、社区活动和技术会议上进行演讲。你可以在 Twitter 上关注 `@tmiranda` 的\
  \ Todd。\n\n![image](img/fx-02.jpg)\n\n`SCOTT HANSELMAN` 是一位 Web 开发者，在 [`http://hanselman.com`](http://hanselman.com)\
  \ 写博客已十多年。他在俄勒冈州波特兰的家庭办公室为微软负责 Azure 和 ASP.NET。Scott 拥有三个播客：用于技术交流的 [`http://hanselminutes.com`](http://hanselminutes.com)、关于开发者生活与爱的\
  \ [`http://thisdeveloperslife.com`](http://thisdeveloperslife.com) 以及关于流行文化和技术媒体的\
  \ [`http://ratchetandthegeek.com`](http://ratchetandthegeek.com)。他写过多本书，并曾向全球近五十万名开发者进行过线下演讲。你可以在\
  \ Twitter 上关注 `@shanselman` 的 Scott。\n\n# 技术编辑简介\n\n`KEN COX` 自 20 世纪 90 年代中期 ASP\
  \ Classic 初期测试版本以来，一直在使用微软技术创建 Web 应用程序。他参与过几十个大小不等的 ASP.NET 站点，是 John Wiley & Sons\
  \ 出版物《ASP.NET 3.5 For Dummies》的作者。在退休前，Ken 连续 15 年被荣为 ASP.NET 微软最有价值人士（MVP），并仍然是\
  \ ASPInsider。他在加拿大安大省尼皮辛镇镇（Nipissing Township）的家中从事咨询工作。\n\n`BIPIN JOSHI` 是一位独立博客作者和作家，描写两个看似无关的话题——瑜伽和技术。他曾任任软件顾问和培训师，Bipin\
  \ 从 1995 年开始编程，并从 .NET Framework 诞生起就一直在使用它。他是一位出版作家，撰写或合著了六本书以及大量关于 .NET 技术的文章。在担任软件顾问和培训师期间，Bipin\
  \ 曾是微软最有价值人士（MVP）和微软认证培训师（MCT）。他还写过几本关于瑜伽的书。在接受了瑜伽生活方式后，他享受神性的临在，并描写瑜伽、生活和技术。可以通过\
  \ [`www.bipinjoshi.com`](http://www.bipinjoshi.com) 与他联系。\n\n`JOHN PETERSEN` 是微软\
  \ .NET 平台的早期采用者，拥有 20 多年的软件架构和开发经验。目前，John 是 Neudesic, LLC 技术平台组的实践总监（该公司是微软国家级系统集成商和金色\
  \ ISV 合作伙伴），并且是 10 次微软最有价值人士奖的获得者。John 是目前的 ASP.NET/IIS MVP。John 曾在 VSLive 和 DevConnections\
  \ 在内的众多行业活动以及许多区域活动和代码营上演讲。John 还是 `CODE Magazine` 的定期投稿者。\n\n`JEFFERY TAY` 自 2002\
  \ 年以来一直在开发和设计 .NET 解决方案，专注于教育和医疗领域的解决方案。他在过去 3 年被授予微软最有价值人士。他拥有 Java 以及大多数微软技术（如\
  \ Silverlight、SQL Server 和 Windows Server）的经验。他是新加坡国立大学的副处长，领导一个管理大学学习管理系统的团队，并开发利用\
  \ IT 增强教学的新解决方案。你可以通过 `taykwama@hotmail.com` 联系 Jeffery。\n\n`DEEPAK VERMA` 在过去 10\
  \ 年一直在开发和设计 Web 解决方案。在这些年，Deepak 参与过 Flash Scripting、Flex、ColdFusion、Silverlight、Java\
  \ 和 PHP 等技术，现在主要从事微软技术栈。他目前在微软担任软件测试工程师。在微软，他贡献了 Visual Studio 动态数据工具、多目标支持、Razor\
  \ 编辑器和工具、Azure Java SDK、PHP & .NET、Visual Studio HTML 和 CSS 编辑器、Azure Mobile Services\
  \ 以及 NuGet。他住在华盛顿州雷德蒙德，有妻子 Madhu 和孩子 Adya 和 Kian。可以通过 `deepu_verma@yahoo.com` 联系他。\n\
