  \n### AJAX\n\n你的 jQuery 配方中最后一个缺失的“配料”无疑是真正意义上的 Ajax：向服务器发送 HTTP 请求。为了方便测试，你首先创建一个\
  \ ASHX 处理器（参见[代码 25-13），它接受 GET 和 POST 请求并根据输入返回数据。实际上，这有三种行为：\n\n1. 浏览器发送简单的 GET\
  \ 请求。然后处理器以字符串形式返回当前时间。\n2. 浏览器发送带有 URL `json=true` 的 GET 请求。然后处理器以 JSON 格式（双引号包裹）以字符串形式返回当前时间。\n\
  3. 浏览器发送 POST 请求。然后处理器返回说明这是一个 POST 请求的文本。\n\njQuery 提供了多种方法来执行实际的 Ajax 请求。让我们先从简单的\
  \ GET 请求开始。`$.get()` 方法（注意 `$` 和 `get` 之间有一个点！）提示浏览器向 URL（第一个参数）发送 HTTP 请求。当服务器返回数据时，会执行回调函数（第二个参数），服务器返回的数据会自动作为参数传递。。代码\
  \ 25-14 展示了这一点。\n\n\n\n\n到目前为止，`GET` 请求返回的数据是一个简单的字符串。对于更复杂的数据，事实上的标准是使用 JavaScript\
  \ 对象表示（JSON，[`json.org/`](http://json.org/)））。当然，也可以从服务器加载 JSON 字符串，然后编写用户态代码代码将其转换为\
  \ JavaScript 对象，例如使用 JavaScript 内置的 `JSON.parse()` 方法。然而，使用 jQuery 的 `$.getJSON()`\
  \ 方法更加方便——它既执行了 HTTP 请求又解析了 JSON 结果，如列表 25-16 所示。\n\n发送 `POST` 请求看起来非常相似，但在表面之下你会发现浏览器需要发送一个额外的\
  \ HTTP 请求头，以便服务器能够解析输入数据。当然，如果你使用 `$.post()` 方法，jQuery 可以处理所有这一切。它的工作原理与 `$.get()`\
  \ 完全相同，不同之处在于使用 `POST` 代替了 `GET`。列表 25-17 向服务器发送 `POST` 请求并显示结果；图 25-12 证明确实使用了\
  \ `POST`。\n\n![image](img/f975-01.jpg)\n\n**图 25-12**\n\n`$.get()`、`$.getJSON()`\
  \ 和 `$.post()` 实际上是快捷方法，它们在内部只是将工作委托给 jQuery 的通用 Ajax 方法：`$.ajax()`。该方法需要两个参数：用于发送\
  \ HTTP 请求的 URL，以及一个包含额外选项的哈希表，例如要使用的 HTTP 动词、回调函数等。从 jQuery 1.9.0 开始，有 33 种不同的选项，因此完整列表将超出本章的范围。然而，表\
  \ 25-1 显示了最重要的选项。\n\n| **选项** | **描述** |\n| --- | --- |\n| `contentType` | 要发送到服务器的的内容类型\
  \ HTTP 请求头。 |\n| `Data` | 要发送到服务器的数据。 |\n| `dataType` | 期望从服务器返回的数据格式（例如 `\"json\"\
  ` 或 `\"xml\"`）。 |\n| `error` | HTTP 请求失败时的处理函数。 |\n| `success` | HTTP 请求成功时的处理函数。\
  \ |\n| `timeout` | 毫秒单位的超时值。在发送 HTTP 请求后经过这段时间且服务器未返回结果，则将执行错误处理函数。 |\n| `type`\
  \ | 请求类型，如 `GET` 或 `POST`。 |\n| `url` | 发送请求的 URL。 |\n\n**表 25-1**\n\n通过这种方法，可以执行更复杂的\
  \ HTTP 请求。例如，如果使用 ASMX Web 服务，通过 Ajax 调用它的 HTTP 请求（另见第 23 章）需要非常具体：必须设置额外的头，且返回的数据具有特定的格式。\n\
  \n列表 25-18 实现了一个简单的 ASMX 服务。注意如何使用 `System.Web.Script.Services.ScriptService` 属性来使其可以通过\
  \ JavaScript 调用。ASMX 服务创建了一个“Link”对象列表。每个对象都包含一个链接 URL 和链接文本。最后，返回该列表。ASMX 服务自动将此数据转换为\
  \ JSON 并返回给浏览器。\n\n列表 25-19 随后使用 `$.ajax()` 调用此服务并解析 JSON 对象（该对象实际上被封装在另一个 JSON\
  \ 对象中，属性 `\"d\"` 包含了返回的实际数据）。然后你创建一个列表项（`<li>` HTML 元素）并将其附加到页面。图 25-13 显示了浏览器中的结果。\n\
  \n![image](img/f978-01.jpg)\n\n**图 25-13**\n\n## JQUERY UI\n\n到目前为止，你“仅仅”在使用 jQuery\
  \ 的 JavaScript 功能，但你仍然需要实际编写行为和用户界面。然而，jQuery 有一个姐妹项目叫做 jQuery UI，其主页位于 [`jqueryui.com/`](http://jqueryui.com/)。它自述为“一组精选的用户界面交互、效果、小部件和主题”。事实上：jQuery\
  \ UI 的功能集并不大，但质量非常高。将 jQuery UI 之于 jQuery 恰比 ASP.NET Web Controls 之于 ASP.NET：后者是框架，前者在该框架的基础上提供\
  \ UI 控件。本节简要演示其中一个小部件，以展示该库的通用方法。\n\n当你查看 jQuery UI 主页的右上角时（参见图 25-14），你会你可以下载完整的\
  \ jQuery UI 包（我们通常推荐“稳定”版本），或者点击“自定义下载”并只选择你需要的组件（图 25-15）。\n\n![image](img/f979-01.jpg)\n\
  **图 25-14**\n\n![image](img/f979-02.jpg)\n**图 25-15**\n\n\n\njQuery 目前成为第一 JavaScript\
  \ 库是有充分的：它紧凑、简洁、易于学习且功能强大。得益于与 Visual Studio 的良好集成（包括提供的 `VSDOC` 文件），没有人真正怀念 Microsoft\
  \ Ajax 库。也许有一天，它的遗留——目前仍被第 23 章中引入的控件大量使用——也会被替换。\n\n# 26 实时通信\n\n## 本章内容概览\n\n\
  * 理解实时 Web 技术\n* 实现 HTML5 WebSockets\n* 理解 SignalR\n\n## 本章 WROX.COM 代码下载\n\n请注意，本章所有的代码示例均作为本章代码下载的一部分，可以在书籍网站\
  \ [www.wrox.com](http://www.wrox.com) 的“Download Code”选项卡中找到。\n\n万维网在过去的十年中已经变得非常成熟。它从大多数\
  \ Web 应用程序由静态页面组成的时代变成了更动态的内容。在过去的几年里，WWW 正向 Web 2.0 演进，允许用户之间进行交互和协作。所有的协作和交互都在\
  \ Facebook、Twitter 等许多社交网站上实时发生。例如，当有人在 Facebook 上点赞（poke）你或发推时，你会立即收到该操作的通知，以便与其他人实时交互。\n\
  \n实时 Web 是一套技术和实践，它使用户能够在作者发布信息后立即接收，而无需他们定期检查更新。实时应用的示例包括：如 Facebook 或 Twitter\
  \ 等社交应用；拼字游戏（Scrabble）或井字游戏等多人游戏；业务协作（如画板上的多用户协作）；以及新闻、天气或金融更新应用（如股票行情软件）。本章将介绍你如何编写\
  \ ASP.NET 应用程序，通过减少客户端和服务器之间的延迟来增强实时用户体验。\n\n## 传统的实时通信方案\n\n本章首先介绍在 .NET 中编写实时应用程序的主流方案。此类应用程序最常见的需求是维护客户端和服务器之间的**持久性连接（persistent\
  \ connection）**，这样，一旦服务器接收到数据，就能立即将其推送到客户端。考虑 IRC（互联网中聊天）的例子——你希望此连接在整个对话期间保持开启。在对话期间，会有没有数据传输的时候，因为用户可能处于空闲状态。在这种情况下，你仍然希望服务器和客户端之间的连接保持开启。\n\
  \n尽管 HTTP 通过使用 `Keep-Alive` 标志非常擅长维护持久连接，但在没有数据传输时，它无法维持长时间运行的持久连接。浏览器或服务器都会断开连接；如果有新数据进入，则需要重新建立。这种重新连接的过程增加了延迟，并导致迟缓的用户体验。大多数浏览器只允许从浏览器到服务器开启两个连接。如果其中一个连接被实时通信占用，那么它将减慢网站速度，因为网站需要下载\
  \ JavaScript、CSS 文件等其他资源。HTTP 是一种请求/响应协议，客户端向服务器发送请求，服务器将响应发回客户端。在客户端不发起请求的情况下，服务器无法向客户端发送响应。图\
  \ 26-1 展示了该协议的简易表示。\n\n![image](img/f984-01.jpg)\n\n**图 26-1**\n\n本节介绍了你可以在客户端和服务器之间建立长时间运行的持久连接的某些方法，以便服务器可以将数据推送到客户端，而无需客户端请求它。实现实时功能的另一种方法是客户端可以显式地从服务器拉取数据，但这会导致应用程序性能降低。\n\
  \n### 使用 Comet\n\nComet 是一种 Web 应用模型，其中客户端和服务器可以拥有长时间运行的 HTTP 连接，服务器可以将数据推送到浏览器，而无需浏览器请求数据。由于浏览器和代理的设计并未考虑到服务器事件，因此已经开发了若干种实现此目的的技术，每种技术都有不同的优缺点。最大的障碍是\
  \ HTTP 1.1 规范，它规定浏览器与 Web 服务器的并发连接不应超过两个。以下是实现 Comet 的两种方法。这些方法依赖于所有浏览器中常用的功能（例如\
  \ JavaScript），而不是插件模型。\n\n#### 流式传输（Streaming）\n\n实现 Comet 流式传输的应用程序会在服务器和客户端之间打开一个持久连接并监听事件。每当服务器发送新事件时，这些事件都会在浏览器中处理。流式传输可以使用隐藏的\
  \ `iframe` 或使用 `XMLHttpRequest` API 来实现。\n\n应用程序可以有一个隐藏的 `iframe` 元素。每当服务器发送新消息时，消息将以分块的形式作为\
  \ `iframe` 元素发送。随着事件的发生，`iframe` 会被包含 JavaScript 的脚本标签填充，这些标签需要在浏览器中执行。由于所有浏览器都按顺序处理页面，每个脚本标签在接收时都会被处理。\n\
  \n#### Ajax 长轮询（Ajax with Long Polling）\n\n长轮询是一种技术，客户端轮询服务器以检查是否有服务器想要发送的新数据。浏览器向服务器发送\
  \ Ajax 风格的请求，该请求保持开启，直到服务器在响应中向客户端发送数据。客户端一旦收到响应，就会立即向服务器发送另一个请求，以便保持连接开启。这样，服务器可以在事件发生时立即发送新数据。\n\
  \n### 轮询（Polling）\n\n轮询是一种方法，客户端向服务器发送请求，服务器无论是否有数据都会立即响应。然后客户端等待一段时间（几秒钟）并向服务器发送另一个请求。如果服务器有新数据，则发送；否则向客户端返回空响应。图\
  \ 26-2 展示了轮询的工作原理。\n\n![image](img/f985-01.jpg)\n\n**图 26-2**\n\n### 服务器发送事件（Server-Sent\
  \ Events）\n\n服务器发送事件（SSE）是一种从服务器向客户端推送通知的技术。通知以 DOM 事件的形式发送，客户端可以通过名为 `Event Source`\
  \ 的 JavaScript API 来处理这些事件。当你不需要双向数据传输（如聊天应用程序所需的）时，SSE 非常有用，因为服务器只需要发送数据。例如，如果你正在构建一个股票行情应用，SSE\
  \ 是一个很好的选择。图 26-3 展示了服务器发送事件的简单工作流。\n\n![image](img/f985-02.jpg)\n\n**图 26-3**\n\
  \n### 现有方案的缺陷\n\n上述所有的推送技术都试图维护客户端和服务器之间长时间的持久连接，以便服务器可以将数据推送到客户端。下一节将介绍这些方法的某些缺陷，其中许多缺陷正是构建\
  \ WebSockets 协议的动机。\n\n\n\n\nComet 流（streaming）的实现相当简单，但在不同浏览器之间使其工作非常困难。并非所有浏览器都支持所有的流方法，因此开发者需要实现复杂的流传输层以支持所有浏览器，并需要根据浏览器进行切换。由于连接和数据传输是通过\
  \ HTML 标签处理的，因此无法实现可靠的错误处理或跟踪连接状态。\n\n使用 Ajax 的长轮询（Long polling）在可靠错误处理和连接管理方面比流稍微好一点，但它存在在服务器端保持连接开启直到有数据要发送的开销。这种方法的服务器端实现变得困难，因为请求会一直挂起，直到有响应需要发送。这意味着在有数据发送之前，服务器线程会一直被占用。\n\
  \n传统的轮询（polling）让客户端和服务器的实现变得非常简单。然而，每当客户端向服务器发送请求时，都会产生创建 HTTP 请求和发送空响应的额外开销。如果你考虑聊天应用程序中交换的数据类型，消息通常很小。但是，当你构建\
  \ HTTP 请求时，你需要设置适当的头和其他关于请求的元数据。这导致每当从服务器向客户端发送消息时，都会产生巨大的开销，增加了延迟。\n\nSSE（服务器发送事件）也不适合支持双向数据传输。在下一节中，你将看到一种在\
  \ HTTP 上执行双向数据传输的新标准。\n\n## HTML5 WEBSOCKETS\n\n上一节简要回顾了用于实现实时通信的一些传统模式，以及使用这些模式的优缺点。\n\
  \n除了本章提到的问题外，所有现有的实时通信传统方法依赖于通过 HTTP 传输数据，这意味着由于每次请求都需要 HTTP 请求头，数据传输中存在开销。想象一下如果你正在编写一个聊天应用程序并发送聊天数据。每当你发送一条消息（通常很小，可能只有几个字节）时，因为你的消息是通过\
  \ HTTP 发送的，会有发送 HTTP 请求头的额外开销。这增加了所传输消息的负载。\n\n此外还有开启多个底层 TCP 连接的额外开销。服务器将使用一个连接发送消息，使用另一个连接接收来自不同客户端的每条传入消息。\n\
  \nHTML5 WebSockets 解决了这些问题并了实时应用的性能。让我们来看 WebSockets 协议，看看你如何在 ASP.NET 中使用它。\n\n\
  ### 什么是 WebSockets？\n\nWebSockets 是允许客户端和服务器之间进行双向通信的规范。通信通道通过单个 TCP 连接实现。WebSockets\
  \ 在网络浏览器和 Web 服务器中实现。WebSockets 仅使用 HTTP 升级客户端和服务器之间的连接，以便遵循 WebSockets 协议交换数据。该协议为服务器向客户端发送数据提供了标准化方式，而无需客户端请求数据，从而使实时交互成为可能。\n\
  \nWebSockets 的实现之一是所有通信都通过 80 或 443 端口进行。这特别重要，因为有许多环境会阻止非 80 端口的非标准 HTTP 连接。由于\
  \ WebSockets 是以这种方式实现的，该技术可以在现有环境中运行，而不会遇到某些 HTTP 连接可能遇到的问题。\n\nWebSockets 需要在浏览器客户端实现，也需要在服务器端实现。所有现代桌面浏览器都支持\
  \ WebSockets 协议。如果你在 Windows 8 上使用 ASP.NET 4.5，你将在服务器端获得 WebSockets 支持。在查看 WebSockets\
  \ 协议之前，让我们简要回顾一下现有的传输层历史。图 26-4 显示了不同的 OSI 层。\n\n![image](img/f987-01.jpg)\n\n**图\
  \ 26-4**\n\n### TCP/IP\n\nTCP（传输控制协议)/IP（网协议）是一组用于互联网及类似网络的相互关联的协议。这些是最早定义的网络协议。随着时间的推移，互联网已经发生了巨大的变化，其上面发生的通信类型也是如此。TCP/IP\
  \ 是参考 OSI（开放系统互连模型）建模的，OSI 定义了组成 TCP/IP 的若干层。将 TCP/IP 分为若干层有助于它随时间演进并适应硬件和技术的变化，并允许开发者在不同的层上工作，以构建协议栈或在协议栈之上构建应用程序。\n\
  \nOSI 模型的底部是物理层。它通过线缆介质访问控制等协议实现。该层提供了物理连接。向上移动 OSI 层，是网络层，它由 IP 实现。网络层允许 TCP/IP\
  \ 与不同的物理层互操作，并将数据包从一台机器路由到另一台机器。\n\n### TCP/HTTP\n\nTCP 和 UDP（用户数据报协议）是传输层中最为人知的传输协议。这些协议具有\
  \ `port`（端口）的概念，它们在发送消息时将其进行复用和解复用。UDP 已在私网应用中被广泛采用，但在 Web 上并未广泛采用。另一方面，由于 HTTP\
  \ 的存在，TCP 在 Web 上被广泛使用。\n\nTCP 提供了计算机之间可靠的数据传输。它管理着复杂的情况，如数据包排序、从传入数据包正确构造消息、错误检测、流量控制、超时等。应用程序开发者可以获得无缝的双向数据传输体验，而无需费诸于管理低级复杂性的烦恼。\n\
  \nHTTP 协议提供了对可靠的面向连接的请求-响应协议的支持。当客户端需要向服务器发送请求时，会打开一个 TCP 端口，请求/响应在该端口上发生。如果客户端发送另一个请求，它将在另一个\
  \ TCP 端口上发生。HTTP 协议的简单性使其非常流行，这也是它在 Web 上被广泛使用的原因。HTTP 还是一个无状态协议，这使其具有更好的扩展性。然而，HTTP\
  \ 并没有利用 TCP 的双向数据传输支持。\n\n### 引入 WebSockets 协议\n\n\n\n\nWebSockets 协议的主要挑战之一是使其能够在现有的网络环境中运行。这意味着该协议必须与现有的代理服务器、路由器和防火墙兼容。在这些环境中，80\
  \ 端口或 443 端口已为 HTTP/HTTPS 连接开放，可以进行任何数据交换。当客户端想要通过 WebSockets 连接发送数据时，它会调用服务器并使用\
  \ HTTP 进行连接。由于它仍然在使用 HTTP，中间代理或路由器无需更新即可允许该连接。\n\n该协议从客户端和服务器之间的握手开始，客户端向服务器表示它想要通过\
  \ WebSockets 发送数据。握手再次通过 HTTP 进行，以确保任何中间路由器都不会拒绝此握手。列表 26-1 显示了客户端需要发送给服务器的头部。\n\
  \n这些头部中的内容与任何普通的 HTTP 头部相同。此握手是一个正常的 HTTP `GET` 请求。客户端在 `Host` 头部中包含主机名，以便客户端和服务器可以验证它们对使用的主机达成一致。`Upgrade`\
  \ 和 `Connection` 头部在 HTTP 中也有规定，并用于客户端升级正在使用的协议。`Upgrade` 头部是 WebSockets 协议要求的。它表示客户端想要将连接升级为\
  \ WebSockets 协议。图 26-5 显示了 HTTP 请求如何升级为 WebSockets 连接。\n\n![image](img/f989-01.jpg)\n\
  \n**图 26-5**\n\n`Origin` 头部字段用于防止浏览器中使用 WebSockets API 的脚本对 WebSockets 进行未经授权的跨源使用。如果服务器不想接受来自此主机的连接，它可以拒绝连接并返回错误代码。\n\
  \n`Sec-WebSocket-Version` 头部告诉服务器客户端支持哪个版本的 WebSockets 协议。如果你在 Windows 8 上构建应用程序，则应将其设置为\
  \ 13。如果服务器支持 WebSockets 但不支持该版本的协议，服务器可以终止此请求。这很重要，因为随着 WebSockets 规范的演进，不同的客户端（如\
  \ IE、Chrome、Firefox 等）支持不同版本的规范。客户端和服务器可以根据自己的进度自行升级到规范的最新版本。在理想世界中，所有客户端和服务器都使用最新版本。然而，考虑到不同公司在软件实现上花费的时间，可能会出现客户端和服务器之间支持版本存在差异的情况。此头部确保客户端和服务器可以验证它们支持的每种协议版本，并在不兼容时接受或拒绝\
  \ WebSockets 请求。\n\n`Sec-WebSocket-Key` 头部保护服务器免受来自非 WebSockets 客户端的连接。这防止了攻击者通过使用\
  \ `XMLHttpRequest` 或表单提交发送包来欺骗 WebSockets 服务器。此头部向客户端和服务器证明正在建立合法的连接。该值必须是一个随机选择的（理想情况下是加密随机的）16\
  \ 字节数字，在安全术语中被称为 `nonce`（随机数数字），然后对该头部值进行 base-64 编码。\n\n额外的头部字段用于选择 WebSockets\
  \ 协议中的选项。此版本提供的典型选项包括子协议选择器（`Sec-WebSocket-Protocol`），它是客户端支持的扩展列表（`Sec-WebSocket-Extensions`）。`Sec-WebSocket-Protocol`\
  \ 请求头部字段可用于指示服务器接受哪些子协议（构建在 WebSockets 协议之上的应用层协议）。服务器从可接受的协议中选择一个或都不选，并在握手中回显该值，以表示它已选择了该子协议。\n\
  \n一旦客户端发送握手且服务器理解 WebSockets，服务器就会切换切换到 WebSockets。服务器向客户端发送 HTTP 101 响应，表示 WebSockets\
  \ 协议握手已完成，连接现在升级为使用 WebSockets 协议。列表 26-2 显示了服务器返回给客户端的响应头部。\n\n这些仍然是有效的 HTTP 头部，因此它们是正常的\
  \ HTTP 响应。客户端也需要验证响应，以确保它来自其发送握手的服务器。客户端通过使用 `Sec-WebSocket-Accept` 头部来实现此。当服务器获取\
  \ `Sec-WebSocket-Key` 值时，它不会对其进行解码。它将该字符串与一个著名的 GUID（全局唯一标识符）拼接，并使用 SHA1 对组合进行哈希，产生一个\
  \ base-64 编码的值并通过此头部返回给客户端。客户端可以执行相同的操作并验证结果。如果验证成功，客户端就可以接受握手响应并建立 WebSockets 连接。\n\
  \n客户端和服务器现在可以通过此 WebSockets 连接发送和接收数据。下一节将查看这种数据传输是如何完成的。\n\n### WebSockets 数据传输\n\
  \nWebSockets 协议旨在为服务器和客户端之间的双向通信提供高扩展性和低开销。一旦连接升级，通信将在 TCP 之上进行。该协议在 TCP 之上提供了一种数据帧封装机制，但没有数据包大小等限制。TCP\
  \ 是基于流的，而 WebSockets 是基于消息的数据传输。这意味着当通过 WebSockets 传输数据时，它是作为帧序列被传输的。封装协议只需要几字节额外的封装开销，由于传输是在\
  \ TCP 之上进行的，因此它具有可靠性和顺序交付的优点。帧有两种类型——控制帧和数据帧。控制帧用于通信 WebSockets 的状态，而数据帧用于传输数据。\n\
  \n每个帧都有一个 `opcode`，指示帧类型以及负载的大小。负载是客户端和服务器相互发送的实际数据。WebSockets 协议支持分帧。这意味着消息可以分成不同长度的帧。这提供了包的便利性，而无需处理大小限制。如果发送端/接收端不知道发送或接收数据的精确长度，WebSockets\
  \ 将消息分成帧。然后每个帧都可以指示它包含多少数据以及它是否是消息的最后一个帧，从而表示整个消息已传输。数据帧可以携带二进制或文本数据，这通过帧的 `opcode`\
  \ 值来指示。图 26-6 显示了典型的 WebSockets 数据帧看起来什么样。\n\n![image](img/f990-01.jpg)\n\n**图 26-6**\n\
  \n控制帧主要用于关闭连接，也可以用于 ping 客户端或服务器以确保端点仍然活跃并保持 TCP 连接打开。如果连接的一端发送 ping，另一端可以发送 pong\
  \ 以确认连接存活。这对于保持连接存活很有用，因为某些过度积极的代理或防火墙可能会在连接空闲时杀死连接。客户端或服务器可以通过指定适当的 `opcode` 来构建控制帧。\n\
  \n\n\n\n数据分帧的一个关键方面是掩码（masking）。`Masking` 是一种简单的算法，将有效负载与帧包含的密钥进行异或（XOR）运算。掩码密钥需要是不可预测的，以防止恶意应用程序的作者选择在网络上传输的字节。\n\
  \n### WebSockets API\n\nWebSockets 协议已由 IETF（互联网工程任务组）标准组织进行了标准化。这意味着任何人都可以遵循此标准，并在自己的客户端或服务器中实现它。\n\
  \n所有常用的浏览器——如 Internet Explorer、Chrome、FireFox、Safari、Opera 等——都添加了对 `WebSockets\
  \ API` 的支持。\n\n表 26-1 显示了一些常用的 JavaScript 事件监听器，你可以通过这些监听器在 Web 浏览器与 WebSockets\
  \ 连接上执行基本操作。\n\n| **事件监听器** | **描述** |\n| --- | --- |\n| `Onopen` | 当 WebSockets\
  \ 连接打开时触发此事件。 |\n| `onclose` | 当 WebSockets 连接关闭时触发此事件。 |\n| `onmessage` | 当客户端通过\
  \ WebSockets 连接接收从服务器发送的数据时触发此事件。 |\n| `Send` | 该方法用于从客户端向服务器发送数据。 |\n| `close`\
  \ | 该方法关闭服务器与客户端之间的 WebSockets 连接。 |\n\n**表 26-1**\n\n### ASP.NET 4.5 中的 WebSockets\n\
  \n既然你现在已经看到了 WebSockets 协议的实际运行情况，在本节中，你将查看如何在 ASP.NET 中使用 WebSockets 构建应用程序。\n\n\
  由于 WebSockets 协议需要客户端和服务器共同，你将查看这两种情况。在 Web 服务器上，有一个名为 `WebSockets module` 的新模块。它是在\
  \ Windows Server 2012 的 `IIS 8` 中引入的。该模块实现了 WebSockets 协议并负责处理数据传输。\n\n图 26-7 显示了你如何在\
  \ `IIS 8` 中启用 WebSockets 协议。你必须在 Windows 中启用 `IIS Web Server` 角色。启用后，你需要在 `IIS Application\
  \ Development Features` 区域选择 `WebSocket Protocol` 选项。\n\nASP.NET 提供了良好的 API，应用程序开发者可以使用这些\
  \ API 来处理 WebSockets 请求。这些 API 允许开发者接受 WebSockets 连接并在连接上进行通信。你将编写 ASP.NET HTTP\
  \ 处理器，它们可以与任何类型的 WebSockets 请求交互，并发送和接收数据。\n\n当客户端发送 WebSockets 握手时，ASP.NET 会检查服务器是否支持\
  \ WebSockets，如果满足所有协议要求，则升级请求。当服务器与客户端之间的连接升级成功，ASP.NET 和 `IIS` 将通过连接接收传入数据并通过连接发送数据。\n\
  \n当应用程序需要发送数据时，该模块根据 WebSockets 规范构造适当的帧，并通过 WebSockets 连接发送这些帧。该模块还会查看来自客户端的传入帧，并从这些帧构造消息，以便应用程序接收该消息。\n\
  \n![image](img/f992-01.jpg)\n\n**图 26-7**\n\n#### 检查服务器端 WebSockets 回显处理器\n\n列表\
  \ 26-3 显示了一个简单的 WebSockets 回显处理器。它接受 WebSockets 请求，接收来自客户端的消息，并将相同的消息发回客户端。\n\n\
  当请求到达此回显处理器时，处理器首先在 `ProcessRequest` 函数中检查该请求是否为 WebSockets 请求。如果是，则回显处理器将在 `ProcessRequest`\
  \ 中调用的 `MyWebSocket` 任务中读取通过 WebSockets 连接发送的消息。回显处理器使用 WebSockets API 来接收和发送消息。\n\
  \n#### 检查客户端 WebSockets 代码\n\n现在你已经查看了 ASP.NET 处理器中 WebSockets 的服务器端实现，现在是时候查看如何从网页内部内部创建\
  \ WebSockets 连接了。\n\n要连接到端点，你只需要创建一个新的 WebSockets 实例，并为新对象提供一个代表你想要连接的端点的 URL。\n\
  \n一旦建立连接，你就可以 `send` 和 `onmessage` 事件监听器在连接上发送和接收消息。你可以使用表 26-1 中显示的其他事件监听器关闭连接并执行\
  \ `WebSockets API` 支持的任何其他功能。\n\n列表 26-4 显示了一个典型的网页，该网页使用 JavaScript 中的 WebSockets\
  \ API 实现来连接到 WebSockets 回显处理器。\n\n当你浏览到此页面时，JavaScript 代码将被执行。最初在 JavaScript 中，页面尝试对你从列表\
  \ 26-3 中看到的回显处理器发送一个 WebSockets 请求。当你点击页面上的 Send 按钮时，页面通过 WebSockets 连接将数据发送到回显处理器。回显处理器向浏览器发送响应，当浏览器接收到数据时，就会调用\
  \ `onmessage()` JavaScript 函数，在页面上显示收到的数据。图 26-8 显示了此示例回显演示的样式。\n\n![image](img/f995-01.jpg)\n\
  \n**图 26-8**\n\n### 使用 WebSockets 的优势\n\nHTML5 WebSockets 不仅仅是 HTTP 通信的一次改进。它超越了其他所有技术，使得实时应用程序变得更加强大。减少负载开销和延迟方面的改进是巨大的，以至于大多数巨头立即转向使用\
  \ WebSockets。\n\nWebSockets 为编写实时应用程序提供了原生支持。通过将连接从 HTTP 升级到 WebSockets 并在 WebSockets\
  \ 通道上传输数据，负载大小大幅减小。这是因为每次消息传输都不需要发送 HTTP 头部。此外，由于 WebSockets 通信通过单个 TCP 连接进行，不再需要在服务器上打开多个端口来发送和接收数据。在实现实时场景时，应用程序变得非常简单，因为易于使用的\
  \ WebSockets API 有助于维护从客户端到服务器的连接并跟踪服务器返回的回复。\n\nWebSockets 协议握手在 HTTP 上进行。这意味着它可以在已经在使用\
  \ HTTP/HTTPS 的环境中使用。这样做是为了确保 WebSockets 于采用，因为这些端口和所有中间设备都可以通过 HTTP 传输数据。\n\nWebSockets\
  \ 是安全的。协议设计者面临的许多挑战之一就是安全性。WebSockets 有称为 `wss` 的 URI 规范，使用与 HTTPS 相同的 TLS/SSL 加密。当\
  \ WebSockets 握手发生时，客户端和服务器使用 `Sec-WebSocket-Protocol` 头部验证连接。在作为帧传输数据时使用了掩码，这可以防止网络基础设施的攻击。\n\
  \n### SIGNALR\n\nWebSockets 是支持高扩展性实时应用程序的一大进步。通过对 WebSockets 协议的投入，现在可以在 HTTP 上进行双向数据传输。由于\
  \ WebSockets 是一种现代标准且最近作为 HTML5 规范的一部分引入，它尚未被广泛采用。本节为一些无法采用 WebSockets 的人提供了一个更现实的替代方案：SignalR，它可能是两者的兼得。\n\
  \n\n\n\n\nWebSockets 作为一种现代标准，既有优势也有缺点。尽管这一现代标准为更美好、更强大的未来铺平了道路，但该标准被大众广泛采用需要时间。在服务器端，`WebSockets`\
  \ 仅在 Windows 8 或 Windows Server 2012 以及 `.NET Framework 4.5` 中受支持。这限制了 `WebSockets`\
  \ 应用的范围。\n\n如果你使用 `WebSockets` 编写应用程序，使用旧版平台的用户将无法使用你的程序，除非你为他们提供了回退机制（fallback\
  \ behavior）。这种回退机制可能涉及默认使用 Comet 或其他推送技术。需要为应用程序编写两个版本的实现是令人生畏的，并最终导致维护上的噩梦。\n\n\
  开发 `WebSockets` 的核心理念是解决 `HTTP` 上双向数据传输的根本性问题。正如你之前学到的，`HTTP` 是一个简单的协议，最适用于请求-响应场景。随着\
  \ Web 在人们用于通信的应用方面变得越来越丰富，`HTTP` 已成为一个瓶颈。`WebSockets` 协议的主要动机就是解决这个问题。`WebSockets`\
  \ 规范的一部分还关注了 `WebSockets` API，它为创建 `WebSockets` 连接（即在连接上发送和接收数据）提供了非常基础的支持。这些 API\
  \ 并没有为编写实时应用提供任何高级编程构造结构，例如管理多个连接、错误恢复等。\n\n过去十年中，Web 访问最大的变化在于访问 Web 的方式。桌面浏览器不再是人们浏览网页的唯一途径。具有不同形态的设备出现了爆炸式增长，从智能手机到平板电脑以及其间的任何设备。除了浏览器，这些设备形态还暴露了人们可以用来交互的应用程序。作为这一变化的一部分，用户使用触控设备而非传统的鼠标和键盘与这些应用程序进行交互。\n\
  \n这些变化为应用程序开发者带来了挑战。他们必须编写能够在不同环境和设备上运行的实时应用。我们需要一个库来解决这些问题，并让开发者更容易编写应用程序，而无必担心环境和设备的低级细节。这就是\
  \ `SignalR` 用用武场。它让开发实时应用的体验变得更加简单且有趣。\n\n### 什么是 SignalR？\n\n`SignalR` 是一个构建在 `ASP.NET`\
  \ 之上的库。它让为 Web 应用程序添加实时功能变得异常简单。当 `WebSockets`可用时，`SignalR` 在底层使用它；当不可用时，它会优雅地回退到其他技术和方案。在此期间，你的应用程序代码保持不变。\n\
  \n`SignalR` 还提供了一个非常简单的高级 API 用于编写实时应用，并为连接管理增加了实用的钩子（hooks）。它还实现了需要服务器高频更新的新类型应用（例如实时游戏）。图\
  \ 26-9 显示了 `SignalR` 的高级特性。\n\n![image](img/f997-01.jpg)\n\n**图 26-9**\n\n`SignalR`\
  \ 也支持不同的环境和设备。它会确定客户端和服务器支持的内容，并选择最佳方法建立实时连接。如果客户端和服务器都支持 `WebSockets`，它将使用 `WebSockets`，否则将使用次优方案。这意味着你的应用程序将能够在不同\
  \ Windows 版本的各种浏览器上无缝运行，而无需你更改应用程序代码。`SignalR` 的另一个之处在于它暴露了 API，因此你可以为移动设备和平板电脑构建实时应用。这使得你为来自不同设备的客户端连接使用同一套服务器端代码。\n\
  \n### ASP.NET 中的服务器端 SignalR\n\n在你的 `ASP.NET` 中使用 `SignalR` 与使用 `WebSockets` 类似。服务器端有一部分负责接收客户端连接并在所有客户端之间传输数据。`SignalR`\
  \ 和 `WebSockets` API 区别在于，`SignalR` 提供了管理连接并确保所有客户端无缝交换数据的额外功能。正如你在 列表 26-3 中看到的处理\
  \ `WebSockets` 连接的 `HTTP` 处理器，`hub` 是客户端可以调用的服务器端端点。它还管理所有连接，并从各种客户端发送或接收数据。列表 26-5\
  \ 显示了一个可用于聊天应用的 `hub` 示例。\n\n与 `WebSockets` 回显处理器不同，`hubs` 不需要任何代码来接受连接。协商连接和选择最佳协议的低级细节对开发者隐藏了，这样他们就可以专注于应用程序代码，而不是协议协商。\n\
  \n`SignalR` 支持服务器到客户端的 RPC（从服务器端 `.NET` 代码调用客户端中的函数）。例如，在 列表 26-5 中，`addMessage`\
  \ 是网页上的一个 JavaScript 函数，如 列表 26-6 所示，它从服务器端的 `hub` 被调用。\n\n`hubs` 在服务器端提供了许多高级功能，包括一种安全机制。它们可以检查客户端是否经过验证并授权与服务器通信。`hubs`\
  \ 可以以多种方式向所有连接的客户端广播消息，或仅向发送消息的客户端发送。`hubs` 还提供了连接、断开或重连时触发的事件。这些功能使得跟踪客户端并传输消息变得简单。\n\
  \n### ASP.NET 中的客户端 SignalR\n\n在你的应用程序中使用 `SignalR` 的另一个方面是客户端。`SignalR` 可以用于不同类型的客户端。本节将介绍如何在网页中使用它，该网页可以通过浏览器访问。这种体验类似于\
  \ 列表 26-4，该列表显示了如何使用 JavaScript 中的 `WebSockets` API 建立 `WebSockets` 连接到处理器，如 列表\
  \ 26-3 所示。\n\n当你运行应用程序时，`SignalR` 在客户端生成一个代理，以便客户端可以调用服务器上的函数。如 列表 26-6 所示，客户端调用一个名为\
  \ `Send` 的函数，该函数在服务器端定义，如之前的 列表 26-5 所示。\n\n```\n列表 26-6 使用网页中的 SignalR JavaScript\
  \ 库。\n```\n\n如 列表 26-6 所示，要连接到 `hub`，你需要调用 `SignalR` 生成的代理 `/signalr/hubs`。一旦连接启动，你就可以在连接上发送和接收数据。图\
  \ 26-10 显示了一个基于 列表 26-5 和 列表 26-6 代码的聊天示例。为了实现基础聊天场景，你在应用程序中需要编写的只有上述两个列表所示的代码。一旦运行应用程序，你可以使用不同的浏览器访问此应用程序，当你从一个浏览器发送文本时，`SignalR`\
  \ 会自动将消息发送给所有其他连接的客户端。\n\n使用 `SignalR` 的最大优势是“一次编写，到处运行”的方法。作为开发者，你只需使用 `SignalR`\
  \ 编写应用程序，它将根据用户使用的平台选择最佳传输方式进行通信。\n\n\n\n\n由于 SignalR 构建在 `ASP.NET` 之上，因此你可以利用所有熟悉的\
  \ `ASP.NET` 概念，如路由、身份验证和授权，并在构建 SignalR 应用时使用这些概念。\n\n## 总结\n\nWeb 在为用户提供各种交互和通信模型方面已经取得了巨大的进步。随着用户向更多的社交应用倾斜，对实时通信的需求急剧增加。社交互动的使用也提高了用户对提供实时协作环境的期望。这促使万维网联盟（W3C）思考通过创新的方法来升级通用通信协议，以支持实时通信。\n\
  \n本章介绍了了支持实时应用的各种现有方法。这些旧方法的某些缺点导致它们在现代 Web 环境中表现不佳。为了解决这些缺点，`WebSockets` 协议作为 HTML5\
  \ 规范的一部分被引入`WebSockets` 在确保实时应用具有良好的性能和可扩展性方面实现了质的飞跃。\n\n最后，本章简要回顾了 `SignalR` 如何通过使“一次编写，随运行”模型变得更容易，将编写实时应用的开发者体验提升到新的高度。\n\
  \n# 27: 移动优先的网站开发\n\n### 本章包含哪些内容？\n\n* 什么是响应式 Web 设计？\n* 如何检测移动设备\n* 关于 `ASP.NET`\
  \ 移动功能的所有信息\n* 理解 `ASP.NET MVC 4` 移动功能\n* 如何测试你的移动站渲染情况\n\n## 本章的 Wrox.com 代码下载\n\
  \n请注意，本章中的所有代码示例都是本章代码下载的一部分，可以在书籍网站的 [`www.wrox.com`](http://www.wrox.com) 的“Download\
  \ Code”（下载代码）选项卡中找到。\n\n在如今，一个成功的网站意味着它能够被移动设备访问。能够浏览互联网的手机数量持续增长，使用它们进行浏览的人数也随之增长。假设某个特定网站不会被移动设备浏览已不再是安全的做法了。对于许多企业来说，拥有移动网站是其收入占比日益增加的来源。即使对于那些不依赖移动流量收入的企业，他们的客户也开始期待能够在移动设备上浏览他们的网站。随着移动设备使用的持续增加，移动\
  \ Web 设计变得比以往任何时候都更加重要。\n\n本章探讨了让适应移动设备变得简单的各种技术和方案。虽然 `ASP.NET` 提供了一些帮助，但并不是所有的解决方案都依赖于特定的技术。\n\
  \n## 面临移动 Web 设计的挑战\n\n尽管开发移动网站的工具和技术已经发生了，但挑战仍然存在，如下：\n\n* **屏幕尺寸**：这是显而易挑战。在较小的屏幕尺寸上工作通常意味着你在布局网站时所出的选择在移动设备上会非常不同。你可能需要将桌面浏览器上的多个水平列更改为单堆叠列，以适应较小的屏幕。你可能需要将复杂的水平导航菜单扁平化并垂直方向显示它们。\n\
  * **带宽**：这往往被忽视了。使用桌面浏览器时，用户可能具有高可用性、高带宽的互联网连接。移动设备通常具有较低的带宽连接，有时可能会断开连接。更说移动设备上的带宽通常更贵。在向移动设备提供内容时，有效利用带宽至关重要。虽然在构建丰富的桌面网站时你可能依赖许多大型客户端脚本库和大型\
  \ CSS 文件，但在为较小的移动浏览器设计时，这可能并不实际。\n* **图像大小**：移动网站关心的不仅仅是客户端脚本库和 CSS 文件。你还必须考虑图像大小，不仅是因为带宽的增加，还因为物理尺寸的原因。理想情况下，用于移动设备的图像在像素大小和文件大小上都应该显著更。\n\
  * **用户交互**：与移动设备的交互与桌面设备的交互显著不同。移动设备使用触摸和手势，而桌面设备使用鼠标和键盘。在桌面屏幕上使用鼠标选择元素与触摸移动屏幕上的元素大不相同。触摸的精确度低得多，元素必须足够大以便用户进行选择。由于按键的大小，在移动设备上的键盘输入不仅更困难，而且在不同设备上可能不同。某些设备可能使用虚拟键盘，而另一些设备具有物理键盘。\n\
  \n移动 Web 开发人员面临的挑战不仅于此。但它们代表了为移动设备开发网站时面临的挑战类型。克服这些挑战往往来自于经验，无论是成功还是失败。`Visual Studio\
  \ 2012`、`.NET Framework` `4.5` 版本以及最新版本的 `ASP.NET MVC` 等工具绝对让这一切变得更容易。\n\n## 响应式设计与自适应设计\n\
  \n为移动浏览器设计网站不再是例外，而是常态。大多数成功的网站现在都对移动浏览器有显式支持。与大多数成为主流的技术或方案一样，围绕它们的术语数量可能会变得令人困惑。也许你听过如响应式设计、渐进式增强和自适应设计等术语。它们之间的区别是什么？\n\
  \n* **自适应设计（Adaptive design）**通常涵盖了各种技术，允许单个网页能够“适应”查看该页面的设备尺寸和方向。没有一种单一的技术被称为自适应设计。自适应设计是通过使用多种协同工作的技术实现的。**渐进式增强（Progressive\
  \ enhancement）**指的是一种设计实践，最初针对最低共同标准进行设计，然后根据客户端对这些功能的支持，“渐进式”地添加功能或样式。\n* **响应式设计（Responsive\
  \ design）**是自适应设计的一种。它整合了相关技术，允许网站根据渲染它的浏览器进行拉伸和重新排列。它还允许站点对浏览器尺寸和方向的实时变化做出响应。\n\
  \n这些术语通常结合使用。一个响应式设计的示例技术也可能是渐进式增强的示例，反之亦然。响应式设计使用的两种技术包括包含 `viewport` 元标签和利用 CSS\
  \ 媒体查询。使用 CSS 媒体查询也可以用于渐进式增强。\n\n### 修改 viewport\n\n当浏览器渲染网站时，它是在视口（viewport）中进行的。*视口*（viewport）简单来说就是查看网站的区域。当你使用移动浏览器浏览网站时，浏览器默认假设你正在桌面上查看网站。浏览器假设你想看到整个网站，而不是只是一个角。因此，它设置的视口宽度远大于物理屏幕宽度，导致显示整个网站的视口被挤进小屏幕中。为了演示这一点，创建一个名为\
  \ `HTMLMobile` 的 `ASP.NET` 空 Web 项目。然后通过右键点击项目并选择 Add ![image](img/Ar.jpg) New Item\
  \ 创建一个新的 HTML 页面并命名为 `default.html`。`default.html` 页面的内容如列表 27-1](#Chapter27.xhtml_listing27-1)（本章代码下载中的\
  \ `defaultbasic.html` 文件）。\n\n\n\n\n通过移动浏览器访问页面，可以很容易看到视口（viewport）的效果。图 27-1 显示了在移动浏览器中查看的`default.html`页面。\n\
  \n![image](img/f1004-01.jpg)\n\n**图 27-1**\n\n你可以看到，浏览器渲染页面的方式就像是在更大的屏幕上显示的一样，然后将其缩小以适应移动浏览器的屏幕。屏幕上的许多元素太小，无法阅读，更不用说交互了。要解决这个问题，你需要告诉浏览器使用与设备屏幕宽度相同的视口。你通过在\
  \ `head` 标签的开始标签和结束标签之间添加 `Viewport Meta` 标签来实现这一点。[代码清单 27-2（本章节代码下载中的 `defaultviewport.html`\
  \ 文件）显示了添加 Viewport Meta 标签后 `default.html` 文件的部分。\n\n图 27-2 显示了添加 Viewport Meta\
  \ 标签后在移动浏览器中显示的页面。\n\n很容易看出 Viewport Meta 标签起作用了。现在网站的内容更具可读性了。但你可以看到一个新问题开始出现。虽然内容并不很小，但页面的布局并不真正适合较小的屏幕。页面上的元素开始重叠。网站的比例是正确的，但现在布局需要对屏幕尺寸更具响应性。\n\
  \n![image](img/f1005-01.jpg)\n\n**图 27-2**\n\n### 使用 CSS 媒体查询\n\n强制浏览器根据屏幕尺寸缩放其内容只是第一步。但在大多数情况下，为大屏幕设计的布局可能并不适合小屏幕。如果页面的布局已设计为使用\
  \ CSS，则可以使用不同的 CSS 来更改布局。问题在于你如何告诉浏览器针对不同尺寸的屏幕使用不同的 CSS。答案是使用 CSS 媒体查询（media queries）。\n\
  \nCSS 媒体查询允许你针对特定的显示特征制定 CSS 规则。使用 CSS 规则针对“screen”（屏幕）和“print”（打印）等媒体类型自 HTML4\
  \ 和 CSS2 起就可用了。然而，媒体查询将此功能扩展到包含其他条件。媒体查询由一个媒体类型和零或多个检查特定媒体特征条件的表达式组成。你可以使用的某些媒体特征包括“width”（宽度）、“height”（高度）和“color”（颜色）。针对不同的屏幕尺寸时，最常用的是“width”。虽然可以使用其他条件，但典型的条件是\
  \ `min-width` 和 `max-width`。\n\n使用 CSS 媒体查询实现渐进增强（progressive enhancement）是可能的。并不总是能够采用渐进增强的实践。在某些情况下，特别是为现有网站添加移动端功能时，你的起点已经设定好了。但在示例中，你可以修改网站的布局，以默认的最小公约数（即移动浏览器）为目标。然后，使用\
  \ CSS 媒体查询，你可以添加额外的样式规则，为更适应的屏幕尺寸提供不同的布局。[代码清单 27-3 显示在本章节代码下载的 `defaultqueries.html`\
  \ 文件中，显示了更改以默认目标移动浏览器，然后是逐渐变大的屏幕后的样式块。\n\n对于前面的代码，第一组样式规则被作为针对移动浏览器的基础规则集应用。注意 `nav`\
  \ 和 `footer` 元素已更改，以指定文本居中，并且锚点元素的显示值为 `block`。`content` 和 `news` div 也删除了它们的浮动（float）值，从而使它们垂直堆叠而不是水平排列。在移动浏览器中，垂直排列的元素通常比水平排列更合适，因为水平空间有限的。\n\
  \n![image](img/f1006-01.jpg)\n\n**图 27-3**\n\n媒体查询定义了一个样式规则块，只有当媒体类型为 `screen` 且屏幕最小宽度为\
  \ `601px` 时才会应用。601px 到 900px 的屏幕宽度可以容纳许多平板设备。注意此块中的样式规则替换了许多从针对最小公约数（移动浏览器）的目标中移除的布局样式：\n\
  \n```\n@media screen and (min-width: 601px)\n```\n\n另一个媒体查询定义了一个样式规则块，只有当媒体类型为 `screen`\
  \ 且屏幕最小宽度为 `901px` 时才会应用。由于许多平板设备使用的屏幕宽度高达 900px，此块中定义的规则适应了更大的屏幕尺寸，例如桌面电脑。当应用接下来的媒体查询时，你只需菜单项和页脚文本改为左对齐。尽管这看起来是微不足道的，但它展示了多级渐进增强。\n\
  \n```\n@media screen and (min-width: 901px)\n```\n\n图 27-3 显示了在移动浏览器中显示的页面。作为对比，图\
  \ 27-4 显示了在桌面浏览器中显示的相同页面。\n\n![image](img/f1006-02.jpg)\n\n**图 27-4**\n\n## ASP.NET\
  \ 移动端应用程序\n\n针对移动设备调整 ASP.NET 应用程序需要在客户端和服务器端都进行更改。只选择其中一个可能无法提供完整的解决方案。这是一个广泛讨论的话题。有些人认为，无论从桌面还是移动设备查看，应用程序的内容应该是相同的。在这种情况下，当从移动设备查看内容时，唯一变化的是布局，可能是样式。这是一种响应式设计方法。另一些人认为，移动用户可能不需要看到相同的内容，或者至少不需要那么多。仅在客户端进行更改（如响应式设计中的更改）可以让应用程序更好地适应移动设备的尺寸。你的应用程序可以响应方向的变化。\n\
  \n在服务器端进行更改意味着要为移动设备提供专用页面。这可能会导致某些工作和代码的重复，但它允许对用户在桌面浏览器和移动浏览器中看到的内容进行最终控制。当采用更以服务器为中心的方法时，你必须将通用逻辑和功能封装到可以在不同版本之间共享的库中。\n\
  \n\n\n\n*   `MobileDeviceManufacturer`: 如果可用，返回设备制造商的名称。\n*   `MobileDeviceModel`:\
  \ 如果可用，返回设备的型号。\n*   `IsMobileDevice`: 虽然针对某些移动设备制造商和型号可能很有趣，但由于存在许多不同的移动设备，这些方法是不切行的。更有用的属性是\
  \ `IsMobileDevice`，它只需返回一个值，指示请求是否来自移动设备。\n\n### 提供移动端主页（Mobile Master Pages）\n\n\
  现在你已经有了检测请求页面的浏览器能力，可以利用它为移动浏览器提供特定的移动端页面。可能通过使用特定的移动端主页来处理移动页面与标准页面之间的差异。通过右键单击项目并选择添加\
  \ ![image](img/Ar.jpg) 新项，在应用程序根目录下创建一个新的主页。在“添加新建项”对话框中选择“主页”，并命名为 `MobileSite.Master`。你将创建一个用于移动设备的简化版标准主文件。代码列表\
  \ 27-4 显示了 `MobileSite.Master` 文件的 C# 版本代码。你可以在本章节代码下载中 `WebFormsMobileCS` 或 `WebFormsMobileVB`\
  \ 项目根目录下的 `MobileSite.Master` 文件中找到这些代码。\n\n在创建了主页简化移动版后，你必须指示任何在移动浏览器中显示的页面使用 `MobileSite.Master`\
  \ 主页。要做到这一点，请覆盖每个页面的 `Page_PreInit` 程序，并更改其设置使用的主页。你可以从修改项目中的默认页面开始，使其在用户于移动浏览器中查看时使用\
  \ `MobileSite.Master`。代码列表 27-5 显示了在重写 `Page_PreInit` 处理程序以便在移动设备上查看时更改主页后的默认页面后台代码。你可以在本章节代码下载中\
  \ `WebFormsMobileCS` 或 `WebFormsMobileVB` 项目根目录下的 `Default.aspx.cs` 和 `Default.aspx.vb`\
  \ 文件中找到该列表的代码。\n\n执行应用程序并在移动浏览器中查看，将产生如图 27-5 所示的结果。\n\n![image](img/f1009-01.jpg)\n\
  \n**FIGURE 27-5**\n\n### 创建移动端 Web 表单（Mobile Web Forms）\n\n你可能需要比修改主页所提供的更多的更改。例如，你可能需要更剧烈地更改提供给移动浏览器的内容。如果是这样，你可以提供一组专门为在移动浏览器中查看设计的并行页面。虽然这引入了一些代码重复，但它也提供了一组只有移动浏览器可以针对的专用页面。对于应用程序中可供移动浏览器访问的每个标准页面，你都构建一个移动端特定版本。要做到这一点，在应用程序根目录下创建一个名为\
  \ `Mobile` 的文件夹。然后在该文件夹中创建一个名为 `Default.aspx` 的新 Web 表单。该 Web 表单将是位于根目录下的标准默认 Web\
  \ 表单的移动端特定版本。为了保持示例易于管理，你不会包含任何样式或脚本，仅包含一些内容。新 `Default.aspx` 文件的 C# 版本内容显示在代码列表\
  \ 27-6 中（本章节代码下载中的 `/Mobile/Default.aspx` 文件）。\n\n如果你在创建的 `Mobile` 文件夹中复制所有标准 Web\
  \ 表单及其它们的相对文件夹，将使重定向移动浏览器变得简单得多。你只需要将对标准 Web 表单的首次请求重定向到 `Mobile` 文件夹中的对应 Web 表单。随后的请求将利用\
  \ `Mobile` 文件夹中的相对路径，不需要进一步的重定向。此外，如果你想让用户在移动浏览器上具有切换到应用程序标准桌面版本的能力，你只需提供一个指向标准版本\
  \ Web 表单的链接。再次，相对路径确保了随后的请求都保持在标准 Web 表单的文件夹结构中。\n\n移动浏览器到 `Mobile` 文件夹结构的初始重定向可以在浏览会话开始时发生。根据应用程序语言，在\
  \ `Global.asax.cs` 或 `Global.asax.vb` 文件中为 `Session_Start` 事件添加处理程序。代码列表 27-7 显示了\
  \ `Session_Start` 处理程序的代码。你可以在本章节代码下载中 `WebFormsMobileCS` 或 `WebFormsMobileVB` 项目根目录下的\
  \ `Global.asax.cs` 和 `Global.asax.vb` 代码文件中找到该列表的代码。\n\n如果你执行应用程序并浏览到站点根目录，你将看到\
  \ `Mobile` 文件夹中的新默认页面，而不是标准默认页面。图 27-6 显示移动浏览器被重定向到移动端特定的默认页面。\n\n![image](img/f1010-01.jpg)\n\
  \n**FIGURE 27-6**\n\n### ASP.NET Web Forms 中的友好 URL（Friendly URLs）\n\nASP.NET Web\
  \ 中的路由提供了一种为用户提供更容易记忆和理解的 URL 的方法。然而，创建路由和管理路由表可能需要一些时间来理解。一种名为 FriendlyUrls 的新功能让路由变得更简单，URL\
  \ 更加整洁。FriendlyUrls 包含在 Visual Studio 中，但也可以作为 NuGet 包用于 C# 项目。该 NuGet 包的名为 `Microsoft.AspNet.FriendlyUrls`。要在我们的\
  \ `WebFormsMobileCS` 项目安装该包，可以使用包管理器，它是 Visual Studio 默认安装的。通过 Visual Studio 菜单点击\
  \ ![image](img/Ar.jpg) 包管理器 ![image](img/Ar.jpg) 包管理器打开包管理器。在控制提示符处运行命令：\n\n```\n\
  Install-Package Microsoft.AspNet.FriendlyUrls\n```\n\n当安装 FriendlyUrls 包时，`RouteConfig.cs`\
  \ 文件将被添加到 `App_Start` 文件夹。你需要在 `Global.asax` 文件的 `Application_Start` 处理程序中添加一行代码。\n\
  \n```\nRouteConfig.RegisterRoutes();\n```\n\n现在如果你执行应用程序，无需指定扩展即可浏览任何 `.aspx` 页面。例如，为了浏览\
  \ `Contact.aspx` 页面，你只需在 URL 中指定 `Contact`，FriendlyUrls 就会寻找名为 `Contact.aspx` 的文件。图\
  \ 27-7 显示了通过指定 `Contact` 在移动浏览器中渲染的 `Contact.aspx` 页面。\n\n![image](img/f1011-01.jpg)\n\
  \n**FIGURE 27-7**\n\n使用 `FriendlyUrlSettings` 对象，你还可以指示 ASP.NET 自动从 URL 中删除扩展名。当你处理像\
  \ `WebFormsMobileCS` 这样的现有项目时，你不想遍历项目中的每个 Web 表单并修改每个链接和 URL 以删除 `.aspx` 扩展。你可以让\
  \ ASP.NET FriendlyUrls 为你完成。打开 `App_Start` 文件夹中的 `RouteConfig.cs` 文件。这是由 FriendlyUrls\
  \ NuGet 包添加的文件。将\n\n```csharp\nroutes.EnableFriendlyUrls();\n```\n\n更改为\n\n```csharp\n\
  FriendlyUrlSettings settings = new FriendlyUrlSettings();\n               settings.AutoRedirectMode\
  \ = RedirectMode.Permanent;\n               routes.EnableFriendlyUrls(settings);\n\
  ```\n\n进行此更改后，执行应用程序并浏览 `Contact.aspx` Web 表单。ASP.NET 将对 `/Contact.aspx` 的 GET 请求转换为到\
  \ `/Contact` 的 301 重定向。\n\n\n\n\n\n# ASP.NET MVC 4 移动应用程序\n\nASP.NET MVC (`MVC`)\
  \ 是一个用于构建基于 Web 应用程序的框架，具有良好的可扩展性和可测试性。它使用了成熟的模型-视图-控制器（Model-View-Controller）设计模式。在\
  \ MVC 3 中，引入了一系列功能以使移动 Web 开发变得更容易。即使有了这些功能，要在许多不同的移动浏览器和平台上提供一致的体验变得越来越困难。MVC 4\
  \ 增强并增加了最初在版本 3 中引入的功能。这些新增旨在让在更多设备和浏览器上开发一致的移动体验变得更加简单。\n\n## ASP.NET MVC 4 中的自适应渲染\n\
  \nMVC 框架版本 4 中的 Visual Studio 项目模板与版本 3 相比有许多变化，其中最显著的是整体视觉设计。即使你打算使用新模板提供的设计，更有趣的变化是包含了提供自适应渲染的元素。`viewport`\
  \ 元标签的使用和 CSS 媒体查询（Media Queries）使得这些新模板能够为你的页面提供更好的缩放，并针对较小的屏幕尺寸提供修改后的布局。图 27-8\
  \ 显示了移动浏览器中的默认 MVC 3 模板，图 27-9 显示了移动浏览器中的默认 MVC 4 模板。忽略模板设计不同的事实，这两个模板之间的缩放差异是显而易见的。MVC\
  \ 3 模板试图将页面渲染得像是在桌面浏览器中，并缩放至 Windows Phone 屏幕的大小。MVC 4 模板使用自适应渲染以更适合屏幕尺寸的比例渲染页面。你从这两幅图中无法看到的是，MVC\
  \ 4 模板还修改了页面布局，以便在较小的屏幕上更好地展示页面内容。\n\n![image](img/f1012-01.jpg)\n\n**图 27-8**\n\
  \n![image](img/f1012-02.jpg)\n\n**图 27-9**\n\n要查看这些新模板中提供的新自适应渲染元素，你可以创建一个 MVC 项目。首先，在\
  \ Visual Studio 中创建一个名为 `MvcMobile` 的新项目。选择 .NET 4.5 Framework 作为目标框架，以及 ASP.NET\
  \ MVC 4 Web Application 项目类型。由于在创建新的 MVC Web Application 时可用的模板很多，这是一个两步的过程。选择 ASP.NET\
  \ MVC 4 Web Application 不会立即创建 Web 应用程序。你必须选择所需的特定类型的 MVC 4 模板。选择 ASP.NET MVC 4\
  \ Web Application 后，会显示模板选择对话框。选择 Internet Application（Internet ）模板。图 27-10 显示了已进行正确选择的新建\
  \ ASP.NET MVC 4 项目对话框。\n\n![image](img/f1013-01.jpg)\n\n**图 27-10**\n\n### 使用 Viewport\
  \ 元标签\n\n如果你读过本章之前关于响应式设计的章节，你将熟悉 `viewport` 元标签，该标签用于指示浏览器在显示网页时考虑浏览器查看区域的物理尺寸。图\
  \ 27-10 所示的 Internet、Intranet 和移动应用程序模板都包含一个默认的 Layout 文件。Layout 文件已经包含了 `viewport`\
  \ 元标签。代码列表 27-8 显示了在使用 Internet Application 模板时包含在项目中的 C# 版本布局文件的部分。布局文件位于项目根目录下的\
  \ `\\Views\\Shared` 文件夹中。你可以在本章的代码下载文件 `_Layout.cshtml` 和 `_Layout.vbhtml` 中找到该代码列表的代码。\n\
  \n页面 `head` 部分的 `viewport` 元标签指示浏览器使用设备屏幕的宽度作为页面布局宽度：\n\n```\n<meta name=\"viewport\"\
  \ content=\"width=device-width\" />\n```\n\n### 使用 CSS 媒体查询\n\n本章响应式设计部分中涵盖的另一个概念是\
  \ CSS 媒体查询。CSS 媒体查询用于通过使用媒体特性（如宽度、高度和颜色）来限制样式表的作用范围。图 27-10 所示的 Internet、Intranet\
  \ 和移动应用程序模板还包含一个名为 `Site.css` 的默认 CSS 文件。该 CSS 文件包含许多默认样式规则，以及另一组被 CSS 媒体查询过滤或限制的样式规则。代码列表\
  \ 27-9（本章代码下载中的 `\\Content\\Site.css` 文件）显示了该 `Site.css` 文件的一部分。\n\n你使用 CSS 媒体查询提供一组根据浏览器屏幕宽度更改页面布局的样式规则。媒体查询规定，CSS\
  \ 文件中 `Mobile Styles` 部分包含的样式规则除非媒体类型为 `only screen` 且宽度小于或等于 850px，否则将不使用：\n\n\
  ```\n@media only screen and (max-width: 850px)\n```\n\n### 创建移动特定视图\n\n自适应渲染允许你在在各种条件下（包括较小屏幕）查看页面时，修改页面上\
  \ CSS 样式元素的缩放和布局。然而，你可能希望在移动浏览器查看页面时进行更彻底的更改。为了实现这一点，你为非移动浏览器提供一个视图，为移动浏览器提供另一个。在\
  \ MVC 4 之前，你必须使用浏览器嗅探（browser-sniffing）和 ViewEngine 来决定提供哪个视图。MVC 4 提供了新功能，允许你通过约定方法为移动设备提供视图。此功能适用于所有视图包括布局。要为视图提供移动版本，你只需使用命名约定\
  \ `[viewname].mobile.cshtml` 或 `[viewname].mobile.vbhtml` 创建文件。当 ASP.NET MVC 4 为移动浏览器服务时，它首先查找遵循此替代约定的文件。如果没有，它将退回到标准视图。\n\
  \n要构建移动视图，你可以右键单击 `Views/Home` 文件夹并选择 ![image](img/Ar.jpg) View，在该文件夹创建一个新视图。将视图命名为\
  \ `Index.mobile`。现在你可以在视图中创建仅在从移动浏览器请求时显示的内容。`Index.mobile` 视图如 代码列表 27-10 所示。\n\
  \n运行应用程序并在移动浏览器中查看时，将显示 Index 视图移动版本的内容，而在桌面浏览器中查看应用程序将显示标准 Index 视图的内容。图 27-11\
  \ 显示了桌面浏览器中显示的 Index 视图。图 27-12 显示了移动浏览器中相同的视图。你可以看到两个浏览器都指向同一个 URL，但显示的内容不同。\n\n\
  ![image](img/f1015-01.jpg)\n\n## 提供显示模式\n\n使用移动特定视图，你可以为任何移动浏览器发起请求时提供特定的视图和布局。但你可能需要更层次的定制，例如为特定浏览器或设备提供特定视图。例如，如果使用\
  \ iPhone 或 iPad 的人访问你的网站，你可能希望提供一种在该设备上样式更像原生应用程序的视图。\n\n\n\n\n\n如果你开发 Web 应用已经有一段时间了，你可能编写过样式或脚本为了某些功能在特定浏览器中正常工作。如果是这样，你就知道在单个页面中针对多个特定浏览器或平台是多么痛苦。ASP.NET\
  \ MVC 4 引入了一个名为 `Display Modes`（显示模式）的新功能，让针对特定浏览器或平台变得更容易。而且像 MVC 4 中的许多新功能一样，它使用了约定优于配置的方法。\n\
  \n创建一个新的显示模式涉及对你的视图使用特定的命名约定，并针对特定的触发条件进行浏览器嗅探（browser sniffing）。要查看演示，请创建一个当 iPhone\
  \ 浏览网站时显示的特定视图。为此，在 `Views\\Home` 文件夹中创建一个新视图并将其命名为 `Index.iphone`。然后在该视图中创建仅在从\
  \ iPhone 请求页面时显示的内容。`Index.iphone` 视图在列表 27-11 中给出（本章代码下载中的 `Views\\Home\\Index.iphone.cshtml`\
  \ 和 `Views\\Home\\Index.iphone.vbhtml` 文件）。\n\n现在，你需要为 `iphone` 后缀注册一个显示模式。你只需要注册一次显示模式，因此通常你在\
  \ `Global.asax` 的 `Application_Start` 事件处理器中执行此操作。在 `Global.asax` 文件中包含对 `System.Web.WebPages`\
  \ 命名空间的引用：\n\n**VB**\n\n```\nImports System.Web.WebPages\n```\n\n**C#**\n\n```sharp\n\
  using System.Web.WebPages;\n```\n\n现在你需要用 `DisplayModeProvider` 注册显示模式。在 iPhone\
  \ 的情况下，你想指定显示模式的条件是用户代理包含“iPhone”一词。列表 27-12 显示添加显示模式注册后的 `Global.asax` 文件。你可以在本章代码下载中\
  \ `MvcMobileCS` 和 `MvcMobileVB` 项目根目录下的 `Global.asax.cs` 和 `Global.asax.vb` 文件中找到代码。\n\
  \n新的显示模式插入 `Modes` 集合的顶部：\n\n```\nDisplayModeProvider.Instance.Modes.Insert\n```\n\
  \n新的显示模式也被赋予了一个名称。在这种情况下，它被称为“iphone”：\n\n```\nnew DefaultDisplayMode(\"iphone\"\
  )\n```\n\n显示模式的名称就是作为视图命名约定 `Index.iphone` 后缀使用的名称。你在这里可以使用任何你喜欢的名称。只需确保显示模式的名称与视图名称中使用的后缀匹配。\n\
  \n最后，你指定了调用显示模式必须满足的条件。在这种情况下，用户代理字符串中必须存在“iPhone”单词：\n\n```\ncontext.GetOverriddenUserAgent()\n\
  \       .IndexOf(\"iPhone\", StringComparison.OrdinalIgnoreCase) >= 0)\n```\n\n\
  现在当使用 iPhone 查看页面时，你将看到由 iPhone 特定视图指定的 iPhone 版本页面。图 27-13 显示了在 iPhone 上看到的 Index\
  \ 视图。\n\n### 引入 jQuery Mobile 和 ViewSwitcher\n\n一旦你开始开发专门为移动浏览器设计的视图，你可能希望在这些视图中包含移动特定的功能和客户端库。常见的移动\
  \ JavaScript 库之一是 `jQuery Mobile`。jQuery Mobile 是一个基于 `jQuery Core` 为移动设备构建 UI 的开源库。尽管\
  \ ASP.NET MVC 4 包含了许多帮助移动 Web 应用开发的功能，但 ASP.NET MVC 项目模板默认并不包含 jQuery Mobile（移动应用程序项目模板除外）。\n\
  \n![image](img/f1019-01.jpg)\n\n**图 27-13**\n\n如果你想在项目上安装 jQuery Mobile，可以使用 NuGet。有一个\
  \ NuGet 包用于在 ASP.NET MVC 项目中安装 jQuery Mobile。Visual Studio 2012 默认安装了 NuGet 包管理器。通过点击\
  \ Visual Studio 菜单中的工具 ![image](img/Ar.jpg) 库包管理器 ![image](img/Ar.jpg) 包管理器控制台来打开包管理器控制台。在控制台提示符处，运行命令\
  \ `Install-Package jQuery.Mobile.MVC`。\n\n`jQuery.Mobile.MVC` NuGet 包向项目添加了一些文件，包括\
  \ jQuery Mobile 所需的 CSS 和 JavaScript 文件。它还根据你选择的语言添加了移动特定的布局 `_Layout.Mobile.cshtml`\
  \ 或 `_Layout.Mobile.vbhtml`。此移动特定的布局包含了对所添加的 CSS 和 JavaScript 文件的包（bundles）引用。要创建这些包，你需要在\
  \ `Global.asax` 文件中包含一行代码。NuGet 包中包含一个提供该行代码的说明文件。你必须将该行代码添加到 `Application_Start`\
  \ 处理器。列表 27-13 提供了添加必要的代码（已加粗显示）后的 `Application_Start` 处理器。你可以在本章代码下载中 `MvcMobileCS`\
  \ 或 `MvcMobileVB` 项目根目录下的 `Global.asax.cs` 和 `Global.asax.vb` 文件找到此列表的代码。\n\n除了支持\
  \ jQuery Mobile 的文件，NuGet 包还为 `ViewSwitcher` 添加了控制器和部分视图。`ViewSwitcher` 允许用户在移动视图和桌面视图之间切换。你可能见过其他移动网站提供了查看桌面版本的方法。这就是\
  \ `ViewSwitcher` 为你做的。`ViewSwitcher` 部分视图包含在移动布局中：\n\n```\n@Html.Partial(\"_ViewSwitcher\"\
  )\n```\n\n`ViewSwitcher` 部分视图渲染了一个允许用户切换到桌面视图的链接。如果你希望用户能够回到移动视图，你也可以将此部分视图添加到标准布局文件中。列表\
  \ 27-14（代码 `Views\\Shared\\_ViewSwitcher.cshtml` 和 `Views\\Shared\\_ViewSwitcher.vbhtml`）显示了\
  \ `ViewSwitcher` 部分视图。\n\n`ViewSwitcher` 仅当请求来自移动浏览器时可见：\n\n```\n@if (Request.Browser.IsMobileDevice\
  \ && Request.HttpMethod == \"GET\")\n```\n\n如果请求来自移动浏览器，则调用 `GetOverriddenBrowser`\
  \ 方法判断浏览器类型是否被覆盖。根据响应，显示一个在移动和标准视图之间切换的链接：\n\n```\n@if (ViewContext.HttpContext.GetOverriddenBrowser().IsMobileDevice)\n\
  ```\n\n`ActionLink` 引用了由 jQuery Mobile NuGet 包添加的 `ViewSwitcher` 控制器的 `SwitchView`\
  \ 方法。列表 27-15（文件 `Controllers\\ViewSwitcherController.cs` 和 `Controllers\\ViewSwitcherController.vb`）显示了\
  \ `ViewSwitcher` 控制器。\n\n图 27-14 显示了添加 `jQuery.Mobile.MVC` NuGet 包后在移动浏览器中查看的应用程序。\n\
  \n### 使用移动应用程序项目模板\n\n到目前为止介绍的所有 MVC 4 功能都以某种方式涉及桌面和移动浏览器。但如果你只想构建一个纯粹的移动 Web 应用呢？如果你对提供桌面浏览体验不感兴趣呢？ASP.NET\
  \ MVC 4 提供了一个直接针对移动设备的项目模板——移动应用程序项目模板。你可以在新建 ASP.NET MVC 4 项目对话框中看到移动应用程序项目模板，如图\
  \ 27-10](#Chapter27.xhtml_figure27-10) 所示。\n\n\n\n\n\n当你使用“移动应用程序”（Mobile Application）项目模板创建一个项目时，你会发现项目的整体结构与其他项目模板相同。你仍然拥有相同的视图（views）、控制器（controllers）和模型（models）。然而，如果你查看视图的内容，你会发现它们是专门为移动浏览器构建的。默认包含了\
  \ `jQuery Mobile` 并在所有视图中实现了它。所有的默认页面元素都是专门为移动设备设计的，并指定了 `jQuery Mobile` 使用的 `data-`\
  \ 属性。图 27-15 显示了在移动浏览器中查看使用移动应用程序项目模板构建的应用程序。\n\n## 测试你的移动应用程序\n\n通过在桌面上浏览移动网站并减小浏览器窗口，可以测试移动网站的某些方面。然而，要真正测试移动网站，你需要在移动设备上查看。除非你拥有每一个想要测试的设备，否则你将需要其他方法来测试你的移动站点。不使用实际设备进行测试的两种常用方法是：使用允许你更改\
  \ HTTP 头部信息的浏览器以及模拟器。\n\n![image](img/f1022-02.jpg)\n\nFIGURE 27-15\n\n如 Mozilla\
  \ Firefox 和 Google Chrome 等浏览器有多个扩展程序可用，可以使用它们来修改请求中的 HTTP 头部信息。通过修改浏览器请求中的这些信息，你可以欺骗\
  \ Web 服务器，认为请求来自移动设备。\n\n测试移动站点的另一种方法是使用你尝试测试的特定设备的模拟器。你可以通过安装 Windows Phone SDK\
  \ 来安装 Windows Phone 模拟器。在编写本文时，Windows Phone 8 SDK 需要 `Hyper-V` 和 64 位的 Windows\
  \ 8 专业版。如果你没有硬件支持运行 Windows Phone 8 模拟器，你仍然可以安装 Windows Phone SDK 7.1。虽然它不是模拟器的最新版本，但它仍然让你能够在运行在\
  \ Windows Phone 7 或 7.5  `IE9` 上测试你的站点。\n\n用于测试移动网站的另外两个流行设备是 Apple 的 iPhone 和 iPad\
  \ 设备。Electric Plum 在其 Electric Mobile Studio 的一部分提供了 iPhone 和 iPad 模拟器。它已与微软合作，将\
  \ iPhone 和 iPad 模拟器作为 `WebMatrix` 第 2 版本的扩展提供，`WebMatrix` 是微软开发的一款免费轻量级 Web 开发工具。这些模拟器也可以作为\
  \ Visual Studio 2012 扩展可用。通过在 Visual Studio 2012 中安装 Electric Mobile Studio 扩展，iPad\
  \ 和 iPhone 模拟器将出现在 Visual Studio 的“通过...浏览”（Browse With. . . .）选项中。图 27-16 显示了安装\
  \ Electric Mobile Studio 扩展后显示的“通过...浏览”（Browse With. . . .）下拉菜单。\n\n![image](img/f1023-01.jpg)\n\
  \nFIGURE 27-16\n\n## 总结\n\n开发者自 20 世纪 90 年代后期就开始构建移动网站。随着移动设备的普及和使用不断增加，对兼容移动设备的站点的需求也在增加。\n\
  \n尽管开发者在构建移动网站方面花费了很长时间，但挑战仍然如故。构建移动网站需要不同的设计决策和考虑。有许多可用选择，从单个网站的自适应设计到直接针对移动设备的并行网站或页面。\n\
  \n诸如 Visual Studio 2012 等工具以及 `ASP.NET MVC` 最新版本中的可用功能，使得开发移动站点的任务变得简单得多。通过使用浏览器扩展、模拟器和仿真器，测试这些移动站点也变得更加简单。\n\
  \n你再也没有理由避免构建设计为既可在桌面也可在移动设备查看的站点了。\n\n# 第八部分：应用程序配置与部署\n\n* 第 28 章：配置\n* 第 29 章：调试与错误处理\n\
  * 第 30 章：模块与处理器\n* 第 31 章：异步通信\n* 第 32 章：构建全局应用程序\n* 第 33 章：打包与部署 ASP.NET 应用程序\n\
  \n# 28：配置\n\n## 本章包含什么？\n\n* 介绍 `ASP.NET` 配置文件\n* 理解 `ASP.NET` 配置设置\n* 加密配置文件的部分内容\n\
  * 检查 `ASP.NET` 配置 API\n* 存储和检索敏感信息\n* 在构建过程中更新配置设置\n* 整合并压缩脚本及 CSS 样式\n\n## 本章的\
  \ WROX.COM 代码下载\n\n请注意，本章所有的代码示例都可以作为本章代码下载的一部分位于书籍网站 [`www.wrox.com`](http://www.wrox.com)\
  \ 的“下载代码”标签页。\n\n`ASP.NET` 使用基于 XML 文件的配置系统，该系统灵活、可访问且易用。XML 配置文件允许管理员（即在构建和部署后负责\
  \ Web 应用程序的人员）通过直接处理各种配置文件或使用反过来与配置文件交互的 GUI 工具，非常轻松地配置 `ASP.NET` 应用程序。在附录 D 详细检查各种基于\
  \ GUI 的工具之前，本章将首先深入查看如何直接通过配置文件工作。\n\n深入研究 `ASP.NET` 配置的旅程从 `ASP.NET` 配置概述开始。\n\n\
  ## 配置概述\n\n`ASP.NET` 配置以层次方式存储在两个主要的 XML 文件中。XML 用于描述 `ASP.NET` 应用程序各个方面的属性和行为。\n\
  \n`ASP.NET` 配置系统支持两种类型的配置文件：\n\n* 服务器或机级配置文件，例如 `machine.config` 文件\n* 应用程序配置文件，例如\
  \ `web.config` 文件\n\n由于配置文件基于 XML，因此描述配置的元素是大小敏感的。此外，`ASP.NET` 配置系统遵循驼峰命名法（camel-casing）。例如，如果你查看列表\
  \ 28-1 中的会话状态示例，可以看到处理会话状态的 XML 元素显示为 `<sessionState>`。\n\n使用 XML 配置文件而不是二进制数据库的优势包括：\n\
  \n* 配置信息人类可读，可以使用记事本等文本编辑器进行修改，尽管建议使用 `Visual Studio 2012` 或另一个感知 XML 的编辑器。与二进制数据库不同，基于\
  \ XML 的配置文件可以像任何简单文件一样从一个服务器复制到另一个服务器。这在 Web 集场景下非常有用。\n* 当更改中的某些设置时，`ASP.NET` 会自动检测到更改并将其应用于运行中的\
  \ `ASP.NET` 应用程序。`ASP.NET` 通过创建新的 `ASP.NET` 应用程序实例并将终端用户的所有后续请求发送到此新应用程序实例来实现这一点。\n\
  * 配置更改无需管理员停止和启动 Web 服务器即可应用于 `ASP.NET` 应用程序。更改对终端用户是完全透明的。\n* `ASP.NET` 配置系统是可的。\n\
  * 可以非常地存储和检索应用程序特定的信息。\n* 存储在 `ASP.NET` 配置系统中的敏感信息可以选择进行加密以防窥探。\n\n\n\n\n\n# 服务器配置文件\n\
  \n每个 ASP.NET 服务器安装都包含一系列配置文件，例如 `machine.config` 文件。该文件作为默认 .NET Framework 安装的一部分被安装。你可以在\
  \ `C:\\Windows\\Microsoft.NET\\Framework\\v4.0.30319\\CONFIG` 目录下找到 `machine.config`\
  \ 以及其他特定于服务器配置文件。它们代表了服务器上安装的所有 ASP.NET Web 应用程序所使用的默认设置。\n\n某些服务器范围的配置文件包括以下：\n\
  \n* `legacy.web_hightrust.config`\n* `legacy.web_hightrust.config.default`\n* `legacy.web_lowtrust.config`\n\
  * `legacy.web_lowtrust.config.default`\n* `legacy.web_mediumtrust.config`\n* `legacy.web_mediumtrust.config.default`\n\
  * `legacy.web_minimaltrust.config`\n* `legacy.web_minimaltrust.config.default`\n\
  * `machine.config`\n* `machine.config.comments`\n* `machine.config.default`\n* `web.config`\n\
  * `web.config.comments`\n* `web.config.default`\n* `web_hightrust.config`\n* `web_hightrust.config.default`\n\
  * `web_lowtrust.config`\n* `web_lowtrust.config.default`\n* `web_mediumtrust.config`\n\
  * `web_mediumtrust.config.default`\n* `web_minimaltrust.config`\n* `web_minimaltrust.config.default`\n\
  \n系统范围的配置文件 `machine.config` 用于为机器上的所有应用程序配置通用的 .NET Framework 设置。原则上来说，除非你清楚自己在做什么，否则编辑或操纵\
  \ `machine.config` 文件并不是一个好主意。对该文件的更改可能会影响你计算机上的所有应用程序（Windows、Web 等）。\n\n除了 `machine.config`\
  \ 文件外，.NET Framework 安装程序还会安装另外两个名为 `machine.config.default` 和 `machine.config.comments`\
  \ 的文件。`machine.config.default` 文件作为 `machine.config` 文件的备份。如果你想将 `machine.config`\
  \ 恢复到出厂设置，只需将设置从 `machine.config.default` 复制到 `machine.config` 文件即可。\n\n`machine.config.comments`\
  \ 文件包含每个配置节的描述，以及针对最常用值的显式设置。`machine.config.default` 和 `machine.config.comments`\
  \ 文件不被 .NET Framework 运行时使用；安装它们是为了在你想要恢复到默认出厂设置和默认值时使用。\n\n你会在与 `machine.config`\
  \ 相同的 `CONFIG` 文件夹中找到根级别的 `web.config` 文件。在对服务器范围范围进行更改时，你应该始终尝试在根 `web.config`\
  \ 文件中进行这些更改，而不是在 `machine.config` 文件中。你会发现 `web.config` 文件也存在类似于 `machine.config.comments`\
  \ 和 `machine.config.default` 文件（即 `web.config.comments` 和 `web.config.default`）。\n\
  \n默认情况下，你的 ASP.NET Web 应用程序在完全信任设置下运行。你可以通过查看根 `web.config` 文件中的 `<securityPolicy>`\
  \ 和 `<trust>` 部分来查看此设置。列表 28-2 展示了这些节。\n\n其他策略文件定义在特定的信任级别上。这些级别决定了 ASP.NET 允许的代码访问安全\
  \ (CAS)。要更改 ASP.NET 应用程序在服务器上运行的信任级别，你只需更改文档或应用程序实例的 `web.config` 文件中的 `<trust>`\
  \ 元素。例如，你可以使用 列表 28-3 所示的代码更改到中等信任级别。\n\n在这种情况下，此代码不仅强制使用 `web_mediumtrust.config`\
  \ 文件，而且（通过将 `allowOverride` 属性设置为 `false`）还强制将此信任级别应用到服务器上的每个 ASP.NET 应用程序上。单个应用程序实例无法通过在其本地的\
  \ `web.config` 文件中覆盖来更改此设置，因为该设置位于根级别的 `web.config` 文件中。\n\n如果你查看各种信任级别配置文件（例如 `web_mediumtrust.config`\
  \ 文件），请注意它们定义了你可以通过代码操作执行的种类操作。例如，`web_hightrust.config` 文件允许对服务器上的任何点进行开放 FileIO\
  \ 访问，如 列表 28-4 所示。\n\n然而，如果你查看中等信任的 `web.config` 文件 (`web_mediumtrust.config`)，你会发现该配置文件将\
  \ ASP.NET 限制在应用程序目录内的 FileIO 操作。列表 28-5 展示了此定义。\n\n了解你可以在何种信任级别下运行 ASP.NET 应用程序并更改\
  \ `<trust>` 部分以启用适当的 CAS 始终是一个好主意。\n\n# 应用程序配置文件\n\n与 `machine.config` 文件不同，几乎所有的\
  \ ASP.NET 应用程序都有存储在 `web.config` 文件中的配置设置副本。如果 Web 应用程序跨越多个子文件夹，每个子文件夹都可以有自己的 `web.config`，并继承或覆盖父级设置。要使用这些新设置更新农场中的服务器，你只需将此\
  \ `web.config` 文件复制到相应的目录中。ASP.NET 会处理其余工作——不需要重启服务器——你的应用程序将继续正常运行，只是它现在使用了在配置文件中应用的新设置。\n\
  \n# 应用配置设置\n\n当 ASP.NET 运行时为特定请求应用配置设置时，`machine.config`（以及任何 `web.config` 文件的配置信息）会被合并成一个单元，然后应用到应用程序。配置设置继承自任何父\
  \ `web.config` 或 `machine.config`（后者是根配置文件）。图 28-1 展示了此示例。\n\n![image](img/f1032-01.jpg)\n\
  \n**图 28-1：配置设置层级结构**\n\n每个 Web 应用程序的配置都是唯一的；但设置是从父级继承的。例如，如果你网站根目录下的 `web.config`\
  \ 文件定义了 10 分钟的会话超时，那么该特定设置将覆盖继承自 `machine.config` 或根 `web.config` 文件的默认 ASP.NET\
  \ 设置。子目录中的 `web.config` 文件可以覆盖或继承这些设置（例如 10 分钟的超时）。\n\n注意，这些继承/覆盖规则可以通过之前 列表 28-3\
  \ 中所示的 `allowOverride=\"false\"` 机制进行阻止。\n\n# 检测配置文件更改\n\nASP.NET 会自动检测配置文件（如 `machine.config`\
  \ 或 `web.config`）是否发生更改。此逻辑基于监听操作系统提供的文件更改通知事件来实现。\n\n当 ASP.NET 应用程序启动时，配置设置将被读取并存储在\
  \ ASP.NET 缓存中。随后会在 `machine.config` 和/或 `web.config` 配置文件的项上放置文件依赖。当检测到 `machine.config`\
  \ 文件更新时，ASP.NET 会创建一个新的应用程序域来处理新请求。旧的应用程序域在完成所有待处理请求后将被销毁。\n\n# 配置文件格式\n\n`machine.config`\
  \ 和 `web.config` 除了文件名之外，它们的架构是相同的。配置文件分为多个组。配置文件的根 XML 元素命名为 `<configuration>`。此伪\
  \ `web.config` 文件有一个控制 ASP.NET 的节，如 列表 28-6 所示。\n\n\n\n\nXML 配置文件的根元素始终是 `<configuration>`。每个节处理程序和设置都可以可选地封装在\
  \ `<sectionGroup>` 中。`<sectionGroup>` 在配置文件中提供了一种组织功能。它允许你将配置组织成唯一的组——例如，`<system.web>`\
  \ 节组被用于识别配置文件中特定于 ASP.NET 的区域。\n\n`<configSections>` 节是与每个配置节相关的配置节处理程序分组的机制。当你想要创建自己的节处理程序时，必须在\
  \ `<configSections>` 节中声明它们。`<httpModules>` 节有一个被设置为 `System.Web.Caching.HttpModulesSection`\
  \ 的配置处理程序，而 `<sessionState>` 节有一个被设置为 `System.Web.SessionState.SessionStateSection`\
  \ 类的配置处理程序，如代码列表 28-7 所示。\n\n# 常用配置设置\n\nASP.NET 应用程序依赖于一些常用配置设置。这些设置适用于 `web.config`\
  \ 和 `machine.config` 文件。在本节中，你将查看其中一些常用配置设置。\n\n## 连接字符串\n\n在非常早期的 ASP.NET 版本中，所有的连接字符串信息都存储在\
  \ `<appSettings>` 节中。ASP.NET 最新版本包含一个名为 `<connectionStrings>` 的节，存储各种连接字符串信息。尽管在\
  \ `appSettings` 中存储连接字符串可以正常工作，但它带来了以下挑战：\n\n* 当连接字符串存储在 `appSettings` 节时，像 `SqlCacheDependency`\
  \ 或 `MembershipProvider` 等数据感知控件无法发现这些信息。\n* 使用加密算法保护连接字符串是一个挑战。\n* 最后，但同样重要的是，此功能不仅适用于\
  \ ASP.NET；它还适用于所有的 .NET 类型，包括 Windows Forms、Web 服务等。\n\n由于连接字符串信息是独立于 `appSettings`\
  \ 节存储的，因此可以使用强类型集合方法 `ConnectionStrings` 进行检索。代码列表 28-8 给出了如何存储连接字符串的示例。\n\n代码列表\
  \ 28-9 显示了如何在代码中检索连接字符串（`ExampleConnection`）。\n\n这种构造具有强大的功能。你不需要在 ASP.NET 应用程序的每个页面中硬编码连接字符串，而是可以中心存储一个连接字符串实例（例如在\
  \ `web.config` 文件中）。现在，如果你必须对此连接字符串进行更改，你只需要在一个地方进行更改，而不是在多个地方更改。\n\n## 配置会话状态\n\
  \n由于 Web 应用程序使用无状态的 HTTP 协议，你必须可以将持久的地方存储应用程序特定状态或用户特定状态。`Session` 对象是持久化用户特定信息的常用存储区。会话存储器实现为\
  \ `Hashtable`，并根据键值对组合存储数据。\n\nASP.NET 能够将会话存储数据持久化在 `InProc`、`StateServer`、`SqlServer`\
  \ 或 `Custom` 中。`Custom` 设置为开发者提供了会话状态如何持久化到永久存储器中的更多控制。例如，ASP.NET 原生不支持在非 Microsoft\
  \ 数据库（如 Oracle）或 NoSQL 数据库（如 MongoDB）上存储会话数据。如果你想将会话数据存储在这些数据库或 XML 文件等自定义存储中，可以通过编写自定义提供程序类来实现。（请参见本章稍后的“自定义状态存储器”部分，或参考第\
  \ 21 章了解更多关于 ASP.NET 4.5 中的会话状态功能。）\n\n你可以使用代码列表 28-10 所示的 `<sessionState>` 元素配置会话信息。\n\
  \n以下列表描述了上述代码中 `<sessionState>`元素的属性：\n\n* `mode`: 指定是否应该持久化会话信息。`mode` 设置支持五个选项：`Off`、`InProc`、`StateServer`、`SQLServer`\
  \ 和 `Custom`。默认选项是 `InProc`。\n* `cookieless`: 指定是否支持无 Cookie Session 密钥管理。\n* `timeout`:\
  \ 指定 `Session` 的生命周期。`timeout` 值是一个滑动值；在每次请求时，超时时间都会重置为当前时间加上超时值。例如，如果 `timeout`\
  \ 值为 20 分钟，且在上午 10:10 接收到请求，则会在上午 10:30 时。\n* `stateConnectionString`: 当 `mode`\
  \ 设置为 `StateServer` 时，此设置用于标识与提供状态管理的 Windows 服务通信的 TCP/IP 地址和端口。\n* `stateNetworkTimeout`:\
  \ 指定在尝试向 `StateServer` 等进程外会话存储器中存储状态时的超时值（秒）。\n* `sqlConnectionString`: 当 `mode`\
  \ 设置为 `SQLServer` 时，此设置用于连接到 SQL Server 数据库以存储和检索会话数据。\n\n### Web 集群支持\n\n作为一个组运行的多个\
  \ Web 服务器被称为*Web 集群（web farm）*。如果你想将 ASP.NET 应用程序扩展到 Web 集群内的多台服务器，ASP.NET 原生支持这种部署。然而，会话数据需要持久化在进程外会话状态中，如\
  \ `StateServer` 或 `SQLServer`。\n\n### 状态服务器\n\n`StateServer` 和 `SQLServer` 都支持进程外会话。然而，`StateServer`\
  \ 将所有信息存储在 Windows 服务中，该服务在内存中存储数据。使用此选项，如果托管状态的服务器宕，所有访问网站的 ASP.NET 客户端都将失败；没有办法恢复会话数据。\n\
  \n如果你使用的是 Windows 7，可以通过选择“开始 > 控制面板 > 系统和安全 > 管理工具 > 服务”中的服务窗口配置会话状态。在 Windows\
  \ 8 中，你可以在搜索选项卡并选择本地服务（如图 28-2 所示）。\n\n或者，你可以通过命令行并输入 `net start` 命令来启动会话服务：\n\n\
  ```\nC:\\Windows\\Microsoft.NET\\Framework\\v4.0.30319> net start aspnet_state\n\
  ```\n\n### SQL Server\n\n当你选择 `SQLServer` 选项时，会话数据存储在 Microsoft SQL Server 数据库中。即使\
  \ SQL Server 宕机，内置的 SQL Server 恢复功能也能让你恢复所有会话数据。配置 ASP.NET 支持 SQL 与配置 Windows 服务一样简单。区别在于你需要运行随\
  \ ASP.NET 提供的 T-SQL 脚本 `InstallSqlState.sql`。卸载 ASP.NET SQL Server 支持的 T-SQL 脚本名为\
  \ `UninstallSqlState.sql`。包含这些脚本在 Framework 文件夹中可用。代码列表 28-11 显示了使用 SQL Server 选项的示例。\n\
  \nASP.NET 通过存储过程访问存储在 SQL Server 中的会话数据。默认情况下，所有会话数据存储在 TempDB 数据库中。然而，你可以修改存储过程，以便它们存储在\
  \ TempDB 以外的正式数据库表中。\n\n\n\n\n\n由于连接字符串存储在强类型模式中，因此可以在配置文件的其他部分引用连接字符串信息。例如，在配置将会话状态存储在\
  \ SQL Server 时，你可以在 `<connectionStrings>` 部分指定连接字符串，然后在 `<sessionState>` 元素中指定连接字符串的名称，如列表\
  \ 28-12 所示。\n\n## 自定义状态存储\n\nASP.NET 4.5 中的会话状态基于插件式架构，具有多个继承自 `SessionStateStoreProviderBase`\
  \ 类的不同提供程序。如果你想创建自己的自定义提供程序或使用第三方提供程序，则必须将模式设置为 `Custom`。\n\n你需要指定继承自 `SessionStateStoreProviderBase`\
  \ 类的自定义提供程序程序集，如列表 28-13 所示。\n\n在上一个示例中，你将会话状态模式配置为 `Custom`，因为你将提供程序名称指定为 `CustomStateProvider`。从那里，你添加了提供程序元素，并包含了带有命名空间和类名的提供程序类型。\n\
  \n## 编译配置\n\nASP.NET 支持 ASP.NET 页面、Web 服务、HttpHandlers、ASP.NET 应用程序文件（如 `Global.asax`\
  \ 文件）、源文件等的动态编译。当这些文件首次被 ASP.NET 应用程序需要时，它们会自动按需进行编译。\n\n对动态编译文件的任何更改都会导致所有影响的资源自动失效并重新编译。该系统允许开发人员以最小的进程开销快速开发应用程序，因为他们只需点击“保存”，即可使代码更改在应用程序中生效。\n\
  \n你可以使用 `web.config` 或 `machine.config` 文件中的 `<compilation>` 部分来配置 ASP.NET 编译设置。ASP.NET\
  \ 引擎会在需要时编译页面，并将生成的代码保存在代码缓存中。执行 ASP.NET 页面时会使用这些缓存代码。列表 28-14 显示了 `<compilation>`\
  \ 部分的语法。\n\n现在让我们详细查看这些 `<compilation>` 属性：\n\n*   `batch`：指定是否支持批编译。默认值为 `true`。\n\
  *   `maxBatchSize`：指定可以编译到单个批次的最大页面/类数量。默认值为 1000。\n*   `maxBatchGeneratedFileSize`：指定批程序集编译的最大输出大小。默认值为\
  \ 1000KB。\n*   `batchTimeout`：指定授予批编译发生的时间（分钟）。如果超时到期且未完成编译，则会抛出异常。默认值为 15 分钟。\n\
  *   `optimizeCompilations`：指定动态编译是编译整个站点还是仅编译已更改的项目。当设置为 `false`（默认值）时，当顶层文件更改时，整个站点将重新编译；设置为\
  \ `true` 则仅重新编译已更改的文件。\n*   `debug`：指定编译生产环境程序集还是调试程序集。默认值为 `false`。\n*   `defaultLanguage`：指定在动态编译文件中使用的默认编程语言，如\
  \ `VB` 或 `C#`。语言名称使用 `<compiler>` 子元素定义。默认值为 `VB`。\n*   `explicit`：指定 Microsoft\
  \ Visual Basic 代码编译选项是否为显式。默认值为 `true`。\n*   `numRecompilesBeforeAppRestart`：指定在应用程序重启之前可以发生的资源动态重新编译次数。\n\
  *   `strict`：指定 Visual Basic 严格编译选项的设置。\n*   `urlLinePragmas`：指示编译器应使用 URL 而不是物理路径（这是默认行为）。\n\
  *   `tempDirectory`：指定编译期间用于临时文件存储的目录。默认情况下，ASP.NET 在 `[WinNT\\Windows]\\Microsoft.NET\\\
  Framework[version]\\Temporary ASP.NET Files` 文件夹中创建临时文件。\n*   `assemblies`：指定在编译过程中使用的程序集。\n\
  *   `codeSubDirectories`：指定一个包含运行时编译文件的子目录有序集合。添加 `codeSubDirectories` 部分将创建单独的程序集。\n\
  *   `buildproviders`：指定用于编译自定义资源文件的构建提供程序集合。\n*   `folderLevelBuildProviders`：指定用于编译特定文件夹中自定义资源文件的构建提供程序集合。\n\
  *   `expressionBuilders`：指定在编译过程中利用的资源字符串集合。\n\n## 自定义错误\n\n当 ASP.NET 应用程序失败时，ASP.NET\
  \ 页面可以显示默认错误页面，并包含错误的源代码和行号。然而，这种方法存在一些问题：\n\n*   源代码和错误信息对于经验较少的终端用户来说可能没有任何意义。\n\
  *   如果向黑客显示相同的源代码和错误信息，可能会导致后续损害。\n\n显示过多的错误信息可能会提供重要的实现细节，在大多数情况下，你希望对公众隐藏这些细节。图\
  \ 28-3 显示了一个示例。\n\n![image](img/f1040-01.jpg)\n\n**图 28-3**\n\n然而，ASP.NET 提供了极佳的基础来防止此类错误信息。`<customErrors>`\
  \ 部分提供了在 ASP.NET 应用程序中定义自定义错误消息的方法。语法如下：\n\n```xml\n<customErrors defaultRedirect=\"\
  [url]\" mode=\"[on/off/remote]\">\n    <error statusCode=\"[statuscode]\" redirect=\"\
  [url]\" />\n</customErrors>\n```\n\n\n\n\n要实现 Windows 身份验证，你需要使用 IIS 配置相应的网站或虚拟目录。然后你可以使用\
  \ `<authentication>`元素将 Web 应用程序或虚拟目录标记为 Windows 身份验证。Listing 28-15 展示了这一过程。\n\n\
  ## 表单验证 (Forms Authentication)\n\n表单验证是一种广泛使用的身份验证机制。要配置表单验证，你需要使用 `<authentication>`\
  \ 部分以及其中的 `<forms>` 子节。Listing 28-16 显示了配置文件中处理表单验证的 `<authentication>` 部分的结构。\n\
  \n以下列表详细列出了每个属性：\n\n* `name`: 指定 HTTP 身份验证票据（ticket）的名称。默认值为 `.ASPXAUTH`。\n* `loginUrl`:\
  \ 如果当前请求没有有效的身份验证票据，则将请求重定向到的 URL。\n* `protection`: 指定用于保护 cookie 对应的方法。有效值为 `All,\
  \ None, Encryption` 和 `Validation`。\n    * `Encryption`: 指定在配置文件中使用 `TripleDES`\
  \ 或 `DES` 加密算法对 cookie 内容进行加密。但是，对 cookie 不进行数据验证。\n    * `Validation`: 指定 cookie\
  \ 内容不加密，但会验证 cookie 数据在传输过程中未被更改。\n    * `All`: 指定同时使用数据验证和加密来保护 cookie 内容。根据 `<machineKey>`\
  \ 元素使用配置的数据验证算法，并使用 Triple DES 进行加密。默认值为 `All`，表示提供的最高保护级别。\n    * `None`: 指定不对\
  \ cookie 应用任何保护机制。不存储任何敏感信息且可能使用 cookie 进行个性化的 Web 应用程序可以考虑此选项。当指定 `None` 时，加密和验证均禁用。\n\
  * `timeout`: 指定以分钟为单位的 cookie 过时间。`timeout`属性是一个滑动值，从收到最后一个请求开始 *n* 分钟后过期。默认值为 30\
  \ 分钟。\n* `path`: 指定用于发布 cookie 的路径。默认值为 `/`，以避免路径大小写敏感带来的困难。\n* `requireSSL`: 指定表单验证是否在安全的\
  \ HTTPS 连接中进行。\n* `slidingExpiration`: 指定在使用时是否应定期更新有效的 cookie。当此选项设置为 `false` 时，票据仅在颁发有效期内有效，用户即使在活动话期间也必须重新身份验证。\n\
  * `cookieless`: 指定是否支持无 cookie 身份验证。支持的值 `UseCookies, UseUri, Auto` 和 `UseDeviceProfile`。默认值为\
  \ `UseDeviceProfile`。\n* `defaultUrl`: 指定登录控件用于控制身份验证后重定向的默认 URL。\n* `enableCrossAppRedirects:`\
  \ 设置为 `true` 时，允许重定向到当前应用程序之外的 URL。\n* `domain`: 指定附加到身份验证 cookie 中的域名字符串。当同一个身份验证\
  \ cookie 在跨域的多个站点之间共享时，此属性特别有用。\n* `ticketCompatibilityMode`: 默认情况下，`Framework20`\
  \ 设置使用本地时间作为票据过期日期，而设置为 `Framework40` 则将使用 UTC。\n\n## 匿名身份 (Anonymous Identity)\n\
  \n许多应用程序类型都需要与匿名用户协作的能力，尽管对于电子商务 Web 应用程序而言尤其如此。在这种情况下，你的站点必须*同时*支持匿名用户和经过身份验证的用户。当匿名用户浏览网站并将商品添加到购物车时，Web\
  \ 应用程序需要一种方法来唯一标识这些用户。例如，如果你查看如 `Amazon.com` 或 `BN.com` 等繁忙的电子商务网站，它们并没有“匿名用户”的概念。相反，这些站点为每个用户分配了一个唯一的身份。\n\
  \n在 ASP.NET 的早期版本中，没有开箱即用的功能允许开发者实现这种用户识别。大多数开发者使用 `SessionID` 来唯一标识用户。他们经历了这种方法固有的几个陷阱。后来，ASP.NET\
  \ 包含了使用配置文件中的 `<anonymousIdentification>` 部分的匿名身份支持。Listing 28-17 显示了 `<anonymousIdentification>`\
  \ 配置部分的设置。\n\n`<anonymousIdentification>` 部分中的 `enabled` 属性指定了 ASP.NET 的匿名访问能力是否启用。其他属性与\
  \ Listing 28-16 中的 `<authentication>` 部分相似。当你使用匿名身份识别时，存在终端用户在环境中禁用了 cookie 的可能性。当终端用户未启用\
  \ cookie 时，他们的身份将存储在浏览器的 URL 字符串中。\n\n## 授权 (Authorization)\n\n授权过程验证用户是否有权访问其尝试请求的资源。ASP.NET\
  \ 支持文件授权和 URL 授权。由应用程序指定的授权过程可以通过配置文件中的 `<authorization>` 部分来控制。如 Listing 28-18\
  \ 所示，`<authorization>` 部分可以包含子节，这些子节可以对用户、系统内特定角色的用户组或以特定方式到达服务器的请求（例如 HTTP GET\
  \ 请求）允许或拒绝权限。你可以可选地使用 `<location>` 部分仅为应用程序内的特定文件夹或文件授予特殊的授权权限。\n\n### URL 授权\n\n\
  URL 授权是由 `URLAuthorizationModule`（继承自 `HttpModule`）提供的服务，用于控制对 `.aspx` 文件等资源的访问。如果你希望对某些人员或角色允许或拒绝\
  \ ASP.NET 应用程序的某些部分，URL 非常有用。\n\n例如，你可能只想让管理员访问 ASP.NET 应用程序的管理部分，并拒绝其他人的。你可以使用\
  \ URL 授权轻松地完成此任务。URL 授权可以根据用户、角色或 HTTP 动词（如 HTTP GET 请求或 HTTP POST 请求）进行配置。\n\n\n\
  \n\n可以在配置文件中构建授权部分，以便使用 `<location>` 元素将指定的内容应用于特定的文件或目录。例如，假设你的应用程序中有一个名为 `Home`\
  \ 的根目录，并且在该根目录下嵌套有一个名为 `Documents` 的子目录。假设你只想允许包含在 `Admin` 角色中的用户访问 `Documents`\
  \ 子目录。插列表 28-22 描述了这种场景。\n\n你也可以像插列表 28-23 所示，为单个文件设置安全性。\n\n### 锁定配置设置\n\nASP.NET\
  \ 的配置系统在将配置信息应用到特定应用程序或文件夹方面非常灵活。尽管配置系统很灵活，但在某些情况下，你可能希望限制服务器上某个特定应用程序可以控制的配置选项。例如，你可能决定更改\
  \ ASP.NET 会话信息的存储方式。这种锁定过程可以通过 `<location>` 属性 `allowOverride` 和 `allowDefinition`，以及\
  \ `path` 属性来实现。\n\n插列表 28-24 展示了这种方法。此 `machine.config` 文件中的 `<location>` 部分标识了路径\
  \ `\"Default Web Site/ExampleApplication\"`，并允许该应用程序通过使用 `allowOverride` 属性覆盖 `<trace>`\
  \ 设置。\n\n由于 `allowOverride` 属性设置为 `true`，因此 `trace` 属性可以被覆盖。你可以在 `ExampleApplication`\
  \ 的 `web.config` 文件中覆盖跟踪设置并启用本地的 `<trace>` 元素，从而覆盖插列表 28-24 中显示的设置。\n\n然而，如果你在 `machine.config`\
  \ 文件的 `<location>` 部分将属性写为 `allowOverride=\"false\"`，则 `ExampleApplication` 的 `web.config`\
  \ 文件将无法覆盖该特定设置。\n\n### ASP.NET 页面配置\n\n当 ASP.NET 应用程序部署后，配置文件中的 `<pages>` 部分允许你控制每个\
  \ ASP.NET 页面的某些默认行为。这些行为包括此类选项，例如在发送输出之前是否应对其进行缓冲，或者是否为整个应用程序启用会话状态。插列表 28-25 显示了使用\
  \ `<pages>` 部分的示例。\n\n以下列表详细列出了了一些 ASP.NET 页面配置信息元素：\n\n*   `buffer`: 指定请求在发送到客户端之前是否必须在服务器上进行缓冲。\n\
  *   `enableSessionState`: 指定是否应启用当前 ASP.NET 应用程序的会话状态。可能的值有 `true`、`false` 或 `readonly`。`readonly`\
  \ 值意味着应用程序可以读取会话值，但不能修改它们。\n*   `enableViewState`: 指定是否对所有控件启用 ViewState。如果应用程序不使用\
  \ ViewState，可以在应用程序的 `web.config` 文件中将 `value` 设置为 `false`。\n*   `autoEventWireup`:\
  \ 指定 ASP.NET 是否可以自动装接 Load 或 Error 等常见页面事件。\n*   `smartNavigation`: 智能导航是一项利用 IE\
  \ 作为客户端浏览器的功能，用于防止页面回传（post back）自身时发生的重绘。使用智能导航，请求将通过客户端的 `IFRAME` 发送，IE 仅重绘页面发生变化的部分。默认情况下，此选项设置为\
  \ `false`。当启用时，它仅适用于 Internet Explorer 浏览器；所有其他浏览器获得标准行为。\n*   `maintainScrollPositionOnPostback`:\
  \ 指定在回传发生后是否将用户返回到页面的相同位置。如果设置为 `false`（默认值），用户将返回页面顶部。\n*   `masterPageFile`: 标识当前\
  \ ASP.NET 应用程序的主页。如果你想仅将主页模板应用于特定的页面子集（例如应用程序中特定文件夹内的页面），你可以在 `web.config` 文件中使用\
  \ `<location>` 元素：\n\n```xml\n<configuration>\n  <location path=\"ExampleApplicationAdmin\"\
  >\n    <system.web>\n      <pages \n        masterPageFile=\"~/ExampleApplicationAdminMasterPage.master\"\
  \ \n        />\n    </system.web>\n  </location>\n</configuration>\n```\n\n*   `theme`:\
  \ 指定用于页面的主题名称。\n*   `styleSheetTheme`: 定义在控件声明后使用的的主题。\n*   `maxPageStateFieldLength`:\
  \ 如果设置为正数，ASP.NET 将将 ViewState 分为比定义大小更小的块。默认值为 `-1`，意味着所有 ViewState 将一次性传回。\n*\
  \   `pageBaseType`: 指定当前 ASP.NET 应用程序中所有 ASP.NET 页面的基类。默认情况下，此选项设置为 `System.Web.UI.Page`。然而，如果你希望所有\
  \ ASP.NET 页面都继承自其他基类，可以通过此设置更改默认值。\n*   `userControlBaseType`: 指定当前 ASP.NET 应用程序中所有\
  \ ASP.NET 用户控件的基类。默认是 `System.Web.UI.UserControl`。你可以使用此元素覆盖默认选项。\n*   `validateRequest`:\
  \ 指定 ASP.NET 是否应验证所有危险的请求，例如跨站脚本和脚本注入。此功能通过自动检查请求中的所有参数，确保其内容不包含 HTML 元素提供保护。有关此设置的更多信息，请访问\
  \ [www.asp.net/faq/RequestValidation.aspx](http://www.asp.net/faq/RequestValidation.aspx)。\n\
  *   `namespaces`: 可选，你可以导入包含在预编译过程中的程序集。\n*   `compilationMode`: 指定 ASP.NET 如何编译当前\
  \ Web 应用程序。的值有 `Never`、`Always` 和 `Auto`。`compilationMode=\"Never\"` 意味着页面从不编译。如果页面具有需要编译的结构，则会发生错误。`compilationMode=\"\
  Always\"` 意味着始终编译页面。当你设置 `compilationMode=\"Auto\"` 时，如果可能，ASP.NET 不编译页面。\n*   `viewStateEncryptionMode`:\
  \ 指定是否加密 ViewState。\n*   `asyncTimeout`: 指定在异步操作期间等待异步处理器完成的秒数。\n*   `clientIDMode`:\
  \ 指定用于创建页面上服务器控件的 `ClientID` 值的算法。默认设置为 `AutoID`，而服务器控件的默认值为 `Inherit`。\n*   `controlRenderingCompatibilityVersion`:\
  \ 指定控件渲染 HTML 时使用的 ASP.NET 版本。\n\n### 包含文件\n\nASP.NET 在 `machine.config` 和 `web.config`\
  \ 文件中都支持*包含*文件。当配置内容需要在多个处包含或位于 location 元素内部时，包含文件是封装内容的极方法。\n\n配置文件中的任何部分都可以使用\
  \ `<pages>` 部分中的 `configSource` 属性从另一个文件包含内容。属性的值指示指向包含文件的虚拟相对文件名。插列表 28-26 是此类指令的示例。\n\
  \n\n\n\n\n包含文件的配置文件可以包含适用于单个节的信息，且单个包含文件不能包含多个配置节，或某个节的一部分。如果存在 `configSource` 属性，则源文件中的节元素不应包含任何其他属性或任何子元素。\n\
  \n尽管如此，包含文件并不是一个完整的配置文件。它应该只包含包含节（include section），如插列表 28-27 所示 所示。\n\n## 配置 ASP.NET\
  \ 运行时设置\n\n常规配置设置指定了给定的 ASP.NET 资源（如页面）在认为超时之前允许执行多长时间。其他设置指定了请求的最大长度（以 KB 为单位）或在重定向时是否使用完全限定的\
  \ URL。要指定这些设置，您需要在配置文件中使用 `<httpRuntime>` 节。`<httpRuntime>` 元素在文件夹级别上应用于 ASP.NET\
  \ 应用程序。插列表 28-28 所示 显示了 `<httpRuntime>` 节中使用的默认值。\n\n### 启用和禁用 ASP.NET 应用程序\n\n\
  `enable` 属性指定当前 ASP.NET 应用程序是否启用。当设置为 `false` 时，当前 ASP.NET 应用程序被禁用，所有尝试连接到此站的客户端将接收\
  \ HTTP 404 — 未找到文件的异常。此值应仅在机器或应用程序级别上设置。如果您在任何其他级别（如子文件夹级别）设置了此值，它将被忽略。这一强大功能允许管理员出于任何原因停止应用程序，而无需启动或停止\
  \ IIS。默认值为 `true`。\n\n### 完全限定的重定向 URL\n\n`useFullyQualifiedRedirectUrl` 属性指定客户端侧的重定向是否应包含完全限定的\
  \ URL。当您针对移动设备进行编程时，某些设备需要指定完全限定的 URL。默认值为 `false`。\n\n### 请求超时\n\n`executionTimeout`\
  \ 设置指定了 ASP.NET 请求超时的超时选项。此属性的值是资源在 ASP.NET 请求超时之前可以执行的时间长度（以秒为单位）。默认设置为是 110 秒。如果您有某个特定的\
  \ ASP.NET 页面或 Web 服务执行时间超过了 110 秒，则您可以在配置中扩展该时间限制。\n\n### 最大请求长度\n\n`maxRequestLength`\
  \ 属性指定了 ASP.NET 运行时接受的最大上传大小。例如，如果 ASP.NET 应用程序需要处理巨大的文件，那么此设置就是您想要更改的。默认值为 `4096`。此数字代表千字节（KB\
  \ 或约 4MB）。\n\n如今 Web 应用程序很容易受到攻击。攻击范围从脚本注入攻击到拒绝服务（DoS）攻击不等。DoS 是一种典型的攻击，通过向 Web\
  \ 服务器发送大量大文件请求进行轰炸。大量的请求最终会导致 Web 服务器崩溃。`maxRequestLength` 属性可以通过设置请求大小的限制来保护您免受\
  \ DoS 攻击。\n\n### 上传缓冲\n\nASP.NET 4.5 包含一个名为 `requestLengthDiskThreshold` 的设置。该设置允许管理员配置文件上传缓冲行为，而不影响编程模型。管理员可以配置一个阈值，低于该阈值的请求将被缓冲到内存中。当请求超过限制后，它将透明地缓冲在磁盘上，并由用于消费数据的任何机制从那里读取。该设置的有效值为\
  \ KB 单位的 `1` 到 `Int32.MaxSize` 之间的数字。\n\n当启用文件缓冲时，文件将被上传到 `codegen` 文件夹。`codegen`\
  \ 文件夹的默认路径如下：\n\n```\n[WinNT\\Windows]\\Microsoft.NET\\Framework[version]\\Temporary\
  \ ASP.NET Files\\\n[ApplicationName]\n```\n\n文件使用随机名称缓冲在 `codegen` 文件夹内一个名为 `Uploads`\
  \ 的子文件夹中。`codegen` 文件夹的位置可以使用 `<compilation>` 节的 `tempDirectory` 属性基于每个应用程序进行配置。\n\
  \n### 线程管理\n\nASP.NET 运行时使用线程池中空闲线程来满足请求。`minFreeThreads` 属性指示 ASP.NET 保证在线程池内可用的线程数。默认线程数为八个。对于需要额外线程完成处理的复杂应用程序，此属性仅确保线程是可用的，并且应用程序不会在等待空闲线程调度更多工作时被阻塞。`minLocalRequestFreeThreads`\
  \ 属性控制用于本地请求处理的空闲线程数；默认值为四个。\n\n### 应用程序队列长度\n\n`appRequestQueueLimit` 属性指定了 ASP.NET\
  \ 为当前 ASP.NET 应用程序队列的最大请求数。当 ASP.NET 没有足够的空闲线程来处理请求时，它会将请求放入队列。`minFreeThreads`\
  \ 属性指定了 ASP.NET 应用程序应该维护的空闲线程数，此设置影响存储在队列中的项数。\n\n### 输出缓存\n\n`enableKernelOutputCache`\
  \ 指定了是否在 IIS 内核级别（`Http.sys`）启用输出缓存。目前，此设置仅适用于 IIS6 及更高版本的 Web 服务器。\n\n## 配置 ASP.NET\
  \ 工作进程\n\n当 IIS 接收到 ASP.NET 页面的请求时，它会将请求传递给一个名为 `aspnet_isapi.dll` 的非托管 DLL。`aspnet_isapi.dll`\
  \ 进一步将请求传递给一个单独的工作进程 —— 如果使用的是 IIS5，则为 `aspnet_wp.exe` —— 该进程运行所有的 ASP.NET 应用程序。然而，对于\
  \ IIS6 及更高版本，所有的 ASP.NET 应用程序都由 `w3wp.exe` 进程运行。ASP.NET 工作进程可以使用 `machine.config`\
  \ 文件中的 `<processModel>` 节进行配置。\n\n插列表 28-29 所示 中的代码示例显示了 `<processModel>` 节的默认格式。\n\
  \n下部分详细查看了这些属性：\n\n- `enable`：指定是否启用进程模型。当设置为 `false` 时，ASP.NET 应用程序在 IIS 的进程模型下运行。\n\
  - `timeout`：指定工作进程在创建新的工作进程替换当前工作进程之前生存的时间。对于应用程序在运行几周后性能开始缓慢下降的情况（例如内存泄漏），此值非常有用。无需您手动启动和停止进程，ASP.NET\
  \ 可以自动重启。默认值为 `Infinite`。\n- `idleTimeout`：指定工作进程在关闭之前等待多久。您可以使用 `idleTimeout` 选项自动关闭\
  \ ASP.NET 工作进程。默认值为 `Infinite`。您也可以使用格式 `HH:MM:SS` 设置此值。\n- `shutdownTimeout`：指定在\
  \ ASP.NET 对进程调用 `Kill` 命令之前，给予工作进程自行关闭的时间。`Kill` 是一个强制删除进程的低级命令。默认值为 5 秒。\n- `requestLimit`：指定在服务了特定数量的请求后，ASP.NET\
  \ 工作进程何时回收。默认值为 `Infinite`。\n- `requestQueueLimit`：如果超过队列请求的限制，指示 ASP.NET 回收工作进程。默认设置为\
  \ 5000。\n- `memoryLimit`：指定工作进程在被认为行为异常或内存泄漏之前允许消耗的物理内存量。默认值为可用物理内存的 60%。\n\n\n\n\
  \n\n* `username` 和 `password`: 默认情况下，所有 ASP.NET 应用程序都使用 ASPNET 标识。如果你希望 ASP.NET\
  \ 应用程序以不同的账户运行，可以使用这些属性提供 `username` 和 `password` 对。\n* `logLevel`: 指定 ASP.NET 工作进程记录事件的方式。默认设置为仅记录错误。然而，你也可以也可以通过指定\
  \ `None` 来禁用日志，或者使用 `All` 记录所有内容。所有日志项都会写入 Windows 应用程序事件日志。\n* `clientConnectedCheck`:\
  \ 允许你在执行工作之前，按时间间隔检查客户端是否仍然连接。默认设置为 5 秒。\n* `responseDeadlockInterval`: 指定死锁检查发生的频率。如果在此时间间隔内请求已排队且没有发送任何响应，则认为存在死锁。发生死锁后，进程将重启。默认值为\
  \ 3 分钟。\n* `responseRestartDeadlockInterval`: 指定当运行时检测到死锁时，运行时在重启进程之前应等待多长时间。默认值为\
  \ 9 分钟。\n* `comAuthenticationLevel`: 控制 DCOM 安全的身份验证级别。默认设置为 `Connect`。其他值为 `Default,\
  \ None, Call, Pkt, PktIntegrity` 和 `PktPrivacy`。\n* `comImpersonationLevel`: 控制\
  \ COM 安全的身份验证级别。默认设置为 `Impersonate`。其他值为 `Default, Anonymous, Identify` 和 `Delegate`。\n\
  * `webGarden`: 指定是否启用 Web Garden 模式。默认设置为 `false`。Web Garden 允许你在单个服务器上托管多个 ASP.NET\
  \ 工作进程，从而为应用程序提供更好的硬件可扩展性。Web Garden 模式仅在多处理器服务器上支持。\n* `cpuMask`: 当 `webGarden=\"\
  true\"` 时，指定哪些处理器应该与 ASP.NET 工作进程具有亲和性。`cpuMask` 是十六进制值。默认值为所有处理器，显示为 `0xFFFFFFFF`。\n\
  * `maxWorkerThreads`: 指定 ASP.NET 工作进程线程池中存在的线程最大数量。默认值为 20。\n* `maxIoThreads`: 指定\
  \ ASP.NET 工作进程中存在的 I/O 线程的最大数量。默认值为 20。\n* `autoConfig`: 指定是否配置 ASP.NET 应用程序的性能设置。\n\
  * `minWorkerThreads`: 指定 ASP.NET 工作进程线程池中存在的线程最小数量。默认值为 1。\n* `minIoThreads`: 指定\
  \ ASP.NET 工作进程中存在的 I/O 线程最小数量。默认值为 1。\n* `serverErrorMessageFile`: 指定用于显示错误消息内容的页面，而不是默认的“服务器不可用”消息。\n\
  * `pingFrequency`: 指定 ISAPI 扩展程序 ping 通工作进程的时间间隔，以确定其是否正在运行。\n* `pingTimeout`: 指定工作进程在无响应后重启的时间间隔。\n\
  * `maxAppDomains`: 设置一个进程的应用程序域的绝对最大数量。\n\n## 运行具有多个版本 .NET Framework 的多个网站\n\n\
  在 ASP.NET 工作进程相同的上下文中，给定的 Web 服务器内的多个网站可以托管多个网站，并且这些网站中的每个都可以绑定到 .NET Framework\
  \ 的特定版本。这通常使用 `aspnet_regiis.exe` 工具完成。`aspnet_regiis.exe` 工具随每个版本的框架一起分发。\n\n该实用程序有多个开关。使用\
  \ `-s` 开关允许你在指定的网站上安装当前版本的 .NET Framework 运行时。列表 28-30 显示了如何在 ExampleApplication\
  \ 网站上安装 .NET Framework 2.0。\n\n## 存储应用程序特定设置\n\n每个 Web 应用程序必须存储某些运行时所需的应用程序特定信息。`web.config`\
  \ 文件的 `<appSettings>` 部分提供了一种为 ASP.NET 应用程序定义自定义应用程序设置的方法。该部分可以有多个 `<add>` 子元素。其语法如下：\n\
  \n```\n<appSettings>\n     <add key=\"[key]\" value=\"[value]\"/>\n</appSettings>\n\
  ```\n\n`<add>` 子元素支持两个属性：\n\n* `key`: 指定 `appSettings` 哈希表中的键值\n* `value`: 指定 `appSettings`\
  \ 哈希表中的值\n\n列表 28-31 显示了如何存储应用程序特定的连接字符串。`key` 值设置为 `ApplicationInstanceID`，而 `value`\
  \ 值设置为 ASP.NET 应用程序实例以及运行该应用程序的服务器名称。\n\n## 编写配置文件\n\nASP.NET 包含了用于 API（ASP.NET\
  \ 管理对象），用于操作 `machine.config` 和 `web.config` 文件中的配置信息设置。ASP.NET 管理对象提供了一个强类型编程模型，解决了\
  \ .NET Web 应用程序服务器的特定管理方面。它们还控制着 ASP.NET Web 配置的创建和维护。使用 ASP.NET 管理对象，你可以操作存储在本地或远程计算机配置文件中的配置信息。这些可以用于为任何常见管理任务编写脚本或编写安装脚本。\n\
  \n所有的 ASP.NET 管理对象都存储在 `System.Configuration` 和 `System.Web.Configuration` 命名空间中。你可以使用\
  \ `WebConfigurationManager` 类访问配置。`System.Configuration.Configuration` 类表示来自 `machine.config`\
  \ 和 `web.config` 文件的合并视图。`System.Configuration` 和 `System.Web.Configuration` 命名空间拥有多个允许你访问几乎所有设置的类。`System.Configuration`\
  \ 和 `System.Web.Configuration` 之间的主要区别在于 `System.Configuration` 命名空间包含适用于所有 .NET\
  \ 应用程序的类。而 `System.Web.Configuration` 命名空间包含适用于 ASP.NET 应用程序的类。表 28-1 显示了 `System.Configuration`\
  \ 中的重要类及其用途。\n\n| **CLASS NAME** | **PURPOSE** |\n| --- | --- |\n| `Configuration`\
  \ | 允许操作存储在本地计算机或远程的配置 |\n| `ConfigurationElementCollection` | 允许枚举存储在配置文件中的子元素\
  \ |\n| `AppSettingsSection` | 允许操作配置中的 `<appSettings>` 部分 |\n| `ConnectionStringsSettings`\
  \ | 允许操作配置中的 `<connectionStrings>` 部分 |\n| `ProtectedConfigurationSection` | 允许操作配置中的\
  \ `<protectedConfiguration>` 部分 |\n| `ProtectedDataSection` | 允许操作配置中的 `<protectedData>`\
  \ 部分 |\n\n**表 28-1**\n\n表 28-2 显示了 `System.Web.Configuration` 命名空间的一些类及其用途。\n\n\
  | **CLASS NAME** | **PURPOSE** |\n| --- | --- |\n| `AuthenticationSection` | 允许操作配置中的\
  \ `<authentication>` 部分 |\n| `AuthorizationSection` | 允许操作配置中的 `<authorization>`\
  \ 部分 |\n| `CompilationSection` | 允许操作配置中的 `<compilation>` 部分 |\n| `CustomErrorsSection`\
  \ | 允许操作配置中的 `<customErrors>` 部分 |\n| `FormsAuthenticationConfiguration` | 允许操作配置中的\
  \ `<forms>` 部分 |\n\n\n\n\n\n| `GlobalizationSection` | 允许你操作配置文件中的 `<globalization>`\
  \ 部分 |\n| `HttpHandlersSection` | 允许你操作配置文件中的 `<httpHandlers>` 部分 |\n| `HttpModulesSection`\
  \ | 允许你操作配置文件中的 `<httpModules>` 部分 |\n| `HttpRuntimeSection` | 允许你操作配置文件中的 `<httpRuntime>`\
  \ 部分 |\n| `MachineKeySection` | 允许你操作配置文件中的 `<machineKey>` 部分 |\n| `MembershipSection`\
  \ | 允许你操作配置文件中的 `<membership>` 部分 |\n| `PagesSection` | 允许你操作配置文件中的 `<pages>` 部分\
  \ |\n| `ProcessModelSection` | 允许你操作配置文件中的 `<processModel>` 部分 |\n| `WebPartsSection`\
  \ | 允许你操作配置文件中的 `<webParts>` 部分 |\n\n**表 28-2**\n\n所有的配置类都是基于简单的面向对象架构实现的，该架构包含持有所有数据的实体类和一个具有添加、删除、枚举等方法的集合类。你可以从简单的连接字符串枚举开始进行配置文件编程，如下节所示。\n\
  \n## 枚举连接字符串\n\n在 Web 应用程序中，你可以存储多个连接字符串。其中一些由系统使用，另一些可能是特定于应用程序。你可以编写一个非常简单的 ASP.NET\
