  \ Miranda\n\n非常感谢 Pranav Rastogi、Scott Hunter、Damian Edwards、Eilon Lipton 以及整个从事实际工作的\
  \ ASP.NET 团队。\n\n—Scott Hanselman\n\n# 前言\n\n随着 Web 的变化，ASP.NET 在这些年来不断演进。在首次发布时，Web\
  \ Forms 是一种革命性的模型，通过使用富控件封装 Web 行为，将面向对象的编程引入 Web。当 Ajax 开始成为一个常用术语时，ASP.NET 演变为包含丰富的\
  \ Ajax 库和一个 `UpdatePanel` 控件，简化了 Ajax 编程。随后随着 MVC（模型-视图-控制器）模式开始流行，我们发布了 ASP.NET\
  \ MVC，它为使用 MVC 模式构建 ASP.NET 应用程序提供了框架。然后 ASP.NET 回到了它的起源，推出了 ASP.NET Web Pages，它提供了一种类似于\
  \ PHP 的简单编程方式，帮助人们学习 Web 编程。随着智能手机和平板等连接设备的出现，程序员需要一种方法构建可以从设备调用的 API，ASP.NET Web\
  \ API 随之诞生。最新的新增是 ASP.NET SignalR，它为需要实时显示数据实时更新（如股票报价）的应用提供了编程模型。\n\nWeb 每发生一次变化，ASP.NET\
  \ 也会随之变化，未来我们将继续保持每个 ASP.NET 框架与最新进展保持同步。在 ASP.NET 4.5 中，我们的目标之一是确保 Web Forms 保持与上述其他框架的进展同步。模型绑定（Model\
  \ Binding）、无侵入 JavaScript（Unobtrusive JavaScript）和 NuGet 库等功能已添加到 Web Forms 中，使得\
  \ Web Forms 开发者可以使用较新框架中创建的新功能。还增加了工具，以便 ASP.NET Web API 添加到任何 ASP.NET 项目中。你正在见证“One\
  \ ASP.NET”的演进，这将使我们所有的框架和功能能够协同工作。\n\n享受 One ASP.NET 的开始，它将使我们所有的框架和功能协同工作。\n\n\
  —Scott Hunter\n微软 Web 团队首席经理\n\n# 引言\n\n简单来说，ASP.NET 4.5 是一个用于构建 Web 的惊人技术！自 ASP.NET\
  \ 诞生以来，引入了许多技术，使其成为可用最有心勃勃的框架之一。这本书涵盖了 ASP.NET 提供的几乎所有内容。它不仅引入了新话题，还向你展示了这些新技术的实际示例。所以，请坐好，敲击键盘，尽情享受吧！\n\
  \n## ASP.NET 的过去、现在与未来\n\nASP.NET 4.5 是该产品的另一个主要版本，在之前版本的基础上增加了额外功能。随着 ASP.NET 的每次发布，微软团队都将目标集中在开发者生产力、管理和维护，以及性能和扩展性上。本书重点关注新增内容。\n\
  \nASP.NET 已经存在了 10 年。在它首次发布时，重点是将现有的使用 VBScript 或 Jscript 的 Web 编程模型（构建 Active Server\
  \ Pages）转换为面向对象的模型。为了帮助这种过渡，包含了几个服务器控件来封装常用功能。\n\n随着时间的推移，开发者开始要求对渲染后的标记有更多控制权。结果是，ASP.NET\
  \ 发生了变化。新的 Web 范式出现，诸如 ASP.NET MVC 等技术运而生。另一方面，ASP.NET Web Forms 继续主导大部分开发。因此，ASP.NET\
  \ 的过去几个版本强调了服务器控件的适当标记。\n\n然而，由于 Visual Studio 团队与大多数团队一样处于 2 到 3 年的发布周期，ASP.NET\
  \ 团队无法跟上 Web 技术的变化。本书的第 1 章](#Chapter01.xhtml) 提供了更详细的解释，说明 ASP.NET 团队如何通过提供更频繁的产品线下发布（OOB）来解决这一难题。本章还讨论了\
  \ ASP.NET 团队的开源倡议。事实上，许多 ASP.NET 技术已经作为真正的开源发布。\n\n## ASP.NET 4.5 所需环境\n\n你可能会发现安装\
  \ Visual Studio 2012 是完成书中示例的最佳选择。不过，你可以使用微软的记事本或 WebMatrix 以及 .NET Framework 4.5\
  \ 自带的编译器。要完成书中的*每一个*示例，你需要以下内容：\n\n*   Windows 8、Windows 7、Windows Vista、Windows\
  \ Server 2012 或 Windows Server 2008\n\n*   Visual Studio 2012（这会安装 .NET Framework\
  \ 4.5）\n\n*   SQL Server 2012、2008、2005 或 SQL Server Express 版\n\n\n\n\n\n很棒的一点是，运行\
  \ ASP.NET 4.5 不需要 Microsoft Internet Information Services (`IIS`)，因为 Visual Studio\
  \ 2012 包含了一个名为 `IIS Express` 的内置 Web 服务器。此外，如果你没有完整版的 SQL Server，也不要惊慌。许多使用该数据库的示例都可以修改为适用于微软的\
  \ SQL Server Express 版，你可以在互联网上免费找到该版本。\n\n## 本书适合哪些读者\n\n编写此书的目的是为了向你介绍 ASP.NET\
  \ 4.5 提供的功能和能力，并向你解释 ASP.NET 所提供的基础知识。我们假设你对 Web 技术有通领域，例如之前的 ASP.NET 版本或其他 `PHP`\
  \ 等其他 Web 技术。如果你理解 Web 编程的基础知识，那么跟上本书的内容应该不会有太大困难。\n\n如果你是 ASP.NET 的初学者，请务必查看 Imar\
  \ Spaanjaars 编写的 Wrox 出版的 `Beginning ASP.NET 4.5: In C# and VB`（John Wiley & Sons,\
  \ 2012），以帮助你理解基础知识。\n\n除了处理 Web 技术外，我们还假设你理解基本的编程结构，例如变量、`For Each` 循环和面向对象编程。\n\
  \n你可能还会好奇这本书是给 Visual Basic 开发者还是 C# 开发者看的。我们很高兴地告诉你，两者都适用！当代码有显著差异时，本书提供了 `VB`\
  \ 和 `C#` 两种示例。在这种情况下，为了简洁起见，`C#` 示例中省略了任何 HTML 标记。\n\n## 本书涵盖的内容\n\n本书探讨了 ASP.NET\
  \ 4.5 版本。它详细涵盖了 ASP.NET 4.5 中包含的每个主要新功能。以下列表列出了每章的内容简介。\n\n- **第 1 章，“统一 ASP.NET”\
  \ —— 扩展健康的 Web 生态系统：** 第一章可能是书中最有趣的章节之一。在存在了 10 年后，ASP.NET 是产出最多的 Web 开发技术之一。在本章中，详细介绍了\
  \ ASP.NET 的未来计划，包括一个全新的愿景：拥有一个统一的 ASP.NET。\n- **第 2 章，“使用 ASP.NET 进行 HTML5 和 CSS3\
  \ 设计”：** Visual Studio 2012 使用 `HTML5` 和 `CSS3` 构建 Web 应用程序。本章仔细研究了如何有效利用 `HTML`\
  \ 和 `CSS` 来设计你的 ASP.NET 应用程序。\n- **第 3 章，“ASP.NET Web Forms 结构”：** 第三章涵盖了 ASP.NET\
  \ 应用程序的框架以及为单个 ASP.NET 页面提供的结构和框架。本章向你展示如何使用 Visual Studio 2012 构建 ASP.NET 应用程序。它展示了属于\
  \ ASP.NET 的文件夹和文件。讨论了编译代码的方法，并展示了如何执行跨页面提交（posting）。本章最后展示了在 Visual Studio 2012\
  \ 内部处理类的简单方法。\n- **第 4 至第 7 章，“控件”：** 这四章被归在一起，是因为它们都处理服务端控件或用户控件。这一组章节从研究服务器控件的概念及其在\
  \ ASP.NET 开发中的关键作用开始。除了查看服务器控件框架外，这些章节还深入探讨了你在 ASP.NET 开发项目中可用的大量服务器控件。`第 4 章，“ASP.NET\
  \ 服务端控件和客户端脚本\"` 查看了使用服务器控件的基础。`第 5 章，“ASP.NET Web 服务器控件\"`涵盖了最新 ASP.NET 版本中包含的控件。`第\
  \ 6 章，“验证服务器控件\"` 描述了一组特殊的服务器控件：用于验证的控件。你可以使用这些控件创建从基础到高级的表单验证。`第 7 章，“用户和服务器控件\"\
  ` 描述了如何构建自己的服务器控件并在应用程序中使用它们。\n- **第 8 至第 13 章，“数据访问”：** 本书的这部分讨论了数据访问。今天几乎所有的 Web\
  \ 应用程序都至少与一种数据源交互。从关系型数据到 `JSON`，这些章节涵盖了所有内容。`第 8 章，“数据绑定\"` 查看了允许你在将数据发布到控件之前以程序方式处理数据的底层能力。`第\
  \ 9 章，“模型绑定\"` 涵盖了将模型绑定并应用到 Web Forms 的基础知识。`第 10 章，“使用 LINQ 进行查询\"`向你介绍了 `LINQ`\
  \ 以及如何在当今的 Web 应用程序中有效使用这一功能。`第 11 章，“Entity Framework\"` 讨论了将对象从数据库映射到代码中的对象。使用\
  \ Visual Studio 2012，你可以视觉化地设计你的实体数据模型。`第 12 章，“ASP.NET Dynamic Data\"` 描述了动态数据如何让你能够快速方便地从数据库组装报告和数据录入应用程序。`第\
  \ 13 章，“使用服务\"` 概述了传统的 `ASMX` Web 服务、`WCF` 和新的 `WebAPI` 之间的区别。\n- **第 14 章，“提供模型简介”：**\
  \ ASP.NET 内置了许多系统，让开发者的生活比以前任何时候都更加简单和高效。这些系统建立在名为“提供模型”的架构之上，该架构具有很好的扩展性。本章提供了提供模型的概述以及它如何在整个\
  \ ASP.NET 4.5 中使用。\n- **第 15 章，“扩展提供模型”：** 在介绍提供模型之后，本章查看了 ASP.NET 中扩展提供模型的一些方法。本章还回顾了两个提供模型的示例扩展。\n\
  - **第 16 章，“与主页工作”：** 主页（Master pages）是 ASP.NET 的一项强大功能。它们提供了一种创建模板页的方法，使你能够处理整个应用程序而不是单个页面。本章检查了这些模板的创建，以及如何将它们应用于整个\
  \ ASP.NET 应用程序中的内容页。\n- **第 17 章，“站点导航”：** 显而易见，许多开发者不仅仅开发单个页面——他们构建应用程序。因此，他们需要处理整个应用程序功能的机制，而不仅仅是页面。ASP.NET\
  \ 4.5 提供的能力之一是本章涵盖的站点导航系统。底层导航系统允许你通过 `XML` 文件定义应用程序的导航结构，并引入了一系列与这些 XML 文件数据工作的导航服务器控件。\n\
  - **第 18 章，“个性化”：** 开发者总是寻找存储与终端用户相关信息的方法。在存储之后，这些个性化数据必须为了未来的访问或获取同一应用程序内的其他页面而持久化。ASP.NET\
  \ 开发了一种存储这些信息的方法——ASP.NET 个性化系统。该系统很好的一点是，你可以通过 `web.config` 文件配置整个系统的行为。\n- **第\
  \ 19 章，“成员角色管理”：** 本章涵盖了为了简化向 ASP.NET 应用程序添加身份验证和授权而开发的成员角色系统。这两个系统非常广泛；它们让过去一些复杂的身份验证和授权实现变成了遥远的记忆。本章重点关注使用\
  \ `web.config` 文件控制这些系统的应用方式，以及与底层系统工作的服务器控件。\n\n\n\n\n### 第 20 章，“安全”\n本章讨论了 ASP.NET\
  \ 4.5 提供的成员和角色管理功能之外的安全特性。本章深入介绍了 ASP.NET 技术中固有的身份验证和授权机制，以及 HTTP 访问类型和身份模拟。\n\n\
  ### 第 21 章，“状态管理”\n由于 ASP.NET 是一种基于请求-响应的技术，状态管理以及请求和响应的性能变得异常重要。本章引入了 ASP.NET 开发中这两个独立但又重要的领域。\n\
  \n### 第 22 章，“缓存”\n由于 ASP.NET 的请求-响应特性，在服务器上进行缓存（存储之前生成的的结果、图像和页面）对于您的 ASP.NET 程序的性能至关重要。本章探讨了\
  \ ASP.NET 提供的一些高级缓存功能，包括作为 ASP.NET 4.5 一部分的 SQL 缓存失效功能。本章还查看了对象缓存和对象缓存的可扩展性。\n\n\
  ### 第 23 至 27 章，“客户端开发”\n这五章涉及了技术领域最热门的领域之一：移动技术。如今，消费者和企业都期望拥有实时数据交付，以及能够在手机、平板电脑到全功能\
  \ PC 上流畅运行的设计应用程序。\n- 第 23 章，“ASP.NET AJAX”探讨了如何使用 AJAX 构建您的应用程序。\n- 第 24 章，“Ajax\
  \ 控制工具包”回顾了一系列可利用 AJAX 技术的控件。\n- 第 25 章，“jQuery”提供了 jQuery JavaScript 库的概述。\n- 第\
  \ 26 章，“实时通信”比较了传统的提供实时通信的方法与更现代的方法，例如使用 HTML5 Web Sockets 或 SignalR（后者包含了一种混合解决方案）。\n\
  - 第 27 章，“从移动端考虑的网站开发”专门讨论了更新客户端以提供更好的移动客户端支持的方法。\n\n### 第 28 至 33 章，“应用程序配置与部署”\n\
  到这里，您应该已经对构建 ASP.NET 应用程序有了良好的理解。这六章重点关注于配置和优化您的应用程序，最后是部署应用程序。\n- 第 28 章，“配置”教您如何利用手头的各种配置文件来修改\
  \ ASP.NET 的功能和行为。\n- 第 29 章，“调试与错误处理”告诉您如何在应用程序中正确结构化错误处理，并向您展示如何使用各种调试技术来查找应用程序可能包含的错误。\n\
  - 第 30 章，“模块和处理器”查看了操作 ASP.NET 处理 HTTP 请求的两种方法：`HttpModule` 和 `HttpHandler`。每种方法提供了访问\
  \ ASP.NET 底层处理的独特级别。\n- 第 31 章，“异步通信”讨论了从客户端到服务器端方法或托管服务的执行单向通信的方法。\n- 第 32 章，“构建全球化应用程序”查看了为全球构建\
  \ Web 应用程序时需要的一些重要事项。\n- 第 33 章，“打包与部署 ASP.NET 应用程序”将构建过程更进一步，向您展示如何打包 ASP.NET 应用程序以便于部署。\n\
  \n### 第 34 章，“ASP.NET MVC”\nASP.NET MVC 在开发社区中引起了巨大的关注。ASP.NET MVC 为您提供了使用许多开发者期望的模型-视图-控制器（MVC）模型创建\
  \ ASP.NET 应用程序的手段。ASP.NET MVC 为开发者构建的应用程序提供了可测试性、灵活性可维护性。需要记住，ASP.NET MVC 并不是为了取代每个人熟悉并喜爱的\
  \ ASP.NET，而是仅仅是构建应用程序的另一种方式。\n\n### 第 35 章，“ASP.NET Web Pages 和 Razor”\nASP.NET\
  \ Web Pages 是一项较新的技术，允许开发者使用 Razor 语法构建交互式 Web 应用程序。本章概述了使用 Microsoft WebMatrix\
  \ 构建 Web Pages 应用程序。它还列出了一些使用 Razor 语法渲染有效 HTML 和 CSS 的流行助手。\n\n### 附录 A，“迁移旧版 ASP.NET\
  \ 项目”\n在某些情况下，您是从零开始构建 ASP.NET 4.5 应用程序，一切都从新开始。但在许多情况下，这不是一个选择。您需要获取一个基于旧版本 .NET\
  \ Framework 构建的现有 ASP.NET 应用程序并进行迁移，使其能够在 .NET Framework 4.5 上运行。\n\n### 附录 B，“COM\
  \ 集成”\n无论如何，您都会使用之前的的技术创建的组件，您不想重新构建它们，但想将其集成到新的 ASP.NET 应用程序中。如果是这样，.NET Framework\
  \ 将您之前的 COM 组件整合到应用程序中变得简单直接。本附录还向您展示了如何构建 .NET 组件而不是转向之前的 COM 组件架构。\n\n### 附录 C，“ASP.NET\
  \ 终极工具”\n本附录查看了作为 ASP.NET 开发者可以使用的工具。这里的许多工具将帮助您加速开发过程，并在许多情况下让您成为更好的开发者。\n\n###\
  \ 附录 D，“管理与维护”\n除了让开发者在构建 ASP.NET 应用程序时更高效外，ASP.NET 团队还投入了大量精力使应用程序的管理更容易。过去，在使用\
  \ ASP.NET 1.0/1.1 时，您通过更改 XML 配置文件中的值来管理 ASP.NET 应用程序。本附录提供了今天 ASP.NET 自带的 GUI 工具概述，这些工具让您能够轻松有效地管理\
  \ Web 应用程序。\n\n### 附录 E，“动态类型与语言”\n随着 ASP.NET 4.5 的发布，您现在可以使用 IronRuby 和 IronPython\
  \ 构建您的 Web 应用程序。本附录快速查看了在构建 Web 应用程序中使用动态语言。\n\n### 附录 F，“ASP.NET 在线资源”\n这个小型附录指向了一些可以增强您对\
  \ ASP.NET 理解的高价值在线资源。\n\n### 附录 G，“使用 NuGet 的 Visual Studio 扩展性”\nVisual Studio\
  \ 2012 通过使用微软版本的 NuGet（称为包管理器）提供了一种扩展模型。NuGet 允许开发者通过创建可分发包来共享文件、文件夹和二进制文件。这些包可以在公共馈送或私有馈送中可用。\n\
  \n## 约定\n\n本书使用了多种不同的文本和布局样式，以帮助区分不同类型的信息。以下是所用样式的示例及其含义：\n\n- 新定义的单词用*斜体*显示。\n\
  - 键盘上按的按键（如 `Ctrl` 和 `Enter`）以首字母大写显示，并按照其在键盘上的方式拼写。\n- 文件扩展名、URL 以及出现在正文段落中的代码使用`等宽字体`显示。\n\
  \n可以作为程序输入并运行的代码块将分行显示，如下所示：\n\n```\n public static void Main()\n   {\n      AFunc(1,2,\"\
  abc\");\n   }\n```\n\n或者如下所示：\n\n```\n public static void Main()    {       AFunc(1,2,\"\
  abc\");    }\n```\n\n有时您会看到混合样式的代码，如下：\n\n\n\n\n\n```cpp\n // If we haven't reached\
  \ the end, return true, otherwise\n          // set the position to invalid, and\
  \ return false.\n          pos++;\n\n          if (pos < 4)\n             return\
  \ true;\n          else {\n             pos = -1;\n             return false;\n\
  \          }\n```\n\n当像这样显示混合代码时，**粗体代码**是你在当前示例中应该关注的内容。\n\n我们使用以下格式来演示方法、属性等的句法用法：\n\
  \n```\n SqlDependency=\"database:table\"\n```\n\n在这里，*斜体部分*表示`placeholder text`：即你需要插入的对象引用、变量或参数值。\n\
  \n贯穿全书大部分代码示例都以带有描述性标题的编号列表形式呈现，如下所示：\n\n## 源代码\n\n在学习本书中的示例时，你可以选择手动输入所有代码，也可以使用随书附带的源代码文件。如前所述，书书中使用的所有源代码都可以从[`www.wrox.com`](http://www.wrox.com)\
  \ 下载。访问该网站后，只需找到书名（使用搜索框或主题列表之一），并点击 `Download Code` 链接。然后，你可以选择以一个大型 Zip 文件下载书中的所有代码，或仅下载特定章节所需的代码。\n\
  \n下载代码后，只需使用你喜爱的压缩工具对其解压即可。或者，你也可以前往 Wrox 代码下载主页[`www.wrox.com/dynamic/books/download.aspx`](http://www.wrox.com/dynamic/books/download.aspx)\
  \ 查看本书及所有其他 Wrox 书的可用代码。记住，你可以通过引用书中代码示例的列表编号（例如“Listing 1-2”）来轻松找到你需要的代码。我们在命名大多数可下载代码文件时使用了这些列表编号。未按列表编号命名的列表会附带文件名，以便你可以在下载的代码文件中轻松找到它们。此外，你还可以从[`www.wrox.com/go/SQLServer2012DataSets`](http://www.wrox.com/go/SQLServer2012DataSets)\
  \ 下载我们书中使用的 `AdventureWorks` 和 `Northwind` 数据库版本。\n\n## 勘误\n\n我们尽力确保文本或代码中没有错误。然而，没有人是完美的，错误在所难免。如果你在我们的某书中发现错误（例如拼写错误或错误的代码），若能告诉我们，我们将不胜感激。通过提交勘误信息，你可以为其他读者节省数小时的沮丧；同时，你也在帮助我们提供更高质量的信息。\n\
