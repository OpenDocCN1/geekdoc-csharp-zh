  *\" path=\"ImageHandler.img\" type=\"ImgHandler, App_Code\" />\n```\n\n将 `ImageHandler.img`\
  \ 文件加载到浏览器中，再次，你应该能看到它提供了图像。图 30-6 显示了结果。注意浏览器地址栏中的路径直接指向 `ImageHandler.img` 文件。\n\
  \n![image](img/f1119-01.jpg)\n\n**图 30-6]**\n\n## 总结\n\n本章介绍了创建模块的方法，这些模块允许你与 ASP.NET\
  \ 请求处理管道进行交互。你学习了 HttpModules，它让你能够直接将自己接入 ASP.NET 页面处理管道。提供给 `HttpModule` 的事件赋予了你极大的权力和灵活性，以定制你的应用程序。\n\
  \n你还查看了 HttpHandlers。处理程序允许你完全跳过 ASP.NET 页面处理管道，并对框架提供数据的方式进行完全控制。你学习了如何创建图像处理程序并将其映射到任何扩展名。使用这些\
  \ ASP.NET 功能可以帮助你创建对标准处理具有强大控制力的功能。\n\n# 31\n\n## 异步通信\n\n## 本章内容\n\n*   什么是 async？为什么要使用它？\n\
  *   在 ASP.NET 中使用 async/await 模式\n\n## 本章 WROX 代码下载\n\n请注意，本章中的所有代码示例均可在书籍网站 [www.wrox.com](http://www.wrox.com)\
  \ 的 Download Code 选项卡获取。\n\n构建 Web 应用程序时，最重要的因素之一是应用程序随着流量增加的扩展性如何。消耗大量服务器资源的应用程序扩展性通常不好，这会导致网站无响应且用户体验糟糕。在很多情况下，贵的服务器资源（如线程）正在等待某些\
  \ I/O 调用或等待数据库调的结果。这种操作会阻塞线程处理可能进入的其他请求。\n\n通过遵循异步编程范式，你可以解决大多数此类问题，该范式确保你能够有效利用资源。.NET\
  \ 框架从 .NET 1.0 以来就支持编写异步代码。框架中的异步功能在这些年来已经发生了巨大的演变。\n\n本章探索了这些异步范式，并描述了你如何在 Web\
  \ 应用程序中使用它们。它向你展示如何使用 .NET 4.5 引入的 async/await 模式，并讨论了编写糟糕异步代码的一些陷阱。\n\n### 异步编程\n\
  \n\n\n\n\nWeb 服务器具有有限数量的线程来处理请求。编写异步代码的需求正源于这种限制，以便应用程序能够有效利用这些资源。每当请求到达 `ASP.NET`\
  \ 时，都会从 `CLR` 线程池中分配一个新线程来处理该请求。如果应用程序是同步方式编写的，该线程将忙于处理此请求。如果处理过程的一部分需要等待数据库调用的结果，该线程将处于等待状态，而无法用于处理任何其他请求。现在，如果线程池中的所有线程都被占用，对该网站的任何后续请求将无法被处理，用户将一直等待。这最终会导致网站无响应。\n\
  \n这就是使用异步模式编写应用程序的优势大显身之处。如果同一个应用程序使用 `async` 编写，当线程等待数据库调用的结果时，`ASP.NET` 会将线程归还给线程池，而数据库调用将在另一个线程上进行。归还给线程池的线程现在可以处理应用程序的任何其他传入请求。当数据库调用完成后，应用程序会收到通知，请求随之完成。\n\
  \n### 编写异步代码的时机\n\n在 Web 应用程序中何时编写异步代码的考虑因素与传统的桌面应用程序非常不同。\n\n*   编写桌面应用程序时，编写异步代码的目标是不阻塞\
  \ UI 线程（使应用程序对用户始终有响应），并且在不同的线程上执行任何后台操作（如计算或数据库调用）。桌面应用程序不受应用程序可用线程数量的限制。\n*  \
  \ 编写 Web 应用程序的异步代码时，限制因素是线程池中的线程数量。在 Web 应用程序中编写异步代码的目标是最大化线程能够处理的请求数量。\n\n为 Web\
  \ 应用程序编写异步代码的一个良好经验是：只要你的应用程序需要执行基于 I/O 的网络调用。这包括你需要访问磁盘上的文件、需要调用 Web 服务或需要调用数据库服务器的任何时候。在这些每种情况下，Windows\
  \ 中的 I/O 调用经过了高度优化，并允许 `ASP.NET` 在你的应用程序等待调用结果时收回你的线程来处理其他请求。\n\n编写异步代码的另一种更现代的情况是你的应用程序依赖于长时间的请求。在这种情况下，服务器和客户端之间存在长时间的连接，当某些事件发生时数据会在它们之间传输。这通常用于长轮询（long\
  \ polling）和 HTTP 流传输。在没有数据交换的情况下，你不希望有一个线程在处理此请求，因为没有数据；但一旦发生某些事件，你就希望有一个线程来执行工作。你可以查看第\
  \ 26 章 详细了解这些情况。\n\n### 异步的历史\n\n自 `.NET Framework` 开始支持异步编程以来，处理服务器资源一直是一项挑战。在编写异步代码时，开发者不得不对付增加的复杂性——即编写异步代码带来的概念开销。这使得编写和调试异步代码变得困难，因为当请求切换到不同的线程时，你必须处理线程、回调和同步状态。`.NET\
  \ Framework` 引入了多种尝试为开发者解决这些问题的模式。在 `.NET Framework 4.5` 中，发布了一种名为 `async/await`\
  \ 的新模式，它在让编写和调试异步代码变得简单方面最好。你将在接下来的章节中简要查看所有这些模式。\n\n### 早期异步\n\n在 `.NET 1.0` 中，框架引入了一种名为“异步编程模型”（APM）的模式，也称为\
  \ `IAsyncResult` 模式。在这种模型中，异步操作需要 `Begin` 和 `End` 方法（例如，用于异步写入操作的 `BeginWrite` 和\
  \ `EndWrite`）。\n\n在 `.NET 2.0` 中，引入了“基于事件的异步模式”（EAP）。这种模式需要一个带有 `Async` 后缀的方法，还需要一个或多个事件、事件处理程序委托类型以及派自\
  \ `EventArg` 的类型。列表 31-1 显示了一些同步代码，它发起外部调用下载内容并计算下载的总字节数。\n\n列表 31-2 显示了相同代码在 EAP\
  \ 异步模式下的样子。正如你从列表 31-2 中看到的，代码变得复杂得多。`foreach` 循环必须被打破以手动获取枚举器。代码看起来也是递归的而不是迭代的。这使得理解和调试也变得困难。\n\
  \n### Task 和 TAP\n\n在 `.NET Framework v4.0` 中，引入了“基于任务的异步模式”（TAP）。这种模式使用单个方法来表示异步操作的开始和结束。TAP\
  \ 方法根据相应的同步方法返回 `void` 或类型 `TResult`，返回 `Task` 或 `Task<TResult>`。任务是一个可以独立于程序其他部分执行的操作。从这个意义上说，它在语义上等同于线程，只不过它是一个更轻量的对象，并且没有创建\
  \ OS 线程的开销。与 TAP 一起，`.NET v4.0` 还引入了 `Task` 作为并行的基本单元，并提供了基于 Task 并行库管理任务的丰富支持。你将在本章后面的部分详细查看任务。\n\
  \n### Async/Await\n\n`.NET Framework v4.5` 引入了 `async/await` 模式。`async` 和 `await`\
  \ 关键字是异步编程的核心。通过这两个关键字，你可以像编写同步代码一样编写异步代码。这种模式基于 TAP，并提供了一种良好的异步编程范式。\n\n列表 31-3\
  \ 显示了列表 31-1 中的同步代码使用 async/await 后的样子。\n\n你从列表 31-3 注意到的第一点是，它与列表 31-1 中的同步代码看起来非常相似。控制流没有被改变，也没有回调。这里的异步是通过返回\
  \ `Task<int>` 实现的。\n\n方法也被标记为 `async`，这告诉编译器以特殊方式编译方法，允许代码部分转换为回调，并自动创建一个用于返回结果的\
  \ `Task<int>`。`DownloadTaskAsync` 返回 `Task<byte[]>`，该任务将在数据可用后完成。在这种情况下，在拥有数据之前你不想做任何事情，所以你\
  \ `await` 该任务。\n\n`await` 似乎执行了阻塞调用，但实际上发生的情况是 `await` 将方法的剩余部分作为回调放入并立即返回。当被等待的任务返回时，它会调用回调并从中断的地方继续执行方法。\n\
  \n在到达返回语句之前，代码已经挂起并恢复了多次（由于 `await` 引起），并向调用者返回了 `Task<int>`。\n\n### ASP.NET 中的异步\n\
  \n正如你在前一节中看到的，`.NET Framework` 已经演进到支持异步编程。`ASP.NET` 的异步支持也以同样的速度进行了演进。\n\n\n\n\n\
  \n异步操作可以在两个地方实现——即页面生命周期和应用程序生命周期。开发者可以在页面处理过程中或在 ASP.NET 流水线处理请求时编写异步代码。\n\n在 .NET\
  \ v4.5 中，ASP.NET 异步流水线发生了重大变化，以支持 `async/await` 和 `TAP`。新的流水线是基于任务的（task-based）的，并提供了新的基类，你在编写异步页面、处理器或模块时可以从这些基类进行派生。在深入研究如何在\
  \ ASP.NET 中使用 `async/await` 模式之前，本节将介绍 ASP.NET 如何管理线程。\n\n## 线程池\n\n线程是 Web 服务器上宝贵且有限的资源，因此在设计应用程序时应该明智地使用。当请求到达\
  \ Web 服务器时，它将在 IIS 的集成模式（Integrated Mode）下通过以下流程。`HTTP.sys` 是第一个入口点。`HTTP.sys` 是一个内核级驱动程序，它将请求发布到\
  \ IIS 监听的 I/O 完成端口。IIS 在其自己的线程池的一个线程上获取此请求并调用 ASP.NET。ASP.NET 开始从 `CLR` 线程池处理此线程。一旦请求处理完成并需要向客户端发送响应，响应将从\
  \ `CLR` 线程池切换到 IIS 线程池的线程。\n\n设计成这种流程的原因是为了让系统具有更高的可扩展性和韧性。例如，请求从内核模式（`HTTP.sys`）切换到用户模式（`IIS`），这样\
  \ `HTTP.sys` 就可以处理更多的请求并将它们交给其他监听器（这些监听器可能不是 IIS）。如果请求在单个线程上处理，该请求的死锁或错误可能会导致整个服务器的\
  \ HTTP 服务崩溃。因此，尽管你为上下文切换付出了代价，但内核更可靠带来的益处远大于线程切换的成本。\n\n将请求从 IIS 线程池切换到 ASP.NET\
  \ 线程池的另一个原因是提高 IIS 服务混合静态和动态请求场景的性能。这是 Web 服务器最常见的用例。静态文件被缓存在本地，并由 IIS 静态文件处理器提供（请求根本不会进入\
  \ ASP.NET）。这还允许 IIS 处理其他请求并将它们移交给其他监听器（非 ASP.NET），就像 `HTTP.sys` 的情况。\n\n一旦请求处理完成并准备好发送响应，响应将从\
  \ `CLR` 线程池中的线程切换到 IIS 线程池中的线程。这样做是因为，如果客户端位于低带宽网络上，你不希望在发送响应时阻塞 `CLR` 线程。你希望 `CLR`\
  \ 线程能够返回并处理更多请求。\n\n这些线程池也包含有限数量的线程。IIS 线程池的线程数为为 256，而 `CLR` 线程池每个处理器拥有 100 个线程。因此，你可以想象，如果你的应用程序以同步方式运行，并且通过等待数据库调用结果而占用线程，你很快就会没有足够的线程来处理来自用户的更多请求，你的网站将变得缓慢，从而导致糟糕的用户体验。下一节将介绍在\
  \ ASP.NET 中编写异步代码的几种方法。图 31-1 显示了请求如何通过两个线程池处理的流程。\n\n![image](img/f1126-01.jpg)\n\
  \n**图 31-1**\n\n## 编写异步代码\n\n正如你之前看到的，在 .NET Framework 4.5 中，`async/await` 被引入为编写异步应用程序的模式。为了在\
  \ ASP.NET 中支持这种模式，现有的异步流水线经历了彻底的变革。整个异步流水线现在都是基于任务的。然而，没有改变的是你可以在哪里编写异步代码。你仍然可以使用异步页面、处理器和模块来编写异步代码。在第\
  \ 26 章中，你学习了 HTTP 处理器和模块。本章将介绍你如何使用 `async/await` 编写异步处理器和模块。\n\n### 异步页面\n\n当你的页面正在访问数据库或\
  \ Web 服务的数据时，你应该编写异步页面。在这种情况下，你不希望停止页面生命周期并等待数据库或 Web 服务调的结果。你可以通过如代码列表 31-4 所示所示设置页面指令来告诉\
  \ ASP.NET 以异步方式处理此页面。当你设置此属性时，ASP.NET 将页面的处理从同步流水线切换到异步流水线。\n\n如果你不使用此属性而在页面中使用异步代码，ASP.NET\
  \ 会抛出错误，指示你需要将页面标记为异步。这样做是为了防止竞态态的发生，因为代码是异步的，如果你不将其标记为异步，代码将以同步方式执行并可能导致死锁或竞态。\n\
  \n一旦完成此操作，就可以在页面中编写异步方法。在 ASP.NET 4.5 中，你现在可以编写异步的 `Page_Load` 事件，这在以前是不可能的。代码列表\
  \ 31-5 显示了你如何从 `Page_Load` 异步调用 Web 服务。\n\n虽然你可以这样做，但在大多数情况下不建议使用这种方法。这是因为当你异步执行\
  \ `Page_Load` 时，在异步 `Page_Load` 完成执行之前，页面生命周期不会继续进行。这意味着对 `GetStringAsync()` 的调用将异步发生，但页面生命周期将等待\
  \ `await` 部分完成。在代码列表 31-5 中，代码通过调用 ASP.NET 通用处理器模拟对外部服务的调用。注意代码还使用了 `HttpClient`，这是\
  \ .NET 4.5 中的新类型。\n\n推荐的方法是使用 `RegisterAsyncTask` 在页面中注册并执行异步操作。使用这种方法的益处是，ASP.NET\
  \ 不会停止页面生命周期执行来等待 `Page_Load` 完成，而是会继续执行生命周期直到到达页面的 `PreRender` 事件。`PreRender` 是生命周期中的一个事件，此时所有控件已创建但内容尚未渲染，因此它在你需要时提供了数据绑定的机会。代码列表\
  \ 31-6 显示了你如何使用 `PageAsyncTask` 在 ASP.NET 中定义 `Task`，这是引入的新类型。\n\n### 异步处理器\n\n\
  正如你之前在异步页面时看到的，还有一个新的基类型（`HttpTaskAsyncHandler`）用于使用 `async/await` 编写异步 HTTP 处理器。代码列表\
  \ 31-7 显示了如何编写异步处理器。此示例从网站下载内容并渲染在页面上。\n\n### 异步模块\n\n在 ASP.NET 4.5 中编写异步模块时，你会看到的区别之一是\
  \ ASP.NET 模块中注册任务的方式。ASP.NET 4.5 中有一个新类型 `EventHandlerTaskAsyncHelper`。这是一个接收任务作为输入的辅助类，它会解开异步任务的开始和结束部分，并将它们作为开始和结束处理器传递给你在模块中想要订阅的异步事件。代码列表\
  \ 31-8 显示了你如何使用此辅助类编写异步模块。\n\n#### 取消异步任务\n\n\n\n\n希望你已经很好地了解如何在 ASP.NET 应用程序中编写异步代码。在处理如\
  \ Web 服务和数据库服务器等外部资源时，最常见的场景之一就是获取响应所需的时间。由于这些调用都取决于网络访问的快慢，因此响应时间会有很大差异，在某些情况下，如果服务器宕机，你可能无法获得响应。在这些情况下，你希望应用程序对这些发生的情况具有韧性，并且能够轻松地处理此类情况。你将需要执行的一项常见操作是检查现有任务的状态，如果任务被取消（例如，由于服务器不可用），则采取某些自定义操作。\n\
  \n调用可取消操作的对象（例如通过创建一个新任务）会将令牌（token）传递给对任务执行某些操作的调用者。该操作反过来也可以需要将令牌的副本传递给其他操作。列表\
  \ 31-9 显示了你如何为在页面上运行的异步任务指定超时时间。在这种情况下，如果异步操作的时间超过了 `AsyncTimeout` 值，你将得到一个 `TimeOutException`，你可以在页面中处理该异常。列表\
  \ 31-10 显示了你如何在异步代码中处理此异常。\n\n在前面的列表中，如果对外部 Web 服务的调用超过 1 秒，那么 `GetAsync()` 的调用将超时。代码将抛出一个\
  \ `TimeOutException`，可以在应用程序中处理它，以显示更有意义的错误消息或执行自定义的错误处理。\n\n### 并行性\n\n到为止，你已经了解了编写异步应用程序的优势以及如何在\
  \ ASP.NET 中编写异步代码。通过编写异步代码，你可以高效地利用线程使你的应用程序具有更强的扩展性和响应能力。异步模式还有另一个方面会增加应用程序的执行时间，这被称为\
  \ `parallelism`（并行性）。随着硬件的进步，许多计算机和工作站都具有多个核心，允许同时执行多个线程。自从 .NET Framework 诞生以来，这都是通过对线程和锁的低级操作实现的，这使得应用程序的并行化和调试变得非常困难。\n\
  \n在 .NET Framework 4.0 中，引入了任务来简化并行应用程序的开发，让你编写高效且可扩展的并行代码，而无需处理低级线程。框架引入了各种库，以便在应用程序中更容易编写并行代码。这些库从使基本\
  \ for loops 循环更容易并行化的任务并行库（Task Parallel Library）到并行 LINQ 等。\n\n本节将介绍使用任务将 ASP.NET\
  \ 应用程序并行化的一些基本技术。任务（task）代表可以作为原子单元独立执行的工作单元。你可以组合任务、组合任务、等待任务完成，以及许多此类操作。本节将介绍一个关于如何组合任务以实现并行性的示例。\n\
  \n列表 31-7 展示了等待任务下载网站内容的示例。现在假设你有三个这样的正在运行的任务，并且你想以并行的方式运行它们。列表 31-11 显示了你如何这样做。`Task.WhenAll`\
  \ 将并行执行所有任务，并等待所有任务都执行完毕。\n\n### 服务器配置\n\n使应用程序更具扩展性的最重要的方面之一是调整你的 Web 服务器以发挥其最大价值。当你在\
  \ IIS 上安装 ASP.NET 时，线程池和并发的默认配置设置为支持大多数常见情况，因此它可能满足也可能不满足应用程序的需求。了解这些默认限制是什么以及它们针对什么样的应用程序非常重要。同样重要的是了解你的应用程序需要什么。例如，IIS\
  \ 和 ASP.NET 的默认配置不适用于构建实时应用程序，因为实时应用程序需要维护长时间的服务器连接，并且服务器需要针对高并发和高延迟调用进行优化。本节将介绍你可以在\
  \ Web 服务器上进行的一些调整，以优化你应用程序的性能。\n\n*   每当你对应用程序的扩展性进行基准测试时，请使用服务器操作系统而不是 Windows\
  \ 8 或 Windows 7 等客户端操作系统，因为客户端操作系统最多支持 10 个并发请求。\n\n*   正如你之前看到的，当请求到达 Web 服务器时，首先由\
  \ `HTTP.sys` 处理。`HTTP.sys` 队列的默认限制是 1000。如果超过此限制，服务器将开始使用 HTTP 状态码 503 进行响应。如果你发现\
  \ 1000 的默认限制太低，可以将其增加到 5000。你可以使用 IIS 管理器为每个应用程序池配置此设置。\n\n*   如果你的应用程序通过 HTTP 使用\
  \ Web 服务，你可能需要更改 `connectionManagement/maxconnection` 元素。对于 ASP.NET 应用程序，该值限制为 CPU\
  \ 数量的 12 倍。这意味着在四处理器处理器上，你到端点最多可以 12 * 4 = 48 个并发连接。你可以在应用程序启动事件中通过更改 `System.Net.ServicePointManager.DefaultConnectionLimit`\
  \ 属性的 `maxconnection` 来更改此设置。\n\n*   你还知道 ASP.NET 用于处理托管请求的 CLR 线程池。该线程池的并发有一个限制。这意味着如果应用程序以异步方式执行，请求数可能会超过线程数。你可以通过设置\
  \ `web.config` 中的 `MaxConcurrentRequestsPerCPU` 来控制此并发限制。该设置的默认限制为 5000，对于大多数应用程序都是足够的，但如果你正在构建一个具有异步处理或长时间请求的应用程序，你应该考虑增加此限制以使应用程序优化运行。\n\
  \n### 使用异步的陷阱\n\n到为止，你已经看到了在应用程序中使用异步处理的优势。它确实让你的应用程序更具扩展性和响应能力。然而，有一句名言：“能力越大，责任越大。”虽然异步处理确实提高了应用程序的性能，但如果使用不当，可能会造成混乱。编写得不异步代码会导致竞态条件、线程死锁和同步问题。所有这些问题都很难调试和修复，并会浪费开发人员宝贵的调查时间。在本节中，你将学习编写异步代码时常见的陷阱以及如何避免它们。\n\
  \n*   如果你为 Web 编写异步应用程序，记住何时编写异步代码非常重要。如果应用程序的部分正在对 Web 服务或数据库进行网络调用，并且线程阻塞在等待响应上，你应该使用异步这样线程就不会被阻塞。然而，如果应用程序的部分正在执行计算密集型任务，异步运行它不会给你带来多少收益，因为应用程序将只是从线程池中使用另一个线程来执行相同的操作。事实上，在这种情况下，你可能需要为线程切换付出代价。因此，Web\
  \ 的异步编程与传统的桌面应用程序完全不同，后者的线程数与 Web 服务器相比没有限制。因此，虽然在桌面应用程序中可以在后台任务运行计算密集型操作以保持 UI\
  \ 响应，但这并不适用于 Web 应用程序。\n\n\n\n\n* 当涉及到创建新任务/线程时，最好让框架来创建它们并管理线程的生命周期。应用程序开发者应该使用任务\
  \ API 来管理和组合任务。\n\n* 你可能会访问 ASP.NET 内置对象（如 `Request`、`Context` 等），这并不稀奇。当你编写异步代码时，你并不能确定自己运行在哪个线程上。因此，当你尝试访问内置对象时，可能会在错误的线程上进行访问。如果你使用\
  \ `async/await`，框架会处理这些对象跨线程的同步工作。\n\n* 因为请求在异步处理中可能由多个线程处理，如果你正在使用线程本地存储，那么当请求在处理的不同阶段由不同线程处理时，你可能无法获得变量的的值。如果你确实需要存储本地线程信息，可以使用\
  \ `HttpContext.Current`。\n\n## 总结\n\n在本章中，你了解了异步处理以及你为什么需要它。随着你的应用程序变得越来越流行并吸引更多流量，你需要确保它们具有良好的扩展性。你应该以能够有效利用服务器资源并保持良好性能的方式编写应用程序。\n\
  \n.NET Framework 和 ASP.NET 在支持异步处理方面取得了巨大进步。你了解了编写异步代码的不同模式.NET Framework 4.5 引入了\
  \ `async/await` 模式，使得编写异步代码与编写同步代码相似。这两种方法的代码流看起来非常相似。\n\n当你想要编写异步页面、处理器和模块时，ASP.NET\
  \ 支持 `async/await`。在 ASP.NET 4.5 中，流水线经历了巨大的变化以支持 `async/await`。你还查看了可以在 Web 服务器上进行的一些微调，以使你的应用程序在负载下良好地扩展。\n\
  \n最后，你查看了编写糟糕异步代码的一些陷阱，以及你可以避免这些陷阱的方法。\n\n# 32 构建全球化应用程序\n\n## 本章内容\n\n* 使你的应用程序全球化\n\
  * 定义文化设置（包括服务器端和客户端）\n* 处理本地资源和全局资源\n\n## 本章代码下载\n\n请注意，本章中的所有代码示例都可以作为本章代码下载的一部分，在书籍网站\
  \ `www.wrox.com` 的“Download Code”选项卡中提供。\n\n开发者通常使用他们的原生语言构建 Web 应用程序，随着应用程序观众的增长，他们意识到需要对应用程序进行全球化。当然，理想情况是从一开始就构建\
  \ Web 应用程序以处理国际观众。在许多情况下，由于所需的额外工作，这可能是无法实现的。\n\n全球化（Globalization）和本地化（Localization）都是构建全球化应用程序的重要过程，但这两个术语并不是通用的。它们不是同一种东西。\n\
  \n* *全球化* 被定义为开发应用程序的过程，使其跨多个文化和地区运行。\n* 另一方面，*本地化* 是特定的文化和地区对应用程序进行定制。\n\n值得注意的是，在\
  \ ASP.NET 框架中，人们在解决 Web 应用程序的全球化方面付出了巨大努力。你会很快发现，API 的更改、服务器控件功能的增加，甚至 Visual Studio\
  \ 本身的改进，都让你能够更轻松地完成所需的额外工作，以便将你的应用程序推向国际观众。本章探讨了在为全球构建 Web 应用程序时需要考虑的一些事项。\n\n##\
  \ 文化与地区\n\n在终端用户浏览器中打开 ASP.NET 页面在特定的文化和地区设置下运行。在构建 ASP.NET 应用程序或页面时，其运行定义的文化取决于运行应用程序的服务器提供的文化和地区设置，或者由客户端（终端用户）所应用的设置。默认情况下，ASP.NET\
  \ 在服务器上由各种因素定义的文化设置下运行。\n\n世界由许多文化组成，每种文化都有自己的语言以及一套关于查看和消费数字、使用货币、格式化日期、字母排序等的定义方法。.NET\
  \ Framework 使用意见征求（RFC）`1766` 标准定义（语言标识标记）来定义文化和地区，该标准使用连字符分隔的两个字母代码来指定语言和地区。表 32-1\
  \ 提供了一些文化定义的示例。\n\n| 文化代码 | 描述 |\n| --- | --- |\n| en-US | 英语；美国 |\n| en-GB | 英语；英国（大不列颠）\
  \ |\n| en-AU | 英语；澳大利亚 |\n| en-CA | 英语；加拿大 |\n| fr-CA | 法语；加拿大 |\n\n**表 32-1**\n\
  \n查看此表中的示例，你可以看到定义了四种不同的文化。这四种文化之间既有相似之处也有不同之处。所有四种文化都说同一种语言（英语）。因此，每个文化设置中都使用了语言代码\
  \ `en`。在语言设置之后是地区设置。尽管这些文化说同一种语言，但通过设置它们的地区（例如 `US` 代表美国，`GB` 代表英国，`AU` 代表澳大利亚，`CA`\
  \ 代表加拿大）来进一步区分它们是非常重要的。你可能已经意识到，美国的英语与英国使用的英语略有不同，以此此类推。除了语言之外，日期和数值表示方式也存在差异。这就是为什么文化的语言和地区被放在一起呈现。\n\
  \n差异不仅按国家划分。许多国家包含多种语言，并且每个地区对日期和其他项目的表示法都有自己的偏好。例如，`en-CA` 指定了加拿大的英语使用者。因为加拿大不仅是一个英语国家，它还包含了针对法语加拿大人的\
  \ `fr-CA` 文化设置。\n\n### 理解文化类型\n\n你刚刚看到的文化定义被称为*特定文化*（specific culture）定义。这种定义是最详尽的——同时定义了语言和地区。另一种类型的文化定义是*中性文化*（neutral\
  \ culture）定义。每个特定文化都有一个关联的中性文化。例如，上表所示的英语文化是分开的，但它们都属于同一个中性文化 `EN`（英语）。图 32-1 所示图展示了这些文化类型之间的相互关系。\n\
  \n![image](img/f1136-01.jpg)\n\n**图 32-1**\n\n从图中你可以看到，许多特定文化属于一个中性文化。在中性文化之上的层次是*不变文化*（invariant\
  \ culture），这是一种与无关的文化设置，在网络上的物理机器之间传递项目（如日期和数字）或在存储数据时应使用。在执行此类操作时，请确保你的后端数据流不包含用户特定的文化设置。相反，应在应用程序的业务层和表示层应用这些设置。\n\
  \n\n\n\n\n此外，在开发应用程序时，请注意中性区域（neutral culture）。你不可避免地会构建出更多依赖于中性区域而非特定区域的应用程序。例如，如果你的应用程序有一个西班牙语版本，可能会将此版本提供给所有西班牙语使用者，无论他们所在的地区。在许多应用程序中，西班牙语使用者来自西班牙、墨西哥还是阿根廷并不重要。在确实会有差异的情况下，请使用特定的区域设置。\n\
  \n### ASP.NET 线程\n\n当终端用户请求 ASP.NET 页面时，该网页将在线程池的一个线程上执行。该线程关联着一个区域（culture）。你可以通过程序化的获取线程的区域信息，然后检查有关该区域的特定细节，如列表\
  \ 32-1 所示（在本章代码下载包中的 `ViewCultureInfo.aspx.cs` 和 `ViewCultureInfo.aspx.vb`）。\n\n\
  `Page_Load` 事件中的这段代码检查了 `CurrentCulture` 属性。你可以将此值的结果存放在 `CultureInfo` 对象中。要访问此对象，你需要在\
  \ Web 中导入 `System.Globalization` 命名空间。`CultureInfo` 对象包含许多属性，可以为你提供特定的区域信息。以下项目通过一系列简单的\
  \ `Response.Write` 语句显示，仅是实际可用内容的一小部分采样。运行此页面产生的结果与图 32-2 所示所示。\n\n![image](img/f1138-01.jpg)\n\
  \n**图 32-2**\n\n从图中可以看出，`en-US` 区域是 ASP.NET 线程执行时的默认设置。除了这些信息外，你还可以使用 `CultureInfo`\
  \ 对象获取关于区域的许多其他描述性信息。\n\n你可以始终通过新实例化 `CultureInfo` 对象提供的重载方法更改线程的区域，如列表 32-2 所示（在本章代码下载包中的\
  \ `ChangeCulture.aspx.cs` 和 `ChangeCulture.aspx.vb`）。\n\n在此示例中，仅添加了一行代码，将 `CultureInfo`\
  \ 对象的新实例赋值给由 ASP.NET 执行的线程的 `CurrentCulture` 属性：\n\n```\nSystem.Threading.Thread.CurrentThread.CurrentCulture\
  \ = new CultureInfo(\"th-TH\")\n```\n\n区域设置允许 `CultureInfo` 对象定义你想要使用的区域。在这种情况下，分配了泰国的泰语，产生了如图\
  \ 32-3 所示的结果。\n\n![image](img/f1139-01.jpg)\n\n**图 32-3**\n\n从图中可以看出，.NET Framework\
  \ 甚至提供了所用语言的本地名称，即使它不是基于拉丁字母的字体。在这种情况下，显示的是泰国泰语的结果，以及与该区域关联的一些属性（例如，与西欧和美国使用的日历完全不同的历）。请记住，你使用\
  \ `System.Globalization` 命名空间来获取 `CultureInfo` 对象。\n\n### 服务器端区域声明\n\nASP.NET 允许你轻松定义用于整个\
  \ ASP.NET 应用程序或应用程序中特定页面的区域。你可以通过适当的配置文件为你的任何 ASP.NET 应用程序指定区域。在 ASP.NET 的默认安装中，没有指定任何区域，当你查看位于\
  \ ASP.NET 4.5 CONFIG 文件夹（`C:\\WINDOWS\\Microsoft.NET\\Framework\\ v4.0.30319\\CONFIG`）中的全局\
  \ `web.config.comments` 文件（用于文档目的）时可以明显看出。在 `web.config.comments` 文件中你可以找到配置文档的\
  \ `<globalization>` 部分，如列表 32-3 所示。\n\n注意加粗表示的两个属性：`culture` 和 `uiCulture`。`culture`\
  \ 属性允许你定义用于处理传入请求的区域，而 `uiCulture` 属性允许你定义处理应用程序中任何资源文件所需的默认区域。（这些属性的使用将在本书稍后部分介绍。）\n\
  \n当你查看列表 32-3 中的配置声明时，可以看到区域设置未指定任何内容。在服务器上指定区域时，你拥有的选项是在前面提到的 CONFIG 文件夹中的服务器版本\
  \ `web.config` 文件中定义此区域。这将导致此服务器上的每个 ASP.NET 4.5 应用程序采用这一特定的区域设置。另一个选项是在应用程序的 `web.config`\
  \ 文件中指定这些设置，如列表 32-4 所示。\n\n在这种情况下，仅为此 ASP.NET 应用程序建立的区域是俄罗斯的俄语。除了在服务器级或应用程序级设置区域外，另一个选项是在页面级设置区域，如列表\
  \ 32-5 所示。\n\n此示例确定了仅为此 ASP.NET 应用程序使用的俄语和区域设置。你可以通过使用此 `@Page` 指令和一个简单的日历控件来看到这一点。项目中包含了一个名为\
  \ `Calendar.aspx` 的页面来演示页面区域。图 32-4 显示了输出。\n\n![image](img/f1141-01.jpg)\n\n**图\
  \ 32-4**\n\n### 客户端声明\n\n除了使用服务器端设置定义 ASP.NET 页面的区域外，你还可以根据客户端在浏览器实例中设置的偏好来定义区域。\n\
  \n当终端用户安装微软 Internet Explorer 以及其他某些浏览器时，他们可以选择按特定顺序选择偏好的区域（如果他们选择了多个区域）。若要在 Windows\
  \ 8 的 IE 上查看此操作，从菜单中选择 ![image](img/Ar.jpg) Internet 选项。在通用选项卡上，你会看到对话框底部有一个语言按钮点击此按钮将弹出语言偏好对话框。在语言偏好对话框中，点击“设置语言偏好”按钮。这将打开控制面板中的语言偏好设置，如图\
  \ 32-5 所示。\n\n![image](img/f1141-02.jpg)\n\n**图 32-5**\n\n在此图中，你可以看到有两种语言。要在列表中添加任何语言，请选择“添加语言”并从列表中选择语言。如果该语言有多个区域变体，你就可以选择所需的特定区域变体。语言和区域变体的组合成了区域。在你添加了所需的区域后，你可以选择你偏好使用的顺序。在图\
  \ 32-5 的情况下，美国英语区域被确认为最偏好的区域，而意大利意大利语区域被选为第二偏好。具有此设置的用户将获得应用程序的美国英语语言版本；如果没有美国英语版本，则提供意大利语版本。\n\
  \n\n\n\n\n在终端用户选择了区域后，你可以使用 `ASP.NET 4.5` 提供的自动功能。你不需要在任何配置文件或 `@Page` 指令中指定特定的区域，而是声明\
  \ `ASP.NET` 应该自动选择由请求页面的终端用户所提供的区域。你可以通过 `auto` 关键字来实现这一点，如 列表 32-6 所示。\n\n在页面中使用此指令后，日期、日历和数字现在将以请求者偏好的区域格式显示。然而，当你为应用程序提供已翻译为其他区域规范的资源文件时，就会出现一个复杂的问题。如果你只有特定的翻译，无法处理返回到你的\
  \ `ASP.NET` 页面的所有可能的区域怎么办？在这种情况下，如果 `ASP.NET` 无法找到用户的特定区域设置，你可以指定 `auto` 选项以及一个额外的回退（fallback）选项。列表\
  \ 32-7 显示了该回退选项用法。\n\n在这种情况下，将利用自动检测，但如果终端用户偏好的区域不存在，则将使用 `en-US`。\n\n### 翻译值和行为\n\
  \n在你的 `ASP.NET` 应用程序全球化的过程中，你可能会发现许多操作与构建不包含全球化的应用程序不同，包括日期的表示方式和货币的显示方式。接下来的部分将涉及这些主题中的某些。\n\
  \n### 理解日期的差异\n\n不同区域对日期和时间的规定非常不同。例如，以以下日期为例：\n\n```\n08/11/2013\n```\n\n这个日期具体是什么？取决于你所在的特定区域，它可能是\
  \ 2013 年 8 月 11 日，也可能是 2013 年 11 月 8 日。由于此类情况，在数据库或其他存储系统中存储日期/时间戳等值时，你应该始终对这些项目使用相同的区域（或不变区域，invariant\
  \ culture），以避免转换中的任何错误。将这些项目转换为供终端用户使用的应该是业务逻辑层或表示层的工作。\n\n在服务器级别或在 `@Page` 指令中设置区域可以使\
  \ `ASP.NET` 为你完成这些转换。你也可以简单地为运行 `ASP.NET` 的线程分配一个新的区域。列表 32-8 显示了一个页的代码，该页面更改当前线程的区域以便以不同的区域显示日期/时间数据（该章节代码下载中的\
  \ `DateAndTime.aspx.cs` 和 `DateAndTime.aspx.vb`）。\n\n此代码构建了一个 `DateTime` 变量并利用四个不同的区域向浏览器显示该值。图\
  \ 32-6 显示了执行此代码的结果。\n\n![image](img/f1144-01.jpg)\n\n**图 32-6**\n\n如你所见，用于表示日期/时间值的格式彼此存在巨大差异，其中一个区域——泰国文化（`th-TH`）甚至使用完全不同的历法，将\
  \ 2012 年显示为 2553 年。\n\n### 理解数字和货币的差异\n\n除了日期/时间值外，不同区域数字构造方式也大不相同。为什么不同区域会有不同的表示方式？嗯，这与数字本身的关系较小（尽管某些区域使用不同的数字符号），更多取决于如何使用数字分隔符来表示小数或显示千、百万等金额。例如，在美国的英语文化（`en-US`）中，你会看到数字以如下方式表示：\n\
  \n```\n5,123,456.00\n```\n\n从这个示例可以看出，`en-US` 区域使用逗号作为千位分隔符，使用句号表示任何小数的开始。当与其他区域一起工作时，这个数字看起来就完全不同。列表\
  \ 32-9 显示了在其他区域表示数字的示例（该章节代码下载中的 `Numbers.aspx.vb` 和 `Numbers.aspx.cs`）。\n\n运行此示例将产生\
  \ 图 32-7 所示的结果。\n\n![image](img/f1146-01.jpg)\n\n**图 32-7**\n\n从这个示例中，你可以看到这里列出的其他区域显示的数字格式与\
  \ `en-US` 区域的格式完全不同。图中列出的第二个区域 `vi-VN`（越南的越南语）构造数字的方式与 `en-US` 中的构造方式完全相反。越南语使用句点作为千位分隔符，使用逗号表示小数。另一方面，芬兰语使用空格作为千位分隔符，使用逗号作为小数分隔符。最后，说德语的瑞士人使用高逗号分隔千位，使用句号作为小数分隔符。如你所见，将数字“翻译”为正确的构造方式，以便你的应用程序用户能够正确理解所表示的数字是非常重要的。\n\
  \n货币也使用数字表示。在金额方面，确保数字在不同区域中正确显示不仅是视觉呈现的问题，也是为了确保表示了正确的值。\n\n每个区域都有独特的货币符号来表示数字。在金额的情况下，确保确保表示的数字是正确的货币值。例如，`en-US`\
  \ 区域以以下格式表示货币：\n\n```\n$5,123,456.00\n```\n\n`en-US` 区域使用美元符号（$`），符号的位置与符号本身同样重要。对于\
  \ `en-US`，`$` 符号直接位于金额之前，符号与字符之间没有空格。其他区域使用不同的符号来表示货币，并通常将这些货币符号放在不同的位置。更改之前的 列表\
  \ 32-9，使其现在以货币表示数字。列表 32-10 展示了必要的更改（该章节代码下载中的 `Currency.aspx.vb` 和 `Currency.aspx.cs`）。\n\
  \n执行页面以查看这些区域如何表示货币。结果如 图 32-8\n\n**图 32-8**\n\n从图中你可以看到，不仅数字之间的构造方式完全不同，货币符号以及符号相对于数字的位置也大不同。\n\
  \n由于货币代表实际资金，在在全球化应用程序中展示货币时，你承担着额外的责任。修改用于显示货币的区域并不会转换该值。它只是以不同的方式显示同一个数字。例如，假设你在页面中将区域设置为\
  \ `auto`，从而显示用户指定的区域。如果你在页面上显示的是美元的货币值，而用户指定的页面区域是芬兰语，那么货币值将是错误的。该值将显示为欧元，但实际值并未从美元转换为欧元。为了避免任何混淆，你可以覆盖所显示货币的区域。列表\
  \ 32-11 显示了如何指定显示货币值时使用的区域。\n\n### 理解字符串排序的差异\n\n\n\n\n全球化影响的不仅仅是数字、货币以及日期和时间的显示。它还可能影响各种编程行为。文化设置可以应用于字符串排序等操作。通常情况下，大多数文化以相同的方式排序字符串，但在排序方式上存在某些差异。列表\
  \ 32-12 显示了对某些字符串数据进行排序的页面代码（在章节的代码下载中对应 `SortingEN.aspx.vb` 和 `SortingEN.aspx.cs`）。该排序操作在\
  \ `en-US` 文化下进行。\n\n在这个示例中，按随机顺序创建了一个包含世界各国首都的泛型列表。然后调用了泛型 `List(Of String)` 对象的\
  \ `Sort()` 方法。此排序操作根据运行 ASP.NET 线程的所定义文化的排序方式对字符串进行排序。列表 32-12 显示了针对 `en-US` 文化的排序执行结果。图\
  \ 32-9 显示了此操作的结果。\n\n![image](img/f1150-01.jpg)\n\n**图 32-9**\n\n根据你特定的文化，结果可能是你预期的。然而，在某些其他文化中，字符串数据的排序方式存在差异。要查看这一点，请修改列表\
  \ 32-12 中的代码，将文化设置为芬兰语。修改后的新代码如列表 32-13（在章节的代码下载中对应 `SortingFI.aspx.vb` 和 `SortingFI.aspx.cs`）。\n\
  \n当你将文化更改为芬兰设置并执行此新代码时，你将得到图 32-10 所示的结果。\n\n![image](img/f1151-01.jpg)\n\n**图 32-10**\n\
  \n如果你检查图 32-10 中的芬兰文化排序结果与图 32-9 中的美国英语文化之间的差异，你会发现维也纳（Vienna）市在排序顺序中的位置不同。在芬兰语中，字母\
  \ `V` 和字母 `W` 之间没有区别。由于没有差异，如果你使用芬兰文化设置进行排序，那么 `Vi` 会在 `Wa` 之后，因此在排序操作的字符串列表中，维也纳排在最后。\n\
  \n## ASP.NET 4.5 资源文件\n\n在使用 ASP.NET 时，创建本地化 Web 页面最有效的方法之一是使用资源（resources）来处理页面上基于用户语言和文化的文本。你可以创建属性并将其存储在资源对象（如资源文件）中。。然后，ASP.NET\
  \ 可以在运行时根据用户的语言和文化选择正确的属性。这些属性不仅限于文本。资源文件还可以存储其他类型的元素，例如图像。资源文件是具有 `.resx` 扩展名的\
  \ XML 文件。Visual Studio 2012 提供了处理资源文件的工具。资源文件可以作为本地资源和全局资源存储。全局资源文件放在应用程序根目录下的预留文件夹\
  \ `App_GlobalResources` 中。`App_GlobalResources` 文件夹中的文件具有全局范围，其属性可以被多个 ASP.NET 页面使用。本地资源文件放在一个或多个具有预留名称\
  \ `App_LocalResources` 的文件夹中。与根 `App_GlobalResources` 文件夹不同，`App_LocalResources`\
  \ 文件夹可以是应用程序中的任何文件夹。通过特定的命名约定，本地资源文件与一个 ASP.NET 页面关联。\n\n### 利用本地资源\n\n你会惊讶于可以如何轻松地构建\
  \ ASP.NET 页面使其本地化为其他语言。要利用存储在资源文件中的资源，你只需像通常一样构建 ASP.NET 页面。然后使用 Visual Studio 2012\
  \ 中的工具同时创建资源文件并修改你的页面以利用它。\n\n为了查看操作演示，请构建列表 32-14 所示的简单 ASP.NET 页面（在章节的代码下载中对应\
  \ `LocalResources.aspx`）。\n\n该页面是一个小型 ASP.NET 页面，包含几个 `Label` 控件以及一个 `TextBox` 和\
  \ `Button` 控件。页面上需要注意的关键点是生成文本的元素。第一个标签、按钮甚至页面的标题都包含显示给用户的文本。如果这些文本能根据查看页面的文化而变化，那就太好了。这正是资源文件大显身场的地方。你可以使用\
  \ Visual Studio 2012 中的工具完成所有初始工作，将你的 Web 页面转换为使用资源文件本地化。确保你的页面当前在设计视图（Design view）中查看，然后从\
  \ Visual Studio 菜单选择工具 ![image](img/Ar.jpg) `Generate Local Resource`（生成本地资源）。请注意，此菜单选项仅在页面的设计视图可用。它在页面的分割视图（Split\
  \ view）或代码视图（Code view）中无效。\n\n选择 `Generate Local Resource` 后，Visual Studio 会对你的项目进行若干更改。如果你还没有\
  \ `App_LocalResources` 文件夹，项目将会创建一个。一个资源文件被放置在新文件夹中。该本地资源文件的命名基于 ASP.NET 页面的名称，并遵循\
  \ `pageOrControlName.extension.language.resx` 或 `pageOrControlName.extension-culture.resx`\
  \ 模式。如果资源文件用于不变文化（invariant culture），则文件的*语言和文化*部分将被排除。例如，如果你正在处理 `LocalResources.aspx`\
  \ 页面，资源文件将命名为 `LocalResources.aspx.resx`。注意此资源文件是用于不变文化的。图 32-11 显示了这些对项目的更改。\n\n\
  ![image](img/f1154-01.jpg)\n\n**图 32-11**\n\n如果你打开资源文件，将看到资源编辑器（Resource Editor）。你可以看到每个属性都有一个\
  \ `Name`、`Value` 和 `Comment` 字段。图 32-12 显示了 Visual Studio 为你创建的并在资源编辑器中打开的文件。\n\n\
  ![image](img/f1154-02.jpg)\n\n**图 32-12**\n\nVisual Studio 搜索了页面中具有可翻译属性的每个控件，并在资源文件中为每个属性创建了条目。它甚至包含了你在页面中未填充的几个属性的条目。注意，如图\
  \ 32-12 所示，页面控件的每个文本值都已添加到资源文件中。这些条目中的每一个都获得了一个可以在页面中引用的名称。\n\n除了创建并将资源文件添加到本地资源文件夹之外，Visual\
  \ Studio 还对页面进行了一些修改。列表 32-15 显示了 Visual Studio 更改后的页面（在章节的代码下载中对应 `LocalResourcesAfter.aspx`）。\n\
  \n\n\n\n你可以从修改后的代码中看到，`@Page` 指令添加了 `Culture` 和 `UICulture` 属性，其值为 `auto`，使得该应用程序能够本地化。`meta:resourcekey`\
  \ 属性及其关联值已分别添加到 `Page` 指令以及之前提到的每个控件中，并赋予了可翻译的值。分配给每个 `meta:resourcekey` 属性的值是为您创建的资源文件中的名称。在插图\
  \ 32-12 中，`Button1` 控件有两个在资源文件中定义了属性：`Text` 和 `ToolTip`。`Text` 属性的值是从页面中提取的。资源文件中这两个条目的名称以\
  \ `Button1Resource1` 开头，并原始属性的名称结尾。查看 Visual Studio 修改后页面中的 `Button` 控件。该按钮控件的 `meta:resourcekey`\
  \ 值已设置为 `Button1Resource1` 前缀：\n\n```\n <asp:Button ID=\"Button1\"\n   runat=\"\
  server\" Text=\"Submit Name\"\n   meta:resourcekey=\"Button1Resource1\" />\n```\n\
  \n资源文件中所有使用此前缀的属性（如 `Text` 和 `ToolTip` 属性）在运行时会自动应用到此按钮控件。\n\n### 添加另一种语言资源文件\n\n\
  `LocalResources.aspx.resx` 文件用于不变文化（invariant culture）。如果无法确定页面的文化，则将使用不变文化的资源。你可以根据需要支持的文化添加任意数量的资源文件。为\
  \ `LocalResources.aspx` 页面添加另一个处理另一种语言的资源文件，你可以将 `LocalResources.aspx.resx` 文件复制并粘贴到相同的\
  \ `App_LocalResources` 文件夹中。重命名它以指定你针对的语言和文化。假设你想创建一个针对芬兰语（Finnish culture）的资源文件，你将把文件命名为\
  \ `LocalResources.aspx.fi-FI.resx`。修改资源文件中的以下值以支持芬兰语：\n\n```\n Button1Resource1.Text\
  \   Lähetä Nimi\n  Label1Resource1.Text    Mikä sinun nimi on?\n  PageResource1.Title\
  \     Näytesivu\n```\n\n在不变文化文件和芬兰语资源文件中都添加一个新条目。该条目稍后演示如何通过程序访问资源条目时将使用。将条目命名为\
  \ `Label2Answer`。该条目的值随文化而异。不变文件中条目的价值为：\n\n```\n Hello\n```\n\n芬兰语文件中的条目值为：\n\n\
  ```\n Hei\n```\n\n### 通过程序化访问资源属性\n\n你不仅可以使用之前描述的属性命名约定自动将某些资源应用到页面，还可以通过程序化引用资源。代码列表\
  \ 32-16 显示了在添加引用 `Label2Answer` 资源条目的代码后的服务器脚本块（本章代码下载包中的 `LocalResourcesCustom.aspx`）。\n\
  \n你可以使用 `GetLocalResourceObject` 方法访问资源文件中的属性。`GetLocalResourceObject` 是 `HttpContext`\
  \ 类上的一个方法。使用 `GetLocalResourceObject` 时，你只需使用条目的名称作为参数即可：\n\n```\n GetLocalResourceObject(\"\
  Label2Answer\")\n```\n\n你同样可以使用相同的方法程序化地从资源文件中获取任何控件的属性值：\n\n```\n GetLocalResourceObject(\"\
  Button1Resource1.Text\")\n```\n\n在应用了代码列表 32-16 的新脚本块并完成资源文件后，你可以运行页面，在文本框中输入名称然后点击按钮获取响应。结果如插图\
  \ 32-13 所示。![image](img/f1157-01.jpg)\n\n**插图 32-13**\n\n在执行 `LocalResourcesCustom.aspx`\
  \ 页面时，浏览器设置为 en-US 文化。由于没有 en-US 文化资源文件，ASP.NET 会寻找 EN 中性文化文件。由于没有 EN 中性文化文件，ASP.NET\
  \ 默认使用不变文化资源文件。不变文化资源文件中 `Label2Answer` 条目的值为“Hello”。\n\n如果你在 IE 中或页面指令中将语言偏好设置为\
  \ fi-FI，可以再次执行页面，你将看到页面的芬兰语版本。插图 32-14 显示了使用芬兰文化查看的相同页面。\n\n![image](img/f1158-01.jpg)\n\
  \n**插图 32-14**\n\n你可以看到，所有在芬兰语资源文件中翻译并放置的控件属性都被 ASP.NET 自动利用，包括 IE 标题栏中显示的页面标题。此外，程序化访问的\
  \ `Label2Answer` 条目也是从芬兰文化资源文件中访问的。\n\n### 中性文化通常更受青睐\n\n目前为止你只使用了不变资源文件或指定了语言和文化的资源文件。示例代码中的\
  \ `LocalResourcesCustom.aspx.fi-FI.resx` 文件指定了语言和文化，即在芬兰使用的芬兰语。另一种选项是让此文件不针对特定文化，而是针对中性文化。要实现这一点，你只需将文件重命名为\
  \ `LocalResourcesCustom.aspx.fi.resx`。在本例中，声明特定的文化并没有意义，因为没有其他国家使用芬兰语。对于德语、西班牙语或法语等语言是有意义的。这些语言在多个国家使用。例如，如果你为\
  \ `LocalResources.aspx` 页面准备一个西班牙语版本，你完全可以为特定文化构建一个，如 `LocalResources.aspx.es-MX.resx`。该文件将用于墨西哥西班牙语。然而，如果用户以\
  \ es-ES 请求页面，ASP.NET 将回退到不变文化资源文件。在这种情况下，创建一个文化中性的资源文件更好，这样任何使用西班牙语的用户都将使用西班牙语资源文件。如果你拥有\
  \ `LocalResources.aspx.es.resx` 文件，无论终端用户的首选设置为 es-MX、es-ES 还是 es-AR，用户都会获得 ES 中性文化页面。\n\
  \n### 使用全局资源\n\n本地资源由 ASP.NET 中的特定页面利用。你还可以创建跨多个页面使用的全局资源。要创建一个可在整个应用程序使用的资源文件，你必须先为全局资源创建一个文件夹。在\
  \ Visual Studio 的解决方案资源管理器右键点击项目并选择添加![image](img/Ar.jpg) 添加 ASP.NET 文件夹![image](img/Ar.jpg)\
  \ App_GlobalResources。现在你可以直接将全局资源文件添加到此文件夹中。右键点击 `App_GlobalResources` 文件夹并选择添加![image](img/Ar.jpg)\
  \ 资源文件。将文件命名为 `Resources.resx`。与本地资源文件类似，该文件是不文化的全局资源文件。在资源编辑器中打开 `Resources.resx`\
  \ 文件并添加单个字符串条目。将条目命名为 `PrivacyStatement`。为条目的值创建一个任意长字符串。由于这是文件的不变文化版本，请创建一个芬兰文化版本。将文件命名为\
  \ `Resources.fi-FI.aspx`。添加相同的 `PrivacyStatement` 条目，但赋予它不同的任意值。\n\n\n\n\n全局资源文件的理念是可以在整个应用程序中访问这些资源。你可以通过多种方式获取放置在这些文件中的值。第一种是在服务器控件的属性中声明式地访问该值。这与你在本章较早之前访问本地资源的方法类似。向项目中添加一个名为\
  \ `GlobalResources.aspx` 的新 Web 表单。在表单上添加一个 Label 控件。Listing 32-17（本章代码下载中的 GlobalResources.aspx）中的代码显示了该文件的完整\
  \ VB 版本，其中在 label 中声明了用于访问资源的代码。\n\n要访问 `PrivacyStatement` 的全局资源条目，你使用关键字 `Resources`\
  \ 后跟冒号。然后，指定资源文件的名称。在这种情况下，资源文件的名称为 `Resource`，它指向 `Resource.resx` 和 `Resource.fi-FI.resx`\
  \ 文件。在指定了要使用的特定资源文件后，指定特定的条目，在本例中为 `PrivacyStatement`。\n\n实现相同结果另一种方法是使用 Visual\
  \ Studio 2012 内置的对话框。在 `GlobalResources.aspx` 中添加另一个 Label 控件。在设计视图中突出此新 label 控件，使控件出现在属性窗口中。从属性窗口中，点击\
  \ Data 部分中 `Expressions` 属性内的按钮。这将启动 Expressions 对话框，并允许你将 `PrivacyStatement` 值绑定到\
  \ label 控件的 `Text` 属性。在可绑定属性列表中突出 `Text` 属性。从对话框右侧的 Expression 类型下拉列表中选择 Resources\
  \ 表达式选项。一旦你选择了 Resources 选项，你就需要输入 `ClassKey` 和 `ResourceKey` 属性。`ClassKey` 是应该使用的文件名。在本例中，文件是\
  \ `Resource.resx`，因此 `ClassKey` 将是 `Resource`。`ResourceKey` 是资源文件中的条目名称。输入 `PrivacyStatement`\
  \ 作为 `ResourceKey` 的值。图 32-15 显示了带有正确条目的 Expressions 对话框。\n\n![image](img/f1160-01.jpg)\n\
  \n**图 32-15**\n\nVisual Studio 的一个很棒特性是，通过全局资源提供的资源可以以强类型的方式使用。例如，你可以使用 Listing\
  \ 32-18（本章代码下载中的 GlobalResources.aspx.vb 和 GlobalResources.aspx.cs）所示的代码程序化地访问全局资源值。\n\
  \n在 图 32-16 中，你可以看到对这些资源值拥有完整的智能提示（IntelliSense）。\n\n![image](img/f1161-01.jpg)\n\
  \n**图 32-16**\n\n## 总结\n\n将你的 ASP.NET 应用程序全球化非常有价值，以便它们能够处理多种文化。随着越来越多的来自多个国家的用户使用多种语言访问\
  \ Web 应用程序，添加多文化支持变得日益重要。本章探讨了你在全球化应用程序时面临的一些问题，以及 Visual Studio 2012 和 .NET Framework\
  \ 提供的某些内置工具，以使这一过程变得更容易。\n\n至少，将应用程序全球化只需获取现有的 ASP.NET 页面并运行 Visual Studio 提供的工具对其进行修改，使其能够接受多种翻译即可简单。\n\
  \n# 33 ASP.NET 应用程序的打包与部署\n\n### 本章内容包括？\n\n*   理解打包和部署的基础知识\n*   选择部署方法\n*   使用发布配置文件\n\
  *   部署到 Windows Azure\n\n## 本章的 WROX.COM 代码下载\n\n请注意，本章由于关注于 ASP.NET 应用程序的打包和部署，因此没有对应的代码下载。\n\
  \n打包和部署 ASP.NET 应用程序通常很少很少关注的话题。本章更深入地探讨了在构建之后你如何打包和部署你的 ASP.NET 应用程序。在开发计算机上开发好\
  \ ASP.NET 应用程序后，你需要将完成品部署到质量保证服务器或阶段服务器，最终部署到生产服务器上。\n\n考虑正确打包和部署你的 ASP.NET 应用程序的一个重要原因是，许多应用程序是作为销售产品、启动器包或解决方案构建的。在这种情况下，你可能需要允许完全陌生的用户在你完全无法控制的环境中下载并安装这些产品。如果是这样，给消费者一个单一的安装程序文件以确保应用程序在任何环境中都能正确安装是理想的。\n\
  \n尽管如此，无论你是否将在公司外发布你的 Web 应用程序，你仍然需要一种将其部署到另一个服务器的方法以便在生产部署之前进行测试。你永远不要假设仅仅因为它在你的电脑上可以运行它就是完美的。大多数时候，你只是在\
  \ Visual Studio 中使用 IIS Express 开发，因此在假设 IIS 进行完整测试之前，你不能认为一切无事。即使你在电脑上使用 IIS 进行了测试，在应用程序上线之前，部署相关的因素仍需要解决并经过充分测试。\n\
  \n## 部署组件\n\n那么你实际上在部署什么？ASP.NET 包含许多可能是应用程序的组成部分。以下列表详细说明了一些可能属于应用程序并需要随之部署的项：\n\
  \n*   `.aspx` 页面\n*   aspx 页的代码文件 (`.aspx.vb` 或 `.aspx.cs`)\n*   用户控件 (`.ascx`)\n\
  *   Web 服务 (`.asmx` 和 `.wsdl`)\n*   `.htm` 或 `.html` 文件\n*   图像文件，如 `.jpg` 或 `.gif`\n\
  *   ASP.NET 系统文件夹，如 `App_Code` 和 `App_Themes`\n*   JavaScript 文件 (`.js`)\n*   层级样式表\
  \ (`.css`)\n*   配置文件，如 `web.config`\n*   .NET 组件和程序集\n*   数据文件，如 `.mdf`\n*   IIS\
  \ 设置\n*   HTTP 处理器和模块\n\n## 部署前的准备工作步骤\n\n在部署你的 ASP.NET Web 应用程序之前，你应该采取一些基础步骤以确保应用程序已准备就绪。这些步骤经常被忘记，在这里提到是为了提醒你如何确保部署应用程序以最佳状态运行。\n\
  \n在开始之前，在 `web.config` 中关闭调试。通过将 `<compilation>` 元素中的 `debug` 属性设置为 `False` 来实现，如\
  \ Listing 33-1 所示。\n\n默认情况下，大多数开发者在开发应用程序时会将 `debug` 属性设置为 `True`。这样做会在编译的 ASP.NET\
  \ 页面中插入调试符号。这些符号会降低性能。在应用程序构建并准备好部署后，保留这些符号是不必要的。\n\n\n\n\n\n图 33-1\n\n因此，尽管存在带有\
  \ Debug（调试）指定的下拉列表，但在构建 ASP.NET 项目的上下文中，它实际上并没有意义。你通过 `web.config` 文件中的设置来完全控制编译指定的类型，如前面的\
  \ 列表 33-1 所示。\n\n你会发现你可以在应用程序中提供 `Web.Debug.config` 和 `Web.Release.config` 文件。使用\
  \ `Web.Debug.config` 允许你在配置文件中放置设置，这些设置会在部署或以调试模式运行应用程序时被使用。在 Release 模式下发布应用程序时，你可以对\
  \ `Web.Release.config` 文件使用相同的方法。这种使用配置文件的方法允许你使用不同的数据库连接字符串、更改身份模式等。如果你在多个环境（例如测试、暂存和生产环境）中工作，你会发现使用这些多样的配置文件是有益的。\n\
  \n## Web 应用程序的部署方法\n\n记住部署是过程中的最后一步。第一步是设置程序——将程序打包成最适合后续部署的组件。实际上，你有多种方法可以部署 Web\
  \ 应用程序。你可以使用 XCopy 功能，它在演示时会令观众感到惊叹（因为非常简单）。第二方法是使用 Visual Studio 2012 的“复制网站”功能将网站从一个位置复制到另一个位置，以及一种使用\
  \ Visual Studio 部署预编译 Web 应用程序的替代方法。最后一种方法使用 Visual Studio 发布配置文件（publish profiles）在服务器上发布应用程序。在回顾了每个可用方法后，你可以决定哪种方法最适合你的目标。\n\
  \n### 使用 XCopy\n\n.NET 应用程序会编译为程序集，这些程序集包含了由公共语言运行时 (CLR) 执行的代码。程序集的一个巨大优势点是它们是自描述的。关于程序集的所有细节都存储在程序集内部。由于\
  \ .NET 程序集将这些信息存储在内部，因此 XCopy 部署是可能的，且不需要注册表设置。安装程序集只需将其复制到另一台服务器即可，而且在此过程中你不需要停止或启动\
  \ IIS。\n\n在这里提到 XCopy 是因为它是命令行方式，基本上是对你想要复制的所有文件和文件夹执行复制并粘贴。然而，正如你很快将看到的，XCopy 提供的功能比简单的复制粘贴要多一些。XCopy\
  \ 允许你将文件、目录甚至整个驱动器从一个点移动到另一个点。\n\n`xcopy` 命令的默认语法如下：\n\n```\n xcopy [source] [destination]\
  \ [/w] [/p] [/c] [/v] [/q] [/f] [/l] [/g]\n    [/d[:mm-dd-yyyy]] [/u] [/i] [/s [/e]]\
  \ [/t] [/k] [/r] [/h] [{/a|/m}] [/n] [/o]\n    [/x] [/exclude:file1[+[file2]][+file3]]\
  \ [{/y|/-y}] [/z]\n```\n\n要查看使用 XCopy 的示例，假设你在开发机 (`C:\\`) 上工作，并希望你的 ASP.NET 应用程序复制到生产服务器\
  \ (`Y:\\`)）。在最简单的情况下，以下命令即可完成任务：\n\n```\n xcopy c:\\Websites\\Website1 Y:\\Websites\\\
  \ /f /e /k /h\n```\n\n该命令从源驱动器向目标驱动器复制文件和文件夹。图 33-2 显示了在命令行中使用此功能的示例。\n\n![image](img/f1166-01.jpg)\n\
  \n图 33-2\n\n当你使用 XCopy 复制文件时，请注意这种方法不允许在 IIS 中自动创建任何虚拟目录。复制新的 Web 应用程序时，你还需要目标服务器上创建一个虚拟目录，并将此虚拟目录与你复制的应用程序关联。这是一个简单的过程，但你必须采取这些额外步骤来完成站点复制操作。\n\
  \n你可以向此 XCopy 命令提供多个参数，使其按照你预期的方式运行。表 33-1 详细列出了这些参数。\n\n| 参数 | 描述 |\n| --- | ---\
  \ |\n| `/w` | 显示消息：`按任意键开始复制文件(s)`。它会等待你的响应以开始复制过程。 |\n| `/p` | 对每个正在被复制的文件请求确认。这是以逐个文件的方式进行操作。\
  \ |\n| `/c` | 忽略复制过程中可能发生的错误。 |\n| `/v` | 对正在复制的文件进行验证，以确保它们与源文件相同。 |\n| `/q` |\
  \ 抑制任何 XCopy 消息的显示。 |\n| `/f` | 在复制过程中显示源文件目标文件的文件名。 |\n| `/l` | 显示要复制到目标驱动器的文件列表。\
  \ |\n| `/g` | 为目标驱动器构建解密文件。 |\n| `/d` | 当仅用 `/d` 使用时，仅复制比目标位置中现有文件较新的文件。另一种替代方案是使用\
  \ `/d[:mm-dd-yyyy]`，它会复制指定日期之后修改的文件。 |\n| `/u` | 仅复制目标位置中已存在的文件。 |\n| `/i` | 如果被复制的是目录且目标位置不存在该项，则创建一个新目录。XCopy\
  \ 过程也会复制所有文件。 |\n| `/s` | 仅复制包含文件的目录。 |\n| `/e` | 复制所有目录，无论这些目录是否包含文件。 |\n| `/t`\
  \ | 仅复制目录而不复制文件。 |\n| `/k` | 默认情况下，XCopy 过程会移除源文件中可能包含的只读设置。使用 `/k` 可确保这些只读设置在过程中保持不变。\
  \ |\n| `/r` | 仅将只读文件复制到目标位置。 |\n| `/h` | 指定包含通常排除的隐藏文件和系统文件。 |\n| `/a` | 复制具有归档属性的文件，并在\
  \ XCopy 目标处保留归档属性。 |\n| `/m` | 仅复制具有归档属性的文件，并关闭归档属性。 |\n| `/n` | 使用 NTFS 短文件名和短目录名进行复制。\
  \ |\n| `/o` | 除了文件外还复制磁盘权限访问控制列表 (DACL)。 |\n| `/x` | 除了文件外还复制审核设置和系统访问控制列表 (SACL)。\
  \ |\n| `/exclude` | 允许排除特定文件。使用的结构为 `exclude:File1.aspx + File2.aspx + File3.aspx`。\
  \ |\n| `/y` | 抑制 XCopy 过程中询问是否覆盖目标文件的提示。 |\n| `/-y` | 添加提示以确认覆盖目标位置中的现有文件。 |\n|\
  \ `/z` | 在可恢复模式下通过网络复制文件和目录。 |\n| `/?` | 显示 XCopy 命令的帮助信息。 |\n\n表 33-1\n\n使用 XCopy\
  \ 是一种简单的方法，只需极少的工作即可将你的应用程序从一台服务器移动到另一台。如果你对设置自己的虚拟目录没有问题，这种部署模式对你来说非常好。\n\n当 Web\
  \ 应用程序复制完成后（如果放在正确的虚拟目录中），就可以从浏览器调用了。\n\n\n\n\n复制网站的另一种选项是使用 Visual Studio 2012\
  \ 提供的 GUI。此 `Copy Web Site`（复制网站）GUI 允许你将网站从开发服务器复制到同一台服务器或远程服务器（就像你使用 `XCopy` 命令时那样）。如果你使用的是网站（Web\
  \ Site）项目而不是 Web 应用程序（Web Application）项目，此选项非常有用。\n\n你可以通过两种方式在 Visual Studio 中打开此\
  \ `Copy Web Site` 窗口。第一种方式是点击 Visual Studio 解决方案资源管理器中点击 `Copy Web Site` 图标。另一种打开\
  \ `Copy Web Site` GUI 的方法是从 Visual Studio 菜单选择网站 ![image](img/Ar.jpg) `Copy Web\
  \ Site`。使用任一种方法都会在文档窗口中打开 `Copy Web Site` GUI，如图图 33-3 所示。\n\n![image](img/f1168-01.jpg)\n\
  \n**图 33-3**\n\n从此 GUI 中，你可以点击 `Connect To a Remote Server`（连接到远程服务器）按钮（位于 `Connections`\
  \ 文本框旁边并标记为“Connect”）。此操作将打开如图图 33-4 所示的 `Open Web Site` 窗口。\n\n![image](img/f1168-02.jpg)\n\
  \n**图 33-4**\n\n如从此窗口所示，你有几个选项可以连接并复制你的 Web 应用程序。这些选项包括：\n\n*   **文件系统（File System）：**\
  \ 此选项允许你通过计算机的文件资源管理器视图进行浏览。如果你打算从此视图安装到远程服务器，你必须已经将一个驱动器映射到安装位置。\n*   **本地 IIS（Local\
  \ IIS）：** 此选项允许你在安装 Web 应用程序时使用本地的 `IIS`。从窗口的此部分，你可以直接创建新的应用程序以及新的虚拟目录。你也可以从同一个窗口删除应用程序和虚拟目录。`Local\
  \ IIS` 选项不允许你处理任何远程服务器上的 `IIS` 实例。\n*   **FTP 站点（FTP Site）：** 此选项允许你使用 FTP 功能连接到远程服务器。从此窗口，你可以使用\
  \ `URL` 或 IP 地址指定你想要连接的服务器、你将使用的端口，以及你将在服务器上工作的目录。从此窗口，你还可以指定通过 FTP 访问服务器可能需要的用户名和密码。注意，如果你通过此窗口通过\
  \ FTP 访问此服务器并提供用户名和密码，项将以明文形式传输。\n*   **远程站点（Remote Site）：** 此选项允许你使用 FrontPage\
  \ 服务器扩展连接到远程站点。通过窗口中的此选项，你还可以选择使用安全套接层（`SSL`）连接到远程服务器。\n\n连接到服务器后，你可以通过从 `Source\
  \ Web Site`（源网站）文本区域选择全部或部分文件将 Web 应用程序的内容复制到那里。当你在窗口中选择这些文件后，某些移动箭头将变为可用。点击右箭头会将选的文件复制到目标服务器。在图\
  \ 33-5 中，你可以看到文件确实已复制到远程目标。\n\n![image](img/f1169-01.jpg)\n\n**图 33-5**\n\n如果你在处理文件后稍打开同一个复制窗口，你会看到在此期间更改过的文件旁边有一个箭头，因此它们比目标服务器上的文件更新（参见图\
  \ 33-6）。\n\n![image](img/f1170-01.jpg)\n\n**图 33-6**\n\n这些箭头允许你只选择必须再次复制的文件，而不包含任何其他文件。所有的复制操作都记录在日志文件中。你可以通过点击\
  \ `Copy Web Site` 窗口底部的 `View Log`（查看日志）按钮从该窗口查看日志文件的内容。这将打开 `CopyWebSite.log` 文本文件。从你之前的复制中，你可以看到执行的事务。这里是一个日志记录示例：\n\
  \n```\nCopy from 'C:\\Websites\\Website1' to 'E:\\Website1' started at 10/6/2009\
  \ 7:52:31 AM.\n        Create folder App_Data in the remote Web site.\n        \
  \        Copy file Default.aspx from source to remote Web site.\n        Copy file\
  \ Default.aspx.cs from source to remote Web site.\n        Copy file About.aspx\
  \ from source to remote Web site.\n        Copy file About.aspx.cs from source to\
  \ remote Web site.\n        Copy file web.config from source to remote Web site.\n\
  \      Copy from 'C:\\Websites\\Website1' to 'E:\\Website1' is finished.\n     \
  \           Completed at 10/6/2009 7:52:33 AM.\n```\n\n### 部署预编译的 Web 应用程序\n\n除了使用\
  \ Visual Studio 将 Web 应用程序从一个位置复制到另一个位置外，使用此 IDE 部署预编译的应用程序也是可能的。预编译 Web 应用程序的过程在第\
  \ 3 章中进行了解释。ASP.NET 包含一个预编译过程，允许进行被称为部署预编译的过程。部署预编译过程中发生的情况是每个页面都被构建并编译成一个应用程序。这种预编译的好处是它可以将所有页面代码（以及后台代码）放入\
  \ `DLL` 中，从而使代码难以被窃取。当你部署客户付费的应用程序或绝对不希望更改的应用程序时，这是一个理想的情况。\n\n你可以使用命令行工具 `aspnet_compiler.exe`\
  \ 来完成预编译任务。虽然这种方法对于预编译 Web 应用程序并部署到远程服务器非常好，但你也可以使用 Visual Studio 完成此过程。\n\n要完成此任务，打开你要部署的项目，并按照前面的说明关闭调试功能为部署做好准备。然后通过从\
  \ Visual Studio 菜单中选择 ![image](img/Ar.jpg) `Publish Web Site`（发布网站）来打开预编译部署窗口。如图\
  \ 33-7 所示的 `Publish Web` 窗口出现。\n\n![image](img/f1171-01.jpg)\n\n**图 33-7**\n\n使用此窗口中的\
  \ `Browse (. .)` 按钮，你可以选择部署应用程序的任何位置（本地或远程机器）。与示例相同，你的选项包括文件系统位置、本地 `IIS` 位置、使用\
  \ FTP 访问的位置以及通过 FrontPage 服务器扩展访问的位置。本章稍后的图 33-16 显示了 `Advanced Precompile`（高级预编译）设置窗口，其中你可以找到其他选项，例如\
  \ `Allow Precompiled Site to Be Updateable`（允许预编译站点可更新）复选框。当选中此选项时，网站将被编译并复制，而不对\
  \ `.aspx` 页面进行任何更改。这意味着在预编译过程之后，你仍然可以进行微调，例如修改 Web 页面的标记，应用程序将正常运行。如果没有勾选此复选框，所有页面代码都将被提取并放入一个或多个\
  \ `DLL` 中。在这种状态下，应用程序是不可更新的，因为无法更新此编译过程中的任何占位文件。\n\n\n\n\n此窗口中的另一个选项是为在此过程中创建的 `DLL`\
  \ 分配一个强名称（strong name）。你可以选择相应的复选框，并分配一个密钥用于签名过程。通过预编译生成的 `DLL` 将成为一个强程序集（strong\
  \ assembly）——使用你选择的密钥进行签名。强名称通过依赖唯一的密钥对来保证名称的唯一性，并提供了强力的完整性检查。通过 .NET Framework\
  \ 安全检查可以确保程序集的内容自构建以来就未被更改过。\n\n当你准备好部署时，点击窗口中的 `OK`，然后打开的应用程序将被生成并发布。`Published`（已发布）意味着应用程序已部署到指定的位置。查看此位置，你会发现新增了一个\
  \ `bin` 目录，其中包含一些预编译的 `DLLs`，这就是你的 Web 应用程序。这在图 33-8 中所示。\n\n![image](img/f1172-01.jpg)\n\
  \n**图 33-8**\n\n在此状态下，任何 ASP.NET 特定页面中包含的代码都已剥离并放入 `DLL` 中。你看到的文件实际上只是 `DLL` 引用所需的占位符。\n\
  \n### 生成 ASP.NET Web 包\n\n部署 Web 应用程序最简单的方法之一是使用 Visual Studio 2012 新置的内置发布功能。在后台，此功能使用了微软的\
  \ Web 部署工具（也称为 Web Deploy），这意味着如果你想将此工具部署到你的服务器，该服务器上必须安装 Web Deploy，以便你的应用程序的“填充”（hydration）能够正常工作。\n\
  \n创建并传递的包是一个真实的物理文件——一个 `.zip` 文件。该 `.zip` 文件包含了将 Web 应用程序及其所有设置重新部署到新环境所需的一切。除了\
  \ `.zip` 文件外，它还包含一个清单文件（manifest file）和一个命令文件，这些文件用于在宿主机上启动包的安装。\n\n部署此应用程序的第一种方法是使用\
  \ Visual Studio 2012 中的一键发布（One-Click Publishing）功能。要执行此操作，在 Visual Studio 解决方案管理器中右键点击项目，并从提供的菜单中选择\
  \ `Publish`（发布）选项。此选项适用于 Web 站点（Web Site）项目和 Web 应用程序（Web Application）项目。会出现发布 Web\
  \ 窗口，如图 33-9 所示。\n\n![image](img/f1173-01.jpg)\n\n**图 33-9**\n\n由于许多开发者不断将他们的 Web\
  \ 应用程序部署到测试、分阶段和生产环境，因此有一种功能可以将你的部署选项存储在配置文件（profile）中，你可以反复使用。该设置取决于你在选择 `Publish`\
  \ 选项之前在 Visual Studio 2012 工具栏中设置的内容。\n\n当使用发布向导发布应用程序时，你可以配置表 33-2 所示的设置。\n\n|\
  \ **设置** | **描述** |\n| --- | --- |\n| Profile Name（配置文件名称） | 你保存的配置文件的名称。这使你能够将设置作为默认值，用于重复部署。\
  \ |\n| Build Configuration（生成配置） | 指定生成编译是在 Debug 还是 Release 模式下进行。此选项不仅限于 Debug/Release，还适用于项目的任何生成配置文件。\
  \ |\n| Publish Method（发布方法） | 你希望用于部署的方法。可能的选项包括 Web Deploy Publish、FTP、File System\
  \ 和 FPSE（FrontPage 服务器扩展程序）。 |\n| Service URL（服务 URL） | 指定宿主机服务器上 Web Deploy 的位置。此\
  \ URL 指向具有 Web Deploy 能力的实际 IIS 处理程序，其构造类似于 `http://myhostserver:8172/MsDeploy.axd`。\
  \ |\n| Site/Application（站点/应用程序） | 指定你的应用程序部署的位置。在这里，你可以指定站点以及放置应用程序的虚拟目录。例如：`MyDomain.com/MyApplication`。\
  \ |\n| Remove additional files at the destination（删除目标处的额外文件） | 如果未选择此选项，一键发布选项将在应用文件和设置之前，先删除宿主机服务器位置上的所有内容。\
  \ |\n| User Name（用户名） | 用于 IIS 连接的用户名。 |\n| Password（密码） | 用于 IIS 连接的密码。 |\n| Save\
  \ password（保存密码） | 指定 Visual Studio 发布功能是否在配置文件中保存密码。 |\n| Destination URL（目标 URL）\
  \ | 成功发布后，将在浏览器中打开目标 URL。 |\n| File Publish Options（文件发布选项） | 指定哪些文件需要在目标服务器上发布或删除。\
  \ |\n| Databases（数据库） | 指定是否运行 Entity Framework Code First Migrations 或应增量地发布数据库。\
  \ |\n| Preview（预览） | 提供将发布到服务器的文件的预览。 |\n\n**表 33-2**\n\n除了使用 Web Deploy 选项外，你会发现通过新的\
  \ Publish Web 对话框提供的其他选项更加简单。图 33-10 向你展示了提供的其他三种部署选项。\n\n![image](img/f1174-01.jpg)\n\
  \n**图 33-10**\n\n在此图中，你可以看到一些用于部署的标准设置。\n\nVisual Studio 拥有的 Web Deploy 功能有趣之处在于，你不仅可以连接到远程处理程序并运行部署，还可以创建一个可以随时使用的\
  \ Web Deploy 包。\n\n在 Visual Studio 2012 中，你可以从发布方法中选择 Web Deploy 来创建部署包。当你选择此选项并指定创建包的位置时，创建进度将显示在\
  \ Visual Studio 状态栏中。在发布成功的通知后，你可以在指定的位置找到整个包。\n\n此文件夹内包含了包的所有文件。图 33-11 展示了这些文件。\n\
  \n\n\n\n\n将应用程序部署到服务器的过程在 Visual Studio 2012 中经历了许多变化。这些变化也适用于使用 Visual Studio 2010\
  \ 的开发者。部署领域的改进侧重于让常用操作变得更简单，同时也让扩展变得容易。本节将介绍其中一些高级特性。\n\n## 数据库部署\n\n几乎所有的应用程序都使用数据库。在增量部署应用程序时，你希望确保生产数据库不被破坏，并根据你在开发机器上部署应用程序时的最新架构更改进行更新。\n\
  \n### Entity Framework Code First\n\nEntity Framework 引入了 Code First Migrations（代码优先迁移）。Code\
  \ First Migrations 帮助你增量更新数据库，而无需每次部署时都重新创建数据库。你可以自定义 Code First Migrations，规定如何增量更新现有数据库的架构和数据。当你使用\
  \ Visual Studio 部署应用程序时，可以决定是否在应用程序部署时执行 Code First Migrations。图 33-12 显示了发布 Web\
  \ 窗口的设置（Settings）选项卡。如图所示，选择了“Execute Code First Migrations”（执行 Code First 迁移）选项，这意味着当应用程序部署到服务器上时，将执行\
  \ Code First Migrations。\n\n![image](img/f1176-01.jpg)\n\n**图 33-12**\n\n当你部署应用程序时，Visual\
  \ Studio 在部署过程中不会对数据库进行任何操作。当首次访问应用程序时，Code First 会自动创建数据库或根据需要更新架构。如果应用程序实现了 `Seed`\
  \ 方法，则会在数据库创建或更新后执行该 `Seed` 方法。\n\n### 增量数据库更新\n\n如果你的应用程序没有使用 Entity Framework\
  \ Code First，你仍然可以使用 `dbDacFx` Web Deploy 提供程序更新数据库。该提供程序使用新的数据层应用程序框架（Dacpac Framework）来同步数据库。`dbDacFx`\
  \ 提供程序是对 Visual Studio 2010 中使用的 `dbFullSql` 提供程序的改进。`dbFullSql` 提供程序以前每次部署应用程序时都会对数据库进行全同步。这意味着如果你对现有表进行了更改，提供程序在进行数据库全同步时会导致错误。`dbDacFx`\
  \ 是一种改进，因为该提供程序会比较两个数据库并计算需要应用到目标数据库的更改，使其与源数据库保持一致。\n\n图 33-13 显示了如何使用 `dbDacFx`\
  \ 提供程序。此选项适用于应用程序在未使用 Entity Framework Code First `Context` 类的情况下访问 SQL SQL Server\
  \ 数据库。此选项允许你指定部署期间在目标数据库上运行的自定义 SQL 脚本。当你想要为任何表提供初始种子数据时，自定义 SQL 脚本非常有用。\n\n![image](img/f1177-01.jpg)\n\
  \n**图 33-13**\n\n建议使用 `dbDacFx` Web Deploy 提供程序代替 `dbFullSql` 进行数据库部署。如果你想使用 `dbFullSql`\
  \ 程序，可以在项目属性的 `Package/Publish SQL` 选项卡中配置数据库部署设置。\n\n## web.Config 转换\n\n发布应用程序时最常见的两个操作是转换\
  \ `web.config` 的某些属性，并根据发布到生产服务器还是测试服务器发布特定的 `web.config`。例如，如果你发布到生产服务器，你将希望关闭应用程序的调试选项。\n\
  \n当你在 Visual Studio 中创建 Web 应用程序时，会得到一个 `web.config` 文件。展开 `web.config` 文件，你会发现它包含两个子文件：`web.debug.config`\
  \ 和 `web.release.config`。图 33-14 显示了这两个文件。\n\n![image](img/f1178-01.jpg)\n\n**图\
  \ 33-14**\n\n使用 Visual Studio 部署应用程序时，可以选择使用何种生成配置来生成项目，如果该配置有任何相关的转换，它们将会被应用。图\
  \ 33-15 显示了如何在发布 Web 窗口的设置（Settings）选项卡中配置此选项。在 във图中，我在发布应用程序时使用的是 Release 配置。这意味着在发布时，Visual\
  \ Studio 将以 Release 模式发布应用程序，并禁用 `web.config` 中的调试标记，如列表 33-1 所示。\n\n![image](img/f1178-02.jpg)\n\
  \n**图 33-15**\n\n这些文件最重要的功能之一是 Visual Studio 在部署应用程序时如何转换这些文件。转换是一项关键功能，允许你更改 `web.config`\
  \ 文件的不同设置。列表 33-2 显示了一个开启了 `debug` 选项的常用 `web.config`，列表 33-3 显示了如何应用转换。\n\n## 其他发布选项\n\
  \n除了支持部署时的大多数常用操作外，发布 Web 窗口还具有一些级设置。\n\n### 编辑发布配置文件\n\n发布 Web 窗口仅涵盖了大多数常用操作的表面。某些情况下，你可能想要配置\
  \ UI 中未涵盖的高级操作。发布配置文件命名为 `<profilename>.pubxml`，位于应用程序内部的 `PublishProfiles` 文件夹中。对于网站项目，这些文件位于\
  \ `App_Data` 文件夹并命名为 `<profilename>.pubxml`。每个 `pubxml` 文件包含适用于一个发布配置的设置，因此你可以在此处存储多个发布配置文件，每个文件都可以包含有关你应用程序不同发布目标的信息。列表\
  \ 33-4 显示了发布配置文件文件的示例。\n\n发布配置文件文件是 MSBuild 文件，你可以编辑此文件来配置某些选项。例如，如果你控制服务器上的 ACL（访问控制列表）并希望在部署时禁用默认\
  \ ACL 行为，可以移除 `IncludeSetACLProviderOnDestination` 元素。Visual Studio 将不会设置默认 ACL（应用程序根目录为只读，`App_Data`\
  \ 文件夹为写入权限）。\n\n### 高级预编译设置\n\n如果你正在预编译 Web 应用程序，可以在预编译窗口中配置高级设置。你可以通过展开发布 Web 窗口设置（Settings）选项卡中的文件发布选项（File\
  \ Publish Options）来启动此窗口。图 33-16 显示了高级预编译窗口。\n\n\n\n\n\n虽然“发布 Web”（Publish Web）窗口包含了\
  \ Web 部署所需的大多数设置，但在项目属性的“包/发布 Web”（Package/Publish Web）选项卡中，还可以配置某些特定设置。图 33-17\
  \ 显示了“包/发布 Web”选项卡。你可以使用此选项卡配置需要传输的 IIS 设置，例如应用程序池设置。\n\n![image](img/f1180-02.jpg)\n\
  \n**图 33-17**\n\n## 部署到 WINDOWS AZURE WEB SITES\n\n随着越来越多的托管平台转向云端，将 Web 应用程序部署到云端变得越来越简单。本节将展示开发者如何轻松地通过将应用程序部署到\
  \ Windows Azure，使其开发机上的应用程序提供给用户。\n\nWindows Azure Web Sites 是 Windows Azure 中的一种模型，允许你快速、方便地将站点部署到高扩展性的云端环境。该环境允许你从小开始，并随着流量的增长进行扩展。该模型提供了在共享托管环境中可以的功能：你开始与服务器上的其他网站共享资源，一旦你的网站开始承受更多负载，你就可以逐渐扩展以拥有更多的网站实例。\n\
  \n在创建任何新网站之前，你需要在 Windows Azure 上创建一个账户。要创建账户，你可以访问 Windows Azure 管理门户 [`http://www.windowsazure.com/`](http://www.windowsazure.com/)\
  \ 并注册创建账户。\n\n要将应用程序作为 Windows Azure Web Site 部署，你必须在 Windows Azure 中置备一个网站。图 33-18\
  \ 显示了如何使用 Windows Azure 管理门户中的“快速创建”（Quick Create）选项创建网站。你可以选择在离你的地理位置创建网站。你还可以选择“带数据库的快速创建”（Quick\
  \ Create with Database）选项，这将为你的应用程序置备数据库。\n\n![image](img/f1181-01.jpg)\n\n**图 33-18**\n\
  \n一旦创建了网站，你就可以将发布配置文件下载到开发机。你可以从管理门户中选择你的网站并选择“仪表板”（Dashboard）选项卡。该选项卡提供了你网站的使用统计概览以及所有可用的配置选项。你可以从此部分下载发布配置文件。你可以将发布设置文件下载并保存到计算机的任何地方。图\
  \ 33-19 显示了 Windows Azure 管理门户中的“下载发布配置文件”（Download Publish Profile）选项，你可以用它下载发布配置文件。此发布配置文件包含了连接网站和已置备数据库所需的连接设置。\n\
  \n![image](img/f1182-01.jpg)\n\n**图 33-19**\n\n下载此发布配置文件后，你可以进入应用程序并导入这些设置。当你启动“发布\
  \ Web”窗口时，可以导入刚刚下载到机器上的发布配置文件。一旦导入此文件，Visual Studio 将读取该文件以获取到 Windows Azure 中网站和数据库的连接值。一旦导入此文件，Visual\
  \ Studio 将你的发布配置文件设置作为项目的一部分存储。这意味着你的发布配置文件设置已添加到项目中，你可以将此文件连同项目一起提交到任何源代码控制系统中。这非常有用，因为如果你将项目复制到不同的机器并想要重新发布应用程序，就不需要再次下载发布配置文件设置文件。你可以通过右键点击网站来启动“发布\
  \ Web”窗口。从那里你可以导入配置文件（图 33-20）。\n\n![image](img/f1183-01.jpg)\n\n**图 33-20**\n\n\
  在发布文件中，你可以查看“连接”（Connection）选项卡，并通过点击“验证连接”（Validate Connection）按钮来验证发布配置文件设置。程序将尝试连接你置备的\
  \ Azure Web Site，并确定发布配置文件设置文件中提供的连接是否有效。\n\n如果你的应用程序使用了数据库，你可以在“设置”（Settings）选项卡中设置应用程序部署时使用的连接字符串。如果你在使用\
  \ Entity Framework Code First，可以配置在应用程序部署到 Azure Web Sites 时是否应该运行 Code First 迁移（Migrations）。\n\
  \n将应用程序部署到 Windows Azure 的最后一步是“预览”（Preview）选项卡。该选项卡显示了将部署哪些文件。你可以使用此步骤检查所有想要发布的文件是否都在其中。你还可以取消勾选任何不想发布的文件。图\
  \ 33-23 显示了预览选项卡。\n\n![image](img/f1183-02.jpg)\n\n**图 33-21**\n\n一旦点击“发布”（Publish），所有文件都将复制到服务器，数据库将根据你在本地数据库中的架构或通过\
  \ Entity Framework Code First 迁移进行更新。如果部署成功，默认浏览器将启动并显示你网站的 URL，你的应用程序已部署到云端。\n\n\
  ## 总结\n\n如你所见，安装 ASP.NET 应用程序有许多可能性——从简单的模式到复杂的场景。发布配置文件使得将网站或应用程序部署到任何服务器变得非常容易，特别是使用\
  \ Windows Azure 时。只需记住，在处理应用程序安装程序时，你应该考虑整个过程逻辑清晰且于理解。\n\n# 第 IX 部分：其他 ASP.NET 技术\n\
  \n* 第 34 章：ASP.NET MVC\n* 第 35 章：ASP.NET Pages 和 Razor\n\n# 34 ASP.NET MVC\n\n##\
  \ 本章内容\n\n*   理解 MVC 和 ASP.NET\n*   处理路由和 URL\n*   理解控制器和视图\n\n## 本章代码下载\n\n请注意，本章中的所有代码示例都可以本章代码的一部分从书籍网站\
  \ [`www.wrox.com`](http://www.wrox.com) 的下载标签下载。\n\n模型-视图-控制器（MVC）多年来一直是计算机科学中一种重要的体系模式。它最初在\
  \ 1979 年命名为 Thing-Model-View-Editor，后来简化为模型-视图-控制器。它是分离关注点的强大且优雅的方法，非常适用于 Web 应用程序。它的显式分离会给应用程序设计增加一些额外的复杂性，但其巨大的优势远超付出的努力。自从引入以来，它已应用于许多框架。\n\
  \n理解 MVC 的核心概念对于有效使用它至关重要。本章将讨论 MVC 模式的历史，以及它在现代 Web 开发中的应用。\n\nASP.NET MVC 1.0\
  \ 作为 Visual Studio 2008 的可下载插件发布。ASP.NET MVC 2.0 内置于 Visual Studio 2010。ASP.NET\
  \ MVC 3.0 作为 Visual Studio 2010 的可下载插件发布。现在 Visual Studio 2012 内置了 ASP.NET MVC 4.0。本章还涵盖了\
  \ ASP.NET Web Forms 的某些局限性，以及 ASP.NET MVC 如何尝试将开发者从这些局限中解放出来。\n\n\n\n\n\n# 定义模型-视图-控制器\
  \ (MVC)\n\n模型-视图-控制器 (MVC) 是一种架构模式，用于将应用程序分为三个主要部分：\n\n*   **模型（The Model）：** 一组类，用于描述你正在处理的数据，以及如何更改和操纵数据的业务规则。\n\
  *   **视图（The View）：** 应用程序的用户界面 (UI)。\n*   **控制器（The Controller）：** 一组类，用于处理来自用户的通信、整体应用程序流以及特定的逻辑。\n\
  \n这种模式在 Web 编程中被频繁使用。在 ASP.NET MVC 中，它可以大致翻译为以下内容：\n\n*   模型是表示你感兴趣的领域的类。这些领域对象通常封装了存储在数据库中的数据，以及用于操纵数据和执行领域特定业务逻辑的代码。在\
  \ ASP.NET MVC 中，这最可能是某种数据访问层，使用如 `LINQ` to SQL、`Entity Framework` 或 `NHibernate`\
  \ 等工具，并结合包含领域特定逻辑的自定义代码。\n*   视图是一个动态生成的页面。在 ASP.NET MVC 中，你通过 `System.Web.Mvc.ViewPage`\
  \ 类实现它，该类继承自 `System.Web.UI.Page`。\n*   控制器是一个管理视图和模型之间关系的特殊类。它与模型通信，并决定渲染哪种视图（如果有的话）。在\
  \ ASP.NET MVC 中，该类惯例用后缀 `Controller` 标记。\n\n# 当今 Web 上的 MVC\n\n对于许多人来说，直到第一批图形化浏览器开始涌入市场（从\
  \ 1993 年的 Mosaic 开始），Web 才真正变得流行。不久后，动态网页开始使用如 `Perl` 等语言，并在诸如通用网关接口 (`CGI`) 等技术的支持下出现。Web\
  \ 早期阶段可用的技术更多地关注通过编写 HTML 来进行轻量级内容驱动工作的概念，而不是深层的应用程序逻辑，因为这在当时是并不需要的。\n\n随着 Web 的增长以及\
  \ HTML 标准开始允许更丰富的交互，Web 作为应用程序平台的理念开始兴起。对于微软而言，重点在于快速和简单。与此一致，活动服务器页面（Active Server\
  \ Pages,简称 ASP）于 1996 年诞生。\n\nASP 使用 `VBScript`，这是一种非常简单、轻量级的语言，它为开发者在创建可以构建的应用程序方面提供了大量的“非规定性自由”。对\
  \ ASP 页面的请求将由扩展名为 `.asp` 的文件处理，该文件由服务器端脚本和 HTML 标记混合组成。由于是用过程化语言编写的，许多 ASP 页面往往会退化为“意大利面代码”，其中标记与代码交织在一起，难以管理和维护。虽然编写整洁的\
  \ ASP 代码是可能的，但它需要大量工作，而且该语言和工具提供的帮助不够。尽管如此，尽管花费了大量工作，ASP 确实提供了对生成的标记的完全控制。\n\n2002\
  \ 年 1 月，微软发布了 .NET 平台的 1.0 版本，包含了 ASP.NET 的原始版本，因此 Web Forms 应运而生。它的诞生提供了使用更高级的工具和面向对象的语言来构建网站的途径。\n\
  \n在过去的 10 年里，ASP.NET 已经了巨大增长，通过将 Web 开发的重复性任务抽象为简单的拖放式控件，使 Web 页面的开发变得非常高效且简单。这种抽象可以提供巨大的帮助，但某些开发者发现他们希望对生成的\
  \ HTML 和浏览器脚本有更多的控制权。随着对测试的关注增加，他们还希望能够轻松测试他们的 Web 页面逻辑。\n\n随着语言的成熟和 Web 服务器软件能力的增长，MVC\
  \ 很快进入了 Web 应用程序架构。但 MVC 直到 2004 年 7 月才进入主流视野，当时位于伊利诺伊州芝加哥的 37Signals 公司的一位 24 岁的开发者\
  \ David Heinemeier Hansson 向世界介绍了他关于 MVC 的新颖思维方式。\n\nDavid（在社区中被称为 `DHH`）创建了 `Ruby\
  \ on Rails`，这是一个使用 Ruby 语言和 MVC 模式的 Web 框架。现在让我们深入探讨 ASP.NET MVC。\n\n# ASP.NET 中的控制器\n\
  \nASP.NET MVC 依赖于许多核心策略，这些 Web  MVC 框架通常遵循以下基本原则：\n\n*   约定优于配置 (Convention over\
  \ Configuration)\n*   不要重复 (Don’t repeat yourself，即 DRY 原则)\n*   尽可能可插拔 (Plugability)\n\
  *   尽可能提供帮助，必要时退出\n\n在 2007 年 2 月，Scott Guthrie 勾勒了 ASP.NET MVC 的核心，并回答了“为什么不是 Web\
  \ Forms？”的问题。ASP.NET MVC 继承了 ASP.NET 的许多核心策略，并利用了 .NET Framework 的新功能。\n\n### 提供方法而非文件\n\
  \nWeb 服务器最初提供存储在磁盘上的静态 HTML。随着动态网页的出现，Web 服务器从动态脚本生成 HTML。在 MVC 中，提供方式有所不同。URL 告诉路由机制实例化哪个控制器并调用哪个方法，并向该方法提供所需的参数。\n\
  \n与其让 URL 与 Web 服务器硬盘上的文件存在直接关系，不如说与控制器对象上的方法存在关系。ASP.NET MVC 实现了 MVC 模式的“前置控制器”变体，控制器位于路由系统之前。\n\
  \n理解 MVC 在 Web 场景中工作方式的一种良好方法是：MVC 提供方法调用的结果，而不是动态生成的（也称为脚本）页面。事实上，曾有一个演讲者将其称为“Web\
  \ RPC”，这非常贴切，尽管范围窄得多。\n\n### 这是 Web Forms 的未来吗？\n\n当我们讨论 ASP.NET MVC 时，听到的主要担忧之一是它的发布意味着\
  \ Web Forms 的死亡。事实并非如此。ASP.NET MVC 不是 ASP.NET Web Forms 4.5。它是 Web Forms 的替代方案，是框架中完全支持的一部分。尽管\
  \ Web Forms 继续不断创新和发展，ASP.NET MVC 将作为一个完全受微软支持的并行方案继续存在。\n\n观察这一点的有趣方法是参考这些技术所属的命名空间。如果你可以指向一个命名空间说“这就是\
  \ ASP.NET 所在的地方”，那将是 `System.Web` 命名空间。ASP.NET MVC 位于 `System.Web.Mvc` 命名空间。它不是\
  \ `System.Mvc`，也不是 `System.Web2`。\n\n\n\n\n在 ASP.NET Web Forms 中，你创建一个 `System.Web.UI.Page`\
  \ 实例并在其上放置“服务器控件”（例如日历和一些按钮），以便户可以输入或查看信息。然后，你将这些控件绑定到 `System.Web.UI.Page` 的事件上以实现交互。随后，该页面会被编译，当它被\
  \ ASP.NET 运行时调用时，会创建一个服务器端控件树，树中的每个控件都会经历事件生命周期、进行自我渲染，并将结果作为 HTML 传回。因此，一种新的 Web\
  \ 美学开始出现，Web Forms 在 HTTP 这一真正的无状态协议之上封装了事件处理和状态管理。\n\n### 为什么这种抽象是必要的？\n请记住，Web\
  \ Forms 引入到一个非常习惯 Visual Basic 6 (VB6) 的微软开发社区。使用 VB6 的开发者会将一个按钮拖到设计表面上，双击该按钮，就会立即为他们创建一个\
  \ `Button_Click` 事件处理程序方法。这是创建业务应用程序的一种极其强大的方式，让所有人对快速应用开发（RAD）工具感到兴奋。当开发者开始使用经典\
  \ ASP 时，相比于他们在 Visual Basic 中习惯的丰富环境，这简直是一个巨大的倒退。无论好坏，Web Forms 将这种快速应用开发的体验带到了\
  \ Web 端。\n\n然而，随着 Web 的成熟以及越来越多的人接受了对 HTML 的理解，以及层叠样式表 (CSS) 和 XHTML 的引入，一种新的 Web\
  \ 美学开始出现。Web Forms 对于开发者来说仍然具有极高的效率，使他们能够快速地创建基于 Web 的业务应用程序。然而，它生成的 HTML 看起来……怎么说呢，很有“生成的痕迹”，有时会冒犯那些手工制作\
  \ XHTML 和 CSS 网站的人的审美。这在 HTML5 和对语义化标记的重新关注下尤其如此。`ViewState` 和 `Postback` 事件模型等\
  \ Web Forms 概念有其价值，但许多开发者想要一种更低级的替代方案，不仅拥抱 HTML，也支持 HTTP 本身。\n\n此外，Web Forms 的架构也使得通过\
  \ `NUnit`、`MbUnit` 和 `xUnit.NET` 等当前单元测试工具进行测试变得困难。ASP.NET Web Forms 设计时并未考虑单元测试，尽管在网上可以找到许多通通方法，但可以说，Web\
  \ Forms 并不利于测试驱动开发（TDD）。ASP.NET MVC 对 HTML 拥有绝对控制权，不否认 HTTP 的存在，并且从设计之初就考虑了可测试性。\n\
  \n### ASP.NET MVC 完全不同！\n是的，ASP.NET MVC 完全不同。这正是其核心所在。它构建在一个价值观和架构原则体系之上，这些原则与 Web\
  \ Forms 非常不同。ASP.NET MVC 重视可扩展性、可测试性和活性。它非常轻量，并且对你将如何使用它没有过多假设——除非假设你欣赏模型-视图-控制器（MVC）模式。\n\
  \n### 为什么说“(ASP.NET > ASP.NET MVC) == True”\n创建你的第一个 MVC 应用程序非常简单。你可以使用任何版本的 Visual\
  \ Studio 2012 来创建基础应用程序。只需按照以下步骤操作：\n\n1. 打开 Visual Studio 2012 并选择 `File`（文件）![image](img/Ar.jpg)\
  \ `New Project`（新建项目）。\n2. 从“新建项目”对话框（见图 34-1）中，选择 ASP.NET MVC 4 Web 应用程序。![image](img/f1191-01.jpg)\n\
  \   **图 34-1**\n3. 选择你的项目名称以及它在磁盘上的位置，并点击确定。出现“新建 ASP.NET MVC 4 项目”对话框，如图 34-2 所示。“新建\
  \ ASP.NET MVC 4 项目”对话框允许你选择创建项目时使用的特定 MVC 模板。选择“Internet Application”（Internet 应用程序）项目模板![image](img/f1191-02.jpg)\n\
  \   **图 34-2**\n4. “新建 ASP.NET MVC 4 项目”对话框包含创建单元测试项目的设置。勾选“创建单元测试项目”复选框以创建一个包含基础\
  \ ASP.NET MVC 项目和额外单元测试项目的解决方案。默认情况下，测试框架下拉列表包含“Visual Studio 单元测试”选项。如果你安装了如 `MbUnit`\
  \ 或 `NUnit` 等第三方单元测试框架，下拉列表中会出现额外选项。\n5. 点击确定，出现一个类似于图 34-3 所示的项目解决方案。注意，尽管这是一个\
  \ ASP.NET 应用程序，除了标准类库外，它还包含一些你以前没过的额外文件夹![image](img/f1192-01.jpg)\n   **图 34-3**\n\
  \n事实上，该应用程序的目录比你习惯的要多得多；这是设计如此。ASP.NET MVC 和其他 MVC 框架一样，高度依赖这样一个观点：你可以依靠应用程序中的某些基本结构规则来减少工作量代码。Ruby\
  \ on Rails 非常简洁地表达了这一强大思想：*约定优于配置*（Convention over Configuration）。\n\n### 约定优于配置\n\
  “约定优于配置”的概念由 Ruby on Rails 普及，它在本质上意味着：我们已经知道了如何构建 Web 应用程序，这种约定使我们不需要再次去配置一切。\n\
  \n通过查看 ASP.NET MVC 中让运行的三个核心目录，你可以看到这一概念的运用：\n* Controllers（控制器）\n* Models（模型）\n\
  * Views（视图）\n\n你不需要在 `web.config` 等 XML 文件中设置这些文件夹名称，它们根据约定就位于那里。\n\nASP.NET MVC\
  \ 的约定是直观的。这是对你应用程序结构的预期：\n* 它有一个 `Controllers` 目录，存放你的控制器类。\n* 每个控制器的类名以 `Controller`\
  \ 结尾——例如 `ProductController`、`HomeController` 等——并存在于 `Controllers` 目录中。\n* 它有一个包含所有视图的\
  \ `Views` 目录。\n* 控制器使用的视图位于 `Views` 主目录下的，并根据控制器名称命名（去掉 `Controller`）。例如，之前讨论的 `ProductController`\
  \ 的视图位于 `/Views/Product`。\n* 所有可用的 UI 元素位于 `Views` 主目录的名为“Shared”的子目录下。\n\n如果你深入查看示例应用程序的初始结构（见图\
  \ 34-4），你可以看到这些约定在发挥作用。![image](img/f1192-02.jpg)\n**图 34-4**\n\n两个控制器 `HomeController`\
  \ 和 `AccountController` 存在于 `Controllers` 目录中，许多视图存在 `Views` 目录中。以下讨论集中位于 `/Views/Home`\
  \ 下的 `About` 和 `Index` 视图。尽管对视图命名没有强制约定，但你可以遵循 ASP.NET MVC 的约定，即为视图命名与动作（action）相同的名称。使用这种约定可以让其他开发者更容易评审和理解你的应用程序。\n\
  \n通过模板创建 Index 和 About 视图的方式，你可以看到这一约定的应用。这些也是被调用的控制器动作的名称，用 C# 渲染这些视图的代码如下：\n\n\
  ```csharp\n return View();\n```\n\n这可能会有点困惑。你可以通过稍微修改应用程序然后深入研究来看到清晰的例子：\n\n\n\n\
  \n\n1. 打开 `HomeController.cs` 或 `HomeController.vb`，复制并粘贴 `About` 方法，并创建一个名为 `Foo`\
  \ 的副本，如下所示：\n\n**VB**\n\n```vb\n Function Foo() As ActionResult\n          ViewData(\"\
  Message\") = \"Foo page.\"\n\n          Return View()\n End Function\n```\n\n**C#**\n\
  \n```csharp\n public ActionResult Foo()\n      {\n            ViewBag.Message =\
  \ \"Foo page.\";\n\n            return View();\n        }\n```\n\n2. 完成这个微小的改动后，开始调试你的应用程序。ASP.NET\
  \ 开发服务器会自动选择一个高端口号并启动你的浏览器。你的浏览器最终将导航到类似 [`http://localhost:3098`](http://localhost:3098)的地址，如图\
  \ 34-5 所示。![image](img/f1193-01.jpg)\n\n**图 34-5**\n\n3. 注意这里没有 `.aspx` 扩展名？ASP.NET\
  \ MVC 让你拥有完全的控制权。现在，将浏览器地址栏中的相对 URL 从 `/` 改为 `/Home/Foo`。有趣的事情发生了，如图 34-6 所示。记住，你只是返回了\
  \ `Foo` 方法中对 `View` 用的结果。由于你正处于 `HomeController` 的 `Foo` 方法中，系统正在多个位置寻找名为 `Foo`\
  \ 的 View。ASP.NET MVC 足够智能，能够给你一个实际上可以做有用事的错误信息。这感觉真的非常清爽！\n\n![image](img/f1194-01.jpg)\n\
  \n**图 34-6**\n\n```\nSystem.InvalidOperationException: The view 'Foo' or its master\
  \ was not found or no view engine supports the searched locations. The following\
  \ locations were searched:\n  ~/Views/Home/Foo.aspx\n  ~/Views/Home/Foo.ascx\n \
  \ ~/Views/Shared/Foo.aspx\n  ~/Views/Shared/Foo.ascx\n  ~/Views/Home/Foo.cshtml\n\
  \  ~/Views/Home/Foo.vbhtml\n  ~/Views/Shared/Foo.cshtml\n  ~/Views/Shared/Foo.vbhtml\n\
  ```\n\n错误信息列出了（参见图 34-6）系统查找 Views 的位置，按搜索顺序排列。它为你提供了足够的信息来推断 View 的命名约定。\n\n首先，它会在\
  \ `/Views` 下查找与当前控制器同名的目录（在本例中为 `Home`），然后查找 `/Views/Shared`。ASP.NET MVC 4 默认使用的\
  \ `RazorViewEngine` 会查找查找 `.aspx` 页面，然后是 `.ascx` 文件，接着是 `.cshtml` 和 `.vbhtml` 文件。\n\
  \n4. 回到 `HomeController`，将 `Foo` 方法中对 `View` 的调用修改为包含 View 名称参数：\n\n**VB**\n\n```vb\n\
  \ Function Foo() As ActionResult\n          ViewData(\"Message\") = \"Foo page.\"\
  \n\n          Return View(\"Index\")\n End Function\n```\n\n**C#**\n\n```csharp\n\
  \ public ActionResult Foo()\n      {\n            ViewBag.Message = \"Foo page.\"\
  ;\n\n            return View(\"Index\");\n        }\n```\n\n5. 再次启动应用程序并再次访问 `/Home/Foo`。Index\
  \ View 被渲染，来自 `Foo` action 的 `Message` 字符串出现在页面页头。\n\n6. 回到 Visual Studio，在返回 `View`\
  \ 结果的行上设置断点。刷新浏览器，确认你仍位于 `/Home/Foo`，准备好深入研究。\n\n### 第三次请求才是关键\n\n花点时间思考这里发生了什么。你的应用程序内部状态是怎样的？你的\
  \ Visual Studio 应该大致像图 34-7 所示。\n\n![image](img/f1195-01.jpg)\n\n**图 34-7**\n\n\
  花时间观察 Visual Studio（如果你喜欢也可以看图片），尝试判断它在告诉你什么。你是如何来到这里的？你在哪里？\n\n你在浏览器中访问了 `/Home/Foo`，现在你神奇地坐在了\
  \ `Foo` action 方法内部的断点上。调用堆栈（Call Stack）工具窗口确认了这一点，但提供的信息不够。你是*如何*来到这里的？右键点击调用堆栈的空白处，选择“显示外部代码”。你也可以拖动调用堆栈窗口并将其“脱离”\
  \ Visual Studio，以便更好地分析即将显示的信息流。如果你有多个显示器，记住 Visual Studio 2012 支持该功能，所以如果你喜欢，可以用调用堆栈窗口填充整个显示器。\n\
  \n调用堆栈工具窗口实际上包含了大量信息，以至于一些重要的部分和对象已被高亮显示，如图 34-8 中的片段所示。记住，调用堆栈是从下往上读取的，底部是你开始的地方，顶部是你当前正在调试的行。在这个调用堆栈中，某些部分比其他部分更重要。\n\
  \n![image](img/f1196-01.jpg)\n\n**图 34-8** 从底部开始，你可以看到请求由 ASP.NET 处理——具体由 `System.Web.HttpRuntime`\
  \ 处理。这是 ASP.NET 的“起点”。注意这是 `System.Web`，你正处于 `System.Web` 内部——还没有发生任何 MVC 特有的事情。如果你已经熟悉\
  \ Web Forms，可能会发现记住 ASP.NET 何处结束以及 ASP.NET MVC 在何处开始很有帮助。\n\n第一个重大事件（记住，你是从下往上读）发生在图\
  \ 34-8 所示的底部。从 ASP.NET 到 ASP.NET MVC 的突出过渡中你可以学到什么？ASP.NET MVC 是构建在 `HttpHandlers`\
  \ 和 `HttpModules` 之上的。这就是 MVC 获取钩子的地方。\n\nASP.NET MVC 实现为 `HttpHandler` 这一事实令人放心，因为你知道团队在编写时“遵循了规则”。ASP.NET\
  \ MVC 的设计中不存在内部知识或秘密。\n\n从这些发现中获得的另一个收获是，由于 ASP.NET MVC 使用 `HttpHandlers`（以及 `HttpModules`）来工作，这对某些人来说似乎显而易见，但一个非常常见的问题是“ASP.NET\
  \ MVC 是一个全新的 ASP.NET 吗？”从图 34-8 中可以看到并不是。它是构建在在你使用了多年的相同基础设施（即“核心”ASP.NET）之上的。\n\
  \n回看图 34-8 并查看该调用堆栈。记住你现在正位于 `HomeController` 中 `Foo` 方法的断点上。是谁创建了 `HomeController`？必须有人“实例化”它。是谁为你调用了\
  \ `Foo`？\n\n在 `MvcHandler` 的 `ProcessRequest` 方法内部，控制器实例由 `DefaultControllerFactory`\
  \ 创建。`DefaultControllerFactory` 是 ASP.NET MVC 创建并用于搜索和创建控制器的内置工厂。ASP.NET MVC 创建\
  \ `HomeController` 的实例，然后调用控制器的 `Execute` 方法。该方法反过来依赖于控制器的 action 调用器（默认为 `ControllerActionInvoker`）来实际调用该方法。\n\
  \n\n\n\n控制器（Controllers）的存在是为了“做事情”。具体要做什么，取决于你的定义。它们与模型通信、进行计算，诸此类推。然而，它们不渲染 HTML，也不与数据库通信。这就是关注点分离。控制器的关注在于控制。\n\
  \n控制器将 `ViewData` 传递给视图（View），视图负责渲染 HTML（或任何你想要的内容）。HTML 包含指向其他 URL 的链接，循环由此继续。\n\
  \n## 理解路由和 URL\n\n软件开发人员以关注细节而闻名，特别是在源代码的质量和结构方面。他们经常为了代码缩进样式以及花括号应该放在的位置而争论不休。因此，当你接触大多数使用\
  \ ASP.NET 构建的网站并遇到如下所示的 URL 时，会感到有些意外：\n\n```\n http://example.com/products/list.aspx?id=17313&catid=33723&page=3\n\
  ```\n\n开发者对代码投入了这么多关注，为什么不对 URL 投入同样的关注呢？它看起来可能没那么重要，但 URL 是一个合法且被广泛使用的 Web 用户界面。\n\
  \n可用性专家雅各布·尼尔森（Jakob Nielsen，[`www.nngroup.com`](http://www.nngroup.com)）敦促开发者关注\
  \ URL，并提供了以下高质量 URL 的指南：\n\n* 易于记忆且易于拼写的域名\n* 短小的 URL\n* 易于输入的 URL\n* 反映网站结构的 URL\n\
  * “可黑客化”的 URL，允许用户通过删除 URL 尾部来移动到信息架构的更高层级\n* 持久性 URL，即不会改变的 URL\n\n在传统上，在如经典 ASP、JSP、PHP、ASP.NET\
  \ 等许多 Web 框架中，URL 代表磁盘上的物理文件。例如，当你看到如下请求时：\n\n```\n http://example.com/products/list.aspx\n\
  ```\n\n你可以赌上你孩子的学费，认为该网站有一个目录结构，其中包含一个 `Products` 文件夹以及该文件夹下的一个 `List.aspx` 文件。在这种情况下，URL\
  \ 与磁盘上的物理存在之间存在直接关系。当 Web 服务器接收到此类请求时，Web 框架会执行与该文件关联的代码来响应请求。在许多情况下，这些代码包含或关联了一个模板，该模板将服务器端声明与\
  \ HTML 标记混合，以生成通过响应发送回浏览器的最终标记。\n\nASP.NET MVC 框架中的路由主要有两个用途：\n\n* 它匹配传入的请求并将其映射到控制器操作（controller\
  \ action）。\n* 它构建对应于控制器操作的输出 URL。\n\n现在你已经对 URL 和路由有了一定的了解，是时候仔细研究路由以及它与 URL 重写（URL\
  \ rewriting）的区别了。\n\n### 路由与 URL 重写的对比\n\n为了更好地地理解路由，许多开发者会将其与 URL 重写进行比较。毕竟，两种方法在创建\
  \ URL 与处理 URL 的代码之间的分离方面都是有用的，这有助于为搜索引擎优化（SEO）创建“美观”的 URL。然而，一个关键区别是，URL 重写代表的是“以页面为中心”的\
  \ URL 视图。大多数 ASP.NET 重写方案会将一个页面的 URL 重写为由另一个页面处理。例如，你可能会看到\n\n```\n /product/bolts.aspx\n\
  ```\n\n被重写为\n\n```\n /product/display.aspx?productid=111\n```\n\n相反，路由对 URL 采取“以资源为中心”的视角。在这种情况下，URL\
  \ 代表 Web 上的一个资源（不一定是页面）。通过 ASP.NET 路由，该资源是当传入请求匹配路由时执行的一段代码。路由根据 URL 的特征决定如何派发请求——它并没有重写\
  \ URL。\n\n另一个关键区别是，路由还利用与匹配传入 URL 相同的映射规则来生成 URL。另一种理解方式是，ASP.NET 路由更像是 `bidirectional`（双向）URL\
  \ 重写。这种比较的不足之处在于，ASP.NET 路由从未真正重写过你的 URL。用户在浏览器中发起的请求 URL 与应用程序在整个请求生命周期中看到的 URL\
  \ 是同一个。\n\n### 定义路由\n\n每个 ASP.NET MVC 应用程序都需要一个路由来定义应用程序应该如何处理请求，但通常会有几个。可以想象，一个复杂的应用程序可能有几十个或更多路由。\n\
  \n在本节中，你将查看如何定义路由。路由定义从 URL 开始，指定了路由将匹配的模式。除了路由 URL 之外，路由还可以指定 URL 各部分的默认值和约束，从而对路由匹配传入请求\
  \ URL 的进行进行控制。\n\n你从一个极其简单的路由开始，并在此基础上构建。\n\n#### 设置路由 URL\n\n在创建新的 ASP.NET MVC\
  \ Web 应用程序项目后，快速查看 `Global.asax.cs` 中的代码。你会发现 `Application_Start` 方法包含对 `RouteConfig`\
  \ 类中名为 `RegisterRoutes` 的静态方法的调用。该方法是注册应用程序所有路由的地方。\n\n现在清除 `RouteConfig` 类中 `RegisterRoutes`\
  \ 方法中的路由，并将其替换为此非常简单的路由（用 C# 编写）：\n\n```c\n routes.MapRoute(\"simple\", \"{first}/{second}/{third}\"\
  );\n```\n\n`MapRoute` 方法的最简单形式接收路由的名称和路由的 URL 模式。名称将在本节稍后讨论。现在，重点关注 URL 模式。\n\n\
  注意，路由 URL 由若干段组成（段是斜杠之间的所有内容，但包括斜杠本身），每段都包含一个使用大括号的占位符。这些占位符被称为 URL 参数。这种结构是一条模式匹配规则，用于判断该路由是否适用于传入的请求。在本例中，此规则将匹配任何具有三个段的\
  \ URL，因为参数默认匹配 `any`（任意）值。当它匹配一个具有三个段的 URL 时，该 URL 第一段的文本对应于 `{first}` 参数，第二段的值对应于\
  \ `{second}` 参数，第三段的值对应于 `{third}` 参数。\n\n你可以像本例中一样为这些参数命名任何名称。当请求进入时，路由将请求 URL\
  \ 解析为一个字典（具体来说，可以通过 `RequestContext` 中的 `RouteData` 访问的 `RouteValueDictionary`），使用\
  \ URL 参数名称作为键，并将相应位置的 URL 子部分作为值。在 MVC 应用程序的上下文使用路由时，某些参数名称带有特殊用途。表 34-1 显示了刚刚定义的路由如何将某些\
  \ URL 转换为 `RouteValueDictionary`。\n\n| **URL** | **URL 参数值** |\n| --- | --- |\n\
  | `/products/display/123` | `{first} = products` |\n| | `{second} = display` |\n\
  | | `{third} = 123` |\n| `/foo/bar/baz` | `{first} = foo` |\n| | `{second} = bar`\
  \ |\n| | `{third} = baz` |\n| `/a.b/c-d/e-f` | `{first} = \"a.b\"` |\n| | `{second}\
  \ = \"c-d\"` |\n| | `{third} = \"e-f\"` |\n\n如果你实际上对上表列出的 URL 发起请求，你可能会发现你的 ASP.NET\
  \ MVC 应用程序看起来出问题了。虽然你可以使用任何想要的参数名称定义路由，但 ASP.NET MVC 需要某些特殊的参数名称才能使路由正常工作：`{controller}`\
  \ 和 `{action}`。\n\n\n\n\n`{controller}` 参数的值用于实例化一个控制器类来处理请求。按照约定，MVC 会在 `{controller}`\
  \ 值后附加 `Controller` 后缀，并尝试查找同名（不区分大小写）的类型，该类型还继承自 `System.Web.Mvc.IController` 接口。\n\
  \n回到简单的路由示例（显示了 VB 示例），将其从：\n\n```\n routes.MapRoute(\"simple\", \"{first}/{second}/{third}\"\
  )\n```\n\n改为：\n\n```\n routes.MapRoute(\"simple\", \"{controller}/{action}/{id}\"\
  )\n```\n\n这样它就包含了特殊的 URL 参数名。\n\n现在再次查看表 34-1 中的第一个示例，你会发现对 `/products/display/123`\
  \ 的请求是针对名为 `\"Products\"` 的 `{controller}` 的请求。ASP.NET MVC 获取该值并附加 `Controller`\
  \ 后缀以获得类型名称 `ProductsController`。如果存在实现 `IController` 接口的同名类型，它将被实例化并用于处理该请求。\n\n\
  `{action}` 参数的值用于指示调用控制器的哪个方法来处理当前请求。请注意，此方法调用仅适用于继承自 `System.Web.Mvc.Controller`\
  \ 基类的控制器类。继续使用 `/products/display/123` 的示例，MVC 将调用的 `ProductsController` 方法是 `Display`\
  \ 或 `display`，因为是不区分大小写的。\n\n注意，表 34-1 中的第三个 URL 尽管是一个有效的路由 URL，但可能无法匹配到任何真实的控制器和操作，因为它将尝试实例化一个名为\
  \ `a.bController` 的控制器并调用名为 `c-d` 的方法，而这不是一个有效的方法名。\n\n除了 `{controller}` 和 `{action}`\
  \ 之外的任何路由参数如果存在，将作为参数传递给操作方法。列表 34-1 展示了一个具有单个操作的产品控制器（本章代码下载中的 `Controllers/ProductsController.cs`\
  \ 和 `Controllers/ProductsController.vb`）。\n\n对 `/products/display/123` 的请求会导致 MVC\
  \ 实例化此类类并调用 `Display` 方法，将 123 传递给 `id`。\n\n在之前的路由 URL `{controller}/{action}/{id}`\
  \ 示例中，每个段都包含一个占据整个段的 URL 参数。这并非如此。路由 URL 允许在段中包含字面值。例如，如果你正在将 MVC 集成到现有站点中，并希望所有的\
  \ MVC 请求都以单词 `site` 为前缀，你可以这样做：\n\n```\n site/{controller}/{action}/{id}\n```\n\n\
  这表示 URL 的第一段必须以 `site` 开头才能匹配此请求。因此，`/site/products/display/123` 匹配此路由，但 `/products/display/123`\
  \ 则不匹配。\n\n拥有字面量与参数混合的 URL 段也是可能的。唯一的限制是不允许出现两个连续的 URL 参数。因此：\n\n```\n {language}-{country}/{controller}/{action}\n\
  \  {controller}.{action}.{id}\n```\n\n是有效的路由 URL，但\n\n```\n {controller}{action}/{id}\n\
  ```\n\n不是有效的路由。路由没有方法知道传入的请求 URL 中的控制器部分何时结束，以及操作部分何时开始。\n\n查看一些其他示例（显示在表 34-2 中）可以帮助你理解\
  \ URL 模式如何与匹配 URL 对应。\n\n| 路由 URL 模式 | 匹配的 URL 示例 |\n| --- | --- |\n| `{controller}/{action}/{category}`\
  \ | `/products/list/beverages/blog/posts/123` |\n| `service/{action}-{format}` |\
  \ `/service/display-xml` |\n| `{reporttype}/{year}/{month}/{date}` | `/sales/2008/1/23`\
  \ |\n\n**表 34-2**\n\n#### 内部原理：路由如何将你的 URL 连接到操作\n\n你已经介绍了路由如何在 MVC 框架中映射到控制器操作。现在让我们查看内部，以更好地观察这是如何发生的，并了解路由与\
  \ MVC 之间的分界线。\n\n一个常见的误解是路由只是 ASP.NET MVC 的一个功能。在 ASP.NET MVC 实现的早期阶段确实如此，但过了一段时间，显然这是一个更通用的功能。特别是\
  \ ASP.NET Dynamic Data 团队对在 Dynamic Data 内部使用路由也感兴趣。那时，路由变成了一个更通用的功能，既不具备 MVC 的内部知识，也不依赖于\
  \ MVC。\n\n路由是独立的的一个非常明显的证明不仅它是一个独立的程序集，而且它位于 `System.Web.Routing` 命名空间中，而不是一个理论上的\
  \ `System.Web.Mvc.Routing`。通过研究命名空间，你可以获得大量信息。\n\n#### 高级请求路由流水线\n\n所有关于路由的讨论对你来说可能是大量信息。然而，理解这一点很重要，因为路由确实是你控制应用程序\
  \ URL 最强大的工具。\n\n分解成各个部分，路由流水线由以下五个高级步骤组成：\n\n1. `UrlRoutingModule` 尝试将当前请求与 `RouteTable`\
  \ 中注册的路由进行匹配。\n2. 如果匹配到路由，路由模块从该路由获取 `IRouteHandler`。\n3. 路由模块从 `IRouteHandler`\
  \ 调用 `GetHandler`，返回一个 `HttpHandler`（典型的 ASP.NET 页面 `System.Web.UI.Page`）。\n4. 在\
  \ `HttpHandler` 上调用 `ProcessRequest`，将请求交给处理。\n5. 在 MVC 的情况下，`IRouteHandler` 默认是\
  \ `MvcRouteHandler` 的实例，它反过来返回一个 `MvcHandler`（实现 `IHandler`）。`MvcHandler` 负责实例化正确的控制器并调用控制器上的操作方法。\n\
  \n#### 路由匹配\n\n从本质上讲，路由只是匹配请求并从请求中提取路由数据传递给 `IRouteHandler`。从高级角度来看，路由匹配算法非常简单。\n\
  \n当请求进来时，`UrlRoutingModule` 遍历通过 `RouteTable.Routes` 访问的 `RouteCollection` 中的路由。它询问每个路由：“你能处理此请求吗？”如果路由回答“可以！”，则路由查找完成，由该路由处理请求。\n\
  \n判断路由是否能处理请求是通过调用 `GetRouteData` 方法询问的。如果当前请求不匹配，该方法返回 null（换句话说，模块与路由之间没有真正的对话）。\n\
  \n#### RouteData\n\n记得当你调用 `GetRouteData` 时，它返回一个 `RouteData` 实例。`RouteData` 包含匹配特定请求路由的信息，包括特定请求的上下文信息。\n\
  \n记得上一节显示了一个具有以下 URL 的路由：`{foo}/{bar}/{baz}`。当对 `/products/display/123` 的请求进来时，路由尝试匹配请求。如果确实匹配，它将创建一个包含从\
  \ URL 解析出的信息的字典。具体来说，它为路由 URL 中的每个 `url` 参数向字典添加一个键。\n\n因此，在 `{foo}/{bar}/{baz}`\
  \ 的情况下，你会预计字典至少包含三个键：`\"foo\", \"bar\"` 和 `\"baz\"`。在 `/products/display/123` 的情况下，URL\
  \ 用于为这些字典键提供值。在这种情况下，`foo = products, bar = list`, 且 `baz = 123`。\n\n#### 参数默认值和可选参数\n\
  \n\n\n\n在某些情况下，你可能想为参数指定默认值。在注册路由时，你可以为参数指定默认值。你甚至为特殊参数名 `{controller}` 和 `{action}`\
  \ 指定默认值。要为路由设置默认值，你可以使用 `MapRoute` 方法的重写，并为 `Route` 类的 `Defaults` 赋值。创建新的 MVC 应用时，默认路由为控制器和操作指定了默认值。\n\
  \n### VB\n```\n routes.MapRoute( _\n     name:=\"Default\", _\n     url:=\"{controller}/{action}/{id}\"\
  , _\n     defaults:=New With {.controller = \"Home\", .action = \"Index\", _\n \
  \        .id = UrlParameter.Optional} _\n  )\n```\n\n### C#\n```sharp\n routes.MapRoute(\n\
  \      name: \"Default\",\n      url: \"{controller}/{action}/{id}\",\n      defaults:\
  \ new { controller = \"Home\", action = \"Index\",\n          id = UrlParameter.Optional\
  \ }\n  );\n```\n\n你可能还会注意到默认映射中 `id` 参数使用了 `UrlParameter.Optional`。在某些情况下，你可能想指定某个参数没有默认值且它是可选的。你通过使用特殊值\
  \ `UrlParameter.Optional` 为参数指定默认值来实现此。如果你想在操作中访问此参数，请将该参数声明为 `Nullable` 类型。列表 34-2\
  \ 显示了修改 代码列表 34-1 以接受可选参数的结果（本章代码下载包中的 `Controllers/ProductsController.cs` 和 `Controllers/ProductsController.vb`）。\n\
  \n# 控制器 (CONTROLLERS)\n\n你可能想记住一个快速定义：MVC 模式中的控制器负责响应用户输入，通常根据用户输入对模型进行更改。通过这种方式，MVC\
  \ 模式中的控制器关注应用程序的流程，处理传入的数据，并向相关的视图提供输出的数据。\n\n## 定义控制器：IController 接口\n\nASP.NET\
  \ MVC 的核心关注点是可扩展性和灵活性。在以这些为目标构建软件时，尽可能通过使用接口来利用抽象是非常重要的。一个类若要成为 ASP.NET MVC 中的控制器，它至少必须实现\
  \ `IController` 接口，按照惯例，类名必须以后缀 `Controller` 结尾。这种命名约定实际上非常重要——你会发现 ASP.NET MVC\
  \ 中运行着许多此类小规则，这会让你无需定义配置设置和特性，从而让你的生活变得轻松一点。讽刺的是，考虑到它所抽象的功能，`IController` 接口非常简单：\n\
  \n```\n public interface IController\n  {\n    void Execute(RequestContext requestContext);\n\
  \  }\n```\n\n创建一个 `IController` 实际上是一个非常简单的过程。当请求进来时，路由系统会识别控制器并调用 `Execute` 方法。\n\
  \n`ControllerBase` 类是一个抽象基类，它在 `IController` 接口之上额外增加了更多的 API 表面。它提供了 `TempData`、`ViewData`\
  \ 和 `ViewBag` 属性。`ControllerBase` 的 `Execute` 方法负责创建 `ControllerContext`，它为当前请求提供\
  \ MVC 特定的上下文，就像 `HttpContext` 实例为整个 ASP.NET 提供上下文一样（提供请求和响应、URL 以及服务器信息等元素）。\n\n\
  这个基类仍然非常轻量，允许开发者为自己的控制器提供极度自定义的实现，同时受益 ASP.NET MVC 的操作过滤器基础设施。它没有提供将操作转换为方法调用的功能。这正是\
  \ `Controller` 类的用场。\n\n## 控制器类与操作\n\n从理论上讲，你可以通过实现 `ControllerBase` 或 `IController`\
  \ 的类来构建整个网站，并且它可以正常工作。路由将根据名称查找 `IController` 然后调用 `Execute`，这样你就拥有了一个非常非常基础的网站。\n\
  \n然而，这种方法类似于使用原始的 `HttpHandlers` 来操作 ASP.NET —— 它可以工作，但你不得不自己重新发明轮子，并自己梳理核心框架逻辑。有趣的是，ASP.NET\
  \ MVC 本身构建在 HTTP 处理程序之上，总的来说，没有必要对 ASP.NET 进行内部管道更改来实现 MVC。相反，ASP.NET MVC 团队简单地将此框架构建在现有的\
  \ ASP.NET 扩展点之上。编写控制器的标准方法是让它继承自 `System.Web.Mvc.Controller` 抽象基类，该类实现了 `ControllerBase`\
  \ 基类。`Controller` 类旨在作为所有控制器的基类，因为它为派生它的控制器提供了许多很棒的行为。\n\n现在再看另一个简单的控制器示例，但这次添加一个公共方法。使用你之前一直工作的项目，右键单击\
  \ Controllers 文件夹并选择添加 ![image](img/Ar.jpg) 控制器，然后将其命名为 `Simple2Controller`。列表 34-3\
  \ 显示了添加必要的代码（本章代码下载包中的 `Controllers/Simple2Controller.vb` 和 `Controllers/Simple2Controller.cs`）后的\
  \ `Simple2Controller`。\n\n按下 `Ctrl+F5`（或调试 ![image](img/Ar.jpg) 运行）并在浏览器中导航到 `/Simple2/Hello`。图\
  \ 34-9 显示了结果。\n\n![image](img/f1205-01.jpg)\n\n**图 34-9**\n\n像一样，这并不惊人，但更有趣。注意地址栏中的\
  \ URL 直接对应于控制器的操作。如果你记得之前的，默认路由将 URL 分为三个主要部分：`{controller}/{action}/{id}`。看看它如何应用于此示例。URL\
  \ 的 `Simple2` 部分对应于控制器。MVC 框架在控制器名称后附加 `Controller` 后缀并定位到控制器类 `Simple2Controller`：\n\
  \n```\n /Simple2/Hello\n```\n\nURL 的最后部分对应于操作。框架查找同名的公共方法并尝试调用它。\n\n### 处理参数\n\n\
  你可以在控制器类中添加任意数量的公共方法（从现在起按照惯称为操作），它们都可以通过这种模式被调用。操作还可能包含参数。回到 `Simple2Controller`，添加一个接收参数的新操作方法。列表\
  \ 34-4 显示了添加 `Goodbye` 操作后的 `Simple2Controller`（本章代码下载包中的 `Controllers/Simple2Controller.vb`\
  \ 和 `Controllers/Simple2Controller.cs`）。\n\n该方法可以通过 URL 调用：\n\n```\n /Simple2/Goodbye?name=World\n\
  ```\n\n注意你可以通过查询字符串向操作方法传递参数。你也可以通过 URL 段传递参数，通过在路由中定义的顺序来发现。例如，以下 URL 对许多开发者和互联网用户来说更美观：\n\
  \n```\n /Simple2/Goodbye/World\n```\n\n处理通过 URL 段传递的参数需要你定义路由如何识别 URL 中的这些参数。坦率地说，默认路由（当你点击文件\
  \ ![image](img/Ar.jpg) 新建时创建）已经为你准备好并包含了一个常见的 URL 模式：\n\n```\n {controller}/{action}/{id}.\n\
  ```\n\n如 C# 所示，稍微更改 `Simple2Controller` 中的操作签名（将参数 `name` 重命名为 `id`）：\n\n\n\n\n\n\
  ```csharp\n public void Goodbye(string id)\n    {\n        Response.Write(\"Goodbye\
  \ \" + HttpUtility.HtmlEncode(id));\n    }\n```\n\n这允许你使用“更整洁”的 URL 调用该方法，路由将通过结构化的\
  \ URL 而不是查询字符串传递传递：\n\n```\n /Simple2/Goodbye/World\n```\n\n## 处理多个参数\n\n如果你的方法有多个参数怎么办呢？这种情况非常常见，请放心，你仍然可以使用查询字符串，但如果你想通过\
  \ URL 段传递两个参数，你必须专门为这种情况定义一个新的新路由。\n\n例如，假设你在 C# 中有一个动操作方法（action method），用于计算两个点之间的距离：\n\
  \n```csharp\n public void Distance(int x1, int y1, int x2, int y2)\n  {\n      double\
  \ xSquared = Math.Pow(x2 - x1, 2);\n      double ySquaredSquared = Math.Pow(y2 -\
  \ y1, 2);\n      Response.Write(Math.Sqrt(xSquared + ySquared));\n  }\n```\n\n如果只使用默认路由，请求需要像这样：\n\
  \n```\n /Simple2/Distance?x2=1&y2=2&x1=0&y1=0\n```\n\n你可以通过定义一个路由来稍微改进这种情况，该路由允许你以更整洁的格式指定参数。如果你记得本章关于路由的章节，其中提到如果你用常量分隔多个参数，就可以在段段中指定多个参数。现在是提供该示例的好时机！在\
  \ `RouteConfig.cs` 或 `RouteConfig.vb` 文件的 `RegisterRoutes`静态方法中，你可以使用 `MapRoute`\
  \ 方法定义新路由：\n\n```csharp\n routes.MapRoute(\"distance\",\n      \"Simple2/Distance/{x1},{y1}/{x2},{y2}\"\
  ,\n      new { Controller = \"Simple2\", action = \"Distance\" }\n  );\n```\n\n\
  注意你正在使用逗号字符来分隔 x 和 y 坐标。现在这个操作方法可以通过 URL 调用了：\n\n```\n /Simple2/Distance/0,0/1,2\n\
  ```\n\nURL 中出现逗号可能看起来很奇怪，但路由是非常强大的！\n\n到目前为止，你在这些小型示例方法中使用了 `Response.Write`，但这违反了关注点分离的原则。管理数据的“视图”并不是控制器的职责。那是由\
  \ MVC 中的“V”处理得更好的；即视图（views）。\n\n## 视图 (VIEWS)\n\n视图负责为用户提供用户界面（UI）。它被赋予模型（model）的引用，并将该模型转换为准备呈现给用户的格式。在\
  \ ASP.NET MVC 中，这包括检查控制器传递给它的 `ViewDataDictionary`（通过 `ViewData` 或 `ViewBag` 属性访问）并将其转换为\
  \ HTML。注意，`ViewBag` 是 `ViewData` 对象的封装，它允许你为 `ViewBag` 创建动态属性，而不是在 `ViewData` 对象中使用“魔法”字符串作为键。\n\
  \n在强类型视图的情况下（这将在本章节稍后于“强类型视图”节中进行更深入的讨论），`ViewDataDictionary` 具有一个强类型的 `Model` 对象，视图渲染该对象。该模型可能代表实际的领域对象，例如\
  \ `Product` 实例，也可能是特定于视图的演示模型对象，例如 `ProductEditViewData` 实例。\n\n快速查看一个视图示例。以下代码示例显示了\
  \ C# 版本默认 ASP.NET MVC 项目模板中的 Index 视图：\n\n```cshtml\n @{\n      ViewBag.Title =\
  \ \"Home Page\";\n  }\n  @section featured {\n      <section class=\"featured\"\
  >\n          <div class=\"content-wrapper\">\n              <hgroup class=\"title\"\
  >\n                  <h1>@ViewBag.Title.</h1>\n                  <h2>@ViewBag.Message</h2>\n\
  \              </hgroup>\n              <p>\n                  要了解更多关于 ASP.NET MVC，请访问\n\
  \                  <a href=\"http://asp.net/mvc\" title=\"ASP.NET MVC\n        \
  \              Website\">http://asp.net/mvc</a>a>.\n                  该页面提供了 <mark>视频、教程和示例</mark>以\
  \                      帮助你从 ASP.NET MVC 中获得最大的收益。\n                  如果你对 ASP.NET\
  \ MVC 有任何问题，请访问\n                  <a href=\"http://forums.asp.net/1146.aspx/1?MVC\"\
  \n                      title=\"ASP.NET MVC Forum\">我们的论坛</a>.\n              </p>\n\
  \          </div>\n      </section>\n  }\n  <h3>我们建议以下内容：</h3>\n  <ol class=\"round\"\
  >\n      <li class=\"one\">\n          <h5>快速入门</h5>\n          ASP.NET MVC 为你提供了一种强大的、基于模式的方法来构建动态\n\
  \          网站，能够实现清晰的关注点分离，并让你对标记有完全的控制权，以进行愉快、敏捷的开发。ASP.NET MVC\n          包含了许多功能，能够实现快速的、有利于\
  \ TDD 的开发，用于创建使用最新网络标准的应用程序。\n          <a href=\"http://go.microsoft.com/fwlink/?LinkId=245151\"\
  >了解更多 . . . </a>\n      </li>>\n\n      <li class=\"two\">\n          <h5>添加包</h5>\n\
  \          NuGet 让你轻松安装和更新库\n      </li\n\n      <li class=\"three\">\n        \
  \  <h5>查找网络托管</h5>\n          你可以轻松找到网络托管\n      </li>\n  </ol>\n```\n\n这是一个极其简单的视图示例，但它有助于指出视图的一些关键细节。你可能注意到的第一点是使用\
  \ `@{` 和 `}` 来界定块。这些字符用于定义 Razor 引擎的代码块，Razor 它是渲染 ASP.NET MVC 的默认引擎。你将在本章稍后看到更多这种\
  \ Razor 语法。你注意到的额外一点是缺少了一些标准的 HTML 页面元素。没有 doctype、head 或 body 元素。类似于 Web Forms\
  \ 中的主页，Layout 在 ASP.NET MVC 中允许你为网站定义一个通用的模板。Layouts 将在本章稍晚时候介绍。\n\n如果你熟悉 Web Forms\
  \ 的页面指令，你还会注意到没有页面指令。这是因为这不是 Web Form。事实上，此视图甚至不是使用 `WebFormEngine` 渲染的。ASP.NET\
  \ MVC 允许切换不同的视图引擎，但默认视图引擎是 `RazorEngine`。\n\nASP.NET MVC 中的视图继承自 `System.Web.Mvc.ViewPage`，后者分别继承自\
  \ `System.Web.UI.Page`（在 `WebFormEngine` 的情况下）或 `System.Web.Mvc.WebViewPage`（继承自\
  \ `System.Web.WebPages.WebPageBase`，在 `RazorEngine` 情况下）。强类型视图继承自泛型 `ViewPage<T>`\
  \ 或 `WebViewPage<T>`，再次取决于视图引擎。\n\n根据关注点分离的原则，视图不应包含应用程序和业务逻辑。事实上，它们应该尽可能少地包含代码。虽然包含视图逻辑是完全可以的，但视图通常是应用程序中最难进行自动化测试的部分，因此它们受益于极少代码。\n\
  \n### 指定视图\n\n到目前为止，本章讨论了视图做什么和不做什么，但还没有讨论如何指定渲染特定操作输出的视图。事实证明，当你遵循框架中隐含的约定时，这项任务非常简单。\n\
  \n当你创建一个新的项目模板时，注意项目包含一个以非常特定方式组织的 Views 目录（参见图 34-10）。\n\n![image](img/f1208-01.jpg)\n\
  \n**图 34-10**\n\n\n\n\n\n按照约定，`Views` 目录包含每个控制器对应的一个文件夹，文件夹名称与控制器名称相同，但不包含 `Controller`\
  \ 后缀。在每个 `Controller` 文件夹中，每个操作方法（action method）都有一个视图文件，命名与该操作方法相同。这为视图与操作方法的关联提供了基础。\n\
  \n例如，操作方法可以通过 `View` 方法返回一个 `ViewResult`，如下：\n\n```assembly\n public class HomeController\
  \ : Controller\n  {\n      public ActionResult Index()\n      {\n          ViewBag.Title\
  \ = \"Home Page\";\n          ViewBag.Message = \"Welcome to ASP.NET MVC!\";\n \
  \         return View();\n      }\n  }\n```\n\n这个方法看起来应该很熟悉；它是默认项目模板中 `HomeController`\
  \ 的 `Index` 操作方法。由于没有指定视图名称，该方法返回的 `ViewResult` 会在 `/Views/ControllerName` 目录下寻找与操作方法名同名的视图。在这种情况下，选中的视图将是\
  \ `/Views/Home/Index.cshtml` 或 `/Views/Home/Index.vbhtml`。\n\n与 ASP.NET MVC 中的大多数事情一样，这种约定是可以被覆盖的。假设你想让\
  \ `Index` 操作渲染不同的视图。你可以提供一个不同的视图名称，如下：\n\n```assembly\n public ActionResult Index()\n\
  \  {\n      ViewBag.Title = \"Home Page\";\n      ViewBag.Message = \"Welcome to\
  \ ASP.NET MVC!\";\n      return View(\"NotIndex\");\n  }\n```\n\n在这种情况下，它仍然会在 `/Views/Home`\
  \ 目录中查找，但会选择 `NotIndex.cshtml` 或 `NotIndex.vbhtml` 作为视图。在某些情况下，你可能甚至想在完全不同的目录结构中指定视图。\n\
  \n你可以使用波浪号（tilde）语法来提供视图的完整路径，如下：\n\n```assembly\n public ActionResult Index()\n\
  \  {\n      ViewBag.Title = \"Home Page\";\n      ViewBag.Message = \"Welcome to\
  \ ASP.NET MVC!\";\n      return View(\"~/Some/Other/View.cshtml\");\n  }\n```\n\n\
  使用波浪号语法时，必须提供视图的文件扩展名，因为这将绕过视图引擎查找视图的内部查找机制。\n\n### ASP.NET MVC 布局 (Layouts)\n\n\
  你通常希望为整个网站创建一个类似的视觉效果，或者至少为网站的不同区域创建类似的效果。ASP.NET 2.0 在典型的 Web Forms 应用中使用 `.aspx`\
  \ 时引入了“主页”（master pages）的概念来实现这一目标。Razor 支持名为 Layouts 的功能，在 Razor 视图中支持相同的概念。\n\n\
  探索 Razor 视图布局最简单的方法是查看在本节之前创建的默认项目。如果你查看图 34-10，你会看到 `Views` 文件夹下有一个没有对应控制器的文件夹，即\
  \ `Shared` 文件夹。虽然大多数视图位于提供其数据的控制器对应的文件夹中，但 `Shared` 文件夹中的视图旨在被多个视图“共享”。你还会注意到，`Shared`\
  \ 文件夹中的许多视图遵循了以下划线开头的命名约定。这种约定继承自 ASP.NET Web Pages，该框架没有像你在 MVC 中获得的那种种针对视图文件夹和路由的内置保护。布局页面并不用于直接提供和浏览。Web\
  \ Pages 框架已配置为不允许直接请求文件名以下划线开头的文件。以下代码显示了布局文件的 C# 版本：\n\n```html\n <!DOCTYPE html>\n\
  \  <html lang=\"en\">\n      <head>\n          <meta charset=\"utf-8\" />\n    \
  \      <title>@ViewBag.Title - My ASP.NET MVC Application</title>\n          <link\
  \ href=\"~/favicon.ico\" rel=\"shortcut icon\" type=\"image/x-icon\" />\n      \
  \    <meta name=\"viewport\" content=\"width=device-width\" />\n          @Styles.Render(\"\
  ~/Content/css\")\n          @Scripts.Render(\"~/bundles/modernizr\")\n      </head>\n\
  \      <body\n          <header>\n              <div class=\"content-wrapper\">\n\
  \                  <div class=\"float-left\">\n                      <p class=\"\
  site-title\">\n                          @Html.ActionLink(\"your logo here\", \"\
  Index\", \"Home\")\n                      </p>\n                  </div>\n     \
  \             <div class=\"float-right\">\n                      <section id=\"\
  login\">\n                          @Html.Partial(\"_LoginPartial\")\n         \
  \             </section>\n                      <nav>\n                        \
  \  <ul id=\"menu\">\n                              <li>@Html.ActionLink(\"Home\"\
  , \"Index\", \"Home\")</li>\n                              <li>@Html.ActionLink(\"\
  About\", \"About\", \"Home\")</li>\n                              <li>@Html.ActionLink(\"\
  Contact\", \"Contact\", \"Home\")</li>\n                          </ul>\n      \
  \                </nav>\n                  </div\n              </div>\n       \
  \   </header>\n          <div id=\"body\">\n              @RenderSection(\"featured\"\
  , required: false)\n              <section class=\"content-wrapper main-content\
  \ clear-fix\">\n                  @RenderBody()\n              </section>\n    \
  \      </div>\n          <footer>\n              <div class=\"content-wrapper\"\
  >\n                  <div class=\"float-left\">\n                      <p>&copy;\
  \ @DateTime.Now.Year - My ASP.NET MVC Application</p>\n                  </div>\n\
  \              </div>\n          </footer>\n\n          @Scripts.Render(\"~/bundles/jquery\"\
  )\n          @RenderSection(\"scripts\", required: false)\n      </body>\n  </html>\n\
  ```\n\n你首先应该注意到的是 `doctype`、`html`、`head` 和 `body` 标签，这些在最初查看 `Index` 视图时已经提到。此布局文件默认被所有视图继承。下一个需要注意的点是\
  \ `@RenderBody()` 的调用。基于此布局的视图将在该调用处插入其内容。\n\n视图可以通过设置 `WebPageBase` 类上的 `Layout`\
  \ 属性来指定它应该使用的布局。你可以如所示在视图本身中使用 Razor 代码块来实现：\n\n```razor\n @{\n      Layout = \"\
  ~/Views/Shared/_Layout.cshtml\";\n  }\n```\n\n属性必须在所有使用布局的视图上设置。你可以为网站准备多个布局文件，并通过简单更改视图中的布局文件名来指定每个视图使用的特定布局。在所有视图上设置\
  \ `Layout` 属性会导致大量的重复代码。为了防止这种重复，你可以使用 Razor 的另一个功能，允许你在一个位置定义所有视图的布局逻辑。这不仅减少了重复，而且使代码更具维护性。你可以在\
  \ `Views` 文件夹中添加名为 `_ViewStart.cshtml` 或 `_ViewStart.vbhtml` 的文件。`_ViewStart` 文件用于在每个视图渲染开始时执行公共视图代码。你可以将\
  \ `Layout` 属性设置从视图移动到 `_ViewStart` 文件，它将应用于所有视图。你可以在任何视图中通过将 `Layout` 属性设置为不同的布局来覆盖它。在默认模板中，`_ViewStart`\
  \ 文件包含如前文所示的设置 `Layout` 属性的代码块。在 Visual Studio 中使用“添加视图”对话框创建视图时，你可以指定要在视图使用的布局。[图\
  \ 34-11] 显示了勾选了“使用布局或主页”选项的添加视图对话框。注意，如果你正在使用 `_ViewStart` 文件，可以留布局文件名为空。\n\n\n\n\
  \n\n在布局文件中你会看到的另一个重要内容是对 `@RenderSection` 方法的调用。到目前为止，你只查看了使用 `@RenderBody` 方法渲染的布局文件的主体部分。Razor\
  \ 还支持创建多个“命名区域”（named sections），这些区域可以用于渲染动态内容到最终响应的多个不连续的区域。`@RenderSection` 方法的第一个参数是区域的名称。该名称用于指定视图中区域的内容。你可以通过设置\
  \ `required` 参数来将区域指定为必选的或可选的。再次查看之前显示的布局文件代码段，你会看到一个通过调用 `@RenderSection` 渲染的名为“featured”的命名区域：\n\
  \n```\n @RenderSection(\"featured\", required: false)\n```\n\n现在查看 `Views/Home`\
  \ 文件夹下的 `Index` 视图。该视图包含一个名为“featured”的区域。无论“featured”区域在视图文件中的哪个位置，它都将显示在布局文件中调用相应\
  \ `@RenderSection` 的点上。接下来的代码示例显示了 `Index` 视图中的区域块：\n\n```\n @section featured {\n\
  \      <section class=\"featured\">\n          <div class=\"content-wrapper\">\n\
  \              <hgroup class=\"title\">\n                  <h1>@ViewBag.Title.</h1>\n\
  \                  <h2>@ViewBag.Message</h2>\n              </hgroup>\n        \
  \      <p>\n                  要了解更多关于 ASP.NET MVC 的信息，请访问\n                  <a\
  \ href=\"http://asp.net/mvc\" title=\"ASP.NET MVC \n                      Website\"\
  >http://asp.net/mvc</a>。\n                  该页面提供了 <mark>视频、教程和示例</mark>来\n    \
  \              帮助你充分利用 ASP.NET MVC。\n                  如果你对 ASP.NET MVC 有任何问题，请访问\n\
  \                  <a href=\"http://forums.asp.net/1146.aspx/1?MVC\" title=\"ASP.NET\
  \ MVC \n                      Forum\">我们的论坛</a>。\n              </p>\n         \
  \ </div>\n      </section>\n  }\n```\n\n注意，视图中的区域可以包含静态和动态内容。使用区域允许你组织视图文件中的内容，而不必考虑它们最终渲染的顺序。区域还允许布局文件为被渲染的视图指定动态内容的多个位置。\n\
  \n### 强类型视图 (Strongly Typed Views)\n\n假设你有一个 `Product` 实例列表，你想在视图中显示它。实现此目的的方法之一仅仅是将产品添加到视图数据字典中并在视图中对其进行迭代。\n\
  \n例如，控制器操作中的代码可能像所示：\n\n```\n public ActionResult List()\n  {\n      var products\
  \ = new List<Product>();\n          for(int i = 0; i < 10; i++)\n          {\n \
  \             products.Add(new Product {ProductName = \"Product \" + i});\n    \
  \      }\n      ViewBag.Products = products;\n      return View();\n  }\n```\n\n\
  在视图中，你可以使用 Razor 语法像如下所示迭代并显示产品：\n\n```\n <ul>\n  @foreach (Product p in ViewBag.Products){\n\
  \      <li>@p.ProductName</li>\n  }\n  </ul>\n```\n\n由于 `ViewBag` 包含动态属性且不是强类型类型，因此在\
  \ `foreach` 循环中需要进行类型转换。如果你能为视图提供所发送的模型的类型，代码将变得更加整洁。这正是强类型视图大显身场。\n\n在控制器方法中，你可以通过\
  \ `View` 方法的重载来指定模型，并在其中传入模型：\n\n```\n public ActionResult List()\n  {\n      var\
  \ products = new List<Product>();\n      for(int i = 0; i < 10; i++)\n         \
  \ {\n              products.Add(new Product {ProductName = \"Product \" + i});\n\
  \          }\n      return View(products);\n  }\n```\n\n在后台，这会将 `ViewData.Model`\
  \ 属性的值设置为传递给 `View` 方法的值。下一步是更改视图的类型以继承自 `WebViewPage<T>`。在 MVC 模型中，视图实际上并不应该拥有代码后文件（code-behind\
  \ file）。事实上，ASP.NET MVC 中的视图默认情况下不存在代码后文件。如果你想要强类型视图，只需如下所示在视图的 `@Model` 指令中添加类型即可：\n\
  \n```\n @Model System.Collections.Generic.List<MvcBasic.Models.Product>\n```\n\n\
  这是使用强类型视图的首选方式。现在，在视图的标记中，你可以访问强类型的 `ViewData.Model` 属性，并拥有完全的 IntelliSense 支持：\n\
  \n```\n <ul>\n  @foreach (Product p in Model){\n      <li>@p.ProductName</li>\n\
  \  }\n  </ul>\n```\n\n### 使用 HTML 辅助方法 (Using HTML Helper Methods)\n\nASP.NET MVC\
  \ 框架经常推崇的特性之一是它让你完全控制应用程序，包括 HTML 标记。许多人将此宣布为框架的优势。毕竟，完全的控制是好事，对吧？但这实际上是框架的一个特性，其好坏取决于情况。\n\
  \n有时你并不想对标记有控制权。你更倾向于放入一个控件并让它来确定标记，因为你不在乎它的外观。而在其他时候，你希望对标记有绝对的控制权。掌控一切很棒，但也意味着更大的责任。你现在负责输出原本由服务器控件处理的标记。\n\
  \n### HtmlHelper 类与扩展方法 (HtmlHelper Class and Extension Methods)\n\n`WebViewPage`\
  \ 类有一个名为 `Html` 的 `HtmlHelper` 属性。当你查看 `HtmlHelper` 方法时，你会发现它们相当稀少。该属性实际上是附加扩展方法的挂载点。当你导入\
  \ `System.Web.Mvc.Html` 命名空间（模板中默认导入的），`Html` 属性就会出现大量的辅助方法。\n\n在图 34-12 的截图中，扩展方法由灰色箭头表示。\n\
  \n![image](img/f1213-01.jpg)\n\n**图 34-12**\n\n`HtmlHelper` 方法方法的一个优点是，由于它们是普通的扩展方法，如果你不喜欢框架提供的辅助方法，可以删除此命名空间并附加自己的辅助扩展方法。同样，它通过编写\
  \ `HtmlHelper` 类的扩展方法为添加自定义辅助方法提供了方便的约定位置。\n\n所有辅助方法共享一些值得共同模式：\n\n*   所有辅助方法都会编码属性值。\n\
  *   所有辅助方法都会 HTML 编码它们显示的值，例如链接文本。\n*   接收 `RouteValueDictionary` 的辅助方法都有相应的重载，允许使用匿名对象作为字典。\n\
  *   同样，接收用于指定 HTML 属性的 `IDictionary<string, object>` 的辅助方法也有相应的重载，允许使用匿名对象作为字典。\n\
  *   用于渲染表单字段的辅助方法会自动在 `ModelState` 字典中查找当前值。辅助方法的名称参数用作键。\n*   如果 `ModelState` 包含错误，与该错误相关的表单助手除了显式指定的\
  \ CSS 类外，还会渲染一个 `input-validation-error` CSS 类。项目模板包含的默认样式表 `style.css` 包含了该类的样式。\n\
  \n\n\n\n\nASP.NET Web Forms 开发者在处理 ASP.NET MVC 与 Web Forms 的区别时，需要习惯许多差异。在许多方面，使用\
  \ ASP.NET MVC 的感觉就像是相对于经典 ASP “退了 10 年”——尤其是在处理 UI 和视图时。\n\n对于某些人来说，这是一个受欢迎的改变和一种焕目一新的感觉；但对另一些人来说，这根本行不通。这确实需要一些适应时间，但最终，核心的\
  \ ASP.NET 功能以及整个 `.NET Framework` 都会为你提供支持。\n\n最终，最记住的一点是，ASP.NET Web Forms 和 ASP.NET\
  \ MVC 都是构建在 ASP.NET 基础上的。可以将其视为 `ASP.NET > Web Forms` 和 `ASP.NET > ASP.NET MVC`。这两种技术底层都有非常深的内容，因此你可以无顾地使用其中任何一种或两者。许多人发现混合模型适合他们，或者他们在从一种模型迁移到另一种模型时使用混合模式。选择一个让你觉得效率最高的模型并坚持下去即可。\n\
  \n# 35\n## ASP.NET Web Pages 和 Razor\n\n### 本章包含内容？\n- ASP.NET Web Pages 简介\n- `Razor`\
  \ 语法的概述\n- 使用 `Razor` 显示数据\n- 使用辅助函数（Helper functions）\n\n## 本章 WROX.COM 代码下载\n\n\
  请注意，本章所有的代码示例都可以作为本章代码的一部分，在书籍网站 [`www.wrox.com`](http://www.wrox.com) 的“Download\
  \ Code”选项卡中下载。\n\n在全书中，我们提到了“经典”（Classic）ASP。你可能没有机会使用这项伟大的技术。然而，如果你曾经用过，使用 `Razor`\
  \ 语法开发 ASP.NET Web Pages 可能会唤起那些美好的回忆。但这项技术大不相同。在本章中，你将有机会看到使用 `Razor` 的 Web Pages\
  \ 如何提供比“经典”ASP 更强大的解决方案。\n\n上一章讨论了 ASP.NET MVC。在当时，你有机会使用 ASP.NET WebForm 视图引擎。你还略微了解了另一个视图引擎选项，即\
  \ `Razor` 视图引擎。`Razor` 视图引擎与 Web Pages 使用相同的 `Razor` 语法。如果你的应用程序对于 ASP.NET Web Pages\
  \ 来说变得太复杂，那么最合理的方法是开始将 `Razor` 视图引擎的组件迁移到 ASP.NET MVC。\n\n虽然本章没有涵盖 ASP.NET MVC 的\
  \ `Razor` 视图引擎，但你将对 `Razor` 语法如何工作有一个良好的理解。你将能够结合上一章中学的 MVC 原则使用该语法。\n\n## ASP.NET\
  \ WEB PAGES 概述\n\nASP.NET Web Pages 是微软引入的一项相当新技术，用于使用 ASP.NET 开发动态 Web 应用程序，但不一定需要\
  \ Microsoft Visual Studio 2012。相反，你可以使用记事本等基础文本编辑器开发 ASP.NET Web Pages，或者使用首选方法：使用如\
  \ `ASP.NET WebMatrix` 等 IDE。\n\n与静态 HTML 页面不同，动态页面允许终端用户与 Web 表单交互、操作并保存数据，以及与社交媒体服务等第三方服务交互。\n\
  \n与 ASP.NET MVC 类似，Web Pages 在几个领域允许扩展性。扩展 Web Pages 的一种方法是创建和使用 `helpers`（辅助函数）。`helpers`\
  \ 与 ASP.NET 服务器控件非常，因为大多数 `helpers` 封装了可重用的标记。正如你在本章中所看到的，Web Pages 内置了几个 `helpers`。你可以通过\
  \ `NuGet`（在附录 G 中进一步讨论）或自定义开发来包含其他函数。\n\n## 使用 RAZOR 创建 HTML 表单\n\n在开始使用 `Razor`\
  \ 构建网页之前，你需要更多关于 `Razor` 语法的知识。在 ASP.NET Web Forms 中，你通过使用脚本块来定义内联代码，例如：\n\n```\n\
  \ <script runat=\"server\">\n      //在此处插入代码\n  </script>\n```\n\n`Razor` 语法略有不同。你仍然可以定义内联代码。但不是使用上述格式的脚本块，你可以像列表\
  \ 35-1 所示那样定义脚本块。\n\n在深入学习 Web Pages 中的特定功能和辅助函数之前，先创建一个可以使用的 HTML 页面。要做到这一点，请使用\
  \ `WebMatrix`。当你打开 `WebMatrix` 时，系统会提示执行操作，如图 35-1 所示。\n\n![image](img/f1217-01.jpg)\n\
  \n**图 35-1**\n\n从此屏幕中，你可以看到四个选项。你可以打开现有站点、使用站点模板，或使用应用程序库加载应用程序。你也可以选择不再显示此快速菜单，而是加载带有文件浏览功能的\
  \ `WebMatrix`。你也可以选择打开现有站点、使用站点模板，或使用应用程序库加载应用程序。\n\n站点模板列表如图 35-2 所示，包含了数若干种适用于\
  \ ASP.NET、PHP、node.js 和 HTML 的 Web 模板。ASP.NET 模板用于使用 Web Pages 的示例应用程序。\n\n![image](img/f1218-01.jpg)\n\
  \n**图 35-2**\n\n应用程序库如图 35-3 所示，包含了许多你可以加载的预构建应用程序。库中包含大多数应用程序都使用 ASP.NET 或 PHP。\n\
  \n![image](img/f1218-02.jpg)\n\n**图 35-3**\n\n对于本次练习，选择使用现有站点。当你这样做时，你将面临如图 35-4\
  \ 所示的三个选项。\n\n![image](img/f1219-01.jpg)\n\n**图 35-4**\n\n- 顶部选项是从站点（Sites）中选择。这让你看到每个网站。\n\
  - 底部选项是连接到远程服务器。\n- 因为你要创建一个全新的应用程序，请选择文件夹（Folder）选项。这将启用带有端口的 IIS 绑定。\n\n应用程序在\
  \ WebMatrix 中启动并添加了 `robots.txt` 文件，如图 35-5 所示。\n\n![image](img/f1219-02.jpg)\n\n\
  **图 35-5**\n\n构建 Web Pages 应用程序的下一步是切换到文件（Files）视图。你会在图 35-6 中注意到，尽管你在使用 WebMatrix\
  \ 构建它，但你可以在任何时候用 Visual Studio 2012 打开你的应用程序。\n\n![image](img/f1220-01.jpg)\n\n\
  **图 35-6**\n\n现在，你已经创建了 Web Pages 应用程序，处于 `WebMatrix` 中，并准备添加一个文件。如图 35-6 所示，添加文件非常简单。选择创建新文件。然后系统会如图\
  \ 35-7 所示要求选择特定的文件类型。虽然你下一步将创建 HTML，但请选择 Web Pages 的两种 Razor 格式之一——用于 C# 的 `.cshtml`\
  \ 或用于 VB 的 `.vbhtml`。\n\n![image](img/f1220-02.jpg)\n\n**图 35-7**\n\n为 C# 将文件命名为\
  \ **addtask.cshtml**，或为 VB 命名为 **addtask.vbhtml**。这将创建一个与以下代码非常相似的文件：\n\n```\n @{\n\
  \n  }\n  <!DOCTYPE html>\n  <html lang=\"en\">\n      <head>\n          <meta charset=\"\
  utf-8\" />\n          <title></title>\n      </head>\n      <body>  \n      </body>\n\
  \  </html>\n```\n\n## ## 显示数据\n\n如你之前的代码片段所示，你的页面顶部包含了一个基本的 Razor 代码块。页面的其余部分包含基础页面的\
  \ HTML。\n\n\n\n\n\n与 ASP.NET Web Forms 一样，Razor 也具有连接数据库并与数据交互的能力。此外，WebMatrix 具有在应用程序内部创建数据库的功能。如果你回顾图\
  \ 35-6，你会看到 WebMatrix 左下角有一个 `Databases`（数据库）选项卡。当打开 `Databases` 选项卡时，你可以按照在本章稍早添加\
  \ `addtask` 文件时类似的方式创建一个数据库。WebMatrix 为数据库提供了三个内置选项。默认选项是 SQL Server CE（紧凑版）。该数据库扩展名为为\
  \ `.sdf`。你也可以创建 SQL Server 数据库或 MySQL 数据库。对于你的应用程序，请保留默认选项，并按照图 35-8 所示所示创建数据库。\n\
  \n![image](img/f1221-01.jpg)\n\n**图 35-8**\n\n创建数据库后，添加一个表来存储你的任务。该表将非常直观——按照图 35-9\
  \ 所示定义表。\n\n![image](img/f1222-01.jpg)\n\n**图 35-9**\n\n现在，既然数据结构已经就绪，是时候回到你的 `addtask`\
  \ Web 页面了。你将添加任务所需的表单元素。在这种情况下，你只需要一个文本框和一个提交按钮来添加任务。`addtask` 的 HTML 代码如代码列表 35-2\
  \ 所示（在本章的代码下载中为 `addtask.vbhtml` 或 `addtask.cshtml`）。\n\n下一步是添加与数据库的连接并将任务添加到数据库中，如代码列表\
  \ 35-3 所示。\n\n这个页面还没有完全写完。稍后你还会回到该页面进行最后的微调。\n\n你项目的下一步是列出所有任务。因为这是应用程序的主要目的，所以任务列表将出现在你的默认页面上。向你的应用程序添加\
  \ `default.cshtml` 或 `default.vbhtml` 文件，这样你就可以开始添加显示任务所需的代码了。你不预期数据会增长到需要数据分页的程度，因此你会在默认页面上添加两个项目。第一个项目是由\
  \ `WebGrid` 辅助器生成的输出，第二个项目是允许用户向列表添加更多任务的超链接。完成后的默认页面源代码如代码列表 35-4 所示。\n\n与 Razor\
  \ 语法中的大多数辅助器一样，`WebGrid` 辅助器允许你在代码中设置一组自定义属性。在这种情况下，你正在设置三个样式属性并添加一个自定义列列表。列列表仅包含任务描述本身。列的第一个参数是\
  \ SQL 列名。第二个参数是将被添加到渲染后的 HTML 中的用户友型列头。\n\n### 验证\n\n让我们重新回到 `addtask` 页面。目前，你对允许插入数据库表中的数据没有任何限制。因此，你可能会有人输入超过\
  \ 250 个字符，或者让该字段为空。显然，这不会带给你你预期的体验。因此，你必须更新 `AddTask` 页面以包含验证。你将添加的验证包括一个 `ValidationSummary`\
  \ 辅助器，它与第 6 章中讨论的 `ValidationSummary` Web Form 非常相似。你还将为 `taskDescription` 元素添加验证。\n\
  \n你的源代码中，你需要定义验证规则。在这种情况下，将任务设置为必填项，并强制限制长度为 250 个字符或少。使用 `Validation.RequireField`\
  \ 和 `Validation.Add` 来完成这些任务。`Validation.Add` 的第一个参数接受元素名称，第二个参数接受一个验证类型。可用的验证类型包括：\n\
  \n* `Validator.DateTime ([error message])`\n* `Validator.Decimal([error message])`\n\
  * `Validator.EqualsTo([other element],[error message])`\n* `Validator.Float([error\
  \ message])`\n* `Validator.Integer([error message])`\n* `Validator.Range([min],[max],[error\
  \ message])`\n* `Validator.RegEx([regex pattern],[error message])`\n* `Validator.Required([error\
  \ message])`\n* `Validator.StringLength([maximum length])`\n* `Validator.Url([error\
  \ message])`\n\n与 Web Forms 类似，你还需要检查页面是否有效。调用 `Validation.IsValid` 来确保这一点。此外，为了显示你可以使用单个错误而不仅仅提供摘要，你将使用\
  \ `ValidationMessage` 辅助器显示用户友好的错误信息。代码列表 35-5 显示了实现了实现验证的 `addtask` 页面。\n\n###\
  \ 使用布局 (Layouts)\n\nRazor 最实用的功能之一是它的模板能力。通常这指的是我们可以创建的数据模板。然而，Razor 还包含了以布局（Layouts）形式存在的网站模板。布局与主页非常相似。你可以使用\
  \ `RenderBody` 来渲染内容。你还使用 `RenderSection` 来指定特定区域的内容。\n\n## 使用辅助器\n\n之前的 Web 页面示例使用了多个辅助器。你使用了\
  \ `WebGrid` 显示数据，并使用了 `ValidationSummary` 和 `ValidationMessage` 显示异常信息。你还使用了 `RenderBody`\
  \ 和 `RenderSection` 显示其他 Web 页面的信息。这只是开始。Web 页面内置了许多你可以使用的辅助器。\n\n### 核心辅助器\n\n\
  你可以使用核心辅助器为你的应用程序添加基础功能。这些包括：\n\n* `WebSecurity`\n* `OAuthWebSecurity`\n* `ReCaptcha`\n\
  * `WebMail`\n* `WebCache`\n\n#### WebSecurity 辅助器\n\n`WebSecurity` 辅助器允许用户在应用程序中进行身份验证。它允许你定义角色并将其分配给用户。这与\
  \ ASP.NET 处理成员管理的方式非常相似。\n\n通过添加名为 `_AppStart.cshtml` 或 `_AppStart.vbhtml` 的文件来启动\
  \ `WebSecurity` 的使用。在文件中添加以下内容：\n\n```\nWebSecurity.InitializeDatabaseConnection(\"\
  Chapter35\", \"UserProfile\", \"UserId\", \"Username\", true);\n```\n\n第一个参数是用于初始化成员管理的数据库名称。接下来的三个参数是用户表、用户表的主键字段以及用户名字段。\n\
  \n使用 `WebSecurity` 的下一步是创建一个注册页面你可以在站点模板中找到注册页很好的示例。在该模板中，你发现了其他示例网页，包括但不限于登录和注销网页。\n\
  \n你也可以从源代码内部创建用户。在创建用户之前，你想确保该用户不存在：\n\n```\nWebSecurity.UserExists(\"username\"\
  ) == false\n```\n\n在确认用户不存在后，你可以创建一个新用户。\n\n\n\n\n\n```\nWebSecurity.CreateUserAndAccount(\"\
  username\",\"password\")\n```\n\n现在，此时此时你已经配置了数据库以创建用户，并使用 `CreateUserAccount` 方法创建了一个新用户。既然用户已经创建，现在该让你登录该用户了。同样，查看\
  \ Starter Site 模板中是如何实现登录页也是一个好主意。当你准备好登录用户时，可以使用以下代码检查凭据：\n\n```\nWebSecurity.Login(\"\
  username\",\"password\")\n```\n\n当用户登录到网站后，你可能想向用户打个招呼。你可以使用以下代码显示用户的用户名：\n\n```\n\
  if (WebSecurity.IsAuthenticated())\n  {\n      @WebSecurity.CurrentUserName;\n \
  \ }\n```\n\n这段代码段首先检查用户是否通过身份验证。如果用户已通过验证，则显示当前用户名。\n\n你将探索的最后一个方法是让用户退出网站。你可以通过以下代码实现：\n\
  \n```\nWebSecurity.Logout()\n```\n\n### OAuthWebSecurity 助手\n\n`OAuthWebSecurity`\
  \ 助手允许在你的网站同时使用 OAuth 和 OpenID 身份验证。换句话说，如果你访问过某个网站，它要求你在继续操作之前使用 Facebook、Google、Microsoft、Twitter\
  \ 或 Yahoo! 登录，那么该网站使用的就是 OAuth 或 OpenID。Google 和 Yahoo! 使用 OpenID，因此它们的实现相当简单。另外三个则需要应用程序\
  \ ID 或客户端 ID 以及应用程序密钥或客户端密钥来完成身份验证。这三者使用的是 OAuth 标准。\n\n如之前所示，你需要初始化数据库。在 `InitializeDatabaseConnection`\
  \ 之后，你可以添加以下一项或多项内容：\n\n```\nOAuthWebSecurity.RegisterGoogleClient(\"displayName\"\
  );\n  OAuthWebSecurity.RegisterYahooClient(\"displayName\");\n  OAuthWebSecurity.RegisterFacebookClient(\"\
  appId\",\"appSecret\");\n  OAuthWebSecurity.RegisterMicrosoftClient(\"clientId\"\
  ,\"clientSecret\");\n  OAuthWebSecurity.RegisterTwitterClient(\"consumerKey\",\"\
  consumerSecret\");\n```\n\n### ReCaptcha 助手\n\n`ReCaptcha` 助手利用流行的 `ReCaptcha` 图片来帮助保护\
  \ Web 表单，并确保提交表单的用户是人类而非系统。`ReCaptcha` 助手是 Web Page Helpers 库的一部分，你可以从 NuGet 下载该库。\n\
  \n你可以通过在 `_AppStart.cshtml` 或 `_AppStart.vbhtml` 页面中包含 `Microsoft.Web.Helpers` 来设置\
  \ `ReCaptcha` 的使用。在该页面的代码块中，添加以下内容：\n\n```\nReCaptcha.PublicKey = \"your-public-key\"\
  ;\nReCaptcha.PrivateKey = \"your-private-key\";\n```\n\n在想要使用验证码图片的的页面中，你可以在 HTML\
  \ 标记中添加以下内容：\n\n```\n@ReCaptcha.GetHtml()\n```\n\n在同一页面的代码块中，你还需要添加：\n\n```\nif\
  \ (ReCaptcha.Validate()) {\n      // 因为 ReCaptcha 通过了验证，所以执行某些操作\n  }\n```\n\n###\
  \ WebMail 助手\n\n`WebMail` 助手允许以 HTML 格式发送电子邮件。与其他许多助手不同，`WebMail` 助手不会渲染标记。相反，它被用于简化通过源码发送电子邮件消息的过程。使用\
  \ `WebMail` 助手的示例请参见列表 35-9。\n\n### WebCache 助手\n\n缓存是 ASP.NET 中一个极其重要的部分。因此，Web\
  \ Pages 也有缓存机制并不意外。`WebCache` 助手正是为此此设计的。它与 ASP.NET Web Forms 中缓存项目的方式非常非常相似。列表\
  \ 35-10 展示了 `WebCache` 助手。\n\n### 使用助手添加功能\n\n除了已经涵盖的助手外，还有几个助手为 Web Pages 添加了功能。更流行的包括\
  \ `WebImage`、`FileUpload`、`Video`、`Bing`、`Maps` 以及各种社交助手。\n\n#### WebImage 助手\n\n\
  `WebImage` 助手允许通过传入流或路径来操作图像。`WebImage` 助手有多个方法可以调整图像大小并以其他方式对其处理。要获取从表单提交的图像，你可以使用类似代码：\n\
  \n```\nWebImage photo = WebImage.GetImageFromRequest();\n```\n\n#### FileUpload\
  \ 助手\n\n`FileUpload` 助手允许网页具备文件上传功能。该助手有多个属性，可以根据值更改渲染的标记。例如，如果你想显示三个上传框，并允许访问者选择显示更多框，你可以像下面一样将控件添加到页面：\n\
  \n```\n@FileUpload.GetHtml(initialNumberOfFiles:3, allowMoreFilesToBeAdded:true,\n\
  \      includeFormTag:true, uploadText:\"Upload\")\n```\n\n#### Video 助手\n\n随着 HTML5\
  \ 变得越来越流行，`Video` 助手的用途将减少。然而，许多 Web 应用仍使用 Windows Media、Flash 或 Silverlight 来显示视频。`Video`\
  \ 助手允许根据指定的属性渲染标记。例如，如果你想在 600×400 的框架中使用 Silverlight 显示一个欢迎视频，你可以使用类似下面的代码：\n\n\
  ```\n@Video.Silverlight(\n      path: \"Videos/Welcome.xap\",\n      width: \"600\"\
  ,\n      height: \"400\")\n```\n\n#### Bing 助手\n\n许多应用程序的一个常用功能是包含搜索框。为了让搜索工作，你的网站必须是公开的，且\
  \ Bing 必须索引过你的站点。`AppStart.cshtml` 或 `_AppStart.vbhtml` 文件：\n\n```\nBing.SiteUrl\
  \ = \"your-site.com\";\n  Bing.SiteTitle = \"Search Site\";\n```\n\n然后，要在页面上渲染搜索框：\n\
  \n```\n@Bing.Search()\n```\n\n#### Maps 助手\n\n`Maps` 助手允许你显示来自 Bing、Google、MapQuest\
  \ 或 Yahoo! 的地图。要显示 Google 地图，你可以添加：\n\n```\n@Maps.GetHtml(\"1 Redmond Way, WA\"\
  , width=\"600\", height=\"400\")\n\n\n#### 社交网络助手\n\n集成社交媒体的能力对于如今的 Web 应用至关重要。为了减轻这项任务，添加了几个助手来完成许多任务。这些包括：\n\
  \n-   `Facebook`\n-   `Twitter`\n-   `LinkShare`\n-   `Gravatar`\n-   `GamerCard`\n\
  \n`Facebook` 助手目前只有一个目的。该目的是在网页上显示点赞按钮。它可以简单地使用 `Facebook.LikeButton()`，也可以引导用户点赞非当前页面：\n\
  \n```\n@Facebook.LikeButton(href=\"http://wrox.com\", action=\"recommend\",\n  \
  \    buttonLayout=\"button_count\", showFaces=true, colorScheme=\"dark\")\n```\n\
  \n`Twitter` 助手有两个方法。一个是帮助链接到用户的 Twitter 配置并在标准的 Twitter 小部件中显示结果；另一个是获取 Twitter\
  \ 搜索结果并在标准的 Twitter 小部件中显示它们。你可以通过以下操作使用这两者：\n\n```\n@Twitter.Profile(\"jgaylord\"\
  )\n  @Twitter.Search(\"Razor Syntax\")\n```\n\n`LinkShare` 助手渲染社交媒体图标并允许带有自定义页面标题的共享。该助手渲染\
  \ Delicious、Digg、Facebook、Reddit、StumbleUpon 和 Twitter 的图标。其用法示例为：\n\n```\n@LinkShare.GetHtml(\"\
  Social Sharing Example\")\n```\n\n`Gravatar` 助手连接到 Gravatar 网站并根据用户名显示头像。Gravatar\
  \ 是用户名的图像表示。这些通常用于论坛、聊天室和评论表单。例如，要显示作者 Jason Gaylord 的 Gravatar，你使用：\n\n```\n@Gravatar.GetHtml(\"\
  jason@jasongaylord.com\")\n```\n\n\n\n\n`GamerCard` 辅助程序会显示 Xbox 游戏卡片的副本。游戏卡片包含你的玩家图标、最近玩的游戏以及你的声誉分。这里显示了显示游戏卡片的示例：\n\
  \n```\n @GamerCard.GetHtml(\"Major Nelson\")\n```\n\n### 创建自定义辅助程序\n\n创建自定义辅助程序实际上比你想象的要简单得多。你可以使用在本章早期启动的任务应用程序，或者创建一个新的\
  \ Web Pages 应用程序。首先，向应用程序添加一个名为 `App_Code` 的新文件夹。\n\n在 `App_Code` 文件夹中，创建一个名为 `AmazonBooks.cshtml`（在你的\
  \ C# 应用程序中）或 `AmazonBooks.vbhtml`（在你的 VB 应用程序中）的文件。此单独文件将托管三个不同的辅助程序方法。该文件的命名至关重要，因为这将是你辅助程序的名称。因此，要确保如果你在使用诸如\
  \ `AmazonBooks` 这样的名称，已经存在名为 `AmazonBooks` 的辅助程序。\n\n在你的 Amazon 文件中，添加如列表 35-11\
  \ 所示的代码。\n\n如你在列表 35-11 所示，你在 `AmazonBooks` 辅助程序中有三个辅助程序方法。每个方法都渲染不同格式的图书列表，并带有指向\
  \ Amazon 页面的链接。你现在可以像这里所示在任何页面中使用它来消费这些功能：\n\n```\n @AmazonBooks.ImageOnly(\"1118311825\"\
  )\n```\n\n此示例中传递的 ISBN 是该书的 10 位 ISBN 号。\n\n## 总结\n\n在本章中，你领略了 Razor 语法和 ASP.NET\
  \ Web Pages 的魅力。你从学习 ASP.NET WebMatrix 开始。你回顾了在 WebMatrix 中创建 Web 应用程序的各种方法，包括从文件夹、模板或应用程序库中的应用程序创建。然后，你学习了如何在应用程序配置、文件和数据库之间切换。你在该数据库中创建了一个\
  \ SQL Server CE 数据库和表。\n\n接下来，你看到了 Razor 语法的威力。你学习了如何使用 Razor 连接到数据源，以及如何与数据源数据进行交互。你创建的\
  \ 页面被移动以使用布局页面。你还使用了 Razor 的几个内置辅助程序，包括：\n\n* `WebGrid`\n* `ValidationSummary` 和\
  \ `ValidationMessage`\n* `RenderBody` 和 `RenderSection`\n* `WebSecurity`、`OAuthWebSecurity`\
  \ 和 `ReCaptcha`\n* `WebMail`\n* `WebCache`\n* `WebImage`、`FileUpload` 和 `Video`\n\
  * `Bing` 和 `Maps`\n* `Facebook`、`Twitter`、`LinkShare` 和 `Gravatar`\n\n最后，你学习了如何创建自定义辅助程序并扩展\
  \ Razor。尽管本章没有涵盖 Razor、Web Pages 或 WebMatrix 的所有功能，但你应该对 Razor 如何工作以及 ASP.NET Web\
  \ Pages 如何使用 Razor 有良好的理解。你还应该对在为 ASP.NET MVC 使用 `RazorViewEngine` 时 Razor 如何有用有一个清晰概念。\n\
  \n# X 部分\n\n 附录\n\n* 附录 A：迁移旧版 ASP.NET 项目\n* 附录 B：COM 集成\n* 附录 C：ASP.NET 终极工具\n\
  * 附录 D：管理与维护\n* 附录 E：动态类型与语言\n* 附录 F：ASP.NET 在线资源\n* 附录 G：使用 NuGet 扩展 Visual Studio\n\
  \n# A\n\n## 迁移旧版 ASP.NET 项目\n\n在某些情况下，你将从头开始构建 ASP.NET 4.5 应用程序——一切重新开始。然而，在许多情况下，这并不是可选的。你需要将以前构建在\
  \ .NET Framework 1.0、1.1、2.0、3.5 或 4.0 版本上的 ASP.NET 应用程序进行迁移，以便其运行在 .NET Framework\
  \ 4.5 之上。\n\n本附录侧重于将 ASP.NET 1.x、2.0、3.5 或 4.0 应用程序迁移到 4.5 框架。\n\n## 迁移并不困难\n\n\
  请注意，微软已经做了大量工作，确保将 ASP.NET 1.x、2.0、3.5 或 4.0 应用程序迁移到 4.5 框架的过程尽可能轻松。\n\n当你将 ASP.NET\
  \ 1.x、2.0、3.5 或 4.0 应用程序移动到 4.5 时，你不需要对 .NET 应用程序做任何更改。\n\n在安装 .NET Framework 4.5\
  \ 后，你可以在 `C:\\WINDOWS\\Microsoft.NET\\Framework` 看到框架，如图 A-1 所示。如果服务器是 64 位的，在 `C:\\\
  Windows\\Microsoft.Net\\Framework64` 也有对应的版本。\n\n![image](img/f124001.jpg)\n\n**图\
  \ A-1**\n\n在这种情况下，你可以看到 .NET 的所有版本，包括 1.0.3705、1.1.4322、2.0.5027、3.0、3.5、4.0 以及可用的\
  \ 4.5。\n\n### 运行多个版本\n\n从图 A-1 可以看到运行 .NET Framework 的多个版本是可能的。ASP.NET 1.0、1.1、2.0、3.5、4.0\
  \ 和 4.5 应用程序都可以在同一服务器上运行，因为它们运行在各自的进程中。\n\n### 原地升级\n\n.NET Framework 4.5 是一个原地升级，它替换了由\
  \ .NET Framework 4 安装的现有文件。安装 .NET Framework 4.5 时，你不会看到名为 4.5 的文件夹，正如你在之前的框架中看到的那样。\n\
  \n所以，如果你在安装了 .NET Framework 4 的服务器上运行 ASP.NET 4 应用程序，在安装 .NET Framework 4.5 后，所有的\
  \ ASP.NET 4 应用程序将开始运行在 .NET Framework 4.5 上。当你安装 .NET Framework 4.5 时，所有运行 ASP.NET\
  \ 4 的应用程序池现在将作为 ASP.NET 4.5 运行。\n\n由于 .NET 4.5 框架是原地升级，微软为了确保 .NET 4.0 框架与 .NET\
  \ 4.5 框架之间的向后兼容性做了大量工作。这意味着在安装 4.5 后，ASP.NET 4 应用程序应该可以正常工作而无需更改。\n\n### 升级你的 ASP.NET\
  \ 应用程序\n\n当你安装 .NET Framework 4.5 时，它并不会重新映射所有的 ASP.NET 应用程序使其运行在新的框架实例上。相反，你可以选择性地重新映射应用程序，使其运行在\
  \ ASP.NET 4.5 框架上。\n\n\n\n\n\n在 Windows 8 上使用 IIS 管理器时，差异会更加明显。通过此管理工具，你可以看到 `DefaultAppPool`\
  \ 运行在 .NET Framework 的 `4.0.*xxxxx` 版本上，如图 A-2 所示。\n\n![image](img/f1241-01.jpg)\n\
  \n图 A-2\n\n使用 Visual Studio 2012 将您的应用程序升级到 ASP.NET 4.5 会导致 IDE 对应用程序的配置文件进行所有必要的更改。在本附录后面将对此进行说明。\n\
  \n## 混合版本时——表单验证（FORMS AUTHENTICATION）\n\n如果您有一个使用多个版本 .NET Framework 的 ASP.NET\
  \ 应用程序（如前提到的），必须了解 ASP.NET 2.0、3.5、4.0 和 4.5 中的表单验证机制。\n\n在 ASP.NET `1.x` 中，表单验证过程使用\
  \ Triple DES 加 (3DES) 对验证 Cookie 进行加密和解密。然而，从 ASP.NET 2.0 开始，它已更改为使用高级加密标准 (AES)\
  \ 加密技术。\n\nAES 更快且更安全。但是，由于两种加密技术不同，您必须更改 ASP.NET 4.5 生成这些密钥的方式。您可以通过更改 ASP.NET\
  \ 4.5 应用程序中 `web.config` 文件的 `<machineKey>` 部分来实现，使其改用 Triple DES 加密（如列表 A-1 所示）。\n\
  \n通过将机器密钥加密/解密过程更改为利用 Triple DES，您可以让表单验证能够在同时使用 .NET Framework `1.x` 和 4 版本的 ASP.NET\
  \ 应用程序中工作。此外，此示例显示 `validationKey` 和 `decryptionKey` 属性使用了一组特定的密钥。这些密钥应该与您在 ASP.NET\
  \ `1.x` 应用程序中使用的相同。\n\n您应该理解，在将 ASP.NET 2.0 或 3.5 应用程序升级到 ASP.NET 4.5 时，不需要进行这些更改，因为它们都已启用使用\
  \ AES 加密且没有使用 Triple DES 加密。如果您将 ASP.NET `1.x` 应用程序与 ASP.NET 2.0、3.5、4.0 或 4.5 混合使用，则必须将一切迁移到\
  \ Triple DES 加密，如列表 A-1 所示。\n\n## 升级——ASP.NET 预留文件夹\n\n如本书的第 3 章](#Chapter03.xhtml)\
  \ 所示，ASP.NET 4.5 包含了许多特定于 ASP.NET Framework 的应用程序文件夹。除了 ASP.NET `1.x` 中预留的 `Bin`\
  \ 文件夹外，以下文件夹在 ASP.NET 2.0、3.5、4.0 和 4.5 中也都是预留的：\n\n*   `Bin`：此文件夹存储应用程序 DLL 以及应用程序使用的任何其他\
  \ DLL。该文件夹存在于 ASP.NET 1.0 和 1.1 中。它也存在于 ASP.NET 2.0、3.5、4.0 和 4.5 中。\n*   `App_Code`：此文件夹用于存储您的类、`.wsdl`\
  \ 文件和类型类型数据集。存储在此文件夹中的任何项都会自动供解决方案中的所有页面使用。\n*   `App_Data`：此文件夹包含应用程序使用的数据库存储。它是存储应用程序所使用的所有数据存储的良好中心位置。`App_Data`\
  \ 文件夹可以包含 Microsoft SQL Express 文件（`.mdf` 文件）、Microsoft Access 文件（`.mdb` 文件）、XML\
  \ 文件等更多内容。\n*   `App_Themes`：主题是为您的网站每个页面提供统一外观和感觉的方法。您通过使用 `.skin` 文件、CSS 文件以及网站服务器控件使用的图像来实现一个主题。所有这些元素都可以构成一个主题，然后存储在解决方案的\
  \ `App_Themes` 文件夹中。\n*   `App_GlobalResources`：此文件夹允许您存储资源文件，如果这些应用程序需要更改内容（基于文化变化等因素），这些资源文件可以作为应用程序的数据字典。您可以向\
  \ `App_GlobalResources` 文件夹中添加程序集资源文件（`.resx`），它们会被动态编译并成为解决方案的一部分，供应用程序中的所有 `.aspx`\
  \ 页面使用。\n*   `App_LocalResources`：与 `App_GlobalResources` 文件夹非常相似，`App_LocalResources`\
  \ 文件夹是一种简单的方法，用于整合可在应用程序中特定页面使用的资源。\n*   `App_WebReferences`：您可以使用 `App_WebReferences`\
  \ 文件夹并自动访问从应用程序引用的远程 Web 服务。\n*   `App_Browsers`：此文件夹包含 `.browser` 文件，这些是 XML 文件，用于识别向应用程序发送请求的浏览器并阐明这些浏览器所具备的能力。\n\
  \n在文件夹名称中添加 `App_` 前缀可确保您在 ASP.NET `1.x` 应用程序中已先具有同名的文件夹。如果碰巧您确实有一个与您计划使用的名称之一相同的文件夹，您应该将之前的文件夹更改为其他名称，因为这些\
  \ ASP.NET 4.5 应用程序文件夹名称是不可更改的。\n\nASP.NET 4.5 页面采用 HTML5\n\nASP.NET 4.5 默认构造的页面是\
  \ HTML5 标准的。您可以从图 A-3 中看到这种设置。\n\n![image](img/f1243-01.jpg)\n\n图 A-3\n\n在这种情况下，您可以看到\
  \ ASP.NET 4.5 默认输出的是什么。您也可以对 `web.config` 文件进行更改，使其输出不是 XHTML 标准（如列表 A-2 所示）。\n\n\
  将 `mode` 属性设置为 `Legacy` 可确保不使用 XHTML，而是使用 ASP.NET `1.x` 中的方式。\n\n注意，如果您在使用 Ajax，将\
  \ `mode` 属性设置为 `Legacy` 可能会给您的应用程序带来问题。可能会遇到的一个症状是，并没有像 Ajax 那样进行部分更新，而是发生了全页刷新。这是因为页面不符合\
  \ XHTML 标准。解决方案是将 `mode` 设置为 `Traditional` 或 `Strict` 并使您的页面符合 XHTML 标准。\n\n如果您采用这种方法，对于在\
  \ Visual Studio 2012 中创建的任何 ASP.NET 4.5 页面，还需要进行一些额外的更改。在 Visual Studio 2012 中创建新的\
  \ ASP.NET 4.5 页面产生如列表 A-3 所示的结果。\n\n## ASP.NET 4.5 中没有硬编码的 .JS 文件\n\nASP.NET 1.x\
  \ 将一些必需的 JavaScript 文件作为硬编码的 `.js` 文件提供。例如，在 ASP.NET 中，验证服务器控件和智能导航功能的实现需要 JavaScript\
  \ 的支持。如果您在 ASP.NET `1.x` 应用程序中使用了这些功能之一，ASP.NET 可以获取安装的 `.js` 文件并直接使用它们。\n\n\n\n\
  \n\n这些 `.js` 文件位于 `C:\\WINDOWS\\Microsoft.NET\\Framework\\v1.1.4322\\ASP.NETClientFiles`。查看此文件夹，你会看到三个\
  \ `.js` 文件——其中两个用于智能导航功能（`SmartNav.js` 和 `SmartNavIE5.js`），另一个用于验证服务器控件（`WebUIValidation.js`）。由于它们是硬编码的\
  \ `.js` 文件，你可以打开并更改或修改这些文件中的代码以更好地适应你的需求。在某些情况下，开发者确实这样做了。\n\n如果你以任何方式修改了这些 JavaScript\
  \ 文件，在将 ASP.NET 应用程序迁移到 ASP.NET 2.0、3.5 或 4.5 时，必须更改某些代码。ASP.NET 4.5 动态从 `System.Web.dll`\
  \ 包含 `.js` 文件，而不是在服务器上硬编码它们。在 ASP.NET 4.5 中，这些文件通过处理程序 `WebResource.axd` 包含。\n\n\
  ## VISUAL STUDIO 2012 项目兼容性\n\n如前所述，如果你有一个现有的 ASP.NET 1.*x* 应用程序，只需在 IIS 中对应用程序池进行适当的更改，即可在\
  \ ASP.NET 4 运行时运行该应用程序。使用 IIS 器或 MMC 嵌入程序，你可以从提供的下拉列表中选择运行应用程序的适当框架。\n\nASP.NET\
  \ 4.5 应用程序与 Visual Studio 2012 IDE 兼容。如果你仍然打算处理 ASP.NET 1.0 或 1.1 应用程序，你应该分别在你的机器上保留安装的\
  \ Visual Studio .NET 2002 或 2003。安装 Visual Studio 2012 将为你提供一个完整的、全新的 Visual Studio\
  \ 副本，而不会升级之前的 Visual Studio .NET 2002 或 2003 IDE。所有版本的 Visual Studio 副本都可以并存运行。\n\
  \n如果你想在 .NET Framework 4.5 上运行 ASP.NET 4.*x* 应用程序，但又想将应用程序的整个 ASP.NET 项目转换为 ASP.NET\
  \ 4.5，你可以使用 Visual Studio 2012 来帮助你完成转换过程。项目转换完成后，你可以从 Visual Studio 2012 构建并运行应用程序。现在，该应用程序在\
  \ ASP.NET 4 运行时构建和运行。\n\nVisual Studio 2012 在解决方案和项目级别上与 Visual Studio 2010 兼容。这意味着如果你使用\
  \ Visual Studio 2010 创建了 ASP.NET 应用程序，可以在 Visual Studio 2012 中打开该应用程序进行更改，并在 Visual\
  \ Studio 2010 中打开同一个应用程序。应用程序的所有产物都将保留。这是一个非常有用的功能，支持混合模式开发，现在你可以使用 Visual Studio\
  \ 2012 针对 ASP.NET 4.0 和 ASP.NET 4.5 开发应用程序。\n\n## 从 ASP.NET 2.0/3.5/4.0 迁移到 4.5\n\
  \nVisual Studio 2012 允许你构建可以针对多个框架的应用程序。例如，Visual Studio .NET 2002 只允许你构建 1.0 应用程序。如果你想构建\
  \ .NET Framework 1.1 应用程序，你需要安装并使用 Visual Studio .NET 2003。同时，Visual Studio .NET\
  \ 2003 无法让你构建 .NET Framework 1.0 应用程序，这意味着如果你正在处理使用任一框架的应用程序，你需要在计算机上同时拥有这两个 IDE。\n\
  \n当你在 Visual Studio 2012 中创建新项目时，可以选择将项目目标指向以下任何框架：\n\n* .NET Framework 2.0\n* .NET\
  \ Framework 3.0\n* .NET Framework 3.5\n* .NET Framework 4\n* .NET Framework 4.5\n\
  \n如果你打开一个基于 .NET Framework 2.0 构建的 ASP.NET 应用程序，可以从 IDE 轻松地将应用程序重新目标为更高版本的框架。要这样做，请在解决方案管理器中右键点击项目，并在提供的菜单中选择“属性页”。这将提供一个允许你更改应用程序目标框架的表单。在这种情况下，你可以看到\
  \ Microsoft Windows 8 计算机上的默认选项（如图 A-4 所示）。\n\n![image](img/f1246-01.jpg)\n\n**图\
  \ A-4**\n\n如图 A-4 所示，更改目标框架需要 Visual Studio 2012 关闭并重新打开你的解决方案。完成后，你会发现即使 `web.config`\
  \ 文件也已更改，以适应更高版本的框架工作。你可能需要处理与 ASP.NET 版本发布之间的任何破坏性更改有关的问题，但你可以通过在 Visual Studio\
  \ 中生成解决方案来快速获取这些问题的列表。\n\n## 总结\n\nVisual Studio 2012 IDE 的用处在于，你只需升级你的 ASP.NET\
  \ 解决方案，而无需升级解决方案目标所在的框架版本。然而，在将你的 ASP.NET 解决方案升级到 .NET Framework 4.5 时，你可能会发现 Visual\
  \ Studio 让这项任务变得轻而易举。\n\n本附录查看了使用 IDE 进行升级，以及为了实现迁移所需的一些重要更改。\n\n# B\n\nCOM 集成\n\
  \n## 本附录的 COM 下载\n\n请注意，本附录中的所有代码示例都可以从 `www.wrox.com` 网站作为本附录的一部分下载。\n\n编程中的最佳实践之一是将应用程序拆分为可工作的组件——也称为业务对象。这使得应用程序更容易管理，并允许在应用程序的不同部分共享这些组件。在引入\
  \ .NET 之前，许多应用程序使用 COM 作为编写业务对象的方法。如果你将任何遗留应用程序或这些应用程序的部分迁移到 ASP.NET 环境，你可能会发现需要利用各种\
  \ COM 组件。本附录将向你展示如何使用 .NET 和 COM 组件。\n\n当 .NET 推出时，Microsoft 知道其大量的开发者如果无法使用多年来构建、维护和改进的数千个\
  \ COM 控件将会非常失望。\n\n为此，Microsoft 为我们提供了 COM 互操作性（Interoperability）。COM 互操作性（简称 COM\
  \ Interop）是一种技术，允许 .NET 用 .NET 组件的接口封装 COM 对象的功能，以便你的 .NET 代码无需使用 COM 技术即可通信。\n\n\
  图 B-1 说明了运行时调用器（RCW），它是 .NET 代码和 COM 组件之间引导流量的中间组件。\n\nCOM 操作：在 .NET 中使用 COM\n\n\
  当 .NET 推出时……本附录概述了如何在 ASP.NET 中使用 COM 组件。\n\n### 运行时调用器\n\n运行时调用器，简称 RCW 是启用 .NET\
  \ 和 COM 之间进行交互的魔法代码。你为项目中的每个 COM 组件创建一个 RCW，要实现这一点，你可以使用 Visual Studio 2012。\n\n\
  要将 ActiveX DLL 添加到项目的引用部分，请选择网站 ![image](img/Ar.jpg) 添加引用，或者选择右键点击解决方案中的项目根节点时出现的添加引用菜单。\n\
  \n你的互操作库将根据你告诉 Visual Studio 2012 使用的 ActiveX DLL 自动创建。该互操作库是为你的 ActiveX 控件定制的 RCW\
  \ 组件，如之前的图 B-1 所示。互操作文件的命名简单为 `Interop.OriginalName.DLL`。\n\n\n\n\n\n你也可以手动创建 `RCW`\
  \ 文件，而不是通过 Visual Studio 2012 来创建。在 `.NET Framework` 中，你将找到通过一个名为“类型库导入器”（Type Library\
  \ Importer）的命令行工具手动创建控件的 `RCW` 互操作文件的方法。你通过使用执行文件 `tlbimp.exe` 来调用类型库导入器。\n\n例如，为\
  \ `SQLDMO` 对象创建互操作库，请从开始菜单中的 Microsoft Visual Studio 2012 ![image](img/Ar.jpg) Visual\
  \ Studio Tools 组中启动 Visual Studio 2012 命令提示符。在命令提示符中，输入以下内容：\n\n```tlbimp sqldmo.dll\
  \ /out:sqldmoex.dll\n```\n\n在此示例中，`/out:` 参数指定了要创建的 `RCW` 互操作库的名称。如果你省略此参数，你将获得\
  \ Visual Studio 为你生成的相同名称。\n\n当你没有使用 Visual Studio 2012 作为开发环境、想要对生成的程序集有更多控制权，或者正在自动化处理连接到\
  \ COM 组件的过程时，类型库导入器就会非常有用。\n\n类型库导入器是 `System.Runtime.InteropServices` 命名空间中 `TypeLibConverter`\
  \ 类的封装应用程序。\n\n### 在 ASP.NET 代码中使用 COM 对象\n\n为了继续学习其他示例，接下来你查看一个在 ASP.NET 页面中使用\
  \ Visual Basic 6 编写的 COM 对象的简单示例。\n\n在第一步中，创建一个供后续示例使用的 ActiveX DLL。将 列表 B-1 所示的\
  \ Visual Basic 6 代码添加到名为 `NameFunctionsClass` 的类中，并将其编译为名为 `NameComponent.dll` 的\
  \ ActiveX DLL。\n\n现在你已经创建了用于 ASP.NET 页面的 ActiveX DLL，下一步是使用 Visual Studio 2012 创建一个新的\
  \ ASP.NET 项目。将 `Default.aspx` 文件中的 HTML 代码替换为 列表 B-2 所示的 HTML 代码。此代码在向 HTML 页面上添加了多个文本框和标签，以及实现功能的\
  \ Visual Basic 或 C# 代码。\n\n接下来，你添加对上一步创建的 ActiveX DLL 的引用。请按照以下步骤操作：\n\n1.  在解决方案资源器对话框中右键点击你的项目。\n\
  2.  选择添加引用（Add Reference）菜单项。\n3.  在添加引用对话框中，选择浏览（Browse）选项卡。\n4.  通过浏览到其所在位置找到\
  \ `NameComponent.dll` 对象。\n5.  点击确定将 `NameComponent.dll` 添加到所选组件列表中并关闭对话框。\n\n当你使用添加引用对话框选择组件后，系统会为该组件创建一个\
  \ `RCW` 文件并将其添加到你的应用程序中。\n\n就是这些！只需运行应用程序即可查看 COM 互操作层的运行。\n\n当点击“分析名称”（Analyze\
  \ Name）按钮时，名（First Name）、姓（Last Name）和全名（Full Name）文本框中的字段将发送给 `RCW`，并传递给 `NameComponent.DLL`\
  \ ActiveX 组件。数据以相同的方式检索以重新填充文本框并指示全名的长度。\n\n### 在 C# 中访问复杂的成员\n\n有时，COM 对象的某些成员不会暴露自己。例如，如果你尝试在\
  \ C# 中使用以下内容：\n\n```csharp\nif (FirstName.Text > 0)\n    FullName = FirstName.Text;\n\
  ```\n\n注意，对于无效字符串，Visual Basic 2012 报告 `Cast from string \"abc\" to type 'Double'\
  \ is not valid`，而 C# 报告 `Input string was not in a correct format`。对于除以零，它们都会报告\
  \ `Divide by Zero`，因为错误是直接来自 Visual Basic 6 运行时。\n\n\n\n\n\n将 .NET 应用程序本地的所有或部分\
  \ ActiveX 组件被视为安装私有程序集。在这种情况下，你的 .NET 应用程序在同一台机器上的每次安装都至少拥有一份你所引用的 ActiveX 组件的 Interop\
  \ 库副本，如 图 B-2 所示。\n\n![image](img/f1255-01.jpg)\n\n**图 B-2**\n\n决定将 ActiveX 组件安装在应用程序本地，还是安装在所有调用应用程序的共享目录中，完全由你决定。\n\
  \n一旦你将组件物理放置就位，剩下的任务就是使用 `regsvr32` 注册 ActiveX 组件，就像你部署启用 ActiveX 的应用程序时一样。\n\n\
  ## 公共程序集\n\n私有程序集的对立面是公共程序集。公共程序集为其他应用程序共享 RCW Interop DLL。要创建公共程序集，你必须将 RCW 文件放入*全局程序集缓存*（GAC）中，如\
  \ 图 B-3 所示。\n\n![image](img/f1256-01.jpg)\n\n**图 B-3**\n\n你可以在 `C:\\Windows\\assembly`\
  \ 找到 GAC。在 GAC 中安装项目可以简单地通过 Windows 资源管理器将项目拖入此文件夹来实现。虽然 GAC 对所有人开放，但除非你有非常充分的理由，否则不建议盲目地将你的组件安装到此区域。\n\
  \n你还可以通过命令行使用“全局程序集缓存工具”（`Gacutil.exe`）向 GAC 添加项目。它使你能够查看和操作 GAC 以及下载缓存的内容。虽然 GAC\
  \ 的资源管理器提供了相似的功能，但你可以在构建脚本、makefile 文件和批处理文件中使用 `Gacutil.exe`。\n\n要找到将你的 ActiveX\
  \ Interop 程序集安装到 GAC 的充分理由是非常困难的。如果我们必须选择一个时机这样做，那就是当我们有一个高度共享的 ActiveX 组件，且许多 .NET\
  \ 应用程序在同一台机器上使用它。在企业环境中，这可能发生在你一个许多应用程序使用的服务器上，将现有业务逻辑从 ActiveX 升级为启用 .NET 时。在商业环境中，我们避免使用\
  \ GAC。\n\n## 总结\n\n在本附录中，你学习了 COM Interop 如何提供访问现有 COM 组件的方法，以便你在 ASP.NET 中使用 .NET\
  \ 和 COM 组件。\n\n# C: ASP.NET 终极工具\n\n我一直相信，我的水平取决于我使用的工具。我花了多年时间在互联网上搜索优秀的工具，帮助我成为一名更高效的开发者。可以肯定，那里有数千工具，许多的功能与其他工具重叠。有些工具在某件事上做得非常好，而另一些工具旨在成为瑞士军刀，在其微小的工具栏中封装了数十种小便利功能。这里有一些我经常用到的\
  \ ASP.NET 工具的简短独家列表。这些工具是我发现在开发基于 ASP.NET 的网站时一直在持续使用的工具。如果这些工具听起来很有用，我建议你尝试一下。其中许多是免费的，有些不是。在我看来，每种工具至少值得你尝试，许多工具值得你投入辛苦赚来的钱，因为它们将为你节省宝贵的时间。\n\
  \n## 让调试变得更简单\n\n> *在计算机历史上，从未出现过意料之外的短调试周期。*\n>\n> —斯蒂文·莱维\n\n### Firebug\n\n这个应用程序有很多很棒的地方，足以为它写一本书。Firebug\
  \ 实际上是一个 Firefox 插件，所以你需要下载并安装 Firefox 才能使用它。\n\n图 C-1 显示了 Firebug 分析下载网页所需的所有网络流量。这显示了一个非常详细的图表，说明了每个资产何时下载以及从第一个字节到最后一个字节花费了多久。\n\
  \n![image](img/f1258-01.jpg)\n\n**图 C-1**\n\n它拥有丰富有趣的功能，允许你检查 HTML 并深度分析你的 CSS，包括一些更复杂的\
  \ CSS 技术的可视化，如偏移、外边距、边框和内边距。Firebug 还包含一个强大的 JavaScript 调试器，允许你在 Firefox 内部调试 JavaScript。更有趣的是它的\
  \ JavaScript 性能分析器和一个非常详细的错误处理器，可以帮助你追溯到即使是最晦涩的 bug。\n\n最后，Firebug 包含了一个类似于 Visual\
  \ Studio 立即窗口的交互式控制台功能，允许你动态执行 JavaScript，以及允许经典的“此处”调试的控制台调试。Firebug 对于 Web 开发者来说是不可或的，强烈推荐。\n\
  \n### YSlow\n\nYSlow 是插件的插件。由 Yahoo! 提供，YSlow 扩展了 Firebug 并使用 YahooYP 的快速网站 13 条规则分析你的网页。在\
  \ 图 C-2 中，你可以看到 YahooYP 的 YSlow 正在分析网站。\n\n![image](img/f1259-01.jpg)\n\n**图 C-2**\n\
  \nYSlow 是免费的，是一个很好的资源，帮助你清楚地理解浏览器为了查看你的网站必须多努力工作。\n\n### IE10 开发者工具\n\nIE10 开发者工具来自微软并内置于\
  \ IE10 中。它们是免费的，并且对 Web 开发至关重要。你只需按 F12 即可激活它们。它们扩展了 Internet Explorer 10，提供了 DOM\
  \ 检查、JavaScript 性能分析和元素轮廓等功能。你甚至可以可视化框模型，如 图 C-3 所示。\n\n![image](img/f1259-02.jpg)\n\
  \n**图 C-3**\n\n现在的 ASP.NET 开发者需要他们的网站看起来很棒。这个工具栏让许多功能触手可及，强烈推荐。\n\n### jQuery 和\
  \ jQuery UI\n\n虽然不是明确的“工具”，但 JavaScript 库 jQuery 及其伙伴 jQuery UI 让复杂的 JavaScript\
  \ 任务变得轻松。是的，以前就有 JS 库了，但很难高估 jQuery 不仅改变了 Web，而且让 JavaScript 再次有趣。\n\njQuery 包含一个简洁的选择器，让遍历\
  \ HTML 文档对象模型（DOM）变得简单，允许你选择和过滤节点并轻松应用事件和动画。\n\njQuery 还包含了方便调用 Ajax 方法。它是一个如此库，以至于\
  \ Microsoft ASP.NET MVC 团队决定将 jQuery 与 ASP.NET MVC 一起发布，使其成为第一个带有完整支持的开源产品。Visual\
  \ Studio 2012 IDE 中 IntelliSense 的改进使得处理 JavaScript 变得非常容易。\n\njQuery UI 是另一个库，在\
  \ jQuery 之上增加了更多的动画支持，更重要的是为可主题的高级部件（如滑块、日历等）提供了脚架。可以在 `http://jquery.com` 和 `http://jqueryui.com`\
  \ 上查看它们，如 图 C-4 所示。\n\n![image](img/f1260-01.jpg)\n\n**图 C-4**\n\n### 性能分析器：dotTrace\
  \ 或 ANTS\n\n如果你没有使用良好的性能分析器衡量你的代码，你真的不知道自己错过了什么。只有性能分析器可以给你大量的指标并让你清晰了解你的代码正在做什么。\n\
  \nVisual Studio 2012 的某些版本在顶部“分析”菜单中包含性能分析器。此外，还有优秀的第三方性能分析器，例如 JetBrains 的 dotTrace\
  \ 和 Red Gate Software 的 ANTS，它们值得你花时间。\n\n\n\n\n\n.NET 性能分析器会对代码的运行期间进行插桩，并测量每行被访问的次数以及执行该行花费的时间，如图\
  \ C-5 所示。它们创建一个层次化的报告，使你不仅可以分析方法内部的时间，还可以分析通过堆栈执行的子方法内部的时间。随着你对应用程序的改进，你可以保存报告并分析多个版本。\n\
  \n![image](img/f1261-01.jpg)\n\n**图 C-5**\n\n如果你还没有这样做，请考虑将你的 ASP.NET 应用程序的性能分析加入到你的软件开发生命周期中。你会惊讶地发现，只有少数开发者会对应用程序进行正式的分析和性能分析。留出时间分析一个你从未看过的应用程序，你会发现通过使用\
  \ `ANTS` 或 `dotTrace` 等工具进行分析，程序的运行速度可以快得多。\n\n## 参考文献\n\n> *借书的人是傻瓜，还书的人是更大的傻瓜。*\n\
  \n> —\n\n> —**匿名，阿拉伯谚言**\n\n### [QuirksMode.org](http://QuirksMode.org) 和 [HTMLDog.com](http://HTMLDog.com)\n\
  \n当你创建一个需要在所有浏览器中都完美显示的网站时，你不可避免会遇到流行浏览器中的 Bug、“特性”以及通用差异。网页是由标准（HTML、CSS、JS）的大型组合组成的。这些标准不仅有多种解释，而且它们的实现方式在细微之处可能不同，特别是当它们相互作用时。\n\
  \n参考网站（如 `QuirksMode`）收集了数百种此类黑科技和变通方法。然后为了你的利益对它们进行了编目。这些功能中的许多并不是设计的，而是被发现或偶然碰到的。\n\
  \nHTML Dog 是一个针对 HTML 和 CSS 的极佳网页设计师资源。它充满了教程、文章以及专门针对 XHTML 的大型参考部分。`QuirksMode`\
  \ 包含了许多学习 JavaScript 和 CSS 的资源，并包含许多演示兼容性（quirks）的测试和示例页面。\n\n### Visibone\n\nVisibone\
  \ 以惊人的参考卡和图表而闻名，这些工具展示了颜色、字体、HTML、JavaScript 和 CSS。Visibone 的参考卡和手册在线提供，价格非常合理。性价比最高的是\
  \ [`www.visibone.com/products/browserbook.html`](http://www.visibone.com/products/browserbook.html)\
  \ 上的 `Browser Book`。我推荐胶装版本。一定要写上你的名字，因为你的同事会让它消失。\n\n### [www.asp.net](http://www.asp.net)\n\
  \n[`www.asp.net`](http://www.asp.net) 是学习 ASP.NET 及其相关技术的巨大资源。图 C-6 显示了该网站，你可以在那里找到指向博客和其他社区资源的链接。\n\
  \n![image](img/f1262-01.jpg)\n\n**图 C-6**\n\n### [www.webdevchecklist.com](http://www.webdevchecklist.com)\n\
  \n[`www.webdevchecklist.com`](http://www.webdevchecklist.com) 以拥有全面的工具清单而闻名，可以通过运行这些工具来确保你的网站符合\
  \ Web 开发者的最佳实践。\n\n### SlowCheetah\n\n这是一个 Visual Studio 扩展，你可以从 [`http://visualstudiogallery.msdn.microsoft.com/69023d00-a4f9-4a34-a6cd-7e854ba318b5`](http://visualstudiogallery.msdn.microsoft.com/69023d00-a4f9-4a34-a6cd-7e854ba318b5)\
  \ 下载。你可以使用此工具根据你的构建配置使用不同的转换文件转换你的 `app.config`（或任何文件）。例如，在调试和运行应用程序时，你可以不同的数据库和应用程序设置。\n\
  \n## 整理你的代码\n\n> *每场战争结束后总有人要打收拾。*\n\n> —**Wislawa Szymborska**\n\n### DevExpress\
  \ 提供的 Refactor! for ASP.NET\n\nVisual Studio 2012 中的重构支持不断改进。第三方工具不断突破边界，为 IDE 增加价值。`Refactor!`\
  \ for ASP.NET 为 ASP.NET 源代码视图添加了重构功能。\n\n可以从 [`www.devexpress.com/Products/NET/IDETools/RefactorASP/`](http://www.devexpress.com/Products/NET/IDETools/RefactorASP/)\
  \ 下载 Refactor。它包含了可以简化你的代码和 ASP.NET 标记的重构功能。\n\n### Microsoft Ajax Minifier—JavaScript\
  \ 压缩器\n\n在创建 ASP.NET 网站时，你经常发现自己在创建自定义的 JavaScript 文件。开发期间，你希望这些文件带有注释且易于阅读。但在生产环境中，每个字节都至关重要，使用\
  \ JavaScript“压缩器”减小 JavaScript 文件的大小是非常好的。\n\n`Microsoft Ajax Minifier` 是一个 C# 应用程序，提供\
  \ JavaScript 的压缩或通过删除注释和空白进行简单的“压缩”。它已发布在 CodePlex 的 [`http://ajaxmin.codeplex.com/`](http://ajaxmin.codeplex.com/)。\n\
  \n你会惊讶于这些技术的效果竟然如此好。例如，Steve 曾报告过 `Prototype` 的副本在压缩前为 70KB，经过特定压缩后变为 14KB。\n\n\
  有很多 JavaScript 压缩库可用；这只是其中之一。然而，它的选项、完整性以及与 MSBuild 的集成使得 `Microsoft Ajax Minifier`\
  \ 值得尝试。\n\n## 扩展 ASP.NET\n\n> *噢天哪！:-) 我自己射了自己的脚趾 (-) 抱歉！*\n\n> —**Matz**\n\n###\
  \ Ajax Control Toolkit\n\n`Ajax Control Toolkit` 是微软与更大的 ASP.NET 社区之间的协作。它的目标是提供最大的\
  \ Web 客户端组件集合。如果你想学习如何编写 ASP.NET AJAX，它包含了极佳的示例，然后它给了你回馈并在社区内共享你代码的机会。\n\n数十个控件构建并扩展了\
  \ ASP.NET AJAX 框架。某些控件非常简单，提供了那些精的“小细节”，如阴影、圆角、水印和动画。其他控件则提供了功能强大的控件，如日历、弹出窗口和滑块。\n\
  \n\n\n\n所有控件都提供了完整的源代码，以便你对其进行扩展和改进。这些控件不仅仅是示例；它们是完整的、可以直接用于你的应用程序的工具。\n\n该工具包可以在\
  \ [`http://www.asp.net/ajax/`](http://www.asp.net/ajax/) 获取（请参见 图 C-7）。甚至还有一个内容分发网络\
  \ (CDN)，你可以让微软支付托管这些 JavaScript 库的带宽费用。它们的运行速度会更快，而且更接近用户！\n\n![image](img/f1264-01.jpg)\n\
  \n**图 C-7**\n\n### Atif Aziz 的 ELMAH——错误日志模块和处理器\n\n在应用程序中排除错误和处理未处理的异常可能是一项全职工作。与其每次都编写自己的自定义全局异常处理程序，不如考虑查看一下\
  \ Atif Aziz 开发的 `ELMAH`（错误日志模块和处理器）。它是一个非常灵活的全应用程序错误日志设施，在几乎每个位置的接口上都具有可插的扩展点。你甚至可以在无需重新编译甚至无需重新部署的情况下在应用程序中配置它。只需修改你的\
  \ `web.config` 以包含错误日志模块和处理器，你就能获得一个网页，用于远程查看未处理异常的完整日志。\n\n`ELMAH` 捕获了大量关于异常的信息，以至于它可以重构出\
  \ ASP.NET 在发生异常时生成的原始“黄色死屏”，即使关闭了 `customErrors`。它几乎就像是你异常的 TiVo！图 C-8 显示了 `ELMAH`\
  \ 开发者视图，包括你调试此错误所需的所有细节。\n\n![image](img/f1265-01.jpg)\n\n**图 C-8**\n\n另一个巧妙的功能是\
  \ RSS Feed，它可以显示日志中最后 15 年的内容。这个灵活的工具是开源的，最近的 beta 版本包含了对中间信任环境的支持。你可以接入 `SQL Server`\
  \ 或使用 `XML` 文件来管理错误日志。我强烈建议你花时间学习 `ELMAH`。\n\n### Helicon 的 ISAPI_Rewrite 和 IIS7\
  \ URLRewrite\n\nApache Web 服务器的用户对 `mod_rewrite`（其 URL 重写机制）的力量赞誉有加。`IIS6` 用户可以通过\
  \ Helicon 的 `ISAPI_Rewrite` 模块获得此功能。因为它用纯 C 语言编写，所以非常快。它在 IIS“经典”管道中与 ASP.NET 集成得非常良好，因为\
  \ URL 在 ASP.NET 意识到到发生任何事情之前就已经重写了。`IIS7` 用户可以使用稍后讨论的 `URL Rewriting Module`。\n\n\
  由于它使用了正则表达式，`ISAPI_Rewrite` 最初可能会因为简洁的语法而让你非常沮丧。但是，如果你有耐心，它可以成为你工具箱中极其强大的工具。\n\n\
  在 [`http://www.iis.net/extensions/URLRewrite`](http://www.iis.net/extensions/URLRewrite)\
  \ 还有一个专门针对 `IIS7` 的 URL 重写模块。它比 `ISAPI_Rewrite` 更容易使用，因为它包含了一个用于管理和创建重写的完整 UI，以及一个将你现有的\
  \ Apache 风格重写导入 `IIS7` 的导入工具。\n\n一个额外的奖励是，`IIS7` 重写工具运行在托管管道内部，当你将其用于 ASP.NET 应用程序时，可以获得额外的性能提升。\n\
  \n## 通用开发者工具\n\n> *如果你碰到了硬的骨头，就把它磨利，把它变成一个实用的工具。*\n\n> **——科林·鲍威尔 (Colin Powell)**\n\
  \n### Telerik 的在线代码转换器\n\n如果没有像 Telerik [`CodeChanger.com`](http://CodeChanger.com)\
  \ 这样的工具协助，创建要在 C# 和 Visual Basic 中都出现的示例将非常繁琐。\n\n尽管它不是一个官方支持的工具，但这个小型应用程序在 Visual\
  \ Basic 和 C# 之间转换时，绝对能帮你完成 80% 的工作。\n\n### WinMerge 和差异工具\n\n每个人都有自己喜爱的合并工具。无论你用的是\
  \ `WinMerge`、`Beyond Compare` 还是老牌 `WinDiff`，只需确保在你的工具列表中有一个你非常熟悉的工具即可。在管理软件开发团队中跨越大量人员的大量更改时，一个良好的合并工具可以帮助你理顺即使是最复杂的冲突提交。\n\
  \n`WinMerge` 有许多不同的插件可用，扩展了它的功能，包括对 Word、Excel 文档以及 `XML` 文件的比较。\n\n其他高度推荐的合并工具包括来自\
  \ Scooter Software 的 `Beyond Compare` 和来自 SourceGear 的 `DiffMerge`。这些工具都与 Windows\
  \ 资源管理器集成，因此比较文件就像右键点击一样简单。\n\n### .NET Reflector\n\n如果你不使用 `.NET Reflector`，你的\
  \ `.NET` 开发体验就会大打折扣。`Reflector` 是一个对象浏览器、反汇编译器、帮助系统、强大的插件主机以及一个不可思议的学习工具。这个微型实用最初源自微软开发者\
  \ Lutz Roeder，现在由 Red Gate 维护，它一直被列为 .NET 开发者除 Visual Studio 之外最不可缺的工具。\n\n`Reflector`\
  \ 之奇之处在于，它不仅通过将 `IL` 转换回 C# 或 `VB` 来提供程序员意图的表示，还包含了分析工具，帮助你视觉化 `.NET` 基类库以及你的代码或任何第三方代码方法之间的依赖关系。\n\
  \n### Process Explorer\n\n最后，但无疑同样，是来自 Mark Russovich 的 `Process Explorer`。将其比作“增强版的任务管理器”甚至不足以描述它的价值。`Process\
  \ Explorer` 通过允许你查看活动进程、线程和环境，将 Windows 本身置于显微镜下，以获得更清晰的理解。\n\n在图 C-9 中，我正在查看机器上运行的所有进程。可以使用此工具找到哪个进程锁定了\
  \ `dll`。\n\n![image](img/f1267-01.jpg)\n\n**图 C-9**\n\n## 总结\n\n拥有正确的工具意味着在调试时是浪费时间撞墙，还是只需\
  \ 5 分钟的快速分析。正确的工具意味着是在枯燥且依赖键盘的敲字工作，与一次愉快的重构会议之间的区别。我鼓励你尝试这里列出的每一个工具，并探索可用工具生态系统，找到那些让你的开发体验不仅高效而且更有趣的工具。\n\
  \n# **D**\n\n**管理与维护**\n\n你即将到达这本书的末尾。到此时，你已经接触了 ASP.NET 4.5。然而，所有的进步伴随着复杂性，在 ASP.NET\
  \ 配置和管理领域也是如此。好消息是，ASP.NET 开发团队意识到了这一点并提供了工具和 API，让开发者能够可靠、舒适地配置和管理基于 ASP.NET 的应用程序。\n\
  \n本附录详细介绍了这些工具，旨在帮助你了解你可选的选项。它探讨了两个强大的配置工具：基于 Web 的 ASP.NET 网站管理工具，以及用于配置 ASP.NET\
  \ 应用程序的 `IIS Manager`。\n\n\n\n\n\n当 ASP.NET 最初发布时，它为其 Web 应用程序引入了基于 XML 的配置文件的概念。此\
  \ `web.config` 文件位于应用程序相同的目录中。它用于存储许多配置设置，其中某些设置可以覆盖在 `machine.config` 文件或根服务器的\
  \ `web.config` 文件中定义的配置设置。然而，ASP.NET 2.0 之前的版本并没有提供一种易于配置这些设置的管理工具。正因如此，大量的开发者最终创建了了自己的配置工具，以避免必须手动处理\
  \ XML 文件。\n\nASP.NET 网站管理工具（Web Site Administration Tool）允许你通过简单、易于使用的 Web 界面来管理网站配置。它消除了部分手动编辑\
  \ `web.config` 文件的需求。当你第一次使用管理工具时，如果没有 `web.config` 文件，它会创建一个。默认情况下，ASP.NET 网站管理工具还会在网站的\
  \ `App_Data` 文件夹中创建一个 LocalDB 文件，以存储应用程序数据。在 ASP.NET 网站管理工具中对大多数设置所做的更改会立即生效。你可以在\
  \ `web.config` 文件中看到这些更改。\n\n默认设置会自动从 Web 服务器根目录下的任何配置文件继承。ASP.NET 网站管理工具允许你为你的\
  \ Web 应用程序创建或更新自己的设置。如果允许对某些设置进行覆盖，你也可以覆盖从上级配置文件继承的设置。如果不允许覆盖，该设置在管理工具中将显示为灰色。\n\
  \nASP.NET 网站管理工具在安装 .NET Framework 4.5 版本期间会自动安装。要使用该管理工具管理你自己的网站，你必须以站点注册用户的身份登录，并且对\
  \ `web.config` 文件具有读写权限。\n\n你无法远程甚至无法通过 IIS 本地访问 ASP.NET 网站管理工具。相反，你通过 Visual Studio\
  \ 2012 访问它，Visual Studio 而使用其集成的 Web 服务器（`IISExpress`）来访问该管理工具。\n\n要通过 Visual Studio\
  \ 2012 访问此工具，请打开网站或 Web 应用程序，点击顶部菜单中名为“网站”（Website）或“项目”（Project）下的 ASP.NET 配置菜单选项。启动此工具的另一种方法是从\
  \ Visual Studio 主菜单的“网站”选项中选择“ASP.NET 配置”。图 D-1 显示了 ASP.NET 网站管理工具的欢迎页面。\n\n![image](img/f1270-01.jpg)\n\
  \n**图 D-1**\n\nASP.NET 网站管理工具 (WSAT) 采用选项卡界面，将相关的配置设置分组。以下章节描述了选项卡以及它们管理的配置设置。\n\
  \n### 主选项卡 (Home)\n\n主选项卡（之前在 图 D-1 中显示）是一个摘要，提供了有关你正在监控或修改的应用程序的基本信息。它提供了应用程序名称以及你访问应用程序的用户上下文。此外，你还可以看到指向其他管理工具选项卡的链接，这些链接提供了设置的摘要。要对你的\
  \ Web 应用程序进行任何更改，只需点击相应的选项卡或链接。\n\n请记住，使用此管理工具对配置设置进行的大多数更改会立即生效，会导致 Web 应用程序重启，如果你在使用\
  \ InProc 会话，当前活动的会将会丢失。管理 ASP.NET 的最佳实践是对应用程序的开发版本进行配置更改，稍后将这些更改发布到生产应用程序中。这就是为什么该工具不能在\
  \ Visual Studio 之外使用的原因。\n\n某些设置（即管理工具界面具有专用“保存”按钮的设置）不会自动保存。如果你不点击保存按钮将你所做的更改传播到\
  \ `web.config` 文件，你可能会丢失在这些窗口中输入的信息。ASP.NET 网站管理工具在活动一段时间后超时。如果发生这种情况，任何未立即生效且未保存的设置将丢失。\n\
  \n尽管 ASP.NET 网站管理工具功能强大，但它只管理了 Web 应用程序可用的少数基本配置设置。所有其他设置都需要手动修改配置文件，即使用 Visual\
  \ Studio 手动编辑文件、使用 Internet 信息服务 (IIS) 管理器或使用配置 API。\n\n### 安全选项卡 (Security)\n\n\
  你使用“安全”选项卡来管理对 Web 应用程序安全部分的访问权限、用户帐户和角色。从此选项卡，你可以选择你的 Web 应用程序是在内网还是从 Internet\
  \ 访问。如果你指定内网，则将使用 Windows 身份验证；否则，将配置基于表单的身份验证。后者机制取决于你在自定义数据存储（如 SQL Server 数据库表）中管理用户。Windows\
  \ 身份验证使用用户的 Windows 登录进行识别。\n\n用户信息默认存储在数据库中。数据库会在 Web 应用程序的 `App_Data` 文件夹中自动创建。建议此类此类信息存储在更安全的位置，例如使用单独服务器上的数据库。更改数据存储可能意味着你还需要更改底层数据提供程序。要实现这一点，你只需使用“提供程序”（Provider）选项卡选择不同的数据提供程序。“提供程序”选项卡将在本附录后面的部分介绍。\n\
  \n你可以通过两种方式在此选项卡上配置安全设置：选择“设置向导”，或直接使用为“用户”（Users）、“角色”（Roles）和“访问管理”（Access Management）部分提供的链接。图\
  \ D-2 显示了安全选项卡。\n\n![image](img/f1272-01.jpg)\n\n**图 D-2**\n\n你可以使用向导配置初始设置。稍后你将学习创建和修改安全设置的其他方法。\n\
  \n#### 设置向导\n\n安全设置向导提供了一个七步过程，从选择身份验证用户的方式到选择存储用户的数据源。随后是对角色、用户和访问规则的定义。\n\n按照以下步骤使用安全设置向导：\n\
  \n1. **1. 欢迎：** 在“安全”选项卡上，点击“使用安全设置向导逐步配置安全”链接。向导欢迎屏幕（在 图 D-3 中显示）仅供参考。它向你介绍 ASP.NET\
  \ 安全管理的基础。当你读完屏幕后，点击“下一步”。\n\n![image](img/f1273-01.jpg)\n\n**图 D-3**\n\n2. **2.\
  \ 选择访问方法：** 在图 D-4 所示的“选择访问方法”屏幕上，选择你的访问方法（身份验证机制）。你有两个选项：\n\n![image](img/f1273-02.jpg)\n\
  \n**图 D-4**\n\n   * **来自 Internet:** 表示使用基于表单的身份验证。你必须使用自己的用户信息数据库。此选项对于非员工需要访问\
  \ Web 应用程序的场景非常有效。\n   * **来自局域网:** 表示此应用程序的用户已经在域内通过身份验证。你不需要使用自己的用户信息数据库。相反，你可以使用\
  \ Windows Web 服务器域用户信息。\n\n3. 选择“来自 Internet”，并点击“下一步”按钮。\n\n\n\n\n\n### 3. 数据存储\n\
  如前所述，ASP.NET 网站管理工具默认使用数据库。你可以在“提供程序”（Providers）选项卡上配置额外的提供程序。在图 D-5 所示的第 3 步中，只显示了一个高级提供程序，因为还没有配置其他提供程序。点击“下一步”。\n\
  \n![image](img/f1274-01.jpg)\n\n**图 D-5**\n\n### 4. 定义角色\n如果你认为所有用户具有相同的访问权限，只需取消勾选“启用此网站的角色”（Enable\
  \ Roles for This Web Site）复选框即可跳过此步骤（参见图 D-6）。如果不选此框，点击“下一步”将直接进入用户管理界面。勾选此框查看如何使用此向导定义角色。准备好后，点击“下一步”。\n\
  \n![image](img/f1274-02.jpg)\n\n**图 D-6**\n\n向导中的下一页（参见图 D-7）允许你创建和删除角色。角色仅仅是定义了用户的类别。稍后，你可以根据这些角色提供用户和访问规则。继续为管理员、人力资源、实习生和销售人员创建角色。点击“下一步”。\n\
  \n![image](img/f1275-01.jpg)\n\n**图 D-7**\n\n### 5. 添加新用户\n早些时候你选择了“来自互联网”（From\
  \ the Internet）选项，因此向导假设你想使用表单身份验证，并为你提供了创建和管理用户的选项。请记住，“来自局域网”（From a Local Area\
  \ Network）选项使用的是基于 Windows 的身份验证。\n\n“添加新用户”界面（参见图 D-8）允许你输入用户名、密码、电子邮件地址以及安全问题和答案。\n\
  \n![image](img/f1275-02.jpg)\n\n**图 D-8**\n\n你可以创建任意数量的用户；但要删除或更新用户信息，你必须离开向导并单独管理用户。如前所述，向导仅用于为未来的管理创建初始配置。点击“下一步”。\n\
  \n### 6. 添加新访问规则（参见图 D-9）\n首先，选择 Web 应用程序中需要特殊安全设置的文件夹。然后选择规则适用的角色或用户。选择权限（“允许”或“拒绝”）并点击“添加此规则”按钮。例如，如果你有一个名为“Secure”的文件夹，你可以选择它和“管理员”角色，然后点击“允许”单选按钮，允许管理员角色中的所有用户访问\
  \ Secure 文件夹。\n\n![image](img/f1276-01.jpg)\n\n**图 D-9**\n\n向导使你具备了将访问规则应用到角色或特定用户的能力。如果你为网站定义了许多用户并想要搜索特定用户，“搜索用户”选项会非常方便。\n\
  \n所有访问规则都显示在屏幕底部，你可以删除特定规则并重新开始。如果规则是从父配置继承的且在此处无法更改，规则将显示为灰色。。\n\n当你准备好后，点击“下一步”。\n\
  \n### 7. 完成\n安全设置向导的最后一个界面是信息页。点击“完成”按钮退出向导。\n\n#### 创建新用户\nASP.NET 网站管理工具的“安全”（Security）选项卡提供了不使用向导管理用户的方法，对于用户、角色和访问权限的持续维护非常有帮助。\n\
  \n要创建新用户，只需点击“安全”选项卡主页上的“创建新用户”链接（所示图 D-10）。随后会显示“创建用户”界面（所示图 D-11），允许你提供用户名、密码、确认密码、电子邮件以及安全问题和答案。你可以将新用户分配给角色列表中的任意角色；这些是当前为你的\
  \ Web 应用程序定义的角色。使用此工具创建名为 `Admin`、`HRUser` 和 `SalesUser` 的用户，并为他们分配相应的角色。\n\n![image](img/f1277-01.jpg)\n\
  \n**图 D-10**\n\n![image](img/f1277-02.jpg)\n\n**图 D-11**\n\n#### 管理用户\n你可以点击“安全”选项卡上的“管理用户”链接来管理现有用户。新界面将显示所有现有用户的列表（参见图\
  \ D-10）。它提供了搜索选项，如果列表很长，查找特定用户会变得更容易。\n\n找到想要管理的用户，然后你可以更新其信息、删除用户、重新分配角色或将用户设置为活动或非活动。\n\
  \n#### 管理角色\n“安全”选项卡提供了两个管理角色的链接：“禁用角色”（Disable Roles）和“创建或管理角色”（Create or Manage\
  \ Roles）。点击“禁用角色”将顾其实义——禁用 Web 应用程序中的角色管理；它还会使另一个链接变灰。点击“创建或管理角色”链接开始管理角色并为特定角色分配用户。屏幕显示你已定义的所有角色。你可以添加新角色、删除现有角色或管理特定角色。点击特定角色旁边的“管理”链接将显示分配给该角色的用户（参见图\
  \ D-12）。你可以通过搜索找到用户，然后将他们分配或从角色移除。\n\n![image](img/f1278-01.jpg)\n\n**图 D-12**\n\
  \n#### 管理访问规则\n“安全”选项卡提供了创建和管理访问规则的选项。访问规则适用于整个 Web 应用程序或其中的特定文件夹。点击“创建访问规则”链接将进入“添加新访问规则”界面，你可以在那里查看\
  \ Web 应用程序内部的文件夹列表（参见图 D-13）。你可以选择一个特定文件夹，选择一个角色或用户，然后选择是否允许该文件夹。\n\n1279-01.jpg\
  \ \n\n**图 D-13**\n\n在“安全”选项卡上点击“管理访问规则”将进入“管理访问规则”界面，该界面显示所有现有规则（参见图 D-14）。你可以删除任何这些规则并添加新规则。如果你想按特定顺序应用，还可以调整规则列表。\n\
  \n![image](img/f1279-02.jpg)\n\n**图 D-14**\n\n### 应用程序选项卡\n“应用程序”选项卡提供了许多特定的配置，包括\
  \ `<appSettings>` 的配置、SMTP 邮件服务器设置、调试和跟踪设置，以及启动/停止整个 Web 应用程序。\n\n#### 管理应用程序设置\n\
  屏幕左侧显示了创建和管理应用程序设置的链接。这些设置存储在 `web.config` 文件的 `<appSettings>` 部分。大多数 ASP.NET 程序员在之前的\
  \ ASP.NET 版本中手动修改此标记。图 D-15 显示了“应用程序”选项卡。\n\n![image](img/f1280-01.jpg)\n\n**图 D-15**\n\
  \n点击“创建应用程序设置”链接将进入一个可以提供名称和值信息的界面。点击“管理应用程序设置”将进入一个可以查看现有设置并对其编辑或删除的界面。你也可以从此屏幕创建一个新设置。\n\
  \n#### 管理 SMTP 配置\n\n\n\n\n\n点击“配置 SMTP 邮件设置”链接可查看如图 D-16 所示的屏幕。如果您的 Web 应用程序可以发送自动生成的电子邮件，配置\
  \ SMTP 邮件设置功能将非常有用。您可以在代码中指定 SMTP 服务器配置，而在管理工具的此处输入值即可在配置文件中详细说明。\n\n![image](img/f1281-01.jpg)\n\
  \n**图 D-16**\n\n指定服务器名称、端口、发件人电子邮件地址和验证类型。\n\n## 管理跟踪和调试信息\n\n点击`Application` 卡下的“配置调试和跟踪”链接将带您进入一个屏幕（参见图\
  \ D-17），在这里启用或禁用跟踪。选择是否在每个页面上显示跟踪信息。您还可以指定是跟踪本地请求还是所有请求，以及跟踪和缓存配置。\n\n![image](img/f1282-01.jpg)\n\
  \n**图 D-17**\n\n要配置默认错误页面，只需在图 D-15 所示的屏幕上点击“定义错误页面”。这将带您进入一个屏幕，在其中您可以选择用于错误情况下重定向的\
  \ URL。\n\n![image](img/f1282-02.jpg)\n\n**图 D-18**\n\n## 离线应用程序\n\n只需点击“离线”链接即可将整个\
  \ Web 应用程序离线（再次参见图 D-15）。该链接会停止您的 Web 应用程序域。如果您想对应用程序进行计划维护，此功能非常有用。\n\n## Provider\
  \ 选项\n\nASP.NET 网站管理工具的最后一个选项卡是`Provider`，如图 D-19 所示。您可以使用它来设置额外的提供程序并确定应用程序将使用的提供程序。\n\
  \n![image](img/f1283-01.jpg)\n\n**图 D-19**\n\nProvider 页面非常简单，但它包含一个重要信息：应用程序旨在运行的默认提供程序。在图\
  \ D-19 中，应用程序设置为与默认提供程序工作。\n\n此选项卡上的两个链接允许您设置单个提供程序或为 ASP.NET 中每个需要提供程序的设置特定提供程序。如果您点击后者，将显示图\
  \ D-20 所示的屏幕。它允许您为成员角色管理单独选择可用提供程序。\n\n![image](img/f1284-01.jpg)\n\n**图 D-20**\n\
  \n从这里的截图和简要说明可以看出，您现在可以通过 GUI 处理大部分必要的配置。不再需要猜测哪些设置必须放在 `web.config` 文件中。随着 `web.config`\
  \ 文件的增长，此功能变得更加重要。在 ASP.NET 1.0/1.1 中，`web.config` 文件的大小合理，但随着 ASP.NET 2.0 或 3.5\
  \ 提供的所有功能，`web.config` 文件变得非常大。再次，与 ASP.NET 1.0/1.1 一，ASP.NET 4.5 中的 `web.config`\
  \ 文件现在默认很小。这些基于 GUI 的工具是配置某些常用设置的极佳方式，但许多设置无法通过服务器管理工具修改，因此您仍然需要编辑 `web.config`\
  \ 文件。\n\n## 在 Windows 8 的 IIS 中配置 ASP.NET\n\n如果您使用 IIS 作为 ASP.NET 应用程序的基础，将发现通过\
  \ Internet Information Services (IIS) 管理器直接配置 ASP.NET 应用程序非常简单。要访问 ASP.NET 配置，请打开\
  \ IIS 并展开 `Sites` 文件夹，其中包含所有与 IIS 工作的站点。请记住，并不是所有的网站都以这种方式配置，因为也可以创建使用 ASP.NET 内置\
  \ Web 服务器的 ASP.NET 应用程序。\n\n展开 IIS `Sites` 文件夹后，右键点击该文件夹中的一个应用程序；可用配置选项将出现在 IIS\
  \ 管理器中（参见图 D-21）。\n\n![image](img/f1284-02.jpg)\n\n**图 D-21**\n\n可用的选项允许您完全配置 ASP.NET\
  \ 甚至配置 IIS 本身。本附录的重点是选项中的 ASP.NET 部分。除了从可用图标中选择的选项外，您还可以点击操作面板中的`Basic Settings`链接来配置应用程序的一些基本设置。\n\
  \n### .NET 编译\n\nIIS 管理器中的`Application` 选项卡允许您针对应用程序上下文中的页面进行更特定的更改。从图 D-23 所示的\
  \ .NET 编译对话框（通过 IIS 管理器访问），您可以更改页面的编译和运行方式。您还可以对应用程序中的全局设置进行更改。\n\n![image](img/f1286-01.jpg)\n\
  \n**图 D-23**\n\n### .NET 全球化\n\nIIS 管理器中的 .NET Globalization 选项允许您自定义 ASP.NET 应用程序处理文化以及请求和响应编码的方式。图\
  \ D-24 显示了此对话框中的可用选项。\n\n![image](img/f1287-01.jpg)\n\n**图 D-24**\n\n\n\n\n除了选择特定的\
  \ `Culture` 或 `UI Culture` 设置外，你还可以选择 `Auto Detect`（自动检测），如果可用，它将获取客户端区域。默认情况下，你还可以看到请求和响应的编码被设置为\
  \ `utf-8`，这对于大多数基于拉丁的语言都可以正常工作。\n\n## .NET Profile\n\nIIS 管理器的 .NET Profile 选项允许你自定义\
  \ ASP.NET 处理 ASP.NET 个性化系统的方式。该系统在第 18 章中已经讨论过。图 D-25 显示了向个性化系统添加新配置文件时提供的对话框。\n\
  \n![image](img/f1287-02.jpg)\n\n**图 D-25**\n\n在这种情况下，如图 D-25 所示，你可以指定个性化属性的名称、使用的数据类型、其默认值、序列化方式，以及它是否为只读或匿名用户可用。为了更好地理解这些设置，回顾第\
  \ 18 章是非常重要的。\n\n除了构建用于个性化系统的属性外，你还可以指定整个系统使用的提供程序。默认情况下，它使用 `AspNetSqlProfileProvider`，如图\
  \ D-26 所示。你可以通过点击 .NET Profile 部分的 `Set Default Provider`（设置默认提供程序）链接进入此对话框。\n\n\
  ![image](img/f1287-03.jpg)\n\n**图 D-26**\n\n## .NET Roles\n\n通过从 IIS 管理器的 .NET Roles\
  \ 部分向应用程序添加角色，你可以启用基于角色的管理。图 D-27 显示了在点击操作（Actions）部分的 `Add` 链接后，向应用程序添加名为 `Administrators`\
  \ 的角色的示例。\n\n![image](img/f1287-04.jpg)\n\n**图 D-27**\n\n点击 OK 将将角色添加到系统，随后该角色将出现在该部分主屏幕的角色列表中，如图\
  \ D-28 所示。\n\n![image](img/f1288-01.jpg)\n\n**图 D-28**\n\n默认情况下，没有用户被添加到该角色。你可以通过稍后讨论的\
  \ .NET Users 部分将用户添加到角色中。\n\n## .NET Trust Levels\n\nIIS 管理器的 .NET Trust Levels\
  \ 部分允许你通过选择特定的预生成配置，来指定应用于应用程序的安全级别。这在图 D-29 中所示的选项列表中得到了说明。\n\n![image](img/f1288-02.jpg)\n\
  \n**图 D-29**\n\n默认情况下，你的应用程序使用 `web.config` 文件，但指定不同的信任级别会导致应用程序使用不同的 `.config`\
  \ 文件。你可以在 `C:\\Windows\\Microsoft.NET\\Framework\\v4.0.xxxxx\\CONFIG` 找到所有这些 `.config`\
  \ 文件。\n\n## .NET Users\n\n与 ASP.NET 成员系统（涵盖在第 19 章中）交互的最简单方法可能是在 IIS 管理器的 .NET Users\
  \ 部分创建用户。通过提供的对话框添加用户非常简单，如图 D-30 所示。\n\n![image](img/f1289-01.jpg)\n\n**图 D-30**\n\
  \n如图 D-30 所示，你可以在一个简单的向导中提供用户名、密码以及安全问题和答案。图 D-31 显示了向导的第二个屏幕。\n\n![image](img/f1289-02.jpg)\n\
  \n**图 D-31**\n\n在向导的第二个屏幕中，你可以将用户分配给角色管理系统中存在的特定角色。由于 `Administrators` 角色在本附录之前已经创建，因此我能够将用户分配到这个特定角色，因为它存在于系统中。\n\
  \n创建用户后，你可以从 .NET Users 主屏幕查看此特定应用程序的所有用户列表，如图 D-32 所示。\n\n![image](img/f1290-01.jpg)\n\
  \n**图 D-32**\n\n## Application Settings\n\n在 IIS 管理器的 IIS Application Settings 部分，你可以点击\
  \ `Add`（添加）或 `Edit`（编辑）按钮，打开添加/编辑应用程序设置对话框（参见图 D-33）。\n\n![image](img/f1290-02.jpg)\n\
  \n**图 D-33**\n\n## Connection Strings\n\n在 IIS 管理器的 Connection Strings 部分，你可以通过点击\
  \ `Add` 按钮为应用程序添加连接字符串。图 D-34 显示了 `DefaultConnection` 的编辑对话框。\n\n![image](img/f1290-03.jpg)\n\
  \n**图 D-34**\n\n## Pages and Controls\n\nIIS 管理器的 Pages and Controls 部分处理一组控制 ASP.NET\
  \ 页面（`.aspx`）和用户控件（`.ascx`）的设置。图 D-35 显示了该部分的可用设置。\n\n![image](img/f1291-01.jpg)\n\
  \n**图 D-35**\n\n## Providers\n\nIIS 的 Providers 部分处理应用程序定义的所有提供程序。从图 D-36 的示例中，你可以看到为\
  \ .NET 定义了三个提供程序：SQL Server 提供程序、Windows Token 提供程序和 MySQL 提供程序。\n\n![image](img/f1291-02.jpg)\n\
  \n**图 D-36**\n\n## Session State\n\nASP.NET 应用程序本质上是无状态的，因此高度取决于状态如何存储。IIS 管理器的\
  \ Session State 部分（参见图 D-37）允许你更改决定状态管理的许多不同设置。\n\n![image](img/f1292-01.jpg)\n\n\
  **图 D-37**\n\n你可以通过多种方式为应用程序应用状态管理，此对话框允许许多不同的设置——某些设置会根据选择启用或禁用。以下列表描述了 Session\
  \ State Settings 部分可用的项目：\n\n*   **Session state mode（会话状态模式）：**决定如何存储会话。默认选项（如图\
  \ D-37](#Appendix04.xhtml_figureD-37)所示）是 `In process`。其他选项包括 `Not enabled`、`Custom`、`State\
  \ Server` 和 `SQL Server`。进程内意味着会话存储在与 ASP.NET 工作进程相同的进程中。因此，如果关闭并重新启动 IIS，所有会话将被销毁且用户不可用。`Custom`\
  \ 表示你可以指定自定义存储提供程序。例如，你可以使用第三方会话状态提供程序。`State Server` 表示会话由名为 `ASPState` 的 Windows\
  \ 服务在进程外存储。`SQL Server` 是处理会话最安全的方法；它直接存储在 SQL Server 中。State Server 也是效率最低的方法。\n\
  \n\n\n\n\n- **无 Cookie 模式 (Cookieless mode):** 更改存储用户标识的方式。默认设置使用 cookie (`UseCookies`)。其他可能的设置包括\
  \ `UseUri`、`AutoDetect` 和 `UseDeviceProfile`。\n- **会话超时 (Session timeout):** 会话仅存储一段时间后过期。多年来，默认值为\
  \ 20 分钟。修改此处的值将更改您的应用程序创建的会话有效期。\n\n### SMTP 电子邮件\n\n如果您需要与发送电子邮件的应用程序配合工作，必须指定相关设置。您可以通过\
  \ IIS 管理器中的 SMTP 电子邮件部分定义通过 SMTP 发送电子邮件所需的设置（参见 图 D-39）。\n\n![image](img/f1293-01.jpg)\n\
  \n**图 D-39**\n\n## 总结\n\n本附录向您展示了作为 ASP.NET 一部分的管理工具。这些工具使得 `web.config` 文件更易管理，因为它们负责在应用程序配置文件中设置适当的值。\n\
  \nWindows 8 中的 IIS 管理器控制台是管理配置为与 IIS 工作的应用程序的优秀工具。ASP.NET 网站管理工具通过允许用户轻松管理设置，为管理员和开发者提供了更大的价值。\n\
  \n# E\n\n## 动态类型与语言\n\n### 本附录的代码下载\n\n请注意，本附录中的所有代码示例均作为本附录代码下载的一部分，可以在书籍网站的 [`www.wrox.com`](http://www.wrox.com)\
  \ 的“下载代码 (Download Code)”选项卡中找到。\n\n当微软最初引入 .NET 时，许多开发者（特别是那些来自 Visual Basic 6\
  \ 或更早版本的开发者）进入了一个静态类型语言的新世界。开发者不再被允许创建变体类型（variant types），或者在运行时使用后期绑定（late binding）轻松地创建对象实例。新的基于\
  \ .NET 的语言迫使他们使用已知类型来定义所有对象，如果编译器不识别该类型，它就会向他们抛出错误。\n\n纯主义者会辩论说 .NET 确实支持后期绑定，而且\
  \ VB.NET 确实可以通过禁用 `Option Strict` 命令来适应后期绑定，尽管在大多数情况下这显然是不被鼓励的。在 C# 中，如果您想模拟后期绑定，必须求助于反射（reflection），这通常意味着更多的代码行和应用程序复杂度。\n\
  \n尽管静态类型语言具有许多优势，例如严格的类型安全以及利用编译器根据已知类型信息进行优化的能力，但您会失去一些从动态类型语言中获得的活性。此外，动态性的缺乏确实使得\
  \ .NET 与动态语言之间的互操作变得更加困难。如果您曾经创建过需要 COM 交互（COM interop）的应用程序，您可能体会过这一点。\n\n本附录探讨了微软在采用动态语言概念方面所做的工作，以及如何继续让开发者更容易直接使用以及与动态语言交互。\n\
  \n## 隐式类型 (IMPLICIT TYPES)\n\n自从隐式类型在 .NET Framework 中引入以来，它们为变量声明的方式增加了灵活性。隐式类型在\
  \ C# 中使用 `var` 关键字表示，在 VB.NET 中通过声明变量时不使用 `As` 操作符来表示。它们允许您声明一个类型由用于初始化变量的表达式隐式推断的变量。换句话说，隐式类型允许您在代码中以相当动态的方式声明变量，同时通过编译魔法在运行时保留静态类型变量的处。这里展示了一个使用隐式类型的示例：\n\
  \n**VB**\n\n```\n Protected Sub Page_Load(ByVal sender As Object, ByVal e As System.EventArgs)\n\
  \      Dim foo = 1\n  End Sub\n```\n\n**C#**\n\n```sharp\n protected void Page_Load(object\
  \ sender, EventArgs e)\n  {\n      var foo = 1;\n  }\n```\n\n在此示例中，变量 `foo` 被声明为隐式类型，并立即赋值为数值\
  \ `1`。因为变量被分配了数值，编译器将自动推断变量 `foo` 实际上应该是 `Int32` 类型。事实上，如果您将代码反编译为中间语言 (IL)，您将看到编译器实际输出的代码实际上将变量发布为正确的类型。如下所示所示，尝试给此变量分配不同的类型将导致类型不匹配异常：\n\
  \n**VB**\n\n```\n Protected Sub Page_Load(ByVal sender As Object, ByVal e As System.EventArgs)\n\
  \      Dim foo = 1\n      foo = \"abc\"\n  End Sub\n```\n\n**C#**\n\n```sharp\n\
  \ protected void Page_Load(object sender, EventArgs e)\n  {\n      var foo = 1;\n\
  \      foo = \"abc\";\n  }\n```\n\n尝试编译此代码会导致编译器错误，告知您字符串无法赋值给变量 `foo`。\n\n## 动态语言运行时环境\
  \ (THE DYNAMIC LANGUAGE RUNTIME)\n\n为了帮助开发者找回部分这种灵活性，并将 .NET Framework 提供的通用优势带给更广泛的开发者群体，微软在\
  \ 2007 年宣布已开始开展一项名为动态语言运行时（dynamic language runtime，简称 DLR）的新计划。随着 .NET 4.0 的发布，通用语言运行时\
  \ (CLR) 补充了 DLR。它为 CLR 引入了动态类型系统、动态方法分发、动态代码生成和一个托管 API。DLR 允许动态语言在 .NET 运行时运行。通过使用\
  \ DLR，这些动态语言获得了这两个环境的优点。它们运行在动态环境中，类型在运行时被发现，并且可以访问丰富的 .NET 类库。IronPython 和 IronRuby\
  \ 作为流行的动态语言移植，目前利用了 DLR。\n\nIronRuby 和 IronPython 语言都是从微软内部孵化并以开源许可发布的。IronRuby\
  \ 和 IronPython 项目是微软为了改进 .NET Framework 对动态语言的支持并使其语言组合多样化的一项努力。截至 2010 年第四季度，微软将这些\
  \ Iron 项目的开发交给社区。其他动态语言也由第三方开发者开发和维护。\n\n由于基于 DLR 的语言开发与基于 CLR 的语言分离分离，且对基于 DLR\
  \ 的语言的支持已交给社区，因此 Visual Studio 内部对这些语言的支持并不丰富。虽然有适用于 IronPython 和 IronRuby 的工具，但功能差异很大。\n\
  \n在系统中加载了这些语言后，您可以使用它们开发独立应用程序，或者利用 C# 或 VB.NET 等静态语言库。列表 E-1（附录代码下载中 IronPythonCS\
  \ 和 IronPythonVB 项目中的 IronPythonList.aspx）演示了如何在 ASP.NET 应用程序中使用 IronPython 代码。注意，要执行示例代码，您需要安装\
  \ 2.7 版本的 IronPython，并引用位于默认安装位置 \\Program Files (x86)\\IronPython 2.7\\Platforms\\\
  Net40 的 `Microsoft.Scripting.dll` 和 `IronPython.dll` 程序集。\n\n您可以在此列表中看到，当页面加载时，使用\
  \ DLR 的托管 API 从 IronPython 安装目录加载 IronPython 库 `random.py`。当 `items` 数组中的每个项绑定到\
  \ Repeater 时，都会使用 IronPython 库将其 `subitems` 打乱为随机顺序。\n\n## 动态查找 (DYNAMIC LOOKUP)\n\
  \n\n\n\n在 C# 4 中，引入了一个名为 `dynamic lookup`（动态查找）的新特性。尽管 `.NET` 开发者早已熟悉使用反射进行后期绑定，但\
  \ `dynamic lookup` 为 C# 带来了了真正动态的类型声明机制。`dynamic lookup` 允许你在代码中显式地将变量声明为 `dynamic`\
  \ 类型，并在运行时动态调用该类型的方法。这与隐式类型的区别在于，`dynamic` 类型在运行时仍然保持真正的动态性，而隐式类型在编译时会被转换为静态类型。以下代码了使用新\
  \ `dynamic` 关键字的简单示例：\n\n```xml\n <script runat=\"server\">\n      protected void\
  \ Page_Load(object sender, EventArgs e)\n      {\n          dynamic dynvalue =\n\
  \              \"Even though assigned a string, the type is still dynamic\";\n \
  \     }\n  </script>\n```\n\n在此示例中，属性 `dynvalue` 被赋值了一个简单的字符串作为值；然而，与隐式类型不同，该变量在运行时仍然被类型为\
  \ `dynamic` 类型。如果你在 Visual Studio 中尝试访问该变量的任何成员，就可以看到这种动态性。通常情况下，Visual Studio 会向你显示可用属性和方法的列表以及变量的类型。但由于该类型是\
  \ `dynamic`，在运行之前，这些信息都是不可知的。你可以通过观察 Visual Studio 中动态变量上的提示框看到这一点，如图 E-1 所示。\n\n\
  ![image](img/f1300-01.jpg)\n\n**图 E-1**\n\n在运行时，动态语言运行时的动态分发系统使用动态调用来执行类型的方法和属性。这意味着你可以在运行时从类型中添加或删除成员。`.NET`\
  \ 提供了两种机制来实现：`ExpandoObject` 类和 `DynamicObject` 类。\n\n在需要动态添加或删除成员的简单场景下，你可以使用 `ExpandoObject`\
  \ 类。以下代码演示了如何使用 `ExpandoObject`：\n\n```csharp\n dynamic contact = new System.Dynamic.ExpandoObject();\n\
  \  contact.Name = \"John Doe\";\n  contact.Phone = \"201-555-5555\";\n  contact.Address\
  \ = new System.Dynamic.ExpandoObject();\n  contact.Address.Street = \"123 Main St\"\
  ;\n  contact.Address.City = \"Anywhere\";\n  contact.Address.State = \"WA\";\n \
  \ contact.Address.Postal = \"12345\";\n```\n\n在此示例代码中，你可以看到创建了一个 `ExpandoObject`\
  \ 并添加了几个属性。这些属性是在运行时动态添加的，并在内部存储为 `IDictionary<String,Object>`，`ExpandoObject` 内部实现了该接口以维护成员列表。\n\
  \n`ExpandoObject` 是密封的（sealed），不能被进一步继承。如果你需要对动态对象上可以执行的特定操作进行更多控制，或者在发生获取和设置属性或调用方法等操作时控制发生的情况，你可以创建派自\
  \ `DynamicObject` 的对象。派自 `DynamicObject` 类的示例使用了 `JsonObject` 类（位于附录代码下载包中 `DynamicRest`\
  \ 项目下的 `DynamicRest/JsonObject.cs`）。以下代码显示了该类的部分：\n\n```csharp\nnamespace DynamicRest\
  \ {\n\n      public sealed class JsonObject :\n                                \
  \        DynamicObject {\n\n          private Dictionary<string, object> _members;\n\
  \n          public JsonObject() {\n              _members = new Dictionary<string,\
  \ object>();\n          }\n\n          public override bool TryGetMember(dynamic\
  \ binder, out object result) {\n              if (_members.TryGetValue((string)binder,\
  \ out result)) {\n                  return true;\n              }\n            \
  \  result = null;\n              return false;\n          }\n\n          public\
  \ override bool TrySetMember(dynamic binder, object value) {\n              _members[(string)binder]\
  \ = value;\n              return true;\n          }\n\n          public override\
  \ bool TryDeleteMember(dynamic binder) {\n              return _members.Remove((string)binder);\n\
  \          }\n      }\n  }\n```\n\n此 `JsonObject` 类是由 Nikhil Kothari 编写的较大库的一部分，它简化了\
  \ JSON 的检索和解析。在 .NET 4.5 中，增加了 `System.Json` 命名空间，提供了更方便地处理 JSON 的能力。然而在此之前，要在 `.NET`\
  \ 中处理 JSON 数据，你必须创建镜像 JSON 结构的代理类型，然后执行复杂的解析操作将 JSON 数据解析到集合中。使用 C# 4 最初引入的动态能力，你可以通过将\
  \ JSON 数据解析为泛型来简化这一过程，这些泛型通过在运行时推断的动态属性和方法来暴露数据。因此，`JsonObject` 类是使用 `DynamicObject`\
  \ 的一个良好示例。\n\n\n\n\n```cs\n var excelApp = new Microsoft.Office.Interop.Excel.Application();\n\
  \  excelApp.Visible = true;\n  excelApp.Workbooks.Add();\n\n  Microsoft.Office.Interop.Excel.Worksheet\
  \ workSheet = excelApp.ActiveSheet;\n  workSheet.Cells[1, \"A\"] = \"ID Number\"\
  ;\n  workSheet.Cells[1, \"B\"] = \"Current Balance\";\n\n  var row = 1;\n  foreach\
  \ (var acct in accounts)\n  {\n    row++;\n    workSheet.Cells[row, \"A\"] = acct.ID;\n\
  \    workSheet.Cells[row, \"B\"] = acct.Balance;\n  }\n\n  workSheet.Columns[1].AutoFit();\n\
  \  workSheet.Columns[2].AutoFit();\n```\n\n在 PIA 的之前的版本中，访问某些 API（如示例所示的 `Columns`\
  \ 集合）需要你将返回的对象强制转换为相应的类型，以便访问该类型的属性和方法。然而，较新版本利用了 `dynamic` 关键字来消除了这一要求，并允许对这些属性和方法进行动态查找。\n\
  \n## 总结\n\n微软通过投资那些能够为语言带来更多动态性的特性，继续扩展 .NET Framework 及其语言的功能。这些特性在你的工具箱中提供了额外的编程工具，使你能够利用对你的特定应用程序最有意义的特性，甚至是特定的编程语言。从\
  \ C# 和 VB.NET 的内置功能（如隐式类型和动态查找）到像 IronPython 和 IronRuby 等完全全新的语言，你可以选择范围正在不断扩大。\n\
