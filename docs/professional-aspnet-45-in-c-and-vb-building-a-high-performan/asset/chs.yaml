  \ 站点”对话框。选择 ASP.NET 空 Web 站点，如图 13-1 所示。\n\n![image](img/f457-01.jpg)\n\n**图 13-1**\n\
  \n项目创建后，右键点击向项目添加新文件。从选项列表中选择 Web 服务（`WebService.asmx`）。这会创建一个名为 `WebService.asmx`\
