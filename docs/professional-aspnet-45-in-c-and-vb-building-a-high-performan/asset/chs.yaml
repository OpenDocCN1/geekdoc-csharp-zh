  \ jQuery*（John Wiley & Sons, 2012）。显然，本章只能触及表面，并指导你在使用该 JavaScript 库时完成最常见的任务。如需更深入的信息，请参阅上述书籍，或参阅\
  \ `jQuery` 网站上丰富的文档 [`http://api.jquery.com/`](http://api.jquery.com/)。\n\n## JQUERY\
