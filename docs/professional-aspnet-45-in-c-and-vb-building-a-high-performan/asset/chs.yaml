  \nASP.NET 数据中数据绑定的另一个特性是内联数据绑定语法。ASP.NET 1.0/1.1 中的内联语法主要被分配给模板控件，如 `DataList` 或\
  \ `Repeater` 控件，即使如此，要让它们按照你想要的方式工作有时也困难且令人困惑。在 ASP.NET 1.0/1.1 中，如果你需要使用内联数据绑定，你可能会创建一个类似于列表\
  \ 8-52 中所示的过程。\n\n正如你在这个示例中所看到的，你正在使用 `Repeater` 控件来显示一系列员工。由于 `Repeater` 控件是一个模板控件，你使用数据绑定在模板的适当位置输出特定员工的数据。使用\
  \ `Eval` 方法还允许你在渲染时提供格式化信息，例如 `Date`（日期）或 `Currency`（货币）格式。\n\n在 ASP.NET 的后续版本中，内联数据绑定的概念基本上保持不变，但你被赋予更简单的语法和几个强大的绑定工具可以使用。\n\
  \n### 数据绑定语法\n\nASP.NET 包含了执行数据绑定的三种方法。一种你可以继续使用现有的绑定方法，使用 `Container.DataItem`\
  \ 语法：\n\n```\n <%# Container.DataItem(\"Name\") %>\n```\n\n这种方法很好，因为意味着如果你从 ASP.NET\
  \ 的早期版本迁移，就不需要更改现有的网页。但如果你正在创建新的网页，你可能应该使用最简单的绑定形式，即直接使用 `Eval` 方法：\n\n```\n <%#\
  \ Eval(\"Name\") %>\n```\n\n你也可以继续使用 `Eval` 方法的格式化重载对数据进行格式化：\n\n```\n <%# Eval(\"\
  HireDate\", \"{0:mm dd yyyy}\" ) %>\n```\n\n除了这些更改外，ASP.NET 还包含一种名为*双向数据绑定*的数据绑定形式。双向数据绑定允许你对绑定的数据支持读和写操作。这是通过使用\
  \ `Bind` 方法实现的，除了方法名称不同外，它的工作原理与 `Eval` 方法相同：\n\n```\n <%# Bind(\"Name\") %>\n```\n\
  \n`Bind` 方法应该在如 `GridView`、`DetailsView` 或 `FormView` 等控件中使用，这些控件中实现了对数据源的自动更新。\n\
  \n在处理数据绑定语句时，请记住 `<%# %>` 分隔符之间的任何内容都被视为一个表达式。这很重要，因为在数据绑定时它为你提供了额外功能。例如，你可以附加额外数据：\n\
  \n```\n <%# \"Foo \" + Eval(\"Name\") %>\n```\n\n或者你甚至可以将求值结果传递给一个方法：\n\n```\n <%#\
  \ DoSomeProcess( Eval(\"Name\") )%>\n```\n\n### XML 数据绑定\n\n由于 XML 在应用中非常流行，ASP.NET\
  \ 还包含了几种专门绑定到 XML 数据源的方法。这些数据绑定表达式为你提供了处理 XML 层次结构格式的强大方法。此外，除了方法名称不同外，这些绑定方法的工作与之前讨论的\
  \ `Eval` 和 `Bind` 方法完全相同。当你使用 `XmlDataSource` 控件时应使用这些绑定器。使用 `XPathBinder` 类的第一个绑定格式在下面的代码所示：\n\
