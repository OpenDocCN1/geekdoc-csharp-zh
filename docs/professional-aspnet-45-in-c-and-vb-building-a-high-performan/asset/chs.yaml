  \ ASP.NET 跟踪请求详情中看到的 `SessionId`。该 `SessionId` 出现在刚创建的 ASPState 数据库中 `ASPStateTempSessions`\
  \ 表的 `SessionId` 列中。\n\n### 使用其他程序扩展会话状态\n\nASP.NET 会话状态构建在可扩展的、基于程序的存储模型之上。你可以通过派自\
  \ `SessionStateStoreBase` 简单地实现在其他存储机制存储会话数据的自定义程序。这种可扩展性还允许你通过实现 `ISessionManager`\
  \ 通过你自己的算法生成会话 ID。\n\n你首先创建一个继承自 `SessionStateStoreBase` 的类。只要派生自 `SessionStateStoreBase`，会话模块就会调用任何会话程序的方法。在应用程序的\
  \ `web.config` 文件中注册你的自定义程序，如下所示：\n\n```\n <sessionState mode=\"Custom\" customProvider\
  \ =\"WroxProvider\">\n      <providers >\n          <add name=\"WroxProvider\" type=\"\
  Wrox.WroxStore, WroxSessionSupplier\"/>\n      </providers>\n  </sessionState >\n\
  ```\n\nASP.NET 初始化 `SessionStateModule`，这些方法会在任何自定义实现上被调用：\n\n- `Initialize`: 此方法最终派生自\
  \ `System.Configuration.Provider.ProviderBase`，并在构造函数之后立即调用。通过此方法，你可以设置程序名称并调用 `Initialize`\
  \ 的基类实现。\n\n- `SetItemExpireCallback`: 通过此方法，你可以注册任何在会话项过期时调用的方法。\n\n- `InitializeRequest`:\
  \ 此方法由 `SessionStateModule` 为每个请求调用。这是一个为即将到来的数据请求做准备的早期机会。\n\n- `CreateNewStoreData`:\
  \ 通过此方法，你创建一个 `SessionStateStoreData` 实例，该数据结构持有会话项、会话超时值以及任何静态项。\n\n当请求会话项时，ASP.NET\
  \ 会调用你的实现来检索。实现以下方法以检索项：\n\n- `GetItemExclusive`: 此方法允许你从所选存储器获取 `SessionStateStoreData`。你可能创建了\
  \ Oracle 程序、将数据存储在 XML 中，或存储在其他地方。\n\n\n\n\n*   `GetItem`: 这是你像在 `GetItemExclusive`\
  \ 中那样检索它的机会，只不过没有使用排斥性锁。取决于你选择了什么种底层存储，你可能不在意这一点。\n\n当需要存储项时，会调用以下方法：\n\n*   `SetAndReleaseItemExculsive`:\
  \ 在此处，你应该将 `SessionStateStoreData` 对象保存到你的自定义存储器。\n\n### 无 Cookie 会话状态\n\n在之前的示例中，ASP.NET\
  \ 会话状态 ID 存储在 cookie 中。某些设备不支持 cookie，或者用户可能在浏览器中关闭了 cookie 支持。Cookie 之所以方便，是因为值会在每个请求和响应之间往返传输。这意味着每个\
  \ `HttpRequest` 都包含 cookie 值，而每个 `HttpResponse` 都包含 cookie 值。在每个 `Request` 和 `Response`\
  \ 之间往返传输的唯一其他东西是什么？答案是 URL。\n\n如果你在 `web.config` 文件中包含 `cookieless=\"UseUri\"` 属性，ASP.NET\
  \ 将不会将 ASP.NET 会话 ID 作为 cookie 传回。相反，它会修改每个 URL，在请求的页面之前包含会话 ID：\n\n```\n <sessionState\
  \ mode=\"SQLServer\" cookieless=\"UseUri\" sqlConnectionString=\"data\n  source=127.0.0.1;user\
  \ id=sa;password=Wrox\" />\n```\n\n注意，会话 ID 出现在 URL 中，就像它是一个位于实际网站虚拟目录和页面之间的独立目录一样。通过这种更改，服务器端用户控件（如在列表\
  \ 21-1 中使用的 `HyperLink` 控件）的属性会被自动修改。列表 21-1 中的链接可以直接在设计器中硬编码为 HTML，但这样 ASP.NET\
  \ 就无法修改图 21-8 中显示的 Target URL。\n\n![image](img/f812-01.jpg)\n\n**图 21-8**\n\n会话\
  \ ID 是一个仅包含 URL 允许的 ASCII 字符的字符串。当你意识到从基于 cookie 会话状态系统迁移到无 cookie 系统需要将该会话状态值放入\
  \ URL 时，这就有意义了。\n\n注意图 21-8 中的请求 URL 包含一个括号内的会话 ID。无 cookie 会话的一个缺点是它们很容易被篡改。无疑，cookie\
  \ 可以使用 HTTP 嗅探器进行篡改，但 URL 可以被任何人编辑。维护会话状态的唯一方法是*每一个* URL 都以这种方式包含会话 ID。\n\n此外，所有\
  \ URL *必须*是相对的。记住，会话 ID 看起来就像一个目录。如果调用了绝对 URL（例如 `/myapp/my/file.aspx`），则会丢失将会话。如果你在服务器端生成\
  \ URL，请使用 `HttpResponse.ApplyAppPathModifier()`。它会在嵌入会话 ID 时更改 URL，如下所示：\n\n```\n\
  \ Response.Write(Response.ApplyAppPathModifier(\"my/file.aspx\"));\n```\n\n上一行生成了类似于下方的\
  \ URL：\n\n```\n /myapp/(S(avkbnbml4n1n5mi5dmfqnu45))/my/file.aspx\n```\n\n注意，不仅向\
  \ URL 中添加了会话信息，它还从相对 URL 转换为绝对 URL，包含了应用程序的虚拟目录。当你需要使用 `Response.Redirect` 或手动构建\
  \ URL 从 HTTP 页面重定向到 HTTPS 页面，同时保持无 cookie 会话状态时，这种方法会非常有用。\n\n### 选择维护状态的正确方法\n\n\
  现在你已经熟悉了 ASP.NET 中维护状态的各种选项，这里有一些来自生产系统的真实建议。进程内（InProc）会话提供程序是最快的方法，因为内存中保留的所有内容都是活动对象引用。此提供程序存储在\
  \ `HttpApplication` 缓存中，因此它容易受到应用程序回收的影响。如果你使用 Windows Server 2000 或 Windows XP，`aspnet_wp.exe`\
  \ 进程管理 ASP.NET 管道。如果你运行的是较新版本，如 Windows Server 2008、2012 或 Windows 7 或 8，`w3wp.exe`\
  \ 是托管运行时的进程。\n\n你必须在进程外状态服务的稳健性和进程内提供程序的速度之间找到平衡。根据作者的经验，由于序列化开销和需要进行的封化，进程外状态服务通常比进程内提供程序慢\
  \ 15%。SQL 会话状态比 InProc 慢 25%。当然，你的情况可能会有所不同。不要让这些数字太困扰你。在慌并做出错误决定之前，确保对你的应用程序进行扩展性测试。\n\
  \n## Application 对象\n\n`Application` 对象等相当于你的 ASP.NET 应用程序的全局变量包。多年来，全局变量在其他编程环境中被认为是有害的，ASP.NET\
  \ 也不例外。你应该考虑想将什么放入 `Application` 对象中以及为什么。通常，更灵活的、帮助你控制对象生命周期的 `Cache` 对象更有用。缓存将在第\
  \ 22 章中进行详细讨论。\n\n\n\n\n回想 Cookie 刚被引入的时候。大多数用户并不确定 Cookie 到底是什么，但他们坚信 Cookie 是邪恶的，正在存储他们的个人信息。在当时，个人信息很可能真的存储在\
  \ Cookie 中！**永远、绝对不要在 Cookie 中存储敏感信息，例如用户 ID 或密码。** Cookie 应该仅用于存储非敏感信息，或可以从权威源检索的信息。不应该信任\
  \ Cookie，并且其内容应该能够通过验证。例如，如果 Forms Authentication Cookie 被篡改，用户将会被注销并抛出一个异常。如果为过期的会话传递无效的会话\
  \ ID Cookie，可以分配一个新的 Cookie。\n\n当你在 Cookie 中存储信息时（使用 `Response.Cookies` —— 读取操作则使用\
  \ `Request.Cookies`），请记住这与在 `Session` 对象中存储数据有很大不同：\n\n*   **Cookie 会在每次请求中往返传输。这意味着在每次\
  \ `HTTP GET` 和 `HTTP POST` 中，你都在为 Cookie 的大小付费。如果你在页面上有十个用于表格布局的 1 像素间距 GIF，用户的浏览器将发送\
  \ 11 次相同的 Cookie —— 一次针对页面本身，以及针对每个间距 GIF（即使该 GIF 已经缓存）。\n\n*   **Cookie 可以被窃取、嗅探和伪造。**\
  \ 如果你的代码依赖于 Cookie 的值，请在代码中准备好计划，以应对 Cookie 可能会被损坏或篡改的必然性。\n\n*   **如果 Cookie 没有显示，应用程序的预期行为是什么？如果它是\
  \ 4096 字节怎么办？** 做好准备。你应该围绕“最小惊讶原则”来设计你的应用程序。如果发现 Cookie 缺失或比预期大，你的应用程序应该尝试自我修复。\n\
  \n*   **在对任何大型内容进行 Base64 编码并将其放入 Cookie 之前，请三思。** 如果你的设计依赖于这种技术，请重新考虑使用 Session\
  \ 或另一个后端存储。\n\n## 回传（POSTBACKS）与跨页面回传（CROSS-PAGE POSTBACKS）\n\nASP.NET 使用“回传”（postback）的概念，即通过触发服务器端事件来提醒开发者客户端操作。如果在浏览器上点击了按钮，Form\
  \ 集合将 `POST` 回到服务器，但现在 ASP.NET 允许开发者在 `Button1_Click()` 和 `TextBox1_Changed()` 等事件中编写代码。\n\
  \n然而，这种向同一页面回传的技术是违反直觉的，尤其是当你设计旨在创建向导（wizards）以给用户前进感的用户界面时。\n\n本章将介绍状态管理的所有方面。然而，回传和跨页面回传在\
  \ 第 3 章 中有详细介绍，因此本章仅在状态管理的语境下提到它们。回传是在 ASP.NET 1.x 中引入的，用于为 Web 开发提供一个事件子系统。然而，1.x\
  \ 中只有单页回传是非常不方便的，这导致许多开发者在回传时将小对象存储在 Session 中，然后重定向到下一页以获取存储的数据。通过跨页面回传，数据可以“向前”\
  \ `post` 到不同的页面，这通常消除了存储那些可以直接传递的微小数据的需要。\n\nASP.NET 2.0 及以上版本为所有按钮控件（包括 `LinkButton`\
  \ 和 `ImageButton`）引入了 `PostBackUrl` 概念。`PostBackUrl` 属性既是控件作为 ASPX 页面一部分呈现时的标记（如下代码段所示），也是服务器端组件上的属性，可以在后置代码可用：\n\
  \n```\n<asp:Button PostBackUrl=\"url\" . . .>\n```\n\n当点击设置了 `PostBackUrl` 属性的按钮控件时，页面不会回传到自身；而是将页面提交到分配给按钮控件\
  \ `PostBackUrl` 属性的 URL。当发生跨页面请求时，当前 `Page` 类的 `PreviousPage` 属性持有指向引起回传页面的引用。要从\
  \ `PreviousPage` 获取控件引用，请使用 `Controls` 属性，或使用 `FindControl()` 方法（需要强制转换），或 `@PreviousPageType`\
  \ 属性。\n\n创建一个新页面（如 列表 21-9.aspx。然后创建一个 `Listing 21-10`.aspx 页面，包含单个 `Label` 并通过双击\
  \ HTML 设计器添加 `Page_Load` 程序。Listing 21-10 随后包含接收和处理回传的代码。\n\n在 Listing 21-9 中，页面向前回传到\
  \ Listing 21-10，该页面可以访问 `Page.PreviousPage` 属性并检索引起回传的填充 `Page` 实例。调用 `FindControl`\
  \ 并进行强制转换可以从上页获取 `TextBox` 并将其值复制到 Listing 21-10 的标签中。\n\n## 隐藏字段（HIDDEN FIELDS）、ViewState\
  \ 和控件状态（CONTROLSTATE）\n\n如 `<input type=\"hidden\" name=\"myName\" />` 之类的隐藏输入字段以名称/值对的形式\
  \ `POST` 回，就像其他控件一样，只是它们不会被渲染。将它们视为隐藏的文本框即可。图 21-9 显示了 Visual Studio 设计器中的 `HiddenField`\
  \ 控件及其可用属性。隐藏字段在所有 ASP.NET 版本中可用。\n\n![image](img/f817-01.jpg)\n\n**图 21-9**\n\n\
  另一方面，ViewState 将自身暴露为键/值对的集合，类似于 Session 对象，但它渲染为如下隐藏字段：\n\n```\n<input type=\"\
  hidden\" name=\"__VIEWSTATE\" value=\"/AAASSDAS . . . Y/lOI=\" />\n```\n\n放入 ViewState\
  \ 的任何对象必须标记为 `Serializable`。ViewState 使用名为 LosFormatter 的特殊二进制格式化程序序列化对象。LOS 代表有限对象序列。它可以序列化任何对象，但对字符串、数组哈表进行了优化。\n\
  \n为了查看其效果，创建一个新页面并将 `TextBox、Button` 和 `HiddenField` 拖到其上。双击设计器创建 `Page_Load` 并包含\
  \ 列表 21-11 中的代码。此示例将字符串添加到 `HiddenField.Value`，但将 `Person` 实例添加到 `ViewState` 集合中。该列表说明了虽然\
  \ ViewState 持化在客户端的 HTML `TextBox` 中，但它可以包含像字符串这样的简单类型，也可以包含像 `Person` 这样的复杂类型。这种技术从\
  \ ASP .NET 1.x 一直存在，并且是在不利用服务器资源的情况下持久化微小数据的一种强大且简单的方法。\n\n\n\n\n\n```html\n <form\
  \ method=\"post\" action=\"Listing 21-11.aspx\" id=\"form1\">\n  <div>>\n  <input\
  \ type=\"hidden\" name=\"__VIEWSTATE\" id=\"__VIEWSTATE\" value=\"U77CNOTJ/2LWlBwWh4u\n\
  \  hvq+FGDtavwu+NmR3cqXa9patotBdiioisxrbCrqe3FQqBk/rvwgCnNC2VzdUcXN+bUx3+M0wZ1oqAMCTRvZ\n\
  \  QqnYyc/KG+YoMTo+4httTnyCfNKYBzDwZtQQhLCOJUzRPlduaS/YYFgze3t+ORW6fnRZ/ai8Pfn4LPS+ejoV\n\
  \  woY71mkCO2iIHLzWjU0g7lsemPJpjVl1KN+asG8IF2rb5vvGP6RPckWZ1P6e0EMWlWKZcZaaJ9j0toeEcCYZ\n\
  \  SU/GwGvab1SPUSV39onQ3a+UzEG0dzmg6jqaW/tQUahBkudZpZ7dbirUqaul642Q3FIjkadibrS9zUQn/KAP\n\
  \  898X+lQvvYgL0IOwpf1G5Jk6Xe6++\" />\n  </div>\n      <div>\n          <input name=\"\
  TextBox1\" type=\"text\" id=\"TextBox1\" />\n          <input type=\"submit\" name=\"\
  Button1\" value=\"Button\" id=\"Button1\" />\n          <input type=\"hidden\" name=\"\
  HiddenField1\" id=\"HiddenField1\" value=\"foo\" />\n      </div>\n  </form>\n```\n\
  \n注意，`ViewState` 值仅使用有效的 ASCII 字符来表示其所有内容。不要被其庞大的体积误导。它看起来很大，而且似乎是不透明的。然而，它只是一个隐藏的文本框，并且会被\
  \ `POST` 回到服务器。整个 `ViewState` 集合你可以在 `Page_Load` 中访问。`HiddenField` 的值以明文形式存储。\n\n\
  `ViewState` 或隐藏字段都不适用于任何类型的敏感数据。\n\n默认情况下，`ViewState` 字段发送到客户端时带有一个`加盐哈希`（salted\
  \ hash），以防止篡改。加盐（Salting）意味着在对 `ViewState` 数据进行编码之前，附加一个唯一的值。正如 Keith Brown 所说，“盐（Salt）只是好汤中的一种成分。”所使用的技术被称为\
  \ `HMAC`，即哈希消息认证码。如下代码所示，你可以使用 `web.config` 文件中的 `<machineKey>` 元素来指定 `validationKey`\
  \ 以及保护 `ViewState` 使用的算法。该文件的此部分以及 `decryptionKey` 属性影响表单认证 cookie 的加密方式（更多表单认证请参见第\
  \ 20 章）。\n\n```xml\n <machineKey validationKey=\"AutoGenerate,IsolateApps\"\n  decryptionKey=\"\
  AutoGenerate,IsolateApps\" validation=\"SHA1\" / >\n```\n\n如果你在 Web Farm 中运行应用程序，`<validationKey>`\
  \ 和 `<decryptionKey>` 必须手动设置为相同的值。否则，从一台机器生成的 `ViewState` 可能会被 `POST` 回集群中具有不同密钥的机器！密钥应该是\
  \ 128 个字符（最大长度）并通过随机手段生成。如果你在这些值中添加 `IsolateApps`，ASP.NET 将使用每个应用程序的应用程序 ID 为每个应用程序生成唯一的加密密钥。\n\
  \n`validation` 属性可以设置为 `SHA1` 或 `MD5` 以提供防篡改保护，但你也可以通过加密 `ViewState` 来包含额外的保护。ASP.NET\
  \ 提供了一个解密属性，专门用于指定表单认证票的加密和解密机制；`validation` 属性专门用于 `ViewState`，现在可以使用存储在 `validationKey`\
  \ 属性中的密钥使用 `3DES` 或 `AES` 对其进行加密。\n\n在 ASP.NET 4.*x 中，你还可以向 `<pages>` 配置元素添加 `ViewStateEncryptionMode`\
  \ 属性，其有两个可能的值：`Auto` 或 `Always`。将属性设置为 `Always` 会强制对 `ViewState` 进行加密，而设置为 `Auto`\
  \ 则仅当某个控件使用 `Page.RegisterRequiresViewStateEncryption` 方法请求加密时才对 `ViewState` 进行加密。\n\
  \n通过在 `Page_Init` 中将 `Page.ViewStateUserKey` 设置为唯一值（例如 ID），可以对 `ViewState` 应用额外的保护。这必须在\
  \ `Page_Init` 中设置，因为密钥应该在 `ViewState` 加载或生成之前提供给 ASP.NET。例如：\n\n```csharp\n protected\
  \ void Page_Init (Object sender, EventArgs e)\n  {\n      if (User.Identity.IsAuthenticated)\
  \ {\n          ViewStateUserKey = User.Identity.Name;\n      }\n  }\n```\n\n在优化页面时，当额外的状态并非绝对必要时，ASP.NET\
  \ 程序员通常会禁用许多控件的 `ViewState`。为了让需要状态信息的控件仍然能够工作，ASP.NET 包含了第二个并行的、类似于 ViewState 的集合，称为\
  \ `ControlState`。此字典可以用于往返大小有限的关键信息，这些信息即使在 `ViewState` 被禁用的也不应被禁用。你应该在 `ControlState`\
  \ 集合中存储对控件功能至关重要的数据。\n\n请注意，`ViewState` 以及 `ControlState` 虽然不安全，但都是存储数据的好地方。\n\n\
  ## 使用 HttpContext 进行短期存储\n\n`Items` 集合存储对象，就像本章中使用的许多集合一样。在检索这些对象时，你需要将它们转换为特定类型。在\
  \ Web 数据库访问层中，可以使用此处所示的简单模式实现请求级缓存。注意，示例代码是一个设计模式，并没有 `MyData` 类；它仅用于说明。\n\n###\
  \ VB\n\n```vb\n Public Shared Function GetData(ID As Integer) As MyData\n    Dim\
  \ key as string = \"data\" & ID.ToString()\n    Dim d as MyData = _\n        CType(HttpContext.Current.Items(key),\
  \ MyData)\n    If d Is Nothing Then\n      d = New Data()\n     '访问数据库，执行任何操作 .\
  \ .\n      HttpContext.Current.Items(key) = d\n    End If\n    Return d\n  End Function\n\
  ```\n\n### C#\n\n```csharp\npublic static MyData GetData(int ID)\n  {\n    string\
  \ key = \"data\" + ID.ToString();\n    MyData d = (MyData) HttpContext.Current.Items[key];\n\
  \    if (d == null)\n    {\n      d = new Data();\n      //访问数据库，执行任何操作 . .\n  \
  \    HttpContext.Current.Items[key] = d;\n    }\n    return d;\n  }\n```\n\n此代码检查当前\
  \ `HttpContext` 的 `Items` 集合以查看数据是否存在。如果不存在，则从适当的存储中检索数据并存储在 `Items` 集合中。在同一个 `HttpRequest`\
  \ 中对此函数的后续调用将接收已缓存的对象。\n\n\n\n\n本章探讨了在 ASP.NET 中管理状态的多种方法。`Session` 对象及其提供程序提供了许多选择。每种方法在对象引用和序列化对象的形式管理状态方面都有其优缺点，且这种方式对应用程序来说很大程度上是透明的。服务器端会话状态数据可以将其唯一标识键存储在\
  \ Cookie 中，也可以将键随 URL 传递。Cookie 也可以独立使用来存储少量数据并在访问之间保持持久化，尽管数据量要小得多且类型也更简单。隐藏字段（Hidden\
  \ fields）、`ViewState`、`ControlState`、回传（postbacks）以及跨页面的回传（cross-page postbacks）为多页用户体验中的少量状态管理提供了可能。`HttpContext.Current.Items`提供了存储瞬态状态的完美位置，其生命周期仅限于单个\
  \ `HttpRequest`。`QueryStrings` 是用于存储适用于导航的非私有状态的老旧方案。\n\nASP.NET 的后续版本通过灵活的 Session\
  \ State Provider（会话状态提供程序）模块、为用户控件添加 `ControlState`，以及用于更成熟编程模型的跨页面回传，改进了 ASP.NET\
  \ `1.*x` 的状态管理选项。\n\n# 22 缓存\n\n## 本章内容包含？\n\n- 处理 ASP.NET 中的缓存\n- 以程序化方式处理缓存\n\
  - 理解 SQL 缓存依赖项\n- 使用和测试 SQL 缓存失效\n\n### 本章的 WROX.COM 代码下载\n\n请注意，本章中的所有代码示例均作为本章代码下载的一部分，可以在书籍网站的[`www.wrox.com`](http://www.wrox.com)\
  \ 上的“Download Code”（下载代码）选项卡中找到。\n\n性能是你所开发的任何应用程序或代码的关键需求。浏览器有助于文本和图像的客户端缓存，而你选择实现的服务器端缓存对于创建最佳性能至关重要。*缓存*是在服务器上存储频繁使用单元的数据以满足后续请求的过程。你将发现，从内存中获取对象比在每次被请求时都从头开始创建网页或其中包含的项目要快得多。缓存可以提高应用程序的性能、可扩展性和可用性。你对应用程序缓存方法的调优越细，它的性能就越好。\n\
  \n本章重点关注缓存，包括 ASP.NET 提供的 SQL 缓存失效功能。本章详细审视了缓存的这一独特方面。当你使用 SQL 缓存失效时，如果 SQL Server\
  \ 的结果集发生变化，输出缓存可以触发自动更改。这确保了最终用户始终看到最新的结果集，呈现的数据绝不会过时。在引入 SQL 缓存失效后，本章还涵盖了其他性能增强方案。它讨论了缓存后替换（post-cache\
  \ substitution）功能，该功能在缓存整个页的同时动态替换特定的内容。最后，本章涵盖了允许开发者创建自定义依赖项的能力。\n\n## 缓存\n\n你有几种方法处理\
  \ ASP.NET 中的缓存，其中一种是使用名为输出缓存（output caching）的机制缓存整个 HTTP （整个网页）。另外两种方法是部分页面缓存和数据缓存。接下来的章节将描述这些方法。\n\
  \n### 输出缓存\n\n*输出缓存*是一种将动态生成的页面内容保留在服务器内存或磁盘中以备日后检索的方法。这种缓存保存了渲染后的内容，因此在下次被请求时无需重新生成。页面被缓存后，当向服务器发出任何后续请求时，就可以再次提供。你通过在\
  \ `.aspx` 页面的顶部插入 `OutputCache` 页面指令来应用输出缓存，如下：\n\n```\n <%@ OutputCache Duration=\"\
  60\" VaryByParam=\"None\" %>\n```\n\n`Duration` 属性定义了页面在缓存中存储的秒数。`VaryByParam` 属性决定了实际缓存哪些页面输出。你可以根据需要\
  \ HTTP-POST 或 HTTP-GET 响应生成不同的响应。除了 `OutputCache` 指令的属性外，ASP.NET 还包含了 `VaryByHeader`、`VaryByCustom`、`VaryByControl`\
  \ 和 `Location` 属性。此外，`Shared` 属性可能会影响用户控件，正如你稍后看到的。\n\nASP.NET 中的缓存实现为一个 `HttpModule`，它监听所有通过\
  \ ASP.NET 工作进程的 `HttpRequest`。`OutputCacheModule` 监听应用程序的 `ResolveRequestCache`\
  \ 和 `UpdateRequestCache` 事件，处理缓存命中和缺失，并返回缓存的 HTML，在必要时跳过页面处理程序。\n\n#### VaryByParam\n\
  \n`VaryByParam` 属性可以指定哪些 `QueryString` 参数会导致缓存新版本的页面：\n\n```\n <%@ OutputCache Duration=\"\
  90\" VaryByParam=\"pageId;subPageId\" %>\n```\n\n例如，如果你有一个名为 `navigation.aspx` 的页面，它在\
  \ `QueryString` 中包含导航信息（如 `pageId` 和 `subPageId`），此处所示 `OutputCache` 指令会为 `pageId`\
  \ 和 `subPageId` 的每个不同值缓存该页面。在这个示例中，页面数量用等式表示最好：\n\n```\ncacheItems = (num of pageIds)\
  \ * (num of subPageIds)\n```\n\n其中，`cacheItems` 是 `pageIds` 的数量乘以 `subPageIds` 的数量。`cacheItems`\
  \ 是存储在缓存中的渲染 HTML 页面数量。页面只有在通过 `OutputCacheModule` 后才被缓存。虽然这些只是*潜在*的最大值，但创建一个代表系统潜在最大值的等式是有重要的。\n\
  \n如果你想根据 `QueryString` 参数的差异缓存新版本的页面，请使用 `VaryByParam=\"*\"`，如下：\n\n```\n<%@ OutputCache\
  \ Duration=\"90\" VaryByParam=\"*\"\n```\n\n在使用 `VaryBy` 属性时，“计算”是非常重要的。例如，你可以添加\
  \ `VaryByHeader` 并根据浏览器报告的 `User-Agent` 头部缓存不同版本的页面。\n\n```\n<%@ OutputCache Duration=\"\
  90\" VaryByParam=\"*\" VaryByHeader=\"User-Agent\"%>\n```\n\n`User-Agent` 识别用户的浏览器类型。ASP.NET\
  \ 可以自动生成针对特定浏览器的渲染，因此在许多情况下，在缓存中保存这些渲染是有意义的。Firefox 用户的 HTML 可能与 IE 用户不同，因此你不想向所有用户发送相同的渲染后\
  \ HTML。现实中存在几十甚至上百种 `User-Agent` 字符串，因为它们识别的不只是浏览器类型；取决于服务器负载，此 `OutputCache` 指令可能会产生数千个缓存版本。在这种情况下，你应该衡量缓存成本与动态创建页面的成本。\n\
  \n#### VaryByControl\n\n`VaryByControl` 是一种非常简单的方法，从渲染大量不经常变化 HTML 的复杂用户控件中获得巨大的性能提升。例如，想象有一个显示所有国家名称的用户控件。可能这些名称是从数据库检索并渲染在组合框中的，如下所示：\n\
  \n```\n<%@ OutputCache Duration=\"2592000\" VaryByControl=\"comboBoxOfCountries\"\
  \ %>\n```\n\n显然，国家名称不会那么频繁变化，因此 `Duration` 可能被设置为一个月（秒）。UserControl 的渲染输出被缓存，允许使用该控件的页面从缓存控件中获得性能益处，同时页面本身保持动态。\n\
  \n\n\n\n虽然 `VaryBy` 属性提供了强大的功能，但有时你需要更多的灵活性。如果你想参考之前的导航示例中的 `OutputCache` 指令并根据存储在\
  \ cookie 中的值进行缓存，可以添加 `VaryByCustom`。`VaryByCustom` 的值将传递给 `GetVaryByCustomString`\
  \ 方法，该方法可以添加到 `Global.asax.cs` 中。此方法在每次请求页面时都会被调用，返回一个值是函数的职责。\n\n对于每个返回的唯一值，都会缓存一个不同版本的页面。例如，假设你的用户有一个名为\
  \ `Language` 的 cookie，它有三个可能的值：`en`、`es` 和 `fr`。你希望用户指定他们的首选语言，无论浏览器报告的语言如何。`Language`\
  \ 还有第四个可能的值——它可能不存在！因此，在示例中的 `OutputCache` 指令缓存了页面的多个版本，如下公式所示：\n\n```\ncacheItems\
  \ = (pageId 的数量) * (subPageId 的数量) * (4 个可能的 Language 值)\n```\n\n总结一下，假设 `pageId`\
  \ 有十个可能的值，每个 `pageId` 有五个可能的 `subPageId` 值，`Language` 有四个可能的值。这对于这一个导航页面总共产生了 200\
  \ 个不同的潜在缓存版本。这个数学结果并不是为了吓跑你不去缓存，但你应该意识到，能力越大（缓存能力越大），责任也越大。\n\n以下 `OutputCache`\
  \ 指令将 `pageId` 和 `subPageId` 作为 `VaryByParam` 的值，并且 `VaryByCustom` 将 `\"prefs\"\
  ` 的值传递给 Listing 22-1 中的回调函数 `GetVaryByCustomString`：\n\n```\n<%@ OutputCache Duration=\"\
  90\" VaryByParam=\"pageId;subPageId\" VaryByCustom=\"prefs\"%>\n\n缓存涉及到 CPU 和内存之间的权衡：生成此页面有多困难，相对于你是否能负担得起它的\
  \ 200 个版本。如果它只有 5KB 的 HTML，那么花费几兆字节的内存相对于成千上万次的数据库访问可能会获得丰厚的回报。由于大多数页面在页面生命周期内至少会访问一次数据库，从缓存中提供的每个页面请求都为您节省了一次数据库访问。如果需要的数据库服务器和许可证减少，高效利用缓存可以转化为成本节省。\n\
  \nListing 22-1 中的代码（代码文件 `Global.asax`）返回存储在 `Language` cookie 中的值。`GetVaryByCustomString`\
  \ 方法的 `arg` 参数包含字符串 `\"prefs\"`，如 `VaryByCustom` 中指定的所示。\n\nListing 22-1 中的 `GetVaryByCustomString`\
  \ 方法由 `Global.asax` 中的 `HttpApplication` 使用，并将在每个使用 `VaryByCustom OutputCache` 指令的页面调用。如果你的应用程序有许多使用\
  \ `VaryByCustom` 的页面，你可以创建一个 `switch` 语句和系列辅助函数，从用户的 `HttpContext` 中检索任何你想要的信息并为缓存键生成唯一值。\n\
  \n### 扩展 `<outputCache>`\n\n从 ASP.NET 4 发布开始，你可以扩展 `OutputCache` 指令的工作方式，使其根据你自定义的缓存方式运行。这意味着你可以将\
  \ `OutputCache` 指令连接到任何类型的缓存机制，包括分布式缓存、云缓存、磁盘、XML 或任何你能够想象到的东西。\n\n为了实现这一点，你需要创建一个类作为自定义输出缓存提供程序（provider），并且该类需要继承自新的\
  \ `System.Web.Caching.OutputCacheProvider` 类。要继承 `OutputCacheProvider`，你必须重写 `Add()`、`Get()`、`Remove()`\
  \ 和 `Set()` 方法以实现你自定义版本的输出缓存。\n\n在你准备好自定义实现后，下一步是在配置文件中对其进行配置：`machine.config` 或\
  \ `web.config` 文件。配置文件中的 `<outputCache>` 元素已进行更改，以允许你应用自定义的缓存扩展。\n\n`<outputCache>`\
  \ 元素位于配置文件的 `<caching>` 部分中，它现在包含了一个新的 `<providers>` 子元素。\n\n```\n <caching>\n \
  \   <outputCache>\n        <providers>\n        </providers>\n    </outputCache>\n\
  \  </caching>\n```\n\n在新的 `<providers>` 子元素中，你可以嵌套一个 `<add>` 元素，对你通过派生 `OutputCacheProvider`\
  \ 类构建的新输出缓存能力进行适当引用。\n\n```\n <caching>\n    <outputCache defaultProvider=\"AspNetInternalProvider\"\
  >\n        <providers>\n           <add name=\"myDistributedCacheExtension\"\n \
  \           type=\"Wrox.OutputCacheExtension.DistributedCacheProvider,\n       \
  \             DistributedCacheProvider\" />\n        </providers>\n    </outputCache>\n\
  \  </caching>\n```\n\n有了这个新的 `<add>` 元素，你新的扩展输出缓存就可以使用了。这里还需要注意的一个新点是 `<outputCache>`\
  \ 元素中的新 `defaultProvider` 属性。在这种情况下，它设置为 `AspNetInternalProvider`，这是配置文件中的默认设置。这意味着默认情况下，输出缓存像一直以来那样工作，并将缓存存储在运行程序的计算机的内存中。\n\
  \n有了你自己的输出缓存提供程序，你现在可以通过页面上定义的 `OutputCache` 指令指向它：\n\n```\n<%@ OutputCache Duration=\"\
  90\" VaryByParam=\"*\" \n      providerName=\"myDistributedCacheExtension\" %>\n\
  ```\n\n如果没有定义提供程序名称，则将使用配置 `defaultProvider` 属性中定义的提供程序。\n\n### 部分页面（用户控件）缓存\n\n\
  与输出缓存类似，部分页面缓存（也称为甜甜圈缓存 donut caching）允许你只缓存 Web 页面的特定块。例如，你可以只缓存页面的中心部分。部分页面缓存通过用户控件的缓存来实现，因此你可以构建\
  \ ASP.NET 页面以使用许多用户控件，然后对选定的用户控件应用输出缓存。这本质上只缓存了你想要的页面部分，而让页面的其他部分留在缓存范围之外。此功能非常好，而且如果处理得当，可以带来性能更好的页面。这需要预先规划模块化设计，以便你可以将页面组件划分为由用户控件组成的逻辑单元。\n\
  \n通常，用户控件被设计为放置在多个页面上，以最大化地重用常用功能。然而，当这些用户控件（`.ascx` 文件）使用 `@OutputCache` 指令的默认属性进行缓存时，它们是按页面进行缓存的。这意味着即使一个用户控件在\
  \ `pageA.aspx` 上输出的 HTML 与在 `pageB.aspx` 上输出的相同，它的输出也会缓存两次。通过启用 `Shared=\"true\"\
  ` 属性，用户控件的输出可以在多个页面之间共享，并在大量使用共享用户控件的站点中使用：\n\n```\n<%@ OutputCache Duration=\"\
  300\" VaryByParam=\"*\" Shared=\"true\"%>\n```\n\n由于你只缓存一个渲染后的用户控件副本，而不是为每个页面缓存一个副本，产生的内存节省可能会惊人地大。与所有优化方案一样，你都需要对输出的正确性以及内存使用进行测试。\n\
  \n在 ASPX 页面中，任何要求用户控件始终可用的代码，如果该控件是从 `OutputCache` 重构的，都将失败。因此，在运行任何控件之前，务必始终检查此类缓存。以下代码片段说明了访问可能缓存的用户控件时所需的逻辑：\n\
  \n***VB***\n\n\n\n\n\n```vb\n Protected Sub Page_Load()\n      If Not PossiblyCachedUserControl\
  \ is Nothing Then\n         ' Place code manipulating PossiblyCachedUserControl\
  \ here.\n      End If\n  End Sub \n```\n\n### C#\n\n```csharp\n protected void Page_Load()\n\
  \  {\n      if (PossiblyCachedUserControl != null)\n      {\n         // Place code\
  \ manipulating PossiblyCachedUserControl here.\n      }\n  }\n```\n\n### 缓存后替换 (Post-Cache\
  \ Substitution)\n\n输出缓存通常是一个“全或无”的方案。整个页面的输出被缓存以供以后使用。然而，你通常希望获得输出缓存的好处，同时也希望在页面上保留一部分动态内容。如果缓存了一个页面却无法输出动态的“欢迎，Scott！”，那将太遗憾了。\n\
  \n从 ASP.NET 2.0 开始，就存在一种方法，可以利用“缓存后替换”作为机会来影响即将渲染的页面。页面上添加一个作为占位符的控件。它在缓存内容返回后调用由你指定的方法。该方法可以返回任何你喜欢的字符串输出，但你应该小心不要滥用该功能。如果你的缓存后替换代码调用了开销巨大的存储过程，你可能会很容易失去原本预期的任何性能收益。\n\
  \n缓存后替换是一个易于使用的功能。它为你提供了两种控制替换的方法：\n\n*   调用 `Response.WriteSubstitution` 方法，并向其传递所需的替换方法回调的引用。\n\
  *   在页面的所需位置添加 `<asp:Substitution>` 控件，并将其 `methodName` 属性设置为回调方法的名称。\n\n要要尝试此功能，请创建一个带有\
  \ `Default.aspx` 页面的新网站。在设计表面上拖入一个标签（label）控件和一个替换控件。代码列表 22-2 中的代码会更新标签以显示当前时间，但页面会立即被缓存，随后的请求将返回该缓存值。将替换控件中的\
  \ `methodName` 属性设置为 `GetUpdatedTime`，这意味着在从缓存中检索页面后将调用的静态方法名称。\n\n回调函数必须是静态的（static），因为在此时渲染的页面并不真实存在（不存在其实例）。由于你没有页面实例可以操作，该方法的范围受到限制。然而，当前的\
  \ `HttpContext` 会传递给该方法，因此你可以访问 `Session`、`Request` 和 `Response`。从此方法返回的字符串将注入到\
  \ `Response` 中代替替换控件。\n\n代码列表 22-2 中的 ASPX 页面包含一个标签和一个缓存后替换控件。该控件在你希望从缓存返回页面后注入新内容的位置作为占位符。第一次访问页面时，只有标签会更新，因为没有返回缓存内容。然而，第二次访问页面时，整个页面都从缓存中被检索——页面处理器不会被调用，因此，任何页面级事件都不会触发。但是，在缓存模块完成工作后，会调用\
  \ `GetUpdatedTime` 方法。图 22-1 显示了如果第一行被缓存而第二行动态创建的结果。\n\n![image](img/f830-01.jpg)\n\
  \n**图 22-1**\n\n### HttpCachePolicy 与客户端缓存\n\n缓存不仅仅是在服务器端的内存中持有数据。一个良好的缓存策略还应该包括浏览器及其客户端缓存，这些由\
  \ `Cache-Control` HTTP 头部控制。HTTP 头部是给浏览器关于如何处理请求的提示和指令。\n\n有些人建议使用 HTML `<meta>`\
  \ 标签来控制缓存行为。请注意，浏览器或路径上的路由器并没有义务关注这些指令。使用 HTTP 头部来控制缓存可能会更有成功。\n\n由于 HTTP 头部传输在\
  \ HTTP 消息的正文之外，因此你有几种方法可以查看它们。你可以启用跟踪（参见第 29 章）并从跟踪输出中查看头部。你还可以使用额外的软件，例如浏览器的 Web\
  \ 插件（通常通过 F12 激活），或来自 [getfirebug.com](http://getfirebug.com) 流行的 Firefox 扩展 Firebug。\n\
  \n要设置缓存，创建一个在 `Load` 事件中写入当前时间的文件。现在，查看 ASP.NET 使用的默认 HTTP 头部。注意，其中一个头部 `Cache-Control:\
  \ private` 向路由器和其他中间设备指示此响应仅供你（私有）使用。\n\n`HttpCachePolicy` 类提供了一个管理客户端状态的对象模型，使你免于自己手动添加\
  \ HTTP 头部。将代码列表 22-3 中的行添加到你的 `Page_Load` 中，以影响响应的头部和浏览器的缓存行为。此列表告诉浏览器不要在内存中缓存此响应，也不要存储在磁盘上。它指示响应立即过期。\n\
  \n比较在添加代码列表 22-3 中的代码之前（图 22-3 的上半部分）和添加代码之后（图 22-3 的下半部分）运行页的结果。注入了两个新的 HTTP 头部引导客户端\
  \ `no-cache, no-store`。输出缓存 `HttpModule` 将遵循这些头部，因此向浏览器发送 `no-cache, no-store` 也会建议\
  \ `HttpModule` 将响应记录为缓存未。图 22-3 显示了差异。\n\n![image](img/832-01.jpg)\n\n**图 22-3**\n\
  \n如果你的 ASP.NET 包含大量相对静态或时间敏感的页面，请考虑你的客户端缓存策略。利用用户强大的客户端机器的磁盘空间和内存比负担服务器有限的资源要好。\n\
  \n## 通过程序实现缓存\n\n输出缓存是一种非常声明式的业务。UserControls 和页面可以使用 `OutputCache` 指令进行标记，并极大地改变你网站的行为。声明式缓存控制\
  \ HTML 标记的生命周期，但 ASP.NET 也包含了对缓存的深度命令式支持。\n\n### 使用 Cache 对象进行数据缓存\n\n另一种缓存方法是使用\
  \ `System.Web.Caching.Cache` 对象开始缓存特定的数据项，以供特定页面或页面组以后使用。`Cache` 对象允许你存储从简单的键/值对到更复杂的对象（例如数据集和整个\
  \ `.aspx` 页面）。\n\n你通过以下方式使用 `Cache` 对象：\n\n```vb\n Cache(\"WhatINeedToStore\") =\
  \ myDataSet\n```\n\n```csharp\n Cache[\"WhatINeedToStore\"] = myDataSet;\n```\n\n\
  在进入缓存后，你可以如下所示检索它：\n\n```vb\n Dim ds As New DataSet\nds = CType(Cache(\"WhatINeedToStore\"\
  ), DataSet)\n```\n\n```csharp\n DataSet ds = new DataSet();\n  ds = (DataSet)Cache[\"\
  WhatINeedToStore\"];\n```\n\n使用 `Cache` 对象是缓存页面的极佳方式，实际上它正是 `OutputCache` 指令在底层使用的机制。这个小片段展示了\
  \ `Cache` 对象最简单的用法。只需将一个对象引用放入其中。然而，`Cache` 对象的真正威力在于其自动失效的能力。这就是缓存依赖出现的地方。\n\n\
  ### 控制 ASP.NET 缓存\n\n\n\n\n通常情况下，ASP.NET 为缓存子系统设置的默认参数适用于一般用途。然而，你可以在 `machine.config`\
  \ 或 `web.config` 文件对其进行配置。这些选项允许你进行更改，例如在系统内存内存压力时防止缓存项目过期，或者完全关闭项目过期功能。你可以在缓存开始刷新项目之前设置应用程序私有字节（private\
  \ bytes）的最大值：\n\n```xml\n <system.web>\n    <cache disableMemoryCollection=\"false\"\
  \n    disableExpiration=\"false\" privateBytesLimit=\"0\"\n    percentagePhysicalMemoryUsedLimit=\"\
  90\"\n    privateBytesPollTime=\"00:02:00\" />\n  . . .snip. . .\n```\n\n## 缓存依赖项\n\
  \n使用 `Cache` 对象，你可以根据几种不同的依赖项在缓存中存储和失效项目。在早期的 ASP.NET 1.0/1.1 中，唯一可能的依赖项是以下几种：\n\
  \n* 基于文件的依赖\n* 基于键的依赖\n* 基于时间的依赖\n\n当使用 `Cache` 对象向缓存插入项目时，你通过 `Insert` 方法设置依赖项，如下例所示：\n\
  \n```cs\n Cache.Insert(\"DSN\", connectionString,\n     New CacheDependency(Server.MapPath(\"\
  ~/myconfig.xml\")))\n```\n\n当所引的项目发生变化时，通过使用 `dependency`，你可以从内存中移除该项目的缓存。\n\n自\
  \ ASP.NET 2.0 以来，缓存依赖项得到了改进，增加了 `AggregateCacheDependency` 类、可扩展的 `CacheDependency`\
  \ 类以及创建自定义 `CacheDependency` 类的能力。这三点内容将在接下来的章节中进行讨论。\n\n### AggregateCacheDependency\
  \ 类\n\n`AggregateCacheDependency` 类类似于 `CacheDependency` 类，但它允许你创建一个关联，将缓存中的一个项目与许多不同类型的离散依赖项连接起来。例如，如果你有一个从文件\
  \ XML 构建的缓存数据项，并且有来自 SQL 数据库表的信息，你可以创建一个 `AggregateCacheDependency`，并为每个子依赖项插入 `CacheDependency`\
  \ 对象。要实现这一点，你需要调用 `Cache.Insert()` 并添加 `AggregateCacheDependency` 实例。例如：\n\n```cs\n\
  \ var agg = new AggregateCacheDependency();\n  agg.Insert(new CacheDependency(Server.MapPath(\"\
  ~/myconfig.xml\")));\n  agg.Insert(new SqlCacheDependency(\"Northwind\", \"Customers\"\
  ));\n  Cache.Insert(\"DSN\", connectionString, agg);\n```\n\n注意，`AggregateCacheDependency`\
  \ 旨在与不同类型的 `CacheDependency` 类一起使用。如果你只想将一个缓存项目与多个文件关联，请使用 `CacheDependency` 的重载，如此示例所示：\n\
  \n**VB**\n\n```vb\n Cache.Insert(\"DSN\", yourObject, _\n      New System.Web.Caching.CacheDependency(\
  \ _\n          New String() _\n         { _\n           Server.MapPath(\"~/file1.xml\"\
  ), _\n           Server.MapPath(\"~/file2.xml\") _\n         } _\n      ) _\n  )\n\
  ```\n\n**C#**\n\n```cs\n Cache.Insert(\"DSN\", yourObject,\n      new System.Web.Caching.CacheDependency(\n\
  \          new string[]\n          {\n              Server.MapPath(\"~/file1.xml\"\
  ),\n              Server.MapPath(\"~/file2.xml\")\n          }\n      )\n  );\n\
  ```\n\n`AggregateCacheDependency` 类的实现得于对之前密封（sealed）的 `CacheDependency` 类的扩展支持。你可以利用这一创新来创建自己的自定义\
  \ `CacheDependency`。\n\n#### 未密封的 CacheDependency 类\n\n自 ASP.NET 2.0 发布以来，缓存领域的一个重大变化是\
  \ `CacheDependency` 类被重构并取消密封（或变为可重写）。这允许你创建继承自 `CacheDependency` 类的类，并创建更复杂的依赖项，不再限于\
  \ `Time`、`Key` 或 `File` 依赖。\n\n当你创建自己的缓存依赖项时，你可以选择添加针对 Web 服务数据、仅午夜依赖或文件内文本字符串更改的程序。你创建的依赖项仅限于你的想象。`CacheDependency`\
  \ 类的取消密封让你能够主导局面，决定缓存项目何时需要失效。\n\n在取消密封 `CacheDependency` 类的同时，ASP.NET 团队还构建了一个\
  \ SQL Server 缓存依赖项——`SqlCacheDependency`。当底层 SQL Server 中的表发生变化导致缓存失效时，你现在可以在 ASP.NET\
  \ 应用程序中立即获此通知。\n\n由于 `CacheDependency` 是未密封的，你可以派生自己的自定义缓存依赖项；这就是下一节中要做的。\n\n###\
  \ 创建自定义缓存依赖项\n\nASP.NET 支持基于时间、基于文件和基于 SQL 的 `CacheDependency`。你可能会问自己为什么要编写自己的\
  \ `CacheDependency`。这里有一些想法：\n\n* 根据活动目录查找查询的结果使缓存失效。\n* 在 MSMQ 或 MQSeries 消息到达时使缓存失效。\n\
  * 创建特定 Oracle 的 `CacheDependency`。\n* 使用来自 XML Web 服务报告的数据使缓存失效。\n* 使用来自股票价格服务的新数据更新缓存。\n\
  \n`CacheDependency` 类暴露了三个成员和一个构造函数重载，开发者可以使用它们完成这些工作：\n\n* `GetUniqueID`：重写时，允许你向调用者返回自定义缓存依赖项的唯一标识。\n\
  * `DependencyDispose`：用于释放缓存依赖项使用的资源。\n* `NotifyChanged`：调用以通知缓存子系统依赖项已更改。\n* `CacheDependency`\
  \ 公有构造函数。\n\n[列表 22-4] 中的 `CacheDependency` 类（代码文件 `RssDependency.cs` 和 `RssDependency.vb`）创建一个新的\
  \ `RssDependency`，如果 RSS（富内容摘要）文档发生变化，将使缓存失效。要使用新代码，请打开一个新网站并将 `RssDependency` 类放在\
  \ `App_Code` 文件夹中。创建一个新文件并在页面上添加两个文本框、一个标签和一个按钮。运行网站并输入博客的 RSS URL（例如位于 [`http://sxp.microsoft.com/feeds/3.0/msdnnews/msdnnews`](http://sxp.microsoft.com/feeds/3.0/msdnnews/msdnnews)\
  \ 的 MSDN Feed），然后点击按钮。程序使用 URL 本身作为键检查 `Cache` 对象。如果缓存不存在 `XmlDocument`，则创建一个具有\
  \ 10 分（600 秒）超时时间的新 `RssDependency`。随后 `XmlDocument` 被缓存，在未来 10 分钟内对该页面的后续请求将从缓存中检索\
  \ RSS `XmlDocument`。\n\n接下来，你的 `RssDependency` 类创建一个 `Timer` 后台线程来轮询 RSS 馈的变化。如果检测到变化，`RssDependency`\
  \ 将通过 `NotifyChanged` 事件通知缓存子系统。该键的缓存值将清除，下一次页面查看将强制从指定的馈重新加载请求的 RSS。\n\n\n\n\n\
  这一更改的原因并不是为了 ASP.NET 开发者，而是为了其他应用类型，例如 Windows Forms、Windows Presentation Foundation\
  \ 等。之所以这样做是因为 `System.Web.Caching.Cache` 对象太实实了，以至于其他应用程序开发者会将 `System.Web` 命名空间引入到自己的项目中以使用该对象。因此，为了避免\
  \ Windows Forms 开发者仅为了使用其提供的 `Cache` 对象而需要将 `System.Web.dll` 引入项目，所有这些内容都被提取出来，并使用\
  \ `System.Runtime.Caching` 命名空间进行了扩展。\n\n作为 ASP.NET 开发者，你仍然可以像在以前的所有 ASP.NET 版本一样使用\
  \ `System.Web.Caching.Cache` 对象。它不会消失。但需要注意的是，随着 .NET Framework 的演进，.NET 团队将把重心投入到\
  \ `System.Runtime.Caching` 命名空间，而不是 `System.Web.Caching`。这意味着随着时间的推移，你很可能会在 `System.Runtime.Caching`\
  \ 版本中看到额外的增强，而这些增强可能像预期那样出现在 `System.Web.Caching` 命名空间中。尽管如此，这并不意味着你需要将所有内容都迁移到新的\
  \ `System.Runtime.Caching` 命名空间以确保你遵循微软的战略路线，因为这两个缓存是在底层被共同管理的。\n\n本节将介绍一个使用 `System.Runtime.Caching`\
  \ 命名空间缓存的示例。在此示例中，ASP.NET 页面简单地使用 Label 控件来显示存储在 XML 文件中的用户名。第一步是在 `App_Data` 文件夹中创建一个\
  \ XML 文件，并命名为 `Username.xml`。这个简单的文件在列表 22-6 中（代码文件 `Username.xml`）中给出。\n\n将此 XML\
  \ 文件放在驱动器根目录后，现在请关注 `Default.aspx` 代码后页，使用文件中的名称并将其显示在页面上的单个 Label 控件中。`Default.aspx`\
  \ 页面的代码后显示在列表 22-7 中。\n\n此来自列表 22-7 的示例利用了 `System.Runtime.Caching` 中的新缓存。你需要在 ASP.NET\
  \ 项目中引用此命名空间才能使其工作（参见图 22-4）。\n\n![image](img/f841-01.jpg)\n\n**图 22-4**\n\n首先，你创建一个缓存对象的默认实例：\n\
  \n```\nObjectCache cache = MemoryCache.Default;\n```\n\n然后，你就可以像处理传统的 ASP.NET 缓存对象一样处理此缓存了：\n\
  \n```\nstring usernameFromXml = cache[\"userFromXml\"] as string;\n```\n\n为了启动缓存，你需要创建一个定义你正在处理的缓存种类型的对象。你可以构建一个自定义实现，也可以使用\
  \ .NET 4.x 提供的默认实现之一：\n\n```\nCacheItemPolicy policy = new CacheItemPolicy();\n\
  policy.ChangeMonitors.Add(new HostFileChangeMonitor(userFilePath));\n```\n\n`HostFileChangeMonitor`\
  \ 是查看目录和文件路径并监控变化的手段。例如，当 XML 文件发生变化时，它会触发缓存失效。`ChangeMonitor` 对象的其他实现还包括 `FileChangeMonitor`\
  \ 和 `SqlChangeMonitor`。\n\n运行此示例，注意文本 `Christian Wenz` 在首次运行时被加载到缓存中，此文本显示在 Label1\
  \ 控件中。保持你的应用程序运行，然后你可以返回 XML 文件并更改值，随后你会注意到这会导致页面刷新时缓存失效。\n\n## 使用 SQL Server 缓存依赖项\n\
  \n要在 ASP.NET 中利用 SQL Server 缓存依赖功能，你必须对你的 SQL Server 数据库进行一次性设置。要设置你的 SQL Server，请使用\
  \ `C:\\Windows\\MicroSoft.NET\\Framework\\v4.0\\` 下的 `aspnet_regsql.exe` 工具。该工具会对\
  \ SQL Server 进行必要的修改，以便你可以开始使用 SQL 缓存失效功能。\n\n使用 SQL Server 缓存依赖功能时遵循以下步骤：\n\n1.\
  \ 启用数据库的 SQL 缓存依赖支持。\n2. 启用一个或多个表的 SQL 缓存依赖支持支持。\n3. 在 ASP.NET 应用程序的 `web.config`\
  \ 文件中包含 SQL 连接字符串详细。\n4. 通过以下方式之一利用 SQL 缓存依赖功能：\n    * 在代码中通过编程创建 `SqlCacheDependency`\
  \ 对象。\n    * 在 `OutputCache` 指令中添加 `SqlDependency` 属性。\n    * 通过 `Response.AddCacheDependency`\
  \ 向 `Response` 对象添加 `SqlCacheDependency` 实例。\n\n本节解释了所需的所有步骤以及你可以执行的操作。\n\n首先，你需要获取\
  \ `aspnet_regsql.exe` 工具。打开 Visual Studio 命令提示符，然后输入此命令：\n\n```\naspnet_regsql.exe\
  \ -?\n```\n\n此代码输出了该命令行工具的帮助命令列表，所示：\n\n```\n-- SQL CACHE DEPENDENCY OPTIONS\n\n\
  -d <database>            用于缓存依赖的数据库名称。可以可选地\n                          使用连接字符串 -c\
  \ 指定数据库。\n                          (必需)\n\n-ed                      启用缓存依赖数据库。\n\
  \n-dd                      禁用缓存依赖数据库。\n\n-et                      启用缓存依赖表。需要 -t\n\
  \                          选项。\n\n-dt                      禁用缓存依赖表。需要 -t\n     \
  \                     选项。\n\n-t <table>               要启用或禁用缓存依赖的表名称。\n\n-lt   \
  \                   列出已启用缓存依赖的表。\n```\n\n接下来的章节将向你展示如何使用这些命令。\n\n### 启用 SQL 数据库失效\n\
  \n要在 SQL 中使用 SQL 失效，从两个步骤开始。第一步是启用相应的数据库。第二步是启用你要操作的表。你必须执行这两个步骤才能使该过程生效。如果你想启用数据库失效且在\
  \ SQL 实例所在的计算机上操作，可以使用以下结构。如果你的 SQL 实例在其他计算机上，请将示例中的 `localhost` 更改为远程机器名称。\n\n\
  ```\naspnet_regsql.exe -S localhost -U username -P password -d Northwind -ed\n```\n\
  \n在本地机器上使用 Windows 身份验证使用 `SQLEXPRESS` 实例语法如下：\n\n```\naspnet_regsql.exe -S .\\\
  SQLEXPRESS -E -d Northwind -ed\n```\n\n这将产生类似的输出：\n\n```\n 正在启用缓存依赖数据库。\n\n  .\n\
  \n  完成。\n```\n\n从此命令行可以看出，你只需启用了 Northwind 数据库（SQL Server 的示例数据库）失效。SQL 机器通过 `-S`\
  \ 传递，用户名通过 `-U`，数据库通过 `-d`，最重要的是启用失效的命令是 `-ed`。\n\n### 启用 SQL 表失效\n\n现在由于你已经启用了数据库失效，就可以启用\
  \ Northwind 数据库包含的一个或多个表。你可以通过以下命令启用更多表：\n\n```\naspnet_regsql.exe -S localhost\
  \ -U username -P password -d Northwind -t Customers -et\n\naspnet_regsql.exe -S\
  \ localhost -U username -P password -d Northwind -t Products -et\n```\n\n\n\n\n\
  你可以看到，此命令与启用数据库的命令没有太大，区别在于额外的 `-t Customers` 条目，以及使用 `-et` 来启用表，而不是使用 `-ed` 来启用数据库。在这种情况下，`Customers`\
  \ 是被启用表的名称。\n\n请继续启用 `Customers` 和 `Products` 表。每个表运行一次命令。在成功启用表后，你将收到以下响应：\n\n\
  ```\n Enabling the table for SQL cache dependency.\n\n  .\n\n  Finished.\n```\n\n\
  启用表后，你就可以开始使用 SQL 缓存失效功能了。然而，在此之前，接下来的章节将向你展示当启用这些功能时 SQL Server 会发生什么。\n\n### 观察\
  \ SQL Server\n\n现在，Northwind 数据库以及 `Customers` 和 `Products` 表都已启用了 SQL 缓存失效，让我们看看\
  \ SQL Server 中发生了什么。如果你打开 SQL Server Management Studio（或其 Express 版本），你会在 Northwind\
  \ 数据库中看到一个新表——`AspNet_SqlCacheTablesForChangeNotification`（呼，这名字真长！）。你的屏幕看起来应该类似于图\
  \ 22-5。\n\n![image](img/f844-01.jpg)\n\n**图 22-5**\n\n在左侧窗格表列表顶部，你可以看到 `AspNet_SqlCacheTablesForChangeNotification`\
  \ 表。ASP.NET 使用此表来学习哪些表正在被监控更改通知，并记录对被监控表的任何更改。当你查看它的列时，这个新表其实非常简单，也如图 22-5 所示。\n\
  \n*   `tableName`: 此列仅显示指向同一数据库中包含的表名称的 `String` 引用。在此处命名的任何表都已启用 SQL 缓存失效。\n* \
  \  `notificationCreated`: 显示该表启用 SQL 缓存失效的日期和时间。\n*   `changeId`: 向 ASP.NET 通信包含的表的任何更改。ASP.NET\
  \ 监控此列的更改，并根据值的值，使用内存中存储的内容或执行新的数据库查询。\n\n### 观察已启用的表\n\n使用 `aspnet_regsql.exe`\
  \ 工具，你可以（通过使用简单的命令）查看特定数据库中启用了哪些表。如果你正在学习前面的示例，你会看到到为止你已经启用了 Northwind 数据库的 `Customers`\
  \ 和 `Products` 表。要获取启用表的列表，请使用类似于下方的命令：\n\n```\n aspnet_regsql.exe -S localhost\
  \ -U username -P password -d Northwind -lt\n```\n\n`-lt` 命令生成启用 SQL 缓存失效的表的简单列表。输入此命令会产生以下结果：\n\
  \n```\n Listing all tables enabled for SQL cache dependency:\n  Customers\n  Products\n\
  ```\n\n### 为 SQL Server 缓存失效禁用表\n\n现在你已经知道如何为你的 SQL Server 数据库启用 SQL Server 缓存失效，看看如何移除特定表被此过程监控的能力。要从\
  \ SQL Server 缓存失效过程中移除一个表，你需要使用 `-dt` 命令。\n\n在前面的的示例中，使用 `-lt` 命令显示你已经启用了 `Customers`\
  \ 和 `Products` 表。接下来，你使用以下命令从该过程中移除 `Products` 表：\n\n```\n aspnet_regsql.exe -S\
  \ localhost -U username -P password -d Northwind -t Products -dt\n```\n\n你可以看到，你只需使用\
  \ `-t` 命令指定表名，然后跟上 `-dt` 命令（禁用表）。禁用表缓存的命令行将再次列出启用 SQL Server 缓存失效的表；这次，`Products`\
  \ 表没有被列出——相反，唯一的已启用表 `Customers` 被列出了。\n\n### 为 SQL Server 缓存失效禁用数据库\n\n你不仅可以挑选你想要从过程中移除的表，还可以禁用整个数据库的\
  \ SQL Server 缓存失效功能。要禁用整个数据库，你使用 `-dd` 命令（禁用数据库）。\n\n此示例显示了在我的我的电脑上被禁用的 Northwind\
  \ 数据库：\n\n```\n C:\\>aspnet_regsql -S localhost -U username -P password -d   Northwind\
  \ -dd\n\n  Disabling the database for SQL cache dependency.\n  .\n  Finished.\n\
  ```\n\n为了确保该表不再启用 SQL Server 缓存失效，我尝试使用 `-lt` 命令列出已启用缓存失效的表。我收到了以下错误信息：\n\n```\n\
  \ C:\\ >aspnet_regsql -S localhost -U username -P password -d Northwind -lt\n  An\
  \ error has happened. Details of the exception:\n  The database 'Northwind' is not\
  \ enabled for SQL cache notification, please\n   use the System.Web.Caching.SqlCacheDependencyAdmin.EnableNotifications\
  \ method,\n   or the command line tool aspnet_regsql. To use the tool, please run\n\
  \   'aspnet_regsql.exe -?' for more information.\n```\n\n如果你现在在 SQL Server Management\
  \ Studio 中打开 Northwind 数据库，你可以看到 `AspNet_SqlCacheTablesForChangeNotification` 表已从数据库中移除。\n\
  \n### SQL Server 缓存失效\n\nSQL Server 支持更细粒度的通知系列，不需要轮询。更改的直接通知是 SQL Server 的内置功能，通过\
  \ ADO.NET 的 `SqlCommand` 。列表 22-8 显示了这一点。\n\nSQL Server 在缓存时支持编程和声明式技术。在 `OutputCache`\
  \ 指令中使用字符串 `CommandNotification` 来如本示例所示为页面启用基于通知的缓存。注意，你必须先调用 `System.Data.SqlClient.SqlDependency.Start`\
  \ 并传递连接字符串，以启动 SQL 通知引擎：\n\n```\n <%@ OutputCache Duration=\"3600\" VaryByParam=\"\
  none\"\n      SqlDependency=\"CommandNotification\"%>\n```\n\n或者，如果你在 ASP.NET 页面内部使用\
  \ `SqlDataSource` 控件，你需要执行操作：\n\n```\n <asp:SqlDataSource EnableCaching=\"true\"\
  \   SqlDependency=\"CommandNotification\"\n    CacheDuration=\"2600\" />\n```\n\n\
  当 SQL Server 内的数据发生变化时，SQL 和 ADO.NET 会自动失效在 Web 服务器上缓存的数据。\n\n## 配置你的应用程序\n\n当你为数据库启用\
  \ SQL Server 缓存失效并启用了该数据库中的几个表后，下一步是为你的应用程序配置 SQL Server 缓存失效。\n\n要配置应用程序以使用 SQL\
  \ Server 缓存失效，第一步是对 `web.config` 文件进行一些更改。在 `web.config` 文件中，指定你想与 Northwind 数据库工作，并让\
  \ ASP.NET 连接到它。\n\n列表 22-9（代码文件 web.config）显示了你应如何更改 `web.config` 文件以使用 SQL Server\
  \ 缓存失效的示例。如果你使用的是较新的 SQL Server（2005 年或更高版本）通知，则不需要 `pollTime` 属性，因为它使用数据库事件，而不是早期版本所需的轮询。\n\
  \n从列表中你可以看到第一步建立的是使用 `web.config` 文件中的 `<connectionStrings>` 元素指向 Northwind 数据库的连接字符串。注意连接字符串的名称，因为它在随后的\
  \ SQL Server 缓存失效配置设置中会被用到。\n\n\n\n\nSQL Server 缓存失效是通过 `<caching>` 元素进行配置的。该元素必须嵌套在\
  \ `<system.web>` 元素内部。由于你正在处理 SQL Server 缓存依赖，你必须使用 `<sqlCacheDependency>` 子节点。通过使用\
  \ `enabled=\"true\"` 属性可以启用整个过程。启用此属性后，你将操作 `<databases>` 部分。你使用嵌套在 `<databases>`\
  \ 节点中的 `<add>` 元素来引用 Northwind 数据库。表 22-1 解释了 `<add>` 元素的属性。\n\n| 属性 | 说明 |\n| ---\
  \ | --- |\n| `Name` | 为 SQL Server 数据库提供一个标识符。 |\n| `connectionStringName` | 指定连接的名称。由于上一个示例中的连接字符串名为\
  \ `AppConnectionString1`，因此在 `connectionStringName` 属性中也使用此值。 |\n| `pollTime` |\
  \ 指定从一次 SQL Server 轮询到下一次轮询的时间间隔。默认值为 0.5 秒或 500 毫秒（如列表 22-9 所示）。对于 SQL Server 2005、2008\
  \ 和 2012 的通知，不需要此项。 |\n\n**表 22-1**\n\n现在 `web.config` 文件已配置正确，你可以在页面上开始使用 SQL Server\
  \ 缓存失效了。ASP.NET 会在完全不同的线程上对 `AspNet_SqlCacheTablesForChangeNotification` 表发送单独的\
  \ SQL Server 请求，以检查 `changeId` 数字是否增加。如果数字发生变化，ASP.NET 就会知道 SQL Server 表发生了底层更改，并且应该检索新的结果集。当它检查是否应该发起\
  \ SQL Server 调用时，对小型 `AspNet_SqlCacheTablesForChangeNotification` 表的请求只有一个结果。在启用了\
  \ SQL Server 缓存失效的情况下，这一操作执行非常快，你真的能感觉到这种差异。\n\n## 测试 SQL SERVER 缓存失效\n\n现在 `web.config`\
  \ 文件已经配置好并准备就绪，下一步是将这些功能实际应用到页面上。列表 22-10 是使用 SQL Server 缓存失效过程的页面示例。\n\n该页面的第一个也是最重要的部分是位于文件顶部的\
  \ `OutputCache` 页面指令。通常，`OutputCache` 指令使用 `Duration` 属性指定页面输出在缓存中保存的时间。接下来是 `VaryByParam`\
  \ 属性。新增的是 `SqlDependency` 属性。它允许特定页面使用 SQL Server 缓存失效。以下行显示了 `SqlDependency` 属性值的格式：\n\
  \n```\nSqlDependency=\"database:table\"\n```\n\n`Northwind:Customers` 的值指定了对 Northwind\
  \ 数据库中的 `Customers` 表启用 SQL Server 缓存失效。`OutputCache` 指令的 `Duration` 属性向你展示，通常此页面的输出存储在缓存中很长时间——但如果\
  \ `Customers` 表包含的数据发生任何底层更改，该缓存将立即失效。\n\nNorthwind 数据库 `Customers` 表中任何单元格的更改都会导致缓存失效，并根据结果生成新缓存，该结果现在包含一个新的\
  \ SQL Server 数据库请求。图 22-6 显示了页面在首次运行时生成的示例。\n\n![image](img/f849-01.jpg)\n\n**图\
  \ 22-6**\n\n从此图中，你可以看到 `CustomerID` 为 `ALFKI` 的客户内容。对于此条目，进入 SQL Server 将 `ContactName`\
  \ 的值从 `Maria Anders` 改为 `Mary Anders`。如果没有使用 SQL Server 缓存失效，此更改将对输出缓存产生任何影响。缓存中的原始页面输出仍然存在，用户在页面\
  \ `OutputCache` 指令指定的持续时间内仍然看到 `Maria Anders` 条目。然而，由于你使用了 SQL Server 缓存失效，在表的底层信息更改后，输出缓存会失效，检索新的结果集并缓存该新结果集。当发生更改后，你将看到如图\
  \ 22-7 所示的结果。\n\n![image](img/f850-01.jpg)\n\n**图 22-7**\n\n请注意，文本“Page created\
  \ at”包含一个更新的时间，指示了该页面的渲染时间。\n\n### 在页面上添加多个表\n\n前面的示例展示了如何在 ASP.NET 页面上为单个表使用 SQL\
  \ Server 缓存失效。如果你的页面处理的是两个或多个表，该怎么办？\n\n要添加多个表，你可以使用此处所示的 `OutputCache` 指令：\n\n\
  ```\nSqlDependency=\"database:table;database:table\"\n```\n\n从此示例中，你可以看到 `SqlDependency`\
  \ 属性的值用分号分隔数据库和表。如果你想同时处理 Northwind 数据库的 `Customers` 表和 `Products` 表，请如下方式构造 `SqlDependency`\
  \ 属性值：\n\n```\nSqlDependency=\"Northwind:Customers;Northwind:Products\"\n```\n\n\
  ### 将 SQL Server 依赖到请求\n\n除了通过 `OutputCache` 指令设置 SQL Server 失效外，你还可以通过代码设置。要这样操作，请使用\
  \ `SqlDependency` 类，如列表 22-11 所示。\n\n你首先创建一个 `SqlDependency` 实例，同时为其指定数据库和表。`SqlDependency`\
  \ 类接受以下参数：\n\n```\nSqlDependency(System.Data.SqlCommand sqlCmd)\n```\n\n在 `SqlDependency`\
  \ 类准备完成后，将依赖添加到 `Cache` 对象中，并设置 `Cache` 对象的某些属性。你可以通过编程或通过 `OutputCache` 指令来实现。\n\
  \n### 将 SQL Server 缓存依赖到缓存对象\n\n除了将 SQL Server 依赖附加到 `Request` 对象外，你还可以将其附加到 `Cache`\
  \ 对象，以便缓存更久。`Cache` 对象包含在 `System.Web.Caching` 命名空间中，它允许你通过编程处理任何类型对象的缓存。列表 22-12\
  \ 显示了一个使用 `Cache` 对象结合 `SqlDependency` 对象的页面。\n\n在此示例中，`SqlDependency` 类与之前关联到 Northwind\
  \ 数据库中的 `Customers` 表。然而，这次你使用 `Cache` 对象插入了检索的数据集以及 `SqlDependency` 对象的引用。`Cache`\
  \ 类的 `Insert` 方法构造如下：\n\n```\nCache.Insert(String key, Object value,\n  System.Web.Caching.CacheDependency\
  \ dependencies)\n```\n\n你还可以使用以下构造方式插入关于依赖的更多信息：\n\n```\nCache.Insert(String key,\
  \ Object value,\n  System.Web.Caching.CacheDependency dependencies,\n  Date absoluteExpiration,\
  \ System.TimeSpan slidingExpiration)\n```\n\n最后：\n\n```\nCache.Insert(String key,\
  \ Object value,\n  System.Web.Caching.CacheDependency dependencies,\n  Date absoluteExpiration,\
  \ System.TimeSpan slidingExpiration,\n  System.Web.Caching.CacheItemPriority priority,\n\
  \  System.Web.Caching.CacheItemRemovedCallback onRemoveCallback)\n```\n\n\n\n创建的\
  \ SQL Server 缓存依赖将开始运行，并执行与通常情况下相同的轮询操作。如果 `Customers` 表中的任何数据发生变化，`SqlCacheDependency`\
  \ 类将使缓存中存储的内容失效。当发起下一次请求时，发现 `Cache[\"firmCustomers\"]` 为空，并向 SQL Server 发起新请求。`Cache`\
  \ 对象将再次用生成的新结果重新填充缓存。\n\n图 22-8 显示了首次调用列表 22-12 中的 ASP.NET 页面时生成的的结果。\n\n![image](img/f853-01.jpg)\n\
  \n**图 22-8**\n\n由于这是第一次生成页面，缓存中一无一物。`Cache` 对象随后被置于结果集中，并带有与 SQL Server 缓存依赖的关联。图\
  \ 22-9 显示了第二次请求的结果。注意，HTML 表格是相同的，因为它们是由相同的 `DataSet` 生成的，但页面的第一行已经发生了变化，指示此输出是从缓存产生的。\n\
  \n![image](img/f854-01.jpg)\n\n**图 22-9**\n\n在第二次请求时，数据集已包含在缓存中；因此是可以检索的。你不需要再次访问\
  \ SQL Server 来获取完整结果。然而，如果 SQL Server 内部的任何信息发生了变化，`Cache` 对象将返回空；并检索一个新的结果集。\n\n\
  ## 总结\n\nASP.NET 提供了几种内置的缓存机制。这些功能中的大多数可以通过属性实现，因此不需要编写实际代码。理解不同类型的缓存非常重要，包括部分页面缓存和缓存后替换。\n\
  \n在与数据库配合工作时，SQL Server 缓存作用机制是 ASP.NET 的一项卓越功能，它允许在被监控的表中的数据发生底层更改时，使缓存中存储的项目失效。缓存后替换填补了\
  \ ASP.NET 技术的一处重要空白，让你既能拥有最佳的高动态内容，又能拥有一个带有缓存的高性能网站。\n\n当你监控数据库更改时，可以轻松地在 `web.config`\
  \ 文件中配置这些过程，或者可以在代码中直接通过编程方式处理缓存失效。这些更改之所以可行，是因为 `CacheDependency` 对象已经取消了密封（unsealed）。你现在可以继承此对象并创建自己的缓存依赖。SQL\
  \ Server 缓存失效过程是该能力的第一个示例。\n\n# 第七部分\n\n客户端开发\n\n* **第 23 章：**ASP.NET AJAX\n* **第\
  \ 24 章：**AJAX 控制工具包\n* **第 25 章：**jQuery\n* **第 26 章：**实时通信\n* **第 27 章：**面向移动端的网站开发\n\
  \n# 第 23 章：ASP.NET AJAX\n\n### 本章包含哪些内容？\n\n* 使用 ASP.NET AJAX 开发应用程序\n* 使用 ASP.NET\
  \ AJAX 的服务器端控件\n\n## 本章的 WROX.COM 代码下载\n\n请注意，本章中的所有代码示例均作为本章代码下载包的一部分，可以在书籍网站 [www.wrox.com](http://www.wrox.com)\
  \ 的“Download Code”选项卡上找到。\n\n在 Web 应用程序开发中，Ajax 表示利用 `XMLHttpRequest` 对象构建应用程序的能力，该对象负责发送\
  \ HTTP 请求。\n\n在 JavaScript 中创建并包含 `XMLHttpRequest` 对象，以及所有现代浏览器都支持它的事实，导致了 Ajax\
  \ 模型的诞生。Ajax 应用在 Google 发布了一系列著名的支持 Ajax 的应用程序（如 Google Maps）后开始流行。这些以及其他应用程序展示了\
  \ Ajax 的价值，并引起了世界的关注。`XMLHttpRequest` 的原始发明者实际上是微软；他们将此功能作为 ActiveX 组件为 Internet\
  \ Explorer 实现，所有其他浏览器都将其移植到了自己的浏览器中。如今，Internet Explorer 将 `XMLHttpRequest` 作为原生的\
  \ JavaScript 对象支持（与其他所有浏览器一样）。\n\n不久，微软发布了一个工具包的测试版本，允许开发者在其 Web 应用程序中整合 Ajax 功能。该工具包代号为\
  \ *Atlas*，后来更名为 ASP.NET AJAX，它让在应用程序中使用 Ajax 功能变得极其简单。\n\n如果你正在使用 ASP.NET 3.5、4\
  \ 或 4.5，你甚至不需要担心安装 ASP.NET AJAX 框架，因为你需要的一切已经为你就绪。\n\n## 理解 AJAX 的必要性\n\nASP.NET\
  \ AJAX 让你的 Web 应用程序看起来更加流畅。支持 Ajax 的应用程序具有响应性，并通过你提供的工作流为终端用户提供即时反馈和指导。\n\n### 在\
  \ Ajax 之前\n\n那么，Ajax 对你的 Web 应用程序做了什么？看看 页面在*不*使用 Ajax 时会发生什么。图 23-1 显示了 Web 应用程序典型的请求-响应活动。\n\
  \n![image](img/f858-01.jpg)\n\n**图 23-1**\n\n在图中，终端用户从其浏览器向存储在服务器上的应用程序发送请求。服务器处理请求并由\
  \ ASP.NET 渲染页面，然后作为响应发送给请求者。当终端用户接收到响应时，显示在浏览器中。\n\n从这里开始，在浏览器中运行的许多事件会导致整个请求-响应过程再次发生。例如，终端用户可能会点击单选按钮、复选框、按钮、日历或其他任何内容，这些操作都会导致整个\
  \ Web 页面刷新或提供新页面。\n\n### Ajax 改变了局面\n\n相比之下，支持 Ajax 的 Web 页面在客户端包含了一个 JavaScript\
  \ 库，负责向 Web 服务器发出请求。当可以发送请求并获取部分页面响应时，使用脚本通过该库更新页面的该部分而无需更新整个页面。整个页面每次都需要大量的带宽发送到浏览器进行处理。通过只处理部分页面，终端用户体验到了某些人所谓的“流畅性”，这让页面看起来更有响应性。更新页面部分的代码量更少，并产生了终端用户预期的响应。图\
  \ 23-2 显示了其工作原理的示意图。\n\n![image](img/f858-02.jpg)\n\n**图 23-2**\n\n图 23-2 证明了首先发生的是在初始请求和响应中交付整个页面。从那里开始，所需的任何部分更新都通过客户端脚本库完成。\n\
  \n\n\n\nAjax 的运行依赖于几项技术。第一个是 `XMLHttpRequest` 对象。该对象允许浏览器与后端服务器进行通信，并且自 Internet\
  \ Explorer 5 以来一直通过 `MSXML` ActiveX 组件在微软世界中可用。当然，另一个主要组件是 JavaScript。这项技术提供了与后端服务进行通信的客户端发起能力，并负责打包发送到任何服务器端服务的消息。Ajax\
  \ 的另一个方面是对文档对象模型（DOM）的支持。当从服务器接收到异步响应时，这些部分会更改页面内容。最后，最后一部分是从客户端传输到服务器的数据。这种传输是以\
  \ XML 格式进行的，更重要的是是使用高效的 JavaScript 对象表示法（JSON）。\n\n对 `XMLHttpRequest` 对象的支持使得客户端脚本库中的\
  \ JavaScript 函数具有了调用服务器端代码的能力。如所述，HTTP 请求通常由浏览器发出。浏览器还负责处理来自服务器的响应，并且通常在发出响应后在浏览器中重新生成整个网页页面。图\
  \ 23-3 详细说明了这一过程。\n\n![image](img/f859-01.jpg)\n\n**图 23-3**\n\n如果你在 JavaScript\
  \ 库中使用 `XMLHttpRequest` 对象，那么你实际上并没有从浏览器发出全页请求。相反，你使用一个客户端脚本引擎（基本上是一个 JavaScript\
  \ 函数）来发起请求并接收响应。因为你也没有发出用于处理整个网页的请求和响应，所以你可以跳过很多页面处理，因为这些处理是不需要的。这就是 Ajax Web 请求的精髓。它在图\
  \ 23-4 中所示。\n\n![image](img/f860-01.jpg)\n\n**图 23-4**\n\n如所述，Ajax 开启了海量的可能性。微软提供了必要的脚本引擎，以自动化实现\
  \ Ajax 风格功能时发生的大部分通信。\n\n## ASP.NET AJAX 和 VISUAL STUDIO 2012\n\nASP.NET AJAX 不仅是\
  \ Visual Studio 2012 IDE 的一部分，ASP.NET AJAX 产品也内置在 .NET Framework 4.5 中。这意味着，如果你正在使用\
  \ ASP.NET 4.5，那么要使用 ASP.NET AJAX，你不需要安装任何东西。\n\n总体而言，微软已经完全整合了整个 ASP.NET AJAX 体验，你可以轻松地使用\
  \ Visual Studio 及其视觉设计器来处理支持 Ajax 的页面，甚至获得你对应用程序所希望拥有的完整调试过程。使用 Visual Studio 2012，你还可以调试你在页面中使用的\
  \ JavaScript。\n\n此外，重要的是，微软对 ASP.NET AJAX 的跨平台兼容性投入了关注。你会发现，在 .NET Framework 4.5\
  \ 上构建的启用 Ajax 的应用程序可以在所有主流浏览器中（如 Firefox 和 Chrome）中运行。\n\n### 客户端技术\n\nASP.NET AJAX\
  \ 的故事确实包含两个部分。第一部分是客户端框架和一组完全位于客户端的服务器。另一部分是服务端框架。请记住，ASP.NET AJAX 的客户端核心在于客户端向产品的服务端发送异步请求。\n\
  \n出于这个原因，微软提供了一个客户端脚本库（Client Script Library），这是一个负责所需通信的 JavaScript 库。图 23-5 显示了客户端脚本库。\n\
  \n![image](img/f861-01.jpg)\n\n**图 23-5**\n\n客户端脚本库提供了一个 JavaScript 面向对象的接口，它与 .NET\
  \ Framework 的方面相当一致。由于内置了浏览器兼容性组件，你在这一层中构建的任何工作或（在大多数情况下）让 ASP.NET AJAX 为你执行的工作都将在许多不同的浏览器中运行。此外，几个组件支持丰富的\
  \ UI 基础架构，可以产生许多自己构建需要花费大量时间才能完成的内容。\n\nASP.NET AJAX 提供的客户端技术中有趣的地方在于，它们完全独立于 ASP.NET。事实上，任何开发者都可以自由下载\
  \ Microsoft AJAX 库（再次通过 `asp.net/ajax`），并将其与其他 Web 技术一起使用，如 PHP（`php.net`）和 Java\
  \ Server Pages (JSP)——尽管诚实地说，几乎没有人那样做。尽管如此，拥有了 ASP.NET AJAX 提供的服务端技术后，整个 Web 故事要完整得多。\n\
  \n尽管微软现在接受了 jQuery JavaScript 库（该部分将在第 25 章 中介绍），但仍有一些 ASP.NET AJAX 独有的且方便的功能。\n\
  \n### 服务端技术\n\n作为一名 ASP.NET 开发人员，你可能会大部分时间花在 ASP.NET AJAX 的服务端部分。请记住，ASP.NET AJAX\
  \ 的核心在于客户端技术与服务端技术进行通信。你实际上可以在 ASP.NET AJAX 的服务端执行很多工作。\n\n服务端框架知道如何处理客户端请求（例如将响应放在正确的格式中）。服务端框架还负责\
  \ JavaScript 对象与你正在使用的 .NET 对象之间的往返转换（marshalling）。图 23-6](#Chapter23.xhtml_figure23-6)\
  \ 展示了 ASP.NET AJAX 提供的服务端框架。\n\n![image](img/f862-01.jpg)\n\n**图 23-6**\n\n当你拥有\
  \ .NET Framework 4.5 时，你将在 ASP.NET 框架、Windows Communication Foundation 以及基于 ASP.NET\
  \ 的服务（asmx）之上拥有 ASP.NET AJAX 扩展。\n\n### 使用 ASP.NET AJAX 开发\n\n市场上存在几种 Web 开发者。一类是习惯于使用\
  \ ASP.NET 并具有在服务端操作和控制这些控件经验的开发者。另一类是专注于客户端，使用 DOM 和 JavaScript 操作并控制页面及其行为的开发者（当然，也有既属于这两类的人）。\n\
  \n尽管如此，重要的是意识到，ASP.NET AJAX 是为这两类开发者设计的。如果你想更多在 ASP.NET AJAX 的服务端进行工作，那么可以使用 ScriptManager\
  \ 控件和 UpdatePanel 控件为你的 ASP.NET 应用程序启用 Ajax，而只需少量工作。你可以使用在 ASP.NET 中熟悉的编程模型完成所有这些工作。\n\
  \n反之，你也可以直接使用客户端脚本库，并对客户端发生的情况获得更大的控制。接下来，本章将介绍构建使用该框架的简单应用程序。\n\n## 构建 ASP.NET\
  \ AJAX 应用程序\n\n现在你已经理解 Ajax 的原因，下一步是使用该框架构建基础示例。使用 New Web Site 对话框（如图 23-7 所示）创建一个新的空\
  \ ASP.NET 网站应用程序，并选择任意名称。\n\n![image](img/f863-01.jpg)\n\n**图 23-7**\n\n\n\n创建应用程序后，你将看到一个现在标准的网站项目。如果你是用\
  \ ASP.NET 3.5 构建此应用程序，你会在 `web.config` 文件中注意到一些额外的设置。在这种情况下，在 `web.config` 文件的顶部，你会发现一些注册过的配置节，它们专门用于处理\
  \ AJAX。在 ASP.NET 4.5 的情况下，以前存在于 `web.config` 文件中的相同配置部分现在被移到了 `machine.config` 文件中。代码列表\
  \ 23-1 展示了 `machine.config` 中的该部分。\n\n接下来，你构建一个尚未使用 Ajax 的简单 ASP.NET 页面。\n\n###\
  \ 构建不使用 Ajax 的简单 ASP.NET 页面\n\n要构建一个尚未利用 ASP.NET 4.5 提供的 Ajax 功能的简单页面，你的页面只需要一个\
  \ `Label` 控件和一个 `Button` 服务器控件。代码列表 23-2 展示了页面的代码。\n\n当你在浏览器中打开此页面时，它只包含一个按钮。当点击按钮时，页面上的\
  \ `Label` 控件将填充来自服务器机器的时间。在点击按钮之前，页面的标记与 代码列表 23-3 所示的代码类似。\n\n这段代码并没有多少内容。它有一点\
  \ `ViewState` 和一个会回传（post back）到 `Default.aspx` 页面的典型表单。当终端用户点击页面上的按钮时，会发生到服务器的全回传（postback），整个页面将经过重新处理并返回到客户端浏览器。实际上，对页面进行的唯一更改是\
  \ `<span id=\"Lable1\"></span>` 元素填充了一个值，但在这种情况下，返回的是整个页面。\n\n### 构建使用 Ajax 的简单\
  \ ASP.NET 页面\n\n下一步是在 代码列表 23-2 的页面基础上进行构建，并为其添加 Ajax 能力。在这个示例中，你添加了一些额外的控件。其中两个控件是典型的\
  \ ASP.NET 服务器控件——另一个 `Label` 和 `Button` 服务器控件。除了这些控件之外，你必须添加一些 ASP.NET AJAX 控件。\n\
  \n在 Visual Studio 2012 工具箱中，有一个名为“AJAX Extensions”的节。该节如 图 23-8 所示。\n\n![image](img/f865-01.jpg)\n\
  \n**图 23-8**\n\n从 AJAX Extensions 向页面顶部添加一个 `ScriptManager` 服务器控件，并将第二个 `Label`\
  \ 和 `Button` 控件包含在 `UpdatePanel` 控件内部。`UpdatePanel` 控件是一个模板服务器控件，它允许你在其中包含任意数量的项目（就像其他模板化的\
  \ ASP.NET 服务器控件一样）。当你设置好页面后，它看起来应该像 图 23-9 所示。\n\n![image](img/f866-01.jpg)\n\n\
  **图 23-9**\n\n代码列表 23-4 显示了此页面的代码。\n\n当你在浏览器中打开此页面时，它有两个按钮。第一个按钮会导致完整的页面回传，并更新 `Label1`\
  \ 服务器控件中的当前时间。点击第二个按钮会导致部分 Ajax 异步回传。点击此第二个按钮会更新 `Label2` 服务器控件中的当前服务器时间。当你点击 Ajax\
  \ 按钮时，`Label1` 中的时间将完全不会改变，因为它在 `UpdatePanel` 之外。图 23-10 展示了最终结果的截图。\n\n![image](img/f867-01.jpg)\n\
  \n**图 23-10**\n\n当你首次打开来自 代码列表 23-4 的页面时，该页面的代码与你不使用 Ajax 构建的页面大不同。代码列表 23-5 显示了你将看到的页面结果。\n\
  \n从那里开始，如果你点击 `Button1` 并执行全页回传，你将在响应中收回这段代码——尽管你只对更新页面的一小部分感兴趣！然而，如果你点击 `Button2`——Ajax\
  \ 按钮——你就会发送 代码列表 23-6 所示的请求。\n\n代码列表 23-7 显示了此异步请求的响应。\n\n从 代码列表 23-7 中，你可以看到响应比整个网页要小得多！事实上，响应的主部分仅包含在\
  \ `UpdatePanel` 服务器控件内的代码，别无他物。输出底部的项目处理页面的 `ViewState`（因为现在已经改变了）以及其他细微的页面变化。\n\
  \n### ASP.NET AJAX 的服务器端控件\n\n当你查看 Visual Studio 2012 工具箱中的 AJAX Extensions 节时，你会发现可用的控件并不多。那里的控件侧重于允许你为\
  \ ASP.NET 启用 Ajax 功能。它们是启用控件。如果你在寻找利用 Ajax 模型的更具体的服务器控件，请查看 Ajax Control Toolkit——这是一个独立的下载包，将在\
  \ 第 24 章 中进行介绍。\n\n表 23-1 描述了 ASP.NET 4.5 自带的 ASP.NET AJAX 服务器控件。\n\n| **ASP.NET\
  \ AJAX 服务器控件** | **描述** |\n| --- | --- |\n| `ScriptManager` | 一种组件控件，用于管理向启用 Ajax\
  \ 的服务器发送针对需要部分更新部分的消息。每个 ASP.NET 页面都需要 `ScriptManager` 控件才能工作。注意，一个页面上只能有一个 `ScriptManager`\
  \ 控件。 |\n| `ScriptManagerProxy` | 一种组件控件，充当内容页 `ScriptManager` 控件。`ScriptManagerProxy`\
  \ 控件位于内容页，与主页上的 `ScriptManager` 控件协同工作。 |\n| `Timer` | `Timer` 控件在特定间隔执行客户端事件，并允许页面特定部分在这些时刻刷新。\
  \ |\n| `UpdatePanel` | 一种容器控件，允许你定义与 `ScriptManager` 协作的页面区域。这些区域可以进行部分回传，并在标准的\
  \ ASP.NET 回传过程之外进行更新。 |\n| `UpdateProgress` | 一种控件，允许你向用户显示视觉元素，以指示部分页面回传正在进行。该控件在处理长时间\
  \ Ajax 更新时是理想选择。 |\n\n**表 23-1**\n\n本章接下来的几节将介绍这些控件，并解释如何在 ASP.NET 页面中使用它们。\n\n\
  ### ScriptManager 控件\n\n在 ASP.NET AJAX 工具库中，最重要的控件可能是 `ScriptManager` 服务器控件，它与页面协作实现部分渲染。对于每个想要使用\
  \ ASP.NET 4.5 提供的 Ajax 能力的页面，你需要使用一个 `ScriptManager` 控件。当 `UpdatePanel` 服务器控件配合使用时，为\
  \ ASP.NET 启用 Ajax 只需要在页面上添加两个控件，就准备好了！\n\n`ScriptManager` 控件负责管理页面上使用的 JavaScript\
  \ 库，并在部分渲染过程中在服务器和客户端之间传输消息。消息传输可以通过 `ScriptManager` 控件使用 SOAP 或 JSON 完成。\n\n如果你只在\
  \ ASP.NET 页面上放置一个 `ScriptManager` 控件，它将负责加载 ASP.NET AJAX 所需的 JavaScript 库。代码列表 23-8\
  \ 展示了此任务的页面代码。\n\n\n\n\n从列表 23-8 中你可以看到该控件与其他所有 ASP.NET 控件一样，只需要一个 `ID` 和一个 `runat`\
  \ 属性即可工作。列表 23-9 显示了这段 ASP.NET 代码的页面输出。\n\n页面输出显示有多个 JavaScript 库随页面加载。请注意，脚本源是动态注册的，并且通过\
  \ `ScriptResource.axd` 处理器提供的 HTTP 处理器来可用。\n\n`ScriptManager` 的一个有趣点是，它在处理发送到客户端的脚本时，会通过额外的步骤对其进行压缩。\n\
  \n## ScriptManagerProxy 控件\n\n`ScriptManagerProxy` 控件实际上是在第 16 章中引入的，因为该控件专门处理主页（master\
  \ pages）和用户控件。与上一节介绍的 `ScriptManager` 控件一样，你需要在每个运行 ASP.NET AJAX 的页面上放置一个 `ScriptManager`\
  \ 控件。然而，话如此，大问题是：当你使用主页时该怎么办？你是否需要在主页上放置 `ScriptManager` 控件？它是如何与使用该主页的内容页面工作的？\n\
  \n当你从“添加新项”对话框创建新的主页时，只需选择典型的主页选项，并稍微修改代码以处理 Ajax 即可。这在列表 23-10 中有所演示。\n\n这段代码显示，页面上确实有一个\
  \ `ScriptManager` 控件，并且该页面将添加到使用此主页的每一个内容页面。为了使用主页提供的 ASP.NET AJAX 功能，你不需要对内容页面进行任何特殊操作。相反，你可以创建一个与你习惯创建的任何内容页面无区别的内容页面。\n\
  \n然而，如果你想以任何方式修改主页上的 `ScriptManager` 控件，则必须在内容页面上添加一个 `ScriptManagerProxy` 控件，如列表\
  \ 23-11 所示。\n\n在这种情况下，内容页面通过从内容页面中插入脚本引用，为主页上的 `ScriptManager` 控件进行补充。如果你在内容页面使用\
  \ `ScriptManagerProxy` 控件，而主页上恰好没有 `ScriptManager` 控件，你将得到错误。\n\n## Timer 控件\n\n\
  在处理来自 ASP.NET 页面的异步回传（postbacks）时，一个常见任务是你可能希望这些异步回传按特定的时间间隔发生。为了实现这一点，你使用工具箱中 AJAX\
  \ 扩展提供的 `Timer` 控件。一个演示该控件如何工作的简单示例涉及在页面上放置一些时间戳，并设置在定时间隔内发生回传，如列表 23-12 所示。\n\n\
  在这种情况下，页面上只有三个控件。第一个是 `ScriptManager` 控件，随后是 `Label` 和 `Timer` 控件。当页面首次加载时，通过调用\
  \ `Page_Load` 事件处理程序，`Label` 控件填充了 `DateTime` 值。在 `DateTime` 值初始加载到 `Label` 控件之后，`Timer`\
  \ 控件负责更改此值。\n\n`Timer` 控件的 `OnTick` 属性允许你完成此任务。它指向当达到 `Interval` 属性指定的时间跨时触发的函数。\n\
  \n`Interval` 属性设置为 `10000`，即 10,000 毫秒（记住每秒有 1,000 毫秒）。这意味着每 10 秒执行一次异步回传，并调用 `Timer1_Tick()`\
  \ 函数。\n\n当你运行此页面时，你会看到上的时间每 10 秒变化一次。\n\n## UpdatePanel 控件\n\n`UpdatePanel` 服务器控件是一个\
  \ Ajax 特有的控件，是 ASP.NET 4.5 的一部分。在处理 Ajax 时，你可能经常使用 `UpdatePanel` 控件。该控件保留了回传模型并允许你执行部分页面渲染。\n\
  \n`UpdatePanel` 控件是一个容器控件，这意味着它实际上没有与其关联的 UI 特有项目。它是触发部分页面回传并仅更新 `UpdatePanel` 指定页面部分的方法。\n\
  \n### <ContentTemplate> 元素\n\n你有几种方法来处理页面上启动异步页面回传的控件。到目前为止最简单的方法如列表 23-13 中所示。\n\
  \n在这种情况下，`Label` 和 `Button` 服务器控件包含在 `UpdatePanel` 服务器控件中。`<asp:UpdatePanel>` 元素有两个可能的子元素：`<ContentTemplate>`\
  \ 和 `<Triggers>`。任何需要通过异步页面回传更改的内容都包含在 `UpdatePanel` 控件的 `<ContentTemplate>` 部分。\n\
  \n默认情况下，包含在 `<ContentTemplate>` 部分的任何类型的控件触发器（通常会触发页面回传的东西）都会导致异步页面回传。这意味着，在列表 23-13\
  \ 的情况下，页面上的按钮将触发异步页面回传而不是全页面回传。每次点击按钮都会更改 `Label` 控件显示的时间。\n\n### <Triggers> 元素\n\
  \n列表 23-13 演示了该模型的一个大问题——当异步回传发生时，你不仅发送了 `Label` 控件的日期/时间，还发送了此处所示按钮的代码：\n\n```\n\
  <asp:UpdatePanel ID=\"UpdatePanel1\" runat=\"server\">\n    <ContentTemplate>\n\
  \        <span id=\"Label1\">This was clicked on 12/7/2012 10:15:03 PM</span>\n\
  \    </br />\n        <br />\n        <asp:Button ID=\"Button1\" runat=\"server\"\
  \ Value=\"Click to initiate async request\" />\n    </ContentTemplate>\n</asp:UpdatePanel>\n\
  ```\n（注：上述代码块根据提供的文本上下文重建，因为原始输入不完整）。\n\n原因是，尽管要通过异步回传更改的内容都包含在 `<ContentTemplate>`\
  \ 部分中，但你需要绑定一个页面事件来导致回传的发生。这就是 `UpdatePanel` 控件的 `<Triggers>` 部分的作用。你使用该控件的部分来指定启动异步页面回传的各种触发器。通过使用\
  \ `UpdatePanel` 控件内的 `<Triggers>` 元素，你可以重写列表 23-13，如列表 23-14 所示。\n\n\n\n\n在这种情况下，`Button`\
  \ 控件和 HTML 元素位于 `UpdatePanel` 控件的 `<ContentTemplate>` 部分之外，因此它们在每次异步页面回传时，不会被发送回客户端。`<ContentTemplate>`\
  \ 部分包含的唯一项是页面上唯一需要随回传而变化的项——`Label` 控件。将这一切连接起来的是 `<Triggers>` 部分。\n\n`<Triggers>`\
  \ 部分可以包含两种可能的控件：`AsyncPostBackTrigger` 和 `PostBackTrigger`。在本例中，使用了 `AsyncPostBackTrigger`。`PostBackTrigger`\
  \ 控件将导致全页回传，而 `AsyncPostBackTrigger` 控件仅引起异步页面回传（显然，正如控件名称描述的那样）。\n\n正如你从示例 23-14\
  \ 中看到的，该示例使用了 `AsyncPostBackTrigger` 元素，仅使用了两个属性来将 `Button` 控件与异步回传的触发器相关联：`ControlID`\
  \ 和 `EventName` 属性。将你希望作为异步页面回传触发器的控件放在此处（使用控件 `ID` 属性指定的控件名称）。`EventName` 属性的值是你在\
  \ `ControlID` 中指定的控件的事件名称，该事件将在从客户端的异步请求中被调用。在本例中，调用了 `Button` 控件的 `Click()` 事件，该事件更改了位于\
  \ `UpdatePanel` 控件 `<ContentTemplate>` 部分内部控件的值。\n\n运行此页面并点击按钮将向客户端返回一个较小的异步响应：\n\
  \n```\n 1|#||4|113|updatePanel|UpdatePanel1|\n                      <span id=\"\
  Label1\">This button was clicked on 12/7/2012 10:16:00 PM</span>\n             \
  \     |216|hiddenField|__VIEWSTATE|exYy/K/aPNML3q+zrqHMWbTkzeycwcLnuu\n  HX4mfKnCfPJggjY8k7//liUwxhyUEg2eJU/QLD4Cgr4E/B/V7ossp0Rcn2zO5s17I/0oK2mw0MKM0/\n\
  \  OQ3F2NtqeCR5rwic9FiqbVx8G8V52uW0CL1pdnLArj9pi/NSyYpeeVmEAXapYQklsDPvcSKpHmjhIWIhfJ0QmSvO6Yv7LUS\n\
  \  k4OFET====128|hiddenField|__EVENTVALIDATION|MdQFKILTdqEbZgfpPoEQwHNM/A1icFRG9iE9Qy+b6wB4LQZQXWf\n\
  \  e9OK1Y6nNzLoFtTFX/hOdRHxv1Fci3EZNZSfpap+bu5DHqP+wDA6qL85imfWkquq8you1y59ztNKU|15|asyncPostBackC\n\
  \  ontrolIDs||Button1,Button1|0|postBackControlIDs|||26|updatePanelIDs||tUpdatePanel1,UpdatePanel1\n\
  \  |0|childUpdatePanelIDs|||25|panelsToRefreshIDs||UpdatePanel1,UpdatePanel1|2|asyncPostBackTimeou\n\
  \  t||90|18|formAction||Listing 23-14.aspx|11|pageTitle||UpdatePanel|\n```\n\n虽然与之前的示例相比并不小很多，但实际上它只小了一点——尺寸上的相似性实际上是因为此示例使用的页面大小（内容更丰富的页面将显示出更明显的改进）。带有大量内容的页面取决于你如何使用\
  \ `UpdatePanel` 控件构建页面，可能会显示出巨大的尺寸减小。\n\n### 使用 Visual Studio 2012 构建触发器\n\n如果你在构建\
  \ ASP.NET 页面时喜欢在 Visual Studio 的设计表面上工作，那么你会发现它对构建 ASP.NET AJAX 页面提供了很好的支持，包括在 `UpdatePanel`\
  \ 控件中创建触发器。要查看操作效果，请在页面上放置单个 `UpdatePanel` 服务端控件，并在 Visual Studio 的属性对话框中查看该控件。列表中的\
  \ Triggers 项旁边有一个按钮，允许你修改与其关联的项，如图 23-11 所示。\n\n![image](img/f879-01.jpg)\n\n**图\
  \ 23-11**\n\n在属性对话框中点击此按钮将启动 `UpdatePanelTrigger` 集合编辑器，如图 23-12 所示。此编辑器允许你轻松地添加任意数量的触发器并将其与控件及控件事件关联。\n\
  \n![image](img/f879-02.jpg)\n\n**图 23-12**\n\n点击确定将将触发器添加到 `UpdatePanel` 控件的 `<Triggers>`\
  \ 部分。\n\n### UpdateProgress 控件\n\nVisual Studio 2012 中 AJAX 扩展部分的最后一个服务端控件是 `UpdateProgress`\
  \ 控件。某些异步回传需要一些时间来执行。\n\n\n\n\n\nListing 23-18 展示了一个使用多个 `UpdatePanel` 控件的示例。\n\n\
  这个页面很有意思。它有两个 `UpdatePanel` 控件：`UpdatePanel1` 和 `UpdatePanel2`。这两个控件都包含一个 `Label`\
  \ 控件，该控件在某一时刻可以从服务器响应中获取日期/时间值。\n\n`UpdatePanel1` 控件有一个关联的触发器：页面上的 `Button` 控件。当点击此按钮时，`Button1_Click()`\
  \ 事件被触发并执行任务。如果你运行此页面，两个 `UpdatePanel` 控件都会根据 `Button1_Click()` 事件进行更新，如图 23-14\
  \ 所示。\n\n![image](img/f883-01.jpg)\n\n**图 23-14**\n\n两个 `UpdatePanel` 部分都通过 `Button1_Click()`\
  \ 事件进行了更新，因为在默认情况下，单页上的所有 `UpdatePanel` 控件会在发生*每次*异步回传（postback）时进行更新。这意味着 `Button1`\
  \ 按钮控件触发的回传也会导致 `UpdatePanel2` 控件发生回传。\n\n你实际上可以通过 `UpdatePanel` 的 `UpdateMode`\
  \ 属性来控制这种行为。`UpdateMode` 属性可以接受两个枚举值——`Always` 和 `Conditional`。如果你不设置此属性，它将使用 `Always`\
  \ 的值，这意味着每个 `UpdatePanel` 控件都会在每次异步请求时进行更新。\n\n另一个选项是将该属性设置为 `Conditional`。这意味着只有当满足一个触发条件时，`UpdatePanel`\
  \ 才会更新。为了作为示例，请更改页面上的 `UpdatePanel` 控件，让它们现在使用 `Conditional` 的 `UpdateMode`，如 Listing\
  \ 23-19 所示。\n\n现在两个 `UpdatePanel` 控件都已设置为 `Conditional` 的 `UpdateMode`，运行此页面时，你将看到在图\
  \ 23-15 中所示的结果。\n\n![image](img/f885-01.jpg)\n\n**图 23-15**\n\n在这种情况下，只有右侧的 `Label`\
  \ 控件 `Label1` 通过异步请求进行了更新，尽管 `Button1_Click()` 事件尝试更改 `Label1` 和 `Label2` 的值。其原因是\
  \ `UpdatePanel2` 控件没有被满足的触发器。\n\n## 处理页面历史\n\n在处理任何 Ajax 页面时，一个问题是，当最终用户点击浏览器的“后退”按钮时，它会破坏当前页面与服务器之间发生的异步请求，以及你可能在这些请求之间管理的任何状态。\n\
  \n如果你在页面中有处理 Ajax 的过程并点击了浏览器中的“后退”按钮，你将回到 Ajax 启用页面之前的那个页面，无论在此操作之前发生了什么异步页面请求。\n\
  \n此外，如果你导航中的第一个页面是一系列异步页面请求，作为最终用户，你将永远看不到点击页面后退按钮的，即使你已经深入进入了该页面提供的导航深处。\n\n通过\
  \ ASP.NET AJAX，你拥有处理应用程序后退历史的能力。这并不简单是只需激活某个功能；它需要一些代码编写来实现你的目标。你需要通过一个过程，告诉 ASP.NET\
  \ 页面在你允许最终用户使用浏览器的后退和前进按钮进行导航时，你将跟踪哪些状态。\n\n要查看此场景的演示，请创建一个使用 Ajax 的简单页面。该页面在 Listing\
  \ 23-20 中。\n\n这是一个标准的 ASP.NET AJAX 页面，这里没有任何复杂的技巧。在这种情况下，你使用 Ajax 在文本框中输入你的名字，然后这个名字被放入页面上的\
  \ `Label` 控件中。然而，如果你输入了多个名字，你会发现这*似乎*你正在处理多个页面，但浏览器的导航按钮（后退和前进按钮）并未启用，你无法选择回到你在文本框中输入的上一个项目。此外，浏览器书签也不起作用，因为它们只存储页面的（永不变化的）URL，而不是它的状态。\n\
  \n遗憾的是，最终用户期望这种行为，因此新功能为这类类型的页面添加了后退历史。\n\n如果你使用的是 ASP.NET 3.5 SP1 或更高版本，并查看页面上的\
  \ `ScriptManager` 控件，你会注意到一个名为 `EnableHistory` 的属性。它默认设置为 `False`，但在此示例中，你想要将此属性设置为\
  \ `True`。\n\n在 ASP.NET AJAX 页面上处理后退历史时，对 `EnableHistory` 属性的更改并不是必须的所有更改。你需要指示 ASP.NET\
  \ 如何记住上一个页面，以及当用户导航到上一个页面（如果用户点击了几次后退按钮，甚至是后后的页面）时该做什么。\n\n你可以轻松指定要记忆的历史点以及在页面上时使用的索引。Listing\
  \ 23-21\n\n```\nif (ScriptManager1.IsInBack && !ScriptManager1.IsNavigating)\n{\n\
  \    ScriptManager1.AddHistoryPoint(\"myIndexPoint\", InputName, string.Format(\"\
  Entering name: {0}\", InputName));\n}\nelse\n{\n    TextBox1.Text = InputName;\n\
  \    Page.Title = string.Format(\"Entering name: {0}\", InputName);\n}\n```\n\n\
  除了调用 `AddHistoryPoint()` 传递单个键值对外，你还可以使用 `NameValueCollection` 对象传递整个集合。在例例中，键 `myIndexPoint`\
  \ 被与 `TextBox1` 控件中的值一起使用，并且该名字也被用于页面标题。\n\n在完成这些代码后，你还必须为 `ScriptManager` 控件创建一个\
  \ `Navigate()` 方法，以指示在使用其中一个按钮时应该做什么：\n\n```\nprotected void ScriptManager1_Navigate(object\
  \ sender, HistoryEventArgs e)\n{\n    PopulateFields(e.State[\"myIndexPoint\"]);\n\
  }\n```\n\n在这里，你可以看到 `HistoryEventArgs` 为你提供了访问已注册项目的权限。\n\n现在运行此页面，依次输入名字并点击页面的按钮控件，你将在后退按钮选项列表中获得项目历史。你也可以导航回此项目（或者根据需要导航到前进项目），你将返回之前处理的页面。这个后退按钮的列表如图\
  \ 23-16 所示。\n\n\n\n\n\n# 图 23-16\n\n通过页面上的 URL，你可以看到状态是如何存储的。在这种情况下，你将得到类似下面的的内容：\n\
  \n```\n http://localhost:1315/Listing%2023-21.aspx#&&wqMi/gEg0K2EhqXXhZ/\n  AnMrZ5icHgZTHIkB2OLoKnWV/+5utJPEUUtMfqp9c3dYDB89CnH5SlUPmDYfcy2Q9V91S5tAKv9ulfKHf2h30dkw=\n\
  ```\n\n注意索引点在 URL 中是加密的。这是默认行为，尽管像 ASP.NET 中的大多数事物一样，你可以更改这种行为。要更改它，需要从 `ScriptManager`\
  \ 控件将 `EnableSecureHistoryState` 属性设置为 `False`。\n\n```\n <asp:ScriptManager ID=\"\
  ScriptManager1\" runat=\"server\" EnableHistory=\"True\"\n     OnNavigate=\"ScriptManager1_Navigate\"\
  \ EnableSecureHistoryState=\"False\">\n```\n\n部署此代码后，你将得到类似下面的 URL：\n\n```\nhttp://localhost:1315/Listing%2023-21.aspx#&&myIndexPoint=John+Adams\n\
  ```\n\n## 脚本合并\n\n默认情况下，ASP.NET AJAX 页面有时会为正在查看的页面下载多个不同的脚本。当它们被分开下载时，页面的整体性能会变差。\n\
  \n其原因是浏览器必须为页面上的每个脚本发送单独的请求。这意味着获取所有脚本的时间比一次性在一个较大的批处理中完成的时间要长。此外，单独调用脚本意味着交付给页面的整体负载比其他情况要大。\n\
  \nASP.NET 4.5 包含了将脚本合并为单个请求和响应的能力。这被称为*脚本合并*（script combining*）或*包处理*（bundling*）。该功能在第\
  \ 28 章中会有更深入的介绍。\n\n除此之外，你还可以通过页面上的 `ScriptManager` 服务器控件向 ASP.NET 指定你想要合并的脚本。诀窍在于找出哪些脚本需要合并，因为这并不总是那么显而易见的。\n\
  \n因此，互联网上有一个 Codelexlex 项目，为你提供了一个服务器控件，你可以将其放置在页面上帮助你解决这个问题。该服务器控件 `ScriptReferenceProfiler`\
  \ 提供了页面所需的脚本列表。你可以在以下地址找到此控件：\n\n```\n http://aspnet.codeplex.com/releases/view/13356\n\
  ```\n\n该项目已经几年没有更新了，当你点击图 23-17 中显示的链接之一时会收到错误消息，但除此之外，该项目对于确定使用 ASP.NET AJAX 脚本合并所需的脚本仍然非常方便。\n\
  \n![image](img/f892-01.jpg)\n\n# 图 23-17\n\n该项目以简单的 `.dll` 文件形式提供。在 Visual Studio\
  \ 的工具箱中右键点击，并从提供的菜单选择“选择项”（Choose Items）。然后会出现一个可以添加到工具箱的新控件对话框。点击“浏览”（Browse）按钮并导航到你刚刚下载的\
  \ `.dll` 文件。选中后，点击“确定”将其添加到你的控件集合中。完成后，你就可以准备创建一个示例页面，该页面将用于合并脚本以提高整体性能。代码列表 23-22\
  \ 展示了这个新页面。\n\n此简单页面使用 Ajax 根据端用户对页面的某些输入更新页面上的 `Label` 服务器控件。页面上的两个文本框控件请求端用户的姓名和当前日期。添加\
  \ `ScriptReferenceProfiler` 控件将在页面顶部添加几个 `@Register` 页面指令。\n\n运行页面，你将看到如下结果，如图 23-17\
  \ 所示。\n\n此页面为你提供了一份页面上正在调用的脚本列表。你现在可以使用页面上的 `ScriptManager` 控件，并指定这些脚本是你感兴趣通过 ASP.NET\
  \ 脚本合并功能加载的脚本。\n\n要完成此任务，从浏览器中的页面复制提供的配置脚本，并将此文本粘贴到 `ScriptManager` 控件中的 `<CompositeScript>`\
  \ 部分（参见代码列表 23-23）。\n\n现在在 `<CompositeScript>` 部分中定义所有这些脚本将意味着所有这些脚本将被合并并一起发送到页面，从而提高你的\
  \ ASP.NET 程序的整体性能。\n\n## 总结\n\nAjax 从根本上改变了 Web 应用程序开发的方法。ASP.NET AJAX 是一个很好的框架，它在\
  \ ASP.NET 站点范围内促进了多种 Ajax 功能，包括部分页面更新。你不需要为每个请求完全拆除并重建页面。相反，你可以在端用户请求时分节缓慢地重建页面。请注意，Microsoft\
  \ 将进一步支持 ASP.NET AJAX，但可能不会为其添加任何新功能。\n\n本章探讨了 ASP.NET AJAX 的核心。\n\n# 24 Ajax Control\
  \ Toolkit\n\n## 本章内容\n\n*   安装 Ajax Control Toolkit\n*   为你的页面添加交互和动画\n\n## WROX.COM\
  \ 下载\n\n请注意，本章中的所有代码示例都可以通过网站 `www.wrox.com` 的下载选项卡获取。\n\nASP.NET AJAX 应用在上一章中介绍。你可能会疑惑为什么\
  \ ASP.NET AJAX 只有这么多服务器控件，考虑到 ASP.NET Web Forms 高度依赖这种模块化方式。原因是 Microsoft 将它们作为开源项目处理，而不是直接将其到\
  \ Visual Studio 中。\n\nMicrosoft 和社区的开发者开发了一系列支持 Ajax 的服务器控件。最初，这些控件统称为 ASP.NET Control\
  \ Toolkit。然而，Microsoft 最终对该库进行了重新命名，使其听起来不像 ASP.NET 的一部分。它现在被称为 Ajax Control Toolkit，并托管在\
  \ Codelex 的 `http://ajaxcontroltoolkit.codlex.com/`。图 24-1\n\n# 图 24-1\n\n正如你在上一章记得的那样，ASP.NET\
  \ AJAX 是构建丰富 Web 应用的基础，但它没有模糊 Web 和桌面应用程序区别的丰富 UI 元素。ASP.NET AJAX 包含了一些强大的 ASP.NET\
  \ 控件，可以向现有应用程序添加 Ajax 功能，或为新应用程序构建更好的用户体验。然而，Ajax Control Toolkit 的开发是为了提供丰富的 ASP.NET\
  \ AJAX 控件，你可以使用这些控件让你的 Web 真正活跃起来。该工具包让应用程序的用户界面超出用户对 Web 应用程序的预期变得简单。\n\n该工具包是一个共享源代码项目，包含了来自\
  \ Microsoft 其他地方开发者的贡献。大多数使用 ASP.NET AJAX 的开发者都应该下载该工具包以获取包含的额外控件。之前提到的 Ajax Control\
  \ Toolkit 下载允许你下载带有控件和扩展程序的编译 `dll`，或者你可以下载源代码和项目文件并自行编译。无论何种方式，请按照下文所述将 `dll` 添加到\
  \ Visual Studio 的工具箱中。\n\n\n\n\n\n该工具包包含了一些具有 Ajax 功能的控件以及许多控件扩展器（extenders）。控件扩展器挂载到另一个控件上，以增强或“扩展”该控件的功能。由于这些控件涵盖了非常广泛的应用开发领域，我们选择涵盖的内容是按字母顺序列出的，且控件名称是通俗易懂的，以便您在以后参考本章内容时，轻松地找到所需的信息。\n\
  \n此外，请注意，该工具包项目正在进行中，并将随着开发者的贡献不断演进。本章的内容在编写时是最新的，但预计工具包将定期添加更多内容。第 25 章 介绍了一个真正的开源项目，该项目提供了类似的功能，但完全独立于微软技术。因此，虽然\
  \ Ajax Control Toolkit 与 ASP.NET 紧密结合，初次使用起来会简单一些，但你不应该错过接下来的章节，以查看一个维护良好的替代方案：`jQuery`。\n\
  \n## 下载与安装 AJAX CONTROL TOOLKIT\n\n由于 Ajax Control Toolkit 不是 Visual Studio 2012\
  \ 默认安装程序的一部分，你必须手动设置这些控件。再次，Control Toolkit 网站提供了几种选项。\n\nCodePlex 网站提供了适用于 .NET\
  \ 3.5、4.0 和 4.5 的 Ajax Control Toolkit 版本。本章重点关注如何在 Visual Studio 2012 和 .NET Framework\
  \ 4.5 中该工具包。你也可以完全跳过项目主页，使用 NuGet 将 Ajax Control Toolkit 添加到项目中：\n\n```\nInstall-Package\
  \ AjaxControlToolkit\n```\n\n如果你想在安装之前查看实际向项目中添加了什么，我们建议进行手动安装。要进行设置，请从上述网站 [`http://ajaxcontroltoolkit.codeplex.com/`](http://ajaxcontroltoolkit.codeplex.com/)\
  \ 下载 `.zip` 文件，并将其解压到你机器上的任意位置。然后按照以下步骤操作：\n\n1. **1.** 将控件安装到 Visual Studio。将控件添加到你的\
  \ Visual Studio 2012 工具箱非常简单。在工具箱中点击右键，并从提供的菜单中选择 `Add Tab`（添加选项卡）。按你想要命名标签卡——在本例中，该标签卡名为\
  \ `Ajax Controls`。\n2. **2.** 在工具箱中有了新标签卡后，右键点击该标签卡，并从提供的菜单中选择 `Choose Items`（选择项目），如图\
  \ 24-2 所示。出现“选择工具箱项”对话框。![image](img/f897-01.jpg)\n\n   **图 24-2**\n3. **3.** 从下载文件中选择\
  \ `AjaxControlToolkit.dll`。当你找到 DLL 并点击 `Open` 时，Visual Studio 2012 会首先询问你是否真的想从互联网安装内容（参见图\
  \ 24-3）。如果你同意，“选择工具箱项”对话框将变为包含此 DLL 中的控件。这些控件在对话框中被高亮显示，并已为你选中（如图 24-4 所示）。![image](img/f897-02.jpg)\n\
  \n   **图 24-3**\n\n   ![image](img/f897-03.jpg)\n\n   **图 24-4**\n4. **4.** 点击 `OK`，Ajax\
  \ Control Toolkit 的控件就会添加到你的 Visual Studio 工具箱中。图 24-5 展示了最终结果。![image](img/f898-01.jpg)\n\
  \n   **图 24-5**\n\n已有 40 多个控件和扩展器被添加到工具箱中，用于你的 ASP.NET 。\n\n## ASP.NET AJAX 控件\n\
  \n从控件工具包中提供的控件和扩展器数量很大。如前所述，你有 40 多个控件和扩展器可供使用。本节将介绍这些项目以及你如何在 ASP.NET 程序中运行它们。\n\
  \n当你向页面添加 ASP.NET AJAX 服务器控件时，你可能会注意到，若干关注于多种语言本地化的 DLL 已添加到你解决方案的 Bin 文件夹中。所有的资源文件都已组织在在该文件夹内的语言文件夹中。图\
  \ 24-6 展示了一个示例。\n\n![image](img/f898-02.jpg)\n\n**图 24-6**\n\n除了添加到项目中的本地化 DLL 之外，ASP.NET\
  \ AJAX 控件就像 ASP.NET 中的任何其他自定义服务器控件一样被添加的。列表 24-1 显示了在添加单个 ASP.NET AJAX 控件后，你的 ASP.NET\
  \ 页面应该是什么样子。\n\n在此示例中，你可以看到 ASP.NET AJAX 控件使用 `@Register` 指令在页面注册。该指令指向 `AJAXControlToolkit`\
  \ 程序集，并为所有使用此程序集引用的控件提供 `asp` 标签前缀。Visual Studio 2012 默认会将该引用添加到 `web.config` 中。\n\
  \n### Ajax 扩展器\n\n从工具包中可用的控件和扩展器数量很大。如前所述，你有 40 多个控件和扩展器可供使用。本节将查看这些项目以及你如何在 ASP.NET\
  \ 程序中运行它们。\n\n当你向页面添加 ASP.NET AJAX 服务器控件时，你可能会注意到，若干关注于多种语言本地化的 DLL 已添加到你解决方案的 Bin\
  \ 文件夹中。所有的资源文件都已组织在在该文件夹内的语言文件夹中。图 24-6 展示了一个示例。\n\n![image](img/f898-02.jpg)\n\n\
  **图 24-6**\n\n除了添加到项目中的本地化 DLL 之外，ASP.NET AJAX 控件就像 ASP.NET 中的任何其他自定义服务器控件一样被添加的。列表\
  \ 24-1 显示了在添加单个 ASP.NET AJAX 控件后，你的 ASP.NET 页面应该是什么样子。\n\n在此示例中，你可以看到 ASP.NET AJAX\
  \ 控件使用 `@Register` 指令在页面注册。该指令指向 `AJAXControlToolkit` 程序集，并为所有使用此程序集引用的控件提供 `asp`\
  \ 标签前缀。Visual Studio 2012 默认会将该引用添加到 `web.config` 中。\n\n### Ajax 扩展器\n\n你将查看的第一组项目包含了\
  \ Ajax Control Toolkit 的扩展器。扩展器基本上是伸出并扩展其他控件的控件。例如，你可以将 ASP.NET 验证控件（本书第 6 章）视为扩展器控件本身。例如，你可以向页面添加\
  \ `RequiredFieldValidator` 服务器控件并将其与 `TextBox` 控件关联。这扩展了 `TextBox` 控件并改变了它的行为。通常它只接受文本。现在，如果没有输入内容，它将向\
  \ `RequiredFieldValidator` 控件触发一个事件。\n\nAjax Control Toolkit 的扩展器实现了同样的功能。这些控件通过客户端额外的\
  \ JavaScript 以及一些服务器端通信来扩展 ASP.NET 控件的行为。\n\n### 始终控件\n\n在浏览器中显示信息时，你可能希望将某些信息固定在用户的视野中。屏幕空间是有限的资源，有时屏幕元素应该始终可用，而无需用户滚动。AlwaysVisibleControlExtender`\
  \ 允许你指定任何 ASP.NET 控件具有这种特性。你使用 `AlwaysVisibleControlExtender` 指定控件的位置，当用户滚动页面查看其他信息时，你指定的控件始终保持在视野内。当用户滚动屏幕或调整窗口大小时，它似乎在移动，从而在浏览器窗口的可视部分保持相对位置。\n\
  \n`AlwaysVisibleControlExtender` 只有六个属性。列表 24-2 展示了使用该控件的示例。\n\n此代码展示了一个非常长的表单，需要最终用户在浏览器中滚动。\n\
  \n\n\n\n\n`AlwaysVisibleControlExtender1` 控件通过 `TargetControlID` 属性扩展了 `Panel1`\
  \ 控件。在这种情况下，`TargetControlID` 属性的值指向 `Panel1` 控件。`Panel1` 控件包含表单的提交（Submit）按钮。代码列表\
  \ 24-2 中的代码结果如图 24-7 所示。\n\n![image](img/f901-01.jpg)\n\n**图 24-7**\n\n页面上提交（Submit）和清除（Clear）按钮的位置通过多个控件属性的组合来控制。页面上的位置由\
  \ `HorizontalSide`（可能值包括 `Center, Left` 和 `Right`）和 `VerticalSide` 属性决定（可能值包括 `Bottom,\
  \ Middle` 和 `Top`）。还使用 `HorizontalOffset` 和 `VerticalOffset` 属性在控件周围放置了内边距，在本例中，这两个属性都被设置为\
  \ `10` 像素。\n\n### AnimationExtender\n\n`AnimationExtender` 服务器控件提供了极其强大的功能。它允许你为放置在页面上的控件编写流畅的动画。你可以使用此控件做很多事情——比本章所展示的要得多。\n\
  \n此控件允许你根据特定的终端用户触发器（如点击按钮）编写可以在页面上移动的元素。提供了一些特定的事件供你为动画编写程序。这些事件如下：\n\n* `OnClick`\n\
  * `OnHoverOver`\n* `OnHoverOut`\n* `OnLoad`\n* `OnMouseOver`\n* `OnMouseOut`\n\n\
  创建动画并没有许多人想象的那么简单，因为它对 Visual Studio 的支持很少，例如缺乏向导甚至智能提示（IntelliSense）。关于创建第一个动画的示例，代码列表\
  \ 24-3](#Chapter24.xhtml_listing24-3)展示了如何根据用户的操作让元素在页面上淡入和淡出。\n\n在这种情况下，当你从代码列表\
  \ 24-3 打开页面时，你会发现它使用单一的 `AnimationExtender` 控件作用于 `Panel1` 控件。这种连接是通过使用 `TargetControlID`\
  \ 属性实现的。\n\n如所述，当你编写包含 `AnimationExtender` 控件内部的代码时，智能提示是不启用的，因此你需要查阅文档来你想要创建的动画。在上一个示例中，利用`<OnClick>`\
  \ 元素来定义当点击控件时需要发生的一系列事件。对于此示例，`<Sequence>` 元素中只定义了一个动画——元素背景的颜色变化。在这里，`<Color>`\
  \ 元素规定背景 CSS 属性将从颜色 `#999966` 开始，并在 `5` 秒内完全变为颜色 `#FFFFFF`（使用 `Duration` 属性定义）。\n\
  \n当你打开此页面并点击 Panel 元素时，你会看到颜色在 5 秒的持续时间内从描述的起始颜色变化到结束颜色。\n\n### AutoCompleteExtender\n\
  \n`AutoCompleteExtender` 控件允许你帮助终端用户在需要在文本框输入搜索词时找到他们可能想要的内容。这一功能如今用于许多搜索网站，它的作用是当你开始在文本框中输入字符时，从数据存储中获取结果，并以下拉列表的形式直接出现在正在操作的文本框下方，结果与你目前为止输入的内容匹配。\n\
  \n要为你自己建立类似的功能，请创建一个新页面，其中仅包含一个 `ScriptManager` 控件、一个 `AutoCompleteExtender` 控件和一个\
  \ `TextBox` 控件。页面的 ASP.NET 部分应如代码列表 24-4](#Chapter24.xhtml_listing24-4）所示（本章代码下载中的\
  \ `AutoCompleteExtender.aspx`）。\n\n同样，与其他 ASP.NET AJAX 控件一样，你使用 `TargetControlID`\
  \ 属性来扩展 `TextBox` 控件。当你首次将这些控件添加到页面时，在 `AutoCompleteExtender` 控件中尚未定义 `ServiceMethod`\
  \ 属性。使用 Visual Studio 2012，你可以从设计界面创建服务方法的框架，并将扩展器控件绑定到该方法。展开 `TextBox` 控件的智能标签后，从提供的菜单中选择“添加\
  \ AutoComplete 页面方法”选项，如图 24-8](#Chapter24.xhtml_figure24-8）所示。\n\n![image](img/f904-01.jpg)\n\
  \n**图 24-8**\n\n此操作会在页面的后台代码中创建一个服务方法。代码列表 24-5](#Chapter24.xhtml_listing24-5）（本章代码下载中的\
  \ `AutoCompleteExtender.aspx.vb` 和 `AutoCompleteExtender.aspx.cs`）显示了完成此方法所需的步骤，以便从微软经典的\
  \ Northwind 数据库调用公司名称。\n\n当你运行此页面并在文本框中输入字符 `ant` 时，会调用 `GetCompletionList()` 方法并传入这些字符。这些字符可以通过\
  \ `prefixText` 参数检索（你也可以使用 `count` 参数，其默认值为 `10`）。使用 `prefixText` 值调用 Northwind\
  \ 数据库，并将其返回给 `TextBox1` 控件。最后，你会得到一个与输入文本框的前三个字符匹配的项的下拉列表。如图 24-9](#Chapter24.xhtml_figure24-9）所示。\n\
  \n![image](img/f906-01.jpg)\n\n**图 24-9**\n\n最好知道结果在第一次调用后会被缓存。这种缓存通过 `EnableCaching`\
  \ 属性控制（默认值为 `true`）。你还可以更改自动补全列表的样式、配置显示的元素数量，以及通过此功能实现更多操作。另一个重要点是，你不需要调用与控件位于同一页的方法（如书中的示例所示），你也可以调用另一个页面上的服务器方法。\n\
  \n### BalloonPopupExtender\n\nAjax Toolkit 最受期待的功能之一一直是一个添加到元素的气泡状 界面。最后，从 2011\
  \ 年 11 月版的 Ajax Control Toolkit 开始，团队妥协并增加了此类控件。\n\n`BalloonPopupExtender` 为 `TargetControlID`\
  \ 引用的元素添加“气泡”。气泡实际的内容位于页面上的任意控件；扩展器的 `BalloonPopupControlID` 属性包含该控件的 ID。\n\n扩展器支持内置样式（`BalloonStyle`\
  \ 属性）和尺寸（`BalloonSize` 属性），以及自定义样式。代码列表 24-6](#Chapter24.xhtml_listing24-6）展示了一个为\
  \ `TextBox` 控件提供云状气泡的示例。\n\n当你点击文本框时，气泡就会出现，如图 24-10](#Chapter24.xhtml_figure24-10）所示。\n\
  \n![image](img/f907-01.jpg)\n\n**图 24-10**\n\n### CalendarExtender\n\n选择日期是许多应用程序共同的需求。它也是表单中最常见的阻碍表单提交的点之一。终端用户往往为了弄清楚表单所需的日期格式而降低速度。`CalendarExtender`\
  \ 控件允许你的终端用户在表单内轻松选择日期。`CalendarExtender` 附加到文本框并弹出一个用于选择日期的日历。默认情况下，日历在文本框获得焦点时显示，但如果你将\
  \ `PopupButtonID` 设置另一个控件的 ID，则在点击该控件时日历可见。\n\n\n\n\n\n在表单中设置快速日期选择的最佳方法是提供一个可以导航并允许快速选择日期的日历，然后该日期会被转换为文本框中的文本格式日期。`CalendarExtender`\
  \ 极其易于使用，只需要几个关键属性。`TargetControlID` 指向接收所选日期的文本框。`Format` 属性指定了文本框中日期输入的字符串格式。`CalendarExtender`\
  \ 控件为你提供了执行此类操作所需的所有客户端代码。代码列表 24-7 向你展示了在文本框控件之外提供一个日历控件的示例。\n\n当你运行此页面时，结果是页面上只有一个文本框，看起来与其他任何文本框并无异。然而，当端用户点击文本框内部时，日历会直接出现在其下方，如图\
  \ 24-11 所示。\n\n![image](img/f908-01.jpg)\n\n**图 24-11**\n\n然后，当端用户从日历中选择日期时，该日期将作为文本放置在文本框中。\n\
  \n此控件暴露的某些属性是 `FirstDayOfWeek` 和 `PopupPosition`（具有 `BottomLeft, BottomRight, TopLeft`\
  \ 和 `TopRight` 选项）。你还可以更改在客户端启动日历的方式。某些网站在文本框旁边提供日历按钮，只有当端用户点击按钮时才弹出日历选项。如果这是你想在页面上实现的功能，请使用\
  \ `PopupButtonID` 属性，你必须指向你正在使用的图像或按钮的 ID。\n\n### 折叠面板扩展器 (CollapsiblePanelExtender)\n\
  \n`CollapsiblePanelExtender` 服务器控件允许你将一个控件折叠到另一个控件中。当处理两个 `Panel` 服务器控件时，你可以提供一种良好的方法来控制可能在\
  \ ASP.NET 页面上遇到的任何空间布局问题。\n\n`CollapsiblePanelExtender` 与 `Accordion` 控件（在本章稍后介绍）类似，但它不是针对多个内容区域。ASP.NET\
  \ `panel` 控件根据用户与给定控件的交互来显示或隐藏。这允许你隐藏用户并不总是需要看到的内容。点击 `ExpandControlID` 时显示 `TargetControlID`，点击\
  \ `CollapseControlID` 时隐藏。或者，如果 `AutoCollapse` 和 `AutoExpand` 属性设置为 `True`，则可以根据鼠标悬停显示或隐藏。\n\
  \n代码列表 24-8 演示了如何使用 `CollapsiblePanelExtender` 在面板折叠时将其大小设置为 `0`，在展开时设置为 `300` 像素。另一个面板用作展开和折叠面板的选择器。此外，还包含一个被指定为\
  \ `TextLabelID` 的标签。`Label` 控件的值根据当前状态在 `ExpandedText` 和 `CollapsedText` 值之间更改。\n\
  \n在这种情况下，当页面首次打开时，你将只看到 `Panel1` 的内容——标题面板。默认情况下，通常会看到两个控件，但由于控件中的 `Collapsed` 属性设置为\
  \ `True`，你只能看到 `Panel1`。点击 `Panel` 控件将显示 `Panel2` 的内容。事实上，内容将从 `Panel1` 控件滑出。将这两个控件绑定以执行此操作是通过使用\
  \ `CollapsiblePanelExtender` 控件实现的。此控件的 `TargetControlID` 被分配给第二个 `Panel` 控件——`Panel2`，因为这是需要扩展到页面上的控件。`ExpandControlID`\
  \ 属性是触发展开的控件。\n\n一旦展开，当端用户点击 `Panel2` 时，内容将通过滑回 `Panel1` 消失。这是通过将 `CollapseControlID`\
  \ 属性分配给 `Panel2` 实现的。\n\n`CollapsiblePanelExtender` 控件具有许多属性，允许你精细调整展开和折叠发生的方式。例如，你还可以将\
  \ `Label1` 控件设置为此过程的启动器，并根据 `Panel2` 是折叠还是展开来更改 `Label` 控件的文本。\n\n### 颜色选择器扩展器 (ColorPickerExtender)\n\
  \n从端用户处获取困难的数据点之一是颜色。如果你只使用文本，这个特定的数据点很难定义。如果你有一个开放的颜色选择，端用户如何定义更深的蓝色？由于这个原因，你有了\
  \ `ColorPickerExtender`，可以快速轻松地将类似 `TextBox` 的控件扩展为一种让此选择过程轻而易举的工具。代码列表 24-9 显示了完成此任务的快速简单的方法。\n\
  \n当此页面打开时，你只需在页面上有一个 `TextBox` 服务器控件。对此 `TextBox` 控件应用焦点将弹出颜色选择器，如此处黑白所示的图 24-12\
  \ 所示。\n\n![image](img/f911-01.jpg)\n\n**图 24-12**\n\n端用户随后可以滚动颜色选项，在用户选择这些颜色之一后，弹出窗口消失，十六进制颜色代码显示在\
  \ `TextBox` 中。这如图 24-13 所示。\n\n![image](img/f911-02.jpg)\n\n**图 24-13**\n\n### 确认扩展器\
  \ (ConfirmExtender) 与 模态扩展器 (PopupExtender)\n\n通常在允许端用户通过浏览器删除数据之前，你想向端用户确认此类操作。`ConfirmExtender`\
  \ 允许你询问端用户以确认其是否想要执行该操作。在这种情况下，`ConfirmExtender` 扩展了 `Button1` 并使用 `ConfirmText`\
  \ 属性添加了一个对话框。图 24-14 显示了此页面。\n\n![image](img/f912-01.jpg)\n\n**图 24-14**\n\n如果端用户点击确定，页面将正常运行，就像对话框从未出现过一样。然而，如果点击取消，默认情况下对话框消失，表单不会提交（就像按钮没有被点击过一样）。在这种情况下，你还可以通过使用\
  \ `OnClick` 事件并赋予客户端函数值来捕捉取消点击并执行客户端操作。\n\n与其使用浏览器的模态对话框，你甚至可以创建自己的作为确认表单。为了完成此任务，你需要使用\
  \ `ModalPopupExtender` 服务器控件。`ModalPopupExtender` 控件指向另一个控件用于确认。`ModalPopupExtender`\
  \ 在用户处理模态对话框之前阻止用户与底层页面交互。它与 `HoverMenuExtender` 非常相似，不同在于用户必须先处理 `PopupControlID`\
  \ 指定的控件才能继续。它具有指定 `OkControlID` 和 `CancelControlID` 的属性，以及根据用户选择运行的 `OnOkScript`\
  \ 和 `OnCancelScript` 属性。代码列表 24-11 显示了如何使用此控件。\n\n\n\n\n\n`ModalPopupExtender` 控制反过来通过\
  \ `PopupControlID` 属性引用了页面上的 `Panel1` 控件。此 `Panel` 控件的内容用于按钮点击时的确认。为了实现此功能，`ModalPopupExtender`\
  \ 控制必须为 `OkControlID` 和 `CancelControlID` 属性赋值。在这种情况下，这两个属性指向包含在 `Panel` 控件中的两个\
  \ `Button` 控件。当你运行此页面时，将得到如图 24-15 所示的结果。\n\n![image](img/f913-01.jpg)\n\n**图 24-15**\n\
  \n### DragPanelExtender\n\n`DragPanelExtender` 允许你定义某些区域，终端用户可以根据自己的意愿在页面上移动元素。终端用户实际上具有将元素拖动到浏览器页面上任何地方的能力。\n\
  \n要启用此功能，你必须执行几件事。第一个建议是在页面上创建一个足够大的 `<div>` 区域，以便在其中拖动项目。从这里开始，你需要指定将什么用作拖动手，以及另一个将跟随拖动手移动的控件。在代码列表\
  \ 24-12 的示例中，`Label` 控件被用作拖动手，而 `Panel2` 控件是在屏幕上拖动的内容。\n\n此示例创建了一个高度为 `600` 像素的\
  \ `<div>` 元素。在定义的区域内，示例使用了 `DragPanelExtender` 控件，并通过将 `TargetControlID` 属性分配给该控件来目标指向\
  \ `Panel1` 控件。\n\n`Panel1` 控件内部还有两个服务器控件——一个 `Label` 和另一个 `Panel` 控件。使用 `DragPanelExtender`\
  \ 控件的 `DragHandleID` 属性将 `Label` 控件分配为拖动手。有了这些少量代码，你现在可以在你的浏览器窗口中拖动 `Panel1` 控件了。图\
  \ 24-16 显示了使用 `Label` 控件作为手柄来拖动 `Panel` 控件。\n\n![image](img/f914-01.jpg)\n\n**图\
  \ 24-16**\n\n### DropDownExtender\n\n`DropDownExtender` 控制允许你获取任何控件并在下方提供一个下拉选项列表供选择。它提供了一个与典型的下拉列表控件不同的框架，因为它允许极程度的自定义。代码列表\
  \ 24-13 显示了你甚至可以使用图像作为下拉选项列表的触发器。\n\n在这种情况下，`DropDownExtender` 控件绑定到一个 `Image` 控件，该控件在\
  \ `Page_Load()` 事件中显示特定的图像。`DropDownExtender` 控制有两个需要填充的特定属性。第一个是 `TargetControlID`\
  \ 属性，定义了作为下拉列表触发器的控件。第二个属性是 `DropDownControlID` 属性，它定义了页面上用于控件下方出现的下拉项目的元素。在这种情况下，它是一个带有三个\
  \ `LinkButton` 控件的 `Panel` 控件。\n\n每个 `LinkButton` 控件指定了一个应显示在页面上的特定图像。选择选项之一将通过\
  \ `Option_Click()` 方法更改图像。运行此页面将给你如图 24-17 所示的结果。\n\n![image](img/f916-01.jpg)\n\
  \n**图 24-17**\n\n### DropShadowExtender\n\n`DropShadowExtender` 允许为页面上的 ASP.NET\
  \ 面板或图像添加阴影效果。设置 `TargetControlID`，然后你可以控制 `Width` 和 `Opacity`，以及角落是否为 `Rounded`。如果面板可以移动或调整大小，还可以将\
  \ `TrackPosition` 属性设置为 `True`，以指示运行 JavaScript 来跟踪面板并在需要时更新阴影。\n\n你对使用它的第一个想法可能是图像（如代码列表\
  \ 24-14 所示），但你可以将其用于任何需要的控件。\n\n在此示例中，实现这一点简单只需使用一个 `TargetControlID` 为 `Image1`\
  \ 的 `DropShadowExtender` 控件。完成后，图像将显示在浏览器中，如图 24-18 所示。\n\n![image](img/f917-01.jpg)\n\
  \n**图 24-18**\n\n如所述，除了图像外，你还可以将 `DropShadowExtender` 用于任何地方。代码列表 24-15 显示了如何配合\
  \ `Panel` 控件使用它。\n\n在这种情况下，带有 `Login` 控件的 `Panel` 控件使用 `DropShadowExtender` 控件进行了扩展。结果与图像控件的结果非常相似。然而，这里\
  \ `DropShadowExtender` 控件的一个额外设置是 `Rounded` 属性被设置为 `True`（默认情况下为 `False`）。\n\n![image](img/f913-01.jpg)\n\
  \n**图 24-19**\n\n\n\n\n\n此代码是 `DynamicPopulateExtender.aspx` 页面的后置代码（code-behind），包含一个可以异步调用的单个方法。`GetDynamicContent()`\
  \ 方法接收一个参数 `contextKey`，这是一个字符串值，用于确定终端用户点击了哪个链接。\n\n根据选择，将使用一个特定的命令字符串来填充 `DataTable`\
  \ 对象。从这里开始，`DataTable` 对象被用作程序化 `GridView` 控件的数据源，该控件被渲染并作为字符串返回给客户端。客户端将获取此长字符串并使用该文本填充页面上的\
  \ `Panel1` 控件。插图 24-20 显示了点击其中一个链接后的结果。\n\n![image](img/f922-01.jpg)\n\n图 24-20\n\
  \n### FilteredTextBoxExtender\n\n`FilteredTextBoxExtender` 控件最初由本章作者提供，它根据 `TextBox`\
  \ 控件工作，指定终端用户可以输入控件的字符类型。例如，如果你希望终端用户只能在文本框中输入数字，你可以将 `FilteredTextBoxExtender`\
  \ 与 `TextBox` 控件关联并指定此类行为。列表 24-18 展示了此方面的示例。\n\n在这种情况下，通过使用 `TargetControlID` 属性将\
  \ `FilteredTextBoxExtender` 控件附加到 `TextBox1` 控件。`FilteredTextBoxExtender` 控件有一个名为\
  \ `FilterType` 的属性，其可能值为 `Custom`（自定义）、`LowercaseLetters`（小写字母）、`Numbers`（数字）和 `UppercaseLetters`（大写字母）。\n\
  \n此示例使用了 `Numbers` 数值，这意味着文本框中只能输入数字。如果终端用户尝试输入任何其他类型的信息，什么都不会发生——在终端用户看来就像按键没有生效。\n\
  \n`FilteredTextBoxExtender` 控件还暴露了 `FilterMode` 和 `InvalidChars` 属性。以下是使用这两个属性的示例：\n\
  \n```\n <asp:FilteredTextBoxExtender ID=\"FilteredTextBoxExtender1\" runat=\"server\"\
  \n    TargetControlID=\"TextBox1\" InvalidChars=\"*\" FilterMode=\"InvalidChars\"\
  >\n  </asp:FilteredTextBoxExtender>\n```\n\n`FilterMode` 属性的默认值为 `ValidChars`。当设置为\
  \ `ValidChars` 时，控件根据 `FilterType` 属性工作，仅允许该属性定义的内容。当设置为 `InvalidChars` 时，你将使用 `InvalidChars`\
  \ 属性并将字符放在此处（多个字符全部在一起，中间没有空格或项目分隔符）。\n\n### HoverMenuExtender\n\n`HoverMenuExtender`\
  \ 控件允许你在终端用户悬停在另一个控件上时在屏幕上显示一个隐藏控件。这意味着你可以构建复杂的工具提示，或者在终端用户悬停在应用程序某处时提供额外功能。\n\n\
  一个示例是更改 `ListView` 控件，使得当终端用户悬停在产品名称上时，该行数据的编辑按钮会出现在屏幕上。将扩展器添加到 `ListView` 控件的 `<ItemTemplate>`\
  \ 中的完整代码显示在 列表 24-19 中。\n\n在这里，`HoverMenuExtender` 控件附加到 `ID` 为 `ProductNameLabel`\
  \ 的 `Label` 控件，该控件出现在 `ListView` 控件的每一行中。这是使用 `TargetControlID` 属性实现的，而 `PopupControlID`\
  \ 属性用于指定在用户鼠标悬停在目标控件上动态显示的控件。\n\n`HoverMenuExtender` 控件暴露了多个控制弹出样式和行为的属性。此示例使用了\
  \ `PopDelay` 属性，它提供了一种延迟弹出事件的手段（以毫秒为单位）。`OffsetX` 和 `OffsetY` 属性根据目标控件指定弹出框的位置。在这种情况下，偏移量被设置为\
  \ `-50`（像素）。插图 24-21](#Chapter24.xhtml_figure24-21) 显示了操作结果。\n\n![image](img/f925-01.jpg)\n\
  \n图 24-21\n\n### ListSearchExtender\n\n`ListSearchExtender` 控件扩展了 `ListBox` 或 `DropDownList`\
  \ 控件，尽管在 Opera 和 Safari 等浏览器中的效果并不总是是最好的。此扩展器允许你对位于这些控件中的大型集合提供搜索功能。这减轻了终端用户需要搜索集合以找到他们寻找的项目的需求。\n\
  \n当使用它时，扩展器会在控件上方的区域添加搜索文本，显示终端用户为搜索而输入的字符。列表 24-20 显示了此扩展器的用法。\n\n在这种情况下，`ListSearchExtender`\
  \ 控件使用的唯一属性是 `TargetControlID` 属性，用于关联它扩展的控件。运行此页面将产生插图 24-22](#Chapter24.xhtml_figure24-22)\
  \ 所示的结果。\n\n![image](img/f926-01.jpg)\n\n图 24-22\n\n然后，作为终端用户，当你开始打字时，你会在控件下方看到你输入的内容（如插图\
  \ 24-23](#Chapter24.xhtml_figure24-23) 所示）。\n\n![image](img/f926-01.jpg)\n\n图 24-23\n\
  \n### MaskedEditExtender and MaskedValidator\n\n`MaskedEditExtender` 控件与 `FilteredTextBoxExtender`\
  \ 类似，它们都限制终端用户输入特定的文本。它通过为终端用户提供文本框内的模板更了一步。`MaskType` 提供了放置在文本框上的掩码类型。可能值包括：\n\n\
  - `None`：不执行验证。\n- `Date`：日期验证。\n- `DateTime`：日期和时间验证。\n- `Number`：数字验证。\n- `Time`：时间验证。\n\
  \n列表 24-21 提供了使用这两个控件的示例。在这种情况下，`MaskedEditExtender` 控件使用 `TargetControlID` 与 `TextBox1`\
  \ 控件关联。`Mask` 属性指定数字所需的模板。在这种情况下，`Mask` 属性设置为 `999`。这意味着所有数字长度均为三位。\n\n将 `999` 作为\
  \ `Mask` 属性的值意味着当终端用户在文本框中输入值时，将看到三个下划线。插图 24-24](#Chapter24.xhtml_figure24-24)\
  \ 显示了输入项目的模板。\n\n![image](img/f927-01.jpg)\n\n图 24-24\n\n如果将 `Mask` 属性更改为 `99,999.99`\
  \ 如下所示：\n\n```\n <asp:MaskedEditExtender ID=\"MaskedEditExtender1\" runat=\"server\"\
  \n   TargetControlID=\"TextBox1\" MaskType=\"Number\" Mask=\"99,999.99\">\n  </asp:MaskedEditExtender>\n\
  ```\n\n文本框模板出现了，如插图 24-25](#Chapter24.xhtml_figure24-25) 所示。\n\n![image](img/f927-02.jpg)\n\
  \n图 24-25\n\n从插图 24-25](#Chapter24.xhtml_figure24-25) 可以看到模板中存在逗号和句号。当终端用户输入时，不需要重复输入这些值。光标会自动移动到下一个所需的数字部分。\n\
  \n\n\n\n正如你从 `Mask` 属性值看到的，数字由数字 `9` 表示。在与其他 `MaskType` 值一起工作时，你还需要注意其他掩码字符：\n\n\
  * `9`: 仅限数字字符\n* `L`: 仅限字母\n* `$`: 仅限字母或空格\n* `C`: 仅限自定义字符（区分大小写）\n* `A`: 仅限字母或自定义字符\n\
  * `N`: 仅限数字或自定义字符\n* `?`: 任意字符\n\n除了字符规范外，模板还使用了分隔符，详细见下列表：\n\n* `/` 是日期分隔符。\n*\
  \ `:` 是时间分隔符。\n* `.` 是小数点分隔符。\n* `,` 是千分位分隔符（位分隔符）。\n* `\\` 是转义字符。\n* `{` 是掩码重复的起始分隔符。\n\
  * `}` 是掩码重复的结束分隔符。\n\n使用这些项目中的某些，你可以轻松更改 `MaskedEditExtender` 来处理 `DateTime` 值：\n\
  \n```asp\n <asp:MaskedEditExtender ID=\"MaskedEditExtender1\" runat=\"server\"\n\
  \   TargetControlID=\"TextBox1\" MaskType=\"DateTime\" Mask=\"99/99/9999 99:99:99\"\
  >\n  </asp:MaskedEditExtender>\n```\n\n为此在文本框中创建的模板所示图 24-26。\n\n![image](img/f928-01.jpg)\n\
  \n**图 24-26**\n\n`MaskedEditExtender` 控件有很多暴露的属性，用于控制和操作文本框的行为和样式。`MaskedEditExtender`\
  \ 控件可以与 `MaskedEditValidator` 控件配合使用，后者为文本控件提供验证。\n\n在之前的示例中，验证是通过 `MaskedEditValidator`\
  \ 控件的实例实现的：\n\n```asp\n <asp:MaskedEditValidator ID=\"MaskedEditValidator1\" runat=\"\
  server\"\n   ControlExtender=\"MaskedEditExtender1\" ControlToValidate=\"TextBox1\"\
  \n   IsValidEmpty=\"False\" EmptyValueMessage=\"需要三位数字！\"\n   Display=\"Dynamic\"\
  ></asp:MaskedEditValidator>\n```\n\n此控件使用 `ControlExtender` 属性将其与 `MaskedEditExtender`\
  \ 控件关联，并使用 `ControlToValidate` 属性监控表上的特定控件。默认情况下，`IsValidEmpty` 属性设置为 `True`。将其更改为\
  \ `False` 意味着必须在文本框中输入某些值才能通过验证，而不会收到 `EmptyValueMessage` 属性中的错误消息。\n\n触发 `MaskedEditValidator`\
  \ 控件会得到类似图 24-27 中所示的消息。请记住，你可以以许多方式对控件进行样式设置，产生你所需的验证消息外观。\n\n![image](img/f928-02.jpg)\n\
  \n**图 24-27**\n\n### MutuallyExclusiveCheckBoxExtender\n\n通常，你希望提供一组行为上类似于单选框按钮的复选框列表。也就是说，当你有一组复选框时，你希望最终用户从提供的项目列表中仅选择一个。\n\
  \n使用 `MutuallyExclusiveCheckBoxExtender` 控件，你可以执行此类操作。列表 24-22 向你展示了如何完成此任务。\n\n\
  将 `MutuallyExclusiveCheckBoxExtender` 控件与 `CheckBoxList` 控件关联是不可能的；因此，需要如前面的代码所示，用\
  \ `CheckBox` 控件布局每个复选框。页面上的每个 `CheckBox` 控件都需要一个 `MutuallyExclusiveCheckBoxExtender`\
  \ 控件。\n\n你通过使用 `Key` 属性形成 `CheckBox` 控件组。你希望在一组中的所有复选框需要具有相同的 `Key` 值。在列表 24-22\
  \ 的示例中，所有复选框共享 `Key` 值 `MyCheckboxes`。\n\n运行此页面将得到一个包含四个复选框的列表。当你选择一个复选框时，会出现一个标记。然后，当你选择另一个复选框时，你选择的第一个复选框会被取消。最棒的部分是，你甚至可以取消组中已选的内容，从而在复选框组中不选择任何项。\n\
  \n### NumericUpDownExtender\n\n`NumericUpDownExtender` 控件允许你在 `TextBox` 控件旁边放置一些上下指示器，允许最终用户更轻松地控制选择（类似于\
  \ HTML5 的 `<input type=\"number\">` 元素）。\n\n此内容的简单示例在列表 24-23 所示。\n\n这里的 `NumericUpDownExtender`\
  \ 控件扩展了页面上的 `TextBox` 控件。在使用 `NumericUpDownExtender` 控件时，必须使用 `Width` 属性指定控件的宽度。否则，你只会看到向上和向下箭头而不是文本框区域。在这种情况下，`Width`\
  \ 属性设置为 `150`（像素）。`Maximum` 和 `Minimum` 属性提供了范围。这里的`NumericUpDownExtender` 控件扩展了页面上的\
  \ `TextBox` 控件。在使用 `NumericUpDownExtender` 控件时，必须使用 `Width` 属性指定控件的宽度。否则，你只会看到向上和向下箭头而不是文本框区域。在这种情况下，`Width`\
  \ 属性设置为 `150`（像素）。`Maximum` 和 `Minimum` 属性提供了范围。\n\n\n\n`ResizableControlExtender`\
  \ 控件允许你获取一个 `Panel` 控件，并让最终用户通过抓取柄来更改元素的大小。你放入 `Panel` 控件中的任何内容都将根据最终用户扩展项目的方式而改变大小。为了实现这一功能，你还需要创建一个句柄，供用户进行拉伸或收缩项目的操作。\n\
  \n使用 `HandleCssClass` 属性可以指定用户选择开始调整面板大句柄的外观样式信息。`ResizableCssClass` 属性则指向面板正在更改时显示的样式信息。\n\
  \n该控件还暴露了可以触发的事件，你可以在这些事件上附加代码来响应面板的大小调整：`OnClientResizeBegin`、`OnClientResizing`\
  \ 以及最后的 `OnClientResize`。这些事件对于某些操作非常有用，例如：更改文本大小、在面板放大时获取额外数据，或者在面板缩小时隐藏某些元素。Listing\
  \ 24-27 是一个在页面中内联 CSS 信息的情况下使用 `ResizableControlExtender` 的示例。该示例展示了如何结合图像使用 `ResizableControlExtender`。\n\
  \n在这个示例中，`ResizableControlExtender` 控件依赖 CSS 来创建供用户抓取的句柄，以便调整 `Panel` 控件的大小。`TargetControlID`\
  \ 属性指向要调整大小的控件。\n\n`ResizableControlExtender` 控件中有两个 CSS 引用。一个处理控件位于屏幕上且没有任何最终用户交互时的状态。这实际上是为了向最终用户显示其具有调整元素的能力。这是通过\
  \ `HandleCssClass` 属性实现的。该属性的值指向同一文件中的 CSS 类 `handle`。第二个 CSS 引用处理控件被点击并按住时的状态（即当最终用户没有松开执行的鼠标点击时）。这是通过\
  \ `ResizableCssClass` 属性实现的。该属性的值指向 CSS 类 `resizable`。\n\n编译并运行代码后，将生成与 Figure 24-32\
  \ 所示相同的页面。\n\n![image](img/f935-01.jpg)\n\n**FIGURE 24-32**\n\n你可以从顶部的截图中看到在没有最终用户交互时图像的样子。在这种情况下，图像右下角有一个黑色正方形（由\
  \ CSS 定义）。底部的截图显示了当最终用户抓取句柄并开始更改图像形状时发生的情况。\n\n### RoundedCornersExtender\n\n`RoundedCornersExtender`\
  \ 控件允许你在页面上的元素上添加圆角。与 `ResizableControlExtender` 控件一样，你将感兴趣要处理的元素放入 `Panel` 控件中。Listing\
  \ 24-28 展示了如何使用登录服务器控件来实现这一操作。\n\n在这里，`RoundedCornersExtender` 控件简单地通过 `TargetControlID`\
  \ 属性指向 `Panel` 控件。此 `Panel` 控件具有橙色背景，以显示圆角确实是圆的。这段代码的结果在 Figure 24-33 中所示。\n\n![image](img/f936-01.jpg)\n\
  \n**FIGURE 24-33**\n\n你可以使用 `RoundedCornersExtender` 控件的 `Radius` 属性来控制圆角的程度。默认情况下，此属性被设置为值\
  \ `5`。你甚至可以使用 `Corners` 属性选择你想要圆角的角。`Corners` 属性的可能值包括 `All`、`Bottom`、`BottomLeft`、`BottomRight`、`Left`、`None`、`Right`、`Top`、`TopLeft`\
  \ 和 `TopRight`。\n\n### SliderExtender and MultiHandleSliderExtender\n\n`SliderExtender`\
  \ 控件实际上扩展了 `TextBox` 控件，使其看起来完全完全不同。这个 Ajax Control Toolkit 控件允许你创建一个真正的滑块控件，允许最终用户使用鼠标选择数字范围，而不是输入数字。Listing\
  \ 24-29 展示了使用滑块的简单示例。\n\n这段将 `SliderExtender` 控件连接到典型 `TextBox` 控件的小代码非常简单，并生成了\
  \ Figure 24-34 所示的结果。\n\n![image](img/f936-02.jpg)\n\n**FIGURE 24-34**\n\n这虽然很好，但最终用户很难判断他们选择的是哪个数字。因此，你可能发现给最终用户提供一个指示器更好。在页面上添加一个\
  \ `Label` 控件（称为 `Label1`）并将 `SliderExtender` 控件包含 `BoundControlID` 属性，可以给你你需要的指示器。以下是此更改的代码：\n\
  \n```\n <asp:SliderExtender ID=\"SliderExtender1\" runat=\"server\" TargetControlID=\"\
  TextBox1\"\n   BoundControlID=\"Label1\">\n  </asp:SliderExtender>\n```\n\n这个微小的变化产生了\
  \ Figure 24-35 所示的结果（页面上带有适当的 `Label` 控件）。\n\n![image](img/f937-01.jpg)\n\n**FIGURE\
  \ 24-35**\n\n现在当用户滑动句柄时，他们可以看到他们正在使用的数字。`SliderExtender` 有以下可用属性：\n\n*   `Decimal`：允许你指定结果应取的小数。\n\
  *   `HandleCssClass`：用于设计句柄的 CSS 类。\n*   `HandleImageUrl`：用于表示句柄的图像文件。\n*   `Length`：滑块的像素长度。默认值为\
  \ `150`。\n*   `Maximum`：滑块中表示的最大值。默认值为 `100`。\n*   `Minimum`：滑块中表示的最小值。默认值为 `0`。\n\
  *   `Orientation`：滑块的方向。可能值包括 `Horizontal` 和 `Vertical`。默认值为 `Horizontal`。\n*  \
  \ `RailCssClass`：用于设计轨的 CSS 类。\n*   `ToolTipText`：当用户悬停在滑块上时的提示文本。在文本中使用 `0` 可以向用户显示滑块的位置。\n\
  \n`MultiSliderExtender` 基本上是相同的，但这个特定的扩展器允许你为用户提供多个句柄。如果你需要一个可以允许最终用户选择范围或最小值/最大值的滑块，这将非常好。\n\
  \n### SlideShowExtender\n\n`SlideShowExtender` 控件允许你在浏览器中放入图像幻灯片。幻灯片控件允许最终用户移动到上一张或下一张图像，也可以作为幻灯片简单播放图像，每张图像之间有定义的等待时间。Listing\
  \ 24-30（本章代码下载中的 SlideShowExtender.aspx）展示了创建幻灯片的示例。\n\n`SlideShowExtender` 控件有很多可用属性。你可以使用\
  \ `ImageTitleLabelID` 和 `ImageDescriptionLabelID` 属性指定你定义图像标题和描述的位置。此外，此页面包含三个按钮控件：一个作为上一个按钮，另一个作为下一个按钮，最后一个作为播放按钮。然而，需要注意的是，当播放按钮被点击时（以开始播放幻灯片）时，它会变成停止按钮。\n\
  \n`SlideShowServiceMethod` 属性非常重要，因为它指向返回幻灯片部分图像的服务器端方法。在这种情况下，它指的是一个名为 `GetSlides`\
  \ 的方法。\n\n\n\n\n在代码后（code-behind）准备完成后，`SlideShowExtender` 有一个用于调用照片的服务器端方法。该方法称为\
  \ `GetSlides()`，返回 `Slide` 对象的数组，这些对象需要对象的位置（路径）、标题和描述。运行此页面时，你将得到与图 24-36 中所示相似的结果。\n\
  \n![image](img/f939-01.jpg)\n\n**图 24-36**\n\n点击页面上的播放（Play）按钮将旋转图像直到完成。除非你将 `SlideShowExtender`\
  \ 控件的 `Loop` 属性设置为 `True`，否则它们不会循环播放。（默认设置为 `False`。）\n\n另一个需要注意的重要属性是 `PlayInterval`\
  \ 属性。该属性的值是一个整数，表示浏览器切换到图像系列中下一张照片所花费的毫秒。默认情况下，该值设置为 `3000` 毫秒。\n\n### TextBoxWatermarkExtender\n\
  \n`TextBoxWatermarkExtender` 控件允许你在控件内为最终用户提供说明，从而让他们更好地理解该控件的用途。这可以是文本，甚至是图像（当使用\
  \ CSS 时）。列表 24-32 显示了与 `TextBox` 服务器端控件配合此控件的示例。\n\n在这种情况下，`TextBoxWatermarkExtender`\
  \ 控件与一个简单的 `TextBox` 控件关联，并使用 `WatermarkText` 属性提供将出现在实际 `TextBox` 控件内部的文本。图 24-37\
  \ 显示了此列表代码的结果。\n\n![image](img/f940-01.jpg)\n\n**图 24-37**\n\n图 24-37 图像中的文本是 `TextBox`\
  \ 控件内部的没有任何样式的纯文本。当最终用户点击 `TextBox` 控件内部时，文本将消失，光标将正确放置在文本框的开头。\n\n要对用作占位符标记的内容应用某些样式，你可以使用\
  \ `WatermarkCssClass` 属性。你可以更改代码以包含一些样式，如列表 24-33 所示。\n\n这次，使用了 `WatermarkCssClass`\
  \ 属性并指向页面上的内联 CSS 类 `watermark`。当你运行此页面时，你将看到如图 24-38 所示的样式。\n\n![image](img/f941-01.jpg)\n\
  \n**图 24-38**\n\n### ToggleButtonExtender\n\n`ToggleButtonExtender` 控件与 `CheckBox`\
  \ 控件配合使用，允许你使用自己的图像代替 `CheckBox` 控件通常使用的标准选框图像。使用 `ToggleButtonExtender` 控件，你可以为已选中、未选中和禁用状态指定图像。列表\
  \ 24-34 显示了使用此控件的示例。\n\n此页面有两个 `CheckBox` 控件。每个选框都有关联的 `ToggleButtonExtender` 控件，以及一个\
  \ `MutuallyExclusiveCheckBoxExtender` 控件用于将两个选框绑定。`ToggleButtonExtender` 控件使用 `CheckedImageUrl`\
  \ 和 `UncheckedImageUrl` 属性来指定使用的适当图像。如果，如果用户的浏览器实例禁用了图像，则将使用 `CheckedImageAlternateText`\
  \ 和 `UncheckedImageAlternateText` 属性提供的文本。你还需要为 `ImageWidth` 和 `ImageHeight` 属性指定值，以便页面运行。\n\
  \n运行此页面你将得到与图 24-39 所示相似的结果。\n\n![image](img/f942-01.jpg)\n\n**图 24-39**\n\n###\
  \ UpdatePanelAnimationExtender\n\n在 `UpdatePanel` 内容刷新时对其进行动画是一个常见场景。`UpdatePanelAnimationExtender`\
  \ 允许你使用工具包中提供的系列动画，并在指定的 `UpdatePanel` 正在更新或更新完成后自动协调播放这些动画。\n\n`UpdatePanelAnimationExtender`\
  \ 控件允许你针对两个特定事件为 `Panel` 控件应用动画。第一个是 `OnUpdating` 事件，第二个是 `OnUpdated` 事件。然后你可以使用\
  \ Ajax Control Toolkit 提供的动画框架根据这两个事件更改页面的样式。列表 24-35 显示了当最终用户点击页面上 `UpdatePanel`\
  \ 控件包含的 `Calendar` 控件中的特定日期时使用 `OnUpdated` 事件的示例。\n\n通过这段代码，当你点击 `Calendar` 控件中的日期时，持有日历的\
  \ `UpdatePanel` 的整个背景将从一种颜色变为另一种颜色，持续你构建的动画中指定的 5 秒。你定义的动画可以变得复杂，构建豪华动画超出了本节的范围。\n\
  \n### ValidatorCalloutExtender\n\n最后一个最后一个扩展器控件是 `ValidatorCalloutExtender`。该控件允许你为处理表单的最终用户添加更明显的验证消息。你不是将此控件与正在验证的控件关联，而是与验证控件本身关联。将\
  \ `ValidatorCalloutExtender` 与 `RegularExpressionValidator` 关联的示例见列表 24-36。\n\n\
  此页面有一个表单的单文本框、一个提交按钮和一个 `RegularExpressionValidator` 控件。你像往常一样构建 `RegularExpressionValidator`\
  \ 控件，但你使用了 `Display` 属性并将其设置为 `None`。你不希望普通的 ASP.NET 验证控件也显示其消息，因为这将与使用 `ValidatorCalloutExtender`\
  \ 控件显示的消息冲突。尽管 `Display` 属性设置为 `None`，但你仍然使用 `ErrorMessage` 属性来提供错误消息。运行此页面产生如图\
  \ 24-40 所示的结果。\n\n![image](img/f944-01.jpg)\n\n**图 24-40**\n\n## AJAX CONTROL TOOLKIT\
  \ 服务器端控件\n\n以下 ASP.NET AJAX 控件实际上并不总是扩展其他 ASP.NET 控件，而是它们本身就是控件。以下章节详细介绍了这些控件。\n\
  \n### Accordion 控件\n\n`Accordion` 控件用于指定一组面板（panes），类似于 Microsoft Outlook 中著名的导航菜单。每个面板由一个头部模板（header\
  \ template）和一个内容模板（content template）组成。所有面板的头部模板始终可见，而只有一个内容模板是的。用户通过点击头部选择要查看的面板。之前活动面板的内容将从视图隐藏，新选择面板的内容将显示。\n\
  \n`Accordion` 控件可以在活动面板之间切换时提供淡入过渡。将 `FadeTransitions` 属性设置为 `True`，然后你可以设置 `TransitionDuration`\
  \ 和 `FramesPerSecond` 值。默认值分别为 250 毫秒和 40 帧/秒。\n\n\n\n\n\n`SelectedIndex` 属性允许你通过声明式和编程方式控制显示哪个窗格。其他重要属性包括\
  \ `AutoSize` 和 `Height` 属性。`AutoSize` 属性默认值为 `None`，这意味着手风琴控件（Accordion control）的大小会根据活动窗格发生变化。屏幕上的其他内容可能会发生位移以适应这种尺寸变化。然而，当\
  \ `AutoSize` 属性设置为 `Limit` 时，尺寸将限制在 `Height` 值范围内。如果由于内容大于可用空间，活动窗格将显示滚动条。另一个可能的值是\
  \ `Fill`，当内容不足以满足所提供的 `Height` 值时，它会扩大窗格。代码列表 24-37 显示了手风琴控件的运行情况。该手风琴控件包含两个窗格。\n\
  \n文档中定义了一个单一 CSS 类，该类 `titlebar` 被用作 `HeaderCssClass` 和 `HeaderSelectedCssClass`\
  \ 属性的值。此处的手风琴控件包含两个 `AccordionPane` 控件。`AccordionPane` 控件的子元素是 `<Header>` 和 `<Content>`\
  \ 元素。放置在 `<Header>` 部分的项将位于可点击的窗格标题中，而包含在 `<Content>` 部分的项目将在关联标题被选中时滑出并显示。\n\n\
  你会注意到，在切换窗格时也有一个过渡效果。运行此页面将产生如图 24-41 所示的结果。\n\n![image](img/f947-01.jpg)\n\n**图\
  \ 24-41**\n\n此图显示了每个被选中窗格的截图。以下列表描述了一些较重要的属性：\n\n*   `AutoSize`: 定义控件如何处理其尺寸扩展和收缩。可能的值包括\
  \ `None, Fill` 和 `Limit`。默认值为 `None`，使用时，控件下方的项目可能会移动以为控件扩展留出空间。`Fill` 值与 `Height`\
  \ 属性配合使用，控件将填充到所需的 `Height`。这意味着某些窗格可能需要增大以适应空间，而其他窗格可能需要缩小并包含滚动条以处理由高度限制带来的有限空间。`Limit`\
  \ 值也与 `Height` 属性配合使用，且永远不会大于此值。窗格可能比指定的要小。\n*   `TransitionDuration`: 切换到另一个窗格所需的毫秒数。\n\
  *   `FramesPerSecond`: 切换到另一个窗格时每秒使用的帧数。\n*   `RequireOpenedPane`: 指定要求至少有一个窗格始终处于打开状态。此属性的默认设置为\
  \ `True`。值 `False` 意味着所有窗格都可以被折叠。\n\n最后，`DataSource`、`DataSourceID` 和 `DataMember`\
  \ 属性允许你从代码绑定到此控件。\n\n### 级联下拉列表 (CascadingDropDown)\n\n一个 `DropDownList` 的可用选项可以是另一个\
  \ `DropDownList` 中选择结果的函数。`CascadingDropDown` 控件使得在应用程序中实现这一功能变得简单。你将 `TargetControlID`\
  \ 设置为应该通过服务器回调进行填充的 `DropDownList`。你还分配了一个类别来对 `DropDownList` 进行分类。\n\n在 `DropDownList`\
  \ 填充之前，会显示 `PromptText` 属性的值。此外，在调用服务器进行期间，会显示 `LoadingText` 属性的值。你可以设置 `ServicePath`\
  \ 属性来调用单独 Web 服务上的 `ServiceMethod`，或者只需将 `ServiceMethod` 名称设置为直接位于页面上的静态 `ScriptMethod`，如代码列表\
  \ 24-38 所示。\n\n此示例中的第一个 `DropDownList` 允许用户选择州。此示例仅包含密苏州和俄勒冈州。当选择某个州时，第二个 `DropDownList`\
  \ 将根据用户在第一个 `DropDownList` 中选择的值进行填充。指定一个 `DropDownList` 依赖于另一个控件的值的方法是设置 `CascadingDropDown`\
  \ 控件的 `ParentControlID`。\n\n### NoBot 控件\n\n`NoBot` 控件用于确定实体（实体）如何与你的表单进行交互。它可以帮助你确保是真实的人在操作表单，而不是某些自动化代码正在运行你的应用程序。\n\
  \n代码列表 24-39 展示了 `NoBot` 控件（本章节代码下载中的 `NoBot.aspx`）。\n\n在控制表单提交方式时，`NoBot` 控件有三个需要注意的重要属性。这些属性包括\
  \ `CutoffMaximumInstances`、`CutoffWindowSeconds` 和 `ResponseMinimumDelaySeconds`。\n\
  \n`CutoffMaximumInstances` 是端用户在 `CutoffWindowSeconds` 属性指定的秒数内允许尝试提交表单的次数。`ResponseMinimumDelaySeconds`\
  \ 属性定义了端用户提交表单的最少秒数。如果你知道正在处理的表单需要一些时间，将此属性设置为一个值（即使是 `5` 秒）将有助于阻止非人类发起的提交。\n\n\
  `OnGenerateChallengeAndResponse` 属性允许你定义与挑战配合的服务器端方法，并允许根据挑战提供响应。该属性用于代码列表 24-39。\n\
  \n### 密码强度控件 (PasswordStrength Control)\n\n`PasswordStrength` 控件允许你检查 `Textbook`\
  \ 控件的内容并验证其强度。它还会向用户提供关于强度是否合理的提示。代码列表 24-41 展示了 `PasswordStrength` 控件的简单示例。\n\n\
  此页面产生单个文本框，当最终用户在文本框中输入时，他们会收到关于强度的通知。如图 24-42 所示。\n\n![image](img/f952-01.jpg)\n\
  \n**图 24-42**\n\n可以使用的重要属性包括 `MinimumLowerCaseCharacters`、`MinimumNumericCharacters`、`MinimumSymbolCharacters`、`MinimumUpperCaseCharacters`\
  \ 和 `PreferredPasswordLength`。\n\n### 评分控件 (Rating Control)\n\n`Rating` 控件赋予最终用户查看和设置评分（例如星级评分）的能力。你可以控制评分的数量、填充评分的外观、空评分的外观以及更多内容。代码列表\
  \ 24-42 向你展示了一个允许最终用户自行设置的五星评分系统。\n\n在这里，`Rating` 控件使用多个 CSS 类来定义各种状态下的外观。除了 CSS\
  \ 类属性（`StarCssClass`、`WaitingStarCssClass`、`FilledStarCssClass` 和 `EmptyCssClass`）之外，你还可以指定评分对齐方式、评分项目数量（默认为\
  \ `5`）、宽度、当前评分以及更多。代码列表 24-42 产生的结果如图 24-43 所示。\n\n![image](img/f953-01.jpg)\n\n\
  **图 24-43**\n\n\n\n\n`TabContainer` 和 `TabPanel` 控件让展示熟悉的标签页 UI 变得简单。用户会在单个内容面板的顶部看到一组标签页，该面板显示当前活动标签页的内容。当用户选择不同的标签页时，内容会发生变化。标签页是控制包含大量展示内容的页面的极佳方式。`TabContainer`\
  \ 控件可以包含一个或多个 `TabPanel` 控件，这些控件为你提供一组标签页，一次显示一个标签页的内容。\n\n`TabContainer` 允许你关联一个名为\
  \ `ActiveTabChanged` 的服务器事件，如果活动标签页发生了变化，该事件将在回传（postback）期间被触发。你还可以使用 `OnClientActiveTabChanged`\
  \ 事件，在用户选择不同标签页时在浏览器中触发你的 JavaScript 事件。`ScrollBars` 属性允许你指定滚动条应该是 `Horizontal`（水平）、`Vertical`（垂直）、`Both`（两者）还是\
  \ `None`（无），或者设置为 `Auto`（自动），在这种情况下，由控件来做决定。\n\n`TabPanel` 控件为标签有一个 `<HeaderTemplate>`，为正文有一个\
  \ `<ContentTemplate>`。你可以不使用 `<HeaderTemplate>` 而是指定 `HeaderText` 属性。它还有一个在标签被选中时触发的事件，名为\
  \ `OnClientClick`。标签功能中一个特别有趣的特性是，可以在浏览器的 JavaScript 中通过将 `Enabled` 属性设置为 `False`\
  \ 来程序化地禁用标签。\n\n列表 24-43 显示了一个带有三个 `TabPanel` 控件的 `TabContainer` 控件示例。\n\n图 24-44\
  \ 展示了这个简单页面的结果。\n\n![image](img/f955-01.jpg)\n\n**图 24-44**\n\n## 总结\n\nAjax Control\
  \ Toolkit 让为 Web 应用程序添加丰富的动画和交互变得简单。除了可以使用 `UpdatePanel` 控件来实现页面内容的异步更新外，你还可以使用\
  \ `UpdatePanelAnimation` 向用户显示正在进行后台处理。该工具包有助于模糊桌面应用程序与 Web 应用程序之间的区别。模态对话框和弹出对话框开始让\
  \ Web 应用程序超越用户对在浏览器中工作的预期。\n\n正如你所见，你有无数此类控件可供使用。最棒的一点是这是一项与微软共同的社区努力，可用列表将随时间的推移不断增长。\n\
  \n本章探讨了 Ajax Control Toolkit 的许多控件以及如何在你的 ASP.NET 应用程序中使用它们。请经常访问 Microsoft Ajax\
  \ 页面和 Ajax Control Toolkit 网站以获取这些控件，并利用最新的产品。\n\n# 25 jQuery\n\n## 本章包含什么？\n\n\
