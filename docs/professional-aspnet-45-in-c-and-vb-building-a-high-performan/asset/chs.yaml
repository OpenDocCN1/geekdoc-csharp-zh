  \n![image](img/f1078-01.jpg)\n\n**图 29-5**\n\n## 1. 追踪 (TRACING)\n\n*追踪*（Tracing）是监控\
  \ ASP.NET 执行的一种的一种。你可以以不影响程序输出的方式记录异常详细和程序流。在经典 ASP 中，追踪和调试功能几乎不存在，迫使开发者使用“运行到此处”的调试方法，其形式是大量的\
  \ `Response.Write` 语句，这些语句充斥在生成的 HTML 中，通过非正式的追踪语句向程序员宣布程序每执行新一行就“到达了这里”和“到达了那里”。这种侵入式的追踪清理非常不利，许多程序员最终创建了自己的非正式追踪库来绕过这些经典\
  \ ASP 的局限性。\n\n在 ASP.NET 中，对追踪提供了丰富的支持。追踪输出的目标可以通过 `TraceListeners` 配置，例如 `EventLogTraceListener`。`TraceListeners`\
  \ 的配置将在在本节稍后的部分介绍。ASP.NET 允许在 ASP.NET 页面特定的 `Trace` 类与非 Web 开发者使用的标准基类库（BCL）`System.Diagnostics.Trace`\
  \ 之间进行追踪转发。此外，ASP.NET 追踪的时间输出精度高达 18 位，可用于非常准确的性能分析。\n\n### 1.1. System.Diagnostics.Trace\
  \ 和 ASP.NET 的 Page.Trace\n\n在整个 .NET 框架中，有许多东西被命名为 *Trace*，因此看起来 Web 应用和非 Web 应用之间的追踪并不是统一的。不要困惑，因为存在一个类名为\
  \ `System.Diagnostics.Trace`，同时 `System.Web.UI.Page` 上也有一个名为 `Trace` 的公共属性。`Page`\
  \ 类上的 `Trace` 属性允许你访问 `System.Web.TraceContext` 和 ASP.NET 特有的追踪机制。`TraceContext`\
  \ 类收集了 Web 请求的所有详细信息和计时。它包含了许多方法，但你用得最多的是 `Write`。它还包含了 `Warn`，它简单地调用 `Write()`，并确保\
  \ `Warn` 生成的输出为红色。\n\n如果你正在编写一个没有支持组件或其他可能在非 Web 上下文中使用的程序集的 ASP.NET ，你通常只使用 ASP.NET\
  \ 的 `TraceContext` 就能获得很多实用。然而，ASP.NET 的追踪支持与基类库的其余追踪有所不同。你会首先探索 ASP.NET 的追踪功能，然后学习如何桥接差异并查看一些让调试变得更简单的特性。\n\
  \n### 1.2. 页面级追踪\n\n你可以通过在任何页面的 `Page` 指令中添加 `Trace=\"true\"` 来在页面级别启用 ASP.NET 追踪：\n\
  \n```xml\n@Page Language=\"C#\" Inherits=\"System.Web.UI.Page\" Trace=\"true\"\n\
  ```\n\n此外，你可以添加设置类别的 `TraceMode` 属性，或者可能使用 `SortByCategory` 将其分组。你可以使用 `IsEnabled`\
  \ 属性通过编程启用追踪。注意 `web.config` 中设置了 `pageOutput=\"false\"`。\n\n### 1.3.应用程序追踪\n\n\
  或者，你可以通过在 `config` 文件中添加设置为整个应用程序启用追踪。在示例示例：\n\n```xml\n<configuration>\n    <system.web>\n\
  \        <trace enabled=\"true\" pageOutput=\"false\" requestLimit=\"20\" traceMode=\"\
  SortByCategory\" localOnly=\"true\" />\n    </system.web>\n</configuration>\n```\n\
  \n### 1.4. 查看追踪数据\n\n页面级设置高于 `config` 文件。你可以在浏览器中查看追踪信息，如图 29-6 所示。`Write` 的消息出现在\
  \ `Begin Load` 之后和 `End Load` 之前。控件的权重表示在 ViewState 和 ControlState 中的字节数。在追踪语句之间收集这种非常有价值的性能数据非常容易。\n\
  \n如表 29-1 所述，追踪的十一部分提供了关于 ASP.NET 页面渲染过程的大量详细信息和特定见解。\n\n| 扇区 | 描述 |\n| --- | ---\
  \ |\n| 请求详情 | 包含 ASP.NET 会话 ID、请求和响应的字符编码以及 HTTP 会话返回的状态码。请注意请求和响应的编码，特别是当你使用任何非拉丁字符集时。如果你返回的是英语以外的语言，你可能希望编码为\
  \ UTF-8。幸运的是，这是默认值。 |\n| 追踪信息 | 包含 HTTP 请求生命周期内调的所有 `Write` 方法以及大量关于计时的信息。这可能是调试中最用的部分。位于此处的计时信息在分析性能和搜索应用程序中执行耗时过长的方法时非常有价值。\
  \ |\n| 控件树 |  ASP.NET 控件树的 HTML 表征。显示每个控件的唯一 ID、运行时类型、渲染所花费的字节数，以及它在 ViewState 和\
  \ ControlState 中需要的字节数。不要低估这两个部分的用处，特别是显示每个控件权重的三列。控件的权重表示该特定控件在 ViewState 和 ControlState\
  \ 中占据的字节数。注意你的每个控件所使用的字节数，特别是当你编写自己的自定义控件时，因为你希望你的控件返回尽可能少的字节，以保持整体页面重量较低。 |\n|\
  \ 会话状态 | 列出特定用户会话的所有键、其类型和值。仅显示当前用户的会话状态。 |\n\n\n\n\n\n| Application State | 列出当前应用程序\
  \ `Application` 对象中的所有键及其类型和值。 |\n| Request Cookies | 列出页面请求期间传递的所有 Cookie。 |\n\
  | Response Cookies | 列出页面响应期间返回的所有 Cookie。 |\n| Headers Collection | 显示浏览器在请求过程中可能传递的所有标头，包括\
  \ `Accept-Encoding`（表示浏览器是否支持压缩的 HTTP 响应）；`Accept-Languages`（一组 ISO 语言代码列表，指示用户语言偏好的顺序）以及\
  \ `User-Agent`（用于识别浏览器的标识字符串）。该字符串还包含有关用户操作系统以及其所运行的 .NET Framework 版本或多个版本（在 IE\
  \ 上运行）的信息。 |\n| Form Collection | 显示 Form 集合及其所有键和值的完整转储。 |\n| Querystring Collection\
  \ | 显示 Querystring 集合及其其中包含的所有键和值的转储。 |\n| Server Variables | 对 Web 服务器关于应用程序和请求浏览器的所知的一切键值对进行完整转储。\
  \ |\n\n**表 29-1**\n\n追踪的页面输出仅显示为当前页面请求收集的数据。然而，当访问 `http://localhost/yoursite/trace.axd`\
  \ 时，你将看到目前为止该网站所有请求收集的详细数据。如果你在使用内置的 ASP.NET 开发服务器，请从 URL 中删除当前页面并将其替换为 `trace.axd`。不要更改自动选择的端口或路径。\n\
  \n再次，`trace.axd` 是内部处理程序，而不是真实的页面。当从本地浏览器请求它时（如图 29-7 所示），它会显示预设限制范围内所有请求的追踪信息。\n\
  \n![image](img/f1081-01.jpg)\n\n**图 29-7**\n\n图 29-7 显示此应用程序已发了五个请求，头部右侧显示“剩余: 5”。这意味着在该应用程序停止追踪之前还有五个请求。在最后一次请求之后，除非应用程序回收（recycle）或你从\
  \ `trace.axd` 页面上点击“清除当前追踪”，否则追踪数据将被保存。可以在 `web.config` 文件中增加请求限制，但会以内存为代价：\n\n\
  ```\n<trace requestLimit=\"100\" pageOutput=\"true\" enabled=\"true\"/>\n```\n\n\
  最大请求限制值为 10000。如果你尝试使用任何更大的值，ASP.NET 仍会使用 10000 且不会报错。不过，你可以在 trace 部分中添加一个名为 `mostRecent`\
  \ 的属性。\n\n\n\n\n\n你经常会发现现有的 ASP.NET 经过高度插桩，并广泛使用了 ASP.NET 的 `TraceContext` 类。ASP.NET\
  \ 在 `web.config <trace>` 元素中包含一个属性，允许你将 ASP.NET 跟踪发出的消息路由到 `System.Diagnostics.Trace:\
  \ writeToDiagnosticsTrace`：\n\n```\n <trace writeToDiagnosticsTrace=\"true\" pageOutput=\"\
  true\" enabled=\"true\"/>\n```\n\n当你将 `writeToDiagnosticsTrace` 设置为 `true` 时，所有对\
  \ `System.Web.UI.Page.Trace.Write`（即 ASP.NET `TraceContext`）的调用也会进入 `System.Diagnostics.Trace.Write`，这使你能够本章后面介绍的所有标准\
  \ `TraceListener` 和跟踪选项。简单的 `writeToDiagnoticsTrace` 设置将 ASP.NET 跟踪功能与基类库（Base Class\
  \ Library）的其他部分连接起来。当我深度调试页面时会使用此功能，并且可以使用此配置开关轻松关闭。我相信信息多总比少好，但你可能会发现精确的页面事件信息过于冗长。尝试一下并形成你自己的观点。\n\
  \n## TraceListeners\n\n来自 `System.Diagnostics.Trace` 方法的输出可以通过 `TraceListener` 路由到文本文件、ASP.NET、外部监控系统，甚至是数据库。这个强大的功能是许多\
  \ ASP.NET 开发人员工具箱中一个极度被低使用的工具。在 ASP.NET 早期，某些知道其组件会在 ASP.NET 内部使用的组件开发者会引入对 `System.Web`\
  \ 的直接引用并调用 `HttpContext.Current.Trace`。这样做是为了让他们的跟踪信息以对开发者友好的 ASP.NET 格式出现。在 `HttpRequest`\
  \ 上文中调用的所有组件都会自动获得访问该请求当前上下文的权限，允许组件直接与请求通信并检索 Cookie 或收集用户信息。\n\n然而，假设 `HttpContext`\
  \ 始终可用由于许多原因来说是危险的。首先，当你声明你的组件只能在 `HttpRequest` 上下文中使用时，你就做了一个巨大的假设。注意，这里是在请求上下文中说的，而不是在应用程序上下文中。即使在\
  \ `Application_Start` 内部访问 `HttpContext.Current`，你会惊讶地发现 `HttpContext.Current` 为\
  \ `null`。其次，将你的组件的功能与 `HttpContext` 绑定，使得在任何非 Web 上文中使用你的应用程序变得棘手（如果不是的话），而且单元测试变得特别困难。\n\
  \n如果你有一个被 页面使用的组件，但它也需要在 Web 上文之外进行单元测试，或必须从任何其他上下文调用，请不要调用 `HttpContext.Current.Trace`。相反，请使用标准的\
  \ `System.Diagnostics.Trace` 并使用下一节的 `WebPageTraceListener` 将输出重定向到 ASP.NET 跟踪功能。使用标准跟踪机制意味着你的组件可以在任何上下文（Web\
  \ 还是其他）中使用。你仍然能够通过 `TraceListener` 查看组件的跟踪输出。\n\n框架自带了许多非常有用的 `TraceListener`；你可以通过程序添加或通过\
  \ `.config` 文件添加它们。例如，你可以通过程序添加将 `TraceListener` 日志写入文件，如 列表 29-2 所示。这些代码段需要 `System.Diagnostics`\
  \ 和 `System.IO` 命名空间。\n\n访问资源（如文件、事件日志或数据库）的 `TraceListener`（例如 `TextWriterTraceListener`）要求\
  \ ASP.NET 工作进程以具有足够权限的用户身份运行。例如，要写入 `c:\\foo\\example.log`，ASP.NET 工作进程需要在该文件的访问控制列表\
  \ (ACL) 中具有显式的写入权限。\n\n注意前面的示例还可选地移除了默认的 `TraceListener`。如果你编写自己的 `TraceListener`，必须在\
  \ `type` 属性中提供完全限定程序集名称。\n\n### 使用 ASP.NET WebPageTraceListener\n\nASP.NET `WebPageTraceListener`\
  \ 继承自 `System.Diagnostics.TraceListener`，并自动将任何组件调用的跟踪信息转发到 `System.Diagnostics.Trace.Write`。这允许使用最通用的跟踪提供程序编写组件，并在你的\
  \ ASP.NET 应用程序环境中查看其跟踪输出。\n\n如下所示，将 `WebPageTraceListener` 添加到 `web.config` 文件。注意此代码使用了\
  \ `System.Web` 的完全限定程序集名称：\n\n```\n <configuration>\n   <system.diagnostics>\n \
  \      <trace autoflush=\"false\" indentsize=\"4\">\n           <listeners>\n  \
  \             <add name=\"webListener\"\n                  type=\"System.Web.WebPageTraceListener,\
  \ System.Web, Version=4.0.0.0,\n                        Culture=neutral, PublicKeyToken=b03f5f7f11d50a3a\"\
  />\n           </listeners>\n       </trace>\n   </system.diagnostics>\n   <system.web>\n\
  \          <trace enabled=\"true\" pageOutput=\"false\" localOnly=\"true\" />\n\
  \   </system.web>\n  </configuration>\n```\n\n图 29-8 显示了从引用库调用 `System.Diagnostics.Trace.Write`\
  \ 的输出。它出现在 ASP.NET 的页面跟踪中。引用库生成的行在该图中被圈出。\n\n![image](img/f1085-01.jpg)\n\n**图 29-8**\n\
  \n### EventLogTraceListener\n\n跟踪信息也可以使用 `EventLogListener` 发送到事件日志中。这样做可能会有点复杂，因为\
  \ ASP.NET 需要对事件日志的显式写入权限：\n\n```\n <configuration>\n   <system.diagnostics>\n  \
  \     <trace autoflush=\"false\" indentsize=\"4\">\n           <listeners>\n   \
  \           <add name=\"EventLogListener\"\n                  type=\"System.Diagnostics.EventLogListener\"\
  \n                  initializeData=\"Wrox\"/>\n           </listeners>\n       </trace>\n\
  \   </system.diagnostics>\n  </configuration>\n```\n\n注意，在添加 `TraceListener` 时，`Wrox`\
  \ 作为字符串传递给 `initializeData` 属性。字符串 `Wrox` 作为此事件的应用程序或源出现。这在调试应用程序时运行良好；调试用户可能具有适当的权限。然而，当你的应用程序部署时，它可能会在权限较低的帐户下运行，因此你必须向注册表键（如\
  \ HKL\\System\\CurrentControlSet\\Services\\EventLog\\Application\\Wrox）提供显式的写入权限，其中\
  \ `Wrox` 是传递给 `initializeData` 的相同字符串。记住注册表键像文件一样具有 ACL（访问控制列表）。使用 `RegEdit.exe`\
  \ 通过右键点击键并选择属性来更改注册表键的权限，就像对文件设置一样。\n\n使用 `EventLogTraceListener` 时要小心，因为如果应用程序非常“话”，事件日志可能会迅速填满。图\
  \ 29-9 显示了事件日志中的示例跟踪输出。\n\n![image](img/f1086-01.jpg)\n\n**图 29-9**\n\n### 其他有用的监听器\n\
  \n.NET Framework 4 在 `WebPageTraceListener` 之外还增加了两个 `TraceListener`：\n\n*   `XmlWriterTraceListener`：继承自\
  \ `TextWriterTraceListener` 并写出强类型的 XML 文件。\n*   `DelimitedListTraceListener`：同样继承自\
  \ `TextWriterTraceListener`；写入逗号分隔值 (CSV) 文件。\n\n\n\n\n\n关于 `XmlWriterTraceListener`\
  \ 创建的 XML 有一点值得注意的有趣点：它并不是良好的（well-formed）XML！具体来说，它没有根节点；它只是一组并节点的集合，如下代码所示。这看起来似乎违背了你所听过的关于\
  \ XML 的许多观点，但请将每个事件视为一个文档。每个事件都是独立的，并且可以单独处理。它们只是恰好位于同一个文件中。可以的是，缺少最终的闭合标签巧妙地规避了良好性问题，并允许轻松追加到文件中。\n\
  \n```\n <E2ETraceEvent xmlns=\\\"http://schemas.microsoft.com/2012/06/E2ETraceEvent\\\
  \">\n      <System xmlns=\\\"http://schemas.microsoft.com/2012/06/windows/eventlog/system\\\
  \">\n          <EventID>0</EventID>\n          <Type>3</Type>\n          <SubType\
  \ Name=\"Information\">0</SubType>\n          <Level>8</Level>\n          <TimeCreated\
  \ SystemTime=\"2012-11-05T12:43:44.4234234Z\">\n          <Source Name=\"WroxChapter29.exe\"\
  />\n          <Correlation ActivityID=\"{00000000-0000-0000-0000-000000000000>\n\
  \          <Execution ProcessName=\"WroxChapter29.exe\" ProcessID=\"4234\" ThreadID=\"\
  1\"/>\n          <Channel/>\n          <Computer>SCOTTPC</Computer>\n      </System>\n\
  \      <ApplicationData>Your Text Here</ApplicationData>\n  </E2ETraceEvent>\n \
  \ <E2ETraceEvent xmlns=\\\"http://schemas.microsoft.com/2012/06/E2ETraceEvent\\\"\
  >\n      <System xmlns=\\\"http://schemas.microsoft.com/2012/06/windows/eventlog/system\\\
  \">\n          <EventID>0</EventID>\n          <Type>3</Type>\n  . . . the XML continues\
  \ . . .\n```\n\n`E2ETraceEvent` 中的 “E2E” 代表端到端（end-to-end）。注意它包含了诸如你的计算机名称和“相关 ID”等信息。\n\
  \n从 .NET Framework 3.5 开始，列表中又多了一个 `TraceListener`：`IisTraceListener`。就像 `WebPageTraceListener`\
  \ 将诊断跟踪与 ASP.NET 跟踪桥起来一样，`IisTraceListener` 将 ASP.NET 的跟踪机制与 IIS 7.0 桥起来。此监听器允许你向\
  \ IIS 7.0 基础设施引发事件。\n\n### 诊断开关 (Diagnostic Switches)\n\n仅仅因为想更改跟踪特性就重新编译应用程序通常是不方便的。有时，你可能想更改配置文件来添加和删除\
  \ `TraceListener`。在其他时候，你可能想更改配置参数或“翻转开关”来调整跟踪产生的详细程度。这就是 `Switch` 用用用场。`Switch`\
  \ 是一个抽象基类，支持一系列诊断开关，你可以通过应用程序的配置文件来控制它们。\n\n### 布尔开关 (BooleanSwitch)\n\n要使用 `BooleanSwitch`，请创建一个实例并传递在应用程序\
  \ `config` 文件中出现的开关名称（参见 列表 29-3）。\n\n**列表 29-3: 使用诊断开关**\n\n开关可以用于任何目的的 `if` 语句，但它们结合\
  \ `System.Diagnostics.Trace.WriteIf` 进行跟踪的上下文中最为有用：\n\nVB\n```\n Dim aSwitch As\
  \ New BooleanSwitch(\"ImportantSwitch\", \"Show errors\")\n  System.Diagnostics.Trace.WriteIf(aSwitch.Enabled,\
  \ \"The Switch is enabled!\")\n```\n\nC#\n```cs\n BooleanSwitch aSwitch = new BooleanSwitch(\"\
  ImportantSwitch\", \"Show errors\");\n  System.Diagnostics.Trace.WriteIf(aSwitch.Enabled,\
  \ \"The Switch is enabled!\");\n```\n\n如果 `config` 文件中的 `ImportantSwitch` 设置为 `1`\
  \ 或非零值，对 `WriteIf` 的调用将向跟踪输出发送字符串。\n\n### 跟踪开关 (TraceSwitch)\n\n`TraceSwitch` 提供了从\
  \ 0 到 4 的五个跟踪级别，意味着递增顺序：关闭 (Off)、错误 (Error)、警告 (Warning)、信息 (Info) 和详细 (Verbose)。你像创建\
  \ `BooleanSwitch` 一样构造构造 `TraceSwitch`：\n\nVB\n```\n Dim tSwitch As New TraceSwitch(\"\
  LevelSwitch\", \"Trace Levels\")\n  System.Diagnostics.Trace.WriteIf(tSwitch.TraceInfo,\
  \ \"The Switch is 3 or more!\")\n```\n\nC#\n```cs\n TraceSwitch tSwitch = new TraceSwitch(\"\
  LevelSwitch\", \"Trace Levels\");\n  System.Diagnostics.Trace.WriteIf(tSwitch.TraceInfo,\
  \ \"The Switch is 3 or more!\");\n```\n\n`TraceSwitch` 类上的许多属性在开关处于与属性值相同或更高级别的级别时会返回\
  \ `true`。例如，如果开关的值设置为 3 或更多，`TraceInfo` 属性将返回 `true`。\n\n### 源开关 (SourceSwitch)\n\
  \n自 .NET Framework 2.0 发布以来，你就可以使用 `SourceSwitch` 了，它类似于 `TraceSwitch` 但提供了更细粒的粒度。你使用\
  \ `EventType` 作为参数调用 `SourceSwitch.ShouldTrace`：\n\nVB\n```\n Dim sSwitch As New\
  \ SourceSwitch(\"SourceSwitch\", \"Even More Levels\")\n  System.Diagnostics.Trace.WriteIf(sSwitch.ShouldTrace(EventType.Warning),\
  \ \"The Switch is 3 or more!\")\n```\n\nC#\n```cs\n SourceSwitch sSwitch = new SourceSwitch(\"\
  SourceSwitch\", \"Even More Levels\");\n  System.Diagnostics.Trace.WriteIf(sSwitch.ShouldTrace(EventType.Warning),\
  \ \"The Switch is 3 or more!\");\n```\n\n### Web 事件 (Web Events)\n\n在 `System.Web.Management`\
  \ 中，事件由管理子系统捕获并根据许多规则调度到不同的提供程序。这比调用 `Trace.WriteLine` 更正式的跟踪方式，因此为特定应用程序创建一个强类型事件类：\n\
  \nWEB.CONFIG\n```xml\n <?xml version=\"1.0\"?>\n  <configuration>\n      <system.web>\n\
  \          <healthMonitoring enabled=\"true\">\n              <providers>\n    \
  \              <add name=\"WroxDatabaseLoggingProvider\"\n                     \
  \ type=\"System.Web.Management.SqlWebEventProvider\"\n                      connectionStringName=\"\
  QuickStartSqlServer\"\n                      maxEventDetailsLength=\"1073741823\"\
  \n                      buffer=\"false\"/>\n              </providers>\n       \
  \       <rules>\n                  <add\n                      name=\"Application\
  \ Lifetime Events Rule\"\n                      eventName=\"All Events\"\n     \
  \                 provider=\"WroxDatabaseLoggingProvider\"\n                   \
  \   profile=\"Critical\" />\n              </rules>\n          </healthMonitoring>\n\
  \      </system.web>\n  </configuration>\n```\n\n## 调试 (DEBUGGING)\n\nVisual Studio\
  \ 默认包含两个配置：*调试 (debug)* 和*发布 (release)*。调试配置会自动定义调试和跟踪常量，允许应用程序向故障排除人员提供上下文。生成调试信息的选项默认开启，从而为每个程序集生成程序数据库（或调试）文件\
  \ (PDB)。它们出现在程序集相同的 bin 文件夹中。然而，请记住，原生代码的实际编译不在 Visual Studio 中进行，而是在运行时使用即时编译 (JIT)\
  \ 进行。JIT 会自动优化你的代码。然而，优化后的代码调试要困难得多，因为生成的操作可能与源代码直接对应。为了调试目的，此选项设置为 `false`。\n\n\
  ### 所需 (What’s Required)\n\n\n\n\n\n当调用 C# 编译器 (`csc.exe`) 或 Visual Basic 编译器 (`vbc.exe`)\
  \ 并使用 `/debug:full` 命令行开关时，就会创建 `PDBs`。作为一个选项，如果你使用 `/debug:pdbonly`，你会生成 `PDBs`，但仍然指示编译器生成发布模式的代码。\n\
  \n## 调试与发布\n\nVisual Studio 自带的调试和发布配置通常足够满足你的需求。然而，这些配置仅控制后台文件（code-behind files）的编译选项。请记住，取决于你设计\
  \ ASP.NET 应用的方式，ASP.NET `.aspx` 文件可能在第一次被访问时进行编译，或者整个应用程序在第一次访问页面时进行编译。你可以通过应用程序\
  \ `web.config` 文件中 `<system.web>` 部分的编译元素来控制这些编译设置。设置 `<compilation debug=\"true\"\
  >` 可以像使用 `/debug:full` 开关一样生成二进制文件，同时也会生成 `PDBs`。\n\n普通开发者最关心的是 `PDB` 文件的存在。当这些文件存在\
  \ ASP.NET 应用程序的 `bin` 文件夹中时，运行时为你提供行号。当然，行号对调试非常有帮助。如果没有这些文件，你无法在交互式调试会话中通过源代码。\n\
  \n## 调试和 JIT 对话框\n\n当 ASP.NET 应用程序发生未处理的错误时，ASP.NET 工作进程的默认错误处理器会捕获它并尝试输出某些描述发生情况的\
  \ HTML。然而，你在 ASP.NET 之外调试组件（例如在单元测试上下文中）时，当 .NET 应用程序抛出未处理的异常时，会出现调试对话框。\n\n如果 ASP.NET\
  \ 应用程序发生了严重的错误，你可能会发现一个 Web 服务器弹出了对话框并等待你的输入。如果机器没有连接键盘或显示器，这将格外格外不便。某一天，你可能想要关闭出现的调试对话框，你有两种方法可以实现：\n\
  \n- 你可以从注册表中禁用 JIT 调试。正确的注册表项是 `HKLM\\Software\\Microsoft.NETFramework\\DbgJITDebugLaunchSetting`。该选项有三个可能的值：\n\
  \    - `0`：通过消息框提示用户。提供的选项包括“继续”（Continue），会导致堆栈转储和进程终止；以及“附加调试器”（Attach a Debugger），这意味着运行时将启动\
  \ `DbgManagedDebugger` 注册表项列出的调试器。如果不存在该键，调试器将释放控制并终止进程。\n    - `1`：不显示对话框。这将导致堆栈转储然后终止进程。\n\
  \    - `2`：启动 `DbgManagedDebugger` 注册表项列出的调试器。\n\n- 在 Visual Studio.NET 中，要禁用 JIT\
  \ 调试对话框并保留错误对话框，选择 `Tools` -> `Options` -> `Debugging` -> `Just-In-Time` 并取消选择提供的选项。在发生未处理异常时，将不会出现\
  \ `Select a Debugger` 对话框，而是出现一个确认/取消对话框。\n\n## 开始调试会话\n\n你有多种方法可以进入 ASP.NET 的交互式调试会话。Visual\
  \ Studio 可以启动 ASP.NET 工作进程，加载你新编译的网站，并自动将调试附加到工作进程。或者，你可以将调试器附加到已经在运行的站点。Visual\
  \ Studio 还包含了一个更简单的远程调试工具，用于跨机器调试。\n\n### F5 调试\n\n当你启动调试 ASP.NET 应用程序时，Visual Studio\
  \ 会考虑项目属性中的所有启动（Start）选项。它允许你使用当前选择的页面开始调试。选择特定页面是为了让 Visual Studio 调试器自动附加正确的进程，该进程可能是\
  \ Visual Studio Web 服务器、ASP.NET 工作进程或远程调试监控器。\n\n### 附加到进程\n\n跳转到已经在运行且状态已知的网站的交互式调试会话，通常比每次调试都从头启动应用程序更方便。要开始调试已运行的站点，从\
  \ Visual Studio 的 Debug（调试）菜单中，选择 `Attach to Process`（附加到进程）。该对话框较之前的 Visual Studio\
  \ 版本进行了改进，包含一个 `Refresh`（刷新）按钮，并通过仅显示属于用户且处于当前运行会话中的进程，简化了大多数常见的调试用例。\n\n此外还包含一个带有默认传输的传输下拉列表。默认设置允许你选择你计算机上的进程，或正在运行远程调试监控器的远程计算机上的进程。其他选项则用于智能客户端或未托管代码调试。\n\
  \n### 更简单的远程调试\n\n多年来，远程调试变得更简单了。然而，出于安全考虑，你必须拥有适当的凭据来执行远程调试。你会在 `C:\\Program Files\\\
  Microsoft Visual Studio 10.0\\Common7\\IDE` 中找到 Remote Debugger 文件夹。\n\n开始之前，你必须在包含要调试应用程序的机器上设置远程调试。你现在可以使用远程调试监控器，而不是执行复杂的安装，使用一个可以直接从文件共享运行的应用程序。最简单的场景是你直接从你的\
  \ Visual Studio 机器共享这些组件，然后从共享目录运行 `msvsmon.exe`。\n\n只需从文件共享直接运行 Remote Debug Monitor\
  \ 可执行文件，就可以让对已部署的应用程序进行远程 ASP.NET 调试变得简单得多，尽管你仍然需要手动附加到 ASP.NET 工作进程，因为不支持自动附加。请注意，现在有两个版本的调试器，一个用于\
  \ x86 进程，另一个用于 x64 进程。\n\n\n\n\n\n再次点击已固定的 DataTip 上的大钉图标，也可以将其置为悬浮状态。这样做可以让你将 DataTip\
  \ 移动到屏幕上的任何位置。现在，即使你滚动代码，无论你在 Visual Studio 中进行什么操作，DataTip 都会停留在屏幕的固定位置。悬浮 DataTip\
  \ 的好处是，你可以将它们移动到代码窗口之外，如果需要，甚至可以移动到第二个显示器上。\n\n在固定的 DataTip 工具栏中，注意有一个按钮可以让你在 DataTip\
  \ 中添加注释，该注释会随着你移动它而保持随位。![图 29-11 显示了一个带有注释的 DataTip。![image](img/f1093-02.jpg)\n\
  \n**图 29-11**\n\n### 数据可视化器\n\n正如你之前所看到的，你可以使用任意数量的数据可视化器来查看简单类型。例如，如果像字符串这样的简单变量包含\
  \ XML 片段，你可能希望以更符合数据原生格式的样式来可视化该数据，如![图 29-12 所示]。\n\n![image](img/f1094-01.jpg)\n\
  \n**图 29-12**\n\n可视化器的编写非常直观，尽管 Visual Studio 自带了文本、HTML、XML 和数据集（DataSet）的默认可视化器，但可以在互联网上寻找额外的可视化器，它们可能包含对图像、集合类等的支持。其结果是极其丰富且无与伦比的调试体验。\n\
  \n### 错误通知\n\n在交互式调试会期间，Visual Studio 会通过丰富的错误通知来帮助你。这些通知不仅报告了未处理的异常等事件，还提供了上下文相关的疑疑排除提示以及处理该情况的后续步骤。![图\
  \ 29-13 显示了一个未处理的 `NullReferenceException`，并附带了良好的建议：你可能尝试在在使用对象之前使用 `new` 关键字创建一个对象实例。噢！![image](img/f1094-02.jpg)\n\
  \n**图 29-13**\n\n### 编辑并继续（缺乏）支持，或编辑并刷新\n\n虽然 Visual Basic 提供了“编辑并继续”功能，让你可以在 C#\
  \ 和 VB 的调试期间无需重启会即可更改代码（在断点模式下，你可以修改代码修复 bug 并继续），但遗憾的是，该功能对 ASP.NET 开发者无效。\n\n\
  在 ASP.NET 中，你的程序集不是由 Visual Studio 编译的，而是由 ASP.NET 运行时编译的，使用了浏览器处理正常网页请求时相同的技术。为了配合调试器并支持\
  \ ASP.NET 中的“编辑并继续”，开发团队需要对 ASP.NET 运行时进行许多极其复杂的修改。ASP.NET 开发者并没有包含该功能的支持，而是可以使用`页面回收（page\
  \ recycling）`。\n\n这意味着在调试会期间进行了代码更改，然后通过 `F5` 刷新整个页面，自动进行重新编译并重新执行。基本上，ASP.NET 支持“编辑并刷新”，但不支持“编辑并继续”。\n\
  \n### 仅限我的代码调试\n\n.NET Framework 中的另一个概念称为“仅限我的代码（Just My Code）”调试。代码中的任何方法都可以显式标记为\
  \ `[DebuggerNonUserCode]` 属性。使用这种显式技术以及 CLR 内部的许多其他启发式方法，调试器会跳过对当前代码不重要的代码。你可以在工具\
  \ ![image](img/Ar.jpg) 选项 ![image](img/Ar.jpg) 调试中找到“启用仅限我的代码”设置。\n\n`[DebuggerHidden]`\
  \ 属性在 .NET 中仍然可用，并且无论用户的“仅限我的代码”偏好如何，它都会向调试器隐藏方法。.NET Framework 1.1 的属性 `[DebuggerStepThrough]`\
  \ 告诉调试器跳过（而不是进入）应用到它的任何方法；而 `[DebuggerNonUserCode]` 属性是一个更广泛、更完整的实现，它可以在运行时对委托、虚函数和任何任意复杂的代码生效。\n\
  \n请注意，这些属性和此用户选项是为了帮助你有效地调试代码，而不是让你被任何混乱的调用堆所误导。尽管这些可能非常有用，但在你确定不会意外隐藏你正尝试调试的错误之前，务必不要在你的组件上使用它们。通常，这些属性用于代理（proxies）或薄垫接层（thin\
  \ shim layers）等组件。\n\n### 跟踪点\n\n断点本身对于有条件或无条件地停止执行很有用。标准断点总是中断。条件断点让你根据条件进入交互式调试会。跟踪（Tracing）对于将变量的值或断言输出到调试器或其他位置有用。如果你将所有这些功能结合，你会得到什么？`跟踪点（Tracepoints）`，这是一个强大的\
  \ Visual Studio 功能。跟踪点可以防止你为了捕捉一个边缘情况的变量值而命中几十次断点。它们可以防止你通过在代码中布满断点来捕捉异常情况。\n\n\
  要插入跟踪点，请在代码编辑器中右键点击并选择断点 ![image](img/Ar.jpg) 插入跟踪点。你会得到如![图 29-14 所示的对话框。指示断点的图标是红色圆圈，而跟踪点的图标是红色菱形。可以使用对话框通过伪变量创建任意字符串，如\
  \ `$CALLSTACK` 或 `$FUNCTION`，以及作用域内的值。在![图 29-14 所示]，`i.Name`（放置在大括号中）的值显示在完整的字符串输出中。\n\
  \n![image](img/f1095-01.jpg)\n\n**图 29-14**\n\n#### 断点选项\n\n在代码中右键点击断点，可以访问许多管理断点标识符和行为的选项。\n\
  \n其中一个选项是为断点设置条件。要进入断点条件对话框，右键点击断点并在提供的菜单中选择“条件”。在这里创建一个触发断点的文本框。\n\n就像 DataTip\
  \ 一样，Visual Studio 2012 允许你导出断点。要导出所有断点，右键点击任何断点并在提供的菜单中选择“导出”。此导出允许将所有断点保存到 XML\
  \ 文件，然后可以由其他人加载。这是分发这些项目的方便方法。\n\n### 使用 IntelliTrace 进行调试\n\nVisual Studio 2012\
  \ 令人兴奋的改进之一是 `IntelliTrace`。IntelliTrace 为你提供了一个历史调试器，让你查看应用程序运行的历史，并允许你跳转到以前的时间点查看当时发生了什么。\n\
  \n此功能在 Visual Studio 2010 中只能在开发环境中使用，但在 Visual Studio 2012 中也可以在生产环境中使用。IntelliTrace\
  \ 在 Visual Studio 2012 中支持更多功能。你可以访问丰富的调试信息，显示过去的事件以及应用程序的调用信息。你可以结合 Visual Studio\
  \ 中的测试管理器支持使用 IntelliTrace，它收集诊断跟踪数据，用于发现难以复现的 bug。\n\n当在应用程序断点处停止时，你现在可以直接在 IntelliTrace\
  \ 对话框中看到这些历史，如![图 29-15 所示]。\n\n![image](img/f1096-01.jpg)\n\n**图 29-15**\n\n\n\n\
  \n\n从这里，你可以跳转到过去的任何点，并查看该时刻 `Locals` 对话框的值和 `Call Stack` 对话框的值。`IntelliTrace` 功能也是配置的。你可以通过点击\
  \ `IntelliTrace` 工具栏上的 `Open IntelliTrace Settings`，或者选择 `Tools` > Options 并在对话框左侧的项目中选择\
  \ `IntelliTrace` 来进入这些设置。\n\n通过 `IntelliTrace Events` 选项卡，你可以选择你想要处理的事件。通过进行适当的选择，你可以从大量的技术和情况进行选择。\n\
  \n最后，`Modules` 选项卡允许你指定 `IntelliTrace` 应该工作的特定模块。\n\n### 调试多线程\n\nVisual Studio\
  \ 2012 包含一个对话框，允许你查看应用程序正在使用的每个线程中发生的情况。你通过图 29-16 所示的 `Threads` 对话框来实现这一点。\n\n\
  ![image](img/f1096-02.jpg)\n\n**图 29-16**\n\n你可以双击线程并跳转到调试时该线程在代码所在的位置。你也可以通过打开\
  \ `Parallel Stacks` 对话框来获取工作线程的可视化族树视图。\n\n### 客户端 JavaScript 调试\n\nVisual Studio\
  \ 2012 提供了优秀的客户端 JavaScript 调试功能。如果你在 Internet Explorer 的调试会话中运行 ASP.NET ，你需要启用脚本调试。\n\
  \n开启脚本调试后，尝试一个简单的 ASP.NET 页面，其中包含一些 JavaScript，可以在点击按钮时将文本框中的文本改为大写（列表 29-5）。\n\n\
  在客户端 JavaScript 的其中一行上设置断点。注意，这是运行在浏览器中的代码，而不是在 Web 服务器上。从列表 29-5 中的页面启动调试会话。Visual\
  \ Studio 将在该点处中断，如图 29-17 所示。\n\n![image](img/f1097-01.jpg)\n\n**图 29-17**\n\nVisual\
  \ Studio 中的 JavaScript 调试器支持变量提示、可视化器、调用堆栈、本地变量、监视以及你在调试基于 .NET 的语言时所习惯的所有的所有功能。\n\
  \n### SQL 存储过程调试\n\n数据库项目是基于文件的项目，允许你管理和执行数据库查询。你可以将现有的 SQL 脚本添加到项目中，或在 Visual Studio\
  \ 中创建新的脚本并编辑它们。数据库项目和 SQL 调试在 Visual Studio 的 Express 或 Standard 版本中是不可用的。它们仅在 Professional\
  \ 或 Team 版 Visual Studio SKU/版本中可用。\n\n在调试数据库应用程序时，你无法使用 `Step Into` (`F11`）从应用程序层代码步入\
  \ SQL Server 中的代码（无论是 T-SQL 还是 CLR SQL）。但是，你可以在存储过程代码中设置断点，并使用 `Continue` (`F5`）执行代码到该设置的断点。\n\
  \n在 SQL Server 2012 上调试 SQL 时，请注意你可能正在运行的任何软件或硬件防火墙。有时，你的软件防火墙会警告你正在尝试的操作。务必在任何警告对话框中选择“取消阻止”，以确保\
  \ SQL Server 2012 和 Visual Studio 可以通信。\n\n如果你正在使用 SQL 账户连接 SQL Server，请确保你运行 Visual\
  \ Studio 的 Windows 用户帐户也是 SQL Server 机器上的管理员。你可以使用 SQL 命令 `sp_addsrvrolemember 'Domain\\\
  Name', 'sysadmin'` 将账户添加到 SQL Server 的 `sysadmin` 权限中。当然，永远不要在生产环境中这样做；更好的做法是在一台本地安装了所有内容的机器上进行调试。\n\
  \n如果你在 SQL Server 2012 上使用 NT 身份验证模型，确保该帐户具有运行 `sp_enable_sql_debug` 存储过程的权限。你可以使用\
  \ SQL 命令 `CREATE USER UserName FOR LOGIN 'Domain\\Name'` 然后跟随 `GRANT EXECUTE ON\
  \ sp_enable_sql_debug TO UserName` 来授予帐户访问此存储过程的权限。这创建了一个与特定 Windows 用户直接关联的 SQL\
  \ 用户，然后显式地授予该用户调试 T-SQL 的权限。在 SQL Server 2000 上，用户必须具有访问扩展存储过程 `sp_sdidebug` 的权限。\n\
  \n## 异常和错误处理\n\n当你的 ASP.NET 应用程序代码发生异常时，你可以通过多种方式处理它，但最好的方法是多管齐下的：\n\n*   捕获你预期的异常：\n\
  \    *   在易出错的代码周围使用 `try/catch`。这始终可以捕获你可以处理的特定异常，例如 `System.IO.FileNotFoundException`。\n\
  \    *   与其在页面级别在特定代码块周围捕获异常，不如考虑使用页面级错误处理程序来捕获可能发生在页面任何地方的异常。\n*   但要为未处理的异常做好准备：\n\
  \    *   如果特定页面应该对任何未处理的异常显示特定的错误页面，请设置 `Page.Error` 属性。你也可以使用 `<@Page>` 指令或代码后所需的属性来实现。\n\
  \    *   在你的 `web.config` 中为 400 和 500 错误设置默认错误页面。\n    *   设置一个默认的错误处理程序，将异常记录到事件日志、文件或其他机制。\n\
  \n*未处理的异常*这个词听起来可能令人惊，但请记住，对于你无法恢复的异常，它是可以接受的。对于这些情况，依靠全局异常处理程序来处理你可以呈现给用户的友好页面。\n\
  \n### 页面上的异常处理\n\n要在页面级别处理异常，请重写 `System.Web.UI.Page` 继承自 `TemplateControl` 类的 `OnError`\
  \ 方法（参见列表 29-6）。调用 `Server.GetLastError` 可以访问刚刚发生的异常。意识到可能发生了异常链，你可以使用 `GetBaseException`\
  \ 方法返回根异常。\n\n### 应用程序异常处理\n\n在集中位置捕获异常的技术适用于 `Global.asax` 中的应用程序级处理，如列表 29-7 所示。如果异常在页面上未捕获，它将冒泡到应用程序，用户将看到调用堆栈。\n\
  \n未处理的应用程序错误将变为 HTTP 状态码 500 并在浏览器中显示错误。这些错误（包括调用堆栈和其他技术细节）在开发期间可能有用，但通常，你想创建一个错误处理程序（如之前所示），记录你的错误并给用户一个更友好的页面。\n\
  \n### HTTP 状态码\n\n每个 `HttpRequest` 都会产生一个 `HttpResponse`，每个 `HttpResponse` 都包含一个状态码。表\
  \ 29-2 描述了 11 个特别有趣的 HTTP 状态码。\n\n| 状态码 | 解释 |\n| --- | --- |\n| 200 OK | 一切正常。\
  \ |\n| 301 Moved Permanently | 永久移动。提醒调用者使用新的永久 URL 而不是他到达这里的 URL。 |\n| 302 Found\
  \ | 在 `Response.Redirect` 时返回。这是“不，不，现在看这里”的方式。 |\n| 304 Not Modified | 当条件 `GET`\
  \ 请求的请求文档未修改时作为结果返回。它是所有基于浏览缓存的基础。使用 304 时不允许返回 HTTP 消息体。 |\n\n\n\n\n\n| 307 Temporary\
  \ Redirect | 将 ASMX Web 服务调用重定向到备 URL。在 ASP.NET 中较少使用。 |\n| 400 Bad Request | 请求格式错误。\
  \ |\n| 401 Unauthorized | 请求需要用户进行身份验证。 |\n| 403 Forbidden | 身份验证失败，表示服务器理解该请求但无法执行。\
  \ |\n| 404 Not Found | 服务器未找到处理此请求的适当文件或处理程序。这意味着这可能只是一个临时状态。在 ASP.NET 中，发生这种情况不仅是因为找不到文件，还可能因为文件被错误地映射到了一个无法提供请求服务的\
  \ `IHttpHandler` 上。 |\n| 410 Gone | 等同于永久性的 404，告知客户端应尽可能删除对此链接的任何引用。404 通常表示服务器不知道该状态是否是永久的。\
  \ |\n| 500 Internal Server Error | 该错误的官方文本描述为“服务器遇到了一个预料之外的状况，导致其无法执行请求”，但当任何未处理的异常从\
  \ ASP.NET 一层层向上抛给用户时，就会发生此错误。 |\n\n### 表 29-2\n\n任何大于或等于 400 的状态码都被视为错误，除非你另有配置，否则用户可能会在他们的浏览器中看到一条不友好的消息。如果你尚未在\
  \ ASP.NET 运行时通过检查异常类型来处理这些错误，或者错误发生在 ASP.NET 之外且你希望向用户显示友好的消息，可以在 `web.config` 文件中为任何状态代码分配页面，如下例所示：\n\
  \n```xml\n <customErrors mode =\"On\" >\n      <error statusCode =\"500\" redirect\
  \ =\"FriendlyMassiveError.aspx\" />\n  </customErrors>\n```\n\n在修改 `web.config`\
  \ 文件的自定义错误（customer errors）部分后，请确保有一个可显示给用户的页面。错误重定向中的一个经典错误是将用户重定向到一个会导致错误的页面，从而导致其陷入循环。如果你的应用程序中有复杂的页眉或页脚，且这些内容在错误页面上出现时可能会导致错误，请务必小心使用。避免访问数据库或执行任何需要用户授权或要求用户会话处于特定状态的后端操作。换句话说，请确保错误页面是一个可靠的独立单元。\n\
  \n## 使用页面检查器进行调试\n\n页面检查器（Page Inspector）是 Visual Studio 2012 中的一个新工具选项，它将浏览器中的诊断工具体验带入了\
  \ Visual Studio。这意味着通过使用页面检查器，你可以检查元素并查看生成标记的源代码文件和行数。页面检查器还允许检查 DOM 元素以及 CSS 元素，以便修改这些属性并实时查看更改。\n\
  \n图 29-18 显示了应用程序在页面检查器中加载时的外观。\n\n![image](img/f1102-01.jpg)\n\n### 图 29-18\n\n\
  如果你想在页面检查器加载应用程序，可以右键点击项目并选择“在页面检查器中查看”（View in Page Inspector）选项。图 29-19 显示了 Visual\
  \ Studio 2012 中的此选项。当你点击此选项时，Visual Studio 会编译你的项目并在页面检查器中加载应用程序。\n\n![image](img/f1102-02.jpg)\n\
  \n### 图 29-19\n\n页面检查器的主要功能是源映射（Source Mapping）。当你检查页面上的某个元素时，页面检查器会在 Visual Studio\
  \ 的预览模式下打开相应的文件，并高亮生成该元素的源代码。例如，图 29-20 显示了预览模式下的 `Default.aspx`，当你在页面检查器中检查页面标题时，它会高亮\
  \ `Page Title` 属性。\n\n![image](img/f1103-01.jpg)\n\n### 图 29-20\n\n页面检查器还支持 JavaScript\
  \ 映射。这意味着可以使用页面检查器来确定在应用程序中浏览的页面上正在使用 JavaScript 文件中的哪个文件或哪行代码。例如，图 29-21 显示了一个使用\
  \ Knockout 的 SPA 应用程序。当你检查元素时，页面检查器的调用堆栈（Call Stack）选项卡会显示导致该元素生成的 JavaScript 调用堆栈。你可以点击调用堆栈中的任何函数，页面检查器将带你到对应的\
  \ JavaScript 代码行。当你构建使用大量 JavaScript 且 JavaScript 代码正在修改 DOM 元素的应用程序时，这非常有用。\n\n\
  ![image](img/f1103-02.jpg)\n\n### 图 29-21\n\n正如你之前学到的，页面检查器可以与 DOM 和 CSS 工具交互，以修改\
  \ CSS 属性并实时查看更改。例如，要修改 CSS 属性，你可以选择页面检查器中的“样式”（Styles）选项卡并实时查看更改。\n\n\n\n\n\n在开始编写处理程序（handlers）或模块之前，了解\
  \ IIS 和 ASP.NET 通常如何处理传入的 HTTP 请求，以及你有哪些选项可以将自定义逻辑插入这些请求中是有帮助的。IIS 是传入 HTTP 请求的基本端点。从非常高层次来看，它的工作是监听并验证传入的\
  \ HTTP 请求。然后它将这些请求路由到适当的模块进行处理，并将结果返回给原始请求者。ASP.NET 是 IIS 可能会将请求传递过去处理的模块之一。然而，具体的处理过程如何，以及你如何将自己的逻辑集成到管道中，取决于你所使用的\
  \ IIS 版本。\n\n### IIS 6 和 ASP.NET\n\n如果你正在使用 IIS 6，那么 HTTP 请求处理管道对于托管代码开发者来说基本上是一个“黑盒”。IIS\
  \ 基本上将 ASP.NET 视为它可以传递请求进行处理的模块之一，而不是作为 IIS 请求处理管道的集成部分。图 30-1 显示了 IIS 6 和 ASP.NET\
  \ 的基本请求处理管道。\n\n![image](img/f1106-01.jpg)\n\n**图 30-1**\n\n如你所见，IIS 和 ASP.NET 的请求管道非常相似，某些任务（例如身份验证）在两个管道之间甚至是重复的。此外，尽管你可以使用托管代码编写处理程序和模块，但它们仍然在\
  \ ASP.NET 进程的隔离上下文中处理。如果你想更深入地集成到 IIS 管道中，你就被迫使用原生代码创建模块。\n\n### IIS 7、IIS 8 和 ASP.NET\n\
  \n从 IIS 7 开始，IIS 中的请求处理管道使用一个开放且高度可扩展的基于模块系统进行了完全重构。这种变化在 IIS 8 中仍然存在。IIS 不再将 ASP.NET\
  \ 视为一个独立的实体，而是将 ASP.NET 深度集成到 IIS 请求处理管道中。如图 30-2 所示，请求处理管道被精简了，以消除重复过程，并允许你在管道中集成托管模块。\n\
  \n![image](img/f1107-01.jpg)\n\n**图 30-2**\n\n由于 ASP.NET 模块是一等公民，你可以将它们放置在管道中的任何位置，甚至用自己的自定义功能完全替换现有模块。以前需要你使用非托管代码编写自定义\
  \ ISAPI 模块的功能，现在简单地被包含你逻辑的托管代码模块所取代。\n\n### ASP.NET 请求处理\n\n无论 IIS 版本如何，基本的 HTTP\
  \ 请求管道模型都有两个处理请求的核心机制：`HttpModules` 和 `HttpHandlers`。ASP.NET 使用这两种机制来处理传入的 ASP.NET\
  \ 请求，生成响应并将该响应返回给客户端。事实上，你可能已经熟悉了 `HttpModules` 和 `HttpHandlers`——尽管你可能并不知道这一点。如果你曾经用过\
  \ ASP.NET 的内置缓存或身份验证功能，你就已经使用过几个不同的 `HttpModules`。此外，如果你曾经发布过 ASP.NET 应用程序，即使只是一个简单的\
  \ *Hello World* 页面并在浏览器中查看过它，你就使用过 `HttpHandler`。ASP.NET 使用处理程序来处理和渲染 ASPX 页面和其他文件扩展名。模块和处理程序允许你在请求处理管道的不同点接入，并与正在由\
  \ IIS 处理的实际请求进行交互。\n\n如你在图 30-1 和 30-2 中所示，ASP.NET 将每个传入的请求通过管道中的一层预处理 `HttpModules`。ASP.NET\
  \ 允许每个请求在管道中存在多个模块。在传入的请求通过每个模块后，它会被传递给 `HttpHandler`，由它处理请求。注意，虽然单个请求可能会通过许多不同的模块，但它只能由一个处理程序处理。处理程序通常负责为传入的\
  \ HTTP 请求创建响应。在处理程序完成执行并生成响应后，响应将通过一系列后处理模块传回，然后才返回给客户端。\n\n你现在应该对 IIS 和 ASP.NET\
  \ 请求管道有一个基本的了解——以及你如何使用 `HttpModules` 和 `HttpHandlers` 与管道进行交互。接下来的章节将深入探讨这些每项内容。\n\
  \n## HTTPMODULES\n\n`HttpModules` 是可以自己插件到请求处理管道中的简单类。它们通过挂钩应用程序在处理 HTTP 请求时抛出的若干事件来实现这一点。要创建一个\
  \ `HttpModule`，你只需要创建一个派生自 `System.Web.IHttpModule` 接口的类。该接口要求你实现两个方法：`Init` 和 `Dispose`。列表\
  \ 30-1（本章代码下载中的文件 `App_Code\\SimpleModule.cs` 和 `App_Code\\SimpleModule.vb`）显示了实现\
  \ `IHttpModule` 接口后创建的类存根。\n\n`Init` 方法是你用于实现 HttpModule 功能的主要方法。注意，它有一个方法参数——一个名为\
  \ `context` 的 `HttpApplication` 对象。此参数允许你访问当前的 `HttpApplication` 上下文，你用它来连接请求处理期间触发的不同事件。表\
  \ 30-1 显示了你可以在 `Init` 方法中注册的事件。`Order` 列指示了它们第一次触发的顺序。某些事件在请求处理过程中会触发多次。\n\n| **EVENT\
  \ NAME** | **ORDER** | **DESCRIPTION** |\n| --- | --- | --- |\n| `AcquireRequestState`\
  \ | 9 | ASP.NET 运行时准备好获取状态。 |\n| `AuthenticateRequest` | 2 | ASP.NET 运行时准备好验证用户身份。\
  \ |\n| `AuthorizeRequest` | 4 | ASP.NET 运行时准备好授权用户访问资源。 |\n| `BeginRequest` | 1\
  \ | ASP.NET 运行时接收到一个新的 HTTP 请求。 |\n| `Disposed` | 23 | ASP.NET 完成对 HTTP 请求的处理。 |\n\
  | `EndRequest` | 20 | 在向客户端发送响应内容之前触发。 |\n| `Error` | N/A | 在处理 HTTP 请求期间发生未处理的异常时。\
  \ |\n| `LogRequest` | 18 | 在 ASP.NET 对当前请求进行任何日志记录之前。 |\n| `PostAcquireRequestState`\
  \ | 10 | 与当前请求相关的状态（例如会话状态）已获取时。 |\n| `PostAuthenticateRequest` | 3 | 安全模块已建立用户身份时。\
