  \ 命名空间。\n\n\n\n\n\n在此控件的 `<Series>` 元素中，你可以根据需要包含任意数量的系列，这在并列绘制多个项目的图表（例如两个或多个股票的价格时间序列图）时是相当常见的。\n\
