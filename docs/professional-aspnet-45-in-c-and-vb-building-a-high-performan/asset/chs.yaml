  \ 4.5 默认提供了这些成员提供程序，允许.存储用户信息。............   这些功能。\n\n**图 14-2**\n\n如图所示，ASP.NET\
  \ 4.5 默认提供了大量的提供程序。某些系统只有一个提供程序（例如配置系统，仅包含一个连接到 SQL Server 的提供程序），而其他系统包含多个提供程序（例如\
  \ WebEvents 提供程序，包含六个独立的提供程序）。接下来，本章将介绍如何设置 SQL Server 以与本章介绍的许多提供程序配合。你可以使用 SQL\
