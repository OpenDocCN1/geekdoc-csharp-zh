  \ 应用程序向远程 XML Web 服务发送 SOAP 请求。返回的 `DataSet` 被绑定到 `GridView` 控件，并且页面重绘，如 图 13-10\
  \ 所示。\n\n![image](img/f468-01.jpg)\n\n**图 13-10**\n\n（注：后续重复文本已根据要求处理，核心描述为向远程 XML\
  \ Web 服务发送 SOAP 请求、返回的 `DataSet` 绑定到 `GridView` 控件并页面重绘的过程，见图 13-10。）\n\n### 重载方法\
  \ (Overloading Methods)\n\n在 .NET 的面向对象世界中，在你开发的代码中使用方法重载是完全可能的。真正的面向对象语言支持多态性，而方法重载就是其中一部分。方法重载允许你拥有多个同名但签名不同的方法。通过方法重载，可以调用一个方法，但调用会根据完整签名路由到适当的方法。列表\
  \ 13-8 显示了标准方法重载的示例。\n\n在示例中，两个方法都具有相同的名称 `HelloWorld`。那么，当你调用 `HelloWorld` 时会调用哪一个呢？这取决于你传递给方法的签名。例如，你可能会提供以下内容：\n\
  \n```\nLabel1.Text = HelloWorld();\n```\n\n这产生仅为 `Hello` 的结果。然而，你可能会使用以下签名调用 `HelloWorld()`\
  \ 方法：\n\n```\nLabel1.Text = HelloWorld(\"Jason Gaylord\");\n```\n\n然后你会得到 `Hello\
  \ Gaylord` 的结果。正如你看到的，方法重载是你的 ASP.NET 应用程序可以有效利用的一个伟大特性——但你如何重载 Web 方法呢？\n\n如果你已经尝试过重载任何\
  \ Web 方法，你可能在浏览器中调出 Web 服务时收到以下错误：\n\n```\nBoth System.String HelloWorld(System.String)\
  \ and System.String HelloWorld() use the message name 'HelloWorld'. Use the MessageName\
  \ property of the WebMethod custom attribute to specify unique message names for\
  \ the methods.\n```\n\n正如该错误所示，重载 Web 方法所需的额外步骤是使用 `MessageName` 属性。列表 13-9 显示了方法（该列表分别更新了本章代码下载中的\
  \ WebService.vb 和 WebService.cs 文件）。\n\n\n\n除了为 `WebMethod` 特性添加 `MessageName` 属性外，你还必须禁用\
  \ Web 服务对 WS-I Basic Profile 规范的遵循——如果你对 Web 服务执行了 `WebMethod` 重载，它将不会遵循该规范。你可以通过几种方法禁用对\
  \ WS-I Basic Profile 规范的遵循。一种方法是在代码中添加 `<WebServiceBinding>` 属性，如列表 13-10 所示。\n\n\
  另一种选项是在 `web.config` 文件中关闭 WS-I Basic Profile 功能，如列表 13-11 所示。\n\n在你启用 Web 服务重载\
  \ `WebMethod` 之后，当你在浏览器中打开 Web 服务接口测试页时，你可以通过它们的 `MessageName` 值属性看到两个定义的 `WebMethod`（参见图\
  \ 13-11）。\n\n![image](img/f471-01.jpg)\n\n**图 13-11**\n\n尽管你可以看到 `WebMethod` 的名称是相同的，但\
  \ `MessageName` 属性显示它们是不同的方法。当消费 Web 服务的开发者对你的 Web 服务创建 Web 引用时，他们将只会看到一个可用的方法名（在本例中为\
  \ `HelloWorld`）。这通过调用这些方法的应用程序中的 Visual Studio 2012 感知（IntelliSense）显示（参见图 13-12）。\n\
  \n![image](img/f471-02.jpg)\n\n**图 13-12**\n\n在弹出的引导开发者签名结构的框中，你可以看到两个可用选项——一个是空签名，另一个需要一个单个字符串。\n\
  \n## 缓存 Web 服务响应\n\n缓存是你使用 .NET 构建的几乎每个应用程序中都包含的一项重要特性。第 22 章 涵盖了 ASP.NET 为你提供的大多数缓存功能，但\
  \ .NET 中 Web 服务的特定功能允许你缓存发送给任何服务消费者的 SOAP 响应。\n\n首先，通过回顾，记住缓存是维护一个内存存储的能力，其中数据、对象和各种项目被存储起来供重用。此功能提高了你构建和管理的应用程序的响应速度。有时，返回缓存结果可以极大影响性能。\n\
  \nXML Web 服务使用一个属性来控制 SOAP 响应的缓存——`CacheDuration` 属性。列表 13-12（该章节下载代码中的 `TimeService.vb`\
  \ 和 `TimeService.cs` 文件）显示了它的用法。\n\n如你所见，`CacheDuration` 在 `WebMethod` 属性中的用法类似于\
  \ `Description` 和 `Name` 属性。`CacheDuration` 接收一个 `Integer` 值，等于缓存 SOAP 响应的秒数。\n\n\
  当第一个请求进来时，服务器缓存 SOAP 响应，消费者在下一分钟内将在 SOAP 响应中获得相同的时间戳。这一分钟结束后，存储的缓存被丢弃，生成一个新的响应并再次存储在缓存中，为下一分钟内的所有其他请求提供服务。\n\
  \n在缓存 SOAP 响应的许多好处中，你会发现，当你的响应基本上在没有任何变化的情况下被反复创建时，你应用程序的性能将大大提高。\n\n## 使用 SOAP\
  \ 头部\n\n扩展 SOAP 消息能力的常见形式之一是将请求的元数据添加到 SOAP 消息本身中。元数据通常被添加到 SOAP 封中称为 `SOAP header`（SOAP\
  \ 头部）的部分。图 13-13 显示了 SOAP 消息的结构。\n\n![image](img/f472-01.jpg)\n\n**图 13-13**\n\n\
  整个 SOAP 消息被称为 `SOAP envelope`（SOAP 包）。SOAP 消息中包含了 `SOAP body`——这是你迄为止在每个示例中一直在使用的\
  \ SOAP 消息的一部分。它是 SOAP 消息的要素元素。\n\nSOAP 消息唯一的可选组件是 SOAP 头部。它是 SOAP 消息的一部分，你其中放置关于整个\
  \ SOAP 请求的任何元数据，而不是将其整合到任何 `WebMethod` 的签名中。将元数据与实际请求分开是重要的。\n\n你应该在头部中包含什么类型的信息？它可以包含很多内容。放在\
  \ SOAP 头部中较常见的项目之一是消费你的 Web 服务或访问特定逻辑或数据所需的任何身份验证/授权功能。将用户名和密码放在消息的 SOAP 头部内是你可能包含的内容的一个良好示例。\n\
  \n### 使用 SOAP 头部构建 Web 服务\n\n你可以在 Visual Studio 首次打开默认 `.asmx` 页面时显示的示例 `HelloWorld`\
  \ Web 服务的基础上进行构建（来自列表 13-4）。将新的 `.asmx` 文件命名为 `HelloSoapHeader.asmx`。第一步是添加一个类，该类代表客户端要放在\
  \ SOAP 头部中的对象。\n\n`SoapHeader` 类继承自 `System.Web.Services.Protocols.SoapHeader`。它将\
  \ `<soap:header>` 序列化为 XML。在列表 13-13 的示例中，需要两个元素：用户名和密码，类型均为 `String`。\n\n在 Web\
  \ 服务类内部，但在 `WebMethod` 外部，你创建一个 `SoapHeader` 实例：\n\n```vb\nPublic myHeader As HelloHeader\n\
  ```\n\n现在你已经有一个名为 `myHeader` 的 `HelloHeader` 类实例，你可以在 `WebMethod` 中使用它。由于 Web 服务可以包含任意多个\
  \ `WebMethod`，因此并不是所有 `WebMethod` 都要求使用实例头部。通过在 `WebMethod` 声明之前放置 `SoapHeader`\
  \ 特性，你可以指定 `WebMethod` 是否使用特定的头部实例化。\n\n```csharp\n[WebMethod]\n[SoapHeader(\"myHeader\"\
  )]\npublic string HelloWorld()\n{\n    // 代码在此...\n}\n```\n\n`SoapHeader` 特性接收实例化类名的\
  \ `string` 值——在本例中为 `myHeader`。\n\n从这里开始，`WebMethod` 使用 `myHeader` 对象。如果没有找到 `myHeader`\
  \ 对象（这意味着客户端没有在其构建的 SOAP 消息中发送头部），然而，如果在 SOAP 请求的头部中提供了值，这些值将用于返回的 `string` 值。\n\
  \n### 使用 SOAP 头部消费 Web 服务\n\n构建使用 SOAP 头部向 Web 服务发送 SOAP 请求的 ASP.NET 应用程序并不困难。与不包含\
  \ SOAP 头的 Web 服务一样，你直接在 Visual Studio 中对远程 Web 服务创建 Web 引用。\n\n对于 ASP.NET 页面，创建一个仅包含单个\
  \ Label 控件的简单页面。Web 服务的输出放在 Label 控件中。列表 13-15 显示了 ASP.NET 页面的代码。\n\n\n\n\n实例化两个对象。第一个是实际的\
  \ Web 服务 `HelloSoapHeader`。第二个实例化为 `wsHeader` 的对象是 `SoapHeader` 对象。在这两个对象都实例化之后、在应用程序中发送\
  \ SOAP 请求之前，你构建了 SOAP 头部。这给 `wsHeader` 对象的 `Username` 和 `Password` 属性赋值一样简单。分配完这些属性后，你通过\
  \ `HelloHeaderValue` 属性将 `wsHeader` 对象关联到 `ws` 对象。当你完成了构建的 SOAP 头部对象与实际 `WebMethod`\
  \ 对象（`ws`）之间的关联后，你就可以像往常那样发送 SOAP 请求了：\n\n```\n Label1.Text = ws.HelloWorld()\n\
  ```\n\n运行页面将在浏览器中产生如图 13-14 所示的结果。\n\n![image](img/f476-01.jpg)\n\n**图 13-14**\n\
  \n然而，更有趣的是，SOAP 请求显示 SOAP 头部确实被构建到了整个 SOAP 消息中，如代码列表 13-16 所示。\n\n此代码返回如代码列表 13-17\
  \ 所示的 SOAP 响应。\n\n### 使用 SOAP 1.2 请求 Web 服务\n\n在消费 Web 服务的 ASP.NET 应用程序中，你可以控制将\
  \ SOAP 请求构建为 SOAP 1.1 消息还是 1.2 消息。代码列表 13-18 更改了之前的示例，使请求使用 SOAP 1.2 而不是默认的 SOAP\
  \ 1.1。\n\n在这个示例中，你首先提供 Web 服务对象的实例化并使用 `SoapVersion` 属性。该属性取 `System.Web.Services.Protocols.SoapProtocolVersion.Soap12`\
  \ 值来专门与 SOAP 1.2 配合。\n\n有了这段代码，SOAP 请求将采用如代码列表 13-19 所示的结构。\n\n这两个示例之间的区别在于使用的 `xmlns:soap`\
  \ 命名空间。区别实际上位于 HTTP 头部中。当你比较 SOAP 1.1 和 1.2 消息时，你会发现 `Content-Type` 属性存在差异。此外，SOAP\
  \ 1.2 HTTP 头部不再使用 `soapaction` 属性，因为现在已合并到 `Content-Type` 属性中。\n\n你可以通过在 `web.config`\
  \ 文件中进行适当设置，关闭你构建的 Web 服务的 SOAP 1.1 或 1.2 功能，如代码列表 13-20 所示。\n\n## 异步消费 Web 服务\n\
  \n你在本章中处理过的所有 Web 服务都是同步执行的。这意味着在从 ASP.NET 应用程序代码发送请求后，在接收到 SOAP 响应之前，应用程序将处于完全停滞状态。\n\
  \n对于某些请求，调用 `WebMethod` 并获取结果可能需要一些时间。有时，你无法控制你请求数据的 Web 服务，因此，你无法控制这些服务的性能或响应时间。由于这些原因，你应该考虑异步消费\
  \ Web 服务。\n\n一个发送异步请求的 ASP.NET 应用程序可以在初始 SOAP 请求等待响应时处理其他编程任务。当 ASP.NET 应用程序完成其他项目的工作后，它可以返回从\
  \ Web 服务中获取结果。\n\n好消息是，要构建一个允许异步通信的 XML Web 服务，你不需要执行任何额外的操作。所有的 `.asmx` Web 服务都内置了与消费者进行异步通信的能力。代码列表\
  \ 13-21 中的 Web 服务就是一个示例。（此列表包含了本章代码下载中各自项目里的 HelloWorldAsyncService.vb 和 HelloWorldAsyncService.cs\
  \ 文件。）\n\n该 Web 服务返回一个简单的字符串 `Hello World`，但在返回之前，Web 服务会进行为期为 1000 毫秒的停顿。你通过使用\
  \ `Sleep` 方法让 Web 服务线程休眠来实现这一点。\n\n接下来，看看 ASP.NET 应用程序如何异步消费这个慢速 Web 服务，如代码列表 13-22\
  \ 所示。\n\n当你在消费端 ASP.NET 应用程序向远程 Web 服务创建引用时，你不仅能在 IntelliSense 中看到可用的 `HelloWorld\
  \ WebMethod`，还能看到 `BeginHelloWorld()` 和 `EndHelloWorld()`。要异步处理 Web 服务，你必须利用 `BeginHelloWorld()`\
  \ 和 `EndHelloWorld()` 方法。\n\n使用 `BeginHelloWorld()` 方法向 Web 服务发送 SOAP 请求，但 ASP.NET\
  \ 应用程序不再空闲地等待响应，而是继续完成其他任务。在这种情况下，它并没有在做任何重要的事情——只是在循环中计算所花费的时间。\n\n从 ASP.NET 应用程序发送\
  \ SOAP 请求后，你可以使用 `IAsyncResult` 对象检查是否有 SOAP 响应在等待。你通过使用 `myiar.IsCompleted` 来实现这一点。如果异步调用未完成，ASP.NET\
  \ 应用程序会将 `x` 的值加 1。它继续这样做，直到 Web 服务准备好返回响应。响应是通过调用 `EndHelloWorld()` 获取的。\n\n运行此应用程序的结果与图\
  \ 13-15 所示。\n\n![image](img/f480-01.jpg)\n\n**图 13-15**\n\n## Windows Communication\
  \ Foundation (WCF)\n\n在过去，构建需要在点之间通信消息的组件并不是一项简单的任务，因为微软提供了多种你可以使用的技术。由于这种困惑，微软创建了\
  \ Windows Communication Foundation (WCF)，帮助你决定要采取的路径。\n\nWCF 是一个用于面向服务的架构 (SOA)\
  \ 的框架。微软希望为开发者提供一个框架，以运行正确的面向服务的架构。使用 WCF，你可以利用所有传输技术的强大特性。WCF 是之前所有消息传输技术的答案和继者。\n\
  \n### WCF 概述\n\n如所述，Windows Communication Foundation 是在微软环境中构建分布式应用程序的一种。虽然分布式应用程序是基于该环境构建的，但这并不意味着消费者必须是微软客户端或使用任何微软组件或技术来完成任务。相反，构建\
  \ WCF 服务意味着你也在构建符合 SOA 核心原则的服务，并且这些服务是与供应商无关的——因此，它们可以被任何人消费。\n\n构建 WCF 服务并不困难。这里的假设是你已经为了这些示例安装了\
  \ .NET Framework 4.5。\n\n\n\n\n![image](img/f481-01.jpg)\n\n**图 13-16**\n\n当你以这种方式构建\
  \ WCF 项目时，其核心思想是构建一个传统的类库，并将其编译为 `DLL`，然后将其添加到另一个项目中。对于大型项目而言，代码与项目的分离是一种非常强大的划分方式。尽管如此，你同样可以轻松地在你的\
  \ `.NET` 项目中直接构建 WCF 服务，无论项目是控制台应用程序还是 Windows Forms 应用程序。本章示例采用的方法向你展示了如何构建一个托管在控制台应用程序中的\
  \ WCF 服务。请记住，对于你实际构建和部署的服务，将它们直接构建为 WCF 服务库项目，并在你的项目或 `IIS` 本身中使用创建的 `DLL` 通常是更好的选择。\n\
  \n在开始构建 WCF 服务 之前，请先考虑一个基于 WCF 框架构建的服务由哪些部分组成。\n\n### 构成 WCF 服务的要素\n\n在观察 WCF 服务时，你应该理解它由三部分组成：服务、一个或多个端点（endpoints）以及托管该服务的环境。\n\
  \n服务是用一种符合 `.NET` 标准的语言编写的类。该类可以包含通过 WCF 服务暴露或或方法。服务可以拥有一个或多个端点。端点用于通过服务与客户端进行通信。\n\
  \n端点本身也由三部分组成。这些部分通常由微软定义为 WCF 的 `ABC`。WCF 的每一个字母在 WCF 模型中都有特定的含义，包括：\n\n*   “A”代表\
  \ `address`（地址）。\n*   “B”代表 `binding`（绑定）。\n*   “C”代表 `contract`（合约）。\n\n基本上，你可以这样理解：“A”是哪里（where），“B”是怎样做（how），而“C”是什么内容（what）。最后，托管环境是服务所在的地方。这构成了一个应用程序域和进程。这三个元素（服务、端点和托管环境）组合在一起，创建了一个\
  \ WCF 服务方案，如图 13-17 所示。\n\n![image](img/f482-01.jpg)\n\n**图 13-17**\n\n下一步是使用 WCF\
  \ 框架创建一个基础服务。\n\n### 创建你的第一个 WCF 服务\n\n在托管服务之前，你必须执行两个主要步骤。首先，你必须创建一个服务合约（service\
  \ contract）。其次，你必须创建一个数据合约（data contract）。服务合约本质上是一个类，其中包含了你想从 WCF 服务中暴露的方法。数据合约是一个指定了你想从接口中暴露的结构的类。\n\
  \n一旦你准备好了服务类，你几乎可以在任何地方托管它。当从 Visual Studio 2012 运行此服务时，你将能够使用与任何标准 `ASP.NET` 应用程序相同的内置托管机制。要构建第一个\
  \ WCF 应用程序，从 Visual Studio 2012 菜单中选择 `File` ![image](img/Ar.jpg) `New` ![image](img/Ar.jpg)\
  \ `Web Site` 并保持默认。\n\n#### 创建服务\n\n第一步是创建接口。要做到这一点，右键点击项目并选择 `Add New Item`（添加新项）。在对话框中，选择\
  \ `WCF Service`，并将其命名为 `ICalculator`，如图 13-18 所示。\n\n![image](img/f483-01.jpg)\n\
  \n**图 13-18**\n\n你使用 `ServiceContract` 属性来定义该类。这需要引用 `System.ServiceModel` 命名空间。\n\
  \n```csharp\n[ServiceContract]\npublic interface ICalculator\n{\n```\n\n在接口内部定义了四个方法。每个方法都要求具有\
  \ `OperationContract` 属性：\n\n```csharp\n[OperationContract]\nint Add(int a, int\
  \ b);\n}\n```\n\n#### 接口操作\n\n下一步是创建一个实现该接口的类。新类不仅实现了该接口，而且实现了服务合约。对于此示例，请将此类添加到相同的\
  \ `Calculator.vb` 或 `.cs` 文件中。通过这些新增内容，你可以看到你不需要对 `Calculator` 类做任何操作。它是一个实现了 `ICalculator`\
  \ 接口的简单类，并提供了 `Add()`、`Subtract()`、`Multiply()` 和 `Divide()` 方法的实现。\n\n```csharp\n\
  public class Calculator : ICalculator\n{\n    public int Add(int a, int b)\n   \
  \ {\n        return a + b;\n    }\n\n    public int Subtract(int a, int b)\n   \
  \ {\n        return a - b;\n    }\n\n    public int Multiply(int a, int b)\n   \
  \ {\n        return a * b;\n    }\n\n    public int Divide(int a, int b)\n    {\n\
  \        return a / b;\n    }\n}\n```\n\n### 在控制台应用程序中托管 WCF 服务\n\n有了接口和类之后，你现在已经构建好了\
  \ WCF 服务并准备就绪。下一步是托管该服务。请注意，这是一个简单的服务——它只暴露简单类型，而不是复杂类型。这使得你只需要构建服务合约，而无需处理数据合约的构建。你将在本章稍后学习数据合约的构建。\n\
  \n下一步是将开发的服务托管在某种类型的应用程序进程中。有很多托管选项，包括：\n\n*   控制台应用程序\n*   Windows Forms 应用程序\n\
  *   Windows Presentation Foundation (WPF) 应用程序\n*   托管 Windows 服务\n*   Internet\
  \ 信息服务 (IIS)\n*   IIS Express\n\n如前所述，此示例在 Visual Studio 2012  IIS Express 中托管服务。你可以通过两种方式激活托管——通过直接编写托管代码，或者通过声明式编程（通常通过配置文件完成）。\n\
  \n```csharp\nclass Program\n{\n    static void Main(string[] args)\n    {\n    \
  \    using (ConsoleHost host = new ConsoleHost())\n        {\n            host.AddService(new\
  \ Calculator());\n            host.Open();\n\n            ICalculator client = ChannelFactory.CreateChannel<ICalculator>();\n\
  \            int result = client.Add(10, 20);\n            Console.WriteLine(\"\
  Result: \" + result);\n        }\n    }\n}\n```\n\n编译并运行此应用程序将产生如图 13-19 所示的结果。\n\
  \n![image](img/f487-01.jpg)\n\n**图 13-19**\n\n#### 审查 WSDL 文档\n\n\n\n\n图 13-19 中显示的页面是关于该服务的信息页。在图中，请注意指向服务\
  \ WSDL 文件的链接。与 ASP.NET Web 服务一样，WCF 服务也可以自动生成 WSDL 文件。WCF 4.5 的功能之一是单个 WSDL 文件的选项。点击单个\
  \ WSDL 链接将在浏览器中显示 WSDL，如图 13-20 所示。\n\n![image](img/f487-02.jpg)\n\n**图 13-20**\n\
  \n通过此 WSDL 文件，你可以通过 HTTP 绑定消费它所定义的服务。注意文档底部的以下元素，如代码列表 13-25 所示。（此段代码列表取自在浏览器中生成的\
  \ WSDL 文件。）\n\nXML 文档中的此元素表明，要消费该服务，终端用户必须使用基于 HTTP 的 SOAP。这通过在文档中使用`<soap:address>`元素来体现。使用此简单的\
  \ WSDL 文档，你现在可以构建一个使用此接口的消费者。\n\n### 构建 WCF 消费者\n\n现在你已经使用 WCF 框架构建了一个 HTTP 服务，下一步是在\
  \ ASP.NET 中构建一个使用简单 `Calculator` 服务的应用程序。消费者通过 HTTP 使用 SOAP 发送请求。本节描述了如何消费此服务。打开\
  \ Visual Studio 2012 并创建一个 ASP.NET 应用程序。虽然此示例使用了 ASP.NET 应用程序，你也可以通过 .NET 中的任何其他应用程序类型调用此消费者。\n\
  \n将新的 ASP.NET 应用程序命名为 `WCFConsumer`。此应用程序消费 `Calculator` 服务，因此它应该包含两个文本框和一个启动服务调按钮。对于此示例，你将仅使用服务的\
  \ `Add()` 方法。\n\n### 添加服务引用\n\n在布局好 ASP.NET 页面后，对新的 WCF 服务建立引用。执行此操作的方法与处理 XML Web\
  \ 服务引用的方法非常相似。在 Visual Studio 解决方案管理器中右键单击解决方案名称，并在出现的对话框中选择“添加服务引用”（Add Service\
  \ Reference）。这种添加服务引用的功能已包含在 Visual Studio 的最后三个版本中——在此之前你只有“添加引用”和“添加 Web 引用”选项。\n\
  \n选择“添加服务引用”后，会出现如图 13-21 所示的“添加服务引用”对话框。\n\n![image](img/f488-01.jpg)\n\n**图 13-21**\n\
  \n“添加服务引用”对话框要求提供两个内容：服务 URI 或地址（基本上指向 WSDL 文件的指针）以及你想给引用的名称。你为引用提供的名称将将用于实例化对象，该对象允许你与服务进行交互。\n\
  \n参考图 13-21，你可以看到提供给“服务地址”设置的名称就是本章前面运行的服务所使用的名称。点击“添加服务引用”对话框中的确定。这将向你的项目添加一个包含服务引用文件夹，其中包含一些代理文件，如图\
  \ 13-22 所示。\n\n![image](img/f489-01.jpg)\n\n**图 13-22**\n\n确实，服务引用文件夹已被添加，该文件夹内包含一系列文件。另一个需要注意的重要添加项是“引用”（References）文件夹中为你生成的\
  \ `System.ServiceModel` 。在你通过“添加服务引用”对话框引用服务之前，该引用并不存在。\n\n### 配置文件更改\n\n查看 `web.config`\
  \ 文件，你可以看到 Visual Studio 已将有关服务的信息放在文档中，如代码列表 13-26 所示。\n\n此配置文档的重要部分是`<client>`元素。该元素包含一个名为`<endpoint>`的子元素，它定义了消费消费的位置和方式。\n\
  \n`<endpoint>`元素提供了服务的地址——[`http://localhost:2109/Calculator.svc`](http://localhost:2109/Calculator.svc)——并指定了应该使用可用\
  \ WCF 绑定中的哪一个。在这种情况下，使用的是 `basicHttpBinding` 绑定。尽管你正在使用 WCF 框架的已建立绑定，但在客户端侧，你可以自定义该绑定的行为。定义绑定行为的设置是通过使用`<endpoint>`元素的\
  \ `bindingConfiguration` 属性指定的。在这种情况下，提供给 `bindingConfiguration` 属性的值是 `BasicHttpBinding_ICalculator`，它是`<basicHttpBinding>`元素内包含的`<binding>`元素的引用。\n\
  \n如所示，Visual Studio 2012 使消费这些服务变得非常简单。事实上，如果你以前工作过 WCF，你会发现配置比之前的版本简单得多。\n\n下一步是将服务接口的消费代码编写到你创建的\
  \ GUI 中。这是本章前面你完成的步骤之一。\n\n### 编写消费代码\n\n消费此接口的代码非常精简。终端用户在两个文本框中各输入一个数字，然后点击按钮调用服务对提供的数字进行操作。此代码与处理\
  \ Web 引用时的代码非常相似。首先是代理类的实例化，如使用创建 `svc` 对象所示：\n\n```csharp\nCalcServiceReference.CalculatorClient\
  \ ws = new\n      CalcServiceReference.CalculatorClient();\n```\n\n现在使用 `ws` 对象，IntelliSense\
  \ 提供了相应的 `Add()`、`Subtract()`、`Multiply()` 和 `Divide()` 方法。如之前，请求和响应通过 HTTP 以 SOAP\
  \ 发送。\n\n### 数据约\n\n到目前为止，在构建 WCF 服务时，定义的数据约依赖于简单类型或原始数据类型。在之前的 WCF 服务案例中，暴露了 .NET\
  \ 类型 `Integer`，它映射到 XML 架构（XS）类型 `int`。虽然你可能无法在提供的 WSDL 文档中看到输入和输出类型，但它们确实在那里。使用单个\
  \ WSDL 文件时，类型在单个 WSDL 文件内部暴露。\n\n如果你没有使用单个 WSDL 文件，XML 架构类型通过导入的 `.xsd` 文档定义（`Calculator.xsd`\
  \ 和 `Calculator1.xsd`）。代码列表 13-28 展示了此 WSDL 文档。\n\n输入[`localhost:2110/Calculator.svc?xsd=xsd0`](http://localhost:2110/Calculator.svc?xsd=xsd0)\
  \ 的 XSD 位置可以获取服务的输入输出参数。例如，查看 `Add()` 方法的定义，你会看到如代码列表 13-29 所示的这段代码。\n\n这段 XML 代码表明两个必需的输入参数（`a`\
  \ 和 `b`）类型为 `int`；作为返回，消费者将获得名为`<AddResult>` 的元素，其包含一个类型为 `int` 的值。\n\n作为此 WCF 服务构建者，你不需要构建数据约，因为该服务使用了简单类型。在使用复杂类型时，你必须额外创建一个数据约。\n\
  \n#### 构建带有数据约的服务\n\n\n\n\n\n作为使用数据约的示例，请创建一个名为 `MyCustomDataContractService` 的新\
  \ WCF 服务。在这种情况下，你仍然需要一个定义服务合约的接口，以及另一个实现该接口的类。除了这些项目之外，你还需要另一个定义数据约的类。\n\n与服务合约类似（服务合约使用了\
  \ `[ServiceContract]` 和 `[OperationContract]` 属性），数据约使用了 `[DataContract]` 和 `[DataMember]`\
  \ 属性。要访问这些属性，你必须在项目中对 `System.Runtime.Serialization` 命名空间建立引用，并将此命名空间导入到文件中。\n\n\
  本例中的自定义类型是 `Customer` 类型，如列表 13-30 所示（在本文节代码下载的 WCF 项目中，分别为 `IMyCustomDataContractService.vb`\
  \ 和 `IMyCustomDataContractService.cs`）。\n\n在这里，你可以看到也导入了 `System.Runtime.Serialization`\
  \ 命名空间，文件中的第一个类是服务的数据约。该类（即 `Customer` 类）有两个成员：`FirstName` 和 `LastName`。这两个属性的类型均为\
  \ `String`。你通过使用 `[DataContract]` 属性将类指定为数据约：\n\n```\n [DataContract]\n  public\
  \ class Customer\n  {\n    // 为了清晰起见已删除代码\n  }\n```\n\n现在，类中包含的任何属性通过使用 `[DataMember]`\
  \ 属性也都是数据约的一部分：\n\n```\n [DataContract]\n  public class Customer\n  {\n      [DataMember]\n\
  \      public string Firstname;\n\n      [DataMember]\n      public string Lastname;\n\
  \  }\n```\n\n最后，`Customer` 对象被用于接口以及实现 `IMyCustomDataContractService` 接口的类中，如列表\
  \ 13-31 所示。\n\n## 构建客户端\n\n现在服务已经运行并准备就绪，下一步是构建客户端。开始之前，你将更新一直用于调用 Web 服务的 Web 应用程序。再次，右键点击解决方案，从菜单提供的选项中选择“添加服务引用”（Add\
  \ Service Reference）。\n\n在“添加服务引用”对话框中，添加服务的 WSDL 文件位置并点击确定。这会像以前一样将更改添加到引用和 `web.config`\
  \ 文件中，使你能够调用该服务。列表 13-32 中显示的代码显示如果你使用 Button 控件来启动调用，调用该服务需要什么。\n\n作为客户端，在建立引用后，你会发现服务引用同时提供了\
  \ `MyCustomDataContractServiceClient` 对象和 `Customer` 对象，后者是通过服务的数约定义的。\n\n因此，之前的代码块仅实例化了这两个对象，并在将\
  \ `Customer` 对象 传递到服务提供的 `HelloFullName()` 方法之前，对其执行了构建。\n\n## 查看 MyCustomDataContractService\
  \ 的 WSDL 和架构\n\n当你对 `MyCustomDataContract` 服务建立引用时，你将在 WSDL 中发现以下 XSD 导入：\n\n```\n\
  \ <wsdl:types>\n      <xsd:schema targetNamespace=\"http://tempuri.org/Imports\"\
  >\n          <xsd:import namespace=\"http://tempuri.org/\" \n            schemaLocation=\"\
  http://localhost:2109/MyCustomDataContractService.svc?xsd=xsd0\"/>\n          <xsd:import\
  \ namespace=\"http://schemas.microsoft.com/2003/10/Serialization/\" \n         \
  \   schemaLocation=\"http://localhost:2109/MyCustomDataContractService.svc?xsd=xsd1\"\
  />\n          <xsd:import namespace=\"http://schemas.datacontract.org/2004/07/\"\
  \ \n            schemaLocation=\"http://localhost:2109/MyCustomDataContractService.svc?xsd=xsd2\"\
  />\n      </xsd:schema>\n  </wsdl:types>\n```\n\n[`http://localhost:2109/MyCustomDataContractService.svc?xsd=xsd2`](http://localhost:2109/MyCustomDataContractService.svc?xsd=xsd2)\
  \ 提供了你的 `Customer` 对象的细节。以下是该文件的代码：\n\n```\n <?xml version=\"1.0\" encoding=\"UTF-8\"\
  ?>\n  <xs:schema xmlns:tns=\"http://schemas.datacontract.org/2004/07/\" \n     \
  \ xmlns:xs=\"http://www.w3.org/2001/XMLSchema\" \n      targetNamespace=\"http://schemas.datacontract.org/2004/07/\"\
  \ \n      elementFormDefault=\"qualified\">\n      <xs:complexType name=\"Customer\"\
  >\n          <xs:sequence>\n              <xs:element name=\"Firstname\" type=\"\
  xs:string\" nillable=\"true\" \n                  minOccurs=\"0\"/>\n          \
  \    <xs:element name=\"Lastname\" type=\"xs:string\" nillable=\"true\" \n     \
  \             minOccurs=\"0\"/>\n          </xs:sequence>\n      </xs:complexType>\n\
  \      <xs:element name=\"Customer\" type=\"tns:Customer\" nillable=\"true\"/>\n\
  \  </xs:schema>\n```\n\n此代码是 `Customer` 对象的 XSD 描述。对 WSDL 建立引用包含了 `Customer` 对象的描述，并允许你创建对象的实例。\n\
  \n## 定义命名空间\n\n注意，本章构建的服务没有定义命名空间。如果你查看 WSDL，会发现命名空间是 [`http://tempuri.org`](http://tempuri.org)。显然，你不想使用默认命名空间。相反，你必须定义自己的。\n\
  \n为了完成此任务，接口的 `[ServiceContract]` 属性允许你设置命名空间，如下所示：\n\n```\n [ServiceContract(Namespace=\"\
  http://jasongay.com/ns/\")]\n  public interface IMyCustomDataContractService\n \
  \ {\n      [OperationContract]\n      string HelloFirstName(Customer cust);\n\n\
  \      [OperationContract]\n      string HelloFullName(Customer cust);\n  }\n```\n\
  \n## 使用 WCF Data Services\n\n*实体数据模型* (EDM) 是你在代码中表示数据的抽象概念模型。近年来，EDM 及其带来的复用性受到了关注。\n\
  \n另一种可用模型是 WCF Data Services 框架。该功能为客户端应用程序提供了从简单的读取功能到完整的 CRUD 模型（创建、读取、更新、删除）。该功能以前被称为\
  \ ADO.NET Data Services。\n\nWCF Data Services 用于为后端数据源创建服务层。手动完成这一点，特别是当你处理完整的 CRUD\
  \ 模型时，意味着大量工作。WCF Data Services 允许你获得一个 URI 驱动的服务层。图 13-23 显示了使用 WCF Data Services\
  \ 时的通用架构。\n\n![image](img/f496-01.jpg)\n\n**图 13-23**\n\n从图中可以看出，WCF Data Services\
  \ 层并不是与数据库交互的层。相反，你正在与 EDM 层工作，它是数据存储与云端接口之间的映射层。在处理 EDM 时，你可以使用 LINQ。\n\nWCF Data\
  \ Services 允许你快速将与应用程序底层数据源的交互暴露为 RESTful 服务。WCF Data Services 现在允许你使用 JSON 或基于\
  \ Atom 的 XML 与数据存储交互。\n\n### 创建你的第一个服务\n\n过去，构建一个完整的服务层来与数据库进行所有的创建、读取、更新和删除（CRUD）操作需要大量的时间和思考。然而，WCF\
  \ Data Services 使这项任务变得更加可行，正如你在学习这个第一个示例时所看到的。\n\n\n\n\n\n要构建服务层，首先使用 Visual Basic\
  \ 或 C# 创建一个标准的 ASP.NET Web 应用程序。这会创建一个标准的 Web 应用程序。由于 WCF Data Services 运行在数据库之上，您需要添加一个数据库。对于此示例，请像之前使用的那样添加\
  \ AdventureWorks 数据库。将此数据库放置在项目的 `App_Data` 文件夹中。\n\n### 添加您的实体数据模型\n\n数据库就绪后，接下来您创建一个\
  \ WCF Data Services 将要使用的实体数据模型（Entity Data Model）。要执行此操作，右键点击您的项目，并在提供的菜单选项列表中选择![image](img/Ar.jpg)\
  \ 新项（New Item）。\n\n出现“添加新建项”对话框。如图 13-24 所示，向您的项目添加一个 ADO.NET 实体数据模型。\n\n![image](img/f496-02.jpg)\n\
  \n**图 13-24**\n\n如图所示，将您的 ADO.NET 实体数据模型文件命名为 `AdventureWorks.edmx`。当您点击添加创建 `AdventureWorks.edmx`\
  \ 文件时，会弹出实体数据模型向导，它为您提供创建空 EDM 或从预存数据库创建 EDM 的选项。对于此示例，选择从预存（AdventureWorks）数据库创建的选项。然后点击向导中的“下一步”。\n\
  \n向导的下一个屏幕将查找您的 AdventureWorks 数据库，并预定义连接设置以及它们在应用程序中的存储方式。图 13-25 展示了向导的第二个屏幕。\n\
  \n![image](img/f497-01.jpg)\n\n**图 13-25**\n\n在图 13-25 的截图中，注意连接字符串和映射详细的位置将存储在\
  \ `web.config` 文件中。您还可以在此屏幕上看到，您正在向导底部的文本框中将模型实例命名为 `AdventureWorksEntities`。这个名称需要注意，因为您将在稍后的示例中使用它。\n\
  \n下一个屏幕允许您选择将作为模型部分的表、视图或存储过程。对于此示例，选择树视图中“表”（Table）项目旁边的复选框，以选择数据库中的所有表，如图 13-26\
  \ 所示。\n\n![image](img/f497-02.jpg)\n\n**图 13-26**\n\n选中表复选框后，点击完成按钮，让 Visual Studio\
  \ 为您创建 EDM。您会注意到 Visual Studio 在 O/R 设计器中为您创建模型的视觉表示。\n\n如果您查看解决方案中的 `AdventureWorks.designer.vb`\
  \ 或 `AdventureWorks.designer.cs` 文件，将看到为 EDM 生成的所有代码。该类文件名为 `AdventureWorksEntities`。\n\
  \n### 创建服务\n\n现在 EDM 和数据库已就绪，下一步是添加您的 WCF Data Service。要完成此操作，在 Visual Studio 解决方案管理器中右键点击您的项目，并在提供的菜单中选择![image](img/Ar.jpg)\
  \ 新项。“添加新建项”对话框再次出现；从提供的对话框中间部分选择 WCF Data Service（参见图 13-27）。\n\n![image](img/f498-01.jpg)\n\
  \n**图 13-27**\n\n如图所示，将您的 WCF Data Service 命名为 `AdventureWorksDataService.svc`。完成后，点击添加按钮，Visual\
  \ Studio 随后将生成一个 WCF 服务。代码列表 13-33 显示了默认服务文件的代码。\n\n此处生成的代码是您将通过 WCF Data Services\
  \ 暴露的内容的基础框架。然而，在您完成代码中指定的重大 TODO 事项之前，它将无法工作。第一步是使用代码列表 13-34 中所示的代码填入 EDM 实例的名称。\n\
  \n早先 XML 的结果应该是模型中存在的所有集合（sets）列表，但默认情况下，WCF Data Services 会锁定所有内容。要解锁模型中的这些集合，请返回\
  \ `InitializeService()` 函数并添加以下加粗代码，如代码列表 13-35 所示。\n\n在这种情况下，每个表都向访问开放。每个访问表的人都有读取它们的权限，但没有写入或删除权限。所有表都通过星号（`*`）指定，对底层数据的权限通过将\
  \ `EntitySetRights` 枚举设置为 `AllRead` 来设置为只读。\n\n现在，当您在浏览器中编译并运行此服务时，您将看到以下 XML 代码：\n\
  \n```\n <?xml version=\"1.0\" encoding=\"UTF-8\"?>\n  <service xmlns:atom=\"http://www.w3.org/2005/Atom\"\
  \n  <service xmlns=\"http://www.w3.org/2005/Atom\"\n  xmlns:atom=\"http://www.w3.org/2005/Atom\"\
  \n  xmlns:xml=\"http://www.w3.org/XML/1998/namespace\"\n  xmlns=\"http://www.w3.org/1999/xhtml\"\
  \n  xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\n  base=\"http://localhost:5526/AdventureWorksDataService.svc/\"\
  >\n  <workspace>\n    <atom:title>Default</atom:title>\n    <collection href=\"\
  http://localhost:5526/AdventureWorksDataService.svc/BuildVersions\">\n      <atom:title>BuildVersions</atom:title>\n\
  \    </collection>\n    <collection href=\"http://localhost:5526/AdventureWorksDataService.svc/ErrorLogs\"\
  >\n      <atom:title>ErrorLogs</atom:title>\n    </collection>\n    <collection\
  \ href=\"http://localhost:5526/AdventureWorksDataService.svc/Addresses\">\n    \
  \  <atom:title>Addresses</atom:title>\n    </collection>\n    <collection href=\"\
  http://localhost:5526/AdventureWorksDataService.svc/Customers\">\n      <atom:title>Customers</atom:title>\n\
  \    </collection>\n    <collection href=\"http://localhost:5526/AdventureWorksDataService.svc/CustomerAddresses\"\
  >\n      <atom:title>CustomerAddresses</atom:title>\n    </collection>\n    <collection\
  \ href=\"http://localhost:5526/AdventureWorksDataService.svc/Products\">\n     \
  \ <atom:title>Products</atom:title>\n    </collection>\n    <collection href=\"\
  http://localhost:5526/AdventureWorksDataService.svc/ProductCategories\">\n     \
  \ <atom:title>ProductCategories</atom:title>\n    </collection>\n    <collection\
  \ href=\"http://localhost:5526/AdventureWorksDataService.svc/ProductDescriptions\"\
  >\n      <atom:title>ProductDescriptions</atom:title>\n    </collection>\n    <collection\
  \ href=\"http://localhost:5526/AdventureWorksDataService.svc/ProductModels\">\n\
  \      <atom:title>ProductModels</atom:title>\n    </collection>\n    <collection\
  \ href=\"http://localhost:5526/AdventureWorksDataService.svc/ProductModelDescriptions\"\
  >\n      <atom:title>ProductModelDescriptions</atom:title>\n    </collection>\n\
  \    <collection href=\"http://localhost:5526/AdventureWorksDataService.svc/SalesOrderDetails\"\
  >\n      <atom:title>SalesOrderDetails</atom:title>\n    </collection>\n    <collection\
  \ href=\"http://localhost:5526/AdventureWorksDataService.svc/SalesOrderHeaders\"\
  >\n      <atom:title>SalesOrderHeaders</atom:title>\n    </collection>\n  </workspace>\n\
  </service>\n```\n\n此 XML 的输出是 AtomPub 格式，WCF Data Services 提供的两种格式之一。另一种格式是 JSON，它最常与\
  \ JavaScript 使用。AtomPub 示例由于以下头部的存在而被检索的：\n\n```\n GET http://localhost:5526/AdventureWorksDataService.svc/\
  \ HTTP/1.1\n    Accept: text/html, application/xhtml+xml, */*\n    Accept-Language:\
  \ en-US\n    User-Agent: Mozilla/5.0 (compatible; MSIE 10.0; Windows NT 6.2; WOW64;\
  \ Trident/6.0)\n    Accept-Encoding: gzip, deflate\n    Host: localhost:5526\n \
  \   DNT: 1\n    Connection: Keep-Alive\n    Pragma: no-cache\n```\n\n将 Accept 头部更改为\
  \ `application/json`（例如使用 jQuery 调用服务），将转而提供以下响应：\n\n```\n { \"d\" : {\n    \"EntitySets\"\
  : [\n    \"BuildVersions\", \"ErrorLogs\", \"Addresses\", \"Customers\",\n    \"\
  CustomerAddresses\", \"Products\", \"ProductCategories\", \n    \"ProductDescriptions\"\
  , \"ProductModels\", \n    \"ProductModelDescriptions\", \"SalesOrderDetails\",\n\
  \    \"SalesOrderHeaders\"\n    ]\n    } }\n```\n\n### 查询接口\n\n您使用三个组件来查询接口：URI、HTTP\
  \ 头部操作以及您在查询使用的 HTTP 动词。查询接口常用的方法之一是对数据存储执行读取操作。\n\n\n\n\n\n回顾本章前面的一个示例标头，你可以看到类似\
  \ 列表 13-36 所示的代码。\n\n在这种情况下，返回的结果基于 `Accept` HTTP 请求头中返回的内容。你调用的方法取决于所使用的 URI。在\
  \ 列表 13-36 的示例中，URI 为 `/AdventureWorksDataService.svc/Customers`，这意味着调用了 EDM 中的\
  \ `Customers` 实体集，并将返回来自 `AdventureWorks` 数据库的 `Products` 表的结果。\n\n列表 13-36 也是一个读取语句，因为使用的\
  \ HTTP 动词是 `GET` 语句。表 13-1 详细列出了 HTTP 动词的列表以及它们如何映射到数据访问类型。\n\n| HTTP 动词 | 数据访问类型\
  \ |\n| --- | --- |\n| POST | 创建 (Create) |\n| GET | 读取 (Read) |\n| PUT | 更新 (Update)\
  \ |\n| DELETE | 删除 (Delete) |\n\n表 13-1\n\n下一节将介绍通过 WCF Data Services 提供的底层接口从数据库读取内容的不同方法。\n\
  \n### 读取数据表\n\n读取整个表的内容是基于传递的 URI。你通过指定感兴趣的特定实体集来读取内容。例如，在浏览器地址栏中输入以下查询：\n\n```\n\
  http://localhost:5526/AdventureWorksDataService.svc/Customers\n```\n\n在这种情况下，你仅通过在\
  \ URI 中提供实体集 `Customers` 来请求 `Customers` 表的所有内容。图 13-28 显示了此请求的结果。\n\n![image](img/f503-01.jpg)\n\
  \n图 13-28\n\n以下语法是此类请求的另一个示例：\n\n```\nhttp://localhost: 5526/AdventureWorksDataService.svc/Products\n\
  ```\n\n在这种情况下，你将收到来自数据库中 `Products` 表的完整列表。如果你查看从 URI 调用获取的表级信息，将发现以下内容（示例）：\n\n\
  ```\n<id>http://localhost:4113/AdventureWorksDataService.svc/Products</id>\n  <title\
  \ type=\"text\">Products</title>\n  <updated>2012-11-28T04:43:40Z</updated>\n  <link\
  \ rel=\"self\" title=\"Products\" href=\"Products\" />\n```\n\n在这里，你看到你接收了一个标题（实体名称）以及作为\
  \ `<id>` 元素的完整 URI。你还从 `<updated>` 元素中获得了查询运行的时间戳。最后，如果你要通过程序构建 URIs，你将获得一个指向项本身的链接（还存在指向该实体之外其他关系的链接）。\n\
  \n### 从表中读取特定项目\n\n上一个示例向你展示了如何使用如下 URI 从表或实体集中拉取整个集合：\n\n```\nhttp://localhost:\
  \ 5526/AdventureWorksDataService.svc/Products\n```\n\n如果你查看结果集合包含的其中一个产品项，你将看到类似\
  \ 列表 13-37 所示的内容。\n\n如果你查看此产品的 `<id>` 值，将发现以下内容：\n\n```\nhttp://localhost:5526/AdventureWorksDataService.svc/Products(710)\n\
  ```\n\n你可以看到对该特定产品的引用是 `Products(710)`，这意味着你对 `Product` 集合中 `ProductID` 为 710 的项感兴趣。在浏览器地址栏中输入该\
  \ URI 将只给你提供那个特定产品。\n\n如果你检查 XML，会发现 `<content>` 元素包含了你正在查看的特定产品的所有数据。它被构建为一个属性集合。\n\
  \n尽管你看到了此客户的属性列表，但你仍然能够通过 URI 声明获取单个属性本身，例如：\n\n```\nhttp://localhost:5526/AdventureWorksDataService.svc/Products(710)/Name\n\
  ```\n\n使用像上述的构造仅返回此产品的 `Name` 属性。以下是结果：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  UTF-8\"?>\n  <d:Name \n      xmlns:m=\"http://schemas.microsoft.com/ado/2007/08/dataservices/metadata\"\
  \ \n      xmlns:d=\"http://schemas.microsoft.com/ado/2007/08/dataservices\">\n \
  \     Mountain Bike Socks, L\n  </d:Name>\n```\n\n重要的是要意识到来自 `Products(710)` 的数字引用不是索引引用，而是\
  \ ID 引用。\n\n### 处理关系\n\n使用 WCF Data Services 显然让访问数据库并通过 RESTful 接口与其进行交互变得简单。使用\
  \ ADO.NET Entity Framework 和 WCF Data Services 的一个巨大优势是，这些项目使得处理对象关系变得同样简单。\n\n\
  回到本章早些时候设计的实体模型，你会发现处理对象关系变得非常容易。图 13-29 展示了这种视图。\n\n![image](img/f506-01.jpg)\n\
  \n图 13-29\n\n从该图中你可以看到 `Customers` 对象与 `SalesOrder` 对象之间存在关系（此外还有其他）。通过 WCF Data\
  \ Services 深入处理这种链是可能的。\n\n为了理解这些关系是如何表示的，导航到：\n\n```\nhttp://localhost:5526/AdventureWorksDataService.svc/Customers(1)\n\
  ```\n\n你会注意到这些关系在 列表 13-38 中所示。\n\n此列表显示了该客户的两个关系。除了这个陈述外，你还通过 `<link>` 元素的 `href`\
  \ 属性发现一个指向该关系本身的链接。所述的引用是 `Customers(1)/SalesOrderHeaders`。这意味着你现在可以输入以下内容：\n\n\
  ```\nhttp://localhost:5526/AdventureWorksDataService.svc/Customers(1)/SalesOrderHeaders\n\
  ```\n\n该 URI 意味着你对 ID 为 `1` 的客户及其订单感兴趣。在响应中，你将获得 图 13-30 所示的内容。\n\n![image](img/f507-01.jpg)\n\
  \n图 13-30\n\n### 扩展关联\n\n到为止，你已经通过这些 `<link>` 元素看到了实体关联，以及通过新 URI 重新查询以深入这些细节的能力。如果你愿意，也可以在同一个查询中提取这些关联。\n\
  \n获取这些关联可以通过使用 WCF Data Services 提供的查询字符串参数来实现。例如，假设你正在进行以下查询：\n\n```\nhttp://localhost:5526/AdventureWorksDataService.svc/Products(710)\n\
  ```\n\n此查询给你早些在 列表 13-37 中所示的输出。你会注意到所示的链接之一指向 `ProductCategory` 实体集。在这种模式下，如果你想要此产品的类别，必须进行额外的调用来获取此项，使用\
  \ [`localhost:5526/AdventureWorksDataService.svc/Products(710)/ProductCategory`](http://localhost:5526/AdventureWorksDataService.svc/Products(710)/ProductCategory)。使用这种方法将给你完全独立的结果。\n\
  \n然而，如果你想在一个调用中获取该产品的相关数据点，可以在 URI 查询中使用 `expand` 关键字：\n\n```\nhttp://localhost:5526/AdventureWorksDataService.svc/Products(710)\n\
  \    ?$expand=ProductCategory\n```\n\n\n\n\n\n为了使此查询生效，你可以在查询字符串中使用可用的关键字之一，在此情况下为\
  \ `expand`。你只需要使用熟悉的格式 `?$expand=` 后面跟上关联实体集的名称即可。此查询给的结果集与列表 13-39 中所示相似。\n\n从这段代码中，你可以看到特定于类别的\
  \ `<link>` 元素现在已扩展，包含了曾经作为独立调用的内容。除了扩展单个关联实体集外，你还可以扩展多个项目：\n\n```\nhttp://localhost:5526/AdventureWorksDataService.svc/Products(710)\n\
  \    ?$expand=ProductCategory,ProductModel\n```\n\n在这种情况下，`ProductCategory` 和 `ProductModel`\
  \ 部分都在对 `Product` 实体集的调用中被扩展了。\n\n你还可以继续挖掘嵌套的关联实体集。例如，如果 `ProductCategory` 实体与另一个名为\
  \ `SimilarCategories` 的实体有关系，你将能够如下方式结构化你的 URI：\n\n```\nhttp://localhost:5526/AdventureWorksDataService.svc/Products(710)\n\
  \    ?$expand=ProductCategory/SimilarCategories\n```\n\n使用这种结构，你正在查看产品列表中 ID 为 `710`\
  \ 的产品，并扩展了该产品类别的部分。然后，在类别内部，与该类别相关的相似类别也包含在结果集中。如你所见，这种轻松钻取嵌套关系的能力是非常强大的。\n\n####\
  \ 结果集中的排序\n\n另一种处理来自 URI 查询结果集的方法是，让集合中的结果按照你定义的特定顺序排列。你可以使用 `orderby` 关键字作为查询字符串命令来实现此点：\n\
  \n```\nhttp://localhost:5526/AdventureWorksDataService.svc/Products\n    ?$orderby=Name\n\
  ```\n\n在这种情况下，你将获得一个根据实体 `Name` 字段值按字母顺序排列的完整产品列表。你还可以为提供的排序分配升序或降序值。默认分配升序。这意味着前面的查询与以下内容等同：\n\
  \n```\nhttp://localhost:5526/AdventureWorksDataService.svc/Products\n    ?$orderby=Name\
  \ asc\n```\n\n注意 URI 中的 `Name` 和 `asc` 项之间存在一个实际的空格。如果你想以反向顺序或降序排列这些项，请使用以下结构：\n\
  \n```\nhttp://localhost:5526/AdventureWorksDataService.svc/Products\n    ?$orderby=Name\
  \ desc\n```\n\n你还可以使用 WCF Data Services 执行嵌套排序：\n\n```\nhttp://localhost:5526/AdventureWorksDataService.svc/Products\n\
  \    ?$orderby=Color asc, Name asc\n```\n\n#### 移动结果集\n\n作为此接口的终端用户，你可能发现取决于数据库中的内容，你可能正在处理相当大的结果集。如果你只需要数据库表的一部分，并且你正在请求所有的客户（可能有\
  \ 100,000 个或更多），该怎么办？\n\n在这种情况下，WCF Data Services 提供了以页面形式抓取较小子集并导航到所需页的功能。你通过两个查询字符串命令的组合：`top`\
  \ 和 `skip` 来实现这一点。\n\n它们本身也非常强大。例如，通过 `top` 命令，你可以根据当前正在使用的排序提取出前 *n* 个项目。例如，考虑此条命令：\n\
  \n```\nhttp://localhost:5526/AdventureWorksDataService.svc/Products?$top=5\n```\n\
  \n在这里，从数据库中提取并返回了前五个实体（在此例中是基于 `ID` 值）。如果你想根据不同的值获取前几个实体，可以使用如下内容：\n\n```\nhttp://localhost:5526/AdventureWorksDataService.svc/Products\n\
  \    ?$orderby=Name desc&$top=5\n```\n\n使用此示例，结果集中返回了按产品名称排序的前五个产品。\n\n你可以使用 `skip`\
  \ 命令基本上跳过第一组定义的项目。例如，你可以执行类似以下的操作：\n\n```\nhttp://localhost:5526/AdventureWorksDataService.svc/Products?$skip=5\n\
  ```\n\n在这种情况下，返回的产品减去了通常情况下会返回的前五个。关于此命令的价值还有待疑问，但当它与 `top` 关键字结合使用时，其威力显而易见。\n\n\
  ```\nhttp://localhost:5526/AdventureWorksDataService.svc/Products?$skip=10&$top=10\n\
  ```\n\n在这种情况下，你跳过了前十个实体，然后从该点开始抓取后续十个实体。这意味着你实际上是在获取每组包含十个项目的集合的第二页。这使得通过使用这种过程利用\
  \ URI 命令来获取所需的数据页，从而执行某种数据库分页过程变得非常简单。\n\n#### 过滤内容\n\n最后一个命令是你可以使用的强大命令之一。它是一种筛选类型，允许你过滤掉你真正感兴趣从数据库接收的内容。这都是通过使用\
  \ `filter` 命令完成的：\n\n```\nhttp://localhost:5526/AdventureWorksDataService.svc/Products\n\
  \    ?$filter=Color eq 'Red'\n```\n\n使用以美元符号 `$` 前头的 filter 命令，你可以过滤掉你真正感兴趣从数据库接收的内容。\n\
