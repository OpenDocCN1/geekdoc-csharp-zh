  \ `OpenMachineConfiguration` 方法获取配置对象的实例。然后你将 `SectionGroups` 集合绑定到 GridView 控件。\n\
  \n##保护配置设置\n\nASP.NET 使用数据保护 API（或 DPAPI）将配置信息存储在注册表中。例如，列表 28-36 展示了你如何在注册表中存储进程模型部分的用户名和密码信息。\n\
  \nASP.NET 4.5 包含了一套保护存储在配置系统中的敏感数据的系统。它使用行业标准的 XML 加密对包含任何敏感数据的指定配置部分进行加密。\n\n开发者通常对在\
  \ `web.config` 文件中存储连接字符串、密码等敏感项目感到担忧。出于这个原因，ASP.NET 使得以某种格式存储这些项目成为可能，如果人类不深入了解加密过程中所使用的加密技术和密钥，任何人类或机器进程都无法读取这些内容。\n\
  \n`web.config` 文件中加密最深的项目之一是 `<connectionStrings>` 部分。列表 28-37 展示了一个带有暴露连接字符串的 `web.config`\
  \ 文件示例。\n\n在这种情况下，你可能想要加密到数据库的此连接字符串。为了实现这一点，ASP.NET 安装提供了一个名为 `aspnet_regiis.exe`\
  \ 的工具。你可以在 `C:\\WINDOWS\\Microsoft.NET\\Framework\\v4.0.30319` 找到该工具。要使用此工具加密 `<connectionStrings>`\
  \ 部分，打开命令提示符并使用 `cd C:\\WINDOWS\\Microsoft.NET\\Framework\\v4.0.30319` 指定文件夹。另一个选项是以管理员身份打开\
  \ Visual Studio 命令提示符。在该环境中，你使用列表 28-38 所示的语法来加密 `<connectionStrings>` 部分。运行此脚本的结果如图\
  \ 28-5 所示。\n\n![image](img/f1060-01.jpg)\n\n（注：此处原文逻辑似乎在提供的[content]起始处被截断或存在重复错误，我根据指令翻译了您给出的完整文本块）\n\
  \n*注：由于您提供的待翻译文本 [content] 标签内容似乎不完整或包含未翻译的占位符，我已根据提供的文本内容进行了完整翻译。如果内容有缺失，请重新提供完整原文。*\n\
  \n\n\n\nVisual Studio 2012 IDE 通过 XML 工具栏提供了两个新的实用功能，可以帮助您格式化配置设置：\n\n- **重新格式化选择（Reformat\
  \ selection）：** 此选项会对当前的 XML 内容进行重新格式化。\n- **格式化整个文档（Format the whole document）：**\
  \ 此选项会对整个 XML 文档进行格式化。\n\n网站管理工具和 IIS 管理器允许您在不了解 XML 元素名称及其对应值的情况下编辑配置项。附录 D 详细介绍了这些工具。\n\
  \n## 创建自定义节\n\n除了已经讨论过的使用 `web.config` 文件外，您还可以扩展它并向文件中添加您自己的自定义节，并像使用其他节一样使用它们。\n\
  \n创建自定义节的一种方法是使用某些内置处理程序，这些处理程序允许您从 `.config` 文件中读取键值对。以下三个处理程序均来自 `System.Configuration`\
  \ 命名空间：\n\n- `NameValueFileSectionHandler`：该处理程序适用于 `web.config` 文件中的当前 `<appSettings>`\
  \ 节。您可以使用此处理程序创建配置文件的新节，其行为与 `<appSettings>` 节相同。\n- `DictionarySectionHandler`：该处理程序处理键值对的字典集合。\n\
  - `SingleTagSectionHandler`：该处理程序处理配置文件中的单个元素，允许您读取包含在属性和值中的键值对。\n\n接下来，本章将介绍这些处理程序中的每一个，以及一些自定义配置文件的编程方法。\n\
  \n### 使用 NameValueFileSectionHandler 对象\n\n如果您想要创建一个行为与 `web.config` 文件中的 `<appSettings>`\
  \ 节相似的自定义节，那么使用此处理程序是最佳选择。在 `web.config` 文件的 `<system.web>` 节上方，引用 `NameValueFileSectionHandler`\
  \ 对象，并包含您在 ASP.NET 4.5 应用程序中找到的其他默认引用。Listing 28-43 显示了此额外引用。\n\n在您完成对 `System.Configuration.NameValueFileSectionHandler`\
  \ 对象的引用并为其命名（在此情况下为 `MyCompanyAppSettings`）后，您可以在 `web.config` 文件中创建一个该引用的节，如 Listing\
  \ 28-44 所示。\n\n在 `web.config` 文件中配置好这些代码后，您就可以通过编程方式访问该节，如 Listing 28-45 所示。\n\n\
  为了使此功能生效，您必须向文件中导入 `System.Collections.Specialized` 命名空间，因为您可以在那里找到 `NameValueCollection`\
  \ 对象。\n\n### 使用 DictionarySectionHandler 对象\n\n`DictionarySectionHandler` 的工作与 `NameValueFileSectionHandler`\
  \ 几乎相同。不同之处在于，`DictionarySectionHandler` 返回一个 `HashTable` 对象而不是返回 `Object`。Listing\
  \ 28-46 展示了此处理程序。\n\n设置此配置后，您可以在 `web.config` 文件中创建相同的 `MyCompanyAppSettings` 节，如\
  \ Listing 28-47 所示。\n\n现在 `web.config` 文件已准备就绪，您可以使用 `Configuration` API 从代码调用这些项，如\
  \ Listing 28-48 所示。\n\n### 使用 SingleTagSectionHandler 对象\n\n`SingleTagSectionHandler`\
  \ 的工作与之前的 `NameValueFileSectionHandler` 和 `DictionarySectionHandler` 几乎相同。然而，此对象似乎用于与包含属性形式键值对的单个元素配合。\n\
  \nListing 28-49 展示了此处理程序。\n\n设置此配置后，您可以在 `web.config` 文件中创建一个不同的 `MyCompanyAppSettings`\
  \ 节，如 Listing 28-50 所示。\n\n现在 `web.config` 文件已完成，您可以使用 `Configuration` API 从代码调用这些项，如\
  \ Listing 28-51 所示。\n\n### 使用您自己的自定义配置处理程序\n\n您还可以创建自己的自定义配置处理程序。要做到这一点，您必须先创建一个表示\
  \ `web.config` 文件中节的类。在您的 `App_Code` 文件夹中，创建一个名为 `MyCompanySettings` 的类。Listing\
  \ 28-52 显示了此类。\n\n可以看到此类继承自 `ConfigurationSection`，并使用 `ConfigurationProperty` 属性创建了两个属性。您可以使用这里的一些属性，例如\
  \ `DefaultValue`、`IsRequired`、`IsKey` 和 `IsDefaultCollection`。\n\n在配置好此类后，您可以配置您的应用程序使用此处理程序，如\
  \ Listing 28-53 所示。\n\n使用此配置，您可以从代码编程地访问此键值对，如 Listing 28-55 所示。\n\n## 使用配置转换（CONFIGURATION\
  \ TRANSFORMS）\n\n到此时，您应该已经看到 XML 系统有多强大了。ASP.NET 4 和 Visual Studio 2012 引入了配置转换功能。然而，您可能在考虑手动过程需要更改多少设置。尽管过去有多种解决方案，但\
  \ ASP.NET 4 继续使用配置转换。\n\n### 添加 web.config 转换\n\n配置转换用于 ASP.NET 应用程序。在创建新的 ASP.NET\
  \ 应用程序后，您会发现 `web.config` 文件可以展开并包含 `web.Debug.config` 和 `web.Release.config`。这两个文件都是配置模式的转换文件。在\
  \ Figure 28-8 中，可以看到两个配置模式。\n\n现在，假设您有另一个对应于 Visual Studio 2012 新功能的配置。此配置过程包括部署到测试服务器。您可以在配置管理器中选择\
  \ `New` 选项来添加新的 `Staging` 配置模式，如 Figure 28-8 所示。\n\n\n\n在添加配置转换（config transform）后，你可以在解决方案管理器中看到对应的文件，如图\
  \ 28-12 所示。\n\n![image](img/f1070-02.jpg)\n\n图 28-12\n\n### 更新配置转换文件\n\n打开其中一个配置转换文件（例如\
  \ `web.Staging.config` 文件）后，你会发现该文件基本上是空的。该文件包含了示例转换以及一个用于移除 `debug` 属性的活动转换，如列表\
  \ 28-56 所示。\n\n编译配置元素（compilation configuration element）包含一个转换。该转换之所以可能，是因为向配置根元素添加了\
  \ XML 文档转换命名空间（XML Document Transform namespace）。你会发现 `transform` 属性的值为 `RemoveAttributes(debug)`。`RemoveAttributes`\
  \ 是将要使用的转换方法。在这种情况下，该方法将从配置元素删除属性。传递给方法的值是 `debug`。这意味着命名名为 `debug` 的属性将从配置中删除。\n\
  \nXML 文档转换命名空间有两个属性。第一个是 `transform`，在编译配置元素的转换中进行了演示。`transform` 属性可能的方法有：\n\n\
  *   `Insert`：将定义的元素作为子元素插入到选中元素\n*   `InsertAfter`：在指定的路径（XPath Expression）之后插入元素\n\
  *   `InsertBefore`：在指定的路径（XPath Expression）之前插入元素\n*   `Remove`：删除选中元素\n*   `RemoveAll`：删除所有选中元素\n\
  *   `RemoveAttributes`：删除当前元素的指定属性\n*   `Replace`：用转换文件中指定的元素替换整个元素\n*   `SetAttributes`：设置当前元素指定属性的指定\n\
  \n第二个属性 `location` 用于选择特定元素。`location` 属性可能的方法有：\n\n*   `Condition`：在当前元素上求值的 XPath\
  \ 表达式，用于确定何时发生转换\n*   `Match`：指定一个或多个具有匹配值的元素\n*   `XPath`：导航到另一个元素的 XPath 表达式，然后评估条件以确定是否发生转换\n\
  \n同时使用 `location` 和 `transform` 属性可能是必要的。例如，你之前在本章中创建了一个名为 `MyCompanyAppSettings`\
  \ 的自定义配置部分，类型为 `NameValueFileSectionHandler`。当你转换配置文件时，可能只需要替换集合中一个项目的值。例如，在 `MyCompanyAppSettings`\
  \ 配置部分添加以下内容：\n\n```\n <add key=\"Key2\" value=\"The is value 2 in staging\" \n\
  \     xdt:Transform=\"SetAttributes(value)\" xdt:Locator=\"Match(key)\" />\n```\n\
  \n使用阶段配置模式发布到你的阶段服务器后，你会发现你的 `web.config` 文件看起来类似于列表 28-57。\n\n这种做法经常用于在发布部署期间替换特定连接的\
  \ `connectionString` 值。\n\n## 打包与压缩（BUNDLING AND MINIFICATION）\n\nASP.NET 4.5 包含了一项新功能，可以对\
  \ Web 应用程序中的 CSS 和 JavaScript 进行压缩和打包。如果你使用 Visual Studio 2012 中的任何默认项目模板，此新功能已默认开启。\n\
  \n### 什么是打包和压缩？\n\n大多数静态内容文件（如 CSS 和 JavaScript）包含大量的空格和注释。虽然空格和注释并不一定会占用大量空间，但取决于客户端的互联网速度，额外的空间可能会显著减慢网站的页面加载速度。图\
  \ 28-13 显示了压缩前的网络流量。\n\n![image](img/f1072-01.jpg)\n\n图 28-13\n\n以下是一个压缩前的 JavaScript\
  \ 代码示例：\n\n```\n function helloWorld(firstName) {\n      // Declare variables\n\
  \      var message = \"Hello, \" + firstName;\n\n      // Display an alert message\n\
  \      alert(message);\n  }\n```\n\n过去，压缩静态内容的最佳技术之一是在 Web 服务器（如 IIS）上启用 HTTP 压缩。常用的方法是对静态文件进行\
  \ gzip 处理。此过程的问题在于很难自定义要压缩哪些文件。在较大的组织中，你可能需要管理员参与来为你更新 Web 服务器。在 ASP.NET 中，你现在有了完全控制压缩过程的能力，而不需要管理员。\n\
  \n为了将压缩过程更进一步，你还可以一组文件（例如所有 CSS 文件）打包成单个压缩后的路径。\n\n### 启用打包与压缩\n\n打包和压缩脚本及样式有很多方法。处理打包的一种方法是向项目添加\
  \ `bundle.config` 文件并在文件中添加适当的文件列表。然而，你也可以在应用程序启动方法期间手动将文件添加到包中。\n\n要在你的项目中启用此功能，请从程序包管理器下载\
  \ Microsoft ASP.NET Web Optimization Framework 包。下载并启用后，直接进入 `Global.asax` 文件。然后在\
  \ `Global.asax` 文件中包含命名空间 `System.Web.Optimization`。最后，为了打包 web 文件夹中的 CSS 文件，可以添加以下内容：\n\
  \n```\n var cssBundle = new Bundle(\"~/styles/css\");\n   cssBundle.IncludeDirectory(\"\
  ~/styles\", \"*.css\");\n   BundleTable.Bundles.Add(cssBundle);\n```\n\n\n\n\n*\
  \   跟踪您的 ASP.NET \n*   探索 ASP.NET 调试选项\n*   高效地处理异常和错误\n*   使用页面检查器（Page Inspector）进行调试\n\
  \n## 本章 WROX.COM 代码下载\n\n请注意，本章中的所有代码示例作为本章代码下载的一部分，可以在书籍网站 [`www.wrox.com`](http://www.wrox.com)\
