  \ 文件）显示了 `HttpModule` 的代码。\n\n你可以看到，来自 列表 30-1 的类存根已通过处理 `EndRequest` 事件得到了扩展。此事件在由\
  \ `HttpHandler` 创建的内容发送到客户端之前触发，并为你提供了最后一次对其进行修改的机会。\n\n要修改请求的内容，在 `EndRequest`\
  \ 处理方法中，你只需将修改内容写入 `HttpResponse` 对象的输出流，这将将内容附加到现有内容的末尾。此示例获取了当前日期和时间，并将其写入输出流。然后，HTTP\
  \ 请求将返回给客户端。\n\n要使用此模块，你必须让 ASP.NET 知道你想将该模块包含在请求处理管道中。你通过修改 `web.config` 文件包含对该模块的引用来实现。列表\
  \ 30-3 显示了如何向你的 `web.config` 文件中添加 `<modules>` 部分。\n\n`<modules>` 部分的通用格式为：\n\n\
  ```\n <modules>\n      <add name=\"[modulename]\" type=\"[namespace.classname, assemblyname]\"\
  \ />\n  </modules>\n```\n\n如果你正将应用程序部署到 IIS 6 服务器上，还必须在 `<system.web>` 配置部分中添加模块配置。\n\
