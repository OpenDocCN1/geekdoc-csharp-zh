  \ 组件\n\n## 本章的 Wrox.com 代码下载\n\n请注意，本章中的所有代码示例都可以作为本章代码下载的一部分，在书籍网站的 [`www.wrox.com`](http://www.wrox.com)\
  \ 的“下载代码”（Download Code）选项卡找到。\n\n开源 JavaScript 库 `jQuery` 是今天现代 JavaScript 开发的事实标准。根据\
