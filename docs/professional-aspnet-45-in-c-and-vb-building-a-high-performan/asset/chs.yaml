  >NYSE</a></td>\n         </tr>\n   </table>\n</div>\n\n这种回传能力非常强大，但如果你想禁用它（即使对于可以它的浏览器），你只需要在\
  \ `TreeView` 控件中将 `PopulateNodesFromClient` 属性设置为 `False`（默认值为 `True`）。\n\n`TreeView`\
  \ 控件是非常可定制的；但首先，查看如何使用代码列表 17-1 中的 `.sitemap` 文件创建控件的默认版本。对于此示例，继续使用你之前创建的 `MarketsUS.aspx`\
  \ 页面。\n\n第一步是在页面上创建一个 `SiteMapDataSource` 控件。在使用显示 `.sitemap` 文件内容的 `TreeView` 控件时，必须应用这些数据控件。`TreeView`\
  \ 控件不会像 `SiteMapPath` 控件那样自动绑定到你的站点地图文件。\n\n在放置好基础 `SiteMapDataSource` 控件后，在页面上放置\
  \ `TreeView` 控件并将 `DataSourceId` 属性设置为 `SiteMapDataSource1`。完成后，你的代码应该像代码列表 17-6。\n\
  \n运行页面并展开 `TreeView` 控件后，结果将如图 17-9 所示。\n\n![image](img/f632-01.jpg)\n\n**图 17-9**\n\
  \n此 `TreeView` 控件非常基础。这个控件的棒之处在于，它允许高度的定制，甚至让你能够使用 ASP.NET 4.5 预装的某些预定义样式。\n\n###\
  \ 识别 TreeView 控件的内置样式\n\n\n\n\n如前所述，`TreeView` 控件开箱自带许多预构建的样式。利用这些预定义样式的最佳方法是在页面的设计视图（Design\
  \ view）中进行。在 Visual Studio 2012 的设计视图中，点击服务器控件右上角的箭头，即可找到 `Auto Format`（自动格式化）选项。点击此选项后，你将有多种样式可供选择。选择其中一种样式将更改你的\
  \ `TreeView` 控件代码，以适应所选样式。例如，如果你在选项列表中选择了 `MSDN`，你创建的简单单行 `TreeView` 控件将转换为列表 17-7\
  \ 所示的形式。\n\n如你所见，如果你使用这些内置样式，完全更改 `TreeView` 控件的外观和感受并不困难。当你运行这段代码时，你将得到图 17-10\
  \ 所示的结果。\n\n![image](img/f633-01.jpg)\n\n**图 17-10**\n\n### 检查 TreeView 控件的组成部分\n\
  \n要掌握 `TreeView` 控件，你必须理解控件创建的层级树每个部分部分使用的术语。\n\n`TreeView` 控件中的每个元素或条目被称为 `node`（节点）。节点层次结构中最顶部的节点是\
  \ `root node`（根节点）。`TreeView` 控件可以有多个根节点。如果任何节点（包括根节点）在节点层次结构中直接下方有任何节点，则它也被视为 `parent\
  \ node`（父节点）。直接位于此父节点下方的节点被称为 `child nodes`（子节点）。每个父节点可以有一个或多个子节点。不包含任何子节点的节点被称为\
  \ `leaf node`（叶子节点）。\n\n以下内容基于之前显示的站点地图，并详细说明了这些术语的使用：\n\n```\n Home - 根节点，父节点\n\
  \     News - 父节点，子节点\n        U.S. - 子节点，叶子节点\n        World - 子节点，叶子节点\n      \
  \  Technology - 子节点，叶子节点\n        Sports - 子节点，叶子节点\n     Finance - 父节点，子节点\n  \
  \      Quotes - 子节点，叶子节点\n        Markets - 父节点，子节点\n           U.S. Market Report\
  \ - 子节点，叶子节点\n           NYSE - 子节点，叶子节点\n        Funds - 子节点，叶子节点\n     Weather\
  \ - 子节点，叶子节点\n```\n\n从此列表中你可以你可以每个节点是什么以及在节点层次结构中是如何称呼的。例如，`U.S. Market Report`\
  \ 节点是一个叶子节点——意味着它没有关联任何子节点。然而，它也是 `Markets` 节点的子节点，而 `Markets` 正是 `U.S. Market Report`\
  \ 节点的父节点。如果你直接操作 `Markets` 节点，它也是 `Finance` 节点的子节点，而 `Finance` 是它的父节点。这一切的中心要点是，站点地图层次结构中的每个节点都与层次结构中的其他节点存在关系。你必须理解这些关系，因为你可以通过程序处理这些节点（如在本章稍后所演示的那样），并且用于处理这些节点的方法包含了\
  \ `RootNode, CurrentNode` 和 `ParentNode` 等术语。\n\n### 将 TreeView 控件绑定到 XML 文件\n\n\
  你不限于仅使用 `.sitemap` 文件来填充 `TreeView` 控件的节点。你有许多方法可以实现这一点。一种很酷的方法是使用 `XmlDataSource`\
  \ 控件（代替 `SiteMapDataSource` 控件）从你的 XML 文件填充 `TreeView` 控件。\n\n作为该示例，在名为 `Hardware.xml`\
  \ 的 XML 文件创建一个项的层级列表。列表 17-8 显示了该文件的示例（位于本章代码下载包中的 `Hardware.xml`）。\n\n如你所见，此列表并非用于站点导航，而是为了允许最终用户从层级选项列表中进行选择。此\
  \ XML 文件被分为四类可用选项：`Motherboards`（主板）、`Memory`（内存）、`HardDrives`（硬盘）和 `Drives`（驱动器）。要将你的\
  \ `TreeView` 控件绑定到此 XML 文件，请使用 `XmlDataSource` 控件并指定你将要使用的 XML 文件的位置。然后，在 `TreeView`\
  \ 控件内部，使用 `<asp:TreeNodeBinding>` 元素指定绑定 XML 文件中的哪些元素来填充 `TreeView` 控件的节点，如列表 17-9\
  \ 所示。\n\n首先查看的是 `<asp:XmlDataSource>` 控件。它与之前的 `<asp:SiteMapDataSource>` 控件一样简单，但它通过\
  \ `DataFile` 属性指向 `Hardware.xml` 文件。\n\n下一步是创建一个绑定到此特定 XML 文件的 `TreeView` 控件。你可以如下将默认的\
  \ `TreeView` 控件直接绑定到 `XmlDataSource` 控件：\n\n```\n <asp:TreeView ID=\"TreeView1\"\
  \ runat=\"server\" DataSourceId=\"XmlDataSource1\" />\n```\n\n当你这样做时，你将得到图 17-11\
  \ 所示的错误结果。\n\n![image](img/f635-01.jpg)\n\n**图 17-11**\n\n*(注：由于原文后半部分存在大量文本重复，此处已完成核心技术逻辑的翻译与整合)*\n\
  \n\n\n在处理 `ShowCheckBoxes` 属性时，你可以在控件本身中进行声明设置，如下：\n\n```\n <asp:TreeView ID=\"\
  Treeview1\" runat=\"server\" Font-Underline=\"false\"\n   DataSourceID=\"XmlDataSource1\"\
  \ ShowCheckBoxes=\"Leaf\">\n     . . .\n  </asp:TreeView>\n```\n\n或者你也可以使用以下代码通过编程进行设置：\n\
  \n`VB`\n\n```\n TreeView1.ShowCheckBoxes = TreeNodeTypes.Leaf\n```\n\n`C#`\n\n```\n\
  \ TreeView1.ShowCheckBoxes = TreeNodeTypes.Leaf;\n```\n\n关于在 `TreeView` 控件中使用复选框的示例，让我们继续扩展\
  \ 代码列表 17-9 中的计算机硬件示例。创建一个分级列表，允许人们从列表中选择多个项目，以便接收有关它们的更多信息。代码列表 17-10 显示了此类列表的示例。\n\
  \n在此示例中，你首先将 `ShowCheckBoxes` 属性设置为 `Leaf`，这意味着你只希望在 `TreeView` 控件中不包含任何子节点的项目旁边显示复选框。带有复选框的项目应该是分级列表中可以展开的最后一个项目。\n\
  \n在设置此属性后，你将在 `Button1_Click` 事件中处理末端用户选择的项。你首先应该检查的是是否进行了任何选择：\n\n```\n if (TreeView1.CheckedNodes.Count\
  \ > 0) {\n     . . .\n  }\n```\n\n在这种情况下，回传（postback）时的勾选节点数需要大于零，意味着至少选择了一个。如果是这样，你就可以执行\
  \ `If` 语句中的代码。该 `If` 语句将继续填充页面上的 `Label` 控件。要使用来自所选节点的数据填充 `Label` 控件，你使用如下所示的 `ForEach`\
  \ 语句：\n\n```\n foreach (TreeNode node-in-in TreeView1.CheckedNodes) {\n     . .\
  \ .\n  }\n```\n\n这适用于 `TreeNode` 对象的实例，并检查 `TreeView1` 选中节点集合中的每个 `TreeNode` 对象。\n\
  \n对于每个被选中的节点，你获取该节点的 `Text` 值以及该节点父节点的 `Text` 值，以进一步填充 `Label` 控件，如下：\n\n```\n Label1.Text\
  \ += node.Text + \" \" + node.Parent.Text + \"<br>\";\n```\n\n最后，你将得到一个产生图 17-13\
  \ 所示结果的页面。\n\n![image](img/f639-01.jpg)\n\n**图 17-13**\n\n### 在 TreeView 控件中指定自定义图标\n\
  \n`TreeView` 控件允许高度的自定义。你在本章前面的部分已经看到，可以通过指定内置样式之一来自定义 `TreeView` 控件的外观。应用这些样式之一会极大地改变控件的外观。最显著的变化之一涉及用于\
  \ `TreeView` 控件内节点的图标。虽然这不像直接选择 `TreeView` 控件中内置的样式那么简单，但你可以应用自己的图标，用于节点分级列表中的各个节点。\n\
  \n`TreeView` 控件包含了表 17-4 中讨论的属性。这些属性允许你指定自己的图像用于控件的节点。\n\n| **属性** | **描述** |\n\n\
  | --- | --- |\n| `CollapseImageUrl` | 在已展开以显示其任何子节点且具有折叠能力的节点旁边应用自定义图像。 |\n| `ExpandImageUrl`\
  \ | 在具有展开显示其子节点能力的节点旁边应用自定义图像。 |\n| `LeafNodeStyle-ImageUrl` | 在没有子节点且处于节点分级链末端的节点旁边应用自定义图像。\
  \ |\n| `NoExpandImageUrl` | 对由于程序原因无法展开的节点或叶子节点应用自定义图像。此属性主要用于间距，使叶子节点与其父节点对齐。 |\n\
  | `ParentNodeStyle-ImageUrl` | 仅对 `TreeView` 控件内的父节点应用自定义图像。 |\n| `RootNodeStyle-ImageUrl`\
  \ | 仅对 `TreeView` 控件内的根节点应用自定义图像。 |\n\n**表 17-4**\n\n代码列表 17-11 显示了这些属性的使用示例。\n\n\
  指定这三个图像置于控件中的节点之前，将覆盖使用加号（+）和和减号（−）作为可展开和可折叠节点的默认值。它还覆盖了在默认不使用任何内容对任何叶子节点简单使用图像。使用代码列表\
  \ 17-11 中的代码，你将获得与图 17-14 所示类似的结果（当然，这取决于你使用的图像）。\n\n![image](img/f640-01.jpg)\n\
  \n**图 17-14**\n\n### 指定连接线\n\n由于 `TreeView` 控件向末端用户显示分级列表，你有时希望更显式地显示父子节点之间的关系。只需将\
  \ `TreeView` 控件的 `ShowLines` 属性设置为 `True`（默认情况下该属性为 `False`）：\n\n```\n <asp:TreeView\
  \ ID=\"Treeview1\" runat=\"server\" Font-Underline=\"false\"\n   DataSourceID=\"\
  XmlDataSource1\" ShowCheckBoxes=\"Leaf\" ShowLines=\"True\">\n     . . .\n  </asp:TreeView>\n\
  ```\n\n此代码将产生图 17-15 所示的结果。\n\n![image](img/f641-01.jpg)\n\n**图 17-15**\n\n如果 `ShowLines`\
  \ 属性设置为 `True`，你还可以在 `TreeView` 控件中定义自己的线条。这样做非常简单，因为 Visual Studio 为你提供了 ASP.NET\
  \ TreeView 生成器工具。该工具允许你视觉化地设计线条及其出现的方式。\n\n要使用该工具，请转到文件的设计视图并点击页面上的 `TreeView` 控件的智能标记。在这里你会找到`自定义线条`选项。除非选中了`显示线条`复选框，否则你看不到此选项。点击它，ASP.NET\
  \ TreeView 生成器对话框就会出现（如图 17-16 所示）。\n\n![image](img/f641-02.jpg)\n\n在此对话框中，你可以选择用于需要`展开`、`折叠`或`不折叠`图标的图像。你还可以指定连接节点的线条颜色和样式。当你创建样式时，对话框中会直接显示示例\
  \ TreeView 控件输出，基于你的样式方式。最后一步是选择此对话框将创建的文件输出。完成此步骤后，点击确定。这将在对话框中指定的文件夹中生成大量新文件。默认情况下，ASP.NET\
  \ TreeView 生成器希望你将输出文件夹命名为 `TreeViewLineImages`，但你可以根据需要命名。如果项目中不存在该文件夹，将提示允许 Visual\
  \ Studio 为你创建该文件夹。文件夹就绪后，如果你如下设置 `LineImagesFolder` 属性，`TreeView` 控件就可以使用你的新图像和样式：\n\
  \n```\n <asp:TreeView ID=\"TreeView1\" runat=\"server\" ShowLines=\"True\"\n DataSourceID=\"\
  SiteMapDataSource1\" LineImagesFolder=\"TreeViewLineImages\">\n```\n\n\n\n重要属性已**粗体**显示。你必须将\
  \ `ShowLines` 属性设置为 `True`。设置后，该属性将使用之前显示的默认设置，除非你通过 `LineImagesFolder` 属性指定了一个可以从那里检索自定义图像和样式的位置。如你所见，这只是指向了新文件夹\
  \ `TreeViewLineImages`，其中包含了你创建的所有新图像和样式。查看该文件夹——看看工具生成的内容非常有趣。\n\n### 通过编程方式操作\
  \ TreeView 控件\n\n到目前为止，通过 TreeView 控件，你已经学习了如何以声明的方式操作该控件。ASP.NET 的伟大之处在于，你并不被要求仅以声明的方式操作它的组件，还可以通过编程的方式来操作这些控件。\n\
  \nTreeView 控件关联着一个 `TreeView` 类，它允许你从代码内部完全管理 TreeView 控件及其功能。下一节将介绍如何使用一些更常用的方法通过编程方式控制\
  \ `TreeView`。\n\n### 通过编程方式展开和折叠节点\n\n你对 TreeView 控件可以做的之一就是通过编程方式展开或折叠层级结构中的节点。你可以使用\
  \ `TreeView` 类中的 `ExpandAll` 或 `CollapseAll` 方法来实现此点。列表 17-12 显示了之前你在 列表 17-6 中使用的一个早期\
  \ TreeView 控件，但它上方有两个按钮，你现在可以使用这些按钮来启动节点的展开和折叠。\n\n运行此页面会在你的 TreeView 控件上方提供两个按钮。点击第一个按钮会调用\
  \ `ExpandAll()` 方法并完全展开整个节点列表。点击第二个按钮会调用 `CollapseAll()` 方法并完全折叠节点列表（参见 图 17-17）。\n\
  \n![image](img/f643-01.jpg)\n\n**图 17-17**\n\n列表 17-12 中显示的示例很好，但它只在终端用户操作时（当用户点击按钮时）展开和折叠节点。如果能够通过编程方式启动此操作将更棒。\n\
  \n你可能想简单将 `TreeView1.CollapseAll()` 命令放置在 `Page_Load` 事件中，但如果你尝试这种技术，你会发现它无效。相反，你应该使用\
  \ TreeView 控件中的 `OnDataBound` 属性：\n\n```\n <asp:TreeView ID=\"TreeView1\" runat=\"\
  server\"\n   DataSourceId=\"SiteMapDataSource1\" OnDataBound=\"TreeView1_DataBound\"\
  >\n  </asp:TreeView>\n```\n\n此属性的值指向你代码中的一个方法，如下：\n\nVB\n\n```\n Protected Sub TreeView1_DataBound(ByVal\
  \ sender As Object, _\n     ByVal e As System.EventArgs)\n      TreeView1.CollapseAll()\n\
  \   End Sub\n```\n\nC#\n\n```vb\n protected void TreeView1_DataBound(object sender,\
  \ System.EventArgs e)\n   {\n      TreeView1.CollapseAll();\n   }\n```\n\n现在当你运行页面时，注意到\
  \ TreeView 控件在浏览器中首次加载时是完全折叠的。\n\n你还可以展开或折叠树中的特定节点，而不仅仅是操作整个列表。对于此示例，使用你刚刚创建的 `TreeView1_DataBound()`\
  \ 方法。使用来自 列表 17-1 的站点地图，修改 `TreeView1_DataBound()` 方法，使其显示如 列表 17-13 所示。\n\n在这种情况下，你使用\
  \ `FindNode()` 方法并展开找到的节点。`FindNode()` 方法接收一个 `String` 值，即你想要引用的节点及其路径。例如，`TreeView1.FindNode(\"\
  Home/Finance\").Expand()` 会展开 `Finance` 节点。要找到该节点，指定从根节点到要操作的节点（在本例中为 `Finance`\
  \ 节点）的完整路径是非常重要的。在站点地图路径结构中，你通过使用正斜杠分隔节点。\n\n请注意，你必须逐个展开每个节点直到到达 `Finance` 节点。如果你只是在\
  \ `TreeView1_DataBound()` 方法中使用 `TreeView1.FindNode(\"Home/Finance/Markets\").Expand()`，虽然\
  \ `Markets` 节点确实会被展开，但其上方的父节点（`Finance` 和 `Home` 节点）不会被展开，当你调用页面时将看不到展开的 `Markets`\
  \ 节点。（试试，很有趣。）\n\n与其使用 `Expand` 方法，你也可以同样容易地将 `Expanded` 属性设置为 `True`，如列表 17-14](#Chapter17.xhtml_listing17-14)\
  \ 所示。\n\n尽管你在这里关注的是 `Expand` 方法和 `Expanded` 属性，但你也可以同样容易地使用 `Collapse()` 方法通过编程折叠节点。实际上不存在\
  \ `Collapsed` 属性。相反，你只需将 `Expanded` 属性设置为 `False` 即可。\n\n### 添加节点\n\n你对 TreeView\
  \ 控件可以做的另一件趣事是通过编程方式向整个层级结构添加节点。TreeView 控件由 `TreeNode` 集合组成。因此，如你在之前的示例所示，`Finance`\
  \ 节点是一个你可以操作的 `TreeNode` 对象。`TreeNode` 对象通常存储一个 `Text` 和 `Value` 属性。`Text` 属性是显示在\
  \ TreeView 控件中的。`Value` 属性是可以与此 `TreeNode` 关联的额外数据。你可以使用的另一个属性（如果你的 TreeView 控件是导航列表）是\
  \ `NavigateUrl` 属性。列表 17-15 展示了如何向 列表 17-1 中的站点地图添加节点。此页面包含两个文本框和一个按钮控件。第一个文本框用于填充新节点的\
  \ `Text` 属性。第二个文本框用于填充新节点的 `NavigateUrl` 属性。\n\n如果你运行页面，可以通过点击 `Expand Nodes` 按钮展开整个层级结构。然后你可以向\
  \ `Markets` 节点添加子节点。要通过编程添加新节点，像之前一样使用 `FindNode` 方法找到 `Markets` 节点。当你找到它时，可以使用\
  \ `ChildNodes.Add()` 方法添加子节点并传入 `TreeNode` 实例。在第一个文本框中提交 `NASDAQ` 并在第二个文本框中提交 `Nasdaq.aspx`\
  \ 将改变你的 TreeView 控件，如图 17-18](#Chapter17.xhtml_figure17-18) 所示。\n\n![image](img/f643-01.jpg)\n\
  \n**图 17-18**\n\n添加后，即使层级树折叠并重新打开，该节点仍然存在。你还可以向 `Markets` 节点添加任意数量的子节点。请注意，尽管你正在更改节点，但这完全不会更改数据源的内容（XML\
  \ 文件或 `.sitemap` 文件）。这些源在整个过程中保持不变。\n\n### 菜单控件\n\nASP.NET 4.5 中发现的酷酷的导航控件之一是 Menu\
  \ 服务器控件。该控件非常适合终端用户导航更大的层级选项，同时在此过程中占用极少的浏览器空间。图 17-19 显示了菜单控件在完全折叠或完全展开层级结构中的某一个分支时的样子。\n\
  \n![image](img/f643-02.jpg)\n\n**图 17-19**\n\n\n\n\n\n从这里，你可以看到第一个显示的 `Menu` 控件仅显示了\
  \ `Home` 链接，并在显示右侧有一个小箭头。该箭头表示与层级结构中此顶级链接相关的更多选项。第二个显示的 `Menu` 控件显示了当终端用户在站点地图提供的分支中向下操作时，默认控件的外。\n\
  \n当你有许多选项时，`Menu` 控件是一个理想的控件——无论这些选项是终端用户可以进行，还是他们正在运行的应用程序提供的导航点。`Menu` 控件可以提供多种选项，且占空间极小。\n\
  \n在 ASP.NET 应用程序中使用 `Menu` 控件非常简单。`Menu` 控件配合 `SiteMapDataSource` 控件工作。你可以将 `SiteMapDataSource`\
  \ 控件和 `Menu` 控件拖放到 Visual Studio 2012 设计面上，并使用 `Menu` 控件的 `DataSourceId` 属性将两者连接起来。或者，你也可以在代码中直接创建并连接它们。Listing\
  \ 17-16 显示了最简单形式的 `Menu` 控件示例。\n\n此示例使用了 `SiteMapDataSource` 控件，它会自动与应用程序的 `Web.sitemap`\
  \ 文件配合。包含的另一个项目是 `Menu` 控件，它使用典型的 `ID` 和 `runat` 属性以及 `DataSourceID` 属性将其与从 `SiteMapDataSource`\
  \ 控件检索的内容连接起来。虽然默认的 `Menu` 控件相当简单，但你可以通过重新定义其属性来高度自定义它的外观和工作方式。后续章节将介绍如何修改此控件外观并更改其行为的一些示例。\n\
  \n### 为菜单控件应用不同的样式\n\n默认情况下，`Menu` 控件非常普通。如果你想保持这种外观，可以使用提供的样式，或者简单地更改字体大小和样式以适应你的网站。实际上，你有很多方法可以修改此控件，使其看起来独特并融入你的网站。你可以自己自定义此控件的外观，也可以使用控件自带的预定义样式之一。\n\
  \n#### 使用预定义样式\n\nVisual Studio 2012 包含了一些预定义样式，你可以将其与 `Menu` 控件配合，快速为显示的菜单项应用视觉效果。提供的样式包括\
  \ `Classic、Professional` 等。要应用这些预定义样式之一，你需要在页的设计视图中操作 `Menu` 控件。在设计视图中，高亮 `Menu`\
  \ 控件并展开控件的智能标记（smart tag）。在这里，你可以看到处理此控件的选项列表。要更改控件的外观，点击 `Auto Format`（自动格式）链接并选择一种样式。\n\
  \n执行此操作将通过应用一组样式属性来更改控件的代码。例如，如果你选择 `Classic` 选项，将得到 Listing 17-17 所示的结果。你可以看到许多添加的样式，它们更改了控件中显示的菜单项。Figure\
  \ 17-20 显示了样式选择在浏览器中的外观。\n\n![image](img/f649-01.jpg)\n\n**FIGURE 17-20**\n\n####\
  \ 更改静态项的样式\n\n`Menu` 控件将层级结构中的项视为 `static`（静态）或 `dynamic`（动态）。页面生成时出现的 `Home` 链接是静态项的一个示例。动态链接是用户将鼠标悬停在菜单中的\
  \ `Home` 链接上时动态出现的项。更改菜单中这两类节点的样式是可能的。\n\n要对出现的静态链接应用特定样式，你必须向 `Menu` 控件添加一个静态样式元素。`Menu`\
  \ 控件包含以下静态样式元素：\n\n* `<StaticHoverStyle>`\n* `<StaticItemTemplate>`\n* `<StaticMenuItemStyle>`\n\
  * `<StaticMenuStyle>`\n* `<StaticSelectedStyle>`\n\n列表中重要的选项包括 `<StaticHoverStyle>`\
  \ 和 `<StaticMenuItemStyle>` 元素。你使用 `<StaticHoverStyle>` 元素定义当终端用户将鼠标悬停在选项上时菜单中静态项的样式。你使用\
  \ `<StaticMenuItemStyle>` 元素定义终端用户未将鼠标悬停在选项上时静态项的样式。Listing 17-18 显示了如何添加在终端用户悬停在静态项上应用的样式。\n\
  \n这个小示例在终端用户将鼠标悬停在项上时，为菜单中的静态项添加背景颜色和边框。Figure 17-21 显示了结果。\n\n![image](img/f650-01.jpg)\n\
  \n**FIGURE 17-21**\n\n#### 为动态项添加样式\n\n为 `Menu` 控件的动态项添加样式与为静态项添加一样简单。`Menu` 控件有许多修改动态项外观的元素，包括：\n\
  \n* `<DynamicHoverStyle>`\n* `<DynamicItemTemplate>`\n* `<DynamicMenuItemStyle>`\n\
  * `<DynamicMenuStyle>`\n* `<DynamicSelectedStyle>`\n\n这些元素更改菜单项的方式与静态版本相同，但它们更改那些从静态项中动态弹出的项。\n\
  \n\n\n\n例如，如果你想仅在动态菜单项下方放置分隔线图像，可以使用 `DynamicBottomSeparatorImageUrl` 属性，如列表 17-22\
  \ 所示。\n\n`Menu` 控件中所有定义分隔符图像的属性都接受 `String` 类型的值，指向图像的位置。图 17-26 显示了列表 17-22 的结果。\n\
  \n![image](img/f652-01.jpg)\n\n**图 17-26**\n\n### 使用菜单事件\n\n`Menu` 控件暴露了如下事件：\n\n\
  * `DataBinding`\n* `DataBound`\n* `Disposed`\n* `Init`\n* `Load`\n* `MenuItemClick`\n\
  * `MenuItemDataBound`\n* `PreRender`\n* `Unload`\n\n一个值得关注的事件是 `MenuItemClick`。该事件在列表\
  \ 17-23 中显示，允许你在最终用户点击某个可用菜单项时执行某些操作。\n\n此委托使用 `MenuEventArgs` 数据类，并允许你访问从菜单中选择的项目文本和值。\n\
  \n### 将菜单控件绑定到 XML 文件\n\n与 `TreeView` 控件一样，将 `Menu` 控件绑定到来自 ASP.NET 4.5 提供的其他数据源控件的项目也是可能的。虽然大多数开发者可能会使用\
  \ `Menu` 控件让最终用户导航到 URL 目标，但你也可以使用 `Menu` 控件让用户进行选择。\n\n例如，参考之前的 XML 文件 `Hardware.xml`，它在本章早些时候列表\
  \ 17-8 中用于 `TreeView` 控件。在本示例中，`Menu` 控件与 `XmlDataSource` 控件配合。当最终用户从菜单中做出选择时，你将选中的项填充到页面上的列表框中。列表\
  \ 17-24 显示了该控件的代码。\n\n从这个示例中你可以看到，你不需要像使用 `TreeView` 控件那样使用 `<asp:TreeNodeBinding>`\
  \ 元素，`Menu` 控件使用 `<asp:MenuItemBinding>` 元素连接到 XML 文件 `Hardware.xml` 中列出的项目。此外，`Menu`\
  \ 控件的根元素 `<asp:Menu>` 现在包含了 `OnMenuItemClick` 属性，它指向事件委托 `Menu1_MenuItemClick`。\n\
  \n`Menu1_MenuItemClick` 委托包含数据类 `MenuEventArgs`，它允许你获取所选子元素和父元素的值的值。在本示例中，两者都被使用并填充到\
  \ Listbox 控件中，如图 17-27 所示。\n\n![image](img/f654-01.jpg)\n\n**图 17-27**\n\n## SITEMAP\
  \ 数据提供者\n\nASP.NET 4.5 提供了一系列以 `DataSource` 控件形式存在的数据提供者。你现在可以使用这些 `DataSource`\
  \ 控件之一（你在本章早些时候看过的）是 `SiteMapDataSource` 控件。该 `DataSource` 控件是为了与站点地图（sitemaps）以及可以绑定到它们的控件一起而开发的。\n\
  \n某些控件不需要 `SiteMapDataSource` 控件即可绑定到应用程序的站点地图（通常存储在 `Web.sitemap` 文件中）。在本章，当你使用\
  \ `SiteMapPath` 控件时看到了这种用法。该控件可以直接与 `Web.sitemap` 文件工作——不需要此数据提供者。\n\n然而，某些导航控件（例如\
  \ `TreeView` 控件和 `DropDownList` 控件）需要一个中间 `SiteMapDataSource` 控件来检索站点导航信息。\n\n正如本章所示，`SiteMapDataSource`\
  \ 控件非常易用。`SiteMapDataSource` 最简单的形式如下：\n\n```xml\n <asp:SiteMapDataSource ID=\"\
  SiteMapDataSource1\" runat=\"server\" />\n```\n\n在这种形式下，`SiteMapDataSource` 控件只需以树形层级结构获取信息（如目前为止一致演示的）。请注意，许多属性会更改绑定到数据输出的任何控件中显示的方式。\n\
  \n### ShowStartingNode\n\n`ShowStartingNode` 属性决定检索节点对象集合时是否检索 `.sitemap` 文件的根节点。该属性接受\
  \ `Boolean` 值，并默认设置为 `True`。如果你正在处理列表 17-1 所示的 `Web.sitemap` 文件，你需要按照列表 17-25 所示构造\
  \ `SiteMapDataSource` 控件，以从集合中移除根节点。\n\n此代码生成一个如图 17-28 所示的菜单。\n\n![image](img/f655-01.jpg)\n\
  \n**图 17-28**\n\n从此图中可以看出，根节点已被移除，集合从子节点开始。\n\n### StartFromNode\n\n`StartFromNode`\
  \ 属性导致站点地图仅从当前节点开始检索。默认情况下，该属性设置为 `False`，这意味着站点地图始终检索从根节点的所有节点。\n\n关于此属性的示例，请使用列表\
  \ 17-1 中的 `.sitemap` 文件并创建一个名为 `Markets.aspx` 的页面。列表 17-26 显示了将 `StartFromNode`\
  \ 属性设置为 `True` 的示例。此简单的属性添加产生了图 17-29 所示的结果。\n\n![image](img/f656-01.jpg)\n\n**图\
  \ 17-29**\n\n### StartingNodeOffset\n\n`StartingNodeOffset` 属性接受一个 `Integer` 值，决定集合的起点。默认情况下，该属性设置为\
  \ `0`，这意味着 `SiteMapDataSource` 控件检索的集合从根节点开始。任何其他值提供了相对于根节点的偏移，并反将其作为起点。\n\n如果你将此属性的值设置为\
  \ `1`，则集合的起点将比默认起点（`Default.aspx` 首页）偏移一个。例如，如果使用 `SiteMapDataSource` 控件的页面是 `MarketsUS.aspx`\
  \ 页面，集合将从 Finance 页面（`Finance.aspx`）开始。\n\n```xml\n Home   Offset 0\n     News \
  \ Offset 1\n        U.S.   Offset 2\n        World   Offset 2\n        Technology\
  \   Offset 2\n        Sports   Offset 2\n     Finance   Offset 1\n        Quotes\
  \   Offset 2\n        Markets   Offset 2\n           U.S. Market Report   Offset\
  \ 3\n           NYSE   Offset 3\n        Funds   Offset 2\n     Weather   Offset\
  \ 1\n```\n\n从此层级结构中，你可以看到每个节点相对于根节点偏移了多少。因此，如果你将 `StartingNodeOffset` 属性设置为 `1`\
  \ 并且正在 U.S. Market Report 页面，你可以看到集合从 Finance 页面（`Finance.aspx`）开始，而根节点的其他子节点（News\
  \ 和 Weather）未在集合中表示。\n\n\n\n\n\n`StartingNodeUrl` 属性允许你指定 `.sitemap` 文件中找到的页面，节点集合将从该页面开始。默认情况下，此属性的值为空；但当将其设置为\
  \ `Finance.aspx` 等值时，集合将以 Finance 页面作为节点集合的根节点启动。列表 17-27 显示了使用 `StartingNodeUrl`\
  \ 属性的示例。\n\n当遇到 `StartingNodeUrl` 属性值时，会将该值与 `Web.sitemap` 文件中的 `url` 属性进行比较。如果找到匹配项，匹配的页面将作为\
  \ `SiteMapDataSource` 控件检索到的节点集合中的根节点。\n\n# SITEMAP API\n\n`SiteMap` 类是网站导航结构的内存中的表示。该类非常适合通过程序化处理网站的层级结构。`SiteMap`\
  \ 类包含了一些对象，使得处理导航结构变得非常简单。表格 17-5 描述了这些对象（或公共属性）。\n\n| 属性 | 描述 |\n| --- | --- |\n\
  | `CurrentNode` | 获取当前页面的 `SiteMapNode` 对象。 |\n| `RootNode` | 获取从根节点开始的网站其余导航结构的\
  \ `SiteMapNode` 对象。 |\n| `Provider` | 获取当前 sitemap 的默认 `SiteMapProvider`。 |\n| `Providers`\
  \ | 获取一组可用的、命名的 `SiteMapProvider` 对象。 |\n\n**表格 17-5**\n\n列表 17-28 显示了使用某些 `SiteMap`\
  \ 对象的示例，演示了如何使用来自 `Markets.aspx` 页面的 `CurrentNode` 对象。\n\n从这段简短的代码可以看出，通过使用 `SiteMap`\
  \ 类和 `CurrentNode` 对象，你可以处理关于当前页的大量信息。运行此页面，你将在屏幕上看到以下结果：\n\n```\n The Latest Market\
  \ Information\n  True\n  Funds\n  Finance\n  Quotes\n  Home\n  Markets\n  /SiteNavigation/Markets.aspx\n\
  ```\n\n使用 `CurrentNode` 属性，你实际上可以创建自己风格的 SiteMapPath 控件，如列表 17-29 所示。\n\n运行时，此页面将为你提供自己自定义的导航结构，如图\
  \ 17-30 所示。\n\n![image](img/f659-01.jpg)\n\n**图 17-30**\n\n# URL 映射\n\n随着应用程序不断增长，网页使用的\
  \ URL 有时会变得相当复杂。有时，你可能会展示根据 URL 提供的查询字符串更改内容的网页，例如：\n\n```\n http://www.asp.net/forums/view.aspx?forumid=12&categoryid=6\n\
  ```\n\n在其他情况下，你的网页可能处于文件夹层级的非常深处，以至于 URL 对于终端用户在稍后想浏览器中调出页面时来说变得非常难以输入或记忆。在某些时刻，你可能希望一组页面看起来像同一个页面或单一目的地。\n\
  \n在这些情况下，你可以利用 ASP.NET 的一项名为 `URL 映射`（URL mapping）的特性。URL 映射允许你将复杂的 URL 映射到更简单的\
  \ URL。你通过在 `web.config` 文件中使用 `<urlMappings>` 元素应用的设置来实现这种映射（参见列表 17-30）。\n\n此示例使用了虚拟\
  \ URL — `Content.aspx` —— 它映射到一个更复杂的 URL：`SystemNews.aspx?categoryid=5`。完成此构造后，当用户输入\
  \ URL `Content.aspx` 时，应用程序知道调用更复杂的 URL `SystemNews.aspx?categoryid=5` 页面。这是在浏览器中的\
  \ URL 甚至没有改变的情况下发生的。即使在页面完全加载，浏览器仍然显示 `Content.aspx` 页面作为目的地——从而在某种意义上欺骗了终端用户。\n\
  \n# SITEMAP 本地化\n\n改进后的资源文件（`.resx`）是 ASP.NET 本地化的极方法。第 32 章 将介绍使用 ASP.NET 对 Web\
  \ 进行本地化。然而，本介绍侧重于将本地化功能应用于应用程序的页面，但没有演示如何通过将本地化能力应用于诸如 `Web.sitemap` 文件等项目来进一步扩展这种能力。\n\
  \n### 为本地化构建 Web.sitemap 文件结构\n\n正如对 ASP.NET Web 应用程序的页面应用本地化指令是可能的，你也可以使用相同的框架来完成\
  \ `Web.sitemap` 文件中的本地化任务。为了向你展示这项技术的应用，列表 17-31 构建了一个 `Web.sitemap` 文件，它与列表 17-1\
  \ 中呈现的类似，但简单得多。\n\n列表 17-31 显示了一个相当简单的 `Web.sitemap` 文件。要启用 `Web.sitemap` 文件的本地化，你必须通过将`<siteMap>`\
  \ 元素中的 `enableLocalization` 属性设置为 `True` 来开启功能。启用后，你就可以像往常一样使用`<siteMapNode>` 元素定义节点。但是，由于你将在\
  \ `.resx` 文件中定义这些项目，因此不需要在该文件中重复定义。\n\n下一个需要注意的属性是用于 `<siteMapNode>` 元素的 `resourceKey`\
  \ 属性。以以下 `<siteMapNode>` 元素为例：\n\n```\n <siteMapNode url=\"News.aspx\" resourceKey=\"\
  News\">\n    . . .\n</siteMapNode>\n```\n\n在这种情况下，`resourceKey` 的值（将在 `.resx` 文件中使用的键）是\
  \ `News`。这意味着你可以使用以下语法在 `.resx` 文件中定义 `title` 和 `description` 属性的值：\n\n```\n News.Title\n\
  \ News.Description\n```\n\n### 修改 web.config 文件\n\n现在 `Web.sitemap` 已就绪，下一步是对 `web.config`\
  \ 文件进行一些添加。为了让 Web 应用程序自动检测访问各个页面的用户的语言，你必须在 `@Page` 指令中设置 `Culture` 和 `uiCulture`\
  \ 设置，或者在 `web.config` 文件的 `<globalization>` 元素中设置这些属性进行自动检测。\n\n当你处理导航和 `Web.sitemap`\
  \ 文件时（如本例所示），在 `web.config` 文件中进行此更改是最好的，因为它可以应用于应用程序中的每个页面。将其添加到 `web.config` 文件中会变得简单得多，因为你不需要手动为每个页面添加这些内容。\n\
  \n要进行这些更改，打开你的 `web.config` 文件并添加一个 `<globalization>` 元素，如列表 17-32 所示。\n\n\n\n\n\
  要实现自动检测功能，你只需将 `culture` 和 `uiCulture` 属性设置为 `auto` 即可。你也可以将值定义为 `auto:en-US`，这意味着将启用自动区域检测功能，但如果在各种资源文件中未找到定义的区域设置，则使用\
  \ `en-US`（美式英语）作为默认区域设置。然而，由于你将要定义一组默认的 `Web.sitemap` 值，实际上你并没有必要真的引入这种构造。\n\n接下来，你创建程序集资源文件，这些文件定义了\
  \ `Web.sitemap` 文件中使用的值。\n\n### 创建程序集资源 (.resx) 文件\n\n为了创建一组与 `Web.sitemap` 文件一起使用的程序集资源文件，请在你的项目中创建一个名为\
  \ `App_GlobalResources` 的文件夹。如果你正在使用 Visual Studio 2012（或用于 Web 的 Visual Studio\
  \ Express 2012），可以通过右键点击项目并选择“添加 ASP.NET 文件夹 ![image](img/Ar.jpg) `App_GlobalResources`\
  \ 来添加此文件夹。\n\n文件夹就绪后，向该文件夹添加两个程序集资源文件。将第一个文件命名为 `Web.sitemap.resx`，第二个文件命名为 `Web.sitemap.de.resx`。你这两个这两个文件的目标是为\
  \ `Web.sitemap` 文件提供一组默认值（定义在 `Web.sitemap.resx` 文件中），以及这些值的已翻译成德语的版本（包含在 `Web.sitemap.de.resx`\
  \ 文件中）。\n\n名称中使用的 `de` 值将是那些首选语言设置为 `de-DE`（或变体如 `de-AT` 或 `de-CH`）的用户使用的文件。表 17-6\
  \ 描述了这些构造的其他可能变体。\n\n| `.RESX FILE` | 提供的区域设置 |\n| --- | --- |\n| `Web.sitemap.resx`\
  \ | 当无法通过其他 `.resx` 文件识别终端用户的区域时使用的默认值 |\n| `Web.sitemap.en.resx` | 用于所有 `en`（英语）用户使用的资源文件\
  \ |\n| `Web.sitemap.en-gb.resx` | 用于英国英语使用者的资源文件 |\n| `Web.sitemap.fr-ca.resx` |\
  \ 用于加拿大法语使用者的资源文件 |\n| `Web.sitemap.ru.resx` | 用于俄语使用者的资源文件 |\n\n**表 17-6**\n\n\
  现在 `Web.sitemap.resx` 和 `Web.sitemap.de.resx` 文件已就绪，下一步是为这些文件填充值。为了完成此任务，你将直接在 `Web.sitemap`\
  \ 文件中使用之前定义的键。图 17-31 显示了此项练习的结果。\n\n![image](img/f662-01.jpg)\n\n**图 17-31**\n\n\
  尽管 IDE 声称这些不是有效的标识符，但应用程序仍然可以使用此模型运行。在文件准备就绪后，你可以测试此本地化尝试的工作情况，如下一节所示。\n\n### 测试结果\n\
  \n在你的应用程序中创建一个页面并在页面上放置一个 TreeView 服务器控件。除了 TreeView 控件外，你还必须包含一个 SiteMapDataSource\
  \ 控件，以便与创建的 `Web.sitemap` 文件配合使用。确保如本章早期所示，通过为 TreeView 控件赋予 `DataSourceID=\"SiteMapDataSource1\"\
  ` 属性将两个控件关联起来。\n\n如果你在 Microsoft Internet Explorer 中将语言偏好设置为 `en-us`（美式英语），你将看到图\
  \ 17-32 所示的结果。\n\n![image](img/f663-01.jpg)\n\n**图 17-32**\n\n当你在浏览器中打开页面时，会检查请求的区域设置。由于示例中定义的唯一细粒度偏好是使用\
  \ `de`（德语）区域的用户，因此使用了默认的 `Web.sitemap.resx`。因此，使用 `Web.sitemap.resx` 文件来填充 TreeView\
  \ 控件的值，如图 17-32](#Chapter17.xhtml_figure17-32)所示。然而，如果请求者的区域设置为 `de`，她将获得一组完全不同的结果。\n\
