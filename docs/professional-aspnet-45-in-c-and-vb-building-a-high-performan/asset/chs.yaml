  \n**[图 29-4**\n\n所有这些设计时功能都是为了帮助你在代码编写期间、在编译和运行之前确保更好的代码。两个相关功能——立即窗口（Immediate）和命令窗口（Command）——帮助你在开发环境中运行任意代码，并组织仍待执行的任务。\n\
  \n### 立即窗口和命令窗口\n\n立即窗口允许你在设计模式下无需编译应用程序即可运行任意代码片段。你可以在设计时或调试时评估代码。它是快速测试某行代码或静态方法的极佳方法。该窗口的立即模式主要用于调试。\n\
  \n通过调试![image](img/Ar.jpg)窗口![image](img/Ar.jpg)访问立即窗口。要评估变量或运行方法，只需点击立即窗口并输入问号（`?`）后跟要评估的表达式、变量或方法。\n\
  \n立即窗口可以通过大于号（`>`）切换到命令窗口。当你在立即或命令窗口中输入大于号时，会出现智能感知下拉列表，显示完整的 Visual Studio 对象模型以及你可能记录的任何宏。命令模式用于无需使用菜单执行\
