  \ 13-2）。\n\n![image](img/f458-01.jpg)\n\n**图 13-2**\n\n查看 `WebService.asmx` 文件。ASP.NET\
  \ Web 服务文件使用 `.asmx` 文件扩展而不是典型 ASP.NET 页面使用的 `.aspx` 扩展。\n\n### WebService 页面指令\n\
  \n在 Visual Studio 中打开 `WebService.asmx` 文件，你会发现文件仅包含 `WebService` 页面指令，如列表 13-3\
