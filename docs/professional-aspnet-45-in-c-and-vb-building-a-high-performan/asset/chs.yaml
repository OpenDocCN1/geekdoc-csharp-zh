  \ \"employees/Name\") %>\n```\n\n或者使用简写语法：\n\n```\n <% XPath(\"employees/Name\"\
  ) %>\n```\n\n## 使用表达式和绑定器\n\n表达式是 ASP.NET 在运行时解析的语句，以返回值。ASP.NET 自动使用表达式处理诸如数据库连接字符串等，你可能已经在页面中见过这些语句。列表\
  \ 8-53 显示了 `ConnectionString` 表达式示例。\n\n当 ASP.NET 尝试解析 ASP.NET 页面时，它会寻找在 `<%$ %>`\
  \ 分隔符中的表达式。这表明这是一个要解析的表达式。如前文所示，ASP.NET 从 `web.config` 文件中获取 `NorthwindConnectionString`\
  \ 值。ASP.NET 包含了几种表达式绑定器，包括一个从 `web.config` 文件的 `AppSettings` 部分获取值的工具。ASP.NET 知道这样做是因为\
  \ `ConnectionString` 前缀，它告诉 ASP.NET 使用 `ConnectionStringsExpressionBuilder` 类来解析表达式。\n\
  \n列表 8-54 和 8-55 展示了使用 `AppSettingsExpressionBuilder` 和 `ResourceExpressionBuilder`。\n\
  \n除了使用表达式绑定类，你还可以通过派生 `System.Web.Compilation.ExpressionBuilder` 基类来创建自己的表达式。该基类为你提供了如果你希望\
  \ ASP.NET 正确解析你的表达式时必须重写的方法。列表 8-56 显示了一个简单的表达式绑定器。\n\n在检查此列表时，注意几点。首先，你像之前讨论的那样从\
  \ `ExpressionBuilder` 派生了 `MyCustomExpression` 类。其次，你重写了 `GetCodeExpression` 方法。该方法提供了若干对执行此方法非常有帮助的参数，并向\
  \ ASP.NET 返回一个 `CodeExpression` 对象，其可以在运行时执行以检索数据值。\n\n`BoundPropertyEntry` 参数精确地告诉你表达式绑定到哪个属性。例如，在列表\
  \ 8-54 和 8-55 中，`Label` 的 `Text` 属性绑定到 `AppSettings` 和 `Resources` 表达式。对象参数 `parsedData`\
  \ 包含了 `ParseExpression` 方法解析并返回的任何数据，你将在章节的后续部分看到它。最后，`ExpressionBuilderContext`\
  \ 参数允许你引用与表达式相关的虚拟路径或模板控件。\n\n\n\n\n\n在 `GetCodeExpression` 方法体中，你正在创建一个新的 `CodeCastExpression`\
  \ 对象，该对象是派自 `CodeExpression` 基类的派类。`CodeCastExpression` 通知 .NET 生成适当的代码以执行从一种数据类型到另一种数据类型的类型转换。在这种情况下，你正在将值\
  \ `1000` 转换为 `Int64` 数据类型。当 .NET 执行 `CodeCastExpression` 时，它（在某种意义上）正在编写 C# 代码 `((long)(1000))`\
  \ 或（如果你的应用程序是用 VB 编写的）`CType(1000,Long)`。请注意，有许多类都派自 `CodeExpression` 类，你可以使用它们来生成最终的代码表达式。\n\
  \n需要注意的最后几行是添加到类中的两个属性。`ExpressionPrefix` 和 `ExpressionEditor` 属性帮助 .NET 确定该类应该用作表达式，并且在需要解析表达式时帮助\
  \ .NET 定位到表达式生成器类。\n\n创建完表达式生成器类后，你需要让 .NET 知道它的存在。你可以通过在 `web.config` 文件的编译节点中添加\
  \ `ExpressionBuilders` 节点来实现。注意，`ExpressionPrefix` 的值被添加到 `ExpressionBuilder` 中，帮助\
  \ ASP.NET 在运行时定位相应的表达式生成器类。\n\n```\n<compilation debug=\"true\" strict=\"false\"\
  \ explicit=\"true\">\n  <expressionBuilders>\n    <add expressionPrefix=\"MyCustomExpression\"\
  \ type=\"MyCustomExpression\"/>\n  </expressionBuilders>\n</compilation>\n```\n\n\
  `GetCodeExpression` 方法并不是 `ExpressionBuilder` 类中唯一可以重写的成员。其他几个实用成员包括 `ParseExpression`、`SupportsEvaluate`\
  \ 和 `EvaluateExpression` 方法。\n\n`ParseExpression` 方法允许你将解析后的表达式数据传递到 `GetCodeExpression`\
  \ 方法。例如，在 Listing 8-56 中，`CodeCastExpression` 值 `1000` 是硬编码的。然而，如果你允许开发者作为表达式的一部分传递该值，只需像\
  \ Listing 8-57 所示使用 `ParseExpression` 方法即可。\n\n最后两个需要检查的 `ExpressionBuilder` 重写成员是\
  \ `SupportsEvaluate` 和 `EvaluateExpression`。如果你在无编译场景下运行网站（在 `@Page` 指令中指定了 `compilationMode\
  \ = \"never\"`），则需要重写这些方法。`SupportEvaluate` 属性返回一个 `Boolean` 值，指示 ASP.NET 该表达式在页面以无编译模式执行时是否可以被评估。如果返回\
  \ `True` 且页面在无编译模式下执行，则使用 `EvaluateExpression` 方法返回数据值而不是 `GetCodeExpression` 方法。`EvaluateExpression`\
  \ 返回一个表示数据值的对象。参见 Listing 8-58。\n\n如 Listing 8-58 所示，如果你想重写 `EvaluateExpression`\
  \ 方法，只需从 `SupportsEvaluate` 属性返回 `True`。然后你只需要从 `EvaluateExpression` 方法返回一个对象即可。\n\
  \n## 总结\n\n在本章中，你研究了 ASP.NET 中的数据绑定。数据源控件（如 `LinqDataSource`、`SqlDataSource` 和 `XmlDataSource`）使得从任何数量的数据源查询和显示数据几乎成为轻而易举的任务。通过使用数据源控件自身的向导，你学习了如何几乎不需要编写代码就能生成强大的数据访问功能。\n\
  \n你研究了即使是初级开发者也可以轻松地将数据源控件与 `GridView`、`ListView` 和 `DetailsView` 控件结合，用极少的代码创建强大的数据处理应用程序。\n\
  \n你还看到 ASP.NET 包含了许多可以进行数据绑定的控件，并研究了 ASP.NET 工具箱中包含的控件特性，例如 `GridView`、`TreeView`、`ListView`、`FormView`\
  \ 和 `Menu` 控件。\n\n最后，你看了通过添加 XML 特有的数据绑定表达式，内联数据绑定语法是如何得到改进和加强的。\n\n# 9\n\n## 模型绑定\
  \ (Model Binding)\n\n### 本章内容：\n\n* 理解模型绑定\n* 使用强类型控件\n* 扩展模型绑定\n\n## 本章对应的代码下载\n\
  \n请注意，本章中的所有代码示例均作为书籍网站 [`www.wrox.com`](http://www.wrox.com) 上“Download Code”选项卡中本章代码下载的一部分提供。\n\
  \n模型绑定引入于 ASP.NET MVC。模型绑定使得更容易将客户端提交的数据转换为适用于服务器使用和验证的格式。模型绑定内置在 ASP.NET MVC 1.0\
  \ 框架中。当 ASP.NET MVC 2.0 发布时，引入了一种名为“可扩展模型绑定”的新系统。这为开发者在服务器上如何绑定客户端数据提供了更多的控制权和灵活性。\n\
  \n在 ASP.NET 4.5 之前，该系统仅适用于 ASP.NET MVC。然而，在 ASP.NET 4.5 中，模型绑定也可以用于构建 ASP.NET Web\
  \ Forms 。ASP.NET 4.5 Web Forms 中的模型绑定系统基于“可扩展模型绑定”系统。\n\n在上章中，你学习了数据绑定是如何通过数据控件实现的。在本章中，你研究了模型绑定是如何实现的并发现了使用它的优点。\n\
  \n## 模型绑定\n\n模型绑定有两个用途。它提供了一种从客户端获取值并将其绑定到模型的方法。它提供了一种验证机制，一旦模型绑定，你可以运行验证规则来确定模型是否有效。ASP.NET\
  \ Web Forms 中的模型绑定将模型绑定架构的力量引入控件，并提供了一个允许开发者更容易集成各种模式（如 PRG：提交-重定向-获取、Repository\
  \ 存储库等）的系统。它还让应用程序代码更整洁，使应用程序更易于测试。\n\n模型绑定挂接到现有的数据绑定控件上。你可以使用模型绑定从控件中提取值，以便在服务器上检查客户端值，并且控件可以绑定到模型绑定系统返回的值。模型绑定与现有的数据绑定控件配合工作，因此你可以使用在本章中学的概念。\n\
  \n例如，假设你有一个网页，用户可以使用 `DetailsView` 控件输入人员详细信息。当用户输入详情并将表单提交到服务器时，模型绑定系统从 `DetailsView`\
  \ 控件中提取值，以便你在服务器上执行某些操作。如果验证成功，你就可以在数据库中保存人员详细信息。在这种情况下，人员就是模型绑定系统交互的模型。模型可以是 AD.NET\
  \ Entity Framework 模型，也可以是 Entity Framework Code First 模型。\n\n让我们来看一些使用模型绑定的常用数据操作。\n\
  \n### 选择数据\n\n首先创建一个新的 Web Forms 页面，并使用 `GridView` 控件选择并过滤客户数据。Listing 9-1 显示了如何配置\
  \ `GridView` 控件以使用模型绑定检索数据。该控件使用了两个新属性——`ItemType` 和 `SelectMethod`。\n\n*   `ItemType`\
  \ 告诉模型绑定系统控件应该绑定到什么类型的模型。`ItemType` 属性是可选的，但当你包含它时，数据绑定表达式将获得强类型的智能提示（IntelliSense）。你将在本章稍后详细查看这些强类型控件。\n\
  \n*   `SelectMethod` 属性决定了要调用页面上的哪种方法来获取记录。Listing 9-2 显示了 `Select` 方法的样子。\n\n\n\
  \n\n\n在列表 9-2 中，`Select` 方法返回了一个 `Customers` 列表。如该列表所示，我们首先实例化 `CustomerContext`，这在你在使用\
  \ Entity Framework Code First 时会用到。当你实例化 `CustomerContext` 时，你可以访问所有的 `Customers`，并执行任何\
  \ LINQ 查询来过滤结果，正如本节稍后所示。\n\n### 分页\n\n#### 分页功能\n`GridView` 控件内置了分页和排序功能。使用模型绑定，你可以通过从模型绑定的\
  \ `Select` 方法返回一个 `IQueryable<T>` 来利用这些功能。列表 9-3 向了了如何启用分页和排序。要实现分页和排序，你需要像列表 9-1\
  \ 中所示，在 `GridView` 控件上启用分页和排序。\n\n在这个列表中，你会注意到 `Select` 方法返回的是 `IQueryable` 而不是\
  \ `IEnumerable`。当模型绑定的 `Select` 方法返回 `IQueryable<T>` 且在 `GridView` 控件上启用了排序/分页时，`GridView`\
  \ 可以自动连接排序和分页功能。\n\n#### 过滤\n通常，你需要过滤想要显示给用户的结果。你并不希望返回表中的所有记录。在上节中，你学习了如何使用 `SqlDataSource`\
  \ 控件中的 `Select` 参数来过滤数据。在模型绑定中，可以通过使用 `ValueProviders` 和 `ValueProvider` 属性来实现过滤。列表\
  \ 9-4 展示了你如何使用来自 `QueryString` 的值来过滤数据。在这个示例中，添加类似 `?ID=5` 的查询字符串将只返回 ID 为 5 的记录。\n\
  \n当你在 `QueryString` 中传递 `ID=5` 时，模型绑定系统会获取此值并将其作为参数提供给 `Select` 方法。由于我们正在使用 Entity\
  \ Framework Code First，我们可以编写一个 LINQ 查询来过滤 ID 为 5 的客户列表，并将结果返回给 `GridView` 控件。\n\
  \n#### 使用值提供程序\n列表 9-4 展示了如何使用 `QueryString` 值提供程序属性来过滤结果。该属性告诉模型绑定系统在运行时将查询字符串中的值绑定到\
  \ `id` 参数上。模型绑定系统会根据需要执行任何类型转换。\n\n值提供程序属性最终从 `ValueProviders` 获取值，并告诉模型绑定系统应使用哪个\
  \ `ValueProvider`。表 9-1 显示了你可以从框架使用的值提供程序属性。\n\n| 值提供程序属性 | 说明 |\n| --- | --- |\n\
  | `Form` | 值从 `Form` 集合中检索。 |\n| `Control` | 值从指定的控件中检索。 |\n| `QueryString` | 值从\
  \ `QueryString` 集合中检索。 |\n| `Cookie` | 值从 `Cookie` 集合中检索。 |\n| `Profile` | 值从 `Profile`\
  \ 集合中检索。 |\n| `RouteData` | 值从 `RouteData` 集合中检索。 |\n| `Session` | 值从 `Session`\
  \ 集合中检索。 |\n\n**表 9-1**\n\n##### 使用控件\n本节介绍了一个高级示例，即你想根据来自另一个服务器控件的值来过滤结果。你可能经常发现需要根据下拉列表过滤值，例如。列表\
  \ 9-5 展示了你如何使用 `Control` 值提供程序属性从下拉列表控件中检索值。然后它使用该值过滤结果并将显示在 `GridView` 控件中。\n\n\
  在这个列表中，当你从 `DropDownList` 控件中选择一个值时，`GridView` 会绑定到 `DropDownList` 控件的选中值。模型绑定系统接收\
  \ `DropDownList` 控件的选中值（在此情况下为 `ID`），并使用 `Control` 值提供程序将其作为参数传递给 `SelectCustomers`\
  \ 方法。\n\n#### 插入数据\n记住，在 ASP.NET 4.5 中，数据绑定控件已更新以支持模型绑定。现在你将查看如何使用模型绑定来插入记录。你可以使用\
  \ `DetailsView` 控件来插入记录。在控件上，你必须设置一个名为 `InsertMethod` 的新属性，该属性可以在页面上调用。列表 9-6 显示了插入方法。\n\
  \n如果你仔细观察 `InsertMethod`，你会注意到该方法的输入是一个名为 `Customer` 的类型。这是 `DetailsView` 控件绑定的模型类型。（这是通过控件的\
  \ `ItemType` 属性指定的。）\n\n当你插入一个值时，模型绑定系统会从 `DetailsView` 控件获取值并填充客户类型模型，以便客户模型可以在服务器端用于任何种的验证。一旦调用了\
  \ `InsertMethod`，你可以进行检查以查看模型绑定系统中是否存在任何验证错误。如果一切成功，你就可以将此新的 `Customer` 添加到 `Customer`\
  \ 集合并保存到数据库中。\n\n#### 更新数据\n我们在插入记录时看到的绑定方法适用于简单情况。然而，数据控件通常无法为模型的每个成员提供值，因为这些成员可能是关系对象，或者它们没有在控件中渲染。在这种情况下，最好的做法是接收主键，从数据存储加载模型，并告诉模型绑定系统将控件中的值绑定到模型。列表\
  \ 9-7 显示了更新方法如何工作。\n\n列表 9-7 展示了你如何更新记录。所有数据绑定控件都有一个名为 `DataKeyNames` 的属性，用于唯一标识记录。该属性具有主键字段的名称。当\
  \ `DetailsView` 控件执行插入操作时，模型绑定系统用 `DataKeyNames` 的值填充 `update` 方法中的参数。该参数（`id`）现在持有主键（`ID`）的值，可用于检索用户更新的特定记录。当你调用\
  \ `TryUpdateModel` 时，模型绑定系统根据用户在更新记录时指定的值来更新客户模型的值。\n\n##### 在模型绑定系统中验证记录\n在大多数情况下，你会在将记录保存到数据库之前，根据自定义业务逻辑对记录进行验证。模型绑定使得这种场景非常容易实现，并且结果更加整洁。如果你在使用\
  \ `ObjectDataSource` 使用业务验证规则，则没有简单的方法将异常回传到页面。你最终会在业务层抛出异常，并在控件中捕获，然后显示自定义错误消息。这会让代码变得非常杂乱。\n\
  \n模型绑定系统的优势是它将绑定与验证清晰分离。这意味着你可以非常方便地使用自定义验证。从模型绑定系统抛出的验证错误通过验证摘要显示，因此有助于自定义 UI 并有助于保持代码整洁。\n\
  \n在 ASP.NET Web Forms 中启用模型绑定的一个好处是，你可以接入不同的验证机制。例如，你可以使用数据注解属性，这允许你向模型添加属性以表示关于该模型的某些元数据。模型绑定系统可以在验证期间使用这些元数据。列表\
  \ 9-8 向你展示了如何告诉模型绑定系统 `FirstName` 字段是必填的。\n\n\n\n\n\n在这种情况下，如果你没有为 `FirstName` 字段输入值，则\
  \ `TryUpdateModel()` 的调用将返回 `false`。如果你在页面上有一个 `ValidationSummary` 控件，你将会在验证摘要中看到错误消息。Listing\
  \ 9-9 显示了如何配置 `ValidationSummary` 控件以显示来自模型绑定系统的错误。检查任何验证错误的另一种方法是检查页面的 `ModelState`\
  \ 属性。如果在模型绑定过程中发生了任何错误，模型绑定系统就会填充该属性属性。\n\n## 将业务逻辑与页面分离\n\n到目前为止，你一直是在页面上调用模型绑定方法。虽然这是更常见的做法，但它会导致页面后置代码（code-behind）中产生大量代码。页面必须同时处理\
  \ UI 逻辑和业务逻辑。在上一章使用 `ObjectDataSource` 的章节中，业务逻辑位于一个独立的类中，而页面代码只处理 UI。Listing 9-10\
  \ 显示了你如何在模型绑定中实现这一目标。你必须告诉模型绑定系统从哪里加载模型绑定方法。这是通过重写数据绑定控件的 `OnCallingDataMethods`\
  \ 方法来实现的。模型绑定系统将实例化 `repository` 类并在类中查找方法。这种方法使得应用程序逻辑变得更加整洁，且更易于测试。\n\n## 使用强类型控件\n\
  \nASP.NET 2.0 Web Forms 引入了模板控件的概念。模板允许你自定义从服务器控件发出的标记，并且它们通常与数据绑定表达式一起使用。本节将介绍\
  \ ASP.NET 4.5 中发生的改进，这些改进使得数据绑定和 HTML 编码变得更加简单。\n\n在 ASP.NET 2.0 中，单向数据绑定是通过 `Eval()`\
  \ 和 `Bind()` 辅助方法实现的。这些辅助方法对数据进行后期绑定。Listing 9-11 显示了如何使用 `Eval()` 辅助方法。\n\n这种方法的缺点是，由于这些表达式是后期绑定的，你必须传递一个字符串来表示属性名。这意味着你无法获得成员名称的智能感知（IntelliSense）、不支持代码导航（如转到定义），也不支持编译时检查。\n\
  \n当控件是强类型时，意味着你可以通过一个名为 `ItemType` 的新属性声明控件将绑定到什么类型的数据。当你设置此属性时，控件将为绑定表达式提供两个新属性——`Item`\
  \ 和 `BindItem`。\n\n`Item` 等于 `Eval()`，而 `BindItem` 等于 `Bind()`。Listing 9-12 显示了强类型控件的示例。\n\
  \n如果你在 Visual Studio 中输入 `BindItem`，如 Listing 9-12 所示，你将获得模型 `Customer` 中所有属性的智能感知，如\
  \ Figure 9-1 所示。如果你在输入时出错，你将在 Visual Studio 中收到一个错误提示。\n\n![image](img/f363-01.jpg)\n\
  \n**图 9-1**\n\n## 扩展模型绑定\n\n虽然 ASP.NET Web Forms 一直是一个优秀的 Web 开发框架，但自定义和扩展该框架一直有些痛苦。然而，模型绑定系统的构建使得你可以轻松地自定义和扩展模型绑定系统，以匹配你的开发场景。在本节中，你将学习自定义值提供程序（value\
  \ providers）和模型绑定器（model binders）。最后，你将查看扩展 `ModelDataSource` 以控制模型绑定系统的运行。\n\n\
  ### 自定义值程序\n\n到目前为止，你查看了 `ValueProviders` 和 `ValueProvider` 属性。这些属性为指定模型绑定系统从哪里获取值提供了基本支持。但在某些情况下，你真的不知道值可能来自哪里，或者你希望编写应用程序以便有一个回退机制——你允许值来自\
  \ `Form 集合` 或 `QueryString 集合`。在这种情况下，你可以编写自己的值提供程序属性和值提供程序来处理这种场景。Listing 9-13\
  \ 显示了这样的自定义值提供程序和值提供程序属性的内容。\n\n此列表显示了一个将使用该提供者的值程序和一个值提供程序属性。该值程序将 `Form` 和 `QueryString`\
  \ 值提供程序作为其源。这意味着当模型绑定系统调用此自定义值提供程序时，自定义值提供程序将首先检查 `Form` 集合以检索值，如果没有找到值，则将检查 `QueryString`\
  \ 集合。Listing 9-14 显示了你如何在应用程序中使用此自定义值提供程序。\n\n如列表所示，你可以通过指定为你自己的值提供程序定义的自定义值提供程序属性来使用你的自定义值提供程序。`AggregateValue`\
  \ 属性的工作方式与 `QueryString` 等值提供程序属性相同。模型绑定系统调用 `AggregateValue` 属性来绑定参数 `id` 的值。`AggregateValue`\
  \ 属性调用 `AggregateValueProvider` 来获取参数 `id` 的值。\n\n### 自定义模型绑定器\n\nASP.NET 4.5 中的模型绑定实现对不同类型的数据提供了支持。虽然基础实现处理了常用数据类型的绑定，但在某些情况下，模型绑定系统无法绑定特定类型。在这种情况下，你可以编写自己的模型绑定器并将其插入模型绑定系统。每当模型绑定尝试绑定某种类型的模型时，你的自定义模型绑定器就会被调用以获取值。\n\
  \n例如，如果你需要更改内置绑定器如何将数据绑定到模型的行为（对于 `DateTime` 类型）。你希望分开存储日期和时间，或者以不同的区域格式存储。你可以通过实现自己的自定义模型绑定器来实现这一点。Listing\
  \ 9-15 显示了模型绑定器的自定义实现。\n\n要实现模型绑定器，你必须实现一个提供程序（provider）和一个绑定器（binder）。\n\n*   **提供程序**由模型绑定系统调用，以检查提供程序是否可以处理特定类型。在\
  \ Listing 9-15 和 9-16 的示例中，你可以看到 `DateTime` 类型正在被处理。当调用提供程序且如果它可以处理 `DateTime` 类型时，提供程序将调用绑定器。\n\
  *   **绑定器**负责从模型绑定系统解析值并填充模型。\n\n当模型绑定系统尝试将数据绑定到模型时，它会遍历注册提供程序列表，查看哪个提供程序可以找到绑定特定值的绑定器。按顺序调用提供程序。如果你没有实现通用解决方案，并且不担心找不到类型绑定器时的回退行为，可以将你的提供程序注册为第一个。Listing\
  \ 9-16 显示了如何向应用程序注册模型绑定器。\n\n\n\n\n\n在 Web Forms 实现的核心部分，模型绑定系统基于数据控件（data controls）。该实现使用了可扩展的模型绑定和控件架构。模型绑定被实现在为一个名为\
  \ `ModelDataSource` 的数据源，它实现了 `IDataSource` 接口。这与其他 `ObjectDataSource` 对象遵循的模式相同。例如，还有一个\
  \ `ModelDataSourceView` 的对象，它包含了执行来自数据控件的 `select`、`insert`、`update` 和 `delete`\
  \ 调用的逻辑。\n\n这意味着该实现是完全可扩展的。如果你想重写 `select` 调用发生的方式，那么可以编写自己的 `ModelDataSource` 和\
  \ `ModelView` 对象，并将它们插入到模型绑定系统中。如果你想扩展模型绑定系统，以便诸如主详情绑定（master-detail binding）等场景变得更容易实现，这种方法非常有用。\n\
  \nListing 9-17 显示了如何实现自定义的 `ModelDataSource` 和 `ModelDataSourceView` 对象。此自定义实现仅返回表格中的前三行，但可以轻松扩展到更复杂的场景。\n\
  \nListing 9-18 显示了如何在你的应用程序中使用此自定义的 `ModelDataSource`。在数据控件上，你可以通过重写名为 `OnCreatingModelDataSource`\
  \ 的事件来重写控件应该使用的 `ModelDataSource`。\n\n## 总结\n\n模型绑定系统是 Web Forms 数据绑定故事的下一步。它利用了可扩展模型绑定系统的强大灵活性，并将其与数据控件的力量相结合，使得应用程序开发变得简单。这也导致了更整洁的实现，支持单元测试和\
  \ IOC 容器等范式。\n\n模型绑定使得数据访问更加关注代码，并允许你在整个 ASP.NET 中复用数据注解程序集。你可以使用值提供程序（value providers）来简化过滤场景。最后，你看到了如何为了自定义绑定和选择对模型绑定系统进行自定义和扩展，这使得该框架非常易适应。\n\
  \n# 10 使用 LINQ 查询\n\n**本章包含哪些内容？**\n\n* 探索不同类型的 LINQ 查询\n* 理解传统查询方法的局限性\n* 使用 LINQ\
  \ 简化查询操作\n\n## 本章的 WROX.COM 代码下载\n\n请注意，本章中的所有代码示例均作为本章代码下载的一部分，可以在书籍网站的 [`www.wrox.com`](http://www.wrox.com)\
  \ 下载代码标签页上获取。\n\n.NET 3.5 引入了一种名为语言集成查询（Language Integrated Query，或 LINQ，读作“link”）的技术。那时起，LINQ\
  \ 继续成为 .NET 开发中不可或缺的技术。在 .NET 4.0 和 .NET 4.5 中，微软继续对 LINQ 进行更新以增强其性能。LINQ 的设计是为了弥补传统\
  \ .NET 语言（提供强类型和面向对象开发）与专门为查询操作设计语法的查询语言（如 SQL）之间的空白。随着 LINQ 引入 .NET Framework，查询变成了\
  \ .NET 中的一等公民概念，无论你是在谈论对象、XML 还是数据库查询。\n\n尽管 LINQ 是可扩展的并且可以扩展到其他数据源，但 LINQ 包含了三种基本的查询类型：LINQ\
  \ to Objects；LINQ to XML 以及在数据库上下文使用的查询（如 LINQ to SQL 或 LINQ to Entities）。每种类型的查询都提供了特定的功能，并为查询特定的数据源而设计。\n\
  \n本章将介绍上述所有类型的 LINQ 查询，包括 LINQ to SQL 和 LINQ to Entities，以及它们如何让你能够简化查询操作。它还涵盖了你用于创建\
  \ LINQ 查询的 .NET CLR 语言特性，以及 Visual Studio 中支持使用 LINQ 的工具支持。\n\n## LINQ TO OBJECTS\n\
  \nLINQ 第一种且最基本的变体是 LINQ to Objects。LINQ to Objects 允许你对任何枚举对象（任何实现了 `IEnumerable`\
  \ 接口的对象）执行复杂的查询操作。虽然创建可以查询或排序的枚举对象的概念对于 .NET 来说并不新鲜，但在 3.5 之前的版本中，这样做通常需要大量的代码。通常，这些代码会变得非常复杂，导致其他开发者难以阅读和理解，从而难以维护。\n\
  \n### 理解传统查询方法\n\n为了理解 LINQ 如何提高你查询集合的能力，你需要理解在没有它时是如何进行查询的。为此，请看你如何在不使用 LINQ 的情况下创建一个包含分组和排序的简单查询。Listing\
  \ 10-1 显示了一个简单的 `Movie` 类，你可以将其作为这些示例的基础。\n\n这个基础类将贯穿本节以及接下来的 LINQ to Object 节。\n\
  \n现在你有了一个基础类来工作，是时候看看你通常会如何使用该类了。Listing 10-2 展示了如何在 ASP.NET 页面中创建一个 `Movie` 对象的简单泛型列表，然后将该列表绑定到\
  \ GridView 控件。本章提供的代码示例包含的 `Movie` 条目比 Listing 10-2 中显示的更多。GridView 显示了 `Movie`\
  \ 类暴露的所有公共属性的值。（注意，你需要更改日期格式以适应你开发机器的本地区域设置，以便此示例能够正常运行。）\n\n运行示例将生成一个典型的 ASP.NET\
  \ Web 页面，其中包含一个显示所有 `Movie` 数据的简单网格。\n\n现在，当你想要对电影列表执行查询时，会发生什么？例如，你可能想过滤这些数据以只显示特定类型。Listing\
  \ 10-3 显示了你执行这种过滤的典型方法。\n\n正如示例所示，过滤数据以使页面仅显示特定类型只需要创建一个临时集合并使用 `foreach` 循环。\n\n\
  虽然这种技术看起来足够简单，但它仍然要求你定义想要做什么（找到所有该类型的电影），以及显式地定义应该怎么做（使用临时集合和 foreach 循环）。\n\n此外，当你需要执行更复杂的查询（涉及分组或排序）时，会发生什么？现在代码的复杂性剧增，如\
  \ Listing 10-4 所示。\n\n将电影数据按类型分组并计算每个类型的电影数量需要添加一个新类、创建一个 `Dictionary` 并实现一个委托（delegate）对于这样一个简单的任务来说，这些要求都相当复杂。再次，你不仅必须非常具体地定义想要做什么，还要非常显式地定义应该怎么做。\n\
  \n### 使用 LINQ 替代传统查询\n\n创建 LINQ 是为了解决上一节中讨论的对象集合查询的许多缺点。LINQ 不再要求你非常具体地定义你想要如何执行查询，而是赋予了你留在更抽象层次的力量。通过定义你想要查询的结果，你让\
  \ .NET 及其编译器来决定查询的具体运行细节。\n\n\n\n\n\n在上一节中，你查看了如何在没有 LINQ 帮助的情况下查询对象集合。在本节中，你将查看\
  \ LINQ 并了解使用它如何极大地简化这些查询以及其他类型的查询。本节的示例从修改上一节的示例开始，向你展示 LINQ 如何轻松地完成相同的任务。\n\n在开始之前，请先理解\
  \ LINQ 是 .NET Framework 核心的扩展，因此它被隔离在自己的一组程序集中。基础的 LINQ 功能位于 `System.Core.dll` 程序集中。该程序集并没有替换任何现有的\
  \ .NET Framework 功能，而是对其进行了增强。此外，Visual Studio 中的项目默认包含对该程序集的引用，因此在启动新的 ASP.NET\
  \  Web 项目时，你可以随心随地使用 LINQ。\n\n### 基础 LINQ 查询与投影\n\n如果你还记得的话，列表 10-2 中的基本示例生成了一个通用的电影列表，并将该列表绑定到\
  \ `GridView` 控件。列表 10-5 显示了如何修改代码以使用 LINQ 查询电影列表，并将生成的数据集绑定到 `GridView`。\n\n如果你解构代码示例，你会看到正在发生三个基本操作。首先，代码使用\
  \ `GetMovies()` 方法获取通用的 `List<Movie>` 集合。\n\n接下来，代码使用一个非常简单的 LINQ 查询从通用 `movies`\
  \ 集合中选择所有 `Movie` 对象。注意，这个特定的 LINQ 查询在查询语句使用了诸如 `from` 和 `select` 等语言关键字。这些语法上的扩展是\
  \ .NET 语言的一等公民成员；因此，Visual Studio 可以为你提供开发帮助，例如强类型检查和 `IntelliSense`，这使得在你的代码中发现并修复问题变得更加容易。\n\
  \n查询还定义了一个新变量 `m`。该变量在查询中有两种用法。首先，通过在 `from` 语句中定义它（即 `from m`），你是在指示 LINQ 使用变量\
  \ `m` 来表示集合中的单个项目，在这种情况下是一个 `Movie` 对象。告诉 LINQ 这一点让它能够理解你正在查询的对象的结构，并且正如稍后看到的，它还能为你提供\
  \ `IntelliSense` 来帮助创建查询。\n\n`m` 在查询中的第二个用法是在 `select` 语句中。在 `select` 语句中使用 `m`\
  \ 告诉 LINQ 输出一个与 `m` 结构匹配的投影。*投影*指的是将对象转换为新形式的操作，该新形式通常只包含你为了特定用途所需的属性。在这种情况下，这意味着\
  \ LINQ 创建了一个与 `Movie` 对象结构匹配的投影。\n\n你完全可以通过使用 `new` 关键字配合 `select` 操作符显式定义你想从查询中返回的字段，从而创建你自己的自定义投影，如\
  \ 列表 10-6 所示。\n\n注意，你并没有选择 `m`，而是定义了一个只包含 `Title` 和 `Genre` 的值的新投影。\n\n你甚至可以显式地定义结果数据集中对象将暴露的字段名。例如，你可能想更显式地命名\
  \ `Title` 和 `Genre` 字段，以更完整地描述它们的内容。使用 LINQ，这项命名任务很容易，如 列表 10-7 所示。\n\n此示例显式定义了结果集将暴露的字段为\
  \ `MovieTitle` 和 `MovieGenre`。你可以在 图 10-1 中看到，由于这一变化，`GridView` 中的列标题也随之发生了。\n\n\
  ![image](img/f379-01.jpg)\n\n**图 10-1**\n\n最后，代码将 `GridView` 控件绑定到 LINQ 查询返回的 `Movie`\
  \ 对象的可枚举列表。\n\n如 图 10-2 所示，运行 列表 10-5 中的代码将得到与章节早些时候生成的 列表 10-2 相同的原始  。\n\n![image](img/f379-02.jpg)\n\
  \n**图 10-2**\n\nLINQ 还允许你使用 `order by` 语句对结果进行排序。与 SQL 一样，你可以选择按升序或降序排列结果，如 列表 10-8\
  \ 所示。\n\nLINQ 语法的另一个伟大特性是它极大地提高了代码中代码的可读性和可理解性。LINQ 允许你表达查询的意图，告诉编译器你想让代码做什么，但将其交给编译器来最佳地决定如何实现。\n\
  \n*VB*\n\n```vb\nDim query = movies.Select( Function(m as Movie) m )\n```\n\n*C#*\n\
  \n```csharp\nvar query = movies.Select(m => m);\n```\n\n这就是编译器在编译过程中将关键字语法翻译成的形式。你可能好奇\
  \ `Select` 方法是如何被添加到通用 `List<Movies>` 集合中的，因为如果你查看 `List<Movies>`，并没有 `Select` 方法。LINQ\
  \ 使用扩展方法为 `IEnumerable` 添加了 `Select` 方法以及许多方法。你可以通过在 Visual Studio 中右键点击 `Select`\
  \ 方法并选择转到定义来查看 LINQ 添加的所有方法。这样做会导致 Visual Studio 显示 `Enumerable` 类的元数据。当你滚动查看类时，你不仅会看到\
  \ `Select`，还会看到诸如 `Where`、`Count`、`Min`、`Max` 等其他方法。\n\n### 使用自定义比较器排序\n\n当你使用 `order\
  \ by` 语句或 `OrderBy` 和 `OrderByDescending` 扩展方法时，排序类型的默认比较器会对值进行比较。有时你对结果的排序需要比默认比较器更多的控制。在这些情况下，你可以创建一个自定义比较器，并通过\
  \ `OrderBy` 或 `OrderByDescending` 扩展方法的重载将其传递。为了创建自定义比较器，你创建一个继承自 `IComparer<>`\
  \ 的类。根据 列表 10-2 中的电影数据，如果你按导演排序，结果将按名字排序，因为字符串包含了名字，后是姓氏。如果你希望按姓氏排序结果，你需要如 列表 10-9\
  \ 所示创建一个自定义比较器。\n\n为了在 `OrderBy` 或 `OrderByDescending` 扩展方法中使用此新比较器，可以将 列表 10-8\
  \ 重写为如 列表 10-10 所示。\n\n图 10-3 显示了运行 列表 10-10 中代码的结果。导演已被添加到结果中，现在按导演的姓氏降序排序。\n\n\
  ![image](img/f382-01.jpg)\n\n**图 10-3**\n\n### 延迟执行\n\nLINQ 的一个有趣的特性是它的延迟执行行为。这意味着即使你可能在代码的特定点执行查询语句，LINQ\
  \ 也足够智能，会将实际执行延迟直到被访问。例如，在之前的示例中，尽管 LINQ 查询在绑定 `GridView` 控件之前就已经编写，但直到 `GridView`\
  \ 控件开始枚举查询结果时，LINQ 才会执行你定义的查询。\n\n\n\n\n\n延迟执行最大的优势之一是可以在执行查询之前对 LINQ 查询进行修改。虽然\
  \ LINQ 查询返回的是一个 `IQueryable`，它继承自 `IEnumerable`，但在你实际对它进行迭代之前，数据是并不可用的。尝试对结果进行迭代将导致\
  \ LINQ 执行查询。还有一些方法会引起 LINQ 查询立即执行，例如以“To”开头的方法（如 `ToList()`）以及返回单个结果的方法（如 `Count()`）。\n\
  \n由于查询的实际执行直到你对结果进行迭代时才会发生，因此你可以在执行之前为查询添加额外的筛选条件。下一节将讨论如何过滤数据。\n\n## 使用 LINQ 过滤数据\n\
  \nLINQ 还支持使用熟悉的类 SQL `where` 语法添加查询筛选器。你可以修改列表 10-3 中的 LINQ 查询，通过在查询中添加 `where`\
  \ 子句来增加过滤功能，如列表 10-11 所示。\n\n通过在向 LINQ 查询中添加这个简单的 `where` 子句，查询返回的结果将被过滤为仅显示类型为\
  \ 0 的电影，如图 10-4 所示。\n\n![image](img/f383-01.jpg)\n\n**图 10-4**\n\n此外，请注意，由于 LINQ\
  \ 是 .NET 的一等成员，在你构建 LINQ 查询时，Visual Studio 能够提供卓越编码体验。在示例中，当你输入 `where` 子句时，Visual\
  \ Studio 为 `m`（`Movie` 对象）的可能参数提供了 IntelliSense 提示，如图 10-5 所示。\n\n![image](img/f384-01.jpg)\n\
  \n**图 10-5**\n\nLINQ 中的 `where` 子句的行为与 SQL 的 `where` 子句类似，允许你包含子查询和多个 `where` 子句，如列表\
  \ 10-12 所示。\n\n在此示例中，`where` 子句包含了两个参数，一个限制电影类型，另一个限制电影的运行时间。\n\n## 使用 LINQ 分组数据\n\
  \nLINQ 同样通过类 SQL 的 `group` 语法极大地简化了数据分组。为了展示 LINQ 如何让分组变得如此简单，你可以修改原始的列表 10-4 以使用\
  \ LINQ 查询。修改后的代码如列表 10-13 所示。\n\n此 LINQ 查询使用 `group` 关键字（VB.NET 中为 `Group By`）按类型对电影数据进行分组。此外，由于分组操作本身不会产生任何输出，该查询使用之前讨论的技术创建了自定义的查询投影。图\
