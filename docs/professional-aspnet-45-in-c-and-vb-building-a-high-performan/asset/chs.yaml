  \ `TreeView` 和 `Menu` 服务器控件\n*   利用 URL 映射\n*   本地化你的 `Web.sitemap` 文件并过滤站点导航内容的结果\n\
  \n## 本章 WX.COM 代码下载\n\n请注意，本章中的所有代码示例都可以通过书的网站 [`www.wrox.com`](http://www.wrox.com)\
  \ 的“Download Code”选项卡作为本章的代码下载获取。\n\n你开发的 Web 应用程序通常不止一个页面。通常，你会创建若干相互关联的 Web 页面。如果你也围绕你的页面集构建了导航，就能让最终用户以简单的方式顺利完成你的应用程序。\n\
  \n\n\n\n目前，你必须从多种方法中选择向最终用户暴露应用程序路径的方法。当你继续向整个应用程序添加页面时，网站导航这项艰巨的任务变得更加复杂。\n\n目前构建\
  \ Web 应用程序导航的方法是在页面中散布超链接。超链接通常通过包含文件或用户控件添加到 Web 页面。它们也可以直接硬编码到页面上，以便它们显示在所查看页面的页眉或侧边栏中。当你移动页面或更改页面名称时，处理导航的困难会加剧。有时，开发者被迫访问应用程序中的每一个页面，仅仅为了更改导航的某些方面。\n\
  \nASP.NET 4.5 通过提供一种导航系统解决了这个问题，该系统使得管理最终用户如何操作你创建的应用程序变得非常简单。ASP.NET 中的此项功能是复杂的；但很棒的地方在于，它可以根据你的需要保持简单，或者你实际上可以深入并控制其工作方式的每一个方面。\n\
  \n网站导航系统包含了在名为 `sitemap` 的 XML 文件中定义整个站点的能力。在定义了 sitemap 之后，你可以使用 `SiteMap` 类以程序化的方式对其进行操作。ASP.NET\
  \ 中提供的 sitemap 功能的另一个方面是数据提供程序，它专门开发用于与 sitemap 文件配合，并将其绑定到一系列基于导航的服务器控件。本章将介绍 ASP.NET\
  \ 4.5 导航系统中的所有这些组件。下一节将介绍 sitemaps。\n\n## 基于 XML 的 SITEMAPS\n\n虽然 sitemap 并不是必需的元素（正如你稍后看到的），但在使用\
  \ ASP.NET 4.5 导航系统时，你常见的第一个步骤之一是为你的应用程序构建 sitemap。sitemap 是你站点结构的 XML 描述。\n\n你使用此\
  \ sitemap 来定义应用程序中所有页面的导航结构以及它们之间的关系。如果你按照 ASP.NET sitemap 标准执行此操作，你就可以使用 `SiteMap`\
  \ 类或 `SiteMapDataSource` 控件与这些导航信息进行交互。通过使用 `SiteMapDataSource` 控件，你可以将 sitemap\
  \ 文件中的信息绑定到各种数据绑定控件，包括 ASP.NET 提供的导航服务器控件。\n\n要为你的应用程序创建一个 sitemap 文件，请向你的应用程序添加一个\
  \ sitemap 或 XML 文件。当被提问时，将 XML 文件命名为 `Web.sitemap`；如果你选择了 Sitemap 选项，该文件已存在。该文件名为\
  \ `Web`，扩展名为 `.sitemap`。查看此处 `.sitemap` 文件的示例，位于 Listing 17-1 中（本章代码下载中的 `Web.sitemap`）。\n\
  \n那么，这个文件能带给你什么呢？嗯，它提供了一个 ASP.NET 现在可以在其提供的其他导航系统中使用的逻辑结构。接下来，本章将检查此文件是如何构建的。\n\n\
  此 XML 文件的根节点是 `<siteMap>` 元素。文件中只能存在一个 `<siteMap>` 元素。在 `<siteMap>` 元素内有一个根 `<siteMapNode>`\
  \ 元素。这通常是应用程序的起始页。在 Listing 17-1 中的文件中，根 `<siteMapNode>` 指向 `Default.aspx` 页面，即首页：\n\
  \n```\n <siteMapNode title=\"Home\" description=\"Home Page\" url=\"Default.aspx\"\
  >\n```\n\nTable 17-1 描述了 `<siteMapNode>` 元素中最常见的属性。\n\n| ATTRIBUTE | DESCRIPTION\
  \ |\n| --- | --- |\n| `Title` | 提供链接的文本描述。此处使用的 `String` 值是用于链接的文本。 |\n| `Description`\
  \ | 不仅提醒你链接的用途，还被用于链接上的 `ToolTip` 属性。`ToolTip` 属性是当最终用户将光标悬停在链接上几秒钟时出现在链接旁边的黄色框。\
  \ |\n| `url` | 描述文件在解决方案中的位置。如果文件位于根目录，只需使用文件名，例如 `Default.aspx`。如果文件位于子文件夹中，请确保在该属性使用的\
  \ `String` 值中包含文件夹。例如，`MySubFolder/Markets.aspx`。 |\n\n**TABLE 17-1**\n\n安置第一个 `<siteMapNode>`\
  \ 后，你可以在根 `<siteMapNode>` 元素内嵌套所需的任意额外的 `<siteMapNode>` 元素。你还可以为结构中的任何父 `<siteMapNode>`\
  \ 创建子 `<siteMapNode>` 元素创建额外的链接级别。\n\nListing 17-1 中的示例为应用程序提供了以下导航结构：\n\n```\n\
  \ Home\n     News\n        U.S.\n        World\n        Technology\n        Sports\n\
  \     Finance\n        Quotes\n        Markets\n           U.S. Market Report\n\
  \           NYSE\n        Funds\n     Weather\n```\n\n你可以看到这种结构在某些地方向下延伸三层。使用此文件最简单的地方之一是使用\
  \ ASP.NET 自带的 `SiteMapPath` 服务器控件。ASP.NET 中的 `SiteMapPath` 服务器控件被设计为专门与 `.sitemap`\
  \ 文件配合工作。\n\n## SITEMAPPATH 服务器控件\n\n使用与 ASP.NET 自带的 `SiteMapPath` 服务器控件配合 `.sitemap`\
  \ 文件非常简单。ASP.NET 中的 `SiteMapPath` 服务器控件是专门设计为与 `.sitemap` 文件配合工作的。ASP.NET 中的 `SiteMapPath`\
  \ 服务器控件是专门设计为与 `.sitemap` 文件配合工作的。这种路径定义了最终用户在结构中的位置。可以在 Visual Studio 2012 中可以看到。。这种路径创建了所谓的\
  \ [`面包屑导航`](http://newegg.com) 网站，位于 Figure 17-1 中。\n\n![image](img/f624-01.jpg)\n\
  \n**FIGURE 17-1**\n\n这种导航的目的是向最终用户显示他们相对于站点其他部分的位置。传统上编写这种导航是非常困难的；但使用 `SiteMapPath`\
  \ 控件，你会发现编写这种导航轻而易举。作为一个示例，你将在本章中看到虚拟网站的站点结构。\n\n你应该首先创建一个在 Listing 17-1 中创建了 `Web.sitemap`\
  \ 文件的应用程序。从那里创建一个名为 `Markets.aspx` 的 Web Form。该文件在 `Web.sitemap` 文件中定义为应用程序的最底层。\n\
  \n`SiteMapPath` 控件非常易用，甚至不需要数据源控件即可连接到 `sitemap` 文件。你只需要将 `SiteMapPath` 控件拖放到你的\
  \ `Markets.aspx` 页面上。最后，你将会得到一个与 Listing 17-2 所示类似的页面。\n\n没什么大不了，对吧？真的那么简单。运行此页面，你将在\
  \ Figure 17-2 中看到结果。\n\n![image](img/f625-01.jpg)\n\n**FIGURE 17-2**\n\n此截图显示你正在位于\
  \ `Markets.aspx` 的 U.S. Market Report 页面。作为最终用户，你可以看到此页面是站点 Markets 部分的一部分；反之，Markets\
  \ 是站点 Finance 部分的一部分。通过面包屑导航，了解站点结构及其所在位置的用户可以快速选择链接以导航到站点中的任何位置。\n\n\n\n\nFIGURE\
  \ 17-3\n\n此提示框显示为 `The Latest Financial Information`，来自 `Web.sitemap` 文件中 `<siteMapNode>`\
  \ 元素的 `description` 属性。\n\n```xml\n <siteMapNode title=\"Finance\" description=\"\
  The Latest Financial Information\"\n   url=\"Finance.aspx\">\n```\n\n`SiteMapPath`\
  \ 控件会自动工作，不需要你花费大量精力。你只需要将基本控件添加到页面中，该控件就会创建你刚刚看到的面包屑导航。然而，你可以使用后续章节中讨论的属性来修改控件的外观和行为。\n\
  \n### PathSeparator 属性\n\n`SiteMapPath` 控件的一个重要样式属性是 `PathSeparator` 属性。默认情况下，`SiteMapPath`\
  \ 控件使用大于号（>`）来分隔链接元素。你可以通过为 `PathSeparator` 属性重新分配新值来更改它。Listing 17-3 展示了该属性的使用。\n\
  \n示例中的 `SiteMapPath` 控件使用了管道符（`|`），该字符位于 Enter 键上方。渲染时，你将得到如 Figure 17-4 所示的结果。\n\
  \n![image](img/f626-01.jpg)\n\nFIGURE 17-4\n\n如你所示，你可以使用 `SiteMapPath` 控件内的 `PathSeparator`\
  \ 属性或 `<PathSeparatorTemplate>` 元素。\n\n使用 `PathSeparator` 属性或 `<PathSeparatorTemplate>`\
  \ 元素来指定分隔面包屑导航中链接的方法简单，但你可能也想给这个管道符添加一些视觉样式。你可以为你的 `SiteMapPath` 控件添加 `<PathSeparatorStyle>`\
  \ 节点。Listing 17-4 显示了这方面的示例。\n\n好了，它可能并不美观，但通过结合 `SiteMapPath` 控件使用 `<PathSeparatorStyle>`\
  \ 元素，你可以更改分隔元素的视觉外观。Figure 17-5 显示了结果。\n\n![image](img/f626-02.jpg)\n\nFIGURE 17-5\n\
  \n通过这些构造，你还可以添加图像作为分隔符，如 Listing 17-5 所示。\n\n要使用图像作为链接之间的分隔符，你需要使用 `<PathSeparatorTemplate>`\
  \ 并在并在放置一个 `Image` 控件。事实上，你可以在 `SiteMapPath` 控件生成的导航链接之间放置任何类型的控件。\n\n### PathDirection\
  \ 属性\n\n另一个用于 `SiteMapPath` 控件的有趣属性是 `PathDirection`。该属性更改输出中生成的链接方向。此属性只有两种设置：`RootToCurrent`\
  \ 和 `CurrentToRoot`。\n\nRoot 链接是显示中的第一个链接，通常是首页。Current 链接是当前显示页面的链接。默认情况下，此属性被设置为\
  \ `RootToCurrent`。将示例更改为 `CurrentToRoot` 会产生如 Figure 17-6 所示的结果。\n\n![image](img/f627-01.jpg)\n\
  \nFIGURE 17-6\n\n### ParentLevelsDisplayed 属性\n\n在某些情况下，你的导航可能会非常深。从 Listing 17-1\
  \ 所示的站点地图可以看出，你深达了三页，这并不是什么问题。然而，你们中的一些人可能正在处理深度多得多的站点。在这种情况下，使用 `SiteMapPath` 控件可能有点笨。这样做会显示巨大的页面列表。\n\
  \n在这种情况下，你可以转向 `SiteMapPath` 控件的 `ParentLevelsDisplayed` 属性。设置后，该属性仅显示指定深页面。因此，如果你像\
  \ Listing 17-1 所示配合 `Web.sitemap` 使用控件，并给 `ParentLevelsDisplayed` 属性赋值为 `3`，你不会发现页面有任何变化。因为它已经显示了三页深的路径。但如果你将此值更改为\
  \ `2`，`SiteMapPath` 控件的构造如下：\n\n```xml\n <asp:SiteMapPath ID=\"Sitemappath1\" runat=\"\
  server\" ParentLevelsDisplayed=\"2\">\n  </asp:SiteMapPath>\n```\n\n注意 Figure 17-7\
  \ 中此更改的结果。`SiteMapPath` 控件仅显示两页深的链接，并且不显示首页链接。\n\n![image](img/f628-01.jpg)\n\n\
  FIGURE 17-7\n\n默认情况下，对显示的链接数量没有限制，因此 `SiteMapPath` 控件根据情况生成指定数量的链接。\n\n### ShowToolTips\
  \ 属性\n\n默认情况下，如果站点地图文件中使用了描述，`SiteMapPath` 控件会为每个链接生成提示。记住，提示是当用户鼠标悬停在链接上时出现在屏幕上的文本。\n\
  \n在某些情况下，你不希望 `SiteMapPath` 控件显示任何提示。对于这些情况，你有两种方法关闭此功能。第一种是省略站点地图文件中的描述。另一种关闭提示的方法是将\
  \ `ShowToolTips` 属性设置为 `False`，如下所示：\n\n```xml\n <asp:SiteMapPath ID=\"Sitemappath1\"\
  \ runat=\"server\" ShowToolTips=\"false\">\n  </asp:SiteMapPath>\n```\n\n此代码关闭了提示功能，但仍允许你在站点地图中使用描述属性。当你处理成百上千个链接时，此功能非常有优势。\n\
  \n### SiteMapPath 控件的子元素\n\n你已经看到了 `SiteMapPath` 控件子元素 `<PathSeparatorStyle>` 和\
  \ `<PathSeparatorTemplate>`，但存在其他的子元素。Table 17-2 涵盖了所有可用的子元素。\n\n| **子元素** | **描述**\
  \ |\n| --- | --- |\n| `CurrentNodeStyle` | 应用于 SiteMapPath 导航中当前页面链接的样式。 |\n| `CurrentNodeTemplate`\
  \ | 应用于 SiteMapPath 导航中当前页面链接的模板构造。 |\n| `NodeStyle` | 应用于 SiteMapPath 导航中所有链接的样式。`CurrentNodeStyle`\
  \ 或 `RootNodeStyle` 元素中的设置优于这里的设置。 |\n| `NodeTemplate` | 应用于 SiteMapPath 导航中所有链接的模板构造。`CurrentNodeTemplate`\
  \ 或 `RootNodeTemplate` 元素中的设置优于这里的设置。 |\n| `PathSeparatorStyle` | 应用于 SiteMapPath\
  \ 导航中链接分隔符的样式。 |\n| `PathSeparatorTemplate` | 应用于 SiteMapPath 导航中链接分隔符的模板构造。 |\n\
  | `RootNodeStyle` | 应用于 SiteMapPath 导航中第一个链接（根链接）的样式。 |\n| `RootNodeTemplate` |\
  \ 应用于 SiteMapPath 导航中第一个链接的模板构造。 |\n\nTABLE 17-2\n\n## TREEVIEW 服务器控件\n\n\n\n\n\n\
  `TreeView` 服务器控件是一个用于渲染分级数据的丰富服务器控件，因此它非常适合显示你的 `.sitemap` 文件中的内容。图 17-8 向你展示了它如何显示你在本章中此为止一直在操作的站点地图内容（再次自代码列表\
  \ 17-1）。该图首先在屏幕顶部显示了一个完全折叠的 `TreeView` 控件；第二个 `TreeView` 控件已完全展开。\n\n![image](img/f629-01.jpg)\n\
  \n**图 17-8**\n\n该控件可以根据控件的可展开和折叠框架，在节点被选择时动态加载要显示的节点。如果控件能够渲染 `TreeView` 输出的同时伴随一些客户端脚本，那么当有人展开控件中的某一个节点时，控件可以回调服务器以获取所选项的子节点。如果你的网站导航系统很大，这个功能就是理想的。在这种情况下，动态加载\
  \ `TreeView` 控件的节点将极大地提高性能。这种回传（postback）能力的伟大特性之一是在是在后台完成的，不需要完全刷新 ASP.NET 页面。当然，这种能力只有在浏览器接受与\
  \ `TreeView` 控件一起的客户端代码时才存在。如果浏览器不接受，控件知道这一点并只渲染适当的内容（提取整个 `TreeView` 控件所需的所有信息）。它只对能够处理此客户端脚本的客户端执行这些基于\
  \ JavaScript 回传。\n\n如果你在一个由某种 HTTP 嗅探器监控流量的页面上运行 `TreeView` 控件，你完全可以看到这种场景的运行情况。\n\
