  \ 内置的每个可用提供程序。\n\n### 配置您的提供程序与 Microsoft SQL Server 2005、2008 或 2012 配合\n\n许多提供程序可以与\
  \ SQL Server 工作。例如，成员资格、角色管理、个性化和其他系统默认就可以与 SQL Server 工作。然而，所有这些系统默认与 LocalDB 工作，而不是\
  \ SQL Server 的完整版本（如 SQL Server 2005、SQL Server 2008 或 SQL Server 2012）。\n\n要与这些数据库中的任何一个工作，你必须使用\
  \ `aspnet_regsql.exe` 工具设置数据库。使用 `aspnet_regsql.exe` 会创建提供程序所需的表、角色、存储过程和其他项目。要获取此工具，通过选择开始\
