  \ 的统计（截至 2013 年 1 月），在使用了知名 JavaScript 库的 1,000,000 个顶级网站中，超过 40% 选择了 `jQuery`。因此，微软也拥抱\
  \ `jQuery` 并不意外。\n\n此前，微软致力于自己的 JavaScript 项目：Microsoft Ajax Library。它仍然是 ASP.NET\
