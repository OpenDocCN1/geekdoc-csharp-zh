  \ `Visual Studio 2012` 如何方便地处理项目中的类工作。\n\n# 第二部分：控件\n\n* 第 4 章：**ASP.NET 服务器控件和客户端脚本**\n\
  * 第 5 章：**ASP.NET Web 服务器控件**\n* 第 6 章：**验证服务器控件**\n* 第 7 章：**用户和服务器控件**\n\n# 4.\
  \ ASP.NET 服务器控件和客户端脚本\n\n## 本章内容概览\n\n* 使用服务器控件构建 ASP.NET 页面\n* 使用 HTML 服务器控件\n\
  * 识别服务器控件\n* 使用 JavaScript 修改服务器控件\n\n## 本章的 WROX.COM 代码下载\n\n请注意，本章中的所有代码示例均作为本章代码下载的一部分，可以在书籍官方网站的\
  \ [`www.wrox.com`](http://www.wrox.com) 的“Download Code”（下载代码）选项卡中找到。\n\n正如上一节所讨论，`ASP.NET`\
  \ 演变自微软早期的名为 Active Server Pages（当时称为 `ASP`，现在称为经典 `ASP`）的 Web 技术。这种模型与当今的 `ASP.NET`\
  \ 完全不同。经典 `ASP` 使用解释型语言在将结果发送到浏览器之前完成最终 HTML 文档的构建。而 `ASP.NET` 使用真正的编译型语言来完成相同的任务。在编译环境中基于对象构建\
  \ Web 页面的想法是本章的主要重点之一。\n\n本章将介绍如何使用 `ASP.NET` 页面中一种特殊的对象——`服务器控件`，以及你如何通过使用这种控件来获益。本章介绍了一种特殊的服务器控件——`HTML\
  \ 服务器控件`。然后，将演示如何在 `ASP.NET` 页面中使用 `JavaScript` 来修改服务器控件的行为。\n\n本章的其余部分将向你展示如何通过视觉和编程的方式使用及操作服务器控件，以帮助创建\
  \ `ASP.NET` 页面。\n\n## ASP.NET 服务器控件\n\n过去，使用经典 `ASP` 的困难之一在于，根据你编写的服务器端代码，你负责浏览器的整个\
  \ HTML 输出。虽然这看起来很理想，但它产生了一个问题，因为每个浏览器解释得到的 HTML 的方式略有不同。\n\n当时两个主要的浏览器是微软的 `Internet\
  \ Explorer` 和 `Netscape Navigator`。这意味着开发者不仅要意识到输出 HTML 的浏览器类型，还必须考虑这些特定浏览器的哪些版本可能向应用程序发送请求。一些开发者通过创建两个独立的应用程序来解决这个问题。当最终用户向应用程序发送初始请求时，代码会进行浏览器检查，查看是哪种浏览器类型发送的请求。然后，`ASP`\
  \ 页面会将请求重定向到 `IE` 用户的路径或 `Netscape` 用户的另一条路径。\n\n由于请求来自同一浏览器的许多版本，开发者通常会为可能访问该网站的最低版本进行设计。从本质上，使用最低公约数作为目标会让每个人都失去利益。这种技术确保了页面在大多数发送请求的浏览器中都能正确渲染，但也迫使开发者降低应用程序的档级。如果应用程序总是为最低公约数构建，那么开发者就永远无法利用新版本浏览器提供的某些更高级的功能。\n\
  \n`ASP.NET` 服务器控件克服了这些障碍。使用 `ASP.NET` 提供的服务器控件时，你并不是在服务器端代码中指定要输出的 HTML。相反，你指定你希望在浏览器中看到的功能，并让\
  \ `ASP.NET` 决定发送到浏览器的输出。\n\n当请求进来时，`ASP.NET` 会检查请求以查看是哪种浏览器类型发送的请求以及浏览器版本，然后产生特定于该器的\
  \ HTML 输出。这一过程通过处理从 `HTTP` 请求中获取的 `User Agent`（用户代理）头来嗅探浏览器来实现。这意味着你现在可以为最好的浏览器进行构建，而无需担心功能在向你的应用程序请求的浏览器中是否有效。由于前述的功能，你经常会听到这些控件被称为`智能控件`。\n\
  \n### 服务器控件的类型\n\n`ASP.NET` 提供了两种类型不同的服务器控件——`HTML 服务器控件`和`Web 服务器控件`。每种控件都非常不同，当你与\
  \ `ASP.NET` 工作时，你会发现大部分重点在 Web 服务器控件上。这并不意味着 `HTML 服务器控件`没有价值。它们为你提供了许多功能——其中某些是\
  \ Web 服务器控件无法提供的功能。\n\n你可能会问自己哪种控件类型更好。答案是这取决于你想实现什么。`HTML 服务器控件`映射到特定的 HTML 元素。你可以在\
  \ `ASP.NET` 页面上放置一个 `HtmlTable` 服务器控件，它可以动态地与 `<table>` 元素工作。另一方面，`Web 服务器控件`映射到你希望\
  \ `ASP.NET` 页面上的特定功能。这意味着 `<asp:Panel>` 控件可能会使用 `<table>` 或元素——这取决于取决于请求的浏览器的能力。\n\
  \n表 4-1 提供了关于何时使用 HTML 服务器控件以及何时使用 Web 服务器控件的总结信息。\n\n| 控件类型 | 何时使用此控件类型 |\n| ---\
  \ | --- |\n| HTML 服务器控件 | 将 ASP 3.0 Web 页面转换为 ASP.NET 页面并考虑完成速度时。将 HTML 元素更改为 HTML\
  \ 服务器控件比改为 Web 服务器控件容易得多。当你倾向于 HTML 类型的编程模型时。当你想要显式控制为浏览器生成的代码时。使用 ASP.NET MVC（在第\
  \ 34 章 中介绍）可能是更好的答案。 |\n| Web 服务器控件 | 需要更丰富的功能来执行复杂的页面需求时。当你开发适用于多种浏览器类型的 Web 页面，并且根据这些类型需要不同的代码时。当你倾向于基于控件和控件属性的\
  \ Visual Basic 类型模型时。 |\n\n当然，某些开发者喜欢将某些控件与其他控件分离，并将它们放在自己的类别中。例如，你可能会引用以下类型的控件：\n\
  \n* **列表控件：** 这些控件类型允许数据绑定到它们以用于某种形式的显示。\n* **丰富控件：** 控件（例如日历控件）比其他控件显示更丰富的内容和功能。\n\
  \n\n\n- **验证控件（Validation controls）**：与其他表单控件交互以验证其包含数据的控件。\n- **用户控件（User controls）**：这些并不是真正的控件，而是你可以像处理\
  \ ASP.NET 页面上的服务器控件一样处理它们的页面模板。\n- **自定义控件（Custom controls）**：由你自己构建并以与提供的 ASP.NET\
  \ 4.5 默认安装 ASP.NET 服务器控件相同的方式使用的控件。\n\n当你在 HTML 服务器控件和 Web 服务器控件之间做出选择时，请记住，对于使用哪种类型并没有硬性规定。你可能会发现自己对某一种类型的控件的使用频率高于另一种，但某些功能在一种类型中可用，而在另一种中可能不可用。如果你正在尝试完成特定任务，但在使用的控件类型中没有看到解决方案，请查看另一种控件类型，因为它很可能包含答案。此外，请注意，你可以混合使用这些控件类型。在同一个页面或同一个应用程序中同时使用\
  \ HTML 服务器控件和 Web 服务器控件没有任何障碍。\n\n### 使用服务器控件构建程序\n\n你有几种方法可以使用服务器控件来构建你的 ASP.NET\
  \ 页面。你实际上可以使用专门为配合 ASP.NET 4.5 设计的工具，这些工具允许你将控件视觉化拖放到设计表面上并操纵控件的行为。你也可以通过代码输入直接处理服务器控件。\n\
  \n#### 在设计表面上处理服务器控件\n\nVisual Studio 2012 允许你通过将视觉控件拖放到设计表面上来视觉化地创建 ASP.NET 页面。在查看\
  \ ASP.NET 页面时，点击 IDE 底部的“设计（Design）”选项卡即可进入此视觉设计选项。你还可以在同一个文档窗口中同时显示“设计”视图和“源代码（Source\
  \ Code）”视图。此功能是在 Visual Studio 2008 中引入的。当存在设计视图时，你可以将光标放在页面上你希望控件出现的位置，然后在 Visual\
  \ Studio 的工具箱窗口双击你需要的控件。\n\n在页面的设计视图中，你可以突出显示一个控件，该控件的属性就会出现在“属性（Properties）”窗口中。例如，图\
  \ 4-1 显示在设计面板中选择了一个 `Button` 控件，其属性显示在右角的属性窗口中。\n\n![image](img/f106-01.jpg)\n\n\
  **图 4-1**\n\n更改窗口中的属性会更改突出显示的控件的外观或行为。由于所有控件都继承自特定的基类（`WebControl`），你也可以同时突出显示多个控件并一次更改所有控件的基属性。你通过在选择控件时按住\
  \ `Ctrl` 键来实现。\n\n### 编写服务器控件\n\n你也可以直接从代码页面工作。由于许多开发者偏于这种方式，因此它是首次创建 ASP.NET 页面时的默认设置。手动编写自己的\
  \ ASP.NET 页面似乎比将控件拖放到设计表面上要慢，但并没有你想象的那么慢。在编写应用程序时，你可以从 Visual Studio 2012 大量的帮助。当你开始在\
  \ Visual Studio 中输入时，IntelliSense 功能就会启动并帮助你自动补全代码。例如，图 4-2 显示了输入代码时出现的 IntelliSense\
  \ 可选代码补全语句下拉列表。\n\n![image](img/f107-01.jpg)\n\n**图 4-2**\n\nIntelliSense 的重点在于你正在处理的控件或代码段中最常用的属性或语句。在工作时有效使用\
  \ IntelliSense 是以极快速度编写代码的好方法。\n\n与设计视图一样，页面的源代码视图允许你将控件从工具箱拖放到代码页面本身。例如，将 `TextBox`\
  \ 控件拖放到代码页面产生的结果与将其拖放到设计页面上产生的结果相同：\n\n```\n<asp:TextBox ID=\"TextBox1\" runat=\"\
  server\"></asp:TextBox>\n```\n\n你还可以在源代码视图中突出显示一个控件，或将光标置在控件的代码语句中，“属性”窗口将显示控件的属性。现在，你可以直接在\
  \ Visual Studio 的属性窗口中应用属性，这些属性会动态地添加到控件的控件代码中。\n\n### 处理服务器控件事件\n\nASP.NET 使用事件驱动模型。只有在发生特定事件时，才会启动项目或编码任务。ASP.NET\
  \ 编程模型中的常见事件是 `Page_Load`，它在列表 4-1 中所示。\n\n#### 列表 4-1: 处理特定的页面事件\n\nVB\n```vb\n\
  Protected Sub Page_Load(sender As Object, e As EventArgs)\n       '在此处插入代码\n   End\
  \ Sub\n```\n\nC#\n```csharp\nprotected void Page_Load(Object sender, EventArgs e)\n\
  \   {\n       // 在此处插入代码\n   }\n```\n\n你不仅可以通过页面事件处理整个页面——以及它在特定时刻的属性和方法——还可以通过特定的控件事件处理页面包含的服务器控件。例如，表单上按钮的一个常见事件是\
  \ `Button_Click`，它在列表 4-2 中所示。\n\n#### 列表 4-2: 处理按钮事件\n\nVB\n```vb\nProtected Sub\
  \ Button1_Click(sender As Object, e As EventArgs)\n       '在此处插入代码\n   End Sub\n\
  ```\n\nC#\n```csharp\nprotected void Button1_Click(object sender, EventArgs e)\n\
  \   {\n       // 在此处插入代码\n   }\n```\n\n列表 4-2 所示的事件仅在最终用户点击按钮时才会触发。因此，事件处理程序不仅存在服务器端代码中，还通过\
  \ ASP.NET 页面中服务器控件的 `OnClick` 属性进行连接，如下：\n\n```\n<asp:Button ID=\"Button1\" runat=\"\
  server\" Text=\"Button\" OnClick=\"Button1_Click\" />\n```\n\n如何处理这些事件？你有几种方法。一种方法是在设计视图中打开\
  \ ASP.NET 页面并双击你想创建服务器端事件的控件。例如，在设计视图中双击 `Button` 服务器控件会在你的服务器端代码中创建 `Button1_Click`\
  \ 事件结构，无论代码是在后置文件中还是内联。\n\n尽管如此，请注意 `Button` 控件还有许多额外事件无法通过双击控件获得。要访问这些事件，从 IDE\
  \ 的任何视图，在属性对话框中选择控件。然后你会找到一个闪电图标，它提供了控件的所有事件列表。在这里，你可以双击你感兴趣的事件，Visual Studio 就会创建所需的函数存根。图\
  \ 4-3 显示了事件列表。你可能（例如）想处理 `Button` 控件的 `PreRender` 事件而不是它的 `Click` 事件。你选择的事件的处理程序将被放置在你的服务器端代码中。\n\
  \n一旦有了事件结构，你就可以编写在事件触发时执行的特定操作。\n\n### 为服务器控件应用样式\n\n\n\n\n\n通常情况下，你希望将默认样式（基本上没有样式）更改为应用程序中实现的服务器控件。你很可能希望构建\
  \ Web 应用程序，以便它们反映出你自己的外观和感受。自定义页面中控件外观的一种方法是更改控件的属性。\n\n正如本章前面提到的，要获取特定控件的属性，你需要在\
  \ Visual Studio 的页面设计视图（Design view）中选中该控件。如果你在源代码视图（Source view）下工作，请将光标置在控件的代码中。属性（Properties）窗口中显示的属性允许你控制所选控件的外观和行为。\n\
  \n## 检查控件的常用属性\n\nASP.NET 4.5 提供的许多默认服务器控件都派自 `WebControl` 类，并共享相似的属性，允许你更改它们的外观和行为。并不是所有派生控件都使用所有可用属性（尽管许多属性已经实现）。另一个重要点是，并不是所有的服务器控件都是派自\
  \ `WebControl` 类的。例如，`Literal`、`PlaceHolder`、`Repeater` 和 `XML` 服务器控件并不派自 `WebControl`\
  \ 基类，而是派自 `Control` 类。\n\nHTML 服务器控件也不派自 `WebControl` 基类，因为它们更关注特定 HTML 元素的属性集。表\
  \ 4-2 列出了服务器控件共享的常用属性。\n\n| 属性名称 | 描述 |\n| --- | --- |\n| `AccessKey` | 允许你分配一个字符与\
  \ Alt 键关联，以便最终用户可以使用键盘上的快捷键激活控件。例如，你可以为 `Button` 控件分配一个属性值为 `K` 的 `AccessKey`。现在，最终用户无需点击\
  \ ASP.NET 页面上的按钮（使用鼠标控制的指针），只需按 Alt+K 即可。 |\n| `Attributes` | 允许你为 Web 服务器控件定义额外的属性，这些属性未通过公共属性定义。\
  \ |\n| `BackColor` | 控制在 ASP.NET 页面上控件布局背景处显示的颜色。 |\n| `BorderColor` | 分配显示在服务器控件物理边缘的颜色。\
  \ |\n| `BorderWidth` | 为构成控件边界的线宽分配值。将数字作为值则会将该数字分配为边界的像素宽度。如果在设置 `BorderWidth`\
  \ 属性时没有配合使用 `BorderColor` 属性，则默认边界颜色为黑色。 |\n| `BorderStyle` | 允许你分配放置在服务器控件周围的边界设计。默认情况下，边界创建为直线，但你的边界可以使用多种不同的样式。`BorderStyle`\
  \ 属性的其他可能值包括 `Dotted, Dashed, Solid, Double, Groove, Ridge, Inset, None, NotSet`\
  \ 和 `Outset`。 |\n| `ClientIDMode` | 允许你获取或设置用于创建 `ClientID` 属性值的算法。 |\n| `CssClass`\
  \ | 为控件分配自定义的 CSS（级联样式表）类。 |\n| `Enabled` | 允许通过将此属性的值设置为 `False` 来关闭控件的功能。默认情况下，`Enabled`\
  \ 属性设置为 `True`。 |\n| `EnableTheming` | 允许你为选定的服务器控件开启主题化功能。默认值为 `True`。 |\n| `EnableViewState`\
  \ | 允许你指定是否应为该控件持久化视图状态。 |\n| `Font` | 设置控件中任何地方出现的所有文本的字体。 |\n| `ForeColor` | 设置控件中任何地方出现的所有文本的颜色。\
  \ |\n| `Height` | 设置控件的高度。 |\n| `SkinID` | 设置在对控件进行主题时使用的皮肤。 |\n| `Style` | 允许你对控件应用\
  \ CSS 样式。 |\n| `TabIndex` | 设置控件在 ASP.NET 页面中的制表位置。此属性与页面上的其他控件配合工作。 |\n| `ToolTip`\
  \ | 分配当鼠标指针悬停在控件上短段时间时，在浏览器黄色框中显示的文本。这可以用于为最终用户添加更多指令。 |\n| `Width` | 设置控件的宽度。 |\n\
  \n**表 4-2**\n\n你可以在处理的许多服务器控件中看到这些常用属性。这里显示的 `WebControl` 类的某些属性直接与 ASP.NET 内置的主题系统配合，例如\
  \ `EnableTheming` 和 `SkinID` 属性。你还会看到针对你正在查看的控件的特定属性。学习上表中的属性使你能够快速处理 Web 服务器控件，并根据你的需求对其进行修改。\n\
  \n## ASP.NET 4.5 中的 CSS 渲染\n\n在 ASP.NET 3.5 及更早版本中，你使用的 ASP.NET 服务器控件渲染的 HTML 并不总是符合最新的\
  \ HTML 标准的。例如，在 ASP.NET 3.5 中，你可以将服务器控件的 `Enabled` 属性设置为 `False`。这会在页面上渲染控件，但带有\
  \ `disabled` 属性，如下所示：\n\n```\n<span id=\"Label1\" disabled=\"disabled\">Hello there!</span>\n\
  ```\n\n这不是合法的 HTML，因为 `span` 元素没有 `disabled` 属性。\n\n在 ASP.NET 4 和 ASP.NET 4.5 中，`web.config`\
  \ 文件中的 `<pages>` 元素指示 ASP.NET 在渲染控件时使用什么种版本的样式。默认值为 `4.0`，如下代码所示：\n\n```\n<pages\
  \ controlRenderingCompatibilityVersion=\"4.0\" />\n```\n\n如果此值设置为 `4.0`，ASP.NET\
  \ 将按所示使用 CSS 正确地禁用控件：\n\n```\n<span id=\"Label1\" class=\"aspNetDisabled\">Hello\
  \ there!</span>\n```\n\n如你所见，ASP.NET 设置的是 `class` 属性而不是 `disabled` 属性。要回到旧的控件渲染方式，可以将\
  \ `controlRenderingCompatibilityVersion` 的值设置为 `3.5`。\n\n## HTML 服务器控件\n\nASP.NET\
  \ 允许你获取 HTML 元素，并在你付出较少工作的情况下，将其转换为服务器端控件。之后，你可以使用它们来控制 ASP.NET 页面中实现的元素的行为和操作。\n\
  \n当然，你可以在页面中放置任何想要的 HTML 元素，并可以选择将该 HTML 作为服务器端控件。你还可以在 Visual Studio 的工具箱（Toolbox）中找到\
  \ HTML 元素列表（见图 4-4）。\n\n![image](img/f111-01.jpg)\n\n**图 4-4**\n\n从工具箱将这些 HTML 元素拖拖到\
  \ ASP.NET 页面的设计视图或源代码视图，只会产生相应的 HTML 元素。例如，在你的页面上放置 HTML Button 控件会在你的代码中产生如下结果：\n\
  \n```\n<input id=\"Button1\" type=\"button\" value=\"button\" />\n```\n\n在这种状态下，Button\
  \ 控件不是服务器端控件。它仅仅是一个 HTML 元素，不再是别的。你可以轻松地将其转换为 HTML 服务器控件。在源代码视图中，通过向控件添加 `runat=\"\
  server\"` 来更改 HTML 元素：\n\n```\n<input id=\"Button1\" type=\"button\" value=\"button\"\
  \ runat=\"server\" />\n```\n\n元素转换为服务器控件后（通过添加 `runat=\"server\"` 属性和值），你就可以像处理任何\
  \ Web 服务器控件一样，在服务器端处理选定的元素了。列表 4-3 显示了 HTML 服务器控件的示例。\n\n***VB***\n\n\n\n\n\n```asp\n\
  <%@ Page Language=\"VB\" %>\n   <!DOCTYPE html>\n   <script runat=\"server\">\n\
  \       Protected Sub Button1_ServerClick(sender As Object, e As EventArgs)\n  \
  \         Response.Write(«Hello « & Text1.Value)\n       End Sub\n   </script>\n\
  \   <html xmlns=\"http://www.w3.org/1999/xhtml\">\n   <head runat=\"server\">\n\
  \       <title>Using HTML Server Controls</title>\n   </head>\n   <body>\n     \
  \  <form id=\"form1\" runat=\"server\">\n       <div><div>\n           What is your\
  \ name?<br />\n           <input id=\"Text1\" type=\"text\" runat=\"server\" />\n\
  \           <input id=\"Button1\" type=\"button\" value=\"Submit\" runat=\"server\"\
  \n               onserverclick=\"Button1_ServerClick\" />\n       </div>\n     \
  \  </form>\n   </body>\n   </html>\n```\n\n# C#\n\n```asp\n<%@ Page Language=\"\
  C#\" %>\n      <!DOCTYPE html>\n      <script runat=\"server\">\n          protected\
  \ void Button1_ServerClick(object sender, EventArgs e)\n          {\n          \
  \    Response.Write(\"Hello \" + Text1.Value);\n          }\n      </script>\n```\n\
  \n在此示例中，你可以看到页面上有两个 HTML 服务器控件。它们都是典型的 HTML 元素，添加了额外的 `runat=\"server\"` 属性。如果你正在将\
  \ HTML 元素作为服务器控件使用，必须包含一个 `id` 属性，以便在服务器端代码中识别该服务器控件。\n\n`Button` 控件通过 `OnServerClick`\
  \ 属性引用了服务器端事件。该属性指向当最终用户点击按钮时执行的服务器端事件处理代码——在本例中，为 `Button1_ServerClick`。在 `Button1_ServerClick`\
  \ 方法中，使用 `Value` 属性输出文本框中放置的值。\n\n## 查看 HtmlControl 基类\n\n所有的 HTML 服务器控件都使用派生自 `HtmlControl`\
  \ 基类的类（全限定名称为 `System.Web.UI.HtmlControls.HtmlControl`）。这些类暴露了来自控件派生类中的许多属性。表 4-3\
  \ 详细列出了从此基类可用的一些属性。其中某些项目本身是派生自基类 `Control` 类的。\n\n| 方法或属性 | 描述 |\n| --- | --- |\n\
  | `Attributes` | 提供控件中指定的所有可用属性的键值对集合，包括自定义属性。 |\n| `Disabled` | 允许你使用布尔值获取或设置控件是否被禁用。\
  \ |\n| `EnableTheming` | 允许你使用布尔值获取或设置控件是否参与页面主题化功能。 |\n| `EnableViewState` | 允许你获取或设置布尔值，指示控件是否参与页面的视图状态功能。\
  \ |\n| `ID` | 允许你获取或设置控件的唯一标识符。 |\n| `Page` | 允许你获取对包含指定服务器控件的 `Page` 对象的引用。 |\n\
  | `Parent` | 获取页面控件层次结构中父控件的引用。 |\n| `Site` | 提供有关服务器控件所属容器的信息。 |\n| `SkinID` |\
  \ 当 `EnableTheming` 属性设置为 `True` 时，`SkinID` 属性指定了在设置主题时应使用的命名皮肤。 |\n| `Style` |\
  \ 引用应用于指定控件的 CSS 样式集合。 |\n| `TagName` | 提供从指定控件生成的元素名称。 |\n| `Visible` | 指定控件是否在生成的页面上可见（渲染）。\
  \ |\n\n**表 4-3**\n\n## 查看 HtmlContainerControl 类\n\n`HtmlControl` 基类用于那些关注于可以包含在单个节点内的\
  \ HTML 元素的 HTML 类。例如，`<img>`、`<input>` 和 `<link>` 元素通过派生自 `HtmlControl` 的类工作。\n\n\
  其他 HTML 元素，如 `<a>`、`<form>` 和 `<select>`，需要成对的开启标签。这些元素使用派生自 `HtmlContainerControl`\
  \ 的类，该类专门为需要闭合标签的 HTML 元素而设计。\n\n由于 `HtmlContainerControl` 类派生自 `HtmlControl` 类，因此你可以使用\
  \ `HtmlControl` 类的所有属性和方法，还可以使用在 `HtmlContainerControl` 类本身中声明的一些新项目。其中最重要的两个是 `InnerText`\
  \ 和 `InnerHtml` 属性：\n\n*   `InnerHtml` — 允许你指定包含 HTML 元素的内容，并将其放在指定控件的开启和闭合标签之间\n\
  *   `InnerText` — 允许你指定原始文本，并将其放在指定控件的开启和闭合标签之间\n\n## 查看所有的 HTML 类\n\n处理每一个 HTML\
  \ 元素是完全可能的，因为每个元素都有对应的类。表 4-4 包含了渲染 HTML 的服务器控件类的部分列表。\n\n| 类 | 渲染的 HTML 元素 |\n\
  | --- | --- |\n| `HtmlAnchor` | `<a>` |\n| `HtmlArea` | `<area>` |\n| `HtmlAudio`\
  \ | `<audio>` |\n| `HtmlButton` | `<button>` |\n| `HtmlForm` | `<form>` |\n| `HtmlHead`\
  \ | `<head>` |\n| `HtmlIframe` | `<iframe>` |\n| `HtmlImage` | `<img>` |\n| `HtmlInputButton`\
  \ | `<input type=\"button\">` |\n| `HtmlInputCheckBox` | `<input type=\"checkbox\"\
  >` |\n| `HtmlInputFile` | `<input type=\"file\">` |\n| `HtmlInputHidden` | `<input\
  \ type=\"hidden\">` |\n| `HtmlInputImage` | `<input type=\"image\">` |\n| `HtmlInputPassword`\
  \ | `<input type=\"password\">` |\n| `HtmlInputRadioButton` | `<input type=\"radio\"\
  >` |\n| `HtmlInputReset` | `<input type=\"reset\">` |\n| `HtmlInputSubmit` | `<input\
  \ type=\"submit\">` |\n| `HtmlInputText` | `<input type=\"text\">` |\n| `HtmlLink`\
  \ | `<link>` |\n| `HtmlMeta` | `<meta>` |\n| `HtmlSelect` | `<select>` |\n| `HtmlSource`\
  \ | `<source>` |\n| `HtmlTable` | `<table>` |\n| `HtmlTableCell` | `<td>` |\n| `HtmlTableRow`\
  \ | `<tr>` |\n| `HtmlTextArea` | `<textarea>` |\n| `HtmlTitle` | `<title>` |\n|\
  \ `HtmlTrack` | `<track>` |\n| `HtmlVideo` | `<video>` |\n\n**表 4-4**\n\n\n\n\n\n\
  ```\n <%@ Page Language=\"VB\" %>\n   <!DOCTYPE html>\n   <script runat=\"server\"\
  >\n       Protected Sub Page_Load(sender As Object, e As EventArgs)\n          \
  \ Progress1.Attributes(\"max\") = 100\n           Progress1.Attributes(\"value\"\
  ) = 25\n       End Sub\n   </script>\n   <html xmlns=\"http://www.w3.org/1999/xhtml\"\
  >\n   <head runat=\"server\">\n       <title>Using the HtmlGenericControl class</title>\n\
  \   </head>\n   <body>\n       <form id=\"form1\" runat=\"server\">\n          \
  \ <progress id=\"Progress1\" runat=\"server\"></progress>\n       </form>\n   </body>\n\
  \   </html>\n```\n\n### `C#`\n\n```vb\n <%@ Page Language=\"C#\" %>\n   <!DOCTYPE\
  \ html>\n   <script runat=\"server\">\n       protected void Page_Load(object sender,\
  \ EventArgsEventArgs e)\n       {\n           Progress1.Attributes[\"max\"] = \"\
  100\";\n           Progress1.Attributes[\"value\"] = \"25\";\n       }\n   </script>\n\
  ```\n\n在此示例中，通过添加 `id` 和 `runat` 属性，页面的 `<meta>` 元素被转换为 HTML 服务器控件。由于 `HtmlGenericControl`\
  \ 类（继承自 `HtmlControl`）可以处理广泛的 HTML 元素，你不能像处理其他 HTML 类（如 `HtmlInputButton`）那样直接为\
  \ HTML 属性赋值。你必须使用 `HtmlGenericControl` 类的 `Attributes` 属性为 HTML 元素的属性赋值，并将你正在操作的属性作为字符串值进行指定。\n\
  \n以下是运行示例页面的部分结果：\n\n```html\n <html xmlns=\"http://www.w3.org/1999/xhtml\">\n \
  \  <head>\n     <meta id=\"Meta1\" Name=\"description\"\n     CONTENT=\"Generated\
  \ on: 12/25/2012 2:42:52 AM\"></meta>\n     <title>Using the HtmlGenericControl\
  \ class</title>\n   </head>\n```\n\n通过使用 `HtmlGenericControl` 类以及其他 HTML 类，你可以从服务器端代码操作\
  \ ASP.NET 页面的每一个元素。\n\n## 识别 ASP.NET 服务器控件\n\n当你使用一系列控件创建 ASP.NET 页面时，许多控件是嵌套的，甚至许多控件是由\
  \ ASP.NET 自身动态布局的。例如，当你处理用户控件、`GridView`、`ListView`、`Repeater` 等时，ASP.NET 正在构建一个渲染到页面复杂控件树。\n\
  \n当这种情况发生时，ASP.NET 会为这些动态控件提供 ID。此时，会生成诸如 `GridView1$ctl02$ctl00` 这样的 ID。与控件一样，这些\
  \ ID 是动态的。由于这些 ID 是不可预测的，ID 的生成使得从客户端代码操作该控件变得困难。\n\n为了帮助解决这种情况，ASP.NET 4.5 包含了控制控件所用\
  \ ID 的功能。为了演示此问题，列表 4-5 显示了一些会导致控件产生不可预测的客户端 ID 的代码。首先，先创建一个用户控件。\n\n### 列表 4-5:\
  \ 包含一些简单控件的用户控件\n\n```asp\n <%@ Control Language=\"C#\" ClassName=\"Listing04_05\"\
  \ %>\n   <asp:TextBox ID=\"TextBox1\" runat=\"server\" />\n   <br />\n   <asp:Button\
  \ ID=\"Button1\" runat=\"server\" Text=\"Button\" />\n```\n\n接一步是在你的一个 ASP.NET 页面中使用此用户控件。这在\
  \ 列表 4-6 中所示。\n\n### 列表 4-6: 在简单的 ASP.NET 页面中使用用户控件\n\n```asp\n <%@ Page Language=\"\
  C#\" Trace=\"true\" %>\n   <%@ Register src=\"Listing04-05.ascx\" tagname=\"MyUserControl\"\
  \ tagprefix=\"muc\" %>\n   <!DOCTYPE html>\n   <html xmlns=\"http://www.w3.org/1999/xhtml\"\
  >\n   <head runat=\"server\">\n       <title>Working with Control IDs</title>\n\
  \   </head>\n   <body>\n       <form id=\"form1\" runat=\"server\">\n       <div>\n\
  \           <muc:MyUserControl ID=\"MyUserControl1\" runat=\"server\" />\n     \
  \  </div>\n       </form>\n   </body>\n   </html>\n```\n\n因此，此用户控件仅包含两个简单的服务器控件，它们会被渲染到页面上。如果你回看\
  \ 列表 4-5，你可以看到它们被分配了非常简单的控件 ID。有一个 `ID` 值为 `TextBox1` 的 `TextBox` 服务器控件，以及一个 `ID`\
  \ 值为 `Button1` 的 `Button` 服务器控件。\n\n查看 列表 4-6 中的页面代码，你可以在 `@Page` 指令中看到 `Trace`\
  \ 属性被设置为 `True`。这允许你看到在页面控件树中产生的 `UniqueID`。\n\n## 使用 JAVASCRIPT 操作页面和服务器控件\n\n\n\
  \n\n\n# C#\n\n```csharp\nprotected void Page_Load(object sender, EventArgs e)\n\
  {\n    TextBox1.Text = DateTime.Now.ToString();\n}\n```\n\n这段简短的代码在终端用户的页面上显示当前日期和时间。问题在于，显示的日期和时间对于生成页面的\
  \ Web 服务器是正确的。如果有人坐在太平洋时区（`PST`），而 Web 服务器位于东部时区（`EST`），那么页面对于该查看者来说是不正确的。如果你希望任何访问网站的人无论他们住在世界的何处都能看到正确的时间，你可以使用\
  \ JavaScript 来处理 `TextBox` 控件，如列表 4-8 所示。\n\n## 列表 4-8: 使用 JavaScript 为终端用户显示当前时间\n\
  \n```html\n<%@ Page Language=\"C#\" %>\n<!DOCTYPE html>\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
  >\n<head runat=\"server\">\n    <title>Using JavaScript</title>\n</head>\n<body\
  \ onload=\"javascript:document.forms[0]['TextBox1'].value=Date();\">\n    <form\
  \ id=\"form1\" runat=\"server\">\n    <div>\n        <asp:TextBox ID=\"TextBox1\"\
  \ Runat=\"server\" Width=\"300\"></asp:TextBox>\n    </div>\n    </form>\n</body>\n\
  </</html>\n```\n\n在这个示例中，尽管你使用的是 Web 服务器控件族中的标准 `TextBox` 服务器控件，但你仍然可以使用植入 `<body>`\
  \ 元素 `onload` 属性中的 JavaScript 来获取该控件。`onload` 属性的值实际上通过匿名函数，使用服务器控件的 `ID` 属性值（`TextBox1`）指向特定的服务器控件。你可以通过采用相同的方法获取页面上的其他服务器控件。这段代码生成了如图\
  \ 4-6 所示的结果。\n\n![image](img/f118-01.jpg)\n\n### 图 4-6\n\nASP.NET 使用 `Page.ClientScript`\
  \ 属性在你的 ASP.NET 页面上注册并放置 JavaScript 函数。这里回顾了其中三种方法。通过 `ClientScript` 对象（引用 `System.Web.UI.ClientScriptManager`\
  \ 实例）可以获得比这三种方法更多的方法和属性，但这些是更有实用的。你可以在在线文档中查找其余。\n\n### 使用 Page.ClientScript.RegisterClientScriptBlock\n\
  \n`RegisterClientScriptBlock` 方法允许你将 JavaScript 函数放置在页面顶部。这意味着脚本在浏览器启动页面时就已经就绪了。它的用法如列表\
  \ 4-9 所示。\n\n## 列表 4-9: 使用 RegisterClientScriptBlock 方法\n\n### VB\n\n```vbnet\n\
  <%@ Page Language=\"VB\" %>\n<!DOCTYPE html>\n<script runat=\"server\">\n    Protected\
  \ Sub Page_Load(ByVal sender As Object, ByVal e As System.EventArgs)\n        Dim\
  \ myScript As String = \"function AlertHello() {alert('Hello ASP.NET');}\"\n   \
  \     Page.ClientScript.RegisterClientScriptBlock(Me.GetType(), \"MyScript\",\n\
  \          myScript, True)\n    End Sub\n</script>\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
  >\n<head runat=\"server\">\n    <title>Adding JavaScript</title>\n</head>\n<body>\n\
  \    <form id=\"form1\" runat=\"server\">\n    <div>\n        <asp:Button ID=\"\
  Button1\" Runat=\"server\" Text=\"Button\" \n          OnClientClick=\"AlertHello()\"\
  \ />   \n    </div>\n    </form>\n</body>\n</</html>\n```\n\n### C#\n\n```csharp\n\
  <%@ Page Language=\"C#\" %>\n<!DOCTYPE html>\n<script runat=\"server\">\n    protected\
  \ void Page_Load(object sender, EventArgs e)\n    {\n        string myScript = @\"\
  function AlertHello() { alert('Hello ASP.NET'); }\";\n        Page.ClientScript.RegisterClientScriptBlock(this.GetType(),\n\
  \          \"MyScript\", myScript, true);\n    }\n</script>\n```\n\n从这个示例中，你可以看到你创建一个名为\
  \ `myScript` 的字符串来创建 JavaScript 函数 `AlertHello()`。然后使用 `Page.ClientScript.RegisterClientScriptBlock`\
  \ 方法，你编写了脚本将其放置在页面上。`RegisterClientScriptBlock` 方法的两种可能构造如下：\n\n* `RegisterClientScriptBlock(type,\
  \ key, script)`\n* `RegisterClientScriptBlock(type, key, script, script tag specification)`\n\
  \n在列表 4-9 示例中，你将类型指定为 `Me.GetType()`，键，要包含的脚本，然后设置布尔值为 `True`，这样 .NET 就会自动使用 `<script>`\
  \ 标签将脚本放置在 ASP.NET 页面上。运行页面时，你可以查看页面源代码来查看结果：\n\n```html\n<!DOCTYPE html>\n<html\
  \ xmlns=\"http://www.w3.org/1999/xhtml\">\n<head><title>\n    Adding JavaScript\n\
  </title></head>\n<body>\n    <form method=\"post\" action=\"Listing04-09.aspx\"\
  \ id=\"form1\">\n<div class=\"aspNetHidden\">\n<input type=\"hidden\" name=\"__VIEWSTATE\"\
  \ id=\"__VIEWSTATE\" value=\"hbVKLJCpbcKtClOpVO6+dE5HkSYJIxqrLCZF0BMbiZhhPdOepUjRfUukoZ7ZEg0BGQiZYBg8umPQQs/DvUX21ZQbhL3D4wLmJRxiVNppLY=\"\
  =\" />\n</div>\n<script type=\"text/javascript\">\n//<![CDATA[\nfunction AlertHello()\
  \ { alert('Hello ASP.NET'); }//]]>\n</script>\n```\n\n\n\n\n运行此页面（取决于你使用的 IE 版本）会产生\
  \ JavaScript 错误，如图图 4-7 所示。\n\n![image](img/f121-01.jpg)\n\n**图 4-7**\n\n错误的原因是\
  \ JavaScript 函数在文本框放置在屏幕上之前就已经触发了。因此，JavaScript 函数没有找到 `TextBox1`，导致页面抛出错误。现在尝试使用列表\
  \ 4-11 所示的 `RegisterStartupScript` 方法。\n\n## 列表 4-11: 使用 RegisterStartupScript 方法\n\
  \n### VB\n\n```vb\n Protected Sub Page_Load(ByVal sender As Object, ByVal e As System.EventArgs)\n\
  \       Dim myScript As String = \"alert(document.forms[0]['TextBox1'].value);\"\
  \n       Page.ClientScript.RegisterStartupScript(Me.GetType(), \"myKey\", myScript,\n\
  \           True)\n   End Sub\n```\n\n### C#\n\n```csharp\nprotected void Page_Load(object\
  \ sender, EventArgs e)\n   {\n       string myScript = @\"alert(document.forms[0]['TextBox1'].value);\"\
  ;\n       Page.ClientScript.RegisterStartupScript(this.GetType(),\n           \"\
  MyScript\", myScript, true);\n   }\n```\n\n这种方法将 JavaScript 函数放在 ASP.NET 页面的底部，因此当\
  \ JavaScript 启动时，它能找到 `TextBox1` 元素并按计划运行。结果如图图 4-8 所示。\n\n![image](img/f122-01.jpg)\n\
  \n**图 4-8**\n\n### 使用 Page.ClientScript.RegisterClientScriptInclude\n\n最后的方法是 `RegisterClientScriptInclude`。许多开发者将\
  \ JavaScript 放在 `.js` 文件中，这被认为是最佳实践，因为它非常容易对应用程序进行全局 JavaScript 更改。你可以使用列表 4-12\
  \ 所示的 `RegisterClientScriptInclude` 方法在 ASP.NET 页面上注册脚本文件。\n\n## 列表 4-12: 使用 RegisterClientScriptInclude\
  \ 方法\n\n### VB\n\n```vb\n Dim myScript As String = \"myJavaScriptCode.js\"\n   Page.ClientScript.RegisterClientScriptInclude(\"\
  myKey\", myScript)\n```\n\n### C#\n\n```csharp\nstring myScript = \"myJavaScriptCode.js\"\
  ;\n   Page.ClientScript.RegisterClientScriptInclude(\"myKey\", myScript);\n```\n\
  \n这会在 ASP.NET 页面上创建如下结构：\n\n```html\n<script src=\"myJavaScriptCode.js\" type=\"\
  text/javascript\"></script>\n```\n\n## 总结\n\n本章介绍了 ASP.NET 页面的核心构建模块之一——服务器控件。服务器控件是一种面向对象的页面开发方法，它将页面元素封装为可修改和扩展的组件。本章还查看了使用\
  \ HTML 服务器控件以及添加 JavaScript 来修改控件的行为。\n\n# 5：ASP.NET Web 服务器控件\n\n### 本章内容：\n\n\
  * 复习关键的 Web 服务器控件\n* 区分 Web 服务器控件的功能\n* 从集合中删除项目\n\n## 本章的 WROX.COM 代码下载\n\n请注意，本章中的所有代码示例都可以作为本章代码下载的一部分，可以在书籍网站的[`www.wrox.com`](http://www.wrox.com)\
  \ 的“下载代码”选项卡获取。\n\n在两种类型的服务器控件——HTML 服务器控件和 Web 服务器控件中——后者被认为更强大、更灵活。上一章介绍了如何在应用程序中使用\
  \ HTML 服务器控件。HTML 服务器控件允许你从服务器端代码操作 HTML 元素。另一方面，Web 服务器控件之所以强大，是因为它们没有显式地绑定到特定的\
  \ HTML 元素；相反，它们更贴合你想要生成的特定功能。正如你在本章中所看到的，取决于你正在处理的控件，Web 服务器控件可以非常简单也可以非常复杂。\n\n\
  提供大量控件的目的是提高你的效率。这些控件提供了在过去你可能需要辛苦编程或直接忽略的级功能。例如，在经典的 ASP 时代，互联网网站很少使用日历。随着 ASP.NET\
  \ 1.0 中 `Calendar` 服务器控件的引入，在站点上创建日历变成了一项轻易的任务。在图像上构建图像映射在 ASP.NET `1.x` 中是难以实现的任务，但该功能作为\
  \ ASP.NET `2.0` 中的新服务器控件被引入。随着 ASP.NET 版本的发布，不断添加新的控件和功能，帮助你成为一名更高效的 Web 开发人员。\n\
  \n本章介绍了一些可用 Web 服务器控件。本章的第一部分关注自 ASP.NET 早期一直存在的服务器控件。然后本章探讨了在 ASP.NET 最初发布后引入的服务器控件。本章没有讨论所有可能的控件，因为某些服务器控件会在书中其他章节引入并介绍。\n\
  \n## Web 服务器控件概述\n\nWeb 服务器控件是 ASP.NET 最常用的组件。尽管你可能已经看到了 HTML 控件的许多用途，但 Web 服务器控件的功能明显更高。它们允许实现更深层次的功能，这种功能在你操作它们时会变得更加明显。\n\
  \nASP.NET 提供的 HTML 服务器控件被转换为特定的 HTML 元素。你通过操作元素提供的属性来控制输出。这些属性在最终输出到客户端之前可以在服务器端进行更改。这具有巨大的优势，是你使用\
  \ HTML 时所需的某些能力。\n\nWeb 服务器控件的工作方式不同。它们并不映射到特定的 HTML 元素，而是允许你在无需属性的情况下定义功能、能力外观。当你构建由\
  \ Web 服务器控件组成的页面时，你是在描述页面元素的功能、外观和行为。然后让 ASP.NET 决定如何输出这些内容。当然，输出取决于请求容器的能力。这意味着每个请求者看到的\
  \ HTML 输出可能不同，因为他们使用不同的浏览器类型或版本请求页面。ASP.NET 会为你处理所有的浏览器检测和相关工作。\n\n与 HTML 服务器控件不同，Web\
  \ 服务器控件不仅适用于常见的 Web 页面表单元素（如文本框和按钮），还可以为你的 Web 页面带来一些高级功能。例如，许多 应用程序的一个常见功能是日历。没有任何\
  \ HTML 表单元素可以在 Web Forms 上放置日历，但 ASP.NET 的服务器控件可以为你的应用程序提供完整的日历，包括一些高级功能。\n\n记住，当你构造\
  \ Web 服务器控件时，你实际上是在构造一种控件——一套针对服务器的指令集（而不是客户端）。默认情况下，ASP.NET 提供的所有 Web 服务器控件在控件声明开头都使用\
  \ `asp` 前缀。以下是一个典型的 Web 服务器控件：\n\n```html\n<asp:Label ID=\"Label1\" runat=\"server\"\
  \ Text=\"Hello World\"></asp:Label>\n```\n\n\n\n\n与 HTML 服务器控件一样，Web 服务器控件需要一个 `ID`\
  \ 属性在服务器端代码中引用该控件，以及一个 `runat=\"server\"` 属性声明。就像处理其他基于 XML 的元素一样，你需要使用 XML 语法规则正确地打开和关闭\
  \ Web 服务器控件。在前面的示例中，你可以看到 `<asp:Label>` 控件关联了一个闭合元素 `</asp:Label>`。你也可以使用以下语法关闭该元素：\n\
  \n```\n<asp:Label ID=\"Label1\" runat=\"server\" Text=\"Hello World\" />\n```\n\n\
  本章的其余部分将介绍 ASP.NET 中供你使用的的一些 Web 服务器控件。\n\n## LABEL 服务器控件\n\nLabel 服务器控件用于在浏览器中显示文本。由于这是一个服务器控件，你可以从服务器端代码动态更改文本。正如你从前面使用\
  \ `<asp:Label>` 控件的示例所示，该控件使用 `Text` 属性来分配控件的内容，如下所示：\n\n```\n<asp:Label ID=\"Label1\"\
  \ runat=\"server\" Text=\"Hello World\" />\n```\n\n然而，你也可以使用 `Text` 属性，而是将要显示的内容放在\
  \ `<asp:Label>` 元素之间，如下：\n\n```\n<asp:Label ID=\"Label1\" runat=\"server\">Hello\
  \ World</asp:Label>\n```\n\n你还可以通过程序手段为控件提供内容，如 列表 5-1 所示。\n\nLabel 服务器控件一直是一个简单显示文本的控件。从\
  \ ASP.NET 2.0 开始，它增加了一些额外功能。该框架发布以来最大的变化是，你可以为表单中的项目提供热键功能（也称为 `accelerator` ）。这会导致页面聚焦于声明式分配给特定热键的服务器控件（例如，使用\
  \ Alt+N 聚焦到表单上的第一个文本框）。\n\n热键是用户启动页面操作的快速方式。例如，如果你使用 Microsoft Internet Explorer，可以按\
  \ Ctrl+N 打开一个新的 IE 实例。热键在厚客户端应用程序（Windows Forms）中一直很常见，现在你可以在 ASP.NET 中使用它们。列表 5-2\
  \ 显示了如何为表单上的两个文本框提供热键功能的示例。\n\n热键通过 `AccessKey` 属性分配。在这种情况下，`Label1` 使用 `N`，`Label2`\
  \ 使用 `P`。Label 控件的第二个属性是 `AssociatedControlID`。此处放置的 `String` 值将 Label 控件与表单上的另一个服务器控件关联。该值必须是表单上其他服务器控件之一。如果不是，调用时页面将给出错误。\n\
  \n有了这两个控件，当在浏览器中调用页面时，你可以按 Alt+N 或 Alt+P 自动聚焦到表单中的特定文本框。在 图 5-1 中，HTML 声明的下划线表示配合\
  \ Alt 键按下的字母，以便为相邻文本创建焦点。这不是强制要求的，但强烈建议这样做，因为最终用户在使用热键时期望有此功能。在这个示例中，`Username`\
  \ 中的字母 `n` 和 `Password` 中的字母 `P` 带有下划线。\n\n![image](img/f126-01.jpg)\n\n**图 5-1**\n\
  \n在使用热键时，请注意并非所有字母都可以配合 Alt 键使用。Microsoft Internet Explorer 已经使用了 Alt+A、E、H、I、O、T、V\
  \ 和 W。如果你使用了这些字母中的任何一个，IE 操作将取代你在页面上放置的任何操作。\n\n## LITERAL 服务器控件\n\nLiteral 服务器控件的工作方式与\
  \ Label 服务器控件非常相似。该控件在过去一直用于你想推送到浏览器但在过程中保持不变的文本（字面量）。Label 控件通过在文本周围放置 `<span>`\
  \ 元素来更改输出，如下：\n\n```\n<span id=\"Label1\">Here is some text</span>\n```\n\nLiteral\
  \ 控件仅输出文本，不带 `<span>` 元素。该服务器控件的一个功能是 `Mode` 属性。该属性允许你规定 ASP.NET 引擎如何解释分配给控件的文本。\n\
  \n如果你在输出的字符串中放置了一些 HTML 代码（例如 `<strong>Here is some text</strong>`），Literal 控件将直接输出这些内容，相应的浏览器会将文本显示为加粗：\n\
  \n```\nHere is some text\n```\n\n尝试如下所示使用 `Mode` 属性：\n\n```\n<asp:Literal ID=\"\
  Literal1\" runat=\"server\" Mode=\"Encode\"\n Text=\"<strong>Here is some text</strong>\"\
  ></asp:Literal>\n```\n\n添加 `Mode=\"Encode\"` 会在输出被接收应用程序之前对其进行编码：\n\n```\n&lt;b&gt;Label&lt;/b&gt;\n\
  ```\n\n现在，文本不再被转换为加粗字体，而是显示 `<strong>` 元素：\n\n```\n<strong>Here is some text</strong>\n\
  ```\n\n如果你想在应用程序中显示代码，这是理想的。`Mode` 属性的其他值包括 `Transform` 和 `PassThrough`。`Transform`\
  \ 会查看接收端并根据需要包含或移除元素。例如，并非所有设备都接受 HTML 元素，因此，如果 `Mode` 属性设置为 `Transform`，则在发送到接收应用程序之前移除这些元素。`PassThrough`\
  \ 值意味着字符串在经过任何更改发送到接收应用程序。\n\n## TEXTBOX 服务器控件\n\n网页的主要功能之一是提供用户可以提交信息的表单。TextBox\
  \ 服务器控件是空间常用的控件之一。正如其名所示，该控件提供了允许用户输入文本的表单。\n\n首先，TextBox 控件可以作为标准的文本框使用，如下代码所示：\n\
  \n```\n<asp:TextBox ID=\"TextBox1\" runat=\"server\"></asp:TextBox>\n```\n\n此代码在表单上创建一个如\
  \ 图 5-2 所示的文本框。\n\n![image](img/f127-01.jpg)\n\n**图 5-2**\n\n其次，TextBox 控件允许用户向表单输入密码。这是通过将\
  \ TextBox 控件的 `TextMode` 属性更改为 `Password` 实现的，如下所示：\n\n```\n<asp:TextBox ID=\"TextBox1\"\
  \ runat=\"server\" TextMode=\"Password\"></asp:TextBox>\n```\n\n向向用户请求密码时，最佳实践是提供一个编码内容的文本框。使用\
  \ `TextMode=\"Password\"` 属性和值可以确保文本用星号（*）或点进行编码，如 图 5-3 所示。\n\n![image](img/f127-02.jpg)\n\
  \n**图 5-3**\n\n第三，TextBox 服务器控件可以作为多行文本框使用。完成此任务的代码如下：\n\n```\n<asp:TextBox ID=\"\
  TextBox1\" runat=\"server\" TextMode=\"MultiLine\" Width=\"300px\"\n  Height=\"\
  150px\"></asp:TextBox>\n```\n\n将 `TextMode` 属性的值设置为 `MultiLine` 会创建一个多行文本框，用户可以在其中输入较多文本。`Width`\
  \ 和 `Height` 属性设置文本区域的大小，但这些是可选的属性——如果没有它们，文本区域将以最小尺寸生成。图 5-4 显示了添加一些文本后之前的代码。\n\
  \n![image](img/f127-03.jpg)\n\n**图 5-4**\n\n\n\n\n\n在使用多行文本框时，请注意 `Wrap` 属性。当其设置为\
  \ `True`（默认值）时，输入文本区域的文本会在需要时换行到下一行。当设置为 `False` 时，终端用户可以在单行内连续输入，直到其按下 Enter 键，此时光标会移动到下一行。\n\
  \n### 使用 Focus() 方法\n\n由于 `TextBox` 服务器端控件派自 `WebControl` 基类，因此它的可用方法之一是 `Focus()`。`Focus()`\
  \ 方法允许你动态地将终端用户的光标放置在指定的表单元素中（不仅是 `TextBox` 控件，还包括任何派自 `WebControl` 类的服务器控件）。尽管如此，它最常用于\
  \ `TextBox` 控件，如代码列表 5-3 所示。\n\n当使用此方法的页面在浏览器中加载时，光标已经放置在文本框内部，准备好让你开始输入。你不需要移动鼠标将光标到位，即可开始在表单中输入信息。这对于那些习惯使用键盘操作表单的人来说是理想的。\n\
  \n### 使用 AutoPostBack\n\nASP.NET 页面以事件驱动的方式工作。当 Web 页面上的操作触发事件时，将启动服务器端代码。常见的事件之一是终端用户点击表单上的按钮。如果你在\
  \ Visual Studio 2012 的设计视图中双击按钮，你可以看到代码页面中已经生成好了 `Button1_Click` 事件的结构。这是因为 `OnClick`\
  \ 是 `Button` 控件最常见的事件。双击 `TextBox` 控件会构造一个 `OnTextChanged` 事件。当终端用户将光标焦点移出文本框时，就会触发此事件，无论是在向文本框输入内容后点击页面上的另一个元素，还是仅仅通过\
  \ Tab 键跳出文本框。该事件的使用如代码列表 5-4 所示。\n\n当你构建并运行此页面时，请注意你可以在文本框中输入内容，但一旦你跳出文本框，`OnTextChanged`\
  \ 事件就会被触发，并且 `TextBox1_TextChanged` 事件中包含的代码就会运行。要使此功能生效，你必须向 `TextBox` 控件添加 `AutoPostBack`\
  \ 属性并将其设置为 `True`。这会导致 Web 页面在实际的页面回传之前查找任何文本更改。查看该页面的浏览器必须支持 ECMAScript。\n\n###\
  \ 使用 AutoCompleteType\n\n你希望为 Web 应用程序构建的表单尽可能易于使用。你希望终端用户能够方便、快速地填写信息并继续。如果你让表单过于繁琐，访问你网站的人可能会在未完成之前就离开。\n\
  \n任何 Web 表单的强大功能之一就是智能自动完成。当你第一次访问某个网站时可能见过见过。当你开始在表单中填写信息时，随着你的输入，文本框下方会出现下拉列表，显示你之前在表单中输入过的值。你正在操作的普通文本框变成了智能文本框。图\
  \ 5-5 显示了此功能的示例。\n\n![image](img/f129-01.jpg)\n\n**图 5-5**\n\n`TextBox` 控件的一个伟大特性是\
  \ `AutoCompleteType` 属性，它允许你将自动完成功能应用到自己的表单中。你必须帮助表单上的文本框识别它们应该寻找的信息类型。这意味着什么？为了回答这个问题，首先查看\
  \ `AutoCompleteType` 属性的可能值：\n\n| `Disabled` | `Company` | `HomeFax` |\n| :--- |\
  \ :--- | :--- |\n| `BusinessCity` | `DisplayName` | `Homepage` |\n| `BusinessCountryRegion`\
  \ | `HomeState` | `HomePhone` |\n| `BusinessFax` | `HomeStreetAddress` | `JobTitle`\
  \ |\n| `BusinessPhone` | `HomeZipCode` | `LastName` |\n| `BusinessState` | `Email`\
  \ | `MiddleName` |\n| `BusinessStreetAddress` | `Enabled` | `Notes` |\n| `BusinessUrl`\
  \ | `FirstName` | `Office` |\n| `BusinessZipCode` | `Gender` | `Pager` |\n| `Cellular`\
  \ | `HomeCity` | `Search` |\n| `Department` | `HomeCountryRegion` | |\n\n从此列表中，你可以看到如果你的文本框是在询问终端用户的家庭街道地址，你希望在\
  \ `TextBox` 控件中使用以下内容：\n\n```xml\n <asp:TextBox ID=\"TextBox1\" runat=\"server\"\
  \   \n      AutoCompleteType=\"HomeStreetAddress\"></asp:TextBox>\n```\n\n当你查看创建的文本框源码时，你可以看到发生了以下构造：\n\
  \n```html\n <input name=\"TextBox1\" type=\"text\" vcard_name=\"vCard.Home.StreetAddress\"\
  \ \n      id=\"TextBox1\" />\n```\n\n此功能使你的表单更易操作。是的，这是一件小事，但有时这些细节会让访问者反复回到你的网站。\n\
  \n## 按钮服务器端控件\n\n你的 Web 表单的另一种常用控件是使用 `Button` 服务器端控件构建的按钮。按钮是用于提交表单的常用元素。大多数时候，你只是通过\
  \ `Button` 控件处理表单中的项目。大多数时候，你只是通过 `OnClick` 事件处理表单中的项目，如代码列表 5-5 所示。\n\n`Button`\
  \ 控件是较易使用的控件之一，但有两个属性需要你注意：`CausesValidation` 和 `CommandName`。它们将在后续章节中讨论。\n\n###\
  \ CausesValidation 属性\n\n如果你在 Web 页面上有多个按钮，并且你正在使用验证控件，你可能不想为每个按钮都触发验证。将 `CausesValidation`\
  \ 属性设置为 `False` 是使用不会触发验证过程按钮的方法。这在第 6 章 中有更详细的解释。\n\n### CommandName 属性\n\n你可以在表单上设置多个按钮，它们都从一个事件中工作。很棒的是，你还可以对按钮进行标记，以便代码可以根据点击了哪个按钮做出逻辑判断。你必须按照代码列表\
  \ 5-6 所示的方式构造你的 Button 控件。\n\n下一步是创建 `Button_Command` 事件来处理这两个按钮，只需手动输入它，或者从 Visual\
  \ Studio 的代码视图中的 `Button` 控件可用事件下拉列表中选择 `Command` 事件。无论哪种情况，你最终都将得到一个像代码列表 5-7 所示的事件。\n\
  \n```csharp\n注意此方法使用了 System.Web.UI.WebControls.CommandEventArgs 而不是典型的 System.EventArgs。这让你能够通过\
  \ e.CommandName 访问 Select Case (`switch`) 语句中使用的成员 CommandName。通过此对象，你可以检查表单上点击的按钮所使用的\
  \ CommandName 属性的值，并根据传递的值采取特定行动。\n```\n\n\n\n你可以向 `Command` 事件传递一些参数，这些参数是在 `CommandName`\
  \ 属性定义之外之外的。你可以通过使用 Button 控件的 `CommandArgument` 属性来实现。通过向该属性添加值，你可以根据需要更具细粒度地定义项目。你可以通过服务器端代码使用\
  \ `CommandEventArgs` 对象的 `e.CommandArgument` 获取此值。\n\n### 可与客户端 JavaScript 协作的按钮\n\
  \n按钮经常用于提交信息并触发网页上发生的操作。在 ASP.NET 1.0/1.1 之前，人们会在页面中混杂大量的 JavaScript，以便在点击按钮时触发\
  \ JavaScript 事件。在 ASP.NET 1.0/1.1 中，这一过程变得更加复杂，但从 ASP.NET 2.0 开始，它变得简单多了。\n\n你可以创建一个在点击按钮时同时触发\
  \ JavaScript 事件和服务器端事件的页面，如 示例列表 5-8 所示。\n\n首先注意的是 Button 服务器控件的属性：`OnClientClick`。它指向客户端函数，与指向服务器端事件的\
  \ `OnClick` 属性不同。此示例使用了一个名为 `AlertHello()` 的 JavaScript 函数。\n\nVisual Studio 2012\
  \ 的一个酷之处是，它可以与客户端脚本标签并列的服务器端脚本标签一起。它们无缝地协同工作。在示例中，在弹出 JavaScript 警报框（参见 图 5-6）并且用户点击\
  \ OK 后，页面将回传（post back），此时触发服务器端事件。\n\n![image](img/f133-01.jpg)\n\n**图 5-6**\n\n\
  Button 服务器控件另一个有趣的属性是 `PostBackUrl`。它允许你执行跨页面提交（cross-page posting），而不是简单地将 ASP.NET\
  \ 页面提交回同一个页面，如下例所示：\n\n```\n<asp:Button ID=\"Button1\" runat=\"server\" Text=\"\
  Submit to Another Page\"\n    PostBackUrl=\"Page2.aspx\" />\n```\n\n跨页面提交将在 第 3\
  \ 章 中详细介绍。\n\n### LINKBUTTON 服务器控件\n\nLinkButton 服务器控件是 Button 控件的变体。它与 Button 相同，但\
  \ LinkButton 控件以超链接的形式呈现。尽管如此，它并不是典型的超链接。当用户点击链接时，它的行为就像一个按钮。\n\nLinkButton 服务器控件构造如下：\n\
  \n```\n<asp:LinkButton ID=\"LinkButton1\" Runat=\"server\" OnClick=\"LinkButton1_Click\"\
  >\n    Submit your name to our database\n</asp:LinkButton>\n```\n\n使用 LinkButton\
  \ 控件可以获得 图 5-7 所示的结果。\n\n![image](img/f133-02.jpg)\n\n**图 5-7**\n\n### IMAGEBUTTON\
  \ 服务器控件\n\nImageButton 控件也是 Button 控件的变体。它与 Button 控件几乎完全相同，只是它允许你使用自定义图像作为表单按钮，而不是大多数表单使用的典型按钮。这意味着你可以创建图像创建自己的按钮，用户可以点击图像来提交表单数据。ImageButton\
  \ 的典型构造如下：\n\n```\n<asp:ImageButton ID=\"ImageButton1\" runat=\"server\"\n    OnClick=\"\
  ImageButton1_Click\" ImageUrl=\"search.jpg\" />\n```\n\nImageButton 控件通过 `ImageUrl`\
  \ 属性指定使用图像的位置。从此示例中你可以看到 `ImageUrl` 指向 `search.jpg`。ImageButton 控件与 LinkButton 或\
  \ Button 控件的主要区别在于 ImageButton 对 `OnClick` 事件使用了不同的构造方式。如 示例列表 5-9 所示。\n\n该构造使用了\
  \ `ImageClickEventArgs` 对象而不是通常用于 LinkButton 和 Button 控件的 `System.EventArgs` 对象。你可以通过使用\
  \ `e.X` 和 `e.Y` 坐标来确定用户点击图像的位置。\n\n### HYPERLINK 服务器控件\n\nHyperLink 服务器控件允许你通过编程处理网页上的任何超链接。超链接是允许用户从一个页面转移到页面的链接。你可以使用控件的\
  \ `Text` 属性设置链接的文本：\n\n```\n<asp:HyperLink ID=\"HyperLink1\" runat=\"server\" Text=\"\
  Go to this page here\"\n    NavigateUrl=\"Default2.aspx\"></asp:HyperLink>\n```\n\
  \n此服务器控件会在你的页面上创建一个文本为 `Go to this page here` 的超链接。当点击链接时，用户将被重定向到位于 `NavigateUrl`\
  \ 属性中的值（在此情况下为 `Default2.aspx` 页面）。\n\nHyperLink 服务器控件的有趣之处在于它既可以用于图像也可以用于文本。它不使用\
  \ `Text` 属性，而是使用 `ImageUrl` 属性：\n\n```\n<asp:HyperLink ID=\"HyperLink2\" runat=\"\
  server\" ImageUrl=\"MyLinkImage.gif\"\n    NavigateUrl=\"Default2.aspx\"></asp:HyperLink>\n\
  ```\n\nHyperLink 控件是在网页上动态放置超链接的极方法。\n\n### DROPDOWNLIST 服务器控件\n\nDropDownList 服务器控件允许你在网页上放置一个选择框。当你有一个较大的集合并希望用户从中选择单个项目时，它是理想的。如果集合规模较小，请考虑\
  \ RadioButton 服务器控件（在本章稍后描述）。\n\n由 DropList 生成的选择框显示单个项目，并允许用户从列表中进行选择。注意，滚动条的出现是由浏览器自动生成的。\n\
  \n以下是 DropList 的代码：\n\n```\n<asp:DropDownList ID=\"DropDownList1\" runat=\"server\"\
  >\n    <asp:ListItem>Select an Item</asp:ListItem>\n    <asp:ListItem>Car</asp:ListItem>\n\
  \    <asp:ListItem>Airplane</asp:ListItem>\n    <asp:ListItem>Train</asp:ListItem>\n\
  </asp:DropDownList>\n```\n\n此代码将在浏览器中生成下拉列表，如 图 5-8 所示。\n\n![image](img/f135-01.jpg)\n\
  \n**图 5-8**\n\nDropDownList 控件在将其绑定到各种数据源时非常有用。数据源可以是数组、数据库值、XML 文件值或其他值。关于绑定 DropList\
  \ 控件的示例，下一个示例查看如何从三个可用数组动态生成 DropList 控件，如 示例列表 5-10 所示。\n\n在此示例中，第二个下拉列表根据第一个下拉列表选中的值动态生成。例如，从第一个下拉列表中选择\
  \ `Car` 会表单上动态创建一个第二个下拉列表，其中包含可用汽车列表。\n\n这之所以可行是因为使用了 DropList 控件的 `AutoPostBack`\
  \ 功能。当 `AutoPostBack` 属性设置为 `True` 时，在做出选择时，通过 `OnSelectedIndexChanged` 事件提供的方法会被触发。在示例中，`DropDownList1_SelectedIndexChanged`\
  \ 事件被触发，动态创建第二个下拉列表。\n\n在此方法中，第二个下拉列表的内容在字符串数组中创建，然后通过使用 `DataSource` 属性和 `DataBind()`\
  \ 方法绑定到第二个 DropList 控件。\n\n构建并运行时，此页面看起来像 图 5-9 所示。\n\n![image](img/f137-01.jpg)\n\
  \n\n\n\n# 图 5-9\n\n## 从集合中视觉化移除项\n\n`DropDownList`、`ListBox`、`CheckBoxList` 和 `RadioButtonList`\
  \ 服务器端控件允许你从视觉上从控件显示的集合中移除项，尽管你仍然可以在服务器端代码中处理那些未显示的项。\n\n要了解一个移除项的快速示例，请创建一个包含三个项目的下拉列表，其中包含一个你将不想项的项。然而，在回传（postback）时，你仍然可以处理\
  \ `ListItem` 的 `Value` 或 `Text` 属性，如列表 5-11 所示。\n\n从代码可以看出，`ListItem` 服务器端控件元素有一个属性：`Enabled`。赋给该元素的\
  \ `boolean` 值决定了集合中的项是否被显示。如果你使用 `Enabled=\"False\"`，该项将不会显示，但你仍然可以在 `DropDownList1_SelectedIndexChanged`\
  \ 事件中显示的服务器端代码中处理该项。这些 `Response.Write` 语句的输出结果如图图 5-10 所示。\n\n![image](img/f138-01.jpg)\n\
  \n**图 5-10**\n\n## LISTBOX 服务器端控件\n\n`ListBox` 服务器端控件具有与 `DropDownList` 控件类似的功能。它显示项集合。`ListBox`\
  \ 控件的行为与 `DropDownList` 控件不同，因为它向终端用户显示更多的集合内容，并允许终端用户从集合中进行多选——这在 `DropDownList`\
  \ 控件中是不可能的。\n\n典型的 `ListBox` 控件在代码中所示：\n\n```asp\n<asp:ListBox ID=\"ListBox1\" runat=\"\
  server\">\n    <asp:ListItem>ASP.NET 4.5</asp:ListItem>\n    <asp:ListItem>ASP.NET\
  \ MVC 4</asp:ListItem>\n    <asp:ListItem>jQuery 1.8.x</asp:ListItem>\n    <asp:ListItem>Visual\
  \ Studio 2012</asp:ListItem>\n</asp:ListBox>\n```\n\n这生成了如图 5-11 所示的浏览器显示。\n\n![image](img/f139-01.jpg)\n\
  \n**图 5-11**\n\n### 允许用户选择多项\n\n你可以使用 `SelectionMode` 属性让你的终端用户从 `ListBox` 控件显示的内容中进行多选。这是一个示例：\n\
  \n```asp\n<asp:ListBox ID=\"ListBox1\" runat=\"server\" SelectionMode=\"Multiple\"\
  >\n    <asp:ListItem>ASP.NET 4.5</asp:ListItem>\n    <asp:ListItem>ASP.NET MVC 4</asp:ListItem>\n\
  \    <asp:ListItem>jQuery 1.8.x</asp:ListItem>\n    <asp:ListItem>Visual Studio\
  \ 2012</asp:ListItem>\n</asp:ListBox>\n```\n\n`SelectionMode` 属性的可能值包括 `Single`\
  \ 和 `Multiple`。将值设置为 `Multiple` 允许终端用户在列表中进行多项选择。用户在进行选择时必须按住 `Ctrl` 或 `Shift` 键。按住\
  \ `Ctrl` 键允许用户在保持之前的选择的同时从列表中进行单项选择。按住 `Shift` 键则允许进行范围内的多项选择。\n\n### 使用 ListBox\
  \ 控件的示例\n\n列表 5-12 所示的 `ListBox` 控件允许在用户点击提交按钮时在浏览器中显示多个选中的项。表单顶部还应该有一个额外的文本框和按钮，允许终端用户向\
  \ `ListBox` 添加额外项。\n\n这是一个有趣的示例。首先，一些默认项（ASP.NET Web 开发中常用的四种产品）已经放置在 `ListBox`\
  \ 控件中。然而，表单顶部的文本框和按钮允许终端用户向列表添加产品。用户随后可以从 `ListBox` 中进行一项或多项选择，包括对他们动态添加到集合中的项进行选择。当用户做出选择并点击按钮后，`Button2_Click`\
  \ 事件会遍历集合中的 `-`ListItem` 实例，并只显示被选中的项。\n\n该控件的工作原理是创建一个 `ListItem` 对象的实例，并使用其 `Selected`\
  \ 属性查看集合中的特定项是否被选中。`ListItem` 对象的使用不仅限于 `ListBox` 控件（尽管这里使用的是它）。你也可以动态地向集合添加或移除项，并在\
  \ `ListItem` 对象在 `DropDownList`、`CheckBoxList` 和 `RadioButtonList` 控件中获取项及其值。这是列表控件的一个特性。当此页面生成并运行时，你将获得如图\
  \ 5-12 所示的结果。\n\n![image](img/f141-01.jpg)\n\n**图 5-12**\n\n### 向集合添加项\n\n要向集合添加项，你可以使用以下简短语法：\n\
  \n```vb\nListBox1.Items.Add(TextBox1.Text)\n```\n\n查看在浏览器中创建的源代码，你应该看到类似于下面动态的内容：\n\
  \n```html\n<select size=\"4\" name=\"ListBox1\" multiple=\"multiple\" id=\"ListBox1\"\
  >\n    <option value=\"ASP.NET 4.5\">ASP.NET 4.5</option>\n    <option value=\"\
  ASP.NET MVC 4\">ASP.NET MVC 4</option>\n    <option value=\"jQuery 1.8.x\">jQuery\
  \ 1.8.x</option>\n    <option value=\"Visual Studio 2012\">Visual Studio 2012</option>\n\
  \    <option value=\"Modernizr 2.6.x\">Modernizr 2.6.x</option>\n</select>\n```\n\
  \n你可以看到动态添加的值是一个文本项，并且你可以看到它的值。你还可以添加 `ListItem` 对象的实例来获取项名称和值的不同值：\n\n***VB***\n\
  \n```vb\nListBox1.Items.Add(New ListItem(\"Modernizr 2.6.x\", \"Modernizr\"))\n\
  ```\n\n***C#***\n\n```csharp\nListBox1.Items.Add(new ListItem(\"Modernizr 2.6.x\"\
  , \"Modernizr\"));\n```\n\n## CHECKBOX 服务器端控件\n\nWeb 表单上的复选框允许你的用户从项集合中进行选择，或者指定项的值为\
  \ `yes/no`、`on/off` 或 `true/false`。使用 `CheckBox` 控件或 `CheckBoxList` 控件在你的 Web Forms\
  \ 中包含复选框。\n\n`CheckBox` 控件允许你在表单上放置单个复选框；`CheckBoxList` 控件允许你放置复选框集合。你可以在 ASP.NET\
  \ 页面可以使用多个 `CheckBox` 控件，但每个复选框都被视为带有关联事件的独立元素。相反，`CheckBoxList` 控件允许对整个组设置多个复选框和特定事件。\n\
  \n列表 5-13 显示使用 `CheckBox` 控件的示例。\n\n这产生了一个包含一个请求捐款的复选框的页面。使用 `CheckedChanged` 事件，`CheckBox`\
  \ 控件内使用了 `OnCheckedChanged`。属性值指向 `CheckBox1_CheckedChanged` 事件，该事件在用户勾选复选框时触发。只有当\
  \ `AutoPostBack` 属性设置为 `True` 时才会发生（该属性默认为 `False`）。运行此页面将产生如图 5-13 所示的结果。\n\n![image](img/f143-01.jpg)\n\
  \n**图 5-13**\n\n### 如何确定复选框是否被勾选\n\n你可能不想使用复选框的 `AutoPostBack` 功能，而是想表单回传到服务器后确定复选框是否被勾选。你可以通过\
  \ `If Then` 语句进行此检查，如下例所示：\n\n***VB***\n\n```vb\nIf (CheckBox1.Checked = True) Then\n\
  \    Response.Write(\"Thanks for your donation!\")\nEnd If\n```\n\n***C#***\n\n\
  ```csharp\nif (CheckBox1.Checked == true)\n{\n    Response.Write(\"Thanks for your\
  \ donation!\");\n}\n```\n\n\n\n\n\n此检查是通过控件的 `Checked` 属性对 `CheckBox` 值进行的。该属性的值是一个\
  \ `boolean` 值，因此它要么是 `True`（已勾选），要么是 `False`（未勾选）。\n\n### 给复选框赋值\n\n你也可以使用 `Checked`\
  \ 属性根据其他动态值来确保复选框被选中：\n\nVB\n\n```\nIf (Member = True) Then\n    CheckBox1.Checked\
  \ = True\nEnd If\n```\n\nC#\n\n```csharp\nif (Member == true)\n{\n    CheckBox1.Checked\
  \ = true;\n}\n```\n\n### 在复选框周围对齐文本\n\n在之前的复选框示例中，文本出现在实际复选框的右侧，如图 5-14 所示。\n\n\
  ![image](img/f144-01.jpg)\n\n**图 5-14**\n\n使用 `CheckBox` 控件的 `TextAlign` 属性，你可以重新对齐文本，使其显示在复选框的另一侧：\n\
  \n```\n<asp:CheckBox ID=\"CheckBox1\" runat=\"server\" Text=\"Donate $10 to my cause!\"\
  \n    OnCheckedChanged=\"CheckBox1_CheckedChanged\" AutoPostBack=\"true\"\n    TextAlign=\"\
  Left\" />\n```\n\n`TextAlign` 属性的可能值为 `Right`（默认设置）和 `Left`。该属性也适用于 `CheckBoxList`、`RadioButton`\
  \ 和 `RadioButtonList` 控件。赋值为 `Left` 会产生如图 5-15 所示的结果。\n\n![image](img/f144-02.jpg)\n\
  \n**图 5-15**\n\n## CHECKBOXLIST 服务器端控件\n\n`CheckBoxList` 服务器端控件与 `CheckBox` 控件非常相似，不同之处前者允许你处理一组项目，而不是单个项目。其理念是\
  \ `CheckBoxList` 服务器端控件实例是一个相关项的集合，每个项本身都是一个独立的复选框。\n\n要查看 `CheckBoxList` 控件的作用，你可以构建一个示例，使用\
  \ Microsoft 的 SQL Server 从 `AdventureWorks` 示例数据库的 `Customer` 表中提取信息。示例如列表 5-14\
  \ 所示。\n\n此 ASP.NET 页面上有一个 `SqlDataSource` 控件，它从 `Adventure Works` 数据库中提取你所需的信息。从该控件使用的\
  \ `SELECT` 语句中，你可以看到正在从 `Customer` 表中前 10 个唯一条目中检索 `CompanyName` 字段。\n\n`CheckBoxList`\
  \ 控件通过几个属性将自己绑定到 `SqlDataSource` 控件：\n\n```\n<asp:CheckBoxList ID=\"CheckBoxList1\"\
  \ runat=\"server\"\n    DataSourceID=\"SqlDataSource1\" DataTextField=\"CompanyName\"\
  \n    RepeatColumns=\"3\" BorderColor=\"Black\"\n    BorderStyle=\"Solid\" BorderWidth=\"\
  1px\">\n</asp:CheckBoxList>\n```\n\n`DataSourceID` 属性用于将 `CheckBoxList` 控件与来自 `SqlDataSource`\
  \ 控件的结果关联。然后使用 `DataTextField` 属性从结果提取你想要处理的字段名称。在这个示例中，只有一个可用的：`CompanyName`。就是如此！`CheckBoxList`\
  \ 会生成你想要的结果。\n\n其余代码由样式属性组成，这些非常有趣。`BorderColor`、`BorderStyle` 和 `BorderWidth` 属性允许你在整个复选框列表周围加上边框。最有趣的属性是\
  \ `RepeatColumns` 属性，它指定了可以使用多少列（此示例中为三）来显示结果。\n\n当你运行页面时，将得到如图 5-16 所示的结果。\n\n\
  ![image](img/f146-01.jpg)\n\n**图 5-16**\n\n`RepeatDirection` 属性指示 `CheckBoxList`\
  \ 控件如何在网页上布局绑定到控件的项。可能的值包括 `Vertical` 和 `Horizontal`。默认值为 `Vertical`。将其设置为 `Vertical`\
  \ 并将 `RepeatColumn` 设置为 `3` 会产生以下结果：\n\n| `CheckBox1` | `CheckBox4` | `CheckBox7`\
  \ |\n\n| `CheckBox2` | `CheckBox5` | `CheckBox8` |\n\n| `CheckBox3` | `CheckBox6`\
  \ | `CheckBox9` |\n\n当 `RepeatDirection` 属性设置为 `Horizontal` 时，你将复选框项以水平方式布局：\n\n\
  | `CheckBox1` | `CheckBox2` | `CheckBox3` |\n\n| `CheckBox4` | `CheckBox5` | `CheckBox6`\
  \ |\n\n| `CheckBox7` | `CheckBox8` | `CheckBox9` |\n\n## RADIOBUTTON 服务器端控件\n\n\
  `RadioButton` 服务器端控件与 `CheckBox` 服务器端控件非常相似。它在你的网页上放置一个单选按钮。然而，与复选框不同，表中的单个单选按钮并没有意义。单选按钮通常是至少两个两个的表单元素。页面上典型的\
  \ `RadioButton` 控件组采用以下结构：\n\n```\n<asp:RadioButton ID=\"RadioButton1\" runat=\"\
  server\" Text=\"Yes\" GroupName=\"Set1\" />\n<asp:RadioButton ID=\"RadioButton2\"\
  \ runat=\"server\" Text=\"No\" GroupName=\"Set1\" />\n```\n\n图 5-17 显示了结果。\n\n![image](img/f146-02.jpg)\n\
  \n**图 5-17**\n\n查看 `RadioButton` 的代码时，注意放置在单选按钮旁边的 `Text` 属性。这里更重要的属性是 `GroupName`，可以进行设置以便协同工作。像\
  \ `CheckBox` 一样，`RadioButton` 在做出选择时会触发 `CheckedChanged` 事件。记住为了使之工作需要将 `AutoPostBack`\
  \ 属性设置为 `True`。\n\n图 5-18 显示了结果。\n\n![image](img/f148-01.jpg)\n\n**图 5-18**\n\n\
  `RadioButton` 控件相对于 `RadioButtonList`（将讨论）的一个优势是允许你在单选按钮之间放置其他项目（文本、控件或图像）。然而，`RadioButtonList`\
  \ 始终是一个单选按钮列表。\n\n## RADIOBUTTONLIST 服务器端控件\n\n`RadioButtonList` 服务器端控件允许在网页上显示一组单选按钮。它与\
  \ `CheckBoxList` 其他列表控件非常相似，它允许你进行迭代以查看用户选择了什么、进行计数或执行其他操作。\n\n典型的 `RadioButtonList`\
  \ 控件以以下方式编写到页面：\n\n```\n<asp:RadioButtonList ID=\"RadioButtonList1\" runat=\"server\"\
  >\n    <asp:ListItem Selected=\"True\">English</asp:ListItem>\n    <asp:ListItem>Russian</asp:ListItem>\n\
  \    <asp:ListItem>Finnish</asp:ListItem>\n    <asp:ListItem>Swedish</asp:ListItem>\n\
  </asp:RadioButtonList>\n```\n\n与其他列表控件一样，它为集合中的每个项使用 `ListItem` 实例。从示例可以看出，如果 `Selected`\
  \ 属性设置为 `True`，则在第一次生成页面时，一个 `ListItem` 对象会被选中。这产生了如图 5-19 所示的结果。\n\n![image](img/f148-02.jpg)\n\
  \n**图 5-19**\n\n`Selected` 属性不是必须的，但如果你希望最终用户从集合中做出某种选择，这是一个好主意。使用它使得集合无法为空。\n\n\
  \n\n\n\n你可以使用 `RadioButtonList` 控件在任何页面方法中检查终端用户选择的值。代码列表 5-16 显示了一个 `Button1_Click`\
  \ 事件，该事件会抛出 `RadioButtonList` 集合中选中的值。\n\n这段代码获取 `RadioButtonList` 的 `ListItem`\
  \ 对象集合中选中的项。这就是你与 ASP.NET 提供的其他列表控件交互的方式。`RadioButtonList` 还允许你访问 `RepeatColumns`\
  \ 和 `RepeatDirection` 属性（这些属性在 `CheckBoxList` 部分中已解释过）。你可以将此控件绑定到来自任何数据源控件的项，以便在\
  \ Web 上上动态创建单选按钮列表。\n\n## 图像服务器控件 (IMAGE SERVER CONTROL)\n\n图像服务器控件允许你从服务器端代码处理网页上的图像。它是一个简单的服务器控件，但它可以让你能够决定图像在浏览器屏幕上的显示方式。一个典型的图像控件按如下方式构造：\n\
  \n```\n<asp:Image ID=\"Image1\" runat=\"server\" ImageUrl=\"~/Images/Windows.jpg\"\
  \ />\n```\n\n这里重要的属性是 `ImageUrl`。它指向图像的文件位置。在这种情况下，位置被指定为 `Windows.jpg` 文件。\n\n\
  代码列表 5-17 显示了动态更改 `ImageUrl` 属性的示例。\n\n在此示例中，当页面首次加载时，浏览器会显示一张图像（`Windows.jpg`）。当终端用户点击页面上的按钮时，在回传（postback）过程中会加载一张新图像（`Windows8.jpg`）。\n\
  \n特殊情况可能会终端用户无法查看网页中的某个图像。他们可能在物理上无法看到图像，或者他们正在使用纯文本浏览器。在这些情况下，他们的浏览器会寻找 `<img>`\
  \ 元素的 `longdesc` 属性，该属性指向一个包含对显示图像的详细描述的文件。\n\n对于这些情况，图像服务器控件包含 `DescriptionUrl`\
  \ 属性。分配给它的值是一个文本文件，其中包含了与关联图像的详细描述。以下是使用方法：\n\n```\n<asp:Image ID=\"Image1\" runat=\"\
  server\" ImageUrl=\"~/Images/Windows.jpg\" \n  DescriptionUrl=\"~/WindowsImage.txt\"\
  \ />\n```\n\n此代码会在浏览器中产生以下结果：\n\n```\n<img id=\"Image1\" src=\"Images/Windows.jpg\"\
  \ longdesc=\"WindowsImage.txt\" />\n```\n\n记住，图像不支持用户点击图像。如果你想根据按钮点击程序化事件，请使用本章稍后讨论的\
  \ `ImageButton` 服务器控件。\n\n## 表格服务器控件 (TABLE SERVER CONTROL)\n\n表格是网页最常见的元素之一，因为\
  \ HTML `<table>` 元素是用于显示大量记录的最常用格式之一。表格服务器控件的典型构造如下：\n\n```\n<asp:Table ID=\"Table1\"\
  \ runat=\"server\">\n    <asp:TableRow ID=\"TableRow1\" runat=\"server\" Font-Bold=\"\
  True\"\n        ForeColor=\"White\" BackColor=\"DarkGray\">\n        <asp:TableHeaderCell>First\
  \ Name</asp:TableHeaderCell>\n        <asp:TableHeaderCell>Last Name</asp:TableHeaderCell>\n\
  \    </asp:TableRow>\n    <asp:TableRow>\n        <asp:TableCell>Jason</asp:TableCell>\n\
  \        <asp:TableCell>Gaylord</asp:TableCell>\n    </asp:TableRow>\n    <asp:TableRow>\n\
  \        <asp:TableCell>Scott</asp:TableCell>\n        <asp:TableCell>Hanselman</asp:TableCell>\n\
  \    </asp:TableRow>\n    <asp:TableRow>\n        <asp:TableCell>Todd</asp:TableCell>\n\
  \        <asp:TableCell>Miranda</asp:TableCell>\n    </asp:TableRow>\n    <asp:TableRow>\n\
  \        <asp:TableCell>Pranav</asp:TableCell>\n        <asp:TableCell>Rastogi</asp:TableCell>\n\
  \    </asp:TableRow>\n</asp:Table>\n```\n\n这产生了图 5-20 所示的简单两行表格。\n\n![image](img/f151-01.jpg)\n\
  \n**图 5-20**\n\n你可以使用表格服务器控件做很多。例如，你可以动态地向表格添加行，如代码列表 5-18 所示。\n\n要向表格控件添加单行，你必须创建\
  \ `TableRow` 和 `TableCell` 对象的新实例。你先创建 `TableCell` 对象，然后将它们放置在添加到 `Table` 对象的 `TableRow`\
  \ 对象中。\n\n表格服务器控件显然包含一些所介绍之外的额外功能。较简单的功能之一是为网页上的表格添加标题。图 5-21 显示了一个带有标题的表格。\n\n\
  ![image](img/f152-01.jpg)\n\n**图 5-21**\n\n要为你的表格添加标题，只需使用表格控件中的 `Caption` 属性，如[代码列表\
  \ 5-19]所示。\n\n默认情况下，标题位于顶部居中，但你可以使用 `CaptionAlign` 控制它的位置。它的设置包括 `Bottom`、`Left`\
  \ 和 `Top`。\n\n在 ASP.NET 早期，`<Table>` 元素包含 `<TableRow>`。在 ASP.NET 4.5 中，你可以嵌套一些 `<header>`\
  \ 和 `<footer>`。\n\n## 日历控件 (THE CALENDAR CONTROL)\n\n日历控件是一个功能强大的控件，允许你直接在页面上放置功能功能日历。它允许高度自定义。日历控件以最简单的形式代码如下：\n\
  \n```\n<asp:Calendar ID=\"Calendar1\" runat=\"server\"></asp:Calendar>\n```\n\n\
  此代码会在网页上产生一个没有任何式的日历，如图 5-22 所示。\n\n![image](img/f153-01.jpg)\n\n**图 5-22**\n\n\
  ### 从日历控件选择日期\n\n日历允许你遍历年份中的月份并选择特定日期。允许用户选择月份的简单应用程序如代码列表 5-20 所示。\n\n运行此应用程序会在浏览器中弹出日历。终端用户可以在其中选择日期。选择日期后，将触发\
  \ `Calendar1_SelectionChanged` 事件并使用 `SelectionChange` 属性。该事件将选中日期的值写入屏幕。结果如图 5-23\
  \ 所示。\n\n![image](img/f154-01.jpg)\n\n**图 5-23**\n\n### 选择用于输出的日期格式\n\n当你使用 `Calendar1_SelectionChanged`\
  \ 事件时，选中的日期将使用 `ToDateString()` 方法输出。日历控件还允许你以其他许多格式输出日期，详细列表如下：\n\n- `ToFileTime`:\
  \ 将选择转换为本地操作系统文件时间：`129961296000000000`。\n- `ToFileTimeUtc`: 将选择转换为操作系统文件时间，但不是使用本地时区，而是使用\
  \ UTC 时间：`129961152000000000`。\n- `ToLocalTime`: 将当前的协调世界时间 (UTC)转换为本地时间：`10/30/2012\
  \ 8:00:00 PM`。\n- `ToLongDateString`: 将选择转换为长格式的人可读字符串：`Wednesday, October 31, 2012`。\n\
  \n\n\n\n\n*   `ToLongTimeString`: 将选择转换为长格式的时间值（不包含日期）：`12:00:00 AM`。\n*   `ToOADate`:\
  \ 将选择转换为等效的 OLE 自动化日期：`41213`。\n*   `ToShortDateString`: 将选择转换为短格式的人类可读字符串：`10/31/2012`。\n\
  *   `ToShortTimeString`: 将选择转换为短格式的时间值（不包含日期）：`12:00 AM`。\n*   `ToString`: 将选择转换为以下格式：`10/31/2012\
  \ 12:00:00 AM.`。\n*   `ToUniversalTime`: 将选择转换为通用时间 (UTC)：`10/31/2012 4:00:00 AM.`。\n\
  \n### 选择天、周或月\n\n默认情况下，日日历（Calendar）控件允许你进行单日选择。你可以使用 `SelectionMode` 属性更改此行为，允许你的用户从日历中选择周或月。该属性的可能值包括\
  \ `Day, DayWeek, DayWeekMonth` 和 `None`。\n\n`Day` 设置允许你点击日历中的特定某天来高亮显示（这是默认设置）。当你使用\
  \ `DayWeek` 设置时，你仍然可以进行单日选择，但也可以点击周旁边的箭头（参见图 5-24）来进行包含整周的选择。使用 `DayWeekMonth` 设置允许使用户进行单日选择或周选择。日历的左上角会出现一个新箭头，使用户可以选择整个月份（同样在图\
  \ 5-24 中所示）。`None` 设置意味着最终用户无法进行任何选择，这对于你网站上仅提供信息的性日历非常有用。\n\n![image](img/f155-01.jpg)\n\
  \n**图 5-24**\n\n### 处理日期范围\n\n即使最终用户进行了涵盖整个周或整个月的选择，你从选择中获取的也只是该范围的第一日期。例如，如果你允许用户选择整个月份并有人选择了\
  \ 2012 年 10 月，你得到的（使用 `ToShortDateString()`）将是 `10/1/2012` —— 选择日期范围中的第一个日期。这可能对你有效，但如果你需要所选范围内的所有日期，列表\
  \ 5-21 向你展示了如何获取它们。\n\n在这个示例中，日历控件允许用户进行单日、单周甚至整月的选择。使用 `For Next` 循环，你通过使用 `SelectedDates.Count`\
  \ 属性遍历选择。代码产生了如图 5-25 所示所示的结果。\n\n![image](img/f156-01.jpg)\n\n**图 5-25**\n\n你可以使用以下代码仅获取选择的第一天：\n\
  \nVB\n```vb\nCalendar1.SelectedDates.Item(0).ToDateString()\n```\nC#\n```csharp\n\
  Calendar1.SelectedDates[0].ToDateString();\n```\n\n你可以使用以下代码获取所选范围的最后日期：\n\nVB\n\
  ```vb\nCalendar1.SelectedDates.Item(Calendar1.Count-1).ToDateString()\n```\nC#\n\
  ```csharp\nCalendar1.SelectedDates[Calendar1.Count-1].ToDateString();\n```\n\n如你所示，使用\
  \ `SelectedDates` 对象的 `Count` 属性是可以实现的。\n\n### 修改日历的样式和行为\n\n日历控件有很多内容——绝对多于本章所涵盖的内容。日历控件的一个很棒的特性它提供了易于扩展性。通过查看更改它的最简单方法之一——为控件应用样式，开始探索自定义此控件的新方法。\n\
  \n使用 Visual Studio，你可以从页面的设计视图（Design view）为控件提供新的外观。高亮日历控件并打开控件的智能标签（smart tag）以查看自动格式（Auto\
  \ Format）。这将为你提供一个可以应用于你的日历控件的样式列表。某些样式显示在图 5-26 中。\n\n![image](img/f157-01.jpg)\n\
  \n**图 5-26**\n\n除了更改日历控件的样式外，你可以在控件渲染期间对其处理。日历控件包含一个名为 `DayRender` 的事件，允许你控制单个日期或日历中所有日期的渲染方式。列表\
  \ 5-22 显示了如何更改日历中正在渲染的日期之一的示例。\n\n在这个示例中，你使用带有样式的日历控件。当页面在浏览器中生成并运行时，你可以看到日历中每个月的\
  \ 18 号已通过 `Calendar1_DayRender` 事件中的代码被更改。日历如图 5-27 所示。\n\n![image](img/f159-01.jpg)\n\
  \n**图 5-27**\n\n此示例中的日历控件添加了指向 `Calendar1_DayRender` 事件的 `OnDayRender` 属性。该方法会为日历中每个渲染的每一天运行一次。类构造函数显示你处理的不是典型的\
  \ `System.EventArgs` 类，而是 `DayRenderEventArgs` 类。它让你能够访问日历中渲染的每一天。\n\n`DayRenderEventArgs`\
  \ 类的两个主要属性是 `Cell` 和 `Day`。`Cell` 属性让你访问渲染日期的空间，而 `Day` 属性让你访问单元格中正在渲染的特定日期。\n\n\
  从 `Calendar1_DayRender` 事件中执行的操作，你可以看到这两个属性都被使用了。首先，`Cell` 属性将单元格的垂直对齐设置为 `Top`。如果不这样做，当其中一个单元格有内容时，表格可能会看起来有点奇怪。接下来进行检查以确定正在渲染的日期（通过\
  \ `Day` 属性检查）是否是该月的 25 号。如果是，则使用 `Cell` 属性运行 `If Then` 语句来更改该单元格的样式。样式更改添加了一个控件，并更改了单元格的边界和颜色。\n\
  \n所示，处理日历中的单个日期非常简单。你可以轻松地赋予它们想要的内容和外观。\n\n`Day` 属性的一个很棒的功能是，你可以将 `Day` 属性的 `IsSelectable`\
  \ 属性设置为 `False` 来关闭选择特定日期或日期范围的选项：\n\nVB\n```vb\nPublic Sub Calendar1_DayRender(sender\
  \ As Object, e As DayRenderEventArgs)\n    If (e.Day.Date < DateTime.Now) Then\n\
  \        e.Day.IsSelectable = False\n    End If\nEnd Sub\n```\nC#\n```csharp\npublic\
  \ void Calendar1_DayRender(Object sender, DayRenderEventArgs e)\n{\n    if (e.Day.Date\
  \ < DateTime.Now)\n    {\n        e.Day.IsSelectable = false;\n    }\n}\n```\n\n\
  ### ADROTATOR 服务器控件\n\n尽管网络用户觉得广告相当烦人，但广告在网上仍然随处可见。通过 AdRotator 控件，你可以配置你的应用程序向最终用户显示一系列广告。通过此控件，你可以使用来自该控件早期版本使用的标准\
  \ XML 文件以外来源的广告数据。\n\n如果你使用 XML 源作为广告信息，首先创建一个 XML 广告文件。该广告文件允许你包含一些元素，让你对广告的外观和行为有很大的控制。列表\
  \ 5-23 显示了 XML 广告文件的示例。\n\n此 XML 文件用于存储出现在你的应用程序中的广告信息，在表 5-1 中详细列出了几个元素。记住所有元素都是可选的。\n\
  \n| 元素 | 说明 |\n| --- | --- |\n| `ImageUrl` | 接收一个字符串值，指示要使用的图像位置。 |\n\n\n\n\n\n\
  | `NavigateUrl` | 接收一个字符串值，表示点击图像时跳转的 URL。 |\n| `AlternateText` | 接收一个字符串值，当客户端浏览器禁用图像或未找到图像时用于显示。\
  \ |\n| `Impressions` | 接收一个数值值，表示该图像被选中显示的概率。 |\n| `Keyword` | 接收一个字符串值，用于设置图像的类别以便进行广告过滤。\
  \ |\n\n**表 5-1**\n\n现在 XML 广告文件已经准备就绪，你可以直接使用 `AdRotator` 控件从该文件中读取内容。列表 5-24 展示了此操作的示例。\n\
  \n该示例展示了 XML 广告文件中指定的广告作为页面顶部的横幅广告显示。\n\n你不需要将所有广告信息都放在 XML 广告文件中。相反，你可以使用另一个数据源并绑定到\
  \ `AdRotator`。例如，你可以将 `AdRotator` 绑定到一个 `SqlDataSource` 对象，该对象以以下方式从 SQL Server\
  \ 获取广告信息：\n\n```\n<asp:AdRotator ID=\"AdRotator1\" runat=\"server\"\n    DataSourceId=\"\
  SqlDataSource1\" AlternateTextField=\"AlternateTF\"\n    ImageUrlField=\"Image\"\
  \ NavigateUrlField=\"NavigateUrl\" />\n```\n\n`AlternateTextField`、`ImageUrlField`\
  \ 和 `NavigateUrlField` 属性指向 SQL Server 中用于这些项的列名。\n\n## XML 服务器控件\n\n`Xml` 服务器控件提供了获取\
  \ XML 并使用 XSL 样式表对其进行转换的方法。`Xml` 控件可以通过两种方式与你的 XML 配合工作。最简单的方法是使用列表 5-25 所示的结构。\n\
  \n这种方法只需要几个属性即可运行：`DocumentSource` 指向 XML 文件的路径，`TransformSource` 提供转换 XML 文档所需的\
  \ XSLT 文件。\n\n使用 `Xml` 服务器控件的另一种方法是将 XML 加载到对象中，然后将该对象传递给 `Xml` 控件，如列表 5-26 所示。\n\
  \n为了实现这一功能，你必须确保在页面导入了 `System.Xml` 和 `System.Xml.Xsl` 命名空间。示例加载了 XML 和 XSL 文件，然后将这些文件赋值为\
  \ `Document` 和 `Transform` 属性的值。\n\n## PANEL 服务器控件\n\n`Panel` 服务器控件封装了一组你可以用于操作或布局\
  \ ASP.NET 页面的控件。它本质上是其他控件的包装器，允许你将一组服务器控件与其他元素（如 HTML 和图像）结合并转变为单个单元。\n\n使用 `Panel`\
  \ 控件封装一组其他元素的优势是，你可以通过 `Panel` 控件本身设置的一组属性作为一个单个单元来操作这些元素。例如，将 `Font-Bold` 属性设置为\
  \ `True` 会导致 `Panel` 控件内的每个项目都采用该属性。\n\n`Panel` 控件还具有滚动条功能，滚动条会根据 `Panel` 控件包含的信息量自动出现。你甚至可以指定滚动条外观。\n\
  \n关于滚动条的示例，请查看长版本的 Lorem Ipsum 文本（可在 [`www.lipsum.com`](http://www.lipsum.com) ），并将该文本放置在\
  \ `Panel` 控件中，如列表 5-27 所示。\n\n通过为 `Panel` 服务器控件的 `Height` 和 `Width` 属性赋值并使用 `ScrollBars`\
  \ 属性（在此情况下设置为 `Auto`），你可以使用滚动条在定义的区域内显示其包含的信息（参见图 5-28）。\n\n![image](img/f163-01.jpg)\n\
  \n**图 5-28**\n\n如你所见，在 300 × 300 像素的设置区域添加了一个垂直滚动条。`Panel` 控件默认根据需要对换文本。要更改此行为，请使用\
  \ `Wrap` 属性，它接收一个 `boolean` 值：\n\n```\n<asp:Panel ID=\"Panel1\" runat=\"server\"\
  \ Height=\"300\" Width=\"300\"\n    ScrollBars=\"auto\" Wrap=\"False\" />\n```\n\
  \n关闭换行可能会导致水平滚动条开启（取决于面板区域包含的内容）。\n\n如果你不想让 ASP.NET 引擎选择激活哪些滚动条，实际上你可以通过 `ScrollBars`\
  \ 属性来做决定。除了 `Auto` 之外，它的值包括 `None, Horizontal, Vertical` 和 `Both`。\n\n另一个让你更改 `Panel`\
  \ 控件行为的有趣属性是 `HorizontalAlign`。它允许你设置 `Panel` 控件中内容的水平对齐方式。该属性的可能值包括 `NotSet, Center,\
  \ Justify, Left` 和 `Right`。图 5-29 显示了一组具有不同水平对齐的 `Panel` 控件。\n\n![image](img/f164-01.jpg)\n\
  \n**图 5-29**\n\n使用 `Direction` 属性可以将垂直滚动条移动到 `Panel` 控件的左侧。`Direction` 可以设置为 `NotSet,\
  \ LeftToRight` 和 `RightToLeft`。当你处理从右向左写的语言（例如某些亚洲语言）时，设置 `RightToLeft` 是理想的。然而，该设置也会滚动条移动到\
  \ `Panel` 控件的左侧。如果滚动条移动到左侧且 `HorizontalAlign` 属性设置为 `Left`，则你的内容类似于图 5-30。\n\n![image](img/f164-02.jpg)\n\
  \n**图 5-30**\n\n## PLACEHOLDER 服务器控件\n\n`PlaceHolder` 服务器控件的作用顾如其名——它是一个占位符，供你动态地向页面插入对象。将其视为一个标记，你可以通过它添加控件。在特定点添加控件的功能也适用于\
  \ `Panel` 控件。\n\n要查看其工作原理，请在页面中插入 `PlaceHolder` 控件，然后按照列表 5-28 所示的方式从服务器端添加控件。\n\
  \n此示例创建了 `Label` 控件实例，并在添加到 `PlaceHolder` 控件之前对其赋值。你可以向单个 `PlaceHolder` 实例添加多个控件。\n\
  \n## BULLETEDLIST 服务器控件\n\n一种常见的 HTML 页面元素是项目集合。BulletedList 服务器控件旨在以有序（使用 HTML\
  \ `<ol>` 元素）或无序（使用 HTML `<ul>` 元素）方式轻松显示符号列表。此外，控件可以决定用于列表的样式。\n\n`BulletedList`\
  \ 控件可以由任意数量的 `<asp:ListItem>` 控件组成，也可以绑定到某种数据源并根据检索的内容进行填充。列表 5-29 展示了最简单形式的符号列表。\n\
  \n使用 `<asp:BulletedList>` 元素配合 `<asp:ListItem>` 元素会产生类似于图 5-31 所示的简单符号列表输出。\n\n\
  ![image](img/f166-01.jpg)\n\n**图 5-31**\n\n`BulletedList` 控件还允许你通过一个或两个属性轻松更改列表样式。`BulletStyle`\
  \ 属性更改列表行前面符号的样式。它的可能值包括 `Numbered, LowerAlpha, UpperAlpha, LowerRoman, UpperRoman,\
  \ Disc, Circle, Square, NotSet` 和 `CustomImage`。图 5-32 显示了这些样式的示例（不包括允许使用任何自定义图像的\
  \ `CustomImage` 设置）。\n\n![image](img/f167-01.jpg)\n\n\n\n\n\n### 图 5-32\n\n你可以通过\
  \ `FirstBulletNumber` 属性更改任何编号样式（`Numbered`、`LowerAlpha`、`UpperAlpha`、`LowerRoman`、`UpperRoman`）第一个项目的起始值。例如，当你使用\
  \ `UpperRoman` 设置并将该属性的值设置为 `5` 时，你将如图 5-33 所示的格式。\n\n![image](img/f167-02.jpg)\n\
  \n### 图 5-33\n\n要将图像作为项目符号，请在 `BulletedList` 控件中使用 `CustomImage` 设置。你还按照以下方式使用 `BulletImageUrl`\
  \ 属性：\n\n```\n<asp:BulletedList ID=\"Bulletedlist1\" BulletStyle=\"CustomImage\"\
  \ \n    BulletImageUrl=\"~/search.jpg\" runat=\"server\">\n```\n\n图 5-34 显示了图像符号的示例。\n\
  \n![image](img/f168-01.jpg)\n\n### 图 5-34\n\n`BulletedList` 控件有一个名为 `DisplayMode`\
  \ 的属性，具有三个可能的值：`Text, HyperLink` 和 `LinkButton`。`Text` 是默认值，到目前为止示例一直在使用它。使用 `Text`\
  \ 意味着列表项目仅以文本形式布局。`HyperLink` 意味着每个项目都转换为超链接——任何点击链接的用户都将被重定向到另一个页面，该页面由 `<asp:ListItem>`\
  \ 控件的 `Value` 属性指定。`LinkButton` 值将每个列表项目转换为一个回传到相同页面的超链接。它允许你检索终端用户所做的选择，如代码列表 5-30\
  \ 所示。\n\n在此示例中，`DisplayMode` 属性设置为 `LinkButton`，并使用 `OnClick` 属性指向 `BulletedList1_Click`\
  \ 事件。`BulletedList1_Click` 使用 `BulletedListEventArgs` 对象，该对象仅暴露 `Index` 属性。使用该属性你可以确定所选项目的索引数字。\n\
  \n你可以直接通过 `Items` 属性访问所选项目的 `Text` 值，或者你可以使用相同的属性填充 `ListItem` 对象的实例，如下所示：\n\n**VB**\n\
  \n```\nDim blSelectedValue As ListItem = BulletedList1.Items(e.Index)\n```\n\n**C#**\n\
  \n```c\nListItem blSelectedValue = BulletedList1.Items[e.Index];\n```\n\n现在你已经了解了如何创建代码中声明式放置项目的列表，现在请看看如何从存储在数据存储中的项目创建动态列表。接下来的示例显示了如何使用\
  \ `BulletedList` 控件对来自数据存储器的结果进行数据绑定；其中，所有信息都从一个 XML 文件检索。\n\n第一步是在代码列表 5-31 中创建\
  \ XML。\n\n要使用 `Listing05-31.xml` 文件中的 `Title` 属性填充 `BulletedList` 服务控件，请使用 `XmlDataSource`\
  \ 控件访问该文件，如代码列表 5-32 所示。\n\n在此示例中，你使用 `DataSourceID` 属性指向 `XmlDataSource` 控件（就像指向任何可以绑定到数据源控件之一的控件一样）。连接到数据源控件后，你专门使用\
  \ `DataTextField` 属性指向 `Title` 属性。在两个服务器控件连接并运行页面后，你将获得一个完全由 XML 文件内容生成的列表。图 5-35\
  \ 显示了结果。\n\n![image](img/f170-01.jpg)\n\n### 图 5-35\n\n## HIDDENFIELD 服务控件\n\n多年来，开发者一直在网页中使用隐藏域字段（hidden\
  \ fields）来处理状态管理。`<input type=\"hidden\">` 元素非常适合存储没有安全上下文的项目。这些项目仅仅是数据占位符，你希望将其存储在页面本身，而不是使用\
  \ `Session` 对象或将数据与页面视图状态（ViewState）混合。视图状态（在第 7 章中详细讨论）是在页面中存储信息的另一种极方法，但许多开发者会关闭此功能以避免视图状态损坏或可能的页面性能下降。\n\
  \n每当隐藏字段放置在网页中，它在浏览器中都不会以任何方式解释，尽管如果终端用户查看 HTML 页面的源代码，它是完全可见的。\n\n代码列表 5-33 是一个使用\
  \ `HiddenField` 服务控件持有 GUID 的示例，通过在终端用户导航浏览应用程序时携带其值，该 GUID 可以在页面之间传递使用。\n\n\n\n\
  \n\n```html\n<!DOCTYPE html>\n<html xmlns=\"http://www.w3.org/1999/xhtml\">\n<head><title>\n\
  \    FileUpload 服务器控件\n</title></head>\n<body>\n    <form method=\"post\" action=\"\
  Listing05-34.aspx\" id=\"form1\" \n      enctype=\"multipart/form-data\">\n<div\
  \ class=\"aspNetHidden\">\n<input type=\"hidden\" name=\"__VIEWSTATE\" id=\"__VIEWSTATE\"\
  \ value=\"YkgBQVHMwxdJnFcwbHY\nG5i9hOlxcWnVeP+bjjdfpcRzkW30vLjxP75xY0wPaGlfa6YBcCAKm7gdi/7tonGDExufgpgIGwHE4yb0t6\n\
  jWepmD1DxH9i0/G69Pmr76WXQjPZcoaO7Uxyh9sbhqER1zcqg==\" />\n</div>\n<div class=\"\
  aspNetHidden\">\n       <input type=\"hidden\" name=\"__EVENTVALIDATION\" id=\"\
  __EVENTVALIDATION\" \n         value=\"gNlwD1eVXBy2QmFixsfWZQGK7o0wSftXvY9Ff6ULdXYbqETya2cdZ5Ta2AmMcsvGIR\n\
  \         BNBJ3tCi8FgYsxjwfTlGGECrta3LiwFjipySbNhzhtwnY8sGfd9ygP96s9/aSE\" />\n\
  </div>\n        <input type=\"file\" name=\"FileUpload1\" id=\"FileUpload1\" />\n\
  \        <p>\n            <input type=\"submit\" name=\"Button1\" value=\"Upload\"\
  \ id=\"Button1\" />\n        </p>\n        <p>\n            <span id=\"Label1\"\
  ></span\n        </p>\n    </form>\n</body>\n</html>\n```\n\n首先需要注意的是，由于页面上存在 `FileUpload`\
  \ 控件，ASP.NET 4.5 会代表你修改页面的 `<form>` 元素，添加适当的 `enctype` 属性。此外，请注意 `FileUpload` 控件已转换为\
  \ HTML 的 `<input type=\"file\">` 元素。\n\n文件上传后，第一个检查（在文件的 `Button1_Click` 事件处理程序中完成）会检查文件引用是否放置于\
  \ `<input type=\"file\">` 元素中。如果指定了文件，将尝试使用 `FileUpload` 控件的 `SaveAs()` 方法将引用的文件上传到服务器。该方法接受单个\
  \ `String` 参数，参数应包含你想保存文件的位置。在 Listing 5-34 中使用的 `String` 参数中，你可以看到文件被保存到名为 `Uploads`\
  \ 的文件夹中，该文件夹位于 `C:\\` 盘。\n\n`PostedFile.FileName` 属性用于为保存的文件提供与其源文件相同的名称。如果你想给文件重命名，只需按照如下方式使用\
  \ `SaveAs()` 方法：\n\n```\nFileUpload1.SaveAs(\"C:\\Uploads\\UploadedFile.txt\")\n\
  ```\n\n你也可以给文件指定包含上传时间的名称：\n\n```\nFileUpload1.SaveAs(\"C:\\Uploads\\\" & System.DateTime.Now.ToFileTimeUtc()\
  \ & \".txt\")\n```\n\n上传成功完成后，页面上的 Label 控件将填充上传文件的元数据。在示例中，获取文件的名称、大小和内容类型，并在页面上显示给终端用户。当文件上传到服务器时，生成的页面类似于\
  \ 图 5-36 所示所示。\n\n![image](img/f175-01.jpg)\n\n**图 5-36**\n\n将文件上传到另一个服务器是一项容易出错的任务。在代码中使用适当的异常处理来上传文件至关重要。这就是为什么示例中的文件是通过\
  \ `Try Catch` 语句上传的。\n\n### 为 ASP.NET 提供适当的上传权限\n\n当你的终端用户通过应用程序中的 `FileUpload`\
  \ 控件将文件上传到 Web 服务器时，可能会遇到错误。这可能是因为服务器上的目标文件夹对于 ASP.NET 使用的帐户是不可写的。如果 ASP.NET 未启用写入你所在的文件夹，你可以使用文件夹的属性启用它。\n\
  \n首先，右键点击应上传 ASP.NET 文件的文件夹，从提供的菜单中选择“属性”。打开所选文件夹的属性对话框。点击“安全”选项卡，确保 `IIS_IUSRS`\
  \ 账户在列表中，并具有写入磁盘的适当权限。如果已启用，你将看到与 图 5-37 所示的内容。\n\n![image](img/f175-02.jpg)\n\n\
  **图 5-37**\n\n如果你在允许访问文件夹的用户列表中没有看到 `IIS_IUSRS` 账户，点击“添加”按钮并在提供的文本区域中输入 `IIS_IUSRS`\
  \ 来添加它（参见 图 5-38）。\n\n![image](img/f175-03.jpg)\n\n**图 5-38**\n\n### 从同一页面上传多个文件\n\
  \n\n\n\n到目前为止，你已经看到了一些如何方便地将文件上传到服务器的良好示例。现在，让我们来看如何从单个页面向服务器上传多个文件。\n\nMicrosoft\
  \ .NET Framework 并没有内置允许你从单个 ASP.NET 页面上传多个文件的功能。然而，只需稍作努力，你就可以轻松地完成这项任务，就像你过去使用\
  \ `.NET 1.*x*` 那样。\n\n技巧在于向你的 ASP.NET 页面中导入 `System.IO` 类，然后使用 `HttpFileCollection`\
  \ 类来捕获通过 `Request` 对象发送的所有文件。这种方法使你能够从单个页面上传任意数量的文件。\n\n如果你愿意，可以逐个处理页面上的每个 `FileUpload`\
  \ 控件，如 代码清单 5-36 所示。\n\n如果你处理的文件上传框数量有限，这种方法是有效的；但同时，在某些情况下，你可能仍然想使用 `HttpFileCollection`\
  \ 类来处理文件。当你正在 ASP.NET 页面上处理动态生成的服务器控件列表时，这一点尤为真实。\n\n为了说明这一点，你可以构建一个拥有三个 `FileUpload`\
  \ 控件和一个提交按钮（使用 `Button` 控件）的 ASP.NET 页面。在用户点击提交按钮并将文件提交到服务器后，后端代码将获取文件并将其保存到服务器上的特定位置。文件保存后，提交的文件信息将显示在\
  \ ASP.NET 页面上（参见 代码清单 5-37）。\n\n此 ASP.NET 页面允许最终用户选择最多三个文件并点击“上传文件”按钮，这将初始化 `Button1_Click`\
  \ 事件。使用带有 `Request.Files` 属性的 `HttpFileCollection` 类可以让你控制从从页面上传的所有文件。当文件处于这种状态时，你可以对它们进行任何你想的操作。在这种情况下，文件的属性被将被检查并显示在屏幕上。最后，文件被保存到服务器根目录下的\
  \ Uploads 文件夹中。此操作的结果如图 图 5-39 所示。\n\n![image](img/f180-01.jpg)\n\n**图 5-39**\n\n\
  ### 将上传的文件放入流对象\n\n`FileUpload` 控件的一个很棒的功能是，它不仅赋予你将文件保存到磁盘的能力，还让你将文件内容放入 `Stream`\
  \ 对象中。你通过使用 `FileContent` 属性来实现这一点，如 代码清单 5-38 所示。\n\n在这个短示例中，创建了一个 `Stream` 对象的实例。然后，使用\
  \ `FileUpload` 控件的 `FileContent` 属性将上传文件的内容放入该对象中。这是可能的，因为 `FileContent` 属性返回一个\
  \ `Stream` 对象。\n\n### 将文件内容从流对象移动到字节数组\n\n由于你有将文件内容移动到某种 `Stream` 对象的能力，因此将文件内容移动到\
  \ `Byte` 数组也相当简单（对于将文件放入某种数据库之类的操作非常有用）。要这样做，首先将文件内容移动到 `MemoryStream` 对象，然后将该对象转换为必要的\
  \ `Byte` 数组对象。代码清单 5-39 显示了这一过程。\n\n在这个示例中，创建了 `Byte` 数组实例和 `MemoryStream` 对象实例。首先，如你之前所的那样，使用\
  \ `FileUpload` 控件的 `FileContent` 属性创建 `MemoryStream` 对象。然后使用 `MemoryStream` 对象的\
  \ `ToArray()` 方法来填充 `myByteArray()` 实例是非常简单的。在文件放入 `Byte` 数组后，你可以根据需要对文件内容进行处理。这是将文件保存为\
  \ Microsoft SQL Server 的 `Image` 格式的常用方法。\n\n## 多视图和视图控件\n\nMultiView 和 View 服务器控件协同工作，赋予了你开启/关闭\
  \ ASP.NET 页面部分内容的能力。开启和关闭部分（意味着激活或停用 MultiView 控件内的系列 View 控件）与更改 Panel 控件的可见性相似。然而，对于某些操作，你可能会发现\
  \ MultiView 控件更容易管理和使用。\n\n部分（或视图）不会在客户端发生变化；相反，它们随着服务器的回传（postback）而变化。你可以在每个视图中放置任意数量的元素和控件，最终用户可以根据你分配给视图的序号来切换视图。\n\
  \n你可以从源代码视图或设计视图构建这些控件（与所有服务器控件一样）。如果使用 Visual Studio 2012，你可以将 MultiView 控件拖放到设计表面上，然后在\
  \ MultiView 控件内部拖放任意数量的 View 控件。在 View 控件中放置你需要的元素。完成后，你将获得一个如图 图 5-40 所示的视图。\n\n\
  ![image](img/f182-01.jpg)\n\n**图 5-40**\n\n你可以从源代码视图或设计视图构建这些控件（与所有服务器控件一样）。如果使用\
  \ Visual Studio 2012，你可以将 MultiView 控件拖放到设计表面上，然后在 MultiView 控件内部拖放任意数量的 View 控件。在\
  \ View 控件中放置你需要的元素。完成后，你将获得一个如图 图 5-40 所示的视图。\n\n### 使用 MultiView 进行导航\n\n部分（或视图）不会在客户端发生变化；相反，它们随着服务器的回传而变化。你可以在每个视图中放置任意数量的元素和控件，最终用户可以根据你分配给视图的序号来切换视图。\n\
  \n此 ASP.NET 页面允许最终用户选择最多三个文件并点击“上传文件”按钮，这将初始化 `Button1_Click` 事件。使用带有 `Request.Files`\
  \ 属性的 `HttpFileCollection` 类可以让你控制从页面上传的所有文件。当文件处于这种状态时，你可以对它们进行任何你想的操作。在这种情况下，文件的属性将将被检查并显示在屏幕上。最后，文件被保存到服务器根目录下的\
  \ Uploads 文件夹中。此操作的结果如图 图 5-39 所示。\n\n\n\n\n现在，当处理 MultiView 控制时，终端用户在第一个视图上看到 `Step\
  \ 1 of 3`，在下一个视图中，它会变为 `Step 2 of 3`，依此类推。\n\n## 向向器服务器控件 (WIZARD SERVER CONTROL)\n\
  \n与 MultiView 控制类似，向导服务器控件允许你构建一个显示给终端用户的步骤序列。网页的核心在于显示或收集信息，在许多情况下，你并不希望一次性显示所有信息——也不总是想一次性从终端用户那里收集所有信息。\n\
  \n当你构建一个包含步骤执行逻辑的逐步进行的过程时，请使用向导控件来管理整个过程。第一次使用向导控件时，你会发现它允许的自定义程度远比 MultiView 控制得多。\n\
  \n在最简单的形式中，向导控件可以是一个包含任意数量 `<asp:WizardStep>` 元素的 `<asp:Wizard>` 元素。代码清单 5-41 创建了一个包含三个步骤并运行的向导控件。\n\
  \n在这个示例中，通过 `<asp:WizardSteps>` 控制定义了三个步骤。每个步骤都包含内容——在此例中仅为文本，尽管你可以放入任何想要的内容，例如其他\
  \ Web 服务器控件甚至用户控件。`WizardSteps` 的定义顺序完全基于它们在 `<WizardSteps>` 元素中出现的顺序。\n\n`<asp:Wizard>`\
  \ 元素包含几个重要的属性。第一个是 `DisplaySideBar`。在示例中，它默认设置为 `True`——这意味着显示控件中的侧边导航系统允许终端用户快速导航到过程中的其他步骤。向导控件的\
  \ `ActiveStepIndex` 属性定义第一个向导步骤。在这种情况下，它是第一步——`0`。\n\n示例向导控件的三个步骤如图 5-42 所示。\n\n\
  ![image](img/f186-01.jpg)\n\n**图 5-42**\n\n侧边导航允许轻松访问定义的步骤。向导控件为过程中的步骤添加了适当的按钮。第一步只有一个\
  \ Next（下一步）按钮，中间步骤有 Previous（上一步）和 Next（下一步）按钮，最后一步有 Previous（上一步）和 Finish（完成）按钮。用户可以使用侧边导航或每个步骤上的按钮在步骤之间导航。你可以以许多方式自定义向导控件，这让你联起\
  \ ASP.NET 中其他丰富的 Web 服务器控件，例如日历控件。由于有很多可以实现，这里只涵盖了少数基础知识——即你自己在构建的某些向导控件中最可能使用的部分。\n\
  \n### 自定义侧边导航\n\n图 5-42 示例中的步骤定义为 Step 1、Step 2 和 Step 3。链接是根据你赋予向导控件中每个 `<asp:WizardStep>`\
  \ 元素的 `Title` 属性值创建的：\n\n```asp\n <asp:WizardStep ID=\"WizardStep1\" runat=\"server\"\
  \ Title=\"Step 1\">\n      This is the first step.\n  </asp:WizardStep>\n```\n\n\
  默认情况下，在设计视图中创建的每个向导步骤标题均为 `Step X`（其中 `X` 是序列中的数字）。你可以轻松更改每个向导步骤的 `Title` 属性值，以根据你的需要定义步骤。图\
  \ 5-43 显示了重命名标题后的向导控件侧边导航。\n\n![image](img/f187-01.jpg)\n\n**图 5-43**\n\n### 检查\
  \ AllowReturn 属性\n\n向导控件侧边导航部分的另一个有趣的自定义点是 `AllowReturn` 属性。通过将其中一个向导步骤的此属性设置为 `False`，你可以移除终端用户在查看过该步骤后返回该步骤的能力。终端用户无法导航回任何包含该属性的已查看步骤，但他可以返回任何不包含该属性或该属性设置为\
  \ `True` 的步骤：\n\n```asp\n <asp:WizardStep ID=\"WizardStep1\" runat=\"server\" AlowReturn=\"\
  False\" \n      Title=\"The very first step\">This is the first step.</asp:WizardStep>\n\
  ```\n\n### 使用 StepType 属性\n\n`<asp:WizardStep>` 元素中的另一个有趣的属性是 `StepType`。`StepType`\
  \ 属性定义了步骤上使用的按钮结构。默认情况下，向导控件在第一步上只放置一个 Next 按钮。它理解你那里不需要 Previous 按钮。它还知道在中间步骤使用\
  \ Next 和 Previous 按钮，并在最后一步使用 Previous 和 Finish 按钮。它以这种方式绘制按钮，是因为默认情况下 `StepType`\
  \ 属性设置为 `Auto`，这意味着由向导控件决定按钮的布局。然而，你可以接管 `<asp:WizardStep>` 元素中的 `StepType` 属性，自行决定哪些步骤使用哪些按钮。\n\
  \n除了 `Auto` 外，`StepType` 的值选项还包括 `Start, Step, Finish` 和 `Complete`。`Start` 意味着定义的步骤只有一个\
  \ Next 按钮。它仅允许用户继续进入系列中的下一步。`Step` 值意味着该步骤有 Next 和 Previous 按钮。`Finish` 值意味着该步骤有\
  \ Previous 和 Finish 按钮。`Complete` 值意味着该步骤只有一个 Finish 按钮。\n\n### 为向导控件添加头部\n\n向导控件允许你通过主\
  \ `<asp:Wizard>` 元素中的 `HeaderText` 属性在控件顶部放置头部。代码清单 5-43 提供了一个示例。\n\n此代码创建了出现在每个步骤上的头部。该代码段的结果如图\
  \ 5-44 所示。\n\n![image](img/f189-01.jpg)\n\n**图 5-44**\n\n### 使用向导的导航系统\n\n如前所述，向导控件允许极高程度的自定义——是在样式方面。你可以自定义过程的每个方面，以及每个元素向终端用户呈现的方式。\n\
  \n特别注意用于自定义导航按钮的选项。默认情况下，向导步骤在整个系列步骤中使用 Next、Previous 和 Finish 按钮。通过主 `<asp:Wizard>`\
  \ 元素，你可以更改这些按钮的所有属性及其工作方式。\n\n首先，如果你浏览该元素的可用属性列表，注意这里有一个可用按钮没有显示：Cancel 按钮。将 `DisplayCancelButton`\
  \ 属性的值设置为 `True`，在每个步骤创建的导航中就会一个 Cancel 按钮，包括系列中的最后一步。图 5-45 显示了步骤中的 Cancel 按钮。\n\
  \n![image](img/f189-02.jpg)\n\n**图 5-45**\n\n\n\n\n在决定了在向导导航中使用哪些按钮后，您可以选择它们的样式。默认情况下会显示普通按钮；您可以通过\
  \ `CancelButtonType`、`FinishStepButtonType`、`FinishStepPreviousButtonType`、`NextStepButtonType`、`PreviousStepButtonType`\
  \ 和 `StartStepNextButtonType` 属性更改按钮样式。如果您使用了这些按钮类型并希望所有按钮的样式保持一致，则必须将每个属性更改为相同的值。这些特定按钮元素的可能值包括\
  \ `Button`、`Image` 和 `Link`。`Button` 是默认值，意味着导航系统使用按钮。`Image` 值允许您使用图像按钮，而 `Link`\
  \ 则将导航系统中的选定项目转换为链接。\n\n除了 `<asp:Wizard>` 元素的这些特定按钮属性外，您还可以指定用户在点击取消（Cancel）或完成（Finish）按钮时重定向到的\
  \ URL。要使用这些按钮之一重定向用户，您可以使用 `CancelDestinationPageUrl` 或 `FinishDestinationPageUrl`\
  \ 属性，并将相应的 URL 设置为目标。\n\n最后，您不需要使用导航系统中按钮自带的默认文本。您可以使用 `CancelButtonText`、`FinishStepButtonText`、`FinishStepPreviousButtonText`、`NextStepButtonText`、`PreviousStepButtonText`\
  \ 和 `StartStepNextButtonText` 属性更改每个按钮的文本。\n\n### 利用向导控件事件\n\n向导控件最方便的功能之一是它允许您将大型表单分为逻辑部分。终端用户随后可以系统地处理表单的每个部分。开发者在处理表单输入值时，由于向导控件提供了各种事件，他们有多种选择。\n\
  \n向导控件为终端用户在操作控件时可能采取的每个步骤暴露了事件。表 5-2 描述了每个可用的事件。\n\n| 事件 | 描述 |\n| --- | --- |\n\
  | `ActiveStepChanged` | 当终端用户从一个步骤移动到下一步时触发。无论该步骤是系列中的中间步骤还是最后一步。此事件通用地涵盖了每个步骤的变化。\
  \ |\n| `CancelButtonClick` | 当终端用户点击导航系统中的取消按钮时触发。 |\n| `FinishButtonClick` | 当终端用户点击导航系统中的完成按钮时触发。\
  \ |\n| `NextButtonClick` | 当终端用户点击导航系统中的下一个按钮时触发。 |\n| `PreviousButtonClick` | 当终端用户点击导航系统中的上一个按钮时触发。\
  \ |\n| `SideBarButtonClick` | 当终端用户点击向导控件侧边栏导航中包含的链接之一时触发。 |\n\n**表 5-2**\n\n通过处理这些事件，您可以创建一个多步骤表单，当用户从一个步骤更改到下一个步骤时保存用户所有的输入信息。您还可以使用\
  \ `FinishButtonClick` 事件在过程结束时保存在每个步骤中的所有内容。向导控件通过页面视图状态（view state）记住终端用户在每个步骤中的所有输入，允许您在最后一步处理所有这些值。它还赋予终端用户返回之前的步骤并在这些值保存到数据存储之前更改它们的能力。\n\
  \n该事件出现在您的后台代码或内联代码中，如 列表 5-44 所示。\n\n应向主 `<asp:Wizard>` 元素添加 `OnFinishButtonClick`\
  \ 属性以指向 `Wizard1_FinishButtonClick` 事件。列表 5-45 显示了如何进行操作。\n\n向导控件是优秀的控件之一，允许您将较长的工作流拆分为更易管理的各个供终端用户使用。通过将较长的\
  \ Web Forms 拆分为各种向导步骤，您可以有效地让您的表单易于理解，并减少终端用户的畏难感。\n\n### 使用向导控件显示表单元素\n\n到为止，您已经学习了如何操作向导控件的每个步骤，包括如何向过程添加步骤以及如何处理控件的样式。现在看看如何将表单元素放入向导控件中，以便分步骤从终端用户那里收集信息。这与在每个步骤中使用文本的向导控件第一个示例一样简单。\n\
  \n将表单元素放入向导步骤过程中的一个优点是，向导控件会从一个步骤到记住表单元素中的每个输入，允许您在最后一步保存整个表单的结果。这意味着当终端用户按下“上一个”按钮时，之前输入到表单的数据仍然在那里，并且可以更改。\n\
  \n列表 5-46 显示了通过构建注册过程来分步输入表单信息的过程的第一部分。该过程的最后一步将结果保存到您选择的数据库，尽管在这个示例中，您只是将结果推送到页面上的\
  \ Label 控件上。\n\n此向导控件有三个步骤。第一步询问用户的个人信息，第二步询问用户的会员信息。第三步包含一个 Label 控件，输出所有输入的信息。这是通过针对第三个\
  \ `WizardStep` 控件对象的特定 `Activate` 事件实现的。`WizardStep3_Activate` 事件的代码如 列表 5-47 所示。\n\
  \n当终端用户进入第三个步骤时，调用 列表 5-47 中的 `WizardStep3_Activate` 方法。通过第三个 `WizardStep` 控件中的\
  \ `OnActivate` 属性，使用用户在之前的步骤提供的内容来填充 Label 控件。这三个步骤如图 5-46](#Chapter05.xhtml_figure5-46)\
  \ 所示。\n\n![image](img/f193-01.jpg)\n\n**图 5-46**\n\n这个示例简单直接，但您也可以稍微增加复杂性。假设您想向过程添加另一个\
  \ `WizardStep` 控件，并且只有当用户在 `Wizard2` 中指定他是会员时才显示它。如果他从单选按钮回答自己不是会员，则让他跳过该步骤并直接进入在\
  \ Label 控件中显示结果的最后步骤。首先，向向导控件添加一个 `WizardStep`，如 列表 5-48 所示。\n\n工作流中添加了一个步骤——它仅仅是询问会员其会员号。由于要检查是否在过程中显示某个特定步骤，请使用向导控件的\
  \ `NextButtonClick` 事件。该事件使用 `WizardNavigationEventArgs` 类而不是典型的 `EventArgs` 类，后者允许您访问\
  \ `NextStepIndex` 数字，以及 `CurrentStepIndex` 数字。\n\n\n\n\n在 Listing 5-49 的示例中，你检查流程中即将呈现的下一步是否为\
  \ `2`。记住，这是从 0 开始的索引（0, 1, 2 等）的索引 `2`。如果是索引中的第 `2` 步，你会检查上一个 `WizardStep`选中了哪个单选按钮。如果\
  \ `RadioButton1` 控件被选中（意味着用户是成员），则流程的下一步将被赋值为索引 `2`。如果选择了 `RadioButton2` 控件，则用户不是成员，此时索引被赋值为\
  \ `3`（最后一步），从而跳过流程中的成员步骤。\n\n你也可以参考此示例并进行轻微修改，以便仅在用户包含某个特定角色（如 Admin 角色）时才显示 `WizardStep`。\n\
  \n当用户包含特定角色时仅显示 `WizardStep` 的示例已在 Listing 5-50 中演示。\n\n## IMAGAPAP 服务器控件\n\nImageMap\
  \ 服务器控件允许你将图像转换为导航菜单。在过去，许多开发者会将一张图像拆分成多个部分，然后在表格中重新组合，将这些碎片重新装成一张图像。当最终用户点击整体图像的特定部分时，应用程序会识别出选择了图像的哪个部分并根据该特定选择执行操作。\n\
  \n使用 ImageMap 控件，你可以取单个图像并使用坐标在图像上指定热点（hotspots）。示例在 Listing 5-51 中所示。\n\n此页面显示了一张我和孩子在水族馆的照片。如果你点击其中一个孩子的脸，该孩子的名字将写入\
  \ `Response` 流中，如 Figure 5-47 所示。\n\n![image](img/f197-01.jpg)\n\n**图 5-47**\n\n\
  ImageMap 控件允许你通过几种不同的方式指定热点。从 Listing 5-51 的示例中，你可以看到使用 `<asp:CircleHotSpot>` 元素以圆形方式放置热点。除了\
  \ `<asp:CircleHotSpot>` 控件外，你还可以使用 `<asp:RectangleHotSpot>` 和 `<asp:PolygonHotSpot>`\
  \ 控件。每个控件接受与其形状相应的坐标。\n\n在图像上定义热点后，你可以通过多种方式响应最终用户对热点的点击。你首先在根元素 `<asp:ImageMap>`\
  \ 中使用 `HotSpotMode` 属性来指定如何处理热点点击。\n\n`HotSpotMode` 属性可以取 `PostBack, Navigate` 或\
  \ `InActive` 的值。在之前的示例中，`HotSpotMode` 的值被设置为 `PostBack` —— 意味着在最终用户点击热点后，你想回传到服务器并在该点处理点击。\n\
  \n由于 `HotSpotMode` 被设置为 `PostBack` 且你创建了多个热点，你必须确定选中了哪一个热点。你通过通过 `PostBackValue`\
  \ 属性为每个热点（`<asp:CircleHotSpot>`）提供一个回传值来做出此判断。示例使用 `Arianna、Addison` 和 `Brayden`\
  \ 作为三个热点的值。\n\n`PostBackValue` 属性也是当最终用户将鼠标悬停在热点上时，直接显示在鼠标光标下方（黄色框内）的帮助文本。\n\n在用户点击其中一个热点后，事件过程将在\
  \ `Response.Write` 语句中显示选中的值。\n\n当选择特定热点时，你也可以导航到完全不同的 URL 而不是回传。实现这一点，将主 `<asp:ImageMap>`\
  \ 元素中的 `HotSpotMode` 属性更改为值 `Navigate`。然后，在 `<asp:CircleHotSpot>` 元素中只需使用 `NavigateUrl`\
  \ 属性并分配如果点击该特定热点时应引导用户去的位置：\n\n```\n <asp:ImageMap ID=\"ImageMap1\" runat=\"server\"\
  \ ImageUrl=\"~/Images/kids.jpg\" \n      HotSpotMode=\"Navigate\">\n      <asp:CircleHotSpot\
  \ AlternateText=\"Addison\" NavigateUrl=\"Addison.aspx\" \n          Radius=\"26\"\
  \ X=\"145\" Y=\"372\" />\n      <asp:CircleHotSpot AlternateText=\"Brayden\" NavigateUrl=\"\
  Brayden.aspx\" \n          Radius=\"20\" X=\"181\" Y=\"314\" />\n      <asp:CircleHotSpot\
  \ AlternateText=\"Arianna\" NavigateUrl=\"Arianna.aspx\" \n          Radius=\"28\"\
  \ X=\"245\" Y=\"344\" />\n  </asp:ImageMap>\n```\n\n## 总结\n\n本章探索了许多服务器控件、其功能以及它们提供的特性。通过\
  \ ASP.NET 4.5，你有 50 多个服务器控件可供使用。\n\n由于创建 ASP.NET 时你有这么多服务器控件可用，你必须仔细考虑哪种是该任务的最佳控件。许多控件看起来相似，但它们提供了不同的功能。这些控件确保了你可以为所有浏览器构建可能最好的应用程序。\n\
  \n服务器控件是你 ASP.NET 武器库中可以找到的最有用工具之一。\n\n# 6 验证服务器控件\n\n**本章包含内容：**\n\n- 理解提供的验证控件\n\
  - 同时处理客户端和服务器端验证\n- 启用非侵入式验证（unobtrusive validation）\n\n**本章的 WROX.COM 代码下载**\n\n\
  请注意，本章中的所有代码示例均作为本章在网站 [`wrox.com`](http://www.wrox.com) 下载内容的一部分。\n\n## 理解验证\n\n\
  开发者多年来一直在构建 Web 应用程序。通常的目的是提供或收集信息。在本章中，你将关注 Web 应用的信息收集和验证方面。如果你用应用程序收集数据，那么收集*有效*数据对你来说应该很重要。\n\
  \n验证是你应用于所收集数据的一组规则。这些规则可以多也可以可以少，并可以以严格或松散的方式执行：这实际上取决于你的业务规则和要求。不存在完美的验证过程，因为无论你建立什么规则，某些用户都可能在某种程度上找到作弊的方法。诀窍在于最少的规则和适当的严格性之间找到正确的平衡，同时不损害应用程序的可用性。\n\
  \n\n\n在你学习本章时，你将看到可以应用于表单元素的不同类型的验证规则。请记住，你无法直接验证你所收集的信息的`真实性`；相反，你通过应用规则来响应如下问题：\n\
  \n*   文本框中是否输入了内容？\n*   文本框中输入的数据是否为电子邮件地址？\n\n从这些问题可以看出，你可以对 HTML 元素应用多个单条验证规则（这些示例将在本章稍后出现）。事实上，你可以对单个元素应用任意数量的规则，以增加数据验证的严谨性。\n\
  \n## 客户端验证与服务器端验证\n\n如果你是 Web 开发初学者，可能不知道客户端验证和服务器端验证之间的区别。假设用户在填写完某些信息后点击了表单上的提交按钮。在\
  \ ASP.NET 中发生的情况是，表单被封装在`request` 中发送到应用程序所在的服务器。在请求/响应周期的此阶段，你可以对提交的信息运行验证检查。这样做被称为`服务器端验证`，因为它发生在服务器上。\n\
  \n另一方面，也可以提供一种客户端脚本（通常以 JavaScript 的形式存在）在用户的浏览器中，以便在表单提交回服务器`之前`对表单中的数据进行验证。在这种情况下，`客户端验证`已经发生。\n\
  \n客户端验证对用户来说是快速且响应及时的。这是用户对他们操作的表单的期望。如果表单有误，使用客户端验证可以确保用户尽可能快地获知。原因是客户端验证如果调用得当，会在表单提交回服务器之前执行。客户端验证还将验证所需的压力推给了客户端，这意味着你不需要在服务器上消耗\
  \ CPU 周期来处理，因为客户端可以为你完成工作。\n\n尽管如此，客户端验证是不安全的验证形式。当页面在用户的浏览器中生成时，用户可以很容易地查看页面代码（只需在浏览器中点击右键并选择“查看源代码”）。当他们这样做时，除了页面的\
  \ HTML 代码外，页面相关的所有 JavaScript 都可以查看。如果你在客户端验证表单，老练的黑客很容易将包含（他们想要的）的表单重新提交到你的服务器。也存在这种情况，即客户端禁用了浏览器中的脚本功能——从而使你的验证失效。因此，客户端验证应该被视为对用户的便利和礼貌，而非安全机制。然而，尽管存在风险，客户端验证仍然流行，因为它提供了更好的用户体验。\n\
  \n更安全的验证形式是服务器端验证。服务器端验证意味着验证检查是在服务器上而不是客户端进行的。它更安全，因为这些检查无法被轻易绕过。相反，表单数据使用服务器上的代码（`C#`\
  \ 或 `VB`）进行检查。如果表单数据无效，返回给客户端的页面也将无效。尽管服务器端验证更安全，但它可以缓慢，因为页面必须提交到远程位置进行检查。如果用户在等待\
  \ 20 秒提交表单后被告诉电子邮件格式不对，他们可能不是世界上最快乐的用户。\n\n那么，正确的路径是什么？实际上，两者都是！最佳方法始终先进行客户端验证，然后在表单通过并提交到服务器后，使用服务器端验证再次进行验证检查。这种方法兼顾了两者的优点。它是安全的，因为黑客无法简单地绕过验证。他们可能会绕过客户端验证，但很快就会发现表单数据在提交后会在服务器上再次检查。这种验证技术也非常有效——给了你客户端验证的速度和灵敏。\n\
  \n## ASP.NET 验证服务器控件\n\n让 Web 页面上的表单处理验证是 Web 开发中的常见任务。因此，在 ASP.NET 最初发布时，ASP.NET\
  \ 团队引入了一系列验证服务器控件，旨在使表单的健全验证变得极其简单。\n\nASP.NET 不仅引入表单验证作为服务器控件，还让这些控件变得非常智能。在使用其他\
  \ Web 技术开发时，开发者必须确定在哪里执行表单验证——是在客户端还是服务器上。ASP.NET 验证服务器控件消除了这一困境，因为 ASP.NET 在生成\
  \ ASP.NET 页面时执行浏览器检测，并根据获取的信息做出决定。\n\n这意味着，如果浏览器支持 ASP.NET 发送的 JavaScript，验证将在客户端进行。如果客户端不支持用于客户端验证的\
  \ JavaScript，则该 JavaScript 将省略，验证将在服务器上进行。\n\n这种情况最棒的部分是，即使页面上启动了客户端验证，ASP.NET 在接收到提交的页面时仍然会执行服务器端验证，从而确保安全性不会受到损害。验证服务器控件的这种决定性意味着，你可以构建\
  \ ASP.NET Web 页面尽可能完美——而不是为了迎合最低标准而简化你的 Web 应用。\n\n目前，ASP.NET 4.5 提供了 7 个验证控件。自该技术最初发布以来，ASP.NET\
  \ 没有再添加新的验证服务器控件。然而，ASP.NET 4.5 确实引入了使用无侵入式 JavaScript 功能的新验证技术，这将在本章稍后讨论。\n\n可用的验证服务器控件包括：\n\
  \n*   `RequiredFieldValidator`\n*   `CompareValidator`\n*   `RangeValidator`\n*\
  \   `RegularExpressionValidator`\n*   `CustomValidator`\n*   `DynamicValidator`\n\
  *   `ValidationSummary`\n\n使用 ASP.NET 验证服务器控件的操作与使用任何其他 ASP.NET 服务器控件没有区别。这些控件中的每一个都允许你将其拖动到设计面上，或直接从\
  \ ASP.NET 页面的代码中对其操作。你还可以配置这些控件，使其以你想要的方式出现——确保应用程序可能所需的视觉独特性。在本章中可以看到这两个项的某些方面。\n\
  \n表 6-1 描述了每个可用验证服务器控件的功能。\n\n| **验证服务器控件** | **描述** |\n| --- | --- |\n| `RequiredFieldValidator`\
  \ | 确保用户没有跳过表单输入字段。 |\n| `CompareValidator` | 允许使用比较运算符（等于、大于、小于等）在用户输入与另一个项目之间进行比较。\
  \ |\n| `RangeValidator` | 根据数字或字符的低位和上限范围检查用户输入。 |\n| `RegularExpressionValidator`\
  \ | 检查用户输入是否符合由正则表达式定义的模式。该控件常用于检查电子邮件地址和电话号码。 |\n\n\n\n\n| `CustomValidator` |\
  \ 使用自定义代码的验证逻辑检查用户的输入。 |\n| `DynamicValidator` | 与从实体数据模型和扩展方法抛出的异常一起工作。此控件是 ASP.NET\
  \ Dynamic Data 框架的一部分。有关关于此控件的更多信息，请务必在互联网上搜索 `DynamicValidator`。 |\n| `ValidationSummary`\
  \ | 在页面的特定位置显示来自所有验证器的所有错误消息。 |\n\n**表 6-1**\n\n### 验证原因\n\n验证并不是凭空发生的；它是响应事件而发生的。在大多数情况下，它是一个按钮点击事件。`Button`、`LinkButton`\
  \ 和 `ImageButton` 服务器控件都具有触发页面表单验证的能力。这是默认行为。将 `Button` 服务器控件拖放到您的表单上，您将获得以下初始结果：\n\
  \n```\n <asp:Button ID=\"Button1\" runat=\"server\" Text=\"Button\" />\n```\n\n\
  如果你查看 `Button` 控件的属性，你会发现 `CausesValidation` 属性被设置为 `True`。正如所述，这种行为是默认的——页面上的所有按钮，无论有多少个，都会导致表单验证的触发。\n\
  \n如果你在 ASP.NET 页面上有多个按钮，且你不希望每个按钮都启动表单验证，你可以对所有希望在验证过程中忽略的按钮将 `CausesValidation`\
  \ 属性设置为 `False`（例如，表单的取消按钮或在另一个表单元素（如搜索框）中按回车）：\n\n```\n <asp:Button ID=\"Button1\"\
  \ runat=\"server\" Text=\"Cancel\" CausesValidation=\"false\" />\n```\n\n### ASP.NET\
  \ 4.5 中的非侵入式验证\n\n传统上，验证是在服务器端通过内置控件或编写方法来检查表单上的值处理的。在客户端，JavaScript 不会被发送到浏览器。在这种情况下，用户可能会被验证消息所淹没。此外，如果\
  \ JavaScript 本身包含错误，页面可能无法正常加载。为了规避这个问题，jQuery 验证插件已更新以支持`非侵入式验证`。\n\n非侵入式验证有助于减少对与\
  \ Web 应用程序交互的干扰。它不是内联渲染 JavaScript，而是向相应的表单元素添加 HTML5 `data-*` 属性。在 ASP.NET 4.5\
  \ 中，使用了 jQuery 验证插件，并默认启用了非侵入式验证功能。\n\n与之前的 Visual Studio 版本不同，Visual Studio 2012\
  \ 包含一个真正空的空项目模板。这意味着添加到解决方案的项目仅包含一个 `web.config` 文件。如果你选择创建一个网站，`web.config` 文件仅包含以下内容：\n\
  \n```\n <?xml version=\"1.0\"?>\n  <configuration>\n    <system.web>\n        <compilation\
  \ debug=\"true\" targetFramework=\"4.5\"/>\n        <httpRuntime targetFramework=\"\
  4.5\"/>\n    </system.web>\n  </configuration>\n```\n\nASP.NET 中可用的验证控件之一是 `RequiredFieldValidator`。列表\
  \ 6-1\n\n\n\n\n\n`RequiredFieldValidator` 控件的一个重要属性是 `InitialValue`。在列表 6-3 中，你可以看到初始值被渲染为\
  \ `span` 元素上一个名为 `data-val-initialvalue` 的属性。有时，你的表单元素会填充一些默认属性（例如，来自数据存储），而这些表单元素向最终用户展示的值可能在表单提交到服务器之前需要进行更改。\n\
  \n当使用 `InitialValue` 属性时，你为 `RequiredFieldValidator` 控件指定元素的初始文本。随后，最终用户在提交表单之前必须更改该文本值。列表\
  \ 6-4 显示了使用该属性的示例。\n\n在这种情况下，你可以看到 `InitialValue` 属性包含一个值 `Wrox`。当页面构建并运行时，文本框也包含此值。`RequiredFieldValidator`\
  \ 控件要求此值发生变化，该页面才能被视为有效。\n\n### 同时不允许空条目并强制更改\n\n在上一个使用 `InitialValue` 属性的示例中，出现了一个有趣的问题。如果你运行相关示例，最终用户绕过表单验证的一种方法是在此特定文本框中不输入任何值的情况下提交页面。空白的文本框不会触发验证错误，因为此时\
  \ `RequiredFieldValidator` 控件已重重构为仅强制最终用户*更改*文本框的默认值（他当他删除旧值时就做到了这一点）。当你以这种方式重构\
  \ `RequiredFieldValidator` 控件时，验证规则中没有任何项要求在文本框中输入*某些内容*——只需更改初始值即可。用户完全有可能通过仅删除此文本框中输入的任何内容来完全绕过表单验证过程。\n\
  \n然而，存在解决此问题的方法，这回到了早些关于表单由多个验证规则组成的讨论——其中某些规则被分配给同一个表单元素。为了既要求更改文本框的初始值，又不允许输入空条目（从而使该元素成为必填元素），你必须在页面上放置一个额外的\
  \ `RequiredFieldValidator` 控件。第二个 `RequiredFieldValidator` 控件与第一个 `RequiredFieldValidator`\
  \ 控件关联同一个文本框。这种方法在列表 6-5 所示的示例中得到了说明。\n\n在这个示例中，你可以看到文本框确实关联了两个 `RequiredFieldValidator`\
  \ 控件。第一个 `RequiredFieldValidator1` 要求通过使用 `InitialValue` 属性更改文本框的默认值。第二个 `RequiredFieldValidator`\
  \ 控件 `RequiredFieldValidator2` 则简单地让 `TextBox1` 控件变为一个需要值的表单元素。通过对单个表单元素应用两个验证规则，你得到了想要的行为。\n\
  \n### 使用 RequiredFieldValidator 控件验证下拉列表\n\n到目前为止，你已经看到了几个将 `RequiredFieldValidator`\
  \ 控件与 `TextBox` 控件使用的示例，但你同样可以轻松将此验证控件用于其他表单元素。\n\n例如，你可以对 `<asp:DropDownList>`\
  \ 服务器控件使用 `RequiredFieldValidator` 控件。假设你有一个下拉列表，要求最终用户从项目列表中选择她的职业。下拉列表的第一行包含了关于最终用户应该选择什么的指令，你还想让这一行也成为一个必填表单元素。列表\
  \ 6-6 显示了实现此操作的代码。\n\n就像你在处理文本框时一样，示例中的 `RequiredFieldValidator` 控件使用 `ControlToValidate`\
  \ 属性将自身与 `DropDownList` 控件关联。绑定验证控件的下拉列表有一个初始值——`Select a profession`。显然，你不希望最终用户在将表单回传服务器时保留该值。因此，你再次使用了\
  \ `RequiredFieldValidator` 控件的 `InitialValue` 属性。该属性的值被赋值给下拉列表的初始选择值。此值强制最终用户在提交表单之前从下拉列表提供的职业中选择一个。\n\
  \n### CompareValidator 服务器控件\n\n`CompareValidator` 控件允许你比较两个表单元素，还可以将表单元素中包含的值与你指定的常量值进行比较。例如，你可以指定表单元素的值必须是整数且大于某个指定的数字。你还可以声明值必须是字符串、日期或其他你可用于比较的其他数据类型。\n\
  \n#### 与其他控件进行验证\n\n使用 `CompareValidator` 控件的较常用方法之一是在两个表单元素之间进行比较。例如，假设你有一个应用程序要求用户拥有密码才能访问网站。你创建了一个请求用户输入密码的文本框，以及另一个请求用户确认密码的文本框。由于文本框处于密码模式，最终用户看不到自己输入的内容——只能看到她输入的字符数。为了减少最终用户输错密码并将此错误密码输入系统的几率，你要求她确认密码。在表单输入系统后，你只需要对两个文本框进行比较，查看它们是否匹配。如果它们匹配，最终用户可能正确输入了密码，你可以将选择的密码输入系统。如果两个文本框不匹配，你希望表单无效。列表\
  \ 6-7 展示了这种情况。\n\n查看表单上的 `CompareValidator` 控件，你可以发现它与 `RequiredFieldValidator`\
  \ 控件相似。`CompareValidator` 控件有一个名为 `ControlToValidate` 的属性，将自身与一个表单元素关联。在这种情况下，页面只需要一个\
  \ `CompareValidator` 控件，因为只进行一次比较。在示例中，你对 `TextBox2` 和 `TextBox1` 进行比较。因此，你使用了 `ControlToCompare`\
  \ 属性。它指定了与 `TextBox2` 比较的值。在这种情况下是 `TextBox1`。\n\n就是这么简单。如果用户提交页面后两个文本框不匹配，`CompareValidator`\
  \ 控件的 `Text` 属性值将显示在浏览器中。图 6-3 显示了这种情况的示例。\n\n![image](img/f211-01.jpg)\n\n**图 6-3**\n\
  \n#### 与常量验证\n\n除了可以与其他控件的值进行验证外，你还可以使用 `CompareValidator` 控件与特定数据类型的常量进行比较。例如，假设你的注册表单上有一个文本框询问用户的年龄。大多数情况下，你希望得到一个真实的数字，而不是像\
  \ `aa` 或 `bb` 这样的值。列表 6-8 显示了如何确保获得真实的数字。\n\n在示例中，要求最终用户在文本框中输入数字。如果他尝试通过输入非数字的假值来绕过验证，页面将被识别为无效，并且\
  \ `CompareValidator` 控件将显示 `Text` 属性的值。\n\n要指定你在这些比较中使用数据类型，你只需使用 `Type` 属性即可。`Type`\
  \ 属性可以取以下值：\n\n*   `Currency`\n\n\n\n\n\n*   `Date`\n*   `Double`\n*   `Integer`\n\
  *   `String`\n\n你不仅可以确保输入的内容是特定数据类型，还可以确保输入的内容在与特定常量比较时是有效的。例如，你可以确保表单元素中输入的内容大于、小于、等于、大于等于或小于等于一个指定的值。代码列表\
  \ 6-9 显示了这种情况的示例。\n\n在这种情况下，`CompareValidator` 控件不仅将自己与 `TextBox1` 控件关联并要求该值必须是整数，还使用\
  \ `Operator` 和 `ValueToCompare` 属性来确保该数字大于 `18`。因此，如果最终用户输入的值为 `18` 或更小，则验证将失败，该页面被视为无效。\n\
  \n`Operator` 属性可以取以下值之一：\n\n*   `Equal`（等号）\n*   `NotEqual`（不等于）\n*   `GreaterThan`（大于）\n\
  *   `GreaterThanEqual`（大于等于）\n*   `LessThan`（小于）\n*   `LessThanEqual`（小于等于）\n* \
  \  `DataTypeCheck`（数据类型检查）\n\n`ValueToCompare` 属性是你放置用于比较的常量值的地方。在在先的示例中，它是数字 `18`。\n\
  \n### RangeValidator 服务器控件\n\n`RangeValidator` 控件与 `CompareValidator` 控件非常相似，但它确保最终用户提供的值或选择是在指定范围内，而不仅仅是大于或小于某个特定常量。关于此控件的示例，请回想那个要求最终用户年龄并对所提供的值进行验证的文本框元素。代码列表\
  \ 6-10 展示了这种验证。\n\n在这个示例中，此页面包含一个要求最终用户年龄的文本框。`RangeValidator` 控件对所提供的值进行分析，并确保该值位于\
  \ `30` 到 `40` 的范围内（包括最小值和最大值）。你使用 `MaximumValue` 和 `MinimumValue` 属性来设置范围。`RangeValidator`\
  \ 控件还确保输入的内容是整数数据类型。它使用了 `Type` 属性，该属性设置为 `Integer`。`RangeValidator` 控件的其他可能数据类型包括与之前提到的\
  \ `CompareValidator` 控件所相同的值。图 6-4 中的截图展示了此示例的运行。\n\n![image](img/f213-01.jpg)\n\
  \n**图 6-4**\n\n从图 6-4 中的截图中可以看到，小于 `30` 的值会导致 `RangeValidator` 控件触发，大于 `40` 的数字也是如此。位于\
  \ `30` 和 `40` 之间的值（在本例中为 `36`）符合控件的验证规则。\n\n`RangeValidator` 控件不仅用于验证数字（尽管它通常以这种方式使用）。它还可以验证字符串字符范围以及其他项目，包括日历日期。默认情况下，任何验证控件的\
  \ `Type` 属性都设置为 `String`，这允许你确保提交的字符串的 ASCII 值在特定范围内。你可以使用 `RangeValidator` 控件来确保在另一个服务器控件（如日历控件）中输入的内容在特定的日期范围内。\n\
  \n例如，假设你正在构建一个询问客户到达日期的 Web 表单，并且到达日期需要在当前日期的两周内。你可以很容易地使用 `RangeValidator` 控件测试这些场景。\n\
  \n由于你要检查的日期范围是动态生成的，因此你在 `Page_Load` 事件中通过程序赋值分配 `MaximumValue` 和 `MinimumValue`\
  \ 属性。在设计器中，此示例的示例页面应该像图 6-5 所示。\n\n![image](img/f214-01.jpg)\n\n**图 6-5**\n\n想法是最终用户将从日历控件选择一个日期，这将填充\
  \ `TextBox` 控件。然后，当最终用户点击表单按钮时，如果选择的日期无效，将收到通知。如果选择的日期有效，该日期将通过页面上的 `Label` 控件呈现。代码列表\
  \ 6-11 提供了此示例的代码。\n\n从这段代码中，你可以看到当页面加载时，`MinimumValue` 和 `MaximumValue` 属性被分配了一个动态值。在这种情况下，`MinimumValue`\
  \ 获取了 `DateTime.Now.ToShortDateString()` 的值，而 `MaximumValue` 获取 14 天后的日期。\n\n在最终用户选择日期后，所选日期将通过\
  \ `Calendar1_SelectionChanged` 事件填充到 `TextBox1` 控件中。用户选择日期并点击页面上的按钮后，触发 `Button1_Click`\
  \ 事件，并使用 `Page.IsValid` 属性检查表单有效性。通过使用 `Page.IsValid` 属性，会检查每个验证控件以确保验证通过。如果是，则返回\
  \ `true`。否则，返回 `false`。图 6-6 显示了这种结果。\n\n![image](img/f216-01.jpg)\n\n**图 6-6**\n\
  \n### RegularExpressionValidator 服务器控件\n\n开发者喜欢使用的一种有趣的控件是 `RegularExpressionValidator`\
  \ 控件。当你向 Web 表单应用验证规则时，该控件提供了很大的活性。使用 `RegularExpressionValidator` 控件，你可以根据你定义的正则表达式来检查用户的输入。\n\
  \n这意味着你可以定义一个结构，并将其应用于用户的输入，以查看其结构是否匹配。例如，你可以定义用户输入必须是电子邮件地址或 Internet URL 的格式；如果不符合，则页面被视为无效。代码列表\
  \ 6-12 展示了如何通过确保其为电子邮件格式来验证输入文本框的内容。\n\n与其他验证控件一样，`RegularExpressionValidator` 控件使用\
  \ `ControlToValidate` 属性将其绑定到 `TextBox` 控件，并包含 `Text` 属性在验证失败时向屏幕推送错误消息。该验证控件的独特属性是\
  \ `ValidationExpression` 属性。该属性接收字符串值，即你将应用的正则表达式。\n\nVisual Studio 通过使用正则表达式编辑器让使用正则表达式变得简单。该编辑器提供了一些你可能应用于\
  \ `RegularExpressionValidator` 的常用正则表达式。要进入此编辑器，你需要在设计视图中处理页面。确保在设计视图中高亮 `RegularExpressionValidator1`\
  \ 服务器控件以查看控件的属性。在 Visual Studio 的属性窗口中，点击 `ValidationExpression` 属性旁边的按钮启动正则表达式编辑器。图\
  \ 6-7 展示了此编辑器。\n\n![image](img/f216-02.jpg)\n\n**图 6-7**\n\n使用此编辑器，你可以找到用于电子邮件、Internet\
  \ URL、邮政编码、电话号码和社会安全号码的正则表达式。\n\n### CustomValidator 服务器控件\n\n到目前为止，你已经看到了各种可用的验证控件。在许多情况下，这些验证控件已经解决了你想要应用于\
  \ Web 表单的许多验证规则。然而，有时这些控件无一个能满足你的需求，你必须超出它们提供的范围。这正是 `CustomValidator` 控件派上用场的地方。\n\
  \n\n\n\n\n`CustomValidator` 控件允许你构建自定义的客户端或服务器端验证，然后轻松地将这些验证应用于你的 Web Forms 中。这样做可以让你能够针对数据层（例如数据库）中执行的数值或计算结果进行验证检查，或者确保用户的输入符合某些算算术验证（例如，判断一个数字是偶数还是奇数）。你可以利用\
  \ `CustomValidator` 控件实现很多功能。\n\n### 使用客户端验证\n\n`CustomValidator` 控件非常有价值的功能之一是它能够轻松提供自定义的客户端验证。许多开发者在自己的应用程序中有一套自己的\
  \ JavaScript 函数集合，并使用它们，而使用 `CustomValidator` 控件是实现这些函数的一种简单方法，且对函数本身的改动极小。例如，在大多数情况下，必须更新\
  \ JavaScript 函数的签名以符合特定的签名。\n\n例如，看一个要求最终用户输入数字的简单表单。该表单使用 `CustomValidator` 控件对用户输入进行自定义客户端验证，以确保提供的数字能被\
  \ 5 整除。代码列表 6-13 显示了此验证的代码。\n\n查看此 Web Form，你可以看到发生了几件事。它是一个只有一个需要用户输入的文本框的简单表单。用户点击触发\
  \ `Button1_Click` 事件的按钮，该事件随后填充页面上的 `Label1` 控件。只有在执行所有验证检查且用户输入通过这些测试时，才会执行此简单操作。\n\
  \n此页面的不同之处在于在`<head>` 部分包含了第二个 `<script>` 块。这是自定义的 JavaScript。注意，Visual Studio 2012\
  \ 对此类构造非常友好，即使你在页面的设计视图和代码视图之间切换也是如此——2008 之前的 Visual Studio 版本在处理此类方面相当糟糕。此 JavaScript\
  \ 函数 — `validateNumber` —— 显示在此：\n\n```\n <script type=\"text/javascript\">\n  \
  \    function validateNumber(oSrc, args) {\n          args.IsValid = (args.Value\
  \ % 5 == 0);\n      }\n  </script>\n```\n\n这第二个 `<script>` 部分是你希望 `CustomValidator`\
  \ 控件在对文本框中输入的信息进行验证检查时使用的客户端 JavaScript。与服务器端验证方法类似，客户端验证方法也需要两个参数：源参数和参数对象。源参数是验证控件本身的引用。参数对象是一个包含两个属性的对象：`args.IsValid`\
  \ 和 `args.Value`。你雇用的 JavaScript 函数将使用 `args.IsValid` 属性，并根据验证检查的结果将该属性设置为 `True`\
  \ 或 `False`。在这种情况下，会检查用户输入（`args.Value`）是否能被 5 整除。然后将返回的布尔值分配给 `args.IsValid` 属性，随后由\
  \ `CustomValidator` 控件使用。\n\n`CustomValidator` 控件像之前的控件一样，使用 `ControlToValidate`\
  \ 属性将自身与页面上的特定元素关联。你在这里感兴趣的属性是 `ClientValidationFunction` 属性。提供此属性的字符串值是你希望在 `CustomValidator`\
  \ 控件触发时供此验证检查使用的客户端函数名称。在这种情况下，它是 `validateNumber`：\n\n```\n ClientValidationFunction=\"\
  validateNumber\"\n```\n\n如果你运行此页面并输入无效内容，将产生图 6-8 所示的结果。\n\n![image](img/f219-01.jpg)\n\
  \n**图 6-8**\n\n## 使用服务器端验证\n\n现在，让我们将相同的验证检查从客户端移动到服务器。`CustomValidator` 控件同样允许你让自定义的服务器端验证成为现实。你会发现，创建服务器端验证与创建客户端验证一样简单。\n\
  \n如果你创建了自己的服务器端验证，可以根据应用程序的要求让它们变得复杂。例如，如果你想根据来自 XML 文件、数据库或其他地方的动态值对用户的输入进行检查，那么你就会使用\
  \ `CustomValidator` 进行服务器端验证。\n\n关于使用 `CustomValidator` 控件进行某些自定义服务器端验证的示例，你可以处理与创建客户端验证时相同的示例示例。现在，创建一个服务器端检查，确保用户输入的数字能被\
  \ 5 整除，如代码列表 6-14 所示。\n\n此示例代码中包含的不是客户端 JavaScript 函数，而是一个服务器端函数 — `ValidateNumber`。服务器端函数接受与客户端函数相同的两个参数。`ValidateNumber`\
  \ 函数以及所有构建用于与 `CustomValidator` 控件配合运行的函数，必须使用 `ServerValidateEventArgs` 对象作为参数之一，以便获取传递给函数进行验证检查的数据。`ValidateNumber`\
  \ 函数本身并不特别复杂。它只是简单检查提供的数字是否能被 5 整除。\n\n在你设计与 `CustomValidator` 控件配合运行的自定义函数内部，你实际上通过\
  \ `args.Value` 对象从表单元素获取值。然后，根据你的验证检查，将 `args.IsValid` 属性设置为 `True` 或 `False`。从先前的示例中，你可以看到如果数字不能被\
  \ 5 整除，则 `args.IsValid` 被设置为 `False`，并且还会抛出异常（如果在表单元素中输入字符串值）。在建立了自定义函数后，下一步是将其应用于\
  \ `CustomValidator` 控件，如下示例所示：\n\n```\n <asp:CustomValidator ID=\"CustomValidator1\"\
  \n    runat=\"server\" ControlToValidate=\"TextBox1\"\n    Text=\"Number must be\
  \ divisible by 5\"\n    OnServerValidate=\"ValidateNumber\"></asp:CustomValidator>\n\
  ```\n\n将 `CustomValidator` 控件与服务器端代码中的函数关联起来，只需使用 `OnServerValidate` 服务器端事件。分配给此属性的值是函数名称——在这种情况下是\
  \ `ValidateNumber`。\n\n运行此示例会导致回传（postback）返回服务器，并执行基于 `ValidateNumber` 函数的验证检查。随后，页面重新加载并调用\
  \ `Page_Load` 事件。在代码列表 6-14 的示例中，你可以看到执行了判断页面是否有效的检查。该检查使用了 `Page.IsValid` 属性：\n\
  \n```\n if (Page.IsValid)\n  {\n      Label1.Text = \"VALID ENTRY!\";\n  }\n```\n\
  \n## 同时使用客户端和服务器端验证\n\n\n\n\n\n正如本章早期所述，你必须考虑表单的安全性，并确保从表单中收集的数据是有效的。正因如此，当你决定采用客户端验证时（如在代码列表\
  \ 6-13 中所示的那样），你应该采取措施将客户端函数也重构为服务器端函数。当你完成这项任务后，应该将 `CustomValidator` 控件关联到客户端和服务器端函数。对于代码列表\
  \ 6-13 和 6-14 中的数字检查验证，你可以在页面中同时使用这两个验证函数，然后将 `CustomValidator` 控件指向这两个函数，如代码列表\
  \ 6-15 所示。\n\n从这个示例中，你可以看到，这简单来说就是同时使用 `ClientValidationFunction` 和 `OnServerValidate`\
  \ 属性的问题。\n\n### ValidationSummary 服务器控件\n\n`ValidationSummary` 控件并不对输入到 Web Forms\
  \ 的内容执行验证。相反，它是一个报告控件，页面上的其他验证控件可以使用它。你可以使用此验证控件来汇总页面上发生的所有验证错误的错误报告，而不是让每个单独的验证控件自行处理。\n\
  \n对于具有完整表单验证过程的大表单，你可能需要这种功能。在这种情况下，你可能会发现将所有可能的验证错误以单一且易于识别的方式报告给终端用户是非常符合用户体验的。你可以以列表、项目符号列表或段落的形式显示这些错误消息。\n\
  \n默认情况下，`ValidationSummary` 控件以项目符号列表的形式显示错误列表，如代码列表 6-16 所示。\n\n此示例要求终端用户输入姓和名。表单中的每个文本框都分配了一个相关的\
  \ `RequiredFieldValidator` 控件。当页面构建并运行时，用户在两个文本框中未输入任何值的情况下点击提交按钮，将触发两个验证错误。图 6-9\
  \ 显示了这一结果。\n\n![image](img/f223-01.jpg)\n\n**图 6-9**\n\n正如表单上之前的验证控件示例一样，这些验证错误会出现在每个文本框的旁边。然而，你可以看到\
  \ `ValidationSummary` 控件在 Web 表上控件所在的位置以项目符号列表的形式显示验证错误。在大多数情况下，你不希望这些错误在页面上为终端用户出现两次。你可以通过验证控件的\
  \ `Text` 属性（除了你常用的 `ErrorMessage` 属性之外）来更改这种行为，正如你在本章中通常做的那样。`Text` 属性是验证控件内显示的文本值。`ErrorMessage`\
  \ 属性是显示在验证摘要中（如果已添加到页面上）的文本值。代码列表 6-17 显示了这种方法。\n\n对验证控件进行此类更改将产生如图 6-10 所示的结果。\n\
  \n![image](img/f223-02.jpg)\n\n**图 6-10**\n\n为了得到这个结果，只需记住 `ValidationSummary` 控件在发生验证错误时，使用验证控件的\
  \ `ErrorMessage` 属性进行显示。`Text` 属性由验证控件使用，而不被 `ValidationSummary` 控件利用。\n\n除了项目符号列表，你还可以使用\
  \ `ValidationSummary` 控件的 `DisplayMode` 属性将结果显示更改为其他类型的格式。该控件具有以下可能值：\n\n*   `BulletList`\n\
  *   `List`\n*   `SingleParagraph`\n\n你还可以利用对话框而不是将结果显示在网页上。对话框使用 JavaScript 消息框来显示结果。代码列表\
  \ 6-18 显示了这种行为的示例。\n\n从这个代码示例中，你可以看到 `ShowSummary` 属性设置为 `false` ——这意味着验证错误的项目符号列表不会显示在实际网页上。然而，由于\
  \ `ShowMessageBox` 属性被设置为 `true`，你现在会在消息框中看到这些错误，如图 6-11 所示。\n\n![image](img/f224-01.jpg)\n\
  \n**图 6-11**\n\n### 关闭客户端验证\n\n由于验证服务器控件会自动为客户端提供客户端验证（如果请求的容器可以正确处理生成的 JavaScript），你可能需要一种控制这种行为的方法。\n\
  \n关闭这些控件的客户端功能，使它们不会独立地向请求者发送客户端功能是完全可能的。例如，你可能希望所有的验证都在服务器上完成，无论请求的容器提供什么功能。你可以通过几种方法来关闭此功能。\n\
  \n第一种方案是在控件级别。每个验证服务器控件都有一个名为 `EnableClientScript` 的属性。该属性默认设置为 `True`，但将其设置为 `False`\
  \ 可以防止控件发送用于验证的 JavaScript 函数。相反，验证将在服务器上进行。代码列表 6-19 显示了该属性的使用。\n\n你也可以通过程序程序移除验证控件的客户端功能（如在代码列表\
  \ 6-20 中所示）。\n\n另一种方案是在 `Page_Load` 事件中关闭页面上所有验证控件的客户端脚本。如果你想动态决定不允许客户端验证，这种方法会非常有帮助。代码列表\
  \ 6-21 显示了此选项。\n\n通过查找 ASP.NET 页面验证器中每个 `BaseValidator` 对象的实例，此 `For Each` 循环会关闭每个验证控件的客户端功能。\n\
  \n### 使用图像和声音进行错误通知\n\n到目前为止，你一直在为来自验证服务器控件的错误通知显示简单的文本消息。在大多数情况下，你将仅仅这样做 —— 即显示一些简单的文本消息来通知终端用户，他们在表单中输入的内容不符合你的验证规则。\n\
  \n关于验证控件的一个有趣提示是，你并不局限于文本 —— 你还可以使用图像和声音进行错误通知。\n\n要使用图像显示错误，你可以使用任何验证控件的 `Text`\
  \ 属性。你只需将一些适当的 HTML 作为该属性的值即可，如代码列表 6-22 所示。\n\n从这个示例中你可以看到，输出到网页上的不是文本，`Text` 属性的值是一个\
  \ HTML 字符串。这段 HTML 用于显示图像。请务必注意单引号和双引号的使用，以免在浏览器生成页面时出现任何错误。此示例产生的结果与图 6-12 类似。\n\
  \n![image](img/f226-01.jpg)\n\n**图 6-12**\n\n你所创建的另一个有趣花样是在错误发生时添加声音通知。你可以用与显示错误图像相同的方法来实现这一点。代码列表\
  \ 6-23 显示了这种行为的示例。\n\n\n\n\n\n你可以在 `C:\\Windows\\Media` 目录下找到许多 Windows 系统声音。在例例中，`Text`\
  \ 使用 `<audio>` 元素在 Web 表单上放置了一个声音（仅对符合 HTML5 标准的浏览器有效）。只有当终端用户触发验证控件时，声音才会播放。\n\n\
  在处理用于错误通知的声音时，你必须禁用该特定控件的客户端脚本功能，因为如果不这样做，无论是否触发了验证错误，声音都会在页面加载到浏览器时播放。\n\n## 验证组的工作\n\
  \n在许多情况下，开发者希望在单个页面上放置多个表单。不同的验证控件通常被分配给页面上的两个不同表单。然而，在这个示例中，可能会发生意外之外的行为。例如，当终端用户提交一个表单时，另一个表单中的验证控件可能会触发，尽管用户并没有在操作该表单。这将导致第一个表单无法提交。在其他情况下，开发者可能希望简单地拆分表单并以不同的方式验证控件。\n\
  \n例如，图 6-13 显示了为 .NET Valley 用户组创建的基础页面，其中包含两个表单。\n\n![image](img/f227-01.jpg)\n\
  \n**图 6-13**\n\n其中一个表单用于网站成员提供用户名和密码，以登录网站的仅限会员区域。页面上的第二个表单用于任何想要订阅用户组通讯列表的人。每个表单都有自己的按钮以及与之关联的一些验证控件。当有人提交其中一个表单的信息时，问题出现了。例如，如果你是小组的成员，你提供了用户名和密码并点击“登录”按钮。由于在该特定表单中没有填写电子邮件，通讯表单的验证控件将会触发。如果对获取列表感兴趣的人在最后一个文本框中输入了电子邮件并点击“注册”按钮，第一个表单的验证控件就会触发，因为在该表单中没有输入用户名和密码。\n\
  \nASP.NET Web Controls 包含 `ValidationGroup` 属性，允许你将验证控件分到不同的组。它允许你在终端用户点击页面上的按钮时，仅激活所需的验证控件。代码示例\
  \ 6-24 展示了将用户组页面上的验证控件划分到不同桶中的示例。\n\n你可以看到 `ValidationGroup` 属性接受一个 `String` 类型的值。核心服务器控件也具有\
  \ `ValidationGroup` 属性，因为按钮点击等操作必须与特定的验证组相关联。\n\n在此示例中，每个按钮都有不同的验证组分配。表单上的第一个按钮使用\
  \ `Login` 作为值，表单上的第二个按钮使用 `Newsletter` 作为值。然后，每个验证控件都与这些验证组之一相关联。由于这些关联，当终端用户点击页面上的“登录”按钮时，ASP.NET\
  \ 会识别出它应该仅与具有相同验证组名称的验证服务器控件一起。ASP.NET 会忽略分配给其他验证组的验证控件。\n\n使用此增强功能，你现在可以拥有多组验证规则，并且仅在你希望它们触发时才触发（参见图\
  \ 6-14）。\n\n![image](img/f229-01.jpg)\n\n**图 6-14**\n\n验证控件的另一个很棒的功能是名为 `SetFocusOnError`\
  \ 的属性。该属性接受一个布尔值，如果在提交表单时抛出验证错误，该属性会将页面焦点置于接收错误的表单元素上。`SetFocusOnError` 属性在以下示例中使用：\n\
  \n```\n <asp:RequiredFieldValidator ID=\"RequiredFieldValidator1\" runat=\"server\"\
  \n      Text=\"* 您必须提交用户名!\" SetFocusOnError=\"true\"\n      ControlToValidate=\"\
  TextBox1\" ValidationGroup=\"Login\">\n  </asp:RequiredFieldValidator>\n```\n\n\
  如果 `RequiredFieldValidator1` 因为终端用户没有在 `TextBox1` 中放置值而报错错误，页面将重绘并将焦点位于 `TextBox1`，如图\
  \ 6-15 所示。\n\n![image](img/f229-02.jpg)\n\n**图 6-15**\n\n注意，如果你的页面上有多个 `SetFocusOnError`\
  \ 属性设置为 `True` 的验证控件，并且发生了多个验证错误，则具有验证错误的最上方表单元素将获得焦点。在上一个示例中，如果用户名文本框（`TextBox1`）和密码文本框（`TextBox2`）都关联了验证错误，页面焦点将分配给用户名文本框，因为它是表单上第一个带有错误的控件。\n\
  \n## 总结\n\n当你处理表单时，验证控件是你可以使用的强大工具。它们在简单易用的软件包中带入了许多功能，并且像 .NET 世界中的大多数事物一样，你可以轻松地让它们的外观和行为完全符合你的意愿。\n\
  \n请记住，在应用程序中使用表单的目的是收集数据，但如果数据无效，这种数据收集就没有意义。这意味着你必须建立验证规则，并通过一系列不同的控件——验证服务器控件——在表单中实现这些规则。\n\
  \n本章详细介绍了各种验证控件，包括：\n\n*   `RequiredFieldValidator`\n*   `CompareValidator`\n* \
  \  `RangeValidator`\n*   `RegularExpressionValidator`\n*   `CustomValidator`\n*\
  \   `ValidationSummary`\n\n本章不仅涵盖了各种验证控件，还讨论了如何应用客户端和服务器端验证。你还有机会看到 ASP.NET 4.5\
  \ 引入的无入侵验证（unobtrusive validation）及其对验证的影响。\n\n# 7 用户控件与服务器控件\n\n## 本章内容\n\n*  \
  \ 创建、交互和加载用户控件\n*   使用服务器控件\n*   为开发者优化服务器控件\n\n## WROX.COM 本章代码\n\n请注意，本章中的所有代码示例都是本书代码下载的一部分，可以在[wrox.com](http://www.wrox.com)网站的代码选项卡下载。\n\
  \n在像 .NET 这样面向对象的环境中，将代码封装成小型、单一用途的可重用对象是开发健壮系统的关键之一。例如，如果你的应用程序处理客户，你可能考虑创建一个 `Customer`\
  \ 对象来代表客户的实例。该对象封装了客户在系统中执行的所有属性和行为。创建此对象的优势在于创建了与其他对象交互的单一点，以及创建、调试、部署和维护的单一点。像\
  \ `Customer` 对象这样的对象通常被称为业务对象，它们封装了特定实体所需的所有业务逻辑。\n\n\n\n\n\n由于用户控件（user controls）和服务器控件（server\
  \ controls）的主题非常庞大，而且讨论每个控件的细节可能就能写满一整本书，因此章无法调查你可能使用的每一个选项。相反，它尝试为你提供构建和使用用户控件及服务器控件的简要概述，并演示每个类型控件的一些常见场景。在本章结束时，你应该已经学习了足够的知识来开始构建每个类型的基本控件，并能够继续学习。\n\
  \n# 用户控件 (USER CONTROLS)\n\n用户控件代表了 ASP.NET 视觉封装的最基本的形式。由于它们最基础，因此也最容易创建和使用。本质上，用户控件用于将现有的服务器控件分组到一个单个容器控件中。这允许你创建强大的对象，并在整个\
  \ Web 项目中轻松使用它们。\n\n### 创建用户控件\n\n在 Visual Studio 2012 中创建用户控件非常简单。要创建一个新的用户控件，首先需要向你的网站添加一个新的用户控件文件。从“网站”（Website）菜单中选择“添加新项”（Add\
  \ New Item）选项。“添加新文件”对话框出现后，从列表中选择“Web 用户控件文件”（Web User Control File）模板并点击“添加”。注意，文件添加到项目后，该文件具有\
  \ `.ascx` 扩展名。该扩展名向 ASP.NET 表示此文件是一个用户控件。如果你尝试直接将用户控件加载到浏览器中，ASP.NET 会返回错误，告诉此类类型的文件无法提供给客户端。\n\
  \n如果你查看列表 7-1 所示的 HTML 源码，你会发现与标准的 ASP.NET 网页有一些有趣的不同。\n\n注意源代码使用的是 `@Control` 指令，而不是标准网页使用的\
  \ `@Page` 指令。同样注意，与标准的 ASP.NET 网页不同，控件中除了 `<script>` 标签外没有其他 HTML 标签。包含用户控件的网页提供了基础的\
  \ HTML，例如 `<body>` 和 `<form>` 标签。事实上，如果你尝试向用户控件添加服务器端表单标签，当页面提供给客户端时，ASP.NET 会返回错误。错误信息告诉你，你的网页中只允许一个服务器端表单标签。\n\
  \n要向表单添加控件，只需将它们从“工具箱”（Toolbox）拖动到你的用户控件上。列表 7-2 显示了添加标签和按钮后的用户控件。\n\n在将控件添加到用户控件后，你将用户控件放置到标准的\
  \ ASP.NET 网页上。要这样做，请将文件从“解决方案资源管理器”（Solution Explorer）拖动到你的网页上。\n\n图 7-1 显示了用户控件被放置到主机网页后的样子。\n\
  \n![image](img/f233-01.jpg)\n\n**图 7-1**\n\n将用户控件放置到网页后，在浏览器中打开该页面以查看完全渲染的网页。\n\n\
  用户控件完全参与页面渲染生命周期，包含在用户控件中的控件的行为与它们放置在标准 ASP.NET 网页上的行为相同。这意味着用户控件有它自己的页面事件（例如 `Init`、`Load`\
  \ 和 `Prerender`），这些事件会在页面处理时执行，而且用户控件内的控件也会像往常一样触发事件。列表 7-3 显示了如何使用用户控件的 `Page_Load`\
  \ 事件来填充标签并处理按钮的 `Click` 事件。\n\n当你渲染网页时，你会看到标签的文本随着用户控件的加载而变化，并且在你点击页面底部时再次发生变化。事实上，如果你在这两个事件的任一个上设置了断点，你可以看到当页面执行时，ASP.NET\
  \ 确实会在用户控件代码内部断执行。\n\n## 与用户控件交互 (INTERACTING WITH USER CONTROLS)\n\n到目前为止，你已经学习了如何创建用户控件并将它们添加到网页中。你还学习了用户控件如何执行自己的代码并触发事件。然而，大多数用户控件并不是其父页面中的孤立岛屿。通常，主机网页需要与放置在其上的用户控件进行交互。例如，你可能决定要在标签中加载的文本必须由主机页面交给用户控件。要这样做，你只需向用户控件添加一个公共属性（public\
  \ property），然后使用该属性分配文本。列表 7-4 显示了修改后的用户控件。\n\n在修改用户控件后，你只需从主机网页填充该属性。列表 7-5 显示了如何在代码中设置\
  \ `Text` 属性。\n\n注意，用户控件暴露的公共属性也会通过“属性浏览器”（Property Browser）暴露，因此你也可以使用它来设置用户控件的属性。\n\
  \n用户控件是在 ASP.NET 中创建强大、可复用组件的简单方法。它们很容易使用内置模板创建。由于它们完全参与页面生命周期，你可以创建可以与其主机页面甚至与主机页面上的其他控件交互的控件。\n\
  \n## 动态加载用户控件 (LOADING USER CONTROLS DYNAMICALLY)\n\n你还可以在运行时动态地创建并将用户控件添加到 Web\
  \ 表单中。ASP.NET 的 `Page` 对象包含 `LoadControl` 方法，该方法允许你通过向方法提供要加载的用户控件的虚拟路径，在运行时加载用户控件。该方法返回一个通用的\
  \ `Control` 对象，然后你可以将其添加到 `Controls` 集合。列表 7-6 演示了如何使用 `LoadControl` 方法动态将用户控件添加到网页。\n\
  \n将用户控件添加到页面的第一步是使用 `FindControl` 方法定位页面的 `Form` 控件。如果用户控件包含渲染表单元素（如按钮或文本框）的 ASP.NET\
  \ 控件，则必须将用户控件添加到表单元素的 `Controls` 集合。\n\n找到表单后，示例使用页面的 `LoadControl()` 方法加载用户控件的实例。该方法接受要加载的用户控件的虚拟路径，并返回加载的用户控件。\n\
  \n最后，你将控件添加到 `Form` 对象的 `Controls` 集合中。你也可以将用户控件添加到网页上存在的其他容器控件，例如 `Panel` 或 `Placeholder`\
  \ 控件。\n\n在你获取了加载的用户控件后，你也可以处理处理它的对象模型，就像处理任何其他控件一样。为了访问用户控件暴露的属性和方法，你需要将控件从通用控件类型转换为其实际类型。要这样做，你还需要向页面添加\
  \ `@Reference` 指令。这告诉 ASP.NET 编译用户控件并将其链接到 ASP.NET 页面，以便页面知道在哪里找到用户控件类型。列表 7-7 演示了如何在加载后转换控件来访问用户控件的自定义属性。示例加载了一个修改后的用户控件，它托管了一个\
  \ ASP.NET TextBox 控件，并暴露了一个允许你访问 TextBox 控件 `Text` 属性的公共属性。\n\n注意，示例先将控件添加到 Form\
  \ 的 `Controls` 集合中，然后设置 `Text` 属性。这个顺序非常重要，因为在页面回传之后，在控件添加到 `Controls` 集合之前，控件的\
  \ ViewState 没有计算。因此，如果你在计算 ViewState 之前设置了 `Text` 值（或用户控件的任何其他属性），该值将不会持久化在 ViewState\
  \ 中。\n\n\n\n\n当在使用输出缓存来缓存用户控件时，动态添加用户控件会遇到另一个额外的复杂性。在这种情况下，控件被缓存后，`LoadControl`\
  \ 方法不会返回控件的新实例。相反，它返回控件的缓存副本。当你尝试将控件转换为其原生类型时，这就会产生问题，因为在控件被缓存后，`LoadControl` 方法返回的是一个\
  \ `PartialCachingControl` 对象，而不是其原生类型。因此，上一个示例中的强制转换会导致抛出异常。\n\n要解决这个问题，你只需在尝试强制转换之前测试对象的类型即可。这在列表\
  \ 7-8 中所示。\n\n该示例演示了如何测试 `LoadControl` 返回什么类型，并根据该类型设置属性。有关缓存的更多信息，请查看第 22 章。\n\n\
  最后，在之前的示例中，用户控件是在 `Page_Load` 事件期间动态添加的。但有时你可能想在不同的事件中添加控件，例如按钮的 `Click` 事件或 `DropDownList`\
  \ 控件的 `SelectedIndexChanged` 事件。使用这些事件来动态添加用户控件会带来新的挑战。因为这些事件可能在每次页面回传（postback）时都不会触发，你需要一种方法来跟踪用户控件何时被添加，以便在发生后续回传时将其重新添加到网页页面中。\n\
  \n实现此点的简单方法是使用 ASP.NET 会话来跟踪用户控件何时添加到网页。列表 7-9 演示了这一点。\n\n此示例使用简单的 `Session` 变量来跟踪用户控件是否已添加到页面。当\
  \ Button1 的 `Click` 事件触发时，会话变量被设置为 `True`，表示用户控件已添加。然后，每次页面执行回传时，`Page_Load` 事件都会检查会话变量是否设置为\
  \ `True`，如果是，它会将控件重新添加到页面中。\n\n### 服务器控件\n\n在 ASP.NET 中创建服务器控件的能力是你作为 ASP.NET 开发者可以拥的最强大工具之一。创建自己的自定义服务器控件和扩展现有控件实际上都非常简单。在\
  \ ASP.NET 中，所有控件都派自两个基础类：`System.Web.UI.WebControls.WebControl` 或 `System.Web.UI.ScriptControl`。派自\
  \ `WebControl` 类的类具有参与页面框架所需的基本功能。这些类包含了创建渲染视觉 HTML 表示的控件所需的大多数功能，并提供了许多基本样式元素的支持，如\
  \ `Font`、`Height` 和 `Width`。由于 `WebControl` 类派生自 `Control` 类，派生自它的控件具有作为可设计控件的基本功能，这意味着你可以将它们添加到\
  \ Visual Studio 工具箱中，将它们拖到页面设计器上，并在属性 器中显示它们的属性和事件。\n\n派自 `ScriptControl` 类的控件在\
  \ `WebControl` 类提供的功能的基础上，包含了额外的特性，旨在使与客户端脚本库的工作变得更容易。该类会测试以确保在控件的 `PreRender` 阶段，托管页面中存在\
  \ `ScriptManager` 控件，并确保派生控件在 `Render` 事件期间调用了正确的 `ScriptManager` 方法。\n\n### 服务器控件项目\n\
  \n为了让创建自定义服务器控件变得简单，Visual Studio 两个不同的项目模板，这些模板设置了基本的项目结构，包括创建服务器控件所需的文件。图 7-2\
  \ 显示了 Visual Studio 的“新建项目”对话框中的 ASP.NET 服务器控件和 ASP.NET AJAX 服务器控件项目。\n\n![image](img/f240-01.jpg)\n\
  \n**图 7-2**\n\nASP.NET 服务器控件项目创建一个基础类库项目，其中默认包含一个派生自 `WebControl` 的单个服务器控件类。ASP.NET\
  \ AJAX 服务器控件项目也会创建一个基础类库项目，但包含一个派生自 `ScriptControl` 的单个服务器控件类，以及一个资源文件和一个 JavaScript\
  \ 文件。创建其中任何一种项目类型都会得到一个可运行的、尽管本质上没有功能的服务器控件。\n\n你可以通过在“添加项”对话框中选择 ASP.NET 服务器控件文件模板来向项目添加额外的服务器控件类。请注意，此模板与服务器控件项目中包含的默认模板略有不同。它使用了不同的命名方案，并且在默认控件模板中包含了略有不同的代码。\n\
  \n创建新项目后，你可以通过向现有解决方案添加新的 Web 项目来测试该控件，重新生成整个解决方案并打开默认 页面。Visual Studio 会自动将服务器控件添加到工具箱中，如图图\
  \ 7-3 所示。\n\n![image](img/f241-01.jpg)\n\n**图 7-3**\n\nVisual Studio 会对当前打开的解决方案项目中包含任何控件执行此操作。\n\
  \n现在只需将控件拖到 Web Form 上即可。Visual Studio 会向项目添加对控件的引用，控件会被添加到网页中。列表 7-10 向你展示了添加控件后网页源代码的样子。\n\
  \n将控件拖到 Web Form 后，请在“属性”窗口中查看它的属性。图 7-4 显示了你自定义控件的属性。\n\n![image](img/f241-02.jpg)\n\
  \n**图 7-4**\n\n注意，该控件具有各种样式属性。由于控件派生自 `WebControl`，这些属性是暴露的。该控件还继承了 `WebControl`\
  \ 暴露的基础事件。\n\n通过为 `Text` 属性输入值并在浏览器中查看页面，可以确保控件工作正常。图 7-5 显示了如果你将 `Text` 属性设置为 `\"\
  Hello World!\"`，页面的样子。\n\n![image](img/f242-01.jpg)\n\n**图 7-5**\n\n正如预期，控件已将 `Text`\
  \ 属性的值渲染到网页上。\n\n现在你已经运行了一个基础的服务器控件项目，你可以返回查看由 ASP.NET 服务器控件项目为你创建的模板类。默认模板如列表 7-11\
  \ 所示（本章代码下载中的 ServerControl1.vb 和 ServerControl1.cs）。\n\n你可以看到项目生成的默认服务器控件模板的许多有趣之处。首先，注意类声明和\
  \ `Text` 属性都使用了特性进行装饰。ASP.NET 服务器控件大量使用特性来指示不同的运行时和设计时行为。在本章稍后的部分，你将学习更多关于应用于服务器控件类和属性的特性。\n\
  \n其次，默认情况下，模板包含一个名为 `Text` 的单个属性，以及一个简单的覆盖方法 `RenderContents`，用于将该属性的值渲染到屏幕上。控件的\
  \ `RenderContents` 方法是输出服务器控件内容的主要方法。\n\n\n\n\n\n如果你查看上一个示例的 HTML 源代码，你会发现 ASP.NET\
  \ 不仅将 `Text` 属性的值添加到了 HTML 标记中，还将文本封装在一个 `<SPAN>` 块中。如果你查看 `WebControl` 类的 `render`\
  \ 方法的代码，你会发现除了调用 `RenderContents` 方法外，它还包含了通过在控制内容周围插入 `Span` 标签来渲染开始标签和结束标签的调用。\n\
  \n```\n protected internal override void Render(HtmlTextWriter writer)\n  {\n  \
  \    this.RenderBeginTag(writer);\n      this.RenderContents(writer);\n      this.RenderEndTag(writer);\n\
  \  }\n```\n\n如果你为你的控件提供了 `ID` 值，那么 `Span` 标签默认情况下也会渲染一个 `ID` 属性。拥有 `Span` 标签有时会产生问题，因此如果你想防止\
  \ ASP.NET 自动添加 `Span` 标签，可以重写你控件中的 `Render` 方法并直接调用 `RenderContents` 方法：\n\n`VB`\n\
  \n```\n Protected Overrides Sub Render(ByVal writer As System.Web.UI.HtmlTextWriter)\n\
  \      Me.RenderContents(writer)\n  End Sub\n```\n\n`C#`\n\n```\n protected override\
  \ void Render(HtmlTextWriter writer)\n  {\n      this.RenderContents(writer);\n\
  \  }\n```\n\n默认的服务器控件模板很好地演示了创建一个简单的服务器控件是多么容易，但当然，这个控件并没有多少功能，并且缺乏你在典型的服务器控件中可能会发现许多特性。本章的其余部分将关注你如何使用\
  \ .NET Framework 的不同功能为服务器控件添加额外的运行时和设计时功能。\n\n### 控件属性 (Control Attributes)\n\n\
  服务器控件为开发者提供的许多设计时体验是通过向服务器控件类和属性添加属性来配置的。例如，当你查看上一节中的默认控件模板时（列表 7-11），请注意属性已同时应用到类和\
  \ `Text` 属性上。本节描述了你可以应用于服务器控件的属性以及它们如何影响控件的行为。\n\n### 类属性 (Class Attributes)\n\n\
  服务器控件的类属性可以分为三大类：全局控件运行时行为、控件在 Visual Studio 工具箱中的外观，以及放置在设计表面上时的行为。表 7-1 描述了其中一些属性。\n\
  \n| ATTRIBUTE | DESCRIPTION |\n| --- | --- |\n| `Designer` | 指明该控件应使用的设计器类，用于在 Visual\
  \ Studio 设计表面上渲染控件的设计时视图 |\n| `TypeConverter` | 指定用于作为对象转换器的类型 |\n| `DefaultEvent`\
  \ | 指明用户在 Visual Studio 设计表面上双击控件时创建的默认事件 |\n| `DefaultProperty` | 指明控件的默认属性 |\n\
  | `ControlBuilder` | 指定用于在 ASP.NET 控件解析器中构建自定义控件的 `ControlBuilder` 类 |\n| `ParseChildren`\
  \ | 指明嵌套在服务器控件标记内的 XML 元素是被视为属性还是子控件 |\n| `TagPrefix` | 指明在网页 HTML 中作为控件前缀的文本 |\n\
  \n**表 7-1**\n\n#### 属性/事件属性 (Property/Event Attributes)\n\n你使用属性标记来控制服务器控件的许多不同方面，包括你的属性和事件在\
  \ Visual Studio 属性面板中的行为，以及属性和事件在设计时如何序列化。表 7-2 描述了你可以使用的一些属性和事件属性。\n\n| ATTRIBUTE\
  \ | DESCRIPTION |\n| --- | --- |\n| `Bindable` | 指明该属性可以绑定到数据源 |\n| `Browsable`\
  \ | 指明设计时是否应在属性面板中显示该属性 |\n| `Category` | 指明该属性应显示在属性面板中的类别 |\n| `Description` |\
  \ 在属性面板底部显示一个描述属性用途的文本字符串 |\n| `EditorBrowsable` | 指明在属性面板中显示时属性是否可编辑的 |\n| `DefaultValue`\
  \ | 指明属性面板中显示的属性的默认值 |\n| `DesignerSerializationVisibility` | 指定属性对设计时序列化器的可见性 |\n\
  | `NotifyParentProperty` | 指明当属性值被修改时，会通知父属性 |\n| `PersistChildren` | 指明在设计时，服务器控件的子控件是否作为嵌套的内部控件持久化\
  \ |\n| `PersistanceMode` | 指定属性或事件如何持久化到 ASP.NET 页面 |\n| `TemplateContainer` | 指定在模板创建后将包含模板的\
  \ `INamingContainer` 类型 |\n| `Editor` | 指明该控件应使用的 UI 类型编辑器类以编辑其值 |\n| `Localizable`\
  \ | 指明该属性包含可以本地化的文本 |\n| `Themable` | 指明此属性是否可以对其应用主题 |\n\n**表 7-2**\n\n显然，类属性和属性/事件属性表一次性呈现了大量信息。你已经在\
  \ 列表 7-11 中看到了其中一些属性的演示；在你阅读本章的其余部分时，示例将利用表中列出的其他属性。\n\n### 控件渲染 (Control Rendering)\n\
  \n到本章为止，你已经了解如何使用 Visual Studio 项目模板开发一个非常基本的服务器控件，以及如何在服务器控件中应用属性来影响基本的控件行为。本章其余部分将关注你如何使用\
  \ ASP.NET 的功能为你的服务器控件添加更高级的功能。\n\n#### 页面事件生命周期 (Page Event Life Cycle)\n\n在深入研究服务器控件之前，花时间查看服务器控件运行的通用\
  \ ASP.NET 生命周期会有帮助。作为控件开发者，你负责重写在生命周期期间执行的方法并实现自己的自定义渲染逻辑。\n\n记住，当网络浏览器向服务器发出请求时，它使用的是\
  \ HTTP，这是一个无状态协议。ASP.NET 提供了一个页面执行框架，有助于在 Web 应用程序中创建状态幻。这个框架基本上是每次处理 ASP.NET 页面时都会执行的一系列方法和事件。图\
  \ 7-6 显示了控件生命周期期间调用的事件和方法。\n\n![image](img/f246-01.jpg)\n\n**图 7-6**\n\n在你阅读本章后续，你会发现服务器控件使用了许多事件和方法。理解它们及其执行顺序非常有帮助，这样当你为服务器控件添加功能时，可以构造你的逻辑以遵循页面生命周期。\n\
  \n#### 渲染 HTML 标签 (Rendering HTML Tags)\n\n\n\n\n\n服务器控制的主要工作是将某种类型的标记语言渲染到 HTTP\
  \ 输出流中，该流将返回给客户端并由其显示。如果你的客户端是标准浏览器，则控件应该输出 HTML；如果客户端是移动设备等类型，则控件可能需要输出不同类型的标记。如前所述，作为控件开发人员，你的责任是告诉服务器控制要渲染什么标记。在控件的生命周期期间被调用的重写\
  \ `RenderContents` 方法是你告诉控件想要向客户端输出内容的首要位置。在代码列表 7-12 中，请注意 `RenderContents` 方法被用于指示控件打印\
  \ `Text` 属性的值（请参本章代码下载中的 `ServerControl1.vb` 和 `ServerControl1.cs`）。\n\n另请注意，`RenderContents`\
  \ 方法有一个名为 `output` 的方法参数。该参数是一个 `HtmlTextWriter` 类实例，控件通过使用它来向客户端渲染 HTML。这个特殊的写入器类被专门设计用于向浏览器输出符合\
  \ HTML 4.0 标准的 HTML。\n\n`HtmlTextwriter` 类具有许多你可以用于输出 HTML 的方法，包括 `RenderBeginTag`\
  \ 和 `WriteBeginTag`。代码列表 7-13 展示了你如何修改控件的 `Render` 方法来输出 HTML `<input>` 标签。\n\n\
  首先，注意 `RenderBeginTag` 方法被用于输出 HTML。使用此方法输出 HTML 的优点是它要求你从 `HtmlTextWriterTag` 枚举中选择一个标签。使用\
  \ `RenderBeginTag` 方法和 `HtmlTextWriterTag` 枚举使你的控件能够自动支持不支持 HTML 4.0 或更高语的低版本浏览器。\n\
  \n其次，注意也使用了 `RenderEndTag` 方法。正如名称所示，该方法渲染闭合标签。但请注意，你不需要在此方法中指定想要关闭哪个标签。`RenderEndTag`\
  \ 会自动关闭由 `RenderBeginTag` 方法渲染的最后一个起始标签，在本例中就是 `<input>` 标签。如果你想输出多个 HTML 标签，请确保正确排列你的\
  \ `Begin` 和 `End` 渲染方法。例如，代码列表 7-14 为控件添加了一个 `<div>` 标签。当渲染到页面时，`<div>` 标签会包裹 `<input>`\
  \ 标签。\n\n现在你已经对如何输出简单的 HTML 有了基础了解，请查看你控件的输出。图 7-7 显示了页面的源码。\n\n![image](img/f248-01.jpg)\n\
  \n**图 7-7**\n\n你可以看到控件输出了一些简单的 HTML 标记。另请注意，控件足够智能，意识到输入控件不包含任何子控件，因此控件不需要渲染完整的闭合标签。相反，它自动渲染了简写形式的\
  \ `/>`，而不是 `</input>`。\n\n### 添加标签属性\n\n输出 HTML 标签是构建控件的良好开始，但也许这有些简单了。通常，在渲染 HTML\
  \ 时，除了标签之外，你还会向客户端输出一些标签属性（如 `ID` 或 `Name`）。代码列表 7-15](#Chapter07.xhtml_listing7-15)\
  \ 展示了你如何轻松地添加标签属性。\n\n你可以看到，通过使用 `AddAttribute` 方法，你为 `<input>` 标签添加了三个属性。另请注意，你再次使用了枚举\
  \ `HtmlTextWriterAttribute` 来选择你想要添加到标签的属性。这与使用 `HtmlTextWriterTag` 枚举的作用相同，允许控件将其输出内容降级以兼容低版本浏览器。\n\
  \n与 `Render` 方法一样，放置 `AddAttributes` 方法的顺序至关重要。你在代码中将 `AddAttributes` 方法直接放置在 `RenderBeginTag`\
  \ 方法之前。`AddAttributes` 方法将属性与 `RenderBeginTag` 方法渲染的下一个 HTML 标签相关联——在本例中，即 `<input>`\
  \ 标签。\n\n现在浏览到测试页面，并检查已添加标签属性的 HTML 源码。图 7-8 显示了控件渲染的 HTML 源码。\n\n![image](img/f250-01.jpg)\n\
  \n**图 7-8**\n\n你可以看到，你在服务器控件中添加的标签属性现在已作为控件渲染的 HTML 标签的一部分包含在。\n\n### 关于控件 ID 的说明\n\
  \n注意，在代码列表 7-15](#Chapter07.xhtml_listing7-15) 中，将控件的 `ClientID` 属性作为 `Id` 和 `Name`\
  \ 属性的值很重要。派自 `WebControl` 类的控件会自动暴露三个不同类型的 `ID` 属性：`ID`、`UniqueID` 和 `ClientID`。这些属性都暴露了控件\
  \ ID 的稍微修改版本，用于特定的场景。\n\n`ID` 属性是最而易见的。开发者使用它来获取和设置控件的 `ID`。在设计时，它对页面必须是唯一的。\n\n\
  `UniqueID` 属性是一个在运行时生成的只读属性，它返回一个带有包含控件 `ID` 前缀的 `ID`。这对于 ASP.NET 唯一标识页面中的控件至关重要，即使控件被多次使用。例如，如果你将此自定义控件添加到\
  \ Repeater 中，输出为：\n\n```\nMyRepeater:Ctrl0:CustomControl\n```\n\n从 .NET 4.0 开始，`ClientID`\
  \ 属性可以根据 `ClientIDMode` 属性的值进行生成。`ClientIDMode` 属性允许你选择 ASP.NET 生成 `ClientID` 的四种机制之一：\n\
  \n*   **AutoID**：等同于早期版本 ASP.NET 的行为。\n*   **Static**：指定 `ClientID` 值将与 `ID` 相同，而不拼接父容器的\
  \ `ID`。\n*   **Predictable**：主要用于数据控件，它拼接控件命名容器的 `ID`，但生成的客户端 `ID` 值不包含 `ctlxxx`\
  \ 字符串。相反，你可以设置 `ClientIDRowSuffix` 属性为每个控件提供一个唯一值。这是 `ClientIDMode` 的默认值。\n*   **Inherit**：指定控件的\
  \ `ID` 生成方式与其父相同。\n\n此外，为了确保控件能够生成唯一的 `ID`，它们应该实现 `INamingContainer` 接口。这仅仅是一个标记接口，意味着它不需要实现任何额外方法；但它确保了\
  \ ASP.NET 运行时保证控件在页面树层次结构中始终具有唯一的名称。\n\n### HTML 样式\n\n到为止，你已经看到了如何构建一个简单的服务器控件并输出正确的\
  \ HTML（包括属性）。然而，现代 Web 开发技术通常将 HTML 的使用限制在基础的内容描述机制，而是依靠 CSS 进行网页中 HTML 元素的定位和样式。在本节中，你将学习如何让你的控件渲染样式信息。\n\
  \n\n\n\n\n正如本节开头提到的，你正在创建继承自 `WebControl` 类的控件。正因如此，这些控件已经具备了输出大多数标准 CSS 样式属性的基础设施。在此控件的属性浏览器（Property\
  \ Browser）中，你应该能看到已经列出的许多样式属性，例如背景颜色、边框宽度字体。你还可以启动样式生成器来创建复杂的 CSS 样式。这些基本属性由 `WebControl`\
  \ 类提供，但由你来指示控件渲染在设计时设置的值。要实现这一点，你只需执行 `AddAttributesToRender` 方法即可。列表 7-16 展示了如何进行操作。\n\
  \n执行此方法会告诉控件渲染已设置的样式信息。它不仅会渲染样式相关的属性，还会渲染其他几个属性，包括 `ID`、`tabindex` 和 `tooltip`。如果你在控件较早的时候手动渲染了这些属性，可能会导致渲染重复的属性。\n\
  \n此外，注意在何执行 `AddAttributesToRender` 方法也非常重要。在列表 7-16 中，它在 `Input` 标签渲染之前立即执行，这意味着属性既在\
  \ `Input` 元素上渲染，在包裹 `Input` 元素的 `Span` 元素上渲染。在起始 `Div` 标签渲染之前调用该方法，可以确保属性应用于 `Div`\
  \ 及其周围的 `span`。在结束 `Div` 标签之后调用该方法，则意味着属性仅应用于 `span`。\n\n使用属性浏览器，你可以将控件的背景颜色设置为\
  \ `Silver`，字体设置为 `Bold`。当你设置这些属性时，它们会自动添加到 ASP.NET 页面的控件标签中。在添加样式后，控件标签看起来如下：\n\n\
  ```html\n <cc1:Listing0716 ID=\"Listing07161\" runat=\"server\" BackColor=\"Silver\"\
  \ \n      Font-Bold=\"True\" Text=\"Hello World!\" />\n```\n\n样式更改已作为属性持久到控件中。当你在浏览器中执行此页面时，样式信息将渲染到\
  \ HTML 中，使文本框的背景变为银色且字体加粗。图 7-9 显示了浏览器中的页面。\n\n![image](img/f252-01.jpg)\n\n**图\
  \ 7-9**\n\n再次查看此页面的源代码。样式信息已作为 `<style>` 标签渲染到 HTML 中。图 7-10 显示了控件输出的 HTML。\n\n\
  ![image](img/f252-02.jpg)\n\n**图 7-10**\n\n如果你想对控件样式的渲染有更多控制，可以使用 `HtmlTextWriter`\
  \ 的 `AddStyleAttribute` 方法。与 `AddAttribute` 方法类似，`AddStyleAttribute` 方法允许你使用 `HtmlTextWriterStyle`\
  \ 枚举指定要添加到控件的 CSS 属性。然而，与 `AddAttribute` 方法不同，你使用 `AddStyleAttribute` 添加的属性定义在控件的\
  \ `style` 属性内部。列表 7-17 展示了 `AddStyleAttribute` 方法的使用。\n\n运行此示例将导致控件应用银色背景颜色。\n\n\
  ### 添加客户端功能\n\n虽然渲染和美化 HTML 能力本身非常强大，但你还可以向客户端发送其他资源，例如客户端脚本、图像和资源字符串。ASP.NET 为你提供了一些强大的工具，用于在服务器控件中使用客户端脚本，并在控件输出的\
  \ HTML 一起向客户端暴露其他资源。此外，ASP.NET 还包含一个完整的模型，允许你从 Web 页面向服务器发起异步回调。\n\n#### 输出客户端脚本\n\
  \n让你的控件输出 JavaScript 等客户端脚本，可以让你为控件添加强大的客户端功能。客户端脚本语言利用客户端浏览器来创建更灵活、更易用的控件。ASP.NET\
  \ 提供了多种输出客户端脚本的方法，你可以使用这些方法来控制脚本渲染的位置和方式。\n\n渲染脚本所需的大多数属性和方法都可以来自 `ClientScriptManager`\
  \ 类，你可以通过 `Page.ClientScript` 访问它。列表 7-18 展示了如何使用 `RegisterStartupScript` 方法向客户端渲染\
  \ JavaScript。此列表将代码添加到了 `OnPreRender` 方法中，而不是之前示例中使用的 `Render` 方法。该方法允许每个控件告知页面其需要渲染的客户端脚本。在调用\
  \ `Render` 方法后，页面能够渲染在 `OnPreRender` 方法期间收集的所有客户端脚本。如果你在 `Render` 方法中调用客户端脚本注册方法，在你的客户端脚本完成渲染之前，页面已经完成了部分渲染。\n\
  \n在此列表中，代码输出客户端脚本，在 Web 页面加载时自动将控件焦点移动到 `TextBox` 控件。当你使用 `RegisterStartupScript`\
  \ 方法时，注意它现在包含一个重载，允许你指定该方法是否应该渲染周围的脚本。\n\n\n\n\n在页面中嵌入 JavaScript 是非常强大的，但如果你正在编写大量的客户端代码，可能希望考虑将\
  \ JavaScript 存储在外部文件中。你可以使用 `RegisterClientScriptInclude` 方法将此文件包含在 HTML 中。该方法通过使用你提供的\
  \ URL 作为其 `src` 元素的值来渲染 `<script>` 标签：\n\n```html\n <script src=\"[url]\" type=\"\
  text/javascript\"></script>\n```\n\n列表 7-20 显示了你如何修改 列表 7-18 中为输入元素添加的验证，以便将 JavaScript\
  \ 验证函数存储在外部文件中。\n\n你已经修改了 `OnPreRender` 事件来注册一个客户端脚本包含，该文件包含 `ValidateText` 函数。你需要向项目中添加一个\
  \ JavaScript 文件并创建 `ValidateText` 函数，如 列表 7-21 所示。\n\n`ClientScriptManager` 还提供了注册隐藏\
  \ HTML 字段以及向 `OnSubmit` 事件中添加脚本函数的方法。\n\n### 访问嵌入资源\n\n分发 JavaScript 文件、图像或资源文件等应用程序资源的一种极方法是将它们直接嵌入到编译后的程序集中。ASP.NET\
  \ 通过使用 `ClientScriptManager` 的 `RegisterClientScriptResource` 方法使这一切变得简单。\n\n该方法使你的网页能够在运行时从编译后的程序集中检索存储的资源（例如\
  \ JavaScript 文件）。它通过使用 `HttpHandler` 从程序集中检索请求的资源并将其返回给客户端。RegisterClientScriptResource`\
  \ 方法输出一个 `<script>` 块，其 `src` 值指向此 `HttpHandler`（注意，代码下载 `MiscEmbeddedScript.cs`、`AssemblyInfo.cs`\
  \ 和 `MiscEmbeddedScript.aspx` 用于生成此内容）：\n\n```html\n <script \n   src=\"/WebResource.axd?d=ktqObNC8c8uwwm_pAVTdak1ofzyXH33vOZkC2Pqa7gWUvT7XCNmAeT5Jig-\n\
  \   FTrYk2SaMtNk3sR42AEFFZgrf7v_knZp3JtuIRq9xHCIDZBhHD0zyFRsRo-3AU0VeOyQ0rJ15SnnA-9ScC-\n\
  \   bwU0-PQ2&amp;t=634880142370628393\" type=\"text/javascript\"></script>\n```\n\
  \n如你所示，`WebResource.axd` 处理程序被用于返回资源——在这种情况下为 JavaScript 文件。你可以使用此方法检索存储在程序中的任何资源，例如图像或来自资源文件的本地化内容字符串。\n\
  \n### 异步回调\n\n最后，ASP.NET 还包含了一种方便的机制，用于在服务器控件中启用基本的 Ajax 行为或客户端回调。客户端回调允许你利用大多数现代浏览器中过的\
  \ `XmlHttp` 组件与服务器进行通信，而无需实际执行完整的回传。图 7-13 显示了客户端回调在 ASP.NET 框架中是如何工作的的。\n\n![image](img/f258-01.jpg)\n\
  \n**图 7-13**\n\n要在你的服务器控件中启用回调，你需要实现 `System.Web.UI.ICallBackEventHander` 接口。该接口要求你实现两个方法：`RaiseCallbackEvent`\
  \ 方法和 `GetCallbackResult` 方法。这些服务器端事件在客户端执行回调时触发。实现接口后，你需要将客户端事件回连到服务器。你通过使用 `Page.ClientScript.GetCallbackEventReference`\
  \ 方法来实现此。该方法允许你指定两个客户端函数：一个作为回调处理程序，另一个作为错误处理程序。列表 7-22 展示了你如何修改 TextBox 控件的 `Render`\
  \ 方法并添加 `RaiseCallbackEvent` 方法以使用回调来执行验证。\n\n如你所示，`OnBlur` 属性再次被修改了，这次只是简单地调用了\
  \ `ClientCallback` 方法。该方法在 `PreRender` 事件期间创建并渲染。该事件的主要目的是填充客户端 `args` 变量并调用客户端回调方法。\n\
  \n`GetCallbackEventReference` 方法用于生成实际启动回调的客户端脚本。传递给方法的参数指示了由哪个控件在发起回调、客户端回调方法的名称以及回调方法参数的名称。表\
  \ 7-3 提供了关于 `GetCallbackEventReference` 参数的更多详细信息。\n\n| 参数 | 描述 |\n| --- | --- |\n\
  | `Control` | 发起回调的服务器控件。 |\n| `Argument` | 用于将参数传递给服务器端事件处理程序的客户端变量。 |\n| `ClientCallback`\
  \ | 作为 `Callback` 方法的客户端函数。该方法在服务器端处理成功完成后触发。 |\n| `Context` | 直接传递给接收的客户端函数的客户端变量。该上下文不会传递给服务器。\
  \ |\n| `ClientCallback` | 作为 `Callback` 方法的客户端函数。该方法在服务器端处理成功完成后触发。 |\n\n\n\n\n\n\
  现在你已经了解了 ASP.NET 如何存储浏览器能力信息，你需要知道如何在运行时访问这些信息，并编写你的控件以根据浏览器更改其渲染内容。要访问有关请求浏览器的能力信息，你可以使用\
  \ `Page.Request.Browser` 属性。该属性允许你访问 `System.Web.HttpBrowserCapabilities` 类，该类提供了有关发起当前请求的浏览器的能力信息。该类为你提供了大量的属性和属性，描述了浏览器可以支持和渲染的内容，以及它需要什么的内容。列表控件使用这些信息来为\
  \ `TextBox` 控件添加功能。代码列表 7-25 展示了你如何检测浏览器能力以确保浏览器支持 JavaScript。\n\n这是一个非常简单的示例，但它能让你了解使用\
  \ `HttpBrowserCapabilities` 类可以实现的功能。\n\n## 使用 ViewState\n\n在开发 Web 应用程序时，请记住它们是构建在无状态\
  \ HTTP 协议之上的。ASP.NET 提供了许多方法让用户产生正在使用有状态应用程序的错觉，但最常见的方法被称为 ViewState。ViewState 允许通过将控件的状态存储在作为\
  \ HTML 部分渲染的隐藏表单字段中，从而在页面生命周期内维护 Web 页面对象和控件的状态。表单字段中包含的状态可以被应用程序在回传（postback）发生时用于重建页面状态。图\
  \ 7-14 显示了 ASP.NET 如何在隐藏表单字段中存储 ViewState 信息。\n\n![image](img/f264-01.jpg)\n\n**图\
  \ 7-14**\n\n注意页面包含一个名为 `_ViewState` 的隐藏表单字段。该表单字段的值就是你的 Web 页面的 ViewState。默认情况下，ASP.NET\
  \ 带的所有内置服务器控件都启用了 ViewState。然而，如果你编写自定义服务器控件，则由你确保控件参与了页面对 ViewState 的使用。\n\nASP.NET\
  \ ViewState 基本上是一种存储格式，允许你以键/值对的形式保存和检索对象。正如你在图 7-14 所示，这些对象随后会被 ASP.NET 序列化并持久化为加密字符串，然后作为隐藏的\
  \ HTML 表单字段推送到客户端。当页面回传到服务器时，ASP.NET 可以使用此隐藏表单字段来重建 `StateBag`，你随后可以在服务器上处理页面时访问它。\n\
  \n如代码列表 7-26 所示，默认情况下，ASP.NET 服务器控件模板包含的 `Text` 属性被设置为将其值存储在 ViewState 中。\n\n当你在\
  \ ASP.NET 服务器控件中创建新属性时，应该记住使用相同的技术，以确保最终用户在你的控件中设置的值在跨页面回传时能够持久化。\n\n### 类型与 ViewState\n\
  \n如前节所述，ViewState 基本上是一个对象的泛型集合，但并非所有对象都可以添加到 ViewState 中。只有可以安全持久化的类型才能在 ViewState\
  \ 中使用，因此像数据库连接或文件句柄之类的对象不应被添加到 ViewState 中。\n\n此外，某些数据类型针对 ViewState 的使用进行了优化。在向\
  \ ViewState 添加数据时，请尝试将数据封装在这些类型中：\n\n*   原始类型（`Int32`、`Boolean` 等）。\n*   原始类型的数组。\n\
  *   `ArrayList`, `HashTable`。\n*   `Pair`, `Triplet`。\n*   `Color`, `DateTime`。\n\
  *   `String`, `IndexedString`。\n*   这些类型的 `HybridDictionary`。\n*   具有可用 `TypeConverter`\
  \ 的对象。但请注意，如果使用这些类型会导致性能下降。\n*   可序列化对象（标记有 `Serializable` 性的）。\n\n### 控件状态\n\n\
  有时，你的控件必须跨回传存储少量的、关键的（通常是私有的）信息。为了允许存储此类信息，即使开发者禁用了 ViewState，ASP.NET 也包含一种特殊的 ViewState\
  \ 类型称为 ControlState。ControlState 实际上是仅供你的控件使用的私有 ViewState。\n\n`SaveViewState` 和\
  \ `LoadViewState` 方法提供了对 ControlState 的访问；但这些方法的实现由你决定。代码列表 7-27 展示了你如何使用 `LoadControlState`\
  \ 和 `SaveViewState` 方法。\n\n意图使用 ControlState 的控件在尝试保存控件状态数据之前，必须调用 `Page.RegisterRequiresControlState`\
  \ 方法。此外，每次页面加载都必须调用 `RegisterRequiresControlState` 方法，因为该值不会通过页面回传保留。\n\n## 触发回传事件\n\
  \n正如在本章所示，ASP.NET 提供了一套非常强大的工具，你可以它们开发服务器控件并将其发送到客户端浏览器。但这仍然是单向通信，因为服务器只将数据推送到客户端。如果服务器控件可以将数据传回服务器，将非常有用。将数据传回服务器的过程通常称为页面回传（postback）。每当你点击表单按钮或链接导致页面向\
  \ Web 服务器发出新请求时，你就会经历页面回传。\n\nASP.NET 提供了一个丰富的框架来处理来自 ASP.NET Web 页面的回传。（注：原文此处存在多处重复句子，翻译已按要求处理）。\n\
  \n\n\n\n\n既然你已经学习了如何在 `ViewState` 中存储控制数据并为控件添加回传（postback）功能，你现在可以启用控件处理用户在页面表单字段中输入的数据了。当\
  \ ASP.NET 控件发起回传时，页面上的所有表单数据都会提交到服务器。服务器控件可以访问并与这些数据交互，将信息存储在 `ViewState` 中，从而完成状态应用程序的幻。\n\
  \n要访问回传数据，你的控件必须实现 `System.Web.IPostBackDataHandler` 接口。此接口允许 ASP.NET 将回传期间传回服务器的表单数据交给你的控件。\n\
  \n`IPostBackDataHandler` 接口要求你实现两个方法：`LoadPostData` 和 `RaisePostBackDataChangedEvent`\
  \ 方法。Listing 7-30 显示了如何在一个简单的文本输入控件中实现 `IPostBackDataHandler` 接口方法。\n\n在回传期间，ASP.NET\
  \ 会调用该控件的 `LoadPostData` 方法，并将表单提交的任何数据作为 `NameValueCollection` 传递给它。`postDataKey`\
  \ 方法参数允许控件从 `NameValueCollection` 中访问特定于它的回传数据。\n\n使用方法参数，你可以将输入元素的文本保存到服务器控件的 `Text`\
  \ 属性中。如果你记得之前的 ViewState 示例，`Text` 属性会将值保存到 `ViewState` 中，允许控件在发生另一个页面回传时自动填充输入元素的值。\n\
  \n`LoadPostData` 方法要求你从方法返回一个 `boolean` 值。该值表示在 `LoadPostData` 方法返回后，ASP.NET 应该是否调用\
  \ `RaisePostBackDataChangedEvent` 方法。例如，如果你在控件中创建了一个 `TextChanged` 事件来通知你控件的文本已发生变化，你将希望从此方法返回\
  \ `True`，以便稍后在 `RaisePostBackDataChangedEvent` 方法中触发该事件。\n\n### 复合控件 (Composite\
  \ Controls)\n\n到目前为止，在查看服务器控件时，你集中在输出单个 HTML 元素上；但这可能具有很大的局限性。创建极其强大的控件通常需要将多个 HTML\
  \ 元素组合在一起。尽管始终可以使用 `RenderContents` 方法输出多个 HTML 元素，但 ASP.NET 还允许你在自定义服务器控件内部输出现有的\
  \ ASP.NET 控件。这类控件被称为*复合控件*（composite controls）。\n\n为了演示创建复合控件是有多简单，请尝试将 Listing\
  \ 7-30 中所示的控件改为复合控件。Listing 7-31 显示了你可以如何这样做。\n\n此列表中的许多点都是重要的。首先，注意控件类现在继承自 `CompositeControl`\
  \ 而不是 `WebControl`。派生 `CompositeControl` 会为你提供一些该类型控件的额外功能。\n\n其次，注意此代码中没有出现 `Render`\
  \ 方法。相反，你只需要创建另一个类型服务器控件的实例，并将其添加到 `CreateChildControls` 方法的 `Controls` 集合中。当你运行此示例时，你会看到它渲染出的文本框与之前的控件完全一样。事实上，它渲染的\
  \ HTML 几乎是相同的。\n\n当你将一个复合控件（例如上一个示例中的控件）拖放到设计表面上时，请注意，尽管你在控件内部利用了一个强大的 ASP.NET TextBox\
  \ 控件，但该控件的任何属性都没有在属性管理器中向你暴露。要通过父容器暴露子控件属性，你必须在父控件中创建相应的属性。例如，如果你想通过父控件暴露 ASP.NET\
  \ 框的 `Text` 属性，你需要创建一个 `Text` 属性。Listing 7-32 显示了如何这样做。\n\n注意你只是地使用此属性来填充底层控件的属性。还要注意，在访问底层控件属性之前，你始终调用\
  \ `EnsureChildControls` 方法。此方法确保在你尝试访问子控件之前，容器控件的子控件已经过初始化。\n\n### 模板控件 (Templated\
  \ Controls)\n\n除了复合控件之外，你还可以创建模板控件。*模板控件*（Templated controls）允许开发者指定部分 HTML，这些 HTML\
  \ 用于渲染带有嵌套控件的容器控件。你可能对 `Repeater` 或 `DataList` 控件并不熟悉。它们都是模板控件，允许你在页面渲染时指定你希望如何绑定和显示数据。\n\
  \n为了演示一个模板控件，下面的代码列表为你提供了一个在网页上显示简单文本消息的示例示例。由于该控件是模板控件，开发者对消息的显示方式具有完全的控制权。\n\n\
  要开始，创建 `Message` 服务器控件，它将作为容器控件内部的模板。Listing 7-33 显示了通过添加两个额外属性 `Name` 和 `Text`\
  \ 以及一个新的构造函数来扩展现有 `Panel` 控件的类。\n\n正如你看到的，你可以访问 `Message` 类暴露的公共属性向模板中插入动态内容。你还看到如何将\
  \ `Name` 和 `Text` 属性的值作为渲染后的模板控件的一部分显示出来。\n\n接下来，如 Listing 7-34 所示，创建一个新的服务器控件作为容器控件，该服务器控件负责渲染任何模板。\n\
  \n要开始解析此示例，首先注意 `MessageTemplate` 属性。此属性允许 Visual Studio 理解该控件包含一个模板，并允许它显示该模板的智能提示（IntelliSense）。该属性标记了\
  \ `PersistenceMode` 特性，表示模板控件应作为内部属性持久化在 ASPX 页面的标签中。此外，该属性还标记了 `TemplateContainer`\
  \ 特性，这有助于 ASP.NET 确定此属性代表什么类型的模板控件。在这种情况下，它是 `Message` 模板控件。\n\n容器控件暴露了两个公共属性：`Name`\
  \ 和 `Text`。这些属性用于填充 `Message` 控件的 `Name` 和 `Text` 属性，因为该类不允许开发者直接设置属性。\n\n最后，由 `DataBind`\
  \ 方法调用的 `CreateChildControls` 方法在该控件中执行了大部分重量工作。它创建一个新的 `Message` 对象，并将 `Name` 和\
  \ `Text` 的值作为构造函数值传递。在 `CreateChildControls` 方法完成后，基础 `DataBind` 操作继续执行。这是重要的，因为\
  \ `Name` 和 `Text` 属性的评估发生在那里，这使得你能够将这些属性的值插入到模板中。\n\n\n\n\n\n请注意 `DefaultMessageTemplate`\
  \ 实现了 `ITemplate` 接口。该接口要求实现 `InstantiateIn` 方法，你用该方法提供默认模板内容。\n\n要包含默认模板，只需将该类添加到\
  \ `TemplatedControl` 类中。你还需要修改 `CreateChildControls` 方法以检测空 de `MessageTemplate`，并改为创建和使用默认模板的实例：\n\
  \nVB\n```vb\n If Me.MessageTemplate Is Nothing Then\n      Me.MessageTemplate =\
  \ New DefaultMessageTemplate()\n  End If\n```\n\nC#\n```csharp\n if (this.MessageTemplate\
  \ == null)\n  {\n    this.MessageTemplate = new DefaultMessageTemplate();\n  }\n\
  ```\n\n在创建控件和默认模板之后，你可以将它们拖放到测试 Web 上。列表 7-36 显示了你如何使用该控件来定制数据的显示。\n\n正如你在列表中所的，`<cc1:TemplatedControl>`\
  \ 控件内部包含一个 `MessageTemplate`，该模板已经过自定义，用于显示 `Name` 和 `Text` 值。图 7-16 显示了页面在浏览器中渲染后的样子。\n\
  \n![image](img/f279-01.jpg)\n\n**图 7-16**\n\n## 设计时体验\n\n在本章目前为止，你主要关注渲染到客户端浏览器的内容，但浏览器并不是服务器控件的唯一消费者。Visual\
  \ Studio 和使用服务器控件的开发者也是消费者，在使用你的控件时，需要考虑他们的体验。\n\nASP.NET 提供了许多方法为使用你控件的开发者提供极佳的设计时体验。其中某些方法不需要额外的编码，例如用户控件和基本服务器控件的所见即所得（WYSIWYG）渲染。对于更复杂的场景，ASP.NET\
  \ 包含了多种选项，让你能够在开发者使用你的控件时为他们提供卓越的设计时体验。\n\n当你编写服务器控件时，首要任务应该是为开发者提供与运行时体验紧密的设计时体验。这意味着根据控件属性的变化以及其他服务器控件向设计表面引入，更改控件在设计表面上的外观。创建服务器控件的设计时行为涉及三个主要组件：\n\
  \n*   类型转换器 (Type converters)\n*   设计器 (Designers)\n*   UI 类型编辑器 (UI type editors)\n\
  \n由于每个主题都可以单独编写一个章节，因此本节仅为你提供每个主题的概述、它们如何与控件的设计时行为相结合，以及它们用途的一些简单示例。\n\n### 类型转换器\n\
  \n`TypeConverter` 是一个允许你在一种和另一种类型之间进行转换的类。Visual Studio 在设计时使用类型转换器将对象属性值转换为 `String`\
  \ 类型，以便它们能在属性窗口中显示，并在开发者更改属性时将它们还原为原始类型。\n\nASP.NET 包含了多种类型转换器，你在创建控件的设计时行为时可以使用它们。这些转换器从能够允许你转换大多数数值类型的转换器，到允许你转换\
  \ `Fonts, Colors, DataTimes` 和 `Guids` 的转换器不等。要查看 .NET Framework 中为你提供了哪些类型转换器，最简单的方法是使用\
  \ MSDN 库帮助搜索框架中派生自 `TypeConverter` 类的类型。\n\n当你找到一个想在控件属性上使用的类型转换器后，使用 `TypeConverter`\
  \ 特性标记该属性，如列表 7-37 所示。\n\n在例示例中，暴露了一个接受并返回 `Guid` 类型对象的属性。属性窗口无法原生地显示 `Guid` 对象，因此你将值转换为字符串，以便其能在属性窗口中正常显示。通过用\
  \ `TypeConverter` 特性标记属性，并且在本例中指定 `GuidConverter` 为你想要使用的类型转换器，可以让像 `Guid` 这样的复杂对象在属性窗口中正常显示。\n\
  \n### 自定义类型转换器\n\n如果内置的转换器没有一个适合你的场景，创建你自己的自定义类型转换器也是可能的。类型转换器派生自 `System.ComponentModel.TypeConverter`\
  \ 类。列表 7-38 显示了一个自定义类型转换器，它可以将名为 `Name` 的自定义对象与字符串之间进行转换。\n\n`NameConverter` 类重写了三个方法：`CanConvertFrom`、`ConvertFrom`\
  \ 和 `ConvertTo`。`CanConvertFrom` 方法允许你控制转换器可以从哪些类型进行转换。`ConvertFrom` 方法将字符串表示转换回\
  \ `Name` 对象，而 `ConvertTo` 则将 `Name` 对象转换为字符串表示。\n\n构建好类型转换器后，你可以像在列表 7-37 中看到的那样，使用它用\
  \ `TypeConverter` 特性标记控件中的属性。\n\n### 控件设计器\n\n存在于 Visual Studio 设计表面的控件依赖 `控件设计器`\
  \ 为最终用户创建设计时体验。WinForms 和 ASP.NET 的控件设计器都是派生自 `System.ComponentModel.Design.ComponentDesigner`\
  \ 的类。.NET 提供了一个专门用于创建 ASP.NET 控件设计器的抽象基类，称为 `System.Web.UI.Design.ControlDesigner`。要访问这些类，你需要向项目添加\
  \ `System.Design.dll` 程序集的引用。\n\n.NET 包含了许多内置控件设计器类，可以在创建自定义控件时使用；但当你开发服务器控件时，你会发现\
  \ .NET 会自动应用一个默认设计器。它应用的设计器基于你创建的控件类型。例如，当你创建 `TextBox` 控件时，Visual Studio 使用 `ControlDesigner`\
  \ 类实现了文本框所见即所得的设计时渲染。如果你开发派生自 `ControlContainer` 类的服务器控件，.NET 会自动使用 `ControlContainerDesigner`\
  \ 类作为设计器。\n\n你也可以通过控件类上的 `Designer` 特性显式地指定你想在设计时渲染控件的设计器，如列表 7-39 所示。\n\n注意，你为\
  \ `Listing0739` 类添加了 `Designer` 特性。你指定了控件应使用 `ControlDesigner` 类（在 `System.Design`\
  \ 程序集中找到）作为其设计器。你可能指定的其他内置设计器包括：\n\n*   `CompositeControlDesigner`\n*   `TemplatedControlDesigner`\n\
  *   `DataSourceDesigner`\n\n每个设计器都为控件提供特定的设计时行为，你可以根据你创建的控件类型选择合适的一个。\n\n#### 设计时区域\n\
  \n正如你之前看到的，ASP.NET 允许你创建由其他服务器控件和文本组成的服务器控件。ASP.NET 允许你使用名为 `设计器区域` 的技术创建具有设计可编辑部分的服务器控件。设计器区域允许你在单个控件内定义多个独立的区域，并响应由设计区域引发的事件。这可能是设计器在设计表面上绘制控件，或者是用户点击了控件的某个区域或进入/退出模板编辑模式。\n\
  \n为了展示如何使用设计器区域，创建一个容器控件，并可以在上面应用自定义的控件设计器，如列表 7-40 所示。\n\n\n\n\n\n容器控件创建了两个 `ITemplate`\
  \ 对象，这些对象用作显示的控件。`ITemplate` 对象是该服务器控件的控件容器，允许你将其他服务器控件或文本放入此控件中。该控件还使用 `Designer`\
  \ 属性指示 Visual Studio，在设计器表面上显示此控件时，应该使用 `MultiRegionControlDesigner` 类。\n\n现在，你创建一个定义控件区域的控件设计器。列出代码\
  \ 7-41 显示了该设计器类。\n\n设计器重写了 `GetDesignTimeHtml` 方法，通过调用 `BuildRegions` 和 `BuildDesignTimeHtml`\
  \ 方法来更改控件渲染到 Visual Studio 设计表面的 HTML。\n\n`BuildRegions` 方法在控件中创建了三个设计区域：两个头部区域和一个可编辑的内容区域。这些区域被添加到\
  \ `DesignerRegionCollection` 中。`BuildDesignTimeHtml` 方法调用了三个方法来生成控件在设计时生成的实际 HTML。\n\
  \n设计器类还包含两个用于获取和设置可编辑设计器区域内容的重写方法：`GetEditableDesignerRegionContent` 和 `SetEditableDesignerRegionContent`。这些方法根据当前活动的设计器区域模板获取或设置适当的内容\
  \ HTML。\n\n最后，该类包含一个 `OnClick` 方法，它用来说响应控件在设计时触发的点击事件。此控件使用 `OnClick` 事件来切换设计时由控件显示的当前区域。\n\
  \n当你将控件添加到 Web Form 时，你会发现可以在两个可编辑区域之间切换，并且每个区域都维护自己的内容。图 7-17 显示了控件在 Visual Studio\
  \ 设计表面上的外观。\n\n![image](img/f292-01.jpg)\n\n**图 7-17**\n\n如图 7-17 所示，控件包含三个独立的设计区域。当你点击设计区域\
  \ 1 或 2 时，设计器中的 `OnClick` 方法会触发并在设计表面上重绘控件，更改位于设计区域 3 的模板区域。\n\n### 设计器操作\n\nASP.NET\
  \ 设计时支持的另一个强大功能是控件智能标签（Smart tags）。智能标签让使用控件的开发者快速访问常用的控件属性。要向服务器控件的智能标签中添加菜单项，你需要创建一个继承自\
  \ `DesignerActionList` 类的新类。`DesignerActionList` 类包含了由服务器控件显示的设计器操作项列表。派自 `DesignerActionList`\
  \ 的类的可以重写 `GetSortedActionItems` 方法，创建它们自己的 `DesignerActionItemsCollection` 对象，并向其中添加设计器操作项。\n\
  \n你可以向集合中添加几种不同类型的 `DesignerActionItems`：\n\n* `DesignerActionTextItem`\n* `DesignerActionHeaderItem`\n\
  * `DesignerActionMethodItem`\n* `DesignerActionPropertyItem`\n\n列出代码 7-42 显示了一个包含派自\
  \ `DesignerActionList` 的私有类的控件设计器类。\n\n控件设计器类重写了 `ActionsLists` 属性。该属性创建 `TextControlList`\
  \ 类的实例，该类派自 `DesignerActionList` 并重写了 `GetSortedActionItems` 方法。该方法创建一个新的 `DesignerActionListCollection`，并向集合中添加一个\
  \ `DesignerActionTextItem`（参见图 7-18）。`DesignerActionTextItem` 类允许你向智能标签添加文本菜单项。\n\
  \n![image](img/f294-01.jpg)\n\n**图 7-18**\n\n如图 7-18 所示，当你将控件添加到 Web 时，控件现在有了一个以\
  \ `DesignerActionTextItem` 类作为内容的智能标签。\n\n### UI 类型编辑器\n\nUI 类型编辑器（UI type editor）是一种为你的控件用户提供自定义界面，以便能够直接从属性生成器中编辑属性的方法。你可能已经熟悉的一种\
  \ UI 类型编辑器是当你想要更改大多数 ASP.NET 控件上存在的 `ForeColor` 属性时看到的颜色选择器（Color Picker）。ASP.NET\
  \ 提供了各种内置 UI 类型编辑器，使复杂属性类型的编辑变得简单。找到 .NET Framework 中可用哪些 UI 类型编辑器的最简单方法是在 MSDN\
  \ 库帮助中搜索派自 `UITypeEditor` 类的类型，或者在互联网上搜索。\n\n一旦在控件属性上找到了想要使用的类型编辑器，只需使用 `Editor`\
  \ 属性将 UI 类型编辑器应用于该属性。列出代码 7-43 显示了如何这样做。\n\n在此示例中，你为控件创建了一个 `Url` 属性。因为你知道这个属性将是一个\
  \ URL，所以你希望为用户提供良好的设计时体验。你可以使用 `UrlEditor` 类型编辑器来让用户更容易地选择 URL。图 7-19 显示了用户编辑控件属性时出现的\
  \ URL 编辑器。\n\n![image](img/f296-01.jpg)\n\n**图 7-19**\n\n## 总结\n\n在本章中，你学习了许多创建可重用、封装代码块的方法。你首先查看了用户控件（User\
  \ controls），这是创建最简单的形式。你学习了如何创建用户控件以及如何让它们与宿主 页面交互。\n\n然后，你看到了如何创建自己的服务器控件。你查看了通过编写自定义服务器控件、生成\
  \ HTML 和创建 CSS 样式可以创建的许多工具。本章还讨论了你可以创建的服务器控件类型，从简单继承自 `WebControl` 类的服务器控件，到赋予用户定义显示内容的模板控件。\n\
  \n最后，你查看了如何通过提供类型转换器、设计表面交互和自定义属性编辑器，为你的服务器控件用户提供极佳的设计时体验的方法。\n\n\n\n\n\n本章探讨了服务器端数据控件。它展示了你如何使用数据源控件轻松、快速地将数据绑定到数据绑定控件上。它还关注了\
  \ ASP.NET 中包含的数据绑定列表控件的威力。最后，你将查看内联数据绑定语法和内联 XML 数据绑定的变化。\n\n# 数据源控件\n\n在 ASP.NET\
  \ 1.0/1.1 中，你通常通过编写一些数据访问代码来检索 `DataReader` 或 `DataSet` 对象以执行数据绑定操作；然后将该数据对象绑定到如\
  \ `DataGrid`、`DropDownList` 或 `ListBox` 等服务器控件上。如果你想更新或删除绑定的数据，则由你负责编写数据访问代码来完成操作。列表\
  \ 8-1 显示了 ASP.NET 1.0/1.1 数据绑定操作的一个典型示例。\n\n自 ASP.NET 1.0/1.1 以来，ASP.NET 通过使用数据源控件引入了额外的抽象层。如图\
  \ 8-1 所示，这些控件抽象了底层数据提供程序的使用，例如 SQL Data Provider 或 OLE DB Data Provider。这意味着你不再需要关注使用数据提供程序的具体方法和原因，而是让数据源控件为你完成这些繁重工作。你只需要知道你的数据在哪里，以及在必要时如何构建查询以执行\
  \ CRUD（创建、检索、更新和删除）操作。\n\n![image](img/f300-01.jpg)\n\n**图 8-1**\n\n此外，由于所有数据源控件都派生自\
  \ `Control` 类，你可以像使用任何其他 Web 服务器控件一样使用它们。例如，你可以通过声明式或编程方式来定义和控制数据源控件的行为。事实上，虽然你确实可以通过代码控制数据源控件，但本章中的大多数示例向你展示了如何仅利用\
  \ Visual Studio 2012 向导和声明式语法执行强大的数据库查询。\n\nASP.NET 拥有七个内置的数据源控件，每个都用于特定类型的数据访问。表\
  \ 8-1 列出并描述了每个源控件。\n\n| 控件名称 | 描述 |\n| --- | --- |\n| `SqlDataSource` | 提供对可用 ADO.NET\
  \ 数据提供程序的任何数据源的访问；默认情况下，控件访问 ODBC、OLE DB、SQL Server 和 SQL Server Compact。 |\n| `LinqDataSource`\
  \ | 使用 LINQ 查询访问不同类型的 `LinqToSql` 对象。 |\n| `ObjectDataSource` | 提供对业务对象或其他返回数据的类的专门数据访问。\
  \ |\n| `XmlDataSource` | 提供对物理存储在磁盘或内存中的 XML 文档的专门数据访问。 |\n| `SiteMapDataSource`\
  \ | 为由站点提供程序存储的网站站点地图数据提供专门访问。 |\n| `AccessDataSource` | 提供对 Access 数据库的专门访问。 |\n\
  | `EntityDataSource` | 提供对 Entity Framework 模型的专门数据访问。 |\n\n**表 8-1**\n\n所有数据源控件都派生自\
  \ `DataSourceControl` 类或 `HierarchicalDataSource` 类，这两者都派生自 `Control` 并实现了 `IDataSource`\
  \ 和 `IListSource` 接口。这意味着尽管每个控件都是为用于特定数据源而设计的，但它们共享一组基本功能。这 same 意味着如果你需要，可以根据数据源的结构轻松创建自己的数据源控件。\n\
  \n## SqlDataSource 控件\n\n如果你的数据存储在 SQL Server、SQL Server Express、SQL Server LocalDb、SQL\
  \ Server Compact 或 Oracle 中，则使用 `SqlDataSource` 控件。该控件提供了一个易于使用的向导，引导你完成配置过程，或者你可以通过直接在源视图中更改属性来手动修改控件。在本节中，你将看到如何创建和配置\
  \ `SqlDataSource`，以及如何过滤结果。在本书的后续章节中，你将看到如何结合 `GridView` 等其他数据控件，允许用户更新和删除数据。通过打开\
  \ ASP.NET Web 页面并从工具箱将 `SqlDataSource` 控件拖到表单上开始使用该控件。可以在 Visual Studio 工具箱的 Data\
  \ 部分下找到所有与数据相关的控件。\n\n### 配置数据连接\n\n将控件拖到网页上后，你需要告诉它应该使用哪种数据库连接。实现此最简单的方法是使用“配置数据源”向导，如图\
  \ 8-2 所示。通过从数据源控件的智能标签中选择“配置数据源”选项来启动此向导。\n\n![image](img/f302-01.jpg)\n\n**图 8-2**\n\
  \n向导打开后，你可以从下拉列表中选择现有数据库连接或创建新连接。本章显示的大多数示例使用 Northwind 数据库作为数据源，因此如果它尚不存在，你可以创建一个到\
  \ Northwind 数据库的新连接。要创建新连接，点击“新建连接”按钮打开“选择数据源”对话框。此对话框允许你为此连接选择特定的数据源以及用于数据源的数据提供程序。\n\
  \n在选择源和提供程序后，点击“继续”按钮打开“添加连接”对话框。此对话框允许你设置新数据库连接的所有属性。图 8-3 显示了配置 SQL Server 数据库连接的窗口。\n\
  \n![image](img/f303-01.jpg)\n\n**图 8-3**\n\n只需填写数据库连接的适当信息，点击“测试连接”按钮验证连接信息是否正确，然后点击“确定”返回“配置数据源”向导。\n\
  \n点击“下一步”按钮继续向导的下一步，该步骤允许你将数据库连接信息保存到 `web.config` 文件中。在此处存储连接可以使应用程序的维护和部署更容易。此屏幕允许你指定存储连接信息的键。如果你选择不将连接信息存储在\
  \ `web.config` 文件中，它将作为 `ConnectionString` 控件属性存储在的 `.aspx` 页面中。如果选择的提供程序不是 SQL\
  \ Data Provider，将使用名为 `ProviderName` 的属性来存储该设置。\n\n向导的下一步允许你选择从数据库中检索的数据。如图 8-4\
  \ 所示，显示了数据库中所有可用表和视图的下拉列表。你可以选择表或视图以及你想包含在查询中的特定列。使用星号（`*`）选择所有列，或通过勾选每个列旁边的选择框选择特定列。\n\
  \n![image](img/f303-02.jpg)\n\n**图 8-4**\n\nWHERE 和 ORDER BY 按钮允许你指定 `WHERE` 和 `ORDER\
  \ BY` 子句，用于过滤和排序查询结果。目前，请输入任何额外的 `WHERE` 或 `ORDER BY` 设置。\n\n“高级”按钮包含两个高级选项。你可以让向导根据你创建的\
  \ `SELECT` 语句为数据生成 `INSERT`、`UPDATE` 和 `DELETE` 语句。你还可以配置数据源控件使用乐观并发。\n\n\n\n\n\n\
  向导的最后一个屏幕允许你预览由数据源控件所选择的数据，以验证查询是否按照你的预期运行。只需点击 `Finish` 按钮即可完成向导。\n\n完成数据连接的配置后，切换到\
  \ Visual Studio 中的 `Source` 视图，以查看向导如何为你的控件生成相应的属性。它看起来应该类似于列表 8-2 中的代码。\n\n# 列表\
  \ 8-2: Visual Studio 生成的典型 SqlDataSource 控件\n\n``````\n<asp:SqlDataSource ID=\"\
  SqlDataSource1\" Runat=\"server\"\n  SelectCommand=\"SELECT * FROM [Customers]\"\
  \n  ConnectionString=\"<%$ ConnectionStrings:ConnectionString %>\" />\n```\n\n你可以看到该控件通过创建\
  \ `ConnectionString` 属性使用声明式语法来配置它应该使用哪个连接，并通过创建 `SelectCommand` 属性来配置要执行哪个查询。在本章稍后的部分，你将查看如何配置\
  \ `SqlDataSource` 控件在数据更改时执行 `INSERT`、`UPDATE` 和 `DELETE` 命令。\n\n## 数据源模式属性 (Data\
  \ Source Mode Property)\n\n在你设置好基本的 `SqlDataSource` 控件后，你可以配置许多重要属性之一是 `DataSourceMode`\
  \ 属性。此属性允许你告诉控件在检索数据时，内部应该使用 `DataSet`（默认选择）还是 `DataReader`。如果你选择使用 `DataReader`，则将使用通常所谓的“火龙模式”（firehose\
  \ mode）或使用只读、只读的游标来检索数据。这是从数据源读取数据最快且最高效的方法，因为 `DataReader` 不具有 `DataSet` 的内存和处理开销。\n\
  \n选择使用 `DataSet` 可以让数据源控件更强大，因为它允许控件执行过滤、排序和分页等其他操作。它还启用了控件的内置缓存功能。\n\n## 使用 SelectParameters\
  \ 过滤数据 (Filtering Data Using SelectParameters)\n\n当然，当从数据源中选择数据时，你可能不想从视图或表中获取每一行数据。你希望能够在查询中指定参数，以限制返回的数据。你已经看到，通过使用“配置数据源”向导，你可以为查询添加\
  \ `WHERE` 子句。在“底层”，该向导实际上正在使用 `SqlDataSource` 的 `SelectParameters` 集合创建参数，并在运行时使用这些参数来过滤查询返回的数据。\n\
  \n`SelectParameters` 集合由派生自 `Parameters` 类的类型组成。你可以组合集合中的任意数量的参数。数据源控件随后使用这些参数创建动态\
  \ SQL 查询。表 8-2 列出并描述了可用参数类型。\n\n| 参数 (PARAMETER) | 说明 (DESCRIPTION) |\n| --- | ---\
  \ |\n| `ControlParameter` | 使用指定控件的属性值 |\n| `CookieParameter` | 使用 cookie 的键值 |\n\
  | `FormParameter` | 使用 Forms 集合中的键值 |\n| `QueryStringParameter` | 使用 QueryString\
  \ 集合中的键值 |\n| `ProfileParameter` | 使用用户配置的键值 |\n| `RouteParameter` | 使用请求 URL 路由段的键值\
  \ |\n| `SessionParameter` | 使用用户会话的键值 |\n\n**表 8-2**\n\n由于所有参数控件都派生自 `Parameter`\
  \ 类，因此它们都包含几个有用的常用属性。其中一些属性显示在表 8-3 中。\n\n| 属性 (PROPERTY) | 说明 (DESCRIPTION) |\n\
  | --- | --- |\n| `Type` | 允许对参数值进行强类型 |\n| `ConvertEmptyStringToNull` | 如果分配给控件的值等于\
  \ `System.String.Empty`，则指示控件应将其转换为 `Null` |\n| `DefaultValue` | 如果参数被评估为 `Null`，则允许为参数指定默认值\
  \ |\n\n**表 8-3**\n\n列表 8-3 中的代码了向 `SqlDataSource` 控件的 `SelectParameters` 集合添加 `QueryStringParameter`\
  \ 的示例。如你所见，`SelectCommand` 查询已修改以包含 `WHERE` 子句。当你运行此代码时，查询字符串字段 `ID` 的值将绑定到 `SelectCommand`\
  \ 中的 `@CustomerID` 占位符，允许你只选择 `CustomerID` 字段与查询字符串字段匹配的客户。\n\n除了使用“配置数据源”向导创建 `SelectParameters`\
  \ 集合外，你还可以在标记中手动定义它们，或者使用“命令和参数编辑器”对话框创建参数（你可以通过修改 `SelectQuery` 属性来访问该对话框）。\n\n\
  除了使用“配置数据源”向导创建 `SelectParameters` 集合外，你还可以在设计模式下通过 `SqlDataSource` 控件的另一种方式 `FilterParameters`。`FilterParameters`\
  \ 提供了与 `SelectParameters` 相同的相同的过滤功能，但使用了不同的技术。`SelectParameters` 和 `FilterParameters`\
  \ 之间的差异将在本章后面讨论。\n\n## 冲突检测 (Conflict Detection)\n\n`Conflict` 属性允许你告诉控件更新的值与数据库中的值是否存在冲突。它可以防止用户意外覆盖彼此的更新。当此属性设置为\
  \ `OverwriteChanges` 时，最后更新的用户获胜。\n\n如果设置为 `CompareAllValues`，控件会将数据库中的原始值与收到的值进行比较。如果控件检测到冲突，则不更新数据库；否则，则更新数据库。\n\
  \n判断你的更新是否遇到了并发错误的一种方法是测试 `SqlDataSource` `Updated` 事件中的 `AffectedRows` 属性。列表 8-4\
  \ 显示了实现此方法。\n\n## 处理数据库错误 (Handling Database Errors)\n\n数据源控件事件非常用于捕获和处理在对数据库执行\
  \ SQL 命令期间发生的错误。例如，列表 8-5](#Chapter08.xhtml_listing8-5) 展示了如何使用 `SqlDataSource`\
  \ 控件的 `Updated` 事件处理以异常形式返回应用程序的数据库错误。\n\n此示例极其重要的部分是设置 `ExceptionHandled` 属性的代码。该属性默认返回\
  \ `False`。因此，即使你检测到 `Exception` 属性不为空并尝试处理它，异常仍然会抛出。将 `ExceptionHandled` 属性设置为 `True`\
  \ 可告诉 .NET 你已成功处理该异常，可以继续执行。\n\n### AccessDataSource 控件\n\n此控件允许使用 Jet 数据程序专门访问\
  \ Access 数据库，但由于它派自 `SqlDataSource`，因此它仍然使用 SQL 命令执行数据检索。\n\n### LinqDataSource\
  \ 控件\n\n类似于 `SqlDataSource` 控件通过将其属性设置转换为 SQL 查询为 SQL 数据库生成，`LinqDataSource` 为应用程序中的\
  \ LinqToSql 数据对象生成 Linq 查询。\n\n### EntityDataSource 控件\n\n`EntityDataSource` 是专为使用\
  \ ADO.NET Entity Framework 的应用程序设计的专用数据源控件。\n\n\n\n\n\n`EntityDataSource` 控件处理网页上数据控件的选择、更新、插入和删除数据，并自动启用数据的排序和分页，使你能够轻松地从\
  \ Entity Framework 模型中绑定并导航数据。与所有其他数据源控件一样，你可以通过从 Visual Studio 工具箱将 `EntityDataSource`\
  \ 控件拖到设计表面来开始使用，然后从控件的智能标签（smart tag）中选择 `Configure`（配置）选项加载控件的配置向导。向导打开后，为控件选择或提供连接字符串，然后选择\
  \ `Default Container Name`（默认容器名称）并点击下一步。选择到 Northwind 数据库数据模型连接的示例可见图 8-5。\n\n\
  ![image](img/f308-01.jpg)\n\n图 8-5\n\n下一个屏幕允许你选择想要通过数据源控件暴露的特定 `EntitySetName`。如果你想确保查询只返回特定类型，还可以指定\
  \ `EntityTypeFilter`（实体类型过滤器）。在选择 `EntitySetName` 后，你可以通过从列表中选择属性来创建属性的自定义投影。图 8-6\
  \ 展示了从 Northwind 数据模型中选择 `Customers` EntitySetName。\n\n![image](img/f308-02.jpg)\n\
  \n图 8-6\n\n最后在此屏幕上，你可以配置控件允许数据的自动插入、更新和删除。注意，如果你通过选择特定列创建了自定义投影，这些选项将被禁用。\n\n完成数据源控件的配置后，你现在可以正常将任何数据绑定控件绑定到它。列表\
  \ 8-6 显示了配置向导生成的标记示例。\n\n`EntityDataSource` 控件包含了许多其他属性和事件，你可以它们进一步自定义控件的行为。\n\n\
  *   控件用于选择数据的查询可以使用 `CommandText` 属性完全自定义。该属性接受 Entity SQL 命令作为输入。如果 `CommandText`\
  \ 和 `EntitySetName` 都设置了，控件将抛出 `InvalidOperationException`。\n*   控件还允许使用 `GroupBy`\
  \ 和 `Where` 属性对数据进行分组和过滤。这两个属性都接受 Entity SQL 表达式，分别指定分组操作或过滤操作。\n*   使用 `CommandText`\
  \ 或 `GroupBy` 属性会导致数据源控件生成自定义投影，如前所述，这意味着即使显式启用，插入、更新和删除也会忽略。\n\n你可以像在任何数据源控件中一样指定用于控件任何查询的参数。\n\
  \n### 使用 QueryExtender 进行复杂过滤\n\n虽然 `EntityDataSource` 和 `LinqDataSource` 控件包含了过滤数据的内置功能，但这些功能并没有充分利用\
  \ LINQ 创建包含过滤器的查询的强大能力。这时 `QueryExtender` 就派上用场了，它允许定义复杂的搜索、数据范围过滤、复杂的多列 `OrderBy`\
  \ 子句，甚至完全自定义的表达式。表 8-4 显示了可用的过滤表达式类型。\n\n| 表达式类型 | 说明 |\n| --- | --- |\n| `SearchExpression`\
  \ | 搜索字段或多个字段的字符串值并与指定的字符串进行比较。该表达式可以执行“`StartsWith`”、“`EndsWith`”或“`Contains`”搜索。\
  \ |\n| `RangeExpression` | 类似于 `SearchExpression`，但使用一对值来定义最小和最大范围。 |\n| `PropertyExpression`\
  \ | 将列的属性值与指定值进行比较。 |\n| `OrderByExpression` | 允许按指定的列和排序方向对数据进行排序。 |\n| `CustomExpression`\
  \ | 允许提供自定义的 LINQ 表达式。 |\n| `MethodExpression` | 允许调用包含包含自定义 LINQ 查询的方法。 |\n| `OfTypeExpression`\
  \ | 允许按类型过滤数据源中的元素。 |\n\n表 8-4\n\n`QueryExtender` 适用于任何实现了 `IQueryableDataSource`\
  \ 接口的数据源控件。默认情况下，这包括 `LinqDataSource` 和 `EntityDataSource` 控件。\n\n要查看如何使用 `QueryExtender`，首先从工具箱将\
  \ `QueryExtender` 控件拖到设计表面。在页面标记中，通过将 `EntityDataSource` 控件的 ID 指定为 `QueryExtender`\
  \ 的 `TargetControlID` 属性值，将 `QueryExtender` 连接到 `EntityDataSource`。现在你只需要在 `QueryExtender`\
  \ 内部定义你想要使用的过滤表达式。列表 8-7 展示了使用 `SearchExpression`。\n\n如你所示，使用 `QueryStringParameter`，表达式将查询结果过滤为仅以查询字符串字段\
  \ `\"search\"` 指定的值开头的 `CustomerID`。\n\n### XmlDataSource 控件\n\n`XmlDataSource`\
  \ 控件为你提供了一种绑定 XML 文档的简单方法，可以是内存中的或位于物理驱动器上的。控件提供了许多属性，使得指定包含数据的 XML 文件和用于将源 XML\
  \ 转换为更合适格式的 XSLT 变换变得简单。你还可以提供 `XPath` 查询来仅选择某些数据集。\n\n列表 8-8 显示了如何读取 MSDN 网站的 RSS\
  \ Feed，选择其中的项目节点绑定到如 `GridView` 之类的控件。\n\n除了 `XmlDataSource` 的声明式属性外，还有许多有属性和事件。\n\
  \n许多时候你的 XML 并不是存储在文件中，而是存储在应用程序内存中或数据库中。控件提供了 `Data` 属性，接受一个控件可以绑定的 XML 字符串。注意，如果\
  \ `Data` 和 `DataFile` 属性都设置了，则 `DataFile` 属性优先于 `Data` 属性。\n\n此外，在某些场景下，你可能希望将边界\
  \ XML 从 `XmlDataSource` 控件导出到其他对象，甚至保存对 `GridView` 等控件所做的更改。`XmlDataSource` 控件提供了两种方法来满足此需求。一种方法是\
  \ `GetXmlDocument`，它通过返回包含数据源控件加载的 XML 的基本 `System.Xml.XmlDocument` 对象来导出 XML。\n\
  \n另一种方法是使用控件的 `Save` 方法将对加载 XML 的更改持久化到磁盘。执行此方法假设你已 `DataFile` 属性中提供了文件路径。\n\n`XmlDataSource`\
  \ 控件还提供了许多特殊事件。`Transforming` 事件在应用 `Transform` 或 `TransformFile` 属性中指定的 XSLT 变换之前触发，允许你为变换提供自定义参数。\n\
  \n### ObjectDataSource 控件\n\n`ObjectDataSource` 控件赋予你直接将数据控件绑定到中间层业务对象的能力，这些对象可以是硬编码的，也可以通过对象对象关系（O/R）映射器自动生成的。\n\
  \n为了演示如何使用 `ObjectDataSource` 控件，在项目中创建一个代表客户的类，以及一个允许你从集合中选择、插入、更新和删除客户方法的类。列表\
  \ 8-9 显示了一个你可以用于此演示的类。\n\n\n\n\n\n要开始使用 `ObjectDataSource`，请将控件拖到设计表面，并从控件的智能标记（smart\
  \ tag）打开配置向导。当向导打开时，从下拉列表中选择您想要作为数据源的业务对象。列表显示了网站 `App_Code` 文件夹中所有可以成功编译的类。在这种情况下，您需要使用代码列表\
  \ 8-9 所示的 `CustomerRepository` 类。\n\n`ObjectDataSource` 用于执行 CRUD 操作的方法必须遵循某些规则，以便控件理解这些操作。例如，控件的\
  \ `SELECT` 方法必须返回 `DataSet`、`DataReader` 或强类型集合。控件的每个操作选项卡都解释了控件对您指定的供其使用的方法的预期。此外，如果方法不符合特定操作预期的规则，它将不会列在该选项卡的下拉列表中。\n\
  \n最后，如果您的 `SELECT` 方法包含参数，向导允许您创建 `SelectParameters`，您可以使用它来提供方法参数数据。\n\n当完成 `ObjectDataSource`\
  \ 的配置后，您的页面源代码中应该会有像代码列表 8-10 所示的代码。\n\n如您所示，向导已为您在向导中指定的 `SELECT`、`UPDATE`、`INSERT`\
  \ 和 `DELETE` 方法生成了属性。还要注意它还添加了 `Select` 参数。根据您的应用程序，可以将此更改为之前讨论的任何 `Parameter` 对象，例如\
  \ `ControlParameter` 或 `QueryStringParameter` 对象。\n\n### SiteMapDataSource 控件\n\n\
  如果您有网站的 SiteMap 配置文件，`SiteMapDataSource` 允许您处理存储在其中文件中的数据。如果您在运行时更改站点地图数据（可能根据用户权限或状态），这可能会非常有用。\n\
  \n关于 `SiteMapDataSource` 控件，有以下两点需要注意：\n\n- 一是它不支持其他数据源控件中提供的任何数据缓存选项（在下一节中介绍），因此您无法自动缓存站点地图数据。\n\
  - 另一点是 `SiteMapDataSource` 控件没有像其他数据源控件那样的配置向导。这是因为 SiteMap 控件只能绑定到网站的 SiteMap 配置数据文件，因此无法进行其他配置。\n\
  \n## 数据源控件缓存\n\nASP.NET 包含了一个强大的缓存基础结构，允许您在服务器上缓存任意对象一段时间。您可以在第 22 章中了解更多关于 ASP.NET\
  \ 缓存的知识。\n\n数据源控件利用此内置缓存基础结构允许您轻松缓存它们的查询结果。每个控件使用相同的 set 语法来配置缓存，允许您创建简单的缓存策略，包括缓存方向、过期策略和键依赖。\n\
  \n缓存持续时间可以设置为特定的秒数，或者您可以将其设置为 `Infinite` 以强制缓存数据永不过期。代码列表 8-11 显示了如何轻松地为数据源控件添加缓存功能。\n\
  \n某些控件还通过特定数据源的附加缓存功能扩展了核心缓存功能集。例如，如果您正在使用 `SqlDataSource` 控件，可以使用该控件的 `SqlCacheDependency`\
  \ 属性来创建 SQL 依赖。\n\n## 数据绑定控件\n\n本节介绍了一些可以绑定到数据源控件的数据绑定控件，这些控件用于显示、创建、编辑和删除数据。\n\n\
  ### GridView\n\n`GridView` 控件是一个强大的数据网格控件，允许您显示整个数据集合、添加排序和分页并执行行内编辑。\n\n通过将控件拖到\
  \ ASP.NET 页面的设计表面开始使用 `GridView`。当您这样做时，系统将提示您选择一个绑定到网格的数据源控件。可以使用在本章早期创建的 `SqlDataSource`\
  \ 控件。\n\n代码列表 8-12 显示了 `GridView` 配合 `SqlDataSource` 的简单用法。示例中，删除了显式字段定义，允许控件根据数据源的结构自动生成列。\n\
  \n当您运行页面时，ASP.NET 使用 `SqlDataSource` 控件执行数据库查询，并将结果绑定到 `GridView` 控件。`GridView`\
  \ 控件生成一个包含从查询返回的所有数据的表格布局。\n\n在为 `GridView` 分配数据源后，通常网格会更新自身以匹配数据源架构，将其 `AutoGenerateFields`\
  \ 属性设置为 `False`，并为数据源公开的每个公共属性或数据库表列在 `GridView` 的 `Columns` 集合中生成一个字段。代码列表 8-13\
  \ 显示了显式列定义的集合。\n\n注意，在创建列定义时，控件默认为每列使用 `BoundField` 类型。每个 `BoundField` 都有 `DataField`\
  \ 属性（将字段连接到数据源的属性）以及已定义的 `SortExpression`。控件还会检测数据源中的只读属性并设置字段的 `ReadOnly` 属性。\n\
  \n当 `GridView` 渲染时，它会触发多个事件，您可以使用这些事件来更改控件的输出或向您的应用程序添加自定义逻辑。这些内容在表 8-5 中描述。\n\n\
  | 事件名称 | 描述 |\n| --- | --- |\n| `DataBinding` | 在 `GridView` 的数据绑定表达式即将评估时触发。 |\n\
  | `RowCreated` | 在创建新行时触发。在网格渲染之前，必须为每行创建一个 `GridViewRow` 对象。`RowCreated` 事件允许您在创建时插入自定义内容。\
  \ |\n| `RowDataBound` | 在每个 `GridViewRow` 绑定到数据源对应数据时触发。此事件允许您评估绑定的数据并在需要时产生影响。\
  \ |\n| `DataBound` | 在绑定完成且 `GridView` 准备好渲染后触发。 |\n\n**表 8-5**\n\n`RowDataBound`\
  \ 事件特别有用，它允许您为绑定到 `GridView` 的每个数据源项注入逻辑。代码列表 8-14 显示了如何使用此事件检查绑定到当前网格行的数据并插入特殊逻辑，示例是检查\
  \ `Region` 值是否为 `Null`。如果发现空值，逻辑将更改 `GridView` 行的 `ForeColor` 和 `BackColor` 属性。\n\
  \n`GridView` 还包含与选择、插入、更新和删除数据对应的事件。您将在本章后面学习这些事件。\n\n#### 处理空和空条件\n\n在某些情况下，绑定到\
  \ `GridView` 的数据源可能没有供控件绑定的数据。在这种情况下，您可能希望向终端用户提供一些反馈以告知此情况。`GridView` 提供了两种方法。\n\
  \n一种方法是使用 `EmptyDataText` 属性。该属性允许您指定当 `GridView` 无数据可绑定时向用户显示的文本字符串。当 ASP.NET 页面加载且\
  \ `GridView` 确定其绑定数据源中无可用数据时，它创建一个包含 `EmptyDataText` 值的特殊数据行并将其显示给用户。代码列表 8-15 显示了如何为\
  \ `GridView` 添加此属性。\n\n\n\n\n另一种选项是使用 `EmptyDataTemplate` 控件模板来完全自定义当控件没有数据可绑定时，用户所看到的特殊行。\n\
  \n你可以通过两种方式从 Visual Studio 设计表面上访问模板。一种方法是右键点击 `GridView` 控件，在右键菜单中展开 `Edit Template`（编辑模板）选项，并从菜单中选择\
  \ `EmptyDataTemplate`。另一种方法是从 `GridView` 的智能标签（smart tag）中选择 `Edit Templates`（编辑模板）选项。选择此选项会将\
  \ `GridView` 置于模板编辑模式，并弹出一个对话框，你可以从中选择想要编辑的特定模板。如图 8-7 所示，从下拉列表中选择 `EmptyDataTemplate`\
  \ 即可。\n\n![image](img/f317-01.jpg)\n\n**图 8-7**\n\n进入模板编辑模式后，你可以在设计表面的模板编辑器中添加自定义文本和/控件。完成模板编辑后，右键点击或打开\
  \ `GridView` 的智能标签并选择 `End Template Editing`（结束模板编辑）选项。\n\n切换到源代码视图，你会发现 `GridView`\
  \ 控件中添加了一个 `<EmptyDataTemplate>` 元素。该元素包含了你在编辑模板时添加的所有内容。列表 8-16 显示了 `EmptyDataTemplate`\
  \ 的示例。\n\n当然，你也可以在源代码视图下直接添加模板及其内容。\n\n`GridView` 还允许你在 `GridView` 绑定到数据源时遇到 `Null`\
  \ 值，配置一个要显示的值。示例如下，请使用 `<asp:BoundField>` 控件添加一列，如列表 8-17 所示。\n\n`<asp:BoundField>`\
  \ 被配置为显示 `Customers` 表中的 `Region` 列。当你查看 `Region` 列中的数据时，请注意并非每一行都有值。如果你不想只显示一个空白单元格，可以使用\
  \ `NullDisplayText` 属性来配置 `GridView`，用文本代替列中的空项。\n\n### 列排序\n\n数据排序的功能是用户浏览数据最基础的工具之一。要启用\
  \ `GridView` 控件中的排序，只需将 `AllowSorting` 属性设置为 `True`。控件在内部已为你处理了所有的排序逻辑。列表 8-18 显示了如何向你的网格添加此属性。\n\
  \n启用排序后，你会发现网格的所有列头现在都变成了超链接。\n\n`GridView` 排序可以同时处理升序和降序排序。反复点击列头会导致排序顺序在升序和降序之间切换。`GridView`\
  \ 还包含一个 `Sort` 方法，该可以接受多个 `SortExpressions` 以实现多列排序。列表 8-19 显示了你如何使用 `GridView`\
  \ 的 `Sorting` 事件来实现多列排序。\n\n该列表使用 `Sorting` 事件来操作控件的 `SortExpression` 属性值。事件的参数允许你检查当前的排序表达式、排序方向，甚至完全取消排序操作。`GridView`\
  \ 还提供了一个 `Sorted` 事件，该事件在排序完成后触发。\n\n### 分页 GridView 数据\n\n`GridView` 还允许你轻松添加另一个常用功能——分页。要启用分页，请将\
  \ `AllowPaging` 属性设置为 `True`，或者在 `GridView` 的智能标签中勾选 `Enable Paging` 复选框。控件默认页大小为\
  \ 10 条记录，并在网格底部添加分页器。列表 8-20 显示了修改你的网格以启用排序和分页的示例。\n\n`GridView` 包含许多允许你自定义分页的属性。例如，你可以使用\
  \ `GridView` 的 `PageSize` 属性控制每页显示的记录数。`PagerSettings` 的 `Mode` 属性允许你通过各种分页模式规定网格分页器的显示方式，包括\
  \ `NextPrevious`、`NextPreviousFirstLast`、`Numeric`（默认值）或 `NumericFirstLast`。此外，通过在\
  \ `GridView` 中指定 `PagerStyle` 元素，你可以自定义网格显示分页文本的方式，包括字体颜色、大小和类型，以及文本对齐和各种样式选项。列表\
  \ 8-21 显示了你如何自定义 `GridView` 控件使用 `NextPrevious` 模式，并使用 `PagerStyle` 元素对分页文本进行样式设置。\n\
  \n由于 `PagerSettings` 和 `PagerStyle` 属性列表非常长，这里没有列出所有选项，但你可以在 Visual Studio 帮助文档中找到完整的列表。\n\
  \n`GridView` 控件还提供了两个用于自定义网格标准分页行为的事件。`PageIndexChanging` 和 `PageIndexChanged` 在\
  \ `GridViewGridView 当前页码更改之前和之后触发。当用户点击网格中的分页链接时，页码发生更改。`PageIndexChanging` 事件参数允许你在新页码更改之前检查新页码的值，甚至完全取消分页事件。\n\
  \n`GridView` 还包含 `EnableSortingAndPaging` 属性，允许你指示控件是否应使用回调进行排序和分页。启用此属性会将 `GridView`\
  \ 的分页和排序行为改为客户端回调，而不是全页回传。\n\n\n\n\n| CheckBoxField | 为 GridView 控件中的每个项显示一个复选框。此列字段类型用于用于具有\
  \ `Boolean` 值的字段。 |\n| HyperLinkField | 将数据源中的字段值显示为超链接 URL。此列字段类型允许你将第二个字段绑定到链接的文本上。\
  \ |\n| ButtonField | 为 GridView 控件中的每个项显示一个命令按钮或命令链接。这允许你创建一个自定义按钮或链接控件的列，例如“添加”或“删除”按钮。\
  \ |\n| CommandField | 表示一个显示命令按钮或链接的字段，用于在数据绑定控件中执行选择、编辑、插入或删除操作。 |\n| ImageField\
  \ | 当字段中的数据表示图像时，会自动显示图像，或者根据提供的 URL 显示图像。 |\n| TemplateField | 根据指定的模板，为 GridView\
  \ 控件中的每个项显示用户定义的内容。此列字段类型允许你创建自定义的列字段。 |\n\n## 表 8-6\n\n在前面描述的示例中，如果你想允许最终用户链接到客户的网站，你需要从下拉列表中选择\
  \ `HyperLinkField`。添加字段对话框会发生变化，允许你输入超链接信息，包括 URL、数据字段和该列的格式字符串。\n\n你也可以在源（Source）视图中修改网格的列，手动添加或编辑上表列出的任何字段类型。代码段\
  \ 8-22 显示了如何在源视图中添加适当的标记来创建 `HyperLinkField`。\n\n当你在源视图中添加字段时，需要确保在字段上指定一个源自你的数据源的属性名。每个字段类型都暴露了不同的属性（或一组属性），允许你定义字段与数据源之间的这种连接。在以前的示例中，你可以看到\
  \ `HyperLinkField` 的 `DataNavigateUrlFields` 属性允许你提供一个逗号分隔的数据源属性名列表。这允许你指定多个绑定到此列的数据源值。然后，你可以在你的格式字符串中使用这些字段来传递两个查询字符串参数。\n\
  \n### 使用 TemplateField 列\n\nGridView 控件中可用的关键列类型是 `TemplateField` 列。这种列类型允许你通过定义模板来完全自定义列单元格的内容。\n\
  \n`TemplateField` 提供了六个模板，允许你自定义列的不同区域或状态，例如编辑状态。表 8-7 描述了可用的模板。\n\n| 模板名称 | 说明\
  \ |\n| --- | --- |\n| ItemTemplate | 用于在数据绑定控件中显示 TemplateField 单元格的模板 |\n| AlternatingItemTemplate\
  \ | 用于显示交替 TemplateField 单元格的模板 |\n| EditItemTemplate | 用于显示编辑状态下 TemplateField\
  \ 单元格的模板 |\n| InsertItemTemplate | 用于显示插入状态下 TemplateField 单元格的模板 |\n| HeaderTemplate\
  \ | 用于显示 TemplateField 页部分的模板 |\n| FooterTemplate | 用于显示 TemplateField 脚部分的模板 |\n\
  \n## 表 8-7\n\n要在 GridView 中使用 `TemplateField`，请如上一节所述，使用添加字段对话框向网格添加该列类型`<asp:TemplateField>`\
  \ 标签作为列可以包含的各种模板的容器。要向模板中添加内容，可以使用 Visual Studio 2012 设计表面的模板编辑功能，或者直接在源视图中向 `TemplateField`\
  \ 元素手动添加内容。\n\nItemTemplate 控制列中每个单元格的默认内容。代码段 8-23 展示了如何使用 ItemTemplate 来自定义列的内容。\n\
  \n在示例中，ItemTemplate 包含了 HTML 表格和 ASP.NET Button 控件的组合。\n\n由于 GridView 控件是数据绑定的，你可以使用数据绑定表达式（如\
  \ `Eval`、`XPath` 或 `Bind` 表达式）访问绑定到控件的数据。代码段 8-24 显示了如何使用 `Eval` 方法添加数据绑定表达式来设置\
  \ Button 控件的文本字段。关于数据绑定表达式的更多细节可以在本章后面找到。\n\n`TemplateField` 中提供的其他常用模板还有 InsertTemplate\
  \ 和 EditTemplate。当行进入插入模式或编辑模式时，网格会使用这些模板。下一节将介绍在 GridView 控件中插入和编辑数据，包括使用 InsertItemTemplate\
  \ 和 EditItemTemplate。\n\n### 编辑 GridView 行数据\n\n用户不仅想在浏览器中查看数据，还希望能够编辑数据并将更改保存回数据源。当结合数据源控件时，GridView\
  \ 控件使得绑定到网格的数据编辑变得简单。为了演示启用编辑有多简单，你可以修改以前示例中使用的 `SqlDataSource` 和 `GridView` 控件，允许用户编辑客户数据。\n\
  \n注意，虽然在本章中你关注的是更新绑定到 SqlDataSource 控件的 GridView 中的数据，当 GridView 连接到其他数据源控件时你也可以更新数据。无论绑定的数据源控件是什么，启用最终用户将网格行置编辑模式并通过\
  \ GridView 插入或删除数据的配置都是相同的。启用数据源控件持久化这些更改所需的配置取决于特定的数据源控件。\n\n#### 配置 SqlDataSource\
  \ 以进行更新\n\n要开始，首先通过使用配置数据向导或手动在源视图中添加 `UpdateCommand` 来修改 `SqlDataSource` 控件。此属性告诉数据源控件在需要更新时应执行哪条命令。代码段\
  \ 8-25 显示了添加 `UpdateCommand` 属性所需的标记。\n\n注意 `UpdateCommand` 包含了许多占位符，如 `@CompanyName,\
  \ @Country, @Region` 和 `@CustomerID`。这些占位符代表了来自 GridView 的信息。每个占位符对应于 SqlDataSource\
  \ 控件 `UpdateParameters` 集合中定义的 `Parameter` 元素。代码段 8-26 显示的 `UpdateParameters` 集合与本书之前讨论的\
  \ `SelectParameters` 元素非常相似。\n\n每个 `Parameter` 使用两个属性来与底层数据源连接：`Name` 是数据库列名，`Type`\
  \ 是数据库列的数据类型。在这种情况下，所有参数的类型都是 `String`。\n\n记住，你可以使用本书之前提到的任何参数类型，例如 `UpdateParameters`\
  \ 元素中的 `ControlParameter` 或 `QueryStringParameter`。\n\n#### 配置 GridView 以进行更新\n\n\
  现在你已经为更新配置了 SqlDataSource，你需要一种方法让 GridView 的行进入编辑模式，并告诉 GridView 数据库表的主键是什么。GridView\
  \ 内置了两种将行放入编辑模式的方法——`AutoGenerateEditButton` 属性和 `CommandField`。\n\n\n\n\n\n当 `AutoGenerateEditButton`\
  \ 属性设置为 `True` 时，这将告诉网格为每一行添加一个带有编辑按钮的 `ButtonField` 列。点击其中一个按钮会将关联行置于编辑模式。代码列表\
  \ 8-27 显示了如何向 `GridView` 控件添加 `AutoGenerateEditButton` 属性。\n\n`GridView` 控件还包含 `AutoGenerateSelectButton`\
  \ 和 `AutoGenerateDeleteButton` 属性，这些属性允许你轻松地为网格添加行选择和行删除功能。\n\n`CommandField` 列是一种特殊的字段类型，它允许你启用终端用户对\
  \ `GridView` 中的行执行不同的命令。代码列表 8-28 显示了如何配置 `CommandField` 以允许终端用户将行置于编辑模式。这允许你以链接、按钮甚至图像的形式显示命令。\n\
  \n现在，如果你浏览到你的 页面，你会发现添加了一个新的编辑列。点击“编辑”（Edit）链接允许用户编辑该特定数据行的内容。\n\n`CommandField`\
  \ 元素还具有属性，允许你精确控制列中显示的内容。你可以规定列是否显示如取消（Cancel）、删除（Delete）、编辑（Edit）、插入（Insert）或选择（Select）等命令。\n\
  \n要完成允许编辑的网格配置，你需要确保网格知道哪些数据库列被配置为主主键。你可以使用 `GridView` 的 `DataKeyNames` 属性来指定这一点，如代码列表\
  \ 8-29。如果表的主键多个列，可以使用逗号分隔的列表指定多个列名设置。\n\n通过向你不希望用户编辑的列添加 `ReadOnly` 属性，你可以控制网格允许编辑哪些列。代码列表\
  \ 8-30 显示了你如何向 `ID` 列添加 `ReadOnly` 属性。现在，如果你再次浏览 页面并点击“编辑”按钮，你应该看到 `ID` 列是不可编辑的。\n\
  \n### 更新数据时处理错误\n\n你可以使用 `RowUpdated` 事件在通过 `GridView` 更新数据时检查错误。代码列表 8-31 显示了在尝试更新数据后如何检查错误。\n\
  \n`RowUpdated` 事件参数包含一个 `Exception` 属性。代码列表检查该属性是否为 `null`。如果不是，则表示发生了错误，并向终端用户显示消息。\n\
  \n### 使用 TemplateField 的 EditItemTemplate\n\n在章的较早部分，你已经接触了 `TemplateField` 以及它包含的一些模板。其中一个模板是\
  \ `EditItemTemplate`，当行的 `TemplateField` 列进入编辑模式时，网格会使用它。使用 `EditItemTemplate` 允许你完全自定义用户的数据编辑体验。例如，对于\
  \ `Region`（地区）列，更好的编辑体验是将可能的值以下拉列表的形式呈现，而不是作为简单的文本框呈现（后者是 `BoundField` 的默认编辑体验）。\n\
  \n要做到这一点，你只需将 `Region` 列从 `BoundField` 更改为 `TemplateField` 并添加 `ItemTemplate` 和\
  \ `EditItemTemplate`。在 `EditItemTemplate` 中，你可以添加一个 `DropDownList` 控件并提供适当的数据绑定信息，以便该控件绑定到唯一的\
  \ `Regions` 列表。代码列表 8-32 显示了你如何向 `GridView` 添加 `ItemTemplate` 和 `EditItemTemplate`。\n\
  \n`ItemTemplate` 中使用一个简单的 `Eval` 数据绑定表达式来显示行在默认显示模式下的列值。在 `EditItemTemplate` 中，包含了一个绑定到\
  \ `SqlDataSource` 控件的 `DropDownList` 控件。要在 `DropDownList` 控件中显示当前选的国家，你需要使用 `RowDataBound`\
  \ 事件。代码列表 8-33 显示了如何实现。\n\n要设置 `DropDownList` 的值，首先使用 `RowState` 属性检查当前绑定的 `GridViewRow`\
  \ 是否处于编辑模式。`RowState` 属性是 `DataControlRowState` 值的位组合。表格 8-8 向你展示了 `GridViewRow`\
  \ 的可能状态。\n\n| `ROWSTATE` | `DESCRIPTION` |\n| --- | --- |\n| Alternate | 表示此行是交替行\
  \ |\n| Edit | 表示该行当前处于编辑模式 |\n| Insert | 表示该行是新行，且当前处于插入模式 |\n| Normal | 表示该行当前处于正常状态\
  \ |\n| Selected | 表示该行当前是 GridView 中的选定行 |\n\n**表格 8-8**\n\n为了正确确定当前的 `RowState`，你可能需要对\
  \ `RowState` 属性进行多次比较。`RowState` 可能同时处于多种状态下——例如，交替和编辑——因此，你需要使用位比较来正确确定 `GridViewRow`\
  \ 是否处于编辑状态。\n\n在确定行处于编辑状态后，使用 `FindControl` 方法在相应的单元格中定位 `DropDownList` 控件。此方法允许你通过名称定位服务器控件。找到\
  \ `DropDownList` 控件后，找到适当的 `DropDownList` `ListItem` 并设置它。\n\n（注：原文后续存在大量关于 RowState\
  \ 的重复描述，此处已根据逻辑要求进行精简翻译）\n\n为了要允许用户更新行，你可以使用 `RowUpdating` 事件，如代码列表 8-34 所示。在此事件中，你使用\
  \ `EditIndex` 确定当前正在编辑的 `GridViewRow`。找到行后，将该控件的 `SelectedValue` 添加到 `GridView`\
  \ 的 `NewValues` 集合中。\n\n删除 删除 GridView 数据\n\n从 GridView 生成的表中删除数据比编辑数据更简单。只需对 `SqlDataSource`\
  \ 和 `GridView` 进行几项添加即可删除整行数据。\n\n就像编辑按钮一样，你可以通过将 `AutoGenerateDeleteButton` 属性设置为\
  \ `True` 或使用 `CommandField` 为网格添加删除按钮。使用 `AutoGenerateDeleteButton` 属性的方法见代码列表 8-35。\n\
  \n`SqlDataSource` 控件的更改也非常简单，可以使用“配置数据源”向导或手动在标记中完成。代码列表 8-36 显示了你如何向控件添加 `DeleteCommand`。\n\
  \n与 `UpdateCommand` 属性一样，`DeleteCommand` 属性利用命名参数来确定要删除哪行。因此，你在 `SqlDataSource`\
  \ 控件内部定义此参数。要实现这一点，为 `SqlDataSource` 控件添加一个 `<DeleteParameters>` 部分。如代码列表 8-37 所示。\n\
  \n这是 `<DeleteParameters>` 集合所需的唯一参数，因为此删除操作的 SQL 命令只需要行的 `CustomerID` 即可删除整行。运行示例将在网格中显示一个删除链接，点击后将删除选定行。\n\
  \n记住，就像更新数据时一样，在删除数据时检查数据库错误是一个好主意。代码列表 8-38 显示了你如何使用 `GridView` 的 `RowDeleted`\
  \ 事件和 `SqlDataSource` 的 `Deleted` 事件来检查删除过程中可能发生的错误。\n\n\n\n\n\n请注意，这两个事件都提供了 `Exception`\
  \ 属性作为其事件参数的一部分。如果这些属性不为空，则发生了你可以处理的异常。如果你确实选择处理异常，应该将 `ExceptionHandled` 属性设置为\
  \ `True`；否则，异常将继续冒泡到最终用户那里。\n\n### DetailsView\n\n`DetailsView` 控件是一种数据绑定控件，允许你一次处理单条数据记录。虽然\
  \ `GridView` 控件非常适合查看数据集合，但在许多场景下，你希望显示单条记录而不是整个集合。`DetailsView` 控件允许你执行此操作，并提供了与\
  \ `GridView` 许多的数据处理和显示功能，包括分页、更新、插入和删除数据等功能。\n\n要开始使用 `DetailsView`，请将控件拖到设计表面上。与\
  \ `GridView` 一样，你可以使用 `DetailsView` 的智能标记（smart tag）来创建并设置控件的数据源。本节中的示例使用了与上一节 `GridView`\
  \ 示例中相同的 `SqlDataSource` 控件。将 `SqlDataSource` 设置为 `DetailsView` 的数据源并运行页面。列表 8-39\
  \ 显示了绑定到 `SqlDataSource` 控件的 `DetailsView` 控件的标记。\n\n如果你只想显示单条记录，你可能希望更改 `SqlDataSource`\
  \ 控件的 `SelectCommand`，使其只返回一个客户，而不是像查询现在那样返回所有客户。然而，如果你从数据库返回了多个一个对象，可以通过将 `DetailsView`\
  \ 的 `AllowPaging` 属性设置为 `True` 来允许你的最终用户分页查看数据，如 列表 8-40 所示。\n\n你可以在 `DetailsView`\
  \ 智能标记中勾选“启用分页”（Enable Paging）复选框，或者在源视图中向控件添加该属性。此外，与 `GridView` 一样，`DetailsView`\
  \ 控件允许你通过 `PagerSettings-Mode` 以及 `Pager` 样式自定义控件的分页器。\n\n#### 自定义 DetailsView 显示\n\
  \n你可以通过选择控件显示的字段来自定义 `DetailsView` 控件的外观。默认情况下，控件显示来自其绑定数据源的每个公共属性。然而，使用与 `GridView`\
  \ 控件相同的基本语法，你可以指定仅显示某些属性。这在 列表 8-41 中所示。\n\n在此示例中，在 `DetailsView` 的 `Fields` 集合中使用\
  \ `BoundField` 对象定义了 `Customers` 表中的四个字段。\n\n#### 共同使用 DetailsView 和 GridView\n\n\
  接下来，本节将查看常见的主详情显示场景，该场景同时使用了 `GridView` 和 `DetailsView`。在此示例中，你使用 `GridView` 显示数据的主视图，并使用\
  \ `DetailsView` 显示所选 `GridView` 行的详情。`Customers` 表是数据源。列表 8-42 显示了此所需的代码。\n\n要查看它是如何工作的，请查看对名为\
  \ `SqlDataSource2` 的第二个 `SqlDataSource` 控件的更改。添加了一个用于过滤由 `SelectCommand` 获取数据的 `FilterExpression`。在这种情况下，`FilterExpression`\
  \ 的值设置为 `CustomerID='{0}'`，表示控件应该根据给定的 `CustomerID` 值过滤其返回的数据。\n\n在 `FilterExpression,\
  \ CustomerID` 中指定的参数定义在 `SqlDataSource` 控件的 `<FilterParameters>` 集合中。示例使用 `<asp:ControlParameter>`\
  \ 来指定 `GridView` 控件的 `SelectedValue` 属性以填充参数值。\n\n#### SelectParameters 与 FilterParameters\n\
  \n你可能在上一个示例中注意到，`FilterParameters` 似乎提供了与 `SelectParameters` 相同的功能，后者在在本章的“SqlDataSource\
  \ 控件”部分中讨论过。尽管两者产生本质上相同的结果，但它们使用了非常不同的方法。正如你在上一节中看到的，使用 `SelectParameters` 允许开发者将值注入到\
  \ `SelectCommand` 中指定的 `WHERE` 子句中。这限制了从 SQL Server 返回并由数据源控件保留在内存中的行。优点是，通过限制从\
  \ SQL 返回的数据量，你可以让应用程序运行更快并减少它消耗的内存。缺点是，你受限于处理 SQL 查询返回的有限数据子集。\n\n另一方面，`FilterParameters`\
  \ 不使用 `WHERE`，而是要求从服务器返回所有数据，然后对数据源控件的内存中的数据应用过滤器。过滤方法的缺点是必须从数据存储中返回更多数据。然而在某些情况下，例如当你对一大块数据进行多次过滤时（例如为了在\
  \ DetailsView 中启用分页），这是一个优势，因为你不需要在需要下一条记录时都调用数据存储。所有数据都由数据源存储在缓存内存中。\n\n### 使用\
  \ DetailsView 插入、更新和删除数据\n\n使用 `DetailsView` 插入数据与使用 `GridView` 控件相似。要使用 `DetailsView`\
  \ 插入数据，只需向 `DetailsView` 控件添加 `AutoGenerateInsertButton` 属性，如 列表 8-43 所示。\n\n然后向\
  \ `SqlDataSource` 控件添加 `InsertCommand` 和相应的 `InsertParameters` 元素，如 列表 8-44 所示。\n\
  \n使用 `DetailsView` 更新和删除数据与使用 `GridView` 更新和删除数据相似。只需在 `DetailsView` 控件中指定 `UpdateCommand`\
  \ 或 `DeleteCommand` 属性；然后提供正确的 `UpdateParameters` 和 `DeleteParameters`。\n\n### ListView\n\
  \nASP.NET 包含了另一种列表样式控件，它弥接了高度结构化的 `GridView` 控件与 `DataList` 和 `Repeater` 这种随心所欲、无结构化的控件之间的差距。\n\
  \n在过去，许多想要网格样式数据控件的开发者选择 `GridView`，因为它易于使用并提供了数据编辑、分页和排序等强大功能。遗憾的是，开发者对该控件越深入，就越发现控制其渲染\
  \ HTML 输出的方式是极其困难的。如果你想减少控件生成的标记量，或者仅使用 CSS 来控制控件的布局和样式，这将是一个问题。\n\n硬币的另一面，许多开发者被\
  \ `DataList` 或 `Repeater` 吸引，是因为它们对渲染实现了更强的控制。这些控件对布局几乎没有或完全没有的概念，并允许开发者在布局数据时获得完全的自由。遗憾的是，这些控件缺乏\
  \ `GridView` 的一些基本功能，如分页和排序，或者对于 `Repeater` 来说缺乏任何数据编辑的概念。\n\n这正是 `ListView` 派上用场的地方。控件本身不产生运行时生成的\
  \ HTML 标记；相反，它依赖于 11 个控件模板，这些模板代表控件的不同区域以及这些区域的可能状态。在这些模板中，你可以放置控件在设计时自动生成的标记，或者开发者创建的标记，但无论何种，开发者都保留了对控件中单个数据项的标记以及整个控件布局标记的完全控制权。此外，由于控件能够轻松理解并处理数据编辑和分页，你可以让控件处理大部分数据管理工作，使你主要专注于数据显示。\n\
  \n#### 开始使用 ListView\n\n\n\n\n\n要开始使用 `ListView`，只需将该控件拖到设计表面上，并为其分配一个数据源，就像处理任何其他数据绑定列表控件一样。然而，在分配数据源后，你会发现并没有像你预期的那样提供设计时期的布局预览。这是因为默认情况下，`ListView`\
  \ 没有定义布局，控件的布局完全由你来定义。事实上，控件的设计时渲染甚至会提示你，你至少需要定义一个 `ItemTemplate` 和 `LayoutTemplate`\
  \ 才能使用该控件。`LayoutTemplate` 作为控件的根模板，而 `ItemTemplate` 则作为控件中每个数据项的模板。\n\n你有两种方法来定义\
  \ `ListView` 所需的模板。你可以通过更改 `ListView` 智能标签（smart tag）中的 `Current View`（当前视图）选项来直接编辑模板，或者也可以从控件的智能标签中选择预定义的布局。更改\
  \ `Current View` 允许你查看每个可用模板的运行时视图，并像平时编辑任何其他控件模板一样直接编辑这些模板的内容。图 8-10 显示了 `ListView`\
  \ 智能标签中的 `Current View` 下拉菜单。\n\n![image](img/f335-01.jpg)\n\n**图 8-10**\n\n第二种方法（可能更容易上手的方法）是从\
  \ `Configure ListView` 对话框中选择预定义的布局模板。要打开此对话框，只需点击智能标签中的 `ConfigureListView` 选项。弹出的对话框允许你在多个预定义的布局之间进行选择，选择不同的样式选项，甚至配置编辑和分页等基本行为选项。\n\
  \n该控件包含五种布局类型——`Grid`、`Tiled`、`Bulleted List`、`Flow` 和 `Single Row` 以及四种不同的样式。对话框提供了每种类型的预览，当你更改当前选择的布局和样式时，预览会更新。\n\
  \n### ListView Templates\n\n对 `ListView` 应用布局模板后，如果你查看 Visual Studio 中的 Source 窗口，你会发现为了提供布局生成了大量的标记。这些标记是根据你在\
  \ `Configure ListView` 对话框中选择的布局生成的。\n\n如果你仔细检查上一节使用的 `Grid` 布局所生成的标记，你会发现默认情况下，控件会为七个控件模板创建标记：`ItemTemplate`、`AlternatingItemTemplate`、`SelectedItemTemplate`、`InsertItemTemplate`、`EditItemTemplate`、`EmptyDataTemplate`\
  \ 和 `LayoutTemplate`。这些只是控件暴露的 11 个模板中的几个，你可以使用它们来为控件的不同状态提供标记。选择不同的预定义布局选项会导致控件生成一组不同的模板。当然，你也可以随时手动添加或删除任何模板。所有\
  \ 11 个模板都列在 表 8-9 中。\n\n| **模板名称** | **描述** |\n| --- | --- |\n| `ItemTemplate` |\
  \ 为控件中的每个数据项提供用户界面 (UI) |\n| `AlternatingItemTemplate` | 为控件中交替出现的数据项提供唯一的 UI |\n\
  | `SelectedItemTemplate` | 为当前选中的数据项提供唯一的 UI |\n| `InsertItemTemplate` | 为向控件中插入新数据项提供\
  \ UI |\n| `EditItemTemplate` | 为编辑控件中的现有数据项提供 UI |\n| `EmptyItemTemplate` | 为当当前页最后一组没有更多数据可显示时创建的行提供唯一的\
  \ UI |\n| `EmptyDataTemplate` | 当绑定数据对象不包含数据项时显示的模板 |\n| `LayoutTemplate` | 作为 `ListView`\
  \ 控件根容器的模板，用于控制数据项的整体布局 |\n| `GroupSeparatorTemplate` | 在组之间提供分隔符 UI |\n| `GroupTemplate`\
  \ | 为分组内容提供唯一的 UI |\n| `ItemSeparatorTemplate` | 为每个数据项之间提供分隔符 UI |\n\n**表 8-9**\n\
  \n模板的使用允许 `ListView` 控件能够保留关于组成 `ListView` 的标记部分和状态的最基本信息，同时让你对 `ListView` 的 UI\
  \ 拥有几乎完全的控制。\n\n### ListView Data Item Rendering\n\n尽管 `ListView` 通常非常灵活，允许你几乎完全控制它显示绑定数据的方式，但它确实具有一些基本结构，定义了上一节描述的模板之间的关系。正如之前描述，控件至少要求你定义两个模板：`LayoutTemplate`\
  \ 和 `ItemTemplate`。`LayoutTemplate` 是根控件模板，因此你应该在它处定义 `ListView` 中数据项集合的整体布局。\n\n\
  例如，如果你检查由 `Grid` 布局生成的模板标记，你可以看到 `LayoutTemplate` 包含一个 `<table>` 元素定义、一个单表行 (`<tr>`)\
  \ 定义以及为每个列标题定义的 `<td>` 元素。\n\n另一方面，`ItemTemplate` 是你定义单个数据项布局所在。。如果你再次查看为 `Grid`\
  \ 布局生成的标记，它的 `ItemTemplate` 是一个单表行 (`<tr>`) 元素，后跟有一系列包含实际数据的表格单元格 (`<td>`) 元素。\n\
  \n当 `ListView` 渲染时，它知道 `ItemTemplate` 应该在 `LayoutTemplate` 内部渲染，但需要的是一种机制来告诉控件在\
  \ `LayoutTemplate` 的哪个位置放置 `ItemTemplate`。`ListView` 控件通过在 `LayoutTemplate` 中查找项目容器来实现这一点。项目容器是任何\
  \ HTML 容器元素，设置了 `runat=\"server\"` 属性并且其 `id` 属性值为 `itemContainer`。\n\n```\n <tbody\
  \ id=\"itemContainer\">\n  </tbody>\n```\n\n为了控件的整体灵活性，甚至 `ListView` 查找的特定 `itemContainer`\
  \ 元素 `id` 也可以进行配置。虽然默认情况下控件会尝试查找 `id` 属性设置为 `itemContainer` 的元素，但你可以通过更改控件的 `ItemContainerID`\
  \ 属性来更改控件查找的 `id` 值。\n\n如果控件无法找到指定的项目容器的适当 HTML 元素，它将抛出异常。\n\n### ListView Group\
  \ Rendering\n\n\n\n\n\n除了项目容器（item container）之外，`ListView` 还支持另一种容器类型，即组容器（group\
  \ container）。`group container` 与 `GroupTemplate` 配合使用，允许你将一组数据项划分为较小的集合。每组中的项目数量由控件的\
  \ `GroupItemCount` 属性设置。当你希望在渲染一定数量的项目模板后输出某些额外的 HTML 时，这种方法非常有用。当使用 `GroupTemplate`\
  \ 时，存在与前一节讨论过的相同问题。然而，在这种情况下，并不是有两个模板需要关联，而是引入 `GroupTemplate` 意味着你有三个模板需要关联：从 `ItemTemplate`\
  \ 到 `GroupTemplate`，以及从 `GroupTemplate` 到 `LayoutTemplate`。\n\n当 `ListView` 渲染自身时，它会检查是否定义了\
  \ `GroupTemplate`。如果控件发现了一个 `GroupTemplate`，它会检查 `LayoutTemplate` 中是否提供了组容器。如果你定义了\
  \ `GroupTemplate`，控件要求你定义一个组容器；否则它将抛出异常。组容器的工作方式与上一节描述的项目容器相同，不同之处在于容器元素的 `id` 值应该是\
  \ `groupContainer`，而不是 `itemContainer`。与项目容器一样，可以通过更改控件的 `GroupContainerID` 属性来更改控件查找的特定\
  \ `id` 值。\n\n你可以通过查看 `ListView` 的 Tiled（平铺）布局生成的标记来查看组容器使用的示例。该布局的 `LayoutTemplate`\
  \ 显示了一个作为组容器的表格，如下：\n\n```\n <table id=\"groupContainer\" runat=\"server\" border=\"\
  \" style=\"\">\n  </table>\n```\n\n定义了 `groupContainer` 后，你需要定义一个项目容器，但不要在 `LayoutTemplate`\
  \ 中这样做，而要在 `GroupTemplate` 中完成。同样，观察 Tiled 布局，你可以看到在其 `GroupTemplate` 内部定义了一个作为项目容器的表格行。\n\
  \n```\n <tr id=\"itemContainer\" runat=\"server\">\n  </tr>\n```\n\n当达到项目计数限制时，`ListView`\
  \ 输出 `GroupTemplate`，然后再次输出 `ItemTemplate`，并对它绑定的每个数据项重复此过程。\n\n### 使用 EmptyItemTemplate\n\
  \n在使用 `GroupTemplate` 时，还需要记住，绑定到 `ListView` 控件的数据项数量可能无法被 `GroupItemCount` 值完全整除。如果你创建的\
  \ `ListView` 布局依赖于 HTML 表格进行数据项排列，那么这一点尤为重要，因为最后一行定义的表格单元格可能比之前的表格行少，这可能导致控件输出的\
  \ HTML 无效，并可能引起渲染问题。为了解决这个问题，`ListView` 控件包含了 `EmptyItemTemplate`。如果你使用 `GroupTemplate`\
  \ 且剩余的数据项不足以达到 `GroupItemCount` 值，则会渲染此模板。\n\n例如，如果绑定到 `ListView` 控件的数据源包含四个数据项，但控件的\
  \ `GroupItemCount` 设置为 `3`，则每组中将渲染三个 `ItemTemplates`。这意味着对于渲染的第二个组，将只剩一个数据项待渲染；因此，如果定义了\
  \ `EmptyItemTemplate`，控件将使用它来填充剩余的项目。\n\n### ListView 数据绑定与命令（Commands）\n\n由于由于\
  \ `ListView` 在运行时不生成任何布局标记，并且不包含你可能在 `GridView` 中熟悉的任何自动字段生成逻辑，因此每个模板都使用标准的 ASP.NET\
  \ 内联数据绑定语法，将每个数据项的值放置在定义的布局中。内联数据绑定语法将在本章稍后部分详细介绍。\n\n你可以通过检查控件创建的默认 Grid 布局的 `ItemTemplate`\
  \ 来查看内联绑定的示例。在此模板中，绑定数据源的每一列都使用 ASP.NET `label` 显示，其 `text` 属性被设置为一个数据绑定评估表达式：\n\
  \n```\n <asp:Label ID=\"ProductNameLabel\" runat=\"server\"\n    Text='<%# Eval(\"\
  ProductName\") %>' />\n```\n\n由于控件使用这种灵活的模型来显示绑定的数据，你可以利用它将数据放置在模板中的任何位置，甚至可以使用\
  \ ASP.NET 数据绑定功能在显示数据之前对绑定的数据进行处理。\n\n每个显示绑定数据的 `ListView` 模板都使用相同的 ASP.NET 绑定语法，只是在它周围提供了一个不同的模板。例如，如果你在\
  \ Grid 布局中启用编辑功能，你会发现 `EditItemTemplate` 简单地将 `ItemTemplate` 使用的 ASP.NET 标签替换为文本框或复选框，取决于底层数据类型。\n\
  \n```\n <asp:TextBox ID=\"ProductNameTextBox\" runat=\"server\"\n    Text='<%# Bind(\"\
  ProductName\") %>' />\n```\n\n再次，这种灵活性允许你精确选择如何允许你的最终用户编辑数据（如果你想让它是可编辑的）。与其标准的 ASP.NET\
  \ 文本框，你可以轻松地将其替换为下拉列表，甚至是第三方编辑控件。\n\n要让 `ListView` 为数据项显示 `EditItemTemplate`，控件使用了\
  \ `GridView` 控件中相同的命令概念。`ItemTemplate` 提供了三个命令（参见表 8-10），可以使用它们更改数据项的状态。\n\n| 命令名称\
  \ | 说明 |\n| --- | --- |\n| `Edit` | 将特定数据项置于编辑模式并显示该数据项的 EditTemplate |\n| `Delete`\
  \ | 从底层数据源中删除特定数据项 |\n| `Select` | 将 `ListView` 控件的选择索引设置为数据项的索引 |\n\nTable 8-10\n\
  \n这些命令与 ASP.NET ButtonButton 控件的 `CommandName` 属性结合使用。你可以通过使用 ListView 配置对话框启用编辑和删除，在\
  \ `ListView` 默认 Grid 布局的 `ItemTemplate` 中看到这些命令。这样做会生成一个带有编辑和删除按钮的新列，每个按钮的 `CommandName`\
  \ 属性分别设置为 Edit 和 Delete。\n\n```\n <asp:Button ID=\"DeleteButton\" runat=\"server\"\
  \n    CommandName=\"Delete\" Text=\"Delete\" />\n  <asp:Button ID=\"EditButton\"\
  \ runat=\"server\"\n    CommandName=\"Edit\" Text=\"Edit\" />\n```\n\n`ListView`\
  \ 中的其他模板提供了其他命令，如表 8-11 所示。\n\n| 模板 | 命令名称 | 说明 |\n| --- | --- | --- |\n| `EditItemTemplate`\
  \ | `Update` | 更新 `ListView` 数据源中的数据并将数据项返回 ItemTemplate 显示 |\n| `EditItemTemplate`\
  \ | `Cancel` | 取消编辑并将数据项返回 ItemTemplate |\n| `InsertItemTemplate` | `Insert` | 将数据插入\
  \ `ListView` 数据源 |\n| `InsertItemTemplate` | `Cancel` | 取消插入并重置 InsertTemplate 控件的绑定值\
  \ |\n\nTable 8-11\n\n### ListView 分页与 Pager 控件\n\nASP.NET 包含了另一个名为 `DataPager` 的控件，`ListView`\
  \ 使用它提供分页功能。`DataPager` 控件旨在为最终用户显示分页导航，并与实现了 `IPagableItemContainer` 接口的任何数据绑定控件协调数据分页，在\
  \ ASP.NET 中该接口对应 `ListView` 控件。事实上，你会发现如果通过在 ListView 配置对话框中勾选分页复选框来启用 `ListView`\
  \ 控件的分页，控件将在其 `LayoutTemplate` 中插入一个新的新的 `DataPager` 控件。\n\n\n\n\n\n```asp\n <asp:datapager\
  \ ID=\"DataPager1\" runat=\"server\">\n    <Fields>\n      <asp:nextpreviouspagerfield\
  \ ButtonType=\"Button\" FirstPageText=\"First\"\n        LastPageText=\"Last\" NextPageText=\"\
  Next\" PreviousPageText=\"Previous\"\n        ShowFirstPageButton=\"True\" ShowLastPageButton=\"\
  True\" />\n    </Fields>\n  </asp:datapager>\n```\n\n该控件的标记显示，在 `DataPager` 内部创建了一个\
  \ `Fields` 集合，其中包含一个 `NextPreviousPagerField` 对象。正如其名称所示，使用 `NextPreviousPager`\
  \ 对象会导致 DataPager 将“上一页”和“下一页”按钮作为其用户界面进行渲染。`DataPager` 控件包含了三种类型的 `Field` 对象：`NextPreviousPagerField`；生成简单数字页列表的\
  \ `NumericPagerField` 对象；以及允许你指定自定义分页用户界面的 `TemplatePagerField`。这些 `Field` 类型每都包含多种属性，你可以使用这些属性来精确控制\
  \ `DataPager` 显示用户界面的方式。此外，由于 `DataPager` 暴露的是 `Fields` 集合而不是简单的 `Field` 属性，你可以在单个\
  \ `DataPager` 控件中显示多个 `Field` 对象。\n\n`TemplatePagerField` 是一种独特的 `Field` 对象类型，它本身不包含用户界面，而是暴露了一个模板，可以使用该模板来完全自定义分页符的用户界面。Listing\
  \ 8-45 展示了 `TemplatePagerField` 的用法。\n\n请注意，示例使用了 ASP.NET 数据绑定来提供总页数、页大小以及页面应该开始的行；这些都是由\
  \ `DataPager` 控件暴露的值。\n\n如果你想在 `PagerTemplate` 中使用自定义导航控件（例如使用 `Button` 控件来更改当前显示的页面），则为该按钮创建一个标准的\
  \ Click 事件处理程序。在该事件处理程序内部，你可以访问 `DataPager` 的 `StartRowIndex`、`TotalRowCount` 和\
  \ `PageSize` 属性，以计算 `ListView` 在渲染时应该使用的新 `StartRowIndex`。\n\n与 `GridView` 提供的分页功能不同，`DataPager`\
  \ 因为是一个独立的控件，因此你可以完全自由地决定它在网页上的位置。你到为止看到的示例都查看了直接放置在 `ListView` 中的 `DataPager` 控件，但该控件可以放置在\
  \ Web 表单的任何地方。在 Listing 8-46 中，你应该注意到的唯一显著变化是使用了 `PagedControlID` 属性。\n\n`PageControlID`\
  \ 属性允许你显式指定此分页符与哪个控件配合工作。\n\n### FormView\n\n`FormView` 控件的功能是显示来自绑定数据源控件的单个数据项，并允许添加、编辑和删除数据。它的独特之处在于在自定义模板中显示数据，这让你对数据的显示和编辑具有更大的控制权。`FormView`\
  \ 控件还包含 `EditItemTemplate` 和 `InsertItemTemplate`，允许你确定控件在进入编辑或插入模式时的显示方式。Listing\
  \ 8-47 显示了 Visual Studio 在设计 `FormView` 控件的自定义 `ItemTemplate` 时生成的代码。\n\n## 其他数据绑定控件\n\
