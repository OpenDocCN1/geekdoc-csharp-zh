  \n![image](img/f433-01.jpg)\n\n**图 11-25**\n\n## 实体框架代码优先 (CODE FIRST)\n\nCode First\
  \ 在 Entity Framework 4.1 版本中引入。Code First 工作流是一种以代码为中心处理数据和模型的方法。它为使用设计器界面的数据库优先和模型优先和模型优先开发工作流提供了一种替代方案。Code\
  \ First 采用“约定优于配置”的方法，允许你专注于使用 C# 或 VB 类来定义模型。这些类随后可以映射到现有数据库，或用于生成可以创建新数据库的架构。如果需要任何额外的配置（例如更高级的映射），你可以使用数据注解（data\
  \ annotations）或流式 API（fluent API）来提供额外细节。\n\nCode First 迁移（Migrations）在 Entity Framework\
  \ 4.3.1 版本中引入。在引入迁移之前，对 Code First 模型进行更改意味着删除并重建数据库。这在应用程序开发期间是可以接受的。但一旦你将应用程序发布到生产环境，每次模型发生变化时都删除并重建它是完全不可接受的。就像\
  \ Code First 允许你在代码中表示模型一样，Code First 迁移允许你在代码中表示数据库架构的迁移。每当你对想要发布到数据库的模型进行更改时，你都会创建一个迁移。每次迁移都是一个表示自上次迁移以来对模型所做更改的类。因此，你能够直接在项目中维护数据库更改的历史。\n\
  \n### 创建 Code First 模型\n\n向你的项目添加一个名为 `CodeFirst.aspx` 的新 Web 表单。在页面上添加一个 GridView\
  \ 控件。你的 ASP.NET 页面现在看起来将像列表 11-8 中的代码（显示为 C# 代码，对应本章代码下载中的 CodeFirst.aspx）。\n\n\
  * * *\n\n**列表 11-8: 将使用你 Code First 模型的 Basic 页面**\n\n```\n<%@ Page Language=\"\
  C#\" AutoEventWireup=\"true\" CodeBehind=\"CodeFirst.aspx.cs\" \nInherits=\"AspnetEntityFX.CodeFirst\"\
  \ %>\n\n<!DOCTYPE html>\n\n<html xmlns=\"http://www.w3.org/1999/xhtml\">\n<head\
  \ runat=\"server\">\n    <title>Code First Model</title>\n</head>\n<body>\n    <form\
  \ id=\"form1\" runat=\"server\">\n    <div>\n        <asp:GridView ID=\"GridView1\"\
  \ runat=\"server\"></asp:GridView>\n    </div>\n    </form>\n</body>\n</html>\n\
  ```\n\n* * *\n\n在 ASP.NET 后置代码（code-behind）页面中，你将进行操作：\n\n1.  创建你的初始模型，它将由两个类组成。\n\
  2.  然后你将创建一个派生上下文（context）。上下文是一个表示数据库会话的类。这允许你进行查询和保存数据。为了本示例，这些类将简单地添加到同一文件的 `Page`\
  \ 类之后。通常，这些类每个将位于它们自己的文件中。上下文派生自 `System.Data.Entity.DbContext`。\n3.  对于模型中的每个类，你将创建一个\
  \ `DbSet`。这将告诉 Entity Framework 哪些实体将映射到数据库。\n4.  接下来，你将在 `Page_Load` 方法中添加一些代码，向数据库添加一些数据并显示这些数据。\n\
  \n列表 11-9（本章代码下载中的 CodeFirst.aspx.vb 和 CodeFirst.aspx.cs）显示了添加模型类、上下文以及使用它们的代码后的后置代码页面。\n\
  \n* * *\n\n**列表 11-9: CodeFirst ASP.NET 页面的后置代码页面**\n\n***VB***\n\n```\n Imports\
  \ System.Data.Entity\n\n  Public Class CodeFirst\n      Inherits System.Web.UI.Page\n\
  \n      Protected Sub Page_Load(ByVal sender As Object, ByVal e As EventArgs) Handles\
  \ Me.Load\n          Using context As New TeamContext()\n              Dim team\
  \ As New Team {TeamName = \"Team 1\"}\n              context.Teams.Add(team)\n \
  \             team = New Team {TeamName = \"Team 2\"}\n              context.Teams.Add(team)\n\
  \              team = New Team {TeamName = \"Team 3\"}\n              context.Teams.Add(team)\n\
  \n              Dim query = From t In context.Teams\n                          Select\
  \ t\n\n              GridView1.DataSource = query.ToList()\n              GridView1.DataBind()\n\
  \              context.SaveChanges()\n          End Using\n      End Sub\n  End\
  \ Class\n\n  Public Class Team\n      Public Property TeamId() As Integer\n    \
  \  Public Property TeamName() As String\n  End Class\n\n  Public Class Player\n\
  \      Public Property PlayerId() As Integer\n      Public Property FirstName()\
  \ As String\n      Public Property LastName() As String\n  End Class\n\n  Public\
  \ Class TeamContext\n      Inherits DbContext\n\n      Public Property Teams() As\
  \ DbSet(Of Team)\n      Public Property Players() As DbSet(Of Player)\n  End Class\n\
  ```\n\n***C#***\n\n```\n using System;\n  using System.Collections.Generic;\n  using\
  \ System.Data.Entity;\n  using System.Linq;\n\n  namespace AspnetEntityFX\n  {\n\
  \    public partial class CodeFirst : System.Web.UI.Page\n    {\n        protected\
  \ void Page_Load(object sender, EventArgs e)\n        {\n            using (var\
  \ context = new TeamContext())\n            {\n                var team = new Team\
  \ { TeamName = \"Team 1\" };\n                context.Teams.Add(team);\n       \
  \         team = new Team { TeamName = \"Team 2\" };\n                context.Teams.Add(team);\n\
  \                team = new Team { TeamName = \"Team 3\" };\n                context.Teams.Add(team);\n\
  \n                var query = from t in context.Teams\n                        \
  \    select t;\n\n                GridView1.DataSource = query.ToList();\n     \
  \           GridView1.DataBind();\n                context.SaveChanges();\n    \
  \        }\n        }\n    }\n\n    public class Team\n    {\n        public int\
  \ TeamId { get; set; }\n        public string TeamName { get; set; }\n    }\n\n\
  \    public class Player\n    {\n        public int PlayerId { get; set; }\n   \
  \     public string FirstName { get; set; }\n        public string LastName { get;\
  \ set; }\n    }\n\n    public class TeamContext : DbContext\n    {\n        public\
  \ DbSet<Team> Teams { get; set; }\n        public DbSet<Player> Players { get; set;\
  \ }\n    }\n  }\n```\n\n\n\n\n\n为了使用你的新模型，你将向为你创建的数据库中添加一些数据。你只需要创建该类的新实例，将其添加到\
  \ `Teams` `DbSet` 中，并告诉数据库上下文将更改持久化到数据库。\n\n```\n var team = new Team { TeamName\
  \ = \"Test 3\" };\n  context.Teams.Add(team);\n  context.SaveChanges();\n```\n\n\
  现在，你可以使用数据库上下文来查询数据，就像你之前使用数据库优先（Database First）设计工作流创建实体数据模型时一样。\n\n```\n var query\
  \ = from t in context.Teams select t\n```\n\n一旦从 LINQ 查询返回 `IQueryable`，你就可以将数据绑定到\
  \ `GridView` 控件。\n\n```\n GridView1.DataSource = query.ToList();\n  GridView1.DataBind();\n\
  ```\n\n### 约定优于配置\n\n在在上一个示例中，`DbContext` 根据默认约定为你创建了一个数据库。当你第一次执行任何会导致建立数据库连接的操作时，数据库就会被创建。\n\
  \n确定数据库创建的位置取决于你机器上安装了哪个或哪些版本的 SQL Express。如果你的机器上运行着本地 SQL Express 实例，Code First\
  \ 会将数据库安装在该处。默认情况下，SQL Express 随 Visual Studio 2010 一起安装。默认情况下，Visual Studio 2012\
  \ 安装了一个新版本的 SQL Express，称为 SQL Express LocalDB。如果 Code First 找不到 SQL Express 实例，则将使用\
  \ LocalDB 安装数据库。\n\n无论使用哪种数据库，数据库名称都使用派生上下文的完全限定名。在本示例中，数据库名称为 `AspnetEntityFX.TeamContext`。\n\
  \n你可以使用 Visual Studio 中的服务器资源管理器查看创建的数据库。添加新的数据连接。对于服务器名称，如果你的数据库是使用 LocalDB 创建的，请指定\
  \ `(LocalDB)\\v11.0`；如果使用 SQL Express 创建，请指定 `.\\SQLExpress`。将数据库名称指定为派生上下文的完全限定名。图\
  \ 11-27 显示了完整的添加连接信息。\n\n![image](img/f437-01.jpg)\n\n**图 11-27**\n\n在向数据库添加数据连接后，展开数据库表以查看由\
  \ Code First 创建的架构。图 11-28 显示了 Code First 为你创建的数据库架构。\n\n![image](img/f437-02.jpg)\n\
  \n**图 11-28**\n\n`DbContext` 根据你定义的 `DbSet` 属性确定模型中需要包含哪些类。然后，Code First 使用一组默认约定来确定表名、列名、主键、数据类型以及数据库架构的其他部分。请注意，这些默认约定可以使用配置项进行修改。\n\
  \n### Code First 中的关系\n\n与你使用设计器时一样，在 Code First 模型中也可以在实体之间创建关系。为了演示这一点，你将在 `Team`\
  \ 和 `Player` 实体之间创建一个一对多的关系。\n\nEntity Framework 使用导航属性（navigation properties）表示两个实体类型之间的关系。导航属性可以管理双向的关系。如果关系是一一的，会创建一个引用相关类型的属性。如果关系是一一对多或多对一，该属性将是参与关系的类型集合。使用默认的\
  \ Code First 约定，属性还可以用于表示依赖对象上的外键。列表 11-10（章节代码下载中的 `CodeFirst.aspx.vb` 和 `CodeFirst.aspx.cs`）显示了修改类以在\
  \ `Team` 和 `Player` 类之间创建关系后的修改代码文件。\n\n* *\n\n**列表 11-10: 显示一对多 Code First 关系的代码**\n\
  \n***VB***\n\n```vb\n Imports System.Data.Entity\n\n  Public Class CodeFirst\n \
  \   Inherits System.Web.UI.Page\n\n    Protected Sub Page_Load(ByVal sender As Object,\
  \ ByVal e As System.EventArgs)\n       Handles Me.Load\n        Using context As\
  \ New TeamContextVB()\n            Dim team As New Team() With {.TeamName = \"Team\
  \ 1\"}\n            context.Teams.Add(team)\n            team = New Team() With\
  \ {.TeamName = \"Team 2\"}\n            context.Teams.Add(team)\n            team\
  \ = New Team() With {.TeamName = \"Team 3\"}\n            context.Teams.Add(team)\n\
  \            context.SaveChanges()\n\n            Dim query = From t In context.Teams\
  \ Select t\n\n            GridView1.DataSource = query.ToList()\n            GridView1.DataBind()\n\
  \        End Using\n    End Sub\n\n  End Class\n\n  Public Class Team\n    Public\
  \ Sub New()\n        Me.Players = New List(Of Player)()\n    End Sub\n    Public\
  \ Property TeamId() As Integer\n    Public Property TeamName() As String\n\n   \
  \ Public Overridable Property Players() As ICollection(Of Player)\n  End Class\n\
  \n  Public Class Player\n    Public Property PlayerId() As Integer\n    Public Property\
  \ FirstName() As String\n    Public Property LastName() As String\n\n    Public\
  \ Property TeamId() As Integer\n  End Class\n\n  Public Class TeamContextVB\n  \
  \  Public Property Teams() As DbSet(Team)\n    Public Property Players() As DbSet(Player)\n\
  \  End Class\n```\n\n***C#***\n\n```csharp\nusing System;\n  using System.Collections.Generic;\n\
  \  using System.Data.Entity;\n  using System.Linq;\n\n  namespace AspnetEntityFX\n\
