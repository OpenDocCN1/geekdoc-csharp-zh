  \n\n\n如果你现在尝试执行新代码，你将得到一个异常，因为数据库架构不再与模型匹配。在执行新代码之前，必须更新数据库。下一节将演示如何使用代码优先迁移（Code\
  \ First Migrations）根据你对模型所做的更改来更新数据库架构。\n\n### 代码优先迁移 (Code First Migrations)\n\n\
  代码优先迁移是在 Entity Framework 4.3.1 中引入的。在此之前，修改你的代码优先模型意味着数据库将被删除并重建。显然，对于生产环境中的应用程序来说，这并不是一个好的选择。迁移（Migrations）是将模型更改推送到数据库的解决方案。与代码优先模型一样，迁移也是使用代码构建的。不过，你可以使用几个包管理器控制台（Package\
  \ Manager Console）命令来为你构建迁移。\n\n使用代码优先迁移的第一步是启用它。\n\n1. 从 Visual Studio 菜单中点击工具\
  \ ![image](img/Ar.jpg) 库 Package Manager Manager 包管理器 ![image](img/Ar.jpg) 包管理器控制台来打开包管理器控制台。\n\
  \n2. 在控制台提示符处，运行命令 `Enable-Migrations`。\n\n3. 如果你一直在跟着本章的其他示例操作，那么项目中会有多个派生上下文（derived\
  \ contexts）。因此，`Enable-Migrations` 命令会返回消息，表示无法确定你想为哪个上下文启用迁移。你必须告诉命令你想为哪个上下文启用迁移。为了实现这一点，运行命令\
  \ `Enable-Migrations -ContextTypeName AspnetEntityFX.TeamContext`。\n\n命令完成后，项目项目将添加一个新的\
  \ `Migrations` 文件夹，并在文件夹中放置了两个新文件。\n\n* 第一个文件 `Configuration.cs` 包含了迁移为派生上下文将使用的配置设置。\n\
  * 第二个文件是初始迁移文件。它包含了已经应用到数据库的更改。迁移文件名包含一个用于对迁移排序的时间戳。\n\n现在，你需要创建一个新的迁移，包含你在上一节中对模型所做的更改。为了添加新迁移，你将运行添加迁移命令并传递一个迁移名称。在包管理器控制台中，运行命令\
  \ `Add-Migration TeamPlayerRelationship`。\n\n当命令运行时，它会在 `Migrations` 文件夹中创建一个新的迁移文件。列表\
  \ 11-11 (X_TeamPlayerRelationship.cs 和 X_TeamPlayerRelationship.vb [其中 X 是时间戳])\
  \ 显示了新迁移文件的内容。\n\n***\n\n**列表 11-11: 新迁移文件的内容**\n\n***VB***\n\n```\n Imports System\n\
  \  Imports System.Data.Entity.Migrations\n\n  Namespace Migrations\n    Public Partial\
  \ Class TeamPlayerRelationship\n        Inherits DbMigration\n\n        Public Overrides\
  \ Sub Up()\n            AddColumn(\"dbo.Players\", \"TeamId\", Function(c) c.Int(nullable\
  \ := \n                False))\n            AddForeignKey(\"dbo.Players\", \"TeamId\"\
  , \"dbo.Teams\", \"TeamId\", \n                cascadeDelete := True)\n        \
  \    CreateIndex(\"dbo.Players\", \"TeamId\")\n        End Sub\n\n        Public\
  \ Overrides Sub Down()\n            DropIndex(\"dbo.Players\", New String() { \"\
  TeamId\" })\n            DropForeignKey(\"dbo.Players\", \"TeamId\", \"dbo.Teams\"\
  )\n            DropColumn(\"dbo.Players\", \"TeamId\")\n        End Sub\n    End\
  \ Class\n  End Namespace\n```\n\n***C#***\n\n```\n namespace AspnetEntityFX.Migrations\n\
  \  {\n    using System;\n    using System.Data.Entity.Migrations;\n\n    public\
  \ partial class TeamPlayerRelationship : DbMigration\n    {\n        public override\
  \ void Up()\n        {\n            AddColumn(\"dbo.Players\", \"TeamId\", c =>\
  \ c.Int(nullable: false));\n            AddForeignKey(\"dbo.Players\", \"TeamId\"\
  , \"dbo.Teams\", \"TeamId\", \n                cascadeDelete: true);\n         \
  \   CreateIndex(\"dbo.Players\", \"TeamId\");\n        }\n\n        public override\
  \ void Down()\n        {\n            DropIndex(\"dbo.Players\", new[] { \"TeamId\"\
  \ });\n            DropForeignKey(\"dbo.Players\", \"TeamId\", \"dbo.Teams\");\n\
  \            DropColumn(\"dbo.Players\", \"TeamId\");\n        }\n    }\n  }\n```\n\
  \n***\n\n添加迁移命令仅创建一个包含数据库架构更新的迁移文件。它不会自动应用这些更新。为了在数据库上执行架构更改，你需要运行更新数据库命令。在包管理器控制台中运行\
  \ `Update-Database` 命令。命令完成后，你可以在服务器资源管理器（Server Explorer）中查看数据库的更改。图 11-29 显示了执行迁移后的数据库架构。\n\
  \n![image](img/f442-01.jpg)\n\n**图 11-29**\n\n然后你可以继续执行更新模型、创建新迁移和更新数据库的过程。\n\n\
  ## 总结\n\n本章回顾了 Entity Framework 的一些核心原则。作为开发者，你可以选择如何与 EF 交互。EF 设计器允许你使用更具图形化的界面工作。你可以选择构建模型并生成数据库，或从现有数据库生成你的模型。已经添加并并将继续添加增强功能，以使数据处理变得更容易。像代码优先和迁移这样的功能为你在处理数据时提供了选项。\n\
  \n# 12\n\n# ASP.NET 动态数据\n\n**本章内容：**\n\n* 理解动态数据功能\n* 理解模型绑定\n\n### 本章的 WROX.COM\
  \ 代码下载\n\n请注意，本章中的所有代码示例都可以从本书网站 `www.wrox.com` 的下载代码选项卡获取。\n\n## 动态数据 (Dynamic\
  \ Data)\n\nASP.NET 提供了一项允许你动态创建数据驱动型应用程序的功能。ASP.NET 动态数据不仅仅是一个代码生成器，尽管它可以提供一个基础应用程序，但你可以对其进行任何修改。该功能允许你快速创建数据输入程序，让最终用户处理和查看后端数据库。\n\
  \n你还可以轻松将动态数据集成到你的应用程序中，并构建由模型绑定和数据注解驱动的丰富 UI 层。\n\n本章将演示如何构建 ASP.NET 动态数据应用程序并使用模型绑定使用动态数据功能。\n\
  \n### 动态数据功能\n\nASP.NET 动态数据的功能是在 .NET Framework 3.5 SP1 中引入的。从那时起得到了增强，以支持 .NET\
  \ Framework 4.5 中的 Entity Framework。为了开始，你可以创建一个新的动态数据实体站点（Dynamic Data Entities\
  \ Web Site）项目。\n\nVisual Studio 2012 将创建一个从没有连接到任何数据库或对象模型的基础应用程序。你的工作就是建立这些连接。在此之前，请查看\
  \ Visual Studio 为你创建了什么。\n\n\n\n\n为您生成的项目以及在 Visual Studio 解决方案资源管理器（Solution Explorer）中显示的内容通常被称为\
  \ `scaffolding`（脚手架）。尽管看起来有很多代码是自动为您生成的，但请放心，你并没有被锁定在特定的数据驱动应用程序中。生成的内容被称为“脚手架”，是因为它是一个可以整体采用，也可以为了任何目的进行修改和扩展的框架。该框架是您自动生成应用程序所需的显示层和数据库层支持。你并没有以任何方式被锁定在特定的模型、外观，甚至没有被限制在某种你无法修改以适应你特定需求的方法中。\n\
  \n尽管你在解决方案资源管理器中会发现许多预生成的代码，但你并不需要使用这些代码来操作 ASP.NET Dynamic Data。事实上，你甚至可以将 ASP.NET\
  \ Dynamic Data 添加到现有的应用程序中，而无需从 ASP.NET Dynamic Data 项目模板开始。\n\n接下来，本章将介绍预生成的应用程序，该程序允许您与后端数据库进行交互。\n\
  \n## 应用程序功能\n\n该应用程序操作与标准 ASP.NET 应用程序有显著区别的最大新增功能之一，是一个名为 `DynamicData` 的文件夹。此文件夹包含了预生成的\
  \ ASP.NET 应用程序，允许您通过浏览器与数据库进行工作。\n\n此应用程序的目标是让您通过整个 CRUD 过程（创建、读取、更新和删除）与数据库进行工作。同样，你可以限制从应用程序中提供的交互量。\n\
  \n要查看此应用程序如何针对数据库运行，你必须深入研究组成应用程序的控件和页面。展开 `DynamicData` 文件夹，你会发现以下文件夹：\n\n*   `Content`\n\
  *   `CustomPages`\n*   `EntityTemplates`\n*   `FieldTemplates`\n*   `Filters`\n\
  *   `PageTemplates`\n\n除了这些文件夹，你还会找到一个特定此应用程序的 `web.config` 文件。\n\n应用程序此部分的 `Content`\
  \ 文件夹包含一个在页面模板（Page Templates）中用户控件，以及应用程序样式表使用的底层图像。\n\n`CustomPages` 文件夹是一个独立的文件夹，允许您放置可能包含在数据驱动\
  \ Web 应用程序中的自定义页面。当从头创建应用程序时，你不会在该文件夹中找到任何文件。它是故意留空的。\n\n`EntityTemplates` 文件夹使得获取所需的布局变得非常简单，因此不需要您构建自定义页面。最初，有一个\
  \ `Default.ascx`（用户控件），该控件的编辑和插入版本可以在文件夹中找到。\n\n`FieldTemplates` 文件夹很有趣，因为它包含了应用程序的一些更细粒度的方面。整个应用程序设计为基于数据库工作，但它并不知道自己将从何种类型的数据库工作。`FieldTemplates`\
  \ 文件夹是应用程序展示来自数据库的任何底层数据类型的方式。\n\n`Filters` 文件夹用于为 `Booleans`（`true/false` 值）、外键和枚举创建下拉菜单。这些菜单允许最终用户根据数据库中的键对筛选表。\n\
  \n`PageTemplates` 文件夹包含了您用于将应用程序整合的核心页面。请注意，对于您在应用程序中表示表的许多核心结构，都存在相应的页面。`PageTemplates`\
  \ 文件夹包含以下页面：\n\n*   `Details.aspx`\n*   `Edit.aspx`\n*   `Insert.aspx`\n*   `List.aspx`\n\
  *   `ListDetails.aspx`\n\n你使用 `List.aspx` 页面来处理连接数据库中的表。当您检查表中的单行时，使用 `Details.aspx`\
  \ 页面，并使用 `ListDetails.aspx` 页面查看表和行关系的主从详情视图。相应，你使用 `Edit.aspx` 和 `Insert.aspx`\
  \ 页面来执行它们描述的操作类型。\n\n`Global.asax` 文件具有 Dynamic Data 应用程序使用的所有路由。这意味着你可以在不更改页面内容的情况下更改\
  \ URL。由于路由是通用的，它们适用于应用程序中的所有表。\n\n你可以使用数据注解（Data Annotations）来来自定义显示在 UI 上的列名，并使用它们为用户输入的列名添加验证。当您在本章后部分阅读关于模型绑定（model\
  \ binding）时，将学习更多详细内容。\n\n## 运行应用程序\n\n一旦创建了 `DynamicDataWebSite`，你就整合一个你可以操作的数据库。对于此示例，你需要包含\
  \ Northwind 数据库。数据库到位后，下一步是建立一个定义的实体数据模型层，它将与底层数据库协作。\n\n你可以在整个解决方案中注册 `NorthwindEntities`\
  \ 对象。`NorthwindEntities` 是使用 LINQ to Entities 构建的数据模型。你在项目创建的 `Global.asax` 文件中注册此\
  \ `NorthwindEntities` 上下文。列表 12-1 显示了如何在 `Global.asax` 中注册上下文。\n\n**列表 12-1：在 Global.asax\
  \ 中注册上下文**\n\n**VB**\n```\nDefaultModel.RegisterContext(GetType(NORTHWNDModel.NORTHWNDEntities),\n\
  \        New ContextConfiguration() With {.ScaffoldAllTables = true})\n```\n\n**C#**\n\
  ```\nDefaultModel.RegisterContext(typeof(NORTHWNDModel.NORTHWNDEntities),\n    new\
  \ ContextConfiguration() { ScaffoldAllTables = true });\n```\n\n模型注册为 `NorthwindEntities`\
  \ 的 `DataContext` 对象，`ScaffoldAllTables` 属性设置为 `True`，表示包含所有表。\n\n## 应用程序结果\n\n\
  运行应用程序时，注意第一个页面允许您看到构成数据模型的所有表，如图 12-1](#Chapter12.xhtml_figure12-1) 所示。\n\n作为一个读取数据库内容的应用程序，它的工作非常简单。点击表名（应用程序中的超链接）将提供表的内容。图\
  \ 12-2 显示了此视图。\n\n表视图样式良好，并包含了对数据库中每行进行编辑、删除或查看详细信息的能力。在存在一对多关系的情况下，你可以深入查看。页面的另一个有趣部分是表的导航。分页功能出现在表上，如图\
  \ 12-2](#Chapter12.xhtml_figure12-2) 表底所示。\n\n除了使用表中的行信息的编辑、删除或详细视图外，你还可以通过点击表下方的“插入新项”链接向数据库插入新行。将一个类似于图\
  \ 12-3](#Chapter12.xhtml_figure12-3) 所示的视图。\n\n编辑行会显示相同类型的页面，如图 12-4](#Chapter12.xhtml_figure12-4)\
  \ 所示。该页面是通过点击 Territories 表中某一行旁边的编辑链接产生的。\n\n\n\n\n\n![image](img/f448-01.jpg)\n\
  \n**图 12-5**\n\n在这里，除了表格及其内容外，你还可以通过页面顶部的各种下拉菜单使用过滤功能。在这种情况下，你可以根据客户、员工或发运商来过滤订单。你甚至可以组合这些元素来过滤项目。在图\
  \ 12-5 中关于表格内容需要注意的另一个方面是，你看到的不是 `CustomerID`、`EmployeeID` 或 `ShipperID`，而是这些项目的名称，并且在进一步查看视图时，应用程序会针对这些项目对应的标识符进行引用。\n\
  \n关于此应用程序需要理解的最后一点点是，由于它是一个 ASP.NET 4 应用程序，它很好地利用 AJAX。例如，在表格中过滤项目时，请注意页面进行了部分刷新，而没有刷新整个页面。\n\
  \n### 向现有应用程序添加动态数据\n\n当 ASP.NET Dynamic Data 随着 .NET Framework 3.5 SP1 引入时，需要进行一些设置才能在页面上实现动态特性。随着\
  \ .NET Framework 4.5 的发布，向 Web Forms 页面的部分添加动态数据功能变得简单多了。\n\n现在可以通过使用新的 `DynamicDataManager`\
  \ 服务器控件或在 `Page_Init` 调用中使用 `EnablingDynamicData` 来实现。要查看此示例，请参考列表 12-2。\n\n***\n\
  \n**列表 12-2: 为现有的 GridView 控件添加 DynamicData**\n\n```xml\n <%@ Page Language=\"C#\"\
  \ %>\n\n  <script runat=\"server\">\n      protected void Page_Init()\n      {\n\
  \          GridView1.EnableDynamicData(typeof(Customer));\n      }\n  </script>\n\
  \  <html xmlns=\"http://www.w3.org/1999/xhtml\">\n  <head id=\"Head1\" runat=\"\
  server\">\n      <title>DynamicDataManager Example</title>\n  </head>\n  <body><body>\n\
  \      <form id=\"form1\" runat=\"server\">\n      <div>       \n          <asp:GridView\
  \ ID=\"GridView1\" runat=\"server\" AllowPaging=\"True\"\n              DataSourceID=\"\
  EntityDataSource1\"  \n              AutoGenerateColumns=\"False\" DataKeyNames=\"\
  RegionID\">\n              <Columns>\n                  <asp:BoundField DataField=\"\
  RegionID\" HeaderText=\"RegionID\" ReadOnly=\"True\"\n   SortExpression=\"RegionID\"\
  ></asp:BoundField>\n                  <asp:BoundField DataField=\"RegionDescription\"\
  \ \n  HeaderText=\"RegionDescription\" \n  SortExpression=\"RegionDescription\"\
  >\n  </asp:BoundField>\n\n              </Columns>\n          </asp:GridView>\n\
  \          <asp:EntityDataSource ID=\"EntityDataSource1\" runat=\"server\"\n   \
  \           EntitySetName=\"Regions\"\n              ConnectionString=\"name=NORTHWNDEntities\"\
  \n              DefaultContainerName=\"NORTHWNDEntities\"\n              EnableDelete=\"\
  True\" EnableFlattening=\"False\" EnableInsert=\"True\" \n                EnableUpdate=\"\
  True\">\n          </asp:EntityDataSource>\n\n      </div>\n      </form>\n  </body>\n\
  \  </html>\n```\n\n***\n\n使用与之前示例相同的 Northwind 对象上下文，你会发现页面上添加了一个基础的 `EntityDataSource`\
  \ 控件，以配合 `GridView1` 服务器控件工作。在此示例中，`EntityDataSource` 也被分配用于处理 Regions 表。你需要的是一个显示客户列表的网格。\n\
  \n## 理解模型绑定\n\n在 .NET Framework 4.0 中，你终于可以为现有网站添加 Dynamic Data 功能，但仍然很难充分利用 Dynamic\
  \ Data 提供的丰富支持。随着 .NET Framework 4.5 引入了模型绑定（model binding），将这些功能集成到你的应用程序中变得非常简单。这种集成在模型绑定方面提供了与\
  \ ASP.NET MVC 相似的开发者体验。本节将介绍你将 Dynamic Data 与模型绑定集成的一些方法。所有这些内容在不从 Dynamic Data\
  \ Web 应用程序项目模板开始的情况下的情况下也是可以实现的。若要配合 Dynamic Data 使用模型绑定，你只需要对数据绑定控件使用模型绑定即可。如果你想自定义列和表格的外观，你需要在应用程序中拥有\
  \ `FieldTemplates` 和 `EntityTemplates` 文件夹。\n\n### 特性驱动 UI\n\n本节解释了如何利用字段模板（Field\
  \ Templates）和实体模板（Entity Templates）以及数据注解（Data Annotation）属性来定制特定列或表格的外观。表 12-1\
  \ 列出了你可以用于自定义 UI 的一些常用属性。你可以在 `System.ComponentModel.DataAnnotations.dll` 中找到所有这些属性。\n\
  \n| 特性名称 | 描述 |\n| --- | --- |\n| `DataType` | 指定应与此列关联的类型 |\n| `Display` | 指定 Dynamic\
  \ Data 显示列的方式，例如列名 |\n| `DisplayFormat` | 指定 ASP.NET Dynamic Data 如何格式化数据字段 |\n\
  | `Enum` | 支持将 .NET Framework 枚举映射到数据列 |\n| `ScaffoldColumn` | 指定列是否由系统生成脚架（scaffolded）\
  \ |\n| `UIHint` | 指定 Dynamic Data 使用的 UI |\n\n**表 12-1**\n\n#### 字段模板 (Field Templates)\n\
  \n本节解释了你如何利用字段和实体模板结合数据注解属性来定制特定列或表格的外观。正如之前所学的，字段模板包含映射到特定列的用户控件。例如，`DateTime.ascx`\
  \ 被 Dynamic Data 使用。列表 12-3 显示了如何更改列名。\n\n***\n\n**列表 12-3: 使用 Display 属性更改 UI**\n\
  \n***VB***\n\n```vbnet\nProtected Sub SqlDataSource1_Updated(ByVal sender As Object,\n\
  \    ByVal e As System.Web.UI.WebControls.SqlDataSourceStatusEventArgs)\n    If\
  \ (e.Exception IsNot Nothing) Then\n  Me.lblMessage.Text = e.Exception.Message\n\
  \  e.ExceptionHandled = True\n    End If\nEnd Sub\n```\n\n***C#***\n\n```csharp\n\
  \ [Display(Name=\"Last Part of Name\")]\n```\n\n```***\n\n***\n\n现在假设你想自定义 `LastName`\
  \ 列的编辑/插入视图。你可以通过创建一个 Dynamic Data 字段模板用户控件并使用它来实现。列表 12-4 显示了如何使用自定义字段模板。`LastName`\
  \ 用户控件必须位于 Field Templates 文件夹中。\n\n要添加新的字段模板，右键点击网站并选择 Dynamic Data 字段项模板。图 12-6\
  \ 显示了该模板的样子。\n\n![image](img/f451-01.jpg)\n\n**图 12-6**\n\n***\n\n**列表 12-4: 使用\
  \ UIHint 属性更改所使用的 FieldTemplate**\n\n***C#***\n\n```csharp\n [UIHint(\"LastName\"\
  )]\n```\n\n```\n\n*** \n}\n```\n\n***\n\n#### 实体模板 (Entity Templates)\n\n到目前为止，你已经学习了如何自定义表格中的列。假设现在你想在使用\
  \ Dynamic Data 自动生成列的同时，自定义整个表格的外观。可以使用实体模板来实现。*实体模板*是 Dynamic Data 用于显示表格中所有列的用户控件。\n\
  \n\n\n\n\nListing 12-5 显示了插入场景下实体模板的标记。它由 `FormView` 控件使用，如 Listing 12-6 所示。\n\n\
  ### Listing 12-5: 用于插入表格的典型 EntityTemplate\n\n```xml\n <asp:EntityTemplate runat=\"\
  server\" ID=\"EntityTemplate1\">\n      <ItemTemplate>\n          <tr class=\"td\"\
  >\n              <td class=\"DDLightHeader\">\n  <asp:Label runat=\"server\" OnInit=\"\
  Label_Init\" OnPreRender=\n  \"Label_PreRender\" />\n              </td\n      \
  \        <td>\n                  <asp:DynamicControl runat=\"server\" ID=\"DynamicControl\"\
  \ Mode=\"Insert\" \n  OnInit=\n  \"DynamicControl_Init\" />\n              </td>\n\
  \          </tr>\n      </ItemTemplate>\n  </asp:EntityTemplate>\n```\n\n### Listing\
  \ 12-6: 使用 EntityTemplate 进行插入的 FormView 控件\n\n```xml\n <asp:FormView runat=\"server\"\
  \ ID=\"FormView1\" DefaultMode=\"Insert\"\n          ItemType=\"Customer\" InsertMethod=\"\
  InsertCustomer\">\n                  <InsertItemTemplate>\n                    \
  \  <table>\n                          <asp:DynamicEntity ID=\"DynamicEntity1\" runat=\"\
  server\" Mode=\n  \"Insert\" />\n                          <tr>\n              \
  \                <td>\n                                  <asp:LinkButton ID=\"Insert\"\
  \ runat=\"server\" \n                                    CommandName=\"Insert\"\
  \ Text=\"Insert\" />\n                                  <asp:LinkButton ID=\"Cancel\"\
  \ runat=\"server\" \n                                    CommandName=\"Cancel\"\
  \ Text=\"Cancel\" \n                                    CausesValidation=\"false\"\
  \ />\n                              </td>\n                          </tr>\n   \
  \                   </table>\n                  </InsertItemTemplate>\n        \
  \      </asp:FormView>\n```\n\n你可以通过共享实体模板来为数据库中的所有表创建一个通用的外观和感受。如果你想为某个特定的表自定义视图，可以为该特定表创建一个自定义的实体模板。这这可以通过在\
  \ `DynamicData\\EntityTemplates` 下创建一个子文件夹来实现。该子文件夹应以表名命名，在本例中为 `Customer`。\n\n\
  ### 特性驱动验证 (Attribute Driven Validation)\n\n特性驱动验证是一种通过数据注解（Data Annotations）为应用程序添加某些验证逻辑的方法。你已经看到了一些可以用于\
  \ UI 自定义的属性，而 Table 12-2 显示了一些验证属性。\n\n| 特性名称 | 描述 |\n| --- | --- |\n| `Key` | 表示唯一标识实体体的一个或多个属性\
  \ |\n| `Range` | 指定数据字段数值的数值范围限制 |\n| `RegularExpression` | 指定 ASP.NET Dynamic Data\
  \ 中的数据字段值必须匹配指定的正则表达式 |\n| `Required` | 指定数据字段值是必填的 |\n| `StringLength` | 指定数据字段中允许的字符最小和最大长度\
  \ |\n\n**Table 12-2**\n\n#### 基础验证\n\n当你开始使用带有模型绑定（model binding）的数据绑定控件时，开箱即用的功能之一就是验证。当模型绑定绑定数据时，模型绑定系统会使用\
  \ Dynamic Data 处理表中列的验证。这意味着应用程序对这些列提供了客户端和服务器端的验证，并且任何验证错误都可以在 `ValidationSummary`\
  \ 控件中查看。\n\n#### 数据注解\n\n你还可以自定义列上发生的验证类型。Listing 12-7 显示了你如何为列 `LastName` 添加一些正则表达式验证规则。如果你输入了一个不以\
  \ `a` 开头的姓氏，你将在验证摘要中看到以下验证错误：\n\n```\n The field LastName must match the regular\
  \ expression 'a*'\n```\n\n注意，由于你还设置了 `DisplayName` 特性来更改列的名称，你在错误消息中获得了新的 `DisplayName`，如下：\n\
  \n```\n The field Last Part of Name must match the regular expression 'a*'\n```\n\
  \n这是 Dynamic Data 一个非常有吸引力的用法，因为它在不更改模型的情况下自定义了你的应用程序 UI。\n\n### Listing 12-7: 使用\
  \ RegularExpression 验证\n\n**VB**\n\n```vb\n Protected Sub SqlDataSource1_Updated(ByVal\
  \ sender As Object,\n    ByVal e As System.Web.UI.WebControls.SqlDataSourceStatusEventArgs)\n\
  \    If (e.Exception IsNot Nothing) Then\n      Me.lblMessage.Text = e.Exception.Message\n\
  \      e.ExceptionHandled = True\n    End If\n  End Sub\n```\n\n**C#**\n\n```csharp\n\
  \ [Display(Name = \"Last Part of Name\")]\n  [RegularExpression(\"a*\")]    \n \
  \ public string LastName { get; set; }\n```\n\n## 总结\n\n本章探讨了 ASP.NET 中快速、方便地构建\
  \ Dynamic Data 驱动应用程序的能力。这些功能结合 Visual Studio，能够让你在五分钟内构建出一个提供完整 CRUD 能力的报告应用程序。\n\
  \n同时，你可以在使用模型绑定时使用所有这些功能，并为你的应用程序提供丰富且一致的体验。\n\n# 13 使用服务 (Working with Services)\n\
  \n**本章包含哪些内容？**\n\n*   构建和消费 Web 服务\n*   理解 Windows 基础\n*   使用 WebAPI\n\n### 本章的\
  \ WROX.COM 代码下载\n\n请注意，本章中的所有代码示例都可以通过 [www.wrox.com](http://www.wrox.com) 的下载选项卡作为本章下载内容获取。\n\
  \n\n\n\n\n供应商和整个行业很快意识到，XML 需要一种特定的结构，通过建立某些规则来明确通信。定义 XML 结构的规则使得不同系统之间的通信变得更加简单。工具供应商现在可以实现通信过程的自动化，并为使用通信协议创建应用程序的所有组件提供自动化支持。\n\
  \n行业最终决定使用简单对象访问协议（SOAP）来使标准的 XML 结构运行起来。之前解决所出现通信问题的尝试包括了一些组件技术，如分布式组件对象模型（DCOM）、远程方法调用（RMI）、通用对象请求代理架构（CORBA）和互联网交互\
  \ ORB 协议（IIOP）。这些早期尝试都失败了，因为这些技术要么由单一供应商驱动，或者（更糟糕）具有特定的供应商性。因此，在整个行业范围内实现它们是不可能的。\n\
  \nSOAP 允许你暴露和消费复杂的数据结构，这些结构可以包括 `DataSets` 等项，或者只是具有完整关系的数据表。SOAP 相对简单且易于理解。与 ASP.NET\
  \ 一样，XML Web 服务也主要设计为在 HTTP 上运行。你发送或消费的 `DataSets` 可以通过相同的互联网线路（HTTP）传输，从而绕过许多防火墙（因为它们通过\
  \ 80 端口移动）。\n\n那么，实际在上传输的是什么？ASP.NET Web 服务通常使用 HTTP Post 协议通过 HTTP 使用 SOAP。一个 SOAP\
  \ 1.2 请求示例（从客户端到位于 Web 服务器上的 Web 服务）采用了列表 13-1 所示的结构。\n\n请求被发送到 Web 服务以调用 `HelloWorld`\
  \ `WebMethod`（`WebMethod` 将在本章稍后部分讨论）。列表 13-2 显示了来自 Web 服务的 SOAP 。\n\n在列表 13-1 和\
  \ 13-2 的示例中，你可以看到此消息包含的是 XML 文件。除了 `<xml>` 节点的正常 XML 声明外，你还会看到一个作为 SOAP 消息的 XML\
  \ 结构。SOAP 消息使用 `<soap:Envelope>` 作为根节点，其中包含 `<soap:Body>` 或 SOAP 消息的正文。SOAP 消息可以包含的其他元素包括\
  \ SOAP 头部 `<soap:Header>` 和 SOAP 故障 `<soap:Fault>`。\n\n## 构建一个简单的 XML Web 服务\n\n\
  构建 XML Web 服务意味着你有兴趣将某些信息或逻辑暴露给组织内的其他实体、合作伙伴或客户。在更细粒度的意义上，构建 Web 服务意味着你作为开发者，只需从你创建的启用\
  \ SOAP 通信的类中创建一个或多个方法。\n\n你可以使用 Visual Studio 2012 来构建 XML Web 服务。第一步实际上是通过 IDE\
