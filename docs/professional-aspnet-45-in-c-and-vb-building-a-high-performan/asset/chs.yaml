  server\">\n      </asp:GridView>\n      <br />\n      <asp:EntityDataSource ID=\"\
  EntityDataSource1\" runat=\"server\">\n      </asp:EntityDataSource>\n      </form>\n\
  \  </body>\n  </html>\n``````\n\n* *\n\n现在你就可以配置页面上的 `EntityDataSource` 控件来处理你创建的数据模型。然后你可以将\
  \ `GridView` 控件绑定到此数据源。\n\n### 配置数据源控件\n\n现在配置页面上的 `EntityDataSource` 控件，以处理你创建的实体数据模型。为了实现这一点，你可以直接在\
  \ ASP.NET Web 表单的代码中编写 `EntityDataSource` 控件，也可以通过数据源向导。在本示例中，你将使用向导。\n\n在页面上选中数据源控件，你将在可用选项中找到“配置数据源”链接。点击该链接。会出现第一个屏幕（见图\
  \ 11-23），它要求你配置 `ObjectContext`。\n\n![image](img/f431-01.jpg)\n\nFIGURE 11-23\n\n\
  在本示例中，你使用之前创建的 `AdventureWorks2012_DataEntities1` 对象。点击“下一步”按钮配置数据选择过程。在这种情况下，如图\
  \ 11-24 所示，你可以选择 `Customers` 表。\n\n![image](img/f432-01.jpg)\n\nFIGURE 11-24\n\n\
  注意，你也可以通过在向导中勾选相应的复选框来轻松启用 `insert`、`update` 和 `delete` 功能。启用这些功能允许 `EntityDataSource`\
  \ 控件代表你对实体数据模型执行相应的 LINQ 操作。\n\n当你完成这些操作并点击“完成”后，将出现代码列表 11-7 所示的代码（作为一个 C# 页面）。注意，你还应该通过将\
  \ `DataSourceID` 属性分配为此控件，将 `GridView1` 控件绑定到 `EntityDataSource1` 控件。将 `GridView1`\
  \ 控件的 `AllowPaging` 属性设置为 `True` 可能也有帮助。\n\n\n\n\n\n```\n <%@ Page Language=\"C#\"\
