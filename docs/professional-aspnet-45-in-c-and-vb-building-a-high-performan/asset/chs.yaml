  \n在[`http://p2p.wrox.com`](http://p2p.wrox.com)，你将找到许多不同的论坛，它们不仅在你阅读本书时对你有帮助，也能在你开发自己的应用程序时提供帮助。要加入论坛，请遵循以下步骤：\n\
  \n1. 访问[`p2p.wrox.com`](http://p2p.wrox.com) 并点击 `Register` 链接。\n2. 阅读使用条款并点击 `Agree`。\n\
