  **图 10-19**\n\n# 第 11 章\n\nEntity Framework\n\n**本章包含什么内容？**\n\n*   理解映射和关系\n\n\
  *   使用数据库优先创建实体数据模型 (EDM)\n\n*   在 EDM 中使用 EntityDataSource 控件\n\n*   使用代码优先创建实体数据模型\n\
  \n## **WROX.COM 对应章代码下载**\n\n请注意，本章中的所有代码示例都可以作为本章代码从书籍网站 [www.wrox.com](http://www.wrox.com)\
  \ 的“Download Code”选项卡下载。\n\n\n\n访问数据是几乎每个应用程序必须执行的主要任务之一。几乎所有的应用程序都会以某种方式处理数据，无论这些数据来自内存（内存中数据）、数据库、`XML\
  \ files`、文本文件或其他地方。许多开发者发现，从 `C#` 或 `Visual Basic` 这种强类型面向对象的世界迁移到对象对象被视为“二等公民”的数据层，是非常困难的。在\
  \ `Entity Framework` 出现之前，从使用强类型对象编写代码到使用从数据存储返回的类型松散的数据集合之间的转换是非常困难的，而且往往容易出错。由于多种原因，数据访问可能会让你的应用程序开发变得复杂，其中最重要的一点是：用于与数据库交互的代码与处理应用程序逻辑的代码在设计和实现角度上都非常不同。\n\
  \n微软不断尝试简化程序员眼中常见且繁琐的任务。这通常通过将新接口和 IDE 帮助相结合，将这些任务的困难进行抽象化来实现。随着 `Entity Framework`\
  \ 的最新版本的发布，你会发现在数据库和你的应用程序之间的世界中导航变得比任何时候都更加容易。事实上，通过使用 `Entity Framework Code First`（在本章中讨论），你现在有了更多选项来跨越代码与数据库数据之间的鸿沟。\n\
  \n使用任何一种可用 `.NET` 编程语言的优势之一是，你代码中的对象是强类型的。作为程序员，你可以非常轻松地在命名空间之间导航，在 `Visual Studio`\
  \ IDE 中配合调试器工作等。然而，当涉及到访问数据时，情况就截然不同了。你最终进入了一个非强类型的世界，那里的调试是痛苦的甚至是不存在的，而且你大部分时间都在将字符串作为查询发送到数据库。作为开发者，你必须意识到底层数据以及它是如何结构的。你还必须理解所有数据点是如何相互关联的。\n\
  \n`Entity Framework` 是 `ADO.NET` 技术的集合，它消除了上述的许多困难。使用 `Entity Framework`（配合 `LINQ`），你现在拥有了一个轻量级的外壳（façade），为你正在处理的底层数据存储提供了强类型接口。使用这些技术，你可以留在你熟悉的编码环境中，并能够将底层数据作为对象访问，这些对象可以与\
  \ `IDE`、`IntelliSense` 甚至调试协同工作。你不再需要担心开发者过去面临的类型松散数据列表的问题。`Entity Framework` 允许你使用你已经熟悉的强类型对象来处理数据。\n\
  \n你不仅能够使用更熟悉的范式来访问和处理数据，还可以对来自多个数据存储的数据进行操作。`ADO.NET Data Provider` 模型在 `.NET Framework`\
  \ 中提供了一个公共托管接口，用于连接和与数据存储交互。`Entity Framework` 构建在 `ADO.NET Data Provider` 模型之上，允许对任何具有支持提供程序的数据源使用\
  \ `Entity Framework`。`.NET Framework` 包含了 `ADO.NET` 提供程序，用于直接访问 `Microsoft SQL Server`\
  \ 以及通过 `ODBC` 和 `OLE DB` 驱动程序间接访问其他数据库。但也有第三方提供程序可以提供对其他流行数据存储的直接访问，例如 `Oracle`、`MySQL`、`DB2`\
  \ 等许多其他。\n\n本章提供了 `Entity Framework` 最新版本的概述，以及你如何在 `ASP.NET` 应用程序中使用此框架。`Entity\
  \ Framework` 的最新版本现在以 `EntityFrameworkFramework` NuGet 包的形式提供。`NuGet Package Manager`\
  \ 已安装在 `Visual Studio 2012` 中。\n\n## 我们说的是同一种语言吗？\n\n正如之前讨论，构建与数据库通信的应用程序本应该比现在更容易。困难在于，代码中的对象和数据库中的对象本质上是不同的物种。将对象从数据库层通信到应用程序堆栈的其他层级是增加复杂性的主要原因。\n\
  \n`Entity Framework` 提供了将你的应用程序对象映射到关系型数据库模式的能力。例如，当你有一个充满了对 `Customer` 对象和 `StoreItem`\
  \ 对象引用的 `Orders` 表，并且你正在处理一个关系型数据库模式时，这些实体是使用各种表之间的 `JOIN` 语句创建的。然而，如果你在 `C#` 或\
  \ `VB` 代码中从这种构造工作，那么你正在创建一个 `Order` 对象，该对象包含一个指向 `Customer` 对象的属性引用和一个指向 `StoreItem`\
  \ 对象的属性引用。将这些截然不同的表示方式映射在一起，通常是开发者的工作。\n\n在过去，人们曾通过引入 `DataSet` 对象来解决这个映射问题。该对象是一个内存中的表表示，它包含了多个表，并应用了表连接和约束。然而，对于人们真正想要开发的纯面向对象代码，`DataSet`\
  \ 方法通常并不被推荐。\n\n当你在数据库内部表示数据时，你是在通过数据库的关系型模式将其作为*逻辑模型*进行表示。然而，编写你的应用程序是使用*概念模型*完成的。同时拥有逻辑层和概念层迫使了映射层的产生。映射层允许你将代码中使用的\
  \ `.NET` 类转换到你在数据库中使用的关系型模式，如图 11-1 所示。\n\n![image](img/f413-01.jpg)\n\n**图 11-1**\n\
  \n这种映射层有时被称为数据访问层。在过去几年，微软提供了多种数据访问技术，许多第三方公司也围绕让这种映射尽可能简单的概念形成。一些第三方甚至加入，为特殊数据库提供映射或数据访问。\n\
  \n微软一直在努力使应用程序代码到数据库模式的映射尽可能简单。`Entity Framework` 的出现是为了让你编写更少的代码来发布应用程序。\n\n注意，在未来一段时间内，你都需要应用程序代码中的对象以及你在关系模式中构建的实体。\n\
  \n所以最后，`Entity Framework` 包含：\n\n*   在代码中表示的数据库模型\n*   你正在处理的数据存储定义（例如，SQL Server\
  \ 数据库中的数据表示）\n*   两者之间的映射\n\n### 开发工作流选项\n\n开发者喜欢选项。对于在 `Entity Framework` 中处理数据，你有三种选项：\n\
  \n*   Database First（数据库优先）\n*   Model First（模型优先）\n*   Code First（代码优先）\n\n当你已经有一个数据库时，可以使用\
  \ `Entity Framework` 为你生成数据模型。Database First 和 Model First 开发工作流利用了 `Visual Studio\
  \ 2012` 中丰富的设计器和工具支持。使用 Database First，你从现有数据库在设计表面上构建模型层。使用 Model First，你使用设计器定义模型层，然后使用它来生成你的数据库模式。设计器通过生成数据定义语言（DDL）语句来创建数据库来实现这一操作。\n\
  \n\n\n\n另一种工作流选项最初在 Entity Framework 4 中引入。它被称为“代码优先”（Code First）开发。代码优先是一种更以代码为中心的方法，你不需要使用设计器。在代码优先开发中，你使用“普通旧类”（plain\
  \ old classes）来定义模型。数据库的创建和持久化通过使用约定优于配置（convention over configuration）的方法来实现，因此不需要显式配置。\n\
  \n## 实体数据模型 (Entity Data Model)\n\n实体数据模型 (`EDM`) 是根据你希望在代码中表示数据的一个抽象概念模型。它通常被解释为\
  \ `.NET` 类，你可以像操作代码中的任何其他对象一样操作它们。这第一个概念层是使用概念架构定义语言 (`CSDL`) 创建的，它是你对象的 XML 定义。\n\
  \n逻辑层使用存储架构定义语言 (`SSDL`) 定义。逻辑层详细说明了你存储在数据库中的关系模式模式。这包括对表、它们的关系以及约束的定义。\n\n实体数据模型的最后一部分是映射层。该层使用映射规范语言\
  \ (`MSL`) 映射 `CSDL` 和 `SSDL` 实例。\n\n由于几个原因，这三层结合可以协同工作。之一是实体数据模型内部有一个通用的类型系统，所有三层都可以共享。该系统允许你指定应用程序代码可以理解的类型，然后这些相同的类型也将被你正在工作的数据库所理解。EDM\
  \ 还提供了处理继承概念以及复杂对象的能力，并在层与之间建立适当的映射。\n\n这三层——概念模型、逻辑模型以及它们之间的映射——以 XML 格式存储在 `.edmx`\
  \ 文件中。Visual Studio 2012 的优点在于，你有一个图形设计器可以代表你并在你的指导下创建这些层以及相应的 `.edmx` 文件。然后可以使用图形设计器图形化显示和编辑\
  \ `.edmx` 文件，这样你就不需要直接编辑 XML。\n\n在使用代码优先开发时，你通过编写 `C#` 或 `VB` 类直接定义你的概念模型。然后可以使用此模型来生成数据库架构。\n\
  \n## 创建你的第一个实体数据模型\n\n为了提供一个使用 Entity Framework 的示例，第一个任务是完成所有所需的步骤，从数据库中读取数据并使用设计器工作流在你的\
  \ ASP.NET 应用程序中显示它们。\n\n对于此示例，你必须拥有 Visual Studio 2010 或 Visual Studio 2012。在此 IDE\
  \ 中，创建一个新的名为 `AspnetEntityFx` 的空 ASP.NET Web 应用程序（这是一个标准的 ASP.NET 应用程序）。\n\n将数据库文件添加到项目后，你需要将数据库升级为\
  \ SQL Express LocalDB 数据库。通过选择 Visual Studio 菜单中的 `View`，然后选择 `Server Explorer`\
  \ 来打开服务器管理器。展开 `Data Connections` 以查看你刚刚添加的数据库文件。右键点击 `AdventureWorks2012_Data.mdf`\
  \ 数据连接并选择 `Modify Connection`。点击 `Advanced` 按钮显示高级属性对话框。验证 `Data Source` 属性已设置为\
  \ `(LocalDB)\\v11.0` 且 `User Instance` 属性已设置为 `False`。图 11-2 显示了具有正确 `Data Source`\
  \ 和 `User Instance` 设置的高级属性对话框。\n\n![image](img/f415-01.jpg)\n\n**图 11-2**\n\n点击\
  \ OK 关闭高级属性对话框，并点击 OK 关闭 `Modify Connection` 对话框。你将看到一条消息，指示你连接的数据库与当前的 SQL Server\
  \ 实例不兼容。图 11-3 显示了此窗口。点击 Yes 升级数据库。\n\n![image](img/f415-02.jpg)\n\n**图 11-3**\n\
  \n一旦升级了数据库，你就可以准备创建你的实体数据模型了。在 Visual Studio 的 `Solution Explorer` 中右键点击你的项目，并选择\
  \ `Add` `New Item`。出现 `Add New Item` 对话框。在此对话框中，为你你正在使用的语言选择 `Data` 选项（在对话框的左侧面板中找到）。你可以从\
  \ `Data` 选项中添加的可用项目包括一个 ADO.NET Entity Data Model 项，如 图 11-4 所示。\n\n![image](img/f416-01.jpg)\n\
  \n**图 11-4**\n\n对于此示例，将你的实体数据模型命名为 `EmployeeDM.edmx`（参考 图 11-4）。\n\n## 完成 EDM 向导\n\
  \n点击 `Add` 按钮时添加此文件并不会立即插入文件，而是启动向导。你可以通过两种方式创建实体数据模型。第一个选项是基于预定义的数据库创建实体数据模型。第二个选项是从空白开始创建实体数据模型。`.NET`\
  \ Framework 4.5 确实让第二个选项变得非常易于操作。当你选择此第二个选项时，你可以创建你的实体数据模型，然后使用向导创建该模型的数据库表示。\n\n\
  向导的第一个屏幕提供了这些选项，如 图 11-5 所示。\n\n![image](img/f416-02.jpg)\n\n**图 11-5**\n\n对于此示例，选择\
  \ `Generate from Database` 选项。在向导中点击 `Next` 后，下一步是建立到数据库的实体连接字符串，如 图 11-6 所示。\n\n\
  ![image](img/f417-01.jpg)\n\n**图 11-6**\n\n此向导允许你从第一个下拉列表中选择你想要工作的数据库。如果你已按照之前的说明将其添加到项目，则\
  \ `AdventureWorks2012_Data.mdf` 文件将作为下拉列表中的选项。\n\n当你在下拉列表中选择此数据库时，你将看到实体连接字符串。它与普通连接字符串类似：\n\
  \n```\nmetadata=res://*/EmployeeDM.csdl|res://*/EmployeeDM.ssdl|res://*/EmployeeDM.msl;\n\
  \  provider=System.Data.SqlClient;\n  provider connection string=\"Data Source=(LocalDB)\\\
  v11.0;\n  attachdbfilename=|DataDirectory|\\AdventureWorks2012_Data.mdf;\n  integrated\
  \ security=True; MultipleActiveResultSets=True; App=EntityFramework \"\n```\n\n\
  注意，除了你可能拥有的普通连接字符串信息（如程序和程序连接字符串的属性）外，你还有用于逻辑模型和概念模型的实体定义，以及映射定义。`EmployeeDM.csdl`\
  \ 文件用于概念模型，`EmployeeDM.ssdl` 用于逻辑模型，而 `EmployeeDM.msl` 用于所需的映射。\n\n此对话框中的最后一个选项类似于你过去在\
  \ ASP.NET 中处理过的大多数提供程序的配置；它允许你将连接字符串保存到项目的 `web.config` 文件中。\n\n当你完成向导的这一页时，点击 `Next`\
  \ 以选择你为实体数据模型所需的表、视图和存储过程。\n\n对于此示例，在树视图中展开 `Tables` 选项，并通过勾选选项旁边的复选框选择 `Employee`（Human\
  \ Resources）表（参见 图 11-7）。\n\n![image](img/f418-01.jpg)\n\n**图 11-7**\n\n\n\n\n请注意，向导的这部分允许你定义在代码中访问时使用的命名空间。此示例使用了默认选项\
  \ `AdventureWorks2012_DataModel`。这一步是向导的最后部分。点击 `Finish` 按钮，将出现实体数据模型（Entity Data\
  \ Model）的设计界面。设计界面打开后，你可能会收到一个安全警告，询问是否想要运行文本模板。设计器使用 T4 模板自动生成 `DbContext` 文件以及你选择的从数据库生成的每个实体的文件。勾选“不再显示此消息”选项并点击\
  \ `OK`。\n\n### 使用 Entity Framework 设计器\n\nVisual Studio 内置的用于处理 Entity Framework\
  \ 设计器非常强大，因为它允许你视觉化地配置概念层，并控制它如何映射到逻辑层。\n\n如果你按照之前的定义完成了向导操作，你将在设计界面上看到一个代表 `Employee`\
  \ 对象，如图 11-8 所示。\n\n![image](img/f419-01.jpg)\n\n**图 11-8**\n\n当你在设计器中选中 `Employee`\
  \ 对象时，Visual Studio 中的属性窗格中会出现一些基本属性，如图 11-9 所示。\n\n![image](img/f419-02.jpg)\n\n\
  **图 11-9**\n\n在这里，你可以更改对象的访问修饰符并为该对象提供一些基础文档。Visual Studio 还提供了一些处理 Entity Framework\
  \ 的视图。当你创建好 `.edmx` 文件后，会自动为你打开一个视图——模型浏览器（Model Browser）。\n\n另一个重要的视图是实体数据模型映射详细窗口（Entity\
  \ Data Model Mapping Details）。你有几种方法进入此视图。你可以从 Visual Studio 菜单选择 `View` ![image](img/Ar.jpg)\
  \ `Other Windows` ![image](img/Ar.jpg) `Entity Data Model Mapping Details`，或者在设计器中右键点击\
  \ `Employee` 对象并从提供的菜单中选择 `Table Mapping`。图 11-10 展示了实体数据模型浏览器和实体数据模型映射详细窗口。\n\n\
  ![image](img/f419-03.jpg)\n\n**图 11-10**\n\n现在这个简单的对象已经就位，你的 `.edmx` 文件也准备就绪，下一步是构建一个使用该结构的小型\
  \ ASP.NET Web Form。\n\n### 使用你的 EDM 构建 ASP.NET Web Form\n\n现在你已经准备好了实体数据模型，本节将向如何构建一个使用该模型的简单\
  \ Web Form。第一步是在项目中添加一个名为 `BasicGrid.aspx` 的新 Web Form。在页面上添加一个 `GridView` 控件。最后，你的\
  \ ASP.NET Web Form 代码将看起来像代码列表 11-1 中所示的代码（本章代码下载中的 `BasicGrid.aspx`）。\n\n***\n\n\
  **列表 11-1: 使用你的 EDM 的基础 ASP.NET Web Form**\n\n```xml\n<%@ Page Language=\"C#\" AutoEventWireup=\"\
  true\"\n    CodeBehind=\"BasicGrid.aspx.cs\" Inherits=\"AspnetEntityFx.BasicGrid\"\
  \ %>\n\n<!DOCTYPE html>\n\n<html xmlns=\"http://www.w3.org/1999/xhtml\" >\n<head\
  \ runat=\"server\">\n    <title>My EDM</title>\n</head>\n<body>\n    <form id=\"\
  form1\" runat=\"server\">\n    <div>\n        <asp:GridView ID=\"GridView1\" runat=\"\
  server\">\n    </div>\n    </form>\n</body>\n</html>\n```\n\n***\n\n这是 Web Form\
  \ 的 C# 版本。注意页面上只有一个 `GridView` 控件。你将使用该控件来填充来自实体数据模型的结果。要使用实体数据模型，列表 11-2（本章代码下载中的\
  \ `BasicGrid.aspx.vb` 和 `BasicGrid.aspx.cs`）显示了你在列表 11-1 中展示的 ASP.NET Web Form 的后台代码。\n\
  \n***\n\n**列表 11-2: ASP.NET Web Form 的后台代码**\n\n***VB***\n\n```vb\n Partial Public\
  \ Class BasicGrid\n      Inherits System.Web.UI.Page\n      Protected Sub Page_Load(ByVal\
  \ sender As Object,\n        ByVal e As System.EventArgs) Handles Me.Load\n\n  \
  \        Dim adventureWorks2012_DataEntities As New\n             AdventureWorks2012_DataEntities()\n\
  \n          Dim query =\n           From emp In adventureWorks2012_DataEntities.Employees\n\
  \           Select emp\n\n          GridView1.DataSource = query.ToList()\n    \
  \      GridView1.DataBind()\n      End Sub\n\n  End Class\n```\n\n***C#***\n\n```csharp\n\
  基础使用 System;\n  using System.Linq;\n\n  namespace AspnetEntityFx\n  {\n    public\
  \ partial class BasicGrid : System.Web.UI.Page\n    {\n        protected void Page_Load(object\
  \ sender, EventArgs e)\n        {\n            var adventureWorks2012_DataEntities\
  \ = new AdventureWorks2012_DataEntities();\n\n            var query = from emp in\
  \ adventureWorks2012_DataEntities.Employees\n                        select emp;\n\
  \n            GridView1.DataSource = query.ToList();\n            GridView1.DataBind();\n\
  \        }\n    }\n  }\n```\n\n***\n\n等待，提示词中的用户文本包含重复/杂乱的部分。我将严格遵守提示词最后一个块中提供的文本。\n\
  \n（实际上，查看提供的文本，似乎是某些章节重复。我将提供最后章节提供的完整文本的干净版本。）\n\n\n\n\n与此映射相反，你可以打开之前在本节中创建的 `EmployeeDM.edmx`\
  \ 文件。在该文件的设计界面上，右键点击并从提供的菜单中选择 `Update Model from Database`（从数据库更新模型）。\n\n会出现更新向导，如图\
  \ 11-13 所示。\n\n![image](img/f423-01.jpg)\n\n**图 11-13**\n\n展开 `Tables` 节点，通过勾选每个表旁边的复选框，为缺失的表——`EmployeeDepartmentHistory`、`Department`\
  \ 和 `EmployeePayHistory` 添加引用。从图中你可以看到，它与其他类型的员工数据存在一多多的关系。\n\n完成此构造后，你还会通过 IntelliSense\
  \ 发现现在每个类型（或对象）都映射到指定的每个表，如图 11-14 所示。\n\n![image](img/f423-02.jpg)\n\n**图 11-14**\n\
  \n有了这些表，你就可以像此处演示的那样对所有对象操作。对于此示例，创建一个简单的 ASP.NET Web Form，其中仅包含单个 `BulletedList`\
  \ 控件。然后从该 Web Form 的后台代码中，使用列表 11-3 中的代码（本节代码下载中的 `OneToMany.aspx.vb` 和 `OneToMany.aspx.cs`）。\n\
  \n***\n\n**列表 11-3: 处理一多多的映射**\n\n***VB***\n\n```vb\n Protected Sub Page_Load(ByVal\
  \ sender As Object, ByVal e As EventArgs)\n\n     Dim adventureWorks2012_DataEntities\
  \ As\n        New AdventureWorks2012_DataEntities()\n\n     For Each employee In\
  \ adventureWorks2012_DataEntities.Employees\n        Dim li As New ListItem()\n\
  \        li.Text = employee.BusinessEntityID & \" \"\n\n        For Each pay In\
  \ employee.EmployeePayHistories\n           li.Text &= \"Pay Rate: \" & pay.Rate\
  \ & \" \"\n        Next pay\n\n        BulletedList1.Items.Add(li)\n     Next employee\n\
  \  End Sub\n```\n\n***C#***\n\n```csharp\n using System;\n  using System.Web.UI.WebControls;\n\
  \n  namespace AspnetEntityFx\n  {\n    public partial class _Default : System.Web.UI.Page\n\
  \    {\n        protected void Page_Load(object sender, EventArgs e)\n        {\n\
  \            AdventureWorks2012_DataEntities adventureWorks2012_DataEntities =\n\
  \               new AdventureWorks2012_DataEntities();\n\n            foreach (var\
  \ employee in\n               adventureWorks2012_DataEntities.Employees)\n     \
  \       {\n                ListItem li = new ListItem();\n\n                li.Text\
  \ = employee.BusinessEntityID + \" \";\n\n                foreach (var pay in employee.EmployeePayHistories)\n\
  \                {\n                    li.Text += \"Pay Rate: \" + pay.Rate + \"\
  \ \";\n                }\n\n                BulletedList1.Items.Add(li);\n     \
  \       }\n        }\n    }\n  }\n```\n\n***\n\n起初，访问的是 `Employees` 对象，而没有加载任何其他对象。当第一次访问\
  \ `EmployeePayHistory` 对象时，如果它尚未加载，它将自动加载。你不再需要像以前在框架版本中那样显式地加载相关对象。\n\n如果你运行这段代码，将得到如图\
  \ 11-15 所示的结果。\n\n![image](img/f425-01.jpg)\n\n**图 11-15**\n\n### 多对一和对多的关系\n\n\
  除了一对一一对多关系之外，Entity Framework 还支持多对一对对多的关系。在这些关系中，当你查询数据库时，Entity Framework 将为你执行适当的表连接。\n\
  \n创建一个新的实体数据模型（`Sales.edmx` 文件），包含 `Customer`、`SalesTerritory`、`SalesOrderHeader`\
  \ 和 `SalesOrderDetail` 表。\n\n你最终将得到看起来像图 11-16 的模型。\n\n![image](img/f425-02.jpg)\n\
  \n**图 11-16**\n\n你可以通过查看设计器上连接视觉对象的线条来查看关系。连线一端的星号表示*多*。连接另一侧出现的数字 1（因为连线位于 `SalesOrderHeader`\
  \ 和 `Customer` 对象之间）表示多对一关系。你也可以在设计器中高亮关系线本身时，在 Visual Studio 的 `Properties` 窗口中查看有关关系的详细信息，如视图中两个\
  \ `End` 属性值所示。\n\n现在看一个将代表你跨表执行某些连接的页面。此操作在列表 11-4 中说明（本节代码下载中的 `ManyToMany.aspx.vb`\
  \ 和 `ManyToMany.aspx.cs`）。对于此示例，创建一个仅包含单个 `BulletedList` 控件的简单 ASP.NET Web Form。\n\
  \n***\n\n**列表 11-4: 让 Entity Framework 执行连接**\n\n***VB***\n\n```vb\n Partial Class\
  \ ManyToMany\n      Inherits System.Web.UI.Page\n\n    Protected Sub Page_Load(ByVal\
  \ sender As Object, ByVal e As EventArgs)\n\n          Dim adventureWorks2012_DataEntities\
  \ As\n             New AdventureWorks2012_DataEntities()\n\n          Dim query\
  \ = From o In adventureWorks2012_DataEntities.SalesOrderHeader\n               \
  \       Where o.SalesOrderDetail.Any(Function(Quantity)\n                      \
  \  Quantity.OrderQty > 5)\n                      Select New {Key o.SalesNumber,\n\
  \                          Key o.CustomerID,\n                          Key o.SalesPersonID}\n\
  \n          BulletedList1.DataSource = query.ToList()\n          BulletedList1.DataBind()\n\
  \n       End Sub\nEnd Class\n```\n\n***C#***\n\n```csharp\n using System;\n  using\
  \ System.Linq;\n\n  namespace AspnetEntityFx\n  {\n    public partial class _Default\
  \ : System.Web.UI.Page\n    {\n        protected void Page_Load(object sender, EventArgs\
  \ e)\n        {\n            AdventureWorks2012_DataEntities adventureWorks2012_DataEntities\
  \ =\n                new AdventureWorks2012_DataEntities();\n\n            var query\
  \ = from o in adventureWorks2012_DataEntities.SalesOrderHeader\n               \
  \         where o.SalesOrderDetail.Any(Quantity => Quantity.OrderQty > 5)\n    \
  \                    select new {o.SalesNumber,\n                            o.CustomerID,\n\
  \                            o.SalesPersonID};\n\n            BulletedList1.DataSource\
  \ = query.ToList();\n            BulletedList1.DataBind();\n        }\n    }\n \
  \ }\n```\n\n***\n\n此查询从三个不同的表中提取内容，并且 Entity Framework 为你完成了所有连接工作。在这种情况下，你正在处理\
  \ `SalesOrderHeader` 表中所有数量大于 5 的项目。从选定的项目中，跨表为动态对象提取了字段。最后，结果再次绑定到 `BulletedList`\
  \ 控件上。图 11-17 展示了最终结果。\n\n## 在 EDM 中执行继承\n\n在构建实体数据模型时，你可以像处理 CLR 内部对象一样容易地执行继承。\n\
  \n继承让你了处理和查找你确定的特殊对象的能力。关于该功能的示例，在本节中，我们修改了 `Vendor` 对象，以便通过对象引用而非值解释来查找不活跃的供应商。\n\
  \n创建一个新的实体数据模型（`Vendor.edmx` 文件），其中仅包含 `Vendor` 表（采购部分）。当你在 Visual Studio 中打开 `Vendor`\
  \ 表的定义时，你将看到类似于图 11-18 的内容。\n\n![image](img/f427-02.jpg)\n\n**图 11-18**\n\n\n\n\
  如你从图中所示，`ActiveFlag` 属性的类型为 `bit`，这意味着它要么是 0 要么是 1，分别代表 False 或 True。在本示例中，你将构建一个特殊类型，作为非活动供应商的引用，以便你区分活动和非活动状态。\n\
  \n当你的 `Vendor` 表准备好后，在设计器表面上点击右键，从提供的菜单中选择 `Add` ![image](img/Ar.jpg) `Entity`。随后会出现“添加实体”窗口。\n\
  \n从该窗口中，提供实体名称 `InactiveVendor` 并让其继承自基类型 `Vendor`。最后，你的“添加实体”对话框应如图 11-19 所示。\n\
  \n![image](img/f428-01.jpg)\n\nFIGURE 11-19\n\n此步骤将为映射添加一个视觉化表示，如图图 11-20 所示。\n\n\
  ![image](img/f428-02.jpg)\n\nFIGURE 11-20\n\n下一步是进一步将这两个对象结合，并为它们的关系提供逻辑。为了完成此任务，你首先从\
  \ `Vendor` 实体对象中删除 `ActiveFlag` 标量属性，因为在示例中不需要它。\n\n然后，在设计器中选中 `Vendor` 对象，并在 Visual\
  \ Studio 的“映射详细信息”视图中查看该对象的映射详细信息。从此视图中，添加一个 `ActiveFlag` 等于 `1` 的条件，如图 11-21 所示。\n\
  \n![image](img/f428-03.jpg)\n\nFIGURE 11-21\n\n此设置实际上意味着如果 `ActiveFlag` 的值为 `1`，则该对象的类型将为\
  \ `Vendor`。现在你设置 `InactiveVendor` 对象。在映射详细视图中查看此对象时，你必须在映射详细信息视图中添加 `Vendor` 表。从那里，创建一个\
  \ `ActiveFlag` 等于值 `0` 的条件，如图 11-22 所示。\n\n![image](img/f429-01.jpg)\n\nFIGURE 11-22\n\
  \n现在所有条件都已就绪，你实际上是在说：如果 `ActiveFlag` 的值为 `1`，那么在你的实体数据模型中类型就是 `Vendor`。然而，如果 `ActiveFlag`\
  \ 的值为 `0`，则对象类型为 `InactiveVendor`。你可以在代码中使用这种方式，如代码列表 11-5 所示（本章代码下载中的 `Inheritance.aspx.vb`\
  \ 和 `Inheritance.aspx.cs`）。\n\n* *\n\nLISTING 11-5: 在实体数据模型中使用继承\n\n***VB***\n\n\
  ```\n Partial Public Class Inheritance\n        Inherits System.Web.UI.Page\n\n\
  \        Protected Sub Page_Load(ByVal sender As Object,\n          ByVal e As EventArgs)\n\
  \n            Dim adventureWorks2012_DataEntities As New\n               AdventureWorks2012_DataEntities2()\n\
  \n            Dim query =\n                From v In adventureWorks2012_DataEntities.Vendors\n\
  \                    .OfType(Of InactiveVendor)()\n                Select v\n\n\
  \            GridView1.DataSource = query.ToList()\n            GridView1.DataBind()\n\
  \        End Sub\n\n    End Class\n```\n\n***C#***\n\n```vb\n using System;\n  using\
  \ System.Linq;\n\n  namespace AspnetEntityFx\n {\n    public partial class Inheritance\
  \ : System.Web.UI.Page\n    {\n        protected void Page_Load(object sender, EventArgs\
  \ e)\n        {\n            AdventureWorks2012_DataEntities3 adventureWorks2012_DataEntities\
  \ =\n                new AdventureWorks2012_DataEntities3();\n\n            var\
  \ query = from v in adventureWorks2012_DataEntities.Vendors\n                  \
  \          .OfType<InactiveVendor>()\n                        select v;\n      \
  \      GridView1.DataSource = query.ToList();\n            GridView1.DataBind();\n\
  \        }\n    }\n  }\n```\n\n* *\n\n现在你可以使用 `OfType` 扩展方法来查找类型为 `InactiveVendor`\
  \ 的对象。\n\n## 使用 ENTITYDATASOURCE 控件\n\n`EntityDataSource` 控件使得在 ASP.NET 中处理实体数据模型变得简单。该控件将处理绑定到任何控件所需的\
  \ LINQ 工作。\n\n### 创建基页面\n\n作为使用 `EntityDataSource` 控件的示例，你将返回 `Sales.edmx` 文件并处理该模型中的\
  \ `Customer` 对象。\n\n首先，你需要创建一个 ASP.NET Web 表单（Web Form）来处理此模型。为此，请在你的 ASP.NET Web\
  \ 应用程序项目中创建 Web 表单，并使用代码列表 11-6 所示的代码（本章代码下载中的 `EntityDataSource.aspx`）。\n\n* *\n\
  \nLISTING 11-6: 使用 EntityDataSource 控件\n\n```asp <%@ Page Language=\"C#\" AutoEventup=\"\
  true\"\n      CodeBehind=\"EntityDataSource.aspx.cs\" Inherits=\"AspnetEntityFx.EntityDataSource\"\
  \ %>\n\n  <!DOCTYPE html>\n\n  <html xmlns=\"http://www.w3.org/1999/xhtml\" >\n\
  \    <head runat=\"server\">\n      <title> </title>\n  </head>\n  <body>\n    \
