  \ 服务器控件的简单页面。代码列表 13-40 展示了该页面的示例。\n\n现在你已经准备好了一个基础页面，在 Visual Studio 解决方案管理器中右键点击你的项目，从提供的菜单中选择`Add\
  \ Service Reference`（添加服务引用）。将出现`Add Service Reference`对话框。\n\n由于 WCF 数据服务是一个标准的\
  \ `.svc` 文件，你可以在提供的文本框中引用你的 `AdventureWorksDataService.svc` 文件，并点击`Go`按钮。图 13-31\
  \ 显示了与此类似的界面。\n\n![image](img/f513-01.jpg)\n\n**[图 13-31]](#Chapter13.xhtml_figureanchor13-31)**\n\
  \n从图中你可以看到，所有的底层对象都显示在对话框中。在 `Namespace` 文本框中，你可以将引用命名为 `AWServiceReference`，然后点击\
  \ OK 接受此配置。\n\n下一步是如代码列表 13-41 所示对该引用进行操作。（这两个文件分别是本章代码下载中 `Chapter13-WcfDSConsumer-VB`\
