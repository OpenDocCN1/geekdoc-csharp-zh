  \ Basic、客户端 JavaScript、XSLT 和 SQL 存储过程）的调试。\n\n## 设计时支持\n\nVisual Studio 一直在设计时对潜在错误的警告方面做得很好。`Syntax\
  \ notifications`（语法通知）或波浪线（squiggles）会在编译项目之前标出无法编译或可能导致错误的代码。当调试会期间发生异常时，会弹出新的\
  \ `error notification`（错误通知），并建议一种防止异常的行动方案。在每一步中，Visual Studio 都试图变得更加智能，预测你的需求并捕捉常见错误。\n\
  \nVisual Studio 首席架构师 Rico Mariani 使用“成功之坑”（The Pit of Success）一词来描述微软希望你通过 Visual\
  \ Studio 获得的体验。当微软设计这些功能时，它希望客户能够自然而然地掉进成功的成功的实践中。该公司尝试通过增加你编写 Bug 代码或犯下常见错误的难度来实现这一点。微软的开发者在构建能够引导你走向正确方向的\
  \ API 方面花费了大量精力。\n\n### 语法通知\n\nVisual Basic 和 `C#` 编辑器在编译前的很早就会针对许多语法错误显示波浪线和工具提示，如图图\
