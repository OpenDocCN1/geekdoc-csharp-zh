  \n## 处理器\n\n`HttpHandlers` 与 `HttpModules` 的不同之处不仅在于它们在请求处理管道中的位置不同（参见 图 30-1 和\
  \ 30-2），还因为它们必须映射到特定的文件扩展。处理器是传入请求的终点，并最终负责提供请求的内容，无论是 ASPX 页面、纯文本还是图像。\n\n使用 `HttpHandlers`\
  \ 来提供你可能使用标准 ASP.NET 页面的内容（例如动态文件）是一个好主意，因为它允许你编写专门的处理器，消除标准处理器的开销。\n\n本节演示了两种创建基于查询字符串数据的简单\
  \ `HttpHandler` 方法：\n\n*   首先，你将查看使用 `.ashx` 扩展创建 `HttpHandler`，这不需要服务器配置。\n*  \
  \ 接下来，你将学习如何通过 IIS 将你的 `HttpHandler` 映射到自定义文件扩展名。\n\n### 通用处理器\n\nVisual Studio\
  \ 为 `HttpHandlers` 提供了标准模板以帮助你快速上手。要向项目添加 `HttpHandler`，你只需在“新建项”对话框中选择“通用处理器”文件类型。图\
  \ 30-4 显示了该对话框。\n\n![image](img/f114.jpg)\n\n图 30-4\n\n你可以看到，当你将通用处理器文件添加到项目项目时，它会添加一个具有\
  \ `.ashx` 扩展的文件。`.ashx` 文件扩展是 ASP.NET 设置的默认 `HttpHandler` 文件扩展。记住，`HttpHandlers`\
  \ 必须映射到唯一的扩展名，因此 ASP.NET 默认使用 `.ashx` 扩展。此功能非常方便，否则你需要自己添加文件扩展。使用自定义处理器文件类型可以帮助避免任何额外的配置。\n\
  \n注意文件类型自动为你创建的类存根。列表 30-5 显示了该类（`txhandler.ashx.cs` 和 `txhandler.ashx.vb` 文件）。\n\
  \n注意存根实现了 `IHttpHandler` 接口，该接口要求实现 `ProcessRequest` 方法和 `IsReusable` 属性。\n\n\n\n\
  \n*   你使用 `ProcessRequest` 方法来处理传入的 HTTP 请求。默认情况下，类存根会将内容类型更改为文本，然后向输出流写入 `\"Hello\
  \ World\"` 字符串。\n*   `IsReusable` 属性仅让 ASP.NET 知道传入的 HTTP 请求是否可以重用此 `HttpHandler`\
  \ 的示例实例。\n\n模板中生成的处理程序可以立即运行。尝试在浏览器中执行该处理程序并观察发生了什么。关于此处理程序值得注意的地方在于，因为它将内容更改为 `text/plain`，由于多种因素，浏览器对该处理程序的响应方式可能非常不同：\n\
  \n*   浏览器类型和版本\n*   系统中可能映射到该 MIME 类型的应用程序\n*   操作系统和服务包级别\n\n根据这些因素，你可能会在浏览器中看到返回的文本，可能会看到记事本打开并显示文本，或者可能会收到\
  \ Internet Explorer 弹出“打开/保存/取消”提示。请确保你理解更改 `ContentType` 标头的潜在后果。\n\n你可以通过修改示例以返回实际文件来继续该示例。在这种情况下，你使用处理程序返回一个图像。示例下载中包含了一个图像文件\
  \ `Garden.jpg`。要做到这一点，你只需修改 `ProcessRequest` 方法中的代码，如 列表 30-6 所示（本章代码下载中的 `imghandler.ashx.cs`\
  \ 和 `imghandler.ashx.vb` 文件）。\n\n如你所见，你只需将 `ContentType` 更改为 `image/jpeg` 表示你正在返回一个\
  \ JPEG 图像；然后使用 `WriteFile()` 方法将图像文件写入输出流。将处理程序加载到浏览器，你会发现处理程序显示了图像。图 30-5 显示了生成的网页。\n\
  \n![image](img/f1117-01.jpg)\n\n**图 30-5]**\n\n现在，你创建一个简单的网页来显示图像处理程序。列表 30-7（本章代码下载中的\
  \ `ShowImage.aspx` 文件）显示了 C# 版本的网页代码。\n\n尽管这很简单，但你可以通过向处理程序传递查询字符串参数并使用它们在处理程序中执行额外的逻辑来增强示例：\n\
  \n```html\n <img src=\"imghandler.ashx?imageid=123\" />\n```\n\n使用查询字符串数据，你可以从 SQL\
  \ 数据库中动态地检索图像并将其返回给客户端，或者执行某些类型的身份验证以确保请求者允许访问此图像。\n\n### 在 IIS 中映射文件扩展名\n\n虽然使用\
  \ `.ashx` 文件扩展名很方便，但你可能想为自定义文件扩展名甚至为常用的扩展名创建 HTTP 处理程序。你可以使用图像处理程序的代码来演示这种方法。\n\n\
  在 Web 项目的 `App_Code` 目录下创建一个新类。你可以简单地将现有图像处理程序控件的代码复制到此类中，如 列表 30-8 所示（本章代码下载中的\
  \ `App_Code\\ImgHandler.cs` 和 `App_Code\\ImgHandler.vb` 文件）。\n\n在添加你的类后，配置应用程序以显示此处理程序提供何种文件扩展名。你通过向\
  \ `web.config` 文件添加 `<handlers>` 部分来实现这一点。列表 30-9 显示了为图像处理程序添加的部分。\n\n在配置部分，你引导应用程序使用\
  \ `ImgHandler` 类来处理针对 `ImageHandler.img` 的传入请求。你也可以为路径指定通配符。为路径指定 `*.img` 表示让应用程序使用\
  \ `ImgHandler` 类处理任何具有 `.img` 文件扩展名的请求。为 `verb` 指定 `*` 表示你希望使用处理程序处理所有指向应用程序的请求。\n\
  \n与 HttpModules 一样，如果你使用 IIS 6 运行 Web 应用程序，则还必须在应用程序 `config` 文件的 `<system.web>`\
