  server\"\n          ConnectionString=\"name=AdventureWorks2012_DataEntities1NorthwindEntities\"\
  \n          DefaultContainerName=\"AdventureWorks2012_DataEntities1NorthwindEntities\"\
  \ \n          EnableDelete=\"True\" EnableFlattening=\"False\"\n          EnableInsert=\"\
