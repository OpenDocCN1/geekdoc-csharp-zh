  \ 17-33 所示类似的内容。如果你使用的是 Firefox 浏览器，导航到工具 ![image](img/Ar.jpg) 选项 ![image](img/Ar.jpg)\
  \ 内容，并点击“选择”按钮。\n\n![image](img/f663-02.jpg)\n\n**图 17-33**\n\n![image](img/f663-03.jpg)\n\
  \n**图 17-34**\n\n![image](img/f664-01.jpg)\n\n等等，文本提到：现在，当请求页面时，区域设置设置为 `de`，则使用了\
  \ `Web.sitemap.de.resx` 而不是 `Web.sitemap.resx`。\n\n\n\n在此页面上，您可以通过选择 `Enable Roles`\
  \ 链接轻松启用角色管理系统。完成此操作后，系统会提示目前不存在任何角色。要为站点导航系统创建所需的角色，请选择 `Create or Manage Roles`\
  \ 链接。随后会出现一个新页面，您可以在其中创建管理员角色。在本示例中，我将角色命名为 `Admin`。\n\n添加 `Admin` 角色后，点击“返回”按钮，然后选择应用程序使用的身份验证类型。您需要确保已选择了\
  \ `From the Internet` 选项。这将允许您在系统中创建用户。默认情况下，这些用户存储在 `ASP.NET` 在您的应用程序中创建的 Microsoft\
  \ SQL Server Express 版文件中，因此必须安装数据库服务器。您也可以在 `web.config` 文件中提供自定义的连接字符串，以配置 `ASP.NET`\
  \ 使用另一个数据库服务器或类型。\n\n选择身份验证类型后，您就可以创建新用户，并在创建用户界面上通过勾选相应的角色（使用复选框）将用户放入 `Admin`\
  \ 角色中。\n\n当您确认用户已创建并分配到 `Admin` 角色后，可以检查 `web.config` 文件中的设置是否恰当，如 Listing 17-33\
  \ 所示。\n\n### 设置管理员部分\n\n下一步是仅为管理员设置一个页面。在本示例中，我将页面命名为 `AdminOnly.aspx`，它仅包含一个欢迎管理员访问页面的简单字符串值。该页面仅对\
  \ `Admin` 角色的用户锁定。这种锁定通过在 `web.config` 文件中进行相应设置来实现，如 Listing 17-34 所示。\n\n现在，由于\
  \ `AdminOnly.aspx` 页面只有 `Admin` 角色的用户可以访问，下一步是允许用户登录应用程序。应用程序演示通过创建一个 `Default.aspx`\
  \ 页面来实现此任务，该页面包含一个 `Login` 服务器控件以及一个绑定到 `SiteMapDataSource` 控件的 `TreeView` 控件。Listing\
  \ 17-35。\n\n在配置 `Default.aspx` 页面后，您需要对在 Listing 17-1 中最初提供的 `Web.sitemap` 文件进行另一个更改。在本示例中，您添加了一个与新的\
  \ `AdminOnly.aspx` 页面配合使用的 `<siteMapNode>` 元素。该节点如下：\n\n```xml\n <siteMapNode title=\"\
  Administration\" description=\"The Administrators page\"\n   url=\"AdminOnly.aspx\"\
  \ roles=\"Admin\" />\n```\n\n由于 `Login` 控件使用了验证，您需要引用 `jQuery` 或禁用无侵入性验证（参见 Chapter\
  \ 6）；后者可以通过以下 `web.config` 设置完成：\n\n```xml\n <appSettings>\n    <add key=\"ValidationSettings:UnobtrusiveValidationMode\"\
  \ value=\"None\" />\n  </appSettings>\n```\n\n当应用程序中的所有项目都就绪后，下一步是为站点导航系统启用安全修剪（security\
  \ trimming）。\n\n### 启用安全修剪\n\n默认，安全修剪是禁用的。即使您开始在 `web.config` 文件的任何 `<siteMapNode>`\
  \ 元素上应用 `roles` 属性值，它也不会生效。要启用安全修剪，您必须精调站点导航系统的提供程序声明。\n\n要对 `XmlSiteMapProvider`\
  \ 进行必要的更改，您必须在配置链的高层进行这些更改，例如 `machine.config` 文件或默认的 `web.config` 文件；或者您也可以较低的位置进行更改，例如在应用程序的\
  \ `web.config` 文件中。本示例在 `web.config` 文件中更改。\n\n要更改 `web.config` 文件中的 `XmlSiteMapProvider`，您首先清除已声明的实例。清除后，您将重新声明一个新的\
  \ `XmlSiteMapProvider` 实例，但这次您启用了安全修剪，如 Listing 17-36 所示。\n\n从此示例可以看出，定义了一个新的 `XmlSiteMapProvider`，并将\
  \ `securityTrimmingEnabled` 属性设置为 `True`。启用安全修剪后，`<siteMapNode>` 元素中的 `roles` 属性将在站点导航系统中生效。\n\
  \n若要亲自测试，请运行 `Default.aspx` 页面。会出现一个不包含页面管理部分链接的页面，如 Figure 17-36 所示。\n\n![image](img/f667-01.jpg)\n\
  \n**FIGURE 17-36**\n\n从此图中可以看出，`TreeView` 控件中不存在管理链接。现在，以包含 `Admin` 角色的用户身份登录应用程序。您会发现，站点导航确实发生了变化以反映用户的角色，如\
  \ Figure 17-37 所示。\n\n![image](img/f667-02.jpg)\n\n**FIGURE 17-37**\n\n## 嵌套站点文件\n\
  \n安全修剪是根据角色更改站点导航的一种理想方式。您不需要将所有站点导航都放在单个 `Web.sitemap` 文件中。事实上，可以将其分到多个 `.sitemap`\
  \ 文件——这就是所谓的*嵌套* `.sitemap` 文件。\n\n例如，假设您正在使用 Listing 17-1 中的站点文件，并且有大量的站点导航需要添加。您可以将这些信息放在当前站点文件中，也可以将其放在另一个站点文件中。\n\
  \n在最简单的情况下，嵌套站点文件是能够轻松实现的。为了演示其效果，创建一个新的站点文件（命名为 `Entertainment.sitemap`）并将其放入应用程序中。Listing\
  \ 17-37 展示了一个 `Entertainment.sitemap` 文件。\n\n您可以将 `Entertainment.sitemap` 放置在包含主站点文件的根目录下。现在，根据\
  \ Listing 17-1 中的站点文件，您在列表底部添加以下内容，如 Listing 17-38 所示。\n\n您不再使用标准的 `url`、`title`\
  \ 和 `description` 属性，而是使用 `siteMapFile` 属性指向要包含的另一个站点文件。运行此页面，您将获得与 Figure 17-38\
  \ 相似的结果。\n\n![image](img/f668-01.jpg)\n\n**FIGURE 17-38**\n\n嵌套站点文件的另一种方法是在站点提供模型定义中构建第二个提供程序，然后在\
  \ `<siteMapNode>` 元素中使用 `provider` 属性来引用此声明。为了完成此任务，您在 `web.config` 文件中添加了一个新的站点提供程序引用，如\
  \ Listing 17-39 所示。\n\n从这段代码可以看出，定义了第二个提供程序。定义第二个站点提供程序并不意味着您必须在 `<provider>` 部分使用\
  \ `<clear />` 元素，而是定义一个具有新名称的新程序。在这种情况下，提供程序的名称是 `AspNetXmlSiteMapProvider2`。此外，在此提供程序定义中，使用\
  \ `siteMapFile` 属性指向应使用的站点文件名称。\n\n\n\n完成后，你可以通过使用 `Web.sitemap` 文件中 `<siteMapNode>`\
  \ 元素的 `provider` 属性来引用此声明。要以这种方式添加 `Entertainment.sitemap` 文件，你的`<siteMapNode>`\
  \ 元素应采用列表 17-40 所示的形式。\n\n此代码提供的结果与图 17-38 中所示的相同。除了提供了嵌套站点地图文件的另一种方法外，使用 `provider`\
  \ 属性还让你获得了巨大的优势。如果你构建了一个新的站点地图提供程序，从另一个数据源（而不是 XML 文件）提取站点地图导航信息，你可以在主 `Web.sitemap`\
  \ 文件中混合这些结果。最终结果可能包含来自两个或多个完全不同数据源的项目。\n\n## 总结\n\n本章介绍了 ASP.NET 4.5 提供的导航机制。导航能力的核心在于能够在\
  \ XML 文件中详细说明导航结构，而各种导航控件——例如新的 `TreeView` 和 `SiteMapPath` 控件——可以利用这些结构。\n\n导航能力提供的强大功能为你节省了大量的编码时间。\n\
  \n除了向你展示 ASP.NET 4.5 导航的核心基础设施外，本章还描述了 `TreeView` 和 `SiteMapPath` 控件以及如何在整个应用程序中使用它们。这些控件的棒之处在于，它们开箱即用即可丰富地显示你的导航层次结构，并让最终用户轻松地浏览网站。此外，这些控件可以轻松更改，你可以超越它们提供的标准外观和功能。\n\
  \n与 `TreeView` 服务器控件一起，本章还研究了 `Menu` 服务器控件。你会发现这两个控件之间有许多相似之处，因为它们都提供了一种查看分级数据的方法。\n\
  \n最后，本章研究了如何实现 URL 映射，以及如何本地化你的 `Web.sitemap` 文件，并根据用户在角色管理系统中的角色过滤站点导航内容的结果。\n\n\
  # 18 个性化\n\n### 本章包含内容？\n\n- 探索 ASP.NET 的个性化能力\n- 与个性化属性一起工作\n- 使用个性化提供程序存储数据\n\
  - 与匿名用户一起工作\n\n## 本章的 WROX.COM 代码下载\n\n请注意，本章中的所有代码示例均可在书籍网站上[`www.wrox.com`](http://www.wrox.com)\
  \ 的“下载代码”选项卡下载本章的代码。\n\n许多 Web 应用程序必须根据当前查看页面的最终用户的特定信息进行定制。在过去，开发者通常通过 cookie、`Session`\
  \ 对象或 `Application` 对象为查看页面的最终用户提供个性化属性存储。Cookie 允许存储持久项，以便当最终用户返回网页时，与他相关的任何设置都能被检索并供应用程序再次使用。Cookie\
  \ 不是处理持久用户数据的最佳方法，因为并不是所有计算机都接受它们，而且狡猾的最终用户可以轻松修改它们。\n\n正如你在第 19 章中看到的，ASP.NET 成员和角色管理功能是\
  \ ASP.NET 存储用户信息的方法。作为开发者，你如何使用相同的机制来存储自定义信息呢？\n\nASP.NET 4.5 为你提供了一个卓越的功能——个性化。此最新版本提供的\
  \ ASP.NET 个性化引擎在查看页面的最终用户与存储的该用户的任何数据点之间建立了自动关联。按用户维护的个性化属性存储在服务器上而不是客户端上。这些项目被方便地放置在你选择的数据存储中（例如\
  \ Microsoft 的 SQL Server），因此，最终用户可以在随后的站点访问中访问这些个性化属性。\n\n此功能是开始创建高度定制和用户特定网站的理想方式，无需预先构建任何基础设施。在这种情况下，基础设施已经为你构建好了！本章向你展示了个性化功能是\
  \ ASP.NET 团队让开发者工作更轻松、更高效的另一种方式。\n\n## 个性化模型\n\nASP.NET 4.5 提供的个性化模型非常简单，并且与 ASP.NET\
  \ 带的大多数项目一样，它也是一个可扩展的模型。图 18-1 显示了一个概述个性化模型的简单图表。\n\n![image](img/f672-01.jpg)\n\
  \n**图 18-1**\n\n从该图中，你可以看到该模型中的三个层。观察个性化模型的中间层——个性化服务层。该层包含 Profile API。该 Profile\
  \ API 层允许你将最终用户的数据点编程到下层数据存储器之一。\n\n尽管 ASP.NET 内置的某些控件可以利用个性化能力来存储有关页面设置的信息，你也可以使用此引擎来存储自己的数据点。与\
  \ Web Parts 一样，你可以在 ASP.NET 页面中使用这些点。\n\n在个性化服务层下方，你会发现用于从 2000 版本开始的 Microsoft\
  \ SQL Server 以及 Microsoft SQL Server Express 版的默认个性化数据提供程序。在应用 ASP.NET 4.5 的个性化功能时，你并不局限于这一个数据存储器；你还可以扩展模型并为个性化引擎创建自定义数据提供程序。\n\
  \n现在你已经简要地看了个性化模型，你就可以通过创建一些可以在应用程序中使用存储个性化属性来开始使用它了。\n\n## 创建个性化属性\n\n创建自定义个性化属性的优点是你可以非常容易地完成。在创建这些属性后，你获得了对它们进行强类型访问的能力。你可以创建仅供身份验证用户使用的个性化属性，也可以创建一些匿名用户可以利用的属性。这些数据点是强大的，主要因为你可以立即在应用程序中使用它们，而无需构建任何支持它们的基础设施。作为使用\
  \ ASP.NET 个性化系统的一个示例，本章首先向你展示如何创建一些简单的个性化属性。稍后，你将学习如何在你的应用程序中使用这些个性化属性。\n\n### 添加简单的个性化属性\n\
  \n在添加个性化属性时，你必须决定要从用户那里存储哪些数据项。对于此示例，创建几个关于用户的项目，以便你可以在应用程序中使用它们；假设你想存储关于该用户的以下信息：\n\
  \n- 名字\n- 姓氏\n- 最后访问时间\n- 年龄\n- 成员状态\n\nASP.NET 对在 XML 文件内部存储配置有深度的依赖，ASP.NET 4.5\
  \ 个性化引擎也不例外。你在应用程序的 `web.config` 文件中定义并存储所有这些关于最终用户的自定义点，如列表 18-1 所示（本章代码下载中的 Web.config）。\n\
  \n在 `web.config` 文件的 `<system.web>` 部分中，你创建一个 `<profile>` 部分来与 ASP.NET 4.5 个性化引擎协同工作。在\
  \ `web.config` 文件的此 `<profile>` 部分中，你创建一个 `<properties>` 部分，在其中你可以定义所有你想让个性化引擎存储的属性。\n\
  \n\n\n\n从这个代码示例中，你可以看到使用 `<add>` 元素定义简单属性是非常容易。该元素只需接收 `name` 属性，该属性接收你想要持久化的属性的名称。\n\
  \n你开始时的假设是，访问使用这些属性构建的页面已经通过 Windows 身份验证进行了验证（你可以在下一章中阅读更多关于身份验证和授权的内容）。在本章的后续部分，你还将查看如何对匿名用户应用个性化属性。对匿名用户应用个性化属性的能力默认是禁用的（出于正当的考虑）。\n\
  \n在你定义了这些个性化属性后，使用它们与定义它们一样简单。接下来的部分将介绍如何在应用程序中使用这些定义。\n\n## 使用个性化属性\n\n现在你已经已经在\
  \ `web.config` 文件中定义了个性化属性，你可以在代码中使用这些项目了。例如，你可以创建一个简单的表单，向最终用户索取部分信息。当用户提交表单时，数据将存储在个性化引擎中。\n\
  \n为了使此功能生效，你需要设置一个新的网站（我们将在本章稍后部分介绍 Web 应用程序，以及为什么个性化属性在其中处理起来会困难一些），并向其添加示例 18-1\
  \ 和 18-2。此外，进入站点属性禁用“匿名”并启用“Windows 身份验证”（这本应该是默认设置）。这允许 ASP.NET 为当前用户存储个性化信息。匿名用户将在本章稍后介绍。\n\
  \n与身份验证功能一样，ASP.NET 默认使用 SQL Server Express 作为数据存储，因此需要对其进行设置。\n\n示例 18-2 显示了如何访问示例\
  \ 18-1 中设置的配置信息。\n\n你处理个性化属性的方式与过去处理 `Session` 对象的方式类似，但请注意，你存储和检索的个性化属性不是基于键的。因此，在处理它们时，你不需要记住键名。\n\
  \n个性化系统存储的所有项目都被类型转换为特定的 .NET 数据类型。默认情况下，这些项目以 `String` 类型存储，并且你对存储的项目具有早期绑定访问权限。要存储一个项目，你只需使用\
  \ `Profile` 对象直接填充个性化属性：\n\n```\nProfile.FirstName = TextBox1.Text\n```\n\n要检索相同的信息，你只需在此处获取\
  \ `Profile` 类的相应属性：\n\n```\nLabel1.Text = Profile.FirstName\n```\n\n使用 `Profile`\
  \ 类以及在代码视图中定义的所有个性化属性的巨大用处是，这种方法在你构建页面时提供了 IntelliSense（智能提示）。当在此视图中处理 `Profile`\
  \ 类进行工作时，你定义的所有项目都会通过 IntelliSense 功能作为可用选项列出，如图图 18-2 所示。\n\n![image](img/f675-01.jpg)\n\
  \n**图 18-2**\n\n所有这些属性在 IntelliSense 中都是可用的，因为每当你保存对 `web.config` 文件所所的个性化更改时，`Profile`\
  \ 类都会在后台被隐藏并动态编译。在你在 `web.config` 文件中保存了这些项目后，这些属性将以强类型的方式在整个应用程序中可用。\n\n运行时，来自示例\
  \ 18-2 的页面将产生图 18-3 所示的结果。你可能需要在你的网站设置中激活 Windows 身份验证并禁用匿名验证。\n\n![image](img/f676-01.jpg)\n\
  \n**图 18-3**\n\n除了使用早期绑定访问技术外，你还可以对存储在个性化引擎中的项目使用后期绑定访问。示例 18-3 显示了后期绑定访问技术。\n\n\
  无论是早期绑定还是后期绑定访问，你都可以使用 ASP.NET 4.5 提供的功能轻松地为特定用户存储和检索个性化属性。所有这些存储和检索都在个性化引擎最简单的形式中完成——现在来看看你如何为应用程序中的特定需求进行定制。\n\
  \n## 添加分组个性化属性\n\n你在应用程序开始部分存储的关于特定最终用户的项目，可以在稍后检索出来，用于应用程序内的任何其他页面。由于你的 Web 应用程序的不同部分存储不同的个性化属性，你有时会得到大量需要存储并可以访问的项目集合。\n\
  \n为了不仅更容易存储项目，而且更容易检索它们，个性化引擎允许你分组存储个性化属性，如示例 18-4 所示。\n\n从位于 `web.config` 文件中的示例\
  \ 18-4 代码中，你可以看到列出了两个组。第一组是 `MemberDetails` 组，定义了四个特定项目；第二个组——`FamilyDetails`——定义了三个相关项目。你在`<properties>`\
  \ 定义中使用`<group>` 元素来定义个性化组。你使用 `name` 属性指定组的名称，就像你指定 `<add>` 元素一样。你可以根据需要或最佳实践定义尽可能多的个性化组。\n\
  \n## 使用分组个性化属性\n\n你也可以从示例 18-4 中看到某些项目没有定义在组中。将组内属性与未成组属性混合是可能的。对于示例 18-4 中未定义在组的项目，仍然可以像之前所示的方法访问：\n\
  \n```\nLabel1.Text = Profile.FirstName\n```\n\n现在，关于处理个性化组，你可以使用嵌套命名空间以逻辑方式访问你的定义项目：\n\
  \n```\nLabel1.Text = Profile.MemberDetails.DateJoined\nLabel2.Text = Profile.FamilyDetails.MarriedStatus\n\
  ```\n\n从这个示例中，你可以看到每个定义组的两个单独项目都以逻辑方式访问。当你研究应用程序的 `web.config` 文件定义的属性时，你可以看到示例中的每个组都有一个同名的属性——`Location`。这是因为它们是通过个性化组定义的。通过这种结构，指定相应的组来获取每个\
  \ `Location` 属性是可能的：\n\n```\nLabel1.Text = Profile.MemberDetails.Location\nLabel2.Text\
  \ = Profile.FamilyDetails.Location\n```\n\n## 为个性化属性定义类型\n\n默认，当你存储个性化属性时，这些属性被创建为\
  \ `System.String` 类型。然而，通过 `web.config` 文件中的配置设置更改另一种类型是非常容易的。要定义个性化属性的名称及其相应的类型，你使用位于`<properties>`\
  \ 部分内的`<add>` 元素的 `type` 属性，如示例 18-5 所示。\n\n\n\n\n\n前两个属性 `FirstName` 和 `LastName`\
  \ 被强制转换为 `System.String` 类型。这实际上并不是必须的。即使你省略了这一步，它们仍然会被强制转换为 `String` 类型，因为这是个性化系统中定义的任何属性的默认类型（如果没有定义其他类型的话）。接接一个个性化属性是\
  \ `LastVisited` 属性，它被定义为 `System.DateTime` 类型，用于存储终端用户上次访问该页面的日期和时间。除此之外，你可以看到其余的个性化属性都是使用特定的\
  \ .NET 数据类型定义的。\n\n这种方法更受青睐，因为它在你编写应用程序并使用已定义的个性化属性时，可以为你提供类型检查能力。\n\n### 使用自定义类型\n\
  \n从前面展示了如何为个性化属性定义类型的示例中可以看出，将属性定义并转换为 .NET Framework 中提供的特定数据类型是相当简单的。你可以轻松地在 `web.config`\
  \ 文件中定义如 `System.Int32`、`System.String`、`System.DateTime`、`System.Byte` 和 `System.Boolean`\
  \ 等项。但你如何定义复杂类型呢？\n\n利用自定义类型的个性化属性的定义方法与使用简单类型的个性化属性一样简单。自定义类型允许你将复杂项（如购物车信息或其他状态信息）从应用程序的一次使用存储到下一次使用。列表\
  \ 18-6 首先显示了一个类 `ShoppingCart`，你稍后将在其中一个个性化属性定义中使用它（参见本章代码下载中的 `ShoppingCart.cs`\
  \ 和 `ShoppingCart.vb`）。\n\n这种简单的购物车构造现在可以存储终端用户在电子商务网站上移动时的购物车篮。当终端用户在其他时间返回网站时，篮甚至可以被持久化。请注意，该类在类声明之前需要一个\
  \ `Serializable` 特性，以确保正确转换为 XML 或二进制格式。\n\n列表 18-7 显示了你如何从 `web.config` 文件内部指定某个个性化属性为这种复杂类型，例如\
  \ `ShoppingCart` 类型。\n\n就像基本数据类型存储在个性化数据存储中一样，这种构造使你能够轻松存储自定义类型，并以你选择的格式将其序列化到最终的数据存储中。在这种情况下，`ShoppingCart`\
  \ 对象被序列化为二进制对象并存到数据存储中。`serializeAs` 特性可以接受以下列表中定义的值：\n\n* `Binary`：将对象序列化并作为二进制数据存储在所选的数据存储中。\n\
  * `ProviderSpecific`：根据提供程序的方向存储对象。这简单意味着不再由个性化引擎确定对象的序列化，而是将序列化完全交给指定的个性化提供程序。\n\
  * `String`：默认设置。将个性化属性作为字符串存储在所选的数据存储中。\n* `XML`：在将对象存储到所选的数据存储之前，将其序列化为 XML 格式。\n\
  \n### 提供默认值\n\n除了定义个性化属性的数据类型外，你还可以直接在 `web.config` 文件中定义它们的默认值。默认情况下，你创建的个性化属性没有值，但你可以使用\
  \ `<add>` 元素的 `defaultValue` 特性轻松地更改。列表 18-8 显示了如何定义默认值。\n\n从这个示例中你可以看到只有一个个性化属性提供了默认值。最后一个个性化属性（在本示例中为\
  \ `Member`）被赋予了默认值 `false`。这意味着当你向个性化属性数据库添加新的终端用户时，`Member` 将被定义，而不是在系统中保持空值。\n\
  \n### 将个性化属性设为只读\n\n将个性化属性设为只读也是可能的。要做到这一点，只需向 `<add>` 元素添加 `readOnly` 特性：\n\n```xml\n\
  <add name=\"StartDate\" type=\"System.DateTime\" readOnly=\"true\" />\n```\n\n要使个性化属性成为只读属性，你需要将\
  \ `readOnly` 特性的值赋予 `true`。默认情况下，此属性被设置为 `false`。\n\n# 匿名个性化\n\nASP.NET 的一项强大功能允许匿名终端用户利用其提供的个性化功能。如果网站需要某种类型的注册，这将非常重要。例如，许多电子商务网站允许匿名终端用户在用户注册网站之前浏览网站购物并使用网站的购物车。\n\
  \n### 启用终端用户的匿名身份识别\n\n默认情况下，匿名个性化是关闭的，因为它在热门网站上会消耗数据库资源。因此，允许匿名个性化的要步骤之一是使用 `web.config`\
  \ 文件中的适当设置来开启此功能。你还必须对 `web.config` 文件中属性的定义方式进行一些更改，并确定你是否要为应用程序允许匿名个性化。\n\n如列表\
  \ 18-9 所示，你可以使用`<anonymousIdentification>` 元素开启匿名识别，以便个性化引擎识别未知的终端用户。\n\n要启用可能访问你应用程序的终端用户的匿名身份识别，需要在\
  \ `web.config` 文件的`<system.web>` 节点内添加 `<anonymousIdentification>` 元素。然后在 `<anonymousIdentification>`\
  \ 元素内部，使用 `enabled` 特性并将其设置为 `true`。记住，默认情况下该值为 `false`。\n\n当启用匿名身份识别时，ASP.NET 为每个访问应用程序的匿名用户使用唯一标识符。该标识符会随每个请求发送，但在终端用户通过\
  \ ASP.NET 身份验证后，该标识符会被移除。\n\n对于匿名用户，信息默认以 Cookie 的形式存储在终端机器上。额外的信息（为匿名用户启用的个性化属性）存储在服务器的数据存储中。\n\
  \n要查看匿名识别的使用，请关闭示例应用程序的 Windows 身份验证，并改用 Forms 身份验证。列表 18-10 展示了这一更改。\n\n配置此代码后，如果你运行早期列表\
  \ 18-2 中的页面，你会看到如列表 18-11 所示的头部。\n\n从此 HTTP 头部，你可以看到一个 Cookie `.ASPXANONYMOUS` 被设置为哈希值，以便\
  \ ASP.NET 个性化系统后续检索。\n\n#### 修改匿名身份识别的 Cookie 名称\n\nCookie 默认使用名称 `.ASPXANONYMOUS`。可以通过\
  \ `web.config` 文件中的 `<anonymousIdentification>` 元素使用 `cookieName` 特性更改此 Cookie 的名称，如列表\
  \ 18-12 所示。\n\n#### 修改 Cookie 的存储时长\n\n此外，默认情况下存储在终端机器上的 Cookie 存储时间为 100,000 分钟（约\
  \ 70 天）。如果你想更改此值，可以在此 `<anonymousIdentification>` 元素内使用 `cookieTimeout` 特性进行操作，如列表\
  \ 18-13 所示。\n\n\n\n\n\n在这种情况下，`cookieTimeout` 值被更改为 `1440` —— 意味着 1,440 分钟（或一天）。此设置对于购物车之类的场景是理想的，因为你不希望长时间保留终端用户的身份标识。\n\
  \n### 更改标识符的存储方式\n\n虽然匿名标识符是通过 Cookie 存储的，但你也可以轻松更改这种方法。到目前为止，Cookie 是实现识别的首选方式，但你也可以不用\
  \ Cookie。其他选项包括使用 URI 或设备配置文件。列表 18-14 显示了使用 URI 放置标识符的示例。\n\n除了 `UseUri$，其他选项包括\
  \ `UseCookies, AutoDetect` 和 `UseDeviceProfile`。以下列表回顾了每个选项：\n\n* `UseCookies`:\
  \ 该设置是默认值。如果不设置任何值，ASP.NET 会假设这就是该值。`UseCookies` 意味着在终端用户的机器上放置一个 Cookie 用于身份识别。\n\
  * `UseUri`: 此值意味着不会在终端用户的机器上存储 Cookie，而是将唯一标识符嵌入页面的 URL 中。虽然如果开发者希望避免在终端用户的机器上放置\
  \ Cookie，这种设置非常棒，但它会产生看起来奇怪的 URL，并且当终端用户签签页面以便后检索时可能会出现问题。\n* `AutoDetect`: 使用此值意味着你让\
  \ ASP.NET 引擎决定使用 Cookie 还是使用 URL 方法进行匿名识别。它是基于用户做出此决策的，性能不如前述两个选项，因为 ASP.NET 在决定使用哪种方法之前必须检查终端用户。我的建议是，只有在你绝对必须允许关闭\
  \ Cookie 的终端用户（这现在很罕见）时，才使用 `AutoDetect` 而不是 `UseUri`。\n* `UseDeviceProfile`: 为发起请求的设备或浏览器配置标识符。\n\
  \n### 查看存储的匿名标识符\n\nASP.NET 使用全局唯一标识符 (GUID) 来确保匿名标识符的唯一性。你也可以获取此唯一标识符供自己使用。要检索\
  \ GUID，`Request` 对象被增强了一个 `AnonymousID` 属性。`AnonymousID` 属性返回 `String` 类型的值，你可以像这里所示在代码中使用它：\n\
  \n```\nLabel1.Text = Request.AnonymousID\n```\n\n### 匿名识别的操作\n\n在处理匿名用户的创建时，请注意你可以从\
  \ `Global.asax` 文件用于管理该过程的重要事件：`AnonymousIdentification_Creating`。\n\n通过使用 `AnonymousIdentification_Creating`\
  \ 事件，你可以在身份识别发生时对其进行处理。例如，如果你不想使用 GUID 来唯一标识终端用户，你可以从此事件更改身份标识值。\n\n要这样做，请使用类型为\
  \ `AnonymousIdentificationEventArgs` 的事件委托程序创建事件，如 列表 18-15 所示。\n\n`AnonymousIdentificationEventArgs`\
  \ 事件委托程序暴露了一个 `AnonymousID` 属性，该属性分配用于唯一标识匿名用户的值。现在，不再使用 GUID 来唯一标识匿名用户如：\n\n```\n\
  d13fafec-244a-4d21-9137-b213236ebedb\n```\n\n而是在 `AnonymousIdentification_Creating`\
  \ 事件中将 `AnonymousID` 属性更改为\n\n```\nBubbles 12/31/2012 2:07:33 PM\n```\n\n### 个性属性的匿名选项\n\
  \n如果你尝试让匿名功能工作，你可能会收到 图 18-4 所示的错误。\n\n![image](img/f684-01.jpg)\n\n**图 18-4**\n\
  \n要让你的应用程序支持匿名用户，你必须指定为访问页面的匿名用户启用哪些个性化属性。你也可以通过 `web.config` 文件，通过在 `<properties>`\
  \ 部分内定义的属性的 `<add>` 元素添加 `allowAnonymous` 属性来实现（参见 列表 18-16）。\n\n在此示例中，通过将 `allowAnonymous`\
  \ 属性设置为 `true`，允许匿名用户使用 `LastVisited` 属性。由于该属性唯一支持匿名用户，其余定义的属性都不会为这些类型的用户存储信息。如果你仍在代码中检查用户是否已身份验证，请确保将其注释掉，以便这些示例生效。\n\
  \n### 关于匿名用户配置存储的警告\n\n考虑到目前为止关于匿名用户的所有内容，你应该非常小心处理匿名用户配置存储的方法。存储匿名用户的配置信息会大量填充你正在使用的数据存储。例如，在我的示例中，我微软的\
  \ SQL Server Express 版，并存储了一个已身份验证用户的配置信息，然后是单个匿名用户的配置信息。这会将这两个用户的信息都放入 `aspnet_Profile`\
  \ 和 `aspnet_Users` 表中。\n\n图 18-5 显示了 `aspnet_Users` 表列出的两个用户。\n\n![image](img/f685-01.jpg)\n\
  \n**图 18-5**\n\n在图中，匿名用户是 `aspnet_Users` 表中的第一行，你可以看到该用户有一个奇怪的名字，即 `AnonymousID`。这两个用户之间的另一个区别在于\
  \ `IsAnonymous` 列。匿名用户在该列的设置为 `true`，而身份验证用户设置为 `false`。由于你的数据库可能会很快充满匿名信息，你应该权衡存储哪些信息。\n\
  \n## 个性化的程序化访问\n\n当 ASP.NET 页面被调用时，ASP.NET 会通过继承 `ProfileBase` 类创建一个 `ProfileCommon`\
  \ 类，它使用该类来强类型化在 `web.config` 文件中定义的属性。这个创建的类用于处理用户配置，通过 `ProfileBase` 类的 `GetPropertyValue`\
  \ 和 `SetPropertyValue` 方法获取和设置属性。\n\n正如预期的，ASP.NET 提供了必要的钩子，通过 `ProfileModule` 类访问特定的\
  \ `Profile` 事件。`ProfileModule` 类是 ASP.NET 自己用于在页面 `Profile` 对象中创建和存储配置信息的。\n\n`ProfileModule`\
  \ 类暴露了三个你可以处理用户配置情况的事件。这些事件 —— `MigrateAnonymous、Personalize 和 ProfileAutoSaving`\
  \ 围绕身份验证领域。由于你刚刚学习了如何在应用程序中处理匿名用户，现在部分查看如何将这些用户从匿名用户迁移到身份验证用户，因为你可能还会迁移它们的配置属性。\n\
  \n### 迁移匿名用户\n\n在处理匿名用户时，你必须能够将匿名用户迁移到注册用户。例如，终端用户填写购物车后，可以在网站上注册以购买商品。在那个时刻，终端用户从匿名用户变为注册用户。\n\
  \n出于这个原因，ASP.NET 提供了一个 `Profile_MigrateAnonymous` 事件处理程序，允许你将匿名用户迁移到注册用户。`Profile_MigrateAnonymous`\
  \ 事件需要类型为 `ProfileMigrateEventArgs` 的数据类。你可以将其放置在处理迁移的页面中，或者放在 `Global.asax` 文件中（如果可以在应用程序任何地方可以使用）。列表\
  \ 18-17 显示了该事件的使用。\n\n\n\n\n\n在本示例中，你创建了一个 `ProfileCommon` 对象的实例，并用访问的匿名用户的个人资料对其进行填充。从那里，你可以使用该实例获取该匿名用户的所有个人资料属性，这意味着你随后可以通过从匿名用户个人资料信息到已身份用户个人资料系统的迁移，来填充一份个人资料。\n\
  \n代码列表 18-17 显示了如何将单个个性化属性从匿名用户迁移到新注册用户。除了迁移单个属性外，你还可以迁移来自个性化组的属性，如代码列表 18-18 所示。\n\
  \n在 `Global.asax` 文件中使用此事件，你可以在匿名用户注册到你的应用程序时，在逻辑上对他们进行迁移。迁移过程还允许你选择要迁移的项目，并根据需要更改其值。\n\
  \n### 个性化个人资料\n\n除了在 `Global.asax` 文件中处理匿名用户外，你还可以通过程序化的对从个性化存储器中检索到的个人资料进行个性化。你通过使用\
  \ `Profile_Personalize` 事件来实现这一点。代码列表 18-19 展示了该事件的一个用法示例。\n\n在这种情况下，根据特定参数（无论是夏令时间还是其他），你能够为用户分配特定的个人资料。你通过使用\
  \ `ProfileModule.Personalize` 事件来实现这一点，你通常会将其放置在 `Global.asax` 页面中。\n\n### 确定是否继续自动保存\n\
  \n当你使用由 ASP.NET 提供的个人资料功能时，页面会在页面执行结束时自动将个人资料值保存到指定的数据存储器。你可以通过使用 `web.config` 文件中\
  \ `<profile>` 节点下的 `automaticSaveEnabled` 属性将此功能设置为 `false`（该功能默认是开启的，即设置为 `true`），如代码列表\
  \ 18-20 所示。\n\n如果你将 `automaticSaveEnabled` 属性值设置为 `false`，则你必须手动调用 `ProfileBase.Save()`\
  \ 方法。不过在大多数情况下，你会将此设置保持为 `true`。在页面请求发出并完成后，会触发 `ProfileModule.ProfileAutoSaving`\
  \ 事件。你也可以处理此事件，如代码列表 18-21 所示。你会将此事件放在 `Global.asax` 文件中。\n\n在这种情况下，当 `Profile_ProfileAutoSaving`\
  \ 事件被触发时，你可以在此事件内工作并更改某些行为。代码列表 18-21 检查 `Profile.PaidDueStatus` 属性是否发生了变化。如果发生了变化，个人资料系统的自动保存功能将继续；如果\
  \ `Profile.PaidDueStatus` 没有变化，则关闭自动保存功能。\n\n### 在 Web 应用程序项目个人资料信息\n\n尽管访问个人资料属性非常方便，但默认情况下只有\
  \ ASP.NET Web 站点项目 (WSP) 支持此功能。然而，更常见的是 ASP.NET Web 项目 (WAP)。如果你在使用其中之一，则无法使用快捷方式访问个人资料属性。在处理\
  \ WSP 时，ASP.NET 会自动创建代理类来暴露所有个人资料属性；而 WAP 则并非如此。\n\n但是，有一种或或多简单的方法来模拟这种快捷访问：只需创建你自己的个人资料类。前\
  \ ASP.NET 团队成员 Jon Galloway 在其优秀的文章中提供了更多细节，请见 [`http://weblogs.asp.net/jgalloway/archive/2008/01/19/writing-a-custom-asp-net-profile-class.aspx`](http://weblogs.asp.net/jgalloway/archive/2008/01/19/writing-a-custom-asp-net-profile-class.aspx)，但这里是基本步骤。\n\
  \n首先，你需要创建一个派自 `ProfileBase` 的类。在这里，你为想要拥有的个人资料选项添加属性。通过使用 `SettingsAllowAnonymous`\
  \ 属性，还可以支持匿名访问。代码列表 18-22 显示了本章使用的简短版个人资料属性的示例实现。\n\n然后，你需要确保在 `web.config` 中个人资料属性来自你刚刚创建的类。代码列表\
  \ 18-23 所示的设置显示了如何这样做。\n\n最后，代码列表 18-19 显示的 API 提供了对个人资料属性的访问。\n\n## 个性化提供程序\n\n\
  如本章早些时候图 18-1 所示，个性化模型的中间个性化 API 层与系列默认数据提供程序通信。默认情况下，个性化模型使用 Microsoft SQL Server\
  \ Express 版文件来存储你定义的个性化属性。然而，你并不限于这种数据存储器。你还可以使用 Microsoft SQL Server 数据提供程序，使你能够处理\
  \ Microsoft SQL Server 7.0 或更高版本。除了 Microsoft SQL Server 数据提供程序外，架构还允许你创建自己的数据提供程序。\n\
  \n### 使用 SQL Server 版本\n\nMicrosoft SQL Server 数据提供程序允许你处理 SQL Server 版本的文件。SQL\
  \ Server 数据提供程序是个性化系统默认使用的。在使用 Visual Studio 2012 时，它会将 `ASPNETDB.MDF` 文件放置在 App_Data\
  \ 文件夹中。\n\n当你查看 `machine.config` 文件时，请处理个性化引擎如何与该数据库工作的章节。在 `LocalSqlServer` 的第一次引用中，你会找到指向该文件的连接字符串（如代码列表\
  \ 18-24 所示），位于 `<connectionStrings>` 部分中。\n\n在此示例中，你定义了一个名为 `LocalSqlServer` 的连接字符串。由\
  \ `connectionString` 属性指定的文件位置指向相对路径。这意味着构建的每个使用个性化功能的应用程序中，默认 SQL 提供程序应位于应用程序的\
  \ App_Data 文件夹中，并名为 `ASPNETDB.MDF`。\n\nSQL Server Express 文件的连接字符串通过 `<connectionStrings>`\
  \ 部分中的 `LocalSqlServer` 声明指定。你可以在 `machine.config` 文件的 `<profile>` 部分中看到个性化引擎对它的引用。`<profile>`\
  \ 部分包含列出个性化引擎可用提供程序的子部分，如代码列表 18-25 所示。\n\n从这里，你可以通过使用 `<add>` 元素添加提供程序。在此元素中，`connectionStringName`\
  \ 属性指向代码列表 18-24 中 `connectionString` 属性所声明的内容。\n\n你可以指定一个与 `machine.config` 文件中指定的完全不同的\
  \ Microsoft SQL Server Express 版文件。创建一个指向 `ASPNETDB.MDF` 文件模板版本的新 SQL Server Express\
  \ 文件的连接字符串。此时，你可以使用 `<connectionString>` 指向此新文件。如果你在 `machine.config` 文件中更改这些值，服务器上的所有的\
  \ ASP.NET 应用程序都将使用指定的文件。如果你仅对 `web.config` 文件进行更改，则只有使用此特定 `web.config` 文件的应用程序才会使用此新的数据存储器。\n\
  \n\n\n\n你可能会发现使用 SQL Server Express 文件进行个性化框架的工作非常简单。但当你处理对性能和可靠性有要求的大型应用程序时，你应该使用从\
  \ SQL Server 7.0 版本开始的 SQL Server 个性化提供程序（包括 2000、2005、2008 和 2012）。如果此数据存储可用，你应该始终尝试使用此选项，而不是默认的\
  \ SQL Server Express 版文件。\n\n如果你像前面说明的那样使用 SQL Server Express 文件操作过 SQL Server 个性化提供程序，你可能发现它很好用。个性化提供程序是开箱即用的，无需你进行任何设置或配置。然而，在完整版\
  \ SQL Server 中使用个性化提供程序则是另一回事。虽然操作起来并不困难，但在使用之前，你必须设置并配置你的 SQL Server。\n\nASP.NET\
  \ 4.5 提供了几种方法为个性化框架设置和配置 SQL Server。一种方法是通过 ASP.NET SQL Server 设置向导，另一种方法是运行随 .NET\
  \ Framework 4.5 提供的某些 SQL Server 脚本。\n\n要使用 ASP.NET SQL Server 设置向导为 ASP.NET 4.5\
  \ 个性化功能设置 SQL Server，请通过 Visual Studio 2012 命令提示符调用 `aspnet_regsql.exe` 工具。在提示符处输入\
  \ `aspnet_regsql.exe` 以打开 ASP.NET SQL Server 设置向导的 GUI。如果你按照向导操作，可以为许多 ASP.NET 系统（如个性化系统）设置你的\
  \ SQL Server 实例。\n\n### 使用 SQL 脚本安装个性化功能\n\n为个性化框架设置和配置 SQL Server 的另一种方法是使用这些工具和向导使用的相同\
  \ SQL 脚本。如果你查看 `C:\\WINDOWS\\Microsoft.NET\\Framework\\v4.0.xxxxx\\`，从此位置可以看到安装和删除脚本——`InstallPersonalization.sql`\
  \ 和 `UninstallPersonalization.sql`。运行这些脚本将为数据库提供运行个性化框架所需的表。请注意，在运行个性化脚本（或任何其他新的\
  \ ASP.NET 系统脚本）之前，你必须运行 `InstallCommon.sql` 脚本。\n\n### 配置 SQL Server 提供程序\n\n在为个性化系统设置好\
  \ SQL Server 数据库后，下一步是重新定义个性化提供程序，使其与此实例配合（而不是与默认的 Microsoft SQL Server Express\
  \ 版文件）。\n\n你可以在应用程序的 `web.config` 文件完成此步骤。在这里，你需要配置提供程序，然后将此提供程序实例定义为要使用的提供程序。列表\
  \ 18-26 显示了这些新增以及 `web.config` 文件中扩展的 `<profile>` 部分。\n\n你对此配置定义的最重大更改是使用 `defaultProvider`\
  \ 属性，其值是你想要使用的提供程序的名称——在这种情况下，是新创建的 SQL Server 提供程序 `AspNetSql2012ProfileProvider`。你也可以通过更改\
  \ `<profile>` 元素对 `machine.config` 文件进行此更改，如列表 18-27 所示。\n\n此更改强制位于此服务器上的每个应用程序都使用这个新的\
  \ SQL Server 提供程序，而不是默认的 SQL Server 提供程序（除非应用程序的 `web.config` 文件中覆盖了此命令）。\n\n###\
  \ 使用多个提供程序\n\n你不局限于使用单个数据存储或提供程序。相反，你可以使用任意数量的提供程序。甚至可以为定义的每个属性指定个性化提供程序。这意味着你可以对大多数属性使用默认提供程序，同时允许其中少数属性使用完全不同的提供程序（见列表\
  \ 18-28）。\n\n从此示例中你可以指定了一个默认提供程序——`AspNetSqlProvider`。除非指定其他提供程序，否则将使用此提供程序。更改此设置的唯一属性是\
  \ `Member` 属性。`Member` 属性使用了完全不同的个性化提供程序。在这种情况下，它通过 `<add>` 元素的 `provider` 属性使用了\
  \ Access 提供程序（`AspNetSql2012ProfileProvider`）。通过此属性，你可以为定义的每个属性指定特定的提供程序。\n\n###\
  \ 使用通用提供程序\n\nASP.NET 4.5 的配置功能与 Microsoft SQL Server 绑定。准确来说，是配置提供程序具有这种依赖关系。为了让\
  \ API 更加灵活并更容易与其他数据库系统配合，微软提供了所谓的“通用提供程序”（Universal Providers）。遗憾的是，它们不是 ASP.NET\
  \ 标准分发的一部分，而是作为 NuGet 上的独立包可用。该包名称为 `Microsoft.AspNet.Providers`（注意：该包的旧版本称为 `System.Web.Providers`），NuGet\
  \ 包主页地址为 [`http://nuget.org/packages/Microsoft.AspNet.Providers`](http://nuget.org/packages/Microsoft.AspNet.Providers)。当你从\
  \ Visual Studio 内部启动 NuGet 包管理器（使用工具 -> 包管理器 -> 包管理器控制台）时，可以通过执行以下命令将包安装到当前项目：\n\
  \n```\nInstall-Package Microsoft.AspNet.Providers\n```\n\n图 18-6 显示了典型的控制台输出。之后，`System.Web.Providers.dll`\
  \ 程序集成为你项目的一部分。\n\n要实际使用新程序集，你再次需要通过 `web.config` 配置 ASP.NET。技巧是使用定义在 `System.Web.Providers`\
  \ 程序集中的程序，以便 ASP.NET 可以获取数据并与任何数据库工作。支持的数据库列表专注于微软的 Azure 产品，但以后可能会添加更多数据库。列表 18-29\
  \ 显示了一个示例配置。\n\n## 管理应用程序配置\n\n当你将使用配置 ASP.NET 应用程序投入生产时，你会很快发现需要一种方法来管理应用程序生命周期内的所有配置信息。当你查看\
  \ ASP.NET MMC 节点或 ASP.NET 网站管理工具时，请注意，这些工具都没有提供删除特定用户配置信息的方法，甚至无法清理一段时间未活跃用户的配置信息数据库。\n\
  \nASP.NET 4.5 提供了使用 `ProfileManager` 类来管理应用程序存储的配置信息的方法。\n\n你可以使用 `ProfileManager`\
  \ 类构建管理功能，以完全管理存储的配置信息。除了访问属性值（例如个性化系统使用的提供程序名称或相关应用程序的名称）外，你还可以使用 `ProfileManager`\
  \ 类中的大量方法获取有关用户配置的所有其他信息。通过 `ProfileManager` 类，你还可以对这些存储的配置信息执行操作，包括清理旧的配置信息数据库。\n\
  \n### ProfileManager 类的属性\n\n表 18-1 详细列出了 `ProfileManager` 类的属性。\n\n| **属性** | **描述**\
  \ |\n| --- | --- |\n| `ApplicationName` | 获取或设置要操作的应用程序名称 |\n\n\n\n\n| `AutomaticSaveEnabled`\
  \ | 说明 |\n| :--- | :--- |\n| `AutomaticSaveEnabled` | 获取或设置一个布尔值，指示是否在页面执行结束时存储个人资料信息\
  \ |\n| `Enabled` | 获取或设置一个布尔值，指示应用程序是否能够使用个性化系统 |\n| `Provider` | 获取用于个性化系统的提供者名称\
  \ |\n| `Providers` | 获取 ASP.NET 应用程序可用的所有提供者的集合 |\n\n表 18-1\n\n你可以看到，这些属性包含了一些关于个性化系统以及其可用的提供者的信息，你可以将这些信息集成到你构建的任何管理系统中。接下来的，本章将介绍\
  \ `ProfileManager` 类可用的方法。\n\n## ProfileManager 类的方法\n\n`ProfileManager` 类提供了许多方法，帮助你管理应用程序用户的个人资料。表\
  \ 18-2 简要描述了这些方法。\n\n| 方法 | 说明 |\n| :--- | :--- |\n| `DeleteInactiveProfiles` |\
  \ 允许你删除在指定时间段内没有任何活动的个人资料 |\n| `DeleteProfile` | 允许你删除一个特定的个人资料 |\n| `DeleteProfiles`\
  \ | 允许你删除一个个人资料集合 |\n| `FindInactiveProfilesBy UserName` | 根据指定日期，提供特定用户名下所有非活跃的个人资料\
  \ |\n| `FindProfilesByUserName` | 提供来自特定用户名的所有个人资料 |\n| `GetAllInactiveProfiles`\
  \ | 提供自指定日期以来一直未活跃的所有个人资料 |\n| `GetAllProfiles` | 提供所有个人资料的集合 |\n| `GetNumberOf\
  \ InactiveProfiles` | 提供自指定日期以来非活跃个人资料的数量 |\n| `GetNumberOfProfiles` | 提供系统内所有个人资料的总数\
  \ |\n\n表 18-2\n\n从这个方法列表中可以看出，你可以进行大量工作来管理存储在数据库中的个人资料信息。\n\n接下来的，本章将介绍如何为你的 ASP.NET\
  \ 应用程序构建个人资料管理器管理页面。此示例将其作为 ASP.NET 页面构建，但你也可以同样容易地将其构建为控制台应用程序。\n\n## 构建个人资料管理器页面\n\
  \n要为你的应用程序创建一个简单的个人资料管理器，请在应用程序中创建一个单 ASP.NET 页面，并使用列表 18-30 中的代码。你使用此页面来管理存储在该特定应用程序数据库中的个人资料。\n\
  \n此页面包含许多控件，但最重要的是一个 `DropDownList` 控件，它包含了数据库中具有个人资料信息的所有实体的用户名。根据你对应用程序进行的操作，你可能会多次看到同一个用户名。请记住，单个用户在数据库中可以有多个个人资料。\n\
  \n使用 `DropDownList` 控件，你可以选择一个用户并查看存储在你数据存储中的他的个人资料信息。从此页面，你还可以删除他的个人资料信息。实际上，你可以使用\
  \ `ProfileManager` 类执行许多操作，但这是某些基本操作的良好示例。\n\n列表 18-30 展示了个人资料管理器的代码。\n\n## 查看个人资料管理器页面的代码\n\
  \n在你查看个人资料管理器页面代码时，请注意 `ProfileManager` 类用于执行一些不同的操作。\n\n`ProfileManager` 类的 `GetAllProfiles()`\
  \ 方法用于填充页面上的 `DropDownList` 控件。以下是该方法的构造函数：\n\n```\n GetAllProfiles(\n  authenticationOption,\n\
  \  pageIndex,\n  pageSize,\n  totalRecords)\n```\n\n`GetAllProfiles()` 方法接收多个参数，其中第一个参数允许你定义是使用此方法处理系统中的所有个人资料，还是仅处理系统中的匿名或已验证用户的个人资料。在这个示例中，所有个人资料都通过此方法检索。这是通过使用\
  \ `ProfileAuthenticationOption` 枚举实现的。然后，`GetAllProfiles()` 方法的其他参数要求指定页索引和从数据库中检索的记录数。这里没有“获取所有”的选项（因为可能检索的数据规模可能巨大）；因此，在示例中，你指定了第一页数据（使用\
  \ `0`），并且该页包含前 10,000 条记录（这对于此应用程序基本上就是获取所有）。`GetAllProfiles()` 方法的最后一个参数允许你检索记录计数，如果你想在应用程序的任何地方使用它，或者如果你想使用该数字遍历记录。个人资料管理器页面使用此数字显示在\
  \ `Label1` 服务器控件中。\n\n从 `GetAllProfiles()` 方法返回时，你得到一个 `ProfileInfoCollection` 对象，它是\
  \ `ProfileInfo` 对象的集合。遍历 `ProfileInfoCollection` 中的所有 `ProfileInfo` 对象可以让你提取出某个特定用户个人资料信息的一些主要属性。在示例中，仅使用\
  \ `ProfileInfo` 对象的 `UserName` 属性来填充页面上的 `DropDownList` 控件。\n\n当最终用户从下拉列表中选择一个用户时，将使用\
  \ `FindProfilesByUserName()` 方法来显示所选用户的个人资料。同样，该方法也会返回一个 `ProfileInfoCollection`\
  \ 对象。\n\n要删除所选用户的个人资料，使用 `DeleteProfile()` 方法并传入该用户的用户名，如下所示：\n\n```\n DeleteProfile(DropDownList1.Text)\n\
  ```\n\n\n\n\n\nASP.NET 4.5 提供的个性化功能让你能够轻松地为所有终端用户创建唯一的 Web 应用，无论他们是匿名用户还是用户。该系统允许你存储从\
  \ .NET Framework 提供的基本数据类型到你创建的自定义类型的所有内容。该系统比使用 `Session` 或 `Application` 对象更具通用性和扩展性。数据通过\
  \ ASP.NET 随附的几个内置个性化提供程序进行存储。这些提供程序包括连接 Microsoft SQL Server Express 版文件或 Microsoft\
  \ SQL Server 的提供程序。\n\n你还可以使用 `ProfileManager` 类来管理系统的个人资料信息。这包括根据你的需要监控和删除个人资料的能力。\n\
  \n# 19 成员身份与角色管理\n\n## 本章内容概览\n\n- 管理 ASP.NET 4.5 身份验证与授权\n- 添加和管理角色\n- 使用 ASP.NET\
  \ 登录服务器控件\n- 创建自定义注册流程\n- 审核成员身份和角色 API 以及使用它们的控件\n- 集成 OAuth/OpenID 身份验证\n\n##\
  \ 本章的 WROX.COM 代码下载\n\n请注意，本章中的所有代码示例均可在书籍网站 [`www.wrox.com`](http://www.wrox.com)\
  \ 的“Download Code”选项卡中作为本章代码下载的一部分。\n\n用户身份验证和授权是许多网站和基于浏览器的应用程序的重要功能。传统上，在处理 Microsoft\
  \ Windows Forms 应用程序（客户端）时，依赖 Windows 集成验证（Windows Integrated Authentication）；在处理基于浏览器的应用程序（客户端）时，你使用表单验证（forms\
  \ authentication）。\n\n表单验证允许你获取尚未验证的请求，并通过 HTTP 客户端侧重定向将其重定向到 HTML 表单。用户提供其登录信息并提交表单。在应用程序验证请求后，用户将接收到一个\
  \ HTTP cookie，该 cookie 将被用于任何后续请求。这种身份验证在许多方面都是可行的，但它要求开发者构建每一个元素，甚至要管理整个系统的后端机制。这项任务对许多开发者来说是艰巨的，而且在大多数情况下，它非常耗时。\n\
  \nASP.NET 4.5 包含一个身份验证和授权管理服务，负责处理访问你的 Web 页面或应用程序的用户登录、身份验证、授权和管理。这一卓越的成员和角色管理服务是一个易于实现的框架，它使用\
  \ Microsoft SQL Server 作为后端数据存储即可开箱即用。该框架还包含一个 API，允许通过编程方式访问成员身份和角色管理服务的功能。此外，许多关注成员身份和角色管理的服务器控件使得创建包含这些服务提供的所有功能的\
  \ Web 应用变得简单。\n\n在查看 ASP.NET 4.5 的成员身份和角色管理功能之前，理解身份验证和授权的基本原理至关重要。以下是简要回顾：\n\n\
  - `Authentication`（身份验证）是一个确定用户身份的过程。在用户通过身份验证后，开发者可以确定被识别的用户是否有权限继续。在没有应用身份验证过程的情况下为实体授予授权是不可能的。在\
  \ ASP.NET 4.5 中，你使用成员服务来提供身份验证。\n- `Authorization`（授权）是确定已验证的用户是否允许访问应用程序的任何部分、应用程序的特定点，或仅访问应用程序提供的特定数据集的过程。当你对用户或组进行验证和授权时，你可以根据用户类型或偏好自定义网站。在\
  \ ASP.NET 4.5 中，你使用角色管理服务提供授权。\n\n## ASP.NET 4.5 身份验证\n\nASP.NET 4.5 提供了成员管理服务来处理用户访问页面或整个网站的身份验证。ASP.NET\
  \ 管理服务不仅提供用于管理用户的 API set，还提供了一些服务器控件，这些控件反过来与该 API 配合。这些服务器控件通过身份验证过程与终端用户交互。稍后我们将查看这些控件的功能。\n\
  \n### 为你的网站设置成员身份\n\n在使用由 ASP.NET 4.5 提供的安全控件之前，你必须先设置你的应用程序以与成员服务配合。具体方法取决于你如何处理提供的安全框架。\n\
  \n在 Visual Studio 2010 及其之前的版本中，内置的 `SqlMembershipProvider` 实例用于存储你应用程序注册用户的详情。Visual\
  \ Studio 2012 的 ASP.NET MVC 模板默认使用新的 `DefaultMembershipProvider`，但 ASP.NET Web Forms\
  \ 模板仍使用 `SqlMembershipProvider`。从 API 的角度来看，本章中使用哪种提供程序并不重要。\n\n对于初始演示，本章中的示例与基于表单的验证配合。你可以假设这些示例中的应用程序都运行在公共互联网上，因此向公众开放注册和查看。如果是基于内网的应用程序（意味着所有用户都在私有网络上），你可以使用\
  \ Windows 集成验证来验证用户。\n\nASP.NET 4.5 如你所知，提供了一种数据提供程序模型，处理与多种类型的底层数据存储交互时所需的详细管理。图\
  \ 19-1 显示了 ASP.NET 4.5 成员服务的图。\n\n![image](img/f703-01.jpg)\n\n**图 19-1**\n\n从图中可以看出，与其它\
  \ ASP.NET 提供程序模型一样，成员身份提供程序可以访问各种底层数据存储。在图中，你可以看到内置的 Microsoft SQL Server 数据存储。你也可以构建自己的成员提供程序以访问任何其他自定义数据存储。在图中成员提供程序的上方，你可以看到一组关注安全的服务器控件，这些控件利用底层成员提供程序授予的权限来与身份验证过程中的用户交互。\n\
  \n### 在 web.config 文件中添加 <authentication> 元素\n\n为了让你 Web 应用程序中的表单验证元素与成员服务配合，第一步是在\
  \ `web.config` 文件中开启表单验证。要这样做，请创建一个 `web.config` 文件（如果你的应用程序中还没有）。接下来，将列表 19-1 所示的内容添加到该文件中。\n\
  \n简单地在 `web.config` 中添加 `<authentication>` 元素即可开启使用 ASP.NET 4.5 提供的成员服务所需的所有功能。要使用此元素开启表单验证，只需为\
  \ `mode` 属性赋值 `Forms`。这是一个表单验证示例，但 `mode` 属性的其他可能值包括 `Windows、Passport` 或 `None`。\n\
  \nIIS 身份验证方案包括基本、摘要和集成 Windows 验证。Passport 身份验证指向 Microsoft 提供的中心化服务，为任何成员站点提供单一登录和核心个人资料服务。使用\
  \ Passport 需要付费，且该服务已被微软弃用。\n\n\n\n\n\n由于此示例中的 `mode` 属性被设置为 `Forms`，你可以继续进行下一步，将用户添加到数据存储中。此时，你也可以通过对\
  \ `web.config` 文件进行一些修改来更改表单身份验证系统的行为。接文中将介绍这些可能性。\n\n## 在 web.config 文件中添加 <forms>\
  \ 元素\n\n使用表单身份验证，你可以根据用户在 Web 表单中输入的凭据为其提供访问站点或内容的权限。当终端用户尝试访问网站时，他正在使用匿名验证进入站点，这是默认的身份验证模式。如果发现用户是匿名的，则（由\
  \ ASP.NET）将其重定向到指定的登录页面。在终端用户输入正确的登录信息并通过身份验证过程后，系统将提供一个 HTTP Cookie，该 Cookie 可用于任何后续请求。\n\
  \n你可以通过在 `web.config` 文件的 `<forms>` 部分定义该行为来修改基于表单的身份验证的行为。你可以在列表 19-2 中查看表单身份验证设置的各种，该列表显示了\
  \ `web.config` 文件中 `<forms>` 部分的可能更改。\n\n你可以根据需要设置这些值，并且对于显示之外的值，你还有许多选项。此外，如前所述，这些值并不是必须的。你只需使用列表\
  \ 19-1 中所示的配置即可立即使用成员服务。\n\n然而，你可以在列表 19-2 中找到一些有趣的设置。通过向 `web.config` 文件添加此 `<forms>`\
  \ 元素，你可以真正改变表单身份验证系统的行为。但是，如果这样做，请确保 `<forms>` 元素嵌套在 `<authentication>` 元素内部。列表描述了\
  \ `<forms>` 元素的可能的属性：\n\n*   `name`: 定义用于身份验证后发送给终端用户的 Cookie 名称。默认情况下，此 Cookie\
  \ 的名称为 `.ASPXAUTH`。\n*   `loginUrl`: 指定如果没有找到有效的身份验证 Cookie（`.ASPXAUTH` 或其他），则将\
  \ HTTP 请求重定向到用户登录的页面位置。默认设置为 `Login.aspx`。\n*   `protection`: 指定你希望对身份验证后存储在终端用户机器上的\
  \ Cookie 采用的保护程度。可能的设置包括 `All, None, Encryption` 和 `Validation`。你应该始终尝试使用 `All`。\n\
  *   `timeout`: 定义 Cookie 过期后的时间（分钟）。默认值为 30 分钟。\n*   `path`: 指定应用程序颁发的 Cookie 路径。\n\
  *   `requireSSL`: 定义你是否要求凭据通过加密通道（SSL）而不是明文发送。\n*   `slidingExpiration`: 指定 Cookie\
  \ 的超时时间是否基于滑动刻度。默认值为 `true`。这意味着在向应用程序发出最后一次请求后的 30 分钟内（或 `timeout` 属性中指定的时间）之前，终端用户的\
  \ Cookie 不会过期。如果将 `slidingExpiration` 属性的值设置为 `false`，则 Cookie 将从第一次请求开始 30 分钟后过期。\n\
  *   `cookieless`: 指定 ASP.NET 如何处理 Cookie。可能的值包括 `UseDeviceProfile, UseCookies, AutoDetect`\
  \ 和 `UseUri`。默认值为 `UseDeviceProfile`。该值根据设备的用户代理程序检测是否使用 Cookie。`UseCookies` 要求所有请求都具有存储在\
  \ Cookie 中的凭据。`AutoDetect` 自动确定详情是存储在客户端的 Cookie 中还是在 URI 中（它通过先发送测试 Cookie 来实现）。最后，`UseUri`\
  \ 强制 ASP.NET 在所有实例中将详情存储在 URI 中。\n\n现在表单身份验证已开启，下一步是将用户添加到 Microsoft SQL Server\
  \ Express 版数据存储 `ASPNETDB.mdf` 中。\n\n## 添加用户\n\n要向成员服务添加用户，你可以将用户注册到 Microsoft SQL\
  \ Server Express 版数据存储中。你可能会提出的第一个问题是：“这个数据存储在哪里？”\n\n用于成员系统的 Microsoft SQL Server\
  \ 提供程序可以使用一个专门为成员服务（以及其他 ASP.NET 系统，如角色管理系统）构建的 SQL Server Express 版文件。如果相应的文件尚不存在，ASP.NET\
  \ 设置为自动为你创建此特定文件。要创建 `ASPNETDB.mdf` 文件，你需要利用使用成员服务某个方面的 ASP.NET 服务器控件。当应用程序需要 `ASPNETDB.mdf`\
  \ 文件时，ASP.NET 会代表你在 `App_Data` 文件夹中创建此文件。\n\n数据存储就绪后，就可以开始向数据存储中添加用户了。\n\n### 使用\
  \ CreateUserWizard 服务器控件\n\n`CreateUserWizard` 服务器控件是可以与成员服务配合使用的控件之一。你可以在 Visual\
  \ Studio 2012 工具箱的登录部分找到此控件以及在本章提到的其他控件。`CreateUserWizard` 控件允许你将注册的用户插入你的数据存储中以便稍后检索。如果你的应用程序中的页面允许终端用户注册你的站点，你至少希望从用户处检索登录名和密码，并将这些值放入数据存储中。这使得终端用户以后可以访问这些项目并使用成员系统登录应用程序。\n\
  \n为了让你的工作尽可能简单，`CreateUserWizard` 控件将代表你处理注册工作。列表 19-3 显示了该控件的简单用法。\n\n此页面仅使用 `CreateUserWizard`\
  \ 控件，没有其他。这一个控件允许你为 Web 应用程序注册终端用户。\n\n```\n<asp:CreateUserWizard ID=\"CreateUserWizard1\"\
  \ Runat=\"server\">\n</asp:CreateUserWizard>\n```\n\n运行此代码后，用户将看到图 19-2 所示的表单。\n\
  \n![image](img/f706-01.jpg)\n\n**图 19-2**\n\n此截图显示了终端用户填写后的表单，包含了诸如用户名、密码、电子邮件地址以及安全问题与答案等信息。点击“创建用户”按钮会将定义的用户信息放入数据存储中。\n\
  \n通过此控件提供的用户名和密码允许终端用户以后通过登录服务器控件登录应用程序。CreateUser 服务器控件表单中还包含一个“确认密码”文本框，以确保提供的密码拼写正确。表单还包含一个电子邮件文本框（以防用户以后忘记登录凭据并希望通过接收凭据）。最后，安全问题和答案用于在通过浏览器更改或以后提供任何凭据或用户信息之前验证终端用户的身份。\n\
  \n用户点击此表单上的“创建用户”按钮后，将出现对存储信息的确认（参见图 19-3）。\n\n![image](img/f707-01.jpg)\n\n**图\
  \ 19-3**\n\n\n\n\n\n现在既然你已经使用 `CreateUserWizard` 控件将用户添加到成员服务中，请查看这些信息的存储位置。如果你使用\
  \ Visual Studio 创建了用于存储用户信息的 Microsoft SQL Server Express 版文件，该文件会在运行上一个示例时创建，并且你已经按照前面的图示完成了表单操作。当示例运行并完成后，你可以点击\
  \ `Solution Explorer` 中的 `Refresh` 按钮来找到 `ASPNETDB.mdf` 文件，该文件位于项目的 `App_Data` 文件夹中。文件中包含许多不同的表，但你只对\
  \ `aspnet_Membership` 表感兴趣。\n\n当你打开 `aspnet_Membership` 表时（通过在 `Server Explorer`\
  \ 中右键单击该表并选择 `Show Table Data`），你输入的用户已在系统中，如图 19-4 所示。\n\n![image](img/f708-01.jpg)\n\
  \n**图 19-4**\n\n此表中的用户密码不是以明文形式存储的；而是经过哈希（hashed）处理，这是一种无法轻易反向的单向加密形式。当用户登录使用 ASP.NET\
  \ 4.5 成员服务的应用程序时，其密码会立即被哈希处理，然后与数据库存储的哈希密码进行比较。如果两个哈希字符串不匹配，则认为密码不匹配。存储明文密码被认为是一种安全风险，因此在不权衡相关风险的情况下，你不应该永远这样做。\n\
  \n关于 ASP.NET 4.5 中使用的密码的说明：如果你因为密码错误而难以输入用户，可能是因为 ASP.NET 默认要求强密码。输入到系统的所有密码必须至少包含七个字符，并包含至少一个非字母数字字符（如\
  \ `[`、`]`、`!`、`@`、`#` 或 `$`）。这种组合的示例密码是：\n\n```\n$h@rd#2#cr@ck!\n```\n\n虽然这种密码要安全得多，但这种密码有时很难记忆。你实际上可以通过重新重写\
  \ `web.config` 文件中的成员提供程序来更改其行为，使其不再需要如此复杂的密码，如代码列表 19-4 所示。然而，请注意，这也会方便攻击者猜测密码。\n\
  \n此示例显示了针对 SQL Server 重新写的成员提供程序，它不需要任何非字母数字字符，并允许长度低至三位的密码。你通过使用 `minRequiredNonalphanumericCharacters`\
  \ 和 `minRequiredPasswordLength` 属性来实现这一点。设置这些属性后，你现在就可以按照这些配置设置密码规则创建用户。修改成员提供程序将在在本章后面的部分进行详细介绍。\n\
  \n### 使用 CreateUserWizard 控件\n\n在操作 `CreateUserWizard` 控件时，请注意 `ContinueButtonClick()`\
  \ 和 `CreatedUser()` 事件。当用户成功创建后，点击第二页上的 `Continue` 按钮时，会触发 `ContinueButtonClick()`\
  \ 事件（参见代码列表 19-5）（注意 代码列表 19-5 和 19-6 是无法在系统上运行的示例代码）。\n\n按照你的意愿创建步骤后，你可以使用 `CreateUserWizard`\
  \ 控件的 `CreatedUser()` 事件存储自定义属性：\n\n```\nprotected void CreateUserWizard1_CreatedUser(object\
  \ sender, EventArgs e)\n    {\n      ProfileCommon pc = new ProfileCommon();\n \
  \     pc.Initialize(CreateUserWizard1.UserName.ToString(), true);\n      pc.FirstName\
  \ = Firstname.Text;\n      pc.LastName = Lastname.Text;\n      pc.Age = Age.Text;\n\
  \      pc.Save();\n    }\n```\n\n### 在注册过程中结合个性化\n\n你并不限于设置单独的步骤来询问个人信息；你可以将这些项目直接整合到\
  \ `asp:CreateUserStepStep` 步骤本身。实现此点的简单方法是切换到页的设计视图并调出 `CreateUserWizard` 控件的智能标签。然后点击\
  \ `Customize Create User Step` 链接（如图 19-5](#Chapter19.xhtml_figure19-5)所示）。\n\n\
  你可以使用 `<WizardSteps>` 元素在 `CreateUserWizard` 中定义自定义步骤。在该元素内部，你可以按照你喜欢的方式构建一系列注册步骤。从代码列表\
  \ 19-8 所示的 `<WizardSteps>` 部分，你可以看到定义了三个步骤。第一个是自定义步骤，使用 `asp:WizardStep` 控件请求终端用户的个性化属性。在\
  \ `asp:WizardStep` 控件内部，布局了一个表格并创建了一个自定义表单。\n\n在代码列表 19-8 中还定义了两个步骤：创建一个用户的步骤（使用\
  \ `asp:CreateUserStep` 控件）和一个确认新用户创建的步骤（使用 `asp:CompleteWizardStep` 控件）。这些步骤出现的顺序就是它们呈现给终端用户的顺序。\n\
  \n\n\n\n\n点击 `Create User Step` 链接将在一个新的 `<ContentTemplate>` 部分详细说明该特定步骤的内容，该部分现在包含在\
  \ `<asp:CreateUserWizardStep>` 控件中。在 `<ContentTemplate>`元素中，你可以看到用于创建新用户的完整默认表单。此时，你可以自由通过添加自己的部分（以请求终端用户的个人信息）来更改表单。你也可以从此详细表单中删除项目。例如，如果你不想询问安全问题和答案，可以从表单中删除这两个项目（请记住，你必须在成员提供程序的定义中禁用问题与答的要求）。通过更改此默认表单，你可以完全为你的终端用户自定义注册过程（请参见\
  \ 图 19-6）。\n\n![image](img/f713-02.jpg)\n\n图 19-6\n\n#### 以程序化方式添加用户\n\n你并不局限于仅使用服务器控件来注册或向成员服务添加新用户。ASP.NET\
  \ 4.5 提供了一个 Membership API 用于以程序化的方式执行此任务。此功能对于创建你自己的向服务添加用户的机制非常理想——或者你正在修改一个使用\
  \ ASP.NET 1.0/1.1 创建的 Web 。\n\nMembership API 包含用于向服务添加用户的 `CreateUser()` 方法。`CreateUser()`\
  \ 方法包含四种可能的签名：\n\n```\nMembership.CreateUser(username As String, password As String)\n\
  \      Membership.CreateUser(username As String, password As String,\n  email As\
  \ String)\n      Membership.CreateUser(username As String, password As String,\n\
  \  email As String, passwordQuestion As String,\n  passwordAnswer As String, isApproved\
  \ As Boolean,\n    ByRef status As System.Web.Security.MembershipCreateStatus)\n\
  \      Membership.CreateUser(username As String, password As String,\n  email As\
  \ String, passwordQuestion As String,\n  passwordAnswer As String, isApproved As\
  \ Boolean, providerUserKey As Object\n    ByRef status As System.Web.Security.MembershipCreateStatus)\n\
  ```\n\n你可以使用此方法来创建用户。该方法的用处在于，你不需要创建 `Membership` 类的实例；而是直接使用它。列表 19-9 显示了 `CreateUser()`\
  \ 方法的简单用法。（先不要运行列表，但请继续阅读以了解更多前提条件。）\n\n因此，请使用 `CreateUserWizard` 控件或 Membership\
  \ API 中的 `CreateUser()` 方法来轻松地为你的 Web 应用程序创建用户。\n\n从这段代码中可以看出，如果在使用 `CreateUser()`\
  \ 方法创建用户时发生问题，将抛出 `MembershipCreateUserException`。在这个示例中，我们故意触发了一个异常（因为配置要求我们必须有一个安全问题和答案），并且此异常被写入到\
  \ Label 服务器控件的屏幕上。以下是一个写入屏幕的异常示例：\n\n```\n Error: System.Web.Security.MembershipCreateUserException:\
  \ The password-answer\n  supplied is invalid. at System.Web.Security.Membership.CreateUser(String\
  \ username,\n  String password, String email) at System.Web.Security.Membership.CreateUser(String\n\
  \  username, String password) at ASP.default_aspx.Button1_Click(Object sender,\n\
  \  EventArgs e) in c:\\Documents and Settings\\Christian\\My Documents\\Visual Studio\n\
  \  2012\\WebSites\\Wrox\\Default.aspx:line 10\n```\n\n你可能不想将此类详细信息发送给终端用户。你可能更希望返回一个更简单的消息给终端用户，类似于如下结构：\n\
  \n```\nLabel1.Text = \"Error: \" + ex.Message.ToString();\n```\n\n这将为你提供如下简单的结果：\n\
  \n```\n Error: The password-answer supplied is invalid.\n```\n\n你也可以使用 `MembershipCreateUserException`\
  \ 捕获特定的错误，并返回可能更合适的内容。列表 19-10 展示了这种用法的示例。\n\n在这种情况下，你能够查找 `CreateUser` 过程中发生的特定错误。在这里，此代码仅查找三个特定项目，但可用的错误代码列表包括以下内容：\n\
  \n* `MembershipCreateStatus.DuplicateEmail`\n* `MembershipCreateStatus.DuplicateProviderUserKey`\n\
  * `MembershipCreateStatus.DuplicateUserName`\n* `MembershipCreateStatus.InvalidAnswer`\n\
  * `MembershipCreateStatus.InvalidEmail`\n* `MembershipCreateStatus.InvalidPassword`\n\
  * `MembershipCreateStatus.InvalidProviderUserKey`\n* `MembershipCreateStatus.InvalidQuestion`\n\
  * `MembershipCreateStatus.InvalidUserName`\n* `MembershipCreateStatus.ProviderError`\n\
  * `MembershipCreateStatus.Success`\n* `MembershipCreateStatus.UserRejected`\n\n\
  除了通过定义发生的情况向用户提供更好的错误报告外，你还可以使用这些事件执行可能需要的操作。\n\n#### 更改用户注册你的应用程序的方式\n\n你通过所选择的成员程序来决定用户如何注册你的应用程序以及对他们要求什么。你会在\
  \ `machine.config` 文件中找到默认成员程序及其应用的设置。如果你深入研究服务器上的 `machine.config` 文件，你会发现如列表 19-11\
  \ 所示的代码。\n\n`machine.config` 文件的这部分显示了 ASP.NET 自带的默认成员程序，名为 `AspNetSqlProvider`。如果你要为服务器范围添加成员程序，请将它们添加到\
  \ `machine.config` 的 `<membership>` 部分；如果你打算仅为特定的应用程序实例使用它们，可以将它们添加到应用程序的 `web.config`\
  \ 文件中。\n\n`SqlMembershipProvider` 定义的属性属性包括 `enablePasswordRetrieval`、`enablePasswordReset`、`requiresQuestionAnswer`、`requiresUniqueEmail`\
  \ 和 `PasswordFormat` 属性。表 19-1 定义了这些属性。\n\n| 属性 | 说明 |\n| --- | --- |\n| `enablePasswordRetrieval`\
  \ | 定义成员程序是否支持检索密码。此属性接受一个 `Boolean` 值。默认值为 `False`。当设置为 `False` 时，无法检索密码，但可以使用随机密码进行更改。\
  \ |\n| `enablePasswordReset` | 定义成员程序是否支持重置密码。此属性接受一个 `Boolean` 值。默认值为 `True`。 |\n\
  | `requiresQuestionAnswer` | 指定成员程序在创建用户时是否要求问题答组合。此属性接受一个 `Boolean` 值，默认值为 `False`。\
  \ |\n| `requiresUniqueEmail` | 定义成员程序在创建用户时是否要求指定唯一的电子邮件。此属性接受一个 `Boolean` 值，默认值为\
  \ `False`。当设置为 `True` 时，只能向数据存储输入唯一的电子邮件。 |\n| `passwordFormat` | 定义密码在数据存储中的格式。可能的值包括\
  \ `Hashed`、`Clear` 和 `Encrypted`。默认值为 `Hashed`。哈希密码使用 SHA1，而加密密码使用三重 DES 加密。 |\n\
  \n表 19-1\n\n除了在 `machine.config` 文件中定义这些项目外，你还可以在 `web.config` 文件中重新定义它们（从而覆盖 `machine.config`\
  \ 中的设置）。\n\n### 询问凭据\n\n\n\n\n\n当你已经有了用户可以使用 ASP.NET 提供的成员服务访问你的 Web 应用程序后，你就可以为这些用户提供登录网站的方法。这对你来说工作量很少。在学习允许用户访问你应用程序的控件之前，你应该对\
  \ `web.config` 文件进行更多一些修改。\n\n## 使用 `<authorization>` 元素关闭访问\n\n在你通过添加 `<authentication>`\
  \ 和 `<forms>` 元素更改 `web.config` 文件（列表 19-1 和 19-2）后，你的 Web 应用程序将对浏览你应用程序包含的任何页面的用户开放。为了防止开放访问，你必须拒绝未验证的用户访问你网站的页面。\n\
  \n列表 19-12 显示了拒绝未验证的用户访问你网站的代码。\n\n使用 `<authorization>` 和 `<deny>` 元素，你可以拒绝特定用户访问你的\
  \ Web 应用程序——或者（在这种情况下）简单地拒绝所有未验证的用户（这就是问号所代表的）。\n\n现在，除了已验证的用户之外，所有人都被拒绝访问网站，你希望让应用程序的查看者轻松成为已验证用户。为此，请使用\
  \ Login 服务器控件。\n\n## 使用 Login 服务器控件\n\nLogin 服务器控件允许你通过允许用户提供可以在某种数据存储中验证的登录凭据，将未验证的用户转换为已验证用户。在之前的示例中，你使用了\
  \ Microsoft SQL Server Express 版作为数据存储，但你同样可以轻松使用 Microsoft SQL Server 的完整版。\n\n\
  使用 Login 控件的第一步是创建一个名为 `Login.aspx` 的新网页。这是未验证用户被重定向到以获取其凭据的默认页面。记住，你可以通过更改 `web.config`\
  \ 文件中 `<forms>` 元素的 `loginUrl` 属性值来更改此行为。\n\n`Login.aspx` 需要一个 `<asp:Login>` 控件来给终端用户提供通过身份验证所需的一切，如\
  \ 列表 19-13 所示（本章节代码下载中的 Login.aspx）。\n\n在此时建立的情况下，如果未验证的用户访问应用程序中的不同页面，他或她将被重定向到\
  \ `Login.aspx` 页面。你可以看到 ASP.NET 如何从浏览器地址栏的 URL 中跟踪位置：\n\n```\nhttp://localhost:1315/Membership/Login.aspx?ReturnUrl=%2fMembership%2fDefault.aspx\n\
  ```\n\n使用 Login 控件的登录页面如 图 19-7 所示。\n\n![image](img/f720-01.jpg)\n\n**图 19-7**\n\
  \n从图中，你可以看到 Login 控件向用户询问用户名和密码。复选框允许在客户端机器上存储 cookie。此 cookie 允许终端用户跳过未来的登录。你可以通过将\
  \ Login 控件的 `DisplayRememberMe` 属性设置为 `False` 来移除用于记住用户的复选框和相关文本。\n\n除了 `DisplayRememberMe`\
  \ 属性外，你还可以通过 `RememberMeText` 和 `RememberMeSet` 属性来处理 Login 控件的这方面。`RememberMeText`\
  \ 属性非常浅显易懂，因为它的值仅仅定义了设置在复选框旁的文本。然而，`RememberMeSet` 属性非常有趣。`RememberMeSet` 属性接收一个\
  \ `Boolean` 值（默认设置为 `False`），该值指定在用户使用 Login 控件登录后，是否在客户端机器上设置持久化 cookie。当 `DisplayRememberMe`\
  \ 属性也设置为 `True` 时，如果当 Login 控件在浏览器中生成时，复选框默认是被勾选的。如果 `DisplayRememberMe` 属性设置为 `False`（这意味着终端用户看不到复选框或无法选择持久登录\
  \ cookie 的选项）且 `RememberMeSet` 设置为 `True`，则在用户不知情或未做选择的情况下，自动在用户的机器上设置一个 cookie。你应该仔细考虑采用这种方法，因为终端用户有时会使用公共计算机，而这种方法意味着你正在公共机器上设置授权\
  \ cookie。\n\n此 cookie 将一直留在客户端机器上，直到用户注销应用程序（如果提供了此选项）。有了持久化 cookie，且假设终端用户没有注销应用程序，那么当他返回应用程序时，永远不需要再次登录，因为他的凭据是由\
  \ cookie 中找到的内容提供的。在终端用户登录应用程序后，他将返回到他最初想要访问的页面。\n\n你也可以像修改其他控件一样修改 Login 控件的外观。实现此点的一种方法是点击控件智能标记中的“自动格式”（Auto\
  \ Format）链接。在那里，你可以找到一个修改控件外观的选项列表（见 图 19-8）。\n\n![image](img/f720-02.jpg)\n\n**图\
  \ 19-8**\n\n例如，选择 Colorful 选项，代码就会被修改。列表 19-14 显示了为此生成的代码。\n\n从该列表中，你可以看到使用了许多子元素来修改控件显示的项目。可用的样式元素包括：\n\
  \n* `<CheckboxStyle>`\n* `<FailureTextStyle>`\n* `<HyperLinkStyle>`\n* `<InstructionTextStyle>`\n\
  * `<LabelStyle>`\n* `<LoginButtonStyle>`\n* `<TextBoxStyle>`\n* `<TitleTextStyle>`\n\
  * `<ValidatorTextStyle>`\n\nLogin 控件具有许多属性，允许你更改它的外观和行为。你可以的一种有趣的更改是在控件底部添加一些链接以提供访问资源。通过这些链接，你可以为用户提供帮助或注册应用程序的功能，以便提供任何登录凭据。\n\
  \n你可以提供链接以：\n\n* 使用 `HelpPageText, HelpPageUrl` 和 `HelpPageIconUrl` 将用户重定向到帮助页面。\n\
  * 使用 `CreateUserText, CreateUserUrl` 和 `CreateUserIconUrl` 将用户重定向到注册页面。\n* 使用 `PasswordRecoveryText,\
  \ PasswordRecoveryUrl` 和 `PasswordRecoveryIconUrl` 将用户重定向到恢复丢失密码的页面。\n\n当使用这些链接时，Login\
  \ 控件看起来如 图 19-9 所示。\n\n![image](img/f722-01.jpg)\n\n**图 19-9**\n\n## 程序化登录用户\n\n\
  除了使用 Login 控件的内置机制外，你还可以使用 `Membership` 类程序化地执行此任务。为了验证收到的凭据，你使用该类的 `ValidateUser()`\
  \ 方法。\n\n```\nMembership.ValidateUser(username As String, password As String)\n\
  ```\n\n列表 19-15 展示了此方法。\n\n`ValidateUser()` 方法在用户凭据通过测试时返回 `Boolean` 值 `True`，否则返回\
  \ `False`。从 列表 19-15 中的代码片段中，你可以看到凭据验证为正确的终端用户使用 `RedirectFromLoginPage()` 方法从登录页面重定向。\n\
  \n\n\n\n在你构建的任何应用程序中提供用户登录表单时，务必防止重复的虚假密码尝试。如果你有一个知道用户名的恶意终端用户，他可能会尝试通过反复尝试不同的密码来访问应用程序。你希望防止此类活动。你不希望此人使用该用户名尝试数百种可能的密码。\n\
  \nASP.NET 内置了针对此类活动的保护机制。如果你查看 `aspnet_Membership` 表，你会发现两个专门用于防止此类活动的列。这两个列是 `FailedPasswordAttemptCount`\
  \ 和 `FailedPasswordAttemptWindowStart`。\n\n默认情况下，一个用户名在登录尝试中，在 10 分钟的窗口内仅允许使用错误密码进行\
  \ 5 次尝试。在第 5 次失败尝试时，账户将被锁定。在 ASP.NET 中，你通过将 `IsLockedOut` 列设置为 `True` 来实现此操作。\n\n\
  实际上，你可以控制应用程序允许的密码尝试次数以及尝试窗口的长度。这两个项目定义在 `machine.config` 文件的 `SqlMembershipProvider`\
  \ 声明中。你可以在服务器范围的配置文件中或在应用程序的 `web.config` 文件中更改这些值。Listing 19-16 显示了在 `web.config`\
  \ 文件更改这些值的代码。\n\n要确定允许的密码尝试次数，使用 `maxInvalidPasswordAttempts`。此示例将值更改为 `3`，这意味着用户在被锁定之前（在定义的时间内）允许输入三次错误密码。`maxInvalidPasswordAttempts`\
  \ 属性的默认值为 `5`。你可以使用 `passwordAttemptWindow` 属性将错误密码尝试的时间设置为 `15` 分钟。该属性的默认值为 `10`，因此会额外增加\
  \ 5 分钟。\n\n现在这些项目已经就绪，下一步是进行测试。Listing 19-17 为你提供了测试示例。它假设你已经建立了一个带有用户的应用程序。\n\n\
  此页面包含两个文本框：一个用于用户名，另一个用于密码。然而，在这些上方有一个复选框，当你因为密码错误而锁定账户后，可以使用它来解锁用户。\n\n如果你运行此页面并为你的用户连续输入三个错误的密码，你将获得\
  \ Figure 19-10 中所示的结果。\n\n![image](img/f725-01.jpg)\n\n**FIGURE 19-10**\n\n`IsLockedOut`\
  \ 属性通过实例化 `MembershipUser` 对象来读取。该对象允许你以程序的方式访问 `aspnet_Membership` 表包含的用户数据点。在这种情况下，`IsLockedOut`\
  \ 属性被检索并显示在屏幕上。`MembershipUser` 对象还暴露了许多可用方法——其中之一就是 `UnlockUser()` 方法。如果在按钮点击事件中选择了复选框，则会调用此方法。\n\
  \n#### 处理身份验证的用户\n\n在用户通过验证后，ASP.NET 4.5 提供了许多不同的服务器控件和方法，可以使用它们来处理用户详情。此工具集合包含了\
  \ `LoginStatus` 和 `LoginName` 控件。\n\n#### LoginStatus 服务器控件\n\n`LoginStatus` 服务器控件允许用户点击链接登录或注销网站。要获得此控件的良好示例，请从\
  \ `web.config` 文件中删除 `<deny>` 元素，以便你的网站页面可以被未身份验证的用户访问。然后编写你的 `Default.aspx` 页面，使其与\
  \ Listing 19-18 所示的代码类似。\n\n运行此程序将得到一个简单的页面，仅包含一个标题为 `Login` 的超链接，如 Figure 19-11\
  \ 所示。\n\n![image](img/f726-01.jpg)\n\n**FIGURE 19-11**\n\n点击 `Login` 超链接将你带到 `Login.aspx`\
  \ 页面，在那里提供凭据。提供凭据后，你将被重定向到 `Default.aspx` 页面——尽管现在 `Login` 链接被 `Logout` 链接取代了。\n\
  \n#### LoginName 服务器控件\n\n`LoginName` 服务器控件允许你显示身份验证用户的用户名。除了显示用户名外，你还可以使用 `LoginName`\
  \ 控件的 `FormatString` 属性添加文本。例如，为了提供欢迎消息，如下方式构造 `LoginName` 控件：\n\n```\n<asp:LoginName\
  \ ID=\"LoginName\" Runat=\"Server\" FormatString=\"Welcome {0}!\" />\n```\n\n当页面生成时，ASP.NET\
  \ 会将字符串的 `{0}` 部分替换为登录用户的用户名。这会为你提供类似如下的结果：\n\n```\nWelcome JohnDoe!\n```\n\n如果你在用\
  \ `LoginName` 控件时不想显示用户名，只需省略 `{0}` 即可。\n\n### 显示在线人数\n\n成员服务的一个很酷的功能是，你可以显示此时有多少用户在线。此选项对于希望通过其人气给网站访问者留下深刻印象的门户或论坛来说特别受欢迎。\n\
  \n要显示在线用户数，你使用 `Membership` 类提供的 `GetNumberOfOnline` 方法。你可以为 Figure 19-11 所示的 `Default.aspx`\
  \ 页面添加 Listing 19-20 中提供的代码。\n\n当页面生成时，它会显示过去 15 分钟内登录的用户数。Figure 19-14 显示了生成内容的示例。\n\
  \n![image](img/f728-01.jpg)\n\n**FIGURE 19-14**\n\n你可以看到有两个用户在过去 15 分钟内登录过。这 15\
  \ 分钟的时期是在 `machine.config` 文件的 `<membership>` 元素中指定的：\n\n```xml\n<membership userIsOnlineTimeWindow=\"\
  15\" >\n</membership>\n```\n\n\n\n\n我们中的许多人似乎一生都在网上生活，并为互联网上的许多不同网站拥有用户名/密码组合。由于由于原因，终端用户会忘记密码或想要定期更改密码。ASP.NET\
  \ 提供了几个服务器控件，与成员服务（membership service）配合工作，让终端用户更改密码或找回忘记的密码。\n\n## ChangePassword\
  \ 服务器控件\n\n`ChangePassword` 服务器控件允许终端用户直接在浏览器中更改密码。列表 19-21 显示了 `ChangePassword`\
  \ 控件的用法。\n\n此示例是 `<asp:ChangePassword>` 控件的一个用法。运行此页面将产生如图 19-15 所示的结果。\n\n![image](img/f729-01.jpg)\n\
  \n**图 19-15**\n\n`ChangePassword` 控件会生成一个询问旧密码的表单。它还要求终端用户输入两次新密码。如果用户已登录，点击“更改密码”按钮将尝试更改密码。如果终端用户尚未登录到应用程序，他们将被重定向到登录页面。只有登录用户才能更改密码。密码更改后，会通知终端用户（参见图\
  \ 19-16）。\n\n![image](img/f729-02.jpg)\n\n**图 19-16**\n\n记住，允许终端用户更改密码是因为成员提供程序（membership\
  \ provider）的 `enablePasswordReset` 属性被设置为 `true`。要拒绝此功能，请将 `enablePasswordReset`\
  \ 属性设置为 `false`。\n\n你还可以指定终端用户尝试更改密码时密码必须符合的规则。例如，你可能希望密码包含超过特定数量的字符，或者在使用字母之外还使用数字和/或特殊字符。使用\
  \ `NewPasswordRegularExpression` 属性，你可以指定新密码所需的构造，如下：\n\n```\nNewPasswordRegularExpression='@\\\
  \"(?=.{6,})(?=(.*\\d){1,})(?=(.*\\W){1,})'\n```\n\n终端用户创建的任何新密码都将根据此正则表达式进行检查。如果没有匹配项，你可以使用\
  \ `NewPasswordRegularExpressionErrorMessage` 属性（ASP.NET 中属性名称较长的属性之一）来在控件输出中显示错误消息。\n\
  \n## PasswordRecovery 服务器控件\n\n人们经常会忘记密码。由于由于原因，你应该提供从数据存储中检索密码的手段。`PasswordRecovery`\
  \ 服务器控件提供了一种完成此任务的简单方法。\n\n密码恢复通常意味着通过电子邮件将密码发送给该用户。因此，你需要设置一个 SMTP 服务器（它可能是同一个应用程序服务器）。你在\
  \ `web.config` 文件中配置 SMTP，如列表 19-22 所示。\n\n在正确设置 `<mailSettings>` 元素后，你就可以开始使用 `PasswordRecovery`\
  \ 控件了。列表 19-23 显示了 `PasswordRecovery` 控件的简单用法。\n\n`<asp:PasswordRecovery>` 元素需要一个\
  \ `<MailDefinition>` 子元素。`<MailDefinition>`元素包含发送给终端用户的电子邮件详细信息。最低要求是使用 `From` 属性，它为电子邮件的发件人部分提供电子邮件地址。该属性的\
  \ `String` 值应该是一个电子邮件地址。`<MailDefinition>` 元素的其他属性包括：\n\n* `BodyFileName`\n* `CC`\n\
  * `From`\n* `IsBodyHtml`\n* `Priority`\n* `Subject`\n\n当你运行此页面时，`PasswordRecovery`\
  \ 控件会询问用户的用户名，如图 19-17 所示。\n\n![image](img/f730-01.jpg)\n\n**图 19-17**\n\n获取用户名后，成员服务检索终端用户之前输入的问题和答案，并生成如图\
  \ 19-18 所示的视图。\n\n![image](img/f730-02.jpg)\n\n**图 19-18**\n\n如果问题回答正确（注意答案是区分大小写的），将生成一个包含密码的电子邮件并发送给终端用户。如果问题回答错误，将显示错误消息。当然，如果你禁用了成员系统的问/答功能，将不会使用问题。\n\
  \n默认情况下，成员服务数据存储并不存储实际密码——只是它的哈希（hashed）版本。因此，你不会得到原始密码，而是 ASP.NET 为你生成的新密码。\n\n\
  为了能够向用户发送实际密码，你必须更改密码在成员数据存储中的存储方式。你（如前所述）通过更改成员数据程序的 `PasswordFormat` 属性来实现这一点。除了\
  \ `Hashed` 之外，可能的值还有 `Clear` 和 `Encrypted`。\n\n## 生成密码\n\n在创建用户时，某些应用程序必须生成密码。ASP.NET\
  \ 包含一个检索随机密码的辅助方法。列表 19-24 显示了一个示例。\n\n在 ASP.NET 中生成随机密码可以使用 `GeneratePassword()`\
  \ 方法。该方法允许你生成指定长度的密码，并且你可以指定密码包含多少个非字母字符。此示例调用了五次该方法产生如下结果（当然，你的结果将会不同）：\n\n* `D]g6s[`\n\
  * `$X.M9]*x2-`\n* `Q+lIy2#zD`\n* `%kWZL@zy&f`\n* `o]&IhL#iU`\n\n有了你的辅助方法，你可以创建带有随机密码的用户，如列表\
  \ 19-25 所示。\n\n## ASP.NET 4.5 授权\n\n现在你可以处理访问 Web 应用程序的用户注册和验证，下一步是授权。他们允许查看什么？他们什么角色？这些问题对于任何\
  \ Web 应用程序都是重要的。下节将解释如何向已登录用户显示某些项目，同时向未登录用户显示不同的项目。\n\n### 使用 LoginView 服务器控件\n\
  \n`LoginView` 服务器控件允许你控制谁查看页面的哪些信息。使用 `LoginView` 控件，你可以规定页面的哪些部分属于已登录用户，哪些部分属于未登录用户。`<asp:LoginView>`\
  \ 控件是一个模板控件，它接受两个可能的子元素——`<LoggedInTemplate>` 和 `<AnonymousTemplate>` 元素。在这种情况下，定义在\
  \ `<AnonymousTemplate>` 部分的信息是针对未登录用户的（参见图 19-19）。\n\n这与已登录用户看到的 `<LoggedInTemplate>`\
  \ 部分中定义的内容完全不同（参见图 19-20）。\n\n\n\n\n\n这两个模板内部都只放置了简单的 ASCII 文本，但你实际上可以在模板中放置任何其他内容，包括额外的服务器控件。这意味着你可以从模板化部分显示整个页面的区域，包括表单。\n\
  \n除了使用 `LoginView` 控件的 `<LoggedInTemplate>` 和 `<AnonymousTemplate>` 之外，你还可以针对特定角色的实体（例如\
  \ `Admin` 组的成员）来启用页面的某些部分或特定内容。你可以通过使用 `LoginView` 控件的 `<RoleGroups>` 部分来实现这一点，如列表\
  \ 19-27 所示。\n\n要为特定用户组显示内容，你需要向 `LoginView` 控件添加 `<RoleGroups>` 元素。`<RoleGroups>`\
  \ 部分可以包含一个或多个 `RoleGroup` 控件（你不会在 Visual Studio 工具箱中找到此控件）。为了使用 `RoleGroup` 控件提供要显示的内容，你需要提供一个\
  \ `<ContentTemplate>` 元素，它允许你为属于指定角色的实体定义要显示的内容。`<ContentTemplate>` 部分放置的内容完全取决于你。你可以放置原始文本（如示例所示），甚至可以放置其他\
  \ ASP.NET 控件。\n\n注意在 `<RoleGroups>` 部分中放置定义角色的顺序。当用户登录网站时，系统首先检查他们是否符合定义的角色之一。匹配到的第一个（最上方的）角色将作为\
  \ `LoginView` 控件使用的视图——即使他们匹配了多个角色。你还可以在 `<asp:RoleGroups>` 控件的 `Roles` 属性中放置多个角色，如下所示：\n\
  \n```\n <asp:RoleGroup Roles=\"CoolPeople, HappyPeople\">\n    <ContentTemplate>\n\
  \     你很酷或很快（或者两者都有！）\n    </ContentTemplate>\n  </asp:RoleGroup>\n```\n\n### 为角色管理设置你的网站\n\
  \n除了刚刚审查的成员服务外，ASP.NET 还为你提供了最终用户管理服务的另一面——ASP.NET 角色管理服务。成员服务涵盖了应用程序身份验证的所有细节，而角色管理服务涵盖了授权。正如成员服务可以使用之前列出的任何数据提供程序，角色管理服务也可以使用专注于\
  \ SQL Server（`SqlRoleProvider`）或任何自定义提供程序。事实上，此服务在许多方面与成员服务相当。图 19-21 为你展示了一个简单的图，详细说明了角色管理服务的某些细节。\n\
  \n![image](img/f734-01.jpg)\n\n**图 19-21**\n\n#### 修改 <roleManager> 部分\n\n使用角色管理服务的第一步是在\
  \ `machine.config` 或 `web.config` 文件中更改角色管理提供程序的任何行为。如果你查看 `machine.config.comments`\
  \ 文件，你将看到一个处理角色管理服务的完整部分（参见列表 19-28）。\n\n角色管理服务在 `machine.config.comments` 文件中对其设置进行了文档说明，如上一个代码列表所示。你可以直接在\
  \ `machine.config` 文件中更改这些设置，也可以通过更改 `web.config` 文件本身来覆盖你可能拥有的任何高级设置（从而只对当前应用程序进行更改）。\n\
  \n主要设置定义在 `<roleManager>` 元素中。表 19-2 定义了 `<roleManager>` 元素的一些属性。\n\n| **属性** |\
  \ **描述** |\n| --- | --- |\n| `enabled` | 定义是否为应用程序启用了角色管理服务。此属性接受一个 `Boolean` 值，默认设置为\
  \ `False`。这意味着默认情况下角色管理服务是禁用的。这样做是为了避免对从 ASP.NET 1.0/1.1 迁移到 ASP.NET 2.0、3.5、4 或\
  \ 4.5 的用户产生破坏性更改。因此，你必须先在 `machine.config` 或 `web.config` 文件中将此值更改 `True`。 |\n|\
  \ `cacheRolesInCookie` | 定义用户的角色是否可以存储在客户端机器的 cookie 中。此属性接受一个 `Boolean` 值，默认设置为\
  \ `True`。这种情况是理想的，因为从 cookie 中检索角色可以防止 ASP.NET 通过角色管理提供程序查找用户的角色。如果你希望在所有实例中通过提供程序检索角色，请将其设置为\
  \ `False`。 |\n| `cookieName` | 定义用于发送给最终用户以存储角色管理信息的 cookie 名称。默认情况下，此 cookie 名为\
  \ `.ASPXROLES`，你可能不会更改它。 |\n| `cookieTimeout` | 定义 cookie 过期后的时间（分钟）。默认值为 `30` 分钟。\
  \ |\n| `cookieRequireSSL` | 定义你是否要求角色管理信息通过加密线路（SSL）发送而不是以明文形式发送。默认值为 `False`。 |\n\
  | `cookieSlidingExpiration` | 指定 cookie 的超时是否为滑动刻度。默认值为 `True`。这意味着在对应用程序进行最后一次请求后的\
  \ 30 分钟（或 `cookieTimeout` 属性中指定的时间）之前，最终用户的 cookie 不会过期。如果 `cookieSlidingExpiration`\
  \ 属性的值设置为 `False`，则 cookie 在第一次请求后 30 分钟过期。 |\n| `createPersistentCookie` | 指定 cookie\
  \ 是过期还是无限期有效。默认设置为是 `False`，因为出于安全考虑，并不总是建议使用持久性 cookie。 |\n| `cookieProtection`\
  \ | 指定你希望对存储在最终用户机器上用于管理信息的 cookie 提供的保护程度。可能的设置包括 `All, None, Encryption` 和 `Validation`。你应该始终尝试使用\
  \ `All`。 |\n| `defaultProvider` | 定义用于角色管理服务的提供程序。默认情况下，直到 ASP.NET 4.0 它设置为 `AspNetSqlRoleProvider`，从\
  \ ASP.NET 4.5 开始设置为 `DefaultRoleProvider`。 |\n\n**表 19-2**\n\n#### 修改 web.config\
  \ 文件\n\n下一步是配置你的 `web.config` 文件，使其与角色管理服务配合。应用程序的某些页面或子部分可能仅允许具有特定角色的人员访问。为了管理此访问，你需要在\
  \ `web.config` 文件中定义访问权限。列表 19-29 显示了必要的更改。\n\n此 `web.config` 文件正在执行几件事。首先，第一个 `<system.web>`\
  \ 部分的功能与本节之前显示的成员服务相同。`<deny>` 元素全局范围内拒绝所有未身份验证的用户。\n\n此 `web.config` 文件的第二个部分非常有趣。<location>`\
  \ 元素用于定义应用程序中特定页面（`AdminPage.aspx`）的访问权限。在这种情况下，只有包含在 `AdminPageRights` 角色中的用户允许查看页面，而所有其他用户——无论是否经过身份验证——都不允许查看页面。当使用星号\
  \ (`*`) 作为 `<deny>` 元素的 `users` 属性的值时，你是在说所有用户（无论是否经过身份验证）都不允许访问所定义的资源。然而，这种对访问的拒绝通过使用\
  \ `<allow>` 元素得到了一定突破，该元素允许包含特定角色的用户访问。\n\n### 添加和检索应用程序角色\n\n\n\n\n\n现在 `machine.config`\
  \ 或 `web.config` 文件已经就绪，你就可以向角色管理服务添加角色了。角色管理服务与成员服务一样，使用数据存储来存储用户信息。这些示例主要关注使用\
  \ Microsoft SQL Server Express 版作为提供程序，因为它是默认提供程序。\n\n角色管理服务和成员服务之间的一个大区别是，角色管理服务不使用服务器控制。你通过\
  \ `Roles` API 或通过 ASP.NET 4.5 提供的网站管理工具来管理应用程序的角色和用户的角色详细信息。列表 19-30 显示了如何使用一些新方法向服务添加角色。\n\
  \n此示例允许你向文本框中输入角色，然后将它们提交到角色管理服务。角色管理服务中包含的角色将出现在列表框中，如图 19-22 所示。\n\n![image](img/f738-01.jpg)\n\
  \n**图 19-22**\n\n要将角色输入到管理服务中，你使用 `Roles` 类的 `CreateRole()` 方法。与 `Membership` 类一样，你不需要实例化\
  \ `Roles` 类。要向角色管理服务添加角色，使用 `CreateRole()` 方法，该方法仅接受一个参数 —— 作为 `String` 值的角色名称：\n\
  \n```\n Roles.CreateRole(rolename As String)\n```\n\n通过此方法，你可以创建任意数量的角色，但每个角色必须是唯一的；否则将抛出异常。\n\
  \n要检索应用程序角色管理服务中的角色（例如上一个示例中列表框中显示的角色列表），你使用 `Roles` 类的 `GetAllRoles()` 方法。该方法返回服务中所有可用角色的\
  \ `String` 集合：\n\n```\n Roles.GetAllRoles()\n```\n\n### 删除角色\n\n如果能坐上一整天为服务添加角色就太棒了。然而，每隔一段时间，你可能也想从服务中删除角色。删除角色与向角色管理服务添加角色一样简单。要删除一个角色，你使用\
  \ `DeleteRole()` 方法的签名之一。`DeleteRole()` 方法的第一种选项接受一个参数 —— 作为 `String` 值的角色名称。第二个选项接受角色名称加上一个\
  \ `Boolean` 值，该值决定当该特定角色包含一个或多个成员时是否抛出异常（这样你就不会在无意中删除包含用户的角色）：\n\n```\n Roles.DeleteRole(rolename\
  \ As String)\n  Roles.DeleteRole(rolename As String, throwOnPopulatedRole As Boolean)\n\
  ```\n\n列表 19-31 是基于列表 19-30 的部分代码示例。对于此示例，你添加了一个额外的按钮，触发第二个按钮点击事件以从服务中删除角色。\n\n\
  此示例从 ListBox 控制中删除选中的项目。如果选择了多个（这意味着你在 ListBox 控制中放置了属性 `SelectionMode=\"Multiple\"\
  `），则每个角色将在 `For Each` 循环中从从服务删除。虽然使用了 `Roles.DeleteRole(li.ToString())` 来删除角色，但也可以使用\
  \ `Roles.DeleteRole(li.ToString(), True)` 来确保如果该角色包含任何成员，则不删除该角色。\n\n### 将用户添加到角色\n\
  \n现在角色已经就位，并且在需要时可以删除这些角色，下一步是将用户添加到已创建的角色中。如果没有用户与角色关联，该角色就没有什么用处。要将单个用户添加到单个角色，你使用以下结构：\n\
  \n```\n Roles.AddUserToRole(username As String, rolename As String)\n```\n\n要同时将单个用户添加到多个角色，你使用此结构：\n\
  \n```\n Roles.AddUserToRoles(username As String, rolenames() As String)\n```\n\n\
  要将多个用户添加到单个角色，你使用以下结构：\n\n```\n Roles.AddUsersToRole(usernames() As String, rolename\
  \ As String)\n```\n\n最后，将多个用户添加到多个角色，你使用以下结构：\n\n```\n Roles.AddUsersToRoles(usernames()\
  \ As String, rolenames() As String)\n```\n\n接收集合的参数（无论是 `usernames()` 还是 `rolenames()`）都会以\
  \ `String` 数组的形式呈现方法。\n\n### 获取特定角色的所有用户\n\n在角色管理服务中查找信息很容易，无论你是要确定特定角色中包含哪些用户，还是想知道特定用户属于哪些角色。\n\
  \n这两种场景都有对应的方法。首先，看如何确定特定角色中包含的所有用户，如列表 19-32 所示。\n\n此页面创建了一个包含应用程序所有角色的下拉列表。点击按钮显示所选角色的所有用户。特定角色的用户通过\
  \ `GetUsersInRole()` 方法确定。该方法接受一个参数 —— 一个 `String` 值：\n\n```\n Roles.GetUsersInRole(rolename\
  \ As String)\n```\n\n运行时，该页面类似于图 19-23。\n\n![image](img/f741-01.jpg)\n\n**图 19-23**\n\
  \n### 获取特定用户的所有角色\n\n要获取特定用户的角色，你使用 `RolesForUser()` 方法。该方法有两种可能的签名。第一种是之前的示例 ——\
  \ 代表用户名的 `String` 值。另一种是不带任何参数的方法调用。这将返回登录用户的角色。\n\n```\n Roles.RolesForUser(username\
  \ As String)\n Roles.RolesForUser()\n```\n\n### 从角色中移除用户\n\n除了向角色添加用户外，你还可以轻松从角色中移除用户。要从单个角色删除或移除单个用户，你使用以下结构：\n\
  \n```\n Roles.RemoveUserFromRole(username As String, rolename As String)\n```\n\n\
  要同时从多个角色中移除单个用户，你使用此结构：\n\n```\n Roles.RemoveUserFromRoles(username As String, rolenames()\
  \ As String)\n```\n\n要从单个角色中移除多个用户，你使用以下结构：\n\n```\n Roles.RemoveUsersToRole(usernames()\
  \ As String, rolename As String)\n```\n\n最后，从多个角色中移除多个用户，你使用以下结构：\n\n```\n Roles.RemoveUsersFromRoles(usernames()\
  \ As String, rolenames() As String)\n```\n\n显示为集合的参数（无论是 `usernames()` 还是 `rolenames()`）都会以\
  \ `String` 数组的形式呈现方法。\n\n### 检查角色中的用户\n\n你可以执行的操作是检查特定用户是否在某个角色中。你可以可以通过方法来实现。第一种是使用\
  \ `IsUserInRole()` 方法。\n\n`IsUserInRole()` 方法接受两个参数 —— 用户名和角色名称：\n\n```\n Roles.IsUserInRole(username\
  \ As String, rolename As String)\n```\n\n该方法返回关于用户状态的 `Boolean` 值，你可以如列表 19-34 所示所示它。\n\
  \n\n\n\n\n除了 `IsUserInRole()` 方法外，另一种选择是使用 `FindUsersInRole()`。该方法允许你对特定角色中的所有用户进行名称搜索。`FindUsersInRole()`\
  \ 方法接受两个参数——角色名称和用户名，两者均为 `String` 类型：\n\n```\n Roles.FindUsersInRole(rolename As\
  \ String, username As String)\n```\n\n`Listing 19-35` 显示了该方法的示例。\n\n### 理解角色是如何缓存的\n\
  \n默认情况下，在你从角色管理服务的底层数据存储中检索用户的角色后，你可以将这些角色作为 Cookie 存储在客户端机器上。这样做是为了避免在应用程序每次需要用户角色状态时都去访问数据存储。在处理\
  \ Cookie 时始终存在着一定的风险，因为最终用户可以操纵 Cookie，从而获得通常禁止该特定用户访问的信息或应用程序部分。\n\n尽管角色被缓存在 Cookie\
  \ 中，但默认设置是每次缓存时间仅为 30 分钟。你可以通过多种方法处理此此角色 Cookie ——其中某些方法可能有助于更好地保护你的应用程序。\n\n对你的应用程序的一种保护方法是在最终用户登录站点时，使用\
  \ `Roles` API 的 `DeleteCookie()` 方法删除此角色 Cookie，如 `Listing 19-36`所示。\n\n使用 `Roles.DeleteCookie()`\
  \ 的作用正如你所想的——它从客户端机器上删除任何用于定义用户角色的 Cookie。如果最终用户重新登录站点，在应用程序中重新验证其确切的角色不应该出现问题。不需要依赖\
  \ Cookie 的内容。这一步为你的站点提供了更多的保护。\n\n## 使用 SIMPLEMEMBERSHIP API\n\n诚实地说，Membership\
  \ API 很少人喜欢，却深受许多人厌恶。它设计于十多年前，但对于简单任务来说太复杂，而且没有准备好当今 Web 中常用的身份身份机制。你很快就会看到现代身份验证机制，但在之前，你会学习一种在\
  \ ASP.NET 中进行身份验证的简单方法。\n\n通过 WebMatrix，微软提供了一个被官方公关称为“初学者和学生”的非常强大的 IDE。这所谓的含义可能是你可能不应该使用\
  \ WebMatrix 开发商业项目（尽管你是被允许的），但对于较简单的应用程序可以获得快速的结果。\n\n与 ASP.NET Web Pages 技术自带的成员和角色部分是\
  \ WebMatrix 的不可组成部分。`Chapter 35` 详细介绍了那里提供的可用功能，但本章将简要讨论一个也适用于 ASP.NET Web Forms\
  \ 应用程序的特定 API。\n\n`SimpleMembership` 和 `SimpleRoles` API 提供了对成员和角色信息的编程访问，但其界面比“常规”的\
  \ Membership 和 Roles API 要简单得多。以下是 `SimpleMembership` 中一些方法的列表：\n\n* `WebSecurity.ChangePassword()`\n\
  * `WebSecurity.CreateUserAndAccount()`\n* `WebSecurity.Login()`\n* `WebSecurity.Logout()`\n\
  * `WebSecurity.RequireAuthenticatedUser()`\n\n与你目前所处理的内容相比，基本功能并不是新奇，但单是措辞更简单且更直主题——例如，如果用户未经过验证，`RequireAuthenticatedUser()`\
  \ 会自动重定向到登录页面。\n\nMatthew M. Osborn 写了关于该主题的博客文章之一（[`blog.osbornm.com/archive/2010/07/21/using-simplemembership-with-asp.net-webpages.aspx``](http://blog.osbornm.com/archive/2010/07/21/using-simplemembership-with-asp.net-webpages.aspx)），Jon\
  \ Galloway 在此处提供了更多细节和技术背景 [`http://weblogs.asp.net/jgalloway/archive/2012/08/29/simplemembership-membership-providers-universal-providers-and-the-new-asp-net-4-5-web-forms-and-asp-net-mvc-4-templates.aspx`](http://weblogs.asp.net/jgalloway/archive/2012/08/29/simplemembership-membership-providers-universal-providers-and-the-new-asp-net-4-5-web-forms-and-asp-net-mvc-4-templates.aspx)）。\n\
  \n在我们工作的企业项目中，我们很少见到这些更简单的 API，但它们仍然值得一看，并且可能非常适合你的特定项目，因此我们不想错过在这里提到它们的机会。\n\n\
  ## 使用网站管理工具\n\n你也可以通过 `Figure 19-25` 所示的网站管理工具执行本章中显示的许多操作。你可以从 Visual Studio 2012\
  \ 菜单中选择 Website ![image](img/Ar.jpg) ASP.NET Configuration 获取 ASP.NET 网站管理工具。\n\n\
  ![image](img/f746-01.jpg)\n\n**[图 19-25]****\n\n虽然你可以轻松地使用此工具为你执行所有操作，但你通常也通过你自己的应用程序执行这些操作。在编写\
  \ ASP.NET 应用程序时，了解所有可能性是重要的。\n\n附录 D 提供了网站管理工具的详细信息。\n\n## MEMBERSHIP API 的公开方法\n\
  \n`Table 19-3` 展示了 Membership API 的公开方法。处理应用程序的身份验证过程时可以使用此 API。\n\n| MEMBERSHIP\
  \ 方法 | 描述 |\n| --- | --- |\n| `CreateUser` | 向数据存储添加一个新用户。 |\n| `DeleteUser` | 从数据存储中删除指定的用户。\
  \ |\n| `FindUsersByEmail` | 返回提供的电子邮件地址的用户集合。 |\n| `FindUsersByName` | 返回匹配提供的用户名的用户集合。\
  \ |\n| `GeneratePassword` | 生成一个指定长度的随机密码。 |\n| `GetAllUsers` | 返回数据存储中的所有用户集合。\
  \ |\n| `GetNumberOfOnline` | 返回登录应用程序的用户数量。计算的时间窗口在 `machine.config` 或 `web.config`\
  \ 文件中指定。 |\n| `GetUser` | 从数据存储返回特定用户的信息。 |\n| `GetUserNameByEmail` | 根据电子邮件地址从数据存储检索特定的用户名。\
  \ |\n| `UpdateUser` | 更新数据存储中的特定用户信息。 |\n| `ValidateUser` | 返回指示凭据是否有效的布尔值。 |\n\n\
  **[表 19-3]****\n\n## ROLES API 的公开方法\n\n提供了 Roles API 的公开方法。在处理应用程序的授权过程时可以使用此 API。\n\
  \n| ROLES 方法 | 描述 |\n| --- | --- |\n| `AddUsersToRole` | 将用户集合添加到特定角色中。 |\n| `AddUsersToRoles`\
  \ | 将用户集合添加到一组角色中。 |\n| `AddUserToRole` | 将特定用户添加到特定角色中。 |\n| `AddUserToRoles` |\
  \ 将特定用户添加到一组角色中。 |\n| `CreateRole` | 向数据存储添加一个新角色。 |\n| `DeleteCookie` | 删除客户端上用于存储用户所属角色的\
  \ Cookie。 |\n| `DeleteRole` | 从数据存储中删除特定角色。使用该方法的正确参数，你还可以控制无论该角色是否包含用户都将其删除或保持完整。\
  \ |\n| `FindUsersInRole` | 返回匹配提供的用户名的用户集合。 |\n| `GetAllRoles` | 返回数据存储中所有角色的集合。\
  \ |\n| `GetRolesForUser` | 返回特定用户的角色集合。 |\n\n\n\n\n\n| `IsUserInRole` | 返回一个 `Boolean`\
  \ 值，指定用户是否包含在特定角色中。 |\n| `RemoveUserFromRole` | 从特定角色中移除特定用户。 |\n| `RemoveUserFromRoles`\
  \ | 从角色集合中移除特定用户。 |\n| `RemoveUsersFromRole` | 从特定角色中移除一组用户。 |\n| `RemoveUsersFromRoles`\
  \ | 从角色集合中移除一组用户。 |\n| `RoleExists` | 返回一个 `Boolean` 值，表示数据存储中是否存在该角色。 |\n\n表 19-4\n\
  \n## 集成 OAUTH 和 OPENID 身份验证\n\n到为止，你已经看到 ASP.NET 的身份验证系统非常强大——得益于提供者模型和如通用提供者等方法（在第\
  \ 18 章 中提到过）——而且非常灵活。然而，它还可以变得更好。在涉及身份验证时，许多网站正诉采用开放标准。为了这一目的，最常用的有两种方法：\n\n- OpenID\
  \ 是由 OpenID 基金会（`http://openid.net/foundation`](http://openid.net/foundation)）创建的。通用方法是用户在多个身份提供者之一（例如\
  \ Google 或 YahooYPs）进行注册。然后，当这些用户想要登录任何启用了 OpenID 的第三方网站时，他们会被重定向到提供者的网站，在那里登录并接收一个令牌，该令牌随后可以用于对第三方网站进行身份验证。\n\
  - OAuth 由互联网工程任务组（IETF，[`http://ietf.org/`](http://ietf.org/)）控制控制。身份验证过程与 OpenID\
  \ 使用的类似，尽管 OAuth 并不真正在执行身份验证；相反，OAuth 为用户提供访问令牌（access token），而不是其身份的证明。\n\n幸运的是，标准的细节并不十分重要，因为你将发现一种非常方便的方法，可以将这些标准插入到你信任且真实的\
  \ ASP.NET 身份验证系统中。\n\n### 使用 OpenID\n\n先说坏消息：ASP.NET 中没有内置的 OpenID 或 OAuth 支持。然而，来自微软的外部包使得实现这些标准变得非常简单。本节讨论的是\
  \ OpenID，而不是它（从 ASP.NET API 的角度来看）与 OpenAuth 有多大不同。Google 的 OpenID 服务实现起来简单。使用 OpenID\
  \ 和 OAuth 最方便的方法是使用 Visual Studio 2012 自带的 ASP.NET Web Forms 应用程序模板，它如图 19-26 所示。\n\
