  \ App_Code\"/>\n  </httpModules>\n```\n\n如果你将 `<httpModules>` 部分添加到可能部署到运行 IIS 7\
  \ 或 IIS 8 的服务器的 `web.config` 文件中，还应该在 `<system.webServer>` 配置部分中添加以下验证项。\n\n```\n\
  \ <validation validateIntegratedModeConfiguration=\"false\"/>\n```\n\n列表 30-4（本章代码下载中的\
  \ `web.config` 文件）显示了在 `<system.web>` 和 `<system.webServer>` 配置部分注册模块后的 `web.config`\
  \ 文件。\n\n如果你在 ASP.NET 网站的 `App_Code` 目录中创建了 `HttpModule`，你可能会想知道 `assemblyname`\
  \ 的值应该是什么，考虑到 ASP.NET 现在在运行时动态编译这些代码。解决方案是使用文本“App_Code”作为程序集名称，这告诉 ASP.NET 你的模块位于动态创建的程序集中。\n\
