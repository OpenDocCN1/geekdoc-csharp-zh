  ```\n\n它以美元符号开头——你突然改用 PHP 了吗？恰恰相反——在 JavaScript 中，使用 `$` 作为标识符完全没有问题。因为实际上没有人会把自己的函数命名为\
  \ `$()`，所以许多 JavaScript 库使用 `$()` 代替，以避免名称冲突。\n\n实际上，`$()` 是 jQuery 的核心函数，具有多个用途。如果你认为这让代码难以阅读，你可能想用\
  \ `jQuery` 代替 `$` —— 它的等效写法。\n\n如果你查看图 25-5 中 `$()`/`jQuery()` 的 IntelliSense 输出，你将看到该函数的几个重载版本。第三个选项称为“绑定一个函数，并在\
  \ DOM 加载完成时执行（Binds a function to be executed when the DOM has finished loading）”。在阿贾斯（异步请求（Ajax）应用中，这是至关重要的。大多数情况下，你使用文档对象模型（DOM）来访问页面上的元素。然而，这只有在\
  \ DOM 完全加载后才是可能的——这通常在 HTML 文档从服务器完全传输到浏览器后不久就会发生。\n\n所以，如果你将一个函数作为参数传递给 `$()`——JavaScript\
  \ 真是一门迷人的语言！——这个函数会在 DOM 准备就绪后执行一次。大多数情况下，这正是你想要的。因此，你在整个章节中都会使用这种模式。\n\n## 选择元素\n\
  \n在处理任何 JavaScript 库时，常见的操作顺序如下：你等待事件发生（例如，DOM 加载完成、用户点击按钮等），然后选择页面上的一个元素，最后从该 HTML\
  \ 元素读取或向其写入。由于你已经了解其中一个事件是如何工作的（DOM 加载完成），你可以继续选择元素了。幸运的是，jQuery 团队并没有为这项任务发明全新的语法；相反，它重用了一个具有相同目的既有标准：级联样式表（CSS）选择器。\n\
  \n这一世界维网联盟（W3C）标准是 CSS 的一部分，描述了如何选择页面上的特定元素。在 CSS 的语境下，此选择过程的目的是对元素进行样式设置或定位。在 jQuery\
  \ 的语境下，你可以对这些对象做任何你想的事。\n\n更现代的浏览器内置了 JavaScript API 来执行 CSS 选择。如果遇到此类客户端，jQuery\
  \ 会将复杂的解析和选择任务委托给浏览器。\n\n与 jQuery 一样，CSS 是一个非常复杂的话题。Richard York 写的《Beginning CSS》（John\
  \ Wiley & Sons, 2004）有 648 页！然而，在大多数情况下，一种常用的 CSS 选择器就能完成工作。存在三种通用类型的 CSS 元素选择器：\n\
  \n*   **标签选择器（Tag selectors）：** 例如，选择器 `p` 匹配页面上所有的 `<p>` 元素；`p a` 匹配 `<p>` 元素内部所有的\
  \ `<a>` 元素。注意，重要的是生成的 HTML，而不是使用的 ASP.NET Web 控件。例如，选择器 `Calendar` 将无法工作。\n*   **类选择器（Class\
  \ selectors）：** 这些以点号 开头。例如，选择器 `.myClass` 会选择所有具有 HTML 属性 `class=\"myClass\"` 的元素。你也可以混合使用：`a.myClass`\
  \ 会匹配所有类为 `myClass` 的 `<a>` 标签，但不会匹配 `<p>` 标签。使用 ASP.NET 时，记住 Web 控件的 `CssClass`\
  \ 属性在生成的 HTML 中会变为 `class` 属性。\n*   **ID 选择器（ID selectors）：** 如果 HTML 元素具有 ID，例如\
  \ `id=\"myID\"`，则选择器 `#myID` 将匹配该元素。\n\n如果你在调用 `$()` 函数时传入一个 CSS 选择器，你将返回页面上匹配该选择器的元素列表。准确地说，你将收到一个代表所选元素的\
  \ jQuery 对象。区别在于，jQuery 对象可以拥有方法，因此你可以进一步处理这些选定的元素。你在本章节稍后的部分会用到这个功能。\n\n现在，你只需要使用\
  \ jQuery 对象的一个方法：`size()` 返回元素的数量。列表 25-4 显示了一个包含几个元素的简单页面。然后 JavaScript 代码选择了几个元素。请查看图\
  \ 25-6 输出结果。\n\n![image](img/f964-01.jpg)\n\n# 图 25-6](#Chapter25.xhtml_figureanchor25-6)\n\
  \n图 25-6 中的结果可能有点意外。然而，请考虑 `<asp:Panel>` 默认渲染为 `<div>` 元素，而 `<asp:Label>` 变为 `<span>`\
  \ 元素。\n\n## 修改元素\n\n仅仅统计你有多少元素是很罕见的；通常你明确知道有多少元素。重要的是对它们做了什么。jQuery 提供了完整的增、读、改、删（CRUD）功能，但大多数情况下你是在元素中读取或写入内容。\n\
  \n### 修改内容\n\njQuery 提供了四种方法从元素中读取信息，取决于元素类型：\n\n*   `attr(\"name of attribute\"\
  )`：元素的 HTML 属性值\n*   `html()`：元素的内部 HTML 内容\n*   `text()`：元素的内部内容，仅限文本（去除了 HTML）\n\
  *   `val()`：大多数表单元素的值\n\n更改这些值也是可能的。提供了以下四个方法：\n\n*   `attr(\"name of attribute\"\
  , \"value of attribute\")`\n*   `html(\"new HTML content\")`\n*   `text(\"new text\
  \ content\")`\n*   `val(\"new value\")`\n\n正如你看到的， getter 和 setter 方法是相同的——仅仅参数的数量有助于\
  \ jQuery 确定做什么。从 API 的角度来看，起初看起来可能很奇怪，但有助于保持方法列表简洁。列表 25-5 展示了 `html()` 方法的两种用途：一旦\
  \ DOM 准备就绪，就会获取选取元素的当前 HTML 内容；然后追加当前时间。请查看图 25-7 的结果。\n\n![image](img/f965-01.jpg)\n\
  \n# 图 25-7\n\n如果你将 `html()`（或 `text(), val()` 或 `attr()`）作为 setter，此类方法调用的返回值仍然是代表所选元素的\
  \ jQuery 对象。因此，你可以使用链式调用——只需一个接一个调用方法调用。讽刺者可能会声称大部分 jQuery 代码实际上只有一行 JavaScript\
  \ —— 一行非常长的代码。\n\n\n\n\n为了演示链式调用，请看另一个用于修改元素的 jQuery 方法：`css()`。如名所示，你可以用它来获取或设置\
  \ CSS 属性。该方法有三种用法：\n\n* `css(\"property\")`：读取 CSS 属性\n* `css(\"property\", \"value\"\
  )`：写入 CSS 属性\n* `css({\"property1\": \"value1\", \"property2\":\"value2\"})`：写入多个\
  \ CSS 属性\n\n代码 25-6 在代码 25-5 的基础上，通过 jQuery 修改了文本的背景色和前景颜色。`css()` 调用链跟在 `html()`\
  \ 调用之后。图 25-8 展示了结果。\n\n![image](img/f966-01.jpg)\n\n**图 25-8**\n\n### 添加移除元素\n\n\
  上一节的技术非常适合在页面上显示文本。然而，当你想要向页面添加多个 元素时，这种方法就变得繁琐：你需要组装 HTML 标记，处理特殊字符，并且最后通过 `html()`\
  \ 方法添加。\n\n不过，jQuery 有一个非常强大的 API 来添加（以及移除）新元素。从添加元素开始，首先你需要创建一个元素。再次，`()` 函数在这里很有帮助。如果第一个参数是带括号的\
  \ HTML 元素（例如 `<a></a>`），该函数的返回值是一个代表新 HTML 元素的 jQuery 对象。然后你可以使用 `html()`、`css()`\
  \ 以及其他方法进一步修改该元素。最后，如果你想将新元素添加到页面，首先需要选择宿主机——这可以是像 `<div>` 或 `<body>` 这样的元素。然后，`append()`\
  \ 方法会将新的 HTML 元素添加到其中。\n\n代码 25-7 创建一个新的 `<a>` 元素，然后设置其 `href` 属性使其成为链接。最后，将新链接添加到页面的\
  \ `<body>` 元素中。\n\n在代码 25-8 中使用了类似的方法。这次你使用新创建元素的 `appendTo()` 方法。作为参数，你再次需要选择一个\
  \ CSS 选择器，这次是你想要附加新 HTML 元素的现有元素。\n\n代码 25-7 和 25-8 都导致了图 25-9 所示的结果。\n\n![image](img/f967-01.jpg)\n\
  \n**图 25-9**\n\n如果你想移除元素，删除它们非常简单。一种比较原始的方法是删除它们。更干净的方法是选择元素然后调用 `remove()`。代码 25-9\
  \ 展示了这一点。\n\n### 事件处理\n\n到目前，所有代码都已执行。然而，还有其他的事件。以下列表显示了一些最常见的：\n\n* `blur()`：元素失去焦点。\n\
  * `change()`：元素发生变化。\n* `dblclick()`：元素被双击。\n* `focus()`：元素获得焦点。\n* `submit()`：表单被提交。\n\
