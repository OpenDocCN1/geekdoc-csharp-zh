  \ 19-36 显示了前一种情况的结果。\n\n![image](img/f757-01.jpg)\n\n**图 19-36**\n\n## 总结\n\n本章介绍了\
  \ ASP.NET 4.5 提供的两个卓越功能。作为 ASP.NET 一部分的成员和角色管理服务使得管理用户及其角色变得轻而易举。\n\n本章复习了成员和角色\
  \ API，以及同样利用这些 API 的控件。这些控件和 API 遵循与 ASP.NET 其他部分相同的数据提供程序模型。示例使用了 Microsoft SQL\
  \ Server Express 版本作为后端存储，但您可以轻松配置这些系统以与另一种类型的数据存储工作。\n\n使用 OAuth 和 OpenID 等标准，还可以连接到外部身份验证服务，如\
  \ Facebook、Twitter 和 Google 提供的服务。\n\n# 20\n\n## 安全\n\n## 本章内容\n\n*   使用基于 Windows\
  \ 和基于表单的身份验证\n*   管理程序化授权\n*   通过 IIS 实现安全\n\n## 本章的 WROX.COM 代码下载\n\n请注意，本章中的所有代码示例都可以作为书籍网站\
  \ [www.wrox.com](http://www.wrox.com) 上“下载代码”选项卡中本章代码下载的一部分。\n\n您用 ASP.NET 构建的每个页面并不是为了让\
  \ Internet 上的所有人都能开放并访问的。有时，您希望构建仅供您选择的特定组访问的应用程序页面或部分。出于这个原因，您需要本章解释的安全措施。它们可以帮助保护应用程序背后的数据以及应用程序本身免受欺诈使用。\n\
  \n*安全* 是一个非常广泛的术语。在应用程序构建过程的每一步，您都必须毫无疑问地意识到终端用户可能会尝试绕过您的锁定措施。您必须采取措施确保没有人可以接管应用程序或访问其资源。无论是涉及基本服务器控件还是访问数据库，您都应该仔细考虑您想要采用的安全级别来保护您自己。\n\
  \n如何将安全应用于您的应用程序是一个经过衡量的过程。例如，Internet 上一个向公众开放的单个 ASP.NET 页面，其安全要求与一个仅供特定人员访问的\
  \ ASP.NET 应用程序不同，因为后者处理的是机信息，例如信用卡号或医疗信息。\n\n第一步是针对当前任务应用适当的安全级别。由于您可以采取许多不同的操作来保护您的应用程序，所以您必须自己决定采用哪些措施。\n\
  \n请注意，书中贯穿讨论了安全。此外，两个章节专注于 ASP.NET 提供的框架，这些框架在本章中未讨论。第 18 章和第 19 章讨论了 ASP.NET 的成员和角色管理框架，以及该版本的个性化功能。这些主题是安全的方面，可以使构建安全的应用程序变得更容易。\n\
  \n\n\n\nASP.NET 通过应用程序服务器上的系列 `.config` 文件进行配置。这些基于 XML 的文件允许你轻松地更改 ASP.NET 的行为。将这些设置放置在基于\
  \ XML 的文件中是处理你所需的配置设置的理想方式。ASP.NET 配置文件的应用是分层级的。.NET Framework 了一个了一个名为 `machine.config`\
  \ 的服务器级配置文件文件，你可以在 `C:\\Windows\\Microsoft.NET\\Framework\\v4.0.*xxxxx*\\CONFIG`\
  \ 找到它。该文件夹包含 `machine.config` 文件。此文件在服务器级别提供 ASP.NET 应用程序设置，这意味着这些设置将应用于位于特定服务器上的每个\
  \ ASP.NET 应用程序。\n\n`web.config` 文件是另一个基于 XML 的配置文件，它位于 Web 应用程序的根目录下。在 `web.config`\
  \ 文件中应用的设置将覆盖更高层级 `machine.config` 文件中应用的同名设置。\n\n你甚至可以嵌套 `web.config` 文件，使得主应用程序\
  \ `web.config` 文件位于应用程序的根目录下，但额外的 `web.config` 文件位于应用程序的某些子目录中（参见图 20-1）。位于任何子目录中的\
  \ `web.config` 文件将取代根目录的 `web.config` 文件。因此，通过子目录的 `web.config` 文件应用的任何设置都会更改应用程序主\
  \ `web.config` 文件中设置的设置。\n\n![image](img/f760-01.jpg)\n\n**图 20-1**\n\n在本章的许多示例中，你使用\
  \ `web.config` 文件为你的应用程序应用所需的身份验证和授权机制。你也可以与 IIS 协作，直接为你的应用程序应用设置。\n\nIIS 是处理进入服务器的所有传入\
  \ HTTP 请求的 Web 服务器。你必须修改 IIS 以按照你的要求运行。只有当页面具有特定的文件扩展名（例如 `.aspx`）时，IIS 才会将请求交给\
  \ ASP.NET 引擎。在本章中你还将使用 IIS 7.x 和 8。\n\n### `<authentication>` \n\n你使用应用程序 `web.config`\
  \ 文件中的 `<authentication>` 节点来设置 ASP.NET 应用程序所需的身份验证类型：\n\n```\n <system.web>\n \
  \    <authentication mode=\"Windows|Forms|Passport|None\">\n\n     </authentication>\n\
  \  </system.web>\n```\n\n`<authentication>` 节点使用 `mode` 属性来设置要使用的身份验证形式。选项包括 `Windows`、`Forms`、`Passport`\
  \ 和 `None`。每个选项在表 20-1 中都有解释。\n\n| **PROVIDER** | **DESCRIPTION** |\n| --- | ---\
  \ |\n| `Windows` | Windows 身份验证与 IIS 验证一起使用。IIS 通过以下方式执行身份验证：基本、摘要或集成 Windows 身份验证。当\
  \ IIS 验证完成后，ASP.NET 使用身份验证的标识来授权访问。这是默认设置。 |\n| `Forms` | 未经过验证的请求将通过 HTTP 客户端重定向到到\
  \ HTML 表单。用户提供其登录信息并提交表单。如果应用程序验证了请求，系统将发布一个包含凭据或重新获取标识的密钥的表单。 |\n| `Passport` |\
  \ 微软提供的集中身份验证服务，为成员站点提供单登录和核心配置服务。这种身份验证模式已由微软在 2005 年底“淡化”（换句话废弃）。 |\n| `None`\
  \ | 使用此设置无身份验证模式。 |\n\n**表 20-1**\n\n如你所示，你有几种方法可以为你的 ASP.NET 应用程序构建身份验证/授权模型。下一节将检查\
  \ Windows 身份验证模式。\n\n### 基于 Windows 的身份验证\n\n基于 Windows 的身份验证是在托管 ASP.NET 应用程序的\
  \ Windows 服务器与客户端之间处理的。在基于 Windows 的身份验证模型中，请求直接交给 IIS 提供身份验证。这种验证在内网环境中非常有用，你可以让服务器完全处理身份验证过程——特别是在用户已经登录网络的环境中。在这种情况下，你只需获取并利用已有的凭据进行授权过程即可。\n\
  \nIIS 首先从域登录中获取用户的凭据。如果此过程失败，IIS 将显示弹出对话框，以便用户可以输入或重新输入其登录信息。要设置你的 ASP.NET 应用程序与基于\
  \ Windows 的身份验证工作，请从创建一些用户和组开始。\n\n#### 创建用户\n\n你利用 Windows 身份验证的特性，允许提供域登录的特定用户访问你的应用程序或应用程序的一部分。因为可以使用这种身份验证，ASP.NET\
  \ 使处理部署在内网环境中的应用程序变得非常简单。如果用户以域用户身份登录到本地计算机，当她访问该域中的网络计算机时，不需要再次身份验证。\n\n以下步骤显示了如何创建用户。需要注意的是，你必须拥有足够的权限被授权在服务器上创建用户。如果你已授权，创建用户的步骤如下：\n\
  \n1.  在 Windows 7 或 8 中，选择开始 ![image](img/Ar.jpg) 控制面板 ![image](img/Ar.jpg) 系统和安全\
  \ ![image](img/Ar.jpg) 管理工具 ![image](img/Ar.jpg) 计算机。如果你使用的是 Windows Server 2003、2008\
  \ 或 2012，选择开始 ![image](img/Ar.jpg) 控制面板 ![image](img/Ar.jpg) 管理工具 ![image](img/Ar.jpg)\
  \ 计算机。任何一种都会打开计算机工具。它管理并控制本地 Web 服务器。你可以使用此工具完成许多操作，但这里的重点是创建用户。\n2.  展开系统工具节点。\n\
  3.  展开本地用户和组节点。\n4.  选择用户文件夹。你会看到类似于图 20-2 所示的结果。![image](img/f762-01.jpg)\n   \
  \ **图 20-2**\n\n5.  右键点击用户文件夹并选择新建用户。新建用户窗口，如图 20-3 所示。![image](img/f762-02.jpg)\n\
  \    **图 20-3**\n\n6.  为用户命名、密码并说明这是一个测试用户。在示例中，用户名为 Bubbles。\n7.  取消勾选“用户在下次登录时更改密码”框框。\n\
  8.  点击创建按钮。你的测试用户已被创建并出现在计算机管理工具的用户文件夹中，如图 20-4 所示。![image](img/f763-01.jpg)\n \
  \   **图 20-4**\n\n现在创建一个页面来与此用户交互。\n\n#### 对用户进行验证和授权\n\n现在创建一个允许用户进入的应用程序。你通过应用程序的\
  \ `web.config` 文件来控制哪些用户允许访问站点，哪些用户不允许访问。\n\n将列表 20-1 中所示的部分添加到你的 `web.config` 文件中。\n\
  \n\n\n\n\n在本示例中，`web.config` 文件通过`<authentication>` 元素的 `mode` 属性配置应用程序以使用基于 Windows\
  \ 的身份验证。此外，`<authorization>` 元素用于定义允许访问应用程序的用户或组的特定信息。在这种情况下，`<deny>` 元素指定拒绝所有用户（即使他们通过了身份验证）访问应用程序。使用`<allow>`\
  \ 元素允许特定用户并没有太大意义，但对于本示例，请保持其原样。图 20-5 显示了结果结果。\n\n![image](img/f763-02.jpg)\n\n\
  **图 20-5**\n\n任何尝试访问该网站的终端用户（无论是否通过了身份验证）都会在其浏览器窗口中看到一个巨大的“访问被拒绝（Access is denied）”语句，这正是你希望那些不允许访问应用程序的用户看到的！\n\
  \n然而，在大多数情况下，你希望允许至少部分用户访问应用程序。使用 `web.config` 文件中的`<allow>` 元素来允许特定用户。语法如下：\n\n\
  ```\n <allow users=\"Domain\\Username\" />\n```\n\n列表 20-2 显示了如何允许用户访问。\n\n尽管通过使用`<deny>`元素拒绝了所有用户（即使通过身份验证的用户）的访问，但`<allow>`元素中的定义具有优先级。在本示例中，允许了一个用户——Bubbles——访问。\n\
  \n现在，如果你以用户 Bubbles 的身份登录到客户端计算机并在浏览器中运行该页面，你就可以访问应用程序。\n\n### 仔细观察 <allow> 和 <deny>\
  \ 节点\n\n`<allow>` 和 `<deny>` 节点允许你不仅处理特定的用户，还可以处理组。这些元素支持在表 20-2 中定义的属性。\n\n| 属性\
  \ | 说明 |\n| --- | --- |\n| `Users` | 允许你通过域和/或名称指定用户 |\n| `Roles` | 允许你指定允许或拒绝访问的组\
  \ |\n| `Verbs` | 允许你指定允许或拒绝访问的 HTTP 传输方法 |\n\n**表 20-2**\n\n使用这些属性中的任何一个时，可以使用星号（`*`）指定所有用户：\n\
  \n```\n <allow roles=\"*\" />\n```\n\n在本示例中，所有角色都被允许访问应用程序。你可以配合这些属性使用的另一个符号是问号（`?`），它代表所有匿名用户。例如，如果你想阻止所有匿名用户访问应用程序，请使用以下结构：\n\
  \n```\n <deny users=\"?\" />\n```\n\n在`<allow>`或`<deny>`元素上使用 `users`、`roles` 或\
  \ `verbs` 属性时，你可以通过逗号分隔值来指定多个条目。如果你要允许多个一个用户，可以将这些用户拆分为不同的元素，如下所示：\n\n```\n <allow\
  \ users=\"MyDomain\\User1\" />\n  <allow users=\"MyDomain\\User2\" />\n```\n\n或者你可以使用以下方法：\n\
  \n```\n <allow users=\"MyDomain\\User1, MyDomain\\User2\" />\n```\n\n在定义多个角色和动词时也使用相同的结构。\n\
  \n### 对组进行身份验证和授权\n\n你可以定义允许或拒绝访问你的应用程序或应用程序资源的个人组。你的服务器可以包含许多不同的组，每个组都可以包含任意数量的用户。也存在单个用户属于多个组的可能性。打开“计算机管理”实用工具以访问你操作的服务器上定义的组列表。只需点击计算机管理实用工具中的“组”文件夹，组列表列表，如图\
  \ 20-6 所示。\n\n![image](img/f765-01.jpg)\n\n**图 20-6**\n\n右键点击“组”文件夹并选择“新建组”。出现“新建组”窗口（参见图\
  \ 20-7）。\n\n![image](img/f765-02.jpg)\n\n**图 20-7**\n\n要创建一个组，请给它一个名称和描述；然后点击“添加”按钮并选择你想加入该组的用户。创建组后，你可以这样允许它访问应用程序：\n\
  \n```\n <allow roles=\"MyGroup\" />\n```\n\n你可以在`<allow>`或`<deny>`元素中使用 `roles`\
  \ 属性来处理你创建的组或已存在的特定组。\n\n### 对 HTTP 传输方法进行身份验证和授权\n\n除了对特定用户或用户组进行身份验证和授权外，你还可以授权或拒绝通过特定\
  \ HTTP 传输协议的请求。你通过`<allow>`和`<deny>`元素中的 `verbs` 属性来实现：\n\n```\n <deny verbs=\"\
  GET, DEBUG\" />\n```\n\n在本示例中，使用 HTTP `GET` 或 HTTP `DEBUG` 协议进入的请求将被拒绝访问网站。`verbs`\
  \ 属性的可能值包括 `POST, HEAD` 和 `DEBUG`。\n\n### 集成 Windows\n\n到为止，你一直在使用默认的集成 Windows\
  \ 模式。如果你在内网环境中工作且每个客户端都是 Windows（这是身份验证支持的唯一系统），这样做很好。集成 Windows 身份验证以前被称为 NTLM\
  \ 或 Windows 挑战/响应。这种身份验证模型让客户端通过向托管 ASP 的服务器发送凭据的哈希值来证明其身份。除了 Microsoft Active Directory\
  \ 之外，如果客户端使用的是 Microsoft Internet Explorer，还可以使用 Kerberos。\n\n### 基本身份验证\n\n另一个选项是使用基本身份验证，它同样需要客户端提供用户名和密码。基本身份验证的优点是它是\
  \ HTTP 规范的一部分，因此受大多数浏览器的支持。基本身份验证的负面影响它是将用户名和密码以明文传递给服务器，这意味着用户名和密码对于窥探的眼睛来说非常可见。因此，结合*安全套接层\
  \ (Secure Sockets Layer)* 使用基本身份验证是非常重要的。\n\n如果你在使用 Windows Vista/Windows Server\
  \ 2008 (IIS 7.0)、Windows 7/Windows Server 2008 R2 (IIS 7.5) 或 Windows 8/Windows\
  \ Server 2012 (IIS 8.0)，找到启用基本身份验证的选项并不简单。相反，你首先必须启用 IIS 使用基本身份验证：选择“开始”、“控制面板”、“程序”、“程序功能”、“启用或关闭\
  \ Windows 功能”。在提供的对话框中，导航到“Internet 信息服务”部分并展开，直到到达“网站 服务”。在这里，选择“基本身份验证”选项并点击确定进行安装。图\
  \ 20-8 显示了该选项。\n\n![image](img/f766-01.jpg)\n\n**图 20-8**\n\n安装此选项后，你就可以返回 Internet\
  \ 信息服务 (IIS) 管理器，并在你关注的虚拟目录的 IIS 部分中选择“身份验证”选项。从那里，高亮“基本身份验证”选项并从“操作”窗格中选择“启用”，如启用此功能后图\
  \ 20-9 所示。\n\n![image](img/f766-02.jpg)\n\n**图 20-9**\n\n\n\n\n\n如果你正在使用 `IIS 6`（甚至更早版本）为应用程序实现基本身份验证（Basic\
  \ authentication），你需要调出 `IIS` 并打开你正在操作的网站的`Properties（属性）窗口。选择`Directory Security（目录安全）选项卡，点击`Anonymous\
  \ Access and Authentication Control（匿名访问和验证控制）框中的`Edit（编辑）按钮。将打开`Authentication\
  \ Methods（身份验证方法）对话框。\n\n取消勾选底部的`Integrated Windows Authentication`，并选中上面的`Basic\
  \ Authentication`（参见图 20-10）。当你这样做时，会收到警告，提示该方法以明文传输用户名和密码。\n\n![image](img/f767-01.jpg)\n\
  \n图 20-10\n\n点击对话框中的 OK 完成。现在你的应用程序使用的是基本身份验证而不是集成 Windows 身份验证。\n\n## 摘要身份验证 (Digest\
  \ Authentication)\n\n摘要身份验证是你在本章中将探索的最后一种模式。该模型缓解了基本身份验证中以明文传递客户端凭据的问题。相反，摘要身份验证在将凭据发送到应用程序服务器之前，使用算法对凭据进行加密。\n\
  \n要使用摘要身份验证，你需要一个 Windows 域控制器。摘要身份验证出现的主要问题之一是它不支持所有平台，并且需要符合 `HTTP 1.1` 规范的浏览器。然而，摘要身份验证不仅与防火墙配合良好，而且兼容代理服务器。\n\
  \n如果你正在使用 `IIS 7` 或更高版本，你需要像安装基本身份验证一样安装摘要身份验证。安装后，你可以在`IIS Manager（IIS 管理器）`中的`Authentication（身份验证）`部分找到此选项并能够启用它。\n\
  \n对于 `IIS 6` 或更早版本，你可以在同一个`Authentication Methods`窗口中为应用程序选择摘要身份验证——只需在属性窗口中勾选`Digest\
  \ Authentication`复选框。\n\n## 基于表单的身份验证 (Forms-Based Authentication)\n\n基于表单的身份验证是验证用户以访问整个应用程序或应用程序内特定资源的常用模式。使用它可以让你将登录表单直接放在应用程序中，这样终端用户只需在浏览器自带的\
  \ HTML 表单中输入其用户名和密码。基于表单的身份验证的一个负面方面是，除非使用 SSL，否则用户名和密码将以明文发送。\n\n在你的 Web 中实现基于表单的身份验证简单且直接。首先，对应用程序的`web.config`文件进行一些修改，如列表\
  \ 20-3 所示。\n\n你必须将此结构应用到`web.config`文件中。使用前面描述的`<authorization>`元素，你拒绝所有匿名用户访问应用程序。只有经过验证的用户才允许访问应用程序中的任何页面。\n\
  \n如果请求者未通过身份验证，则将执行`<authentication>`元素中定义的内容。`mode`属性的值设置为`Forms`，以便为你的 Web 应用程序采用基于表单的身份验证。下一个指定的属性是`loginUrl`，它指向包含应用程序登录表单的页面。在本示例中，指定的值为`login.aspx`。如果尝试访问应用程序的终端用户未通过验证，其请求将重定向到`login.aspx`，以便用户进行身份验证并授权后继续。在提供有效凭据后，用户将返回到他在应用程序中最初请求的位置。这里使用的最后一个属性是`path`。它仅指定了保存用于持久授权用户访问令牌的\
  \ cookie 位置。在大多数情况下，你希望将值留为`/`。表 20-3 描述了`<forms>`元素的每个可能的属性。\n\n| 属性 (ATTRIBUTE)\
  \ | 描述 (DESCRIPTION) |\n| --- | --- |\n| `name` | 此名称分配给保存的 cookie，以便在每次请求之间记住用户。默认值为`.ASPXAUTH`。\
  \ |\n| `loginUrl` | 指定当未找到有效的身份验证 cookie 时，请求重定向到的用于登录的 URL。默认值为`login.aspx`。 |\n\
  | `protection` | 指定你想对身份验证 cookie 采用的保护程度。四个可用设置为：<br>* `All`：应用程序同时使用数据验证和加密来保护\
  \ cookie。这是默认设置。<br>* `None`：对 cookie 不应用任何加密。<br>* `Encryption`：对 cookie 进行加密，但不对其进行数据验证。以这种方式使用的\
  \ cookie 可能会受到明文攻击。<br>* `Validation`：`Encryption`设置的相反。执行数据验证，但不对 cookie 进行加密。\
  \ |\n| `path` | 指定应用程序颁发的 cookie 的路径。在大多数情况下，你希望使用`/`，这是默认设置。 |\n| `timeout` | 指定\
  \ cookie 过期后的时间（分钟为单位）。默认值为`30`。 |\n| `cookieless` | 指定在处理身份验证/授权过程时，基于表单的身份验证过程是否应该使用\
  \ cookie。 |\n| `defaultUrl` | 指定默认 URL。 |\n| `domain` | 指定与形式身份验证 cookie 一同发送的域名。\
  \ |\n| `slidingExpiration` | 指定是否对 cookie 采用滑动过期。如果设置为`True`，则每次向服务器发送请求时 cookie\
  \ 的过期时间都会重置。默认值为`False`。 |\n| `enableCrossAppsRedirect` | 指定是否允许跨应用程序重定向。 |\n| `requireSSL`\
  \ | 指定传输身份验证信息时是否需要安全套层 (SSL) 连接。 |\n\n表 20-3\n\n在`web.config`文件准备好后，下一步是创建一个用户可以访问的典型页面。列表\
  \ 20-4（本章中的 Default.aspx）展示了一个简单的页面。\n\n如你所见，此页面简单地向浏览器写入了`Hello World`。表单身份验证的真正威力体现在列表\
  \ 20-5（本章中的 Login.aspx）页面中。\n\n`Login.aspx`具有两个简单的`TextBox`控件和一个`Button`控件，要求用户提交其用户名和密码。`Button1_Click`事件使用了`FormsAuthentication`类的`RedirectFromLoginPage`方法。该方法的作用正如其名——将请求从`Login.aspx`重定向到原始资源。\n\
  \n`RedirectFromLoginPage`接受两个参数。第一个是用户名，用于 cookie 身份验证。此参数实际上并不映射到账户，而是用于 ASP.NET\
  \ 的 URL 授权功能。第二个参数指定是否应发布持久 cookie。如果设置为`True`，终端用户在不同的浏览器会话之间不需要再次登录应用程序。\n\n使用你构建的三个页面，对`Default.aspx`页的每次请求列表\
  \ 20-4 都会导致 ASP.NET 检查是否已放置正确的身份验证令牌。如果没有找到正确的令牌，请求将被定向到指定的登录页面（在本示例中为`Login.aspx`）。查看浏览器中的\
  \ URL，你可以看到 ASP.NET 正在使用查询字符串值来记住在用户授权继续后后返回的位置：\n\n```\n http://localhost:35089/Security/Login.aspx?ReturnUrl=%2fSecurity%2fDefault.aspx\n\
  ```\n\n\n\n\n\n在这里，查询字符串 `ReturnUrl` 使用的值为初始请求的文件夹和页面。\n\n更仔细查看列表 20-5 中的 `Login.aspx`\
  \ 页面，并注意放置在两个文本框中的值会经过检查，以确保它们符合特定的用户名和密码。如果符合，将调用 `RedirectFromLoginPage` 方法；否则，将使用\
  \ `Response.Write()` 语句。在大多数情况下，你并不希望在代码中硬编码用户名和密码。有许多其他方法可以检查用户名和密码是否来自授权用户。以下是其他一些选项。\n\
  \n### 根据 web.config 文件中包含的值进行验证\n\n上一个示例并不是处理用于身份验证的用户名和密码的最佳方法。将它们直接硬编码到应用程序中永远不是好主意。快速查看如何将这些值存储在\
  \ `web.config` 文件本身。\n\n你在列表 20-3 中过的 `web.config` 文件中的 `<forms>` 元素也可以接受子元素。子元素\
  \ `<credentials>` 允许你直接在 `web.config` 文件中指定用户名和密码组合。你可以从几种方法中选择添加这些值。列表 20-6 显示了最简单的方法。\n\
  \n引入 `<credentials>` 元素是为了将用户及其密码添加到配置文件中。`<credentials>` 接受单个属性 — `passwordFormat`。`passwordFormat`\
  \ 的可能值为 `Clear`、`MD5` 和 `SHA1`。下面的列表描述了这些选项的每一个一个：\n\n- `Clear`：密码以明文形式存储。用户密码直接与此值进行比较，不进行进一步转换。\n\
  - `MD5`：密码使用消息摘要 5 (MD5) 哈希摘要进行存储。当验证凭据时，使用 MD5 算法对用户密码进行哈希处理，并与此值进行相等性比较。明文密码永远不会存储或比较。此算法的性能优于\
  \ SHA1，但安全性较低。\n- `SHA1`：密码使用 SHA1 哈希摘要进行存储。当验证凭据时，使用 SHA1 算法对用户密码进行哈希处理，并与此值进行相等性比较。明文密码永远不会存储或比较。使用此算法可获得最佳安全性。\n\
  \n在列表 20-6 的示例中，你使用了 `Clear` 设置。这种方法不是安全的，但它是用于演示目的。`<credentials>` 的子元素是 `<user>`；这就是你使用\
  \ `name` 和 `password` 属性定义授权用户的用户名和密码的地方。\n\n下一步是更改之前显示的 `login.aspx` 页面上的 `Button1_Click`\
  \ 事件，如列表 20-7 所示。\n\n在这个示例中，你只需使用 `Authenticate()` 方法让你的 ASP.NET 页面查看存储在 `web.config`\
  \ 文件中的凭据进行验证。`Authenticate()` 方法两个参数 — 用于检查的用户名和密码。如果凭据查找成功，将调用 `RedirectFromLoginPage`\
  \ 方法。\n\n最好不要像前面的示例那样将用户的密码以明文存储在 `web.config` 文件中。相反，使用可用的哈希功能之一，这样就可以让用户的密码避开窥探。要做到这一点，只需将哈希后的密码存储在配置文件中，如列表\
  \ 20-8 所示。\n\n使用这种结构使得即使是开发者无法发现密码，因为明文密码永远不会被使用。`login.aspx` 页面中的 `Authenticate()`\
  \ 方法使用 SHA1 对密码进行哈希（因为这是 `web.config` 文件 `<credentials>` 节点中指定的方法），并比较两个哈希值是否匹配。如果找到匹配项，则用户被授权继续。\n\
  \n当使用 SHA1 或 MD5 时，你所做的更改是在 `web.config` 文件中，其他地方都不用。你不需要对登录页面或应用程序中的任何其他页面进行任何更改。然而，为了存储哈希密码，你使用\
  \ `FormsAuthentication.HashPasswordForStoringInConfigFile()` 方法（.NET Framework 中较长的方法名之一）。你以以下方式使用该方法：\n\
  \n```\nFormsAuthentication.HashPasswordForStoringInConfigFile(TextBox2.Text, \"\
  SHA1\")\n```\n\n### 根据数据库中的值进行验证\n\n另一种获取用户名/密码组合的常用方法是从从某种数据存储中获取它们。这允许你例如，将用户输入的凭据与存储在\
  \ Microsoft SQL Server 中的值进行比对。列表 20-9 提供了此类凭据检查的示例代码。\n\n保持之前示例中的其他所有内容不变，除了 `Login.aspx`\
  \ 页面。你现在可以根据存储在 SQL Server 中的数据验证用户名和密码。在 `Button1_Click` 事件中，建立了到 SQL Server 的连接。（出于安全考虑，你应该将连接字符串存储在\
  \ `web.config` 文件中。）传入两个参数 — 来自 `tbUsername` 和 `tbPassword` 的输入。如果返回结果，则调用 `RedirectFromLoginPage()`\
  \ 方法。\n\n### 使用表单身份验证登录控件\n\n你已经看到如何将 ASP.NET 表单身份验证与标准服务器控件（如 TextBox 和 Button）配合使用。你也可以自定义开发的框架中使用服务器控件，例如登录控件。这确实显示了\
  \ ASP.NET 的强大之处 — 你组合许多部分来构建你需要的解决方案。列表 20-10 显示了使用登录控件的修改后的 `Login.aspx` 页面。\n\n\
  由于页面上没有按钮控件，你使用登录控件的 `OnAuthenticate` 属性指向服务器端事件 — `Login1_Authenticate()`。该事件处理授权查找（尽管这些值是硬编码的）。登录控件的用户名框可以通过\
  \ `Login1.UserName` 声明访问，密码可以通过 `Login1.Password` 访问。你使用 `Login1.RememberMe` 属性指定是否持久身份验证\
  \ Cookie，以便用户下次访问时被记住。\n\n这个示例比使用 TextBox 和 Button 控件创建自己的登录表要简单。你可以给登录控件一个提供的预定义外观。你也可以更容易地获取登录控件的子控件属性。最终，在你的\
  \ ASP.NET 应用程序中使用哪些方法完全取决于你。\n\n#### 详细查看 FormsAuthentication 类\n\n从本章表单验证部分的各种示例中可以看出，很多操作取决于\
  \ `FormsAuthentication` 类。因此，你应该了解该类的本质。\n\n`FormsAuthentication` 提供了许多方法和属性，允许你读取和控制身份验证\
  \ Cookie 以及其他信息（例如请求的返回 URL）。表 20-4](#Chapter20.xhtml_table20-4) 详细介绍了 `FormsAuthentication`\
  \ 类可用的一些方法和属性。\n\n| 方法/属性 | 描述 |\n| --- | --- |\n| `Authenticate` | 此方法用于验证存储在配置文件（例如\
  \ `web.config` 文件）中的凭据。 |\n| `Decrypt` | 返回从 HTTP Cookie 中检索的有效加密身份验证票的实例，其类型为 `FormsAuthenticationTicket`\
  \ 类实例。 |\n\n\n\n\n\n| `Encrypt` | 创建一个包含有效加密身份验证票据的字符串，票据可用于 HTTP cookie。 |\n| `FormsCookieName`\
  \ | 返回当前应用的 cookie 名称。 |\n| `FormsCookiePath` | 返回当前应用的 cookie 路径（cookie 的位置）。 |\n\
  | `GetAuthCookie` | 为指定的用户提供身份验证 cookie。 |\n| `GetRedirectUrl` | 返回用户在登录页面授权后被重定向的\
  \ URL。 |\n| `HashPasswordFor Storing InConfigFile` | 为提供的字符串密码创建哈希值。此方法接受两个参数——一个是密码，另一个是要对字符串执行的哈希操作类型。可能的哈希值包括\
  \ `SHA1` 和 `MD5`。 |\n| `Initialize` | 通过读取 `web.config` 文件中的配置设置，并获取在应用实例中使用的 cookie\
  \ 和加密密钥，对 `FormsAuthentication` 类进行初始化。 |\n| `RedirectFromLogin Page` | 将 HTTP 请求重定向回原始请求页面。这应该在用户获得授权继续后执行。\
  \ |\n| `RenewTicketIfOld` | 有条件地更新 `FormsAuthenticationTicket` 实例上的滑动过期时间。 |\n|\
  \ `RequireSSL` | 指定 cookie 是否仅通过 SSL (HTTPS) 传输。 |\n| `SetAuthCookie` | 创建身份验证票据并将其附加到输出响应的\
  \ cookie 中。 |\n| `SignOut` | 移除身份验证票据。 |\n| `SlidingExpiration` | 提供一个 `Boolean`\
  \ 值，指示是否启用了滑动过期。 |\n\n表 20-4\n\n## 对特定文件和文件夹进行身份验证\n\n你可能不想要求应用程序中的每个页面或资源都提供凭据。例如，你可能有一个公共的网站，任何人都可以无需凭据即可访问其页面，尽管你的应用程序中可能包含一个管理部分，该部分可能需要身份验证/授权措施。\n\
  \nURL 授权允许你使用 `web.config` 文件来应用所需的设置。通过 URL 授权，你可以将任何身份验证措施仅应用于特定的文件或文件夹。代码列表 20-11\
  \ 显示了锁定单个文件的示例。\n\n此 `web.config` 文件的构造在 Web 应用程序对公众开放的同时，同时也锁定了应用程序包含的单个文件——`AdminPage.aspx`\
  \ 页面。你通过`<location>`元素实现此锁定。`<location>` 接受单个属性 (`path`) 来指定在 `web.config` 文件中`<system.web>`\
  \ 部分定义的资源。\n\n在示例中，`<authentication>` 和 `<authorization>` 元素用于为 `AdminPage.aspx`\
  \ 页面提供身份验证和授权详细信息。对于此页面，采用了 Windows 身份验证，允许访问的用户是 `Win8Pro-En` 域中的 `Christian`。你可以在\
  \ `web.config` 文件中包含任意数量的 `<location>` 部分。\n\n## 程序化授权\n\n到目前为止，你已经看到了许多身份验证示例，这些示例仅是为应用程序中的特定页面或文件夹提供通用的授权。然而，你可能希望对页面上的某些项目提供更细粒度的授权措施。例如，你可能只对具有显式\
  \ Windows 角色的用户提供特定文档的链接。其他用户可能会看到其他内容。你可能还为指定用户提供额外的注释或信息，而其他用户看到信息的精简版本。无论出于什么原因，通过处理对象，这种基于角色的授权实践在\
  \ ASP.NET 中都是可以实现的。\n\n你可以使用 `Page` 对象的 `User` 属性，它提供一个 `IPrincipal` 对象的实例。`User`\
  \ 属性提供一个方法方法和一个属性：\n\n* `Identity`: 此属性提供一个 `System.Security.Principal.IIdentity`\
  \ 对象的实例，供你获取已验证用户的特定属性。\n* `IsInRole`: 此方法接受单个参数，即系统角色的字符串表示。它返回一个 `Boolean` 值，指示用户是否在指定的角色中。\n\
  \n### 使用 User.Identity \n\n`User.Identity` 属性允许你处理有关授权用户的某些特定上下文信息。在你的 ASP.NET 应用程序中使用该属性，让你能够根据对象提供的信息做出资源访问决策。\n\
  \n通过 `User.Identity`，你可以访问用户名、身份验证类型以及用户是否已通过身份验证。表 20-5 详细说明了通过 `User.Identity`\
  \ 提供的属性。\n\n| 属性 | 描述 |\n| --- | --- |\n| `AuthenticationType` | 提供当前用户的身份验证类型。示例值包括\
  \ `Basic, NTLM, Forms` 和 `Passport`。 |\n| `IsAuthenticated` | 返回一个 `Boolean` 值，指定用户是否已通过身份验证。\
  \ |\n| `Name` | 提供用户的用户名以及用户域（仅当其使用 Windows 账户登录时）。 |\n\n表 20-5\n\n关于使用 `User` 对象的示例，请查看检查用户的登录名。要实现这一点，你使用的代码与代码列表\
  \ 20-12 中显示的类似。\n\n你可以使用 `User.Identity` 对象完成的另一个任务是检查用户是否通过你的应用程序进行了身份验证，如代码列表\
  \ 20-13 所示。这为你提供一个指示用户是否已通过身份验证的 `Boolean` 值。你可以在 `if/then` 语句中使用 `IsAuthenticated`\
  \ 方法，如代码列表 20-14 所示。\n\n你还可以使用 `User` 对象来检查用户的身份验证类型。你通过 `AuthenticationType` 属性来实现，如代码列表\
  \ 20-15 所示。结果通常为 `Basic, NTLM` 或 `Forms`。\n\n### 使用 User.IsInRole()\n\n如果你使用的是基于\
  \ Windows 的身份验证，可以检查已验证的用户是否处于特定角色。例如，你可能只想为位于 `Subscribers` 组的用户显示特定信息。要实现这一点，你可以使用\
  \ `User` 对象的 `IsInRole` 方法，如代码列表 20-16 所示。\n\n`IsInRole` 方法的参数提供表示域和组（Windows 角色）的字符串值。在这种情况下，你指定来自\
  \ `Win8Pro-En` 域的 `Subscribers` Windows 角色的用户允许查看非该角色用户可见的信息。\n\n另一种可能性是指定你可以使用的某些内置组。Windows\
  \ 了一系列内置账户，如 Administrator、Guest 和 User。你有两种方式访问这些内置账户。一种是直接带域指定内置账户：\n\n```\nUser.IsInRole(\"\
  Win8Pro-En\\Administrator\")\n```\n\n另一种可能性是使用 `BUILTIN` 关键字：\n\n```\nUser.IsInRole(\"\
  BUILTIN\\Administrator\")\n```\n\n### 使用 WindowsIdentity 提取更多信息\n\n到目前为止，在处理用户身份信息时，你使用的是\
  \ ASP.NET 默认提供的标准 `Identity` 对象。如果你正在处理基于 Windows 的身份验证，你还可以选择使用 `WindowsIdentity`\
  \ 对象和其他。为了访问这些更丰富的对象，请在你的应用程序中创建 `System.Security.Principal` 对象的引用。\n\n\n\n\n\n\
  与前几个示例中的 `Identity` 对象结合使用，这些额外的对象使得某些任务变得更加简单。例如，如果你正在处理角色，`System.Security.Principal`\
  \ 提供了对 `WindowsBuiltInRole` 枚举的访问。\n\n列表 20-17 是使用 `WindowsBuiltInRole` 枚举的一个示例。\n\
  \n你不需要指定域和角色的字符串值，而是可以使用 `WindowsBuiltInRole` 枚举来轻松地访问应用程序服务器上的特定角色。在处理此枚举和其他枚举时，你还可以利用\
  \ IntelliSense（参见图 20-11）来帮助你轻松做出选择。\n\n![image](img/f780-01.jpg)\n\n**图 20-11**\n\
  \n`WindowsBuiltInRole` 枚举中的角色包含以下：\n\n* AccountOperator（账户操作员）\n* Administrator（管理员）\n\
  * BackupOperator（备份操作员）\n* Guest（来客）\n* PowerUser（高级用户）\n* PrintOperator（打印操作员）\n\
  * Replicator（复制器）\n* SystemOperator（系统操作员）\n* User（用户）\n\n使用 `System.Security.Principal`，你可以访问\
  \ `WindowsIdentity` 对象，它比处理默认的 `Identity` 对象要丰富得多。列表 20-18 列出了你可以通过 `WindowsIdentity`\
  \ 对象获取的一些额外信息。\n\n在此示例中，创建了一个 `WindowsIdentity` 对象的实例，并填充了访问应用程序的用户的当前身份。然后，你就可以访问许多通过\
  \ `Response.Write()` 语句写入浏览器的属性。显示的列表显示了有关当前用户凭据的信息，例如用户是否经过身份验证、是匿名用户，还是在来客账户或系统账户（如所使用的应用程序池账户）下运行。它还提供了用户的身份验证类型和登录名称。图\
  \ 20-12 显示了结果。\n\n![image](img/f782-01.jpg)\n\n**图 20-12**\n\n## 身份验证与冒充 (IDENTITY\
  \ AND IMPERSONATION)\n\n默认情况下，ASP.NET 在具有有限权限的账户下运行。例如，你可能会发现尽管该账户可以访问网络，但无法对网络上的任何其他计算机进行身份验证。\n\
  \n账户设置位于 `machine.config` 文件中：\n\n```\n <processModel\n   enable=\"true\"\n   userName=\"\
  machine\"\n   password=\"AutoGenerate\" />\n```\n\n这些设置强制 ASP.NET 在系统账户（ASP.NET\
  \ 或 Network Service）下运行。实际上是通过包含值 `machine` 的 `userName` 属性指定的。该属性的另一个可能值是 `system`。以下是它们的含义：\n\
  \n* `machine`：最安全的设置。你应该在有充分理由的情况下才更改此值。它是理想的选择，主要因为它强制 ASP.NET 账户在最少的权限下运行。\n*\
  \ `system`：强制 ASP.NET 在本地 SYSTEM 账户下运行，该账户具有更高的权限来访问网络和文件。\n\n在 `machine.config`\
  \ 或 `web.config` 文件中使用 `<processModel>` 指定你选择的账户也是可能的：\n\n```\n <processModel\n\
  \   enable=\"true\"\n   userName=\"MySpecifiedUser\"\n   password=\"MyPassword\"\
  \ />\n```\n\n在此示例中，ASP.NET 在指定的管理员或用户账户下运行，而不是默认的 ASP.NET 或 Network Service 账户。它继承该账户提供的所有权限。你应该考虑对文件的此部分进行加密。第\
  \ 28 章 介绍了配置文件的部分的加密。\n\n你还可以通过 `web.config` 文件中的 `<identity>` 元素更改 ASP.NET 在指定运行账户下的行为。`web.config`\
  \ 文件中的 `<identity>` 元素允许你开启冒充 (impersonation)。冒充使 ASP.NET 使用另一个用户的权限作为特定会话的进程运行。详细来说，冒充允许\
  \ ASP.NET 在向应用程序发送请求的实体账户下运行。要启用此冒充功能，你使用 `<identity>` 元素中的 `impersonate` 属性，如下所示：\n\
  \n```\n <configuration>\n     <system.web>\n        <identity impersonate=\"true\"\
  \ />\n     </system.web>\n  </configuration>\n```\n\n默认情况下，`impersonate` 属性设置为 `False`。将此属性设置为\
  \ `True` 可确保 ASP.NET 在向应用程序请求的人的账户下运行。如果请求者是匿名用户，则 ASP.NET 在 `IUSR_MachineName`\
  \ 账户下运行。要查看此效果，请运行列表 20-18 所示的示例，但这次开启了冒充（`True`）。你得到的用户名不再是 `IIS APPPOOL\\DefaultAppPool`，而是请求页面的用户名称——在此示例中为\
  \ `Win8Pro-EN\\Christian`——如图 20-13 所示所示。当然，这需要该用户具有访问 ASP.NET 的权限。\n\n![image](img/f783-01.jpg)\n\
  \n**图 20-13**\n\n```\n <system.Server>\n    <validation IntegratedMode=\"false\"\
  \ />\n  </system.Server>\n```\n\n你可以通过 `web.config` 文件中的 `<identity>` 元素映射 ASP.NET。你还可以选择通过指定的账户运行\
  \ ASP.NET：\n\n```\n <identity impersonate=\"true\" userName=\"MySpecifiedUser\"\
  \ password=\"MyPassword\"/>\n```\n\n如所示，你可以通过 `userName` 和 `password` 属性指定账户。这些值以明文形式存储在\
  \ `web.config` 中。查看根 `web.config`，可以看到 ASP.NET 在完全信任下运行，这意味着它具有访问资源的高权限。设置如下：\n\n\
  ```\n <system.web>\n\n      <location allowOverride=\"true\">\n          <system.web>\n\
  \              <securityPolicy>\n                  <trustLevel name=\"Full\" policyFile=\"\
  internal\"/>\n                  <trustLevel name=\"High\" policyFile=\"web_hightrust.config\"\
  />\n                  <trustLevel name=\"Medium\" policyFile=\"web_mediumtrust.config\"\
  />\n                  <trustLevel name=\"Low\" policyFile=\"web_lowtrust.config\"\
  />\n                  <trustLevel name=\"Minimal\" policyFile=\"web_minimaltrust.config\"\
  />\n              </securityPolicy>\n              <trust level=\"Full\" originUrl=\"\
  \"/>\n              <fullTrustAssemblies />\n              <partialTrustVisibleAssemblies\
  \ />\n          </system.web>\n      </location>\n\n  </system.web>\n```\n\nASP.NET\
  \ 的信任级别有五种可能的设置：`Full、High、Medium、Low` 和 `Minimal`。你通过 `<trust>` 元素的 `level` 属性指定所应用的信任级别。默认设置为\
  \ `Full`。每个设置都指向一个特定的策略文件，该级别可以在其中找到信任级别设置。`Full` 设置不包含策略文件，因为它直接跳过了所有代码访问检查。\n\n\
  ## 通过 IIS\n\nASP.NET 与 IIS 配合；你不仅可以在 ASP.NET 中（通过代码或配置文件）应用安全设置，还可以在 IIS 中应用额外的安全措施。IIS\
  \ 允许你通过处理用户和组（在本章前面讨论过）、限制 IP 地址、文件扩展名等来应用所需的访问方法。通过 IIS 安全值得单独成章，但这里探讨了主要主题。\n\n\
  ### 处理文件扩展名\n\n你可以在 ASP.NET 中处理多种文件。这些文件由其扩展名定义。例如，你知道 `.aspx` 是典型的 ASP.NET 页面，而\
  \ `.asmx` 是 ASP.NET Web 服务的文件扩展名。这些文件由 IIS 映射到 ASP.NET 的 DLL，即 `aspnet_isapi.dll`。\n\
  \n\n\n\n\n如果你正在使用 Windows 7 或更高版本，可以通过 IIS 管理器将文件扩展名映射到处理程序。在此工具中，选择 IIS 部分的 `Handler\
  \ Mappings`（处理程序映射）。你会发现一个许多已经提供的映射列表，如图 20-14 所示。\n\n![image](img/f784-01.jpg)\n\
  \n**图 20-14**\n\n通过选中第一个 `*.aspx` 并点击 `Edit`（编辑）按钮，你会发现该扩展名映射到了处理程序 `System.Web.UI.PageHandlerFactory`，如图图\
  \ 20-15 所示。\n\n![image](img/f785-01.jpg)\n\n**图 20-15**\n\n点击 `Request Restrictions`（请求限制）按钮会弹出一个窗口允许允许选择允许的谓词（如图图\
  \ 20-16 所示）。\n\n![image](img/f785-02.jpg)\n\n**图 20-16**\n\n要在 IIS 6.0 中实现类似的结果，请在\
  \ IIS 中调出 Web 应用程序的 `Properties`（属性）窗口或默认网站属性。在特定的 Web 应用程序中，你必须在 `Directory` 标签操作；但如果你使用的是\
  \ `Default Web Site Properties`（默认网站属性）窗口，则可以使用 `Home Directory`（主目录）标签。从这些选项卡，点击\
  \ `Application Settings`（应用程序设置）框中的 `Configuration`（配置）按钮。`Application Configuration`（应用程序配置）窗口包含一个\
  \ `Mappings`（映射）标签，可以在此处配置映射。在映射列表中选中 .aspx 并点击 `Edit` 按钮。图 20-17 显示了结果。\n\n![image](img/f785-03.jpg)\n\
  \n**图 20-17**\n\n在 `Executable`（可执行）文本框中，你可以看到所有 .aspx 页面映射到 ASP.NET 的 `aspnet_isapi.dll`，你还可以指定应用程序允许哪些类型的请求。你可以允许所有谓词（例如\
  \ `GET` 或 `POST`），或者指定哪些谓词允许访问。\n\n关于这些映射的一个重要点是，你不在列表中看到 `.html`、`.htm`、`.jpg`\
  \ 或其他扩展名（如 `.txt`）。应用程序不会将这些文件的请求传递给 ASP.NET。这可能不是问题，但在学习本章中的各种安全示例时，你可能希望对这些文件应用与\
  \ .aspx 页面相同的安全措施。例如，如果你希望所有的 .html 页面都包含在你的 ASP.NET 应用程序所需的表单验证模型中，你必须向列表添加 .html（或你需要的任何文件扩展名）。要这样做，请点击\
  \ `Application Configuration` 窗口中的 `Add`（添加）按钮。\n\n在下一个窗口中，你可以将 ASP.NET DLL 添加到\
  \ `Executable` 文本框，并将适当的文件扩展名和谓词添加到列表，然后将映射添加到应用程序的映射表中。图 20-18 展示了此示例。\n\n![image](img/f786-01.jpg)\n\
  \n**图 20-18**\n\n在处理网站安全时，你必须记住所有可能未包含在默认映射列表中，并添加你认为应该属于相同安全结构的文件。\n\n### 使用 IIS\
  \ 7.x/8 管理器\n\n在 IIS 7、7.5 和 8 中进行相同站点修改的工具是 Internet 信息服务（IIS）管理器，如图 20-19 所示。\n\
  \n![image](img/f786-02.jpg)\n\n**图 20-19**\n\n通过此窗口进行任何更改后，你可以选择 `Actions`（操作）面板中的\
  \ `Apply Changes`（应用更改）链接，系统将通知你更改是否已保存。成功后，更改将应用到网站的 `web.config` 文件。\n\n### 使用\
  \ ASP.NET MMC 载入\n\n在比 7 更老的 IIS 版本中，还没有 IIS 管理器；但是 ASP.NET MMC 控制台允许你使用简单易用的 GUI\
  \ 编辑 `web.config` 和 `machine.config` 文件，而无需亲自翻阅这些文件的文本来做出必要的更改。你还可以使用此窗口修改和更改书中检查的大多数项目。该插件在位于\
  \ IIS 下运行的 Web 应用程序的 ASP.NET 标签中可用（参见图 20-20）。\n\n![image](img/f787-01.jpg)\n\n\
  **图 20-20**\n\n当你直接在窗口中进行更改时，你也是对实际配置文件进行硬编码更改。\n\n点击 ASP.NET 标签上的 `Edit Configuration`（编辑配置）按钮。\n\
  \n\n\n\n\n给定一个像 `HTTP` 这样的无状态协议以及服务器端的 `ASP.NET`，你如何在 Web 上管理状态？图 21-1 是一张识别了管理状态可用主要方法的通用图。这个问题是巨大的，而解决方案的范围更大。本章假设你没有使用\
  \ Java applets 或 ActiveX 控制来管理状态，因为这些技术在所有系统上都无法工作。\n\n![image](img/f792-01.jpg)\n\
  \n**图 21-1**\n\n如果你对状态管理只记住一件事，请记住这一点：没有标准答案。无疑，某些答案比其他答案更正确；但管理状态的方法有非常多。回想你的上一个项目，你花了多少时间来决定应该在何处管理状态？技巧在于真正理解每种方法的优缺点。\n\
  \n为了对某种方法做出明智的决策，你应该理解请求的生命周期以及在该过程中每个点管理状态的机会：\n\n1. **1**。 浏览器对你服务器上的页面发送 `HTTP\
  \ GET` 请求，[`http://myserver/myapp/mypage.aspx`](http://myserver/myapp/mypage.aspx)。此客户端浏览器之前从未访问过你的网站。\n\
  2. **2**。 `IIS` 和你的 `ASP.NET` 通过返回由 `mypage.aspx` 渲染的 HTML 进行响应。此外，`mypage.aspx`\
  \ 返回一个带有唯一 ID 的 cookie 来跟踪此 浏览器。记住，cookie 实际上是一个稍微抽象的概念。cookie 是通过向客户端返回 `Set-Cookie`\
  \ HTTP 头部设置的。客户端承诺在随后的每个 HTTP 调用中都在 HTTP 头部返回 cookie 的值。此示例中的状态是客户端和服务器之间的约定，在每个响应请求中来回传递\
  \ cookie。\n3. **3**。返回的 HTML 可能包含隐藏文本框，例如 `<input type=\"hidden\" value=\"somestate\"\
  \ />`。这些文本框类似于 cookie，因为如果提交此页面上的表单，它们会被传回服务器。cookie 按域设置；隐藏表单字段按页面设置。\n4. **4**。在下一次请求时，之前设置的\
  \ cookie 将返回到服务器。如果此请求是以 `HTTP POST` 提交表单，则表单中的所有字段（隐藏或其他）都会被返回。\n5. **5**。 较些作为\
  \ cookie 设置的唯一标识符现在可以作为任何类型服务器端状态机制的键。该状态可能简单如内存中的哈希表（hashtable），也可能复杂如 `SQL database`。\n\
  \n你可能注意到的一个重复主题之一是客户端和服务器之间来回传递信息的约定。这些信息可以位于 URL 中、HTTP 头部中，甚至作为输入字段包含在提交的表单中。\n\
  \n在服务器端，你有几个选项。你将希望根据可用存储量、想要存储的数据量以及你访问数据的频率和速度来权衡这些选项。\n\n表 21-1 和 21-2 表示了每种服务器端和客户端选项，并列出了每种选项的优缺点。\n\
  \n| 服务器端选项 | 优点 | 缺点 |\n| --- | --- | --- |\n| 应用程序状态 (Application State) | 快速。所有用户共享。\
  \ | 状态每个服务器存储一次。 |\n| 缓存对象（应用程序作用范围） | 类似于应用程序状态，但通过依赖关系包含过期（参见第 22 章 缓存）。 | 在多个服务器配置中每个服务器存储一次状态。\
  \ |\n| 会话状态 (Session State) | 三种选择：进程内、进程外和数据库支持。可以配置为无 cookie。 | 可能会被滥用。当对象离开进程时需要支付序列化成本。进程内需要\
  \ Web 服务器会话保持（affinity）。无 cookie 配置更容易被劫持。 |\n| 自定义数据库 | Web 农中的任何服务器都可以访问该状态。 |\
  \ 当对象离开进程时需要支付序列化和持久化成本。 |\n\n**表 21-1**\n\n| 客户端选项 | 优点 | 缺点 |\n| --- | --- | ---\
  \ |\n| Cookie | 简单 | 可能被浏览器拒绝。不适用于大量数据。不适用于敏感数据。每个 HTTP 请求和响应都会产生大小成本。 |\n| 隐藏字段\
  \ (Hidden Field) | 对于页面作用域的数据简单简单 | 不适用于大量数据。不适用于敏感数据。 |\n| ViewState | 对于页面作用域的数据简单\
  \ | 将序列化对象编码为二进制 Base64 编码数据增加了约 30% 的开销。较小的序列化成本。声誉不好，特别是对于 DataGrids。 |\n| 控制状态\
  \ (ControlState) | 对于页面作用域的特定控件数据简单 | 类似于 ViewState，但用于即使开发者已关闭它也需要 ViewState 的控件。\
  \ |\n| 查询字符串 (URL) | 极其简单，如果你希望终端用户直接修改你的 URL，则通常非常方便 | 相对复杂。不能包含大量信息。不适用于敏感数据。易于被终端用户修改。\
  \ |\n| HTML5 Web 存储 | 存储键值对的简单 API | 数据永远不会自动发送到服务器，因此主要用于客户端逻辑。 |\n\n**表 21-2**\n\
  \n在客户端，每种选项都涉及来回传递。这些表格为你提供了一些服务器端和客户端的选项。第 22 章 涵盖了 ASP.* 中缓存的改进。\n\n## 理解 ASP.NET\
  \ 中的 Session 对象\n\n在经典 ASP 中，`Session` 对象保存在进程内（与所有内容一样），即 IIS 进程中。用户接收到的带有 GUID\
  \ 形式唯一键的 cookie。会话键是字典的索引，其中可以存储对象引用。\n\n在所有版本的 ASP.NET 中，`Session` 对象都提供了一个进程内选项，但也包含了进程外和数据库支持的选项。此外，开发者可以选择启用无\
  \ cookie 会话状态，其中会话键显示在 URL 中，而不是作为 cookie 发送。\n\n### 会话（Sessions）与事件模型\n\n`HttpApplication`\
  \ 对象在 HTTP 请求的生命周期内触发一系列事件；本节提到了所有事件，但仅对与会话相关的提供了更多细节：\n\n*   `AuthenticateRequest`\n\
  *   `AuthorizeRequest`\n*   `ResolveRequestCache`\n*   `AcquireRequestState`：此事件表示与此\
  \ HTTP 请求相关的所有话状态即将获取。\n*   `ReleaseRequestState`：表示应存储会话状态。会话在此处持久化，使用 `web.config`\
  \ 中配置的任何会话状态模块。\n\n当你的应用程序代码执行时，`Session` 对象已经根据 cookie 中的（或如后文所示来自 URL 的）会话键进行了填充。如果你想在会话开始时处理某些操作，而不是在\
  \ `AcquireRequestState` 中处理，你可以为会话状态 `HttpModule` 的 `Start` 事件定义事件程序。\n\n```\n void\
  \ Session_OnStart() {\n      '这在会话模块获取会话状态后触发。\n }\n```\n\n`HttpSessionState` 对象可以在\
  \ `Page` 对象子类的任何事件中使用。你在 ASP.NET 中创建的页面派生自 `System.Web.UI.Page`，你可以像集合一样访问会话状态，因为\
  \ `System.Web.SessionState.HttpSessionState` 实现了 `ICollection`。\n\n\n\n\n\n`Page`\
  \ 类有一个命名恰当的公共属性 `Session`，它可以自动从当前的 `HttpContext` 中检索 `Session`。尽管 `Session` 对象似乎存在于页面内部，但它实际上存在于\
  \ `HttpContext` 中，而页面的公共 `Session` 属性实际上是获取指向会话状态的引用。这种便利性不仅让经典的 ASP 程序员用起来更舒适，还减少了你的一些输入工作。\n\
  \n在页面内可以以以下方式引用 `Session` 对象：\n\n```\n Session[\"SomeSessionState\"] = \"Here is\
  \ some data\";\n```\n\n或者\n\n```\n HttpContext.Current.Session[\"SomeSessionState\"\
  ] = \"Here is some data\";\n```\n\n`Session` 对象实际上存在于当前 HTTP 上下文中这一事实不仅仅是一个冷知识。这一知识使你能够在页面之外的上下文中（例如在在你自己的\
  \ `HttpHandler` 中）访问 `Session` 对象。\n\n## 配置会话状态管理\n\n页面中的所有代码都使用之前看到的字典语法来引用 `Session`\
  \ 对象，但 `HttpSessionState` 对象使用提供程序模式来提取会话状态存储的可能选择。你可以通过更改 `web.config` 文件中的 `sessionState`\
  \ 元素在包含的提供程序之间进行选择。ASP.NET 带有以下三个存储提供程序：\n\n- **进程内会话状态存储 (In-Process Session State\
  \ Store)**：将会话存储在 ASP.NET 内存缓存中\n- **进程外会话状态存储 (Out-of-Process Session State Store)**：将会话存储在\
  \ ASP.NET 状态服务器服务 `aspnet_state.exe` 中\n- **Sql 会话状态存储 (Sql Session State Store)**：将会话存储在\
  \ Microsoft SQL Server 数据库中，并使用 `aspnet_regsql.exe` 进行配置\n\n`web.config` 文件中 `sessionState`\
  \ 元素的格式如下代码所示：\n\n```\n <configuration>\n     <system.web>\n        <sessionState\
  \ mode=\"Off|InProc|StateServer|SQLServer|Custom\" ../>\n     </system.web>\n```\n\
  \n通过设置新网站 `web.config` 文件中 `sessionState` 元素的 `mode=\"InProc\"` 属性开始配置会话状态。这是 ASP.NET\
  \ 中常见的会话状态配置，正如你接下来看到的，这也是最快的一种。\n\n## 进程内会话状态\n\n当配置设置为 `InProc` 时，会话数据存储在 `HttpRuntime`\
  \ 的内部缓存中，这是一个实现了 `ICollection` 的 `ISessionStateItemCollection` 实现。会话状态键是一个 120 位的数值字符串，用于索引此全局对象引用字典。当会话状态在进程中时，对象以活动引用的形式存储。这种机制极其快，因为没有发生序列化，对象也不会离开进程空间。当然，如果对象存在于\
  \ `In-Process Session` 对象中，它们不会被垃圾回收，因为仍然持有有该引用。\n\n此外，由于对象被存储（持有）在内存中，它们会一直占用内存，直到该会话超时。如果用户访问你的网站并进入其中一个页面，他可能会导致你在进程内会话中存储一个\
  \ 50MB 的 `XmlDocument` 对象。如果该用户再也没有回来，你将一直占用那块大内存直到接下来的 20 分钟（一个可配置的值），直到会话结束。\n\
  \n### InProc 的注意事项 (Gotchas)\n\n尽管 InProc 会话模型是最快、默认且最常用的，但它确实有一个有一个重大的局限性。如果工作进程或应用程序域发生回收，所有的会话状态数据将丢失。此外，ASP.NET\
  \ 可能会由于多种原因重启，例如：\n\n- 你更改了 `web.config` 或 `Global.asax` 文件，或者通过更改其修改日期“触碰”了它们。\n\
  - 你修改了 `\\bin` 或 `\\App_Code` 目录下的文件。\n- 在 `web.config` 或 `machine.config` 文件中设置了\
  \ `processModel` 元素，指示应用程序何时重启。可能导致重启的条件可能是内存限制或请求队列限制。\n- 杀毒软件修改了上述的任何文件。这对于会对文件进行*接种\
  \ (inoculates)* 的杀毒软件来说尤为常见。\n\n尽管如此，进程内会话状态对于只需要单个 Web 服务器的小型应用程序，或者在 IP 负载均衡将每个用户返回到其原始会话所在服务器的情况下，运行良好。\n\
  \n现在想象用户已经有一个会话密钥，但被返回到了与创建会话时不同的机器。在这种情况下，目标机器不知道该会话密钥，因此创建一个新的会话。此新会话的基础是用户提供的会话\
  \ ID。虽然会话密钥可能相同，但目标机器之前不知道此会话，因此没有与该会话密钥关联任何数据。新会话是空的，可能会出现意想不到的结果。然而，有一个解决方案：如果在\
  \ `web.config` 文件中将 `regenerateExpiredSessionId` 设置为 `True`，则创建一个新的会话 ID 并分配给用户。\n\
  \n### Web 园艺 (Web Gardening)\n\n*Web 园艺 (Web gardening)* 是一种多处理器系统中的技术，其中会启动多个 ASP.NET\
  \ 工作进程实例并为它们分配处理器亲和性。在拥有多达四个 CPU 的大型 Web 服务器上，你可以拥有一到四个用于托管 ASP.NET 的工作进程。*处理器亲和性\
  \ (Processor affinity)* 字面上意味着 ASP.NET 工作进程对特定的 CPU 具有亲和性。它被“钉”在该 CPU 上。这种技术通常只在非常大的\
  \ Web 农场中启用。\n\n不要忘记进程内会话状态仅仅是如此——在进程内。即使你的 Web 应用程序仅包含单个 Web 服务器，并且所有的 IP 流量都路由到该单一服务器，你仍然无法保证每个请求都会由该服务器处理。Web\
  \ 园艺必须遵循与 Web 农场许多相同的规则。\n\n### 在会话中存储数据\n\n在下面的简单示例中，在 `Button_Click` 事件中，将文本框的内容添加到\
  \ `Session` 对象并赋予一个特定的键。用户然后点击进入同一应用程序内的另一个页面，从 `Session` 对象中检索的数据显示在浏览器中。\n\n注意\
  \ `<asp:HyperLink>` 控件的使用。当然，该标记可以硬编码为 HTML，但这种细微的区别以后对你有帮助。此外，URL 是相对于此站的，而不是绝对路径。注意它在本章后续对你有帮助。\n\
  \n列表 21-1 说明了使用 `Session` 对象有多简单。它的行为就像任何其他 `IDictionary` 集合，允许你关联类型为 `String` 的键和任何类型的对象。引用的文件在列表\
  \ 21-2 中添加。\n\n来自列表 21-1 的页面渲染如图 21-2 所示。`Session` 对象通过字符串键进行访问。你也可以使用 `Add()`、`Count()`\
  \ 等其他方法，但上述语法是最常用的。\n\n![image](img/f797-01.jpg)\n\n**图 21-2**\n\n\n\n\n\n在图 21-3\
  \ 中，截屏被一条对角线分割，以显示启用追踪时返回的大量追踪信息的顶部和中间。会话状态（Session state）深根于 ASP.NET 的结构之中。你可以在追踪的\
  \ `Request Details`（请求详细）部分看到，不仅此页面是 `HTTP GET` 的结果，话 ID 也是——它被提升到了一等公民的地位。然而，ASP.NET\
  \ 会话 ID 默认以 cookie 的形式存在，正如你在图中底部的 `Cookies` 集合中看到的那样。\n\n![image](img/f798-01.jpg)\n\
  \n**图 21-3**\n\n该 cookie 的默认名称为 `ASP.NET_SessionId`，但可以通过 `web.config` 文件中 `<sessionState>`\
  \ 元素的 `cookieName` 属性对其进行配置。某些大型企业仅允许特定命名的 cookie 通过其代理服务器，因此在外外网或带有网关服务器的网络上工作时，你可能需要更改此值；但这种情况非常罕见。在下面的示例中，`cookieName`\
  \ 被更改为名称“Foo”：\n\n```\n <sessionState cookieName=\"Foo\" mode=\"InProc\" />\n```\n\
  \n图 21-3 中显示的追踪输出包含一个列出 `Session State`（会话状态）集合内容的章节。在图中，你可以看到当前存储了名称 `mykey` 和值\
  \ `Hanselman`。此外，你还可以看到存储值的 CLR 数据类型；在这种情况下，它是 `System.String`。\n\n现在添加下一页，该页从会话中提取此值。创建一个新的\
  \ ASP.NET 页面，添加一个标签，然后添加一个 `Page_Load` 事件处理程序，如列表 21-2 所示。\n\n由于会话包含对象引用，因此生成的对象将通过\
  \ C# 中的强制转换或 VB 中的 `CType` 或 `CStr` 函数转换为字符串。\n\n### 使会话透明化\n\n遗憾的是，你无法在不任何类型转换语法的情况下在\
  \ Session 对象中存储和检索特定数据类型的值，因为所有内容都被存储为对象。结合用作索引的字符串键，使得页面与 `Session` 对象之间建立了一个相当脆弱的契约。你可以创建一个特定于应用程序的会话助手来隐藏这些细节，或者可以在基类\
  \ `Page` 中添加属性，以一种更友好的方式将这些对象呈现给页面。由于泛型 `Session` 对象作为 `System.Web.UI.Page` 的属性可用，请创建一个派生自\
  \ `Page` 的新类，并出一个名为 `MyKey` 的新属性。\n\n通过右键点击你的项目并从上下文菜单中选择“添加新项”（Add New Item）创建一个新类。将其命名为\
  \ `SmartSessionPage` 并点击确定。IDE 可能会提示它希望将此新类放在 `App_Code` 文件夹中，以便整个应用程序可以使用。点击是。\n\
  \n你的新基类非常简单。通过派生，它执行 `System.Web.UI.Page` 执行的所有操作，此外它还有一个新属性，如列表 21-3 所示（代码文件 `SmartSessionPage.cs`\
  \ 和 `SmartSessionPage.vb`）。\n\n现在，回到来自列表 21-1 的代码，并从此新基类派生你的页面。要做到这一点，将基类更改为继承 `SmartSessionPage`。列表\
  \ 21-4 显示了页面如何派生自 `SmartSessionPage`，后者又派生自 `System.Web.UI.Page`。列表 21-4 概述了对列表\
  \ 21-1 进行的更改。\n\n在此代码中，你更改了对 `Session` 对象的访问，使其使用新的公共属性。在列表 21-3 的更改之后，所有派生页面都有一个名为\
  \ `MyKey` 的公共属性。可以使用此属性而无需担心强制转换或会话键索引。随着其他对象被包含在会话中，可以添加额外的特定属性。\n\n### 优化会话性能的高级技术\n\
  \n默认情况下，所有页面都对 `Session` 具有写入权限。由于可能来自同一浏览器客户端的多个页面同时被请求（使用帧、同一台机器上的多个浏览器窗口等），因此页面在页面请求期间对同一个会话持有读取/写入锁。如果一个页面对同一个会话持有写入锁，则同一会话中请求的所有其他页面必须等待第一个请求完成。需要说明的是，会话仅对该会话\
  \ ID 锁定。这些锁不会影响具有不同会话的用户。\n\n为了让你使用会话的页面获得最佳性能，ASP.NET 允许你通过 `EnableSessionState`\
  \ `@Page` 属性精确声明页面对 `Session` 对象的需求。选项有 `True`、`False` 或 `ReadOnly`：\n\n* `EnableSessionState=\"\
  True\"`：页面需要对会话的读取和写入权限。该会话 ID 的会会在每次请求期间都被锁定。\n* `EnableSessionState=\"False\"\
  `：页面不需要访问会话。如果代码仍然使用 `Session` 对象，将抛出 `HttpException` 并停止页面执行。\n* `EnableSessionState=\"\
  ReadOnly\"`：页面需要对会话进行只读访问。多个请求可以同时访问会话。\n\n通过修改 `@Page` 指令以反映页面的实际需求，可以影响负载下的性能。在页面中添加\
  \ `EnableSessionState` 属性，如下所示：\n\n```\n <%@ Page Language=\"VB\" EnableSessionState=\"\
  True\" %>\n <%@ Page Language=\"C#\" EnableSessionState=\"ReadOnly\" %>\n```\n\n\
  ASP.NET 使用来自 `System.Web.SessionState` 命名空间的标记接口来跟踪每个页面的需求。生成 `Default.aspx` 的部分类时，它实现了\
  \ `IRequiresSessionState` 接口，而 `Retrieve.aspx` 实现了 `IReadOnlySessionState`。所有的 `HttpRequest`\
  \ 都由实现 `IHttpHandler` 的对象处理。页面由 `PageHandlerFactory` 处理。你可以在第 30 章中找到更多关于 `HttpHandler`\
  \ 的信息。内部，`SessionStateModule` 正在执行类似于伪代码的代码：\n\n```\n If HttpContext.Current.Handler\
  \ Is IReadOnlySessionState Then\n      Return SessionStateStore.GetItem(itemKey)\n\
  \  ElseIf HttpContext.Current.Handler Is IRequiresSessionState\n      Return SessionStateStore.GetItemExclusive(itemKey)\n\
  \  End If\n```\n\n### 进程外会话状态\n\n进程外会话保存在名为 `aspnet_state.exe` 的进程中，该进程作为 Windows\
  \ 服务运行。你可以通过服务 MMC 单元或在具有权限的命令行中运行以下 `net` 命令来启动 ASP.NET 状态服务：\n\n```\n net start\
  \ aspnet_state\n```\n\n\n\n\n\n默认情况下，状态服务监听 TCP 端口 `42424`，但可以通过服务的注册表项更改此端口，如下代码所示。状态服务默认是不启动的。\n\
  \n```\nHKEY_LOCAL_MACHINE\\SYSTEM\\CurrentControlSet\\Services\\aspnet_state\\Parameters\\\
  Port\n```\n\n将 `web.config` 文件的设置从 `InProc` 更改为 `StateServer`，如下所示。此外，你必须包含 `stateConnectionString`\
  \ 属性，并指定运行会话状态服务的 IP 地址和端口。在 Web 农（由多个 Web 服务器组成的组）中，你可以将状态服务运行在任何单个服务器上或完全独立的另一台机器上。在本示例中，状态服务器运行在本地机器，因此\
  \ IP 地址是本地 IP `127.0.0.1`。如果你在另一台机器上运行状态服务器，请确保开启了相应的端口——在这种情况下为 TCP 端口 `42424`。\n\
  \n```\n<configuration>\n    <system.web>\n        <sessionState mode=\"StateServer\"\
  \n            stateConnectionString=\"tcpip=127.0.0.1:42424\"/>\n    </system.web>\n\
  </configuration>\n```\n\n使用的状态服务始终是 ASP.NET 安装的最新版本。这意味着如果你在同一台机器上运行 ASP.NET 2.0/3.5/4\
  \ 或 4.5 以及 1.1，存储在任何及所有 ASP.NET 版本的 `Session` 对象中的状态都保留在一个 ASP.NET 状态服务的实例中，并且用于处理会话的服务属于最新版本的\
  \ ASP.NET。\n\n由于你的应用程序代码运行在 ASP.NET 工作进程（`aspnet_wp.exe` 或 `w3wp.exe`）中，而状态服务运行在独立的\
  \ `aspnet_state.exe` 进程中，存储在会话中的对象不能作为引用存储。你的对象必须通过二进制序列化物理地离开工作进程。\n\n只有标记了 `[Serializable]`\
  \ 属性的类才可以序列化。在 `Session` 对象的上下文中，可以将 `[Serializable]` 属性想象为你的类实例离开工作进程的“许可证”。如果你以前使用过\
  \ InProc 会话，这一点尤为重要，因为它们没有此要求。因此，如果你更改了会话状态模式，可能需要修改你的代码。\n\n更新你的 `App_Code` 目录以包含一个名为\
