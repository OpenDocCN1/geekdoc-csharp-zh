  \ 10-4 中执行分组操作所需的代码与之前使用 LINQ 的代码进行比较，你会发现代码行数从 18 行减少到了 3 行，代码的可读性和清晰得到了提高。\n\n\
  ## 使用其他 LINQ 运算符\n\n除了基础的选择、过滤和分组外，LINQ 还包含许多你可以在集合上执行的运算符。这些运算符中的大多数都可以用于任何集合，并且与你在\
  \ SQL 中找到的类似，例如 `Count`、`Min`、`Max`、`Average` 和 `Sum`，如列表 10-14 所示。\n\n此列表演示了结合\
  \ `movies` 集合使用 `Count`、`Max`、`Min` 和 `Average` 运算符。注意，除了 `Count` 运算符外，你必须为方法提供你想要执行操作的特定字段。你通过\
  \ Lambda 表达式来实现这一点。\n\n## 创建 LINQ 联\n\nLINQ 还支持使用熟悉的类 SQL 连接语法合并来自不同集合的数据。例如，在目前为止示例数据中，你一直仅将类型作为数字\
  \ ID 显示。实际上，显示每个类型的名称会更好。为了实现这一点，你创建了一个 `Genre` 类，它定义了类型的属性，如列表 10-15 所示。\n\n接下来，你可以为你的网页添加一个\
  \ `GetGenres` 方法，返回一个 `Genre` 对象列表，如列表 10-16 所示。\n\n最后，你可以修改 Page Load 事件（包括 LINQ\
  \ 查询），以检索类型列表，并使用 LINQ 将其与电影列表连接，如列表 10-17 所示。\n\n如你所见，LINQ 查询非常简单。\n\n### 使用 LINQ\
  \ 进行分页\n\nLINQ 同样通过 `Skip` 和 `Take` 方法让应用程序中的分页变得更加容易。`Skip` 方法允许你跳过指定数量的记录，`Take`\
  \ 方法允许你指定返回的记录数量。如列表 10-18 所示。\n\n## LINQ to XML\n\nLINQ 的另一种形式是 LINQ to XML。正如其名，LINQ\
  \ to XML 允许你使用相同的 LINQ 语法查询 XML 文档。与基础 LINQ 一样，LINQ to XML 功能作为 .NET 的扩展，不会改变现有功能。此外，与核心\
  \ LINQ 功能一样，LINQ to XML 功能包含在独立的程序集 `System.Xml.Linq` 中。\n\n本节展示了如何使用 LINQ 查询 XML，使用与之前相同的电影数据。列表\
  \ 10-19 显示了转换为 XML 的数据。你可以在章节代码中找到完整的 XML 文件。\n\n为了让你了解如何使用 LINQ to XML，本节引导你完成一些相同的基础查询。\n\
  \n### 简单的 LINQ XML 示例\n\n列表 10-20 演示了使用 LINQ to XML 的简单选择查询。\n\n注意，在此查询中告诉 LINQ\
  \ 从哪里加载 XML 数据，以及从文档中的哪些元素检索数据，在本例中是所有的 `Movie` 元素。除了这个微小变化外，LINQ 查询与之前看到的完全相同。\n\
  \n当你执行此代码时，你会得到一个类似于图 10-7 所示的页面。\n\n![image](img/f390-01.jpg)\n\n**图 10-7**\n\n\
  注意，结果集中包含的字段并没有你预期的那样显示节点数据（即每个子节点作为 GridView 中的独立字段）。这是因为列表中使用的查询返回的是通用的 `XElement`\
  \ 对象集合，而不是你预期的 `Movie` 对象。这是因为 LINQ 本身无法识别每个节点应该映射到什么对象类型。坦率地说，你可以在查询中添加一些映射逻辑，告诉它将每个节点映射到\
  \ `Movie` 对象，以及节点的子元素如何映射到 `Movie` 对象的属性，如列表 10-21 所示。\n\n\n\n\n如你所见，查询现在包含了映射逻辑，以便\
  \ LINQ 知道你的实际意图——即创建一个包含 `Movie` 元素内部节点值的结果集。现在运行此代码将得到一个包含你所需内容的 GridView，如图 10-8\
  \ 所示。\n\n![image](img/f391-01.jpg)\n\n**图 10-8**\n\n## 关联 XML 数据\n\nLINQ to XML\
  \ 支持与 LINQ to Objects 相同的所有查询过滤和分组操作。它还支持数据连接，并且实际上可以连接来自两个不同 XML 文档的数据——这在任务在以前是非常困难的。看看与“LINQ\
  \ to Objects”部分介绍相同的基础连接场景。同样，基础 XML 数据仅包含 `Genre` 的 `ID` 值。然而，如果能在结果集中显示实际的 `Genre`\
  \ 名称会更好。\n\n在 XML 数据的情况下，`Genre` 数据实际上并没有存储在单独列表中，而是存储在一个完全独立的 XML 文件中，如列表 10-22\
  \ 所示。\n\n要连接数据，你可以使用与列表 10-17 中使用的非常相似的连接查询。它在列表 10-23 中显示。\n\n在此示例中，你可以看到将 `XElement.Load`\
  \ 方法作为 LINQ 连接语句的一部分使用，是告诉 LINQ 从哪里加载 `Genre` 数据。在连接数据后，你可以像访问 `Movie` 数据的元素一样访问\
  \ `Genre` 数据的元素。\n\n## LINQ TO SQL\n\nLINQ to SQL 正如其名，使你能够快速轻松地查询基于 SQL 的数据源，例如\
  \ SQL Server 2005 及以上版本。与之前的 LINQ 变一样，LINQ to SQL 是 .NET 核心框架（Framework）的扩展。它的功能位于\
  \ `System.Data.Linq` 程序集中。\n\n### 使用 O/R 映射器（Object/R Mapper）\n\n除了 Visual Studio\
  \ 中直接提供的每种版本的 LINQ 都能为你提供的普通智能单元提示（IntelliSense）和强类型检查外，LINQ to SQL 在 Visual Studio\
  \ 中直接包含了一个基础的对象/关系（O/R）映射器。该 O/R 映射器让你能够快速将基于 SQL 的数据源映射到 CLR 对象，然后你可以使用 LINQ 进行查询。\n\
  \n你通过向网站项目添加新的 LINQ to SQL 类文件来使用 O/R 映射器。LINQ to SQL 文件类型允许你轻松且视觉化地创建数据上下文（data\
  \ contexts），然后你可以使用 LINQ 查询访问并查询它们。图 10-9 显示了“添加新项”对话框中的 LINQ to SQL 类文件类型。\n\n\
  ![image](img/f393-01.jpg)\n\n**图 10-9**\n\n当你点击添加新项对话框的 OK 按钮将文件添加到项目时，Visual Studio\
  \ 会通知你它想要将 LINQ to SQL 文件添加到你网站的 `App_Code` 目录中。由于文件位于那里，由 LINQ to SQL 类文件创建的数据上下文可以从网站的任何地方访问。\n\
  \n文件添加后，Visual Studio 会自动在 LINQ to SQL 设计器中打开它。这个简单的对象/关系映射器设计工具允许你添加、创建、删除和关联数据对象。当你向设计器中修改对象时，LINQ\
  \ to SQL 会生成镜像这些对象结构的对象类。稍后，当你准备好对数据对象编写 LINQ 查询时，这些类允许 Visual Studio 为你提供设计时的智能单元提示支持、强类型检查和编译时的类型检查。由于\
  \ O/R 映射器主要设计用于配合 LINQ to SQL 使用，因此创建 SQL 对象（如表、视图和存储过程）的 CLR 对象表示是非常容易的。\n\nLINQ\
  \ to SQL 的演示使用了本章之前部分中相同的示例电影数据。对于本节，数据存储在 SQL Express LocalDB 数据库中。\n\n在设计表面打开并准备就绪后，打开\
  \ Visual Studio 服务器资源管理器（Server Explorer）工具，找到 `Movies` 数据库，并展开数据库的 Tables（表）文件夹。从服务器资源管理器中将\
  \ `Movies` 表拖到设计表面上。注意，一旦你将数据库表拖到设计表面上，它就会自动被查询以识别其结构。设计器会创建一个相应的实体类并显示在设计表面上。\n\
  \n当你将表对象拖到 LINQ to SQL 设计表面时，Visual Studio 会检查表名，并在必要时尝试自动对它生成的类名进行“单数化”（singularize）。这样做是为了帮助你更紧密地遵循\
  \ .NET 框架的类命名标准。例如，如果你从数据库将一个名为 `Products` 的表拖到设计表面，它会自动选择单数名称 `Product` 作为生成类的名称。\n\
  \n遗憾的是，尽管设计器在确定类名的正确单数版本方面通常做得，但它并不是 100% 准确的。一个典型的例子是——看当你将 `Movies` 表拖到设计表面时，它是如何错误地将其单数化为\
  \ `Movy` 的。幸运的是，设计器也允许你在设计表面更改实体的名称。你可以通过选择设计表面上的实体并点击设计器中的实体名称来实现。\n\n在你添加了 `Movie`\
  \ 实体后，将 `Genres` 表拖到设计表面。再次，设计器创建了该类的表示（注意它给出了单数名称 `Genre`）。此外，它检测到了外键关系。虚线表示外键关系的方向。[图\
  \ 10-10] 显示了带有 `Movies` 和 `Genres` 表的 LINQ to SQL 设计表面。\n\n![image](img/f395-01.jpg)\n\
  \n**图 10-10)**\n\n### 访问和查询数据\n\n设置好 LINQ 文件后，访问其数据并查询其数据就很简单。\n\n### 访问数据\n\n首先，在访问数据的\
  \ Web 表中创建数据上下文实例，如[列表 10-24 所示。\n\n在这种情况下，你创建一个 `MoviesDataContext` 实例，这是你添加的 LINQ\
  \ 文件生成的数据上下文类。\n\n### 编写 LINQ 查询\n\n将数据上下文添加到页面后，就可以编写 LINQ 查询。正如之前提到的，由于 LINQ to\
  \ SQL 生成的对象类镜像了数据库表，你在编写 LINQ 查询时会获得智能单元支持。列表 10-25 显示了与之前章节中相同的基础电影列表查询。\n\n如图\
  \ 10-11 所示，运行代码生成数据库中的原始列表。\n\n![image](img/f397-01.jpg)\n\n**图 10-11)**\n\n注意，你不需要编写通常创建此页面所需的任何数据库访问代码。LINQ\
  \ 已经为你处理了这些，甚至根据 LINQ 语法生成了 SQL。你可以通过将查询写入 Studio 输出窗口来查看 LINQ 为查询生成的 SQL，如[列表 10-26\
  \ 所示。\n\n现在，当你使用 Visual Studio 调试网站时，你可以看到 SQL 查询，如图 10-12 所示。\n\n![image](img/f398-01.jpg)\n\
  \n**[图 10-12)**\n\n\n\n\n图 10-13 显示了此查询生成的 SQL。\n\n![image](img/f399-01.jpg)\n\n\
  **图 10-13]**\n\n请注意，SQL to LINQ 生成的 SQL 是针对你正在使用的 SQL Server 版本进行优化的。\n\nLINQ 还包含一个日志记录选项，你可以通过设置数据上下文的\
  \ `Log` 属性来启用它。\n\n### 使用其他 SQL 查询方法\n\n尽管 LINQ to SQL 在生成 SQL 查询语法方面表现出色，但在某些情况下，使用其他\
  \ SQL 查询方法（例如存储过程或视图）更好。\n\n#### 使用 SQL 视图\n\n要在 LINQ to SQL 中使用 SQL 视图，你可以像拖入标准\
  \ SQL 表一样，将视图拖到 LINQ to SQL 设计表面上。视图会出现在设计表面上，就像你之前添加的表一样。视图进入设计表面后，你就可以对它执行查询，就像对\
  \ SQL 表执行操作的那样，如列表 10-28 所示。\n\n#### 使用存储过程\n\n与 LINQ to SQL 暴露为属性的表或视图不同，存储过程可能需要参数。因此，LINQ\
  \ to SQL 将它们作为方法调用从数据上下文对象中暴露出来，允许你提供方法参数值，这些值会被 LINQ 翻译为存储过程参数。列表 10-29 显示了一个简单的存储过程，你可以用它从数据库中检索特定类型。\n\
  \n你可以像添加表和视图一样，通过将存储过程从服务器资源管理器（Server Explorer）拖动到 LINQ to SQL 类设计表面，将其添加到你的 LINQ\
  \ to SQL 设计器中。如果你预计存储过程从数据库中的某个表中返回数据集合，你应该将该存储过程拖到代表查询返回结果类型的 LINQ 类上。列表 10-27\
  \ 所示的存储过程将返回所有匹配所提供 ID 的 `Genre` 记录。因此，你应该在 Visual Studio 设计器中将 `GetGenres` 存储过程拖到\
  \ `Genres` 表上。这告诉设计器生成一个返回 `Genre` 对象泛集合的方法。当你将存储过程拖到设计表面时，与表和视图不同，存储过程会出现在设计表面右侧的列表中。图\
  \ 10-14 显示了添加后的 `GetGenre` 存储过程。\n\n![image](img/f400-01.jpg)\n\n**图 10-14]**\n\n\
  添加存储过程后，你可以像访问表和视图一样通过数据上下文访问它们。然而，如前所述，LINQ to SQL 将它们作为方法调用暴露出来。因此，它们可能需要你提供方法参数，如列表\
  \ 10-30 所示。\n\n### 通过 LINQ 执行插入、更新和删除查询\n\n你不仅可以使用 LINQ to SQL 创建从数据源选择数据的强大查询，还可以用它来管理插入、更新和删除操作。默认情况下，LINQ\
  \ to SQL 执行这些操作的方式与选择数据非常相似。LINQ to SQL 使用 SQL 结构的对象的类表示，并动态生成 SQL `INSERT`、`UPDATE`\
  \ 和 `DELETE` 命令。与选择一样，你也可以使用存储过程执行插入、更新或删除。\n\n#### 使用 LINQ 插入数据\n\n使用 LINQ to SQL\
  \ 插入数据就像创建你想要插入的对象的的新实例并将其添加到对象集合中一样简单。LINQ 类提供了两个方法——`InsertOnSubmit` 和 `InsertAllOnSubmit`——它们使得创建并添加任何对象到\
  \ LINQ 集合中变得简单。`InsertOnSubmit` 方法接受单个实体作为其方法参数，允许你插入单个实体；而 `InsertAllOnSubmit`\
  \ 方法接受一个集合作为其方法参数，允许你在单次方法调用中插入整个数据集合。\n\n在你添加对象后，LINQ to SQL 需要调用数据上下文对象的 `SubmitChanges`\
  \ 方法这一额外步骤。调用此方法会告诉 LINQ 启动插入操作。列表 10-31 显示了创建一个新 `Movies` 对象的示例，然后将其添加到 `movies`\
  \ 集合并调用 `SubmitChanges` 将更改持久化回 SQL 数据库。\n\n#### 使用存储过程插入数据\n\n当然，你可能已经编写了一个复杂的存储过程来处理向你的数据库表插入数据。LINQ\
  \ 使得使用现有的存储过程向表插入数据变得简单。要实现这一点，在 LINQ to SQL 设计表面上，选择你想要插入数据的实体，在这种情况下是 `Movies`\
  \ 实体。选择实体后，打开其属性窗口并找到默认方法（Default Methods）部分，如图 10-15 所示。\n\n![image](img/f402-01.jpg)\n\
  \n**图 10-15]**\n\n默认方法部分包含三个属性——`Delete`、`Insert` 和 `Update`——它们定义了 LINQ 在执行这些操作时应使用的行为。默认情况下，每个属性都设置为\
  \ `UseRuntime`。由于你想使用存储过程插入数据，请打开 `Insert` 属性的配置对话框。\n\n在对话框中，将行为选择从 `UseRuntime`\
  \ 更改为 `Customize`。接下来，从单选按钮下方选择存储过程。当你选择存储过程时，LINQ 会自动将表列与存储过程参数进行匹配。然而，如果需要，你可以手动更改这些内容。\n\
  \n最后的配置对话框如图 10-16 所示。\n\n![image](img/f403-01.jpg)\n\n**图 10-16]**\n\n现在，当你运行列表\
  \ 10-31 的代码时，LINQ 将使用你配置的存储过程而不是动态生成 `INSERT` 语句。\n\n#### 使用 LINQ 更新数据\n\n使用 LINQ\
  \ 更新数据与插入数据非常相似。第一步是获取要更新特定对象。你可以通过使用要更改集合的 `Single` 方法来实现。标量 `Single` 方法根据其输入参数从集合返回单个对象。如果多个记录匹配参数，`Single`\
  \ 方法返回第一个匹配项。\n\n获取要更新记录后，更改对象的属性值，然后调用数据上下文的 `SubmitChanges` 方法。列表 10-32 显示了更新特定电影所需的代码。\n\
  \n#### 使用 LINQ 删除数据\n\n最后，LINQ to SQL 也允许你从 SQL 数据源删除数据。由 LINQ to SQL 设计器生成的每个数据类对象还包含了允许你从集合中删除对象的方法——`DeleteOnSubmit`\
  \ 和 `DeleteAllOnSubmit` 方法。正如名称所示，`DeleteOnSubmit` 从集合中删除单个对象，而 `DeleteAllOnSubmit`\
  \ 从集合中删除所有记录。列表 10-33 显示了如何使用 LINQ 以及 `DeleteOnSubmit` 和 `DeleteAllOnSubmit` 方法从你的数据源中删除数据。\n\
  \n与其他 SQL 命令一样，你必须记得调用数据上下文的 `SubmitChanges` 方法以便将更改提交回 SQL 数据源。\n\n\n\n\n当你需要快速构建数据访问代码时，LINQ\
  \ to SQL 是一个非常棒的工具。当数据库设计得较好时，它的工作得非常好。然而，LINQ to SQL 仅支持实体类与数据库表之间一对一的映射。\n\nEntity\
  \ Framework (`EF`) 是一种对象关系映射器，它允许 .NET 开发者使用领域特定对象来处理关系数据，这些对象构成了所谓的概念模型。`EF` 还允许连接到许多不同的数据提供程序。因此，你可以混合组合许多不同的数据库供应商、应用程序服务器或协议，以设计出由各种表、源、服务等构建的聚合混合对象。\n\
  \nLINQ to Entities 允许开发者使用 Visual Basic 或 Visual C# 针对 `Entity Framework` 概念模型编写查询。虽然\
  \ LINQ to SQL 查询最终会创建并在底层数据库上执行的 SQL，但 LINQ to Entities 会将 LINQ 查询转换为 `Entity Framework`\
  \ 能够理解的命令树查询，在 `Entity Framework` 上执行这些查询，并返回可同时供 `Entity Framework` 和 LINQ 使用的对象。尽管当你运行\
  \ LINQ to Entities 查询时在后台执行的代码与 LINQ to SQL 查询非常不同，但 LINQ 语法看起来是一样的。\n\n### 创建 Entity\
  \ Framework 数据模型\n\n为了使用 LINQ to Entities 工作，你需要创建一个 `EF` 数据模型。如果你一直在跟着本章操作，那么你已经拥有一个带有\
  \ `App_Code` 文件夹的项目。在 Visual Studio 的解决方案资源管理器中，右键点击你的 `App_Code` 文件夹，选择`添加` ![image](img/Ar.jpg)\
  \ 新项。出现“添加新项”对话框。从该对话框中选择你正在使用的特定语言（位于对话框左侧窗格）。你可以添加的可用项包括 ADO.NET 实体数据模型。选择此项并将其命名为\
  \ `MoviesDM.edmx`。在实体数据模型向导中选择“从数据库生成”（Generate from database）选项。使用现有的 `MoviesConnectionString`，并将连接设置名称留为默认的\
  \ `MovieEntities`。这将是你稍后使用的 `EF` 数据上下文的名称。在数据库对象列表中选择 `Movies` 表，并将所有其他设置保持默认值。点击“完成”（Finish）创建数据模型。实体数据模型设计器打开后，你可能会收到安全警告，询问你是否想要运行文本模板。O/R\
  \ 设计器使用 T4 模板自动生成 `DbContext` 文件以及你选择从数据库生成的每个实体的文件。这将在第 11 章中进行详细介绍。勾选“不再显示此消息”选项并点击确定。\n\
  \n如果你现在生成解决方案，你将得到错误，指示 `Movie` 对象的属性在另一个对象中存在。这是因为 LINQ to SQL 也生成了一个具有相同属性的 `Movie`\
  \ 对象。为了防止这些冲突，你应该更改由 LINQ to Entities 数据模型设计器生成的实体类名称。在数据模型设计器中右键点击 `Movie` 对象并选择“属性”（Properties）。将实体集名称更改为\
  \ `EFMovies`，并将名称更改为 `EFMovie`。图 10-17 显示了更改后的属性窗格。\n\n![image](img/f406-01.jpg)\n\
  \n**图 10-17**\n\n做出更改后，保存 `MovieDM.edmx` 文件。右键点击 `MovieDM.edmx` 文件并选择“运行自定义工具”（Run\
  \ Custom Tool），根据你对属性的更改重新生成实体类。\n\n### 访问数据\n\n创建一个新的 Web 表单使用实体数据模型显示数据。为了开始使用实体数据模型，在要访问数据的\
  \ Web 表单中创建 `EF` 数据上下文的实例，如列表 10-34 所示。\n\n在这种情况下，你创建了 `MoviesEntities` 的实例，这是 LINQ\
  \ to Entities 根据实体数据模型向导中指定的连接设置名称生成的数据上下文类名称。\n\n### 编写 LINQ 查询\n\n现在你已经有了 `EF`\
  \ 数据上下文的实例，就可以开始对其编写 LINQ 查询了。你会发现，针对 `EF` 数据模型编写 LINQ 查询与使用 LINQ to SQL 编写相同的查询看起来一样。就像与其他\
  \ LINQ 查询一样，LINQ to Entities 在你编写 LINQ 查询时提供 IntelliSense（智能感知）支持。列表 10-35 显示了在之前的章节中使用其他\
  \ LINQ 变体所示相同的相同电影列表查询。\n\n图 10-18 显示了运行代码的结果。你可以看到，与之前的示例一样，运行代码生成了数据库中电影的原始列表。\n\
  \n![image](img/f408-01.jpg)\n\n**图 10-18**\n\nLINQ 语法的相似性限于限于查询。你可以添加过滤器和其他查询操作。例如，列表\
  \ 10-36 显示了修改后的相同查询，包含过滤器和一个排序操作。\n\n列表 10-36 中的代码使用的是 LINQ to Entities，但其 LINQ\
  \ 语法与其他 LINQ 变体相同。图 10-19 显示了在列表 10-36 中运行代码的结果。\n\n![image](img/f409-01.jpg)\n\n\
  **图 10-19**\n\n摘要\n\nLINQ to SQL 是你需要快速构建数据访问代码时一个很棒的工具。当数据库设计得较好时，它的工作得非常好。然而，LINQ\
  \ to SQL 仅支持实体类与数据库表之间一对一的映射。\n\nEntity Framework (`EF`) 是一种对象关系映射器，它允许 .NET 开发者使用领域特定对象来处理关系数据，这些对象构成了所谓的概念模型。`EF`\
  \ 还允许连接到许多不同的数据提供程序。因此，你可以混合组合许多不同的数据库供应商、应用程序服务器或协议，以设计出由各种表、源、服务等构建的聚合混合对象。\n\n\
  LINQ to Entities 允许开发者使用 Visual Basic 或 Visual C# 针对 `Entity Framework` 概念模型编写查询。虽然\
  \ LINQ to SQL 查询最终会创建并在底层数据库上执行 SQL，但 LINQ to Entities 会将 LINQ 查询转换为 `Entity Framework`\
  \ 能够理解的命令树查询，在 `Entity Framework` 上执行查询，并返回可同时供 `Entity Framework` 和 LINQ 使用的对象。尽管当你运行\
  \ LINQ to Entities 查询时在后台执行的代码与 LINQ to SQL 查询非常不同，但 LINQ 语法看起来是一样的。\n\n### 创建 Entity\
  \ Framework 数据模型\n\n为了使用 LINQ to Entities 工作，你需要创建一个 `EF` 数据模型。如果你一直在跟着本章操作，那么你已经拥有一个带有\
  \ `App_Code` 文件夹的项目。在 Visual Studio 的解决方案资源管理器中，右键点击你的 `App_Code` 文件夹，选择`添加` ![image](img/Ar.jpg)\
