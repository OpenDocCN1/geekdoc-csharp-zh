  \ Invoke 按钮而没有其他内容。\n\n点击 Invoke 实际上会向 Web 服务发送 SOAP 请求，导致出现带有结果的新浏览器实例，如图 13-6\
  \ 所示。\n\n![image](img/f464-01.jpg)\n\n**图 13-6**\n\n\n\n\n\n你并不局限于将 XML Web 服务消费到\
  \ ASP.NET 应用程序中；但由于这是一本关于 ASP.NET 的书，因此它关注的是 ASP.NET 中消费过程的这部分。在其他类型的应用程序中消费 XML\
  \ Web 服务并不困难，事实上，它与你使用 ASP.NET 消费它们非常相似。请记住，你遇到的 Web 服务可以在 Windows Forms、移动应用程序等在处被消费。你甚至可以使用其他\
  \ Web 服务来消费 XML Web 服务，因此你可以拥有由其他 Web 服务聚合成的单个 Web 服务。\n\n### 添加网络引用 (Web Reference)\n\
  \n为了消费你在本章之前创建的 `Customers` Web 服务，请创建一个名为 `CustomerConsumer` 的 ASP.NET 新网站。在 ASP.NET\
  \ 应用程序中消费 XML Web 服务的第一步是对远程对象——即 Web 服务建立引用。你可以在 Visual Studio 解决方案管理器中右键点击项目的根节点，并选择\
  \ `Add Service Reference`（添加服务引用）来实现此操作。在服务引用对话框中，你可以输入服务的 URL。然而，要获取传统的 Web 服务引用对话框，请选择\
  \ `Advanced`（高级）按钮。然后在高级设置页的底部，选择 `Compatibility`（兼容性）部分下的 `Add Web Reference`（添加网络引用）。将出现添加网络引用对话框，如\
  \ 图 13-7 所示。\n\n![image](img/f465-01.jpg)\n\n**图 13-7**\n\n添加网络引用对话框允许你指向一个特定的 `.asmx`\
  \ 文件以对其建立引用。请理解，添加网络引用对话框实际上是在寻找 WSDL 文件。微软的 XML Web 服务会根据 `.asmx` 文件本身自动生成 WSDL\
  \ 文件。要在浏览器中调出 WSDL 文件，只需输入你的 Web 服务 `.asmx` 文件的 URL，并在字符串末尾添加 `?WSDL`。例如，你可能会有如下构造（这不是一个真实的\
  \ Web 服务，仅为示例）：\n\n```\nhttp://www.contoso.com/WebServices/Customers.asmx?WSDL\n\
  ```\n\n由于添加网络引用对话框会自动找到任何基于微软的 XML Web 服务的 WSDL 文件位置，因此对于任何基于微软的 XML Web 服务，你只需输入其实际\
  \ WSDL 文件的 URL 即可。\n\n在添加网络引用对话框中，将引用从默认名称更改为更有意义的。如果你在单机上工作，网络引用的名称可能是 `localhost`；如果你实际上在与远程\
  \ Web 服务工作，该名称是 URL 的反转，例如 `com.contoso.www`。无论何种情况，将其重命名为更有意义且在应用程序中易于使用的名称都是最好的。在示例中，网络引用被重命名为\
  \ `AdventureWorksCustomers`。\n\n点击 `Add Reference`（添加引用）按钮会导致 Visual Studio 从你应用程序的\
  \ `web.config` 文件对 Web 服务建立实际引用（如 图 13-8\n\n**图 13-8**\n\n你的消费应用程序的 `web.config`\
  \ 文件在其 `<appSettings>` 部分包含对该 Web 服务的引用。列表 13-6 显示了该添加。\n\n你可以看到 `AdventureWorksCustomers`\
  \ 引用已经建立，并带有 Web 服务的名称，提供了键值对 `AdventureWorksCustomers.Customers`。`value` 属性取 `Customers`\
  \ Web 服务的位置的值，该位置位于 `Customers.asmx` 页面内。\n\n### 从客户端应用程序调用 Web 服务\n\n现在已经对 XML\
