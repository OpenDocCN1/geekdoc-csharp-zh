  \ URI 引用服务暴露的实体数据模型（EDM）。此 EDM 实例化将包含所有与底层服务交互的能力列表。在代码列表 13-41 中，通过使用 `svc.Customers`\
  \ 返回了整个 `Customers` 表。并将此结果集绑定到 `GridView` 控件上。图 13-32 显示了结果。\n\n![image](img/f514-01.jpg)\n\
  \n**[图 13-32]](#Chapter13.xhtml_figureanchor13-32)**\n\n除了前面代码中简单的查询外，在代码中使用 LINQ\
  \ 时，你还可以开始使用本章之前介绍的某些命令逻辑。代码列表 13-42 展示了一个针对 `Customers` 表的查询，你只对查看 `CompanyName`\
  \ 中包含单词 `Bike` 的客户感兴趣。\n\n在这一段代码中，执行了一个 LINQ 查询，然后将该对象绑定为 `GridView` 控件的 `DataSource`\
  \ 值。这在网格中产生了另一组项目列表。\n\n# ASP.NET WEB API\nASP.NET 4.5 为平台带来了许多新功能。其中最实用的功能之一是 Web\
  \ API。在 ASP.NET 4.5 发布之前，许多开发者抱怨说，配置 WCF 创建 RESTful 服务所花费的时间比开发服务本身还要长。因此，为了帮助暴露应用程序功能（众为人知的\
  \ web API），Web API 被创建了。\n\n由于 Web API 是一个高度依赖 HTTP 的 ASP.NET MVC 应用程序，开发者可以使用 HTTP\
  \ 动词和有意义的路由来构建稳健的表述状态转换（REST）服务。\n\n## 构建你的第一个 Web API\n构建 Web API 项目非常简单。Visual\
  \ Studio 2012 有一个非常出色的模板可以帮助为 Web API 项目搭建脚架。你在构建第一个 Web API 项目时将使用它。在某些情况下，开发者可以使用\
  \ Web API 项目模板生成一个功能完整的 web API，而无需编写任何代码（这意味着他或她仅使用拖放和配置）。\n\n开始之前，如图 13-33 所示创建一个新的\
  \ ASP.NET MVC 4 项目。\n\n![image](img/f516-01.jpg)\n\n**[图 13-33]](#Chapter13.xhtml_figureanchor13-33)**\n\
  \n当你点击 OK 时，会出现如图 13-34 所示的自定义 ASP.NET MVC 4 项目的提示。对于此示例，选择 Web API 模板。由于这是你的第一个服务，且该项目仅用于你的\
  \ API，请为项目保留默认的 Razor 视图引擎。\n\n![image](img/f516-02.jpg)\n\n**[图 13-34]](#Chapter13.xhtml_figureanchor13-34)**\n\
  \n创建项目后，你会被立即带到一个名为 `ValuesController` 的默认控制器。删除此控制器，因为你很快就会构建自己的控制器。\n\n当你在 Web\
  \ 上暴露 API 时，你很可能会与数据源进行交互。在这种情况下，请使用你在本章早期使用的 AdventureWorks 数据库。将数据库放置在 `App_Data`\
  \ 文件夹中。\n\n接下来，创建一个与你之前为连接 WCF 所构建的模型完全相同的 EF 模型。然而，在这种情况下，你会将 `AdventureWorks.edmx`\
  \ 文件添加到 `Models` 文件夹中。在继续之前，生成此项目。当你生成项目时，你的模型会被编译到项目二进制文件中，并在 Visual Studio IDE\
  \ 中暴露使用。\n\n接下来，你必须构建一个新的控制器。右键点击 Controllers 文件夹并选择 `Add New`。将新控制器命名为 `ProductsController`。在模板中，选择“API\
  \ controller with Entity Framework”，如图 13-35 所示。\n\n![image](img/f517-01.jpg)\n\n\
  **[图 13-35]](#Chapter13.xhtml_figureanchor13-35)**\n\n在 Model 下拉菜单中，选择 `AdventureEntities`。这允许你的控制器绑定数据源。`ProductsController`\
  \ 文件将包含核心功能，如代码列表 13-41 所示。\n\n## 理解 Web API 路由\n你可能会发现 Web API 有一些不同之处。类不是继承自 `Controller`，而是继承自\
  \ `ApiController`。接下来你会发现方法没有使用 HTTP 特性。相反，HTTP 动词被放在方法名的开头。正如前面提到的，代码列表 13-43](#Chapter13.xhtml_listing13-43)中的每个方法上方都有一个注释，显示了访问该方法预期的\
  \ URL。该 URL 是根据 Web API 的路由生成的。默认 Web API 路由如代码列表 13-44](#Chapter13.xhtml_listing13-44)。\n\
  \n由于 Web API 使用 ASP.NET MVC，你可以添加额外的路由或更改路由模板。\n\n## 消费 Web API\n现在 Web API 已构建，它需要被客户端消费。由于\
  \ Web API 使用 HTTP，客户端可以是从 Windows Phone 等移动设备到桌面应用程序，或者是使用其他技术构建的 Web 应用程序。如果你打开\
  \ Internet Explorer 使用 [`http://localhost:43059/api/products/710`](http://localhost:43059/api/products/710)\
  \ 访问你的 Web API，将看到图 13-36](#Chapter13.xhtml_figure13-36)所示的结果。\n\n![image](img/f521-01.jpg)\n\
  \n**[图 13-36]](#Chapter13.xhtml_figureanchor13-36)**\n\n\n\n\n为了演示，请创建一个名为 `ApiConsumer`\
  \ 的新 ASP.NET Web Forms 项目。由于你将使用模型中的其中一个表，你需要创建一个类来对 JSON 结果进行类型转换。为了简单起见，你将使用如\
  \ 列表 13-46 所示的两个属性。如果你想获取模型中的所有属性，则需要将它们添加到你的类中。\n\n然后，创建一个名为 `Default.aspx` 的新页面。使用\
  \ `HttpClient` 传递 `/api/products/710` 的 URI。如果收到了成功响应，则解析结果。否则，在单独的标签中显示异常，如 列表\
  \ 13-47 所示。\n\n图 13-37 显示了当你接收到成功的 HTTP 响应码时的结果。\n\n![image](img/f525-01.jpg)\n\n\
  **图 13-37**\n\n在某些情况下，你可能不是调用 Web API 的开发者，但你可能需要测试它。在这些情况下，你可以借助几种工具来测试你的 Web API。测试\
  \ Web API 最流行的工具是 Fiddler。Fiddler 是一个免费的实用程序，用于检查遵循 HTTP 或 HTTPS 的流量。在该工具中，你可以创建一个新的\
  \ HTTP 请求头并将请求发送到特定的 URL。\n\n## 总结\n\n本章对 .NET 平台上的 Web 服务进行了快速轮览。这绝对是一个值得专门写一本书的话题。本章向你展示了将你的数据和逻辑作为\
  \ SOAP 暴露的威力，以及展示了如何在你构建的 ASP.NET 中直接调用这些 SOAP 消息。\n\n虽然本章并未详尽无遗，但它大致概述了 WCF 框架的基础知识。当你开始深入研究这项技术时，你会发现它的功能非常强大且具有可扩展性。\n\
  \nWCF Data Services 是暴露数据库内容的一种强大方式。本章研究了如何通过接口执行命令来过滤特定内容。你可以将 URI 的一部分命令来获取你感兴趣的特定结果集。然而，在处理\
  \ ASP.NET 页面时，使用代码（更具体地说是 LINQ）同样可以从接口中获取你想要的结果。\n\n最后，本章快速概述了 ASP.NET 4.5 中新的 Web\
  \ API。这是目前为止创建 RESTful Web 服务最简单的一种解决方案。\n\n# 第四部分\n\n字体 提供程序\n\n*   第 14 章：提供程序模型简介\n\
  *   第 15 章：扩展提供程序模型\n\n# 14\n\n## 提供程序模型简介\n\n### 本章包含哪些内容？\n\n*   什么是提供程序\n*  \
  \ ASP.NET 4.5 的提供程序模型包含什么\n*   配置提供程序\n\n### 本章的 WROX.COM 代码下载\n\n请注意，本章中的所有代码示例都可以作为本章代码的一部分，在书籍网站\
  \ [www.wrox.com](http://www.wrox.com) 的“Download Code”选项卡中下载。\n\n在构建应用程序时，ASP.NET\
  \ 提供程序模型是一个重要的理解框架。ASP.NET 是为互联网构建应用程序的一种。这意味着应用程序的显示代码通过 HTTP 传输，HTTP 是一种无状态协议。ASP.NET\
  \ 与断开架构工作。这种模型的简单本质意味着请求进入，然后发回响应。此外，ASP.NET 不区分一个请求和另一个请求。包含 ASP.NET 应用程序的服务器只是对任何发送给它的请求做出反应。\n\
  \n这意味着构建 Web 应用程序的开发者必须考虑用户在操作应用程序时，如何在服务器的请求之间保持上下文。保持用户上下文意味着将状态（用户状态）记录到某种类型的数据存储中。你可以通过多种方式实现，没有哪种方法是完美的。相反，你必须从可用方法中选择一种。\n\
  \n可以通过多种方法存储，包括：\n\n*   应用程序状态 (Application state)\n*   会话状态 (Session state)\n*\
  \   `Cache` 对象\n\n你在服务器上使用所有这些方法，也可以采用自己的自定义方法——例如，使用你自己的自定义架构在数据库中存储状态。将状态写回客户端（直接在他们的计算机上，或通过将状态放在响应的\
  \ HTML 输出中）也是可能的。这些方法中的包括：\n\n*   Cookies\n*   查询字符串 (Querystrings)\n*   隐藏字段 (Hidden\
  \ Fields)\n*   视图状态 (ViewState)\n\n无论是使用 ASP.NET 自带的内置提供程序之一，还是你自己组合的自定义提供程序，你都会发现使用提供程序是管理状态的良好模型。下一节将介绍提供程序是什么以及你如何使用它。\n\
  \n## 理解提供程序\n\n之前的这些状态机制工作得很好，但大多数是初级的，且寿命很短。ASP.NET 4.5 包含了一些系统（例如成员和角色管理系统），它们在多次请求/响应事务之间处理用户状态。事实上，这些系统需要的状态管理能力远超以前提到的状态管理方法所可能的有限时间范围。因此，这些系统中的许多必须在更高级的模式下记录状态——这在\
  \ ASP.NET 中很容易实现。通过使用提供程序实现了更高级模式将状态记录到数据存储中。\n\n默认情况下，ASP.NET 中的会话存储在 `InProc`（进程内）。在\
  \ ASP.NET 中，你可以简单更改使用的提供程序；这将改变会话存储的位置。可用的提供程序包括：\n\n*   InProc\n*   StateServer\n\
  *   SQLServer\n\n除了 InProc 之外，你还可以使用 `StateServer`，它允许将会话存储在与 ASP.NET 运行完全独立的进程中。这在\
  \ ASP.NET 进程关闭时可以保护你的会话。你还可以使用 `SQLServer` 选项将会话存储到磁盘（例如数据库）。这种方法允许你将会话直接存储在 SQL\
  \ Server 中。如何更改使用的提供程序？你可以通过两种方式实现。\n\n更改用于会话程序的一种方案是通过信息服务 (IIS) 管理器，如图 14-1 所示。\n\
  \n![image](img/f531-01.jpg)\n\n**图 14-1**\n\n另一个选项是直接进入系统级配置文件（例如 `machine.config`\
  \ 文件）或应用程序配置文件（例如 `web.config`）。在文件中，更改 `<sessionState>` 部分中要使用的会话状态程序的名称。\n\n##\
  \ ASP.NET 4.5 中的提供程序模型\n\n随着 ASP.NET 的发展，用户希望通过除三种方法（`InProc、StateServer` 和 `SQLServer`）以外的方法存储会话。例如，一个用户请求是想要可以将会话存储在\
  \ Oracle 数据库中的提供程序。如果团队为 Oracle 添加提供程序，他们很快就会收到为其他数据库和数据存储方法添加更多提供程序的请求。因此，与其为每一种可能的情况构建提供程序，开发者设计了一种提供程序模型，使他们能够添加任何需要的提供程序。因此，ASP.NET\
  \ 中新的提供程序模型诞生了。\n\n\n\n\n今天，ASP.NET 4.5 包含了许多需要某种形式状态存储的系统。此外，这些系统中的许多不再在脆弱的模式（默认存储会话（sessions）的方式）中记录状态，而是要求将状态存储在更具体的数据存储中，例如数据库或\
  \ XML 文件。这还允许访问应用程序的用户拥有更长生命周期的状态——这也是这些系统的另一个需求。\n\n在 ASP.NET 4.5 中，基于提供程序模型（provider\
  \ model）且需要高级状态管理的系统包括：\n\n*   成员资格（Membership）\n*   角色管理（Role management）\n*  \
  \ 站点导航（Site navigation）\n*   个性化（Personalization）\n*   健康监控 Web 事件（Health monitoring\
  \ web events）\n*   配置文件保护（Configuration file protection）\n\n成员系统是一种允许 ASP.NET 从某种用户存储库中创建、删除或编辑应用程序用户的手段。由于开发者显然希望针对其用户存储库使用无限数量的不同数据存储库，因此他们需要一种方法来轻松更改\
  \ ASP.NET 应用程序的底层用户存储库。ASP.NET 4.5 中提供的提供程序模型就是答案。\n\nASP.NET 4.5 默认提供了几个成员提供程序（membership\
  \ providers），允许您存储用户信息。包含的提供程序是 SQL Server 和 Active Directory 成员提供程序（分别位于 `System.Web.Security.SqlMembershipProvider`\
  \ 和 `System.Web.Security.ActiveDirectoryMembershipProvider`）。事实上，对于每个系统（以及某些 ASP.NET\
  \ 1.**x* 系统），都有一系列提供程序可以更改该系统状态的记录方式。图 14-2 展示了这些提供程序。\n\n![image](img/f532-01.jpg)\n\
  \n**图 14-2**\n\n从图中可以看出，ASP.NET 默认提供了大量的提供程序。某些系统只有一个提供程序（例如配置系统（profile system），它仅包含一个连接到\
  \ SQL Server 的提供程序），而其他系统包含多个提供程序（例如 WebEvents 提供程序，它包含六个独立的提供程序）。接下来，本章将介绍如何设置\
  \ SQL Server 以与本章介绍的许多提供程序配合。你可以使用 SQL Server 2005、2008 或 2012 作为本章介绍的许多提供程序的后端数据存储（尽管并非所有）。在这些解释之后，你将查看\
  \ ASP.NET 4.5 内置的每个可用提供程序。\n\n### 配置您的提供程序与 Microsoft SQL Server 2005、2008 或 2012\
  \ 配合\n\n许多提供程序可以与 SQL Server 工作。例如，成员资格、角色管理、个性化和其他系统默认就可以与 SQL Server 工作。然而，所有这些系统默认与\
  \ LocalDB 工作，而不是 SQL Server 的完整版本（如 SQL Server 2005、SQL Server 2008 或 SQL Server\
  \ 2012）。\n\n要与这些数据库中的任何一个工作，你必须使用 `aspnet_regsql.exe` 工具设置数据库。使用 `aspnet_regsql.exe`\
  \ 会创建提供程序所需的表、角色、存储过程和其他项目。要获取此工具，通过选择开始 ![image](img/Ar.jpg) 所有程序 ![image](img/Ar.jpg)\
  \ Microsoft Visual Studio 2012 ![image](img/Ar.jpg) 打开 Visual Studio 2012 命令提示符。ASP.NET\
