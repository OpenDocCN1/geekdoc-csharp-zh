  \ GUI 的 ASP.NET SQL Server 安装向导相比，其优势在于你可以只在数据库中安装你感兴趣的功能，而不是安装所有内容（如基于 GUI 的版本所做的那样）。例如，如果你仅让成员系统（membership\
  \ system）与 SQL Server 2012 交互——而不涉及任何其他系统（如角色管理和个性化）——你可以配置设置程序，使得仅在数据库中建立成员系统所需的表、角色、存储过程和其他项。要仅为成员系统设置数据库，请在命令行中使用以下命令：\n\
  \n```\naspnet_regsql.exe -A m -E\n```\n\n## ASP.NET SQL Server 安装向导 GUI 工具\n\n除了通过命令行使用该工具外，你还可以使用该向向导的\
  \ GUI 版本。要进入 GUI 版本，请在 Visual Studio 命令行提示符输入以下内容：\n\n```\naspnet_regsql.exe\n```\n\
  \n此时，会显示 ASP.NET SQL Server 安装向导的欢迎界面，如图图 14-5 所示。\n\n![image](img/f535-01.jpg)\n\
  \n**图 14-5**\n\n点击“下一步”将进入一个新屏幕，提供两个选项：一个是将管理功能安装到 SQL Server 中，另一个是删除（参见图 14-6）。\n\
  \n![image](img/f535-02.jpg)\n\n**图 14-6**\n\n在此处，选择“为应用程序服务配置 SQL Server”选项并点击“下一步”按钮。第三个屏幕（参见图\
  \ 14-7）要求输入 SQL Server 的登录凭据以及执行操作的数据库名称。Database 选项默认为 `<default>`——这意味着向导创建一个名为\
  \ `aspnetdb` 的数据库。如果你想选择不同的文件夹（例如应用程序的数据库），请选择相应的选项。\n\n![image](img/f535-03.jpg)\n\
  \n**图 14-7**\n\n在完成服务器和数据库选择后，点击“下一步”。图图 14-8 所示的屏幕要求你确认设置。如果一切看起来正确，点击“下一步”；否则，点击“上一步”并修正你的设置。\n\
  \n![image](img/f535-04.jpg)\n\n**图 14-8**\n\n完成后，会出现一个屏幕，通知你一切已设置正确。\n\n## 将你的默认提供程序连接到新的\
  \ SQL Server 实例\n\n在设置好完整的 Microsoft SQL Server 以配合 ASP.NET 提供的各种系统后，你需要在 `machine.config`\
  \ 或 `web.config` 文件中创建数据库的连接字符串，如列表 14-1 所示。\n\n如果你处理的是远程 SQL Server 实例而不是位于应用程序同一服务器上的实例，你可能需要更改提供的值。在\
  \ `machine.config` 文件中更改此值将改变每个 ASP.NET 应用程序使用该提供程序的方式。在 `web.config` 文件中应用此设置将使本地应用程序与此实例工作。\n\
  \n连接字符串设置好后，继续查看你将要处理的 `<providers>` 部分。例如，如果你正在使用成员提供程序（membership provider），你希望处理配置文件中的\
  \ `<membership>` 元素。更改 SQL Server 的设置显示在列表 14-2 中。\n\n完成这些更改后，SQL Server 2012 实例现在已成为供应用程序使用的提供程序之一。此提供程序实例的名称为\
  \ `AspNetSqlMembershipProvider`。你可以看到此实例也使用了 `LocalSqlServer` 的连接字符串，该字符串是在列表 14-1\
  \ 中定义的。\n\n注意列表 14-2 中的一些重要属性声明。第一个是成员系统使用的提供程序是通过主 `<membership>` 节点中找到的 `defaultProvider`\
  \ 属性定义的。使用此属性，你可以指定该提供程序是内置提供程序之一，还是你自己构建或从第三方收收的自定义提供程序。在使用列表 14-2 中的代码后，成员提供程序现在与\
  \ Microsoft SQL Server 2012（如本示例所示）而不是 Microsoft SQL Server Express 版文件工作。\n\n下一节将回顾\
  \ ASP.NET 4.5 内置的提供程序，从成员系统提供程序开始。\n\n### 成员提供程序\n\n成员系统能够轻松管理 ASP.NET 应用程序中的用户。与\
  \ ASP.NET 提供的大多数系统一样，它包含了一系列服务器控件，这些控件与定义的提供程序交互，以从提供程序定义的数据存储中检索或记录信息。由于提供程序存在于服务器控件和检索/记录数据的数据存储之间，让控件从完全不同的后端工作是非常容易的。\n\
  \n正如前面提到的，ASP.NET 4.5 自带了两种提供程序：\n\n*   `System.Web.Security.SqlMembershipProvider`：让你使用成员系统连接到\
  \ Microsoft SQL Server 2005、2008 或 2012，以及 SQL Server Express。\n*   `System.Web.Security.ActiveDirectoryMembershipProvider`：让你使用成员系统连接到\
  \ Microsoft Active Directory（在 Windows Server 中）。\n\n这两个提供程序类都继承自 `MembershipProvider`\
  \ 基类，如图图 14-9 所示。\n\n![image](img/f537-01.jpg)\n\n**图 14-9**\n\n接下来，我们审查每个提供程序。\n\
  \n#### System.Web.Security.SqlMembershipProvider\n\n默认提供程序是 `SqlMembershipProvider`\
  \ 实例。你在服务器上每个 ASP.NET 应用程序的 `machine.config` 文件中都能找到此默认声明。文件位于 `C:\\Windows\\Microsoft.NET\\\
  Framework\\v4.0.30319\\Config`。列表 14-3 显示了该提供程序的定义。\n\n从列表中可以看到 `machine.config`\
  \ 中定义了一个 `SqlMembershipProvider` 对象实例。此实例命名为 `AspNetSqlMembershipProvider`。这也是你查找成员系统默认设置的地方。默认情况下，此提供程序配置为与\
  \ SQL Server Express 工作，而不是完整的 SQL Server 版本（如 SQL Server 2005、2008 或 2012）。通过查看列表\
  \ 14-3 中提供程序声明定义的 `connectionStringName` 属性可以发现这一点。在这种情况下，它被设置为 `LocalSqlServer`。`LocalSqlServer`\
  \ 在 `machine.config` 文件中定义，如列表 14-4 所示。\n\n\n\n\n## System.Web.Security.ActiveDirectoryMembershipProvider\n\
  \nASP.NET 4.5 提供的成员系统也可以将此系统连接到 Microsoft Active Directory 实例，甚至是 Active Directory\
  \ Application Mode (ADAM)，这是一种独立的目录产品。由于默认成员提供程序定义在 `machine.config` 文件文件的 `SqlMembershipProvider`，因此你必须在应用程序的\
  \ `web.config` 文件中覆盖这些设置。\n\n在你的 `web.config` 文件中创建 `ActiveDirectoryMembershipProvider`\
  \ 的定义实例之前，你必须定义指向 Active Directory 存储的连接字符串，如列表 14-5 所示。\n\n建立好连接后，你可以在你的 `web.config`\
  \ 文件中创建 `ActiveDirectoryMembershipProvider` 实例，并将其关联到此连接字符串，如列表 14-6 所示。\n\n虽然并不是所有这些属性都是必需的，但此列表为你提供了\
  \ `ActiveDirectoryMembershipProvider` 的可用属性。事实上，你可以轻松地以最简单的形式声明该实例，如下所示：\n\n```\n\
  \ <membership\n      defaultProvider=\"AspNetActiveDirectoryMembershipProvider\"\
  >\n      <providers>\n          <add name=\"AspNetActiveDirectoryMembershipProvider\"\
  \n              type=\"System.Web.Security.ActiveDirectoryMembershipProvider,\n\
  \              System.Web, Version=1.0.3600, Culture=neutral,\n              PublicKeyToken=b03f5f7f11d50a3a\"\
  \n              connectionStringName=\"ADConnectionString\" />\n      </providers>\n\
  \  </membership>\n```\n\n同样，无论使用 `SqlMembershipProvider` 还是 `ActiveDirectoryMembershipProvider`，成员系统服务器控件（如登录服务器控件）以及成员\
  \ API 一旦配置完成，将通过你建立的提供程序来记录并检索其信息。这就是 ASP.NET 团队建立的提供程序模型的力量。当你学习本章详细介绍的其他提供程序时，将继续看到这种力量。\n\
  \n## 角色提供程序 (Role Providers)\n\n在用户登录到系统（可能使用 ASP.NET 成员系统）后，ASP.NET 角色管理系统允许你处理该用户的角色，以授权其对整个应用程序的特定访问。ASP.NET\
  \ 4.5 中的角色管理系统与其他系统一样，有一组提供程序可以方便地存储和检索角色信息。当然，这并不意味着你受角色管理系统中三个可用提供程序之一。相反，你可以扩展已有的提供程序之一，甚至创建自己的自定义提供程序。\n\
  \n默认情况下，ASP.NET 4.5 为角色管理系统提供三个提供程序。这些提供程序定义在以下列表中：\n\n* `System.Web.Security.SqlRoleProvider`:提供你使用\
  \ ASP.NET 角色管理系统连接到 Microsoft SQL Server 2005/2008/2012 以及 Microsoft SQL Server\
  \ Express 版的能力。\n* `System.Web.Security.WindowsTokenRoleProvider`:提供你将 ASP.NET 角色管理系统连接到内置\
  \ Windows 安全组系统系的能力。\n* `System.Web.Security.Authorization StoreRoleProvider`:提供你将\
  \ ASP.NET 角色管理系统连接到 XML 文件、Active Directory 或 Active Directory Application Mode\
  \ (ADAM) 存储的能力。\n\n这三个用于角色管理的类继承自 `RoleProvider` 基类，如图 14-10 所示。\n\n![image](img/f541-01.jpg)\n\
  \n**图 14-10**\n\n## System.Web.Security.SqlRoleProvider\n\nASP.NET 中的角色管理系统默认使用\
  \ SQL Server Express 版文件（与成员系统也是如此）。到 SQL Server Express 文件的连接使用 `SqlRoleProvider`，但你同样可以轻松配置你的\
  \ SQL Server 2005、2008 或 2012 服务器通过 `SqlRoleProvider` 与角色管理系统工作。设置完整版 SQL Server\
  \ 的过程在本章开头处描述。\n\n查看 `machine.config.comments` 文件中的 `SqlRoleProvider` 实例，你会注意到在列表\
  \ 14-7 中所示定义的语法。`machine.config.comments` 文件提供了关于 `machine.config` 的文档，并向你展示了内置到\
  \ ASP.NET 框架中的默认设置细节。\n\n如所述，这是内置到整个 ASP.NET 框架中的默认 `<roleManager>` 声明的一部分（再次注意，你可以通过在\
  \ `web.config` 文件中创建新声明来更改任何这些默认值）。如你所见，角色管理默认通过 `<roleManager>` 节点中找到 `enabled`\
  \ 属性禁用（其默认设置为 `false`）。此外，注意 `<roleManager>` 元素中的 `default Provider` 属性。在这种情况下，它设置为\
  \ `AspNetSqlRoleProvider`。该提供程序在相同的代码示例中定义。要连接到之前（在成员系统示例中）定义的 Microsoft SQL Server\
  \ 2012 实例，你可以使用列表 14-8 所示的语法。\n\n完成后，你现在可以连接到 SQL Server 2012。接下来是回顾第二个可用提供程序。\n\
  \n## System.Web.Security.WindowsTokenRoleProvider\n\nWindows 操作系统内置了一个角色系统。当你处理可能为所有用户定义角色的内网应用程序时，这个\
  \ Windows 安全组系统是理想的系统。当然，如果你禁用了 ASP.NET 的匿名身份验证并配置应用程序使用 Windows 身份验证，则效果最好。\n\n\
  使用 `WindowsTokenRoleProvider` 时存在某些局限。这是一个只读提供程序，因为 ASP.NET 不允许修改应用于 Windows 安全组的设置。这意味着在使用此提供程序时，并不是所有通过\
  \ `RoleProvider` 提供的方法都是可用的。从 `WindowsTokenRoleProvider` 类中，你拥有的方法只有 `IsUserInRole`\
  \ 和 `GetUsersInRole`。\n\n要配置你的 `WindowsTokenRoleProvider` 实例，使用列表 14-9 中定义的语法。\n\
  \n记住，你需要在 `<roleManager>` 元素中使用 `defaultProvider` 属性声明默认提供程序，以更改关联的 `SqlRoleProvider`。\n\
  \n## System.Web.Security.AuthorizationStoreRoleProvider\n\n从默认安装 ASP.NET 的最后一个角色提供程序是\
  \ `AuthorizationStoreRoleProvider`。该角色提供程序类允许将角色存储在授权管理器策略存储中。这些类型的存储也被称为 AzMan\
  \ 存储。与 `WindowsTokenRoleProvider` 一，`AuthorizationStoreRoleProvider` 功能有限，因为它无法支持任何\
  \ AzMan 业务规则。\n\n要使用 `AuthorizationStoreRoleProvider`，你必须在 `web.config` 文件中建立指向\
  \ AzMan 使用的 XML 数据存储的连接，如列表 14-10 所示。\n\n注意，当你处理这些基于 XML 的策略文件时，将它们存储在 App_Data\
  \ 文件夹是最好的。存储在 App_Data 文件夹中的文件无法在浏览器中调用。\n\n连接字符串到位后，下一步是配置你的 `AuthorizationStoreRoleProvider`\
  \ 实例。这采用了列表 14-11 中定义的语法。\n\n接下来，本章将回顾 ASP.NET 提供的唯一个性化提供程序。\n\n\n\n\n与 ASP.NET\
  \ 中的成员系统一样，个性化系统（也称为配置系统）是另一个基于提供程序模型的系统。该系统在查看应用程序的端用户与存储在中央的特定于该用户的数据点之间建立关联。如所述，这些个性化属性是按用户为单位进行存储和维护的。ASP.NET\
  \ 为数据存储提供单一的提供程序。该提供程序允许你使用 ASP.NET 个性化系统连接到微软的 SQL Server 2005、2008 和 2012，以及 Microsoft\
  \ SQL Server Express 版。\n\n用于个性化系统的单一类继承自 `ProfileProvider` 基类，如图 14-11 所示。\n\n\
  ![image](img/f544-01.jpg)\n\n**图 14-11**\n\n与目前为止介绍的其他提供程序一样，`SqlProfileProvider`\
  \ 默认连接到 Microsoft SQL Server Express 文件。虽然这是默认设置，但你可以更改连接以与 SQL Server 2005、2008\
  \ 或 2012 配合。例如，如果你连接到 SQL Server 2012 数据库，你可以在 `web.config` 文件中定义连接，并将你的 `SqlProfileProvider`\
  \ 关联到此连接字符串。列表 14-12 展示了这种场景。\n\n请记住，要在 SQL Server 数据库中存储配置信息，你必须配置此数据库以便创建正确的表、存储过程和其他项目。此任务在本章前面讨论过。\n\
  \n## 站点地图提供程序 (SiteMap Provider)\n\n与刚刚讨论的个性化提供程序类似，ASP.NET 4.5 提供了一个单一提供程序来处理站点地图。站点地图是\
  \ ASP.NET 用来提供集中维护站点导航的方法。默认情况下，Web 应用程序的定义位于结构化的 XML 文件中站点地图提供程序允许你与为应用程序创建的 XML\
  \ 文件（`.sitemap` 文件）进行交互。站点地图提供的提供程序是 `System.Web.XmlSiteMapProvider`，它允许你使用 ASP.NET\
  \ 导航系统连接到基于 XML 的文件。\n\n站点地图系统的单一类继承自 `StaticSiteMapProvider` 基类，它是 `SiteMapProvider`\
  \ 基类的部分实现，如图 14-12 所示。\n\n![image](img/f545-01.jpg)\n\n**图 14-12**\n\n这是目前为止介绍的第一个默认连接到\
  \ SQL Server 数据库的提供程序。相反，该提供程序设计用于与静态 XML 文件配合。该 XML 文件使用特定的架构，并在第 17 章中有详尽介绍。\n\
  \n列表 14-13 显示了配置 `XmlSiteMapProvider` 需要的代码。\n\n`XmlSiteMapProvider` 仅允许在严格设计的 `web.sitemap`\
  \ 文件存在单个根元素。它查找的 XML 文件的默认名为 `web.sitemap`，尽管你可以通过使用 `web.config` 文件提供程序声明中的 `siteMapFile`\
  \ 属性（如在列表 14-13 中所示）来更改此默认设置。\n\n## 会话状态提供程序 (SessionState Providers)\n\n存储用户会话状态的可用模式包括\
  \ `InProc`、`StateServer`、`SQLServer` 甚至 `Custom`。每种模式都有特定的优缺点，在决定使用哪种会话状态模式时你应该彻底检查每个选项。\n\
  \n这种提供程序模型与本章目前讨论的其他模型略有不同。`SessionStateModule` 类是一个用于加载可用会话状态模式之一的处理器。这些模式在这里都进行了定义：\n\
  \n*   `System.Web.SessionState.InProcSessionStateStore`：提供在与 ASP.NET 工作进程相同的进程中存储会话的能力。这是到目前为止会话状态管理性能最好的方法。\n\
  *   `System.Web.SessionState.OutOfProcSessionStateStore`：提供在与 ASP.NET 工作进程分离的进程中存储会话的能力。这种模式稍微更安全，但性能稍逊于\
  \ `InProc` 模式。\n*   `System.Web.SessionState.SqlSessionStateStore`：提供在 SQL Server\
  \ 中存储会话的能力。这是存储会话最安全的方法，但在三种可用方法中性能最差。\n\n图 14-13 显示了这三种会话管理模式。\n\n![image](img/f546-01.jpg)\n\
  \n**图 14-13**\n\n接下来，本章将回顾你可以在 ASP.NET 4.5 应用程序中开箱即用的三种模式中的每一个。\n\n### System.Web.SessionState.InProcSessionStateStore\n\
  \n`InProcSessionStateStore` 模式是 ASP.NET 的默认模式。在此模式下，生成的会话在与 ASP.NET 工作进程相同的进程中。这是到目前为止会话状态管理性能最好的方法。（注：此处原文存在大量重复内容，已根据翻译要求进行精简）。由于工作进程回收，所有会话都会被销毁。工作进程可能由于许多原因回收（例如更改\
  \ `web.config` 文件或在 IIS 中的设置）。\n\n列表 14-14 显示了在 `InProc` 模式下工作时 `web.config` 文件中的配置示例。\n\
  \n如所示，这种模式相当简单。下一个回顾的方法是进程外模式。\n\n### System.Web.SessionState.OutOfProcStateStore\n\
  \n除了 `InProc` 模式外，`StateServer` 模式是存储会话状态的进程外方法。这种方法的性能不如在与 ASP.NET 工作进程相同的进程中存储会话的方法。这是合理的，因为该方法必须跨越进程边界来处理会话。虽然性能不如\
  \ `InProc` 模式，但 `OutOfProcStateStore` 方法比使用 `InProcSessionStateStore` 运行会话更可靠。如果应用程序的工作进程回收，该应用程序正在处理的会话仍将维持。这种能力对于严重依赖会话的应用程序至关重要。\n\
  \n列表 14-15 显示了使用 `OutOfProcStateStore` 的示例。\n\n使用 `StateServer` 模式时，你还必须使用 `stateConnectionString`\
  \ 属性定义会话存储的位置。在这种情况下使用了本地服务器，这意味着会话存储在同一台机器上，但在完全独立的进程中。你也可以通过为此属性提供适当的 IP 地址作为值，将会话存储在不同的服务器上。除了\
  \ IP 地址外，请注意在使用 `StateServer` 模式时使用了端口 4242。第 21 章涵盖了 `StateServer` 的端口。\n\n###\
  \ System.Web.SessionState.SqlSessionStateStore\n\nASP.NET 可用的会话状态最后一个提供程序是 `SqlSessionStateStore`。这种方法是三种模式中最具韧性的。然而，它是三种模式中性能最差的。如果你使用这种会话存储方法，正确配置数据库是非常重要的。再次，第\
  \ 21 章 显示了如何设置你的数据库。\n\n\n\n\n要配置您的应用程序以与 `SqlSessionStateStore` 工作，您必须按照列表 14-16\
  \ 中的详细说明配置 `web.config` 文件。\n\n接下来，您将查看用于 Web 事件架构的可用提供程序。\n\n## Web 事件提供程序\n\n\
  在 ASP.NET 4.5 的所有可用系统中，健康监控系统提供的提供程序比任何其他系统都多。健康监控系统使 ASP.NET 应用程序管理员能够评估运行中的 ASP.NET\
  \ 程序的健康状况，并捕获事件（错误或其他可能的触发器），这些事件可以通过可用提供程序之一进行存储。这些事件被称为 `web events`。通过健康监控系统可以监控大量的事件列表，这意味着您可以开始记录诸如身份验证失败/成功、生成的所有错误、ASP.NET\
  \ 工作进程信息、请求数据、响应数据等条目。记录条目意味着使用可用的提供程序之一将数据记录到某种数据存储中。\n\n默认情况下，ASP.NET 4.5 为健康监控系统提供了几种可能的提供程序。这比其他任何\
  \ ASP.NET 系统都要多。这些提供程序定义在以下列表中：\n\n*   `System.Web.Management.EventLogWebEventProvider`：让您能够使用\
  \ ASP.NET 健康监控系统将安全操作错误和其他所有错误记录到 Windows 事件日志。\n*   `System.Web.Management.SimpleMailWebEventProvider`：让您可以使用\
  \ ASP.NET 健康监控系统通过电子邮件发送错误信息。\n*   `System.Web.Management.TemplatedMailWebEventProvider`：与\
  \ `SimpleMailWebEventProvider` 类似，`TemplatedMailWebEventProvider` 类让您能够以模板电子邮件的形式发送错误信息。模板使用标准的\
  \ `.aspx` 页面定义。\n*   `System.Web.Management.SqlWebEventProvider`：让您可以使用 ASP.NET\
  \ 健康监控系统将错误信息存储在 SQL Server 中。与 ASP.NET 中用于其他系统的其他 SQL 提供程序一样，`SqlWebEventProvider`\
  \ 默认将错误信息存储在 SQL Server Express 中。\n*   `System.Web.Management.TraceWebEventProvider`：让您可以使用\
  \ ASP.NET 健康监控系统将错误信息发送到 ASP.NET 页面跟踪系统。\n*   `System.Web.Management.IisTraceWebEventProvider`：让您可以使用\
  \ ASP.NET 健康监控系统将错误信息发送到 IIS 跟踪系统。\n*   `System.Web.Management.WmiWebEventProvider`：让您连接到\
  \ ASP.NET 健康监控系统——Windows 管理体系接口 (WMI) 事件提供程序。\n\n这七个用于 ASP.NET 健康监控系统的提供程序继承自 `WebEventProvider`\
  \ 基类或 `BufferedWebEventProvider`（后者又继承自 `WebEventProvider`），如图 14-14 所示。\n\n![image](img/f549-01.jpg)\n\
  \n**图 14-14**\n\n`WebEventProvider` 类和 `BufferedWebEventProvider` 之间的区别是什么？主要的区别在于\
  \ `WebEventProvider` 在事件发生时立即写入事件，而 `BufferedWebEventProvider` 则保留 Web 事件直到形成一个集合。然后，该集合将批量写入数据库或通过电子邮件发送。如果您使用\
  \ `SqlWebEventProvider` 类，您实际上希望发生这种批处理，而不是让提供程序为发生的每个 Web 事件都与数据库连接并进行写入。\n\n接下来，本章将介绍健康监控系统的七个更主要的可用提供程序中的每一个。\n\
  \n### System.Web.Management.EventLogWebEventProvider\n\n传统上，管理员和开发者习惯在内置的 Windows\
  \ 事件日志中查看系统和应用程序错误。事件日志中的项可以通过“事件查看器”查看。您可以通过在控制面板中选择“管理工具”，然后选择“事件查看器”来找到这个基于 GUI\
  \ 的查看事件的工具。\n\n默认情况下，健康监控系统使用 Windows 事件日志来记录服务器配置文件中已指定的条目，或者您在应用程序的 `web.config`\
  \ 文件中指定的条目。如果您查看服务器上安装的 Microsoft .NET Framework 中 `CONFIG` 文件夹下的 `web.config.comments`\
  \ 文件，您会发现 `EventLogWebEventProvider` 在该位置有详细说明。列表 14-17 展示了相关代码。\n\n如您从列表 14-17\
  \ 中所示，健康监控系统中可以应用许多可能的设置。根据您定义的规则和事件映射，这些条目会被记录到托管应用程序的服务器事件日志中。仔细查看列表中的 `<rules>`\
  \ 部分，您可以看到特定的错误类型被分配用于监控。在此部分中，健康监控系统捕获了两种类型的错误——`All Errors Default` 和 `Failure\
  \ Audits Default`。\n\n当`<rules>` 部分定义的错误之一被触发并被健康监控系统捕获时，它就会被记录。记录在哪里取决于指定的提供程序。`<rules>`\
  \ 部分中 `<add>` 元素使用的 `provider` 属性决定了这一点。在列表 14-17 示例的两种情况下，都可以看到分配了 `EventLogProvider`。这意味着两种类型都使用了\
  \ Windows 事件日志记录。\n\n### System.Web.Management.SimpleMailWebEventProvider\n\n有时当应用程序发生错误时，作为管理员或关注问题的开发者，您希望收到电子邮件通知。除了使用\
  \ `EventLogProvider` 等将事件记录到磁盘外，还可以使用 `SimpleMailWebEventProvider` 将错误电子邮件发送给您。正如提供程序的名称所示，电子邮件是简单构建的。列表\
  \ 14-18 展示了如何在将错误写入 Windows 事件日志的同时添加电子邮件通知。\n\n在例例中，发生的错误被捕获不仅写入事件日志，还会通过电子邮件发送给提供程序定义中指定的最终用户。`SimpleMailWebEventProvider`\
  \ 一个非常有趣的点是，该类继承自 `BufferedWebEventProvider`，而不是像 `EventLogWebEventProvider` 那样继承自\
  \ `WebEventProvider`。继承自 `BufferedWebEventProvider` 意味着可以让健康监控系统在发送之前构建错误通知集合。`<bufferModes>`\
  \ 部分定义了缓冲区的工作方式。\n\n### System.Web.Management.TemplatedMailWebEventProvider\n\n\
  上述 `SimpleMailWebEventProvider` 正如其名称所示发送简单的文本电子邮件。要发送更精美且包含更多信息的电子邮件，可以使用 `TemplatedMailWebEventProvider`。与\
  \ `SimpleMailWebEventProvider` 类似，您只需在 `<healthMonitoring>` 部分适当定义提供程序。列表 14-19\
  \ 展示了此定义的模型。\n\n此提供程序声明与 `SimpleMailWebEventProvider` 之间的主要区别在列表 14-19 中以**粗体**显示。`TemplatedMailWebEventProvider`\
  \ 有一个 `template` 属性，用于指定健康监控系统创建并发送的电子邮件所使用的模板位置。\n\n\n\n\n\n在许多情况下，当你捕获并记录应用程序中发生的\
  \ Web 事件时，你可能希望将它们写入磁盘。`EventLogWebEventProvider` 是一个极佳的提供程序，因为它代表你将这些 Web 事件写入\
  \ Windows 事件日志。然而，在某些情况下，你可能希望将这些 Web 事件写入磁盘的其他位置。在这种情况下，一个很好的替代方案是将这些 Web 事件写入\
  \ SQL Server（或者在写入事件日志的同时也进行写入）。\n\n与写入 Windows 事件日志相比，写入 SQL Server 可以带给你一些优势。当你的应用程序在\
  \ Web 集群（web farm）中运行时，你可能希望跨整个集群发生的所有错误都写入同一个位置。在这种情况下，将所有通过健康监控系统捕获的 Web 事件写入\
  \ SQL Server 实例，并让 Web 集群中的所有服务器都能连接到该实例是有意义的\n\n默认情况下，`SqlWebEventProvider`（与本章为止涵盖的其他基于\
  \ SQL Server 的提供程序一样）使用 SQL Server Express 版作为底层数据库。如果要连接到完整版的 SQL Server，你需要定义如列表\
  \ 14-20 所示的连接。\n\n建立此连接后，下一步是在你的 `web.config` 文件的 `SqlWebEventProvider` 声明中使用该连接，如列表\
  \ 14-21 所示。\n\n现在，事件将代表你记录在 SQL Server 2012 中。`SqlWebEventProvider` 的妙之处在于，与 `SimpleMailWebEventProvider`\
  \ 和 `TemplatedMailWebEventProvider` 一样，它继承自 `BufferedWebEventProvider`。这意味着 Web\
  \ 事件可以批量写入，而不是逐个写入。你可以通过提供程序声明中的 `buffer` 和 `bufferMode` 属性来触发这些批处理。它与 `<healthMonitoring>`\
  \ 声明中 `<bufferModes>` 部分所应用的设置协同工作。\n\n### System.Web.Management.TraceWebEventProvider\n\
  \n调试 ASP.NET 应用程序的一种方法是使用系统内置的跟踪功能。跟踪允许你查看请求、应用程序状态、Cookie、控件树、表单集合等的详细信息。你通过 `TraceWebEventProvider`\
  \ 对象将 Web 事件输出到跟踪输出中。在配置文件中设置 `TraceWebEventProvider` 实例如列表 14-22 所示。\n\n记住，即使部署了提供程序，你也必须将提供程序分配给想要捕获的特定错误。你通过健康监控系统的\
  \ `<rules>` 部分来实现此。\n\n`IisTraceWebEventProvider` 相同，不同之处在于跟踪信息发送到 IIS 而不是 ASP.NET\
  \ 跟踪系统。\n\n### System.Web.Management.WmiWebEventProvider\n\n健康监控系统中内置的提供程序是 `WmiWebEventProvider`。该提供程序允许将来自健康监控系统的任何\
  \ Web 事件映射到 Windows 管理规范 (WMI) 事件。当你将事件传递给 WMI 子系统时，可以将事件表示为对象。\n\n默认情况下，`WmiWebEventProvider`\
  \ 已经为你设置好，你只需要将感兴趣的 Web 事件映射到健康监控声明中 `<rules>` 部分已定义的 `WmiWebEventProvider` 即可。该声明在安装在服务器上的\
  \ Microsoft .NET Framework 的 CONFIG 文件夹下的 `web.config.comments` 文件中记录，并如列表 14-23\
  \ 所示（`WmiWebEventProvider` 以粗体显示)。\n\n记住，健康监控系统使用提供程序模型的奇妙之处在于，它允许对系统捕获的 Web 事件使用多个提供程序。\n\
  \n### 配置提供程序\n\nASP.NET 4.5 的一个很棒的功能是它允许你实际上对配置文件的部分进行加密。你可以加密 `web.config` 文件中定义的\
  \ ASP.NET 节，也可以加密你自己放置在文件中的自定义节。这是让敏感配置信息免受翻阅你应用程序文件库的所有人员窥视的理想方式。\n\n默认情况下，ASP.NET\
  \ 4.5 开箱提供了两个可能的配置提供程序。这些提供程序的定义如下：\n\n*   `System.Configuration.DpapiProtectedConfigurationProvider`：提供使用\
  \ Windows 操作系统内置的数据保护 API (DPAPI) 加密和解密配置节的能力。\n*   `System.Configuration.RsaProtectedConfigurationProvider`：提供使用\
  \ RSA 公钥加密算法加密和解密配置节的能力。\n\n这两个用于配置节加密和解密的提供程序继承自 `ProtectedConfigurationProvider`\
  \ 基类，如图 14-15 所示。\n\n![image](img/f555-01.jpg)\n\n**图 14-15**\n\n接下来，本章将带你介绍这些提供程序的每一个。\n\
  \n### System.Configuration.DpapiProtectedConfigurationProvider\n\n`DpapiProtectedConfigurationProvider`\
  \ 类允许你使用 Windows 数据保护 API (DPAPI) 加密和解密配置节。该提供程序允许你按机器执行这些加密和解密任务。该提供程序不适合在 Web\
  \ 集群中使用。如果你在 Web 集群的配置文件上保护配置，你可能希望关注 `RsaProtectedConfigurationProvider`。\n\n如果你查看服务器上的\
  \ `machine.config`，你会看到 `DpapiProtectedConfigurationProvider` 和 `RsaProtectedConfigurationProvider`\
  \ 的定义。`RsaProtectedConfigurationProvider` 被设置为默认提供程序。要将 `DpapiProtectedConfigurationProvider`\
  \ 为默认提供程序，可以使用应用程序的 `web.config` 文件，或者更改 `machine.config` 文件中 `<configProtectedData>`\
  \ 节点的 `defaultProvider` 属性。在 `web.config` 文件中更改如列表 14-24 所示。\n\n该提供程序在配置文件的 `<configProtectedData>`\
  \ 中定义。注意，此配置节位于 `<system.web>` 之外。\n\n该提供程序定义的两个主要属性如下：\n\n*   `useMachineProtection`\
  \ 属性默认设置为 `true`，这意味着服务器上的所有应用程序共享相同的加密解密配置节的方法。这意味着位于同一机器上的应用程序可以相互执行加密和解密。将 `useMachineProtection`\
  \ 属性设置为 `false` 意味着加密解密仅按应用程序进行。此设置意味着你必须更改运行应用程序的账户，使其与服务器上的应用程序不同。\n*   `keyEntropy`\
  \ 属性提供了一种轻量级方法防止应用程序解密彼此的配置节。`keyEntropy` 属性可以接受任何随机字符串值参与加密和解密过程。\n\n### System.Configuration.RsaProtectedConfigurationProvider\n\
  \n加密解密配置节的默认提供程序是 `RsaProtectedConfigurationProvider`。你可以在应用程序服务器的 `machine.config`\
  \ 文件中查看此设置。列表 14-25 展示了 `machine.config` 文件的代码。\n\n\n\n\n`RsaProtectedConfigurationProvider`\
  \ 使用 Triple-DES 加密来加密配置文件的指定部分。此提供程序仅有几个可用属性。\n\n`keyContainerName` 属性是定义的密钥容器，用于加密/解密过程。默认情况下，此提供程序使用\
  \ .NET Framework 内置的默认密钥容器，但你可以通过此属性轻松将应用程序切换到另一个密钥容器。\n\n`cspProviderName` 属性仅在你指定了要与\
  \ Windows 加密 API (CAPI) 使用的自定义加密服务提供程序 (CSP) 时才使用。如果是这样，你将 CSP 的名称作为 `cspProviderName`\
  \ 属性的值。\n\n`useMachineContainer` 属性允许你指定想要使用机器范围的密钥容器还是用户特定的密钥容器。此属性与在 `DpapiProtectedConfigurationProvider`\
  \ 中找到 `useMachineProtection` 属性非常相似。\n\n`useOAEP` 属性指定在执行加密/解密过程中何时开启可选的非对称加密和填充\
  \ (OAEP) 能力。\n\n## 总结\n\n本章介绍了提供程序模型的基础知识，以及在你开始使用各种可用的 ASP.NET 系统时，可以使用哪些提供程序。了解每个这些系统内置的提供程序以及如何微调每个提供程序的行为是非常重要的。\n\
  \n这种提供程序模型允许额外的抽象层级，并允许你自行决定用于各种系统的底层数据存储器。例如，你有权决定将成员和角色管理信息存储在 SQL Server 中还是\
  \ Oracle 中，而无需对业务或表示逻辑进行任何更改！\n\n下一章将向你展示如何将提供程序模型提升到水平。\n\n# 15 扩展提供程序模型\n\n##\
  \ 本章包含内容\n\n- 修改和扩展提供程序\n- 构建你自己的提供程序\n\n## 本章 WROX.COM 代码下载\n\n请注意，本章中的所有代码示例都可以作为本章代码下载的一部分，在书籍网站的\
  \ [[`www.wrox.com``](http://www.wrox.com) 的“下载代码”（Download Code）选项卡获取。\n\n上一章介绍了\
  \ ASP.NET 4.5 中的提供程序模型，并解释了它如何与成员和角色管理系统一起。\n\n如前一章所述，ASP.NET 4.5 中的这些系统需要长时间维护某种类型的用户状态。它们对状态存储的时间间隔和安全要求高于早期简单使用\
  \ `Session` 对象的系统。开箱即用，ASP .NET 4.5 为你提供了一系列提供程序，作为这些系统状态管理产生的任何数据存储需求的底层连接器。\n\n\
  .NET Framework 4.5 默认安装附的提供程序包含了与任何系统工作所需的最常见状态管理数据存储方式。但像 .NET 中的大多数事物一样，你可以对提供的提供程序进行自定义和扩展。\n\
  \n本章查看了扩展 ASP.NET 4.5 中提供程序模型的一些方法。本章还回顾了提供程序模型的几个示例扩展。首先，你将查看一些修改和扩展 .NET 4.5 默认安装中已有的提供程序的简单方法。\n\
  \n## 提供程序是更大型架构中的一层\n\n记住上一章的内容，提供程序允许你为 ASP.NET 4.5 中的许多系统定义数据访问层。它们还允许你定义核心业务逻辑的实现，即数据如何被操作或处理。它们允许你以统一的方式使用构成这些系统的各种控件和\
  \ API，无论提供程序的底层数据存储方法如何。提供程序模型还允许你轻松地将一个提供程序更换为另一个，而不影响与提供程序交互的底层控件和 API。图 15-1\
  \ 展示了此模型。\n\n![image](img/f560-01.jpg)\n\n**图 15-1**\n\n从此图中，你可以看到成员系统中利用的控件以及 Membership\
  \ API 都使用了定义的提供程序。更改底层提供程序不会更改控件或 API，但你可以修改这些项的行为（正如你很快就会看到的）。你也可以简单地更改这些项所需的的状态管理存储位置。\n\
  \n## 通过基于属性的编程进行修改\n\n修改 .NET Framework 4.5 内置提供程序行为的最简单的方法可能是基于属性的编程。在 ASP.NET\
  \ 4.5 中，你可以通过属性的使用应用高级的行为修改。通过使用 `machine.config` 文件或根 `web.config` 文件中的提供程序定义，你可以更改提供程序的行为。本章提供了一个如何修改\
  \ `SqlMembershipProvider` 的示例。\n\n### 通过 SqlMembershipProvider 实现更简单的密码结构\n\n当你使用\
  \ `SqlMembershipProvider` 实例创建用户时，无论你使用的是 SQL Server Express 还是微软的 SQL Server 2005、2008\
  \ 或 2012，请注意创建用户所需的密码是“半强”密码。当你通过 ASP.NET 网站管理工具创建用户时，这一点显而易见，如图 15-2 所示。有关 ASP.NET\
  \ 网站管理工具的更多信息，请查看附录 D。\n\n![image](img/f561-01.jpg)\n\n**图 15-2**\n\n在此屏幕上，我尝试输入密码并被该密码不符合应用程序的要求。相反，我收到警告，密码最小长度为七个字符，并且至少一个非字母字符。这意味着像\
  \ `Micro$ft` 这样的密码。这种行为是由提供程序指定的，而不是由成员系统使用的控件或 API。你可以在 `C:\\WINDOWS\\Microsoft.NET\\\
  Framework\\v4.0.xxxxx\\CONFIG` 的 `machine.config` 文件中找到要求的定义。列表 15-1 展示了此定义。\n\n\
  \n\n在定义自己的 `SqlMembershipProvider` 实例时，你有几种选择。一种方法如列表 15-2 所示所示，是重新定义 `machine.config`\
  \ 文件中定义的 `SqlMembershipProvider` 命名实例（`AspNetSqlMembershipProvider`，其值来自提供程序声明中\
  \ `name` 属性的值）。如果你采用这种方法，必须 `clear` 之前定义的 `AspNetSqlMembershipProvider` 实例。你必须在\
  \ `<providers>` 节中使用 `<clear />` 节点重新定义 `AspNetSqlMembershipProvider`。如果不这样做，将抛出错误，提示该提供程序名称已定义。\n\
  \n在清除之前的 `AspNetSqlMembershipProvider` 实例后，你使用 `<add>` 元素重新定义该提供程序。在列表 15-2 中，你可以看到通过对\
  \ `minRequiredPasswordLength` 和 `minRequiredNonalphanumericCharacters` 属性使用新值（**加粗显示**），重新定义了密码要求。\n\
  \n定义自己的 `SqlMembershipProvider` 实例的另一种方法是为 `<add>` 元素中定义的提供程序赋予一个唯一的 `name` 属性值。如果你采用这种方法，必须使用\
  \ `defaultProvider` 属性将此新命名实例指定为成员系统的默认提供程序。列表 15-3 展示了这种方法。（由于 `web.config` 发生了多次更改，该文件在本章节的代码下载中保存为\
  \ `Listing15-03.xml` 以于下载。）\n\n在这种情况下，`machine.config` 文件中的 `SqlMembershipProvider`\
  \ 实例（在 `JasonsSqlMembershipProvider` 名称下定义）甚至没有被重新定义。相反在 `web.config` 文件中定义了一个完全新的命名实例（`JasonsSqlMembershipProvider`）。\n\
  \n### 通过 SqlMembershipProvider 构建更强的密码结构\n\n接下来，让我们让密码结构变得复杂一些。当然，你可以通过几种方式完成此任务。一种方法是继续使用相同的\
  \ `minRequiredPasswordLength` 和 `minRequiredNonalphanumericCharacters` 属性（如前所示），使密码符合要求的长度（更长的密码通常更安全），并使密码包含特定数量的非字母字符（这使得密码更安全）。\n\
  \n另一个选项是使用 `passwordStrengthRegularExpression` 属性。如果 `minRequiredPasswordLength`\
  \ 和 `minRequiredNonalphanumericCharacters` 属性无法提供你所需的密码结构，那么使用 `passwordStrengthRegularExpression`\
  \ 属性是你的下一个最佳选择。\n\n作为该属性的示例，假设你要求用户密码包含以下内容：\n\n* 至少一个 (1) 大写字母\n* 至少一个 (1) 小写字母\n\
  * 至少一个 (1) 数字\n* 至少一个 (1) 特殊字符\n* 长度至少八 (8) 个字符\n\n然后你可以像列表 15-4 所示定义你的提供程序。（由于\
  \ `web.config` 发生了多次更改，该文件在本章节的代码下载中保存为 `Listing15-04.xml` 以于下载。）\n\n这里没有使用 `minRequiredPasswordLength`\
  \ 和 `minRequiredNonalphanumericCharacters` 属性，而是使用了 `passwordStrengthRegularExpression`\
  \ 属性并赋予了值 `(?=^.{8,}$)(?=.*\\d)(?=.*\\W+)(?![.\\n])(?=.*[A-Z])(?=.*[a-z]).*$`。\n\
  \n这里的教训是，你有许多方法可以修改 .NET Framework 4.5 安装中已提供的提供程序的行为。你可以通过基于属性的编程调整框架内置的许多提供程序以适应你的需求。`SqlMembershipProvider`\
  \ 示例演示了这种技术，你也可以对任何其他提供程序进行类似的修改。\n\n## 检查 PROVIDERBASE\n\n所有提供程序以某种方式派生自 `System.Configuration.Provider`\
  \ 命名空间的 `ProviderBase` 类。`ProviderBase` 是一个抽象类，用于定义继承提供程序的基模板。观察 `ProviderBase`，注意这个抽象类并没有什么，如图\
  \ 15-3 所示。\n\n![image](img/f564-01.jpg)\n\n**图 15-3**\n\n如所述，这个类并没有很多内容。它实际上是提供程序的根类，其存在是为了允许提供程序初始化自身。\n\
  \n`Name` 属性用于提供友好名称，例如 `AspNetSqlRoleProvider`。`Description` 属性用于启用提供程序的文本描述，该描述稍后可以被任何管理工具使用。`ProviderBase`\
  \ 类主要项是 `Initialize()` 方法。这里是 `Initialize()` 的构造函数：\n\n```\npublic virtual void\
  \ Initialize(string name, NameValueCollection config)\n```\n\n注意 `Initialize()`\
  \ 方法的两个参数。第一个是 `name` 参数，它仅仅是赋值给配置文件提供程序声明中 `name` 属性的值。`config` 参数的类型为 `NameValueCollection`，它是名称和值对的集合。这些名称/值对也是在配置文件提供程序声明中定义的项。\n\
  \n\n\n你现在将检查构建自己的提供程序以在 ASP.NET 应用程序使用的过程。实际上，组合这些提供程序并不困难（你很快就会看到），而且可以在你的任何 ASP.NET\
  \ 4.5 项目中直接创建。本示例演示了如何构建一个从 XML 文件工作的成员提供程序（membership provider）。对于较小的网站来说，这种情况可能很常见。对于较大的网站和基于\
  \ Web 的应用程序，你可能希望使用某种数据库而不是 XML 文件来管理用户。\n\n在构建自己的成员提供程序时，你有几个选择。你可以派生自几个类——`SqlMembershipProvider`\
  \ 类或 `MembershipProvider` 类——来构建你需要的功能。只有当你想要扩展或更改成员系统与 SQL 交互时的行为时，才派生自 `SqlMembershipProvider`\
  \ 类。由于此处的目标是构建一个只读的 XML 成员提供程序，因此派生此类是不合适的。在这种情况下，基于 `MembershipProvider` 类构建一切是最佳选择。\n\
  \n## 创建 CustomProviders \n\n在本节中，你将使用任 way 语言创建一个名为 `CustomProviders` 的新网站项目。对于此示例，你希望直接在\
  \ Web 应用程序中构建新的成员提供程序。另一种选项是在类库项目中构建提供程序，然后在 Web 项目中引用生成的 DLL。最终哪种方式都可以。\n\n由于你将直接在在网站项目本身中构建此提供程序，因此你需要在应用程序中创建\
  \ `App_Code` 文件夹。该位置是你想要放置创建的类文件的地方。在这种情况下，类文件就是实际的提供程序。\n\n`App_Code` 文件夹到位后，在该文件夹中创建一个新类，并根据你使用的语言将类命名为\
  \ `XmlMembershipProvider.vb` 或 `XmlMembershipProvider.cs`。该类就绪后，让你的新 `XmlMembershipProvider`\
  \ 类派生自 `MembershipProvider`。为了完成此任务并知道要覆盖哪些方法和属性，你可以使用 Visual Studio 2012 构建你想要创建的类的骨架。你可以从列表\
  \ 15-5 中演示的代码开始执行此过程。\n\n首先，你将对这个新类 `XmlMembershipProvider` 类进行一个更改。你将更新它使其继承自 `MembershipProvider`。\n\
  \n## 构建所需的类骨架\n\n要让 Visual Studio 2012 使用适当的方法和属性为你生成类的存根，请采取以下步骤（取决于你使用的语言）。如果你使用\
  \ Visual Basic，只需按 Enter 键即可。在 C# 中，你只需要在代码中的 `MembershipProvider` 语句上点击右键，并从可用选项选择“实现抽象类”（Implement\
  \ Abstract Class）。另一种选项是将光标置于文档窗口中的 `MembershipProvider` 语句上，然后从 Visual Studio 菜单中选择“编辑\
  \ IntelliSense 实现抽象类”。执行这些操作之一后，你会在 Visual Studio 的文档窗口中看到类的完整骨架。列表 15-6 显示了如果你正在创建一个\
  \ C# `XmlMembershipProvider` 类将生成的代码（你很快就会知道我们在这里只显示 C# 示例了）。\n\n哇，这么多代码！虽然骨架已经到位，但下一步是为\
  \ Visual Studio 为你布局的提供程序的某些项目编写代码——从持有所有允许访问应用程序用户的 XML 文件开始。\n\n## 创建 XML 用户数据存储\n\
  \n由于此提供程序是 XML 成员提供程序，其意图是从 XML 文件读取用户信息，而不是来自 SQL Server 等数据库。因此，你必须定义提供程序可以使用\
  \ XML 文件结构。列表 15-7 显示了此示例使用的结构（每个相应项目中的 `App_Data\\Users.xml`）。\n\n此 XML 文件持有三个用户实例，所有实例都包含用户名、密码、电子邮件地址以及用户创建的日期。由于它是数据文件，你应该将此文件放在\
  \ ASP.NET 应用程序的 `App_Data` 文件夹中。你可以将文件命名为任何名称；在本例中，我们将文件命名为 `Users.xml`。\n\n稍后，本章将回顾在验证用户时如何从\
  \ XML 文件中获取这些值。\n\n## 在 web.config 文件中定义提供程序实例\n\n正如你在上一个关于提供程序的章节中所见的那样，你可以在配置文件（如\
  \ `machine.config` 或 `web.config` 文件）中定义提供程序及其行为。由于此提供程序是为单个应用程序实例构建的，此示例在应用程序的\
  \ `web.config` 文件中定义了提供程序。\n\n默认提供程序是 `SqlMembershipProvider`，它定义在服务器上的 `machine.config`\
  \ 文件中。对于此示例，你必须覆盖此设置并建立一个新的默认提供程序。`web.config` 中的 XML 成员提供程序声明应如列表 15-8 所示。\n\n\
  在此列表中，你可以看到默认提供程序被定义为 `XmlFileProvider`。因为在任何父级文件中都找不到此提供程序名称，因此你必须在 `web.config`\
  \ 文件中定义 `XmlFileProvider`。\n\n使用 `defaultProvider` 属性，你可以定义要为成员系统使用的提供程序名称。在本例中，它是\
  \ `XmlFileProvider`。然后你使用 `<add>` 元素定义 `XmlFileProvider` 实例。<add>` 元素为提供程序命名——`XmlFileProvider`。它还指向提供程序的类（或类型）。在这种情况下，它是你刚刚创建的骨架类\
  \ `MembershipProvider`。\n\n除了已使用的属性外，你可以在提供程序声明中创建任何需要的属性。无论你创建什么类型的提供程序，都必须处理提供程序的属性并根据属性提供的值进行操作。对于简单的\
  \ `XmlMembershipProvider`，只有一个自定义属性——`xmlDatabaseFile`。此属性指向用户数据库 XML 文件的位置。对于此提供程序，这是一个可选属性。如果你不为\
  \ `xmlDatabaseFile` 提供值，则有一个默认值。但在列表 15-8 中，你可以看到确实为 XML 文件提供了值。请注意 `xmlDatabaseFile`\
  \ 仅仅是文件名。\n\n示例中未显示一个属性，但它是允许的属性，因为它在 `XmlMembershipProvider` 类中被处理。该属性即 `applicationName`\
  \ 属性指向 `XmlMembershipProvider` 实例应该处理的应用程序。这是默认值，你也可以将其放在配置文件中的提供程序声明中：\n\n```\n\
  applicationName=\"/\"\n```\n\n## 实现 MembershipProvider 类的方法和属性\n\n现在，将注意力转向 `XmlMembershipProvider`\
  \ 类。下一步是实现提供程序所需的任何方法或属性。你不需要对骨架中包含的方法进行任何实际使用；相反，你只需要构建你感兴趣要处理的方法。例如，如果你不允许通过编程访问更改密码（以及间接允许使用此编程访问的控件），你可能希望不启动任何操作，或者当有人尝试实现此方法时抛出异常，如列表\
  \ 15-9 所示。\n\n\n\n\n在这种情况下，如果调用了 `ChangePassword()` 方法，将抛出一个 `NotSupportedException`。如果你不想抛出实际异常，可以简单地返回一个\
  \ `false` 值而不采取任何其他操作，如 列表 15-10 所示（尽管不抛出异常可能会让尝试实现此提供程序的开发人员感到困扰）。\n\n本章并没有涵盖你对\
  \ `XmlMembershipProvider` 可以采取的所有可能操作，因此，你可能需要仔细研究派生类 `MembershipProvider` 实例的可用方法和属性，并对任何你将不会使用的项进行必要的更改。\n\
  \n## 实现 MembershipProvider 类的方法和属性\n\n现在是时候实现 `MembershipProvider` 类提供的一些方法和属性，以使\
  \ `XmlMembershipProvider` 类能够工作。第一个项是一些私有变量，多个方法在整个类中可以使用这些变量。列表 15-11 展示了这些变量声明。\n\
  \n声明的变量是类中多个方法所需的项。定义的 `_AppName` 变量将被设置为使用 XML 成员提供程序的应用程序名称。在所有情况下，它都是本地应用程序。你还希望将从\
  \ XML 文件中找到的所有成员放入某种类型的集合中。此示例使用了名为 `_MyUsers` 的泛型字典类型。最后，此示例通过 `_FileName` 变量指向要使用的文件。\n\
  \n### 定义 ApplicationName \n\n在私有变量就位后，下一步是定义 `ApplicationName` 属性。你现在开始使用第一个私有变量——`_AppName`。列表\
  \ 15-12 展示了 `ApplicationName` 的属性定义。\n\n既然 `ApplicationName` 属性已经定义并就位，下一步是从 `web.config`\
  \ 文件的提供程序声明（`XmlFileProvider`）中检索定义的值。\n\n### 扩展 Initialize() 方法\n\n你现在扩展 `Initialize()`\
  \ 方法，使其能够读取在 `web.config` 文件的提供程序声明中定义的自定义属性及其关联值。查看你的 `XmlMembershipProvider` 类的类骨架，注意在可用项列表中没有包含\
  \ `Initialize()` 方法。\n\n`Initialize()` 方法在提供程序首次初始化时被调用。重写此方法并不是强制要求的，因此，你不会在类骨架的声明中看到它。要在\
  \ `XmlMembershipProvider` 类中放置 `Initialize()` 方法，只需在类中输入 `Public Overrides`（针对 Visual\
  \ Basic）或 `public override`（针对 C#）。IntelliSense 随后向你展示 `Initialize()` 方法，如 图 15-5\
  \ 所示。\n\n![image](img/f574-01.jpg)\n\n**图 15-5**\n\n以这种方式在类中放置 `Initialize()` 方法非常简单。从\
  \ IntelliSense 列表中选择 `Initialize()` 方法并按回车键。该方法将在你的代码中生成该方法的基础结构，如 列表 15-13 所示。\n\
  \n`Initialize()` 方法接收两个参数。第一个参数是参数名称。第二个是来自 `web.config` 文件提供程序声明的名称/值集合。该集合包含了所有的属性及其值，例如\
  \ `xmlUserDatabaseFile` 属性以及持有用户信息的 XML 文件命名的值。使用 `config`，你可以访问这些定义值。\n\n对于 `XmlFileProvider`\
  \ 实例，你如 列表 15-14 所示处理 `applicationName` 属性和 `xmlUserDatabaseFile` 属性。\n\n除了使用 `MyBase.Initialize()`\
  \ 执行初始化外，你还使用 `config` 获取 `applicationName` 和 `xmlUserDatabaseFile` 属性的值。在所有情况下，你应该首先检查该值是否为空或空。如果\
  \ `web.config` 文件中的提供程序声明缺少属性，你使用 `String.IsNullOrEmpty()` 方法来分配默认值。在 `XmlFileProvider`\
  \ 实例的情况下，情况确实如此。`XmlFileProvider` 声明中的 `applicationName` 属性实际上没有声明，因此分配了默认值 `/`\
  \ 作为该值。\n\n在 `xmlUserDatabaseFile` 属性的情况下，提供了一个值。如果 `web.config` 文件中未提供值，提供程序将在\
  \ App_Data 文件夹中查找名为 `Users.xml` 的 XML 文件。\n\n### 验证用户\n\n成员提供程序最重要的功能之一是它可以验证用户（即对其进行身份验证）。用户验证是通过\
  \ ASP.NET Login 控件完成的。该控件反过来使用 `Membership.ValidateUser()` 方法，最终最终使用 `XmlMembershipProvider`\
  \ 类中的 `ValidateUser()` 方法。\n\n现在 `Initialize()` 方法和私有变量已就位，你可以开始为提供程序提供一些功能。列表 15-15\
  \ 展示了 `ValidateUser()` 方法的实现。\n\n查看 `ValidateUser()` 方法，可以看到它接收两个参数：用户名和密码。`ValidateUser()`\
  \ 返回的值是 `Boolean`，用于指示验证的成功或失败。\n\n`ValidateUser()` 方法执行的第一个操作是检查用户名或密码是否缺失。如果其中某项缺失，将返回\
  \ `False`。\n\n从那里开始，尝试检查 XML 文件中是否包含用户密码。从 XML 文件获取用户信息并将其放入 `MyUsers` 变量是由 `ReadFileFile()`\
  \ 方法完成。该方法稍后描述，但重要的概念是 `_MyUsers` 是 `Dictionary` 类型的实例。键是用户名的小写字符串值，而值是 `MembershipUser`\
  \ 类型。\n\n在 `_MyUsers` 对象填充了 XML 文件中的所有用户后，创建了一个 `MembershipUser` 实例。该对象是 `TryGetValue`\
  \ 操作的输出。`MembershipUser` 不包含用户密码，因此，`ReadFile()` 方法将用户的密码设置为 `MembershipUser` 类的\
  \ `Comment` 属性的值。如果在字典中找到了用户名，则将该特定 `MembershipUser` 实例的密码与 `Comment` 属性的值进行比较。如果发现相同，则\
  \ `ValidateUser()` 方法返回 `True`。\n\n如你所见，此方法确实依赖于 `ReadFile()` 方法的结果，接下来将讨论。\n\n\
  ### 构建 ReadFile() 方法\n\n`ReadFile()` 方法读取包含应用程序所有用户的 XML 文件内容。该方法是一个自定义方法，其工作在 `ValidateUser()`\
  \ 方法之外完成。这意味着你可以在可能实现的其他方法中重用它（例如 `GetAllUsers()` 方法）。`ReadFile()` 方法唯一的工作是读取 XML\
  \ 文件的内容并将所有用户放入 `_MyUsers` 变量中，如 列表 15-16 所示。\n\n\n\n\n\n`ReadUserFile()` 方法的第一个操作是对正在运行的线程中即将发生的操作进行加锁。这是\
  \ ASP.NET 的一个独特特性。当你编写自己的提供程序时，请务必使用线程安全的代码。对于你在 ASP.NET 中编写的大多数条目，例如 `HttpModule`\
  \ 或 `HttpHandler`（在第 30 章 中有所介绍），你不需要让它们变成线程安全的。这些项可能在多个线程上同时运行多个请求，并且每个线程向 `HttpModule`\
  \ 或 `HttpHandler` 发起的请求所看到的都是这些项的唯一实例。\n\n与 `HttpHandler` 不同，你的 ASP.NET 只会创建一个并利用提供程序的实例。如果你的应用程序收接收了多个请求，所有这些线程都会尝试访问应用程序中包含的单个提供程序实例。由于可能有多个请求同时进入提供程序实例，因此你应该以线程安全的方式创建提供程序。你可以在执行如文件\
  \ I/O 操作等任务时使用 lock 操作来实现这一点。要锁定访问，请在 `ReadUserFile()` 方法中使用 `SyncLock`（针对 Visual\
  \ Basic）和 `lock`（针对 C#）语句。\n\n然而，这种代码构造的优势在于你的应用程序中运行的是单个提供程序实例。在 `_MyUsers` 对象填充了\
  \ XML 文件内容后，你不需要重新填充该对象。提供程序实例并不会向请求者发出响应后消失。相反，提供程序实例保留在内存中并用于多次请求，这就是在读取 XML 文件之前检查\
  \ `_MyUsers` 是否包含任何值的原因。\n\n如果你发现 `_MyUsers` 为空，请使用 LINQ to XML 获取文档中的每个 `<User>`\
  \ 元素。对于文档中的每个 `<User>` 元素，你将值分配给 `MembershipUser` 实例。`MembershipUser` 对象接收以下参数：\n\
  \n```\n public MembershipUser (\n      string providerName,\n      string name,\n\
  \      Object providerUserKey,\n      string email,\n      string passwordQuestion,\n\
  \      string comment,\n      bool isApproved,\n      bool isLockedOut,\n      DateTime\
  \ creationDate,\n      DateTime lastLoginDate,\n      DateTime lastActivityDate,\n\
  \      DateTime lastPasswordChangedDate,\n      DateTime lastLockoutDate\n  )\n\
  ```\n\n虽然你不需要为此构造中的每一个项目提供值，但真正需要的值是使用 `XElement` 对象从 XML 文件中提取的。在 `MembershipUser`\
  \ 对象填充了你想要的所有内容后，下一个工作是使用以下代码将这些项添加到 `_MyUsers` 对象中：\n\n```\n _MyUsers.Add(mu.UserName.ToLower(),\
  \ mu);\n```\n\n如前所述，一旦有了 `ReadUserFile()` 方法，你现在可以在 `ValidateUser()` 方法之外使用它。请记住，在填充\
  \ `_MyUsers` 集合后，你不需要再次填充该集合。相反，它将保留在处供其他方法使用。接下来，本章将介绍如何在你的 ASP.NET 应用程序中使用目前所演示的内容。\n\
  \n### 使用 XmlMembershipProvider 进行用户登录\n\n如果你已经完成了示例的这一步，那么就不需要做太多工作就可以使用 `XmlMembershipProvider`\
  \ 类了。到此时，你应该已经准备好了 XML 数据文件，它代表了应用程序的所有用户（该 XML 文件在较早的列表 15-7 中出现），以及应用程序 `web.config`\
  \ 文件中的 `XmlFileProvider` 声明（对 `web.config` 文件的更改出现在列表 15-8 中）。当然，另一个必要的项是应用程序 App_Code\
  \ 文件夹中的 `XmlMembershipProvider.vb` 或 `.cs` 类。然而，如果你使用类库项目模板构建了提供程序，你只需要确保创建的 DLL\
  \ 在 ASP.NET 应用程序中被正确引用（这意味着 DLL 位于 Bin 文件夹中）。一旦准备好这些项，开始使用提供程序就非常简单。\n\n为了快速示例，只需创建一个仅包含文本\
  \ `You are authenticated!` 的 `Default.aspx` 页面即可。\n\n接下来，你创建一个 `Login.aspx` 页面，并在页面上放置单个\
  \ Login 服务器控件。除了放置控件外，你不需要对 `Login.aspx` 页面进行任何其他更改。用户现在可以登录应用程序了。\n\n当你的微型 ASP.NET\
  \ 应用程序中准备好这两个文件后，下一步是对 `web.config` 文件进行一些微改，以允许表单身份验证并拒绝所有匿名用户查看任何页面。列表 15-17 展示了这部分代码。\n\
  \n现在，运行 `Default.aspx` 页面，你会被立即重定向到 `Login.aspx` 页面（你应该已经在应用程序中创建了此文件，且它应该只包含一个\
  \ Login 服务器控件），在该处应用 XML 文件中存在的用户名和密码组合之一。就如此！\n\nASP.NET 4.5 中这种基于提供程序的模型的优点是，当对底层提供程序进行这些重大更改时，与提供程序工作的控件并不知道区别。在这个示例中，你移除了默认的\
  \ `SqlMembershipProvider` 并将其替换为只读 XML 提供程序。当用户点击 Login 服务器控件内的登录按钮时，控件仍然在使用 `Membership.ValidateUser()`\
  \ 方法，该方法正与创建的 `XmlMembershipProvider` 工作。正如你所看到的，这种模型是强大的。\n\n## 扩展提供程序\n\n除了从 `MembershipProvider`\
  \ 等抽象类构建自己的提供程序外，另一种方案是扩展 ASP.NET 自带的提供程序。例如，你可能对使用 SQL Server 进行身份和角色管理感兴趣，但想更改默认提供程序（`SqlMembershipProvider`\
  \ 或 `SqlRoleProvider`）的底层工作。如果你将与提供程序使用的底层数据存储进行工作，那么更改现有提供程序的行为比从头构建一个新的提供程序更有意义。\n\
  \n从现有提供程序进行工作的另一个优势是，不需要重写提供程序公开的所有内容。相反，如果你仅对更改内置提供程序的特定行为感兴趣，你可能只需要重写几个公开的方法，而无需其他，这使得这种方法在你的应用程序中实现变得非常简单快速。\n\
  \n接下来，本章将介绍如何扩展一个内置提供程序以更改提供程序的底层功能。\n\n### 使用新的 LimitedSqlRoleProvider 限制角色能力\n\
  \n假设你想在你的 ASP.NET 应用程序中使用角色管理系统，并完全打算使用 SQL Server 作为系统的后端。假设你还想限制开发者在应用程序中可以创建的角色，并想移除他们将用户添加到系统中特定角色的功能。\n\
  \n与其从 `RoleProvider` 抽象类从零构建角色提供程序，不如从 `SqlRoleProvider` 派生你的提供程序，并简单更改处理创建角色和将用户添加到角色的方法更有意义。\n\
  \n对于此示例，像之前一样在应用程序的 App_Code 文件夹中创建提供程序。但实际上，如果你想在整个公司使用此提供程序，你可能希望创建一个类库项目，这样你的开发团队可以使用\
  \ DLL 而不是可修改的类文件。\n\n\n\n\n\n在 `App_Code` 文件夹中，创建一个名为 `LimitedSqlRoleProvider.vb`\
  \ 或 `.cs` 的类文件。你希望此类继承自 `SqlRoleProvider`，这将为你提供如列表 15-18 所示的结构。\n\n创建此类类与创建 `XmlMembershipProvider`\
  \ 类类似。然而，当你创建它时，你可以使用 Visual Studio 构建整个类的骨架，包括你为了让新类运行而必须重写的所有方法和属性。在这种情况下，如果你在\
  \ Visual Studio 中尝试相同的操作，你会得到错误（如果使用 C#）或者可能完全没有结果（如果使用 Visual Basic），因为你处理的不是一个抽象类。你不需要重写大量的方法和属性。相反，由于你派生自一个已经继承了这些抽象类之一的类，你只需要重写你必须处理的方法和属性即可，而无需其他操作。\n\
  \n要在 Visual Studio 中获取此方法和属性列表，你只需输入 `Public Overrides`（使用 Visual Basic 时）或 `public\
  \ override`（使用 C# 时）。然后，elliSense 就会为你提供一个包含可用方法和属性的大型下拉列表，如图 15-6 所示。\n\n![image](img/f582-01.jpg)\n\
  \n**图 15-6**\n\n对于此示例，你只重写了 `CreateRole()`、`AddUsersToRoles()` 和 `DeleteRole()`\
  \ 方法。它们在接下来被描述。\n\n### CreateRole() 方法\n\n`SqlRoleProvider` 类中的 `CreateRole()` 方法允许开发者向系统添加任何角色。该方法的唯一参数是作为角色名称的字符串值。对于此示例，该提供程序没有让开发者创建任何角色，而是将角色创建限制为仅\
  \ Administrator（管理员）和 Manager（经理）角色。为了在 `CreateRole()` 方法中实现这一点，你按照列表 15-19 所示编写该方法。\n\
  \n在此方法中，你可以看到首先会检查正在创建的角色是否为 Administrator 或 Manager。如果创建的角色不是这些定义角色之一，则会抛出 `ProviderException`，告知开发者其允许创建哪些角色。\n\
  \n如果 Administrator 或 Manager 是其中的角色之一，则调用基类（`SqlRoleProvider.CreateRole()` 方法）。\n\
  \n### DeleteRole() 方法\n\n如果你允许使用此提供程序的开发者仅创建特定角色，你可能不希望他们在角色创建后删除任何角色。如果是这样，你希望重写\
  \ `SqlRoleProvider` 类的 `DeleteRole()` 方法，如列表 15-20 所示。\n\n查看 `DeleteRole()` 方法，你可以看到完全禁止删除任何角色。它将返回一个\
  \ `false` 值且不执行任何操作，而不是调用基类的 `DeleteRole()` 并返回以下内容：\n\n```\nreturn this.DeleteRole(roleName,\
  \ throwOnPopulatedRole);\n```\n\n另一种方法是抛出 `NotSupportedException`，如下所示：\n\n```\n\
  throw new NotSupportedException();\n```\n\n### AddUsersToRoles() 方法\n\n当你查看可以重写的方法时，请注意只有一个方法允许你将任意数量的用户添加到任意数量的角色中。`Roles`\
  \ 类中的多个方法实际上都映射到此方法。如果你查看 `Roles` 类，请注意你可以使用的 `AddUserToRole()`、`AddUserToRoles()`、`AddUsersToRole()`\
  \ 和 `AddUsersToRoles()` 方法。所有这些实际上都映射到 `RoleProvider` 基类中的 `AddUsersToRoles()` 方法。\n\
  \n例如，假设你希望允许开发者仅将用户添加到 Manager 角色，而不将任何用户添加到 Administrator 角色。你可以通过构造一个方法来实现这一点，如列表\
  \ 15-21 所示。\n\n此重写的方法会遍历所有提供的角色，如果字符串数组中包含的角色之一是 Administrator 角色，则会抛出一个 `ProviderException`\
  \ 实例，告知开发者不允许向此特定角色添加任何用户。虽然这里没有显示，你也可以对 `RoleProvider` 基类暴露的 `RemoveUsersFromRoles()`\
  \ 方法采取相同的方法。\n\n### 使用新的 LimitedSqlRoleProvider 提供程序\n\n在部署并准备好使用提供程序后，你必须对 `web.config`\
  \ 文件进行一些修改，以便在 ASP.NET 应用程序中使用该提供程序。你可以在列表 15-22 中学习如何为该提供程序向 `web.config` 文件添加所需内容。\n\
  \n记住，你必须通过为 `defaultProvider` 属性提供值并定义应用程序中使用的提供程序，并在 `<providers>` 部分进一步定义该提供程序。你还必须通过将\
  \ `enabled` 属性设置为 `true` 来启用该提供程序。默认情况下，角色管理系统是禁用的。\n\n使用 `<add>` 元素，你可以添加使用 `LimitedSqlRoleProvider`\
  \ 类的提供程序实例。由于此提供程序派自 `SqlRoleProvider` 类，你必须使用该提供程序需要的一些相同属性，例如 `connectionString`\
  \ 属性。\n\n在 `LimitedSqlRoleProvider` 实例化并配置 `web.config` 文件后，你可以像以前在应用程序中使用 `Roles`\
  \ 类，但注意此类的行为与普通的 `SqlRoleProvider` 不同。\n\n要查看运行效果，请创建一个简单的 ASP.NET 页面，包含 `TextBox`、`Button`\
  \ 和 `Label` 服务器控件。该页面应如列表 15-23 所示。\n\n此简单的 ASP.NET 页面允许你在文本框中输入字符串值并尝试创建新角色。注意，除\
  \ Administrator 和 Manager 以外的任何角色会导致错误。因此，当调用 `Roles.CreateRole()` 时，如果未遵循提供程序定义的规则，就会产生错误。事实上，运行此页面输入\
  \ Manager 角色以外的角色将得到如图 15-7 所示的结果。\n\n![image](img/f586-01.jpg)\n\n**图 15-7**\n\n\
  为了展示此提供程序的运行情况，创建另一个 ASP.NET 页面，允许你向特定角色添加用户。如所述，你可以可以使用许多方法来实现，但在情况下，本示例使用了列表 15-24\
  \ 所示的 `Roles.AddUserToRole()` 方法。\n\n在此示例中提供了两个文本框。第一个询问用户名，第二个询问要添加用户的角色。按钮点击事件的代码使用\
  \ `Roles.AddUserToRole()` 方法。由于你构建了提供程序，你知道如果尝试将用户添加到 Administrator 角色，则会抛出异常。此尝试在图\
  \ 15-8 中所示。\n\n![image](img/f588-01.jpg)\n\n**图 15-8**\n\n在这种情况下，尝试将 Jason 添加到 Administrator\
  \ 角色。这当然会抛出一个错误并返回提供程序中定义的错误消息。\n\n\n\n\n在本章和上一章中，你已经了解提供模型（provider model）的概述，以及它对你今天构建的\
  \ ASP.NET 4.5 应用程序的意义。虽然内置了许多提供程序供你与 ASP.NET 提供的许多系统进行交互，但你并不局限于这些提供程序。你完全可以构建自己的提供程序，或者扩展系统中已有提供程序的功能。\n\
  \n本章探讨了这两种场景。首先，你构建了自己的提供程序，使用 XML 数据存储作为用户数据以用于成员系统；然后，你通过了一个扩展 `SqlRoleProvider`\
  \ 类（ASP.NET 中已有的类）的示例，来更改该提供程序的底层行为。\n\n# 第五部分\n\n ASP.NET 特性\n\n* 第 16 章：使用主页\n\
  * 第 17 章：站点导航\n* 第 18 章：个性化\n* 第 19 章：成员和角色管理\n* 第 20 章：安全性\n\n# 16\n\n使用主页\n\n\
  ## 本章包含内容？\n\n* 编写主页和内容页\n* 使用主页指定默认内容\n* 通过程序代码分配主页\n* 嵌套主页\n* 针对不同浏览器的主页\n* 理解主页的事件顺序\n\
  * 在 ASP.NET AJAX 中使用主页\n\n## 本章 WROX.COM 代码下载\n\n请注意，本章中的所有代码示例都可以作为本章代码下载的一部分，在书籍网站的\
  \ [`www.wrox.com`](http://www.wrox.com) 的“Download Code”选项卡下载。\n\n视觉继承（Visual inheritance）是\
  \ ASP.NET 提供的一项伟大功能，你可以用它来构建网页。该功能在 2.0 版本中首次引入 ASP.NET。实际上，你可以创建一个单一模板页面，将其作为应用程序中任意\
  \ ASP.NET 内容页的基础。这些模板被称为*主页*（master pages），它们通过让应用程序更容易构建以及构建后更容易管理，提高了你的工作效率。Visual\
  \ Studio 2012 为主页提供了完整的设计器支持，让开发体验比以往任何时候都更加丰富。例如，即使你有嵌套的主页，Visual Studio 也会为你提供一个页面在浏览器中实际外观的真实所见即所得（WYSIWYG）视图。\n\
  \n本章详细研究了如何在应用程序中充分利用主页，并从解释主页的优势开始。\n\n## 为什么你需要主页？\n\n如今大多数网站都有通用元素，这些元素贯穿整个应用程序或应用程序中的大部分页面。例如，如果你查看路透社新闻网站的主页（[`www.reuters.com`](http://www.reuters.com)），你会看到贯穿整个网站的通用元素。这些通用区域在图\
  \ 16-1 中标记。\n\n![image](img/f592-01.jpg)\n\n**图 16-1**\n\n在截图中，注意页面上的头部部分、导航部分和页脚部分。事实上，整个站点中的几乎每个页面都使用了这些元素。即使在主页出现之前，你也有各种方法将这些元素放入每个页面；但在大多数情况下，这样做会带来困难。\n\
  \n一些开发者简单地将这些通用部分的代码复制并粘贴到需要它们的每一个页面中。这种方法虽然可行，但非常耗费精力——每当你需要对这些通用部分之一进行更改时，你必须进入每一个页面并重复该更改。这并无趣，而且是对时间的低效利用！\n\
  \n在经典活动服务器页（Classic Active Server Pages）时代，一种流行的选择是将所有通用部分放入一个所谓的*包含文件*（include\
  \ file）中。然后你可以这样将此文件置于页面中：\n\n```asp\n <!-- #include virtual=\"/myIncludes/header.asp\"\
  \ -->\n```\n\n使用 `include` 文件的问题是，你必须考虑到头部 `include` 文件中新打开的 HTML 标签。这些标签必须在主文档或页脚\
  \ `include` 文件中关闭。保持所有 HTML 标签的顺序通常很困难，特别是当多人协作一个项目时。网页有时会因为标签关闭或开启不当或不存在而显示出奇怪的结果。在视觉设计器中处理\
  \ `include` 文件也是困难的。使用 `include` 文件无法让开发者看到页面在浏览器中显示的完整界面。开发者最终分段开发页面，并*希望*这些部分能够按计划组合在一起。许多小时被浪费在“追逐”在\
  \ `include` 文件中打开但在稍后关闭的表格上！\n\n随着 2000 年 ASP.NET 1.0 的引入，开发者开始使用*用户控件*（user controls）来封装网页的通用部分。例如，你只需通过将这些代码段拖放到每个需要它们的页面上，就可以构建出一个包含头部、导航和页脚部分的网页。\n\
  \n这种技术是有效的，但也引发了一些问题。在 Visual Studio 2005 和 ASP.NET 2.0 之前，用户控件引起了与 `include` 文件类似的问题。当你\
  \ Web 页面的设计视图中工作时，页面的通用区域在 Studio 2002 和 2003 中仅显示为灰色框。这使得构建页面变得困难：在编译并在浏览器中运行之前，你无法看到页面的实际样子。用户控件也面临与\
  \ `include` 文件相同的问题——你必须在单独文件中匹配 HTML 标签的开启和关闭。我个人喜欢用户控件而不是 `include` 文件，但用户控件并不是用于应用程序的完美模板片段。考虑到\
  \ `include` 文件和用户控件的问题，ASP.NET 团队开发了*主页*的概念——这是将模板应用于应用程序的卓越方式。它们反转了开发者解决问题的方法。主页位于你开发的页面之外，而用户控件位于页面内部并注定会重复。这些主页在跨页面传输的通用区域与每个页面独特的内容区域之间划分了更清晰的界限。你会发现使用主页既简单又有趣。本章的下一节将介绍主页的基础知识。\n\
  \n## 主页的基础知识\n\n主页是一种提供模板的简单方法，供任意 ASP.NET 页面使用。在处理主页时，你创建一个主文件，作为*子页面*（subpage）或*内容页*（content\
  \ page）引用的模板。主页使用 `.master` 文件扩展，而内容页使用你熟悉的 `.aspx` 文件扩展；但内容页在文件的 `Page` 指令中声明为此类。\n\
  \n你可以将任何想要作为模板一部分的内容放在 `.master` 文件中，例如整个 Web 应用程序使用的头部、导航和页脚部分。此时内容页本身将只包含所有页面特定的内容，而不包含主页的元素。在运行时，ASP.NET\
  \ 引擎会将这些元素合并成单一页面供最终用户使用。图 16-2 显示了此过程工作原理的图。\n\n![image](img/f593-01.jpg)\n\n\n\
  \n\nFIGURE 16-2\n\n使用主页（master pages）的一个优点是，当你创建内容页面时，可以在 IDE 中看到模板。由于你可以在处理页面时看到整个页面，因此开发使用模板的内容页面要容易得多。当你在编辑内容页面时，所有模板项都显示为灰色且不可编辑。你唯一可以更改的项在模板中有清晰的显示。这些可操作的区域被称为\
  \ `content areas`（内容区域），它们最初定义在主页本身。在主页中，你指定了内容页面可以使用页面区域。如果你需要，在主页中可以设置多个内容区域。图\
  \ 16-3 显示了带有几个内容区域的主页。\n\n![image](img/f594-01.jpg)\n\n### FIGURE 16-3\n\n如果你查看图\
  \ 16-3 中的截图，可以隐约地看到页面上有两个定义的区域——这些就是内容区域。任何内容区域在页面的设计视图中都由一个浅虚框表示，代表 `ContentPlaceHolder`\
  \ 控件。此外，当你将鼠标悬停在内容区域上时，控件名称会出现在控件上方（尽管颜色较浅）。这种悬停效果在图 16-3 中也有实际演示。\n\n许多公司和组织发现使用主页是理想的，因为这项技术紧密地模拟了他们典型的业务需求。许多公司在其整个内网中应用统一的外观和效果。他们可以为公司的各个部门提供一个\
  \ `.master` 文件，以便在创建内网的部门章节时使用。这一过程使公司在整个内网中保持一致的外观变得非常简单。\n\n## 编写主页\n\n现在是时候查看之前在图\
  \ 16-3 中所示的主页了。你可以在任何文本编辑器中创建它，但当然，我们建议你使用 Visual Studio 2012 或 Visual Studio Express\
  \ 2012 for Web。本章将演示如何使用 Visual Studio 2012 来实现。\n\n你向项目添加主页的方式与添加常规 `.aspx` 页面相同——在向应用程序添加新文件时，选择“主页”选项，如图\
  \ 16-4 所示。\n\n![image](img/f595-01.jpg)\n\n### FIGURE 16-4\n\n因为它与任何其他 `.aspx` 页面都非常相似，“添加新项”对话框允许你从使用内联代码模型的主页或将代码存放在单独文件中的主页之间进行选择。不将服务器代码放在单独文件中意味着你为你正在创建的页面使用了内联代码模型。此选项会创建一个单一的\
  \ `.master` 页面。选择将代码放在单独文件中的选项则意味着你为你正在创建的页面使用了新的代码后置（code-behind）模型。勾选“将代码放在单独文件中”复选框会创建一个\
  \ `.master` 页面，以及一个关联的 `.master.vb` 或 `.master.cs` 文件。你还可以通过选择“选择主页”选项将主页嵌套在另一个主页中，但这将在本章稍后部分介绍。\n\
  \n使用内联代码模型的示例主页如代码列表 16-1 所示。\n\n这是一个简单的主页。在 Visual Studio 2012 中创建主页的伟大之处在于，你可以在代码视图中处理主页，你也可以切换到设计视图，像创建任何其他\
  \ ASP.NET 页面一样创建你的主页。\n\n从查看主页的代码开始。第一行是指令：\n\n```\n<%@ Master Language=\"C#\" %>\n\
  ```\n\n与其像典型的 `.aspx` 页面那样使用 `Page` 指令，你为主主页使用 `Master` 指令。此主页仅使用一个属性，`Language`。此处\
  \ `Language` 属性的值是 `C#`，但当然，如果你正在构建 Visual Basic 主页，也可以使用 `VB`。\n\n你编写主页的其余部分就像编写任何其他\
  \ `.aspx` 页面一样。你可以使用服务器控件、原始 HTML 和文本、图像、事件或任何你通常为任何 `.aspx` 页面会使用的任何内容。这意味着你的主页也可以有一个\
  \ `Page_Load` 事件或任何你认为合适的其他事件。\n\n在代码列表 16-1 所示的代码中，注意服务器控件的使用——`<asp:ContentPlaceHolder>`\
  \ 控件。该控件定义了模板中内容页面可以放置内容的区域：\n\n```html\n <tr>\n    <td>\n     <asp:ContentPlaceHolder\
  \ ID=\"ContentPlaceHolder1\"\n      runat=\"server\">\n     </asp:ContentPlaceHolder>\n\
  \    </td>\n    <td>\n     <asp:ContentPlaceHolder ID=\"ContentPlaceHolder2\"\n\
  \      runat=\"server\">\n     </asp:ContentPlaceHolder>\n    </td>\n  </tr>\n```\n\
  \n在此主页的用例中，存在两个定义的区域，内容页面可以在其中放置内容。此主页包含页眉和页脚。它还定义了内容页面可以放置内容的区域。下一节将介绍内容页面如何使用此主页。\n\
  \n## 编写内容页面\n\n现在你已经在应用程序中有了一个主页，你可以可以在解决方案管理器中右键点击应用程序并选择“添加新项”来创建内容页面。\n\n要创建一个使用此主页作为模板的页面，在“添加新项”对话框中，从列表中选择“Web\
  \ 表单”（参见 16-5）。然而，与其创建一个典型的 Web 表单，不如勾选“选择主页”。这将让你该 Web 表单关联到某些主页。\n\n![image](img/f597-01.jpg)\n\
  \n### FIGURE 16-5\n\n在你命名内容页面并点击“添加新项”对话框中的“添加”按钮后，会出现“选择主页”对话框，如图 16-6 所示。\n\n\
  ![image](img/f597-02.jpg)\n\n### FIGURE 16-6\n\n此对话框允许你选择构建内容页面所需的主页。你可以从应用程序包含的主页中选择。对于示例，选择你在代码列表\
  \ 16-1 中创建的新主页并点击“确定”。这创建了内容页面。所创建的页面是一个简单的 `.aspx` 页面，文件中仅几行代码，如代码列表 16-2 所示。\n\
  \n此内容页面与你过去编写的典型的 `.aspx` 页面没有太大区别。大区别在于指令中包含了 `MasterPageFile` 属性。使用该属性表明此特定的 `.aspx`\
  \ 页面根据另一个页面构建其控件。主页在应用程序中的位置指定为 `MasterPageFile` 属性的值。\n\n另一个大区别是它既不包含 `<form id=\"\
  form1\" runat=\"server\">` 标签，也不包含通常在任何 `.aspx` 页面中包含的起始或结束 HTML 标签。\n\n这个内容页面可能看起来很简单，但如果你切换到\
  \ Visual Studio 2012 中的设计视图，你就能看到使用内容面的威力。图 16-7 展示了视觉继承的结果。\n\n![image](img/f598-01.jpg)\n\
  \nFIGURE 16-7\n\n\n\n\n\n在此屏幕图中，你可以看到只需在 `Page` 指令中使用 `MasterPageFile` 属性，你就能在视觉上继承\
  \ `Wrox.master` 文件公开的所有内容。从 Visual Studio 中的设计视图中，你还可以看到你正在使用哪一个主页，因为引用的主页名称显示在设计视图页的右上角。如果你尝试点击代表从主页继承的灰色区域，你的光标会变为显示“不允许”的操作，如\
  \ 图 16-8 所示（光标位于标题中的 Page 单词上）。\n\n![image](img/f599-01.jpg)\n\n**图 16-8**\n\n主页中定义的所有公共区域都以灰色显示，而你在主页中使用\
  \ `<asp:ContentPlaceHolder>` 服务器控件指定的内容区域则会清晰地显示出来，并供内容页中的额外内容使用。你可以像处理普通的 `.aspx`\
  \ 页面一样，向这些定义的内容区域添加任何内容。列表 16-3 显示了将此 `.master` 页面用于内容页的示例。\n\n`<asp:Content>` 服务器控件是一个定义的内容区域，映射到主页上特定的\
  \ `<asp:ContentPlaceHolder>` 服务器控件。在示例中，你可以看到 `<asp:Content>` 服务器控件映射到主页中 `ID` 为\
  \ `ContentPlaceHolder1` 的 `<asp:ContentPlaceHolder>` 服务器控件。在内容页中，你不需要担心指定内容的位置，因为这些已经在主页中定义了。因此，你唯一需要的是在提供的内容区域内放置适当的内容，让主页为你完成大部分工作。\n\
  \n就像你处理任何典型的 `.aspx` 页面一样，你可以为你的内容页创建任何事件处理器。在这种情况下，你只使用了一个事件处理器——当最终用户提交表单时的按钮点击事件。包含主页和内容页内容的创建的\
  \ `.aspx` 页面如 图 16-9 所示。\n\n![image](img/f600-01.jpg)\n\n**图 16-9**\n\n### 混合页面类型和语言\n\
  \n有趣的一点是：当你使用主页时，你并没有把自己限制在特定的编码模型（内联或代码后），你也没有把自己限制在特定语言的使用上。你可以在应用程序中混合这些元素，因为它们都能运行良好。\n\
  \n你可以使用之前创建的主页（并知道它是使用内联编码模型创建的），然后使用代码后模型构建你的内容页。列表 16-4 显示了一个使用带有代码后选项的 Web 表单（Web\
  \ Form）创建的内容页。\n\n在使用主页时，不仅可以混合编码模型，还可以混合你用于主页或内容页的编程语言。仅仅因为你用 C# 构建了主页，并不意味着你必须在所有使用该主页的内容页中都使用\
  \ C#。你也可以用 Visual Basic 构建内容页。一个很好的例子是，在 C# 中创建一个使用 `Page_Load` 事件处理器的主页，然后用 Visual\
  \ Basic 创建一个内容页。完成后，运行页面。它运行得非常完美。这意味着，即使你可能在可用的 .NET 语言之一中使用主页，但从主页构建应用程序的编程团队可以使用他们喜欢的任何\
  \ .NET 语言。你必须热爱 .NET Framework 提供的开放性！\n\n### 指定使用哪一个主页\n\n你刚刚观察到，在页面级别指定使用哪个主页是非常简单的。在内容页的\
  \ `Page` 指令中，你只需使用 `MasterPageFile` 属性：\n\n```asp\n<%@ Page Language=\"VB\" MasterPageFile=\"\
  ~/Wrox.master\" %>\n```\n\n除了在页面级别指定要使用的主页外，你还有第二种方法在程序的 `web.config` 文件中指定要使用的主页，如\
  \ 列表 16-5 所示。\n\n在 `web.config` 文件中指定主页会导致你在应用程序中创建的每一个页都继承指定的主页。如果你在 `web.config`\
  \ 文件中声明主页，你可以创建任意数量使用该主页的内容页。一旦以这种方式指定，你就可以这样构造内容页的 `Page` 指令：\n\n```asp\n<%@ Page\
  \ Language=\"C#\" %>\n```\n\n你只需通过在内容页中声明不同的主页，就可以轻松覆盖应用程序范围的主页指定：\n\n```asp\n<%@\
  \ Page Language=\"VB\" MasterPageFile=\"~/MyOtherCompany.master\" %>\n```\n\n通过在\
  \ `web.config` 文件中指定主页，你并不是真的想要所有的 `.aspx` 页面都使用这个主页。如果你创建一个普通的 Web Form 并运行它，ASP.NET\
  \ 会知道该页面不是内容页，并将作为普通的 `.aspx` 页面运行。\n\n### 将主页模板应用于页面子集\n\n如果你只想将主页模板应用于特定的页面子集（例如包含在特定文件夹内的页面），你可以在\
  \ `web.config` 中使用 `<location>` 元素如 列表 16-6 所示。\n\n通过在 `web.config` 文件中添加此 `<location>`\
  \ ，你现在指定了特定文件夹（`AdministrationArea`）将使用不同的主文件。`path` 属性的值可以是文件夹名称，也可以特定的页面——例如 `AdminPage.aspx`。\n\
  \n### 处理页面标题\n\n当你在应用程序中创建内容时，默认情况下所有内容都会使用主页中定义的标题。例如，你一直在使用标题为 `My Company Page`\
  \ 的主页。使用该主页的内容页都会使用该标题。你可以通过在内容页的 `@Page` 指令中使用 `Title` 属性来避免这种情况。你也可以通过编程方式在内容页中处理标题。为了实现这一点，在内容页的代码中使用\
  \ `Master` 对象。`Master` 对象方便地有一个名为 `Title` 的属性。该属性的值就是内容页使用的标题。你可以像 列表 16-7 所示进行编写。\n\
  \n### 来自主页的控件和属性\n\n在使用主页时，实际上可以访问主页公开的控件和属性。主页被内容页引用时，公开一个名为 `Master` 的属性。你使用该属性来获取主页中的控件值或自定义属性。\n\
  \n为了看到此控件的示例，在主页中创建一个 GUID（唯一标识符），然后在使用主页的内容页中检索它。对于此示例，使用在 列表 16-1 中创建的主页，但添加一个\
  \ Label 服务器控件和 `Page_Load` 事件（参见 列表 16-8）。现在主页上有一个 Label 控件，你可以从内容页访问它：\n\n*   使用\
  \ `FindControl()`\n*   使用自定义属性\n\n你有两种方法可以完成此任务。第一种方法是使用主页公开的 `FindControl()` 方法。列表\
  \ 16-9  显示了这种方法。\n\n\n\n\n\n在本示例中，Listing 16-8 中的主页会创建一个 GUID，并将其作为文本值存储在主页自身的 `Label`\
  \ 服务器控件中。该 Label 控件的 `ID` 为 `Label1`。主页仅在首次请求此特定内容页时才会生成此 GUID。从这里开始，你可以用此值填充内容页的其中一个控件。\n\
  \n内容页的有趣之处在于，你将代码放在 `Page_LoadComplete` 事件处理程序中，这样你就可以访问主页上的 GUID 值了。在 ASP.NET 中，此事件会在\
  \ `Page_Load` 事件触发后立即触发。事件的顺序将在本章稍后部分介绍，但内容页中的 `Page_Load` 事件始终在主页中的 `Page_Load`\
  \ 事件之前触发。要访问新创建的 GUID（如果它是在主页的 `Page_Load` 事件中创建的），你必须在 `Page_Load` 事件之后的事件中获取它\
  \ —— 这就是 `Page_LoadComplete` 派上用场的地方。因此，在内容页的 `Page_LoadComplete` 事件中，你填充内容页内部的\
  \ `Label` 服务器控件。注意，内容页中的 Label 控件与主页中的 Label 控件具有相同的 `ID`，但这并没有区别。你可以通过使用 `Master`\
  \ 属性来区分它们。\n\n如之前提到的，还有第二种选择：你不仅可以通过这种方式访问主页中的服务器控件，还可以访问主页可能暴露的任何自定义属性。查看 Listing\
  \ 16-10 所示的主页；它为页面的 `<h1>` 部分使用了一个自定义属性。\n\n在这个主页示例中，主页暴露了你创建的名为 `PageHeadingTitle`\
  \ 的属性。该属性被分配了 `\"My Company\"` 的默认值。然后，你将其放置在主页文件的 HTML 某些 `<h1>` 元素之间，这使得该默认值成为主页模板内页面上使用的标题。尽管主页已经有一个用于标题的值，但任何使用此主页的内容页都可以覆盖\
  \ `<h1>` 标题标题。Listing 16-11 显示了这一过程。\n\n在内容页中，你可以通过使用 `Master` 属性为主页暴露的属性赋值。这操作非常简单。记住，你不仅可以访问主页可能暴露的任何公共属性，还可以检索主页包含的任何方法。\n\
  \n使这一切成为可能的项是 `MasterType` 页面指令。使用 `MasterType` 指令使你能够对主页创建强类型引用，并通过 `Master` 对象访问主页的属性。\n\
  \n早些时候，你已经看到如何使用 `FindControl()` 方法访问主页上的服务器控件。`FindControl()` 方法运行良好，但它是一种后期绑定方法，因此如果控件从标记中删除，该方法调用可能会失败。请使用防御性编码实践，并在从\
  \ `FindControl()` 返回对象时始终检查是否为 `null`。使用刚刚说明的机制（即使用 Listing 16-10 中所示的公共属性），你可以使用另一种方法来暴露主页上的任何服务器控件。你可能会发现这种方法更有效。\n\
  \n采用这种不同的方法，你只需将服务器控件暴露为公共属性，如 Listing 16-12 所示。\n\n在这种情况下，名为 `MasterPageLabel1`\
  \ 的公共属性提供了对使用 `ID=Label1` 的 Label 控件的访问。你现在可以在内容页上创建 `MasterPageLabel1` 属性的实例，并覆盖\
  \ Label 服务器控件的任何属性。如果你想增大主页在 `Label1` 服务器控件中创建并显示的 GUID 大小，只需覆盖 Label 控件的 `Font.Size`\
  \ 属性即可，如 Listing 16-13 所示。\n\n这种方法可能是访问主页暴露给内容页的任何服务器控件有效的方法。\n\n## 在主页中指定默认内容\n\
  \n正如所示，主页允许你指定内容页可以使用的内容区域。主页可以只包含一个内容区域，也可以包含多个。内容区域的优点在于，当你创建主页时，可以为内容区域指定默认内容。如果你选择不覆盖它，可以保留这些默认内容供内容页使用。Listing\
  \ 16-14 显示了一个在内容区域内指定了一些默认内容的主页。\n\n要在主页的一个内容区域内放置默认内容，你只需将其放在主页自身的 `ContentPlaceHolder`\
  \ 服务器控件中。任何继承此主页的内容页也会继承这些默认内容。Listing 16-15 显示了一个仅覆盖了此主页一个内容区域的内容页。\n\n此代码创建一个有一个内容区域的页面，它显示来自主页本身的内容，以及来自内容页的其他内容（参见\
  \ Figure 16-10）。\n\n```\n(Code representation not provided in original text)\n```\n\
  **FIGURE 16-10**\n\n在 Visual Studio 2012 的设计视图处理内容区域时，另一个有趣点是智能标记（smart tag）允许你轻松处理默认内容。\n\
  \n当你开始处理内容页时，你会发现所有默认内容最初填充在所有的 Content 控件中。你可以点击控件的智能标记并在提供的菜单中选择 `Create Custom\
  \ Content`（创建自定义内容）来更改内容。此选项允许你覆盖主页内容并插入你自己的内容。在内容区域内放置了一些自定义内容后，智能标记会显示另一个选项 ——\
  \ `Default to Master’s Content`（恢复主页内容）。此选项允许你恢复主页暴露给内容区域的默认内容，并擦除你在内容区域放置的任何内容\
  \ —— 从而返回默认内容。如果你选择此选项，将收到删除放置在 Content 服务器控件内的任何自定义内容的警告（参见 Figure 16-11）。\n\n\
  **FIGURE 16-11**\n\n在更改一个 Content 控件的默认内容后，所见即所得的视图也发生了变化，如 Figure 16-12 所示。\n\n\
  **FIGURE 16-12**\n\n## 程序化分配主页\n\n从任何内容页开始，你都可以程序化地分配主页。你使用 `Page.MasterPageFile`\
  \ 属性将主页分配给内容页。无论 `@Page` 指令中是否分配了另一个主页，你都可以使用此属性。\n\n\n\n\n\n要通过 `Page.MasterPageFile`\
  \ 属性分配主页，你需要使用 `PreInit` 事件。`PreInit` 事件是你可以访问页面生命周期的最早点由于由于原因，你需要在此事件中分配任何内容页使用的主页。在处理主页时，`PreInit`\
  \ 是一个需要注意的重要事件，因为它是你可以在主页和内容页合并成单个实例之前，同时影响两者的唯一点。Listing 16-16 显示了如何从内容页通过程序化方式分配主页。\n\
  \n在这种情况下，当页面正在被动态生成时，主页会在页面构建过程的开始阶段分配给内容页。请注意，内容页必须在主页中定义 `Content` 控件；否则将抛出错误。\n\
  \n## 主页的嵌套\n\n到目前为止，你一直在创建一个内容页可以使用的单个主页。然而，大多数公司和组织不仅仅是两个层级。组织内部存在许多部门和小组，它们可能希望通过实际上在主页中嵌套另一个主页的方式，来使用主页的变体。在\
  \ ASP.NET 中，这种类型的页面是完全可能的。\n\n例如，想象路透社（Reuters）正在创建一个在整个公司内网使用的主页。路透企业不仅希望在全范围内实施此主页，路透内部的各个部门还希望直接为其直接控制的内网子部分提供模板。例如，路透欧洲和路透美国都希望拥有自己独特的主页，如图\
  \ 16-13 所示。\n\n![image](img/f612-01.jpg)\n\n**图 16-13**\n\n为了获得这些独特的页面，路透欧洲主页和路透美国主页的创建者只需创建一个继承自全局主页的主页，如\
  \ Listing 16-17 所示。你可以在这个名为 `ReutersMain.master` 的文件，它是本书的第 16 章代码下载的一部分。\n\n这个主页非常简单，但非常地向你展示了这种嵌套能力是如何工作的。主主页是公司范围内使用的主页。它包含一个\
  \ `ID` 为 `ContentPlaceHolder1` 的 `ContentPlaceHolder` 服务器控件。\n\n你按照构建任何其他主页相同的方式创建一个子主页或嵌套主页。从“添加新项”对话框中，选择“主页”选项，并确保你选了“选择主页”选项，如图\
  \ 16-14 所示。再次出现“选择主页”对话框，你可以在其中进行主页选择。\n\n![image](img/f613-01.jpg)\n\n**图 16-14**\n\
  \nListing 16-18 显示了你如何从子主页文件与此主主页交互。你可以在这个名为 `ReutersEurope.master` 的文件，它是本书的第 16\
  \ 章代码下载的一部分。\n\n查看此页面，你可以发现它与使用主页的典型 `.aspx` 页面没有太大区别。`MasterPageFile` 属性用法相同，但它没有使用\
  \ `@Page` 指令，而是使用了 `@Master` 页面指令。然后 `Content2` 控件也使用了内容控件的 `ContentPlaceHolderId`\
  \ 属性。该属性将此内容区域与主主页中定义的内容区域 `ContentPlaceHolder1` 绑定。\n\nASP.NET 的功能之一是在 Visual Studio\
  \ 2012 的设计视图中直接查看嵌套主页。图 16-15 显示了 Visual Studio 2012 设计视图中的一个嵌套主页。\n\n![image](img/f614-01.jpg)\n\
  \n**图 16-15**\n\n在 Listing 16-18 所示的子主页页中，你现在也可以使用任意数量的 `ContentPlaceHolder` 服务器控件。任何使用此主页的内容页都可以使用这些控件。Listing\
  \ 16-19 显示了一个使用子主页 `ReutersEurope.master` 的内容页。\n\n如你所见，在这个内容页中，`@Page` 指令中 `MasterPageFile`\
  \ 属性的值是你创建的子主页。继承 ReutersEurope 主页实际上将两个主页（`ReutersMain.master` 和 `ReutersEurope.master`）合并成单个主页。此内容页中的\
  \ Content 控件也指向子主页中定义的内容区域。你可以在代码中通过 `ContentPlaceHolderId` 属性看到这一点。最后，你得到了一个非常不注重艺术的页面，如图\
  \ 16-16 所示。\n\n![image](img/f615-01.jpg)\n\n**图 16-16**\n\n## 特定容器主页\n\n在许多情况下，开发者正在构建将在多种容器中查看的应用程序。某些用户会在\
  \ Explorer 中查看，某些可能在平板手机上查看。由于由于原因，ASP.NET 允许你使用多个主页。根据用户使用的容器，ASP.NET 会调取相应的文件。因此，你希望构建特定容器主页以为最终用户提供最佳体验。Listing\
  \ 16-20 展示了使用多个主页的能力。\n\n如你所见，在这个示例内容页中，它可以与三个不同的主页工作。第一个使用属性 `MasterPageFile`。这意味着如果请求者不是\
  \ Firefox、Chrome、Safari 或 Opera 浏览器，将使用默认主页 `Wrox.master`。然而，如果请求者是 Chrome 浏览器，则使用\
  \ `WroxChrome.master`，如图 16-17 所示。\n\n![image](img/f616-01.jpg)\n\n**图 16-17**\n\
  \n你可以在托管应用程序的服务器上找到可用浏览器列表，路径为 `C:\\Windows\\Microsoft.NET\\Framework\\v4.0.xxxxx\\\
  CONFIG\\Browsers`。可用选项包括：\n\n*   Blackberry\n*   Chrome\n*   Default\n*   Firefox\n\
  *   Gateway\n*   Generic\n*   IE\n*   IEMobile\n*   iPhone\n*   Opera\n*   Safari\n\
  *   UCBrowser\n\n当然，你也可以添加任何认为必要的额外 `.browser` 文件。\n\n## 事件顺序\n\n当你处理主页和内容页时，两者都可以使用相同的事件（例如\
  \ `Load` 事件）。请记住哪些事件在其他事件之前。这是处理主页时最重要的方面之一，因为这与普通页的事件顺序不同。\n\n你正在将两个类结合起来创建一个页面类，并且有一个特定的顺序。当用户在浏览器中请求内容页时，事件顺序如下：\n\
  \n1.  **主页子控件初始化**：首先初始化主页内的所有服务器控件。\n2.  **内容页子控件初始化**：初始化内容页的所有服务器控件。\n3.  **主页初始化**：主页本身被初始化。\n\
  4.  **内容页初始化**：内容页被初始化。\n\n\n\n\n\n5. **内容页的加载：** 加载内容页（这是 `Page_Load` 事件，随后是 `Page_LoadComplete`\
  \ 事件）。\n\n6. **主页的加载：** 加载主页（这也是 `Page_Load` 事件，紧接着是 `Page_LoadComplete` 事件）。\n\n\
  7. **主页子控件的加载：** 主页上的服务器控件被加载到页面上。\n\n8. **内容页子控件的加载：** 内容页上的服务器控件被加载到页面上。\n\n在构建应用程序时，请注意此事件的顺序。如果你想在特定的内容页中使用包含主页的服务器控件值，例如，你无法在内容页的\
  \ `Page_Load` 事件内部获取这些服务器控件的值。这是因为该事件是在主页的 `Page_Load` 事件之前触发的。这个问题促成了 .NET Framework\
  \ 中 `Page_LoadComplete` 事件的创建。内容页的 `Page_LoadComplete` 事件紧随主页的 `Page_Load` 事件之后。因此，你可以利用这种顺序来访问主页的值，即使在触发内容页的\
  \ `Page_Load` 事件时主页尚未填充数据。\n\n## 使用主页进行缓存\n\n在处理典型的 `.aspx` 页面时，可以使用以下结构（或其变体）对页面应用输出缓存：\n\
  \n```xml\n<%@ OutputCache Duration=\"10\" Varybyparam=\"None\" %>\n```\n\n此行代码将页面在服务器内存中缓存\
  \ 10 秒。许多开发者使用输出缓存来提高 ASP.NET 页面的性能。对于数据不会过快过期的页面，使用输出缓存也很有意义。\n\n在处理主页时，如何对 ASP.NET\
  \ 页面应用输出缓存？你不能仅对主页应用缓存。你不能在主页本身上放置 `OutputCache` 指令。如果你这样做，在页面的第二次检索时，将得到一个错误，因为应用程序找不到缓存的页面。\n\
  \n在使用主页使用输出缓存时，请将 `OutputCache` 指令放置在内容页中。这样做会同时缓存内容页的内容和主页的内容（请记住，在此时它只是一个单一页面）。在主页中放置\
  \ `OutputCache` 指令不会导致主页产生错误，但它不会被缓存。该指令仅在内容页中生效。\n\nASP.NET 4+ 在处理任何缓存功能方面的另一个新而有趣的特性是，ASP.NET\
  \ 现在允许你在控件级别控制视图状态（View State）。虽然你可能立即想到可以通过如 `GridView` 或通常具有大量视图状态的控件以这种方式控制视图状态，但你也可以对\
  \ `ContentPlaceHolder` 控件使用此新功能。\n\n例如，你可以构建如下内容：\n\n```xml\n <asp:ContentPlaceHolder\
  \ ID=\"ContentPlaceHolder1\" runat=\"server\"\n   ViewStateMode=\"Disabled\">\n\
  \  </asp:ContentPlaceHolder>\n```\n\n在这种情况下，即使页面的其他部分使用了视图状态，`ContentPlaceHolder1`也不会使用。`ViewStateMode`\
  \ 属性的可用选项包括 `Disabled、Enabled` 和 `Inherit`。`Disabled` 关闭控件的视图状态，`Enabled` 开启，而 `Inherit`\
  \ 取 `@Page` 指令中分配的值。移除视图状态可以提高页面的性能。\n\n## ASP.NET AJAX 与主页\n\n如今的许多大型 ASP.NET 应用程序都使用了主页以及该技术在构建模板网站方面提供的功能。ASP.NET\
  \ 在默认安装包中包含了 ASP.NET AJAX，你会发现主页和 Ajax 配合得非常好。\n\n每个要使用 Ajax 能力的页面都必须在页面上有 `ScriptManager`\
  \ 控件。如果你要使用 Ajax 的页面是使用主页的内容页，你必须将 `ScriptManager` 控件放置在主页本身。\n\n设置主页以启用 Ajax 并不困难。要实现这一点，只需在主页本身上添加\
  \ `ScriptManager` 服务器控件即可。列表 16-21 显示了此项操作的示例。\n\n如 列表 16-21 所示，这种 Ajax 主页与标准主页之间的唯一区别在于包含了\
  \ `ScriptManager` 服务器控件。如果你的主页包含任何 Ajax 能力，即使内容页完全没有使用 Ajax，你也应该使用这种技术。\n\n如果你要在\
  \ Web 应用程序的所有页面上放置通用的 JavaScript 项目，主页上的 `ScriptManager` 控件也是有的。例如，列表 16-22 显示了如何通过主页轻松地在每个页面中包含\
  \ JavaScript。\n\n在此示例中，`myScript.js` 文件被包含在每个使用此 Ajax 主页的内容页中。如果你的内容页也需要使用 Ajax\
  \ 能力，你不能简单地向页面中添加另一个 `ScriptManager` 控件。相反，内容页需要使用主页上已有的 `ScriptManager` 控件。\n\n\
  尽管如此，如果内容页需要向 `ScriptManager` 控件添加额外项目，它可以使用 `ScriptManagerProxy` 控件访问主页上的该控件。使用\
  \ `ScriptManagerProxy` 控件允许你为内容页向 `ScriptManager` 添加特定的项。\n\n例如，列表 16-23 显示了内容页如何通过主页添加脚本。\n\
  \n## 总结\n\n当你创建一个在应用程序几乎每个页面都使用通用页眉、页脚或导航部分时，主页是一个很好的解决方案。主页易于实现，并允许通过更改单个文件来更改应用程序的所有页面。想象这种方法让管理包含大量页面的应用程序变得更容易。\n\
  \n本章介绍了 ASP.NET 中的主页，并解释了如何在 Web 应用程序中构建和使用主页。除了基础知识，本章还涵盖了主页事件顺序、缓存以及针对特定容器的主页。最后，当你处理模板化应用程序时，绝对应该考虑主页。\n\
