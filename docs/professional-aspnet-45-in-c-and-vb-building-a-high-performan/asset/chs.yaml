  加入后，你可以发布新消息并回复其他用户的帖子。你可以随时在网页上阅读消息。如果你希望将特定论坛的新消息通过电子邮件发送给你，请点击论坛列表中论坛名称旁的 `Subscribe\
  \ to this Forum` 图标。\n\n有关论坛软件如何工作的更多信息，以及针对 P2P 和 Wrox 书的常见问题的解答，请务必阅读 P2P FAQs。只需点击任何\
  \ P2P 页面上的 `FAQ` 链接即可。\n\n\n\n\n\n既然底层菜单都是相同的，为什么要让开发者在六六种不同的口味之间进行选择呢？`ASP.NET`\
  \ 提供了无论你的应用程序架构如何所需的核心服务。密钥管理、会话管理、缓存、HTTP、授权和身份验证都是所有通用的 Web 开发真理。你选择如何渲染尖括号或大括号取决于你的偏好，但你应该能够放心地使用任何帮助你解决业务问题的\
  \ `ASP.NET` 框架或框架。你不仅应该毫无压力地这样做，而且是以完全受支持和鼓励的方式来实现。图 1-1 展示了 `ASP.NET` 中不同框架的分类，以及它们如何共同使用通用的底层\
  \ `ASP.NET core`。\n\n![image](img/f004-01.jpg)\n\n**图 1-1**\n\n## One ASP\n`One\
  \ ASP.NET` 的核心在于让开发者更容易使用 `ASP.NET` 和 `Visual Studio` 构建应用程序。`One ASP.NET` 是一个通用术语，可以代表许多含义。让我们来拆解一下。\n\
  \n在当今世界，当你考虑构建 Web 应用程序时，有很多选择和方案。每种都有其优缺点。当你着构建应用程序时，你如何知道选择哪一个框架呢？\n\n如果你选择了一个后发现它并不是一个好的选择，你能多容易地返回并尝试另一条路线？你的框架是否足够模块化以便你更换有问题的部分，还是你必须重写所有内容？你能够在子系统之间共享代码吗？\n\
  \n你的框架应该多久更新一次？互联网的移动速度远快于大多数框架能处理的速度。`ASP.NET` 如何兼顾两个主？你现在想要 `HTML5` 和 `CSS3`，但你不能破坏业务所赖的应用程序。\n\
  \n`One ASP.NET` 应该给开发者这种信心：无论他们选择什么，他们仍然在一个受信任的底层框架——`ASP.NET` 上进行开发。为了帮助你理解 `One\
  \ ASP.NET`，下一节将探讨我们是如何走到这一步的\n\n### ASP.NET 的演变\n微软的 Web 开发始于 20 世纪 90 年代的 `Classic\
  \ ASP`（活动服务器页）。开发者能够基于 VB 脚本语言编写动态页面。\n\n`ASP.NET` 1.0 于 2002 年引入，构建在 `.NET Framework`\
  \ 之上。`ASP.NET Web Forms` 通过允许开发者构建由控件组成的页面（类似于 Windows 用户界面），简化了他们从 Windows 应用程序开发到\
  \ Web 开发的过渡。这与我们见过的任何东西都不同！习惯于向 `Windows Forms` 拖放数据网格的 `Visual Basic` 开发者可以将数据网格拖放到\
  \ `Web Forms` 上！这简直是魔法。\n\n这之所以是魔法，是因为它在无状态的 `HTTP` 之上叠加了状态。它允许开发者对 `Button.Click`\
  \ 等业务级事件做出，而不是 `HTTP POST` 等底层事件，让整整一代开发者能够创建出色的 Web 应用程序。\n\n`ASP.NET` 2.0 于 2005\
  \ 年随 `Visual Studio 2005` 一起发布。这一版本进一步推进了“控件比喻”，引入了如 `SqlDataSource` 和 `ObjectDataSource`\
  \ 等以数据为核心的增强。`ASP.NET` 3.5 则于 2008 年推出，并带来了 `DynamicData`，它允许你在几分钟内快速生成数据驱动的应用程序。\n\
  \n不久后，`ASP.NET MVC` 发布，首次将流行的“模型-视图-控制器”模式引入到 `ASP.NET` Web 开发中。尽管仍然基于 `ASP.NET`，但\
  \ `ASP.NET MVC` 提供了 `.NET` 平台上以前未过的可测试性和组合性。`ASP.NET MVC` 的开发是为了满足开发者社区日益增长，他们希望轻松地对应用程序进行单元测试，并对\
  \ `HTML` 标记的生成有更细粒度的控制。`ASP.NET MVC` 代表了一种绝对的控制力和力量，它为 `.NET Framework` 带来了一类新开发者，可能也让一些处于边缘的老开发者能够留留在\
  \ `ASP.NET` 中。\n\n关于 MVC 有几点很有意思。`ASP.NET MVC` 是 `ASP.NET` 框架最早的发布之一，其中框架的一部分是以“带外”（OOB）的形式独立发布的。这意味着\
  \ `ASP.NET MVC` 是作为一个独立的安装程序发布的，开发者可以选择性地下载并添加到现有的 `Visual Studio` 安装中。这是迈出的一大步，让开发者能够快速获取新产品，而无需等待\
  \ 2 到 3 年。`ASP.NET` 团队并没有意识到这一点，但 `ASP.NET MVC` 作为一种带外发布，可以说标志着 `ASP.NET` 团队脱离 `Visual\
  \ Studio` “大火车”的开始。\n\n在接下来的 2 年里，又发布了两个版本的 `ASP.MVC`。更重要的是，`ASP.NET MVC` 在 `Microsoft\
  \ Public License (MS-PL)` 下发布，这允许开发者查看他们喜爱的框架的源代码。传言开始出现，也许 `ASP.NET MVC` 可能会作为真正的开源发布，但微软永远不会那样的，对吧？\n\
  \n`ASP.NET` 4 随 `VS2010` 发布。与此同时，`ASP.NET MVC 4` 发布，`ASP.NET Web Pages` 被引入，并带来了一种用于动态页面创建的极新语法\
  \ `Razor`。`ASP.NET Web Pages` 和新的 `Razor` 语法提供了一种快速、易上手且轻量的方法，将服务器代码与 `HTML` 结合以创建动态\
  \ Web 内容。`Razor` 成为 `ASP.NET MVC` 后台的新视图引擎。`ASP.NET Web Pages` 将 `Razor` 引入了一种适用于较小站点或初学者的简单新编程模型。\n\
  \n`ASP.NET` 4.5 于 2012 年随 `VS2012` 发布。这次发布包含了 `ASP.NET MVC 4.5` 以及 `ASP.NET` 家族的新成员\
  \ `ASP.NET Web API`，它使得编写基于 REST 的 Web 服务变得更容易。\n\n不久后，微软在开源许可（`Apache License 2.0`）下发布了大部分\
  \ Web Stack（包括 `ASP.NET MVC`、`Razor` 和 `ASP.NET Web API`）。但它宣布将接受社区的贡献——在一个具有战略意义的旗舰\
  \ Web 框架上实现真正的开源。大轮已经开始转弯了。\n\n这就是“开放开发”的开始。感兴趣的社区成员实际上可以在开发者在微软内部工作时阅读代码提交。更好的是，贡献者可以修复漏洞、添加功能并提交拉取请求，并且他们的代码可能会被数百万开发者使用。\n\
  \n开放开发起初是令人恐惧的，但这样做使得更开放的开发模式成为可能，每个人都参与其中，并对代码提交、错误修复、新功能开发提供反馈，并每天使用最新版本的源代码和测试来构建和测试产品。这是\
  \ `ASP.NET` 生态系统汇聚的一大步，让开发者能够朝着构建更好框架的目标共同努力。\n\n在故事的这一点，我们已经将 `ASP.NET` 的大部分及其运行时组件以开源的形式带外发布。许多功能是可选的或可以轻松添加的，例如\
  \ `Web Optimization`、`Universal Membership Providers` 和测试框架。工具链应该如何开放，以支持一个同时更统一又模块化的\
  \ `ASP.NET` 呢？\n\n### Web 的演进以及我们之演进\n`HTML5` 还没有结束，除非本章是在 2017 年出版的，否则在写作时它仍然没有完成。然而，`HTML5`\
  \ get 它的兄弟 `CSS3` 和 `JavaScript` 已经赢得了互联网。现在，每个现代浏览器上都有了可靠且完整的 `JavaScript` 版本，结合凝聚的文档对象模型（`DOM`），应用程序的架构发生了巨大的变化。\n\
  \n`JavaScript` 已经超越了简单的 `alert()` 语句和输入类型验证，毕业成为浏览器中近乎完整的虚拟机。`HTML5` 作为规范非常简单，而\
  \ `CSS3` 让它大放异彩。将所有这些成分与口袋超级计算机相结合，你就拥有了一场移动 Web 革命。\n\n\n\n\n今天，客户正在使用不同的设备形态，从智能手机、平板电脑到个人电脑不等。这意味着他们可以使用手机或平板电脑、移动端浏览器或传统的桌面浏览器来访问\
  \ Web 应用程序。网页也变得越来越社交化。用户通过 `Twitter`、`Facebook` 等社交手段进行相互互动，并希望在与之交互的所有 Web 应用程序中携带他们的社交身份。这意味着他们希望使用社交凭据进行登录，以便在登录应用程序时也能与他们的朋友进行互动。对于\
  \ Web 开发者来说，这是一个连接了设备和服务的世界。\n\n随着 Web 变得无处不在，且 Web 标准不断演进，`ASP.NET` 框架以与 Web 开发进展相匹配的频率更新至关重要。\n\
  \n## 简化复杂的生态系统\n\n点击 ![image](img/Ar.jpg) `New Project` 太太令人害怕了。它迫使人们进行一种人为的选择，让开发者感觉自己选择了一条可能无法逆转的十字路口。也许，与其面对一个强制进行非自然选择的路口，我们不如考虑一个统一的\
  \ `ASP.NET` 界面，并允许选择可能的子系统、库或备用的应用程序框架。\n\n现在你做出了选择。那么你现在如何发现并集成库以便在你的应用程序中轻松编写服务呢？如果你采取稳妥的选择选择\
  \ `Empty Web Application` 会怎样？会让添加服务变得更容易吗？如果你选择 `ASP.NET Web Application`，又如何向此应用程序添加\
  \ `DynamicData` 功能呢？\n\n社交方面呢？你可以引入一个社交支持库，但你能轻松地将其集成到 `MVC` 和 `Web Forms` 中吗？从开发者的角度来看，这是一个相当复杂的故事，让你悬而未决，不仅要思考最佳的入门方式，还要思考如何扩展你的应用程序。`图\
  \ 1-2` 显示了你在创建新项目时可以的选择。\n\n![image](img/f006-01.jpg)\n\n**图 1-2**\n\n### Web 生态系统\n\
  \nWeb 开发是一个令人兴奋且复杂的领域。许多变量都会影响 Web 开发者的生产力。作为一名 Web 开发者，你必须不断掌握 Web 标准领域的最新、进展。一旦知道了最新标准是什么，你就必须担心你正在使用的框架和工具是否支持这些标准。一旦知道了这些，你获取想要在应用程序中使用的\
  \ `FX`、工具和库会有多容易呢？\n\n开发者体验的很大一部分是不断增长的生态系统。随着 Web 的扩展和增长，你可以发现大量帮助你开发应用程序的库。这些库根据它们所解决的问题，可以在开发者社区中变得流行并被广泛接受。例如，像\
  \ `jQuery` 这样通用的库非常受欢迎，而 `jQuery` 是许多使用 `JavaScript` 的开发者的首选库。此外，许多专门的库正在解决可能并不适用于大多数者的独特问题。\n\
  \n我们正处于这样一个节点，有许多此类库可可用，例如 `Entity Framework`、`JSON.NET`、`ELMAH` 等，它们都是开源的并可以在你的应用程序中使用。现在，你的应用程序很大一部分由这些开源库和来自\
  \ `Microsoft` 的库混合组成。因此，问题在于，在 Web 中，符合你的标准。`图 1-2` 显示了你在创建新项目时可以的选择。\n\n...............................-.-......the1-2.\n\
  \n![image](img/f006-01.jpg)\n\n**图 1-2**\n\n\n\n想象一下你必须在应用程序中安装 `ELMAH`。如果没有 `NuGet`，你将不得不下载一个安装程序，然后从安装位置手动添加\
  \ `ELMAH` 库的引用。除此，你还必须阅读 `ELMAH` 网站上的文档，以对 `web.config` 进行所有必要的更改来配置 `ELMAH`。如果在开发过程中发布了新版本的\
  \ `ELMAH`，你将无法得知项目项目正在使用的版本已经过时，也无法你需要下载新版本。\n\n`NuGet` 让查找、安装、配置和更新库的整个过程变得非常简单。它是一个解决所有这些问题的一站解决方案。\n\
  \n图 1-6 显示了在 SPA 应用中安装的包。想象你已经开发了这个项目了一段时间，想要检查你正在使用的任何库是否有更新。要做到这一点，你只需启动 `Manage\
  \ NuGet Packages` 窗口并点击 `Updates` 选项卡即可。图 1-7 显示了这些包可用的更新。\n\n![image](img/f010-01.jpg)\n\
  \n**图 1-7**\n\n点击你想要更新的包上的 `Update`，`NuGet` 将下载该包的新版本并同时更新引用。你可以轻松地快速更新任何包。\n\n\
  ### 现实案例\n\n本节展示了你如何在实际现实应用中应用 One ASP.NET。以下方法绝不代表任何最佳实践，但它的目的是演示 One ASP.NET 和\
  \ Web 生态系统如何结合来帮助你构建 ASP.NET 应用程序。假设你想创建一个具有以下要求的简单单页待办事项 Web 应用程序：\n\n*   用户应该能够使用\
  \ Facebook、Twitter 登录，或在网站上注册账户。\n*   用户应该能够创建待办事项并在完成后标记项目项目。\n*   管理员应该能够通过管理部分管理用户账户。\n\
  \n你可以通过选择 `ASP.NET SPA` 模板并配置该模板以使用 Facebook、Twitter 和本地登录来开始。一旦准备好了此模板，你就可以开始构建你的应用程序了。\n\
  \n首先，实现一个 `ASP.NET Web API`，这样你就可以有一个基于 REST 的服务来管理待办事项。你可以通过右键点击项目并添加新项模板——`ASP.NET\
  \ Web API Controller Class` 来添加 Web API（参见图 1-8）。\n\n![image](img/f011-01.jpg)\n\
  \n**图 1-8**\n\n当你安装此项模板时，它会安装在 `ASP.NET` 中运行 Web API 需要的所有 `NuGet` 包。\n\n编写一些代码来实现你应用程序的待办功能，包括添加、删除、修改和获取所有待办事项等功能。图\
  \ 1-9 显示了检索待办事项列表的代码片段。\n\n![image](img/f012-01.jpg)\n\n**图 1-9**\n\n在编写此待办 Web\
  \ API 时，你可能希望在不运行整个应用程序的情况下测试其功能，因为可能会变得非常繁琐。你可以使用 `NuGet` 搜索一些测试客户端来测试你的待办 Web\
  \ API。快速搜索可能会返回一个包列表，你可以根据评分选择其中一个。例如，你可以下载 `WebApiTestClient` `NuGet` 包，它在编写本章时是非常流行的。图\
  \ 1-10 显示了当你使用该测试客户端测试 Web API 的结果。\n\n![image](img/f012-02.jpg)\n\n**图 1-10**\n\
  \n现在你的 Web API 已经可以工作，你可以开始添加 SPA 库以便编写应用程序的前端。同样，你可以在 `NuGet` 上搜索你喜欢的 SPA 库。对于此示例，选择\
  \ `Knockout`。一旦安装了 `NuGet` 包，它就会引入使用 `Knockout` 需要的所有库。\n\n安装 `Knockout` 后，你可以创建网页，在其中调用你的待办\
  \ Web API 并在 `Knockout` 视图绑定结果。Visual Studio 编辑器对 `Knockout` 语法高亮和 `IntelliSense`\
  \ 提供了丰富的支持，这使得 `Knockout` 变得更容易使用。图 1-11 显示了 Visual Studio 中对 `Knockout` 的语法高亮支持。\n\
  \n![image](img/f013-01.jpg)\n\n**图 1-11**\n\n一旦你通过 `Knockout` 实现了客户端数据绑定，你将拥有一个功能完整的\
  \ SPA 。如果你想接收有关待办事项的更新，可以通过安装 `ASP.NET SignalR` 获取实时更新功能。你可以通过下载 `Microsoft.AspNet.SignalR`\
  \ `NuGet` 包来实现这一点。一旦安装了此包，你就可以修改应用程序代码以添加实时功能。图 1-12 显示了你开发的待办事项应用程序。\n\n![image](img/f013-02.jpg)\n\
  \n**图 1-12**\n\n创建应用程序的最后部分是为管理员构建一些账户管理。你可以使用 `ASP.NET Web Forms` 和 `Dynamic Data`\
  \ 快速构建，这是一个快速构建数据驱动应用程序的良好框架。你还可以使用基于角色的 `ASP.NET` 授权来保护此部分，使只有管理员可以访问网站的此部分。最后，如果你观察这个应用程序，它是\
  \ `ASP.NET` 框架技术（如 `ASP.NET Web Forms`、`MVC`、`Web API` 和 `SignalR`）与 `Knockout`、`jQuery`、`JSON.NET`\
  \ 等许多开源库协同工作的混合。\n\n## 你如何获益？\n\n现在你已经读完了所有内容，你一定在想这些都太棒了，但作为开发者，你有什么好处？你从 One ASP.NET\
  \ 中获得了什么好处？本节查看了 One ASP.NET 帮助提高开发者效率的一些场景。它还查看了今天开发者面临的常见问题，以及 `ASP.NET` 和 Visual\
  \ Studio 如何帮助解决这些问题。\n\n\n\n\n除了贡献之外，你还可以浏览源代码、订阅签到通知，并浏览这些产品的开发者正在处理的活跃问题（issues）列表。通过所有这些操作，你作为开发者对这些产品中正在设计和开发的功能有了更直接的影响，最终将开发出更好的产品。\n\
  \n### ASP.NET 让在网站中查找、添加和更新“乐高积木”变得简单\n\n尽管不断成大的生态系统是 Web 开发者社区的一个良好信号，但现在面临着发现和安装该生态系统中所有这些优秀库的问题。此类库的安装体验一直集中在下载安装程序并按步骤运行安装程序上。这使得在项目中添加、配置和更新库的过程变得非常困难。相比之下，`NuGet`\
  \ 是该领域的一大飞跃。库/框架可以以 `NuGet` 包的形式重新分发，并通过 `Visual Studio` 轻松地安装到你的项目中。\n\n### ASP.NET\
  \ 帮助你将一个框架的理念应用到另一个框架\n\n`ASP.NET` 伞下的体系包含许多在一个框架中开发的不同功能，例如 `ASP.NET MVC`，这些功能现在已经进入了其他框架，如\
  \ `ASP.NET Web Forms`，反之亦然。例如：\n\n* 有一个名为 `Data Annotation Attributes` 的功能，它最初在\
  \ `ASP.NET Dynamic Data` 中引入，随后被引入 `ASP.NET MVC` 中。\n* `Routing` 和模型绑定（model binding）是\
  \ `ASP.NET MVC` 的亮点之一，最终进入了 `ASP.NET Web Forms`。\n* `ASP.NET Web Pages` 有一个名为 `Smarty\
  \ Routes` 的简单路由模型，它可以让你在无需任何配置的情况下生成更整洁的 URL。此功能进入了 `ASP.NET Web Forms`，现在被称为 `ASP.NET\
  \ FriendlyURLs`。\n\n这意味着，如果你是一个 `ASP.NET` 开发者，你可以使用这些著名的概念或功能，并将它们应用到你选择的任何框架。如果你喜欢模型绑定并且是一个\
  \ Web Forms 开发者，现在你可以继续构建 Web Forms 应用，同时使用像模型绑定这样新且广为人的功能。你不需要切换到另一个框架（如 `ASP.NET\
  \ MVC`），仅仅因为 `ASP.NET MVC` 支持模型绑定这一个简单理由。\n\n### ASP.NET 的发展速度与 Web 一样快\n\nWeb 正在以疯狂的速度演进。这是由许多因素造成的。设备和服务的扩散导致了新类型的应用程序出现，这些应用需要更紧密的互联。Web\
  \ 变得更加社交化，用户希望相互进行实时协作。为了支持所有这些变化，Web 标准联盟（Web Standards Consortium）被要求确保 `HTML`、`JavaScript`\
  \ 和 `CSS` 的规范能够快速更新以支持这些需求。考虑到所有这些变化，开发者也被要求跟上所有动态，并要求他们使用的框架和工具更新到这些最新标准。\n\n`ASP.NET`\
  \ 和 `Visual Studio` 也在应对这些变化。当 `ASP.NET 2.0` 发布时，它是伴随 `VS2005` 发布的，而后者是在 `ASP.NET\
  \ 1.0` 发布 3 年后发布的。这意味着开发者必须等待 3 年才能获得支持最新 Web 标准的框架。我们现在正在进入一个新的世界，`ASP.NET` 的部分可以更频繁地发布并轻松更新，而无需等待\
  \ `Visual Studio` 的下一次发布。\n\n`ASP.NET MVC`、`Web Pages`、`Web API` 和 `SignalR` 以 `NuGet`\
  \ 包的形式发布在 `NuGet` 库上，这样你可以通过更新项目中所安装的 `NuGet` 包来更新这些框架。`Microsoft ASP.NET`、`Web\
  \ Frameworks 2012.2` 以及 `Microsoft Web Developer Tools 2012.2` 增加了对许多改进的支持，以便在 `VS`\
  \ 中编写 Web 应用并将其发布到 `Azure`。`Visual Studio 2012` 自带了 1.0 版本的 `Microsoft Web Developer\
  \ Tools`，但当本书出版时，已经是 1.2 版本了。这意味着作为开发者，在短短几个月内就能获得最新的工具，以提高你构建 Web 应用的生产力。`ASP.NET`\
  \ 团队正转向更频繁的发布周期，以便交付更新的工具和库，使 Web 开发对于新兴标准和库更具相关性。\n\n## 总结\n\n`ASP.NET` 应该是一个可靠、有趣、模块化、强大且可扩展的平台，用于构建\
  \ Web 应用。无论你是在 `Web Forms` 中使用第三方控件生成器的报告控件，还是编写你自己的自定义 `HTML Helper`，`ASP.NET`\
  \ 都可以成为你应该信赖的底层底层平台。\n\n也许你的解决方案是使用 `TDD` 和 `Agile` 结合 `SpecFlow` 开发并针对 `ASP.NET\
  \ MVC` 的，或者你可能更喜欢 `Ember.js` 和 `ASP.NET Web API`。你可能会混合使用它们，你也应该这样做。`ASP.NET` 确实正在成为一个充满选择的\
  \ Web 框架。\n\n不要害怕尝试新事物、更换组件或探索新的开源库。`ASP.NET` 及其团队将尝试解决扩展、安全和性能这些大而困难的问题。你如何构建你的应用程序是个人选择，你不必担心\
  \ `ASP.NET` 无法胜任并支持你的架构。\n\n随着 `ASP.NET` 和 `Web Tools 2012.2` 的发布，`ASP.NET` 已经实现了\
  \ `One ASP.NET` 梦想的一半。在不久的将来，也许微软的项目模板将与社区模板并存，项目模板将被方便地共享和分发。最新版本的 `ASP.NET` 并没有让这种未来难以想象。\n\
  \n# 2\n\n使用 ASP.NET 设计 HTML5 和 CSS3\n\n## 本章内容\n\n* 了解 `HTML5` 基础\n* 了解 `CSS3` 基础\n\
  * 在 `ASP.NET` 应用中使用 `HTML5` 和 `CSS3`\n\n## 本章 WROX.COM 代码下载\n\n请注意，本章中的所有代码示例都可以从本书的网站\
  \ [www.wrox.com](http://www.wrox.com) 的“Download Code”选项卡进行下载。\n\n当 `HTML` 最初由 Tim\
  \ Berners-Lee 引入时，它的目的是为使用互联网的研究人员提供一种简单的方法来格式化和交叉引用他们的文档。当时，Web 主要基于文本，因此这些文档的格式要求非常基础。`HTML`\
  \ 只需要少数基础布局概念，如页面标题、章节标题、段落和列表。随着 Web 向大众开放，图形化浏览器相继出现，随着对网页格式要求的不断扩大，新版本的 `HTML`\
  \ 也相继推出。这些新版本扩展了 `HTML` 的原始能力，以适应丰富的图形浏览器环境，允许表格布局、更丰富的字体样式、图像和框架。在 1997 年，`HTML`\
  \ 被标准化为 `HTML4`。\n\n尽管 `HTML` 的这些改进都有帮助，但 `HTML` 在允许开发者创建复杂、高度样式网页方面仍然显得不足。在 1994\
  \ 年，一种名为“层叠样式表”（`CSS`）的新技术被引入。`CSS` 作为 `HTML` 的互补技术，为网页 开发者提供了控制其网页样式所需的权力。\n\n\n\
  \n\n\n随着 Web 的成熟，由于开发者意识到 `CSS` 相比标准的 HTML 样式功能具有显著优势，`CSS` 变得越来越流行。HTML 最初的设计初衷主要是为了作为一种布局机制，而\
  \ `CSS` 从设计之初就是为了为网页提供丰富的样式能力。`CSS` 的级联特性使其能够易地对整个应用应用大范围的样式，并仅在需要的地方覆盖这些样式。`CSS`\
  \ 允许轻松从外部定义网站样式信息，从而实现了网页样式与结构的清晰分离。`CSS` 还允许开发者大幅减小网页文件的大小，这转化为更快的页面加载速度和更带宽消耗。\n\
  \n自世纪末以来，移动设备和多媒体流媒体变得越来越流行。随着 Web 2.0 应用的不断演进，`HTML` 和 `CSS` 也在不断发展。在过去的几年里，`HTML5`\
  \ 和 `CSS3` 变得更加普及。本章从对 `HTML5` 和 `CSS3` 的简要概述开始，以在 Visual Studio 中使用 `HTML` 和 `CSS`\
  \ 创建网站作为结束。回顾这些技术是一个好主意，因为 Visual Studio 2012 中的项目模板已经使用 `HTML5` 和 `CSS3` 重新构建过。\n\
  \n## 注意事项\n\n尽管本章包含了许多 `HTML` 和 `CSS` 的优秀信息，以及如何将它们与 `ASP.NET` 和 Visual Studio 结合，但你应该注意以下几点。\n\
  \n首先，由于单个章节无法涵盖 `HTML` 和 `CSS` 的全部范围，如果你正在寻找对这些主题的深入讨论，可以查看 Joseph W. Lowery 和 Mark\
  \ Fletcher 编写的《HTML5 24-Hour Trainer》（Wiley, 2011）。\n\n其次，由于 `CSS` 仅仅是一项推荐性规范，该规范的解释和实现取决于每个浏览器厂商。正如\
  \ Web 开发中常见的情况一样，每个浏览器在实现（或有时不实现）不同的 `CSS` 特性方面都有自己的之处。尽管本章中的示例已经在 Internet Explorer\
  \ 10 上经过了测试，但请务必在多个平台上的多个浏览器中彻底测试您的网站，以确保您的 `CSS` 在目标的每个浏览器中都能正常渲染。\n\n最后，`HTML5`\
  \ 和 `CSS3` 都是进行中的工作。`CSS3` 与之前的版本不同之处在于它由多个模块组成。截至本书出版时，已有四个模块被发布为正式建议。尽管 `CSS3`\
  \ 建议尚未定稿，但世界维网联盟（W3C）已于 2011 年 9 月发布了 `CSS4` 的第一个正式草案。`HTML5` 仍处于草案阶段。2012 年 7 月，`HTML5`\
  \ 规范编辑器 Ian Hickson 宣布 `W3C` 计划在 2014 年对 `HTML5` 规范进行快照。这个快照被称为 `HTML5`。Web 超文本应用技术工作组\
  \ (`WHATWG`) 将在此之后继续维护该规范。\n\n## HTML5 概述\n\n从 Web 的诞生到今天，`HTML` 一一直是定义网页内容块的主要机制，也是定义页面布局最简单的方法。`HTML`\
  \ 包含了多种你可以使用的布局标签，包括表格、列表和分组元素。你可以组合这些元素来在页面中创建极其复杂的布局。图 2-1 展示了一个使用各种 `HTML` 元素定义基本布局的单一网页。\n\
  \n![image](img/f019-01.jpg)\n\n**图 2-1**\n\n观察此图，你可能会很快注意到网页包含页面标题、几个标题、一个列表和几个段落。然而，与典型的\
  \ `HTML4` 不同，此页面使用了几个新的语义元素作为 `HTML5` 的一部分。我们将查看此页面的源代码并在接下来更详细地解释这些新元素。\n\n###\
  \ HTML5 中的新元素、属性和值\n\n由 `W3C` 文档化的官方 `HTML5` 规范包含了几个新的语义元素。这些元素包括但不限于 表 2-1 所示的内容。\n\
  \n| 元素 | 描述 |\n| --- | --- |\n| `section` | 整个网页或该网页的部分，例如精选内容 |\n| `article` |\
  \ 网页上的某条信息，如新闻发布、博客文章或状态消息 |\n| `header` | 网页的顶部，可以包含 Logo 或或其他页面标题 |\n| `nav` |\
  \ 指定用于导航元素（如菜单或面包屑导航）的特定区域 |\n| `aside` | 网页的一部分，提供与整体内容部分相关的内容，如侧边栏或广告 |\n| `figure`\
  \ | 用于表示内容的区域，显示与网页相关的信息，如图表或视频 |\n| `footer` | 网页的底部，可以包含版权信息、隐私声明或关于作者的其他信息 |\n\
  | `video` | 显示多媒体视频 |\n| `audio` | 播放音频声音，是 `bgsound` 的替代品 |\n\n**表 2-1**\n\n在 `HTML4`\
  \ 的现有元素中添加了相当许多新属性。添加的最常见属性包括但不限于 表 2-2 中列出的属性。\n\n| 属性 | 描述 |\n| --- | --- |\n\
  | `autofocus` | 允许 `input`（类型为 `hidden` 时除外）、`select`、`textarea` 在页面加载时获得焦点。 |\n\
  | `placeholder` | 为 `input` 和 `textarea` 提供数据输入提示。 |\n| `required` | 要求 `input`（类型为\
  \ `hidden, image` 时除外）、`select` 或 `textarea` 必须输入或选择数据。 |\n| `min, max, step, multiple,\
  \ pattern` | 为 `input` 元素指定约束条件。 |\n| `async` | 异步加载 `script` 元素。 |\n| `seemless`\
  \ | 为 `iframe` 提供无边框框架。当点击带有 `seemless` 属性的 `iframe` 内的链接时，除非在 `target` 属性中使用 `_blank`\
  \ 值，否则内容将在父框架中加载。 |\n| `reversed` | 反转 `ol` 元素列表项的顺序。 |\n\n**表 2-2**\n\n除了 `HTML5`\
  \ 引入的语义元素和新属性，`input` 元素的 `type` 属性还添加了多个新值。在出版时，包含了以下值：\n\n*   `tel`: 一种字符串值，不会强制用户输入有效的电话号码，因为可能的值随位置而变化。然而，通过应用\
  \ `pattern` 属性并设置该值可以进行输入验证。\n*   `search`: 一种字符串值，与 `text` 类型非常相似，但允许某些浏览器或应用程序以不同的方式识别它。\n\
  *   `url`: 一种符合单一绝对 URL 的字符串值。\n*   `email`: 一种符合有效电子邮件地址的字符串值。当指定 `multiple` 属性时，电子邮件地址之间用逗号分隔。\n\
  *   `datetime`: 一种符合有效的全局日期和时间的字符串值。有效的全局日期和时间由格林哥历日和时间组成。格林哥历日由年、月、日组成。时间由小时、分钟、秒和小秒组成，并用时区偏移表示。\n\
  *   `date`: 一种符合有效日期的字符串值。有效的日期由年、月、日组成，并用连字符分隔。有效日期不包含时区偏移。\n*   `month`: 一种符合有效月份值的字符串值，该值由四位年份、连字符以及后的两位月份表示。\n\
  \n\n\n\n\n*   `week`: 一个符合有效周值的字符串值，由四位年份、连字符以及随后的两位数字周数表示。如果特定年份有 53 周，则周数的最大值可以为\
  \ 53。否则，最大周数为 52。如果一周从周一开始，则计为一周。\n*   `time`: 一个符合有效时间值的字符串值，由小时、分钟和秒组成。可选地包含最多三位数字的秒级分数。有效时间不包含时区偏移量。\n\
  *   `datetime-local`: 一个符合有效本地日期和时间值的字符串值。与 `datetime` 值类似，有效的本地日期和时间值由格列哥日日期和时间组成。然而，此值不包含时区偏移量。\n\
  *   `number`: 一个由正或负浮点数组成的字符串值。截至发布之日，该值的范围在 `2¹⁰²⁴` 到 `-2¹⁰²⁴` 之间。\n*   `range`:\
  \ 一个由之前定义的正或负浮点数组成的字符串值。然而，在使用 `min`, `max` 和 `step` 属性时，该值可以被进一步限制。如果没有提供 `min,\
  \ max` 或 `step` 属性，则最小值默认为 0，最大值默认为 100。\n*   `color`: 一个由简单颜色值组成的字符串值。简单颜色值定义为有效的\
  \ sRGB 值，由数字符号 (`#`) 后接 sRGB 颜色的小写十六进制值表示。例如，白色表示为 `#ffffff`。该值的长度恰好为七个字符。\n\n例如，列表\
  \ 2-1 显示了图 2-1 中渲染的网页产生的 HTML 源代码。为了清晰，删除了样式元素。\n\n# 列表 2-1: 图 2-1 的网页源码输出\n\n```html\n\
  \ <!DOCTYPE html>\n   <html\n   <head>\n       <title>HTML 5 Sample</title>\n  \
  \ </head>\n   <body>\n       <header>\n           <h1>Header</h1>\n       </header>\n\
  \       <nav>\n           <ul>\n               <li>Navigation Item 1</li>\n    \
  \           <li>Navigation Item 2</li>\n               <li>Navigation Item 3</li>\n\
  \           </ul>\n       </nav>\n       <div id=\"mainContent\">\n           <aside>\n\
  \               Aside\n           </aside>\n           <section>\n             \
  \  <p>\n                   Section 1\n               </p>\n           </section>\n\
  \           <section>\n               Section 2\n               <article>\n    \
  \               Article 1 \n               </article>\n               <article>\n\
  \                   Article 2\n               </article>\n               <article>\n\
  \                   Article 3 \n               </article>\n           </section>\n\
  \       </div>\n       <footer>\n           Footer\n       </footer>\n   </body>\n\
  \   </html>\n```\n\n在检查源码时，你会在 HTML5 中注意到的最早变化之一是简短的 `DOCTYPE` 名称。简短 `DOCTYPE` 的背后的原因是现代浏览器将加载文档并根据加载的内容切换到相应的\
  \ `DOCTYPE`。\n\n你将注意到的另一组变化是使用的语义化元素。你已经读过关于这些元素的用途了。然而，当你查看 HTML 源码时，它会更易读。另一个对你的网站经验有限的开发者将能够理解内容布局以及\
  \ header、section、article、aside 和 footer 之间的分离。\n\n## 使用新的 HTML5 标记\n\n到此时，你已经学习了\
  \ HTML5 中大部分的标记变化。为了更好地理解如何使用这些新元素、属性和值，现在你将逐步通过两个示例项目。\n\n### 场景 1：实现前十倒计时\n\n\
  假设在你的第一个任务中，你被要求为一篇体育文章提供标记。该文章将包含一个所在地区前十大高中棒球球队的列表。然而，你的任务不是按 1 到 10 的顺序列出这些球队，而是按倒计时顺序列出它们。如果你使用\
  \ HTML4，可以通过打破 HTML 4.01 规范来完成这项任务。在这种情况下，你产生的 HTML 将类似于列表 2-2 所示的内容（为了演示目的而省略的简要示例）。\n\
  \n# 列表 2-2: 在 HTML4 中创建倒序列表\n\n```html\n <h1>Top Three Teams</h1>\n   <ol>\n   \
  \    <li value=\"3\">Third Place</li>\n       <li value=\"2\">Runner Up</li>\n \
  \      <li value=\"1\">Top Team</li>\n   </ol>\n```\n\n既然你正在使用 HTML5，你可以使用 `article`\
  \ 元素和有序列表的 `reversed` 属性，如列表 2-3 所示。\n\n# 列表 2-3: 使用 article 和 reversed 属性\n\n```html\n\
  \ <article>\n       <h1>Top Three Teams</h1>\n       <ol reversed>\n           <li\
  \ value=\"3\">Third Place</li>\n           <li value=\"2\">Runner Up</li>\n    \
  \       <li value=\"1\">Top Team</li>\n       </ol>\n   </article>\n```\n\n### 场景\
  \ 2：获取金额\n\n你正在构建一个电子商务应用程序。你的用户故事之一可以总结为允许数据输入人员为产品输入有效的价格。有效价格具有以下要求：\n\n*   产品的最低价格为\
  \ 1.00。\n*   产品的最高价格为 99.95。\n*   价格必须以 5 分钱（0.05）递增。\n*   价格是必填的。\n\n如果你使用纯 HTML4，你无法完成此任务。你能做的最好创建一个从\
  \ 1.00 到 99.95 的下拉列表。此外，如果你仅使用客户端代码，则需要 JavaScript 来强制输入值。\n\n与第一个场景类似，使用 HTML5\
  \ 这样做是轻而易举。事实上，包括 Internet Explorer 在内的大多数现代浏览器都会提供用户友好的验证消息，无需添加自定义 JavaScript。如此处添加简单的\
  \ input 元素所示，你可以满足所有要求：\n\n```html\n <input name=\"price\" type=\"number\" min=\"\
  1\" max=\"99.95\" step=\"0.05\" required />\n```\n\n当输入错误的值（例如 1.01）时，用户将收到如图 2-3\
  \ 所示的验证消息。\n\n\n\n\n\n## HTML5 中的新 API\n\n除了已经提到的标记语言（markup language）的变化外，HTML5\
  \ 规范还包含许多可以使用 JavaScript 访问的新 API。目前 HTML5 规范中的新 API 包括但不限于：\n\n*   媒体\n*   离线 Web\
  \ 应用程序支持\n*   拖放\n*   浏览器会话历史记录\n*   打印\n*   Base64 转换\n*   搜索提供者\n\n还有其他并非正式 HTML5\
  \ 规范一部分的 API。这些包括但不限于：\n\n*   微数据 (Microdata)\n*   Canvas 和 SVG\n*   后台脚本\n*   客户端数据存储\n\
  *   WebSocket（双向客户端服务器通信）\n*   EventSource（服务器到客户端的通信）\n*   地理定位\n\n## CSS3 概述\n\
  \n之前，在列表 2-1 中，你回顾了带有语义化元素的 HTML 标记。虽然这个页面的结构很有趣，但它缺少除最基础样式以外的所有所有样式。为了解决这个问题，许多开发者会倾向于添加基于\
  \ HTML 的格式标签。例如，如果我想更改第一段文本的字体和颜色，我可能会将其 HTML 更改如下所示：\n\n```\n<font face=\"Arial\"\
  \ color=\"blue\">\n```\n\n事实上，在网页设计工具的早期，这段代码是用户为其网页添加样式时生成的，在一段时间内，使用 `<font>`\
  \ 标签似乎是解决网页样式问题的极佳方案。\n\n然而，Web 开发人员和设计师很快发现，使用 `<font>` 标签会迅速导致杂乱的“意大利面条式 HTML”，`<font>`\
  \ 标签散落在整个 HTML 之中。想象一下，如果在列表 2-1 中，你不仅想设置颜色，某些文本还需要加粗、使用不同的颜色或字体、不同的字体大小、下划线并以上标形式显示。想象一下那时需要多少个\
  \ `<font>` 标签，它将如何增加网页的重量并降低其可维护性。使用 `<font>` 标签（以及与其他样式相关的标签）意味着网页的结构和内容之间不再存在清晰整洁的分离。相反，两者被揉在一起成了一个单一的复杂文档。\n\
  \n级联样式表（CSS）引入 Web 开发和设计领域，为网页样式化带来了一种整洁而优雅的解决方案。CSS 意味着可以在整个网站的单一位置定义样式，并在需要该样式的元素上简单引用即可。使用\
  \ CSS 恢复了网页内容与用于显示内容的样式之间的逻辑分离。\n\n## 创建样式表\n\n像 HTML 一样，CSS 是一种解释型语言。当 Web 服务器处理网页请求时，服务器的响应可以包含样式表，样式表仅仅仅仅是级联样式指令的集合。样式表可以通过三种方式包含在服务器的响应中：通过外部样式表文件、通过直接嵌入在网页中的内部样式表，或者通过内联样式表。\n\
  \n### 外部样式表\n\n外部样式表是存储在使用的网页之外的 CSS 样式集合——通常是使用 `.css` 扩展的文件。Visual Studio 通过在“添加新建项”对话框中包含样式表文件模板，使向应用程序中添加外部样式表文件变得简单，如图\
  \ 2-4 所示。\n\n![image](img/f025-01.jpg)\n\n**图 2-4**\n\n在 Visual Studio 创建样式表后，插入新样式非常容易。在处理文档中的样式时，Visual\
  \ Studio 甚至提供了 CSS IntelliSense 支持，如图 2-5 所示。\n\n![image](img/f025-02.jpg)\n\n**图\
  \ 2-5**\n\n你通过使用 HTML `<link>` 标签将外部样式表链接到网页。单个网页可以包含多个样式表引用，如列表 2-4 所示。\n\n# 列表\
  \ 2-4: 添加多个样式表引用\n\n```\n<!DOCTYPE html>\n   <html\n   <head>\n       <title>HTML\
  \ 5 Sample</title>\n       <link href=\"primary.css\" type=\"text/css\" rel=\"stylesheet\"\
  \ />\n       <link href=\"secondary.css\" type=\"text/css\" rel=\"stylesheet\" />\n\
  \   </head>\n   <body>\n       <div>Lorem Ipsum</div>\n   </body>\n   </html>\n\
  ```\n\n你也可以直接在样式表使用 CSS `import` 语句直接将多个样式表链接在一起：\n\n```\n@import url(\"secondary.css\"\
  );\n```\n\n使用 `import` 语句的优势是，你可以更改链接在一起的样式表，而无需修改网站中的每个网页。相反，你只需将每个页面链接到一个主外部样式表，该样式表反过来将使用\
  \ `import` 语句链接其他外部样式表。需要记住的一是，旧版浏览器可能不支持这种语法，并将简单地忽略 `cmd` 命令。\n\n在你的网站中使用外部样式表有几个优势。首先，因为外部样式表存储在网站的网页之外，所以要在所有网页上添加\
  \ `link` 标签比尝试在每个页面中直接管理样式要容易。这使得维护更加容易，因为如果你将来决定更新网站的样式，你有一个存储样式的位置。最后，使用外部样式表还可以通过允许浏览器利用缓存功能来提高你网站的性能。\n\
  \n### 内部样式表\n\n内部样式表是存储在单个网页内部的 CSS 样式集合。样式位于 HTML `<style>` 标签内部，该标签通常位于网页的 `<head>`\
  \ 部分。列表 2-5 显示了内部样式表的示例。\n\n# 列表 2-5: 在网页中使用内部样式表\n\n```\n<!DOCTYPE html>\n   <html>\n\
  \   <head>\n       <title>HTML 5 Sample</title>\n       <style type=\"text/css\"\
  >\n           body {\n               font-family: Arial;\n               font-size:\
  \ medium;\n           }\n       </style>\n   </head>\n   <body>\n       <div>Lorem\
  \ Ipsum</div>\n   </body>\n   </html>\n```\n\n在创建内部样式表时，重要的一点是创建样式块时，确保在样式标签中包含\
  \ `type` 属性，以便浏览器知道如何正确解释该块。此外，像外部样式表一样，Visual Studio 提供了 IntelliSense 支持，让你你轻松添加属性。\n\
  \n### 内联样式\n\n内联样式是使用元素的 `style` 属性直接应用于单个 HTML 元素的 CSS 样式，该属性适用于大多数 HTML 元素。列表\
  \ 2-6 显示了内联样式的示例。\n\n# 列表 2-6: 在网页中使用内联样式\n\n```\n<!DOCTYPE html>\n   <html>\n \
  \  <head>\n       <title>Inline CSS Sample</title>\n   </head>\n   <body>\n    \
  \   <div style=\"font-family: Arial;\">Lorum Ipsum</div>\n   </body>\n   </html>\n\
  ```\n\n## CSS 规则\n\n无论如何存储，在 CSS 样式从服务器发送到客户端之后，浏览器负责解析样式并将其应用于网页中相应的 HTML 元素。如果样式存储在外部或内部样式表中，则样式将定义为\
  \ CSS 规则。浏览器使用规则来确定对哪些 HTML 元素应用什么样式。\n\n一条规则由两部分组成：选择器和它的属性。图 2-6 显示了 CSS 规则的示例。\n\
  \n![image](img/f027-01.jpg)\n\n\n\n\n\n### 图 2-6\n\n## 选择器\n\n`selector` 是规则的一部分，它精确规定了\
  \ 浏览器应该如何选择元素以应用样式。CSS 包含了多种类型的选择器，每种选择器都定义了不同的元素选择技术。\n\n### 通用选择器 (Universal Selector)\n\
  \n通用选择器表示样式应应用于网页中的任何元素。以下示例了一个通用选择器，它会将任何支持 `font-family` 属性的元素的字体更改为 Arial。\n\n\
  ```\n *\n   {\n       font-family: Arial;\n   }\n```\n\n### 类型选择器 (Type Selectors)\n\
  \n类型选择器允许你创建一个适用于特定类型 HTML 元素的样式。该样式将应用于网页中所有该类型的元素。以下示例显示了针对 HTML 段落标签的类型选择器，它会将网页中所有\
  \ `<p>` 标签的字体更改为 Arial：\n\n```\n p\n   {\n       font-family: Arial;\n   }\n```\n\
  \n### 后代选择器 (Descendant Selectors)\n\n后代选择器允许你创建针对特定类型元素后代的 HTML 元素的样式。以下示例演示了一个样式，该样式将应用于任何作为\
  \ `<div>` 后代的 `<span>` 标签：\n\n```\n div span\n   {\n       font-family: Arial;\n\
  \   }\n```\n\n### 子选择器 (Child Selectors)\n\n子选择器与后代选择器相似，不同在于后代选择器搜索元素的整个后代层级，而子选择器将其元素搜索限制为仅父元素的直接元素。以下代码显示了后代选择器的修改，使其成为子选择器：\n\
  \n```\n div > span\n   {\n       font-family:Arial;\n   }\n```\n\n### 属性选择器 (Attribute\
  \ Selectors)\n\n属性选择器允许你根据元素属性的存在而非实际元素名称来定义应用于元素的样式。例如，以下示例创建了一个应用于网页中任何设置了 `href`\
  \ 属性元素的样式：\n\n```\n *[href]\n   {\n       font-family:Arial;\n   }\n```\n\nCSS3\
  \ 为属性选择器增加了一些额外的行为。从 CSS3 开始，你现在不仅可以指定属性，还可以指定属性值。例如，假设你想显示如图 2-7 所示的网页链接列表。对于每个以\
  \ `https://` 开头的链接，你想在链接左侧放置一个锁图标：\n\n```\n div a[href^=\"https://\"] {\n      \
  \ background-image: url(img/lock-icon.png); \n       background-repeat: no-repeat;\n\
  \       background-position: left;\n   }\n```\n\n![image](img/f028-01.jpg)\n\n###\
  \ 图 2-7\n\n### 相邻选择器 (Adjacent Selectors)\n\n相邻选择器允许你选择与另一种类型立即相邻的 HTML 元素。例如，在一个无序列表中，你可能想突出第一个项目，然后让所有后续项目使用不同的样式。你可以使用相邻选择器来实现，如下示例所示：\n\
  \n```\n li\n   {\n       color: maroon;\n   }\n   li+li\n   {\n       color: silver;\n\
  \   }\n```\n\n在此示例中，为列表项目元素（`<li>`）创建了一个默认的类型选择器，它将元素的文本颜色更改为棕红色。然而，创建了第二个相邻选择器，它将覆盖第一个项目之后的所有列表项目的类型选择器，将颜色更改为银色。\n\
  \n### 类选择器 (Class Selectors)\n\n类选择器是 CSS 选择器的一种特殊类型，允许你对具有特定类名的任何元素应用样式。类名在 HTML\
  \ 中使用 `class` 属性定义，该属性存在于每个元素上。类选择器通过在类名前面加上单个点（.）来与其他选择器类型区分来：\n\n```\n .title\n\
  \   {\n       font-size: larger;\n       font-weight: bold;\n   }\n```\n\n此 CSS\
  \ 规则将应用于任何 `class` 属性值与规则名称匹配的元素，示例所示：\n\n```\n <div class=\"title\">Lorum Ipsum</>\n\
  ```\n\n在创建类选择器时，注意类名不能以数字字符开头。此外，CSS 类名可以包含字母和数字。允许使用连字符和下划线。然而，类名中的任何地方都不允许空格和符号。类名不能以两个连字符或下划线开头。最后，在\
  \ HTML 中使用类名时，确保匹配类名的大小写。虽然 CSS 本身不区分大小写，但某些 HTML 文 类型规定 `class` 和 `id` 属性被视为区分大小写的。\n\
  \n### ID 选择器 (ID Selectors)\n\nID 选择器是另一种特殊类型的 CSS 选择器，允许你创建针对具有特定 ID 值的元素的样式。ID\
  \ 选择器通过在它们前面加上哈希标记（#）来与其他选择器类型区分：\n\n```\n #title\n   {\n       font-size: larger;\n\
  \       font-weight: bold;\n   }\n```\n\n此 CSS 规则将应用于任何 `id` 属性值与规则名称匹配的元素，示例所示：\n\
  \n```\n <div id=\"title\">Lorum Ipsum</>\n```\n\n## 伪类 (Pseudo-Classes)\n\nCSS 还包含一系列伪类选择器，为你在创建样式规则时提供额外的选项。你可以向选择器添加伪类以创建更复杂的规则。\n\
  \n### 子元素伪类 (First-Child)\n\n-first-child 伪类允许你指定元素的第一个子元素。以下是使用该伪类的示例：\n\n```\n\
  \ #title p:first-child\n   {\n       font-size: xx-small;\n   }\n```\n\n之前定义的规则表示样式应应用于任何\
  \ `id` 属性为 `title` 的元素中的第一个段落标签。在以下 HTML 中，`First Child` 将应用该样式：\n\n```\n <div id=\"\
  title\">\n       Lorum\n       <p>First Child</p>\n       <p>Second Child</p>\n\
  \       Ipsum\n   </div>\n```\n\nCSS 许多与链接相关的伪类。这些特殊伪类允许你为链接的不同状态定义样式：\n\n```\n\
  \ a:link\n   {\n       color: maroon;\n   }\n   a:visited\n   {\n       color: silver;\n\
  \   }\n```\n\n在此示例中，创建了两规则，第一个适用于未访问链接，第二个适用于已访问链接。\n\n### 动态伪类 (Dynamic Pseudo-Classes)\n\
  \n动态伪类是根据用户的操作应用的特殊 CSS 类，例如悬停在元素上、激活元素或赋予元素焦点。\n\n```\n a:hover\n   {\n       color:\
  \ maroon;\n   }\n a:active\n   {\n       color: silver;\n   }\n a:focus\n   {\n\
  \       color: olive;\n   }\n```\n\n虽然示例演示了在链接标签上使用动态伪类，但你可以将它们用于任何 HTML 元素。然而，不同浏览器对动态伪类的支持存在不同。\n\
  \n### 语言伪类 (Language Pseudo-Class)\n\n语言伪类允许你根据用户的语言设置定义特定的规则。\n\n```\n :lang(de)\n\
  \   {\n       quotes: '<<' '>>' '\\2039' '\\203A'\n   }\n```\n\n在此示例中，`lang` 伪类用于为德语网页设置引号。\n\
  \n\n\n\n\n伪 `first-line` 和 `first-letter` 元素允许你对内容块的第一行和第一个字母应用特殊样式。\n\n```\n p:before\n\
  \   {\n       content: url(images/quote.gif);\n   }\n   p:after\n   {\n       content:\
  \ '<<end>>';\n   }\n```\n\n伪 `before` 和 `after` 元素允许你在目标元素（在本例中为段落元素）之前或之后插入内容。你插入的内容可以是\
  \ URL、字符串、引用字符、计数器或元素属性的值。\n\n### 选择器分组\n\n在创建 CSS 规则时，CSS 允许你将多个选择器组合在一条规则中。接下来的示例演示了一个组合三个类型选择器的单一规则：\n\
  \n```\n h1, h2, h3\n   {\n       color: maroon;\n   }\n```\n\n该规则会导致任何 `h1`、`h2`\
  \ 或 `h3` 标签内容的颜色呈现紫色。\n\n### 选择器组合\n\nCSS 还允许你组合多种选择器类型（参见示例 2-7）。例如，你可以创建除匹配 `class`\
  \ 属性外，针对特定 HTML 元素的类选择器。\n\n示例 2-7：在单一 CSS 规则中组合多种选择器类型\n\n```\n <!DOCTYPE html>\n\
  \   <html>\n   <head>\n       <title>组合选择器</title>\n       <style type=\"text/css\"\
  >\n           .title\n           {\n               font-family: 'Courier New';\n\
  \           }\n\n           div.title\n           {\n               font-family:\
  \ Arial;\n           }\n       </style>\n   </head>\n   <body>\n       <article>\n\
  \           <p class=\"title\">Lorum Ipsum</p>\n           <div class=\"title\"\
  >Lorum Ipsum</div>\n       </article>\n   </body>\n   </html>\n```\n\n### 合并样式\n\
  \n当给 HTML HTML 定义多个规则时，CSS 会合并样式。例如，在示例 2-8 所示的代码中，定义了一个类选择器和一个类型选择器。当浏览器解析样式时，它会将两者都合并到该元素上。\n\
  \n```\n <!DOCTYPE html>\n   <html>\n   <head>\n       <title>合并样式</title>\n    \
  \   <style type=\"text/css\">\n            .title\n           {\n              \
  \ text-decoration:underline;\n           }\n\n           p\n           {\n     \
  \          font-family: 'Courier New';\n           }\n       </style>\n   </head>\n\
  \   <body>\n       <article>\n           <p class=\"title\">Lorum Ipsum</p>\n  \
  \     </article>\n   </body>\n   </html>\n```\n\n如图 2-8 所示，尽管有两个独立的样式规则定义了样式，但段落元素的字体和文本装饰都经过了样式化。\n\
  \n![image](img/f033-01.jpg)\n\n**图 2-8**\n\n你还可以通过使用不同类型的规则合并多个样式。如果单个 HTML 元素匹配所有规则，则每个规则的样式将被合并。示例\
  \ 2-9 显示了一个单个元素匹配多个规则的示例。\n\n```\n <!DOCTYPE html>\n   <html>\n   <head>\n     \
  \  <title>多个选择器匹配</title>\n       <style type=\"text/css\">\n           p\n    \
  \       {\n               font-family: Arial;\n               color: blue;\n   \
  \        }\n\n           p#book\n           {\n               font-size: xx-large;\n\
  \           }\n\n           p.title\n           {\n               font-family: 'Courier\
  \ New';\n           }\n       </style>\n   </head>\n   <body>\n       <article>\n\
  \           <p id=\"book\" class=\"title\" style=\"letter-spacing:5pt;\">Lorum Ipsum</p>\n\
  \       </article>\n   </body>\n   </html>\n```\n\n在这种情况下，因为段落标签定义了 `id`、`class`\
  \ 和 `style` 属性，每个样式规则都匹配了；因此，它们的样式都合并到了元素上。\n\n最后，你可以使用 `class` 属性将多个样式合并到同一个元素，如示例\
  \ 2-10 所示。`class` 属性允许你在由空格分隔的字符串中指定多个类名。\n\n示例 2-10：将多个类选择器分配给单个元素\n\n```\n <!DOCTYPE\
  \ html>\n   <html>\n   <head>\n       <title>多个类选择器</title>\n       <style type=\"\
  text/css\">\n           p.title\n           {\n               font-family: 'Courier\
  \ New';\n               letter-spacing: 5pt;\n           }\n\n           p.summer\n\
  \           {\n               color: Blue;\n           }\n\n           p.newproduct\n\
  \           {\n               font-weight: bold;\n               color: red;\n \
  \          }\n       </style>\n   </head>\n   <body>\n       <article>\n       \
  \    <p class=\"title newproduct summer\">Lorum Ipsum</p>\n       </article>\n \
  \  </body>\n   </html>\n```\n\n在这种情况下，三个类——`title`、`summer` 和 `newproduct` 都在 `class`\
  \ 属性中定义。这意味着这三种样式将合并到段落元素上。\n\n注意，在这种情况下，在内部样式表中定义 CSS 类的顺序也会影响样式如何合并到段落标签上。尽管 `summer`\
  \ 类在定义的类列表最后，但由于 `newproduct` 规则在内部样式表中定义在 `summer` 规则之后，它的属性覆盖了后者。\n\n### CSS 继承\n\
  \nCSS 包含了样式继承的概念，它之所以有效是因为浏览器将定义样式的不同位置（外部、内部或内联）视为一个层级结构。图 2-9 展示了这种继承，演示了在三个位置定义的段落类型选择器规则的\
  \ `font-family` 属性如何被其他样式规则覆盖。\n\n![image](img/f034-01.jpg)\n\n**图 2-9**\n\n如图 2-9\
  \ 所示，通用规则是样式定义距离元素越近，优先级越高。在这种情况下，段落文本最终将使用 Courier New 字体，因为这是内联样式中定义的。\n\n继承不仅适用于位于不同位置的样式，也适用于同一位置内的样式，这意味着有时你必须考虑定义样式的顺序。例如，示例\
  \ 2-11 显示了一个包含两个类型选择器的样式表，它们都针对段落元素，并设置了 `font-family` 样式属性。显然，这两个不能同时应用于同一个元素，因此\
  \ CSS Simple 地选择距离段落标签最近的选择器。\n\n示例 2-11：在同一内部样式中使用样式覆盖\n\n```\n <!DOCTYPE html>\n\
  \   <html>\n   <head>\n       <title>样式覆盖</title>\n       <style type=\"text/css\"\
  >\n           p\n           {\n               font-family: Arial;\n           }\
  \    \n           p\n           {\n               font-family: 'Courier New';\n\
  \           }\n       </style>\n   </head>\n   <body>\n       <article>\n      \
  \     <p>Lorum Ipsum</p>\n       </article>\n   </body>\n   </html>\n```\n\n运行此示例，你将看到应用了\
  \ Courier New 字体。\n\n\n\n\n\n请注意，在结合外部样式表和内部样式表的样式时要要小心。记住，浏览器最终会选择距离特定元素最近的定义样式。这意味着当浏览器开始解析网页时，定义在外部样式表之前的内部样式被认为距离\
  \ HTML 元素更远。因此，浏览器将使用位于外部样式表中的样式。如果你计划在内部和外部样式表中都存储样式规则，请记住在你的网页中，将外部样式表的 `<link>`\
  \ 标签置在内部样式表的 `<style>` 块之前。\n\n### 元素布局与定位\n\nCSS 不仅可以用于页面元素的样式设置，还用于元素定位。与 HTML\
  \ 本身相比，CSS 实际上为你提供了一个更灵活的元素定位系统。CSS 基于 `box model`（盒模型）来确定网页中元素的定位。在确定元素的盒行为后，你可以使用几种技术对其进行定位。\n\
  \n#### CSS 盒模型\nCSS 定位的核心元素是盒模型。盒模型定义了浏览器如何将 HTML 中的每个元素视为一个矩形框。该框由不同的部分组成，包括外边距（margins）、内边距（padding）、边框（borders）和内容（content）。图\
  \ 2-10 显示了所有这些元素是如何组合成框的。\n\n![image](img/f035-01.jpg)\n\n**图 2-10**\n\n构成框的所有独立元素都可能影响其在网页中的位置，除非另有指定，否则每个元素的默认值均为零。元素的高度和宽度等于外边距外边缘的高度和宽度，正如你在上一张图片中看到的，这并不意味着是内容的高度和宽度。\n\
  \nHTML 为你提供了两种框：块级框（block box）和内联框（inline box）。块级框通常由 `<p>`、`<div>` 或 `<table>`\
  \ 等标签表示，以及任何新的 HTML5 语义元素，如 `<article>`、`<section>`、`<header>`、`<aside>`、`<nav>`\
  \ 或 `<footer>`。对于块级框，容器块用于确定其子块的位置。此外，块级框只能包含内联框或块级框，而不能两者兼有。\n\n列表 2-12 显示了一个包含单个父块和两个子块元素的页面示例。\n\
  \n# **列表 2-12: 创建块级框元素**\n\n```\n <div>\n       Lorem ipsum dolor sit amet, consectetuer\
  \ adipiscing elit.\n       <div>\n           Donec et velit a risus convallis porttitor.\n\
  \           Vestibulum nisi metus, imperdiet sed, mollis\n           condimentum,\
  \ nonummy eu, magna.\n       </div>\n       <div>\n            Duis lobortis felis\
  \ in est. Nulla eu velit ut nisi\n            consequat vulputate.\n       </div>\n\
  \       Vestibulum vel metus. Integer ut quam. Ut dignissim, sapien\n       sit\
  \ amet malesuada aliquam, quam quam vulputate nibh, ut\n       pulvinar velit lorem\
  \ at eros. Sed semper lacinia diam. In\n       faucibus nonummy arcu. Duis venenatis\
  \ interdum quam. Aliquam\n       ut dolor id leo scelerisque convallis. Suspendisse\
  \ non velit.\n       Quisque nec metus. Lorum ipsum dolor sit amet, consectetuer\n\
  \       adipiscing elit. Praesent pellentesque interdum magna.\n   </div>\n```\n\
  \n第二种框类型是内联框。内联框通常由 `strong`、`i` 和 `span` 等标签以及实际的文本和内容表示。列表 2-13 显示了如何修改之前的列表以包含内联框。\n\
  \n# **列表 2-13: 创建内联框元素**\n\n```\n <div>\n       Lorem <strong>ipsum</strong> dolor\
  \ sit amet, consectetuer adipiscing elit.\n       <div>\n           Donec et velit\
  \ a risus <strong>convallis</strong> porttitor.\n           Vestibulum nisi mets,\
  \ imperdiet sed, mollis\n           condimentum, nonummy eu, magna.\n       </div>\n\
  \       <div>Duis lobortis felis in est.\n           <span>Nulla eu velit ut nisi\
  \ consequat vulputate.</span>\n       </div>\n       <i>Vestibulum vel metus.</i>\
  \ Integer ut quam. Ut dignissim, sapien\n       sit amet malesuada aliquam, quam\
  \ quam vulputate nibh, ut\n       pulvinar velit lorem at eros. Sed semper lacinia\
  \ diam. In\n       faucibus nonummy arcu. Duis venenatis interdum quam. Aliquam\n\
  \       ut dolor id leo scelerisque convallis. Suspendisse non velit.\n       Quisque\
  \ nec metus. Lorem ipsum dolor sit amet, consectetuer\n       adipiscing elit. Praesent\
  \ pellentesque interdum magna.\n   </div>\n```\n\n渲染此页面会导致每个块都开始新的一行。图 2-11 显示了在浏览器中渲染的标记。\n\
  \n![image](img/f037-01.jpg)\n\n**图 2-11**\n\nVisual Studio 的设计表面也可以帮助你清晰地了解 `div`\
  \ 的布局。当你选择一个单独 `div` 元素时，设计表面会高亮它。图 2-12 显示了这一点。\n\n![image](img/f037-02.jpg)\n\n\
  **图 2-12**\n\n在这一节开始时，我提到块总是包含内联框或块级框，但有趣的是在这种情况下，因为第一行文本包含内联框，看起来 `div` 违反了该规则。但实际上发生的是浏览器为该行添加了一个匿名块框。图\
  \ 2-13 显示了浏览器所看到的块框。\n\n![image](img/f037-03.jpg)\n\n**图 2-13**\n\n你可以通过 `position`\
  \ 属性显式地设置元素将采用的行为。例如，如所示在 `div` 上设置 `position` 属性会导致布局发生变化。\n\n```\n <div style=\"\
  display: inline;\">\n       Donec et velit a risus <strong>convallis</strong>- porttitor.\
  \  \n       Vestibulum nisi metus, imperdiet sed, mollis condimentum.\n   </div>\n\
  ```\n\n图 2-14 显示了添加此属性如何改变标记的渲染。你可以看到现在元素不是在新的一行显示，它的内容直接接了上一个块。\n\n![image](img/f038-01.jpg)\n\
  \n**图 2-14**\n\n你还可以将 `display` 属性设置为 `none`，从而从网页布局中完全移除元素。如果你有 `display` 属性设置为\
  \ `none` 的元素，或者 `visibility` 属性设置为 `hidden` 的元素，Visual Studio 为你提供了在设计表面上显示或隐藏这些元素的选项。\n\
  \n如 图 2-15 所示，视图菜单上的两个选项允许你切换设置了这些属性的元素的设计可见性。\n\n![image](img/f038-02.jpg)\n\n\
  **图 2-15**\n\n#### 定位 CSS 元素\n\nCSS 为你提供了主要的定位机制：普通（normal）、绝对（absolute）和相对（relative）。每种类型都提供了用于布局页面元素的不同行为。要指定你想要元素使用的布局行为，你可以设置\
  \ CSS `position` 属性。\n\n\n\n\n使用普通定位时，块级元素垂直流动，而内联元素水平流动，从左到右。这种行为是默认设置，当没有为 `position`\
  \ 属性提供其他值时就会使用。图 2-16 展示了使用普通定位的四个独立块的布局。\n\n![image](img/f039-01.jpg)\n\n**图 2-16**\n\
  \n如你所见，每个块元素都如预期地垂直流动。\n\n## 相对定位\n\n使用相对定位时，元素最初使用普通布局进行定位。周围的框被定位，然后根据其偏移属性：`top`、`bottom`、`left`\
  \ 和 `right` 移动框。图 2-17 显示与上一节相同的内容，但现在第三个块框被样式为使用相对定位。Visual Studio 通过为该块提供定位线来帮助你，向你显示其顶部偏移是基于块的正常顶部位置计算的，左侧偏移是基于正常左侧位置计算的。Visual\
  \ Studio 甚至允许你通过提取元素的标签并将其拖到设计表面上来视觉化地定位块。\n\n![image](img/f039-02.jpg)\n\n**图 2-17**\n\
  \n你在设计表面上定位元素时，元素的顶部和左侧值会被更新。你最终将得到类似这样的元素：\n\n```\n <div style=\"position: relative;top:\
  \ 214px;left: 62px;\n               width: 239px;height: 81px\">\n         Donec\
  \ et velit a risus <strong>convallis</strong> porttitor. Vestibulum \n         nisi\
  \ metus, imperdiet sed, mollis condimentum, nonummy eu, magna.\n   </div>\n```\n\
  \n如果你在使用相对定位并同时定义了左右偏移，右侧偏移通常会被忽略。\n\n## 绝对定位\n\n绝对定位的工作与相对定位非常相似，只是元素不是根据其在普通定位方案中的位置计算偏移位置，而是根据其最近的绝对定位祖先元素的位置计算偏移。如果不存在此类元素，则祖先就是浏览器窗口本身。\n\
  \n图 2-18 显示了使用绝对定位的块如何在 Visual Studio 设计表面上显示。如你所见，与上一节所示的相对定位元素的显示不同，这次定位线一直延伸到设计表面的边缘。这是因为块正在使用浏览器窗口来计算其偏移。\n\
  \n![image](img/f040-01.jpg)\n\n**图 2-18**\n\n与相对块一样，可以使用元素的标签在页面上定位元素，Visual Studio\
  \ 会自动更新偏移值。图 2-18 中的块将输出一个类似这样的元素：\n\n```\n <div style=\"position: absolute; top:\
  \ 180px; left:94px;\n               width: 239px; height: 81px;\">\n         Donec\
  \ et velit a risus <b>convallis</b> porttitor. Vestibulum \n         nisi metus,\
  \ imperdiet sed, mollis condimentum, nonummy eu, magna.\n   </div>\n```\n\n## 浮动元素\n\
  \n使用 CSS 控制元素位置的另一个选项是 `float` 属性。`float` 属性允许将元素浮到块的左侧或右侧。浮动块在垂直方向上像普通位置一样进行定位，但在水平方向上尽可能向左或向右移动。列表\
  \ 2-14 展示了在本节中对之前示例使用的块进行浮动。\n\n### 列表 2-14: 将块元素浮动到右侧**\n\n```\n <!DOCTYPE html>\n\
  \   <html>\n   <head>\n       <title>Box Elements</title>\n   </head>\n   <body>\n\
  \       <div id=\"asdas\" class=\"werwer\">\n           Lorem ipsum dolor sit amet,\
  \ consectetuer adipiscing elit.\n       </div>\n       <div style=\"float: right;\
  \ width: 236px;\">\n           Donec et velit a risus <strong>convallis</strong>\
  \ porttitor.\n           Vestibulum nisi metus, imperdiet sed, mollis\n        \
  \   condimentum, nonummy eu, magna.\n       </div>\n       <div>\n           Duis\
  \ lobortis felis in est. Nulla eu velit ut nisi consequat.\n       </div>\n    \
  \   <div>\n           Sit amet malesuada aliquam, quam quam vulputate nibh, ut\n\
  \           pulvinar velit lorem at eros. Sed semper lacinia diam. In\n        \
  \   faucibus nonummy arcu. Duis venenatis interdum quam. Aliquam\n           ut\
  \ dolor id leo scelerisque convallis. Suspendisse non velit.\n           Quisque\
  \ nec metus. Lorem ipsum dolor sit amet, consectetuer\n           adipiscing elit.\
  \ Praesent pellentesque interdum magna.\n       </div>\n   </body>\n   </html>\n\
  ```\n\n该块已通过修改，在其样式中包含了 `float` 属性。完成操作后，Visual Studio 正确将元素定位到页面的最右侧，如 图 2-19 所示。\n\
  \n![image](img/f041-01.jpg)\n\n**图 2-19**\n\n#### !important 属性\n\n正如你在本章稍早些部分看到的，浏览器将对元素应用最近的样式，这意味着其他已应用样式的属性可能会被覆盖。正如\
  \ CSS 中的许多其他规则一样，这也不是绝对的。CSS 提供了一种规避此条规则的机制，称为 `!important` 属性。应用了此属性的属性可以防止其他 CSS\
  \ 规则覆盖其值。列表 2-11 展示了 `font-family` 属性如何被覆盖。你可以通过修改此示例以使用该属性来查看 `!important` 属性是如何工作的。这在\
  \ 列表 2-15 中显示。\n\n### 列表 2-15: 使用 !important 属性控制样式**\n\n```\n <!DOCTYPE html>\n\
  \   <html>\n   <head>\n       <title>Box Elements</title>\n       <style type=\"\
  text/css\">\n           p {\n               font-family: Arial !important;\n   \
  \        }\n           p {\n               font-family: 'Courier New';\n       \
  \    }\n       </style>\n   </head>\n   <body>\n       <p>\n           Lorem ipsum\
  \ dolor sit amet, consectetuer adipiscing elit.\n       </p>\n   </body>\n   </html>\n\
  ```\n\n在这种情况下，段落并没有显示 Courier New，而是将使用 Arial 字体，因为它被标记了 `important` 属性。\n\n## CSS3\
  \ 的新功能\n\n正如前面提到的，CSS3 建议包含几个已提议的模块。许多这些提议的模块已经在大多数现代浏览器中实现。结合 HTML5，CSS3 允许 Web\
  \ 开发人员实现更先进的设计而不需要 ActiveX 插件或 JavaScript 库。\n\n### 使用新的边框功能\n\nCSS3 最常用的功能之一是边框模块的实现。过去，开发者需要使用多个\
  \ `div` 元素或带有圆角的图像来实现圆角。在 CSS3 中，只需添加几条样式规则即可完成：\n\n\n\n\n```css\n div {\n     \
  \  border-radius: 15px;\n       box-shadow: 5px 5px rgba(0,0,0,0.2);\n   }\n```\n\
  \n除了添加 15 像素的圆角框外，`div` 元素周围还有一个 5 像素的阴影。列表 2-16 通过仅在右下角定义 `border-radius` 并在底部放置内阴影，进一步增强了这一点。这生成了你在图\
  \ 2-20 中看到的渲染效果。\n\n### 列表 2-16: 使用 CSS3 边框增强规则\n\n```html\n <!DOCTYPE html>\n \
  \  <html\n   <head>\n       <title>CSS3 Borders</title>\n       <style type=\"text/css\"\
  >\n           .pageFeel {\n               padding: 5px;\n               height:\
  \ 240px;\n               border: 1px solid #cccccc;\n               background-color:\
  \ #eeeeee;\n               width: 240px;\n               -moz-border-radius-bottomright:\
  \ 50px 25px;\n               border-bottom-right-radius: 50px 25px;\n          \
  \     -moz-box-shadow: inset -5px -5px 5px #aaa;\n               -webkit-box-shadow:\
  \ inset -5px -5px 5px #aaa;\n               box-shadow: inset -3px -3px 20px #aaa;\n\
  \           }\n       </style>\n   </head>\n   <body>\n       <div class=\"pageFeel\"\
  >\n           Lorem ipsum dolor sit amet, consectetuer adipiscing elit.\n      \
  \ </div>\n   </body>\n   </html>\n```\n\n你会注意到，对于 `border-radius` 规则，有一条指定了带有 `-moz-`\
  \ 前缀的特殊规则。这允许了对 Mozilla Firefox 3.5 的支持。对于 `box-shadow` 规则，你会注意到除了带有 `-moz-` 前缀的规则外，还有另一个带有\
  \ `-webkit-` 前缀的规则。该规则允许对 Safari 和 Google Chrome 进行支持。\n\n![image](img/f043-01.jpg)\n\
  \n**图 2-20**\n\n#### 增强背景\n\n开发者过去面临的另一个样式问题是无法实现多个背景或分层背景。这通常通过使用具有不同 `z-index`\
  \ 值的多个 `div` 元素来解决。在 CSS3 中，同一个样式规则中应用多个背景。\n\n开发者遇到的另一个常见问题是为网站创建一个背景图像，该图像能够根据各种屏幕尺寸适当地平铺或缩放。很多时候，必须使用单独的\
  \ CSS 文件来获取屏幕分辨率。否则，你必须设计一张在用户察觉不到图像边缘的情况下可以平铺的图像。这种示例在图 2-21 中所示。\n\n![image](img/f043-02.jpg)\n\
  \n**图 2-21**\n\n为了解决这两个问题，你可以使用 CSS3 的新功能，如列表 2-17 所示。\n\n### 列表 2-17: 在 CSS3 中使用背景规则\n\
  \n```html\n <!DOCTYPE html>\n   <html>\n   <head>\n       <title>CSS3 Borders</title>\n\
  \       <style type=\"text/css\">\n           body {\n               margin-top:\
  \ 200px;\n               background-color: #33BEF2;\n               background-image:\
  \ url(clouds.png), url(background.png);\n               background-position: top\
  \ center, bottom center;\n               background-size: auto, cover;\n       \
  \        background-repeat: no-repeat, repeat-y;\n               color: white;\n\
  \               font-size: 18pt;\n               font-weight: bold;\n          \
  \ }\n       </style>\n   </head>\n   <body>\n       <div>\n           Lorem ipsum\
  \ dolor sit amet, consectetuer adipiscing elit.\n       </div>\n       <div>\n \
  \          Donec et velit a risus <strong>convallis</strong> porttitor.\n      \
  \     Vestibulum nisi metus, imperdiet sed, mollis\n           condimentum, nonummy\
  \ eu, magna.\n       </div>\n       <div>\n           Duis lobortis felis in est.\
  \ Nulla eu velit ut nisi consequat.\n       </div>\n       <div>\n           Sit\
  \ amet malesuada aliquam, quam quam vulputate nibh, ut\n           pulvinar velit\
  \ lorem at eros. Sed semper lacinia diam. In\n           faucibus nonummy arcu.\
  \ Duis venenatis interdum quam. Aliquam\n           ut dolor id leo scelerisque\
  \ convallis. Suspendisse non velit.\n           Quisque nec metus. Lorem ipsum dolor\
  \ sit amet, consectetuer\n           adipiscing elit. Praesent pellentesque interdum\
  \ magna.\n       </div>\n   </body>\n   </html>\n```\n\n如你所见，`background-image`\
  \ 规则指定了两个图像。每个图像将被分别渲染。`background.png` 文件将被单独渲染。`background-size` 规则有两个值。\n\n\n\
  \n\n## 在 Visual Studio 中使用 CSS\n\nVisual Studio 提供了多种专门设计的工具，让 CSS 工作成为一种极佳的体验。要为你的网页创建一个新样式，只需从\
  \ `Format`（格式）菜单中选择 `New Style`（新建样式）选项。即可打开 `New Style`对话框，如图 2-25\n\n**图 2-24**\n\
  \n![image](img/f046-03.jpg)\n\n**图 2-25**\n\n此对话框让创建新样式变得轻而易举。首先，从 `Selector`下拉列表中选择你想要创建的选择器类型，该列表包含了所有可用元素类型。如果你想创建一个\
  \ `Class`（类）或 `ID` 选择器，只需在 `Selector`组合框中输入 `Style` 名称即可。\n\n接下来，你从 `Define In`（定义位置）组合框中选择要创建样式的位置。你可以选择\
  \ `Current Page`来创建一个内部样式表，选择 `New Style Sheet`创建一个新的外部样式表文件，或选择 `Existing Style\
  \ Sheet`将样式插入到现有的样式表文件中。如果你选择了 `New Style Sheet` 或 `Existing Style Sheet`，则必须为 `URL`组合框提供值。\n\
  \n最后，为了让此样式应用于设计表面当前选中的元素（或元素），请勾选 `Apply New Style to Document`（将新样式应用于文档）复选框。\n\
  \n在你输入了要使用的选择器并选择了定义样式的位置后，就可以设置样式的属性。只需从 `Category`列表框中选择属性类别并设置属性值即可。`Preview`（预览）区域为你提供新样式的实时预览。此外，`Description`（描述）区域会显示\
  \ Visual Studio 创建的实际属性语法。点击 `OK` 关闭对话框。\n\n在你开始为应用程序创建样式后，你需要能够管理并将这些样式应用到应用程序中的元素。Visual\
  \ Studio 包含了三个工具窗口，你可以使用它们来管理样式表、将样式应用到元素，并轻松检查应用于元素的样式属性。\n\n## 样式管理工具窗口 (Manage\
  \ Styles)\n\n首先要探索的工具是“样式管理”工具窗口，你可以通过`View`（视图）菜单下的 `CSS Styles`子菜单选择 `Manage Styles`来打开它。该工具窗口如图\
  \ 2-26 所示，可以为你提供 Visual Studio 中打开的当前网页所有可用样式的视图。\n\n![image](img/f047-01.jpg)\n\
  \n**图 2-26**\n\n如果你检查此工具的内容，会发现最顶部部分包含两个重要链接：`New Style`，它会打开 `New Style`对话框并允许你像本节之前描述的那样创建新的\
  \ CSS 样式；以及 `Attach Style Sheet`（附加样式表）链接，它允许你将新的样式表导入到网页中。使用此选项将样式表附加到网页会导致 Visual\
  \ Studio 为你在网页中插入 `<link>` 标签。\n\n请记住，你必须小心链接标签和样式块的顺序，以确保你的样式被正确应用。\n\n工具的下部分包含一个预览区域，允许你查看每个样式的实时预览。\n\
  \n最后，工具窗口的底部显示了页面所有可用样式。样式根据其选择器类型使用彩色圆点进行颜色编码：蓝色代表`Type`选择器，绿色代表`Class`选择器，红色代表`ID`选择器。页面内使用的样式用彩色圆点周围的一圈灰色圆圈显示。如果你的网页包含多个链接的样式表或内联样式表，这些样式将分组在一起，从而易于确定样式的定义位置。\n\
  \n此外，如图 2-26 所示，该工具窗口允许你查看通过 `CSS Imports`语句附加到网页的样式表。通过展开图中所示的 `light.css` 节点，你可以看到该样式表中包含的所有样式的列表。\n\
  \n## 应用样式工具窗口 (Apply Styles)\n\n另一个帮助你在 Visual Studio 中使用 CSS 的工具是“应用样式”工具窗口。与“样式管理”工具窗口一样，“应用样式”工具窗口为你提供了一种简单的方法来查看应用程序中可\
  \ CSS 样式并将其应用于网页中的元素。从工具窗口中，你可以将 CSS 文件附加到网页，使外部 CSS 样式可用；选择要应用或从元素中移除的页面样式；并修改样式。与其他\
  \ CSS 工具窗口一样，“应用样式”工具窗口根据 CSS 继承顺序显示可用样式，首先显示外部样式，然后是页面样式部分，最后显示内联样式。“应用样式”窗口对当前选中的元素具有上下文敏感性，它只会显示应用程序中可以应用于该元素类型的样式。样式还根据\
  \ CSS 选择器样式分组，每种选择器类型都有不同的视觉指示。\n\n如图 2-27 所示的工具窗口显示了适用于锚点标签 `<a>` 的可用样式。工具首先显示附加的\
  \ `layout.css` 文件中的所有样式，然后是当前页面的样式，最后（如果已应用）是元素的内联样式。你可以点击这些部分中的任何样式样式将其应用于元素。\n\
  \n“应用样式”工具还包含了智能功能，可以应用多个 `Class` 选择器（在列表中点击选择器时按住 `Ctrl` 键），但阻止选择多个 `ID` 选择器，因为这会导致\
  \ CSS 无效。该工具也不会取消选择 `Type` 选择器或内联样式。\n\n![image](img/f048-01.jpg)\n\n**图 2-27**\n\
  \n## CSS 属性窗口 (CSS Properties)\n\n最后一个工具是如图 2-28 所示的 CSS 属性窗口。这个实用的工具窗口向你显示应用于当前元素的所有\
  \ CSS 属性。工具窗口由两个部分组成：`Applied Rules`列表和`CSS properties`网格。\n\n`Applied Rules`列表显示了应用于元素的\
  \ CSS 规则。该列表自动排序，向你展示规则的继承链，从外部规则到内部规则。这意味着包含在外部 CSS 文件中的规则自动位于列表顶部，而内联样式则位于底部。你可以点击列表中的每个规则，并更改下方`CSS\
  \ properties`网格中显示的属性。\n\n`CSS properties`网格的工作方式与标准的 .NET 属性网格类似，显示元素所有用的 CSS 属性，并将设置了值的属性加粗。此外，你还可以直接从从属性网格中为\
  \ CSS 规则设置属性值。CSS 属性窗口中还有一个 `Summary`（摘要）按钮，允许你更改`CSS properties`网格的显示方式，仅显示设置了值的属性。此功能非常有用，因为\
  \ HTML 元素可能有大量的 CSS 属性。\n\n由于 CSS 还包含了属性继承的概念（这在标准的 .NET 对象中通常不可用），因此`Applied Rules`列表和`CSS\
  \ properties`网格的设计目的是为了帮助你完全理解应用于元素的特定属性值是在哪里定义的。当你点击`Applied Rules`列表中的每个规则时，`CSS\
  \ properties`网格会更新以反映该规则的属性。然而，你会注意到某些属性带有删除线。（参见图 2-29。）\n\n属性的删除线表示该属性的值被更靠近元素的规则所覆盖。\n\
  \n![image](img/f048-02.jpg)\n\n\n\n\n\n图 2-28\n\n![image](img/f048-03.jpg)\n\n图\
  \ 2-29\n\n### 设置 ASP.NET 控件样式\n\n由于 ASP.NET 控件仅仅是渲染 HTML 标记，因此使用 CSS 对它们进行样式非常简单。事实上，默认情况下这些控件已经使用了内联\
  \ CSS 样式。你可以通过查看标准的 ASP.NET `Button` 控件来看到这一操作。为像 `Button` 等 ASP.NET 控件设置样式的标准方法是为控件暴露的样式相关属性提供值，如下：\n\
  \n```asp\n <asp:Button ID=\"Button1\" runat=\"server\" BackColor=\"#3333FF\"\n \
  \      BorderColor=\"Silver\" BorderStyle=\"Double\" BorderWidth=\"3px\"\n     \
  \  Font-Bold=\"True\" Font-Size=\"Large\" ForeColor=\"White\"\n       Text=\"Button\"\
  \ />\n```\n\n当 ASP.NET 处理包含此控件的 页面时，它会将按钮转换为标准的 HTML `Input` 标签，并将你设置的样式属性转换为 CSS\
  \ 样式并应用到 `input` 标签上。按钮渲染的 HTML 和 CSS 所示：\n\n```html\n <input type=\"submit\" name=\"\
  Button1\" value=\"Button\" id=\"Button1\"\n       style=\"color:White;background-color:#3333FF;border-color:Silver;\n\
  \   border-width:3px;\n               border-style:Double;font-size:Large;font-weight:bold;\"\
  \ />\n```\n\n直接在 ASP.NET 控件上设置样式属性是为你应用程序中的 ASP.NET 控件设置样式的一种快速简单的方法。此外，由于这些是控件的标准属性，你还可以在运行时使用代码设置它们。\n\
  \n```cs\n protected void Page_Load(object sender, EventArgs e)\n    {\n        this.Button1.BackColor\
  \ =\n            System.Drawing.ColorTranslator.FromHtml(\"#3333FF\");\n       \
  \ this.Button1.BorderColor = System.Drawing.Color.Silver;\n        this.Button1.BorderStyle=\
  \ BorderStyle.Double;\n        this.Button1.BorderWidth = Unit.Pixel(3);\n     \
  \   this.Button1.Font.Bold=true;\n        this.Button1.Font.Size=FontUnit.Large;\n\
  \        this.Button1.ForeColor=System.Drawing.Color.White;\n    }\n```\n\n虽然使用属性设置样式信息既简单又方便，但它确实有一些缺点，特别是当你对较大的重复控件使用相同技术时。其中一个缺点是，使用内联样式使得很难在更高、更抽象的层面上控制你网站的样式。如果你希望网站上的每个按钮都具有特定的样式，通常你必须手动为整个网站中的每个\
  \ `Button` 控件设置该样式。主题（Themes）可以帮助解决这个问题，但并不总是有用，特别是当你将 ASP.NET 控件与标准 HTML 控件混合使用时。\n\
  \n另一个缺点是，对于像 `GridView` 这样生成大量重复 HTML 的控件，在每次 HTML 迭代的每个元素上使用内联样式会为你的网页添加大量的额外标记。\n\
  \n幸运的是，每个 ASP.NET 服务器控件都暴露了 `CssClass` 属性。该属性允许你为控件提供一个或多个类选择器规则。虽然这种技术很有帮助，而且通常比让控件渲染内联样式更好，但它仍然要求你熟悉控件在运行时渲染的\
  \ HTML。列表 2-18 显示了你如何使用 `CssClass` 属性为 ASP.NET `Button` 控件设置样式。\n\n# 列表 2-18: 使用\
  \ CSS 为标准的 ASP.NET Button 控件设置样式\n\n```asp\n <%@ Page Language=\"C#\" %>\n\n   <!DOCTYPE\
  \ html>\n\n   <html xmlns=\"http://www.w3.org/1999/xhtml\">\n   <head runat=\"server\"\
  >\n       <link href=\"SpringStyles.css\" rel=\"stylesheet\" type=\"text/css\" />\n\
  \       <style>\n           .search\n           {\n               color:White;\n\
  \               font-weight:bolder;\n               background-color:Green;\n  \
  \         }\n       </style>\n   </head>\n   <body>\n       <form id=\"form1\" runat=\"\
  server\">\n           <asp:Button ID=\"Button1\"\n               CssClass=\"search\"\
  \ runat=\"server\" Text=\"Button\" />\n       </form>\n   </body>\n   </html>\n\
  ```\n\n在这种情况下，该按钮将应用 `search` 类。\n\n### Visual Studio 2012 中的 HTML 和 CSS 改进\n\n\
  在每个版本的 Visual Studio 中，微软都改进了软件中的 HTML 开发功能。Visual Studio 2012 也不例外。Visual Studio\
  \ 2012 为 HTML 增加了多项改进，包括但不限于：\n\n*   WAI-ARIA 支持，它允许元素包含 `role` 属性和其他以 `aria` 开头的属性。\n\
  *   当其中一个标签重命名时，匹配的 HTML 和 ASP.NET 服务器控件标签也会被重命名。\n*   HTML5 元素现在可以作为代码段（snippets）在\
  \ Visual Studio 中。\n*   `TextBox` ASP.NET 服务器控件已更新，支持新的 HTML5 输入类型，如 `email` 和 `datetime`。\n\
  *   `FileUpload` ASP.NET 服务器控件在现代浏览器中支持多个文件上传。\n\nVisual Studio 2012 中的 CSS 也有几项改进，包括但不限于：\n\
  \n*   显示特定浏览器的新规则，如 `-moz` 和 `-webkit`。\n*   分层缩进以显示你的 CSS 规则，如图 2-30 所示。![image](img/f050-01.jpg)\
  \ 图 2-30\n*   注释（使用快捷键）、区域和代码段对 CSS 可用。\n*   新的调色板可以帮助你选择所需的颜色，如图 2-31 所示。![image](img/f051-01.jpg)\
  \ 图 2-31\n\n### Page Inspector\n\nPage Inspector 是 Visual Studio 自带的新工具。该工具允许开发者查看相关代码的渲染标记。换句话说，当你从\
  \ Web Forms 或 MVC 页面选择控件时，你将在预览窗口中看到对应的标记（如图 2-32 所示）。目前，Page Inspector 使用 Internet\
  \ 9 或更高版本来渲染标记。\n\n![image](img/f051-02.jpg) 图 2-32\n\n## 总结\n\nCSS 是为网站添加样式的一种极方法。它是一种强大且方便的机制，允许你为网站创建复杂的样式和布局，特别是与\
  \ HTML5 结合时。对 CSS 的全面讨论需要比这里更多的时间和空间，因此本章重点向你展示 HTML 和 CSS 的基本概念，以及 Visual Studio\
  \ 2012 和 ASP.NET 4.5 的新功能。\n\n本文通过介绍新元素、属性、属性值和 API 提供了 HTML5 的概述。你学习如何在现实场景中使用新的\
  \ HTML5 元素和属性。\n\n接下来提供了 CSS3 的概述，介绍了外部、内部和内联样式表。你学习了 CSS 提供的各种选择器类型，以及 CSS 元素的基本布局和定位，包括盒模型如何影响网页中元素的位置。你还学习了\
  \ HTML5 和 CSS3 的后兼容性。\n\n最后，你回顾了 Visual Studio 中的可用工具，包括样式管理器和 CSS 属性窗口，它们使得使用 CSS\
  \ 变得简单。你查看了如何将 CSS 与 ASP.NET 服务器控件一起。你还学习了 Visual Studio 2012 和 Page Inspector 中\
  \ HTML 和 CSS 的一些新功能。\n\n\n\n\n\n请注意，本章中的所有代码示例均可以在书籍网站 [`www.wrox.com`](http://www.wrox.com)\
  \ 的下载代码（Download Code）选项卡中作为章节代码下载。\n\n从 Active Server Pages 3.0 到 `ASP.NET` 1.0\
  \ 的演进至少也可以是革命性的。而现在，随着 `ASP.NET` 最新版本 —— 4.5 版本的发布，这场革命仍在继续。`ASP.NET` 1.0 的最初引入从根本上改变了网站和应用程序的方式。`ASP.NET`\
  \ 4.5 在提高您的生产力方面同样具有革命性。近期，`ASP.NET` 的首要目标是让您能够使用尽可能少的代码构建强大、安全且动态应用程序。尽管本书涵盖了 `ASP.NET`\
  \ 4.5 提供的新功能，但同时也涵盖了 `ASP.NET` 技术的所有内容。\n\n如果您是 `ASP.NET` 的新手，并且首次在 `ASP.NET` 4.5\
  \ 中构建第一组应用程序，您可能会被它提供的海量服务器控件感到惊讶。您可能会惊叹它如何通过一系列数据提供程序让您更有效地与数据工作。您可能会对如何如此轻松地构建安全性和个性化功能印象深刻。\n\
  \n然而，`ASP.NET` 4.5 的卓越能力并不仅于此。本章将介绍许多便于操作 `ASP.NET` Web 页面和应用程序的选项。作为开发者，在启动项目时应该采取的第一步之一是熟悉您正在构建的基础以及用于自定义该基础的可用选项。\n\
  \n## 应用程序位置选项\n\n通过 `ASP.NET` 4.5，您可以选择 —— 使用 `Visual Studio 2012` —— 创建一个映射到 `IIS`\
  \ 的虚拟目录的应用程序，或者在 `IIS` 范围之外创建一个独立应用程序。早期的 `Visual Studio .NET` 2002/2003 IDE 强制开发者对所有\
  \ Web 应用程序使用 `IIS`，而 `Visual Studio 2008/2010`（同样， `Visual Web Developer 2008/2010\
  \ Express 版`）包含了一个名为 `Cassini` 的内置 Web 服务器，您可以使用它进行开发，就像过去在使用 `ASP.NET WebMatrix`\
  \ 时使用的那样。在 `Visual Studio 2012` 中，内置 Web 服务器是 `IIS Express`。\n\n以下章节将向您展示如何使用随 `Visual\
  \ Studio 2012` 一的 `IIS Express`。\n\n### 使用文件系统 (IIS Express)\n\n默认情况下，`Visual Studio\
  \ 2012` 使用 `IIS Express` 构建应用程序。当您在 IDE 中选择 `File` ![image](img/Ar.jpg) `New` ![image](img/Ar.jpg)\
  \ `Web Site` 时，就可以看到这一点。如果您使用的是 Windows 8，默认为您应用程序提供的位置位于 `C:\\Users\\JasonGaylord\\\
  Documents\\Visual Studio 2012\\WebSites`（如图 3-1 所示）。它不像 `Visual Studio .NET` 2002/2003\
  \ 那样位于 `C:\\Inetpub\\wwwroot\\`。默认情况下，您在 `C:\\Users\\JasonGaylord\\Documents\\Visual\
  \ Studio 2012\\WebSites`（或您创建的任何文件夹）内部构建并托管的任何站点都使用内置在 `Visual Studio 2012` 中的 `IIS\
  \ Express`。如果您使用 `Visual Studio 2012` 的内置 Web 服务器，您就不会被局限于 `WebSites` 文件夹。相反，您可以创建并使用任何您喜欢的文件夹。\n\
  \n![image](img/f054-01.jpg)\n\n**图 3-1**\n\n要更改此默认设置，您有一些选项。点击 `New Web Site` 对话框中的\
  \ `Browse` 按钮。打开 `Choose Location` 对话框，如图 3-2 所示。\n\n![image](img/f055-01.jpg)\n\
  \n**图 3-2**\n\n如果您继续使用 `Visual Studio 2012` 提供的内置 `IIS Express`，可以从此对话框为您的网站选择新位置。要选择新位置，请选择新文件夹并将\
  \ `.aspx` 页面及其他相关文件保存到该目录。使用 `Visual Studio 2012` 时，您可以完全从此位置运行您的应用程序。如果您无法访问 Web\
  \ 服务器，这种处理您创建的 `ASP.NET` 页面的方式是理想的，因为它允许您构建不位于具有完整版 `IIS` 机器上的应用程序。\n\n创建新网站后，您可以直接在\
  \ `Visual Studio` 属性面板中修改 `IIS Express` 设置。其示例见图 3-3。\n\n![image](img/f055-02.jpg)\n\
  \n**图 3-3**\n\n### 使用 IIS\n\n从 `Choose Location` 对话框（如图 3-4 所示），您还可以更改应用程序的保存位置以及您的应用程序采用的\
  \ Web 服务器类型。要使用 `IIS`，请在对话框中选择 `Local IIS`。这将更改文本区域以显示您机器上所有的虚拟根。\n\n![image](img/f056-01.jpg)\n\
  \n**图 3-4**\n\n要为您的应用程序创建新的虚拟根，请高亮 `Default Site`。对话框顶部会出现两个可用按钮（参见图 3-4）。从左到右看，对话框右上角的第一个按钮用于创建站点。这用于向\
  \ `IIS` 添加新站点。第二个按钮用于创建新应用程序或虚拟根。第三个按钮允许您创建虚拟目录。最后一个按钮是 `Delete` 按钮，允许您删除任何站点、虚拟目录或虚拟根。\n\
  \n创建虚拟目录后，点击 `Open` 按钮。`Visual Studio 2012` 然后将按照标准过程创建应用程序。现在，您的应用程序不再依赖 `IIS Express`，而是使用完整版的\
  \ `IIS`。当您调用应用程序时，URL 类似于 [`http://localhost/MyWeb/Default.aspx`](http://localhost/MyWeb/Default.aspx)，这意味着它正在使用\
  \ `IIS`。\n\n### 使用 FTP\n\n在使用 `Choose Location` 对话框创建应用程序时，您不仅可以决定 Web 服务器的类型，还可以决定应用程序存储的位置。在之前的选项中，您构建的应用程序位于本地服务器上。`FTP`\
  \ 选项允许您在应用程序位于企业其他地方的服务器甚至地球另一端的服务器上时，对其进行存储甚至编写代码。您还可以使用 `FTP` 功能在同一服务器的不同位置进行工作。使用此功能提供了广泛的选项。您可以在图\
  \ 3-5 中看到这一点。\n\n![image](img/f057-01.jpg)\n\n**图 3-5**\n\n要使用 `FTP` 在远程服务器上创建应用程序，只需提供服务器名称、使用的端口和目录以及任何所需的凭据。如果提供的信息正确，`Visual\
  \ Studio 2012` 将连接到远程服务器并创建启动应用程序所需的文件，就像在本地执行一样。\n\n\n\n\n\nASP.NET 提供了两种方式来组织\
  \ ASP.NET 页面的代码结构。第一种方式使用内联代码模型（code-inline）。经典 ASP 开发者对这种模型应该熟悉，因为所有代码都包含单个 `.aspx`\
  \ 页面中。第二种方式使用 ASP.NET 的代码后模型（code-behind），它允许将页面的业务逻辑与显示逻辑分离。在这种模型中，页面的显示逻辑存储在 `.aspx`\
  \ 页面中，而逻辑部分存储在单独的类文件中：`.aspx.vb` 或 `.aspx.cs`。使用代码后模型被认为是最佳实践，因为它在纯 UI 元素与操作这些元素的代码之间提供了清晰的分离。它也被认为是维护代码的更好手段。\n\
  \n## 内联编码\n\n在 .NET Framework 1.0/1.1 时代，开发者特意（并且在 Visual Studio .NET 之外）通过内联方式来构建他们的\
  \ ASP.NET 页面，以避免使用微软和其他极力推崇的代码后模型。Visual Studio 2012（以及 Web Visual Studio Express\
  \ 2012）允许你使用这种编码风格轻松地构建页面。要使用内联方式而非代码后模型来构建 ASP.NET 页面，只需在“添加新建项”对话框中选择页面类型，并确保没有勾选“代码放在单独文件中”（Place\
  \ Code in Separate File）复选框。你可以通过在解决方案管理器中右键点击项目或解决方案并选择“添加新建项”进入此对话框（参见图 3-6）。\n\
  \n![image](img/f058-01.jpg)\n\n**图 3-6**\n\n从这里你可以看到如果你想以内联方式构建 ASP.NET 页面需要取消选择的复选框。事实上，许多页面类型都具有内联和代码后样式的选项。表\
  \ 3-1 显示了当你从此对话框中选择文件时的内联选项。\n\n| 选项 | 创建的文件 |\n| --- | --- |\n| Web 表单 | `.aspx`\
  \ 文件 |\n| 主页 | `.master` 文件 |\n| Web 用户控件 | `.ascx` 文件 |\n| Web 服务 | `.asmx` 文件\
  \ |\n\n**表 3-1**\n\n通过使用 Web 表单选项并配合几个控件，你可以获得一个不仅封装了显示逻辑，还封装了业务逻辑的页面。这在列表 3-1 中进行了说明（本章代码下载中的\
  \ Listing03-01.aspx）。\n\n# 列表 3-1: 使用内联编码模型的简单页面\n\n***VB***\n\n```vb\n <%@ Page\
  \ Language=\"vb\" %>\n   <script runat=\"server\">\n       Protected Sub Button1_Click(sender\
  \ As Object, e As EventArgs)\n           Literal1.Text = \"Hello \" & TextBox1.Text\n\
  \       End Sub\n   </script>\n   <!DOCTYPE html>\n\n   <html xmlns=\"http://www.w3.org/1999/xhtml\"\
  >\n   <head runat=\"server\">\n       <title>Simple Page</title>\n   </head>\n \
  \  <body>\n       <form id=\"form1\" runat=\"server\">\n           <div>\n     \
  \          What is your name?<br />\n               <asp:TextBox ID=\"TextBox1\"\
  \ runat=\"server\"></asp:TextBox>\n               <asp:Button ID=\"Button1\" runat=\"\
  server\" Text=\"Submit\" \n                   OnClick=\"Button1_Click\" />\n   \
  \        </div>\n           <div>\n               <asp:Literal ID=\"Literal1\" runat=\"\
  server\" />\n           </div>\n       </form>\n   </body>\n   </html>\n```\n\n\
  ***C#***\n\n```csharp\n <%@ Page Language=\"C#\" %>\n   <script runat=\"server\"\
  >\n       protected void Button1_Click1(object sender, EventArgs e)\n       {\n\
  \           Literal1.Text = \"Hello \" + TextBox1.Text;\n       }\n   </script>\n\
  ```\n\n从这个示例中你可以看到所有的业务逻辑都封装在 `<script>` 标签之间。内联模型的优特性是业务逻辑和显示逻辑包含在同一个文件中。一些开发者发现，将所有内容都放在单个的可视图实例中会让处理\
  \ ASP.NET 页面变得更容易。另一个很棒的一点是，在使用内联编码模型和 ASP.NET 4.5 工作时，Visual Studio 2012 提供了智能感知（IntelliSense）。在\
  \ Visual Studio 2005 之前，这种功能并不。\n\n## 代码后模型\n\n构建 ASP.NET 4.5 页面的另一种选择是使用代码后模型构建文件。使用代码后模型的思想是将业务逻辑和显示逻辑分离到单独的文件。这样做让处理页面变得更容易，特别是当你处于团队环境中工作时，视觉设计人员负责页面的\
  \ UI，而编码人员负责显示部分背后的业务逻辑。\n\n要在你的 ASP.NET 解决方案中创建一个使用代码后模型的的新页面，从“新建文件”对话框中选择你需要的页面类型。要构建使用代码后模型的页面，首先在“添加新建项”对话框中选择页面，并确保勾选了“代码放在单独文件中”复选框。表\
  \ 3-2 显示了使用代码后模型的选项。\n\n| 选项 | 创建的文件 |\n| --- | --- |\n| Web 表单 | `.aspx` 文件 |\n\
  | 主页 | `.master` 文件 |\n| Web 用户控件 | `.ascx` 文件 |\n| Web 服务 | `.asmx` 文件 |\n\n**表\
  \ 3-2**\n\n在列表 3-1 中，你已经了如何使用内联样式创建页面。在列表 3-2 和 3-3 中，你看到了如何将内联模型转换为代码后模型。\n\n\n\
  \n\n\n使用此 ASP.NET 代码后（code-behind）模型的 `.aspx` 页面在 `Page` 指令中具有一些你在在此模式下工作时需要注意的属性。代码后模型工作所需的第一个属性是\
  \ `CodeBehind` 属性。`Page` 指令中的此属性指向与此显示页面配合的代码后页面。在这种情况下，分配的值为 `Listing03-02.aspx.vb`\
  \ 或 `Listing03-02.aspx.cs`。所需的第二个属性是 `Inherits` 属性。该属性在 ASP.NET 的早期版本中可用，但在 ASP.NET\
  \ 2.0 之前很少使用。此属性指定了页面编译时绑定到页面的 `class` 名称。ASP.NET 4.5 中的指令已经足够简单。请查看来自 列表 3-3 的代码后页面。\n\
  \n由于 `.NET` 4.5 提供的部分类（partial class）功能，代码后页的外非常简单。你可以看到在代码后文件中创建的 `class` 使用了部分类，在\
  \ Visual Basic 2012 中使用了 `Partial` 关键字，在 C# 2012 中使用了 `partial` 关键字。这允许你简单地将需要的方法放置在你的页面类中。在这种情况下，你有一个按钮点击事件，没有其他内容了。\n\
  \n在本章的后半部分，你将查看这两种模型的编译过程。\n\n## ASP.NET 4.5 PAGE DIRECTIVES\n\nASP.NET 指令是每个 ASP.NET\
  \ 页面的一部分。你可以通过使用这些指令来控制 ASP.NET 页面的行为。以下是 `Page` 指令的一个示例：\n\n```\n <%@ Page Language=\"\
  vb\" AutoEventWireup=\"false\" CodeBehind=\"Listing03-02.aspx.vb\" \n     Inherits=\"\
  ProfessionalASPNet45_03VB.Listing03_02\" %>\n```\n\n表 3-3 中所示 12 条指令可以在你的 ASP.NET\
  \ 页面或用户控件中使用。无论页面使用代码后模型还是内联编码模型，你都在应用程序中使用这些这些指令。\n\n基本上，这些指令是编译器在页面编译时使用的命令。指令很容易整合到你的页面中。指令按以下格式编写：\n\
  \n```\n <%@ [Directive] [Attribute=Value] %>\n```\n\n从此可以看出，指令以 `<@` 开头并以 `%>` 结束。将这些指令放在页面或控件的顶部是最好的，因为按照传统惯例，这是开发者期望看到它们的地方（尽管如果指令位于不同的位置，页面仍然可以编译）。当然，你也可以在指令语句中添加多个一个属性，如下所示：\n\
  \n```\n <%@ [Directive] [Attribute=Value] [Attribute=Value] %>\n```\n\n接下来的章节将对这些指令中的每一个进行简要回顾。其中某些指令仅在特定的页面类型中有效。\n\
  \n| DIRECTIVE | DESCRIPTION |\n| --- | --- |\n| `@Assembly` | 将程序集链接到与其相关的页面或用户控件。\
  \ |\n| `@Control` | 用于用户控件（`.ascx`）的页面指令。 |\n| `@Implements` | 实现指定的 `.NET` 框架接口。\
  \ |\n| `@Import` | 将指定的命名空间导入到页面或用户控件中。 |\n| `@Master` | 允许你在页面解析或编译时指定主页特有的属性和值。此指令只能与主页（`.master`）配合使用。\
  \ |\n| `@MasterType` | 将 `class name` 与页面关联，以获取指定主页中包含的强类型引用或成员。 |\n| `@OutputCache`\
  \ | 控制页面或用户控件的输出缓存策略。 |\n| `@Page` | 允许你在页面解析或编译时指定页面特有的属性和值。此指令只能与 ASP.NET 页面（`.aspx`）配合使用。\
  \ |\n| `@PreviousPageType` | 允许 ASP.NET 页面处理来自应用程序中另一个页面的回传。 |\n| `@Reference` |\
  \ 将页面或用户控件链接到当前页面或用户控件。 |\n| `@Register` | 为命名空间和类名关联别名，以便在自定义服务器控件语法中进行表示。 |\n\
  | `@WebHandler` | 允许页面作为 `HttpHandler` 使用。将在第 30 章中详细介绍。 |\n\n**表 3-3**\n\n### @Page\n\
  \n`@Page` 指令允许你为 ASP.NET 页面（`.aspx`）指定在页面解析或编译时使用的属性和值。这是表 3-3 中最常用的指令。因为 ASP.NET\
  \ 页面是 ASP.NET 中非常重要的一部分，所以该指令有许多属性。表 3-4 总结了通过 `@Page` 指令可用的属性。\n\n| ATTRIBUTE |\
  \ DESCRIPTION |\n| --- | --- |\n| `AspCompat` | 当给定值为 `True` 时，允许页面在单线程单元线程上执行。该属性的默认设置为\
  \ `False`。 |\n| `Async` | 指定 ASP.NET 页面是同步处理还是异步处理。 | |\n| `AsyncTimeout` | 指定等待异步任务完成的秒数。默认设置为\
  \ 45。 |\n| `AutoEventWireup` | 当设置为 `True` 时，指定是否自动绑定事件。该属性的默认设置为 `True`。 |\n| `Buffer`\
  \ | 当设置为 `True` 时启用响应缓冲。该属性的默认设置为 `True`。 |\n| `ClassName` | 指定页面编译时绑定到页面的 `class`\
  \ 名称。 |\n| `ClientIDMode` | 指定页面在生成服务器控件的 `ClientID` 值时使用的算法。默认值为 `Auto`（在 ASP.NET\
  \ 4 之前使用的模式）。 |\n| `ClientTarget` | 指定控件应渲染内容的目标用户代理。此属性需要与 `web.config` 文件中的 `<clientTarget>`\
  \ 部分绑定。 |\n| `CodeBehind` | 引用与页面相关的编译代码后文件。此属性用于 Web 项目。 |\n| `CodeFile` | 引用与页面相关的代码后文件。此属性用于网站项目。\
  \ |\n| `CodeFileBase` | 指定与 `CodeFile` 使用的基类类型名称。 |\n| `CodePage` | 指明响应的代码页值。 |\n\
  | `CompilationMode` | 指定 ASP.NET 是否应该编译页面。可用选项包括 `Always`（默认值）、`Auto` 或 `Never`。设置为\
  \ `Auto` 意味着如果可能 ASP.NET 将不编译页面。 |\n| `CompilerOptions` | 指明页面编译选项的字符串。 |\n| `ContentType`\
  \ | 定义响应的 HTTP 内容类型为标准 MIME 类型。 |\n| `Culture` | 指定页面的文化设置。ASP.NET 3.5 及更高版本包含了将\
  \ `Culture` 属性的值赋予 `Auto` 的功能，以自动检测所需的文化。 |\n| `Debug` | 当设置为 `True` 时带调试符号编译页面。\
  \ |\n| `Description` | 提供页面的文本描述。ASP.NET 解析器忽略此属性及其分配的值。 |\n| `EnableEventValidation`\
  \ | 指定是否启用回传和回调场景下的事件验证。默认设置为 `True` 意味着事件将通过验证。 |\n| `EnableSessionState` | 当设置为\
  \ `True` 时启用页面的会话状态。默认设置为 `True`。 |\n| `EnableTheming` | 当设置为 `True` 时启用页面使用主题。该属性的默认设置为\
  \ `True`。 |\n| `EnableViewState` | 当设置为 `True` 时跨页面维护 ViewState。默认值为 `True`。 |\n\
  \n\n\n\n\n| 属性 | 说明 |\n| :--- | :--- |\n| `EnableViewStateMac` | 当设置为 `True` 时，页面从用户处回传（post\
  \ back）时会对页面的 ViewState 执行机器身份验证。默认值为 `False`。 |\n| `ErrorPage` | 指定用于提交所有未处理页面异常的\
  \ URL。 |\n| `Explicit` | 当设置为 `True` 时，启用 Visual Basic 的 `Explicit`（强制）选项。默认设置为\
  \ `False`。 |\n| `Language` | 定义任何内联渲染和脚本块使用的语言。 |\n| `LCID` | 定义 Web 表单的本地语言标识符。\
  \ |\n| `LinePragmas` | `Boolean` 值，指定在生成的程序集中是否使用行处理指令（line pragmas）。 |\n| `MasterPageFile`\
  \ | 接收一个 `String` 值，指向与页面一起使用的主页位置。此属性用于内容页。 |\n| `MaintainScrollPositionOnPostback`\
  \ | 接收一个 `Boolean` 值，指示当页面回传到自身时，页面应该保持在完全相同的滚动位置，还是在顶部位置重新生成。 |\n| `MetaDescription`\
  \ | 允许在 Meta 标签中指定页面描述以用于 SEO 目的。 |\n| `MetaKeywords` | 允许在 Meta 标签中指定页面关键词以用于 SEO\
  \ 目的。 |\n| `ResponseEncoding` | 指定页面内容的响应编码。 |\n| `SmartNavigation` | 指定是否激活针对更丰富浏览器的\
  \ ASP.NET 智能导航功能。这会将回传带到页面的当前位置。默认值为 `False`。从 ASP.NET 2.0 开始，`SmartNavigation`\
  \ 已弃用。请用 `SetFocus()` 方法和 `MaintainScrollPositionOnPostback` 属性代替。 |\n| `Src` |\
  \ 指向用于渲染页面后置代码（code-behind）的类源文件。 |\n| `Strict` | 当设置为 `True` 时，使用 Visual Basic\
  \ `Strict` 模式编译页面。默认设置为 `False`。 |\n| `StylesheetTheme` | 使用 ASP.NET 主题功能将指定的主应用于页面。`StylesheetTheme`\
  \ 和 `Theme` 属性的区别在于，`StylesheetTheme` 不覆盖控件中已有的样式设置，而 `Theme` 则会移除这些设置。 |\n| `Theme`\
  \ | 使用 ASP.NET 主题功能将指定的主应用于页面。 |\n| `Title` | 应用页面标题。这是一个主要用于内容页的属性，这些页必须应用不同于主页中所指定的页面标题。\
  \ |\n| `Trace` | 当设置为 `True` 时启用页面跟踪。默认设置为 `False`。 |\n| `TraceMode` | 指定启用跟踪时跟踪消息的显示方式。此属性的设置包括\
  \ `SortByTime` 或 `SortByCategory`。默认设置为 `SortByTime`。 |\n| `Transaction` | 指定页面是否支持事务。此属性的设置为\
  \ `Disabled, NotSupported, Supported, Required` 和 `RequiresNew`。默认设置为 `Disabled`。\
  \ |\n| `UICulture` | `UICulture` 属性的值指定了 ASP.NET 页面使用的 UI 语言。ASP.NET 3.5 及更高版本包含了将\
  \ `UICulture` 属性赋值为 `Auto` 的功能，以便自动检测 `UICulture`。 |\n| `ValidateRequest` | 当此属性设置为\
  \ `True` 时，将根据潜在危险值列表检查表单输入值。这有助于保护您的 Web 应用程序免受 JavaScript 攻击等有害攻击。默认值为 `True`。\
  \ |\n| `ViewStateEncryptionMode` | 指定页面上 ViewState 的加密方式。选项包括 `Auto, Always` 和 `Never`。默认值为\
  \ `Auto`。 |\n| `ViewStateMode` | 决定是否为页面上的控件维护 ViewState。 |\n| `WarningLevel` |\
  \ 指定停止编译页面的警告级别。可能的值为 `0` 到 `4`。 |\n\n**表格 3-4**\n\n以下是使用 `@Page` 指令的示例：\n\n```\n\
  \ <%@ Page Language=\"C#\" AutoEventWireup=\"true\" CodeBehind=\"Listing03-02.aspx.cs\"\
  \ \n     Inherits=\"ProfessionalASPNet45_03CS.Listing03_02\" %>\n```\n\n### @Master\n\
  \n`@Master` 指令与 `@Page` 指令非常相似，但 `@Master` 指令用于主页（`.master`）。在使用 `@Master` 指令时，您指定了模板页的属性，这些属性将与站点上的任意数量的内容页配合使用。任何使用\
  \ `@Page` 指令构建的内容页都可以从主页继承所有的主内容（在主页中使用 `@Master` 指令定义）。尽管它们有相似之处，但 `@Master` 指令可用的属性比\
  \ `@Page` 指令的要少。`@Master` 指令的可用属性见表 3-5。\n\n| 属性 | 描述 |\n| --- | --- |\n| `AutoEventWireup`\
  \ | 当设置为 `True` 时，指定主页事件是否自动绑定（autowired）。默认设置为 `True`。 |\n| `ClassName` | 指定编译时绑定到主页的类名。\
  \ |\n| `CodeBehind` | 引用与主页关联的编译后置代码文件。 |\n| `CodeFile` | 引用与主页关联的代码文件。 |\n| `CompilationMode`\
  \ | 指定 ASP.NET 是否编译页面。可用选项包括 `Always`（默认）、`Auto` 或 `Never`。设置为 `Auto` 意味着在可能的情况下\
  \ ASP.NET 将不编译页面。 |\n| `CompilerOptions` | 指示主页编译选项的字符串。 |\n| `Debug` | 当设置为 `True`\
  \ 时，带调试符号编译主页。 |\n| `Description` | 提供主页的文本描述。ASP.NET 解析器忽略此属性及其赋值值。 |\n| `EnableTheming`\
  \ | 当设置为 `True` 时，指示主页启用主题功能。此属性的默认设置为 `True`。 |\n| `EnableViewState` | 当设置为 `True`\
  \ 时维护主页的 ViewState。默认值为 `True`。 |\n| `Explicit` | 当设置为 `True` 时，启用 Visual Basic\
  \ `Explicit` 选项。默认设置为 `False`。 |\n| `Inherits` | 指定主页继承的 `CodeBehind` 类。 |\n| `Language`\
  \ | 定义任何内联渲染和脚本块使用的语言。 |\n| `LinePragmas` | `Boolean` 值，指定在生成的程序集中是否使用行处理指令。 |\n\
  | `MasterPageFile` | 接收一个 `String` 值，指向主页使用的主页位置。主页可以使用另一个主页，从而创建嵌套主页。 |\n| `Src`\
  \ | 指向用于渲染渲染的主页后置代码的类源文件。 |\n| `Strict` | 当设置为 `True` 时，使用 Visual Basic `Strict`\
  \ 模式编译主页。默认设置为 `False`。 |\n| `WarningLevel` | 指定停止编译页面的警告级别。可能的值为 `0` 到 `4`。 |\n\
  \n\n\n\n\n`@Control` 指令与 `@Page` 指令类似，不同在于你在构建 ASP.NET 用户控件时使用它。`@Control` 指令允许你定义被用户控件继承的属性。这些值会在页面解析和编译时分配给用户控件。可用属性少于\
  \ `@Page` 指令，但它们允许你在构建用户控件时进行所需的修改。查表 3-6 详细列出了可用属性。\n\n| 属性 | 描述 |\n| --- | ---\
  \ |\n| `AutoEventWireup` | 设置为 `True` 时，指定是否自动绑定用户控件的事件。默认设置为 `True`。 |\n| `ClassName`\
  \ | 指定在页面编译时绑定到用户控件的类名。 |\n| `ClientIDMode` | 指定页面在为页面上的服务器控件生成 ClientID 值时应使用的算法。默认值是\
  \ `AutoID`（ASP.NET 4 之前 ASP.NET 页面使用的模式）。 |\n| `CodeBehind` | 引用与主页关联的编译后代码文件。在\
  \ ASP.NET 2.0 或更早版本中，应配合 `Inherits` 使用 `CodeFile`。 |\n| `CodeFile` | 引用与用户控件关联的代码文件。\
  \ |\n| `CodeFileBaseClass` | 指定与代码后类使用的基类类型名称，该类由 `CodeFile` 属性使用。 |\n| `CompilationMode`\
  \ | 指定是否编译控件。 |\n| `CompilerOptions` | 指示用户控件编译选项的编译器字符串。 |\n| `Debug` | 设置为 `True`\
  \ 时，带有调试符号编译用户控件。 |\n| `Description` | 提供用户控件的文本描述。ASP.NET 解析器会忽略此属性及其分配的值。 |\n\
  | `EnableTheming` | 设置为 `True` 时，启用用户控件使用主题功能。此属性的默认设置为 `True`。 |\n| `EnableViewState`\
  \ | 设置为 `True` 时，为用户控件维护 ViewState。默认值是 `True`。 |\n| `Explicit` | 设置为 `True` 时启用\
  \ Visual Basic 的 `Explicit` 选项。默认设置为 `False`。 |\n| `Inherits` | 指定用户控件继承的 `CodeBehind`\
  \ 类。 |\n| `Language` | 定义用于任何内联渲染和脚本的语言。 |\n| `LinePragmas` | `Boolean` 值，指定是否在生成的程序集中使用行指令（line\
  \ pragmas）。 |\n| `Src` | 指向用于渲染的用户控件代码后类的类源文件。 |\n| `Strict` | 设置为 `True` 时，使用 Visual\
  \ Basic 的 `Strict` 模式编译用户控件。默认设置为 `False`。 |\n| `WarningLevel` | 指定停止编译用户控件的编译器警告级别。可能的值从\
  \ `0` 到 `4`。 |\n\n### 表 3-6\n\n`@Control` 指令旨在用于 ASP.NET 用户控件。以下是使用该指令的示例：\n\n```\n\
  \ <%@ Control Language=\"C#\" AutoEventWireup=\"true\" \n     CodeBehind=\"RegistrationUserControl.ascx.cs\"\
  \ \n     Inherits=\"ProfessionalASPNet45_03CS.RegistrationUserControl\" %\n```\n\
  \n### @Import\n\n`@Import` 指令允许你指定一个要导入到 ASP.NET 页面或用户控件的命名空间。通过导入，该命名空间的所有类和接口都对页面或用户控件可用。此指令仅支持一个属性：`Namespace`。\n\
  \n`Namespace` 属性接收一个 `String` 值，指定要导入的命名空间。`@Import` 指令不能包含多一个属性/值对。因此，你必须像下面的示例所示在多行中放置多个命名空间导入：\n\
  \n```\n <%@ Import Namespace=\"System.Data\" %>\n   <%@ Import Namespace=\"System.Data.SqlClient\"\
  \ %>\n```\n\n你的应用程序已经引用了几个程序集。你可以通过查看 `C:\\Windows\\Microsoft.NET\\Framework\\v4.0.*xxxxx*\\\
  Config` 下的根 `web.config` 文件找到这些已导入命名空间的列表。你可以从 `<compilation>` 元素的 `<assemblies>`\
  \ 子元素找到这些被引用的程序集列表。根 `web.config` 文件中的设置如下：\n\n```\n <assemblies>\n       <add assembly=\"\
  Microsoft.VisualStudio.Web.PageInspector.Loader, \n         Version=1.0.0.0, Culture=neutral,\
  \ PublicKeyToken=b03f5f7f11d50a3a\" />\n       <add assembly=\"mscorlib\" />\n \
  \      <add assembly=\"Microsoft.CSharp, Version=4.0.0.0, Culture=neutral, \n  \
  \       PublicKeyToken=b03f5f7f11d50a3a\" />\n       <add assembly=\"System, Version=4.0.0.0,\
  \ Culture=neutral, \n         PublicKeyToken=b77a5c561934e089\" />\n       <add\
  \ assembly=\"System.Configuration, Version=4.0.0.0, Culture=neutral, \n        \
  \ PublicKeyToken=b03f5f7f11d50a3a\" />\n       <add assembly=\"System.Web, Version=4.0.0.0,\
  \ Culture=neutral, \n         PublicKeyToken=b03f5f7f11d50a3a\" />\n       <add\
  \ assembly=\"System.Data, Version=4.0.0.0, Culture=neutral, \n         PublicKeyToken=b03f5f7f11d50a3a\"\
  \ />\n       <add assembly=\",.Data, Version=4.0.0.0, Culture=neutral, \n      \
  \   PublicKeyToken=b03f5f7f11d50a3a\" />\n       ... (省略)\n```\n\n\n\n\n由于根目录 `web.config`\
  \ 文件中的这些引用，这些程序集不需要在 `References` 文件夹中引用，就像你在 ASP.NET 1.0/1.1 中执行的那样。你实际上可以添加或删除列表中引用的程序集。例如，如果你有一个被服务器上每个应用程序持续引用的自定义程序集，你只需在其他程序集旁边添加一个类似的自定义程序集引用即可。你也可以通过应用程序特定的\
  \ `web.config` 文件来执行相同的任务。\n\n尽管可能引用了程序集，你仍必须将这些程序集的命名空间导入到你的页面中。同一个根 `web.config`\
  \ 文件包含一个自动导入到应用程序中每个页面的命名空间列表。这是通过 `<pages>` 元素的 `<namespaces>` 子元素来指定的。\n\n```\n\
  \ <namespaces>\n       <add namespace=\"System\" />\n       <add namespace=\"System.Collections\"\
  \ />\n       <add namespace=\"System.Collections.Generic\" />\n       <add namespace=\"\
  System.Collections.Specialized\" />\n       <add namespace=\"System.ComponentModel.DataAnnotations\"\
  \ />\n       <add namespace=\"System.Configuration\" />\n       <add namespace=\"\
  System.Linq\" />\n       <add namespace=\"System.Text\" />\n       <add namespace=\"\
  System.Text.RegularExpressions\" />\n       <add namespace=\"System.Web\" />\n \
  \      <add namespace=\"System.Web.Caching\" />\n       <add namespace=\"System.Web.DynamicData\"\
  \ />\n       <add namespace=\"System.Web.SessionState\" />\n       <add namespace=\"\
  System.Web.Security\" />\n       <add namespace=\"System.Web.Profile\" />\n    \
  \   <add namespace=\"System.Web.UI\" />\n       <add namespace=\"System.Web.UI.WebControls\"\
  \ />\n       <add namespace=\"System.Web.UI.WebControls.WebParts\" />\n       <add\
  \ namespace=\"System.Web.UI.HtmlControls\" />\n       <add namespace=\"System.Xml.Linq\"\
  \ />\n   </namespaces>\n```\n\n从这个 XML 列表中，你可以看到有很多命名空间被导入到你的每一个 ASP.NET 页面中。同样，你可以随时在根\
  \ `web.config` 文件中修改此选择，甚至在你的应用程序的 `web.config` 文件中进行类似的命名空间选择。\n\n例如，你可以在应用程序的\
  \ `web.config` 文件中导入自己的命名空间，以便该命名空间在利用它的每个页面上可用。\n\n```\n <?xml version=\"1.0\"\
  ?>\n   <configuration>\n       <system.web>\n           <compilation debug=\"true\"\
  \ targetFramework=\"4.5\" />\n           <httpRuntime targetFramework=\"4.5\" />\n\
  \           <pages>\n               <namespaces>\n                   <add namespace=\"\
  Widgets\" />\n               </namespaces>\n           </pages>\n       </system.web>\n\
  \   </configuration>\n```\n\n记住，将命名空间导入到你的 ASP.NET 页面或用户控件中让你有机会在不完全标识类名的情况下使用这些类。例如，通过向\
  \ ASP.NET 页面导入 `System.IO` 命名空间，你可以通过单数类名来引用此命名空间内的类（使用 `Directory` 而不是 `System.IO.Directory`）。\n\
  \n### @Implements\n\n`@Implements` 指令让 ASP.NET 页面实现指定的 .NET Framework 接口。此指令仅支持一个属性：`Interface`。\n\
  \n`Interface` 属性直接指定 .NET Framework 接口。当 ASP.NET 页面或用户控件实现接口时，它可以直接访问该接口的所有事件、方法和属性。\n\
  \n这里是 `@Implements` 指令的示例：\n\n```\n <%@ Implements Interface=\"System.Web.UI.IValidator\"\
  \ %>\n```\n\n### @Register\n\n`@Register` 指令将别名与命名空间和类名关联，以便在自定义服务器控件语法中表示。当你将用户控件拖放到任何一个\
  \ `.aspx` 页面上时，你就可以看到 `@Register` 指令的使用。将用户控件拖动到 `.aspx` 页面会导致 Visual Studio 2012\
  \ 在页面顶部创建一个 `@Register` 指令。这在页面上注册了你的用户控件，以便该控件随后可以通过特定名称在 `.aspx` 页面上进行访问。\n\n\
  `@Register` 指令支持五个属性，如表 3-7 所示。\n\n| 属性 | 描述 |\n| --- | --- |\n| `Assembly` | 你正在与\
  \ `TagPrefix` 关联的程序集 |\n| `Namespace` | 与 `TagPrefix` 关联的命名空间 |\n| `Src` | 用户控件的位置\
  \ |\n| `TagName` | 与类名关联的别名 |\n| `TagPrefix` | 与命名空间关联的别名 |\n\n**表 3-7**\n\n这里是如何使用\
  \ `@Register` 指令将用户控件导入 ASP.NET 页面的示例：\n\n```\n <%@ Register TagPrefix=\"MyTag\"\
  \ Namespace=\"MyNamespace\"\n     Assembly=\"MyAssembly\" %>\n```\n\n### @Assembly\n\
  \n`@Assembly` 指令在编译时将程序集（.NET 应用程序的构建块）附加到 ASP.NET 页面或用户控件上，从而使该程序集的所有类和接口对页面可用。此指令支持两个属性，如表\
  \ 3-8 所示。\n\n| 属性 | 描述 |\n| --- | --- |\n| `Name` | 允许你指定用于附加到页面文件的程序集名称。程序集的名称应包含文件名但不包含扩展名。例如，如果文件是\
  \ `MyAssembly.dll`，则 `Name` 属性的值应为 `MyAssembly`。\n| `Src` | 允许你指定用于编译的程序集源 |\n\n\
  **表 3-8**\n\n以下是使用 `@Assembly` 指令的一些示例：\n\n```\n <%@ Assembly Name=\"MyAssembly\"\
  \ %>\n   <%@ Assembly Src=\"MyAssembly.vb\" %>\n```\n\n### @PreviousPageType\n\n\
  此指令用于指定提交源的页面。跨页面提交将在后文“跨页面提交”章节中解释。\n\n`@PreviousPageType` 与 ASP.NET 提供的跨页面提交功能配合。此指令包含两个属性，如表\
  \ 3-9 所示。\n\n| 属性 | 描述 |\n| --- | --- |\n| `TypeName` | 设置产生提交的派生类名称 |\n| `VirtualPath`\
  \ | 设置提交源页面的位置 |\n\n**表 3-9**\n\n### @MasterType\n\n`@MasterType` 指令将类名与 ASP.NET\
  \ 页面关联，以便获取主页面中的强类型引用。此指令支持两个属性，如表 3-10 所示。\n\n| 属性 | 描述 |\n| --- | --- |\n| `TypeName`\
  \ | 设置获取强类型引用的派生类名称 |\n| `VirtualPath` | 设置获取这些强类型引用的页面位置 |\n\n**表 3-10**\n\n使用\
  \ `@MasterType` 指令的详情请参见第 16 章。这是一个用法示例：\n\n```\n <%@ MasterType VirtualPath=\"\
  ~/Wrox.master\" %>\n```\n\n### @OutputCache\n\n`@OutputCache` 指令控制 ASP.NET 页面或用户控件的输出缓存策略。此指令支持表\
  \ 3-11 所示的属性。\n\n| 属性 | 描述 |\n| --- | --- |\n| `CacheProfile` | 允许集中管理应用程序的缓存配置。使用该属性指定\
  \ `web.config` 文件中详细列出的配置名称。 |\n| `Duration` | ASP.NET 页面或用户控件缓存的时间（秒）。 |\n| `Location`\
  \ | 位置枚举值。默认值为 `Any`。这仅适用于 `.aspx` 页面，不适用于用户控件（`.ascx`）。其他可能的值包括 `Client, Downstream,\
  \ None, Server` 和 `ServerAndClient`。 |\n\n```\n\n\n\n\n| `NoStore` | 指定是否向页面发送 no-store\
  \ 标头。 |\n| `Shared` | 指定用户控件的输出是否可以在多个页面之间共享。此属性接收一个 `Boolean` 值，默认设置值为 `False`。\
  \ |\n| `SqlDependency` | 允许特定页面使用 SQL Server 缓存失效机制。 |\n| `VaryByContentEncodings`\
  \ | 用分号分隔的字符串列表，用于根据内容编码更改输出缓存。 |\n| `VaryByControl` | 用分号分隔的字符串列表，用于更改用户控件的输出缓存。\
  \ |\n| `VaryByCustom` | 指定自定义输出缓存要求的字符串。 |\n| `VaryByHeader` | 用分号分隔的 HTTP 标头列表，用于更改输出缓存。\
  \ |\n| `VaryByParam` | 用分号分隔的字符串列表，用于更改输出缓存。 |\n\n表 3-11\n\n以下是使用 `@OutputCache`\
  \ 指令的示例：\n\n```\n <%@ OutputCache Duration=\"180\" VaryByParam=\"None\" %>\n```\n\
  \n请记住，`Duration` 属性指定页面存储在系统缓存中的时间（单位为秒）。\n\n### @Reference\n\n`@Reference` 指令声明另一个\
  \ ASP.NET 页面或用户控件应与活动页面或控件一起编译。该指令包含一个属性，即 `VirtualPath` 属性。`VirtualPath` 包含活动页面将引用页面或用户控件的位置。\n\
  \n以下是使用 `@Reference` 指令的示例：\n\n```\n <%@ Reference VirtualPath=\"~/MyControl.ascx\"\
  \ %>\n```\n\n## ASP.NET 页面事件\n\nASP.NET 开发人员在他们的服务器端代码中经常处理各种事件。他们处理的许多事件与特定的服务器控件有关。例如，如果您想在最终用户点击\
  \  上的按钮时启动某些操作，您可以在服务器端代码中创建一个按钮点击事件，如 列表 3-4 所示（本章代码下载中的 Listing03-04.aspx.cs）。\n\
  \n列表 3-4: 在 C# 中显示的按钮点击事件示例\n\n```\n protected void VerifyDataButton_Click(object\
  \ sender, EventArgs e)\n   {\n       // Verify Data\n   }\n```\n\n除了服务器控件外，开发人员还希望在\
  \ ASP.NET 页面创建或销毁的特定时刻启动操作。ASP.NET 页面本身一直为这些实例提供了许多事件。自  ASP.NET 诞生以来，可以使用以下页面事件：\n\
  \n* `AbortTransaction`\n* `CommitTransaction`\n* `DataBinding`\n* `Disposed`\n*\
  \ `Error`\n* `Init`\n* `Load`\n* `PreRender`\n* `Unload`\n\n此列表中最流行的页面事件之一是 `Load`\
  \ 事件，它在 C# 中的用法如 列表 3-5 所示（本章代码下载中的 Listing03-05.aspx.cs）。\n\n### 列表 3-5: 使用 Page_Load\
  \ 事件\n\n```\n protected void Page_Load(object sender, EventArgs e)\n   {\n     \
  \  Response.Write(\"This is the Page_Load event\");\n   }\n```\n\n除了上面显示的页面事件外，ASP.NET\
  \ 4.5 还有以下事件：\n\n* `InitComplete`: 表示页面初始化完成\n* `LoadComplete`: 表示页面已完全加载到内存中\n\
  * `PreInit`: 表示页面初始化之前的瞬间\n* `PreLoad`: 表示页面加载到内存之前的瞬间\n* `PreRenderComplete`: 表示页面在浏览器中渲染之前的瞬间\n\
  \n使用这些事件中的任何一个（例如 `PreInit` 事件）的示例如 列表 3-6 所示（本章代码下载中的 Listing03-06.aspx.vb 和 Listing03-06.aspx.cs）。\n\
  \n### 列表 3-6: 使用页面事件\n\nVB\n\n```\n Private Sub Page_PreInit(sender As Object, e\
  \ As EventArgs) Handles Me.PreInit\n       Page.Theme = Request.QueryString(\"ThemeChange\"\
  )\n   End Sub\n```\n\nC#\n\n```\n protected void Page_PreInit(object sender, EventArgs\
  \ e)\n   {\n       Page.Theme = Request.QueryString[\"ThemeChange\"];\n   }\n```\n\
  \n如果您创建一个 ASP.NET 4.5 页面并开启跟踪（tracing），您可以查看主页面事件启动的顺序。它们的触发顺序如 图 3-7 所示。\n\n![image](img/f073-01.jpg)\n\
  \n图 3-7\n\n有了这些选项，您现在可以在页面编译过程的许多点处理页面以及页面上的控件。您可以在全书的代码示例看到这些有用的页面事件。\n\n## 处理回传（Postbacks）\n\
  \n当您处理 ASP.NET 页面时，请确保理解上述列出的页面事件。它们很重要，因为您将许多页面行为放在页面生命周期中特定点的这些事件中。\n\n在 Active\
  \ Server Pages 3.0 中，开发人员可以让其页面提交到应用程序内的其他页面。ASP.NET 页面通常回传到自身以处理事件（例如按钮点击事件）。\n\
  \n出于这个原因，您必须区分最终用户加载页面的首次提交和回传（postbacks）。回传仅仅如其名——回传到同一个页面。回传包含了初始页面上收集的所有表单信息，以便在需要时进行处理。\n\
  \n由于 ASP.NET 页面可能会发生所有回传，您需要知道请求是特定页面的首次实例还是来自同一页面的回传。您可以通过使用 `Page` 类的 `IsPostBack`\
  \ 属性进行此检查，如下例所示：\n\nVB\n\n```\n If Not Page.IsPostBack Then\n       ' Do processing\n\
  \   End If\n```\n\nC#\n\n```\n if (!Page.IsPostBack) {\n       // Do processing\n\
  \   }\n```\n\n## 跨页面提交（Cross-Page Posting）\n\nASP 3.0 中一个在 ASP.NET 早期难以实现的常用功能是跨页面提交的能力。跨页面提交允许您提交一个表单（例如\
  \ `Page1.aspx`），并让表单和所有控件值提交到另一个页面（`Page2.aspx`）。\n\n传统上，在 ASP.NET 1.0/1.1 中创建的任何页面只需提交到自身，并在在该页面实例中处理控件值。您可以像本章前面所示，通过使用\
  \ `Page.IsPostBack` 属性区分页面的首次请求和任何回传。\n\n即使具有此功能，许多开发人员仍然希望能够提交到另一个页面并在该页面处理第一个页面的控件值。这在\
  \ ASP.NET 4.5 中是可以可能的，而且是一个非常简单的过程。\n\n例如，创建一个名为 `Page1.aspx` 的页面，包含一个简单的表单。列表 3-7\
  \ 显示了该页面；您可以在列表 03-07（本章代码下载中的 Page 1.aspx）中找到此列表的代码。\n\n列表 3-7: Page1.aspx\n\n\
  VB\n\n\n\n\n\n```vb\n <%@ Page Language=\"vb\" %>\n   <!DOCTYPE html>\n   <script\
  \ runat=\"server\">\n       Protected Sub Button1_Click(sender As Object,\n    \
  \       e As System.EventArgs)\n           Label1.Text = \"Hello \" & TextBox1.Text\
  \ & \"<br />\" &\n               \"Date Selected: \" & Calendar1.SelectedDate.ToShortDateString()\n\
  \       End Sub\n   </script>\n   <html xmlns=\"http://www.w3.org/1999/xhtml\">\n\
  \   <head runat=\"server\">\n       <title>First Page</title>\n   </head>\n   <body\n\
  \       <form id=\"form1\" runat=\"server\">\n           Enter your name:<br />\n\
  \           <asp:Textbox ID=\"TextBox1\" Runat=\"server\"></asp:Textbox>\n     \
  \      <p>\n               When do you want to fly?<br />\n               <asp:Calendar\
  \ ID=\"Calendar1\" Runat=\"server\"></asp:Calendar>\n           </p>\n         \
  \  <br />\n           <asp:Button ID=\"Button1\" Runat=\"server\" Text=\"Submit\
  \ page to itself\"\n               OnClick=\"Button1_Click\" />\n           <asp:Button\
  \ ID=\"Button2\" Runat=\"server\" Text=\"Submit page to Page2.aspx\"\n         \
  \      PostBackUrl=\"Page2.aspx\" />\n           <p>\n               <asp:Label\
  \ ID=\"Label1\" Runat=\"server\"></asp:Label>\n           </p>\n       </form>\n\
  \   </body>\n   </</html>\n```\n\n### C#\n\n```csharp\n <%@ Page Language=\"C#\"\
  \ %>\n   <!DOCTYPE html>\n   <script runat=\"server\">\n       protected void Button1_Click(Object\
  \ sender, EventArgs e)\n       {\n           Label1.Text = \"Hello \" + TextBox1.Text\
  \ + \"<br />\" +\n               \"Date Selected: \" + Calendar1.SelectedDate.ToShortDateString();\
  \   \n       }\n   </script>\n```\n\n来自 `Page1.aspx` 的代码如列表 3-7 所示，非常有趣。页面上显示了两个按钮。两个按钮都会提交表单，但每个按钮将表单提交到不同的位置。第一个按钮将表单提交到自身。这是\
  \ ASP.NET 1.0/1.1 的默认行为。事实上，`Button1` 没有什么不同。由于在按钮控件中使用了 `OnClick` 属性，它会回传（postback）到\
  \ `Page1.aspx`。`Page1.aspx` 上的 `Button1_Click` 方法处理页面上服务器控件包含的值。\n\n第二个按钮 `Button2`\
  \ 的工作方式完全不同。这个按钮没有包含第一个按钮那样的 `OnClick` 方法。相反，它使用了 `PostBackUrl` 属性。该属性接收一个字符串值，指向该页面应该提交的文件位置。在这种情况下，它是\
  \ `Page2.aspx`。这意味着 `Page2.aspx` 现在接收了回传以及 `Page1.aspx` 控件中包含的所有值。查看 `Page2.aspx`\
  \ 的代码，如列表 3-8 所示（对应本章代码下载中的 `Listing03-08 (Page 2).aspx`）。\n\n# 列表 3-8: Page2.aspx\n\
  \n### VB\n\n```vb\n <%@ Page Language=\"vb\" %>\n   <script runat=\"server\">\n\
  \       Protected Sub Page_Load(ByVal sender As Object, ByVal e As System.EventArgs)\n\
  \           Dim pp_Textbox1 As TextBox\n           Dim pp_Calendar1 As Calendar\n\
  \           pp_Textbox1 = CType(PreviousPage.FindControl(\"Textbox1\"), TextBox)\n\
  \           pp_Calendar1 = CType(PreviousPage.FindControl(\"Calendar1\"), Calendar)\n\
  \           Label1.Text = \"Hello \" & pp_Textbox1.Text & \"<br />\" &\n       \
  \        \"Date Selected: \" & pp_Calendar1.SelectedDate.ToShortDateString()\n \
  \      End Sub\n   </script>\n   <!DOCTYPE html>\n\n   <html xmlns=\"http://www.w3.org/1999/xhtml\"\
  >\n   <head runat=\"server\">\n       <title>Second Page</title>\n   </head>\n \
  \  <body>\n       <form id=\"form1\" runat=\"server\">\n           <asp:Label ID=\"\
  Label1\" Runat=\"server\"></asp:Label>\n       </form>\n   </body>\n   </html>\n\
  ```\n\n### C#\n\n```csharp\n <%@ Page Language=\"C#\" %>\n   <script runat=\"server\"\
  >\n       protected void Page_Load(Object sender, EventArgs e)\n       {\n     \
  \      TextBox pp_TextBox1;\n           Calendar pp_Calendar1;\n           pp_TextBox1\
  \ = (TextBox)PreviousPage.FindControl(\"TextBox1\");\n           pp_Calendar1 =\
  \ (Calendar)PreviousPage.FindControl(\"Calendar1\");\n           Label1.Text = \"\
  Hello \" + pp_TextBox1.Text + \"<br />\" +\n               \"Date Selected: \" +\
  \ pp_Calendar1.SelectedDate.ToShortDateString();           \n       }\n   </script>\n\
  ```\n\n你有几种方法从第二个页面获取从 `Page1.aspx` 暴露的控件值。第一种方法显示在列表 3-8 中。第一种方法是在 `PreviousPage`\
  \ 属性上使用 `FindControl` 方法。第二种方法是将 `PreviousPage` 属性强类型为源页面。这允许你像访问成员一样直接访问控件。\n\n\
  # 列表 3-9: 暴露控件的值\n\n### VB\n\n```vb\n <%@ Page Language=\"vb\" %>\n   <script runat=\"\
  server\">\n       Public ReadOnly Property pp_Textbox1() As TextBox\n          \
  \ Get\n               Return CType(PreviousPage.FindControl(\"Textbox1\"), TextBox)\n\
  \           End Get\n       End Property\n       Public ReadOnly Property pp_Calendar1()\
  \ As Calendar\n           Get\n               Return CType(PreviousPage.FindControl(\"\
  Calendar1\"), Calendar)\n           End Get\n       End Property\n   </script>\n\
  ```\n\n### C#\n\n```csharp\n <%@ Page Language=\"C#\" %>\n   <script runat=\"server\"\
  >\n       public TextBox pp_TextBox1 { get { return (TextBox)PreviousPage.FindControl(\"\
  TextBox1\"); } }\n       public Calendar pp_Calendar1 { get { return (Calendar)PreviousPage.FindControl(\"\
  Calendar1\"); } }\n   </script>\n```\n\n现在这些属性已经暴露，第二个页面（`Page2.aspx`）就可以更轻松地处理服务器控件。列表\
  \ 3-10 向你展示了 `Page2.aspx` 如何处理这些属性。\n\n# 列表 3-10: 使用第一个页面暴露的属性\n\n### VB\n\n```vb\n\
  \ <%@ Page Language=\"vb\" %>\n   <%@ PreviousPageType VirtualPath=\"Page1.aspx\"\
  \ %>\n   <script runat=\"server\">\n       Protected Sub Page_Load(ByVal sender\
  \ As Object, ByVal e As System.EventArgs)\n```\n\n### C#\n\n```csharp\n <%@ Page\
  \ Language=\"C#\" %>\n   <%@ PreviousPageType VirtualPath=\"Page1.aspx\" %>\n  \
  \ <script runat=\"server\">\n       protected void Page_Load(Object sender, EventArgs\
  \ e)\n       {\n           Label1.Text = \"Hello \" + PreviousPage.pp_TextBox1.Text\
  \ + \"<br />\" +\n               \"Date Selected: \" + PreviousPage.pp_Calendar1.SelectedDate.ToShortDateString();\
  \           \n       }\n   </script>\n```\n\n为了能够处理 `Page1.aspx` 暴露的属性，你必须将 `PreviousPage`\
  \ 属性强类型为源页面的类型。这是通过使用带有 `VirtualPath` 属性的 `PreviousPageType` 指令实现的。\n\n\n\n\n\n\
  请注意，当你从一个页面跨页面到另一个页面时，你并不限于仅处理第二个页面上的回传（postback）。事实上，你可以在移动到 `Page2.aspx` 之前，在\
  \ `Page1.aspx` 上创建处理回传的方法。要实现这一点，你只需为 `Page1.aspx` 中的按钮添加一个 `OnClick` 事件和一个方法即可。同时，你还需要为\
  \ `PostBackUrl` 属性分配一个值。然后，你就可以先处理 `Page1.aspx` 上的回传，再在 `Page2.aspx` 上再次处理。\n\n\
  如果用户在完成 `Page1.aspx` 操作之前请求了 `Page2.aspx` 会发生什么？判断请求是来自 `Page1.aspx` 还是有人直接访问了 `Page2.aspx`\
  \ 实际上非常简单。你可以通过 `IsCrossPagePostBack` 属性处理请求，该属性与 `IsPostBack` 属性非常相似。`IsCrossPagePostBack`\
  \ 属性允许你检查请求是否来自 `Page1.aspx`。列表 3-11（本章节代码下载中的 Listing03-11.aspx）显示了此示例。\n\n# 列表\
  \ 3-11: 使用 IsCrossPagePostBack 属性\n\n## VB\n\n```vb\n <%@ Page Language=\"vb\" %>\n\
  \   <%@ PreviousPageType VirtualPath=\"Page1.aspx\" %>\n   <script runat=\"server\"\
  >\n       Protected Sub Page_Load(ByVal sender As Object, ByVal e As System.EventArgs)\n\
  \           If PreviousPage IsNot Nothing AndAlso PreviousPage.IsCrossPagePostBack\
  \ Then\n               Label1.Text = \"Hello \" & PreviousPage.pp_Textbox1.Text\
  \ & \"<br />\" &\n                   \"Date Selected: \" & \n                  \
  \   PreviousPage.pp_Calendar1.SelectedDate.ToShortDateString()\n           Else\n\
  \               Response.Redirect(\"Page1.aspx\")\n           End If\n       End\
  \ Sub\n   </script>\n```\n\n## C#\n\n```csharp\n <%@ Page Language=\"C#\" %>\n \
  \  <%@ PreviousPageType VirtualPath=\"Page1.aspx\" %>\n   <script runat=\"server\"\
  >\n       protected void Page_Load(Object sender, EventArgs e)\n       {\n     \
  \      if (PreviousPage != null && PreviousPage.IsCrossPagePostBack)\n         \
  \  {\n               Label1.Text = \"Hello \" + PreviousPage.pp_TextBox1.Text +\
  \ \"<br />\" +\n                   \"Date Selected: \" + \n                    \
  \ PreviousPage.pp_Calendar1.SelectedDate.ToShortDateString();\n           }\n  \
  \         else\n           {\n               Response.Redirect(\"Page1.aspx\");\n\
  \           }\n       }\n   </script>\n```\n\n## ASP.NET 应用程序文件夹\n\n当你创建 ASP.NET\
  \ 应用程序时，注意 ASP.NET 4.5 使用的是基于文件的方法。在处理 ASP.NET 时，你可以在应用程序中添加任意数量的文件和文件夹，而无需在每次向整个解决方案添加新文件时都重新编译。ASP.NET\
  \ 4.5 包含了动态预编译你的 ASP.NET 应用程序的能力。\n\nASP.NET 1.0/1.1 将你解决方案中的所有内容编译成一个 DLL。现在不再需要这样做，因为\
  \ ASP.NET 应用程序现在有了定义的文件夹结构。通过使用 ASP.NET 定义的文件夹，你可以让代码自动为你编译，让应用程序主题在整个应用程序中可用，并在任何需要时可以使用全球化资源。为了有更深入的，让我们回顾每个定义的文件夹以查看它们是如何工作的。第一个回顾的文件夹是\
  \ App_Code 文件夹。\n\n### App_Code 文件夹\n\nApp_Code 文件夹用于存储你的类、`.wsdl` 文件和类型化数据集。存储在此文件夹中的任何项目都将自动对解决方案中的所有页面可用。App_Code\
  \ 文件夹的优点在于，当你向其中放置内容时，Visual Studio 2012 会自动检测并编译它（如果它是类，即 `.vb` 或 `.cs`）、自动创建你的\
  \ XML Web 服务代理类（来自 `.wsdl` 文件），或从你的 `.xsd` 文件自动为你创建类型化数据集。文件自动编译后，这些项目将立即供同一解决方案中的任何\
  \ ASP.NET 页面使用。请查看如何使用 App_Code 文件夹在解决方案中使用简单的类。\n\n第一步是创建一个 App_Code 文件夹。要此操作，只需右键点击解决方案并选择添加\
  \ ![image](img/Ar.jpg) 添加 ASP.NET 文件夹 ![image](img/Ar.jpg) App_Code。在 App_Code 文件夹就绪后，右键点击该文件夹并选择“新建项”。出现的“新建项”对话框（如图\
  \ 3-8 所示）为你提供了若干放置在此文件夹中的文件类型选项。可用选项包括：启用 Ajax 的 WCF 服务、类文件、LINQ to SQL 类、ADO.NET\
  \ Entity 数据模型、ADO.NET EntityObject 生成器、序列图、文本模板、文本文件、数据集、报告，以及如果你使用的是 Visual Studio\
  \ 2012，还有类图。Visual Studio 2012 Web Express 版仅提供这些文件的子集。对于第一个示例，选择类型为类的文件并将类命名为 `Calculator.vb`\
  \ 或 `Calculator.cs`。\n\n\n\n\n\n```\n public class Calculator\n   {\n       public\
  \ int Add(int a, int b)\n       {\n           return (a + b);\n       }\n\n    \
  \   public int Subtract(int a, int b)\n       {\n           return (a - b);\n  \
  \     }\n   }\n```\n\n在你向 `Calculator` 类中添加了 `Subtract` 方法后，保存文件并返回你的 `.aspx` 页面。你会发现\
  \ IDE 已经重新编译了该类，新方法现在已供你的页面使用。你可以在 IntelliSense 中直接看到这一点。图 3-10 展示了这一过程。\n\n![image](img/f081-01.jpg)\n\
  \n**图 3-10**\n\n放置在 `App_Code` 文件夹中的所有内容都会被编译成单个程序集。放置在 `App_Code` 文件夹中的类文件不需要使用特定的语言。这意味着，即使解决方案中的所有页面都是用\
  \ Visual Basic 编写的，解决方案中 `App_Code` 文件夹下的 `Calculator` 类也可以用 C# 构建（`Calculator.cs`）。\n\
  \n由于此文件夹中包含的所有类都被构建成单个程序集，因此你*不能*在根 `App_Code` 文件夹中存放不同语言的类，如下例所示：\n\n```\n \\App_Code\n\
  \     Calculator.cs\n     AdvancedMath.vb\n```\n\n在 `App_Code` 文件夹中拥有两个不同语言编写的类（所示）会导致抛出错误。分配的编译器无法处理两种不同的语言。因此，若要在你的\
  \ `App_Code` 文件夹中使用多种语言，你必须对文件夹结构和 `web.config` 文件进行一些更改。\n\n第一步是向 `App_Code` 文件夹添加两个新的子文件夹——一个\
  \ VB 文件夹和一个 CS 文件夹。这将为你提供如下的文件夹结构：\n\n```\n \\App_Code\n     \\VB\n      Add.vb\n\
  \     \\CS\n      Subtract.cs\n```\n\n这仍然无法将这些类文件正确地编译为独立的程序集，至少在你对 `web.config`\
  \ 文件进行一些添加之前如此。可能你目前的解决方案中还没有 `web.config` 文件，请通过解决方案管理器（Solution Explorer）添加一个。添加后，更改\
  \ `<compilation>` 节点，使其结构如 列表 3-15 所示（本章代码下载中的 web.config）。\n\n# 列表 3-15: 结构化 web.config\
  \ 文件，使 App_Code 文件夹中的类可以使用不同的语言\n\n```xml\n <compilation debug=\"false\" targetFramework=\"\
  4.5\">\n       <codeSubDirectories>\n           <add directoryName=\"VB\"></add>\n\
  \           <add directoryName=\"CS\"></add>\n       </codeSubDirectories>\n   </compilation>\n\
  ```\n\n现在你的 `web.config` 文件中配置好了这些，你就可以在 ASP.NET 页面中使用每个类了。此外，任何放置在 CS 文件夹中的 C#\
  \ 类现在都会被自动编译，就像放置在 VB 文件夹中的任何类一样。由于你可以在 `web.config` 文件中添加这些目录，并不并不像这里这样将它们命名为 VB\
  \ 和 CS；你可以使用任何喜欢的名称。\n\n### App_Data 文件夹\n\n`App_Data` 文件夹存放应用程序所使用的数据存储。它是集中存储应用程序可能用到的所有数据存储的好地方。`App_Data`\
  \ 文件夹可以包含 Microsoft SQL Express 文件（`.mdf` 文件）、Microsoft SQL Server Compact 文件（`.sdf`\
  \ 文件）、XML 文件等。\n\n你的应用程序所使用的用户账户对 `App_Data` 文件夹内的任何文件都具有读写访问权限。将所有数据文件存储在此文件夹中的另一个原因是，ASP.NET\
  \ 系统的大部分内容——从成员资格和角色管理系统到 GUI 工具（如 ASP.NET MMC 插入程序和 ASP.NET 网站管理工具）——都是为了配合 `App_Data`\
  \ 文件夹而构建。\n\n### App_GlobalResources 文件夹\n\n资源文件是字符串表，当应用程序需要根据文化变化等情况更改内容时，它们可以作为应用程序的数据字典。你可以向\
  \ `App_GlobalResources` 文件夹添加程序集资源文件（`.resx`），它们会被动态编译并成为解决方案的一部分，供应用程序中的所有 `.aspx`\
  \ 页面使用。在在使用 ASP.NET 1.0/1.1 时，你必须使用 `resgen.exe` 工具，并且必须将资源文件编译为 `.dll` 或 `.exe`\
  \ 以供解决方案使用。在 ASP.NET 4.5 中处理资源文件要简单得多。只需将应用程序范围的资源放置在此文件夹中，即可即时访问。本地化详见 第 32 章。\n\
  \n### App_LocalResources 文件夹\n\n即使你对使用 `App_GlobalResources` 文件夹构建应用程序范围的资源感兴趣，你可能还需要单个\
  \ `.aspx` 页面使用的资源。你可以通过 `App_LocalResources` 文件夹非常简单地实现。\n\n你可以通过以下方式构造 `.resx`\
  \ 文件名，将页面特定的资源文件添加到 `App_LocalResources` 文件夹中：\n\n* `Default.aspx.resx`\n* `Default.aspx.fi.resx`\n\
  * `Default.aspx.ja.resx`\n* `Default.aspx.en-gb.resx`\n\n现在，如果未找到匹配项，将从 `App_LocalResources`\
  \ 文件夹获取相应的特定 资源文件。默认情况下，将使用 `Default.aspx.resx` 文件。如果文化指定为 `fi`（芬兰语），则使用 `Default.aspx.fi.resx`\
  \ 文件。本地化详见 第 32 章。\n\n### App_WebReferences 文件夹\n\n`App_WebReferences` 文件夹是 ASP.NET\
  \ 3.5 之前版本使用的 References 文件夹的新名称，现在你可以通过它访问 Web 服务。第 13 章  ASP.NET 中的 Web 服务。\n\n\
  ### App_Browsers 文件夹\n\n`App_Browsers` 文件夹存放 `.browser` 文件，这些是用于识别向应用程序请求的浏览器及其能力的\
  \ XML 文件。你可以在 `C:\\Windows\\Microsoft.NET\\Framework\\v4.0.xxxxx\\Config\\Browsers`\
  \ 找到全局 `.browser` 文件列表。此外，如果你想更改这些默认文件的部分，只需将 `.browser` 文件复制到应用程序的 App_Browsers\
  \ 文件夹并更改定义。\n\n## 编译\n\n你已经看到 Visual Studio 2012 如何在你处理应用程序时编译它们（例如，在 `App_Code`\
  \ 中放置一个类）。应用程序的其他部分，例如 `.aspx` 页面，可以像以前一样通过浏览器引用编译。\n\n当 ASP.NET 页面第一次在浏览器中引用时，请求被传递给\
  \ ASP.NET 解析器，由解析器以页面语言创建类文件。解析器根据文件扩展名（`aspx`）传递请求，因为 ASP.NET 意识到该文件类型由其处理。在创建类文件后，该类文件被编译为\
  \ DLL 并写入 Web 服务器的磁盘。此时，DLL 被实例化并处理，并为 ASP.NET 页面的初始请求者生成输出。这详见 图 3-11。\n\n\n\n\n\
  \n## **图 3-12**\n\n由于该过程的机制，如果你对 `.aspx` 后置代码页进行了更改，你就会发现有必要重新编译应用程序。如果你有一个较大的网站，并且不希望终端用户在\
  \ `.aspx` 页面在编译后首次被引用时经历极端的延迟，这将是一个非常痛苦的问题。因此，许多开发者开始编写自己的工具，自动去扫描并访问应用程序中的每一个页面，以从终端用户的浏览体验中消除这种首次访问的延迟命中影响。\n\
  \nASP.NET 提供了几种方法，允许你通过命令行发出的单个命令来预编译整个应用程序。其中一种编译类型被称为“**原位预编译**”（**`in-place precompilation`**）。要预编译整个\
  \ ASP.NET 应用程序，你必须使用 ASP.NET 自带的 `aspnet_compiler.exe` 工具。你可以使用命令行窗口导航到该工具。打开命令行窗口并导航到\
  \ `C:\\Windows\\Microsoft.NET\\Framework\\v4.0.xxxxx\\`。到达该目录后，你就可以使用 `aspnet_compiler`\
  \ 工具了。你也可以直接从 VS2012 的开发命令提示符（Developer Command Prompt for VS）访问此工具。在 Windows 8\
  \ 中，选择搜索功能并输入“Developer Command Prompt”。从搜索结果中选择相应的应用程序。\n\n获取命令提示符后，你使用 `aspnet_compiler.exe`\
  \ 工具通过以下命令执行原位预编译：\n\n```\naspnet_compiler -p \"C:\\Inetpub\\wwwroot\\WROX\" -v\
  \ none\n```\n\n然后你将收到一条显示预编译成功的消息。这种预编译能力的另一个巨大优势是，你还可以用它来查找应用程序中任何 ASP.NET 页面上的错误。因为它会访问每个页面，如果其中一个页面包含一个在运行时才会触发的错误，当你采用这种预编译方法时，你会立即收到错误通知。\n\
  \n下一个预编译选项通常被称为“**部署性预编译**”（**`precompilation for deployment`**）。ASP.NET 的这一卓越功能使你能够将应用程序编译为若干个\
  \ DLL 文件，然后可以将这些文件部署给客户、合作伙伴或在其他地方供自己使用。执行此操作不仅需要的步骤极少，而且在应用程序编译后，你只需要移动 DLL 和一些占位符文件，网站即可运行。这意味着在部署时，你的网站代码已被完全移除并放入\
  \ DLL 中。\n\n然而，在执行这些预编译步骤之前，请在根驱动器上创建一个文件夹，例如 Wrox。这个文件夹是你将编译器输出输出的目录。目录准备就绪后，你可以返回编译器工具并输入以下命令：\n\
  \n```\naspnet_compiler -v [Application Name] -p [Physical Location] [Target]\n```\n\
  \n因此，如果你有一个名为 `ThomsonReuters` 的应用程序，位于 `C:\\Websites\\ThomsonReuters`，你应当使用以下命令：\n\
  \n```\naspnet_compiler -v /ThomsonReuters -p C:\\Websites\\ThomsonReuters C:\\Wrox\n\
  ```\n\n按下回车键，编译器要么告诉你是某个命令参数存在问题，要么告诉你执行成功（显示在图 3-13 中）。如果执行成功，你可以在目标目录中看到输出内容。\n\
  \n![image](img/f085-01.jpg)\n\n## **图 3-13**\n\n在图 3-13 中，`-v` 是应用程序虚拟路径的命令，通过使用\
  \ `/ThomsonReuters` 提供。下一个命令是 `–p`，指向应用程序的物理路径。在这种情况下，它是 `C:\\Websites\\ThomsonReuters`。最后，最后一部分\
  \ `C:\\Wrox` 是编译器输出的位置。表 3-12 描述了 `aspnet_compiler.exe` 工具的一些可能命令。\n\n| 命令 | 描述\
  \ |\n| --- | --- |\n| `-m` | 指定应用程序的完整 IIS 元数据库路径。如果你使用 `-m` 命令，则不能使用 `-v` 或 `-p`\
  \ 命令。 |\n| `-v` | 指定要编译的应用程序的虚拟路径。如果你也使用 `-p` 命令，则使用物理路径来查找应用程序的位置。 |\n| `-p` |\
  \ 指定要编译的应用程序的物理路径。如果未指定，则将使用 IIS 元数据库来查找应用程序。 |\n| `-u` | 如果使用此命令，则指定应用程序是可更新的。\
  \ |\n| `-f` | 指定如果目标目录已存在，则覆盖它。 |\n| `-d` | 指定在编译过程中应排除调试信息。 |\n| `-c` | 指定要编译的应用程序应被完全重建。\
  \ |\n| `[targetDir]` | 指定放置编译后文件的目标目录。如果未指定，则输出文件将放在应用程序目录中。 |\n\n## **表 3-12**\n\
  \n编译应用程序后，你可以去 `C:\\Wrox` 查看输出。在这里你可以看到原始文件中的所有文件。然而，如果你查看内容，会发现某些文件只是一个占位符。在实际文件中，你会发现：\n\
  \n```\n这是一个由编译器生成的标记文件，不应删除。\n```\n\n事实上，你在 bin 文件夹中会发现一个或多个 App_Webdll 文件。由于它是\
  \ DLL，它还提供了良好的混淆作用。从这里开始，你只需要将这些文件移动到服务器，就可以运行整个应用程序。图 3-14 显示了示例输出。\n\n![image](img/f086-01.jpg)\n\
  \n## **图 3-14**\n\n注意，此编译过程并不编译所有类型。事实上，它只编译 ASP.NET 特定的类型，而排除了以下类型：\n\n- HTML 文件\n\
  - XML 文件\n- XSD 文件\n- `web.config` 文件\n- 文本文件\n\n对于这些类型，你无法做很多，除非 HTML 文件和文本文件。将这些文件的后缀名改为\
  \ `.aspx`，它们就会像其他 ASP.NET 文件一样被编译。\n\n## 构建程序（BUILD PROVIDERS）\n\n在查看各种 ASP.NET\
  \ 文件夹时，注意最有趣的文件夹之一是 AppCode 文件夹。你可以直接将代码文件、XSD 文件甚至 WSDL 文件放入该文件夹中进行自动编译。当你将类文件放入\
  \ AppCode 文件夹时，该类可以被运行中的应用程序。在 ASP.NET 早期，如果你想部署自定义组件，必须在在应用程序中使用之前对其进行编译。现在，ASP.NET\
  \ 已经处理了你曾经需要完成的所有工作。\n\n哪些类型在 AppCode 中被编译？正如 ASP.NET 中的大多数事物一样，这是通过配置文件中的设置决定的。列表\
  \ 3-16 显示了摘自主 web.config 文件的配置片段。\n\n\n\n\n\n```xml\n <buildProviders>\n      <add\
  \ extension=\".aspx\" type=\"System.Web.Compilation.PageBuildProvider\" />\n   \
  \   <add extension=\".ascx\" type=\"System.Web.Compilation.UserControlBuildProvider\"\
  \ />\n      <add extension=\".master\" type=\"System.Web.Compilation.MasterPageBuildProvider\"\
  \ />\n      <add extension=\".asmx\" type=\"System.Web.Compilation.WebServiceBuildProvider\"\
  \ />\n      <add extension=\".ashx\" type=\"System.Web.Compilation.WebHandlerBuildProvider\"\
  \ />\n      <add extension=\".soap\" type=\"System.Web.Compilation.WebServiceBuildProvider\"\
  \ />\n      <add extension=\".resx\" type=\"System.Web.Compilation.ResXBuildProvider\"\
  \ />\n      <add extension=\".resources\" type=\"System.Web.Compilation.ResourcesBuildProvider\"\
  \ />\n      <add extension=\".wsdl\" type=\"System.Web.Compilation.WsdlBuildProvider\"\
  \ />\n      <add extension=\".xsd\" type=\"System.Web.Compilation.XsdBuildProvider\"\
  \ />\n      <add extension=\".js\" type=\"System.Web.Compilation.ForceCopyBuildProvider\"\
  \ />\n      <add extension=\".lic\" type=\"System.Web.Compilation.IgnoreFileBuildProvider\"\
  \ />\n      <add extension=\".licx\" type=\"System.Web.Compilation.IgnoreFileBuildProvider\"\
  \ />\n      <add extension=\".exclude\" type=\"System.Web.Compilation.IgnoreFileBuildProvider\"\
  \ />\n      <add extension=\".refresh\" type=\"System.Web.Compilation.IgnoreFileBuildProvider\"\
  \ />\n      <add extension=\".edmx\" type=\"System.Data.Entity.Design.EntityDesignerBuildProvider\"\
  \ />\n      <add extension=\".xoml\" type=\"System.ServiceModel.Activation.WorkflowServiceBuildProvider,\
  \ System.WorkflowServices, Version=4.0.0.0, Culture=neutral, PublicKeyToken=31bf856ad364e35\"\
  \ />\n      <add extension=\".svc\" type=\"System.ServiceModel.Activation.ServiceBuildProvider,\
  \ System.ServiceModel, Version=4.0.0.0, Culture=neutral, PublicKeyToken=31bf856ad364e35\"\
  \ />\n      <add extension=\".xamlx\" type=\"System.Xaml.Hosting.XamlBuildProvider,\
  \ System.Xaml.Hosting, Version=4.0.0.0, Culture=neutral, PublicKeyToken=31bf856ad364e35\"\
  \ />\n   </buildProviders>\n```\n\n此节包含了可以在开发周期中两个实体使用的构建提供程序（build providers）列表。当你在\
  \ Visual Studio 中构建解决方案时，第一个被使用的构建提供程序是在在 `App_Code` 文件夹中放置 `.wsdl` 文件，这会导致 IDE\
  \ 自动获取来自该文件的动态编译代理类。另一个使用构建提供程序的实体是 ASP.NET 本身。正如提到的，将 `.wsdl` 文件拖放到应用程序的 `App_Code`\
  \ 文件夹中，ASP.NET 程序会自动访问创建的代理类。\n\n构建提供程序简单继承自 `System.Web.Compilation.BuildProvider`\
  \ 的类。`web.config` 文件中的 `<buildProviders>` 允许你列出将使用的构建提供程序类。动态编译任何 WSDL 文件的功能由配置文件中的以下行定义：\n\
  \n```xml\n <add extension=\".wsdl\" type=\"System.Web.Compilation.WsdlBuildProvider\"\
  \ />\n```\n\n这意味着任何利用 `.wsdl` 扩展名的文件都使用继承自 `BuildProvider` 的 `WsdlBuildProvider`\
  \ 类进行编译。微软提供了一系列构建提供程序供你使用。从列表 3-16 中的集合可以看到，除了 `WsdlBuildProvider` 之外还有许多提供程序，例如\
  \ `XsdBuildProvider`、`PageBuildProvider`、`UserControlBuildProvider`、`MasterPageBuildProvider`\
  \ 等。只需查看这些提供程序的名称，你就能大致理解它们的作用。然而，下一节将介绍一些名称可能并不熟悉的提供程序。\n\n### 使用内置构建提供程序\n\n本节涵盖了\
  \ `ForceCopyBuildProvider` 和 `IgnoreFileBuildProvider`，它们都包含在提供程序的列表中。\n\n`ForceCopyBuildProvider`\
  \ 仅为部署使用定义扩展名的文件（这些文件不包含在编译过程中）。利用 `ForceCopyBuildProvider` 的扩展名在列表 3-16 的预定义列表中显示。这是\
  \ `.js` 文件类型（JavaScript 文件扩展名）。任何 `.js` 文件仅被复制而不包含编译过程中（这对于 JavaScript 文件是合理的）。可以使用此处显示的命令添加你想加入此复制过程的文件类型：\n\
  \n```xml\n <add extension=\".chm\" type=\"System.Web.Compilation.ForceCopyBuildProvider\"\
  \ />\n```\n\n除了 `ForceCopyBuildProvider` 之外，你还应该注意 `IgnoreFileBuildProvider` 类。该提供程序会导致部署或编译的文件的文件忽略。这意味着任何使用\
  \ `IgnoreFileBuildProvider` 定义的文件类型都会被忽略。Visual Studio 将不会复制、编译或部署该类型的文件。因此，如果你在项目中包含了\
  \ Visio 图表，只需向 `web.config` 文件添加以下 `<add>` 元素即可忽略此类文件类型。示例所示：\n\n```xml\n <add extension=\"\
  .vsd\" type=\"System.Web.Compilation.IgnoreFileBuildProvider\" />\n```\n\n设置完成后，所有\
  \ `.vsd` 文件都会被忽略。\n\n### 使用自定义构建提供程序\n\n在使用预定义的构建提供程序之外，你还可以将构建提供程序的功能更进一步，构建自己的自定义构建提供程序以便在应用程序中使用。\n\
  \n例如，假设你想根据你定义的自定义 `.car` 文件中应用的设置来动态构造一个 `Car` 类。你这样做是因为你在多个项目中使用了此 `.car` 定义文件，或者在同一个项目中多次使用。使用构建提供程序可以让定义这些\
  \ `Car` 类的多个实例变得简单。\n\n列表 3-17 位于代码下载的 `Listing03-17.car` 中，展示了一个 `.car` 文件的示例。\n\
  \n# 列表 3-17: 一个 .car 文件示例\n\n```xml\n <?xml version=\"1.0\" encoding=\"utf-8\" ?>\n\
  \   <car name=\"AspNetCar\">\n       <color>White</color>\n       <door>4</door>\n\
  \       <seats>8</seats>\n   </car>\n```\n\n最后，此 XML 声明指定了要编译的类名称以及某些属性和方法的值。这些元素构成了该类。现在你已经理解了\
  \ `.car` 文件的结构，下一步是构造构建提供程序。为了完成此任务，在 Visual Studio 中用你选择的语言创建一个新的类库项目。将项目命名为 `CarBuildProvider`。`CarBuildProvider`\
  \ 包含一个类 `Car.vb` 或 `Car.cs`。该类继承自基类 `BuildProvider` 并重写了 `BuildProvider` 类的 `GenerateCode()`\
  \ 方法。列表 3-18（本章代码下载中的 `Listing03-18.vb` 和 `Listing03-18.cs`）展示了这个类。\n\n***VB***\n\
  \n\n\n\n\n```vb\n Imports System.IO\n   Imports System.Web.Compilation\n   Imports\
  \ System.Xml\n   Imports System.CodeDom\n   Public Class Car\n       Inherits BuildProvider\n\
  \       Public Overrides Sub GenerateCode(ByVal myAb As AssemblyBuilder)\n     \
  \      Dim carXmlDoc As XmlDocument = New XmlDocument()\n           Using passedFile\
  \ As Stream = Me.OpenStream()\n               carXmlDoc.Load(passedFile)\n     \
  \      End Using\n           Dim mainNode As XmlNode = carXmlDoc.SelectSingleNode(\"\
  /car\")\n           Dim selectionMainNode As String = mainNode.Attributes(\"name\"\
  ).Value\n           Dim colorNode As XmlNode = carXmlDoc.SelectSingleNode(\"/car/color\"\
  )\n           Dim selectionColorNode As String = colorNode.InnerText\n         \
  \  Dim doorNode As XmlNode = carXmlDoc.SelectSingleNode(\"/car/door\")\n       \
  \    Dim selectionDoorNode As String = doorNode.InnerText\n           Dim seatsNode\
  \ As XmlNode = carXmlDoc.SelectSingleNode(\"/car/seats\")\n           Dim selectionseatsNode\
  \ As String = seatsNode.InnerText\n           Dim ccu As CodeCompileUnit = New CodeCompileUnit()\n\
  \           Dim cn As CodeNamespace = New CodeNamespace()\n           Dim cmp1 As\
  \ CodeMemberProperty = New CodeMemberProperty()\n           Dim cmp2 As CodeMemberProperty\
  \ = New CodeMemberProperty()\n           Dim cmm1 As CodeMemberMethod = New CodeMemberMethod()\n\
  \           cn.Imports.Add(New CodeNamespaceImport(\"System\"))\n           cmp1.Name\
  \ = \"Color\"\n           cmp1.Type = New CodeTypeReference(GetType(System.String))\n\
  \           cmp1.Attributes = MemberAttributes.Public\n           cmp1.GetStatements.Add(New\
  \ CodeSnippetExpression(\"return \"\"\" &\n             selectionColorNode & \"\"\
  \"\"))\n           cmp2.Name = \"Doors\"\n           cmp2.Type = New CodeTypeReference(GetType(System.Int32))\n\
  \           cmp2.Attributes = MemberAttributes.Public\n           cmp2.GetStatements.Add(New\
  \ CodeSnippetExpression(\"return \" &\n             selectionDoorNode))\n      \
  \     cmm1.Name = \"Go\"\n           cmm1.ReturnType = New CodeTypeReference(GetType(System.Int32))\n\
  \           cmm1.Attributes = MemberAttributes.Public\n           cmm1.Statements.Add(New\
  \ CodeSnippetExpression(\"return \" &\n             selectionseatsNode))\n     \
  \      Dim ctd As CodeTypeDeclaration = New CodeTypeDeclaration(selectionMainNode)\n\
  \           ctd.Members.Add(cmp1)\n           ctd.Members.Add(cmp2)\n          \
  \ ctd.Members.Add(cmm1)\n           cn.Types.Add(ctd)\n           ccu.Namespaces.Add(cn)\n\
  \           myAb.AddCodeCompileUnit(Me, ccu)\n       End Sub\n   End Class\n```\n\
  \n**C#**\n\n```csharp\n using System.IO;\nusing System.Web.Compilation;\nusing System.Xml;\n\
  using System.CodeDom;\nnamespace CarBuildProvider\n{\n    class Car : BuildProvider\n\
  \    {\n        public override void GenerateCode(AssemblyBuilder myAb)\n      \
  \  {\n            XmlDocument carXmlDoc = new XmlDocument();\n            using\
  \ (Stream passedFile = OpenStream())\n            {\n                carXmlDoc.Load(passedFile);\n\
  \            }\n            XmlNode mainNode = carXmlDoc.SelectSingleNode(\"/car\"\
  );\n            string selectionMainNode = mainNode.Attributes[\"name\"].Value;\n\
  \            XmlNode colorNode = carXmlDoc.SelectSingleNode(\"/car/color\");\n \
  \           string selectionColorNode = colorNode.InnerText;\n            XmlNode\
  \ doorNode = carXmlDoc.SelectSingleNode(\"/car/door\");\n            string selectionDoorNode\
  \ = doorNode.InnerText;\n            XmlNode seatsNode = carXmlDoc.SelectSingleNode(\"\
  /car/seats\");\n            string selectionseatsNode = seatsNode.InnerText;\n \
  \           CodeCompileUnit ccu = new CodeCompileUnit();\n            CodeNamespace\
  \ cn = new CodeNamespace();\n            CodeMemberProperty cmp1 = new CodeMemberProperty();\n\
  \            CodeMemberProperty cmp2 = new CodeMemberProperty();\n            CodeMemberMethod\
  \ cmm1 = new CodeMemberMethod();\n            cn.Imports.Add(new CodeNamespaceImport(\"\
  System\"));\n            cmp1.Name = \"Color\";\n            cmp1.Type = new CodeTypeReference(typeof(string));\n\
  \            cmp1.Attributes = MemberAttributes.Public;\n            cmp1.GetStatements.Add(new\
  \ CodeSnippetExpression(\"return \\\"\" +\n              selectionColorNode + \"\
  \\\"\"));\n            cmp2.Name = \"Doors\";\n            cmp2.Type = new CodeTypeReference(typeof(int));\n\
  \            cmp2.Attributes = MemberAttributes.Public;\n            cmp2.GetStatements.Add(new\
  \ CodeSnippetExpression(\"return \" +\n              selectionDoorNode));\n    \
  \        cmm1.Name = \"Go\";\n            cmm1.ReturnType = new CodeTypeReference(typeof(int));\n\
  \            cmm1.Attributes = MemberAttributes.Public;\n            cmm1.Statements.Add(new\
  \ CodeSnippetExpression(\"return \" +\n              selectionseatsNode));\n   \
  \         CodeTypeDeclaration ctd = new CodeTypeDeclaration(selectionMainNode);\n\
  \            ctd.Members.Add(cmp1);\n            ctd.Members.Add(cmp2);\n      \
  \      ctd.Members.Add(cmm1);\n            cn.Types.Add(ctd);\n            ccu.Namespaces.Add(cn);\n\
  \            myAb.AddCodeCompileUnit(this, ccu);\n        }\n    }\n}\n```\n\n当你查看\
  \ `GenerateCode()` 方法时，你可以看到它接收一个 `AssemblyBuilder` 实例。这个 `AssemblyBuilder` 对象来自\
  \ `System.Web.Compilation` 命名空间，正因为如此，该类中的所有各种对象都需要导入以下命名空间：\n\n```\n using System.IO;\n\
  \   using System.Web.Compilation;\n   using System.Xml;\n   using System.CodeDom;\n\
  ```\n\n完成上述操作后，`GenerateCode()` 方法剩余的任务之一是加载 `.car` 文件。由于 `.car` 文件使用 XML 格式，因此你能够使用\
  \ `XmlDocument` 对象轻松地加载它。从那里，通过 CodeDom，你可以创建一个包含两个属性和一个方法的类。生成的类是所提供的 `.car` 文件中定义的抽象表示。此外，类的名称也是通过\
  \ `.car` 文件中根 `<car>` 节点通过 `name` 属性动态驱动的。\n\n作为输入的 `AssemblyBuilder` 实例会将生成的代码与其他所有内容一起编译成程序集。\n\
  \n这意味着你的 ASP.NET 项目引用了 `CarBuildProvider` 程序集？这意味着你可以创建一个自己的 `.car` 文件并将其放入 `App_Code`\
  \ 文件夹中。一旦将该文件放入 `App_Code` 文件夹，你就可以立即对文件中指定的定义进行程序化访问。\n\n要实现此功能，你需要在服务器的 `machine.config`\
  \ 或应用程序的 `web.config` 文件中引用构建提供程序。参考列表 3-19（本章节代码下载中的 web.config）。\n\n**列表 3-19:\
  \ 在 web.config 文件中引用构建提供程序**\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
  ?>\n<configuration>\n    <system.web>\n        <compilation debug=\"true\" targetFramework=\"\
  4.5\">\n            <buildProviders>\n                <add extension=\".car\" type=\"\
  CarBuildProvider.Car\" />\n            </buildProviders>\n        </compilation>\n\
  \        <httpRuntime targetFramework=\"4.5\" />\n    </system.web>\n</configuration>\n\
  ```\n\n\n\n\n\n`<buildProviders>` 是 `<compilation>` 元素的子元素。`<buildProviders>` 元素包含几个子元素用于添加或删除提供程序。在这种情况下，由于你想添加对自定义\
  \ `CarBuildProvider` 对象的引用，因此使用 `<add>` 元素。`<add>` 元素可以两个属性——`extension` 和 `type`。你必须同时使用这两个属性。在\
  \ `extension` 属性中，你定义了该构建提供程序将关联的文件扩展名。在这种情况下，你使用 `.car` 文件扩展名。这意味着任何使用此扩展名的文件都与\
  \ `type` 属性中定义的类相关。`type` 属性随后接收你构建的 `CarBuildProvider` 类的引用——`CarBuildProvider.Car`。\n\
  \n有了这个引用，你就可以创建早些在列表 3-17 中所示的 `.car` 文件。将创建的 `.car` 文件放在 `App_Code` 文件夹中。你将立即获得一个通过文件提供的定义动态生成的类。例如，因为我在\
  \ `<Car>` 元素的 `name` 属性值中使用了 `AspNetCar`，这将是生成的类的名称，当我在 Visual Studio 中输入时，我会找到这个精确的名称。\n\
  \n如果你创建了 `AspNetCar` 类的实例，还会发现你也可以访问该类暴露的属性和方法。这在图 3-15 中显示。\n\n![image](img/f092-01.jpg)\n\
  \n**图 3-15**\n\n除了访问类的属性和方法外，你还可以访问 `.car` 文件中定义的值。这在图 3-16 中显示。图 3-15 中显示的简单代码示例被用于此浏览器输出。\n\
  \n![image](img/f093-01.jpg)\n\n**图 3-16**\n\n虽然 `Car` 类并不是世界上最有用的东西，但这个示例向你展示了如何掌握构建提供程序机制来扩展你应用程序的功能。\n\
  \n## GLOBAL.ASAX\n\n如果你向 ASP.NET 应用程序添加新项，会弹出“添加新项”对话框。在这里，你可以看到可以向应用程序添加“全局应用程序类”（Global\
  \ Application Class）。这将添加一个 `Global.asax` 文件。该文件供应用程序用于存储应用程序级事件、对象和变量——所有这些在整个范围内都是可用的。Active\
  \ Server Pages 开发者曾有一个类似的 `Global.asa` 文件。\n\n你的 ASP.NET 应用程序只能有一个 `Global.asax`\
  \ 文件。该文件支持许多项。当创建它时，你将获得以下模板：\n\n```\n public class Global : System.Web.HttpApplication\n\
  \   {\n       protected void Application_Start(object sender, EventArgs e) { }\n\
  \       protected void Session_Start(object sender, EventArgs e) { }\n       protected\
  \ void Application_BeginRequest(object sender, EventArgs e) { }\n       protected\
  \ void Application_AuthenticateRequest(object sender, EventArgs e) { }\n       protected\
  \ void Application_Error(object sender, EventArgs e) { }\n       protected void\
  \ Session_End(object sender, EventArgs e) { }\n       protected void Application_End(object\
  \ sender, EventArgs e) { }\n   }\n```\n\n就像你可以在 `.aspx` 页面中处理页面级事件一样，你也可以从 `Global.asax`\
  \ 文件处理整个应用程序事件。除了此代码示例中列出的事件外，以下列表详细说明了你可以在此文件中结构的一些事件：\n\n*   `Application_Start`：当应用程序接收到第一个请求时调用。这是你在应用程序中分配任何必须在所有用户之间维护的应用程序级变量或状态的理想位置。\n\
  *   `Session_Start`：与 `Application_Start` 事件类似，不同之处该事件在单个用户首次访问应用程序时触发。例如，`Application_Start`\
  \ 事件在第一个请求进来时触发一次，启动应用程序，但 `Session_Start` 会在每个首次向应用程序请求内容的用户处被调用。\n*   `Application_BeginRequest`：尽管在上述\
  \ Visual Studio 2012 提供的模板中没有列出，但 `Application_BeginRequest` 事件会在到达它的每个请求之前触发。这意味着当请求进入服务器时，在处理此请求之前，`Application_BeginRequest`\
  \ 会被触发并在任何请求处理之前被处理。\n*   `Application_AuthenticateRequest`：为每个请求触发，允许你为请求设置自定义身份验证。\n\
  *   `Application_Error`：当应用程序中的任何用户在任何地方抛出错误时触发。这是提供范围内错误处理或将错误记录到服务器事件日志的事件的理想位置。\n\
  *   `Session_End`：在 `InProc` 模式下运行时，当用户离开应用程序时会触发此事件。\n*   `Application_End`：当应用程序结束时触发。大多数\
  \ ASP.NET 开发者不会经常使用此事件，因为 ASP.NET 在关闭和清理任何遗留对象方面做得非常好。\n\n除了 `Global.asax` 文件提供的可访问的全局应用程序事件外，你还可以像在其他\
  \ ASP.NET 页面中一样在该文件中使用指令。`Global.asax` 文件允许以下指令：\n\n*   `@Application`\n*   `@Assembly`\n\
  *   `@Import`\n\n这些指令在与其他 ASP.NET 页面类型配合使用时工作方式相同。\n\n使用 `Global.asax` 文件的示例见列表\
  \ 3-20（代码下载中的 Global.asax）。它演示了如何在 ASP.NET 应用程序域关闭时记录。当 ASP.NET 应用程序域关闭时，ASP.NET\
  \ 应用程序将突然结束。因此，你应该将任何日志代码放在 `Global.asax` 文件的 `Application_End` 方法中。\n\n# 列表 3-20:\
  \ 在 Global.asax 文件中使用 Application_End 事件\n\n***VB***\n\n```vb\n<%@ Application Language=\"\
  vb\" %>\n   <%@ Import Namespace=\"System.Reflection\" %>\n   <%@ Import Namespace=\"\
  System.Diagnostics\" %>\n   <script runat=\"server\">\n       Sub Application_End(ByVal\
  \ sender As Object, ByVal e As EventArgs)\n           Dim MyRuntime As HttpRuntime\
  \ =\n               GetType(System.Web.HttpRuntime).InvokeMember(\"_theRuntime\"\
  , _\n               BindingFlags.NonPublic Or BindingFlags.Static Or _\n       \
  \        BindingFlags.GetField, _\n               Nothing, Nothing, Nothing)\n \
  \          If (MyRuntime Is Nothing) Then\n               Return\n           End\
  \ If\n           Dim shutDownMessage As String =\n               CType(MyRuntime.GetType().InvokeMember(\"\
  _shutDownMessage\", _\n               BindingFlags.NonPublic Or BindingFlags.Instance\
  \ Or _\n               BindingFlags.GetField, _\n               Nothing, MyRuntime,\
  \ Nothing), System.String)\n           Dim shutDownStack As String =\n         \
  \      CType(MyRuntime.GetType().InvokeMember(\"_shutDownStack\", _\n          \
  \     BindingFlags.NonPublic Or BindingFlags.Instance Or _\n               BindingFlags.GetField,\
  \ _\n               Nothing, MyRuntime, Nothing), System.String)\n           If\
  \ (Not EventLog.SourceExists(\".NET Runtime\")) Then\n               EventLog.CreateEventSource(\"\
  .NET Runtime\", \"Application\")\n           End If\n           Dim logEntry As\
  \ EventLog = New EventLog()\n           logEntry.Source = \".NET Runtime\"\n   \
  \        logEntry.WriteEntry(String.Format( _\n               \"shutDownMessage={0}\\\
  r\\n\\r\\n_shutDownStack={1}\", _\n               shutDownMessage, shutDownStack),\
  \ EventLogEntryType.Error)\n       End Sub\n   </script>\n```\n\n***C#***\n\n\n\n\
  \n\n```\n <%@ Application Language=\"C#\" %>\n   <%@ Import Namespace=\"System.Reflection\"\
  \ %>\n   <%@ Import Namespace=\"System.Diagnostics\" %>\n   <script runat=\"server\"\
  >\n       void Application_End(object sender, EventArgs e)\n       {\n         \
  \  HttpRuntime runtime =\n               (HttpRuntime)typeof(System.Web.HttpRuntime)\n\
  \               .InvokeMember(\"_theRuntime\", BindingFlags.NonPublic | \n     \
  \          BindingFlags.Static | BindingFlags.GetField,\n               null, null,\
  \ null);\n           if (runtime == null)\n           {\n               return;\n\
  \           }\n           string shutDownMessage =\n               (string)runtime.GetType().InvokeMember(\"\
  _shutDownMessage\",\n               BindingFlags.NonPublic | BindingFlags.Instance\
  \ | \n               BindingFlags.GetField, null, runtime, null);\n           string\
  \ shutDownStack =\n               (string)runtime.GetType().InvokeMember(\"_shutDownStack\"\
  ,\n               BindingFlags.NonPublic | BindingFlags.Instance | \n          \
  \     BindingFlags.GetField, null, runtime, null);\n           if (!EventLog.SourceExists(\"\
  .NET Runtime\"))\n           {\n               EventLog.CreateEventSource(\".NET\
  \ Runtime\", \"Application\");\n           }\n           EventLog logEntry = new\
  \ EventLog();\n           logEntry.Source = \".NET Runtime\";\n           logEntry.WriteEntry(String.Format(\"\
  \\r\\n\\r\\n_\" +\n               \"shutDownMessage={0}\\r\\n\\r\\n_shutDownStack={1}\"\
  ,\n               shutDownMessage, shutDownStack), EventLogEntryType.Error);\n \
  \      }\n   </script>\n```\n\n将此代码放入你的 `Global.asax` 文件中，启动你的 ASP.NET 应用程序。接下来，执行某些操作导致应用程序重启。例如，你可以在应用程序运行期间修改\
  \ `web.config` 文件。这会触发 `Application_End` 事件，你会在事件日志中看到以下新增（显示在图 3-17）。\n\n![image](img/f095-01.jpg)\n\
