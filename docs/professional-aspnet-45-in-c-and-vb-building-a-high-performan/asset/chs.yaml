  \ |\n| `PostReleaseRequestState` | 15 | ASP.NET 完成执行所有请求事件处理程序且状态数据已存储后。 |\n| `PostRequestHandlerExecute`\
  \ | 12 | 在 HTTP 处理程序执行完毕后立即触发。 |\n| `PostResolveRequestCache` | 7 | ASP.NET 跳过当前事件处理程序的执行并允许缓存模块从缓存中提供请求时。\
  \ |\n| `PostUpdateRequestCache` | 17 | ASP.NET 完成更新缓存模块并存储用于从后续请求提供服务的响应后。 |\n|\
  \ `Init` | - | 用于实现 HttpModule 功能的主要方法。 |\n\n\n\n\n\n| `PreRequestHandlerExecute`\
  \ | 11 | 在 ASP.NET 开始执行针对 HTTP 请求的处理器之前触发。在此事件之后，ASP.NET 将请求转发到适当的 HTTP 处理器。 |\n\
  | `PreSendRequestContent` | 14 | 在 ASP.NET 向客户端发送响应内容之前触发。此事件允许你在内容交付到客户端之前对其进行修改。你可以使用此事件将所有页面中通用的内容添加到页面输出中——例如，公共菜单、页眉或页脚。\
  \ |\n| `PreSendRequestHeaders` | 21 | 在 ASP.NET 向客户端发送 HTTP 响应头之前触发。此事件允许你在标头交付到客户端之前对其进行修改。你可以使用此事件向标头中添加\
  \ Cookie 和自定义数据。 |\n| `ReleaseRequestState` | 13 | 在 ASP.NET 完成所有请求事件处理程序的后发生。此事件会导致状态模块保存当前状态数据。\
  \ |\n| `RequestCompleted` | 22 | 当与请求关联的托管对象被释放时发生。 |\n| `ResolveRequestCache` |\
