  \ 指令。简单的 `@WebService` 指令只有四个可能的属性。以下列表解释了这些属性：\n\n*   `Class`: 。它指定用于定义对 XML Web\
  \ 服务客户端可见的方法和数据类型的类。\n*   `CodeBehind`: 仅当你使用代码后模型处理 XML Web 服务文件时才需要。它允许通过两个独立且更易管理的部分来处理\
  \ Web 服务，而不是单个文件。`CodeBehind` 属性接收一个字符串值，代表 Web 服务的第二个部分的物理位置——即包含所有 Web 服务逻辑的类文件。在\
  \ ASP.NET 中，将代码后文件放在 `App_Code` 文件夹中是最好的，从你最初打开 Web 服务项目时 Visual Studio 创建的默认 Web\
  \ 服务开始。\n*   `Debug`: 可选。接受 `True` 或 `False` 设置。如果 `Debug` 属性设置为 `True`，则用带调试符号编译\
  \ XML Web 服务；将值设置为 `False` 则确保 Web 服务在不带调试符号的情况下编译。\n*   `Language`: 必需。它指定用于 Web\
  \ 服务的语言。\n\n### 查看 WebService 类\n\n在 Visual Studio 中打开 `WebService.asmx` 文件，你会发现文件仅包含\
  \ `WebService` 页面指令，如列表 13-3 所示（本章代码下载中的 WebService.asmx）。\n\n对于 `.asmx` 服务，你使用\
  \ `@WebService` 指令代替 `@Page` 指令。简单的 `@WebService` 指令只有四个可能的属性。以下列表解释了这些属性：\n\n*\
  \   `Class`: 必需。它指定用于定义对 XML Web 服务客户端可见的方法和数据类型的类。\n*   `CodeBehind`: 仅当你使用代码后模型处理\
  \ XML Web 服务文件时才需要。它允许通过两个独立且更易管理的部分来处理 Web 服务，而不是单个文件。`CodeBehind` 属性接收一个字符串值，代表\
  \ Web 服务的第二个部分的物理位置——即包含所有 Web 服务逻辑的类文件。在 ASP.NET 中，将代码后文件放在 `App_Code` 文件夹中是最好的，从你最初打开\
  \ Web 服务项目时 Visual Studio 创建的默认 Web 服务开始。\n*   `Debug`: 可选。接受 `True` 或 `False` 设置。如果\
  \ `Debug` 属性设置为 `True`，则用带调试符号编译 XML Web 服务；将值设置为 `False` 则确保 Web 服务在不带调试符号的情况下编译。\n\
  *   `Language`: 必需。它指定用于 Web 服务的语言。\n\n### 查看基 类\n\n现在查看 `WebService.vb` 或 `WebService.cs`\
  \ 文件——Web 服务的代码后文件。默认情况下，`WebService.vb` 或 `WebService.cs` 中已经存在代码结构，如列表 13-4 所示。\n\
  \n你应该注意这里的几点。首先，注意 C# 解决方案中包含了 `System.Linq` 命名空间。还要注意注释的 `System.Web.Services.ScriptService`\
  \ 对象（为了简洁已从列表 13-3 中移除），用于处理 ASP.NET 脚本。要使用此属性，只需取消注释。\n\n此外，你可以看到 VB 版本默认包含了 `System.Web.Services.Protocols`\
  \ 命名空间。因此，在使用该命名空间提供的 SOAP 头部和其他功能时无需包含它。\n\n最后，你可以看到 `<WebServiceBinding>` 属性，它构建了符合\
  \ WS-I Basic Profile 1.0 发布的 XML Web 服务响应（位于 www.ws-i.org/Profiles/BasicProfile-1.0.html`](http://www.ws-i.org/Profiles/BasicProfile-1.0.html)）。\n\
  \n### 作为 SOAP 暴露自定义 DataSet\n\n为了构建你自己的 Web 服务示例，删除 `WebService.asmx` 文件并创建一个名为\
  \ `Customers.asmx` 的新文件。此 Web 服务将暴露 SQL Server 中的 `Customers` 表。进入代码。\n\n#### WebService\
  \ 属性\n\n所有的 Web 服务都封装在类中。通过放置在类声明之前的 `WebService` 属性将该类定义为 Web 服务。这是一个示例：\n\n```\n\
  \ [WebService(Namespace = \"http://adventureworks/customers\")]\n```\n\n\n\n\n\n\
  `WebService` 属性可以接受几个属性。默认情况下，`WebService` 属性会在 Web 服务与 `Namespace` 属性一起使用，该属性的初始值为\
  \ `http://tempuri.org/`。这旨在作为一个临时命名空间，你应该将其替换为更有意义且原始的名称，例如你托管 XML Web 服务的 URL。在示例中，`Namespace`\
  \ 值被更改为 `http://adventureworks/customers`。请记住，该值不需要是真实的 URL；它可以是你喜好的任何字符串值。核心思想是它应该是唯一的。\n\
  \n注意，这两种语言在 `WebService` 属性内部定义其属性的方式不同。Visual Basic 2012 使用冒号和等号来设置属性：\n\n```\n\
  \ Namespace:=\"http://adventureworks/customers\"\n```\n\nC# 则仅使用等号来为 `WebService`\
  \ 属性值中的属性赋值：\n\n```\n Namespace = \"http://adventureworks/customers\"\n```\n\n其他可能的\
  \ `WebService` 属性包括 `Name` 和 `Description`。`Name` 允许你更改通过 ASP.NET 测试页面向开发者展示 Web\
  \ 服务名称的方式（测试页面将在本章稍后部分讨论）。`Description` 允许你为 Web 服务提供文本描述。该描述也会出现在 ASP.NET Web 服务测试页面上。如果你的\
  \ `WebService` 属性包含多个属性，请使用逗号分隔属性。这是一个示例：\n\n```\n <WebService(Namespace:=\"http://adventureworks/customers\"\
  , Name:=\"GetCustomers\")>\n```\n\n### WebMethod 属性\n\n在列表 13-5 中，名为 `Customers`\
  \ 的类只有一个 `WebMethod`。`WebService` 类可以包含任意数量的 `WebMethod`，或者包含标准方法与通过在方法声明之前的属性启用的\
  \ `WebMethod` 方法的混合。只有跨 HTTP 传输访问的方法是那些应用了 `WebMethod` 属性的方法。\n\n与 `WebService`\
  \ 属性一样，`WebMethod` 也可以包含一些属性，如下列表所示：\n\n- `BufferResponse`: 当将 `BufferResponse`\
  \ 设置为 `True` 时，来自 XML Web 响应将留在内存中并作为完整包发送。如果设置为 `False`（默认设置），则响应在服务器上构建时直接发送给客户端。\n\
  - `CacheDuration`: 指定响应在系统缓存中保留的秒数。默认设置为 `0`，这意味着禁缓存。将 XML Web 服务的响应放入缓存可以提高 Web\
  \ 服务的性能。\n- `Description`: 为 `WebMethod` 应用文本描述，该描述会出现在 XML Web 服务的 `.aspx` 测试页面上。\n\
  - `EnableSession`: 将 `EnableSession` 设置为 `True` 可为特定的 `WebMethod` 会话状态。默认设置为 `False`。\n\
  - `MessageName`: 为 `WebMethod` 应用唯一名称。如果你正在处理重载的 `WebMethod`（本章稍后讨论），则需要此步骤。\n-\
  \ `TransactionOption`: 指定 `WebMethod` 的事务支持。默认设置为 `Disabled`。如果 `WebMethod` 是启动事务的根对象，则\
  \ Web 服务可以参与到另一个需要事务的 `WebMethod`事务中。其他可能的值包括 `NotSupported`、`Supported`、`Required`\
  \ 和 `RequiresNew`。\n\n### XML Web 服务接口\n\n来自列表 13-5 的 Customers Web 服务只有一个 `WebMethod`，它返回一个包含\
  \ SQL Server AdventureWorks 数据库中完整 `Customers` 表的 DataSet。\n\n在浏览器中运行 `Customers.asmx`\
  \ 会弹出 ASP.NET Web 服务测试页面。这个你的 Web 服务的视觉界面实际上用于测试目的，或者作为对调用你提供的 Web 服务感兴趣的开发者的参考页面。图\
  \ 13-3 显示为 `Customers.asmx` 服务的 `GetCustomers WebMethod` 生成的页面。\n\n![image](img/f462-01.jpg)\n\
  \n**图 13-3**\n\n该接口在页面顶部的蓝色条（此黑白图像中的深色条）显示 Web 服务的名称。除非你通过前面定义的 `WebService` 属性的\
