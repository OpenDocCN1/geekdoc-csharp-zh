  \ Rickstrahl: `@rickstrahl`\n30. Csharp: `@csharp`\n\n## 使用 NuGet 扩展 Visual Studio\n\
  \n多年年来，.NET 社区开发了大量的复用库和工具来帮助开发者完成任务。许多第三方库以开源项目的形式发布。事实上，.NET 已经成为一个蓬勃发展的开源平台。\n\
  \n在 .NET 开发的各个方面，复用库（无论开源还是否）都已成为功能的重要来源。这一事实在涉及第三方 .NET 和 JavaScript 库的 Web 开发中尤为明显。事实上，Visual\
  \ Studio 的许多项目模板都包含了第三方库。\n\n将这些库整合到你的项目中可以简单地包含一个或多个引用。但通常情况下，事实并非如此。如果你还不知道能提供所需功能的库，你需要寻找一个。一旦你找到了特定的库，就需要下载它。通常你需要在多个版本或选项中选择正确的下载项。下载后不要忘记解除文件的锁定。你应该根据下载提供的哈希值对文件进行验证。然后，你需要将文件解压到解决方案中的一个文件夹内。通常你会创建一个\
  \ `lib` 文件夹来解压文件。你需要在解决方案管理器中添加新解压的程序集或程序集的引用。现在开始在 `app.config` 或 `web.config`\
  \ 文件中设置正确的配置，并编写库所需的任何初始化代码。确定正确的配置通常需要阅读文档或研究论坛。\n\n随着这些库的发展，它们会整合并依赖其他库，而这些库可能也需要配置。依赖越多，配置问题就越多。\n\
  \nNuGet 是 Visual Studio 的一个扩展，方便在使用 .NET 项目中添加、删除和更新库以及工具。\n\nNuGet 允许构建库的开发者将其库“打包”并存储在便于他人查找的仓库中。包（.nupkg\
  \ 文件）包含了在解决方案中安装和配置该库所需的所有内容。仓库中的所有包都封装成馈，可以通过 NuGet 网站或直接通过 Visual Studio 访问。正在寻找库的开发者可以搜索馈，并通过命令行界面或图形界面安装包。\n\
  \n\n\n\n\n在 Visual Studio 2012 之前，`NuGet` 是通过 Visual Studio 扩展管理器安装的。然而，Visual Studio\
  \ 2012 已经内置了 `NuGet` 客户端。为了验证你已安装了 `NuGet` 并在必要时安装 `NuGet`，可以使用 Visual Studio 扩展管理器。图\
  \ G-1 显示了 Visual Studio 中的扩展管理器，其中列出了当前安装的扩展。\n\n![image](img/f1310-01.jpg)\n\n\
  **图 G-1**\n\n当当有新版本可用时，扩展管理器也用于更新 `NuGet`。如果 `NuGet` 有可用更新，你可以在扩展管理器的“更新”（Updates）选项卡中看到它。图\
  \ G-2 显示了显示 `NuGet` 更新的扩展管理器。你可以直接从该界面安装更新。\n\n![image](img/f1311-01.jpg)\n\n**图\
  \ G-2**\n\n一旦安装了 `NuGet`，你就可以“管理 NuGet 包”（Manage NuGet Packages）窗口或在包管理器控制台中使用 `PowerShell`\
  \ 命令来查找、安装和管理包。\n\n### 使用窗口管理 NuGet 包\n\nVisual Studio 的 `NuGet` 客户端通过“管理 NuGet\
  \ 包”窗口提供图形化界面。要使用该界面，你需要在 Visual Studio 中加载解决方案。为了本示例，请创建一个新的 ASP.NET MVC 4 Web\
  \ 应用程序，并选择“Internet ”作为模板类型。要打开“管理 NuGet 包”窗口，右键点击项目并选择“管理 NuGet 包”。图 G-3](#Appendix07.xhtml_figureG-3)显示了“管理\
  \ NuGet 包”窗口。\n\n![image](img/f1311-02.jpg)\n\n**图 G-3**\n\n注意，已经加载了许多包。Visual Studio\
  \ 中的许多项目模板也使用 `NuGet` 包在新项目中包含某些第三方和开源库。如图 G-3 所示，窗口左侧包含多个标签卡，允许开发者不仅可以查看当前安装的包，还可以查看可安装的包。你还可以查看任何已安装的包是否有更新。\n\
  \n点击“在线”（Online）标签卡查看可安装的包。图 G-4](#Appendix07.xhtml_figureG-4)显示了选定“在线”标签卡的窗口。\n\
  \n![image](img/f1312-01.jpg)\n\n**图 G-4**\n\n在图 G-4 中有几点需要注意。首先要提到的是，列表中某些包在包项右上角有绿色勾号。这些勾号表示该包已安装在当前项目中。当某个包可以安装时，高亮该包会显示一个“安装”（Install）按钮。高亮包还会窗口右侧窗格中显示更多关于该包的信息。\n\
  \n`NuGet` 包发布在 `NuGet` 仓库中。仓库将包组合成一个馈送（feed），这最终显示在可用包列表中。这些仓库被称为“包源”（package sources）。在图\
  \ G-4 中，你可以看到“在线”标签卡下有一个默认包源。默认包源由 Microsoft 托管，命名为“NuGet 官方包源”。可以添加额外的包源。你还可以启用和禁用包源。这允许你在无需删除包源的情况下临时防止某个包源在列表中显示。要修改包源，你需要进入包管理器的设置。点击“管理包”窗口左下角的“设置”（Settings）按钮打开“选项”（Options）窗口。图\
  \ G-5](#Appendix07.xhtml_figureG-5)显示了选了“包源”设置的“选项”窗口。\n\n![image](img/f1313-01.jpg)\n\
  \n**图 G-5**\n\n要添加新包源，请输入包源名称及其源 URL。请注意，你也可以为该源输入文件夹路径。包含 `NuGet` 包的文件夹被视为有效的包源。不同类型的包源将在本附录稍后介绍。图\
  \ G-6](#Appendix07.xhtml_figureG-6)显示了添加了由 Phil Haack 托管的示例 NuGet 包源后的“选项”窗口。新包源名为\
  \ Haacked Sample。\n\n![image](img/f1313-02.jpg)\n\n**图 G-6**\n\n关闭“选项”窗口后，“管理 NuGet\
  \ 包”窗口中的馈送将刷新。现在，它包含了来自 Haacked Sample 包源的包。默认情况下，所有来自所有启用包源的包都显示在列表中，并在必要时可以分页查看。你可以选择单个包源以仅显示其包。图\
  \ G-7](#Appendix07.xhtml_figureG-7)显示了仅来自 Haacked Sample 包源的可用包。\n\n![image](img/f1314-01.jpg)\n\
  \n**图 G-7**\n\n### 安装 NuGet 包\n\n安装包只需点击包上的“安装”按钮。但当你安装包时到底发生了什么？为了查看某些依赖项，查找 ELMAH。`ELMAH`\
  \ 为 ASP.NET 应用程序提供全范围日志记录。图 G-8](#Appendix07.xhtml_figureG-8)显示了搜索 ELMAH 的结果。\n\n\
  ![image](img/f1314-02.jpg)\n\n**图 G-8**\n\n点击“安装”按钮将开始包的下载和安装。安装包时发生的额外情况之一是它依赖的任何包也会下载并安装。例如，图\
  \ G-9](#Appendix07.xhtml_figureG-9)显示了下载和安装期间显示的窗口。\n\n![image](img/f1315-01.jpg)\n\
  \n**图 G-9**\n\n注意对大于 1.2.2 版本的 `elcorelibrary` 的依赖。ELMAH 依赖的包 `elcorelibrary` 也会被下载并安装。你不需要任何特殊操作让这一切发生。`NuGet`\
  \ 包包含此依赖信息，并处理依赖项的位置和安装。安装完成后，ELMAH 包旁边会显示绿色勾号，表示其已安装。有时安装包后，Visual Studio 会显示一个文本文件，其中包含额外的说明或更改指示。一旦安装了包，你就可以立即在应用程序中使用该库。\n\
  \n那么在安装包时到底发生了什么？图 G-10](#Appendix07.xhtml_figureG-10)显示项目中添加了 ELMAH 程序集的引用。\n\n\
  ![image](img/f1315-02.jpg)\n\n**图 G-10**\n\n不仅引用了程序集，还对 `web.config` 文件进行了修改，以支持和配置\
  \ ELMAH 及其提供的处理器和模块。图 G-11](#Appendix07.xhtml_figureG-11)显示了由 NuGet 包修改的 `web.config`\
  \ 文件部分。\n\n![image](img/f1315-03.jpg)\n\n**图 G-11**\n\n\n\n\n你在项目中安装的第一个包会创建一个 `Packages`\
  \ 文件夹。对于每个安装的包，该文件夹内都会创建一个相应的子文件夹。在这个特定的示例中，你创建的项目的 Visual Studio 模板已经预安装了一些包，因此该文件夹已经存在了。如果有解决方案（solution）文件夹，该文件夹将位于解决方案文件夹中。如果你的项目没有解决方案文件夹，`Packages`\
  \ 文件夹将在项目文件夹中创建。当你安装 `ELMAH` 包时，创建了两个子文件夹。一个是为 `ELMAH` 创建的，另一个是为它依赖的包 `ELMAH` 核心库创建的。图\
  \ G-12 显示了 `Packages` 文件夹的内容，展示了由 `ELMAH` NuGet 包创建的子文件夹。\n\n![image](img/f1316-01.jpg)\n\
  \n**图 G-12**\n\n这些子文件夹中的每一个都包含包安装的所有文件，包括程序集、定义必要的配置更改的转换文件、支持性文件以及包文件本身。\n\n##\
  \ 卸载 NuGet 包\n\n那么，如果你想移除或卸载一个包该怎么办？移除包和安装包一样简单。再次打开`Manage NuGet Packages`窗口并选择`Installed\
  \ Packages`（已安装包）选项卡。图 G-13 显示了选择了已安装的 `ELMAH` 包的 `Manage NuGet Packages`窗口。\n\n\
  ![image](img/f1316-02.jpg)\n\n**图 G-13**\n\n任何已安装的包上都有一个 `Uninstall`（卸载）按钮。请注意，`Uninstall`按钮只在`Installed\
  \ Packages`选项卡中显示。如果你的解决方案中有多个项目，你将看到`Manage`（管理）按钮而不是`Uninstall`按钮。这种情况将在本附录稍后部分进行详细介绍。点击`Uninstall`按钮。如果该包依赖于其他包，将显示一个窗口，列出与原始包一起安装的所有包，并询问你是否也卸载它们。图\
  \ G-14 显示了卸载 `ELMAH` 包时显示的窗口。\n\n![image](img/f1317-01.jpg)\n\n**图 G-14**\n\n选择`Yes`以卸载依赖包。将显示一个卸载进度窗口，它类似于图\
  \ G-9 所示的安装进度窗口。一旦包（或包）被卸载，对程序集的引用将被移除，`web.config`文件中的任何更改将被移除，`Packages`文件夹中的子文件夹也将被移除。\n\
  \n## 在解决方案级别管理包\n\n上一个示例为解决方案中的 ASP.NET MVC 项目安装了 `ELMAH` 包。然而，如果一个解决方案中有多个项目怎么办？你也可以在解决方案级别管理包。如果你一直在跟随本附录操作，请向你使用的解决方案中添加另一个项目。在这种情况下，类库项目是一个很好的选择。向解决方案中添加另一个项目后，右键点击解决方案。在右菜单中，你看到的不是`Manage\
  \ NuGet Packages`选项，而是`Manage NuGet Packages for Solution`（管理解决方案的 NuGet 包）选项。图\
  \ G-15 显示了包含新菜单选项的右菜单。\n\n![image](img/f1317-02.jpg)\n\n**图 G-15**\n\n点击此新菜单选项将像以前一样打开`Manage\
  \ NuGet Packages`窗口。你看到的区别是，在查看当前安装包的列表时，选择一个包后，`Install`按钮现在变成了`Manage`按钮。\n\n\
  点击任何已安装包的`Manage`按钮将显示`Select Projects`（选择项目）窗口。图 G-16 显示了`Select Projects`窗口。\n\
  \n![image](img/f1317-03.jpg)\n\n**图 G-16**\n\n正如你可能猜到的那样，`Select Projects`窗口允许你选择将包安装到哪些项目。。同一个窗口也用于从解决方案中的项目中移除包。如果你想安装一个新包，其过程与为单个项目安装包相同，唯一的区别是这个`Select\
  \ Projects`窗口。当你从解决方案版本的`Package Manager`安装包时，系统会提示你选择想要为哪些项目安装该包。\n\n将包安装到多个项目中是图\
  \ G-12 所示的`Packages`文件夹被放置在解决方案文件夹中的原因之一。如果你向解决方案中的多个项目安装包，你不希望拥有相同文件的多个副本。每个使用该包的项目只需引用其位于单一解决方案级别位置的文件即可。\n\
  \n## 使用控制台管理 NuGet 包\n\n如果你倾向于不使用图形界面，或者你是一个倾向于使用键盘而不是鼠标的开发者，你也可以使用`PowerShell`命令处理\
  \ NuGet 包。有一个用于处理 NuGet 的控制台界面。要打开控制台，从 Visual Studio 菜单选择`Tools`（工具）>`Package Manager`（包管理器）>`Package\
  \ Console`（包控制台）。这将打开图 G-17 所示的窗口。\n\n![image](img/f1318-01.jpg)\n\nPackage Console\
  \ 有两个下拉列表。第一个允许你选择命令将使用的源。第二个允许你选择命令将操作的项目。这些默认值可以通过参数进行覆盖。你可能想执行的操作是查看可用包。以下命令列出了所选源的所有包：\n\
  \n```\nGet-Package -ListAvailable\n```\n\n由于此命令列出了所有可用包，它会滚动直到显示所有包。你可以点击红色符号停止包列表。显示整个列表可能没有帮助。你可以通过`Filter`参数来过滤结果。你可以将上一个示例中搜索框中的术语作为`Filter`参数的参数。以下命令显示了如何搜索`ELMAH`包：\n\
  \n```\nGet-Package -Filter Elmah -ListAvailable\n```\n\n运行此命令将列出描述或标题中包含“elmah”的所有包。图\
  \ G-18 显示了运行此命令的结果。\n\n![image](img/f1319-01.jpg)\n\n**图 G-18**\n\n如果你想了解更多关于`Get-Package`命令的信息，可以使用`Get-Help`命令列出参数并获取命令描述。以下命令显示了`Get-Package`命令的帮助：\n\
  \n```\nGet-Help Get-Package\n```\n\n现在你已经找到了想要安装的包，你需要安装它。用于安装包的命令是`Install-Package`。从图\
  \ G-18 所示的可用包列表中，你可以看到名为`elmah`的包。要安装`elmah`包，你使用此命令：\n\n```\nInstall-Package elmah\n\
  ```\n\n\n\n\n这将在 `Default Project`（默认项目）下拉列表中所选的默认项目中安装 `elmah` 包。与使用包管理器（Package\
  \ Manager）窗口安装包一样，如果你要安装的包与其他包有依赖关系，这些包也将被下载并安装。图 G-19 显示了运行之前的安装命令的结果。\n\n![image](img/f1319-02.jpg)\n\
  \n**图 G-19**\n\n注意，系统检测到了对 `elmah.corelibrary` 的依赖，该包在无需你进行任何特殊操作的情况下也被安装了。\n\n\
  若要查看已安装的包列表，你可以只需运行不带参数的 `Get-Package` 命令。图 G-20 显示了运行此命令的结果。\n\n![image](img/f1320-01.jpg)\n\
  \n**图 G-20**\n\n一旦你安装了包，可能需要将其更新到最新版本。你可以使用 `Get-Package` 命令的 `Updates` 参数查看可用的更新列表。可以使用以下命令来确定已安装包是否有任何更新：\n\
  \n```\nGet-Package -Updates\n```\n\n图 G-21 显示了运行此命令查看任何可用更新的结果。\n\n![image](img/f1320-02.jpg)\n\
  \n**图 G-21**\n\n你从 图 G-21 中可以看到 jQuery 包有可用的更新。若要更新包，你可以使用 `Update-Package` 命令。与安装命令一样，你只需将想要更新的包的名称传递给更新命令。若要更新\
  \ jQuery 包，运行以下命令：\n\n```\nUpdate-Package jQuery\n```\n\n图 G-22 显示了运行此更新命令的结果。\n\
  \n![image](img/f1321-01.jpg)\n\n**图 G-22**\n\n你还可以使用控制台删除包。若要删除包，请使用 `Uninstall-Package`\
  \ 命令。与安装和更新命令一样，卸载命令仅接受你想要删除的包名称作为参数。例如，若要删除之前安装的 `elmah` 包，运行以下命令：\n\n```\nUninstall-Package\
  \ elmah\n```\n\n## 创建 NUGET 包\n\n创建 NuGet 包的第一步是创建一个或多个你想发布为 NuGet 包的程序集（assemblies）。例如，你可以创建一个包含单个类的简单类库项目。出于本示例的目的，列表\
  \ G-1 显示了可以用于创建简单类的示例代码。\n\n一旦你有了想要用于构建 NuGet 包的一个或多个程序集，你就需要下载 `NuGet.exe` 引导程序（bootstrapper）来创建你的包。你可以在\
  \ NuGet CodePlex 网站找到 NuGet 引导程序，位于 [`nuget.codeplex.com](http://nuget.codeplex.com)\
  \ 的下载页面。下载 `NuGet.exe` 并将其放置在可以访问的地方。要测试 NuGet 是否可用，请打开命令提示符并输入 `nuget help` 以获取\
  \ NuGet 引导程序的帮助。\n\n如果你打算将 NuGet 包发布到需要 API 密钥的 NuGet 仓库（例如默认 NuGet 仓库），你需要获取一个\
  \ API 密钥来标识该包属于你。若要获取默认 NuGet 仓库的 API 密钥，请前往 [`www.nuget.org](http://www.nuget.org)\
  \ 并注册。完成后，你将在我的账户（My Account）页面找到你的 API 密钥。图 G-23 显示了隐藏了 API 密钥的账户页面。\n\n![image](img/f1322-01.jpg)\n\
  \n**图 G-23**\n\n一旦你拥有了自己的 API 密钥，可以使用 `setApiKey` 参数运行 NuGet，使其记住你的 API 密钥。这样，你就不需要每次创建\
  \ NuGet 包时指定密钥。以下命令将使 NuGet 记住你的 API 密钥，其中 `your-key` 应替换为你的实际 API 密钥：\n\n```\n\
  nuget setApiKey your-key\n```\n\n创建 NuGet 包有多种方法。使用哪种方法取决于你的库的复杂程度。创建 NuGet 包的第一步是创建清单文件，其扩展名为\
  \ `.nuspec`。`.nuspec` 文件是一个 XML 清单，描述了 NuGet 包及其所需的任何依赖关系。\n\n### 从程序集创建 NuGet 包\n\
  \n你可以从单个程序集创建 `.nuspec` 文件。若要为单个程序集创建此文件，你需要调用 NuGet 可执行文件并带有 `spec` 参数以及程序集的路径。从示例程序集生成\
  \ `.nuspec` 文件的命令如下：\n\n```\nnuget spec NugetMath.dll\n```\n\n运行此命令后，将生成一个新文件 `NugetMath.dll.nuspec。列表\
  \ G-2 显示了由该命令生成的内容。`.nuspec` 文件的部分内容是默认的。然而，另一部分内容是从程序集的元数据生成的。你在创建 `.nuspec` 时引用程序集，仅仅是为了使用元数据自动填充\
  \ `.nuspec` 的内容。你可以根据需要编辑该文件。你可以在 [NuGet.org](http://NuGet.org) 网站查看 `.nuspec` 文件的完整规范，位于\
  \ [`http://docs.nuget.org/reference/nuspec](http://docs.nuget.org/reference/nuspec)。对于目前，由于你没有依赖项，请直接删除依赖部分。删除可以删除的行，并根据需要编辑其他字段。列表\
  \ G-3 显示了进行相应编辑后的文件内容。\n\n现在你已经有了清单，但在创建 NuGet 包之前还需要完成一个额外的步骤。NuGet 引导程序在创建包时对文件夹和文件使用特定的约定。为了让你的\
  \ NuGet 包在安装到项目时自动创建对程序集的引用，你需要将程序集放在名为 `lib` 的文件夹中。在包含 `.nuspec` 文件的文件夹创建一个名为 `lib`\
  \ 的子文件夹，并将 `NuGetMath.dll` 移动其中。若要为此 `.nuspec` 文件创建包，只需运行带有 `pack` 参数以及 `.nuspec`\
  \ 文件名的 NuGet 命令。你可以在这里看到命令示例：\n\n```\nnuget pack NugetMath.dll.nuspec\n```\n\n此命令生成一个文件\
  \ `NugetMath.dll.1.0.0.nupkg`。这就是你的 NuGet 包文件。`nupkg` 文件只是一个重命名的 `.zip` 文件。如果你将扩展名从\
  \ `.nupkg` 改为 `.zip`，就可以解压该文件查看其内容。你应该会在 ZIP 根目录下看到 `.nuspec` 文件以及其他支持文件和文件夹。你还会看到包含程序集的\
  \ `lib` 子文件夹。现在 `nupkg` 文件可以发布到 NuGet 仓库，并包含在该仓库的可用包源中。\n\n### 从项目创建 NuGet 包\n\n\
  \n\n\n从程序集生成 `.nuspec` 文件是创建所需清单的最简单方法。然而，你可能需要处理稍微复杂一点的情况。例如，如果你在类库项目中安装了一个或多个\
  \ NuGet 程序包，那么这些包就会成为你的 NuGet 包的依赖项。从程序集生成 `.nuspec` 文件将无法包含这些依赖项。在这种情况下，你可以从 .NET\
  \ 项目生成 `.nuspec` 文件。为了演示这一点，请向你的类库项目安装一个 NuGet 程序包。向你的项目安装 `Structuremap`，这是一个开源的依赖注入/反转控制库。如果你的解决方案中有中多个项目，请将你想要安装该包的项目设置为默认项目。你可以在程序包管理器窗口中搜索\
  \ `Structuremap`，或者在程序包管理器控制台中执行以下命令：\n\n```\nInstall-Package structuremap\n```\n\
  \n现在你已经在项目中安装了 NuGet 程序包，并因此创建了对 `Structuremap` 的依赖，你就可以从项目文件生成 `.nuspec` 文件了。这样做会在创建\
  \ NuGet 包时考虑该依赖项。打开控制台窗口并查看包含你的 `.csproj` 或 `.vbproj` 文件的目录。在该目录下执行以下命令：\n\n```\n\
  nuget spec\n```\n\n执行此命令将生成一个 `.nuspec` 文件。如果你查看生成的文件，会发现它与直接从程序集生成的包有所不同。它不是从程序集读取元数据并放入\
  \ `.nuspec` 文件，而是某些元素现在包含了令牌——例如 `$version$`、`$author$` 和 `$description$`——这些令牌在创建程序包时会被替换。这些令牌的值是从项目元数据中获取的，但在你创建程序包之前不会被获取，因为它们的值可能会随时间而变化。`$version$`\
  \ 就是一个很好的例子。你可能还会注意到缺少了 `dependencies` 部分。列表 G-4 显示了生成的 `.nuspec` 文件。\n\n与上一个示例一样，在生成\
  \ `.nuspec` 文件后，你可以根据需要对其进行编辑。在这种情况下，你将删除指示可以删除的行，将作者令牌替换为硬编码值，并更改任何与你的包相关的其他值。所更改的标签在列表\
  \ G-4 中已**加粗**。列表 G-5 显示了编辑后的文件。\n\n一旦按照你的需求编辑了 `.nuspec` 文件，你就可以创建 NuGet 包了。要从项目创建程序包，你将带有\
  \ `pack` 参数和项目文件的名称执行 NuGet：\n\n```\nnuget pack NugetMath.csproj\n```\n\n请注意，在从项目生成\
  \ NuGet 包的情况下，你在创建程序包时指定的是项目文件，而不是 `.nuspec` 文件。`.nuspec` 文件仍会自动包含在包中。如果你将 NuGet\
  \ 包的扩展名更改为 `.zip`，解压文件并查看 `NugetMath.nuspec` 文件，你会发现所有令牌都已被项目元数据中的值替换。由于对 `Structuremap`\
  \ NuGet 程序包有依赖，`dependencies` 部分也已添加，并包含一个 `Structuremap` 依赖项的条目。\n\n### 发布 NuGet\
  \ 包\n\n现在你已经创建了 NuGet 包，你会想要将其发布到仓库。你可以直接在 [`www.nuget.org`](http://www.nuget.org)\
  \ 网站上发布你的 NuGet 包。登录网站并进入你的账户页面后，你可以点击 `Upload Package`（上传程序包）链接并按照在线说明操作。图 G-24\
  \ 显示了“Upload Your Package”（上传你的程序包）页面的一部分。\n\n![image](img/f1326-01.jpg)\n\n**图\
  \ G-24**\n\n对于那些倾向于使用命令行发布包的人，该过程涉及单个命令。一旦你按照描述创建了程序包，你将带有 `push` 参数执行 NuGet。将 NuGet\
  \ 包发布到默认 Microsoft NuGet 仓库的命令所示：\n\n```\nnuget push NugetMath.1.0.0.0.nupkg\n```\n\
  \n此命令假设你之前在调用 NuGet 时已使用 `setApiKey` 参数存储了你的 API 密钥。你可以使用命令行参数覆盖 API 密钥和程序包源位置。\n\
  \n## 托管 NuGet 程序包\n\n如果没有方法找到 NuGet 包，那么 NuGet 包将大用用处。NuGet 仓库通常被称为 `NuGet Gallery`（NuGet\
  \ 画廊）。默认的 NuGet 画廊由微软托管。到目前，本附录处理的是位于 [`www.nuget.org`](http://www.nuget.org) 的这个默认\
  \ NuGet 画廊。位于默认 NuGet 画廊中的包对任何搜索该画廊的人可用。但如果你有一个程序包只想让你自己或你的组织或小组可用怎么办？这里有托管你自己的\
  \ NuGet 画廊的选项。\n\n### 文件共享托管\n\n托管自己的 NuGet 画廊的最简单选项是使用本地文件夹或文件共享。虽然此选项支持必须手动更新的只读画廊，但它是设置私有画廊的一种非常快速的方法。要创建本地画廊，请在本地驱动器上创建一个文件夹。将你希望可用的任何\
  \ NuGet 程序包（`*.nupkg` 文件）复制到文件夹中。就这样。\n\n在图 G-5 所示的 Visual Studio 程序包管理器选项中，添加一个新的包源。指定本地画廊文件夹为源。现在，当你查看可安装的包并指定你添加的包源时，你将看到画廊中的所有包。对于在发布到公共或网络画廊之前测试你的\
  \ NuGet 包，这是一个很好的选项。\n\n在网络驱动器上创建文件共享的方法相同。文件共享画廊的访问可以像其他文件共享一样进行安全保护。无论是将程序包存储在本地文件夹还是网络文件夹中，你必须手动更新或添加包到画廊。你必须手动复制任何包到画廊。你还失去了使用\
  \ OData 查询搜索包的能力，而画廊托管在 IIS 时是可以这样的。\n\n### IIS 托管\n\n托管 NuGet 画廊的下一个选项是在 IIS 上的\
  \ ASP.NET 网站上托管。幸运的是，也许带有讽刺，有一个 NuGet 程序包可以帮助创建画廊。要创建一个托管在 IIS 上的 NuGet 画廊，首先在 Visual\
  \ Studio 中创建一个新的 ASP.NET 空 Web 项目。然后安装 `nuget.server` NuGet 程序包。如果你使用程序包管理器窗口，搜索\
  \ `nuget.server` 包并安装它。如果你使用程序包管理器控制台，使用以下命令安装 `nuget.server` 包：\n\n```\nInstall-Package\
  \ nuget.server\n```\n\n`nuget.server` 包安装文件并创建托管自己的 NuGet 画廊所需的文件夹。默认情况下，包存储在 `Packages`\
  \ 文件夹中。你可以将任何初始包放在该文件夹中并标记为编译内容，以便它们随你的网站一起部署。你可以通过修改 `web.config` 中 `appSettings`\
  \ 部分的 `packagesPath` 键来更改存储程序包的文件夹。另有两个 `appSettings` 控制 NuGet 画廊是否允许使用 `NuGet.exe`\
  \ 引导程序将程序包发布到其中。如果 `requireApiKey` 值为 `false`，则可以在没有 API 密钥的情况下将包发布到画廊。\n\n\n\n\n\
  如果 `requireApiKey` 值被设置为 `true`，则存储库是否接受发布的包取决于 `apiKey` 的值。如果删除了 `apiKey` 设置或其值留为空，则存储库将设为只读模式，且不支持使用\
  \ `NuGet.exe` 发布新包。为了支持发布包，请创建一个强密码并将 `apiKey` 的值设置为该密码。此值是一个共享公钥，可以供任何向存储库发布包的人使用。\n\
  \n在不对默认设置进行任何更改（注释除外）的情况下，存储库已准备好运行。如果你一直在按照本附录的操作进行，请将之前创建的 `NuGetMath` 包复制到 `Packages`\
  \ 文件夹并运行该网站。图 G-25 显示了存储库的默认页面。\n\n![image](img/f1328-01.jpg)\n\n**图 G-25**\n\n\
  请注意图 G-25 中写有“点击此处查看您的包”的行。点击该链接将显示存储库中包的 OData over ATOM 馈送内容。图 G-26 显示了点击该链接后显示的页面。\n\
  \n![image](img/f1328-02.jpg)\n\n**图 G-26**\n\n如果你想测试存储库，可以将图 G-26 中显示的地址作为 Visual\
  \ Studio 中“包管理器”设置中的新包源。发布该网站与发布任何其他网站没有区别。发布后，你将拥有了自己的自己的私有 NuGet 存储库。\n\n# 使用\
  \ NuGet 扩展 Visual Studio\n\n包管理器控制台（Package Manager Console）是 Visual Studio 内部的一个\
  \ PowerShell 控制台。到目前，你一直在使用控制台与 NuGet 交互。你也可以使用控制台与 Visual Studio 交互并实现自动化。通过 NuGet\
  \ 包，你可以向包管理器控制台添加命令，这些命令可以执行独立操作，或与 Visual Studio 及你的项目进行交互。\n\n在关于创建 NuGet 包的上一节中，你使用了\
  \ `Nuget.exe` 引导程序来创建你的包。还有一个用于创建 NuGet 包的 Windows GUI 应用程序。NuGet Package Explorer\
  \ 是一个点击即用的应用程序，它让创建包变得非常简单。它还可以用于查看其他 NuGet 包，以了解更多关于它们结构的知识。NuGet Package Explorer\
  \ 是 CodePlex 项目，可以在 [`npe.codeplex.com`](http://npe.codeplex.com) 找到。你可以从那里下载并安装\
  \ NuGet Package Explorer。\n\n## 创建 PowerShell 脚本文件\n\n作为向包管理器添加命令的示例，你将创建一个 NuGet\
  \ 包，该包将添加一个用于生成可变长度随机密码的命令。创建一个名为 `init.ps1` 的文本文件。`init.ps1` 文件在包首次安装到解决方案时运行。它在每个解决方案中只运行一次。如果在解决方案的多个项目中安装了同一个包，则在这些安装过程中不会运行该脚本。该脚本在每次打开解决方案时都会运行。列表\
  \ G-6 显示了 `init.ps1` 文件的内容。\n\n第一行声明了脚本的参数集。这些参数由 NuGet 传递给脚本。脚本的第二行用于导入 PowerShell\
  \ 模块。此列表指定了一个名为 `GenRandomPassword.psm1` 的脚本。\n\n接下来，你需要创建这个 PowerShell 模块。创建一个名为\
  \ `GenRandomPassword.psm1` 的文件。列表 G-7 显示了 `GenRandomPassword.psm1` 文件的内容。\n\n第一行创建一个\
  \ `System.Random` 对象，该对象被用于下一行定义的 `Get-RndPassword` 函数。`Get-RndPassword` 函数接受单个输入参数，该参数作为传递到\
  \ `ForEach` 的数字范围的上限。`ForEach` 为范围内的每个数字在 33 到 127 之间选取一个随机字符代码，并将该字符添加到变量 `$NewPassword`\
  \ 中。在 `ForEach` 执行完毕后，函数返回生成的 `$NewPassword`。最后一行对函数调用 `Export-Module`，使其在包管理器控制台中可用。\n\
  \n## 向 NuGet 包中添加文件\n\n利用你已创建的两个文件，你将使用 NuGet Package Explorer 创建你的 NuGet 包。打开 NuGet\
  \ Package Explorer。从常用任务（Common tasks）对话框中选择“创建新包（Create a new package）”。图 G-27\
  \ 显示了选择创建新包选项后的 NuGet Package Explorer 。\n\n![image](img/f1330-01.jpg)\n\n**图 G-27**\n\
  \n将 `init.ps1` 和 `GenRandomPassword.psm1` 文件都拖拽到 NuGet Package Explorer 中标题为“包内容（Package\
  \ contents）”的面板上。对于这两个文件，NuGet Package Explorer 都会识别为 PowerShell 脚本，并询问你是否希望将文件放在\
  \ tools 文件夹中。对两个文件都回答“是”，以便 Package Explorer 创建 tools 文件夹并将两个文件都放在其中。现在，你需要编辑包的元数据。\n\
  \n## 编辑 NuGet 包元数据\n\n你需要编辑包的元数据以针对你的特定包进行自定义。从菜单中选择“编辑元数据（Edit Metadata）”。应该编辑的字段字段是\
  \ `Id`。`Id` 字段应设置为你的 NuGet 包的名称。在本例中，将 `Id` 字段更改为 `GenRandomPassword`。图 G-28 显示了编辑元数据后的\
  \ NuGet Explorer。\n\n![image](img/f1330-02.jpg)\n\n**图 G-28**\n\n一旦完成元数据编辑，点击图 G-28\
  \ 中包左上角的勾标记。\n\n## 部署 NuGet 包\n\n现在你可以发布 NuGet 包了。为了将包发布到托管的 NuGet 存储库，你可以使用“发布（Publish）”菜单项。但测试包的最佳方法之一将其保存到本地或文件共享\
  \ NuGet 存储库。从 NuGet Explorer 菜单中选择“保存（Save）”，并将 `.nupkg` 文件保存到上述本地文件夹或文件共享中。\n\n\
  打开包管理器控制台并将包源设置为你的本地库。输入以下命令安装 GenRandomPassword NuGet 包：\n\n```\nInstall-Package\
  \ GenRandomPassword\n```\n\n安装包后，测试你在 NuGet 包中为控制台添加的命令。以下命令将生成一个 12 字符的随机字符串。\n\
  \n```\nGet-RndPassword 12\n```\n\n图 G-29 显示了安装 NuGet 包并执行 NuGet 包添加的命令后的包管理器控制台。\n\
  \n![image](img/f1331-01.jpg)\n\n**图 G-29**\n\n## 总结\n\n在过去，在 .NET 项目中查找、安装和配置库可能是困难的。有了\
  \ NuGet，向项目中添加库的复杂性已大大降低，甚至完全消除。得益于 NuGet 存储库提供的集中式馈送，寻找你所需的所需的各种库也变得简单得多。\n\n\n\
  \n\n\n对于为他人创建库的开发者来说，创建 NuGet 包已成为发布库的一种简单方式，以便它们能够更容易被发现和安装。使用 NuGet 查找和安装库已成为开发者的事实标准。对于那些希望或需要对库的访问和小组标准化进行更多控制的开发小组，有多种\
  \ NuGet 存储库托管选项。这些选项包括创建仅限特定小组或公司内部开发者访问的私有仓库。\n\nNuGet 还可以通过使用 PowerShell 命令为 Visual\
  \ Studio 提供扩展性。NuGet 持续增长，为开源开发者分发其项目提供了一个便捷的渠道。它与 Visual Studio 的集成还助于通过可重用的功能扩展项目，从而节省了时间和资源。\n\
