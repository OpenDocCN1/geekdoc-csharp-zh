  \ = c;\n    }\n\n    // 以磅为单位的货物容量的自动实现属性。\n    public int CargoCap { get; protected\
  \ set; }\n}\n\nclass TruckDemo {\n    static void Main() {\n        // 构造一些卡车。\n\
  \        Truck semi = new Truck(2, 200, 7, 44000);\n        Truck pickup = new Truck(3,\
  \ 28, 15, 2000);\n        double gallons;\n        int dist = 252;\n        gallons\
  \ = semi.FuelNeeded(dist);\n\n        Console.WriteLine(\"半卡可以携带 \" + semi.CargoCap\
  \ + \" 磅.\");\n        Console.WriteLine(\"行驶 \" + dist + \" 英里半卡需要 \" + gallons\
  \ + \" 加仑燃料。\\n\");\n\n        gallons = pickup.FuelNeeded(dist);\n        Console.WriteLine(\"\
  皮卡可以携带 \" + pickup.CargoCap + \" 磅.\");\n        Console.WriteLine(\"行驶 \" + dist\
