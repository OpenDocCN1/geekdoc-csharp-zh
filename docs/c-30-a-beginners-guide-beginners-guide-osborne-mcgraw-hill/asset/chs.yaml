  12. 修改“尝试一试：改进温度转换程序”中的 `FtoCTable` 程序，使其打印一份英寸到米的转换表。显示 12 英尺的转换结果，每次 1 英寸。每 12\
  \ 英寸输出一个空行。（1 米约等于 39.37 英寸。）\n\n# 第 2 章：介绍数据类型和运算符\n\n## 技能与概念\n* C# 的基本类型\n* 格式化输出\n\
  * 字面量\n* 初始化变量\n* 方法的作用域规则\n* 类型转换和强制转换\n* 算术运算符\n* 关系运算符和逻辑运算符\n* 赋值运算符\n* 表达式\n\
  \n任何编程语言的基础都是其数据类型和运算符，C# 也不例外。这些元素定义了语言的限制，并决定了它可以应用于哪些任务类型。正如你所预期的，C# 支持丰富的各种类型和运算符，使其适用于广泛的编程场景。\n\
  \n数据类型和运算符是一个宏大的课题。我们这里从检查 C# 的基础数据类型及其最常用的运算符开始。我们还将仔细查看变量并研究表达式。\n\n### 为什么数据类型很重要\n\
  数据类型在 C# 中特别重要，因为它是一门强类型语言。这意味着所有操作都将由编译器进行类型兼容性检查。非法的操作将不会被编译。因此，强类型检查有助于防止错误并增强可靠性。\n\
  \n为了实现强类型检查，所有变量、表达式和值都有对应的类型。例如，不存在“无类型”变量的概念。此外，值的类型决定了允许对其执行的哪些操作。在一种类型上允许的操作在另一种类型上可能是不允许的。\n\
  \n### C# 的值类型\nC# 包含了两类内置数据类型：`value types`（值类型）和 `reference types`（引用类型）。这两者的区别在于变量包含的内容。对于值类型，变量持有的是实际值，例如\
  \ `101` 或 `98.6`。对于引用类型，变量持有的是对值的引用。\n\n最常用的引用类型是 `class`（类），关于类和引用类型的讨论将推迟稍后进行。这里描述的是值类型。\n\
  \nC# 的核心是表 2-1 所示的 13 种值类型。它们统称为 `simple types`（简单类型）。之所以被称为简单类型，是因为它们由单个值组成。（换句话说，它们不是两个或多个值的组合。）它们构成了\
  \ C# 类型系统的基础，提供了程序运行的基本、低级数据元素。简单类型有时也被称为 `primitive types`（原始类型）。\n\nC# 严格规定了每种简单类型的范围和行为。由于可移植性要求以及为了支持混合语言编程，C#\
  \ 在这方面是非常不妥协的。例如，`int` 在所有执行环境中都是相同的。不需要为了适应特定平台而重写代码。虽然严格规定简单类型的大小在某些环境中可能会导致性能的小幅损失，但为了实现可移植性，这是必要的。\n\
  \n**注意**\n除了简单类型外，C# 还定义了其他三类值类型。这些是枚举（enumerations）、结构（structures）和可空类型（nullable\
  \ types），它们在本书后面的部分都会进行描述。\n\n### 整数\nC# 定义了九种整数类型：`char`、`byte`、`sbyte`、`short`、`ushort`、`int`、`uint`、`long`\
  \ 和 `ulong`。然而，`char` 类型主要用于表示字符，将在稍后讨论。\n\n**表 2-1：C# 简单类型**\n\n| 类型 | 宽度（位） |\
  \ 含义 |\n| :--- | :--- | :--- |\n| `bool` | | 表示真/假值 |\n| `byte` | 8 | 8 位无符号整数 |\n\
  | `char` | | 字符 |\n| `decimal` | | 用于财务计算的数值类型 |\n| `double` | | 双精度浮点数 |\n| `float`\
  \ | | 单精度浮点数 |\n| `int` | | 整数 |\n| `long` | | 长整数 |\n| `sbyte` | 8 | 8 位有符号整数 |\n\
  | `short` | 16 | 短整数 |\n| `uint` | 32 | 无符号整数 |\n| `ulong` | 64 | 无符号长整数 |\n| `ushort`\
  \ | 16 | 无符号短整数 |\n\n如表所示，C# 定义了各种整数类型的有符号和无符号版本。有符号和无符号整数的区别在于高位解释的方式。如果指定有符号整数，C#\
  \ 编译器生成的代码将假设高位是符号位。如果符号位为 0，数字为正；如果是 1，数字为负。负数几乎总是使用*补码*（two’s complement）方法表示。在这种方法中，数字的所有位反转，然后加\
  \ 1。\n\n有符号整数对于许多算法都很重要，但它们的绝对值只有无符号类型的一半。例如，作为 `short`，这里是 32767。对于符号值，如果将高位设置为\
  \ 1，数字将被解释为 –1（假设补码格式）。然而，如果你将其声明为 `ushort`，那么当高位设置为 1 时，数字将变为 65535。\n\n可能最常用的整数类型是\
  \ `int`。`int` 类型的变量通常用于控制循环、索引数组以及通用整数数学。当你需要范围大于 `int` 的整数时，有很多选择。如果你要存储的值是无符号的，可以使用\
  \ `uint`。对于大的有符号值，使用 `long`。对于大的无符号值，使用 `ulong`。\n\n这是一个计算边长为 1 英尺的立方体所包含的立方英寸数的程序。由于此值很大，程序使用\
  \ `long` 变量来持有它。\n\n```csharp\n// 计算 1 英里中的立方英寸。\nusing System;\n\nclass Inches\
  \ {\n    static void Main() {\n        long ci;\n         声明两个 long 变量。\n      \
  \  long im;\n        im = 5280 * 12;\n        ci = im * im * im;\n        Console.WriteLine(\"\
  There are \" + ci + \" cubic inches in cubic mile.\");\n    }\n}\n```\n\n这是程序的输出：\n\
  每立方英里有 25435806105600 立方英寸。\n\n显然，该结果无法存储在 `int` 或 `uint` 变量中。\n\n\n\n\n最小的整数类型是\
  \ `byte` 和 `sbyte`。`byte` 类型是 0 到 255 之间的无符号值。在处理原始二进制数据（例如由某些设备产生的字节流）时，`byte`\
  \ 类型的变量特别有用。对于小的有符号整数，请使用 `sbyte`。以下是一个示例，它使用 `byte` 类型的变量来控制 `for` 循环，生成数字 100\
  \ 的累和：\n\n```csharp\n// Use byte.\n\nusing System;\n\nclass Use_byte {\nstatic void\
  \ Main() {\nbyte x;\nint sum;\nsum = 0;\n// Use a byte variable to control a for\
  \ loop.\nfor(x = 1; x <= 100; x++)\n{\n    sum = sum + x;\n}\nConsole.WriteLine(\"\
  Summation of 100 is \" + sum);\n}\n}\n```\n\n程序的输出显示此处：\n\nSummation of 100 is 5050\n\
  \n由于 `for` 循环仅从 0 运行到 100，这完全在 `byte` 的范围内，因此没有必要使用更大类型的变量来控制它。当然，`byte` 不能被用于存储累加的结果，因为\
  \ 5050 远超出它的范围。这就是为什么 `sum` 是一个 `int`。\n\n当你需要一个比 `byte` 或 `sbyte` 大但比 `int` 或 `uint`\
  \ 小的整数时，请使用 `short` 或 `ushort`。\n\n### 浮点类型\n\n如第 1 章所述，浮点类型可以表示带有小数部分的数字。浮点类型有两种种类：`float`\
  \ 和 `double`，它们分别表示单精度数字和双精度数字。`float` 类型宽度为 32 位，范围从 1.5E–45 到 3.4E+38。`double`\
  \ 类型宽度为 64 位，范围从 5E–324 到 1.7E+308。\n\n在这两者中，`double` 是最常用的。其原因之一是，C# 类库（即 .NET\
  \ Framework 库）中的许多数学函数都使用 `double` 值。\n\n例如，`Sqrt()` 方法（由 `System.Math` 类定义）返回一个\
  \ `double` 值，该值是其 `double` 参数的平方根。在这里，`Sqrt()` 用于在给定两条直角边长度的情况下计算斜边的长度：\n\n```csharp\n\
  /*\nUse the Pythagorean theorem to find the length of the hypotenuse\ngiven the\
  \ lengths of the two opposing sides.\n*/\nusing System;\n\nclass Hypot {\nstatic\
  \ void Main() {\ndouble x, y, z;\nx = 3;\ny = 4;\n// Notice how Sqrt() is called.\
  \ It is preceded by\n// the name of the class of which it is a member.\nz = Math.Sqrt(x*x\
  \ + y*y);\nConsole.WriteLine(\"Hypotenuse is \" + z);\n}\n}\n```\n\n程序的输出显示此处：\n\
  \nHypotenuse is 5\n\n关于前面的示例还有一点。正如提到的，`Sqrt()` 是 `Math` 类的成员。注意 `Sqrt()` 是如何被调用的；它的前面是类名\
  \ `Math`。这与 `Console` 在 `WriteLine()` 之前的情况。虽然并不是标准方法都是通过先指定类名来调用的，但有几个是这样的。\n\n\
  ### decimal 类型\n\n也许 C# 中最有趣的数值类型是 `decimal`，它旨在用于货币计算。`decimal` 类型利用 128 位来表示 1E–28\
  \ 到 7.9E+28 范围内的值。正如你所知，普通的浮点运算在应用于小数值时会产生各种舍入误差。`decimal` 类型消除了这些误差，并可以精确表示最多 28\
  \ 位小数（在某些情况下为 29 位）。这种不产生舍入误差的情况下表示小数的能力使其在涉及资金的计算中特别有用。\n\n这是一个使用 `decimal` 类型进行财务计算的程序。该程序计算了应用利率后的余额。\n\
  \n```csharp\n// Use the decimal type in a financial calculation.\nusing System;\n\
  \nclass UseDecimal {\nstatic void Main() {\ndecimal balance;\ndecimal rate;\n//\
  \ Compute new balance.\n// decimal values must be followed by an m or M.\nbalance\
  \ = 1000.10m;\nrate = 0.1m;\nbalance = balance * rate + balance;\nConsole.WriteLine(\"\
  New balance: $\" + balance);\n}\n}\n```\n\n该程序的输出显示此处：\n\nNew balance: $1100.110\n\
  \n在程序中，注意 decimal 常数后面紧跟着 `m` 或 `M` 后缀。这是必要的，因为如果没有这个后缀，这些值将被解释为标准的浮点常量，而它们与 `decimal`\
  \ 数据类型不兼容。（我们将在本章的稍后部分更详细介绍如何指定数值常量。）\n\n**提问专家**\n\n**Q：我用过的其他计算机语言没有 decimal 数据类型。它是\
  \ C# 特有的吗？**\n\n**A：** C、C++ 或 Java 都不支持 `decimal` 作为内置类型。因此，在其直接的后代谱系中，它是唯一的。\n\
  \n### 字符\n\n在 C# 中，字符并不是像许多其他计算机语言（如 C++）那样的 8 位的。相反，C# 使用 Unicode。Unicode 定义了一个字符集，可以表示在所有人类语言中找到字符。因此，在\
  \ C# 中，`char` 是一个无符号 16 位类型，范围从 0 到 65,535。标准的 8 位 ASCII 字符集是 Unicode 的子集，范围从 0\
  \ 到 127。因此，ASCII 字符仍然是有效的 C# 字符。\n\n可以通过将字符放在单引号内为字符变量赋值。例如，这将 `X` 赋值给变量 `ch`：\n\
  \n```csharp\nchar ch;\nch = 'X';\n```\n\n你可以使用 `WriteLine()` 语句输出 `char` 值。例如，此行输出了\
  \ `ch` 中的值：\n\n```csharp\nConsole.WriteLine(\"This is ch: \" + ch);\n```\n\n尽管 `char`\
  \ 被 C# 定义为整数类型，但在所有情况下，它不能随意地与整数混合。这是因为没有从整数到字符的自动转换。例如，以下片段是无效的：\n\n```csharp\n\
  char ch;\nch = 10; // error，无法工作\n```\n\n### bool 类型\n\n`bool` 类型表示真/假值。C# 使用保留字\
  \ `true` 和 `false` 来定义真和假值。因此，`bool` 类型的变量或表达式将是这两个值之一。此外，`bool` 和整数值之间没有定义转换。例如，1\
  \ 不会转换为 true，0 不会转换为 false。\n\n以下是一个演示 `bool` 类型的程序：\n\n```csharp\n// Demonstrate\
  \ bool values.\nusing System;\n\nclass BoolDemo {\nstatic void Main() {\nbool b;\n\
  b = false;\nConsole.WriteLine(\"b is \" + b);\nb = true;\nConsole.WriteLine(\"b\
  \ is now \" + b);\n// 一个 bool 值可以控制 if 语句。\nif(b) Console.WriteLine(\"This is executed.\"\
  );\n\n一个单一 bool 值可以\nb = false;\n控制 if 语句。\nif(b) Console.WriteLine(\"This is not\
  \ executed.\");\n// 关系运算符的结果是一个 bool 值。\nConsole.WriteLine(\"88 > 17 is \" + (88\
  \ > 17));\n}\n}\n```\n\n该程序生成的输出显示此处：\n\nb is False\n\nb is now True\n\nThis is\
  \ executed.\n\n88 > 17 is True\n\n**提问专家**\n\n**Q：为什么 C# 使用 Unicode？**\n\n**A：**\
  \ C# 的设计是为了允许范围内编写程序。因此，它需要一个可以表示世界上语言的字符集。Unicode 是为此设计的标准字符集。当然，对于英语、德语、西班牙语或法语等语言，使用\
  \ Unicode 是低效的，因为它们的字符可以包含在 8 位内。但这就是全球可移植性的代价。\n\n\n\n关于此程序有三个值得注意的地方。首先，正如你所看到的，当使用\
  \ `WriteLine()` 输出 `bool` 值时，会显示“True”或“False”。其次，`bool` 变量的值本身就足以控制 `if` 语句。你不需要编写像这样的这样的\
  \ `if` 语句：\n\n```csharp\nif(b == true) ...\n```\n\n第三，关系运算符（如 `<`）的结果是一个 `bool`\
  \ 值。这就是为什么表达式 `88 > 17` 显示值为“True”的原因。此外，在 `88 > 17` 外围额外的一组括号是必要的，因为 `+` 运算符的优先级高于\
  \ `>` 运算符。\n\n48\n\nC# 3.0：入门指南\n\n## 输出选项\n\n在继续研究数据类型和操作符之前，一个简短的插叙将很有帮助。目前为止，在输出数据列表时，你一直在使用加号（+）来分隔列表的每个部分，如下所示：\n\
  \n```csharp\nConsole.WriteLine(\"You ordered \" + 2 + \" items at $\" + 3 + \" each.\"\
  );\n```\n\n虽然这种方式非常方便，但以此方式输出数值信息并不能让你对该信息的显示方式进行任何控制。例如，对于浮点值，你无法控制显示的的小位数。考虑以下语句：`Console.WriteLine(\"\
  Here is 10/3: \" + 10.0/3.0);`\n\n它生成了以下输出：\n\nHere is 10/3: 3.33333333333333\n\n\
  虽然这对于某些目的可能还可以，但显示这么多小数对于其他情况可能是不恰当的。例如，在财务计算中，你通常希望显示两位小数。\n\n为了控制数值数据的格式化方式，你需要使用\
  \ `WriteLine()` 的第二种形式（此处所示），它允许你嵌入格式信息：\n\n`WriteLine：“*format* *string*”, *arg0*,\
  \ *arg1*, ... , *argN*)` 在此版本中，`WriteLine()` 的参数是用逗号分隔的，而不是加号。\n\n`*format* *string`\
  \ 包含两个项目：按原样显示的普通打印字符和格式占位符。格式占位符采用以下通用形式：\n\n`{ *argnum*, *width*: *fmt*}`\n\n\
  这里，`argnum` 指定要显示的参数的索引（从零开始）。字段的最小宽度由 `width,` 指定，格式由 `fmt.` 指定。\n\n在执行期间，当在格式字符串中遇到格式占位符时，将根据\
  \ `argnum,` 指定相应的参数进行替换并显示。因此，格式占位符在格式字符串中的位置决定了其匹配数据在何处显示。`width` 和 `fmt` 都是可选的。因此，在最简单的形式下，格式占位符仅指示要显示哪个参数。例如，`{0}`\
  \ 表示 `arg0,`，`{1}` 指定 `arg1,`，以此此类推。\n\n让我们从一个简单的示例开始。语句\n\n```csharp\nConsole.WriteLine(\"\
  February has {0} or {1} days.\", 28, 29);\n```\n\n产生以下输出：\n\nFebruary has 28 or\
  \ 29 days.\n\n正如你所看到的，值 28 被替换了 `{0}`，29 被替换了 `{1}`。因此，格式占位符标识了随后的参数（在本例中为 28 和\
  \ 29）在字符串中显示的位置。此外，注意额外的值是用逗号分隔的，而不是加号。\n\n第 2 章：介绍数据类型和操作符\n\n49\n\n这是前述语句的变体，它指定了最小字段宽度：`Console.WriteLine(\"\
  February has {0,10} or {1,5} days.\", 28, 29);`\n\n它产生以下输出：\n\nFebruary has    \
  \    28 or  29 days.\n\n正如你所看到的，添加了空格来填充字段中未使用的部分。记住，最小字段宽度仅仅是：*最小* 宽度。如果需要，输出可以超过该宽度。\n\
  \n在前面的示例中，没有对值本身应用任何格式化。当然，使用格式占位符的意义在于控制数据的外观。最常用的格式化数据类型是浮点值和十进制值。指定格式的最简单方法之一是描述一个\
  \ `WriteLine()` 将使用的模板。要做到这一点，显示一个你想要的格式示例，并使用 # 来标记数字位置。例如，这里有一种显示 10 除以 3 的更好方法：\n\
  \n```csharp\nConsole.WriteLine(\"Here is 10/3: {0:#.##}\", 10.0/3.0);\n```\n\n该语句的输出所示：\n\
  \nHere is 10/3: 3.33\n\n在这个示例中，模板是 `#.##`，它告诉 `WriteLine()` 显示两位小数。\n\n然而，重要的是，如果必要，`WriteLine()`\
  \ 将在小数点左侧显示多于一个数字，以防误导该值。\n\n如果你想显示货币值，请使用 `C` 格式占位符。例如，十进制余额；\n\n```csharp\nbalance\
  \ = 12323.09m;\nConsole.WriteLine(\"Current balance is {0:C}\", balance);\n```\n\
  \n该序列的输出所示（美元格式）：\n\nCurrent balance is $12,323.09\n\n50\n\nC# 3.0：入门指南\n\n### 逐步进行\n\
  \n1. 创建名为 `Mars.cs` 的文件。\n2. 为了计算延迟，你需要浮点值。为什么？因为时间会有小数。程序使用的变量有：\n```csharp\ndouble\
  \ distance;\ndouble lightspeed;\ndouble delay;\ndouble delay_in_min;\n```\n3. 给\
  \ `distance` 和 `lightspeed` 赋值：\n```csharp\ndistance = 34000000; // 34,000,000 miles\n\
  lightspeed = 186000; // 186,000 miles per second\n```\n4. 为了计算延迟，将 `distance` 除以\
  \ `lightspeed`。这产生了秒。将此值赋值 `delay` 并显示结果。\n```csharp\ndelay = distance / lightspeed;\n\
  Console.WriteLine(\"Time delay when talking to Mars: \" + delay + \" seconds.\"\
  );\n```\n5. 将 `delay` 数除以 60 以分钟；使用这些代码行该结果：\n```csharp\ndelay_in_min = delay /\
  \ 60;\nConsole.WriteLine(\"This is \" + delay_in_min + \" minutes.\");\n```\n\n\
  这是完整的 `Mars.cs` 列表：\n\n```csharp\n// Talk to Mars\nusing System;\n\nclass Mars {\n\
  \    static void Main() {\n        double distance;\n        double lightspeed;\n\
  \        double delay;\n        double delay_in_min;\n\n        distance = 34000000;\
  \ // 34,000,000 miles\n        lightspeed = 186000; // 186,000 miles per second\n\
  \n        delay = distance / lightspeed;\n\n        Console.WriteLine(\"Time delay\
  \ when talking to Mars: \" + delay + \" seconds.\");\n\n        delay_in_min = delay\
  \ / 60;\n\n        Console.WriteLine(\"This is \" + delay_in_min + \" minutes.\"\
  );\n    }\n}\n```\n\n6. 编译并运行程序。显示以下结果：\n\nTime delay when talking to Mars: 182.795698924731\
  \ seconds.\n\nThis is 3.04659498207885 minutes.\n\n7. 对于大多数人来说，程序显示的小数过多。为了提高程序的可读性，用以下\
  \ `WriteLine()` 替换程序中的语句：\n\n```csharp\nConsole.WriteLine(\"Time delay when talking\
  \ to Mars: {0:#.###} seconds\", delay);\nConsole.WriteLine(\"This is about {0:#.###}\
  \ minutes\", delay_in_min);\n```\n\n8. 重新编译并运行程序。当你这样做时，你会看到以下输出：\n\nTime delay\
  \ when talking to Mars: 182.796 seconds\n\nThis is about 3.047 minutes\n\n现在，只显示了三位小数。\n\
  \nLiterals\n\n\n\n\n在 C# 中，`literals`（字面量）是指以可读形式表示的固定值。例如，数字 `100`就是一个字面量。大多数情况下，字面量及其用法是非常直观的，因此之前所有的示例程序都以某种形式使用过它们。现在是时候正式对它们进行解释了。\n\
  \nC# 字面量可以是任何值类型。每个字面量的表示方式取决于它的类型。正如前面解释过的，字符字面量包含在单引号之间。例如 `‘a’` 和 `‘%’` 都是字符字面量。\n\
  \n整数字面量指定为不带小数部分的数字。例如，`10` 和 `-100` 是整数字面量。浮点字面量需要使用小数点以及数字的小数部分。例如，`11.123` 是一个浮点字面量。C#\
  \ 还允许你对浮点数使用科学计数法。\n\n由于 C# 是一种强类型语言，字面量也有类型。自然地，这引出了以下问题：数值字面量的类型是什么？例如，`12`、`123987`\
  \ 或 `0.23` 的类型是什么？幸运的是，C# 指定了一些易于遵循的规则来回答这些问题。\n\n### 数值类型\n\n首先，对于整数字面量，字面量的类型是容纳它的最小整数类型，从\
  \ `int` 开始。因此，整数字面量的类型为 `int`、`uint`、`long` 或 `ulong`，取决于它的值。其次，浮点字面量的类型为 `double`。\n\
  \n如果 C# 的默认类型不是你所需的字面量，你可以通过包含后缀来显式指定其类型。要指定 `long` 字面量，请附加 `l` 或 `L`。例如，`12` 是\
  \ `int`，但 `12L` 是 `long`。要指定无符号整数值，附加 `u` 或 `U`。因此 `100` 是 `int`，但 `100U` 是 `uint`。要指定无符号长整数，使用\
  \ `ul` 或 `UL`。例如，`984375UL` 的类型为 `ulong`。\n\n要指定 `float` 字面量，附加 `F` 或 `f`。例如，`10.19F`\
  \ 的类型为 `float`。虽然是多的，但你可以通过附加 `D` 或 `d` 来指定 `double` 字面量。（如刚才提到的，浮点字面量默认为 `double`。）\n\
  \n要指定 `decimal` 字面量，在其值后跟随 `m` 或 `M`。例如，`9.95M` 是一个 `decimal` 字面量。\n\n虽然整数字面量默认创建\
  \ `int`、`uint`、`long` 或 `ulong` 值，只要赋值的值可以用目标类型表示，它们仍然可以赋值给 `byte`、`sbyte`、`short`\
  \ 或 `ushort` 类型的变量。\n\n### 十进制字面量\n\n在编程中，有时使用基于 16 而不是 10 的数字系统更方便。16 进制系统称为 `hexadecimal`（十六进制），使用数字\
  \ `0` 到 `9` 加上字母 `A` 到 `F`，分别代表 10、11、12、13、14 和 15。例如，十六进制数 `10` 在十进制中是 `16`。由于十六进制数的使用频繁，C#\
  \ 允许你以十六进制格式指定整数字面量。十六进制字面量必须以 `0x`（一个零后跟一个 `x`）。以下是一些示例：\n\n```\ncount = 0xFF;\
  \ // 十进制为 255\nincr = 0x1a; // 十进制为 26\n```\n\n### 字符转义序列\n\n将字符常量放在单引号中对于大多数打印字符有效，但少数字符（如回车符）在使用文本编辑器时会产生特殊问题。此外，其他某些字符（如单引号和双引号）在\
  \ C# 中有特殊含义，因此你不能直接使用它们。出于这些原因，C# 提供了特殊的 `escape sequences`（转义序列），如表 2-2 所示。这些序列用于代替它们代表的字符。\n\
  \n例如，这为 `ch` 分配了制表符：\n\n```csharp\nch = '\\t';\n```\n\n下一个示例为 `ch` 分配了单引号：\n\n```csharp\n\
  ch = '\\'';\n```\n\n| 转义序列 | 说明 |\n| :--- | :--- |\n| `\\a` | 警报（铃声） |\n| `\\b`\
  \ | 退格 |\n| `\\f` | 分页 |\n| `\\n` | 换行（行符） |\n| `\\r` | 回车 |\n| `\\t` | 水平制表符 |\n\
  | `\\v` | 垂直制表符 |\n| `\\0` | 空字符 |\n| `\\'` | 单引号 |\n| `\\\"` | 双引号 |\n| `\\\\`\
  \ | 反斜杠 |\n\n### 字符串字面量\n\nC# 支持另一种字面量：字符串。字符串字面量是用双引号括的一组字符。例如，`\"this is a test\"\
  ` 是一个字符串。你在之前的示例程序的许多 `WriteLine()` 语句中见过字符串的示例。\n\n除了普通字符外，字符串字面量还可以包含一个或多个上述转义序列。例如，考虑以下程序。它使用了\
  \ `\\n` 和 `\\t` 转义序列。\n\n**专家问答**\n**Q：我知道 C++ 允许整数字面量以八进制（基于 8 的数字系统）指定。C# 允许吗？**\n\
  **A：不允许。C# 仅允许以十进制指定整数字面量。**\n\n```csharp\nusing System;\n\nclass StrDemo {\n  \
  \  static void Main() {\n        Console.WriteLine(\"First line\\nSecond line\"\
  );\n        Console.WriteLine(\"A\\tB\\tC\");\n        Console.WriteLine(\"D\\tE\\\
  tF\");\n    }\n}\n```\n\n输出为：\n```\nFirst line\nSecond line\nA       C\nD      \
  \ F\n```\n\n### 字面字符串字面量\n\n除了上述的字符串字面量，你还可以指定 `verbatim string literal`。字面字符串以\
  \ `@` 开头，后面跟着引号字符串的内容原样接受且可以跨行。因此，你可以包含换行符、制表符等，但不需要使用转义序列。唯一的例外是，为了获得双引号（\"),你必须使用两个双引号（\"\
  \"）。这是一个演示字面字符串字面量的程序：\n\n```csharp\nusing System;\n\nclass Verbatim {\n    static\
  \ void Main() {\n        Console.WriteLine(@\"This is a verbatim\nstring literal\n\
  that spans several lines.\nembedded newlines.\n\");\n        Console.WriteLine(@\"\
  Here is some tabbed output:\n1 2 3 4\nThis one contains\n5 6 7 8\nembedded tabs,\
  \ too.\n\");\n        Console.WriteLine(@\"Programmers say, \"\"I like C#\".\");\n\
  \    }\n}\n```\n\n该程序的输出为：\n```\nThis is a verbatim\nstring literal\nthat spans\
  \ several lines.\nembedded newlines.\nHere is some tabbed output:\n1 2 3 4\nThis\
  \ one contains\n5 6 7 8\nembedded tabs, too.\nProgrammers say, \"I like C#.\"\n\
  ```\n\n上述程序需要注意的重要点是，字面字符串是按照它们输入程序的方式精确显示的。\n\n### 深入观察变量\n\n变量在第 1 章中介绍。正如你所学的，变量使用这种语句形式进行声明：\n\
  \n```csharp\ntype var-name;\n```\n\n\n\n\n其中 `type` 是变量的数据类型，`var-name` 是它的名称。你可以声明任何有效类型的变量，包括前面描述的值类型。需要重要的是，变量的功能是由其类型决定的。例如，类型为\
  \ `bool` 的变量不能用于存储浮点值。此外，变量的类型在其整个生命周期内不能改变。例如，一个 `int` 变量不能变成 `char` 变量。\n\nC#\
  \ 中的所有变量都必须声明。这是必要的，因为编译器在正确编译使用该变量的语句之前，必须知道该变量包含什么类型的数据。这也使得 C# 能够执行严格的类型检查。\n\
  \nC# 定义了多种不同类型的变量。我们一直在使用的类型被称为*局部**变量*，因为它们是在方法内部声明的。\n\n### 专家问答\n\n**问：由单个字符组成的字符串与字符字面量一样吗？例如，“k”和\
  \ 'k' 是一样的吗？**\n\n**答：** 不一样。你不能将字符串与字符混淆。字符字面量表示单个 `char` 类型的字母。仅包含一个字母的字符串仍然是一个字符串。尽管字符串由字符组成，但它们不是同一种类型。\n\
  \n### 变量初始化\n\n给变量赋值的一种方法是通过赋值语句，正如你所看到的。另一种方法是在声明变量时给它一个初始值。要做到这一点，在变量名后跟一个等号和要赋的值。初始化的通用形式所示：\n\
  \n`type var-name = value;`\n\n在这里，`value` 是在创建 `var-name` 时赋给它的值。该值必须与指定的类型兼容。\n\
  \n以下是一些示例：\n\n```csharp\nint count = 10; // 给 count 赋一个 10 的初始值\nchar ch = 'X';\
  \ // 用字母 X 初始化 ch\nfloat f = 1.2F; // f 初始化为 1.2\n```\n\n当使用逗号分隔的列表声明两个或多个相同类型的变量时，你可以给其中一个或多个变量赋初始值。例如：\n\
  \n```csharp\nint a, b = 8, c = 19, d; // b 和 c 有初始化值\n```\n\n在这种情况下，只有 `b` 和 `c`\
  \ 被初始化了。\n\n### 动态初始化\n\n虽然前面的示例只使用了常量作为初始化器，但 C# 允许使用变量声明处有效的任何表达式对变量进行动态初始化。例如，这里有一个短程序，它根据给定的基底半径和高度计算圆柱的体积：\n\
  \n```csharp\n// 演示动态初始化。\nusing System;\n\nclass DynInit {\n    static void Main()\
  \ {\n        // volume 在运行时动态初始化。\n        double radius = 4, height = 5;\n\n  \
  \      // 动态初始化 volume。\n        double volume = 3.1416 * radius * radius * height;\n\
  \        Console.WriteLine(\"Volume is \" + volume);\n    }\n}\n```\n\n在这里，声明了三个局部变量——`radius`、`height`\
  \ 和 `volume`。前两个变量 `radius` 和 `height` 由常量初始化。然而，`volume` 被动态初始化为圆柱的体积。这里的关键点是，初始化表达式可以使用初始化点有效的任何元素，包括对方法的调用、其他变量或字面量。\n\
  \n### 隐式类型变量\n\n正如所解释，在 C# 中所有变量都必须声明。通常，声明包含变量的类型（如 `int` 或 `bool`），后面跟着变量的名称。然而，从\
  \ C# 3.0 开始，可以让编译器根据用于初始化变量的值来确定变量的类型。这被称为*隐式类型变量*。\n\n隐式类型变量使用关键字 `var` 声明，并且必须被初始化。\n\
  \n编译器使用初始化器的类型来确定变量的类型。这里有一个示例：\n\n`var pi = 3.1416;`\n\n由于 `pi` 用一个浮点数字面量初始化（其默认类型为\
  \ `double`），因此 `pi` 的类型是 `double`。如果 `pi` 是像这样声明的：\n\n`var pi = 3.1416M;`\n\n那么\
  \ `pi` 的类型将是 `decimal`。\n\n下面的程序演示了隐式类型变量：\n\n```csharp\n// 演示隐式类型变量。\nusing System;\n\
  \nclass ImpTypedVar {\n    static void Main() {\n        // 这些是隐式类型变量。\n       \
  \ var pi = 3.1416; // pi 是 double\n        var radius = 10; // radius 是 int\n\n\
  \        // msg 和 msg2 都是字符串类型。\n        var msg = \"Radius: \";\n        var msg2\
  \ = \"Area: \";\n\n        // 显式声明 area 为 double。\n        double area;\n      \
  \  Console.WriteLine(msg2 + radius);\n        area = pi * radius * radius;\n   \
  \     Console.WriteLine(msg + area);\n        Console.WriteLine();\n\n        radius\
  \ = radius + 2;\n        Console.WriteLine(msg2 + radius);\n        area = pi *\
  \ radius * radius;\n        Console.WriteLine(msg + area);\n\n        // 下述语句将无法编译，因为\n\
  \        // radius 是 int 类型，不能赋予浮点\n        // 点值。\n        // radius = 12.2; //\
  \ 错误！\n    }\n}\n```\n\n输出所示：\n\n```\nArea: 10\nRadius: 314.16\nArea: 1256.64\n\
  Radius: 12\nArea: 4523.84\n```\n\n重要的是，隐式类型变量仍然是强类型变量。注意程序中这被注释掉的行：\n\n`// radius\
  \ = 12.2; // 错误!`\n\n此赋值无效，因为 `radius` 是 `int` 类型。因此，它不能被赋一个浮点值。隐式类型变量与“普通”显式类型变量之间的唯一区别在于如何确定类型。一旦确定了类型，该类型在其生命周期内保持固定。\n\
  \n### 变量的作用域和生命周期\n\n到目前为止，我们使用的所有变量都在 `Main()` 方法开始时声明。然而，C# 允许在任何块中声明局部变量。正如第一章解释的那样，块以左大括号开始，以右大括号结束。\n\
  \n块定义了一个*作用域*。因此，每当你开始一个新的块时，你都在创建一个新的作用域。\n\n作用域决定了哪些名称对程序的其他部分可见。它决定了局部变量的生命周期。\n\
  \nC# 中最重要的作用域是由类定义的和由方法定义的。关于类作用域（以及其中声明的变量）的讨论推迟到书的后面，在描述类时进行。目前，我们仅检查方法定义或内部的作用域。\n\
  \n方法定义的作用域从其左大括号开始，到其右大括号结束。然而，如果该方法有参数，它们也被包含在方法定义的作用域内。\n\n\n\n通常情况下，在作用域内部声明的局部变量对于作用域之外的代码不可见。因此，当你在作用域内声明变量时，你阻止了作用域之外的代码访问或修改该变量。事实上，作用域规则为封装提供了基础。\n\
  \n作用域是可以嵌套的。例如，每当你创建一个代码块时，你就创建了一个新的嵌套作用域。当这种情况发生时，外层作用域包含内部作用域。这意味着在外层作用域声明的局部变量对于内部作用域的代码是可见的。\n\
  \n然而，情况并非相反。在内部作用域声明的局部变量在外部可见。\n\n为了理解嵌套作用域的作用，请考虑以下程序：\n\n```cs\n// Demo 块作用域。\n\
  \nusing System;\n\nclass ScopeDemo {\n    static void Main() {\n        int x; //\
  \ Main() 内的所有代码均可见\n        x = 10;\n        if(x == 10) { // 开始新作用域\n         \
  \   int y = 20; // 仅对此块可见\n            // x 和 y 在这里都是可见的。\n            Console.WriteLine(\"\
  x and y: \" + x + \" \" + y);\n            x = y * 2;\n        }\n        // y =\
  \ 100; // 错误！此处不可见 y\n        // 这里，y 已经在它的作用域之外。\n        // x 在这里仍然可见。\n     \
  \   Console.WriteLine(\"x is \" + x);\n    }\n}\n```\n\n正如注释所示，变量 `x` 在 `Main()`\
  \ 作用域的开始处声明，并且对 `Main()` 之后的所有代码均可见。在 `if` 块内部声明了 `y`。由于代码块定义了一个作用域，因此 `y` 只对其块内的其他代码可见。这就是为什么在它的块之外，`y\
  \ = 100;` 这一行被注释掉了。如果你删除开头的注释符号，将会发生编译错误，因为 `y` 在其块外部可见。在 `if` 块内部，可以使用 `x`，因为块内部的代码（即嵌套作用域）可以访问由外层作用域声明的变量。\n\
  \n在块内部，可以在任何点声明局部变量，但它们仅在声明后有效。因此，如果你在方法的开始处定义一个变量，它对该方法内的所有代码都可用。相反，如果你在块的结束处声明变量，那么它实际上是无用的，因为没有代码可以访问它。\n\
  \n如果变量声明包含一个初始化器，则该变量在每次进入声明它的块时都会被重新初始化。例如，考虑此程序：\n\n```cs\n// Demo 变量的生命周期。\n\n\
  using System;\n\nclass VarInitDemo {\n    static void Main() {\n        int x;\n\
  \        for(x = 0; x < 3; x++) {\n            int y = -1; // 每次进入块时 y 被初始化\n  \
  \          Console.WriteLine(\"y is: \" + y); // 这始终打印 -1\n            y = 100;\n\
  \            Console.WriteLine(\"y is now: \" + y);\n        }\n    }\n}\n```\n\n\
  该程序生成的输出所示：\n\n```\ny is: -1\ny is now: 100\ny is: -1\ny is now: 100\ny is: -1\n\
  y is now: 100\n```\n\n如你所示，每次进入 `for` 块时，`y` 都会被重新初始化为 –1。尽管它随后被赋值为 100，但这个值随之丢失了。\n\
  \nC# 的作用域规则中有一个让你感到惊讶的特性：虽然块可以嵌套，但在内部作用域内声明的任何变量都不能与外层作用域声明的变量同名。例如，以下程序尝试声明两个同名的独立变量，该程序将无法编译：\n\
  \n```cs\n/*\n此程序尝试在内部作用域中声明一个\n与外层作用域中定义的变量同名的变量。\n*** 此程序将无法编译。***\n*/\n\nusing\
  \ System;\n\nclass NestVar {\n    static void Main() {\n        int count;\n   \
  \     for(count = 0; count < 10; count = count+1) {\n            Console.WriteLine(\"\
  This is count: \" + count);\n            // 非法！！！这与之前的 count 冲突。\n            int\
  \ count;\n            // 不能再次声明 count，因为它已经被 Main( ) 声明了。\n            for(count\
  \ = 0; count < 2; count++)\n            Console.WriteLine(\"This program is in error!\"\
  );\n        }\n    }\n}\n```\n\n如果你具有 C/C++ 背景，你会知道对内部作用域中声明的变量名称没有限制。因此，在 C/C++\
  \ 中，在外层 `for` 循环块内声明 `count` 是完全有效的。然而，在 C/C++ 中，这种声明会隐藏外层的 `count`。C# 的设计者认为这种类型的名称隐藏很容易导致编程错误，并禁止了它。\n\
  \n## 运算符\n\nC# 提供了丰富的运算符环境。运算符是告诉编译器执行特定数学或逻辑操作的符号。C# 具有四类通用运算符：算术、位运算、关系和逻辑。C#\
  \ 还有许多其他处理某些特殊情况的运算符。本章将检查算术、关系和逻辑运算符。还将检查赋值运算符。位运算和其他特殊运算符将在稍后检查。\n\n### 算术运算符\n\
  \nC# 定义了以下算术运算符：\n\n| 运算符 | 含义 |\n| :--- | :--- |\n| `+` | 加法 |\n| `–` | 减法（负号）\
  \ |\n| `*` | 乘法 |\n| `/` | 除法 |\n| `%` | 取模 |\n| `++` | 自增 |\n| `--` | 递减 |\n\n\
  尽管 `+`、`–`、`*` 和 `/` 的操作是众周知的，但 `%` 需要一些解释。首先，记住当 `/` 应用于整数时，余数将被截断；例如，`10/3` 等于\
  \ 3。在 C# 中，`%` 可以应用于整数和浮点类型。（这与 C++ 不同，后者仅允许整数取模。）以下程序演示了取模运算符：\n\n```cs\n// Demo\
  \ % 运算符。\n\nusing System;\n\nclass ModDemo {\n    static void Main() {\n       \
  \ int iresult, irem;\n        double dresult, drem;\n        iresult = 10 / 3;\n\
  \        irem = 10 % 3;\n        dresult = 10.0 / 3.0;\n        drem = 10.0 % 3.0;\n\
  \        Console.WriteLine(\"Result and remainder of 10 / 3: \" + iresult + \" \"\
  \ + irem);\n        Console.WriteLine(\"Result and remainder of 10.0 / 3.0: \" +\
  \ dresult + \" \" + drem);\n    }\n}\n```\n\n该程序的输出所示：\n\n```\nResult and remainder\
  \ of 10 / 3: 3 1\nResult and remainder of 10.0 / 3.0: 3.33333333333333 1\n```\n\n\
  如你所见，`%` 对于整数和浮点操作都会产生余数 1。\n\n### 自增和递减\n\n在第一章引入的 `++` 和 `--` 分别是自增递减运算符。正如你将看到的，它们具有一些非常有趣的属性。让我们先回顾自增和递减运算符的具体作用。\n\
  \n自增运算符对其操作数加 1，递减运算符对其操作数减 1。因此：\n\n`x = x + 1;` 等于 `x++;` \n\n以及 `x = x - 1;`\
  \ 等于 `--x;`\n\n自增和递减运算符都可以位于操作数之前（前缀）或之后（后缀）。例如：\n\n`x = x + 1;` 可以写为 `++x;` //\
  \ 前缀形式\n或写为 `x++;` // 后缀形式\n\n在上述示例中，自增作为前缀还是后缀应用没有区别。然而，当自增或递减作为较大表达式的一部分时，存在重要的区别。在这种情况下，当运算符*位于操作数之前*时，操作的结果是操作数自增或递减*之后*的值。如果运算符*位于操作数之后*，操作的结果是操作数自增或递减*之前*的值。考虑以下内容：\n\
  \n```cs\nx = 10;\ny = ++x;\n```\n\n\n\n在这种情况下，`y` 将被设置为 11。这是因为 `x` 先后增，然后获取它的值。\n\
  \n然而，如果代码写如下：\n\n```cs\nx = 10;\ny = x++;\n```\n\n那么 `y` 将被设置为 10。在这种情况下，首先获取 `x`\
  \ 的值，然后 `x` 自增，最后返回 `x` 的原始值。在这两种情况下，`x` 仍然被设置为 11；其区别在于操作符返回的值。\n\n这里有一个稍微复杂一点例子：\n\
  \n```cs\nx = 10;\ny = 2;\nz = x++ - (x * y);\n```\n\nC# 3.0：学者指南\n\n这使得 `z` 的值为\
  \ -12。原因是当求值 `x++` 时，它将 `x` 设置为 11，但产生的值是 10（`x` 的原始值）。这意味着 `z` 被赋值为 10 – (11 *\
  \ 2)，结果为 –12。\n\n然而，如果这样写：\n\n```cs\nz = ++x - (x * y);\n```\n\n结果是 –11。这是因为 `x`\
  \ 先自增，然后获取它的值。因此，`z` 被赋值为 11 – (11 * 2)，结果为 –11。正如这个例子所暗示的，控制自增或自减操作发生的时间可能具有显著优势。\n\
  \n## 关系操作符和逻辑操作符\n\n在*关系操作符*和*逻辑操作符*的术语中，*关系*指的是值之间可能存在的关系，而*逻辑*指的是真值和假值连接在一起的方式。由于关系操作符产生真或假的结果，它们通常与逻辑操作符配合使用。由于这个原因，我们在这里一起讨论它们。\n\
  \n关系操作符所示：\n\n| 操作符 | 含义 |\n| :--- | :--- |\n| `==` | 等于 |\n| `!=` | 不等于 |\n| `>`\
  \ | 大于 |\n| `<` | 小于 |\n| `>=` | 大于等于 |\n| `<=` | 小于等于 |\n\n逻辑操作符如下所示：\n\n| 操作符\
  \ | 含义 |\n| :--- | :--- |\n| `&` | 与 (AND) |\n| `|` | 或 (OR) |\n| `^` | 异或 (XOR)\
  \ |\n| `||` | 短路或 (Short-circuit OR) |\n| `&&` | 短路与 (Short-circuit AND) |\n| `!`\
  \ | 非 (NOT) |\n\n关系和逻辑操作符的结果是一个 `bool` 值。\n\n通常，可以使用 `==` 和 `!=` 比较对象的相等性或不相等性。然而，比较操作符\
  \ `<`, `>`, `<=` 或 `>=` 只能应用于支持排序关系的类型。因此，所有的关系操作符都可以应用于所有的数值类型。但是，`bool` 类型的值只能进行相等或不相等的比较，因为\
  \ `true` 和 `false` 值是没有顺序的。例如，`true > false` 在 C# 中没有意义。\n\n## 第 2 章：介绍数据类型和操作符\n\
  \n对于逻辑操作符，操作数必须是 `bool` 类型，逻辑操作的结果也是 `bool` 类型。根据下面的真值表，逻辑操作符 `&`、`|`、`^` 和 `!`\
  \ 支持基本的逻辑操作与、或、异异和非：\n\n| p | q | p & q | p \\| q | p ^ q | !p |\n| :--- | :---\
  \ | :--- | :--- | :--- | :--- |\n| False | False | False | False | False | True\
  \ |\n| False | True | False | True | True | True |\n| True | False | False | True\
  \ | True | False |\n| True | True | True | True | False | False |\n\n如表所示，异或操作的结果仅当恰好有一个操作数为真时为真。\n\
  \n这里是一个演示了若干关系和逻辑操作符的程序：\n\n```cs\n// 关系和逻辑操作符。\n\nusing System;\n\nclass RelLogOps\
  \ {\n    static void Main() {\n        int i, j;\n        bool b1, b2;\n       \
  \ i = 10;\n        j = 11;\n        if(i < j) Console.WriteLine(\"i < j\");\n  \
  \      if(i <= j) Console.WriteLine(\"i <= j\");\n        if(i != j) Console.WriteLine(\"\
  i != j\");\n        if(i == j) Console.WriteLine(\"this won't execute\");\n    \
  \    if(i >= j) Console.WriteLine(\"this won't execute\");\n        if(i > j) Console.WriteLine(\"\
  this won't execute\");\n        b1 = true;\n        b2 = false;\n        if(b1 &\
  \ b2) Console.WriteLine(\"this won't execute\");\n        if(!(b1 & b2)) Console.WriteLine(\"\
  !(b1 & b2) is true\");\n        if(b1 | b2) Console.WriteLine(\"b1 | b2 is true\"\
  );\n        if(b1 ^ b2) Console.WriteLine(\"b1 ^ b2 is true\");\n    }\n}\n```\n\
  \n程序的输出所示：\n\n```\ni < j\ni <= j\ni != j\n!(b1 & b2) is true\nb1 | b2 is true\n\
  b1 ^ b2 is true\n```\n\n## 短路逻辑操作符\n\nC# 提供了与或逻辑操作符的特殊*短路*版本，可以产生更高效的代码。为了理解这一点，请考虑以下情况：在与操作中，如果第一个操作数为假，则结果为假，无论第二个操作数是什么。在或操作中，如果第一个操作数为真，则操作结果为真，无论第二个操作数的值是什么。因此，在这情况下，第二个操作数都不会被求值。\n\
  \n短路与是 `&&`，短路或是 `||`。它们的普通对应是 `&` 和 `|`。区别在于短路版本只在需要时求值第二个操作数。\n\n这里是一个演示短路操作符的程序：\n\
  \n```cs\n// 短路操作符。\n\nusing System;\n\nclass SCops {\n    static void Main() {\n\
  \        int n, d;\n        n = 10;\n        d = 2;\n        // 这里 d 是 2，所以执行了取模操作。\n\
  \        if(d != 0 && n % d == 0)\n            Console.WriteLine(d + \" is a factor\
  \ of \");\n\n        d = 0;\n        // 由于 d 为零，取模操作没有被执行。\n        if(d != 0 &&\
  \ n % d == 0)\n            Console.WriteLine(d + \" is a factor of \");\n\n    \
  \    // 现在在不使用短路的情况下尝试。\n        // 这会导致除零错误。\n        if(d != 0 & n % d == 0)\n\
  \            Console.WriteLine(d + \" is a factor of \");\n\n        d = 2;\n  \
  \      // 由于 d 是 2，执行了取模操作。\n        if(d != 0 | n % d == 0)\n            Console.WriteLine(d\
  \ + \" is a factor of \");\n\n        d = 0;\n        // 现在，两个操作数都被求值了，这导致了除零错误。\n\
  \        if(d != 0 | n % d == 0)\n            Console.WriteLine(d + \" is a factor\
  \ of \");\n    }\n}\n```\n\n程序的输出所示：\n\n```\n2 is a factor of 10\n2 is a factor\
  \ of 10\n```\n\n\n\n\n```csharp\nConsole.Write((p&q) + \"\\t\" + (p|q) + \"\\t\"\
  );\nConsole.WriteLine((p^q) + \"\\t\" + (!p));\n\np = true; q = false;\n\nConsole.Write(p\
  \ + \"\\t\" + q +\"\\t\");\nConsole.Write((p&q) + \"\\t\" + (p|q) + \"\\t\");\n\
  Console.WriteLine((p^q) + \"\\t\" + (!p));\n\n*(续)*\n\np = false; q = true;\n\n\
  Console.Write(p + \"\\t\" + q +\"\\t\");\nConsole.Write((p&q) + \"\\t\" + (p|q)\
  \ + \"\\t\");\nConsole.WriteLine((p^q) + \"\\t\" + (!p));\n\np = false; q = false;\n\
  \nConsole.Write(p + \"\\t\" + q +\"\\t\");\nConsole.Write((p&q) + \"\\t\" + (p|q)\
  \ + \"\\t\");\nConsole.WriteLine((p^q) + \"\\t\" + (!p));\n```\n\n## 5. 编译并运行程序。将显示下表：\n\
  \n| P | Q | AND | OR | XOR | NOT |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n\
  | true | true | true | true | false | false |\n| true | false | false | true | true\
  \ | false |\n| false | true | false | true | true | true |\n| false | false | false\
  \ | false | false | true |\n\n## 6. 注意 `Write()` 和 `WriteLine()` 语句中逻辑操作周围的括号。这些括号是必要的，因为\
  \ C# 运算符存在优先的规定。`+` 运算符的优先级高于逻辑运算符。\n\n## 7. 尝试自己修改程序，使其使用并显示 1 和 0，而不是 true 和 false。\n\
  \n# 提问专家\n\n**Q：由于短路运算符在某些情况下比它们的普通对应运算符更高效，为什么 C# 仍然提供普通的 AND 和 OR 运算符？**\n\n**A:**\
  \ 在某些情况下，你可能希望 `AND` 或 `OR` 操作的两个操作数都被求值，因为它们会产生副作用。考虑以下情况：\n\n```csharp\n// 副作用可能是重要的。\n\
  using System;\nclass SideEffects {\n    static void Main() {\n        int i;\n \
  \       i = 0;\n        // 这里，即使 if 语句失败，i 也会增加。\n        if(false & (++i < 100))\n\
  \            Console.WriteLine(\"this won't be displayed\");\n        Console.WriteLine(\"\
  if statement executed: \" + i); // 显示 1\n\n        // 在这种情况下，i 没有增加，因为短路\n     \
  \   // 运算符跳过了增加操作。\n        if(false && (++i < 100))\n            Console.WriteLine(\"\
  this won't be displayed\");\n        Console.WriteLine(\"if statement executed:\
  \ \" + i); // 仍然是 1 !!\n    }\n}\n```\n\n注释所示，在第一个 `if` 语句中，无论 `if` 是否成功，`i` 都会增加。然而，当使用短路运算符时，如果第一个操作数为假，变量\
  \ `i` 就不会增加。这里的教训是，如果你的代码期望 `AND` 或 `OR` 操作的右操作数被求值，你必须使用这些操作的普通形式。\n\n# 赋值运算符\n\
  \n自第 1 章以来你一直在使用赋值运算符。现在是时候正式地审视它了。*赋值运算符*是单个等号，`=`。赋值运算符在 C# 中的工作与其他计算机语言非常相似。它具有这种通用形式：`var\
  \ = expression;`。\n\n在这里，`var` 的类型必须与 `expression` 的类型兼容。\n\n赋值运算符确实有一个你可能不熟悉的有趣属性：它允许你创建赋值链。例如，考虑这段代码片段：`int\
  \ x, y, z;`\n\n```csharp\nx = y = z = 100; //将 x, y, 和 z 设置为 100\n```\n\n该片段使用单个语句将变量\
  \ `x`、`y` 和 `z` 设置为 100。这之所以有效，是因为 `=` 是一个产生赋值值的运算符。因此，`z = 100` 的值是 100，然后被赋值给\
  \ `y`，随后再赋值给 `x`。使用“赋值链”是将一组变量设置为公共值的一种简单方法。\n\n# 复合赋值\n\nC# 提供了特殊的*复合赋值*运算符，简化了某些赋值语句的编码。让我们从一个示例开始。这里显示的赋值语句：`x\
  \ = x + 10;` 可以使用复合赋值编写，例如\n\n```csharp\nx += 10;\n```\n\n运算符 `+=` 告诉编译器向 `x` 赋值\
  \ `x` 加上 10 的值。\n\n这是另一个示例。语句 `x = x - 100;` 等同于\n\n```csharp\nx -= 100;\n```\n\n\
  这两个语句都向 `x` 赋值 `x` 减去 100 的值。\n\n许多二元运算符（即需要两个操作数的运算符）都有复合赋值运算符。简写的通用形式是 `variable\
  \ op = expression;`。\n\n因此，算术和逻辑赋值运算符有：\n\n`+=`\n`-=`\n`*=`\n`/=`\n`%=`\n`&=`\n\
  `|=`\n`^=`\n\n由于复合赋值语句比普通赋值语句更短，复合运算符有时被称为*简写赋值*运算符。复合运算符提供了两个好处：首先，它们比普通赋值语句更紧凑；其次，它们可以产生更高效的代码（因为左操作数只求值一次）。由于这些原因，你会在专业的\
  \ C# 代码中经常看到复合赋值。\n\n# 赋值中的类型转换\n\n在编程中，经常将一种类型赋值给另一种类型。例如，你可能将 `int` 赋值给 `float`，如下所示：\n\
  \n```csharp\nint i;\nfloat f;\ni = 10;\nf = i;\n```\n\n当将一种数据类型赋值给另一种类型的变量时，如果满足以下条件，将发生*隐式*转换：\n\
  \n- 两种类型兼容。\n- 目标类型大于源类型。\n\n在这种情况下，`int` 类型足以容纳所有 `byte` 值，且 `int` 和 `byte` 都是整数类型，因此可以使用扩展转换。\n\
  \n对于扩展转换，数值类型（包括整数和浮点类型）彼此是兼容的。例如，以下程序是完全有效的，因为 `long` 到 `double` 是扩展转换：\n\n```csharp\n\
  // 显示从 long 到 double 的隐式转换。\nusing System;\nclass LtoD {\n    static void Main()\
  \ {\n        long L;\n        double D;\n        L = 100123285L;\n        // 自动转换\n\
  \        D = L; // 从 long 到 double\n        Console.WriteLine(\"L and D: \" + L\
  \ + \" \" + D);\n    }\n}\n```\n\n虽然从 `long` 到 `double` 有隐式转换，但从 `double` 到 `long`\
  \ 没有隐式转换，因为这不是扩展转换。因此，上述程序的以下版本是无效：\n\n```csharp\n// *** 程序将无法编译 ***\nusing System;\n\
  class LtoD {\n    static void Main() {\n        long L;\n        double D;\n   \
  \     D = 100123285.0;\n        // 没有自动转换\n        L = D; // 非法！！！从 double 到 long。\n\
  \        Console.WriteLine(\"L and D: \" + L + \" \" + D);\n    }\n}\n```\n\n除了上述限制，`decimal`\
  \ 与 `float` 或 `double` 之间没有隐式转换，从数值类型到 `char` 或 `bool` 也没有隐式转换。此外，`char` 和 `bool`\
  \ 彼此不兼容。\n\n# 强制转换不兼容类型\n\n尽管隐式类型转换很有帮助，但它们无法满足所有的编程需求，因为它们只适用于兼容类型之间的扩展转换。对于所有其他情况，你必须使用强制转换。*强制转换*是告诉编译器将表达式转换为指定的指令。因此，它请求显式类型转换。强制转换具有这种通用形式：`(target-type)expression`。\n\
  \n\n\n\n\n在这里，`target-type` 指定了将指定表达式转换为所需的类型。例如，如果你想让表达式 `x/y` 的类型为 `int`，你可以写成\
  \ double x, y; \n\n```cpp\n// ...\n\n(int) (x / y)\n```\n\n在这里，尽管 `x` 和 `y` 的类型是\
  \ `double`，但强制转换将表达式的结果转换为 `int`。`x / y` 外围的括号是必要的。否则，对 `int` 的强制转换将仅作用于 `x`，而不是作用于除法的结果。在这里，强制转换是必要的，因为从\
  \ `double` 到 `int` 不存在隐式转换。\n\n当强制转换涉及**窄化转换**（narrowing conversion）时，可能会丢失信息。例如，当将\
  \ `long` 转换为 `int` 时，如果 `long` 的值大于 `int` 的范围，信息将会丢失，因为其高位会被移除。当将浮点值转换为整数类型时，由于截断的原因，小数部分也会丢失。例如，如果将值\
  \ `1.23` 赋值给整数，结果将简单为 `1`。`0.23` 丢失了。\n\n以下程序演示了一些需要强制转换的类型转换：\n\n```csharp\n//\
  \ Demo 强制转换。\n\nusing System;\n\nclass CastDemo {\n\nstatic void Main() {\ndouble\
  \ x, y;\nbyte b;\nint i;\nchar ch;\n\nx = 10.0;\ny = 3.0;\ni = (int) (x / y); //\
  \ 在此转换中发生截断。\nConsole.WriteLine(\"Integer outcome of x / y: \" + i);\n\ni = 100;\n\
  b = (byte) i;\n// 这里没有信息损失。byte 可以容纳值 100。\nConsole.WriteLine(\"Value of b: \" +\
  \ b);\n\ni = 257;\nb = (byte) i;\n// 这次信息丢失。byte 无法容值 257。\nConsole.WriteLine(\"\
  Value of b: \" + b);\n\nb = 88; // X 的 ASCII 代码\nch = (char) b;\n// 不兼容类型之间需要强制转换。\n\
  Console.WriteLine(\"ch: \" + ch);\n}\n}\n```\n\n程序的输出所示：\n\n```\nInteger outcome\
  \ of x / y: 3\nValue of b: 100\nValue of b: 1\nch: X\n```\n\n在程序中，将 `(x / y)` 强制转换为\
  \ `int` 导致了部分的截断和信息的丢失。接下来，当给 `b` 赋值值 `100` 时没有发生信息损失，因为 `byte` 可以容纳值 `100`。然而，当尝试给\
  \ `b` 赋值值 `257` 时，发生了信息丢失，因为 `257` 超过了 `byte` 的范围。这导致 `b` 的值为 `1`，因为在 `257` 的二进制表示的低\
  \ 8 位中，只有 `1` 位被设置为 1。最后，将 `byte` 值赋值给 `char` 时，没有丢失信息，但需要强制转换。\n\n## 运算符优先级\n\n\
  表 2-3 显示了所有 C# 运算符的优先级，从高到低排序。此表包含了本书后面将讨论的几个运算符。\n\n## 表达式中的类型转换\n\n在表达式中，只要不同数据类型之间兼容，就可以混合两种或多种不同类型。例如，你可以在表达式中混合\
  \ `short` 和 `long`，因为它们都是数值类型。当不同数据类型在表达式中混合时，它们会根据逐个操作转换为相同的类型。\n\n这些转换通过使用 C#\
  \ 的**类型提升规则**（type promotion rules）完成。以下是这些规则为二进制操作定义的算法：\n\n- IF 一个操作数是 `decimal`，则另一个操作数提升为\
  \ `decimal`（除非它是 `float` 或 `double` 类型，在这种情况下会导致错误）。\n- ELSE IF 其中一个操作数是 `double`，则第二个提升为\
  \ `double`。\n- ELSE IF 其中一个操作数是 `float`，则第二个提升为 `float`。\n- ELSE IF 其中一个操作数是 `ulong`，则第二个提升为\
  \ `ulong`（除非它是 `sbyte`、`short`、`int` 或 `long` 类型，在这种情况下会导致错误）。\n- ELSE IF 其中一个操作数是\
  \ `long`，则第二个提升为 `long`。\n- ELSE IF 一个操作数是 `uint` 且第二个是 `sbyte`、`short` 或 `int`\
  \ 类型，两者都提升为 `long`。\n- ELSE IF 其中一个操作数是 `uint`，则第二个提升为 `uint`。\n- ELSE 两个操作数都提升为\
  \ `int`。\n\n关于类型提升规则有几点重要的说明。首先，并不是所有类型都表达式中混合。具体来说，从 `float` 或 `double` 到 `decimal`\
  \ 不存在隐式转换，并且无法将 `ulong` 与任何有符号整数类型混合。混合这些类型需要显式强制转换。\n\n### 表 2-3 C# 运算符的优先级\n\n\
  | 优先级 | 运算符 |\n| :--- | :--- |\n| 最高 | `()` `[]` `.` `++(postfix)` `--(postfix)`\
  \ |\n| | `checked` `new` `sizeof` `typeof` `unchecked` |\n| | `!` `~` `(cast)` `+(unary)`\
  \ `-(unary)` `++(prefix)` `--(prefix)` |\n| | `*` `/` `%` |\n| | `+` `-` |\n| |\
  \ `<<` `>>` |\n| | `<` `>` `<=` `is` |\n| | `==` `!=` |\n| | `&` `^` `|` |\n| |\
  \ `&&` `||` |\n| | `??` |\n| | `?:` |\n| | `=` `+=` `-=` `*=` `/=` `%=` `<<=` `>>\
  \ `<=` `<=`=` `>==` |\n| 最低 | |\n\n其次，特别注意最后一条规则。它规定类型提升仅在表达式求值时适用。理解类型提升可能会导致意外的结果是非常重要的。例如，考虑以下程序：\n\
  \n```csharp\n// 一个类型惊喜！\nusing System;\n\nclass PromDemo {\nstatic void Main() {\n\
  byte b;\nint i;\n\n// 不需要强制转换，因为结果已经是 int。\nb = 10;\ni = b * b; \n\n// 将 int 赋值给\
  \ byte 需要强制转换。\nb = 10;\nb = (byte) (b * b); \n\nConsole.WriteLine(\"i and b: \"\
  \ + i + \" \" + b);\n}\n}\n```\n\n有些的是，将 `b * b` 赋值给 `i` 时不需要强制转换，因为 `b` 被提升为了 `int`。然而，当你尝试将\
  \ `b * b` 赋值给 `b` 时，确实需要强制转换——转回 `byte`！同样的情况也发生在对 `char` 操作时。例如，在下面的片段中，由于 `ch1`\
  \ 和 `ch2` 在表达式中提升为 `int`，因此需要转换回 `char`：\n\n```csharp\nchar ch1 = 'a', ch2 = 'b';\n\
  ch1 = (char) (ch1 + ch2);\n```\n\n如果没有强制转换，`ch1` 与 `ch2` 相加的结果将是 `int`，这无法赋值给 `char`。\n\
  \n\n\n\n\n1 / 3 分式: .33\n\n2 / 3: 0\n\n2 / 3 分式: .67\n\n3 / 3: 1\n\n3 / 3 分式: 1\n\
  \n4 / 3: 1\n\n4 / 3 分式: 1.33\n\n### 专家问答\n\n**问：执行单元操作（如单元减 –）时会发生类型提升吗？**\n\n**答：**的。对于单元操作，小于\
  \ `int`（`byte`、`sbyte`、`short` 和 `ushort`）的操作数会被提升为 `int`。同样，`char` 操作数转换为 `int`。此外，如果\
  \ `uint` 值被取反，它会被提升为 `long`。\n\n# 第 2 章：介绍数据类型和运算符\n\n77\n\n# 空格与括号\n\nC# 表达式可以包含制表符和空格，以提高其可读性。例如，以下两个表达式是相同的，但第二个更易读：\n\
  \n```\nx=10/y*(127-x);\n```\n\n```\nx = 10 / y * (127 - x);\n```\n\n括号可以用于对子表达式进行分组，从而有效地提高其中操作的优先级，就像在代数中一样。使用冗余或额外的括号不会导致错误，也不会降低表达式的执行速度。\n\
  \n鼓励你使用括号来让自己自己以及以后可能需要维护你程序的人清楚表达式是如何求值的。例如，以下两个表达式中哪一个更容易读？\n\n```\nx = y/3-34*temp+127;\n\
  ```\n\n```\nx = (y/3) - (34*temp) + 127;\n```\n\n## 试一试：计算贷款的定期还款\n\n如前所述，`decimal`\
  \ 类型特别适用于涉及金钱的计算。本程序演示了它在此方面的用途。该程序计算贷款（如汽车贷款）的定期还款。给定本金、期限、每年还款次数和利率，程序将计算还款金额。由于这是一项财务计算，使用\
  \ `decimal` 类型来表示数据是合理的。该程序还演示了类型转换以及 C# 的另一个库方法。\n\n要计算还款额，你将使用以下公式：\n\n`IntRate\
  \ * (Principal / PayPerYear)`\n\n`Payment = 1 – ((IntRate / PayPerYear) + 1) – PayPerYear\
  \ * NumYears`\n\n其中 `IntRate` 指定利率，`Principal` 包含起始余额，`PayPerYear` 指定每年还款次数，`NumYears`\
  \ 指定贷款年限。\n\n注意，在公式的分母中，你必须将一个值作为另一个值的幂。要做到这一点，你将使用 C# 数方法 `Math.Pow()`。调用方式如下：\n\
  \n```\nresult = Math.Pow(base, exp);\n```\n\n`Pow()` 返回 `base` 的 `exp` 次幂值。`Pow()`\
  \ 的参数必须是 `double` 类型，它返回一个 `double` 类型的值。这意味着你需要使用类型转换在 `double` 和 `decimal` 之间进行转换。\n\
  \n（续）\n\n78\n\nC# 3.0 入门\n\n## 逐步实现\n\n1. 创建名为 `RegPay.cs` 的新文件。\n\n2. 以下是程序将使用的变量：\n\
  \n```csharp\ndecimal Principal; // 原始本金\ndecimal IntRate; // 小数形式的利率，例如 0.075\n\
  decimal PayPerYear; // 每年还款次数\ndecimal NumYears; // 年数\ndecimal Payment; // 定期还款额\n\
  decimal numer, denom; // 临时工作变量\ndouble b, e; // 调用 Pow() 的基数和指数\n```\n\n由于大部分计算将使用\
  \ `decimal` 数据类型完成，因此大多数变量都是 `decimal` 类型。\n\n注意每个变量声明后面都跟着一个描述其用途的注释。这有助于任何阅读你程序的人理解每个变量的。虽然我们不会在书中的大多数短程序中包含如此详细的注释，但当你的程序变得更长更复杂时，这是一个良好的习惯。\n\
  \n3. 添加以下代码行以指定贷款信息。在本例中，本金为 $10,000，利率为 7.5%，每年还款次数为 12 次，贷款期限为 5 年。\n\n```csharp\n\
  Principal = 10000.00m;\nIntRate = 0.075m;\nPayPerYear = 12.0m;\nNumYears = 5.0m;\n\
  ```\n\n4. 添加执行财务计算的行：\n\n```csharp\nnumer = IntRate * Principal / PayPerYear;\n\
  e = (double) -(PayPerYear * NumYears);\nb = (double) (IntRate / PayPerYear) + 1;\n\
  denom = 1 - (decimal) Math.Pow(b, e);\nPayment = numer / denom;\n```\n\n注意必须使用类型转换来将值传递给\
  \ `Pow()` 并转换返回值。\n\n记住，C# 中 `decimal` 和 `double` 之间没有隐式转换。\n\n5. 通过输出定期还款额来完成程序，如下所示：\n\
  \n```csharp\nConsole.WriteLine(\"Payment is {0:C}\", Payment);\n```\n\n6. 这里是整个\
  \ `RegPay.cs` 程序：\n\n```csharp\n// 计算贷款的定期还款。\nusing System;\n\nclass RegPay {\n\
  \    static void Main() {\n        decimal Principal; // 原始本金\n        decimal IntRate;\
  \ // 小数形式的利率，例如 0.075\n        decimal PayPerYear; // 每年还款次数\n        decimal NumYears;\
  \ // 年数\n        decimal Payment; // 定期还款额\n        decimal numer, denom; // 临时工作变量\n\
  \        double b, e; // 调用 Pow() 的基数和指数\n\n        Principal = 10000.00m;\n   \
  \     IntRate = 0.075m;\n        PayPerYear = 12.0m;\n        NumYears = 5.0m;\n\
  \n        numer = IntRate * Principal / PayPerYear;\n        e = (double) -(PayPerYear\
  \ * NumYears);\n        b = (double) (IntRate / PayPerYear) + 1;\n        denom\
  \ = 1 - (decimal) Math.Pow(b, e);\n        Payment = numer / denom;\n\n        Console.WriteLine(\"\
  Payment is {0:C}\", Payment);\n    }\n}\n```\n\n输出为：\n```\n$33.33\n```\n\n### 第\
  \ 2 章测试\n\n1. 为什么 C# 指定了简单类型的范围和行为？\n2. C# 的字符类型是什么？与其他语言使用的字符类型有何不同？\n3. 给定输出：\n\
  ```\nOne\nTwo\nThree\n```\n使用单个字符串和转义字符显示产生该输出的 `WriteLine()` 语句。\n4. 这段代码有什么错误？\n\
  ```csharp\nfor(i = 0; i < 10; i++) {\n    int sum;\n    sum = sum + i;\n}\nConsole.WriteLine(\"\
  Sum is: \" + sum);\n```\n5. 解释运算符的前缀和后缀形式之间的区别。\n6. 显示如何使用短路与来防止除零错误。\n7. 在表达式中，`byte`\
  \ 和 `short` 提升为什么类型？\n8. 下列哪些类型不能与 `decimal` 值混合？\n   A. float\n   B. int\n   C.\
  \ uint\n   D. byte\n9. 一般来说，什么时候需要类型转换？\n10. 写一个程序找出 2 到 100 之间所有的质数。\n11. 独立重写\
  \ *试一试：显示逻辑运算符的真值表* 中的真值表程序，使其使用嵌入制表符和换行的原始字符串字量，而不是转义字符。\n\n\n\n\n\n在检查 C# 的控制语句之前，我们将进行一个简短的插叙，这将让你能够开始编写交互式程序。到目前为止，书中的示例程序一直是在向用户*显示*信息，但它们没有从用户那里*接收*信息。因此，你一直在使用控制台输出，但没有使用控制台（即键盘）输入。在这里，你将开始通过读取键盘上输入的字符来使用输入。\n\
  \n要从键盘读取字符，请调用 `Console.Read()`。此方法会等待用户按下按键，然后返回该按键。字符是以整数形式返回的，因此必须强制转换为 `char`\
  \ 才能赋值给 `char` 变量。默认情况下，控制台输入是行缓冲，因此在你输入的任何字符发送到程序之前，你必须按下 ENTER。这里是一个从键盘读取字符的程序：\n\
  \n```csharp\n// 从键盘读取一个字符。\n\nusing System;\n\nclass KbIn {\n    static void Main()\
  \ {\n        char ch;\n        Console.Write(\"Press a key followed by ENTER: \"\
  );\n        // 从键盘读取一个按键。\n        ch = (char) Console.Read();\n        Console.WriteLine(\"\
  Your key is: \" + ch);\n    }\n}\n```\n\n以下是运行示例：\n\n```\nPress a key followed by\
  \ ENTER: t\nYour key is: t\n```\n\n`Read()` 是行缓冲的，有时会令人烦恼。当你按下 ENTER 时，一个回车符-换行符序列会被输入输入流。此外，这些字符会留在输入缓冲区中，直到你读取它们为止。因此，对于某些应用程序，你可能需要在下一次输入操作之前移除它们（通过读取它们）。你将在本章的稍后部分看到一个示例。\n\
  \n## if 语句\n\n第 1 章介绍了 `if` 语句。在这里将进行详细检查。`if` 语句的完整形式为：\n\n```csharp\nif(condition)\
  \ statement;\nelse statement;\n```\n\n其中 `if` 和 `else` 的目标是单个语句。`else` 子句是可选的。因为在单语句合法的地方都可以使用语句块，因此\
  \ `if` 和 `else` 的目标都可以语句块。因此，使用语句块的 `if` 的通用形式为：\n\n```csharp\nif(condition)\n{\n\
  \    statement sequence\n}\nelse\n{\n    statement sequence\n}\n```\n\n如果条件表达式为真，将执行\
  \ `if` 的目标；否则，如果存在，将执行 `else` 的目标。两者永远不会同时被执行。控制 `if` 的条件表达式必须产生一个 `bool` 结果。\n\n\
  为了演示 `if`，我们将演化一个适合小孩的简单计算机猜字母游戏。在游戏的第一个版本中，程序向玩家要一个 A 到 Z 之间的字母。如果玩家在键盘上按了正确的字母，程序将通过打印消息\
  \ ** Right ** 做出响应。程序所示所示：\n\n```csharp\n// 猜字母游戏。\n\nusing System;\n\nclass Guess\
  \ {\n    static void Main() {\n        char ch, answer = 'K';\n        Console.WriteLine(\"\
  I'm thinking of a letter between A and Z.\");\n        Console.Write(\"Can you guess\
  \ it: \");\n        ch = (char) Console.Read(); // 获取用户的猜想\n        if(ch == answer)\
  \ Console.WriteLine(\"** Right **\");\n    }\n}\n```\n\n该程序提示玩家，然后从键盘读取一个字符。使用 `if`\
  \ 语句，它会检查该字符与答案（在这种情况下是 K）是否匹配。如果输入了 K，则显示消息。当你尝试此程序时，记住 K 必须大写输入。\n\n进一步完善猜字母游戏，下一个版本使用\
  \ `else` 在选错字母时打印消息。\n\n```csharp\n// 猜字母游戏，第 2 版本。\n\nusing System;\n\nclass Guess2\
  \ {\n    static void Main() {\n        char ch, answer = 'K';\n        Console.WriteLine(\"\
  I'm thinking of a letter between A and Z.\");\n        Console.Write(\"Can you guess\
  \ it: \");\n        ch = (char) Console.Read(); // 获取用户的猜想\n        if(ch == answer)\
  \ Console.WriteLine(\"** Right **\");\n        else Console.WriteLine(\"...Sorry,\
  \ you're wrong.\");\n    }\n}\n```\n\n## 嵌套 ifs\n\n一个*嵌套 if*（nested if）是作为另一个 `if`\
  \ 或 `else` 目标的 `if` 语句。嵌套 `ifs` 在编程中非常常见。关于 C# 中嵌套 `if` 需要记住的主要点是：`else` 子句始终与与\
  \ `else` 处于同一代码块内且尚未关联 `else` 的最近 `if` 语句关联。这是一个示例：\n\n```csharp\nif(i == 10) {\n\
  \    // 这个 if 对应这个 else。\n    if(j < 20) a = b;\n    if(k > 100) c = d;\n    //\
  \ 这个 if 对应这个 else。\n    else a = c; // 这个 else 指向 if(k > 100)\n}\nelse a = d; //\
  \ 这个 else 指向 if(i == 10)\n```\n\n如注释所示，最后的 `else` 不与 `if(j<20)` 关联，因为它们不在同一个代码块中（尽管它是最近的没有\
  \ `else` 的 `if`）。\n\n你可以使用嵌套 `if` 来对猜字母游戏进一步改进。`else` 为玩家提供了关于猜错的反馈。\n\n```csharp\n\
  // 猜字母游戏，第 3 版本。\n\nusing System;\n\nclass Guess3 {\n    static void Main() {\n\
  \        char ch, answer = 'K';\n        Console.WriteLine(\"I'm thinking of a letter\
  \ between A and Z.\");\n        Console.Write(\"Can you guess it: \");\n       \
  \ ch = (char) Console.Read(); // 获取用户的猜想\n        if(ch == answer) Console.WriteLine(\"\
  ** Right **\");\n        else {\n            Console.Write(\"...Sorry, you're \"\
  );\n            // 一个嵌套 if。\n            if(ch < answer) Console.WriteLine(\"too\
  \ low\");\n            else Console.WriteLine(\"too high\");\n        }\n    }\n\
  }\n```\n\n运行示例在此：\n\n```\nI'm thinking of a letter between A and Z.\nCan you guess\
  \ it: Z\n...Sorry, you're too high\n```\n\n## if-else-if 阶梯\n\n一种基于嵌套 `if` 的常见编程结构是\
  \ `if-else-if` 阶梯。它看起来如下：\n\n```csharp\nif(condition)\n    statement;\nelse if(condition)\n\
  \    statement;\nelse if(condition)\n    statement;\nelse\n    statement;\n```\n\
  \n条件表达式从上到下评估。一旦找到真条件，就会执行与其相关的语句，并跳过阶梯的剩余部分。如果没有任何条件为真，将执行最后的 `else`。最后的 `else`\
  \ 通常充当默认条件；即，如果所有条件测试失败，则执行最后一个 `else` 子句。\n\n如果没有最后的 `else` 且所有其他条件为假，则不会发生任何操作。以下程序演示了\
  \ `if-else-if` 阶梯：\n\n```csharp\n// 演示 if-else-if 阶梯。\n\nusing System;\n\nclass\
  \ Ladder {\n    static void Main() {\n        int x;\n        for(x=0; x<6; x++)\
  \ {\n            if(x==1)\n                Console.WriteLine(\"x is one\");\n  \
  \          else if(x==2)\n                Console.WriteLine(\"x is two\");\n   \
  \         else if(x==3)\n                Console.WriteLine(\"x is three\"); // 这是默认语句。\n\
  \            else if(x==4)\n                Console.WriteLine(\"x is four\");\n\
  \            else\n                Console.WriteLine(\"x is not between 1 and 4\"\
  );\n        }\n    }\n}\n```\n\n该程序产生输出：\n\n```\nx is not between 1 and 4\nx is\
  \ one\nx is two\nx is three\nx is four\nx is not between 1 and 4\n```\n\n你可以看到，最后的\
  \ `else` 仅在之前的所有 `if` 语句都不成功时才会执行。\n\n## switch 语句\n\n\n\n\n\nC# 的第二个选择语句是 `switch`。`switch`\
  \ 提供了多路分支。因此，它允许程序在多个备选方案中进行选择。虽然一系列嵌套的 `if` 语句可以执行多路测试，但在许多情况下，`switch` 是一种更高效的方法。它的工作原理如下：表达式的值会逐一与常量列表进行测试。当找到匹配项时，将执行与该匹配项相关的语句序列。`switch`\
  \ 语句的通用形式如下\n\n```csharp\nswitch (*expression*) {\ncase *constant1*:\n*statement\
  \ sequence*\nbreak;\ncase *constant2*:\n*statement sequence*\nbreak;\ncase *constant3*:\n\
  *statement sequence*\nbreak;\n.\n.\n.\ndefault:\n*statement sequence*\nbreak;\n\
  }\n```\n\n`switch` 表达式必须是整数类型，例如 `char`、`byte`、`short` 或 `int`；枚举类型；或 `string` 类型。（枚举类型和\
  \ `string` 类型在书的稍后部分进行了描述。）因此，不允许使用浮点表达式等。通常，控制 `switch` 的表达式仅仅是一个变量。`case` 常量的类型必须与表达式类型兼容。同一个\
  \ `switch` 中没有两个 `case` 常量可以具有相同的值。\n\n如果没有 `case` 常量匹配表达式，则执行 `default` 序列。`default`\
  \ 是可选的；如果不存在，当所有匹配失败时将不采取任何操作。当找到匹配项时，将执行与该 `case` 相关的语句，直到遇到 `break`。\n\n以下程序演示了\
  \ `switch`：\n\n```csharp\n// 演示 switch 。\nusing System;\nclass SwitchDemo {\n  \
  \  static void Main() {\n        int i;\n        for(i=0; i < 10; i++) // i 的值决定执行哪个\
  \ case。\n            switch(i) {\n            case 0:\n                Console.WriteLine(\"\
  i is zero\");\n                break;\n            case 1:\n                Console.WriteLine(\"\
  i is one\");\n                break;\n            case 2:\n                Console.WriteLine(\"\
  i is two\");\n                break;\n            case 3:\n                Console.WriteLine(\"\
  i is three\");\n                break;\n            case 4:\n                Console.WriteLine(\"\
  i is four\");\n                break;\n            default:\n                Console.WriteLine(\"\
  i is five or more\");\n                break;\n            }\n    }\n}\n```\n\n\
  该程序产生的输出所示：\n```\ni is zero\ni is one\ni is two\ni is three\ni is four\ni is five\
  \ or more\n```\n\n# 第 3 章：程序控制语句\n\n如你所见，每次循环时，都会执行与匹配 `i` 的 `case` 常量相关的语句。其他语句都会被跳过。当\
  \ `i` 等于五或更大时，没有 `case` 常量匹配，因此执行与 `default` case 相关的语句。\n\n在前面的示例中，`switch` 是由一个\
  \ `int` 变量控制的。正如所解释，你可以用任何整数类型（包括 `char`）控制 `switch`。这里是一个使用 `char` 表达式和 `char`\
  \ case 常量的示例：\n\n```csharp\n// 使用 char 来控制 switch 。\nusing System;\nclass SwitchDemo2\
  \ {\n    static void Main() {\n        char ch;\n        for(ch='A'; ch <= 'E';\
  \ ch++)\n            switch(ch) {\n            case 'A':\n                Console.WriteLine(\"\
  ch is A\");\n                break;\n            case 'B':\n                Console.WriteLine(\"\
  ch is B\");\n                break;\n            case 'C':\n                Console.WriteLine(\"\
  ch is C\");\n                break;\n            case 'D':\n                Console.WriteLine(\"\
  ch is D\");\n                break;\n            case 'E':\n                Console.WriteLine(\"\
  ch is E\");\n                break;\n            }\n    }\n}\n```\n\n该程序的输出所示：\n\
  ```\nch is A\nch is B\nch is C\nch is D\nch is E\n```\n\n注意，此示例没有包含 `default` case。记住，`default`\
  \ 是可选的。当不需要时，可以将其省略。\n\n在 C# 中，让与一个 `case` 相关的语句序列继续执行到下一个 `case` 是一个错误。这被称为*禁止穿透规则*\
  \ (*no fall-through rule*）。这就是为什么 `case` 序列以 `break` 结束。\n\n（你可以通过其他方式避免穿透，但 `break`\
  \ 远是是为止最常用的方法。）在 `case` 的语句序列中遇到 `break` 时，`break` 会导致程序流退出整个 `switch` 语句并在 `switch`\
  \ 之外的下一个语句继续。另一点：`default` 序列也不能“穿透”，它通常也以 `break` 结束。\n\n虽然你不能允许一个 `case` 序列穿透到另一个，但你可以为同一代码序列拥有两个或多个\
  \ `case` 标签，如下例所示：\n\n```csharp\nswitch(i) {\ncase 1: // 这些 case 指向同一段代码序列。\ncase\
  \ 2:\ncase 3: \n    Console.WriteLine(\"i is 1, 2 or 3\");\n    break;\ncase 4:\
  \ \n    Console.WriteLine(\"i is 4\");\n    break;\n}\n```\n\n在此片段中，如果 `i` 的值为 1、2\
  \ 或 3，则执行第一个 `WriteLine()` 语句。如果为 4，则执行该语句。\n\n\n\n\n\n## 尝试此操作：开始构建一个 C# 帮助系统\n\
  \n在这里，你将开始构建一个简单的帮助系统，用于显示 C# 控制语句的语法。这个帮助系统将在本章节的过程中不断增强。第一个版本将显示一个包含控制语句的菜单，然后等待你选择其中一个。选择一个后，将显示该语句的语法。在程序的这个第一个版本中，仅对\
  \ `if` 和 `switch` 语句提供帮助。其他的控制语句将在后的“尝试此操作（Try This）”部分中添加。\n\n## 逐步实现\n\n1. 创建一个名为\
  \ `Help.cs` 的文件。\n\n2. 程序开始时显示以下菜单：\n\n```\nHelp on:\n1. if\n2. switch\n\nChoose\
  \ one:\n```\n\n为了实现这一点，你将使用此处所示语句序列：\n\n```csharp\nConsole.WriteLine(\"Help on:\"\
  );\nConsole.WriteLine(\" 1\\. if\");\nConsole.WriteLine(\" 2\\. switch\");\nConsole.Write(\"\
  Choose one: \");\n```\n\n3. 程序通过调用 `Console.Read()` 获取用户的选择，如下所示：`choice = (char)\
  \ Console.Read();`\n\n4. 一旦获取选择，程序将使用此处所示的 `switch` 语句显示所选语句的语法：\n\n```csharp\n\
  switch(choice) {\ncase '1':\n    Console.WriteLine(\"The if:\\n\");\n    Console.WriteLine(\"\
  if(condition) statement;\");\n    Console.WriteLine(\"else statement;\");\n    break;\n\
  case '2':\n    Console.WriteLine(\"The switch:\\n\");\n    Console.WriteLine(\"\
  switch(expression) {\");\n    Console.WriteLine(\" case constant:\");\n    Console.WriteLine(\"\
  \ statement sequence\");\n    Console.WriteLine(\" break;\");\n    Console.WriteLine(\"\
  \ // ...\");\n    Console.WriteLine(\"}\");\n    break;\ndefault:\n    Console.Write(\"\
  Selection not found.\");\n    break;\n}\n```\n\n注意 `default` 子句如何捕获无效选择。例如，如果用户输入\
  \ 3，将没有 `case` 常量匹配，导致执行 `default` 序列。\n\n5. 这里是整个 `Help.cs` 代码列表：\n\n```csharp\n\
  // A simple help system.\n\nusing System;\n\nclass Help {\n    static void Main()\
  \ {\n        char choice;\n        Console.WriteLine(\"Help on:\");\n        Console.WriteLine(\"\
  \ 1\\. if\");\n        Console.WriteLine(\" 2\\. switch\");\n        Console.Write(\"\
  Choose one: \");\n        choice = (char) Console.Read();\n        Console.WriteLine(\"\
  \\n\");\n        switch(choice) {\n            case '1':\n                Console.WriteLine(\"\
  The if:\\n\");\n                Console.WriteLine(\"if(condition) statement;\");\n\
  \                Console.WriteLine(\"else statement;\");\n                break;\n\
  \            case '2':\n                Console.WriteLine(\"The switch:\\n\");\n\
  \                Console.WriteLine(\"switch(expression) {\");\n                Console.WriteLine(\"\
  \ case constant:\");\n                Console.WriteLine(\" statement sequence\"\
  );\n                Console.WriteLine(\" break;\");\n                Console.WriteLine(\"\
  \ // ...\");\n                Console.WriteLine(\"}\");\n                break;\n\
  \            default:\n                Console.Write(\"Selection not found.\");\n\
  \                break;\n        }\n    }\n}\n```\n\n这是一个示例运行结果：\n\n```\nHelp on:\n\
  1. if\n2. switch\nChoose one: 1\nThe if:\nif(condition) statement;\nelse statement;\n\
  ```\n\n## for 循环\n\n自第 1 章以来，你一直在使用简单形式的 `for` 循环。你可能会对 `for` 循环的强大和灵活感到惊讶。让我们从回顾基础开始，从最传统的\
  \ `for` 形式开始。重复单个语句的 `for` 循环通用形式是 `for(initialization; condition; iteration) statement;`。对于重复一个块，通用形式为：\n\
  \n```csharp\nfor(initialization; condition; iteration) statement\n```\n\n`initialization`\
  \ 是初始化语句，`condition` 是控制循环继续的条件，`iteration` 是每次循环后执行的语句。`initialization` 通常设置计数器的值，`condition`\
  \ 决定循环是否继续，`iteration` 定义了循环变量的变化量。`for` 循环的三个分号分隔部分定义了循环的执行。当 `condition` 为真时，`for`\
  \ 循环将执行。`for` 循环可以以正向或负向运行，例如，以下 `for` 循环打印 100 到 -100 的数字：\n\n```csharp\nfor(x\
  \ = 100; x > 100; x -= 5)\n    Console.WriteLine(x);\n```\n\n关于 `for` 循环的一个重要点是`condition`始终在循环顶部进行测试。`for`\
  \ 循环可以以任何方式运行，例如，以下 `for` 循环以 5 为步长运行：\n\n```csharp\nfor(x = 100; x > -100; x -=\
  \ 5)\n    Console.WriteLine(x);\n```\n\n`for` 是 C# 语言中最灵活的语句之一，因为它允许各种变化。例如，可以使用多个循环控制变量。考虑以下程序，使用了浮点数：\n\
  \n```csharp\n// 1 to 99\n\nusing System;\n\nclass Sqr {\n    static void Main()\
  \ {\n        double i;\n        // 注意这里的双循环控制\n        for(i = 0.0; i < 100.0; i++)\n\
  \            i = (i);\n    }\n}\n```\n\n在这里，逗号分隔了两个初始化语句和两个迭代表达式。当循环开始时，`i` 和 `j`\
  \ 都被初始化。每次循环时，`i` 递增，`j` 递减。多个循环控制变量通常非常方便，并简化某些算法。控制循环的条件可以是任何产生 `bool` 结果的有效表达式。它不需要涉及循环控制变量。在下一个示例中，循环将一直执行，直到用户在键盘上输入\
  \ `S`。\n\n```csharp\n// 直到输入 S。\n\nusing System;\n\nclass ForTest {\n    static\
  \ void Main() {\n        int i;\n        Console.WriteLine(\"Press S to stop.\"\
  );\n        for(i = 0; (char) Console.Read() != 'S'; i++)\n            Console.WriteLine(\"\
  Pass #\" + i);\n    }\n}\n```\n\n## for 循环的变体\n\n`for` 语句是功能最灵活的语句之一，因为它允许广泛的变化。例如，可以使用多个循环控制变量。考虑以下程序：\n\
  \n```csharp\n// 在 for 语句中使用逗号。\n\nusing System;\n\nclass Comma {\n    static void\
  \ Main() {\n        int i, j;\n        // 注意两个循环控制\n        for(i=0, j=10; i < j;\
  \ i++, j--)\n            Console.WriteLine(\"i and j: \" + i + \" \" + j);\n   \
  \ }\n}\n```\n\n在这里，逗号分隔了两个初始化语句和两个迭代表达式。当循环开始时，`i` 和 `j` 都被初始化。每次循环重复时，`i` 递增，`j`\
  \ 递减。多个循环控制变量通常非常方便。你可以任意数量的初始化和迭代语句，但在实践中，超过两个会让 `for` 循环变得难以维护。\n\n## 缺失的部分\n\n\
  通过留空循环定义的部分，可以创建有趣的 `for` 循环变体。\n\n在 C# 中，`for` 循环的初始化、条件或迭代部分的任何或全部部分都可以为空。例如，考虑以下程序：\n\
  \n```csharp\n// for 的部分可以是空的。\n\nusing System;\n\nclass Empty {\n    static void\
  \ Main() {\n        int i;\n    }\n}\n```\n\n\n\n\n\n```csharp\nfor(i = 0; i < 10;\
  \ ) {\n    // 缺少迭代表达式。\n    Console.WriteLine(\"Pass #\" + i);\n    i++; // 增加循环控制变量\n\
  }\n```\n\n在这里，`for` 循环的迭代表达式是空的。相反，循环控制变量 `i` 在循环体内部进行了递增。这意味着每次循环重复时，都会对 `i` 进行测试以检查它是否等于\
  \ 10，但不会发生任何后续操作。当然，由于 `i` 在循环体内部递增，循环会正常运行，并显示以下输出：Pass #0\n\nPass #1\n\nPass #2\n\
  \nPass #3\n\nPass #4\n\nPass #5\n\nPass #6\n\nPass #7\n\nPass #8\n\nPass #9\n\n\
  在下一个示例中，初始化部分也被移出了 `for` 循环之外。\n\n```csharp\n// 将更多内容移出 for 循环之外。\nusing System;\n\
  class Empty2 {\n    static void Main() {\n        int i;\n        i = 0; // 将初始化移到循环外\n\
  \        // 初始化表达式\n        for(; i < 10; ) {\n            // 被移到了循环之外。\n      \
  \      Console.WriteLine(\"Pass #\" + i);\n            i++; // 增加循环控制变量\n      \
  \  }\n    }\n}\n```\n\n在这个版本中，`i` 在循环开始之前已初始化，而不是作为 `for` 的一部分。通常情况下，你会希望在 `for`\
  \ 内部初始化循环控制变量。将初始化放在循环外部通常只在初始值通过一个复杂过程得出，且该过程不适合包含在 `for` 语句内部时才这样做。\n\n### 无限循环\n\
  \n你可以通过让条件表达式为空来使用 `for` 创建一个 `无限循环`（永远不会终止的循环）。例如，下面的片段展示了许多 C# 程序员创建无限循环的方法：\n\
  \n```csharp\nfor(;;) // 刻的无限循环\n{\n    //...\n}\n```\n\n这个循环将一直运行下去。虽然有些编程任务需要无限循环（例如操作系统命令处理器），但大多数“无限循环”实际上只是具有特殊终止要求的循环。在本章的末尾，你将看到如何停止这种类型的循环。（提示：这是使用\
  \ `break` 语句完成的。）\n\n### 无主体的循环\n\n在 C# 中，与 `for` 循环（或任何其他循环）关联的主体可以是空的。这是因为空语句在语法上是有效的。没有主体的循环通常有用。例如，下面的程序使用一个这样的循环来求加\
  \ 1 到 5 的数字：\n\n```csharp\n// 循环的主体可以是空的。\nusing System;\nclass Empty3 {\n    static\
  \ void Main() {\n        int i;\n        int sum = 0;\n        // 累加 1 到 5 的数字。\n\
  \        for(i = 1; i <= 5; sum += i++) ;\n        // 此循环没有主体！\n        Console.WriteLine(\"\
  Sum is \" + sum);\n    }\n}\n```\n\n# 第 3 章：程序控制语句\n\n程序的输出在此处：\n\nSum is 15\n\n\
  注意，求加过程完全在 `for` 语句内部处理，且不需要主体。请特别注意迭代表达式：\n\n`sum += i++`\n\n不要被这样的语句吓到。它们在专业编写的\
  \ C# 程序中很常见，如果你将它们拆解为各个部分，就很容易理解。用语言来说，这条语句的意思是“给 `sum` 加上 `sum` 的值加上 `i`，然后递增 `i`”。因此，它等同于以下语句序列：\n\
  \n```csharp\nsum = sum + i;\ni++;\n```\n\n### 在 for 循环内部声明循环控制变量\n\n通常，控制 `for`\
  \ 循环的变量只需要用于循环目的，而不会在其他地方使用。在这种情况下，可以在 `for` 的初始化部分声明该变量。例如，下面的程序同时计算了 1 到 5 数字的和和阶乘。它在\
  \ `for` 内部声明了它的循环控制变量 `i`：\n\n```csharp\n// 在 for 内部声明循环控制变量。\nusing System;\nclass\
  \ ForVar {\n    static void Main() {\n        int sum = 0;\n        int fact = 1;\n\
  \        // 计算 1 到 5 数字的阶乘。注意 i 是在这里声明的\n        for(int i = 1; i <= 5; i++) {\n\
  \            // 在循环内部。\n            sum += i; // i 在整个循环中都是已知的\n            fact\
  \ *= i;\n        }\n        // 在这里，i 是不可见的。\n        Console.WriteLine(\"Sum is\
  \ \" + sum);\n        Console.WriteLine(\"Factorial is \" + fact);\n    }\n}\n```\n\
  \n当你在 `for` 循环内部声明变量时，有一个重要的点需要记住：该变量的作用域随着 `for` 语句的结束而结束。（也就是说，变量的作用域局限于 `for`\
  \ 循环。）在 `for` 循环外部，该变量将不再存在。因此，在前一个示例中，`i` 在 `for` 循环外部无法访问。如果你需要在程序的其他地方使用循环控制变量，就无法在\
  \ `for` 循环内部声明它。\n\n在继续之前，你可能想尝试对 `for` 循环进行自己的变体。正如你将发现的，这是一个非常有趣的循环。\n\n### while\
  \ 循环\n\nC# 的另一个循环是 `while`。`while` 的通用形式是 `while (condition) { statement }`。`statement`\
  \ 可以是单个语句，也可以是一个块。`condition` 是布尔表达式。当条件为真时，`statement` 就会执行。\n\n```csharp\n// 演示\
  \ while 循环\nusing System;\nclass WhileDemo {\n    static void Main() {\n       \
  \ char ch = 'a';\n        // 使用 while 打印字母\n        while (ch <= 'z') {\n      \
  \      Console.Write(ch);\n            ch++;\n        }\n    }\n}\n```\n\n在这里，`ch`\
  \ 被初始化为 'a'。每次循环，`ch` 会被输出并递增。这个过程一直持续到 `ch` 大于 'z'。与 `for` 循环一样，`while` 在循环顶部检查条件，这意味着循环可能一次都不执行。下面的程序展示了\
  \ `while` 的这种特性。它计算 0 到 9 的整数幂：\n\n```csharp\n// 计算 2 的幂。\nusing System;\nclass\
  \ Power {\n    static void Main() {\n        int e;\n        int result;\n     \
  \   for(int i=0; i < 10; i++) {\n            result = 1;\n            e = i;\n \
  \           while(e > 0) {\n                // 当 e 为零或负数时，不会执行。\n              \
  \  result *= 2;\n                e--;\n            }\n            Console.WriteLine(\"\
  2 to the \" + i + \" power is \" + result);\n        }\n    }\n}\n```\n\n程序的输出如下：\n\
  \n2 to the 0 power is 1\n2 to the 1 power is 2\n2 to the 2 power is 4\n2 to the\
  \ 3 power is 8\n2 to the 4 power is 16\n2 to the 5 power is 32\n2 to the 6 power\
  \ is 64\n2 to the 7 power is 128\n2 to the 8 power is 256\n2 to the 9 power is 512\n\
  \n注意 `while` 循环只有在 `e` 大于 0 时才会执行。因此，当 `e` 为零时（正如 `for` 循环的第一次迭代所示），`while` 循环被跳过。\n\
  \n### 专家\n\n问：鉴于 C# 所有循环都具有灵活性，我在选择循环时应该遵循什么标准？也就是说，我如何为特定任务选择合适的循环？\n\n答：在执行已知次数的迭代时使用\
  \ `for` 循环。当你需要一个至少执行一次的循环时，使用 `do-while` 循环。当循环重复次数未知时，`while` 是最佳选择。\n\n### do-while\
  \ 循环\n\n下一个循环是 `do-while`。与 `for` 和 `while` 循环（在循环顶部测试条件）不同，`do-while` 循环在循环底部检查条件。这意味着\
  \ `do-while` 循环至少执行一次。`do-while` 循环的通用形式为：\n\n```csharp\n// 声明变量\ndo {\n    // 语句\n\
  \    // 将 9 赋值给 length。\n} while (condition);\n```\n\n\n\n\n虽然当只有一个语句时大括号并不是必要的，但它们通常被用于提高\
  \ `do-while` 结构的可读性，从而防止与 `while` 混淆。\n\n`do-while` 循环在条件表达式为真时一直执行。\n\n以下程序将一直循环直到用户输入字母\
  \ `q`：\n\n```csharp\n// Demonstrate the do-while loop.\n\nusing System;\n\nclass\
  \ DWDemo {\n    // Loop while ch does not equal ‘q’.\n    static void Main() {\n\
  \        char ch;\n        do {\n            Console.Write(\"Press a key followed\
  \ by ENTER: \");\n            ch = (char) Console.Read(); // read a keypress\n \
  \       } while(ch != 'q');\n    }\n}\n```\n\n通过使用 `do-while` 循环，我们可以进一步改进本章之前的猜字母游戏程序。这次，程序将一直循环到你猜出字母为止。\n\
  \n```csharp\n// Guess the letter game, 4th version.\n\nusing System;\n\nclass Guess4\
  \ {\n    static void Main() {\n        char ch, answer = 'K';\n        do {\n  \
  \          Console.WriteLine(\"I'm thinking of a letter between A and Z.\");\n \
  \           Console.Write(\"Can you guess it: \");\n            // Read a letter,\
  \ but skip cr/lf.\n            do {\n                ch = (char) Console.Read();\n\
  \            } while(ch == '\\n' | ch == '\\r');\n            if(ch == answer) Console.WriteLine(\"\
  \ Right \");\n            else {\n                Console.Write(\"...Sorry, you're\
  \ \");\n                if(ch < answer) Console.WriteLine(\"too low\");\n      \
  \          else Console.WriteLine(\"too high\");\n                Console.WriteLine(\"\
  Try again!\\n\");\n            }\n        } while(answer != ch);\n    }\n}\n```\n\
  \n这是一个运行示例：\n\n```text\nI'm thinking of a letter between A and Z.\nCan you guess\
  \ it: A\n...Sorry, you're too low\nTry again!\nI'm thinking of a letter between\
  \ A and Z.\nCan you guess it: Z\n...Sorry, you're too high\nTry again!\nI'm thinking\
  \ of a letter between A and Z.\nCan you guess it: K\nRight\n```\n\n注意此程序中另一个有趣的点。这里显示的\
  \ `do-while` 循环获取了下一个字符，跳过了输入流中可能存在的任何回车符和换行符：\n\n```csharp\n// read a letter, but\
  \ skip cr/lf\ndo {\n    ch = (char) Console.Read(); // get a char\n} while(ch ==\
  \ '\\n' | ch == '\\r');\n```\n\n以下是需要这个循环的原因。正如之前解释过的，控制台输入是行缓冲的——你必须按下 ENTER 字符才会被发送。按下\
  \ ENTER 会产生一个回车符和一个换行符。这些字符会悬留在输入缓冲区中。该循环通过继续读取输入直到这两个字符都不存在，从而丢弃了这些字符。\n\n# 第 3\
  \ 章：程序控制语句\n\n### 103\n\n尝试一下：改进 C# 帮助系统\n\n此程序扩展了上一个“尝试一下”部分开始的 C# 帮助系统。这个版本增加了\
  \ `for`、`while` 和 `do-while` 循环的语法。它还会检查用户的菜单选择，一直循环直到输入有效响应为止。\n\n### 逐步进行\n\n\
