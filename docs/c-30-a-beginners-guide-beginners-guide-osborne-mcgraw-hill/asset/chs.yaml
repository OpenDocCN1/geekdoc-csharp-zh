  \ [] args) { // ... }\n```\n哪些调用是合法的？\nA. `meth(10, 12, 19)`\nB. `meth(10, 12, 19,\
  \ 100)`\nC. `meth(10, 12, 19, 100, 200)`\nD. `meth(10, 12)`\n\n\n\n\n\n# 运算符重载基础\n\
  \n- 重载二元运算符\n- 重载一元运算符\n- 重载关系运算符\n- 索引器\n- 属性\n\n本章研究了三种特殊类型的类成员：重载运算符、索引器和属性。这些成员中的每一种都通过提高类的易用性、其与\
  \ C# 类型系统的集成程度以及健壮性，扩展了类的功能。使用这些成员，可以创建出看起来和用起来都像内置类型的类类型。这种 `type` `extensibility`\
  \ 是 C# 等面向对象语言强大之处的重要部分。\n\n## 运算符重载\n\nC# 允许你相对于你创建的类定义运算符的含义。这一过程被称为 `operator\
  \ overloading`（运算符重载）。通过通过重载运算符，你可以将其用法扩展到你的类中。运算符的效果完全由你控制，并且可能因类而异。例如，一个定义了链表的类可能会使用\
  \ `+` 运算符将对象添加到列表中。一个实现栈的类可能会使用 `+` 将对象推入栈中。另一个类可能会以一种完全不同的方式使用 `+` 运算符。\n\n当运算符被重载时，它的原始含义并不会丢失。只是相对于特定类添加了一个新操作。因此，例如，重载\
  \ `+` 来处理链表不会导致其相对于整数的含义（即加法）发生改变。\n\n运算符重载的一个主要优势是，它允许你将新的类类型无缝地集成到你的编程环境中。一旦为类定义了运算符，你就可以使用标准的\
  \ C# 表达式语法对该类的对象进行操作。你甚至可以在涉及其他数据类型的数据表达式中使用对象。\n\n运算符重载与方法重载紧密相关。要重载运算符，请使用 `operator`\
  \ 关键字来定义一个 `operator method`（运算符方法），该方法定义了运算符的操作。\n\n## 运算符方法的通用形式\n\n`operator`\
  \ 方法有两种形式：一种用于一元运算符，另一种用于二元运算符。每种形式的通用用法如下所示：\n\n```csharp\n// 重载一元运算符的通用形式。\npublic\
  \ static *ret*- *type* operator *op*( *param*- *type* *operand*)\n{\n    // 操作\n\
  }\n\n// 重载二元运算符的通用形式。\npublic static *ret*- *type* operator *op*( *param*- *type1*\
  \ *operand1, param-type2 operand2*)\n{\n    // 操作\n}\n```\n\n在这里，你正在重载的运算符 `*`（例如\
  \ `+` 或 `/`）被替换 `op`。`ret-type` 是指定操作返回值的类型。尽管可以是你选择的任何类型，但返回值通常与重载该运算符的类类型相同。这种关联性有助于在表达式中使用重载的运算符。\n\
  \n对于一元运算符，操作数通过 `operand` 传入。对于二元运算符，操作数通过 `operand1` 和 `operand2` 传入。\n\n对于一元运算符，操作数的类型必须与定义运算符的类类型相同。对于二元运算符，操作数中至少有一个必须与类类型相同。因此，你不能为你尚未创建的对象重载任何\
  \ C# 运算符。\n\n例如，你不能为 `int` 或 `string` 重新定义 `+`。\n\n另一点：运算符参数不能使用 `ref` 或 `out` 修饰符。\n\
  \n## 重载二元运算符\n\n为了了解运算符重载是如何工作的，让我们从一个重载了两个二元运算符（`+` 和 `–`）的示例开始。以下程序创建了一个名为 `ThreeD`\
  \ 的类，它维护三维空间中对象的坐标。重载的 `+` 将一个 `ThreeD` 对象的各个坐标添加到另一个中。重载的 `–` 将一个对象的坐标减去另一个对象的坐标。\n\
  \n```csharp\n// 运算符重载的示例。\nusing System;\n\n// 三维坐标类。\nclass ThreeD {\n    int x,\
  \ y, z; // 3D 坐标\n\n    public ThreeD() { x = y = z = 0; }\n    public ThreeD(int\
  \ i, int j, int k) { x = i; y = j; z = k; }\n\n    // 重载二元 +.\n    public static\
  \ ThreeD operator +(ThreeD op1, ThreeD op2)\n    {\n        ThreeD result = new\
  \ ThreeD();\n        // 为 ThreeD 对象重载 +。\n        /* 这将两个点的坐标相加\n        并返回结果。\
  \ */\n        result.x = op1.x + op2.x; // 这些是整数加法\n        result.y = op1.y + op2.y;\
  \ // 并且 + 保留了其原始\n        result.z = op1.z + op2.z; // 相对于它们的含义。\n        return\
  \ result;\n    }\n\n    // 重载二元 -.\n    public static ThreeD operator -(ThreeD op1,\
  \ ThreeD op2)\n    {\n        ThreeD result = new ThreeD();\n        // 为 ThreeD\
  \ 对象重载 –。\n        /* 注意操作数的顺序。op1 是左\n        操作数，而 op2 是右操作数。 */\n        result.x\
  \ = op1.x - op2.x; // 这些是整数减法\n        result.y = op1.y - op2.y;\n        result.z\
  \ = op1.z - op2.z;\n        return result;\n    }\n\n    // 显示 X, Y, Z 坐标。\n   \
  \ public void Show()\n    {\n        Console.WriteLine(x + \", \" + y + \", \" +\
  \ z);\n    }\n}\n\nclass TDemo {\n    static void Main() {\n        ThreeD a = new\
  \ ThreeD(1, 2, 3);\n        ThreeD b = new ThreeD(10, 20, 30);\n        ThreeD c\
  \ = a + b;\n        Console.Write(\"Here is a: \");\n        a.Show();\n       \
  \ Console.Write(\"Here is b: \");\n        b.Show();\n        Console.Write(\"Result\
  \ of a + b: \");\n        c.Show();\n\n        ThreeD d = a + c;\n        Console.Write(\"\
  Result of a + c: \");\n        d.Show();\n\n        ThreeD e = c - a;\n        Console.Write(\"\
  Result of c - a: \");\n        e.Show();\n\n        ThreeD f = c - b;\n        Console.Write(\"\
  Result of c - b: \");\n        f.Show();\n    }\n}\n```\n\n此程序产生以下输出：\nHere is a:\
  \ 1, 2, 3\nHere is b: 10, 20, 30\nResult of a + b: 11, 22, 33\nResult of a + c:\
  \ 22, 24, 36\nResult of c - a: 10, 20, 30\nResult of c - b: 1, 2, 3\n\n为了理解这为什么起作用，让我们仔细检查前面的程序，从重载的\
  \ `+` 开始。当类型为 `ThreeD` 的对象被 `+` 运算符操作时，它们的相应坐标被相加，如 `operator+( )` 所示。但是，此方法并没有修改任何操作数的值。相反，该方法返回一个包含操作结果的新\
  \ `ThreeD` 对象。\n\n\n\n\n现在，来看 `operator–()`。`-` 运算符的工作方式与 `+` 运算符相同，不同之处在于参数的顺序很重要。回想一下加法符合交换律，但减法不是。（也就是说，`A\
  \ – B` 不等于 `B – A`！）对于所有二元运算符，运算符方法的第一个参数将包含左操作数。第二个参数将包含右侧的操作数。在实现非交换运算符的重载版本时，你必须记住哪个操作数在左侧，哪个在右侧。\n\
  \n### 重载一元运算符\n\n一元运算符的重载方式与二元运算符一样。主要的区别在于它只有一个操作数。例如，这里有一个为 `ThreeD` 类重载一元负号的方法：\n\
  \n```csharp\n// Overload unary -.\npublic static ThreeD operator -(ThreeD op)\n\
  {\n    ThreeD result = new ThreeD();\n    result.x = -op.x;\n    result.y = -op.y;\n\
  \    result.z = -op.z;\n    return result;\n}\n```\n\n在这里，创建了一个包含操作数取反字段的新对象。然后返回该对象。注意操作数本身没有改变。再次，这符合一元负号的通常含义。例如，在如下表达式中\n\
  \n`a = -b`\n\n`a` 接收了 `b` 的取反值，但 `b` 没有改变。\n\n在 C# 中，重载 `++` 和 `--` 非常简单；只需返回增加或减少的值，但不要改变调用的对象。C#\
  \ 会自动为你处理这些，并考虑前缀形式和后缀形式的区别。例如，这里是为 `ThreeD` 类实现的 `operator++()` 方法：\n\n```csharp\n\
  // Overload unary ++.\npublic static ThreeD operator ++(ThreeD op)\n{\n    ThreeD\
  \ result = new ThreeD();\n    // Return the incremented result.\n    result.x =\
  \ op.x + 1;\n    result.y = op.y + 1;\n    result.z = op.z + 1;\n    return result;\n\
  }\n```\n\n这里是之前示例程序的扩展版本，展示了一元 `–` 和 `++` 运算符：\n\n```csharp\n// More operator overloading.\n\
  using System;\n\n// A three-dimensional coordinate class.\nclass ThreeD {\n    int\
  \ x, y, z; // 3-D coordinates\n    public ThreeD() { x = y = z = 0; }\n    public\
  \ ThreeD(int i, int j, int k) { x = i; y = j; z = k; }\n\n    // Overload binary\
  \ +.\n    public static ThreeD operator +(ThreeD op1, ThreeD op2)\n    {\n     \
  \   ThreeD result = new ThreeD();\n        /* This adds together the coordinates\
  \ of the two points\n        and returns the result. */\n        result.x = op1.x\
  \ + op2.x; // These are integer additions\n        result.y = op1.y + op2.y; //\
  \ and the + retains its original\n        result.z = op1.z + op2.z; // meaning relative\
  \ to them.\n        return result;\n    }\n\n    // Overload binary -.\n    public\
  \ static ThreeD operator -(ThreeD op1, ThreeD op2)\n    {\n        ThreeD result\
  \ = new ThreeD();\n        /* Notice the order of the operands. op1 is the left\n\
  \        operand and op2 is the right. */\n        result.x = op1.x - op2.x; //\
  \ these are integer subtractions\n        result.y = op1.y - op2.y;\n        result.z\
  \ = op1.z - op2.z;\n        return result;\n    }\n\n    // Overload unary -.\n\
  \    public static ThreeD operator -(ThreeD op)\n    {\n        // Implement unary\
  \ minus for ThreeD.\n        ThreeD result = new ThreeD();\n        result.x = -op.x;\n\
  \        result.y = -op.y;\n        result.z = -op.z;\n        return result;\n\
  \    }\n\n    // Overload unary ++.\n    public static ThreeD operator ++(ThreeD\
  \ op)\n    {\n        // Implement ++ for ThreeD.\n        ThreeD result = new ThreeD();\n\
  \        // Return the incremented result.\n        result.x = op.x + 1;\n     \
  \   result.y = op.y + 1;\n        result.z = op.z + 1;\n        return result;\n\
  \    }\n\n    // Show X, Y, Z coordinates.\n    public void Show()\n    {\n    \
  \    Console.WriteLine(x + \", \" + y + \", \" + z);\n    }\n}\n\nclass ThreeDDemo\
  \ {\n    static void Main() {\n        ThreeD a = new ThreeD(1, 2, 3);\n       \
  \ ThreeD b = new ThreeD(10, 10, 10);\n        ThreeD c = new ThreeD();\n       \
  \ Console.Write(\"Here is a: \");\n        a.Show();\n        Console.WriteLine();\n\
  \        Console.Write(\"Here is b: \");\n        b.Show();\n        Console.WriteLine();\n\
  \        c = a + b; // add a and b together\n        Console.Write(\"Result of a\
  \ + b: \");\n        c.Show();\n        Console.WriteLine();\n        c = a + b\
  \ + c; // add a, b and c together\n        Console.Write(\"Result of a + b + c:\
  \ \");\n        c.Show();\n        Console.WriteLine();\n    }\n}\n```\n\n\n\n此程序的输出显示此处：\n\
  \nHere is a: 1, 2, 3\n\nHere is b: 10, 10, 10\n\nResult of a + b: 11, 12, 13\n\n\
  Result of b + 10: 20, 20, 20\n\n如输出所示，当将 `+` 应用于两个 `ThreeD` 对象时，它们的坐标会相加。当将 `+`\
  \ 应用于一个 `ThreeD` 对象和一个整数时，坐标会增加该整数值。\n\n虽然刚才展示的 `+` 重载确实为 `ThreeD` 类增加了实用的功能，但它并没有完全完成任务。原因如下：`operator+(ThreeD,\
  \ int)` 方法允许像所示的语句：\n\n```\nob1 = ob2 + 10;\n```\n\n遗憾的是，它不允许像这这样的语句：\n\n```\nob1\
  \ = 10 + ob2;\n```\n\n因为整数参数是第二个参数，即右侧操作数。问题在于前述语句将整数参数放在了左侧。为了允许这两种形式的语句，你将再次重载\
  \ `+`。这个版本的第一个参数类型必须为 `int`，第二个参数类型必须为 `ThreeD`。`operator+( )` 方法的一个版本处理 `ThreeD`\
  \ +* 整数，另一个版本处理整数 +* `ThreeD`。\n\n通过这样重载 `+`（或任何其他二元运算符），允许内置类型出现在操作符的左侧或右侧。这是一个按照上述描述重载了\
  \ `+` 运算符的 `ThreeD` 版本：\n\n```csharp\n// 为 ThreeD + ThreeD, ThreeD + int 和 int +\
  \ ThreeD 重载 +。\n\nusing System;\n\n// 一个三维坐标类。\nclass ThreeD {\n    int x, y, z;\
  \ // 3-D 坐标\n\n    public ThreeD() { x = y = z = 0; }\n    public ThreeD(int i,\
  \ int j, int k) { x = i; y = j; z = k; }\n\n    // 为 ThreeD + ThreeD 重载二元 +。\n \
  \   public static ThreeD operator +(ThreeD op1, ThreeD op2) {\n        ThreeD result\
  \ = new ThreeD();\n        // 这处理 ThreeD + ThreeD。\n        /* 这将两个点的坐标相加\n    \
  \     * 并返回结果。 */\n        result.x = op1.x + op2.x;\n        result.y = op1.y +\
  \ op2.y;\n        result.z = op1.z + op2.z;\n        return result;\n    }\n\n \
  \   // 这处理 ThreeD + 整数。\n    // 为 ThreeD + int 重载二元 +。\n    public static ThreeD\
  \ operator +(ThreeD op1, int op2) {\n        ThreeD result = new ThreeD();\n   \
  \     result.x = op1.x + op2;\n        result.y = op1.y + op2;\n        result.z\
  \ = op1.z + op2;\n        return result;\n    }\n\n    // 这处理 整数 + ThreeD。\n   \
  \ // 为 int + ThreeD 重载二元 +。\n    public static ThreeD operator +(int op1, ThreeD\
  \ op2) {\n        ThreeD result = new ThreeD();\n        result.x = op2.x + op1;\n\
  \        result.y = op2.y + op1;\n        result.z = op2.z + op1;\n        return\
  \ result;\n    }\n\n    // 显示 X, Y, Z 坐标。\n    public void Show() {\n        Console.WriteLine(x\
  \ + \", \" + y + \", \" + z);\n    }\n}\n\nclass ThreeDDemo {\n    static void Main()\
  \ {\n        ThreeD a = new ThreeD(1, 2, 3);\n        ThreeD b = new ThreeD(10,\
  \ 10, 10);\n        ThreeD c = new ThreeD();\n        Console.Write(\"Here is a:\
  \ \");\n        a.Show();\n        Console.WriteLine();\n        Console.Write(\"\
  Here is b: \");\n        b.Show();\n        Console.WriteLine();\n        c = a\
  \ + b; // ThreeD + ThreeD\n        Console.Write(\"Result of a + b: \");\n     \
  \   c.Show();\n        Console.WriteLine();\n        c = b + 10; // ThreeD + int\n\
  \        Console.Write(\"Result of b + 10: \");\n        c.Show();\n        Console.WriteLine();\n\
  \        c = 15 + b; // int + ThreeD\n        Console.Write(\"Result of 15 + b:\
  \ \");\n        c.Show();\n    }\n}\n```\n\n此程序的输出显示此处：\n\nHere is a: 1, 2, 3\n\n\
  Here is b: 10, 10, 10\n\nResult of a + b: 11, 12, 13\n\nResult of b + 10: 20, 20,\
  \ 20\n\nResult of 15 + b: 25, 25, 25\n\n## 重载关系运算符\n\n关系运算符（例如 `=` 或 `<`）也可以被重载，且过程非常简单。通常，重载的关系运算符返回一个\
  \ `true` 或 `false` 值。这与这些运算符的正常用法一致，并允许将重载的关系运算符用于条件表达式中。\n\n\n\n运算符重载存在一些限制条件。你不能更改任何运算符的优先级。你不能更改运算符所需的操作数数量，尽管你的运算符方法可以选择忽略某个操作数。有几个运算符是无法重载的。可能最重要的一点是，你不能重载任何赋值运算符，包括复合赋值运算符，例如\
  \ `+=`。以下是其他不能重载的运算符。（其中某些运算符将在本书的后部分介绍。）\n\n```\n&&\n( )\n.\n?\n??\n[ ]\n||\n=\n\
  =>\n−>\nas\nchecked\ndefault\nis\nnew\nsizeof\ntypeof\nunchecked\n```\n\n最后一点是：关键字\
  \ `true` 和 `false` 也可以作为一元运算符用于重载。它们相对于某个类进行重载，以确定对象是“真”的还是“假”的。一旦这些类对这些关键字进行了重载，你就可以使用该类的对象来控制\
  \ `if` 语句，例如。\n\n262\n\nC# 3.0: 初学者指南\n\n### 专家问答\n\n**问：既然我不能重载诸如 `+=` 这样的运算符，如果我尝试在一个已经定义了\
  \ `+` 的类对象上使用 `+=` 会发生什么？更广泛地说，当我在一个定义了该赋值操作部分的对象上使用任何复合赋值时，会发生什么？**\n\n**答：** 通常情况下，如果你定义了一个运算符，当该运算符用于复合赋值时，会调用你重载的运算符方法。因此，`+=`\
  \ 会自动使用你版本的 `operator+()`。例如，假设有一个 `ThreeD` 类，如果你使用如下序列代码：\n\n```\nThreeD a = new\
  \ ThreeD(1, 2, 3);\nThreeD b = new ThreeD(10, 10, 10);\nb += a; // 将 a 和 b 相加\n\
  ```\n\n`ThreeD` 的 `operator+()` 会自动调用，`b` 将包含坐标 11, 12, 13。\n\n### 索引器 (Indexers)\n\
  \n如你所知，数组索引是使用 `[ ]` 运算符实现的。你可以为你创建的类重载 `[ ]` 运算符，但你并不使用 `operator` 方法。相反，你创建一个*索引器*（indexer）。索引器允许对象像数组一样被索引。索引器的主要用途是支持创建受一个或多个约束的特殊数组。然而，你可以将索引器用于任何对类数组语法有益的目的。索引器可以有一个或多个维度。\n\
  \n我们将从一维索引器开始。一维索引器具有以下通用形式：\n\n```cpp\nelement-type this[int index] {\n    // get\
  \ 访问器。\n    get {\n        // 返回由索引指定的值\n    }\n    // set 访问器。\n    set {\n   \
  \     // 设置由索引指定的值\n    }\n}\n```\n\n第 7 章：运算符重载、索引器和属性\n\n263\n\n在这里，*element-type*\
  \ 是索引器的元素类型。因此，通过索引器访问的每个元素都将是 *element-type* 类型。它对应于数组的元素类型。参数 `index` 接收所访问元素的索引。从技术上讲，这个参数不需要是\
  \ `int` 类型，但由于索引器通常用于提供数组索引，因此使用整数类型是习惯。\n\n在索引器的内部定义了两个名为 `get` 和 `set` 的*访问器*（accessors）。访问器类似于方法，不同之处在于它不声明返回类型或参数。访问器在使用索引器时会被自动调用，且两个访问器都接收\
  \ `index` 作为参数。如果索引器正在被赋值（例如它位于赋值语句的左侧），则会调用 `set` 访问器并必须设置由 `index` 指定元素。\n\n否则，将调用\
  \ `get` 访问器并必须返回与 `index` 关联的值。`set` 方法还会接收一个名为 `value` 的值，该值包含了要赋值给指定索引的值。\n\n\
  索引器的优点之一是，你可以精确地控制访问数组的方式，从而防止不当访问。例如，这里是实现第 6 章创建的“软性失败”（fail-soft）数组的更好方法。它使用索引器，从而允许使用普通的数组表示法访问数组。\n\
  \n```csharp\n// 通过添加索引器来改进软性失败数组。\nusing System;\n\nclass FailSoftArray {\n    int[]\
  \ a; // 数组的引用\n    public int Length; // Length 是公共的\n    public bool ErrFlag; //\
  \ 表示上一次操作的结果\n\n    // 给定大小构造数组。\n    public FailSoftArray(int size) {\n       \
  \ a = new int[size];\n        Length = size;\n    }\n\n    // 这是 FailSoftArray 的索引器。\n\
  \    public int this[int index] {\n        // FailSoftArray 的索引器。\n        // 这是\
  \ get 访问器。\n        get {\n            if(ok(index)) {\n                ErrFlag\
  \ = false;\n                return a[index];\n            } else {\n           \
  \     ErrFlag = true;\n                return 0;\n            }\n        }\n   \
  \     // 这是 set 访问器。\n        set {\n            if(ok(index)) {\n             \
  \   a[index] = value;\n                ErrFlag = false;\n            }\n       \
  \     else ErrFlag = true;\n        }\n    }\n\n    // 如果索引在边界内则返回 true。\n    private\
  \ bool ok(int index) {\n        if(index >= 0 & index < Length) return true;\n \
  \       return false;\n    }\n}\n\n// 演示软性失败数组。\nclass ImprovedSDemo {\n    static\
  \ void Main() {\n        FailSoftArray fs = new FailSoftArray(5);\n        int x;\n\
  \n        // 显示软性失败数组。\n        for (int i = 0; i < 7; i++) {\n            x = fs[i];\n\
  \            if (!fs.ErrFlag) {\n                Console.Write(x + \" \");\n   \
  \         } else {\n                Console.Write(\"error \");\n            }\n\
  \        }\n        Console.WriteLine();\n\n        // 显示改进的软性失败数组。\n        for\
  \ (int i = 0; i < 5; i++) {\n            fs[i] = i * 10;\n        }\n        for\
  \ (int i = 0; i < 7; i++) {\n            x = fs[i];\n            if (!fs.ErrFlag)\
  \ {\n                Console.Write(x + \" \");\n            } else {\n         \
  \       Console.Write(\"error \");\n            }\n        }\n        Console.WriteLine();\n\
  \    }\n}\n```\n\n\n\n索引器并不需要同时提供 `get` 和 `set`。你可以通过只实现 `get` 访问器来创建一个只读索引器。你可以通过只实现\
  \ `set` 来创建一个只写索引器。\n\n重要的一点是，理解索引器并不要求实际上在数组上操作。它只需要提供对索引器用户来说看起来是“类数组”的功能。例如，下面的程序有一个索引器，它的行为类似于一个包含从\
  \ 0 到 15 的 2 的幂次的只读数组。但请注意，并没有实际数组存在。相反，索引器只是为给定的索引计算适当的值。\n\n```csharp\n// Indexers\
  \ don't have to operate on actual arrays.\n\nusing System;\n\nclass PwrOfTwo {\n\
  \  /* Access a logical array that contains\nthe powers of 2 from 0 to 15. */\n \
  \ public int this[int index] {\n    // Compute and return power of 2.\n    get {\n\
  \      if((index >= 0) && (index < 16)) return Pwr(index);\n      else return -1;\n\
  \    }\n    // Here, no underlying array is used.\n    // There is no set accessor.\n\
  \  }\n\n  int Pwr(int p) {\n    int result = 1;\n    for(int i=0; i<p; i++)\n  \
  \    result *= 2;\n    return result;\n  }\n}\n\nclass UsePwrOfTwo {\n  static void\
  \ Main() {\n    PwrOfTwo pwr = new PwrOfTwo();\n    Console.Write(\"First 8 powers\
  \ of 2: \");\n    for(int i=0; i < 8; i++)\n      Console.Write(pwr[i] + \" \");\n\
  \    Console.WriteLine();\n    Console.Write(\"Here are some errors: \");\n    Console.Write(pwr[-1]\
  \ + \" \" + pwr[17]);\n  }\n}\n```\n\n程序的输出所示：\nFirst 8 powers of 2: 1 2 4 8 16\
  \ 32 64 128\nHere are some errors: -1 -1\n\n注意，`PwrOfTwo` 的索引器包含一个 `get` 访问器，但没有\
  \ `set` 访问器。如所解释，这意味着索引器是只读的。因此，`PwrOfTwo` 对象可以用于赋值语句的右侧，但不能用于左侧。例如，尝试向前面的程序添加此语句将不起作用：\n\
  \n```csharp\npwr[0] = 11; // won't compile\n```\n\n此语句将导致编译错误，因为没有为索引器定义 `set` 访问器。\n\
  \n### 多维索引器\n\n你也可以为多维数组创建索引器。例如，这里是一个二维容错（fail-soft）数组。请密切注意索引器的声明方式。\n\n```csharp\n\
  // A two-dimensional fail-soft array.\n\nusing System;\n\nclass FailSoftArray2D\
  \ {\n  int[,] a; // reference to 2D array\n  int rows, cols; // dimensions\n  public\
  \ int Length; // Length is public\n  public bool ErrFlag; // indicates outcome of\
  \ last operation\n\n  // Construct array given its dimensions.\n  public FailSoftArray2D(int\
  \ r, int c) {\n    rows = r;\n    cols = c;\n    a = new int[rows, cols];\n    Length\
  \ = rows * cols;\n  }\n\n  // This is the indexer for FailSoftArray2D.\n  public\
  \ int this[int index1, int index2] {\n    // A two-dimensional indexer.\n    //\
  \ This is the get accessor.\n    get {\n      if(ok(index1, index2)) {\n       \
  \ ErrFlag = false;\n        return a[index1, index2];\n      } else {\n        ErrFlag\
  \ = true;\n        return 0;\n      }\n    }\n    // This is the set accessor.\n\
  \    set {\n      if(ok(index1, index2)) {\n        a[index1, index2] = value;\n\
  \        ErrFlag = false;\n      }\n      else ErrFlag = true;\n    }\n  }\n\n \
  \ // Return true if indexes are within bounds.\n  private bool ok(int index1, int\
  \ index2) {\n    if(index1 >= 0 && index1 < rows &&\n      index2 >= 0 && index2\
  \ < cols)\n      return true;\n    return false;\n  }\n}\n\n// Demonstrate a 2D\
  \ indexer.\nclass TwoDIndexerDemo {\n  static void Main() {\n    FailSoftArray2D\
  \ fs = new FailSoftArray2D(3, 5);\n    int x;\n    // Show quiet failures.\n   \
  \ Console.WriteLine(\"Fail quietly.\");\n    for(int i=0; i < 6; i++)\n      fs[i,\
  \ i] = i*10;\n    for(int i=0; i < 6; i++) {\n      x = fs[i,i];\n      if(x !=\
  \ -1) Console.Write(x + \" \");\n    }\n    Console.WriteLine();\n    // Now, generate\
  \ failures.\n    Console.WriteLine(\"\\nFail with error reports.\");\n    for(int\
  \ i=0; i < 6; i++) {\n      fs[i,i] = i*10;\n      if(fs.ErrFlag)\n        Console.WriteLine(\"\
  fs[\" + i + \", \" + i + \"] out-of-bounds\");\n    }\n  }\n}\n```\n\n\n\n\n# 尝试给\
  \ `ob.MyProp` 赋值 -10\n\n`ob.MyProp` 的值：100\n\n让我们仔细这个程序。该程序定义了一个名为 `prop` 的私有字段以及名为\
  \ `MyProp` 的属性，用于管理对 `prop` 的访问。正如所解释的，属性本身并不定义存储位置。相反，大多数属性只是管理对字段的访问。\n\n此外，由于\
  \ `prop` 是私有的，它*只能*通过 `MyProp` 访问。\n\n属性 `MyProp` 被指定为 `public`，以便类外部的代码可以访问它。这种做法是合理的，因为它提供了对私有字段\
  \ `prop` 的访问。`get` 访问器简单返回 `prop` 的值。`set` 访问器仅当该值为正数时才设置 `prop` 的值。因此，`MyProp`\
  \ 属性控制了 `prop` 可以拥有的值。这就是属性之所以重要的本质。\n\n由 `MyProp` 定义的属性类型被称为“读写属性”，因为它允许其底层字段被读取和写入。然而，也可以创建只读和只写属性。要创建只读属性，只需定义一个\
  \ `get` 访问器。要定义只写属性，只需定义一个 `set` 访问器。\n\n你可以使用属性来进一步改进容错（fail-soft）数组类。如你所知，所有数组都关联有一个\
  \ `Length` 属性。到为止，`FailSoftArray` 类仅使用一个名为 `Length` 的公共整数字段来实现此目的。然而，这不是良好的做法，因为它允许将\
  \ `Length` 设置为容错数组长度以外的某个值\n\n（例如，一个恶意的程序员可能会故意破坏其值。）我们可以通过将 `Length` 转换为只读属性来补救这种情况，如此版本的\
  \ `FailSoftArray` 所示：\n\n```csharp\n// 为 FailSoftArray 添加 Length 属性。\n\nusing System;\n\
  \nclass FailSoftArray {\n    int[] a; // 数组的引用\n    int len; // 数组的长度\n\n    public\
  \ bool ErrFlag; // 表示上一次操作的结果\n\n    // 给定大小构造数组。\n    public FailSoftArray(int\
  \ size) {\n        a = new int[size];\n        len = size;\n    }\n\n    // 只读的\
  \ Length 属性。\n    public int Length {\n        // Length 现在是一个属性而不是字段。\n       \
  \ get {\n            return len;\n        }\n    }\n\n    // 这是 FailSoftArray 的索引器。\n\
  \    public int this[int index] {\n        // 这是 get 访问器。\n        get {\n     \
  \       if(ok(index)) {\n                ErrFlag = false;\n                return\
  \ a[index];\n            } else {\n                ErrFlag = true;\n           \
  \     return 0;\n            }\n        }\n        // 这是 set 访问器。\n        set {\n\
  \            if(ok(index)) {\n                a[index] = value;\n              \
  \  ErrFlag = false;\n            }\n            else ErrFlag = true;\n        }\n\
  \    }\n\n    // 如果索引在边界内则返回 true。\n    private bool ok(int index) {\n        if(index\
  \ >= 0 & index < Length) return true;\n        return false;\n    }\n}\n\n// 演示改进后的容错数组。\n\
  class ImprovedFSDemo {\n    static void Main() {\n        FailSoftArray fs = new\
  \ FailSoftArray(5);\n        int x;\n        // 可以读取 Length。\n        for(int i=0;\
  \ i < (fs.Length); i++)\n            fs[i] = i*10;\n\n        for(int i=0; i < (fs.Length);\
  \ i++) {\n            x = fs[i];\n            if(x != -1) Console.Write(x + \" \"\
  );\n        }\n        Console.WriteLine();\n        // fs.Length = 10; // 错误，非法！\n\
  \    }\n}\n```\n\n现在，`Length` 是一个只读属性，可以但不能赋值。为了向自己证明这一点，请尝试移除程序中该行的注释符号：\n\n```csharp\n\
  // fs.Length = 10; // 错误，非法！\n```\n\n当你尝试编译时，将收到一条错误消息，说明 `Length` 是只读的。\n\n# 自动实现属性\n\
  \n从 C# 3.0 开始，可以实现非常简单的属性而无需显式定义由属性管理的变量。相反，你可以让编译器自动提供底层变量。这被称为*自动实现属性*。它具有以下通用形式：\n\
  \n`type` `name` `{ get; set; }`\n\n在这里，`type` 指定属性的类型，`name` 指定名称。注意 `get` 和 `set`\
  \ 后面紧跟一个分号。自动实现属性的访问器没有正体。这种语法告诉编译器自动创建一个存储位置（有时称为*后备字段*），用于持有该值。此变量没有名称，并且你无法直接访问它。相反，它只能通过属性访问。\n\
  \n以下是使用自动实现属性声明名为 `UserCount` 属性的方法：`public int UserCount { get; set; }`\n\n注意没有显式声明变量。正如所解释的，编译器会自动生成一个持有该值的匿名字段。否则，`UserCount`\
  \ 的行为和用法与其他任何属性并无区别。\n\n与普通属性不同，自动实现属性不能是只读或只写的。`get` 和 `set` 必须指定。然而，你可以通过将 `get`\
  \ 或 `set` 声明为 `private` 来模拟相同的效果。尽管自动实现属性提供了便利，但它们的使用限于不需要对后备字段进行控制的情况。记住，你无法直接访问字段。\n\
  \n# 属性限制\n\n属性有一些重要的限制。首先，由于属性没有定义存储位置，因此它不能作为 `ref` 或 `out` 参数传递给方法。其次，你不能重载属性。（你*可以*拥有两个访问底层变量的不同属性，但这样做并不常见。）最后，属性在调用\
  \ `get` 访问器时不应改变状态。尽管编译器不强制此规则，但这种更改在语义上是错误的。`get` 操作不应产生副作用。\n\n## 使用访问修符访问器\n\n\
  默认情况下，`set` 和 `get` 访问器与它们所属的索引器或属性具有相同的访问权限。例如，如果属性声明为 `public`，那么默认情况下 `get` 和\
  \ `set` 访问器也是公共的。然而，你可以为 `set` 或 `get` 指定自己的访问修符，例如 `private`。在所有情况下，访问器的访问权限必须比其属性或索引器的访问规范更严格。\n\
  \n有很多理由限制访问器的访问权限。例如，你可能希望允许任何人获取属性值，但只允许类成员设置属性。要实现这一点，将 `set` 访问器声明为 `private`。\n\
  \n例如，这里有一个名为 `Max` 的属性，其 `set` 访问器指定为 `private`：\n\n```csharp\nclass MyClass {\n\
  \    int maximum;\n    // ...\n\n    public int Max {\n        get {\n         \
  \   return maximum;\n        }\n        private set { // set 访问器是私有的\n         \
  \   if(value < 0) maximum = -value;\n            else maximum = value;\n       \
  \ }\n    }\n    // ...\n}\n```\n\n现在，只有 `MyClass` 内部的代码可以设置 `Max` 的值，但任何代码都可以获取其值。\n\
  \n\n\n\n限制访问器访问权限最重要的用途之一是在处理自动实现属性时。如前所述，无法创建一个只读或只写的自动实现属性，因为在声明自动实现属性时，必须同时指定\
  \ `get` 和 `set` 访问器。然而，你可以通过将 `get` 或 `set` 声明为 `private` 来获得非常相同的效果。例如，这为前面所示的\
  \ `FailSoftArray` 类声明了一个实质上是只读的自动实现 `Length` 属性：`public int Length { get; private\
  \ set; }`\n\n由于 `set` 是 `private` 的，`Length` 只能通过其类内部的代码设置。在类外部，尝试更改 `Length` 是非法的。因此，在类外部，`Length`\
  \ 实际上是只读的。\n\n要尝试在 `FailSoftArray` 中使用自动实现版本的 `Length`，首先移除 `len` 变量。然后，将 `FailSoftArray`\
  \ 内部每个使用 `len` 的替换为 `Length`。以下是 `FailSoftArray` 的更新版本，以及用于演示的 `Main()` 方法：\n\n\
  ```\n// 为 FailSoftArray 演示自动实现的 Length 属性。\n\nusing System;\n\nclass FailSoftArray\
  \ {\n    int[] a; // 数组引用\n\n    public bool ErrFlag; // 表示上一次操作的结果\n\n    // 一个自动实现的、只读的\
  \ Length 属性。\n    public int Length { get; private set; }\n\n    // 给定大小构造数组。\n\
  \    public FailSoftArray(int size) {\n        a = new int[size];\n        // 给\
  \ Length 赋值 OK\n        Length = size;\n        // 在 FailSoftArray 内部。\n    }\n\n\
  \    // 这是 FailSoftArray 的索引器。\n    public int this[int index] {\n        // 这是\
  \ get 访问器。\n        get {\n            if(ok(index)) {\n                ErrFlag\
  \ = false;\n                return a[index];\n            } else {\n           \
  \     ErrFlag = true;\n                return 0;\n            }\n        }\n   \
  \     // 这是 set 访问器。\n        set {\n            if(ok(index)) {\n             \
  \   a[index] = value;\n                ErrFlag = false;\n            }\n       \
  \     else ErrFlag = true;\n        }\n    }\n\n    // 如果索引在边界内则返回 true。\n    private\
  \ bool ok(int index) {\n        if(index >= 0 & index < Length) return true;\n \
  \       return false;\n    }\n}\n\n// 演示自动实现的 Length 属性。\nclass AutoImpPropertyFSDemo\
  \ {\n    static void Main() {\n        FailSoftArray fs = new FailSoftArray(5);\n\
  \        int x;\n        // 可以读取 Length。\n        for(int i=0; i < (fs.Length);\
  \ i++)\n            fs[i] = i*10;\n        for(int i=0; i < (fs.Length); i++) {\n\
  \            x = fs[i];\n            if(x != -1) Console.Write(x + \" \");\n   \
  \     }\n        Console.WriteLine();\n        // fs.Length = 10; // 错误！Length 的\
  \ set 访问器是 private。\n    }\n}\n```\n\n在 `FailSoftArray` 外部对 `Length` 赋值是非法的。这个版本的\
  \ `FailSoftArray` 工作方式与之前的版本相同，但它不包含显式声明的备用字段。\n\n## 尝试一下：创建一个集合类\n\n正如本章开头提到的，运算符重载、索引器和属性可以帮助你创建可以完全集成到\
  \ C# 编程环境中的类。考虑这一点：通过定义必要的运算符、索引器和属性，你能够使类类型在程序中的用法与你使用内置类型完全一样。你可以通过运算符和索引器对该类的对象进行操作，并在表达式中使用该类的对象。添加属性使该类能够提供与\
  \ C# 内置对象一致的接口。为了说明将新类创建并集成到 C# 环境中，我们将创建一个名为 `Set` 的类来定义一种集合类型。\n\n在我们开始之前，准确理解我们所说的集合是非常重要的。对于本例而言，*集合*（set）是一个由唯一元素的集合。也就是说，在任何给定集合中，没有两个元素是相同的。集合成员的顺序是不值一提的。因此，集合\
  \ `{ A, B, C }` 与集合 `{ A, C, B }` 是相同的。集合也可以是空的。\n\n集合支持许多操作。我们将实现的有：\n\n* 向集合中添加元素\n\
  * 从集合中移除元素\n* 集合并集\n* 集合差集\n\n向集合中添加元素和从集合中移除元素是自言而易的操作。另外两个需要一些解释。\n\n两个集合的*并集*（union）是一个包含两个集合所有元素的集合。（当然，不允许重复元素。）我们将使用\
  \ `+` 运算符来执行集合并集。\n\n两个集合之间的*差集*（difference）是一个包含第一个集合中不在第二个集合中的元素的集合。我们将使用 `–`\
  \ 运算符来执行集合差集。例如，给定两个集合 `S1` 和 `S2`，该语句从 `S1` 中移除 `S2` 的元素，并将结果放入 `S3`：\n\n```\n\
  S3 = S1 – S2\n```\n\n如果 `S1` 和 `S2` 相同，那么 `S3` 将是空集合。有几种操作可以对集合。\n\n### 逐步步骤\n\n\
  1. 创建名为 `SetDemo.cs` 的新文件。\n2. 使用以下代码创建 `Set`：\n\n```csharp\nclass Set {\n    char[]\
  \ members; // 持有集合\n\n    // 一个自动实现的、只读 Length 属性。\n    public int Length { get;\
  \ private set; } // 成员数量\n```\n\n3. 添加以下 `Set` 构造函数：\n\n```csharp\n    // 构造空集合。\n\
  \    public Set() {\n        Length = 0;\n    }\n\n    // 给定大小构造空集合。\n    public\
  \ Set(int size) {\n        members = new char[size];\n        Length = 0;\n    }\n\
  \n    // 从另一个集合构造集合。\n    public Set(Set s) {\n        members = new char[s.Length];\n\
  \        for(int i=0; i < s.Length; i++) members[i] = s[i];\n        Length = s.Length;\n\
  \    }\n```\n\n集合可以通过三种方式构造。首先，可以创建一个空集合。空集合不包含成员，也不分配数组。因此，空集合只是一个占位符。其次，可以给定大小创建一个空集合。最后，可以从另一个集合构造。在这种情况下，两个集合包含相同的成员，但引用的是不同的对象。\n\
  \n4. 添加只读索引器：\n\n```csharp\n    // 实现只读索引器。\n    public char this[int idx]{\n  \
  \      get {\n            if(idx >= 0 & idx < Length) return members[idx];\n   \
  \         else return (char)0;\n        }\n    }\n```\n\n索引器根据索引返回集合的成员。执行了边界检查以防止数组越界。如果索引无效，则返回空字符。\n\
  \n5. 添加 `find()` 方法。该方法确定传入的元素 `ch` 是否为集合的成员。如果找到，则返回元素的索引，如果元素不在集合中则返回 -1。注意此方法是私有的。\n\
  \n```csharp\n    /* 检查元素是否在集合中。\n       返回元素的索引或未找到返回 -1。 */\n    int find(char\
  \ ch) {\n        int i;\n        for(i=0; i < Length; i++)\n            if(members[i]\
  \ == ch) return i;\n        return -1;\n    }\n```\n\n6. 开始添加集合运算符，从集合加开始。为了实现这一点，为\
  \ `Set` 类型的对象重载 `+`，如下。此版本向集合中添加元素。\n\n```csharp\n    // 向集合中添加唯一的元素。\n    public\
  \ static Set operator +(Set ob, char ch) {\n        // 如果 ch 已经在集合中，则返回原始集合的副本。\n\
  \        if(ob.find(ch) != -1) {\n            // 返回原始集合的副本。\n            return\
  \ new Set(ob);\n        } else { // 返回一个包含新元素的新集合。\n            // 让新集合比原始集合大一个元素。\n\
  ```\n\n\n\n\n```cs\nSet newset = new Set(ob.Length+1);\n\n// 将元素复制到新集合。\n\nfor(int\
  \ i=0; i < ob.Length; i++)\nnewset.members[i] = ob.members[i];\n\n// 设置 Length 属性。\n\
  \nnewset.Length = ob.Length+1;\n\n// 将新元素添加到新集合。\n\nnewset.members[newset.Length-1]\
  \ = ch;\n\nreturn newset; // 返回新集合\n\n}\n\n}\n```\n\n该方法经过了仔细的逻辑推检查。首先，调用 `find()`\
  \ 方法来确定 `ch` 是否已经在集合中。如果它返回除 -1 以外的值，说明 `ch` 已经在集合中，因此返回原始集合的副本。否则，将创建一个名为 `newset`\
  \ 的新集合，它将包含 `ob` 所引用的原始集合的内容，加上新元素 `ch`。注意，它的创建比 `ob` 大一个元素，以容纳新元素。接下来，将原始元素复制到\
  \ `newset` 中，并将 `newset` 的长度设置为比原始集合大一。然后，将 `ch` 添加到 `newset` 的最后。最后返回 `newset`。在所有情况下，此操作都未修改原始集合，并返回一个新集合。因此，返回的集合与作为操作数的传入集合是分离且不同的。\n\
  \n# 第 7 章：运算符重载、索引器和属性\n\n7. 接下来，重载 `–` 以便从集合中移除元素，如下所示：\n\n```cs\n// 从集合中移除一个元素。\n\
  \npublic static Set operator -(Set ob, char ch) {\n\nSet newset = new Set();\nint\
  \ i = ob.find(ch); // 如果未找到元素，i 将为 -1\n\n// 复制并压缩剩余元素。\n\nfor(int j=0; j < ob.Length;\
  \ j++)\nif(j != i) newset = newset + ob.members[j];\n\nreturn newset;\n}\n```\n\n\
  首先，创建一个新的空集合。其次，调用 `find()` 来确定 `ch` 是否为原始集合的成员。记住，如果 `ch` 不是成员，`find()` 将返回 -1。接下来，将原始集合的元素添加到新集合中，但与\
  \ `find()` 返回索引匹配的元素除外。因此，结果集合包含原始集合的所有元素，但 `ch` 除外。如果 `ch` 原本不在原始集合中，那么这两个集合是等价的。\n\
  \n8. 再次重载 `+` 和 `–`，如下所示。这些版本实现了集合并集和集合差。\n\n```cs\n// 集合并集。\n\npublic static Set\
  \ operator +(Set ob1, Set ob2) {\n\nSet newset = new Set(ob1); // 复制第一个集合\n\n//\
  \ 添加第二个集合中的唯一元素。\n\nfor(int i=0; i < ob2.Length; i++)\nnewset = newset + ob2[i];\n\
  \nreturn newset; // 返回更新后的集合\n}\n\n// 集合差。\n\npublic static Set operator -(Set ob1,\
  \ Set ob2) {\n\nSet newset = new Set(ob1); // 复制第一个集合\n\n// 从第二个集合中减去元素\nfor(int\
  \ i=0; i < ob2.Length; i++)\nnewset = newset - ob2[i];\n\nreturn newset; // 返回更新后的集合\n\
  }\n```\n\n如所示，这些方法利用了之前定义的 `+` 和 `–` 运算符版本来帮助执行操作。在集合并集的情况下，创建一个包含第一个集合元素的新集合。然后添加第二个集合的元素。由于\
  \ `+` 操作仅在元素已不在集合中时才添加，因此结果集合是两个集合的并集（不包含重复）。集合差运算符则减去匹配的元素。\n\n9. 这里是 `Set` 类的完整代码，以及演示它的\
  \ `SetDemo` 类：\n\n```cs\n// 用于字符的集合类。\n\nusing System;\n\nclass Set {\nchar[] members;\
  \ // 此数组持有集合\n\n// 自动实现的只读 Length 属性。\npublic int Length { get; private set; }\n\
  \n// 构造一个空集合。\npublic Set() {\n\nLength = 0;\n}\n\n// 构造一个给定大小的空集合。\npublic Set(int\
  \ size) {\n\nmembers = new char[size]; // 为集合分配内存\nLength = 0; // 构造时没有成员\n}\n\n\
  // 从另一个集合构造集合。\npublic Set(Set s) {\n\nmembers = new char[s.Length]; // 为集合分配内存\n\
  for(int i=0; i < s.Length; i++) members[i] = s[i];\nLength = s.Length; // 成员数量\n\
  }\n\n// 实现只读索引器。\npublic char this[int idx]{\nget {\nif(idx >= 0 & idx < Length)\
  \ return members[idx];\nelse return (char)0;\n}\n}\n\n/* 检查元素是否在集合中。\n返回元素的索引，如果未找到则返回\
  \ -1。 */\nint find(char ch) {\nint i;\nfor(i=0; i < Length; i++)\nif(members[i]\
  \ == ch) return i;\nreturn -1;\n}\n\n// 向集合中添加唯一元素。\npublic static Set operator\
  \ +(Set ob, char ch) {\n// 如果 ch 已经在集合中，返回原始集合的副本。\nif(ob.find(ch) != -1) {\nreturn\
  \ new Set(ob);\n} else { // 返回一个包含新元素的新集合\nSet newset = new Set(ob.Length+1);\n\
  // 将元素复制到新集合。\nfor(int i=0; i < ob.Length; i++)\nnewset.members[i] = ob.members[i];\n\
  // 设置 Length 属性。\nnewset.Length = ob.Length+1;\n// 将新元素添加到新集合。\nnewset.members[newset.Length-1]\
  \ = ch;\nreturn newset; // 返回新集合\n}\n\n// 从集合中移除一个元素。\npublic static Set operator\
  \ -(Set ob, char ch) {\nSet newset = new Set();\nint i = ob.find(ch); // 如果未找到元素，i\
  \ 将为 -1\n// 复制并压缩剩余元素。\nfor(int j=0; j < ob.Length; j++)\nif(j != i) newset = newset\
  \ + ob.members[j];\n\nreturn newset;\n}\n\n// 集合并集。\npublic static Set operator\
  \ +(Set ob1, Set ob2) {\nSet newset = new Set(ob1); // 复制第一个集合\n// 添加第二个集合中的唯一元素。\n\
  for(int i=0; i < ob2.Length; i++)\nnewset = newset + ob2[i];\n\nreturn newset; //\
  \ 返回更新后的集合\n}\n\n// 集合差。\npublic static Set operator -(Set ob1, Set ob2) {\nSet\
  \ newset = new Set(ob1); // 复制第一个集合\n// 从第二个集合中减去元素\nfor(int i=0; i < ob2.Length;\
  \ i++)\nnewset = newset - ob2[i];\n\nreturn newset; // 返回更新后的集合\n}\n}\n\n// 演示集合类。\n\
  class SetDemo {\nstatic void Main() {\n// 构造空集合。\nSet s1 = new Set();\nSet s2 =\
  \ new Set();\nSet s3 = new Set();\ns1 = s1 + 'A';\ns1 = s1 + 'B';\ns1 = s1 + 'C';\n\
  Console.Write(\"s1 after adding A C: \");\nfor(int i=0; i < s1.Length; i++)\nConsole.Write(s1[i]);\n\
  Console.WriteLine();\ns2 = s2 + 'A';\ns2 = s2 + 'X';\ns2 = s2 + 'W';\nConsole.Write(\"\
  s2 after adding X W: \");\nfor(int i=0; i < s2.Length; i++)\nConsole.Write(s2[i]);\n\
  Console.WriteLine();\ns3 = s1 + s2;\nConsole.Write(\"s3 after s1 + s2: \");\nfor(int\
  \ i=0; i < s3.Length; i++)\nConsole.Write(s3[i]);\nConsole.WriteLine();\ns3 = s3\
  \ - s1;\nConsole.Write(\"s3 after s3 - s1: \");\nfor(int i=0; i < s3.Length; i++)\n\
  Console.Write(s3[i]);\nConsole.WriteLine(\"\\n\");\ns2 = s2 - s2; // 清空 s2\ns2 =\
  \ s2 + 'C'; // 按逆序添加 ABC\ns2 = s2 + 'B';\ns2 = s2 + 'A';\nConsole.Write(\"s1 is\
  \ now: \");\nfor(int i=0; i < s1.Length; i++)\nConsole.Write(s1[i]);\nConsole.WriteLine();\n\
  Console.Write(\"s2 is now: \");\nfor(int i=0; i < s2.Length; i++)\nConsole.Write(s2[i]);\n\
  Console.WriteLine();\nConsole.Write(\"s3 is now: \");\nfor(int i=0; i < s3.Length;\
  \ i++)\nConsole.Write(s3[i]);\nConsole.WriteLine();\n}\n}\n```\n\n\n\n\n该程序的输出显示在此：\n\
  \ns1 after adding A B C: A B C\n\ns1 after s1 = s1 - 'B': A C\n\ns1 after s1 = s1\
  \ - 'A': C\n\ns1 after a1 = s1 - 'C':\n\ns1 after adding A B C: A B C\n\ns2 after\
  \ adding A X W: A X W\n\n*(续)*\n\n286\n\nC# 3.0: 入学者指南\n\ns3 after s3 = s1 + s2:\
  \ A B C X W\n\ns3 after s3 - s1: X W\n\ns1 is now: A B C\n\ns2 is now: C B A\n\n\
  s3 is now: X W\n\n✓ *第 7 章自测*\n\n1. 显示用于重载一元运算符的通用形式。运算符方法的参数必须是什么类型的？\n\n2. 为了允许涉及类类型和内建类型的操作，你必须做什么？\n\
  \n3. `?` 可以被重载吗？你可以更改运算符的优先级吗？\n\n4. 什么是索引器？显示它的通用形式。\n\n5. 在索引器中，它的 `get` 和 `set`\
  \ 访问器必须执行什么函数？\n\n6. 什么是属性？显示它的通用形式。\n\n7. 属性定义了存储位置吗？如果没有，属性在何存储它的值？\n\n8. 属性可以作为\
