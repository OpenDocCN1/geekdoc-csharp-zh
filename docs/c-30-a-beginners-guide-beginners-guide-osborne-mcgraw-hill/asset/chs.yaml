  \    }\n}\n```\n\n\n\n## 随机访问文件\n\n到目前为止，我们一直在使用*顺序*文件，即按顺序一个一个访问文件。然而，你也可以随机顺序访问文件内容。为了这样做，你将使用\
  \ `Seek()` 方法将*文件位置*（也称为*文件指针*）设置到任意点。\n\n`Seek()` 方法定义如下：\n\n```\nlong Seek(long\
  \ *newPos*, SeekOrigin *origin*)\n```\n\n在这里，`newPos` 指定文件指针的位置（以字节为单位），相对于指定的 `origin`。起点将是\
  \ `SeekOrigin` 枚举中的值之一：\n\n| 值 | 含义 |\n| :--- | :--- |\n| `Begin` | 从文件开始偏移。 |\n\
  | `Current` | 从当前位置偏移。 |\n| `End` | 从文件末尾偏移。 |\n\n调用 `Seek()` 之后，下一次读取或写入将在新的文件位置进行。如果在寻址时发生错误，将抛出\
  \ `IOException`。如果底层流不支持位置请求，将抛出 `NotSupportedException`。可能发生其他异常。\n\n这是一个演示随机访问\
  \ I/O 的示例。它将大写字母表写入文件，然后以非顺序顺序读取。\n\n```csharp\n// 演示随机访问。\nusing System;\nusing\
  \ System.IO;\n\nclass RandomAccessDemo {\n    static void Main() {\n        FileStream\
  \ f;\n        char ch;\n        try {\n            f = new FileStream(\"random.dat\"\
  , FileMode.Create);\n        } catch (IOException ex) {\n            Console.WriteLine(ex.Message);\n\
  \            return;\n        }\n        // 写入字母表。\n        for(int i=0; i < 26;\
  \ i++) {\n            try {\n                f.WriteByte((byte)('A'+i));\n     \
  \       } catch (IOException ex) {\n                Console.WriteLine(ex.Message);\n\
  \                f.Close();\n                return;\n            }\n        }\n\
  \n        try {\n            // 现在，读取特定的值。\n            f.Seek(0, SeekOrigin.Begin);\
  \ // 移到第一个字节\n            ch = (char)f.ReadByte();\n            Console.WriteLine(ch);\n\
  \            f.Seek(10, SeekOrigin.Begin); // 移到第 11 个字节\n            ch = (char)f.ReadByte();\n\
  \            Console.WriteLine(ch);\n            f.Close();\n        } catch (IOException\
  \ ex) {\n            Console.WriteLine(ex.Message);\n        }\n    }\n}\n```\n\n\
  \n\n\n\n```cs\nch = (char) f.ReadByte();\nConsole.WriteLine(\"First value is \"\
  \ + ch);\n```\n\n使用 `Seek()` 移动文件位置：\n\n```cs\nf.Seek(1, SeekOrigin.Begin); // seek\
  \ 到第二个字节指针。\nch = (char) f.ReadByte();\nConsole.WriteLine(\"Second value is \" +\
  \ ch);\nf.Seek(4, SeekOrigin.Begin); // seek 到第 5 个字节\nch = (char) f.ReadByte();\n\
  Console.WriteLine(\"Fifth value is \" + ch);\nConsole.WriteLine();\n\n// 现在，读取每隔一个值。\n\
  Console.WriteLine(\"Here is every other value: \");\n```\n\n```cs\nfor(int i=0;\
  \ i < 26; i += 2) {\n    f.Seek(i, SeekOrigin.Begin); // seek 到第 ith 字符\n    ch\
  \ = (char) f.ReadByte();\n    Console.Write(ch + \" \");\n}\n}\ncatch(IOException\
  \ exc) {\n    Console.WriteLine(exc.Message);\n}\nConsole.WriteLine();\nf.Close();\n\
  }\n```\n\n程序的输出显示在此：\n\n```\nFirst value is A\nSecond value is B\nFifth value is\
  \ E\nHere is every other value:\nA C E G I K M O Q S U W Y\n```\n\n# 将数值字符串转换为其内部表示形式\n\
  \n在离开 I/O 主题之前，我们将检查一种在读取数值字符串时非常有用的技术。如你所知，`WriteLine()` 提供了一种向控制台输出各种类型数据的一种方便方法，包括内置类型的数值值，例如\
  \ `int` 和 `double`。\n\n因此，`WriteLine()` 自动将数值值转换为其对人类可读的格式。\n\n然而，并没有一种平行的输入方法可以读取并将包含数值的字符串转换为其内部的二进制格式。例如，目前没有哪个版本的\
  \ `Read()` 可以从键盘读取如“100”这样的字符串，然后自动将其转换为相应的二进制值，且该值可以存储在 `int` 变量中。相反，有其他方法可以完成此任务。也许简单的方法是使用为所有内置数值类型定义的方法：`Parse()`。\n\
  \n在我们开始之前，有必要说明一个重要的事实：C# 的所有内置类型（如 `int` 和 `double`）实际上只是 .NET Framework 定义的结构的别名（即其他名称）。事实上，C#\
  \ 类型和 .NET 结构体类型是无法区分的。它们只是彼此的另一个名称。由于 C# 的值类型由结构体支持，因此这些值类型拥有为其定义的成员。\n\n# 第 11\
  \ 章：使用 I/O\n\n对于 C# 数值类型，.NET 结构体名称及其对应的 C# 关键字等效项所示：\n\n| .NET 结构体名称 | C# 名称 |\n\
  | :--- | :--- |\n| Decimal | decimal |\n| Double | double |\n| Single | float |\n\
  | Int16 | short |\n| Int32 | int |\n| Int64 | long |\n| UInt16 | ushort |\n| UInt32\
  \ | uint |\n| UInt64 | ulong |\n| Byte | byte |\n| SByte | sbyte |\n\n这些结构定义在 `System`\
  \ 命名空间中。因此，`Int32` 的限定名为 `System.Int32`。这些结构提供了广泛的方法，有助于将值类型完全集成到 C# 的对象层次结构中。作为一个顺带的优点，数值结构体还定义了静态方法，可以将数值字符串转换为其相应的二进制等价物。这些转换方法所示。每个方法返回一个与字符串对应的二进制值。\n\
  \n| 结构体 | 转换方法 |\n| :--- | :--- |\n| Decimal | `static decimal Parse(string str)`\
  \ |\n| Double | `static double Parse(string str)` |\n| Single | `static float Parse(string\
  \ str)` |\n| Int64 | `static long Parse(string str)` |\n| Int32 | `static int Parse(string\
  \ str)` |\n| Int16 | `static short Parse(string str)` |\n| UInt64 | `static ulong\
  \ Parse(string str)` |\n| UInt32 | `static uint Parse(string str)` |\n| UInt16 |\
  \ `static ushort Parse(string str)` |\n| Byte | `static byte Parse(string str)`\
  \ |\n| SByte | `static sbyte Parse(string str)` |\n\n如果 `str` 不包含有效的数值，`Parse()`\
  \ 方法将抛出 `FormatException`；如果 `str` 为空，将抛出 `ArgumentNullException`；如果 `str` 超过了调用类型的边界，将抛出\
  \ `OverflowException`。\n\n解析方法提供了一种从控制台或文件读取数值并将其转换为内部格式的方便方法。例如，程序首先向用户请求这些数值。使用\
  \ `ReadLine()` 将数值输入到其二进制格式。接下来，该程序会每隔一个值：\n\n```cs\n// 读取每隔一个值。\nusing System;\n\
  using System.IO;\n\nclass AvgNums {\n    static void Main() {\n        string str;\n\
  \        int n;\n        double sum = 0.0;\n        double t;\n        Console.Write(\"\
  How many numbers will you enter \");\n        str = Console.ReadLine();\n      \
  \  try {\n            n = Int32.Parse(str);\n        } catch(FormatException exc)\
  \ {\n            Console.WriteLine(exc.Message);\n            return;\n        }\
  \ catch(OverflowException exc) {\n            Console.WriteLine(exc.Message);\n\
  \            return;\n        }\n        Console.WriteLine(\"Enter \" + n + \" values.\"\
  );\n        for(int i=0; i < n; i++) {\n            Console.Write \");\n       \
  \     str = Console.ReadLine();\n            try {\n                t = Double.Parse(str);\n\
  \            } catch(FormatException exc) {\n                Console.WriteLine(exc.Message);\n\
  \                return;\n            } catch(OverflowException exc) {\n       \
  \         Console.WriteLine(exc.Message);\n                return;\n           \
  \ }\n            sum += t;\n        }\n        double avg = sum / n;\n        Console.WriteLine(\"\
  Average is \" + avg);\n    }\n}\n```\n\n这是一个示例运行：\n```\nHow many numbers will you\
  \ enter: 5\nEnter 5 values.\nAverage is 3.3\n```\n\n通过改进第 2 章开发的贷款计算器可以充分利用 `Parse()`\
  \ 方法：\n\n```cs\n// 计算贷款的定期还款额。\nusing System;\n\nclass RegPay {\n    static void\
  \ Main() {\n        decimal Principal; // 原金\n        decimal IntRate; // 利率，例如\
  \ 0.075\n        decimal PayPerYear; // 还款次数\n        decimal NumYears; // 年限\n\
  \        decimal Payment; // 还款额\n        decimal numer, denom; // 临时工作变量\n    \
  \    double b, e; // 调用 Pow() 的基数指数\n        string str;\n        try {\n      \
  \      Console.Write(\"Enter principal: \");\n            str = Console.ReadLine();\n\
  \            Principal = Decimal.Parse(str);\n            Console.Write(\"Enter\
  \ interest rate (such as 0.085): \");\n            str = Console.ReadLine();\n \
  \           IntRate = Decimal.Parse(str);\n            Console.Write(\"Enter number\
  \ of years: \");\n            str = Console.ReadLine();\n            NumYears =\
  \ Decimal.Parse(str);\n            Console.Write(\"Enter number of payments per\
  \ year: \");\n            str = Console.ReadLine();\n            PayPerYear = Decimal.Parse(str);\n\
  \        } catch(FormatException exc) {\n            Console.WriteLine(exc.Message);\n\
  \            return;\n        } catch(OverflowException exc) {\n            Console.WriteLine(exc.Message);\n\
  \            return;\n        }\n        numer = IntRate * Principal / PayPerYear;\n\
  \        e = (double) -(PayPerYear * NumYears);\n        b = (double) (IntRate /\
  \ PayPerYear) + 1;\n        denom = 1 - (decimal) Math.Pow(b, e);\n        Payment\
  \ = numer / denom;\n        Console.WriteLine(\"Payment is {0:C}\", Payment);\n\
  \    }\n}\n```\n\n示例运行显示在此：\n```\nEnter principal: 10000\nEnter interest rate (such\
  \ as 0.085): 0.075\nEnter number of years: 5\nEnter number of payments per year:\
  \ 12\nPayment is $200.38\n```\n\n# 专家问\n\n**Q: 数值值类型结构体（如 Int32 或 Double）外还能做什么？**\n\
  \n**A:** 数值值类型结构体提供了许多方法，有助于将 C#\n\n\n\n将内置类型集成到对象层次结构中。例如，所有的结构体都有名为 `CompareTo(\
  \ )` 的方法，该方法比较包装器中包含的值；`Equals( )` 方法测试两个值是否相等；以及以各种形式返回对象值的方法。数值结构体还包括 `MinValue`\
  \ 和 `MaxValue` 字段，它们包含了该类型对象可以存储的最小值和最大值。\n\n# 第 11 章：使用 I/O\n\n425\n\n## 尝试一下：创建一个基于磁盘的帮助系统\n\
  \n在第 4 章的“尝试一下”部分中，你创建了一个 `Help` 类，用于显示有关 C# 控制语句的帮助。在那个实现中，帮助信息存储在类本身内部，用户从编号选项的菜单中选择帮助。虽然这种方法功能上是完备的，但显然不是创建帮助系统的理想方式。例如，要添加或更改帮助信息，必须修改程序的源代码。此外，通过编号而不是名称来选择主题是繁琐的，且不适用于长主题列表。在这里，我们将通过创建一个基于磁盘的帮助系统来弥补这些缺点。\n\
  \n基于磁盘的帮助系统将帮助信息存储在帮助文件中。帮助文件是一个标准文本文件，可以随意更改或扩展，而无需更改帮助程序。用户通过输入主题名称来获取该主题的帮助。帮助系统会在帮助文件中搜索该主题。如果找到，将显示关于该主题的信息。\n\
  \n### 逐步步骤\n\n1. 你必须创建一个供帮助系统使用的帮助文件。帮助文件是一个标准文本文件，其组织如下：\n\n```\n#topic-name1\n\
  topic info\n\n#topic-name2\n\ntopic info\n\n.\n\n.\n\n.\n\n#topic-nameN\n\ntopic\
  \ info\n```\n\n每个主题的名称之前必须以 `#` 开头，且主题名称必须单独成行。通过在每个主题名称前加上 `#`，程序可以快速找到每个主题的开始。主题名称之后是任意数量的关于该主题的信息行。\n\
  \n然而，在一个主题信息的结束处和下一个主题的开始处必须有一个空行。此外，任何行的末尾都不能有尾随空格。\n\n这是一个你可以使用的简单帮助文件，用来尝试基于磁盘的帮助系统。它存储了关于\
  \ C# 控制语句的信息。\n\n```\n#if\nif(condition) statement;\n\nelse statement;\n\n*(续)*\n\
  \n426\n\n#switch\nswitch(expression) {\ncase constant:\nstatement sequence\nbreak;\n\
  // ...\n}\n\n#for\nfor(init; condition; iteration) statement;\n\n#while\nwhile(condition)\
  \ statement;\n\n#do\ndo {\nstatement;\n} while (condition);\n\n#break\nbreak; or\
  \ break label;\n\n#continue\ncontinue; or continue label;\n\n#goto\ngoto label;\n\
  ```\n\n将此文件命名为 `helpfile.txt`。\n\n2. 创建名为 `FileHelp.cs` 的文件。\n\n3. 使用以下代码开始创建新的\
  \ `Help` 类：\n\n```csharp\nclass Help {\n  string helpfile; // 帮助文件的名称\n  public\
  \ Help(string fname) {\n    helpfile = fname;\n  }\n}\n```\n\n帮助文件的名称传递给 `Help`\
  \ 构造函数并存储在实例变量 `helpfile` 中。由于每个 `Help` 实例都拥有自己的 `helpfile` 副本，因此每个实例可以使用不同的文件。因此，你可以为不同的主题集创建不同的帮助文件集。\n\
  \n4. 在 `Help` 类中添加此处所示的 `HelpOn( )` 方法。该方法检索指定主题的帮助。\n\n第 11 章：使用 I/O\n\n427\n\n\
  ```csharp\n// 显示某个主题的帮助。\npublic bool HelpOn(string what) {\n  StreamReader helpRdr;\n\
  \  int ch;\n  string topic, info;\n  try {\n    helpRdr = new StreamReader(helpfile);\n\
  \  }\n  catch(IOException exc) {\n    Console.WriteLine(exc.Message);\n    return\
  \ false;\n  }\n  try {\n    do {\n      // 读取字符直到找到一个 #。\n      ch = helpRdr.Read();\n\
  \      // 现在，检查主题是否匹配。\n      if(ch == '#') {\n        topic = helpRdr.ReadLine();\n\
  \        if(what == topic) { // 找到了主题\n          do {\n          info = helpRdr.ReadLine();\n\
  \          if(info != null) Console.WriteLine(info);\n          } while((info !=\
  \ null) && (info != \"\"));\n          helpRdr.Close();\n          return true;\n\
  \        }\n      }\n    } while(ch != -1);\n  }\n  catch(IOException exc) {\n \
  \   Console.WriteLine(exc.Message);\n  }\n  helpRdr.Close();\n  return false; //\
  \ 未找到主题\n}\n```\n\n使用 `StreamReader` 打开帮助文件。由于帮助文件包含文本，使用字符流允许帮助系统更高效地进行国际化。\n\n\
  `HelpOn( )` 方法的工作原理如下：将一个包含主题名称的字符串传递给 `what` 参数。然后打开帮助文件。接着搜索文件，寻找 `what` 与文件中主题之间的匹配项。请记住，在文件中，每个主题前面都有一个\
  \ `#`，因此搜索循环扫描文件以寻找 `#`。当找到一个 `#` 时，它会检查 `#` 之后的主题是否与传递给 `what` 的匹配。如果匹配，则显示该主题的信息。如果找到，`HelpOn(\
  \ )` 返回 `true`。否则，返回 `false`。\n\n*(续)*\n\n428\n\nC# 3.0: 初学者指南\n\n5. `Help` 类提供了此处所示的\
  \ `GetSelection` 方法。它提示用户输入并返回用户输入。\n\n```csharp\n// 获取主题。\npublic string GetSelection()\
  \ {\n  string topic = \"\";\n  Console.Write(\"Enter topic: \");\n  topic = Console.ReadLine();\n\
  \  return topic;\n}\n```\n\n6. 完整的基于磁盘的帮助系统所示：\n\n```csharp\nusing System;\nusing\
  \ System.IO;\n\n 一个使用文件存储信息、搜索主题并显示与该主题相关的帮助程序。 */\nclass Help {\n  string helpfile;\
  \ // 帮助文件的名称\n  public Help(string fname) {\n    helpfile = fname;\n  }\n\n  //\
  \ 显示某个主题的帮助。\n  public bool HelpOn(string what) {\n    StreamReader helpRdr;\n \
  \   int ch;\n    string topic, info;\n    try {\n      helpRdr = new StreamReader(helpfile);\n\
  \    }\n    catch(IOException exc) {\n      Console.WriteLine(exc.Message);\n  \
  \    return false;\n    }\n    try {\n      do {\n        // 读取字符直到找到一个 #。\n   \
  \     ch = helpRdr.Read();\n        // 现在，检查主题是否匹配。\n        if(ch == '#') {\n \
  \         topic = helpRdr.ReadLine();\n          if(what == topic) { // 找到了主题\n\
  \            do {\n            info = helpRdr.ReadLine();\n            if(info !=\
  \ null) Console.WriteLine(info);\n            } while((info != null) && (info !=\
  \ \"\"));\n            helpRdr.Close();\n            return true;\n          }\n\
  \        }\n      } while(ch != -1);\n    }\n    catch(IOException exc) {\n    \
  \  Console.WriteLine(exc.Message);\n    }\n    helpRdr.Close();\n    return false;\
  \ // 未找到主题\n  }\n\n  // 获取主题。\n  public string GetSelection() {\n    string topic\
  \ = \"\";\n    Console.Write(\"Enter topic: \");\n    topic = Console.ReadLine();\n\
  \    return topic;\n  }\n}\n\n// 演示文件的帮助系统。\nclass FileHelp {\n  static void Main()\
  \ {\n    Help hlpobj = new Help(\"helpfile.txt\");\n    string topic;\n    Console.WriteLine(\"\
  Try the help system. \" +\n    \"Enter 'stop' to end.\");\n    for(;;) {\n     \
  \ topic = hlpobj.GetSelection();\n      if(topic == \"stop\") break;\n      if(!hlpobj.HelpOn(topic))\n\
  \        Console.WriteLine(\"Topic not found.\\n\");\n    }\n  }\n}\n```\n\n430\n\
  \nC# 3.0: 初学者指南\n\n### 专家问答\n\n**问：在本章早期，你提到了流的类 MemoryStream，它使用内存进行存储。这个流如何使用？**\n\
  \n**答：MemoryStream 是 Stream 类的一个实现，它使用字节数组作为输入或输出。这里是它定义的构造函数之一：**\n\n```csharp\n\
  MemoryStream(byte[ ] buf )\n```\n\n**在这里，buf 是将用作 I/O 请求源或目标的字节数组。它必须足够大，以容纳你重定向它的任何输出。通过此构造函数创建的流可以读写，并支持\
  \ Seek( )。**\n\n**基于内存的流在编程中非常有用。例如，你可以**\n\n\n\n\n提前构造复杂的输出并将其存储在数组中直到需要为止。这种技术在为\
  \ GUI 环境（如 Windows）编写程序时特别有用。你还可以重定向标准流以从数组读取。这对于向程序提供测试信息可能非常有用。\n\n最后一点：要创建一个基于内存的字符流，请使用\
