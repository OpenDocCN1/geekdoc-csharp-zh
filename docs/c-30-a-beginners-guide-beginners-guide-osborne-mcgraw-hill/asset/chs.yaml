  \ : \" + (char)('A' + i));\n                q.Put((char)('A' + i));\n          \
  \      Console.WriteLine(\" -- OK\");\n            }\n        }\n        catch (QueueFullException\
  \ exc) {\n            Console.WriteLine(exc);\n        }\n        Console.WriteLine();\n\
  \n// 第 10 章：异常处理\n        try {\n            // 排空队列。\n            for(i=0; i <\
  \ 11; i++) {\n                Console.Write(\"Getting next char: \");\n        \
  \        ch = q.Get();\n                Console.WriteLine(ch);\n            }\n\
  \        }\n        catch (QueueEmptyException exc) {\n            Console.WriteLine(exc);\n\
  \        }\n    }\n\n5. 为了创建程序，你必须结合 `IQChar.cs` 文件编译 `QExcDemo.cs`。记得 `IQChar.cs`\
  \ 包含队列接口。当你运行 `QExcDemo` 时，将看到以下输出：\n\n```\nAttempting to store : A -- OK\nAttempting\
  \ to store : B -- OK\nAttempting to store : C -- OK\nAttempting to store : D --\
  \ OK\nAttempting to store : E -- OK\nAttempting to store : F -- OK\nAttempting to\
  \ store : G -- OK\nAttempting to store : H -- OK\nAttempting to store : I -- OK\n\
  Attempting to store : J -- OK\nAttempting to store : K\nQueue Full! Max length is\
  \ 10.\nGetting next char: A\nGetting next char: B\nGetting next char: C\nGetting\
  \ next char: D\nGetting next char: E\nGetting next char: F\nGetting next char: G\n\
  Getting next char: H\nGetting next char: I\nGetting next char: J\nGetting next char:\n\
  Queue is empty.\n```\n\n386 | C# 3.0: 初学者指南\n\n### 使用 checked 和 unchecked\n\n算术计算可能会导致溢出。例如，考虑以下序列：\n\
  \n```csharp\nbyte a, b, result;\na = 127;\nb = 127;\nresult = (byte)(a * b);\n```\n\
  \n在这里，**a** 和 **b** 的积超过了 **byte** 值的范围。因此，结果溢出了结果的范围。\n\nC# 允许你使用 `checked` 和 `unchecked`\
  \ 关键字来指定在发生溢出时代码是否会抛出异常。使用 `checked` 指定对表达式进行溢出检查。使用 `unchecked` 指定忽略溢出。在这种情况下，结果将被截断以适应表达式的目标类型。\n\
  \n\n\n\n\n`checked` 关键字有两种通用形式。其中一种是检查一个特定的表达式，被称为 `checked` 的*运算符形式*（operator form）。另一种是检查一个语句块，被称为*语句形式*（statement\
  \ form）。\n\n```csharp\nchecked (expr)\nchecked {\n    // statements to be checked\n\
  }\n```\n\n在这里，`expr` 是被检查的表达式。如果 `checked` 表达式发生溢出，则会抛出一个 `OverflowException`。\n\
  \n`unchecked` 关键字也有两种通用形式。第一是运算符形式，它忽略特定表达式的溢出。另一种是忽略整个语句块的溢出。它们显示如下：\n\n```csharp\n\
  unchecked (expr)\nunchecked {\n    // statements for which overflow is ignored\n\
  }\n```\n\n在这里，`expr` 是不检查溢出的表达式。如果 `unchecked` 表达式发生溢出，则会发生截断。\n\n下面是一个演示了 `checked`\
  \ 和 `unchecked` 的程序。\n\n```csharp\n// Using checked and unchecked.\nusing System;\n\
  \nclass CheckedDemo {\n    static void Main() {\n        byte a, b;\n        byte\
  \ result;\n        a = 127;\n        b = 127;\n        // The overflow in this expression\
  \ is truncated.\n        // The overflow here causes an exception.\n        try\
  \ {\n            result = unchecked((byte)(a * b));\n            Console.WriteLine(\"\
  Unchecked result: \" + result);\n            result = checked((byte)(a * b)); //\
  \ this causes exception\n            Console.WriteLine(\"Checked result: \" + result);\
  \ // won't execute\n        }\n        catch (OverflowException exc) {\n       \
  \     Console.WriteLine(exc);\n        }\n    }\n}\n```\n\n该程序的输出所示：\n```\nUnchecked\
  \ result: 1\nSystem.OverflowException: Arithmetic operation resulted in an overflow.\n\
  at CheckedDemo.Main()\n```\n\n显而易见，`unchecked` 表达式导致了截断。`checked` 表达式则导致了异常。\n\n\
  前面的程序演示了对单个表达式使用 `checked` 和 `unchecked`。下面的程序展示了如何检查和取消检查一个语句块：\n\n```csharp\n\
  // Using checked and unchecked with statement blocks.\nusing System;\n\nclass CheckedBlocks\
  \ {\n    static void Main() {\n        byte a, b;\n        byte result;\n      \
  \  a = 127;\n        b = 127;\n        try {\n            unchecked {\n        \
  \        // An unchecked block.\n                a = 127;\n                b = 127;\n\
  \                result = (byte)(a * b);\n                Console.WriteLine(\"Unchecked\
  \ result: \" + result);\n                a = 125;\n                b = 5;\n    \
  \            result = (byte)(a * b);\n                Console.WriteLine(\"Unchecked\
  \ result: \" + result);\n            }\n            checked {\n                //\
  \ A checked block.\n                a = 2;\n                b = 7;\n           \
  \     result = (byte)(a * b); // this is OK\n                Console.WriteLine(\"\
  Checked result: \" + result);\n                a = 127;\n                b = 127;\n\
  \                result = (byte)(a * b); // this causes exception\n            \
  \    Console.WriteLine(\"Checked result: \" + result); // won't execute\n      \
  \      }\n        }\n        catch (OverflowException exc) {\n            Console.WriteLine(exc);\n\
  \        }\n    }\n}\n```\n\n该程序的输出所示：\n```\nUnchecked result: 1\nUnchecked result:\
  \ 13\nChecked result: 14\nSystem.OverflowException: Arithmetic operation resulted\
  \ in an overflow.\nat CheckedBlocks.Main()\n```\n\n如你所见，`unchecked` 块导致溢出被截断。当 `checked`\
  \ 块发生溢出时，会引发异常。你可能需要使用 `checked` 或 `unchecked` 的原因之一是溢出的检查/取消状态是由编译器选项设置和执行环境决定的。因此，对于某些类型的程序，最好显式指定溢出状态。\n\
  \n# 第 10 章：异常处理\n\n### 专家问答\n问：在程序的什么时候应该异常处理？什么时候创建自己的异常类？\n\n答：由于 C# 广泛使用异常来报告错误，几乎所有真实世界的程序都会使用异常处理。这是处理过程中大多数初学者认为最容易的部分。要决定何时以及如何使用自定义的异常则要困难得多。通常，报告错误有两种方式：返回值和异常。哪种方法比另一种更好呢？简单来说，在\
  \ C# 中，异常处理应该是常态。当然，在某些情况下，返回错误代码是一种有效的替代方案，但异常提供了一种更强大、结构化的错误处理方式。这是专业 C# 程序员在代码中处理错误的方法。\n\
  \n第 10 章自测\n1. 异常层次结构的顶端类是什么？\n2. 简要解释如何使用 `try` 和 `catch`。\n3. 这段代码哪里有问题？\n```csharp\n\
  vals[-1] = 10;\ncatch (IndexOutOfRangeException exc) {\n// handle error\n}\n```\n\
  4. 如果异常没有被捕获会发生什么？\n5. 这段代码哪里有问题？\n```csharp\nclass A : Exception { ... }\nclass\
  \ B : A { ... }\ntry {\n    // ...\n}\ncatch (A exc) { ... }\ncatch (B exc) { ...\
  \ }\n```\n6. 被内部 `catch` 捕获的异常可以重新抛给外部 `catch` 吗？\n7. `finally` 块是程序结束前执行的最后代码。对还是错？解释你的答案。\n\
  8. 在第 6 章自测的练习 3 中，你创建了一个 `Stack` 类。为你的类添加自定义异常，以报告栈满和栈空状态。包含所有标准的异常构造函数。\n9. 解释\
  \ `checked` 和 `unchecked` 的用途。\n10. 如何捕获所有异常？\n\n## 第 11 章：使用 I/O\n\n关键技能与概念\n-\
  \ 流（Stream）\n- 流类\n- 控制台 I/O\n- 文件 I/O\n- 读取和写入二进制数据\n- 随机访问文件\n- 转换数值字符串\n\n从本书开始开始，你一直在使用\
  \ C# I/O 系统的部分内容，例如 `Console.WriteLine()`，但你是在没有太多正式解释的情况下使用的。由于 C# 的 I/O 系统是构建在类层次结构之上的，在没有讨论类、继承和异常之前，无法介绍它的理论和细节。现在是详细检查\
  \ C# 的 I/O 方法的时候了。正如第 1 章所示，C# 使用由 .NET 定义的 I/O 系统和类。因此，对 C# I/O 的讨论也是对 .NET I/O\
  \ 系统的讨论。本章探讨了 C# 处理 I/O 的方法。请注意，I/O 系统非常庞大。本章介绍了最重要和常用的功能，但某些 I/O 方面你可能需要自行学习。坦率地说，C#\
  \ I/O 系统是统一且一致的；一旦你理解了它的基础，剩下的 I/O 系统很容易掌握。\n\n### C# 的 I/O 构建在流之上\nC# 程序通过流执行 I/O。流（*stream*）是产生或信息的抽象。流由\
  \ I/O 系统链接到物理设备。所有流的行为都是相同的，即使它们链接的物理设备不同。因此，I/O 类和方法可以适用于许多类型的设备。例如，用于写入控制台的相同方法也可以写入磁盘文件。\n\
  \n### 字节流与字符流\n在最底层，所有的 C# I/O 都按字节操作。这是合理的，因为许多设备在进行 I/O 操作时是面向字节的。然而，我们人类通常倾向于使用字符进行通信。记得在\
  \ C# 中，`char` 是 16 位类型，而 `byte` 是 8 位类型。如果你使用的是 ASCII 字符集，那么在 `char` 和 `byte` 之间进行转换很容易；只需忽略\
  \ `char` 值的高位字节即可。但对于其余 Unicode 字符这并不可行，因为它们需要多个字节。因此，字节流并不完美适合处理字符的 I/O。为了解决这个问题，C#\
  \ 定义了几个类，可以将字节流转换为字符流，并自动为你处理 `byte`-to-`char` 和 `char`-to-`byte` 的转换。\n\n\n\n\n\
  \n三个预定义的流通过属性 `Console.In`、`Console.Out` 和 `Console.Error` 暴露给所有使用 `System` 命名空间的程序。`Console.Out`\
  \ 指向标准输出流。默认情况下，这是控制台。例如，当你调用 `Console.WriteLine()` 时，会自动将信息发送到 `Console.Out`。\n\
  \n`Console.In` 指向标准输入，默认情况下是键盘。`Console.Error` 指向标准错误流，默认也是控制台。然而，这些流可以重定向到任何兼容的\
  \ I/O 设备。标准流是字符流。因此，这些流用于读取和写入字符。\n\n# 流类\n\nI/O 系统同时定义了字节流类和字符流类。然而，字符流类实际上只是包装器，将底层的字节流转换为字符流，并自动处理任何转换。因此，字符流在逻辑上是分离的，但它们构建在字节流之之上。\n\
  \n所有流类都定义在 `System.IO` 命名空间中。要使用这些类，你通常会在程序的顶部包含以下语句：\n\n```\nusing System.IO;\n\
  ```\n\n之所以在控制台输入和输出时不需要指定 `System.IO`，是因为 `Console` 类定义在 `System` 命名空间中。\n\n## Stream\
  \ 类\n\n核心流类是 `System.IO.Stream`。`Stream` 表示字节流，是所有其他流类的基类。它还是一个抽象类，这意味着你不能直接实例化\
  \ `Stream` 对象。`Stream` 定义了一组标准的流操作。表 11-1 显示了由 `Stream` 定义的几个常用方法。\n\n表 11-1 所示的若干方法在发生\
  \ I/O 错误时将抛出 `IOException`。如果尝试进行无效操作（例如，尝试向只读的流写入内容），则会抛出 `NotSupportedException`。取决于具体的方法，还可能抛出其他异常。\n\
  \n请注意，`Stream` 定义了读取和写入数据的方法。然而，并不是所有流都支持这两种两种操作，因为可以打开只读或只写入的流。\n\n此外，并不是所有流都支持通过\
  \ `Seek()` 位置请求。要确定流的能力，你将使用 `Stream` 的一个或多个属性。它们在表 11-2 中所示。表中还显示了 `Length` 和 `Position`\
  \ 属性，它们包含流的长度及其当前位置。\n\n### 表 11-1 Stream 定义的方法示例\n\n| 方法 | 描述 |\n| :--- | :---\
  \ |\n| `void Close()` | 关闭流。 |\n| `void Flush()` | 将流的内容写入物理设备。 |\n| `int ReadByte()`\
  \ | 返回下一个可用输入字节的整数表示。当遇到文件末尾时返回 –1。 |\n| `int Read(byte[] buf, int offset, int numBytes)`\
  \ | 尝试从 `buf[offset]` 开始向 `buf` 读取多达 `numBytes` 个字节，返回成功读取的字节数。 |\n| `long Seek(long\
  \ offset, SeekOrigin origin)` | 将流中的当前位置设置为相对于指定 `origin` 的指定 `offset`。 |\n| `void\
  \ WriteByte(byte b)` | 向输出流写入单个字节。 |\n| `int Write(byte[] buf, int offset, int numBytes)`\
  \ | 从数组 `buf` 中从 `buf[offset]` 开始写入长度为 `numBytes` 的子范围的字节。返回已写入的字节数。 |\n\n## 字节流类\n\
  \n若干具体的字节流派生自 `Stream`。这里显示了定义在 `System.IO` 命名空间中的类。\n\n| 流类 | 描述 |\n| :--- | :---\
  \ |\n| `BufferedStream` | 包装字节流并添加缓冲。在许多情况下，缓冲可以增强性能。 |\n| `FileStream` | 为文件 I/O\
  \ 设计的字节流。 |\n| `MemoryStream` | 使用内存存储的字节流。 |\n| `UnmanagedMemoryStream` | 使用内存存储的字节流，但不适用于混合语言编程。\
  \ |\n\n.NET Framework 还支持为压缩文件、套接字（sockets）和管道等提供支持的其他具体流类。你也可以派生自己的流类。然而，对于大多数应用程序，内置流已经足够了。\n\
  \n## 字符流包装器类\n\n要创建字符流，你把一个字节流封装在一个字符流包装器之一内部。在字符流层次结构的顶部是抽象类 `TextReader` 和 `TextWriter`。这两个抽象类定义的方法对它们的所有子类都可用。因此，它们构成了所有字符流都将具备的最小\
  \ I/O 函数集。\n\n### 表 11-2 Stream 定义的属性\n\n| 属性 | 描述 |\n| :--- | :--- |\n| `bool CanRead`\
  \ | 如果流可读，此属性为真。该属性是只读的。 |\n| `bool CanSeek` | 如果流支持位置请求，此属性为真。该属性是只读的。 |\n| `bool\
  \ CanTimeout` | 如果流可以超时，此属性为真。该属性是只读的。 |\n| `bool CanWrite` | 如果流可写，此属性为真。该属性是只读的。\
  \ |\n| `long Length` | 此属性包含流的长度。该属性是只读的。 |\n| `long Position` | 此属性表示流的当前位置。 |\n\
  | `int ReadTimeout` | 表示读取操作发生超时之前的时间。可读写。 |\n| `int WriteTimeout` | 表示写入操作发生超时之前的时间。可读写。\
  \ |\n\n表 11-3 TextReader 定义的方法\n\n表 11-3 显示了 `TextReader` 中的输入方法。通常情况下，这些方法在出错时会抛出\
  \ `IOException`。（某些会抛出其他类型的异常。）特别感兴趣的是 `ReadLine()` 方法，它读取一行文本并返回 `string`。该方法对于读取包含空格的输入很有用。\n\
  \n| 方法 | 描述 |\n| :--- | :--- |\n| `int Peek()` | 获取下一个字符但不移除。如果没有可用字符则返回 -1。 |\n\
  | `int Read()` | 返回下一个可用字符的整数表示。遇到文件末尾时返回 -1。 |\n| `int Read(char[] buf, int offset,\
  \ int numChars)` | 尝试从 `buf[offset]` 开始向 `buf` 读取多达 `numChars` 个字符，返回成功读取的字符数。 |\n\
  | `int ReadBlock(char[] buf, int offset, int numChars)` | 尝试从 `buf[offset]` 开始向\
  \ `buf` 读取多达 `numChars` 个字符，返回成功读取的字符数。 |\n| `string ReadLine()` | 读取下一行文本并作为 `string`\
  \ 返回。如果在文件末尾尝试读取，则返回 null。 |\n| `string ReadToEnd()` | 返回流中的所有剩余字符并将其作为 `string`\
  \ 返回。 |\n\n`TextWriter` 定义了输出所有内置类型的 `Write()` 和 `WriteLine()` 版本。例如，这里只是它们的几个重载版本：\n\
  \n| 方法 | 描述 |\n| :--- | :--- |\n| `void Write(int val)` | 写入一个 int。 |\n| `void Write(double\
  \ val)` | 写入一个 double。 |\n| `void Write(bool val)` | 写入一个 bool。 |\n| `void WriteLine(string\
  \ val)` | 写入字符串并换行。 |\n| `void WriteLine(uint val)` | 写入一个 uint 并换行。 |\n| `void\
  \ WriteLine(char val)` | 写入一个字符并换行。 |\n\n写入抛出 `IOException`。\n\n除了 `Write()` 和 `WriteLine()`，`TextWriter`\
  \ 还定义了所示的 `Close()` 和 `Flush()` 方法：\n\n```\nvirtual void Close()\nvirtual void Flush()\n\
  ```\n\n\n\n\n`Flush()` 会导致输出缓冲区中的任何剩余数据被写入物理介质。\n\n`Close()` 关闭流。\n\n`TextReader`\
  \ 和 `TextWriter` 类由几个基于字符的流类实现，包括此处显示的类。因此，这些流提供了 `TextReader` 和 `TextWriter` 所在的方法和属性。\n\
  \n### 流类\n\n| 流类 | 描述 |\n| :--- | :--- |\n| `StreamReader` | 从字节流中读取字符。该类封装了一个字节输入流。\
  \ |\n| `StreamWriter` | 向字节流写入字符。该类封装了一个字节输出流。 |\n| `StringReader` | 从字符串中读取字符。\
  \ |\n| `StringWriter` | 将字符写入字符串中。 |\n\n### 二进制流\n\n除了字节流和字符流外，还有两个二进制流类，可用于直接读取和写入二进制数据。这些流被称为\
  \ `BinaryReader` 和 `BinaryWriter`。我们将在本章后面讨论二进制文件 I/O 时详细查看这些内容。\n\n现在你已经了解了 I/O\
  \ 系统的总体布局，本章的其余部分将详细检查它的各个部分，从控制台 I/O 开始。\n\n# 第 11 章：使用 I/O\n\n## 控制台 I/O\n\n控制台\
  \ I/O 通过标准流 `Console.In`、`Console.Out` 和 `Console.Error` 实现。你从第一章开始就在使用控制台 I/O，所以你已经对它熟悉了。正如你将看到的，它具有一些额外的功能。\n\
  \n然而，在我们开始，强调书中之前的这一点很重要：C# 的大多数实际应用程序不是基于文本的控制台程序。相反，它们将是面向图形的程序或依赖窗口界面与用户交互的组件，或者是服务器端应用程序。因此，I/O\
  \ 系统与控制台输入输出相关的部分并不广泛使用。虽然基于文本的程序作为教学示例和短实用程序非常出色，但它们并不适用于大多数现实世界的应用。\n\n### 读取控制台输入\n\
  \n`Console.In` 是 `TextReader` 的实例，你可以使用 `TextReader` 定义的方法和属性来访问它。但是，你通常会使用 `Console`\
  \ 提供的方法，这些方法会自动从 `Console.In` 读取。`Console` 定义了两个输入方法：`Read()` 和 `ReadLine()`。\n\n\
  要读取单个字符，请使用 `Read()` 方法。此处所示：\n```cs\nstatic int Read()\n```\n\n该方法在第 3 章中引入。它返回从控制台读取的下一个字符。\n\
  \n字符以 `int` 形式返回，必须转换为 `char`。错误时返回 -1。此方法在失败时将抛出 `IOException`。请记住 `Read()` 是行缓冲的，因此在你输入的任何字符发送到你的程序之前，你必须按下\
  \ ENTER 键。\n\n要读取字符字符串，请使用 `ReadLine()` 方法。此处所示：\n```cs\nstatic string ReadLine()\n\
  ```\n\n`ReadLine()` 读取字符直到你按下 ENTER 键，并以 `string` 对象的形式返回它们。此方法在失败时也会抛出 `IOException`。\n\
  \n这里有一个演示从 `Console.In` 读取一行字符的程序：\n\n```csharp\n// 使用 ReadLine() 从控制台读取输入。\nusing\
  \ System;\nclass ReadChars {\n    static void Main() {\n        string str;\n  \
  \      Console.WriteLine(\"Enter some characters.\");\n        str = Console.ReadLine();\n\
  \        // 从键盘读取字符串。\n        Console.WriteLine(\"You entered: \" + str);\n   \
  \ }\n}\n```\n\n这里是示例运行：\n```\nEnter some characters.\nThis is a test.\nYou entered:\
  \ This is a test.\n```\n\n虽然 `Console` 方法是从控制台读取内容最简单的方法，但你可以调用底层 `TextReader` 的方法，它可以通过\
  \ `Console.In` 获取。例如，这里是使用 `TextReader` 定义的方法重写的之前的程序：\n\n```csharp\n/* 直接使用 Console.In\
  \ 从键盘读取字节数组。 */\nimportusing System;\nclass ReadChars2 {\n    static void Main()\
  \ {\n        string str;\n        Console.WriteLine(\"Enter some characters.\");\n\
  \        str = Console.In.ReadLine();\n        // 显式地从 Console.In 读取。\n        Console.WriteLine(\"\
  You entered: \" + str);\n    }\n}\n```\n\n注意 `ReadLine()` 现在是如何直接在 `Console.In`\
  \ 上被调用的。这里的关键点是，如果你需要访问 `Console.In` 底层的 `TextReader` 定义的方法，你将像示例所示那样调用这些方法。\n\n\
  ### 写入控制台输出\n\n`Console.Out` 和 `Console.Error` 是 `TextWriter` 类型的对象。控制台输出最容易通过 `Write()`\
  \ 和 `WriteLine()` 完成，你已经对这些方法熟悉了。这些方法存在不同的版本来处理每种内置类型的输出。`Console` 定义了自己的自己的 `Write()`\
  \ 和 `WriteLine()` 版本，以便可以直接在 `Console` 上调用它们，正如你在整本书中所做的那样。但是，如果你选择的话，你可以在 `Console.Out`\
  \ 和 `Console.Error` 底层的 `TextWriter` 上调用这些（以及其他）方法。\n\n这里有一个演示向 `Console.Out` 和\
  \ `Console.Error` 的程序。默认情况下，两者都将输出写入控制台。\n\n```csharp\n// 写入 Console.Out 和 Console.Error。\n\
  using System;\nclass ErrOut {\n    static void Main() {\n        int a=10, b=0;\n\
  \        int result;\n        Console.Out.WriteLine(\"This will generate an exception.\"\
  );\n        try {\n            result = a / b; // 生成异常\n        } catch(DivideByZeroException\
  \ exc) {\n            Console.Error.WriteLine(exc.Message);\n        }\n    }\n\
  }\n```\n\n程序的输出所示：\n```\nThis will generate an exception.\nAttempted to divide by\
  \ zero.\n```\n\n初学者有时会困惑何时使用 `Console.Error`。由于 `Console.Out` 和 `Console.Error`\
  \ 默认都写入控制台，为什么会有两个流？答案在于标准流是可以重定向的。例如，`Console.Error` 可以重定向到磁盘文件而不是屏幕。因此，如果控制台输出被重定向而错误输出没有，那么错误信息将出现在控制台上以便查看。我们将在描述文件\
  \ I/O 之后讨论重定向。\n\n###\n\n**问：正如你刚刚解释的，`Read()` 是行缓冲的。这意味着它缓存按键直到我按下 ENTER。C# 支持按下任何键时立即返回的交互式输入方法吗？**\n\
  \n**答：是的！从 2.0 版本开始，.NET Framework 在 `Console` 中包含了一个方法，允许你以非行缓冲的方式直接从键盘读取按键。该方法被称为\
  \ `ReadKey()`。当它被调用时，它会等待按下键。**\n\n当按下键时，`ReadKey()` 立即返回按键。你不需要按下 ENTER。因此，`ReadKey()`\
  \ 允许实时读取和处理按键。\n\n`ReadKey()` 有这两种形式：\n\n```cs\nstatic ConsoleKeyInfo ReadKey()\n\
  static ConsoleKeyInfo ReadKey(bool noDisplay)\n```\n\n第一种形式等待按下键。当发生时，它返回键并在屏幕上显示该键。第二种形式也等待并返回按键。但是，如果\
  \ `noDisplay` 为 true，则不显示键。如果 `noDisplay` 为 false，则显示该键。\n\n`ReadKey()` 以 `ConsoleKeyInfo`\
  \ 类型的对象返回按键信息，它是一个结构体。它包含以下只读属性：\n\n- `char KeyChar`\n- `ConsoleKey Key`\n- `ConsoleModifiers\
  \ Modifiers`\n\n\n\n\n\n`KeyChar` 包含所按字符的 `char` 等效值。`Key` 包含来自 `ConsoleKey` 枚举的值，它是键盘上所有键的枚举。`Modifiers`\
  \ 描述了生成按键时是否按了键盘修饰键 ALT、`CTRL` 或 `SHIFT`。这些修饰键由 `ConsoleModifiers` 枚举表示，该枚举包含这些值：`Control`、`Shift`\
  \ 和 `Alt`。`Modifiers` 中可能存在多个修饰值。\n\n# FileStream 和面向字节的文件 I/O\n\nI/O 系统提供了允许你读取和写入文件的类。当然，最常见的文件类型是磁盘文件。在操作系统级别，所有文件都是面向字节的。\n\
  \n正如你所预期的，有方法可以从文件中读取字节和写入字节。因此，使用字节流读写文件是非常常见的。你也可以将一个面向字节的文件流封装在一个基于字符的对象中。在存储文本时，这种基于字符的文件操作非常有用。字符流将在本章的稍后部分讨论。这里，描述的是面向字节的\
  \ I/O。\n\n要创建一个连接到文件的面向字节的流，你将使用 `FileStream` 类。`FileStream` 派生自 `Stream` 并包含了 `Stream`\
  \ 的所有功能。\n\n记住，包括 `FileStream` 在内的流类定义在 `System.IO` 中。因此，你通常会在使用这些类的程序顶部包含：\n\n\
  ```cs\nusing System.IO;\n```\n\n## 打开和关闭文件\n\n要创建一个链接到文件的字节流，创建一个 `FileStream` 对象。`FileStream`\
  \ 定义了几个构造函数。可能最常用的一个显示在此处：\n\n```cs\nFileStream(string filename, FileMode mode)\n\
  ```\n\n在这里，`filename` 指定了要打开的文件名，它可以包含完整路径规范。`mode` 参数指定了将如何打开文件。它必须是 `FileMode`\
  \ 枚举中定义的值之一。这些值如表 11-4 所示。通常情况下，此构造函数以读/写访问打开文件。异常情况是使用 `FileMode.Append` 打开文件。在这种情况下，文件是只写模式。\n\
  \n如果在尝试打开文件时发生故障，将抛出异常。如果由于文件不存在而无法打开文件，将抛出 `FileNotFoundException`。如果由于某种类型的 I/O\
  \ 错误而无法打开文件，将抛出 `IOException`。其他可能的异常包括 `ArgumentNullException`（文件名为 null）、`ArgumentException`（文件名无效）、`ArgumentOutOfRangeException`（模式无效）、`SecurityException`（用户没有访问权限）、`PathTooLongException`（文件名/路径过长）、`NotSupportedException`（文件名指定了不支持的设备）以及\
  \ `DirectoryNotFoundException`（指定的目录无效）。\n\n异常 `PathTooLongException`、`DirectoryNotFoundException`\
  \ 和 `FileNotFoundException` 是 `IOException` 的子类。因此，可以通过捕获 `IOException` 来捕获所有三个异常。\n\
  \n### 表 11-4 FileMode 值\n\n| 值 | 描述 |\n| :--- | :--- |\n| `FileMode.Append` | 将输出追加到文件末尾。\
  \ |\n| `FileMode.Create` | 创建一个新的输出文件。任何同名的预存文件将被删除。 |\n| `FileMode.CreateNew` |\
  \ 创建一个新的输出文件。该文件不能已经存在。 |\n| `FileMode.Open` | 打开已存在的文件。 |\n| `FileMode.OpenOrCreate`\
  \ | 如果文件存在则打开它，如果不存在则创建该文件。 |\n| `FileMode.Truncate` | 打开已存在的文件，但将其长度缩减为零。 |\n\n\
  以下显示了打开文件 `test.dat` 进行输入的一种方法：\n\n```cs\nFileStream fin;\ntry {\n    fin = new\
  \ FileStream(\"test\", FileMode.Open);\n}\ncatch(IOException exc) {\n    Console.WriteLine(exc.Message);\n\
  \    // 处理错误。\n}\ncatch(Exception exc) { // 捕获任何其他异常。\n    Console.WriteLine(exc.Message);\n\
  \    // 处理错误。\n}\n```\n\n在这里，第一个 `catch` 子句处理找不到文件、路径过长、目录不存在或发生其他 I/O 错误的情况。第二个\
  \ `catch` 是针对所有其他类型异常的“全捕获”子句，处理其他可能的错误（可能通过重新抛出异常）。你也可以逐个检查每个错误，更具体地报告发生的问题，并针对该错误采取特定的补救措施。为了简单起见，书中的示例将仅捕获\
  \ `IOException`，但根据情况，你的真实世界代码可能需要处理其他可能的异常。\n\n> **注意**：为了保持代码简单，本章的示例仅捕获 `IOException`，但你自己的代码可能需要处理其他可能的异常或单独处理\
  \ I/O 异常。\n\n如所述，除非指定了 `FileMode.Append`，否则上述的 `FileStream` 构造函数以读/写访问打开文件。如果你想限制访问为仅读或仅写，请使用此构造函数：\n\
  \n```cs\nFileStream(string filename, FileMode mode, FileAccess how)\n```\n\n与之前一样，`filename`\
  \ 指定了要打开的文件名，`mode` 指定了如何打开文件。传递给 `how` 的值决定了如何访问文件。它必须是 `FileAccess` 枚举中定义的值之一，如下：\n\
  \n- `FileAccess.Read`\n- `FileAccess.Write`\n- `FileAccess.ReadWrite`\n\n例如，这打开了一个只读文件：\n\
  \n```cs\nFileStream fin = new FileStream(\"test.dat\", FileMode.Open, FileAccess.Read);\n\
  ```\n\n完成文件后，必须通过调用 `Close()` 关闭它。其通用形式如下：\n\n```cs\nvoid Close()\n```\n\n关闭文件将释放分配给文件的资源，供其他部分使用。\n\
  \n> **注意**：第 15 章介绍的 `using` 语句提供了一种在不需要时自动关闭文件的方法，这种方法适用于各种情况。然而，为了清晰说明文件处理的基础，本章在所有情况下都显式调用\
  \ `close()`。\n\n# 从 FileStream 读取字节\n\n`FileStream` 定义了两个从文件中读取字节的方法：`ReadByte()`\
  \ 和 `Read()`。要从文件中读取单个字节，使用 `ReadByte()`，其通用形式如下：\n\n```cs\nint ReadByte()\n```\n\
  \n每次调用它时，它都会从文件中读取单个字节并作为整数值返回。遇到文件末尾时返回 -1。可能的异常包括 `NotSupportedException`（流未为输入打开）和\
  \ `ObjectDisposedException`（流已关闭）。\n\n要读取字节块，使用 `Read()`，其通用形式如下：\n\n```cs\nint\
  \ Read(byte[] buf, int offset, int numBytes)\n```\n\n`Read()` 尝试将最多 `numBytes` 个字节读取到\
  \ `buf` 开始的 [`offset]。它返回成功读取的字节数。如果发生 I/O 错误，将抛出 `IOException`。可能存在其他类型的异常，包括 `NotSupportedException`（如果流不支持读取则抛出）。\n\
  \n以下程序使用 `ReadByte()` 输入并显示文件的内容，其文件名作为命令行参数指定。它将 `ReadByte()` 返回的值转换为 `char`，以便以\
  \ ASCII 字符的形式显示。注意该程序处理了首次执行此程序时可能发生的两种错误：指定的文件未找到或用户忘记包含文件名。\n\n```cs\n/* 显示文件。\n\
  \n要使用此程序，请指定您想要查看的文件名。\n\n例如，要查看名为 TEST.CS 的文件，\n\n使用以下命令行。\n\nShowFile TEST.CS\n\
  */\n```\n\n\n\n\n\n```csharp\nusing System;\nusing System.IO;\n\nclass ShowFile\
  \ {\n    static void Main(string[] args) {\n        int i;\n        FileStream fin;\n\
  \        if(args.Length != 1) {\n            Console.WriteLine(\"Usage: ShowFile\
  \ File\");\n            return;\n        }\n        try {\n            fin = new\
  \ FileStream(args[0], FileMode.Open);\n        } catch(IOException exc) {\n    \
  \        Console.WriteLine(exc.Message);\n            return;\n        }\n\n   \
  \     // Read bytes until EOF is encountered.\n        do {\n            try {\n\
  \                i = fin.ReadByte();\n                // Read from the file.\n \
  \           } catch(IOException exc) {\n                Console.WriteLine(exc.Message);\n\
  \                break;\n            }\n            if(i != -1) Console.Write((char)\
  \ i);\n            // When i equals –1, the end of the file has been reached.\n\
  \        } while(i != -1);\n        fin.Close();\n    }\n}\n```\n\n### 专家问答\n\n\
  **Q：我注意到 `ReadByte()` 在到达文件末尾时返回 -1，但它并没有为文件错误设置特殊的返回值。为什么呢？**\n\n**A：** 在 C# 中，错误是由异常表示的。因此，如果\
  \ `ReadByte()` 或任何其他 I/O 方法没有抛出异常，就意味着它执行时没有错误。这比使用特殊的错误代码来处理 I/O 错误要清晰得多。\n\n###\
  \ 写入文件\n\n要向文件中写入一个字节，请使用 `WriteByte()` 方法。其最简单的形式所示：`void WriteByte(byte *val*)`\n\
  \n该方法将由 `val` 指定的字节写入文件。如果底层流未以输出模式打开，将抛出 `NotSupportedException`。如果流已关闭，则将抛出 `ObjectDisposedException`。\n\
  \n你可以通过调用 `Write()` 向文件写入字节数组。其形式所示：`int Write(byte[ ] *buf*, int *offset*, int\
  \ *numBytes*)`\n\n`Write()` 从数组 `buf` 的 `buf[*offset]` 位置开始向文件写入 `numBytes` 个字节。该方法返回实际写入的字节数。如果在写入过程中发生错误，将抛出\
  \ `IOException`。如果底层流未以输出模式打开，将抛出 `NotSupportedException`。还可能发生其他异常。\n\n如你所知，当执行文件输出时，输出通常不会立即写入实际物理设备。相反，输出会被操作系统缓冲，直到有一块足够大量的数据可以一次性写入为止。这提高了系统效率。\n\
  \n例如，磁盘文件按扇区组织，扇区长度可能从 128 字节不等。输出通常会被缓冲，直到整个扇区可以一次性写入。然而，如果你想强制将数据写入物理设备（无论缓冲区是否已满），可以调用\
  \ `Flush()`，其形式所示：\n\n```csharp\nvoid Flush()\n```\n\n如果失败，将抛出 `IOException`。如果调用时流已关闭，则将抛出\
  \ `ObjectDisposedException`。\n\n一旦你完成对输出文件的操作，必须记住使用 `Close()` 将其关闭。这样做可以确保磁盘缓冲区中的任何剩余输出都会被实际写入磁盘。在关闭文件之前没有调用\
  \ `Flush()`。\n\n以下示例如何复制文件。源文件和目标文件的名称在命令行中指定。\n\n```text\n/*\n复制文件。\n要使用此程序，请指定\n\
  源文件和目标文件的名称。\n例如，要将名为 FIRST.TXT 的文件\n复制到名为 SECOND.TXT 的文件，请使用以下\n命令行。\nCopyFile\
  \ FIRST.TXT SECOND.TXT\n*/\n```\n\n```csharp\nusing System;\nusing System.IO;\n\n\
  class CopyFile {\n    static void Main(string[] args) {\n        int i;\n      \
  \  FileStream fin;\n        FileStream fout;\n        if(args.Length != 2) {\n \
  \           Console.WriteLine(\"Usage: CopyFile From To\");\n            return;\n\
  \        }\n        // Open input file.\n        try {\n            fin = new FileStream(args[0],\
  \ FileMode.Open);\n        } catch(IOException exc) {\n            Console.WriteLine(exc.Message);\n\
  \            return;\n        }\n\n        // Open output file.\n        try {\n\
  \            fout = new FileStream(args[1], FileMode.Create);\n        } catch(IOException\
  \ exc) {\n            Console.WriteLine(exc.Message);\n            fin.Close();\n\
  \            return;\n        }\n        // Copy the file.\n        try {\n    \
  \        do {\n                i = fin.ReadByte();\n                // Read bytes\
  \ from one file\n                 and write them to another.\n                if(i\
  \ != -1) fout.WriteByte((byte)i);\n            } while(i != -1);\n        } catch(IOException\
  \ exc) {\n            Console.WriteLine(exc.Message);\n        }\n        fin.Close();\n\
  \        fout.Close();\n    }\n}\n```\n\n### 基于字符的文件 I/O\n\n虽然面向字节的文件处理非常常见，但也可以使用基于字符的流来实现此目的。字符流的优势在于它们直接在\
  \ Unicode 字符上操作。因此，如果你想存储 Unicode 文本，字符流无疑是你的最佳选择。通常，为了执行基于字符的文件操作，你会将一个 `FileStream`\
  \ 封装在 `StreamReader` 或 `StreamWriter` 中。这些类会自动将字节流转换为字符流，反之亦然。请记住，在操作系统级别，文件是由字节集组成的。因此，`StreamReader`\
  \ 和 `StreamWriter` 并没有改变这一事实。\n\n要创建基于字符的输出流，可以将 `Stream` 对象（例如 `FileStream`）封装在\
  \ `StreamWriter` 中。其最常用的用法之一所示：\n\n```csharp\nStreamWriter(Stream *stream*)\n```\n\
  \n在这里，`stream` 是已打开流的名称。如果 *stream* 为空，则此构造函数将抛出 `ArgumentNullException`。一旦创建，`StreamWriter`\
  \ 就会处理字符到字节的转换。\n\n这是一个简单的键盘到磁盘工具，读取键盘输入的文本行并将其写入名为 `test.txt` 的文件中。该工具使用封装在 `StreamWriter`\
  \ 中的 `FileStream` 输出到文件。\n\n```csharp\nusing System;\nusing System.IO;\n\nclass\
  \ KtoD {\n    static void Main() {\n        string str;\n        FileStream fout;\n\
  \        try {\n            // Open a file using StreamWriter.\n            fout\
  \ = new FileStream(\"test.txt\", FileMode.Create);\n        } catch(IOException\
  \ exc) {\n            Console.WriteLine(exc.Message);\n            return;\n   \
  \     }\n        StreamWriter fstr_out = new StreamWriter(fout);\n        Console.WriteLine(\"\
  Enter text（输入 'stop' 退出）。\");\n        do {\n            Console.Write(\": \");\n\
  \            str = Console.ReadLine();\n            if(str != \"stop\") {\n    \
  \            str = str + \"\\r\\n\"; // 添加换行\n                try {\n          \
  \          fstr_out.Write(str);\n                } catch(IOException exc) {\n  \
  \                  Console.WriteLine(exc.Message);\n                    break;\n\
  \                }\n            }\n        } while(str != \"stop\");\n        fstr_out.Close();\n\
  \    }\n}\n```\n\n`StreamWriter` 派自 `TextWriter`。同样，两者在发生 I/O 错误时都会抛出 `IOException`。还可能发生其他异常。\n\
  \n在某些情况下，你可以直接使用 `StreamWriter` 打开文件。为此，请使用以下构造函数：\n\n```csharp\nStreamWriter(string\
  \ *filename*)\nStreamWriter(string *filename*, bool *appendFlag*)\n```\n\n在这里，`filename`\
  \ 指定要打开的文件名，可以包含完整路径。在第二种形式中，如果 `appendFlag` 为 true，则将输出追加到现有文件的末尾。否则，输出将覆盖指定的文件。在两种情况下，如果文件不存在，则会创建它。\n\
  \n\n\n\n\n# 第 11 章：使用 I/O\n\n## 使用 StreamReader\n\n要创建一个基于字符的输入流，请将字节流封装在 `StreamReader`\
  \ 之中。\n\n`StreamReader` 定义了几个构造函数。这里显示了一个常用的构造函数：`StreamReader(Stream *stream*)`\n\
  \n在这里，`stream` 是已打开流的名称。如果 `stream` 为 `null`，该构造函数将抛出 `ArgumentNullException`；如果流未为输入而打开，则将抛出\
  \ `ArgumentException`。一旦创建，`StreamReader` 将自动处理字节到字符的转换。\n\n以下程序使用 `StreamReader`\
  \ 创建了一个简单的“磁盘到屏幕”实用工具，它可以逐行读取名为 `test.txt` 的文本文件并将其内容显示在屏幕上。因此，它是上一节所示的“屏幕到磁盘”工具的互补。\n\
  \n```c\n// 一个简单的磁盘到屏幕工具，用于演示 FileReader 的用法。\n\nusing System;\nusing System.IO;\n\
  \nclass DtoS {\n    static void Main() {\n        FileStream fin;\n        string\
  \ s;\n        try {\n            fin = new FileStream(\"test.txt\", FileMode.Open);\n\
  \        } catch(IOException exc) {\n            Console.WriteLine(exc.Message);\n\
  \            return ;\n        }\n        StreamReader fstr_in = new StreamReader(fin);\n\
  \        try {\n            while((s = fstr_in.ReadLine()) != null) {\n        \
  \        // 从文件中读取行\n                Console.WriteLine(s);\n                // 将它们显示在屏幕上。\n\
  \            }\n        } catch(IOException exc) {\n            Console.WriteLine(exc.Message);\n\
  \        }\n        fstr_in.Close();\n    }\n}\n```\n\n注意文件结束是如何判定的。当 `ReadLine()`\
  \ 返回的引用为 `null` 时，说明到达文件末尾。\n\n与 `StreamWriter` 一样，在某些情况下，你可以直接使用 `StreamReader`\
  \ 打开文件。\n\n要这样做，请使用此构造函数：`StreamReader(string *filename*)`\n\n在这里，`filename` 指定要打开的文件名，它可以包含完整的路径指定符。\n\
  \n该文件必须存在。如果不存在，将抛出 `FileNotFoundException`。如果 `filename` 为 `null`，则将抛出 `ArgumentNullException`。如果\
  \ `filename` 为空字符串，则抛出 `ArgumentException`。还可能出现 `IOException` 和 `DirectoryNotFoundException`。\n\
  \n### 专家问答\n\n**Q：我听说在打开 `StreamReader` 或 `StreamWriter` 时可以指定“字符编码”。什么是字符编码？我应该何时使用它？**\n\
  \n**A：`StreamReader` 和 `StreamWriter` 根据指定翻译如何发生的*字符编码*（character encoding）将字节转换为字符，反之亦然。默认情况下，C#\
  \ 使用 UTF-8 编码，它与 ASCII 兼容。要指定其他编码，你将使用包含 `encoding` 参数的 `StreamReader` 或 `StreamWriter`\
  \ 构造函数的重载版本。通常情况下，只有在异常情况下才需要指定字符编码。**\n\n## 重定向标准流\n\n如之前所述，标准流（如 `Console.In`）可以被重定向。到目前，最常见的重定向到文件。当标准流被重定向时，输入或输出会自动重定向到新流，绕过默认设备。通过重定向标准流，你的程序可以从磁盘文件读取命令、创建日志文件，甚至从网络连接读取输入。\n\
  \n**标准流重定向可以通过两种方式实现。首先，当你在命令行上执行程序时，可以使用 `<` 和 `>` 运算符分别重定向 `Console.In` 和 `Console.Out`。例如，给定此程序：\n\
  \n```c\nusing System;\n\nclass Test {\n    static void Main() {\n        Console.WriteLine(\"\
  This is a test.\");\n    }\n}\n```\n\n像这样执行程序：\n`Test > log`\n\n将导致行“This is a test.”被写入名为\
  \ `log` 的文件。输入也可以以相同的方式重定向。重定向输入时需要记住的是，你必须确保你指定的输入源包含足够的输入以满足程序需求。否则，程序将挂起。\n\n\
  `<` 和 `>` 命令行重定向运算符不是 C# 的一部分，而是由操作系统提供的。因此，如果你的环境支持 I/O 重定向（如 Windows 所示），你可以在不修改程序的情况下重定向标准输入和标准输出。然而，还有第二种重定向标准流的方法，它是受程序控制的。要这样做，你将使用这里的\
  \ `SetIn()`、`SetOut()` 和 `SetError()` 方法，它们是 `Console` 的成员：\n\n```csharp\nstatic\
  \ void SetIn(TextReader *input*)\nstatic void SetOut(TextWriter *output*)\nstatic\
  \ void SetError(TextWriter *output*)\n```\n\n因此，要重定向输入，调用 `SetIn()` 并指定所需的流。只要派生自\
  \ `TextReader`，你就可以任何输入流。要重定向输出，指定任何派生自 `TextWriter` 的流。例如，要将输出重定向到文件，使用 `StreamWriter`。以下程序显示了一个示例：\n\
  \n```csharp\n// 重定向 Console.Out。\nusing System;\nusing System.IO;\n\nclass Redirect\
  \ {\n    static void Main() {\n        StreamWriter log_out;\n        try {\n  \
  \          log_out = new StreamWriter(\"logfile.txt\");\n        } catch(IOException\
  \ exc) {\n            Console.WriteLine(exc.Message);\n            return;\n   \
  \     }\n        // 重定向标准输出到 logfile.txt。\n        Console.SetOut(log_out);\n  \
  \      try {\n            Console.WriteLine(\"This is the start of the log.\");\n\
  \            for(int i=0; i<10; i++) {\n                Console.WriteLine(\"line\
  \ \" + i);\n            }\n            Console.WriteLine(\"This is the end of the\
  \ log.\");\n        } catch(IOException exc) {\n            Console.WriteLine(exc.Message);\n\
  \        }\n        log_out.Close();\n    }\n}\n```\n\n当你运行此程序时，屏幕上不会有任何输出。然而，`logfile.txt`\
  \ 将包含：\n\n```\nThis is the start of the log.\nline 0\nline 1\nline 2\nline 3\nline\
  \ 4\nline 5\nline 6\nline 7\nline 8\nline 9\nThis is the end of the log.\n```\n\n\
  在你自己，你可以尝试重定向其他流。\n\n## 尝试：创建一个文件比较工具\n\n此示例开发了一个简单而实用的文件比较工具。它通过打开要比较的文件并比较每个字节来工作。如果发现不匹配，文件不同。如果同时到达文件结束且没有发现不匹配，则文件相同。\n\
  \n### 步骤\n\n1. 创建名为 `CompFiles.cs` 的文件。\n2. 在 `CompFiles.cs` 中添加以下程序：\n\n```csharp\n\
  /*\n比较两个文件。\n使用此程序，在命令行上指定要比较的文件名。\n例如：\nCompFiles FIRST.TXT SECOND.TXT\n*/\n```\n\
  \n```csharp\nusing System;\nusing System.IO;\n\nclass CompFiles {\n    static void\
  \ Main(string[] args) {\n        int i=0, j=0;\n        FileStream f1;\n       \
  \ FileStream f2;\n        if(args.Length != 2) {\n            Console.WriteLine(\"\
  Usage: CompFiles F1 F2\");\n            return;\n        }\n        // 打开第一个文件。\n\
  \        try {\n            f1 = new FileStream(args[0], FileMode.Open);\n     \
  \   } catch(IOException exc) {\n            Console.WriteLine(exc.Message);\n  \
  \          return;\n        }\n        // 打开第二个文件。\n        try {\n            f2\
  \ = new FileStream(args[1], FileMode.Open);\n        } catch(IOException exc) {\n\
  \            Console.WriteLine(exc.Message);\n            f1.Close();\n        \
  \    return;\n        }\n        // 比较文件。\n        try {\n            do {\n   \
  \             i = f1.ReadByte();\n                j = f2.ReadByte();\n         \
  \       if(i != j) break;\n            } while(i != -1 && j != -1);\n          \
  \  if(i != j)\n                Console.WriteLine(\"Files differ.\");\n         \
  \   else\n                Console.WriteLine(\"Files are the same.\");\n        }\
  \ catch(IOException exc) {\n            Console.WriteLine(exc.Message);\n      \
  \  }\n        f1.Close();\n        f2.Close();\n    }\n}\n```\n\n3. 为了尝试 **CompFiles**，首先将\
  \ `CompFiles.cs` 复制到名为 `temp` 的文件。然后尝试此命令行：`CompFiles CompFiles.cs temp`\n\n4. 程序将报告文件是相同的。接下来，使用命令行将\
  \ `CompFiles.cs` 与 `CopyFile.cs`（之前所示）进行比较：\n\n`CompFiles CompFiles.cs CopyFile.cs`\n\
  \n这些文件不同，**CompFiles** 将报告这一事实。\n\n\n\n\n\n5. 请你自己尝试使用各种选项来增强 `CompFiles`。例如，添加一个忽略字母大小写的选项。另一个想法是让\
  \ `CompFiles` 显示文件中不同之处的位置。\n\n## 二进制数据的读取与写入\n\n到目前为止，我们只是在读取和写入字节（byte）或字符（character），但读取和写入其他类型的数据也是可能的——事实上，这也是常见的。例如，你可能想要创建一个包含\
  \ `int`、`double` 或 `short` 的文件。要读取和写入 C# 内置类型的二进制值，你将使用 `BinaryReader` 和 `BinaryWriter`。在使用这些流时，重要的一点是理解这些数据是使用其内部的二进制格式读取和写入的，而不是人类可读的文本形式。\n\
  \n## BinaryWriter\n\n`BinaryWriter` 是字节流的包装器，用于管理二进制数据的写入。其最常用的构造函数在此所示：\n\n```\n\
  BinaryWriter(Stream *outputStream*)\n```\n\n在这里，`outputStream` 是写入数据的流。若要向文件输出输出，可以使用\
  \ `FileStream` 创建的对象作为此参数。如果 `outputStream` 为 `null`，则会抛出 `ArgumentNullException`。如果\
  \ `outputStream` 未打开以进行写入，则会抛出 `ArgumentException`。\n\n`BinaryWriter` 定义了可以写入 C#\
  \ 所有内置类型的方法。表 11-5 显示了其中几种。`BinaryWriter` 还定义了标准的 `Close()` 和 `Flush()` 方法，其工作方式与之前描述的相同。\n\
  \n### 表 11-5 BinaryWriter 定义的常用输出方法\n\n| 方法 | 说明 |\n| :--- | :--- |\n| `void Write(sbyte\
  \ *val*)` | 写入一个有符号字节。 |\n| `void Write(byte *val*)` | 写入一个无符号字节。 |\n| `void Write(byte[\
  \ ] *buf*)` | 写入一个字节数组。 |\n| `void Write(short *val*)` | 写入一个短整型。 |\n| `void Write(ushort\
  \ *val*)` | 写入一个无符号短整型。 |\n| `void Write(int *val*)` | 写入一个整数。 |\n| `void Write(uint\
  \ *val*)` | 写入一个无符号整数。 |\n| `void Write(long *val*)` | 写入一个长整型。 |\n| `void Write(ulong\
  \ *val*)` | 写入一个无符号长整型。 |\n| `void Write(float *val*)` | 写入一个浮点数。 |\n| `void Write(double\
  \ *val*)` | 写入一个双精度浮点数。 |\n| `void Write(char *val*)` | 写入一个字符。 |\n| `void Write(char[\
  \ ] *buf*)` | 写入一个字符数组。 |\n| `void Write(string *val*)` | 写入一个字符串。 |\n\n## BinaryReader\n\
  \n`BinaryReader` 是字节流的包装器，用于处理二进制数据的读取。其最常用的构造函数在此所示：\n\n```\nBinaryReader(Stream\
  \ *inputStream*)\n```\n\n在这里，`inputStream` 是读取数据的流。若要从文件中读取，可以使用 `FileStream` 创建的对象作为此参数。如果\
  \ `inputStream` 未打开以进行输入或无效，则会抛出 `ArgumentException`。\n\n`BinaryReader` 提供了读取 C#\
  \ 所有内置类型的方法。最常用的在表 11-6 中。`BinaryReader` 还定义了三个版本的 `Read()`，在此所示：\n\n```\nint Read()\n\
  返回从调用输入流中获取的可用字符的整数表示。当尝试在文件末尾读取时，返回 –1。\n\nint Read(byte[ ] *buf*, int *offset*,\
  \ int *num*)\n尝试从 `buf` 的 [*offset*] 位置开始向 `buf` 读取多达 `num` 个字节，并返回成功读取的字节数。\n\n\
  int Read(char[ ] *buf*, int *offset*, int *num*)\n尝试从 `buf` 的 [*offset*] 位置开始向 `buf`\
  \ 读取多达 `num` 个字符，并返回成功读取的字符数。\n```\n\n这些方法在执行失败时将抛出 `IOException`。也可能发生其他异常。还定义了标准的\
  \ `Close()` 方法。\n\n### 表 11-6 BinaryReader 定义的常用输入方法\n\n| 方法 | 说明 |\n| :--- | :---\
  \ |\n| `bool ReadBoolean()` | 读取一个 bool。 |\n| `byte ReadByte()` | 读取一个字节。 |\n| `sbyte\
  \ ReadSByte()` | 读取一个 sbyte。 |\n| `byte[ ] ReadBytes(int *num*)` | 读取 `num` 个字节并作为数组返回。\
  \ |\n| `char ReadChar()` | 读取一个字符。 |\n| `char[ ] ReadChars(int *num*)` | 读取 `num`\
  \ 个字符并作为数组返回。 |\n| `double ReadDouble()` | 读取一个双精度浮点数。 |\n| `float ReadSingle()`\
  \ | 读取一个浮点数。 |\n| `short ReadInt16()` | 读取一个短整型。 |\n| `int ReadInt32()` | 读取一个整数。\
  \ |\n| `long ReadInt64()` | 读取一个长整型。 |\n| `ushort ReadUInt16()` | 读取一个无符号短整型。 |\n\
  | `uint ReadUInt32()` | 读取一个无符号整数。 |\n| `ulong ReadUInt64()` | 读取一个无符号长整型。 |\n|\
  \ `string ReadString()` | 读取一个字符串。 |\n\n## 演示二进制 I/O\n\n这是一个演示 `BinaryReader` 和\
  \ `BinaryWriter` 的程序。它写入然后读取数据。\n\n```csharp\n// 演示 BinaryReader 和 BinaryWriter。\n\
