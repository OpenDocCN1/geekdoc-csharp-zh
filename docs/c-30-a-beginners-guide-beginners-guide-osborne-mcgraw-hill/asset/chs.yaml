  \ `Area()` 将需要计算椭圆的面积。\n\n前面的程序中还有一个重要特征。注意 `Main()` 中，`shapes` 被声明为 `TwoDShape`\
  \ 对象的数组。然而，此数组的元素被赋值为 `Triangle`、`Rectangle` 和 `TwoDShape` 。这是有效的，因为基类引用可以指向派生类对象。程序随后遍历数组，显示每个对象的信息。虽然非常简单，但这个程序展示了继承和方法重写的威力。存储在基类引用变量中的对象类型在运行时确定，并据此进行操作。如果对象派自\
  \ `TwoDShape`，则可以通过调用 `Area()` 获取其面积。无论使用什么类型的形状，该操作的接口都是相同的。\n\n### 使用抽象类\n\n有时你可能想要创建一个基类，它只定义一个供所有派生类共享的通用形式，而留给每个派生类去填充细节。此类类决定了派生类必须实现的方法性质，但本身并不提供其中一个或多个方法的实现。这种情况发生的一种方式是基类无法为某个方法创建有有意义的实现。前面示例中使用的\
  \ `TwoDShape` 版本就是如此。`Area()` 的定义仅仅是一个占位符。它不会计算并显示任何类型对象的面积。\n\n正如你在创建自己的类库时将看到的，一个方法在它的基类的上下文中没有有意义的定义并不罕见。你可以通过两种方式处理这种情况。一种方法（如上一个示例所示）是让它报告一个警告消息。虽然这种方法在某些情况下（如调试）可能有用，但通常并不合适。你可能某些方法*必须*被派生类重写，以便使派生类具有意义。考虑\
  \ `Triangle` 类。如果没有定义 `Area()`，它就没有意义。在这种情况下，你希望有一种方式能确保派生类确实重写了所有必要的方法。C# 对此问题的解决方案是*抽象方法*。\n\
  \n## 第 8 章：继承\n\n### 323\n\n抽象方法通过指定 `abstract` 类型修饰符创建。抽象方法没有方法体，因此不由基类实现。因此，派生类必须重写它——它不能简单使用基类中定义的版本。正如你可能猜到的，抽象方法自动是\
