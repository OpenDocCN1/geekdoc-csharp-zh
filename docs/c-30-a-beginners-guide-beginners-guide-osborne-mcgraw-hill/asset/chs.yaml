  \ McGraw-Hill Companies. 点击此处查看使用条款。\n\n506\n\nC# 3.0: 初学者指南\n\n关键技能与概念\n\n● LINQ\
  \ 基础\n\n● 查询中的类型对应\n\n● 使用 **where** 过滤值\n\n● 使用 **orderby** 排序结果\n\n● 使用 **select**\
  \ 选择值\n\n● 使用 **group** 分组结果\n\n● 使用 **into** 创建延续\n\n● 使用 **join** 连接两个序列\n\n●\
  \ 匿名类型和对象初始化器\n\n● 创建分组连接 (group join)\n\n● 使用 **let** 在查询中创建变量\n\n● 查询方法\n\n● 延迟执行\
  \ VS 即时查询执行\n\n● Lambda 表达式\n\n● 扩展方法\n\n\n\n\n\n正如前一节介绍泛型一样，LINQ 的主题非常大，涉及许多功能、选项和替代方案。在本初学者指南中，无法涵盖它的所有方面。（事实上，对\
  \ LINQ 的完整描述需要专门的一整本书！）本章将解释它的理论、核心概念和基本语法。它还展示了几个说明 LINQ 用法的示例。完成本章后，你将能够在程序中使用\
  \ LINQ。然而，这是一个你几乎肯定想要更深入地探索的子系统。\n\n## 什么是 LINQ？\n\nLINQ 代表语言集成查询（language-integrated\
  \ query）。它包含了一系列允许你从数据源中检索信息的功能。正如你可能知到的，数据检索构成了许多程序的重要部分。例如，程序可能会从客户列表中获取信息，在目录中查找产品信息，或访问员工记录。\n\
  \n在许多情况下，此类数据存储在与应用程序分离的数据库中。例如，产品目录可能存储在关系数据库中。在过去，与此类数据库交互涉及使用 SQL（结构化查询语言）生成查询。其他数据源（如\
  \ XML）需要它们自己的方法。因此，在 C# 3.0 之前，C# 并没有内置对这类查询的支持。LINQ 改变了这一点。\n\nLINQ 为 C# 增加了为任何\
  \ LINQ 兼容数据源生成查询的能力。此外，无论使用什么数据源，用于查询的语法都是相同的。\n\n这意味着查询关系数据库中数据的语法与查询存储在数组中数据的语法是相同的。现在不再需要使用\
  \ SQL 或任何其他非 C# 机制。查询能力已完全集成到 C# 语言中。\n\n除了配合 SQL 使用 LINQ 外，LINQ 还可以用于 XML 文件和 ADO.NET\
  \ 数据集。同样重要的是，它还可以用于 C# 数组和集合（在第 15 节中描述）。因此，LINQ 提供了一种访问数据的统一方法。这是一个强大且创新的概念。它不仅改变了访问数据的方式，还提供了一种思考和处理旧问题的新方法。未来，许多类型的编程解决方案将基于\
  \ LINQ 进行构建。它的影响将不仅限于数据库访问。\n\nLINQ 由一组相互关联的功能支持，包括添加到 C# 语言中的查询语法、lambda 表达式、匿名类型和扩展方法。这些内容将在本章中进行介绍。\n\
  \n## LINQ 基础\n\nLINQ 的核心是 `query`（查询）。查询指定了将从数据源获取哪些数据。例如，对客户邮件列表的查询可能会请求居住在特定城市（如芝加哥或东京）的所有客户地址。对库存数据库的查询可能会请求缺货列表。对互联网使用日志的查询可能会请求访问量最高的网站列表。尽管这些查询在细节上有所不同，但它们可以使用相同的\
  \ LINQ 语法元素来表示。\n\n查询创建后，就可以执行它。实现此的一种的方法是在 `foreach` 循环中使用查询。执行查询会获取其结果。因此，使用查询涉及两个关键步骤：第一，创建查询的形式；第二，执行查询。因此，查询定义了从数据源中检索*什么*，而执行查询实际上是*获取结果*。\n\
  \n为了让数据源被 LINQ 使用，它必须实现 `IEnumerable` 接口。该接口有两种形式：一种是泛型的，另一种不是。通常情况下，如果数据源实现泛型版本\
  \ `IEnumerable<T>` 会更容易，其中 `T` 指定了正在枚举的数据类型。本章其余部分假设数据源实现了 `IEnumerable<T>`。该接口在\
  \ `System.Collections.Generic` 中声明。实现 `IEnumerable<T>` 的类支持枚举，这意味着可以按顺序逐个获取其内容。所有\
  \ C# 数组都支持 `IEnumerable<T>`。因此，我们可以使用数组来演示 LINQ 的核心概念。然而，请记住，LINQ 不限于数组。\n\n## 简单查询\n\
  \n在进入任何其他理论之前，让我们来看一个简单的 LINQ 示例。以下程序使用查询来获取整数数组中包含的正值：\n\n```csharp\n// 创建一个简单的\
  \ LINQ 查询。\nusing System;\nusing System.Linq;\n\nclass SimpQuery {\n    static void\
  \ Main() {\n        int[] nums = { 1, -2, 3, 0, -4, 5 };\n        // 创建一个仅获取正数的查询。\n\
  \        var posNums = from n in nums\n                      where n > 0\n     \
  \                 select n;\n\n        Console.WriteLine(\"The positive values in\
  \ nums:\");\n        // 执行查询并显示结果。\n        foreach(int i in posNums) Console.WriteLine(i);\n\
  \    }\n}\n```\n\n该程序产生以下输出：\n```\nThe positive values in nums:\n1\n3\n5\n```\n\n\
  ## 第 14 章：引入 LINQ\n\n正如你所看到的，只有 `nums` 数组中的正值被显示出来。尽管非常简单，这个程序演示了 LINQ 的关键特性。让我们仔细检查它。\n\
  \n程序中首先注意到的是 `using` 指令：\n\n```csharp\nusing System.Linq;\n```\n\n要使用 LINQ 功能，必须包含\
  \ `System.Linq` 命名空间。接下来，声明了一个名为 `nums` 的 `int` 数组。所有数组都可以隐式转换为 `IEnumerable<T>`。这使得\
  \ C# 数组可以作为 LINQ 数据源。\n\n接下来，声明了一个查询来检索 `nums` 中正数的元素。示例如下：\n\n```csharp\nvar posNums\
  \ = from n in nums\n              where n > 0\n              select n;\n```\n\n\
  变量 `posNums` 被称为*查询变量*（query variable）。它引用查询定义的规则集。注意它使用 `var` 来隐式声明 `posNums`。如你所知，这使得\
  \ `posNums` 成为隐式类型变量。尽管你可以显式地声明类型（该类型必须是 `IEnumerable<T>` 的某种形式）。然后将查询表达式赋值给变量 `posNums`。\n\
  \n所有查询都以 `from` 开始。该子句指定了两个项：第一个是*范围变量*（range variable），它将接收从数据源获取的元素。在这种情况下，范围变量是\
  \ `n`。第二个项是数据源，在这种情况下是 `nums` 数组。范围变量的类型从数据源推断。在这种情况下，`n` 的类型是 `int`。泛化来说，`from`\
  \ 子句的语法如下：\n\n```sql\nfrom *range-variable* in *data-source*\n```\n\n查询的下一个子句是 `where`。它指定了数据源中的元素被查询获取必须满足的条件。其通用形式所示：\n\
  \n```sql\nwhere *boolean-expression*\n```\n\n布尔表达式必须产生一个 `bool` 结果。（此表达式也称为*谓词*\
  \ predicate）。一个查询可以有多个 `where` 子句。在程序中使用了这个 `where` 子句：\n\n```csharp\nwhere n >\
  \ 0\n```\n\n它仅对值大于零的元素为真。当查询执行时，会对 `nums` 中的每个 `n` 求值该表达式。只有满足此条件的值会被获取。换句话说，`where`\
  \ 子句充当数据源的过滤器，只允许某些项目通过。\n\n所有查询都以 `select` 子句或 `group` 子句结束。在本示例中，使用了 `select`\
  \ 子句。它精确地指定了查询获取的内容。对于简单查询（如本示例所示），选择了范围值。因此，它返回了 `nums` 中满足 `where` 子句的整数。\n\n\n\
  \n\n\nC# 3.0: 入学者指南\n\n被选中的内容。例如，在查询邮件列表时，你可能只想返回每个收件者的姓，而不是整个地址。注意 `select` 子句以分号结束。由于\
  \ `select` 结束了一个查询，它也结束了语句并需要分号。然而，请注意，查询中的其他子句并没有以分号结束。\n\n到此时，已经创建了一个名为 `posNums`\
  \ 的查询变量，但尚未获得结果。重要的一点是，理解查询仅仅定义了一组规则。只有在执行查询时，才能获得结果。此外，同一个查询可以执行两次或多次，如果底层数据源在多次执行之间发生了变化，结果可能会不同。因此，简单地声明查询\
  \ `posNums` 并不意味着它包含了查询结果。\n\n要执行该查询，程序使用了此处 `foreach` 循环：\n\n```bash\nforeach(int\
  \ i in posNums) Console.WriteLine(i);\n```\n\n注意 `posNums` 被指定为要迭代的集合。当 `foreach`\
  \ 执行时，由 `posNums` 指定的查询所定义的规则将被执行。循环每通过一次，就会获取查询返回的下一个元素。当没有更多元素可以检索时，过程结束。在这种情况下，迭代变量\
  \ `i` 的类型被显式指定为 `int`，因为这是查询检索的元素的类型。在这种情况下，显式指定迭代变量的类型是可以的，因为很容易知道查询所选值的类型。然而，在更复杂的情况下，使用\
  \ `var` 隐式地指定迭代变量的类型会更容易（或者在某些情况下是必要的）。\n\n## 查询可以执行多次\n\n由于查询定义了一组用于检索数据的规则，但其本身并不产生结果，因此同一个查询可以运行多次。如果数据源在运行之间发生变化，那么查询的结果可能会不同。因此，一旦你定义了查询，执行它将始终产生最的的结果。这里有一个示例。在上述程序的后续版本中，在两次执行\
  \ `posNums` 之间，`nums` 数组的内容发生了变化：\n\n```csharp\n// 创建一个简单的查询。\nusing System;\nusing\
  \ System.Linq;\nusing System.Collections.Generic;\n\nclass SimpQuery {\n    static\
  \ void Main() {\n        int[] nums = { 1, -2, 3, 0, -4, 5 };\n\n        // 创建一个仅获取正数的查询。\n\
  \        var posNums = from n in nums\n                      where n > 0\n     \
  \                 select n;\n\n        // 第 14 章：引入 LINQ\n        // 511\n     \
  \   Console.WriteLine(\"The positive values in nums:\");\n\n        // 执行查询并显示结果。\n\
  \        foreach(int i in posNums) Console.WriteLine(i);\n\n        // 更改 nums。\n\
  \        Console.WriteLine(\"\\nSetting nums[1] to 99.\");\n        nums[1] = 99;\n\
  \n        // 这些产生了不同的结果。\n        Console.WriteLine(\"The positive values in nums:\"\
  );\n\n        // 第二次执行查询。\n        foreach(int i in posNums) Console.WriteLine(i);\n\
  \    }\n}\n```\n\n产生了如下输出：\n\n```text\nThe positive values in nums:\n1\n3\n5\nSetting\
  \ nums[1] to 99.\nThe positive values in nums:\n1\n99\n3\n5\n```\n\n如输出确认的，在 `nums[1]`\
  \ 中的值从 –2 变为 99 后，重新运行查询的结果反映了这一变化。这是一个必须强调的要点。查询的每次执行都会产生自己的结果，这些结果通过枚举数据源当前的内容获得。因此，如果数据源发生变化，执行查询的结果也可能发生变化。这种方法的处非常显著。例如，如果你正在获取在线商店的待处理订单列表，你希望每次执行查询都能产生所有订单，包括刚刚输入的订单。\n\
  \n## 查询中数据类型之间的关系\n\n如前面的示例所示，查询涉及类型相互关联的变量。这些是查询变量、范围变量和数据源。由于这些类型之间的对应关系既重要又初看起来有些困惑，它们值得仔细观察。\n\
  \n范围变量的类型必须与数据源中存储元素的类型一致。因此，范围变量的类型取决于数据源的类型。在许多情况下，C# 可以推断范围变量的类型。只要数据源实现了 `IEnumerable<T>`，就可以进行类型推断，因为\
  \ `T` 描述了数据源元素的类型。（如提到的，所有数组都实现了 `IEnumerable<T>`，许多其他数据源也是如此）。但如果数据源实现了非泛型的 `IEnumerable`，你将需要显式指定范围变量的类型。这是通过在\
  \ `from` 子句中指定其类型来实现的。例如，假设前面的示例如下，这显示了如何显式声明 `n` 为 `int`：\n\n```csharp\nvar posNums\
  \ = from int n in nums\n// ...\n```\n\n当然，这里不需要显式指定类型，因为所有数组都可以隐式转换为 `IEnumerable<T>`，这使得范围变量的类型可以被推断。\n\
  \n查询返回的对象的类型是 `IEnumerable<T>` 的实例，其中 `T` 是元素的类型。因此，查询变量的类型必须是 `IEnumerable<T>`\
  \ 的实例。`T` 的值由 `select` 子句指定的类型决定。在前面的示例中，`T` 是 `int`，因为 `n` 是 `int`。\n\n```csharp\n\
  IEnumerable<int> posNums = from n in nums\n                          where n > 0\n\
  \                          select n;\n```\n\n\n\n\n\n如前所述，`where` 用于过滤查询返回的数据。之前的示例仅仅展示了它最简单的形式，即使用单个条件。要理解的关键点是，你可以使用\
  \ `where` 根据多个条件来过滤数据。实现此点的一种方法是使用多个 `where` 子句。例如，考虑以下程序，它只显示数组中既为正数又小于 10 的值。\n\
  \n```csharp\n// Use multiple where clauses.\n\nusing System;\nusing System.Linq;\n\
  \nclass TwoWheres {\n    static void Main() {\n        int[] nums = { 1, -2, 3,\
  \ -3, 0, -8, 12, 19, 6, 9, 10 };\n        // 创建一个获取小于 10 的正值的查询：\n        var posNums\
  \ = from n in nums\n                      where n > 0\n                      Use\
  \ two where clauses.\n                      where n < 10\n                     \
  \ select n;\n        Console.WriteLine(\"The positive values less than 10:\");\n\
  \        // 执行查询并显示结果。\n        foreach(int i in posNums) Console.WriteLine(i);\n\
  \    }\n}\n```\n\n输出所示：\nThe positive values less than 10:\n1\n3\n6\n9\n\n如你所见，只检索了小于\
  \ 10 的正值。\n\n虽然像刚才那样使用两个 `where` 子句并没有错误，但通过使用单个 `where` 将两个测试合并到一个表达式中，可以用更紧凑的方式实现相同的效果。这里使用这种方法重写的查询：`var\
  \ posNums = from n in nums where n > 0 && n < 10 select n;`\n\n通常情况下，`where` 条件可以使用任何评估为布尔结果的有效\
  \ C# 表达式。例如，以下程序定义了一个 `string` 数组。其中几个字符串是互联网地址。查询 `netAddrs` 只检索那些长度超过四个字符且以“.net.”结尾的字符串。因此，它找到了包含使用\
  \ `.net` 名的互联网地址的字符串。\n\n```csharp\n// Demonstrate another where clause.\n\nusing\
  \ System;\nusing System.Linq;\n\nclass WhereDemo2 {\n    static void Main() {\n\
  \        string[] strs = { \".com\", \".net\", \"hsNameA.com\", \"hsNameB.net\"\
  ,\n                          \"test\", \".network\", \"hsNameC.net\", \"hsNameD.com\"\
  \ };\n        // 创建一个获取以 .net 结尾的\n        // 互联网地址的查询。\n        var netAddrs =\
  \ from addr in strs\n                      where addr.Length > 4 && addr.EndsWith(\"\
  .net\")\n                      select addr;\n        // A more complicated\n   \
  \     // 执行查询并显示结果。\n        foreach(var str in netAddrs) Console.WriteLine(str);\n\
  \    }\n}\nwhere expression\n```\n\n输出所示：\nhsNameB.net\nhsNameC.net\n\n注意，程序使用了\
  \ `string` 的另一个名为 `EndsWith()` 的方法。如果调用的字符串以参数指定的字符序列结尾，则它返回 true。\n\n### 使用 orderby\
  \ 排序结果\n\n你通常会希望查询结果进行排序。例如，你可能希望按照剩余余额从大到小的顺序，获取一份逾期账户列表。或者，你可能希望按名称字母顺序获取一份客户列表。无论目的是什么，LINQ\
  \ 都为你提供了一种生成排序结果的简单方法：`orderby` 子句。\n\n`orderby` 的通用形式所示：\n`orderby sort-on how`\n\
  \n用于排序的项目由 `sort-on` 指定。它可以宽泛到存储在数据源中的整个元素，也可以限制为元素中单个字段的一部分。`how` 的值决定排序是升序还是降序，它必须是\
  \ `ascending`（升序）或 `descending`（降序）。默认方向是升序，所以通常不需要指定 `ascending`。\n\n这是一个使用 `orderby`\
  \ 升序检索 `int` 数组中值的示例：\n\n```csharp\n// Demonstrate orderby.\n\nusing System;\nusing\
  \ System.Linq;\n\nclass OrderbyDemo {\n    static void Main() {\n        int[] nums\
  \ = { 10, -19, 4, 7, 2, -5, 0 };\n        // 创建一个按排序顺序获取值的查询。\n        var sNums\
  \ = from n in nums\n                    orderby n\n                    Sort the\
  \ result.\n                    select n;\n        Console.Write(\"Values in ascending\
  \ order: \");\n        // 执行查询并显示结果。\n        foreach(int i in sNums) Console.Write(i\
  \ + \" \");\n        Console.WriteLine();\n    }\n}\n```\n\n输出所示：\nValues in ascending\
  \ order: -19 -5 0 2 4 7 10\n\n要将顺序更改为降序，只需指定 `descending` 选项，如下：`var sNums = from\
  \ n in nums orderby n descending select n;`\n\n如果你尝试这样做，你会发现值的顺序反转了。\n\n### 详细查看\
  \ select\n\n`select` 子句决定了查询获取什么种类型的元素。它的通用形式所示：\n`select expression`\n\n到目前为止，我们一直使用\
  \ `select` 返回范围变量。因此，`expression` 仅仅是命名了该范围变量。然而，`select` 并不限于这种简单的操作。它可以返回范围变量的特定部分、对范围变量应用某些操作或转换的结果，甚至可以返回从范围变量获取的信息片段构建出的新类型对象。这被称为*投影*（projecting）。\n\
  \n为了开始检查 `select` 的其他功能，请考虑以下程序。它显示了 `double` 数组包含的正数的平方根。\n\n```csharp\n// Use\
  \ select to return the square root of all positive values\n// in an array of doubles.\n\
  \nusing System;\nusing System.Linq;\n\nclass SelectDemo {\n    static void Main()\
  \ {\n        double[] nums = { -10.0, 16.4, 12.125, 100.85, -2.2, 25.25, -3.5 }\
  \ ;\n        // 创建一个查询返回 nums 数组中\n        // 正值的平方根。\n        var sqrRoots = from\
  \ n in nums\n                      where n > 0\n                      Return a sequence\
  \ that contains\n                      the square roots of n.\n                \
  \      select Math.Sqrt(n);\n        Console.WriteLine(\"The square roots of the\
  \ positive values\" +\n                          \" rounded to two decimal places:\"\
  );\n        // 执行查询并显示结果。\n        foreach(double r in sqrRoots) Console.WriteLine(\"\
  {0:#.##}\", r);\n    }\n}\n```\n\n输出所示：\nThe square roots of the positive values\
  \ rounded to two decimal places:\n4.05\n3.48\n10.04\n5.02\n\n在程序中，特别注意 `select`\
  \ 子句：\n`select Math.Sqrt(n);`\n\n它返回范围变量的平方根。它是通过将范围变量传递给 `Math.Sqrt()` 实现的，后者返回参数的平方根。这意味着执行查询时获得的序列将包含\
  \ `nums` 中正值的平方根。如果你泛化这个概念，`select` 的威力就显而易见了。\n\n你可以使用 `select` 根据从数据源获取的值生成任何类型的序列。\n\
  \n这里有一个程序展示了另一种使用 `select` 的方法。它创建一个包含两个属性的类 `EmailAddress`。第一个存储姓名，第二个存储电子邮件。程序创建一个包含多个\
  \ `EmailAddress` 条目的数组。程序使用查询来仅获取电子邮件本身的列表。\n\n```csharp\n// Return a portion of\
  \ the range variable.\n\nusing System;\nusing System.Linq;\n\nclass EmailAddress\
  \ {\n    public string Name { get; set; }\n    public string Address { get; set;\
  \ }\n    public EmailAddress(string n, string a) {\n        Name = n;\n        Address\
  \ = a;\n    }\n}\n\nclass SelectDemo2 {\n    static void Main() {\n        EmailAddress[]\
  \ addrs = {\n            new EmailAddress(\"Herb\", \"Herb@HerbSchildt.com\"),\n\
  \            new EmailAddress(\"Tom\", \"Tom@HerbSchildt.com\"),\n            new\
  \ EmailAddress(\"Sara\", \"Sara@HerbSchildt.com\")\n        };\n        // 创建一个选择电子邮件地址的查询。\n\
  \        var eAddrs = from entry in addrs\n                      Use just the Address\
  \ portion\n                      select entry.Address;\n                      of\
  \ the elements in addrs.\n        Console.WriteLine(\"The e-mail addresses are\"\
  );\n        // 执行查询并显示结果。\n        foreach(string s in eAddrs) Console.WriteLine(\"\
  \ \" + s);\n    }\n}\n```\n\n输出所示：\nThe e-mail addresses are\nHerb@HerbSchildt.com\n\
  Tom@HerbSchildt.com\nSara@HerbSchildt.com\n\n\n\n\n\n特别注意 `select` 子句：\n\n```\n\
  select entry.Address;\n```\n\n它不是返回整个范围变量，而是只返回 `Address` 部分。这一事实从输出得到了证明。这意味着查询返回的是字符串序列，而不是\
  \ `EmailAddress` 对象的序列。这就是为什么 `foreach` 循环将 `s` 指定为 `string` 类型。正如前文所解释的，查询返回的序列类型是由\
  \ `select` 子句返回的值的类型决定的。\n\n`select` 的最强大的功能之一是它能够返回一个包含在查询执行期间创建的元素的序列。例如，考虑以下程序。它定义了一个名为\
  \ `ContactInfo` 的类，用于存储名称、电子邮件地址和电话号码。它还定义了上一个示例使用的 `EmailAddress` 类。\n\n在 `Main()`\
  \ 方法内部，创建了一个 `ContactInfo` 数组。然后，声明了一个查询，其数据源是一个 `ContactInfo` 数组，但返回的序列包含 `EmailAddress`\
  \ 对象。因此，`select` 返回的序列类型不是 `ContactInfo`，而是 `EmailAddress`，这些对象是在查询执行期间创建的。\n\n\
  ```cs\n// 使用查询从 ContactInfo 列表中获取 EmailAddresses 序列\nusing System;\nusing System.Linq;\n\
  \nclass ContactInfo {\n    public string Name { get; set; }\n    public string Email\
  \ { get; set; }\n    public string Phone { get; set; }\n    public ContactInfo(string\
  \ n, string a, string p) {\n        Name = n;\n        Email = a;\n        Phone\
  \ = p;\n    }\n}\n\nclass EmailAddress {\n    public string Name { get; set; }\n\
  \    public string Address { get; set; }\n    public EmailAddress(string n, string\
  \ a) {\n        Name = n;\n        Address = a;\n    }\n}\n\nclass SelectDemo3 {\n\
  \    static void Main() {\n        ContactInfo[] contacts = {\n            new ContactInfo(\"\
  Herb\", \"Herb@HerbSchildt.com\", \"555-1010\"), \n            new ContactInfo(\"\
  Tom\", \"Tom@HerbSchildt.com\", \"555-1101\"), \n            new ContactInfo(\"\
  Sara\", \"Sara@HerbSchildt.com\", \"555-0110\")\n        };\n        // 创建一个创建 EmailAddress\
  \ 对象列表的查询。\n        var emailList = from entry in contacts\n        select new EmailAddress(entry.Name,\
  \ entry.Email);\n\n        Console.WriteLine(\"The e-mail list is\");\n\n      \
  \  // 执行查询并显示结果。\n        foreach(EmailAddress e in emailList)\n            Console.WriteLine(\"\
  \ {0}: {1}\", e.Name, e.Address );\n    }\n}\n```\n\n从 `ContactInfo` 数组产生 `EmailAddress`\
  \ 对象列表。输出显示如下：\n\n```\nThe e-mail list is\nHerb: Herb@HerbSchildt.com\nTom: Tom@HerbSchildt.com\n\
  Sara: Sara@HerbSchildt.com\n```\n\n此示例的关键点在于，查询生成的序列类型可以由查询创建的对象组成。\n\n### 使用 group\
  \ 分组结果\n\n查询最强大的功能之一之一是由 `group` 子句提供的，因为它允许你创建按键分组的结果。使用从组中获取的序列，你可以轻松地访问与键相关的所有数据。这使得\
  \ `group` 成为检索组织为相关项序列的数据的一种简单且有效的方法。`group` 子句是仅两个可以结束查询的子句之一。（另一个是 `select`。）\n\
  \n`group` 子句具有以下通用形式：\n\n`group *range-variable* by *key*\n\n它返回分组为序列的数据，每个序列共享由\
  \ *key* 指定的键。\n\n`group` 的结果是一个包含类型 `IGrouping<TKey, TElement>` 元素的序列，该类型定义在 `System.Linq`\
  \ 命名空间中。它定义了一个共享公共键的对象集合。返回组的查询中，查询变量的类型是 `IEnumerable<IGrouping<TKey, TElement>>`。`IGrouping`\
  \ 定义了一个名为 `Key` 的只读属性，返回与每个序列关联的键。\n\n这里是一个说明 `group` 用法的示例。它声明了一个包含网站列表的数组。然后它创建一个查询，按顶级域名（如\
  \ `.org` 或 `.com`）对列表进行分组。\n\n```cs\n// 演示 group 子句。\nusing System;\nusing System.Linq;\n\
  \nclass GroupDemo {\n    static void Main() {\n        string[] websites = { \"\
  hsNameA.com\", \"hsNameB.net\", \"hsNameC.net\",\n        \"hsNameD.com\", \"hsNameE.org\"\
  , \"hsNameF.org\",\n        \"hsNameG.tv\", \"hsNameH.net\", \"hsNameI.tv\" };\n\
  \        // 创建一个按顶级域名分组网站的查询。\n        var webAddrs = from addr in websites\n  \
  \      where addr.LastIndexOf(\".\") != -1\n        group addr by addr.Substring(addr.LastIndexOf(\"\
  .\"));\n\n        // 执行查询并显示结果。\n        foreach(var sites in webAddrs) {\n    \
  \        Console.WriteLine(\"Websites grouped by \" + sites.Key);\n            foreach(var\
  \ site in sites)\n                Console.WriteLine(\" \" + site);\n           \
  \ // 按域名分组结果。\n            Console.WriteLine();\n        }\n    }\n}\n```\n\n输出显示如下：\n\
  \n```\nWebsites grouped by .com\nhsNameA.com\nhsNameD.com\nWebsites grouped by .net\n\
  hsNameB.net\nhsNameC.net\nhsNameH.net\nWebsites grouped by .org\nhsNameE.org\nhsNameF.org\n\
  Websites grouped by .tv\nhsNameG.tv\nhsNameI.tv\n```\n\n如输出所示，数据按顶级域名进行了分组。注意这是如何通过\
  \ `group` 子句实现的：\n\n`var webAddrs = from addr in websites where addr.LastIndexOf(\"\
  .\") != -1 group addr by addr.Substring(addr.LastIndexOf(\".\"));`\n\n键是通过使用 `LastIndexOf()`\
  \ 和 `Substring()` 方法获取的（这些方法在第 5 章中进行了描述。在这里使用的 `Substring()` 返回从指定索引开始一直到字符串末尾的子字符串）。网站名称中最后一个句点的索引是使用\
  \ `LastIndexOf()` 找到的。另一点：注意使用 `where` 子句过滤掉任何不包含句点的字符串。如果指定的字符串未包含调用字符串中，`LastIndexOf()`\
  \ 方法将返回 -1。\n\n由于执行 `webAddrs` 时获取的序列是组列表，因此你需要使用两个 `foreach` 循环来访问每个组的成员。外循环获取每个组。内层循环枚举组内的成员。外层\
  \ `foreach` 循环的迭代变量必须是与键和元素类型兼容的 `IGrouping` 实例。在示例中，键和元素都是 `string`。因此，外层循环迭代变量\
  \ `sites` 的类型是 `IGrouping<string, string>`。内层循环迭代变量的类型是 `string`。为了简洁起见，示例隐式声明了这些变量，但它们也可以像这样显式声明：\n\
  \n```cs\nforeach(IGrouping<string, string> sites in webAddrs) {\n    Console.WriteLine(\"\
  Websites grouped by \" + sites.Key);\n    foreach(string site in sites)\n      \
  \  Console.WriteLine(\" \" + site);\n    Console.WriteLine();\n}\n```\n\n### 使用\
  \ into 创建延续\n\n在使用 `select` 或 `group` 时，你有时想要生成一个临时结果，供查询的后续部分使用以产生最终结果。这被称为*查询**延续*（或简称为*延续*），它是通过在\
  \ `select` 或 `group` 子句中使用 `into` 实现的。\n\n`into *name query-body`\n\n其中 *name* 是迭代临时结果的范围变量名称，并被由\
  \ *query-body* 指定的延续查询使用。这就是为什么在与 `select` 或 `group` 使用时，`into` 被称为查询延续——它延续了查询。本质上，查询延续体现了构建一个查询前一个查询结果的新查询的概念。\n\
  \n\n\n\n还有一种 `into` 形式可以与 `join` 使用，它会创建一个 `group join`（组连接）。这将在本章稍后部分描述。\n\n这是一个使用\
  \ `into` 配合 `group` 的示例。以下程序重构了之前显示的 `GroupDemo` 示例，该示例创建了一个按顶级域名分组的网站列表。在这种情况下，初始结果通过一个名为\
  \ `ws` 的范围变量进行查询。然后对该结果进行过滤，移除所有元素少于三个的组。\n\n```\n// Use into with group.\n\nusing\
  \ System;\n\nusing System.Linq;\n\nclass IntoDemo {\n    static void Main() {\n\
  \        string[] websites = { \"hsNameA.com\", \"hsNameB.net\", \"hsNameC.net\"\
  ,\n        \"hsNameD.com\", \"hsNameE.org\", \"hsNameF.org\",\n        \"hsNameG.tv\"\
  , \"hsNameH.net\", \"hsNameI.tv\" };\n\n        // 创建一个查询，按顶级域名对网站分组，\n        //\
  \ 但只选择成员大于两个的组。\n        // 此处，ws 是执行查询前半部分时返回的组集合上的范围变量。\n        var webAddrs\
  \ = from addr in websites\n        where addr.LastIndexOf(\".\") != -1\n       \
  \ group addr by addr.Substring(addr.LastIndexOf(\".\"))\n        into ws\n     \
  \   // 将临时结果放入 ws。\n        where ws.Count() > 2\n        select ws;\n\n       \
  \ // 过滤 ws。\n        // 执行查询并显示结果。\n        Console.WriteLine(\"Top-level domains\
  \ with more than 2 members.\\n\");\n        foreach(var sites in webAddrs) {\n \
  \           Console.WriteLine(\"Contents of \" + sites.Key + \" domain:\");\n  \
  \          foreach(var site in sites)\n                Console.WriteLine(\" \" +\
  \ site);\n            Console.WriteLine();\n        }\n    }\n}\n```\n\n# 第 14 章：引入\
  \ LINQ\n\n### 523\n\n产生如下输出：\n\n```\nTop-level domains with more than 2 members.\n\
  Contents of .net domain:\nhsNameB.net\nhsNameC.net\nhsNameH.net\n```\n\n如输出所示，只返回了\
  \ `.net` 组，因为它是唯一包含超过两个元素的组。\n\n在程序中，请注意查询中的这一系列子句：`group addr by addr.Substring(addr.LastIndexOf(\"\
  .\", addr.Length)) into ws where ws.Count() > 2 select ws;`\n\n首先，`group` 子句的结果被存储起来（创建一个临时结果），并开始一个新的查询，该查询在存储的结果上操作。新查询的范围变量是\
  \ `ws`。此时，`ws` 将遍历由第一个查询返回的每个组。（它遍历组，是因为第一个查询产生的是一个组的序列。）接下来，`where` 子句对查询进行过滤，使得最终结果仅包含包含超过两个成员的组。这一判断通过调用\
  \ `Count()` 实现，`Count()` 是一个为所有 `IEnumerable<T>` 对象实现的扩展方法。它返回序列中的元素数量。（你将在本章稍后部分学习更多关于扩展方法的知识。）生成的组序列由\
  \ `select` 子句返回。\n\n### 使用 let 在查询中创建变量\n\n在查询中，你有时可能想要临时保留保留一个值。例如，你可能想创建一个本身可以被查询的枚举变量。或者，你可能想存储一个稍后在\
  \ `where` 子句中使用的值。无论目的是什么，这些类型的操作都可以通过使用 `let` 完成。\n\n`let` 子句具有如下通用形式：\n\n`let\
  \ name = expression`\n\n此处，`name` 是一个被赋值 `expression` 值的标识符。`name` 的类型根据 `expression`\
  \ 的类型推断。\n\n此示例展示了如何使用 `let` 创建另一个枚举数据源。该查询输入一个字符串数组。然后将这些字符串转换为 `char` 数组。这是通过使用另一个名为\
  \ `ToCharArray()` 的字符串方法实现的，它返回一个包含字符串中字符的数组。结果被赋值给名为 `chrArray` 的变量，然后由另一个 `from`\
  \ 子句获取数组中的单个字符。查询随后对字符进行排序并返回生成的序列。\n\n524\n\n```\n// Use a let clause and a nested\
  \ from clause.\n\nusing System;\n\nusing System.Linq;\n\nclass LetDemo {\n    static\
  \ void Main() {\n        string[] strs = { \"alpha\", \"beta\", \"gamma\" };\n \
  \       // 创建一个查询，获取字符串中的字符，\n        // 并按排序返回。注意嵌套 from\n        // 子句的使用。\n \
  \       var chrs = from str in strs\n        let chrArray = str.ToCharArray()\n\
  \        // chrArray 指向从 str 获取的字符数组。\n        from ch in chrArray\n        orderby\
  \ ch\n        select ch;\n        \n        Console.WriteLine(\"The individual characters\
  \ in sorted order:\");\n        // 执行查询并显示结果。\n        foreach(char c in chrs) Console.Write(c\
  \ + \" \");\n        Console.WriteLine();\n    }\n}\n```\n\n输出所示：\n\n```\nThe individual\
  \ characters in sorted order:\na a a a a b e g h l m m p t\n```\n\n在程序中，注意 `let`\
  \ 子句如何为 `chrArray` 分配 `str.ToCharArray()` 返回的数组的引用：\n\n`let chrArray = str.ToCharArray()`\n\
  \n在 `let` 子句之后，其他子句可以使用 `chrArray`。此外，由于 C# 中的所有数组都实现了 `IEnumerable<T>`，`chrArray`\
  \ 可以作为第二个嵌套 `from` 子句的数据源。这就是示例发生的情况。它使用嵌套的 `from` 来枚举数组中的单个字符，将它们排序为升序序列并返回结果。\n\
  \n你也可以使用 `let` 子句来持有非枚举值。例如，以下是编写前一节 `IntoDemo` 程序中查询的更高效的方法。\n\n`var webAddrs =\
  \ from addr in websites let idx = addr.LastIndexOf(\".\") // 只调用一次 LastIndexOf(),将结果存储在\
  \ idx 中。 where idx != -1`\n\n# 第 14 章：引入 LINQ\n\n### 525\n\n```\ngroup addr by addr.Substring(idx)\n\
  into ws\nwhere ws.Count() > 2\nselect ws;\n```\n\n在这个版本中，最后一个点出现处的索引被赋值给 `idx`。该值随后被\
  \ `Substring()` 使用。这防止了需要进行两次点的搜索。\n\n### 使用 join 合并两个序列\n\n在处理数据库时，通常想要创建一个关联了两个数据源数据的序列。例如，一个在线商店可能有一个数据库将项目名称与其项目编号关联，而另一个数据库将项目编号与其库存状态关联。给定这种情况，你可能想生成一个列表，按名称显示项目的库存状态，而不是按项目编号。你可以通过关联两个数据库中的数据来实现这一点。在\
  \ LINQ 中，通过使用 `join` 子句可以很容易完成这种操作。\n\n`join` 的通用形式所示（结合 `from` 子句的上下文）：`from range-varA\
  \ in data-sourceA join range-varB in data-sourceB on range-varA.property equals\
  \ range-varB.property`\n\n使用 `join` 的关键在于理解每个数据源必须包含共同数据，并且这些数据可以进行等值比较。因此，在通用形式中，`data-sourceA`\
  \ 和 `data-sourceB` 必须有可以比较的共同点。被比较的项目由 `on` 部分指定。因此，当 `range-varA.property` 等于 `range-varB.property`\
  \ 时，关联即成功。从本质上，`join` 像一个过滤器，只允许共享公共值的元素通过。\n\n使用 `join` 时，返回的序列通常是两个数据源部分的组合。因此，`join`\
  \ 允许你生成一个包含来自两个不同数据源元素的列表。这使你能够以新的方式组织数据。\n\n\n\n以下程序创建了一个名为 `Item` 的类，它将物品名称与其编号封装在一起。它创建了另一个名为\
  \ `InStockStatus` 的类，将项目编号与一个 `Boolean` 属性关联，该属性指示该物品是否有货。它还创建了一个名为 `Temp` 的类，它包含两个字段，一个\
  \ `string` 和一个 `bool`。该类的对象将持有查询的结果。该查询使用 `join` 生成一个列表，其中物品名称与其库存状态相关联。\n\n```csharp\n\
  // Demonstrate join.\n\nusing System;\n\nusing System.Linq;\n\n// 将项目名称与其编号关联的类。\n\
  \nclass Item {\n    public string Name { get; set; }\n    public int ItemNumber\
  \ { get; set; }\n\n    public Item(string n, int inum) {\n        Name = n;\n  \
  \      ItemNumber = inum;\n    }\n}\n\n// 将项目编号与其库存状态关联的类。\nclass InStockStatus\
  \ {\n    public int ItemNumber { get; set; }\n    public bool InStock { get; set;\
  \ }\n\n    public InStockStatus(int n, bool b) {\n        ItemNumber = n;\n    \
  \    InStock = b;\n    }\n}\n\n// 将名称与其状态封装的类。\nclass Temp {\n    public string\
  \ Name { get; set; }\n    public bool InStock { get; set; }\n\n    public Temp(string\
  \ n, bool b) {\n        Name = n;\n        InStock = b;\n    }\n}\n\nclass JoinDemo\
  \ {\n    static void Main() {\n        Item[] items = {\n            new Item(\"\
  Pliers\", 1424),\n            new Item(\"Hammer\", 7892),\n            new Item(\"\
  Wrench\", 8534),\n            new Item(\"Saw\", 6411)\n        };\n\n        InStockStatus[]\
  \ statusList = {\n            new InStockStatus(1424, true),\n            new InStockStatus(7892,\
  \ false),\n            new InStockStatus(8534, true),\n            new InStockStatus(6411,\
  \ true)\n        };\n\n        // 创建一个查询连接 Item 和 InStockStatus，\n        // 生成一个项目名称和可用性列表。注意\n\
  \        // 产生了一个 Temp 对象序列。\n        var inStockList = from item in items\n   \
  \                       join entry in statusList\n                          on item.ItemNumber\
  \ equals entry.ItemNumber\n                          select new Temp(item.Name,\
  \ entry.InStock);\n\n        Console.WriteLine(\"Item\\tAvailable\\n\");\n\n   \
  \     // 执行查询并显示结果。\n        foreach(Temp t in inStockList)\n            Console.WriteLine(\"\
  {0}\\t{1}\", t.Name, t.InStock);\n    }\n}\n```\n\n根据 `ItemNumber` 连接两个列表。\n\n输出所示：\n\
  \nItem Available\nPliers True\nHammer False\nWrench True\nSaw True\n```\n\n为了理解\
  \ `join` 是如何工作的，让我们逐 own 分析查询中的每一行。查询以通常方式从此 `from` 子句开始：\n\n```csharp\nvar inStockList\
  \ = from item in items\n```\n\n该子句指定 `item` 是 `items` 所指定数据源的范围变量。`items` 数组包含 `Item`\
  \ 类型的对象，这些对象封装了库存物品的名称和编号。\n\n接下来是 `join` 子句，所示：\n\n```csharp\njoin entry in statusList\n\
  on item.ItemNumber equals entry.ItemNumber\n```\n\n它指定 `entry` 是 `statusList` 数据源的范围变量。`statusList`\
  \ 数组包含 `InStockStatus` 类型的对象，这些对象将项目编号与其状态关联。因此，`items` 和 `statusList` 有一个共同的属性：项目编号。`join`\
  \ 子句的 `on`/`equals` 部分用于描述这种相关性。因此，`join` 会在两个数据源的项目编号相等时匹配这些项。\n\n最后，`select` 子句返回一个\
  \ `Temp` 对象，该对象包含项目名称及其库存状态：\n\n```csharp\nselect new Temp(item.Name, entry.InStock);\n\
  ```\n\n因此，查询获取的序列由 `Temp` 对象组成。\n\n尽管前面的示例相当直观，但 `join` 还支持更多复杂的操作。例如，你可以在 `join`\
  \ 中使用 `into` 来创建*组连接**group join*），它创建的结果由来自第一个序列的元素和来自第二个序列中所有匹配元素的组组成。（你将在本章稍后的部分看到相关的示例。）通常情况下，完全精通\
  \ `join` 所需的时间和精力是非常值得的，因为它让你具备运行时重新组织数据的能力。这是一项强大的能力。通过使用下一节描述的匿名类型，这种能力变得更加强大。\n\
  \n## 匿名类型和对象初始化\n\nC# 3.0 增加了一种名为*匿名类型**anonymous type*的新功能，它与 LINQ 直接相关。顾名思，匿名类型是没有名字的类。它的主要用途是创建由\
  \ `select` 子句返回的对象。通常，查询的结果是一个对象序列，它是两个（或多个）数据源的组合（如 `join` 的情况），或者包含一个数据源成员的子集。在任何情况下，返回的类型通常只是因为查询需要，而在程序的其他地方并不使用。在这种情况下，使用匿名类型消除了声明一个仅用于存储查询结果类的需要。\n\
  \n匿名类型通过使用以下通用形式创建：\n\n```csharp\nnew { nameA = valueA, nameB = valueB, ... }\n\
  ```\n\n在这里，名称指定了转换为只读属性的标识符，这些属性由值初始化。例如，\n\n```csharp\nnew { Count = 10, Max =\
  \ 100, Min = 0 }\n```\n\n这创建了一个具有三个公共只读属性的类类型：`Count`、`Max` 和 `Min`。它们分别被赋予值 10、100\
  \ 和 0。其他代码可以通过名称引用这些属性。这种语法被称为*对象初始化**object initialization*。它是 C# 3.0 的另一个新功能。它提供了一种在不显式调用构造函数的情况下初始化对象的方法。\n\
  \n这在匿名类型的情况下是必要的，因为没有方法可以显式调用构造函数。（记住，构造函数的名称与类相同。在匿名类的情况下，没有名称。那么，你如何调用构造函数呢？）由于匿名类型没有名称，你必须使用隐式类型变量来引用它。这让编译器推断正确的类型。例如，\n\
  \n```csharp\nvar myOb = new { Count = 10, Max = 100, Min = 0 };\n```\n\n这意味着以下语句是合法的：\n\
  \n```csharp\nConsole.WriteLine(\"Count is \" + myOb.Count);\nif(i <= myOb.Max &&\
  \ i >= myOb.Min)\n```\n\n虽然使用了*匿名类型*这个术语，但并不完全准确！该类型相对于你——程序员是匿名的。然而，编译器确实给了它一个内部名称。因此，匿名类型并没有违反\
  \ C# 的强类型检查规则。为了完全理解匿名类型的价值，请考虑对之前演示 `join` 程序的重写。记住，在之前的版本中，需要一个名为 `Temp` 的类来封装\
  \ `join` 的结果。通过使用匿名类型，这个“占位符”类不再需要，也不再弄乱程序的源代码。程序的输出与之前保持不变。\n\n```csharp\n// 使用匿名类型来改进\
  \ join 演示程序。\n\nusing System;\n\nusing System.Linq;\n\n// 将项目名称与其编号关联的类。\nclass\
  \ Item {\n    public string Name { get; set; }\n    public int ItemNumber { get;\
  \ set; }\n\n    public Item(string n, int inum) {\n        Name = n;\n        ItemNumber\
  \ = inum;\n    }\n}\n\n// 将项目编号与其库存状态关联的类。\nclass InStockStatus {\n    public int\
  \ ItemNumber { get; set; }\n    public bool InStock { get; set; }\n\n    public\
  \ InStockStatus(int n, bool b) {\n        ItemNumber = n;\n        InStock = b;\n\
  \    }\n}\n\nclass AnonTypeDemo {\n    static void Main() {\n        Item[] items\
  \ = {\n            new Item(\"Pliers\", 1424),\n            new Item(\"Hammer\"\
  , 7892),\n            new Item(\"Wrench\", 8534),\n            new Item(\"Saw\"\
  , 6411)\n        };\n\n        InStockStatus[] statusList = {\n            new InStockStatus(1424,\
  \ true),\n            new InStockStatus(7892, false),\n            new InStockStatus(8534,\
  \ true),\n            new InStockStatus(6411, true)\n        };\n\n        var inStockList\
  \ = from item in items\n                          join entry in statusList\n   \
  \                       on item.ItemNumber equals entry.ItemNumber\n           \
  \               select new { item.Name, entry.InStock };\n\n        Console.WriteLine(\"\
  Item\\tAvailable\\n\");\n\n        foreach(var t in inStockList) {\n           \
  \ Console.WriteLine(\"{0}\\t{1}\", t.Name, t.InStock);\n        }\n    }\n}\n```\n\
  \n\n\n\n\n# C# 3.0: 初学者指南\n\n```csharp\nInStockStatus[] statusList = {\n    new\
  \ InStockStatus(1424, true),\n    new InStockStatus(7892, false),\n    new InStockStatus(8534,\
  \ true),\n    new InStockStatus(6411, true)\n};\n\n// 创建一个连接 Item 和 InStockStatus\
  \ 的查询，\n// 以生成项目名称和可用性的列表。\n// 现在使用了匿名类型。\nvar inStockList = from item in items\n\
  join entry in statusList\non item.ItemNumber equals entry.ItemNumber\nselect new\
  \ { Name = item.Name,\n             InStock = entry.InStock };\n\nConsole.WriteLine(\"\
  Item\\tAvailable\\n\");\n\n// 返回一个匿名类型。\n// 执行查询并显示结果。\nforeach(var t in inStockList)\n\
  \    Console.WriteLine(\"{0}\\t{1}\", t.Name, t.InStock);\n```\n\n特别注意 `select`\
  \ 子句：\n\n```csharp\nselect new { Name = item.Name,             InStock = entry.InStock\
  \ };\n```\n\n它返回一个匿名类型的对象，该对象具有两个只读属性：`Name` 和 `InStock`。这些属性的值由项目的名称和可用性指定。由于使用了匿名类型，不再需要任何\
  \ `Temp` 类了。\n\n另外一点。注意 `foreach` 循环。它现在使用 `var` 来声明迭代变量。这是必要的，因为 `inStockList`\
  \ 中包含的对象的类型没有名称。这种情况是 C# 3.0 添加隐式类型变量的原因之一。这些变量是支持匿名类型所需要的。\n\n在继续之前，匿名类型还有一个方面值得提一下。\n\
  \n在某些情况下（包括刚才展示的例子），你可以通过使用*投影初始化器*（projection initializer）来简化匿名类型的语法。在这种情况下，你只需要指定初始化器的名称本身。该名称将自动成为属性的名称。例如，这里是上述程序中使用的\
  \ `select` 子句的另一种编码方式：`select new { item.Name, entry.InStock };`。\n\n在这里，属性名称仍然是\
  \ `Name` 和 `InStock`，和一样。编译器会自动“投影”标识符 `Name` 和 `InStock`，使它们成为匿名类型的属性名。此外，和之前一样，属性的值由\
  \ `item.Name` 和 `entry.InStock` 指定。\n\n## 第 14 章：引入 LINQ\n\n### 531\n\n### 专家问答\n\
  \n**问：匿名类型使用的对象初始化语法也可以用于命名类型吗？**\n\n**答：可以的！对象初始化语法也可以用于命名类型。例如，给定这样一个类：\n\n```csharp\n\
  class MyClass {\n    public int Alpha { get; set; }\n    public int Beta { get;\
  \ set; }\n}\n```\n\n以下声明是合法的：\n\n```csharp\nvar myOb = new MyClass { Alpha = 10,\
  \ Beta = 20 };\n```\n\n执行此语句后，行代码 `Console.WriteLine(\"Alpha: {0}, Beta {1}\", myOb.Alpha,\
  \ myOb.Beta);` 将显示 `Alpha: 10, Beta 20`。\n\n虽然对象初始化器可以命名类，但它们的主要用途是匿名类型。因此，通常情况下在处理命名类时，你应该显式地调用构造函数。\n\
  \n#### 创建分组连接（Group Join）\n\n正如前面提到的，你可以在 `join` 中使用 `into` 来创建一个*分组连接*（group join），它会创建一个序列，其中结果中的每个元素都由第一个序列中的一个元素和第二个序列中所有匹配元素的组组成。之前没有提供示例，是因为分组连接通常会使用匿名类型。现在已经介绍了匿名类型，就可以给出一个简单分组连接的示例了。\n\
  \n接下来的示例使用分组连接创建一个列表，其中各种交通工具（如汽车、船只和飞机）根据其通用运输类别（陆地、海洋或空中）进行组织。程序首先创建一个名为 `Transport`\
  \ 的类，将运输类型与其分类关联起来。在 `Main()` 中，它创建了两个输入序列。第一个包含通用旅行方式名称的字符串数组：陆地、海洋和空中。第二个是 `Transport`\
  \ 数组，封装了各种交通工具。然后它使用分组连接生成一个按类别组织的运输列表。\n\n```csharp\n// 演示简单的分组连接。\nusing System;\n\
  using System.Linq;\n\n// 此类将运输工具名称（如火车）\n// 与其通用分类（如陆地、海洋或空中）关联起来。\nclass Transport\
  \ {\n    public string Name { get; set; }\n    public string How { get; set; }\n\
  \    public Transport(string n, string h) {\n        Name = n;\n        How = h;\n\
  \    }\n}\n\nclass GroupJoinDemo {\n    static void Main() {\n        // 运输分类的数组。\n\
  \        string[] travelTypes = {\n            \"Air\",\n            \"Sea\",\n\
  \            \"Land\",\n        };\n        // 运输工具数组。\n        Transport[] transports\
  \ = {\n            new Transport(\"Bicycle\", \"Land\"),\n            new Transport(\"\
  Balloon\", \"Air\"),\n            new Transport(\"Boat\", \"Sea\"),\n          \
  \  new Transport(\"Jet\", \"Air\"),\n            new Transport(\"Canoe\", \"Sea\"\
  ),\n            new Transport(\"Biplane\", \"Air\"),\n            new Transport(\"\
  Car\", \"Land\"),\n            new Transport(\"Cargo Ship\", \"Sea\"),\n       \
  \     new Transport(\"Train\", \"Land\")\n        };\n\n        // 创建一个使用分组连接的查询，\n\
  \        // 按类别生成项目名称和 ID。\n        var byHow = from how in travelTypes\n      \
  \               join trans in transports\n                     on how equals trans.How\n\
  \                     into lst\n                     select new { How = how, Tlist\
  \ = lst };\n\n        // 执行查询并显示结果。\n        foreach(var t in byHow) {\n       \
  \     Console.WriteLine(\"{0} transportation includes:\", t.How);\n            foreach(var\
  \ m in t.Tlist) {\n                Console.WriteLine(\" \" + m.Name);\n        \
  \    }\n            Console.WriteLine();\n        }\n    }\n}\n```\n\n程序的关键部分当然是查询，在这里所示：\n\
  \n```csharp\nvar byHow = from how in travelTypes\n             join trans in transports\n\
  \             on how equals trans.How\n             into lst\n             select\
  \ new { How = how, Tlist = lst };\n```\n\n这是它的工作原理。`from` 语句使用 `how` 遍历 `travelTypes`\
  \ 数组。记得 `travelTypes` 包含一个通用分类数组：空中、海洋和陆地。`join` 子句将每种旅行类型与使用该类型的运输工具连接。然而，由于 `into`\
  \ 子句，对于每种旅行类型，`join` 会产生一个使用该类型的运输工具列表。该列表由 `lst` 表示。最后，`select` 返回一个匿名类型，它将每个 `how`\
  \ 值（旅行类型）与运输工具列表封装在一起。这就是为什么需要两个 `foreach` 循环来显示查询结果。外层循环获取一个包含旅行类型名称和运输工具列表的对象。内层循环显示单独的运输工具。\n\
  \n534\nC# 3.0: 初学者指南\n\n分组连接涉及许多选项和细微差别。事实上，分组连接是最复杂的查询技术之一，它是你将想要深入探索的特性之一。最好的方法之一是使用简单示例进行实验，确保你彻底理解了每一步发生的情况。\n\
  \n#### 查询方法和 Lambda 表达式\n\n在前几节描述的查询语法可能是你在 C# 中编写大多数查询的方式。它方便、强大且紧凑。然而，这并不是编写查询的唯一方法。另一种方法是使用*查询方法*（query\
  \ methods）。这些方法可以在任何可枚举对象（如数组）上调用。许多查询方法需要另一个新的 C# 3.0 特性：Lambda 表达式。由于查询方法和 Lambda\
  \ 表达式交织在一起，因此在这里对两者进行介绍。\n\n基础查询方法\n\n\n\n\n[content]\n\n查询方法由 `System.Linq.Enumerable`\
  \ 定义，并以扩展方法的形式实现，扩展了 `IEnumerable<T>` 的功能。（查询方法也由 `System.Linq.Queryable` 定义，它扩展了\
  \ `IQueryable<T>` 的功能，但该接口在本章中未使用。）扩展方法可以在不使用继承的情况下为另一个类添加功能。C# 3.0 增加了对扩展方法的支持，我们将在本章的稍后部分详细介绍它们。目前，只需理解查询方法只能在实现了\
  \ `IEnumerable<T>` 的对象上调用即可。\n\n`Enumerable` 类提供了许多查询方法，但核心是那些与之前描述的查询关键字对应的方法。这里展示了这些方法以及与它们相关的关键字。请注意，这些方法具有重载形式，这里显示了最简单的形式。不过，这通常是你会使用的形式。\n\
  \n| 查询关键字 | 等效查询方法 |\n| :--- | :--- |\n| select | `Select(*arg*)` |\n| where | `Where(*arg*)`\
  \ |\n| order | `OrderBy(*arg*)` 或 `OrderByDescending(*arg*)` |\n| join | `Join(*seq2*,\
  \ *key1*, *key2*, *result*)` |\n| group | `GroupBy(*arg*)` |\n\n除了 `Join()` 之外，其他方法都接受一个参数\
  \ `arg`，其类型为 `Func<T, TResult>`。这是一个由 LINQ 定义的委托类型。其声明如下：\n\n```csharp\ndelegate\
  \ TResult Func<T, TResult>(T *arg*)\n```\n\n在这里，`TResult` 指定委托的结果，`T` 指定参数类型。在查询方法中，`arg`\
  \ 决定了查询方法执行的操作。例如，在 `Where()` 方法中，`arg` 决定了查询如何过滤数据。这些查询方法每个返回一个可枚举对象。因此，一个方法的结果可以用于执行另一个方法的调用，从而允许方法链式组合。\n\
  \n`Join()` 方法接受四个参数。第一个是第二个待连接序列的引用。第一个序列是调用 `Join()` 的序列。第一个序列的键选择器通过 `key1` 传递，第二个序列的键选择器通过\
  \ `key2` 传递。\n\n连接的结果由 `result` 描述。`key1` 的类型为 `Func<TOuter, TKey>`，`key2` 的类型为\
  \ `Func<TInner, TKey>`。`result` 参数的类型为 `Func<TOuter, TInner, TResult>`。在这里，`TOuter`\
  \ 是调用序列的元素类型，`TInner` 是传递序列的元素类型，而 `TResult` 是结果元素的类型。返回的是一个包含连接结果的可枚举对象。\n\n在查看任何使用查询方法的示例之前，你需要了解\
  \ Lambda 表达式。\n\n## Lambda 表达式 (Lambda Expressions)\n\n尽管诸如 `Where()` 等查询方法的参数必须是\
  \ `Func<T, TResult>` 类型，但它并不非是一个显式声明的方法。事实上，大多数情况下它不是。相反，你通常会使用 *lambda 表达式*。Lambda\
  \ 表达式是 C# 3.0 提供的一种新语法特性。它提供了一种简洁且强大的方式来定义本质上是匿名的方法。C# 编译器会自动将 lambda 表达式转换为可以传递给\
  \ `Func<T, TResult>` 参数的形式。\n\n尽管我们将在本节稍后部分详细检查 lambda 表达式，但这里有一个通用的概述。所有的 lambda\
  \ 表达式都使用新的 *lambda 运算符*，即 `=>`。\n\n该运算符将 lambda 表达式分为两部分。左侧指定输入参数（或多个参数）。右侧是两个内容之一：表达式或语句块。如果右侧是表达式，则正在创建一个\
  \ *表达式 lambda* (expression lambda)。如果右侧是一个语句块，则它是一个 *语句 lambda* (statement lambda)。出于本节的考虑，我们将只使用表达式\
  \ lambda。\n\n在表达式 lambda 中，`=>` 右侧的表达式作用于左侧指定的参数（或多个参数）。表达式的结果就变成了 lambda 运算符的结果。以下是仅接受一个参数的\
  \ lambda 表达式的通用形式：\n\n```text\nparam => expr\n```\n\n当需要一个以上或多个参数时，则使用以下形式：\n\n\
  ```text\n(param-list) => expr\n```\n\n因此，当需要两个或多个参数时，必须用括号括起来。如果没有参数，则必须使用空括号。\n\
  \n这里是一个简单的 lambda 表达式：\n\n```text\nn => n > 0\n```\n\n对于任何 `n`，此表达式都会确定 `n` 是否大于零并返回结果。这是另一个例子：\n\
  \n```text\ncount => count + 2\n```\n\n在这种情况下，结果是 `count` 的值加二。\n\n## 使用查询方法创建查询\
  \ (Create Queries by Using the Query Methods)\n\n结合 lambda 表达式使用查询方法，可以创建不使用 C#\
  \ 查询语法的查询。相反，是调用查询方法。让我们从一个简单的示例开始。它重构了本章中的第一个程序，使其使用 `Where()` 和 `Select()` 的调用而不是查询关键字。\n\
  \n```csharp\n// 使用查询方法创建一个简单的查询。\n// 这是本章中第一个程序的重构版本。\nusing System;\nusing System.Linq;\n\
  \nclass SimpQuery {\n    static void Main() {\n        int[] nums = { 1, -2, 3,\
  \ 0, -4, 5 };\n        // 使用 Where() 和 Select() 创建一个简单的查询。\n        var posNums\
  \ = nums.Where(n => n > 0).Select(r => r);\n        Console.WriteLine(\"The positive\
  \ values in nums:\");\n        // 执行查询并显示结果。\n        foreach(int i in posNums)\
  \ Console.WriteLine(i);\n    }\n}\n```\n\n输出（如下所示）与原始版本相同：\n\n```\nThe positive\
  \ values in nums:\n1\n3\n5\n```\n\n在程序中，请特别注意这一行：\n\n`var posNums = nums.Where(n\
  \ => n > 0).Select(r => r);`\n\n这创建了一个名为 `posNums` 的查询，它创建一个 `nums` 中正值的序列。这是通过使用\
  \ `Where()` 方法过滤值并使用 `Select()` 选择值来实现的。可以在 `nums` 上调用 `Where()` 方法是因为所有数组都实现了 `IEnumerable<T>`，它支持查询方法。\n\
  \n## 第 14 章：引入 LINQ (Chapter 14: Introducing LINQ)\n\n从技术上讲，上示例中的 `Select()` 方法并不是必要的，因为在这种简单的情况下，`Where()`\
  \ 返回的序列已经包含了结果。然而，你可以使用复杂的选择标准，就像你以前使用查询语法那样。例如，此查询返回增加了一个数量级的 `nums` 正值：`var posNums\
  \ = nums.Where(n => n > 0).Select(r => r * 10);`\n\n正如你预期的，你可以链接其他操作。例如，此查询选择正值，将其按降序排序，并返回结果序列：`var\
  \ posNums = nums.Where(n => n > 0).OrderByDescending(j => j);`\n\n在这里，表达式 `j =>\
  \ j` 指定排序取决于输入参数，该参数是来自 `Where()` 序列的元素。\n\n这是一个演示 `GroupBy()` 方法的示例。它重构了之前的 `group`\
  \ 示例。\n\n```csharp\n// 展示 GroupBy() 查询方法。\n// 此程序重构了之前使用查询语法的版本。\nusing System;\n\
  using System.Linq;\n\nclass GroupByDemo {\n    static void Main() {\n        string[]\
  \ websites = { \"hsNameA.com\", \"hsNameB.net\", \"hsNameC.net\",\n            \
  \                  \"hsNameD.com\", \"hsNameE.org\", \"hsNameF.org\",\n        \
  \                      \"hsNameG.tv\", \"hsNameH.net\", \"hsNameI.tv\" };\n    \
  \    // 使用查询方法按顶级域名对网站分组。\n        var webAddrs = websites.Where(w => w.LastIndexOf(\"\
  .\") != 1).\n                              GroupBy(x => x.Substring(x.LastIndexOf(\"\
  .\", x.Length)));\n        // 执行查询并显示结果。\n        foreach(var sites in webAddrs)\
  \ {\n            // ... 实现 ...\n        }\n    }\n}\n```\n\n\n\n\n```csharp\nConsole.WriteLine(\"\
  Websites grouped by \" + sites.Key);\n\nforeach(var site in sites)\n    Console.WriteLine(\"\
  \ \" + site);\n\nConsole.WriteLine();\n\n}\n}\n```\n\n此版本产生的输出与之前相同。唯一的区别在于查询创建的方式。在这个版本中，使用了查询方法。\n\
  \n538\n\nC# 3.0：初学者指南\n\n这是另一个示例。回想之前展示的 `JoinDemo` 示例中使用的 `join` 查询：\n\n```csharp\n\
  var inStockList = from item in items\njoin entry in statusList\non item.ItemNumber\
  \ equals entry.ItemNumber\nselect new Temp(item.Name, entry.InStock);\n```\n\n该查询生成了一个序列，该序列包含封装了库存物品的名称和库存状态的对象。这些信息是通过连接两个名为\
  \ `items` 和 `statusList` 的列表而得的。以下版本重构了此查询，使其使用 `Join()` 方法而不是 C# 查询语法：\n\n```csharp\n\
  // 使用 Join() 生成一个包含项目名称和状态的列表。\nvar inStockList = items.Join(statusList,\n    k1\
  \ => k1.ItemNumber,\n    k2 => k2.ItemNumber,\n    (k1, k2) => new Temp(k1.Name,\
  \ k2.InStock) );\n```\n\n虽然此版本使用了名为 `Temp` 的命名类来持有结果对象，但可以使用匿名类型代替。这种方法如下所示：\n\n\
  ```csharp\nvar inStockList = items.Join(statusList,\n    k1 => k1.ItemNumber,\n\
  \    k2 => k2.ItemNumber,\n    (k1, k2) => new { k1.Name, k2.InStock} );\n```\n\n\
  ### 专家问答\n\n**Q：我在 lambda 表达式的上下遇到过表达式树（expression tree）这个术语。它是什么？**\n\n**答：** 表达式树是将\
  \ lambda 表达式表示为数据。因此，表达式树本身无法被执行。但是，它可以被转换为可执行的形式。\n\n表达式树由 `System.Linq.Expressions.Expression<T>`\
  \ 类封装。\n\n在查询将由程序外部执行的情况下（例如使用 SQL 的数据库），表达式树非常有用处。通过将查询表示为数据，可以将查询转换为数据库能理解的格式。这个过程被\
  \ Visual C 提供的 LINQ-to-SQL 功能使用。因此，表达式树帮助 C# 支持多种数据源。\n\n你可以通过调用 `Expression` 定义的\
  \ `Compile()` 方法获取表达式树的可执行形式。它返回一个可以分配给委托并随后执行的引用。表达式树有一个关键限制：只有表达式 lambda 才能被表达式树表示。它们不能用于表示语句\
  \ lambda。\n\n虽然我们在本章中不会显式地使用表达式树，但你可能会发现它们非常有趣。\n\n## 第 14 章：引入 LINQ\n\n### 539\
  \ 更多与查询相关的扩展方法\n\n除了对应查询关键字的方法外，`Enumerable` 还为 `IEnumerable<T>` 定义了其他几个与查询相关的方法。以下是几个常用方法的示例。由于许多方法都是重载的，因此只显示它们的通用形式。\n\
  \n| 方法 | 说明 |\n| :--- | :--- |\n| `All(condition)` | 如果序列中的所有元素都满足指定条件，则返回 true。\
  \ |\n| `Any(condition)` | 如果序列中的任何元素满足指定条件，则返回 true。 |\n| `Average()` | 返回数值序列中值的平均值。\
  \ |\n| `Contains(obj)` | 如果序列包含指定对象，则返回 true。 |\n| `Count()` | 返回序列的长度。这是它包含的元素数量。\
  \ |\n| `First()` | 返回序列中的第一个元素。 |\n| `Last()` | 返回序列中的最后一个元素。 |\n| `Max()` | 返回序列中的最大值。\
  \ |\n| `Min()` | 返回序列中的最小值。 |\n| `Sum()` | 返回数值序列中值的总和。 |\n\n你已经在本章较早部分见过 `Count()`\
  \ 的作用。这里是一个演示其他其他方法的程序：\n\n```csharp\n// 使用 Enumerable 定义的几个扩展方法。\nusing System;\n\
  using System.Linq;\n\nclass ExtMethods {\n    static void Main() {\n        int[]\
  \ nums = { 3, 1, 2, 5, 4 };\n        Console.WriteLine(\"The minimum value is \"\
  \ + nums.Min());\n        Console.WriteLine(\"The maximum value is \" + nums.Max());\n\
  \        Console.WriteLine(\"The first value is \" + nums.First());\n        Console.WriteLine(\"\
  The last value is \" + nums.Last());\n        Console.WriteLine(\"The sum is \"\
  \ + nums.Sum());\n        Console.WriteLine(\"The average is \" + nums.Average());\n\
  \        if(nums.All(n => n > 0))\n            Console.WriteLine(\"All values are\
  \ greater than zero.\");\n        if(nums.Any(n => (n % 2) == 0))\n            Console.WriteLine(\"\
  At least one value is even.\");\n\n        if(nums.Contains(3))\n            Console.WriteLine(\"\
  The array contains 3.\");\n    }\n}\n```\n\n输出在此所示：\n```\nThe minimum value is 1\n\
  The maximum value is 5\nThe first value is 3\nThe last value is 4\nThe sum is 15\n\
  The average is 3\nAll values are greater than zero.\nAt least one value is even.\n\
  The array contains 3.\n```\n\n你也可以在基于 C# 查询语法的查询中使用这些扩展方法。例如，此程序使用 `Average()` 获取一个序列，该序列仅包含小于数组中平均值的值。\n\
  \n```csharp\n// 在查询语法中使用 Average()。\nusing System;\nusing System.Linq;\n\nclass\
  \ ExtMethods2 {\n    static void Main() {\n        int[] nums = { 1, 2, 4, 8, 6,\
  \ 9, 10, 3, 6, 7 };\n        var ltAvg = from n in nums\n                    let\
  \ x = nums.Average() // 在查询语法中使用查询方法。\n                    where n < x\n       \
  \             select n;\n\n        Console.WriteLine(\"The average is \" + nums.Average());\n\
  \        Console.WriteLine(\"These values are less than the average:\");\n     \
  \   // 执行查询并显示结果。\n        foreach(int i in ltAvg) Console.WriteLine(i);\n    }\n\
  }\n```\n\n540\nC# 3.0：初学者指南\n\n## 14 章：引入 LINQ\n\n### 541\n\n输出在此所示：\n```\nThe average\
  \ is 5.6\nThese values are less than the average:\n1\n4\n3\n```\n\n#### 延迟执行与 立即执行\n\
  \n在继续之前，还需要介绍一个概念。在 LINQ 中，查询有两种执行模式：立即执行和延迟执行。通常情况下，查询定义了一组规则，直到 `foreach` 语句执行时才会执行。这被称为*延迟执行*。\n\
  \n然而，如果你使用产生序列结果的扩展方法，那么查询必须执行以获取该结果。例如，考虑 `Count()` 方法。为了让 `Count()` 返回序列中的数量，必须执行查询，并且在调用\
  \ `Count()` 时自动完成。在这种情况下，发生了*立即执行*。因此，即使你没有显式地在 `foreach` 循环中使用查询，查询仍然执行。\n\n这是一个简单的示例。它获取序列中正元素的数量。\n\
  \n```csharp\n// 使用立即执行。\nusing System;\nusing System.Linq;\n\nclass ImmediateExec\
  \ {\n    static void Main() {\n        int[] nums = { 1, -2, 3, 0, -4, 5 };\n  \
  \      // 创建一个获取 nums 中正值数量的查询。\n        int len = (from n in nums\n           \
  \        where n > 0 // 此查询立即执行，\n                   返回计数。\n                   select\
  \ n).Count();\n\n        Console.WriteLine(\"The number of positive values in nums:\
  \ \" + len);\n    }\n}\n```\n\n输出在此所示：\n```\nThe number of positive values in nums:\
  \ 3\n```\n\n在程序中，注意没有指定显式的 `foreach` 循环。相反，查询由于调用了 `Count()` 而自动执行。\n\n542\n\n有趣一点，前一个程序中的查询也可以这样写：\n\
  \n```csharp\nvar posNums = from n in nums\n              where n > 0\n         \
  \     select n;\n\nint len = posNums.Count(); // 查询在此执行\n```\n\n在这种情况下，`Count()`\
  \ 在查询变量上被调用。在此时，查询被执行以获取计数。\n\n### 专家问答\n\n**Q：为什么 C# 有两种创建查询的方法，查询语法和查询方法？**\n\n\
  \n\n\n\n# A: 实际上，除了涉及的语法之外，它只有一种方式。为什么呢？因为查询语法被编译为对查询方法的调用！因此，当你编写类似 `where x <\
  \ 10` 的代码时：\n\n编译器将其翻译为\n\n```\nWhere(x => x < 10)\n```\n\n因此，创建查询的两种方法最终通向了同一个结果。\n\
  \n这引出了第二个问题：在 C# 程序中应该使用哪种方法？\n\n通常情况下，你会想要使用查询语法。它更简洁，并且完全集成在 C# 语言中。\n\n## 深入理解扩展方法\n\
  \n扩展方法提供了一种机制，可以在不使用普通继承机制的情况下为类添加功能。虽然你不会经常创建自己的扩展方法（因为在许多情况下，继承机制提供了更好的解决方案），但由于扩展方法对\
  \ LINQ 至关重要，理解它们是如何工作的的仍然非常重要。\n\n扩展方法是一个静态方法，必须包含在静态非泛型类中。它的第一个参数的类型决定了可以调用该扩展方法的对象的类型。此外，第一个参数必须由\
  \ `this` 修饰。调用方法的对象会自动传递给第一个参数，而不会显式地在参数列表中传递。一个关键点是，尽管扩展方法被声明为 `static`，但它仍然可以在对象上被调用，就像它是实例方法一样。\n\
  \n## 第 14 章：引入 LINQ\n\n### 543\n\n这里是扩展方法的通用形式：\n\n`static *ret-type* *name*(this\
  \ *invoked-on-type* *ob*, *param-list*)` 当然，如果除了隐式传递给 `ob` 的参数外没有其他参数，那么 `param-list`\
  \ 将为空。记住，第一个参数会自动接收调用方法的对象。通常，扩展方法将是其所在类的公共成员。\n\n这里有一个创建三个简单扩展方法的示例：\n\n```csharp\n\
  // 创建并使用一些扩展方法。\nusing System;\n\nstatic class MyExtMeths {\n    // 返回 double 类型的倒数。\n\
  \    public static double Reciprocal(this double v) {\n        return 1.0 / v;\n\
  \    }\n\n    // 反转字符串内字母的大小写并\n    // 返回结果。\n    public static string RevCase(this\
  \ string str) {\n        string temp = \"\";\n        foreach(char ch in str) {\n\
  \            if(Char.IsLower(ch)) temp += Char.ToUpper(ch);\n            else temp\
  \ += Char.ToLower(ch);\n        }\n        return temp;\n    }\n\n    // 返回 n /\
  \ d 的绝对值。\n    public static double AbsDivideBy(this double n, double d) {\n   \
  \     return Math.Abs(n / d);\n    }\n}\n\n// 扩展方法。注意 this 的使用。\nclass ExtDemo {\n\
  \    static void Main() {\n        double val = 8.0;\n        string str = \"Alpha\
  \ Beta Gamma\";\n        // 调用 Reciprocal() 扩展方法。\n        Console.WriteLine(\"\
  Reciprocal of {0} is {1}\", val, val.Reciprocal());\n\n        // 调用 RevCase() 扩展方法。\n\
  \        Console.WriteLine(str + \" after reversing case is \" + str.RevCase());\n\
  \n        // 使用 AbsDivideBy();\n        Console.WriteLine(\"Result of val.AbsDivideBy(-2):\
  \ \" + val.AbsDivideBy(-2));\n    }\n}\n```\n\n输出显示如下：\n\nReciprocal of 8 is 0.125\n\
  Alpha Beta Gamma after reversing case is aLPHA bETA gAMMA\nResult of val.AbsDivideBy(-2):\
  \ 4\n\n在程序中，注意每个扩展方法都包含在一个名为 `MyExtMeths` 的静态类中。正如所解释的，扩展方法必须声明在静态类内部。\n\n此外，该类必须在作用域内，其包含的扩展方法才能被使用。（这就是为什么在在使用\
  \ LINQ 时需要包含 `System.Linq` 命名空间。）接下来，注意对扩展方法的调用。它们以与实例方法相同的方式在对象上调用。主要的区别在于，调用对象被传递给扩展方法的第一个参数。因此，当表达式\
  \ `val.AbsDivideBy(-2)` 执行时，`val` 被传递给 `AbsDivideBy()` 的 `n` 参数，而 `-2` 被传递给 `d`\
  \ 参数。\n\n有趣的一点是，由于 `Reciprocal()` 和 `AbsDivideBy()` 方法是针对 `double` 定义的，因此在 `double`\
  \ 字面量上调用它们是合法的，所示：`8.0.Reciprocal()`\n\n`8.0.AbsDivideBy(-1)`\n\n此外，`RevCase()`\
  \ 可以这样调用：\n\n`\"AbCDe\".RevCase()`\n\n在这里，返回的是字符串字面量的反转大小写版本。\n\n## 深入理解 Lambda\
  \ 表达式\n\n虽然 Lambda 表达式的主要用途是配合 LINQ，但它是可以用于 C# 其他方面的特性。这是因为 Lambda 表达式创建了另一种类型的匿名函数（另一种匿名函数是书中早些描述的匿名方法）。因此，Lambda\
  \ 表达式可以赋值给（或传递给）委托。由于 Lambda 表达式通常比等效的匿名方法更精简，Lambda 表达式现在是大多数情况下的推荐方法。\n\n正如前面提到的，C#\
  \ 支持两种类型的 Lambda 表达式。第一种被称为*表达式 lambda*（expression lambda），这是你到目前为止一直在使用的 Lambda\
  \ 表达式类型。表达式 lambda 的主体是独立的——也就是说它没有被括号包含。第二种是*语句 lambda*（statement lambda）。在语句 lambda\
  \ 中，主体由括号包含。\n\n## 第 14 章：引入 LINQ\n\n### 545\n\n表达式 Lambda\n\n使用委托 Lambda 需要两个步骤。首先，你必须声明委托类型。其次，当你声明委托实例时，将\
  \ Lambda 表达式赋值给它。完成后，可以通过调用委托实例来执行 Lambda 表达式。\n\n以下示例说明了使用委托使用表达式 lambda。它声明了两个委托类型。然后将\
  \ Lambda 表达式分配给委托实例。最后通过委托执行 Lambda。\n\n```csharp\n// 演示表达式 lambda。\nusing System;\n\
  \n// Transform 委托接收一个 double 参数\n// 返回一个 double 值。\ndelegate double Transform(double\
  \ v);\n\n// TestInts 委托接收两个 int 参数\n// 返回一个 bool 结果。\ndelegate bool TestInts(int\
  \ w, int v);\n\nclass ExpressionLambdaDemo {\n    static void Main() {\n       \
  \ // 创建一个返回值倒数的 Lambda 表达式。\n        // 将表达式赋值给委托。\n        Transform reciprocal\
  \ = n => 1.0 / n;\n        Console.WriteLine(\"The reciprocal of 4 is \" + reciprocal(4.0));\n\
  \        Console.WriteLine(\"The reciprocal of 10 is \" + reciprocal(10.0));\n\n\
  \        // 创建一个判断一个整数是否为另一个整数\n        // 因数的 Lambda 表达式。\n        // 将表达式赋值给委托。\n\
  \        TestInts isFactor = (n, d) => n % d == 0;\n        Console.WriteLine(\"\
  Is 3 a factor of 9? \" + isFactor(9, 3));\n        Console.WriteLine(\"Is 3 a factor\
  \ of 10? \" + isFactor(10, 3));\n    }\n}\n```\n\n\n\n\n第一个语句为 `reciprocal` 赋值了一个\
  \ lambda 表达式，该表达式返回所传入数值的倒数。此表达式可以赋值给 `Transform` 委托，因为它与 `Transform` 的声明兼容。调用 `reciprocal`\
  \ 时使用的参数被传递给 `n`。返回的值是表达式 `1.0 / n` 的结果。\n\n第二个语句为 `isFactor` 赋值了一个表达式，如果第二个参数是第一个参数的因子，则该表达式返回真。此\
  \ lambda 接受两个参数，如果第一个参数可以被第二个参数整除，它就返回真。因此，它与 `TestInts` 的声明兼容。调用 `isFactor()` 时传递的两个参数会自动按顺序传递给\
  \ `n` 和 `d`。另一点：参数 `n` 和 `d` 外围的括号是必须的。只有当使用一个参数时，括号才是可选的。\n\n# 语句 lambda (Statement\
  \ Lambdas)\n\n语句型 lambda 扩展了可以直接在 lambda 表达式中处理的操作类型。例如，使用语句 lambda，你可以使用循环、`if`\
  \ 语句、声明变量等。语句型 lambda 很容易创建。只需将 lambda 表达式的主体括在大括号内即可。\n\n这里是一个使用语句 lambda 计算并返回\
  \ `int` 值阶乘的示例：\n\n```cs\n// 演示一个语句 lambda。\n\nusing System;\n\n// IntOp 接受一个 int\
  \ 参数并返回一个 int 结果。\ndelegate int IntOp(int end);\n\nclass StatementLambdaDemo {\n\
  \    static void Main() {\n        // 一个返回传入值\n        // 阶乘的语句 lambda。\n      \
  \  IntOp fact = n => {\n            int r = 1;\n            for(int i=1; i <= n;\
  \ i++)\n                // 这是一个语句 lambda。\n                r = i * r;\n        \
  \    return r;\n        };\n        Console.WriteLine(\"The factorial of 3 is \"\
  \ + fact(3));\n        Console.WriteLine(\"The factorial of 5 is \" + fact(5));\n\
  \    }\n}\n```\n\n输出所示：\n```\nThe factorial of 3 is 6\nThe factorial of 5 is 120\n\
  ```\n\n在程序中，注意该语句 lambda 声明了一个名为 `r` 的变量，使用了 `for` 循环，并且有一个 `return` 语句。这些在语句 lambda\
  \ 内部都是合法的。本质上，语句 lambda 与匿名方法相似。因此，在更新遗留代码时，许多匿名方法将转换为语句 lambda。另一点：当 lambda 表达式内部出现\
  \ `return` 语句时，它仅仅会导致 lambda 返回，而不会导致包含它的方法返回。\n\n# 尝试一下：使用 Lambda 表达式实现事件处理器\n\n\
  由于 lambda 表达式可以赋值给委托，因此它们也可以用作事件处理器。在这种情况下，在许多情况下，lambda 表达式可以替代匿名方法。这里开发的示例说明了如何同时使用表达式\
  \ lambda 和语句 lambda 作为事件处理程序。\n\n### 逐步步骤\n\n1. 创建一个名为 `MyEventHandler` 的事件委托和一个名为\
  \ `MyEvent` 的事件类，如下：\n\n```cs\n// 为事件声明委托类型。\ndelegate void MyEventHandler();\n\n\
  // 声明一个带有事件的类。\nclass MyEvent {\n    public event MyEventHandler SomeEvent;\n  \
  \  // 调用此方法来触发事件。\n    public void Fire() {\n        if(SomeEvent != null)\n   \
  \         SomeEvent();\n    }\n}\n```\n\n2. 开始创建一个名为 `LambdaEventHandlers` 的类，该类将生成并处理事件，如下：\n\
  \n```cs\nclass LambdaEventHandlers {\n    static void Main() {\n        MyEvent\
  \ evt = new MyEvent();\n        int count = 0;\n```\n\n注意 `Main()` 创建了一个由 `evt`\
  \ 引用的事件，并将 `count` 声明为初始化为零的整数变量。\n\n3. 为 `evt` 的事件链添加一个递增 `count` 的事件处理器，如下：\n\n\
  ```cs\n// 此表达式 lambda 在事件发生时\n// 递增 count 的值。\nevt.SomeEvent += () => count++;\n\
  ```\n\n这使用了表达式 lambda 作为事件处理器。注意它可以使用外部变量 `count`。适用于匿名方法的关于外部变量使用的规则（在第 12 节描述）也适用于\
  \ lambda 表达式。\n\n4. 为 `evt` 添加一个显示 `count` 值的事件处理器，接下所示：\n\n```cs\n// 此语句 lambda\
  \ 显示 count 的值。\n// 如果 count 大于 3，则将其重置为 0。\nevt.SomeEvent += () => {\n    if(count\
  \ > 3) count = 0;\n    Console.WriteLine(\"Count is \" + count);\n};\n```\n\n这使用了语句\
  \ lambda 显示 `count` 的当前值。在在此之前，它测试了 `count` 的值。如果它大于 3，则重置为 0。\n\n5. 通过调用五次事件完成\
  \ `LambdaEventHandlers`：\n\n```cs\n// 触发五次事件。\nevt.Fire();\nevt.Fire();\nevt.Fire();\n\
  evt.Fire();\nevt.Fire();\n```\n\n6. 这里是整个示例：\n\n```cs\n// 使用 lambda 表达式作为事件处理器。\n\
  using System;\n\n// 为事件声明委托类型。\ndelegate void MyEventHandler();\n\n// 声明一个带有事件的类。\n\
  class MyEvent {\n    public event MyEventHandler SomeEvent;\n    // 调用此方法来触发事件。\n\
  \    public void Fire() {\n        if(SomeEvent != null)\n            SomeEvent();\n\
  \    }\n}\n\nclass LambdaEventHandlers {\n    static void Main() {\n        MyEvent\
  \ evt = new MyEvent();\n        int count = 0;\n        // 使用 lambda 表达式定义事件处理器。\n\
  \        // 此表达式 lambda 在事件发生时\n        // 递增 count 的值。\n        evt.SomeEvent +=\
  \ () => count++;\n        // 此语句 lambda 显示 count 的值。\n        // 如果 count 大于 3，则将其重置为\
  \ 0。\n        evt.SomeEvent += () => {\n            if(count > 3) count = 0;\n \
  \           Console.WriteLine(\"Count is \" + count);\n        };\n\n        //\
  \ 触发五次事件。\n        evt.Fire();\n        evt.Fire();\n        evt.Fire();\n     \
  \   evt.Fire();\n        evt.Fire();\n    }\n}\n```\n\n输出所示：\n```\nCount is 1\n\
  Count is 2\nCount is 3\nCount is 0\nCount is 1\n```\n\n### 专家问答\n\n**Q：好的，我被服了！LINQ\
  \ 极其强大。学习更多关于它的最好方法是什么？**\n\n**A:** 从探索 `System.Linq` 的内容开始。特别关注 `Enumerable` 定义的扩展方法。接下来，扩展你在编写\
