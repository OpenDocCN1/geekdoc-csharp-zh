  \ 中的集合。第 15 节介绍了集合的介绍，但还有更多需要学习的内容。尽管 LINQ 非常新，但它已经是 C# 的重要部分，预计其使用将随着时间的推移而增加。简单来说，LINQ\
  \ 将成为每个 C# 程序员未来的一部分。你今天付出的努力将获得数倍回报。\n\n## 第 14 章自测\n\n1. LINQ 代表什么？从通俗来说来说，它的目的是什么？\n\
  2. 涉及 LINQ，数据源必须实现哪个接口？\n3  开始查询句的查询关键字有哪些？\n4. 假设有一个名为 `myDataList` 的数据源，显示如何创建一个返回这些对象序列的查询。将查询变量命名为\
  \ `allData`。\n5. 假设 `myDataList` 包含 `MyData` 对象且 `MyData` 定义了一个名为 `Height` 的属性，重写第\
