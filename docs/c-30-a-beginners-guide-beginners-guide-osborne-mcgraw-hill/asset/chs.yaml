  C# 3.0：入门指南\n\n7. 通过从 `Build` 菜单选择 `Build Solution` 来编译程序。\n\n8. 通过从 `Debug` 菜单选择\
  \ `Start Without Debugging` 来运行程序。当你运行程序时，你将看到此处所示窗口：\n\n如前面的指令所示，使用 IDE 编译短示例程序涉及许多步骤。然而，你不需要为书中的每个示例程序都创建一个新项目。相反，你可以使用同一个\
  \ C# 项目。只需删除当前的源文件并添加新文件即可。然后，重新编译并运行。这种方法极大地简化了过程。然而，请理解，对于现实世界的应用程序，每个程序将使用它们自己的项目。\n\
  \n**提示**\n\n尽管前面的指令足以编译和运行本书中的程序，但如果你将 Visual Studio IDE 作为你的主要工作环境，你应该应该熟悉它的所有功能和特性。它是一个非常强大的开发环境，有助于让大型项目易于管理。它还提供了一种组织与项目相关的文件和资源的方法。花费精力来熟练运行\
  \ Visual Studio 是值得的。\n\n## 使用 csc.exe，C# 命令行编译器\n\n虽然你可能在商业项目中使用 Visual Studio\
  \ IDE，但某些读者会发现 C# 命令行编译器更方便，特别是对于编译和运行本书所示的示例程序。其是因为你不需要为程序创建项目。你只需要创建程序，然后编译它并运行它——这一切都通过命令行完成。因此，如果你知道如何使用命令提示符窗口及其命令行界面，使用命令行编译器将比使用\
  \ IDE 更快更简单。\n\n第 1 章：C# 基础\n17\n\n**注意**\n\n如果你不熟悉命令提示符窗口，可能使用 Visual Studio IDE\
  \ 更好。虽然它的命令并不难学习，但同时尝试学习命令提示符和 C# 将是一次挑战性的体验。\n\n使用 C# 命令行编译器创建和运行程序，请遵循以下三个步骤：\n\
  1. 使用文本编辑器输入程序。\n2. 使用 `csc.exe` 编译程序。\n3. 运行程序。\n\n### 输入程序\n\n如所述，书中的程序可以从 McGraw-Hill\
  \ 网站获取：[www.mhprofessional.com](http://www.mhprofessional.com)。然而，如果你想手动输入程序，可以随意这样做。在这种情况下，你必须使用文本编辑器输入程序。记住，你必须创建文本文件而不是文档文件，因为文档文件会混淆\
  \ C# 编译器。输入程序时将其命名 `Example.cs`。\n\n### 编译程序\n\n要编译程序，在命令行执行 `csc.exe` 并指定源文件名，如下所示：\n\
  \n```\ncsc Example.cs\n```\n\n`csc` 编译器创建一个名为 `Example.exe` 的文件，其中包含 MSIL。虽然 MSIL\
  \ 不是可执行代码，但它包含在 `exe` 文件中。当你尝试执行 `Example.exe` 时，公共运行时（CLR）会自动调用 JIT 编译器。\n\n**注意**\n\
  \n在运行 `csc.exe` 之前，你需要打开一个配置了 Visual Studio 的命令提示符窗口。最简单的方法是从开始菜单中的“Visual Studio\
  \ Tools”下选择 `Visual Studio 2008 Command Prompt`。或者，你可以启动一个未配置的命令提示符窗口，然后运行 Visual\
  \ Studio 提供的批处理文件 `vars32.bat`。然而，命令行方法可能会遇到问题。在编写本文时，Visual C# 2008 Express 版本没有提供\
  \ Visual Studio Tools 菜单或 `vars32.bat` 文件。因此，如果你使用的是 Visual C# Express，可能无法自动配置命令提示符窗口。在这种情况下，请使用\
  \ Visual Studio IDE。然而，Visual C++ 2008 Express 版本确实提供了 `vars32.bat` 和 `Visual Studio\
  \ 2008 Command Prompt` 菜单选项。因此，如果你也安装了 Visual C++ 2008 Express 版，你将能够启动适用于 C# 的正确配置的命令提示符窗口。\n\
  \n18\n\nC# 3.0：入门指南\n\n### 运行程序\n\n要实际运行程序，只需在命令行输入其名称，如下所示：\n\n```\nExample\n```\n\
  \n当程序运行时，将显示以下输出：\n\nC# 赋予你编程力量\n\n### 逐行分析第一个示例程序\n\n尽管 `Example.cs` 非常短，但它包含了所有\
  \ C# 程序通用的几个关键特性。由于这是你的第一个 C# 程序，它值得仔细检查。我们将从它的名称开始。\n\n\n\n\nC# 程序的名称可以任意选择。与某些计算机语言（最显著的是\
  \ `Java`）不同，后者程序文件的命名非常重要，但 C# 并非如此。你被要求将示例程序命名为 `Example.cs`，以便编译和运行程序的指令能够生效，但从\
  \ C# 的角度来说，你可以给文件起任何其他名称。例如，之前的示例程序可以命名为 `Sample.cs`、`Test.cs` 甚至 `MyProg.cs`。\n\
  \n按照惯例，C# 程序使用 `.cs` 文件扩展名，这是你应该遵循的惯例。此外，许多程序员根据文件中定义的类类名称来为文件命名。这就是选择文件名 `Example.cs`\
  \ 的原因。由于 C# 程序的名称是任意的，书中的大多数示例程序将不会指定名称。只需使用你自定义的名称即可。\n\n程序从以下几行开始：\n\n```csharp\n\
  /*\nThis is a simple C# program.\nCall this program Example.cs.\n*/\n```\n\n这是一个*注释。*与大多数其他编程语言一样，C#\
  \ 允许你在程序的源文件中输入备注。编译器会忽略注释的内容。相反，注释会为阅读源代码的人描述或解释程序的操作。在这种情况下，注释描述了程序，并提醒你将源文件命名为\
  \ `Example.cs`。当然，在实际应用中，注释通常解释程序的某部分是如何工作的或某个特定功能的作用。\n\nC# 支持三种注释样式。程序顶部显示的这种注释被称为*多行注释*。这种类型的注释必须以\
  \ `/***` 开始，并以 `***/**` 结束。这两个注释符号之间的任何内容都会被编译器忽略。正如其名所示，多行注释可以跨几行。\n\n程序中的下一行是\n\
  \n```csharp\nusing System;\n```\n\n这一行表示程序正在使用 `System` 命名空间。在 C# 中，*命名空间*（namespace）定义了一个声明性区域。虽然我们稍后会详细介绍命名空间，但现在有一个简要描述是有用的。命名空间提供了一种将一组名称与另一组隔离开的方法。本质上，在一个命名空间中定义的名称不会与另一个命名空间中定义的相同名称冲突。程序使用的命名空间是\
  \ `System`，它是为与 .NET Framework 类库相关的项目保留的命名空间，而该类库正是 C# 使用的库。`using` 关键字表示程序正在使用给定命名空间中的名称。\n\
  \n程序中的下一行代码所示：\n\n```csharp\nclass Example {\n```\n\n这一行使用关键字 `class` 来声明正在定义一个新类。正如前面提到的，类是\
  \ C# 封装的基本单元。`Example` 是类的名称。类的定义以左大括号（`{`）开始，以右大括号（`}`）结束。两个大括号之间的元素是类的成员。目前，你不需要过多担心类的细节，只需注意程序活动发生在类内部即可。\n\
  \n程序中的下一行是*单行注释*，所示：\n\n```csharp\n// A C# program begins with a call to Main().\n\
  ```\n\n这是 C# 支持的第二种注释。*单行注释*以 `//` 开始，并在行尾结束。作为一个一般规则，程序员使用多行注释来编写较长的备注，使用单行注释进行简短的、逐行的描述。\n\
  \n下一行代码所示：\n\n```csharp\nstatic void Main() {\n```\n\n这一行开始定义 `Main()` 方法。正如我们之前提到的，在\
  \ C# 中，子程序被称为方法（method）。正如它之前的注释所暗示的，这是程序开始执行的行。所有的 C# 应用程序都通过调用 `Main()` 开始执行。此行每个部分的完整含义现在无法给出，因为这涉及到对其他几个\
  \ C# 特性的详细理解。然而，由于书中的许多示例都将使用这行代码，因此简要的解释是必要的。\n\n该行以关键字 `static` 开始。被 `static`\
  \ 修饰的方法可以在类对象创建之前被调用。这是必要的，因为 `Main()`是在程序启动时被调用的。`void` 关键字表示 `Main()` 不返回值。正如你将看到的，方法也可以返回值。`Main`\
  \ 后的空括号表示没有向 `Main()` 传递信息。正如你看到的，可以向 `Main()` 或任何其他方法传递信息。该行的最后一个字符是 `{`。它标志着 `Main()`\
  \ 主体的开始。组成方法的代码将位于方法的左大括号和右大括号之间。\n\n下一行代码所示。注意，它发生在 `Main()` 内部。\n\n```csharp\n\
  Console.WriteLine(\"C# gives you programming power.\");\n```\n\n### 专家问答\n\n**Q：你说\
  \ C# 支持三种类型的注释，但你只提到了两种。第三种是什么？**\n\n**A：C# 支持的第三种注释是*文档注释*（documentation comment），也称为*XML\
  \ 注释*。文档注释使用 XML 标签来帮助你创建自文档代码。**\n\n这一行在屏幕上输出字符串“C# gives you programming power.”，随后换行。输出实际上是通过内置方法\
  \ `WriteLine()` 完成的。在这种情况下，`WriteLine()` 显示传递给它的字符串。传递给方法的信息被称为*参数*（argument）。除了字符串外，`WriteLine()`\
  \ 还可以显示其他类型的信息，例如数值数据。该行以 `Console` 开始，它是支持 I/O 的预定义类的名称。通过将 `Console` 与 `WriteLine()`\
  \ 连接起来，你是在告诉编译器 `WriteLine()` 是 `Console` 类的成员。C# 使用对象来定义控制台输出，这一事实进一步证明了它的面向对象的本质。\n\
  \n注意 `WriteLine()` 语句以分号结尾，程序稍早前的 `using System` 语句也是如此。通常情况下，C# 中的所有语句都以分号结束。此规则的例外是*块*（block），它以\
  \ `{` 开始，以 `}` 结束。块不以分号结束。块提供了一种分组语句的机制。我们将在本章稍后的部分详细检查它们。\n\n程序中的第一个 `}` 结束了 `Main()`，最后一个\
  \ `}` 结束了 `Example` 类的定义。\n\n最后一点：C# 是区分大小写的。忘记这一点可能会导致严重问题。例如，如果你不小心输入 `main` 而不是\
  \ `Main`，或者输入 `writeline` 而不是 `WriteLine`，之前的程序将是错误的。此外，尽管 C# 编译器*会*编译不包含 `Main()`\
  \ 方法的类，但无法将其用作执行程序的入口点。因此，如果你写错了 `Main`，编译器仍然会编译你的程序。然而，你还会看到一条提示 `Example.exe`\
  \ 未定义入口点的错误消息。\n\n### 处理语法错误\n\n如果你还没有这样做，请输入、编译并运行之前的程序。正如你从之前的编程经验中可能的那样，向计算机输入代码时很容易不小心出错。如果发生这种情况，编译器在尝试编译时会报告*语法错误*（syntax\
  \ error）。显示的消息将包含错误所在的行号和字符位置，以及对错误的描述。\n\n\n\n虽然编译器报告的语法错误显然是有帮助的，但它们有时也会产生误导。无论你写了什么，C#\
  \ 编译器都会尝试理解你源代码的含义。因此，报告的错误并不总是能反映问题的真实原因。例如，在前面的程序中，在 `Main()` 方法后无意漏掉了左大括号，当使用\
  \ `csc` 命令行编译器编译时，会产生以下一系列错误（使用 IDE 编译时也会产生类似的错误）：\n\n```\nEX1.CS(12,21): error\
  \ CS1002: ; expected\nEX1.CS(13,22): error CS1519: Invalid token '(' in class, struct,\
  \ or interface member declaration\nEX1.CS(15,1): error CS1022: Type or namespace\
  \ definition, or end-of-file expected\n```\n\n显然，第一条错误信息是完全错误的，因为缺失的不是分号，而是大括号。后两条信息同样令人困惑。\n\
  \n讨论的要点在于，当你的程序包含语法错误时，不要一定从表面上相信编译器的信息。它们可能具有误导性。你可能需要对错误信息进行“二次推测”才能找到问题。此外，查看错误报告行之前的最后几行代码。有时，在错误实际发生点几行之后，错误才会被报告。\n\
  \n## 一处微小的变动\n\n尽管书中的所有程序都会使用它，但第一个示例程序开头的 `using System;` 语句在技术上并不是必须的。然而，它是一个非常有价值的便利措施。之所以没有必要，是因为在\
  \ C# 中，你始终可以使用其所属的命名空间对名称进行完全限定。例如，这一行代码：\n\n```\nConsole.WriteLine(\"A simple C#\
  \ program.\");\n```\n\n可以重写为：\n\n```\nSystem.Console.WriteLine(\"A simple C# program.\"\
  );\n```\n\n你偶尔会看到使用这种方法的 C# 代码，但并不常见。大多数 C# 程序员会在程序的顶部包含 `using System;` 语句，本书中的所有程序也是如此。这样做避免了每次使用该命名空间中的成员时都必须指定\
  \ `System` 命名空间的繁琐工作。然而，重要的是，如果需要，你可以显式地使用命名空间对名称进行限定。\n\n## 使用变量\n\n可能没有哪个结构比变量对编程语言更重要了。变量是一个可以赋值的具名内存位置。它之所以被称为变量，是因为它的值在程序执行过程中是可以改变的。换句话说，变量的内容是变化的，而不是固定的。\n\
  \n让我们从一个示例开始。下面的程序创建了三个名为 `length`、`width` 和 `area` 的变量。它使用这些变量来计算并显示尺寸为 9 比 7 的矩形面积。\n\
  \n```cs\n// 此程序介绍了变量。\nusing System;\n\nclass UseVars {\n    static void Main()\
  \ {\n        int length; // 声明了一个变量\n        int width; // 声明了另一个变量\n        //\
  \ 声明变量\n        int area; // 这是第三个变量\n\n        // 给 length 赋值 9。\n        length\
  \ = 9;\n        // 将 9 赋值给 length。\n\n        // 显示 length 的当前值。\n        Console.WriteLine(\"\
  length contains \" + length);\n\n        // 给 width 赋值 7。\n        width = 7;\n\
  \        // 将 7 赋值给 width。\n\n        // 显示 width 的当前值。\n        Console.WriteLine(\"\
  width contains \" + width);\n\n        // 将 length 和 width 的乘积赋值给 area。\n      \
  \  area = length * width;\n        // 将 length 乘以 width 并结果赋值给 area。\n\n       \
  \ // 显示结果。\n        Console.Write(\"area contains length * width: \");\n       \
  \ Console.WriteLine(area);\n    }\n}\n```\n\n当你运行此程序时，你将看到以下输出：\n\n```\nlength contains\
  \ 9\nwidth contains 7\narea contains length * width: 63\n```\n\n这个程序引入了几个新概念。首先，语句\
  \ `int length; // this declares a variable` 声明了一个整数类型的名为 `length` 的变量。在 C# 中，所有变量在使用之前都必须声明。此外，还必须指定变量可以包含的值的类型。这被称为变量的类型。在这种情况下，`length`可以包含整数值。这些是全整数。在\
  \ C# 中，要声明一个变量为整数类型，需要在其名称前加上关键字 `int`。因此，前述语句声明了一个类型为 `int` 的名为 `length` 的变量。\n\
  \n接下来的两行声明了另外两个 `int` 变量，名为 `width` 和 `area`：\n\n```cs\nint width; // 声明了另一个变量\n\
  int area; // 这是第三个变量\n```\n\n注意，每个变量使用的格式与第一个相同，只是变量名称不同。\n\n通常，要声明变量，你将使用如下的语句：\n\
  \n`type var-name;`\n\n在这里，`type` 指定了要声明的变量的类型，`var-name` 是变量的名称。除了 `int`，C# 还支持几种其他数据类型，如\
  \ `double`、`char` 和 `string`。\n\n下一行代码为 `length` 赋值 9：\n\n```cs\nlength = 9;\n```\n\
  \n在 C# 中，赋值运算符是单等号。它将右侧的值复制到左侧的变量。\n\n下一行代码输出 `length` 的值，前面带有字符串“length contains”。\n\
  \n```cs\nConsole.WriteLine(\"length contains \" + length);\n```\n\n在这条语句中，`+` 导致\
  \ `length` 的值显示在前面的字符串之后。这种方法是通用的。使用 `+` 运算符，你可以在单个 `WriteLine()` 语句中连接任意数量的项目。\n\
  \n接下来，将 `width` 的值设置为 7，并使用与上述相同的语句进行显示。然后，接下来的代码将 `length` 乘以 `width` 的结果赋值给 `area`。\n\
  \n```cs\narea = length * width;\n```\n\n这一行将 length 中的（9）乘以 width 的值（7），并将结果存储在\
  \ `area` 中。因此，在该行执行后，`area` 将包含值 63。`length` 和 `width` 的值保持不变。\n\n与大多数计算机语言一样，C#\
  \ 支持完整的算术运算符集，如下所示：\n\n- `+`: 加法\n- `-`: 减法\n- `*`: 乘法\n- `/`: 除法\n\n这些可以使用任何类型的数值数据。\n\
  \n### 专家问\n\n**Q: 你说所有变量在使用之前都必须声明，并且所有变量都有类型。然而，你提到 C# 3.0 引入了一种新功能叫做隐式类型变量。这是什么？它是否回避了声明变量的需求？**\n\
  \n**A:** 正如你将在第二章中学到的，隐式类型变量是由编译器自动确定类型的变量。然而，请理解，隐式类型变量仍然需要声明。不是使用类型名称（如 `int`），而是使用\
  \ `var` 关键字来声明隐式类型变量。隐式类型变量在某些特殊情况下（特别是涉及 LINQ 的情况）非常有用，但它们并不是为了泛泛替代显式类型变量。通常情况下，当你声明变量时，会给它一个显式类型。\n\
  \n这里是程序中的接下来的两行：\n\n```cs\nConsole.Write(\"area contains length * width: \");\n\
  Console.WriteLine(area);\n```\n\n\n\n这里发生了两个新情况。首先，内置方法 `Write()` 被用于显示字符串“area\
  \ contains length * width:”。该字符串后面*没有*跟随换行符。这意味着当生成下一次输出时，它将从同一行开始。`Write()` 方法与\
  \ `WriteLine()` 相似，不同在于它在每次调用后不会输出新的一行。其次，在对 `WriteLine()` 的调用中，注意 `area` 是被单独使用的。`Write()`\
  \ 和 `WriteLine()` 都可输出 C# 任何内置类型的值。\n\n在继续之前，关于声明变量还有一点：可以使用可以使用条声明声明语句来声明两个或多个变量。只需用逗号将它们的名称分隔即可。\n\
  \n例如，`length` 和 `width` 可以像这样声明：`int length, width; // 使用一个语句声明了 length 和 width`\n\
  \n# double 数据类型\n\n在前面的程序中，使用了 `int` 类型的变量。然而，`int` 类型的变量只能存储整数。因此，在需要小数部分时就无法使用它。例如，一个\
  \ `int` 变量可以存储值 18，但不能存储值 18.3。幸运的是，`int` 只是 C# 定义的几种数据类型之一。为了允许带有小数部分的数字，C# 定义了两个浮点类型：`float`\
  \ 和 `double`，它们分别表示单精度和双精度值。两者之间，`double` 是最常用的。\n\n要声明一个 `double` 类型变量，使用类似于所示的语句：`double\
  \ result;`\n\n# 第 1 章：C# 基础\n\n在这里，`result` 是变量名，类型为 `double`。由于 `result` 是浮点类型，它可以存储诸如\
  \ 122.23、0.034 和 –19.0 等值。\n\n为了更好地理解 `int` 和 `double` 之间的区别，请尝试以下程序：\n\n```c\n\
  /*\n此程序说明了 int 和 double 之间的区别\n*/\nusing System;\n\nclass IntVsDouble {\n    static\
  \ void Main() {\n        // ivar 是 int 类型。\n        int ivar; // 这声明了一个 int 变量\n\
  \        double dvar; // 这声明了一个浮点变量\n        // dvar 是 double 类型。\n\n        //\
  \ 给 ivar 赋值 10。\n        ivar = 10;\n        // 给 dvar 赋值 10.0。\n        dvar =\
  \ 10.0;\n\n        Console.WriteLine(\"Original value of ivar: \" + ivar);\n   \
  \     Console.WriteLine(\"Original value of dvar: \" + dvar);\n        Console.WriteLine();\
  \ // 打印空行。\n\n        // 现在，将两者除以 4。\n        ivar = ivar / 4;\n        // 这是整数除法。\n\
  \        dvar = dvar / 4.0;\n        // 此除法保留了小数部分。\n        Console.WriteLine(\"\
  ivar after division: \" + ivar);\n        Console.WriteLine(\"dvar after division:\
  \ \" + dvar);\n    }\n}\n```\n\n该程序的输出所示：\n\n```\nOriginal value of ivar: 10\nOriginal\
  \ value of dvar: 10\nivar after division: 2\ndvar after division: 2.5\n```\n\n如你所见，当\
  \ `ivar` 除以 4 时，执行的是整数除法，结果是 2——小数部分丢失了。然而，当 `dvar` 除以 4.0 时，小数部分被保留了，结果是 2.5。\n\
  \n### 专家问答\n\n**Q：为什么 C# 对整数和浮点值有不同的数据类型？也就是说，为什么所有的数值不都用同样的类型？**\n\n**A：** C# 提供了不同的数据类型以便你编写高效的程序。例如，整数算术比浮点计算要快。因此，如果你不需要小数值，就不需要忍受与\
  \ `float` 或 `double` 类型相关的开销。其次，一种数据所需的内存可能比另一种更少。通过提供不同的类型，C# 使你能够最好地利用系统资源。最后，某些算法需要（或至少受益于）使用特定类型的数据。C#\
  \ 提供了许多内置类型以给你提供最大的灵活性。\n\n如程序所示，当你想在程序中指定一个浮点值时，它必须包含小数点。如果你不包含，它将被解释为整数。例如，在 C#\
  \ 中，值 100 是整数，但值 100.0 是浮点值。\n\n程序中还有另一个需要注意的新点。要打印空行，只需调用不带参数的 `WriteLine()`。\n\
  \n# 尝试这个：将华氏度转换为摄氏度\n\n尽管前面的示例程序说明了 C# 语言的一些重要特性，但它们并不是非常有用。即使你现在对 C# 并不了解很多，你仍然可以将所学知识投入运用创建一个实用的程序。在这里，你将创建一个将华氏度转换为摄氏度的程序。\n\
  \n程序声明了两个 `double` 变量。一个将存储华氏度数值，另一个将存储转换后的摄氏度数值。将华氏度转换为摄氏度的公式为：\n\n`C = 5/9 * (F\
  \ – 32)`\n\n其中 `C` 是摄氏度温度，`F` 是华氏度温度。\n\n### 逐步步骤\n\n1. 创建一个名为 `FtoC.cs` 的 C# 文件。\n\
  2. 在文件中输入以下程序：\n\n```csharp\n/*\n此程序将华氏度转换为摄氏度。\n*/\nusing System;\n\nclass FtoC\
  \ {\n    static void Main() {\n        double f; // 存储华氏度\n        double c; //\
  \ 存储转换后的摄氏度\n\n        // 将华氏度设为 59\n        f = 59.0;\n        // 转换华氏度到摄氏度\n \
  \       c = 5.0 / 9.0 * (f - 32.0);\n\n        Console.Write(f + \" degrees Fahrenheit\
  \ is \");\n        Console.WriteLine(c + \" degrees Celsius.\");\n    }\n}\n```\n\
  \n3. 使用 Visual Studio IDE 或通过命令行编译程序：\n`csc FtoC.cs`\n\n4. 运行程序。你将看到输出：\n`59 degrees\
  \ Fahrenheit is 15 degrees Celsius.`\n\n5. 就目前而言，该程序将 59 度华氏度转换为摄氏度。通过更改给 `f` 的值，你可以让程序转换不同的温度。注意变量\
  \ `f` 和 `c` 是 `double` 类型，这是为了确保小数部分的准确性。\n\n\n\n\n注意，相等性测试使用的是双等号。\n\n这里是一个演示 `if`\
  \ 语句和关系运算符的程序。\n\n```cs\n// Demonstrate the if.\n\nusing System;\n\nclass IfDemo\
  \ {\n    static void Main() {\n        int a, b, c;\n        a = 2;\n        //\
  \ 只有当条件为真时，才会执行 WriteLine( )语句。\n        b = 3;\n        // 这个 if 语句成功，因为 a 小于 b。\n\
  \        if(a < b) Console.WriteLine(\"a is less than b\");\n        // 这是 if 测试的条件。\n\
  \        // 这不会显示任何内容，因为 a 不等于 b。\n        if(a == b) Console.WriteLine(\"you won't\
  \ see this\");\n        // 这个 if 成功，因为 a 包含值 2。\n        if(a == 2) Console.WriteLine(\"\
  a contains the value 2\");\n        // 这个 if 失败，因为 a 不包含值 19。\n        if(a == 19)\
  \ Console.WriteLine(\"you won't see this\");\n        // 这个 if 将成功，因为 a 将等于 b -\
  \ 1。\n        if(a == b-1) Console.WriteLine(\"a equals b - 1\");\n        Console.WriteLine();\n\
  \        c = a - b; // c contains -1\n        Console.WriteLine(\"c contains -1\"\
  );\n        if(c >= 0) Console.WriteLine(\"c is non-negative\");\n        if(c <\
  \ 0) Console.WriteLine(\"c is negative\");\n        Console.WriteLine();\n     \
  \   c = b - a; // c  now 包含 1\n        Console.WriteLine(\"c now contains 1\");\n\
  \        if(c >= 0) Console.WriteLine(\"c is non-negative\");\n        if(c < 0)\
  \ Console.WriteLine(\"c is negative\");\n        Console.WriteLine();\n    }\n}\n\
  ```\n\n该程序生成的输出所示：\n\n```\na is less than b\na contains the value 2\na equals b\
  \ - 1\nc contains -1\nc is negative\nc now contains 1\nc is non-negative\n```\n\n\
  注意该程序中的另外一点。这一行\n\n`int a, b, c;`\n\n通过使用逗号分隔的列表声明了三个变量 `a`、`b` 和 `c`。如前所述，当你需要两个或多个相同类型的变量时，可以在一个语句中声明它们。只需用逗号分隔变量名即可。\n\
  \n## for 循环\n\n你可以通过创建 `loop` 来反复执行一段代码。C# 提供了了一套强大的循环结构。我们在这里查看的是 `for` 循环。如果你熟悉\
  \ C、C++ 或 Java，你将会很高兴地发现，C# 中的 `for` 循环工作方式与这些语言完全相同。`for` 循环的最简单形式所示：`for(*initialization*;\
  \ *condition*; *iteration*) statement;`。在最常见的形式中，循环的 `initialization` 部分将循环控制变量设置为初始值。`condition`\
  \ 是一个布尔表达式，用于测试循环控制变量。\n\n如果该测试的结果为真，`for` 循环将继续迭代。如果为假，循环将终止。`iteration` 表达式决定了每次循环迭代时循环控制变量的变化。这里有一个演示\
  \ `for` 循环的短程序：\n\n```cs\n// Demonstrate the for loop.\n\nusing System;\n\nclass\
  \ ForDemo {\n    static void Main() {\n        // 如果 count 小于 5，则执行 WriteLine( )\
  \ 语句。\n        // 每次循环将 count 增加 1。\n        int count;\n        Console.WriteLine(\"\
  Counting from 0 to 4:\");\n        for(count = 0; count < 5; count = count+1)\n\
  \            Console.WriteLine(\" count is \" + count);\n        Console.WriteLine(\"\
  Done!\");\n    }\n}\n```\n\n程序生成的输出所示：\n\n```\nCounting from 0 to 4:\ncount is 0\n\
  count is 1\ncount is 2\ncount is 3\ncount is 4\nDone!\n```\n\n在这个示例中，`count` 是循环控制变量。它在\
  \ `for` 的初始化部分被设置为零。在每次迭代的开始时（包括第一次迭代），都会执行条件测试 `count < 5`。如果此测试的结果为真，则执行 `WriteLine(\
  \ )` 语句，然后执行循环的迭代部分。这个过程一直持续，直到条件测试为假，此时执行将从循环的底部继续。\n\n令人感兴趣的一点是，在专业编写的 C# 程序中，你几乎永远不会看到像前面程序那样写出循环的迭代部分。也就是说，你很少看到这样的语句：\n\
  \n`count = count + 1;`\n\n原因是 C# 包含一个特殊的递增运算符，可以更紧凑地执行此操作。递增运算符是 `++`（两个连续的加号）。递增运算符将其操作数加一。通过使用递增运算符，前面的语句可以写成：\n\
  \n`count++;`\n\n因此，前面程序中的 `for` 通常会写成：`for(count = 0; count < 5; count++)`。你可能想尝试一下。正如你将看到的，循环的运行方式与之前完全一样。\n\
  \nC# 还提供了一个递减运算符，指定为 `--`（两个连续的减号）。该运算符将其操作数减一。\n\n### 使用代码块\n\nC# 的另一个关键元素是 `block`（块）。块是一组由大括号包围的逻辑连接的语句集合。每当你需要在逻辑上连接两个更多的语句时，你通过创建一个块来实现。例如，考虑这个\
  \ `if` 语句：\n\n```cs\nif(counter < max) {\n    counter = count;\n    delay = 0;\n\
  }\n```\n\n在这里，如果 `counter` 小于 `max`，则块内的两个语句都将被执行。因此，`if` 的目标是一个块。这里使用块来防止除以零的程序：\n\
  \n```cs\n// Demonstrate block of code.\n\nusing System;\n\nclass BlockDemo {\n \
  \   static void Main() {\n        double i, j, d;\n        i = 5.0;\n        j =\
  \ 10.0;\n        // 这个 if 的目标是一个块。\n        if(i != 0) {\n            Console.WriteLine(\"\
  i does not equal zero\");\n            // if 的目标是整个块。\n            d = j / i;\n\
  \            Console.WriteLine(\"j / i is \" + d);\n        }\n    }\n}\n```\n\n\
  该程序生成的输出所示：\n\n```\ni does not equal zero\nj / i is 2\n```\n\n在这种情况下，`if` 语句的目标是一个块，而不仅仅是单个语句。如果控制\
  \ `if` 的条件为真（在本例中），则块内的语句将被执行。尝试将 `i` 设置为零并观察结果。正如你稍后在本书中所看到的，代码块具有额外的属性和用途。然而，它们存在的主要原因是为了创建不可分割的代码单元。\n\
  \n### 分号和位置\n\n在 C# 中，分号表示语句的结束。也就是说，每个单独的语句都必须以分号结尾。如你所知，块是一组由大大括号包围的语句集合。块不以分号终止。由于块是一组语句，块不以分号终止是有合逻辑的；相反，块的结束由右大括号指示。\n\
  \n### 专家问答\n\n**问：使用代码块会引入任何运行时效率的下降吗？换句话说，{ 和 } 在我的程序执行期间会消耗额外时间吗？**\n\n**答：不会。代码块不会增加任何开销。事实上，由于它们能够简化某些算法的编码，它们的使用通常会提高速度和效率。**\n\
  \n\n\n\n\n此外，语句的各个元素也可以单独放在不同的行上。例如，以下写法完全可以接受：\n\n```csharp\nConsole.WriteLine(\"\
  This is a long line of output\" +\nx + y + z +\n\"more output\");\n```\n\n以这种方式折断长行通常用于提高程序的可读性。它还可以帮助防止过长的行发生自动换行。\n\
  \n## 缩进规范\n\n你可能在之前的示例中注意到某些语句经过了缩进。C# 是一种自由格式的语言，这意味着在同一行内，你将语句放在相对于彼此的什么位置并不重要。然而，多年来，已经发展出了一种通用且被认可的缩进风格，它能让程序具有非常高的可读性。本书遵循这种风格，也建议你也这样做。使用这种风格，在每个左括号\
  \ `{` 之后缩进一级，在每个右括号 `}` 之后向回移动一级。某些语句会鼓励额外的缩进；这些内容将在后文中介绍。\n\n## 尝试一下：改进华氏摄度转换程序\n\
  \n你可以使用 `for` 循环、`if` 语句和代码块来创建一个你在第一个“尝试一下”示例中开发的华氏转摄氏转换器的改进版本。这个新版本将打印一个转换表格，从\
  \ 0 度华氏度开始，到 99 度结束。每隔 10 度，将输出一个空行。这是通过使用一个名为 `counter` 的变量实现的，该变量记录输出的行数。请特别注意它的用法。\n\
  \n（续上）\n\n### 逐步步骤\n\n1. 创建名为 `FtoCTable.cs` 的新文件。\n\n2. 在文件中输入以下程序：\n\n```csharp\n\
  /*\n此程序显示华氏度到摄氏的转换表。\n将此程序名为 FtoCTable.cs。\n*/\nusing System;\n\nclass FtoCTable\
  \ {\n    static void Main() {\n        double f, c;\n        int counter;\n    \
  \    counter = 0;\n        for(f = 0.0; f < 100.0; f++) {\n            // 转换为摄氏\n\
  \            c = 5.0 / 9.0 * (f - 32.0);\n            Console.WriteLine(f + \" degrees\
  \ Fahrenheit is \" +\n            c + \" degrees Celsius.\");\n            counter++;\n\
  \            // 每 10 行，打印一个空行。\n            if(counter == 10) {\n              \
  \  Console.WriteLine();\n                counter = 0; // 重置行计数器\n            }\n\
  \        }\n    }\n}\n```\n\n3. 按照前面的描述编译程序。\n\n4. 运行程序。这里是你将看到的输出部分。注意每十行会输出一个空行。如所述，这是由\
  \ `counter` 变量控制的，它的初始设置为零。每通过一次 `for` 循环，`counter` 都会加 1。当 `counter` 等于 10 时，输出空行，然后将\
  \ `counter` 重置为零。这个过程导致输出每十个单位一组进行分组。\n\n```text\n0 degrees Fahrenheit is -17.7777777777778\
  \ degrees Celsius.\n1 degrees Fahrenheit is -17.2222222222222 degrees Celsius.\n\
  2 degrees Fahrenheit is -16.6666666666667 degrees Celsius.\n3 degrees Fahrenheit\
  \ is -16.1111111111111 degrees Celsius.\n4 degrees Fahrenheit is -15.5555555555556\
  \ degrees Celsius.\n5 degrees Fahrenheit is -15 degrees Celsius.\n6 degrees Fahrenheit\
  \ is -14.444444444444 degrees Celsius.\n7 degrees Fahrenheit is -13.8888888888889\
  \ degrees Celsius.\n8 degrees Fahrenheit is -13.3333333333333 degrees Celsius.\n\
  9 degrees Fahrenheit is -12.7777777777778 degrees Celsius.\n10 degrees Fahrenheit\
  \ is -12.2222222222222 degrees Celsius.\n11 degrees Fahrenheit is -11.6666666666667\
  \ degrees Celsius.\n12 degrees Fahrenheit is -11.1111111111111 degrees Celsius.\n\
  13 degrees Fahrenheit is -10.555555555556 degrees Celsius.\n14 degrees Fahrenheit\
  \ is -10 degrees Celsius.\n15 degrees Fahrenheit is -9.444444444444 degrees Celsius.\n\
  16 degrees Fahrenheit is -8.8888888888889 degrees Celsius.\n17 degrees Fahrenheit\
  \ is -8.3333333333333 degrees Celsius.\n18 degrees Fahrenheit is -7.7777777777778\
  \ degrees Celsius.\n19 degrees Fahrenheit is -7.2222222222222 degrees Celsius.\n\
  ```\n\n## C# 关键字\n\n在基础上，计算机语言由其关键字定义，而 C# 提供了一个丰富多样的集合。此外，C# 定义了两种通用类型的关键字：`reserved`（保留）和\
  \ `contextual`（上下文相关）。\n\n`reserved` 关键字不能作为变量、类或方法的名称。它们只能作为关键字使用。这就是为什么它们被称为保留关键字。有时也会使用\
  \ `reserved words`（保留字）或 `reserved identifiers`（保留标识符）等术语。目前存在这些关键字。`contextual`\
  \ 关键字在特定的上下文中具有特殊含义。在这些上下文之外，它们可以作为标识符使用。如表 12 所示。\n\n## 标识符\n\n在 C# 中，标识符是分配给方法、变量或任何用户定义项的名称。标识符长度从一个到多个字符，可以以字母或下划线开头。\n\
  \n### 表 1-1 C# 保留关键字\n```text\nabstract, as, base, bool, break, byte, case, catch,\
  \ char, checked, class, const, continue, decimal, delegate, do, double, else, enum,\
  \ event, explicit, extern, false, finally, float, for, foreach, goto, if, implicit,\
  \ in, int, interface, internal, is, lock, long, namespace, new, null, object, operator,\
  \ out, override, params, private, protected, public, readonly, ref, return, sbyte,\
  \ sealed, short, sizeof, stackalloc, static, string, struct, switch, this\n```\n\
  \n大小写是不同的；对于 C# 来说，`myvar` 和 `MyVar` 是不同的名称。以下是一些可以接受的标识符示例：`Test, x, y2, MaxLoad,\
  \ up, _top, my_var, sample`。\n\n记住，标识符不能以数字开头。因此，例如 `12x` 是无效的。良好的编程习惯是反映所命名项含义的标识符名称。\n\
  \n尽管你不能将任何 C# 关键字作为标识符，但 C# 允许你在关键字前面加上 `@`，使其成为合法的标识符。例如，`@for` 是一个有效的标识符。在这种情况下，标识符实际上是\
  \ `for`。坦地说，除了特殊用途外，不建议将关键字用于标识。此外，`` 可以出现在任何标识符前面，但这被认为是坏习惯。\n\n### 表 1-2 C# 上下文关键字\n\
  ```text\nfrom, get, group, into, join, let, orderby, partial, select, set, value,\
  \ where, yield\n```\n\n\n\n\n\n在本书中，我们将描述 .NET 库中类和方法的各种元素。\n\n然而，.NET 库非常大，你可能也想要自己进行更多方面的探索。\n\
  \n### 第 1 章自测\n\n1. 什么是 `MSIL`？它为什么对 C# 很重要？\n2. 什么是 `Common Language Runtime`（通用语言运行时）？\n\
