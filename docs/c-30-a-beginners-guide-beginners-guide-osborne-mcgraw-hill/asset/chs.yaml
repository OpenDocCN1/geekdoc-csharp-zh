  \ Chapter 3: Program Control Statements\n\n### 115\n\n### 嵌套循环\n\n正如你在前面的示例中所看到的，一个循环可以嵌套另一个循环内部。\n\
  \n嵌套循环用于解决各种编程问题，是编程中不可或的一部分。因此，在离开 C# 循环语句主题之前，让我们来看另一个嵌套循环示例。以下程序使用嵌套的 `for` 循环来寻找\
  \ 2 到 100 之间数字的因子：\n\n```csharp\n// 使用嵌套循环寻找 2 到 100 之间数字的因子。\nusing System;\n\n\
  class FindFac {\n    static void Main() {\n        for(int i=2; i <= 100; i++) {\n\
  \            Console.Write(\"Factors of \" + i + \": \");\n            for(int j\
  \ = 2; j <= i/2; j++)\n                if((i%j) == 0) Console.Write(j + \" \");\n\
  \            Console.WriteLine();\n        }\n    }\n}\n```\n\n这里是程序产生的输出部分：\n```text\n\
  Factors of 2:\nFactors of 3:\nFactors of 4: 2\nFactors of 5:\nFactors of 6: 2 3\n\
  Factors of 7:\nFactors of 8: 2 4\nFactors of 9: 3\nFactors of 10: 2 5\nFactors of\
  \ 11:\nFactors of 12: 2 3 4 6\nFactors of 13:\nFactors of 14: 2 7\nFactors of 15:\
  \ 3 5\nFactors of 16: 2 4 8\nFactors of 17:\nFactors of 18: 2 3 6 9\nFactors of\
  \ 19:\nFactors of 20: 2 4 5 10\n```\n\n在程序中，外层循环 `i` 从 2 运行到 100。内层循环依次测试从 2 到 `i`\
  \ 的所有数字，并打印能整除 `i` 的数字。\n\n\n\n当你定义一个类时，你声明了它包含的数据以及操作这些数据的代码。虽然简单的类可能只包含代码或只包含数据，但大多数现实世界的类二者兼备。\n\
  \n通常情况下，数据包含在类定义的实例变量中，而代码包含在方法中。然而，在开始时说明的是，C# 定义了若干种特定类型的成员，包括实例变量、静态变量、常量、方法、构造函数、析构函数、索引器、事件、操作符和属性。目前，我们将对类的讨论限制在它的基本元素上：实例变量和方法。\n\
  \n在本章的后后部分，将讨论构造函数和析构函数。其他类型的成员将在后面的章节中描述。\n\n使用 `class` 关键字创建类。这里显示了仅包含实例变量和方法的\
  \ `class` 定义的通用形式：\n\n```class\nclass classname {\n    // 声明实例变量。\n    access type\
  \ var1;\n    access type var2;\n    // ...\n    access type varN;\n\n    // 声明方法。\n\
  \    access ret-type method1(parameters) {\n        // 方法的主体\n    }\n    access\
  \ ret-type method2(parameters) {\n        // 方法的主体\n    }\n    // ...\n    access\
  \ ret-type methodN(parameters) {\n        // 方法的主体\n    }\n}\n```\n\n注意每个变量和方法前面都有\
  \ `access`。在这里，`access` 是一个访问修饰符，例如 `public`，它指定了如何访问该成员。正如第 1 节提到的，类成员可以是该类的私有的（private），也可以具有更高的访问权限。访问修饰符决定了允许何种类型的访问。访问修饰符是可选的，如果没有，则成员对该类是私有的。具有私有访问权限的成员只能由类的其他成员使用。对于本章中的示例，所有成员（`Main()`\
