  \ 的方法必须被派生类重写。\n\n### 使用 sealed 防止继承\n\n尽管继承非常强大且有用，但有时你可能想要阻止它。例如，你可能有一个类封装了某些特殊硬件设备（如医疗监护器）的初始化序列。在这种情况下，你不希望使用该类的用户能够更改监护器的初始化方式，可能会导致设备设置错误。\n\
  \n无论出于什么原因，在 C# 中，使用 `sealed` 关键字很容易防止一个类被继承。\n\n要防止一个类被继承，请在其声明之前加上 `sealed`。正如你预期的，将一个类同时声明为\
  \ `abstract` 和 `sealed` 是非法的，因为抽象类本身是不完整的，它依赖于派生类来提供完整的实现。\n\n这里有一个 `sealed` 类的示例：\n\
  \n```csharp\nsealed class A {\n\n// 此类不能被继承。\n\n// ...\n}\n\n// 下面的类是非法的。\n\nclass\
  \ B : A { // 错误！无法派生类 A\n\n// ...\n}\n```\n\n正如注释所示，`B` 继承 `A` 是非法的，因为 `A` 被声明为\
  \ `sealed`。\n\n另另一点：`sealed` 也可以用于虚方法以防止进一步的重写。\n\n例如，假设有一个基类为 `B` 和一个派生类为 `D`。在\
