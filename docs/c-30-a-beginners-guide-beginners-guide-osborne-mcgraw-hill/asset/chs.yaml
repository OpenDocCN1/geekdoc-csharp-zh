  \n\n\n\n\n\n## 关于作者\n\n**Herb Schildt** 是 C#、Java、C 和 C++ 领域的领先权威。\n\n他的编程书籍全球销量超过\
  \ 350 万册，并被翻译成主要外语。他广受誉的作品包括 `C#: The Complete Reference`、`Java: The Complete Reference`、`Java:\
  \ A Beginner’s Guide`、`C++: The Complete Reference` 以及 `C++: A Beginner’s Guide`。尽管对计算的所有方面都感兴趣，但他主要关注的是计算机语言，包括编译器、解释器和机器人控制语言。他对语言的标准化也有浓厚兴趣。Schildt\
  \ 拥有伊利诺伊大学的硕士和本科学位。可以通过他的咨询办公室 (217) 586-4683 与他联系。他的网站是 `www.HerbSchildt.com`。](http://www.HerbSchildt.com)\n\
  \n## 关于技术编辑\n\n**Eric Lippert** 是微软 C# 编译器开发团队高级开发人员。\n\n\n\n\n# 前言\n\n在“网络即计算机”的时代，`.NET\
  \ Framework` 已经成为创建代码领先的环境。`.NET` 开发的首选语言是 `C#`。\n\n因此，如果 `.NET` 编程是你的未来，那么你已经选择了正确的语言来学习。\n\
  \n除了用于 `.NET` 编程外，`C#` 的另一个原因也很重要。它的创新特性正在重塑编程世界，改变代码的编写方式，并以新的方式构建解决方案。因此，`C#`\
  \ 正在帮助定义编程的未来方向。结果是对于专业程序员来说，精通 `C#` 不再是一个选项，而是一项必课。\n\n本书的目的是教你 `C#` 编程的基础知识。它采用循序渐进的方法，并配有大量的示例和自测。本书假设你之前没有编程经验。书从基础知识开始，例如如何编译和运行一个\
  \ `C#` 程序。然后讨论了构成 `C#` 语言的关键字、特性和结构。当你读完这本书时，你将牢牢掌握 `C#` 编程的精要。\n\n正如所有程序员所知，在编程领域，没有任何东西会长期停留。`C#`\
  \ 也不例外。自 2000 年创立以来，`C#` 经历了两次重大修订，每次修订都增加了许多重要的新特性。在写作期间，`C#` 的当前版本是 `3.0`，这也是本书所描述的\
  \ `C#` 版本。因此，本书涵盖了 `C#` 的最新特性，包括语言集成查询 (`LINQ`) 和 lambda 表达式。\n\n当然，这个入门指南只是一个起点。`C#`\
  \ 是一门非常大的语言，涉及不仅仅是关键字和语法。\n\n## 本书的结构\n\n本书提供了一个节奏均匀的教程，每个章节都建立在前一节的基础上。\n\n## 关键技能与概念\n\
  \n每章开头都有一个技能和概念列表。\n\n### 自测\n\n每章末尾处都有一个自测，让你测试自己的知识。\n\n# 提问专家\n\n书中穿插了特殊的“提问专家”框。这些框包含了关于某个主题的额外信息或评论。\n\
  \n### 尝试一下\n\n每章都包含一个或多个“尝试一下”部分。它们教你如何应用所学。\n\n### 无需编程经验\n\n本书假设没有编程经验。因此，如果你以前从未过过，可以使用本书。当然，在当今时代，大多数读者会有一些\
  \ `C++` 或 `Java` 经验。\n\n### 所需软件\n\n要编译和运行本书中的程序，你需要一个支持 `C#` 的 `Visual Studio 2008`\
  \ 或更高版本。`Visual 2008 Express` 版是一个很好的选择，因为它是免费提供的。书中所有的代码都是使用它进行测试的。当然，计算机上必须安装\
  \ `.NET Framework`。\n\n### 不要忘记：网络代码\n\n书中所有示例的代码可以在 `www.mhprofessional.com` 免费获取。\n\
  \n# Herbert Schildt 其他著作\n\n*C# 3.0 入门指南*只是 Herb 许多编程书籍之一。其他的你会感兴趣。继续学习 `C#`，我们建议参考\
  \ *C# 3.0 完整参考*。要学习 `Java`，我们推荐：*Java 完整参考*、*Java 入门指南*、*Java 艺术*、*Swing 入门指南*以及\
  \ *Herbert Schildt 的 Java Cookbook*。要学习 `C++`，这些书籍将非常有帮助：*C++ 完整参考*、*C++ 入门指南*、*从零开始的\
  \ C++*、*从零开始的 STL 编程*、*C++ 艺术*以及 *Herbert Schildt 的 C++ Programming Cookbook*。如果你想学习\
  \ `C` 语言，那么以下标题 *C 完整参考*将让你感兴趣。\n\n# 第 1 章：C# 基础\n\n## 关键技能与概念\n\n- `C#` 的历史\n-\
  \ `C#` 如何关联和使用 `.NET Framework`\n- 面对象编程的三大原则\n- 创建、编译和运行 `C#` 程序\n- 变量\n- `if`\
  \ 和 `for` 语句\n- 代码块\n- `C#` 关键字\n\n对完美编程语言的追求与编程学科本身一样悠久。\n\n\n\n\n\n在这一征程中，C# 是目前的标准标兵。C#\
  \ 由微软为了支持其 .NET Framework 的开发而创建，它利用了经起时间考验的特性和前沿创新，为现代企业计算环境提供了一种高度可用、高效的程序编写方式。在本本书中，你将学习如何使用它进行编程。\n\
  \n本章的目的是介绍 `C#`，包括推动其创建的力量、其设计哲学以及它的几个最重要的特性。到目前为止，学习一种编程语言最困难的地方在于，没有任何一个元素是孤立存在的。相反，语言的各个组件是协同工作的。正是这种相互关联性使得在不涉及其他方面的情况下，讨论\
  \ `C#` 的某一个方面变得非常困难。为了解决这个问题，本章对几项 `C#` 特性进行了简要概述，包括 `C#` 程序的通用形式、两个控制语句以及几个运算符。它并没有涉及过多的细节，而是专注于任何\
  \ `C#` 程序都通用的通用概念。\n\n此时，3.0 版本是 `C#` 的当前发布版本，这也是本书所教授的版本。当然，这里介绍的大部分信息适用于 `C#`\
  \ 的所有版本。\n\n## C# 的家族树\n\n计算机语言并不是存在于真空中的。相反，它们相互关联，每种新语言都以某种形式受到先出现语言的影响。在一个类似于杂交授粉的过程中，一种语言的特性被另一种语言采纳，新的创新被整合到现有的语文中，或者旧的结构被移除。通过这种方式，语言不断演进，编程艺术也不断进步。`C#`\
  \ 也不例外。\n\n# 第一章：C# 基础\n\n`C#` 继承了丰富的编程遗产。它直接源自世界上最成功的两种语言：`C` 和 `C++`。它与另一种语言也密切相关：`Java`。\n\
  \n理解这些关系的本质对于理解 `C#` 至关重要。因此，我们通过将它置于这三种语言的历史背景中，开始了对 `C#` 的研究。\n\n## C：现代编程时代的开端\n\
  \n`C` 的创造标志着现代编程时代的开端。`C` 由 Dennis Ritchie 在 20 世纪 70 年代在运行 UNIX 操作系统的 DEC PDP-11\
  \ 上发明明的。虽然一些早期的语言（最著名的是 `Pascal`）已经取得了巨大的成功，但是 `C` 确定了至今仍在指导编程方向的范式。\n\n`C` 产生于\
  \ 20 世纪 60 年代的结构化编程革命。结构化语言的定义是它们拥有一套丰富的控制语句、带有局部变量的子程序、代码块以及其他改进，这些改进使得组织和维护程序变得更容易。\n\
  \n尽管当时的其他语言也具有类似的特性，但 `C` 使用简洁而易于使用的语法实现了这些元素。它还体现了一种哲学，即将程序员（而不是语言）置于开发过程的中心。因此，`C`\
  \ 迅速赢得了许多追随者。\n\n它成为了 20 世纪 70 年代后期和 80 年代主地位的结构化编程语言，并一直持续至今。\n\n## OOP 和 C++ 的诞生\n\
  \n尽管 `C` 非常有用，但到 20 世纪 70 年代后期，许多项目的规模已经接近或达到了结构化编程方法论和 `C` 语言所能处理的极限。程序变得变得太庞大了。为了解决这个问题，一种新的编程方法开始出现。\n\
  \n这种方法被称为面向对象编程（简称 OOP）。通过使用 `OOP`，程序员可以处理大得多的程序。问题在于，当时最流行的语言 `C` 不支持面向对象编程。对面向对象的版本的\
  \ `C` 的渴望最终导致了 `C++` 的诞生。\n\n`C++` 由 Bjarne Stroustrup 于 1979 年开始在新泽西州穆雷·希尔的贝尔实验室发明。他最初将这种新语言命名为“带类的\
  \ C”。然而，在 1983 年，名称更改为“C++”。`C++` 包含了整个 `C` 语言。因此，`C` 是构建 `C++` 的基础。Stroustrup 对\
  \ `C` 增加的大部分功能都是为了支持面向对象编程而设计的。从本质上说，`C++` 是 `C` 的面向对象版本。\n\n通过在 `C` 的基础上进行构建，Stroustrup\
  \ 提供了一条通往 `OOP` 的平滑迁移路径。`C` 程序员不需要学习一种完全新的语言，只需要学习几个新特性，就可以获得面向对象方法论带来的处。这使得大量程序员能够轻松地从结构化编程转向面向对象编程。因此，到\
  \ 20 世纪 90 年代后半叶，`C++` 成为开发高性能代码的首选语言。\n\n至关重要的是，`C++` 的发明并不是试图创建一个新的编程语言。相反，它是对已经非常成功的语言的增强。这种语言开发方法——从一种现有语言开始并推动其发展——建立了一种持续至今的趋势。\n\
  \n## 互联网和 Java 的兴起\n\n编程语言的下一个重大进展是 `Java`。`Java`（最初被称为 Oak）的工作于 1991 年在太阳微系统公司开始。`Java`\
  \ 设计背后的主要动力是 James Gosling。Patrick Naughton、Chris Warth、Ed Frank 和 Mike Sheridan\
  \ 也发挥了作用。\n\n`Java` 是一种结构化的、面向对象的语言，其语法和哲学源自 `C++`。`Java` 的创新方面在很大程度上不是由于编程艺术的进步（尽管确实有一些进步），而是由于计算环境的变化。在互联网普及之前，大多数程序都是针对特定的\
  \ CPU 和操作系统进行编写和编译的。虽然程序员喜欢重用代码这一点一直是事实，但将程序从一个环境环境移植到另一个环境的能力让位给了更紧迫的问题。然而，随着互联网的兴起，许多不同类型的\
  \ CPU 和操作系统连接在一起，旧的移植性问题变得极其重要。为了解决这个问题，需要一种新语言，而这种新语言就是 `Java`。\n\n`Java` 通过将程序的源代码翻译成称为\
  \ `字节` 的中间语言实现了移植性。这些 `字节` 然后由 Java 虚拟机（`JVM`）执行。\n\n因此，`Java` 程序可以在任何有 `JVM` 的环境中运行。此外，由于\
  \ `JVM` 相对容易实现，它在大量环境中可用。\n\n除了对移植性的需求外，在基于的编程成为现实之前，还有第二个需要解决的基础问题。这个问题就是安全问题。正如所有互联网用户所知，计算机病毒是一个严重且持续的潜在威胁。如果无人信任这些移植程序，它们有什么用呢？谁会冒险执行通过互联网传输的程序呢？它可能包含恶意代码。幸运的是，安全问题的解决方案也同样位于\
  \ `JVM` 和 `字节`。\n\n因为 `JVM` 执行 `字节`，它对程序拥有完全控制权，并防止 `Java` 程序做不该做的事。因此，`JVM` 和 `字节`\
  \ 解决了移植性和安全性问题。\n\n\n\n\n关键在于理解，Java 对字节码的使用与 C 和 C++ 有着本质的区别，而后者几乎总是被编译为可执行的机器码。机器码与特定的\
  \ CPU 和操作系统绑定。因此，如果你想在不同的系统上运行 C/C++ 程序，它需要专门针对该环境重新编译为机器码。为了创建一个能够在各种环境中运行的 C/C++\
  \ 程序，需要为程序创建多个不同的可执行版本。这不仅不切实际，而且非常昂贵。\n\nJava 使用中间语言是一种优雅且具有成本效益的解决方案。C# 也会为了自己的目的采用这种解决方案。\n\
  \n如前所述，Java 继承自 C 和 C++。它的语法基于 C，其对象模型则从 C++ 演变而来。虽然 Java 代码与 C 或 C++ 既不向上兼容也不向下兼容，但它的语法是相似的，使得大量的现有\
  \ C/C++ 程序员可以非常轻松地转向 Java。此外，由于 Java 是在现有范式的基础上构建并改进的，戈林（Gosling）等人可以专注于新的创新特性。正如斯特拉斯俄罗斯鲁（Stroustrup）在创建\
  \ C++ 时不需要“造轮子”一样，戈林在开发 Java 时也不需要创建一个完全的新语言。\n\n# 第 1 章：C# 基础\n\n5\n\n此外，随着 Java\
  \ 的诞生，C 和 C++ 成为了构建新计算机语言的受认可的基底。\n\n## C# 的诞生\n\n虽然 Java 成功地解决了互联网环境中围绕可移植性和安全性的许多问题，但它仍然缺乏一些特性。其中就是就是跨语言互操作性”（`cross-language-interoperability`），也称为“混合语言编程”（`mixed-language-programming`）。这是指一种语言产生的代码能够与另一种语言产生的代码轻松协作。跨语言互操作性对于创建大型分布式软件系统至关重要。对于编写软件组件来说这也是理想的，因为最有价值的组件是那些能够在尽可能多的计算机语言和尽可能多的操作系统环境中使用的。\n\
  \nJava 缺少的另一个特性是与 Windows 平台的深度集成。虽然 Java 程序可以在 Windows 环境中执行（假设已安装 `Java Virtual\
  \ Machine`），但 Java 和 Windows 之间并没有紧密耦合。由于 Windows 是世界上最广泛使用的操作系统，缺乏对 Windows 的直接支持是\
  \ Java 的缺点。\n\n为了满足这些和其他需求，微软开发了 C#。C# 创建于 20 世纪 90 年代后期，是微软整体 `.NET` 战略的一部分。它首次于\
  \ 2000 年中期发布了 Alpha 版本。C# 的首席架构师是安德斯·海尔斯格（Anders Hejlsberg）。\n\nC# 与 C、C++ 和 Java\
  \ 有直接联系。这并非偶然。这三种是世界上使用最广泛且最受喜爱的编程语言。此外，今天几乎所有的专业程序员都认识 C、C++ 或 Java。通过在坚实且易于理解的基础上构建\
  \ C#，C# 为从这些语言迁移提供了一个简易的路径。由于对于海尔斯格来说，“造轮子”既没有必要也不是理想的，因此可以专注于特定的改进和创新。\n\nC# 的家族树如图\
  \ 1-1 所示。C# 的祖父是 C。C# 从 C 派生了语法、许多关键字和运算符。C# 6\n\n图 1-1 C# 家族树\n\n## C# 0：入门指南\n\
  \n如前所述，Java 继承自 C 和 C++。它的语法基于 C，其对象模型则从 C++ 演变而来。虽然 Java 代码与 C 或 C++ 既不向上兼容也不向下兼容，但它的语法是相似的，使得大量的现有\
  \ C/C++ 程序员可以非常轻松地转向 Java。此外，由于 Java 是在现有范式的基础上构建并改进的，戈林等人可以专注于新的创新特性。正如斯特拉斯俄罗斯鲁在创建\
  \ C++ 时不需要“造轮子”一样，戈林在开发 Java 时也不需要创建一个完全的新语言。C# 0\n\nC# 的演进\n\n从最初的 1.0 版本开始，C#\
  \ 一直在以飞快的速度演进。在 C# 1.0 发布后不久，微软发布了 1.1 版本。它包含了许多微调，但没有添加重大特性。然而，随着 C# 2.0 的发布，情况就大不相同了。由于\
  \ C# 2.0 添加了许多新特性，人们可能会认为 C# 的开发速度会放慢，以便程序员跟上进度，但事实并非如此。\n\nC# 的下一次大版本是 3.0（在本文写作时，这是当前版本）。随着\
  \ 3.0 发布，微软再次将 C# 置于语言设计的最前沿，这次添加了一组重新定义了编程格局的特性。也许 C# 3.0 最令人兴奋的两个特性是语言集成查询（LINQ）和\
  \ Lambda 表达式。LINQ 允许你使用 C# 编程元素编写数据库查询。Lambda 表达式经常用于 LINQ。它们共同为 C# 增添了全新的维度。其他创新还包括隐式类型变量和扩展方法。由于本教程基于\
  \ C# 3.0，因此这些重要的特性都涵盖在内。\n\nC# 如何与 .NET Framework 关系\n\n虽然 C# 是一门可以独立研究的计算机语言，但它与它的运行时环境\
  \ .NET Framework 有着特殊的关系。其原因有两点：首先，C# 最初由微软设计，用于为 .NET Framework 创建代码。其次，C# 使用的库是由\
  \ .NET Framework 定义的。因此，尽管可以将 C# 语言与 .NET 环境分离，但两者是紧密相连的。\n\n## 什么是 .NET Framework？\n\
  \n一句话来说，.NET Framework 定义了一个支持开发和执行高度分布式、基于组件的应用的环境。它允许不同的语言协同工作，并为 Windows 平台提供了安全性、程序可移植性和通用编程模型。\n\
  \n对于 C# 而言，.NET Framework 定义了两个非常重要的实体。第一个是 `Common Language Runtime`（公共运行时）。它是管理程序执行的系统。除了其他优点外，`Common\
  \ Language Runtime` 是 .NET Framework 中实现程序可移植性、支持混合语言编程并提供安全性的部分。\n\n\n\n第二个实体是\
  \ .NET `class library`。该库允许你的程序访问运行时环境。例如，如果你想执行 I/O 操作（如在屏幕上显示内容），你将使用 .NET 类库来完成。如果你是编程初学者，`class`（类）这个术对你来说可能很陌生。虽然稍后会进行详细解释，但简之，`class`\
  \ 是一种有助于组织程序的面向对象的构造结构。只要你的程序限制在 .NET 类库所定义的特性范围内，你的程序就可以在任何支持 .NET 运行时系统的环境中运行。由于\
  \ C# 自动使用 .NET 类库，因此 C# 程序可以自动迁移到所有 .NET 环境。\n\n### 通用语言运行时的工作原理\n\n通用语言运行时（`CLR`）负责\
  \ .NET 代码的执行。以下是它的工作原理：当你编译一个 `C#` 程序时，编译器的输出并不是可执行代码。\n\n相反，它是一个包含特殊类型伪代码的文件，称为\
  \ `Microsoft Intermediate Language`（微软中间语言），简称 `MSIL`。`MSIL` 定义了一组独立于任何特定 CPU 的可移植指令集。从本质上说，`MSIL`\
  \ 定义了一种可移植汇编语言。另一点是：尽管 `MSIL` 在概念上与 Java 的字节码相似，但两者并不等同。\n\n在程序运行时，`CLR` 的任务工作是将中间代码翻译成可执行代码。因此，任何编译为\
  \ `MSIL` 的程序都可以在任何实现了 `CLR` 的环境中运行。这是 .NET Framework 实现可移植性的部分机制。\n\n`Microsoft\
  \ Intermediate Language` 通过 `JIT` 编译器转换为可执行代码。`JIT` 代表“即时编译”（just in time）。其工作过程如下：当执行一个\
  \ .NET 程序时，`CLR` 会激活 `JIT` 编译器。`JIT` 编译器会根据需要（在需要程序的每个部分时）将 `MSIL` 转换为原生代码。因此，你的\
  \ `C#` 程序实际上是以原生代码形式执行的，尽管它最初被编译成了 `MSIL`。这意味着你的程序运行速度几乎与从一开始就编译为原生代码一样快，但它获得了 `MSIL`\
  \ 的可移植性和安全性优势。\n\n除了 `MSIL` 之外，编译 `C#` 程序时还会输出另一个内容：`metadata`（元数据）。\n\n元数据描述了程序所使用的数据，并允许你的代码与其他代码交互。元数据包含与\
  \ `MSIL` 相同的文件中。\n\n幸运的是，就本书的内容以及大多数编程任务而言，没有必要了解更多关于 `CLR`、`MSIL` 或元数据的知识。`C#`\
  \ 会为你处理好这些细节。\n\n### 托管代码与非托管代码\n\n通常情况下，当你编写 `C#` 程序时，你正在创建所谓的 `managed code`（托管代码）。\n\
  \n正如前面所述，托管代码是在通用语言运行时的控制下执行的。由于它在 `CLR` 的控制下运行，托管代码受到某些约束——并从中获得了多处好处。这些约束很容易描述和满足：编译器必须生成目标为\
  \ `CLR` 的 `MSIL` 文件（`C#` 是这样做的），并使用 .NET Framework 库（`C#` 也是这样做的）。托管代码的优点非常多，包括现代的内存管理、混合语言的能力、更好的安全性、对版本控制的支持以及软件组件交互的整洁方式。\n\
  \n托管代码的反面是 `unmanaged code`（非托管代码）。非托管代码不在通用语言运行时下执行。因此，在 .NET Framework 创建之前的所有\
  \ Windows 程序都使用非托管代码。托管代码和非托管代码可以协同工作，因此 `C#` 生成托管代码这一事实并不会限制它与预存程序协作的能力。\n\n###\
  \ 通用语言规范\n\n尽管所有托管代码都获得了 `CLR` 提供的好处，但如果你的代码将被由不同语言编写的其他程序使用，为了实现最大的可用性，它应该遵循通用语言规范（`CLS`）。`CLS`\
  \ 描述了一组不同语言共同拥有的特性，例如数据类型。在创建供其他语言使用的软件组件时，遵循 `CLS` 别尤重要重要。虽然对于本书而言我们不需要担心 `CLS`，但当你开始编写商业级代码时，你会想要去研究它的。\n\
  \n### 专家问答\n\n**Q：为了解决可移植性、安全性和混合编程的问题，为什么必须创建一个像 C# 这样的新计算机语言？难道 C++ 这样的语言不能调整以支持\
  \ .NET Framework 吗？**\n\n**A:** 是的，可以调整 `C++` 使其产生可以在 `CLR` 下运行的与 .NET 兼容的代码。事实上，微软确实这样做了。最初，微软为\
  \ `C++` 添加了所谓的 `managed extensions`（托管扩展）。然而，这种方法已经过时，并被 Ecma C++/CLI 标准定义的一系列扩展关键字和语法所取代。\n\
  \n(`CLI` 代表通用语言基础设施 Common Language Infrastructure。）尽管 `C++/CLI` 使现有代码迁移到 .NET Framework\
  \ 成为可能，但在 `C#` 中进行新的 .NET 开发要容易得多，因为它从设计之初就考虑了 .NET。\n\n### 面向对象编程\n\n`C#` 的核心是面向对象编程（`OOP`）。面向对象的方法论与\
  \ `C#` 是不可分割的，且所有 `C#` 程序至少在某种程度上都是面向对象的。由于它对 `C#` 的重要性，在编写即使是简单的 `C#` 程序之前，理解 `OOP`\
  \ 的基本原理是有用的。\n\n`OOP` 是一种处理工作的强大方法。自从计算机发明以来，编程方法发生了巨大变化，主要是为了适应日益增长的复杂度。例如，在计算机刚发明时，编程是通过控制面板拨入二进制机器指令完成的。只要程序只有几百条指令，这种方法就是有效的。随着程序的增长，发明了汇编语言，以便程序员可以使用机器指令的符号表示来处理更大的、更复杂的程序。随着程序的继续增长，引入了如\
  \ `FORTRAN` 和 `COBOL` 等高级语言，为程序员提供了更多处理复杂性的工具。当这些早期语言达到极限时，结构化编程被发明了。\n\n考虑这一点：在编程开发的每个里程碑，都创建了技术和工具来允许程序员处理日益巨大的复杂度。每一步，新方法都吸取了以前方法的精髓并向前发展。\n\
  \n面向对象编程也是如此。在 `OOP` 出现之前，许多项目接近（或超过）了结构化方法失效的界点。需要一种更好的方法来处理复杂性，而面向对象编程就是解决方案。\n\
  \n面向对象编程结合了结构化编程的最佳思想，并引入了几个新概念。结果是组织程序的另一种更好方式。在最广泛的范围内，程序可以通过两种方式之一组织：围绕代码（正在发生什么）或围绕数据（受影响的对象）。仅使用结构化编程技术时，程序通常围绕代码组织。这种方法可以被认为是“代码作用于数据”。\n\
  \n面向对象程序的工作方式则相反。它们围绕数据组织，核心原则是“数据控制代码的访问”。在面向对象语言中，你定义了数据以及允许作用于该数据的例程。因此，数据类型精确地定义了对该数据可以执行哪些操作。\n\
  \n\n\n为了支持面向对象的编程原则，所有的 OOP 语言（包括 `C#`）都具有三个共同特征：封装、多态和继承。让我们逐一检查这些特征。\n\n## 封装\
  \ (Encapsulation)\n\n封装是一种编程机制，它将代码与其操作的数据绑定在一起，并保护它们免受外部干扰和误用的影响。在面向对象的语言中，代码和数据可以绑定在一起，从而创建一个自包含的`black\
  \ box`（黑盒）。该盒子内部包含了所有必要的数据和代码。当代码和数据以这种方式链接在一起时，一个对象就被创建了。换句话说，对象是支持封装的设备。\n\n在对象内部，代码、数据或两者可以是该对象的\
  \ `private`（私有的），也可以是 `public`（公共的）。私有代码或数据仅由对象的另一个部分感知并访问。这意味着，对象外部的程序片段无法访问私有代码或数据。当代码或数据为\
  \ `public` 时，程序的程序的其他部分都可以访问它，即使它是定义在对象内部的。\n\n通常，对象的公共部分用于为对象的私有元素提供一个受控的接口。\n\n\
  `C#` 封装的基本单元是`class`（类）。`class` 定义了对象的形状。它规定了将对该数据操作的数据和代码。`C#` 使用类规范来构建 `objects`（对象）。对象是\
  \ `class` 的实例。因此，`class` 本质上是一组指定如何构建对象的方案。\n\n构成类的代码和数据被称为类的 `members`（成员）。具体来说，由类定义的数据被称为\
  \ `member variables`（成员变量）或 `instance variables`（实例变量）。操作这些数据的代码被称为 `member methods`（成员方法）或直接称为\
  \ `methods`（方法）。“Method”是 `C#` 对子程序的术语。如果你熟悉 `C/C++`，知道 `C#` 程序员称为 `method` 的 `C/C++`\
  \ 程序员称为 `function`（函数）可能会有所帮助。因为 `C#` 是 `C++` 的直接后代，在引用 `C#` 方法时有时也会使用“function”一词。\n\
  \n## 多态 (Polymorphism)\n\n多态（源自希腊语，意为“多种形式”）允许一个接口访问一类通用动作的特性。多态的一个简单示例是汽车的方向盘。无论使用何种实际的转向机构，方向盘（接口）都是相同的。也就是说，无论你的汽车是手动转向、助力转向还是齿条齿圈转向，方向盘的工作方式都是样的。因此，无论使用什么类型的转向，向左转方向盘都会导致汽车向左行驶。统一接口的处显然是，一旦你学会了如何操作方向盘，就可以驾驶任何类型的汽车。\n\
  \n同样的原理也适用于编程。例如，考虑一个栈（这是一种后进先出的列表）。你可能有一个需要三种不同类型栈的程序。\n\n一个栈用于整数值，一个用于浮点值，一个用于字符。在这种情况下，尽管存储的数据有所不同，但实现每个栈的算法是相同的。在非面向对象的语言中，你将被要求创建三组不同的栈例程，且每组都使用不同的名称。然而，由于多态的存在，在\
  \ `C#` 中，你可以一次指定栈的通用形式，然后将其应用于所有三种特定情况。这样来，如果你知道如何使用一个栈，你就可以使用所有的栈。\n\n更通地说，多态的概念通常用“一个接口，多个方法”这句话来表达。这意味着可以为一组相关活动设计一个通用接口。多态通过允许使用相同的接口来指定\
  \ `general class of action`（通用动作类），有助于降低复杂性。编译器的工作是根据每种情况选择 `specific action`（即方法）。你，作为程序员，不需要手动进行这种选择。你只需要记住并利用通用接口即可。\n\
  \n## 继承 (Inheritance)\n\n继承一个对象获取另一个对象属性的过程。这很重要，因为支持了层级分类的概念。如果你仔细考虑，绝大多数知识都是通过层级（即自上而下）的分类变得易于管理的。\n\
  \n### 专家问问答 (Ask the Expert)\n\n**Q：你提到面向对象编程是管理大型程序的有效方法。然而，OOP 似乎会给较小的程序增加大量的开销。既然你说所有\
  \ C# 程序在某种程度上都是面向对象的，那么这会对较小的程序产生惩罚吗？**\n\n**A：** 不会。正如你将看到的，对于小型程序，`C#` 的面向对象特征几乎是透明的。\n\
  \n虽然 `C#` 遵循严格的对象模型是事实，但在你使用它的程度上，你拥有很大的自由度。对于较小的程序，它们的“面向对象化”几乎是察觉不到的。随着程序的增长，你将毫不费力地整合更多的面向特征。\n\
  \n例如，红富士苹果是 `apple` 分类的一部分，而 `apple` 又是 `fruit` 类的一部分，`fruit` 又属于更大的类 `food`。这意味着，`food`\
  \ 类具有某些属性（可食用的、有营养的等），这些属性在逻辑上也适用于它的子类 `fruit`。除了这些属性外，`fruit` 类还有特定的特征（多汁、甜等），这些特征将它与其他食物区分开来。`apple`\
  \ 类定义了苹果特有的属性（生长在树上、不是热带水果等）。红富士苹果反过来会继承所有之前的类，并只定义它特有的属性。如果不使用继承，每个对象都要显式地定义所有特征。使用继承，对象只需要从父类继承。因此，是继承机制使得一个对象成为通用情况的具体实例。\n\
  \n## 创建、编译和运行 (Creating, Compiling, and Running)\n\n### 你的第一个 C# 程序\n\n现在是学习如何创建、编译和运行\
  \ C# 程序了。由于本书是 C# 编程的“上手”指南，成功完成这些任务是必要的第一步。这里是我们将使用的程序：\n\n```csharp\n/*\n\n这是一个简单的\
  \ C# 程序。\n\n调用此程序 Example.cs。\n\n*/\n\nusing System;\n\nclass Example {\n\n// C#\
  \ 程序从 Main 调用开始。\n    static void Main() {\n\n        Console.WriteLine(\"C# 给你编程力量.\"\
  );\n\n    }\n\n}\n```\n\n尽管程序很短，但它包含了所有 C# 程序共同的一些关键特征。在你学会如何编译和运行它之后，我们将对其进行详细检查。\n\
  \n### 获取 C# 3.0 编译器\n\n要创建、编译和运行 C# 程序，你需要一个 Visual C# 拷贝。本书使用 Visual C# 2008，它是支持\
  \ C# 3.0 的编译器。虽然书中的许多程序可以使用较早版本的 C# 编译，但你将需要 Visual C# 2008 来处理新功能。\n\n如果你目前没有 Visual\
  \ C# 2008，你需要获取它。微软提供多种形式的 Visual C# 2008，包括可以购买的商业版本。然而，在写作期间，你也可以通过下载 Express\
  \ 版免费获取副本。Visual C# Express 版包含一个功能齐全的编译器，支持所有的 C# 3.0 功能，因此能够编译书中的所有代码。它还包含了 Visual\
  \ Studio，这是微软的集成开发环境 (IDE)。\n\n\n\n\n\n虽然 Express 版本没有提供商业开发者可能需要的所有工具，但它非常适合学习\
  \ C#。在编写本文时，可以从 [www.microsoft.com/express](http://www.microsoft.com/express) 下载\
  \ Visual C# 2008 Express。书中的所有代码都经过了该编译器的测试。\n\n使用 Visual C# 来说，你有两种通用方法来创建、编译和运行\
  \ C# 程序。首先，你可以使用 Visual Studio IDE。其次，你可以使用命令行编译器 `csc.exe`。这里将详细介绍这两种方法。\n\n##\
  \ 使用 Visual Studio IDE\n\n如前所述，Visual Studio 是微软的集成开发环境。它允许你编辑、编译、运行和调试 C# 程序，而无需离开其设计精良的环境。Visual\
  \ Studio 提供了便利性并帮助你管理程序。它对于较大的项目最为有效，但也可以很好地用于较小的程序，例如本书中的示例程序，并取得巨大成功。\n\n这里展示了使用\
