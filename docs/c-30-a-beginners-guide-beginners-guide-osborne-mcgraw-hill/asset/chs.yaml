  \ 继承自 `Vehicle` 并添加了 `CargoCap` 属性。因此，`Truck` 包含了由 `Vehicle` 定义的所有通用车辆属性。它只需要添加其自身类特有的项。注意，`CargoCap`\
  \ 也是一个自动实现属性，其 `set` 访问访问器被指定为 `protected`。这意味着它可以被任何继承自 `Truck` 的类访问，但在其他情况下是私有的。\n\
  \n4. 下面是一个展示了 `Truck` 类的完整程序：\n\n```csharp\n// 为卡车创建一个 Vehicle 的派生类。\n\nusing System;\n\
  \nclass Vehicle {\n    // 这是 Vehicle 的构造函数。\n    public Vehicle(int p, int f, int\
  \ m) {\n        Passengers = p;\n        FuelCap = f;\n        Mpg = m;\n    }\n\
  \n    // 返回行驶范围。\n    public int Range() {\n        return Mpg * FuelCap;\n    }\n\
  \n    // 计算给定距离所需的燃料。\n    public double FuelNeeded(int miles) {\n        return\
  \ (double) miles / Mpg;\n    }\n\n    /* 用于乘客、\n    燃料容量和英里程的自动实现属性。注意这些\n    set\
  \ 访问器是保护的。 */\n    public int Passengers { get; protected set; }\n    public int\
  \ FuelCap { get; protected set; }\n    public int Mpg { get; protected set; }\n\
  }\n\n// 使用 Vehicle 创建 Truck 的特化类。\nclass Truck : Vehicle {\n    // 这是 Truck 的构造函数。\n\
