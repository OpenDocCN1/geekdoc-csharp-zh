  public override void MyMethod() { /* ... */ }\n}\n```\n\n由于 `MyMethod()` 被 `D` 密封，它不能被\
  \ `X` 重写。\n\n# Object 类\n\nC# 定义了一个名为 `object` 的特殊类，它是所有其他类的隐式基类，适用于所有其他类型（包括值类型）。换句话说，所有\
  \ C# 类型都派生自 `object`。这意味着 `object` 类型的引用变量可以引用任何其他类型的对象。此外，由于数组是作为对象实现的，`object`\
  \ 类型的变量也可以引用任何数组。从技术来说，C# 的名称 `object` 只是 `System.Object` 的另一个名称，它是 .NET Framework\
  \ 类库的一部分。\n\n`object` 类定义了以下方法，这意味着它们在每个对象中都是可用的。\n\n| 方法 | 目的 |\n| :--- | :---\
  \ |\n| `public virtual bool Equals(object ob)` | 判断调用对象是否与 `ob` 指向的对象相同。 |\n| `public\
  \ static bool Equals(object ob1, object ob2)` | 判断 `ob1` 是否与 `ob2` 相同。 |\n| `protected\
  \ virtual void Finalize()` | 在垃圾回收之前执行关闭操作。在 C# 中，通过析构函数访问 `Finalize`。 |\n| `public\
  \ virtual int GetHashCode()` | 返回与调用对象相关的哈希码。 |\n| `public Type GetType()` | 在获取对象的类型。\
  \ |\n| `protected object MemberwiseClone()` | 创建对象的“浅拷贝”。其中成员被复制，但成员所引的对象不会被复制。\
  \ |\n| `public static bool ReferenceEquals(object ob1, object ob2)` | 确定 `ob1` 和\
  \ `ob2` 是否指向同一个对象。 |\n| `public virtual string ToString()` | 返回描述该对象的字符串。 |\n\n\
  这些方法中的一些需要额外的解释。默认情况下，`Equals(object)` 方法判断调用对象是否与参数指向的对象是同一个。（也就是说，它判断两个引用是否相同。）如果对象相同，则返回\
  \ `true`，否则返回 `false`。你可以在自己创建的类中重写此方法。这样做允许你定义相对于某个类的“等性”含义。\n\n例如，你可以定义 `Equals(object)`\
  \ 以便比较两个对象的内容以判断相等。`Equals(object, object)` 方法调用 `Equals(object)` 来计算其结果。\n\n`GetHashCode()`\
  \ 方法返回与调用对象相关的哈希码。该哈希码可以用于任何使用哈希作为访问存储对象手段的算法。\n\n正如第 7 章提到的，如果你重载了 `=` 运算符，你通常需要重写\
  \ `Equals(object)` 和 `GetHashCode()`，以便这些方法兼容。`ToString()` 方法返回一个描述对象的字符串。当当使用 `WriteLine()`\
  \ 输出对象时，会自动调用此方法。许多类都重写了此方法。这样做允许它们为创建的类型定制描述。例如：\n\n```csharp\n// Demo ToString()\n\
  using System;\n\nclass MyClass {\n\nstatic int count = 0;\n\nint id;\n\npublic MyClass()\
  \ {\n\nid = count;\n\ncount++;\n}\n\npublic override string ToString() {\n\n// 重写\
  \ ToString()\nreturn \"MyClass object #\" + id;\n}\n\n}\n\nclass Test {\n\nstatic\
  \ void Main() {\n\nMyClass ob1 = new MyClass();\n\nMyClass ob2 = new MyClass();\n\
  \nMyClass ob3 = new MyClass();\n\nConsole.WriteLine(ob1);\n\nConsole.WriteLine(ob2);\
  \ // 在此处自动调用 ToString()\n\nConsole.WriteLine(ob3);\n\n}\n\n}\n```\n\n程序的输出所示：\n\
  ```\nMyClass object #0\nMyClass object #1\nMyClass object #2\n```\n\n## 装箱与解箱\n\n\
  正如解释过的，所有 C# 类型包括值类型都派生自 `object`。因此，`object` 类型的引用可以引用任何其他类型，包括值类型。当 `object` 引用值类型时，就会发生被称为装箱（boxing）的过程。装箱将值类型的值存储在对象实例中。因此，值类型被“装”在对象内部。该对象可以像任何其他对象一样使用。在所有情况下，装箱都会自动发生。你只需将值赋值给\
  \ `object` 引用。\n\n解箱（unboxing）是从对象中提取值的过程。此操作通过从 `object` 引用强制转换到所需的值类型来执行。尝试将对象解箱为不兼容的类型会导致运行时错误。这里有一个说明装箱和解箱的简单示例：\n\
  \n```csharp\n// 一个简单的装箱/解箱示例。\nusing System;\n\nclass BoxingDemo {\n\nstatic void\
  \ Main() {\n\nint x;\n\nobject obj;\n\nx = 10;\n\nobj = x; // 将 x 装箱为对象\n\n在这里，x\
  \ 的值被装箱了。\n\nint y = (int)obj; // 将 obj 解箱为 int\n\n在这里，值被解箱了。\n\nConsole.WriteLine(y);\n\
  \n}\n\n}\n}\n```\n\n\n\n\n此程序显示值 10。注意 `x` 中的值通过简单地赋值给 `obj` 来装箱，`obj` 是一个 `object`\
  \ 引用。`obj` 中的整数值通过将 `obj` 强制转换为 `int` 来获取。\n\n这里是另一个趣的装箱示例。在这种情况下，一个 `int` 被作为参数传递给\
  \ `Sqr()` 方法，该方法使用 `object` 类型参数。\n\n```cs\n// 在传递值时也会发生装箱。\n\nusing System;\n\n\
  class BoxingDemo {\n    static void Main() {\n        int x;\n        x = 10;\n\
  \        Console.WriteLine(\"Here is x: \" + x);\n\n        // x 在传递给 Sqr() 时自动装箱。\n\
  \        // x 中的值被装箱\n        x = BoxingDemo.Sqr(x);\n        // 在调用 Sqr() 时完成。\n\
  \        Console.WriteLine(\"Here is x squared: \" + x);\n    }\n\n    static int\
  \ Sqr(object o) {\n        return (int)o * (int)o;\n    }\n}\n```\n\n程序的输出所示：\n\n\
  ```\nHere is x: 10\nHere is x squared: 100\n```\n\n在这里，`x` 的值在传递给 `Sqr()` 时被自动装箱。\n\
  \n装箱和拆箱允许 C# 的类型系统实现完全统一。所有类型都派生自 `object`。任何类型的引用都可以赋值给 `object` 类型的变量。装箱/拆箱会自动处理值类型的细节。此外，由于所有类型都派生自\
  \ `object`，因此它们都可以访问 `object` 的方法。例如，考虑以下这个相当出乎意料的程序：\n\n```cs\n// 装箱使得在值上调用方法成为可能！\n\
  \nusing System;\n\nclass MethOnValue {\n    static void Main() {\n        Console.WriteLine(186.ToString());\n\
  \        // 在 C# 中是完全合法的\n    }\n}\n```\n\n此程序显示 186。原因是 `ToString()` 方法返回其被调用的对象的字符串表示。在这种情况下，186\
  \ 的字符串表示就是 186！\n\n### 第 8 章自测\n\n1. 基类是否可以访问派生类的成员？派生类是否可以访问基类的成员？\n2. 创建一个 `TwoDShape`\
  \ 的派生类，名为 `Circle`。包含一个计算圆面积的 `Area()` 方法，以及一个使用 `base` 来初始化 `TwoDShape` 部分的构造函数。\n\
  3. 如何防止派生类访问基类的成员？\n4. 描述 `base` 的用途。\n5. 给定以下层级结构，当实例化 `Gamma` 对象时，这些类的构造函数按什么顺序被调用？\n\
  \   ```cs\n   class Alpha { ... }\n   class Beta : Alpha { ... }\n   class Gamma\
  \ : Beta { ... }\n   ```\n6. 基类引用可以指向派生类对象。解释为什么这与方法重写非常重要。\n7. 什么是抽象类？\n8. 如何防止一个类被继承？\n\
  9. 解释继承、方法重写和抽象类是如何用于支持多态性的。\n10. 哪个类是所有其他类的基类？\n11. 解释装箱。\n12. 如何访问 `protected`\
  \ 成员？\n\n# 第 9 章：接口、结构体和枚举\n\n## 核心技能与概念\n- 接口基础\n- 为接口添加属性和索引器\n- 继承接口\n- 显式实现\n\
  - 结构体\n- 枚举\n\n本章讨论了 C# 最重要的特性之一：接口。`interface` 定义了一组将由类实现的方法。接口本身不实现任何方法。它是一个纯粹的逻辑构件，描述了类将提供的一组方法，而不规定实现的具体细节。\n\
  \n本章还讨论了另外两种 C# 数据类型：`structures`（结构体）和 `enumerations`（枚举）。\n\n结构体与类相似，区别在于它们被处理为值类型而不是引用类型。枚举是命名整数常量的列表。结构体和枚举贡献了\
  \ C# 编程环境的丰富性，为许多编程问题提供了优雅的解决方案。\n\n### 接口\n\n在面向对象编程中，定义一个类“必须做什么”而不是“将如何做”有时是有帮助的。你已经见过这方面的例子：抽象方法。抽象方法定义了方法的签名，但不提供实现。派生类必须为其基类定义的每个抽象方法提供它自己的实现。因此，抽象方法指定了方法的\
  \ `interface`（接口），而不是 `implementation`（实现）。虽然抽象类和方法很有用，但可以将这一概念更进一步。在 C# 中，你可以通过\
  \ `interface` 关键字将类的接口与其实现完全分离。\n\n接口在语法上与抽象类相似。然而，在接口中，任何方法都不能包含方法体。也就是说，接口没有提供任何实现。它指定了必须做什么，而不是怎么做。一旦定义了接口，任意数量的类都可以实现它。此外，一个类可以实现任意数量的接口。\n\
  \n为了实现接口，类必须为接口描述的方法提供体（实现）。每个类都可以自由决定自己的细节。因此，两个类可能会以不同的方式实现同一个接口，但每个类仍然支持相同的方法集。因此，了解接口的代码可以充分利用多态性中“一个接口，多种方法”的特性。\n\
  \n接口使用 `interface` 关键字声明。以下是接口的简化形式：\n\n```cs\ninterface name {\n    ret-type method-name1(param-list);\n\
  \    ret-type method-name2(param-list);\n    // ...\n    ret-type method-nameN(param-list);\n\
  }\n```\n\n接口的名称由 `name` 指定。方法仅使用其返回类型和签名进行声明。它们本质上是抽象方法。正如所解释的，在接口中，任何方法都没有实现。因此，每个包含接口的类必须实现该接口声明的所有方法。在接口中，方法隐式为\
  \ `public`（公共），且不允许使用任何显式访问限定符。\n\n这是一个接口的示例。它为一个生成系列数字的类指定了接口：\n\n```cs\npublic\
  \ interface ISeries {\n    int GetNext(); // 返回序列中的下一个数字\n    void Reset(); // 重置\n\
  \    void SetStart(int x); // 设置起始值\n}\n```\n\n此接口被声明为 `public`，以便任何程序中的任何类都可以实现。\n\
  \n除了方法签名外，接口还可以声明属性、索引器和事件的签名。事件将在第 12 章中描述，我们这里只关注方法、属性和索引器。接口不能拥有数据成员。它们不能定义构造函数、析构函数或运算符方法。此外，没有成员可以声明为\
  \ `static`（静态）。\n\n### 实现接口\n\n一旦定义了 `interface`，一个或多个类就可以实现该接口。要实现接口，在类名之后指定接口名称，这与指定基类的方式完全相同。实现接口的类的通用形式所示：\n\
  \n```cs\nclass class-name : interface-name {\n    // 类体\n}\n```\n\n正在实现的接口名称由 `interface-name`\
  \ 指定。当一个类实现接口时，该类必须实现整个接口。例如，它不能选择性地实现部分。\n\n\n\n\n类可以实现多个接口。要实现多个接口，接口之间用逗号隔开。一个类可以继承一个基类并实现一个或多个接口。在这种情况下，基类的名称必须在逗号分隔的列表中排在第一。\n\
  \n实现接口的方法必须声明为 `public`（公共）。这是因为方法在接口内部是隐式为公的，因此它们的实现也必须是 `public` 的。此外，实现方法的方法的类型签名必须与\
  \ `interface` 定义中指定的类型签名完全匹配。\n\n这里是一个实现之前显示的 `ISeries` 接口的示例。它创建了一个名为 `ByTwos`\
  \ 的类，该类会生成一组数字，每个数字都比前一个大 2。\n\n```cs\n// Implement ISeries.\n\nImplement the ISeries\
  \ interface.\n\nclass ByTwos : ISeries {\n\n    int start;\n    int val;\n\n   \
  \ public ByTwos() {\n        start = 0;\n        val = 0;\n    }\n\n    public int\
  \ GetNext() {\n        val += 2;\n        return val;\n    }\n\n    public void\
  \ Reset() {\n        start = 0;\n        val = 0;\n    }\n\n    public void SetStart(int\
  \ x) {\n        start = x;\n        val = x;\n    }\n}\n```\n\n如你所见，`ByTwos` 实现了\
  \ `ISeries` 定义的所有三个方法。正如所解释，这是必要的，因为类不能创建接口的部分实现。\n\n以下是一个演示 `ByTwos` 的类：\n\n```cs\n\
  // Demonstrate the ByTwos interface.\n\nusing System;\n\nclass ISeriesDemo {\n \
  \   static void Main() {\n        ByTwos ob = new ByTwos();\n\n        for(int i=0;\
  \ i < 5; i++)\n            Console.WriteLine(\"Next value is \" + ob.GetNext());\n\
  \n        Console.WriteLine(\"\\nResetting\");\n        ob.Reset();\n\n        for(int\
  \ i=0; i < 5; i++)\n            Console.WriteLine(\"Next value is \" + ob.GetNext());\n\
  \n        Console.WriteLine(\"\\nStarting at 100\");\n        ob.SetStart(100);\n\
  \n        for(int i=0; i < 5; i++)\n            Console.WriteLine(\"Next value is\
  \ \" + ob.GetNext());\n    }\n}\n```\n\n要编译 `ISeriesDemo`，你必须将 `ISeries`、`ByTwos`\
  \ 和 `ISeriesDemo` 类包含在编译。编译器会自动编译所有三个文件以创建最终的可执行文件。例如，如果你将这些文件命名为 `ISeries.cs`、`ByTwos.cs`\
  \ 和 `ISeriesDemo.cs`，那么运行以下命令行将编译程序：\n\n```\ncsc ISeries.cs ByTwos.cs ISeriesDemo.cs\n\
  ```\n\n如果你正在使用 Visual Studio IDE，只需将所有三个文件添加到你的 C# 项目中。另外一点：将这三个类放在同一个文件中也是完全有效的。\n\
  \n该程序的输出所示：\n\n```\nNext value is 2\nNext value is 4\nNext value is 6\nNext value\
  \ is 8\nNext value is 10\nResetting\nNext value is 2\nNext value is 4\nNext value\
  \ is 6\nNext value is 8\nNext value is 10\nStarting at 100\nNext value is 102\n\
  Next value is 104\nNext value is 106\nNext value is 108\nNext value is 110\n```\n\
  \n实现接口的类定义自己的额外成员是被允许的也是常见的。例如，以下 `ByTwos` 的版本增加了 `GetPrevious()` 方法，该方法返回上一个值：\n\
  \n```cs\n// Implement ISeries and add GetPrevious().\n\nclass ByTwos : ISeries {\n\
  \    int start;\n    int val;\n    int prev;\n\n    public ByTwos() {\n        start\
  \ = 0;\n        val = 0;\n        prev = -2;\n    }\n\n    public int GetNext()\
  \ {\n        prev = val;\n        val += 2;\n        return val;\n    }\n\n    public\
  \ void Reset() {\n        start = 0;\n        val = 0;\n        prev = -2;\n   \
  \ }\n\n    public void SetStart(int x) {\n        start = x;\n        val = x;\n\
  \        prev = x - 2;\n    }\n\n    // A method not specified by ISeries.\n   \
  \ int GetPrevious() {\n        // Add a method not defined by ISeries.\n       \
  \ return prev;\n    }\n}\n```\n\n注意，添加 `GetPrevious()` 要求对 `ISeries` 定义的方法实现进行更改。然而，由于指向这些方法的接口保持不变，这种更改是无缝的，不会破坏现有的代码。这是接口的优势之一。\n\
  \n正如所解释的，任意数量的类都可以实现 `interface`。例如，这里有一个名为 `ByThrees` 的类，它生成一组数字，每个数字都比前一个大 3：\n\
  \n```cs\n// Implement ISeries.\n\nclass ByThrees : ISeries {\n    // Implement ISeries\
  \ a different way.\n    int start;\n    int val;\n\n    public ByThrees() {\n  \
  \      start = 0;\n        val = 0;\n    }\n\n    public int GetNext() {\n     \
  \   val += 3;\n        return val;\n    }\n\n    public void Reset() {\n       \
  \ start = 0;\n        val = 0;\n    }\n\n    public void SetStart(int x) {\n   \
  \     start = x;\n        val = x;\n    }\n}\n```\n\n### 使用接口引用\n\n你可能会惊讶地发现可以声明一个接口类型的变量。换句话说，你可以存储任何实现接口对象的引用。这与使用基类引用相似。下面的示例说明了接口引用的使用。\n\
  \n```cs\nusing System;\n\nclass ISeriesDemo {\n    static void Main() {\n      \
  \  ByTwos twoOb = new ByTwos();\n        ByThrees threeOb = new ByThrees();\n  \
  \      ISeries ob;\n\n        for(int i=0; i < 5; i++) {\n            ob = twoOb;\n\
  \            Console.WriteLine(\"Next ByTwos value is \" + ob.GetNext());\n\n  \
  \          ob = threeOb;\n            Console.WriteLine(\"Next ByThrees value is\
  \ \" + ob.GetNext());\n        }\n    }\n}\n```\n\n### 尝试创建一个队列接口\n\n为了看到接口的威力，我们将查看一个实际示例。在之前的章节中，你开发了一个实现固定大小字符队列的\
  \ `Queue` 类。\n\n然而，实现队列有很多方法。例如，队列可以是固定大小的，也可以是“可增长的”。队列可以是*线性的*，在这种情况下它会被用尽；也可以是*环形的*，在这种情况下只要有元素被取出，就可以一直放入元素。\n\
  \n队列也可以存储在数组、链表、二叉树等中。无论如何实现队列，队列的接口保持不变，`Put()` 和 `Get()` 方法独立于实现细节定义了队列接口。\n\n\
  \n\n因为队列的接口与其实现是分离的，因此很容易定义一个队列接口，将具体细节留给每个实现来定义。\n\n在这里，我们将为字符队列创建一个接口以及三个实现。这三个实现都将使用数组来存储字符。其中一个队列是之前开发的\
  \ `SimpleQueue` 类。另一个是循环队列。在循环队列中，当遇到底层数组的末尾时，`get` 和 `put` 索引会自动循环回开头。因此，只要不断取出项，就可以在循环队列中存储任意数量的项。最后一种实现创建了一个动态队列，当其大小超过容量时会根据需要增长。\n\
  \n*(续上)*\n\n342\n\nC# 3.0: 入学者指南\n\n逐步操作\n\n1.  创建一个名为 `ICharQ.cs` 的文件，并在该文件中放入以下接口定义：\n\
  \n```csharp\n// 字符队列接口。\n\npublic interface ICharQ {\n    // 将一个字符放入队列。\n    void\
  \ Put(char ch);\n\n    // 从队列中获取一个字符。\n    char Get();\n}\n```\n\n如你所见，这个接口非常简单，只包含两个方法。每个实现\
  \ `ICharQ` 的类都需要实现这些方法。\n\n2.  创建一个名为 `IQDemo.cs` 的文件。\n\n3.  通过添加此处所示的 `SimpleQueue`\
  \ 类开始创建 `IQDemo.cs`：\n\n```csharp\n// 演示 ICharQ 接口。\n\nusing System;\n\n// 一个用于字符的简单固定大小队列类。\n\
  class SimpleQueue : ICharQ {\n    char[] q; // 此数组持有队列\n    int putloc, getloc;\
  \ // put 和 get 索引\n\n    // 根据给定大小构造一个空队列。\n    public SimpleQueue(int size) {\n\
  \        q = new char[size+1]; // 为队列分配内存\n        putloc = getloc = 0;\n    }\n\
  \n    // 将一个字符放入队列。\n    public void Put(char ch) {\n        if(putloc==q.Length-1)\
  \ {\n            Console.WriteLine(\" -- 队列已满.\");\n            return;\n      \
  \  }\n        putloc++;\n        q[putloc] = ch;\n    }\n\n    // 从队列中获取一个字符。\n\
  \    public char Get() {\n        if(getloc == putloc) {\n            Console.WriteLine(\"\
  \ -- 队列已空.\");\n            return (char) 0;\n        }\n        getloc++;\n   \
  \     return q[getloc];\n    }\n}\n```\n\n此 `ICharQ` 的实现改编自第 5 章所示的 `SimpleQueue`\
  \ 类，你应该已经对其熟悉了。\n\n4.  在 `IQDemo.cs` 中添加此处所示的 `CircularQueue` 类。它实现了一个字符的循环队列。\n\
  \n```csharp\n// 循环队列。\nclass CircularQueue : ICharQ {\n    char[] q; // 此数组持有队列\n\
  \    int putloc, getloc; // put 和 get 索引\n\n    // 根据给定大小构造一个空队列。\n    public CircularQueue(int\
  \ size) {\n        q = new char[size+1]; // 为队列分配内存\n        putloc = getloc = 0;\n\
  \    }\n\n    // 将一个字符放入队列。\n    public void Put(char ch) {\n        /* 如果 putloc\
  \ 比 getloc 小 1，\n        或者 putloc 在数组末尾且 getloc 在开头，\n        则队列满。 */\n      \
  \  if(putloc+1==getloc ||\n        ((putloc==q.Length-1) && (getloc==0))) {\n  \
  \          Console.WriteLine(\" -- 队列已满.\");\n            return;\n        }\n \
  \       putloc++;\n        if(putloc==q.Length) putloc = 0; // 循环回\n        q[putloc]\
  \ = ch;\n    }\n\n    // 从队列中获取一个字符。\n    public char Get() {\n        if(getloc\
  \ == putloc) {\n            Console.WriteLine(\" -- 队列已空.\");\n            return\
  \ (char) 0;\n        }\n        getloc++;\n        if(getloc==q.Length) getloc =\
  \ 0; // 循环回\n        return q[getloc];\n    }\n}\n```\n\n循环队列通过重用元素检索时释放的数组空间来工作。因此，只要元素不断被移除，它就可以存储无限数量的元素。虽然在概念上很简单——只需在到达数组末尾时将相应的索引重置为零——但边界条件起初有点令人困惑。在循环队列中，队列满并不是当到达底层数组末尾时，而是当存储一个项会导致未检索的项被覆盖时。因此，`Put()`\
  \ 必须检查几个条件来判断队列是否满。正如注释所示，当 `putloc` 比 `getloc` 小 1，或者 `putloc` 在数组末尾且 `getloc`\
  \ 在开头时，队列为满。和之前一样，当 `getloc` 和 `putloc` 相等时，队列为空。\n\n5.  最后，在 `IQDemo.cs` 中放入接下来所示的\
  \ `DynQueue` 类。它实现了循环队列的“可增长”版本，当空间耗尽时会扩展其大小。\n\n```csharp\n// 动态循环队列。\n// 此实现在队列满时会自动将队列\
  \ 大小翻倍。\nclass DynQueue : ICharQ {\n    char[] q; // 此数组持有队列\n    int putloc, getloc;\
  \ // put 和 get 索引\n\n    // 根据给定大小构造一个空队列。\n    public DynQueue(int size) {\n  \
  \      q = new char[size+1]; // 为队列分配内存\n        putloc = getloc = 0;\n    }\n\n\
  \    // 将一个字符放入队列。\n    public void Put(char ch) {\n        // 如果队列满，则翻倍大小。\n  \
  \      if(putloc == q.Length-1) {\n            char[] newQ = new char[q.Length *\
  \ 2];\n            Array.Copy(q, 0, newQ, 0, q.Length);\n            q = newQ;\n\
  \        }\n        putloc++;\n        if(putloc==q.Length) putloc = 0; // 循环回\n\
  \        q[putloc] = ch;\n    }\n\n    // 从队列中获取一个字符。\n    public char Get() {\n\
  \        if(getloc == putloc) {\n            Console.WriteLine(\" -- 队列已空.\");\n\
  \            return (char) 0;\n        }\n        getloc++;\n        if(getloc==q.Length)\
  \ getloc = 0; // 循环回\n        return q[getloc];\n    }\n}\n```\n\n\n\n固定队列的内容：ABCDEFGHIJ\n\
  \n动态队列的内容：ZYXWVUTSRQ\n\n循环队列的内容：ABCDEFGHIJ\n\n循环队列的内容：KLMNOPQRST\n\n从循环队列中存储和消费。\n\
  \nABCDEFGHIJKLMNOPQRST\n\n9. 这里有两件事你可以自己尝试。为 `ICharQ` 添加一个 `Reset( )` 方法来重置队列。创建一个\
  \ `static` 方法，将一种类型队列的内容复制到另一种队列中。\n\n## 接口属性 (Interface Properties)\n\n与方法一样，属性在接口中指定时不包含任何正体（body）。以下是属性规范的通用形式：\n\
  \n```csharp\n// 接口属性\ntype name {\n    get;\n    set;\n}\n```\n\n348\nC# 3.0：初学者指南\n\
  \n当然，对于只读属性或只写属性，分别只存在 `get` 或 `set`。\n\n尽管在接口中声明的属性的形式看起来与在类中声明自动实现属性的形式相似，但两者并不是一回事。接口声明不会导致属性被自动实现。它只是指定了属性的名称和类型。实现留给了每个实现类。此外，当在\
  \ `interface` 中声明属性时，访问器不允许使用访问修饰符。因此，在 `interface` 中不能将 `set` 访问器指定为 `private`。\n\
  \n以下是 `ISeries` 接口和 `ByTwos` 类的重写，它们使用属性来获取和设置序列中的下一个元素：\n\n```csharp\n// 在接口中使用属性。\n\
  using System;\n\npublic interface ISeries {\n    // 一个接口属性。\n    int Next {\n  \
  \      // 在 ISeries 接口中声明属性。\n        get; // 返回序列中的下一个数字\n        set; // 设置下一个数字\n\
  \    }\n}\n\n// 实现 ISeries。\nclass ByTwos : ISeries {\n    int val;\n    public\
  \ ByTwos() {\n        val = 0;\n    }\n    // 获取或设置值。\n    public int Next {\n \
  \       // 实现属性。\n        get {\n            val += 2;\n            return val;\n\
  \        }\n        set {\n            val = value;\n        }\n    }\n}\n\n// 演示接口属性。\n\
  class ISeriesDemo3 {\n    static void Main() {\n        ByTwos ob = new ByTwos();\n\
  \        // 通过属性访问序列。\n        for(int i=0; i < 5; i++)\n            Console.WriteLine(\"\
  Next value is \" + ob.Next);\n\n        Console.WriteLine(\"\\nStarting at 21\"\
  );\n        ob.Next = 21;\n        for(int i=0; i < 5; i++)\n            Console.WriteLine(\"\
  Next value is \" + ob.Next);\n    }\n}\n```\n\n该程序的输出显示此处：\n\nNext value is 2\n\
  Next value is 4\nNext value is 6\nNext value is 8\nNext value is 10\nStarting at\
  \ 21\nNext value is 23\nNext value is 25\nNext value is 27\nNext value is 29\nNext\
  \ value is 31\n\n## 接口索引器 (Interface Indexers)\n\n在接口中声明的索引器具有以下通用形式：\n\n```csharp\n\
  // 接口索引器\nelement-type this[int index] {\n    get;\n    set;\n}\n```\n\n和之前一样，对于只读或只写索引器，分别只存在\
  \ `get` 或 `set`。当在 `interface` 中声明索引器时，访问器不允许使用访问修饰符。\n\n这里是 `ISeries` 的另一个版本，它添加了一个只读索引器，返回序列中的第\
  \ `i` 个元素：\n\n```csharp\n// 在接口中添加索引器。\nusing System;\n\npublic interface ISeries\
  \ {\n    // 一个接口属性。\n    int Next {\n        get; // 返回序列中的下一个数字\n        set; //\
  \ 设置下一个数字\n    }\n    // 一个接口索引器。\n    int this[int index] {\n        // 在 ISeries\
  \ 中声明一个只读索引器。\n        get; // 返回序列中的指定数字\n    }\n}\n\n// 实现 ISeries。\nclass ByTwos\
  \ : ISeries {\n    int val;\n    public ByTwos() {\n        val = 0;\n    }\n  \
  \  // 使用属性获取值。\n    public int Next {\n        get {\n            val += 2;\n  \
  \          return val;\n        }\n        set {\n            val = value;\n   \
  \     }\n    }\n    // 使用索引器获取值。\n    public int this[int index] {\n        // 实现索引器。\n\
  \        get {\n            val = 0;\n            for(int i=0; i<index; i++)\n \
  \               val += 2;\n            return val;\n        }\n    }\n}\n\n// 演示接口索引器。\n\
  class ISeriesDemo4 {\n    static void Main() {\n        ByTwos ob = new ByTwos();\n\
  \        // 通过属性访问序列。\n        for(int i=0; i < 5; i++)\n            Console.WriteLine(\"\
  Next value is \" + ob.Next);\n        Console.WriteLine(\"\\nStarting at 21\");\n\
  \        ob.Next = 21;\n        for(int i=0; i < 5; i++)\n            Console.WriteLine(\"\
  Next value is \" + ob.Next);\n\n        Console.WriteLine(\"\\nResetting to 0\"\
  );\n        ob.Next = 0;\n        // 通过索引器访问序列。\n        for(int i=0; i < 5; i++)\n\
  \            Console.WriteLine(\"Next value is \" + ob[i]);\n    }\n}\n```\n*(注：原文末处\
  \ `ob.Next = 0;` 似乎是笔误，根据上下文应为 `ob.Next = 0;`，翻译时保持原意或修正逻辑一致性)*\n\n该程序的输出显示此处：\n\
  \nNext value is 2\nNext value is 4\nNext value is 6\nNext value is 8\nNext value\
  \ is 10\nStarting at 21\nNext value is 23\nNext value is 25\nNext value is 27\n\
  Next value is 29\nNext value is 31\n\nResetting to 0\nNext value is 0\nNext value\
  \ is 2\nNext value is 4\nNext value is 6\nNext value is 8\n\n## 接口可以继承 (Interfaces\
  \ Can Be Inherited)\n\n一个接口可以继承另一个。语法与类类相同。当类实现一个继承自接口时，它必须实现整个链。以下是一个示例：\n\n```csharp\n\
  // 一个接口可以继承。\nusing System;\n\npublic interface IA {\n    void Meth1();\n    void\
  \ Meth2();\n}\n\n// IB 现在包含了 IA。\npublic interface IB : IA {\n    void Meth3();\n\
  }\n\n// 这个类必须实现 IA 和 IB。\nclass MyClass : IB {\n    public void Meth1() {\n    \
  \    Console.WriteLine(\"Implement Meth1.\");\n    }\n    public void Meth2() {\n\
  \        Console.WriteLine(\"Implement Meth2.\");\n    }\n    public void Meth3()\
  \ {\n        Console.WriteLine(\"Implement Meth3.\");\n    }\n}\n\nclass IFriend\
  \ {\n    static void Main() {\n        MyClass ob = new MyClass();\n        ob.Meth1();\n\
  \        ob.Meth2();\n        ob.Meth3();\n    }\n}\n```\n\n作为实验，你可能尝试移除 `MyClass`\
  \ 中 `Meth1()` 的实现。这将导致编译错误。\n\n### 问专家 (Ask the Expert)\n\n**问：当一个接口继承另一个接口时，是否可以在派生接口中声明隐藏基接口的方法？**\n\
  \n**答：可以。当派生接口中的成员与基接口的成员具有相同的签名时，基接口成员会被隐藏。与类的情况一样，这种隐藏会导致警告，除非你使用 `new` 关键字指定派生接口成员。**\n\
  \n## 显式实现 (Explicit Implementations)\n\n在实现接口成员时，可以使用其接口名称对其名称进行完全限定。这样做创建了一个*显式接口成员实现*，简称为*显式实现*。例如，给定\n\
  \n```csharp\ninterface IMyIF {\n    int MyMeth(int x);\n}\n```\n\n以所示方式实现 `IMyIF`\
  \ 是允许：\n\n```csharp\nclass MyClass : IMyIF {\n    // 使用完全限定名称创建显式实现。\n    int IMyIF.MyMeth(int\
  \ x) {\n        return x / 3;\n    }\n}\n```\n\n如所示，当实现 `IMyIF` 的 `MyMeth()` 成员时，指定了它的完整名称，包括接口名称。\n\
  \n有两个理由可能需要创建接口成员的显式实现。首先，一个类可能实现两个接口，这两个接口都声明了相同名称和类型签名的方法。通过接口限定名称可以消除这种情况的歧义。其次，当你使用完全限定名称实现方法时，你提供了一种无法通过类对象访问的实现。让我们来看每种情况的示例。\n\
  \n\n\n以下程序包含一个名为 `IEven` 的接口，它定义了两个方法：`IsEven()` 和 `IsOdd()`。这些方法判断一个数字是偶数还是奇数。`MyClass`\
  \ 然后实现了 `IEven`。在实现时，它显式地实现了 `IsOdd()`。\n\n```csharp\n// 显式实现接口成员。\n\nusing System;\n\
  \ninterface IEven {\n    bool IsOdd(int x);\n    bool IsEven(int x);\n}\n\nclass\
  \ MyClass : IEven {\n    // 显式实现。\n    bool IEven.IsOdd(int x) {\n        // 显式实现\
  \ IsOdd().\n        if((x%2) != 0) return true;\n        else return false;\n  \
  \  }\n\n    // 普通实现。\n    public bool IsEven(int x) {\n        IEven o = this; //\
  \ 指向对象的接口引用\n        return !o.IsOdd(x);\n    }\n}\n\nclass Demo {\n    static void\
  \ Main() {\n        MyClass ob = new MyClass();\n        bool result;\n        result\
  \ = ob.IsEven(4);\n        if(result) Console.WriteLine(\"4 is even.\");\n     \
  \   else Console.WriteLine(\"3 is odd.\");\n        // result = ob.IsOdd(); // 错误，未暴露。\n\
  \    }\n}\n```\n\n由于 `IsOdd()` 是显式实现的，因此它不会作为 `MyClass` 的公共成员暴露。相反，只能通过接口引用访问 `IsOdd()`。这就是为什么在\
  \ `IsEven()` 的实现中是通过 `o` 来调用它的。\n\n这里是一个示例，其中实现了两个接口，且这两个接口都声明了名为 `Meth()` 的方法。使用显式实现是为了消除这种情况下固有的歧义。\n\
  \n```csharp\n// 使用显式实现消除歧义。\n\nusing System;\n\ninterface IMyIF_A {\n    int Meth(int\
  \ x);\n}\n\n// 这两个方法的签名相同。\n\ninterface IMyIF_B {\n    int Meth(int x);\n}\n\n//\
  \ MyClass 实现了这两个接口。\nclass MyClass : IMyIF_A, IMyIF_B {\n    IMyIF_A a_ob;\n   \
  \ IMyIF_B b_ob;\n\n    // 显式实现两个 Meth()。\n    int IMyIF_A.Meth(int x) {\n      \
  \  // 显式实现消除了歧义。\n        return x + x;\n    }\n\n    int IMyIF_B.Meth(int x) {\n\
  \        // 显式实现消除了歧义。\n        return x * x;\n    }\n\n    // 通过接口引用调用 Meth()。\n\
  \    public int MethA(int x){\n        a_ob = this;\n        return a_ob.Meth(x);\
  \ // 调用 IMyIF_A\n    }\n\n    public int MethB(int x){\n        b_ob = this;\n \
  \       return b_ob.Meth(x); // 调用 IMyIF_B\n    }\n}\n\nclass FQIFNames {\n    static\
  \ void Main() {\n        MyClass ob = new MyClass();\n        Console.Write(\"Calling\
  \ IMyIF_A.Meth(): \");\n        Console.WriteLine(ob.MethA(3));\n        Console.Write(\"\
  Calling IMyIF_B.Meth(): \");\n        Console.WriteLine(ob.MethB(3));\n    }\n}\n\
  ```\n\n该程序的输出所示：\n```\nCalling IMyIF_A.Meth(): 6\nCalling IMyIF_B.Meth(): 9\n```\n\
  \n观察该程序，首先注意到 `Meth()` 在 `IMyIF_A` 和 `IMyIF_B` 中具有相同的签名。因此，当 `MyClass` 实现这两个接口时，它分别显式地实现每一个接口，并在过程中完整地限定了成员的名称。由于调用显式实现方法的唯一方法是通过接口引用，因此\
  \ `MyClass` 创建了两个这样的引用，一个用于 `IMyIF_A`，另一个用于 `IMyIF_B`。然后它调用了它自己的两个方法，这些方法又调用接口方法，从而消除了歧义。\n\
  \n### 结构体\n\n如你所知，类是引用类型。这意味着类对象通过引用访问。这与直接访问的值类型不同。然而，在某些情况下，能够像值类型那样直接访问对象可能是很有用的。原因之一是效率。通过引用访问类对象会给每次访问增加开销。它还会消耗空间。对于非常小的对象，这部分额外空间可能是显著的。为了解决这些问题，C#\
  \ 提供了结构体（structure）。*结构体*类似于类，但它是一个值类型，而不是引用类型。\n\n结构体使用 `struct` 关键字声明，在语法上与类相似。以下是结构体的通用形式：\n\
  \n```csharp\nstruct name : interfaces {\n    // 成员声明\n}\n```\n\n结构体的名称由 `name.`\
  \ 指定。\n\n结构体不能继承其他结构体或类，也不能作为其他结构体或类的基类。然而，结构体可以实现一个或多个接口。这些接口在结构体名称后通过逗号分隔的列表指定。\n\
  \n与类一样，结构体成员包括方法、字段、索引器、属性、运算符方法和事件。结构体也可以定义构造函数，但不能定义析构函数。然而，你不能为结构体定义默认（无参数）构造函数。这是因为所有结构体都会自动定义一个默认构造函数，且这个默认构造函数是无法更改的。\n\
  \n可以使用与类对象相同的方式 `new` 创建结构体对象，但并非强制的。当使用 `new` 时，会调用指定的构造函数。如果不使用 `new`，对象仍然被创建，但没有被初始化。因此，需要手动对结构体进行初始化。以下是使用结构体的示例：\n\
  \n```csharp\n// 使用结构体。\n\nusing System;\n\n// 定义结构体。\nstruct Account {\n    // 定义结构体。\n\
  \    public string name;\n    public double balance;\n    public Account(string\
  \ n, double b) {\n        name = n;\n        balance = b;\n    }\n}\n\n// 使用结构体。\n\
  class StructDemo {\n    static void Main() {\n        Account acc1 = new Account(\"\
  Tom\", 1232.22); // 使用构造函数\n        Account acc2; // 默认构造函数\n        // ...\n  \
  \  }\n}\n```\n\n### 枚举\n\n*枚举*是一组命名的整数常量。枚举在日常生活中非常常见。例如，美国使用的硬币枚举可以是分币、镍币、角币、Quarter、半美元和美元。\n\
  \n`enum` 关键字声明枚举类型。枚举的通用形式是 `enum name { enumeration list };`。\n\n在这里，枚举的类型名称由 `name.`\
  \ 指定。*枚举列表*是逗号分隔的标识符列表。以下是定义 `Coin` 枚举的示例：\n\n```csharp\nenum Coin { Penny, Nickel,\
  \ Dime, Quarter, HalfDollar, Dollar };\n```\n\n\n\n理解枚举的一个关键点是，每个符号都代表一个整数值。然而，在\
  \ `enum` 类型与内置整数类型之间没有定义隐式转换，因此必须使用显式强制转换。此外，在两个枚举类型之间转换时也需要进行强制转换。由于枚举表示整数值，例如你可以使用枚举来控制\
  \ `switch` 语句，或作为 `for` 循环的控制变量。\n\n每个枚举符号的值比其前一个符号大 1。\n\n默认情况下，第一个枚举符号的值为 0。因此，在\
  \ `Coin` 枚举中，`Penny` 是 0，`Nickel` 是 1，`Dime` 是 2，以此此类推。\n\n枚举的成员通过其类型名使用点运算符访问。\n\
  \n例如，这段代码：\n\n```csharp\nConsole.WriteLine(Coin.Penny + \" \" + Coin.Nickel);\n\
  ```\n\n显示为\n\nPenny Nickel\n\n这里是一个说明 `Coin` 枚举的程序：\n\n```csharp\n// Demonstrate\
  \ an enumeration.\n\nusing System;\n\nclass EnumDemo {\nenum Coin { Penny, Nickel,\
  \ Dime, Quarter, HalfDollar, Dollar };\n\nstatic void Main() {\nCoin c; // declare\
  \ an enum variable\n// Use c to cycle through the enum by use of a for loop.\nfor(c\
  \ = Coin.Penny; c <= Coin.Dollar; c++) {\nA Coin variable can\ncontrol a for loop.\n\
  Console.WriteLine(c + \" has value of \" + (int) c);\n// Use an enumeration value\
  \ to control a switch.\nswitch(c) {\nA Coin value can control a switch.\ncase Coin.Nickel:\n\
  Console.WriteLine(\"A nickel is 5 pennies.\");\nbreak;\ncase Coin.Dime:\nConsole.WriteLine(\"\
  A dime is 2 nickels.\");\nbreak;\ncase Coin.Quarter:\nConsole.WriteLine(\"A quarter\
  \ is 5 nickels.\");\nbreak;\ncase Coin.HalfDollar:\nConsole.WriteLine(\"A half-dollar\
  \ is 5 dimes.\");\nbreak;\ncase Coin.Dollar:\nConsole.WriteLine(\"A dollar is 10\
  \ dimes.\");\nbreak;\n}\nConsole.WriteLine();\n}\n}\n}\n```\n\n程序的输出显示在此：\n\nPenny\
  \ has value of 0\nNickel has value of 1\nA nickel is 5 pennies.\nDime has value\
  \ of 2\nA dime is 2 nickels.\nQuarter has value of 3\nA quarter is 5 nickels.\n\
  HalfDollar has value of 4\nA half-dollar is 5 dimes.\nDollar has value of 5\nA dollar\
  \ is 10 dimes.\n\n注意 `for` 循环和 `switch` 语句都是由 `c` 控制的，`c` 是一个 `Coin` 类型的变量。正如前面提到的，枚举类型的变量可以用于控制循环或\
  \ `switch`。此外注意，通过 `WriteLine()` 输出枚举常量会显示其名称。要获取其值，需要强制转换为 `int`。\n\n### 初始化枚举\n\
  \n你可以使用初始化器来指定一个或多个枚举符号的值。\n\n通过在符号后紧跟等号和整数值来实现。出现在初始化器之后的符号将获得分配一个比上一个初始化值值大的值。例如，以下代码为\
  \ `Quarter` 分配了值 100：\n\n```csharp\nenum Coin { Penny, Nickel, Dime, Quarter=100,\
  \ HalfDollar, Dollar};\n```\n\n现在，这些符号的值为：\n\nPenny 0\nNickel 1\nDime 2\nQuarter\
  \ 100\nHalfDollar 101\nDollar 102\n\n### 指定枚举的底层类型\n\n默认情况下，枚举基于类型 `int`，但你可以创建任何整数类型的枚举，`char`\
  \ 类型除外。要指定 `int` 以外的类型，请在枚举名之后放置底层类型，并用冒号分隔。例如，此语句使 `Coin` 成为基于 `byte` 的枚举：\n\n\
  ```csharp\nenum Coin : byte { Penny, Nickel, Dime, Quarter, HalfDollar, Dollar};\n\
  ```\n\n现在，例如 `Coin.Penny` 是一个 `byte` 量。\n\n### 第 9 章自测\n\n1. “一个接口，多个方法”是 C# 的核心原则。什么特性最能体现这一点？\n\
  2. 一个接口可以实现多少类？一个类可以实现多少接口？\n3. 接口可以继承吗？\n4. 类必须实现接口的所有成员吗？\n5. 接口可以声明构造函数吗？\n6.\
  \ 为第 8 章的 `Vehicle` 类创建一个接口。接口命名为 `IVehicle`。（提示：属性需要支持读和写操作，且不能具有访问器修饰符。）\n7. 为安全数组创建一个接口。通过修改第\
  \ 7 章中最后的 fail-soft 数组示例来实现。（提示：`Length` 属性必须是只读的且不能是自动实现的。）\n8. `struct` 和 `class`\
  \ 有什么区别？\n9. 展示如何为行星创建一个枚举。将枚举命名为 `Planets`。\n\n# 第 10 章：异常处理\n\n## 核心技能与概念\n\n\
  * 异常处理基础\n* `try` 和 `catch`\n* 多个 `catch` 子句\n* 嵌套的 `try` 块\n* 抛出异常\n* `Exception`\
  \ 类\n* `finally`\n* 内置异常\n* 自定义异常类\n* `checked` 和 `unchecked`\n\n本章将讨论异常处理。*异常*是发生在运行的错误。\n\
  \n使用 C# 的异常处理系统，你可以以结构化和控制的方式处理运行时错误。异常处理的一个主要优势是，它自动化了许多在任何大型程序中都需要“手动”输入的错误处理代码。例如，如果不使用异常处理，方法将返回一个错误代码，并且每次调用该方法时必须手动检查此值。这种方法既繁琐又容易出错。异常处理通过允许程序定义一个代码块（称为异常处理程序），并在错误发生时执行，从而简化了错误处理。\n\
  \n### Exception 类\n\n在 C# 中，异常由类表示。所有异常类都必须派自内置的异常类 `Exception`，它是 `System` 命名空间的一部分。因此，所有异常都是\
  \ `Exception` 的子类。`Exception` 一个非常重要的子类是 `SystemException`。这是 C# 运行时系统（即 CLR）生成的所有异常所派自的异常类。`SystemException`\
  \ 没有给 `Exception` 增加任何内容。它仅仅定义了标准异常层次结构的顶端。\n\n.NET Framework 定义了若干派自 `SystemException`\
  \ 的内置异常。例如，当尝试除以零时，会生成 `DivideByZeroException` 异常。正如在本章后面部分看到的，你也可以创建自己的异常类。\n\n\
  ### 异常处理基础\n\nC# 异常处理通过四个关键字管理：`try`、`catch`、`throw` 和 `finally`。它们形成了一个相互关联的子系统，其中一个的使用意味着另一个的使用。在本章接下来的内容中，将对每个关键字进行详细检查。然而，在开始时对它们在异常处理中的作用有一个通用的理解是有用的。简而言之，它们的工作原理如下：\n\
  \n你想要监控异常的程序语句包含在 `try` 块中。\n\n\n\n\n\n如果在 `try` 块中发生异常，它就会被**抛出**。你可以使用 `catch`\
  \ 捕获此异常并以某种合理的方式进行处理。系统生成的异常由运行时系统自动抛出。要手动抛出异常，请使用关键字 `throw`。任何在退出 `try` 块时必须执行的代码都应该放在\
  \ `finally` 块中。\n\n## 使用 try 和 catch\n\n异常处理的核心是 `try` 和 `catch`。这两个关键字共同工作，你没有\
  \ `try` 就无法有 `catch`。以下是 `try`/`catch` 异常处理块的一般形式：\n\n```csharp\ntry {\n// 包含监控错误监控的代码块\n\
  }\ncatch (ExcepType1 exOb) {\n    // ExcepType1 的处理程序\n}\ncatch (ExcepType2 exOb)\
  \ {\n    // ExcepType2 的处理程序\n}\n.\n.\n.\n```\n\n在这里，`ExcepType` 是发生异常的类型。当异常被抛出时，它会被相应的\
  \ `catch` 子句捕获，然后由该子句处理异常。如一般形式所示，一个 `try` 可以关联多个 `catch` 子句。异常的类型决定了执行哪一个 `catch`。也就是说，如果\
  \ `catch` 指定的异常类型与实际异常类型匹配，则与该 `catch` 子句关联的代码块将被执行（并且所有其他 `catch` 子句都会被跳过）。当异常被捕获时，异常变量\
  \ `exOb` 将接收其值。\n\n实际上，指定 `exOb` 是可选的。如果异常处理程序不需要访问异常对象（这通常如此），那么就没有必要指定 `exOb`。由于由于原因，本章中的许多示例将不会指定\
  \ `exOb`。\n\n这里有一个重要的点：如果没有抛出异常，则 `try` 块将正常结束，并且所有的 `catch` 子句都将被跳过。执行将从最后一个 `catch`\
  \ 之后的第一个语句恢复。因此，只有在抛出异常时，`catch` 才会被执行。\n\n## 简单的异常示例\n\n这是一个简单的示例，说明了如何监控并捕获异常。如你所知，尝试访问超出数组边界的索引是一个错误。当这种情况发生时，C#\
  \ 运行时系统会抛出一个 `IndexOutOfRangeException`，这是一个标准异常。接下来的程序故意生成这样一个异常并捕获了它：\n\n```csharp\n\
  // 演示异常处理。\nusing System;\n\nclass ExcDemo1 {\n    static void Main() {\n      \
  \  int[] nums = new int[4];\n        try {\n            Console.WriteLine(\"Before\
  \ exception is generated.\");\n            // 生成索引越界异常。\n            // 尝试访问边界之外\n\
  \            nums[7] = 10;\n            Console.WriteLine(\"this won't be displayed\"\
  );\n        }\n        catch (IndexOutOfRangeException) {\n            // 捕获异常。\n\
  \            // 捕获异常\n            Console.WriteLine(\"Index out-of-bounds!\");\n\
  \        }\n        Console.WriteLine(\"After catch block.\");\n    }\n}\n```\n\n\
  该程序显示以下输出：\n\n```\nBefore exception is generated.\nIndex out-of-bounds!\nAfter catch\
  \ block.\n```\n\n尽管前面的程序很短，但说明了关于异常处理的几个关键点。首先，你想要监控错误的代码包含在 `try` 块中。\n\n其次，当发生异常时（在本例中，是因为尝试访问超出\
  \ `nums` 边界的索引），异常会从 `try` 块抛出并被 `catch` 捕获。此时，控制权传递到 `catch` 块，`try` 块被终止。也就是说，`catch`\
  \ **没有**被调用。\n\n相反，程序执行被转移到了它。因此，越界索引之后的 `WriteLine()` 语句将永远不会执行。在 `catch` 块执行后，程序控制将继续执行\
  \ `catch` 之后的语句。因此，你的异常处理程序的任务是补救导致异常的问题，以便程序执行能够正常继续。\n\n注意，在 `catch` 子句中没有指定异常变量名。相反，只需要异常的类型（在本例中为\
  \ `IndexOutOfRangeException`）。如所述，只有在需要访问异常对象时才需要异常变量。在某些情况下，异常处理程序可以使用异常对象的值来获取有关错误的额外详细信息，但在许多情况下，仅仅知道发生了异常就足够了。因此，`catch`\
  \ 异常变量缺失并不稀奇，正如前面的程序所示。\n\n正如所解释的那样，如果 `try` 块没有抛出异常，则没有 `catch` 会被执行，程序控制将在 `catch`\
  \ 之后恢复。为了确认这一点，在前面的程序中，将该行\n\n```csharp\nnums[7] = 10;\n```\n\n改为\n\n```csharp\n\
  nums[0] = 10;\n```\n\n现在，没有生成异常，`catch` 块没有被执行。\n\n## 第二个异常示例\n\n要理解，`try` 块中的所有代码都会受到异常的监控。这包括可能由从\
  \ `try` 块内部调用的方法生成的异常。\n\n从 `try` 块内部调用的方法抛出的异常可以被该 `try` 块捕获——当然，前提是该方法本身没有捕获该异常。例如，这是一个有效的程序：\n\
  \n```csharp\n// 异常可以由一个方法生成并被另一个方法捕获。\nusing System;\n\nclass ExcTest {\n    //\
  \ 生成一个异常。\n    public static void GenException() {\n        int[] nums = new int[4];\n\
  \        Console.WriteLine(\"Before exception is generated.\");\n        // 生成索引越界异常。\n\
  \        nums[7] = 10;\n        // 异常在此生成。\n        Console.WriteLine(\"this won't\
  \ be displayed\");\n    }\n}\n\nclass ExcDemo2 {\n    static void Main() {\n   \
  \     try {\n            ExcTest.GenException();\n        }\n        catch (IndexOutOfRangeException)\
  \ {\n            // 异常在此捕获。\n            Console.WriteLine(\"Index out-of-bounds!\"\
  );\n        }\n        Console.WriteLine(\"After catch block.\");\n    }\n}\n```\n\
  \n此程序产生以下输出，与之前相同：\n\n```\nBefore exception is generated.\nIndex out-of-bounds!\n\
  After catch block.\n```\n\n由于 `GenException()`是在 `try` 块内部调用的，它生成的且未捕获的异常被 `Main()`\
  \ 中的 `catch` 捕获了。然而要理解，如果 `GenException()` 捕获了异常，它永远不会传递给 `Main()`。\n\n## 未捕获异常的后果\n\
  \n捕获 C# 的标准异常（如前面的程序所示）有一个好处：它可以防止程序异常终止。当异常被抛出时，它必须被某处的代码捕获。通常情况下，如果你的程序没有捕获异常，那么它将被运行时系统捕获。问题是运行时系统将报告错误并终止程序。例如，在前面的示例版本中，索引越界异常没有被程序捕获：\n\
  \n```csharp\n// 让运行时系统处理错误。\nusing System;\n\nclass NotHandled {\n    static void\
  \ Main() {\n        int[] nums = new int[4];\n        Console.WriteLine(\"Before\
  \ exception is generated.\");\n        // 生成索引越界异常。\n        nums[7] = 10;\n   \
  \ }\n}\n```\n\n当数组索引错误发生时，执行停止并显示以下错误消息：\n\n```\nUnhandled Exception: System.IndexOutOfRangeException:\n\
  Index was outside the bounds of the array.\nat NotHandled.Main()\n```\n\n虽然这样的消息对你调试时非常有用，但至少，这绝不是你希望你的程序用户看到东西！这就是为什么你的程序自己处理异常是非常重要的。\n\
  \n\n\n\n如前所述，异常的类型必须与 `catch` 子句中指定的类型匹配。如果不匹配，该异常将不会被捕获。例如，以下程序尝试用一个处理 `DivideByZeroException`（另一个内置异常）的\
  \ `catch` 块来捕获数组边界错误。当数组边界越界时，会生成一个 `IndexOutOfRangeException`，但它不会被该 `catch` 捕获。这会导致程序异常终止。\n\
  \n```csharp\n// 这是不起作用的！\n\nusing System;\n\nclass ExcTypeMismatch {\n    static\
  \ void Main() {\n        int[] nums = new int[4];\n        try {\n            Console.WriteLine(\"\
  Before exception is generated.\");\n            // 生成索引越界异常。这会抛出一个\n           \
  \ nums[7] = 10;\n        } catch (IndexOutOfRangeException) {\n            Console.WriteLine(\"\
  this won't be displayed\");\n        }\n        /* 无法用 DivideByZeroException 捕获数组边界错误。\
  \ */\n        但这里尝试用以下方式捕获它\n        catch (DivideByZeroException) {\n         \
  \   // 一个 DivideByZeroException.\n            Console.WriteLine(\"Index out-of-bounds!\"\
  );\n        }\n        Console.WriteLine(\"After catch block.\");\n    }\n}\n```\n\
  \n输出结果所示：\n\nBefore exception is generated.\nUnhandled Exception: System.IndexOutOfRangeException:\n\
  Index was outside the bounds of the array.\nat ExcTypeMismatch.Main()\n\n如输出所示，针对\
  \ `DivideByZeroException` 的 `catch` 无法捕获 `IndexOutOfRangeException`。\n\n## 异常让你能够优雅地处理错误\n\
  \n异常处理的主要优势之一是让你的程序能够响应错误并继续运行。例如，考虑以下示例，它将一个数组的元素除以另一个数组的元素。如果发生了除以零，就会生成一个 `DivideByZeroException`。在程序中，该异常通过报告错误并继续执行来处理。因此，尝试除以零不会导致导致程序终止的突然运行时错误。相反，它被优雅地处理了，允许程序继续执行。\n\
  \n```csharp\n// 优雅地处理错误并继续。\n\nusing System;\n\nclass ExcDemo3 {\n    static void\
  \ Main() {\n        int[] numer = { 4, 8, 16, 32, 64, 128 };\n        int[] denom\
  \ = { 2, 0, 4, 4, 0, 8 };\n        for(int i=0; i < numer.Length; i++) {\n     \
  \       try {\n                Console.WriteLine(numer[i] + \" / \" + denom[i] +\
  \ \" is \" + numer[i]/denom[i]);\n            } catch (DivideByZeroException) {\n\
  \                Console.WriteLine(\"Can't divide by Zero!\");\n            }\n\
  \        }\n    }\n}\n```\n\n程序的输出结果所示：\n\n4 / 2 is 2\nCan't divide by Zero!\n16\
  \ / 4 is 4\n32 / 4 is 8\nCan't divide by Zero!\n128 / 8 is 16\n\n这个示例说明了另一个重要的一点：一旦异常被处理，它就会从系统中被移除。因此，在程序中，循环的每次迭代都会重新进入\
  \ `try` 块——先前的异常已经处理完毕。这使得你的程序能够处理重复的错误。\n\n# 第 10 章：异常处理\n\n## 使用多个 catch 子句\n\n\
  你可以与一个 `try` 关联多个 `catch` 子句。事实上，这是很常见的做法。\n\n然而，每个 `catch` 必须捕获不同类型的异常。例如，这里显示的程序同时捕获了数组边界错误和除零错误：\n\
  \n```csharp\n// 使用多个 catch 子句。\n\nusing System;\n\nclass ExcDemo4 {\n    static\
  \ void Main() {\n        // 这里，numer 的长度比 denom 长。\n        int[] numer = { 4, 8,\
  \ 16, 32, 64, 128, 256, 512 };\n        int[] denom = { 2, 0, 4, 4, 0, 8 };\n  \
  \      for(int i=0; i < numer.Length; i++) {\n            try {\n              \
  \  Console.WriteLine(numer[i] + \" / \" + denom[i] + \" is \" + numer[i]/denom[i]);\n\
  \            } catch (DivideByZeroException) {\n                Console.WriteLine(\"\
  Can't divide by Zero!\");\n            } catch (IndexOutOfRangeException) {\n  \
  \              Console.WriteLine(\"No matching element found.\");\n            }\n\
  \        }\n    }\n}\n```\n\n此程序产生以下输出：\n\n4 / 2 is 2\nCan't divide by Zero!\n16\
  \ / 4 is 4\n32 / 4 is 8\nCan't divide by Zero!\n128 / 8 is 16\nNo matching element\
  \ found.\nNo matching element found.\n\n如输出确认，每个 `catch` 子句只对其自身的类型异常响应。\n\n通常情况下，`catch`\
  \ 子句按照它们在程序中出现的顺序进行检查。只有匹配的子句会被执行。所有其他的都会被忽略。\n\n### 捕获所有异常\n\n有时你想捕获所有异常，无论类型如何。要做到这一点，请使用不指定任何异常类型的\
  \ `catch` 子句。这创建了一个“全捕获”处理器，当你想要确保所有异常都由程序处理时，它是非常有用的。例如，这里使用一个不指定异常类型的 `catch`\
  \ 来捕获它，它捕获了 `IndexOutOfRangeException` 和 `DivideByZeroException`：\n\n```csharp\n\
  // 使用全捕获 catch。\n\nusing System;\n\nclass ExcDemo5 {\n    static void Main() {\n\
  \        // 这里，numer 的长度比 denom 长。\n        int[] numer = { 4, 8, 16, 32, 64, 128,\
  \ 256, 512 };\n        int[] denom = { 2, 0, 4, 4, 0, 8 };\n        for(int i=0;\
  \ i < numer.Length; i++) {\n            try {\n                Console.WriteLine(numer[i]\
  \ + \" / \" + denom[i] + \" is \" + numer[i]/denom[i]);\n            } catch {\n\
  \                // 捕获所有异常\n                Console.WriteLine(\"Some exception occurred.\"\
  );\n            }\n        }\n    }\n}\n```\n\n输出结果所示：\n\n4 / 2 is 2\nCan't divide\
  \ by Zero!\n16 / 4 is 4\n32 / 4 is 8\nCan't divide by Zero!\n128 / 8 is 16\n\n###\
  \ Try 块可以嵌套\n\n一个 `try` 块可以嵌套在另一个 `try` 块内部。内部 `try` 块中生成的异常如果没有被其关联的 `catch` 捕获，就会传播到外部\
  \ `try` 块。\n\n```csharp\n// 使用嵌套 try。\n\nusing System;\n\nclass NestTry {\n    static\
  \ void Main() {\n        // 这里，numer 的长度比 denom 长。\n        int[] numer = { 4, 8,\
  \ 16, 32, 64, 128, 256, 512 };\n        int[] denom = { 2, 0, 4, 4, 0, 8 };\n  \
  \      try { // 外部 try\n            for(int i=0; i < numer.Length; i++) {\n    \
  \            try { // 嵌套 try\n                    Console.WriteLine(numer[i] + \"\
  \ / \" + denom[i] + \" is \" + numer[i]/denom[i]);\n                } catch (DivideByZeroException)\
  \ { // 内部 catch\n                    Console.WriteLine(\"Can't divide by Zero!\"\
  );\n                }\n            }\n        } catch (IndexOutOfRangeException)\
  \ { // 外部 catch\n            Console.WriteLine(\"No matching element found.\");\n\
  \        }\n    }\n}\n```\n\n程序的输出结果所示：\n\n4 / 2 is 2\nCan't divide by Zero!\n16\
  \ / 4 is 4\n32 / 4 is 8\nCan't divide by Zero!\n128 / 8 is 16\nNo matching element\
  \ found.\n\n### 抛出异常\n\n之前的示例都是捕获由运行时系统自动生成的异常。然而，可以使用 `throw` 语句手动抛出异常。\n\n其通用形式如下所示：\n\
  \n```csharp\nthrow exceptOb;\n```\n\n在这里，`exceptOb` 必须是派自 `Exception` 异常类的实例。\n\n\
  以下示例说明了通过手动抛出 `DivideByZeroException` 来使用 `throw` 语句：\n\n```csharp\n// 手动抛出异常。\n\
  ```\n\n\n\n\n```csharp\nusing System;\n\nclass ThrowDemo {\n    static void Main()\
  \ {\n        try {\n            Console.WriteLine(\"Before throw.\");\n        \
  \    throw new DivideByZeroException();\n            // Throw an exception.\n  \
  \      }\n        catch (DivideByZeroException) {\n            Console.WriteLine(\"\
  Exception caught.\");\n        }\n        Console.WriteLine(\"After try/catch statement.\"\
  );\n    }\n}\n```\n\n程序的输出结果所示：\n\n```\nBefore throw.\nException caught.\nAfter\
  \ try/catch statement.\n```\n\n注意在 `throw` 语句中是如何使用 `new` 创建 `DivideByZeroException`\
  \ 对象的。\n\n请记住，`throw` 抛出的是一个对象。因此，你必须创建一个对象才能将其抛出。也就是说，你不能直接抛出一个类型。在这种情况下，使用了默认构造函数来创建\
  \ `DivideByZeroException` 对象，但异常类还有其他构造函数可供（正如你稍后将看到的）。\n\n# 第 10 章：异常处理\n\n###\
  \ 373 - 专家问答\n\n**问：我为什么要想要手动抛出异常？**\n\n**答：** 大多数情况下，你抛出的异常将是你创建的异常类的实例。正如你在本章稍后看到的，创建自定义异常类允许你作为程序整体异常处理策略的一部分来处理代码中的错误。\n\
  \n### 重新抛出异常\n\n被一个 `catch` 捕获的异常可以重新抛出，以便由外层的 `catch` 捕获。重新抛出异常可能的目的是允许多个处理器访问该异常。例如，可能一个异常处理器处理异常的一个方面，而第二个处理器处理另一个方面。要重新抛出异常，只需指定\
  \ `throw` 而不指定具体的异常。也就是说，你使用这种形式的 `throw`：`throw;`\n\n请记住，当你重新抛出异常时，它不会被同一个 `catch`\
  \ 语句捕获。它将传播到外层的 `catch` 语句。\n\n以下程序演示了重新抛出异常：\n\n```csharp\n// 重新抛出异常。\nusing System;\n\
  \nclass Rethrow {\n    public static void GenException() {\n        // 这里，numer\
  \ 的长度大于 denom。\n        int[] numer = { 4, 8, 16, 32, 64, 128, 256, 512 };\n   \
  \     int[] denom = { 2, 0, 4, 4, 0, 8 };\n        for(int i=0; i < numer.Length;\
  \ i++) {\n            try {\n                Console.WriteLine(numer[i] + \" / \"\
  \ + denom[i] + \" is \" + numer[i]/denom[i]);\n            }\n            catch\
  \ (DivideByZeroException) {\n                Console.WriteLine(\"Can't divide by\
  \ Zero!\");\n            }\n            catch (IndexOutOfRangeException) {\n   \
  \             Console.WriteLine(\"No matching element found.\");\n             \
  \   throw; // 重新抛出异常\n            }\n        }\n        // 重新抛出异常。\n    }\n}\n```\n\
  \n374 - C# 3.0 学者指南\n\n```csharp\nclass RethrowDemo {\n    static void Main() {\n\
  \        try {\n            Rethrow.GenException();\n        }\n        catch(IndexOutOfRangeException)\
  \ {\n            // 捕获重新抛出的异常。\n            // 重新捕获异常\n            Console.WriteLine(\"\
  Fatal error -- program terminated.\");\n        }\n    }\n}\n```\n\n在此程序中，除以零错误在\
  \ `GenException()` 中被本地处理，但一个数组边界错误被重新抛出了。在这种情况下，它被 `Main()` 捕获。\n\n### 使用 finally\n\
  \n有时，你可能希望定义一个代码块，该块在离开 `try/catch` 块时执行。例如，异常可能会导致终止当前方法的错误，导致其提前返回。然而，该方法可能打开了文件或网络连接，这些需要关闭。这类情况在编程中很常见，C#\
  \ 提供了一种方便的方法来处理它们：`finally`。\n\n要指定在退出 `try/catch` 块时执行的代码块，请在 `try/catch` 序列的末尾包含一个\
  \ `finally` 块。包含 `finally` 的 `try/catch` 通用形式所示：\n\n```csharp\ntry {\n    // 监控错误的代码块\n\
  }\ncatch (ExcepType1 exOb) {\n    // ExcepType1 的处理器\n}\ncatch (ExcepType2 exOb)\
  \ {\n    // ExcepType2 的处理器\n}\n// ...\nfinally {\n    // finally 代码\n}\n```\n\n\
  无论什么条件导致离开 `try/catch` 块，`finally` 块都会被执行。也就是说，无论 `try` 块是正常结束还是因为异常而结束，最后执行的代码都是由\
  \ `finally` 定义的。如果 `try` 块或或任何 `catch` 子句中的任何代码从方法中返回，`finally` 块也会执行。\n\n这里是 `finally`\
  \ 的示例：\n\n```csharp\n// 使用 finally。\nusing System;\n\nclass UseFinally {\n    public\
  \ static void GenException(int what) {\n        int t;\n        int[] nums = new\
  \ int[2];\n        Console.WriteLine(\"Receiving \" + what);\n        try {\n  \
  \          switch(what) {\n                case 0:\n                    t = 10 /\
  \ what; // 生成除以零错误\n                    break;\n                case 1:\n      \
  \              nums[4] = 4;\n                    break;\n                case 2:\n\
  \                    return;\n            }\n        }\n        catch (DivideByZeroException)\
  \ {\n            Console.WriteLine(\"Can't divide by Zero!\");\n        }\n    \
  \    catch (IndexOutOfRangeException) {\n            Console.WriteLine(\"No matching\
  \ found.\");\n        }\n        finally {\n            Console.WriteLine(\"Leaving\
  \ try.\");\n        }\n    }\n}\n\nclass FinallyDemo {\n    static void Main() {\n\
  \        for(int i=0; i < 3; i++) {\n            UseFinally.GenException(i);\n \
  \       }\n    }\n}\n```\n\n376 - C# 3.0 学者指南\n\n这里是程序的输出：\n\n```\nReceiving 0\n\
  Can't divide by Zero!\nLeaving try.\nReceiving 1\nNo matching found.\nLeaving try.\n\
  Receiving 2\nLeaving try.\n```\n\n正如输出所示，无论 `try` 块如何退出，`finally` 块都会执行。另一个点：`finally`\
  \ 块跟在 `try` 块之后。\n\n### 深入了解 Exception\n\n到为止，我们一直在捕获异常，但还没有对异常对象本身进行任何操作。正如前面提到的，`catch`\
  \ 子句允许你指定异常类型。由于所有异常都派自 `Exception`，所有异常都支持 `Exception` 定义的成员。\n\n`Exception` 定义了几个属性。其中最有趣的是\
  \ `Message`、`StackTrace` 和 `TargetSite`。这些都是只读的。`Message` 是描述错误的字符串。`StackTrace`\
  \ 是包含导致异常的调用栈字符串。`TargetSite` 返回生成异常的对象。\n\n`Exception` 还定义了几个方法。你最常用的方法是 `ToString()`，它返回描述异常的字符串。当通过\
  \ `WriteLine()` 显示异常时，会自动调用 `ToString()`。\n\n以下程序演示了上述属性和方法：\n\n```csharp\n// 使用\
  \ Exception 成员。\nusing System;\n\nclass ExcTest {\n    public static void GenException()\
  \ {\n        int[] nums = new int[4];\n        Console.WriteLine(\"Before exception\
  \ is generated.\");\n        // 生成越界异常。\n        nums[7] = 10;\n        Console.WriteLine(\"\
  this won't be displayed\");\n    }\n}\n```\n\n377\n\n```csharp\nclass UseExcept\
  \ {\n    static void Main() {\n        try {\n            ExcTest.GenException();\n\
  \        }\n        catch (IndexOutOfRangeException exc) {\n            Console.WriteLine(\"\
  Standard message is: \");\n            Console.WriteLine(exc); // 调用 ToString()\n\
  \            Console.WriteLine(\"Stack trace: \" + exc.StackTrace);\n          \
  \  Console.WriteLine(\"Message: \" + exc.Message);\n            Console.WriteLine(\"\
  TargetSite: \" + exc.TargetSite);\n        }\n        Console.WriteLine(\"After\
  \ catch block.\");\n    }\n}\n```\n\n此程序的输出所示：\n\n```\nBefore exception is generated.\n\
  Standard message is: \nSystem.IndexOutOfRangeException: Index was outside the bounds\
  \ of the array.\nat ExcTest.GenException()\nat UseExcept.Main()\nStack trace: System.IndexOutOfRangeException:\
  \ Index was outside the bounds of the array.\nat ExcTest.GenException()\nat UseExcept.Main()\n\
  Message: Index was outside the bounds of the array.\nTargetSite: void ExcTest.GenException()\n\
  After catch block.\n```\n\n\n\n\n堆栈跟踪: 在 `ExcTest.GenException()`\n\n在 `UseExcept.Main()`\n\
  \n消息: 索引超出数组边界。\n\n目标位置: `Void GenException()`\n\n在 catch 块之后。\n\n`Exception` 定义了以下四个构造函数：\n\
  \n```csharp\npublic Exception( )\npublic Exception(string *str*)\npublic Exception(string\
  \ *str*, Exception *inner*)\nprotected Exception(System.Runtime.Serialization.SerializationInfo\
  \ *si*, System.Runtime.Serialization.StreamingContext *sc*)\n```\n\n第一个是默认构造函数。第二个指定了与异常的\
  \ `Message` 属性关联的字符串。第三个指定了所谓的“内部异常（inner exception）”。它用于当一个异常引发另一个异常时。在这种情况下，`inner`\
  \ 指定了第一个异常，如果没有内部异常，则它为 `null`。（如果存在内部异常，可以从 `Exception` 定义的 `InnerException` 属性获取。）最后一个构造函数处理在远程发生并需要反序列化的异常。（远程执行和序列化超出了本书的范围。）\n\
  \n378\nC# 3.0: 入门学者指南\n\n### 异常含义\n\n| 异常 | 含义 |\n| :--- | :--- |\n| ArrayTypeMismatchException\
  \ | 存储的值类型与数组类型不兼容。 |\n| DivideByZeroException | 尝试除以零。 |\n| IndexOutOfRangeException\
  \ | 数组索引超出边界。 |\n| InvalidCastException | 运行时类型转换无效。 |\n| OutOfMemoryException |\
  \ 调用 `new` 失败，因为可用内存不足。 |\n| OverflowException | 发生算术溢出。 |\n| StackOverflowException\
  \ | 堆栈溢出。 |\n\n表 10-1 在 System 命名空间内定义的常用异常。\n\n另一点是：在之前显示的第四个 `Exception` 构造函数中，注意类型\
  \ `SerializationInfo` 和 `StreamingContext` 前面带有 `System.Runtime.Serialization`。这指定了它们所属的命名空间。将在第\
  \ 14 章中详细检查命名空间。\n\n### 常用异常\n\n`System` 命名空间定义了几个标准内置异常。它们都派自 `SystemException`，因为它们是在运行时发生错误时由\
  \ CLR 生成的。表 10-1 显示了其中几个常用的标准异常。\n\n### 派生异常类\n\n尽管 C# 的内置异常处理了大多数常见错误，但 C# 的异常处理机制不仅限于这些错误。事实上，C#\
  \ 异常处理方法的强大之处之一在于它能够处理你创建的异常。你可以使用自定义异常来处理自己代码中的错误。创建一个异常非常简单。只需定义一个派自 `Exception`\
  \ 的类即可。你的派生类不需要实际实现任何内容——是它们在类型系统中的存在允许你将它们用作异常。\n\n**注意**\n\n在过去，自定义异常派生自 `ApplicationException`，因为该层次结构最初是留给与应用程序相关的异常的。然而，微软不再建议这样做。相反，在编写本书时，微软建议从\
  \ `Exception` 派生自定义异常。出于这个原因，这里使用了这种方法。\n\n你创建的异常类将自动可以使用 `Exception` 定义的属性和方法。当然，你可以在创建的异常类中重写这些成员中的一个或。\n\
  \n# 第 10 章：异常处理\n\n### 379\n\n在创建你自己的异常类时，你通常希望你的类支持 `Exception` 定义的所有构造函数。对于简单的自定义异常类，这很容易做到，因为你只需要通过\
  \ `base` 将构造函数的参数传递给相应的 `Exception` 构造函数。当然，从技术上讲，你只需要提供程序实际使用的那些构造函数。\n\n这是一个创建一个名为\
  \ `NonIntResultException` 异常的示例。在程序中，当两个整数相除产生小数部分时，会抛出此异常。为了说明，`NonIntResultException`\
  \ 定义了所有的标准构造函数，尽管示例没有使用其中大部分。它还重写了 `ToString()` 方法。\n\n```csharp\n// 使用自定义异常。\n\
  using System;\n\n// 创建一个异常。\nclass NonIntResultException : Exception {\n    // 一个自定义异常。\n\
  \    /* 实现所有的 Exception 构造函数。注意\n       构造函数简单地执行基类构造函数。\n       因为 NonIntResultException\
  \ 没有给 Exception 增加任何内容，\n       因此不需要任何进一步的操作。 */\n    public NonIntResultException()\
  \ : base() { }\n    public NonIntResultException(string str) : base(str) { }\n \
  \   public NonIntResultException(string str, Exception inner) : base(str, inner)\
  \ { }\n    protected NonIntResultException(\n        System.Runtime.Serialization.SerializationInfo\
  \ si,\n        System.Runtime.Serialization.StreamingContext sc) : base(si, sc)\
  \ { }\n\n    // 为 NonIntResultException 重写 ToString。\n    public override string\
  \ ToString() {\n        // 重写 ToString().\n        return Message;\n    }\n}\n\n\
  class CustomExceptDemo {\n    static void Main() {\n        // 这里，numer 包含一些奇值。\n\
  \        int[] numer = { 4, 8, 15, 32, 64, 127, 256, 512 };\n        int[] denom\
  \ = { 2, 0, 4, 4, 0, 8 };\n        for(int i=0; i < numer.Length; i++) {\n     \
  \       try {\n                if((numer[i] % denom[i]) != 0) {\n              \
  \      // 抛出一个自定义异常。\n                    throw new NonIntResultException(\"Outcome\
  \ of \" +\n                        numer[i] + \" / \" + denom[i] + \" is not even.\"\
  );\n                }\n                Console.WriteLine(numer[i] + \" / \" + denom[i]);\n\
  \            } catch (DivideByZeroException) {\n                Console.WriteLine(\"\
  Can't divide by Zero!\");\n            } catch (IndexOutOfRangeException) {\n  \
  \              Console.WriteLine(\"No element found.\");\n            } catch (NonIntResultException\
  \ exc) {\n                Console.WriteLine(exc);\n            }\n        }\n  \
  \  }\n}\n```\n\n程序的输出所示：\n4 / 2 is 2\nCan't divide by Zero!\n15 / 4 is not even.\n\
  32 / 4 is 8\nCan't divide by Zero!\n127 / 8 is not even.\nNo element found.\nNo\
  \ element found.\n\n380\nC# 3.0: 入门学者指南\n\n注意，没有任何构造函数在它们的体体中提供任何语句。相反，它们简单地通过 `base`\
  \ 将参数传递给 `Exception`。在你的异常类没有添加任何功能的情况下，你可以直接让 `Exception` 构造函数处理该过程。正如所解释的，并没有要求你的派生类必须从\
  \ `Exception` 继承的内容中添加任何东西。\n\n在继续之前，你可能想对这个程序进行实验。例如，尝试注释掉 `ToString()` 的重写并观察结果。此外，尝试使用默认构造函数创建一个异常，并观察\
  \ C# 生成了什么默认消息。\n\n### 捕获派生类异常\n\n在尝试捕获涉及基类和派生类的异常类型时，你需要小心排列 `catch` 子句的顺序，因为用于基类的\
  \ `catch` 子句也会匹配其任何派生类。例如，由于所有异常的基类都是 `Exception`，因此捕获 `Exception` 会捕获所有可能的异常。当然，不带异常类型的\
  \ `catch` 了一种了一种捕获所有异常的更简洁的方法，如之前所述。然而，捕获派生类异常的问题在其他上下文中非常重要，特别是当你创建自己的异常时。\n\n\
  # 第 10 章：异常处理\n\n### 381\n\n如果你想同时捕获基类类型和派生类类型的异常，请将派生类放在 `catch` 序列的前部。这是必要的，因为基类\
  \ `catch` 也会捕获所有派生类。幸运的是，这个规则是自强制执行的，因为将基类放在前面会导致编译时错误。\n\n以下程序创建了名为 `ExceptA` 和\
  \ `ExceptB` 的两个异常类。\n\n\n\n\n\n`ExceptA` 继承自 `Exception`。`ExceptB` 继承自 `ExceptA`。程序随后抛出了每种类型的异常。为了简单起见，它只提供了一个构造函数（接受一个描述异常的字符串）。但请记住，在商业代码中，你的自定义异常类通常会提供\
  \ `Exception` 定义的所有四个构造函数。\n\n```csharp\n// 派生异常必须在基类异常之前。\n\nusing System;\n\n\
  // 创建一个异常。\nclass ExceptA : Exception {\n    public ExceptA(string str) : base(str)\
  \ { }\n    public override string ToString() {\n        return Message;\n    }\n\
  }\n\n// 创建一个派自 ExceptA 的异常\nclass ExceptB : ExceptA {\n    // 注意 ExceptB 继承自 ExceptA。\n\
  \    public ExceptB(string str) : base(str) { }\n    public override string ToString()\
  \ {\n        return Message;\n    }\n}\n\nclass OrderMatters {\n    static void\
  \ Main() {\n        for(int x = 0; x < 3; x++) {\n            try {\n          \
  \      if(x==0) throw new ExceptA(\"Caught an ExceptA exception\");\n          \
  \      else if(x==1) throw new ExceptB(\"Caught an ExceptB exception\");\n     \
  \           else throw new Exception();\n            }\n            catch (ExceptB\
  \ exc) {\n                Console.WriteLine(exc);\n            }\n            catch\
  \ (ExceptA exc) {\n                // catch 子句的顺序很重要。\n                Console.WriteLine(exc);\n\
  \            }\n            catch (Exception exc) {\n                Console.WriteLine(exc);\n\
  \            }\n        }\n    }\n}\n```\n\n382 | C# 3.0: 初学者指南\n\n该程序的输出显示在此：\n\
  \n```\nCaught an ExceptA exception\nCaught an ExceptB exception\nSystem.Exception:\
  \ Exception of type 'System.Exception' was thrown.\nat OrderMatters.Main()\n```\n\
  \n注意 `catch` 子句的顺序。这是它们可以发生的唯一顺序。\n\n由于 `ExceptB` 继承自 `ExceptA`，因此 `ExceptB` 的 `catch`\
  \ 必须在 `ExceptA` 的 `catch` 之前。同样，对于 `Exception`（所有异常的基类）的 `catch` 必须最后出现。为了亲手证明这一点，请尝试重新排列\
  \ `catch` 子句。这样做会导致编译时错误。\n\n### 专家问答\n\n**Q：由于异常通常表示特定的错误，我为什么想要捕获基类异常呢？**\n\n\
  **A:** 捕获基类异常的 `catch` 子句允许你捕获整类类异常，可能可以使用单个 `catch` 处理它们，并避免代码重复。\n\n例如，你可能会创建一组描述某种设备错误的异常。如果你的异常处理程序简单地告诉用户发生了设备错误，那么你就可以对所有此类类型的异常使用通用的\
  \ `catch`。处理器可以简单地显示 `Message` 字符串。由于执行此操作的代码对于所有异常都是相同的，因此一个 `catch` 就可以响应所有的设备异常。\n\
  \n### 尝试向 Queue 类添加异常\n\n在 own 项目中，你将创建两个异常类，这些类可以由第 9 章“尝试（Try This）”部分开发的队列类使用。它们将指示队列满和队列空的错误条件。当发生错误时，这些异常分别由\
  \ `Put()` 和 `Get()` 方法抛出。为了简单起见，此示例将仅将这些异常添加到 `SimpleQueue` 类中，但你可以轻松地将它们整合到其他队列类中。为了简便，异常类仅实现了程序中实际使用的构造函数（即接受描述异常的字符串参数的构造函数）。你可以尝试作为练习自行添加其他的。\n\
  \n# 第 10 章：异常处理\n\n383 | 逐步进行\n\n1. 创建一个名为 `QExcDemo.cs` 的文件。\n2. 在 `QExcDemo.cs`\
  \ 中定义以下异常：\n\n```csharp\n// 为队列类添加异常处理。\nusing System;\n\n// 用于队列满错误的异常。\nclass\
