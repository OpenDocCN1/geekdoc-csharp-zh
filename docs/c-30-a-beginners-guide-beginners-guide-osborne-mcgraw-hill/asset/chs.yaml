  如你所示，`minivan` 的数据与 `sportscar` 中包含的数据是完全独立的。\n\n图 4-1 描述了这种情况。\n图 4-1 一个对象的实例变量与另一个是独立的。\n\
  \n### 对象是如何创建的\n\n在前面的程序中，使用了以下行来创建一个 `Vehicle` 类型的对象：`Vehicle minivan = new Vehicle();`\n\
  \n此声明执行了三个功能。首先，它声明了一个类型为 `Vehicle` 的变量 `minivan`。该变量本身并不是一个对象。相反，它只是一个可以引用对象的变量。其次，该声明创建了对象的物理实例。\n\
  \n这是通过使用 `new` 运算符完成的。最后，它为 `minivan` 分配了该对象的引用。因此，在该行代码执行后，`minivan` 指向一个类型为 `Vehicle`的对象。\n\
  \n`new` 运算符为对象动态分配（即在运行时分配）内存并返回该对象的引用。该引用随后被存储在变量中。因此，在 C# 中，所有类对象都必须动态分配。\n\n\
  正如你预期的那样，可以将 `minivan` 的声明与它将指向的对象创建分开，如下所示：\n\n```csharp\nVehicle minivan; // 声明对对象的引用\n\
  minivan = new Vehicle(); // 分配一个 Vehicle 对象\n```\n\n第一行将 `minivan` 声明为 `Vehicle`\
  \ 类型对象的引用。因此，`minivan` 是一个可以引用对象的变量，但它本身不是对象。下一行创建了一个新的 `Vehicle` 对象，并将它的引用分配给 `minivan`。现在，`minivan`\
  \ 与一个对象关联了。\n\n类对象通过引用进行访问的事实解释了为什么类被称为引用类型。值类型和引用类型之间的区别在于每种类型变量的含义。对于值类型变量，变量本身包含该值。例如，给定\n\
  \n```csharp\nint x;\nx = 10;\n```\n\n`x` 包含值 10，因为 `x` 是 `int` 类型的变量，这是一种值类型。然而，在以下情况下\n\
  \n```csharp\nVehicle minivan = new Vehicle();\n```\n\n`minivan` 本身并不包含该对象。相反，它包含指向对象的引用。\n\
  \n### 引用变量与赋值\n\n在赋值操作中，引用变量的行为与值类型变量不同。当你将一个值类型赋值给另一个（例如 `int`）时，情况是直观的，左侧接收右侧的值。当你将一个对象引用赋值给另一个时，情况变得复杂，因为左侧引用的是右侧的对象。这可能会导致一些违反直觉的结果。例如，考虑以下：\n\
  \n```csharp\nVehicle car1 = new Vehicle();\nVehicle car2 = car1;\n```\n\n乍初看起来，很容易认为\
  \ `car1` 和 `car2` 指向不同的对象，但事实并非如此。相反，`car1` 和 `car2` 都指向同一个对象。将 `car1` 赋值给 `car2`\
  \ 只让 `car2` 指向与 `car1` 相同的对象。因此，可以通过 `car1` 或 `car2` 对对象进行操作。例如，执行以下赋值后\n\n```csharp\n\
  car1.Mpg = 26;\n```\n\n这两个 `WriteLine( )` 语句显示相同的值，26：\n\n```csharp\nConsole.WriteLine(car1.Mpg);\n\
  Console.WriteLine(car2.Mpg);\n```\n\n尽管 `car1` 和 `car2` 都指向同一个对象，但它们之间没有其他关联。例如，对\
  \ `car2` 的后续赋值只会改变 `car2` 指向的对象。例如：\n\n```csharp\nVehicle car1 = new Vehicle();\n\
  Vehicle car2 = car1;\nVehicle car3 = new Vehicle();\ncar2 = car3; // 现在 car2 和 car3\
  \ 指向同一个对象。\n```\n\n在该系列操作执行后，`car2` 指向与 `car3` 相同的对象。当然，`car1` 继续指向它的原始对象。\n\n###\
  \ 方法\n\n正如解释过的，实例变量和方法是类的两个主要组成部分。到目前为止，`Vehicle` 类包含数据，但没有方法。虽然只有数据的类是完全有效的，但大多数类会有方法。方法是操纵类定义的数据的程序，并在许多情况下提供对这些数据的访问。通常，程序的其他部分通过类的方法与类交互。\n\
  \n方法包含一个或多个语句。在良好的 C# 代码中，每个方法只执行一个任务。每个方法都有一个名称，该名称用于调用该方法。通常，你可以使用任何喜欢的有效标识符为方法命名。然而，请记住不要使用\
  \ C# 的关键字作为方法名。\n\n\n\n\n在文中表示方法时，本本书采用并以后继续使用一种在编写 C# 时已变得通用的约定。方法名称后会跟有一个括号。例如，如果方法的名称是\
  \ `GetVal`，那么在句子中使用该名称时，它将写为 `GetVal()`。这种表示法将帮助你区分书中的变量名和方法名。\n\n方法的通用形式在此所示：\n\
  \n```csharp\naccess ret-type name( parameter-list) {\n    // 方法体\n}\n```\n\n在这里，`access`\
  \ 是一个访问修饰符，用于控制程序的其他部分可以调用该方法。正如之前解释的，访问修饰符是可选的。如果不提供，该方法对于声明它的类来说是私有的（`private`）。目前，我们将方法声明为\
  \ `public`（公有的），以便程序中的任何其他代码都可以调用。`ret-type` 指定了方法返回的数据类型。这可以是任何有效类型，包括你创建的类类型。如果方法不返回值，则其返回类型必须是\
  \ `void`。方法的名称由 `name` 指定。\n\n这可以是任何合法标识符，但会在当前声明空间内引起冲突的标识符除外。`parameter-list`\
  \ 是由逗号分隔的类型和标识符对序列。参数本质上是变量，在调用方法时接收传递给方法的 `arguments` 的值。如果方法没有参数，参数列表将为空。\n\n\
  ###为 Vehicle 类添加方法\n\n正如刚才解释的，类的方法通常会对类的数据进行操作并提供访问。考虑到这一点，回想前面示例中的 `Main()` 通过将其燃油率乘以油箱容量来计算车辆的航程。虽然在技术上是正确的，但这不是处理此类计算的最佳方式。车辆航程的计算最好由\
  \ `Vehicle` 类本身处理。得出这个结论的原因很容易理解：车辆的航程取决于油箱容量和燃油率，而这两个量都由 `Vehicle` 封装。通过向 `Vehicle`\
  \ 添加一个计算航程的方法，你正在增强其面向对象的结构。\n\n若要向 `Vehicle` 添加一个方法，请在 `Vehicle` 的声明中指定它。例如，以下\
  \ `Vehicle` 版本包含一个名为 `Range()` 的方法，该方法可以显示车辆的航程：\n\n```csharp\n// 为 Vehicle 添加范围。\n\
  using System;\n\n// 一个封装有关车辆信息的类。\nclass Vehicle {\n    public int Passengers; //\
  \ 乘客人数\n    public int FuelCap; // 单位为加仑的油箱容量\n    public int Mpg; // 每英里的燃油消耗\n\
  \n    // 显示航程。\n    // Range() 方法包含在 Vehicle 类中。\n    public void Range() {\n  \
  \      Console.WriteLine(\"Range is \" + FuelCap * Mpg);\n    }\n}\n```\n\n注意 `FuelCap`\
  \ 和 `Mpg` 是直接被使用的，没有使用点操作符。\n\n```csharp\nclass AddMeth {\n    static void Main()\
  \ {\n        Vehicle minivan = new Vehicle();\n        Vehicle sportscar = new Vehicle();\n\
  \n        // 为 minivan 的字段赋值。\n        minivan.Passengers = 7;\n        minivan.FuelCap\
  \ = 16;\n        minivan.Mpg = 21;\n\n        // 给 sportscar 的字段赋值。\n        sportscar.Passengers\
  \ = 2;\n        sportscar.FuelCap = 14;\n        sportscar.Mpg = 12;\n\n       \
  \ Console.Write(\"Minivan can carry \" + minivan.Passengers + \". \");\n       \
  \ minivan.Range(); // 显示 minivan 的航程\n        Console.Write(\"Sportscar can carry\
  \ \" + sportscar.Passengers + \". \");\n        sportscar.Range(); // 显示 sportscar\
  \ 的航程。\n    }\n}\n```\n\n该程序产生以下输出：\n`Minivan can carry 7. Range is 336`\n`Sportscar\
  \ can carry 2. Range is 168`\n\n让我们来看这个程序的关键元素，从 `Range()` 方法本身开始。\n\n`Range()`\
  \ 的第一行是：\n```csharp\npublic void Range() {\n```\n\n这一行声明了一个名为 `Range` 的没有参数的方法。它被指定为\
  \ `public`，因此程序的所有其他部分都可以使用它。它的返回类型是 `void`。因此，`Range()` 不向调用者返回值。该行以方法体的左大括号结束。\n\
  \n`Range()` 的方法体仅包含这一行：\n\n```csharp\nConsole.WriteLine(\"Range is \" + FuelCap\
  \ * Mpg);\n```\n\n该语句通过将 `FuelCap` 与 `Mpg` 相乘来显示车辆的航程。由于每个 `Vehicle` 类型的对象都有自己的\
  \ `FuelCap` 和 `Mpg` 拷贝，当调用 `Range()` 时，航程计算使用了调用对象的这些变量的拷贝。\n\n`Range()` 方法在遇到其右大括号时结束。这导致程序控制权传回调用者。\n\
  \n接下来，仔细看来自 `Main()` 内部的这行代码：\n```csharp\nminivan.Range();\n```\n\n该语句在 `minivan`\
  \ 上调用了 `Range()` 方法。也就是说，它通过使用点操作符相对于 `minivan` 所引用的对象调用了 `Range()`。当方法被调用时，程序控制权将转移到该方法。当方法终止时，控制权传回调用者，并从调用之后的代码行继续执行。\n\
  \n在这种情况下，调用 `minivan.Range()` 显示了车辆的航程。\n\n\n\n虽然返回类型为 `void` 的方法并不罕见，但大多数方法都会返回一个值。\n\
  \n事实上，返回值是方法最实用的功能之一。你已经见过一个返回值的示例了：在第 2 章和第 3 章中，我们使用 `Math.Sqrt()` 来获取平方根。\n\n\
  返回值在编程中有多种用途。在某些情况下，如使用 `Math.Sqrt()` 时，返回值包含某些计算的结果。在其他情况下，返回值可能简单地表示成功或失败。在另一些情况下，它可能包含一个状态码。无论目的何，使用方法的返回值都是\
  \ C# 编程不可或缺的一部分。\n\n方法通过这种形式的 `return` 向调用例程返回值：`return value;`\n\n在这里，`value` 是被返回的值。\n\
  \n你可以使用返回值来改进 `Range()` 的实现。与其显示范围，更好的方法是让 `Range()` 计算范围并返回此值。这种方法的优点是你可以将该值用于其他计算。下面的示例修改了\
  \ `Range()`，使其返回范围而不是显示它：\n\n```csharp\n// 使用返回值。\n\nusing System;\n\n// 一个封装车辆信息的类。\n\
  class Vehicle {\n    public int Passengers; // 乘客人数\n    public int FuelCap; //\
  \ 油箱容量（加仑）\n    public int Mpg; // 每加仑英里程数\n\n    // 返回范围。\n    public int Range()\
  \ {\n        return Mpg * FuelCap;\n    }\n}\n\nclass RetMeth {\n    static void\
  \ Main() {\n        Vehicle minivan = new Vehicle();\n        Vehicle sportscar\
  \ = new Vehicle();\n        int range1, range2;\n\n        // 为 minivan 的字段赋值。\n\
  \        minivan.Passengers = 7;\n        minivan.FuelCap = 16;\n        minivan.Mpg\
  \ = 21;\n\n        // 为 sportscar 的字段赋值。\n        sportscar.Passengers = 2;\n  \
  \      sportscar.FuelCap = 14;\n        sportscar.Mpg = 12;\n\n        // 获取范围。\n\
  \        range1 = minivan.Range();\n        // 将 Range() 返回的值赋值给变量。\n        range2\
  \ = sportscar.Range();\n\n        Console.WriteLine(\"Minivan can carry \" + minivan.Passengers\
  \ +\n            \"with range of \" + range1 + \" miles.\");\n        Console.WriteLine(\"\
  Sportscar can carry \" + sportscar.Passengers +\n            \"with range of \"\
  \ + range2 + \" miles.\");\n    }\n}\n```\n\n输出显示在此：\nMinivan can carry 7 with range\
  \ of 336 miles.\nSportscar can carry 2 with range of 168 miles.\n\n在程序中，注意当调用 `Range()`\
  \ 时，它被放置在赋值语句的右侧。左侧是一个接收 `Range()` 返回值的变量。\n\n因此，在执行此行代码后，\n`range1 = minivan.Range();`\n\
  `minivan` 对象的范围被存储在 `range1` 中。\n\n注意 `Range()` 现在现在的返回类型为 `int`。这意味着它将向调用者返回一个整数值。方法的返回类型非常重要，因为方法返回的数据类型必须与方法指定的返回类型兼容。因此，如果你想让方法返回\
  \ `double` 类型的数据，那么它的返回类型就必须是 `double` 类型。\n\n虽然前面的程序是正确的，但它的写法效率并不是最高。具体来说，不需要\
  \ `range1` 或 `range2` 变量。`Range()` 的调用可以直接用在 `WriteLine()` 语句中，如下所示：\n\n```csharp\n\
  Console.WriteLine(\"Minivan can carry \" + minivan.Passengers +\n    \"with range\
  \ of \" + minivan.Range() + \" Miles\");\n```\n\n在这种情况下，当执行 `WriteLine()` 时，`minivan.Range()`\
  \ 会自动调用，其值将传递给 `WriteLine()`。此外，每当需要 `Vehicle` 对象的范围时，都可以调用 `Range()`。例如，此语句比较了两辆车辆的范围：\n\
  \n```csharp\nif(v1.Range() > v2.Range()) Console.WriteLine(\"v1 has greater range\"\
  );\n```\n\n专家问答\n\n**Q: 我听说 C# 可以检测“不可达代码（unreachable code）”。这意味着什么？**\n\n**A:**\
  \ 你听得没错。如果你创建了一个包含任何执行路径都永远无法到达的代码的方法，C# 编译器将发出警告消息。考虑这个例子：\n\n```csharp\npublic\
  \ void m() {\n    char a, b;\n    // ...\n    if(a==b) {\n        Console.WriteLine(\"\
  equal\");\n        return;\n    } else {\n        Console.WriteLine(\"not equal\"\
  );\n        return;\n    }\n    Console.WriteLine(\"this is unreachable\");\n}\n\
  ```\n\n在这里，方法 `m()` 在执行最后的 `WriteLine()` 语句之前始终会返回。如果你尝试编译此方法，将收到一个警告。通常情况下，不可达代码意味着你的操作失误，因此认真对待不可达代码警告是件好主意！\n\
  \n### 使用参数\n\n在调用方法时，可以向方法传递一个或多个值。正如所解释的，传递给方法的值被称为“参数（argument）”。在方法内部，接收参数的变量被称为“形式参数（formal\
  \ parameter）”。\n\n这里是一个使用参数的简单示例：\n\n```csharp\nusing System;\n\nclass ChkNum {\n\
  \    // 如果 x 是偶数则返回 true。\n    public bool IsEven(int x) {\n        // 此方法接收一个参数。\n\
  \        if(x % 2 == 0) return true;\n        else return false;\n    }\n}\n\nclass\
  \ ParmDemo {\n    static void Main() {\n        ChkNum e = new ChkNum();\n     \
  \   if(e.IsEven(10)) Console.WriteLine(\"10 is even.\");\n        if(e.IsEven(9))\
  \ Console.WriteLine(\"9 is even.\");\n        if(e.IsEven(8)) Console.WriteLine(\"\
  8 is even.\");\n    }\n}\n```\n\n程序产生的输出：\n10 is even.\n8 is even.\n\n在程序中，注意 `IsEven()`\
  \ 被调用了三次，每次都传递了不同的值。让我们仔细观察这个过程。首先，注意 `IsEven()` 是如何调用的。参数在括号内。当第一次调用 `IsEven()`\
  \ 时，传递了值 10。因此，当 `IsEven()` 开始执行时，参数 `x` 接收了值 10。第二次调用时，9 是参数，`x` 值为 9。第三次调用时，参数是\
  \ 8，这是 `x` 接收的值。\n\n方法可以拥有多个参数。只需声明每个参数，并用逗号隔开。例如，`Factor` 类定义了一个 `IsFactor()` 方法，用于判断第一个参数是否是第二个参数的因子。\n\
  \n```csharp\nusing System;\n\nclass Factor {\n    // 判断 x 是否是 y 的因子。\n    public\
  \ bool IsFactor(int x, int y) {\n        // 此方法有两个参数。\n        if((y % x) == 0)\
  \ return true;\n        else return false;\n    }\n}\n\nclass IsFact {\n    static\
  \ void Main() {\n        Factor x = new Factor();\n        if(x.IsFactor(2, 20))\
  \ Console.WriteLine(\"2 is factor\");\n        if(x.IsFactor(3, 20)) Console.WriteLine(\"\
  this won't be displayed\");\n    }\n}\n```\n\n注意当调用 `IsFactor()` 时，参数也用逗号隔开。使用多个参数时，每个参数都指定自己的类型，该类型可以与其他参数不同。例如，这种写法是完全有效的：\n\
  \n`int MyMeth(int a, double b, float c)`\n\n\n\n\n你可以使用一个带参数的方法为 `Vehicle` 类添加一个新功能：计算给定距离所需的燃料量。这个新方法被称为\
  \ `FuelNeeded()`。该方法接收你想要行驶的英里数，并返回所需的加仑数。`FuelNeeded()` 方法的定义如下：\n\n```csharp\n\
  public double FuelNeeded(int miles) {\n    return (double) miles / Mpg;\n}\n```\n\
  \n注意，此方法返回的是一个 `double` 类型的值。这是很有用的，因为给定距离所需的燃料量可能不是整数。\n\n这里是包含 `FuelNeeded()`\
  \ 的整个 `Vehicle` 类：\n\n```csharp\n/*\n添加一个带参数的方法，用于计算\n给定距离所需的燃料。\n*/\nusing System;\n\
  \nclass Vehicle {\n    public int Passengers; // 乘客人数\n    public int FuelCap; //\
  \ 燃油箱容量（加仑）\n    public int Mpg; // 每加仑行驶里程数\n\n    // 返回续航里程。\n    public int Range()\
  \ {\n        return Mpg * FuelCap;\n    }\n\n    // 计算给定距离所需的燃料。\n    public double\
  \ FuelNeeded(int miles) {\n        // 使用带参数的方法\n        // 计算行驶指定\n        // 英里数所需的燃料。\n\
  \        return (double) miles / Mpg;\n    }\n}\n\nclass CompFuel {\n    static\
  \ void Main() {\n        Vehicle minivan = new Vehicle();\n        Vehicle sportscar\
  \ = new Vehicle();\n        double gallons;\n        int dist = 252;\n\n       \
  \ // 为 minivan 的字段赋值。\n        minivan.Passengers = 7;\n        minivan.FuelCap\
  \ = 16;\n        minivan.Mpg = 21;\n\n        // 为 sportscar 的字段赋值。\n        sportscar.Passengers\
  \ = 2;\n        sportscar.FuelCap = 14;\n        sportscar.Mpg = 12;\n\n       \
  \ gallons = minivan.FuelNeeded(dist);\n        Console.WriteLine(\"行驶 \" + dist\
  \ + \" 英里，面包型车需要 \" + gallons + \" 加仑燃料。\");\n\n        gallons = sportscar.FuelNeeded(dist);\n\
  \        Console.WriteLine(\"行驶 \" + dist + \" 英里，跑车需要 \" + gallons + \" 加仑燃料。\"\
  );\n    }\n}\n```\n\n程序的输出如下：\n```\nTo go 252 miles minivan needs 12.0 gallons of\
  \ fuel.\nTo go 252 miles sportscar needs 21.0 gallons of fuel.\n```\n\n### 尝试一下：创建一个帮助类\n\
  \n如果有人尝试用一句话来总结类的类的精髓，它可能是这样的：类封装了功能。当然，有时诀窍在于知道一个“功能”在何时结束，另一个“功能”从哪里开始。作为一条通用规则，你希望你的类是你更大型应用程序的构建模块。为了做到这一点，每个类必须代表一个执行边界清晰动作的单一功能单元。因此，你希望你的类尽可能小——但不能再小了！也就是说，包含多余功能的类会使代码混乱并破坏代码结构，但包含功能过少的类将是碎片化的。\n\
  \n平衡点在哪里？正是在这一点上，编程的科学变成了编程的艺术。幸运的是，大多数程序员发现，随着经验的积累，这种平衡动作会变得更容易。\n\n为了开始积累这些经验，我们把第\
  \ 3 章“尝试一下”部分开发的帮助系统转换为一个帮助类。让我们来看看为什么这是一个好主意。首先，帮助系统定义了一个逻辑单元。它只是显示了 C# 控制语句的语法。因此，它的功能是紧凑且定义良好的。其次，将帮助放在类中是一种符合美学的方法。每当你想要向用户提供帮助系统时，只需实例化帮助系统对象即可。最后，由于帮助被封装，可以对其进行升级或更改，而不会对使用它的程序产生意外的副作用。\n\
  \n### 逐步进行\n\n1. 创建一个名为 `HelpClassDemo.cs` 的新文件。为了节省打字时间，你可能希望将第 3 章最后一个“尝试一下”部分的文件\
  \ `Help3.cs` 复制到 `HelpClassDemo.cs`。\n2. 要将帮助系统转换为类，你必须精确确定什么构成帮助系统。例如，在 `Help3.cs`\
  \ 中，有代码用于显示菜单、输入用户的选择、检查有效响应以及显示所选项目的信息。\n\n程序还会一直循环，直到按下 `q` 为止。如果你仔细考虑，很明显，菜单、有效响应检查以及信息的显示是帮助系统的不可缺的一部分。如何获取用户输入以及是否应该处理重复请求并不是不可缺的。因此，你将创建一个显示帮助信息和帮助菜单并检查有效选择的类。这些功能可以组织成方法，称为\
  \ `HelpOn()`、`ShowMenu()` 和 `IsValid()`。\n\n3. 创建 `HelpOn()` 方法，如下：\n\n```csharp\n\
  public void HelpOn(char what) {\n    switch(what) {\n        case '1':\n       \
  \     Console.WriteLine(\"The if:\\n\");\n            Console.WriteLine(\"if(condition)\
  \ statement;\");\n            Console.WriteLine(\"else statement;\");\n        \
  \    break;\n        case '2':\n            Console.WriteLine(\"The switch:\\n\"\
  );\n            Console.WriteLine(\"switch(expression) {\");\n            Console.WriteLine(\"\
  \ case constant:\");\n            Console.WriteLine(\" statement sequence\");\n\
  \            Console.WriteLine(\" break;\");\n            Console.WriteLine(\" //\
  \ ...\");\n            Console.WriteLine(\"}\");\n            break;\n        case\
  \ '3':\n            Console.WriteLine(\"The for:\\n\");\n            Console.WriteLine(\"\
  for(init; condition; iteration)\");\n            Console.WriteLine(\" statement;\"\
  );\n            break;\n        case '4':\n            Console.WriteLine(\"The while:\\\
  n\");\n            Console.WriteLine(\"while(condition) statement;\");\n       \
  \     break;\n        case '5':\n            Console.WriteLine(\"The do-while:\\\
  n\");\n            Console.WriteLine(\"do {\");\n            Console.WriteLine(\"\
  \ statement;\");\n            Console.WriteLine(\"} while (condition);\");\n   \
  \         break;\n        case '6':\n            Console.WriteLine(\"The break:\\\
  n\");\n            Console.WriteLine(\"break; or break label;\");\n            break;\n\
  \        case '7':\n            Console.WriteLine(\"The continue:\\n\");\n     \
  \       Console.WriteLine(\"continue; or continue label;\");\n            break;\n\
  \        case '8':\n            Console.WriteLine(\"The goto:\\n\");\n         \
  \   Console.WriteLine(\"goto label;\");\n            break;\n    }\n    Console.WriteLine();\n\
  }\n```\n\n4. 创建 `ShowMenu()` 方法：\n\n```csharp\npublic void ShowMenu() {\n    Console.WriteLine(\"\
  Help on:\");\n    Console.WriteLine(\"1. if\");\n    Console.WriteLine(\"2. switch\"\
  );\n    Console.WriteLine(\"3. for\");\n    Console.WriteLine(\"4. while\");\n \
  \   Console.WriteLine(\"5. do-while\");\n    Console.WriteLine(\"6. break\");\n\
  \    Console.WriteLine(\"7. continue\");\n    Console.WriteLine(\"8. goto\\n\");\n\
  \    Console.Write(\"Choose one (q to quit): \");\n}\n```\n\n5. 创建 `IsValid()` 方法，如下：\n\
  \n```csharp\npublic bool IsValid(char ch) {\n    if(ch < '1' | ch > '8' & ch !=\
  \ 'q') return false;\n    else return true;\n}\n```\n\n6. 将上述方法组合成 `Help` 类，如下：\n\
  \n```csharp\nclass Help {\n    public void HelpOn(char what) {\n        switch(what)\
  \ {\n            case '1':\n                Console.WriteLine(\"The if:\\n\");\n\
