  Semi can carry 44000 pounds.\nTo go 252 miles semi needs 36 gallons of fuel.\nPickup\
  \ can carry 2000 pounds.\nTo go 252 miles pickup needs 16.8 gallons of fuel.\n```\n\
  \n许多其他类型的类都可以从 `Vehicle` 派生出来。例如，下面的骨架创建了一个越野类，该类存储车辆的离间隙：\n\n```csharp\n// 创建一个越野车辆类。\n\
  class OffRoad : Vehicle {\n    // 以英寸为单位的离间隙。\n    public int GroundClearance {\
  \ get; protected set; }\n    // ...\n}\n```\n\n关键点在于，一旦你创建了定义对象通用方面的基类，该基类就可以被继承以形成特化类。每个派生类只需添加其特有的属性。这就是继承的本质。\n\
  \n### 创建多级层次结构\n\n到为止，我们一直在使用仅由基类和一个派生类组成的简单类层次结构。然而，你可以构建包含任意层继承的层次结构。如前提到的，将派生类作为另一个类的基类是完全可以的。例如，给定三个名为\
  \ `A`、`B` 和 `C` 的类，`C` 可以派生自 `B`，而 `B` 可以派生自 `A`。当出现这种情况时，每个派生类都继承自自其所有基类中找到的所有特征。在这种情况下，`C`\
  \ 继承了 `B` 和 `A` 的所有方面。\n\n为了看到多级层次结构如何有用，请考虑以下程序。在其中，派生类 `Triangle` 被用作基类来创建一个名为\
  \ `ColorTriangle` 的派生类。\n\n`ColorTriangle` 继承自 `Triangle` 和 `TwoDShape` 的所有特征，并添加了一个名为\
  \ `Color` 的字段，该字段存储三角形的颜色。\n\n```csharp\n// 多级层次结构。\nusing System;\n\nclass TwoDShape\
  \ {\n    double pri_width;\n    double pri_height;\n\n    // 默认构造函数。\n    public\
  \ TwoDShape() {\n        Width = Height = 0.0;\n    }\n\n    // 接收宽度和高度的构造函数。\n\
  \    public TwoDShape(double w, double h) {\n        Width = w;\n        Height\
  \ = h;\n    }\n\n    // 指定宽度和高度。\n    public TwoDShape(double x) {\n        Width\
  \ = Height = x;\n    }\n\n    // 宽度和高度的属性。\n    public double Width {\n        get\
  \ { return pri_width; }\n        set { pri_width = value < 0 ? -value : value; }\n\
  \    }\n\n    public double Height {\n        get { return pri_height; }\n     \
  \   set { pri_height = value < 0 ? -value : value; }\n    }\n\n    public void ShowDim()\
  \ {\n        Console.WriteLine(\"Width and height are \" + Width + \" and \" + Height);\n\
  \    }\n}\n\n// TwoDShape 的派生类。\nclass Triangle : TwoDShape {\n    string Style;\n\
  \n    /* 默认构造函数。 */\n    public Triangle() {\n        Style = \"null\";\n    }\n\
  \n    // 接收样式和高度的构造函数。\n    public Triangle(string s, double w, double h) : base(w,\
  \ h) {\n        Style = s;\n    }\n\n    // 构造等腰三角形。\n    public Triangle(double\
  \ x) : base(x) {\n        Style = \"isosceles\";\n    }\n\n    public double Area()\
  \ {\n        return Width * Height / 2;\n    }\n\n    public void ShowStyle() {\n\
  \        Console.WriteLine(\"Triangle is \" + Style);\n    }\n}\n\n// 扩展 Triangle。\n\
  class ColorTriangle : Triangle {\n    string Color;\n\n    // ColorTriangle 的构造函数。\n\
  \    public ColorTriangle(string c, string s, double w, double h) : base(s, w, h)\
  \ {\n        Color = c;\n    }\n\n    // 显示颜色。\n    public void ShowColor() {\n\
  \        Console.WriteLine(\"Color is \" + Color);\n    }\n}\n\nclass Shapes {\n\
  \    static void Main() {\n        ColorTriangle t1 = new ColorTriangle(\"Blue\"\
  , \"right\", 8.0, 12.0);\n        ColorTriangle t2 = new ColorTriangle(\"Red\",\
  \ \"isosceles\", 2.0, 2.0);\n\n        Console.WriteLine(\"Info for t1: \");\n \
  \       t1.ShowStyle();\n        t1.ShowDim();\n        t1.ShowColor();\n      \
  \  Console.WriteLine(\"Area is \" + t1.Area());\n\n        Console.WriteLine();\n\
  \n        Console.WriteLine(\"Info for t2: \");\n        t2.ShowStyle();\n     \
  \   t2.ShowDim();\n        t2.ShowColor();\n        Console.WriteLine(\"Area is\
  \ \" + t2.Area());\n    }\n}\n```\n\n该程序的输出在此所示：\n\n```\nInfo for t1:\nTriangle\
  \ is right\nWidth and height are 8 and 12\nColor is Blue\nArea is 48\n\nInfo for\
  \ t2:\nTriangle is isosceles\nWidth and height are 2 and 2\nColor is Red\nArea is\
  \ 2\n```\n\n由于继承，`ColorTriangle` 可以利用之前定义的 `Triangle` 和 `TwoDShape` 类，仅添加其特定应用程序所需的额外信息。这是继承的价值所在——它允许代码重用。\n\
  \n这个示例说明了另一个重要的点：`base` 始终指向最近基类中的构造函数。`ColorTriangle` 中的 `base` 调用 `Triangle` 的构造函数。`Triangle`\
  \ 中的 `base` 调用 `TwoDShape` 的构造函数。在类层次结构中，如果基类构造函数需要参数，那么所有派生类都必须向上层传递这些参数。无论派生类本身是否需要参数都是如此。\n\
  \n### 构造函数何时被调用\n\n在前面的关于继承和类层次结构的讨论中，你可能产生了一个重要问题：当创建派生类对象时，先执行谁的构造函数？是派生类的还是由基类定义的？例如，给定一个派生类名为\
  \ `B` 和一个基类名为 `A`，是 `A` 的构造函数在 `B` 之前调用，还是反之？\n\n\n\n\n从基类到派生类。此外，无论是否使用 `base`，这个顺序都是相同的。如果没有使用\
  \ `base`，则将执行每个基类的默认（无参数）构造函数。以下程序说明了这一原理：\n\n```csharp\n// 构造函数调用的时机。\n\nusing\
  \ System;\n\n// 创建基类。\nclass A {\n    public A() {\n        Console.WriteLine(\"\
  Constructing A.\");\n    }\n}\n\n// 创建一个派生自 A 的类。\nclass B : A {\n    public B()\
  \ {\n        Console.WriteLine(\"Constructing B.\");\n    }\n}\n\n// 创建一个派生自 B 的类。\n\
  class C : B {\n    public C() {\n        Console.WriteLine(\"Constructing C.\");\n\
  \    }\n}\n\nclass OrderOfConstruction {\n    static void Main() {\n        C c\
  \ = new C();\n    }\n}\n```\n\n该程序的输出所示：\n\n```\nConstructing A\nConstructing B\n\
  Constructing C\n```\n\n如你所见，构造函数是按照派生顺序调用的。\n\n构造函数按照派生顺序执行是合乎逻辑的。因为基类对任何派生类一无所知，它需要执行的初始化都是与派生类执行的初始化分开的，并且可能是其前提。因此，它必须先执行。\n\
  \n## 第 8 章：继承\n\n### 313 基类引用与派生对象\n\n如你所知，`C#` 是一种强类型语言。除了适用于其简单类型的标准转换和自动提升外，类型兼容性是严格强制执行的。\n\
  \n因此，一个类类型的引用变量通常不能指向另一个类类型的对象。例如，考虑以下程序：\n\n```csharp\n// 这将无法编译。\nclass X {\n\
  \    int a;\n    public X(int i) { a = i; }\n}\n\nclass Y {\n    int a;\n    public\
  \ Y(int i) { a = i; }\n}\n\nclass IncompatibleRef {\n    static void Main() {\n\
  \        X x = new X(10);\n        X x2;\n        Y y = new Y(5);\n        x2 =\
  \ x; // 确定，两者类型相同\n        x2 = y; // 错误，类型不同\n    }\n}\n```\n\n在这里，即使类 `X` 和类 `Y`\
  \ 在结构上是相同的，但无法将类型 `X` 的引用赋值给类型 `Y` 的变量，因为它们具有不同的类型。通常情况下，引用变量只能引用其所属类型的对象。\n\n然而，`C#`\
  \ 的严格类型强制执行有一个重要的例外。基类的引用变量可以被赋值指向任何派生自该基类的类对象的引用。这是合法的，因为派生类型的实例封装了基类类型的实例。因此，基类引用可以指向该实例。这里是一个示例：\n\
  \n```csharp\n// 基类引用可以指向派生类对象。\nusing System;\n\nclass X {\n    public int a;\n\
  \    public X(int i) {\n        a = i;\n    }\n}\n\nclass Y : X {\n    public int\
  \ b;\n    public Y(int i, int j) : base(j) {\n        b = i;\n    }\n}\n\nclass\
  \ BaseRef {\n    static void Main() {\n        X x = new X(10);\n        X x2;\n\
  \        Y y = new Y(5, 6);\n        // OK 因为 Y 派生自 X，因此 x2 可以指向 y\n        x2 =\
  \ x; // OK，两者类型相同\n        Console.WriteLine(\"x2.a: \" + x2.a);\n        x2 = y;\
  \ // 仍然 OK 因为 Y 派生自 X\n        Console.WriteLine(\"x2.a: \" + x2.a);\n        //\
  \ X 引用只知道 X 的成员。\n        x2.a = 19; // OK\n        // x2.b = 27; // 错误！X 没有 b 成员。\n\
  \    }\n}\n```\n\n在这里，`Y` 现在派生自 `X`；因此，为 `x2` 赋值指向 `Y` 对象的引用是允许的。\n\n理解这一点非常重要：决定哪些成员可以被访问的是**引用变量的类型**，而不是它所指向的对象的类型。也就是说，当将一个指向派生类对象的引用赋值给基类引用变量时，你只能访问对象中由基类定义的部分。这就是为什么即使\
  \ `x2` 指向一个 `Y` 对象，它也无法访问 `b`。这是合乎逻辑的，因为基类并不知道派生类为其增加了哪些内容。这就是为什么程序中最后一行代码被注释掉的原因。\n\
  \n虽然前面的讨论可能看起来有些深奥，但它有一些重要的实际应用。这里描述了一个。另一个将在本章稍后介绍虚方法时进行讨论。\n\n派生类引用被赋值给基类变量的一个重要场景是在类层次结构中调用构造函数时。如你所知，类通常会定义一个以其类对象作为参数的构造函数。这允许该类构造一个对象的拷贝。派生自此类类的类可以利用这一特性。例如，这里是\
  \ `TwoDShape` 和 `Triangle` 的构造函数，它们接受其所属类的对象作为参数。\n\n## 第 8 章：继承\n\n### 315\n\n\
  ```csharp\nclass TwoDShape {\n    // ...\n    // 构建一个 TwoDShape 对象。\n    public\
  \ TwoDShape(TwoDShape ob) {\n        Width = ob.Width;\n        Height = ob.Height;\n\
  \    }\n}\n\n// ...\nclass Triangle : TwoDShape {\n    // ...\n    // 构建一个 Triangle\
  \ 对象。\n    public Triangle(Triangle ob) : base(ob) {\n        Style = ob.Style;\n\
  \    }\n}\n```\n\n### 虚方法与重写\n\n*虚方法*是在基类中被声明为 `virtual` 的方法。虚方法的定义特征是它可以在一个或多个派生类中被重定义。\n\
  \n因此，每个派生类都可以拥有虚方法的自己的版本。虚方法的有趣之处在于当通过基类引用调用它时发生的情况。在这种情况下，`C#` 根据*指向的对象的类型*来决定调用哪个版本，而这种决定是在*运行时*进行的。因此，当引用不同的对象时，会执行不同版本的虚方法。换句话说，是引用对象的类型（而不是引用的类型）决定了将执行哪个版本的虚方法。\n\
  \n### 316 C# 3.0：入门指南\n\n方法重写构成了 `C#` 最强大概念之一的基础：*动态* *方法分发*。动态方法分发是在运行时而非编译时解析对重写方法调用的的机制。动态方法分发非常重要，因为这是\
  \ `C#` 实现运行时多态的方式。\n\n这里是一个说明虚方法和重写的示例：\n\n```csharp\n// 演示虚方法。\nusing System;\n\
  \nclass Base {\n    // 在基类创建虚方法。\n    public virtual void Who() {\n        // 声明一个虚方法。\n\
  \    }\n}\n```\n\n\n\n\n```csharp\nConsole.WriteLine(\"Who() in Base\");\n}\n\n\
  class Derived1 : Base {\n    // 在派类中重写 Who()\n    public override void Who() {\n\
  \        Console.WriteLine(\"Who() in Derived1\");\n    }\n}\n\n// 重写虚方法。\nclass\
  \ Derived2 : Base {\n    // 在另一个派类中再次重写 Who()\n    public override void Who() {\n\
  \        Console.WriteLine(\"Who() in Derived2\");\n    }\n}\n\nclass OverrideDemo\
  \ {\n    static void Main() {\n        Base baseOb = new Base();\n        Derived1\
  \ dOb1 = new Derived1();\n        Derived2 dOb2 = new Derived2();\n        Base\
  \ baseRef; // 一个基类引用\n        baseRef = baseOb;\n        baseRef.Who();\n      \
  \  baseRef = dOb1;\n        // 在每个情况下，调用的 Who( ) 版本根据\n        // 所引用对象的类型在运行时决定的。\n\
  \        baseRef.Who();\n        baseRef = dOb2;\n        baseRef.Who();\n    }\n\
  }\n```\n\n## 第 8 章：继承\n\n### 317\n\n程序的输出所示：\n\n```\nWho() in Base\nWho() in Derived1\n\
  Who() in Derived2\n```\n\n该程序创建了一个名为 `Base` 的基类以及它的两个派生类，分别称为 `Derived1` 和 `Derived2`。`Base`\
  \ 声明了一个名为 `Who()` 的方法，派生类重写了它。在 `Main()` 方法中，声明了类型为 `Base`、`Derived1` 和 `Derived2`\
  \ 的对象。此外还声明了一个类型为 `Base` 的引用，`baseRef`。程序随后将每种类型对象的引用赋值给 `baseRef`，并使用该引用调用 `Who()`。如输出所示，执行的\
  \ `Who()` 版本是由调用时所引用对象的类型决定的，而不是由 `baseRef` 的类类型决定的。\n\n并不是重写虚方法。如果派生类没有提供虚方法的自己的版本，则将使用基类中的版本。例如：\n\
  \n```csharp\n/* 当虚方法未被重写时，使用基类方法。 */\nusing System;\nclass Base {\n    // 在基类中创建虚方法。\n\
  \    public virtual void Who() {\n        Console.WriteLine(\"Who() in Base\");\n\
  \    }\n}\n\nclass Derived1 : Base {\n    // 在派类中重写 Who()\n    public override void\
  \ Who() {\n        Console.WriteLine(\"Who() in Derived1\");\n    }\n}\n\nclass\
  \ Derived2 : Base {\n    // 这里没有重写 Who()。\n    // 此类没有重写 Who()。\n}\n\nclass NoOverrideDemo\
  \ {\n    static void Main() {\n        Base baseOb = new Base();\n        Derived1\
  \ dOb1 = new Derived1();\n        Derived2 dOb2 = new Derived2();\n        Base\
  \ baseRef; // 一个基类引用\n        baseRef = baseOb;\n        baseRef.Who();\n      \
  \  // 318\n        // C# 3.0：初学者指南\n        baseRef = dOb1;\n        baseRef.Who();\n\
  \        baseRef = dOb2;\n        baseRef.Who(); // 调用 Base 的 Who()\n        //\
  \ 这调用了 Base 的 Who()。\n    }\n}\n```\n\n该程序的输出所示：\n\n```\nWho() in Base\nWho() in\
  \ Derived1\nWho() in Base\n```\n\n在这里，`Derived2` 没有重写 `Who()`。因此，当对 `Derived2` 对象调用\
  \ `Who()` 时，执行的是 `Base` 中的 `Who()`。\n\n### 专家问答\n\n**Q：属性可以是虚的吗？**\n\n**A：可以的。属性可以通过\
  \ `virtual` 关键字进行修改，并使用 `override` 进行重写。索引器（indexers）也是如此。\n\n## 为什么要重写方法？\n\n重写方法允许\
  \ C# 支持运行时多态。多态对于面向对象编程之所以至关重要，原因在于：它允许一个通用类指定所有派生类都通用的方法，同时允许派生类定义这些方法中部分或全部方法的特定实现。重写方法是\
  \ C# 实现多态中“一个接口，多个方法”特性的另一种方式。\n\n成功应用多态的关键部分之一是理解基类和派生类形成了一个从低特化化到高特化化的层次结构。\n\n\
  如果使用得当，基类提供了派生类可以直接使用的所有元素。它还定义了派生类必须自己实现的方法。这使得派生类具有定义自己方法的灵活性，但仍然强制了一致的接口。\n\n\
  因此，通过将继承与重写方法相结合，基类可以定义所有派生类都将使用的方法的通用形式。\n\n## 应用虚方法\n\n为了更好地理解虚方法的威力，我们将将其应用于\
