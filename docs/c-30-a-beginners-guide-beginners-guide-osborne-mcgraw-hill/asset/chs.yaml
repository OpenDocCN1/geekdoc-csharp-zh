  # 第 4 章：介绍类、对象和方法\n\n## 构造函数\n\n在之前的示例中，每个 `Vehicle` 对象的实例变量必须使用一系列语句手动设置，例如：\n\n\
  ```csharp\nminivan.Passengers = 7;\nminivan.FuelCap = 16;\nminivan.Mpg = 21;\n```\n\
  \n这种方法永远不会在专业编写的 C# 代码中使用。除了容易出错（你可能会忘记设置其中一个字段）之外，有更好的方法来完成这项任务：构造函数。\n\n*构造函数*在对象创建时初始化该对象。它的名称与它的类相同，并且在语法上与方法相似。然而，构造函数没有显式的返回类型。构造函数的通用形式所示：\n\
  \n```text\n访问修饰符 类名(参数列表) {\n    // 构造函数代码\n}\n```\n\n通常，你将使用构造函数为类定义的实例变量提供初始值，或者执行创建全配置对象所需的任何其他启动程序。\n\
  \n通常，`访问修饰符` 是 `public`，因为构造函数通常是从类外部调用的。所有类都有构造函数，无论你是否定义了，因为 C# 会自动提供一个默认构造函数，将成员变量初始化为默认值。对于值类型，默认值是零；对于布尔类型，默认值是\
  \ `false`；对于引用类型，默认值是 `null`。一旦你定义了自己的构造函数，默认构造函数就不再使用了。这是一个使用构造函数的简单示例：\n\n```csharp\n\
  // 简单的构造函数。\nusing System;\n\nclass MyClass {\n    public int x;\n    public MyClass()\
  \ {\n        x = 10;\n    }\n}\n```\n\n144\nC# 3.0: 初学者指南\n第 4 章：介绍类、对象和方法\nclass\
  \ ConsDemo {\nstatic void Main() {\nMyClass t1 = new MyClass();\n}}\n\n## 参数化构造函数\n\
  \n在之前的示例中，使用了无参数构造函数。这在某些情况下是可以的，但通常你需要一个接受一个或多个参数的构造函数。参数添加到构造函数的方式与方法相同：在构造函数名称后的括号内声明它们。例如，这里\
  \ `MyClass` 有一个参数化构造函数：\n\n```csharp\n// 参数化构造函数。\nusing System;\n\nclass MyClass\
  \ {\n    public int x;\n    public MyClass(int i) {\n        x = i;\n    }\n}\n\n\
  class ParmConsDemo {\n    static void Main() {\n        MyClass t1 = new MyClass(10);\n\
  \        MyClass t2 = new MyClass(88);\n        Console.WriteLine(t1.x + \" \" +\
  \ t2.x);\n    }\n}\n```\n\n该程序的输出为：\n10 88\n\n在该程序中，`MyClass()` 构造函数定义了一个名为 `i`\
  \ 的参数，用于初始化实例变量 `x`。因此，当执行此行时，`MyClass t1 = new MyClass(10)`，值 10 被传递给 `i`，然后赋值给\
  \ `x`。\n\n## 为 Vehicle 类添加构造函数\n\n我们可以通过添加构造函数来改进 `Vehicle` 类，在构造对象时自动初始化 `Passengers`、`FuelCap`\
  \ 和 `Mpg` 字段。注意 `Vehicle` 对象的创建方式。\n\n```csharp\n// 为 Vehicle 添加构造函数。\nusing System;\n\
  \nclass Vehicle {\n    public int Passengers; // 乘客\n    public int FuelCap; //\
  \ 油箱容量（加仑）\n    public int Mpg; // 每加仑英里数\n\n    // 这是 Vehicle 的构造函数。\n    public\
  \ Vehicle(int p, int f, int m) {\n        Passengers = p;\n        FuelCap = f;\n\
  \        Mpg = m;\n    }\n\n    // 返回范围。\n    public int Range() {\n        return\
  \ Mpg * FuelCap;\n    }\n\n    // 计算给定距离所需的燃料。\n    public double FuelNeeded(int\
  \ miles) {\n        return (double) miles / Mpg;\n    }\n}\n```\n\n146\nC# 3.0:\
  \ 初学者指南\nclass VehConsDemo {\nstatic void Main() {\n// 构造完整的车辆。\nVehicle minivan\
  \ = new Vehicle(7, 16, 21);\n}\n}\n```\n\n传递信息给 Vehicle\n\n\n\n\n\n```\nVehicle\
  \ sportscar = new Vehicle(2, 14, 12);\n\nthrough its constructor.\n\ndouble gallons;\n\
  \nint dist = 252;\n\ngallons = minivan.FuelNeeded(dist);\n\nConsole.WriteLine(\"\
  To go \" + dist + \" miles minivan needs \" +\n\ngallons + \" gallons of fuel.\"\
  );\n\ngallons = sportscar.FuelNeeded(dist);\n\nConsole.WriteLine(\"To go \" + dist\
  \ + \" miles sportscar needs \" +\n\ngallons + \" gallons of fuel.\");\n\n}\n\n\
  }\n```\n\n`minivan` 和 `sportscar` 在创建时都通过 `Vehicle()` 构造函数进行了初始化。每个对象都按照其构造函数指定的参数进行初始化。例如，在以下行代码中：\n\
  \n```csharp\nVehicle minivan = new Vehicle(7, 16, 21);\n```\n\n当 `new` 创建对象时，值 7、16\
  \ 和 21 被传递给 `Vehicle()` 构造函数。\n\n因此，`minivan` 的 `Passengers`、`FuelCap` 和 `Mpg` 副本将分别包含值\
  \ 7、16 和 21。所以，该程序的输出与上一个版本相同。\n\n# 重新回顾 new 运算符\n\n现在你已经对类及其构造函数有了进一步的了解，让我们仔细观察一下\
  \ `new` 运算符。它具有以下通用形式：\n\n```\nnew class-name(arg-list)\n```\n\n在这里，`class-name`\
  \ 是正在实例化的类名。类名后跟括号指定了该类的构造函数，正如前一节所描述。如果一个类没有定义自己的构造函数，`new` 将使用 C# 提供的默认构造函数。\n\
  \n由于内存是有限的，`new` 可能会因为内存不足而无法为对象分配内存。如果发生这种情况，将产生一个运行时异常。（你将在第 9 章中学习异常。）对于书中的示例程序，你不需要担心内存耗尽，但在你编写的实际程序中，你将考虑这种可能性。\n\
  \n## 第 4 章：类、对象和方法的简介\n\n### 专家问答\n\n**Q：为什么我不需要对 int 或 float 等值类型的变量使用 `new` 呢？**\n\
  \n**A：** 在 C# 中，值类型的变量包含它自己的值。当程序运行时，会自动提供存储该值的内存。因此，不需要显式地使用 `new` 分配这些内存。相反，引用变量存储指向对象的引用。存储该对象的内是在执行期间动态分配的。\n\
  \n不将 `int` 或 `char` 等基本类型变为引用类型，可以极大地提高程序的性能。使用引用类型时，存在一层间接层，这会给每次对象访问增加开销。值类型则避免了这种开销。\n\
  \n有趣的是，允许在值类型上使用 `new`，如下：`int i = new int();`。\n\n这样做会调用类型 `int` 的默认构造函数，它将 `i`\
  \ 初始化为 0。通常情况下，为值类型调用 `new` 会调用该类型的默认构造函数。然而，它不会动态分配内存。坦率地说，大多数程序员不会在值类型上使用 `new`。\n\
  \n## 垃圾回收与析构函数\n\n正如你所看到的，通过 `new` 运算符从空内存池中动态分配对象。当然，内存不是无限的，空内存可能会被耗尽。因此，`new`\
  \ 可能会因为没有足够的空内存来创建所需的对象而失败。由于如此，任何动态分配方案的核心组件之一都是从未使用的对象中恢复空内存，以便后续的重新分配。在许多编程语言中，释放之前分配的内存是手动处理的。例如，在\
  \ C++ 中，你使用 `delete` 运算符来释放已分配的内存。然而，C# 使用了一种不同的、更省心的方法：垃圾回收。\n\nC# 的垃圾回收系统会自动回收对象——在后台透明地发生，不需要任何程序员的干预。它的工作原理是：当不存在指向对象的引用时，该对象被认为不再需要，对象占用的内存会被释放。这些被回收的内存可以用于随后的分配。\n\
  \n垃圾回收只在程序执行期间偶然发生。它不会仅仅因为存在一个多个不再使用的对象而发生。因此，你无法准确知道垃圾回收何时发生。\n\n## 析构函数\n\n可以定义一种方法，在垃圾回收器最终销毁对象之前被调用。这种方法被称为析构函数，可以在某些高度特殊的情况下使用，以确保对象干净终止。例如，你可能使用析构函数来确保对象拥有的系统资源被释放。必须说明，析构函数是非常高级的功能，适用于某些特殊情况。它们通常不需要。但是，因为它们是\
  \ C# 的一部分，为了完整性，这里进行了简要描述。\n\n析构函数具有以下通用形式：\n\n```\n~class-name() {\n    //析构代码\n\
  }\n```\n\n在这里，`class-name` 是类名。因此，析构函数的声明与构造函数类似，只是前面有一个 `~`（波浪号）。注意它没有返回值。\n\n\
  重要的是，析构函数是在垃圾回收发生正之前被调用的。\n\n例如，当包含对象引用的变量离开作用域时，析构函数不会被调用。（这与 C++ 中的析构函数不同，C++\
  \ 的析构函数在对象离开作用域时被调用。）这意味着你无法确定析构函数何时执行。\n\n此外，程序可能会在垃圾回收之前结束。\n\n## this 关键字\n\n\
  在结束本之前，有引入 `this`。当方法被调用时，会自动传递一个指向调用对象的引用（即调用该方法的对象）。这个引用被称为 `this`。因此，`this` 指向正在执行操作的对象。为了理解\
  \ `this`，首先考虑一个名为 `Pwr` 的类，它计算一个数字的幂次方：\n\n```csharp\nusing System;\n\nclass Pwr\
  \ {\n    public double b;\n    public int e;\n    public double val;\n    public\
  \ Pwr(double num, int exp) {\n        b = num;\n        e = exp;\n        val =\
  \ 1;\n        for(; exp>0; exp--) val = val * b;\n    }\n\n    public double GetPwr()\
  \ {\n        return val;\n    }\n}\n\nclass DemoPwr {\n    static void Main() {\n\
  \        Pwr x = new Pwr(4.0, 2);\n        Pwr y = new Pwr(2.5, 1);\n        Pwr\
  \ z = new Pwr(5.7, 0);\n        Console.WriteLine(x.b + \" raised to the \" + x.e\
  \ + \" power is \" + x.GetPwr());\n        Console.WriteLine(y.b + \" raised to\
  \ the \" + y.e + \" power is \" + y.GetPwr());\n        Console.WriteLine(z.b +\
  \ \" raised to the \" + z.e + \" power is \" + z.GetPwr());\n    }\n}\n```\n\n正如你所知，在方法内部，可以直接访问类的其他成员，而无需任何对象或类限定。因此，在\
  \ `GetPwr()` 内部，语句 `return val;` 意味着返回与调用对象相关的 `val` 副本。然而，相同的语句也可以写成如下：\n\n```csharp\n\
  return this.val;\n```\n\n在这里，`this` 指向调用 `GetPwr()` 的对象。因此，`this.val` 指向该对象的 `val`\
  \ 副本。例如，如果 `GetPwr()` 是在 `x` 上调用的，那么前述语句中的 `this` 将指向 `x`。不使用 `this` 编写语句实际上只是简写。\n\
  \n在构造函数内部也可以使用 `this`。在这种情况下，`this` 指向正在被构造的对象。例如，在 `Pwr()` 内部，语句\n\n```\nb = num;\n\
  e = exp;\n```\n\n可以写成这样：\n\n```csharp\nthis.b = num;\nthis.e = exp;\n```\n\n\n\n\
  \n\n当然，在这种情况下这样做没有任何益处。\n\n150\n\n# C# 3.0：入门指南\n\n以下是使用 `this` 引用编写的整个 `Pwr` 类：\n\
  \n```csharp\n// Demonstrate this.\nclass Pwr {\n    public double b;\n    public\
  \ int e;\n    public double val;\n\n    public Pwr(double num, int exp) {\n    \
  \    this.b = num;\n        this.e = exp;\n        this.val = 1;\n        for( ;\
  \ exp>0; exp--) this.val = this.val * this.b;\n    }\n\n    public double GetPwr()\
  \ {\n        return this.val;\n    }\n}\n```\n\n实际上，没有任何 C# 程序员会像上面那样使用 `this` 来编写\
  \ `Pwr` 类，因为这样做没有任何收益，而且标准形式更简单。然而，`this` 具有一些重要的用途。例如，C# 允许参数或局部变量的名字与实例变量的名字相同。当这种情况发生时，局部名称会*隐藏*实例变量。你可以通过\
  \ `this` 引用它来访问被隐藏的实例变量。例如，以下是语法上有效的编写 `Pwr()` 构造的方法：\n\n```csharp\npublic Pwr(double\
  \ b, int e) {\n    // Here this.b refers to the b instance\n    this.b = b; // 变量，而不是参数。\n\
  \    this.e = e;\n    val = 1;\n    for( ; e>0; e--) val = val * b;\n}\n```\n\n\
  在这个版本中，参数的名字与实例变量的名字相同，因此隐藏了它们。然而，`this` 被用来“揭示”实例变量。\n\n### ✓ 第 4 章自测题\n\n1. 类和对象之间的区别是什么？\n\
