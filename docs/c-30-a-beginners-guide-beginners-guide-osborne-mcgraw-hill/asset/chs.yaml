  \ putloc++;\n    }\n\n    // 从队列中获取字符。\n    public char Get() {\n        if(getloc\
  \ == putloc)\n            throw new QueueEmptyException(\"Queue is empty.\");\n\
  \        getloc++;\n        return q[getloc];\n    }\n}\n```\n\n在 `SimpleQueue`\
  \ 中添加异常允许处理队列错误。回想一下，之前的 `SimpleQueue` 版本只是报告错误。抛出异常允许代码以适当的方式进行处理。\n\n4. 要尝试更新后的\
  \ `SimpleQueue` 类，请将所示的 `QExcDemo` 类添加到 `QExcDemo.cs`。\n\n```csharp\n//er 队列异常。\n\
  class QExcDemo {\n    static void Main() {\n        SimpleQueue q = new SimpleQueue(10);\n\
  \        char ch;\n        int i;\n        try {\n            // 溢出队列。\n       \
