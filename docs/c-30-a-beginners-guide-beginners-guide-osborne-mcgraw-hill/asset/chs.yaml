  \ 运算符。例如，尝试定义 `|` 以便产生两个集合之间的*对称差*。（对称差由两个集合不共有的元素组成。）\n\n![](img/index-304_1.jpg)\n\
  \n# 第 8 章\n\n## 继承\n\n287\n\n版权所有 © 2009 The McGraw-Hill Companies。点击此处查看使用条款。\n\
  \n288\n\nC# 3.0: 入学者指南\n\n## 核心技能与概念\n\n* 继承基础\n* Protected 访问\n* 调用基类构造函数\n* 多级类层次结构\n\
  * 基类对派生类对象的引用\n* 虚方法\n* 抽象类\n* `sealed`\n* `object` 类\n\n继承是面向对象编程的三大基本之一，因为它允许创建分级分类。通过继承，你可以创建一个通用类，用于定义一组相关项的共同特征。该类随后可以被其他更具体的类继承，每个派生类都添加了其特有的内容。\n\
  \n在 C# 语言中，被继承的类被称为*基类*（base class）。进行继承的类被称为*派生类*（derived class）。因此，派生类是基类的特化版本。它继承了基类定义的所有变量、方法、属性和索引器，并添加了自身特有的元素。\n\
  \n### 继承基础\n\nC# 通过允许一个类在 fact 声明中包含另一个类来支持继承。\n\n这是通过在声明派生类时指定基类来实现的。让我们从一个短示例开始，来说明继承的几个关键特征。以下程序创建了一个名为\
  \ `TwoDShape` 的基类，用于存储二维对象的宽度和高度，并创建了一个名为 `Triangle` 的派生类。请注意 `Triangle` 的声明方式。\n\
  \n```csharp\n// 一个简单的类层次结构。\nusing System;\n\n// 用于二维对象的类。\nclass TwoDShape {\n\
  \    public double Width;\n    public double Height;\n\n    public void ShowDim()\
  \ {\n        Console.WriteLine(\"Width and height are \" + Width + \" and \" + Height);\n\
  \    }\n}\n\n// Triangle 继承自 TwoDShape。\nclass Triangle : TwoDShape {\n    // Triangle\
  \ 继承了 TwoDShape。注意这种语法。\n    public string Style;\n\n    public double Area() {\n\
  \        // Triangle 可以引用 TwoDShape 的成员\n        // 就像它们是 Triangle 的一样。\n      \
  \  return Width * Height / 2;\n    }\n\n    public void ShowStyle() {\n        Console.WriteLine(\"\
  Triangle is \" + Style);\n    }\n}\n\nclass Shapes {\n    static void Main() {\n\
  \        Triangle t1 = new Triangle();\n        Triangle t2 = new Triangle();\n\
  \        t1.Width = 4.0;\n        // Triangle 的所有成员对 Triangle 对象\n        // 可用，甚至是那些继承自\
  \ TwoDShape 的成员。\n        t1.Height = 4.0;\n        t1.Style = \"isosceles\";\n\n\
  \        t2.Width = 8.0;\n        t2.Height = 12.0;\n        t2.Style = \"right\"\
  ;\n\n        Console.WriteLine(\"Info for t1: \");\n        t1.ShowStyle();\n  \
  \      t1.ShowDim();\n        Console.WriteLine(\"Area is \" + t1.Area());\n   \
  \     Console.WriteLine();\n\n        Console.WriteLine(\"Info for t2: \");\n  \
  \      t2.ShowStyle();\n        t2.ShowDim();\n        Console.WriteLine(\"Area\
  \ is \" + t2.Area());\n    }\n}\n```\n\n289\n\nC# 3.0: 入学者指南\n\n该程序的输出显示在此：\n\n\
  Info for t1:\nTriangle is isosceles\nWidth and height are 4 and 4\nArea is 8\n\n\
  Info for t2:\nTriangle is right\nWidth and height are 8 and 12\nArea is 48\n\n290\n\
  \n因为 `Triangle` 继承了 `TwoDShape`。注意这种语法。继承类的语法非常简单且易于使用。\n\n由于 `Triangle` 包含了其基类\
  \ `TwoDShape` 的所有成员，它可以直接访问 `Width` 和 `Height`，就像它们是 `Triangle` 的一样。图 8-1 描绘了 `TwoDShape`\
  \ 如何被纳入 `Triangle` 中。\n\n尽管 `TwoDShape` 是 `Triangle` 的基类，但这并不意味着基类本身不能使用。作为派生类的基类并不意味着它不能单独使用。例如，以下代码是完全有效的：\n\
  \n```csharp\nTwoDShape shape = new TwoDShape();\nshape.Width = 10;\nshape.Height\
  \ = 20;\nshape.ShowDim();\n```\n\n图 8-1 Triangle 类的概念图\n\n291\n\n当然，`TwoDShape`\
  \ 对象对任何派自 `TwoDShape` 的类一无所知，也无法访问。\n\n继承基类的 `class` 声明通用形式所示：\n\n```csharp\nclass\
  \ derived-class : base-class {\n    // 类体\n}\n```\n\n注意，你创建的任何派生类只能指定一个基类。C# 不支持向单个派生类继承多个基类。（这与\
  \ C++ 不同，在 C++ 中你可以继承多个基类。在将 C++ 代码转换为 C# 时请注意这一点。）然而，你可以创建一个继承层次结构，其中一个派生类成为另一个派生类的基类。当然，任何类不能是自身的基类。\n\
  \n\n\n\n\n`Rectangle` 类继承了 `TwoDShape`，并添加了 `IsSquare()` 方法（用于判断矩形是否为正方形）以及 `Area()`\
  \ 方法（用于计算矩形的面积）。\n\n## 成员访问与继承\n\n正如你在第 6 章中所学习的，类的成员通常被声明为 `private`（私有），以防止未经授权的访问或篡改。继承一个类*并不会*覆盖私有访问限制。\n\
  \n因此，尽管派生类包含了其基类的所有成员，它也无法访问基类中声明为 `private` 的成员。例如，如下所示，如果 `Width` 和 `Height` 在\
  \ `TwoDShape` 中被设为 `private`，那么 `Triangle` 将无法访问它们。\n\n```csharp\n// 私有成员不会被继承。\n\
  \n// 此示例将无法编译。\n\nusing System;\n\n// 一个用于二维对象的类。\nclass TwoDShape {\n    double\
  \ Width; // 私有\n    double Height; // 私有\n\n    public void ShowDim() {\n      \
  \  Console.WriteLine(\"Width and height are \" +\n            Width + \" \" + Height);\n\
  \    }\n}\n\n// Triangle 继承自 TwoDShape。\nclass Triangle : TwoDShape {\n    public\
  \ string Style;\n\n    // 无法访问基类的私有成员。\n    public double Area() {\n        return\
  \ Width * Height / 2; // 错误！无法访问私有成员。\n    }\n\n    public void ShowStyle() {\n\
  \        Console.WriteLine(\"Triangle is \" + Style);\n    }\n}\n```\n\n`Triangle`\
  \ 类无法编译，因为 `Area()` 方法内部对 `Width` 和 `Height` 的引用会导致访问冲突。由于 `Width` 和 `Height` 是私有的，它们只能由所属类内部访问。派生类无法访问它们。记住：私有成员对于该类仍然是私有的，类之外的任何代码无法访问。\n\
  \n起初，你可能认为派生类无法访问基类的私有成员是一个严重的限制，因为这会阻止许多情况下对这些成员的使用。然而，事实并非如此；C# 提供了多种解决方案。一种是使用\
  \ `protected` 成员（见下节），另一种是使用公共属性来提供对私有数据的访问。正如上一节所述，属性允许你管理实例变量的访问。例如，你可以对这些值施加约束，或者将其设为只读。通过将属性设为公共但将其底层变量声明为私有，派生类仍然可以使用属性，同时确保\
  \ `Width` 和 `Height` 的值为正数。这允许你在笛卡尔坐标系的任何象限内通过获取它们的绝对值。\n\n```csharp\n// 使用属性设置和获取私有成员。\n\
  using System;\n\n// 一个用于二维对象的类。\nclass TwoDShape {\n    double pri_width;\n    double\
  \ pri_height;\n\n    // Width 和 Height 的属性。\n    public double Width {\n       \
  \ get { return pri_width; }\n        set { pri_width = value < 0 ? -value : value;\
  \ }\n    }\n    // 这里，Width 和 Height 是属性。\n    public double Height {\n        get\
  \ { return pri_height; }\n        set { pri_height = value < 0 ? -value : value;\
  \ }\n    }\n\n    public void ShowDim() {\n        Console.WriteLine(\"Width and\
  \ height are \" +\n            Width + \" \" + Height);\n    }\n}\n\n// 用于三角形的 TwoDShape\
  \ 派生类。\nclass Triangle : TwoDShape {\n    public string Style;\n\n    public double\
  \ Area() {\n        // 现在可以使用 Width 和 Height，因为\n        // 它们是通过属性访问的。\n      \
  \  return Width * Height / 2;\n    }\n\n    public void ShowStyle() {\n        Console.WriteLine(\"\
  Triangle is \" + Style);\n    }\n}\n\nclass Shapes2 {\n    static void Main() {\n\
  \        Triangle t1 = new Triangle();\n        Triangle t2 = new Triangle();\n\
  \        t1.Width = 4.0;\n        t1.Height = 4.0;\n        t1.Style = \"isosceles\"\
  ;\n        t2.Width = 8.0;\n        t2.Height = 12.0;\n        t2.Style = \"right\"\
  ;\n\n        Console.WriteLine(\"Info for t1: \");\n        t1.ShowStyle();\n  \
  \      t1.ShowDim();\n        Console.WriteLine(\"Area is \" + t1.Area());\n   \
  \     Console.WriteLine();\n        Console.WriteLine(\"Info for t2: \");\n    \
  \    t2.ShowStyle();\n        t2.ShowDim();\n        Console.WriteLine(\"Area is\
  \ \" + t2.Area());\n    }\n}\n```\n\n此程序的输出与之前的版本相同。唯一的区别是，现在 `Width` 和 `Height`\
  \ 是公共属性，用于管理对私有实例变量的访问。\n\n## 专家问\n\n**Q：我在 Java 编程讨论中听过“superclass”（超类）和“subclass”（子类）这些词。这些词在\
  \ C# 中有意义吗？**\n\n**A：** Java 中的 superclass 在 C# 中称为 base class（基类）。Java 中的 subclass\
  \ 在 C# 中称为 derived class（派生类）。你经常会听到这两组术语应用于任何语言的类，但本书将继续使用标准的 C# 术语。顺便提一下，C++ 也使用基类、派生类的术语。\n\
  \n## 使用 Protected \n\n正如上一节解释，基类的私有成员无法被派生类访问。这似乎意味着如果你想让派生类访问基类中的某个成员，它必须是公共的。当然，将成员设为公共也会使其对所有其他代码可用，这可能并不是所希望的。幸运的是，这种推论是错误的，因为\
  \ C# 允许创建一个 *protected*（受保护）成员。受保护成员在其类层次结构内部是可的，但在该结构之外是私有的。\n\n受保护成员使用 `protected`\
  \ 访问修饰符创建。当类的成员声明为 `protected` 时，该成员除一个重要的例外外，都是私有的。例外发生在受保护成员被继承时。在这种情况下，基类的受保护成员变成了派生类的受保护成员，因此派生类可以访问它。因此，通过使用\
  \ `protected`，你可以创建对所属类私有但仍可继承和访问的类成员。\n\n```csharp\n//  protected。\nusing System;\n\
  \n// 字段 i 和 j 被声明为 protected。\nclass B {\n    protected int i, j; // B 私有，但 D 可访问\n\
  \n    public void Set(int a, int b) {\n        i = a;\n        j = b;\n    }\n\n\
  \    public void Show() {\n        Console.WriteLine(i + \" \" + j);\n    }\n}\n\
  \nclass D : B {\n    int k; // 私有\n\n    // D 可以访问 B 的 i 和 j。\n    public void SetK()\
  \ {\n        k = i * j;\n        // D 可以访问 i 和 j，因为它们是受保护的，而不是私有的。\n    }\n\n  \
  \  public void Showk() {\n        Console.WriteLine(k);\n    }\n}\n\nclass ProtectedDemo\
  \ {\n    static void Main() {\n        D ob = new D();\n        ob.Set(2, 3); //\
  \ OK, D 已知\n        ob.Show(); // OK, D 已知\n        ob.SetK(); // OK, D 的成员\n  \
  \      ob.Showk(); // OK, D 的成员\n    }\n}\n```\n\n\n\n\n虽然 `protected` 访问权限非常有用，但它并不适用于所有情况。例如，在上一节所示的\
  \ `TwoDShape` 案例中，我们特别希望 `Width` 和 `Height` 值是公开可访问的。我们只是想管理赋值给它们的值。因此，将它们声明为 `protected`\
  \ 并不是选项。在这种情况下，使用属性（properties）提供了恰的解决方案，通过控制而不是阻止访问。\n\n请记住，当你想要创建一个在整个类层次结构中都是私有的、但在其他情况下不受限制的成员时，请使用\
  \ `protected`。要管理对值的访问，请使用属性。\n\n### 构造函数与继承\n\n在层次结构中，基类和派生类都可以拥有它们自己的构造函数。这引了一个重要问题：哪一个构造函数负责构建派生类的对象？是基类中的、派生类中的，还是两者都有？\n\
  \n答案是：基类的构造函数负责构建对象的基类部分，而派生类的构造函数负责构建派生类部分。这是合理的，因为基类不知道也无法访问派生类中的任何元素。\n\n因此，它们的构建必须是分开的。之前的示例依赖于\
  \ C# 自动创建的默认构造函数，所以这不是问题。但在实践中，大多数类都会有构造函数。在这里，你将看到如何处理这种情况。\n\n当只有派生类定义了构造函数时，处理过程非常简单：只需构建派生类对象即可。对象的基类部分将使用其默认构造函数自动构建。例如，这里有一个定义了构造函数的\
  \ `Triangle` 重构版本。它还将 `Style` 设为私有，因为它现在由构造函数设置的。\n\n```cs\n// 给 Triangle 添加一个构造函数。\n\
  \nusing System;\n\n// 一个用于二维对象的类。\n\nclass TwoDShape {\n\ndouble pri_width;\n\n\
  double pri_height;\n\n// Width 和 Height 的属性。\n\npublic double Width {\n\nget { return\
  \ pri_width; }\nset { pri_width = value < 0 ? -value : value; }\n}\n\npublic double\
  \ Height {\n\nget { return pri_height; }\nset { pri_height = value < 0 ? -value\
  \ : value; }\n}\n\n## 第 8 章：继承\n\n### 297\n\npublic void ShowDim() {\n\nConsole.WriteLine(\"\
  Width and height are \" +\n\nWidth + \" and \" + Height);\n\n}\n\n}\n\n// 一个派生自\
  \ TwoDShape 的三角形类。\n\nclass Triangle : TwoDShape {\n\nstring Style;\n\n// 构造函数\n\
  \npublic Triangle(string s, double w, double h) {\n\n// Triangle 的构造函数。\nWidth =\
  \ w; // 初始化基类\n\nConstruct TwoDShape portion\nof a Triangle object.\nHeight = h;\
  \ // 初始化基类\n\nStyle = s; // 初始化派生类\n}\n\npublic double Area() {\n\nreturn Width\
  \ * Height / 2;\n}\n\npublic void ShowStyle() {\n\nConsole.WriteLine(\"Triangle\
  \ is \" + Style);\n}\n\n}\n\nclass Shapes3 {\n\nstatic void Main() {\n\nTriangle\
  \ t1 = new Triangle(\"isosceles\", 4.0, 4.0);\n\nTriangle t2 = new Triangle(\"right\"\
  , 8.0, 12.0);\n\nConsole.WriteLine(\"Info for t1: \");\n\nt1.ShowStyle();\n\nt1.ShowDim();\n\
  \nConsole.WriteLine(\"Area is \" + t1.Area());\n\nConsole.WriteLine();\n\nConsole.WriteLine(\"\
  Info for t2: \");\n\nt2.ShowStyle();\n\nt2.ShowDim();\n\nConsole.WriteLine(\"Area\
  \ is \" + t2.Area());\n}\n\n}\n```\n\n在这里，`Triangle` 的构造函数初始化了它继承的 `TwoDShape` 成员，以及它自己的\
  \ `Style` 字段。输出与之前相同。\n\n298\n\nC# 3.0：初学者指南\n\n当基类和派生类都定义了构造函数时，处理过程变得复杂一些，因为基类和派生类的构造函数都必须执行。\n\
  \n在这种情况下，你必须使用 C# 的另一个关键字：`base`，它有两个用途。第一个用于是调用基类构造函数。第二个用于访问被派生类成员所隐藏的基类成员。在这里，我们将查看它的第一个用途。\n\
  \n#### 调用基类构造函数\n\n派生类可以通过派生类构造函数声明的扩展形式以及 `base` 关键字来调用其基类中定义的构造函数。这种扩展声明的通用形式所示：\n\
  \n`derived-constructor(parameter-list) : base(arg-list) {`\n\n`// 构造函数体`\n`}`\n\n\
  在这里，`arg-list` 指定了基类构造函数所需的任何参数。注意冒号的位置。\n\n为了查看 `base` 如何使用，请考虑以下程序中的 `TwoDShape`\
  \ 版本。它定义了一个初始化 `Width` 和 `Height` 属性的构造函数。该构造函数随后被 `Triangle` 构造函数调用。\n\n```cs\n\
  // 给 TwoDShape 添加构造函数。\n\nusing System;\n\n// 一个用于二维对象的类。\n\nclass TwoDShape {\n\
  \ndouble pri_width;\n\ndouble pri_height;\n\n// TwoDShape 的构造函数。\n\npublic TwoDShape(double\
  \ w, double h) {\n\n// TwoDShape 的构造函数。\nWidth = w;\n\nHeight = h;\n}\n\n// Width\
  \ 和 Height 的属性。\n\npublic double Width {\n\nget { return pri_width; }\nset { pri_width\
  \ = value < 0 ? -value : value; }\n}\n\npublic double Height {\n\nget { return pri_height;\
  \ }\nset { pri_height = value < 0 ? -value : value; }\n}\n\n## 第 8 章：继承\n\n### 299\n\
  \npublic void ShowDim() {\n\nConsole.WriteLine(\"Width and height are \" +\n\nWidth\
  \ + \" and \" + Height);\n\n}\n\n}\n\n// 一个派生自 TwoDShape 的三角形类。\n\nclass Triangle\
  \ : TwoDShape {\n\nstring Style;\n\n// 调用基类构造函数。\n\npublic Triangle(string s, double\
  \ w, double h) : base(w, h) {\n\n// Triangle 的构造函数。\nStyle = s;\n}\n\npublic double\
  \ Area() {\n\nreturn Width * Height / 2;\n}\n\npublic void ShowStyle() {\n\nConsole.WriteLine(\"\
  Triangle is \" + Style);\n}\n\n}\n\n\n\nclass Shapes4 {\n\nstatic void Main() {\n\
  \nTriangle t1 = new Triangle(\"isosceles\", 4.0, 4.0);\n\nTriangle t2 = new Triangle(\"\
  right\", 8.0, 12.0);\n\nConsole.WriteLine(\"Info for t1: \");\n\nt1.ShowStyle();\n\
  \nt1.ShowDim();\n\nConsole.WriteLine(\"Area is \" + t1.Area());\n\nConsole.WriteLine();\n\
  \nConsole.WriteLine(\"Info for t2: \");\n\nt2.ShowStyle();\n\nt2.ShowDim();\n\n\
  Console.WriteLine(\"Area is \" + t2.Area());\n}\n\n}\n```\n\n在这里，`Triangle()` 带有参数\
  \ `w` 和 `h` 调用了 `base`。这导致 `TwoDShape()` 构造函数被调用，使用这些值初始化 `Width` 和 `Height`。`Triangle`\
  \ 不再自己初始化这些值。它只需要初始化它自己的值：`Style`。这使得 `TwoDShape` 可以自由地以任何方式构建其子对象。此外，`TwoDShape`\
  \ 可以添加现有派生类不知道的功能，从而防止现有代码崩溃。\n\n300\n\nC# 3.0：初学者指南\n\n基类定义的任何形式的构造函数都可以通过 `base`\
  \ 调用。执行的构造函数将是与参数匹配的那个。例如，这里是 `TwoDShape` 和 `Triangle` 的扩展版本，包含了构造函数和接受一个参数的构造函数。\n\
  \n```cs\n// 给 TwoDShape 添加更多构造函数。\n\nusing System;\n\nclass TwoDShape {\n\ndouble\
  \ pri_width;\n\ndouble pri_height;\n\n// 默认构造函数。\n\npublic TwoDShape() {\n\nWidth\
  \ = Height = 0.0;\n}\n\n// 指定 Width 和 Height。\n\npublic TwoDShape(double w, double\
  \ h) {\n\nWidth = w;\n\nHeight = h;\n}\n\n// 构建等宽等高的对象。\n\npublic TwoDShape(double\
  \ x) {\n\nWidth = Height = x;\n}\n\n// Width 和 Height 的属性。\n\npublic double Width\
  \ {\n\nget { return pri_width; }\nset { pri_width = value < 0 ? -value : value;\
  \ }\n}\n\npublic double Height {\n\nget { return pri_height; }\nset { pri_height\
  \ = value < 0 ? -value : value; }\n}\n\npublic void ShowDim() {\n\nConsole.WriteLine(\"\
  Width and height are \" +\n\nWidth + \" and \" + Height);\n\n}\n\n}\n\n// 一个派生自\
  \ TwoDShape 的三角形类。\n\nclass Triangle : TwoDShape {\n\nstring Style;\n\n/* 默认构造函数。这会自动调用\n\
  \nTwoDShape 的默认构造函数。 */\npublic Triangle() {\n}\n```\n\n\n\n\n```csharp\npublic\
  \ class Triangle {\n    public Triangle() {\n        Style = \"null\";\n    }\n\n\
  \    // 接收接收样式、宽度和高度的构造函数。\n    public Triangle(string s, double w, double h) :\
  \ base(w, h) {\n        Style = s;\n    }\n\n    // 构建等腰三角形。\n    public Triangle(double\
  \ x) : base(x) {\n        // 使用 base 调用不同形式的\n        // TwoDShape 构造函数。\n     \
  \   Style = \"isosceles\";\n    }\n\n    public double Area() {\n        return\
  \ Width * Height / 2;\n    }\n\n    public void ShowStyle() {\n        Console.WriteLine(\"\
  Triangle is \" + Style);\n    }\n}\n\nclass Shapes5 {\n    static void Main() {\n\
  \        Triangle t1 = new Triangle();\n        Triangle t2 = new Triangle(\"right\"\
  , 8.0, 12.0);\n        Triangle t3 = new Triangle(4.0);\n        t1 = t2;\n    \
  \    Console.WriteLine(\"Info for t1: \");\n        t1.ShowStyle();\n        t1.ShowDim();\n\
  \        Console.WriteLine(\"Area is \" + t1.Area());\n        Console.WriteLine();\n\
  \        Console.WriteLine(\"Info for t2: \");\n        t2.ShowStyle();\n      \
  \  t2.ShowDim();\n        Console.WriteLine(\"Area is \" + t2.Area());\n       \
  \ Console.WriteLine();\n        Console.WriteLine(\"Info for t3: \");\n        t3.ShowStyle();\n\
  \        t3.ShowDim();\n        Console.WriteLine(\"Area is \" + t3.Area());\n \
  \       Console.WriteLine();\n    }\n}\n```\n\n这是该版本的输出结果：\n\n```\nInfo for t1:\n\
  Triangle is right\nWidth and height are 8 and 12\nArea is 48\nInfo for t2:\nTriangle\
  \ is right\nWidth and height are 8 and 12\nArea is 48\nInfo for t3:\nTriangle is\
  \ isosceles\nWidth and height are 4 and 4\nArea is 8\n```\n\n让我们复习 `base` 背后的核心概念。当派生类指定\
  \ `base` 子句时，它正在调用其直接基类的构造函数。因此，`base` 始终指向调用类上方的直接基类。即使在多级层次结构中也是如此。你通过将参数指定为 `base`\
  \ 的参数来传递给基类构造函数。如果不存在 `base` 子句，则会自动调用基类的默认构造函数。\n\n## 继承与名称隐藏 (Inheritance and\
  \ Name Hiding)\n\n派生类可以定义与其基类成员同名的成员。当这种情况发生时，基类中的成员在派生类中被隐藏。\n\n虽然这在 C# 中技术上并不是一个错误，但编译器会发出警告信息。此警告提醒你某个名称正在被隐藏。如果你的意图是隐藏基类成员，为了防止此警告，派生类成员之前必须加上\
  \ `new` 关键字。请注意，`new` 的这种用法与其在创建对象实例时的用法是分开且不同的。\n\n以下是名称隐藏的示例：\n\n```csharp\n//\
  \ 一个与继承相关的名称隐藏示例。\nusing System;\n\nclass A {\n    public int i = 0;\n}\n\n// 创建一个派生类。\n\
  class B : A {\n    // A 中的 i 被 B 中的 i 隐藏\n    new int i; // 此 i 隐藏了 A 中的 i\n   \
  \ // 在 B 中。注意 new 的使用。\n\n    public B(int b) {\n        i = b; // B 中的 i\n    }\n\
  \n    public void Show() {\n        Console.WriteLine(\"i in derived class: \" +\
  \ i);\n    }\n}\n\nclass NameHiding {\n    static void Main() {\n        B ob =\
  \ new B(2);\n        ob.Show();\n    }\n}\n```\n\n首先，注意 `new` 的使用。本质上，它告诉编译器你已经知道正在创建一个名为\
  \ `i` 的新变量，该变量隐藏了基类 `A` 中的 `i`。如果你遗漏了 `new`，则会生成警告。\n\n此程序产生的输出所示：\n\n```\ni in\
  \ derived class: 2\n```\n\n由于 `B` 定义了它自己的实例变量 `i`，它隐藏了 `A` 中的 `i`。因此，当在类型为 `B` 的对象上调用\
  \ `Show()` 时，显示的是由 `B` 定义的 `i` 值——而不是由 `A` 定义的。\n\n## 使用 base 访问隐藏的名称 (Using base\
  \ to Access a Hidden Name)\n\n`base` 有第二种形式，作用类似于 `this`，但它始终指向使用它的派生类的基类。这种用法具有以下通用形式：`base.member`。\n\
  \n在这里，`member` 可以是方法也可以是实例变量。这种形式的 `base` 最适用于派生类的成员隐藏了基类中同名成员的情况。考虑前一个示例中类层次结构的此版本：\n\
  \n```csharp\n// 使用 base 克服名称隐藏。\nusing System;\n\nclass A {\n    public int i =\
  \ 0;\n}\n\n// 创建一个派生类。\nclass B : A {\n    new int i; // 此 i 隐藏了 A 中的 i\n\n    public\
  \ B(int a, int b) {\n        base.i = a; // 这揭盖了 A 中的 i\n        // 这里，base.i 指向\
  \ A 中的 i。\n        i = b; // B 中的 i\n    }\n\n    public void Show() {\n       \
  \ // 这显示 A 中的 i。\n        Console.WriteLine(\"i in base class: \" + base.i);\n \
  \       // 这显示 B 中的 i。\n        Console.WriteLine(\"i in derived class: \" + i);\n\
  \    }\n}\n\nclass NameHiding {\n    static void Main() {\n        B ob = new B(2);\n\
  \        ob.Show();\n    }\n}\n```\n\n# 第 8 章：继承 (Inheritance)\n\n### 303\n\n```csharp\n\
  // 创建一个派生类。\nclass B : A {\n    // A 中的 i 被 B 中的 i 隐藏\n    new int i; // 此 i 隐藏了\
  \ A 中的 i\n    // 在 B 中。注意 new 的使用。\n\n    public B(int b) {\n        i = b; // B\
  \ 中的 i\n    }\n\n    public void Show() {\n        Console.WriteLine(\"i in derived\
  \ class: \" + i);\n    }\n}\n```\n\n首先，注意 `new` 的使用。本质上，它告诉编译器你已经知道正在创建一个名为 `i`\
  \ 的新变量，该变量隐藏了基类 `A` 中的 `i`。如果你遗漏了 `new`，则会生成警告。\n\n此程序产生的输出所示：\n\n```\ni in derived\
  \ class: 2\n```\n\n由于 `B` 定义了它自己的实例变量 `i`，它隐藏了 `A` 中的 `i`。因此，当在类型为 `B` 的对象上调用 `Show()`\
  \ 时，显示的是由 `B` 定义的 `i` 值——而不是由 `A` 定义的。\n\n### 304\n\n```csharp\n// 使用 base 克服名称隐藏。\n\
  using System;\n\nclass A {\n    public int i = 0;\n}\n\n// 创建一个派生类。\nclass B : A\
  \ {\n    new int i; // 此 i 隐藏了 A 中的 i\n\n    public B(int a, int b) {\n        base.i\
  \ = a; // 这揭盖了 A 中的 i\n        i = b; // B 中的 i\n    }\n\n    public void Show()\
  \ {\n        // 这显示 A 中的 i。\n        Console.WriteLine(\"i in base class: \" + base.i);\n\
  \        // 这显示 B 中的 i。\n        Console.WriteLine(\"i in derived class: \" + i);\n\
  \    }\n}\n\nclass NameHiding {\n    static void Main() {\n        B ob = new B(2);\n\
  \        ob.Show();\n    }\n}\n```\n\n### 305\n\n```csharp\n// 调用一个隐藏的方法。\nusing\
  \ System;\n\nclass A {\n    public int i = 0;\n}\n\n// 创建一个派生类。\nclass B : A {\n\
  \    new int i; // 此 i 隐藏了 A 中的 i\n\n    public B(int a, int b) {\n        base.i\
  \ = a; // 这揭盖了 A 中的 i\n        i = b; // B 中的 i\n    }\n\n    public void Show()\
  \ {\n        // 这显示 A 中的 i。\n        Console.WriteLine(\"i in base class: \" + base.i);\n\
  \        // 这显示 B 中的 i。\n        Console.WriteLine(\"i in derived class: \" + i);\n\
  \    }\n}\n```\n\n输出是：\n```\ni in base class: 1\ni in derived class: 2\n```\n\n\n\
