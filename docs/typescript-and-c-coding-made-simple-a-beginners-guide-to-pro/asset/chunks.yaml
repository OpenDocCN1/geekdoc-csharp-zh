  trans: "\n\n- `private`: 成员仅在包含它的类内部可见。\n- `protected`: 成员在包含它的类及其派生类中可访问。\n- `internal`:\
    \ 成员在同一个程序集（项目）中可访问。\n\n通过有效使用访问修符，我们可以强制执行封装并控制类成员的可见性。\n\n# 9.3 属性\n\n属性是 `C#`\
    \ 中的一种机制，用于对类的封装数据提供受控的访问。它们允许我们定义访问器（getter）和设置器（setter）方法来访问和修改数据。\n\n属性封装了底层数据并提供了一个抽象层，使我们能够执行验证、执行计算并控制对数据的访问。\n\
    \n这里有一个带有属性的类示例：\n\n```csharp\npublic class Person\n{\n    private string name;\n\
    \n    public string Name\n    {\n        get { return name; }\n        set { name\
    \ = value; }\n    }\n}\n```\n\n在这个示例中，`Name` 属性封装了 `name` 字段，并通过访问器和设置方法提供了受控的访问。\n\
    \n# 9.4 封装与数据隐藏\n\n封装涉及隐藏类的内部数据，并通过方法或属性提供受控的访问。这有助于维护数据完整性，并防止外部代码直接修改数据。\n\n\
    通过隐藏内部实现细节，封装允许我们在不影响使用该类的代码的情况下更改实现。这提供了一种抽象层次，并增强了代码的可维护性。\n\n# 9.5 封装与信息隐藏\n\
    \n信息隐藏是一个与封装密切相关的原则。它涉及仅暴露必要的信息并隐藏类的内部细节。\n\n通过隐藏内部实现细节并仅通过方法或属性暴露基本信息，封装确保类用户通过定义良好的接口与类交互。这减少了代码的复杂性并促进了模块化。\n\
    \n# 9.6 封装的优势\n\n封装在面向对象的编程中提供了许多优势：\n\n1. **数据保护**：封装保护数据免受外部外部访问，防止未经授权的修改并确保数据完整。\n\
    2. **模块化**：封装允许我们将相关数据和行为封装到单个单元（类）中，促进代码的模块化和重用。\n3. **抽象**：封装通过隐藏内部实现细节并仅通过方法或属性暴露基本信息，提供了一种抽象层次。\n\
    4. **代码可维护性**：封装使代码的维护和更新变得更容易，因为内部实现的更改不会影响使用该类的代码。\n\n# 9.7 总结\n\n在本章中，我们探索了\
    \ `C#` 中封装的概念及其在面向对象编程中的重要性。我们学习了访问修符、属性以及它们如何有助于于封装。我们讨论了封装如何帮助保护数据和行为、促进模块化并确保对类成员的受控访问。\n\
    \n我们看到 `public`、`private`、`protected` 和 `internal` 等访问修符在定义类成员的可见性和可访问性方面起着关重要的作用。它们通过限制对类内部状态的直接访问来强制封装。\n\
    \n属性被引入为一种封装数据并通过访问器和设置方法提供受控访问的机制。属性允许我们定义访问和修改封装数据的规则和验证逻辑。\n\n我们还讨论了数据隐藏和信息隐藏的概念，它们与封装密切相关。数据隐藏涉及隐藏内部实现细节，而信息隐藏侧重于通过定义良好的接口仅暴露必要的信息。\n\
    \n通过有效利用封装，我们可以创建更具维护性、模块化且健壮的类。封装帮助我们保护类的内部状态，为其成员提供受控访问，并允许在不影响使用类的代码的情况下更改实现。\n\
    \n在下一章中，我们将探索 `C#` 中的另一个核心概念：抽象。抽象允许我们使用简化模型来表示复杂系统，并侧重于定义基本特征同时隐藏实现细节。\n\n# 第\
    \ 10 章：抽象：简化复杂系统\n\n在本章中，我们将深入探讨 `C#` 中抽象的概念。抽象是面向对象编程的一个基本原则，允许我们使用简化模型来表示复杂系统。它侧重于定义基本特征和行为，同时隐藏实现细节。\n\
    \n# 10.1 抽象简介\n\n抽象涉及将现实世界的实体表示为程序中的类或对象。它允许我们捕实实体的本质和行为，同时忽略无关的细节。\n\n通过将复杂系统抽象为更简单、易于管理的模型，我们可以创建更容易理解、维护和扩展的代码。\n\
    \n# 10.2 抽象类\n\n在 `C#` 中，抽象类是一种不能直接实例化的类，作为派生类的蓝图。它的目的是被子类继承，并可以包含抽象和非抽象的方法、属性和字段。\n\
    \n抽象类可能具有抽象方法，这些方法在抽象类中声明时没有实现。这些抽象方法必须在派生类中实现。\n\n这里有一个抽象类的示例：\n\n```csharp\n\
    public abstract class Shape\n{\n    public abstract double CalculateArea();\n\
    }\n\npublic class Circle : Shape\n{\n    private double radius;\n\n    public\
    \ Circle(double radius)\n    {\n        this.radius = radius;\n    }\n\n    public\
    \ override double CalculateArea()\n    {\n        return Math.PI * radius * radius;\n\
    \    }\n}\n```\n\n在这个示例中，`Shape` 类被声明为抽象类。它包含一个抽象方法 `CalculateArea()`，该方法在抽象类中没有实现。`Circle`\
    \ 类派自 `Shape`，并为 `CalculateArea()` 方法提供了实现。\n\n# 10.3 接口\n\n`C#` 中的接口提供了一种为类定义约的方法，通过指定类必须实现的一组方法和属性。它们定义了类应该表现的行为，但不包含任何实现细节。\n\
    \n接口可以被看作是纯粹的抽象，因为它只关注所需的行为，而不提供任何实现。\n\n这里有一个接口的示例：\n\n```csharp\npublic interface\
    \ IResizable\n{\n    void Resize(double scaleFactor);\n}\n\npublic class Rectangle\
    \ : IResizable\n{\n    public void Resize(double scaleFactor)\n    {\n       \
    \ // Rectangle 的 Resize 方法的实现\n    }\n}\n```\n\n在这个示例中，`IResizable` 接口定义了一个方法\
    \ `Resize()`。`Rectangle` 类实现了 `IResizable` 接口，并为 `Resize()` 方法提供了所需的实现。\n\n# 10.4\
    \ 抽象的优势\n\n抽象在面向对象的编程中提供了许多优势：\n\n1. **简化**：抽象通过关注于基本特征并隐藏实现细节来简化复杂系统。它允许我们处理更高层次的概念，而不是迷失在系统的复杂性中。\n\
    2. **代码重用**：抽象通过在抽象类或接口中定义共同的行为和特征来促进代码的重用。派生类可以继承或实现这些抽象，减少代码重复。\n3. **模块化**：抽象通过分离关注点并在类或接口中封装相关的行为和属性，有助于创建模块化的代码。\n\
    \n"
- fmt: "\n## 4. Flexibility and Extensibility\nAbstraction allows for flexibility\
    \ and extensibility by defining a contract that can be implemented by different\
    \ classes. It enables easy addition of new functionality by creating new classes\
    \ that adhere to the defined abstractions.\n\n## 10.5 Summary\nIn this chapter,\
    \ we explored the concept of abstraction in `C#` and its role in simplifying complex\
    \ systems. We learned about `abstract classes`, which serve as blueprints for\
    \ derived classes and can contain abstract and non-abstract members. We also discussed\
    \ `interfaces`, which define a contract for classes to adhere to, specifying the\
    \ required behavior without providing implementation details.\n\nAbstraction allows\
    \ us to create code that focuses on the essential aspects of a system while hiding\
    \ the underlying complexities. It simplifies the development process, improves\
    \ code reusability, promotes modularity, and enables flexibility and extensibility.\n\
    \nBy utilizing `abstract classes` and `interfaces`, we can create a hierarchy\
    \ of classes that share common behavior and characteristics. This hierarchy allows\
    \ for code reuse and provides a structured approach to building complex systems.\n\
    \nAbstraction also enhances code maintenance and scalability. As the implementation\
    \ details are hidden behind the abstraction, changes or updates can be made within\
    \ the `abstract classes` or `interfaces` without impacting the code that uses\
    \ them. This promotes a separation of concerns and allows for easy modification\
    \ or addition of new functionality.\n\nAdditionally, abstraction helps in creating\
    \ code that is more understandable and easier to work with. By focusing on the\
    \ essential features and behavior, developers can work at a higher level of abstraction,\
    \ which reduces complexity and enhances productivity.\n\nIn the next chapter,\
    \ we will explore another important aspect of `C#`: error handling and exception\
    \ handling. Exception handling allows us to gracefully handle and recover from\
    \ runtime errors, ensuring the stability and reliability of our applications.\n\
    \n# Chapter 11: Error Handling and Exception Handling\nIn this chapter, we will\
    \ delve into the concept of error handling and exception handling in `C#`. Errors\
    \ and exceptions are inevitable in software development, and handling them effectively\
    \ is crucial for building robust and reliable applications.\n\n## 11.1 Introduction\
    \ to Error Handling\nError handling is the process of identifying, reporting,\
    \ and resolving errors that occur during the execution of a program. Errors can\
    \ arise from various sources, such as incorrect user input, hardware malfunctions,\
    \ or logical flaws in the code.\n\nEffective error handling ensures that when\
    \ an error occurs, the program responds gracefully, provides appropriate feedback\
    \ to the user, and takes corrective actions to prevent the application from crashing\
    \ or producing incorrect results.\n\n## 11.2 Types of Errors\nIn `C#`, errors\
    \ can be broadly categorized into two types: compile-time errors and runtime errors.\n\
    \nCompile-time errors, also known as syntax errors, occur during the compilation\
    \ phase of the program. They occur when the code violates the rules of the programming\
    \ language and prevent the program from being compiled successfully. Examples\
    \ of compile-time errors include syntax errors, type errors, and missing or mismatched\
    \ method calls.\n\nRuntime errors, on the other hand, occur during the execution\
    \ of the program. They can be caused by various factors such as invalid user input,\
    \ unexpected data conditions, or resource unavailability. Runtime errors can lead\
    \ to program crashes, incorrect results, or unexpected behaviors.\n\n## 11.3 Exception\
    \ Handling in C#\nException handling is a mechanism in `C#` that allows us to\
    \ handle and recover from runtime errors, ensuring the stability and reliability\
    \ of our applications. Exceptions represent exceptional conditions or errors that\
    \ occur during the execution of a program.\n\nWhen an exceptional condition arises,\
    \ `C#` throws an exception, which can be caught and handled using `try-catch`\
    \ blocks. The `try` block contains the code that might throw an exception, and\
    \ the `catch` block handles the exception by specifying the appropriate actions\
    \ to take.\n\nHere's an example of exception handling in `C#`:\n\n```csharp\n\
    try\n{\n    // Code that might throw an exception\n}\ncatch (Exception ex)\n{\n\
    \    // Handle the exception\n    Console.WriteLine(\"An error occurred: \" +\
    \ ex.Message);\n}\n```\n\nIn this example, the code inside the `try` block is\
    \ monitored for exceptions. If an exception is thrown, it is caught by the `catch`\
    \ block, and the specified error handling code is executed. The caught exception\
    \ object `ex` provides information about the exception, such as its message and\
    \ stack trace.\n\n## 11.4 Handling Different Types of Exceptions\n`C#` provides\
    \ a hierarchy of exception classes that allow us to handle different types of\
    \ exceptions appropriately. The `Exception` class is the base class for all exceptions\
    \ in `C#`, and it has several derived classes that represent specific types of\
    \ exceptions.\n\nSome common exception classes in `C#` include `ArgumentException`,\
    \ `ArgumentNullException`, `InvalidOperationException`, and `DivideByZeroException`.\
    \ By catching specific exceptions, we can handle them differently based on the\
    \ situation.\n\n## 11.5 Finally Block and Resource Cleanup\nIn addition to the\
    \ `try-catch` blocks, `C#` provides the `finally` block, which allows us to specify\
    \ code that should be executed regardless of whether an exception is thrown or\
    \ not. The `finally` block is used for resource cleanup or finalization tasks.\n\
    \nHere's an example that demonstrates the use of the `finally` block:\n\n```csharp\n\
    try\n{\n    // Code that might throw an exception\n}\ncatch (Exception ex)\n{\n\
    \    // Handle the exception\n    Console.WriteLine(\"An error occurred: \" +\
    \ ex.Message);\n}\nfinally\n{\n    // Cleanup or finalization code\n    // This\
    \ code will always execute, regardless of whether an exception occurred or not\n\
    }\n```\n\nIn this example, the code in the `finally` block will always execute,\
    \ regardless of whether an exception was caught or not. This ensures that any\
    \ necessary cleanup operations are performed before the program execution continues.\n\
    \n## 11.6 Custom Exception Classes\nIn addition to the built-in exception classes,\
    \ `C#` allows us to create custom exception classes to handle application-specific\
    \ errors. Custom exceptions can be derived from the `Exception` class or any of\
    \ its derived classes.\n\nBy creating custom exception classes, we can provide\
    \ more meaningful error messages, encapsulate specific error-handling logic, and\
    \ differentiate between different types of exceptions in our application.\n\n\
    Here's an example of a custom exception class:\n\n```csharp\npublic class InvalidInputException\
    \ : Exception\n{\n    public InvalidInputException(string message)\n    : base(message)\n\
    \    {\n    }\n}\n```\n\nIn this example, we define a custom exception class `InvalidInputException`\
