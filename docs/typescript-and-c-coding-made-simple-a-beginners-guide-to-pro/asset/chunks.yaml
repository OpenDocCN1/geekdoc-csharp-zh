    # Chapter 13: Database Operations


    In this chapter, we will delve into working with databases in C#. Databases are
    essential for storing, retrieving, and managing structured data in applications.
    C# provides various libraries and frameworks for interacting with databases, enabling
    us to perform database operations efficiently.


    # 13.1 Introduction to Databases


    A database is an organized collection of data that is structured, indexed, and
    stored in a systematic manner. Databases provide a reliable and efficient way
    to store and retrieve data, making them a crucial component of many applications.


    There are different types of databases available, such as relational databases
    (e.g., MySQL, SQL Server, Oracle), NoSQL databases (e.g., MongoDB, Couchbase),
    and in-memory databases (e.g., Redis). Each type has its own advantages and use
    cases, depending on the application requirements.


    # 13.2 Database Connectivity in C#


    To connect and interact with databases in C#, we rely on the ADO.NET framework.
    ADO.NET provides a set of classes and interfaces that enable us to perform database
    operations such as querying data, inserting, updating, and deleting records.


    ADO.NET supports various database providers, including SQL Server, Oracle, MySQL,
    and SQLite, among others. Each provider offers a specific set of classes and methods
    for working with the corresponding database.


    To establish a connection with a database, we typically use a connection string
    that contains information such as the server name, database name, credentials,
    and other connection-specific details.


    # 13.3 Executing SQL Queries


    SQL (Structured Query Language) is a standard language for interacting with relational
    databases. In C#, we can execute SQL queries using the `SqlCommand` class, which
    is part of ADO.NET.


    Here''s an example of executing a SQL query in C#:


    ```csharp


    string connectionString = "your_connection_string";


    string query = "SELECT * FROM Customers";


    using (SqlConnection connection = new SqlConnection(connectionString))


    {


    SqlCommand command = new SqlCommand(query, connection);


    connection.Open();


    SqlDataReader reader = command.ExecuteReader();


    while (reader.Read())


    {


    // Access data from the reader


    string customerName = reader["CustomerName"].ToString();


    int age = Convert.ToInt32(reader["Age"]);


    // Process the data


    Console.WriteLine("Customer: {0}, Age: {1}", customerName, age);


    }


    reader.Close();


    }


    ```


    In this example, we establish a connection to the database using the `SqlConnection`
    class and provide the connection string. We then create a `SqlCommand` object
    with the SQL query and the connection.


    We open the connection using the `Open()` method and execute the query using the
    `ExecuteReader()` method. The `ExecuteReader()` method returns a `SqlDataReader`
    object, which allows us to read the retrieved data.


    Inside the `while` loop, we iterate over the data rows using the `Read()` method
    of the `SqlDataReader`. We access the values of the columns by using the column
    names or indices.


    # 13.4 Performing Database Updates


    In addition to reading data, we often need to perform database updates, such as
    inserting, updating, or deleting records. ADO.NET provides methods to execute
    these operations as well.


    Here''s an example of inserting data into a database using ADO.NET:


    ```csharp


    string connectionString = "your_connection_string";


    string query = "INSERT INTO Customers (CustomerName, Age) VALUES (@name, @age)";


    using (SqlConnection connection = new SqlConnection(connectionString))


    {


    SqlCommand command = new SqlCommand(query, connection);


    // Add parameters to the command


    command.Parameters.AddWithValue("@name", "John Doe");


    command.Parameters.AddWithValue("@age", 30);


    connection.Open();


    int rowsAffected = command.ExecuteNonQuery();


    Console.WriteLine("Rows affected: " +


    rowsAffected);


    }


    In this example, we create a SQL query to insert data into a `Customers` table.
    We use the `INSERT INTO` statement with parameterized values to ensure safe and
    secure data insertion.


    We create a `SqlCommand` object and add parameters to the command using the `Parameters.AddWithValue()`
    method. The parameter names (@name and @age) correspond to the placeholders in
    the SQL query.


    After opening the connection, we execute the query using the `ExecuteNonQuery()`
    method, which returns the number of rows affected by the operation.


    # 13.5 Handling Transactions


    Transactions are crucial when dealing with multiple database operations that need
    to be executed as a single unit. Transactions ensure data integrity and consistency
    by either committing all changes or rolling them back if an error occurs.


    ADO.NET provides the `SqlTransaction` class to handle transactions. Here''s an
    example of using transactions in C#:


    ```csharp


    string connectionString = "your_connection_string";


    using (SqlConnection connection = new SqlConnection(connectionString))


    {


    connection.Open();


    SqlTransaction transaction = connection.BeginTransaction();


    try


    {


    // Perform database operations within the transaction


    SqlCommand command1 = new SqlCommand("INSERT INTO Customers (Name) VALUES (''John
    Doe'')", connection, transaction);


    command1.ExecuteNonQuery();


    SqlCommand command2 = new SqlCommand("UPDATE Orders SET Status = ''Shipped'' WHERE
    CustomerId = 1", connection, transaction);


    command2.ExecuteNonQuery();


    // Commit the transaction if all operations succeed


    transaction.Commit();


    }


    catch (Exception ex)


    {


    // Rollback the transaction if an error occurs


    transaction.Rollback();


    Console.WriteLine("An error occurred: " + ex.Message);


    }


