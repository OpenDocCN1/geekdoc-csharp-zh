  trans: "\n\n# 6.3 对象：类的实例\n\n对象是类的实例。它代表一个特定的实体或概念。我们根据类定义的蓝图创建对象。这里有一个示例：\n\n```csharp\n\
    Person person1 = new Person();\nPerson person2 = new Person();\n```\n\n在这个示例中，我们基于\
    \ `Person` 类创建了两个对象，`person1` 和 `person2`。每个对象都有自己的一组数据，并可以执行由类定义的动作。\n\n# 6.4\
    \ 属性：访问和修改数据\n\n属性是类的成员，允许我们访问和修改其数据。它们提供了一种封装数据和控制其访问性的方法。属性具有 `getter`（访问器）和可选的\
    \ `setter`（设置器），分别用于检索和赋值。这里有一个示例：\n\n```csharp\npublic class Person\n{\n    public\
    \ string Name { get; set; }\n    public int Age { get; set; }\n}\n```\n\n在这个示例中，`Person`\
    \ 类有两个属性，`Name` 和 `Age`，代表一个人的姓名和年龄。`get` 访问器检索值，而 `set` 访问器允许我们分配新值。\n\n要访问和修改属性，我们使用点符号（dot\
    \ notation）。这里有一个示例：\n\n```csharp\nPerson person = new Person();\nperson.Name\
    \ = \"John\";\nperson.Age = 25;\nConsole.WriteLine(person.Name); // 输出: John\n\
    Console.WriteLine(person.Age); // 输出: 25\n```\n\n在这个示例中，我们创建了一个名为 `person` 的 `Person`\
    \ 对象，并给它的 `Name` 和 `Age` 属性赋值。然后，我们访问并显示了这些值。\n\n# 6.5 方法：定义行为\n\n方法是类的成员，定义了对象可以执行的行为或动作。它们封装了一块代码，当方法被调用时就会执行这些代码。这里有一个示例：\n\
    \n```csharp\npublic class Person\n{\n    public string Name { get; set; }\n  \
    \  public int Age { get; set; }\n    public void SayHello()\n    {\n        Console.WriteLine(\"\
    Hello, my name is \" + Name + \"!\");\n    }\n}\n```\n\n在这个示例中，`Person` 类有一个名为\
    \ `SayHello()` 的方法，它输出一个包含个人姓名的问候消息。\n\n要调用方法，我们使用点符号。这里有一个示例：\n\n```csharp\n\
    Person person = new Person();\nperson.Name = \" John\";\nperson.SayHello(); //\
    \ 输出: Hello, my name is John!\n```\n\n在这个示例中，我们创建了一个名为 `person` 的 `Person` 对象，并将姓名\
    \ \"John\" 赋值给它的 `Name` 属性。然后我们调用了 `SayHello()` 方法，它在控制台上打印了问候消息。\n\n# 6.6 构造函数：初始化对象\n\
    \n构造函数是在对象创建时调用的特殊方法。它用于初始化对象的状态并设置它的初始值。在 C# 中，构造函数的名称与类名相同。这里有一个示例：\n\n```csharp\n\
    public class Person\n{\n    public string Name { get; set; }\n    public int Age\
    \ { get; set; }\n    public Person(string name, int age)\n    {\n        Name\
    \ = name;\n        Age = age;\n    }\n    public void SayHello()\n    {\n    \
    \    Console.WriteLine(\"Hello, my name is \" + Name + \"!\");\n    }\n}\n```\n\
    \n在这个示例中，`Person` 类有一个构造函数，它接受两个参数 `name` 和 `age` 来初始化 `Name` 和 `Age` 属性。\n\n\
    要使用构造函数创建对象，我们会在创建对象时传递所需的值。这里有一个示例：\n\n```csharp\nPerson person = new Person(\"\
    John\", 25);\nperson.SayHello(); // 输出: Hello, my name is John!\n```\n\n在这个示例中，我们创建了一个名为\
    \ `person` 的 `Person` 对象并将并将 \"John\" 和 25 传递给构造函数。构造函数初始化了 `Name` 和 `Age` 属性，`SayHello()`\
    \ 方法显示了问候消息。\n\n# 6.7 总结\n\n在本章，我们探索了 C# 面向对象编程的核心概念。我们学习了类（作为创建对象的蓝图）和对象（类的实例）。我们讨论了属性（提供类数据的访问）和方法（定义类的行为）。我们还涵盖了构造函数（初始化对象状态）。\n\
    \n面向对象编程通过将数据和行为封装在类中，允许我们创建模块化和可重用的代码。通过利用类、对象、属性和方法，我们可以构建稳健且可扩展的应用程序。在下一章中，我们将深入学习继承，这是一种促进面向对象编程中代码重用和层次结构的强大机制。\n\
    \n# 第 7 章：继承：重用和扩展类\n\n在本章中，我们将探索使用 C# 的向对象编程中的继承概念。继承允许我们基于现有类创建新类，从而实现代码重用和扩展功能的能力。我们将学习基类、派生类、继承层次结构以及它们为程序带来的好处。\n\
    \n# 7.1 继承简介\n\n继承是面向对象编程中的一个基本概念，允许我们根据现有类（基类）创建新类（派生类）。派生类继承基类的属性和方法，还可以添加新成员或重写现有的成员。这促进了代码重用、模块化和扩展性。\n\
    \n# 7.2 基类与派生类\n\n继承涉及两种类：基类和派生类。基类是为派生类提供基础的现有类。派生类是继承自基类的新类，获得了对其成员的访问权限。\n\n\
    要创建一个派生类，我们使用 `:` 符号后跟基类的名称。这里有一个示例：\n\n```csharp\npublic class BaseClass\n{\n\
    \    // 基类成员\n}\n\npublic class DerivedClass : BaseClass\n{\n    // 派生类成员\n}\n\
    ```\n\n在这个示例中，我们有一个基类 `BaseClass` 和一个继承自 `BaseClass` 的派生类 `DerivedClass`。\n\n\
    # 7.3 继承成员\n\n当一个类继承自基类时，它会自动继承所有的公共（public）和保护（protected）成员。这包括属性、方法、字段和事件。派生类可以访问并使用这些继承的成员，就像它们定义在派生类内部一样。\n\
    \n```csharp\npublic class BaseClass\n{\n    public void BaseMethod()\n    {\n\
    \        // 基类方法实现\n    }\n}\n\npublic class DerivedClass : BaseClass\n{\n   \
    \ public void DerivedMethod()\n    {\n        // 派生类方法实现\n    }\n}\n\nDerivedClass\
    \ derivedObj = new DerivedClass();\nderivedObj.BaseMethod(); // 访问继承的方法\nderivedObj.DerivedMethod();\
    \ // 访问派生类方法\n```\n\n在这个示例中，`DerivedClass` 继承了 `BaseClass` 的 `BaseMethod()` 并可以使用它。它还定义了自己的方法\
    \ `DerivedMethod()`。\n\n# 7.4 重写成员\n\n在某些情况下，派生类可能需要修改继承成员的实现。这通过使用 `override`\
    \ 关键字重写基类成员来实现。派生类中重写的成员必须与基类成员的签名（名称、返回类型和参数）一致。\n\n```csharp\npublic class BaseClass\n\
    {\n    public virtual void SomeMethod()\n    {\n        // 基类方法实现\n    }\n}\n\n\
    public class DerivedClass : BaseClass\n{\n    public override void SomeMethod()\n\
    \    {\n        // 派生类方法实现\n    }\n}\n\nDerivedClass derivedObj = new DerivedClass();\n\
    derivedObj.SomeMethod(); // 调用派生类中重写的方法\n```\n\n在这个示例中，`BaseClass` 定义了一个虚方法（virtual）`SomeMethod()`，它可以在派生类中被重写。`DerivedClass`\
    \ 用自己的实现重写了该方法。\n\n# 7.5 继承层次结构\n\n继承可以在类之间创建层次关系，形成继承层次结构。在层次结构中，派生类可以成为另一个派生类的基类，从而形成继承链。\n\
