    \ ECMAScript 版本、模块系统以及编译后的 JavaScript 文件的输出目录。它还指定了编译过程中要包含哪些文件。\n\n### 3. 运行\
    \ TypeScript 编译器\n\n在项目根目录下打开终端并运行以下命令：\n\n```bash\ntsc\n```\n\n此命令指示 TypeScript\
    \ 编译器读取 `tsconfig.json` 文件并根据指定的配置将 TypeScript 文件转译为 JavaScript。\n\n生成的 JavaScript\
    \ 文件位于指定的 `outDir` 目录（在本例中为 `dist` 目录）。\n\n## 部署 TypeScript 应用\n\n一旦你构建了 TypeScript\
    \ 应用，就是时候将其部署到生产环境了。部署过程取决于你应用的目标平台和托管基础设施。以下是一些需要考虑的通用步骤：\n\n### 1. 压缩与优化\n\n\
