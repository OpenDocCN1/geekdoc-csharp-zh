    int[,] matrix = new int[3, 3]\n{\n  { 1, 2, 3 },\n  { 4, 5, 6 },\n  { 7, 8, 9\
    \ }\n};\n```\n\n在这个示例中，我们声明并初始化了一个名为 `matrix` 的二维数组。它包含 3 行 3 列。\n\n要访问多维数组中的元素，我们需要为每个维度指定索引。这里有一个示例：\n\
    \n```csharp\nint[,] matrix = new int[3, 3]\n{\n  { 1, 2, 3 },\n  { 4, 5, 6 },\n\
    \  { 7, 8, 9 }\n};\nConsole.WriteLine(matrix[1, 2]); // 输出: 6\n```\n\n在这个示例中，我们访问了\
    \ `matrix` 数组中第二行（索引为 1）和第三列（索引为 2）的元素。\n\n## 4.8 总结\n\n在本章中，我们探索了 C# 中的数组。我们学习了如何声明、初始化、访问和修改数组元素。我们还讨论了数组长度和边界的概念，以及使用\
    \ `for` 和 `foreach` 循环遍历数组。此外，我们简要介绍了多维数组。\n\n数组提供了一种存储和操作数据的强大方式。它们在各种编程场景中被广泛使用。在下一章中，我们将深入研究方法，方法允许我们封装可重用的代码块，并增强程序的模块化。\n\
    \n# 第 5 章：方法：封装可重用的代码\n\n在本章中，我们将探索 C# 中的方法。方法允许我们将代码块封装成可重用的单元，为组织和模块化我们的程序提供了一种方法。我们将学习如何定义方法、传递参数、返回结果，并利用它们的力量来创建高效且易于维护的代码。\n\
    \n## 5.1 方法简介\n\n方法是执行特定任务或操作的代码块。它们提供了一种封装功能的方法，使我们的程序更有组织性且易于理解。方法可以接受输入参数、执行操作，并可选地返回结果。\n\
    \n## 5.2 方法声明与语法\n\n在 C# 中声明方法，我们需要指定它的访问修器、返回类型、名称以及任何输入参数。这里是通用语法：\n\n```csharp\n\
    accessibility return_type MethodName(parameters)\n{\n    // 方法体\n}\n```\n\n- `accessibility`\
    \ 决定了方法的可见性（例如 `public`、`private` 等）。\n- `return_type` 代表方法返回的值的类型（如果没有返回任何值，则使用\
    \ `void`）。\n- `MethodName` 是方法的名称，应该遵循命名规范。\n- `parameters` 指定方法所需的输入值（可选）。\n\n\
    ## 5.3 void 方法：执行操作\n\n`void` 方法是一种不返回任何值的方法。当我们希望方法执行特定操作而不返回结果时，就会使用这种方法。这里有一个示例：\n\
    \n```csharp\npublic void SayHello()\n{\n  Console.WriteLine(\"Hello!\");\n}\n\
    ```\n\n在这个示例中，我们声明了一个名为 `SayHello()` 的 `void` 方法，它只是向控制台输出 \"Hello!\"。此方法不返回任何值。\n\
    \n要调用 `void` 方法，我们使用它的名称后跟括号。这里有一个示例：\n\n```csharp\nSayHello();\n```\n\n通过调用 `SayHello()`\
    \ 方法，“Hello!\" 消息将显示在控制台上。\n\n## 5.4 带参数的方法：接受输入\n\n方法可以接受输入参数，允许我们将数据传递到方法中处理。参数在方法内部充当变量，它们的值在方法被调用时确定。这里有一个示例：\n\
    \n```csharp\npublic void GreetUser(string name)\n{\n  Console.WriteLine(\"Hello,\
    \ \" + name + \"!\");\n}\n```\n\n在这个示例中，我们定义了一个名为 `GreetUser()` 的 `void` 方法，它接受一个名为\
    \ `name` 的字符串参数。该方法通过将提供的名称与问候消息拼接来问候用户。\n\n要调用带参数的方法，我们在调用方法时传递对应的值。这里有一个示例：\n\
    \n```csharp\nGreetUser(\"John\");\n```\n\n通过带参数 \"John\" 调用 `GreetUser()` 方法，方法将输出\
    \ \"Hello, John!\"。\n\n## 5.5 有返回值的方法：产生结果\n\n方法还可以使用 `return` 关键字返回值。方法的返回类型应该与被返回值的类型匹配。这里有一个示例：\n\
    \n```csharp\npublic int AddNumbers(int a, int b)\n{\n  int sum = a + b;\n  return\
    \ sum;\n}\n```\n\n在这个示例中，我们定义了一个名为 `AddNumbers()` 方法，它接受两个整数参数 `a` 和 `b`。该方法将两个数字相加并返回和。\n\
    \n要利用方法的返回值，我们可以将其赋值给变量或直接使用。这里有一个示例：\n\n```csharp\nint result = AddNumbers(5,\
    \ 3);\nConsole.WriteLine(result); // 输出: 8\n```\n\n通过带参数 5 和 3 调用 `AddNumbers()`\
    \ 方法，返回的和 8 被赋值给变量 `result`，然后该被打印到控制台上。\n\n## 5.6 方法重载：多个签名\n\n在 C# 中，我们可以拥有多个同名但参数列表不同的方法。这被称为方法重载。这里有一个示例：\n\
    \n```csharp\npublic void GreetUser(string name)\n{\n  Console.WriteLine(\"Hello,\
    \ \" + name + \"!\");\n}\n\npublic void GreetUser(string firstName, string lastName)\n\
    {\n  Console.WriteLine(\"Hello, \" + firstName + \" \" + lastName + \"!\");\n\
    }\n```\n\n在这个示例中，我们有两个 `GreetUser()` 方法，一个接受一个字符串参数，另一个接受两个字符串参数。根据参数的数量和类型，将调用相应的方法。\n\
    \n```csharp\nGreetUser(\"John\"); // 输出: Hello, John!\nGreetUser(\"John\", \"\
    Doe\"); // 输出: Hello, John Doe!\n```\n\n## 5.7 总结\n\n在本章中，我们探索了 C# 中的方法。我们学习了如何声明方法、指定返回类型、传递参数并利用返回值。我们看到了\
    \ void 方法执行操作、带参数的方法接受输入，以及有返回值的方法产生结果。我们还讨论了方法重载，它允许我们拥有同名但参数列表不同的方法。\n\n方法是组织和封装代码的强大工具，促进了重用性和模块化。通过有效利用方法，我们可以创建更具维护性的程序。\n\
    \n# 第 6 章：面向对象编程：类与对象\n\n在本章中，我们将探索 C# 中面向对象编程 (OOP)的基本概念。我们将学习类、对象、属性和方法，这些都是\
    \ OOP 的构建块。理解这些概念将使我们能够创建健壮且可扩展的应用程序。\n\n## 6.1 面向对象编程简介\n\n面向对象编程 (OOP) 是一种编程范式，侧于将代码组织成可重用的自包含对象。对象是类的实例，类是创建对象的蓝图或模板。OOP\
    \ 提供了封装、继承和多态等概念，允许我们创建模块化且易于维护的代码。\n\n## 6.2 类：对象的蓝图\n\n类是一种自定义的数据类型，将数据和行为封装在单一单元中。它作为创建对象的蓝图或模板。在\
    \ C# 中，我们使用 `class` 关键字定义类。这里有一个示例：\n\n```csharp\npublic class Person\n{\n   \
    \ // 类成员在这里\n}\n```\n\n在这个示例中，我们定义了一个名为 `Person` 的类。该类封装了人的特征和行为。\n"
- fmt: "\n# 6.3 Objects: Instances of Classes\n\nAn object is an instance of a class.\
    \ It represents a specific entity or concept. We create objects based on the blueprint\
    \ defined by a class. Here's an example:\n\n```csharp\nPerson person1 = new Person();\n\
    Person person2 = new Person();\n```\n\nIn this example, we created two objects,\
    \ `person1` and `person2`, based on the `Person` class. Each object has its own\
    \ set of data and can perform actions defined by the class.\n\n# 6.4 Properties:\
    \ Accessing and Modifying Data\n\nProperties are members of a class that allow\
    \ us to access and modify its data. They provide a way to encapsulate data and\
    \ control its accessibility. Properties have a getter and optionally a setter\
    \ to retrieve and assign values, respectively. Here's an example:\n\n```csharp\n\
    public class Person\n{\n    public string Name { get; set; }\n    public int Age\
    \ { get; set; }\n}\n```\n\nIn this example, the `Person` class has two properties,\
    \ `Name` and `Age`, which represent the name and age of a person. The `get` accessor\
    \ retrieves the value, while the `set` accessor allows us to assign a new value.\n\
    \nTo access and modify properties, we use the dot notation. Here's an example:\n\
    \n```csharp\nPerson person = new Person();\nperson.Name = \"John\";\nperson.Age\
    \ = 25;\nConsole.WriteLine(person.Name); // Output: John\nConsole.WriteLine(person.Age);\
    \ // Output: 25\n```\n\nIn this example, we created a `Person` object named `person`\
    \ and assigned values to its `Name` and `Age` properties. We then accessed and\
    \ displayed the values.\n\n# 6.5 Methods: Defining Behavior\n\nMethods are members\
    \ of a class that define the behavior or actions that an object can perform. They\
    \ encapsulate a block of code that can be executed when the method is called.\
    \ Here's an example:\n\n```csharp\npublic class Person\n{\n    public string Name\
    \ { get; set; }\n    public int Age { get; set; }\n    public void SayHello()\n\
    \    {\n        Console.WriteLine(\"Hello, my name is \" + Name + \"!\");\n  \
    \  }\n}\n```\n\nIn this example, the `Person` class has a method named `SayHello()`,\
    \ which outputs a greeting message containing the person's name.\n\nTo call a\
    \ method, we use the dot notation. Here's an example:\n\n```csharp\nPerson person\
    \ = new Person();\nperson.Name = \" John\";\nperson.SayHello(); // Output: Hello,\
    \ my name is John!\n```\n\nIn this example, we created a `Person` object named\
    \ `person` and assigned the name \"John\" to its `Name` property. We then called\
    \ the `SayHello()` method, which printed the greeting message to the console.\n\
    \n# 6.6 Constructors: Initializing Objects\n\nA constructor is a special method\
    \ that is called when an object is created. It is used to initialize the object's\
    \ state and set its initial values. In C#, the constructor has the same name as\
    \ the class. Here's an example:\n\n```csharp\npublic class Person\n{\n    public\
    \ string Name { get; set; }\n    public int Age { get; set; }\n    public Person(string\
    \ name, int age)\n    {\n        Name = name;\n        Age = age;\n    }\n   \
    \ public void SayHello()\n    {\n        Console.WriteLine(\"Hello, my name is\
    \ \" + Name + \"!\");\n    }\n}\n```\n\nIn this example, the `Person` class has\
    \ a constructor that takes two parameters, `name` and `age`, to initialize the\
    \ `Name` and `Age` properties.\n\nTo create an object using a constructor, we\
    \ pass the required values when creating the object. Here's an example:\n\n```csharp\n\
    Person person = new Person(\"John\", 25);\nperson.SayHello(); // Output: Hello,\
    \ my name is John!\n```\n\nIn this example, we created a `Person` object named\
    \ `person` and passed the values \"John\" and 25 to the constructor. The constructor\
    \ initialized the `Name` and `Age` properties, and the `SayHello()` method displayed\
    \ the greeting message.\n\n# 6.7 Summary\n\nIn this chapter, we explored the core\
    \ concepts of object-oriented programming in C#. We learned about classes, which\
    \ serve as blueprints for creating objects, and objects, which are instances of\
    \ classes. We discussed properties, which provide access to class data, and methods,\
    \ which define class behavior. We also covered constructors, which initialize\
    \ object state.\n\nObject-oriented programming allows us to create modular and\
    \ reusable code by encapsulating data and behavior into classes. By leveraging\
    \ classes, objects, properties, and methods, we can build robust and scalable\
    \ applications. In the next chapter, we will dive into inheritance, a powerful\
    \ mechanism that promotes code reuse and hierarchy in object-oriented programming.\n\
    \n# Chapter 7: Inheritance: Reusing and Extending Classes\n\nIn this chapter,\
    \ we will explore the concept of inheritance in object-oriented programming using\
    \ C#. Inheritance allows us to create new classes based on existing classes, enabling\
    \ code reuse and the ability to extend functionality. We will learn about base\
    \ classes, derived classes, inheritance hierarchies, and the benefits they bring\
    \ to our programs.\n\n# 7.1 Introduction to Inheritance\n\nInheritance is a fundamental\
    \ concept in object-oriented programming that allows us to create new classes\
    \ (derived classes) based on existing classes (base classes). The derived class\
    \ inherits the properties and methods of the base class, and it can also add new\
    \ members or override existing ones. This promotes code reuse, modularity, and\
    \ extensibility.\n\n# 7.2 Base Classes and Derived Classes\n\nInheritance involves\
    \ two types of classes: base classes and derived classes. A base class is an existing\
    \ class that provides the foundation for derived classes. A derived class is a\
    \ new class that inherits from the base class, gaining access to its members.\n\
    \nTo create a derived class, we use the `:` symbol followed by the name of the\
    \ base class. Here's an example:\n\n```csharp\npublic class BaseClass\n{\n   \
    \ // Base class members\n}\n\npublic class DerivedClass : BaseClass\n{\n    //\
    \ Derived class members\n}\n```\n\nIn this example, we have a base class `BaseClass`\
    \ and a derived class `DerivedClass` that inherits from `BaseClass`.\n\n# 7.3\
    \ Inheriting Members\n\nWhen a class inherits from a base class, it automatically\
    \ inherits all the public and protected members. This includes properties, methods,\
    \ fields, and events. The derived class can access and use these inherited members\
    \ as if they were defined within the derived class.\n\n```csharp\npublic class\
    \ BaseClass\n{\n    public void BaseMethod()\n    {\n        // Base class method\
    \ implementation\n    }\n}\n\npublic class DerivedClass : BaseClass\n{\n    public\
    \ void DerivedMethod()\n    {\n        // Derived class method implementation\n\
    \    }\n}\n\nDerivedClass derivedObj = new DerivedClass();\nderivedObj.BaseMethod();\
    \ // Accessing inherited method\nderivedObj.DerivedMethod(); // Accessing derived\
    \ class method\n```\n\nIn this example, the `DerivedClass` inherits `BaseMethod()`\
    \ from `BaseClass` and can use it. It also defines its own `DerivedMethod()`.\n\
    \n# 7.4 Overriding Members\n\nIn some cases, the derived class may need to modify\
    \ the implementation of an inherited member. This is achieved by overriding the\
    \ base class member with the `override` keyword. The overriding member in the\
    \ derived class must have the same signature (name, return type, and parameters)\
    \ as the base class member.\n\n```csharp\npublic class BaseClass\n{\n    public\
    \ virtual void SomeMethod()\n    {\n        // Base class method implementation\n\
    \    }\n}\n\npublic class DerivedClass : BaseClass\n{\n    public override void\
    \ SomeMethod()\n    {\n        // Derived class method implementation\n    }\n\
    }\n\nDerivedClass derivedObj = new DerivedClass();\nderivedObj.SomeMethod(); //\
    \ Calls the overridden method in the derived class\n```\n\nIn this example, the\
    \ `BaseClass` defines a virtual method `SomeMethod()`, which can be overridden\
    \ in the derived class. The `DerivedClass` overrides the method with its own implementation.\n\
    \n# 7.5 Inheritance Hierarchies\n\nInheritance can create hierarchical relationships\
    \ among classes, resulting in inheritance hierarchies. In a hierarchy, a derived\
    \ class can become the base class for another derived class, forming a chain of\
    \ inheritance.\n"
  raw: '# 6.3 Objects: Instances of Classes


    An object is an instance of a class. It represents a specific entity or concept.
    We create objects based on the blueprint defined by a class. Here''s an example:


    ```csharp


    Person person1 = new Person();


    Person person2 = new Person();


    ```


    In this example, we created two objects, `person1` and `person2`, based on the
    `Person` class. Each object has its own set of data and can perform actions defined
    by the class.


    # 6.4 Properties: Accessing and Modifying Data


    Properties are members of a class that allow us to access and modify its data.
    They provide a way to encapsulate data and control its accessibility. Properties
    have a getter and optionally a setter to retrieve and assign values, respectively.
    Here''s an example:


    ```csharp


    public class Person


    {


    public string Name { get; set; }


    public int Age { get; set; }


    }


    ```


    In this example, the `Person` class has two properties, `Name` and `Age`, which
    represent the name and age of a person. The `get` accessor retrieves the value,
    while the `set` accessor allows us to assign a new value.


    To access and modify properties, we use the dot notation. Here''s an example:


    ```csharp


    Person person = new Person();


    person.Name = "John";


    person.Age = 25;


    Console.WriteLine(person.Name); // Output: John


    Console.WriteLine(person.Age); // Output: 25


    ```


    In this example, we created a `Person` object named `person` and assigned values
    to its `Name` and `Age` properties. We then accessed and displayed the values.


    # 6.5 Methods: Defining Behavior


    Methods are members of a class that define the behavior or actions that an object
    can perform. They encapsulate a block of code that can be executed when the method
    is called. Here''s an example:


    ```csharp


    public class Person


    {


    public string Name { get; set; }


    public int Age { get; set; }


    public void SayHello()


    {


    Console.WriteLine("Hello, my name is " + Name + "!");


    }


    }


    ```


    In this example, the `Person` class has a method named `SayHello()`, which outputs
    a greeting message containing the person''s name.


    To call a method, we use the dot notation. Here''s an example:


    ```csharp


    Person person = new Person();


    person.Name = " John";


    person.SayHello(); // Output: Hello, my name is John!


    ```


    In this example, we created a `Person` object named `person` and assigned the
    name "John" to its `Name` property. We then called the `SayHello()` method, which
    printed the greeting message to the console.


    # 6.6 Constructors: Initializing Objects


    A constructor is a special method that is called when an object is created. It
    is used to initialize the object''s state and set its initial values. In C#, the
    constructor has the same name as the class. Here''s an example:


    ```csharp


    public class Person


    {


    public string Name { get; set; }


    public int Age { get; set; }


    public Person(string name, int age)


    {


    Name = name;


    Age = age;


    }


    public void SayHello()


    {


    Console.WriteLine("Hello, my name is " + Name + "!");


    }


    }


    ```


    In this example, the `Person` class has a constructor that takes two parameters,
    `name` and `age`, to initialize the `Name` and `Age` properties.


    To create an object using a constructor, we pass the required values when creating
    the object. Here''s an example:


    ```csharp


    Person person = new Person("John", 25);


    person.SayHello(); // Output: Hello, my name is John!


    ```


    In this example, we created a `Person` object named `person` and passed the values
    "John" and 25 to the constructor. The constructor initialized the `Name` and `Age`
    properties, and the `SayHello()` method displayed the greeting message.


    6.7 Summary


    In this chapter, we explored the core concepts of object-oriented programming
    in C#. We learned about classes, which serve as blueprints for creating objects,
    and objects, which are instances of classes. We discussed properties, which provide
    access to class data, and methods, which define class behavior. We also covered
    constructors, which initialize object state.


    Object-oriented programming allows us to create modular and reusable code by encapsulating
    data and behavior into classes. By leveraging classes, objects, properties, and
    methods, we can build robust and scalable applications. In the next chapter, we
    will dive into inheritance, a powerful mechanism that promotes code reuse and
    hierarchy in object-oriented programming.


    # Chapter 7: Inheritance: Reusing and Extending Classes


    In this chapter, we will explore the concept of inheritance in object-oriented
    programming using C#. Inheritance allows us to create new classes based on existing
    classes, enabling code reuse and the ability to extend functionality. We will
    learn about base classes, derived classes, inheritance hierarchies, and the benefits
    they bring to our programs.


    # 7.1 Introduction to Inheritance


    Inheritance is a fundamental concept in object-oriented programming that allows
    us to create new classes (derived classes) based on existing classes (base classes).
    The derived class inherits the properties and methods of the base class, and it
    can also add new members or override existing ones. This promotes code reuse,
    modularity, and extensibility.


    # 7.2 Base Classes and Derived Classes


    Inheritance involves two types of classes: base classes and derived classes. A
    base class is an existing class that provides the foundation for derived classes.
    A derived class is a new class that inherits from the base class, gaining access
    to its members.


    To create a derived class, we use the `:` symbol followed by the name of the base
    class. Here''s an example:


    ```csharp


    public class BaseClass


    {


    // Base class members


    }


    public class DerivedClass : BaseClass


    {


    // Derived class members


    }


    ```


    In this example, we have a base class named `BaseClass` and a derived class named
    `DerivedClass` that inherits from `BaseClass`.


    # 7.3 Inheriting Members


    When a class inherits from a base class, it automatically inherits all the public
    and protected members of the base class. This includes properties, methods, fields,
    and events. The derived class can access and use these inherited members as if
    they were defined within the derived class itself.


    ```csharp


    public class BaseClass


    {


    public void BaseMethod()


    {


    // Base class method implementation


    }


    }


    public class DerivedClass : BaseClass


    {


    public void DerivedMethod()


    {


    // Derived class method implementation


    }


    }


    DerivedClass derivedObj = new DerivedClass();


    derivedObj.BaseMethod();    // Accessing inherited method


    derivedObj.DerivedMethod(); // Accessing derived class method


    ```


    In this example, the `DerivedClass` inherits the `BaseMethod()` from the `BaseClass`
    and can use it directly. It also defines its own `DerivedMethod()`.


    # 7.4 Overriding Members


    In some cases, the derived class may need to modify the implementation of an inherited
    member. This is achieved by overriding the base class member with the `override`
    keyword. The overriding member in the derived class must have the same signature
    (name, return type, and parameters) as the base class member.


    ```csharp


    public class BaseClass


    {


    public virtual void SomeMethod()


    {


    // Base class method implementation


    }


    }


    public class DerivedClass : BaseClass


    {


    public override void SomeMethod()


    {


    // Derived class method implementation


    }


    }


    DerivedClass derivedObj = new DerivedClass();


    derivedObj.SomeMethod(); // Calls the overridden method in the derived class


    ```


    In this example, the `BaseClass` defines a virtual method `SomeMethod()`, which
    can be overridden in the derived class. The `DerivedClass` overrides the method
    with its own implementation.


    # 7.5 Inheritance Hierarchies


    Inheritance can create hierarchical relationships among classes, resulting in
    inheritance hierarchies. In a hierarchy, a derived class can become the base class
    for another derived class, forming a chain of inheritance.'
