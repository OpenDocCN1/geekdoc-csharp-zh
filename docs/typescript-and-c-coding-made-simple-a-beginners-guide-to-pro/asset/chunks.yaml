    \n1. **复现问题**：通过识别触发 bug 的步骤或输入，尝试一致地复现该 bug。这有助于隔离问题并理解其范围。\n2. **使用调试语句**：在代码中插入调试语句，在运行时向控制台输出相关信息。这允许你检查变量、检查执行流并识别潜在问题。\n\
    3. **从小更改开始**：不要对代码进行重大更改，而是从微小的修改开始以缩小问题范围。通过逐渐消除潜在原因，你可以更有效地找到根源。\n4. **利用调试工具**：利用你所选择的调试器所提供的断点、单步执行和变量检查。这些工具允许你分析代码在特定地点的状态并识别异常。\n\
    5. **编写测试用例**：开发专门针对错误行为的测试用例。编写测试不仅有助于验证修复结果，还能防止未来的回归。\n\n## Bug 修复最佳实践\n\n\
    在修复 TypeScript 代码中的 bug 时，请考虑以下最佳实践：\n\n1. **理解问题**：彻底分析 bug，以深入理解问题及其对你代码的影响。\n\
    2. **隔离问题**：将问题缩小到代码的特定部分或模块。这使得更容易追踪和修复 bug，而不会引入意外的副作用。\n3. **编写回归测试**：创建复制\
    \ bug 行为的测试用例并验证修复结果。这些测试充了安全网，有助于防止 bug 再次发生。\n4. **记录修复文档**：清晰地记录 bug 修复，包括问题描述、所做的更改以及修复背后的逻辑。这有助于未来的代码维护以及与其他开发者的协作。\n\
    \n在本章中，我们探索了针对 TypeScript 的特定测试和调试技术。通过采用单元测试实践、利用调试工具并遵循有效的调试和 bug 修复策略，你可以确保\
    \ TypeScript 代码的可靠性和稳定性。\n\n# 第 13 章：将 TypeScript 与 JavaScript 集成\n\n## 引言\n\n\
    TypeScript 是 JavaScript 的超集，这意味着任何有效的 JavaScript 代码也是有效的 TypeScript 代码。这种兼容性允许你将\
    \ TypeScript 无缝集成到现有的 JavaScript 项目中，让你利用 TypeScript 静态类型和高级语言特性的优势。在本章中，我们将探索将\
    \ TypeScript 与 JavaScript 集成的各种方式。\n\n## 将 JavaScript 文件重命名为 .ts\n\n在 JavaScript\
    \ 项目开始使用 TypeScript 的简单方法之一是将 JavaScript 文件重命名为 `.ts` 扩展名。TypeScript 可以理解并转换 JavaScript\
    \ 代码，允许你逐步向项目中引入 TypeScript 特性。\n\n例如，如果你有一个名为 `app.js` 的文件，可以将其重命名为 `app.ts`\
    \ 以指示它包含 TypeScript 代码。TypeScript 将能够编译该 JavaScript 代码。\n\n## 配置 tsconfig.json\n\
    \n为了更有效地将 TypeScript 与 JavaScript 集成，你可以在项目根目录下创建一个 `tsconfig.json` 文件。该配置文件允许你指定\
    \ TypeScript 编译选项和设置。\n\n这里是 `tsconfig.json` 的示例：\n\n```json\n{\n  \"compilerOptions\"\
    : {\n    \"target\": \"es6\",\n    \"module\": \"commonjs\",\n    \"outDir\":\
    \ \"dist\",\n    \"strict\": true\n  },\n  \"include\": [\"src/**/*.ts\"],\n \
    \ \"exclude\": [\"node_modules\"]\n}\n```\n\n在上面的示例中，我们将 `\"target\"` 设置为 `\"\
    es6\"`，表示我们希望 TypeScript 编译器将代码转换为 ECMAScript 6。`\"module\"` 设置为 `\"commonjs\"\
    ` 以生成 CommonJS 模块。`\"outDir\"` 指定编译后的 JavaScript 文件输出目录。`\"strict\"` 开启严格检查。\n\
    \n通过配置 `tsconfig.json` 文件，你可以更好地控制 TypeScript 如何处理 JavaScript 并根据需要应用编译选项。\n\n\
    ## 类型声明\n\nJavaScript 库和框架可能没有原生类型信息。但是，TypeScript 提供了一种通过声明文件（`.d.ts`）为 JavaScript\
    \ 代码包含类型声明的方法。\n\n声明文件为现有的 JavaScript 库提供了类型信息，让你能够从 TypeScript 的静态类型和工具功能中获益。\n\
    \n你可以在 DefinitelyTyped 仓库（https://github.com/DefinitelyTyped/DefinitelyTyped）中找到流行的\
