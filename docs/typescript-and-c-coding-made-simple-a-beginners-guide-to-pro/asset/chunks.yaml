    \ use `try-catch` blocks. Here's an example:\n\n```csharp\nstring filePath = \"\
    path/to/file.txt\";\n\ntry\n{\n    // Perform file operations\n    File.Delete(filePath);\n\
    }\ncatch (IOException ex)\n{\n    Console.WriteLine(\"An error occurred while\
    \ performing file operations: \" + ex.Message);\n}\n```\n\n## 12.7 Summary\n\n\
    In this chapter, we explored file input and output operations in C#. We learned\
