    # Chapter 3: Interfaces and Classes


    # Interfaces:


    Interfaces in TypeScript allow us to define the structure of objects and provide
    a contract for implementing classes. They define the properties and methods that
    an object should have. Interfaces can also be used to enforce type checking.


    ```typescript


    interface Person {


    name: string;


    age: number;


    sayHello: () => void;


    }


    let person: Person = {


    name: "John",


    age: 25,


    sayHello: function () {


    console.log("Hello!");


    },


    };


    ```


    # Classes:


    Classes in TypeScript provide a way to define object blueprints or templates.
    They encapsulate data and behavior into a single unit. Classes can have properties
    (variables) and methods (functions). We can create instances of classes using
    the `new` keyword.


    ```typescript


    class Car {


    brand: string;


    color: string;


    constructor(brand: string, color: string) {


    this.brand = brand;


    this.color = color;


    }


    startEngine(): void {


    console.log(`${this.brand} car started!`);


    }


    }


    let myCar: Car = new Car("Toyota", "red");


    myCar.startEngine(); // Toyota car started!


    ```


    In this chapter, we covered additional concepts of TypeScript, including interfaces,
    and classes. These concepts expand the capabilities of TypeScript and empower
    developers to write more structured and maintainable code.


    # Chapter 4: Advanced TypeScript Concepts


    # Introduction:


    In this chapter, we will dive into advanced concepts in TypeScript that will further
    enhance your understanding and proficiency in the language. We will explore topics
    such as union types, intersection types, type aliases, and generics. These concepts
    are powerful tools that allow for increased flexibility and reusability in your
    code.


    # Union Types:


    Union types in TypeScript allow a variable to have multiple types. It is denoted
    using the pipe (`|`) symbol between the types. This enables a variable to hold
    values of different types at different times. Union types are useful when we want
    to work with values that can have different data types.


    ```typescript


    let pet: string | number;


    pet = "dog"; // Valid


    pet = 42; // Valid


    pet = true; // Invalid


    ```


    # Intersection Types:


    Intersection types in TypeScript enable us to combine multiple types into a single
    type. It is denoted using the ampersand (`&`) symbol between the types. This allows
    an object or variable to have all the properties and methods of the intersected
    types.


    ```typescript


    interface Order {


    id: number;


    amount: number;


    }


    interface Customer {


    name: string;


    age: number;


    }


    type OrderWithCustomer = Order & Customer;


    let order: OrderWithCustomer = {


    id: 1,


    amount: 100,


    name: "John Doe",


    age: 30,


    };


    ```


    Type Aliases:


    Type aliases in TypeScript provide a way to create custom names for types. They
    are especially useful when dealing with complex types or when we want to make
    our code more readable and maintainable. Type aliases are created using the `type`
    keyword.


    ```typescript


    type Point = {


    x: number;


    y: number;


    };


    type Shape = "circle" | "square" | "triangle";


    let origin: Point = { x: 0, y: 0 };


    let shape: Shape = "circle";


    ```


    Generics:


    Generics in TypeScript allow us to create reusable components that can work with
    multiple types. They provide a way to define placeholders for types that are determined
    when the component is used. Generics enable us to write flexible and type-safe
    code.


    ```typescript


    function reverse<T>(arr: T[]): T[] {


    return arr.reverse();


    }


    let numbers: number[] = [1, 2, 3, 4, 5];


    let reversedNumbers: number[] = reverse(numbers);


    let names: string[] = ["John", "Jane", "Joe"];


    let reversedNames: string[] = reverse(names);


    ```


    In this chapter, we explored advanced TypeScript concepts, including union types,
    intersection types, type aliases, and generics. These concepts will allow you
    to write more expressive and reusable code, enhancing the flexibility and maintainability
    of your TypeScript projects.


    # Chapter 5: TypeScript Modules and Namespaces


    Introduction:


    In TypeScript, modules and namespaces provide mechanisms for organizing and encapsulating
    code, allowing for better modularity, reusability, and maintainability in larger-scale
    applications. In this chapter, we will explore the concepts of modules and namespaces
    in TypeScript and how they help in structuring and managing your codebase.


    # Modules:


    Modules in TypeScript provide a way to encapsulate code into separate files and
    define dependencies between them. A module is a self-contained unit that can export
    functionalities and import functionalities from other modules.


    # Exporting and Importing:


    To export a functionality from a module, you can use the `export` keyword before
    a declaration, such as a variable, function, class, or interface.


    ```typescript


    // mathUtils.ts


    export function add(a: number, b: number): number {


    return a + b;


    }


    // app.ts


    import { add } from "./mathUtils";


    console.log(add(2, 3)); // Output: 5


    ```


    In the above example, the `add` function is exported from the `mathUtils` module
    using the `export` keyword. In the `app.ts` file, the `add` function is imported
    using the `import` statement and can be used within the file.


    # Default Export:


    In addition to named exports, a module can have a default export. The default
    export is the primary export of a module and is usually used to export a single
    value or functionality.


    ```typescript


    // mathUtils.ts


    export default function add(a: number, b: number): number {


    return a + b;


    }


    // app.ts


    import add from "./mathUtils";


    console.log(add(2, 3)); // Output: 5


    ```


    In the above example, the `add` function is exported as the default export from
    the `mathUtils` module. When importing the default export, you can choose any
    name for the imported value.


    # Namespace:


    Namespaces, also known as internal modules, provide a way to organize related
    code into a named scope. Namespaces can contain variables, functions, classes,
    and interfaces.


    ```typescript


    namespace Geometry {


    export function calculateCircumference(radius: number): number {


    return 2 * Math.PI * radius;


    }


    export function calculateArea(radius: number): number {


    return Math.PI * radius * radius;


    }


    }


    console.log(Geometry.calculateCircumference(5)); // Output: 31.41592653589793


    console.log(Geometry.calculateArea(5)); // Output: 78.53981633974483


    ```


    In the above example, the `Geometry` namespace contains two functions: `calculateCircumference`
    and `calculateArea`. The functions are exported using the `export` keyword and
    can be accessed using the namespace name followed by the function name.


    # Module Resolution:


    Module resolution is the process of locating and loading modules in a TypeScript
    application. TypeScript supports multiple module resolution strategies, such as
    Node.js, Classic, or Module Aggregation.


    The module resolution strategy can be configured in the `tsconfig.json` file using
    the `moduleResolution` compiler option.


    ```json


    {


    "compilerOptions": {


    "moduleResolution": "node"


    }


