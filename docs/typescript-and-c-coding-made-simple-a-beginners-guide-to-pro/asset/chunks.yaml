    \ the data type of a variable based on its assigned value. This feature simplifies\
    \ variable declaration and initialization. Here's an example:\n\n```csharp\nvar\
    \ score = 90;\n```\n\nIn this example, the compiler infers that `score` should\
    \ be type `int` based on the value `90`.\n\n## 2.11 Summary\n\nIn this chapter,\
