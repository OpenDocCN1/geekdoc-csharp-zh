  raw: 'Interfaces in TypeScript define a contract for classes to follow. They specify
    the structure and behavior that a class must adhere to, allowing for code interoperability
    and achieving loose coupling between components. Interfaces can define properties,
    methods, and even extend other interfaces.


    ```typescript


    interface Printable {


    print(): void;


    }


    class Document implements Printable {


    content: string;


    constructor(content: string) {


    this.content = content;


    }


    print(): void {


    console.log(this.content);


    }


    }


    class Invoice implements Printable {


    amount: number;


    constructor(amount: number) {


    this.amount = amount;


    }


    print(): void {


    console.log(`Invoice amount: $${this.amount}`);


    }


    }


    const document = new Document("Sample document");


    const invoice = new Invoice(1000);


    document.print(); // Output: "Sample document"


    invoice.print(); // Output: "Invoice amount: $1000"


    ```


    Object-Oriented Programming with TypeScript provides a solid foundation for building
    modular, reusable, and maintainable applications. By utilizing classes, objects,
    inheritance, encapsulation, polymorphism, and interfaces, you can design and develop
    software systems that are both efficient and flexible. OOP principles promote
    code organization, reusability, and scalability, making TypeScript a powerful
    language for building complex applications.


    # Chapter 8: Generics in TypeScript


    Introduction:


    Generics in TypeScript provide a powerful tool for creating reusable and type-safe
    code components. They allow you to define functions, classes, and interfaces that
    can work with different types, providing flexibility and enhancing code reusability.
    In this chapter, we will explore the concept of generics and how they are used
    in TypeScript.


    The Basics of Generics:


    Generics allow you to create components that can work with a range of types rather
    than being restricted to a specific one. They provide a way to parameterize types
    and enable you to define placeholders for the actual types that will be used when
    the component is used.


    ```typescript


    function identity<T>(arg: T): T {


    return arg;


    }


    let result = identity<string>("Hello, TypeScript!"); // Type argument explicitly
    provided


    console.log(result); // Output: "Hello, TypeScript!"


    let anotherResult = identity(42); // Type argument inferred as number


    console.log(anotherResult); // Output: 42


    ```


    In the above example, the `identity` function is declared using a generic type
    parameter `T`. This allows the function to accept an argument of any type and
    return a value of the same type. The type argument can be explicitly provided,
    as shown in the first usage, or it can be inferred from the argument, as shown
    in the second usage.


    Using Generic Type Parameters:


    Generic type parameters can be used in various ways within functions, classes,
    and interfaces. They can be used to specify the type of function arguments, function
    return types, class properties, and method return types.


    ```typescript


    function toArray<T>(arg: T): T[] {


    return [arg];


    }


    let stringArray = toArray("TypeScript"); // Type argument inferred as string


    console.log(stringArray); // Output: ["TypeScript"]


    let numberArray = toArray(42); // Type argument inferred as number


    console.log(numberArray); // Output: [42]


    ```


    In the above example, the `toArray` function takes a single argument of type `T`
    and returns an array of type `T[]`. The type argument is inferred based on the
    actual argument passed to the function.


    Generic Classes:


    Generic classes allow you to create classes that can work with different types.
    The type parameter can be used to define properties, method arguments, and return
    types within the class.


    ```typescript


    class Box<T> {


    private value: T;


    constructor(value: T) {


    this.value = value;


    }


    getValue(): T {


    return this.value;


    }


    }


    let stringBox = new Box<string>("TypeScript");


    console.log(stringBox.getValue()); // Output: "TypeScript"


    let numberBox = new Box<number>(42);


    console.log(numberBox.getValue()); // Output: 42


    ```


    In the above example, the `Box` class is defined as a generic class with a type
    parameter `T`. The `value` property and `getValue` method are typed using `T`.
    When creating instances of the `Box` class, the type argument specifies the actual
    type used.


    Using Constraints with Generics:


    TypeScript allows you to apply constraints to generic type parameters, ensuring
    that they meet specific requirements. This is useful when you want to restrict
    the types that can be used with a generic component.


    ```typescript


    interface Lengthable {


    length: number;


    }


    function getLength<T extends Lengthable>(arg: T): number {


    return arg.length;


    }


    let arrayLength = getLength([1, 2, 3, 4, 5]);


    console.log(arrayLength); // Output: 5


    let stringLength = getLength("TypeScript");


    console.log(stringLength); // Output: 10


    ```


    In the above example, the `getLength` function is defined with a generic type
    parameter `T` that extends the `Lengthable` interface. The `Lengthable` interface
    requires that the type `T` has a `length` property of type `number`. This constraint
    ensures that the `length` property is accessible within the function.


    Practical Use Cases of Generics:


    Generics are widely used in TypeScript to create reusable and type-safe code components.
    Here are a few practical use cases where generics can be beneficial:


    1\. Collections and Data Structures: Generics can be used to create generic collections
    and data structures such as arrays, linked lists, stacks, and queues that can
    hold elements of different types.


    2\. Function Transformations: Generics can be used to create higher-order functions
    that transform or manipulate other functions. For example, a generic function
    can take a function as an argument and return a new function with a modified behavior.


    3\. Type-Safe APIs: Generics can be used in designing type-safe APIs, where components
    like functions, classes, and interfaces can work with a wide range of types while
    preserving type safety.


    4\. Data Processing and Transformations: Generics can be used in data processing
    and transformations, allowing you to create reusable functions or classes that
    operate on different types of data.


    Benefits of Generics:


    Using generics in TypeScript provides several benefits:


    1\. Code Reusability: Generics allow you to create components that can be used
    with different types, reducing code duplication and promoting code reuse.


    2\. Type Safety: Generics enable you to maintain type safety by preserving the
    type information throughout the usage of the component. This helps catch potential
    type-related errors during development.


    3\. Flexibility: Generics provide flexibility by allowing components to work with
    a wide range of types. This makes your code more adaptable and suitable for diverse
    use cases.


    4\. Expressiveness: Generics enhance the expressiveness of your code by enabling
    you to write more generic and reusable functions, classes, and interfaces. This
    leads to more concise and readable code.


    Conclusion:


    Generics in TypeScript offer a powerful mechanism for creating reusable and type-safe
    code components. By using generic type parameters, you can build functions, classes,
    and interfaces that work with a variety of types, enhancing code reusability,
    type safety, and flexibility. Generics are particularly useful in scenarios where
    you want to create components that can handle different types of data without
    sacrificing type correctness.


