    \ 中许多文件操作方法的示例。通过利用这些方法，你可以根据应用程序的要求对文件和目录执行各种操作。\n\n## 12.6 处理文件异常\n\n在处理文件和目录时，处理可能异常是非常重要的。文件相关的异常可能包括\
    \ `FileNotFoundException`、`IOException`、`UnauthorizedAccessException` 等。为了处理异常，可以使用\
