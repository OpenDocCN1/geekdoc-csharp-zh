    \ TypeScript 项目的灵性和维护性。\n\n# 第 5 章：TypeScript 模块与命名空间\n\n## 引言\n在 TypeScript 中，模块（modules）和命名空间（namespaces）提供了组织和封装代码的机制，允许在大规模应用中实现更好的模块化、重用和维护性。在本章中，我们将探索\
    \ TypeScript 中的模块和命名空间概念，以及它们如何帮助结构化和管理代码库。\n\n## 模块 (Modules)\nTypeScript 中的模块提供了一种将代码封装在单独文件中定义它们之间依赖的方法。模块是一个自包含的单元，可以导出功能并从其他模块导入功能。\n\
    \n## 导出与导入 (Exporting and Importing)\n要从模块导出功能，你可以在声明（如变量、函数、类或接口）之前使用 `export`\
