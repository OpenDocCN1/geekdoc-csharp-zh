    Congratulations! You''ve successfully written and executed your first C# program.
    This simple program demonstrates the basic structure and syntax of a C# program.


    1.8 Next Steps


    Now that you have a basic understanding of C# and have written your first program,
    it''s time to explore further. In the upcoming chapters, we will dive deeper into
    the core concepts of C# programming.


    We will learn about variables, data types, control structures, arrays, methods,
    object-oriented programming, and more. Each chapter will introduce new concepts
    and provide examples and exercises to solidify your understanding.


    By the end of this book, you will have gained the necessary knowledge and skills
    to write C# programs confidently. Whether you aspire to become a professional
    software developer or simply want to explore the world of programming, this book
    will be your guide on this exciting journey.


    So, let''s not waste any more time. Turn the page and let''s begin our exploration
    of C# programming together!


    # Chapter 2: Understanding Variables and Data Types


    In this chapter, we will dive into the world of variables and data types in C#.
    Understanding variables is crucial as they allow us to store and manipulate data
    within our programs. Additionally, we will explore the various data types available
    in C# and learn how to declare and use them effectively.


    # 2.1 Introduction to Variables


    In programming, a variable is a named storage location that can hold a value.
    Think of variables as containers that store data, which can be modified and accessed
    throughout your program. Variables provide flexibility and enable us to perform
    computations, make decisions, and store information for later use.


    # 2.2 Declaring Variables


    Before using a variable, we need to declare it, specifying its name and data type.
    In C#, variables must be declared before they can be used. The syntax for declaring
    a variable is as follows:


    ```csharp


    data_type variable_name;


    ```


    Here, `data_type` represents the type of data the variable will hold, and `variable_name`
    is the chosen name for the variable.


    # 2.3 Common Data Types in C#


    C# provides several built-in data types that cater to different kinds of data.
    Let''s explore some of the commonly used data types:


    - **Numeric Data Types:**


    - `int`: Represents whole numbers (e.g., 1, 10, -5).


    - `double`: Represents floating-point numbers with decimal places (e.g., 3.14,
    -0.5).


    - `decimal`: Represents decimal numbers with higher precision (e.g., 3.14159265358979323846).


    - **Textual Data Types:**


    - `string`: Represents a sequence of characters (e.g., "Hello", "World").


    - **Boolean Data Type:**


    - `bool`: Represents a boolean value, either `true` or `false`.


    - **Additional Data Types:**


    - `char`: Represents a single character (e.g., ''a'', ''7'').


    # 2.4 Assigning Values to Variables


    After declaring a variable, we can assign a value to it using the assignment operator
    (`=`). The assigned value must match the variable''s data type. Here''s an example:


    ```csharp


    int age;


    age = 25;


    ```


    In this example, we declared a variable called `age` of type `int` and assigned
    it the value `25`.


    # 2.5 Initializing Variables


    Variables can be declared and assigned a value in a single step. This is known
    as variable initialization. Here''s an example:


    ```csharp


    string name = "John";


    int quantity = 10;


    ```


    In this case, we declared and initialized the `name` variable with the value "John"
    and the `quantity` variable with the value `10`.


    # 2.6 Variable Naming Rules


    When choosing variable names in C#, keep the following rules in mind:


    - Variable names are case-sensitive (`age` and `Age` are different variables).


    - A variable name must start with a letter or an underscore character.


    - Subsequent characters in a variable name can be letters, digits, or underscores.


    - Variable names cannot contain spaces or special characters (!, @, #, etc.).


    - Avoid using reserved keywords as variable names (e.g., `int`, `string`, `class`).


    # 2.7 Concatenating Variables and Strings


    In C#, we can concatenate variables with strings using the concatenation operator
    (`+`). This allows us to combine textual and variable data. Consider the following
    example:


    ```csharp


    string name = "Alice";


    int age = 30;


    string message = "Hello, " + name + "! You are " + age + " years old.";


    ```


    In this example, we declared a `name` variable of type `string` and an `age` variable
    of type `int`. We then used the concatenation operator (`+`) to combine these
    variables with strings to create the `message` variable. The resulting message
    would be "Hello, Alice! You are 30 years old."


    # 2.8 Working with Constants


    In addition to variables, C# allows the use of constants. A constant is a value
    that cannot be modified once it is assigned. It provides a way to store data that
    remains constant throughout the program. Constants are declared using the `const`
    keyword. Here''s an example:


    ```csharp


    const double PI = 3.14159;


    ```


    In this example, we declared a constant named `PI` with a value of `3.14159`.
    Constants are useful when dealing with fixed values, such as mathematical constants
    or configuration settings.


    # 2.9 Type Conversion


    In programming, we often need to convert data from one type to another. C# provides
    mechanisms for converting between compatible data types. For example, converting
    an `int` to a `double` or a `string` to an `int`. These conversions are known
    as type casting or type conversion.


    C# supports two types of conversions: implicit and explicit. Implicit conversions
    are performed automatically by the compiler when there is no risk of data loss.
    Explicit conversions, also known as type casting, require explicit notation and
    may result in data loss or exceptions if not handled correctly.


    # 2.10 Type Inference


    C# also provides a feature called type inference, which allows the compiler to
    automatically determine the data type of a variable based on its assigned value.
    This feature simplifies variable declaration and initialization. Here''s an example:


    ```csharp


    var score = 90;


    ```


    In this example, the compiler infers that the `score` variable should be of type
    `int` based on the assigned value `90`.


    2.11 Summary


    In this chapter, we explored the concept of variables and learned about the various
    data types available in C#. We discovered how to declare variables, assign values
    to them, and initialize them. Additionally, we covered variable naming rules,
    concatenation of variables and strings, working with constants, type conversion,
    and the type inference feature.


    Understanding variables and data types is fundamental in programming, as they
    allow us to store and manipulate data effectively. In the next chapter, we will
    explore control structures, which enable us to make decisions and control the
    flow of our programs.


    # Chapter 3: Control Structures: Making Decisions and Repeating Actions


    In this chapter, we will delve into control structures in C#. Control structures
    allow us to make decisions and repeat actions based on certain conditions. By
    utilizing control structures, we can control the flow of our programs and make
    them more dynamic and responsive.


    # 3.1 Conditional Statements: Making Decisions


    Conditional statements allow us to execute different blocks of code based on certain
    conditions. In C#, we have the following conditional statements:


    # 3.1.1 If Statement


    The `if` statement is used to execute a block of code if a specified condition
    is true. Here''s an example:


    ```csharp


    int age = 25;


    if (age >= 18)


    {


    Console.WriteLine("You are eligible to vote!");


    }


    ```


    In this example, the `if` statement checks if the `age` is greater than or equal
    to 18\. If the condition is true, the message "You are eligible to vote!" will
    be displayed.


