    let numbers: number[] = [1, 2, 3, 4, 5];


    for (let i: number = 0; i < numbers.length; i++) {


    console.log(numbers[i]);


    }


    let count: number = 0;


    while (count < 5) {


    console.log("Count: " + count);


    count++;


    }


    let i: number = 0;


    do {


    console.log("i: " + i);


    i++;


    } while (i < 5);


    ```


