    properties for performing file I/O operations.


    The `File` class provides methods for creating, deleting, copying, moving, and
    manipulating files. It also enables reading from and writing to files using different
    modes and encodings.


    The `Directory` class provides methods for creating, deleting, moving, and enumerating
    directories. It allows us to work with directories and perform operations such
    as creating new directories, retrieving directory information, and traversing
    directory structures.


    # 12.2 Reading from Text Files


    To read data from a text file in C#, we can use the `StreamReader` class, which
    is part of the `System.IO` namespace. The `StreamReader` class provides methods
    for reading characters, lines, or entire files.


    Here''s an example of reading from a text file using the `StreamReader` class:


    ```csharp


    string filePath = "path/to/file.txt";


    using (StreamReader reader = new StreamReader(filePath))


    {


    string line;


    while ((line = reader.ReadLine()) != null)


    {


    Console.WriteLine(line);


    }


    }


    ```


    In this example, we create a `StreamReader` object by passing the file path to
    its constructor. We use a `using` statement to ensure that the `StreamReader`
    is properly disposed of after use.


    We then read each line from the file using the `ReadLine()` method of the `StreamReader`
    class. The loop continues until there are no more lines to read, and each line
    is displayed on the console.


    # 12.3 Writing to Text Files


    To write data to a text file in C#, we can use the `StreamWriter` class, also
    part of the `System.IO` namespace. The `StreamWriter` class provides methods for
    writing characters, strings, or formatted data to a file.


    Here''s an example of writing to a text file using the `StreamWriter` class:


    ```csharp


    string filePath = "path/to/file.txt";


    using (StreamWriter writer = new StreamWriter(filePath, append: true))


    {


    writer.WriteLine("Hello, World!");


    writer.WriteLine("This is a new line of text.");


    }


    ```


    In this example, we create a `StreamWriter` object by passing the file path to
    its constructor. We set the `append` parameter to `true` to append the data to
    the file if it already exists, or create a new file if it doesn''t.


    We then use the `WriteLine()` method of the `StreamWriter` class to write lines
    of text to the file. The data is written to the end of the file.


    # 12.4 File and Directory Operations


    C# provides a variety of methods for performing file and directory operations.
    Here are some common operations:


    - Creating and deleting files: The `File` class provides methods such as `Create()`,
    `Delete()`, `Move()`, and `Copy()` for creating, deleting, moving, and copying
    files.


    - Creating and deleting directories: The `Directory` class offers methods like
    `CreateDirectory()`, `Delete()`, `Move()`, and `EnumerateDirectories()` for creating,
    deleting, moving, and enumerating directories.


    - Checking file and directory existence: The `File` and `Directory` classes provide
    methods like `Exists()` to check the existence of files and directories. The `Exists()`
    method returns a boolean value indicating whether the specified file or directory
    exists.


    Here''s an example of checking file and directory existence:


    ```csharp


    string filePath = "path/to/file.txt";


    string directoryPath = "path/to/directory";


    bool fileExists = File.Exists(filePath);


    bool directoryExists = Directory.Exists(directoryPath);


    if (fileExists)


    {


    Console.WriteLine("File exists!");


    }


    if (directoryExists)


    {


    Console.WriteLine("Directory exists!");


    }


    ```


    In this example, we use the `File.Exists()` and `Directory.Exists()` methods to
    check the existence of the specified file and directory, respectively. If the
    file or directory exists, we display a corresponding message.


    # 12.5 File and Directory Manipulation


    C# provides additional methods for manipulating files and directories, such as
    renaming, moving, and retrieving file information. Here are a few examples:


    - Renaming a file or directory: The `File` and `Directory` classes offer methods
    like `Move()` and `Rename()` to rename files and directories.


    - Retrieving file information: The `File` class provides methods such as `GetCreationTime()`,
    `GetLastWriteTime()`, and `GetAttributes()` to retrieve information about a file,
    such as its creation time, last write time, and attributes.


    - Copying files: The `File` class includes a `Copy()` method to copy files from
    one location to another.


    These are just a few examples of the many file and directory manipulation methods
    available in C#. By utilizing these methods, you can perform various operations
    on files and directories according to your application''s requirements.


    # 12.6 Handling File Exceptions


    When working with files and directories, it''s important to handle potential exceptions
    that may occur. File-related exceptions can include `FileNotFoundException`, `IOException`,
    `UnauthorizedAccessException`, and others.


    To handle exceptions, you can use try-catch blocks. Here''s an example:


    ```csharp


    string filePath = "path/to/file.txt";


    try


    {


    // Perform file operations


    File.Delete(filePath);


    }


    catch (IOException ex)


    {


    Console.WriteLine("An error occurred while performing file operations: " + ex.Message);


    }


    ```


    In this example, we attempt to delete a file using the `File.Delete()` method.
    If an `IOException` occurs, indicating an error during the file operation, the
    exception is caught in the catch block, and an error message is displayed.


    12.7 Summary


    In this chapter, we explored file input and output operations in C#. We learned
    about the `File` and `Directory` classes, which provide a wide range of methods
    for working with files and directories.


    We discussed how to read from text files using the `StreamReader` class, write
    to text files using the `StreamWriter` class, and perform various file and directory
    operations such as creating, deleting, moving, and manipulating files and directories.'
