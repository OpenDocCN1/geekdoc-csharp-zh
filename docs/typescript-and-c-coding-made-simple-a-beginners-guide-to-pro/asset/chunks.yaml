    \ file using the `StreamWriter` class:\n\n```csharp\nstring filePath = \"path/to/file.txt\"\
    ;\n\nusing (StreamWriter writer = new StreamWriter(filePath, append: true))\n\
    {\n    writer.WriteLine(\"Hello, World!\");\n    writer.WriteLine(\"This is a\
    \ new line of text.\");\n}\n```\n\nIn this example, we create a `StreamWriter`\
    \ object by passing the file path to its constructor. We set the `append` parameter\
    \ to `true` to append the data to the file if it already exists, or create a new\
    \ file if it doesn't.\n\nWe then use the `WriteLine()` method of the `StreamWriter`\
    \ class to write lines of text to the file. The data is written to the end of\
    \ the file.\n\n## 12.4 File and Directory Operations\n\nC# provides a variety\
    \ of methods for performing file and directory operations. Here are some common\
    \ operations:\n\n- **Creating and deleting files**: The `File` class provides\
    \ methods such as `Create()`, `Delete()`, `Move()`, and `Copy()` for creating,\
    \ deleting, moving, and copying files.\n- **Creating and deleting directories**:\
    \ The `Directory` class offers methods like `CreateDirectory()`, `Delete()`, `Move()`,\
    \ and `EnumerateDirectories()` for creating, deleting, moving, and enumerating\
    \ directories.\n- **Checking file and directory existence**: The `File` and `Directory`\
    \ classes provide methods like `Exists()` to check the existence of files and\
    \ directories. The `Exists()` method returns a boolean value indicating whether\
    \ the specified file or directory exists.\n\nHere's an example of checking file\
    \ and directory existence:\n\n```csharp\nstring filePath = \"path/to/file.txt\"\
    ;\nstring directoryPath = \"path/to/directory\";\n\nbool fileExists = File.Exists(filePath);\n\
    bool directoryExists = Directory.Exists(directoryPath);\n\nif (fileExists)\n{\n\
    \    Console.WriteLine(\"File exists!\");\n}\n\nif (directoryExists)\n{\n    Console.WriteLine(\"\
    Directory exists!\");\n}\n```\n\nIn this example, we use the `File.Exists()` and\
    \ `Directory.Exists()` methods to check the existence of the specified file and\
    \ directory, respectively. If the file or directory exists, we display a corresponding\
    \ message.\n\n## 12.5 File and Directory Manipulation\n\nC# provides additional\
    \ methods for manipulating files and directories, such as renaming, moving, and\
    \ retrieving information. Here are a few examples:\n\n- **Renaming a file or directory**:\
    \ The `File` and `Directory` classes offer methods like `Move()` and `Rename()`\
    \ to rename files and directories.\n- **Retrieving file information**: The `File`\
    \ class provides methods such as `GetCreationTime()`, `GetLastWriteTime()`, and\
    \ `GetAttributes()` to retrieve information about a file.\n- **Copying files**:\
    \ The `File` class includes a `Copy()` method to copy files from one location\
    \ to another.\n\nThese are just a few examples of the many file and directory\
    \ manipulation methods available in C#. By utilizing these methods, you can perform\
    \ various operations on files and directories according to your application's\
    \ requirements.\n\n## 12.6 Handling File Exceptions\n\nWhen working with files\
