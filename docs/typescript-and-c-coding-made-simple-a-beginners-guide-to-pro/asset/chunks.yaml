    # Chapter 2: TypeScript Fundamentals


    In this chapter, we will dive deeper into the fundamentals of TypeScript and explore
    its rich set of data types, variable declarations, and basic operations.


    # Data Types:


    TypeScript provides several built-in data types that allow us to define the type
    of a variable explicitly. These data types include:


    - `number` for numeric values, such as 1, 2.5, or -3.


    - `string` for textual data, enclosed in single quotes ('''') or double quotes
    ("").


    - `boolean` for representing logical values, either `true` or `false`.


    - `array` for storing a collection of elements of the same type. We can define
    an array using the syntax: `type[]` or `Array<type>`.


    - `tuple` for representing an array with a fixed number of elements, where each
    element may have a different type.


    - `enum` for defining a set of named constant values.


    - `any` for variables that can hold any type of value. This is useful when working
    with dynamic data or when we don''t want to enforce type checking.


    - `void` for representing the absence of a value. Typically used as the return
    type of functions that don''t return anything.


    - `null` and `undefined` for representing null and undefined values, respectively.


    - `object` for non-primitive types, such as functions, arrays, and objects.


    # Variable Declarations:


    In TypeScript, we can declare variables using the `let` or `const` keywords. The
    `let` keyword is used for variables that can be reassigned, while the `const`
    keyword is used for variables with constant values that cannot be reassigned.


    ```typescript


    let age: number = 25;


    const name: string = "John";


    let isStudent: boolean = true;


    // Arrays


    let numbers: number[] = [1, 2, 3];


    let fruits: Array<string> = ["apple", "banana", "orange"];


    // Tuple


    let person: [string, number] = ["John", 25];


    // Enum


    enum Color {


    Red,


    Green,


    Blue,


    }


    let favoriteColor: Color = Color.Blue;


    // Any


    let dynamicValue: any = 5;


    dynamicValue = "hello";


    // Void


    function sayHello(): void {


    console.log("Hello!");


    }


    // Null and Undefined


    let nullValue: null = null;


    let undefinedValue: undefined = undefined;


    // Object


    let user: object = {


    name: "John",


    age: 25,


    };


    ```


    # Basic Operations:


    TypeScript supports various operators for performing basic operations, such as
    arithmetic, assignment, comparison, and logical operations. These operators include:


    - Arithmetic operators: `+`, `-`, `*`, `/`, `%` for addition, subtraction, multiplication,
    division, and modulus.


    - Assignment operators: `=`, `+=`, `-=`, `*=`, `/=`, `%=` for assigning values
    and performing compound assignments.


    - Comparison operators: `==`, `!=`, `===`, `!==`, `>`, `<`, `>=`, `<=` for comparing
    values.


    - Logical operators: `&&`, `||`, `!` for logical AND, logical OR, and logical
    NOT operations.


    - Comparison Operators: TypeScript provides comparison operators to compare values.
    These operators include `==` (equality), `!=` (inequality), `===` (strict equality),
    `!==` (strict inequality), `>` (greater than), `<` (less than), `>=` (greater
    than or equal to), and `<=` (less than or equal to). For example:


    ```typescript


    let num1: number = 10;


    let num2: number = 5;


    let isGreaterThan: boolean = num1 > num2; // true


    let isLessThan: boolean = num1 < num2; // false


    let isEqual: boolean = num1 === num2; // false


    ```


    - Logical Operators: TypeScript supports logical operators for combining and negating
    conditions. The logical AND operator (`&&`) returns `true` if both operands are
    `true`. The logical OR operator (`||`) returns `true` if at least one of the operands
    is `true`. The logical NOT operator (`!`) negates the value of an operand. For
    example:


    ```typescript


    let isTrue: boolean = true;


    let isFalse: boolean = false;


    let result1: boolean = isTrue && isFalse; // false


    let result2: boolean = isTrue || isFalse; // true


    let result3: boolean = !isTrue; // false


    ```


    - String Concatenation: TypeScript allows us to concatenate strings using the
    `+` operator. For example:


    ```typescript


    let firstName: string = "John";


    let lastName: string = "Doe";


    let fullName: string = firstName + " " + lastName; // "John Doe"


    ```


    - Type Assertion: Type assertion allows us to override the inferred type of a
    variable when we know its actual type. It is done using the angle bracket syntax
    (`<type>`) or the `as` keyword. For example:


    ```typescript


    let someValue: any = "hello";


    let strLength: number = (someValue as string).length; // 5


    ```


    # Control Flow Statements:


    TypeScript supports various control flow statements to conditionally execute blocks
    of code. These include `if...else`, `switch`, and looping statements like `for`,
    `while`, and `do...while`. These control flow statements work similarly to their
    counterparts in JavaScript.


    ```typescript


    let temperature: number = 30;


    if (temperature > 30) {


    console.log("It''s a hot day!");


    } else if (temperature > 20) {


    console.log("It''s a pleasant day.");


    } else {


    console.log("It''s a cold day.");


    }


