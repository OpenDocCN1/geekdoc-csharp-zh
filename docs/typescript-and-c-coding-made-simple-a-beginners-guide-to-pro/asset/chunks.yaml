  trans: "\n\n此外，我们涵盖了检查文件和目录的存在性、文件和目录操作方法，以及文件相关异常的处理。\n\n通过掌握 `C#` 中的文件 I/O 操作，你将能够有效地处理文件相关任务，并在应用程序中处理文件数据。\n\
    \n在下一章中，我们将探索 `C#` 的另一个重要主题：与数据库交互以及执行数据库操作。\n\n# 第 13 章：数据库操作\n\n在本章中，我们将深入研究如何在\
    \ `C#` 中操作数据库。数据库对于应用程序中存储、检索和管理结构化数据至关重要。`C#` 提供了各种库和框架用于与数据库交互，使能够高效执行数据库操作。\n\
    \n## 13.1 数据库简介\n\n数据库是组织的数据集合，数据以系统化的方式进行结构、索引和存储。数据库提供了一种可靠且高效的数据存储和检索方法，使其许多许多的关键组件。\n\
    \n目前有多种类型的数据库，例如关系型数据库（如 `MySQL`、`SQL Server`、`Oracle`）、NoSQL 数据库（如 `MongoDB`、`Couchbase`）以及内存数据库（如\
    \ `Redis`）。根据应用需求，每种类型都有其自身的优势和用场景。\n\n## 13.2 C# 中的数据库连接\n\n为了在 `C#` 中连接并与数据库交互，我们依赖\
    \ `ADO.NET` 框架。`ADO.NET` 提供了一系列类和接口，允许我们执行数据库操作，如查询数据、插入、更新和删除记录。\n\n`ADO.NET`\
    \ 支持多种数据库提供程序，包括 `SQL Server`、`Oracle`、`MySQL` 等其他等。每个提供程序都提供一组特定的类和方法用于与相应的数据库工作。\n\
    \n要建立数据库连接，通常使用连接字符串，其中包含了服务器名称、数据库名称、凭据和其他连接特定的详细信息。\n\n## 13.3 执行 SQL 查询\n\n\
    SQL（结构化查询语言）是与关系型数据库交互的标准语言。在 `C#` 中，我们可以使用 `ADO.NET` 中的 `SqlCommand` 类来执行 SQL\
    \ 查询。\n\n以下是在 `C#` 中执行 SQL 查询的示例：\n\n```csharp\nstring connectionString = \"your_connection_string\"\
    ;\n\nstring query = \"SELECT * FROM Customers\";\n\nusing (SqlConnection connection\
    \ = new SqlConnection(connectionString))\n{\n    SqlCommand command = new SqlCommand(query,\
    \ connection);\n    connection.Open();\n    SqlDataReader reader = command.ExecuteReader();\n\
    \    while (reader.Read())\n    {\n        // 从 reader 中访问数据\n        string customerName\
    \ = reader[\"CustomerName\"].ToString();\n        int age = Convert.ToInt32(reader[\"\
    Age\"]);\n        // 处理数据\n        Console.WriteLine(\"Customer: {0}, Age: {1}\"\
    , customerName, age);\n    }\n    reader.Close();\n}\n```\n\n在此示例中，我们使用 `SqlConnection`\
    \ 类建立到数据库的连接并提供连接字符串。然后，我们创建一个带有 SQL 查询和连接的 `SqlCommand` 对象。\n\n我们使用 `Open()`\
    \ 方法打开连接并使用 `ExecuteReader()` 方法执行查询。`ExecuteReader()` 方法返回一个 `SqlDataReader`\
    \ 对象，允许我们读取检索到的数据。\n\n在 `while` 循环内部，我们使用 `SqlDataReader` 的 `Read()` 方法遍历数据行。我们通过使用列名或索引来访问列的值。\n\
    \n## 13.4 执行数据库更新\n\n除了读取数据外，我们经常需要执行数据库更新，例如插入、更新或删除记录。`ADO.NET` 也提供了执行这些操作的方法。\n\
    \n以下是使用 `ADO.NET` 向数据库插入数据的示例：\n\n```csharp\nstring connectionString = \"your_connection_string\"\
    ;\n\nstring query = \"INSERT INTO Customers (CustomerName, Age) VALUES (@name,\
    \ @age)\";\n\nusing (SqlConnection connection = new SqlConnection(connectionString))\n\
    {\n    SqlCommand command = new SqlCommand(query, connection);\n    // 向命令添加参数\n\
    \    command.Parameters.AddWithValue(\"@name\", \"John Doe\");\n    command.Parameters.AddWithValue(\"\
    @age\", 30);\n    connection.Open();\n    int rowsAffected = command.ExecuteNonQuery();\n\
    \    Console.WriteLine(\"Rows affected: \" + rowsAffected);\n}\n```\n\n在此示例中，我们创建了一个\
    \ SQL 查询来向 `Customers` 表插入数据。我们使用带有参数化值值的 `INSERT INTO` 语句以确保数据插入的安全可靠。\n\n我们创建了一个\
    \ `SqlCommand` 对象并使用 `Parameters.AddWithValue()` 方法向命令添加参数。参数名称（`@name` 和 `@age`）对应\
    \ SQL 查询中的占位符。\n\n打开连接后，我们使用 `ExecuteNonQuery()` 方法执行查询，该方法返回受操作影响的行数。\n\n## 13.5\
    \ 处理事务\n\n在处理需要作为单个单元执行的多个数据库操作时，事务至关重要。事务通过提交所有更改或在发生错误时回滚更改来确保数据的完整性和一致性。\n\n\
    `ADO.NET` 提供了 `SqlTransaction` 类来处理事务。以下是在 `C#` 中使用事务的示例：\n\n```csharp\nstring\
    \ connectionString = \"your_connection_string\";\n\nusing (SqlConnection connection\
    \ = new SqlConnection(connectionString))\n{\n    connection.Open();\n    SqlTransaction\
    \ transaction = connection.BeginTransaction();\n    try\n    {\n        // 在事务内执行数据库操作\n\
    \        SqlCommand command1 = new SqlCommand(\"INSERT INTO Customers (Name) VALUES\
    \ ('John Doe')\", connection, transaction);\n        command1.ExecuteNonQuery();\n\
    \        SqlCommand command2 = new SqlCommand(\"UPDATE Orders SET Status = 'Shipped'\
    \ WHERE CustomerId = 1\", connection, transaction);\n        command2.ExecuteNonQuery();\n\
    \        // 如果所有操作成功，则提交事务\n        transaction.Commit();\n    }\n    catch (Exception\
    \ ex)\n    {\n        // 如果发生错误，则回滚事务\n        transaction.Rollback();\n     \
    \   Console.WriteLine(\"An error occurred: \" + ex.Message);\n    }\n}\n```\n\n"
- fmt: "\nIn this example, we create a transaction using the `BeginTransaction()`\
    \ method of the `SqlConnection` class. We pass the transaction object to the `SqlCommand`\
    \ constructors to associate the commands with the transaction.\n\nInside the `try`\
    \ block, we perform the required database operations within the transaction. If\
    \ all operations succeed, we call `Commit()` to commit the transaction. Otherwise,\
    \ if an exception occurs, we call `Rollback()` to roll back the transaction and\
    \ undo the changes.\n\n## 13.6 Summary\n\nIn this chapter, we explored database\
    \ operations in C#. We learned about connecting to databases using `ADO.NET`,\
    \ executing SQL queries, performing database updates, and handling transactions.\n\
