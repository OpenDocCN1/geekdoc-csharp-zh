    \n## 12.5 文件和目录操作\n\nC# 提供了多种执行文件和目录操作的方法。以下是重命名、移动和检索信息的的一些示例：\n\n- **重命名文件或目录**：`File`\
    \ 和 `Directory` 类提供了如 `Move()` 和 `Rename()`（注：通常使用 Move 实现重命名）的方法来重命名文件和目录。\n\
    - **检索文件信息**：`File` 类提供了如 `GetCreationTime()`、`GetLastWriteTime()` 和 `GetAttributes()`\
