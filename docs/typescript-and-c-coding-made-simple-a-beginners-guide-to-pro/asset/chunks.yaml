    \ from the file using the `ReadLine()` method of the `StreamReader` class. The\
    \ loop continues until there are no more lines to read, and each line is displayed\
    \ on the console.\n\n## 12.3 Writing to Text Files\n\nTo write data to a text\
    \ file in C#, we can use the `StreamWriter` class, also part of the `System.IO`\
    \ namespace. The `StreamWriter` class provides methods for writing characters,\
