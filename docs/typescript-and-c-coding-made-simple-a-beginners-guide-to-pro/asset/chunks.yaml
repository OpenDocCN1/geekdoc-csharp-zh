    # 7.6 Benefits of Inheritance


    Inheritance offers several benefits in object-oriented programming:


    1\. Code Reuse: Inheritance allows us to reuse code by inheriting properties and
    methods from base classes. This reduces code duplication and promotes modularity.


    2\. Extensibility: Derived classes can add new members or override existing ones,
    allowing us to extend the functionality of base classes to suit specific needs.


    3\. Polymorphism: Inheritance enables polymorphism, which allows objects of derived
    classes to be treated as objects of their base classes. This promotes flexibility
    and abstraction.


    4\. Modularity and Maintainability: Inheritance helps in organizing code into
