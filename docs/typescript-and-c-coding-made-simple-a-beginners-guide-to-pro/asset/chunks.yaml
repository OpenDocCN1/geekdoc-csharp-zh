  trans: "\n在本示例中，我们使用 `SqlConnection` 类的 `BeginTransaction()` 方法创建一个事务。我们将事务对象传递给\
    \ `SqlCommand` 构造函数，以便将命令与事务相关联。\n\n在 `try` 块内部，我们在事务中执行所需的数据库操作。如果所有操作均成功，我们调用\
    \ `Commit()` 来提交事务。否则，如果发生异常，我们调用 `Rollback()` 来回滚事务并撤销更改。\n\n## 13.6 总结\n\n在本章中，我们探索了\
    \ C# 中的数据库操作。我们学习了如何使用 `ADO.NET` 连接数据库、执行 SQL 查询、执行数据库更新以及处理事务。\n\n我们讨论了数据库连接的重要性、连接字符串的使用，以及使用\
    \ `SqlCommand` 类执行 SQL 查询。我们还涵盖了向数据库插入数据、更新记录以及为了维护数据完整性而处理事务的内容。\n\n通过理解和利用这些概念和技术，你将能够在\
    \ C# 应用程序中有效地与数据库交互，并执行各种数据库操作。\n\n在下一章中，我们将深入探讨 C# 中错误处理和异常管理的概念，这对于编写健壮且可靠的代码至关重要。\n\
    \n# 第 14 章：错误处理与异常管理\n\n在本章中，我们将探索 C# 中错误处理和异常管理的重要性。错误和异常在软件开发中是不可避免的，理解如何正确处理它们对于编写健壮且可靠的代码至关重要。\n\
    \n## 14.1 异常简介\n\n异常是程序执行过程中发生的意外事件或条件，它会中断代码的正常执行流。异常可能由多种因素引起，例如无效输入、资源不可用或编程错误。\n\
    \n在 C# 中，异常由派自 `Exception` 类的对象表示。当异常发生时，被称为被“抛出”（thrown），如果没有处理，它将沿着调用堆栈向上传播，直到被捕获并处理。\n\
    \n## 14.2 使用 Try-Catch 处理异常\n\n为了在 C# 中处理异常，我们使用 try-catch 块。`try` 块包含可能抛出异常的代码，而\
    \ `catch` 块在发生异常时捕获并处理该异常。\n\n以下是 try-catch 块的基本语法：\n\n```csharp\ntry\n{\n   \
    \ // 可能抛出异常的代码\n}\ncatch (ExceptionType exceptionVariable)\n{\n    // 处理异常的代码\n\
    }\n```\n\n在此结构中，`try` 块中的代码会被监控异常。如果发生异常，它将被 `catch` 块捕获，该块包含了处理异常的代码。\n\n## 14.3\
    \ 捕获特定异常\n\n除了通用的 `Exception` 类外，C# 还提供了一系列特定异常类的层次结构，允许进行更精确的异常处理。通过捕获特定异常，你可以根据发生的异常类型来定制你的错误处理。\n\
    \n以下是捕获特定异常的示例：\n\n```csharp\ntry\n{\n    // 可能抛出异常的代码\n}\ncatch (FileNotFoundException\
    \ ex)\n{\n    // 处理文件未异常\n}\ncatch (IOException ex)\n{\n    // 处理 I/O 异常\n}\n\
    catch (Exception ex)\n{\n    // 处理其他异常\n}\n```\n\n在此示例中，我们在不同的 `catch` 块中捕获不同类型的异常，例如\
    \ `FileNotFoundException` 和 `IOException`。通过根据特定类型处理异常，我们可以提供更有针对性的错误处理和恢复策略。\n\
    \n## 14.4 Finally 块\n\n`finally` 块用于指定无论是否发生异常都应该执行的代码。它通常用于清理资源或释放已获取的锁。\n\n\
    以下是使用 `finally` 块的示例：\n\n```csharp\ntry\n{\n    // 可能抛出异常的代码\n}\ncatch (Exception\
    \ ex)\n{\n    // 处理异常\n}\nfinally\n{\n    // 始终执行的代码\n}\n```\n\n在此示例中，`try` 块中的代码可能会抛出异常。`catch`\
    \ 块负责处理异常，而 `finally` 块中的代码无论是否发生异常都会执行。\n\n## 14.5 抛出异常\n\n除了捕获异常，你还可以使用 `throw`\
    \ 关键字手动抛出异常。抛出异常允许你根据特定的条件或需求生成并传播异常。\n\n以下是抛出异常的示例：\n\n```csharp\nvoid Divide(int\
    \ dividend, int divisor)\n{\n    if (divisor == 0)\n    {\n        throw new DivideByZeroException(\"\
    除数不能为零。\");\n    }\n    // 执行除法操作\n}\n```\n\n在此示例中，`Divide` 方法检查除数是否为零。如果是，该方法将抛出一个带有自定义错误消息的\
    \ `DivideByZeroException`。抛出异常将终止当前执行并沿着调用堆栈向上传播，直到被捕获和处理。\n\n## 14.6 自定义异常\n\n\
    虽然 C# 提供了许多内置异常类型，你也可以创建自己的自定义异常来处理代码中的特定场景。自定义异常可以封装根据应用程序需求定制的额外信息和行为。\n\n要创建自定义异常，你需要定义一个派自基\
    \ `Exception` 类或其一个派生类的新类。你可以根据需要添加自定义属性、方法和构造函数。\n\n以下是自定义异常的示例：\n\n```csharp\n\
    public class CustomException : Exception\n{\n    public CustomException(string\
    \ message) : base(message)\n    {\n        // 额外的初始化或行为\n    }\n    // 额外的自定义属性或方法\n\
    }\n```\n"
