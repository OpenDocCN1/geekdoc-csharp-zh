- '# Unity 虚拟现实开发：无需 C# 编程技能：使用 Unity 3D & VRTK 开发沉浸式 VR 体验、游戏、应用及 VR 框架，无需 C# 编程




  ![](img/Image00000.jpg)



  ## 献言

  致所有 VR 爱好者……无论你们在何处。


  ## 前言

  在开发 VR 应用和游戏方面，UNITY 3D 是世界上最流行的游戏引擎，它兼顾了业余爱好者和专业的 AAA 工作室。而 VRTK 则是一套经过实战检验的针对
  Unity 的 VR 解决方案。许多大作游戏都是使用 Unity 和 VRTK 3.x 制作的。


  然而，VRTK 4 与 Unity 的结合改变了 VR 开发的格局。没有其他游戏引擎能够像 VRTK 4 配合 Unity 那样，为你的 VR 开发提供如此先进的功能。开发者们喜欢它的拖放式界面和内置功能，但可用的大量框架和工具包让
  Unity 相比于其他可用游戏引擎更胜一筹。


  学习创建你的第一个虚拟现实游戏可能看起来望而生畏；但我向保证，在完成本课程后，你将对 VR 开发和 VRTK 4 框架有深入的理解。你还将能够开始创建自己的 VR
  游戏和应用，具备所有核心功能以及今天顶级 VR 游戏中发现的先进 VR 机制。


  我使用 Unity 游戏引擎开发 VR 已经 5 年了，现在没有比现在开始 VR 开发更好的时候了。如果你错过了抓住智能手机时代浪潮的机会，那么 VR 就是你的机会。像这样的新平台每
  20 年出现一次，参与其中是一个极佳的职业和商业机会，你绝对不想错过它。


  由于 VR 市场仍然非常年轻，它有很大的突破空间，而创造世界上从未见过的事物正是虚拟现实为你提供的独特机会。


  PC 从美国普及率的 2% 增长到 70% 花了 27 年，互联网用了 13 年，而智能手机仅用了 8 年（来源：Samsung NEXT）。许多分析师预测 VR
  将未来 4–5 年内实现这一点。因此，你现在有 1–2 年的时间接受 VR 开发培训，并有 2–3 年的时间来创造对 VR 生态系统产生巨大影响的大作。新平台每
  15–20 年出现一次。你很幸运能够参与其中之一的诞生。


  就在几年前，VR 爱好者还在为如何说服自己购买 VR 头显而挣扎。随着 Oculus Quest 2 的发布，情况已不再如此。


  为一种新媒介创作内容是困难的，这完全取决于测试、失败并反复测试。鉴于整个 VR 行业目前处于“测试与失败”模式，你如何从中获得最大的杠杆作用呢？通过**快速原型制作**。


  使用现最好的 RAD（快速应用开发）工具和框架是未来的方向。直到现在，无论使用 Unity 还是 Unreal 游戏引擎，VR 开发都需要相当的编码技能。然而，随着
  VRTK 4 的发布，你现在可以构建整个 VR 框架、应用或游戏，而无需编写一行代码。这是因为在 VRTK 4 和 Unity 之间，涉及核心和高级机制编码的所有重型工作已经为你完成了。


  这很大程度上归功于 VRTK 4 工具包，它让开发 VR 游戏和应用变得简单。遗憾的是，关于降低学习曲线以掌握 VRTK 4 框架的资源极其稀缺，这就是我制作这门课程的原因，让你只需花
  11 小时就能学习 VRTK 4 的所有细节，并走上创建惊叹的 VR 游戏和应用的道路。


  现在就成为 VR 的先驱，创造未来吧！

  Chris Coutinho


