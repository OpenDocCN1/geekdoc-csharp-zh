  ## 第一章：关于本书和课程

  ### UNITY® VR 开发：无需编程

  通过 `Unity` 和 `VRTK 4` 构建沉浸式 VR 体验来学习 VR 开发。探索 `VRTK 4` 的最新功能，并构建你自己的 VR 体验，无需编写一行代码。探索
  `VRTK 4` 的最新功能，并构建你自己的 VR 体验，无需编写一行代码。


  ### 核心特性

  * 开发沉浸式 VR 体验。

  * 从零开始、零代码构建整个 VR 框架。

  * 构建一次，即可部署到 Steam VR 以及基于 Oculus 的 6 DOF 设备。

  * 构建 VR 模拟器，使用 XBox 控制器或键盘和鼠标输入，在不需要 VR 硬件的情况下测试你的项目。

  * 创建核心 VR 机制，如交互以及传送门和滑动移动方式。

  * 创建先进的 VR 移动方式，包括攀爬、手臂摆动移动、传送区域、传送区域以及使用 `Unity` 导航网格的移动方式。

  * 创建距离抓取机制。

  * 创建先进的真实 VR 手部（即《Half-Life: Alyx》手），允许你利用物理推推 VR 世界中的物体。

  * 构建高级 VR 机制，涉及创建玩家枪带和背包吸附区域。

  * 设置线性和角度关节驱动，以创建抽屉、门、杠杆、按钮甚至甚至是方向盘。

  * 创建先进的空间 UI，你可以使用手部进行物理交互，也可以使用指针进行交互。

  * 创建可以使用指针进行交互的 2D UI。

  * 学习在抓取物体时生成触觉反馈。

  * 学习使用 Shader 材质在物体被触摸时为物体添加轮廓。

  * 创建可以跟随任何物体的空间提示。

  * 在无需编写一行代码的情况下创建一个迷你 VR 游戏。






  # 课程描述


  欢迎来到首个“无需编程”的 VR 开发课程，本课程将将使用 `VRTK 4`。本课程采用实战和项目导向的教学方法，涵盖了使用 `Unity` 和 `VRTK 4`
  进行虚拟现实开发的细节。你将学习如何构建一个完整的 VR 框架，该框架可以在 `Oculus Rift`、`Quest` 和 `HTC Vive` 等现代设备上体验。


  在课程结束时，你将完全有能力结合 `Unity` 使用 `VRTK 4` 来开发丰富的交互式虚拟现实体验。在开发 VR 应用程序和游戏方面，`Unity` 是顶级的游戏引擎。而
  `VRTK` 则是专为 `Unity` 设计的经过实践检验的 VR 解决方案。许多大片级游戏都是使用 `Unity` 和 `VRTK 3.x` 制作的。


  `VRTK 4` 结合 `Unity` 改变了 VR 开发的动态。没有其他游戏引擎在为 VR 开发提供如此先进的功能方面，能及 `VRTK 4` 配合 `Unity`。


  从工具箱的角度来看，市面上有很多免费和付费的 VR 开发工具箱，包括 `Unity` 自带的 `XR interaction toolkit`。然而，这些工具箱中没有一个能提供像
  `VRTK 4` 那样开箱即用的高级功能。目前还没有任何工具箱可以让你在无需编写单行代码的情况下，创建出如此先进的 VR 机制。


  在课程中，你甚至不需要启动一次 `Visual Studio`。不需要任何编程技能！通过使用 `Unity` 和 `VRTK 4`，你将从零开始构建一个完整的框架，该框架可以作为构建任何
  VR 游戏或体验的基础。在课程结束时，你将利用你构建的框架来创建你自己的自己的迷你游戏。


  这门课程让理解 `VRTK 4` 变得超级简单，你开发的框架将是一个巨大的、凝聚的、精简高效的机器。课程结束时，你将拥有一个先进的 VR 框架，你甚至可以发布它！你甚至可以使用课程中提供的想法进一步增强迷你游戏，并将你的游戏发布到
  `Oculus` 和 `Steam`。


  ## 本课程适合的人群


  本课程面向初级到中级的 `Unity` 用户，他们需要熟悉 `Unity` 编辑器，用于基础场景编辑、通用编程逻辑、对 `Unity` 预制（prefabs）的基本理解以及关于事件（Events）如何工作的一些基础知识。你不需要知道如何编写任何事件代码。本课程将带你逐步完成每一个步骤，并为你提供大量的练习。


  ## 课程先决条件


  你需要一个支持 `Steam VR` 仅 `Oculus` 的 `6 DOF`（六自由度）头显设备。本课程无法使用 `3 DOF` 头显设备学习，因为你需要在你的
  VR 世界中移动。你可以使用 `Steam VR` 头显设备，如 `HTC Vive`、`Oculus Rift` 或 `Oculus Quest`（1 代和
  2 代均可正常工作），这些是目前流行的 `6 DOF` 头显设备，也是本课程经过测试的设备。


  你需要一台在硬件要求上支持你 VR 头显设备的电脑。如果使用 `Oculus Quest`，建议配备一根 `link cable`，因为每次测试都将构建版本部署到头显上并不实用，非常耗时。


  ## 课程交付模式


  本课程包含超过 11 小时的视频内容，跨越 74 节课程，大约相当于 400 页书面内容。交付模式基于视频，因为随着 `VRTK 4` 的演进，包含新内容会容易得多。


