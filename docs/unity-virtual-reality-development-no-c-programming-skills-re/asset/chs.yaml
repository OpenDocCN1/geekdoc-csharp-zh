  # 第二章：为 VR 开发设置你的设备


  在本节中，你将为虚拟现实准备好一切工作，并学习由 `Extend Reality Ltd` 开发的第 4 版本虚拟现实工具包 `VRTK`。`VRTK` 是免费提供的，并根据
  `MIT license` 授权。


  ### 视频课程：在 VR 开发中使用 VRTK 4 相比其他 SDK 的优势


  `VRTK` 并不是开始虚拟现实开发的唯一解决方案。`Unity`、`Oculus` 和 `Steam VR` 为 VR 开发提供了各自的 `SDKs`。你也可以从资产商店购买资产，以获得所需的
  VR 特定功能。


  `Unity` 的 `XR Interaction Toolkit` 是一种基于高级组件的交互系统，用于创建 VR 体验，并最终将整合各种平台。而 `Oculus`
  和 `Steam VR` 则为其各自的平台提供 `SDKs`。


  `VRTK` 最大优势在于它提供了一个简单且可扩展的框架，可以在多个平台上运行。它同时是免费且开源的。`VRTK` 整体是一个虚拟现实开发工具包，为虚拟现实中的核心组件（如移动、与
  3D 对象交互等）提供了内置的广泛支持。


  这减少了你为了开始 VR 开发而编写的代码量，因为 `VRTK` 为你完成了所有繁重工作。现在你可以专注于开发游戏或应用程序，而无需担心输入管理、控制器、移动方法、攀爬和抓取机制、UI
  交互等基础功能。


  ### 视频课程：设置 Oculus 和 Unity SDK


  本课程 `VRTK` 第 4 唯一要求是使用 `Unity 2019.20` 和 `Windows 10` 或更高版本。然而，我强烈建议你坚持使用 `Unity
  2019.4.`，这是本课程创建的版本。如果你想使用比 `Unity 2019.4.` 更新的版本，你仍然需要留在 `Unity` 的 `2019.4.xx`
  LTS 版本。本课程不支持 `Unity 2020` 或 `2021`。


  你还需要遵循 `Oculus Integration` 的基本系统要求。如果你有任何疑问，Oculus 提供了一个系统工具来检查你的电脑是否准备好支持 VR。`Steam
  VR` 也提供了类似的工具。


  在本节课程中，你将创建一个新项目，并下载导入作为本课程附件的 `VRTK Playground` Unity 包。这是提供给你的一个启动包，你将在此基础上构建，为你的
  VR 框架创建先进的 VR 机制。你还将安装必要的 VR `SDKs`。


  ### 视频课程：导入 VRTK 4 包


  到目前为止，你已经为 VR 开发准备好了项目。在本节中，你将把 `VRTK 4` 引入你的项目。`VRTK 4` 由多个 `TILIA` 包组成，这些包为空间解决方案的开发提供了有用的功能。`VRTK
  4` 的美之处在于，你可以只安装你认为你的项目需要的包。你并不被强制安装每一个包，尽管你可以这样做。






  在你的情况下，你将安装本课程中需要的所有包。这将涉及像讲座中解释的那样更改你的 `manifest.json` 文件。


  [Unity® VR 开发: 无需编程](https://www.udemy.com/course/unity-vr-dev-no-coding-required/?referralCode=E729C6CA76CF04CF4E9F)


  # 第三章：设置你的 VRTK Rig


  在安装了所需的 SDK 并导入了必要的 VRTK 4 TILIA 程序包后，你现在将在你的场景中设置 VRTK Rig。VRTK 为你提供了一个专门的摄像机 Rig
  制体（prefab），用于利用 Unity 的 XR 摄像机。它还提供了用于适配 Oculus 和 Steam SDK 的摄像机 Rig 制体。


  ## 视频课程：设置单个摄像机 Rig


  在节节座中，你将设置由 VRTK 提供的通用 Unity XR 摄像机 Rig 制体，它可以用于你所有的设备，即 HTC Vive、Oculus Rift、Oculus
  Quest 以及空间模拟器（Spatial Simulator）。


  你在这里设置的 3 个摄像机 Rig 如下：


  - Camera Rigs, Unity XR

  - Camera Rigs, Oculus Integration

  - Camera Rigs, Spatial Simulator






  ## 视频课程：设置 VRTK 的追踪别名 (Tracked Alias)


  VRTK 为你提供了一个 `Tracked Alias` 制体，这是一种通用摄像机架，可以代表任何 XR 硬件。因此，如果你在场景中有 Oculus 摄像设备、Steam
  VR 摄像机架或模拟器，它们都可以连接到这个追踪别名，从那时起，无论你想执行什么操作，都针对这个 `tracked alias` 进行。


  这样，你就不需要担心场景中有哪些摄像机架，只需激活你打算使用的那一个即可。这个追踪别名允许你追踪任何列在其 `Camera Rigs` 列表中的活动有效 SDK
  摄像设备，而无需与其显式绑定。在本节课程中，你将学习如何设置你的 `tracked alias`。


  ## 视频课程：配置你的 Oculus OVR Camera Rig


  在本节课程中，你将配置你的 `Oculus OVR Camera Rig` 上的某个重要属性。随后，你将使用已设置的合适摄像设备，测试你选择的 HMD（头戴显示器）。


  `Unity XR Camera Rig` 被认为是通用摄像设备，它可以适用于你的任何 HMD。此外，你还可以结合 `Spatial Simulator` 摄像设备以及你的键盘和鼠标，测试在
  VR 世界中的移动。


  ## 视频课程：对象状态切换器 - 在场景中手动切换摄像机架


  在本节课程中，你将学习如何设置和使用由 VRTK 提供的 `Object State Switcher` 制体，以便在场景内切换切换摄像机架。


  请注意，切换需要在电脑上完成，对象切换器的 UI 不会出现在你的 HMD 中。你会发现对象状态切换器更多是一个由 VRTK 提供的便利实用工具，你实际上并不需要它，因为你始终可以在
  Unity 的层级结构（hierarchy）中通过直接激活和禁用所需的摄像机架来实现摄像机架之间的切换。


  [Unity® VR 开发：无须编程](https://www.udemy.com/course/unity-vr-dev-no-coding-required/?referralCode=E729C6CA76CF04CF4E9F)


  # 第四章 设置交互器 (Interactors)、速度追踪器和你的虚拟手


  在本节中，你将从设置 VRTK 提供的默认控制器模型开始，这些模型本质上是两个代表你手的长方体对象。然而，为了增加虚拟现实的沉浸感，你将继续用虚拟动画手替换这些长方体手。


  在本节中，你将接触到 VRTK 的 `Input Controllers`。我将讨论如何为 Oculus 设备、HTC Vive、Xbox 控制器和键盘设置这些。你还会注意到，Oculus
  控制器和 HTC Vive 控制器在物理按钮上有所不同，但 VRTK 让它们的设置变得简单。


  ## 视频课程：交互器 (INTERACTOR) 与 可交互对象 (Interactable)


  要在 VR 中让手工作，你需要理解 `Interactor`（交互器）和 `Interactable`（可交互对象）的概念。


  `interactor` 是一个在触摸另一个可交互对象时能够感知的物体。另一方面，`interable` 是虚拟世界中的一个游戏对象，用户可以与之交互。本节课程解释了这一基础概念，并讨论了
  VRTK 你与 `interable` 交互的两种标准方式。


  ## 视频课程：设置你的交互器 (Interactors)


  在本节课程中，你将学习如何使用 VRTK 提供的制体来设置你的 `Interactors`。


  ## 视频课程：为 Oculus 集成设置 Oculus 手


  在本节课程中，你将学习如何设置 Oculus 提供的手，以使其与 VRTK 提供的摄像机架 `Oculus Integration` 制体协同工作。如果你仅为
  HTC Vive 开发，随后的课程将向你展示如何为此 Steam VR 设备设置动画手，该设备使用 `Unity XR camera rig`。


  ## 视频课程：为 Unity XR 和 Spatial Simulator 设置自定义手


  你的 Oculus 手指动画将无法配合 `Unity XR Camera Rig` 或 `Spatial Simulator`。因此，你的 HTC Vive 无法使用
  Oculus 提供的手。然而，这并不意味着我们不能为 HTC Vive 和 Spatial Simulator 真实的部和动画。


  课程附带中你会找到一个名为 `Unity VR Hands` 的 Unity 包，你需要下载并将其导入到项目中。该包将为你提供一个带有动画的自定义手，它将用于驱动你的
  HTC Vive 及其控制器的 `Spatial Simulator` 和 `Unity XR Camera Rig`。在本节课程中，你将学习如何设置这些新的自定义手，如果你使用
  `Unity XR Camera Rig`，它们甚至可以在你的 Oculus 设备上运行。


  ## 视频课程：基于键盘和控制器输入的自定义手动画 - 抓取与释放抓取


  在本节课程中，你将学习根据来自控制器、键盘、鼠标甚至 Xbox 控制器的输入来为你的自定义手制作动画。VRTK 允许你捕获不仅来自 VR 控制器的输入，还包括可能通过
  Xbox 控制器接收的输入，以及键盘上的按键甚至鼠标的输入。


  Xbox 控制器、键盘和鼠标理想情况下在配合 `Spatial Simulator` 测试时使用。由于输入可能来自各种控制器设备，你需要一种方法将此类输入合并到一个对象中，然后由其他对象进行轮询。你将在所有上述的输入设备上设置
  `Grabbing`（抓取）和 `Ungrabbing`（释放抓取）机制。本节课程将深入探讨这一设置。


  ## 视频课程：基于控制器输入的自定义手动画 - 使用摇杆 (Thumbstick)


  在本节课程中，你将为摇杆被按下设置一个动画。该程序与你设置抓取按钮按下动画时看到的相似。


  ## 视频课程：设置你的交互器以抓取 (Grab) 和速度追踪器


  在本节课程中，你将学习如何设置你的 `Interactors` 以执行 `Grab`（抓取）和 `Velocity Track`（速度追踪）。


