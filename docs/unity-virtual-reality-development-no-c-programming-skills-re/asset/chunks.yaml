    - 每当玩家向球附加一个障碍物时，将其缩放因子增加 0.1。

    - 设置一个游戏管理器（Game manager），用于计数收集的障碍物数量；当收集到足够数量的障碍物或球达到特定大小时，用户进入下一关。

    - 使用另一个提示框（tool-tip）显示附加到球上的障碍物数量计数。

    - 为你的障碍物分类（例如小型、中型和大型），并确保在允许玩家抓取 `medium` 及更大的障碍物之前，必须先收集了一定数量的小型障碍物。

    - 添加一些音效，对于可以附加在球上的不同独特物体，最好使用不同的音效。

    - 为游戏添加一个整体音乐主题。


