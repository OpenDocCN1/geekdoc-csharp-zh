    - Increase the ball scale factor, by 0.1 every time the player attaches an obstacle
    to it.

    - Setup a Game manager, to keep count of the number of obstacles collected, and
    once either a certain number of obstacles are collected, or the ball has attained
    a certain size, have the user progress to the next level.

    - Use another tool-tip that displays an incremental count, of the number of obstacles,
    being attached to the ball.

    - Assign categories to your obstacles, such as Small, Medium and large, and then
    ensure that, a certain number of small obstacles, have been attached first, prior
    to allowing the player, to grab `medium` size and larger obstacles finally.

    - Add some sound effects, preferably different sound effects, for the different
    unique objects, that can be attached to the ball.

    - Add an overall musical theme to the game.


