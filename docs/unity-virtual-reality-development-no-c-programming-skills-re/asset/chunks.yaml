    Required](https://www.udemy.com/course/unity-vr-dev-no-coding-required/?referralCode=E729C6CA76CF04CF4E9F)CHAPTER
    NINESnap ZonesIN THIS SECTION , you will create Snap Zones.A snap zone is a spatial
    zone, where an interactable object can be dropped into.You can create a lot of
    different behaviors by snapping objects together.Snapping objects together means
    that you can insert one object into another object, that is you are inserting
    an interactable into a Snap Zone.Some examples would be, snapping a wheel onto
    a car, a magazine into a weapon, a USB stick into a USB port, inventory slots
    and weapon holsters for weapons.VRTK provides you with a Snap Zone prefab to achieve
    this snapping of objects together.In this section, you will create a few tool
    holders, into which you can place your work tools.You will also have these holders,
    display the name of the tool they contain, using the tool-tip you learnt about
    in the last section.VIDEO LECTURE: IMPORTING the Tool Holder UI, Unity Package
    and setting up 2 new Work ToolsIn this lecture, you will first import a simple
    UI for your tool holder. This has been created using Unity’s UI elements.To save
    you the trouble of setting this up yourself, I have included it as a unity package
    attached to this lecture, that you need to import into your project.VIDEO LECTURE:
    MAKING the Axe and Hammer InteractableIn this lecture you will learn a quicker
    method, to make any game object interactable.You will use the Tilia, Interaction,
    Interactable Creator menu option to quickly make your Axe and Hammer game objects
    interactable.VIDEO LECTURE: SETTING up the Snap ZonesIn this lecture you will
    setup your snap zones, which will enable you to drop your tools, into them.You
    will also learn to reduce the size of the snap zones as well as their colliders.You
    will also learn how to easily control the size an object should be, once it has
    been snapped into the Snap Zone.VIDEO LECTURE: SETTING up Tooltips for the Snap
    ZonesIn this lecture you will create tool-tips for your snap zones, so that whenever
    you drop an object into a snap zone, the tool-tip beneath it, will display the
    dropped objects name.VIDEO LECTURE: SETTING up Rules that restrict entry into
    Snap ZonesCurrently there are no restrictions in place, to ensure that only specific
    tools, can enter your snap zone.As things stand now, any tool can be placed into
    any snap zone.In this lecture, you will change this behavior by ensuring that
    the only tools you will be able to drop into your snap zones, are either the Hammer,
    or the Axe, but not the drill machine.This can be easily setup by creating a rule.VIDEO
    LECTURE: SETTING up Holsters that move about with the PlayerSo far you have setup
    snap zones, that can serve as inventory slots.In this lecture, you will learn
    how to setup a Holster, which stays with you as you move about.This holster setup
    that moves around with you, could be used in your next FPS game.In this lecture,
    the holsters you setup will not holster your weapons, but will instead be used
    to holster any of your work tools.Along the way, you will learn to use a new VRTK
    prefab, the Mutator Object follower.[Unity® VR Dev: No Coding Required](https://www.udemy.com/course/unity-vr-dev-no-coding-required/?referralCode=E729C6CA76CF04CF4E9F)CHAPTER
    TENAngular and Linear DrivesIN THIS SECTION , you will learn about the Angular
    and Linear drive prefabs, provided by VRTK, as well as see several examples of
    their use.You will start off using an Angular drive, wherein you will create a
    steering wheel, a door, and a lever.You will then proceed to use a Linear drive,
    which you have already used when you created your slider object. You will however
    use this linear drive prefab again, to create a drawer as well as a push button.Both
    angular and linear drives, are referred to as controllable mechanisms, that provide
    you with both, physics and non-physics based, angular and linear interactable
    controls, that can be used with a wide variety of objects.You will use the non-physics-based
    controls, wherever possible, as the physics-based controls rely heavily on joints
    and if you intend building multi player games, its best to keep joints, to their
    bare minimum.VIDEO LECTURE: CREATING a Steering WheelIn this lecture, you will
    create a car steering wheel, that you can rotate around, using your hands.A steering
    wheel can be created using an angular drive, where this steering wheel, will rotate
    around a central hinge point.Whenever the steering wheel, value changes, an event
    can be raised, notifying the car axle of the change in value, and the car wheels
    could then be aligned accordingly.VIDEO LECTURE: CREATING a DoorIn this lecture,
    you will create a door, that will rotate around a given hinge point, on your door
    frame, which will allow you to simulate a door that can be opened and closed.For
    this setup, you will use an Angular joint drive prefab, that uses Unity joints.You
    will also learn to setup a door that does not revolve, beyond its closed position
    and you will set it up so that it can be opened and closed from the same side
    only.Along the way you will also learn about a new VRTK prefab, the Collision
    Ignorer.VIDEO LECTURE: CREATING a LeverIn this lecture, you will create a Lever,
    that will rotate around a given hinge point, about its X axis.For this setup,
    you will use an Angular joint drive prefab, that uses Unity joints.One common
    use of a lever, would be for a gear box, within a car.VIDEO LECTURE: EXPLORING
    the Angular Joint Drive, Value Events and creating Logic ObjectsIn this lecture,
    you will take a deep dive into the Interactions, Angular joint drive, and examine
    some of its internal events, that you might find useful, when building your game.Here,
    you will look at the Minimum reached, Midpoint reached, and maximum reached, event
    objects.To see these events in action, you will create some Lever logic, wherein
    you setup your lever to work like it does within an automatic car transmission,
    where the lever can be moved between 3 states namely, drive or forward, neutral
    or central and reverse or back.You will also learn to create Logic Objects, that
    do away with the need to write code.VIDEO LECTURE: CREATING a DrawerIn this lecture,
    you will shift focus, to using VRTK''s Linear drive.You have already used the
    Linear Transform drive, when you setup your slider object.In this lecture, you
    will use the Linear Joint drive, to create a drawer, that can be opened and closed.This
    Linear joint drive, uses unity joints and will work with the Unity Physics system.VIDEO
    LECTURE: CREATING a simulated Push ButtonIn the final lecture of this section,
    you will learn how to setup a push button, that can be pressed down, upon being
    touched and automatically spring back up, on release.This push button, will be
    created using the Linear Transform drive, and you will learn to use a couple of
    events too.[Unity® VR Dev: No Coding Required](https://www.udemy.com/course/unity-vr-dev-no-coding-required/?referralCode=E729C6CA76CF04CF4E9F)CHAPTER
    ELEVENTips, Tricks and RecipesIN THIS SECTION , you will learn some useful tips
    and tricks, to address common game-play scenarios.The lectures in this section,
    can be thought of as brief recipes, that teach you specific features, as well
    as provide you with some tips and tricks.VIDEO LECTURE: ADDING realistic Physics
    Hand collisions, to your Avatar handsIn this lecture, you will learn to setup
    realistic hand collisions, for your avatar hands.Currently with the way your hands
    are setup, they pass thru objects, without colliding with them, which is not very
    realistic.Whenever your hand encounters an interactable object, you should either
    be allowed to grab it, or if your intention was not to grab it, your hand should
    be allowed to collide with it, allowing you to push the object about.This is exactly
    what you will setup in this lecture, aka Half-Life: Alyx hands.VIDEO LECTURE:
    SETTING up a Unity Nav Mesh Area, as a valid Teleport Target ZoneIn this lecture,
    you will use Unity’s Nav Mesh, to map out a valid area within your scene.You will
    then be allowed to teleport anywhere within this valid nav mesh, area.Setting
    up a Unity nav mesh is beneficial, as you can then also create A I bots, that
    can navigate this nav mesh too.VIDEO LECTURE: OBTAINING Haptic feedback upon Grabbing
    an Interactable ObjectIn this lecture, you will learn how to obtain Haptic feedback
    against your left and right controllers whenever you grab an interactable object.VIDEO
    LECTURE: OUTLINING Interactable objects using VRTKs Shaders and exploring Interactable
    EventsVRTK provides you with some basic shaders, that you could use to highlight
    your interactable objects, upon touching them.This provides you with a visual
    cue, that you have touched an interactable object.In this lecture you will achieve
    this, by using one out of the 6 shaders provided by VRTK.[Unity® VR Dev: No Coding
    Required](https://www.udemy.com/course/unity-vr-dev-no-coding-required/?referralCode=E729C6CA76CF04CF4E9F)CHAPTER
    TWELVEMini GameIN THIS FINAL section of the course, you will create a small mini
    game.The game you will create is a simplistic, Katamari style clone game, where
    the objective of the game is to roll a ball about the garden path, collecting
    the strewn objects, until the time runs out.This is not a full blown Katamari
    puzzle game, but you could easily achieve that by further coding in simple mechanics,
    that grow your ball, as you pick objects, forcing you to pick up similar sized
    objects only, until your ball has grown to a certain size, where you can then
    graduate to picking larger objects, and complete the level.Here, you will develop
    the core mechanic, of having the ball roll around, and pick-up objects.You will
    also setup a timer, that counts down the seconds you have left, to complete your
    level and upon your timer reaching zero, you will no longer be able to roll your
    ball any further.You will use the Slide movement form of locomotion, you have
    already learnt about, to move yourself thru the scene.This will be achieved by
    pushing on your left controllers thumb stick, as was setup in the Locomotion section,
    earlier in the course.Your right controllers thumb stick, will be used to control
    the ball, allowing it to move forward, backward, as well as move left or right.Your
    countdown timer will be setup as a spatial UI tool-tip, that will display the
    seconds you have left, to collect all objects within the level.Along the way,
    you will learn how to set up a Moment processor, as well as an event that can
    be called once a certain time interval has elapsed.You will also use the VRTK
    provided, Input Combined Actions, Axes to Vector3, action prefab, to have your
    ball roll around, by adding a force to your balls rigid body.Attempting to achieve
    this without using the VRTK provided, Input Combined Actions, Axes to Vector3,
    action prefab, would require you to write some math intensive code, involving
    vectors and trigonometry, to get this sort of realistic ball movement.Thanks to
    this VRTK prefab, you don’t need to code this sort of moderately heavy stuff,
    yourself.VIDEO LECTURE: IMPORTING the Garden Path, Unity Package for your GameIn
    this lecture, you will download the Garden Path, Unity Package and explore its
    contents.This mini game will be built as a separate scene within the same VRTK
    Playground project, as it already comprises all the required Tilia Packages, as
    well as the entire VRTK setup created as part of this course.You will however
    select only the prefabs required for this game, and use them only.VIDEO LECTURE:
    SETTING up the requisite VRTK Prefabs within the Garden SceneIn this lecture,
    you will create prefabs of certain game objects, available within your Demo scene,
    that will be required within your Garden scene, to setup the VR functionality
    for your mini game.VIDEO LECTURE: SETTING up Obstacle ObjectsIn this lecture,
    you will setup all 37 obstacle objects within your scene to allow them to be attached
    to the ball, as and when the ball collides with these obstacles.VIDEO LECTURE:
    SETTING up your Ball to roll about freely within the Garden pathIn this lecture,
    you will setup your right controllers thumb stick, to control the movement of
    the ball, wherein you will be allowed to roll the ball forward, backward, left
    and right.To achieve this natural ball movement, you will use a physics force,
    against the balls Rigidbody, via the Input Combined Actions, Axes to Vector3,
    action prefab.Attempting to achieve this realistic ball movement, without using
    the VRTK provided, Input Combined Actions, Axes to Vector3, action prefab, would
    require you to write some math code, involving vectors and trigonometry, to achieve
    this sort of realistic ball movement.Thanks to this VRTK prefab, you don’t need
    to write this math code.VIDEO LECTURE: SETTING up a Spatial Tooltip UI Object
    to display a Countdown TimerIn this lecture, you will set up a countdown timer
    for your mini game.This timer counts down the seconds you have left, to complete
    your level, and upon your timer reaching zero, you will no longer be able to roll
    your ball any further.You will display this countdown timer in the world, using
    a spatial UI tool-tip.VIDEO LECTURE: SETTING up the Countdown Timer Object and
    learning about the Moment ProcessorIn this lecture, you will setup the countdown
    time and learn about the moment processor, finalizing the mechanics of your mini
    game.VRTK provides you with a countdown timer component, that can be used to create
    a seconds countdown.Once this countdown timer has completed, that is reached zero,
    you can perform an action.The action you will perform is to deactivate the ball,
    so that the player can no longer roll it any further.VIDEO LECTURE: ENHANCING
    the Mini GameThis final lecture, provides you with some ideas on how you can enhance
    this simple mini game further, by writing small snippets of code to do the following:'
