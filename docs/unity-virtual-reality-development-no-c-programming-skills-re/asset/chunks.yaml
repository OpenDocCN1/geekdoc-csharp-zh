- fmt: '

    # VIDEO LECTURE: INSTANT and Dash Teleportation


    Teleportation is a popular way to move around in your virtual world. This is a
    concept where the user points at a location in the virtual world, and is transported
    to that location automatically on the press of a button.


    There are 2 main types of teleportation namely, `instant teleportation` and `dash
    teleportation` that you will explore in this lecture. `Instant teleportation`,
    is where, when a valid teleportable area is found, the user will instantly be
    repositioned at this point, usually with a camera fade, to reduce motion sickness.


    `Dash teleportation`, is where, when a valid teleportable area is found, the user
    is gradually moved over time in a linear motion, until the specific teleportable
    point is reached.


    You will also setup a curved pointer to facilitate teleportation.


    # VIDEO LECTURE: SETTING up the Teleporter


    In the last lecture, you setup your curved pointer to facilitate teleportation.
    In this lecture, you will set up the `Teleporter` object, which will enable you
    teleport around within your Virtual world.


    While the curved pointer is responsible for recognizing a valid teleport and initiating
    it, the `Teleporter` is responsible for moving the `Play area` to its new location,
    which essentially moves your Virtual Player to this new location.


    # VIDEO LECTURE: SETTING up Teleport Targets to traverse large Distances


    Some VR experiences won’t allow you to teleport everywhere. Instead, they rely
    on fixed hot spots, or `teleport targets`, to limit the players movement. This
    is ideal for creating immersive experiences, and puzzle games like `Mist` and
    `Riven`.


    You can create such behavior using teleport targets. These Teleport targets are
    `VRTK` prefabs, that earmark certain specific points or areas, that you can teleport
    too.


    Also, should your VR experience require you to traverse large terrains, teleport
    targets positioned strategically, will help create a great VR experience. `VRTK`
    allows you to achieve this `Targeted Teleportation`, by providing you with 2 prefabs,
    namely, a `Teleport Targets Point`, and a `Teleport Targets area`.


    In this lecture, you will setup both types of Teleport targets.


    # VIDEO LECTURE: SLIDE Movement and Rotation


    Another neat movement type provided by `VRTK`, is the ability to move around your
    scene, by simply gliding along the floor surface, by either moving forward, backward,
    or strafing left and right.


    In this lecture you will setup free-flowing movement and rotation, where you can
    slide yourself around by pushing your left thumb stick, forward and backward as
    well as rotate around, by pushing your left thumb stick, left or right.


    # VIDEO LECTURE: ARM Swinging Locomotion


    Teleporting, and sliding around your world, are great, but in some cases, letting
    the player swing their arms, to move, can increase the level of immersion.


    This enables them to decide, how fast they want to move, and allows for small
    accurate movements.


    If you were creating an endless runner, game in VR, arm swinging would be a truly
    immersive and natural way, to move yourself in the world. Arm swinging is also
    referred to as `Move in Place` locomotion and in this lecture you will setup this
    form of locomotion.


    # VIDEO LECTURE: SETTING up a Pseudo Body


    In the last 2 lectures on Sliding and arm swinging movement, you would have noticed
    that you could easily pass thru the solid containers, barrels, `Ladder` and `Table`
    that are available in the scene.


    In most cases you would not want such a behavior. Ideally you would want yourself
    to be stopped the moment you collided with a solid object.


    To ensure that you do not pass thru solid objects, you need to set up a `Pseudo
    body`. This pseudo body will allow you to provide a virtual presence, to your
    real-world body position, within a spatial scene. In this lecture you will take
    a deep dive into understanding and setting up your pseudo body, which has an important
    role to play while climbing too.


    # VIDEO LECTURE: CLIMBING Objects, Tomb Raider style


    The ability to climb up objects, Tomb Raider style, towards your objective, is
    one of the most enthralling things, you could do in VR. `VRTK` makes climbing
    a breeze, wherein you can make almost any surface climbable.


    Need to climb a fence, a ladder, or perhaps a wall, no worries, as this mechanic
    can be easily created, using a customized interactable prefab, to handle the climbing
    action, in conjunction with the `pseudo body` prefab, to handle the physics of
    the player’s body.


    In this lecture, you will make all containers, as well as the ladder, in your
    scene climbable.


    # CHAPTER SEVEN: Distance Grabbing Objects using a Straight Pointer


    IN THIS SECTION , you will revisit the grabbing mechanic, but this time you will
    set up a `Distance Grabber`. This `Distance Grabber` mechanic, allows you to grab
    an object from a distance, without having you, physically approach the object,
    to grab it. It’s a psychic ability you can have in VR, allowing you to influence
    a physical object, without any physical interaction.


    I personally have used distance grabbing in VR FPS projects, where the player
    is provided with and an upper body avatar, that supports upper arm movements.
    In such a situation, if you as the player drop your weapon, you don’t ideally
    want to bend down physically, to pick it up. You simply can turn on your distance
    grab mechanic and have the weapon move into your hand.


    `VRTK` provides you a distance grab pointer, in the form of a pulsating reticle,
    that shows up when you point towards a grabbable object. You will also learn how
    to limit the grab distance, so that you cannot grab an object from say 100 meters
    away, though if your game requires that, you could have that too. Along the way
    you will also look at, how to use a `Toggle Action`.


    # VIDEO LECTURE: SETTING up a Distance Grabber


    In this lecture you will setup the `Distance Grabber` prefab, provided by `VRTK`.
    This distance grabber in its basic form is a pulsating reticle, that shows up
    on your interactable object, when you point at it.


    # VIDEO LECTURE: SETTING up a Straight Pointer


    While testing you would have noticed that if you are at some distance away, from
    the object you want to grab and if the object is not large enough, it becomes
    difficult to point precisely at that object and have the reticle show up. To overcome
    this, you will set up a straight pointer, which you can use to precisely point
    at the object and perform distance grab a lot more easily. You will also set up
    telekinesis movement, having the grabbed object levitate to your hand over half
    second.


    # VIDEO LECTURE: ACTIVATING and Deactivating the Distance Grabber via a Button
    Press


    In the previous lecture, you would have noted that your distance grabber is always
    in on state, with the Ray pointer always being displayed. In this lecture, you
    will look at setting up the `A` button on Oculus controller, `X` button on X Controller,
    as well as the space key on our keyboard, to toggle the Distance grabber. As HTC
    Vive does not have the buttons `A`, `B`, `X`, or `Y`, you will use your Right
    Trackpad action, to toggle this distance grab pointer, on and off.


    # CHAPTER EIGHT: VRTK''s Spatial UI and Unity''s UI


    THE USER INTERFACE , is an important part of any game. It informs the user about
    their health, score, as well as helps to control the games flow via the use of
    menus and pause screens. In a non-VR game, the UI used is referred to as Heads-Up
    Display, or `HUD`, which is placed over the top of the main screen and shows information
    to the player. This type of UI is known as non-diegetic UI, meaning it doesn’t
    exist physically in the game world. However, it directly relates to what the player
    sees or interacts with inside the game.


    Unfortunately, this non-diegetic UI approach doesn’t work well in VR, as the player
    is unable to focus on something so close to their eyes. It is very distracting
    and uncomfortable, as it moves with players head, as if it been glued on. A better
    and more intuitive way, is to have the UI positioned within the game environment.
    This can be achieved by using Unity’s UI, based on a world space canvas. This
    approach is referred to as Spatial UI. With `VRTK` version 4, you now have the
    ability to create 3D user interfaces, by using spatial buttons, that can be interacted
    with via interactors, or pointers. In this section, you will look at interacting
    with 3D spatial buttons, that exist as objects within your game world, using a
    spatial pointer as well as directly with your hands.


    # VIDEO LECTURE: SETTING up a Straight Pointer


    In this lecture, you will setup a straight pointer that will be exclusively used
    for interacting with your Spatial buttons only. The straight pointer you set up
    here is different from the one setup for the distance grab. Also, a different
    button on your controller will be used to activate this straight pointer. As you
    may noted, while setting up your distance grab, a straight pointer, casts a straight
    line, from the palm of your hand, to either its maximum length, or until the pointer
    beam, collided with a valid game object. When a straight pointer, collides with
    a valid game object, a selection action can occur, emitting an event, containing
    data about the game object the straight pointer, collided with. You will use this
    to create a straight pointer that can interact with your spatial buttons.


    # VIDEO LECTURE: SETTING up a Spatial, Clickable Button


    In this lecture, you will set up a 3D spatial clickable button, that can be clicked
    at, using the spatial pointer, you setup in the previous lecture.


    # VIDEO LECTURE: SETTING up a Spatial Button Group


    In this lecture, you will setup a spatial button group, that allows to group together
    your 3D spatial buttons.


    # VIDEO LECTURE: CHANGING the appearance of your Spatial Buttons


    Your spatial buttons have certain Style properties, that can change their appearance.
    In this lecture, you will use these style properties, to change the appearance
    of your buttons.


    # VIDEO LECTURE: SETTING up a Spatial Toggle Button


    In this lecture, you will create a toggle button wherein, with your straight spatial
    pointer, hovering over the toggle button, a trigger press, will activate the toggle
    button and a subsequent trigger press would deactivate it. A toggle button when
    clicked, would ideally go into the on state and would hold this state, until it
    is clicked again, wherein it will then go into the off state and vice versa.


    # VIDEO LECTURE: SETTING up Spatial Option Buttons


    Option buttons allow you to provide multiple choice options to the player, where
    only one of those options can be in an active state. Attempting to activate any
    other option, will ensure that the currently activated option, within the group
    is deactivated. Option buttons are also referred to as Radio buttons. In this
    lecture, you will create a new Spatial button group, and populate it with some
    option buttons.


    # VIDEO LECTURE: SETTING up a Slider


    A slider is a control that lets the player select from a range of values, by moving
    a knob control along a track. This allows you to display and utilize a numeric
    value within a predefined range. With `VRTK`, you can easily create a slider,
    by using an interactable, along with a limited drive axis. In this lecture, you
    will use a linear drive to create a slider control, that displays the sliders
    value, using a tool-tip, as you move the sliders knob about. In this lecture,
    you will learn how to use the linear joint drive, as well as the tool-tip.


    # VIDEO LECTURE: HACKING your Straight Pointer, allowing it to interact with your
    Slider


    In the last lecture, you saw how you can interact with the slider, using your
    hands. In this lecture, you will learn a undocumented, wherein you can have your
    spatial pointer interact with slider too. Along the way you will also set up a
    rule, so that your spatial pointer is in an active state, only when pointing at
    your 3D buttons.


    # VIDEO LECTURE: USING your Hands to Interact with VRTK''s Spatial Buttons


    In this lecture, you will learn how to interact with 3D buttons directly, using
    your hands. This provides you with a level of true immersion in VR, you will no
    longer need a pointer to interact with it. This opens a world of possibilities
    for interactions. You could even create your own VR keyboard and interact with
    the buttons.


    # CHAPTER N: Snap Zones


    IN THIS SECTION , you will create Snap Zones. A snap zone is a spatial zone, where
    an interactable object can be dropped into. You can create a lot of different
    behaviors by snapping objects together. Snapping objects together means that you
    can insert one object into another, that is you inserting an interactable into
    a Snap Zone. Some examples would be, snapping a wheel onto a car, a magazine into
    a weapon, a stick into a port, inventory slots and weapon holsters for weapons.
    VRTK provides you with a Snap Zone prefab to achieve this snapping of objects
    together. In this section, you will create a few tool holders, into which you
    can place your work tools. You will also have these holders display the name of
    the tool they contain, using the tool-tip you learnt about the last section.


    # VIDEO LECTURE: IMPORTING the Tool Holder UI, Unity Package and setting up 2
    Work Tools


    In this lecture, you will first import a simple UI for your tool holder. This
    has been created using Unity elements. To save you the trouble of this up yourself,
    I have included it as a unity package attached to this lecture, that you need
    to import into your project.


    # VIDEO LECTURE: MAKING the Axe and Hammer Interactable


    In this lecture you will learn a quicker method, to make any game object interactable.
    You will use the `Interaction, Interactable Creator` menu option to quickly your
    Axe and Hammer game objects interactable.


    # VIDEO LECTURE: SETTING up the Snap Zones


    In this lecture, you will setup your snap zones, which will enable you to drop
    your tools into them. You will also learn to reduce the size of the snap zones
    as well as their colliders. You will also learn how to easily control the size
    an object should be, once it has been snapped into the Snap Zone.


    # VIDEO LECTURE: SETTING up Tooltips for the Snap Zones


    In this lecture you will create tool-tips for your snap zones, so that whenever
    you drop an object into a snap zone, the tool-tip beneath it, will display the
    dropped objects name.


    # VIDEO LECTURE: SETTING up Rules that restrict entry into Snap Zones


    Currently there are no restrictions in place, to ensure that only specific tools,
    can enter your snap zone. As things stand now, any tool can be placed into any
    snap zone. In this lecture, you will change this behavior by ensuring that the
    only tools you will able to drop into your snap zones, are either the Hammer,
    or the Axe, but not the drill machine. This can be easily setup by creating a
    rule.


    # VIDEO LECTURE: SETTING up Holsters that move about with the Player


    So far you have setup snap zones, that can serve as inventory slots. In this lecture,
    you will learn how to setup a Holster, which stays with you as you move about.
    This holster setup that moves around with you, could be used in your next FPS
    game. In this lecture, the holsters you setup will not holster your weapons, but
    will instead be used to holster any of your work tools. Along the way, you will
    learn to use a new VRTK prefab, the `Mutator Object follower`.


    # CHAPTER TEN: Angular and Linear Drives


    IN THIS SECTION , you will learn about the Angular and Linear drive prefabs, provided
    by `VRTK`, as well as see several examples of their use. You will start off using
    an Angular drive, wherein you will create a steering wheel, a door, and a lever.
    You will then proceed to use a Linear drive, which you have already used when
    you created your slider object. You will however use this linear drive prefab
    again, to create a drawer as well as a push button. Both angular and linear drives,
    are referred to as controllable mechanisms, that provide you with both physics
    and non-physics based, angular and linear controls, that can be used with a wide
    variety of objects. You will use the non-physics-based controls, wherever possible,
    as you intend building your games, to their bare.


    # VIDEO LECTURE: CREATING Steering Wheel


    In this lecture, you will create a car steering wheel, that you can rotate around,
    using your hands. A steering wheel can be created using angular drive, where this
    will rotate around central point. Whenever the steering wheel, value changes,
    an event can be raised, notifying the car axle of the change.


    # VIDEO LECTURE: CREATING Door


    In this lecture, you will create a door, that will rotate around a given hinge
    point, on your door frame, which will allow you to simulate a door that can be
    opened and closed. For this setup, you will use an angular drive prefab, that
    uses Unity joints. You will also learn to setup a door that does not revolve,
    beyond its closed position and will set it up so it can be opened and closed from
    the same side.


    # VIDEO LECTURE: CREATING Lever


    In this lecture, you will create a Lever, that will rotate around a given hinge
    point, about its axis. For this setup, you will use angular drive prefab, that
    uses Unity joints. One common use of lever would be for gear box, within car.


    # VIDEO LECTURE: EXPLORING Angular Joint Drive, Value Events and creating Logic
    Objects


    In this lecture, you will take a deep dive into Angular joint drive, and examine
    some of its internal events, that you might find useful when building your game.
    Here you will look at Minimum reached, Midpoint reached, and maximum reached,
    event. To see these events in action, you will create some logic, wherein you
    setup lever to work like it does within automatic transmission, where lever can
    be moved between 3 states namely, forward or neutral or reverse or back.


    # VIDEO LECTURE: CREATING a Drawer


    In this lecture, you will shift focus, to VRTK''s Linear drive. You have already
    used Linear Transform drive, when you setup your slider object. In this lecture,
    you will use Linear joint drive, to create drawer, that can be opened and closed.
    This Linear joint drive uses unity joints and will work with the Physics system.


    # VIDEO LECTURE: CREATING a simulated Push Button


    In the final lecture of this section, you will learn how to setup push button,
    that can be pressed down, upon being touched and automatically spring up, on release.
    This push button, will be created using the Linear Transform drive, and you will
    learn to use a couple of events too.


    # CHAPTER ELE: Tips, Tricks and Recipes


    IN THIS SECTION , you will learn some useful tips and tricks to address common
    game-play scenarios. The lectures in this section, can be thought of as brief
    recipes, that teach you specific features, as well as provide you with some tips
    and tricks.


    # VIDEO LECTURE: ADDING realistic Physics Hand collisions, to your Avatar hands


    In this lecture, you will learn to setup realistic hand collisions, for your hands.
    Currently with the way your hands are setup, they pass thru objects, without colliding
    with them, which is not realistic. Whenever your hand encounters an interactable
    object, you should either grab it, or if your intention was not to grab it, your
    hand should be allowed to collide with it, allowing you to push the object about.
    This is exactly what you will setup in this lecture, aka Half-Life: Alyx hands.


    # VIDEO LECTURE: SETTING up a Unity Nav Area, as a valid Teleport Target Zone


    In this lecture, you will use Unity’s Nav Mesh, to map out a valid area within
    your scene. You will then be allowed to teleport anywhere within this valid nav
    mesh area. Setting up a Unity nav mesh is beneficial, as you can then create AI
    bots, that can navigate this nav mesh too.


    # VIDEO LECTURE: OBTAINING Haptic feedback upon Grabbing an Interactable Object


    In this lecture, you will learn how to obtain Haptic feedback against your left
    and right controllers whenever you grab an interactable object.


    # VIDEO LECTURE: OUTLINING Interactable objects using VRTKs Shaders and exploring
    Interactable Events


    VRTK provides you with some basic shaders, that you could use to highlight your
    interactable objects, upon touching them. This provides you with a visual cue,
    that you have touched an interactable object. In this lecture you will achieve
    this, by using one out of the 6 shaders provided by VRTK.


    # CHAPTER TWELVE: Mini Game


    In THIS FINAL section of the course, you will create a small mini game. The game
    you will create is a simplistic, Katamari style clone game, where the objective
    of the game is to roll a ball about the garden path, collecting the strewn objects,
    until the time runs out. This is not a full blown Katamari puzzle game, but you
    could easily achieve that by further coding in simple mechanics, that grow your
    ball, as you pick objects, forcing you to pick objects.

