    ## 第十四章：结语

    恭喜你完成课程。你已经走了很远。干得好！


    你现在拥有了自己的坚实 VR 框架，它比市面上大多数付费 VR 框架都要好得多。最重要的是，是你自己搭建了这个 VR 框架，所以你对它的细节有深入了解。你在没有编写任何一行代码的情况下搭建了整个整个框架！


    当你继续探索和使用这个框架时，你会发现有了 `VRTK 4`，没有是不可能的。记住，你在 VR 领域的整体成功并不取决于你脑子里记了多少知识，而是取决于知道去哪里寻找你所需要的的答案。


    我鼓励你继续探索 `VRTK` 和 `Unity` 来进行 VR 开发，一种很好的方法是加入 `VRTK` 的 discord 频道。继续学习，继续练习并不断变得更好。永远不要停止！不要让任何人告诉你你无法实现目标！

