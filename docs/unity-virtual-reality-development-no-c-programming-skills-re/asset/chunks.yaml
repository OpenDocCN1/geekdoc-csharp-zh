    # Course Description


    Welcome to the very first, No Coding Required, VR development course, using `VRTK
    4`. With its practical and project based approach, this course covers the specifics
    of virtual reality development using `Unity` and `VRTK 4`. You’ll learn how to
    build an entire VR framework, that can be experienced with modern devices like
    the `Oculus Rift`, `Quest` and the `HTC Vive`.


    By the end of this course, you’ll be fully equipped to use `VRTK 4` in conjunction
    with `Unity` to develop rich, interactive virtual reality experiences. `Unity`
    is the top rated game engine, when it comes to developing VR apps and games. `VRTK`
    on the other hand is a battle-tested VR solution for `Unity`. Several blockbuster
    games have been made using `Unity` and `VRTK 3.x`.


    `VRTK 4` in conjunction with `Unity`, has changed the dynamics of VR development.
    No other game engine comes even close, to providing you with such advanced functionality
    for VR development, as does `VRTK 4` with `Unity`.


    From a toolkit standpoint, there are several free, as well as paid toolkits out
    there, for VR development, including `Unity`''s very own `XR interaction toolkit`.
    However, none of these toolkits, provide you with the advanced functionality that
    `VRTK 4` provides, out of the box. There is currently no toolkit out there, that
    would allow you to create such advanced VR mechanics , without the need to write
    a single line of code.


    In this course, you will not be called upon to launch `Visual Studio`, even once.
    No coding skills are required! Using `Unity` and `VRTK 4`, you will build a complete
    framework from scratch, that can be used as the foundation, for building any VR
    game or experience. Towards the end of this course, you will utilize the framework
    you have built, to create your very own mini game.


    This course makes understanding `VRTK 4`, super easy, and the framework you develop,
    will be one massive cohesive, lean, mean machine. At the end of this course, you
    will have an advanced VR framework, that you could even publish! You can even,
    enhance the mini game further, using the ideas provided within this course, and
    publish your game to both `Oculus`, and `Steam`.


    ## Who this course is for


    This course is aimed at beginner to intermediate `Unity` users who need to know
    their way about the `Unity` editor, for basic scene editing, general programming
    logic, a basic understanding of `Unity` prefabs and some basic knowledge of how
    `Events` work. You don''t need to know, how to write any event code. This course
    will take you through everything step by step and give you plenty of practice.


    ## Course prerequisites


    You will need to have access to a `6 DOF` (degrees of freedom) headset for `Steam
    VR`, or `Oculus` only. This course cannot be taken using a `3 DOF` headset, as
    you need to be able to move around within your VR world. You could use a `Steam
    VR` headset like the `HTC Vive`, or an `Oculus Rift`, or an `Oculus Quest` (both
    1 and 2 will work fine), which are some of the more popular, `6 DOF` headsets
    available, and the ones this course has tested against.


    You will need to have a computer that supports your VR headset, in terms of hardware
    required. If using the `Oculus Quest`, it would be advisable to have a `link cable`,
    as deploying a build to the headset, each time you test is not very practical,
    and would be time consuming.


    ## Course delivery Mode


    This course comprises over 11 hours of video content, across 74 lectures, which
    approximates to 400 pages of written content. The mode of delivery is video based
    as its a lot easier to include new content as `VRTK 4` evolves.


    Also Click the link below for a preview of the course.

    [Unity® VR Dev: No Coding Required](https://www.udemy.com/course/unity-vr-dev-no-coding-required/?referralCode=E729C6CA76CF04CF4E9F)


    Also, I urge you to view each of the introductory lectures, made available for
    preview, which will provide you with the sense of depth this course covers.


    # CHAPTER TWO: Setting Up Your Devices for VR Development


    IN THIS SECTION , you''ll set up everything for Virtual Reality and learn about
    `VRTK`, the Virtual Reality Toolkit, version 4, by `Extend Reality Ltd`. `VRTK`
    is available for free and has been licensed under the `MIT license`.


    ### VIDEO LECTURE: ADVANTAGES of using VRTK 4 over alternate SDK''s for VR Development


    `VRTK` is not the only solution available, for getting started in virtual reality
    development. `Unity`, `Oculus` and `Steam VR` provide their own `SDKs` for VR
    development. It’s also possible to purchase assets from the asset store, to avail
    the VR specific functionality you need.


    `Unity`’s `XR Interaction Toolkit`, is a high-level component based, interaction
    system, for creating VR experiences, and will eventually, integrate the various
    platforms. `Oculus` and `Steam VR` on the other hand, provide `SDKs` for their
    own respective platforms.


    The biggest advantage of `VRTK`, is that it provides a simple, yet extensible
    framework, that works across multiple platforms. It is also, both free, and open
    source. `VRTK` is a Virtual Reality Development Toolkit as a whole, providing
    a wide range of support, already built in, for the core components in virtual
    reality, such as locomotion, interacting with 3D objects, as well as 2D and 3D
    controls.


    This reduces the amount of code, you need to write, just to get started, in virtual
    reality Development, as `VRTK` does all the heavy lifting for you. Now you can
    concentrate, on developing the parts of your game or application, without having
    to worry about, input management, character controllers, locomotion methods, climbing
    and grabbing mechanics, UI interactions, and a lot of other fundamentals, you
    would come to expect, from a VR framework.


    ### VIDEO LECTURE: SETTING up Oculus and Unity XR SDK''s


    The only requirement for `VRTK` version 4, for this course, is that you use the
    version of `Unity 2019.4.20` and `Windows 10` or newer. However, I strongly suggest
    you stick with `Unity 2019.4.20`, the version that this course has been created
    with. Should you want to work with a newer version than `Unity 2019.4.20`, you
    will still need to stay with `Unity`’s `2019.4.xx LTS` release. This course will
    not work with `Unity 2020` or `2021`.


    You will also need to follow the basic system requirements for `Oculus Integration`.
    If you’re in any doubt, Oculus provides a system tool to check whether your computer
    is VR ready, meeting the minimum requirements. `Steam VR` provides a similar tool
    for the `HTC Vive`.


    In this lecture, you will go on to create a new project as well as download and
    import the `VRTK Playground` unity package attached as part of this lecture. This
    is a starter package you are provided with, which you will build upon, creating
    state of the art VR mechanics for your VR framework. You will also go on to install
    the necessary VR `SDKs`.


    ### VIDEO LECTURE: IMPORTING the VRTK 4 packages


    So far, you have set up your project for VR development. In this lecture, you
    will bring in `VRTK 4` into your project. `VRTK 4` comprises of a repository of
    several `TILIA` packages, which provide useful features, for the development of
    spatial solutions. The beauty about `VRTK 4`, is that you may install only the
    packages you believe you require, for your project. You are not compelled to install
    each and every package, even though you can.

    '
