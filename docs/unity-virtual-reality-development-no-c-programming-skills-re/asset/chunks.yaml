    # CHAPTER THREE: Setting up your VRTK Rig


    HAV INSTALLED THE required SDK’s and imported the necessary VRTK 4 TILIA packages,
    you will now setup the VRTK Rig within your scene. VRTK provides you with a specialized
    camera rig prefab, for utilizing Unity’s XR Camera. It also provides you with
