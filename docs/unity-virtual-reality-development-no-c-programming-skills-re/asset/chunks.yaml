    ## Dedication

    TO ALL VR Enthusiasts…Wherever you are.


    ## Foreword

    UNITY 3D IS the most popular game engine in the world, catering to amateur hobbyists
    as well as professional AAA studios, when it comes to developing VR apps and games.
    VRTK on the other hand is a battle-tested VR solution for Unity. Several block
    buster games have been made using Unity and VRTK 3.x.


    However, VRTK 4 in conjunction with Unity, has changed the dynamics of VR development.
    No other game engine comes even close, to providing you with such advanced functionality
    for VR development, as does VRTK 4 with Unity. Developers love its drag-and-drop
    interface and built-in features, but it’s the plethora of frameworks and toolkits
    available that give Unity the extra mileage compared to other Game Engines available.


    Learning to create your first Virtual Reality game can seem daunting; but I can
    guarantee you that after completing this course, you will have a solid understanding
    of VR development and the VRTK 4 framework. You will also be able to start creating
    your very own VR games and apps with all the core features as well as most of
    the advanced VR mechanics found within the best VR games today.


    I have been developing for VR for 5 years, using the Unity Game Engine and there
    is no better time to start VR development than now. If you missed your opportunity
    to ride the wave of the smart-phone era, then VR is your chance. New platforms
    like this come about once every 20 years and being part of it is a great career
    and business opportunity, you simply do not want to miss.


    Since the VR market is still very young, there is a lot of room for breakthroughs
    and creating something the world has never seen before, is the unique opportunity
    that Virtual Reality provides you with.


    It took 27 years for PCs to grow from 2% to 70% of total U.S. adoption, 13 years
    for the Internet and just 8 years for smart-phones (source: Samsung NEXT). Many
    analysts have predicted that VR will do this within the next 4–5 years. Thus,
    you have 1–2 years from now to get trained in Virtual Reality Development and
    2–3 years to create something huge that will have a great impact within the VR
    ecosystem. New platforms emerge once every 15–20 years. You are lucky to be able
    to be involved in the birth of one of them.


    Just a couple of years ago, VR Enthusiasts were struggling to justify the expense
    of a VR headset to themselves. This is no longer the case with the release of
    the Oculus Quest 2.


    Creating something for a new medium is difficult and it’s all about testing, failing
    and testing again. Given that the whole VR industry is currently in the test-and-fail
    mode, how do you gain maximum leverage out of it? It’s via Rapid Prototyping.


    Using the best available RAD tools and frameworks out there, is the way forward.
    Up until now, VR development, be it using the Unity or Unreal game engines, required
    quite a bit of coding skills. However, with the release of VRTK 4, you can now
    build an entire VR Framework, app or game, without the need to write a single
    line of code. This is because between VRTK 4 and Unity all the heavy lifting involved
    with coding core and advanced mechanics, has already been done for you.


    A major chunk of this credit goes to the VRTK 4 toolkit, which has made developing
    VR games and apps a breeze. Unfortunately, the resources in terms of easing the
    learning curve, to master the VRTK 4 framework are extremely scarce, which is
    the reason I have produced this course, to enable you learn all the ins and outs
    of VRTK 4 in just 11 hours and be well on your way to creating mind blowing VR
    games and apps.


    Become a VR pioneer now, and create the future!

    Chris Coutinho


    ![RatingBar](Image00002.jpg)


    ## CHAPTER ONE: About This Book and Course

    ### UNITY® VR DEV : No Coding Required

    Learn VR development by building Immersive VR Experiences using `Unity` and `VRTK
    4`. Explore the latest features of `VRTK 4` and build your very own VR Experiences,
    without the need to write a single line of code. Explore latest features of `VRTK
    4` and build your very own VR Experiences, without the need to write a single
    line of code.


    ### Key Features

    * Develop immersive VR Experiences.

    * Build an entire VR Framework from scratch with Zero coding.

    * Build Once and deploy to both Steam VR, as well as Oculus based, 6 DOF devices.

    * Build a VR Simulator, to test your project without the need for VR hardware,
    using a XBox Controller, or keyboard and mouse input.

    * Create core VR Mechanics, such as Interactions as well as Teleporting, and Sliding
    forms of locomotion.

    * Create advanced forms of VR Locomotion, which include Climbing, Arm swinging
    movement, Teleport Zones, Teleport Regions, and Locomotion using `Unity`''s Nav
    mesh.

    * Create Distance Grab Mechanics.

    * Create advanced realistic VR Hands, aka Half-Life: Alyx hands, that allow you
    use Physics, to push objects about in the VR World.

    * Build advanced VR Mechanics that involve creating Player holsters, and Inventory
    Snap Zones.

    * Setup both linear and angular joint drives, to create sliding drawers, doors,
    levers, push buttons and even a steering wheel.

    * Create advanced Spatial UI, that you can interact with physically, using your
    hands, as well as using a pointer.

    * Create 2D UI that you can interact with using a pointer.

    * Learn to generate Haptic feedback, upon grabbing objects.

    * Learn to Outline Objects, using a Shader material, when an object is touched.

    * Create Spatial Tool-tips that can follow any object about.

    * Create a Mini VR game, without writing a single line of code.

