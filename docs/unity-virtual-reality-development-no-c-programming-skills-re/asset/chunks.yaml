    ## VIDEO LECTURE: SETTING up individual Camera Rigs


    In this lecture, you will setup the universal Unity XR camera Rig prefab, provided
    by VRTK which can be used with all your devices, namely the HTC Vive, Oculus Rift,
    Oculus Quest and well as the Spatial Simulator.


    The 3 camera Rigs you will set up here are the following:


    - Camera Rigs, Unity XR

    - Camera Rigs, Oculus Integration

    - Camera Rigs, Spatial Simulator

