  trans: '


    # 视频课程：瞬时传送与冲刺传送


    传送是虚拟世界中移动的一种流行方式。这种概念是指：用户指向虚拟世界中的某处位置，在按下按钮时自动传输到该位置。


    在本节课程中，你将探索两种两种主要的传送类型，即`瞬时传送`（instant teleportation）和`冲刺传送`（dash teleportation）。`瞬时传送`是指当发现一个有效的传送区域时，用户将瞬间重新定位到该点，通常会伴有相机淡入淡出效果，以减少晕动症的产生。


    `冲刺传送`是指当发现一个有效的传送区域时，用户将随时间以线性运动逐渐移动，直到到达特定的传送点。


    你还将设置一个弯形指针以方便传送。


    # 视频课程：设置传送器（Teleporter）


    在上一节课程中，你设置了用于方便传送的弯形指针。在本节课程中，你将设置 `Teleporter`（传送器）对象，这将使你能够在虚拟世界中到处传送。


    虽然弯形指针负责识别有效的传送并启动它，但 `Teleporter` 负责将 `Play area`（玩家区域）移动到新位置，这本质上是将你的虚拟玩家移动到这个新位置。


    # 视频课程：设置传送目标以跨越远距离


    某些 VR 体验不允许你传送到任何地方。相反，它们依赖于固定的热点或 `teleport targets`（传送目标）来限制玩家的移动。这对于创建沉浸式体验以及像《Mist》和《Riven》这样的解谜游戏非常理想。


    你可以使用传送目标创建这种行为。这些传送目标是 `VRTK` 的制体（prefab），它们标记了你可以传送的某些特定点或区域。


    此外，如果你的 VR 体验需要你跨越大型地形，策略性地放置传送目标将有助于创建出色的 VR 体验。`VRTK` 通过提供两个制体允许你实现这种 `Targeted
    Teleportation`（目标传送），即 `Teleport Targets Point`（传送目标点）和 `Teleport Targets area`（传送目标区域）。


    在本节课程中，你将设置两种类型的传送目标。


    # 视频课程：滑动移动与旋转


    `VRTK` 提供的另一种巧妙的移动类型是：沿着地板表面滑动，通过向前、向后或向左/右侧移，在场景中移动。


    在本节课程中，你将设置自由流移动和旋转，你可以通过推推左拇指杆向前或向后来滑动，通过推推左拇指杆向左或向右来旋转。


    # 视频课程：挥臂移动方式（Arm Swinging Locomotion）


    传送和在世界中滑动很棒，但在某些情况下，让玩家通过挥动手臂来移动可以增加沉浸感。


    这使他们能够决定移动有多快，并允许进行小而精确的移动。


    如果你在 VR 中制作一个无尽跑步类游戏，挥臂将是你在世界中移动的一种非常沉浸且自然的方式。挥臂也被称为 `Move in Place`（原地移动）移动方式，在本节课程中你将设置这种形式的移动方式。


    # 视频课程：设置伪身体（Pseudo Body）


    在关于滑动和挥臂的最后两节课程中，你会注意到你可以很容易穿过场景中的实体容器、木桶、`Ladder`（梯子）和 `Table`（桌子）。


    在大多数情况下，你不希望有这种行为。理想情况下，你希望在碰撞到实体物体的瞬间被停止。


    为了确保你不会穿过实体物体，你需要设置一个 `Pseudo body`（伪身体）。这个伪身体将允许你在空间场景中为你的真实身体位置提供一个虚拟呈现。在本节课程中，你将深入了解并设置你的伪身体，它在攀爬活动中也扮演着重要角色。


    # 视频课程：古墓丽险者风格攀爬物体


    像《古墓丽险者》一样爬上物体走向目标，是你 VR 中能做的最着迷的事情之一。`VRTK` 让爬爬变得轻而易举，你可以让几乎任何表面变得可爬。


    需要爬围栏、梯子或墙壁？不用担心，这种机制可以使用自定义的交互制体轻松创建，用于处理爬山动作，并结合 `pseudo body` 制体来处理玩家身体的物理效果。


    在本节课程中，你将使场景中的所有容器以及梯子都变得可爬。


    # 第七章：使用直线指针距离抓取物体


    在这一部分，你将重新回顾抓取机制，但这次你设置一个 `Distance Grabber`（距离抓取器）。这种 `Distance Grabber` 机制允许你从远处抓取物体，而无需物理上靠近物体来抓取。这是你在
    VR 中可以拥有的超能力，允许你在不进行任何物理交互的情况下影响物理物体。


    我个人在 VR FPS 项目中使用过距离抓取，在这些项目中玩家拥有了一个支持上臂动作的半身化身。在这种情况下，如果你作为玩家掉落武器，理想情况下你并不希望物理上弯腰去捡。你只需开启距离抓取机制并让武器移动到你手中即可。


    `VRTK` 为你提供了一个距离抓取指针，其形式为一个脉冲的准星，它在你指向可抓取物体时会显示。你还将学习如何限制抓取距离，以便你无法从例如 100 米外抓取物体，尽管如果你的游戏需要，你也可以这样做。在此过程中，你还将学习如何使用
    `Toggle Action`（切换动作）。


    # 视频课程：设置距离抓取器


    在本节课程中，你将设置 `VRTK` 提供的 `Distance Grabber`（距离抓取器）。这种距离抓取器的基本形式是一个脉冲的准星，当你指向一个交互物体时它会显示。


    # 视频课程：设置直线指针


    在测试时你会发现，如果你与想要抓取的物体有一定的距离，且物体不够大，很难精确地指向物体并让准星显示。为了解决这个问题，将设置一个直线指针，通过它更精确地指向物体并执行距离抓取。你还将设置念力移动，让被抓取的物体悬浮到手中。


    # 视频课程：通过按键激活和禁用距离抓取器


    在上一节课程中，你会注意到你的距离抓取器始终开启状态，准星一直显示。在本节课程中，你将通过 Oculus 控制器上的 `A` 按钮、Controller 上的
    `X` 按钮以及键盘上的空格键来切换距离抓取器。HTC Vive 没有 `A`、`B`、`X` 或 `Y` 按钮，你将使用触摸板来切换此指针的开启状态。


    # 第八章：VRTK 的空间 UI 与 Unity 的 UI


    用户界面是任何游戏的重要部分。它告知用户健康值、分数，并通过菜单和暂停屏幕帮助控制游戏流程。在非 VR 游戏中使用的 UI 被称为抬头显示（HUD），它位于屏幕顶部并向玩家显示信息。这种
    UI 被称为非叙事 UI（non-diegetic UI），意味着它在游戏世界不存在，但它直接关系玩家看到或交互的内容。


    不幸的是，这种非叙事 UI 在 VR 中效果不好，因为玩家无法专注于离眼睛太近的东西，随头部移动非常分散且不舒服。一种更直观的方法是在游戏环境中放置 UI。这可以通过使用
    Unity 的空间画布来实现。这种方法被称为空间 UI（Spatial UI）。在 `VRTK` 版本 4 中，你现在有能力通过交互器或指针创建 3D 用户界面。在这一部分，你将学习如何与游戏世界中的
    3D 空间按钮交互，使用空间指针或直接使用手。


    # 视频课程：设置直线指针


    在本节课程中，你将设置一个专门用于与空间按钮交互的直线指针。在这里设置的直线指针与距离抓取的设置不同。此外，将使用控制器上的不同按钮来激活此直线指针。正如你在设置距离抓取时注意到的，直线指针会从手掌发射出一条直线，直到达到最大长度，或者与有效游戏物体碰撞。当直线指针与有效游戏物体碰撞时，会发生选择动作，发射一个包含被碰撞物体数据的事件。你将使用它来创建一个可以与空间按钮交互的直线指针。


    # 视频课程：设置空间可点击按钮


    在本节课程中，你将设置一个 3D 空间可点击按钮，使用上一节课程中设置的空间指针进行点击。


    # 视频课程：设置空间按钮组


    在本节课程中，你将设置一个空间按钮组，将你的 3D 空间按钮组合。


    # 视频课程：更改空间按钮的外观


    你的空间按钮具有某些可以改变外观的样式属性。在本节课程中，你将使用这些样式属性来改变按钮的外观。


    # 视频课程：设置空间切换按钮


    在本节课程中，你将创建一个切换按钮，当你的直线空间指针悬停在切换按钮上时，按下触发键将激活切换按钮，随后的按下将禁用它。切换按钮在点击时，理想情况下会进入开启状态并保持该状态，直到再次被点击，此时它将进入关闭状态，反之亦然。


    # 视频课程：设置空间选项按钮


    选项按钮允许为玩家提供多个选项，其中这些选项之一可以处于激活状态。尝试激活任何其他选项都将确保组内当前激活的选项被禁用。选项按钮也被称为单选按钮（Radio
    buttons）。在本节课程中，你将创建一个新的空间按钮组，并填充一些选项按钮。


    # 视频课程：设置滑动块


    滑动块是一种控制控件，允许玩家通过沿着轨道移动旋钮从一系列值中进行选择。这允许你在预定义的范围内显示并利用一个数值。通过 `VRTK`，你可以通过使用交互物体以及限制的驱动轴轻松创建一个滑动块。在本节课程中，你将使用线性驱动创建一个滑动块控制，当你移动滑动块的旋钮时，使用工具提示显示滑动块的值。在本节课程中，你将学习如何使用线性关节驱动（linear
    joint drive）以及工具提示。


    # 视频课程：设置直线指针以使其与滑动块交互


    在上一节课程中，你看到了如何使用手与滑动块交互。在本节课程中，你将学习如何设置直线指针与滑动块交互。在此过程中，你还将设置规则，使得空间指针只有在指向它时处于激活状态。


    # 视频课程：使用手与 VRTK 的空间按钮交互


    在本节课程中，你将学习如何直接使用手与 3D 按钮交互。这为你提供了 VR 中的一种真实沉浸感，你不再需要指针来与之交互。


    # 第九章：旋转驱动与线性驱动


    在这一部分，你将学习 `VRTK` 提供的旋转驱动和线性驱动制体，并看到它们使用的几个示例。你将开始使用旋转驱动，创建一个方向盘、一个门和一个杠杆。然后你将继续使用线性驱动，你在创建滑动块时已经使用过它。然而，你将再次使用此线性驱动制体创建一个抽屉和一个推按按钮。旋转驱动和线性驱动都被称为可控机制，它们为你提供了基于物理和非物理的旋转及线性控制，可以用于各种物体。在构建游戏时，你将尽可能使用非物理的控制。


    # 视频课程：创建方向盘


    在本节课程中，你将创建一个汽车方向盘，你可以用手绕着它旋转。方向盘可以使用旋转驱动创建，它将绕中心点旋转。每当方向盘的值改变时，就可以触发一个事件，通知汽车轴发生变化。


    # 视频课程：创建门


    在本节课程中，你将创建一个门，它绕着门框上的给定合页点旋转，允许你模拟一个可以打开和关闭的门。对于这种设置，你将使用带 Unity 关节的旋转驱动制体。你还将学习设置一个不会超过关闭位置旋转的门，并设置使其能够从同一侧打开和关闭。


    # 视频课程：创建杠杆


    在本节课程中，你将创建一个杠杆，它绕着其轴线的给定合页点旋转。对于这种设置，你将使用带 Unity 关节的旋转驱动制体。杠杆的一个常见用途是用于变速箱。


    # 第十章：锁定区域（Snap Zones）


    在这一部分，你将创建锁定区域。锁定区域是一个可以放入物体的空间区域。通过锁定物体，你可以创建许多不同的行为。锁定物体的示例包括将轮放入汽车、将弹匣放入武器、将柄放入端口。VRTK
    为你提供了锁定区域制体来实现这种物体锁定。在本节课程中，你将创建几个工具架，你可以将其放入工具。你还将显示它们包含的工具名称，使用你在上一节中学到的工具提示。


    # 视频课程：导入工具架 Unity 包并设置工作工具


    在本节课程中，你将首先为工具架导入一个简单的 UI。它是使用 Unity 元素创建的。为了节省你的精力，我将其作为一个 Unity 包包含，你需要将其导入到项目中。


    # 视频课程：使锤子和斧头可交互


    在本节课程中，你将学习一种更快的方法让任何游戏物体可交互。你将使用 `Interactable Creator`（交互创建器）菜单使锤子和斧头可交互。


    # 视频课程：设置锁定区域


    在本节课程中，你将设置锁定区域，它们允许你将工具放入其中。你还将学习缩小锁定区域的大小以及它们的碰撞体。当物体被锁定到区域后，你还将学习如何控制物体的大小。


