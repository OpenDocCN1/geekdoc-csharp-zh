- fmt: "\n# VIDEO LECTURE: SETTING Up VRTK's Tracked Alias\n\nVRTK provides you with\
    \ a `Tracked Alias` prefab, which is a sort of generic camera rig, that can represent\
    \ any XR hardware. So, if you have an Oculus camera rig, or Steam VR camera Rig,\
    \ or a Simulator in your scene, they can all be hooked up to this tracked alias\
    \ and from then on, whatever you want done, you do against the `tracked alias`.\
    \ \n\nThis way, you don’t have to worry about what camera Rigs you have in your\
    \ scene, you simply activate the one you intend to use. This tracked alias, allows\
    \ you to track any active valid SDK camera rig, that has been listed within its\
    \ `Camera Rigs` list, without being explicitly tied to it. In this lecture, you\
    \ will learn how to setup your `tracked alias`.\n\n# VIDEO LECTURE: CONFIGURE\
    \ your Oculus OVR Camera Rig\n\nIn this lecture, you will configure a certain\
    \ important property on your `Oculus OVR Camera Rig`. You will then go on to test\
    \ your HMD of choice, by using an appropriate camera Rig from amongst the ones\
    \ you have setup.\n\nThe `Unity XR Camera Rig` is considered the universal camera\
    \ Rig that will work with any of your HMD’s. In addition, you could test movement\
    \ within your VR world, using the `Spatial Simulator` camera Rig, in conjunction\
    \ with your keyboard and mouse.\n\n# VIDEO LECTURE: THE Object State Switcher\
    \ - Manually switch between Camera Rigs in you Scene\n\nIn this lecture, you will\
    \ learn how to setup and use the `Object State Switcher` prefab, provided by VRTK\
    \ to easily switch between different camera Rigs within your scene. \n\nNote that,\
    \ the switching needs to be done on your computer and the object Switcher UI will\
    \ not show up in you HMD. You will note that the object state switcher is more\
    \ of a convenience utility, provided by VRTK and you do not actually need it,\
    \ as you can always achieve this switching amongst camera Rigs, by directly activating\
    \ and deactivating the required camera Rigs, within Unity’s hierarchy.\n\n[Unity®\
    \ VR Dev: No Coding Required](https://www.udemy.com/course/unity-vr-dev-no-coding-required/?referralCode=E729C6CA76CF04CF4E9F)\n\
    \n# CHAPTER FOUR Setting up Interactors, Velocity Trackers and your Virtual Hands\n\
    \nIN THIS SECTION , you will start off by setting up the default controller models\
    \ provided by VRTK, which are basically 2 cuboid objects, that represent your\
    \ hands. However, to increase immersion in virtual reality, you will go on to\
    \ replace these cuboid hands, with virtual animated hands.\n\nIn this section,\
    \ you will be introduced to VRTK’s `Input Controllers`. I will be discussing how\
    \ to set these up, for Oculus devices, HTC Vive, the X Box controller and the\
    \ keyboard. You will also note that the Oculus controllers and the HTC Vive controllers\
    \ are different in terms of the buttons, they physically comprise, but VRTK makes\
    \ setting them up easy.\n\n# VIDEO LECTURE: INTERACTOR verses Interactable\n\n\
    To get hands working in VR, you need to understand the concept of an `Interactor`\
    \ and an `Interactable`. \n\nAn `interactor` is something that can know, when\
    \ its touching another object, that can be interacted with. An `interable` on\
    \ the other hand, is a game object within the virtual world, with which the user\
    \ can interact. This lecture explains this fundamental concept, along with discussing\
    \ the 2 standard ways in which VRTK allows you to interact with an `interable`.\n\
    \n# VIDEO LECTURE: SETTING up your Interactors\n\nIn this lecture, you will learn\
    \ how to setup your `Interactors`, using VRTK’s provided prefab.\n\n# VIDEO LECTURE:\
    \ SETTING up Oculus Hands for Oculus Integration\n\nIn this lecture, you will\
    \ learn how to set up the Oculus provided hands, to work with the VRTK provided\
    \ Camera Rigs, `Oculus Integration` prefab. If you are building for the HTC Vive\
    \ only, a subsequent lecture will show you how to setup animated hands for this\
    \ Steam VR device, which uses the `Unity XR camera rig`.\n\n# VIDEO LECTURE: SETTING\
    \ up Custom Hands for Unity XR and the Spatial Simulator\n\nYour Oculus Hands,\
    \ finger animations will not work with the `Unity XR Camera Rig` or the `Spatial\
    \ Simulator`. As such your HTC Vive cannot use the Oculus provided hands. However,\
    \ this does not mean that we cannot have realistic hands and animations for our\
    \ HTC Vive and Spatial Simulator.\n\nAttached to the lecture, you will find a\
    \ Unity Package, named `Unity VR Hands`, that you need to download and import\
    \ into your project. This package will provide you with a custom hand, with animations\
    \ attached, that will be used with the `Spatial Simulator` and the `Unity XR Camera\
    \ Rig`, that drives your HTC Vive and its controllers. In this lecture you learn\
    \ to set up these new custom hands, which will even work with your Oculus devices,\
    \ if you are using the `Unity XR Camera Rig`.\n\n# VIDEO LECTURE: ANIMATING Custom\
    \ Hands based on keyboard and Controller input - Grabbing and Ungrabbing\n\nIn\
    \ this lecture, you learn to animate your custom hands, based on input that could\
    \ come from either your controllers, keyboard, mouse or even the X Box controller.\
    \ VRTK allows you to capture input, not only from your VR controllers, but also\
    \ input that may be received via an XBox controller, or key presses on the keyboard\
    \ and even the mouse.\n\nThe X Box controller, keyboard and mouse would ideally\
    \ be used when testing with the `Spatial Simulator`. As input can come from various\
    \ controller devices, you need a way to consolidate such input into a single object,\
    \ which can then be polled, by other objects. You will setup the `Grabbing` and\
    \ `Ungrabbing` mechanic here on all the above discussed, input devices. This lecture\
    \ that takes a deep dive into setting this up.\n\n# VIDEO LECTURE: ANIMATING Custom\
    \ Hands based on Controller input - Using the Thumbstick\n\nIn this lecture, you\
    \ will setup an animation for when your thumb stick is pressed. The procedure\
    \ is similar to what you saw when setting up an animation for a grab button press.\n\
    \n# VIDEO LECTURE: SETTING up your Interactors to Grab and Velocity Trackers\n\
    \nIn this lecture, you will learn how to setup your `Interactors` to `Grab` and\
    \ `Velocity Track``.\n\n you you you to to to to to to to to to to to to to to\
    \ to to to to.. the the the the the the to the the the to to the to the the the\
    \ to. the to to to to to to to to to to to to to the to the the to the the the\
    \ to the to to to to to to... to.... to the the............ the is to to to to\
    \ to to to.... In this,, you will learn to set up,, to to to your hands.\n\n#\
    \ CHAPTER FIVE Setting up Interactable Objects\n\nSO FAR YOU’VE learnt the basics\
