    # 课程描述


    欢迎来到首个“无需编程”的 VR 开发课程，本课程将将使用 `VRTK 4`。本课程采用实战和项目导向的教学方法，涵盖了使用 `Unity` 和 `VRTK
    4` 进行虚拟现实开发的细节。你将学习如何构建一个完整的 VR 框架，该框架可以在 `Oculus Rift`、`Quest` 和 `HTC Vive` 等现代设备上体验。


    在课程结束时，你将完全有能力结合 `Unity` 使用 `VRTK 4` 来开发丰富的交互式虚拟现实体验。在开发 VR 应用程序和游戏方面，`Unity`
    是顶级的游戏引擎。而 `VRTK` 则是专为 `Unity` 设计的经过实践检验的 VR 解决方案。许多大片级游戏都是使用 `Unity` 和 `VRTK
    3.x` 制作的。


    `VRTK 4` 结合 `Unity` 改变了 VR 开发的动态。没有其他游戏引擎在为 VR 开发提供如此先进的功能方面，能及 `VRTK 4` 配合 `Unity`。


    从工具箱的角度来看，市面上有很多免费和付费的 VR 开发工具箱，包括 `Unity` 自带的 `XR interaction toolkit`。然而，这些工具箱中没有一个能提供像
    `VRTK 4` 那样开箱即用的高级功能。目前还没有任何工具箱可以让你在无需编写单行代码的情况下，创建出如此先进的 VR 机制。


    在课程中，你甚至不需要启动一次 `Visual Studio`。不需要任何编程技能！通过使用 `Unity` 和 `VRTK 4`，你将从零开始构建一个完整的框架，该框架可以作为构建任何
    VR 游戏或体验的基础。在课程结束时，你将利用你构建的框架来创建你自己的自己的迷你游戏。


    这门课程让理解 `VRTK 4` 变得超级简单，你开发的框架将是一个巨大的、凝聚的、精简高效的机器。课程结束时，你将拥有一个先进的 VR 框架，你甚至可以发布它！你甚至可以使用课程中提供的想法进一步增强迷你游戏，并将你的游戏发布到
    `Oculus` 和 `Steam`。


    ## 本课程适合的人群


    本课程面向初级到中级的 `Unity` 用户，他们需要熟悉 `Unity` 编辑器，用于基础场景编辑、通用编程逻辑、对 `Unity` 预制（prefabs）的基本理解以及关于事件（Events）如何工作的一些基础知识。你不需要知道如何编写任何事件代码。本课程将带你逐步完成每一个步骤，并为你提供大量的练习。


    ## 课程先决条件


    你需要一个支持 `Steam VR` 仅 `Oculus` 的 `6 DOF`（六自由度）头显设备。本课程无法使用 `3 DOF` 头显设备学习，因为你需要在你的
    VR 世界中移动。你可以使用 `Steam VR` 头显设备，如 `HTC Vive`、`Oculus Rift` 或 `Oculus Quest`（1 代和
    2 代均可正常工作），这些是目前流行的 `6 DOF` 头显设备，也是本课程经过测试的设备。


    你需要一台在硬件要求上支持你 VR 头显设备的电脑。如果使用 `Oculus Quest`，建议配备一根 `link cable`，因为每次测试都将构建版本部署到头显上并不实用，非常耗时。


    ## 课程交付模式


    本课程包含超过 11 小时的视频内容，跨越 74 节课程，大约相当于 400 页书面内容。交付模式基于视频，因为随着 `VRTK 4` 的演进，包含新内容会容易得多。


    点击下方链接预览课程。

    [Unity® VR Dev: No Coding Required](https://www.udemy.com/course/unity-vr-dev-no-coding-required/?referralCode=E729C6CA76CF04CF4E9F)


    此外，我敦促你查看每个用于预览的介绍性课程，这些课程将让你感受到本课程涵盖的深度。


    # 第二章：为 VR 开发设置你的设备


    在本节中，你将为虚拟现实准备好一切工作，并学习由 `Extend Reality Ltd` 开发的第 4 版本虚拟现实工具包 `VRTK`。`VRTK` 是免费提供的，并根据
    `MIT license` 授权。


    ### 视频课程：在 VR 开发中使用 VRTK 4 相比其他 SDK 的优势


    `VRTK` 并不是开始虚拟现实开发的唯一解决方案。`Unity`、`Oculus` 和 `Steam VR` 为 VR 开发提供了各自的 `SDKs`。你也可以从资产商店购买资产，以获得所需的
    VR 特定功能。


    `Unity` 的 `XR Interaction Toolkit` 是一种基于高级组件的交互系统，用于创建 VR 体验，并最终将整合各种平台。而 `Oculus`
    和 `Steam VR` 则为其各自的平台提供 `SDKs`。


    `VRTK` 最大优势在于它提供了一个简单且可扩展的框架，可以在多个平台上运行。它同时是免费且开源的。`VRTK` 整体是一个虚拟现实开发工具包，为虚拟现实中的核心组件（如移动、与
    3D 对象交互等）提供了内置的广泛支持。


    这减少了你为了开始 VR 开发而编写的代码量，因为 `VRTK` 为你完成了所有繁重工作。现在你可以专注于开发游戏或应用程序，而无需担心输入管理、控制器、移动方法、攀爬和抓取机制、UI
    交互等基础功能。


    ### 视频课程：设置 Oculus 和 Unity SDK


    本课程 `VRTK` 第 4 唯一要求是使用 `Unity 2019.20` 和 `Windows 10` 或更高版本。然而，我强烈建议你坚持使用 `Unity
    2019.4.`，这是本课程创建的版本。如果你想使用比 `Unity 2019.4.` 更新的版本，你仍然需要留在 `Unity` 的 `2019.4.xx`
    LTS 版本。本课程不支持 `Unity 2020` 或 `2021`。


    你还需要遵循 `Oculus Integration` 的基本系统要求。如果你有任何疑问，Oculus 提供了一个系统工具来检查你的电脑是否准备好支持 VR。`Steam
    VR` 也提供了类似的工具。


    在本节课程中，你将创建一个新项目，并下载导入作为本课程附件的 `VRTK Playground` Unity 包。这是提供给你的一个启动包，你将在此基础上构建，为你的
    VR 框架创建先进的 VR 机制。你还将安装必要的 VR `SDKs`。


    ### 视频课程：导入 VRTK 4 包


    到目前为止，你已经为 VR 开发准备好了项目。在本节中，你将把 `VRTK 4` 引入你的项目。`VRTK 4` 由多个 `TILIA` 包组成，这些包为空间解决方案的开发提供了有用的功能。`VRTK
    4` 的美之处在于，你可以只安装你认为你的项目需要的包。你并不被强制安装每一个包，尽管你可以这样做。


    '
