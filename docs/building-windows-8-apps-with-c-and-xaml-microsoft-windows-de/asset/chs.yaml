  \ Windows 8。\n\n插入你的 Windows 8 DVD 或 USB 驱动并重启（执行此操作的说明在“完全安装”章节中）。安装时选择`自定义`选项。在提示时，选择你创建的卷。你会识别出该卷，因为它应该显示你指定的大小并被标记为主主分区。务必选择正确的卷；在此处出错可能会导致覆盖你现有的系统。\n\
  \n按照“完全安装”章节指定的步骤执行安装过程。当系统重启时，你将看到一个新菜单。与你可能在 Windows 7 中习惯文本菜单不同，Windows 8 的启动菜单是图形化的；具有\
  \ Windows 8 用户界面；并且支持鼠标、键盘和触摸屏操作。你将获得启动到旧的 Windows 7 操作系统或新的 Windows 8 系统的选项。显然，你会选择新的操作系统——Windows\
  \ 8——在体验了极快的启动速度后，你就可以准备好设置开发环境并投入你的第一个应用程序了。\n\n### 虚拟机安装\n\n你可能还希望在虚拟机上安装 Windows\
  \ 8。你使用的步骤取决于你决定使用的虚拟机。有多种选项可用。一种流行的、免费的开源解决方案是 VirtualBox。你可以从网站 [`www.virtualbox.org/`](http://www.virtualbox.org/)\
  \ 下载 VirtualBox。你需要准备好可安装在虚拟机上的安装媒体。某些解决方案可以直接挂载 ISO 镜像以使过程更简单。\n\n### Visual Studio\
  \ 2012\n\nVisual Studio 是微软用于构建软件的开发环境，是你将用于设计 Windows 8 应用程序的工具。通过下载随 Blend Express\
  \ 版的 Visual Studio Express 版可以免费开发 Windows 8 应用程序。其他版本提供了从测试模块到体系设计工具的附加功能。本书将主要关注免费版中提供的功能。涵盖的一些功能可能需要付费版。以下是不同级别之间的简要列表：\n\
  \n- `Test Professional`：此版本为业务分析师和测试人员设计，包含团队协作功能、若干测试功能以及实验室管理。\n- `Professional`：这是为开发人员提供的入门版本，包含了调试、代码分析、单元测试、平台支持和集成开发工具。\n\
  - `Premium`：高级版结合了 `Test Professional` 和 `Professional` 版本的功能，并增加了代码指标、代码覆盖率、代码\
  \ UI 测试、UML 图、迭代规划和列表管理、代码审查以及故事板。\n- `Ultimate`：这是最全面的版本，包含了其他版本的所有功能，并添加了 IntelliTrace（历史调试）、负载测试、Microsoft\
  \ Fakes（用于单元测试桩和模拟的框架）、高级架构工具以及功能包。\n\n#### Blend\n\nExpression Blend 是一种曾用于 Silverlight、WPF\
  \ 和 Windows Phone 应用的设计工具。它已扩展到支持基于 XAML 和 HTML 的 Windows 8 应用程序。Blend 是一款强大的工具，为内容提供复杂的预览，支持设计时数据以可视化页面，并可以通过拖放方式在设计表面放置控件和\
  \ UI 行为。\n\n许多 Blend 功能已集成到 Visual Studio 2012 的设计器中。之前的 Visual Studio 2010 使用了代号为“Cider”的不同\
  \ XAML 设计工具，没有提供 Blend 那样丰富的功能。Blend 引擎提供了更多功能，熟悉以前版本的开发者会在设计器中如鱼得水。\n\n### Hello\
  \ Windows 8\n\n在本节中，你将构建第一个 Windows Store 应用程序。该应用程序的目标是向你展示如何用极少的代码实现相当高级的功能。该应用程序支持使用摄像头拍照，然后将其保存到图片库、社交网站或云存储中。它还支持接收来自其他应用程序的图像进行预览和保存。\n\
  \n\n\n\n构建并运行应用程序后，你将探究在 Windows 8 操作系统中发生了什么以支持该应用。你将了解一款 Windows 8 应用的三个阶段：安装或部署、点击启动以及运行应用。最后，我将演示如何使用名为\
  \ `ILDASM`（一种代码反汇编器）的工具来展示 WinRT 如何采用与 .NET 相同的元数据标准公开有关你的应用程序的信息。\n\n##  创建第一个\
