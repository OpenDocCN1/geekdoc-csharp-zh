  \ `async` 关键字。在该方法内部，你可以调用其他异步方法来启动长时间运行的任务。标记有 `async` 关键字的方法可以有三种返回值之一。\n\nWindows\
  \ Runtime 中的所有 `async__ 操作都返回四个接口中的一个（译注：原文这里的“four”可能是个笔误），具体实现哪个接口取决于该操作是否向调用者返回结果以及它是否支持进度追踪。表\
