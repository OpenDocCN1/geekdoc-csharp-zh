  分组的一个重要规则是它们必须相互正交。尽管一个控件可以存在于多个状态（每个组恰好有一个状态），但这些组所影响的视觉方面不应重叠。由于你可以在给定状态下创建任意想看的展示板，因此这一规则无法由控件契约强制执行。然而，不遵守此规则可能会导致意外结果。\n\
  \n### 分组与状态\n\n分组是相关互斥状态的容器。什么是`state`？一个`state`既有逻辑定义也有物理定义：在逻辑上它表示控件的某个互斥状态；在物理上它是代表该状态的视觉元素和属性集合的关键在于这些*允许你将控制在特定状态下外观的细节与实际解除耦合。\n\
