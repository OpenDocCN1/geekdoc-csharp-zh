  关于 Windows 8 的首批传言浮现在 2011 年初。随着开发者开始猜测新平台会是什么样子，互联网上谣言四起。这些传闻包括一个不支持.NET Framework\
  \ 的新平台，完全基于 C++或 HTML5 与 JavaScript 构建，且无法运行任何现有软件。早期版本和截图通过 Twitter 泄露出来，但这只是进一步助长了各种猜测。最终在\
  \ 2011 年 9 月 13 日，微软 Windows 部门总裁史蒂文·辛诺夫斯基登台亮相并发布了 Windows 8 的早期预览版。\n\n我是最早一批热切下载该预览版的程序员之一并在虚拟机中安装了它。很快我就意识到\
  \ .NET Framework 依然健在——我可以在新平台上运行现有的 Silverlight 应用程序；而且`C#`和`XAML”是可用于构建新型“Metro\
  \ 风格”（此名称随 Windows RTM 版改为了 **Windows Store 应用**）应用的开发工具)。我未能亲赴加州举办的 //BUILD 大会现场观看其发布动态,但相关主题演讲录像几乎在现场结束后就同步上线了;无论早晚还是乘机途中我都抓紧时间观摩学习。）\n\
  \nWin-dows 八代操作系统引入了全新的框架体系-Windows 运行时(Run-Time)，通过它为过往不具备的能力提供了支撑且在机器设备层面实现了突破创新:短短几天之内我就着手搭建起了原型程序并发觉原先使用\
