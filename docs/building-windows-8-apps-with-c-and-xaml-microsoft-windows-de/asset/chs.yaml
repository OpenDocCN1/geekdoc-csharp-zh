  \ LevelUP！！！\n####　手势与形变综合工程 [...\n\n\n\n操控是指涉及一根或多根手指的触摸事件。它从首次接触开始，到最后一次接触释放时结束。点击是一种简单的操控形式，包括触碰、极短的保持和释放。平移则更为复杂，因为它包含触碰、沿平移方向拖动或移动以及最后的释放过程。捏合与缩放则是更复杂的操作，它们响应多个触点之间距离的变化。\n\
  \n操控必须考虑惯性因素。为了使触控体验直观自然，应纳入用户交互的速度参数例如缓慢滑动是精确浏览列表的方式；若用户快速滑动则需要让列表在离开屏幕后仍能继续滚动就像旋转飞轮一样具备**动量效应**这样比喻可能不太准确但大致意思如此：惯性能让用户在抬起手指后依然保持滚动状态）\n\
  \n由于短时间内会产生大量数据默认情况下操纵功能未被启用若要允许控件追踪多指操作需设置`ManipulationMode`属性此处示例中将名为‘TouchGrid’的网格元素设为全部模式（All）。可用值由枚举类型定义具体含义参见表\
  \ 4.3\n\n### 表 4.3 ManipulationModes 取值说明  \n\n![图片](img/04tab03.jpg)\n\n轨道模式是一种优化措施旨在改善多点方向的触屏体验当水平/垂直拖拽时会自动锁定当前轴向避免产生偏移感即只要手指保持在预设范围内系统仅响应单一轴向动作超出范围才按实际路径处理更多信息请参考在线指南：[`msdn.microsoft.com/en-us/library/windows/apps/hh465310.aspx`](http://msdn.microsoft.com/en-us/library/windows/apps/hh465310.aspx)。\n\
