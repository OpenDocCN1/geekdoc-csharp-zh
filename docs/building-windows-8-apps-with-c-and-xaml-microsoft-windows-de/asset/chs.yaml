  \  \n\n####  准备提交应用的关键要求  \n发布前必须理解认证标准上文列举的资源编号共有七条基本条件适用于所有程序六条核心原生 Metro 风格总结如下\
  \ ：  \n\n#####    体现价值   \n交付一套功能完备的产品不得包含占位符或“正在开发中的组件”。试玩版必须在合理限度内接近最终正式版的形态若因时长受限等功能缺陷无法满足审核标准极有可能遭到拒绝\
  \   \n\n#####     超越纯广告与网址用途     \n除了推广材料磁贴名称描述通知栏等元素之外还应向用户提供附加价值不能单纯用作宣传渠道确保用户体验始终保持在应内部而非被引导跳转至外部位置\
  \    \n\n-     行为可预测性   \n在整个生命周期服从锁定方向 Snap 视图挂起终止模式的正确编码要避免冻结网络丢失资源更新时应增强稳定性绝不能降低现有功能性仅可使用经由\
  \ WinRT 保证兼容性的 API 元件\n    \n#####       掌控客户互动    \n务必基于征求同意做出决策而并非隐藏操作违反隐私政策必备监管合规尊重透明运营原则遵循最新公布的人工智能人机交互指导方针否则会导致审批受阻并在潜在顾客群体间积累负面声誉进而影响未来版本的发行机会因此严格遵守上述准则将最大化通关概率并实现低摩擦快速迭代审查循环期\n\
  \        \n\n\n\n\n应用程序应遵循所有相关准则，在告知用户使用诸如`Location API`等功能时提供通知，并允许他们关闭这些通知。若您收集个人信息，则必须提供一份隐私政策清晰说明您的意图并遵守所有适用法律。如果打算共享个人信息，您必须让用户主动选择加入并提供明确同意。您的应用程序不应具有恶意性，也不得指导用户执行可能损害其设备的操作。\n\
  \n## 面向全球受众\n\n您的应用不得包含成人内容。与应用相关的元数据应对所有年龄段均适宜。任何内容或元数据能获得的最高分级为 Windows Store\
  \ 12+（即适合 12 岁及以上消费者的内容）。此外,应用中不应含有宣扬歧视、仇恨或暴力的内容；既不能美化非法活动,也不能包含淫秽材料(由法律定义)。您可以访问之前提供的网址在线查看完整列表。\n\
  \n## 易于识别与理解\n\n需要具备清晰的唯一标识符以及恰当的分级——同时还需技术支持！另外提交更新时至少要列出一个地理市场并按本地化语言要求进行适配;通过截图描述更改内容是下一节将讲解的提交流程前提步骤。\n\
