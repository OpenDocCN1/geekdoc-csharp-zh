  \ Windows 键的平板电脑图形界面。右侧的一组图标提供多种功能：从上到下依次是：\n\n1. **鼠标模式**——将指针用作普通鼠标。\n2. **触控仿真**——将指针作为触控平面使用，单击鼠标按钮可模拟点击操作。\n\
  3. **双指缩放仿真**——用于测试捏合与缩放手势。只需按住鼠标左键并滚动滚轮即可放大或缩小（在`Mouse Mode`下同样可以通过按住 `Ctrl` 键后滚动滚轮实现相同效果）。\n\
  4. **旋转仿真**——此模式用于模拟触控旋转操作：按住左键同时向任意方向滚动滚轮即可实现角度调整。\n5. **顺时针旋转 90 度** ——模拟平板在竖屏和横屏模式间的切换\n\
