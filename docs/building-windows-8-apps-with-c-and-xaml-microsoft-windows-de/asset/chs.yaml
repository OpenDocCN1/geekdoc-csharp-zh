  \ 有助于构建更易于测试且更可能跨多个平台目标共享的类。\n\n在之前的应用版本中， `StorageUtility` 是一个用于读写应用程序本地缓存的静态类。\
  \ `BlogDataSource`  控制了访问 `StorageUtility` 。从某种意义上说,它承担了一个额外的职责：与该类的静态方法进行交互。虽然这是一种直接访问存储的方式,但它也导致了数据源与存储实现之间的强耦合关系.这阻止了在不同环境下复用该核心业务组件——例如它在\
  \ Windows8 以外的平台上无法使用；同时也使得对该组件的单元测试变得困难重重(因为任何一次有效执行都依赖于预先准备就绪的具体环境).\n\n在 PortableWintellog\
  \ 项目中,**控制已经发生倒置**.简单地说,BlogDataSource 现在是通过一个名为 IStorageUtility 所定义的对外公开签名但对内部封装隐藏各种可能设计方案的标准文件系统服务者所提供的功能约定集合来协作完成同样效果达到最终目的所以在这里我们可以清晰地看到原来被硬编码写死在某个库里那些底层读取写入之类任务现在已经完全交给具有统一形态的方法声明但这个抽象层次并不强行规定采用何种物理介质去履行义务这样自然令原先那个掌控全局助理现在变得更灵活并且更加松松散散地与之配合运作该方法有很多好处$^\\\
