  \n`ExtendedSplashScreen` 控件会保留对原始启动屏幕的引用。它包含所显示图像的副本，并使用系统提供的启动屏幕中的位置来对齐图像。该图像将出现在完全相同的位置，从而从启动屏幕图像无缝过渡到扩展后的自定义启动画面。\n\
  \n当此控件加载后，它会调用其数据源的初始化方法（ `Initialize()` ）并异步等待项目加载完成。一旦所有项目都加载完毕，它将自身替换为用于导航的空框架\
  \ (`Frame`)对象,随后程序跳转到第一页内容——通常位于应用代码文件 (比如 `App.xaml.cs`)中指定的初始起始位置.这些逻辑原本都在应用程序的“Code\
  \ Behind”部分里实现(典型文件名是 App.xaml.cs).但现在它们被移到了不同的组件上 —— 也就是我们新引入的元素：“The Splash Screen”。通过这种方式我们可以延迟一切操作直到整个数据集完全装载且没有超时等风险导致的意外中断为止...\n\
  \n为了告知用户后台正在进行的处理工作,在静态 Logo 区域的正下方还会出现一个半透明的旋转圆形指示器(“ProgressRing”).看看启用调试模式时进度环的行为吧\
