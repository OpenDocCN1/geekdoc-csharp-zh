  \n\n\n\n\n还可以使用**非对称密钥**进行加密和解密。`AsymmetricKeyAlgorithmProvider` 用于生成非对称密钥。非对称加密使用两种不同的密钥——公钥和私钥来执行加解密操作。\n\
  \n这种方式允许你用自己的私有秘密对数据进行加密，同时提供一个供他人解密的公钥；它使得第三方能够解密数据，而你的机密信息依然安全。\n\n你可以通过以下链接在线了解更多关于非对称密钥的信息并查看示例代码：[`msdn.microsoft.com/en-us/library/windows/apps/windows.security.cryptography.core.asymmetrickeyalgorithmprovider.openalgorithm.aspx`](http://msdn.microsoft.com/en-us/library/windows/apps/windows.security.cryptography.core.asymmetrickeyalgorithmprovider.openalgorithm.aspx)\n\
  \n用于签名的数据所对应的*签名用键（即 keys）*可以使用 `MacAlgorithmProvider` 类生成 。此类代表消息验证码（MAC）。你可以选择多种流行的算法之一创建该\
  \ key ，包括：MD5、SHA  以及基于密码的 MAC (CMAC)。这个 Key  的生成方式与前面提到的加密 Key 几乎相同 。\n\n在示例项目中，一个默认口令被用来为签名测试案例下的哈希对象调用作出最终参考：\n\
  \n```\nvar provider = MacAlgorithmProvider.OpenAlgorithm(\"HMAC_SHA256\");\nvar\
  \ key = provider.CreateKey(\n    AsBuffer(MakeBigPassword(PASSWORD1)));\n```\n\n\
