  \ NGWS 两千年底发布 Beta ,正式命名为 Net première 真名叫 Managed Code.\n\n\n\n\n构建应用程序的传统方法被称为非托管方式，因为它会直接编译为目标机器可读的原生指令。尽管这有多项优势，但也迫使开发者必须在非常接近底层内核的级别上理解主机系统。开发者必须学习如何直接分配内存以及如何在不再使用时释放内存。例如绘制图形这类任务需要了解显示驱动程序以及如何将像素渲染到用于生成屏幕显示画面的内部缓冲区中。\n\
  \n`.NET Framework` 向 Windows 平台引入了托管代码。这种代码之所以称为“托管的”，是因为引入了一个名为 `Common Language\
  \ Runtime`（`CLR`）的新层。该运行时能为开发者管理内存、提供与各类库和资源交互的一致性方式，并确保更安全的代码执行环境。（此外），运行时所提供的语言中立层的编码体系\
  \ -  被称作 `Microsoft Intermediate Language (IL)` /简写为 MSIL] ———-以程序汇编为核心处理流程：所有高级编程语言的源码最终均在转化为这份统一表示之后进行解释成为相应具体目标系统的的执行原语对象集.\
  \  \n\n实际上早在 `.NET Framework ──还尚未出世之前──整个关于此话题内涉及其各个因素已经存在了许多年头期间里历经演变乃至变化无常不重复同一个过程\
