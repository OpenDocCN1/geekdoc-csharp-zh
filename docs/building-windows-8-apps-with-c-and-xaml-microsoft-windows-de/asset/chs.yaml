  \n\n\n\n用户总会有一些完全出乎意料的方式与应用程序交互，从而导致错误。作为开发者，我们有责任处理这些情况。这不仅仅是在代码中捕获和记录错误，还包括与设计团队合作提供一个清晰的用户界面，明确说明软件的意图和使用方法。这是一门精巧的艺术——正如一位有远见的董事长喜欢告诉我的那样：“创造简单的假象需要大量的技术。”\n\
  \n特定单元或模块的规范通常只关注应该发生的事情和一些简单的数据验证流程中的每一步都会引入关于布局、适当的验证规则、业务逻辑以及校验方式的假设测试由非技术人员组成且能代表真实系统用户的团队进行有助于在早期消除这些假设从而交付更高质量的产品。\n\
  \n# 从源头消灭 Bug\n\n如果有人请你帮忙找一块五年前丢失的手表你会如何着手？想象一下期间有多少人可能经过同一个地点风暴可能会让它移位新建工程可能在它数月以来所在的位置上铺设柏油将其掩埋在泥层之下如果这个人只是在手表丢失的五分钟后向你求助你对自己成功找到它的把握可能就大得多了。\n\
  \nBug 越接近其根源被修复就越容易当你将某个 bug 隔离到特定的组件内部时你能看到该组件的全貌更容易理解发现这个 bug 的情境并采取措施解决问题而那些因复杂模块跨第三方边界交互而产生的\
  \ Bug 则追踪起来要困难得多在生产环境中发现的 Bug 往往最令人沮丧因为即便不是不可能你也很难获取必要的取证证据来正确排查问题.\n\n测试有助于在软件开发生命周期的早期阶段发现缺陷你在开发过程中越早定位\
  \ bug 就越容易修复它`Unit tests`确保组件在其局部按预期行为工作集成（Integration）测试保证尽管底层代码和 API 在不断变更但各模块间仍能正常协作编码后的\
  \ UI（Coded UI ）tests 可用来检验界面的功能并帮助标记出应用流程上的破坏性变化通常是修改业务逻辑及校验规则的副作用之一\n\n**为文档提供辅助性的源代码**\n\
  \n我最喜欢的开源项目都附带了数千行精心编写的单测很长一段时间这是我觉得最简单快捷的学习如何使用一款第三方 API 的方法手册也许不错但是真正提供了示例多处调用的方式更重要地是那些导致错误的预期条件则是通过一个具体实例展现出来的我曾多次遇到这种情况：我发现了一种使用某组件文档内并未提及然而却已在对应用例中被考虑过的用法具备充足覆盖率的优秀单测能够很好地为源代码做出诠释并使后续维护人员消费和维护扩展基码库变得更为轻松它们揭示了项目的广度和深度展示了各种不同的\
  \ api 调用方式是搞明白会的预期的异常及其处理方法当你要对一个已有的程序基地做扩增之时恰到好处的基线也能给你构造额外 case 时的模板指引方向同样核验也需要遵循某种固定脚本其中蕴含着对整个系统的认知以及对运行状态的预判评估而这类需求规划方案常常会在启动之初就被撰写出作为一个亦乐于接受事后我始终偏爱清晰详尽的具体例子因为它为我提供了一个衡量成果的标准口头故事固然可以驱动实现但它背后所涉及到的一组确切场景清单更能帮我准确领会想要达成的商业上下文含义这让延伸更加简便这点与前文所述是一脉相承至今我还清晰地记得工程师涯初期被迫开始编写的时候当时我并不怎么看重价值和意义只好咬紧牙关一条接条边抱怨这些都是“应付差事”拖慢了进度幸运的是虽然有些写法拙劣但在我们架构师的指导下大部分还是发挥了作用直到有一天我被要求重构系统中的其中一个接口模型那可是涉及大规模的改动！往以前这种操作如同在一片漆黑的环境里面强行敲完所有替换内容然后屏住呼吸祈祷最终版本编译通过了再紧接着捏着一手心冷汗去走查结果上线后那个从未想过的问题突如期然地爆发带来了凌晨惊心的技术支持电话而今有了稳妥的保护一切全然不同我可以先小心翼翼地调整部分定义跑一遍立马就知道受到牵连的地方究竟是哪里不再对着硕大的整体一头雾水只能望洋兴叹靠猜测来判断何处发生了灾难相反我只管聚焦在这些小颗粒度的回馈里寻找让每条绿起需要的改进措施这样的迭代既精确又省钱不仅缩短一半的重构工时而且之广泛投入生产环境也远比从前可靠稳定出去设计与改良进步写作倒逼着我们深入思考每个部件到底是怎么构筑又是怎样彼此装配带了一个直接积极的外溢效用同时也令整个结构和诞生格局受益良多人亲眼见证当我们一支庞大的队伍从松垮随性的随即涂鸦规范化包含扎实构建件的进程转入之后带来的转变大家常匆忙拼凑类和等到最后才发现根本不对路不得不返工所以通过在链路上提前显现难题窗口则可以促使它们在融入别前足够完美成熟经得出外界考验早年我就撞过南墙那时候一心只想搭建庞大复杂的直接就沉浸于日夜狂模式的马拉松后来洋洋洒洒挥出了上千行的渣成品唯一不对劲的就是一合闸总会冒出那么几处细小的的死角每每都要费半天劲才能揪出来甚至修花掉更多光阴尝甜头我在面临类似难度挑战时候会将庞然大物分解成一个个相对简单微小元件专心致志做好此块细节构思施工再到彻底完成后才转战下一个看似前期搭积木花费稍多可是屡次索引式堆叠极其顺畅快速完工整体瑕疵率显著下降因而节约了长远周期的时间总和变成更好的程序员好的到了这里我对该项议题也算得上是深有体会比起漫无目的地跳进黑暗打一场毫无准备的硬仗不如事先检查自己的基本配置这样做本质上就是在帮你把武道提升一个档次。\n\
  \n\n\n# 测试对代码质量产生的相同效果，我认为对开发者也有积极影响。\n\n这是个人经验的又一观察结果。那些在项目初期抱怨编写测试概念的开发者，往往后来会兴奋地分享他们的模块并展示验证功能的测试。花费额外时间思考组件和编写测试行为本身就会彻底改变你的软件设计方法。常见的模式被快速、轻松地发现后很容易应用到其他适用该解决方案的领域；而错误处理、API\
  \ 定义以及算法内部组织的方法也会根据这些单元测试套件自身的正面反馈不断演变！\n\n## 结论：请务必编写单元测试\n\n希望你现在已经意识到恰当的**真正重要性！甚至有些读者可能会惊讶于自己讨论如此基础的话题——毕竟许多团队已将之视为标准流程的一部分与全部包\
