  trans: "\n\n`Spawn Actor From Class` 节点类似于 Java 及其他语言中的 `new` 关键字。通过“Class”字样下方的下拉框选择要实例化的类。`Spawn\
    \ Transform` 取决于具体的场景。为了简单起见，我们只需右键点击 `Spawn Transform` 并选择“Promote to Variable”（提升为变量）。如果没有\
    \ `Spawn Transform`，蓝图将带错误编译。在所需的 Actor 实例化后，我们设置（或“初始化”）我们的 `hotelBuilder` 变量。\n\
    \n这种相同的基本思想也适用于 `Set engineer` 折叠图表（collapsed graph）。然而，`Architectural Engineer`\
    \ 需要将一个 `LodgingBuilder` 传递其构造函数，正如这行代码所示：\n\n```\nArchitecturalEngineer engineer\
    \ = new ArchitecturalEngineer(hotelBuilder);\n```\n\n稍后，我们不会对每个实例化活动都进行如此细节。请相信，有许多、许多实例化\
    \ Actor 的需求，讨论每一个细节将变成一项枯燥的练习。\n\n`Builder_Main` 蓝图继续执行 `Construct Lodging` 函数调用节点。该函数被调用在我们之前实例化的\
    \ `engineer` 上。等效的代码行：\n\n```\nengineer.constructLodging();\n```\n\n注意 `Builder_Main`\
    \ 中的 `Sequence` 节点。`Sequence 0` 在 `Construct Lodging` 函数调用执行后完成。然后 `Sequence 1`\
    \ 开始执行。`Set lodging` 折叠图表：\n\n![图形用户界面，应用描述自动生成](img/Image00007.jpg)\n\n现在，我们等效地执行了这行代码：\n\
    \n```\nLodging lodging = engineer.getLodging();\n```\n\n这是 `Builder` 类中的最后一行代码。然而，我们需要进行一些验证检查，并确保我们确实建造了一个酒店。我们想要确保\
    \ `lodging` Actor 实现了 `FloorPlan` 接口。`lodging isFloorPlan_int` 折叠图表：\n\n![计算机截图描述自动生成，置信度低](img/Image00008.jpg)\n\
    \n今后，我们将不再显示此接口检查折叠图表。注意，此检查的折叠图表始终带有黄色调。折叠节点内部唯一变化的项是我们要检查对象的**接口。目标接口始终是折叠图表名称的一部分。\n\
    \n`Builder_Main` 蓝图以一个打印字符串结束执行，让我们知道酒店是否实际建造成功。如果在任何蓝图的某处发生逻辑错误，将打印“Failed to\
    \ Build a Hotel”（建造失败）。\n\n现在我们可以讨论在此模式中使用的接口了。首先，我们创建一个楼层计划接口供所有住宿场所实现。美国大多数商业住宿场所包含游泳池、大堂区、房间和餐厅。我们还创建了一个住宿构建器接口，供我们特定的住宿构建器类实现。`FloorPlan`\
    \ 接口：\n\n```\ninterface FloorPlan {\n    public void setSwimmingPool(String swimmingPool);\n\
    \    public void setLobbyArea(String lobbyArea);\n    public void setRooms(String\
    \ rooms);\n    public void setRestaurants(String restaurants);\n}\n```\n\n等效的蓝图接口非常平淡。以下是代表\
    \ `FloorPlan` 接口中函数的节点。\n\n![图形用户界面，应用描述自动生成](img/Image00009.jpg) ![图形用户界面，应用描述自动生成](img/Image00010.jpg)\
    \ ![图形用户界面，应用描述自动生成](img/Image00011.jpg) ![图形用户界面，应用描述自动生成](img/Image00012.jpg)\n\
    \n俗话说：“面向接口编程，而不是面向实现”（Gamma et.al, 1995）。事实上，它是面向对象设计的核心原则。面向接口编程的主要优点是减少了子系统之间的实现依赖（Gamma\
    \ et.al, 1995）。我们在构建器模式（Builder Pattern）示例中亲眼看到了这一点。具体来说，构建模式试图将复杂对象的构建与其实际表示解耦（Gamma\
    \ et.al, 1995）。\n\n```\ninterface LodgingBuilder {\n    public void buildSwimmingPool();\n\
    \    public void buildLobbyArea();\n    public void buildRooms();\n    public\
    \ void buildRestaurants();\n    public Lodging getLodging();\n}\n```\n\n`LodgingBuilder`\
    \ 接口蓝图的截图与 `FloorPlan` 接口蓝图采用相同的设计，因此为了简洁起见已将其移除。今后，除非认为有助于加深读者的理解，否则将尽可能少显示接口蓝图图像。\n\
    \n接下来，我们创建实现 `FloorPlan` 接口的 `Lodging` 类。\n\n```\nclass Lodging implements FloorPlan\
    \ {\n    private String swimmingPool;\n    private String lobbyArea;\n    private\
    \ String rooms;\n    private String restaurants;\n    @Override\n    public void\
    \ setSwimmingPool(String swimmingPool) {\n        this.swimmingPool = swimmingPool;\n\
    \    }\n    @Override\n    public void setLobbyArea(String lobbyArea) {\n    \
    \    this.lobbyArea = lobbyArea;\n    }\n    @Override\n    public void setRooms(String\
    \ rooms) {\n        this.rooms = rooms;\n    }\n    @Override\n    public void\
    \ setRestaurants(String restaurants) {\n        this.restaurants = restaurants;\n\
    \    }\n    public void lodgingCharacteristics() {\n        System.out.println(swimmingPool);\n\
    \        System.out.println(lobbyArea);\n        System.out.println(rooms);\n\
    \        System.out.println(restaurants);\n    }\n}\n```\n\n`Lodging` 蓝图：\n\n\
    ![图形用户界面，应用描述自动生成](img/Image00183.jpg)\n\n蓝图在调用 void 接口函数时使用 `Event` 节点。`Lodging`\
    \ 蓝图版本在设置局部变量外还会打印传递给函数的字符串。此外，我们必须通过类设置中的 Interfaces 部分来确保此蓝图类实现了 `FloorPlan`\
    \ 接口。\n\n接下来两个类 `HotelLodgingBuilder` 和 `MotelLodgingBuilder` 实现住宿构建器接口，并为每种类型的住宿提供自定义规格。\n\
    \n```java\nclass HotelLodgingBuilder implements LodgingBuilder {\n    private\
    \ Lodging lodging;\n    public HotelLodgingBuilder() {\n        this.lodging =\
    \ new Lodging();\n    }\n    @Override\n    public void buildLobbyArea() {\n \
    \       lodging.setLobbyArea(\"大堂\");\n    }\n    @Override\n    public void buildRestaurants()\
    \ {\n        lodging.setRestaurants(\"五星自助餐\");\n    }\n    @Override\n    public\
    \ void buildRooms() {\n        lodging.setRooms(\"豪华套房\");\n    }\n    @Override\n\
    \    public void buildSwimmingPool() {\n        lodging.setSwimmingPool(\"室内泳池\"\
    );\n    }\n    @Override\n    public Lodging getLodging() {\n        return this.lodging;\n\
    \    }\n}\n```\n\n`HotelLodgingBuilder` 蓝图构造事件图：\n\n![计算机截图描述自动生成，置信度低](img/Image00184.jpg)\n\
    \n`Set lodging` 折叠图表节点：\n\n![图形用户界面描述自动生成](img/Image00185.jpg)\n\n`Add Child Actor\
    \ Component` 是无法使用 `Spawn Actor of Class` 节点的折中方案。我们可以在代码中看到 `HotelLodgingBuilder`\
    \ 构造函数实例化了一个新的 `Lodging` 对象：\n\n```\npublic HotelLodgingBuilder() {\n    this.lodging\
    \ = new Lodging();\n}\n```\n\n当我们学习状态模式时，我们将看到更动态的方法来绕过构造脚本限制初始化对象。\n\n`HotelLodgingBuilder`\
    \ 事件图：\n\n![图形用户界面，应用描述自动生成](img/Image00016.jpg)\n\n`isLodgingImplementInterface`\
    \ 函数类似于黄色折叠图表的自定义接口检查函数。\n\n"
- fmt: "\nThe `isLodgingImplementInterface` function:\n\n![Graphical user interface,\
    \ application Description automatically generated](Image00017.jpg) \n\nThe `MotelLodgingBuilder`\
    \ is very similar to the `HotelLodgingBuilder`. The difference is in the attributes\
    \ for the pool, lobby area, rooms, and restaurant.\n\n```java\nclass MotelLodgingBuilder\
    \ implements LodgingBuilder {\n    private Lodging lodging;\n    public MotelLodgingBuilder()\
    \ {\n        this.lodging = new Lodging();\n    }\n    public void buildSwimmingPool()\
    \ {\n        lodging.setSwimmingPool(\"Green Slim\");\n    }\n    public void\
    \ buildLobbyArea() {\n        lodging.setLobbyArea(\"Economical\");\n    }\n \
    \   public void buildRestaurants() {\n        lodging.setRestaurants(\"Vending\
    \ Machines\");\n    }\n    public void buildRooms() {\n        lodging.setRooms(\"\
    Bates Style\");\n    }\n    public Lodging getLodging() {\n        return this.lodging;\n\
    \    }\n}\n```\n\nThe blueprint screenshot for `MotelLodgingBuilder` is omitted\
    \ for brevity. It basically mimics that of the `HotelLodgingBuilder`.\n\nNow we\
    \ need an architectural engineer to coordinate the step by step construction of\
    \ the lodging.\n\n```java\nclass ArchitecturalEngineer {\n    private LodgingBuilder\
    \ lodgingBuilder;\n    public ArchitecturalEngineer(LodgingBuilder lodgingBuilder)\
    \ {\n        this.lodgingBuilder = lodgingBuilder;\n    }\n    public Lodging\
    \ getLodging() {\n        return this.lodgingBuilder.getLodging();\n    }\n  \
    \  public void constructLodging() {\n        this.lodgingBuilder.buildSwimmingPool();\n\
    \        this.lodgingBuilder.buildLobbyArea();\n        this.lodgingBuilder.buildRooms();\n\
    \        this.lodgingBuilder.buildRestaurants();\n    }\n}\n```\n\nThe `ArchitecturalEngineer`\
    \ construction script:\n\n![A screenshot of a computer Description automatically\
    \ generated with low confidence](Image00186.jpg) \n\n### The `Check lodgingBuilder\
    \ isValid` node\n\n![A picture containing text, electronics Description automatically\
    \ generated](Image00019.jpg) \n\nThis validity check is executed as a safety mechanism.\
    \ We want to make sure the object is not null before we start to perform operations\
    \ on said object. A “Not Valid” string prints to the viewport If the object is\
    \ indeed null.\n\nThe `ArchitecturalEngineer` contains a few important functions,\
    \ namely `getLodging` and `constructLodging`.\n\n### The `getLodging` function\
    \ graph\n\n![A screenshot of a computer Description automatically generated with\
    \ low confidence](Image00187.jpg) \n\n### The `constructLodging` function graph\n\
    \n![Graphical user interface Description automatically generated](Image00188.jpg)\
    \ \n\nThe collapsed graphs represent the body of the `constructLodging` function:\n\
    \n```java\npublic void constructLodging() {\n    this.lodgingBuilder.buildSwimmingPool();\n\
    \    this.lodgingBuilder.buildLobbyArea();\n    this.lodgingBuilder.buildRooms();\n\
    \    this.lodgingBuilder.buildRestaurants();\n}\n```\n\nThe `buildSwimmingPool`,\
    \ `buildLobbyArea`, `buildRooms`, and `buildRestaurants` graphs are respectively:\n\
    \n![Graphical user interface, application Description automatically generated](Image00189.jpg)\
    \ ![Graphical user interface, diagram Description automatically generated](Image00190.jpg)\
    \ ![A picture containing text, electronics Description automatically generated](Image00191.jpg)\
    \ ![A picture containing text, electronics Description automatically generated](Image00192.jpg)\
    \ \n\nThis is the final screenshot of the construction of a hotel.\n\n![Text,\
    \ chat or text message Description automatically generated](Image00026.jpg) \n\
    \nStrings printed to the viewport are not impressive. However, these strings represent\
    \ “what could be.” In development, one has the 3D or 2D artwork associated with\
    \ these strings. Thanks to the Builder Pattern, we have a framework to build different\
    \ versions of hotels piece by piece.\n\n> Boil and Bubble, Brew and Bottle… Factory\
    \ Method (Java)\n\n## Factory Method UML Diagram\n\n![Diagram Description automatically\
    \ generated](Image00193.jpg) \n\n## Factory Method Implementation\n\nWe have creator,\
    \ concrete creator, and product participants in the Factory Method design pattern.\
    \ Our example implementation has a `PotionShop` abstract class as a creator. The\
    \ concrete creators are `InnerRealmPotionShop` and `OuterRealmPotionShop`. These\
    \ concrete creators inherit functionality from the `PotionShop` abstract class.\
    \ Our concrete products are:\n\n- `InnerRealmHealthPotion`\n- `InnerRealmPowerPotion`\n\
    - `InnerRealmSkillPotion`\n- `OuterRealmHealthPotion`\n- `OuterRealmPowerPotion`\n\
    - `OuterRealmSkillPotion`\n\nAll these products inherit functionality from the\
    \ `Potion` abstract class. Using blueprints, we are going to implement the `InnerRealmPotionShop`\
    \ and its products, namely:\n\n- `InnerRealmHealthPotion`\n- `InnerRealmPowerPotion`\n\
    - `InnerRealmSkillPotion`\n\nThe same ideas and principles apply to the creation\
    \ of the `OuterRealmPotionShop` and its products.\n\nThe `FactoryMethod` class\
    \ contains the main function in Java. In terms of Blueprints, we can think of\
    \ this class as the one that actually needs to be physically dragged into the\
    \ game world. The other “concrete” classes do not need to be physically.\n\n```java\n\
    public class FactoryMethod {\n    public static void main(String[] args) {\n \
    \       PotionShop outerRealmShop = new OuterRealmPotionShop();\n        PotionShop\
    \ innerRealmShop = new InnerRealmPotionShop();\n        Potion potion = outerRealmShop.orderPotion(\"\
    Health\");\n        System.out.println(\"Potion is \" + potion.getPotionName()\
    \ + \"\\n\");\n        potion = innerRealmShop.orderPotion(\"Health\");\n    \
    \    System.out.println(\"Potion is \" + potion.getPotionName() + \"\\n\");\n\
    \        potion = outerRealmShop.orderPotion(\"Power\");\n        System.out.println(\"\
    Potion is \" + potion.getPotionName() + \"\\n\");\n        potion = innerRealmShop.orderPotion(\"\
    Power\");\n        System.out.println(\"Potion is \" + potion.getPotionName()\
    \ + \"\\n\");\n        potion = outerRealmShop.orderPotion(\"Skill\");\n     \
    \   System.out.println(\"Potion is \" + potion.getPotionName() + \"\\n\");\n \
    \       potion = innerRealmShop.orderPotion(\"Skill\");\n        System.out.println(\"\
    Potion is \" + potion.getPotionName() + \"\\n\");\n    }\n}\n```\n\nThis is the\
    \ top-level event graph for the `FactoryMethod_Main` blueprint:\n\n![Graphical\
    \ user interface Description generated](Image00194.jpg) \n\n### The `Spawn_Inner_Realm_Shop`\
    \ collapsed graph\n\n![A screenshot of a video game Description automatically\
    \ generated with medium confidence](Image00195.jpg) \n\nThe `Spawn_Inner_Realm_Shop`\
    \ collapsed graph represents this line of code:\n\n`PotionShop innerRealmShop\
    \ = new InnerRealmPotionShop();`\n\nThe bulk of the main class is collapsed inside\
    \ of the `Enter_Inner_Realm_Potion_Shop` :\n\n![Graphical user interface, application\
    \ Description automatically generated](Image00196.jpg) \n\nBasically, we are ordering\
    \ different potions from the Inner Realm Potion Shop and then printed information\
    \ related to the potion we ordered.\n\nThe `Order_Inner_Realm_Health_Potion`,\
    \ `Order_Inner_Realm_Power_Potion`, `Order_Inner_Realm_Skill_Potion` collapsed\
