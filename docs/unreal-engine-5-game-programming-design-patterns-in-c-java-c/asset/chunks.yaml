    \ **();** //Spawn a Concrete EnemyAConcreteEnemy ***** ConcreteEnemy **=** GetWorld\
    \ **()->** SpawnActor **<** AConcreteEnemy **>(** AConcreteEnemy **::** StaticClass\
    \ **());** //Spawn a Melee Enemy and set its Enemy to the Concrete oneAMeleeEnemy\
    \ ***** MeleeEnemy **=** GetWorld **()->** SpawnActor **<** AMeleeEnemy **>(**\
    \ AMeleeEnemy **::** StaticClass **());**MeleeEnemy **->** SetEnemy **(** ConcreteEnemy\
    \ **);** //Spawn a Projectile Enemy and set its Enemy to the Melee oneAProjectileEnemy\
    \ ***** ProjectileEnemy **=** GetWorld **()->** SpawnActor **<** AProjectileEnemy\
    \ **>(** AProjectileEnemy **::** StaticClass **());**ProjectileEnemy **->** SetEnemy\
    \ **(** MeleeEnemy **);**GEngine **->** AddOnScreenDebugMessage **(-** 1 **,**\
    \ 15.f **,** FColor **::** Yellow **,** TEXT **(** \"Melee Enemies are on the\
    \ horizon\" **));**Enemy **=** MeleeEnemy **;**Enemy **->** Fight **();**GEngine\
    \ **->** AddOnScreenDebugMessage **(-** 1 **,** 15.f **,** FColor **::** Yellow\
    \ **,** FString **::** Printf **(** TEXT **(** \"Melee Enemies cause %i damage.\"\
    \ **),** Enemy **->** GetDamage **()));**Enemy **->** Die **();**GEngine **->**\
    \ AddOnScreenDebugMessage **(-** 1 **,** 15.f **,** FColor **::** Yellow **,**\
    \ TEXT **(** \"Enemies are now armed with guns\" **));**Enemy **=** ProjectileEnemy\
    \ **;**Enemy **->** Fight **();**GEngine **->** AddOnScreenDebugMessage **(-**\
    \ 1 **,** 15.f **,** FColor **::** Yellow **,** FString **::** Printf **(** TEXT\
    \ **(** \"Projectile Enemies cause %i damage.\" **),** Enemy **->** GetDamage\
    \ **()));**Enemy **->** Die **();****}**// Called every framevoid ADecorator_Main\
    \ **::** Tick **(** float DeltaTime **)****{**Super **::** Tick **(** DeltaTime\
    \ **);****}**\n\nWe can see from the *Decorator_Main* that we do not need to make\
    \ a separate *Enemy* class to add features. We merely “Decorate” the enemy, and\
    \ now we have a projectile enemy. Effectively, we changed the behavior of the\
    \ enemy at runtime by using a decorator.\n\nThe *Decorator_Main* blueprint event\
    \ graph:\n\n![Graphical user interface Description automatically generated](Image00071.jpg)\
    \ \n\nThe melee enemy and the decorated projectile enemy are broken down into\
    \ separate collapsed graphs for readability.\n\nThe *Melee_Enemy_Actions* collapsed\
    \ graph:\n\n![Graphical user interface Description automatically generated](Image00072.jpg)\
    \ \n\nThe *Create_Enemy* collapsed graph:"
