  trans: "\n\n![图形用户界面，应用程序自动生成](img/Image00081.jpg) \n\n### `Projectile_Enemy_GetDamage`\
    \ 折叠图：\n\n![一张包含文本、电子设备、银色的图片，自动生成](img/Image00082.jpg) \n\n### `Projectile_Enemy_Damage_Message`\
    \ 折叠图：\n\n![一张视频游戏截图，自动生成，中等置信度](img/Image00083.jpg) \n\n### `Enemy` 接口：\n\n```csharp\n\
    public interface Enemy { \n    void fight (); //敌人造成的伤害 \n    int getDamage ();\
    \ \n    void die ();\n}\n```\n\n`Enemy` 接口被所有敌人对象共享。\n\n### `MeleeEnemy` 类：\n\n\
    ```csharp\nusing System;\npublic class MeleeEnemy : Enemy { \n    public void\
    \ fight() { \n        Console.WriteLine(\"The enemy throws heavy punches\"); \n\
    \    } \n    public int getDamage() { \n        return 5; \n    } \n    public\
    \ void die() { \n        Console.WriteLine(\"The enemy writhes in agony and disintegrates\"\
    ); \n    }\n}\n```\n\n### `MeleeEnemy` 蓝图事件图：\n\n![图形用户界面，应用程序自动生成](img/Image00227.jpg)\
    \ \n\n### `MeleeEnemy` 蓝图中的 `GetDamage` 函数：\n\n![图形用户界面自动生成](img/Image00228.jpg)\
    \ \n\n### `ProjectileEnemy` 类：\n\n```csharp\nusing System;\npublic class ProjectileEnemy\
    \ : Enemy { \n    private Enemy decoratedEnemy; \n    public ProjectileEnemy(Enemy\
    \ decoratedEnemy) { \n        this.decoratedEnemy = decoratedEnemy; \n    } \n\
    \    public void fight() {\n        decoratedEnemy.fight();\n        Console.WriteLine(\"\
    The enemy blows a kiss and fires a gun\"); \n    } \n    public int getDamage()\
    \ { \n        return decoratedEnemy.getDamage() + 95; \n    } \n    public void\
    \ die() { \n        decoratedEnemy.die(); \n    }\n}\n```\n\n我们可以看到，远程攻击敌人造成的伤害比近战敌人更多。我们使用了近战伤害属性，并为远程敌人增加了\
    \ 95 点。\n\n### `ProjectileEnemy` 蓝图事件图：\n\n![图形用户界面，应用程序自动生成](img/Image00229.jpg)\
    \ \n\n### `ProjectileEnemy` 蓝图中的 `GetDamage` 函数：\n\n![一张计算机截图，自动生成，低置信度](img/Image00230.jpg)\
    \ \n\n### 装饰器模式视口打印：\n\n![文本描述自动生成](img/Image00088.jpg) \n\n我们可以看到近战敌人过来了。近战敌人用拳头与我们战斗。然后敌人死亡。然而，我们从近战敌人那里承受了\
    \ 5 点伤害。随后，近战敌人被赋予了远程攻击的新功能。该敌人既可以挥拳也可以射击，造成 100 点伤害。\n\n# 变态在深夜出没……观察者模式 (C#)\n\
    \n## 观察者模式 UML 图\n\n![图描述自动生成](img/Image00241.jpg) \n\n## 观察者模式实现\n\n钟楼是我们观察者模式示例中的发布者。订阅者由一群怪人组成，他们根据一天中的时间改变行为。当钟楼的时间状态发生变化时，怪人会收到钟楼的通知。\n\
    \n### `Observer_Main` 类：\n\n```csharp\nusing System;\nnamespace Observer{\n  \
    \  class Observer_Main { \n        static void Main(string[] args) {\n       \
    \     ClockTower clockTower = new ClockTower();\n            FreakyAllen freakyAllen\
    \ = new FreakyAllen(clockTower);\n            FreakySue freakySue = new FreakySue(clockTower);\n\
    \            FreakyJeff freakyJeff = new FreakyJeff(clockTower);\n           \
    \ clockTower.setTimeOfDay(\"Morning\");\n            clockTower.setTimeOfDay(\"\
    Midday\");\n            clockTower.setTimeOfDay(\"Evening\");\n        }\n   \
    \ }\n}\n```\n\n### `Observer_Main` 蓝图事件图：\n\n![一张视频游戏截图，自动生成](img/Image00242.jpg)\
    \ \n\n### `Create ClockTower` 折叠图：\n\n![图形用户界面，应用程序自动生成](img/Image00243.jpg) \n\
    \n### `Create FreakyAllen` 折叠图：\n\n![图形用户界面、文本、应用程序、聊天或文本消息，自动生成](img/Image00244.jpg)\
    \ \n\n### 让我们实现 `Subscriber` 接口：\n\n```csharp\nusing System;\npublic interface\
    \ Subscriber { \n    public void update(String time);\n}\n```\n\n### 让我们实现 `Publisher`\
    \ 接口：\n\n```csharp\npublic interface Publisher { \n    public void subscribe(Subscriber\
    \ s); \n    public void unsubscribe(Subscriber s); \n    public void notifySubscribers();\n\
    }\n```\n\n### `ClockTower` 类：\n\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
    public class ClockTower : Publisher { \n    private List<Subscriber> subscribers;\
    \ \n    private String time; \n    public ClockTower() { \n        subscribers\
    \ = new List<Subscriber>(); \n    } \n    public void subscribe(Subscriber s)\
    \ { \n        subscribers.Add(s); \n    } \n    public void unsubscribe(Subscriber\
    \ s) { \n        int i = subscribers.IndexOf(s); \n        if (i >= 0) \n    \
    \        subscribers.RemoveAt(i); \n    } \n    public void notifySubscribers()\
    \ { \n        foreach (Subscriber subscriber in subscribers) {\n            subscriber.update(time);\n\
    \        } \n    } \n    public void timeChanged() { \n        notifySubscribers();\
    \ \n    } \n    public void setTimeOfDay(String time) { \n        this.time =\
    \ time;\n        timeChanged(); \n    } \n    public String getTime() { \n   \
    \     return time; \n    }\n}\n```\n\n### `ClockTower` 蓝图事件图：\n\n![图形用户界面自动生成](img/Image00245.jpg)\
    \ \n\n### `setTimeOfDay` 函数：\n\n![图形用户界面自动生成](img/Image00121.jpg) \n\n### `getTime`\
    \ 函数：\n\n![图形用户界面自动生成](img/Image00122.jpg) \n\n### `timeChanged` 函数：\n\n让我们怪人共享的\
    \ `Morph` 接口：\n\n```csharp\npublic interface Morph {\n    void morph();\n}\n```\n\
    \n### `FreakyAlien` 类：\n\n```csharp\nusing System;\npublic class FreakyAlien :\
    \ Subscriber, Morph { \n    private String time; \n    private Publisher clockTower;\
    \ \n    public FreakyAlien(Publisher clockTower) { \n        this.clockTower =\
    \ clockTower;\n        clockTower.subscribe(this); \n    } \n    public void update(String\
    \ time) { \n        this.time = time;\n        morph(); \n    } \n    public void\
    \ morph() { \n        if (time.Equals(\"Morning\")) {\n            Console.WriteLine(\"\
    It is \" + time + \", so FreakyAlien makes a bowl of cereal\"); \n        } \n\
    \        else if (time.Equals(\"Midday\")) {\n            Console.WriteLine(\"\
    It is: \" + time + \", so FreakyAlien's right eye starts to twitch\"); \n    \
    \    } \n        else if (time.Equals(\"Evening\")) {\n            Console.WriteLine(\"\
    It is: \" + time + \", so FreakyAlien morphs into a blood sucking wogglesnort\"\
    ); \n        } \n    }\n}\n```\n\n### `FreakyAlien` 构造脚本：\n\n![图形用户界面自动生成](img/Image00246.jpg)\
    \ \n\n### `Subscribe_FreakyAlien_toClockTower` 折叠图：\n\n![图形用户界面自动生成](img/Image00247.jpg)\
    \ \n\n### `Print_Subscribe_Request` 折叠图：\n\n![一张视频游戏截图，自动生成，中等置信度](img/Image00127.jpg)\
    \ \n\n### `FreakyAlien` 事件图：\n\n![图形用户界面，应用程序自动生成](img/Image00248.jpg) \n\n"
- fmt: "\nThe `Morning_Morph` collapsed graph:\n\n![A screenshot of a video game Description\
    \ automatically generated with medium confidence](Image00129.jpg)\n\nThe `Midday_Morph`\
    \ collapsed graph:\n\n![A screenshot of a video game Description automatically\
    \ generated with medium confidence](Image00130.jpg)\n\nThe `Evening_Morph` collapsed\
    \ graph:\n\n![A screenshot of a video game Description automatically generated](Image00131.jpg)\n\
    \nThe other freaks follow the same implementation except for the strings that\
    \ define their individual states and thus removed for brevity.\n\nThe Observer\
    \ pattern viewport print:\n\n![Text Description automatically generated](Image00132.jpg)\n\
    \n# You Sunk My Battleship… Strategy Pattern (C#)\n\n## Strategy Pattern UML Diagram\n\
    \n![Diagram Description automatically generated](Image00283.jpg)\n\n## Strategy\
    \ Pattern Implementation\n\nWe have a strategy for combating different enemies\
    \ at sea. The brute force strategy is used if the threat is small. We use the\
    \ divide and conquer strategy if there are many enemies. The retreat strategy\
    \ is executed if the battle is deemed futile. The `Strategy_Main` class:\n\n```csharp\n\
    using System;\nnamespace Strategy{\n    class Strategy_Main {\n        static\
    \ void Main(string[] args) {\n            Console.WriteLine(\"A tiny frigate wants\
    \ some trouble\");\n            BattleShip battleShip = new BattleShip(new BruteForceStrategy());\n\
    \            battleShip.engage();\n            Console.WriteLine(\"Four tiny frigates\
    \ want some trouble\");\n            battleShip.alterManeuvers(new DivideConquerStrategy());\n\
    \            battleShip.engage();\n            Console.WriteLine(\"An aircraft\
    \ carrier group wants some trouble\");\n            battleShip.alterManeuvers(new\
    \ RetreatStrategy());\n            battleShip.engage();\n        }\n    }\n}\n\
    ```\n\nThe `Strategy_Main` blueprint event graph:\n\n![A screenshot of a computer\
    \ Description automatically generated with low confidence](Image00168.jpg)\n\n\
    The `Create BruteForceStrategy` collapsed graph:\n\n![Graphical user interface,\
    \ application Description automatically generated](Image00169.jpg)\n\nThe `Create\
    \ Battleship` collapsed graph:\n\n![Graphical user interface, application Description\
    \ automatically generated](Image00170.jpg)\n\nThe `Execute Br Force Strategy`\
    \ collapsed graph:\n\n![A screenshot of a video game Description automatically\
    \ generated with medium confidence](Image00171.jpg)\n\nThe `Execute Divide Conquer\
    \ Strategy` collapsed graph:\n\n![A screenshot of a video game Description automatically\
    \ generated with medium confidence](Image00172.jpg)\n\nThe `Execute Retreat Strategy`\
    \ collapsed graph:\n\n![A screenshot of a video game Description automatically\
    \ generated with medium confidence](Image00173.jpg)\n\nThe `BattleShip` class:\n\
    \n```csharp\npublic class BattleShip {\n    private BattleShipStrategy battleStrategy;\n\
    \    public BattleShip(BattleShipStrategy battleStrategy) {\n        this.battleStrategy\
    \ = battleStrategy;\n    }\n    public void alterManeuvers(BattleShipStrategy\
    \ battleStrategy) {\n        this.battleStrategy = battleStrategy;\n    }\n  \
    \  public void engage() {\n        battleStrategy.maneuver();\n    }\n}\n```\n\
    \nThe `BattleShip` construction script:\n\n![Graphical user interface, application\
    \ Description automatically generated](Image00284.jpg)\n\nThe `alterManeuvers`\
    \ blueprint function:\n\n![Graphical user interface Description automatically\
    \ generated](Image00175.jpg)\n\nIs identical to the `BattleShip` construction\
    \ with the exception of actually setting the `battleStrategy` variable manually\
    \ inside the function because it is not exposed on spawn like.\n\nThe `engage`\
    \ blueprint function:\n\n![Graphical user interface, application Description automatically\
    \ generated](Image00285.jpg)\n\nThe `BattleShipStrategy` interface:\n\n```csharp\n\
    public interface BattleShipStrategy {\n    void maneuver();\n}\n```\n\nThe `BruteForceStrategy`\
    \ class:\n\n```csharp\nusing System;\npublic class BruteForceStrategy : BattleShipStrategy\
