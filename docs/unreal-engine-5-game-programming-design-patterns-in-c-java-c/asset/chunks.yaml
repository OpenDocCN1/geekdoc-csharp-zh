  trans: "\n\n```cpp\n#include \"FreakyAllen.h\"\n#include \"Publisher.h\"\n#include\
    \ \"ClockTower.h\"\n\n// 设置默认值\nAFreakyAllen::AFreakyAllen()\n{\n    // 设置此 Actor\
    \ 每一帧调用 Tick()。如果不需要，可以关闭此项以提高性能。\n    PrimaryActorTick.bCanEverTick = true;\n\
    }\n\n// 当游戏开始或被生成时调用\nvoid AFreakyAllen::BeginPlay()\n{\n    Super::BeginPlay();\n\
    }\n\n// 每帧调用一次\nvoid AFreakyAllen::Tick(float DeltaTime)\n{\n    Super::Tick(DeltaTime);\n\
    }\n\nvoid AFreakyAllen::Destroyed()\n{\n    Super::Destroyed();\n    // 如果 Clock\
    \ Tower 为空，则记录错误\n    if (!ClockTower)\n    {\n        UE_LOG(LogTemp, Error,\
    \ TEXT(\"Destroyed(): ClockTower is NULL, make sure it's initialized.\"));\n \
    \       return;\n    }\n    // 如果 Clock Tower 被销毁，则取消订阅\n    ClockTower->UnSubscribe(this);\n\
    }\n\nvoid AFreakyAllen::Update(APublisher* Publisher)\n{\n    // 执行例程\n    Morph();\n\
    }\n\nvoid AFreakyAllen::Morph()\n{\n    // 如果 Clock Tower 为空，则记录错误\n    if (!ClockTower)\n\
    \    {\n        UE_LOG(LogTemp, Error, TEXT(\"Morph(): ClockTower is NULL, make\
    \ sure it's initialized.\"));\n        return;\n    }\n    // 获取 Clock Tower 的当前时间\n\
    \    FString Time = ClockTower->GetTime();\n    if (!Time.Compare(\"Morning\"\
    ))\n    {\n        // 执行早晨例程\n        GEngine->AddOnScreenDebugMessage(-1, 15.f,\
    \ FColor::Yellow, FString::Printf(TEXT(\"It is %s, so FreakyAllen makes a bowl\
    \ of cereal\"), Time));\n    }\n    else if (!Time.Compare(\"Midday\"))\n    {\n\
    \        // 执行中午例程\n        GEngine->AddOnScreenDebugMessage(-1, 15.f, FColor::Yellow,\
    \ FString::Printf(TEXT(\"It is %s, so FreakyAllen's right eye starts to twitch\"\
    ), Time));\n    }\n    else if (!Time.Compare(\"Evening\"))\n    {\n        //\
    \ 执行晚间例程\n        GEngine->AddOnScreenDebugMessage(-1, 15.f, FColor::Yellow, FString::Printf(TEXT(\"\
    It is %s, so FreakyAllen morphs into a blood sucking wogglesnort\"), Time));\n\
    \    }\n}\n\nvoid AFreakyAllen::SetClockTower(AClockTower* myClockTower)\n{\n\
    \    // 如果传递的 Clock Tower 为空，则记录错误\n    if (!myClockTower)\n    {\n        UE_LOG(LogTemp,\
    \ Error, TEXT(\"SetClockTower(): myClockTower is NULL, make sure it's initialized.\"\
    ));\n        return;\n    }\n    // 设置 Clock Tower 并订阅\n    ClockTower = myClockTower;\n\
    \    ClockTower->Subscribe(this);\n}\n```\n\n`FreakyAllen` 构造脚本：\n\n![自动生成的图形界面描述](img/Image00124.jpg)\
    \ \n\n`isClockTowerValid` 折叠图表：\n\n![包含文本、电子设备、截图的图片自动生成](img/Image00125.jpg)\
    \ \n\n`Subscribe_FreakyAllen_toClockTower` 折叠图表：\n\n![包含文本、户内的的图片自动生成](img/Image00126.jpg)\
    \ \n\n`Print_Subscribe_Request` 折叠图表：\n\n![](img/Image00127.jpg) \n\n`FreakyAllen`\
    \ 事件图：\n\n![自动生成的图形界面描述](img/Image00128.jpg) \n\n`Morning_Morph` 折叠图表：\n\n![](img/Image00129.jpg)\
    \ \n\n`Midday_Morph` 折叠图表：\n\n![](img/Image00130.jpg) \n\n`Evening_Morph` 折叠图表：\n\
    \n![](img/Image00131.jpg) \n\n其他怪物遵循相同的实现方式，除了定义它们各自状态的字符串外（为了简洁起见，这些字符串已移除）。\n\
    \n观察者模式视口打印：\n\n![](img/Image00132.jpg) \n\n# 让雨落下来……状态模式\n\nGoF（设计模式 Go）将状态模式描述为允许对象在其内部状态改变时改变其行为（Gamma\
    \ 等人，1995）。\n\n## 优点\n\n> ● 将特定状态的行为局部化（Gamma 等人，1995）。\n\n## 不够好的之处\n\n> ● 与策略模式相当相似\n\
    \n## 状态模式实现\n\n我们将实现一个老式的老虎机。正如我们所知，老虎机可以处于几种状态。这些状态分别是：未插入硬币、已插入硬币、无金额、赢得金额。`State_Main`\
    \ 类：\n\n```cpp\n#pragma once\n#include \"CoreMinimal.h\"\n#include \"GameFramework/Actor.h\"\
    \n#include \"State_Main.generated.h\"\n\nUCLASS()\nclass AState_Main : public\
    \ AActor\n{\n    GENERATED_BODY()\n\npublic:\n    AState_Main();\n\nprotected:\n\
    \    virtual void BeginPlay() override;\n\npublic:\n    virtual void Tick(float\
    \ DeltaTime) override;\n};\n```\n\n```cpp\n#include \"State_Main.h\"\n#include\
    \ \"OldSchoolMachine.h\"\n\n// 设置默认值\nAState_Main::AState_Main()\n{\n    // 设置此\
    \ Actor 每一帧调用 Tick()。如果不需要，可以关闭此项以提高性能。\n    PrimaryActorTick.bCanEverTick = true;\n\
    }\n\n// 当游戏开始或被生成时调用\nvoid AState_Main::BeginPlay()\n{\n    Super::BeginPlay();\n\
    \    // 创建老虎机并将其金额设置为 100\n    OldSchoolMachine* OldSchoolMachine = GetWorld()->SpawnActor<AOldSchoolMachine>();\n\
    \    // 输出当前状态\n    GEngine->AddOnScreenDebugMessage(-1, 15.f, FColor::Yellow,\
    \ FString::Printf(TEXT(\"It is %s, so FreakyAllen makes a bowl of cereal\"), OldSchoolMachine->GetState()));\n\
    \    // 插入硬币并拉下摇杆\n    OldSchoolMachine->InsertCoin();\n    GEngine->AddOnScreenDebugMessage(-1,\
    \ 15.f, FColor::Yellow, FString::Printf(TEXT(\"It is %s, so FreakyAllen's right\
    \ eye starts to twitch\"), OldSchoolMachine->GetState()));\n    // 插入硬币，拉下摇杆，再次插入硬币\n\
    \    OldSchoolMachine->InsertCoin();\n    OldSchoolMachine->PullLever();\n   \
    \ OldSchoolMachine->InsertCoin();\n    // 输出当前状态\n    GEngine->AddOnScreenDebugMessage(-1,\
    \ 15.f, FColor::Yellow, FString::Printf(TEXT(\"It is %s, so FreakyAllen morphs\
    \ into a blood sucking wogglesnort\"), OldSchoolMachine->GetState()));\n    //\
    \ 拉下摇杆\n    OldSchoolMachine->PullLever();\n    // 添加 100 美额\n    OldSchoolMachine->RestockDollars(100);\n\
    \    // 插入硬币并拉下摇杆\n    OldSchoolMachine->InsertCoin();\n    OldSchoolMachine->PullLever();\n\
    \    // 输出当前状态\n    GEngine->AddOnScreenDebugMessage(-1, 15.f, FColor::Yellow,\
    \ FString::Printf(TEXT(\"It is %s, so FreakyAllen makes a bowl of cereal\"), OldSchoolMachine->GetState()));\n\
    }\n\n// 每帧调用一次\nvoid AState_Main::Tick(float DeltaTime)\n{\n    Super::Tick(DeltaTime);\n\
    }\n```\n\n`State_Main` 蓝图事件图：\n\n![](img/Image00133.jpg) \n\n`Create OldSchoolSlotMachine`\
    \ 折叠节点：\n\n![自动生成的视频游戏描述](img/Image00134.jpg) \n\n`OldSchoolMachine Action Sequence_1`\
    \ 折叠图表：\n\n![自动生成的图形界面、应用程序描述](img/Image00135.jpg) \n\n`OldSchoolMachine Action\
    \ Sequence_2` 折叠图表：\n\n![自动生成的视频游戏描述，置信度中等](img/Image00136.jpg) \n\n"
