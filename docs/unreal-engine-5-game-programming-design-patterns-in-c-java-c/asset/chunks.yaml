    \    virtual void Update(class APublisher* Publisher) override;\n    // 执行此订阅者例程\n\
    \    virtual void Morph();\n    // 设置此订阅者的钟塔\n    void SetClockTower(AClockTower*\
    \ myClockTower);\n};\n```\n\n***FreakyAllen.cpp***\n\n"
