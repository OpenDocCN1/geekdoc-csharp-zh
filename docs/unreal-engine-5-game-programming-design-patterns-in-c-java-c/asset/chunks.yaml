  trans: "\n\n```cpp\n#include \"Gun.h\"\n// 设置默认值\nAGun::AGun()\n{\n    // 设置此 actor（执行者）每帧都调用\
    \ Tick()。如果不需要，可以关闭它以提高性能。\n    PrimaryActorTick.bCanEverTick = true;\n}\n// 当游戏开始或生成时调用\n\
    void AGun::BeginPlay()\n{\n    Super::BeginPlay();\n}\n// 每帧调用\nvoid AGun::Tick(float\
    \ DeltaTime)\n{\n    Super::Tick(DeltaTime);\n}\nvoid AGun::Fire()\n{\n    //\
    \ 打印射击日志\n    GEngine->AddOnScreenDebugMessage(-1, 15.f, FColor::Yellow, TEXT(\"\
    Our gun is firing\"));\n}\n```\n\n`Gun` 图蓝：\n\n![图形用户界面，应用程序自动生成](img/Image00066.jpg)\n\
    \n`Shooter` 类：\n\n### `Shooter.h`\n\n```cpp\n#pragma once\n#include \"CoreMinimal.h\"\
    \n#include \"GameFramework/Actor.h\"\n#include \"SlingShot.h\"\n#include \"Shooter.generated.h\"\
    \n\nUCLASS()\nclass DESIGN_PATTERNS_API AShooter : public AActor, public ISlingShot\n\
    {\n    GENERATED_BODY()\npublic:\n    // 设置此 actor 属性的默认值\n    AShooter();\nprivate:\n\
    \    // 射击者的武器，必须是一个弹弓\n    ISlingShot* SlingShot;\nprotected:\n    // 当游戏开始或生成时调用\n\
    \    virtual void BeginPlay() override;\npublic:\n    // 每帧调用\n    virtual void\
    \ Tick(float DeltaTime) override;\n    // 设置武器 Actor\n    void SetSlingShot(AActor*\
    \ SlingShotObj);\n    // 使用弹弓射击\n    void Sling();\n};\n```\n\n### `Shooter.cpp`\n\
    \n```cpp\n#include \"Shooter.h\"\n// 设置默认值\nAShooter::AShooter()\n{\n    // 设置此\
    \ actor 每帧都调用 Tick()。如果不需要，可以关闭它以提高性能。\n    PrimaryActorTick.bCanEverTick = true;\n\
    }\n// 当游戏开始或生成时调用\nvoid AShooter::BeginPlay()\n{\n    Super::BeginPlay();\n}\n\
    // 每帧调用\nvoid AShooter::Tick(float DeltaTime)\n{\n    Super::Tick(DeltaTime);\n\
    }\nvoid AShooter::SetSlingShot(AActor* SlingShotObj)\n{\n    // 转换传递的 Actor 并设置武器\n\
    \    SlingShot = Cast<ISlingShot>(SlingShotObj);\n    if (!SlingShot) // 如果转换失败则记录错误\n\
    \    {\n        GEngine->AddOnScreenDebugMessage(-1, 15.f, FColor::Red, TEXT(\"\
    转换无效！查看输出日志获取更多详情\"));\n        UE_LOG(LogTemp, Error, TEXT(\"SetSlingShot():\
    \ 该 Actor 不是弹弓！你确定该 Actor 实现了该接口吗？\"));\n    }\n}\nvoid AShooter::Sling()\n{\n\
    \    if (!SlingShot)\n    {\n        UE_LOG(LogTemp, Error, TEXT(\"Sling(): SlingShot\
    \ 为空，请确保它已初始化。\"));\n        return;\n    }\n    // 射击\n    SlingShot->Sling();\n\
    }\n```\n\n我们可以看到 `Shooter` 类没有射击枪支的功能。然而，它确实有使用弹弓的功能。这两项技能都基于从武器中发射射物体。我们希望复用弹弓的功能并将其适配到枪支的使用。\n\
    \n`Shooter` 构造脚本：\n\n![图形用户界面，应用程序自动生成](img/Image00067.jpg)\n\n### Is Sling Shot\
    \ 宏：\n\n![带有中等置信度的自动生成的视频游戏描述截图](img/Image00068.jpg)\n\n### `Sling` 函数：\n\n![图形用户界面自动生成](img/Image00069.jpg)\n\
    \n### 适配器模式视口打印：\n\n![](img/Image00070.jpg)\n\n## 装饰强化型敌人……装饰器模式（Decorator Pattern）\n\
    \n装饰器模式允许运行时向对象添加特性和功能。GoF（设计模式作者）指出，“装饰器为通过子类扩展功能提供了灵活的替代方案”（Gamma et.al, 1995）。\n\
    \n#### \n- 易于为单个对象添加功能\n- 避免影响同类中的其他对象\n\n#### 缺点\n- 可能会产生 GoF 所说的“许多微小对象”。基本上，所有这些半相似的小对象可能变得难以调试。\n\
    \n### 装饰器模式实现\n\n我们的实现包含一个初始为近战的敌人。我们想要“装饰”这个敌人，使其成为可以使用投射体的敌人。因此，添加的功能是投射体能力。\n\
    \n#### `Decorator_Main` 类：\n\n### `Decorator_Main.h`\n\n```cpp\n#pragma once\n\
    #include \"CoreMinimal.h\"\n#include \"GameFramework/Actor.h\"\n#include \"Enemy.h\"\
    \n#include \"Decorator_Main.generated.h\"\n\nUCLASS()\nclass DESIGN_PATTERNS_API\
    \ Decorator_Main : public AActor\n{\n    GENERATED_BODY()\npublic:\n    // 设置默认值\n\
    \    Decorator_Main();\npublic:\n    // 主敌人\n    Enemy* Enemy;\nprotected:\n \
    \   // 当游戏开始或生成时调用\n    virtual void BeginPlay() override;\npublic:\n    // 每帧调用\n\
    \    virtual void Tick(float DeltaTime) override;\n};\n```\n\n### `Decorator_Main.cpp`\n\
    \n```cpp\n#include \"Decorator_Main.h\"\n#include \"Enemy.h\"\n#include \"MeleeEnemy.h\"\
    \n#include \"ProjectileEnemy.h\"\n// 设置默认值\nDecorator_Main::Decorator_Main()\n\
    {\n    // 设置此 actor 每帧都调用 Tick()。如果不需要，可以关闭它以提高性能。\n    PrimaryActorTick.bCanEverTick\
    \ = true;\n}\n// 当游戏开始或生成时调用\nvoid Decorator_Main::BeginPlay()\n{\n    Super::BeginPlay();\n\
    \    // 生成一个具体的敌人\n    Enemy = Cast<AMleeeEnemy>(GetWorld()->SpawnActor<AMleeeEnemy>(AMleeeEnemy::Class()));\n\
    \    // 生成一个近战敌人并将其设置为具体的敌人\n    Enemy = Cast<ProjectileEnemy>(GetWorld()->SpawnActor<ProjectileEnemy>(ProjectileEnemy::Class()));\n\
    \    // 生成一个投射体敌人并将其设置为近战敌人\n    Enemy = Cast<AMleeeEnemy>(GetWorld()->SpawnActor<AMleeeEnemy>(AMleeeEnemy::Class()));\n\
    }\n```\n\n"
- fmt: "\n![A screenshot of a computer Description automatically generated with medium\
    \ confidence](Image00073.jpg)\n\n### The `Enemy_Fight` collapsed graph:\n\n![](Image00074.jpg)\n\
    \n### The `Enemy_Die` collapsed graph:\n\n![](Image00075.jpg)\n\n### The `Enemy_GetDamage`\
    \ collapsed graph:\n\n![](Image00076.jpg)\n\n### The `Enemy_Damage_Message` collapsed\
    \ graph:\n\n![](Image00077.jpg)\n\n### The `Projectile_Enemy_Actions` collapsed\
    \ graph:\n\n![Graphical user interface Description automatically generated](Image00078.jpg)\n\
    \n### The `Create_Projectile_Enemy` collapsed graph:\n\n![Graphical user interface,\
    \ application Description automatically generated](Image00079.jpg)\n\nThe notable\
    \ difference between the melee enemy and the projectile enemy is construction.\
    \ The projectile enemy constructor accepts the previously created enemy as an\
    \ argument. This is so we can reuse it to decorate an enemy object.\n\n### The\
    \ `Projectile_Enemy_Fight` collapsed graph:\n\n![](Image00080.jpg)\n\n### The\
    \ `Projectile_Enemy_Die` collapsed graph:\n\n![](Image00081.jpg)\n\n### The `Projectile_Enemy_GetDamage`\
    \ collapsed graph:\n\n![](Image00082.jpg)\n\n### The `Projectile_Enemy_Damage_Message`\
    \ collapsed graph:\n\n![](Image00083.jpg)\n\n### The `Enemy` Interface:\n\n***Enemy.h***\n\
    \n```cpp\n#pragma once\n#include \"CoreMinimal.h\"\n#include \"UObject/Interface.h\"\
    \n#include \"Enemy.generated.h\"\n\n// This class does not need to be modified.\n\
    UINTERFACE((MinimalAPI))\nclass UEnemy : public UInterface\n{\n    GENERATED_BODY()\n\
    };\n\n/**\n* Component defines an interface for objects that can have responsibilities\n\
    * added to them dynamically\n*/\nclass DESIGN_PATTERNS_API IEnemy\n{\n    GENERATED_BODY()\n\
    \    // Add interface functions to this class. This is the class that will be\
    \ inherited to implement this interface.\npublic: \n    // The pure virtual functions\
    \ of the Enemy\n    virtual void Fight() = 0;\n    virtual int GetDamage() = 0;\n\
    \    virtual void Die() = 0;\n};\n```\n\n***Enemy.cpp***\n\n```cpp\n#include \"\
    Enemy.h\"\n// Add default functionality here for any IEnemy functions that are\
    \ not pure virtual.\n```\n\nThe `Enemy` interface is shared across all enemy objects.\
    \ The `MeleeEnemy` class:\n\n***MeleeEnemy.h***\n\n```cpp\n#pragma once\n#include\
    \ \"CoreMinimal.h\"\n#include \"Decorator.h\"\n#include \"MeleeEnemy.generated.h\"\
    \n\n/**\n Concrete Decorators\n* add responsibilities to the component (can extend\
    \ the state\n* of the component)\n*/\nUCLASS()\nclass DESIGN_PATTERNS_API AMeleeEnemy\
    \ : public ADecorator\n{\n    GENERATED_BODY()\npublic: \n    // Start Fighting\n\
    \    virtual void Fight() override;\n    // Returns how much damage this enemy\
    \ has taken\n    virtual int GetDamage() override;\n    // Kill this enemy\n \
    \   virtual void Die() override;\n};\n```\n\n***MeleeEnemy.cpp***\n\n```cpp\n\
    #include \"MeleeEnemy.h\"\nvoid AMeleeEnemy::Fight()\n{\n    // Call the parent\
    \ Fight function and log a message\n    Super::Fight();\n    GEngine->AddOnScreenDebugMessage(-1,\
    \ 15.f, FColor::Yellow, TEXT(\"The enemy throws heavy punches\"));\n}\n\nint AMeleeEnemy::GetDamage()\n\
    {\n    // Returns the base Damage + 5\n    return Super::GetDamage() + 5;\n}\n\
    void AMeleeEnemy::Die()\n{\n    // Call the parent Die function and log a message\n\
    \    Super::Die();\n    GEngine->AddOnScreenDebugMessage(-1, 15.f, FColor::Yellow,\
    \ TEXT(\"The enemy writhes in agony and disintegrates\"));\n}\n```\n\nThe `MeleeEnemy`\
    \ blueprint event graph:\n\n![Graphical user interface, application Description\
    \ automatically generated](Image00084.jpg)\n\nThe `GetDamage` function in the\
    \ `MeleeEnemy` blueprint:\n\n![A screenshot of a computer Description automatically\
    \ generated with low confidence](Image00085.jpg)\n\n### The `ProjectileEnemy`\
    \ class:\n\n***ProjectileEnemy.h***\n\n```cpp\n#pragma once\n#include \"CoreMinimal.h\"\
    \n#include \"Decorator.h\"\n#include \"ProjectileEnemy.generated.h\"\n\nUCLASS()\n\
    class DESIGN_PATTERNS_API AProjectileEnemy : public ADecorator\n{\n    GENERATED_BODY()\n\
    public: \n    // Start Fighting\n    virtual void Fight() override;\n    // Returns\
    \ how much damage this enemy has taken\n    virtual int GetDamage() override;\n\
    \    // Kill this enemy\n    virtual void Die() override;\n};\n```\n\n***ProjectileEnemy.cpp***\n\
    \n```cpp\n#include \"ProjectileEnemy.h\"\nvoid AProjectileEnemy::Fight()\n{\n\
    \    // Call the parent Fight function and log a message\n    Super::Fight();\n\
    \    GEngine->AddOnScreenDebugMessage(-1, 15.f, FColor::Yellow, TEXT(\"The enemy\
    \ blows a kiss and fires a gun\"));\n}\n\nint AProjectileEnemy::GetDamage()\n\
    {\n    // Returns the base Damage + 5\n    return Super::GetDamage() + 5;\n}\n\
    \nvoid AProjectileEnemy::Die()\n{\n    // Call the parent Die function and log\
    \ a message\n    Super::Die();\n    GEngine->AddOnScreenDebugMessage(-1, 15.f,\
    \ FColor::Yellow, TEXT(\"The enemy blows a kiss and fires a gun\"));\n}\n```\n\
    \nWe can see that projectile enemy causes more damage than the melee enemy. We\
    \ increase it by 95 for the projectile.\n\nThe `ProjectileEnemy` blueprint event\
    \ graph:\n\n![Graphical interface automatically generated](Image00086.jpg)\n\n\
    The `GetDamage` function in the `ProjectileEnemy` blueprint:\n\n![A screenshot\
    \ of a computer Description automatically generated with low confidence](Image00087.jpg)\n\
    \nThe Decorator Pattern viewport:\n\n![](Image00088.jpg)\n\nWe can see the melee\
    \ enemies coming. The melee enemy fights. The enemy then dies. However, we take\
    \ a 5-count damage from the melee enemy.\n\n### Facade Pattern\n\nGoF defines\
    \ the Facade pattern as providing a central interface to a set of interfaces (Gamma\
    \ et al., 95). The Facade pattern is great when we want to simplify the interaction\
    \ between a client and a very complex system.\n\n#### The Good\n- Simplifies the\
    \ use of a very complex system\n- Reduces coupling between clients and various\
    \ subsystems\n\n#### The Not Good\n- Hides possibly complex characteristics of\
    \ a subsystem\n\n#### Facade Pattern Implementation\n\nSpace travel is not easy.\
    \ The most important part of space travel is the starship. However, the starship\
    \ has complexity of its own. This is where the `StarShipFacade` comes into play.\n\
    \nThe Facade main class:\n\n***StarShipFacade.h***\n\n```cpp\n#pragma once\n#include\
    \ \"CoreMinimal.h\"\n#include \"GameFramework/Actor.h\"\n#include \"StarShipCrew.h\"\
    \n#include \"StarShipFacade_Main.generated.h\"\n\nUCLASS()\nclass DESIGN_PATTERNS_API\
    \ AStarShipFacade_Main : AActor\n{\n    GENERATED_BODY()\npublic: \n    // Sets\
    \ default values for this actor's properties\n    AStarShipFacade_Main();\nprotected:\
    \ \n    // Called when the game starts or when spawned\n    virtual void BeginPlay()\
    \ override;\npublic: \n    // Called every frame\n    virtual void Tick(float\
    \ DeltaTime) override;\n};\n```\n\n***StarShipFacade.cpp***\n\n```cpp\n#include\
    \ \"StarShipFacade_Main.h\"\n#include \"StarShipFacade.h\"\n\n// Sets default\
    \ values\nAStarShipFacade_Main::AStarShipFacade_Main()\n{\n    // Set this actor\
    \ to call Tick() every frame. You can turn this off to improve performance if\
    \ you don't need it.\n    PrimaryActorTick.bCanEverTick = true;\n}\n\n// Called\
    \ when the game starts or when spawned\nvoid AStarShipFacade_Main::BeginPlay()\n\
    {\n    Super::BeginPlay();\n    // Create the Ship Facade Actor\n    AStarShipFacade*\
    \ ShipFacade = GetWorld()->SpawnActor<AStarShipFacade>(AStarShipFacade::StaticClass());\n\
    \    // Execute the needed tasks\n    ShipFacade->Reveille();\n    ShipFacade->PlanOfTheDay();\n\
    \    ShipFacade->Taps();\n}\n\n// Called every frame\nvoid AStarShipFacade_Main::Tick(float\
    \ DeltaTime)\n{\n    Super::Tick(DeltaTime);\n}\n```\n"
