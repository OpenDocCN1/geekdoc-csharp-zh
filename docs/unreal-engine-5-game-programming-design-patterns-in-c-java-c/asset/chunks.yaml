    \nLet’s implement the `Subscriber`:\n\n***Subscriber.h***\n```cpp\n#pragma once\n\
    #include \"CoreMinimal.h\"\n#include \"UObject/Interface.h\"\n#include \"Subscriber.generated.h\"\
    \n\n// This class does not need to be modified\nUINTERFACE(MinimalAPI)\nclass\
    \ USubscriber : public UInterface\n{\n    GENERATED_BODY()\n};\n\n// Add interface\
    \ functions to this class. This is the class that will be inherited to implement\
    \ this interface.\nclass DESIGN_PATTERNS_API ISubscriber\n{\n    GENERATED_BODY()\n\
    public:\n    //The pure virtual functions of the Subscriber\n    virtual void\
    \ Update(class APublisher* Publisher) = 0;\n};\n```\n\n***Subscriber.cpp***\n\
    ```cpp\n#include \"Subscriber.h\"\n// Add default functionality here for any ISubscriber\
    \ functions that are not pure virtual.\n```\n\nLets implement the `Publisher`:\n\
    \n***Publisher.h***\n```cpp\n#pragma once\n#include \"CoreMinimal.h\"\n#include\
    \ \"GameFramework/Actor.h\"\n#include \"Subscriber.h\"\n#include \"Publisher.generated.h\"\
    \n\nUCLASS()\nclass DESIGN_PATTERNS_API APublisher : public AActor\n{\n    GENERATED_BODY()\n\
    public:\n    // Sets default values for this actor's properties\n    APublisher();\n\
    private:\n    //The Subscribers of this Publisher\n    UPROPERTY()\n    TArray<AActor*>\
    \ Subscribers = TArray<AActor*>();\nprotected:\n    // Called when the game starts\
    \ or when spawned\n    virtual void BeginPlay() override;\npublic:\n    // Called\
    \ every frame\n    virtual void Tick(float DeltaTime) override;\npublic:\n   \
    \ //Add the pased Subscriber to the list\n    virtual void Subscribe(AActor* Subscriber);\n\
    \    //Remove the passed Subscriber from the list\n    virtual void UnSubscribe(AActor*\
    \ SubscriberToRemove);\n    //Notify all the Subscribers that something has changed\n\
    \    virtual void NotifySubscribers();\n};\n```\n\n***Publisher.cpp***\n"
