    \n`BattleShipStrategy` 接口：\n\n```java\npublic interface BattleShipStrategy {\n\
    \    void maneuver();\n}\n```\n\n`BruteForceStrategy` 类：\n\n```java\npublic class\
    \ BruteForceStrategy implements BattleShipStrategy {\n    @Override\n    public\
    \ void maneuver() {\n        System.out.println(\"We can take these ships head\
    \ on\");\n    }\n}\n```\n\n`BruteForceStrategy` 蓝图事件图：\n\n![图形用户界面描述自动生成](img/Image00177.jpg)\n\
    \n`DivideConquerStrategy` 类：\n\n```java\npublic class DivideConquerStrategy implements\
    \ BattleShipStrategy {\n    @Override\n    public void maneuver() {\n        System.out.println(\"\
    Lure ships away from each other and attack each individually\");\n    }\n}\n```\n\
    \n`DivideConquerStrategy` 蓝图事件图：\n\n![图形用户界面描述自动生成](img/Image00178.jpg)\n\n`RetreatStrategy`\
    \ 类：\n\n```java\npublic class RetreatStrategy implements BattleShipStrategy {\n\
    \    @Override\n    public void maneuver() {\n        System.out.println(\"Full\
    \ speed away!\");\n    }\n}\n```\n\n`RetreatStrategy` 蓝图事件图：\n\n![图形用户界面描述自动生成](img/Image00179.jpg)\n\
    \n策略模式视口打印：\n\n![图形用户界面、文本描述自动生成](img/Image00180.jpg)\n\n"
- fmt: "\n# The Patterns Using C#\n\nIn this section, we are going to implement most\
    \ of the patterns we have covered using C#. The reader will notice that the blueprints\
    \ equivalent to C# are identical to the blueprints shown in the Java section.\
    \ This section will be most beneficial to those with a Unity programming background.\
    \ C# is the lingua franca for high level scripting in the Unity game engine. Let’s\
    \ quickly call out the `using directive.` It will not have any performance impact\
    \ on a final app or game. Directives as such are compiler “shortcuts” to deal\
    \ with long type names. Also, a more in-depth discussion on the specific pattern\
    \ and its implementation please refer to the C++ section. The discussion details\
    \ remain the same regardless which language one is using.\n\n## Hotel Motel Holiday\
    \ Inn… Builder Pattern (C#)\n\nThe Builder Pattern in C# has a UML diagram identical\
    \ to the Java implementation and thus that diagram is shown here. Ignore the “Java”\
    \ class text.\n\n### Builder Pattern UML Diagram\n\n![Timeline Description automatically\
    \ generated with medium confidence](Image00181.jpg) \n\n### Builder Pattern Implementation\n\
    \nThe `Builder` class contains the main function in C#. In terms of Blueprints,\
    \ we can think of this class as the one that actually needs to be physically dragged\
    \ into the game world. The other “concrete” classes do not need to be physically\
    \ dragged into the world.\n\n```csharp\nusing System;\nnamespace Builder{\n class\
    \ Builder_Main {\n    static void Main(string[] args) {\n        LodgingBuilder\
    \ hotelBuilder = new HotelLodgingBuilder();\n        ArchitecturalEngineer engineer\
    \ = new ArchitecturalEngineer(hotelBuilder);\n        engineer.constructLodging();\n\
    \        Lodging lodging = engineer.getLodging();\n        lodging.lodgingCharacteristics();\n\
    \    }\n}\n}\n```\n\nThe blueprint equivalent of the `Builder_Main` class:\n\n\
    ![Graphical user interface Description automatically generated](Image00182.jpg)\
    \ \n\nThe `Set hotelBuilder` and `Set engineer` collapsed graph are respectively:\n\
    \n![Graphical user interface, application Description automatically generated](Image00005.jpg)\
    \ \n\nand\n\n![Graphical user interface, text, application Description automatically\
    \ generated](Image00006.jpg) \n\nThe `Set hotelBuilder` collapsed graph represents\
    \ this line of code:\n\n```csharp\nLodgingBuilder hotelBuilder = new HotelLodgingBuilder();\n\
    ```\n\nThe `Spawn Actor From Class` node is akin to the `new` keyword in C# and\
    \ other languages. The class to spawn is chosen using the dropdown box under the\
    \ word “Class”. The Spawn Transform is to one’s own specific scenario. For simplicity,\
    \ we can just right click on the Spawn Transform and choose “Promote to Variable”.\
    \ If there is no Spawn Transform then the blueprint will compile with errors.\
    \ We set (or “initialize”) our `hotelBuilder` variable once the desired actor\
    \ is spawned.\n\nThe same basic idea applies to the `Set engineer` collapsed graph.\
    \ However, `Architectural Engineer` needs a `LodgingBuilder` to be passed into\
    \ its constructor as expressed in this line of code:\n\n```csharp\nArchitecturalEngineer\
    \ engineer = new ArchitecturalEngineer(hotelBuilder);\n```\n\nLater, we will not\
    \ be going into such detail on every spawning activity. Trust that there are many,\
    \ many spawn actor requirements, and discussing each one will become an exercise\
    \ in tedium.\n\nThe `Builder_Main` blueprint continues with the `Construct Lodging`\
    \ function call node. This is function is called on the `engineer` we spawned\
    \ previously. The equivalent line of code:\n\n```csharp\nengineer.constructLodging();\n\
    ```\n\nNote the `Sequence` node in `Builder_Main`. Sequence 0 finishes once the\
    \ `Construct Lodging` function call executes. Sequence 1 then starts executing.\
    \ The `Set lodging` collapsed graph:\n\n![Graphical user interface, application\
    \ Description generated](Image00007.jpg) \n\nNow, we are equivalently executing\
    \ this line of code:\n\n```csharp\nLodging lodging = engineer.getLodging();\n\
    ```\n\nThis is the last line of code in the `Builder` class. However, we need\
    \ to make some validation checks and make sure we built a hotel. We want to make\
    \ sure the `lodging` actor implements the `FloorPlan` interface. The `lodging\
    \ isFloorPlan_int` collapsed graph:\n\n![A screenshot of a computer Description\
    \ automatically generated with low confidence](Image00008.jpg) \n\nGoing forward\
    \ we will not be showing this interface check collapsed graph. Note, the collapsed\
    \ graph for this check always possesses a yellow hue. The only item that changes\
    \ inside the collapsed node is the target interface we are checking the object\
    \ against. The target interface is always part of the collapsed graph name.\n\n\
    The `Builder_Main` blueprint ends execution with a print string to let us know\
    \ if the hotel is actually built. “Failed to Build a Hotel” prints If an error\
    \ in logic occurs somewhere in any of the blueprints.\n\nNow we can discuss the\
    \ interfaces we use in this pattern. First, we create a floor plan interface for\
    \ all lodgings to implement. Most commercial lodgings in the USA contain a pool,\
    \ lobby area, rooms, and restaurants. We also create a lodging builder interface\
    \ for our specific lodging builder classes to implement. The `FloorPlan` interface:\n\
    \n```csharp\nusing System;\ninterface FloorPlan{\n    public void setSwimmingPool(String\
    \ swimmingPool);\n    public void setLobbyArea(String lobbyArea);\n    public\
    \ void setRooms(String rooms);\n    public void setRestaurants(String restaurants);\n\
    }\n```\n\nThe equivalent blueprint interface is very mundane. The following are\
    \ the nodes representing the functions in the `FloorPlan` interface.\n\n![Graphical\
    \ user interface, application Description generated](Image00009.jpg) ![Graphical\
    \ user interface, application Description generated](Image00010.jpg) ![Graphical\
    \ user interface, application Description generated](Image00011.jpg) ![Graphical\
    \ user interface, application Description generated](Image00012.jpg) \n\nThe saying\
    \ goes, “Program to an Interface, not an implementation” (Gamma et.al, 1995).\
    \ In fact, it is a core principle in object-oriented design. The main benefit\
    \ of programming to an interface is that it reduces implementation dependencies\
    \ between subsystems (Gamma et.al, 1995). We see this first hand in our Builder\
    \ Pattern example. Specifically, The Builder pattern seeks to decouple the construction\
    \ of complex objects from its actual representation (Gamma et.al, 1995).\n\n```csharp\n\
    interface LodgingBuilder{\n    public void buildSwimmingPool();\n    public void\
    \ buildLobbyArea();\n    public void buildRooms();\n    public void buildRestaurants();\n\
    \    public Lodging getLodging();\n}\n```\n\nThe screenshot of the `LodgingBuilder`\
    \ interface blueprint follows the same design as the `FloorPlan` interface blueprint\
    \ and is thus removed for the sake of brevity. Going forward, showing interface\
    \ blueprint images are minimized unless considered necessary to deepen understanding\
    \ for the reader.\n\nNext, we create the `Lodging` class which implements the\
    \ `FloorPlan` interface.\n"
