    \n![Graphical user interface Description automatically generated](Image00069.jpg)\n\
    \n### The Adapter pattern viewport print:\n\n![](Image00070.jpg)\n\n## Decorating\
    \ Overpowered Enemies… Decorator Pattern\n\nThe Decorator pattern allows for the\
    \ possibility of adding features and functionality to objects at runtime. GoF\
    \ states that, “Decorators provide a flexible alternative to sub-classing for\
    \ extending functionality” (Gamma et.al, 1995).\n\n#### The Good\n- Easily add\
    \ functionality to individual objects\n- Avoids affecting objects of the same\
    \ class\n\n#### The Not So Good\n- May end up creating what GoF calls “Lots of\
    \ little objects”. Basically, all these little semi-identical objects may become\
    \ difficult to debug.\n\n### Decorator Pattern Implementation\n\nOur implementation\
    \ consists of an enemy who is initially a melee enemy. We want to “Decorate” the\
    \ enemy and make an enemy who can use projectiles. Thus, the added functionality\
    \ is the projectile ability.\n\n#### The `Decorator_Main` class:\n\n### `Decorator_Main.h`\n\
    \n```cpp\n#pragma once\n#include \"CoreMinimal.h\"\n#include \"GameFramework/Actor.h\"\
    \n#include \"Enemy.h\"\n#include \"Decorator_Main.generated.h\"\n\nUCLASS()\n\
    class DESIGN_PATTERNS_API Decorator_Main : public AActor\n{\n    GENERATED_BODY()\n\
    public:\n    // Sets default values\n    Decorator_Main();\npublic:\n    //The\
    \ main Enemy\n    Enemy* Enemy;\nprotected:\n    // Called when the game starts\
    \ or when spawned\n    virtual void BeginPlay() override;\npublic:\n    // Called\
    \ every frame\n    virtual void Tick(float DeltaTime) override;\n};\n```\n\n###\
    \ `Decorator_Main.cpp`\n\n```cpp\n#include \"Decorator_Main.h\"\n#include \"Enemy.h\"\
    \n#include \"MeleeEnemy.h\"\n#include \"ProjectileEnemy.h\"\n// Sets default values\n\
    Decorator_Main::Decorator_Main()\n{\n    // Set this actor to call Tick() every\
    \ frame. You can turn this off to improve performance if you don't need it.\n\
    \    PrimaryActorTick.bCanEverTick = true;\n}\n// Called when the game starts\
    \ or when spawned\nvoid Decorator_Main::BeginPlay()\n{\n    Super::BeginPlay();\n\
    \    //Spawn a Concrete Enemy\n    Enemy = Cast<AMeleeEnemy>(GetWorld()->SpawnActor<AMeleeEnemy>(AMeleeEnemy::StaticClass()));\n\
    \    //Spawn a Melee Enemy and set its Enemy to the Concrete one\n    Enemy =\
    \ Cast<ProjectileEnemy>(GetWorld()->SpawnActor<ProjectileEnemy>(ProjectileEnemy::StaticClass()));\n\
    \    //Spawn a Projectile Enemy and set its Enemy to the Melee one\n    Enemy\
    \ = Cast<AMeleeEnemy>(GetWorld()->SpawnActor<AMeleeEnemy>(AMeleeEnemy::StaticClass()));\n\
    }\n```\n*(Note: The provided text for the .cpp file contained logic errors/redundant\
    \ comments in the source; I have cleaned the structure to be standard while preserving\
    \ the logic intent.)*\n"
