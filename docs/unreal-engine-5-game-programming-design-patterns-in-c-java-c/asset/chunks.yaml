  trans: "\n\n从 `Façade_Main` 我们可以看到运行飞星舰是多么简单。这仅仅是一个使用外观模式（Façade pattern）的外壳。复杂性在后面。\n\
    \n### `Façade_Main` 事件图：\n\n![图形用户界面，应用程序描述自动生成](img/Image00089.jpg)\n\n### `StarShipFacade`\
    \ 类：\n\n#### `StarShipFacade.h`\n```cpp\n#pragma once\n#include \"CoreMinimal.h\"\
    \n#include \"GameFramework/Actor.h\"\n#include \"StarShipCrewMember.h\"\n#include\
    \ \"StarShipFacade.generated.h\"\nUCLASS()\nclass DESIGN_PATTERNS_API AStarShipFacade\
    \ : public AActor\n{\n    GENERATED_BODY()\npublic:\n    // 设置此 属性的默认值\n    AStarShipFacade();\n\
    private:\n    // 船员列表\n    TArray<AStarShipCrewMember*> Crew;\n    // 要执行的任务\n\
    \    UPROPERTY()\n    TArray<FString> Tasks;\nprotected:\n    // 当游戏开始或生成时调用\n\
    \    virtual void BeginPlay() override;\nprivate:\n    // 为特定船员执行任务\n    void\
    \ PerformTasks(TArray<AStarShipCrewMember*> myCrew, TArray<FString> myTasks);\n\
    public:\n    // 每帧调用\n    virtual void Tick(float DeltaTime) override;\n    //\
    \ 执行 起床号（Reveille）任务\n    void Reveille();\n    // 执行 每日计划（PlanOfTheDay）任务\n \
    \   void PlanOfTheDay();\n    // 执行 熄灯号（Taps）任务\n    void Taps();\n};\n```\n\n\
    #### `StarShipFacade.cpp`\n```cpp\n#include \"StarShipFacade.h\"\n#include \"\
    StarShipNavigationOfficer.h\"\n#include \"StarShipOperationsOfficer.h\"\n#include\
    \ \"StarShipSupplyOfficer.h\"\n// 设置默认值\nAStarShipFacade::AStarShipFacade()\n\
    {\n    // 设置此 actor 每帧调用 Tick()。如果不需要，可以关闭它以提高性能。\n    PrimaryActorTick.bCanEverTick\
    \ = true;\n}\n// 当游戏开始或生成时调用\nvoid AStarShipFacade::BeginPlay()\n{\n    Super::BeginPlay();\n\
    \    // 初始化列表\n    Crew = TArray<AStarShipCrewMember>();\n    Tasks = TArray<FString>();\n\
    \    // 生成成员\n    AStarShipNavigationOfficer* NavOfficer = GetWorld()->SpawnActor<AStarShipNavigationOfficer>(AStarShipNavigationOfficer::StaticClass());\n\
    \    AStarShipOperationsOfficer* OpsOfficer = GetWorld()->SpawnActor<AStarShipOperationsOfficer>(AStarShipOperationsOfficer::StaticClass());\n\
    \    AStarShipSupplyOfficer* SupOfficer = GetWorld()->SpawnActor<AStarShipSupplyOfficer>(AStarShipSupplyOfficer::StaticClass());\n\
    \    // 将成员加入船员组\n    Crew.Add(NavOfficer);\n    Crew.Add(OpsOfficer);\n    Crew.Add(SupOfficer);\n\
    }\n// 每帧调用\nvoid AStarShipFacade::Tick(float DeltaTime)\n{\n    Super::Tick(DeltaTime);\n\
    }\nvoid AStarShipFacade::Reveille()\n{\n    // 清空任务列表\n    Tasks.Empty();\n  \
    \  // 添加要执行的任务\n    Tasks.Add(\"trice_up\");\n    Tasks.Add(\"muster\");\n   \
    \ // 执行任务\n    PerformTasks(Crew, Tasks);\n}\nvoid AStarShipFacade::PlanOfTheDay()\n\
    {\n    // 清空任务列表\n    Tasks.Empty();\n    // 添加要执行的任务\n    Tasks.Add(\"duty\"\
    );\n    // 执行任务\n    PerformTasks(Crew, Tasks);\n}\nvoid AStarShipFacade::Taps()\n\
    {\n    // 清空任务列表\n    Tasks.Empty();\n    // 添加要执行的任务\n    Tasks.Add(\"liberty_call\"\
    );\n    Tasks.Add(\"lights_out\");\n    // 执行任务\n    PerformTasks(Crew, Tasks);\n\
    }\nvoid AStarShipFacade::PerformTasks(TArray<AStarShipCrewMember*> myCrew, TArray<FString>\
    \ myTasks)\n{\n    // 为每个船员执行传递的任务\n    for (AStarShipCrewMember* Member : myCrew)\n\
    \    {\n        // 执行任务\n        Member->Task(myTasks);\n    }\n}\n```\n\n`StarShipFacade`\
    \ 类是该模式精髓所在。`starshipFacade` 事件图：\n\n![图形用户界面描述自动生成](img/Image00090.jpg)\n\n###\
    \ `将导航官加入船员组` 的折叠图：\n\n![](img/Image00091.jpg)\n\n### `将补给官加入船员组` 的折叠图：\n\n![](img/Image00092.jpg)\n\
    \n### `将行动务官加入船员组` 的折叠图：\n\n![](img/Image00093.jpg)\n\n### `Reveille` 蓝图函数：\n\n\
    ![](img/Image00094.jpg)\n\n### `PlanOfTheDay` 蓝图函数：\n\n![](img/Image00095.jpg)\n\
    \n### `Taps` 蓝图函数：\n\n![](img/Image00096.jpg)\n\n### `Perform Tasks` 蓝图函数：\n\n\
    ![](img/Image00097.jpg)\n\n### 抽象类 `StarShipCrewMember`：\n\n#### `StarShipCrewMember.h`\n\
    ```cpp\n#pragma once\n#include \"CoreMinimal.h\"\n#include \"GameFramework/Actor.h\"\
    \n#include \"StarShipCrewMember.generated.h\"\nUCLASS()\nclass DESIGN_PATTERNS_API\
    \ AStarShipCrewMember : public AActor\n{\n    GENERATED_BODY()\npublic:\n    //\
    \ 设置此 属性的默认值\n    AStarShipCrewMember();\nprotected:\n    // 当游戏开始或生成时调用\n   \
    \ virtual void BeginPlay() override;\nprivate:\n    // 执行传递的任务\n    void Task(const\
    \ FString& Task);\npublic:\n    // 执行 熄灯任务\n    void TurnLightsOut();\n    //\
    \ 执行 起立三号任务\n    void HeaveOutTriceUp();\n    // 执行 准假假任务\n    void LibertyCall();\n\
    \    // 执行 集合点任务\n    void CrewMuster();\n    // 执行传递的任务列表\n    void Task(const\
    \ TArray<FString>& Tasks);\n    // 执行船员职责。它是纯虚函数，在此类中不需要实现\n    virtual void Duty()\
    \ PURE_VIRTUAL(AStarShipCrewMember::Duty, );\n    // 返回船员头衔。它是纯虚函数，在此类中不需要实现\n\
    \    virtual FString CrewTitle() PURE_VIRTUAL(AStarShipCrewMember::CrewTitle,\
    \ return \"\"; );\n};\n```\n\n`StarShipCrewMember.cpp`\n\n"
- fmt: "\n```cpp\n#include \"StarShipCrewMember.h\"\nAStarShipCrewMember::AStarShipCrewMember()\
    \ {}\n\nvoid AStarShipCrewMember::BeginPlay() {\n    Super::BeginPlay();\n}\n\n\
    void AStarShipCrewMember::TurnLightsOut() {\n    // Print lights out string\n\
    \    GEngine->AddOnScreenDebugMessage(-1, 15.f, FColor::Yellow, FString::Printf(TEXT(\"\
    %s taps,t lights out.\"), CrewTitle()));\n}\n\nvoid AStarShipCrewMember::HeaveOutTriceUp()\
    \ {\n    // Print trice up string\n    GEngine->AddOnScreenDebugMessage(-1, 15.f,\
    \ FColor::Yellow, FString::Printf(TEXT(\"%s all hands heave out and trice up.\"\
    ), CrewTitle()));\n}\n\nvoid AStarShipCrewMember::LibertyCall() {\n    // Print\
    \ liberty call string\n    GEngine->AddOnScreenDebugMessage(-1, 15.f, FColor::Yellow,\
    \ FString::Printf(TEXT(\"%s liberty call, liberty call.\"), CrewTitle()));\n}\n\
    \nvoid AStarShipCrewMember::CrewMuster() {\n    // Print crew muster string\n\
    \    GEngine->AddOnScreenDebugMessage(-1, 15.f, FColor::Yellow, FString::Printf(TEXT(\"\
    %s time for muster.\"), CrewTitle()));\n}\n\nvoid AStarShipCrewMember::Task(const\
    \ TArray<FString>& Tasks) {\n    // Loop the Tasks array and call the Task() function\
    \ for each of them\n    for (const FString& myTask : Tasks) {\n        Task(myTask);\n\
    \    }\n}\n\nvoid AStarShipCrewMember::Task(const FString& Task) {\n    // Checks\
    \ which task must be executed\n    if (Task.Equals(\"lights_out\")) {\n      \
    \  TurnLightsOut();\n    } else if (Task.Equals(\"trice_up\")) {\n        HeaveOutTriceUp();\n\
    \    } else if (Task.Equals(\"liberty_call\")) {\n        LibertyCall();\n   \
    \ } else if (Task.Equals(\"muster\")) {\n        CrewMuster();\n    } else if\
    \ (Task.Equals(\"duty\")) {\n        Duty();\n    } else {\n        // In case\
    \ the passed Task doesn't exist\n        GEngine->AddOnScreenDebugMessage(-1,\
    \ 15.f, FColor::Red, TEXT(\"Undefined task\"));\n    }\n}\n```\n\nThe `Turn Lights\
