- fmt: "\n# Introduction\n\nThis book is not a level design, artificial intelligence,\
    \ user interface, animation etc. blueprint tutorial. The example implementations\
    \ are trivial, like printing a string to the screen/viewport trivial. To that\
    \ end, focus is set on the design patterns themselves, not bells and whistles\
    \ in Unreal Engine. This is done with great care and consideration to reduce obsolescence.\
    \ Unreal Engine changes so frequently that a large portion of written publications\
    \ are all but obsolete by the time they are published.\n\nAlso, this is not a\
    \ “best practices” book. Please do not use this book as a reference for blueprint\
    \ best practices. This book tries to follow the “equivalent” code as much as possible.\
    \ To that end, we may diverge from blueprint best practices to mimic as close\
    \ as possible what is written in code. Epic has taken great pains to abstract\
    \ away common programming tasks in blueprints. I encourage you to learn the official\
    \ API, because often… “there’s a node for that”.\n\nThere are many ways to skin\
    \ a cat, so to speak. The implementation of each Design pattern may possess alternative\
    \ and perhaps even better blueprint implementations. This book only provides one\
    \ example of many.\n\n## Blueprint Weirdness and Unconventional Methodologies\n\
    \n### Blueprint Interfaces\n\nBlueprint scripting in Unreal has some different\
    \ ways of implementing traditional programming constructs. The most confusing\
    \ topic, especially coming from a software engineering background is the blueprint\
    \ interface. The blueprint interface is widely cited as being a “communication”\
    \ tool. I nearly had a panic attack when I heard Epic’s staff say this in a live\
    \ training stream. The same “communication” idea is echoed in the documentation.\
    \ I cannot tell you how many times I yelled at my computer screen while reading\
    \ documentation on blueprint interfaces. I would yell, “No, interfaces have nothing\
    \ to do with communication!” All interfaces do is define a guaranteed behavioral\
    \ contract for objects which implement them. Yet, I’m wrong. One must let go of\
    \ their traditional understanding of an interface. One must embrace the blueprint\
    \ interface “communication” deal. Before you think I’m bashing Unreal, let me\
    \ provide you with a great excerpt on blueprint interfaces from their documentation:\n\
    \n*“A Blueprint Interface is a collection of one or more functions - name only,\
    \ no implementation - that can be added to other Blueprints. Any Blueprint that\
    \ has the Interface added is guaranteed to have those functions…. This is essentially\
    \ like the concept of an interface in general programming”*\n\n*-`https://docs.unrealengine.com/en-us/Engine/Blueprints/UserGuide/Types/Interface`*\n\
    \n### Cannot spawn in construction script\n\nThe heading is self-explanatory.\
    \ Why this poses a challenge when trying to construct objects in the “constructor”\
    \ is not intuitive. The construction script is executed before the game runs in\
    \ the editor. We cannot “spawn” objects without a world to spawn into. The workaround\
    \ was using the `Add Actor Component` node. There may be a better way, but this\
    \ works so far. We shy away from the extensive use of the construction script\
    \ in the C++ blueprints but make extensive use of it for the Java and C# implementation.\n\
    \n### Sequence Node Usage\n\n![](Image00001.jpg) \n\nThere is heavy use of the\
    \ sequence node to encourage overall blueprint flow from top to bottom. This is\
    \ necessary for readability of larger blueprints. Most blueprints are generally\
    \ composed with a left to right flow. However, there is more space vertically\
    \ than horizontally in a book.\n\n### Collapse Node\n\n![](Image00002.jpg) \n\n\
    The collapsed graph node is used to separate large blueprints into presentable\
    \ chunks.\n\n### Yellow Interface\n\n![](Image00003.jpg)\n\nThe collapsed graph\
    \ with yellow hue represents an interface. Specifically, it accepts an object\
    \ and checks if it implements the target. This node is singled out in the graph\
    \ for the sake of brevity.\n\n## Creational Patterns\n\nCreational patterns help\
    \ to abstract instantiation process. We use creational patterns when we want to\
    \ decouple object from client. As the number of objects grow, their behavior may\
    \ diverge. We cannot hardcode every object into the client.\n\n### Builder Pattern\n\
    \nDo you want to encapsulate the creation of complex objects? The Builder pattern\
    \ seeks to decouple construction from actual representation. Products can be easily\
    \ swapped and out.\n\n#### The Good\n- Decouple construction of objects from representation\
    \ own- Easily swap products to be built\n- Build in step-by-step fashion\n\n####\
    \ The Not Good\n- Necessary to create builders for each product\n- Some overlap\
    \ with design pattern\n\n### Builder Implementation\n\nWe want to build some lodgings\
    \ in our game, namely hotels and motels. One can easily replace “hotel” and “motel”\
    \ with any other thing that needs to be built. However, the interface must be\
    \ shared for the builder to make sense. For example, in terms of Blueprints, we\
    \ can think of this class as the one that needs to be physically dragged into\
    \ the world. The other “concrete” classes do not need to be dragged into the world.\n\
    \n***Builder_Main.h***\n```cpp\n#pragma once\n#include \"CoreMinimal.h\"\n#include\
    \ \"GameFramework/Actor.h\"\n#include \"Builder_Main.generated.h\"\n\nUCLASS()\n\
    class DESIGN_PATTERNS_API ABuilder_Main : public AActor\n{\n    GENERATED_BODY()\n\
    \npublic:\n    // Sets default values for this actor\n    ABuilder_Main();\n\n\
    private:\n    // Builder Actor\n    UPROPERTY(VisibleAnywhere, Category = \"Main\"\
    )\n    class AHotelLodgingBuilder* HotelBuilder;\n\n    // The Engineer Actor\n\
    \    UPROPERTY(VisibleAnywhere, Category = \"Main\")\n    class AArchitecturalEngineer*\
    \ Engineer;\n\nprotected:\n    // Called when the game starts or when spawned\n\
    \    virtual void BeginPlay() override;\n\npublic:\n    // Called every frame\n\
    \    virtual void Tick(float DeltaTime) override;\n};\n```\n\n***Builder_Main.cpp***\n\
    ```cpp\n#include \"Builder_Main.h\"\n#include \"HotelLodgingBuilder.h\"\n#include\
    \ \"ArchitecturalEngineer.h\"\n#include \"Lodging.h\"\n\n// Set default values\n\
    ABuild_Main::ABuilderMain()\n{\n    // Set this actor to call Tick() every frame.\
    \ You can turn this off to improve performance if you don't need it.\n    PrimaryActorTick.bCanEverTick\
    \ = true;\n}\n\n// Called when the game starts or when spawned\nvoid ABuilder_Main::BeginPlay()\n\
    {\n    Super::BeginPlay();\n\n    // Spawn Builder and Engineer\n    HotelBuilder\
    \ = GetWorld()->SpawnActor<AHotelLodgingBuilder>(AHotelLodgingBuilder::StaticClass());\n\
    \    Engineer = GetWorld()->SpawnActor<AArchitecturalEngineer>(AArchitecturalEngineer::StaticClass());\n\
    \n    // Set the Builder for the Engineer and create the buildings\n    Engineer->SetLodgingBuilder(HotelBuilder);\n\
    \    Engineer->ConstructLodging();\n\n    // Get the Engineer's Lodging and Logs\
    \ the created buildings\n    ALodging* Lodging = Engineer->GetLodging();\n   \
    \ Lodging->LodgingCharacteristics();\n}\n\n// Called every frame\nvoid ABuilder_Main::Tick(float\
    \ DeltaTime)\n{\n    Super::Tick(DeltaTime);\n}\n```\n"
  raw: "This book is not a level design, artificial intelligence, user interface,\
    \ animation etc. blueprint tutorial. The example implementations are trivial,\
    \ like printing a string to the screen/viewport trivial. To that end, focus is\
    \ set on the design patterns themselves, not bells and whistles in Unreal Engine.\
    \ This is done with great care and consideration to reduce obsolescence. Unreal\
    \ Engine changes so frequently that a large portion of written publications are\
    \ all but obsolete by the time they are published.\n\nAlso, this is not a “best\
    \ practices” book. Please do not use this book as a reference for blueprint best\
    \ practices. This book tries to follow the “equivalent” code as much as possible.\
    \ To that end, we may diverge from blueprint best practices to mimic as close\
    \ as possible what is written in code. Epic has taken great pains to abstract\
    \ away common programming tasks in blueprints. I encourage you to learn the official\
    \ API, because often… “there’s a node for that”.\n\nThere are many ways to skin\
    \ a cat, so to speak. The implementation of each Design pattern may possess alternative\
    \ and perhaps even better blueprint implementations. This book only provides one\
    \ example of many.\n\n> Blueprint Weirdness and Unconventional Methodologies\n\
    \n**Blueprint Interfaces**\n\nBlueprint scripting in Unreal has some different\
    \ ways of implementing traditional programming constructs. The most confusing\
    \ topic, especially coming from a software engineering background is the blueprint\
    \ interface. The blueprint interface is widely cited as being a “communication”\
    \ tool. I nearly had a panic attack when I heard Epic’s staff say this in a live\
    \ training stream. The same “communication” idea is echoed in the documentation.\
    \ I cannot tell you how many times I yelled at my computer screen while reading\
    \ documentation on blueprint interfaces. I would yell, “No, interfaces have nothing\
    \ to do with communication!” All interfaces do is define a guaranteed behavioral\
    \ contract for objects which implement them. Yet, I’m wrong. One must let go of\
    \ their traditional understanding of an interface. One must embrace the blueprint\
    \ interface “communication” deal. Before you think I’m bashing Unreal, let me\
    \ provide you with a great excerpt on blueprint interfaces from their documentation:\n\
    \n*“A Blueprint Interface is a collection of one or more functions - name only,\
    \ no implementation - that can be added to other Blueprints. Any Blueprint that\
    \ has the Interface added is guaranteed to have those functions…. This is essentially\
    \ like the concept of an interface in general programming”*\n\n*-https://docs.unrealengine.com/en-us/Engine/Blueprints/UserGuide/Types/Interface*\n\
    \n**Cannot spawn in construction script**\n\nThe heading is self-explanatory.\
    \ Why this poses a challenge when trying to construct objects in the “constructor”\
    \ is not intuitive. The construction script is executed before the game runs in\
    \ the editor. We cannot “spawn” objects without a world to spawn into. The workaround\
    \ was using the Add *Child Actor Component* node. There may be a better way, but\
    \ this works so far. We shy away from the extensive use of the construction script\
    \ in the C++ blueprints but make extensive use of it for the Java and C# implementation.\n\
    \n**Sequence Node Usage**\n\n![](Image00001.jpg) \n\nThere is heavy use of the\
    \ sequence node to encourage overall blueprint flow from top to bottom. This is\
    \ necessary for readability of larger blueprints. Most blueprints are generally\
    \ composed with a left to right flow. However, there is more space vertically\
    \ than horizontally in a book.\n\n**Collapse Node**\n\n![](Image00002.jpg) \n\n\
    The collapsed graph node is used to separate large blueprints into presentable\
    \ chunks.\n\n**Yellow Interface check**\n\n![](Image00003.jpg) \n\nThe collapsed\
    \ graph with a yellow hue represents an interface check. Specifically, it accepts\
    \ a test object and checks if it implements the target interface. There may be\
    \ a validity check on the test object depending on the source of the test object’s\
    \ source. This node is singled out because we will not always go inside this type\
    \ of collapsed graph for the sake of brevity.\n\n> Creational Patterns\n\nThe\
    \ creational patterns we discuss help to abstract the instantiation process. We\
    \ use creational patterns when we want to decouple a client from object it may\
    \ need instantiate. This is especially important. As the number of objects grow,\
    \ their behavior may begin to diverge. We cannot hardcode every object’s behavior\
    \ into the client. The client would turn into a monolithic mess and the blueprint\
    \ equivalent would be a nightmare to maintain.\n\n> Hotel Motel Holiday Inn… Builder\
    \ Pattern\n\nDo you want to encapsulate the creation of complex objects? The Builder\
    \ pattern might be for you. The Builder pattern seeks to decouple the construction\
    \ of complex objects from its actual representation (Gamma et.al, 1995). This\
    \ is done to create flexibility in the construction process because the “products”\
    \ implementations can be easily swapped in and out.\n\n**The Good**\n\n> ●  Decouple\
    \ construction of complex objects from representation\n\n> ●  Easily swap products\
    \ to be built/constructed\n\n> ●  Build objects in a step-by-step fashion\n\n\
    **The Not So Good**\n\n> ●  Necessary to create concrete builders for each product.\n\
    \n> ●  Some overlap with the Composite design pattern.\n\n**Builder Pattern Implementation**\n\
    \nWe want to build some lodgings in our game, namely hotels and motels. One can\
    \ easily replace “hotel” and “motel” with any other thing that needs to be built\
    \ step by step. However, the interface must be shared for the builder pattern\
    \ to make sense. For example, an airplane should not logical share the same construction\
    \ interface as a pizza...unless, NO!\n\nThe *Builder* class contains the main\
    \ function here. In terms of Blueprints, we can think of this class as the one\
    \ that needs to be physically dragged into the game world. The other “concrete”\
    \ classes do not need to be physically dragged into the world.\n\n***Builder_Main.h***\n\
    \n#pragma once#include \"CoreMinimal.h\"#include \"GameFramework/Actor.h\"#include\
    \ \"Builder_Main.generated.h\"UCLASS **()**class DESIGN_PATTERNS_API ABuilder_Main\
    \ **:** public AActor**{**GENERATED_BODY **()**public **:** // Sets default values\
    \ for this actor's propertiesABuilder_Main **();**private **:** //The Builder\
    \ ActorUPROPERTY **(** VisibleAnywhere **,** Category **=** \"Main\" **)** class\
    \ AHotelLodgingBuilder ***** HotelBuilder **;** //The Engineer ActorUPROPERTY\
    \ **(** VisibleAnywhere **,** Category **=** \"Main\" **)** class AArchitecturalEngineer\
    \ ***** Engineer **;**protected **:** // Called when the game starts or when spawned\
    \ virtual void BeginPlay **()** override **;**public **:** // Called every frame\
    \ virtual void Tick **(** float DeltaTime **)** override **;****};**\n\n***Builder_Main.cpp***\n\
    \n#include \"Builder_Main.h\"#include \"HotelLodgingBuilder.h\"#include \"ArchitecturalEngineer.h\"\
    #include \"Lodging.h\"// Sets default valuesABuilder_Main **::** ABuilder_Main\
    \ **()****{** // Set this actor to call Tick() every frame.  You can turn this\
    \ off to improve performance if you don't need it.PrimaryActorTick **.** bCanEverTick\
    \ **=** **true** **;****}**// Called when the game starts or when spawnedvoid\
    \ ABuilder_Main **::** BeginPlay **()****{**Super **::** BeginPlay **();** //Spawn\
    \ Builder and EngineerHotelBuilder **=** GetWorld **()->** SpawnActor **<** AHotelLodgingBuilder\
    \ **>(** AHotelLodgingBuilder **::** StaticClass **());**Engineer **=** GetWorld\
    \ **()->** SpawnActor **<** AArchitecturalEngineer **>(** AArchitecturalEngineer\
    \ **::** StaticClass **());** //Set the Builder for the Engineer and create the\
    \ buildingsEngineer **->** SetLodgingBuilder **(** HotelBuilder **);**Engineer\
    \ **->** ConstructLodging **();** //Get the Engineer's Lodging and Logs the created\
    \ buildingsALodging ***** Lodging **=** Engineer **->** GetLodging **();**Lodging\
    \ **->** LodgingCharacteristics **();****}**// Called every framevoid ABuilder_Main\
    \ **::** Tick **(** float DeltaTime **)****{**Super **::** Tick **(** DeltaTime\
    \ **);**"
