- fmt: "\nThe `Machine Has Dollars` collapsed graph:\n\n![Graphical user interface,\
    \ application Description automatically generated](Image00164.jpg) \n\nThe `Machine\
    \ Out of Dollars collapsed graph` collapsed graph:\n\n![A screenshot of a video\
    \ game Description automatically generated with medium confidence](Image00165.jpg)\
    \ \n\nThe `ToString` function:\n\n![Graphical user interface, application Description\
    \ automatically generated](Image00166.jpg) \n\nThe `State` interface:\n\n***State.h***\n\
    \n```cpp\n#pragma once\n#include \"CoreMinimal.h\"\n#include \"UObject/Interface.h\"\
    \n#include \"State.generated.h\"\n// This class does not need to be modified.\n\
    UINTERFACE( MinimalAPI )\nclass UState : public UInterface\n{\n    GENERATED_BODY()\n\
    };\n\nclass DESIGN_PATTERNS_API IState\n{\n    GENERATED_BODY()\n    // Add interface\
    \ functions to this class. This is the class that will be inherited to implement\
    \ this interface.\npublic:\n    //The pure virtual functions of the State\n  \
    \  virtual void InsertCoin() = 0;\n    virtual void RejectCoin() = 0;\n    virtual\
    \ void PullLever() = 0;\n    virtual void Payout() = 0;\n    virtual void RestockDollars()\
    \ = 0;\n    virtual FString ToString() = 0;\n    virtual void SetSlotMachine(class\
    \ AOldSchoolSlotMachine* SlotMachine) = 0;\n};\n```\n\n***State.cpp***\n\n```cpp\n\
    #include \"State.h\"\n// Add default functionality here for any IState functions\
    \ that are not pure virtual.\n```\n\nThe State pattern viewport print:\n\n![](Image00167.jpg)\
    \ \n\n> You Sunk My Battleship… Strategy Pattern\n\nThe GoF defines the Strategy\
    \ pattern as a “policy” (Gamma et.al, 1995). We would like to have a family of\
    \ algorithms be interchangeable and vary independently. This will become more\
    \ clear with the following example.\n\n**The Good**\n\n> ● Provides an alternative\
    \ to subclassing (Gamma et.al, 1995).\n\n**The Not So Good**\n\n> ● The numbers\
    \ of object may increase undesirably.\n\n### Strategy Pattern Implementation\n\
    \nWe have a strategy for combating different enemies at sea. The brute force strategy\
    \ is used if the threat is small. We use the divide and conquer strategy if there\
    \ are many enemies. The retreat strategy is executed if the battle is deemed futile.\
    \ The `Strategy_Main` class:\n\n***Strategy_Main.h***\n\n```cpp\n#pragma once\n\
    #include \"CoreMinimal.h\"\n#include \"GameFramework/Actor.h\"\n#include \"Strategy_Main.generated.h\"\
    \nUCLASS()\nclass DESIGN_PATTERNS_API AStrategy_Main : public AActor\n{\n    GENERATED_BODY()\n\
    public:\n    // Sets default values for this actor's properties\n    AStrategy_Main();\n\
    protected:\n    // Called when the game starts or when spawned\n    virtual void\
    \ BeginPlay() override;\npublic:\n    // Called every frame\n    virtual void\
    \ Tick(float DeltaTime) override;\n};\n```\n\n***Strategy_Main.cpp***\n\n```cpp\n\
    #include \"Strategy_Main.h\"\n#include \"BattleShip.h\"\n#include \"BruteForceStrategy.h\"\
    \n#include \"DivideConquerStrategy.h\"\n#include \"RetreatStrategy.h\"\n// Sets\
    \ default values\nAStrategy_Main::AStrategy_Main()\n{\n    // Set this actor to\
    \ call Tick() every frame.  You can turn this off to improve performance if you\
    \ don't need it.\n    PrimaryActorTick.bCanEverTick = true;\n}\n// Called when\
    \ the game starts or when spawned\nvoid AStrategy_Main::BeginPlay()\n{\n    Super::BeginPlay();\n\
    \    //Enemies alert log\n    GEngine->AddOnScreenDebugMessage(-1, 15.f, FColor::Yellow,\
    \ TEXT(\"A tiny frigate wants some trouble\"));\n    //Spawn the Battle Ship\n\
    \    ABattleShip* BattleShip = GetWorld()->SpawnActor<ABattleShip>(ABattleShip::StaticClass());\n\
    \    //Create the Brute Force Strategy and set it to the BattleShip\n    ABruteForceStrategy*\
    \ BruteForceStrategy = GetWorld()->SpawnActor<ABruteForceStrategy>(ABruteForceStrategy::StaticClass());\n\
    \    BattleShip->AlterManeuvers(BruteForceStrategy);\n    //Engage with the current\
    \ Strategy\n    BattleShip->Engage();\n    //Enemies alert log\n    GEngine->AddOnScreenDebugMessage(-1,\
    \ 15.f, FColor::Yellow, TEXT(\"Four tiny frigates want some trouble\"));\n   \
    \ //Create the Divide Conquer Strategy and set it to the Battle Ship\n    ADivideConquerStrategy*\
    \ DivideConquerStrategy = GetWorld()->SpawnActor<ADivideConquerStrategy>(ADivideConquerStrategy::StaticClass());\n\
    \    BattleShip->AlterManeuvers(DivideConquerStrategy);\n    //Engage with the\
    \ current Strategy\n    BattleShip->Engage();\n    //Enemies alert log\n    GEngine->AddOnScreenDebugMessage(-1,\
    \ 15.f, FColor::Yellow, TEXT(\"An aircraft carrier group wants some trouble\"\
    ));\n    //Create the Retreat Strategy and set it to the Battle Ship\n    ABreatStrategy*\
    \ RetreatStrategy = GetWorld()->SpawnActor<ABreatStrategy>(ABreatStrategy::StaticClass());\n\
    \    BattleShip->AlterManeuvers(RetreatStrategy);\n    //Engage with the current\
    \ Strategy\n    BattleShip->Engage();\n}\nvoid AStrategy_Main::Tick(float DeltaTime)\n\
    {\n    Strategy_Main::Tick(DeltaTime);\n}\n```\n\nThe `Strategy_Main` blueprint\
    \ event:\n\n![](Image00168.jpg) \n\nThe `Create BruteForceStrategy` graph:\n\n\
    ![](Image00169.jpg) \n\nThe `Create Battleship` graph:\n\n![](Image00170.jpg)\
    \ \n\nThe `Execute Brute Force Strategy` graph:\n\n![](Image00171.jpg) \n\nThe\
    \ `Execute Divide Conquer Strategy` graph:\n\n![](Image00172.jpg) \n\nThe `Execute\
    \ Retreat Strategy` graph:\n\n![](Image00173.jpg) \n\nThe `BattleShip` class:\n\
    \n***BattleShip.h***\n\n```cpp\n#pragma once\n#include \"CoreMinimal.h\"\n#include\
    \ \"GameFramework/Actor.h\"\n#include \"BattleStrategy.h\"\n#include \"BattleShip.generated.h\"\
    \nUCLASS()\nclass ABattleShip : public AActor\n{\n    GENERATED_BODY()\npublic:\n\
    \    ABattleShip();\nprivate:\n    //The current Strategy\n    IBattleStrategy*\
    \ BattleStrategy;\nprotected:\n    virtual void BeginPlay() override;\npublic:\n\
    \    virtual void Tick(float DeltaTime) override;\n    // Change the Maneuver\
    \ and set \"BattleStrategy\" variable\n    void AlterManeuvers(AActor* myBattleStrategy);\n\
    \    // Engage with the current Battle Strategy\n    void Engage();\n};\n```\n\
    \n***BattleShip.cpp***\n\n```cpp\n#include \"BattleShip.h\"\n// Sets default values\n\
    ABattleShip::ABattleShip()\n{\n}\nvoid ABattleShip::BeginPlay()\n{\n    Super::BeginPlay();\n\
    }\n// Called every frame\nvoid ABattleShip::Tick(float DeltaTime)\n{\n    Super::Tick(DeltaTime);\n\
    }\nvoid ABattleShip::AlterManeuvers(AActor* myBattleStrategy)\n{\n    //Try to\
    \ cast the passed Strategy and set it to the current\n    BattleStrategy = Cast<IBattleStrategy>(myBattleStrategy);\n\
    \    //Log Error if the cast failed\n    if (!BattleStrategy)\n    {\n       \
    \ GEngine->AddOnScreenDebugMessage(-1, 15.f, FColor::Red, TEXT(\"Invalid Cast!\
    \ See Output log for more details\"));\n        UE_LOG(LogTemp, Error, TEXT(\"\
    AlterManeuvers(): The Actor is not a BattleStrategy! Are you sure that the Actor\
    \ implements that interface?\"));\n    }\n}\nvoid ABattleShip::Engage()\n{\n \
    \   //Log Error if the current Strategy is NULL\n    if (!BattleStrategy)\n  \
    \  {\n        UE_LOG(LogTemp, Error, TEXT(\"Engage(): BattleStrategy is NULL,\
    \ make sure it's initialized.\"));\n        return;\n    }\n    //Execute the\
    \ current Strategy Maneuver\n    BattleStrategy->Maneuver();\n}\n```\n\nThe `BattleShip`\
    \ construction script:\n\n![Graphical user interface Description automatically\
    \ generated](Image00174.jpg) \n\nThe `AlterManeuvers` blueprint function:\n"
