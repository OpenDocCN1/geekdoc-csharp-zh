  trans: "\n}\n\n`Builder` 类的蓝图等价物：\n\n![图形用户界面描述](img/Image00004.jpg)\n\n`Set hotelBuilder`\
    \ 和 `Set engineer` 折叠图分别为：\n\n![](img/Image00005.jpg)\n\n以及\n\n![](img/Image00006.jpg)\n\
    \n`Set hotelBuilder` 折叠图代表了这一行代码：\n\n```cpp\nHotelBuilder = GetWorld()->SpawnActor<AHotelLodgingBuilder>(AHotelLodgingBuilder::StaticClass());\n\
    ```\n\n`Spawn Actor From Class` 节点类似于传统编程中的 `new` 关键字。要生成的类通过“Class”字样下的下拉框进行选择。Spawn\
    \ Transform 则取决于个人的特定场景。为了简单起见，我们只需右键点击 Spawn Transform 并选择“Promote to Variable”（提升为变量）。如果没有\
    \ Spawn Transform，蓝图将产生编译错误。在生成所需的 actor 后，我们设置（或“初始化”）了我们的 `hotelBuilder` 变量。\n\
    \n相同的基本思想也适用于 `Set engineer` 折叠图。然而，`Architectural Engineer` 需要一个 `LodgingBuilder`\
    \ 来为工程师设置 Builder，如此行代码所示：\n\n```cpp\nEngineer->SetLodgingBuilder(HotelBuilder);\n\
    ```\n\n稍后，我们不会对每一个生成活动进行如此详细的说明。请相信有很多生成它们的需求，讨论每一个细节将变成一项冗味的任务。\n\n`Builder_Main`\
    \ 蓝图继续通过 `Construct Lodging` 函数调用节点运行。该函数在我们之前生成的 `engineer` 上被调用。等价的代码行为：\n\n\
    ```cpp\nEngineer->ConstructLodging();\n```\n\n注意 `Builder_Main` 中的 `Sequence`\
    \ 节点。当 `Construct Lodging` 函数调用执行完毕后，Sequence 0 完成。然后 Sequence 1 开始执行。`Set lodging`\
    \ 折叠图如下：\n\n![](img/Image00007.jpg)\n\n现在，我们通过这行代码等价地执行了获取后设置的操作：\n\n```cpp\n\
    ALodging Lodging = Engineer->GetLodging();\n```\n\n最后这一行非模板化代码是：\n\n```cpp\nLodging->LodgingCharacteristics();\n\
    ```\n\n这行代码和等价蓝图将在稍后讨论。然而，我们需要进行一些验证检查，并确保我们确实构建了一个酒店。我们想要确保 `lodging` actor 实现了\
    \ `FloorPlan` 接口。`lodging isFloorPlan_int` 折叠图如下：\n\n![](img/Image00008.jpg)\n\
    \n今后我们将不再显示此接口检查折叠图。请注意，此项检查的折叠图始终带有黄色调。折叠节点内部唯一改变的项是我们正在检查的对象的目标接口。目标接口始终是折叠图名称的一部分。\n\
    \n现在我们可以讨论在此模式中使用的接口了。首先，我们为所有住宿创建一个平面图（floor plan）接口供实现。美国大多数商业住宿都包含泳池、大堂区域、房间和餐厅。我们还创建了一个住宿\
    \ builder 接口，供我们特定的住宿 builder 类实现。`FloorPlan` 接口：\n\n***FloorPlan.h***\n```cpp\n\
    #pragma once\n#include \"CoreMinimal.h\"\n#include \"UObject/Interface.h\"\n#include\
    \ \"FloorPlan.generated.h\"\n\n// 此类不需要修改。\nUINTERFACE(MinimalAPI)\nclass UFloorPlan\
    \ : public UInterface\n{\n    GENERATED_BODY()\n};\n\nclass DESIGN_PATTERNS_API\
    \ IFloorPlan\n{\n    GENERATED_BODY()\n    // 将接口函数添加到此类。这是将被继承以实现此接口的类。\npublic:\n\
    \    // FloorPlan 的纯虚函数\n    virtual void SetSwimmingPool(FString SwimmingPool)\
    \ = 0;\n    virtual void SetLobbyArea(FString LobbyArea) = 0;\n    virtual void\
    \ SetRooms(FString Rooms) = 0;\n    virtual void SetRestaurants(FString Restaurants)\
    \ = 0;\n};\n```\n\n***FloorPlan.cpp***\n```cpp\n#include \"FloorPlan.h\"\n// 为任何非纯虚的\
    \ IFloorPlan 函数在此添加默认功能。\n```\n\n等价的蓝图接口非常平庸。以下是代表 `FloorPlan` 接口中函数的节点。\n\n![](img/Image00009.jpg)[](Image00010.jpg)[](Image00011.jpg)[](Image00012.jpg)\n\
    \n俗语说道：“面向接口编程，而不是面向实现”（Gamma et.al, 1995）。事实上，这是面向对象设计的核心原则之一。面向接口编程的主要益处是减少了子系统之间的实现依赖（Gamma\
    \ et.al, 1995）。我们在我们的建造模式示例中直观地看到了这一点。具体来说，建造模式将复杂对象的构建过程与其实际表示解耦（Gamma et.al,\
    \ 1995）。\n\n`LodgingBuilder` 接口：\n\n***LodgingBuilder.h***\n```cpp\n#pragma once\n\
    #include \"CoreMinimal.h\"\n#include \"UObject/Interface.h\"\n#include \"LodgingBuilder.generated.h\"\
    \n\n// 此类不需要修改。\nUINTERFACE(MinimalAPI)\nclass ULodgingBuilder : public UInterface\n\
    {\n    GENERATED_BODY()\n};\n\nclass DESIGN_PATTERNS_API ILodgingBuilder\n{\n\
    \    GENERATED_BODY()\n    // 将接口函数添加到此类。这是将被继承以实现此接口的类。\npublic:\n    // LodgingBuilder\
    \ 的纯虚函数\n    virtual void BuildSwimmingPool() = 0;\n    virtual void BuildLobbyArea()\
    \ = 0;\n    virtual void BuildRooms() = 0;\n    virtual void BuildRestaurants()\
    \ = 0;\n    virtual class ALodging GetLodging() = 0;\n};\n```\n\n***LodgingBuilder.cpp***\n\
    ```cpp\n#include \"LodgingBuilder.h\"\n// 为任何非纯虚的 ILodgingBuilder 函数在此添加默认功能。\n\
    ```\n\n接下来，我们创建一个实现 `FloorPlan` 接口的 `Lodging` 类。\n\n***Lodging.h***\n\n"
- fmt: "\n```cpp\n#pragma once\n#include \"CoreMinimal.h\"\n#include \"GameFramework/Actor.h\"\
    \n#include \"FloorPlan.h\"\n#include \"Lodging.generated.h\"\n\nUCLASS()\nclass\
    \ DESIGN_PATTERNS_API ALodging : public AActor, public IFloorPlan\n{\n    GENERATED_BODY()\n\
    \npublic:\n    // Sets default values for this actor's properties\n    ALodging();\n\
    \nprivate:\n    //The Swimming Pool's name\n    FString SwimmingPool;\n    //\
    \ The Lobby Area's name\n    FString LobbyArea;\n    // The Rooms's name\n   \
    \ FString Rooms;\n    // The Restaurants's name\n    FString Restaurants;\n\n\
    protected:\n    // Called when the game starts or when spawned\n    virtual void\
    \ BeginPlay() override;\n\npublic:\n    // Called every frame\n    virtual void\
    \ Tick(float DeltaTime) override;\n    // Set the name of the Swimming Pool\n\
    \    void SetSwimmingPool(FString mySwimmingPool);\n    // Set the name of the\
    \ Lobby Area\n    void SetLobbyArea(FString myLobbyArea);\n    // Set the name\
    \ of the Rooms\n    void SetRooms(FString myRooms);\n    // Set the name of the\
    \ Restaurants\n    void SetRestaurants(FString myRestaurants);\n    // Logs all\
    \ the Lodging floors\n    void LodgingCharacteristics();\n};\n```\n\n`Lodging.cpp`\n\
    ```cpp\n#include \"Lodging.h\"\n\n// Sets default values\nALodging::ALodging()\n\
    {\n    // Set this actor to call Tick() every frame. You can turn this off to\
    \ improve performance if you don't need it.\n    PrimaryActorTick.bCanEverTick\
    \ = true;\n}\n\n// Called when the game starts or when spawned\nvoid ALodging::BeginPlay()\n\
    {\n    Super::BeginPlay();\n}\n\n// Called every frame\nvoid ALodging::Tick(float\
    \ DeltaTime)\n{\n    Super::Tick(DeltaTime);\n}\n\nvoid ALodging::SetSwimmingPool(FString\
    \ mySwimmingPool)\n{\n    // Set the name of the Swimming Pool with the passed\
    \ String\n    SwimmingPool = mySwimmingPool;\n}\n\nvoid ALodging::SetLobbyArea(FString\
    \ myLobbyArea)\n{\n    // Set the name of the Lobby Area with the passed String\n\
    \    LobbyArea = myLobbyArea;\n}\n\nvoid ALodging::SetRooms(FString myRooms)\n\
    {\n    // Set the name of the Rooms with the passed String\n    Rooms = myRooms;\n\
    }\n\nvoid ALodging::SetRestaurants(FString myRestaurants)\n{\n    // Set the name\
    \ of the Restaurants with the passed String\n    Restaurants = myRestaurants;\n\
    }\n\nvoid ALodging::LodgingCharacteristics()\n{\n    // Logs the name of each\
    \ floors\n    GEngine->AddOnScreenDebugMessage(-1, 15.f, FColor::Yellow, FString::Printf(TEXT(\"\
    %s\"), SwimmingPool));\n    GEngine->AddOnScreenDebugMessage(-1, 15.f, FColor::Yellow,\
    \ FString::Printf(TEXT(\"%s\"), LobbyArea));\n    GEngine->AddOnScreenDebugMessage(-1,\
    \ 15.f, FColor::Yellow, FString::Printf(TEXT(\"%s\"), Rooms));\n    GEngine->AddOnScreenDebugMessage(-1,\
    \ 15.f, FColor::Yellow, FString::Printf(TEXT(\"%s\"), Restaurants));\n}\n```\n\
    \nRemember the `LodgingCharacteristics` node in the main blueprint? Here it is:\n\
    \n![Graphical user interface Description automatically generated](Image00013.jpg)\n\
    \nThe Lodging blueprint also contains the events that will be called later by\
    \ the Architectural Engineer:\n\n![Graphical user interface, application Description\
    \ automatically generated](Image00014.jpg)\n\nBlueprints use `Event` nodes when\
    \ calling void interface functions. The blueprint version of the `Lodging` class\
    \ prints the string value passed to the function in addition to setting local\
    \ variables. Also, we must make sure this blueprint class implements the `FloorPlan`\
    \ interface by adding it in the class settings Interfaces sections.\n\nThe class\
    \ is the `HotelLodgingBuilder`. It implements the lodging builder interface and\
    \ provides the custom specs for each type of lodging.\n\n***HotelLodgingBuilder.h***\n\
    ```cpp\n#pragma once\n#include \"CoreMinimal.h\"\n#include \"GameFramework/Actor.h\"\
    \n#include \"LodgingBuilder.h\"\n#include \"HotelLodgingBuilder.generated.h\"\n\
    \nUCLASS()\nclass DESIGN_PATTERNS_API AHotelLodgingBuilder : public AActor, public\
    \ ILodgingBuilder\n{\n    GENERATED_BODY()\n\npublic:\n    // Sets default values\
    \ for this actor's properties\n    AHotelLodgingBuilder();\n\nprivate:\n    //The\
    \ Lodging Actor\n    UPROPERTY(VisibleAnywhere, Category=\"Hotel Lodging\")\n\
    \    class ALodging Lodging;\n\nprotected:\n    // Called when the game starts\
    \ or when spawned\n    virtual void BeginPlay() override;\n\npublic:\n    // Called\
    \ every frame\n    virtual void Tick(float DeltaTime) override;\n    //Create\
    \ the Swimming Pool\n    virtual void BuildSwimmingPool() override;\n    //Create\
    \ the Lobby Area\n    virtual void BuildLobbyArea() override;\n    //Create the\
    \ Restaurants\n    virtual void BuildRestaurants() override;\n    //Create the\
    \ Rooms\n    virtual void BuildRooms() override;\n    //Returns the Lodging\n\
    \    virtual ALodging GetLodging() override;\n};\n```\n\n`HotelLodgingBuilder.cpp`\n\
    ```cpp\n#include \"HotelLodgingBuilder.h\"\n#include \"Lodging.h\"\n\n// Sets\
    \ default values\nAHotelLodgingBuilder::AHotelLodgingBuilder()\n{\n}\n\n// Called\
    \ when the game starts or when spawned\nvoid AHotelLodgingBuilder::BeginPlay()\n\
    {\n    Super::BeginPlay();\n    //Spawn the Lodging\n    Lodging = GetWorld()->SpawnActor<ALodging>(ALodging::StaticClass());\n\
    \    //Attach it to the Builder (this)\n    Lodging->AttachToActor(this, FAttachmentTransformRules::KeepRelative);\n\
    }\n\n// Called every frame\nvoid AHotelLodgingBuilder::Tick(float DeltaTime)\n\
    {\n    Super::Tick(DeltaTime);\n}\n\nvoid AHotelLodgingBuilder::BuildSwimmingPool()\n\
    {\n    if (!Lodging)\n    {\n        UE_LOG(LogTemp, Error, TEXT(\"BuildSwimmingPool():\
    \ Lodging is NULL, make sure it's initialized.\n        return;\n    }\n    //Set\
    \ the Swimming Pool of the Lodging\n    Lodging->SetSwimmingPool(\"Indoor Lagoon\"\
    );\n}\n\nvoid AHotelLodgingBuilder::BuildLobbyArea()\n{\n    if (!Lodging)\n \
    \   {\n        UE_LOG(LogTemp, Error, TEXT(\"BuildLobbyArea(): Lodging is NULL,\
    \ make sure it's initialized.\n        return;\n    }\n    //Set the Lobby Area\
    \ of the Lodging\n    Lodging->SetLobbyArea(\"Grand Hall\");\n}\n\nvoid AHotelLodgingBuilder::BuildRestaurants()\n\
    {\n    if (!Lodging)\n    {\n        UE_LOG(LogTemp, Error, TEXT(\"BuildRestaurants():\
    \ Lodging is NULL, make sure it's initialized.\n        return;\n    }\n    //Set\
    \ the Restaurants of the Lodging\n    Lodging->SetRestaurants(\"5 star Buffet\"\
    );\n}\n\nvoid AHotelLodgingBuilder::BuildRooms()\n{\n    if (!Lodging)\n    {\n\
    \        UE_LOG(LogTemp, Error, TEXT(\"BuildRooms(): Lodging is NULL, make sure\
    \ it's initialized.\n        return;\n    }\n    //Set the Rooms of the Lodging\n\
    \    Lodging->SetRooms(\"Luxury Suites\");\n}\n\nALodging* AHotelLodgingBuilder::GetLodging()\n\
    {\n    //Returns the Lodging Actor of the Builder (this)\n    return Lodging;\n\
    }\n```\n\nThe *HotelLodgingBuilder* Event Begin Play section of the event graph:\n\
    \n![A screenshot of a video game Description automatically generated](Image00015.jpg)\n\
    \nThe remaining part of the *HotelLodgingBuilder* event graph:\n\n![](Image00016.jpg)\n\
    \nThe *isLodgingImplementInterface* function is a custom interface check function\
    \ like the yellow hued collapsed graphs.\n\nThe *isLodgingImplementInterface*\
    \ function:\n\n![](Image00017.jpg)\n\nNow we need an architectural engineer to\
    \ coordinate the step-by-step construction of the lodging.\n\n***ArchitecturalEngineer.h***\n"
