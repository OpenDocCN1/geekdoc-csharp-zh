    \ SlingShotObj)\n{\n    //Cast the passed Actor and set the Weapon\n    SlingShot\
    \ = Cast<ISlingShot>(SlingShotObj);\n    if (!SlingShot) //Log Error if cast fails\n\
    \    {\n        GEngine->AddOnScreenDebugMessage(-1, 15.f, FColor::Red, TEXT(\"\
    Invalid Cast! See Output log for more details\"));\n        UE_LOG(LogTemp, Error,\
    \ TEXT(\"SetSlingShot(): The Actor is not a SlingShot! Are you sure that the Actor\
    \ implements that interface?\"));\n    }\n}\nvoid AShooter::Sling()\n{\n    if\
    \ (!SlingShot)\n    {\n        UE_LOG(LogTemp, Error, TEXT(\"Sling(): SlingShot\
    \ is NULL, make sure it's initialized.\"));\n        return;\n    }\n    //Fire\n\
    \    SlingShot->Sling();\n}\n```\n\nWe can see that the `Shooter` class has no\
    \ functionality to fire a gun. However, it does have functionality to sling a\
    \ slingshot. Both skills are predicated on emitting a projectile from a weapon.\
    \ We would like to reuse the slingshot functionality and adapt it for the use\
    \ of a gun.\n\nThe `Shooter` construction script:\n\n![Graphical user interface,\
    \ application Description automatically generated](Image00067.jpg)\n\n### The\
    \ Is Sling Shot Macro:\n\n![A screenshot of a video game Description automatically\
