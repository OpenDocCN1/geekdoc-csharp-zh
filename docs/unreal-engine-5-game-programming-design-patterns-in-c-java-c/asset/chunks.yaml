    ```\n\nWe would implement some `OuterRealmPotionShop` concrete products in a similar\
    \ fashion as the concrete products of the `InnererRealmPotionShop`:\n\nThe Factory\
    \ Method viewport print:\n\n![](Image00054.jpg)\n\n# Programming Elitists’ Bane…\
    \ Singleton Pattern\n\nThe Singleton pattern is often singled out for being one\
    \ of, if not the worst commonly used design pattern. Singletons are like credit\
    \ cards. Everyone uses them, but you can get into a real predicament if you use\
    \ them irresponsibly. Programming purists loathe the Singleton pattern. In fact,\
    \ I have never seen any modern published literature discuss the Singleton pattern\
    \ without telling the reader avoid its use, ironically. The gang of four describe\
    \ a Singleton as a class possessing only one instance, and provides a global point\
    \ of access (Gamma et.al, 1995).\n\n## The Good\n\n- ● Encapsulates sole instance\n\
    - ● Global (ease of access)\n\n## The Not So Good\n\n- ● Global (ease of modification)\n\
    - ● May create unknown dependencies\n\n## Singleton Pattern Implementation\n\n\
    There is no clear-cut way to create a custom Singleton blueprint in Unreal. However,\
    \ it appears the Game Instance is a first party solution to the Singleton. An\
    \ inventory system is a great example for demonstrating the Singleton design pattern.\
    \ We only want one inventory instance at all times. Additionally, we want to be\
    \ able to easily access that inventory system throughout our game.\n\nThe main\
    \ Singleton class `Singleton_Main`:\n\n`Singleton_Main.h`\n\n```cpp\n#pragma once\n\
    #include \"CoreMinimal.h\"\n#include \"GameFramework/Actor.h\"\n#include \"Singleton_Main.generated.h\"\
    \n\nUCLASS()\nclass DESIGN_PATTERNS_API ASingleton_Main : public AActor\n{\n \
    \   GENERATED_BODY()\npublic:\n    // Sets default values for this actor's properties\n\
    \    ASingleton_Main();\nprivate:\n    //The Inventory of this Actor\n    UPROPERTY()\n\
    \    class AInventory* Inventory;\nprotected:\n    // Called when the game starts\
    \ or when spawned\n    virtual void BeginPlay() override;\npublic:\n    // Called\
    \ every frame\n    virtual void Tick(float DeltaTime) override;\n};\n```\n\n`Singleton_Main.cpp`\n\
    \n```cpp\n#include \"Singleton_Main.h\"\n#include \"Inventory.h\"\n\n// Sets default\
    \ values\nASingleton_Main::ASingleton_Main()\n{\n    // Set this actor to call\
    \ Tick() every frame. You can turn this off if you't need it.\n    PrimaryActorTick.bCanEverTick\
    \ = true;\n}\n\n// Called when the game starts or when spawned\nvoid ASingleton_Main::BeginPlay()\n\
    {\n    Super::BeginPlay();\n    //Create 4 Inventory\n    for (int i = 0; i <=\
    \ 4; i++)\n    {\n        AInventory* SpawnedInventory = GetWorld()->SpawnActor<AInventory>(AInventory::StaticClass());\n\
    \        if (SpawnedInventory)\n        {\n            //If the Spawn succeeds,\
    \ set the Spawned inventory to the local one and log the success string\n    \
    \        Inventory = SpawnedInventory;\n            GEngine->AddOnScreenDebugMessage(-1,\
    \ 15.f, FColor::Yellow, FString::Printf(TEXT(\"%s has been created\"), Inventory->GetName()));\n\
    \        }\n    }\n}\n\n// Called every frame\nvoid ASingleton_Main::Tick(float\
    \ DeltaTime)\n{\n    Super::Tick(DeltaTime);\n}\n```\n\nThe `Singleton_Main` blueprint\
    \ event graph:\n\n![](Image00055.jpg)\n\nThe for loop is present to demonstrate\
    \ attempts to try to create more than one instance of our designated Singleton\
    \ object. We should never be allowed to create multiple instances of our inventory\
    \ If everything is set up correctly.\n\nThe `Create_Inventory_Instance` collapsed\
    \ graph:\n\n![](Image00056.jpg)\n\nThe `Instance_Created_Message` collapsed graph:\n\
    \n![](Image00057.jpg)\n\nThe `Inventory` class:\n\n`Inventory.h`\n\n```cpp\n#pragma\
    \ once\n#include \"CoreMinimal.h\"\n#include \"GameFramework/Actor.h\"\n#include\
    \ \"Inventory.generated.h\"\n\nUCLASS()\nclass DESIGN_PATTERNS_API AInventory\n\
    {\n    GENERATED_BODY()\npublic:\n    // Sets default values for this actor's\
    \ properties\n    AInventory();\n    //The instance of this Class\n    UPROPERTY()\n\
    \    class AInventory* Instance;\nprotected:\n    // Called when the game starts\
    \ or when spawned\n    virtual void BeginPlay() override;\npublic:\n    // Called\
    \ every frame\n    virtual void Tick(float DeltaTime) override;\n};\n```\n\n`Inventory.cpp`\n"
