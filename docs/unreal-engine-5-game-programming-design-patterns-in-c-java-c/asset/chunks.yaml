    \ automatically generated](Image00112.jpg)\n\n# Behavioral Patterns (Java)\n\n\
    The behavioral patterns we discuss help determine how objects interact. Additionally,\
    \ object responsibilities are defined in behavioral patterns as well. We must\
    \ mention communication in are behavioral pattern overview. Runtime communication\
    \ between objects is a staple in behavioral pattern implementations.\n\n# The\
    \ Freaks Come out at night Observer Pattern (Java)\n\n## Observer Pattern UML\n\
    \n![Diagram Description automatically generated](Image00241.jpg)\n\n## Observer\
    \ Pattern Implementation\n\nA clock tower is our publisher for the Observer pattern.\
    \ The subscribers consist of a group of freaks who change their behavior based\
    \ on the time of day. The freaks receive notifications from the clock tower when\
    \ the clock towers time state has changed. The `Observer_Main` class:\n\n```java\n\
    public class Observer_Main {\n    public static void main(String[] args) {\n \
    \       ClockTower clockTower = new ClockTower();\n        FreakyAllen freakyAllen\
    \ = new FreakyAllen(clockTower);\n        FreakySue freakySue = new FreakySue(clockTower);\n\
    \        FreakyJeff freakyJeff = new FreakyJeff(clockTower);\n        clockTower.setTimeOfDay(\"\
    Morning\");\n        clockTower.setTimeOfDay(\"Midday\");\n        clockTower.setTimeOfDay(\"\
    Evening\");\n    }\n}\n```\n\nThe `Observer_Main` blueprint event graph:\n\n![A\
    \ screenshot of a computer Description automatically generated with medium confidence](Image00242.jpg)\n\
    \nThe `Create ClockTower` collapsed graph:\n\n![Graphical user interface, application\
    \ Description automatically generated](Image00243.jpg)\n\nThe `Create FreakyAlien`\
    \ collapsed graph:\n\n![Graphical user interface, text, application, chat or text\
    \ message Description automatically generated](Image00244.jpg)\n\nLet’s implement\
    \ the `Subscriber` interface:\n\n```java\npublic interface Subscriber {\n    public\
    \ void update(String time);\n}\n```\n\nLet’s implement the `Publisher` interface:\n\
    \n```java\npublic interface Publisher {\n    public void subscribe(Subscriber\
    \ s);\n    public void unsubscribe(Subscriber s);\n    public void notifySubscribers();\n\
    }\n```\n"
