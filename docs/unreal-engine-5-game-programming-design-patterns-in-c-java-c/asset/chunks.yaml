    \ application Description automatically generated](Image00111.jpg)\n\nThe Façade\
    \ pattern viewport print:\n\n![](Image00112.jpg)\n\n## Behavioral Patterns\n\n\
    The behavioral patterns we discuss help us determine how objects interact. Additionally,\
    \ object responsibilities are defined in behavioral patterns as well. We must\
    \ mention communication in are behavioral pattern overview. Runtime communication\
    \ between objects is a staple in behavioral pattern implementations.\n\n### The\
    \ Freaks Come out at night… Observer Pattern\n\nThe Observer pattern is a very\
    \ popular pattern used throughout many different software develop paradigms. Another\
    \ name for this pattern is the publisher subscriber pattern. We have a publisher\
    \ who broadcasts state changes and subscribers who listen for said broadcasts.\n\
    \n**The Good**\n\n> ● Great way to abstract publisher away from subscribers\n\
    > ● Publisher need not know anything about subscribers\n\n**The Not So Good**\n\
    \n> ● Special care must be taken to unsubscribe due to what GoF calls “dangling\
    \ references.”\n\n#### Observer Pattern Implementation\n\nA clock tower is our\
    \ publisher for the Observer pattern example. The subscribers consist of a group\
    \ of freaks who change their behavior based on the time of day. The freaks receive\
    \ notifications from the clock tower when the clock towers time state has changed.\
    \ The `Observer_Main` class:\n\n***Observer_Main.h***\n```cpp\n#pragma once\n\
    #include \"CoreMinimal.h\"\n#include \"GameFramework/Actor.h\"\n#include \"Observer_Main.generated.h\"\
    \n\nUCLASS()\nclass DESIGN_PATTERNS_API AObserver_Main : public AActor\n{\n  \
    \  GENERATED_BODY()\npublic:\n    // Sets default values for this actor's properties\n\
    \    AObserver_Main();\nprotected:\n    // Called when the game starts or when\
    \ spawned\n    virtual void BeginPlay() override;\npublic:\n    // Called every\
    \ frame\n    virtual void Tick(float DeltaTime) override;\n};\n```\n\n***Observer_Main.cpp***\n\
    ```cpp\n#include \"Observer_Main.h\"\n#include \"ClockTower.h\"\n#include \"FreakyAllen.h\"\
    \n#include \"FreakyJeff.h\"\n#include \"FreakySue.h\"\n\n// Sets default values\n\
    AObserver_Main::AObserver_Main()\n{\n    // Set this actor to call Tick() every\
    \ frame. You can turn this off to improve performance if you don't need it.\n\
    \    PrimaryActorTick.bCanEverTick = true;\n}\n\n// Called when the game starts\
    \ or when spawned\nvoid AObserver_Main::BeginPlay()\n{\n    Super::BeginPlay();\n\
    \    //Spawn the Clock Tower\n    AClockTower* ClockTower = GetWorld()->SpawnActor<AClockTower>(AClockTower::StaticClass());\n\
    \    //Spawn the first Subscriber and set its Clock Tower\n    AFreakyAllen* FreakyAllen\
    \ = GetWorld()->SpawnActor<AFreakyAllen>(AFreakyAllen::StaticClass());\n    FreakyAllen->SetClockTower(ClockTower);\n\
    \    //Spawn the second Subscriber and set its Clock Tower\n    AFreakyJeff* FreakyJeff\
    \ = GetWorld()->SpawnActor<AFreakyJeff>(AFreakyJeff::StaticClass());\n    FreakyJeff->SetClockTower(ClockTower);\n\
    \    //Spawn the third Subscriber and set its Clock Tower\n    AFreakySue* FreakySue\
    \ = GetWorld()->SpawnActor<AFreakySue>(AFreakySue::StaticClass());\n    FreakySue->SetClockTower(ClockTower);\n\
    \    //Change the time of the Clock Tower, so the Subscribers can execute their\
    \ own routine\n    ClockTower->SetTimeOfDay(\"Morning\");\n    ClockTower->SetTimeOfDay(\"\
    Midday\");\n    ClockTower->SetTimeOfDay(\"Evening\");\n}\n\n// Called every frame\n\
    void AObserver_Main::Tick(float DeltaTime)\n{\n    Super::Tick(DeltaTime);\n}\n\
    ```\n\nThe `Observer_Main` blueprint event graph:\n\n![Graphical user interface\
