    public class FreakyAlien : Subscriber, Morph { \n    private String time; \n \
    \   private Publisher clockTower; \n    public FreakyAlien(Publisher clockTower)\
    \ { \n        this.clockTower = clockTower;\n        clockTower.subscribe(this);\
    \ \n    } \n    public void update(String time) { \n        this.time = time;\n\
    \        morph(); \n    } \n    public void morph() { \n        if (time.Equals(\"\
    Morning\")) {\n            Console.WriteLine(\"It is \" + time + \", so FreakyAlien\
    \ makes a bowl of cereal\"); \n        } \n        else if (time.Equals(\"Midday\"\
    )) {\n            Console.WriteLine(\"It is: \" + time + \", so FreakyAlien's\
    \ right eye starts to twitch\"); \n        } \n        else if (time.Equals(\"\
    Evening\")) {\n            Console.WriteLine(\"It is: \" + time + \", so FreakyAlien\
    \ morphs into a blood sucking wogglesnort\"); \n        } \n    }\n}\n```\n\n\
