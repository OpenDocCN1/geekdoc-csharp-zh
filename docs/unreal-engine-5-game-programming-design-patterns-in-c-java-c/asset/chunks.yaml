    \ blueprint event graph:\n\n![](Image00179.jpg) \n\nThe Strategy pattern viewport\
    \ print:\n\n![](Image00180.jpg) \n\n> Creational Patterns (Java)\n\n> Hotel Motel\
    \ Holiday Inn… Builder Pattern (Java)\n\n**Builder Pattern UML Diagram**\n\n![Timeline\
    \ Description automatically generated with medium confidence](Image00181.jpg)\
    \ \n\n**Builder Pattern Implementation**\n\nThe *Builder* class contains the main\
    \ function in Java. In terms of Blueprints, we can think of this class as the\
    \ one that actually needs to be physically dragged into the game world. The other\
    \ “concrete” classes do not need to be physically dragged into the world.\n\n\
    class Builder_Main**{** public static void main **(** String **[]** args **)**\
    \ **{**LodgingBuilder hotelBuilder **=** **new** HotelLodgingBuilder **();**ArchitecturalEngineer\
    \ engineer **=** **new** ArchitecturalEngineer **(** hotelBuilder **);**engineer\
    \ **.** constructLodging **();**Lodging lodging **=** engineer **.** getLodging\
    \ **();**lodging **.** lodgingCharacteristics **();** **}****}**\n\nThe blueprint\
    \ equivalent of the *Builder_Main* class:\n\n![Graphical user interface Description\
    \ automatically generated](Image00182.jpg) \n\nThe *Set hotelBuilder* and *Set\
    \ engineer* collapsed graph are respectively:\n\n![Graphical user interface, application\
    \ Description automatically generated](Image00005.jpg) \n\nand\n\n![Graphical\
    \ user interface, text, application Description automatically generated](Image00006.jpg)\
    \ \n\nThe *Set hotelBuilder* collapsed graph represents this line of code:\n\n\
    LodgingBuilder hotelBuilder **=** **new** HotelLodgingBuilder **();**"
