    }\n\nvoid AClockTower::TimeChanged()\n{\n    // 当时间改变时，此钟塔（作为一个发布者）通知所有订阅者时间已改变\n\
    \    NotifySubscribers();\n}\n\nvoid AClockTower::SetTimeOfDay(FString myTime)\n\
    {\n    // 使用传入的参数设置时间并警告时间已改变\n    Time = myTime;\n    TimeChanged();\n}\n```\n\
