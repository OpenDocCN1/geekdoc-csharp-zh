    The Observer pattern viewport print:\n\n![](Image00132.jpg) \n\n# Make It Rain…\
    \ State Pattern\n\nThe GoF describes the State pattern as allowing object to change\
    \ their behavior when their internal state changes (Gamma et.al, 1995).\n\n##\
    \ The Good\n\n> ● Localizes state specific behavior (Gamma et.al, 1995).\n\n##\
    \ The Not So Good\n\n> ● Fairly similar to the Strategy pattern\n\n## State Pattern\
    \ Implementation\n\nWe are going to implement an old school slot machine. As we\
    \ know, there are a few states the slot machine can assume. These states are no\
    \ coin inserted, coin inserted, no dollars, won dollars. The `State_Main` class:\n\
    \n```cpp\n#pragma once\n#include \"CoreMinimal.h\"\n#include \"GameFramework/Actor.h\"\
    \n#include \"State_Main.generated.h\"\n\nUCLASS()\nclass AState_Main : public\
    \ AActor\n{\n    GENERATED_BODY()\n\npublic:\n    AState_Main();\n\nprotected:\n\
    \    virtual void BeginPlay() override;\n\npublic:\n    virtual void Tick(float\
    \ DeltaTime) override;\n};\n```\n\n```cpp\n#include \"State_Main.h\"\n#include\
    \ \"OldSchoolMachine.h\"\n\n// Sets default values\nAState_Main::AState_Main()\n\
    {\n    // Set this actor to call Tick() every frame.  You can turn this off to\
    \ improve performance if you don't need it.\n    PrimaryActorTick.bCanEverTick\
    \ = true;\n}\n\n// Called when the game starts or when spawned\nvoid AState_Main::BeginPlay()\n\
    {\n    Super::BeginPlay();\n    //Create the Slot Machine and set its Dollars\
    \ to 100\n    OldSchoolMachine* OldSchoolMachine = GetWorld()->SpawnActor<AOldSchoolMachine>();\n\
    \    //Log the current state\n    GEngine->AddOnScreenDebugMessage(-1, 15.f, FColor::Yellow,\
    \ FString::Printf(TEXT(\"It is %s, so FreakyAllen makes a bowl of cereal\"), OldSchoolMachine->GetState()));\n\
    \    //Insert coin and Pull the lever\n    OldSchoolMachine->InsertCoin();();\n\
    \    GEngine->AddOnScreenDebugMessage(-1, 15.f, FColor::Yellow, FString::Printf(TEXT(\"\
    It is %s, so FreakyAllen's right eye starts to twitch\"), OldSchoolMachine->GetState()));\n\
    \    //Insert coin, Pull the lever, then insert coin again\n    OldSchoolMachine->InsertCoin();\n\
    \    OldSchoolMachine->PullLever();\n    OldSchoolMachine->InsertCoin();\n   \
    \ //Log the current state\n    GEngine->AddOnScreenDebugMessage(-1, 15.f, FColor::Yellow,\
    \ FString::Printf(TEXT(\"It is %s, so FreakyAllen morphs into a blood sucking\
    \ wogglesnort\"), OldSchoolMachine->GetState()));\n    //Pull the lever\n    OldSchoolMachine->PullLever();\n\
    \    //Add 100 Dollars\n    OldSchoolMachine->RestockDollars(100);\n    //Insert\
    \ coin and Pull the lever\n    OldSchoolMachine->InsertCoin();\n    OldSchoolMachine->PullLever();\n\
    \    //Log the current state\n    GEngine->AddOnScreenDebugMessage(-1, 15.f, FColor::Yellow,\
    \ FString::Printf(TEXT(\"It is %s, so FreakyAllen makes a bowl of cereal\"), OldSchoolMachine->GetState()));\n\
    }\n\n// Called every frame\nvoid AState_Main::Tick(float DeltaTime)\n{\n    Super::Tick(DeltaTime);\n\
    }\n```\n\nThe `State_Main` blueprint event graph:\n\n![](Image00133.jpg) \n\n\
