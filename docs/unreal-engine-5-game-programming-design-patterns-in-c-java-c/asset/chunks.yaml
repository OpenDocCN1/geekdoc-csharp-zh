    \ 0)\n    {\n        Count -= 50;\n    }\n}\n\nvoid AOldSchoolSlotMachine::SetState(IState*\
    \ myState)\n{\n    // 使用传递的状态设置当前状态\n    State = myState;\n}\n\nIState* AOldSchoolSlotMachine::GetState()\n\
    {\n    // 返回当前状态\n    return State;\n}\n\nIState* AOldSchoolSlotMachine::GetNoDollarsState()\n\
    {\n    // 返回无金额状态\n    return NoDollarsState;\n}\n\nIState* AOldSchoolSlotMachine::GetNoCoinState()\n\
