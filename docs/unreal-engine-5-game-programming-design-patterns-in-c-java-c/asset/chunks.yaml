    \n### Let’s implement the `Subscriber` interface:\n\n```csharp\nusing System;\n\
    public interface Subscriber { \n    public void update(String time);\n}\n```\n\
    \n### Let’s implement the `Publisher` interface:\n\n```csharp\npublic interface\
    \ Publisher { \n    public void subscribe(Subscriber s); \n    public void unsubscribe(Subscriber\
    \ s); \n    public void notifySubscribers();\n}\n```\n\n### The `ClockTower` class:\n\
    \n```csharp\nusing System;\nusing System.Collections.Generic;\npublic class ClockTower\
    \ : Publisher { \n    private List<Subscriber> subscribers; \n    private String\
    \ time; \n    public ClockTower() { \n        subscribers = new List<Subscriber>();\
    \ \n    } \n    public void subscribe(Subscriber s) { \n        subscribers.Add(s);\
    \ \n    } \n    public void unsubscribe(Subscriber s) { \n        int i = subscribers.IndexOf(s);\
    \ \n        if (i >= 0) \n            subscribers.RemoveAt(i); \n    } \n    public\
    \ void notifySubscribers() { \n        foreach (Subscriber subscriber in subscribers)\
    \ { \n            subscriber.update(time); \n        } \n    } \n    public void\
    \ timeChanged() { \n        notifySubscribers(); \n    } \n    public void setTimeOfDay(String\
    \ time) { \n        this.time = time;\n        timeChanged(); \n    } \n    public\
    \ String getTime() { \n        return time; \n    }\n}\n```\n\n### The `ClockTower`\
    \ blueprint event graph:\n\n![Graphical user interface, application Description\
