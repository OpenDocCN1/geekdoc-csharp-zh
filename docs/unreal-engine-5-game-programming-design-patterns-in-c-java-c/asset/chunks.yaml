  trans: "\n\n# 引言\n\n本书并不是关于蓝图（Blueprint）设计、人工智能、用户界面、动画等方面的蓝图教程。示例中的实现非常简单，例如将字符串打印到屏幕/视口。为此，本书的重点放在了设计模式本身，而不是虚幻引擎中的各种花架哨。在这一点上，我们进行了非常仔细的考虑和处理，以减少过时性。虚幻引擎的更新非常频繁，导致大部分出版物在正式发表时几乎已经过时了。\n\
    \n此外，这并不是一本“最佳实践”书籍。请不要将本书作为蓝图最佳实践的参考。本书尝试尽可能遵循“等效”的代码逻辑。为了实现这一目标，我们可能会偏离蓝图的最佳实践，以尽可能真实地模拟代码中的编写方式。Epic\
    \ 费了大量精力在蓝图中抽象化了常见的编程任务。我鼓励你去学习官方 API，因为很多时候……“会有对应的节点（Node）”。\n\n俗俗说，“死猫有十种死”。每种设计模式的实现都可能存在替代的甚至更好的蓝图实现方式。本书仅提供了许多示例中的一种。\n\
    \n## 蓝图的怪异与非传统方法论\n\n### 蓝图接口 (Blueprint Interfaces)\n\n虚幻引擎中的蓝图脚本在实现传统编程构造方面有一些不同。最让人困惑的话题（特别是对于软件工程背景的人）是蓝图接口。蓝图接口被广泛引用为“通信”工具。当我听到\
    \ Epic 的员工在直播培训中这样说时，我几乎几乎发作。文档中也呼应了同样的“通信”概念。我无法告诉你我在阅读蓝图接口的文档时对着电脑屏幕大喊了多少。我会大喊：“不，接口和通信毫无关系！”接口的所有作用只是为实现它的对象定义一个保证的行为契约。然而，我是错的。人们必须放弃对接口的传统理解。必须接受蓝图接口的“通信”设定。在你认为我在抨击虚幻引擎之前，让我为你提供一段来自官方文档关于蓝图接口的精彩摘录：\n\
    \n*“蓝图接口是一个一个或多个函数的集合——仅有名称，没有实现——它可以被添加到其他蓝图中。任何添加了该接口的蓝图都保证拥有这些函数……这在本质上类似于通用编程中的接口概念”*\n\
    \n*-`https://docs.unrealengine.com/en-us/Engine/Blueprints/UserGuide/Types/Interface`*\n\
    \n### 不能在构造脚本（Construction Script）中生成\n\n这个标题自言易懂。为什么在尝试在“构造函数”构建对象时会面临挑战这并不直观。构造脚本是在编辑器运行游戏之前执行的。如果没有可以生成的区域（World），我们就无法“生成”对象。解决方法是使用\
    \ `Add Actor Component` 节点。可能有更好的方法，但到目前为止这种是有效的。我们在 C++ 蓝图中避免大量使用构造脚本，但在 Java\
    \ 和 C# 的实现中大量使用了。\n\n### 序列节点 (Sequence Node) 的用法\n\n![](img/Image00001.jpg) \n\
    \n大量使用序列节点来鼓励蓝图整体流程从上到下。这对于大型蓝图的可读性是必要的。大多数蓝图通常是从左到右流向构建的。然而，书籍的垂直空间比水平空间大。\n\n\
    ### 折叠节点 (Collapse Node)\n\n![](img/Image00002.jpg) \n\n折叠图节点用于将大型蓝图拆分为易于展示的区块。\n\
    \n### 黄色接口 (Yellow Interface)\n\n![](img/Image00003.jpg)\n\n带有黄色调的折叠图表示接口。具体来说，它接受一个对象并检查它是否实现了目标。为了简洁，该节点在图中被单独列出。\n\
    \n## 创建模式 (Creational Patterns)\n\n创建模式有助于抽象实例化过程。当我们想要将对象与客户端解耦时，使用创建模式。随着对象数量的增加，它们的行为可能会产生。我们不能将每个对象硬编码到客户端中。\n\
    \n### 建造者模式 (Builder Pattern)\n\n你想封装复杂对象的创建过程吗？建造者模式寻求将构建与实际表示解耦。产品可以容易地切换。\n\
    \n#### 优点\n- 将对象的构建与表示解耦——轻松切换要构建的产品\n- 以分步的方式进行构建\n\n#### 缺点\n- 需要为每个产品创建建造者\n\
    - 与某些设计模式有重叠\n\n### 建造者实现\n\n我们想在游戏中建造一些住宿设施，即酒店和旅馆。人们可以轻松地将“酒店”和“旅馆”替换为任何需要构建的东西。然而，必须共享接口，建造者模式才有意义。例如，在蓝图中，我们可以将这个类视为需要物理性地拖入世界中的类。其他的“具体”类则不需要拖入世界。\n\
    \n***Builder_Main.h***\n```cpp\n#pragma once\n#include \"CoreMinimal.h\"\n#include\
    \ \"GameFramework/Actor.h\"\n#include \"Builder_Main.generated.h\"\n\nUCLASS()\n\
    class DESIGN_PATTERNS_API ABuilder_Main : public AActor\n{\n    GENERATED_BODY()\n\
    \npublic:\n    // 设置此 actor 的默认值\n    ABuilder_Main();\n\nprivate:\n    // 建造者\
    \ Actor\n    UPROPERTY(VisibleAnywhere, Category = \"Main\")\n    class AHotelLodgingBuilder*\
    \ HotelBuilder;\n\n    // 工程师 Actor\n    UPROPERTY(VisibleAnywhere, Category =\
    \ \"Main\")\n    class AArchitecturalEngineer* Engineer;\n\nprotected:\n    //\
    \ 当游戏开始或生成时调用\n    virtual void BeginPlay() override;\n\npublic:\n    // 每帧调用\n\
    \    virtual void Tick(float DeltaTime) override;\n};\n```\n\n***Builder_Main.cpp***\n\
    ```cpp\n#include \"Builder_Main.h\"\n#include \"HotelLodgingBuilder.h\"\n#include\
    \ \"ArchitecturalEngineer.h\"\n#include \"Lodging.h\"\n\n// 设置默认值\nABuilder_Main::ABuilderMain()\n\
    {\n    // 设置此 actor 每帧调用 Tick。如果不需要，可以关闭它。\n    PrimaryActorTick.bCanEverTick\
    \ = true;\n}\n\n// 当游戏开始或生成时调用\nvoid ABuilder_Main::BeginPlay()\n{\n    Super::BeginPlay();\n\
    \n    // 生成建造者和工程师\n    HotelBuilder = GetWorld()->SpawnActor<AHotelLodgingBuilder>(AHotelLodgingBuilder::StaticClass());\n\
    \    Engineer = GetWorld()->SpawnActor<AArchitecturalEngineer>(AArchitecturalEngineer::StaticClass());\n\
    \n    // 为工程师设置建造者并构建建筑\n    Engineer->SetLodgingBuilder(HotelBuilder);\n    Engineer->ConstructLodging();\n\
    \n    // 获取工程师的住宿并记录生成的建筑\n    ALodging* Lodging = Engineer->GetLodging();\n \
    \   Lodging->LodgingCharacteristics();\n}\n\n// 每帧调用\nvoid ABuilder_Main::Tick(float\
    \ DeltaTime)\n{\n    Super::Tick(DeltaTime);\n}\n```\n\n"
- fmt: "\n}\n\nThe blueprint equivalent of the `Builder` class:\n\n![Graphical user\
    \ interface Description automatically generated](Image00004.jpg)\n\nThe `Set hotelBuilder`\
    \ and `Set engineer` collapsed graph are respectively:\n\n![](Image00005.jpg)\n\
    \nand\n\n![](Image00006.jpg)\n\nThe `Set hotelBuilder` collapsed graph represents\
    \ this line of code:\n\n```cpp\nHotelBuilder = GetWorld()->SpawnActor<AHotelLodgingBuilder>(AHotelLodgingBuilder::StaticClass());\n\
    ```\n\nThe `Spawn Actor From Class` node is akin to the `new` keyword in traditional\
    \ programming. The class to spawn is chosen using the dropdown box under the word\
    \ “Class”. The Spawn Transform is to one’s own specific scenario. For simplicity,\
    \ we can just right click on the Spawn Transform and choose “Promote to Variable”.\
    \ If there is no Spawn Transform then the blueprint will compile with errors.\
    \ We set (or “initialize”) our `hotelBuilder` variable once the desired actor\
    \ is spawned.\n\nThe same basic idea applies to the `Set engineer` collapsed graph.\
    \ However, `Architectural Engineer` needs a `LodgingBuilder` to set the Builder\
    \ for the Engineer as expressed in this line of code:\n\n```cpp\nEngineer->SetLodgingBuilder(HotelBuilder);\n\
    ```\n\nLater, we will not be going into such detail on every spawning activity.\
    \ Trust that there are many, many spawn actor requirements, and discussing each\
    \ one will become an exercise in tedium.\n\nThe `Builder_Main` blueprint continues\
    \ with the `Construct Lodging` function call node. This function is called on\
    \ the `engineer` we spawned previously. The equivalent line of code:\n\n```cpp\n\
    Engineer->ConstructLodging();\n```\n\nNote the `Sequence` node in `Builder_Main`.\
    \ Sequence 0 finishes once the `Construct Lodging` function call executes. Sequence\
    \ 1 then starts executing. The `Set lodging` collapsed graph:\n\n![](Image00007.jpg)\n\
    \nNow, we are equivalently executing this get then set with this line of code:\n\
    \n```cpp\nALodging Lodging = Engineer->GetLodging();\n```\n\nThis last line of\
    \ non-boilerplate code is:\n\n```cpp\nLodging->LodgingCharacteristics();\n```\n\
    \nThis line of code and equivalent blueprint will be discussed in a moment. However,\
    \ we need to make some validation checks and make sure we built a hotel. We want\
    \ to make sure the `lodging` actor implements the `FloorPlan` interface. The `lodging\
    \ isFloorPlan_int` collapsed graph:\n\n![](Image00008.jpg)\n\nGoing forward we\
    \ will not be showing this interface check collapsed graph. Note, the collapsed\
    \ graph for this check always possesses a yellow hue. The only item that changes\
    \ inside the collapsed node is the target interface we are checking the object\
    \ against. The target interface is always part of the collapsed graph name.\n\n\
    Now we can discuss the interfaces we use in this pattern. First, we create a floor\
    \ plan interface for all lodgings to implement. Most commercial lodgings in the\
    \ USA contain a pool, lobby area, rooms, and restaurants. We also create a lodging\
    \ builder interface for our specific lodging builder classes to implement. The\
    \ `FloorPlan` interface:\n\n***FloorPlan.h***\n```cpp\n#pragma once\n#include\
    \ \"CoreMinimal.h\"\n#include \"UObject/Interface.h\"\n#include \"FloorPlan.generated.h\"\
    \n\n// This class does not need to be modified.\nUINTERFACE(MinimalAPI)\nclass\
    \ UFloorPlan : public UInterface\n{\n    GENERATED_BODY()\n};\n\nclass DESIGN_PATTERNS_API\
    \ IFloorPlan\n{\n    GENERATED_BODY()\n    // Add interface functions to this\
    \ class. This is the class that will be inherited to implement this interface.\n\
    public:\n    //The pure virtual functions of the FloorPlan \n    virtual void\
    \ SetSwimmingPool(FString SwimmingPool) = 0;\n    virtual void SetLobbyArea(FString\
    \ LobbyArea) = 0;\n    virtual void SetRooms(FString Rooms) = 0;\n    virtual\
    \ void SetRestaurants(FString Restaurants) = 0;\n};\n```\n\n***FloorPlan.cpp***\n\
    ```cpp\n#include \"FloorPlan.h\"\n// Add default functionality here for any IFloorPlan\
    \ functions that are not pure virtual.\n```\n\nThe equivalent blueprint interface\
    \ is very mundane. The following are the nodes representing the functions in the\
    \ `FloorPlan` interface.\n\n![](Image00009.jpg)![](Image00010.jpg)![](Image00011.jpg)![](Image00012.jpg)\n\
    \nThe saying goes, “Program to an Interface, not an implementation” (Gamma et.al,\
    \ 1995). In fact, it is a core principle in object-oriented design. The main benefit\
    \ of programming to an interface is that it reduces implementation dependencies\
    \ between subsystems (Gamma et.al, 1995). We see this first hand in our Builder\
    \ Pattern example. Specifically, The Builder pattern seeks to decouple the construction\
    \ of complex objects from its actual representation (Gamma et.al, 1995).\n\nThe\
    \ `LodgingBuilder` interface:\n\n***LodgingBuilder.h***\n```cpp\n#pragma once\n\
    #include \"CoreMinimal.h\"\n#include \"UObject/Interface.h\"\n#include \"LodgingBuilder.generated.h\"\
    \n\n// This class does not need to be modified.\nUINTERFACE(MinimalAPI)\nclass\
    \ ULodgingBuilder : public UInterface\n{\n    GENERATED_BODY()\n};\n\nclass DESIGN_PATTERNS_API\
    \ ILodgingBuilder\n{\n    GENERATED_BODY()\n    // Add interface functions to\
    \ this class. This is the class that will be inherited to implement this interface.\n\
    public:\n    //The pure virtual functions of the LodgingBuilder \n    virtual\
    \ void BuildSwimmingPool() = 0;\n    virtual void BuildLobbyArea() = 0;\n    virtual\
    \ void BuildRooms() = 0;\n    virtual void BuildRestaurants() = 0;\n    virtual\
    \ class ALodging GetLodging() = 0;\n};\n```\n\n***LodgingBuilder.cpp***\n```cpp\n\
    #include \"LodgingBuilder.h\"\n// Add default functionality here for any ILodgingBuilder\
    \ functions that are not pure virtual.\n```\n\nNext, we create the `Lodging` class\
    \ which implements the `FloorPlan` interface.\n\n***Lodging.h***\n"
  raw: "**}**\n\nThe blueprint equivalent of the *Builder* class:\n\n![Graphical user\
    \ interface Description automatically generated](Image00004.jpg) \n\nThe *Set\
    \ hotelBuilder* and *Set engineer* collapsed graph are respectively:\n\n![](Image00005.jpg)\
    \ \n\nand\n\n![](Image00006.jpg) \n\nThe *Set hotelBuilder* collapsed graph represents\
    \ this line of code:\n\nHotelBuilder **=** GetWorld **()->** SpawnActor **<**\
    \ AHotelLodgingBuilder **>(** AHotelLodgingBuilder **::** StaticClass **());**\n\
    \nThe *Spawn Actor From Class* node is akin to the *new* keyword in traditional\
    \ programming. The class to spawn is chosen using the dropdown box under the word\
    \ “Class”. The Spawn Transform is to one’s own specific scenario. For simplicity,\
    \ we can just right click on the Spawn Transform and choose “Promote to Variable”.\
    \ If there is no Spawn Transform then the blueprint will compile with errors.\
    \ We set (or “initialize”) our *hotelBuilder* variable once the desired actor\
    \ is spawned.\n\nThe same basic idea applies to the *Set engineer* collapsed graph.\
    \ However, *Architectural Engineer* needs a *LodgingBuilder* to set the Builder\
    \ for the Engineer as expressed in this line of code:\n\nEngineer **->** SetLodgingBuilder\
    \ **(** HotelBuilder **);**\n\nLater, we will not be going into such detail on\
    \ every spawning activity. Trust that there are many, many spawn actor requirements,\
    \ and discussing each one will become an exercise in tedium.\n\n*The Builder_Main*\
    \ blueprint continues with the *Construct Lodging* function call node. This function\
    \ is called on the *engineer* we spawned previously. The equivalent line of code:\n\
    \nEngineer **->** ConstructLodging **();**\n\nNote the *Sequence* node in *Builder_Main*\
    \ . Sequence 0 finishes once the *Construct Lodging* function call executes. Sequence\
    \ 1 then starts executing. The *Set lodging* collapsed graph:\n\n![](Image00007.jpg)\
    \ \n\nNow, we are equivalently executing this get then set with this line of code:\n\
    \nALodging ***** Lodging **=** Engineer **->** GetLodging **();**\n\nThis last\
    \ line of non-boilerplate code is:\n\nLodging **->** LodgingCharacteristics **();**\n\
    \nThis line of code and equivalent blueprint will be discussed in a moment. However,\
    \ we need to make some validation checks and make sure we built a hotel. We want\
    \ to make sure the *lodging* actor implements the *FloorPlan* interface. The *lodging\
    \ isFloorPlan_int* collapsed graph:\n\n![](Image00008.jpg) \n\nGoing forward we\
    \ will not be showing this interface check collapsed graph. Note, the collapsed\
    \ graph for this check always possesses a yellow hue. The only item that changes\
    \ inside the collapsed node is the target interface we are checking the object\
    \ against. The target interface is always part of the collapsed graph name.\n\n\
    Now we can discuss the interfaces we use in this pattern. First, we create a floor\
    \ plan interface for all lodgings to implement. Most commercial lodgings in the\
    \ USA contain a pool, lobby area, rooms, and restaurants. We also create a lodging\
    \ builder interface for our specific lodging builder classes to implement. The\
    \ *FloorPlan* interface:\n\n***FloorPlan.h***\n\n#pragma once#include \"CoreMinimal.h\"\
    #include \"UObject/Interface.h\"#include \"FloorPlan.generated.h\"// This class\
    \ does not need to be modified.UINTERFACE **(** MinimalAPI **)**class UFloorPlan\
    \ **:** public UInterface**{**GENERATED_BODY **()****};**class DESIGN_PATTERNS_API\
    \ IFloorPlan**{**GENERATED_BODY **()** // Add interface functions to this class.\
    \ This is the class that will be inherited to implement this interface.public\
    \ **:** //The pure virtual functions of the FloorPlan virtual void SetSwimmingPool\
    \ **(** FString SwimmingPool **)** **=** 0 **;** virtual void SetLobbyArea **(**\
    \ FString LobbyArea **)** **=** 0 **;** virtual void SetRooms **(** FString Rooms\
    \ **)** **=** 0 **;** virtual void SetRestaurants **(** FString Restaurants **)**\
    \ **=** 0 **;****};**\n\n***FloorPlan.cpp***\n\n#include \"FloorPlan.h\"// Add\
    \ default functionality here for any IFloorPlan functions that are not pure virtual.\n\
    \nThe equivalent blueprint interface is very mundane. The following are the nodes\
    \ representing the functions in the *FloorPlan* interface.\n\n![](Image00009.jpg)\
    \ ![](Image00010.jpg) ![](Image00011.jpg) ![](Image00012.jpg) \n\nThe saying goes,\
    \ “Program to an Interface, not an implementation” (Gamma et.al, 1995). In fact,\
    \ it is a core principle in object-oriented design. The main benefit of programming\
    \ to an interface is that it reduces implementation dependencies between subsystems\
    \ (Gamma et.al, 1995). We see this first hand in our Builder Pattern example.\
    \ Specifically, The Builder pattern seeks to decouple the construction of complex\
    \ objects from its actual representation (Gamma et.al, 1995).\n\nThe *LodgingBuilder*\
    \ interface:\n\n***LodgingBuilder.h***\n\n#pragma once#include \"CoreMinimal.h\"\
    #include \"UObject/Interface.h\"#include \"LodgingBuilder.generated.h\"// This\
    \ class does not need to be modified.UINTERFACE **(** MinimalAPI **)**class ULodgingBuilder\
    \ **:** public UInterface**{**GENERATED_BODY **()****};**class DESIGN_PATTERNS_API\
    \ ILodgingBuilder**{**GENERATED_BODY **()** // Add interface functions to this\
    \ class. This is the class that will be inherited to implement this interface.public\
    \ **:** //The pure virtual functions of the LodgingBuilder virtual void BuildSwimmingPool\
    \ **()** **=** 0 **;** virtual void BuildLobbyArea **()** **=** 0 **;** virtual\
    \ void BuildRooms **()** **=** 0 **;** virtual void BuildRestaurants **()** **=**\
    \ 0 **;** virtual class ALodging ***** GetLodging **()** **=** 0 **;****};**\n\
    \n***LodgingBuilder.cpp***\n\n#include \"LodgingBuilder.h\"// Add default functionality\
    \ here for any ILodgingBuilder functions that are not pure virtual.\n\nThe screenshot\
    \ of the *LodgingBuilder* interface blueprint follows the same design as the *FloorPlan*\
    \ interface blueprint and is thus removed for the sake of brevity. Going forward,\
    \ showing interface blueprint images are minimized unless considered necessary\
    \ to deepen understanding for the reader.\n\nNext, we create the *Lodging* class\
    \ which implements the *FloorPlan* interface.\n\n***Lodging.h***"
