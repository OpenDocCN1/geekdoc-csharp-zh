    \ application Description automatically generated](Image00066.jpg)\n\nThe `Shooter`\
    \ class:\n\n### `Shooter.h`\n\n```cpp\n#pragma once\n#include \"CoreMinimal.h\"\
    \n#include \"GameFramework/Actor.h\"\n#include \"SlingShot.h\"\n#include \"Shooter.generated.h\"\
    \n\nUCLASS()\nclass DESIGN_PATTERNS_API AShooter : public AActor, public ISlingShot\n\
    {\n    GENERATED_BODY()\npublic:\n    // Sets default values for this actor's\
    \ properties\n    AShooter();\nprivate:\n    //The Weapon of the Shooter, that\
    \ must be a SlingShot\n    ISlingShot* SlingShot;\nprotected:\n    // Called when\
    \ the game starts or when spawned\n    virtual void BeginPlay() override;\npublic:\n\
    \    // Called every frame\n    virtual void Tick(float DeltaTime) override;\n\
    \    //Set the Weapon Actor\n    void SetSlingShot(AActor* SlingShotObj);\n  \
    \  //Fire with the SlingShot\n    void Sling();\n};\n```\n\n### `Shooter.cpp`\n\
    \n```cpp\n#include \"Shooter.h\"\n// Sets default values\nAShooter::AShooter()\n\
    {\n    // Set this actor to call Tick() every frame. You can turn this off to\
