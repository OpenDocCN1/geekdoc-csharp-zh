  trans: "\n\n![图形用户界面 自动生成](img/Image00175.jpg) \n\n与 `BattleShip` 的构造相同，区别在于在函数内部手动设置了\
    \ `BattleStrategy` 变量，因为它在生成时没有暴露。\n\n`engage` 蓝图函数：\n\n![图形用户界面，应用程序 自动生成](img/Image00176.jpg)\
    \ \n\n`BattleShipStrategy` 接口：\n\n**BattleShipStrategy.h**\n\n```cpp\n#pragma\
    \ once\n#include \"CoreMinimal.h\"\n#include \"UObject/Interface.h\"\n#include\
    \ \"BattleShipStrategy.generated.h\"\n// 此类不需要修改。\nUINTERFACE( MinimalAPI )\n\
    class UBattleShipStrategy : public UInterface\n{\n    GENERATED_BODY()\n};\n\n\
    class DESIGN_PATTERNS_API IBattleShipStrategy\n{\n    GENERATED_BODY()\n // 向此类中添加接口函数。该类将通过继承以实现此接口。\n\
    public: \n // BattleShipStrategy 的纯虚函数\n    virtual void Maneuver() = 0;\n};\n\
    ```\n\n**BattleShipStrategy.cpp**\n\n```cpp\n#include \"BattleShipStrategy.h\"\
    \n// 为任何非纯虚 IBattleShipStrategy 函数添加默认功能。\n```\n\n### `BruteForceStrategy` 类：\n\
    \n**BruteForceStrategy.h**\n\n```cpp\n#pragma once\n#include \"CoreMinimal.h\"\
    \n#include \"GameFramework/Actor.h\"\n#include \"BattleShipStrategy.h\"\n#include\
    \ \"BruteForceStrategy.generated.h\"\nUCLASS()\nclass DESIGN_PATTERNS_API ABruteForceStrategy\
    \ : public AActor, public IBattleShipStrategy\n{\n    GENERATED_BODY()\npublic:\
    \ \n // 为此 actor 的属性设置默认值\n    AButeForceStrategy();\nprotected: \n // 在游戏开始或生成时调用\n\
    \    virtual void BeginPlay() override;\npublic: \n // 每帧调用\n    virtual void\
    \ Tick(float DeltaTime) override; \n // 执行此策略的 Maneuver\n    virtual void Maneuver()\
    \ override;\n};\n```\n\n**BruteForceStrategy.cpp**\n\n```cpp\n#include \"BruteForceStrategy.h\"\
    \n// 设置默认值\nAButeForceStrategy::AButeForceStrategy()\n{ \n // 设置此 actor 每帧调用 Tick()。\
    \  \n // 如果不需要，可以关闭它以提高性能。\nPrimaryActorTick.bCanEverTick = true;\n}\n// 在游戏开始或生成时调用\n\
    AButeForceStrategy::BeginPlay()\n{\n    Super::BeginPlay();\n}\n// 每帧调用\nAButeForceStrategy::Tick(float\
    \ DeltaTime)\n{\n    Super::Tick(DeltaTime);\n}\nAButeForceStrategy::Maneuver()\n\
    { \n // 执行此类策略的例程\nGEngine->AddOnScreenDebugMessage(-1, 15.f, FColor::Yellow,\
    \ TEXT(\"我们可以正面硬刚这些船只\"));\n}\n```\n\n`BruteForceStrategy` 蓝图事件图：\n\n![](img/Image00177.jpg)\
    \ \n\n### `DivideConquerStrategy` 类：\n\n**DivideConquerStrategy.h**\n\n```cpp\n\
    #pragma once\n#include \"CoreMinimal.h\"\n#include \"GameFramework/Actor.h\"\n\
    #include \"BattleShipStrategy.h\"\n#include \"DivideConquerStrategy.generated.h\"\
    \nUCLASS()\nclass DESIGN_PATTERNS_API ADivideConquerStrategy : public AActor,\
    \ public IBattleShipStrategy\n{\n    GENERATED_BODY()\npublic: \n // 为此 actor\
    \ 的属性设置默认值\n    ADivideConquerStrategy();\nprotected: \n // 在游戏开始或生成时调用\n    virtual\
    \ void BeginPlay() override;\npublic: \n // 每帧调用\n    virtual void Tick(float\
    \ DeltaTime) override; \n // 执行此策略的 Maneuver\n    virtual void Maneuver() override;\n\
    };\n```\n\n**DivideConquerStrategy.cpp**\n\n```cpp\n#include \"DivideConquerStrategy.h\"\
    \n// 设置默认值\nADivideConquerStrategy::ADivideConquerStrategy()\n{ \n // 设置此 actor\
    \ 每帧调用 Tick()。  \n // 如果不需要，可以关闭它以提高性能。\nPrimaryActorTick.bCanEverTick = true;\n\
    }\n// 在游戏开始或生成时调用\nADivideConquerStrategy::BeginPlay()\n{\n    Super::BeginPlay();\n\
    }\n// 每帧调用\nADivideConquerStrategy::Tick(float DeltaTime)\n{\n    Super::Tick(DeltaTime);\n\
    }\nADivideConquerStrategy::Maneuver()\n{ \n // 执行此类策略的例程\nGEngine->AddOnScreenDebugMessage(-1,\
    \ 15.f, FColor::Yellow, TEXT(\"引诱船只分散并逐个击击它们\"));\n}\n```\n\n`DivideConquerStrategy`\
    \ 蓝图事件图：\n\n![](img/Image00178.jpg) \n\n### `RetreatStrategy` 类：\n\n**RetreatStrategy.h**\n\
    \n```cpp\n#pragma once\n#include \"CoreMinimal.h\"\n#include \"GameFramework/Actor.h\"\
    \n#include \"BattleShipStrategy.h\"\n#include \"RetreatStrategy.generated.h\"\n\
    UCLASS()\nclass DESIGN_PATTERNS_API ARetreatStrategy : public AActor, public IBattleShipStrategy\n\
    {\n    GENERATED_BODY()\npublic: \n // 为此 actor 的属性设置默认值\n    ARetreatStrategy();\n\
    protected: \n // 在游戏开始或生成时调用\n    virtual void BeginPlay() override;\npublic:\
    \ \n // 每帧调用\n    virtual void Tick(float DeltaTime) override; \n // 执行此策略的 Maneuver\n\
    \    virtual void Maneuver() override;\n};\n```\n\n**RetreatStrategy.cpp**\n\n\
    ```cpp\n#include \"RetreatStrategy.h\"\n// 设置默认值\nARetreatStrategy::ARetreatStrategy()\n\
    { \n // 设置此 actor 每帧调用 Tick()。  \n // 如果不需要，可以关闭它以提高性能。\nPrimaryActorTick.bCanEverTick\
    \ = true;\n}\n// 在游戏开始或生成时调用\nARetreatStrategy::BeginPlay()\n{\n    Super::BeginPlay();\n\
    }\n// 每帧调用\nARetreatStrategy::Tick(float DeltaTime)\n{\n    Super::Tick(DeltaTime);\n\
    }\nARetreatStrategy::Maneuver()\n{ \n // 执行此类策略的例程\nGEngine->AddOnScreenDebugMessage(-1,\
    \ 15.f, FColor::Yellow, TEXT(\"全速撤退！\"));\n}\n```\n\n`RetreatStrategy` 蓝图事件图：\n\
    \n![](img/Image00179.jpg) \n\n策略模式视图打印：\n\n![](img/Image00180.jpg) \n\n> 创建模式\
    \ (Java)\n\n> 酒店 汽车假日 Inn 建造者模式 (Java)\n\n**建造者模式 UML 图**\n\n![时间线 自动生成](img/Image00181.jpg)\
    \ \n\n### 建造者模式实现\n\n`Builder` 类包含了 Java 中的 `main` 函数。在蓝图中，我们可以认为该类是真正需要物理拖入游戏世界的那个类。其他的“具体”类不需要物理地拖入世界。\n\
    \n```java\nclass Builder_Main{\n    public static void main(String[] args) {\n\
    \        LodgingBuilder hotelBuilder = new HotelLodgingBuilder();\n        ArchitecturalEngineer\
    \ engineer = new ArchitecturalEngineer(hotelBuilder);\n        engineer.constructLodging();\n\
    \        Lodging lodging = engineer.getLodging();\n        lodging.lodgingCharacteristics();\n\
    \    }\n}\n```\n\n"
- fmt: "\nThe `Spawn Actor From Class` node is akin to the `new` keyword in Java and\
    \ other languages. The class to spawn is chosen using the dropdown box under the\
    \ word “Class”. The `Spawn Transform` is to one’s own specific scenario. For simplicity,\
    \ we can just right click on the `Spawn Transform` and choose “Promote to Variable”.\
    \ If there is no `Spawn Transform` then the blueprint will compile with errors.\
    \ We set (or “initialize”) our `hotelBuilder` variable once the desired actor\
    \ is spawned.\n\nThe same basic idea applies to the `Set engineer` collapsed graph.\
    \ However, `Architectural Engineer` needs a `LodgingBuilder` to be passed into\
    \ its constructor as expressed in this line of code:\n\n```\nArchitecturalEngineer\
    \ engineer = new ArchitecturalEngineer(hotelBuilder);\n```\n\nLater, we will not\
    \ be going into such detail on every spawning activity. Trust that there are many,\
    \ many spawn actor requirements, and discussing each one will become an exercise\
    \ in tedium.\n\nThe `Builder_Main` blueprint continues with the `Construct Lodging`\
    \ function call node. This is function is called on the `engineer` we spawned\
    \ previously. The equivalent line of code:\n\n```\nengineer.constructLodging();\n\
    ```\n\nNote the `Sequence` node in `Builder_Main`. `Sequence 0` finishes once\
    \ the `Construct Lodging` function call executes. `Sequence 1` then starts executing.\
    \ The `Set lodging` collapsed graph:\n\n![Graphical user interface, application\
    \ Description automatically generated](Image00007.jpg)\n\nNow, we are equivalently\
    \ executing this line of code:\n\n```\nLodging lodging = engineer.getLodging();\n\
    ```\n\nThis is the last line of code in the `Builder` class. However, we need\
    \ to make some validation checks and make sure we built a hotel. We want to make\
    \ sure the `lodging` actor implements the `FloorPlan` interface. The `lodging\
    \ isFloorPlan_int` collapsed graph:\n\n![A screenshot of a computer Description\
    \ automatically generated with low confidence](Image00008.jpg)\n\nGoing forward\
    \ we will not be showing this interface check collapsed graph. Note, the collapsed\
    \ graph for this check always possesses a yellow hue. The only item that changes\
    \ inside the collapsed node is the target interface we are checking the object\
    \ against. The target interface is always part of the collapsed graph name.\n\n\
    The `Builder_Main` blueprint ends execution with a print string to let us know\
    \ if the hotel is actually built. “Failed to Build a Hotel” prints If an error\
    \ in logic occurs somewhere in any of the blueprints.\n\nNow we can discuss the\
    \ interfaces we use in this pattern. First, we create a floor plan interface for\
    \ all lodgings to implement. Most commercial lodgings in the USA contain a pool,\
    \ lobby area, rooms, and restaurants. We also create a lodging builder interface\
    \ for our specific lodging builder classes to implement. The `FloorPlan` interface:\n\
    \n```\ninterface FloorPlan {\n    public void setSwimmingPool(String swimmingPool);\n\
    \    public void setLobbyArea(String lobbyArea);\n    public void setRooms(String\
    \ rooms);\n    public void setRestaurants(String restaurants);\n}\n```\n\nThe\
    \ equivalent blueprint interface is very mundane. The following are the nodes\
    \ representing the functions in the `FloorPlan` interface.\n\n![Graphical user\
    \ interface, application Description automatically generated](Image00009.jpg)\
    \ ![Graphical user interface, application Description automatically generated](Image00010.jpg)\
    \ ![Graphical user interface, application Description automatically generated](Image00011.jpg)\
    \ ![Graphical user interface, application Description automatically generated](Image00012.jpg)\n\
    \nThe saying goes, “Program to an Interface, not an implementation” (Gamma et.al,\
    \ 1995). In fact, it is a core principle in object-oriented design. The main benefit\
    \ of programming to an interface is that it reduces implementation dependencies\
    \ between subsystems (Gamma et.al, 1995). We see this first hand in our Builder\
    \ Pattern example. Specifically, The Builder pattern seeks to decouple the construction\
    \ of complex objects from its actual representation (Gamma et.al, 1995).\n\n```\n\
    interface LodgingBuilder {\n    public void buildSwimmingPool();\n    public void\
    \ buildLobbyArea();\n    public void buildRooms();\n    public void buildRestaurants();\n\
    \    public Lodging getLodging();\n}\n```\n\nThe screenshot of the `LodgingBuilder`\
    \ interface blueprint follows the same design as the `FloorPlan` interface blueprint\
    \ and is thus removed for the sake of brevity. Going forward, showing interface\
    \ blueprint images are minimized unless considered necessary to deepen understanding\
    \ for the reader.\n\nNext, we create the `Lodging` class which implements the\
    \ `FloorPlan` interface.\n\n```\nclass Lodging implements FloorPlan {\n    private\
    \ String swimmingPool;\n    private String lobbyArea;\n    private String rooms;\n\
    \    private String restaurants;\n    @Override\n    public void setSwimmingPool(String\
    \ swimmingPool) {\n        this.swimmingPool = swimmingPool;\n    }\n    @Override\n\
    \    public void setLobbyArea(String lobbyArea) {\n        this.lobbyArea = lobbyArea;\n\
    \    }\n    @Override\n    public void setRooms(String rooms) {\n        this.rooms\
    \ = rooms;\n    }\n    @Override\n    public void setRestaurants(String restaurants)\
    \ {\n        this.restaurants = restaurants;\n    }\n    public void lodgingCharacteristics()\
    \ {\n        System.out.println(swimmingPool);\n        System.out.println(lobbyArea);\n\
    \        System.out.println(rooms);\n        System.out.println(restaurants);\n\
    \    }\n}\n```\n\nThe `Lodging` blueprint:\n\n![Graphical user interface, application\
    \ Description automatically generated](Image00183.jpg)\n\nBlueprints use `Event`\
    \ nodes when calling void interface functions. The blueprint version of the `Lodging`\
    \ class prints the string value passed to the function in addition to setting\
    \ local variables. Also, we must make sure this blueprint class implements the\
    \ `FloorPlan` interface by adding it in the class settings Interfaces sections.\n\
    \nThe next two classes, `HotelLodgingBuilder` and `MotelLodgingBuilder`, implement\
    \ the lodging builder interface and provide the custom specs for each type of\
    \ lodging.\n\n```java\nclass HotelLodgingBuilder implements LodgingBuilder {\n\
    \    private Lodging lodging;\n    public HotelLodgingBuilder() {\n        this.lodging\
    \ = new Lodging();\n    }\n    @Override\n    public void buildLobbyArea() {\n\
    \        lodging.setLobbyArea(\"Grand Hall\");\n    }\n    @Override\n    public\
    \ void buildRestaurants() {\n        lodging.setRestaurants(\"5 star Buffet\"\
    );\n    }\n    @Override\n    public void buildRooms() {\n        lodging.setRooms(\"\
    Luxury Suites\");\n    }\n    @Override\n    public void buildSwimmingPool() {\n\
    \        lodging.setSwimmingPool(\"Indoor Lagoon\");\n    }\n    @Override\n \
    \   public Lodging getLodging() {\n        return this.lodging;\n    }\n}\n```\n\
    \nThe `HotelLodgingBuilder` blueprint construction event graph:\n\n![A screenshot\
    \ of a computer Description automatically generated with low confidence](Image00184.jpg)\n\
    \nThe `Set lodging` collapsed graph node:\n\n![Graphical user interface Description\
    \ automatically generated](Image00185.jpg)\n\nThe `Add Child Actor Component`\
    \ is a work around for not being able to use the `Spawn Actor of Class` node.\
    \ We can see the `HotelLodgingBuilder` constructor instantiates a new `Lodging`\
    \ object in our code:\n\n```\npublic HotelLodgingBuilder() {\n    this.lodging\
    \ = new Lodging();\n}\n```\n\nWe will see an even more dynamic way to initialize\
    \ objects around construction script constraints when we get to the State Pattern.\n\
    \n`HotelLodgingBuilder` event graph:\n\n![Graphical user interface, application\
    \ Description automatically generated](Image00016.jpg)\n\nThe `isLodgingImplementInterface`\
    \ function is a custom interface check function similar the yellow hued collapsed\
    \ graphs.\n"
