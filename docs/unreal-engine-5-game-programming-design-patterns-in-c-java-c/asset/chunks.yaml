    \n`CoinInsertedState.h`\n\n```cpp\n#pragma once\n#include \"CoreMinimal.h\"\n\
    #include \"GameFramework/Actor.h\"\n#include \"State.h\"\n#include \"CoinInsertedState.generated.h\"\
    \n\nUCLASS()\nclass DESIGN_PATTERNS_API ACoinInsertedState : public AActor, public\
    \ IState\n{\n    GENERATED_BODY()\n\npublic:\n    // 设置此 actor 属性的默认值\n    ACoinInsertedState();\n\
    \nprivate:\n    // 此状态的老老虎机\n    UPROPERTY()\n    class AOldSchoolSlotMachine*\
    \ OldSchoolSlotMachine;\n\nprotected:\n    // 当游戏开始或生成时被调用\n    virtual void BeginPlay()\
    \ override;\n\npublic:\n    // 每帧调用\n    virtual void Tick(float DeltaTime) override;\n\
    \    // 当插入硬币时执行例程\n    virtual void InsertCoin() override;\n    // 当硬币被拒绝时执行例程\n\
    \    virtual void RejectCoin() override;\n    // 当拉动摇杆时执行例程\n    virtual void\
    \ PullLever() override;\n    // 执行派奖例程\n    virtual void Payout() override;\n\
    \    // 补充老虎机\n    virtual void RestockDollars() override;\n    // 获取此状态的字符串\n\
    \    virtual FString ToString() override;\n    // 设置此状态的老虎机\n    virtual void\
    \ SetSlotMachine(class AOldSchoolSlotMachine* SlotMachine) override;\n};\n```\n\
    \n`CoinInsertedState.cpp`\n\n```cpp\n#include \"CoinInsertedState.h\"\n#include\
    \ \"OldSchoolSlotMachine.h\"\n\n// 设置默认值\nACoinInsertedState::ACoinInsertedState()\n\
    {\n    // 设置此 actor 每帧调用 Tick()。如果不需要，可以关闭它以提高性能。\n    PrimaryActorTick.bCanEverTick\
    \ = true;\n}\n\n// 当游戏开始或生成时被调用\nvoid ACoinInsertedState::BeginPlay()\n{\n   \
    \ Super::BeginPlay();\n}\n\n// 每帧调用\nvoid ACoinInsertedState::Tick(float DeltaTime)\n\
    {\n    Super::Tick(DeltaTime);\n}\n\nvoid ACoinInsertedState::SetSlotMachine(AOldSchoolSlotMachine*\
    \ SlotMachine)\n{\n    // 设置此状态的老虎机\n    OldSchoolSlotMachine = SlotMachine;\n\
    }\n\nvoid ACoinInsertedState::InsertCoin()\n{\n    // 记录插入硬币字符串\n    GEngine->AddOnScreenDebugMessage(-1,\
    \ 15.f, FColor::Yellow, TEXT(\"You cannot insert another casino coin\"));\n}\n\
    \nvoid ACoinInsertedState::RejectCoin()\n{\n    // 记录拒绝硬币字符串并将状态设置为“无硬币状态”\n \
    \   GEngine->AddOnScreenDebugMessage(-1, 15.f, FColor::Yellow, TEXT(\"Casino coin\
    \ returned\"));\n    OldSchoolSlotMachine->SetState(OldSchoolSlotMachine->GetNoCoinState());\n\
    }\n\nvoid ACoinInsertedState::PullLever()\n{\n    // 记录拉动摇杆字符串并将状态设置为“已奖金状态”\n\
    \    GEngine->AddOnScreenDebugMessage(-1, 15.f, FColor::Yellow, TEXT(\"You pulled\
    \ the lever...\"));\n    OldSchoolSlotMachine->SetState(OldSchoolSlotMachine->GetWonDollarsState());\n\
    }\n\nvoid ACoinInsertedState::Payout()\n{\n    // 记录派奖字符串\n    GEngine->AddOnScreenDebugMessage(-1,\
    \ 15.f, FColor::Yellow, TEXT(\"No dollars dispensed\"));\n}\n\nvoid ACoinInsertedState::RestockDollars()\n\
    {\n    /*无*/\n}\n\nFString ACoinInsertedState::ToString()\n{\n    // 返回此状态的字符串\n\
    \    return \"waiting for lever pull\";\n}\n```\n\n`CoinInsertedState` 蓝图事件图：\n\
    \n![一张中等置信度自动生成的计算机截图](img/Image00160.jpg) \n\n`ToString` 函数：\n\n![自动生成的图形用户界面、应用程序描述](img/Image00161.jpg)\
    \ \n\n`WonDollarsState` 类：\n\n`WonDollarsState.h`\n\n```cpp\n#pragma once\n#include\
    \ \"CoreMinimal.h\"\n#include \"GameFramework/Actor.h\"\n#include \"State.h\"\n\
    #include \"WonDollarsState.generated.h\"\n\nUCLASS()\nclass DESIGN_PATTERNS_API\
    \ AWonDollarsState : public AActor, public IState\n{\n    GENERATED_BODY()\n\n\
    public:\n    // 设置此 actor 属性的默认值\n    AWonDollarsState();\n\nprivate:\n    //\
    \ 此状态的老虎机\n    UPROPERTY()\n    class AOldSchoolSlotMachine* OldSchoolSlotMachine;\n\
    \nprotected:\n    // 当游戏开始或生成时被调用\n    virtual void BeginPlay() override;\n\n\
    public:\n    // 每帧调用\n    virtual void Tick(float DeltaTime) override;\n    //\
    \ 当插入硬币时执行例程\n    virtual void InsertCoin() override;\n    // 当硬币被拒绝时执行例程\n  \
    \  virtual void RejectCoin() override;\n    // 当拉动摇杆时执行例程\n    virtual void PullLever()\
    \ override;\n    // 执行派奖例程\n    virtual void Payout() override;\n    // 补充老虎机\n\
    \    virtual void RestockDollars() override;\n    // 获取此状态的字符串\n    virtual FString\
    \ ToString() override;\n    // 设置此状态的老虎机\n    virtual void SetSlotMachine(class\
    \ AOldSchoolSlotMachine* SlotMachine) override;\n};\n```\n\n`WonDollarsState.cpp`\n\
    \n```cpp\n#include \"WonDollarsState.h\"\n#include \"OldSchoolSlotMachine.h\"\n\
    \n// 设置默认值\nAWonDollarsState::AWonDollarsState()\n{\n    // 设置此 actor 每帧调用 Tick()。如果不需要，可以关闭它以提高性能。\n\
    \    PrimaryActorTick.bCanEverTick = true;\n}\n\n// 当游戏开始或生成时被调用\nvoid AWonDollarsState::BeginPlay()\n\
    {\n    Super::BeginPlay();\n}\n\n// 每帧调用\nvoid AWonDollarsState::Tick(float DeltaTime)\n\
    {\n    Super::Tick(DeltaTime);\n}\n\nvoid AWonDollarsState::SetSlotMachine(AOldSchoolSlotMachine*\
    \ SlotMachine)\n{\n    // 设置此状态的老虎机\n    OldSchoolSlotMachine = SlotMachine;\n\
    }\n\nvoid AWonDollarsState::InsertCoin()\n{\n    // 记录插入硬币字符串\n    GEngine->AddOnScreenDebugMessage(-1,\
    \ 15.f, FColor::Yellow, TEXT(\"Please wait, machine is dispensing dollars\"));\n\
    }\n\nvoid AWonDollarsState::RejectCoin()\n{\n    // 记录拒绝硬币字符串\n    GEngine->AddOnScreenDebugMessage(-1,\
    \ 15.f, FColor::Yellow, TEXT(\"Chill, you pulled the lever\"));\n}\n\nvoid AWonDollarsState::PullLever()\n\
    {\n    // 记录拉动摇杆字符串\n    GEngine->AddOnScreenDebugMessage(-1, 15.f, FColor::Yellow,\
    \ TEXT(\"Do not pull lever twice!\"));\n}\n\nvoid AWonDollarsState::Payout()\n\
    {\n    //派奖时间！从老虎机排出金额\n    OldSchoolSlotMachine->EmitDollars();\n    if (OldSchoolSlotMachine->GetCount()\
    \ > 0)\n    {\n        // 如果老虎机还有钱，将状态设为无硬币状态\n        OldSchoolSlotMachine->SetState(OldSchoolSlotMachine->GetNoCoinState());\n\
    \    }\n    else\n    {\n        // 如果老虎机没有钱了，记录它并将状态设为无奖金状态\n        GEngine->AddOnScreenDebugMessage(-1,\
    \ 15.f, FColor::Yellow, TEXT(\"Machine is now out of cash\"));\n        OldSchoolSlotMachine->SetState(OldSchoolSlotMachine->GetNoDollarsState());\n\
    \    }\n}\n\nvoid AWonDollarsState::RestockDollars()\n{\n    /*无*/\n}\n\nFString\
    \ AWonDollarsState::ToString()\n{\n    // 返回此状态的字符串\n    return \"dispensing cash\"\
    ;\n}\n```\n\n`WonDollarsState` 事件图：\n\n![](img/Image00162.jpg) \n\n`Check Machine\
