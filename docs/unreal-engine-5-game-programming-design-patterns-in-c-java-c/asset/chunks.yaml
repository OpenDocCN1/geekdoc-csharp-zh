  trans: "\n\n# 使用 C# 的模式\n\n在本节中，我们将使用 C# 实现我们涵盖的大多数模式。读者会发现，C# 对应的蓝图（Blueprints）与\
    \ Java 部分中显示的蓝图完全相同。这一节对于具有 Unity 编程背景的人来说将益最多。C# 是 Unity 游戏引擎中高级脚本的通用语言。让我们快速提到一下\
    \ `using directive`。它对最终的应用程序或游戏不会产生任何性能影响。此类指令是编译器用于处理长类型名称的“快捷方式”。此外，关于特定模式及其实现的更深入的讨论，请参阅\
    \ C++ 部分。无论使用哪种语言，讨论的细节保持不变。\n\n## 酒店、旅馆、假日酒店园…… 建造者模式 (C#)\n\nC# 中的建造者模式的 UML\
    \ 图与 Java 的实现相同，因此在此展示了该图。请忽略“Java”类文本。\n\n### 建造者模式 UML 图\n\n![自动生成的具有中等信度的时间线描述](img/Image00181.jpg)\
    \ \n\n### 建造者模式实现\n\n`Builder` 类包含了 C# 中的主函数。在蓝图方面，我们可以认为这个类是实际上需要物理拖入游戏世界的类。其他的“具体”类则不需要物理地拖入世界。\n\
    \n```csharp\nusing System;\nnamespace Builder{\n class Builder_Main {\n    static\
    \ void Main(string[] args) {\n        LodgingBuilder hotelBuilder = new HotelLodgingBuilder();\n\
    \        ArchitecturalEngineer engineer = new ArchitecturalEngineer(hotelBuilder);\n\
    \        engineer.constructLodging();\n        Lodging lodging = engineer.getLodging();\n\
    \        lodging.lodgingCharacteristics();\n    }\n}\n}\n```\n\n`Builder_Main`\
    \ 类对应的蓝图：\n\n![自动生成的图形用户界面描述](img/Image00182.jpg) \n\n`Set hotelBuilder` 和 `Set\
    \ engineer` 折叠图分别是：\n\n![自动生成的图形用户界面、应用程序](img/Image00005.jpg) \n\n以及\n\n![自动生成的图形用户界面、文本、应用程序](img/Image00006.jpg)\
    \ \n\n`Set hotelBuilder` 折叠图代表了这一行代码：\n\n```csharp\nLodgingBuilder hotelBuilder\
    \ = new HotelLodgingBuilder();\n```\n\n`Spawn Actor From Class` 节点类似于 C# 和其他语言中的\
    \ `new` 关键字。要生成的类是通过“Class”字下方的下拉框选择的。`Spawn Transform` 取决于个人的特定场景。为了简单起见，我们只需右键点击\
    \ Spawn Transform 并选择“Promote to Variable”。如果没有 Spawn Transform，蓝图将会在错误中编译。在所需的\
    \ Actor 生成后，我们设置（或“初始化”）我们的 `hotelBuilder` 变量。\n\n相同的基本思想也适用于 `Set engineer` 折叠图。然而，`Architectural\
    \ Engineer` 需要将 `LodgingBuilder` 传递到它的构造函数中，如此代码所示：\n\n```csharp\nArchitecturalEngineer\
    \ engineer = new ArchitecturalEngineer(hotelBuilder);\n```\n\n以后，我们不会对每个生成活动进行如此详细的说明。请相信有大量的生成\
    \ Actor 需求，讨论每一个项将变成一项枯燥的任务。\n\n`Builder_Main` 蓝图通过 `Construct Lodging` 函数调用节点继续执行。该函数在我们之前生成的\
    \ `engineer` 上调用的。等效的代码行是：\n\n```csharp\nengineer.constructLodging();\n```\n\n\
    注意 `Builder_Main` 中的 `Sequence` 节点。一旦 `Construct Lodging` 函数调用执行，Sequence 0 结束。然后\
    \ Sequence 1 开始执行。`Set lodging` 折叠图：\n\n![自动生成的图形用户界面、应用程序](img/Image00007.jpg)\
    \ \n\n现在，我们等效地执行这一行代码：\n\n```csharp\nLodging lodging = engineer.getLodging();\n\
    ```\n\n这是 `Builder` 类中的最后一行代码。然而，我们需要进行一些验证检查，并确保我们确实构建了一个酒店。我们想要确保 `lodging`\
    \ Actor 实现了 `FloorPlan` 接口。`lodging isFloorPlan_int` 折叠图：\n\n![自动生成的具有低信度的计算机截图](img/Image00008.jpg)\
    \ \n\n今后我们将不再显示此接口检查折叠图。请注意，此检查的折叠图始终带有黄色调。折叠节点内部唯一变化的项是我们正在检查对象的目标接口。目标接口始终是折叠图名称的一部分。\n\
    \n`Builder_Main` 蓝图通过打印字符串结束执行，让我们知道酒店是否实际构建成功。如果在任何蓝图的某处发生逻辑错误，将打印“Failed to\
    \ Build a Hotel”。\n\n现在我们可以讨论在该模式中使用的接口。首先，我们为所有住宿设施创建一个平面图接口供其实现。美国大多数商业住宿设施包含游泳池、大堂区域、房间和餐厅。我们还为我们特定的住宿建造者类创建了一个住宿建造者接口供其实现。`FloorPlan`\
    \ 接口：\n\n```csharp\nusing System;\ninterface FloorPlan{\n    public void setSwimmingPool(String\
    \ swimmingPool);\n    public void setLobbyArea(String lobbyArea);\n    public\
    \ void setRooms(String rooms);\n    public void setRestaurants(String restaurants);\n\
    }\n```\n\n等效的蓝图接口非常普通。以下是代表 `FloorPlan` 接口中函数的节点。\n\n![自动生成的图形用户界面、应用程序](img/Image00009.jpg)\
    \ ![自动生成的图形用户界面、应用程序](img/Image00010.jpg) ![自动生成的图形用户界面、应用程序](img/Image00011.jpg)\
    \ ![自动生成的图形用户界面、应用程序](img/Image00012.jpg) \n\n俗话说，“面向接口编程，而不是面向实现”（Gamma et.al,\
    \ 1995）。事实上，它是面向对象设计的核心原则。面向接口编程的主要益处是减少了子系统之间的实现依赖（Gamma et.al, 1995）。我们在建造者模式示例中直观地看到了这一点。具体来说，建造者模式将复杂对象的构建与其实际表示解耦（Gamma\
    \ et.al, 1995）。\n\n```csharp\ninterface LodgingBuilder{\n    public void buildSwimmingPool();\n\
    \    public void buildLobbyArea();\n    public void buildRooms();\n    public\
    \ void buildRestaurants();\n    public Lodging getLodging();\n}\n```\n\n`LodgingBuilder`\
    \ 接口蓝图的截图与 `FloorPlan` 接口蓝图的设计相同，因此为了简洁起见将其移除。今后，除非认为有助于加深读者的理解，否则将尽量减少接口蓝图图像。\n\
    \n接下来，我们创建一个实现 `FloorPlan` 接口的 `Lodging` 类。\n\n"
- fmt: "\n```java\nusing System;\nclass Lodging : FloorPlan{\n    private String swimmingPool;\n\
    \    private String lobbyArea;\n    private String rooms;\n    private String\
    \ restaurants;\n\n    public void setSwimmingPool(String swimmingPool) {\n   \
    \     this.swimmingPool = swimmingPool;\n    }\n\n    public void setLobbyArea(String\
    \ lobbyArea) {\n        this.lobbyArea = lobbyArea;\n    }\n\n    public void\
    \ setRooms(String rooms) {\n        this.rooms = rooms;\n    }\n\n    public void\
    \ setRestaurants(String restaurants) {\n        this.restaurants = restaurants;\n\
    \    }\n\n    public void lodgingCharacteristics() {\n        Console.WriteLine(swimmingPool);\n\
    \        Console.WriteLine(lobbyArea);\n        Console.WriteLine(rooms);\n  \
    \      Console.WriteLine(restaurants);\n    }\n}\n```\n\nThe `Lodging` blueprint:\n\
    \n![Graphical user interface, application Description automatically generated](Image00183.jpg)\
    \ \n\nBlueprints use `Event` nodes when calling void interface functions. The\
    \ blueprint version of the `Lodging` class prints the string value passed to the\
    \ function in addition to setting local variables. Also, we must make sure this\
    \ blueprint class implements the `FloorPlan` interface by adding it in the class\
    \ settings Interfaces sections.\n\nThe next two classes, `HotelLodgingBuilder`\
    \ and `MotelLodgingBuilder`, implement the lodging builder interface and provide\
    \ the custom specs for each type of lodging.\n\n```java\nclass HotelLodgingBuilder\
    \ implements LodgingBuilder {\n    private Lodging lodging;\n    public HotelLodgingBuilder()\
    \ {\n        this.lodging = new Lodging();\n    }\n\n    @Override\n    public\
    \ void buildLobbyArea() {\n        lodging.setLobbyArea(\"Grand Hall\");\n   \
    \ }\n\n    @Override\n    public void buildRestaurants() {\n        lodging.setRestaurants(\"\
    5 star Buffet\");\n    }\n\n    @Override\n    public void buildRooms() {\n  \
    \      lodging.setRooms(\"Luxury Suites\");\n    }\n\n    @Override\n    public\
    \ void buildSwimmingPool() {\n        lodging.setSwimmingPool(\"Indoor Lagoon\"\
    );\n    }\n\n    @Override\n    public Lodging getLodging() {\n        return\
    \ this.lodging;\n    }\n}\n```\n\nThe `HotelLodgingBuilder` blueprint construction\
    \ script event graph:\n\n![A screenshot of a computer Description automatically\
