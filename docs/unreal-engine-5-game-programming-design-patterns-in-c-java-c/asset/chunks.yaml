    \nFacade 模式视口打印：\n\n![](img/Image00112.jpg)\n\n## 行为模式\n\n我们讨论的行为模式帮助我们确定对象之间如何相互作用。此外，对象的责任也定义在行为模式中。我们必须在行为模式概述中提到通信。对象之间的运行时通信是行为模式实现的基础。\n\
    \n### 怪物在夜间出没……观察者模式\n\n观察者模式是一种流行的模式，应用于许多不同的软件开发范式。该模式的另一个名称是发布者-订阅者模式。我们有一个广播状态变化的发布者，以及一组监听这些广播的订阅者。\n\
    \n**优点**\n\n> ● 将发布者从订阅者中抽象出来的极佳方法\n> ● 发布者不需要了解关于订阅者的任何信息\n\n**缺点**\n\n> ● 由于\
    \ GoF（设计模式 Go）所说的“悬空引用”，必须小心处理取消订阅。\n\n#### 观察者模式实现\n\n钟楼是我们观察者模式示例中的发布者。订阅者是一群根据一天中时间改变行为的怪物。当钟楼的时间状态改变时，怪物会收到钟楼的通知。`Observer_Main`\
    \ 类：\n\n***Observer_Main.h***\n```cpp\n#pragma once\n#include \"CoreMinimal.h\"\
    \n#include \"GameFramework/Actor.h\"\n#include \"Observer_Main.generated.h\"\n\
    \nUCLASS()\nclass DESIGN_PATTERNS_API AObserver_Main : public AActor\n{\n    GENERATED_BODY()\n\
    public:\n    // 设置此 Actor 属性的默认值\n    AObserver_Main();\nprotected:\n    // 当游戏开始或被生成时调用\n\
    \    virtual void BeginPlay() override;\npublic:\n    // 每帧调用\n    virtual void\
    \ Tick(float DeltaTime) override;\n};\n```\n\n***Observer_Main.cpp***\n```cpp\n\
    #include \"Observer_Main.h\"\n#include \"ClockTower.h\"\n#include \"FreakyAllen.h\"\
    \n#include \"FreakyJeff.h\"\n#include \"FreakySue.h\"\n\n// 设置默认值\nAObserver_Main::AObserver_Main()\n\
    {\n    // 设置此 Actor 每帧都调用 Tick()。如果不需要，可以关闭它以提高性能。\n    PrimaryActorTick.bCanEverTick\
    \ = true;\n}\n\n// 当游戏开始或被生成时调用\nvoid AObserver_Main::BeginPlay()\n{\n    Super::BeginPlay();\n\
    \    // 生成钟楼\n    AClockTower* ClockTower = GetWorld()->SpawnActor<AClockTower>(AClockTower::StaticClass());\n\
    \    // 生成第一个订阅者并设置它的钟楼\n    AFreakyAllen* FreakyAllen = GetWorld()->SpawnActor<AFreakyAllen>(AFreakyAllen::StaticClass());\n\
    \    FreakyAllen->SetClockTower(ClockTower);\n    // 生成第二个订阅者并设置它的钟楼\n    AFreakyJeff*\
    \ FreakyJeff = GetWorld()->SpawnActor<AFreakyJeff>(AFreakyJeff::StaticClass());\n\
    \    FreakyJeff->SetClockTower(ClockTower);\n    // 生成第三个订阅者并设置它的钟楼\n    AFreakySue*\
    \ FreakySue = GetWorld()->SpawnActor<AFreakySue>(AFreakySue::StaticClass());\n\
    \    FreakySue->SetClockTower(ClockTower);\n    // 钟楼的时间，以便订阅者可以执行自己的例程\n    ClockTower->SetTimeOfDay(\"\
    Morning\");\n    ClockTower->SetTimeOfDay(\"Midday\");\n    ClockTower->SetTimeOfDay(\"\
    Evening\");\n}\n\n// 每帧调用\nvoid AObserver_Main::Tick(float DeltaTime)\n{\n   \
    \ Super::Tick(DeltaTime);\n}\n```\n\n`Observer_Main` 蓝图事件图：\n\n![自动生成的图形用户界面](img/Image00113.jpg)\
    \ ![自动生成的图形用户界面应用程序](img/Image00114.jpg)\n\n`Create ClockTower` 折叠图：\n\n![自动生成的图形用户界面应用程序](img/Image00115.jpg)\n\
    \n`Create FreakyAllen` 折叠图：\n\n![中等置信度生成的计算机截图](img/Image00116.jpg)\n\n`Create\
    \ FreakyJeff` 折叠图：\n\n![自动生成的视频游戏截图](img/Image00117.jpg)\n\n`Create FreakySue`\
    \ 折叠图：\n\n![中等置信度生成的计算机截图](img/Image00118.jpg)\n\n让我们实现 `Subscriber`：\n\n***Subscriber.h***\n\
    ```cpp\n#pragma once\n#include \"CoreMinimal.h\"\n#include \"UObject/Interface.h\"\
    \n#include \"Subscriber.generated.h\"\n\n// 此类不需要修改\nUINTERFACE(MinimalAPI)\n\
    class USubscriber : public UInterface\n{\n    GENERATED_BODY()\n};\n\n//向此类中添加接口函数。这是将被继承以实现此接口的类。\n\
    class DESIGN_PATTERNS_API ISubscriber\n{\n    GENERATED_BODY()\npublic:\n    //\
    \ Subscriber 的纯虚函数\n    virtual void Update(class APublisher* Publisher) = 0;\n\
    };\n```\n\n***Subscriber.cpp***\n```cpp\n#include \"Subscriber.h\"\n// 为任何非纯虚\
    \ ISubscriber 函数在此处添加默认功能。\n```\n\n让我们实现 `Publisher`：\n\n***Publisher.h***\n```cpp\n\
    #pragma once\n#include \"CoreMinimal.h\"\n#include \"GameFramework/Actor.h\"\n\
    #include \"Subscriber.h\"\n#include \"Publisher.generated.h\"\n\nUCLASS()\nclass\
    \ DESIGN_PATTERNS_API APublisher : public AActor\n{\n    GENERATED_BODY()\npublic:\n\
    \    // 设置此 Actor 属性的默认值\n    APublisher();\nprivate:\n    // 此发布者的订阅者\n    UPROPERTY()\n\
    \    TArray<AActor*> Subscribers = TArray<AActor*>();\nprotected:\n    // 当游戏开始或被生成时调用\n\
    \    virtual void BeginPlay() override;\npublic:\n    // 每帧调用\n    virtual void\
    \ Tick(float DeltaTime) override;\npublic:\n    // 将传递的订阅者添加到列表\n    virtual void\
    \ Subscribe(AActor* Subscriber);\n    // 从列表中移除传递的订阅者\n    virtual void UnSubscribe(AActor*\
    \ SubscriberToRemove);\n    // 通知所有订阅者发生了某些变化\n    virtual void NotifySubscribers();\n\
    };\n```\n\n***Publisher.cpp***\n\n"
- fmt: "\n```cpp\n#include \"Publisher.h\"\n// Sets default values\nAPublisher::APublisher()\n\
    {\n    // Set this actor to call Tick() every frame. You can turn this off to\
    \ improve performance if you don't need it.\n    PrimaryActorTick.bCanEverTick\
    \ = true;\n}\n// Called when the game starts or when spawned\nvoid APublisher::BeginPlay()\n\
    {\n    Super::BeginPlay();\n}\n\n// Called every frame\nvoid APublisher::Tick(float\
    \ DeltaTime)\n{\n    Super::Tick(DeltaTime);\n}\nvoid APublisher::Subscribe(AActor*\
    \ Subscriber)\n{\n    //Add the passed Subscriber\n    Subscribers.Add(Subscriber);\n\
    }\n\nvoid APublisher::UnSubscribe(AActor* SubscriberToRemove)\n{\n    //Remove\
    \ the passed Subscriber\n    Subscribers.Remove(SubscriberToRemove);\n}\n\nvoid\
    \ APublisher::NotifySubscribers()\n{\n    //Loop for each Subscriber\n    for\
    \ (AActor* Actor : Subscribers)\n    {\n        //Cast each of them to a concrete\
    \ Subscriber\n        ISubscriber* Sub = Cast<ISubscriber>(Actor);\n        if\
    \ (Sub)\n        {\n            //Notify each of them that something has changed,\
    \ so they can execute their own routine\n            Sub->Update(this);\n    \
    \    }\n    }\n}\n```\n\nHere is the publisher’s `Subscribe` function:\n\n![A\
