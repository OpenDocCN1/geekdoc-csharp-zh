    \ FString::Printf(TEXT(\"Concocting %s\"), Potion->GetPotionName()));\n    //Start\
    \ the concoct process\n    Potion->Boil();\n    Potion->Bubble();\n    Potion->Brew();\n\
    \    Potion->Bottle();\n    //Returns the created potion\n    return Potion;\n\
    }\n```\n\nHere we must deviate a bit from traditional code. There does not seem\
