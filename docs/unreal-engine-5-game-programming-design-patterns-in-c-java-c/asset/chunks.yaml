  trans: "\n\n```csharp\nusing System;\nnamespace Singleton\n{\n    class Singleton_Main\n\
    \    {\n        static void Main(string[] args)\n        {\n            Inventory\
    \ myInventory = Inventory.getInstance();\n            Console.WriteLine(myInventory);\n\
    \        }\n    }\n}\n```\n\n### `Singleton_Main` 蓝图事件图：\n\n![Graphical user interface\
    \ Description automatically generated](img/Image00055.jpg)\n\n这里存在一个 for 循环，是为了演示尝试创建多个指定的单例（Singleton）对象实例。如果一切设置正确，我们不应该允许创建多个库存的实例。\n\
    \n### `Create_Inventory_Instance` 折叠图：\n\n![A screenshot of a video game Description\
    \ automatically generated](img/Image00056.jpg)\n\n### `Instance_Created_Message`\
    \ 折叠图：\n\n![Graphical user interface, application Description automatically generated](img/Image00057.jpg)\n\
    \n### `Inventory` 类：\n\n```csharp\npublic class Inventory {\n    private static\
    \ readonly Inventory Instance = new Inventory();\n    private Inventory () {}\n\
    \    public static Inventory getInstance() {\n        return Instance;\n    }\n\
    }\n```\n\n### `Inventory` 蓝图构造脚本：\n\n![Graphical user interface, application Description\
    \ automatically generated](img/Image00058.jpg)\n\n虚幻引擎中不存在私有构造函数的概念。因此，我们必须创建另一种方法来防止创建新的单例对象。我们通过检查是否已经存在库存实例来实现这一点。如果库存实例确实存在，则尝试创建的新单例对象将被销毁。\n\
    \n### `isInstance_already_exist` 折叠图：\n\n![A screenshot of a video game Description\
    \ automatically generated](img/Image00059.jpg)\n\n### `kill_yourself` 折叠图：\n\n\
    ![Graphical user interface, application Description automatically generated](img/Image00060.jpg)\n\
    \n### 单例模式视图屏幕打印：\n\n![Text Description automatically generated](img/Image00061.jpg)\n\
    \n---\n\n> 适应并克服…… 适配器模式 (C#)\n\n### 适配器模式 UML 图\n\n![Diagram Description automatically\
    \ generated](img/Image00216.jpg)\n\n### 适配器模式实现\n\n在我们的适配器模式实现中，有一个使用弹弓弓的射手。我们希望能够让这个射手使用手枪。然而，我们想通过使用适配器模式来利用已经实现的现有代码。\n\
    \n### 主适配器类：\n\n```csharp\nusing System;\nnamespace Adapter\n{\n    class Adapter_Main\n\
    \    {\n        static void Main(string[] args)\n        {\n            Shooter\
    \ shooter = new Shooter(new GunAdapter());\n            shooter.sling();\n   \
    \     }\n    }\n}\n```\n\n### `Adapter_Main` 蓝图：\n\n![Graphical user interface,\
    \ application Description automatically generated](img/Image00062.jpg)\n\n###\
    \ `Create_Gun_Adapter` 折叠图：\n\n![Graphical user interface, application Description\
    \ automatically generated](img/Image00063.jpg)\n\n### `Create_Shooter` 折叠图：\n\n\
    ![A screenshot of a computer Description automatically generated with low confidence](img/Image00064.jpg)\n\
    \n### `SlingShot` 接口：\n\n```csharp\npublic interface SlingShot {\n    void sling();\n\
    }\n```\n\n### `GunAdapter` 类：\n\n```csharp\npublic class GunAdapter : SlingShot\
    \ {\n    private Gun weapon;\n    public GunAdapter() {\n        weapon = new\
    \ Gun();\n    }\n    public void sling() {\n        weapon.fire();\n    }\n}\n\
    ```\n\n### `GunAdapter` 蓝图：\n\n![Graphical user interface, application Description\
    \ automatically generated](img/Image00217.jpg)\n\n### `Gun` 类：\n\n```csharp\n\
    using System;\npublic class Gun {\n    public void fire() {\n        Console.WriteLine(\"\
    Our gun is firing\");\n    }\n}\n```\n\n### `Gun` 蓝图：\n\n![A picture containing\
    \ text, sign Description automatically generated](img/Image00218.jpg)\n\n### `Shooter`\
    \ 类：\n\n```csharp\npublic class Shooter : SlingShot {\n    private SlingShot slingShot;\n\
    \    public Shooter(SlingShot slingShot) {\n        this.slingShot = slingShot;\n\
    \    }\n    public void sling() {\n        slingShot.sling();\n    }\n}\n```\n\
    \n我们可以看到 `Shooter` 类没有射击手枪的功能。然而，它确实有发射弹弓的功能。这两项技能都基于从武器中发射射物。我们希望复用弹弓的功能，并将其适配用于手枪的使用。\n\
    \n### `Shooter` 构造脚本：\n\n![Graphical user interface, application Description automatically\
    \ generated](img/Image00219.jpg)\n\n### `Sling` 函数：\n\n![Graphical user interface\
    \ Description automatically generated](img/Image00220.jpg)\n\n### 适配器模式视图打印：\n\
    \n![](img/Image00070.jpg)\n\n---\n\n> 装饰强大的敌人…… 装饰器模式 (C#)\n\n### 装饰器模式 UML 图\n\
    \n![Diagram Description automatically generated](img/Image00221.jpg)\n\n### 装饰器模式实现\n\
    \n我们的实现包含一个最初是近战的敌人。我们希望“装饰”这个敌人，并创建一个可以使用射物的敌人。因此，增加的功能是射物能力。\n\n### `Decorator_Main`\
    \ 类：\n\n```csharp\nusing System;\nnamespace Decorator\n{\n    class Decorator_Main\n\
    \    {\n        static void Main(string[] args)\n        {\n            Console.WriteLine(\"\
    Melee Enemies are on the horizon\");\n            Enemy enemy = new MeleeEnemy();\n\
    \            enemy.fight();\n            enemy.die();\n            Console.WriteLine(\"\
    Melee Enemies cause \" + enemy.getDamage() + \" damage.\");\n            Console.WriteLine(\"\
    Enemies are armed with guns\");\n            Enemy projectileEnemy = new ProjectileEnemy(enemy);\n\
    \            projectileEnemy.fight();\n            projectileEnemy.die();\n  \
    \          Console.WriteLine(\"Projectile Enemies cause \" + projectileEnemy.getDamage()\
    \ + \" damage.\");\n        }\n    }\n}\n```\n\n我们可以从 `Decorator_Main` 中看到，我们不需要创建一个单独的\
    \ `Enemy` 类来添加功能。我们仅仅是“装饰”敌人，现在我们就有了一个射物敌人。实质上，我们使用装饰器在运行时改变了敌人的行为。\n\n### `Decorator_Main`\
    \ 蓝图事件图：\n\n![Graphical user interface, application Description automatically\
    \ generated](img/Image00222.jpg)\n\n近战敌人和被装饰过的射物敌人被拆分为独立的图，以便于读性。\n\n### `Melee_Enemy_Actions`\
    \ 折叠图：\n\n![A picture containing text, electronics Description automatically generated](img/Image00223.jpg)\n\
    \n### `Create_Enemy` 折叠图：\n\n![Graphical user interface, application Description\
    \ automatically generated](img/Image00224.jpg)\n\n### `Enemy_Fight` 折叠图：\n\n![Graphical\
    \ user interface, application Description automatically generated](img/Image00074.jpg)\n\
    \n### `Enemy_Die` 折叠图：\n\n![A picture containing text, electronics Description\
    \ automatically generated](img/Image00075.jpg)\n\n### `Enemy_GetDamage` 折叠图：\n\
    \n![A picture containing text, electronics Description automatically generated](img/Image00076.jpg)\n\
    \n### `Enemy_Damage_Message` 折叠图：\n\n![Graphical user interface, application Description\
    \ automatically generated](img/Image00077.jpg)\n\n### `Projectile_Enemy_Actions`\
    \ 折叠图：\n\n![Graphical user interface Description automatically generated](img/Image00225.jpg)\n\
    \n### `Create_Projectile_Enemy` 折叠图：\n\n![Graphical user interface, application\
    \ Description automatically generated](img/Image00226.jpg)\n\n近战敌人和射物敌人之间的显著区别在于构造。射物敌人构造函数接受之前创建的敌人作为参数。这样我们就可以复用它来装饰敌人对象。\n\
    \n### `Projectile_Enemy_Fight` 折叠图：\n\n![A picture containing text, electronics\
    \ Description automatically generated](img/Image00080.jpg)\n\n### `Projectile_Enemy_Die`\
    \ 折叠图：\n\n"
- fmt: "\n![Graphical user interface, application Description automatically generated](Image00081.jpg)\
    \ \n\n### The `Projectile_Enemy_GetDamage` collapsed graph:\n\n![A picture containing\
    \ text, electronics, silver Description automatically generated](Image00082.jpg)\
    \ \n\n### The `Projectile_Enemy_Damage_Message` collapsed graph:\n\n![A screenshot\
    \ of a video game Description automatically generated with medium confidence](Image00083.jpg)\
    \ \n\n### The `Enemy` Interface:\n\n```csharp\npublic interface Enemy { \n   \
    \ void fight (); //How much damage the enemy gives \n    int getDamage (); \n\
    \    void die ();\n}\n```\n\nThe `Enemy` interface is shared across all enemy\
    \ objects.\n\n### The `MeleeEnemy` class:\n\n```csharp\nusing System;\npublic\
    \ class MeleeEnemy : Enemy { \n    public void fight() { \n        Console.WriteLine(\"\
    The enemy throws heavy punches\"); \n    } \n    public int getDamage() { \n \
    \       return 5; \n    } \n    public void die() { \n        Console.WriteLine(\"\
    The enemy writhes in agony and disintegrates\"); \n    }\n}\n```\n\n### The `MeleeEnemy`\
    \ blueprint event graph:\n\n![Graphical user interface, application Description\
    \ automatically generated](Image00227.jpg) \n\n### The `GetDamage` function in\
    \ the `MeleeEnemy` blueprint:\n\n![Graphical user interface Description automatically\
    \ generated](Image00228.jpg) \n\n### The `ProjectileEnemy` class:\n\n```csharp\n\
    using System;\npublic class ProjectileEnemy : Enemy { \n    private Enemy decoratedEnemy;\
    \ \n    public ProjectileEnemy(Enemy decoratedEnemy) { \n        this.decoratedEnemy\
    \ = decoratedEnemy; \n    } \n    public void fight() {\n        decoratedEnemy.fight();\n\
    \        Console.WriteLine(\"The enemy blows a kiss and fires a gun\"); \n   \
    \ } \n    public int getDamage() { \n        return decoratedEnemy.getDamage()\
    \ + 95; \n    } \n    public void die() { \n        decoratedEnemy.die(); \n \
    \   }\n}\n```\n\nWe can see that the projectile enemy causes more damage than\
    \ the melee enemy. We use the melee damage causing attribute and we increase it\
    \ by 95 for the projectile enemy.\n\n### The `ProjectileEnemy` blueprint event\
    \ graph:\n\n![Graphical user interface, application Description automatically\
    \ generated](Image00229.jpg) \n\n### The `GetDamage` function in the `ProjectileEnemy`\
    \ blueprint:\n\n![A screenshot of a computer Description automatically generated\
    \ with low confidence](Image00230.jpg) \n\n### Decorator Pattern viewport print:\n\
    \n![Text Description automatically generated](Image00088.jpg) \n\nWe can see the\
    \ melee enemies coming. The melee enemy fights us with punches. The enemy then\
    \ dies. However, we take a 5-count damage from the melee enemy. The melee enemy\
    \ is then given new functionality in the form of a projectile. The enemy can punch\
    \ and shoot a gun causing damage of 100.\n\n# The Freaks Come out at night… Observer\
    \ Pattern (C#)\n\n## Observer Pattern UML Diagram\n\n![Diagram Description automatically\
    \ generated](Image00241.jpg) \n\n## Observer Pattern Implementation\n\nA clock\
    \ tower is our publisher for the Observer pattern example. The subscribers consist\
    \ of a group of freaks who change their behavior based on the time of day. The\
    \ freaks receive notifications from the clock tower when the clock towers time\
    \ state has changed.\n\n### The `Observer_Main` class:\n\n```csharp\nusing System;\n\
    namespace Observer{\n    class Observer_Main { \n        static void Main(string[]\
    \ args) {\n            ClockTower clockTower = new ClockTower();\n           \
    \ FreakyAllen freakyAllen = new FreakyAllen(clockTower);\n            FreakySue\
    \ freakySue = new FreakySue(clockTower);\n            FreakyJeff freakyJeff =\
    \ new FreakyJeff(clockTower);\n            clockTower.setTimeOfDay(\"Morning\"\
    );\n            clockTower.setTimeOfDay(\"Midday\");\n            clockTower.setTimeOfDay(\"\
    Evening\");\n        }\n    }\n}\n```\n\n### The `Observer_Main` blueprint event\
    \ graph:\n\n![A screenshot of a video game Description automatically generated](Image00242.jpg)\
    \ \n\n### The `Create ClockTower` collapsed graph:\n\n![Graphical user interface,\
    \ application Description automatically generated](Image00243.jpg) \n\n### The\
    \ `Create FreakyAllen` collapsed graph:\n\n![Graphical user interface, text, application,\
