    \ blueprint:\n\n![A screenshot of a computer Description automatically generated\
    \ with low confidence](Image00087.jpg) \n\nDecorator Pattern viewport print:\n\
    \n![](Image00088.jpg) \n\nWe can see the melee enemies coming. The melee enemy\
    \ fights us with punches. The enemy then dies. However, we take a 5-count damage\
    \ from the melee enemy. The melee enemy is then given new functionality in the\
    \ form of a projectile. The enemy can punch and shoot a gun causing damage of\
    \ 100.\n\n> Space Travel Looks Easy… Façade Pattern\n\nGoF defines the Façade\
    \ pattern as providing a central interface to a set of interfaces (Gamma et.al,\
    \ 1995). The Façade pattern is great when we want to simplify the interaction\
    \ between a client and a very complex system.\n\n**The Good**\n\n> ●  Simplifies\
    \ the use of a very complex system\n\n> ●  Reduces coupling between clients and\
    \ various subsystems\n\n**The Not So Good**\n\n> ●  Hides possibly overly complex\
    \ characteristics of a subsystem\n\n**Façade Pattern Implementation**\n\nSpace\
    \ travel is not easy. The most important part of space travel is the starship.\
    \ However, the starship has complexity of its own. This is where the *StarShipFacade*\
    \ comes into play.\n\nThe Façade main class:\n\n***StarShipFacade.h***\n\n#pragma\
    \ once#include \"CoreMinimal.h\"#include \"GameFramework/Actor.h\"#include \"\
    StarShipCrewMember.h\"#include \"StarShipFacade_Main.generated.h\"UCLASS **()**class\
    \ DESIGN_PATTERNS_API AStarShipFacade_Main **:** public AActor**{**GENERATED_BODY\
    \ **()**public **:** // Sets default values for this actor's propertiesAStarShipFacade_Main\
    \ **();**protected **:** // Called when the game starts or when spawned virtual\
    \ void BeginPlay **()** override **;**public **:** // Called every frame virtual\
    \ void Tick **(** float DeltaTime **)** override **;****};**\n\n***StarShipFacade.cpp***\n\
    \n#include \"StarShipFacade_Main.h\"#include \"StarShipFacade.h\"// Sets default\
    \ valuesAStarShipFacade_Main **::** AStarShipFacade_Main **()****{** // Set this\
    \ actor to call Tick() every frame.  You can turn this off to improve performance\
    \ if you don't need it.PrimaryActorTick **.** bCanEverTick **=** **true** **;****}**//\
    \ Called when the game starts or when spawnedvoid AStarShipFacade_Main **::**\
    \ BeginPlay **()****{**Super **::** BeginPlay **();** //Create the Ship Facade\
    \ ActorAStarShipFacade ***** ShipFacade **=** GetWorld **()->** SpawnActor **<**\
    \ AStarShipFacade **>(** AStarShipFacade **::** StaticClass **());** //Execute\
    \ the needed tasksShipFacade **->** Reveille **();**ShipFacade **->** PlanOfTheDay\
    \ **();**ShipFacade **->** Taps **();****}**// Called every framevoid AStarShipFacade_Main\
    \ **::** Tick **(** float DeltaTime **)****{**Super **::** Tick **(** DeltaTime\
    \ **);****}**"
