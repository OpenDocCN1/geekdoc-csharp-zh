    \ \n\nThis is the final screenshot of the construction of a hotel.\n\n![](Image00026.jpg)\
    \ \n\nStrings printed to the viewport are not impressive. However, these strings\
    \ represent “what could be.” In development, one has the 3D or 2D artwork associated\
    \ with these strings. Thanks to the Builder Pattern, we have a framework to build\
    \ different versions of hotels piece by piece.\n\n> Boil and Bubble, Brew and\
    \ Bottle… Factory Method\n\nGoF says the intent of the Factory Method is to “define\
    \ an interface for creating an object, but let subclasses decide which class to\
    \ instantiate” (Gamma et.al, 1995). The Factory Method invokes another important\
    \ object-oriented principle. That principle is called “Dependency Inversion”.\
    \ We want subclasses to depend on abstractions and not the other way around. Basically,\
    \ we want children to depend on their parents.\n\n**The Good**\n\n> ●  Encapsulate\
    \ instantiation\n\n> ●  Concrete products are not coupled to their creator\n\n\
    **The Not So Good**\n\n> ●  Can create difficult to follow code because of the\
    \ level of abstraction.\n\n**Factory Method Implementation**\n\nWe have creator,\
    \ concrete creator, and product participants in the Factory Method design pattern.\
    \ Our example implementation has a *PotionShop* abstract class as a creator. The\
    \ concrete creators are *InnerRealmPotionShop* and *OuterRealmPotionShop* . These\
    \ concrete creators inherit functionality from the *PotionShop* abstract class.\
    \ Our concrete products are:\n\n> *InnerRealmHealthPotion*\n\n> *InnerRealmPowerPotion*\n\
    \n> *InnerRealmSkillPotion*\n\n> *OuterRealmHealthPotion*\n\n> *OuterRealmPowerPotion*\n\
    \n> *OuterRealmSkillPotion*\n\nAll these products inherit functionality from the\
    \ *Potion* abstract class. Using blueprints, we are going to implement the *InnerRealmPotionShop*\
    \ and its products, namely:\n\n> *InnerRealmHealthPotion*\n\n> *InnerRealmPowerPotion*\n\
    \n> *InnerRealmSkillPotion*\n\nThe same ideas and principles apply to the creation\
    \ of the *OuterRealmPotionShop* and its products.\n\nThe *FactoryMethod* class\
    \ contains the main function. In terms of Blueprints, we can think of this class\
    \ as the one that needs to be physically dragged into the game world. The other\
    \ “concrete” classes do not need to be physically dragged into the world.\n\n\
    ***FactoryMethod_Main.h***\n\n#pragma once#include \"CoreMinimal.h\"#include \"\
    GameFramework/Actor.h\"#include \"FactoryMethod_Main.generated.h\"UCLASS **()**class\
    \ DESIGN_PATTERNS_API AFactoryMethod_Main **:** public AActor**{**GENERATED_BODY\
    \ **()**public **:** // Sets default values for this actor's propertiesAFactoryMethod_Main\
    \ **();**protected **:** // Called when the game starts or when spawned virtual\
    \ void BeginPlay **()** override **;**public **:** // Called every frame virtual\
    \ void Tick **(** float DeltaTime **)** override **;****};**\n\n***FactoryMethod_Main.cpp***"
