  trans: "\n`机器有钱` 折叠图：\n\n![Graphical user interface, application Description automatically\
    \ generated](img/Image00164.jpg) \n\n`机器没钱` 折叠图：\n\n![A screenshot of a video\
    \ game Description automatically generated with medium confidence](img/Image00165.jpg)\
    \ \n\n`ToString` 函数：\n\n![Graphical user interface, application Description automatically\
    \ generated](img/Image00166.jpg) \n\n`State` 接口：\n\n***State.h***\n\n```cpp\n\
    #pragma once\n#include \"CoreMinimal.h\"\n#include \"UObject/Interface.h\"\n#include\
    \ \"State.generated.h\"\n// 此类不需要被修改。\nUINTERFACE( MinimalAPI )\nclass UState\
    \ : public UInterface\n{\n    GENERATED_BODY()\n};\n\nclass DESIGN_PATTERNS_API\
    \ IState\n{\n    GENERATED_BODY()\n    // 向此类添加接口函数。该类将是被继承以实现此接口的类。\npublic:\n\
    \    // State 的纯虚函数\n    virtual void InsertCoin() = 0;\n    virtual void RejectCoin()\
    \ = 0;\n    virtual void PullLever() = 0;\n    virtual void Payout() = 0;\n  \
    \  virtual void RestockDollars() = 0;\n    virtual FString ToString() = 0;\n \
    \   virtual void SetSlotMachine(class AOldSchoolSlotMachine* SlotMachine) = 0;\n\
    };\n```\n\n***State.cpp***\n\n```cpp\n#include \"State.h\"\n// 为任何不是纯虚的 IState\
    \ 函数添加默认功能。\n```\n\nState 模式视口打印：\n\n![](img/Image00167.jpg) \n\n> 你击沉了我的战舰……\
    \ 策略模式\n\nGoF（设计模式 Go）将策略模式定义为一种“策略”（Gamma et.al, 1995）。我们希望一组算法是可替换的，并且可以独立地变化。通过下面的示例，这一点变得更加清晰。\n\
    \n**优点**\n\n> ● 提供了子类化的替代方案（Gamma et.al, 1995）。\n\n**缺点**\n\n> ● 对象的数量可能会出乎意料地增加。\n\
    \n### 策略模式实现\n\n我们拥有一种对抗海上不同敌人的策略。如果威胁较小，则使用蛮力策略。如果有许多敌人，我们使用分治法策略。如果战斗被认为是徒劳的，则执行撤退策略。`Strategy_Main`\
    \ 类：\n\n***Strategy_Main.h***\n\n```cpp\n#pragma once\n#include \"CoreMinimal.h\"\
    \n#include \"GameFramework/Actor.h\"\n#include \"Strategy_Main.generated.h\"\n\
    UCLASS()\nclass DESIGN_PATTERNS_API AStrategy_Main : public AActor\n{\n    GENERATED_BODY()\n\
    public:\n    // 设置此 actor 属性的默认值\n    AStrategy_Main();\nprotected:\n    // 在游戏开始或生成时调用\n\
    \    virtual void BeginPlay() override;\npublic:\n    // 每帧调用\n    virtual void\
    \ Tick(float DeltaTime) override;\n};\n```\n\n***Strategy_Main.cpp***\n\n```cpp\n\
    #include \"Strategy_Main.h\"\n#include \"BattleShip.h\"\n#include \"BruteForceStrategy.h\"\
    \n#include \"DivideConquerStrategy.h\"\n#include \"RetreatStrategy.h\"\n// 设置默认值\n\
    AStrategy_Main::AStrategy_Main()\n{\n    // 设置此 actor 每帧调用 Tick()。如果你不需要，可以关闭它以提高性能。\n\
    \    PrimaryActorTick.bCanEverTick = true;\n}\n// 在游戏开始或生成时调用\nvoid AStrategy_Main::BeginPlay()\n\
    {\n    Super::BeginPlay();\n    // 敌人警告日志\n    GEngine->AddOnScreenDebugMessage(-1,\
    \ 15.f, FColor::Yellow, TEXT(\"一艘小护卫舰想找点麻烦\"));\n    // 生成战舰\n    ABattleShip*\
    \ BattleShip = GetWorld()->SpawnActor<ABattleShip>(ABattleShip::StaticClass());\n\
    \    // 创建蛮力策略并将其设置为战舰\n    ABruteForceStrategy* BruteForceStrategy = GetWorld()->SpawnActor<ABruteForceStrategy>(ABruteForceStrategy::StaticClass());\n\
    \    BattleShip->AlterManeuvers(BruteForceStrategy);\n    // 使用当前策略交战\n    BattleShip->Engage();\n\
    \    // 敌人警告日志\n    GEngine->AddOnScreenDebugMessage(-1, 15.f, FColor::Yellow,\
    \ TEXT(\"四艘小护卫舰想找点麻烦\"));\n    // 创建分治策略并将其设置为战舰\n    ADivideConquerStrategy*\
    \ DivideConquerStrategy = GetWorld()->SpawnActor<ADivideConquerStrategy>(ADivideConquerStrategy::StaticClass());\n\
    \    BattleShip->AlterManeuvers(DivideConquerStrategy);\n    // 使用当前策略交战\n   \
    \ BattleShip->Engage();\n    // 敌人警告日志\n    GEngine->AddOnScreenDebugMessage(-1,\
    \ 15.f, FColor::Yellow, TEXT(\"一个航母战斗群想找点麻烦\"));\n    // 创建撤退策略并将其设置为战舰\n    ABreatStrategy*\
    \ RetreatStrategy = GetWorld()->SpawnActor<ABreatStrategy>(ABreatStrategy::StaticClass());\n\
    \    BattleShip->AlterManeuvers(RetreatStrategy);\n    // 使用当前策略交战\n    BattleShip->Engage();\n\
    }\nvoid AStrategy_Main::Tick(float DeltaTime)\n{\n    // 此处逻辑在示例中保持结构\n}\n```\n\
    \n`Strategy_Main` Tick 事件：\n\n![](img/Image0168.jpg) \n\n`创建蛮力策略` 图图：\n\n![](img/Image0169.jpg)\
    \ \n\n`生成战舰` 图图：\n\n![](img/Image0170.jpg) \n\n`执行蛮力策略` 图图：\n\n![](img/Image0171.jpg)\
    \ \n\n`执行分治策略` 图图：\n\n![](img/Image0172.jpg) \n\n`执行撤退策略` 图图：\n\n![](img/Image0173.jpg)\
    \ \n\n`BattleShip` 类：\n\n***BattleShip.h***\n\n```cpp\n#pragma once\n#include\
    \ \"CoreMinimal.h\"\n#include \"GameFramework/Actor.h\"\n#include \"BattleStrategy.h\"\
    \n#include \"BattleShip.generated.h\"\nUCLASS()\nclass ABattleShip : public AActor\n\
    {\n    GENERATED_BODY()\npublic:\n    ABattleShip();\nprivate:\n    // 当前策略\n\
    \    IBattleStrategy* BattleStrategy;\nprotected:\n    virtual void BeginPlay()\
    \ override;\npublic:\n    virtual void Tick(float DeltaTime) override;\n    //\
    \ 改变策略并设置 \"BattleStrategy\" 变量\n    void AlterManeuvers(AActor* myBattleStrategy);\n\
    \    // 与当前策略交战\n    void Engage();\n};\n```\n\n***BattleShip.cpp***\n\n```cpp\n\
    #include \"BattleShip.h\"\n// 设置默认值\nABattleShip::ABattleShip()\n{\n}\nvoid ABattleShip::BeginPlay()\n\
    {\n    Super::BeginPlay();\n}\n// 每帧调用\nvoid ABattleShip::Tick(float DeltaTime)\n\
    {\n    Super::Tick(DeltaTime);\n}\nvoid ABattleShip::AlterManeuvers(AActor* myBattleStrategy)\n\
    {\n    // 尝试转换传入的策略并设置为当前\n    BattleStrategy = Cast<IBattleStrategy>(myBattleStrategy);\n\
    \    // 如果转换失败则记录错误\n    if (!BattleStrategy)\n    {\n        GEngine->AddOnScreenDebugMessage(-1,\
    \ 15.f, FColor::Red, TEXT(\"无效转换！请查看输出日志更多详情\"));\n        UE_LOG(LogTemp, Error,\
    \ TEXT(\"AlterManeuvers(): 该 Actor 不是 BattleStrategy！你确定该 Actor 实现了该接口吗？\"));\n\
    \    }\n}\nvoid ABattleShip::Engage()\n{\n    // 如果当前策略为空则记录错误\n    if (!BattleStrategy)\n\
    \    {\n        UE_LOG(LogTemp, Error, TEXT(\"Engage(): BattleStrategy 为空，请确保它已初始化。\"\
    ));\n        return;\n    }\n    // 执行当前策略策略\n    BattleStrategy->Maneuver();\n\
    }\n```\n\n`BattleShip` 脚本：\n\n![Graphical user interface Description automatically\
    \ generated](img/Image00174.jpg) \n\n`AlterManeuvers` 蓝图函数：\n\n"
- fmt: "\n![Graphical user interface Description automatically generated](Image00175.jpg)\
    \ \n\nIs identical to the `BattleShip` construction with the exception of actually\
    \ setting the `BattleStrategy` variable manually inside the function because it\
    \ is not exposed on spawn.\n\nThe `engage` blueprint function:\n\n![Graphical\
    \ user interface, application Description automatically generated](Image00176.jpg)\
    \ \n\nThe `BattleShipStrategy` interface:\n\n**BattleShipStrategy.h**\n\n```cpp\n\
    #pragma once\n#include \"CoreMinimal.h\"\n#include \"UObject/Interface.h\"\n#include\
    \ \"BattleShipStrategy.generated.h\"\n// This class does not need to be modified.\n\
    UINTERFACE( MinimalAPI )\nclass UBattleShipStrategy : public UInterface\n{\n \
    \   GENERATED_BODY()\n};\n\nclass DESIGN_PATTERNS_API IBattleShipStrategy\n{\n\
    \    GENERATED_BODY()\n // Add interface functions to this class. This is the\
    \ class that will be inherited to implement this interface.\npublic: \n //The\
    \ pure virtual functions of the BattleShipStrategy\n    virtual void Maneuver()\
    \ = 0;\n};\n```\n\n**BattleShipStrategy.cpp**\n\n```cpp\n#include \"BattleShipStrategy.h\"\
    \n// Add default functionality here for any IBattleShipStrategy functions that\
    \ are not pure virtual.\n```\n\n### The `BruteForceStrategy` class:\n\n**BruteForceStrategy.h**\n\
    \n```cpp\n#pragma once\n#include \"CoreMinimal.h\"\n#include \"GameFramework/Actor.h\"\
    \n#include \"BattleShipStrategy.h\"\n#include \"BruteForceStrategy.generated.h\"\
    \nUCLASS()\nclass DESIGN_PATTERNS_API ABruteForceStrategy : public AActor, public\
    \ IBattleShipStrategy\n{\n    GENERATED_BODY()\npublic: \n // Sets default values\
    \ for this actor's properties\n    AButeForceStrategy();\nprotected: \n // Called\
    \ when the game starts or when spawned\n    virtual void BeginPlay() override;\n\
    public: \n // Called every frame\n    virtual void Tick(float DeltaTime) override;\
    \ \n //Execute the Maneuver of this Strategy\n    virtual void Maneuver() override;\n\
    };\n```\n\n**BruteForceStrategy.cpp**\n\n```cpp\n#include \"BruteForceStrategy.h\"\
    \n// Sets default values\nAButeForceStrategy::AButeForceStrategy()\n{ \n // Set\
    \ this actor to call Tick() every frame.  \n // You can turn this off to improve\
    \ performance if you don't need it.\nPrimaryActorTick.bCanEverTick = true;\n}\n\
    // Called when the game starts or when spawned\nAButeForceStrategy::BeginPlay()\n\
    {\n    Super::BeginPlay();\n}\n// Called every frame\nAButeForceStrategy::Tick(float\
    \ DeltaTime)\n{\n    Super::Tick(DeltaTime);\n}\nAButeForceStrategy::Maneuver()\n\
    { \n //Execute the routine of this type of Strategy\nGEngine->AddOnScreenDebugMessage(-1,\
    \ 15.f, FColor::Yellow, TEXT(\"We can take these ships head on\"));\n}\n```\n\n\
    The `BruteForceStrategy` blueprint event graph:\n\n![](Image00177.jpg) \n\n###\
    \ The `DivideConquerStrategy` class:\n\n**DivideConquerStrategy.h**\n\n```cpp\n\
    #pragma once\n#include \"CoreMinimal.h\"\n#include \"GameFramework/Actor.h\"\n\
    #include \"BattleShipStrategy.h\"\n#include \"DivideConquerStrategy.generated.h\"\
    \nUCLASS()\nclass DESIGN_PATTERNS_API ADivideConquerStrategy : public AActor,\
    \ public IBattleShipStrategy\n{\n    GENERATED_BODY()\npublic: \n // Sets default\
    \ values for this actor's properties\n    ADivideConquerStrategy();\nprotected:\
    \ \n // Called when the game starts or when spawned\n    virtual void BeginPlay()\
    \ override;\npublic: \n // Called every frame\n    virtual void Tick(float DeltaTime)\
    \ override; \n //Execute the Maneuver of this Strategy\n    virtual void Maneuver()\
    \ override;\n};\n```\n\n**DivideConquerStrategy.cpp**\n\n```cpp\n#include \"DivideConquerStrategy.h\"\
    \n// Sets default values\nADivideConquerStrategy::ADivideConquerStrategy()\n{\
    \ \n // Set this actor to call Tick() every frame.  \n // You can turn this off\
    \ to improve performance if you don't need it.\nPrimaryActorTick.bCanEverTick\
    \ = true;\n}\n// Called when the game starts or when spawned\nADivideConquerStrategy::BeginPlay()\n\
    {\n    Super::BeginPlay();\n}\n// Called every frame\nADivideConquerStrategy::Tick(float\
    \ DeltaTime)\n{\n    Super::Tick(DeltaTime);\n}\nADivideConquerStrategy::Maneuver()\n\
    { \n //Execute the routine of this type of Strategy\nGEngine->AddOnScreenDebugMessage(-1,\
    \ 15.f, FColor::Yellow, TEXT(\"Lure ships away from each other and attack each\
    \ individually\"));\n}\n```\n\nThe `DivideConquerStrategy` blueprint event graph:\n\
    \n![](Image00178.jpg) \n\n### The `RetreatStrategy` class:\n\n**RetreatStrategy.h**\n\
    \n```cpp\n#pragma once\n#include \"CoreMinimal.h\"\n#include \"GameFramework/Actor.h\"\
    \n#include \"BattleShipStrategy.h\"\n#include \"RetreatStrategy.generated.h\"\n\
    UCLASS()\nclass DESIGN_PATTERNS_API ARetreatStrategy : public AActor, public IBattleShipStrategy\n\
    {\n    GENERATED_BODY()\npublic: \n // Sets default values for this actor's properties\n\
    \    ARetreatStrategy();\nprotected: \n // Called when the game starts or when\
    \ spawned\n    virtual void BeginPlay() override;\npublic: \n // Called every\
    \ frame\n    virtual void Tick(float DeltaTime) override; \n //Execute the Maneuver\
    \ of this Strategy\n    virtual void Maneuver() override;\n};\n```\n\n**RetreatStrategy.cpp**\n\
    \n```cpp\n#include \"RetreatStrategy.h\"\n// Sets default values\nARetreatStrategy::ARetreatStrategy()\n\
    { \n // Set this actor to call Tick() every frame.  \n // You can turn this off\
    \ to improve performance if you don't need it.\nPrimaryActorTick.bCanEverTick\
    \ = true;\n}\n// Called when the game starts or when spawned\nARetreatStrategy::BeginPlay()\n\
    {\n    Super::BeginPlay();\n}\n// Called every frame\nARetreatStrategy::Tick(float\
    \ DeltaTime)\n{\n    Super::Tick(DeltaTime);\n}\nARetreatStrategy::Maneuver()\n\
    { \n //Execute the routine of this type of Strategy\nGEngine->AddOnScreenDebugMessage(-1,\
    \ 15.f, FColor::Yellow, TEXT(\"Full speed away!\"));\n}\n```\n\nThe `RetreatStrategy`\
    \ blueprint event graph:\n\n![](Image00179.jpg) \n\nThe Strategy pattern viewport\
    \ print:\n\n![](Image00180.jpg) \n\n> Creational Patterns (Java)\n\n> Hotel Motel\
    \ Holiday Inn… Builder Pattern (Java)\n\n**Builder Pattern UML Diagram**\n\n![Timeline\
    \ Description automatically generated with medium confidence](Image00181.jpg)\
    \ \n\n### Builder Pattern Implementation\n\nThe `Builder` class contains the main\
    \ function in Java. In terms of Blueprints, we can think of this class as the\
    \ one that actually needs to be physically dragged into the game world. The other\
    \ “concrete” classes do not need to be physically dragged into the world.\n\n\
    ```java\nclass Builder_Main{\n    public static void main(String[] args) {\n \
    \       LodgingBuilder hotelBuilder = new HotelLodgingBuilder();\n        ArchitecturalEngineer\
    \ engineer = new ArchitecturalEngineer(hotelBuilder);\n        engineer.constructLodging();\n\
    \        Lodging lodging = engineer.getLodging();\n        lodging.lodgingCharacteristics();\n\
    \    }\n}\n```\n\nThe blueprint equivalent of the `Builder_Main` class:\n\n![Graphical\
    \ user interface Description automatically generated](Image00182.jpg) \n\nThe\
    \ `Set hotelBuilder` and `Set engineer` collapsed graph are respectively:\n\n\
    ![Graphical user interface, application Description generated](Image00005.jpg)\
    \ \n\nand\n\n![Graphical user interface, text, application Description generated](Image00006.jpg)\
    \ \n\nThe `Set hotelBuilder` collapsed graph represents this line of code:\n\n\
    `LodgingBuilder hotelBuilder = new HotelLodgingBuilder();`\n"
