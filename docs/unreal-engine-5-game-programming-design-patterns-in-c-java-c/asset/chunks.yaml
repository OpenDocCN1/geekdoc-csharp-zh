    \ swimmingPool;\n    private String lobbyArea;\n    private String rooms;\n  \
    \  private String restaurants;\n\n    public void setSwimmingPool(String swimmingPool)\
    \ {\n        this.swimmingPool = swimmingPool;\n    }\n\n    public void setLobbyArea(String\
    \ lobbyArea) {\n        this.lobbyArea = lobbyArea;\n    }\n\n    public void\
    \ setRooms(String rooms) {\n        this.rooms = rooms;\n    }\n\n    public void\
    \ setRestaurants(String restaurants) {\n        this.restaurants = restaurants;\n\
    \    }\n\n    public void lodgingCharacteristics() {\n        Console.WriteLine(swimmingPool);\n\
    \        Console.WriteLine(lobbyArea);\n        Console.WriteLine(rooms);\n  \
    \      Console.WriteLine(restaurants);\n    }\n}\n```\n\n`Lodging` 蓝图：\n\n![图形用户界面，应用程序描述自动生成](img/Image00183.jpg)\
    \ \n\n蓝图在调用 void 接口函数时使用 `Event` 节点。`Lodging` 类的蓝图版本除了设置本地变量外，还会打印传递给函数的字符串值。此外，我们必须通过在类设置的\
    \ Interfaces 部分添加，确保该蓝图类实现了 `FloorPlan` 接口。\n\n接下来两个类 `HotelLodgingBuilder` 和\
    \ `MotelLodgingBuilder` 实现了住宿构建器接口，并为每种住宿提供了自定义规格。\n\n```java\nclass HotelLodgingBuilder\
    \ implements LodgingBuilder {\n    private Lodging lodging;\n    public HotelLodgingBuilder()\
    \ {\n        this.lodging = new Lodging();\n    }\n\n    @Override\n    public\
    \ void buildLobbyArea() {\n        lodging.setLobbyArea(\"Grand Hall\");\n   \
    \ }\n\n    @Override\n    public void buildRestaurants() {\n        lodging.setRestaurants(\"\
    5 star Buffet\");\n    }\n\n    @Override\n    public void buildRooms() {\n  \
    \      lodging.setRooms(\"Luxury Suites\");\n    }\n\n    @Override\n    public\
    \ void buildSwimmingPool() {\n        lodging.setSwimmingPool(\"Indoor Lagoon\"\
    );\n    }\n\n    @Override\n    public Lodging getLodging() {\n        return\
    \ this.lodging;\n    }\n}\n```\n\n`HotelLodgingBuilder` 蓝图构造脚本事件图：\n\n![计算机截图描述自动生成，置信度低](img/Image00184.jpg)\
    \ \n\n`Set lodging` 折叠图节点：\n\n![图形用户界面描述自动生成](img/Image00185.jpg) \n\n`Add Child\
    \ Actor Component` 是由于无法使用 `Spawn Actor of Class` 节点的折中方案。我们可以在代码中看到 `HotelLodgingBuilder`\
    \ 构造函数实例化了一个新的 `Lodging` 对象：\n\n```java\npublic HotelLodgingBuilder() {\n    this.lodging\
    \ = new Lodging();\n}\n```\n\n当我们学习状态模式时，将看到一种在构造脚本限制附近初始化对象的更具动态的方法。\n\n`HotelLodgingBuilder`\
    \ 事件图：\n\n![图形用户界面，应用程序描述自动生成](img/Image00016.jpg) \n\n`isLodgingImplementInterface`\
    \ 函数是一个自定义的接口检查函数，类似于黄色色调的折叠图。\n\n`isLodgingImplementInterface` 函数：\n\n![图形用户界面，应用程序描述自动生成](img/Image00017.jpg)\
    \ \n\n`MotelLodgingBuilder` 与 `HotelLodgingBuilder` 非常相似。区别在于泳池、大厅区域、房间和餐厅的属性。\n\
    \n```java\nclass MotelLodgingBuilder : LodgingBuilder {\n    private Lodging lodging;\n\
    \    public MotelLodgingBuilder() {\n        this.lodging = new Lodging();\n \
    \   }\n\n    public void buildSwimmingPool() {\n        lodging.setSwimmingPool(\"\
    Green Slim\");\n    }\n\n    public void buildLobbyArea() {\n        lodging.setLobbyArea(\"\
    Economical\");\n    }\n\n    public void buildRestaurants() {\n        lodging.setRestaurants(\"\
    Vending Machines\");\n    }\n\n    public void buildRooms() {\n        lodging.setRooms(\"\
    Bates Style\");\n    }\n\n    public Lodging getLodging() {\n        return this.lodging;\n\
    \    }\n}\n```\n\n`MotelLodgingBuilder` 的蓝图截图为了简洁起见已省略。它基本上模仿了 `HotelLodgingBuilder`\
    \ 的内容。\n\n现在，我们需要一个建筑工程师来协调住宿的逐步构建。\n\n```java\nclass ArchitecturalEngineer{\n\
    \    private LodgingBuilder lodgingBuilder;\n    public ArchitecturalEngineer(LodgingBuilder\
    \ lodgingBuilder) {\n        this.lodgingBuilder = lodgingBuilder;\n    }\n\n\
    \    public Lodging getLodging() {\n        return this.lodgingBuilder.getLodging();\n\
    \    }\n\n    public void constructLodging() {\n        this.lodgingBuilder.buildSwimmingPool();\n\
    \        this.lodgingBuilder.buildLobbyArea();\n        this.lodgingBuilder.buildRooms();\n\
    \        this.lodgingBuilder.buildRestaurants();\n    }\n}\n```\n\n`ArchitecturalEngineer`\
    \ 构造脚本：\n\n![计算机截图描述自动生成，置信度低](img/Image00186.jpg) \n\n`Check lodgingBuilder isValid`\
    \ 节点：\n\n![包含文字的电子产品图片自动生成](img/Image00019.jpg) \n\n此有效性检查作为一种安全机制执行。我们希望在开始对该对象执行操作之前，确保该对象不为空。如果对象确实为空，视口中将打印“Not\
    \ Valid”字符串。\n\n`ArchitecturalEngineer` 包含了几个重要的函数，即 `getLodging` 和 `constructLodging`。\n\
    \n`getLodging` 函数图：\n\n![计算机截图描述自动生成，置信度低](img/Image00187.jpg) \n\n`constructLodging`\
    \ 函数图：\n\n![图形用户界面描述自动生成](img/Image00188.jpg) \n\n折叠图代表了 `constructLodging` 函数的体：\n\
    \n```java\npublic void constructLodging() {\n    this.lodgingBuilder.buildSwimmingPool();\n\
    \    this.lodgingBuilder.buildLobbyArea();\n    this.lodgingBuilder.buildRooms();\n\
    \    this.lodgingBuilder.buildRestaurants();\n}\n```\n\n`buildSwimmingPool, buildLobbyArea,\
    \ buildRooms,* 和 `buildRestaurants` 图分别是：\n\n![图形用户界面，应用程序描述自动生成](img/Image00189.jpg)\
    \ ![图形用户界面，图描述自动生成](img/Image00190.jpg) ![包含文字的电子产品图片自动生成](img/Image00191.jpg)\
    \ ![包含文字的电子产品图片自动生成](img/Image00192.jpg) \n\n这是酒店建造的最终截图。\n\n![文本、聊天或短信描述自动生成](img/Image00026.jpg)\
    \ \n\n"
- fmt: "\n```csharp\nusing System;\nnamespace Singleton\n{\n    class Singleton_Main\n\
    \    {\n        static void Main(string[] args)\n        {\n            Inventory\
    \ myInventory = Inventory.getInstance();\n            Console.WriteLine(myInventory);\n\
    \        }\n    }\n}\n```\n\n### `Singleton_Main` blueprint event graph:\n\n![Graphical\
    \ user interface Description automatically generated](Image00055.jpg)\n\nThe for\
    \ loop is present to demonstrate attempts to try to create more than one instance\
    \ of our designated Singleton object. We should never be allowed to create multiple\
    \ instances of our inventory If everything is set up correctly.\n\n### The `Create_Inventory_Instance`\
    \ collapsed graph:\n\n![A screenshot of a video game Description automatically\
    \ generated](Image00056.jpg)\n\n### The `Instance_Created_Message` collapsed graph:\n\
    \n![Graphical user interface, application Description automatically generated](Image00057.jpg)\n\
    \n### The `Inventory` class:\n\n```csharp\npublic class Inventory {\n    private\
    \ static readonly Inventory Instance = new Inventory();\n    private Inventory\
    \ () {}\n    public static Inventory getInstance() {\n        return Instance;\n\
    \    }\n}\n```\n\n### The `Inventory` blueprint construction script:\n\n![Graphical\
    \ user interface, application Description automatically generated](Image00058.jpg)\n\
    \nThe concept of a private construction does not exist in Unreal. Therefore, we\
    \ must create another way of keeping new Singleton objects from being created.\
    \ We do this by checking if an inventory instance already exists. If an inventory\
    \ instance does in fact already exists, the attempted new Singleton object is\
    \ destroyed.\n\n### The `isInstance_already_exist` collapsed graph:\n\n![A screenshot\
    \ of a video game Description automatically generated](Image00059.jpg)\n\n###\
    \ The `kill_yourself` collapsed graph:\n\n![Graphical user interface, application\
    \ Description automatically generated](Image00060.jpg)\n\n### The Singleton pattern\
    \ viewport screen print:\n\n![Text Description automatically generated](Image00061.jpg)\n\
    \n---\n\n> Adapt and Overcome… Adapter Pattern (C#)\n\n### Adapter Pattern UML\
    \ Diagram\n\n![Diagram Description automatically generated](Image00216.jpg)\n\n\
    ### Adapter Pattern Implementation\n\nIn our Adapter pattern implementation, we\
    \ have a shooter who uses a sling shot. We want to be able to allow our shooter\
    \ to fire a gun. However, we want to use the existing code we have already implemented\
    \ by using the Adapter pattern.\n\n### The main adapter class:\n\n```csharp\n\
    using System;\nnamespace Adapter\n{\n    class Adapter_Main\n    {\n        static\
    \ void Main(string[] args)\n        {\n            Shooter shooter = new Shooter(new\
    \ GunAdapter());\n            shooter.sling();\n        }\n    }\n}\n```\n\n###\
    \ The `Adapter_Main` blueprint:\n\n![Graphical user interface, application Description\
    \ automatically generated](Image00062.jpg)\n\n### The `Create_Gun_Adapter` collapsed\
    \ graph:\n\n![Graphical user interface, application Description automatically\
    \ generated](Image00063.jpg)\n\n### The `Create_Shooter` collapsed graph:\n\n\
    ![A screenshot of a computer Description automatically generated with low confidence](Image00064.jpg)\n\
    \n### The `SlingShot` interface:\n\n```csharp\npublic interface SlingShot {\n\
    \    void sling();\n}\n```\n\n### The `GunAdapter` class:\n\n```csharp\npublic\
    \ class GunAdapter : SlingShot {\n    private Gun weapon;\n    public GunAdapter()\
    \ {\n        weapon = new Gun();\n    }\n    public void sling() {\n        weapon.fire();\n\
    \    }\n}\n```\n\n### The `GunAdapter` blueprint:\n\n![Graphical user interface,\
    \ application Description automatically generated](Image00217.jpg)\n\n### The\
    \ `Gun` class:\n\n```csharp\nusing System;\npublic class Gun {\n    public void\
    \ fire() {\n        Console.WriteLine(\"Our gun is firing\");\n    }\n}\n```\n\
    \n### The `Gun` blueprint:\n\n![A picture containing text, sign Description automatically\
    \ generated](Image00218.jpg)\n\n### The `Shooter` class:\n\n```csharp\npublic\
    \ class Shooter : SlingShot {\n    private SlingShot slingShot;\n    public Shooter(SlingShot\
    \ slingShot) {\n        this.slingShot = slingShot;\n    }\n    public void sling()\
    \ {\n        slingShot.sling();\n    }\n}\n```\n\nWe can see that the `Shooter`\
    \ class has no functionality to fire a gun. However, it does functionality to\
    \ sling a slingshot. Both of these skills are predicated on emitting a projectile\
    \ from a weapon. We would like to reuse the slingshot functionality and adapt\
    \ it for the use of a gun.\n\n### The `Shooter` construction script:\n\n![Graphical\
    \ user interface, application Description automatically generated](Image00219.jpg)\n\
