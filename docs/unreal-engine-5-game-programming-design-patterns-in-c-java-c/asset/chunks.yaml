    \n# 编程精英主义者的克星……单例模式（Singleton Pattern）\n\n单例模式经常被单独挑出来作为最常用的设计模式之一，如果不是最糟糕的一个的话。单例就像信用卡，每个人都在使用它们，但如果你不负责任地使用，就会陷入真正的困境。编程纯洁者们憎恶单例模式。事实上，我从未见过任何现代出版的文献在讨论单例模式时不提醒读者避免使用它，这很讽刺。四人小组将单例描述为只有一个实例的类，并提供了一个全局访问点（Gamma\
    \ et.al, 1995）。\n\n## 优点\n\n- ● 封装唯一实例\n- ● 全局（便于访问）\n\n## 不如人意的之处\n\n- ● 全局（便于修改）\n\
    - ● 可能产生未知的依赖关系\n\n## 单例模式实现\n\n在 Unreal 中没有明确的方法来创建自定义的单例蓝图。然而，Game Instance（游戏实例）似乎是单例的一种官方解决方案。库存系统是演示单例设计模式的一个绝佳例子。我们希望任何时候都只有一个库存实例。此外，我们希望能够在整个游戏中轻松访问该库存系统。\n\
    \n主单例类 `Singleton_Main`：\n\n`Singleton_Main.h`\n\n```cpp\n#pragma once\n#include\
    \ \"CoreMinimal.h\"\n#include \"GameFramework/Actor.h\"\n#include \"Singleton_Main.generated.h\"\
    \n\nUCLASS()\nclass DESIGN_PATTERNS_API ASingleton_Main : public AActor\n{\n \
    \   GENERATED_BODY()\npublic:\n    // 设置此 属性的默认值\n    ASingleton_Main();\nprivate:\n\
    \    // 此 Actor 的库存\n    UPROPERTY()\n    class AInventory* Inventory;\nprotected:\n\
    \    // 当游戏开始或被生成时调用\n    virtual void BeginPlay() override;\npublic:\n    //\
    \ 每帧被调用\n    virtual void Tick(float DeltaTime) override;\n};\n```\n\n`Singleton_Main.cpp`\n\
    \n```cpp\n#include \"Singleton_Main.h\"\n#include \"Inventory.h\"\n\n// 设置默认值\n\
    ASingleton_Main::ASingleton_Main()\n{\n    // 设置此 Actor 每帧调用 Tick()。如果你不需要可以将其关闭。\n\
    \    PrimaryActorTick.bEverTick = true;\n}\n\n// 当游戏开始或被生成时调用\nvoid ASingleton_Main::BeginPlay()\n\
    {\n    Super::BeginPlay();\n    // 创建 4 个库存\n    for (int i = 0; i <= 4; i++)\n\
    \    {\n        AInventory* SpawnedInventory = GetWorld()->SpawnActor<AInventory>(AInventory::StaticClass());\n\
    \        if (SpawnedInventory)\n        {\n            // 如果生成成功，将生成的库存赋值给本地并记录成功字符串\n\
    \            Inventory = SpawnedInventory;\n            GEngine->AddOnScreenDebugMessage(-1,\
    \ 15.f, FColor::Yellow, FString::Printf(TEXT(\"%s has been created\"), Inventory->GetName()));\n\
    \        }\n    }\n}\n\n// 每帧被调用\nvoid ASingleton_Main::Tick(float DeltaTime)\n\
    {\n    Super::Tick(DeltaTime);\n}\n```\n\n`Singleton_Main` 蓝图事件图：\n\n![](img/Image00055.jpg)\n\
    \n存在 for 循环是为了演示尝试为我们指定的单例对象创建多个实例。如果设置正确，我们不应该允许创建多个库存实例。\n\n`Create_Inventory_Instance`\
    \ 折叠图：\n\n![](img/Image00056.jpg)\n\n`Instance_Created_Message` 折叠图：\n\n![](img/Image00057.jpg)\n\
    \n`Inventory` 类：\n\n`Inventory.h`\n\n```cpp\n#pragma once\n#include \"CoreMinimal.h\"\
    \n#include \"GameFramework/Actor.h\"\n#include \"Inventory.generated.h\"\n\nUCLASS()\n\
    class DESIGN_PATTERNS_API AInventory\n{\n    GENERATED_BODY()\npublic:\n    //\
    \ 设置此 属性的默认值\n    AInventory();\n    // 此类的实例\n    UPROPERTY()\n    class AInventory*\
    \ Instance;\nprotected:\n    // 当游戏开始或被生成时调用\n    virtual void BeginPlay() override;\n\
    public:\n    // 每帧被调用\n    virtual void Tick(float DeltaTime) override;\n};\n\
    ```\n\n`Inventory.cpp`\n\n"
- fmt: "\n```cpp\n#include \"Inventory.h\"\n#include \"Kismet/GameplayStatics.h\"\n\
    \n// Sets default values\nAInventory::AInventory()\n{\n    // Set this actor to\
    \ call Tick() every frame. You can turn this off to improve performance if you\
    \ don't need it.\n    PrimaryActorTick.bCanEverTick = true;\n    //Search for\
    \ existing Instances of this class\n    TArray<AActor*> Instances;\n    UGameplayStatics::GetAllActorsOfClass(GetWorld(),\
    \ AInventory::StaticClass(), Instances);\n    if (Instances.Num() > 1)\n    {\n\
    \        // If exist at least one of them, set the instance with the first found\
    \ one\n        Instance = Cast<AInventory>(Instances[0]);\n        GEngine->AddOnScreenDebugMessage(-1,\
    \ 15.f, FColor::Yellow, FString::Printf(TEXT(\"%s already exists\"), Instance->GetName()));\n\
    \        // Then Destroy this Actor\n        Destroy();\n    }\n}\n\n// Called\
    \ when the game starts or when spawned\nvoid AInventory::BeginPlay()\n{\n    Super::BeginPlay();\n\
    }\n\n// Called every frame\nvoid AInventory::Tick(float DeltaTime)\n{\n    Super::Tick(DeltaTime);\n\
    }\n```\n\nThe `Inventory` blueprint construction script:\n\n![](Image00058.jpg)\n\
    \nThe concept of a private construction does not exist in Unreal. Therefore, we\
    \ must create another way of keeping new Singleton objects from being created.\
    \ We do this by checking if an inventory instance already exists. If an inventory\
    \ instance does in fact already exists, the attempted new Singleton object is\
    \ destroyed.\n\nThe `isInstance_already_exist` collapsed graph:\n\n![](Image00059.jpg)\n\
    \nThe `kill_yourself` collapsed graph:\n\n![](Image00060.jpg)\n\nThe Singleton\
    \ pattern viewport screen print:\n\n![](Image00061.jpg)\n\n### Structural Patterns\n\
    \nThe structural patterns we discuss help us to compose larger structures from\
    \ classes and objects. One the most important goals of this pattern category is\
    \ to be able to alter object composition at runtime.\n\n### Adapt and Overcome…\
    \ Adapter Pattern\n\nA large amount of modern technology uses the idea of the\
    \ wrapper. One can think of high-level programming languages as wrappers around\
    \ lower-level programming languages. But how do these wrapped languages and their\
    \ client languages communicate? We need some sort of adapter. GoF tells us the\
    \ Adapter pattern facilitates the ability for classes to work together that couldn’t\
    \ otherwise because of incompatible interfaces (Gamma et.al, 1995).\n\n**The Good**\n\
    \n> ● Reuse complex code that is otherwise not compatible with a new code base\n\
    > ● Fairly easy to implement\n\n**The Not So Good**\n\n> ● Can be overuse just\
    \ to get a square peg into a round hole\n> ● Difficulty in recognizing necessity\
    \ for new implementation or using adapter\n\n#### Adapter Pattern Implementation\n\
    \nIn our Adapter pattern implementation, we have a shooter who uses a sling shot.\
    \ We want to be able to allow our shooter to fire a gun. However, we want to use\
    \ the existing code we have already implemented by using the Adapter pattern.\n\
    \nThe main adapter class:\n\n`Adapter_Main.h`\n\n```cpp\n#include \"CoreMinimal.h\"\
    \n#include \"GameFramework/Actor.h\"\n#include \"Adapter_Main.generated.h\"\n\n\
    UCLASS()\nclass DESIGN_PATTERNS_API AAdapter_Main : public AActor\n{\n    GENERATED_BODY()\n\
    public:\n    // Sets default values for this actor's properties\n    AAdapter_Main();\n\
    private:\n    // The Shooter Actor that holds the Gun Adapter\n    UPROPERTY()\
    \ class AShooter* Shooter;\nprotected:\n    // Called when the game starts or\
    \ when spawned\n    virtual void BeginPlay() override;\npublic:\n    // Called\
    \ every frame\n    virtual void Tick(float DeltaTime) override;\n};\n```\n\n`Adapter_Main.cpp`\n\
    \n```cpp\n#include \"Adapter_Main.h\"\n#include \"GunAdapter.h\"\n#include \"\
    Shooter.h\"\n\n// Sets default values\nAAdapter_Main::AAdapter_Main()\n{\n   \
    \ // Set this actor to call Tick() every frame. You can turn this off to improve\
    \ performance if you don't need it.\n    PrimaryActorTick.bCanEverTick = true;\n\
    }\n\n// Called when the game starts or when spawned\nvoid AAdapter_Main::BeginPlay()\n\
    {\n    Super::BeginPlay();\n    //Spawn the Gun Adapter\n    AGunAdapter* GunAdapter\
    \ = GetWorld()->SpawnActor<AGunAdapter>(AGunAdapter::StaticClass());\n    //Spawn\
    \ the Shooter and set the Gun Adapter\n    Shooter = GetWorld()->SpawnActor<AShooter>(AShooter::StaticClass());\n\
    \    Shooter->SetSlingShot(GunAdapter);\n    //Shoot\n    Shooter->Sling();\n\
    }\n\n// Called every frame\nvoid AAdapter_Main::Tick(float DeltaTime)\n{\n   \
    \ Super::Tick(DeltaTime);\n}\n```\n\nThe `Adapter_Main` blueprint:\n\n![](Image00062.jpg)\n\
    \nThe `Create_Gun_Adapter` collapsed graph:\n\n![](Image00063.jpg)\n\nThe `Create_Shooter`\
    \ collapsed graph:\n\n![](Image00064.jpg)\n\nThe `SlingShot` interface:\n\n`SlingShot.h`\n\
    \n```cpp\n#pragma once\n#include \"CoreMinimal.h\"\n#include \"U/Interface.h\"\
    \n#include \"SlingShot.generated.h\"\n\n// This class does not need to be modified.\n\
    INTERFACE(MinimalAPI)\nclass USlingShot : public UInterface\n{\n    GENERATED_BODY()\n\
    };\n\nclass DESIGN_PATTERNS_API ISlingShot\n{\n    GENERATED_BODY()\n    // The\
    \ pure virtual function of SlingShot\n    virtual void Sling() = 0;\n};\n```\n\
    \n`SlingShot.cpp`\n\n```cpp\n#include \"SlingShot.h\"\n// Add default functionality\
    \ for any ISlingShot functions that are not virtual\n```\n\nThe `GunAdapter` class:\n\
    \n`GunAdapter.h`\n\n```cpp\n#pragma once\n#include \"CoreMinimal.h\"\n#include\
    \ \"GameFramework/Actor.h\"\n#include \"SlingShot.h\"\n#include \"GunAdapter.generated.h\"\
    \n\nclass AGun;\n\nUCLASS()\nclass DESIGN_PATTERNS_API GunAdapter : public AActor,\
    \ public ISlingShot\n{\n    GENERATED_BODY()\npublic:\n    // Sets default values\
    \ for this actor's properties\n    GunAdapter();\nprivate:\n    // The Weapon\n\
    \    UPROPERTY()\n    AGun* Weapon;\nprotected:\n    // Called when the game starts\
    \ or when spawned\n    virtual void BeginPlay() override;\npublic:\n    // Called\
    \ every frame\n    virtual void Tick(float DeltaTime) override;\n    // Implement\
    \ the interface\n    virtual void Sling() override;\n};\n```\n\n`GunAdapter.cpp`\n\
    \n```cpp\n#include \"GunAdapter.h\"\n#include \"Gun.h\"\n\n// Sets default values\n\
    GunAdapter::GunAdapter()\n{\n    // Set this actor to call Tick() every frame.\
    \ You can turn this off to improve performance if you don't need it.\n    PrimaryActorTick.bCanEverTick\
    \ = true;\n}\n\n// Called when the game starts or when spawned\nvoid GunAdapter::BeginPlay()\n\
    {\n    Super::BeginPlay();\n    //Spawn the Weapon\n    Weapon = GetWorld()->SpawnActor<AGun>(AGun::StaticClass());\n\
    }\n\n// Called every frame\nvoid GunAdapter::Tick(float DeltaTime)\n{\n    Super::Tick(DeltaTime);\n\
    }\n\nvoid GunAdapter::Sling()\n{\n    if (!Weapon)\n    {\n        UE_LOG(LogTemp,\
    \ Error, TEXT(\"Sling(): Weapon is NULL, make sure it's initialized.\"));\n  \
    \      return;\n    }\n    //Call the Fire function\n    Weapon->Fire();\n}\n\
    ```\n\nThe `GunAdapter` blueprint:\n\n![](Image00065.jpg)\n\nThe `Gun` class:\n\
    \n`Gun.h`\n\n```cpp\n#pragma once\n#include \"CoreMinimal.h\"\n#include \"GameFramework/Actor.h\"\
    \n#include \"Gun.generated.h\"\n\nUCLASS()\nclass DESIGN_PATTERNS_API AGun : public\
    \ AActor\n{\n    GENERATED_BODY()\npublic:\n    // Sets default values\n    AGun();\n\
    protected:\n    // Called when the game starts or when spawned\n    virtual void\
    \ BeginPlay() override;\npublic:\n    // Called every frame\n    virtual void\
    \ Tick(float DeltaTime) override;\n    //Fire with the gun\n    virtual void Fire();\n\
    };\n```\n\n`Gun.cpp`\n"
