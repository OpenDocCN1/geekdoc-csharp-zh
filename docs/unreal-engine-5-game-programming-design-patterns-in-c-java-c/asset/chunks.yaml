    > Introduction


    Hi, and welcome to ***Unreal Engine 5 Game Programming Design Patterns in C++,
    Java, C#, and Blueprints*** . I wrote this book because I struggled with learning
    Unreal Engine’s “Blueprints” visual scripting system. I felt like everything I
    did in Blueprints was sort of a hack. You see, I knew how to program in many traditional
    programming languages and possessed a master’s in software engineering from an
    ABET accredited institution. In fact, my skill level was intermediate to advanced
    Java, C++, C#, and JavaScript. However, these languages are very mature and one
    can just Google to find the solution to almost any question. This is FAR from
    the case when it comes to visual scripting!


    Visual scripting is not novel. Unreal Engine is not the first tool to implement
    this kind of programming, nor will it be the last... I see you Unity! There will
    be a proliferation in learning resources regarding visual scripting as Unreal
    and Unity become more popular. This book seeks to be the first one discussing
    design patterns. We will be using Unreal Engine Editor version 5.0 and we will
    use 4.2x.x for the Java and C# examples. The 4.2x.x blueprints work in UE5 identically.


    > How to Read this Book


    Blueprint files should be obtained first for maximal understanding from [sonicworkflow.com](https://sonicworkflow.com/)
    . It is advisable to start with the Builder Pattern section. This section goes
    into details other sections will avoid for the sake of redundancy reduction. Therefore,
    if the reader skips this section they may be lost if they are not hardened blueprint
    and design pattern experts. One should find the remaining sections much clearer
    once the Builder Pattern section is read and understood.


    **Errors**


    Submit to support@sonicworkflow.com


    > What is in this Book?


    This book is a crosswalk from traditional code to visual scripting. This book
    is about reconstructing traditional and widely used design patterns in a visual
    scripting environment. The visual scripting environment is Unreal Engine’s “Blueprints.”
    We will discuss and implement design patterns to solve some of the most common
    problems in programming. You will not need to read much of the background material
    on the design patterns if you are an experienced coder. Chances are, you probably
    have used many of these patterns previously. Do not fret If you are not a coder.
    If you are familiar with Blueprints, then you can, and should implement design
    patterns into your workflow when necessary.


    C++, Java, and C# “equivalent” code is provided for each design pattern discussed.
    Additionally, there is an accompanying UML diagram for each design pattern of
    the Java code implementation. We follow the code in blueprints as close as possible.
    Some of you may be thinking, “Hey Umar, why would you use Java and C# when Unreal’s
    main coding language is C++.” I have nothing against C++. I chose to add Java
    and C# for a few reasons.


    1.  > Java and C# are easier to read. Especially if you are coming from Unity.
    Unity uses C#. It possesses keywords that immediately communicate Interfaces,
    and abstract classes. There is no need to explicitly compose pure virtual functions
    in Java or C#.


    2.  > If one knows C++, then Java and C# are a breeze. If one knows Java and C#,
    C++ is still difficult to master.


    3.  > I think one would agree that Blueprints are closer in spirit to Java and
    C# than to C++.


    > What is Not in this Book?


    This book is not about how to start using blueprints from scratch. This is not
    a zero to hero blueprints quest. You will struggle if you do not have a decent
    familiarity with blueprints. Plainly, **this is not a beginner’s book** . Comparatively,
    one would not attempt to “learn” C++ from the “Gang of Four’s” design patterns
    book. Since I brought it up, *Design Patterns, Elements of Reusable Object-Oriented
    Software* is the granddaddy of design patterns references. It is basically the
    authority on the topic of design patterns. You would be hard pressed to find a
    reputable source on the topic not borrowing ideas from that book. The “Gang of
    Four”, aka GoF, refer to the book’s four authors.


    This book is not a treatise on design patterns. The Gang of Four’s book is a must
    read for further depth and understanding of the topic.'
