  trans: "\n\n```cpp\n#pragma once\n#include \"CoreMinimal.h\"\n#include \"GameFramework/Actor.h\"\
    \n#include \"FloorPlan.h\"\n#include \"Lodging.generated.h\"\n\nUCLASS()\nclass\
    \ DESIGN_PATTERNS_API ALodging : public AActor, public IFloorPlan\n{\n    GENERATED_BODY()\n\
    \npublic:\n    // 设置此 actor 属性的默认值\n    ALodging();\n\nprivate:\n    // 游泳池名称\n\
    \    FString SwimmingPool;\n    // 大堂区域名称\n    FString LobbyArea;\n    // 房间名称\n\
    \    FString Rooms;\n    // 餐厅名称\n    FString Restaurants;\n\nprotected:\n   \
    \ // 当游戏开始或生成时被调用\n    virtual void BeginPlay() override;\n\npublic:\n    // 每帧调用\n\
    \    virtual void Tick(float DeltaTime) override;\n    // 设置游泳池名称\n    void SetSwimmingPool(FString\
    \ mySwimmingPool);\n    // 设置大堂区域名称\n    void SetLobbyArea(FString myLobbyArea);\n\
    \    // 设置房间名称\n    void SetRooms(FString myRooms);\n    // 设置餐厅名称\n    void SetRestaurants(FString\
    \ myRestaurants);\n    // 记录所有住宿层\n    void LodgingCharacteristics();\n};\n```\n\
    \n`Lodging.cpp`\n```cpp\n#include \"Lodging.h\"\n\n// 设置默认值\nALodging::ALodging()\n\
    {\n    // 设置此 actor 每帧调用 Tick()。如果不需要它，可以关闭它以提高性能。\n    PrimaryActorTick.bCanEverTick\
    \ = true;\n}\n\n// 当游戏开始或生成时被调用\nvoid ALodging::BeginPlay()\n{\n    Super::BeginPlay();\n\
    }\n\n// 每帧调用\nvoid ALodging::Tick(float DeltaTime)\n{\n    Super::Tick(DeltaTime);\n\
    }\n\nvoid ALodging::SetSwimmingPool(FString mySwimmingPool)\n{\n    // 使用传入的字符串设置游泳池名称\n\
    \    SwimmingPool = mySwimmingPool;\n}\n\nvoid ALodging::SetLobbyArea(FString\
    \ myLobbyArea)\n{\n    // 使用传入的字符串设置大堂区域名称\n    LobbyArea = myLobbyArea;\n}\n\n\
    void ALodging::SetRooms(FString myRooms)\n{\n    // 使用传入的字符串设置房间名称\n    Rooms\
    \ = myRooms;\n}\n\nvoid ALodging::SetRestaurants(FString myRestaurants)\n{\n \
    \   // 使用传入的字符串设置餐厅名称\n    Restaurants = myRestaurants;\n}\n\nvoid ALodging::LodgingCharacteristics()\n\
    {\n    // 记录每一层的名称\n    GEngine->AddOnScreenDebugMessage(-1, 15.f, FColor::Yellow,\
    \ FString::Printf(TEXT(\"%s\"), SwimmingPool));\n    GEngine->AddOnScreenDebugMessage(-1,\
    \ 15.f, FColor::Yellow, FString::Printf(TEXT(\"%s\"), LobbyArea));\n    GEngine->AddOnScreenDebugMessage(-1,\
    \ 15.f, FColor::Yellow, FString::Printf(TEXT(\"%s\"), Rooms));\n    GEngine->AddOnScreenDebugMessage(-1,\
    \ 15.f, FColor::Yellow, FString::Printf(TEXT(\"%s\"), Restaurants));\n}\n```\n\
    \n记得主蓝图中的 `LodgingCharacteristics` 节点吗？它在这里：\n\n![自动生成的图形界面描述](img/Image00013.jpg)\n\
    \nLodging 蓝图还包含了稍后由建筑工程师调用的事件：\n\n![自动生成的图形界面、应用程序描述](img/Image00014.jpg)\n\n\
    蓝图在调用 void 接口函数时使用 `Event` 节点。`Lodging` 类的蓝图版本除了设置局部变量外，还会打印传递给函数的字符串值。此外，我们必须通过在类设置的\
    \ Interfaces 区域中添加它，来确保此蓝图类实现了 `FloorPlan` 接口。\n\n该类是 `HotelLodgingBuilder`。它实现了住宿构建器接口，并为种类型的住宿提供了自定义规格。\n\
    \n***HotelLodgingBuilder.h***\n```cpp\n#pragma once\n#include \"CoreMinimal.h\"\
    \n#include \"GameFramework/Actor.h\"\n#include \"LodgingBuilder.h\"\n#include\
    \ \"HotelLodgingBuilder.generated.h\"\n\nUCLASS()\nclass DESIGN_PATTERNS_API AHotelLodgingBuilder\
    \ : public AActor, public ILodgingBuilder\n{\n    GENERATED_BODY()\n\npublic:\n\
    \    // 设置此 actor 属性的默认值\n    AHotelLodgingBuilder();\n\nprivate:\n    // 住宿 Actor\n\
    \    UPROPERTY(VisibleAnywhere, Category=\"Hotel Lodging\")\n    class ALodging\
    \ Lodging;\n\nprotected:\n    // 当游戏开始或生成时被调用\n    virtual void BeginPlay() override;\n\
    \npublic:\n    // 每帧调用\n    virtual void Tick(float DeltaTime) override;\n   \
    \ // 创建游泳池\n    virtual void BuildSwimmingPool() override;\n    // 创建大堂区域\n  \
    \  virtual void BuildLobbyArea() override;\n    // 创建餐厅\n    virtual void BuildRestaurants()\
    \ override;\n    // 创建房间\n    virtual void BuildRooms() override;\n    // 返回住宿\n\
    \    virtual ALodging GetLodging() override;\n};\n```\n\n`HotelLodgingBuilder.cpp`\n\
    ```cpp\n#include \"HotelLodgingBuilder.h\"\n#include \"Lodging.h\"\n\n// 设置默认值\n\
    AHotelLodgingBuilder::AHotelLodgingBuilder()\n{\n}\n\n// 当游戏开始或生成时被调用\nvoid AHotelLodgingBuilder::BeginPlay()\n\
    {\n    Super::BeginPlay();\n    // 生成住宿\n    Lodging = GetWorld()->SpawnActor<ALodging>(ALodging::StaticClass());\n\
    \    // 将其附加到构建器（自己）\n    Lodging->AttachToActor(this, FAttachmentTransformRules::KeepRelative);\n\
    }\n\n// 每帧调用\nvoid AHotelLodgingBuilder::Tick(float DeltaTime)\n{\n    Super::Tick(DeltaTime);\n\
    }\n\nvoid AHotelLodgingBuilder::BuildSwimmingPool()\n{\n    if (!Lodging)\n  \
    \  {\n        UE_LOG(LogTemp, Error, TEXT(\"BuildSwimmingPool(): Lodging 为空，确保它已初始化。\n\
    \        return;\n    }\n    // 设置住宿的游泳池\n    Lodging->SetSwimmingPool(\"Indoor\
    \ Lagoon\");\n}\n\nvoid AHotelLodgingBuilder::BuildLobbyArea()\n{\n    if (!Lodging)\n\
    \    {\n        UE_LOG(LogTemp, Error, TEXT(\"BuildLobbyArea(): Lodging 为空，确保它已初始化。\n\
    \        return;\n    }\n    // 设置住宿的大堂区域\n    Lodging->SetLobbyArea(\"Grand Hall\"\
    );\n}\n\nvoid AHotelLodgingBuilder::BuildRestaurants()\n{\n    if (!Lodging)\n\
    \    {\n        UE_LOG(LogTemp, Error, TEXT(\"BuildRestaurants(): Lodging 为空，确保它已初始化。\n\
    \        return;\n    }\n    // 设置住宿的餐厅\n    Lodging->SetRestaurants(\"5 star\
    \ Buffet\");\n}\n\nvoid AHotelLodgingBuilder::BuildRooms()\n{\n    if (!Lodging)\n\
    \    {\n        UE_LOG(LogTemp, Error, TEXT(\"BuildRooms(): Lodging 为空，确保它已初始化。\n\
    \        return;\n    }\n    // 设置住宿的房间\n    Lodging->SetRooms(\"Luxury Suites\"\
    );\n}\n\nALodging* AHotelLodgingBuilder::GetLodging()\n{\n    // 返回构建器的住宿 Actor（自己）\n\
    \    return Lodging;\n}\n```\n\n现在我们需要一个建筑工程师来协调住宿的逐步构建。\n\n***ArchitecturalEngineer.h***\n\
    \n"
- fmt: "` 标签内容。我根据你提供的逻辑，对 `ArchitecturalEngineer` 相关的代码和描述（以及其中的变量/函数/类名）进行了规范化排版。\n\
    \n以下是排版后的结果：\n\n[content]\n```cpp\n#include \"CoreMinimal.h\"\n#include \"GameFramework/Actor.h\"\
    \n#include \"LodgingBuilder.h\"\n#include \"ArchitecturalEngineer.generated.h\"\
    \n\nUCLASS()\nclass DESIGN_PATTERNS_API AArchitecturalEngineer : public AActor\n\
    {\n    GENERATED_BODY()\n\npublic:\n    // Sets default values for this actor's\
    \ properties\n    AArchitecturalEngineer();\n\nprivate:\n    // The Builder Actor,\
    \ that must be a LodgingBuilder\n    ILodgingBuilder* LodgingBuilder;\n\nprotected:\n\
    \    // Called when the game starts or when spawned\n    virtual void BeginPlay()\
    \ override;\n\npublic:\n    // Called every frame\n    virtual void Tick(float\
    \ DeltaTime) override;\n    // Creates the buildings\n    void ConstructLodging();\n\
    \    // Set the Builder Actor\n    void SetLodgingBuilder(AActor* Builder);\n\
    \    // Get the Lodging of the Builder class\n    ALodging* GetLodging();\n};\n\
    ```\n\n***ArchitecturalEngineer.cpp***\n\n```cpp\n#include \"ArchitecturalEngineer.h\"\
    \n#include \"Lodging.h\"\n\n// Sets default values\nAArchitecturalEngineer::AArchitecturalEngineer()\n\
    {\n    // Set this actor to call Tick() every frame. You can turn this off to\
    \ improve performance if you don't need it.\n    PrimaryActorTick.bCanEverTick\
    \ = true;\n}\n\n// Called when the game starts or when spawned\nvoid AArchitecturalEngineer::BeginPlay()\n\
    {\n    Super::BeginPlay();\n}\n\n// Called every frame\nvoid AArchitecturalEngineer::Tick(float\
    \ DeltaTime)\n{\n    Super::Tick(DeltaTime);\n}\n\nvoid AArchitecturalEngineer::SetLodgingBuilder(AActor*\
    \ Builder)\n{\n    // Cast the passed Actor and set the BuilderLodging\n    LodgingBuilder\
    \ = Cast<ILodgingBuilder>(Builder);\n    if (!LodgingBuilder) // Log Error if\
    \ cast fails\n    {\n        GEngine->AddOnScreenDebugMessage(-1, 15.f, FColor::Red,\
    \ TEXT(\"Invalid Cast! See Output log for more details\"));\n        UE_LOG(LogTemp,\
    \ Error, TEXT(\"SetLodgingBuilder(): The Actor is not a LodgingBuilder! Are you\
    \ sure that the Actor implements that interface?\"));\n    }\n}\n\nALodging* AArchitecturalEngineer::GetLodging()\n\
    {\n    if (LodgingBuilder)\n    {\n        // Returns the Lodging of the Builder\n\
    \        return LodgingBuilder->GetLodging();\n    }\n    // Log if the Builder\
    \ is NULL\n    UE_LOG(LogTemp, Error, TEXT(\"GetLodging(): Return nullptr\"));\n\
    \    return nullptr;\n}\n\nvoid AArchitecturalEngineer::ConstructLodging()\n{\n\
    \    // Log if the Builder is NULL\n    if (!LodgingBuilder)\n    {\n        UE_LOG(LogTemp,\
    \ Error, TEXT(\"ConstructLodging(): LodgingBuilder is NULL, make sure it's initialized.\"\
    ));\n        return;\n    }\n    // Creates the buildings\n    LodgingBuilder->BuildSwimmingPool();\n\
    \    LodgingBuilder->BuildLobbyArea();\n    LodgingBuilder->BuildRooms();\n  \
    \  LodgingBuilder->BuildRestaurants();\n}\n```\n\nThe *ArchitecturalEngineer*\
    \ construction script:\n\n![Graphical user interface Description automatically\
    \ generated](Image00018.jpg)\n\nThe *Check lodgingBuilder isValid* node:\n\n![](Image00019.jpg)\n\
    \nThis validity check is executed as a safety mechanism. We want to make sure\
    \ the object is not null before we start to perform operations on said object.\
    \ A “Not Valid” string prints to the viewport If the object is indeed null.\n\n\
    The *ArchitecturalEngineer* contains a few important functions, namely `GetLodging`\
    \ and `ConstructLodging`.\n\nThe `GetLodging` function graph:\n\n![Graphical user\
    \ interface, application Description automatically generated](Image00020.jpg)\n\
    \nThe `ConstructLodging` function graph:\n\n![Diagram Description automatically\
    \ generated](Image00021.jpg)\n\nThe collapsed graphs represent the body of the\
    \ `ConstructLodging` function:\n\n```cpp\nvoid AArchitecturalEngineer::ConstructLodging()\n\
    {\n    // Log if the Builder is NULL\n    if (!LodgingBuilder)\n    {\n      \
    \  UE_LOG(LogTemp, Error, TEXT(\"ConstructLodging(): LodgingBuilder is NULL, make\
    \ sure it's initialized.\"));\n        return;\n    }\n    // Creates the buildings\n\
    \    LodgingBuilder->BuildSwimmingPool();\n    LodgingBuilder->BuildLobbyArea();\n\
    \    LodgingBuilder->BuildRooms();\n    LodgingBuilder->BuildRestaurants();\n\
    }\n```\n\nThe `BuildSwimmingPool`, `BuildLobbyArea`, `BuildRooms`, and `BuildRestaurants`\
    \ graphs are respectively:\n\n![A picture containing text, indoor, electronics\
    \ Description automatically generated](Image00022.jpg) ![A picture containing\
