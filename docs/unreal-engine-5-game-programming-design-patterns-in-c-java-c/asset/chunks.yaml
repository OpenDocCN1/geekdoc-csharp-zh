  trans: "\n\n![A screenshot of a computer Description automatically generated with\
    \ medium confidence](img/Image00073.jpg)\n\n### `Enemy_Fight` 折叠后的图：\n\n![](img/Image00074.jpg)\n\
    \n### `Enemy_Die` 折叠后的图：\n\n![](img/Image00075.jpg)\n\n### `Enemy_GetDamage` 折叠后的图：\n\
    \n![](img/Image00076.jpg)\n\n### `Enemy_Damage_Message` 折叠后的图：\n\n![](img/Image00077.jpg)\n\
    \n### `Projectile_Enemy_Actions` 折叠后的图：\n\n![Graphical user interface Description\
    \ automatically generated](img/Image00078.jpg)\n\n### `Create_Projectile_Enemy`\
    \ 折叠后的图：\n\n![Graphical user interface, application Description automatically\
    \ generated](img/Image00079.jpg)\n\n近战敌人与远程敌人之间的显著区别在于构造。远程敌人的构造函数接受之前创建的敌人作为参数。这样做我们就可以重用它来装饰敌人对象。\n\
    \n### `Projectile_Enemy_Fight` 折叠后的图：\n\n![](img/Image00080.jpg)\n\n### `Projectile_Enemy_Die`\
    \ 折叠后的图：\n\n![](img/Image00081.jpg)\n\n### `Projectile_Enemy_GetDamage` 折叠后的图：\n\
    \n![](img/Image00082.jpg)\n\n### `Projectile_Enemy_Damage_Message` 折叠后的图：\n\n\
    ![](img/Image00083.jpg)\n\n### `Enemy` 接口：\n\n***Enemy.h***\n\n```cpp\n#pragma\
    \ once\n#include \"CoreMinimal.h\"\n#include \"UObject/Interface.h\"\n#include\
    \ \"Enemy.generated.h\"\n\n// 此类不需要修改。\nUINTERFACE((MinimalAPI))\nclass UEnemy\
    \ : public UInterface\n{\n    GENERATED_BODY()\n};\n\n/**\n* 组件定义了一个接口，用于可以动态向其添加\n\
    * 职责的对象\n*/\nclass DESIGN_PATTERNS_API IEnemy\n{\n    GENERATED_BODY()\n    //\
    \ 将接口函数添加到此类中。该类将通过继承来实现此接口。\npublic: \n    // Enemy 的纯虚函数\n    virtual void Fight()\
    \ = 0;\n    virtual int GetDamage() = 0;\n    virtual void Die() = 0;\n};\n```\n\
    \n***Enemy.cpp***\n\n```cpp\n#include \"Enemy.h\"\n// 为任何不是纯虚的 IEnemy 函数在此处添加默认功能。\n\
    ```\n\n`Enemy` 接口被所有敌人对象共享。`MeleeEnemy` 类：\n\n***MeleeEnemy.h***\n\n```cpp\n#pragma\
    \ once\n#include \"CoreMinimal.h\"\n#include \"Decorator.h\"\n#include \"MeleeEnemy.generated.h\"\
    \n\n/**\n* 具体的装饰器\n* 向组件添加职责（可以扩展组件\n* 的状态）\n*/\nUCLASS()\nclass DESIGN_PATTERNS_API\
    \ AMeleeEnemy : public ADecorator\n{\n    GENERATED_BODY()\npublic: \n    // 开始战斗\n\
    \    virtual void Fight() override;\n    // 返回此敌人受到的多少伤害\n    virtual int GetDamage()\
    \ override;\n    // 杀死此敌人\n    virtual void Die() override;\n};\n```\n\n***MeleeEnemy.cpp***\n\
    \n```cpp\n#include \"MeleeEnemy.h\"\nvoid AMeleeEnemy::Fight()\n{\n    // 调用父类\
    \ Fight 函数并记录消息\n    Super::Fight();\n    GEngine->AddOnScreenDebugMessage(-1,\
    \ 15.f, FColor::Yellow, TEXT(\"敌人投出重拳\"));\n}\n\nint AMeleeEnemy::GetDamage()\n\
    {\n    // 返回基础伤害 + 5\n    return Super::GetDamage() + 5;\n}\nvoid AMeleeEnemy::Die()\n\
    {\n    // 调用父类 Die 函数并记录消息\n    Super::Die();\n    GEngine->AddOnScreenDebugMessage(-1,\
    \ 15.f, FColor::Yellow, TEXT(\"敌人在痛苦中扭扎并消散\"));\n}\n```\n\n`MeleeEnemy` 蓝图事件图：\n\
    \n![Graphical user interface, application Description automatically generated](img/Image00084.jpg)\n\
    \n`MeleeEnemy` 蓝图中的 `GetDamage` 函数：\n\n![A screenshot of a computer Description\
    \ automatically generated with low confidence](img/Image00085.jpg)\n\n### `ProjectileEnemy`\
    \ 类：\n\n***ProjectileEnemy.h***\n\n```cpp\n#pragma once\n#include \"CoreMinimal.h\"\
    \n#include \"Decorator.h\"\n#include \"ProjectileEnemy.generated.h\"\n\nUCLASS()\n\
    class DESIGN_PATTERNS_API AProjectileEnemy : public ADecorator\n{\n    GENERATED_BODY()\n\
    public: \n    // 开始战斗\n    virtual void Fight() override;\n    // 返回此敌人受到的多少伤害\n\
    \    virtual int GetDamage() override;\n    // 杀死此敌人\n    virtual void Die() override;\n\
    };\n```\n\n***ProjectileEnemy.cpp***\n\n```cpp\n#include \"ProjectileEnemy.h\"\
    \nvoid AProjectileEnemy::Fight()\n{\n    // 调用父类 Fight 函数并记录消息\n    Super::Fight();\n\
    \    GEngine->AddOnScreenDebugMessage(-1, 15.f, FColor::Yellow, TEXT(\"敌人送了一个飞吻并开枪\"\
    ));\n}\n\nint AProjectileEnemy::GetDamage()\n{\n    // 返回基础伤害 + 5\n    return\
    \ Super::GetDamage() + 5;\n}\n\nvoid AProjectileEnemy::Die()\n{\n    // 调用父类 Die\
    \ 函数\n    Super::Die();\n    GEngine->AddOnScreenDebugMessage(-1, 15.f, FColor::Yellow,\
    \ TEXT(\"敌人送了一个飞吻并开枪\"));\n}\n```\n\n我们可以看到远程敌人比近战敌人造成更多的伤害。\n\n`ProjectileEnemy`\
    \ 蓝图事件图：\n\n![Graphical interface interface](img/Image00086.jpg)\n\n`ProjectileEnemy`\
    \ 蓝图中的 `GetDamage` 函数：\n\n![A screenshot of a computer Description automatically\
    \ generated](img/Image00087.jpg)\n\n装饰器模式视口：\n\n![](img/Image0088.jpg)\n\n###\
    \ 外观模式 (Facade Pattern)\n\nGoF 定义外观模式为为一组接口提供一个中心接口。当我们想要简化客户端与复杂系统之间的交互时，外观模式非常有用。\n\
    \n#### 优点\n- 简化了复杂系统的使用\n- 减少了客户端与子系统之间的耦合\n\n#### 缺点\n- 隐藏了子系统的特性\n\n#### 外观模式实现\n\
    \n太空旅行并不容易。太空旅行最重要的部分是星舰。然而，星舰也有自己的复杂性。这就是`StarFacade` 发挥作用的地方。\n\n外观主类：\n\n***StarFacade.h***\n\
    \n```cpp\n#pragma once\n#include \"CoreMinimal.h\"\n#include \"GameFramework/Actor.h\"\
    \n#include \"StarShip.h\"\n#include \"StarFacade_Main.generated.h\"\n\nUCLASS()\n\
    class DESIGN_PATTERNS_API AStarShipFacade_Main : AActor\n{\n    GENERATED_BODY()\n\
    public: \n    // 设置此 Actor 的默认值\n    AStarShipFacade_Main();\nprotected: \n  \
    \  // 游戏开始或生成时调用\n    virtual void BeginPlay() override;\npublic: \n    // 每帧调用\n\
    \    virtual void Tick(float DeltaTime) override;\n};\n```\n\n***StarFacade.cpp***\n\
    \n```cpp\n#include \"StarShipFacade_Main.h\"\n#include \"StarShipFacade.h\"\n\n\
    // 设置默认值\nAStarShipFacade_Main::AStarShipFacade_Main()\n{\n    // 设置此 Actor 每帧调用\
    \ Tick()。如果不需要，可以关闭它以提高性能。\n    PrimaryActorTick.bCanEverTick = true;\n}\n\n//\
    \ 游戏开始或生成时调用\nvoid AStarShipFacade_Main::BeginPlay()\n{\n    Super::BeginPlay();\n\
    \    // 创建星舰外观 Actor\n    AStarShipFacade* ShipFacade = GetWorld()->SpawnActor<AStarShipFacade>(AStarShipFacade::StaticClass());\n\
    \    // 执行所需的任务\n    ShipFacade->Reveille();\n    ShipFacade->PlanOfTheDay();\n\
    \    ShipFacade->Taps();\n}\n\n// 每帧调用\nvoid AStarShipFacade_Main::Tick(float\
    \ DeltaTime)\n{\n    Super::Tick(DeltaTime);\n}\n```\n\n"
- fmt: "\nFrom `Façade_Main` we can see how easy it is to run a starship. This is\
    \ merely a façade using the Façade pattern. The complexity lies ahead.\n\n###\
    \ The `Façade_Main` event graph:\n\n![Graphical user interface, application Description\
    \ automatically generated](Image00089.jpg)\n\n### The `StarShipFacade` class:\n\
    \n#### `StarShipFacade.h`\n```cpp\n#pragma once\n#include \"CoreMinimal.h\"\n\
    #include \"GameFramework/Actor.h\"\n#include \"StarShipCrewMember.h\"\n#include\
    \ \"StarShipFacade.generated.h\"\nUCLASS()\nclass DESIGN_PATTERNS_API AStarShipFacade\
    \ : public AActor\n{\n    GENERATED_BODY()\npublic:\n    // Sets default values\
    \ for this actor's properties\n    AStarShipFacade();\nprivate:\n    //The Crew\
    \ list\n    TArray<AStarShipCrewMember*> Crew;\n    //The Tasks to execute\n \
    \   UPROPERTY()\n    TArray<FString> Tasks;\nprotected:\n    // Called when the\
    \ game starts or when spawned\n    virtual void BeginPlay() override;\nprivate:\n\
    \    //Execute the tasks for a specific Crew\n    void PerformTasks(TArray<AStarShipCrewMember*>\
    \ myCrew, TArray<FString> myTasks);\npublic:\n    // Called every frame\n    virtual\
    \ void Tick(float DeltaTime) override;\n    //Execute the Reveille tasks\n   \
    \ void Reveille();\n    //Execute the PlanOfTheDay tasks\n    void PlanOfTheDay();\n\
    \    //Execute the Taps tasks\n    void Taps();\n};\n```\n\n#### `StarShipFacade.cpp`\n\
    ```cpp\n#include \"StarShipFacade.h\"\n#include \"StarShipNavigationOfficer.h\"\
    \n#include \"StarShipOperationsOfficer.h\"\n#include \"StarShipSupplyOfficer.h\"\
    \n// Sets default values\nAStarShipFacade::AStarShipFacade()\n{\n    // Set this\
    \ actor to call Tick() every frame. You can turn this off to improve performance\
    \ if you don't need it.\n    PrimaryActorTick.bCanEverTick = true;\n}\n// Called\
    \ when the game starts or when spawned\nvoid AStarShipFacade::BeginPlay()\n{\n\
    \    Super::BeginPlay();\n    //Initialize the lists\n    Crew = TArray<AStarShipCrewMember>();\n\
    \    Tasks = TArray<FString>();\n    //Spawn the members\n    AStarShipNavigationOfficer*\
    \ NavOfficer = GetWorld()->SpawnActor<AStarShipNavigationOfficer>(AStarShipNavigationOfficer::StaticClass());\n\
    \    AStarShipOperationsOfficer* OpsOfficer = GetWorld()->SpawnActor<AStarShipOperationsOfficer>(AStarShipOperationsOfficer::StaticClass());\n\
    \    AStarShipSupplyOfficer* SupOfficer = GetWorld()->SpawnActor<AStarShipSupplyOfficer>(AStarShipSupplyOfficer::StaticClass());\n\
    \    //Add the member to the crew\n    Crew.Add(NavOfficer);\n    Crew.Add(OpsOfficer);\n\
    \    Crew.Add(SupOfficer);\n}\n// Called every frame\nvoid AStarShipFacade::Tick(float\
    \ DeltaTime)\n{\n    Super::Tick(DeltaTime);\n}\nvoid AStarShipFacade::Reveille()\n\
    {\n    //Empty the task list\n    Tasks.Empty();\n    //Add the tasks to execute\n\
    \    Tasks.Add(\"trice_up\");\n    Tasks.Add(\"muster\");\n    //Execute the tasks\n\
    \    PerformTasks(Crew, Tasks);\n}\nvoid AStarShipFacade::PlanOfTheDay()\n{\n\
    \    //Empty the task list\n    Tasks.Empty();\n    //Add the tasks to execute\n\
    \    Tasks.Add(\"duty\");\n    //Execute the tasks\n    PerformTasks(Crew, Tasks);\n\
    }\nvoid AStarShipFacade::Taps()\n{\n    //Empty the task list\n    Tasks.Empty();\n\
    \    //Add the tasks to execute\n    Tasks.Add(\"liberty_call\");\n    Tasks.Add(\"\
    lights_out\");\n    //Execute the tasks\n    PerformTasks(Crew, Tasks);\n}\nvoid\
    \ AStarShipFacade::PerformTasks(TArray<AStarShipCrewMember*> myCrew, TArray<FString>\
    \ myTasks)\n{\n    //Execute the passed tasks for each crew member\n    for (AStarShipCrewMember*\
    \ Member : myCrew)\n    {\n        //Execute the task\n        Member->Task(myTasks);\n\
    \    }\n}\n```\n\nThe `StarShipFacade` class is where the essence of this pattern\
    \ exists. The `starshipFacade` event graph:\n\n![Graphical user interface Description\
    \ automatically generated](Image00090.jpg)\n\n### The `Add Navigation Officer\
    \ to crew` collapsed graph:\n\n![](Image00091.jpg)\n\n### The `Add Supply Officer\
    \ to crew` collapsed graph:\n\n![](Image00092.jpg)\n\n### The `Add Operations\
    \ Officer to Crew` collapsed graph:\n\n![](Image00093.jpg)\n\n### The `Reveille`\
    \ blueprint function:\n\n![](Image00094.jpg)\n\n### The `PlanOfTheDay` blueprint\
    \ function:\n\n![](Image00095.jpg)\n\n### The `Taps` blueprint function:\n\n![](Image00096.jpg)\n\
    \n### The `Perform Tasks` blueprint function:\n\n![](Image00097.jpg)\n\n### The\
    \ abstract class `StarShipCrewMember`:\n\n#### `StarShipCrewMember.h`\n```cpp\n\
    #pragma once\n#include \"CoreMinimal.h\"\n#include \"GameFramework/Actor.h\"\n\
    #include \"StarShipCrewMember.generated.h\"\nUCLASS()\nclass DESIGN_PATTERNS_API\
    \ AStarShipCrewMember : public AActor\n{\n    GENERATED_BODY()\npublic:\n    //\
    \ Sets default values for this actor's properties\n    AStarShipCrewMember();\n\
    protected:\n    // Called when the game starts or when spawned\n    virtual void\
    \ BeginPlay() override;\nprivate:\n    //Execute the passed Task\n    void Task(const\
    \ FString& Task);\npublic:\n    //Execute the TurnLightsOut task\n    void TurnLightsOut();\n\
    \    //Execute the HeaveOutTriceUp task\n    void HeaveOutTriceUp();\n    //Execute\
    \ the LibertyCall task\n    void LibertyCall();\n    //Execute the CrewMuster\
    \ task\n    void CrewMuster();\n    //Execute the passed Tasks\n    void Task(const\
    \ TArray<FString>& Tasks);\n    //Execute the member duty. It's pure virtual,\
    \ so it doesn't need an implementation in this class\n    virtual void Duty()\
    \ PURE_VIRTUAL(AStarShipCrewMember::Duty, );\n    //Return the member Title. It's\
    \ pure virtual, so it doesn't need an implementation in this class\n    virtual\
    \ FString CrewTitle() PURE_VIRTUAL(AStarShipCrewMember::CrewTitle, return \"\"\
    ; );\n};\n```\n\n`StarShipCrewMember.cpp`\n"
