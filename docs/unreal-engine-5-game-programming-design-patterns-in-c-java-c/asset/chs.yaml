  \n让我们实现 `Subscriber`：\n\n***Subscriber.h***\n```cpp\n#pragma once\n#include \"CoreMinimal.h\"\
  \n#include \"UObject/Interface.h\"\n#include \"Subscriber.generated.h\"\n\n// 此类不需要修改\n\
  UINTERFACE(MinimalAPI)\nclass USubscriber : public UInterface\n{\n    GENERATED_BODY()\n\
  };\n\n//向此类中添加接口函数。这是将被继承以实现此接口的类。\nclass DESIGN_PATTERNS_API ISubscriber\n{\n \
  \   GENERATED_BODY()\npublic:\n    // Subscriber 的纯虚函数\n    virtual void Update(class\
  \ APublisher* Publisher) = 0;\n};\n```\n\n***Subscriber.cpp***\n```cpp\n#include\
  \ \"Subscriber.h\"\n// 为任何非纯虚 ISubscriber 函数在此处添加默认功能。\n```\n\n让我们实现 `Publisher`：\n\
  \n***Publisher.h***\n```cpp\n#pragma once\n#include \"CoreMinimal.h\"\n#include\
  \ \"GameFramework/Actor.h\"\n#include \"Subscriber.h\"\n#include \"Publisher.generated.h\"\
  \n\nUCLASS()\nclass DESIGN_PATTERNS_API APublisher : public AActor\n{\n    GENERATED_BODY()\n\
  public:\n    // 设置此 Actor 属性的默认值\n    APublisher();\nprivate:\n    // 此发布者的订阅者\n\
  \    UPROPERTY()\n    TArray<AActor*> Subscribers = TArray<AActor*>();\nprotected:\n\
  \    // 当游戏开始或被生成时调用\n    virtual void BeginPlay() override;\npublic:\n    // 每帧调用\n\
  \    virtual void Tick(float DeltaTime) override;\npublic:\n    // 将传递的订阅者添加到列表\n\
  \    virtual void Subscribe(AActor* Subscriber);\n    // 从列表中移除传递的订阅者\n    virtual\
  \ void UnSubscribe(AActor* SubscriberToRemove);\n    // 通知所有订阅者发生了某些变化\n    virtual\
  \ void NotifySubscribers();\n};\n```\n\n***Publisher.cpp***\n\n\n\n\n\n```cpp\n\
  #include \"Publisher.h\"\n// 设置默认值\nAPublisher::APublisher()\n{\n    // 设置此 Actor\
  \ 每帧都调用 Tick()。如果不需要，可以关闭它以提高性能。\n    PrimaryActorTick.bCanEverTick = true;\n}\n\
  // 当游戏开始或被生成时调用\nvoid APublisher::BeginPlay()\n{\n    Super::BeginPlay();\n}\n\n\
  // 每帧调用一次\nvoid APublisher::Tick(float DeltaTime)\n{\n    Super::Tick(DeltaTime);\n\
  }\nvoid APublisher::Subscribe(AActor* Subscriber)\n{\n    // 添加传入的 Subscriber\n\
  \    Subscribers.Add(Subscriber);\n}\n\nvoid APublisher::UnSubscribe(AActor* SubscriberToRemove)\n\
  {\n    // 移除传入的 Subscriber\n    Subscribers.Remove(SubscriberToRemove);\n}\n\nvoid\
  \ APublisher::NotifySubscribers()\n{\n    // 遍历每个 Subscriber\n    for (AActor* Actor\
  \ : Subscribers)\n    {\n        // 将它们中的每一个转换为具体的 Subscriber\n        ISubscriber*\
  \ Sub = Cast<ISubscriber>(Actor);\n        if (Sub)\n        {\n            // 通知每一个它们发生了变化，以便它们执行自己的例程\n\
  \            Sub->Update(this);\n        }\n    }\n}\n```\n\n这是发布者的 `Subscribe`\
