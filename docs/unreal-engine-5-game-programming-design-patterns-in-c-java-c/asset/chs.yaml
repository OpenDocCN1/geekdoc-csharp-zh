  \n观察者模式的视口打印：\n\n![自动生成的文本描述](img/Image00132.jpg)\n\n# 你击沉了我的战舰……策略模式 (C#)\n\n##\
  \ 策略模式 UML 图\n\n![自动生成的图表描述](img/Image00283.jpg)\n\n## 策略模式实现\n\n我们有一套应对海战不同敌人的策略。如果威胁较小，则使用暴力策略。如果敌人很多，我们使用分而治策略。如果认为战斗是徒劳的，则执行撤退策略。`Strategy_Main`\
  \ 类：\n\n```csharp\nusing System;\nnamespace Strategy{\n    class Strategy_Main {\n\
  \        static void Main(string[] args) {\n            Console.WriteLine(\"A tiny\
  \ frigate wants some trouble\");\n            BattleShip battleShip = new BattleShip(new\
  \ BruteForceStrategy());\n            battleShip.engage();\n            Console.WriteLine(\"\
  Four tiny frigates want some trouble\");\n            battleShip.alterManeuvers(new\
  \ DivideConquerStrategy());\n            battleShip.engage();\n            Console.WriteLine(\"\
  An aircraft carrier group wants some trouble\");\n            battleShip.alterManeuvers(new\
  \ RetreatStrategy());\n            battleShip.engage();\n        }\n    }\n}\n```\n\
  \n`Strategy_Main` 蓝图事件图：\n\n![一张自动生成的计算机描述截图，置信度低](img/Image00168.jpg)\n\n`Create\
  \ BruteForceStrategy` 折叠图：\n\n![自动生成的图形用户界面、应用程序描述](img/Image00169.jpg)\n\n`Create\
  \ Battleship` 折叠图：\n\n![自动生成的图形用户界面、应用程序描述](img/Image00170.jpg)\n\n`Execute Br Force\
  \ Strategy` 折叠图：\n\n![一张自动生成的视频游戏描述截图，置信度中等](img/Image00171.jpg)\n\n`Execute Divide\
  \ Conquer Strategy` 折叠图：\n\n![一张自动生成的视频游戏描述截图，置信度中等](img/Image00172.jpg)\n\n`Execute\
  \ Retreat Strategy` 折叠图：\n\n![一张自动生成的视频游戏描述截图，置信度中等](img/Image00173.jpg)\n\n`BattleShip`\
  \ 类：\n\n```csharp\npublic class BattleShip {\n    private BattleShipStrategy battleStrategy;\n\
  \    public BattleShip(BattleShipStrategy battleStrategy) {\n        this.battleStrategy\
  \ = battleStrategy;\n    }\n    public void alterManeuvers(BattleShipStrategy battleStrategy)\
  \ {\n        this.battleStrategy = battleStrategy;\n    }\n    public void engage()\
  \ {\n        battleStrategy.maneuver();\n    }\n}\n```\n\n`BattleShip` 构造脚本：\n\n\
  ![自动生成的图形用户界面、应用程序描述](img/Image00284.jpg)\n\n`alterManeuvers` 蓝图函数：\n\n![自动生成的图形用户界面描述](img/Image00175.jpg)\n\
  \n与 `BattleShip` 构造相同，区别在于在函数内部手动设置了 `battleStrategy` 变量，因为它没有像生成时那样被暴露。\n\n`engage`\
  \ 蓝图函数：\n\n![自动生成的图形用户界面、应用程序描述](img/Image00285.jpg)\n\n`BattleShipStrategy` 接口：\n\
  \n```csharp\npublic interface BattleShipStrategy {\n    void maneuver();\n}\n```\n\
  \n`BruteForceStrategy` 类：\n\n```csharp\nusing System;\npublic class BruteForceStrategy\
  \ : BattleShipStrategy {\n    public void maneuver() {\n        Console.WriteLine(\"\
  We can take these ships head on\");\n    }\n}\n```\n\n`BruteForceStrategy` 蓝图事件图：\n\
  \n![自动生成的图形用户界面、应用程序描述](img/Image00177.jpg)\n\n`DivideConquerStrategy` 类：\n\n```csharp\n\
  using System;\npublic class DivideConquerStrategy : BattleShipStrategy {\n    public\
  \ void maneuver() {\n        Console.WriteLine(\"Lure ships away from each other\
  \ and attack each individually\");\n    }\n}\n```\n\n`DivideConquerStrategy` 蓝图事件图：\n\
  \n![自动生成的图形用户界面描述](img/Image00178.jpg)\n\n`RetreatStrategy` 类：\n\n```csharp\nusing\
  \ System;\npublic class RetreatStrategy : BattleShipStrategy {\n    public void\
  \ maneuver() {\n        Console.WriteLine(\"Full speed away!\");\n    }\n}\n```\n\
