  \n---\n\n> 适应并克服…… 适配器模式 (C#)\n\n### 适配器模式 UML 图\n\n![Diagram Description automatically\
  \ generated](img/Image00216.jpg)\n\n### 适配器模式实现\n\n在我们的适配器模式实现中，有一个使用弹弓弓的射手。我们希望能够让这个射手使用手枪。然而，我们想通过使用适配器模式来利用已经实现的现有代码。\n\
  \n### 主适配器类：\n\n```csharp\nusing System;\nnamespace Adapter\n{\n    class Adapter_Main\n\
  \    {\n        static void Main(string[] args)\n        {\n            Shooter\
  \ shooter = new Shooter(new GunAdapter());\n            shooter.sling();\n     \
  \   }\n    }\n}\n```\n\n### `Adapter_Main` 蓝图：\n\n![Graphical user interface, application\
  \ Description automatically generated](img/Image00062.jpg)\n\n### `Create_Gun_Adapter`\
