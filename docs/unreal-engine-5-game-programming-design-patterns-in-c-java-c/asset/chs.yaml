  Skill\");\n        System.out.println(\"Potion is \" + potion.getPotionName() +\
  \ \"\\n\");\n        potion = innerRealmShop.orderPotion(\"Skill\");\n        System.out.println(\"\
  Potion is \" + potion.getPotionName() + \"\\n\");\n    }\n}\n```\n\n这是 `FactoryMethod_Main`\
