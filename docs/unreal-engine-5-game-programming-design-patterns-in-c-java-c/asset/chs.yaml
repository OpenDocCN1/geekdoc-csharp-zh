  \n俗话说：“面向接口编程，而不是面向实现”（Gamma et.al, 1995）。事实上，它是面向对象设计的核心原则。面向接口编程的主要优点是减少了子系统之间的实现依赖（Gamma\
  \ et.al, 1995）。我们在构建器模式（Builder Pattern）示例中亲眼看到了这一点。具体来说，构建模式试图将复杂对象的构建与其实际表示解耦（Gamma\
  \ et.al, 1995）。\n\n```\ninterface LodgingBuilder {\n    public void buildSwimmingPool();\n\
  \    public void buildLobbyArea();\n    public void buildRooms();\n    public void\
  \ buildRestaurants();\n    public Lodging getLodging();\n}\n```\n\n`LodgingBuilder`\
  \ 接口蓝图的截图与 `FloorPlan` 接口蓝图采用相同的设计，因此为了简洁起见已将其移除。今后，除非认为有助于加深读者的理解，否则将尽可能少显示接口蓝图图像。\n\
