  ### `Gun` 蓝图：\n\n![A picture containing text, sign Description automatically generated](img/Image00218.jpg)\n\
  \n### `Shooter` 类：\n\n```csharp\npublic class Shooter : SlingShot {\n    private\
  \ SlingShot slingShot;\n    public Shooter(SlingShot slingShot) {\n        this.slingShot\
  \ = slingShot;\n    }\n    public void sling() {\n        slingShot.sling();\n \
