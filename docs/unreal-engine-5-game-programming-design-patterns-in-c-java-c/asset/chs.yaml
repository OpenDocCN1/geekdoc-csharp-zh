  \ \n\n### 建造者模式实现\n\n`Builder` 类包含了 Java 中的 `main` 函数。在蓝图中，我们可以认为该类是真正需要物理拖入游戏世界的那个类。其他的“具体”类不需要物理地拖入世界。\n\
  \n```java\nclass Builder_Main{\n    public static void main(String[] args) {\n \
  \       LodgingBuilder hotelBuilder = new HotelLodgingBuilder();\n        ArchitecturalEngineer\
  \ engineer = new ArchitecturalEngineer(hotelBuilder);\n        engineer.constructLodging();\n\
  \        Lodging lodging = engineer.getLodging();\n        lodging.lodgingCharacteristics();\n\
  \    }\n}\n```\n\n\n\n\n\n`Spawn Actor From Class` 节点类似于 Java 及其他语言中的 `new` 关键字。通过“Class”字样下方的下拉框选择要实例化的类。`Spawn\
  \ Transform` 取决于具体的场景。为了简单起见，我们只需右键点击 `Spawn Transform` 并选择“Promote to Variable”（提升为变量）。如果没有\
  \ `Spawn Transform`，蓝图将带错误编译。在所需的 Actor 实例化后，我们设置（或“初始化”）我们的 `hotelBuilder` 变量。\n\
  \n这种相同的基本思想也适用于 `Set engineer` 折叠图表（collapsed graph）。然而，`Architectural Engineer`\
  \ 需要将一个 `LodgingBuilder` 传递其构造函数，正如这行代码所示：\n\n```\nArchitecturalEngineer engineer\
  \ = new ArchitecturalEngineer(hotelBuilder);\n```\n\n稍后，我们不会对每个实例化活动都进行如此细节。请相信，有许多、许多实例化\
  \ Actor 的需求，讨论每一个细节将变成一项枯燥的练习。\n\n`Builder_Main` 蓝图继续执行 `Construct Lodging` 函数调用节点。该函数被调用在我们之前实例化的\
  \ `engineer` 上。等效的代码行：\n\n```\nengineer.constructLodging();\n```\n\n注意 `Builder_Main`\
  \ 中的 `Sequence` 节点。`Sequence 0` 在 `Construct Lodging` 函数调用执行后完成。然后 `Sequence 1`\
  \ 开始执行。`Set lodging` 折叠图表：\n\n![图形用户界面，应用描述自动生成](img/Image00007.jpg)\n\n现在，我们等效地执行了这行代码：\n\
