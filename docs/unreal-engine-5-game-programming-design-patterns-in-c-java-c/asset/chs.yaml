  `Morning_Morph` 折叠图：\n\n![一张自动生成的视频游戏描述截图，置信度中等](img/Image00129.jpg)\n\n`Midday_Morph`\
  \ 折叠图：\n\n![一张自动生成的视频游戏描述截图，置信度中等](img/Image00130.jpg)\n\n`Evening_Morph` 折叠图：\n\
