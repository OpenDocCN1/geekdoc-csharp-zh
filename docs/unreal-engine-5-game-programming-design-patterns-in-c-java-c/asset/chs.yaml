  \n# 编程精英主义者的克星……单例模式（Singleton Pattern）\n\n单例模式经常被单独挑出来作为最常用的设计模式之一，如果不是最糟糕的一个的话。单例就像信用卡，每个人都在使用它们，但如果你不负责任地使用，就会陷入真正的困境。编程纯洁者们憎恶单例模式。事实上，我从未见过任何现代出版的文献在讨论单例模式时不提醒读者避免使用它，这很讽刺。四人小组将单例描述为只有一个实例的类，并提供了一个全局访问点（Gamma\
  \ et.al, 1995）。\n\n## 优点\n\n- ● 封装唯一实例\n- ● 全局（便于访问）\n\n## 不如人意的之处\n\n- ● 全局（便于修改）\n\
  - ● 可能产生未知的依赖关系\n\n### 单例模式实现\n\n在 Unreal 中没有明确的方法来创建自定义的单例蓝图。然而，Game Instance（游戏实例）似乎是单例的一种官方解决方案。库存系统是演示单例设计模式的一个绝佳例子。我们希望任何时候都只有一个库存实例。此外，我们希望能够在整个游戏中轻松访问该库存系统。\n\
  \n主单例类 `Singleton_Main`：\n\n`Singleton_Main.h`\n\n```cpp\n#pragma once\n#include\
  \ \"CoreMinimal.h\"\n#include \"GameFramework/Actor.h\"\n#include \"Singleton_Main.generated.h\"\
  \n\nUCLASS()\nclass DESIGN_PATTERNS_API ASingleton_Main : public AActor\n{\n   \
  \ GENERATED_BODY()\npublic:\n    // 设置此 属性的默认值\n    ASingleton_Main();\nprivate:\n\
  \    // 此 Actor 的库存\n    UPROPERTY()\n    class AInventory* Inventory;\nprotected:\n\
  \    // 当游戏开始或被生成时调用\n    virtual void BeginPlay() override;\npublic:\n    // 每帧被调用\n\
  \    virtual void Tick(float DeltaTime) override;\n};\n```\n\n`Singleton_Main.cpp`\n\
  \n```cpp\n#include \"Singleton_Main.h\"\n#include \"Inventory.h\"\n\n// 设置默认值\n\
  ASingleton_Main::ASingleton_Main()\n{\n    // 设置此 Actor 每帧调用 Tick()。如果你不需要可以将其关闭。\n\
  \    PrimaryActorTick.bEverTick = true;\n}\n\n// 当游戏开始或被生成时调用\nvoid ASingleton_Main::BeginPlay()\n\
  {\n    Super::BeginPlay();\n    // 创建 4 个库存\n    for (int i = 0; i <= 4; i++)\n\
  \    {\n        AInventory* SpawnedInventory = GetWorld()->SpawnActor<AInventory>(AInventory::StaticClass());\n\
  \        if (SpawnedInventory)\n        {\n            // 如果生成成功，将生成的库存赋值给本地并记录成功字符串\n\
  \            Inventory = SpawnedInventory;\n            GEngine->AddOnScreenDebugMessage(-1,\
  \ 15.f, FColor::Yellow, FString::Printf(TEXT(\"%s has been created\"), Inventory->GetName()));\n\
  \        }\n    }\n}\n\n// 每帧被调用\nvoid ASingleton_Main::Tick(float DeltaTime)\n\
  {\n    Super::Tick(DeltaTime);\n}\n```\n\n`Singleton_Main` 蓝图事件图：\n\n![](img/Image00055.jpg)\n\
  \n存在 for 循环是为了演示尝试为我们指定的单例对象创建多个实例。如果设置正确，我们不应该允许创建多个库存实例。\n\n`Create_Inventory_Instance`\
  \ 折叠图：\n\n![](img/Image00056.jpg)\n\n`Instance_Created_Message` 折叠图：\n\n![](img/Image00057.jpg)\n\
  \n`Inventory` 类：\n\n`Inventory.h`\n\n```cpp\n#pragma once\n#include \"CoreMinimal.h\"\
  \n#include \"GameFramework/Actor.h\"\n#include \"Inventory.generated.h\"\n\nUCLASS()\n\
  class DESIGN_PATTERNS_API AInventory\n{\n    GENERATED_BODY()\npublic:\n    // 设置此\
  \ 属性的默认值\n    AInventory();\n    // 此类的实例\n    UPROPERTY()\n    class AInventory*\
  \ Instance;\nprotected:\n    // 当游戏开始或被生成时调用\n    virtual void BeginPlay() override;\n\
  public:\n    // 每帧被调用\n    virtual void Tick(float DeltaTime) override;\n};\n```\n\
  \n`Inventory.cpp`\n\n\n\n\n\n```cpp\n#include \"Inventory.h\"\n#include \"Kismet/GameplayStatics.h\"\
  \n\n// 设置默认值\nAInventory::AInventory()\n{\n    // 设置此 Actor 每帧都调用 Tick()。如果你不需要它，可以关闭它以提高性能。\n\
  \    PrimaryActorTick.bCanEverTick = true;\n    // 查找该类的现有实例\n    TArray<AActor*>\
  \ Instances;\n    UGameplayStatics::GetAllActorsOfClass(GetWorld(), AInventory::StaticClass(),\
  \ Instances);\n    if (Instances.Num() > 1)\n    {\n        // 如果至少存在一个，则将找到的第一个实例设置为实例\n\
  \        Instance = Cast<AInventory>(Instances[0]);\n        GEngine->AddOnScreenDebugMessage(-1,\
  \ 15.f, FColor::Yellow, FString::Printf(TEXT(\"%s already exists\"), Instance->GetName()));\n\
  \        // 然后销毁此 Actor\n        Destroy();\n    }\n}\n\n// 当游戏开始或生成时调用\nvoid AInventory::BeginPlay()\n\
  {\n    Super::BeginPlay();\n}\n\n// 每帧调用\nvoid AInventory::Tick(float DeltaTime)\n\
  {\n    Super::Tick(DeltaTime);\n}\n```\n\n`Inventory` 蓝图构造脚本：\n\n![](img/Image00058.jpg)\n\
  \nUnreal 中不存在私有构造的概念。因此，我们必须创建另一种方法来防止创建新的单例对象。我们通过检查是否已经存在库存实例来实现。如果库存实例确实存在，则尝试创建的新单例对象将被销毁。\n\
  \n`isInstance_already_exist` 折叠图：\n\n![](img/Image00059.jpg)\n\n`kill_yourself`\
  \ 折叠图：\n\n![](img/Image00060.jpg)\n\n单例模式视口屏幕打印：\n\n![](img/Image00061.jpg)\n\n\
  ### 结构型模式 (Structural Patterns)\n\n我们讨论的结构型模式帮助我们从类和对象组合更大的结构。这种模式类别最重要的目标之一是能够在运行时更改对象的组合。\n\
  \n### 适应并克服…… 适配器模式 (Adapter Pattern)\n\n大量现代技术使用了包装器（wrapper）的概念。可以将高级编程语言考虑为对低层编程语言的包装。但这些被包装的语言及其客户端语言是如何通信的呢？我们需要某种适配器。GoF\
  \ 告诉我们，适配器模式允许由于接口不兼容而无法共同工作的类协同工作（Gamma et.al, 1995）。\n\n**优点**\n\n> ● 重用那些与新代码库不兼容的复杂代码\n\
  > ● 实现相当容易\n\n**缺点**\n\n> ● 可能会为了“把方木钉钉进圆孔”而过度使用\n> ● 难以识别出何时需要新的实现或是否需要使用适配器\n\n\
  #### 适配器模式的实现\n\n在我们的适配器模式实现中，我们有一个使用弹弓的射击者。我们希望允许我们的射击者射枪。然而，我们希望通过使用适配器模式来使用已经实现的现有代码。\n\
  \n主适配器类：\n\n`Adapter_Main.h`\n\n```cpp\n#include \"CoreMinimal.h\"\n#include \"\
  GameFramework/Actor.h\"\n#include \"Adapter_Main.generated.h\"\n\nUCLASS()\nclass\
  \ DESIGN_PATTERNS_API AAdapter_Main : public AActor\n{\n    GENERATED_BODY()\npublic:\n\
  \    // 设置此 Actor 属性的默认值\n    AAdapter_Main();\nprivate:\n    // 持有枪的适配器的 Shooter\
  \ Actor\n    UPROPERTY() class AShooter* Shooter;\nprotected:\n    // 当游戏开始或生成时调用\n\
  \    virtual void BeginPlay() override;\npublic:\n    // 每帧调用\n    virtual void\
  \ Tick(float DeltaTime) override;\n};\n```\n\n`Adapter_Main.cpp`\n\n```cpp\n#include\
  \ \"Adapter_Main.h\"\n#include \"GunAdapter.h\"\n#include \"Shooter.h\"\n\n// 设置默认值\n\
  AAdapter_Main::AAdapter_Main()\n{\n    // 设置此 Actor 每帧都调用 Tick()。如果你不需要它，可以关闭它以提高性能。\n\
  \    PrimaryActorTick.bCanEverTick = true;\n}\n\n// 当游戏开始或生成时调用\nvoid AAdapter_Main::BeginPlay()\n\
  {\n    Super::BeginPlay();\n    // 生成枪适配器\n    AGunAdapter* GunAdapter = GetWorld()->SpawnActor<AGunAdapter>(AGunAdapter::StaticClass());\n\
  \    // 生成射击者并设置枪适配器\n    Shooter = GetWorld()->SpawnActor<AShooter>(AShooter::StaticClass());\n\
  \    Shooter->SetSlingShot(GunAdapter);\n    // 射击\n    Shooter->Sling();\n}\n\n\
  // 每帧调用\nvoid AAdapter_Main::Tick(float DeltaTime)\n{\n    Super::Tick(DeltaTime);\n\
  }\n```\n\n`Adapter_Main` 蓝图：\n\n![](img/Image00062.jpg)\n\n`Create_Gun_Adapter`\
  \ 折叠图：\n\n![](img/Image00063.jpg)\n\n`Create_Shooter` 折叠图：\n\n![](img/Image00064.jpg)\n\
  \n`SlingShot` 接口：\n\n`SlingShot.h`\n\n```cpp\n#pragma once\n#include \"CoreMinimal.h\"\
  \n#include \"U/Interface.h\"\n#include \"SlingShot.generated.h\"\n\n// 此类不需要修改。\n\
  INTERFACE(MinimalAPI)\nclass USlingShot : public UInterface\n{\n    GENERATED_BODY()\n\
  };\n\nclass DESIGN_PATTERNS_API ISlingShot\n{\n    GENERATED_BODY()\n    // ISlingShot\
  \ 的纯虚函数\n    virtual void Sling() = 0;\n};\n```\n\n`SlingShot.cpp`\n\n```cpp\n#include\
  \ \"SlingShot.h\"\n// ISlingShot 的实现\n```\n\n`GunAdapter` 类：\n\n`GunAdapter.h`\n\
  \n```cpp\n#pragma once\n#include \"CoreMinimal.h\"\n#include \"GameFramework/Actor.h\"\
  \n#include \"SlingShot.h\"\n#include \"GunAdapter.generated.h\"\n\nclass AGun;\n\
  \nUCLASS()\nclass DESIGN_PATTERNS_API GunAdapter : public AActor, public ISlingShot\n\
  {\n    GENERATED_BODY()\npublic:\n    // 设置此 Actor 属性的默认值\n    GunAdapter();\nprivate:\n\
  \    // \n    UPROPERTY()\n    AGun* Weapon;\nprotected:\n    // 当游戏开始或生成时调用\n \
  \   virtual void BeginPlay() override;\npublic:\n    // 每帧调用\n    virtual void Tick(float\
  \ DeltaTime) override;\n    // 实现接口\n    virtual void Sling() override;\n};\n```\n\
  \n`GunAdapter.cpp`\n\n```cpp\n#include \"GunAdapter.h\"\n#include \"Gun.h\"\n\n\
  // 设置默认值\nGunAdapter::GunAdapter()\n{\n    // 设置此 Actor 每帧都调用 Tick()。如果你不需要它，可以关闭它以提高性能。\n\
  \    PrimaryActorTick.bCanEverTick = true;\n}\n\n// 当游戏开始或生成时调用\nvoid GunAdapter::BeginPlay()\n\
  {\n    Super::BeginPlay();\n    // 生成武器\n    Weapon = GetWorld()->SpawnActor<AGun>(AGun::StaticClass());\n\
  }\n\n// 每帧调用\nvoid GunAdapter::Tick(float DeltaTime)\n{\n    Super::Tick(DeltaTime);\n\
  }\n\nvoid GunAdapter::Sling()\n{\n    if (!Weapon)\n    {\n        UE_LOG(LogTemp,\
  \ Error, TEXT(\"Sling(): Weapon 为空，请确保它已初始化。\"));\n        return;\n    }\n    //\
  \ 调用 Fire 函数\n    Weapon->Fire();\n}\n```\n\n`GunAdapter` 蓝图：\n\n![](img/Image00065.jpg)\n\
  \n`Gun` 类：\n\n`Gun.h`\n\n```cpp\n#pragma once\n#include \"CoreMinimal.h\"\n#include\
  \ \"GameFramework/Actor.h\"\n#include \"Gun.generated.h\"\n\nUCLASS()\nclass DESIGN_PATTERNS_API\
  \ AGun : public AActor\n{\n    GENERATED_BODY()\npublic:\n    // 设置默认值\n    AGun();\n\
  protected:\n    // 当游戏开始或生成时调用\n    virtual void BeginPlay() override;\npublic:\n\
  \    // 每帧调用\n    virtual void Tick(float DeltaTime) override;\n    // 用枪射击\n  \
  \  virtual void Fire();\n};\n```\n\n`Gun.cpp`\n\n\n\n\n\n```cpp\n#include \"Gun.h\"\
  \n// 设置默认值\nAGun::AGun()\n{\n    // 设置此 actor（执行者）每帧都调用 Tick()。如果不需要，可以关闭它以提高性能。\n\
  \    PrimaryActorTick.bCanEverTick = true;\n}\n// 当游戏开始或生成时调用\nvoid AGun::BeginPlay()\n\
  {\n    Super::BeginPlay();\n}\n// 每帧调用\nvoid AGun::Tick(float DeltaTime)\n{\n  \
  \  Super::Tick(DeltaTime);\n}\nvoid AGun::Fire()\n{\n    // 打印射击日志\n    GEngine->AddOnScreenDebugMessage(-1,\
  \ 15.f, FColor::Yellow, TEXT(\"Our gun is firing\"));\n}\n```\n\n`Gun` 图蓝：\n\n![图形用户界面，应用程序自动生成](img/Image00066.jpg)\n\
  \n`Shooter` 类：\n\n### `Shooter.h`\n\n```cpp\n#pragma once\n#include \"CoreMinimal.h\"\
  \n#include \"GameFramework/Actor.h\"\n#include \"SlingShot.h\"\n#include \"Shooter.generated.h\"\
  \n\nUCLASS()\nclass DESIGN_PATTERNS_API AShooter : public AActor, public ISlingShot\n\
  {\n    GENERATED_BODY()\npublic:\n    // 设置此 actor 属性的默认值\n    AShooter();\nprivate:\n\
  \    // 射击者的武器，必须是一个弹弓\n    ISlingShot* SlingShot;\nprotected:\n    // 当游戏开始或生成时调用\n\
  \    virtual void BeginPlay() override;\npublic:\n    // 每帧调用\n    virtual void\
  \ Tick(float DeltaTime) override;\n    // 设置武器 Actor\n    void SetSlingShot(AActor*\
  \ SlingShotObj);\n    // 使用弹弓射击\n    void Sling();\n};\n```\n\n### `Shooter.cpp`\n\
  \n```cpp\n#include \"Shooter.h\"\n// 设置默认值\nAShooter::AShooter()\n{\n    // 设置此\
  \ actor 每帧都调用 Tick()。如果不需要，可以关闭它以提高性能。\n    PrimaryActorTick.bCanEverTick = true;\n\
  }\n// 当游戏开始或生成时调用\nvoid AShooter::BeginPlay()\n{\n    Super::BeginPlay();\n}\n//\
  \ 每帧调用\nvoid AShooter::Tick(float DeltaTime)\n{\n    Super::Tick(DeltaTime);\n}\n\
  void AShooter::SetSlingShot(AActor* SlingShotObj)\n{\n    // 转换传递的 Actor 并设置武器\n\
  \    SlingShot = Cast<ISlingShot>(SlingShotObj);\n    if (!SlingShot) // 如果转换失败则记录错误\n\
  \    {\n        GEngine->AddOnScreenDebugMessage(-1, 15.f, FColor::Red, TEXT(\"\
  转换无效！查看输出日志获取更多详情\"));\n        UE_LOG(LogTemp, Error, TEXT(\"SetSlingShot(): 该\
  \ Actor 不是弹弓！你确定该 Actor 实现了该接口吗？\"));\n    }\n}\nvoid AShooter::Sling()\n{\n   \
  \ if (!SlingShot)\n    {\n        UE_LOG(LogTemp, Error, TEXT(\"Sling(): SlingShot\
  \ 为空，请确保它已初始化。\"));\n        return;\n    }\n    // 射击\n    SlingShot->Sling();\n\
  }\n```\n\n我们可以看到 `Shooter` 类没有射击枪支的功能。然而，它确实有使用弹弓的功能。这两项技能都基于从武器中发射射物体。我们希望复用弹弓的功能并将其适配到枪支的使用。\n\
