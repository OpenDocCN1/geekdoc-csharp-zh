  \n![图描述自动生成](img/Image00221.jpg)\n\n### 装饰器模式实现\n\n我们的实现包含一个初始为近战敌人。我们希望“装饰”敌人并创建一个可以使用射物的敌人。因此，添加的功能是投影能力。\n\
  \n`Decorator_Main` 类：\n\n\n\n\n\n```java\npublic class Decorator_Main {\n    public\
  \ static void main(String[] args) {\n        System.out.println(\"Melee Enemies\
  \ are on the horizon\");\n        Enemy enemy = new MeleeEnemy();\n        enemy.fight();\n\
  \        enemy.die();\n        System.out.println(\"Melee Enemies cause \" + enemy.getDamage()\
  \ + \"damage.\");\n        System.out.println(\"Enemies are now armed with guns\"\
  );\n        Enemy projectileEnemy = new ProjectileEnemy(enemy);\n        projectileEnemy.fight();\n\
  \        projectileEnemy.die();\n        System.out.println(\"Projectile Enemies\
  \ cause \" + projectileEnemy.getDamage() + \" damage.\");\n    }\n}\n```\n\n我们从\
  \ `Decorator_Main` 中看到，我们不需要创建一个单独的 `Enemy` 类来添加功能。我们只需要对敌人进行“装饰”，现在我们就有了一个远程射击敌人。实质上，我们通过使用装饰器在运行时改变了敌的行为。\n\
