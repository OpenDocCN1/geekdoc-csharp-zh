- "# Unreal Engine 5 游戏编程设计模式：C++、Java、C# 与蓝图\n\n\n\n\n![](img/Image00000.jpg)\n\n\
  \n\n\n> *献给 Lilly、Dwayne 和 Madison*\n\n\n\n\n\n\n\n# 引言\n\n本书并不是关于蓝图（Blueprint）设计、人工智能、用户界面、动画等方面的蓝图教程。示例中的实现非常简单，例如将字符串打印到屏幕/视口。为此，本书的重点放在了设计模式本身，而不是虚幻引擎中的各种花架哨。在这一点上，我们进行了非常仔细的考虑和处理，以减少过时性。虚幻引擎的更新非常频繁，导致大部分出版物在正式发表时几乎已经过时了。\n\
  \n此外，这并不是一本“最佳实践”书籍。请不要将本书作为蓝图最佳实践的参考。本书尝试尽可能遵循“等效”的代码逻辑。为了实现这一目标，我们可能会偏离蓝图的最佳实践，以尽可能真实地模拟代码中的编写方式。Epic\
  \ 费了大量精力在蓝图中抽象化了常见的编程任务。我鼓励你去学习官方 API，因为很多时候……“会有对应的节点（Node）”。\n\n俗俗说，“死猫有十种死”。每种设计模式的实现都可能存在替代的甚至更好的蓝图实现方式。本书仅提供了许多示例中的一种。\n\
  \n## 蓝图的怪异与非传统方法论\n\n### 蓝图接口 (Blueprint Interfaces)\n\n虚幻引擎中的蓝图脚本在实现传统编程构造方面有一些不同。最让人困惑的话题（特别是对于软件工程背景的人）是蓝图接口。蓝图接口被广泛引用为“通信”工具。当我听到\
  \ Epic 的员工在直播培训中这样说时，我几乎几乎发作。文档中也呼应了同样的“通信”概念。我无法告诉你我在阅读蓝图接口的文档时对着电脑屏幕大喊了多少。我会大喊：“不，接口和通信毫无关系！”接口的所有作用只是为实现它的对象定义一个保证的行为契约。然而，我是错的。人们必须放弃对接口的传统理解。必须接受蓝图接口的“通信”设定。在你认为我在抨击虚幻引擎之前，让我为你提供一段来自官方文档关于蓝图接口的精彩摘录：\n\
  \n*“蓝图接口是一个一个或多个函数的集合——仅有名称，没有实现——它可以被添加到其他蓝图中。任何添加了该接口的蓝图都保证拥有这些函数……这在本质上类似于通用编程中的接口概念”*\n\
  \n*-`https://docs.unrealengine.com/en-us/Engine/Blueprints/UserGuide/Types/Interface`*\n\
  \n### 不能在构造脚本（Construction Script）中生成\n\n这个标题自言易懂。为什么在尝试在“构造函数”构建对象时会面临挑战这并不直观。构造脚本是在编辑器运行游戏之前执行的。如果没有可以生成的区域（World），我们就无法“生成”对象。解决方法是使用\
  \ `Add Actor Component` 节点。可能有更好的方法，但到目前为止这种是有效的。我们在 C++ 蓝图中避免大量使用构造脚本，但在 Java 和\
  \ C# 的实现中大量使用了。\n\n### 序列节点 (Sequence Node) 的用法\n\n![](img/Image00001.jpg) \n\n\
  大量使用序列节点来鼓励蓝图整体流程从上到下。这对于大型蓝图的可读性是必要的。大多数蓝图通常是从左到右流向构建的。然而，书籍的垂直空间比水平空间大。\n\n###\
  \ 折叠节点 (Collapse Node)\n\n![](img/Image00002.jpg) \n\n折叠图节点用于将大型蓝图拆分为易于展示的区块。\n\n\
  ### 黄色接口 (Yellow Interface)\n\n![](img/Image00003.jpg)\n\n带有黄色调的折叠图表示接口。具体来说，它接受一个对象并检查它是否实现了目标。为了简洁，该节点在图中被单独列出。\n\
  \n## 创建模式 (Creational Patterns)\n\n创建模式有助于抽象实例化过程。当我们想要将对象与客户端解耦时，使用创建模式。随着对象数量的增加，它们的行为可能会产生。我们不能将每个对象硬编码到客户端中。\n\
  \n### 建造者模式 (Builder Pattern)\n\n你想封装复杂对象的创建过程吗？建造者模式寻求将构建与实际表示解耦。产品可以容易地切换。\n\n\
  ## 优点\n- 将对象的构建与表示解耦——轻松切换要构建的产品\n- 以分步的方式进行构建\n\n#### 缺点\n- 需要为每个产品创建建造者\n- 与某些设计模式有重叠\n\
  \n## 建造者实现\n\n我们想在游戏中建造一些住宿设施，即酒店和旅馆。人们可以轻松地将“酒店”和“旅馆”替换为任何需要构建的东西。然而，必须共享接口，建造者模式才有意义。例如，在蓝图中，我们可以将这个类视为需要物理性地拖入世界中的类。其他的“具体”类则不需要拖入世界。\n\
  \n***Builder_Main.h***\n```cpp\n#pragma once\n#include \"CoreMinimal.h\"\n#include\
  \ \"GameFramework/Actor.h\"\n#include \"Builder_Main.generated.h\"\n\nUCLASS()\n\
  class DESIGN_PATTERNS_API ABuilder_Main : public AActor\n{\n    GENERATED_BODY()\n\
  \npublic:\n    // 设置此 actor 的默认值\n    ABuilder_Main();\n\nprivate:\n    // 建造者 Actor\n\
  \    UPROPERTY(VisibleAnywhere, Category = \"Main\")\n    class AHotelLodgingBuilder*\
  \ HotelBuilder;\n\n    // 工程师 Actor\n    UPROPERTY(VisibleAnywhere, Category = \"\
  Main\")\n    class AArchitecturalEngineer* Engineer;\n\nprotected:\n    // 当游戏开始或生成时调用\n\
  \    virtual void BeginPlay() override;\n\npublic:\n    // 每帧调用\n    virtual void\
  \ Tick(float DeltaTime) override;\n};\n```\n\n***Builder_Main.cpp***\n```cpp\n#include\
  \ \"Builder_Main.h\"\n#include \"HotelLodgingBuilder.h\"\n#include \"ArchitecturalEngineer.h\"\
  \n#include \"Lodging.h\"\n\n// 设置默认值\nABuilder_Main::ABuilderMain()\n{\n    // 设置此\
  \ actor 每帧调用 Tick。如果不需要，可以关闭它。\n    PrimaryActorTick.bCanEverTick = true;\n}\n\n\
  // 当游戏开始或生成时调用\nvoid ABuilder_Main::BeginPlay()\n{\n    Super::BeginPlay();\n\n\
  \    // 生成建造者和工程师\n    HotelBuilder = GetWorld()->SpawnActor<AHotelLodgingBuilder>(AHotelLodgingBuilder::StaticClass());\n\
  \    Engineer = GetWorld()->SpawnActor<AArchitecturalEngineer>(AArchitecturalEngineer::StaticClass());\n\
  \n    // 为工程师设置建造者并构建建筑\n    Engineer->SetLodgingBuilder(HotelBuilder);\n    Engineer->ConstructLodging();\n\
  \n    // 获取工程师的住宿并记录生成的建筑\n    ALodging* Lodging = Engineer->GetLodging();\n   \
  \ Lodging->LodgingCharacteristics();\n}\n\n// 每帧调用\nvoid ABuilder_Main::Tick(float\
  \ DeltaTime)\n{\n    Super::Tick(DeltaTime);\n}\n```\n\n\n\n\n}\n\n`Builder` 类的蓝图等价物：\n\
  \n![图形用户界面描述](img/Image00004.jpg)\n\n`Set hotelBuilder` 和 `Set engineer` 折叠图分别为：\n\
  \n![](img/Image00005.jpg)\n\n以及\n\n![](img/Image00006.jpg)\n\n`Set hotelBuilder`\
  \ 折叠图代表了这一行代码：\n\n```cpp\nHotelBuilder = GetWorld()->SpawnActor<AHotelLodgingBuilder>(AHotelLodgingBuilder::StaticClass());\n\
  ```\n\n`Spawn Actor From Class` 节点类似于传统编程中的 `new` 关键字。要生成的类通过“Class”字样下的下拉框进行选择。Spawn\
  \ Transform 则取决于个人的特定场景。为了简单起见，我们只需右键点击 Spawn Transform 并选择“Promote to Variable”（提升为变量）。如果没有\
  \ Spawn Transform，蓝图将产生编译错误。在生成所需的 actor 后，我们设置（或“初始化”）了我们的 `hotelBuilder` 变量。\n\
  \n相同的基本思想也适用于 `Set engineer` 折叠图。然而，`Architectural Engineer` 需要一个 `LodgingBuilder`\
  \ 来为工程师设置 Builder，如此行代码所示：\n\n```cpp\nEngineer->SetLodgingBuilder(HotelBuilder);\n\
  ```\n\n稍后，我们不会对每一个生成活动进行如此详细的说明。请相信有很多生成它们的需求，讨论每一个细节将变成一项冗味的任务。\n\n`Builder_Main`\
  \ 蓝图继续通过 `Construct Lodging` 函数调用节点运行。该函数在我们之前生成的 `engineer` 上被调用。等价的代码行为：\n\n```cpp\n\
  Engineer->ConstructLodging();\n```\n\n注意 `Builder_Main` 中的 `Sequence` 节点。当 `Construct\
  \ Lodging` 函数调用执行完毕后，Sequence 0 完成。然后 Sequence 1 开始执行。`Set lodging` 折叠图如下：\n\n![](img/Image00007.jpg)\n\
  \n现在，我们通过这行代码等价地执行了获取后设置的操作：\n\n```cpp\nALodging Lodging = Engineer->GetLodging();\n\
  ```\n\n最后这一行非模板化代码是：\n\n```cpp\nLodging->LodgingCharacteristics();\n```\n\n这行代码和等价蓝图将在稍后讨论。然而，我们需要进行一些验证检查，并确保我们确实构建了一个酒店。我们想要确保\
  \ `lodging` actor 实现了 `FloorPlan` 接口。`lodging isFloorPlan_int` 折叠图如下：\n\n![](img/Image00008.jpg)\n\
  \n今后我们将不再显示此接口检查折叠图。请注意，此项检查的折叠图始终带有黄色调。折叠节点内部唯一改变的项是我们正在检查的对象的目标接口。目标接口始终是折叠图名称的一部分。\n\
  \n现在我们可以讨论在此模式中使用的接口了。首先，我们为所有住宿创建一个平面图（floor plan）接口供实现。美国大多数商业住宿都包含泳池、大堂区域、房间和餐厅。我们还创建了一个住宿\
  \ builder 接口，供我们特定的住宿 builder 类实现。`FloorPlan` 接口：\n\n***FloorPlan.h***\n```cpp\n\
  #pragma once\n#include \"CoreMinimal.h\"\n#include \"UObject/Interface.h\"\n#include\
  \ \"FloorPlan.generated.h\"\n\n// 此类不需要修改。\nUINTERFACE(MinimalAPI)\nclass UFloorPlan\
  \ : public UInterface\n{\n    GENERATED_BODY()\n};\n\nclass DESIGN_PATTERNS_API\
  \ IFloorPlan\n{\n    GENERATED_BODY()\n    // 将接口函数添加到此类。这是将被继承以实现此接口的类。\npublic:\n\
  \    // FloorPlan 的纯虚函数\n    virtual void SetSwimmingPool(FString SwimmingPool)\
  \ = 0;\n    virtual void SetLobbyArea(FString LobbyArea) = 0;\n    virtual void\
  \ SetRooms(FString Rooms) = 0;\n    virtual void SetRestaurants(FString Restaurants)\
  \ = 0;\n};\n```\n\n***FloorPlan.cpp***\n```cpp\n#include \"FloorPlan.h\"\n// 为任何非纯虚的\
  \ IFloorPlan 函数在此添加默认功能。\n```\n\n等价的蓝图接口非常平庸。以下是代表 `FloorPlan` 接口中函数的节点。\n\n![](img/Image00009.jpg)[](Image00010.jpg)[](Image00011.jpg)[](Image00012.jpg)\n\
  \n俗语说道：“面向接口编程，而不是面向实现”（Gamma et.al, 1995）。事实上，这是面向对象设计的核心原则之一。面向接口编程的主要益处是减少了子系统之间的实现依赖（Gamma\
  \ et.al, 1995）。我们在我们的建造模式示例中直观地看到了这一点。具体来说，建造模式将复杂对象的构建过程与其实际表示解耦（Gamma et.al, 1995）。\n\
  \n`LodgingBuilder` 接口：\n\n***LodgingBuilder.h***\n```cpp\n#pragma once\n#include\
  \ \"CoreMinimal.h\"\n#include \"UObject/Interface.h\"\n#include \"LodgingBuilder.generated.h\"\
  \n\n// 此类不需要修改。\nUINTERFACE(MinimalAPI)\nclass ULodgingBuilder : public UInterface\n\
  {\n    GENERATED_BODY()\n};\n\nclass DESIGN_PATTERNS_API ILodgingBuilder\n{\n  \
  \  GENERATED_BODY()\n    // 将接口函数添加到此类。这是将被继承以实现此接口的类。\npublic:\n    // LodgingBuilder\
  \ 的纯虚函数\n    virtual void BuildSwimmingPool() = 0;\n    virtual void BuildLobbyArea()\
  \ = 0;\n    virtual void BuildRooms() = 0;\n    virtual void BuildRestaurants()\
  \ = 0;\n    virtual class ALodging GetLodging() = 0;\n};\n```\n\n***LodgingBuilder.cpp***\n\
  ```cpp\n#include \"LodgingBuilder.h\"\n// 为任何非纯虚的 ILodgingBuilder 函数在此添加默认功能。\n\
  ```\n\n接下来，我们创建一个实现 `FloorPlan` 接口的 `Lodging` 类。\n\n***Lodging.h***\n\n\n\n\n\n\
  ```cpp\n#pragma once\n#include \"CoreMinimal.h\"\n#include \"GameFramework/Actor.h\"\
  \n#include \"FloorPlan.h\"\n#include \"Lodging.generated.h\"\n\nUCLASS()\nclass\
  \ DESIGN_PATTERNS_API ALodging : public AActor, public IFloorPlan\n{\n    GENERATED_BODY()\n\
  \npublic:\n    // 设置此 actor 属性的默认值\n    ALodging();\n\nprivate:\n    // 游泳池名称\n\
  \    FString SwimmingPool;\n    // 大堂区域名称\n    FString LobbyArea;\n    // 房间名称\n\
  \    FString Rooms;\n    // 餐厅名称\n    FString Restaurants;\n\nprotected:\n    //\
  \ 当游戏开始或生成时被调用\n    virtual void BeginPlay() override;\n\npublic:\n    // 每帧调用\n\
  \    virtual void Tick(float DeltaTime) override;\n    // 设置游泳池名称\n    void SetSwimmingPool(FString\
  \ mySwimmingPool);\n    // 设置大堂区域名称\n    void SetLobbyArea(FString myLobbyArea);\n\
  \    // 设置房间名称\n    void SetRooms(FString myRooms);\n    // 设置餐厅名称\n    void SetRestaurants(FString\
  \ myRestaurants);\n    // 记录所有住宿层\n    void LodgingCharacteristics();\n};\n```\n\
  \n`Lodging.cpp`\n```cpp\n#include \"Lodging.h\"\n\n// 设置默认值\nALodging::ALodging()\n\
  {\n    // 设置此 actor 每帧调用 Tick()。如果不需要它，可以关闭它以提高性能。\n    PrimaryActorTick.bCanEverTick\
  \ = true;\n}\n\n// 当游戏开始或生成时被调用\nvoid ALodging::BeginPlay()\n{\n    Super::BeginPlay();\n\
  }\n\n// 每帧调用\nvoid ALodging::Tick(float DeltaTime)\n{\n    Super::Tick(DeltaTime);\n\
  }\n\nvoid ALodging::SetSwimmingPool(FString mySwimmingPool)\n{\n    // 使用传入的字符串设置游泳池名称\n\
  \    SwimmingPool = mySwimmingPool;\n}\n\nvoid ALodging::SetLobbyArea(FString myLobbyArea)\n\
  {\n    // 使用传入的字符串设置大堂区域名称\n    LobbyArea = myLobbyArea;\n}\n\nvoid ALodging::SetRooms(FString\
  \ myRooms)\n{\n    // 使用传入的字符串设置房间名称\n    Rooms = myRooms;\n}\n\nvoid ALodging::SetRestaurants(FString\
  \ myRestaurants)\n{\n    // 使用传入的字符串设置餐厅名称\n    Restaurants = myRestaurants;\n}\n\
  \nvoid ALodging::LodgingCharacteristics()\n{\n    // 记录每一层的名称\n    GEngine->AddOnScreenDebugMessage(-1,\
  \ 15.f, FColor::Yellow, FString::Printf(TEXT(\"%s\"), SwimmingPool));\n    GEngine->AddOnScreenDebugMessage(-1,\
  \ 15.f, FColor::Yellow, FString::Printf(TEXT(\"%s\"), LobbyArea));\n    GEngine->AddOnScreenDebugMessage(-1,\
  \ 15.f, FColor::Yellow, FString::Printf(TEXT(\"%s\"), Rooms));\n    GEngine->AddOnScreenDebugMessage(-1,\
  \ 15.f, FColor::Yellow, FString::Printf(TEXT(\"%s\"), Restaurants));\n}\n```\n\n\
  记得主蓝图中的 `LodgingCharacteristics` 节点吗？它在这里：\n\n![自动生成的图形界面描述](img/Image00013.jpg)\n\
  \nLodging 蓝图还包含了稍后由建筑工程师调用的事件：\n\n![自动生成的图形界面、应用程序描述](img/Image00014.jpg)\n\n蓝图在调用\
  \ void 接口函数时使用 `Event` 节点。`Lodging` 类的蓝图版本除了设置局部变量外，还会打印传递给函数的字符串值。此外，我们必须通过在类设置的\
  \ Interfaces 区域中添加它，来确保此蓝图类实现了 `FloorPlan` 接口。\n\n该类是 `HotelLodgingBuilder`。它实现了住宿构建器接口，并为种类型的住宿提供了自定义规格。\n\
  \n***HotelLodgingBuilder.h***\n```cpp\n#pragma once\n#include \"CoreMinimal.h\"\n\
  #include \"GameFramework/Actor.h\"\n#include \"LodgingBuilder.h\"\n#include \"HotelLodgingBuilder.generated.h\"\
  \n\nUCLASS()\nclass DESIGN_PATTERNS_API AHotelLodgingBuilder : public AActor, public\
  \ ILodgingBuilder\n{\n    GENERATED_BODY()\n\npublic:\n    // 设置此 actor 属性的默认值\n\
  \    AHotelLodgingBuilder();\n\nprivate:\n    // 住宿 Actor\n    UPROPERTY(VisibleAnywhere,\
  \ Category=\"Hotel Lodging\")\n    class ALodging Lodging;\n\nprotected:\n    //\
  \ 当游戏开始或生成时被调用\n    virtual void BeginPlay() override;\n\npublic:\n    // 每帧调用\n\
  \    virtual void Tick(float DeltaTime) override;\n    // 创建游泳池\n    virtual void\
  \ BuildSwimmingPool() override;\n    // 创建大堂区域\n    virtual void BuildLobbyArea()\
  \ override;\n    // 创建餐厅\n    virtual void BuildRestaurants() override;\n    //\
  \ 创建房间\n    virtual void BuildRooms() override;\n    // 返回住宿\n    virtual ALodging\
  \ GetLodging() override;\n};\n```\n\n`HotelLodgingBuilder.cpp`\n```cpp\n#include\
  \ \"HotelLodgingBuilder.h\"\n#include \"Lodging.h\"\n\n// 设置默认值\nAHotelLodgingBuilder::AHotelLodgingBuilder()\n\
  {\n}\n\n// 当游戏开始或生成时被调用\nvoid AHotelLodgingBuilder::BeginPlay()\n{\n    Super::BeginPlay();\n\
  \    // 生成住宿\n    Lodging = GetWorld()->SpawnActor<ALodging>(ALodging::StaticClass());\n\
  \    // 将其附加到构建器（自己）\n    Lodging->AttachToActor(this, FAttachmentTransformRules::KeepRelative);\n\
  }\n\n// 每帧调用\nvoid AHotelLodgingBuilder::Tick(float DeltaTime)\n{\n    Super::Tick(DeltaTime);\n\
  }\n\nvoid AHotelLodgingBuilder::BuildSwimmingPool()\n{\n    if (!Lodging)\n    {\n\
  \        UE_LOG(LogTemp, Error, TEXT(\"BuildSwimmingPool(): Lodging 为空，确保它已初始化。\n\
  \        return;\n    }\n    // 设置住宿的游泳池\n    Lodging->SetSwimmingPool(\"Indoor\
  \ Lagoon\");\n}\n\nvoid AHotelLodgingBuilder::BuildLobbyArea()\n{\n    if (!Lodging)\n\
  \    {\n        UE_LOG(LogTemp, Error, TEXT(\"BuildLobbyArea(): Lodging 为空，确保它已初始化。\n\
  \        return;\n    }\n    // 设置住宿的大堂区域\n    Lodging->SetLobbyArea(\"Grand Hall\"\
  );\n}\n\nvoid AHotelLodgingBuilder::BuildRestaurants()\n{\n    if (!Lodging)\n \
  \   {\n        UE_LOG(LogTemp, Error, TEXT(\"BuildRestaurants(): Lodging 为空，确保它已初始化。\n\
  \        return;\n    }\n    // 设置住宿的餐厅\n    Lodging->SetRestaurants(\"5 star Buffet\"\
  );\n}\n\nvoid AHotelLodgingBuilder::BuildRooms()\n{\n    if (!Lodging)\n    {\n\
  \        UE_LOG(LogTemp, Error, TEXT(\"BuildRooms(): Lodging 为空，确保它已初始化。\n     \
  \   return;\n    }\n    // 设置住宿的房间\n    Lodging->SetRooms(\"Luxury Suites\");\n\
  }\n\nALodging* AHotelLodgingBuilder::GetLodging()\n{\n    // 返回构建器的住宿 Actor（自己）\n\
  \    return Lodging;\n}\n```\n\n现在我们需要一个建筑工程师来协调住宿的逐步构建。\n\n***ArchitecturalEngineer.h***\n\
  \n\n\n\n` 标签内容。我根据你提供的逻辑，对 `ArchitecturalEngineer` 相关的代码和描述（以及其中的变量/函数/类名）进行了规范化排版。\n\
  \n以下是排版后的结果：\n\n[content]\n```cpp\n#include \"CoreMinimal.h\"\n#include \"GameFramework/Actor.h\"\
