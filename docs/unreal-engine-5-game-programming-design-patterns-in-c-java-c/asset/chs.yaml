  \ \n\n# 让雨落下来……状态模式\n\nGoF（设计模式 Go）将状态模式描述为允许对象在其内部状态改变时改变其行为（Gamma 等人，1995）。\n\n\
  ## 优点\n\n> ● 将特定状态的行为局部化（Gamma 等人，1995）。\n\n## 不够好的之处\n\n> ● 与策略模式相当相似\n\n## 状态模式实现\n\
  \n我们将实现一个老式的老虎机。正如我们所知，老虎机可以处于几种状态。这些状态分别是：未插入硬币、已插入硬币、无金额、赢得金额。`State_Main` 类：\n\
  \n```cpp\n#pragma once\n#include \"CoreMinimal.h\"\n#include \"GameFramework/Actor.h\"\
  \n#include \"State_Main.generated.h\"\n\nUCLASS()\nclass AState_Main : public AActor\n\
  {\n    GENERATED_BODY()\n\npublic:\n    AState_Main();\n\nprotected:\n    virtual\
  \ void BeginPlay() override;\n\npublic:\n    virtual void Tick(float DeltaTime)\
  \ override;\n};\n```\n\n```cpp\n#include \"State_Main.h\"\n#include \"OldSchoolMachine.h\"\
  \n\n// 设置默认值\nAState_Main::AState_Main()\n{\n    // 设置此 Actor 每一帧调用 Tick()。如果不需要，可以关闭此项以提高性能。\n\
  \    PrimaryActorTick.bCanEverTick = true;\n}\n\n// 当游戏开始或被生成时调用\nvoid AState_Main::BeginPlay()\n\
  {\n    Super::BeginPlay();\n    // 创建老虎机并将其金额设置为 100\n    OldSchoolMachine* OldSchoolMachine\
  \ = GetWorld()->SpawnActor<AOldSchoolMachine>();\n    // 输出当前状态\n    GEngine->AddOnScreenDebugMessage(-1,\
  \ 15.f, FColor::Yellow, FString::Printf(TEXT(\"It is %s, so FreakyAllen makes a\
  \ bowl of cereal\"), OldSchoolMachine->GetState()));\n    // 插入硬币并拉下摇杆\n    OldSchoolMachine->InsertCoin();\n\
  \    GEngine->AddOnScreenDebugMessage(-1, 15.f, FColor::Yellow, FString::Printf(TEXT(\"\
  It is %s, so FreakyAllen's right eye starts to twitch\"), OldSchoolMachine->GetState()));\n\
