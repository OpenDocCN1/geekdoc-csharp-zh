  \n> 你击沉了我的战舰…… 策略模式 (Java)\n\n## 策略模式 UML 图\n\n![图表描述自动生成](img/Image00283.jpg)\n\
  \n## 策略模式实现\n\n我们有一套应对海上不同敌人的策略。如果威胁很小，则使用暴力策略。如果有很多敌人，我们使用分而治之策略。如果认为战斗是徒劳，则执行撤退策略。`Strategy_Main`\
  \ 类：\n\n```java\npublic class Strategy_Main {\n    public static void main(String[]\
  \ args) {\n        System.out.println(\"A tiny frigate wants some trouble\");\n\
  \        BattleShip battleShip = new BattleShip(new BruteForceStrategy());\n   \
  \     battleShip.engage();\n        System.out.println(\"Four tiny frigates want\
  \ some trouble\");\n        battleShip.alterManeuvers(new DivideConquerStrategy());\n\
  \        battleShip.engage();\n        System.out.println(\"An aircraft carrier\
  \ group wants some trouble\");\n        battleShip.alterManeuvers(new RetreatStrategy());\n\
  \        battleShip.engage();\n    }\n}\n```\n\n`Strategy_Main` 蓝图事件图：\n\n![计算机截图描述，具有低置信度](img/Image00168.jpg)\n\
  \n`Create BruteForceStrategy` 折叠图：\n\n![图形用户界面，应用程序描述自动生成](img/Image00169.jpg)\n\
  \n`BattleShip` 折叠图：\n\n![图形用户界面，应用程序描述自动生成](img/Image00170.jpg)\n\n`Execute Brute\
  \ Strategy` 折叠图：\n\n![视频游戏截图描述自动生成](img/Image00171.jpg)\n\n`Execute Divide Conquer\
  \ Strategy` 折叠图：\n\n![视频游戏截图描述自动生成](img/Image00172.jpg)\n\n`Execute Retreat Strategy`\
  \ 折叠图：\n\n![视频游戏截图描述自动生成](img/Image00173.jpg)\n\n`BattleShip` 类：\n\n```java\npublic\
  \ class BattleShip {\n    BattleShipStrategy battleStrategy;\n    public BattleShip(BattleShipStrategy\
  \ battleStrategy) {\n        this.battleStrategy = battleStrategy;\n    }\n    public\
  \ void alterManeuvers(BattleShipStrategy battleStrategy) {\n        this.battleStrategy\
  \ = battleStrategy;\n    }\n    public void engage() {\n        battleStrategy.maneuver();\n\
  \    }\n}\n```\n\n`BattleShip` 构建脚本：\n\n![图形用户界面描述自动生成](img/Image00284.jpg)\n\n\
  `alterManeuvers` 蓝图函数：\n\n![图形用户界面描述自动生成](img/Image00175.jpg)\n\n与 `BattleShip`\
  \ 构建相同，区别在于在函数内部手动设置 `battleStrategy` 变量，因为它没有在生成时暴露。\n\n`engage` 蓝图函数：\n\n![图形用户界面描述自动生成](img/Image00285.jpg)\n\
  \n`BattleShipStrategy` 接口：\n\n```java\npublic interface BattleShipStrategy {\n \
  \   void maneuver();\n}\n```\n\n`BruteForceStrategy` 类：\n\n```java\npublic class\
  \ BruteForceStrategy implements BattleShipStrategy {\n    @Override\n    public\
