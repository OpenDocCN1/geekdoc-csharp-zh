  \ generated with low confidence](img/Image00064.jpg)\n\n### `SlingShot` 接口：\n\n\
  ```csharp\npublic interface SlingShot {\n    void sling();\n}\n```\n\n### `GunAdapter`\
  \ 类：\n\n```csharp\npublic class GunAdapter : SlingShot {\n    private Gun weapon;\n\
  \    public GunAdapter() {\n        weapon = new Gun();\n    }\n    public void\
  \ sling() {\n        weapon.fire();\n    }\n}\n```\n\n### `GunAdapter` 蓝图：\n\n![Graphical\
  \ user interface, application Description automatically generated](img/Image00217.jpg)\n\
  \n### `Gun` 类：\n\n```csharp\nusing System;\npublic class Gun {\n    public void\
