  \ \n\n让我们来实现我们怪胎们共同共享的 `Morph` 接口：\n\n```java\npublic interface Morph {\n    public\
  \ void morph();\n}\n```\n\n`FreakyAllen` 类：\n\n```java\npublic class FreakyAllen\
  \ implements Subscriber, Morph {\n    private String time;\n    private Publisher\
  \ clockTower;\n    public FreakyAllen(Publisher clockTower) {\n        this.clockTower\
  \ = clockTower;\n        clockTower.subscribe(this);\n    }\n    public void update(String\
  \ time) {\n        this.time = time;\n        morph();\n    }\n    public void morph()\
  \ {\n        if (time.equals(\"Morning\")) {\n            System.out.println(\"\
  It is \" + time + \", so FreakyAllen makes a bowl of cereal\");\n        } else\
  \ if (time.equals(\"Midday\")) {\n            System.out.println(\"It is: \" + time\
  \ + \", so FreakyAllen's right eye starts to twitch\");\n        } else if (time.equals(\"\
  Evening\")) {\n            System.out.println(\"It is: \" + time + \", so FreakyAllen\
  \ morphs into a blood sucking wogglesnort\");\n        }\n    }\n}\n```\n\n`FreakyAllen`\
