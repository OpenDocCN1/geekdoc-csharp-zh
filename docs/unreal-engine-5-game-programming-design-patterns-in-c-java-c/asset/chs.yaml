  \ `Subscriber` 接口：\n\n```java\npublic interface Subscriber {\n    public void update(String\
  \ time);\n}\n```\n\n让我们实现 `Publisher` 接口：\n\n```java\npublic interface Publisher\
  \ {\n    public void subscribe(Subscriber s);\n    public void unsubscribe(Subscriber\
  \ s);\n    public void notifySubscribers();\n}\n```\n\n\n\n\n`ClockTower` 类：\n\n\
  ```java\nimport java.util.ArrayList;\npublic class ClockTower implements Publisher\
  \ {\n    private ArrayList<Subscriber> subscribers;\n    private String time;\n\
  \    public ClockTower() {\n        subscribers = new ArrayList<Subscriber>();\n\
  \    }\n    public void subscribe(Subscriber s) {\n        subscribers.add(s);\n\
  \    }\n    public void unsubscribe(Subscriber s) {\n        int i = subscribers.indexOf(s);\n\
  \        if (i >= 0) {\n            subscribers.remove(i);\n        }\n    }\n \
  \   public void notifySubscribers() {\n        for (Subscriber subscriber : subscribers)\
  \ {\n            subscriber.update(time);\n        }\n    }\n    public void timeChanged()\
  \ {\n        notifySubscribers();\n    }\n    public void setTimeOfDay(String time)\
  \ {\n        this.time = time;\n        timeChanged();\n    }\n    public String\
  \ getTime() {\n        return time;\n    }\n}\n```\n\n`ClockTower` 蓝图事件图：\n\n![图形用户界面，应用描述自动生成](img/Image00245.jpg)\
