  \n### 抽象类 `StarShipCrewMember`：\n\n#### `StarShipCrewMember.h`\n```cpp\n#pragma\
  \ once\n#include \"CoreMinimal.h\"\n#include \"GameFramework/Actor.h\"\n#include\
  \ \"StarShipCrewMember.generated.h\"\nUCLASS()\nclass DESIGN_PATTERNS_API AStarShipCrewMember\
  \ : public AActor\n{\n    GENERATED_BODY()\npublic:\n    // 设置此 属性的默认值\n    AStarShipCrewMember();\n\
  protected:\n    // 当游戏开始或生成时调用\n    virtual void BeginPlay() override;\nprivate:\n\
  \    // 执行传递的任务\n    void Task(const FString& Task);\npublic:\n    // 执行 熄灯任务\n\
  \    void TurnLightsOut();\n    // 执行 起立三号任务\n    void HeaveOutTriceUp();\n    //\
  \ 执行 准假假任务\n    void LibertyCall();\n    // 执行 集合点任务\n    void CrewMuster();\n \
  \   // 执行传递的任务列表\n    void Task(const TArray<FString>& Tasks);\n    // 执行船员职责。它是纯虚函数，在此类中不需要实现\n\
  \    virtual void Duty() PURE_VIRTUAL(AStarShipCrewMember::Duty, );\n    // 返回船员头衔。它是纯虚函数，在此类中不需要实现\n\
  \    virtual FString CrewTitle() PURE_VIRTUAL(AStarShipCrewMember::CrewTitle, return\
  \ \"\"; );\n};\n```\n\n`StarShipCrewMember.cpp`\n\n\n\n\n\n```cpp\n#include \"StarShipCrewMember.h\"\
  \nAStarShipCrewMember::AStarShipCrewMember() {}\n\nvoid AStarShipCrewMember::BeginPlay()\
  \ {\n    Super::BeginPlay();\n}\n\nvoid AStarShipCrewMember::TurnLightsOut() {\n\
  \    // 打印熄灯字符串\n    GEngine->AddOnScreenDebugMessage(-1, 15.f, FColor::Yellow,\
  \ FString::Printf(TEXT(\"%s taps,t lights out.\"), CrewTitle()));\n}\n\nvoid AStarShipCrewMember::HeaveOutTriceUp()\
  \ {\n    // 打印收缆字符串\n    GEngine->AddOnScreenDebugMessage(-1, 15.f, FColor::Yellow,\
  \ FString::Printf(TEXT(\"%s all hands heave out and trice up.\"), CrewTitle()));\n\
  }\n\nvoid AStarShipCrewMember::LibertyCall() {\n    // 打印休假集合字符串\n    GEngine->AddOnScreenDebugMessage(-1,\
  \ 15.f, FColor::Yellow, FString::Printf(TEXT(\"%s liberty call, liberty call.\"\
  ), CrewTitle()));\n}\n\nvoid AStarShipCrewMember::CrewMuster() {\n    // 打印集合字符串\n\
  \    GEngine->AddOnScreenDebugMessage(-1, 15.f, FColor::Yellow, FString::Printf(TEXT(\"\
  %s time for muster.\"), CrewTitle()));\n}\n\nvoid AStarShipCrewMember::Task(const\
  \ TArray<FString>& Tasks) {\n    // 遍历 Tasks 数组并为每个任务调用 Task() 函数\n    for (const\
  \ FString& myTask : Tasks) {\n        Task(myTask);\n    }\n}\n\nvoid AStarShipCrewMember::Task(const\
  \ FString& Task) {\n    // 检查执行哪个任务\n    if (Task.Equals(\"lights_out\")) {\n  \
  \      TurnLightsOut();\n    } else if (Task.Equals(\"trice_up\")) {\n        HeaveOutTriceUp();\n\
  \    } else if (Task.Equals(\"liberty_call\")) {\n        LibertyCall();\n    }\
  \ else if (Task.Equals(\"muster\")) {\n        CrewMuster();\n    } else if (Task.Equals(\"\
  duty\")) {\n        Duty();\n    } else {\n        // 如果传递的 Task 不存在\n        GEngine->AddOnScreenDebugMessage(-1,\
  \ 15.f, FColor::Red, TEXT(\"Undefined task\"));\n    }\n}\n```\n\n`Turn Lights Out`\
