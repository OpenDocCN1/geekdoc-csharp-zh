- '# 通过 Unity 创建游戏学习 C# 编程（初学者）：学习 C# 编程并享受其中



  # 1 安装 Unity 并熟悉界面


  ## 什么是游戏引擎以及你应该使用它吗？

  游戏引擎是开发者用于创建视频游戏的软件框架。它提供了渲染、物理模拟、动画、脚本和声音管理等各种工具。使用游戏引擎可以让开发者专注于游戏内容的机制，而不是从零构建底层技术。


  ### 使用 Unity 的优势

  Unity 是世界上流行的游戏引擎之一。它是一个跨平台引擎，这意味着你可以创建一次游戏并部署到包括 Windows、Mac、Linux、iOS、Android
  和主机在内的多个平台。Unity 还拥有庞大的活跃社区，因此有很多教程、资源可用。


  ### 下载 Unity Hub

  Unity 是用于组织 Unity 项目和安装版本的工具。你可以从 Unity 官网下载它。


  ### 安装 Unity

  一旦安装了 Unity Hub，你就可以安装不同版本的 Unity Editor。建议安装最新的 LTS（长期支持）版本。


  ### 启动 Unity

  安装 Unity Editor 后，你可以从 Unity Hub 启动它并创建一个新项目。


  ### 理解并熟悉界面

  Unity 界面由几个主窗口组成：

  - **场景视图 (Scene view)**：你在 3D 或 2D 空间中查看和排列游戏对象的地方。

  - **层级视图 (Hierarchy view)**：列出当前场景中的所有对象。

  - **项目视图 (Project view)**：显示所有资源，例如脚本、模型和纹理。

  - **检查器 (Inspector)**：修改所选对象属性的地方。

  - **控制台视图 (Console view)**：显示错误、警告和消息。

  - **资源商店窗口 (Asset Store window)**：你可以为游戏购买或下载资源的地方。


  ### 场景视图 (Scene view)

  场景视图是你构建游戏关卡的地方。


  ### 发现和导航场景

  你可以使用鼠标平移、旋转和缩放来导航场景视图。


  ### 层级视图 (Hierarchy view)

  层级视图显示场景中的每一个对象。


  ### 项目视图 (Project view)

  项目视图显示与项目相关的所有文件。你可以将它们组织成文件夹。


  ### 检查器 (Inspector)

  当层级级选中一个对象时，检查器会显示其属性。你可以更改这些值来影响对象。


  ### 控制台视图 (Console view)

  控制台是 Unity 显示错误和警告的地方。它对调试代码至关重要。


  ### 资源商店窗口 (Asset Store window)

  资源商店允许你为游戏查找并下载现成的资源。


  关卡总结 (Level roundup)

  总结了关于 Unity 界面的学习内容。


  # 2 C# 编程简介


  ## 引言

  C# (C Sharp) 是由微软开发的一种现代面向对象的编程语言。它是 Unity 开发的主要语言。C# 功能强大、类型安全，拥有丰富的内置函数库。


  ## 语句 (Statements)

  语句是程序中的执行单元。在 C# 中，大多数语句以分号 (`;`) 结尾。


  ## 注释 (Comments)

  注释用于解释代码并被编译器忽略。

  - 单行注释以 `//` 开头。

  - 多行注释包含在 `/* ... */`。


  ## 变量 (Variables)

  变量是存储数据的容器。你必须声明变量类型。

  - `int` 用于整数。

  - `string` 用于文本。

  - `bool` 用于真假。

  - `float` 用于小数。


  ## 数组 (Arrays)

  数组是相同类型元素的集合。你使用从 0 开始的索引访问元素。


  ## 常量 (Constants)

  常量一旦设置设置无法更改的变量。使用 `const` 关键字。


  ## 运算符 (Operators)

  运算符用于对变量进行操作。

  - 算术：`+`, `-`, `*`, `/`, `%`

  - 比较：`==`, `!=`, `<`, `>`, `>=`, `<=`

  - 逻辑：`&&`, `||`, `!`


  ## 条件语句 (Conditional statements)

  `if` 语句允许代码根据条件做出判断。


  ## Switch 语句 (Switch Statements)

  `switch` 语句帮助根据值执行多个代码块之一。


  ## 循环 (Loops)

  循环允许你重复一段代码。

  - `while` 循环在条件为真时重复。

  - `for` 循环按指定的次数重复。

  - `do-while` 循环至少运行一次。


