    \ return numbers.Contains(number);\n    }\n}\n```\n\nIn this example, `ImmutableHashSet<int>`\
    \ ensures thread safety by returning a new immutable set when adding or modifying\
    \ elements.\n\n3. **Concurrent Collections**: .NET provides concurrent collection\
    \ types in the `System.Collections.Concurrent` namespace, such as `ConcurrentDictionary`,\
    \ `ConcurrentQueue`, and `ConcurrentBag`, which are designed for thread-safe operations\
