    \ `(int a, int b)`的方法。我们将 `calc.Add` 和 `calc.Subtract` 方法赋值给委托并动态调用它们。\n\n## C#\
    \ 中的事件 (Events):\n\n事件基于委托构建，实现了观察者模式，其中一个对象（事件源）可以向多个订阅者（事件处理程序）通知特定的情况或更改。事件为处理通知和解耦组件提供了一种结构化的方法。\n\
    \n## 示例 2：实现事件\n\n```csharp\npublic class StockMarket\n{\n    public event EventHandler<StockChangedEventArgs>\
    \ StockChanged;\n\n    public void UpdateStockPrice(string stockSymbol, decimal\
    \ newPrice)\n    {\n        // 更新价格逻辑...\n        // 通知订阅者股票价格变化\n        OnStockChanged(new\
    \ StockChangedEventArgs(stockSymbol, newPrice));\n    }\n\n    protected virtual\
    \ void OnStockChanged(StockChangedEventArgs e)\n    {\n        StockChanged?.Invoke(this,\
    \ e);\n    }\n}\n\npublic class StockChangedEventArgs : EventArgs\n{\n    public\
    \ string StockSymbol { get; }\n    public decimal NewPrice { get; }\n    public\
