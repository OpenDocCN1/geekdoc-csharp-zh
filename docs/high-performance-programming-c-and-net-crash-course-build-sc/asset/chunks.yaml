    Chapter 5


    Advanced C# Features for Performance


    Utilizing Properties, Indexers, and Custom Getters/Setters Effectively


    Utilizing properties, indexers, and custom getters/setters effectively is crucial
    for creating encapsulated, maintainable, and high-performance C# code. These language
    features provide a way to encapsulate data access, validate input, and implement
    custom logic while adhering to object-oriented principles. In this guide, we will
    explore how to use properties, indexers, and custom getters/setters effectively,
    along with code examples and insights from high-performance programming in C#.


    Properties in C#:


    Properties provide a mechanism to encapsulate fields within a class and control
    access to them. They allow for read-only, write-only, or read-write access to
    class members while providing the flexibility to add logic within getter and setter
    methods.


    Example 1: Basic Property


    ```csharp


    public class Person


    {


    private string _name;


    public string Name


    {


    get { return _name; }


    set { _name = value; }


    }


    }


    ```


    In this example, the `Name` property encapsulates the `_name` field, allowing
    external code to get and set the name of a person instance.


    Example 2: Property with Validation


    ```csharp


    public class Circle


    {


    private double _radius;


    public double Radius


    {


    get { return _radius; }


    set


    {


    if (value <= 0)


    throw new ArgumentException("Radius must be greater than zero.");


    _radius = value;


    }


    }


    }


    ```


    The `Radius` property includes validation logic in the setter to ensure that the
    radius value is greater than zero, demonstrating how properties can enforce business
    rules.


    Indexers in C#:


    Indexers allow instances of a class or struct to be indexed just like arrays,
    enabling custom indexing behavior for accessing elements. They are especially
    useful when dealing with collections or complex data structures.


    Example 3: Indexer Implementation


    ```csharp


    public class Library


    {


    private string[] _books = new string[10];


    public string this[int index]


    {


    get


    {


    if (index < 0 || index >= _books.Length)


    throw new IndexOutOfRangeException("Invalid index.");


    return _books[index];


    }


    set


    {


    if (index < 0 || index >= _books.Length)


    throw new IndexOutOfRangeException("Invalid index.");


    _books[index] = value;


    }


    }


    }


    ```


    In this example, `Library` defines an indexer to access books at specific indexes
    within the `_books` array. Indexers provide a more intuitive way to interact with
    custom collections or data structures.


    Custom Getters/Setters:


    Custom getters and setters allow developers to add additional logic, validation,
    or transformation to property accesses. They enable fine-grained control over
    how data is read or modified.


    Example 4: Custom Getter and Setter


    ```csharp


    public class Temperature


    {


    private double _celsius;


    public double Celsius


    {


    get { return _celsius; }


    set { _celsius = value; }


    }


    public double Fahrenheit


    {


    get { return _celsius * 9 / 5 + 32; }


    set { _celsius = (value - 32) * 5 / 9; }


    }


    }


    ```


    In this example, `Temperature` provides properties for Celsius and Fahrenheit
    temperatures. The `Fahrenheit` property''s setter converts Fahrenheit to Celsius
    internally.


    Effective Usage and Best Practices:


    1\. Encapsulation and Information Hiding: Use properties to encapsulate fields
    and hide implementation details. This promotes modularity and reduces coupling
    between classes.


    2\. Validation and Error Handling: Utilize custom getters/setters or property
    validation logic to enforce data integrity and handle invalid inputs gracefully.


    3\. Efficient Property Implementation:


    ● Avoid complex calculations or heavy processing in property getters/setters,
    as they can impact performance. Keep them simple and efficient.


    ● Use auto-implemented properties (`public int Age { get; set; }`) for straightforward
    properties without custom logic.


    4\. Indexers for Custom Collections: If your class represents a collection or
    supports indexing behavior, consider implementing indexers for a more natural
    and intuitive interface.


    5\. Property Naming and Conventions: Follow naming conventions (e.g., PascalCase
    for properties) and use meaningful names to improve code readability and maintainability.


    6\. Consider Performance Implications: While properties and indexers provide abstraction
    and convenience, excessive use or misuse can impact performance. Profile and optimize
    critical sections if needed.


    High-Performance Considerations:


    ● Avoid Excessive Property Chaining: Chaining multiple property accesses or method
    calls can lead to performance overhead, especially in tight loops or critical
    sections. Minimize unnecessary property accesses.


    ● Immutable Types and Readonly Properties: Consider using immutable types or readonly
    properties for values that should not change frequently, reducing the need for
    setter logic and ensuring thread safety.


    ● Memory Management: Be mindful of memory allocations and deallocations, especially
    within property accesses or custom getters/setters. Avoid unnecessary memory churn.


    ● Concurrency and Thread Safety: Ensure thread safety if properties or indexers
    are accessed concurrently by multiple threads. Use synchronization mechanisms
    like locks or concurrent collections when necessary.


    By effectively utilizing properties, indexers, and custom getters/setters, developers
    can create cleaner, more maintainable, and high-performance C# code. These language
    features provide a powerful way to encapsulate data, enforce business rules, and
    interact with objects in a controlled manner, contributing to overall code quality
    and performance optimization.


    Leveraging C# Delegates and Events for Efficient Communication


    Leveraging C# delegates and events is crucial for efficient communication and
    decoupling components in C# and .NET applications. Delegates provide a way to
    define and reference methods dynamically, while events enable the implementation
    of the observer pattern for handling notifications and asynchronous communication.
    This guide will explore how to effectively use delegates and events for efficient
    communication, along with code examples and insights from high-performance programming
    in C#.


    Delegates in C#:


    A delegate is a kind of object that symbolizes a connection to a method having
    a particular signature. It allows methods to be passed as parameters or stored
    as variables, providing a powerful mechanism for callback functionality and decoupling
    components.


