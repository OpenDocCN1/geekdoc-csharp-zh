    \ C# 应用程序。内存优化对于实现高性能编程目标和交付高效的软件解决方案至关重要。\n\n# 第 5 章：用于性能的高级 C# 特性\n\n## 有效利用属性、索引器和自定义\
    \ Getter/Setter\n\n有效利用属性、索引器和自定义 Getter/Setter 对于创建封装良好、可维护且高性能的 C# 代码至关重要。这些语言特性提供了一种封装数据访问、验证输入以及实现自定义逻辑的方法，同时遵循了面向对象编程的原则。在本指南中，我们将探索如何有效使用属性、索引器和自定义\
    \ Getter/Setter，并结合代码示例和 C# 高性能编程的见解。\n\n### C# 中的属性 (Properties)：\n\n属性提供了一种封装类内部字段并控制其访问的机制。它们允许对类成员进行只读、只写或读写访问，同时提供了在\
    \ getter 和 setter 方法中添加逻辑的灵活性。\n\n#### 示例 1：基础属性\n\n```csharp\npublic class Person\n\
    {\n    private string _name;\n    public string Name\n    {\n        get { return\
    \ _name; }\n        set { _name = value; }\n    }\n}\n```\n\n在此示例中，`Name` 属性封装了\
    \ `_name` 字段，允许外部代码获取和设置人员实例的名称。\n\n#### 示例 2：带有验证的属性\n\n```csharp\npublic class\
    \ Circle\n{\n    private double _radius;\n    public double Radius\n    {\n  \
    \      get { return _radius; }\n        set\n        {\n            if (value\
    \ <= 0)\n                throw new ArgumentException(\"半径必须大于零.\");\n        \
    \    _radius = value;\n        }\n    }\n}\n```\n\n`Radius` 属性在 setter 中包含了验证逻辑，以确保半径值大于零，这演示了属性如何强制业务规则。\n\
    \n### C# 中的索引器 (Indexers)：\n\n索引器允许类或结构体的实例像数组一样被索引，从而实现访问元素时的自定义索引行为。它们在处理集合或复杂数据结构时特别有用。\n\
    \n#### 示例 3：索引器的实现\n\n```csharp\npublic class Library\n{\n    private string[]\
    \ _books = new string[10];\n    public string this[int index]\n    {\n       \
    \ get\n        {\n            if (index < 0 || index >= _books.Length)\n     \
    \           throw new IndexOutOfRangeException(\"索引无效.\");\n            return\
    \ _books[index];\n        }\n        set\n        {\n            if (index < 0\
    \ || index >= _books.Length)\n                throw new IndexOutOfRangeException(\"\
    索引无效.\");\n            _books[index] = value;\n        }\n    }\n}\n```\n\n在此示例中，`Library`\
    \ 定义了一个索引器，用于通过特定索引访问 `_books` 数组中的书籍。索引器提供了一种更直观的方式与自定义集合或数据结构交互。\n\n### 自定义\
    \ Getter/Setter：\n\n自定义的 getter 和 setter 允许开发者在属性访问时添加额外的逻辑、验证或转换。它们能够对数据的如何读取或修改进行精粒度的控制。\n\
    \n#### 示例 4：自定义 Getter 和 Setter\n\n```csharp\npublic class Temperature\n{\n  \
    \  private double _celsius;\n    public double Celsius\n    {\n        get { return\
    \ _celsius; }\n        set { _celsius = value; }\n    }\n    public double Fahrenheit\n\
    \    {\n        get { return _celsius * 9 / 5 + 32; }\n        set { _celsius\
    \ = (value - 32) * 5 / 9; }\n    }\n}\n```\n\n在此示例中，`Temperature` 为摄氏温度和华氏温度提供了属性。`Fahrenheit`\
    \ 属性的 setter 在内部将华氏度转换为摄氏度。\n\n### 有效使用与最佳实践：\n\n1. **封装与信息隐藏**：使用属性封装字段并隐藏实现细节。这促进了模块化并减少了类与类之间的耦合。\n\
    2. **验证与错误处理**：利用自定义 getter/setter 或属性验证逻辑来强制数据完整性并优雅地处理无效输入。\n3. **高效的属性实现**：\n\
    \   - 避免在属性 getter/setter 中进行复杂的计算或重负载处理，因为它们会影响性能。保持其简单且高效。\n   - 使用自动实现属性（auto-implemented\
    \ properties）处理无逻辑的属性。\n4. **集合的索引器**：如果类代表一个集合或支持索引行为，考虑实现索引器以提供更自然的方式。\n5. **属性命名规范**：遵循命名规范（例如属性使用\
    \ PascalCase），并使用有意义的名称提高代码可读性。\n6. **考虑性能影响**：虽然属性和索引器提供了抽象和便利，但过度使用或使用不当会影响性能。必要时应对关键部分进行分析和优化。\n\
    \n"
