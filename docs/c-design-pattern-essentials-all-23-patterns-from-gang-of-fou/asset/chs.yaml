  public partial class BuildEngineForm : Form\n{\n    public BuildEngineForm()\n \
  \   {\n        InitializeComponent();\n    }\n    private void BuildEngineForm_Load(object\
  \ sender, EventArgs e)\n    {\n        // 加载引擎类型组合框\n        object[] engineTypes\
  \ = BusinessFacade.Instance.EngineTypes;\n        foreach (object obj in engineTypes)\n\
