  \        }\n    }\n}\n```\n\n这只剩下 `FinishedSetupState` 类，它不需要转换到不同的状态：\n\n```csharp\n\
  public class FinishedSetupState : ClockSetupState\n{\n    private ClockSetup clockSetup;\n\
  \    public FinishedSetupState(ClockSetup clockSetup)\n    {\n        this.clockSetup\
