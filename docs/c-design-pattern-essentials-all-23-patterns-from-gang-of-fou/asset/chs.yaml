  \    {\n        get\n        {\n            return \"Please set the day...\";\n\
  \        }\n    }\n    public virtual int SelectedValue\n    {\n        get\n  \
  \      {\n            return day;\n        }\n    }\n}\n\nclass HourSetupState :\
  \ ClockSetup\n{\n    private ClockSetup clockSetup;\n    private int hour;\n   \
  \ public HourSetupState(ClockSetup clockSetup)\n    {\n        this.clockSetup =\
  \ clockSetup;\n        hour = DateTime.Now.Hour;\n    }\n    public virtual void\
  \ PreviousValue()\n    {\n        if (hour > 0)\n        {\n            hour--;\n\
  \        }\n    }\n    public virtual void NextValue()\n    {\n        if (hour\
  \ < 23)\n        {\n            hour++;\n        }\n    }\n}\n```\n\n\n\n\n\n```csharp\n\
  \    public virtual void SelectValue()\n    {\n        Console.WriteLine(\"Hour\
  \ set to \" + hour);\n        clockSetup.State = clockSetup.MinuteSetupState;\n\
  \    }\n    public virtual string Instructions\n    {\n        get\n        {\n\
  \            return \"Please set the hour...\";\n        }\n    }\n    public virtual\
  \ int SelectedValue\n    {\n        get\n        {\n            return hour;\n \
  \       }\n    }\n}\npublic class MinuteSetupState : ClockSetupState\n{\n    private\
  \ ClockSetup clockSetup;\n    private int minute;\n    public MinuteSetupState(ClockSetup\
  \ clockSetup)\n    {\n        this.clockSetup = clockSetup;\n        minute = DateTime.Now.Minute;\n\
  \    }\n    public virtual void PreviousValue()\n    {\n        if (minute > 0)\n\
