  \    {\n        if (minute < 59)\n        {\n            minute++;\n        }\n\
  \    }\n    public virtual void SelectValue()\n    {\n        Console.WriteLine(\"\
  Minute set to \" + minute);\n        clockSetup.State = clockSetup.FinishedSetupState;\n\
  \    }\n    public virtual string Instructions\n    {\n        get\n        {\n\
