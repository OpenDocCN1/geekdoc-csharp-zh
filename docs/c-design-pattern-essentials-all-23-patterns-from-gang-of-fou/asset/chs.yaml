  \    }\n    public virtual void RotateKnobRight()\n    {\n        currentState.NextValue();\n\
  \    }\n    public virtual void PushKnob()\n    {\n        currentState.SelectValue();\n\
  \    }\n    public virtual IClockSetupState YearSetup\n    {\n        get\n    \
  \    {\n            return yearState;\n        }\n    }\n    public virtual IClockSetupState\
  \ MonthSetup\n    {\n        get\n        {\n            return monthState;\n  \
  \      }\n    }\n    public virtual IClockSetupState DaySetup\n    {\n        get\n\
  \        {\n            return dayState;\n        }\n    }\n    public virtual IClockSetupState\
  \ HourSetup\n    {\n        get\n        {\n            return hourState;\n    \
  \    }\n    }\n    public virtual IClockSetupState MinuteSetup\n    {\n        get\n\
  \        {\n            return minuteState;\n        }\n    }\n    public virtual\
  \ IClockSetupState FinishedSetupState\n    {\n        get\n        {\n         \
  \   return finishedState;\n        }\n    }\n    public virtual DateTime SelectedDate\n\
  \    {\n        get\n        {\n            return new DateTime(yearState.SelectedValue,\
  \ monthState.SelectedValue, dayState.SelectedValue, hourState.SelectedValue, minuteState.SelectedValue,\
  \ 0);\n        }\n    }\n}\n```\n\n我们可以像这样模拟用户的示例操作：\n\n```csharp\nClockSetup clockSetup\
  \ = new ClockSetup();\n// 设置从 'year' 状态开始\nclockSetup.RotateKnobRight();\nclockSetup.PushKnob();\
  \ // 增加 1 年\n// 设置现在应该处于 'month' 状态\nclockSetup.RotateKnobRight();\nclockSetup.RotateKnobRight();\n\
  clockSetup.PushKnob(); // 增加 2 个月\n// 设置现在应该处于 'day' 状态\nclockSetup.RotateKnobRight();\n\
  clockSetup.RotateKnobRight();\nclockSetup.RotateKnobRight();\nclockSetup.PushKnob();\
  \ // 增加 3 天\n// 设置现在应该处于 'hour' 状态\nclockSetup.RotateKnobLeft();\nclockSetup.RotateKnobLeft();\n\
  clockSetup.PushKnob(); // 减少 2 小时\n// 设置现在应该处于 'minute' 状态\nclockSetup.RotateKnobRight();\n\
  clockSetup.PushKnob(); // 增加 1 分钟\n// 设置现在应该处于 'finished' 状态\nclockSetup.PushKnob();\
  \ // 显示选定的日期\n```\n\n\n\n\n有两个实现类：`StandardGearboxStrategy` 和 `SportGearboxStrategy`：\n\
  \n```csharp\npublic class StandardGearboxStrategy : IGearboxStrategy\n{\n    public\
  \ virtual void EnsureCorrectGear(IEngine engine, int speed)\n    {\n        int\
  \ engineSize = engine.Size;\n        bool turbo = engine.Turbo;\n        // 一些复杂的代码来确定正确的齿位\n\
  \        // 根据 engineSize, turbo & speed 等进行设置\n        // ... 省略 ...\n        Console.WriteLine(\"\
  Working out correct gear at \" + speed + \"mph for a STANDARD gearbox\");\n    }\n\
  }\n\npublic class SportGearboxStrategy : IGearboxStrategy\n{\n    public virtual\
  \ void EnsureCorrectGear(IEngine engine, int speed)\n    {\n        int engineSize\
  \ = engine.Size;\n        bool turbo = engine.Turbo;\n        // 一些复杂的代码来确定正确的齿位\n\
  \        // 根据 engineSize, turbo & speed 等进行设置\n        // ... 省略 ...\n        Console.WriteLine(\"\
  Working out correct gear at \" + speed + \"mph for a SPORT gearbox\");\n    }\n\
  }\n```\n\n我们的 `AbstractCar` 类被定义为持有对接口类型的引用（即 `IGearboxStrategy`），并提供访问器方法以便切换不同的策略。还有一个\
  \ `Speed` 属性设置器，它会将操作委托给当前生效的策略。相关代码已用**粗**标记：\n\n```csharp\npublic abstract class\
  \ AbstractCar : AbstractVehicle\n{\n    private IGearboxStrategy gearboxStrategy;\n\
  \    public AbstractCar(IEngine engine)\n        : this(engine, VehicleColour.Unpainted)\n\
  \    {\n    }\n    public AbstractCar(IEngine engine, VehicleColour colour)\n  \
  \      : base(engine, colour)\n    {\n        // 以标准齿箱模式开始（更省油）\n        gearboxStrategy\
  \ = new StandardGearboxStrategy();\n    }\n    // 允许更改齿箱策略...\n    public virtual\
  \ IGearboxStrategy IGearboxStrategy\n    {\n        set\n        {\n           \
  \ gearboxStrategy = value;\n        }\n        get\n        {\n            return\
  \ gearboxStrategy;\n        }\n    }\n    public virtual int Speed\n    {\n    \
  \    set\n        {\n            // 委托给当前生效的策略...\n            gearboxStrategy.EnsureCorrectGear(Engine,\
  \ value);\n        }\n    }\n}\n```\n\n客户端程序只需要设置所需的策略：\n\n```csharp\nAbstractCar\
  \ myCar = new Sport(new StandardEngine(2000));\nmyCar.Speed = 20;\nmyCar.Speed =\
  \ 40;\nConsole.WriteLine(\"Switching on mode gearbox...\");\nmyCar.IGearboxStrategy\
  \ = new SportGearboxStrategy();myCar.Speed = 20;\nmyCar.Speed = 40;\n```\n\n这应该产生以下输出：\n\
  ```\nWorking out correct gear at 20mph for a STANDARD gearbox\nWorking out correct\
  \ gear at 40mph for a STANDARD gearbox\nSwitching on mode gearbox...\nWorking out\
  \ correct gear at 20mph for a SPORT gearbox\nWorking out correct gear at 40mph for\
  \ a SPORT gearbox\n```\n\n### 23. 模板方法 (Template Method)\n\n类型：行为型 (Behavioural)\n\
  \n目的：在方法中定义算法的骨架，并将某些步骤延迟给子类。模板方法允许子类在不改变算法结构的情况下重新定义算法的某些步骤。\n\nFoobar 公司制造的每辆车辆都需要制作少量的小手册并提供给买家，例如《所有手册》和《保养记录》。手册的制作遵循相同的步骤\
  \ set，但每种类型的手册可能需要以不同的方式执行每个步骤。\n\n模板方法模式允许定义一个或多个抽象方法，这些方法通过“模板方法”进行调用。简单的层级结构如下：images/0007.jpg\n\
  \n#### 图 23.1：模板方法模式\n\n`AbstractletPrinter` 类定义了几个 `protected` 方法和一个使用这些抽象方法的 `public`\
  \ “模板方法”：\n\n```csharp\npublic abstract class AbstractPrinter\n{\n    protected\
  \ abstract int PageCount { get; }\n    protected abstract void PrintFrontCover();\n\
  \    protected abstract void PrintOfContents();\n    protected abstract void PrintPage(int\
  \ pageNumber);\n    protected abstract void PrintIndex();\n    protected abstract\
  \ void PrintBackCover();\n    // 这是模板方法\n    public void Print()\n    {\n      \
  \  PrintFrontCover();\n        PrintOfContents();\n        for (int i = 1; i <=\
  \ PageCount; i++)\n        {\n            PrintPage(i);\n        }\n        PrintIndex();\n\
  \        PrintBackCover();\n    }\n}\n```\n\n每个具体子类现在都需要为抽象方法提供实现，例如下面的 `SaloonBooklet`\
  \ 类：\n\n```csharp\npublic class SaloonBooklet : AbstractPrinter\n{\n    protected\
  \ override int PageCount\n    {\n        get\n        {\n            return 100;\n\
  \        }\n    }\n    protected override void PrintFrontCover()\n    {\n      \
  \  Console.WriteLine(\"Printing front cover for Saloon booklet\");\n    }\n    protected\
  \ override void PrintOfContents()\n    {\n        Console.WriteLine(\"Printing table\
  \ of contents for Saloon booklet\");\n    }\n    protected override void PrintPage(int\
  \ pageNumber)\n    {\n        Console.WriteLine(\"Printing page \" + pageNumber\
  \ + \" for Saloon booklet\");\n    }\n    protected override void PrintIndex()\n\
  \    {\n        Console.WriteLine(\"Printing index for Saloon booklet\");\n    }\n\
  \    protected override void PrintBackCover()\n    {\n        Console.WriteLine(\"\
  Printing back cover for Saloon booklet\");\n    }\n}\n```\n\n`ServiceHistoryBooklet`\
  \ 非常相似：\n\n```csharp\npublic class ServiceHistoryBooklet : AbstractPrinter\n{\n\
  \    protected override int PageCount\n    {\n        get\n        {\n         \
  \   return 12;\n        }\n    }\n    protected override void PrintFrontCover()\n\
  \    {\n        Console.WriteLine(\"Printing front cover for service history booklet\"\
  );\n    }\n    protected override void PrintOfContents()\n    {\n        Console.WriteLine(\"\
  Printing table of contents for service history booklet\");\n    }\n    protected\
  \ override void PrintPage(int pageNumber)\n    {\n        Console.WriteLine(\"Printing\
  \ page \" + pageNumber + \" for service history booklet\");\n    }\n    protected\
  \ override void PrintIndex()\n    {\n        Console.WriteLine(\"Printing index\
  \ for service history booklet\");\n    }\n    protected override void PrintBackCover()\n\
  \    {\n        Console.WriteLine(\"Printing back cover for service history booklet\"\
  );\n    }\n}\n```\n\n虽然从模式的角度来看，抽象方法必须是 `protected` 并不是必需的，但通常这是分配最合适的访问级别，因为它们仅用于被重写，而不是供客户端对象直接调用。\n\
  \n此外注意，从“模板方法”中调用的某些方法不是抽象的但提供了默认实现是完全可以的。但当至少有一个抽象方法被调用时，它就符合模板模式的定义。\n\n客户端程序只需要实例化所需的具体类并调用\
  \ `Print()` 方法：\n\n```csharp\nConsole.WriteLine(\"About to print a booklet for Saloon\
  \ cars\");\nAbstractPrinter saloonBooklet = new SaloonBooklet();\nsaloonBooklet.Print();\n\
  \nConsole.WriteLine(\"About to print a service history booklet\");\nAbstractPrinter\
  \ serviceBooklet = new ServiceHistoryBooklet();\nserviceBooklet.Print();\n\nConsole.Read();\n\
  ```\n\n### 24. 访问者 (Visitor)\n\n类型：行为型 (Behavioural)\n\n\n\n\n#### 目的\n表示在对象结构元素上执行的方法。访问者模式（Visitor）允许你在不更改操作的元素类的情况下定义一个新方法。\n\
  \n有时，类层次结构及其代码会变得非常庞大，但我们知道未来的需求是不可避免的。Foobar 汽车公司的一个例子是 `IEngine` 层次结构，如下所示：\n\n\
  ![](img/00037.jpg)\n\n图 24.1：`IEngine` 类层次结构\n\n实际上，`AbstractEngine` 类中的代码可能由许多单独组件组成，例如\
  \ `camshaft`（凸轮）、`piston`（活塞）、一些 `sparkplugs`（火花塞）等。如果我们需要添加遍历这些组件的功能，自然的方法是直接向\
  \ `AbstractEngine` 添加一个方法。但也许我们知道将来会有许多此类新需求，而我们并不希望直接向层次结构中不断添加方法？\n\n访问者模式允许我们只向类层次结构中添加一个额外的方法，用以便在不进行任何进一步更改的情况下添加许多不同类型的新功能。这是通过一种被称为“双分派发”（double-dispatch）的技术实现的，其中被调的方法向调用者对象发布一个回调。\n\
  \n该技术首先需要定义一个接口，我们称之为 `IEngineVisitor`：\n\n```csharp\npublic interface IEngineVisitor\n\
  {\n    void Visit(Camshaft camshaft);\n    void Visit(IEngine engine);\n    void\
  \ Visit(Piston piston);\n    void Visit(SparkPlug sparkPlug);\n}\n```\n\n我们还会定义一个名为\
  \ `IVisitable` 的接口，包含一个 `AcceptEngineVisitor()` 方法：\n\n```csharp\npublic interface\
  \ IVisitable\n{\n    void AcceptEngineVisitor(IEngineVisitor visitor);\n}\n```\n\
  \n你在之前的章节中已经过的 `IEngine` 接口（尽管我们在本章中对其进行了轻微修改）。`Camshaft`、`Piston` 和 `SparkPlug`\
  \ 类都非常简单，如下：\n\n```csharp\npublic class Camshaft : IVisitable\n{\n    public void\
  \ AcceptEngineVisitor(IEngineVisitor visitor)\n    {\n        visitor.Visit(this);\n\
  \    }\n}\n\npublic class Piston : IVisitable\n{\n    public void AcceptEngineVisitor(IEngineVisitor\
  \ visitor)\n    {\n        visitor.Visit(this);\n    }\n}\n\npublic class SparkPlug\
  \ : IVisitable\n{\n    public void AcceptEngineVisitor(IEngineVisitor visitor)\n\
  \    {\n        visitor.Visit(this);\n    }\n}\n```\n\n如你所见，这些类都定义了一个名为 `AcceptEngineVisitor()`\
  \ 的方法，它接收一个 `IEngineVisitor` 对象作为参数。该方法所做的调用传入的 `IEngineVisitor` 的 `Visit()` 方法，并传回对象实例。\n\
  \n我们修改后的 `IEngine` 接口现在扩展了 `IVisitable`：\n\n```csharp\npublic interface IEngine\
  \ : IVisitable\n{\n    int Size { get; }\n    int Turbo { get; }\n}\n```\n\n因此，`AbstractEngine`\
  \ 类需要实现这个新方法，在这种情况下，该方法遍历各个组件（凸轮、活塞、火花塞），并在每个组件上调用 `AcceptEngineVisitor()`：\n\n\
  ```csharp\npublic abstract class AbstractEngine : IEngine\n{\n    private int size;\n\
  \    private bool turbo;\n    private Camshaft camshaft;\n    private Piston piston;\n\
  \    private SparkPlug[] sparkPlugs;\n    public AbstractEngine(int size, bool turbo)\n\
  \    {\n        this.size = size;\n        this.turbo = turbo;\n        // 创建凸轮、活塞和\
  \ 4 个火花塞...\n        camshaft = new Camshaft();\n        piston = new Piston();\n\
  \        sparkPlugs = new SparkPlug[]{new SparkPlug(), new SparkPlug(), new SparkPlug(),\
  \ new SparkPlug()};\n    }\n    public virtual int Size\n    {\n        get\n  \
  \      {\n            return size;\n        }\n    }\n    public virtual bool Turbo\n\
  \    {\n        get\n        {\n            return turbo;\n        }\n    }\n  \
  \  public virtual void AcceptEngineVisitor(IEngineVisitor visitor)\n    {\n    \
  \    // 访问每个组件...\n        camshaft.AcceptEngineVisitor(visitor);\n        piston.AcceptEngineVisitor(visitor);\n\
  \        foreach (SparkPlug eachPlug in sparkPlugs)\n        {\n            eachPlug.AcceptEngineVisitor(visitor);\n\
  \        }\n        // 现在访问接收者...\n        visitor.Visit(this);\n    }\n    public\
  \ override string ToString()\n    {\n        return this.GetType().Name + \" (\"\
  \ + size + \")\";\n    }\n}\n```\n\n现在我们将创建一个 `IEngineVisitor` 的实际实现，这样你就可以看到如何轻松地为引擎添加功能，而无需对任何引擎类进行任何进一步更改。我们要做的第一件事是定义一些附加到引擎上的智能装置，它可以自动检查每个组件并诊断任何故障。因此，我们定义了\
  \ `EngineDiagnostics` 类：\n\n```csharp\npublic class EngineDiagnostics : IEngineVisitor\n\
  {\n    public virtual void Visit(Camshaft camshaft)\n    {\n        Console.WriteLine(\"\
  正在诊断凸轮\");\n    }\n    public virtual void Visit(IEngine engine)\n    {\n      \
  \  Console.WriteLine(\"正在诊断引擎\");\n    }\n    public virtual void Visit(Piston piston)\n\
  \    {\n        Console.WriteLine(\"正在诊断活塞\");\n    }\n    public virtual void Visit(SparkPlug\
  \ sparkPlug)\n    {\n        Console.WriteLine(\"正在诊断单个火花塞\");\n    }\n}\n```\n\n\
  我们还想打印引擎中每种类型组件的数量，因此我们还有一个 `EngineInventory` 类：\n\n```csharp\npublic class EngineInventory\
  \ : IEngineVisitor\n{\n    private int camshaftCount;\n    private int pistonCount;\n\
  \    private int sparkPlugCount;\n    public EngineInventory()\n    {\n        camshaftCount\
  \ = 0;\n        pistonCount = 0;\n        sparkPlugCount = 0;\n    }\n    public\
  \ virtual void Visit(Camshaft camshaft)\n    {\n        camshaftCount++;\n    }\n\
  \    public virtual void Visit(IEngine engine)\n    {\n        Console.WriteLine(\"\
  引擎有: \" + camshaftCount +\" 凸轮(s), \" + pistonCount + \" 活塞(s), 和 \" + sparkPlugCount\
  \ + \" 火花塞(s)\");\n    }\n    public virtual void Visit(Piston piston)\n    {\n\
  \        pistonCount++;\n    }\n    public virtual void Visit(SparkPlug sparkPlug)\n\
  \    {\n        sparkPlugCount++;\n    }\n}\n```\n\n下面的图总结了所有这些类是如何交互的：\n\n![](img/00009.jpg)\n\
  \n图 24.2：访问者模式\n\n客户端程序现在需要在 `IEngine` 实例上调用 `AcceptEngineVisitor()` 方法，传入适当的 `IEngineVisitor`\
  \ 对象：\n\n```csharp\n// 创建一个引擎...\nIEngine engine = new StandardEngine(1300);\n\n\
  // 对引擎运行诊断...\nengine.AcceptEngineVisitor(new EngineDiagnostics());\n```\n\n上述操作将产生以下输出：\n\
  \n`正在诊断凸轮`\n`正在诊断活塞`\n`正在诊断单个火花塞`\n`正在诊断单个火花塞`\n`正在诊断单个火花塞`\n`正在诊断单个火花塞`\n`正在诊断引擎`\n\
  \n并获取库存（使用相同的 `IEngine` 实例）：\n\n```csharp\n// 对引擎运行清单...\nengine.AcceptEngineVisitor(new\
  \ EngineInventory());\n```\n\n输出应显示：\n\n`引擎有: 1 凸轮(s), 1 活塞(s), 和 4 火花塞(s)`\n\n\
  # 第五部分 其他实用的模式\n\n本部分介绍了四种你在实际应用中可能会发现非常有用的模式：\n\n- **空对象（Null Object）**：定义一个允许处理空值的类；\n\
  - **简单工厂（Simple Factory）**：委托对象的实例化；\n- **模型-视图-控制器（Model View Controller）**：将用户界面组件的屏幕表示与其底层数据和功能分离；\n\
  - **分层（Layers）**：将应用程序划分为不同的模块级，并按层次级进行通信。\n\n25. 空对象\n\n\n\n\n\n正如任何 C# 程序员很快发现的，软件测试经常会抛出\
  \ `NullReferenceException` 消息。有时，解决此问题的方法是在执行操作之前专门针对 `null` 进行测试，这给程序员增加了额外的负担。\n\
  \n假设一个车辆的仪表盘包含三个警告灯槽位（例如用于机油低位或刹车液低位）。某辆特定的车辆可能只使用其中两盏灯，而第三个槽位为空，在 C# 中用 `null`\
  \ 表示。遍历这些槽位需要特定的测试以防止抛出 `NullReferenceException`：\n\n```csharp\n// OilLevelLight\
  \ & BrakeFluidLight are each types of IWarningLight\nIWarningLight[] lights = new\
  \ IWarningLight[3];\nlights[0] = new OilLevelLight();\nlights[1] = new BrakeFluidLight();\n\
  lights[2] = null; // empty slot\n\nforeach (IWarningLight currentLight in lights)\n\
  {\n    if (currentLight != null)\n    {\n        currentLight.TurnOn();\n      \
  \  currentLight.TurnOff();\n        Console.WriteLine(currentLight.On);\n    }\n\
  }\n```\n\n一种可以帮助避免对 `null` 测试的方法是在类层次结构中创建一个“空对象”（null object）类。该类将实现相同的接口，但不执行任何实际功能，如图所示：\n\
  \n![](img/00011.jpg)\n图 25.1 : 空对象模式\n\n`IWarningLight` 接口定义了方法 `TurnOn()`、`TurnOff()`\
  \ 以及属性 `On` 的 get 访问器：\n\n```csharp\npublic interface IWarningLight\n{\n    void\
  \ TurnOn();\n    void TurnOff();\n    bool On { get; }\n}\n```\n\n`OilLevelLevel`\
  \ 和 `BrakeFluidLevel` 类分别实现 `IWarningLight` 接口，并提供用于开启或关闭指示灯的适当代码：\n\n```csharp\n\
  public class OilLevelLight : IWarningLight\n{\n    private bool on;\n    public\
  \ virtual void TurnOn()\n    {\n        on = true;\n        Console.WriteLine(\"\
  Oil level light ON\");\n    }\n    public virtual void TurnOff()\n    {\n      \
  \  on = false;\n        Console.WriteLine(\"Oil level light OFF\");\n    }\n   \
  \ public virtual bool On\n    {\n        get\n        {\n            return on;\n\
  \        }\n    }\n}\n\npublic class BrakeFluidLight : IWarningLight\n{\n    private\
  \ bool on;\n    public virtual void TurnOn()\n    {\n        on = true;\n      \
  \  Console.WriteLine(\"Brake fluid light ON\");\n    }\n    public virtual void\
  \ TurnOff()\n    {\n        on = false;\n        Console.WriteLine(\"Brake fluid\
  \ light OFF\");\n    }\n    public virtual bool On\n    {\n        get\n       \
  \ {\n            return on;\n        }\n    }\n}\n```\n\n对于空对象模式，我们还创建了一个 `NullObjectLight`\
  \ 类，它实现了 `IWarningLight` 接口但不执行任何实际处理：\n\n```csharp\npublic class NullObjectLight\
  \ : IWarningLight\n{\n    public virtual void TurnOn()\n    {\n        // Do nothing...\n\
  \    }\n    public virtual void TurnOff()\n    {\n        // Do nothing...\n   \
  \ }\n    public virtual bool On\n    {\n        get\n        {\n            return\
  \ false;\n        }\n    }\n}\n```\n\n现在我们的客户端代码可以被简化了，因为只要我们使用空对象，就不需要测试槽位是否为 `null`：\n\
  \n```csharp\nIWarningLight[] lights = new IWarningLight[3];\nlights[0] = new OilLevelLight();\n\
  lights[1] = new BrakeFluidLight();\nlights[2] = new NullObjectLight(); // empty\
  \ slot\n\n// No need to test for null\nforeach (IWarningLight currentLight in lights)\n\
  {\n    currentLight.TurnOn();\n    currentLight.TurnOff();\n    Console.WriteLine(currentLight.On);\n\
  }\n```\n\n注意，对于空 getter 方法，需要返回任何看似合理的值；因此上述 `On` 属性 getget 访问器返回 `false`，因为它代表一个非扩展状态。\n\
  \n## 简单工厂\n\n在本书的主体部分，我们查看了工厂方法模式（Factory Method）和抽象工厂模式（Abstract Factory）。简单工厂模式是将对象的实例化委托给特定类（即“工厂”）的常用手段。我们在此处假设\
  \ Foobar 公司生产两种类型的变速箱：自动变速箱和手动变速箱。客户端程序可能需要根据条件创建其中一种，如下代码所示（假设类定义在一个类内部）：\n\n```csharp\n\
  Gearbox selectedGearbox = null;\nif (typeWanted.Equals(\"automatic\"))\n{\n    selectedGearbox\
  \ = new AutomaticGearbox();\n}\nelse if (typeWanted.Equals(\"manual\"))\n{\n   \
  \ selectedGearbox = new ManualGearbox();\n}\n// Do something with selectedGearbox...\n\
  ```\n\n虽然上面的代码可以工作，但如果有多个客户端程序需要执行类似的选择会怎样？我们必须在每个客户端程序中重复 `if...else...` 语句，如果随后生产了新类型的变速箱，我们必须追踪每一个使用该\
  \ `if...else...` 块的地方。\n\n记住封装变化概念的原则，相反我们可以将选择和实例化过程委托给专门为此目的创建的特定类（即“工厂”）。然后客户端程序程序使用工厂的\
  \ `Create()` 方法，如下图所示：\n\n![](img/00012.jpg)\n图 26.1 : 简单工厂模式\n\n简单示例中的抽象类 `Gearbox`\
  \ 定义了一个无参数构造函数：\n\n```csharp\npublic abstract class Gearbox\n{\n}\n```\n\n`AutomaticGearbox`\
  \ 和 `ManualGearbox` 类分别扩展了 `Gearbox` 以实现各自类型：\n\n```csharp\npublic class AutomaticGearbox\
  \ : Gearbox\n{\n    public AutomaticGearbox()\n    {\n        Console.WriteLine(\"\
  New automatic gearbox created\");\n    }\n}\n\npublic class ManualGearbox : Gearbox\n\
  {\n    public ManualGearbox()\n    {\n        Console.WriteLine(\"New manual gearbox\
  \ created\");\n    }\n}\n```\n\n现在我们需要创建一个 `GearboxFactory` 类，它能够实例化相应的 `Gearbox`：\n\
  \n```csharp\npublic class GearboxFactory\n{\n    public enum Type\n    {\n     \
  \   Automatic, Manual\n    }\n    public static Gearbox Create(Type type)\n    {\n\
  \        if (type == Type.Automatic)\n        {\n            return new AutomaticGearbox();\n\
  \        }\n        else\n        {\n            return new ManualGearbox();\n \
  \       }\n    }\n}\n```\n\n`Create()` 方法负责选择和实例化，从而隔离了每个客户端程序的重复代码。我们将该方法设置为 `static`\
  \ 纯是为了方便，并不是该模式的要求。\n\n客户端程序现在通过工厂获取变速箱类型：\n\n```csharp\n// Create an automatic\
  \ gearbox\nGearbox auto = GearboxFactory.Create(GearboxFactory.Type.Automatic);\n\
  \n// Create a manual gearbox\nGearbox manual = GearboxFactory.Create(GearboxFactory.Type.Manual);\n\
  ```\n\n## 模型视图控制器 (Model View Controller)\n\nFoobar 汽车公司的卫星导航系统包含了当前位置的视觉显示、行驶方向以及当前速度的指示。还有一个输入设备；用于设置目的地等。一个完整的仿真远出了本书的范围，因此我们将使用一个非常简化的界面，仅允许您设置行驶方向（北、南、西、东）和当前速度，而不考虑任何道路等。\n\
  \n用户界面看起来如下：\n\n![](img/00029.jpg)\n图 27.1 : 卫星导航用户界面\n\n\n\n\n如你所见，上方有改变方向的按钮和一个用于调整速度的旋转器。屏幕底部的“反馈（Feedback）”部分会根据你的选择自动调整。请注意，每当你点击其中一个方向按钮时，该按钮就会被禁用，而之前选中的按钮将重新启用。程序初始时指向北方向，但速度为零。\n\
  \n这是一个非常简单的程序，完全可以在单个类中完成编码。但随着图形应用程序变得越来越复杂，分离程序的各个部分将极大地简化开发和维护。\n\n# 模型-视图-控制器模式\
  \ (Model View Controller Pattern)\n\n模型-视图-控制器模式（通常缩写 `MVC`）是实现组成部分之间更松耦合的方法，也是图形应用程序中一种经过验证的方法。在\
  \ GUI 应用程序中通常有三个部分在起：\n\n1.  **“模型”（Model）**：这是“数据”（即状态）以及相关的应用程序或“业务”逻辑。在我们的示例中，它包含了当前方向和当前速度的值，以及更新和返回这些值的方法。\n\
  2.  **“视图”（View）**：这是图形化显示，如图 27.1 所示，当模型以某种方式改变状态时，它会自动根据需要更新自己。\n3.  **“控制器”（Controller）**：这部分响应所有用户输入（按钮点击、控制旋转器等），并与模型和视图建立联系。\n\
  \n上述三个部分中的每一个都将位于一个独立的类中，可以可视化如下：\n\n![](img/00014.jpg)\n\n图 27.2：模型-视图-控制器模式\n\n\
  这些类以以下方式相互关联：\n\n*   `SatNavModel` 包含设置和获取方向与速度的方法。它是“可观察的”（参见第 20 章），每当方向或速度发生变化时，它都会通知感兴趣的观察者，但它对任何其他类都没有直接了解；\n\
  *   `SatNavView` 定义了图形形状和用户界面显示。它持有对 `SatNavModel` 的引用，以便它可以监听模型的状态变化，并根据需要查询其状态，以保持显示自动更新；\n\
  *   `SatNavController` 持有对 `SatNavModel` 和 `SatNavView` 的引用。它处理按钮点击和速度旋转器的移动，更新模型并在需要时与视图建立联系。\n\
  \n正如书中描述的其他模式一样，`MVC` 的结构方式存在多种变体，上述方法可以描述为“经典”方法。C# 通常使用 `MVC` 的一种修改版本，其中视图和控制器合并并在单个类中，但为了本书的目的，我们将使用完整的三类分离法来介绍这种模式。\n\
  \n## 模型：SatNavModel\n\n我们将从模型开始，在我们的案例中，模型是 `SatNavModel` 类。该类被编码为对视图或控制器都不进行直接了解，因此可以在不进行任何更改的情况下，将其插入到各种其他应用程序中。\n\
  \n```cs\npublic class SatNavModel\n{\n    // 我们可以移动的方向\n    public enum TravelDirection\n\
  \    {\n        Still, North, South, East, West\n    }\n    // 改变处理器\n    public\
  \ event EventHandler ModelChanged;\n    // 当前方向和速度\n    private TravelDirection\
  \ CurrentDirection;\n    private int CurrentSpeed;\n    public SatNavModel()\n \
  \   {\n        CurrentDirection = TravelDirection.North;\n        CurrentSpeed =\
  \ 0;\n    }\n    public virtual TravelDirection Direction\n    {\n        set\n\
  \        {\n            if (value != CurrentDirection)\n            {\n        \
  \        CurrentDirection = value;\n                if (ModelChanged != null)\n\
  \                {\n                    ModelChanged(this, EventArgs.Empty);\n \
  \               }\n            }\n        }\n        get\n        {\n          \
  \  return CurrentDirection;\n        }\n    }\n    public virtual int Speed\n  \
  \  {\n        set\n        {\n            if (value != CurrentSpeed)\n         \
  \   {\n                CurrentSpeed = value;\n                if (ModelChanged !=\
  \ null)\n                {\n                    ModelChanged(this, EventArgs.Empty);\n\
  \                }\n            }\n        }\n        get\n        {\n         \
  \   return CurrentSpeed;\n        }\n    }\n}\n```\n\n如你所见，与其他类的唯一联系是通过其观察者实现的（我们使用\
  \ `EventHandler` 事件对象来方便这一点）。每当方向或速度被修改时，其观察者（也称为监听器）就会收到通知。\n\n图形显示是由 `SatNavView`\
  \ 类使用标准组件完成的。它在构造函数中获取 `SatNavModel` 的引用，以便将其注册为模型的观察者。每当检测到模型变化时，就会调用 `HandleModelChanged()`\
  \ 方法，使视图更新其显示。还有其他方法允许 UI 控件被观察（例如，通过控制器）。\n\n```cs\npublic partial class SatNavView\
  \ : Form\n{\n    private SatNavModel model;\n    public event EventHandler ViewControlActivated;\n\
  \    public SatNavView(SatNavModel model)\n    {\n        InitializeComponent();\n\
  \        this.model = model;\n        this.model.ModelChanged += HandleModelChanged;\n\
  \    }\n    private void SatNavView_Load(object sender, EventArgs e)\n    {\n  \
  \      northButton.Enabled = false;\n        feedbackLabel.Text = \"你正指向 \" + model.Direction\
  \ + \" 但尚未移动。请使用按钮和速度控制\";\n    }\n    public void HandleModelChanged(Object sender,\
  \ EventArgs args)\n    {\n        feedbackLabel.Text = \"方向: \" + model.Direction\
  \ + \", 速度: \" + model.Speed;\n    }\n    private void eastButton_Click(object sender,\
  \ EventArgs e)\n    {\n        if (ViewControlActivated != null)\n        {\n  \
  \          ControlEventArgs args = new ControlEventArgs();\n            args.direction\
  \ = SatNavModel.TravelDirection.East;\n            ViewControlActivated(this, args);\n\
  \        }\n    }\n    private void northButton_Click(object sender, EventArgs e)\n\
  \    {\n        if (ViewControlActivated != null)\n        {\n            ControlEventArgs\
  \ args = new ControlEventArgs();\n            args.direction = SatNavModel.TravelDirection.North;\n\
  \            ViewControlActivated(this, args);\n        }\n    }\n    private void\
  \ southButton_Click(object sender, EventArgs e)\n    {\n        if (ViewControlActivated\
  \ != null)\n        {\n            ControlEventArgs args = new ControlEventArgs();\n\
  \            args.direction = SatNavModel.TravelDirection.South;\n            ViewControlActivated(this,\
  \ args);\n        }\n    }\n    private void westButton_Click(object sender, EventArgs\
  \ e)\n    {\n        if (ViewControlActivated != null)\n        {\n            ControlEventArgs\
  \ args = new ControlEventArgs();\n            args.direction = SatNavModel.TravelDirection.West;\n\
  \            ViewControlActivated(this, args);\n        }\n    }\n    private void\
  \ speedControl_ValueChanged(object sender, EventArgs e)\n    {\n        if (ViewControlActivated\
  \ != null)\n        {\n            ControlEventArgs args = new ControlEventArgs();\n\
  \            args.speed = (int)speedControl.Value;\n            ViewControlActivated(this,\
  \ args);\n        }\n    }\n    internal void enableAllowedButtons()\n    {\n  \
  \      // 所有方向按钮\n        eastButton.Enabled = true;\n        northButton.Enabled\
  \ = true;\n        southButton.Enabled = true;\n        westButton.Enabled = true;\n\
  \        // 禁用当前方向按钮\n        if (model.Direction == SatNavModel.TravelDirection.East)\n\
  \        {\n            eastButton.Enabled = false;\n        }\n    }\n}\n```\n\n\
  \n\n\n```csharp\nelse if (model.Direction == SatNavModel.TravelDirection.North)\n\
  {\n    northButton.Enabled = false;\n}\nelse if (model.Direction == SatNavModel.TravelDirection.South)\n\
  {\n    southButton.Enabled = false;\n}\nelse if (model.Direction == SatNavModel.TravelDirection.West)\n\
  {\n    westButton.Enabled = false;\n}\n\n} // 用于改变方向或速度的嵌套类\npublic class ControlEventArgs\
  \ : EventArgs\n{\n    public SatNavModel.TravelDirection direction;\n    public\
  \ int speed;\n}\n```\n\n`SatNavController` 类负责处理用户输入，在这种情况下，用户输入可以是点击方向按钮之一，也可以移动速度调节旋器。为了响应用户输入，需要更新\
  \ Model 状态，因此在构造函数中同时存在对 `SatNavView` 和 `SatNavModel` 的引用。该类设置自己来监听用户输入并做出相应的反应：\n\
  \n```csharp\npublic class SatNavController\n{\n    // 需要同时对 model 和 view 的引用\n \
  \   private SatNavModel model;\n    private SatNavView view;\n    public SatNavController(SatNavModel\
  \ model, SatNavView view)\n    {\n        this.model = model;\n        this.view\
  \ = view;\n        this.view.ViewControlActivated += HandleViewControlActivated;\n\
  \    }\n    public void HandleViewControlActivated(Object sender, EventArgs args)\n\
  \    {\n        SatNavView.ControlEventArgs satnavArgs = (SatNavView.ControlEventArgs)args;\n\
  \        if (satnavArgs.direction != SatNavModel.TravelDirection.Still)\n      \
  \  {\n            model.Direction = satnavArgs.direction;\n            view.enableAllowedButtons();\n\
  \        }\n        else\n        {\n            model.Speed = satnavArgs.speed;\n\
  \        }\n    }\n}\n```\n\n现在运行该应用程序只需从 `Program.cs` 实例化上述类：\n\n```csharp\n//\
  \ 创建 MVC 类\nSatNavModel model = new SatNavModel();\nSatNavView view = new SatNavView(model);\n\
  SatNavController controller = new SatNavController(model, view);\nApplication.Run(view)\n\
  ```\n\n### 28. 层 (Layers)\n\n随着应用程序变得越来越大，它们的管理可能会变得困难，大量的互连会导致耦合性增加。层（Layers）模式通过将应用程序划分为层次结构中的两个或多个层来解决这个问题，每层只与其直接下方的层进行通信。这种方法有助于应用程序模块化，并有助于降低类之间的耦合性。\n\
  \n#### 客户端-服务器（2 级）架构\n\n层模式的一个简单示例是客户端-服务器模型，其中“客户端”（例如 Web 浏览器）与“服务器”（例如 Web 服务器）通信以查看网页：\n\
  \n![](img/00002.jpg)\n\n图 28.1：客户端-服务器架构\n\n在图 28.1 中，你可以看到浏览器向 Web 服务器发送请求，服务器返回一个响应（例如网页）。如果你想象客户端和服务器分别位于自己的命名空间中，上述内容将如下所示：\n\
  \n![](img/00016.jpg)\n\n图 28.2：客户端-服务器架构\n\n从图 28.2 中可以推断出 `client` 命名空间持有对 `server`\
  \ 命名空间的引用。`layer`（层）和 `tier`（级）这两个术通常互换使用，但“layer”更准确地指代逻辑划分，而“tier”指代物理划分。\n\n\
  #### 3 级架构\n\n客户端-服务器架构的一个常见扩展是需要访问数据的情况，因此添加了第三层：\n\n![](img/00003.jpg)\n\n图 28.3：3\
  \ 级架构\n\n图 28.3 显示了浏览器向服务器发送请求，服务器转而向数据库发送请求。如下所示：\n\n![](img/00018.jpg)\n\n图 28.4：3\
  \ 级架构\n\n从图 28.4 中你可以看到 `client` 命名空间持有对 `server` 命名空间的引用，服务器转与 `database` 通信。这种方法有助于隐藏每一层的复杂性。\n\
  \n## VI. 实践中的设计模式\n\n这部分由一个章节组成，展示了一个演示书中描述的某些模式的小型应用程序。所示的模式有：\n\n*   层 (Layers)\n\
  *   单例 (Singleton)\n*   外观模式 (Faade)\n*   工厂 (Factory)\n*   观察者 (Observer)\n*  \
  \ 策略 (Strategy)\n\n### 29. 示例 3 级应用程序\n\n本章开发了一个小型示例 3 级应用程序，该程序使用了常用的设计模式。该应用程序显示了从\
  \ Foobar 公司生产线产下的引擎列表（这意味着列表可能会多次显示相同的引擎类型和尺寸），并提供了构建新引擎以及将数据保存/恢复到持久化存储器中的功能。请注意，这并非设计用于生产级软件；为了关注模式，代码已经经过了简化。\n\
  \n完成后的应用程序如下：\n\n![](img/00020.jpg)\n\n图 29.1：引擎管理表单\n\n每当点击 Build Engine（构建引擎）按钮时，都会出现对话框，允许你创建一个所选类型和尺寸的新引擎并将其添加到列表中：\n\
  \n![](img/00022.jpg)\n\n图 29.2：构建引擎对话框\n\nSave（保存）按钮将列表数据存储到磁盘上的文件中，Restore（恢复）按钮将把列表数据替换为最近保存的值。\n\
  \n该应用程序将使用 3 级架构设计，采用层模式，包括用户界面层、业务模型层和数据库层。每层的类将存储在 `Business` 和 `Database` 命名空间中，根命名空间用于用户界面。每层只与其下一层的层进行通信，如下所示：\n\
  \n![](img/00024.jpg)\n\n图 29.3：作为命名空间的 3 级层模式\n\n#### 数据库层\n\n从 `Database` 命名空间开始，我们将一个对象称为\
  \ `Entity`。由于数据库表通常具有主键，我们将使用单例模式定义 `EntityKeyGenerator` 类：\n\n```csharp\nnamespace\
  \ Database\n{\n    [Serializable]\n    class EntityKeyGenerator\n    {\n       \
  \ // 静态成员\n        private static volatile EntityKeyGenerator instance;\n      \
  \  public static EntityKeyGenerator Instance\n    }\n}\n```\n\n\n\n\n\n```csharp\n\
  {\n    get\n    {\n        if (instance == null)\n        {\n            instance\
  \ = new EntityKeyGenerator();\n        }\n        return instance;\n    }\n}\n//\
  \ 实例变量\nprivate int nextKey;\n// 私有构造函数\nprivate EntityKeyGenerator()\n{\n}\n//\
  \ 实例方法\nvirtual int NextKey\n{\n    return ++nextKey;\n}\n``````\n\n#### EntityKeyGenerator\
  \ 和 EntityTable\n\n为任何 `IEngine` 实体生成下一个唯一键，只需要调用：\n\n`EntityKeyGenerator.Instance.NextKey;`\n\
  \n我们现在将定义一个简单的 `EntityTable` 类，它可以存储一个以顺序数字 ID 为键的对象字典：\n\n```csharp\nnamespace\
  \ Database\n{\n    [Serializable]\n    public class EntityTable\n    {\n       \
  \ private EntityKeyGenerator keyGenerator;\n        private IDictionary<int?, object>\
  \ entities;\n        [field:NonSerialized] public event EventHandler EntityTableItemAdded;\n\
  \        [field:NonSerialized] public event EventHandler EntityTableRestored;\n\
  \        internal EntityTable(EntityKeyGenerator keyGenerator)\n        {\n    \
  \        this.keyGenerator = keyGenerator;\n            entities = new Dictionary<int?,\
  \ object>();\n        }\n        internal virtual object GetByKey(int? key)\n  \
  \      {\n            return entities[key];\n        }\n        internal virtual\
  \ ICollection<object> All()\n        {\n            return entities.Values;\n  \
  \      }\n        internal virtual int? AddEntity(object value)\n        {\n   \
  \         int? key = keyGenerator.NextKey;\n            entities[key] = value;\n\
  \            EntityAddedEventArgs args = new EntityAddedEventArgs();\n         \
  \   args.objectAdded = value;\n            if (EntityTableItemAdded != null)\n \
  \           {\n                EntityTableItemAdded(this, args);\n            }\n\
  \            return key;\n        }\n        internal virtual void Restore(EntityTable\
  \ restoredTable)\n        {\n            entities.Clear();\n            foreach\
  \ (KeyValuePair<int?, object> pair in restoredTable.entities)\n            {\n \
  \               entities.Add(pair.Key, pair.Value);\n            }\n        }\n\
  \        // 用于实体添加事件的嵌套类\n        public class EntityAddedEventArgs : EventArgs\n\
  \        {\n            public object objectAdded;\n        }\n    }\n}\n```\n\n\
  请注意以下几：\n\n- 构造函数需要一个 `EntityKeyGenerator` 对象，它可以使用它为此特定类型生成下一个键；\n- 实体存储在以整数（表示主键）为键的字典中，其值将\
  \ `object`。这允许该类存储任何对象类型，从而实现松耦合；\n- 提供了方法来返回所有实体，或者在提供键时仅返回单个实体；\n- `AddEntity()`\
  \ 方法在将实体添加到字典后，会生成并返回下一个键；\n- `Restore()` 方法将数据替换为参数提供的数据\n\n将数据保存到磁盘可以通过对象序列化或通过创建\
  \ CSV 格式的文件来实现。这表明可以使用策略模式（Strategy pattern），以便切换不同的处理方法。`AbstractEntityStrategy`\
  \ 类提供了定义它的基类：\n\n```csharp\nnamespace Database\n{\n    abstract class AbstractEntityStrategy\n\
  \    {\n        virtual string GetFileName(EntityTable table)\n        {\n     \
  \       return table.GetType().Name;\n        }\n        internal abstract string\
  \ FileSuffix { get; }\n        internal abstract void Save(EntityTable table);\n\
  \        internal abstract EntityTable Restore(EntityTable table);\n    }\n}\n```\n\
  \n`EntitySerializationStrategy` 类扩展了上述类以实现所需的方法：\n\n```csharp\nnamespace Database\n\
  {\n    class EntitySerializationStrategy : AbstractEntityStrategy\n    {\n     \
  \   internal override string FileSuffix\n        {\n            get\n          \
  \  {\n                return \".ser\";\n            }\n        }\n        internal\
  \ override void Save(EntityTable table)\n        {\n            Stream stream =\
  \ File.Open(GetFileName(table) + FileSuffix, FileMode.Create);\n            BinaryFormatter\
  \ formatter = new BinaryFormatter();\n            formatter.Serialize(stream, table);\n\
  \            stream.Close();\n        }\n        internal override EntityTable Restore(EntityTable\
  \ table)\n        {\n            Stream stream = File.Open(GetFileName(table) +\
  \ FileSuffix, FileMode.Open);\n            BinaryFormatter formatter = new BinaryFormatter();\n\
  \            EntityTable restoredTable = (EntityTable)formatter.Deserialize(stream);\n\
  \            stream.Close();\n            return restoredTable;\n        }\n   \
  \ }\n}\n```\n\n`EntityCSVStrategy` 类同样可以编写为使用 CSV 格式的文件，尽管代码在这里省略了：\n\n```csharp\n\
  namespace Database\n{\n    class EntityCSVStrategy : AbstractEntityStrategy\n  \
  \  {\n        internal override string FileSuffix\n        {\n            get\n\
  \            {\n                return \".csv\";\n            }\n        }\n   \
  \     internal override void Save(EntityTable table)\n        {\n            //\
  \ 以 CSV 格式保存表数据的代码（省略）\n        }\n        internal override EntityTable Restore(EntityTable\
  \ table)\n        {\n            // 从 CSV 恢复数据\n            return table;\n    \
  \    }\n    }\n}\n```\n\n为了简化任何需要数据库的命名空间（在本例中为 `Business` 命名空间）的工作，将有一个单一访问点。这提供了数据库的高级视图，隐藏了内部结构并促进了松耦合。与单例模式（Singleton\
  \ pattern）结合外观模式（Facade pattern）提供了单一访问点，如下所示：\n\n```csharp\nnamespace Database\n\
  {\n    [Serializable]\n    public class Facade\n    {\n        // 静态成员\n       \
  \ private static Facade instance;\n        public static Facade Instance\n     \
  \   {\n            get\n            {\n                if (instance == null)\n \
  \               {\n                    instance = new Facade();\n              \
  \  }\n                return instance;\n            }\n        }\n        // 实例变量\n\
  \        private EntityTable engines;\n        private AbstractEntityStrategy persistenceStrategy;\n\
  \        public EventHandler EngineAdded;\n        public EventHandler EnginesRestored;\n\
  \        // 私有构造函数\n        private Facade()\n        {\n            engines = new\
  \ EntityTable(EntityKeyGenerator.Instance);\n            engines.EntityTableItemAdded\
  \ += HandleAdded;\n            engines.EntityTableRestored += HandleinesRestored;\n\
  \            // 设置使用的持久化策略\n            //（可能从某处的配置获取）\n            persistenceStrategy\
  \ = new EntitySerializationStrategy();\n        }\n        // 实例方法\n        public\
  \ virtual object[] AllEngines\n        {\n            get\n            {\n     \
  \           return engines.All.ToArray();\n            }\n        }\n        public\
  \ virtual object GetEngine(int? key)\n        {\n            return engines.GetByKey(key);\n\
  \        }\n        public virtual int? AddEngine(object engine)\n        {\n  \
  \          return engines.AddEntity(engine);\n        }\n\n        private void\
  \ HandleAdded(object sender, EntityAddedEventArgs e)\n        {\n            EngineAdded?.Invoke(this,\
  \ e);\n        }\n        private void HandleinesRestored(object sender, EventArgs\
  \ e)\n        {\n            EnginesRestored?.Invoke(this, e);\n        }\n    }\n\
  }\n``````\n\n\n\n\n```csharp\n        public virtual void SaveEngines()\n      \
  \  {\n            persistenceStrategy.Save(engines);\n        }\n        public\
  \ virtual void RestoreEngines()\n        {\n            EntityTable restoredEngines\
  \ = persistenceStrategy.Restore(engines);\n            engines.Restore(restoredEngines);\n\
  \        }\n        public void HandleEngineAdded(Object sender, EventArgs args)\n\
  \        {\n            if (EngineAdded != null)\n            {\n              \
  \  EngineAdded(sender, args);\n            }\n        }\n        public void HandleEnginesRestored(Object\
  \ sender, EventArgs args)\n        {\n            if (EnginesRestored != null)\n\
  \            {\n                EnginesRestored(sender, args);\n            }\n\
  \        }\n    }\n}\n```\n\n注意以下几点：\n\n- 该类是一个单例（Singleton），因为调用它的命名空间应该使用一个 `Facade`\
  \ 对象；\n- 该类持有 `EntityTable` 对象来存储引擎，并提供了获取所有或其中一个引擎的方法，以及添加新引擎的方法。如果你的系统也管理车辆，那么也会有相应的变量和方法；\n\
  - 假设使用了序列化持久化策略，但你可以看到使用替代策略是多简单；\n\n现在可以显示包含 `Database` 命名空间类的分层图：\n\n![](img/00051.jpg)\n\
  \n图 29.4 : 带有 Facade 类的 Database 命名空间\n\n注意业务层是如何通过 `DatabaseFacade` 对象进行通信的。这样做的效果是将\
  \ `Database` 命名空间的复杂性隐藏在 Facade 之后。\n\n#### 业务层\n\n进入 `Business` 命名空间，它主要由在本书中使用的\
  \ `IEngine` 层次结构组成：\n\n![](img/00037.jpg)\n\n图 29.5 : `IEngine` 层次结构\n\n为了方便引擎对象被序列化，`AbstractEngine`\
  \ 的类定义需要指定对象是可化的：\n\n```csharp\nnamespace Business\n{\n    [Serializable]\n    public\
  \ abstract class AbstractEngine : IEngine\n    {\n... 省略了类的其余部分 ...\n    }\n```\n\
  \n其他类保持不变，只是它们现在当然位于名为 `Business` 的命名空间中。\n\n由于存在两种类型的引擎（标准型和涡轮型），创建一个工厂类（Factory\
  \ class）来根据提供的参数创建正确类型的对象将非常有用。为此，在 `Business` 命名空间中定义一个新类 `EngineFactory`：\n\n\
  ```csharp\nnamespace Business\n{\n    class EngineFactory\n    {\n        public\
  \ enum Type\n        {\n            Standard,\n            Turbo\n        }\n  \
  \      public static IEngine Create(EngineFactory.Type type, int size)\n       \
  \ {\n            if (type == Type.Standard)\n            {\n                return\
  \ new StandardEngine(size);\n            }\n            else\n            {\n  \
  \              return new TurboEngine(size);\n            }\n        }\n       \
  \ public static IEngine Create(int size, bool turbo)\n        {\n            return\
  \ EngineFactory.Create(turbo ? Type.Turbo : Type.Standard, size);\n        }\n \
  \       private EngineFactory()\n        {\n        }\n    }\n}\n```\n\n注意 `Create()`\
  \ 方法是 `static` 的并且经过重载，因此客户端可以提供 `enum` 值或 `boolean` 值。就像在数据库层所的那样，`Business` 命名空间将有自己的\
  \ facade，在此例中为 `BusinessFacade`：\n\n```csharp\nnamespace Business\n{\n    [Serializable]\n\
  \    public class BusinessFacade\n    {\n        // 静态成员\n        private static\
  \ volatile BusinessFacade instance;\n        public static BusinessFacade Instance\n\
  \        {\n            get\n            {\n                if (instance == null)\n\
  \                {\n                    instance = new BusinessFacade();\n     \
  \           }\n                return instance;\n            }\n        }\n    \
  \    // 实例变量\n        public event EventHandler EngineAdded;\n        public event\
  \ EventHandler EnginesRestored;\n        // 私有构造函数\n        private BusinessFacade()\n\
  \        {\n            DatabaseFacade.Instance.EngineAdded += HandleEngineAdded;\n\
  \            DatabaseFacade.Instance.EnginesRestored += HandleEnginesRestored;\n\
  \        }\n        // 实例方法\n        public virtual string[] EngineTypes\n     \
  \   {\n            get\n            {\n                return Enum.GetNames(typeof(EngineFactory.Type));\n\
  \            }\n        }\n        public virtual object[] AllEngines\n        {\n\
  \            get\n            {\n                return DatabaseFacade.Instance.AllEngines;\n\
  \            }\n        }\n        public virtual object AddEngine(object type,\
  \ int size)\n        {\n            EngineFactory.Type engineType;\n           \
  \ if (type is string)\n            {\n                engineType = (EngineFactory.Type)Enum.Parse(typeof(EngineFactory.Type),\
  \ (string)type);\n            }\n            else\n            {\n             \
  \   engineType = (EngineFactory.Type)type;\n            }\n            IEngine engine\
  \ = EngineFactory.Create(size, (engineType == EngineFactory.Type.Turbo));\n    \
  \        DatabaseFacade.Instance.AddEngine(engine);\n            return engine;\n\
  \        }\n        public virtual void SaveEngines()\n        {\n            DatabaseFacade.Instance.SaveEngines();\n\
  \        }\n        public virtual void RestoreEngines()\n        {\n          \
  \  DatabaseFacade.Instance.RestoreEngines();\n        }\n        public void HandleEngineAdded(Object\
  \ sender, EventArgs args)\n        {\n            if (EngineAdded != null)\n   \
  \         {\n                EngineAdded(sender, args);\n            }\n       \
  \ }\n        public void HandleEnginesRestored(Object sender, EventArgs args)\n\
  \        {\n            if (EnginesRestored != null)\n            {\n          \
  \      EnginesRestored(sender, args);\n            }\n        }\n    }\n}\n```\n\
  \n注意以下几点：\n\n- 这些方法委托给相应的 `DatabaseFacade` 方法；\n- `AllEngines` getter 和 `AddEngine()`\
  \ 方法的类型是 `object` 而不是 `IEngine`。这意味着 `Business` 层与用户界面层松耦合，使得后者不依赖于前者的实现细节。用户界面可以使用\
  \ `object` 类的 `ToString()` 方法获取显示在列表中的信息。\n\n现在可以显示包含 `Business` 命名空间类的分层图：\n\n\
  ![](img/00055.jpg)\n\n图 29.6 : 带有 Facade 类的 Business 命名空间\n\n#### 用户界面层\n\n用户界面层包含一个\
  \ `ManageEngines` 类，它显示了一个可滚引擎列表和一些按钮：\n\n```csharp\npublic partial class ManageEngines\
  \ : Form\n{\n    public ManageEngines()\n    {\n        InitializeComponent();\n\
  \        BusinessFacade.Instance.EngineAdded += HandleEngineAdded;\n        BusinessFacade.Instance.EnginesRestored\
  \ += HandleEnginesRestored;\n    }\n    private void ManageEngines_Load(object sender,\
  \ EventArgs e)\n    {\n        // 创建一些示例数据（通过事件添加到列表）\n        BusinessFacade.Instance.AddEngine(EngineFactory.Type.Standard,\
  \ 1300);\n        BusinessFacade.Instance.AddEngine(EngineFactory.Type.Standard,\
  \ 1600);\n        BusinessFacade.Instance.AddEngine(EngineFactory.Type.Standard,\
  \ 2000);\n        BusinessFacade.Instance.AddEngine(EngineFactory.Type.Turbo, 2500);\n\
  \    }\n    private void buildEngineButton_Click(object sender, EventArgs e)\n \
  \   {\n        Form buildEngineForm = new BuildEngineForm();\n    }\n}\n```\n\n\n\
  \n\n```csharp\nbuildEngineForm.ShowDialog(this);\n\n    }\n    public void HandleEngineAdded(Object\
  \ sender, EventArgs args)\n    {\n        EntityTable.EntityAddedEventArgs entityArgs\
  \ = (EntityTable.EntityAddedEventArgs)args;\n        enginesList.Items.Add(entityArgs.objectAdded.ToString());\n\
  \    }\n    public void HandleEnginesRestored(Object sender, EventArgs args)\n \
