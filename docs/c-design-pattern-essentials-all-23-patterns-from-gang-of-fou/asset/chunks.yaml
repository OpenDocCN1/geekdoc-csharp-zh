    4\. Factory Method


     Type: Creational


    Purpose: Define an interface for creating an object, but let subclasses decide
    which class to instantiate.


    You will recall from the introduction the following class hierarchy for the vehicles
    made by the Foobar Motor Company:


    ![](images/00035.jpg)


    Figure 4.1 : `IVehicle` class hierarchy


    When we need to instantiate a particular type of vehicle (such as a `Coupe`) it
    is often more flexible to define a separate class whose responsibility it is to
    manage the instantiation. This separate class is known as a Factory.


    The Factory Method pattern defines an abstract class which serves as the ''factory''
    and that has an abstract method within to determine what product (in our case
    vehicle) to instantiate. Concrete subclasses of the factory make that determination.
    Here is how the Factory Method pattern could be used with the `IVehicle` class
    hierarchy:


    ![](images/00033.jpg)


    Figure 4.2 : Factory Method pattern


    In the above diagram we can see that we have created an abstract `VehicleFactory`
    class which has two concrete subclasses, `CarFactory` and `VanFactory`. Let us
    look at how `VehicleFactory` is defined:


    `public abstract class VehicleFactory`


    `{`


    `    public enum DrivingStyle`


    `    {`


    `        Economical, Midrange, Powerful`


    `    }`


    `    public virtual IVehicle Build(DrivingStyle style, VehicleColour colour)`


    `    {`


    `        IVehicle v = SelectVehicle(style);`


    `        v.Paint(colour);`


    `        return v;`


    `    }`


    `    // This is the "factory method"`


    `    protected internal abstract IVehicle SelectVehicle(DrivingStyle style);`


    `}`


    `VehicleFactory` contains the `public` method `Build()` that takes as arguments
    the driving style (`Economical`, `Midrange` or `Powerful`) and the colour that
    the vehicle should be painted. The `Build()` method calls the `protected` abstract
    `SelectVehicle()` method, which is the "factory method" after which the pattern
    is named. The implementation of `SelectVehicle()` is therefore delegated to the
    subclasses such that each subclass determines the specific type of vehicle to
    instantiate. The method is `protected` because we only want subclasses to utilise
    it; it is not intended to be invoked by clients.


    Here is the `CarFactory` concrete subclass:


    `public class CarFactory : VehicleFactory`


    `{`


    `    protected internal override IVehicle SelectVehicle, (DrivingStyle style)`


    `    {`


    `        if (style == DrivingStyle.Economical)`


    `        {`


    `            return new Saloon(new StandardEngine(1300));`


    `        }`


    `        else if (style == DrivingStyle.Midrange)`


    `        {`


    `            return new Coupe(new StandardEngine(1600));`


    `        }`


    `        else`


    `        {`


    `            return new Sport(new TurboEngine(2000));`


    `        }`


    `    }`


    `}`


    As you can see, the `SelectVehicle()` method is implemented such that it works
    out from the supplied arguments exactly which type of car should be instantiated
    and returned.


    The `VanFactory` is similar, using the argument to decide which van to instantiate
    and return:


    `public class VanFactory : VehicleFactory`


    `{`


    `    protected internal override IVehicle SelectVehicle, (DrivingStyle style)`


    `    {`


    `        if ((style == DrivingStyle.Economical) || (style == DrivingStyle.Midrange))`


    `        {`


    `            return new Pickup(new StandardEngine(2200));`


    `        }`


    `        else`


    `        {`


    `            return new BoxVan(new TurboEngine(2500));`


    `        }`


    `    }`


    `}`


    Client programs instantiate the required factory and call its `Build()` method:


    `// I want an economical car, coloured blue...`


    `VehicleFactory carFactory = new CarFactory();`


    `Vehicle car = carFactory.Build(VehicleFactory.DrivingStyle.Economical, VehicleColour.Blue);`


    `Console.WriteLine(car);`


    `// I am a "white van man"...`


    `VehicleFactory vanFactory = new VanFactory();`


    `Vehicle van = vanFactory.Build(VehicleFactory.DrivingStyle.Powerful, VehicleColour.White);`


    `Console.WriteLine(van);`


    `Console.Read();`


    You should see the following output:


    `Saloon (StandardEngine (1300), Blue)`


    `BoxVan (TurboEngine (2500), White)`


    Using static factory methods


    A common and useful variation is to define a `static` factory method. Let''s assume
    we define the following additional `enum` in the `VehicleFactory` class:


    `public enum Category`


    `{`


    `    Car, Van`


    `}`


    Now we can define the following `static` `Make()` method also in `VehicleFactory`
    that works out which subclass to instantiate:


    `public static IVehicle Make(Category category, DrivingStyle style, VehicleColour
    colour) {`


    `    VehicleFactory factory = null;`


    `    if (category == Category.Car) {`


    `        factory = new CarFactory();`


    `    } else {`


    `        factory = new VanFactory();`


    `    }`


    `    return factory.Build(style, colour);`


    `}`


    Using the static `Make()` method is very straightforward:


    `// Create a red sports car...`


    `Vehicle sporty = VehicleFactory.Make(VehicleFactory.Category.Car, VehicleFactory.DrivingStyle.Powerful,
    Colour.Red);`


    `Console.WriteLine(sporty);`


    This should give the following output:


    `Sport (TurboEngine (2000), Red)`


