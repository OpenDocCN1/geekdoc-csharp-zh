    \ and a `Brake` class. But we can also see that there are some complex interactions\
    \ between them, and yet one of our core object-oriented design principles is to\
    \ keep classes loosely-coupled.\n\nThe Mediator pattern helps to solve this through\
    \ the definition of a separate class (the mediator) that knows about the individual\
    \ component classes and takes responsibility for managing their interaction. The\
    \ component classes also each know about the mediator class, but this is the only\
    \ coupling they have. For our example, we will call the mediator class `EngineManagementSystem`.\n\
    \nWe can see the connections diagrammatically below:\n\n![](images/00010.jpg)\n\
    \nFigure 18.1 : Mediator pattern\n\nThe two-way communication is achieved via\
    \ each of the component classes' constructors, in that they each accept a reference\
