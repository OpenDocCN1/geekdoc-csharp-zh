    17. Iterator


    Type: Behavioural


    Purpose: Provide a way to access the elements of an aggregate object sequentially
    without exposing its underlying representation.


    The Foobar Motor Company wanted to produce a brochure listing their range of vehicles
    for sale and allocated the task to two separate programmers, one to provide the
    range of cars and the other to provide the range of vans.


    The programmer that coded the `CarRange` class decided to internally store the
    range using an `IList` object:


    `public class CarRange`


    `{`


    `    private IList<IVehicle> cars;`


    `    public CarRange()`


    `    {`


    `        cars = new List<IVehicle>();`


    `        // Define the range of car models available`


    `        cars.Add(new Saloon(new StandardEngine(1300)));`


    `        cars.Add(new Saloon(new StandardEngine(1600)));`


    `        cars.Add(new Coupe(new StandardEngine(2000)));`


    `        cars.Add(new Sport(new TurboEngine(2500)));`


    `    }`


    `    public virtual IList<IVehicle> Range`


    `    {`


    `        get`


    `        {`


    `            return cars;`


    `        }`


    `    }`


    `}`


    You can see from the above that the programmer provided a `Range` getter that
    returns the `IList` collection object.


    The other programmer decided to store the vans in an array when writing the `VanRange`
    class, and therefore his version of the `Range` getter returns an array of vehicles:


    `public class VanRange`


    `{`


    `    private IVehicle[] vans;`


    `    public VanRange()`


    `    {`


    `        vans = new IVehicle[3];`


    `        // Define the range of van models available`


    `        vans[0] = new BoxVan(new StandardEngine(1600));`


    `        vans[1] = new BoxVan(new StandardEngine(2000));`


    `        vans[2] = new Pickup(new TurboEngine(2200));`


    `    }`


    `    public virtual IVehicle[] Range`


    `    {`


    `        get`


    `        {`


    `            return vans;`


    `        }`


    `    }`


    `}`


    The problem with this is that the internal representation in both of these classes
    has been exposed to outside objects. A better approach would be for each of the
    `CarRange` and `VanRange` classes to provide an `GetEnumerator()` method that
    returns an `IEnumerator` object, so that as well as being consistent, the internal
    representation would not need to be exposed.


    For `CarRange` the additional method will be as follows:


    `public virtual IEnumerator<IVehicle> GetEnumerator()`


    `{`


    `    return cars.GetEnumerator();`


    `}`


    For `VanRange` the additional method will need to convert from the array:


    `public virtual IEnumerator<IVehicle> GetEnumerator()`


    `{`


    `    return ((IEnumerable<IVehicle>) vans).GetEnumerator();`


    `}`


    Now we can process both cars and vans in a consistent manner:


