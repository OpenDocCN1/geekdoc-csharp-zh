    \ object passed to its `Build()` method for implementation by subclasses:\n\n\
    ```csharp\npublic abstract class VehicleDirector\n{\n    public abstract IVehicle\
    \ Build(VehicleBuilder builder);\n}\n```\n\nThe `CarDirector` class inherits from\
