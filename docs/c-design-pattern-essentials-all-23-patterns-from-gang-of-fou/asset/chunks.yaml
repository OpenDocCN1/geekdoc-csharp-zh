    \ `RestoreState()` 方法现在返回恢复后的对象引用：\n\n```cs\nSpeedometer speedo = new Speedometer();\n\
    speedo.CurrentSpeed = 50;\nspeedo.CurrentSpeed = 100;\nConsole.WriteLine(\"Current\
    \ speed: \" + speedo.CurrentSpeed);\nConsole.WriteLine(\"Previous speed: \" +\
    \ speedo.previousSpeed);\n// Save the state of 'speedo'...\nSpeedometerMemento\
    \ memento = new SpeedometerMemento(speedo);\n// Change the state of 'speedo'...\n\
    speedo.CurrentSpeed = 80;\nConsole.WriteLine(\"After setting to 80...\");\nConsole.WriteLine(\"\
    Current speed: \" + speedo.CurrentSpeed);\nConsole.WriteLine(\"Previous speed:\
    \ \" + speedo.previousSpeed);\n// Restore the state of 'speedo'...\nConsole.WriteLine(\"\
    Now restoring state...\");\nspeedo = memento.RestoreState();\nConsole.WriteLine(\"\
    Current speed: \" + speedo.CurrentSpeed);\nConsole.WriteLine(\"Previous speed:\
    \ \" + speedo.previousSpeed);\n```\n\n运行上述代码得到的输出与第一种方法相同。这种方法的主要缺点是向磁盘文件写入和从文件中读取的速度要慢得多。请注意，虽然我们能够再次将所有字段设为\
    \ `private`，但获取了序列化文件的人仍然可能使用十六进制编辑器来更改数据。\n\n# 20. 观察者模式 (Observer)\n\n类型：行为型\n\
    \n目的：在对象之间定义一种一对多的依赖关系，当一个对象的状态发生变化时，所有依赖者都会自动更新。Foobar 公司决定，每当超过特定速度时，应该向驾驶员发出警报。他们预计根据当前速度可能还需要发生其他事情（例如自动变速箱选择合适的挡位）。但他们意识到需要保持对象的松散耦合，因此自然不希望\
    \ `Speedometer` 类对监视器或变速箱（或其他任何对行驶速度感兴趣的类）有直接了解。观察者模式允许在“主体”（感兴趣的对象；我们的示例中为 `Speedometer`）和它的“观察者”（在发生事情时需要通知的任何其他类）之间建立松散耦合。由于这是面向对象系统中非常常见的需求，C#\
    \ 库包含了能够实现该模式的机制。其中之一是利用 `EventHandler` 类：“主体”（`Speedometer`）可以有多个观察者，每当发生事件时，每个观察者都会收到通知。`Speedometer`\
    \ 类如下所示：\n\n```cs\npublic class Speedometer\n{\n    public EventHandler ValueChanged;\n\
    \    private int currentSpeed;\n    public Speedometer()\n    {\n        speed\
    \ = 0;\n    }\n    public virtual int CurrentSpeed\n    {\n        set\n     \
    \   {\n            currentSpeed = value;\n            // 告诉所有观察者，让他们知道值已经改变了...\n\
    \            OnValueChanged();\n        }\n        get\n        {\n          \
    \  return currentSpeed;\n        }\n    }\n    protected void OnValueChanged()\n\
    \    {\n        if (ValueChanged != null)\n        {\n            ValueChanged(this,\
    \ EventArgs.Empty);\n        }\n    }\n}\n```\n\n`SpeedMonitor` 类使用了 `ValueChanged`：\n\
    \n```cs\npublic class SpeedMonitor\n{\n    public const int SpeedToAlert = 70;\n\
    \    public SpeedMonitor(Speedometer speedo)\n    {\n        speedo.ValueChanged\
    \ += ValueHasChanged;\n    }\n    private void ValueHasChanged(object sender,\
    \ EventArgs e )\n    {\n        Speedometer speedo = (Speedometer)sender;\n  \
    \      if (speedo.CurrentSpeed > SpeedToAlert)\n        {\n            Console.WriteLine(\"\
    ** 警报 ** 速度太快了！ (\" + speedo.CurrentSpeed + \")\");\n        }\n        else\n\
    \        {\n            Console.WriteLine(\"... 平稳运行 ... (\" + speedo.CurrentSpeed\
    \ + \")\");\n        }\n    }\n}\n```\n\n客户端程序只需将 `SpeedMonitor` 引用传递给 `Speedometer`\
    \ 实例：\n\n```cs\n// 创建一个速度表......\nSpeedometer speedo = new Speedometer();\n//\
    \ 创建一个监视器...\nSpeedMonitor monitor = new SpeedMonitor(speedo);\n// 以不同的速度行驶...\n\
    speedo.CurrentSpeed = 50;\nspeedo.CurrentSpeed = 70;\nspeedo.CurrentSpeed = 40;\n\
    speedo.CurrentSpeed = 100;\nspeedo.CurrentSpeed = 69;\n```\n\n运行上述代码将得到以下输出：\n\
    ... 平稳运行 ... (50)\n** 警报 ** 速度太快了！ (70)\n... 平稳运行 ... (40)\n** 警报 ** 速度太快了！ (100)\n\
    ... 平稳运行 ... (69)\n\n观察者模式真正的威力在于，任何类型的类只要实现了 `Observer` 接口现在都可以成为监视器，而无需对 `Speedometer`\
    \ 进行任何修改。让我们创建一个自动变速箱的模拟：\n\n```cs\npublic class AutomaticGearbox\n{\n    public\
    \ AutomaticGearbox(Speedometer speedo)\n    {\n        speedo.ValueChanged +=\
    \ ValueHasChanged;\n    }\n    private void ValueHasChanged(object sender, EventArgs\
    \ e )\n    {\n        Speedometer speedo = (Speedometer)sender;\n        if (speedo.CurrentSpeed\
    \ <= 10)\n        {\n            Console.WriteLine(\"进入一挡\");\n        }\n   \
    \     else if (speedo.CurrentSpeed <= 20)\n        {\n            Console.WriteLine(\"\
    进入二挡\");\n        }\n        else if (speedo.CurrentSpeed <= 30)\n        {\n\
    \            Console.WriteLine(\"进入三挡\");\n        }\n        else\n        {\n\
    \            Console.WriteLine(\"进入四挡\");\n        }\n    }\n}\n```\n\n我们的客户端程序现在只需只需将其添加为额外的观察者，并同样获得速度变化的通知：\n\
    \n`AutomaticGearbox auto = new AutomaticGearbox(speedo);`\n\n# 21. 状态模式 (State)\n\
    \n类型：行为型\n\n目的：允许对象在其内部状态发生变化时改变其行为。对象看起来改变了它的类。\n\n"
- fmt: "\nThe Foobar Motor Company's vehicles each have a digital clock fitted that\
    \ displays the current date and time. These values will need to be reset from\
    \ time to time (such as after a change of battery) and this is accomplished by\
    \ means of a particular knob on the dashboard. When the knob is initially pressed,\
    \ the 'year' value can be set. Turning the knob to the left (i.e. anti-clockwise)\
    \ causes the previous year to be show, whereas turning it to the right goes forward\
    \ one year. When the knob is pressed again the year value becomes 'set' and the\
    \ set-up process then automatically allows the month value to be set, also by\
    \ making appropriate left or right movements with the knob.\n\nThis process continues\
    \ for the day of the month, the hour and the minute. The following summarises\
    \ the flow of events:\n\n*   When the knob is first pushed the clock goes into\
    \ \"setup\" mode for setting the year;\n*   If the knob is rotated left then 1\
    \ is deducted from the year value;\n*   If the knob is rotated right then 1 is\
    \ added to the year value;\n*   When the knob is pushed the year becomes set and\
    \ the clock goes into \"setup\" mode for setting the month;\n*   If the knob is\
    \ rotated left then 1 is deducted from the month value;\n*   If the knob is rotated\
    \ right then 1 is added to the month value;\n*   When the knob is pushed the month\
    \ becomes set and the clock goes into \"setup\" mode for setting the day;\n* \
    \  If the knob is rotated left then 1 is deducted from the day value;\n*   If\
    \ the knob is rotated right then 1 is added to the day value;\n*   When the knob\
    \ is pushed the day becomes set and the clock goes into \"setup\" mode for setting\
    \ the hour;\n*   If the knob is rotated left then 1 is deducted from the hour\
    \ value;\n*   If the knob is rotated right then 1 is added to the hour value;\n\
    *   When the knob is pushed the hour becomes set and the clock goes into \"setup\"\
    \ mode for setting the minute;\n*   If the knob is rotated left then 1 is deducted\
    \ from the minute value;\n*   If the knob is rotated right then 1 is added to\
    \ the minute value;\n*   When the knob is pushed the minute becomes set and the\
    \ clock goes into the \"finished setup\" mode;\n*   If the knob is pushed again\
    \ the full selected date and time are displayed.\n\nFrom the above steps it is\
    \ clear that different parts of the date & time get set when the knob is turned\
    \ or pressed, and that there are transitions between those parts. A naive approach\
    \ when coding a class to accomplish this would be to have a 'mode' variable and\
    \ then a series of `if...else...` statements in each method, which might look\
    \ like this:\n\n```csharp\n// DON'T DO THIS! \n\npublic void RotateKnobLeft()\n\
    {\n    if (mode == YearMode)\n    {\n        year--;\n    }\n    else if (mode\
    \ == MonthMode)\n    {\n        month--;\n    }\n    else if (mode == DayMode)\n\
    \    {\n        day--;\n    }\n    else if (mode == HourMode)\n    {\n       \
    \ hour--;\n    }\n    else if (mode == MinuteMode)\n    {\n        minute--;\n\
    \    }\n}\n```\n\nThe problem with code such as the above is that the `if...else...`\
    \ conditions would have to be repeated in each action method (i.e. `RotateKnobRight()`,\
    \ `PushKnob()`, etc.). Apart from making the code look unwieldy it also becomes\
    \ hard to maintain, as if for example we now need to record seconds we would need\
    \ to change multiple parts of the class.\n\nThe State pattern enables a hierarchy\
    \ to be established that allows for state transitions such as necessitated by\
    \ our clock setting example. We will create a `ClockSetup` class that initiates\
    \ the states through the interface `IClockSetupState`, which has an implementing\
    \ class for each individual state:\n\n![](images/00015.jpg)\n\nFigure 21.1 : State\
    \ pattern\n\nThe `IClockSetupState` interface defines methods for handling changes\
    \ to the state, plus methods that can provide user instructions and return the\
    \ actual selected value:\n\n```csharp\npublic interface IClockSetupState\n{\n\
    \    void PreviousValue();\n    void NextValue();\n    void SelectValue();\n \
    \   string Instructions { get; }\n    int SelectedValue { get; }\n}\n```\n\nLooking\
    \ first at `YearSetupState`, you will notice that it takes a reference to a `ClockSetup`\
    \ object in the constructor (which is known in the language of design patterns\
    \ as its 'context') and manages the setting of the year. Note in particular in\
    \ the `SelectValue()` method how it transitions internally to a different state:\n\
    \n```csharp\nclass YearSetupState : ClockSetup\n{\n    private ClockSetup clockSetup;\n\
    \    private int year;\n    public YearSetupState(ClockSetup clockSetup)\n   \
    \ {\n        this.clockSetup = clockSetup;\n        year = DateTime.Now.Year;\n\
    \    }\n    public virtual void PreviousValue()\n    {\n        year--;\n    }\n\
    \    public virtual void NextValue()\n    {\n        year++;\n    }\n    public\
    \ virtual void SelectValue()\n    {\n        Console.WriteLine(\"Year to \" +\
    \ year);\n        clockSetup.State = clockSetup.MonthState;\n    }\n    public\
    \ virtual string Instructions\n    {\n        get\n        {\n            return\
    \ \"Please set the year...\";\n        }\n    }\n    public virtual int SelectedValue\n\
    \    {\n        get\n        {\n            return year;\n        }\n    }\n}\n\
    ```\n\nThe other date & time state follow a similar process, each transitioning\
    \ to the next appropriate state when required:\n\n```csharp\nclass MonthSetupState\
    \ : ClockSetup\n{\n    private ClockSetup clockSetup;\n    private int month;\n\
    \    public MonthSetupState(ClockSetup clockSetup)\n    {\n        this.clockSetup\
    \ = clockSetup;\n        month = DateTime.Now.Month;\n    }\n    public virtual\
    \ void PreviousValue()\n    {\n        if (month > 1)\n        {\n           \
    \ month--;\n        }\n    }\n    public virtual void NextValue()\n    {\n   \
    \     if (month < 12)\n        {\n            month++;\n        }\n    }\n   \
    \ public virtual void SelectValue()\n    {\n        Console.WriteLine(\"Month\
    \ set to \" + month);\n        clockSetup.State = clockSetup.DaySetupState;\n\
    \    }\n    public virtual string Instructions\n    {\n        get\n        {\n\
    \            return \"Please set the month...\";\n        }\n    }\n    public\
    \ virtual int SelectedValue\n    {\n        get\n        {\n            return\
    \ month;\n        }\n    }\n}\n\nclass DaySetupState : ClockSetup\n{\n    private\
    \ ClockSetup clockSetup;\n    private int day;\n    public DaySetupState(ClockSetup\
    \ clockSetup)\n    {\n        this.clockSetup = clockSetup;\n        day = DateTime.Now.Day;\n\
    \    }\n    public virtual void PreviousValue()\n    {\n        if (day > 1)\n\
    \        {\n            day--;\n        }\n    }\n    public virtual void NextValue()\n\
    \    {\n        if (day < System.DateTime.DaysInMonth(new DateTime().Year, new\
    \ DateTime().Month))\n        {\n            day++;\n        }\n    }\n    public\
    \ virtual void SelectValue()\n    {\n        Console.WriteLine(\"Day set to \"\
    \ + day);\n        clockSetup.State = clockSetup.HourSetupState;\n    }\n    public\
    \ virtual string Instructions\n    {\n        get\n        {\n            return\
    \ \"Please set the day...\";\n        }\n    }\n    public virtual int SelectedValue\n\
    \    {\n        get\n        {\n            return day;\n        }\n    }\n}\n\
    \nclass HourSetupState : ClockSetup\n{\n    private ClockSetup clockSetup;\n \
    \   private int hour;\n    public HourSetupState(ClockSetup clockSetup)\n    {\n\
    \        this.clockSetup = clockSetup;\n        hour = DateTime.Now.Hour;\n  \
    \  }\n    public virtual void PreviousValue()\n    {\n        if (hour > 0)\n\
    \        {\n            hour--;\n        }\n    }\n    public virtual void NextValue()\n\
    \    {\n        if (hour < 23)\n        {\n            hour++;\n        }\n  \
    \  }\n}\n```\n"
  raw: 'The Foobar Motor Company''s vehicles each have a digital clock fitted that
    displays the current date and time. These values will need to be reset from time
    to time (such as after a change of battery) and this is accomplished by means
    of a particular knob on the dashboard. When the knob is initially pressed, the
    ''year'' value can be set. Turning the knob to the left (i.e. anti-clockwise)
    causes the previous year to be show, whereas turning it to the right goes forward
    one year. When the knob is pressed again the year value becomes ''set'' and the
    set-up process then automatically allows the month value to be set, also by making
    appropriate left or right movements with the knob.


    This process continues for the day of the month, the hour and the minute. The
    following summarises the flow of events:


    *   When the knob is first pushed the clock goes into "setup" mode for setting
    the year;


    *   If the knob is rotated left then 1 is deducted from the year value;


    *   If the knob is rotated right then 1 is added to the year value;


    *   When the knob is pushed the year becomes set and the clock goes into "setup"
    mode for setting the month;


    *   If the knob is rotated left then 1 is deducted from the month value;


    *   If the knob is rotated right then 1 is added to the month value;


    *   When the knob is pushed the month becomes set and the clock goes into "setup"
    mode for setting the day;


    *   If the knob is rotated left then 1 is deducted from the day value;


    *   If the knob is rotated right then 1 is added to the day value;


    *   When the knob is pushed the day becomes set and the clock goes into "setup"
    mode for setting the hour;


    *   If the knob is rotated left then 1 is deducted from the hour value;


    *   If the knob is rotated right then 1 is added to the hour value;


    *   When the knob is pushed the hour becomes set and the clock goes into "setup"
    mode for setting the minute;


    *   If the knob is rotated left then 1 is deducted from the minute value;


    *   If the knob is rotated right then 1 is added to the minute value;


    *   When the knob is pushed the minute becomes set and the clock goes into the
    "finished setup" mode;


    *   If the knob is pushed again the full selected date and time are displayed.


    From the above steps it is clear that different parts of the date & time get set
    when the knob is turned or pressed, and that there are transitions between those
    parts. A naive approach when coding a class to accomplish this would be to have
    a ''mode'' variable and then a series of `if...else...` statements in each method,
    which might look like this:


    `// *** DON''T DO THIS! ***`


    `public void RotateKnobLeft()`


    `{`


    `    if (mode == YearMode)`


    `    {`


    `        year--;`


    `    }`


    `    else if (mode == MonthMode)`


    `    {`


    `        month--;`


    `    }`


    `    else if (mode == DayMode)`


    `    {`


    `        day--;`


    `    }`


    `    else if (mode == HourMode)`


    `    {`


    `        hour--;`


    `    }`


    `    else if (mode == MinuteMode)`


    `    {`


    `        minute--;`


    `    }`


    `}`


    The problem with code such as the above is that the `if...else...` conditions
    would have to be repeated in each action method (i.e. `RotateKnobRight()`, `PushKnob()`,
    etc.). Apart from making the code look unwieldy it also becomes hard to maintain,
    as if for example we now need to record seconds we would need to change multiple
    parts of the class.


    The State pattern enables a hierarchy to be established that allows for state
    transitions such as necessitated by our clock setting example. We will create
    a `ClockSetup` class that initiates the states through the interface `IClockSetupState`,
    which has an implementing class for each individual state:


    ![](images/00015.jpg)


    Figure 21.1 : State pattern


    The `IClockSetupState` interface defines methods for handling changes to the state,
    plus methods that can provide user instructions and return the actual selected
    value:


    `public interface IClockSetupState`


    `{`


    `    void PreviousValue();`


    `    void NextValue();`


    `    void SelectValue();`


    `    string Instructions { get; }`


    `    int SelectedValue { get; }`


    `}`


    Looking first at `YearSetupState`, you will notice that it takes a reference to
    a `ClockSetup` object in the constructor (which is known in the language of design
    patterns as its ''context'') and manages the setting of the year. Note in particular
    in the `SelectValue()` method how it transitions internally to a different state:


    `public class YearSetupState : ClockSetupState`


    `{`


    `    private ClockSetup clockSetup;`


    `    private int year;`


    `    public YearSetupState(ClockSetup clockSetup)`


    `    {`


    `        this.clockSetup = clockSetup;`


    `        year = DateTime.Now.Year;`


    `    }`


    `    public virtual void PreviousValue()`


    `    {`


    `        year--;`


    `    }`


    `    public virtual void NextValue()`


    `    {`


    `        year++;`


    `    }`


    `    public virtual void SelectValue()`


    `    {`


    `        Console.WriteLine("Year set to " + year);`


    `        clockSetup.State = clockSetup.MonthSetupState;`


    `    }`


    `    public virtual string Instructions`


    `    {`


    `        get`


    `        {`


    `            return "Please set the year...";`


    `        }`


    `    }`


    `    public virtual int SelectedValue`


    `    {`


    `        get`


    `        {`


    `            return year;`


    `        }`


    `    }`


    `}`


    The other date & time state classes follow a similar process, each transitioning
    to the next appropriate state when required:


    `public class MonthSetupState : ClockSetupState`


    `{`


    `    private ClockSetup clockSetup;`


    `    private int month;`


    `    public MonthSetupState(ClockSetup clockSetup)`


    `    {`


    `        this.clockSetup = clockSetup;`


    `        month = DateTime.Now.Month;`


    `    }`


    `    public virtual void PreviousValue()`


    `    {`


    `        if (month > 1)`


    `        {`


    `            month--;`


    `        }`


    `    }`


    `    public virtual void NextValue()`


    `    {`


    `        if (month < 12)`


    `        {`


    `            month++;`


    `        }`


    `    }`


    `    public virtual void SelectValue()`


    `    {`


    `        Console.WriteLine("Month set to " + month);`


    `        clockSetup.State = clockSetup.DaySetupState;`


    `    }`


    `    public virtual string Instructions`


    `    {`


    `        get`


    `        {`


    `            return "Please set the month...";`


    `        }`


    `    }`


    `    public virtual int SelectedValue`


    `    {`


    `        get`


    `        {`


    `            return month;`


    `        }`


    `    }`


    `}`


    `public class DaySetupState : ClockSetupState`


    `{`


    `    private ClockSetup clockSetup;`


    `    private int day;`


    `    public DaySetupState(ClockSetup clockSetup)`


    `    {`


    `        this.clockSetup = clockSetup;`


    `        day = DateTime.Now.Day;`


    `    }`


    `    public virtual void PreviousValue()`


    `    {`


    `        if (day > 1)`


    `        {`


    `            day--;`


    `        }`


    `    }`


    `    public virtual void NextValue()`


    `    {`


    `        if (day < System.DateTime.DaysInMonth(new DateTime().Year, new DateTime().Month))`


    `        {`


    `            day++;`


    `        }`


    `    }`


    `    public virtual void SelectValue()`


    `    {`


    `        Console.WriteLine("Day set to " + day);`


    `        clockSetup.State = clockSetup.HourSetupState;`


    `    }`


    `    public virtual string Instructions`


    `    {`


    `        get`


    `        {`


    `            return "Please set the day...";`


    `        }`


    `    }`


    `    public virtual int SelectedValue`


    `    {`


    `        get`


    `        {`


    `            return day;`


    `        }`


    `    }`


    `}`


    `public class HourSetupState : ClockSetupState`


    `{`


    `    private ClockSetup clockSetup;`


    `    private int hour;`


    `    public HourSetupState(ClockSetup clockSetup)`


    `    {`


    `        this.clockSetup = clockSetup;`


    `        hour = DateTime.Now.Hour;`


    `    }`


    `    public virtual void PreviousValue()`


    `    {`


    `        if (hour > 0)`


    `        {`


    `            hour--;`


    `        }`


    `    }`


    `    public virtual void NextValue()`


    `    {`


    `        if (hour < 23)`


    `        {`


    `            hour++;`


    `        }`


    `    }`'
