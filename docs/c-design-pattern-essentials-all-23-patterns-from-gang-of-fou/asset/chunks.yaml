    `}`


    The `NextHandler` setter takes another `IEmailHandler` object as its argument
    which represents the handler to call if the current object is unable to handle
    the email.


    The `ProcessHandler()` method takes the email text as its argument and determines
    if it is able to handle it (i.e. if it contains one of the keywords we are interested
    in). If the active object can handle the email it does so, otherwise it just forwards
    to the next in the chain.


    The `AbstractEmailHandler` class implements the `IEmailHandler` interface to provide
    useful default functionality:


