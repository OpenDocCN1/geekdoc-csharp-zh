    \        {\n            HandleHere(email);\n        }\n        else\n        {\n\
    \            // Unable to handle here so forward to next in chain\n          \
    \  nextHandler.ProcessHandler(email);\n        }\n    }\n    protected internal\
    \ abstract string[] MatchingWords();\n    protected internal abstract void HandleHere(string\
    \ email);\n}\n```\n\n`NextHandler` 方法简单地将参数存储在实例变量中；决策过程在 `ProcessHandler()` 中完成。该方法利用了两个\
    \ `protected` 辅助方法，这些方法必须由具体的子类来实现：\n\n* `MatchingWords()` 将返回一个该处理器感兴趣的字符串对象数组；\n\
    * `HandleHere()` 只在当对象实际上能够处理该邮件时被调用，并包含了所需的代码。\n\n具体子类的实现非常简单：\n\n```csharp\n\
    public class SpamEmailHandler : AbstractEmailHandler\n{\n    protected internal\
    \ override string[] MatchingWords()\n    {\n        return new string[] { \"viagra\"\
    , \"pills\", \"medicines\" };\n    }\n    protected internal override void HandleHere(string\
    \ email)\n    {\n        Console.WriteLine(\"This is a spam email.\");\n    }\n\
    }\n\npublic class SalesEmailHandler : AbstractEmailHandler\n{\n    protected internal\
    \ override string[] MatchingWords()\n    {\n        return new string[] { \"buy\"\
    , \"purchase\" };\n    }\n    protected internal override void HandleHere(string\
    \ email)\n    {\n        Console.WriteLine(\"Email handled by sales department.\"\
    );\n    }\n}\n\npublic class ServiceEmailHandler : AbstractEmailHandler\n{\n \
    \   protected internal override string[] MatchingWords()\n    {\n        return\
    \ new string[] { \"service\", \"repair\" };\n    }\n    protected internal override\
    \ void HandleHere(string email)\n    {\n        Console.WriteLine(\"Email handled\
    \ by service department.\");\n    }\n}\n\npublic class ManagerEmailHandler : AbstractEmailHandler\n\
    {\n    protected internal override string[] MatchingWords()\n    {\n        return\
    \ new string[] { \"complain\", \"bad\" };\n    }\n    protected internal override\
    \ void HandleHere(string email)\n    {\n        Console.WriteLine(\"Email handled\
    \ by manager.\");\n    }\n}\n\npublic class GeneralEnquiriesEmailHandler : AbstractEmailHandler\n\
    {\n    protected internal override string[] MatchingWords()\n    {\n        return\
    \ new string[0]; // match anything\n    }\n    protected internal override void\
    \ HandleHere(string email)\n    {\n        Console.WriteLine(\"Email handled by\
    \ general.\");\n    }\n}\n```\n\n现在我们需要定义处理器被调用的顺序。对于这个示例，在 `AbstractEmailHandler`\
    \ 中添加了以下 `static` 方法：\n\n```csharp\npublic static void Handle(string email)\n\
    {\n    // Create the handler...\n    IEHandler spam = new SpamEmailHandler();\n\
    \    IEHandler sales = new SalesEmailHandler();\n    IEHandler service = new ServiceEmailHandler();\n\
    \    IEHandler manager = new ManagerEmailHandler();\n    IEHandler general = new\
    \ GeneralEnquiriesEmailHandler();\n    // Chain together...\n    spam.NextHandler\
    \ = sales;\n    sales.NextHandler = service;\n    service.NextHandler = manager;\n\
    \    manager.NextHandler = general;\n    // Start the ball...\n    spam.ProcessHandler(email);\n\
    }\n```\n\n现在将消息传递给处理器变得如此简单：\n\n```csharp\nString email = \"I need my repaired.\"\
    ;\nAbstractEmailHandler.handle(email);\n```\n\n这应该产生以下输出：Email handled by service\
    \ department.\n\n## 15. 命令类型：行为型\n\n### 目的\n将请求封装为对象，从而允许用不同的请求对客户端进行参数化、队列请求并支持撤销的操作。Foobar\
    \ 公司制造的车辆都安装了收音机；这通过以下 `Radio` 类进行建模：\n\n```csharp\npublic class Radio\n{\n  \
    \  public const MinVolume = 0;\n    public const MaxVolume = 10;\n    public const\
    \ DefaultVolume = 5;\n    private bool switchedOn;\n    private int volume;\n\
    \    public Radio()\n    {\n        switchedOn = false;\n        volume = DefaultVolume;\n\
    \    }\n    public virtual bool On\n    {\n        get\n        {\n          \
    \  return switchedOn;\n        }\n    }\n    public virtual int Volume\n    {\n\
    \        get\n        {\n            return volume;\n        }\n    }\n    public\
    \ virtual void SwitchOn()\n    {\n        switchedOn = true;\n        Console.WriteLine(\"\
    Radio now on, volume level \" + Volume);\n    }\n    public virtual void SwitchOff()\n\
    \    {\n        switchedOn = false;\n        Console.WriteLine(\"Radio now off\"\
    );\n    }\n    public virtual void VolumeUp()\n    {\n        if (On)\n      \
    \  {\n            if (Volume < MaxVolume)\n            {\n                volume++;\n\
    \                Console.WriteLine(\"Volume up to level \" + Volume);\n      \
    \      }\n        }\n    }\n    public virtual void Down()\n    {\n        if\
    \ (On)\n        {\n            if (Volume > MinVolume)\n            {\n      \
    \          volume--;\n                Console.WriteLine(\"Volume down to level\
    \ \" + Volume);\n            }\n        }\n    }\n}\n```\n\n如你所示，该类允许收音机的开启和关闭，只要处于开启状态，就可以在\
    \ 1 到 10 的范围内每次增加或减少一级音量。一些车辆还带有带有简单升降按钮的电动窗户，如下 `ElectricWindow` 类所示：\n\n```csharp\n\
    public class ElectricWindow\n{\n    private bool open;\n    public ElectricWindow()\n\
    \    {\n        open = false;\n        Console.WriteLine(\"Window is closed\"\
    );\n    }\n    public virtual bool Open\n    {\n        get\n        {\n     \
    \       return open;\n        }\n    }\n    public virtual bool Closed\n    {\n\
    \        get\n        {\n            return (!open);\n        }\n    }\n    public\
    \ virtual void OpenWindow()\n    {\n        if (Closed)\n        {\n         \
    \   open = true;\n            Console.WriteLine(\"Window is now open\");\n   \
    \     }\n    }\n    public virtual void CloseWindow()\n    {\n        if (Open)\n\
    \        {\n            open = false;\n            Console.WriteLine(\"Window\
    \ is now closed\");\n        }\n    }\n}\n```\n\n每个设备（收音机和电动窗户）都有独立的控制按钮（通常是按钮）来管理其状态。但假设\
    \ Foobar 汽车公司现在希望在其旗舰车型上引入语音识别，并执行以下操作：\n\n* 如果语音识别系统处于“收音机”模式，那么当它听到“向上”或“向下”时，它会调整收音机音量；\n\
    * 如果语音识别系统处于“窗户”模式，那么当它听到“向上”或“向下”时，它会关闭或打开驾驶员门窗。\n\n因此，我们需要语音识别系统能够处理 `Radio`\
    \ 对象或 `ElectricWindow` 对象，而这些对象处于完全不同的层级结构中。未来，我们可能还希望它处理其他设备，例如车辆速度或变速箱（例如，听到“向上”时，它将增加\
    \ 1 英里小时的速度，或者切换到下一个更高的档位）。为了良好的面向对象设计，我们需要将语音识别与它控制的设备隔离离开，使其能够处理任何设备而无需直接知道它们是什么。\n\
    \n"
- fmt: "\nThe Command patterns allows us to uncouple an object making a request from\
    \ the object that receives the request and performs the action, by means of a\
    \ \"middle-man\" object known as a \"command object\".\n\nIn its simplest form,\
    \ this requires us to create an interface (which we shall call `IVoiceCommand`)\
    \ with one method:\n\n```csharp\npublic interface IVoiceCommand {\n    void Execute();\n\
    }\n```\n\nWe now need to create implementing classes for each action that we wish\
    \ to take. For example, to turn up the volume of the radio we can create a `VolumeUpCommand`\
    \ class:\n\n```csharp\npublic class VolumeUpCommand : IVoiceCommand\n{\n    private\
    \ Radio radio;\n    public VolumeUpCommand(Radio radio)\n    {\n        this.radio\
    \ = radio;\n    }\n    public virtual void Execute()\n    {\n        radio.VolumeUp();\n\
    \    }\n}\n```\n\nThe class simply takes a reference to a `Radio` object in its\
    \ constructor and invokes its `VolumeUp()` method whenever `Execute()` is called.\n\
    \nWe likewise need to create a `VolumeDownCommand` class for when the volume is\
    \ to be reduced:\n\n```csharp\npublic class VolumeDownCommand : IVoiceCommand\n\
    {\n    private Radio radio;\n    public VolumeDownCommand(Radio radio)\n    {\n\
    \        this.radio = radio;\n    }\n    public virtual void Execute()\n    {\n\
    \        window.VolumeDown();\n    }\n}\n```\n\nControlling an electric window's\
    \ up and down movement is just as easy: this time we create classes implementing\
    \ `IVoiceCommand` passing in a reference to an `ElectricWindow` object:\n\n```csharp\n\
    public class WindowUpCommand : IVoiceCommand\n{\n    private ElectricWindow window;\n\
    \    public WindowUpCommand(ElectricWindow window)\n    {\n        this.window\
    \ = window;\n    }\n    public virtual void Execute()\n    {\n        window.CloseWindow();\n\
    \    }\n}\n\npublic class WindowDownCommand : IVoiceCommand\n{\n    private ElectricWindow\
    \ window;\n    public WindowDownCommand(ElectricWindow window)\n    {\n      \
    \  this.window = window;\n    }\n    public virtual void Execute()\n    {\n  \
    \      window.OpenWindow();\n    }\n}\n```\n\nWe will now define a `SpeechRecogniser`\
    \ class that only knows about `IVoiceCommand` objects; it knows nothing about\
    \ radios or electric windows.\n\n```csharp\npublic class SpeechRecogniser\n{\n\
    \    private ICommand upCommand, downCommand;\n    public virtual void SetCommands(ICommand\
    \ upCommand, ICommand downCommand)\n    {\n        this.upCommand = upCommand;\n\
    \        this.downCommand = downCommand;\n    }\n    public virtual void HearUpSpoken()\n\
    \    {\n        upCommand.Execute();\n    }\n    public virtual void HearDownSpoken()\n\
    \    {\n        downCommand.Execute();\n    }\n}\n```\n\nWe can view what we have\
    \ created diagrammatically as follows:\n\n![](images/00067.jpg)\n\nFigure 15.1\
    \ : Command pattern\n\nClient programs can now create `Radio` and `ElectricWindow`\
    \ instances, along with their respective `IVoiceCommand` instances. The command\
    \ instances are then passed to the `SpeechRecogniser` object so it knows what\
    \ to do. We will first create a `Radio` and an `ElectricWindow` and their respective\
    \ commands:\n\n```csharp\n// Create a radio and its up/down command\nRadio radio\
    \ = new Radio();\nradio.SwitchOn();\nIVoiceCommand volumeUpCommand = new VolumeUpCommand(radio);\n\
    IVoiceCommand volumeDownCommand = new VolumeDownCommand(radio);\n\n// Create an\
    \ electric window and its up/down command\nElectricWindow window = new ElectricWindow();\n\
    IVoiceCommand windowUpCommand = new WindowUpCommand(window);\nIVoiceCommand windowDownCommand\
    \ = new WindowDownCommand(window);\n```\n\nNow create a single `SpeechRecogniser`\
    \ object and set it to control the radio:\n\n```csharp\n// Create a speech recognition\
    \ object\nSpeechRecogniser speechRecogniser = new SpeechRecogniser();\n// Control\
    \ the radio\nspeechRecogniser.SetCommands(volumeUpCommand, volumeDownCommand);\n\
    Console.WriteLine(\"Speech recognition controlling the radio\");\nspeechRecogniser.HearUpSpoken();\n\
    speechRecogniser.HearUpSpoken();\nspeechRecogniser.HearDownSpoken();\n```\n\n\
    Now set the same `SpeechRecogniser` object to control the window:\n\n```csharp\n\
    // Control the electric window\nspeechRecogniser.SetCommands(windowUpCommand,\
    \ windowDownCommand);\nConsole.WriteLine(\"Speech recognition will control the\
    \ window\");\nspeechRecogniser.HearDownSpoken();\nspeechRecogniser.HearUpSpoken();\n\
    ```\n\nIf you run all the above statements you should see output similar to:\n\
    \n```\nRadio now on, volume level 5\nWindow is closed\nSpeech recognition controlling\
    \ the radio\nVolume turned up to level 6\nVolume turned up to level 7\nVolume\
    \ turned down to level 7\nSpeech recognition will control the window\nWindow is\
    \ now open\nWindow is now closed\n```\n\n### Typical uses of the Command Pattern\n\
    \nOne of the most frequent uses of the Command pattern is in UI toolkits. These\
    \ provide pre-built components like graphical buttons and menu items that cannot\
    \ possibly know what needs to be done when, because that is always specific to\
    \ your application.\n\nAnother common aspect of graphical applications is the\
    \ provision of an \"undo\" mechanism. The Command pattern is used to accomplish\
    \ this too; using the example in this chapter, we would add a method to the `IVoiceCommand`\
    \ interface like this:\n\n```csharp\npublic interface IVoiceCommand\n{\n    void\
    \ Execute();\n    void undo();\n}\n```\n\nImplementing classes then provide the\
    \ code for the additional method to reverse the last action, in this example for\
    \ the `VolumeUpCommand` class:\n\n```csharp\npublic class VolumeUpCommand : IVoiceCommand\
    \ {\n    private Radio radio;\n    public VolumeUpCommand(Radio r) {\n       \
    \ radio = r;\n    }\n    public virtual void execute() {\n        radio.VolumeUp();\n\
    \    }\n    public virtual void undo() {\n        radio.VolumeDown();\n    }\n\
    }\n```\n\nMost applications would be slightly more involved than the above example,\
    \ in that you would need to store the state of the object prior to performing\
    \ the code in the `Execute()` method, enabling you to restore that state when\
    \ `Undo()` is called.\n\n# 16. Interpreter\n\n**Type:** Behavioral\n\n**Purpose:**\
    \ Given a language, define a representation for its grammar along with an interpreter\
    \ that uses the representation to interpret sentences in the language.\n\nThe\
    \ satellite-navigation systems fitted to some of the Foobar Motor Company's vehicles\
    \ have a special feature that enables the user to enter a number of cities and\
    \ let it calculate the most northerly, southerly, westerly or easterly, depending\
    \ on which command string is entered. A sample command might look like this:\n\
    \n`london edinburgh manchester southerly`\n\nThe above would result in \"London\"\
    \ being returned, being the most southerly of the three entered cities. You can\
    \ even enter the command string like this:\n\n`london edinburgh manchester southerly\
    \ aberdeen westerly`\n\nThis would first determine that London was the most southerly\
    \ and then use that result (London) and compare it to Aberdeen to tell you which\
    \ of those two is the most westerly. Any number of cities can be entered before\
    \ each of the directional commands of \"northerly\", \"southerly\", \"westerly\"\
    \ and \"easterly\".\n\nYou can think of the above command string consisting of\
    \ the city names and directional keywords as forming a simple \"language\" that\
    \ needs to be interpreted by the satellite-navigation software. The Interpreter\
    \ pattern is an approach that helps to decipher these kinds of relatively simple\
    \ languages.\n\nBefore looking at the pattern itself, we shall create a class\
    \ named `City` which models the essential points of interest for our example,\
    \ which is just the name of the city and its latitude and longitude:\n\n```csharp\n\
    public class City\n{\n    private string name;\n    private double latitude, longitude;\n\
    \    public City(string name, double latitude, double longitude)\n    {\n    \
    \    this.name = name;\n        this.latitude = latitude;\n        this.longitude\
    \ = longitude;\n    }\n}\n```\n"
