  trans: "\n命令模式允许我们通过一个被称为“命令对象”的“中间人”对象，将发出请求的对象与接收请求并执行操作的对象解耦。\n\n在最简单的形式下，这我们需要创建一个包含一个方法的接口（我们将其称为\
    \ `IVoiceCommand`）：\n\n```csharp\npublic interface IVoiceCommand {\n    void Execute();\n\
    }\n```\n\n现在，我们需要为我们想要执行的每个操作创建实现该接口的类。例如，为了增大收音机的音量，我们可以创建一个 `VolumeUpCommand`\
    \ 类：\n\n```csharp\npublic class VolumeUpCommand : IVoiceCommand\n{\n    private\
    \ Radio radio;\n    public VolumeUpCommand(Radio radio)\n    {\n        this.radio\
    \ = radio;\n    }\n    public virtual void Execute()\n    {\n        radio.VolumeUp();\n\
    \    }\n}\n```\n\n该类只需在构造函数中获取一个 `Radio` 对象的引用，并在每次调用 `Execute()` 时调用其 `VolumeUp()`\
    \ 方法。\n\n同样，我们需要在减小音量时创建一个 `VolumeDownCommand` 类：\n\n```csharp\npublic class VolumeDownCommand\
    \ : IVoiceCommand\n{\n    private Radio radio;\n    public VolumeDownCommand(Radio\
    \ radio)\n    {\n        this.radio = radio;\n    }\n    public virtual void Execute()\n\
    \    {\n        window.VolumeDown();\n    }\n}\n```\n\n控制电动窗的上升和下降移动同样简单：这次我们创建实现\
    \ `IVoiceCommand` 的类，并传入一个 `ElectricWindow` 对象的引用：\n\n```csharp\npublic class\
    \ WindowUpCommand : IVoiceCommand\n{\n    private ElectricWindow window;\n   \
    \ public WindowUpCommand(ElectricWindow window)\n    {\n        this.window =\
    \ window;\n    }\n    public virtual void Execute()\n    {\n        window.CloseWindow();\n\
    \    }\n}\n\npublic class WindowDownCommand : IVoiceCommand\n{\n    private ElectricWindow\
    \ window;\n    public WindowDownCommand(ElectricWindow window)\n    {\n      \
    \  this.window = window;\n    }\n    public virtual void Execute()\n    {\n  \
    \      window.OpenWindow();\n    }\n}\n```\n\n现在，我们将定义一个 `SpeechRecogniser` 类，它只认识\
    \ `IVoiceCommand` 对象；它对收音机或电动窗一无所知。\n\n```csharp\npublic class SpeechRecogniser\n\
    {\n    private ICommand upCommand, downCommand;\n    public virtual void SetCommands(ICommand\
    \ upCommand, ICommand downCommand)\n    {\n        this.upCommand = upCommand;\n\
    \        this.downCommand = downCommand;\n    }\n    public virtual void HearUpSpoken()\n\
    \    {\n        upCommand.Execute();\n    }\n    public virtual void HearDownSpoken()\n\
    \    {\n        downCommand.Execute();\n    }\n}\n```\n\n我们可以通过图表查看我们创建的内容：\n\n\
    ![](img/00067.jpg)\n\n图 15.1 : 命令模式\n\n客户端程序现在可以创建 `Radio` 和 `ElectricWindow`\
    \ 实例，以及它们各自 `IVoiceCommand` 实例。然后将命令实例传递给 `SpeechRecogniser` 对象，以便它知道该做什么。我们将首先创建一个\
    \ `Radio`、一个 `ElectricWindow` 以及它们对应的命令：\n\n```csharp\n// 创建一个收音机及其上/下调命令\nRadio\
    \ radio = new Radio();\nradio.SwitchOn();\nIVoiceCommand volumeUpCommand = new\
    \ VolumeUpCommand(radio);\nIVoiceCommand volumeDownCommand = new VolumeDownCommand(radio);\n\
    \n// 创建一个电动窗及其上/下调命令\nElectricWindow window = new ElectricWindow();\nIVoiceCommand\
    \ windowUpCommand = new WindowUpCommand(window);\nIVoiceCommand windowDownCommand\
    \ = new WindowDownCommand(window);\n```\n\n现在创建一个单一的 `SpeechRecogniser` 对象并设置控制收音机：\n\
    \n```csharp\n// 创建一个语音识别对象\nSpeechRecogniser speechRecogniser = new SpeechRecogniser();\n\
    // 控制收音机\nspeechRecogniser.SetCommands(volumeUpCommand, volumeDownCommand);\n\
    Console.WriteLine(\"Speech recognition controlling the radio\");\nspeechRecogniser.HearUpSpoken();\n\
    speechRecogniser.HearUpSpoken();\nspeechRecogniser.HearDownSpoken();\n```\n\n\
    现在设置同一个 `SpeechRecogniser` 对象来控制窗户：\n\n```csharp\n// 控制电动窗\nspeechRecogniser.SetCommands(windowUpCommand,\
    \ windowDownCommand);\nConsole.WriteLine(\"Speech recognition will control the\
    \ window\");\nspeechRecogniser.HearDownSpoken();\nspeechRecogniser.HearUpSpoken();\n\
    ```\n\n如果你运行上述所有语句，你应该看到类似下面的输出：\n\n```\nRadio now on, volume level 5\nWindow\
    \ is closed\nSpeech recognition controlling the radio\nVolume turned up to level\
    \ 6\nVolume turned up to level 7\nVolume turned down to level 7\nSpeech recognition\
    \ will control the window\nWindow is now open\nWindow is now closed\n```\n\n###\
    \ 命令模式的典型用途\n\n命令模式最常用的领域之一是 UI 工具包。这些工具包提供了预构建的组件，如图形按钮和菜单项，这些组件不可能知道在什么时候需要做什么，因为那始终取决于具体的应用程序。\n\
    \n图形化应用的另一个常见方面是提供“撤销”机制。命令模式也用于实现这一点；使用本章的示例，我们会在 `IVoiceCommand` 接口中添加如下方法：\n\
    \n```csharp\npublic interface IVoiceCommand\n{\n    void Execute();\n    void\
    \ undo();\n}\n```\n\n实现类随后提供撤销上一个操作的代码，在本例中为 `VolumeUpCommand` 类：\n\n```csharp\n\
    public class VolumeUpCommand : IVoiceCommand {\n    private Radio radio;\n   \
    \ public VolumeUpCommand(Radio r) {\n        radio = r;\n    }\n    public virtual\
    \ void execute() {\n        radio.VolumeUp();\n    }\n    public virtual void\
    \ undo() {\n        radio.VolumeDown();\n    }\n}\n```\n\n大多数应用程序会比上面的示例复杂一些，因为需要在执行\
    \ `Execute()` 方法之前存储对象的状态，以便在调用 `Undo()` 时恢复该状态。\n\n# 16. 解释器\n\n**类型：** 行为\n\n\
    **目的：** 给定一种语言，定义其语法的表示，以及一个使用该表示来解释语言句子的解释器。\n\n配备在 Foobar Motor 公司车辆上的卫星导航系统有一种特殊功能，允许用户输入多个城市，并让计算最北、最南、最西或最东，取决于输入的命令字符串。示例命令可能如下：\n\
    \n`london edinburgh manchester southerly`\n\n上述命令将返回“London”，它是这三个城市中最靠南的。你甚至这样输入命令字符串：\n\
    \n`london edinburgh manchester southerly aberdeen westerly`\n\n这将首先确定伦敦是最靠南的，然后使用该结果（伦敦）并与\
    \ Aberdeen 进行比较，告诉你哪一个是最靠西的。在每个“northerly”、“southerly”、“westerly”和“easterly”方向命令之前都可以输入任意数量的城市。\n\
    \n你可以将上述由城市名称和方向关键词组成的命令字符串看作一种简单的“语言”，它由卫星导航软件进行解释。解释器模式是一种有助于解码这类相对简单语言的方法。\n\
    \n在查看模式本身之前，我们将创建一个名为 `City` 的类，用于建模我们示例中的核心关注点，即城市的名称、经纬度和经度：\n\n```csharp\n\
    public class City\n{\n    private string name;\n    private double latitude, longitude;\n\
    \    public City(string name, double latitude, double longitude)\n    {\n    \
    \    this.name = name;\n        this.latitude = latitude;\n        this.longitude\
    \ = longitude;\n    }\n}\n```\n"
