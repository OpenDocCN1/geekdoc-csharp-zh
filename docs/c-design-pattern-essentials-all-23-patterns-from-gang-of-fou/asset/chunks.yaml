    ```\n\n## 28. 层 (Layers)\n\n随着应用程序变得越来越大，它们的管理可能会变得困难，大量的互连会导致耦合性增加。层（Layers）模式通过将应用程序划分为层次结构中的两个或多个层来解决这个问题，每层只与其直接下方的层进行通信。这种方法有助于应用程序模块化，并有助于降低类之间的耦合性。\n\
    \n### 客户端-服务器（2 级）架构\n\n层模式的一个简单示例是客户端-服务器模型，其中“客户端”（例如 Web 浏览器）与“服务器”（例如 Web\
    \ 服务器）通信以查看网页：\n\n![](img/00002.jpg)\n\n图 28.1：客户端-服务器架构\n\n在图 28.1 中，你可以看到浏览器向\
    \ Web 服务器发送请求，服务器返回一个响应（例如网页）。如果你想象客户端和服务器分别位于自己的命名空间中，上述内容将如下所示：\n\n![](img/00016.jpg)\n\
    \n图 28.2：客户端-服务器架构\n\n从图 28.2 中可以推断出 `client` 命名空间持有对 `server` 命名空间的引用。`layer`（层）和\
    \ `tier`（级）这两个术通常互换使用，但“layer”更准确地指代逻辑划分，而“tier”指代物理划分。\n\n### 3 级架构\n\n客户端-服务器架构的一个常见扩展是需要访问数据的情况，因此添加了第三层：\n\
    \n![](img/00003.jpg)\n\n图 28.3：3 级架构\n\n图 28.3 显示了浏览器向服务器发送请求，服务器转而向数据库发送请求。如下所示：\n\
    \n![](img/00018.jpg)\n\n图 28.4：3 级架构\n\n从图 28.4 中你可以看到 `client` 命名空间持有对 `server`\
    \ 命名空间的引用，服务器转与 `database` 通信。这种方法有助于隐藏每一层的复杂性。\n\n## VI. 实践中的设计模式\n\n这部分由一个章节组成，展示了一个演示书中描述的某些模式的小型应用程序。所示的模式有：\n\
    \n*   层 (Layers)\n*   单例 (Singleton)\n*   外观模式 (Faade)\n*   工厂 (Factory)\n*  \
    \ 观察者 (Observer)\n*   策略 (Strategy)\n\n## 29. 示例 3 级应用程序\n\n本章开发了一个小型示例 3 级应用程序，该程序使用了常用的设计模式。该应用程序显示了从\
    \ Foobar 公司生产线产下的引擎列表（这意味着列表可能会多次显示相同的引擎类型和尺寸），并提供了构建新引擎以及将数据保存/恢复到持久化存储器中的功能。请注意，这并非设计用于生产级软件；为了关注模式，代码已经经过了简化。\n\
    \n完成后的应用程序如下：\n\n![](img/00020.jpg)\n\n图 29.1：引擎管理表单\n\n每当点击 Build Engine（构建引擎）按钮时，都会出现对话框，允许你创建一个所选类型和尺寸的新引擎并将其添加到列表中：\n\
    \n![](img/00022.jpg)\n\n图 29.2：构建引擎对话框\n\nSave（保存）按钮将列表数据存储到磁盘上的文件中，Restore（恢复）按钮将把列表数据替换为最近保存的值。\n\
    \n该应用程序将使用 3 级架构设计，采用层模式，包括用户界面层、业务模型层和数据库层。每层的类将存储在 `Business` 和 `Database` 命名空间中，根命名空间用于用户界面。每层只与其下一层的层进行通信，如下所示：\n\
    \n![](img/00024.jpg)\n\n图 29.3：作为命名空间的 3 级层模式\n\n### 数据库层\n\n从 `Database` 命名空间开始，我们将一个对象称为\
    \ `Entity`。由于数据库表通常具有主键，我们将使用单例模式定义 `EntityKeyGenerator` 类：\n\n```csharp\nnamespace\
    \ Database\n{\n    [Serializable]\n    class EntityKeyGenerator\n    {\n     \
    \   // 静态成员\n        private static volatile EntityKeyGenerator instance;\n  \
    \      public static EntityKeyGenerator Instance\n    }\n}\n```\n\n"
- fmt: "\n```csharp\n{\n    get\n    {\n        if (instance == null)\n        {\n\
    \            instance = new EntityKeyGenerator();\n        }\n        return instance;\n\
    \    }\n}\n// instance variables\nprivate int nextKey;\n// private constructor\n\
    private EntityKeyGenerator()\n{\n}\n// instance methods\nvirtual int NextKey\n\
    {\n    return ++nextKey;\n}\n}\n}\n```\n\n### EntityKeyGenerator and EntityTable\n\
    \nTo generate the next unique key for any `IEngine` entity just needs a call to:\n\
    \n`EntityKeyGenerator.Instance.NextKey;`\n\nWe will now define a simple `EntityTable`\
    \ class that can store a dictionary of objects keyed by a sequential numeric id:\n\
    \n```csharp\nnamespace Database\n{\n    [Serializable]\n    public class EntityTable\n\
    \    {\n        private EntityKeyGenerator keyGenerator;\n        private IDictionary<int?,\
    \ object> entities;\n        [field:NonSerialized] public event EventHandler EntityTableItemAdded;\n\
    \        [field:NonSerialized] public event EventHandler EntityTableRestored;\n\
    \        internal EntityTable(EntityKeyGenerator keyGenerator)\n        {\n  \
    \          this.keyGenerator = keyGenerator;\n            entities = new Dictionary<int?,\
    \ object>();\n        }\n        internal virtual object GetByKey(int? key)\n\
    \        {\n            return entities[key];\n        }\n        internal virtual\
    \ ICollection<object> All()\n        {\n            return entities.Values;\n\
    \        }\n        internal virtual int? AddEntity(object value)\n        {\n\
    \            int? key = keyGenerator.NextKey;\n            entities[key] = value;\n\
    \            EntityAddedEventArgs args = new EntityAddedEventArgs();\n       \
    \     args.objectAdded = value;\n            if (EntityTableItemAdded != null)\n\
    \            {\n                EntityTableItemAdded(this, args);\n          \
    \  }\n            return key;\n        }\n        internal virtual void Restore(EntityTable\
    \ restoredTable)\n        {\n            entities.Clear();\n            foreach\
    \ (KeyValuePair<int?, object> pair in restoredTable.entities)\n            {\n\
    \                entities.Add(pair.Key, pair.Value);\n            }\n        }\n\
    \        // Nested class for entity added eventargs\n        public class EntityAddedEventArgs\
    \ : EventArgs\n        {\n            public object objectAdded;\n        }\n\
    \    }\n}\n```\n\nNote the following:\n\n- The constructor requires an `EntityKeyGenerator`\
    \ object it can use to generate the next key for this particular type;\n- The\
