  raw: 'Purpose: Separate the construction of a complex object from its representation
    so that the same construction process can create different representations.


    Example usage: Useful when there are several steps needed to create an object.


    Consequences: Enables variations of a products internal representation. Isolates
    construction and representation.


    ![](images/00036.jpg)


    *   `IBuilder` defines an interface for creating parts of a ''product'' object;


    *   `ConcreteBuilder` creates and assembles the ''product'' parts step-by-step
    and provides a method to retrieve it during or after assembly;


    *   `Director` controls the actual assembly process.


    Chain of Responsibility


    Type: Behavioural


    Purpose: Avoid coupling the sender of a request to its receiver by giving more
    than one object a chance to handle the request. Chain the receiving objects and
    pass the request along the chain until an object handles it.


    Example usage: When more than one object can handle a request and the handler
    is not known in advance.


    Consequences: Not every request needs to be handled, or maybe it needs to be handled
    by more than one handler.


    ![](images/00019.jpg)


    *   `IHandler` defines an interface for handling requests;


    *   `ConcreteHandler1` and `ConcreteHandler2` each decide if they can handle the
    request itself or if it should be passed on to its successor.


    Client programs send their requests to the first object in the chain.


    Command


    Type: Behavioural


    Purpose: Encapsulate a request as an object, thereby letting you parameterise
    clients with different requests, queue or log requests, and support undoable operations.


    Example usage: UI controls such as menu items and toolbar buttons. Undo/redo mechanisms.


    Consequences: Strive to keep separate the objects that invoke the operation from
    the object that performs it.


    ![](images/00039.jpg)


    *   `ICommand` is the interface for executing an operation;


    *   `ConcreteCommand` performs the operation on the `Receiver`;


    *   `Invoker` asks the command to be carried out;


    *   `Receiver` knows how to perform the operations.


    Composite


    Type: Structural


    Purpose: Compose objects into tree structures to represent part-whole hierarchies.
    Composite lets clients treat individual objects and compositions of objects uniformly.


    Example usage: Graphical component hierarchies, etc.


    Consequences: Simple objects can be combined into complex assemblies and all treated
    through a common interface. Adding new components should be straightforward.


    ![](images/00041.jpg)


    *   `IComponent` is the interface for both leaves and composites;


    *   `LeafComponent` defines objects that have no children;


    *   `CompositeComponent` defines objects that may have children.


    Decorator


    Type: Structural


    Purpose: Attach additional responsibilities to an object dynamically. Decorators
    provide a flexible alternative to subclassing for extending functionality.


    Example usage: GUI toolkits, file and object input/output streams (e.g. buffering).


    Consequences: Can be more flexible than direct inheritance and reduce number of
    classes required.


    ![](images/00043.jpg)


    *   `IComponent` defines the interface for objects that can have responsibilities
    added to them dynamically;


    *   `ConcreteComponent` implements the `IComponent` interface;


    *   `Decorator` maintains a reference to an `IComponent` object as well as defining
    an interface that matches that of `IComponent`;


    *   `AddedStateDecorator` and `AddedBehaviourDecorator` each decorate an `IComponent`
    by adding additional instance variables and/or methods.


    Facade


    Type: Structural


    Purpose: Provide a unified interface to a set of interfaces in a subsystem. Facade
    defines a higher-level interface that makes the subsystem easier to use.


    Example usage: To simplify access to several objects through a single ''facade''
    object.


    Consequences: Needs a new class to be created to serve as the ''facade''.


    ![](images/00045.jpg)


    *   `Facade` defines the class that provides the simplified interface to other
    classes;


    *   `SomeClassA`, etc. are various classes, related or not.


    Factory Method


    Type: Creational


    Purpose: Define an interface for creating an object, but let subclasses decide
    which class to instantiate.


    Example usage: When you can''t anticipate the specific type of object to be created,
    or you want to localise the knowledge of which class gets created.


    Consequences: Reduces the need for clients to use ''new'' to instantiate objects.


    ![](images/00047.jpg)


    *   `IProduct` defines the interface of the product that is to be created;


    *   `ConcreteProduct` is an implementation of a particular product;


    *   `Factory` declares the factory method that returns a `IProduct` object;


    *   `ConcreteFactory` implements the factory method defined in `Factory` to return
    an instance of `IProduct`.


    Flyweight


    Type:Structural


    Purpose: Use sharing to support large numbers of fine-grained objects efficiently.


    Example usage: Text/graphic editors, etc.


    Consequences: Saves memory through sharing shared state.


    ![](images/00048.jpg)


    *   `IFlyweight` defines the interface through which flyweight objects can act
    on extrinsic state;


    *   `ConcreteFlyweight` implements `IFlyweight` and stores intrinsic state. Must
    be shareable;


    *   `FlyweightFactory` creates and manages the flyweight objects through a ''pooling''
    mechanism.


    Client programs maintain references to the flyweights obtained through the factory.


    Interpreter


    Type: Behavioural


    Purpose: Given a language, define a representation for its grammar along with
    an interpreter that uses the representation to interpret sentences in the language.


    Example usage: Simple grammars and mini-language processing.


    Consequences: Not suitable for complex grammars and language processing.


    ![](images/00050.jpg)


    *   `AbstractExpression` defines the abstract method to interpret an element;


    *   `TerminalExpression` extends `AbstractExpression` for language elements that
    terminate an expression;


    *   `NonTerminalExpression` extends `AbstractExpression` for language elements
    that are just part of an expression;


    *   `Context` is the object that is being parsed (e.g. the grammar or language).


    Iterator


    Type: Behavioural


    Purpose: Provide a way to access the elements of an aggregate object sequentially
    without exposing its underlying representation.


    Example usage: Wherever a collection or array of objects or values need to be
    processed in turn.


    Consequences: The for-each syntax simplifies usage.


    ![](images/00052.jpg)


    *   `IIterator` defines the interface for the iterator;


    *   `ConcreteIterator` implements `IIterator` to perform the processing of each
    element in `IAggregate`;


    *   `IAggregate` defines the interface for the collection to be processed;


    *   `ConcreteAggregate` implements `IAggregate` for the actual collection.


    Mediator


    Type: Behavioural


    Purpose: Define an object that encapsulates how a set of objects interact. Mediator
    promotes loose coupling by keeping objects from referring to each other explicitly,
    and it lets you vary their interaction independently.


    Example usage: Dialogs that control UI components, etc.


    Consequences: The Mediator could be defined to use the Observer pattern to monitor
    the components.


    ![](images/00054.jpg)


    *   `IMediator` defines the interface for communication with `IColleague` objects;


    *   `ConcreteMediator` implements the `IMediator` interface and performs the communication;


    *   `IColleague` defines the interface for a component that needs communication
    with the `IMediator`;


    *   `ConcreteColleague1` and `ConcreteColleague2` implement the `IColleague` interface
    and performs the communication with the `IMediator` such that it needs no knowledge
    of any other `IColleague`.


    Memento


    Type: Behavioural


    Purpose: Without violating encapsulation, capture and externalise an object''s
    internal state so that it can be restored to this state later.


    Example usage: Undo & Redo processing, database transactions, etc.'
