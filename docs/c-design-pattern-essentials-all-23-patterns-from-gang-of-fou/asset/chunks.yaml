    22. Strategy


    Type: Behavioural


    Purpose: Define a family of algorithms, encapsulate each one, and make them interchangeable.
    Strategy lets the algorithm vary independently from clients that use it.


    The Foobar Motor Company wishes to implement a new type of automatic gearbox for
    their cars that will be able to be switched between its standard mode and a special
    ''sport'' mode. The different modes will base the decision of which gear should
    be selected depending upon the speed of travel, size of the engine and whether
    it is turbocharged. And it''s quite possible they will want other modes in the
    future, such as for off-road driving.


    Just as with the discussion in the chapter for the State pattern, it would be
    inflexible to use a series of `if...else...` statements to control the different
    gearbox modes directly inside our vehicle classes. Instead, we shall encapsulate
    the concept that varies and define a separate hierarchy so that each different
    gearbox mode is a separate class, each in effect being a different ''strategy''
    that gets applied. This approach allows the actual strategy being used to be isolated
    from the vehicle. In our example, we shall only apply this to the cars:


    ![](images/00017.jpg)


    Figure 22.1 : Strategy pattern


    The `IGearboxStrategy` interface defines the method to control the gear:


    `public interface IGearboxStrategy`


    `{`


    `    void EnsureCorrectGear(IEngine engine, int speed);`


    `}`'
