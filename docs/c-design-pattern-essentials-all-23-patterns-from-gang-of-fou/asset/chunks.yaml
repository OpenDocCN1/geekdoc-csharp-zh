  trans: "\n\n经验表明，某些面向对象的方法比其他方法更灵活。以下是本书中的模式力求遵循的主要原则总结：\n\n1. **面向接口编程，而不是面向实现编程。**\
    \ 这里的“接口”是指抽象的通用概念，可以指一个 `C#` 接口或抽象类。为了实现这一点，在声明变量、构造函数和方法参数等时，尽可能使用最通用的类型（例如\
    \ `interface`）。这样做为运行时使用的实际类型提供了额外的灵活性。\n\n2. **优先使用对象组合而不是继承。** 当一个类与另一个类以某种方式相关联时，你应该区分“是一个”（is\
    \ a，或“是……的一种类型”）关系和“有一个”（has a）关系。在之前描述的 `IVehicle` 和 `IEngine` 层次结构中，说 `AbstractCar`\
    \ “是一个” `IVehicle`、`Saloon` “是一个” `AbstractCar` 是正确的。但说 `IVehicle` “是一个” `IEngine`\
    \ 是错误的，而应该说是 `IVehicle` “有一个”一个 `IEngine`。因此，继承被正当用于用于 `AbstractCar` 和 `Saloon`，而对象组合则用于\
    \ `IVehicle` 和 `IEngine` 之间。不要受到为了少写一些方法就使用继承的诱。有时，即使“是一个”关系看起来是自然选择，使用“有一个”关系也更灵活。你将在\
    \ `Decorator` 模式中看到这方面的例子。\n\n3. **保持对象松耦合。** 理想情况下，类应该只对某件事建模，并且只由真正需要的其他对象组成（例如一个\
    \ `IVehicle` 需要一个 `IEngine`）。问问自己，如果你想在另一个完全不同的应用程序中使用你编写的类，会发生什么？哪些“包袱”（即其他类）也需要被复制？通过将这些减少到最低，你可以让类更具重用性。使用松耦合的模式良好示例是\
    \ `Observer`。\n\n4. **封装变化的概念。** 如果你写了一个类，其中某些部分对于每个实例都是相同的，但类的另一部分随每个实例变化，考虑将后者提取到自己的类，并由原类引用该类。使用这一原则的模式示例是\
    \ `Strategy`。\n\n## 通用建议\n\n随着我们详细探索这些模式，上述原则将变得更加明显。你还应该注意到，书中描述的模式为特定问题提供了一种通用方法。修改或调整它们以更好地适应你的特定问题是完全可以的。将多个模式结合起来解决复杂问题也是非常常见的。\n\
    \n然而，请记住你应该努力保持简单。在读完像这样的书后，很容易认为你必须找到一个模式来解决特定问题，而实际上可能有更简单的解决方案。极端编程（XP）的格言之一是“你将不需要它”，这个理念是认为你应该避免在需要功能之前添加功能，这种哲学也可以应用于模式；要小心仅仅为了应用某种模式就添加不必要的特征。模式不是“万灵妙药”，它们只是你工具箱中的另一组工具，尽管它们是一组不可或缺的工具。\n\
    \n利用你的知识和经验来判断模式是否适用于你的情况，以及如果适用，你需要调整到什么程度。应用模式可能有益的良好例子是在正在“重构”现有代码时。重构是你改变某些软件的结构但不改变其行为，以提高其可维护性和灵活性。这提供了一个检查代码的好机会，看看模式是否可以提供更好的结构，例如替换条件判断或定义工厂类以辅助对象实例化。\n\
    \n模式除了 C# 之外还应用于许多编程语言，特别是面向对象的语言，事实上还应用于其他领域，其起源于对架构设计的应用。新的模式正在定期地开发和应用，因此你可以将本书仅视为该主题的一个起点。\n\
    \n## 第二部分。创建性模式\n\n本部分描述了五种创建性模式，即有助于管理对象实例化的模式。\n\n* **抽象工厂 (Abstract Factory)**：提供一个接口用于创建一组相关或依赖的对象的族，而不指定它们的具体类；\n\
    * **构建器 (Builder)**：将复杂对象的构建与它的表示分离开，使得相同的构建过程可以创建不同的表示；\n* **工厂方法 (Factory Method)**：定义一个用于创建对象的接口，但让子类决定实例化哪一个类；\n\
    * **原型模式 (Prototype)**：使用原型实例指定要创建的对象的类型，并通过复制原型来创建新对象；\n* **单例模式 (Singleton)**：确保一个类只允许创建一个对象，并提供单一的访问点。\n\
    \n### 2. 抽象工厂\n\n**类型**：创建性\n\n**目的**：提供一个接口用于创建一组相关或依赖的对象的族，而不指定它们的具体类。\n\nFoobar\
    \ 汽车公司生产汽车和面包车，在建造时包括（在许多东西之外）车壳、底盘和窗户玻璃。虽然汽车和面包车都需要所有相同类型的组件，但每种类型的细节取决于它是被作汽车还是面包车。\n\
    \n换句话之：\n* 汽车的车壳不同于面包车的车壳；\n* 汽车的底盘不同于面包车的底盘；\n* 汽车的玻璃不同于面包车的玻璃。\n\n因此，当我们需要建造一辆车辆时，我们可以认为组件是来自不同的“族”；也就是说，当我们制造汽车时，我们使用一组组件；当制造面包车时，我们使用另一组组件。\n\
    \n因此，我们可以将组件建模为简单的层次结构，如图所示：\n\n![](img/00038.jpg)\n\n图 2.1 `IBody`、`IChassis`\
    \ 和 `IGlassware` 类层次结构\n\n你可以看到，接口 `IBody` 包含了 `CarBody` 和 `VanBody` 的实现。同样，我们为\
    \ `IChassis` 和 `IGlassware` 有类似的独立的层次结构。\n\n`IBody` 层次结构的代码非常简单：\n\n```csharp\n\
    public interface IBody\n{\n    string BodyParts { get; }\n}\n\npublic class CarBody\
    \ : IBody\n{\n    public virtual string BodyParts\n    {\n        get\n      \
    \      return \"Body shell parts for a car\";\n        }\n    }\n}\n\npublic class\
    \ VanBody : IBody\n{\n    public virtual string BodyParts\n    {\n        get\n\
    \            return \"Body shell parts for a van\";\n        }\n    }\n}\n```\n\
    \n`IChassis` 层次结构的代码几乎相同：\n\n```csharp\npublic interface IChassis\n{\n    string\
    \ ChassisParts { get; }\n}\n\npublic class CarChassis : IChassis\n{\n    public\
    \ virtual string ChassisParts\n    {\n        get\n            return \"Chassis\
    \ parts for a car\";\n        }\n    }\n}\n\npublic class VanChassis : IChassis\n\
    {\n    public virtual string ChassisParts\n    {\n        get\n            return\
    \ \"Chassis parts for a van\";\n        }\n    }\n}\n```\n\n同样，`IGlassware` 层次结构的代码如下：\n\
    \n```csharp\npublic interface IGlassware\n{\n    string GlasswareParts { get;\
    \ }\n}\n\npublic class CarGlassware : IGlassware\n{\n    public virtual string\
    \ GlasswareParts\n    {\n        get\n            return \"Window glassware for\
    \ a car\";\n        }\n    }\n}\n\npublic class VanGlassware : IGlassware\n{\n\
    \    public virtual string GlasswareParts\n    {\n        get\n            return\
    \ \"Window glassware for a van\";\n        }\n    }\n}\n```\n\n"
- fmt: "\nNow we need a way of getting the correct family of parts (either for a car\
    \ or for a van) but without having to explicitly instantiate the specific type\
    \ in client programs each time we require them. To accomplish this, we shall define\
    \ \"factory\" classes that will do this for us:\n\n![](images/00042.jpg)\nFigure\
    \ 2.2 : Abstract Factory pattern\n\nThe `AbstractVehicleFactory` class is an abstract\
    \ class that defines the abstract methods `CreateBody()`, `CreateChassis()`, and\
    \ `CreateGlassware()`, returning an `IBody`, `IChassis` and `IGlassware` object\
    \ respectively:\n\n```csharp\npublic abstract class AbstractVehicleFactory\n{\n\
    \    public abstract IBody CreateBody();\n    public abstract IChassis CreateChassis();\n\
    \    public abstract IGlassware CreateGlassware();\n}\n```\n\nThe concrete subclass\
    \ `CarFactory` returns the objects specific for the car family:\n\n```csharp\n\
    public class CarFactory : AbstractVehicleFactory\n{\n    public override IBody\
    \ CreateBody()\n    {\n        return new CarBody();\n    }\n    public override\
    \ IChassis CreateChassis()\n    {\n        return new CarChassis();\n    }\n \
    \   public override IGlassware CreateGlassware()\n    {\n        return new CarGlassware();\n\
    \    }\n}\n```\n\nThe concrete subclass `VanFactory` returns the objects specific\
    \ for the van family:\n\n```csharp\npublic class VanFactory : AbstractVehicleFactory\n\
    {\n    public override IBody CreateBody()\n    {\n        return new VanBody();\n\
    \    }\n    public override IChassis CreateChassis()\n    {\n        return new\
    \ VanChassis();\n    }\n    public override IGlassware CreateGlassware()\n   \
    \ {\n        return new VanGlassware();\n    }\n}\n```\n\nNow it just remains\
    \ for client programs to instantiate the appropriate 'factory' after which it\
    \ can obtain the correct parts without having to specify whether they are for\
    \ a car or a van:\n\n![](images/00064.jpg)\nFigure 2.3 : How clients use Abstract\
    \ Factory\n\n```csharp\nstring whatToMake = \"car\"; // or \"van\"\nAbstractVehicleFactory\
    \ factory = null;\n// Create the correct 'factory'...\nif (whatToMake.Equals(\"\
    car\"))\n{\n    factory = new CarFactory();\n}\nelse\n{\n    factory = new VanFactory();\n\
    }\n// Create the vehicle's component parts...\n// These will either be all car\
    \ parts or all van parts\nIBody vehicleBody = factory.CreateBody();\nIChassis\
    \ vehicleChassis = factory.CreateChassis();\nIGlassware vehicleGlassware = factory.CreateGlassware();\n\
    // Show what we've created...\nConsole.WriteLine(vehicleBody.BodyParts);\nConsole.WriteLine(vehicleChassis.ChassisParts);\n\
    Console.WriteLine(vehicleGlassware.GlasswareParts);\nConsole.Read();\n```\n\n\
    Therefore your client program needs to know if it is making a car or a van, but\
    \ once it has instantiated the correct factory all the methods to create the parts\
    \ can be done using an identical set of method calls.\n\nThe main disadvantage\
    \ of the Abstract Factory pattern arises if you need to add additional 'products'.\
    \ For example, if we now need to include lights in the family of components, we\
    \ would need to amend `AbstractVehicleFactory`, `CarFactory` and `VanFactory`,\
    \ in addition to creating a new `ILights` hierarchy (`CarLights` and `VanLights`).\n\
    \n# 3. Builder\n\n**Type:** Creational\n\n**Purpose:** Separate the construction\
    \ of a complex object from its representation so that the same construction process\
    \ can create different representations.\n\nThe Foobar Motor Company makes cars\
    \ and vans, and the construction process of each differs in detail; for example,\
    \ the body shell of a van comprises a cab area and a large reinforced storage\
    \ area, whereas a saloon car comprises a passenger area and a luggage area (i.e.\
    \ boot). And of course there a number of complex steps that have to be undertaken\
    \ regardless of what type of vehicle is being built.\n\nThe Builder pattern facilitates\
    \ the construction of complex objects by separating the individual steps into\
    \ separate methods in a Builder hierarchy, and then using a Director object to\
    \ specify the required steps in the correct order. Finally, the finished product\
    \ is retrieved from the Builder.\n\nThe following diagram shows these relationships:\n\
    \n![](images/0031.jpg)\nFigure 3.1 : Builder\n\nWe start off the `VehicleBuilder`\
    \ class:\n\n```csharp\npublic abstract class VehicleBuilder\n{\n    public virtual\
    \ void BuildBody() {}\n    public virtual void Boot() {}\n    public virtual void\
    \ BuildChassis() {}\n    public virtual void BuildPassengerArea() {}\n    public\
    \ virtual void BuildReinforcedStorageArea() {}\n    public virtual void BuildWindows()\
    \ {}\n    public abstract IVehicle Vehicle {get; }\n}\n```\n\nNote how this class\
    \ defines all 'build' methods for both cars and vans, and provides empty implementations\
    \ for each as a default. The abstract `Vehicle` property is for returning the\
    \ finished vehicle. The `CarBuilder` class inherits from `VehicleBuilder` and\
    \ overrides the appropriate methods:\n\n```csharp\npublic class CarBuilder : VehicleBuilder\n\
    {\n    private AbstractCar carInProgress;\n    public CarBuilder(AbstractCar car)\n\
    \    {\n        carInProgress = car;\n    }\n    public override void BuildBody()\n\
    \    {\n        Console.WriteLine(\"building body\");\n    }\n    public override\
    \ void Boot()\n    {\n        Console.WriteLine(\"building boot\");\n    }\n \
    \   public override void BuildChassis()\n    {\n        Console.WriteLine(\"building\
    \ chassis\");\n    }\n    public override void BuildPassengerArea()\n    {\n \
    \       Console.WriteLine(\"building passenger area\");\n    }\n    public override\
    \ void BuildWindows()\n    {\n        Console.WriteLine(\"building windows\");\n\
    \    }\n    public override IVehicle Vehicle\n    {\n        get\n        {\n\
    \            return carInProgress;\n        }\n    }\n}\n```\n\nNote that the\
    \ `BuildReinforcedStorageArea()` method was not overridden since it is not applicable\
    \ to cars. The `VanBuilder` class overrides the appropriate methods to build a\
    \ van:\n\n```csharp\npublic class VanBuilder : VehicleBuilder\n{\n    private\
    \ AbstractVan vanInProgress;\n    public VanBuilder(AbstractVan van)\n    {\n\
    \        vanInProgress = van;\n    }\n    public override void BuildBody()\n \
    \   {\n        Console.WriteLine(\"building van body\");\n    }\n    public override\
    \ void BuildChassis()\n    {\n        Console.WriteLine(\"building van chassis\"\
    );\n    }\n    public override void BuildReinforcedStorageArea()\n    {\n    \
    \    Console.WriteLine(\"building van storage area\");\n    }\n    public override\
    \ void BuildWindows()\n    {\n        Console.WriteLine(\"building van windows\"\
    );\n    }\n    public override IVehicle Vehicle\n    {\n        get\n        {\n\
    \            return vanInProgress;\n        }\n    }\n}\n```\n\nNote that the\
    \ `Boot()` and `BuildPassengerArea()` methods were not overridden since they are\
