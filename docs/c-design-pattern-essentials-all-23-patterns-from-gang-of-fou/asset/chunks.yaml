    \n## 15. Command Type: Behavioural\n\n### Purpose\nEncapsulate a request as an\
    \ object, thereby letting you parameterise clients with different requests, queue\
    \ requests, and support undoable operations. The vehicles made by the Foobar Company\
    \ each have an installed radio; this is modelled by the following `Radio` class:\n\
    \n```csharp\npublic class Radio\n{\n    public const MinVolume = 0;\n    public\
    \ const MaxVolume = 10;\n    public const DefaultVolume = 5;\n    private bool\
    \ switchedOn;\n    private int volume;\n    public Radio()\n    {\n        switchedOn\
    \ = false;\n        volume = DefaultVolume;\n    }\n    public virtual bool On\n\
    \    {\n        get\n        {\n            return switchedOn;\n        }\n  \
    \  }\n    public virtual int Volume\n    {\n        get\n        {\n         \
    \   return volume;\n        }\n    }\n    public virtual void SwitchOn()\n   \
    \ {\n        switchedOn = true;\n        Console.WriteLine(\"Radio now on, volume\
    \ level \" + Volume);\n    }\n    public virtual void SwitchOff()\n    {\n   \
    \     switchedOn = false;\n        Console.WriteLine(\"Radio now off\");\n   \
    \ }\n    public virtual void VolumeUp()\n    {\n        if (On)\n        {\n \
    \           if (Volume < MaxVolume)\n            {\n                volume++;\n\
    \                Console.WriteLine(\"Volume up to level \" + Volume);\n      \
    \      }\n        }\n    }\n    public virtual void Down()\n    {\n        if\
    \ (On)\n        {\n            if (Volume > MinVolume)\n            {\n      \
    \          volume--;\n                Console.WriteLine(\"Volume down to level\
    \ \" + Volume);\n            }\n        }\n    }\n}\n```\n\nAs you can see, the\
    \ class enables the radio to be switched on and off, and provided it is switched\
    \ will enable the volume to be increased or decreased one level at a time, within\
    \ the range 1 to 10. Some of the vehicles also have electrically operated windows\
    \ with simple up & down buttons, as by the following `ElectricWindow` class:\n\
    \n```csharp\npublic class ElectricWindow\n{\n    private bool open;\n    public\
    \ ElectricWindow()\n    {\n        open = false;\n        Console.WriteLine(\"\
    Window is closed\");\n    }\n    public virtual bool Open\n    {\n        get\n\
    \        {\n            return open;\n        }\n    }\n    public virtual bool\
    \ Closed\n    {\n        get\n        {\n            return (!open);\n       \
    \ }\n    }\n    public virtual void OpenWindow()\n    {\n        if (Closed)\n\
    \        {\n            open = true;\n            Console.WriteLine(\"Window is\
    \ now open\");\n        }\n    }\n    public virtual void CloseWindow()\n    {\n\
    \        if (Open)\n        {\n            open = false;\n            Console.WriteLine(\"\
    Window is now closed\");\n        }\n    }\n}\n```\n\nEach of the devices (the\
    \ radio and the electric window) has separate controls, typically buttons, to\
    \ manage their state. But suppose the Foobar Motor Company now wishes to introduce\
    \ speech recognition to their top-of-the-range vehicles and have them perform\
    \ as follows:\n\n* If the speech-recognition system is in \"radio\" mode, then\
    \ if it hears the word \"up\" or \"down\" it adjusts the radio volume;\n* If the\
    \ speech-recognition system is in \"window\" mode, then if it hears the word \"\
    up\" or \"down\" it closes or opens the driver's door window.\n\nWe therefore\
    \ need the speech-recognition system to be able to handle either `Radio` objects\
    \ or `ElectricWindow` objects, which are of course in completely separate hierarchies.\
    \ We might also want it to handle other devices in the future, such as the vehicle's\
    \ speed or the gearbox (e.g. upon hearing \"up\" it would increase the speed by\
    \ 1mph or it would change to the next higher gear). For good object-oriented design\
    \ we need to isolate the speech-recognition from the devices it controls, so it\
    \ can cope with any device without directly knowing what they are.\n"
