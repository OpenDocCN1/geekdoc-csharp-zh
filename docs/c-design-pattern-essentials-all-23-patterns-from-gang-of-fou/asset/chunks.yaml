    Printing brochure...\");\n    }\n}\n```\n\n为了实现该模式，我们将创建一个 `VehicleFacade` 类，该类定义了一个方法，代表我们使用上述类来准备指定的车辆：\n\
    \n![](img/00053.jpg)\n\n图 11.1 :  Fac 面模式\n\n```csharp\npublic class VehicleFacade\n\
    {\n    public virtual void PrepareForSale(IVehicle vehicle)\n    {\n        Registration\
    \ reg = new Registration(vehicle);\n        reg.AllocateVehicleNumber();\n   \
    \     reg.AllocateLicensePlate();\n        Documentation.PrintBrochure(vehicle);\n\
    \        vehicle.CleanInterior();\n        vehicle.CleanExteriorBody();\n    \
    \    vehicle.PolishWindows();\n        vehicle.TakeForTestDrive();\n    }\n}\n\
    ```\n\n客户端程序只需要在 `VehicleFacade` 实例上调用 `PrepareForSale()` 方法，因此不需要了解需要执行什么以及还需要哪些其他对象。如果在特殊情况下需要不同的操作，各个方法仍然可以根据需要单独调用。\n\
    \n# 12. 享用权重模式 (Flyweight)\n\n**类型：** 结构型  \n**目的：** 使用共享来高效地支持大量的细粒度对象。\n\n某些程序需要创建大量特定类型的对象，如果这些对象恰好具有大量状态，那么实例化许多对象会迅速消耗内存。在考虑对象状态时，我们经常注意到，至少部分状态可能可以在一组对象之间共享。\n\
    \n对于 Foobar 汽车公司，`IEngine` 层次结构就是一个很好的例子：\n\n![](img/00037.jpg)\n\n图 12.1 : `IEngine`\
    \ 类层次结构\n\n我们对 `IEngine` 的简单实现只定义了两个属性读取：`Size` 和 `Turbo`。假设我们如下实例化了两个引擎：\n\n\
    ```csharp\nEngine engine1 = new StandardEngine(1300);\nEngine engine2 = new StandardEngine(1300);\n\
    ```\n\n上述操作会在内存中创建两个独立的对象，尽管它们的状态是相同的。这可以被视为它的内部状态；即所有 1300cc 的标准引擎都将为引擎尺寸存储 1300，并为是否涡轮增压存储\
    \ false。创建数百或数千这样的对象将浪费内存，特别是由于一个更真实的 `Engine` 类需要更多的变量，而这些变量的值也将被共享。\n\n为了本章的目的，`IEngine`\
    \ 接口将添加另一个方法，称为 `Diagnose()`。这个新方法将一个 `DiagnosticTool` 对象作为其参数，这个参数可以被认为是它的外部状态，因为它的值实际上并没有存储在\
    \ `Engine` 对象中；它被使用是为了让引擎可以使用它来运行诊断检查。\n\n`DiagnosticTool` 接口如下：\n\n```csharp\n\
    public interface IDiagnosticTool\n{\n    void RunDiagnosis(object obj);\n}\n```\n\
    \n`EngineDiagnosticTool` 实现了上述对引擎进行诊断的功能：\n\n```csharp\npublic class EngineDiagnosticTool\
    \ : IDiagnosticTool\n{\n    public virtual void RunDiagnosis(object obj)\n   \
    \ {\n        Console.WriteLine(\"Starting diagnostic tool for \" + obj);\n   \
    \     Thread.Sleep(5000);\n        Console.WriteLine(\"Engine diagnosis complete\"\
    );\n    }\n}\n```\n\n为了模拟长时间运行的过程，该方法暂停了几秒钟。在上述工作的基础上，我们现在可以在 `IEngine` 接口中添加一个合适的方法：\n\
    \n```csharp\npublic interface IEngine\n{\n    // 具有内部（即共享）状态的属性\n    int Size\
    \ { get; }\n    bool Turbo { get; }\n    // 具有外部（即非共享）状态的方法\n    void Diagnose(IDiagnosticTool\
    \ tool);\n}\n```\n\n`AbstractEngine` 中此新方法的实现简单地向 `IDiagnosticTool` 发出回调：\n\n\
    ```csharp\npublic virtual void Diagnose(IDiagnosticTool tool) {\n    tool.RunDiagnosis(this);\n\
    }\n```\n\n享用权重模式允许你引用大量相同类型且具有相同状态的对象，但通过实例化所需数量的实际对象来实现。这通常通过分配一个可以共享的对象“池”来，这由一个“享用权重工厂”类来决定。客户端程序仅通过工厂访问引擎：\n\
    \n![](img/0056.jpg)\n\n图 12.2 : 享用权重模式\n\n`EngineFlyweightFactory` 类如下：\n\n```csharp\n\
    public class EngineFlyweightFactory\n{\n    private Dictionary<int?, IEngine>\
    \ standardEnginePool;\n    private Dictionary<int?, IEngine> turboEnginePool;\n\
    \n    public EngineFlyweightFactory()\n    {\n        standardEnginePool = new\
    \ Dictionary<int?, IEngine>();\n        turboEnginePool = new Dictionary<int?,\
    \ IEngine>();\n    }\n    public virtual IEngine GetStandardEngine(int size)\n\
    \    {\n        IEngine e = null;\n        if (!standardEnginePool.TryGetValue(size,\
    \ out e))\n        {\n            e = new StandardEngine(size);\n            standardEnginePool[size]\
    \ = e;\n        }\n        return e;\n    }\n\n    public virtual IEngine GetTurboEngine(int\
    \ size)\n    {\n        IEngine e = null;\n        if (!turboEnginePool.TryGetValue(size,\
    \ out e))\n        {\n            e = new TurboEngine(size);\n            turboEnginePool[size]\
    \ = e;\n        }\n        return e;\n    }\n}\n```\n\n该类使用了两个字典（一个用于标准引擎，另一个用于涡轮引擎）。每当请求特定类型和尺寸的引擎，如果已经创建了类似的，就会返回而不是实例化一个新的。客户端程序这样使用工厂：\n\
    \n```csharp\n// 创建享用权重工厂...\nEngineFlyweightFactory factory = new EngineFlyweightFactory();\n\
    // 创建诊断工具\nIDiagnosticTool tool = new EngineDiagnosticTool();\n// 获取权重对象并对其进行诊断\n\
    IEngine standard1 = factory.GetStandardEngine(1300);\nstandard1.Diagnose(tool);\n\
    IEngine standard2 = factory.GetStandardEngine(1300);\nstandard2.Diagnose(tool);\n\
    IEngine standard3 = factory.GetStandardEngine(1300);\nstandard3.Diagnose(tool);\n\
    IEngine standard4 = factory.GetStandardEngine(1600);\nstandard4.Diagnose(tool);\n\
    IEngine standard5 = factory.GetStandardEngine(1600);\nstandard5.Diagnose(tool);\n\
    \n// 显示对象是共享的\nConsole.WriteLine(standard1.GetHashCode());\nConsole.WriteLine(standard2.GetHashCode());\n\
    Console.WriteLine(standard3.GetHashCode());\nConsole.WriteLine(standard4.GetHashCode());\n\
    Console.WriteLine(standard5.GetHashCode());\n```\n\n在上述代码中，变量 `standard1`、standard2`\
    \ 和 `standard3` 都引用同一个 `IEngine` 对象（因为它们都是 1300cc 的标准引擎）。同样，`standard4` 与 `standard5`\
    \ 引用同一个对象。当然，在相同对象上多次运行诊断是否值得，取决于具体情况！\n"
- fmt: "\nIf the arguments passed to the extrinsic method (`IDiagnosticTool` in our\
    \ example) need to be stored, this should be done in the client program.\n\n#\
    \ 13. Proxy\n\n**Type:** Structural\n\n**Purpose:** Provide a surrogate or place-holder\
    \ for another object to control access to it.\n\nSome methods can be time-consuming,\
    \ such as those that load complex graphical components or need network connections.\
    \ In these instances, the `Proxy` pattern provides a 'stand-in' object until such\
    \ time that the time-consuming resource is complete, allowing the rest of your\
    \ application to load.\n\nIn the chapter discussing the Flyweight pattern, the\
    \ `IEngine` hierarchy was enhanced to define the additional method `Diagnose()`.\
    \ As you saw, the implementation of `RunDiagnosis()` in `EngineDiagnosticTool`\
    \ is slow (we made it sleep for five seconds to simulate this), so we might consider\
    \ making this run is a separate thread.\n\nHere is a reminder of the `IEngine`\
    \ hierarchy with the additional method:\n\n![](images/00060.jpg)\n\nFigure 13.1\
    \ : `IEngine` class hierarchy\n\nThe `Proxy` pattern involves creating a class\
    \ that implements the same interface that we are standing-in for, in our case\
    \ `IEngine`. The proxy then forwards requests to the \"real\" object which it\
    \ stores internally. Clients just access the proxy:\n\n![](images/00062.jpg)\n\
    \nFigure 13.2 : Proxy pattern\n\nHere is the code for the `EngineProxy` class:\n\
    \n```csharp\npublic class EngineProxy : IEngine\n{\n    private IEngine engine;\n\
    \    public EngineProxy(int size, bool turbo)\n    {\n        if (turbo)\n   \
    \     {\n            engine = new TurboEngine(size);\n        }\n        else\n\
    \        {\n            engine = new StandardEngine(size);\n        }\n    }\n\
    \    public virtual int Size\n    {\n        get\n        {\n            return\
    \ engine.Size;\n        }\n    }\n    public virtual bool Turbo\n    {\n     \
    \   get\n        {\n            return engine.Turbo;\n        }\n    }\n    //\
    \ This method is time-consuming...\n    public virtual void Diagnose(IDiagnosticTool\
    \ tool)\n    {\n        Console.WriteLine(\"(Running tool as thread)\");\n   \
    \     Thread t = new Thread(() => RunDiagnosticTool(tool));\n        t.Start();\n\
    \        Console.WriteLine(\"EngineProxy diagnose() method finished\");\n    }\n\
    \    public virtual void RunDiagnosticTool(IDiagnosticTool tool)\n    {\n    \
    \    tool.RunDiagnosis(this);\n    }\n}\n```\n\nThe constructor creates either\
    \ a `StandardEngine` or `TurboEngine` object and stores a reference to it as an\
    \ instance variable. Calls to `Size` and `Turbo` getters simply forward to the\
    \ referenced engine object. Calls to `Diagnose()` will invoke a separate thread\
    \ to run the actual diagnosis. This can be useful if you cannot modify the original\
    \ source for some reason.\n\n# Part IV. Behavioural Patterns\n\nThis part describes\
    \ the eleven behavioural patterns, that is, those that help manage what the classes\
    \ actually do.\n\n- **Chain of Responsibility:** Avoid coupling the sender of\
    \ a request to its receiver by giving more than one object the chance to handle\
    \ the request;\n- **Command:** Encapsulate a request as an object, thereby letting\
    \ you parameterise clients with different requests;\n- **Interpreter:** Define\
    \ the representation of a language’s grammar;\n- **Iterator:** Provide a way to\
    \ access elements of an aggregate object sequentially without exposing its underlying\
    \ representation;\n- **Mediator:** Define an object that encapsulates how a set\
    \ of objects interact;\n- **Memento:** Capture and externalise an object’s state\
    \ so that it can be restored to that state later;\n- **Observer:** Define a one-to-many\
    \ dependency between objects so that when one object changes its state, all of\
    \ its dependents are notified and updated;\n- **State:** Allow an object to alter\
    \ its behaviour when its internal state changes, as it were a different class;\n\
    - **Strategy:** Allow clients to change the algorithm that an object uses to perform\
    \ a function;\n- **Template Method:** Define the skeleton of an algorithm in a\
    \ method, deferring some steps to subclasses;\n- **Visitor:** Simulate the addition\
    \ of a method to a class without needing to actually change the class.\n\n# 4.\
    \ Chain of Responsibility\n\n**Type:** Behavioural\n\n**Purpose:** Avoid coupling\
    \ the sender of a request to its receiver by giving more than one object a chance\
    \ to handle. Chain the receiving objects and pass the request along until an object\
    \ handles it.\n\nFoobar Company receives many emails each day, including servicing\
    \ requests, sales, and of course the inevitable. Rather than employ someone specifically\
    \ to sort through each email to determine which department it should be forwarded\
    \ to, our task is to try and automate this by analysing the text in each email\
    \ and making a \"best guess\".\n\nIn our simplified example, we will search the\
    \ text of the email for a number of keywords and depending upon what we find process\
    \ accordingly. Here are the words we will search for and how they should be handled:\n\
    \n- If the email contains \"viagra\", \"pills\" or \"medicines\" it should be\
    \ forwarded to a spam handler;\n- If the email contains \"buy\", or \"purchase\"\
    \ it should be forwarded to the sales department;\n- If the email contains \"\
    service\", or \"repair\" it should be forwarded to the servicing department;\n\
    - If the email contains \"complain\", or \"bad\" it should be forwarded to the\
    \ manager;\n- If the email contains none of the above it should be forwarded to\
    \ the general enquiries.\n\nNote that only one object needs to handle the request,\
    \ so a particular email contains both \"purchase\" and \"repair\" it will be forwarded\
    \ to the sales department only. The sequence in which to check the keywords is\
    \ whatever seems sensible for the application; so we are trying to filter out\
    \ spam before it reaches any other department.\n\nNow it would be possible, of\
    \ course, to just have a series of `if...else...` statements when checking for\
    \ the keywords, but that would not be very-oriented. The `Chain of Responsibility`\
    \ pattern instead allows us to define separate 'handler' objects that all conform\
    \ to an `EmailHandler` interface. This enables us to keep each handler independent\
    \ and loosely-coupled.\n\nThe following diagram shows the pattern:\n\n![](images/00065.jpg)\n\
    \nFigure 14.1 : Chain of Responsibility pattern\n\n`IEmailHandler` is the interface\
    \ at the top of the hierarchy:\n\n```csharp\npublic interface IEmailHandler\n\
    {\n    IEmailHandler NextHandler { set; }\n    void ProcessHandler(string email);\n\
    }\n```\n\nThe `NextHandler` setter takes another `IEmailHandler` object as its\
    \ argument which represents the handler to call if the current object is unable\
    \ to handle the email.\n\nThe `ProcessHandler()` method takes the email text as\
    \ its argument and determines if it is able to handle it (i.e. if it contains\
    \ one of the keywords we are interested in). If the active object can handle the\
    \ email it does so, otherwise it just forwards to the next in the chain.\n\nThe\
    \ `AbstractEmailHandler` class implements the `IEmailHandler` interface to provide\
    \ useful default functionality:\n\n```csharp\npublic abstract class AbstractEmailHandler\
    \ : IEmailHandler\n{\n    private IEmailHandler nextHandler;\n    public virtual\
    \ IEmailHandler NextHandler\n    {\n        set\n        {\n            nextHandler\
    \ = value;\n        }\n    }\n    public virtual void ProcessHandler(string email)\n\
    \    {\n        bool wordFound = false;\n        // If no words to match against\
    \ then this object can handle\n        if (MatchingWords().Length == 0)\n    \
    \    {\n            wordFound = true;\n        }\n        else\n        {\n  \
    \          // Look for any of the matching words\n            foreach (string\
    \ word in MatchingWords())\n            {\n                if (email.IndexOf(word)\
    \ >= 0)\n                {\n                    wordFound = true;\n          \
    \          break;\n                }\n            }\n        }\n    }\n}\n```\n"
