    \ button invokes the appropriate `BusinessFacade` method to add an engine with\
    \ your selected criteria. On the main list panel the `Save` and `Restore` buttons\
    \ also make appropriate calls to the `BusinessFacade` object methods so that the\
    \ currently displayed data can be saved or restored.\n\n# Part VII. Appendixes\n\
    \nThis part contains the appendixes, which includes a brief explanation of the\
    \ Unified Modeling Language (UML) diagram formats for those unfamiliar with UML,\
    \ and a quick reference for each of the 23 main patterns.\n\n## Appendix A. UML\
    \ Diagrams\n\nThis book uses a simplified version of Unified Modeling Language\
    \ (UML) diagrams to illustrate class hierarchies and usages for the patterns in\
    \ this book. Each separate class is shown as a bounded rectangle with three horizontal\
    \ sections, the top section containing the name of the class, the second section\
    \ any relevant state (i.e. instance variables) and the third section containing\
    \ the protocol (i.e. methods).\n\n### Representing types\n\nAbstract classes,\
    \ interfaces and abstract methods are shown in italicised text. The following\
    \ figure shows an example of each sort of type and method:\n\n![](images/00004.jpg)\n\
    \nFigure A.1 : Normal class (left), abstract class (centre), interface (right)\n\
    \nIn this book any properties and relevant instance variables will be shown in\
    \ the \"state\" section. The \"method\" section will only show relevant methods\
    \ and not property getters or setters. Unless specified otherwise, you can assume\
    \ that all listed methods are `public`.\n\n### Representing inheritance\n\nInheritance\
    \ is shown by a line connection between classes, with a hollow triangle pointing\
    \ to the class being inherited or interfaces being implemented. Solid lines are\
    \ shown for classes and dashed lines for interface connections:\n\n![](images/00006.jpg)\n\
    \nFigure A.2 : Extending a class (left & centre), implementing an interface (right)\n\
    \n### Representing composition and usage\n\nWhen one class 'uses' another (i.e.\
    \ holds a reference to it), this is shown by a dashed line with an open arrow\
    \ pointing toward the class being used. The usage is usually through being an\
    \ instance variable or by passing a reference to the using object’s constructor\
