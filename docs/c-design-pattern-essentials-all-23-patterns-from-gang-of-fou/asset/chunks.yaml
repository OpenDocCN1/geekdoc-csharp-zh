    `radio.SwitchOn();`


    `IVoiceCommand volumeUpCommand = new VolumeUpCommand(radio);`


    `IVoiceCommand volumeDownCommand = new VolumeDownCommand(radio);`


    `// Create an electric window and its up/down command objects`


    `ElectricWindow window = new ElectricWindow();`


    `IVoiceCommand windowUpCommand = new WindowUpCommand(window);`


    `IVoiceCommand windowDownCommand = new WindowDownCommand(window);`


    Now create a single `SpeechRecogniser` object and set it to control the radio:


    `// Create a speech recognition object`


    `SpeechRecogniser speechRecogniser = new SpeechRecogniser();`


    `// Control the radio`


    `speechRecogniser.SetCommands(volumeUpCommand, volumeDownCommand);`


    `Console.WriteLine("Speech recognition controlling the radio");`


    `speechRecogniser.HearUpSpoken();`


    `speechRecogniser.HearUpSpoken();`


    `speechRecogniser.HearUpSpoken();`


    `speechRecogniser.HearDownSpoken();`


    Now set the same `SpeechRecogniser` object to control the window instead:


    `// Control the electric window`


    `speechRecogniser.SetCommands(windowUpCommand, windowDownCommand);`


    `Console.WriteLine("Speech recognition will now control the window");`


    `speechRecogniser.HearDownSpoken();`


    `speechRecogniser.HearUpSpoken();`


    If you run all the above statements you should see output similar to this:


    `Radio now on, volume level 5`


    `Window is closed`


    `Speech recognition controlling the radio`


    `Volume turned up to level 6`


    `Volume turned up to level 7`


    `Volume turned up to level 8`


    `Volume turned down to level 7`


    `Speech recognition will now control the window`


    `Window is now open`


    `Window is now closed`


    Typical uses of the Command Pattern


    One of the most frequent uses of the Command pattern is in UI toolkits. These
    provide pre-built components like graphical buttons and menu items that cannot
    possibly know what needs to be done when clicked, because that is always specific
    to your application.


    Another common aspect of graphical applications is the provision of an "undo"
    mechanism. The Command pattern is used to accomplish this too; using the example
    in this chapter, we would add a method to the `IVoiceCommand` interface like this:


    `public interface IVoiceCommand`


    `{`


    `    void Execute();`


    `void undo();`


    `}`


    Implementing classes then provide the code for the additional method to reverse
    the last action, as in this example for the `VolumeUpCommand` class:


    `public class VolumeUpCommand : IVoiceCommand {`


    `    private Radio radio;`


    `    public VolumeUpCommand(Radio r) {`


    `        radio = r;`


    `    }`


    `    public virtual void execute() {`


    `        radio.VolumeUp();`


    `    }`


    `    public virtual void undo() {`


    `        radio.VolumeDown();`


    `    }`


    `}`


    Most applications would be slightly more involved than the above example, in that
    you would need to store the state of the object prior to performing the code in
    the `Execute()` method, enabling you to restore that state when `Undo()` is called.


    16. Interpreter


    Type: Behavioural


    Purpose: Given a language, define a representation for its grammar along with
    an interpreter that uses the representation to interpret sentences in the language.


    The satellite-navigation systems fitted to some of the Foobar Motor Company''s
    vehicles have a special feature that enables the user to enter a number of cities
    and let it calculate the most northerly, southerly, westerly or easterly, depending
    on which command string is entered. A sample command might look like this:


    `london edinburgh manchester southerly`


    The above would result in "London" being returned, being the most southerly of
    the three entered cities. You can even enter the command string like this:


    `london edinburgh manchester southerly aberdeen westerly`


    This would first determine that London was the most southerly and then use that
    result (London) and compare it to Aberdeen to tell you which of those two is the
    most westerly. Any number of cities can be entered before each of the directional
    commands of "northerly", "southerly", "westerly" and "easterly".


    You can think of the above command string consisting of the city names and directional
    keywords as forming a simple "language" that needs to be interpreted by the satellite-navigation
    software. The Interpreter pattern is an approach that helps to decipher these
    kinds of relatively simple languages.


    Before looking at the pattern itself, we shall create a class named `City` which
    models the essential points of interest for our example, which is just the name
    of the city and its latitude and longitude:


    `public class City`


    `{`


    `    private string name;`


    `    private double latitude, longitude;`


    `    public City(string name, double latitude, double longitude)`


    `    {`


    `        this.name = name;`


    `        this.latitude = latitude;`


    `        this.longitude = longitude;`'
