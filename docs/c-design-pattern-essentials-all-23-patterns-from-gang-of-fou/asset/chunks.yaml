- fmt: "\n## Figure 8.2 : Bridge pattern\n\nAs the above figure shows, there is an\
    \ abstract `AbstractDriverControls` class with two concrete subclasses; `StandardControls`\
    \ and `SportControls`:\n\nThe `AbstractDriverControls` class requires an `Engine`\
    \ object passed to its constructor and then delegates to the engine for each of\
    \ its methods:\n\n```csharp\npublic class AbstractDriverControls\n{\n    private\
    \ IEngine engine;\n    public AbstractDriverControls(IEngine engine)\n    {\n\
    \        this.engine = engine;\n    }\n    public virtual void IgnitionOn()\n\
    \    {\n        engine.Start();\n    }\n    public virtual void IgnitionOff()\n\
    \    {\n        engine.Stop();\n    }\n    public virtual void Accelerate()\n\
    \    {\n        engine.IncreasePower();\n    }\n    public virtual void Brake()\n\
    \    {\n        engine.DecreasePower();\n    }\n}\n```\n\nSubclasses of `AbstractDriverControls`\
    \ can either use the superclass methods as-is or define additional functionality.\
    \ The `StandardControls` class uses `AbstractDriverControls` as-is:\n\n```csharp\n\
    public class StandardControls : AbstractDriverControls\n{\n    public StandardControls(IEngine\
    \ engine) : base(engine) {\n    }\n    // No extra functions\n}\n```\n\nWhereas\
    \ the `SportControls` class defines an additional method:\n\n```csharp\npublic\
    \ class SportControls : AbstractDriverControls\n{\n    public SportControls(IEngine\
    \ engine) : base(engine) {\n    }\n    public virtual void AccelerateHard()\n\
    \    {\n        Accelerate();\n        Accelerate();\n    }\n}\n```\n\nThe important\
    \ point to note from the above is that the additional method is coded in terms\
    \ of the superclass 'abstraction' and not the 'implementation' (engine). So in\
    \ the above example the `AccelerateHard()` method invokes the `Accelerate()` method\
    \ as defined in `AbstractDriverControls`. It is this approach that allows the\
    \ abstraction and the implementation to vary independently if needed.\n\nThus\
    \ we could incorporate a brand-new type of engine without modifying the driver\
    \ controls classes, provided the engine adheres to the `IEngine` contract. Conversely\
    \ we could develop a new set of driver controls (such as enabling voice activation)\
    \ without having to modify anything in the `IEngine` hierarchy.\n\nClient programs\
    \ can use the bridge as follows:\n\n```csharp\nIEngine engine = new StandardEngine(1300);\n\
    StandardControls controls = new StandardControls(engine);\ncontrols1.IgnitionOn();\n\
    controls1.Accelerate();\ncontrols1.Brake();\ncontrols1.IgnitionOff();\n// Now\
    \ use sport controls\nSportControls controls2 = new SportControls(engine);\ncontrols2.IgnitionOn();\n\
    controls2.Accelerate();\ncontrols2.AccelerateHard();\ncontrols2.Brake();\ncontrols2.IgnitionOff();\n\
    ```\n\n## 9. Composite\n\n**Type:** Structural\n\n**Purpose:** Compose objects\
    \ into tree structures to represent part-whole hierarchies. Composite lets clients\
    \ treat individual objects and compositions of objects uniformly.\n\nIn the Foobar\
    \ Motor Company workshop they build various items from component parts such as\
    \ nuts, bolts, panels, etc. Each individual component item has an associated description\
    \ and unit cost, and when items are assembled into larger items the cost is therefore\
    \ the sum of its component parts.\n\nThe Composite pattern enables us to treat\
    \ both individual parts and assemblies of parts as if they are the same, thus\
    \ enabling them to be processed in a consistent manner, simplifying code. The\
    \ class hierarchy looks like this:\n\n![](images/00046.jpg)\n\nFigure 9.1 : Composite\
    \ pattern\n\nThe abstract `Item` class defines all possible methods for both parts\
    \ and assemblies of parts:\n\n```csharp\npublic abstract class Item\n{\n    private\
    \ string description;\n    private int cost;\n    public Item(string description,\
    \ int cost)\n    {\n        this.description = description;\n        cost = cost;\n\
    \    }\n    public virtual string Description\n    {\n        get {\n        \
    \    return description;\n        }\n    }\n    public virtual int Cost\n    {\n\
    \        get {\n            return cost;\n        }\n    }\n    public abstract\
    \ void AddItem(Item item);\n    public abstract void RemoveItem(Item item);\n\
    \    public abstract Item[] Items { get; }\n    public override string ToString()\n\
    \    {\n        return description + \" (cost \" + Cost + \")\";\n    }\n}\n```\n\
    \nThe above class provides default implementations for `Description` and `Cost`\
    \ getters, and defines the abstract `AddItem()`, `RemoveItem()` and an `Items`\
    \ getter. Individual parts are modelled using the `Part` subclass:\n\n```csharp\n\
    public class Part : Item\n{\n    public Part(string description, int cost)\n \
    \   : base(description, cost)\n    {\n    }\n    // Empty implementations for\
    \ unit...\n    public override void AddItem(Item item) {}\n    public override\
    \ void RemoveItem(Item item) {}\n    public override Item[] Items\n    {\n   \
    \     get {\n            return new Item[0];\n        }\n    }\n}\n```\n\nAs you\
    \ can see, the methods related to assemblies of items have empty implementations\
    \ since a 'part' is the smallest unit possible, and therefore unable to have sub-parts,\
    \ unlike 'assemblies'. Assemblies of parts are modelled using the `Assembly` subclass:\n\
    \n```csharp\npublic class Assembly : Item\n{\n    private IList<Item> items;\n\
    \    public Assembly(string description)\n    : base(description, 0)\n    {\n\
    \        items = new List<Item>();\n    }\n    public override void AddItem(Item\
    \ item)\n    {\n        items.Add(item);\n    }\n    public override void RemoveItem(Item\
    \ item)\n    {\n        items.Remove(item);\n    }\n    public override Item[]\
    \ Items\n    {\n        get {\n            return items.ToArray();\n        }\n\
    \    }\n    // Also have to override getCost() to accumulate cost of all items\
    \ in list\n    public override int Cost\n    {\n        get {\n            int\
    \ total = 0;\n            foreach (Item item in items)\n            {\n      \
    \          total += item.Cost;\n            }\n            return total;\n   \
    \     }\n    }\n}\n```\n\nAll types of `Item` objects can now be used in a uniform\
    \ manner:\n\n```csharp\nItem nut = new Part(\"Nut\", 5);\nItem bolt = new Part(\"\
    Bolt\", 9);\nItem panel = new Part(\"Panel\", 35);\nItem gizmo = new Assembly(\"\
    Gizmo\");\ngizmo.AddItem(panel);\ngizmo.AddItem(nut);\ngizmo.AddItem(bolt);\n\
    Item widget = new Assembly(\"Widget\");\nwidget.AddItem(gizmo);\nwidget.AddItem(nut);\n\
    ```\n\nThe assemblies have computed the total cost without the client program\
    \ needing to know how. Displaying the objects would result in this output:\n\n\
    `Nut (cost 5)`\n`Bolt (cost 9)`\n`Panel (cost 35)`\n`Gizmo (cost 49)`\n`Widget\
    \ (cost 54)`\n\n## 10. Decorator\n\n**Type:** Structural\n\n**Purpose:** Attach\
    \ additional responsibilities to an object dynamically. Decorators provide a flexible\
    \ alternative to subclassing for extending functionality.\n\nYou will recall the\
    \ Foobar Motor Company `IVehicle` class hierarchy:\n\n![](images/00035.jpg)\n\n\
    Figure 10.1 : `IVehicle` class hierarchy\n\nFor the purposes of this chapter,\
    \ we shall add one additional property called `Price` to the `IVehicle` interface\
    \ with a getter. We will also modify the `ToString()` method in `AbstractVehicle`\
    \ to include the price. The modified interface and class is shown below with the\
    \ changes marked in bold:\n\n```csharp\npublic interface IVehicle\n{\n    IEngine\
    \ Engine { get; }\n    VehicleColour Colour { get; }\n}\n```\n"
