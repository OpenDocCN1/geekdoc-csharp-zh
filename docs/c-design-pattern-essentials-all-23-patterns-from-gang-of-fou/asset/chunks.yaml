    ```\n\nClient programs then only need invoke the `PrepareForSale()` method on\
    \ a `VehicleFacade` instance, and therefore need no knowledge of what needs to\
    \ be done and what other objects are needed. And if something different is needed\
    \ in a special circumstance, then the individual methods are still available for\
    \ calling as required.\n\n# 12. Flyweight\n\n**Type:** Structural  \n**Purpose:**\
    \ Use sharing to support large numbers of fine-grained objects efficiently.\n\n\
    Some programs need to create a large number of objects of one particular type,\
    \ and if those objects happen to have a large amount of state then instantiating\
    \ lots of them can quickly use up memory. When considering object state, we often\
    \ note that at least some of it could potentially be shared among a group of objects.\n\
    \nFor the Foobar Motor Company, the `IEngine` hierarchy is a case in point:\n\n\
    ![](images/00037.jpg)\n\nFigure 12.1 : `IEngine` class hierarchy\n\nOur simple\
    \ implementation of `IEngine` only defines two property getters; `Size` and `Turbo`.\
    \ Let's suppose we instantiate two engines as follows:\n\n```csharp\nEngine engine1\
    \ = new StandardEngine(1300);\nEngine engine2 = new StandardEngine(1300);\n```\n\
    \nThe above would create two separate objects in memory, even though their state\
    \ is identical. This can be thought of as its intrinsic state; i.e. all 1300cc\
    \ standard engines will be storing 1300 for the engine size and false for whether\
    \ it is turbocharged. Creating hundreds or thousands of these would be wasteful\
    \ of memory, especially since a more realistic `Engine` class would require many\
    \ more variables whose values would also be shared.\n\nFor the purposes of this\
    \ chapter another method will be added to the `IEngine` interface, called `Diagnose()`.\
    \ This new method will take a `DiagnosticTool` object as its argument, and this\
    \ argument can be thought of as its extrinsic state, since its value is not actually\
    \ stored in the `Engine` object; it is used purely so that the engine can use\
    \ it to run a diagnostic check.\n\nThe `DiagnosticTool` interface looks like this:\n\
    \n```csharp\npublic interface IDiagnosticTool\n{\n    void RunDiagnosis(object\
    \ obj);\n}\n```\n\nThe `EngineDiagnosticTool` implements the above for diagnostics\
    \ on an engine:\n\n```csharp\npublic class EngineDiagnosticTool : IDiagnosticTool\n\
    {\n    public virtual void RunDiagnosis(object obj)\n    {\n        Console.WriteLine(\"\
    Starting diagnostic tool for \" + obj);\n        Thread.Sleep(5000);\n       \
    \ Console.WriteLine(\"Engine diagnosis complete\");\n    }\n}\n```\n\nTo simulate\
    \ a long-running process the method pauses for seconds. With the above in place\
    \ we can now add a suitable method to the `IEngine` interface:\n\n```csharp\n\
    public interface IEngine\n{\n    // Properties having intrinsic (i.e. shared)\
    \ state\n    int Size { get; }\n    bool Turbo { get; }\n    // Methods having\
    \ extrinsic (i.e. unshared) state\n    void Diagnose(IDiagnosticTool tool);\n\
    }\n```\n\nThe implementation of this new method in `AbstractEngine` simply issues\
    \ a callback to the `IDiagnosticTool`:\n\n```csharp\npublic virtual void Diagnose(IDiagnosticTool\
    \ tool) {\n    tool.RunDiagnosis(this);\n}\n```\n\nThe Flyweight pattern allows\
    \ you to reference a multitude of objects of the same type and having the same\
    \ state, but by instantiating the minimum number of actual objects needed. This\
    \ is typically done by allocating a 'pool' of objects which can be shared, and\
    \ this is determined by a 'flyweight factory' class. Client programs get access\
    \ to engines only through the factory:\n\n![](images/0056.jpg)\n\nFigure 12.2\
    \ : Flyweight pattern\n\nThe `EngineFlyweightFactory` class looks like this:\n\
    \n```csharp\npublic class EngineFlyweightFactory\n{\n    private Dictionary<int?,\
    \ IEngine> standardEnginePool;\n    private Dictionary<int?, IEngine> turboEnginePool;\n\
    \n    public EngineFlyweightFactory()\n    {\n        standardEnginePool = new\
    \ Dictionary<int?, IEngine>();\n        turboEnginePool = new Dictionary<int?,\
    \ IEngine>();\n    }\n    public virtual IEngine GetStandardEngine(int size)\n\
    \    {\n        IEngine e = null;\n        bool found = standardEnginePool.TryGetValue(size,\
    \ out e);\n        if (! found)\n        {\n            e = new StandardEngine(size);\n\
    \            standardEnginePool[size] = e;\n        }\n        return e;\n   \
    \ }\n\n    public virtual IEngine GetTurboEngine(int size)\n    {\n        IEngine\
    \ e = null;\n        bool found = turboEnginePool.TryGetValue(size, out e);\n\
    \        if (!found)\n        {\n            e = new TurboEngine(size);\n    \
    \        turboEnginePool[size] = e;\n        }\n        return e;\n    }\n}\n\
    ```\n\nThis class utilises two dictionaries (one for standard engines and the\
    \ other for turbo engines). Each time an engine of a particular type and size\
    \ is requested, if a similar one has already been created it is returned rather\
    \ than instantiating a new one. Client programs use the factory like this:\n\n\
    ```csharp\n// Create the flyweight factory...\nEngineFlyweightFactory factory\
    \ = new EngineFlyweightFactory();\n// Create the diagnostic tool\nIDiagnosticTool\
    \ tool = new EngineDiagnosticTool();\n// Get the flyweights and run diagnostics\
    \ on them\nIEngine standard1 = factory.GetStandardEngine(1300);\nstandard1.Diagnose(tool);\n\
    IEngine standard2 = factory.GetStandardEngine(1300);\nstandard2.Diagnose(tool);\n\
    IEngine standard3 = factory.GetStandardEngine(1300);\nstandard3.Diagnose(tool);\n\
    IEngine standard4 = factory.GetStandardEngine(1600);\nstandard4.Diagnose(tool);\n\
    IEngine standard5 = factory.GetStandardEngine(1600);\nstandard5.Diagnose(tool);\n\
    \n// Show that objects are shared\nConsole.WriteLine(standard1.getHashCode());\n\
    Console.WriteLine(standard2.GetHashCode());\nConsole.WriteLine(standard3.GetHashCode());\n\
    Console.WriteLine(standard4.GetHashCode());\nConsole.WriteLine(standard5.GetHashCode());\n\
    ```\n\nIn the above, the variables `standard1`, `standard2` and `standard3` all\
    \ reference the same `IEngine` object (since they all 1300cc standard engines).\
    \ Likewise, `standard4` references the same object as `standard5`. Of course,\
    \ whether it is worth running the diagnostics multiple times on the same objects\
    \ is arguable depending upon the circumstances!\n"
