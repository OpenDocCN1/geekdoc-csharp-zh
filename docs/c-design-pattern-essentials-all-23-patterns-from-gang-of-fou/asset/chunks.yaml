    \nType: Behavioural\n\nPurpose: Define the skeleton of an algorithm in a method,\
    \ deferring some steps to subclasses. Template Method lets subclasses redefine\
    \ certain steps of an algorithm without changing the algorithm's structure.\n\n\
    Each vehicle made by the Foobar Company needs a small number of booklets to be\
    \ produced and provided to the buyer, such as an Owner's Manual and a Service\
    \ History. The way booklets are produced follows the same set of steps, but each\
    \ type of booklet might need to do each of the individual steps in a different\
    \ way.\n\nThe Template Method pattern enables the definition of one or more abstract\
    \ methods that are called through a 'template method'. The simple hierarchy is\
    \ as follows: images/0007.jpg\n\n### Figure 23.1 : Template Method pattern\n\n\
    The `AbstractletPrinter` class defines several `protected abstract` methods and\
    \ one `public` 'template method' that makes use of the abstract methods:\n\n```csharp\n\
    public abstract class AbstractPrinter\n{\n    protected internal abstract int\
    \ PageCount { get; }\n    protected internal abstract void PrintFrontCover();\n\
    \    protected internal abstract void PrintOfContents();\n    protected internal\
    \ abstract void PrintPage(int pageNumber);\n    protected internal abstract void\
    \ PrintIndex();\n    protected internal abstract void PrintBackCover();\n    //\
    \ This is the 'template method'\n    public void Print()\n    {\n        PrintFrontCover();\n\
    \        PrintOfContents();\n        for (int i = 1; i <= PageCount; i++)\n  \
    \      {\n            PrintPage(i);\n        }\n        PrintIndex();\n      \
    \  PrintBackCover();\n    }\n}\n```\n\nEach concrete subclass now needs to provide\
    \ the implementing code for each abstract method, example the `SaloonBooklet`\
    \ class below:\n\n```csharp\npublic class SaloonBooklet : AbstractPrinter\n{\n\
    \    protected internal override int PageCount\n    {\n        get\n        {\n\
    \            return 100;\n        }\n    }\n    protected internal override void\
    \ PrintFrontCover()\n    {\n        Console.WriteLine(\"Printing front cover for\
    \ Saloon car booklet\");\n    }\n    protected internal override void PrintOfContents()\n\
    \    {\n        Console.WriteLine(\"Printing table of contents for Saloon car\
    \ booklet\");\n    }\n    protected internal override void PrintPage(int pageNumber)\n\
    \    {\n        Console.WriteLine(\"Printing page \" + pageNumber + \" for Saloon\
    \ car booklet\");\n    }\n    protected internal override void PrintIndex()\n\
    \    {\n        Console.WriteLine(\"Printing index for Saloon car booklet\");\n\
    \    }\n    protected internal override void PrintBackCover()\n    {\n       \
    \ Console.WriteLine(\"Printing back cover for Saloon car booklet\");\n    }\n\
    }\n```\n\nThe `ServiceHistoryBooklet` is very similar:\n\n```csharp\npublic class\
    \ ServiceHistoryBooklet : AbstractPrinter\n{\n    protected internal override\
    \ int PageCount\n    {\n        get\n        {\n            return 12;\n     \
    \   }\n    }\n    protected internal override void PrintFrontCover()\n    {\n\
    \        Console.WriteLine(\"Printing front cover for service history booklet\"\
    );\n    }\n    protected internal override void PrintOfContents()\n    {\n   \
    \     Console.WriteLine(\"Printing table of contents for service history booklet\"\
    );\n    }\n    protected internal override void PrintPage(int pageNumber)\n  \
    \  {\n        Console.WriteLine(\"Printing page \" + pageNumber + \" for service\
    \ history booklet\");\n    }\n    protected internal override void PrintIndex()\n\
    \    {\n        Console.WriteLine(\"Printing index for service history booklet\"\
    );\n    }\n    protected internal override void PrintBackCover()\n    {\n    \
    \    Console.WriteLine(\"Printing back cover for service history booklet\");\n\
    \    }\n}\n```\n\nWhile it is not essential from the point of view of the pattern\
    \ for the abstract methods to be `protected`, it is often the case that this is\
    \ the most appropriate access level to assign since they are only intended for\
    \ over-riding and not for direct invocation by client objects.\n\nAlso note that\
    \ it's perfectly acceptable for some of the methods called from the 'template\
    \ method' to not be abstract but have a default implementation provided. But when\
    \ at least one abstract method is being called, it qualifies as the Template Method\
    \ pattern.\n\nClient programs merely need to instantiate the required concrete\
    \ class and invoke the `Print()` method:\n\n```csharp\nConsole.WriteLine(\"About\
    \ to print a booklet for Saloon cars\");\nAbstractPrinter saloonBooklet = new\
    \ SaloonBooklet();\nsaloonBooklet.Print();\n\nConsole.WriteLine(\"About to print\
    \ a service history booklet\");\nAbstractPrinter serviceBooklet = new ServiceHistoryBooklet();\n\
    serviceBooklet.Print();\n\nConsole.Read();\n```\n\n# 24. Visitor\n\nType: Behavioural\n"
