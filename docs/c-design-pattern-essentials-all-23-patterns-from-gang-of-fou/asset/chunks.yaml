    20. Observer


    Type: Behavioural


    Purpose: Define a one-to-many dependency between objects so that when one object
    changes its state, all its dependants are notified and updated automatically.


    The Foobar Motor Company has decided that an alert should sound to the driver
    whenever a certain speed is exceeded. They also envisage that other things may
    need to happen depending upon the current speed (such as an automatic gearbox
    selecting the appropriate gear to match the speed). But they realise the need
    to keep objects loosely-coupled, so naturally don''t wish the `Speedometer` class
    to have any direct knowledge of speed monitors or automatic gearboxes (or any
    other future class that might be interested in the speed a vehicle is travelling).


    The Observer pattern enables a loose-coupling to be established between a ''subject''
    (the object that is of interest; `Speedometer` in our example) and its ''observers''
    (any other class that needs to be kept informed when interesting stuff happens).


    Because this is a very common need in object-oriented systems, the C# libraries
    already contains mechanisms that enable the pattern to be implemented. One of
    these is by utilising the `EventHandler` event class:


     The ''subject'' (`Speedometer`) can have multiple observers, each of which will
    be notified whenever. an event occurs on the `Speedometer` object. The `Speedometer`
    class looks like this:


    `public class Speedometer`


    `{`


    `    public event EventHandler ValueChanged;`


    `    private int currentSpeed;`


    `    public Speedometer()`


    `    {`


    `        speed = 0;`


    `    }`


