    method to prepare the specified vehicle by using the above classes on our behalf:


    ![](images/00053.jpg)


    Figure 11.1 : Facade pattern


    `public class VehicleFacade`


    `{`


    `    public virtual void PrepareForSale(IVehicle vehicle)`


    `    {`


    `        Registration reg = new Registration(vehicle);`


    `        reg.AllocateVehicleNumber();`


    `        reg.AllocateLicensePlate();`


    `        Documentation.PrintBrochure(vehicle);`


    `        vehicle.CleanInterior();`


    `        vehicle.CleanExteriorBody();`


    `        vehicle.PolishWindows();`


    `        vehicle.TakeForTestDrive();`


    `    }`


    `}`


    Client programs then only need invoke the `PrepareForSale()` method on a `VehicleFacade`
    instance, and therefore need no knowledge of what needs to be done and what other
    objects are needed. And if something different is needed in a special circumstance,
    then the individual methods are still available for calling as required.


    12. Flyweight


    Type: Structural


    Purpose: Use sharing to support large numbers of fine-grained objects efficiently.


    Some programs need to create a large number of objects of one particular type,
    and if those objects happen to have a large amount of state then instantiating
    lots of them can quickly use up memory. When considering object state, we often
    note that at least some of it could potentially be shared among a group of objects.


    For the Foobar Motor Company, the `IEngine` hierarchy is a case in point:


    ![](images/00037.jpg)


    Figure 12.1 : `IEngine` class hierarchy


    Our simple implementation of `IEngine` only defines two property getters; `Size` and
    `Turbo`. Let''s suppose we instantiate two engines as follows:


    `Engine engine1 = new StandardEngine(1300);`


    `Engine engine2 = new StandardEngine(1300);`


    The above would create two separate objects in memory, even though their state
    is identical. This can be thought of as its intrinsic state; i.e. all 1300cc standard
    engines will be storing 1300 for the engine size and false for whether it is turbocharged.
    Creating hundreds or thousands of these would be wasteful of memory, especially
    since a more realistic `Engine` class would require many more variables whose
    values would also be shared.


    For the purposes of this chapter another method will be added to the `IEngine`
    interface, called `Diagnose()`. This new method will take a `DiagnosticTool` object
    as its argument, and this argument can be thought of as its extrinsic state, since
    its value is not actually stored in the `Engine` object; it is used purely so
    that the engine can use it to run a diagnostic check.


    The `DiagnosticTool` interface looks like this:


    `public interface IDiagnosticTool`


    `{`


    `    void RunDiagnosis(object obj);`


    `}`


    The `EngineDiagnosticTool` implements the above for running diagnostics on an
    engine:


    `public class EngineDiagnosticTool : IDiagnosticTool`


    `{`


    `    public virtual void RunDiagnosis(object obj)`


    `    {`


    `        Console.WriteLine("Starting engine diagnostic tool for " + obj);`


    `        Thread.Sleep(5000);`


    `        Console.WriteLine("Engine diagnosis complete");`


    `    }`


    `}`


    To simulate a long-running process the method pauses for five seconds. With the
    above in place we can now add a suitable method to the `IEngine` interface:


    `public interface IEngine`


    `{`


    `    // Properties having intrinsic (i.e. shared) state`


    `    int Size { get; }`


    `    bool Turbo { get; }`


    `    // Methods having extrinsic (i.e. unshared) state`


    `    void Diagnose(IDiagnosticTool tool);`


    `}`


    The implementation of this new method in `AbstractEngine` simply issues a call-back
    to the `IDiagnosticTool`:


    `public virtual void Diagnose(IDiagnosticTool tool) {`


    `    tool.RunDiagnosis(this);`


    `}`


    The Flyweight pattern allows you to reference a multitude of objects of the same
    type and having the same state, but only by instantiating the minimum number of
    actual objects needed. This is typically done by allocating a ''pool'' of objects
    which can be shared, and this is determined by a ''flyweight factory'' class.
    Client programs get access to engines only through the factory:


    ![](images/00056.jpg)


    Figure 12.2 : Flyweight pattern


    The `EngineFlyweightFactory` class looks like this:


    `public class EngineFlyweightFactory`


    `{`


    `    private IDictionary<int?, IEngine> standardEnginePool;`


    `    private IDictionary<int?, IEngine> turboEnginePool;`


    `    public EngineFlyweightFactory()`


    `    {`


    `        standardEnginePool = new Dictionary<int?, IEngine>();`


    `        turboEnginePool = new Dictionary<int?, IEngine>();`


    `    }`


    `    public virtual IEngine GetStandardEngine(int size)`


    `    {`


    `        IEngine e = null;`


    `        bool found = standardEnginePool.TryGetValue(size, out e);`


    `        if (! found)`


    `        {`


    `            e = new StandardEngine(size);`


    `            standardEnginePool[size] = e;`


    `        }`


    `        return e;`


    `    }`


    `    public virtual IEngine GetTurboEngine(int size)`


    `    {`


    `        IEngine e = null;`


    `        bool found = turboEnginePool.TryGetValue(size, out e);`


    `        if (!found)`


    `        {`


    `            e = new TurboEngine(size);`


    `            turboEnginePool[size] = e;`


    `        }`


    `        return e;`


    `    }`


    `}`


    This class utilises two dictionaries (one for standard engines and the other for
    turbo engines). Each time an engine of a particular type and size is requested,
    if a similar one has already been created it is returned rather than instantiating
    a new one. Client programs use the factory like this:


    `// Create the flyweight factory...`


    `EngineFlyweightFactory factory = new EngineFlyweightFactory();`


    `// Create the diagnostic tool`


    `IDiagnosticTool tool = new EngineDiagnosticTool();`


    `// Get the flyweights and run diagnostics on them`


    `IEngine standard1 = factory.GetStandardEngine(1300);`


    `standard1.Diagnose(tool);`


    `IEngine standard2 = factory.GetStandardEngine(1300);`


    `standard2.Diagnose(tool);`


    `IEngine standard3 = factory.GetStandardEngine(1300);`


    `standard3.Diagnose(tool);`


    `IEngine standard4 = factory.GetStandardEngine(1600);`


    `standard4.Diagnose(tool);`


    `IEngine standard5 = factory.GetStandardEngine(1600);`


    `standard5.Diagnose(tool);`


    `// Show that objects are shared`


    `Console.WriteLine(standard1.getHashCode());`


    `Console.WriteLine(standard2.GetHashCode());`


    `Console.WriteLine(standard3.GetHashCode());`


    `Console.WriteLine(standard4.GetHashCode());`


    `Console.WriteLine(standard5.GetHashCode());`


    In the above, the variables `standard1`, `standard2` and `standard3` all reference
    the same `IEngine` object (since they all 1300cc standard engines). Likewise,
    `standard4` references the same object as `standard5`. Of course, whether it is
    worth running the diagnostics multiple times on the same objects is arguable depending
    upon the circumstances!'
