    \        }\n        get\n        {\n            return currentSpeed;\n       \
    \ }\n    }\n    protected void OnValueChanged()\n    {\n        if (ValueChanged\
    \ != null)\n        {\n            ValueChanged(this, EventArgs.Empty);\n    \
    \    }\n    }\n}\n```\n\nThe `SpeedMonitor` class utilises `ValueChanged`:\n\n\
    ```cs\npublic class SpeedMonitor\n{\n    public const int SpeedToAlert = 70;\n\
    \    public SpeedMonitor(Speedometer speedo)\n    {\n        speedo.ValueChanged\
    \ += ValueHasChanged;\n    }\n    private void ValueHasChanged(object sender,\
    \ EventArgs e )\n    {\n        Speedometer speedo = (Speedometer)sender;\n  \
    \      if (speedo.CurrentSpeed > SpeedToAlert)\n        {\n            Console.WriteLine(\"\
    ** ALERT ** Driving too fast! (\" + speedo.CurrentSpeed + \")\");\n        }\n\
    \        else\n        {\n            Console.WriteLine(\"... nice and steady\
    \ ... (\" + speedo.CurrentSpeed + \")\");\n        }\n    }\n}\n```\n\nClient\
    \ programs simply pass a `SpeedMonitor` reference to an instance of `Speedometer`:\n\
