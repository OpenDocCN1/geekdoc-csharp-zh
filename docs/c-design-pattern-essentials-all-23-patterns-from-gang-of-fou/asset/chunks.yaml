    Part VII. Appendixes


    This part contains the appendixes, which includes a brief explanation of the Unified
    Modeling Language (UML) diagram formats for those unfamiliar with UML, and a quick
    reference for each of the 23 main patterns.


    Appendix A. UML Diagrams


    This book uses a simplified version of Unified Modeling Language (UML) diagrams
    to illustrate class hierarchies and usages for the patterns in this book. Each
    separate class is shown as a bounded rectangle with three horizontal sections,
    the top section containing the name of the class, the second section any relevant
    state (i.e. instance variables) and the third section containing the protocol
    (i.e. methods).


    Representing types


    Abstract classes, interfaces and abstract methods are shown in italicised text.
    The following figure shows an example of each sort of type and method:


    ![](images/00004.jpg)


    Figure A.1 : Normal class (left), abstract class (centre), interface (right)


    In this book any properties and relevant instance variables will be shown in the
    "state" section. The "method" section will only show relevant methods and not
    property getters or setters. Unless specified otherwise, you can assume that all
    listed methods are `public`.


    Representing inheritance


    Inheritance is shown by a line connection between classes, with a hollow triangle
    pointing to the class being inherited or interfaces being implemented. Solid lines
    are shown for classes and dashed lines for interface connections:


    ![](images/00006.jpg)


    Figure A.2 : Extending a class (left & centre), implementing an interface (right)


    Representing composition and usage


    When one class ''uses'' another (i.e. holds a reference to it), this is shown
    by a dashed line with an open arrow pointing toward the class being used. The
    usage is usually through being an instance variable or by passing a reference
    to the using object’s constructor or a method, or by instantiating the object
    being used. In the following diagram each instance of `ClassA` holds or obtains
    a reference to an instance of `ClassB`:


    ![](images/00021.jpg)


    Figure A.3 : `ClassA` uses `ClassB`


    Code snippets


    Where useful, snippets of code will be shown in a grey box attached to a class
    with a dashed line:


    ![](images/00058.jpg)


    Figure A.4 : Code snippet


    ''Client'' and other grey coloured classes


    If a class rectangle is shown in grey this only for aesthetic purposes to separate
    it from other classes in the diagram. This is most often used in this book for
    ''client'' classes, i.e. classes which make use of a particular pattern, as the
    following example for the Chain of Responsibility pattern illustrates:


    ![](images/00019.jpg)


    Figure A.5 : Client class in grey


    Appendix B. Design Pattern Quick Reference


    This appendix provides an alphabetical quick-reference of each of the 23 main
    design patterns described in this book in their most general form.


    Note that many of the patterns make use of abstract classes or interfaces. In
    most cases these are interchangeable and the choice of which to use depends entirely
    upon your project requirements. It may also appear that the general form of a
    particular pattern described in this chapter differs from the detailed example
    in the main body of this book, but this is just a consequence of the fact that
    patterns are adaptable to the needs of the situation, and the general form should
    not be construed as the only or ''correct'' approach.


    Abstract Factory


    Type: Creational


    Purpose: Provide an interface for creating families of related or dependent objects
    without specifying their concrete classes.


    Example usage: Commonly used when generating graphical ''widgets'' for different
    look-and-feels.


    Consequences: Isolates concrete classes. Enables easy exchange of product families.
    Promotes consistency among products.


    ![](images/00030.jpg) 


    *   `AbstractFactory` defines an interface for methods that create abstract product
    objects;


    *   `ConcreteFactory1` and `ConcreteFactory2` take care of instantiating the appropriate
    product families (e.g. `ConcreteFactory1` creates `ProductA1` and `ProductB1`);


    *   `AbstractProductA` and `AbstractProductB` defines the interface of each different
    type of product;


    Client programs only use the interfaces declared by `AbstractFactory` and `AbstractProductA`
    and `AbstractProductB`.


    Adapter


    Type: Structural


    Purpose: Convert the interface of a class into another interface clients expect.
    Adapter lets classes work together that couldn''t otherwise because of incompatible
    interfaces.


    Example usage: Integration of independent and incompatible classes.


    Consequences: A single adapter can work with many adaptees.


    ![](images/00032.jpg)


    *   `ITarget` refers to the interface that the client program requires;


    *   `Adapter` is the class used by client programs to forward requests to `Adaptee`;


    *   `Adaptee` is the class that needs adapting.


    Bridge


    Type: Structural


    Purpose: Decouple an abstraction from its implementation so that each may vary
    independently.


    Example usage: GUI frameworks and persistence frameworks.


    Consequences: An implementation is not permanently bound to an interface, and
    can be switched at run-time.


    ![](images/00034.jpg)


    *   `IAbstraction` is the abstraction of the interface;


    *   `ConcreteClass` implements the `IAbstraction` interface and holds a reference
    to `IImplementor`. It provides an implementation in terms of `IImplementor`;


    *   `IImplementor` is the implementation interface which may be quite different
    to the `IAbstraction` interface;


    *   `ConcreteImplementor1` and `ConcreteImplementor2` implement the `IImplementor`
    interface.


    Builder


