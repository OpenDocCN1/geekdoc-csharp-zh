    `            copyOfPreviousSpeed = speedometer.previousSpeed;`


    `        }`


    `        public virtual void RestoreState()`


    `        {`


    `            speedometer.CurrentSpeed = copyOfCurrentSpeed;`


    `            speedometer.previousSpeed = copyOfPreviousSpeed;`


    `        }`


    `    }`


    `}`


    Note that the  `CurrentSpeed` property getter was used for the `currentSpeed`
    instance variable but the `previousSpeed` variable had to be accessed directly,
    which is possible because the memento exists in the same assembly.


    We can test the memento with this code:


    `Speedometer speedo = new Speedometer();`


    `speedo.CurrentSpeed = 50;`


    `speedo.CurrentSpeed = 100;`


    `Console.WriteLine("Current speed: " + speedo.CurrentSpeed);`


    `Console.WriteLine("Previous speed: " + speedo.previousSpeed);`


    `// Save the state of ''speedo''...`


    `SpeedometerMemento memento = new SpeedometerMemento(speedo);`


    `// Change the state of ''speedo''...`


    `speedo.CurrentSpeed = 80;`


    `Console.WriteLine("After setting to 80...");`


    `Console.WriteLine("Current speed: " + speedo.CurrentSpeed);`


    `Console.WriteLine("Previous speed: " + speedo.previousSpeed);`


    `// Restore the state of ''speedo''...`


    `Console.WriteLine("Now restoring state...");`


    `memento.RestoreState();`


    `Console.WriteLine("Current speed: " + speedo.CurrentSpeed);`


    `Console.WriteLine("Previous speed: " + speedo.previousSpeed);`


    `Console.Read();`


    Running the above results in the following output:


    `Current speed: 100`


    `Previous speed: 50`


    `After setting to 80...`


    `Current speed: 80`


    `Previous speed: 100`


    `Now restoring state...`


    `Current speed: 100`


    `Previous speed: 50`


    The main disadvantage of this approach is that you either have to put the pair
    of classes in their own special assembly or accept that other classes in the assembly they
    are in will have direct access to the instance variables.


    Approach 2: object serialization


    This approach allows you to make all the instance variables `private`, thus regaining
    full encapsulation. The `Speedometer` class has been modified for this and now
    includes a `PreviousSpeed` getter, though this is purely to help us test the memento;
    it''s not required by this approach. The class has also been changed to be `Serializable` (changes
    marked in bold):


    `[Serializable]`'
