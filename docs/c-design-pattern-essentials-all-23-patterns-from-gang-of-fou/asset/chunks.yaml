    \n我们现在将定义一个简单的 `EntityTable` 类，它可以存储一个以顺序数字 ID 为键的对象字典：\n\n```csharp\nnamespace\
    \ Database\n{\n    [Serializable]\n    public class EntityTable\n    {\n     \
