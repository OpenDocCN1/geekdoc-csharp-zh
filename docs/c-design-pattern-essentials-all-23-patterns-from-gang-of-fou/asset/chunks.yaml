    ```\nWorking out correct gear at 20mph for a STANDARD gearbox\nWorking out correct\
    \ gear at 40mph for a STANDARD gearbox\nSwitching on mode gearbox...\nWorking\
    \ out correct gear at 20mph for a SPORT gearbox\nWorking out correct gear at 40mph\
    \ for a SPORT gearbox\n```\n\n# 23. 模板方法 (Template Method)\n\n类型：行为型 (Behavioural)\n\
    \n目的：在方法中定义算法的骨架，并将某些步骤延迟给子类。模板方法允许子类在不改变算法结构的情况下重新定义算法的某些步骤。\n\nFoobar 公司制造的每辆车辆都需要制作少量的小手册并提供给买家，例如《所有手册》和《保养记录》。手册的制作遵循相同的步骤\
    \ set，但每种类型的手册可能需要以不同的方式执行每个步骤。\n\n模板方法模式允许定义一个或多个抽象方法，这些方法通过“模板方法”进行调用。简单的层级结构如下：images/0007.jpg\n\
    \n### 图 23.1：模板方法模式\n\n`AbstractletPrinter` 类定义了几个 `protected` 方法和一个使用这些抽象方法的\
    \ `public` “模板方法”：\n\n```csharp\npublic abstract class AbstractPrinter\n{\n  \
    \  protected abstract int PageCount { get; }\n    protected abstract void PrintFrontCover();\n\
    \    protected abstract void PrintOfContents();\n    protected abstract void PrintPage(int\
    \ pageNumber);\n    protected abstract void PrintIndex();\n    protected abstract\
    \ void PrintBackCover();\n    // 这是模板方法\n    public void Print()\n    {\n    \
    \    PrintFrontCover();\n        PrintOfContents();\n        for (int i = 1; i\
    \ <= PageCount; i++)\n        {\n            PrintPage(i);\n        }\n      \
    \  PrintIndex();\n        PrintBackCover();\n    }\n}\n```\n\n每个具体子类现在都需要为抽象方法提供实现，例如下面的\
    \ `SaloonBooklet` 类：\n\n```csharp\npublic class SaloonBooklet : AbstractPrinter\n\
    {\n    protected override int PageCount\n    {\n        get\n        {\n     \
    \       return 100;\n        }\n    }\n    protected override void PrintFrontCover()\n\
    \    {\n        Console.WriteLine(\"Printing front cover for Saloon booklet\"\
    );\n    }\n    protected override void PrintOfContents()\n    {\n        Console.WriteLine(\"\
    Printing table of contents for Saloon booklet\");\n    }\n    protected override\
    \ void PrintPage(int pageNumber)\n    {\n        Console.WriteLine(\"Printing\
    \ page \" + pageNumber + \" for Saloon booklet\");\n    }\n    protected override\
    \ void PrintIndex()\n    {\n        Console.WriteLine(\"Printing index for Saloon\
    \ booklet\");\n    }\n    protected override void PrintBackCover()\n    {\n  \
    \      Console.WriteLine(\"Printing back cover for Saloon booklet\");\n    }\n\
    }\n```\n\n`ServiceHistoryBooklet` 非常相似：\n\n```csharp\npublic class ServiceHistoryBooklet\
    \ : AbstractPrinter\n{\n    protected override int PageCount\n    {\n        get\n\
    \        {\n            return 12;\n        }\n    }\n    protected override void\
    \ PrintFrontCover()\n    {\n        Console.WriteLine(\"Printing front cover for\
    \ service history booklet\");\n    }\n    protected override void PrintOfContents()\n\
    \    {\n        Console.WriteLine(\"Printing table of contents for service history\
    \ booklet\");\n    }\n    protected override void PrintPage(int pageNumber)\n\
    \    {\n        Console.WriteLine(\"Printing page \" + pageNumber + \" for service\
    \ history booklet\");\n    }\n    protected override void PrintIndex()\n    {\n\
    \        Console.WriteLine(\"Printing index for service history booklet\");\n\
    \    }\n    protected override void PrintBackCover()\n    {\n        Console.WriteLine(\"\
    Printing back cover for service history booklet\");\n    }\n}\n```\n\n虽然从模式的角度来看，抽象方法必须是\
    \ `protected` 并不是必需的，但通常这是分配最合适的访问级别，因为它们仅用于被重写，而不是供客户端对象直接调用。\n\n此外注意，从“模板方法”中调用的某些方法不是抽象的但提供了默认实现是完全可以的。但当至少有一个抽象方法被调用时，它就符合模板模式的定义。\n\
    \n客户端程序只需要实例化所需的具体类并调用 `Print()` 方法：\n\n```csharp\nConsole.WriteLine(\"About to\
    \ print a booklet for Saloon cars\");\nAbstractPrinter saloonBooklet = new SaloonBooklet();\n\
    saloonBooklet.Print();\n\nConsole.WriteLine(\"About to print a service history\
    \ booklet\");\nAbstractPrinter serviceBooklet = new ServiceHistoryBooklet();\n\
    serviceBooklet.Print();\n\nConsole.Read();\n```\n\n# 24. 访问者 (Visitor)\n\n类型：行为型\
    \ (Behavioural)\n"
- fmt: "\n# Purpose\nRepresent a method to be performed on the elements of an object\
    \ structure. Visitor lets you define a new method without changing the classes\
    \ of the elements on which it operates.\n\nSometimes a class hierarchy and its\
    \ code become substantive, and yet it is known that future requirements will be\
    \ inevitable. An example for the Foobar Motor Company is the `IEngine` hierarchy\
    \ which looks like this:\n\n![](images/00037.jpg)\n\nFigure 24.1 : `IEngine` class\
    \ hierarchy\n\nIn reality, the code within the `AbstractEngine` class is likely\
    \ to be composed of a multitude of individual components, such as a `camshaft`,\
    \ `piston`, some `sparkplugs`, etc. If we need to add some functionality that\
    \ traverses these components then the natural way is to just add a method to `AbstractEngine`.\
    \ But maybe we know there are potentially many such new requirements and we would\
    \ rather not have to keep adding methods directly into the hierarchy?\n\nThe Visitor\
    \ pattern enables us to define just one additional method to add into the class\
    \ hierarchy in such a way that lots of different types of new functionality can\
    \ be added without any further changes. This is accomplished by means of a technique\
    \ known as \"double-despatch\", whereby the invoked method issues a call-back\
    \ to the invoking object.\n\nThe technique requires first the definition of an\
    \ interface we shall call `IEngineVisitor`:\n\n```csharp\npublic interface IEngineVisitor\n\
    {\n    void Visit(Camshaft camshaft);\n    void Visit(IEngine engine);\n    void\
    \ Visit(Piston piston);\n    void Visit(SparkPlug sparkPlug);\n}\n```\n\nWe will\
    \ also define an interface called `IVisitable` with an `AcceptEngineVisitor()`\
    \ method:\n\n```csharp\npublic interface IVisitable\n{\n    void AcceptEngineVisitor(IEngineVisitor\
    \ visitor);\n}\n```\n\nThe `IEngine` interface you have met in previous chapters\
    \ (although we will modify it slightly for this chapter). The `Camshaft`, `Piston`\
    \ and `SparkPlug` classes are each very simple, as follows:\n\n```csharp\npublic\
    \ class Camshaft : IVisitable\n{\n    public void AcceptEngineVisitor(IEngineVisitor\
    \ visitor)\n    {\n        visitor.Visit(this);\n    }\n}\n\npublic class Piston\
    \ : IVisitable\n{\n    public void AcceptEngineVisitor(IEngineVisitor visitor)\n\
    \    {\n        visitor.Visit(this);\n    }\n}\n\npublic class SparkPlug : IVisitable\n\
    {\n    public void AcceptEngineVisitor(IEngineVisitor visitor)\n    {\n      \
    \  visitor.Visit(this);\n    }\n}\n```\n\nAs you can see, each of these classes\
    \ defines a method called `AcceptEngineVisitor()` that takes a reference to an\
    \ `IEngineVisitor` object as its argument. All the method does is invoke the `Visit()`\
    \ method of the passed-in `IEngineVisitor`, passing back the object instance.\n\
    \nOur modified `IEngine` interface also now extends `IVisitable`:\n\n```csharp\n\
    public interface IEngine : IVisitable\n{\n    int Size { get; }\n    int Turbo\
    \ { get; }\n}\n```\n\nThe `AbstractEngine` class therefore needs to implement\
    \ this new method, which in this case traverses the individual components (camshaft,\
    \ piston, spark plugs) invoking `AcceptEngineVisitor()` on each:\n\n```csharp\n\
    public abstract class AbstractEngine : IEngine\n{\n    private int size;\n   \
    \ private bool turbo;\n    private Camshaft camshaft;\n    private Piston piston;\n\
    \    private SparkPlug[] sparkPlugs;\n    public AbstractEngine(int size, bool\
    \ turbo)\n    {\n        this.size = size;\n        this.turbo = turbo;\n    \
    \    // Create a camshaft, piston and 4 spark plugs...\n        camshaft = new\
    \ Camshaft();\n        piston = new Piston();\n        sparkPlugs = new SparkPlug[]{new\
    \ SparkPlug(), new SparkPlug(), new SparkPlug(), new SparkPlug()};\n    }\n  \
    \  public virtual int Size\n    {\n        get\n        {\n            return\
    \ size;\n        }\n    }\n    public virtual bool Turbo\n    {\n        get\n\
    \        {\n            return turbo;\n        }\n    }\n    public virtual void\
    \ AcceptEngineVisitor(IEngineVisitor visitor)\n    {\n        // Visit each component...\n\
    \        camshaft.AcceptEngineVisitor(visitor);\n        piston.AcceptEngineVisitor(visitor);\n\
    \        foreach (SparkPlug eachPlug in sparkPlugs)\n        {\n            eachPlug.AcceptEngineVisitor(visitor);\n\
    \        }\n        // Now visit the receiver...\n        visitor.Visit(this);\n\
    \    }\n    public override string ToString()\n    {\n        return this.GetType().Name\
    \ + \" (\" + size + \")\";\n    }\n}\n```\n\nNow we shall create an actual implementation\
    \ of `IEngineVisitor` so you can see how we can easily add functionality to engines\
    \ without any further changes to any engine class. The first thing we shall do\
    \ is to define some clever gizmo that can be attached to an engine that will automatically\
    \ check each component and diagnose any faults. We therefore define the `EngineDiagnostics`\
    \ class:\n\n```csharp\npublic class EngineDiagnostics : IEngineVisitor\n{\n  \
    \  public virtual void Visit(Camshaft camshaft)\n    {\n        Console.WriteLine(\"\
    Diagnosing the camshaft\");\n    }\n    public virtual void Visit(IEngine engine)\n\
    \    {\n        Console.WriteLine(\"Diagnosing the engine\");\n    }\n    public\
    \ virtual void Visit(Piston piston)\n    {\n        Console.WriteLine(\"Diagnosing\
    \ the piston\");\n    }\n    public virtual void Visit(SparkPlug sparkPlug)\n\
    \    {\n        Console.WriteLine(\"Diagnosing a single spark plug\");\n    }\n\
    }\n```\n\nWe also want to print an inventory of how many of each type of component\
    \ there is within an engine, so we also have an `EngineInventory` class:\n\n```csharp\n\
    public class EngineInventory : IEngineVisitor\n{\n    private int camshaftCount;\n\
    \    private int pistonCount;\n    private int sparkPlugCount;\n    public EngineInventory()\n\
    \    {\n        camshaftCount = 0;\n        pistonCount = 0;\n        sparkPlugCount\
    \ = 0;\n    }\n    public virtual void Visit(Camshaft camshaft)\n    {\n     \
    \   camshaftCount++;\n    }\n    public virtual void Visit(IEngine engine)\n \
    \   {\n        Console.WriteLine(\"The engine has: \" + camshaftCount +\" camshaft(s),\
    \ \" + pistonCount + \" piston(s), and \" + sparkPlugCount + \" spark plug(s)\"\
    );\n    }\n    public virtual void Visit(Piston piston)\n    {\n        pistonCount++;\n\
    \    }\n    public virtual void Visit(SparkPlug sparkPlug)\n    {\n        sparkPlugCount++;\n\
    \    }\n}\n```\n\nThe following diagram summarises how all of these classes interact:\n\
    \n![](images/00009.jpg)\n\nFigure 24.2 : Visitor pattern\n\nClient programs now\
    \ need to invoke the `AcceptEngineVisitor()` method on an instance of `IEngine`,\
    \ passing in the appropriate `IEngineVisitor` object:\n\n```csharp\n// Create\
    \ an engine...\nIEngine engine = new StandardEngine(1300);\n\n// Run diagnostics\
    \ on the engine...\nengine.AcceptEngineVisitor(new EngineDiagnostics());\n```\n\
    \nThe above will result in the following output:\n\n`Diagnosing the camshaft`\n\
    `Diagnosing the piston`\n`Diagnosing a single spark plug`\n`Diagnosing a single\
    \ spark plug`\n`Diagnosing a single spark plug`\n`Diagnosing a single spark plug`\n\
    `Diagnosing the unit engine`\n\nAnd to obtain the inventory (using the same `IEngine`\
    \ instance):\n\n```csharp\n// Run inventory on the engine...\nengine.AcceptEngineVisitor(new\
    \ EngineInventory());\n```\n\nThe output should show:\n\n`The engine has: 1 camshaft(s),\
    \ 1 piston(s), and 4 spark plug(s)`\n\n# Part V. Other Useful Patterns\n\nThis\
    \ part describes four additional patterns you should find useful in practical\
    \ applications.\n\n- **Null Object**: Define a class that enables the processing\
    \ of null values;\n- **Simple Factory**: Delegate the instantiation of objects;\n\
    - **Model View Controller**: Separate a user interface component’s screen representation\
    \ from its underlying data and functionality;\n- **Layers**: Partition an application\
    \ into separate modular levels that communicate hierarchically.\n\n25. Null Object\n"
  raw: 'Purpose: Represent a method to be performed on the elements of an object structure.
    Visitor lets you define a new method without changing the classes of the elements
    on which it operates.


    Sometimes a class hierarchy and its code become substantive, and yet it is known
    that future requirements will be inevitable. An example for the Foobar Motor Company
    is the `IEngine` hierarchy which looks like this:


    ![](images/00037.jpg)


    Figure 24.1 : `IEngine` class hierarchy


    In reality, the code within the `AbstractEngine` class is likely to be composed
    of a multitude of individual components, such as a camshaft, piston, some spark
    plugs, etc. If we need to add some functionality that traverses these components
    then the natural way is to just add a method to `AbstractEngine`. But maybe we
    know there are potentially many such new requirements and we would rather not
    have to keep adding methods directly into the hierarchy?


    The Visitor pattern enables us to define just one additional method to add into
    the class hierarchy in such a way that lots of different types of new functionality
    can be added without any further changes. This is accomplished by means of a technique
    known as "double-despatch", whereby the invoked method issues a call-back to the
    invoking object.


    The technique requires first the definition of an interface we shall call `IEngineVisitor`:


    `public interface IEngineVisitor`


    `{`


    `    void Visit(Camshaft camshaft);`


    `    void Visit(IEngine engine);`


    `    void Visit(Piston piston);`


    `    void Visit(SparkPlug sparkPlug);`


    `}`


    We will also define an interface called `IVisitable` with an `AcceptEngineVisitor()`
    method:


    `public interface IVisitable`


    `{`


    `    void AcceptEngineVisitor(IEngineVisitor visitor);`


    `}`


    The `IEngine` interface you have met in previous chapters (although we will modify
    it slightly for this chapter). The `Camshaft`, `Piston` and `SparkPlug` classes
    are each very simple, as follows:


    `public class Camshaft : IVisitable`


    `{`


    `    public void AcceptEngineVisitor(IEngineVisitor visitor)`


    `    {`


    `        visitor.Visit(this);`


    `    }`


    `}`


    `public class Piston : IVisitable`


    `{`


    `    public void AcceptEngineVisitor(IEngineVisitor visitor)`


    `    {`


    `        visitor.Visit(this);`


    `    }`


    `}`


    `public class SparkPlug : IVisitable`


    `{`


    `    public void AcceptEngineVisitor(IEngineVisitor visitor)`


    `    {`


    `        visitor.Visit(this);`


    `    }`


    `}`


    As you can see, each of these classes defines a method called A`cceptEngineVisitor()`
    that takes a reference to an `IEngineVisitor` object as its argument. All the
    method does is invoke the `Visit()` method of the passed-in `IEngineVisitor`,
    passing back the object instance.


    Our modified `IEngine` interface also now extends `IVisitable`:


    `public interface IEngine` `: IVisitable`


    `{`


    `    int Size { get; }`


    `    int Turbo { get; }`


    `}`


    The `AbstractEngine` class therefore needs to implement this new method, which
    in this case traverses the individual components (camshaft, piston, spark plugs)
    invoking `AcceptEngineVisitor()` on each:


    `public abstract class AbstractEngine : IEngine`


    `{`


    `    private int size;`


    `    private bool turbo;`


    `    private Camshaft camshaft;`


    `    private Piston piston;`


    `    private SparkPlug[] sparkPlugs;`


    `    public AbstractEngine(int size, bool turbo)`


    `    {`


    `        this.size = size;`


    `        this.turbo = turbo;`


    `        // Create a camshaft, piston and 4 spark plugs...`


    `        camshaft = new Camshaft();`


    `        piston = new Piston();`


    `        sparkPlugs = new SparkPlug[]{new SparkPlug(), new SparkPlug(), new SparkPlug(),
    new SparkPlug()};`


    `    }`


    `    public virtual int Size`


    `    {`


    `        get`


    `        {`


    `            return size;`


    `        }`


    `    }`


    `    public virtual bool Turbo`


    `    {`


    `        get`


    `        {`


    `            return turbo;`


    `        }`


    `    }`


    `    public virtual void AcceptEngineVisitor(IEngineVisitor visitor)`


    `    {`


    `        // Visit each component first...`


    `        camshaft.AcceptEngineVisitor(visitor);`


    `        piston.AcceptEngineVisitor(visitor);`


    `        foreach (SparkPlug eachSparkPlug in sparkPlugs)`


    `        {`


    `            eachSparkPlug.AcceptEngineVisitor(visitor);`


    `        }`


    `        // Now visit the receiver...`


    `        visitor.Visit(this);`


    `    }`


    `    public override string ToString()`


    `    {`


    `        return this.GetType().Name + " (" + size + ")";`


    `    }`


    `}`


    Now we shall create an actual implementation of `IEngineVisitor` so you can see
    how we can easily add additional functionality to engines without any further
    changes to any engine hierarchy class. The first thing we shall do is to define
    some clever electronic gizmo that can be attached to an engine that will automatically
    check each component and diagnose any faults. We therefore define the `EngineDiagnostics`
    class:


    `public class EngineDiagnostics : IEngineVisitor`


    `{`


    `    public virtual void Visit(Camshaft camshaft)`


    `    {`


    `        Console.WriteLine("Diagnosing the camshaft");`


    `    }`


    `    public virtual void Visit(IEngine engine)`


    `    {`


    `        Console.WriteLine("Diagnosing the engine");`


    `    }`


    `    public virtual void Visit(Piston piston)`


    `    {`


    `        Console.WriteLine("Diagnosing the piston");`


    `    }`


    `    public virtual void Visit(SparkPlug sparkPlug)`


    `    {`


    `        Console.WriteLine("Diagnosing a single spark plug");`


    `    }`


    `}`


    We also want to print an inventory of how many of each type of component there
    is within an engine, so we also have an `EngineInventory` class:


    `public class EngineInventory : IEngineVisitor`


    `{`


    `    private int camshaftCount;`


    `    private int pistonCount;`


    `    private int sparkPlugCount;`


    `    public EngineInventory()`


    `    {`


    `        camshaftCount = 0;`


    `        pistonCount = 0;`


    `        sparkPlugCount = 0;`


    `    }`


    `    public virtual void Visit(Camshaft camshaft)`


    `    {`


    `        camshaftCount++;`


    `    }`


    `    public virtual void Visit(IEngine engine)`


    `    {`


    `        Console.WriteLine("The engine has: " + camshaftCount +" camshaft(s),
    " + pistonCount + " piston(s), and " + sparkPlugCount + " spark plug(s)");`


    `    }`


    `    public virtual void Visit(Piston piston)`


    `    {`


    `        pistonCount++;`


    `    }`


    `    public virtual void Visit(SparkPlug sparkPlug)`


    `    {`


    `        sparkPlugCount++;`


    `    }`


    `}`


    The following diagram summarises how all of these classes interact:


    ![](images/00009.jpg)


    Figure 24.2 : Visitor pattern


    Client programs now only need to invoke the `AcceptEngineVisitor()` method on
    an instance of `IEngine`, passing in the appropriate `IEngineVisitor` object:


    `// Create an engine...`


    `IEngine engine = new StandardEngine(1300);`


    `// Run diagnostics on the engine...`


    `engine.AcceptEngineVisitor(new EngineDiagnostics());`


    The above will result in the following output:


    `Diagnosing the camshaft`


    `Diagnosing the piston`


    `Diagnosing a single spark plug`


    `Diagnosing a single spark plug`


    `Diagnosing a single spark plug`


    `Diagnosing a single spark plug`


    `Diagnosing the unit engine`


    And to obtain the inventory (using the same `IEngine` instance):


    `// Run inventory on the engine...`


    `engine.AcceptEngineVisitor(new EngineInventory());`


    The output should show:


    `The engine has: 1 camshaft(s), 1 piston(s), and 4 spark plug(s)`


    Part V. Other Useful Patterns


    This part describes four additional patterns you should find useful in practical
    applications.


    Null Object: Define a class that enables the processing of null values;


    Simple Factory: Delegate the instantiation of objects;


    Model View Controller: Separate a user interface component’s screen representation
    from its underlying data and functionality;


    Layers: Partition an application into separate modular levels that communicate
    hierarchically.


    25\. Null Object'
