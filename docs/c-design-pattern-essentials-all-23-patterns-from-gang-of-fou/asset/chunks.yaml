    6. Singleton


    Type: Creational


    Purpose: Ensure a class allows only one object to be created, providing a single
    point of access to it.


    The Foobar Motor Company, in common with all vehicle manufacturers, needs to stamp
    a unique serial number on all vehicles they produce. They want to model this requirement
    ensuring that there is just one easy place where the next available serial number
    can be obtained. If we were to have more than one object that generates the next
    number there is a risk that we could end up with separate numbering sequences,
    so we need to prevent this.


    The Singleton pattern provides a way of ensuring that only one instance of a particular
    class can ever be created. So how can we stop other objects from just invoking
    `new` multiple times? There are several ways of accomplishing this, and the "traditional"
    approach that you may often encounter is to make your constructor `private` but
    provide a `public` `static` getter method that returns a `static` instance of
    the Singleton class. This is how it could look:


    `public class SerialNumberGenerator`


    `{`


    `    // static members`


    `    private static volatile SerialNumberGenerator instance;`


    `    public static SerialNumberGenerator Instance`


    `    {`


    `        get`


    `        {`


    `            if (instance == null)`


    `            {`


    `                instance = new SerialNumberGenerator();`


    `            }`


    `            return instance;`


    `        }`


    `    }`


    `    // instance variables`


    `    private int count;`


    `    // private constructor`


    `    private SerialNumberGenerator()`


    `    {`


    `    }`


    `    // instance methods`


    `    public virtual int NextSerial`


    `    {`


    `        get`


    `        {`


    `            return ++count;`


    `        }`


    `    }`


    `}`


    Note that the `Instance` getter will only instantiate the object once and so the
    same instance will always be returned. The constructor is `private` to prevent
    client programs from calling `new`, thus enforcing the fact that only one object
    can ever be created, since they can only go through the `Instance` getter. The
    singleton could be used thus:


    `Console.WriteLine("next serial: " + SerialNumberGenerator.Instance.NextSerial);`


    `Console.WriteLine("next serial: " + SerialNumberGenerator.Instance.NextSerial);`


    `Console.WriteLine("next serial: " + SerialNumberGenerator.Instance.NextSerial);`


    Part III. Structural Patterns


    This part describes the seven structural patterns, that is, those that help manage
    how classes are organised and interrelate.


    *   Adapter: Convert the interface of a class into the interface clients expect,
    letting classes work together that couldn’t otherwise because of incompatible
    types;


    *   Bridge: Decouple an abstraction from its implementation so that each may vary
    independently;


    *   Composite: Compose objects into tree structures to represent part-whole hierarchies,
    letting client objects treat individual objects and compositions uniformly;


    *   Decorator: Attach additional responsibilities to an object dynamically;


    *   Façade: Provide a uniform interface to a set of interfaces in a subsystem,
    by defining a higher-level interface that makes the subsystem easier to use;


    *   Flyweight: Use sharing to support large numbers of fine-grained objects efficiently;


    *   Proxy: Provide a surrogate or place-holder for another object to control access
    to it.


