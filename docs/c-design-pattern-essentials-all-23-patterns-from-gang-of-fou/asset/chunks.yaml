  trans: "\n\n正如任何 C# 程序员很快发现的，软件测试经常会抛出 `NullReferenceException` 消息。有时，解决此问题的方法是在执行操作之前专门针对\
    \ `null` 进行测试，这给程序员增加了额外的负担。\n\n假设一个车辆的仪表盘包含三个警告灯槽位（例如用于机油低位或刹车液低位）。某辆特定的车辆可能只使用其中两盏灯，而第三个槽位为空，在\
    \ C# 中用 `null` 表示。遍历这些槽位需要特定的测试以防止抛出 `NullReferenceException`：\n\n```csharp\n\
    // OilLevelLight & BrakeFluidLight are each types of IWarningLight\nIWarningLight[]\
    \ lights = new IWarningLight[3];\nlights[0] = new OilLevelLight();\nlights[1]\
    \ = new BrakeFluidLight();\nlights[2] = null; // empty slot\n\nforeach (IWarningLight\
    \ currentLight in lights)\n{\n    if (currentLight != null)\n    {\n        currentLight.TurnOn();\n\
    \        currentLight.TurnOff();\n        Console.WriteLine(currentLight.On);\n\
    \    }\n}\n```\n\n一种可以帮助避免对 `null` 测试的方法是在类层次结构中创建一个“空对象”（null object）类。该类将实现相同的接口，但不执行任何实际功能，如图所示：\n\
    \n![](img/00011.jpg)\n图 25.1 : 空对象模式\n\n`IWarningLight` 接口定义了方法 `TurnOn()`、`TurnOff()`\
    \ 以及属性 `On` 的 get 访问器：\n\n```csharp\npublic interface IWarningLight\n{\n    void\
    \ TurnOn();\n    void TurnOff();\n    bool On { get; }\n}\n```\n\n`OilLevelLevel`\
    \ 和 `BrakeFluidLevel` 类分别实现 `IWarningLight` 接口，并提供用于开启或关闭指示灯的适当代码：\n\n```csharp\n\
    public class OilLevelLight : IWarningLight\n{\n    private bool on;\n    public\
    \ virtual void TurnOn()\n    {\n        on = true;\n        Console.WriteLine(\"\
    Oil level light ON\");\n    }\n    public virtual void TurnOff()\n    {\n    \
    \    on = false;\n        Console.WriteLine(\"Oil level light OFF\");\n    }\n\
    \    public virtual bool On\n    {\n        get\n        {\n            return\
    \ on;\n        }\n    }\n}\n\npublic class BrakeFluidLight : IWarningLight\n{\n\
    \    private bool on;\n    public virtual void TurnOn()\n    {\n        on = true;\n\
    \        Console.WriteLine(\"Brake fluid light ON\");\n    }\n    public virtual\
    \ void TurnOff()\n    {\n        on = false;\n        Console.WriteLine(\"Brake\
    \ fluid light OFF\");\n    }\n    public virtual bool On\n    {\n        get\n\
    \        {\n            return on;\n        }\n    }\n}\n```\n\n对于空对象模式，我们还创建了一个\
    \ `NullObjectLight` 类，它实现了 `IWarningLight` 接口但不执行任何实际处理：\n\n```csharp\npublic\
    \ class NullObjectLight : IWarningLight\n{\n    public virtual void TurnOn()\n\
    \    {\n        // Do nothing...\n    }\n    public virtual void TurnOff()\n \
    \   {\n        // Do nothing...\n    }\n    public virtual bool On\n    {\n  \
    \      get\n        {\n            return false;\n        }\n    }\n}\n```\n\n\
    现在我们的客户端代码可以被简化了，因为只要我们使用空对象，就不需要测试槽位是否为 `null`：\n\n```csharp\nIWarningLight[]\
    \ lights = new IWarningLight[3];\nlights[0] = new OilLevelLight();\nlights[1]\
    \ = new BrakeFluidLight();\nlights[2] = new NullObjectLight(); // empty slot\n\
    \n// No need to test for null\nforeach (IWarningLight currentLight in lights)\n\
    {\n    currentLight.TurnOn();\n    currentLight.TurnOff();\n    Console.WriteLine(currentLight.On);\n\
    }\n```\n\n注意，对于空 getter 方法，需要返回任何看似合理的值；因此上述 `On` 属性 getget 访问器返回 `false`，因为它代表一个非扩展状态。\n\
    \n## 简单工厂\n\n在本书的主体部分，我们查看了工厂方法模式（Factory Method）和抽象工厂模式（Abstract Factory）。简单工厂模式是将对象的实例化委托给特定类（即“工厂”）的常用手段。我们在此处假设\
    \ Foobar 公司生产两种类型的变速箱：自动变速箱和手动变速箱。客户端程序可能需要根据条件创建其中一种，如下代码所示（假设类定义在一个类内部）：\n\n\
    ```csharp\nGearbox selectedGearbox = null;\nif (typeWanted.Equals(\"automatic\"\
    ))\n{\n    selectedGearbox = new AutomaticGearbox();\n}\nelse if (typeWanted.Equals(\"\
    manual\"))\n{\n    selectedGearbox = new ManualGearbox();\n}\n// Do something\
    \ with selectedGearbox...\n```\n\n虽然上面的代码可以工作，但如果有多个客户端程序需要执行类似的选择会怎样？我们必须在每个客户端程序中重复\
    \ `if...else...` 语句，如果随后生产了新类型的变速箱，我们必须追踪每一个使用该 `if...else...` 块的地方。\n\n记住封装变化概念的原则，相反我们可以将选择和实例化过程委托给专门为此目的创建的特定类（即“工厂”）。然后客户端程序程序使用工厂的\
    \ `Create()` 方法，如下图所示：\n\n![](img/00012.jpg)\n图 26.1 : 简单工厂模式\n\n简单示例中的抽象类 `Gearbox`\
    \ 定义了一个无参数构造函数：\n\n```csharp\npublic abstract class Gearbox\n{\n}\n```\n\n`AutomaticGearbox`\
    \ 和 `ManualGearbox` 类分别扩展了 `Gearbox` 以实现各自类型：\n\n```csharp\npublic class AutomaticGearbox\
    \ : Gearbox\n{\n    public AutomaticGearbox()\n    {\n        Console.WriteLine(\"\
    New automatic gearbox created\");\n    }\n}\n\npublic class ManualGearbox : Gearbox\n\
    {\n    public ManualGearbox()\n    {\n        Console.WriteLine(\"New manual gearbox\
    \ created\");\n    }\n}\n```\n\n现在我们需要创建一个 `GearboxFactory` 类，它能够实例化相应的 `Gearbox`：\n\
    \n```csharp\npublic class GearboxFactory\n{\n    public enum Type\n    {\n   \
    \     Automatic, Manual\n    }\n    public static Gearbox Create(Type type)\n\
    \    {\n        if (type == Type.Automatic)\n        {\n            return new\
    \ AutomaticGearbox();\n        }\n        else\n        {\n            return\
    \ new ManualGearbox();\n        }\n    }\n}\n```\n\n`Create()` 方法负责选择和实例化，从而隔离了每个客户端程序的重复代码。我们将该方法设置为\
    \ `static` 纯是为了方便，并不是该模式的要求。\n\n客户端程序现在通过工厂获取变速箱类型：\n\n```csharp\n// Create an\
    \ automatic gearbox\nGearbox auto = GearboxFactory.Create(GearboxFactory.Type.Automatic);\n\
    \n// Create a manual gearbox\nGearbox manual = GearboxFactory.Create(GearboxFactory.Type.Manual);\n\
    ```\n\n## 模型视图控制器 (Model View Controller)\n\nFoobar 汽车公司的卫星导航系统包含了当前位置的视觉显示、行驶方向以及当前速度的指示。还有一个输入设备；用于设置目的地等。一个完整的仿真远出了本书的范围，因此我们将使用一个非常简化的界面，仅允许您设置行驶方向（北、南、西、东）和当前速度，而不考虑任何道路等。\n\
    \n用户界面看起来如下：\n\n![](img/00029.jpg)\n图 27.1 : 卫星导航用户界面\n\n"
- fmt: "\nAs you can see from the above, there are buttons to change direction and\
    \ a spinner to adjust the speed. The 'Feedback' section at the bottom of the screen\
    \ automatically adjusts itself to your selections. Note that each time you click\
    \ one of the direction buttons that button is disabled, and the previously selected\
    \ button is re-enabled. The program initially starts by pointing North but with\
    \ a speed of zero.\n\nThis is a straightforward program that would be entirely\
    \ possible to code within a single class. But as graphical applications become\
    \ more complex, it greatly simplifies development and maintenance if you separate\
    \ the major parts of the program.\n\n# The Model View Controller Pattern\n\nThe\
    \ Model View Controller pattern (often abbreviated to `MVC`) is a way of achieving\
    \ a looser coupling between the constituent parts, and is a tried-and-tested approach\
    \ to graphical applications. There are typically three parts at play in GUI applications:\n\
    \n1. **The \"Model\"**: This is the 'data' (i.e. state) and associated application\
    \ or 'business' logic. In our example, this comprises the values of the current\
    \ direction of travel and the current speed together with methods to update and\
    \ return them.\n2. **The \"View\"**: This is the graphical display, as shown in\
    \ Figure 27.1, automatically updating itself as necessary whenever the Model changes\
    \ its state in some way.\n3. **The \"Controller\"**: This is the part that responds\
    \ to all user input (button clicks, controlling the spinner, etc.) and liaises\
    \ with both the Model and the View.\n\nEach of the above three parts will be in\
    \ a separate class, which can be visualised as follows:\n\n![](images/00014.jpg)\n\
    \nFigure 27.2 : Model View Controller pattern\n\nThese classes interrelate in\
    \ the following way:\n\n*   `SatNavModel` contains methods to set and get both\
    \ the direction and speed. It is 'observable' (see Chapter 20) and will notify\
    \ interested observers whenever either the direction or the speed has changed,\
    \ but has no direct knowledge of any other class;\n*   `SatNavView` defines the\
    \ graphical form and user-interface display. It holds a reference to `SatNavModel`\
    \ so it can listen to state changes in the Model and query its state as needed\
    \ to keep the display up-to-date automatically;\n*   `SatNavController` holds\
    \ a reference to both `SatNavModel` and `SatNavView`. It handles button clicks\
    \ and movement of the speed spinner, updating the Model and liaising with the\
    \ View as needed.\n\nJust as with the other patterns described in this book, there\
    \ are variations in how `MVC` can be structured, and the above might be described\
    \ as the 'classical' approach. C# typically uses a modified version of `MVC` in\
    \ which the View and Controller are combined into a single class, but for the\
    \ purposes of this book we will use the full three-class separation to present\
    \ the pattern.\n\n## The Model: SatNavModel\n\nWe shall start with the Model,\
    \ which in our case is the class `SatNavModel`. This has been coded to have no\
    \ direct knowledge of either the View or the Controller, and could therefore be\
    \ plugged into all sorts of other applications without any changes being required.\n\
    \n```cs\npublic class SatNavModel\n{\n    // The directions we can travel\n  \
    \  public enum TravelDirection\n    {\n        Still, North, South, East, West\n\
    \    }\n    // Change handler\n    public event EventHandler ModelChanged;\n \
    \   // The current direction and speed\n    private TravelDirection CurrentDirection;\n\
    \    private int CurrentSpeed;\n    public SatNavModel()\n    {\n        CurrentDirection\
    \ = TravelDirection.North;\n        CurrentSpeed = 0;\n    }\n    public virtual\
    \ TravelDirection Direction\n    {\n        set\n        {\n            if (value\
    \ != CurrentDirection)\n            {\n                CurrentDirection = value;\n\
    \                if (ModelChanged != null)\n                {\n              \
    \      ModelChanged(this, EventArgs.Empty);\n                }\n            }\n\
    \        }\n        get\n        {\n            return CurrentDirection;\n   \
    \     }\n    }\n    public virtual int Speed\n    {\n        set\n        {\n\
    \            if (value != CurrentSpeed)\n            {\n                CurrentSpeed\
    \ = value;\n                if (ModelChanged != null)\n                {\n   \
    \                 ModelChanged(this, EventArgs.Empty);\n                }\n  \
    \          }\n        }\n        get\n        {\n            return CurrentSpeed;\n\
    \        }\n    }\n}\n```\n\nAs you can see, the only link with other classes\
    \ is through its observers (we are using the `EventHandler` event object to facilitate\
    \ this). Each time the direction or speed is modified its observers (also known\
    \ as listeners) are notified.\n\nThe graphical display is performed by the `SatNavView`\
    \ class using standard components. It takes a reference to the `SatNavModel` in\
    \ its constructor, to register itself as an observer of the model. Whenever it\
    \ detects a model change the `HandleModelChanged()` method is called, enabling\
    \ the View to update its display. There are also methods to allow the UI controls\
    \ to be observed (by, for example, the Controller).\n\n```cs\npublic partial class\
    \ SatNavView : Form\n{\n    private SatNavModel model;\n    public event EventHandler\
    \ ViewControlActivated;\n    public SatNavView(SatNavModel model)\n    {\n   \
    \     InitializeComponent();\n        this.model = model;\n        this.model.ModelChanged\
    \ += HandleModelChanged;\n    }\n    private void SatNavView_Load(object sender,\
    \ EventArgs e)\n    {\n        northButton.Enabled = false;\n        feedbackLabel.Text\
    \ = \"You are pointing \" + model.Direction + \" but not yet moving. Use buttons\
    \ and speed control\";\n    }\n    public void HandleModelChanged(Object sender,\
    \ EventArgs args)\n    {\n        feedbackLabel.Text = \"Direction: \" + model.Direction\
    \ + \", speed: \" + model.Speed;\n    }\n    private void eastButton_Click(object\
    \ sender, EventArgs e)\n    {\n        if (ViewControlActivated != null)\n   \
    \     {\n            ControlEventArgs args = new ControlEventArgs();\n       \
    \     args.direction = SatNavModel.TravelDirection.East;\n            ViewControlActivated(this,\
    \ args);\n        }\n    }\n    private void northButton_Click(object sender,\
    \ EventArgs e)\n    {\n        if (ViewControlActivated != null)\n        {\n\
    \            ControlEventArgs args = new ControlEventArgs();\n            args.direction\
    \ = SatNavModel.TravelDirection.North;\n            ViewControlActivated(this,\
    \ args);\n        }\n    }\n    private void southButton_Click(object sender,\
    \ EventArgs e)\n    {\n        if (ViewControlActivated != null)\n        {\n\
    \            ControlEventArgs args = new ControlEventArgs();\n            args.direction\
    \ = SatNavModel.TravelDirection.South;\n            ViewControlActivated(this,\
    \ args);\n        }\n    }\n    private void westButton_Click(object sender, EventArgs\
    \ e)\n    {\n        if (ViewControlActivated != null)\n        {\n          \
    \  ControlEventArgs args = new ControlEventArgs();\n            args.direction\
    \ = SatNavModel.TravelDirection.West;\n            ViewControlActivated(this,\
    \ args);\n        }\n    }\n    private void speedControl_ValueChanged(object\
    \ sender, EventArgs e)\n    {\n        if (ViewControlActivated != null)\n   \
    \     {\n            ControlEventArgs args = new ControlEventArgs();\n       \
    \     args.speed = (int)speedControl.Value;\n            ViewControlActivated(this,\
    \ args);\n        }\n    }\n    internal void enableAllowedButtons()\n    {\n\
    \        // Enable all direction buttons\n        eastButton.Enabled = true;\n\
    \        northButton.Enabled = true;\n        southButton.Enabled = true;\n  \
    \      westButton.Enabled = true;\n        // Disable current direction button\n\
    \        if (model.Direction == SatNavModel.TravelDirection.East)\n        {\n\
    \            eastButton.Enabled = false;\n        }\n    }\n}\n```\n"
  raw: 'As you can see from the above, there are buttons to change direction and a
    spinner to adjust the speed. The ''Feedback'' section at the bottom of the screen
    automatically adjusts itself to your selections. Note that each time you click
    one of the direction buttons that button is disabled, and the previously selected
    button is re-enabled. The program initially starts by pointing North but with
    a speed of zero.


    This is a straightforward program that would be entirely possible to code within
    a single class. But as graphical applications become more complex, it greatly
    simplifies development and maintenance if you separate the major parts of the
    program.


    The Model View Controller pattern (often abbreviated to MVC) is a way of achieving
    a looser coupling between the constituent parts, and is a tried-and-tested approach
    to graphical applications. There are typically three parts at play in GUI applications:


    1\. The "Model". This is the ''data'' (i.e. state) and associated application
    or ''business'' logic. In our example, this comprises the values of the current
    direction of travel and the current speed together with methods to update and
    return them.


    2\. The "View". This is the graphical display, as shown in Figure 27.1, automatically
    updating itself as necessary whenever the Model changes its state in some way.


    3\. The "Controller". This is the part that responds to all user input (button
    clicks, controlling the spinner, etc.) and liaises with both the Model and the
    View.


    Each of the above three parts will be in a separate class, which can be visualised
    as follows:


    ![](images/00014.jpg)


    Figure 27.2 : Model View Controller pattern


    These classes interrelate in the following way:


    *   `SatNavModel` contains methods to set and get both the direction and speed.
    It is ''observable'' (see Chapter 20) and will notify interested observers whenever
    either the direction or the speed has changed, but has no direct knowledge of
    any other class;


    *   `SatNavView` defines the graphical form and user-interface display. It holds
    a reference to `SatNavModel` so it can listen to state changes in the Model and
    query its state as needed to keep the display up-to-date automatically;


    *   `SatNavController` holds a reference to both `SatNavModel` and `SatNavView`.
    It handles button clicks and movement of the speed spinner, updating the Model
    and liaising with the View as needed.


    Just as with the other patterns described in this book, there are variations in
    how MVC can be structured, and the above might be described as the ''classical''
    approach. C# typically uses a modified version of MVC in which the View and Controller
    are combined into a single class, but for the purposes of this book we will use
    the full three-class separation to present the pattern.


    We shall start with the Model, which in our case is the class `SatNavModel`. This
    has been coded to have no direct knowledge of either the View or the Controller,
    and could therefore be plugged into all sorts of other applications without any
    changes being required.


