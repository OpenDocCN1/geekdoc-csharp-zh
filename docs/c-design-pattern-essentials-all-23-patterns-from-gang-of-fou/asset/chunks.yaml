    \        builder.BuildBody();\n        builder.BuildReinforcedStorageArea();\n\
    \    }\n}\n```\n"
  raw: 'Now we need a way of getting the correct family of parts (either for a car
    or for a van) but without having to explicitly instantiate the specific type in
    client programs each time we require them. To accomplish this, we shall define
    "factory" classes that will do this for us:


    ![](images/00042.jpg)


    Figure 2.2 : Abstract Factory pattern


    The `AbstractVehicleFactory` class is an abstract class that defines the abstract
    methods `CreateBody()`, `CreateChassis()` and `CreateGlassware()`, returning an `IBody`,
    `IChassis` and `IGlassware` object respectively:


    `public abstract class AbstractVehicleFactory`


    `{`


    `    public abstract IBody CreateBody();`


    `    public abstract IChassis CreateChassis();`


    `    public abstract IGlassware CreateGlassware();`


    `}`


    The concrete subclass `CarFactory` returns the objects specific for the car family:


    `public class CarFactory : AbstractVehicleFactory`


    `{`


    `    public override IBody CreateBody()`


    `    {`


    `        return new CarBody();`


    `    }`


    `    public override IChassis CreateChassis()`


    `    {`


    `        return new CarChassis();`


    `    }`


    `    public override IGlassware CreateGlassware()`


    `    {`


    `        return new CarGlassware();`


    `    }`


    `}`


    The concrete subclass `VanFactory` returns the objects specific for the van family:


    `public class VanFactory : AbstractVehicleFactory`


    `{`


    `    public override IBody CreateBody()`


    `    {`


    `        return new VanBody();`


    `    }`


    `    public override IChassis CreateChassis()`


    `    {`


    `        return new VanChassis();`


    `    }`


    `    public override IGlassware CreateGlassware()`


    `    {`


    `        return new VanGlassware();`


    `    }`


    `}`


    Now it just remains for client programs to instantiate the appropriate ''factory''
    after which it can obtain the correct parts without having to specify whether
    they are for a car or a van:


    ![](images/00064.jpg)


    Figure 2.3 : How clients use Abstract Factory


    `string whatToMake = "car"; // or "van"`


    `AbstractVehicleFactory factory = null;`


    `// Create the correct ''factory''...`


    `if (whatToMake.Equals("car"))`


    `{`


    `    factory = new CarFactory();`


    `}`


    `else`


    `{`


    `    factory = new VanFactory();`


    `}`


    `// Create the vehicle''s component parts...`


    `// These will either be all car parts or all van parts`


    `IBody vehicleBody = factory.CreateBody();`


    `IChassis vehicleChassis = factory.CreateChassis();`


    `IGlassware vehicleGlassware = factory.CreateGlassware();`


    `// Show what we''ve created...`


    `Console.WriteLine(vehicleBody.BodyParts);`


    `Console.WriteLine(vehicleChassis.ChassisParts);`


    `Console.WriteLine(vehicleGlassware.GlasswareParts);`


    `Console.Read();`


    Therefore your client program needs to know if it is making a car or a van, but
    once it has instantiated the correct factory all the methods to create the parts
    can be done using an identical set of method calls.


    The main disadvantage of the Abstract Factory pattern arises if you need to add
    additional ''products''. For example, if we now need to include lights in the
    family of components, we would need to amend `AbstractVehicleFactory`, `CarFactory`
    and `VanFactory`, in addition to creating a new `ILights` hierarchy (`CarLights`
    and `VanLights`).


    3. Builder


    Type: Creational


    Purpose: Separate the construction of a complex object from its representation
    so that the same construction process can create different representations.


    The Foobar Motor Company makes cars and vans, and the construction process of
    each differs in detail; for example, the body shell of a van comprises a cab area
    and a large reinforced storage area, whereas a saloon car comprises a passenger
    area and a luggage area (i.e. boot). And of course there a number of complex steps
    that have to be undertaken regardless of what type of vehicle is being built.


    The Builder pattern facilitates the construction of complex objects by separating
    the individual steps into separate methods in a Builder hierarchy, and then using
    a Director object to specify the required steps in the correct order. Finally,
    the finished product is retrieved from the Builder.


    The following diagram shows these relationships:


    ![](images/00031.jpg)


    Figure 3.1 : Builder pattern


    We start off with the abstract `VehicleBuilder` class:


    `public abstract class VehicleBuilder`


    `{`


    `    public virtual void BuildBody() {}`


    `    public virtual void BuildBoot() {}`


    `    public virtual void BuildChassis() {}`


    `    public virtual void BuildPassengerArea() {}`


    `    public virtual void BuildReinforcedStorageArea() {}`


    `    public virtual void BuildWindows() {}`


    `    public abstract IVehicle Vehicle {get;}`


    `}`


    Note how this class defines all possible ''build'' methods for both cars and vans,
    and provides empty implementations for each as a default. The abstract `Vehicle` property
    getter is for returning the finished vehicle.


    The `CarBuilder` class inherits from `VehicleBuilder` and overrides the appropriate
    methods:


    `public class CarBuilder : VehicleBuilder`


    `{`


    `    private AbstractCar carInProgress;`


    `    public CarBuilder(AbstractCar car)`


    `    {`


    `        carInProgress = car;`


    `    }`


    `    public override void BuildBody()`


    `    {`


    `        Console.WriteLine("building car body");`


    `    }`


    `    public override void BuildBoot()`


    `    {`


    `        Console.WriteLine("building car boot");`


    `    }`


    `    public override void BuildChassis()`


    `    {`


    `        Console.WriteLine("building car chassis");`


    `    }`


    `    public override void BuildPassengerArea()`


    `    {`


    `        Console.WriteLine("building car passenger area");`


    `    }`


    `    public override void BuildWindows()`


    `    {`


    `        Console.WriteLine("building car windows");`


    `    }`


    `    public override IVehicle Vehicle`


    `    {`


    `        get`


    `        {`


    `            return carInProgress;`


    `        }`


    `    }`


    `}    `


    Note that the `BuildReinforcedStorageArea()` method was not overridden since it
    is not applicable to cars. The `VanBuilder` class overrides the appropriate methods
    to build a van:


    `public class VanBuilder : VehicleBuilder`


    `{`


    `    private AbstractVan vanInProgress;`


    `    public VanBuilder(AbstractVan van)`


    `    {`


    `        vanInProgress = van;`


    `    }`


    `    public override void BuildBody()`


    `    {`


    `        Console.WriteLine("building van body");`


    `    }`


    `    public override void BuildChassis()`


    `    {`


    `        Console.WriteLine("building van chassis");`


    `    }`


    `    public override void BuildReinforcedStorageArea()`


    `    {`


    `        Console.WriteLine("building van storage area");`


    `    }`


    `    public override void BuildWindows()`


    `    {`


    `        Console.WriteLine("building van windows");`


    `    }`


    `    public override IVehicle Vehicle`


    `    {`


    `        get`


    `        {`


    `            return vanInProgress;`


    `        }`


    `    }`


    `}`


    Note that the `BuildBoot()` and `BuildPassengerArea()` methods were not overridden
    since they are not applicable to vans.


    The `VehicleDirector` abstract class requires a `VehicleBuilder` object passed
    to its `Build()` method for implementation by subclasses:


    `public abstract class VehicleDirector`


    `{`


    `    public abstract IVehicle Build(VehicleBuilder builder);`


    `}`


    The `CarDirector` class inherits from `VehicleDirector` and provides the step-by-step
