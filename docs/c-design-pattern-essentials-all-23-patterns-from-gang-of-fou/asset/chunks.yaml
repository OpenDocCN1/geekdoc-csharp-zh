    VehicleManager manager = new VehicleManager();\nVehicle saloon1 = manager.CreateSaloon();\n\
    Vehicle saloon2 = manager.CreateSaloon();\nVehicle pickup1 = manager.CreatePickup();\n\
    ```\n\nA drawback of `VehicleManager` as coded is that it always instantiates\
    \ at least one vehicle of each type as part of the construction process. If not\
    \ all types of vehicles will be needed, a more efficient technique would be to\
    \ lazy-load by only instantiating the first time each is needed. This is illustrated\
    \ in the modified version of the class (which we will call `VehicleManagerLazy`)\
    \ below:\n\n```csharp\npublic class VehicleManagerLazy\n{\n    private IVehicle\
    \ saloon, coupe, sport, boxVan, pickup;\n    public VehicleManagerLazy()\n   \
    \ {\n    }\n    public virtual IVehicle CreateSaloon()\n    {\n        if (saloon\
    \ == null)\n        {\n            saloon = new Saloon(new StandardEngine(1300));\n\
    \        }\n        return (IVehicle)saloon.Clone();\n    }\n    public virtual\
    \ IVehicle CreateCoupe()\n    {\n        if (coupe == null)\n        {\n     \
    \       coupe = new Coupe(new StandardEngine(1300));\n        }\n        return\
    \ (IVehicle)coupe.Clone();\n    }\n    public virtual IVehicle CreateSport()\n\
    \    {\n        if (sport == null)\n        {\n            sport = new Sport(new\
    \ StandardEngine(1300));\n        }\n        return (IVehicle)sport.Clone();\n\
    \    }\n    public virtual IVehicle CreateBoxVan()\n    {\n        if (boxVan\
    \ == null)\n        {\n            boxVan = new BoxVan(new StandardEngine(1300));\n\
    \        }\n        return (IVehicle)boxVan.Clone();\n    }\n    public virtual\
    \ IVehicle CreatePickup()\n    {\n        if (pickup == null)\n        {\n   \
    \         pickup = new Pickup(new StandardEngine(1300));\n        }\n        return\
    \ (IVehicle)pickup.Clone();\n    }\n}\n```\n\nBefore a clone is returned, a check\
    \ is made to ensure the 'prototype' object exists, and it will be instantiated\
    \ if necessary. From then on it clones the previously instantiated object. Client\
    \ programs can use `VehicleManagerLazy` in the same way as before:\n\n```csharp\n\
    VehicleManagerLazy manager = new VehicleManagerLazy();\nVehicle saloon1 = manager.CreateSaloon();\n\
    Vehicle saloon2 = manager.CreateSaloon();\nVehicle pickup1 = manager.CreatePickup();\n\
    ```\n\n# 6. Singleton\n\n**Type**: Creational\n**Purpose**: Ensure a class allows\
    \ only one object to be created, providing a single point of access to it.\n\n\
    The Foobar Company, in common with all vehicle manufacturers, needs to stamp a\
    \ unique serial number on all vehicles they produce. They want to model this requirement\
    \ ensuring that there is one easy place where the next available serial number\
    \ can be obtained. If we were to have more than one object that generates the\
    \ next number there is a risk that we could end up with separate sequences, so\
    \ we need to prevent this.\n\nThe `Singleton` pattern provides a way of ensuring\
    \ that only one instance of a particular class can ever be created. So how can\
    \ we stop other objects from just invoking `new`? There are several ways of accomplishing\
    \ this, and the \"traditional\" approach you may often encounter is to make your\
    \ constructor `private` but provide a `public` `static` getter method that returns\
    \ `static` instance of the class. This is how it could look:\n\n```csharp\npublic\
    \ class SerialNumberGenerator\n{\n    // static members\n    private static volatile\
    \ SerialNumberGenerator instance;\n    public static SerialNumberGenerator Instance\n\
    \    {\n        get\n        {\n            if (instance == null)\n          \
    \  {\n                instance = new SerialNumberGenerator();\n            }\n\
    \            return instance;\n        }\n    }\n    // instance variables\n \
    \   private int count;\n    // private constructor\n    private SerialNumberGenerator()\n\
    \    {\n    }\n    // instance methods\n    public virtual int NextSerial\n  \
    \  {\n        get\n        {\n            return ++count;\n        }\n    }\n\
    }\n```\n\nNote that the `Instance` getter will only instantiate the object once\
    \ and so the same instance will be returned. The constructor is `private` to prevent\
    \ client programs from calling `new`, thus enforcing the fact that only one object\
    \ can ever be created, since they can only go through the `Instance` getter. The\
    \ singleton could be used thus:\n\n```csharp\nConsole.WriteLine(\"next serial:\
    \ \" + SerialNumberGenerator.Instance.NextSerial);\nConsole.WriteLine(\"next serial:\
    \ \" + SerialNumberGenerator.Instance.NextSerial);\nConsole.WriteLine(\"next serial:\
    \ \" + SerialNumberGenerator.Instance.NextSerial);\n```\n\n# Part III. Structural\
    \ Patterns\n\nThis part describes the seven structural patterns, that is, those\
    \ that help manage how classes are organised and interrelate.\n\n- **Adapter**:\
