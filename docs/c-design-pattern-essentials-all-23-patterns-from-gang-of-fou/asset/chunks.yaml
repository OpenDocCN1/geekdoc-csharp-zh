    The other subclasses are similarly defined, and the `Price` getter returns:\n\n\
    *   6,000 for `Saloon` objects;\n*   7,000 for `Coupe` objects;\n*   8,000 for\
    \ `Sport` objects;\n*   9,000 for `Pickup` objects;\n*   10,000 for `BoxVan` objects.\n\
    \nWhen a customer buys a vehicle they have the choice of adding any number of\
    \ optional extras. They can choose from an air-conditioning system, alloy wheels,\
    \ leather seats, metallic paint, or a satellite-navigation unit. They can choose\
    \ none at all, or any combination up to all five.\n\nThe Decorator pattern is\
    \ designed to facilitate the addition of state and/or behaviour without having\
    \ to modify the inheritance hierarchy of the classes being added to. This is accomplished\
    \ by defining a new hierarchy which itself extends the root of the main tree.\n\
    \nThis is shown diagrammatically below:\n\n![](images/00049.jpg)\n\nFigure 10.2\
    \ : Decorator pattern hierarchy\n\nFrom the diagram you can see that a new abstract\
    \ class has been defined called `AbstractVehicleOption` that inherits from `AbstractVehicle`.\
    \ `AbstractVehicleOption` has five concrete subclasses; one for each option that\
    \ can be selected. The `AbstractVehicleOption` class looks like this:\n\n```csharp\n\
    public abstract class AbstractVehicleOption : AbstractVehicle\n{\n    protected\
    \ IVehicle decoratedVehicle;\n    public AbstractVehicleOption(IVehicle vehicle)\n\
    \        : base(vehicle)\n    {\n        decoratedVehicle = vehicle;\n    }\n\
    }\n```\n\n`AbstractVehicleOption` is the abstract \"decorator\" class and it requires\
    \ a reference to the `IVehicle` class which is be decorated. Each of the option\
    \ subclasses is straightforward. They all override the `Price` getter to add the\
    \ price of the object that is being decorated. In the case of `AirConditionedVehicle`\
    \ and `SatNavVehicle` classes, we have defined an extra method:\n\n```csharp\n\
    public class AirConditionedVehicle : AbstractVehicleOption\n{\n    public AirConditionedVehicle(IVehicle\
    \ vehicle)\n        : base(vehicle)\n    {\n    }\n    public override int Price\n\
    \    {\n        get\n        {\n            return decoratedVehicle.Price + 600;\n\
    \        }\n    }\n    public virtual int Temperature\n    {\n        set\n  \
    \      {\n            // code to set the temperature...\n        }\n    }\n}\n\
    \npublic class AlloyWheeledVehicle : AbstractVehicleOption\n{\n    public AlloyWheeledVehicle(IVehicle\
    \ vehicle)\n        : base(vehicle)\n    {\n    }\n    public override int Price\n\
    \    {\n        get\n        {\n            return decoratedVehicle.Price + 250;\n\
    \        }\n    }\n}\n\npublic class LeatherSeatedVehicle : AbstractVehicleOption\n\
    {\n    public LeatherSeatedVehicle(IVehicle vehicle)\n        : base(vehicle)\n\
    \    {\n    }\n    public override int Price\n    {\n        get\n        {\n\
    \            return decoratedVehicle.Price + 1200;\n        }\n    }\n}\n\npublic\
    \ class MetallicPaintedVehicle : AbstractVehicleOption\n{\n    public MetallicPaintedVehicle(IVehicle\
    \ vehicle)\n        : base(vehicle)\n    {\n    }\n    public override int Price\n\
    \    {\n        get\n        {\n            return decoratedVehicle.Price + 750;\n\
    \        }\n    }\n}\n\npublic class SatNavVehicle : AbstractVehicleOption\n{\n\
    \    public SatNavVehicle(IVehicle vehicle)\n        : base(vehicle)\n    {\n\
    \    }\n    public override int Price\n    {\n        get\n        {\n       \
    \     return decoratedVehicle.Price + 1500;\n        }\n    }\n    public virtual\
    \ string Destination\n    {\n        set\n        {\n            // code to set\
    \ the destination\n        }\n    }\n}\n```\n\nTo use the 'decorators' we initially\
    \ instantiate the car or van we then \"wrap\" them inside the required decorator.\
    \ Here is an example:\n\n```csharp\n// Create a blue saloon\nIVehicle myCar =\
    \ new Saloon(new Engine(1300));\nmyCar.Paint(VehicleColour.Blue);\n// Add air-conditioning\
    \ to the car...\nmyCar = new AirConditionedVehicle(myCar);\n// Now add alloy wheels...\n\
    myCar = new AlloyWheeledVehicle(myCar);\n// Now add leather seats...\nmyCar =\
    \ new LeatherSeatedVehicle(myCar);\n// Now add metallic paint...\nmyCar = new\
    \ MetallicPaintedVehicle(myCar);\n// Now add satellite-navigation...\nmyCar =\
    \ new SatNavVehicle(myCar);\n```\n\nIf you invoke `Console.WriteLine()` on the\
    \ `myCar` at each stage you should see this output:\n\n`Saloon (Engine, Blue,\
    \ price 6000)`\n`AirConditionedVehicle (Saloon (...), price 6600)`\n`AlloyWheeledVehicle\
    \ (AirConditionedVehicle (Saloon (...),), price 6850)`\n`LeatherSeatedVehicle\
    \ (AlloyWheeledVehicle (...)), price 8050)`\n`MetallicPaintedVehicle (LeatherSeatedVehicle\
    \ (...)), price 8800)`\n`SatNavVehicle (MetallicPaintedVehicle (...)), price 10300)`\n\
    \nThe Decorator pattern is a good example of preferring object composition over\
    \ inheritance. Had we attempted to use inheritance for the various vehicle options\
    \ we would have needed to create many different combinations of subclasses to\
    \ model each combination of.\n\n# 11. Facade\n\n**Type**: Structural\n\n**Purpose**:\
    \ Provide a unified interface to a set of interfaces in a subsystem. Facade defines\
    \ a higher-level interface that makes the subsystem easier to use.\n\nSometimes\
    \ you need to perform a series of steps to undertake a particular task, often\
