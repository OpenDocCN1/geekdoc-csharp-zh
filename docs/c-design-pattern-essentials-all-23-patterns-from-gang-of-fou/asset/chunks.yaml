    *   10,000 for `BoxVan` objects.


    When a customer buys a vehicle they have the choice of adding any number of optional
    extras. They can choose from an air-conditioning system, alloy wheels, leather
    seats, metallic paint, or a satellite-navigation unit. They can choose none at
    all, or any combination up to all five.


    The Decorator pattern is designed to facilitate the addition of state and/or behaviour
    without having to modify the inheritance hierarchy of the classes being added
    to. This is accomplished by defining a new hierarchy which itself extends the
    root of the main tree.


    This is shown diagrammatically below:


