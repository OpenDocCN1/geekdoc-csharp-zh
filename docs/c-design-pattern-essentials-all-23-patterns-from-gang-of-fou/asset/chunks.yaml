    \ speedo = (Speedometer)sender;\n        if (speedo.CurrentSpeed <= 10)\n    \
    \    {\n            Console.WriteLine(\"Now in first gear\");\n        }\n   \
    \     else if (speedo.CurrentSpeed <= 20)\n        {\n            Console.WriteLine(\"\
    Now in second gear\");\n        }\n        else if (speedo.CurrentSpeed <= 30)\n\
