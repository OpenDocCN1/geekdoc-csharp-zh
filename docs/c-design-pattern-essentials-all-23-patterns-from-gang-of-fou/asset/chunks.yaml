    ### Consequences

    Encapsulates the storage of state external to the originating object, but might
    be expensive in terms of memory or performance.


    ![](images/00057.jpg)


    * `Originator` creates the `Memento` object and uses it to restore its state;

    * `Memento` stores the state of `Originator`;

    * `Caretaker` keeps the memento.


    ### Observer

    **Type**: Behavioural


    **Purpose**: Define a one-to-many dependency between objects so that when one
    object changes its state, all its dependants are notified and updated automatically.


    **Example usage**: GUI controls, events, etc.


    **Consequences**: Decouples classes through a common interface.


    ![](images/00059.jpg)


    * `Observable` defines the mechanisms to register observers and notify them of
    events;

    * `ConcreteObservable` extends `Observable` for a particular subject class;

    * `IObserver` defines an interface for interested classes;

    * `ConcreteObserver` implements `IObserver` for a particular interested class.


    ### Prototype

    **Type**: Creational


    **Purpose**: Specify the kinds of objects to create using a prototypical instance,
    and create new objects by copying the prototype.


    **Example usage**: Where easier or faster to clone than to instantiate.


    **Consequences**: Cloning might become difficult in certain situations.


    ![](images/00061.jpg)


    * `IPrototype` defines an interface that can ''clone'' itself;

    * `ConcretePrototype` performs the self-cloning.


    Client programs create new objects by asking a prototype to clone itself.


    ### Proxy

    **Type**: Structural


    **Purpose**: Provide a surrogate or place-holder for another object to control
    access to it.


    **Example usage**: Netwotk connections, security proxies, etc.


    **Consequences**: Possible descrease in performance.


    ![](images/00063.jpg)


    * `ISubject` defines the interface that needs to be accessed through a proxy;

    * `RealSubject` defines the actual object which `Proxy` represents;

    * `Proxy` maintains a reference to `RealSubject` so it can act on its behalf.


    ### Singleton

    **Type**: Creational


    **Purpose**: Ensure a class allows only one object to be created, providing a
    single point of access to it.


    **Example usage**: Log files, configuration settings, etc.


    **Consequences**: Often overused, difficult to subclass, can lead to tight coupling.


    ![](images/00005.jpg)


    * `Singleton` defines a `private` constructor together with a `public` class (i.e.
    `static`) method as the only means of getting the instance.


    Note that this book recommends using an `enum` to implement the Singleton pattern
    in most instances.


    ### State

    **Type**: Behavioural


    **Purpose**: Allow an object to alter its behaviour when its internal state changes.
    The object will appear to change its class.


    **Example usage**: UI shape components, etc.


    **Consequences**: Localises state-specific behaviour and separates behaviour for
    different states.


    ![](images/00066.jpg)


    * `IState` defines the interface for handling different states in the `Handle()`
    method;

    * `ConcreteStateA` and `ConcreteStateB` implement the `IState` interface for each
    separate state;

    * `Context` holds a reference to an `IState` object to request a particular state.


    ### Strategy

    **Type**: Behavioural


    **Purpose**: Define a family of algorithms, encapsulate each one, and make them
    interchangeable. Strategy lets the algorithm vary independently from clients that
    use it.


    **Example usage**: Need to change algorithms.


    **Consequences**: Might need to pass data to each strategy.


    ![](images/00068.jpg)


    * `IStrategy` defines the interface for the algorithms;

    * `ConcreteStrategyA` and `ConcreteStrategyB` implement `IStrategy` for a particular
    algorithm;

    * `Context` holds a reference to the `IStrategy` that is being used.


    ### Template Method

    **Type**: Behavioural


    **Purpose**: Define the skeleton of an algorithm in a method, deferring some steps
    to subclasses. Template Method lets subclasses redefine certain steps of an algorithm
    without changing the algorithm''s structure.


    **Example usage**: When an algorithm''s steps can be performed in different ways.


    **Consequences**: Should prevent the template method from being overridden.


    ![](images/00025.jpg)


    * `AbstractClass` defines the non-overridable `TemplateMethod()` that invokes
    a series of abstract methods defined in subclasses;

    * `Subclass1` and `Subclass2` extend `AbstractClass` to define the code for each
    abstract method invoked by `TemplateMethod()`.


    ### Visitor

    **Type**: Behavioural


    **Purpose**: Represent a method to be performed on the elements of an object structure.
    Visitor lets you define a new method without changing the classes of the elements
    on which it operates.


    **Example usage**: Similar operations need performing on different types in a
    structure, or as a means to add functionality without extensive modifications.


    **Consequences**: Adding new visitable objects can require modifying visitors.


    ![](images/00001.jpg)


    * `IVisitor` defines the interface that declares methods to visit each kind of
    visitable `IElement`;

    * `ConcreteVisitor1` and `ConcreteVisitor2` implement the `IVisitor` interface
    for each element that could be visited;

    * `IElement` defines the interface for all classes which could be visited;

    * `ConcreteElementA` and `ConcreteElementB` implement the `IElement` interface
    for each class that could be visited.

    * `ObjectStructure` contains references to all objects that can be visited, enabling
    iteration through them.


