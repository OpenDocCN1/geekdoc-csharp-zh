    `    {`


    `        get`


    `        {`


    `            return turbo;`


    `        }`


    `    }`


    `    public override string ToString()`


    `    {`


    `        return this.GetType().Name + " (" + size + ")";`


    `    }`


    `}`


    Let''s say our client program takes engines stored in a collection and loops through
    them one at a time displaying the engine size and type:


    `IList<IEngine> engines = new List<IEngine>();`


    `engines.Add(new StandardEngine(1300));`


    `engines.Add(new StandardEngine(1600));`


    `engines.Add(new TurboEngine(2000));`


    `foreach (IEngine engine in engines) {`


    `    Console.WriteLine(engine);`


    `}`


    Running the above code would result in the following display:


    `StandardEngine` `(1300)`


    `StandardEngine (1600)`


    `TurboEngine (2000)`


    For this chapter we will assume that in addition to the two concrete subclasses
    (`StandardEngine` and `TurboEngine`) Foobar have decided to use a further engine
    class named `SuperGreenEngine` which is made by a different manufacturer. Because
    the `SuperGreenEngine` class is provided by a third-party it does not implement
    our `IEngine` interface. Furthermore, Foobar do not have access to the C# source
    code and can therefore not modify it, but the following class details are known
    from the documentation:


    *   The class extends `object`;


    *   The constructor takes one argument for the engine size;


    *   There is an `EngineSize` property getter that returns the engine size as an
    `int`;


    *   These types of engines are never turbocharged;


    *   The `ToString()` method returns a string in the format: SUPER ENGINE nnnn
    (where nnnn is the engine size).


    We can therefore see that `SuperGreenEngine` uses a different method name to access
    the engine size and there is no method related to whether it is turbocharged,
    and that it is not within the `IEngine` hierarchy. As it stands it would not be
    possible to add instances of `SuperGreenEngine` to the reporting collection and
    even if you could the method names are different.


    The Adapter pattern provides an approach to resolve this through the definition
    of a new class that ''adapts'' the class we want to use into the format existing
    classes require. For our purposes, therefore, we shall create a `SuperGreenEngineAdapter`
    class:


    ![](images/00040.jpg)


    Figure 7.2 : Adapter class hierarchy


    The code for the adapter is as follows:


    `public class SuperGreenEngineAdapter : AbstractEngine`


    `{`


    `    public SuperGreenEngineAdapter(SuperGreenEngine greenEngine)`


    `        : base(greenEngine.EngineSize, false)`


    `    {`


    `    }`


    `}`


    Note the following from the above code:


    *   We extend the class we are adapting to;


    *   We accept a reference in the constructor to the class we are adapting from;


    *   The constructor obtains the necessary state from the referenced object and
    passes it to the superclass constructor.


    Now we are in a position to include `SuperGreenEngine` objects in our reporting
    collection (additional code indicated in bold):


    `IList<Engine> engines = new List<Engine>();`


    `engines.Add(new StandardEngine(1300));`


    `engines.Add(new StandardEngine(1600));`


    `engines.Add(new TurboEngine(2000));`


    `// "Adapt" the new engine type...`


    `SuperGreenEngine greenEngine = new SuperGreenEngine(1200);`


    `engines.Add(new SuperGreenEngineAdapter(greenEngine));`


    `// Unchanged from before...`


    `foreach (IEngine engine : engines) {`


    `     Console.WriteLine(engine);`


    `}`


    The output should now be:


    `StandardEngine (1300)`


    `StandardEngine (1600)`


    `TurboEngine (2000)`


    `SuperGreenEngineAdapter (1200)`


    Note how the output made use of the `ToString()` method as inherited from `AbstractEngine`
    rather than that of `SuperGreenEngine`.


    Variations for implementing adapters


    We were somewhat fortunate in that the design of the `AbstractEngine` and `SuperGreenEngine`
    classes made it easy for the adapter class to do the work inside its constructor.
    Often however, we need to take a few additional steps inside the code of the adapter
    class, so here is a general formula to apply:


    1\. Extend the class you are adapting to (or implement it, if it''s an interface);


    2\. Specify the class you are adapting from in the constructor and store a reference
    to it in an instance variable;


    3\. For each method in the class you are extending (or interface you are implementing),
    override it to delegate to the corresponding method of the class you are adapting
    from.


    Here is a generic example adapter class:


    `public class ObjectAdapter : ClassAdaptingTo`


    `{`


    `    private ClassAdaptingFrom fromObject;`


    `    public ObjectAdapter(ClassAdaptingFrom fromObject)`


    `    {`


    `        this.fromObject = fromObject;`


    `    }`


    `    // Overridden method`


    `    public override void MethodInToClass()`


    `    {`


    `        fromObject.MethodInFromClass();`


    `    }`


    `}`


    8\. Bridge


    Type: Structural


    Purpose: Decouple an abstraction from its implementation so that each may vary
    independently.


    The Foobar Motor Company manufactures engines for its vehicles. Here is a reminder
    of the `IEngine` class hierarchy:


    ![](images/00037.jpg)


    Figure 8.1 : `IEngine` class hierarchy


    The implementation of the `AbstractEngine` class as detailed in the introduction,
    merely stores the engine size (e.g. 1600cc) and whether it is turbocharged. For
    the purposes of this chapter this class will be enhanced to enable the engine
    to be started and stopped and for the power to the engine to be increased or decreased.


    The modified version of the `IEngine` interface and `AbstractEngine` class is
    listed below with the changes marked in bold:


    `public interface IEngine`


    `{`


    `    int Size { get; }`


    `    bool Turbo { get; }`


    `    void Start();`


    `    void Stop();`


    `    void IncreasePower();`


    `    void DecreasePower();`


    `}`


    `public abstract class AbstractEngine : IEngine`


    `{`


    `    private int size;`


    `    private bool turbo;`


    `    private bool running;`


    `    private int power;`


    `    public AbstractEngine(int size, bool turbo)`


    `    {`


    `        this.size = size;`


    `        this.turbo = turbo;`


    `        running = false;`


    `        power = 0;`


    `    }`


    `    public virtual int Size`


    `    {`


    `        get`


    `        {`


    `            return size;`


    `        }`


    `    }`


    `    public virtual bool Turbo`


    `    {`


    `        get`


    `        {`


    `            return turbo;`


    `        }`


    `    }`


    `    public virtual void Start()`


    `    {`


    `        running = true;`


    `    }`


    `    public virtual void Stop()`


    `    {`


    `        running = false;`


    `        power = 0;`


    `    }`


    `    public virtual void IncreasePower()`


    `    {`


    `        if ((running) && (power < 10))`


    `        {`


    `            power++;`


    `        }`


    `    }`


    `    public virtual void DecreasePower()`


    `    {`


    `        if ((running) && (power > 0))`


    `        {`


    `            power--;`


    `        }`


    `    }`


    `    public override string ToString()`


    `    {`


    `        return this.GetType().Name + " (" + size + ")";`


    `    }`


    `}`


    Within a vehicle, the driver controls the functions of the engine indirectly by
    means of various hand and foot controls, such as the ignition switch, accelerator
    pedal and brake pedal. To retain flexibility, it is important to design the connection
    between the engine and the controls so that each can vary independently of the
    other. In other words:


    *   A new engine can be designed and plugged into a vehicle without needing any
    driver controls to be changed; and


    *   New driver controls (for example, to assist disabled drivers) can be designed
    and plugged into a vehicle without needing the engines to change.


    The Bridge pattern addresses this requirement by separating the ''abstraction''
    from the ''implementation'' into two separate but connected hierarchies such that
    each can vary independently of the other. In our example, the ''abstraction''
    is the driver controls and the ''implementation'' is the engine.


    The following diagram shows this relationship:


