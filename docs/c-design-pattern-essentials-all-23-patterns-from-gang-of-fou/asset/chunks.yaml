    18. Mediator


    Type: Behavioural


    Purpose: Define an object that encapsulates how a set of objects interact. Mediator
    promotes loose coupling by keeping objects from referring to each other explicitly,
    and it lets you vary their interaction independently.


    The Foobar Motor Company is looking to the future when vehicles can drive themselves.
    This, of course, would entail the various components (ignition, gearbox, accelerator
    and brakes, etc.) being controlled together and interacting in various ways. For
    example:


    *   Until the ignition is switched on, the gearbox, accelerator and brakes do
    not operate (we will assume the parking brake is in effect);


    *   When accelerating, the brakes should be disabled;


    *   When braking the accelerator should be disabled;


    *   The appropriate gear should be engaged dependent upon the speed  of the vehicle.'
