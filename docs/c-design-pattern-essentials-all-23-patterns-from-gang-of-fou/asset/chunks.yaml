    \ so that when one object changes its state, all depend are updated automatically.\
    \ The Foobar Company has decided an alert should sound to the driver whenever\
    \ a certain speed is exceeded. They envisage that other things may need to happen\
    \ upon the current speed (such as an automatic gearbox selecting the appropriate\
    \ gear). But they realise the need to keep objects loosely-coupled, so naturally\
    \ don't wish the `Speedometer` class to have any direct knowledge of monitors\
    \ or gearboxes (or any other class that might be interested in the speed is travelling).\
    \ The Observer pattern enables a loose-coupling to be established between a 'subject'\
    \ (the object is of interest; `Speedometer` in our example) and its 'observers'\
    \ (any other class that needs to be informed when stuff happens). Because this\
    \ is a very common need in object-oriented systems, the C# libraries contains\
    \ mechanisms that enable the pattern to be implemented. One of these is by utilising\
    \ the `EventHandler` class: The 'subject' (`Speedometer`) can have multiple observers,\
    \ each of which will be notified whenever an event occurs. The `Speedometer` class\
    \ looks like this:\n\n```cs\npublic class Speedometer\n{\n    public EventHandler\
    \ ValueChanged;\n    private int currentSpeed;\n    public Speedometer()\n   \
