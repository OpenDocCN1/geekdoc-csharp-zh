    \ persistence strategy is assumed, but you can see how easy it would be to use\
    \ alternative strategies;\n\nThe layer diagram can now be shown with the classes\
    \ of the `Database` namespace included:\n\n![](images/00051.jpg)\n\nFigure 29.4\
    \ : Database namepace with Facade class\n\nNote how the business tier communicates\
    \ only through the `DatabaseFacade` object. This has the effect of hiding the\
    \ `Database` namespace complexity behind the facade.\n\n### The business tier\n\
    \nMoving on to the `Business` namespace, this will consist primarily of the `IEngine`\
    \ hierarchy as used throughout this book:\n\n![](images/00037.jpg)\n\nFigure 29.5\
    \ : `IEngine` hierarchy\n\nIn order to facilitate engine objects being serialised,\
    \ the class definition of `AbstractEngine` needs to specify that objects are serializable:\n\
    \n```csharp\nnamespace Business\n{\n    [Serializable]\n    public abstract class\
    \ AbstractEngine : IEngine\n    {\n... remainder of class omitted ...\n    }\n\
    ```\n\nThe other classes are unchanged, except that they of course now reside\
    \ in a namepace called `Business`.\n\nBecause there are two types of engine that\
    \ can exist (standard and turbo), it will be useful to create a Factory class\
    \ that creates objects of the correct type depending upon the supplied arguments.\
    \ To this end, define a new class `EngineFactory` in the `Business` namespace:\n\
    \n```csharp\nnamespace Business\n{\n    class EngineFactory\n    {\n        public\
    \ enum Type\n        {\n            Standard,\n            Turbo\n        }\n\
    \        public static IEngine Create(EngineFactory.Type type, int size)\n   \
    \     {\n            if (type == Type.Standard)\n            {\n             \
    \   return new StandardEngine(size);\n            }\n            else\n      \
    \      {\n                return new TurboEngine(size);\n            }\n     \
    \   }\n        public static IEngine Create(int size, bool turbo)\n        {\n\
    \            return EngineFactory.Create(turbo ? Type.Turbo : Type.Standard, size);\n\
    \        }\n        private EngineFactory()\n        {\n        }\n    }\n}\n\
    ```\n\nNote how the `Create()` method is `static` and is overloaded so client\
    \ can either supply the `enum` value or a `boolean`. Just as was done for the\
    \ database layer, the `Business` namespace will have its own facade, in this case\
    \ the `BusinessFacade`:\n\n```csharp\nnamespace Business\n{\n    [Serializable]\n\
    \    public class BusinessFacade\n    {\n        // static members\n        private\
    \ static volatile BusinessFacade instance;\n        public static BusinessFacade\
