  trans: "\n这一切都应该自动发生，这样驾驶员就可以尽情欣赏！（我们假设车辆可以感知自己的位置以避免碰撞等）。\n\n我们自然会创建一些类来建模单个组件，因此将会有一个\
    \ `Ignition`（点火）类、`Gearbox`（变速箱）类、`Accelerator`（油门）类和一个 `Brake`（刹车）类。但我们也看到它们之间存在一些复杂的相互作用，而我们的面向对象的设计原则之一就是保持类之间的松耦合。\n\
