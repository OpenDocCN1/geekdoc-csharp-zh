    \ with the mediator (so they can receive messages from it). But each component\
    \ class has no knowledge of any other component class; they only know about the\
    \ mediator.\n\nWe can see this by looking at the `Ignition` class:\n\n```csharp\n\
    public class Ignition\n{\n    private EngineManagementSystem mediator;\n    private\
    \ bool on;\n    // Constructor accepts mediator as an argument\n    public Ignition(EngineManagementSystem\
    \ mediator)\n    {\n        this.mediator = mediator;\n        on = false;\n \
    \       // Register back with the mediator;\n        mediator.RegisterIgnition(this);\n\
    \    }\n    public virtual void Start()\n    {\n        on = true;\n        mediator.IgnitionTurnedOn();\n\
    \        Console.WriteLine(\"Ignition turned on\");\n    }\n    public virtual\
