    26\. Simple Factory


    In the main section of this book we looked at both the Factory Method pattern
    and the Abstract Factory pattern. The Simple Factory pattern is a commonly used
    simplified means of delegating the instantiation of objects to a specific class
    (the ''factory'').


    We shall assume here that the Foobar Motor Company manufactures two types of gearbox;
    an automatic gearbox and a manual gearbox. Client programs might need to create
    one or the other based upon a condition, as illustrated by the following code
    fragment (assuming the classes are defined within a class hierarchy):


    `Gearbox selectedGearbox = null;`


    `if (typeWanted.Equals("automatic"))`


    `{`


    `     selectedGearbox = new AutomaticGearbox();`


    `}`


    `else if (typeWanted.Equals("manual"))`


    `{`


    `     selectedGearbox = new ManualGearbox();`


    `}`


    `// Do something with selectedGearbox...`


    While the above code will of course work, what happens if more than one client
    program needs to perform a similar selection? We would have to repeat the `if...else...`
    statements in each client program, and if a new type of gearbox is subsequently
    manufactured we would have to track down every place the `if...else...` block
    is used.


    Remembering the principle of encapsulating the concept that varies, we can instead
    delegate the selection and instantiation process to a specific class, known as
    the ''factory'', just for that purpose. Client programs then only make use of
    the `Create()` method of the factory, as illustrated in the diagram below:


    ![](images/00012.jpg)


    Figure 26.1 : Simple Factory pattern


    The abstract `Gearbox class` in our simple example merely defines a no-argument
    constructor:


    `public abstract class Gearbox`


    `{`


    `    public Gearbox()`


    `    {`


    `    }`


    `}`


    The `AutomaticGearbox` and `ManualGearbox` classes each extend `Gearbox` for their
    respective types:


    `public class AutomaticGearbox : Gearbox`


    `{`


    `    public AutomaticGearbox()`


    `    {`


    `        Console.WriteLine("New automaticGearbox gearbox created");`


    `    }`


    `}`


    `public class ManualGearbox : Gearbox`


    `{`


    `    public ManualGearbox()`


    `    {`


    `        Console.WriteLine("New manual gearbox created");`


    `    }`


    `}`


    We now need to create our `GearboxFactory` class that is capable of instantiating
    the appropriate `Gearbox`:


    `public class GearboxFactory`


    `{`


    `    public enum Type`


    `    {`


    `        Automatic, Manual`


    `    }`


    `    public static Gearbox Create(Type type)`


    `    {`


    `        if (type == Type.Automatic)`


    `        {`


    `            return new AutomaticGearbox();`


    `        }`


    `        else`


    `        {`


    `            return new ManualGearbox();`


    `        }`


    `    }`


    `}`


    The `Create()` method takes care of the selection and instantiation, and thus
    isolates each client program from repeating code. We have made the method `static`
    purely for convenience; it is not a requirement of the pattern.


    Client programs now obtain the type of gearbox by means of the factory:


    `// Create an automatic gearbox`


    `Gearbox auto = GearboxFactory.Create(GearboxFactory.Type.Automatic);`


    `// Create a manual gearbox`


    `Gearbox manual = GearboxFactory.Create(GearboxFactory.Type.Manual);`


    27\. Model View Controller


    The Foobar Motor Company''s satellite-navigation system includes a visual display
    of the current location, the direction of travel and an indication of the current
    speed. There is also an input device; controls where you set the destination,
    etc. A fully fledged simulation is far beyond the scope of this book, so instead
    we will use a very simplified interface that merely lets you set the direction
    of travel (North, South, West and East) and the current speed, without regard
    to any roads, etc..


    The user interface will look like this:


    ![](images/00029.jpg)


    Figure 27.1 : Satellite navigation user interface'
