    Thus we could incorporate a brand-new type of engine without modifying the driver
    controls classes, provided the engine adheres to the `IEngine` contract. Conversely
    we could develop a new set of driver controls (such as enabling voice activation)
    without having to modify anything in the `IEngine` hierarchy.


    Client programs can use the bridge as follows:


    `IEngine engine = new StandardEngine(1300);`


    `StandardControls controls = new StandardControls(engine);`


    `controls1.IgnitionOn();`


    `controls1.Accelerate();`


    `controls1.Brake();`


    `controls1.IgnitionOff();`


    `// Now use sport controls`


    `SportControls controls2 = new SportControls(engine);`


    `controls2.IgnitionOn();`


    `controls2.Accelerate();`


    `controls2.AccelerateHard();`


    `controls2.Brake();`


    `controls2.IgnitionOff();`


    9. Composite


    Type: Structural


    Purpose : Compose objects into tree structures to represent part-whole hierarchies.
    Composite lets clients treat individual objects and compositions of objects uniformly.


    In the Foobar Motor Company workshop they build various items from component parts
    such as nuts, bolts, panels, etc. Each individual component item has an associated
    description and unit cost, and when items are assembled into larger items the
    cost is therefore the sum of its component parts.


    The Composite pattern enables us to treat both individual parts and assemblies
    of parts as if they are the same, thus enabling them to be processed in a consistent
    manner, simplifying code. The class hierarchy looks like this:


    ![](images/00046.jpg)


    Figure 9.1 : Composite pattern


    The abstract `Item` class defines all possible methods for both parts and assemblies
    of parts:


    `public abstract class Item`


    `{`


    `    private string description;`


    `    private int cost;`


    `    public Item(string description, int cost)`


    `    {`


    `        this.description = description;`


    `        this.cost = cost;`


    `    }`


    `    public virtual string Description`


    `    {`


    `        get`


    `        {`


    `            return description;`


    `        }`


    `    }`


    `    public virtual int Cost`


    `    {`


    `        get`


    `        {`


    `            return cost;`


    `        }`


    `    }`


    `    public abstract void AddItem(Item item);`


    `    public abstract void RemoveItem(Item item);`


    `    public abstract Item[] Items { get; }`


    `    public override string ToString()`


    `    {`


    `        return description + " (cost " + Cost + ")";`


    `    }`


    `}`


    The above class provides default implementations for `Description` and `Cost`
    getters, and defines the abstract methods `AddItem()`, `RemoveItem()` and an `Items`
    property getter.


    Individual parts are modelled using the `Part` subclass:


    `public class Part : Item`


    `{`


    `    public Part(string description, int cost)`


    `        : base(description, cost)`


    `    {`


    `    }`


    `    // Empty implementations for unit parts...`


    `    public override void AddItem(Item item)`


    `    {`


    `    }`


    `    public override void RemoveItem(Item item)`


    `    {`


    `    }`


    `    public override Item[] Items`


    `    {`


    `        get`


    `        {`


    `            return new Item[0];`


    `        }`


    `    }`


    `}`


    As you can see, the methods related to managing assemblies of items have empty
    implementations since a ''part'' is the smallest unit possible, and therefore
    unable to have sub-parts, unlike ''assemblies''.


    Assemblies of parts are modelled using the `Assembly` subclass:


    `public class Assembly : Item`


    `{`


    `    private IList<Item> items;`


    `    public Assembly(string description)`


    `        : base(description, 0)`


    `    {`


    `        items = new List<Item>();`


    `    }`


    `    public override void AddItem(Item item)`


    `    {`


    `        items.Add(item);`


    `    }`


    `    public override void RemoveItem(Item item)`


    `    {`


    `        items.Remove(item);`


    `    }`


    `    public override Item[] Items`


    `    {`


    `        get`


    `        {`


    `            return items.ToArray();`


    `        }`


    `    }`


    `    // Also have to override getCost() to accumulate cost of all items in list`


    `    public override int Cost`


    `    {`


    `        get`


    `        {`


    `            int total = 0;`


    `            foreach (Item item in items)`


    `            {`


    `                total += item.Cost;`


    `            }`


    `            return total;`


    `        }`


    `    }`


    `}`


    For assemblies, we have implemented the abstract methods to add other `Item` objects
    into an internal `List` collection. We have also overridden the `Cost` getter
    to loop through the collection to sum the cost of all contained items within this
    assembly.


    All types of `Item` objects can now be used in a uniform manner:


    `Item nut = new Part("Nut", 5);`


    `Item bolt = new Part("Bolt", 9);`


    `Item panel = new Part("Panel", 35);`


    `Item gizmo = new Assembly("Gizmo");`


    `gizmo.AddItem(panel);`


    `gizmo.AddItem(nut);`


    `gizmo.AddItem(bolt);`


    `Item widget = new Assembly("Widget");`


    `widget.AddItem(gizmo);`


    `widget.AddItem(nut);`


    In the above extract, nuts, bolts and panels are defined as individual parts,
    a "Gizmo" is assembled from one nut, one bolt and one panel, and a "Widget" is
    assembled from one "Gizmo" and another nut. Displaying the objects would result
    in this output:


    `Nut (cost 5)`


    `Bolt (cost 9)`


    `Panel (cost 35)`


    `Gizmo (cost 49)`


    `Widget (cost 54)`


    The assemblies have computed the total cost without the client program needing
    to know how.


    10. Decorator


    Type: Structural


    Purpose: Attach additional responsibilities to an object dynamically. Decorators
    provide a flexible alternative to subclassing for extending functionality.


    You will recall the Foobar Motor Company `IVehicle` class hierarchy:


    ![](images/00035.jpg)


    Figure 10.1 : `IVehicle` class hierarchy


    For the purposes of this chapter, we shall add one additional property called
    `Price` to the `IVehicle` interface with a getter. We will also modify the `ToString()`
    method in `AbstractVehicle` to include the price. The modified interface and class
    is shown below with the changes marked in bold:


    `public interface IVehicle`


    `{`


    `    IEngine Engine { get; }`


    `    VehicleColour Colour { get; }`'
