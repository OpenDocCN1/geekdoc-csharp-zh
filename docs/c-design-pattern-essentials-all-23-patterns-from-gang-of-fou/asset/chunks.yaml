  trans: "\nFoobar 汽车公司的每辆车都配备了数字时钟，显示当前的日期和时间。这些值需要经常重置（例如在更换电池后），通过仪表盘上的特定旋钮来实现。当首次按下旋钮时，可以设置“年份”值。向左旋转旋钮（即逆时针方向）会显示上一个年份，而向右旋转则向向前一年。当再次按下旋钮时，年份值变为“已设置”，随后设置过程会自动允许设置“月份”值，同样通过通过旋钮进行适当的向左或右移动来实现。\n\
    \n这一过程持续日期、小时和分钟。以下是事件流程的总结：\n\n*   当首次按下旋钮时，时钟进入设置年份的“设置”模式；\n*   如果向左旋转旋钮，则年份值减\
    \ 1；\n*   如果向右旋转旋钮，则年份值加 1；\n*   当按下旋钮时，年份变为已设置，时钟进入设置月份的“设置”模式；\n*   如果向左旋转旋钮，则月份值减\
    \ 1；\n*   如果向右旋转旋钮，则月份值加 1；\n*   当按下旋钮时，月份变为已设置，时钟进入设置日期的“设置”模式；\n*   如果向左旋转旋钮，则日期值减\
    \ 1；\n*   如果向右旋转旋钮，则日期值加 1；\n*   当按下旋钮时，日期变为已设置，时钟进入设置小时的“设置”模式；\n*   如果向左旋转旋钮，则小时值减\
    \ 1；\n*   如果向右旋转旋钮，则小时值加 1；\n*   当按下旋钮时，小时变为已设置，时钟进入设置分钟的“设置”模式；\n*   如果向左旋转旋钮，则分钟值减\
    \ 1；\n*   如果向右旋转旋钮，则分钟值加 1；\n*   当按下旋钮时，分钟变为已设置，时钟进入“完成设置”模式；\n*   如果再次按下旋钮，则显示完整的选定日期和时间。\n\
    \n从上述步骤可以清楚，当旋转或按下旋钮时，日期和时间的不同部分会被设置，并且这些部分之间存在转换。在编写类来实现此功能时，一种简单的方法是使用一个`mode`变量并在每个方法中使用一系列\
    \ `if...else...` 语句，看起来可能如下：\n\n```csharp\n// 不要这样做！ \n\npublic void RotateKnobLeft()\n\
    {\n    if (mode == YearMode)\n    {\n        year--;\n    }\n    else if (mode\
    \ == MonthMode)\n    {\n        month--;\n    }\n    else if (mode == DayMode)\n\
    \    {\n        day--;\n    }\n    else if (mode == HourMode)\n    {\n       \
    \ hour--;\n    }\n    else if (mode == MinuteMode)\n    {\n        minute--;\n\
    \    }\n}\n```\n\n上述代码的问题在于，`if...else...` 条件必须在每个动作方法中（例如 ` `RotateKnobRight()`、`PushKnob()`\
    \ 等）重复出现。除了让代码看起来臃肿之外，它也难以维护，因为如果我们现在需要记录秒，就需要修改类的多个部分。\n\n状态模式允许建立一个层级结构，允许实现我们时钟设置示例所需的状态转换。我们将创建一个\
    \ `ClockSetup` 类，通过接口 `IClockSetupState` 初始化状态，该接口为每个单独的状态都有实现类：\n\n![](img/00015.jpg)\n\
    \n图 21.1：状态模式\n\n`IClockSetupState` 接口定义了处理状态更改的方法，以及可以提供用户指令并返回实际选择值的方法：\n\n\
    ```csharp\npublic interface IClockSetupState\n{\n    void PreviousValue();\n \
    \   void NextValue();\n    void SelectValue();\n    string Instructions { get;\
    \ }\n    int SelectedValue { get; }\n}\n```\n\n首先查看 `YearSetupState`，你会注意到它在构造函数中接收一个\
    \ `ClockSetup` 对象的引用（在设计模式语言中被称为其“上下文”），并管理年份的设置。特别注意 `SelectValue()` 方法中它是如何内部转换到不同状态的：\n\
    \n```csharp\nclass YearSetupState : ClockSetup\n{\n    private ClockSetup clockSetup;\n\
    \    private int year;\n    public YearSetupState(ClockSetup clockSetup)\n   \
    \ {\n        this.clockSetup = clockSetup;\n        year = DateTime.Now.Year;\n\
    \    }\n    public virtual void PreviousValue()\n    {\n        year--;\n    }\n\
    \    public virtual void NextValue()\n    {\n        year++;\n    }\n    public\
    \ virtual void SelectValue()\n    {\n        Console.WriteLine(\"Year to \" +\
    \ year);\n        clockSetup.State = clockSetup.MonthState;\n    }\n    public\
    \ virtual string Instructions\n    {\n        get\n        {\n            return\
    \ \"Please set the year...\";\n        }\n    }\n    public virtual int SelectedValue\n\
    \    {\n        get\n        {\n            return year;\n        }\n    }\n}\n\
    ```\n\n其他的日期和时间状态遵循类似的过程，每个在需要时转换到下一个状态：\n\n```csharp\nclass MonthSetupState :\
    \ ClockSetup\n{\n    private ClockSetup clockSetup;\n    private int month;\n\
    \    public MonthSetupState(ClockSetup clockSetup)\n    {\n        this.clockSetup\
    \ = clockSetup;\n        month = DateTime.Now.Month;\n    }\n    public virtual\
    \ void PreviousValue()\n    {\n        if (month > 1)\n        {\n           \
    \ month--;\n        }\n    }\n    public virtual void NextValue()\n    {\n   \
    \     if (month < 12)\n        {\n            month++;\n        }\n    }\n   \
    \ public virtual void SelectValue()\n    {\n        Console.WriteLine(\"Month\
    \ set to \" + month);\n        clockSetup.State = clockSetup.DayState;\n    }\n\
    \    public virtual string Instructions\n    {\n        get\n        {\n     \
    \       return \"Please set the month...\";\n        }\n    }\n    public virtual\
    \ int SelectedValue\n    {\n        get\n        {\n            return month;\n\
    \        }\n    }\n}\n\nclass DaySetupState : ClockSetup\n{\n    private ClockSetup\
    \ clockSetup;\n    private int day;\n    public DaySetupState(ClockSetup clockSetup)\n\
    \    {\n        this.clockSetup = clockSetup;\n        day = DateTime.Now.Day;\n\
    \    }\n    public virtual void PreviousValue()\n    {\n        if (day > 1)\n\
    \        {\n            day--;\n        }\n    }\n    public virtual void NextValue()\n\
    \    {\n        if (day < System.DateTime.DaysInMonth(new DateTime().Year, new\
    \ DateTime().Month))\n        {\n            day++;\n        }\n    }\n    public\
    \ virtual void SelectValue()\n    {\n        Console.WriteLine(\"Day set to \"\
    \ + day);\n        clockSetup.State = clockSetup.HourSetupState;\n    }\n    public\
    \ virtual string Instructions\n    {\n        get\n        {\n            return\
    \ \"Please set the day...\";\n        }\n    }\n    public virtual int SelectedValue\n\
    \    {\n        get\n        {\n            return day;\n        }\n    }\n}\n\
    \nclass HourSetupState : ClockSetup\n{\n    private ClockSetup clockSetup;\n \
    \   private int hour;\n    public HourSetupState(ClockSetup clockSetup)\n    {\n\
    \        this.clockSetup = clockSetup;\n        hour = DateTime.Now.Hour;\n  \
    \  }\n    public virtual void PreviousValue()\n    {\n        if (hour > 0)\n\
    \        {\n            hour--;\n        }\n    }\n    public virtual void NextValue()\n\
    \    {\n        if (hour < 23)\n        {\n            hour++;\n        }\n  \
    \  }\n}\n```\n\n"
