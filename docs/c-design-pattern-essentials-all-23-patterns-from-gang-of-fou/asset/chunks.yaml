    `public static void Handle(string email)`


    `{`


    `    // Create the handler objects...`


    `    IEmailHandler spam = new SpamEmailHandler();`


    `    IEmailHandler sales = new SalesEmailHandler();`


    `    IEmailHandler service = new ServiceEmailHandler();`


    `    IEmailHandler manager = new ManagerEmailHandler();`


    `    IEmailHandler general = new GeneralEnquiriesEmailHandler();`


    `    // Chain them together...`


    `    spam.NextHandler = sales;`


    `    sales.NextHandler = service;`


    `    service.NextHandler = manager;`


    `    manager.NextHandler = general;`


    `    // Start the ball rolling...`


    `    spam.ProcessHandler(email);`


    `    }`


    `}`


    Putting a message through the handlers is now as simple as this:


    `String email = "I need my car repaired.";`


    `AbstractEmailHandler.handle(email);`


    This should produce the following output:


    `Email handled by service department.`


    15. Command


    Type: Behavioural


    Purpose: Encapsulate a request as an object, thereby letting you parameterise
    clients with different requests, queue or log requests, and support undoable operations.


    The vehicles made by the Foobar Motor Company each have an installed radio; this
    is modelled by the following `Radio` class:


    `public class Radio`


    `{`


    `    public const int MinVolume = 0;`


    `    public const int MaxVolume = 10;`


    `    public const int DefaultVolume = 5;`


    `    private bool switchedOn;`


    `    private int volume;`


    `    public Radio()`


    `    {`


    `        switchedOn = false;`


    `        volume = DefaultVolume;`


    `    }`


    `    public virtual bool On`


    `    {`


    `        get`


    `        {`


    `            return switchedOn;`


    `        }`


    `    }`


    `    public virtual int Volume`


    `    {`


    `        get`


    `        {`


    `            return volume;`


    `        }`


    `    }`


    `    public virtual void SwitchOn()`


    `    {`


    `        switchedOn = true;`


    `        Console.WriteLine("Radio now on, volume level " + Volume);`


    `    }`


    `    public virtual void SwitchOff()`


    `    {`


    `        switchedOn = false;`


    `        Console.WriteLine("Radio now off");`


    `    }`


    `    public virtual void VolumeUp()`


    `    {`


    `        if (On)`


    `        {`


    `            if (Volume < MaxVolume)`


    `            {`


    `                volume++;`


    `                Console.WriteLine("Volume turned up to level " + Volume);`


    `            }`


    `        }`


    `    }`


    `    public virtual void VolumeDown()`


    `    {`


    `        if (On)`


    `        {`


    `            if (Volume > MinVolume)`


    `            {`


    `                volume--;`


    `                Console.WriteLine("Volume turned down to level " + Volume);`


    `            }`


    `        }`


    `    }`


    `}`


    As you can see, the class enables the radio to be switched on and off, and provided
    it is switched on will enable the volume to be increased or decreased one level
    at a time, within the range 1 to 10.


    Some of the vehicles also have electrically operated windows with simple up &
    down buttons, as modelled by the following `ElectricWindow` class.


    `public class ElectricWindow`


    `{`


    `    private bool open;`


    `    public ElectricWindow()`


    `    {`


    `        open = false;`


    `        Console.WriteLine("Window is closed");`


    `    }`


    `    public virtual bool Open`


    `    {`


    `        get`


    `        {`


    `            return open;`


    `        }`


    `    }`


    `    public virtual bool Closed`


    `    {`


    `        get`


    `        {`


    `            return (!open);`


    `        }`


    `    }`


    `    public virtual void OpenWindow()`


    `    {`


    `        if (Closed)`


    `        {`


    `            open = true;`


    `            Console.WriteLine("Window is now open");`


    `        }`


    `    }`


    `    public virtual void CloseWindow()`


    `    {`


    `        if (Open)`


    `        {`


    `            open = false;`


    `            Console.WriteLine("Window is now closed");`


    `        }`


    `    }`


    `}`


    Each of the devices (the radio and the electric window) has separate controls,
    typically buttons, to manage their state. But suppose the Foobar Motor Company
    now wishes to introduce speech recognition to their top-of-the-range vehicles
    and have them perform as follows:


    *   If the speech-recognition system is in "radio" mode, then if it hears the
    word "up" or "down" it adjusts the radio volume; or


    *   If the speech-recognition system is in "window" mode, then if it hears the
    word "up" or "down" it closes or opens the driver''s door window.


    We therefore need the speech-recognition system to be able to handle either `Radio`
    objects or `ElectricWindow` objects, which are of course in completely separate
    hierarchies.  We might also want it to handle other devices in the future, such
    as the vehicle''s speed or the gearbox (e.g. upon hearing "up" it would increase
    the speed by 1mph or it would change to the next higher gear). For good object-oriented
    design we need to isolate the speech-recognition from the devices it controls,
    so it can cope with any device without directly knowing what they are.'
