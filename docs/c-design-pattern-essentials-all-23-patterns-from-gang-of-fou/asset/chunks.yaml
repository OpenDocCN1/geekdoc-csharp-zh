    To use the ''decorators'' we initially instantiate the car or van we require and
    then "wrap" them inside the required decorator or decorators. Here is an example:


    `// Create a blue saloon car...`


    `IVehicle myCar = new Saloon(new StandardEngine(1300));`


    `myCar.Paint(Vehicle.Colour.Blue);`


    `// Add air-conditioning to the car...`


    `myCar = new AirConditionedVehicle(myCar);`


    `// Now add alloy wheels...`


    `myCar = new AlloyWheeledVehicle(myCar);`


    `// Now add leather seats...`


    `myCar = new LeatherSeatedVehicle(myCar);`


    `// Now add metallic paint...`


    `myCar = new MetallicPaintedVehicle(myCar);`


    `// Now add satellite-navigation...`


    `myCar = new SatNavVehicle(myCar);`


    If you invoke `Console.WriteLine()` on the `myCar` object at each stage you should
    see this output:


    `Saloon (StandardEngine (1300), Blue, price 6000)`


    `AirConditionedVehicle (StandardEngine (1300), Blue, price 6600)`


    `AlloyWheeledVehicle (StandardEngine (1300), Blue, price 6850)`


    `LeatherSeatedVehicle (StandardEngine (1300), Blue, price 8050)`


    `MetallicPaintedVehicle (StandardEngine (1300), Blue, price 8800)`


    `SatNavVehicle (StandardEngine (1300), Blue, price 10300)`


    The price shown at each stage is the total of the vehicle plus the selected options
    as each is "added".


    The Decorator pattern is a good example of preferring object composition over
    inheritance. Had we attempted to use inheritance for the various vehicle options
    we would have needed to create many different combinations of subclasses to model
    each combination of selectable options.


    Decorator classes are sometimes called "wrapper" classes, since they serve to
    "wrap" an object inside another object, usually to add or modify its functionality.


    11. Facade


    Type: Structural


    Purpose: Provide a unified interface to a set of interfaces in a subsystem. Facade
    defines a higher-level interface that makes the subsystem easier to use.


    Sometimes you need to perform a series of steps to undertake a particular task,
    often involving multiple objects. The Facade pattern involves the creation of
    a separate object that simplifies the execution of such steps.


    As an example, when the Foobar Motor Company are preparing their vehicles for
