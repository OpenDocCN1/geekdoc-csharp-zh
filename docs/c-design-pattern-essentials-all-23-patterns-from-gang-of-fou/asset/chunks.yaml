    \ in the following display:\n\n`StandardEngine` (1300)\n`StandardEngine (1600)`\n\
    `TurboEngine (2000)`\n\nFor this chapter we will assume that in addition to the\
    \ two concrete subclasses (`StandardEngine` and `TurboEngine`) Foobar have decided\
    \ to use a further engine class named `SuperGreenEngine` which is made by a different\
    \ manufacturer. Because the `SuperGreenEngine` class is provided by a third-party\
    \ it does not implement our `IEngine` interface. Furthermore, Foobar do not have\
    \ access to the C# source code and can therefore not modify it, but the following\
    \ class details are known from the documentation:\n\n* The class extends `object`;\n\
    * The constructor takes one argument for the engine size;\n* There is an `EngineSize`\
    \ property getter that returns the engine size as an `int`;\n* These types of\
    \ engines are never turbocharged;\n* The `ToString()` method returns a string\
    \ in the format: SUPER ENGINE nnnn (where nnnn is the engine size).\n\nWe can\
    \ therefore see that `SuperGreenEngine` uses a different method name to access\
    \ the engine size and there is no method related to whether it is turbocharged,\
    \ and that it is not within the `IEngine` hierarchy. As it stands it would not\
    \ be possible to add instances of `SuperGreenEngine` to the reporting collection\
    \ and even if you could the method names are different.\n\nThe Adapter pattern\
    \ provides an approach to resolve this through the definition of a new class that\
    \ 'adapts' the class we want to use into the format existing classes require.\
    \ For our purposes, therefore, we shall create a `SuperGreenEngineAdapter` class:\n\
    \n![](images/00040.jpg)\n\nFigure 7.2 : Adapter class hierarchy\n\nThe code for\
    \ the adapter is as follows:\n\n```csharp\npublic class SuperGreenEngineAdapter\
    \ : AbstractEngine\n{\n    public SuperGreenEngineAdapter(SuperGreenEngine greenEngine)\n\
    \        : base(greenEngine.EngineSize, false)\n    {\n}\n```\n\nNote the following\
    \ from the above code:\n\n* We extend the class we are adapting to;\n* We accept\
    \ a reference in the constructor to the class we are adapting from;\n* The constructor\
    \ obtains the necessary state from the referenced object and passes it to the\
    \ superclass constructor.\n\nNow we are in a position to include `SuperGreenEngine`\
    \ objects in our reporting collection (additional code indicated in bold):\n\n\
    ```csharp\nIList<Engine> engines = new List<Engine>();\n\nengines.Add(new StandardEngine(1300));\n\
    engines.Add(new StandardEngine(1600));\nengines.Add(new TurboEngine(2000));\n\
    // \"Adapt\" the new engine type...\nSuperGreenEngine greenEngine = new SuperGreenEngine(1200);\n\
    engines.Add(new SuperGreenEngineAdapter(greenEngine));\n// Unchanged from before...\n\
    foreach (IEngine engine : engines) {\n    Console.WriteLine(engine);\n}\n```\n\
    \nThe output should now be:\n\n`StandardEngine (1300)`\n`StandardEngine (1600)`\n\
    `TurboEngine (2000)`\n`SuperGreenEngineAdapter (1200)`\n\nNote how the output\
    \ made use of the `ToString()` method as inherited from `AbstractEngine` rather\
    \ than that of `SuperGreenEngine`.\n\n## Variations for implementing adapters\n\
    \nWe were somewhat fortunate in that the design of the `AbstractEngine` and `SuperGreenEngine`\
    \ classes made it easy for the adapter class to do the work inside its constructor.\
    \ Often however, we need to take a few additional steps inside the code of the\
    \ adapter, so here is general formula to apply:\n\n1. Extend the class you are\
    \ adapting to (or implement it, if it's an interface);\n2. Specify the class you\
    \ are adapting from in the constructor and store it in an instance variable;\n\
    3. For each method in the class you are extending (or interface you are implementing),\
    \ override it to delegate to the corresponding method of the class you are adapting.\n\
    \nHere is a generic adapter class:\n\n```csharp\npublic class ObjectAdapter :\
    \ AdaptingTo\n{\n    private AdaptingFrom fromObject;\n    public ObjectAdapter(AdaptingFrom\
    \ fromObject)\n    {\n        this.fromObject = fromObject;\n    }\n    // Overridden\
    \ method\n    public override void MethodInTo()\n    {\n        fromObject.MethodInFrom();\n\
    \    }\n}\n```\n\n## Bridge\n\nPurpose: Decouple an abstraction from its implementation\
    \ so that each may vary.\n\nThe Foobar Company manufactures engines for its vehicles.\
    \ Here is a reminder of the `IEngine` class:\n\n![](images/0037.jpg) Figure 8.1\
    \ : `IEngine` class\n\nThe implementation of the `AbstractEngine` class as detailed\
    \ in the introduction, merely stores the engine size (e.g. 1600cc) and whether\
    \ it is turbocharged. For the purposes of this class will be enhanced to enable\
    \ the engine to be started and for the power to be increased or decreased.\n\n\
    The modified version of the `IEngine` interface and `AbstractEngine` class is\
    \ listed below with the changes marked in bold:\n\n```csharp\npublic interface\
    \ IEngine\n{\n    int Size { get; }\n    bool Turbo { get; }\n    void Start();\n\
    \    void Stop();\n    void IncreasePower();\n    void DecreasePower();\n}\n\n\
    public abstract class AbstractEngine : IEngine\n{\n    private int size;\n   \
    \ private bool turbo;\n    private bool running;\n    private int power;\n   \
    \ public AbstractEngine(int size, bool turbo)\n    {\n        this.size = size;\n\
    \        this.turbo = turbo;\n        running = false;\n        power = 0;\n \
    \   }\n    public virtual int Size\n    {\n        get\n        {\n          \
    \  return size;\n        }\n    }\n    public virtual bool Turbo\n    {\n    \
    \    get\n        {\n            return turbo;\n        }\n    }\n    public virtual\
    \ void Start()\n    {\n        running = true;\n    }\n    public virtual void\
    \ Stop()\n    {\n        running = false;\n        power = 0;\n    }\n    public\
    \ virtual void IncreasePower()\n    {\n        if ((running) && (power < 10))\n\
    \        {\n            power++;\n        }\n    }\n    public virtual void DecreasePower()\n\
    \    {\n        if ((running) && (power > 0))\n        {\n            power--;\n\
    \        }\n    }\n    public override string ToString()\n    {\n        return\
    \ this.GetType().Name + \" (\" + size + \")\";\n    }\n}\n```\n"
