    23\. Template Method


    Type: Behavioural


    Purpose: Define the skeleton of an algorithm in a method, deferring some steps
    to subclasses. Template Method lets subclasses redefine certain steps of an algorithm
    without changing the algorithm''s structure.


    Each vehicle made by the Foobar Motor Company needs a small number of printed
    booklets to be produced and provided to the buyer, such as an Owner''s Manual
    and a Service History booklet. The way booklets are produced always follows the
    same set of steps, but each different type of booklet might need to do each of
    the individual steps in a slightly different way.


    The Template Method pattern enables the definition of one or more abstract methods
    that are called through a ''template method''. The simple hierarchy is as follows:


    ![](images/00007.jpg)


    Figure 23.1 : Template Method pattern


    The `AbstractBookletPrinter` class defines several `protected abstract` methods
    and one `public` ''template method'' that makes use of the abstract methods:


    `public abstract class AbstractBookletPrinter`


    `{`


    `    protected internal abstract int PageCount { get; }`


    `    protected internal abstract void PrintFrontCover();`


    `    protected internal abstract void PrintTableOfContents();`


    `    protected internal abstract void PrintPage(int pageNumber);`


    `    protected internal abstract void PrintIndex();`


    `    protected internal abstract void PrintBackCover();`


    `    // This is the ''template method''`


    `    public void Print()`


    `    {`


    `        PrintFrontCover();`


    `        PrintTableOfContents();`


    `        for (int i = 1; i <= PageCount; i++)`


    `        {`


    `            PrintPage(i);`


    `        }`


    `        PrintIndex();`


    `        PrintBackCover();`


    `    }`


    `}`


    Each concrete subclass now only needs to provide the implementing code for each
    abstract method, for example the `SaloonBooklet` class below:


    `public class SaloonBooklet : AbstractBookletPrinter`


    `{`


    `    protected internal override int PageCount`


    `    {`


    `        get`


    `        {`


    `            return 100;`


    `        }`


    `    }`


    `    protected internal override void PrintFrontCover()`


    `    {`


    `        Console.WriteLine("Printing front cover for Saloon car booklet");`


    `    }`


    `    protected internal override void PrintTableOfContents()`


    `    {`


    `        Console.WriteLine("Printing table of contents for Saloon car booklet");`


    `    }`


    `    protected internal override void PrintPage(int pageNumber)`


    `    {`


    `        Console.WriteLine("Printing page " + pageNumber + " for Saloon car booklet");`


    `    }`


    `    protected internal override void PrintIndex()`


    `    {`


    `        Console.WriteLine("Printing index for Saloon car booklet");`


    `    }`


    `    protected internal override void PrintBackCover()`


    `    {`


    `        Console.WriteLine("Printing back cover for Saloon car booklet");`


    `    }`


    `}`


    The `ServiceHistoryBooklet` is very similar:


    `public class ServiceHistoryBooklet : AbstractBookletPrinter`


    `{`


    `    protected internal override int PageCount`


    `    {`


    `        get`


    `        {`


    `            return 12;`


    `        }`


    `    }`


    `    protected internal override void PrintFrontCover()`


    `    {`


    `        Console.WriteLine("Printing front cover for service history booklet");`


    `    }`


    `    protected internal override void PrintTableOfContents()`


    `    {`


    `        Console.WriteLine("Printing table of contents for service history booklet");`


    `    }`


    `    protected internal override void PrintPage(int pageNumber)`


    `    {`


    `        Console.WriteLine("Printing page " + pageNumber + " for service history
    booklet");`


    `    }`


    `    protected internal override void PrintIndex()`


    `    {`


    `        Console.WriteLine("Printing index for service history booklet");`


    `    }`


    `    protected internal override void PrintBackCover()`


    `    {`


    `        Console.WriteLine("Printing back cover for service history booklet");`


    `    }`


    `}`


    While it is not essential from the point of view of the pattern for the abstract
    methods to be `protected`, it is often the case that this is the most appropriate
    access level to assign since they are only intended for over-riding and not for
    direct invocation by client objects.


    Also note that it''s perfectly acceptable for some of the methods called from
    the ''template method'' to not be abstract but have a default implementation provided.
    But when at least one abstract method is being called, it qualifies as the Template
    Method pattern.


    Client programs merely need to instantiate the required concrete class and invoke
    the `Print()` method:


