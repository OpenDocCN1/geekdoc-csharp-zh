- fmt: "\nEach of the worked examples in this book uses a common theme drawn from\
    \ the business world, being that of a fictional vehicle manufacturer called the\
    \ `Foobar Motor Company`. The company makes a range of cars and vans together\
    \ with the engines used to power the vehicles. You should therefore familiarise\
    \ yourself with the classes described in this introduction.\n\nThe class hierarchy\
    \ looks like this:\n\n![](images/00028.jpg)\n\nFigure 1.1 : `IVehicle` and `IEngine`\
    \ class hierarchies\n\n`IVehicle` and `IEngine` are the root interfaces of the\
    \ hierarchies, with each vehicle object requiring a reference to an `IEngine`\
    \ object. `AbstractVehicle` is an abstract class that implements the `IVehicle`\
    \ interface, and `AbstractEngine` likewise implements the `IEngine` interface.\
    \ For vehicles, we also have `AbstractCar` and `AbstractVan` together with concrete\
    \ subclasses `Saloon`, `Coupe` and `Sport` as types of cars. `AbstractVan` has\
    \ the concrete subclasses `BoxVan` and `Pickup` as types of van.\n\nThe concrete\
    \ subclasses of `AbstractEngine` are `StandardEngine` and `TurboEngine`.\n\nDespite\
    \ there being several classes in the hierarchies the code for each has been kept\
    \ deliberately simple so you can focus on understanding the patterns rather than\
    \ having to decipher complex code. To illustrate this, here is the source code\
    \ for the `IEngine` interface:\n\n```csharp\npublic interface IEngine\n{\n   \
    \ int Size { get; }\n    bool Turbo { get; }\n}\n```\n\nThis simple interface\
    \ merely requires property getters to return the engine size (in cubic centimetres)\
    \ and whether it is turbocharged. The `AbstractEngine` class looks like this:\n\
    \n```csharp\npublic abstract class AbstractEngine : IEngine\n{\n    private int\
    \ size;\n    private bool turbo;\n    public AbstractEngine(int size, bool turbo)\n\
    \    {\n        this.size = size;\n        this.turbo = turbo;\n    }\n    public\
    \ virtual int Size\n    {\n        get\n        {\n            return size;\n\
    \        }\n    }\n    public virtual bool Turbo\n    {\n        get\n       \
    \ {\n            return turbo;\n        }\n    }\n    public override string ToString()\n\
    \    {\n        return this.GetType().Name + \" (\" + size + \")\";\n    }\n}\n\
    ```\n\nThis simplified implementation of an engine requires the appropriate attributes\
    \ to be supplied in the constructor. The `ToString()` method has been implemented\
    \ to produce output in this format:\n\n`StandardEngine (1300)`\n\n`TurboEngine\
    \ (2000)`\n\nThe `Equals()` and `GetHashCode()` methods will inherit from `object`\
    \ and therefore use object identity. This makes sense, since for example, two\
    \ separate 1300cc Standard engines are logically different entities and so should\
    \ be treated as such (one engine would go into one vehicle and the other engine\
    \ into a different vehicle).\n\nThe concrete subclasses are trivially simple:\n\
    \n```csharp\npublic class StandardEngine : AbstractEngine\n{\n    public StandardEngine(int\
    \ size) : base(size, false)\n    {\n        // not turbocharged\n    }\n}\n\n\
    public class TurboEngine : AbstractEngine\n{\n    public TurboEngine(int size)\
    \ : base(size, true)\n    {\n        // turbocharged\n    }\n}\n```\n\nNow that\
    \ you have seen the `IEngine` hierarchy we can look at the `IVehicle` interface:\n\
    \n```csharp\npublic interface IVehicle\n{\n    IEngine Engine { get; }\n    VehicleColour\
    \ Colour { get; }\n    void Paint(VehicleColour colour);\n}\n```\n\nA supporting\
    \ `enum` called `VehicleColour` defines the possible colours each `IVehicle` object\
    \ could be:\n\n```csharp\npublic enum VehicleColour\n{\n    Unpainted, Blue, Green,\n\
    \    Red, Silver, Yellow\n}\n```\n\nThis is how the `AbstractVehicle` class implements\
    \ `IVehicle`:\n\n```csharp\npublic abstract class AbstractVehicle : IVehicle\n\
    {\n    private IEngine engine;\n    private VehicleColour colour;\n    public\
    \ AbstractVehicle(IEngine engine)\n    : this(engine, VehicleColour.Unpainted)\n\
    \    {\n    }\n    public AbstractVehicle(IEngine engine, VehicleColour colour)\n\
    \    {\n        this.engine = engine;\n        this.colour = colour;\n    }\n\
    \    public virtual IEngine Engine\n    {\n        get\n        {\n          \
    \  return engine;\n        }\n    }\n    public virtual VehicleColour Colour\n\
    \    {\n        get\n        {\n            return colour;\n        }\n    }\n\
    \    public virtual void Paint(VehicleColour colour)\n    {\n        this.colour\
    \ = colour;\n    }\n    public override string ToString()\n    {\n        return\
    \ this.GetType().Name + \" (\" + engine + \", \" + colour + \")\";\n    }\n}\n\
    ```\n\nThe overloaded constructors in `AbstractVehicle` require an `IEngine` object\
    \ and optionally a vehicle colour to be supplied. The output of calls to `ToString()`\
    \ will be in this format:\n\n`Saloon (StandardEngine (1300), Red)`\n\n`BoxVan\
    \ (TurboEngine (2200), White)`\n\nThe `AbstractCar` and `AbstractVan` classes\
    \ just forward to the constructors (obviously real classes would define whatever\
    \ is different between cars and vans):\n\n```csharp\npublic abstract class AbstractCar\
    \ : AbstractVehicle\n{\n    public AbstractCar(IEngine engine)\n    : this(engine,\
    \ VehicleColour.Unpainted)\n    {\n    }\n    public AbstractCar(IEngine engine,\
    \ VehicleColour colour)\n    : base(engine, colour)\n    {\n    }\n}\n\npublic\
    \ abstract class AbstractVan : AbstractVehicle\n{\n    public AbstractVan(IEngine\
    \ engine)\n    : this(engine, VehicleColour.Unpainted)\n    {\n    }\n    public\
    \ AbstractVan(IEngine engine, VehicleColour colour)\n    : base(engine, colour)\n\
    \    {\n    }\n}\n```\n\nThe concrete subclasses also just forward to the constructors:\n\
    \n```csharp\npublic class Saloon : AbstractCar\n{\n    public Saloon(IEngine engine)\n\
    \    : this(engine, VehicleColour.Unpainted)\n    {\n    }\n    public Saloon(IEngine\
    \ engine, VehicleColour colour)\n    : base(engine, colour)\n    {\n    }\n}\n\
    \npublic class Coupe : AbstractCar\n{\n    public Coupe(IEngine engine)\n    :\
    \ this(engine, VehicleColour.Unpainted)\n    {\n    }\n    public Coupe(IEngine\
    \ engine, VehicleColour colour)\n    : base(engine, colour)\n    {\n    }\n}\n\
    \npublic class Sport : AbstractCar\n{\n    public Sport(IEngine engine)\n    :\
    \ this(engine, VehicleColour.Unpainted)\n    {\n    }\n    public Sport(IEngine\
    \ engine, VehicleColour colour)\n    : base(engine, colour)\n    {\n    }\n}\n\
    \npublic class BoxVan : AbstractVan\n{\n    public BoxVan(IEngine engine)\n  \
    \  : this(engine, VehicleColour.Unpainted)\n    {\n    }\n    public BoxVan(IEngine\
    \ engine, VehicleColour colour)\n    : base(engine, colour)\n    {\n    }\n}\n\
    \npublic class Pickup : AbstractVan\n{\n    public Pickup(IEngine engine)\n  \
    \  : this(engine, VehicleColour.Unpainted)\n    {\n    }\n    public Pickup(IEngine\
    \ engine, VehicleColour colour)\n    : base(engine, colour)\n    {\n    }\n}\n\
    ```\n"
  raw: 'Each of the worked examples in this book uses a common theme drawn from the
    business world, being that of a fictional vehicle manufacturer called the Foobar
    Motor Company. The company makes a range of cars and vans together with the engines
    used to power the vehicles. You should therefore familiarise yourself with the
    classes described in this introduction.


    The class hierarchy looks like this:


    ![](images/00028.jpg)


    Figure 1.1 : `IVehicle` and `IEngine` class hierarchies


    `IVehicle` and `IEngine` are the root interfaces of the hierarchies, with each
    vehicle object requiring a reference to an `IEngine` object. `AbstractVehicle`
    is an abstract class that implements the `IVehicle` interface, and `AbstractEngine`
    likewise implements the `IEngine` interface. For vehicles, we also have `AbstractCar`
    and `AbstractVan` together with concrete subclassses `Saloon`, `Coupe` and `Sport`
    as types of cars. `AbstractVan` has the concrete subclasses `BoxVan` and `Pickup`
    as types of van.


    The concrete subclasses of `AbstractEngine` are `StandardEngine` and `TurboEngine`.


    Despite there being several classes in the hierarchies the code for each has been
    kept deliberately simple so you can focus on understanding the patterns rather
    than having to decipher complex code. To illustrate this, here is the source code
    for the `IEngine` interface:


    `public interface IEngine`


    `{`


    `    int Size { get; }`


    `    bool Turbo { get; }`


    `}`


    This simple interface merely requires property getters to return the engine size
    (in cubic centimetres) and whether it is turbocharged. The `AbstractEngine` class
    looks like this:


    `public abstract class AbstractEngine : IEngine`


    `{`


    `    private int size;`


    `    private bool turbo;`


    `    public AbstractEngine(int size, bool turbo)`


    `    {`


    `        this.size = size;`


    `        this.turbo = turbo;`


    `    }`


    `    public virtual int Size`


    `    {`


    `        get`


    `        {`


    `            return size;`


    `        }`


    `    }`


    `    public virtual bool Turbo`


    `    {`


    `        get`


    `        {`


    `            return turbo;`


    `        }`


    `    }`


    `    public override string ToString()`


    `    {`


    `        return this.GetType().Name + " (" + size + ")";`


    `    }`


    `}`


    This simplified implementation of an engine requires the appropriate attributes
    to be supplied in the constructor. The `ToString()` method has been implemented
    to produce output in this format:


    `StandardEngine (1300)`


    `TurboEngine (2000)`


    The `Equals()` and `GetHashCode()` methods will inherit from `object` and therefore
    use object identity. This makes sense, since for example, two separate 1300cc
    Standard engines are logically different entities and so should be treated as
    such (one engine would go into one vehicle and the other engine into a different
    vehicle).


    The concrete subclasses are trivially simple:


    `public class StandardEngine : AbstractEngine`


    `{`


    `    public StandardEngine(int size) : base(size, false)`


    `    {`


    `        // not turbocharged`


    `    }`


    `}`


    `public class TurboEngine : AbstractEngine`


    `{`


    `    public TurboEngine(int size) : base(size, true)`


    `    {`


    `        // turbocharged`


    `    }`


    `}`


    Now that you have seen the `IEngine` hierarchy we can look at the `IVehicle` interface:


    `public interface IVehicle`


    `{`


    `    IEngine Engine { get; }`


    `    VehicleColour Colour { get; }`


    `    void Paint(VehicleColour colour);`


    `}`


    A supporting `enum` called `VehicleColour` defines the possible colours that each
    `IVehicle` object could be:


    `public enum VehicleColour`


    `{`


    `    Unpainted, Blue, Black, Green,`


    `    Red, Silver, White, Yellow`


    `}`


    This is how the `AbstractVehicle` class implements `IVehicle`:


    `public abstract class AbstractVehicle : IVehicle`


    `{`


    `    private IEngine engine;`


    `    private VehicleColour colour;`


    `    public AbstractVehicle(IEngine engine)`


    `        : this(engine, VehicleColour.Unpainted)`


    `    {`


    `    }`


    `    public AbstractVehicle(IEngine engine, VehicleColour colour)`


    `    {`


    `        this.engine = engine;`


    `        this.colour = colour;`


    `    }`


    `    public virtual IEngine Engine`


    `    {`


    `        get`


    `        {`


    `            return engine;`


    `        }`


    `    }`


    `    public virtual VehicleColour Colour`


    `    {`


    `        get`


    `        {`


    `            return colour;`


    `        }`


    `    }`


    `    public virtual void Paint(VehicleColour colour)`


    `    {`


    `        this.colour = colour;`


    `    }`


    `    public override string ToString()`


    `    {`


    `        return this.GetType().Name + " (" + engine + ", " + colour + ")";`


    `    }`


    `}`


    The overloaded constructors in `AbstractVehicle` require an `IEngine` object and
    optionally a vehicle colour to be supplied.


    The output of calls to `ToString()` will be in this format:


    `Saloon (StandardEngine (1300), Red)`


    `BoxVan (TurboEngine (2200), White)`


    The `AbstractCar` and `AbstractVan` classes just forward to the constructors (obviously
    real classes would define whatever is different between cars and vans):


    `public abstract class AbstractCar : AbstractVehicle`


    `{`


    `    public AbstractCar(IEngine engine)`


    `        : this(engine, VehicleColour.Unpainted)`


    `    {`


    `    }`


    `    public AbstractCar(IEngine engine, VehicleColour colour)`


    `        : base(engine, colour)`


    `    {`


    `    }`


    `}`


    `public abstract class AbstractVan : AbstractVehicle`


    `{`


    `    public AbstractVan(IEngine engine)`


    `        : this(engine, VehicleColour.Unpainted)`


    `    {`


    `    }`


    `    public AbstractVan(IEngine engine, VehicleColour colour)`


    `        : base(engine, colour)`


    `    {`


    `    }`


    `}`


    The concrete subclasses also just forward to the constructors:


    `public class Saloon : AbstractCar`


    `{`


    `    public Saloon(IEngine engine)`


    `        : this(engine, VehicleColour.Unpainted)`


    `    {`


    `    }`


    `    public Saloon(IEngine engine, VehicleColour colour)`


    `        : base(engine, colour)`


    `    {`


    `    }`


    `}`


    `public class Coupe : AbstractCar`


    `{`


    `    public Coupe(IEngine engine)`


    `        : this(engine, VehicleColour.Unpainted)`


    `    {`


    `    }`


    `    public Coupe(IEngine engine, VehicleColour colour)`


    `        : base(engine, colour)`


    `    {`


    `    }`


    `}`


    `public class Sport : AbstractCar`


    `{`


    `    public Sport(IEngine engine)`


    `        : this(engine, VehicleColour.Unpainted)`


    `    {`


    `    }`


    `    public Sport(IEngine engine, VehicleColour colour)`


    `        : base(engine, colour)`


    `    {`


    `    }`


    `}`


    `public class BoxVan : AbstractVan`


    `{`


    `    public BoxVan(IEngine engine)`


    `        : this(engine, VehicleColour.Unpainted)`


    `    {`


    `    }`


    `    public BoxVan(IEngine engine, VehicleColour colour)`


    `        : base(engine, colour)`


    `    {`


    `    }`


    `}`


    `public class Pickup : AbstractVan`


    `{`


    `    public Pickup(IEngine engine)`


    `        : this(engine, VehicleColour.Unpainted)`


    `    {`


    `    }`


    `    public Pickup(IEngine engine, VehicleColour colour)`


    `        : base(engine, colour)`


    `    {`


    `    }`


    `}`


    Many of the patterns in this book utilise one or more of the above classes in
    some way, often adding additional functionality or classes for the purposes of
    explaining the pattern in question. You will also frequently see reference to
    a `Client` class; this just refers to whatever class is making use of the pattern
    under discussion.


    How patterns are categorised


    Each of the patterns described in this book fall under one of three categories;
    Creational, Structural or Behavioural:


    *   Creational patterns provide approaches to object instantiation. Where you
    place the `new` keyword affects how tightly or loosely coupled your classes are;


    *   Structural patterns provide approaches for combining classes and objects to
    form larger structures. Deciding whether to use inheritance or composition affects
    how flexible and adaptable your software is;


    *   Behavioural patterns provide approaches for handling communication between
    objects.


    Common principles in design patterns'
