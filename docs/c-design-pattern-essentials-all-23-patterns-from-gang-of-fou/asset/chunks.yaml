  trans: "\n\n现在我们需要一种方法来获取正确的系列零件（无论是汽车还是面包车），但又不需要在客户端程序每次需要它们时显式地实例化特定类型。为了实现这一目标，我们将定义“工厂”类来为我们完成工作：\n\
    \n![](img/00042.jpg)\n图 2.2 : 抽象工厂模式\n\n`AbstractVehicleFactory` 类是一个抽象类，它定义了抽象方法\
    \ `CreateBody()`、`CreateChassis()` 和 `CreateGlassware()`，分别返回一个 `IBody`、`IChassis`\
    \ 和 `IGlassware` 对象：\n\n```csharp\npublic abstract class AbstractVehicleFactory\n\
    {\n    public abstract IBody CreateBody();\n    public abstract IChassis CreateChassis();\n\
    \    public abstract IGlassware CreateGlassware();\n}\n```\n\n具体子类 `CarFactory`\
    \ 返回特定于汽车家族的对象：\n\n```csharp\npublic class CarFactory : AbstractVehicleFactory\n\
    {\n    public override IBody CreateBody()\n    {\n        return new CarBody();\n\
    \    }\n    public override IChassis CreateChassis()\n    {\n        return new\
    \ CarChassis();\n    }\n    public override IGlassware CreateGlassware()\n   \
    \ {\n        return new CarGlassware();\n    }\n}\n```\n\n具体子类 `VanFactory` 返回特定于面包车家族的对象：\n\
    \n```csharp\npublic class VanFactory : AbstractVehicleFactory\n{\n    public override\
    \ IBody CreateBody()\n    {\n        return new VanBody();\n    }\n    public\
    \ override IChassis CreateChassis()\n    {\n        return new VanChassis();\n\
    \    }\n    public override IGlassware CreateGlassware()\n    {\n        return\
    \ new VanGlassware();\n    }\n}\n```\n\n现在，剩下的只需要客户端程序在实例化相应的“工厂”后，它就可以获取正确的零件，而无需指定它们是用于汽车还是面包车：\n\
    \n![](img/00064.jpg)\n图 2.3 : 客户端如何使用抽象工厂\n\n```csharp\nstring whatToMake = \"\
    car\"; // 或 \"van\"\nAbstractVehicleFactory factory = null;\n// 创建正确的“工厂”...\n\
    if (whatToMake.Equals(\"car\"))\n{\n    factory = new CarFactory();\n}\nelse\n\
    {\n    factory = new VanFactory();\n}\n// 创建车辆的组件部分...\n// 这些将全部是汽车零件或全部是面包车零件\n\
    IBody vehicleBody = factory.CreateBody();\nIChassis vehicleChassis = factory.CreateChassis();\n\
    IGlassware vehicleGlassware = factory.CreateGlassware();\n// 显示我们创建的内容...\nConsole.WriteLine(vehicleBody.BodyParts);\n\
    Console.WriteLine(vehicleChassis.ChassisParts);\nConsole.WriteLine(vehicleGlassware.GlasswareParts);\n\
    Console.Read();\n```\n\n因此，你的客户端程序需要知道它正在制造汽车还是面包车，但一旦实例化了正确的工厂，所有创建零件的方法都可以使用一组相同的方法调用来完成。\n\
    \n抽象工厂模式的主要缺点在于，当你需要添加额外的“产品”时。例如，如果我们现在需要在组件家族中包含灯具，那么除了修改 `AbstractVehicleFactory`、`CarFactory`\
    \ 和 `VanFactory` 之外，还需要创建一个新的 `ILights` 层级结构（`CarLights` 和 `VanLights`）。\n\n#\
    \ 3. 构建器 (Builder)\n\n**类型：** 创建型 (Creational)\n\n**目的：** 将复杂对象的构建过程与其表示分离，以便使用相同的构建过程可以创建不同的表示。\n\
    \nFoobar 公司生产汽车和面包车，每种车的构建过程在细节上有所不同；例如，面包车的车壳包含一个驾驶室区域和一个大型加固存储区域，而轿车则包含一个乘客区域和一个行李区域（即后备箱）。而且，无论构建什么类型的车辆，都有许多必须执行的复杂步骤。\n\
    \n构建器模式通过将各个步骤分离到构建器层级结构中的独立方法中促进复杂对象的构建，然后使用指挥器（Director）对象按正确的顺序指定所需的步骤。最后，从构建器中获取成品。\n\
    \n下图显示了这些关系：\n\n![](img/0031.jpg)\n图 3.1 : 构建器\n\n我们从 `VehicleBuilder` 类开始：\n\n\
    ```csharp\npublic abstract class VehicleBuilder\n{\n    public virtual void BuildBody()\
    \ {}\n    public virtual void Boot() {}\n    public virtual void BuildChassis()\
    \ {}\n    public virtual void BuildPassengerArea() {}\n    public virtual void\
    \ BuildReinforcedStorageArea() {}\n    public virtual void BuildWindows() {}\n\
    \    public abstract IVehicle Vehicle {get; }\n}\n```\n\n注意此类如何定义了汽车和面包车的所有“构建”方法，并为每个方法提供了默认的空实现。抽象属性\
    \ `Vehicle` 用于返回构建完的车辆。`CarBuilder` 类继承自 `VehicleBuilder` 并重写了相应的方法：\n\n```csharp\n\
    public class CarBuilder : VehicleBuilder\n{\n    private AbstractCar carInProgress;\n\
    \    public CarBuilder(AbstractCar car)\n    {\n        carInProgress = car;\n\
    \    }\n    public override void BuildBody()\n    {\n        Console.WriteLine(\"\
    building body\");\n    }\n    public override void Boot()\n    {\n        Console.WriteLine(\"\
    building boot\");\n    }\n    public override void BuildChassis()\n    {\n   \
    \     Console.WriteLine(\"building chassis\");\n    }\n    public override void\
    \ BuildPassengerArea()\n    {\n        Console.WriteLine(\"building passenger\
    \ area\");\n    }\n    public override void BuildWindows()\n    {\n        Console.WriteLine(\"\
    building windows\");\n    }\n    public override IVehicle Vehicle\n    {\n   \
    \     get\n        {\n            return carInProgress;\n        }\n    }\n}\n\
    ```\n\n注意 `BuildReinforcedStorageArea()` 方法没有被重写，因为它不适用于汽车。`VanBuilder` 类重写了相应的方法来构建面包车：\n\
    \n```csharp\npublic class VanBuilder : VehicleBuilder\n{\n    private AbstractVan\
    \ vanInProgress;\n    public VanBuilder(AbstractVan van)\n    {\n        vanInProgress\
    \ = van;\n    }\n    public override void BuildBody()\n    {\n        Console.WriteLine(\"\
    building van body\");\n    }\n    public override void BuildChassis()\n    {\n\
    \        Console.WriteLine(\"building van chassis\");\n    }\n    public override\
    \ void BuildReinforcedStorageArea()\n    {\n        Console.WriteLine(\"building\
    \ van storage area\");\n    }\n    public override void BuildWindows()\n    {\n\
    \        Console.WriteLine(\"building van windows\");\n    }\n    public override\
    \ IVehicle Vehicle\n    {\n        get\n        {\n            return vanInProgress;\n\
    \        }\n    }\n}\n```\n\n注意 `Boot()` 和 `BuildPassengerArea()` 方法没有被重写，因为它们不适用于面包车。\n\
    \n`VehicleDirector` 抽象类要求将一个 `VehicleBuilder` 对象传递给其 `Build()` 方法，供子类实现：\n\n```csharp\n\
    public abstract class VehicleDirector\n{\n    public abstract IVehicle Build(VehicleBuilder\
    \ builder);\n}\n```\n\n`CarDirector` 类继承自 `VehicleDirector` 并提供了构建汽车的逐步过程：\n\n\
    ```csharp\npublic class CarDirector : VehicleDirector\n{\n    public override\
    \ IVehicle Build(VehicleBuilder builder)\n    {\n        builder.BuildChassis();\n\
    \        builder.BuildBody();\n        builder.BuildPassengerArea();\n       \
    \ builder.Boot();\n        builder.BuildWindows();\n        return builder.Vehicle;\n\
    \    }\n}\n```\n\n`VanDirector` 类提供了构建面包车的逐步过程：\n\n```csharp\npublic class VanDirector\
    \ : VehicleDirector\n{\n    public override IVehicle Build(VehicleBuilder builder)\n\
    \    {\n        builder.BuildChassis();\n        builder.BuildBody();\n      \
    \  builder.BuildReinforcedStorageArea();\n    }\n}\n```\n\n"
- fmt: "\n```csharp\n        builder.BuildWindows();\n        return builder.Vehicle;\n\
    \    }\n}\n```\n\nAs an example of how to use the above classes, let's assume\
    \ we want to build a `Saloon` car:\n\n```csharp\nAbstractCar car = new Saloon(new\
    \ StandardEngine(1300));\nVehicleBuilder builder = new CarBuilder(car);\nVehicleDirector\
    \ director = new CarDirector();\nVehicle v = director.Build(builder);\nConsole.WriteLine(v);\n\
    Console.Read();\n```\n\nYou can see the required `Builder` object is constructed\
    \ and passed to the required `Director` object, after which we invoke the method\
    \ to build the product and then retrieve the finished article. The output should\
    \ show:\n\n```\nBuilding car chassis\nBuilding car body\nBuilding car passenger\
    \ area\nBuilding car boot\nBuilding car windows\nSaloon (StandardEngine (1300),\
    \ Unpainted)\n```\n\n## 4. Factory Method\n\n**Type**: Creational\n**Purpose**:\
    \ Define an interface for creating an object, but let subclasses decide which\
    \ class to instantiate.\n\nYou will recall from the introduction the following\
    \ class hierarchy for the vehicles made by the Foobar Motor Company:\n\n![](images/00035.jpg)\n\
    Figure 4.1 : `IVehicle` class hierarchy\n\nWhen we need to instantiate a particular\
    \ type of vehicle (such as a `Coupe`) it is often more flexible to define a separate\
    \ class whose responsibility it is to manage the instantiation. This separate\
    \ class is known as a Factory.\n\nThe Factory Method pattern defines an abstract\
    \ class which serves as the 'factory' and that has an abstract method within to\
    \ determine what product (in our case vehicle) to instantiate. Concrete subclasses\
    \ of the factory make that determination. Here is how the Factory Method pattern\
    \ could be used with the `IVehicle` class hierarchy:\n\n![](images/00033.jpg)\n\
    Figure 4.2 : Factory Method pattern\n\nIn the above diagram we can see that we\
    \ have created an abstract `VehicleFactory` class which has two concrete subclasses,\
    \ `CarFactory` and `VanFactory`. Let us look at how `VehicleFactory` is defined:\n\
    \n```csharp\npublic abstract class VehicleFactory\n{\n    public enum DrivingStyle\n\
    \    {\n        Economical, Midrange, Powerful\n    }\n    public virtual IVehicle\
    \ Build(DrivingStyle style, VehicleColour colour)\n    {\n        IVehicle v =\
    \ SelectVehicle(style);\n        v.Paint(colour);\n        return v;\n    }\n\
    \    // This is the \"factory method\"\n    protected internal abstract IVehicle\
    \ SelectVehicle(DrivingStyle style);\n}\n```\n\n`VehicleFactory` contains the\
    \ `public` method `Build()` that takes as arguments the driving style (`Economical`,\
    \ `Midrange` or `Powerful`) and the colour that the vehicle should be painted.\
    \ The `Build()` method calls the `protected` abstract `SelectVehicle()` method,\
    \ which is the \"factory method\" after which the pattern is named. The implementation\
    \ of `SelectVehicle()` is therefore delegated to the subclasses such that each\
    \ subclass determines the specific type of vehicle to instantiate. The method\
    \ is `protected` because we only want subclasses to utilise it; it is not intended\
    \ to be invoked by clients.\n\nHere is the `CarFactory` concrete subclass:\n\n\
    ```csharp\npublic class CarFactory : VehicleFactory\n{\n    protected internal\
    \ override IVehicle SelectVehicle(DrivingStyle style)\n    {\n        if (style\
    \ == DrivingStyle.Economical)\n        {\n            return new Saloon(new StandardEngine(1300));\n\
    \        }\n        else if (style == DrivingStyle.Midrange)\n        {\n    \
    \        return new Coupe(new StandardEngine(1600));\n        }\n        else\n\
    \        {\n            return new Sport(new TurboEngine(2000));\n        }\n\
    \    }\n}\n```\n\nAs you can see, the `SelectVehicle()` method is implemented\
    \ such that it works out from the supplied arguments exactly which type of car\
    \ should be instantiated and returned.\n\nThe `VanFactory` is similar, using the\
    \ argument to decide which van to instantiate and return:\n\n```csharp\npublic\
    \ class VanFactory : VehicleFactory\n{\n    protected internal override IVehicle\
    \ SelectVehicle(DrivingStyle style)\n    {\n        if ((style == DrivingStyle.Economical)\
    \ || (style == DrivingStyle.Midrange))\n        {\n            return new Pickup(new\
    \ StandardEngine(2200));\n        }\n        else\n        {\n            return\
    \ new BoxVan(new TurboEngine(2500));\n        }\n    }\n}\n```\n\nClient programs\
    \ instantiate the factory and call its `Build()` method:\n\n```csharp\n// I want\
    \ an economical car\nVehicleFactory carFactory = new CarFactory();\nVehicle car\
    \ = carFactory.Build(DrivingStyle.Economical, VehicleColour.Blue);\nConsole.WriteLine(car);\n\
    \n// I am a van\nVehicleFactory vanFactory = new VanFactory();\nVehicle van =\
    \ vanFactory.Build(DrivingStyle.Powerful, VehicleColour.White);\nConsole.WriteLine(van);\n\
    ```\n\n## 5. Prototype\n\n**Type**: Creational\n**Purpose**: Specify the kinds\
    \ of objects to create by copying the prototype instance.\n\nWe shall assume in\
    \ this chapter that instantiating car and van objects is time-consuming, and we\
    \ therefore need a way of speeding up time whenever we need a new object. Here\
    \ is a reminder of the `IVehicle` class and `AbstractVehicle` class:\n\n```csharp\n\
    public interface IVehicle\n{\n    IEngine Engine { get; }\n    VehicleColour Colour\
    \ { get; }\n    void Paint(VehicleColour colour);\n}\n\npublic abstract class\
    \ AbstractVehicle : IVehicle\n{\n    private IEngine engine;\n    private VehicleColour\
    \ colour;\n    public AbstractVehicle(IEngine engine) : this(engine, VehicleColour.PAINTED)\n\
    \    {\n    }\n    public AbstractVehicle(IEngine engine, VehicleColour colour)\n\
    \    {\n        this.engine = engine;\n        this.colour = colour;\n       \
    \ // ... followed by time-consuming stuff\n    }\n    public virtual IEngine Engine\n\
