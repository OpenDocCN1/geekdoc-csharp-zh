  trans: "\n本书中的每个示例代码都使用了源自业务世界的共同主题，即一家名为 `Foobar Motor Company` 的虚拟车辆制造商。该公司生产各种汽车和面包车，以及用于驱动车辆的引擎。因此，您应该熟悉本介绍中描述的类。\n\
    \n类层次结构如下：\n\n![](img/00028.jpg)\n\n图 1.1：`IVehicle` 和 `IEngine` 类层次结构\n\n`IVehicle`\
    \ 和 `IEngine` 是这些层次结构的根接口，每个车辆对象都需要一个对 `IEngine` 对象的引用。`AbstractVehicle` 是实现 `IVehicle`\
    \ 接口的抽象类，`AbstractEngine` 同样实现了 `IEngine` 接口。对于车辆，我们还有 `AbstractCar` 和 `AbstractVan`，以及作为汽车类型的具体子类\
    \ `Saloon`、`Coupe` 和 `Sport`。`AbstractVan` 有作为面包车类型的具体子类 `BoxVan` 和 `Pickup`。\n\
    \n`AbstractEngine` 的具体子类是 `StandardEngine` 和 `TurboEngine`。\n\n尽管层次结构中有许多类，但每个类的代码都刻意保持简单，以便您可以专注于理解设计模式，而不是去解析复杂的代码。为了说明这一点，这里是\
    \ `IEngine` 接口的源代码：\n\n```csharp\npublic interface IEngine\n{\n    int Size {\
    \ get; }\n    bool Turbo { get; }\n}\n```\n\n这个简单的接口仅要求属性访问器来返回引擎尺寸（立方厘米）以及是否为涡轮增压。`AbstractEngine`\
    \ 类如下：\n\n```csharp\npublic abstract class AbstractEngine : IEngine\n{\n    private\
    \ int size;\n    private bool turbo;\n    public AbstractEngine(int size, bool\
    \ turbo)\n    {\n        this.size = size;\n        this.turbo = turbo;\n    }\n\
    \    public virtual int Size\n    {\n        get\n        {\n            return\
    \ size;\n        }\n    }\n    public virtual bool Turbo\n    {\n        get\n\
    \        {\n            return turbo;\n        }\n    }\n    public override string\
    \ ToString()\n    {\n        return this.GetType().Name + \" (\" + size + \")\"\
    ;\n    }\n}\n```\n\n这种简化的引擎实现要求在构造函数中提供相应的属性。`ToString()` 方法的实现将产生此类格式的输出：\n\n\
    `StandardEngine (1300)`\n\n`TurboEngine (2000)`\n\n`Equals()` 和 `GetHashCode()`\
    \ 方法将继承自 `object`，因此使用对象标识性。这是合理的，因为例如，两个独立的 1300cc Standard 引擎在逻辑上是不同的实体，因此应该被这样处理（一个引擎放入一辆车辆，另一个引擎放入另一辆车辆）。\n\
    \n具体子类非常简单：\n\n```csharp\npublic class StandardEngine : AbstractEngine\n{\n  \
    \  public StandardEngine(int size) : base(size, false)\n    {\n        // 非涡轮增压\n\
    \    }\n}\n\npublic class TurboEngine : AbstractEngine\n{\n    public TurboEngine(int\
    \ size) : base(size, true)\n    {\n        // 涡轮增压\n    }\n}\n```\n\n现在您已经了解了\
    \ `IEngine` 层次结构，我们可以查看一下 `IVehicle` 接口：\n\n```csharp\npublic interface IVehicle\n\
    {\n    IEngine Engine { get; }\n    VehicleColour Colour { get; }\n    void Paint(VehicleColour\
    \ colour);\n}\n```\n\n一个名为 `VehicleColour` 的辅助枚举定义了每个 `IVehicle` 对象可能具有颜色：\n\n\
    ```csharp\npublic enum VehicleColour\n{\n    Unpainted, Blue, Green,\n    Red,\
    \ Silver, Yellow\n}\n```\n\n这是 `AbstractVehicle` 类实现 `IVehicle` 的方式：\n\n```csharp\n\
    public abstract class AbstractVehicle : IVehicle\n{\n    private IEngine engine;\n\
    \    private VehicleColour colour;\n    public AbstractVehicle(IEngine engine)\n\
    \    : this(engine, VehicleColour.Unpainted)\n    {\n    }\n    public AbstractVehicle(IEngine\
    \ engine, VehicleColour colour)\n    {\n        this.engine = engine;\n      \
    \  this.colour = colour;\n    }\n    public virtual IEngine Engine\n    {\n  \
    \      get\n        {\n            return engine;\n        }\n    }\n    public\
    \ virtual VehicleColour Colour\n    {\n        get\n        {\n            return\
    \ colour;\n        }\n    }\n    public virtual void Paint(VehicleColour colour)\n\
    \    {\n        this.colour = colour;\n    }\n    public override string ToString()\n\
    \    {\n        return this.GetType().Name + \" (\" + engine + \", \" + colour\
    \ + \")\";\n    }\n}\n```\n\n`AbstractVehicle` 中的重载构造函数需要提供一个 `IEngine` 对象和可选的车辆颜色。调用\
    \ `ToString()` 的输出将采用这种格式：\n\n`Saloon (StandardEngine (1300), Red)`\n\n`BoxVan\
    \ (TurboEngine (2200), White)`\n\n`AbstractCar` 和 `AbstractVan` 类只是简单转发到构造函数（显然，真实的类会定义汽车和面包车之间的任何差异）：\n\
    \n```csharp\npublic abstract class AbstractCar : AbstractVehicle\n{\n    public\
    \ AbstractCar(IEngine engine)\n    : this(engine, VehicleColour.Unpainted)\n \
    \   {\n    }\n    public AbstractCar(IEngine engine, VehicleColour colour)\n \
    \   : base(engine, colour)\n    {\n    }\n}\n\npublic abstract class AbstractVan\
    \ : AbstractVehicle\n{\n    public AbstractVan(IEngine engine)\n    : this(engine,\
    \ VehicleColour.Unpainted)\n    {\n    }\n    public AbstractVan(IEngine engine,\
    \ VehicleColour colour)\n    : base(engine, colour)\n    {\n    }\n}\n```\n\n\
    具体子类也只是转发到构造函数：\n\n```csharp\npublic class Saloon : AbstractCar\n{\n    public\
    \ Saloon(IEngine engine)\n    : this(engine, VehicleColour.Unpainted)\n    {\n\
    \    }\n    public Saloon(IEngine engine, VehicleColour colour)\n    : base(engine,\
    \ colour)\n    {\n    }\n}\n\npublic class Coupe : AbstractCar\n{\n    public\
    \ Coupe(IEngine engine)\n    : this(engine, VehicleColour.Unpainted)\n    {\n\
    \    }\n    public Coupe(IEngine engine, VehicleColour colour)\n    : base(engine,\
    \ colour)\n    {\n    }\n}\n\npublic class Sport : AbstractCar\n{\n    public\
    \ Sport(IEngine engine)\n    : this(engine, VehicleColour.Unpainted)\n    {\n\
    \    }\n    public Sport(IEngine engine, VehicleColour colour)\n    : base(engine,\
    \ colour)\n    {\n    }\n}\n\npublic class BoxVan : AbstractVan\n{\n    public\
    \ BoxVan(IEngine engine)\n    : this(engine, VehicleColour.Unpainted)\n    {\n\
    \    }\n    public BoxVan(IEngine engine, VehicleColour colour)\n    : base(engine,\
    \ colour)\n    {\n    }\n}\n\npublic class Pickup : AbstractVan\n{\n    public\
    \ Pickup(IEngine engine)\n    : this(engine, VehicleColour.Unpainted)\n    {\n\
    \    }\n    public Pickup(IEngine engine, VehicleColour colour)\n    : base(engine,\
    \ colour)\n    {\n    }\n}\n```\n\n"
- fmt: "\nExperience has shown that some object-oriented approaches are more flexible\
    \ than others. Here is a summary of the main principles that the patterns in this\
    \ book strive to adhere to:\n\n1. **Program to an interface, not an implementation.**\
    \ By \"interface\" is meant the general concept of abstraction, which could refer\
    \ to a `C#` interface or an abstract class. To accomplish this, use the most general\
    \ type (e.g. `interface`) possible when declaring variables, constructor and method\
    \ arguments, etc. Doing so gives extra flexibility as to the actual types that\
    \ are used at run-time.\n\n2. **Prefer object composition over inheritance.**\
    \ Where a class is related to another in some way, you should distinguish between\
    \ \"is a\" (or \"is a type of\") and \"has a\" relationships. In the `IVehicle`\
    \ and `IEngine` hierarchies described earlier, it is true to say that `AbstractCar`\
    \ \"is a\" `IVehicle`, and that `Saloon` \"is a\" `AbstractCar`. But it would\
    \ not be true to say that `IVehicle` \"is a\" `IEngine`, but rather that an `IVehicle`\
    \ \"has a\" `IEngine`. Therefore, inheritance is legitimately used for `AbstractCar`\
    \ and `Saloon`, but object composition is used between `IVehicle` and `IEngine`.\
    \ Do not be tempted to use inheritance just to save having to write some methods.\
    \ Sometimes using a \"has a\" relationship is more flexible even when an \"is\
    \ a\" relationship seems the natural choice. You will see an example of this in\
    \ the `Decorator` pattern.\n\n3. **Keep objects loosely-coupled.** Ideally, classes\
    \ should model just one thing, and only be composed of other objects that are\
    \ genuinely required (such as a `IVehicle` requiring an `IEngine`). Ask yourself\
    \ what would happen if you wanted to use a class you have written in a completely\
    \ different application; what \"baggage\" (i.e. other classes) would also need\
    \ to be copied? By keeping this to a minimum, you make your class more re-usable.\
    \ A good example of a pattern that uses loose-coupling is `Observer`.\n\n4. **Encapsulate\
    \ the concept that varies.** If you've written a class in which some parts are\
    \ the same for each instance but another part of the class varies for each instance,\
    \ consider extracting the latter into a class of its own, which is referenced\
    \ by the original class. An example pattern that uses this principle is `Strategy`.\n\
    \n## General advice\n\nThe principles listed above will become more apparent as\
    \ we explore the patterns in detail. You should also note that the patterns described\
    \ in this book give a general approach to a particular problem. It is quite acceptable\
    \ for you to modify or adapt them to better fit your particular problem. And it\
    \ is very common for multiple patterns to be combined to solve complex problems.\n\
    \nHowever, do remember that you should strive to keep things simple. It is easy,\
    \ after reading a book such as this, to think that you have to find a pattern\
    \ to solve a particular problem when an even simpler solution might be available.\
    \ One of the mantras of Extreme Programming (XP) is \"You aren't going to need\
    \ it\", the idea being that you should avoid adding features before they are required,\
    \ and this philosophy could also be applied to patterns; beware of adding an unnecessary\
    \ feature just so you can apply a pattern. Patterns are not a \"magic bullet\"\
    , just another set of tools in your toolkit, albeit an indispensable set.\n\n\
    Use your knowledge and experience to judge whether a pattern should be applied\
    \ to your circumstances, and if so to what extent you need to adapt it. A good\
    \ example of when applying patterns may be beneficial is when you are \"refactoring\"\
    \ existing code. Refactoring is when you are changing the structure of some software\
    \ but not its behaviour, to improve its maintainability and flexibility. This\
    \ provides a good opportunity to examine your code to see if a pattern might provide\
    \ a better structure, such as replacing conditionals, or defining factory classes\
    \ to aid object instantiation.\n\nPatterns have been applied to many programming\
    \ languages besides C#, particularly object-oriented languages, and indeed other\
    \ fields, having originated by being applied to architectural design. And new\
    \ patterns are being developed and applied on a regular basis, so you may view\
    \ this book as merely a starting point in the subject.\n\n## Part II. Creational\
    \ Patterns\n\nThis part describes the five creational patterns, that is, those\
    \ that help manage the instantiation of objects.\n\n* **Abstract Factory**: Provide\
    \ an interface for creating families of related or dependent objects without specifying\
    \ their concrete classes;\n* **Builder**: Separate the construction of a complex\
    \ object from its representation so that the same construction process can create\
    \ different representations;\n* **Factory Method**: Define an interface for creating\
    \ an object, but let subclasses decide which class to instantiate;\n* **Prototype**:\
    \ Specify the kinds of objects to create using a prototypical instance, and create\
    \ new objects by copying the prototype;\n* **Singleton**: Ensure a class allows\
    \ only one object to be created, providing a single point of access to it.\n\n\
    ### 2. Abstract Factory\n\n**Type**: Creational\n\n**Purpose**: Provide an interface\
    \ for creating families of related or dependent objects without specifying their\
    \ concrete classes.\n\nThe Foobar Motor Company makes cars and vans, which when\
    \ being built comprises (among lots of other things) a body shell, a chassis and\
    \ glassware for the windows. Although both cars and vans need all of the same\
    \ types of components, the specifics of each type differ depending upon whether\
    \ it is being used for a car or a van.\n\nIn other words:\n* A car's body shell\
    \ is different from a van's body shell;\n* A car's chassis is different from a\
    \ van's chassis;\n* A car's glassware is different from a van's glassware.\n\n\
    Therefore, when we need to build a vehicle we can think of the components as coming\
    \ from different 'families'; that is, when we build a car we use one family of\
    \ components and when we build a van we use a different family of components.\n\
    \nWe can thus model the components into simple hierarchies, as illustrated in\
    \ the following figure:\n\n![](images/00038.jpg)\n\nFigure 2.1 : `IBody`, `IChassis`\
    \ & `IGlassware` class hierarchies\n\nAs you can see, there is an interface for\
    \ `IBody` having implementations of `CarBody` and `VanBody`. Likewise we have\
    \ similar separate hierarchies for `IChassis` and `IGlassware`.\n\nThe code for\
    \ the `IBody` hierarchy is very simple:\n\n```csharp\npublic interface IBody\n\
    {\n    string BodyParts { get; }\n}\n\npublic class CarBody : IBody\n{\n    public\
    \ virtual string BodyParts\n    {\n        get\n        {\n            return\
    \ \"Body shell parts for a car\";\n        }\n    }\n}\n\npublic class VanBody\
    \ : IBody\n{\n    public virtual string BodyParts\n    {\n        get\n      \
    \  {\n            return \"Body shell parts for a van\";\n        }\n    }\n}\n\
    ```\n\nThe code for the `IChassis` hierarchy is almost identical:\n\n```csharp\n\
    public interface IChassis\n{\n    string ChassisParts { get; }\n}\n\npublic class\
    \ CarChassis : IChassis\n{\n    public virtual string ChassisParts\n    {\n  \
    \      get\n        {\n            return \"Chassis parts for a car\";\n     \
    \   }\n    }\n}\n\npublic class VanChassis : IChassis\n{\n    public virtual string\
    \ ChassisParts\n    {\n        get\n        {\n            return \"Chassis parts\
    \ for a van\";\n        }\n    }\n}\n```\n\nAnd likewise the code for the `IGlassware`\
    \ hierarchy:\n\n```csharp\npublic interface IGlassware\n{\n    string GlasswareParts\
    \ { get; }\n}\n\npublic class CarGlassware : IGlassware\n{\n    public virtual\
    \ string GlasswareParts\n    {\n        get\n        {\n            return \"\
    Window glassware for a car\";\n        }\n    }\n}\n\npublic class VanGlassware\
    \ : IGlassware\n{\n    public virtual string GlasswareParts\n    {\n        get\n\
    \        {\n            return \"Window glassware for a van\";\n        }\n  \
    \  }\n}\n```\n"
  raw: 'Experience has shown that some object-oriented approaches are more flexible
    than others. Here is a summary of the main principles that the patterns in this
    book strive to adhere to:


    1\. Program to an interface, not an implementation. By "interface" is meant the
    general concept of abstraction, which could refer to a C# interface or an abstract
    class. To accomplish this, use the most general type (e.g. interface) possible
    when declaring variables, constructor and method arguments, etc. Doing so gives
    extra flexibility as to the actual types that are used at run-time.


    2\. Prefer object composition over inheritance. Where a class is related to another
    in some way, you should distinguish between "is a" (or "is a type of") and "has
    a" relationships. In the `IVehicle` and `IEngine` hierarchies described earlier,
    it is true to say that `AbstractCar` "is a" `IVehicle`, and that `Saloon` "is
    a" `AbstractCar`. But it would not be true to say that `IVehicle` "is a" `IEngine`,
    but rather that an `IVehicle` "has a" `IEngine`. Therefore, inheritance is legitimately
    used for `AbstractCar` and `Saloon`, but object composition is used between `IVehicle`
    and `IEngine`. Do not be tempted to use inheritance just to save having to write
    some methods. Sometimes using a "has a" relationship is more flexible even when
    an "is a" relationship seems the natural choice. You will see an example of this
    in the Decorator pattern.


    3\. Keep objects loosely-coupled. Ideally, classes should model just one thing,
    and only be composed of other objects that are genuinely required (such as a `IVehicle`
    requiring an `IEngine`). Ask yourself what would happen if you wanted to use a
    class you have written in a completely different application; what "baggage" (i.e.
    other classes) would also need to be copied? By keeping this to a minimum, you
    make your class more re-usable. A good example of a pattern that uses loose-coupling
    is Observer.


    4\. Encapsulate the concept that varies. If you''ve written a class in which some
    parts are the same for each instance but another part of the class varies for
    each instance, consider extracting the latter into a class of its own, which is
    referenced by the original class. An example pattern that uses this principle
    is Strategy.


    Some general advice


    The principles listed above will become more apparent as we explore the patterns
    in detail. You should also note that the patterns described in this book give
    a general approach to a particular problem. It is quite acceptable for you to
    modify or adapt them to better fit your particular problem. And it is very common
    for multiple patterns to be combined to solve complex problems.


    However, do remember that you should strive to keep things simple. It is easy,
    after reading a book such as this, to think that you have to find a pattern to
    solve a particular problem when an even simpler solution might be available. One
    of the mantras of Extreme Programming (XP) is "You aren''t going to need it",
    the idea being that you should avoid adding features before they are required,
    and this philosophy could also be applied to patterns; beware of adding an unnecessary
    feature just so you can apply a pattern. Patterns are not a "magic bullet", just
    another set of tools in your toolkit, albeit an indispensable set.


    Use your knowledge and experience to judge whether a pattern should be applied
    to your circumstances, and if so to what extent you need to adapt it. A good example
    of when applying patterns may be beneficial is when you are "refactoring" existing
    code. Refactoring is when you are changing the structure of some software but
    not its behaviour, to improve its maintainability and flexibility. This provides
    a good opportunity to examine your code to see if a pattern might provide a better
    structure, such as replacing conditionals, or defining factory classes to aid
    object instantiation.


    Patterns have been applied to many programming languages besides C#, particularly
    object-oriented languages, and indeed other fields, having originated by being
    applied to architectural design. And new patterns are being developed and applied
    on a regular basis, so you may view this book as merely a starting point in the
    subject.


    Part II. Creational Patterns


    This part describes the five creational patterns, that is, those that help manage
    the instantiation of objects.


    *   Abstract Factory: Provide an interface for creating families of related or
    dependent objects without specifying their concrete classes;


    *   Builder: Separate the construction of a complex object from its representation
    so that the same construction process can create different representations;


    *   Factory Method: Define an interface for creating an object, but let subclasses
    decide which class to instantiate;


    *   Prototype: Specify the kinds of objects to create using a prototypical instance,
    and create new objects by copying the prototype;


    *   Singleton: Ensure a class allows only one object to be created, providing
    a single point of access to it.


    2\. Abstract Factory


    Type: Creational


    Purpose: Provide an interface for creating families of related or dependent objects
    without specifying their concrete classes.


    The Foobar Motor Company makes cars and vans, which when being built comprises
    (among lots of other things) a body shell, a chassis and glassware for the windows.
    Although both cars and vans need all of the same types of components, the specifics
    of each type differ depending upon whether it is being used for a car or a van.


    In other words:


    *   A car''s body shell is different from a van''s body shell;


    *   A car''s chassis is different from a van''s chassis;


    *   A car''s glassware is different from a van''s glassware.


    Therefore, when we need to build a vehicle we can think of the components as coming
    from different ''families''; that is, when we build a car we use one family of
    components and when we build a van we use a different family of components.


    We can thus model the components into simple hierarchies, as illustrated in the
    following figure:


    ![](images/00038.jpg)


    Figure 2.1 : `IBody`, `IChassis` & `IGlassware` class hierarchies


    As you can see, there is an interface for `IBody` having implementations of `CarBody`
    and `VanBody`. Likewise we have similar separate hierarchies for `IChassis` and
    `IGlassware`.


    The code for the `IBody` hierarchy is very simple:


    `public interface IBody`


    `{`


    `    string BodyParts { get; }`


    `}`


    `public class CarBody : IBody`


    `{`


    `    public virtual string BodyParts`


    `    {`


    `        get`


    `        {`


    `            return "Body shell parts for a car";`


    `        }`


    `    }`


    `}`


    `public class VanBody : IBody`


    `{`


    `    public virtual string BodyParts`


    `    {`


    `        get`


    `        {`


    `            return "Body shell parts for a van";`


    `        }`


    `    }`


    `}`


    The code for the `IChassis` hierarchy is almost identical:


    `public interface IChassis`


    `{`


    `    string ChassisParts { get; }`


    `}`


    `public class CarChassis : IChassis`


    `{`


    `    public virtual string ChassisParts`


    `    {`


    `        get`


    `        {`


    `            return "Chassis parts for a car";`


    `        }`


    `    }`


    `}`


    `public class VanChassis : IChassis`


    `{`


    `    public virtual string ChassisParts`


    `    {`


    `        get`


    `        {`


    `            return "Chassis parts for a van";`


    `        }`


    `    }`


    `}`


    And likewise the code for the `IGlassware` hierarchy:


    `public interface IGlassware`


    `{`


    `    string GlasswareParts { get; }`


    `}`


    `public class CarGlassware : IGlassware`


    `{`


    `    public virtual string GlasswareParts`


    `    {`


    `        get`


    `        {`


    `            return "Window glassware for a car";`


    `        }`


    `    }`


    `}`


    `public class VanGlassware : IGlassware`


    `{`


    `    public virtual string GlasswareParts`


    `    {`


    `        get`


    `        {`


    `            return "Window glassware for a car";`


    `        }`


    `    }`


    `}`'
