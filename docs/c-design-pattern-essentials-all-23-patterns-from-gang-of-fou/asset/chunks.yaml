  trans: "\n\n# 目的\n表示在对象结构元素上执行的方法。访问者模式（Visitor）允许你在不更改操作的元素类的情况下定义一个新方法。\n\n有时，类层次结构及其代码会变得非常庞大，但我们知道未来的需求是不可避免的。Foobar\
    \ 汽车公司的一个例子是 `IEngine` 层次结构，如下所示：\n\n![](img/00037.jpg)\n\n图 24.1：`IEngine` 类层次结构\n\
    \n实际上，`AbstractEngine` 类中的代码可能由许多单独组件组成，例如 `camshaft`（凸轮）、`piston`（活塞）、一些 `sparkplugs`（火花塞）等。如果我们需要添加遍历这些组件的功能，自然的方法是直接向\
    \ `AbstractEngine` 添加一个方法。但也许我们知道将来会有许多此类新需求，而我们并不希望直接向层次结构中不断添加方法？\n\n访问者模式允许我们只向类层次结构中添加一个额外的方法，用以便在不进行任何进一步更改的情况下添加许多不同类型的新功能。这是通过一种被称为“双分派发”（double-dispatch）的技术实现的，其中被调的方法向调用者对象发布一个回调。\n\
    \n该技术首先需要定义一个接口，我们称之为 `IEngineVisitor`：\n\n```csharp\npublic interface IEngineVisitor\n\
    {\n    void Visit(Camshaft camshaft);\n    void Visit(IEngine engine);\n    void\
    \ Visit(Piston piston);\n    void Visit(SparkPlug sparkPlug);\n}\n```\n\n我们还会定义一个名为\
    \ `IVisitable` 的接口，包含一个 `AcceptEngineVisitor()` 方法：\n\n```csharp\npublic interface\
    \ IVisitable\n{\n    void AcceptEngineVisitor(IEngineVisitor visitor);\n}\n```\n\
    \n你在之前的章节中已经过的 `IEngine` 接口（尽管我们在本章中对其进行了轻微修改）。`Camshaft`、`Piston` 和 `SparkPlug`\
    \ 类都非常简单，如下：\n\n```csharp\npublic class Camshaft : IVisitable\n{\n    public void\
    \ AcceptEngineVisitor(IEngineVisitor visitor)\n    {\n        visitor.Visit(this);\n\
    \    }\n}\n\npublic class Piston : IVisitable\n{\n    public void AcceptEngineVisitor(IEngineVisitor\
    \ visitor)\n    {\n        visitor.Visit(this);\n    }\n}\n\npublic class SparkPlug\
    \ : IVisitable\n{\n    public void AcceptEngineVisitor(IEngineVisitor visitor)\n\
    \    {\n        visitor.Visit(this);\n    }\n}\n```\n\n如你所见，这些类都定义了一个名为 `AcceptEngineVisitor()`\
    \ 的方法，它接收一个 `IEngineVisitor` 对象作为参数。该方法所做的调用传入的 `IEngineVisitor` 的 `Visit()` 方法，并传回对象实例。\n\
    \n我们修改后的 `IEngine` 接口现在扩展了 `IVisitable`：\n\n```csharp\npublic interface IEngine\
    \ : IVisitable\n{\n    int Size { get; }\n    int Turbo { get; }\n}\n```\n\n因此，`AbstractEngine`\
    \ 类需要实现这个新方法，在这种情况下，该方法遍历各个组件（凸轮、活塞、火花塞），并在每个组件上调用 `AcceptEngineVisitor()`：\n\n\
    ```csharp\npublic abstract class AbstractEngine : IEngine\n{\n    private int\
    \ size;\n    private bool turbo;\n    private Camshaft camshaft;\n    private\
    \ Piston piston;\n    private SparkPlug[] sparkPlugs;\n    public AbstractEngine(int\
    \ size, bool turbo)\n    {\n        this.size = size;\n        this.turbo = turbo;\n\
    \        // 创建凸轮、活塞和 4 个火花塞...\n        camshaft = new Camshaft();\n        piston\
    \ = new Piston();\n        sparkPlugs = new SparkPlug[]{new SparkPlug(), new SparkPlug(),\
    \ new SparkPlug(), new SparkPlug()};\n    }\n    public virtual int Size\n   \
    \ {\n        get\n        {\n            return size;\n        }\n    }\n    public\
    \ virtual bool Turbo\n    {\n        get\n        {\n            return turbo;\n\
    \        }\n    }\n    public virtual void AcceptEngineVisitor(IEngineVisitor\
    \ visitor)\n    {\n        // 访问每个组件...\n        camshaft.AcceptEngineVisitor(visitor);\n\
    \        piston.AcceptEngineVisitor(visitor);\n        foreach (SparkPlug eachPlug\
    \ in sparkPlugs)\n        {\n            eachPlug.AcceptEngineVisitor(visitor);\n\
    \        }\n        // 现在访问接收者...\n        visitor.Visit(this);\n    }\n    public\
    \ override string ToString()\n    {\n        return this.GetType().Name + \" (\"\
    \ + size + \")\";\n    }\n}\n```\n\n现在我们将创建一个 `IEngineVisitor` 的实际实现，这样你就可以看到如何轻松地为引擎添加功能，而无需对任何引擎类进行任何进一步更改。我们要做的第一件事是定义一些附加到引擎上的智能装置，它可以自动检查每个组件并诊断任何故障。因此，我们定义了\
    \ `EngineDiagnostics` 类：\n\n```csharp\npublic class EngineDiagnostics : IEngineVisitor\n\
    {\n    public virtual void Visit(Camshaft camshaft)\n    {\n        Console.WriteLine(\"\
    正在诊断凸轮\");\n    }\n    public virtual void Visit(IEngine engine)\n    {\n    \
    \    Console.WriteLine(\"正在诊断引擎\");\n    }\n    public virtual void Visit(Piston\
    \ piston)\n    {\n        Console.WriteLine(\"正在诊断活塞\");\n    }\n    public virtual\
    \ void Visit(SparkPlug sparkPlug)\n    {\n        Console.WriteLine(\"正在诊断单个火花塞\"\
    );\n    }\n}\n```\n\n我们还想打印引擎中每种类型组件的数量，因此我们还有一个 `EngineInventory` 类：\n\n```csharp\n\
    public class EngineInventory : IEngineVisitor\n{\n    private int camshaftCount;\n\
    \    private int pistonCount;\n    private int sparkPlugCount;\n    public EngineInventory()\n\
    \    {\n        camshaftCount = 0;\n        pistonCount = 0;\n        sparkPlugCount\
    \ = 0;\n    }\n    public virtual void Visit(Camshaft camshaft)\n    {\n     \
    \   camshaftCount++;\n    }\n    public virtual void Visit(IEngine engine)\n \
    \   {\n        Console.WriteLine(\"引擎有: \" + camshaftCount +\" 凸轮(s), \" + pistonCount\
    \ + \" 活塞(s), 和 \" + sparkPlugCount + \" 火花塞(s)\");\n    }\n    public virtual\
    \ void Visit(Piston piston)\n    {\n        pistonCount++;\n    }\n    public\
    \ virtual void Visit(SparkPlug sparkPlug)\n    {\n        sparkPlugCount++;\n\
    \    }\n}\n```\n\n下面的图总结了所有这些类是如何交互的：\n\n![](img/00009.jpg)\n\n图 24.2：访问者模式\n\n\
    客户端程序现在需要在 `IEngine` 实例上调用 `AcceptEngineVisitor()` 方法，传入适当的 `IEngineVisitor` 对象：\n\
    \n```csharp\n// 创建一个引擎...\nIEngine engine = new StandardEngine(1300);\n\n// 对引擎运行诊断...\n\
    engine.AcceptEngineVisitor(new EngineDiagnostics());\n```\n\n上述操作将产生以下输出：\n\n\
    `正在诊断凸轮`\n`正在诊断活塞`\n`正在诊断单个火花塞`\n`正在诊断单个火花塞`\n`正在诊断单个火花塞`\n`正在诊断单个火花塞`\n`正在诊断引擎`\n\
    \n并获取库存（使用相同的 `IEngine` 实例）：\n\n```csharp\n// 对引擎运行清单...\nengine.AcceptEngineVisitor(new\
    \ EngineInventory());\n```\n\n输出应显示：\n\n`引擎有: 1 凸轮(s), 1 活塞(s), 和 4 火花塞(s)`\n\n\
    # 第五部分 其他实用的模式\n\n本部分介绍了四种你在实际应用中可能会发现非常有用的模式：\n\n- **空对象（Null Object）**：定义一个允许处理空值的类；\n\
    - **简单工厂（Simple Factory）**：委托对象的实例化；\n- **模型-视图-控制器（Model View Controller）**：将用户界面组件的屏幕表示与其底层数据和功能分离；\n\
    - **分层（Layers）**：将应用程序划分为不同的模块级，并按层次级进行通信。\n\n25. 空对象\n\n"
- fmt: "\nAs any C# programmer soon discovers, software testing often throws up `NullReferenceException`\
    \ messages. Sometimes, the only way around this is to specifically test for `null`\
    \ before performing an operation, which puts an extra onus on the programmer.\n\
    \nSuppose a vehicle's instrument panel contains three slots for warning lights\
    \ (such as for low oil level or low brake fluid level). A particular vehicle might\
    \ only use these two lights, with the third slot empty, represented by `null`\
    \ within C#. Looping through the slots would require a specific test to prevent\
    \ a `NullReferenceException` being thrown:\n\n```csharp\n// OilLevelLight & BrakeFluidLight\
    \ are each types of IWarningLight\nIWarningLight[] lights = new IWarningLight[3];\n\
    lights[0] = new OilLevelLight();\nlights[1] = new BrakeFluidLight();\nlights[2]\
    \ = null; // empty slot\n\nforeach (IWarningLight currentLight in lights)\n{\n\
    \    if (currentLight != null)\n    {\n        currentLight.TurnOn();\n      \
    \  currentLight.TurnOff();\n        Console.WriteLine(currentLight.On);\n    }\n\
    }\n```\n\nAn approach that can help prevent the need to test for `null` is to\
    \ create a 'null object' class as part of the class hierarchy. This class will\
    \ implement the same interface but perform no actual function, as illustrated\
    \ in the following figure:\n\n![](images/00011.jpg)\nFigure 25.1 : Null Object\
    \ pattern\n\nThe `IWarningLight` interface defines the methods `TurnOn()`, `TurnOff()`\
    \ and a property getter for `On`:\n\n```csharp\npublic interface IWarningLight\n\
    {\n    void TurnOn();\n    void TurnOff();\n    bool On { get; }\n}\n```\n\nThe\
    \ `OilLevelLevel` and `BrakeFluidLevel` classes each implement the `IWarningLight`\
    \ interface and provide the appropriate code to switch the light on or off:\n\n\
    ```csharp\npublic class OilLevelLight : IWarningLight\n{\n    private bool on;\n\
    \    public virtual void TurnOn()\n    {\n        on = true;\n        Console.WriteLine(\"\
    Oil level light ON\");\n    }\n    public virtual void TurnOff()\n    {\n    \
    \    on = false;\n        Console.WriteLine(\"Oil level light OFF\");\n    }\n\
    \    public virtual bool On\n    {\n        get\n        {\n            return\
    \ on;\n        }\n    }\n}\n\npublic class BrakeFluidLight : IWarningLight\n{\n\
    \    private bool on;\n    public virtual void TurnOn()\n    {\n        on = true;\n\
    \        Console.WriteLine(\"Brake fluid light ON\");\n    }\n    public virtual\
    \ void TurnOff()\n    {\n        on = false;\n        Console.WriteLine(\"Brake\
    \ fluid light OFF\");\n    }\n    public virtual bool On\n    {\n        get\n\
    \        {\n            return on;\n        }\n    }\n}\n```\n\nFor the Null Object\
    \ pattern we also create a `NullObjectLight` class that implements the `IWarningLight`\
    \ interface but performs no actual processing:\n\n```csharp\npublic class NullObjectLight\
    \ : IWarningLight\n{\n    public virtual void TurnOn()\n    {\n        // Do nothing...\n\
    \    }\n    public virtual void TurnOff()\n    {\n        // Do nothing...\n \
    \   }\n    public virtual bool On\n    {\n        get\n        {\n           \
    \ return false;\n        }\n    }\n}\n```\n\nNow our client code can be simplified\
    \ since we longer need to test if a slot is `null`, provided we make use of the\
    \ null object:\n\n```csharp\nIWarningLight[] lights = new IWarningLight[3];\n\
    lights[0] = new OilLevelLight();\nlights[1] = new BrakeFluidLight();\nlights[2]\
    \ = new NullObjectLight(); // empty slot\n\n// No need to test for null\nforeach\
    \ (IWarningLight currentLight in lights)\n{\n    currentLight.TurnOn();\n    currentLight.TurnOff();\n\
    \    Console.WriteLine(currentLight.On);\n}\n```\n\nNote that for Null getter\
    \ methods will need to return whatever seems sensible; hence above the `On` property\
    \ getter returns `false` since it represents a non extent.\n\n## Simple Factory\n\
    \nIn the main section of this book we looked at both the Factory Method and the\
    \ Abstract Factory pattern. The Simple Factory pattern is a commonly used means\
    \ of delegating the instantiation of objects to a specific class (the 'factory').\
    \ We shall assume here that Foobar Company manufactures two types of gearbox;\
    \ an automatic gearbox and a manual gearbox. Client programs might need to create\
    \ one or the other based upon a condition, as illustrated by the following code\
    \ (assuming the classes are defined within a class):\n\n```csharp\nGearbox selectedGearbox\
    \ = null;\nif (typeWanted.Equals(\"automatic\"))\n{\n    selectedGearbox = new\
    \ AutomaticGearbox();\n}\nelse if (typeWanted.Equals(\"manual\"))\n{\n    selectedGearbox\
    \ = new ManualGearbox();\n}\n// Do something with selectedGearbox...\n```\n\n\
    While the above code will of course work, what happens if more than one client\
    \ program needs to perform a similar selection? We would have to repeat the `if...else...`\
    \ statements in each client program, and if a new type of gearbox is subsequently\
    \ manufactured we would have to track down every place the `if...else...` block\
    \ is used.\n\nRemember the principle of encapsulating the concept that varies,\
    \ we can instead delegate the selection and instantiation process to a specific\
    \ class, known as the 'factory', just for that purpose. Client programs then make\
    \ use of the `Create()` method of the factory, as illustrated in the diagram below:\n\
    \n![](images/00012.jpg)\nFigure 26.1 : Simple Factory pattern\n\nThe abstract\
    \ `Gearbox` class in our simple example defines a no-argument constructor:\n\n\
    ```csharp\npublic abstract class Gearbox\n{\n    public Gearbox()\n    {\n   \
    \ }\n}\n```\n\nThe `AutomaticGearbox` and `ManualGearbox` classes each extend\
    \ `Gearbox` for their respective types:\n\n```csharp\npublic class AutomaticGearbox\
    \ : Gearbox\n{\n    public AutomaticGearbox()\n    {\n        Console.WriteLine(\"\
    New automaticbox gearbox created\");\n    }\n}\n\npublic class ManualGearbox :\
    \ Gearbox\n{\n    public ManualGearbox()\n    {\n        Console.WriteLine(\"\
    New manual gearbox created\");\n    }\n}\n```\n\nWe now need to create our `GearboxFactory`\
    \ class that is capable of instantiating the appropriate `Gearbox`:\n\n```csharp\n\
    public class GearboxFactory\n{\n    public enum Type\n    {\n        Automatic,\
    \ Manual\n    }\n    public static Gearbox Create(Type type)\n    {\n        if\
    \ (type == Type.Automatic)\n        {\n            return new AutomaticGearbox();\n\
    \        }\n        else\n        {\n            return new ManualGearbox();\n\
    \        }\n    }\n}\n```\n\nThe `Create()` method takes care of the selection\
    \ and instantiation, and thus isolates each client program from repeating code.\
    \ We have made the method `static` purely for convenience; it is not a requirement\
    \ of the pattern.\n\nClient programs now obtain the type of gearbox by means of\
    \ the factory:\n\n```csharp\n// Create an automatic gearbox\nGearbox auto = GearboxFactory.Create(GearboxFactory.Type.Automatic);\n\
    \n// Create a manual gearbox\nGearbox manual = GearboxFactory.Create(GearboxFactory.Type.Manual);\n\
    ```\n\n## Model View Controller\n\nThe Foobar Motor Company's satellite-navigation\
    \ system includes a visual display of the current location, the direction of travel\
    \ and an indication of the current speed. There is also an input device; controls\
    \ where you set the destination, etc. A fully fledged simulation is far beyond\
    \ the scope of this book, so instead we will use a very simplified interface that\
    \ merely lets you set the direction of travel (North, South, West and East) and\
    \ the current speed, without regard to any roads, etc..\n\nThe user interface\
    \ will look like this:\n\n![](images/00029.jpg)\nFigure 27.1 : Satellite navigation\
    \ user interface\n"
