    stores a reference to it as an instance variable. Calls to `Size` and `Turbo` getters
    simply forward to the referenced engine object. Calls to `Diagnose()` will invoke
    a separate thread to run the actual diagnosis. This can be useful if you cannot
    modify the original source for some reason.


    Part IV. Behavioural Patterns


    This part describes the eleven behavioural patterns, that is, those that help
    manage what the classes actually do.


    *   Chain of Responsibility: Avoid coupling the sender of a request to its receiver
    by giving more than one object the chance to handle the request;


    *   Command: Encapsulate a request as an object, thereby letting you parameterise
    clients with different requests;


    *   Interpreter: Define the representation of a language’s grammar;


    *   Iterator: Provide a way to access the elements of an aggregate object sequentially
    without exposing its underlying representation;


    *   Mediator: Define an object that encapsulates how a set of objects interact;


    *   Memento: Capture and externalise an object’s state so that it can be restored
    to that state later;


    *   Observer: Define a one-to-many dependency between objects so that when one
    object changes its state, all of its dependents are notified and updated automatically;


    *   State: Allow an object to alter its behaviour when its internal state changes,
    as if it were a different class;


    *   Strategy: Allow clients to change the algorithm that an object uses to perform
    a function;


    *   Template Method: Define the skeleton of an algorithm in a method, deferring
    some steps to subclasses;


    *   Visitor: Simulate the addition of a method to a class without needing to actually
    change the class.


    14\. Chain of Responsibility


    Type: Behavioural


    Purpose: Avoid coupling the sender of a request to its receiver by giving more
    than one object a chance to handle the request. Chain the receiving objects and
    pass the request along the chain until an object handles it.


    The Foobar Motor Company receives many emails each day, including servicing requests,
    sales enquiries, complaints, and of course the inevitable spam. Rather than employ
    someone specifically to sort through each email to determine which department
    it should be forwarded to, our task is to try and automate this by analysing the
    text in each email and making a "best guess".


    In our simplified example, we will search the text of the email for a number of
    keywords and depending upon what we find will process accordingly. Here are the
    words we will search for and how they should be handled:


    *   If the email contains "viagra", "pills" or "medicines" then it should be forwarded
    to a spam handler;


    *   If the email contains "buy", or "purchase" then it should be forwarded to
    the sales department;


    *   If the email contains "service", or "repair" then it should be forwarded to
    the servicing department;


    *   If the email contains "complain", or "bad" then it should be forwarded to
    the manager;


    *   If the email contains none of the above words then it should be forwarded
    to the general enquiries department.


    Note that only one object needs to handle the request, so if a particular email
    contains both "purchase" and "repair" it will be forwarded to the sales department
    only. The sequence in which to check the keywords is whatever seems most sensible
    for the application; so here we are trying to filter out spam before it reaches
    any other department.


    Now it would be possible, of course, to just have a series of `if...else...` statements
    when checking for the keywords, but that would not be very object-oriented. The
    Chain of Responsibility pattern instead allows us to define separate ''handler''
    objects that all conform to an `EmailHandler` interface. This enables us to keep
    each handler independent and loosely-coupled.


    The following diagram shows the pattern:


    ![](images/00065.jpg)


    Figure 14.1 : Chain of Responsibility pattern


