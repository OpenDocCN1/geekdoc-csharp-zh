  \n你可以看到，任务异步编程模型支持丰富的词汇，用于启动、取消和监控异步操作。这些协议允许你设计一个代表底层异步工作能力的异步 API。当能够有效支持时，请支持这一个或两个可选协议中的。当你无法有效支持时，请不要实现它们，以免误导调用者。\n\
  \n### 事项 34：缓存泛型异步返回类型\n\n每个讨论任务异步编程模型的项目都使用了 `Task` 或 `Task<T>` 类型作为异步代码的返回类型。它们是你处理异步工作返回类型时最常用的类型。然而，`Task`\
  \ 类型有时会在你的代码中引入性能瓶颈。如果你在紧凑循环或热点路径中执行异步调用，对于你的异步方法来说，`Task` 类的分配和使用开销可能很高。C# 7 语言并没有强制你使用\
  \ `Task` 或 `Task<T>` 作为异步方法的返回类型，而是要求带有 `async` 修饰符的方法必须返回符合等待器（Awaiter）模式的类型。它必须有一个可访问的\
  \ `GetAwaiter()` 方法，返回一个实现了 `INotifyCompletion` 和 `ICriticalNotifyCompletion` 接口的对象。该可访问的\
  \ `GetAwaiter()` 方法可以通过扩展方法提供。\n\nNET Framework 的最新版本包含一个新的 `ValueTask<T>` 类型，其使用效率可能更高。该类型是一个值类型，因此不需要额外的分配——这减少了垃圾回收的压力。`ValueTask<T>`\
  \ 类型最适用于异步方法可能会获取缓存结果的用例。\n\n例如，考虑这个检查天气数据的方法：\n\n点击此处查看代码图片\n\n```csharp\npublic\
  \ async Task<IEnumerable<WeatherData>> RetrieveHistoricalData(DateTime start, DateTime\
  \ end)\n{\n    var observationDate = this.startDate;\n    var results = new List<WeatherData>();\n\
  \    while (observationDate < this.endDate)\n    {\n        var observation = await\
  \ RetrieveObservationData(observationDate);\n        results.Add(observation);\n\
  \        observationDate += TimeSpan.FromDays(1);\n    }\n    return results;\n\
  }\n```\n\n按照目前的实现，它每次被调用时都会访问网络。如果此方法是手机应用中每分钟显示一次简要状态的部件的一部分，那么应用程序的运行将非常低效——天气变化并没有那么快。你决定缓存最多\
  \ 5 分钟的 Result。使用 `Task`，该实现看起来如下：\n\n点击此处查看代码图片\n\n```csharp\nprivate List<WeatherData>\
  \ recentObservations = new List<WeatherData>();\nprivate DateTime lastReading;\n\
  public async Task<IEnumerable<WeatherData>> RetrieveHistoricalData()\n{\n    if\
  \ (DateTime.Now - lastReading > TimeSpan.FromMinutes(5))\n    {\n        recentObservations\
  \ = new List<WeatherData>();\n        var observationDate = this.startDate;\n  \
  \      while (observationDate < this.endDate)\n        {\n            var observation\
  \ = await RetrieveObservationData(observationDate);\n            recentObservations.Add(observation);\n\
  \            observationDate += TimeSpan.FromDays(1);\n        }\n        lastReading\
  \ = DateTime.Now;\n    }\n    return recentObservations;\n}\n```\n\n在许多情况下，这种更改将足以提高性能。网络延迟是此代码中影响最大的瓶颈。但现在假设该部件运行在内存极其受限的环境中。在这种情况下，你希望避免每次调用方法时进行对象分配。这时你就会切换到使用\
  \ `ValueTask` 类型。该实现看起来如下：\n\n点击此处查看代码图片\n\n```csharp\npublic ValueTask<IEnumerable<WeatherData>>\
  \ RetrieveHistoricalData()\n{\n    if (DateTime.Now - lastReading > TimeSpan.FromMinutes(5))\n\
  \    {\n        return new ValueTask<IEnumerable<WeatherData>>(recentObservations);\n\
  \    }\n    else\n    {\n        async Task<IEnumerable<WeatherData>> loadCache()\n\
  \        {\n            recentObservations = new List<WeatherData>();\n        \
  \    var observationDate = this.startDate;\n            while (observationDate <\
  \ this.endDate)\n            {\n                var observation = await RetrieveObservationData(observationDate);\n\
  \                recentObservations.Add(observation);\n                observationDate\
  \ += TimeSpan.FromDays(1);\n            }\n        }\n        return new ValueTask<IEnumerable<WeatherData>>(loadCache());\n\
  \    }\n}\n```\n\n\n\n\n本章涵盖了你可以使用不同的库和工具让并行编程变得许多许多方法。这仍然并不容易，但正确地使用更好的工具会让它比以前变得更容易。\n\
  \n## 事项 35：学习 PLINQ 如何实现并行算法\n\n在此项中，我希望我能说并行编程现在就像在所有循环中添加 `AsParallel()` 一样简单。但事实并非如此，不过\
  \ PLINQ 确实让在程序中利用多个核心变得容易得多，同时保持程序的正确性。创建一个利用多核心的程序绝非易事，但 PLINQ 让这项工作变得更简单了。\n\n\
  你仍然需要理解何时必须对数据访问进行同步。你仍然需要衡量 `ParallelEnumerable` 中声明的方法并行版本和顺序执行版本的影响。LINQ 查询涉及的某些方法可以非常容易地并行执行。而另一些方法则强制对元素序列进行更多的顺序访问——或者，至少需要完整的序列（例如\
  \ `OrderBy`）。\n\n让我们通过几个使用 PLINQ 的示例来学习哪些方法是有效的，以及哪些地方存在陷阱。本项的所有示例和讨论都使用 LINQ to\
  \ Objects。类名 `ParallelEnumerable` 甚至特意强调了重点是“Enumerable”，而不是“Queryable”。PLINQ 并不能帮助你将\
  \ LINQ to SQL 或 Entity Framework 算法并行化。这并不是真正的限制性，因为那些实现利用了并行数据库引擎来并行执行查询。\n\n这里有一个使用方法调用语法的简单查询，它从一个由大量整数组成的数据源计算小于\
  \ 150 的值的 *n*!（阶乘）：\n\n点击此处查看代码图像\n\n```cs\nvar nums = data.Where(m => m < 150).\n\
  \    Select(n => Factorial(n));\n```\n\n你只需要通过在查询的第一个方法上添加 `AsParallel()` 将其变为并行查询：\n\
  \n点击此处查看代码图像\n\n```cs\nvar numsParallel = data.AsParallel().\n    Where(m => m <\
  \ 150).Select(n => Factorial(n));\n```\n\n当然，你也可以使用查询语法完成相同的工作：\n\n点击此处查看代码图像\n\n\
  ```cs\nvar nums = from n in data\n           where n < 150\n           select Factorial(n);\n\
  ```\n\n并行版本依赖于对数据序列应用 `AsParallel()`：\n\n点击此处查看代码图像\n\n```cs\nvar numsParallel =\
  \ from n in data.AsParallel()\n                    where n < 150\n             \
  \       select Factorial(n);\n```\n\n结果与方法调用版本相同。\n\n第一个示例非常简单，但它阐述了贯穿整个 PLINQ 的几个重要概念。`AsParallel()`\
  \ 是你调用的用于选择任何查询表达式并行执行的方法。一旦你调用了 `AsParallel()`，后续操作将在使用多个线程在多个核心上进行。`AsParallel()`\
  \ 返回的是一个 `IParallelEnumerable()` 而不是 `IEnumerable()`。PLINQ 实现为 `IParallelEnumerable`\
  \ 的一组扩展方法。它们的签名与扩展 `IEnumerable` 的 `Enumerable` 类中的方法几乎完全相同。只需在参数和返回值中将 `IEnumerable`\
  \ 替换为 `IParallelEnumerable` 即可。这种方法的优势在于 PLINQ 遵循所有 LINQ 提供程序都遵循的模式——这使得 PLINQ 非常易于学习。你关于\
  \ LINQ 的所有通用知识都将适用于 PLINQ。\n\n当然，这并不*完全*那么简单。这个初始查询在 PLINQ 中非常容易：它没有任何共享数据，且结果的顺序并不重要。这些特征意味着处理速度的提高与运行此代码的机器的核心数成正比。为了帮助你从\
  \ PLINQ 中获得最佳性能，有几种方法可以控制如何使用 `IParallelEnumerable` 访问并行任务库函数。\n\n每个并行查询都从一个分区步骤开始。PLINQ\
  \ 需要对输入元素进行分区，并将它们分到为执行查询创建的任务数量上。分区是 PLINQ 最重要的方面之一，因此理解不同的方法是什么、PLINQ 如何决定使用哪种方法以及每种方法如何运作至关重要。\n\
  \n第一个考虑的因素是分区不能花费太多时间。这会导致 PLINQ 库花费过多的时间进行分区，而实际处理你数据的时间太少。PLINQ 使用四种不同的分区算法，基于输入源和你正在创建的查询类型：\n\
  \n- ![图像](img/squf.jpg) 范围分区 (Range partitioning)\n- ![图像](img/squf.jpg) 块分区 (Chunk\
  \ partitioning)\n- ![图像](img/squf.jpg) 条带分区 (Striped partitioning)\n- ![图像](img/squf.jpg)\
  \ 哈希分区 (Hash partitioning)\n\n最简单的算法是范围分区，它根据任务数量划分输入序列。例如，在四核机器上运行的包含 1000 个元素的输入序列，它将创建四个每个\
  \ 250 个元素的范围。范围分区仅在查询源支持索引时使用。这意味着范围分区局限于诸如 `List<T>`、数组以及其他支持 `IList<T>` 接口的序列。\n\
  \n块分区算法为每个任务提供一个“块”输入项，直到任务请求更多工作。块分区算法的内部实现会随时间不断变化，因此我不会深入介绍。你可以预计块的大小开始时很小，因为输入序列可能很小。这防止了一个任务必须处理整个序列的情况。随着工作的进行，块可能会增大。取决于查询中委托的时间成本以及\
  \ `where` 子句拒绝的元素，块的大小也可能会变化。其他两种分区方案针对某些查询操作进行了优化。条带分区是范围分区的一种特例，优化了序列开头元素的处理。每个工作线程通过跳过\
  \ *N* 个元素并处理下一个 *M* 个元素来处理。在处理 *M* 个元素后，工作线程将再次跳过 *N* 个元素。如果你想象条带是一个元素，条带算法最容易理解。在四个工作任务的情况下，一个任务获取索引为\
  \ 0, 4, 8, 12 等元素。第二个任务获取索引为 1, 5, 9, 13 等元素。条带分区避免了跨线程同步来实现整个查询的 `TakeWhile()`\
  \ 和 `SkipWhile()`。此外，该方案允许每个工作线程使用简单的算术移动到它应该处理的下一个项。\n\n哈希分区是一种为带有 `Join`、`GroupJoin`、`GroupBy`、`Distinct`、`Except`、`Union`\
  \ 和 `Intersect` 操作的查询设计的特殊算法。这些是开销较大的操作，特定的分区算法可以实现更高的并行性。哈希分区确保生成相同哈希码的项由同一个任务处理，从而减少这些操作的任务间通信。\n\
  \n与分区算法之外，PLINQ 使用三种不同的算法来并行化代码中的任务：流水线（pipelining）、停止-启动（stop and go）和反枚举（inverted\
  \ enumeration）。流水线是默认算法，让我们先看看它。\n\n\n\n# 流水线 (Pipelining)\n在流水线模式中，由一个线程处理枚举（`foreach`\
  \ 块或查询序列）。多个线程被用于处理序列中每个元素的查询。当请求序列中的每个新项时，它将由不同的线程处理。`PLINQ` 在流水线模式下使用的线程数通常等于\
  \ CPU 核心数（对于大多数 CPU 密集型查询）。在阶乘示例中，它在双核机器上将使用两个线程运行。第一个项将从序列中检索并由一个线程处理。紧接着，将请求第二个项并由第二个线程处理。然后，当其中一个项处理完成时，将请求第三个项，并由该线程处理查询表达式。在整个序列的查询执行过程中，两个线程都会忙于处理查询项。在核心数更多的机器上，会有更多项被并行处理。\n\
  \n例如，在具有 16 个核心的机器上，前 16 个项将立即由 16 个不同的线程处理（假设运行在 16 个不同的核心上）。请注意我稍微简化了说明。实际上，有一个线程专门处理枚举，这通常意味着流水线会创建（核心数\
  \ + 1）个线程。在大多数情况下，枚举线程的大部分时间花在等待上，因此为此目的创建一个额外的线程是合理的。\n\n# 停止-继续算法 (Stop and Go\
  \ Algorithm)\n使用停止-继续算法，启动枚举的线程会等待所有运行查询表达式的线程汇合。这种方法用于你通过 `ToList()` 或 `ToArray()`\
  \ 请求立即执行查询，或者当 `PLINQ` 在继续执行排序等等操作之前需要完整的结果集时。以下两个查询都使用了停止-继续算法：\n\n点击此处查看代码图片\n\
  \n```cs\nvar stopAndGoArray = (from n in data.AsParallel()\n                   \
  \   where n < 150\n                      select Factorial(n)).ToArray();\n\nvar\
  \ stopAndGoList = (from n in data.AsParallel()\n                      where n <\
  \ 150\n                      select Factorial(n)).ToList();\n```\n\n通过使用停止-继续处理，你通常可以更高的内存占用为代价获得略好的性能。在之前的示例中，请注意在执行任何查询表达式之前，已经构建了整个查询。你仍然希望组合整个查询，而不是使用停止-继续算法处理每个部分，然后使用另一个查询来组合最终结果。后者方法通常会导致线程开销抵消任何性能增益。将整个查询表达式作为一个组合操作来处理几乎总是更优的。\n\
  \n# 反转枚举 (Inverted Enumeration)\n并行任务库使用的最终算法是反转枚举。反转枚举并不产生结果，而是对每个查询表达式的结果执行某些操作。早早的示例将阶乘计算的结果打印到控制台上：\n\
  \n点击此处查看代码图片\n\n```cs\nvar numsParallel = from n in data.AsParallel()\n        \
  \              where n < 150\n                      select Factorial(n);\n\nforeach\
  \ (var item in numsParallel)\n    Console.WriteLine(item);\n```\n\nLINQ to Objects（非并行）查询是惰性求值的。这意味着每个值只在被请求时才会产生。在处理查询结果时，你可以选择进入并行执行模型（该模型略有不同）。这就是你请求反转枚举模型的方法：\n\
  \n点击此处查看代码图片\n\n```cs\nvar nums2 = from n in data.AsParallel()\n               \
  \       where n < 150\n                      select Factorial(n);\n\nnums2.ForAll(item\
  \ => Console.WriteLine(item));\n```\n\n反转枚举占用的内存比停止-继续方法少。此外，它允许对你的结果执行并行操作。请注意，如果你想使用\
  \ `ForAll()`，在查询中仍然必须 `AsParallel()`。`ForAll()` 的内存占用比停止-继续模型小。在某些情况下，取决于对查询表达式结果的操作所执行的工作量，反转枚举通常是最快的枚举方法。\n\
  \n## 实现细节\n以下方法方法展示了 `SomeTest` 和 `SomeProjection` 在这些上下文中可能的外观：\n\n```cs\npublic\
  \ static bool SomeTest(this int inputValue)\n{\n    Console.WriteLine($\"testing\
  \ element: {inputValue}\");\n    return true;\n}\n\npublic static string SomeProjection(int\
  \ input)\n{\n    Console.WriteLine($\"projecting an element: {input}\");\n    return\
  \ $\"Delivered {input} at {DateTime.Now:T}\";\n}\n```\n\n\n\n\n查询在对枚举器进行首次调用 `MoveNext()`\
  \ 之前不会开始执行。第一次调用 `MoveNext()` 会对足够的元素执行查询，以检索结果序列中的第一个元素（对于此查询，这恰好是一个元素）。下一次调用 `MoveNext()`\
  \ 将处理输入序列中的元素，直到输出序列中产生下一个项目。使用 LINQ to Objects，每次调用 `MoveNext()` 都会对必要的元素数量执行查询，以产生下一个输出元素。\n\
  \n一旦你将查询更改为并行查询，规则就会发生变化：\n\n点击此处查看代码图片\n\n```cs\nvar answers = from n in ParallelEnumerable.Range(0,\
  \ 300)\n              where n.SomeTest()\n              select n.SomeProjection();\n\
  ```\n\n此查询的输出看起来非常不同。以下是其中一次运行示例（每次运行都会略有不同）：\n\n```\nAbout to start iterating\n\
  testing element: 150\nprojecting an element: 150\ntesting element: 0\ntesting element:\
  \ 151\nprojecting an element: 0\ntesting element: 1\ntesting element: 2\ntesting\
  \ element: 3\ntesting element: 4\ntesting element: 5\ntesting element: 6\ntesting\
  \ element: 7\ntesting element: 8\ntesting element: 9\ntesting element: 10\nprojecting\
  \ an element: 10\ntesting element: 11\ntesting element: 12\ntesting element: 13\n\
  testing element: 14\ntesting element: 15\ntesting element: 16\ntesting element:\
  \ 17\ntesting element: 18\ntesting element: 19\ntesting element: 152\ntesting element:\
  \ 153\ntesting element: 154\ntesting element: 155\ntesting element: 156\ntesting\
  \ element: 157\ntesting element: 20\n... Lots more here elided ...\ntesting element:\
  \ 286\ntesting element: 287\ntesting element: 288\ntesting element: 289\ntesting\
  \ element: 290\nDelivered 130 at 1:50:39 PM\ncalled MoveNext\nDelivered 140 at 1:50:39\
  \ PM\nprojecting an element: 290\ntesting element: 291\ntesting element: 292\ntesting\
  \ element: 293\ntesting element: 294\ntesting element: 295\ntesting element: 296\n\
  testing element: 297\ntesting element: 298\ntesting element: 299\ncalled MoveNext\n\
  Delivered 150 at 1:50:39 PM\ncalled MoveNext\nDelivered 160 at 1:50:39 PM\ncalled\
  \ MoveNext\nDelivered 170 at 1:50:39 PM\ncalled MoveNext\nDelivered 180 at 1:50:39\
  \ PM\ncalled MoveNext\nDelivered 190 at 1:50:39 PM\ncalled MoveNext\nDelivered 200\
  \ at 1:50:39 PM\ncalled MoveNext\nDelivered 210 at 1:50:39 PM\ncalled MoveNext\n\
  Delivered 220 at 1:50:39 PM\ncalled MoveNext\nDelivered 230 at 1:50:39 PM\ncalled\
  \ MoveNext\nDelivered 240 at 1:50:39 PM\ncalled MoveNext\nDelivered 250 at 1:50:39\
  \ PM\ncalled MoveNext\nDelivered 260 at 1:50:39 PM\ncalled MoveNext\nDelivered 270\
  \ at 1:50:39 PM\ncalled MoveNext\nDelivered 280 at 1:50:39 PM\ncalled MoveNext\n\
  Delivered 290 at 1:50:39 PM\n```\n\n点击此处查看代码图片\n\n注意输出发生了巨大的变化。首次调用 `MoveNext()`\
  \ 就会导致 PLINQ 启动所有参与生成结果的线程。这导致产生了相当多（在这种情况下几乎是所有的）结果对象。随后的每次调用 `MoveNext()` 将从这些已经产生的对象中获取下一个项目。你无法预测特定的输入元素何时被处理——你所知道的是只要你请求查询的第一个元素，查询就会立即（在多个线程上）开始执行。\n\
  \n支持查询语法的 PLINQ 方法理解这种行为如何影响查询性能。假设你修改了查询，使用 `Skip()` 和 `Take()` 来选择第二页结果：\n\n点击此处查看代码图片\n\
  \n```cs\nvar answers = (from n in ParallelEnumerable.Range(0, 300)\n           \
  \   where n.SomeTest()\n              select n.SomeProjection()).Skip(10).Take(10);\n\
  ```\n*注：第二个代码块的源代码是碎片化的，我根据 Skip() 和 Take() 的上下文重构了逻辑）*\n\n\n\n\n\n你也可以使用 `WithMergeOptions()`\
  \ 来请求 PLINQ 控制查询期间结果缓冲的方式。通常，PLINQ 在将结果交付给消费者线程之前，会从每个线程缓冲一些结果。你可以请求不进行缓冲以使结果立即可用。或者，你可以请求全缓冲，这将提高性能，但会以更高的延迟为代价。自动缓冲（默认设置）在延迟和性能之间提供了平衡。请注意，缓冲是一个提示，而非要求——PLINQ\
  \ 可能会忽略你的请求。\n\n哪种设置最适合你的情况取决于你的算法。通过在不同的目标机器上更改设置进行实验，看看这些更改是否对你的算法有效。如果你没有几个不同的目标机器来实验，我建议使用默认设置。\n\
  \nPLINQ 让并行计算比过去变得简单得多。对于这些增强来说这是一个重要的时期，因为随着桌面和笔记本电脑上多核普及，并行计算变得越来越重要。尽管如此，并行计算并不容易，设计糟糕的算法可能无法从并行化中获得性能提升。你的任务是寻找可以并行化的循环和其他任务。尝试你的算法的并行版本。测量结果。优化算法以获得更好的性能。意识到某些算法并不容易并行化，并将它们保持串行执行。\n\
  \n### 事项 36：考虑到异常来构建并行算法\n\n第 35 项 完美地忽略了子线程在工作期间可能发生任何问题的可能性。这显然不是现实世界的运作方式。异常会在你的子线程中发生，你不得不去收拾残局。当然，后台线程中的异常在多个方面增加了复杂性。异常不能跨越线程边界继续向调用栈传递。相反，如果异常到达线程启动方法，该线程将终止。调用线程没有方法检索错误或对其采取任何操作。此外，如果你的并行算法必须在出现问题时支持回滚，你将需要更多工作来理解已经发生的任何副作用，以及你应该采取哪些步骤从这些错误中恢复。每个算法都有不同的需求，因此在并行环境中处理异常没有通用的答案。这里提供的指南仅是指南：即你可以使用它们来确定适用于你特定应用程序的最佳策略。\n\
  \n让我们从 第 31 项 中的异步下载方法开始。该方法代表了一种非常简单的策略，因为它没有副作用，且从所有其他 Web 主机的下载可以继续，无需担心失败的那个下载。并行操作使用\
  \ `AggregateException` 类型来处理并行操作中的异常。`AggregateException` 是一个容器，在 `InnerExceptions`\
  \ 属性中持有从任何并行操作生成的所有异常。在这一过程中有不同的方法来处理异常。首先，我们将考虑更通用的情况——即处理外层处理中子任务生成的任何错误。\n\n\
  第 31 项 所示的 `RunAsync()` 方法使用了多个并行操作。因此，你可能会在实际捕获的 `AggregateException` 的 `InnerExceptions`\
  \ 集合中拥有 `AggregateExceptions`。拥有的并行操作越多，这种嵌套就越深。由于并行操作组合方式，你可能会在最终的异常集合中有多个原始异常的副本。在下面的示例中，对\
  \ `RunAsync()` 的调用已修改以处理可能的错误：\n\n点击此处查看代码图像\n\n```csharp\ntry\n{\n    urls.RunAsync(\n\
  \        url => startDownload(url),\n        task => finishDownload(\n         \
  \   task.AsyncState.ToString(), task.Result));\n}\ncatch (AggregateException problems)\n\
  {\n    ReportAggregateError(problems);\n}\n\nprivate static void ReportAggregateError(\n\
  \    AggregateException aggregate)\n{\n    foreach (var exception in aggregate.InnerExceptions)\n\
  \        if (exception is AggregateException agEx)\n            ReportAggregateError(agEx);\n\
  \        else\n            Console.WriteLine(exception.Message);\n}\n```\n\n`ReportAggregateError`\
  \ 方法打印出所有本身不是 `AggregateException` 的异常的消息。当然，这有一个吞掉所有异常的糟糕副作用，无论你是否预料到了它们。这相当危险。相反，你想要做的是只处理那些你可以从中恢复的异常，并抛出任何其他异常。\n\
  \n这里有足够的递归集合，因此使用实用方法是有意义的。泛型方法必须知道你想处理哪些异常类型，哪些是不预期的，以及你如何处理前者。你需要向此方法发送一组异常类型以及处理前者的代码。以下是更新后的\
  \ `0Async`：\n\n```csharp\ntry\n{\n    urls.RunAsync(\n        url => startDownload(url),\n\
  \        task => finishDownload(task.AsyncState.ToString(), task.Result));\n}\n\
  catch (AggregateException problems)\n{\n    var handlers = new Dictionary<Type,\
  \ Action<Exception>>();\n    handlers.Add(typeof(WebException), ex => Console.WriteLine(ex.Message));\n\
  \    if (!HandleAggregateError(problems, handlers))\n        throw;\n}\n```\n\n\
  点击此处查看图像\n\n```csharp\nprivate static bool ReportAggregateError(\n    AggregateException\
  \ aggregate,\n    Dictionary<Type, Action<Exception>> exceptionHandlers)\n{\n  \
  \  foreach (var exception in aggregate.InnerExceptions)\n    {\n        if (exception\
  \ is AggregateException agEx)\n        {\n            if (!HandleAggregateError(agEx,\
  \ exceptionHandlers))\n            {\n                return false;\n          \
  \  }\n            else\n            {\n                continue;\n            }\n\
  \        }\n        else if (exceptionHandlers.ContainsKey(exception.GetType()))\n\
  \        {\n            exceptionHandlersexception.GetType();\n        }\n     \
  \   else\n        {\n            return false;\n        }\n    }\n    return true;\n\
  }\n```\n\n`HandleAggregateError` 方法递归地查看每个异常。如果异常是预期的，则调用处理程序。否则，`HandleAggregateError`\
  \ 返回 false，表示这组异常无法处理。\n\n\n\n\n你可能会疑惑为什么抛出原始的 `AggregateException`，而不是抛出那个没有处理程序的单个异常。问题在于，从集合中仅抛出一个异常可能会丢失重要信息。`InnerExceptions`\
  \ 可能包含任意数量的异常。其中可能有多个异常的类型不是预期的。你必须返回整个集合，否则将面临丢失大量信息的风险。在许多情况下，`AggregateException`\
  \ 的 `InnerExceptions` 集合仅包含一个异常。然而，你不应该那样编写代码，因为当你确实需要那些额外信息时，它们将无处可用。\n\n这种方法感觉有点很陋。难道防止异常离开执行后台工作的任务会更好吗？在几乎所有情况下，那种结果都是较的，但它需要修改运行后台任务的代码，以确保没有异常可以退出后台任务。每当你使用\
  \ `TaskCompletionSource<>` 类时，就意味着永远不要调用 `TrySetException()`，而是确保每个任务都以某种方式调用 `TrySetResult()`\
  \ 来指示完成。为了强制执行这种行为，你需要对下例所示的 `startDownload` 进行修改。当然，正如我们之前提到的，你不应该捕获每一个异常——只需捕获那些你可以恢复的异常。在这个示例中，你可以合理地从\
  \ `WebException` 中恢复，该异常表明远程主机不可用。其他指示更严重问题的异常类型应该继续产生异常并停止所有处理。对 `startDownload`\
  \ 方法的以下更改实现了这些目标：\n\n点击此处查看代码图像\n\n```cc\nprivate static Task<byte[]> startDownload(string\
  \ url)\n{\n    var tcs = new TaskCompletionSource<byte[]>(url);\n    var wc = new\
  \ WebClient();\n    wc.DownloadDataCompleted += (sender, e) =>\n    {\n        if\
  \ (e.UserState == tcs)\n        {\n            if (e.Cancelled)\n              \
  \  tcs.TrySetCancelled();\n            else if (e.Error != null)\n            {\n\
  \                if (e.Error is WebException)\n                    tcs.TrySetResult(new\
  \ byte[0]);\n                else\n                    tcs.TrySetException(e.Error);\n\
  \            }\n            else\n                tcs.TrySetResult(e.Result);\n\
  \        }\n    };\n    wc.DownloadDataAsync(new Uri(url), tcs);\n    return tcs.Task;\n\
  }\n```\n\n一个 `WebException` 会导致返回读取了 0 字节，而所有其他异常都通过正常通道抛出。是的，这意味着你仍然必须处理抛出 `AggregateExceptions`\
  \ 时发生的情况。你可能只需要将这些异常视为致命错误，而让你的后台任务处理所有其他错误。无论如何，你都必须理解 `AggregateExceptions` 是不同类型的异常。\n\
  \n当然，当你使用 LINQ 语法时，后台任务中的错误会产生其他问题。回想 Item 35 中描述的三种不同的并行算法。在所有情况下，使用 PLINQ 都会改变正常的延迟求值，这些变化对你必须如何在\
  \ PLINQ 算法中处理异常具有重要影响。通常，查询只有在其他代码请求查询生成的项时才会执行——但 PLINQ 的工作方式并非完全如此。后台线程在运行时生成结果，另一个任务则构建最终的结果序列。这个过程并不完全是急切求值。查询结果不会立即产生，但产生结果的后台线程将在调度器允许时立即启动——不是立即，但很快。处理这些项中的任何一个都可能产生异常，这意味着你必须更改你的异常处理代码。在典型的\
  \ LINQ 查询中，你可以在查询周围放置 `try`/`catch`：\n\n点击此处查看代码图像\n\n```csharp\nvar nums = from\
  \ n in data\nwhere n < 150\nselect Factorial(n);\n\ntry\n{\n    foreach (var item\
  \ in nums)\n    {\n        Console.WriteLine(item);\n    }\n}\ncatch (InvalidException\
  \ inv)\n{\n    // 省略\n}\n```\n\n### Item 37：使用线程池而不是创建线程\n\n你无法知道为你的应用程序创建线程的最优数量。你的应用程序现在将运行在具有多个核心的机器上，但几乎可以肯定，你今天假设的任何数字在六个月后都会是错误的。此外，你无法控制\
  \ CLR 为其自身任务（如垃圾收集）创建的线程数量。在服务器应用程序（如 ASP.NET 或 REST 服务）中，每个新请求都由不同的线程处理。这种现实使得你作为应用程序或类库开发人员，很难针对目标系统上的正确线程数量进行优化。\n\
  \n然而，.NET 线程池拥有优化目标系统活动线程数量所需的所有知识。此外，如果你为目标机器创建了多的任务和线程，线程池会队列额外的请求，直到有新的后台线程可用。更好的是，基于\
  \ `Task` 的库利用线程池来运行你使用 `Task.Run` 启动的任务。\n\n.NET 线程池代表你执行线程资源管理所需的大部分工作。它以这种方式管理资源，使得当应用程序反复启动后台任务且与这些任务交互不非常紧密时，你可以获得更好的性能。你不应该在应用程序代码中创建线程。相反，你应该使用为你管理线程和线程池的库，例如任务并行库（Task\
  \ Parallel Library）。本文没有极其详尽地涵盖线程池的实现，因为使用线程池的目的是卸载许多工作并将其变为框架的问题。简而言之，线程池中的线程数量会增长，以提供可用线程与最少分配且未使用资源之间的最佳平衡。你提交一个工作项，当线程可用时，它将执行你的线程过程。线程池的工作是确保线程能够快速可用。\n\
  \n\n\n\n线程池还会自动管理任务的结束周期。当任务完成时，线程并不会销毁，而是返回到就绪状态，以便供其他任务使用。根据线程池的需求，这种线程可以承担工作。下一个任务不需要是同一个任务；线程可以执行你的应用程序中考虑的任何长时间运行的方法。你只需调用\
  \ `Task.Run` 并传入另一个目标方法，你的线程池也将为该方法管理工作。\n\n系统会管理线程池中活跃的任务数量。线程池根据可用系统资源的数量来启动任务。如果系统当前运行接近满负荷，线程池将等待启动新任务。相反，如果系统负载较轻，线程池将立即启动额外的任务。你不需要编写自己的负载均衡逻辑；线程池会为你管理这些内容。\n\
  \n你可能认为，最佳任务数应该等于目标机器的核心数。这虽然不是最糟糕的策略，但这种假设在分析上是过于简单的，而且几乎不是最佳答案。等待时间、对 CPU 以外资源的争用以及你无法控制的其他进程都会影响你应用程序的最佳线程数。如果你创建的线程太少，由于核心空闲，你的应用程序将无法获得最佳性能。如果你创建的线程太多，目标机器将花费太多时间来调度线程，而花费太少的时间来执行它们的工作。\n\
  \n为了提供决策提供通用指导，我编写了一个小型应用程序，使用亚历山大广场算法来计算平方根。这个示例仅提供通用指导，因为每个算法都有独特的特性。在这种情况下，核心算法非常简单，不需要与其他线程通信来完成工作。\n\
  \n使用亚历山大广场算法，你首先对一个数的平方根进行猜测。一个简单的初始猜测是 `1`。要找到下一个近似值，你需要找到 `(1)` 当前猜测值与 `(2)` 原始数除以当前猜测值的平均值。例如，要找到\
  \ 10 的平方根，你会猜测为 1。接下来的猜测是 `(1 + (10/1)) / 2`，即 `5.5`。你继续重复这些步骤，直到猜测收敛到答案。以下是代码：\n\
  \n点击此处查看代码图像\n\n```csharp\npublic static class Hero\n{\n    public static double\
  \ FindRoot(double number)\n    {\n        double previousError = double.MaxValue;\n\
  \        double guess = 1;\n        double error = Math.Abs(guess * guess - number);\n\
  \        while (previousError / error > 1.000001)\n        {\n            guess\
  \ = (number / guess + guess) / 2.0;\n            previousError = error;\n      \
  \      error = Math.Abs(guess * guess - number);\n        }\n        return guess;\n\
  \    }\n}\n```\n\n为了对比线程池与手动创建的线程以及单线程版本的应用程序的性能特征，我编写了测试程序，针对该算法执行重复计算：\n\n点击此处查看代码图像\n\
  \n```csharp\nprivate static double OneThread()\n{\n    Stopwatch start = new Stopwatch();\n\
  \    double answer;\n    start.Start();\n    for (int i = LowerBound; i < UpperBound;\
  \ i++)\n        answer = Hero.FindRoot(i);\n    start.Stop();\n    return start.ElapsedMilliseconds;\n\
  }\n\nprivate static async Task<double> TaskLibrary(int numTasks)\n{\n    var itemsPerTask\
  \ = (UpperBound - LowerBound) / numTasks + 1;\n    double answer;\n    List<Task>\
  \ tasks = new List<Task>(numTasks);\n    Stopwatch start = new Stopwatch();\n  \
  \  start.Start();\n    for(int i = LowerBound; i < UpperBound; i+= itemsPerTask)\n\
  \    {\n        tasks.Add(Task.Run(() =>\n        {\n            for (int j = i;\
  \ j < i + itemsPerTask; j++)\n                answer = Hero.FindRoot(j);\n     \
  \   }));\n    }\n    await Task.WhenAll(tasks);\n    start.Stop();\n    return start.ElapsedMilliseconds;\n\
  }\n\nprivate static double ThreadPoolThreads(int numThreads)\n{\n    Stopwatch start\
  \ = new Stopwatch();\n    using (AutoResetEvent e = new AutoResetEvent(false))\n\
  \    {\n        int workerThreads = numThreads;\n        double answer;\n      \
  \  start.Start();\n        for (int thread = 0; thread < numThreads; thread++)\n\
  \            System.Threading.ThreadPool.QueueUserItem((x) =>\n            {\n \
  \               for (int i = LowerBound; i < UpperBound; i++)\n                \
  \    if (i % numThreads == thread)\n                        answer = Hero.FindRoot(i);\n\
  \                    if (Interlocked.Decrement(ref workerThreads) == 0)\n      \
  \                  e.Set();\n            });\n        e.WaitOne();\n        start.Stop();\n\
  \        return start.ElapsedMilliseconds;\n    }\n}\n\nprivate static double ManualThreads(int\
  \ numThreads)\n{\n    Stopwatch start = new Stopwatch();\n    using (AutoResetEvent\
  \ e = new AutoResetEvent(false))\n    {\n        int workerThreads = numThreads;\n\
  \        double answer;\n        start.Start();\n        for (int thread = 0; thread\
  \ < numThreads; thread++)\n        {\n            System.Threading.Thread t = new\
  \ Thread(\n            () =>\n            {\n                for (int i = LowerBound;\
  \ i < UpperBound; i++)\n                    if (i % numThreads == thread)\n    \
  \                    answer = Hero.FindRoot(i);\n                    if (Interlocked.Decrement(ref\
  \ workerThreads) == 0)\n                        e.Set();\n            });\n    \
  \        t.Start();\n        }\n        e.WaitOne();\n        start.Stop();\n  \
  \      return start.ElapsedMilliseconds;\n    }\n}\n```\n\n\n\n\n其次，线程池会为你管理活动线程的数量。如果你创建了太多线程，系统会将它们排队，让它们等待执行，直到有足够的资源。`QueueUserWorkItem`\
  \ 将工作交给线程池中下一个可用的线程，并为你完成一些线程资源管理。如果应用程序线程池中的所有线程都忙了，它会将任务排入队列，等待下一个可用的线程。\n\n随着你越深入这个核心数量不断增加的世界，你就越可能在创建多线程的应用程序。如果你正在在\
  \ .NET 中使用 WCF、ASP.NET 或 .NET remoting 创建服务器端应用程序，那么你已经在创建多线程应用程序了。这些 .NET 子系统都使用线程池来管理线程资源，你也应该这样做。你会发现线程池引入的开销更小，从而带来更好的性能。此外，.NET\
  \ 线程池在管理应当执行工作的活动线程数量方面，比你在应用程序层面管理的得要好得多。\n\n### 项目 38：使用 BackgroundWorker 进行跨线程通信\n\
  \n项目 37 显示了一个使用 `ThreadPool.QueueUserWorkItem` 启动不同数量后台任务的示例。使用此 API 方法非常简单，因为你已经将大多数线程管理问题交给了框架和底层操作系统（OS）。有很多功能你可以可以直接复用，所以当你需要创建执行应用程序任务的后台线程时，`QueueUserWorkItem`\
  \ 应该是你的首选工具。\n\n当然，`QueueUserWorkItem` 对你如何执行工作有几个假设。当你的设计与这些假设不匹配时，你就得做更多工作。在这种情况下，与其使用\
  \ `System.Threading.Thread` 创建自己的线程，不如使用 `System.ComponentModel.BackgroundWorker`。`BackgroundWorker`\
  \ 类构建在 `ThreadPool` 之上，并增加了许多线程间通信的功能。\n\n你必须处理的最重要的问题 `WaitCallback` 中的异常，这是在后台线程中执行工作的方法。如果该方法抛出任何异常，系统将终止你的应用程序。请注意，系统不仅仅是终止那一个后台线程，而是终止整个应用程序。这种行为与其他后台线程\
  \ API 方法的行为是一致的，但区别在于 `QueueUserWorkItem` 没有内置处理错误报告的机制。\n\n此外，`QueueUserWorkItem`\
  \ 没有提供任何允许后台线程与前景线程之间通信的内置方法。它没有提供任何内置手段来帮助你检测完成、跟踪进度、暂停任务或取消任务。当你需要这些功能时，可以转向 `BackgroundWorker`\
  \ 组件，它是构建在 `QueueUserWorkItem` 功能之上的。\n\n`BackgroundWorker` 组件构建在 `System.ComponentModel.Component`\
  \ 类之上，以便提供设计级的支持。尽管如此，`BackgroundWorker` 在不包含设计器支持的代码中也非常有用。事实上，在我使用 `BackgroundWorker`\
  \ 的大多数时候，它并不是表单类中。\n\n`BackgroundWorker` 最简单的用法是创建一个与委托签名匹配的方法，将该方法附加到 `BackgroundWorker`\
  \ 的 `DoWork` 事件，然后调用 `BackgroundWorker` 的 `RunWorkerAsync()` 方法：\n\n点击此处查看代码图像\n\
  \n```csharp\nBackgroundWorker backgroundWorkerExample = new BackgroundWorker();\n\
  \nbackgroundWorkerExample.DoWork += (sender, doWorkEventArgs) =>\n{\n    // 省略工作体\n\
  };\n\nbackgroundWorkerExample.RunWorkerAsync();\n```\n\n在这种模式中，`BackgroundWorker`\
  \ 执行的功能与 `ThreadPool.QueueUserWorkItem` 完全相同。`BackgroundWorker` 类通过使用 `ThreadPool`\
  \ 执行其后台任务，并且在内部使用了 `QueueUserWorkItem`。\n\n`BackgroundWorker` 的强大源于框架已经为这些其他常见场景构建好的功能。`BackgroundWorker`\
  \ 使用事件在前景线程和后台线程之间通信。当前景线程启动请求时，`BackgroundWorker` 在后台线程上引发 `DoWork` 事件。`DoWork`\
  \ 事件处理器读取任何参数并开始执行工作。\n\n当后台线程过程完成（如以 `DoWork` 事件处理器的退出为准），`BackgroundWorker` 在前景线程上引发\
  \ `RunWorkerCompleted` 事件，如图 4.2 所示。在后台线程完成后，前景线程现在可以进行任何必要的后续处理。\n\n![图像](img/04fig02.jpg)\n\
  \n**图 4.2** `BackgroundWorker` 类可以向前景线程中定义的事件处理器报告完成情况。你为完成事件注册事件处理程序，当你的 `DoWork`\
  \ 委托执行完毕时，`BackgroundWorker` 会引发该事件。\n\n除了 `BackgroundWorker` 触发的事件外，还可以操作属性来控制前景和后台线程的交互方式。`WorkerSupportsCancellation`\
  \ 属性告知 `BackgroundWorker` 后台线程知道如何中断操作并退出。`WorkerReportsProgress` 属性告知 `BackgroundWorker`\
  \ 工作过程将定期向前景线程报告进度，如图 4.3 所示。此外，`BackgroundWorker` 将来自前景线程的取消请求转发到后台线程。后台线程过程可以检查\
  \ `CancellationPending` 标记并在必要时停止处理。\n\n![图像](img/04fig03.jpg)\n\n**图 4.3** `BackgroundWorker`\
  \ 类支持多个事件，用于取消当前任务，以及向前景任务报告进度、完成和错误报告。`BackgroundWorker` 定义了协议并引发了支持任何这些通信机制所需的事件。要报告进度，你的后台过程必须引发\
  \ `BackgroundWorker` 上定义的事件。你的前景任务代码必须请求引发这些额外事件，并在这些事件上注册处理器。\n\n最后，`BackgroundWorker`\
  \ 拥套内置协议来报告后台线程中发生的错误。项目 36 解释了异常无法从一个线程抛出到另一个线程。如果后台线程中产生异常且未被线程过程捕获，该线程将被终止。糟糕糟糕，前景线程接收不到任何后台线程已停止处理的通知。`BackgroundWorker`\
  \ 通过在 `DoWorkEventArgs` 中添加 `Error` 属性并将该属性传播到结果参数中的 `Error` 属性，解决了这个问题。此时，你的工作过程可以捕获所有异常并将其设置为错误属性。（这是少数建议捕获所有异常的例外之一。）只需从后台线程过程返回，并在前景结果的事件处理器中处理错误。\n\
  \n\n\n\n\n我之前提到过，我经常在非 `Form` 类中使用 `BackgroundWorker`，甚至在非 Windows Forms 应用程序中（例如服务和\
  \ Web 服务）。这种方法可以正常工作，但它也有一些注意事项。当 `BackgroundWorker` 确定其正在 Windows Forms 应用程序中运行且表单可见时，`ProgressChanged`\
  \ 和 `RunWorkerCompleted` 事件将通过封送控件和 `Control.BeginInvoke` 调度到图形用户界面（GUI）线程（参见项目\
  \ 39）。在其他情况下，这些委托将直接在线程池的空线程上调用——这可能会影响接收事件的顺序。\n\n最后，由于 `BackgroundWorker` 是基于\
  \ `QueueUserWorkItem` 构建的，你可以复用 `BackgroundWorker` 来处理多个后台请求。你需要检查 `BackgroundWorker`\
  \ 的 `IsBusy` 属性来查看 `BackgroundWorker` 当前正在运行任务。当需要多个后台任务并发运行时，你可以创建多个 `BackgroundWorker`\
  \ 对象。每个对象将共享同一个线程池，因此你可以像使用 `QueueUserWorkItem` 一样运行多个任务。在这种情况下，你需要确保你的事件处理程序使用正确的\
  \ `sender` 属性。这种做法确保了后台线程和前景线程之间能够正确通信。\n\n`BackgroundWorker` 支持你在创建后台任务时用到的许多常用模式。通过利用它，你可以在代码中复用该实现，并根据需要添加任何模式。你不需要在前景线程和后台线程之间设计自己的通信协议。\n\
  \n### 项目 39：理解 XAML 环境中的跨线程调用\n\nWindows 控件使用组件对象模型（COM）单线程公寓（STA）模型，因为这些底层控件是公寓线程的。此外，这些控件中的许多操作使用消息泵（message\
  \ pump）。该模型规定，对每个控件的所有函数调用必须在创建该控件的同一个线程上进行。`Invoke`（以及 `BeginInvoke` 和 `EndInvoke`）将方法调用调度到适当线程。这两种模型的底层代码相似，因此此处的讨论将集中在\
  \ Windows Forms API 上。当调用约定不同时，会同时给出两个版本。实现这种模型需要相当复杂的代码，但我们将深入研究它。\n\n首先，让我们来看一段简单的通用代码，当你遇到这种情况时，它会让你的工作变得轻松得多。匿名委托为包装仅在一个上下文中的小的小方法提供了快捷方式。遗憾的是，匿名委托无法用于使用抽象\
  \ `System.Delegate` 类型的方法——例如 `Control.Invoke`：\n\n点击此处查看代码图片\n\n```cs\nprivate\
  \ void UpdateTime()\n{\n    Action action = () => textBlock1.Text =\n        DateTime.Now.ToString();\n\
  \n    if (System.Threading.Thread.CurrentThread !=\n        textBlock1.Dispatcher.Thread)\n\
  \    {\n        textBlock1.Dispatcher.Invoke\n            (System.Windows.Threading.DispatcherPriority.Normal,\n\
  \            action);\n    }\n    else\n    {\n        action();\n    }\n}\n```\n\
  \n在 Windows Forms 中，你使用 `Control.Invoke` 来执行封送：\n\n点击此处查看代码图片\n\n```cs\nprivate\
  \ void OnTick(object sender, EventArgs e)\n{\n    Action action = () =>\n      \
  \  toolStripStatusLabel1.Text =\n        DateTime.Now.ToLongTimeString();\n\n  \
  \  if (this.InvokeRequired)\n        this.Invoke(action);\n    else\n        action();\n\
  }\n```\n\n这种惯用法进一步模糊了事件处理程序的实际逻辑，使得代码的可读性降低且更难以维护。它还引入了一个委托定义，其唯一目的是为抽象委托提供方法签名。\n\
  \n编写一小段通用代码可以简化这个过程。以下 `XAMLControlExtensions` 静态类包含了针对任何最多两个参数的调用委托的泛型方法。你可以通过添加更多参数来增加更多重载。此外，它还包含了使用这些委托定义调用目标的方法，可以是直接调用，也可以通过\
  \ dispatcher 提供的封送调用：\n\n点击此处查看代码图片\n\n```cs\npublic static class XAMLControlExtensions\n\
  {\n    public static void InvokeIfNeeded(\n        this System.Windows.Threading.Dispatcher\
  \ ctl,\n        Action doit,\n        System.Windows.Threading.DispatcherPriority\
  \ priority)\n    {\n        if (System.Threading.Thread.CurrentThread !=\n     \
  \       ctl.Dispatcher.Thread)\n        {\n            ctl.Dispatcher.Invoke(\n\
  \                priority,\n                doit);\n        }\n        else\n  \
  \      {\n            doit();\n        }\n    }\n    public static void InvokeIfNeeded<T>(\n\
  \        this System.Windows.Threading.Dispatcher ctl,\n        Action<T> doit,\n\
  \        T args,\n        System.Windows.Threading.DispatcherPriority priority)\n\
  \    {\n        if (System.Threading.Thread.CurrentThread !=\n            ctl.Dispatcher.Thread)\n\
  \        {\n            ctl.Dispatcher.Invoke(priority,\n            doit, args);\n\
  \        }\n        else\n        {\n            doit(args);\n        }\n    }\n\
  }\n```\n\n你可以为 Windows Forms 控件创建一组类似的扩展方法：\n\n点击此处查看代码图片\n\n```cs\npublic static\
  \ class ControlExtensions\n{\n    public static void InvokeIfNeeded(\n        this\
  \ Control ctl, Action doit)\n    {\n        if (ctl.HandleCreated == false)\n  \
  \          doit();\n        else if (ctl.InvokeRequired)\n            ctl.Invoke(doit);\n\
  \        else\n            doit();\n    }\n    public static void InvokeIfNeeded<T>(this\
  \ Control ctl,\n        Action<T> doit, T args)\n    {\n        if (ctl.HandleCreated\
  \ == false)\n            throw new InvalidOperationException(\n                \"\
  Window handle for ctl has not been created\");\n        else if (ctl.InvokeRequired)\n\
  \            ctl.Invoke(doit, args);\n        else\n            doit(args);\n  \
  \  }\n    // 基于 3 和 4 个参数的版本省略\n    public static void InvokeAsync(\n        this\
  \ Control ctl, Action doit)\n    {\n        ctl.BeginInvoke(doit);\n    }\n    public\
  \ static void InvokeAsync<T>(this Control ctl,\n        Action<T> doit, T args)\n\
  \    {\n        ctl.BeginInvoke(doit, args);\n    }\n}\n```\n\n使用 `InvokeIfNeeded`\
  \ 极大地简化了（可能的）多线程环境下处理事件的代码：\n\n点击此处查看代码图片\n\n```cs\nprivate void OnTick(object sender,\
  \ EventArgs e)\n{\n    this.InvokeAsync(() => toolStripStatusLabel1.Text =\n   \
  \     DateTime.Now.ToLongTimeString());\n}\n```\n\nWPF 版本没有 `InvokeRequired()` 方法调用。相反，你检查当前线程的标识，并将其与所有控件交互应发生的线程进行比较。`DispatcherObject`\
  \ 是许多 WPF 控件的基类；它处理 WPF 控件线程间的调度操作。此外，注意在 WPF 中，你可以为事件处理程序指定优先级。这是因为 WPF 使用两个 UI\
  \ 线程，其中一个处理 UI 渲染流水线，以便 UI 始终能够渲染任何动画或其他操作。你可以指定优先级来控制哪些操作对用户更重要：渲染还是处理特定的后台事件。\n\
  \n\n\n\n示例代码具有几个优点。尽管使用了匿名委托定义，但事件处理程序的逻辑主体是在事件处理程序内部读取的。与在应用程序代码中使用 `dispatcher`\
  \ 重复逻辑相比，它的可读性更高，也更容易维护。在 `WPFControlExtensions` 类内部，泛型方法处理了对 `InvokeRequired` 的检查（或线程身份的比较），这样你就不需要每次都记住它。当我为单线程应用程序编写代码时，不会使用这些方法，但如果我认为我的代码可能会运行在多线程环境中，就会使用这个版本以保持通用性。\n\
  \n在你决定在所有事件处理程序中使用这种惯用法之前，请仔细观察 `InvokeRequired` 所执行的工作。这些调用并不是免费的，不建议简单地在处处应用这种用法。`InvokeRequired`\
  \ 决定当前代码一方面是在创建控件的线程上执行，另一方面是在另一个线程上执行，因此需要进行封送（marshalling）。在大多数情况下，该属性包含一个相当简单的实现。它检查当前线程\
  \ ID 并将其与相关控件的线程 ID 进行比较。如果它们匹配，则不需要 `Invoke`。如果不匹配，则需要 `Invoke`。这种比较并不花费太多时间。\n\
  \n然而，也会出现一些有趣的边界情况。假设相关控件尚未创建。这可能发生在父控件已创建，而当前控件正在实例化过程中。C# 对象存在，但底层的窗口句柄（handle）仍然为\
  \ `null`。在这种情况下，无物可比。框架希望帮助你，而这需要时间。框架会遍历父控件树，查看是否任何一个控件已经创建。如果框架发现一个已创建的窗口，该窗口将用于用作封送窗口。这是一个相当安全的结论，因为父控件负责创建子控件。这种方法保证了子控件将在框架找到的父控件所在的线程上创建。在找到合适的父控件后，框架会执行前面提到的相同检查，将当前线程\
  \ ID 与控件线程 ID 进行比较。\n\n相比之下，如果框架找不到任何已创建的父窗口，框架需要寻找另一种类型的窗口。如果层次结构中没有任何窗口存在，框架将寻找“停车窗口”（parking\
  \ window），这是一种隐藏了 Win32 API 某些奇怪行为的特殊窗口。简要总结这些异常之处，窗口的某些更改需要销毁并重建 Win32 窗口。（修改某些样式需要窗口被销毁并重建。）每当父窗口必须销毁并重建时，停车窗口就会持有子窗口。在那个期间，有一段时间\
  \ UI 线程只能从停车窗口找到。\n\n在 WPF 中，这些行为的某些通过使用 `Dispatcher` 类得到了简化。每个线程都有一个调度器。当你第一次向控件请求其调度器时，库会检查该线程是否有一个调度器。如果有，库将返回该调度器。如果没有，将创建一个新的\
  \ `Dispatcher` 对象并将其与控件及其线程关联。\n\n但仍然存在漏洞和可能的失败源。也许任何窗口都尚未创建——甚至连停车窗口也不在。在这种情况下，`InvokeRequired`\
  \ 始终返回 `false`，表示你不需要将调用封送到另一个线程。这种响应有点是危险的，因为它有错误的可能，但这是框架能提供的最佳结果。你进行的任何需要窗口句柄存在的方法调用都将失败。没有窗口，所以尝试使用它将失败。此外，封送也会失败。如果框架找不到任何封送控件，那么框架就不可能将当前调用封送到\
  \ UI 线程。在这种情况下，框架选择了一个可能的稍后失败，而不是确定的即时失败。幸运的是，这种情况情况在实践中相当罕见。在 WPF 中，`Dispatcher`\
  \ 包含了额外的代码来防止这种情况。\n\n让我们总结一下你关于 `InvokeRequired` 的收获。一旦你的控件被创建，`InvokeRequired`\
  \ 相当快且总是安全的。然而，如果目标控件尚未创建，`InvokeRequired` 可能会花费长得多；如果没有任何控件被创建，`InvokeRequired`\
  \ 需要花费很长时间来给你一个可能是不正确的答案。尽管 `Control.InvokeRequired` 可能有些开销，但它仍然比不必要的 `Control.Invoke`\
  \ 调用要便宜得多。在 WPF 中，某些边界情况已经过优化，工作效果比在 Windows Forms 实现中更好。\n\n现在让我们探索一下 `Control.Invoke`\
  \ 做了什么。（`Control.Invoke` 可以完成很多工作，所以这段讨论被大大简化了。）首先，考虑当即使在与控件相同的线程上运行时你仍调用了 `Invoke`\
  \ 的特殊情况。通过这条短路路径，框架简单地调用你的委托。当 `InvokeRequired()` 返回 `false` 时调用 `Control.Invoke()`\
  \ 意味着你的代码做了一些额外的工作，但它是安全的。\n\n当你实际上需要调用 `Invoke` 时，会出现一个更有趣的情况。`Control.Invoke`\
  \ 通过向目标控件的消息队列发送消息来处理跨线程调用。它创建了一个私有结构，包含了调用委托所需的所有内容——所有参数、调用栈的引用以及委托目标。参数被复制，以避免在调用目标委托之前对其值进行任何修改（记住这是一个多线程世界）。\n\
  \n在创建此结构并将其添加到队列之后，消息被发送到目标控件。然后 `Control.Invoke` 将结合自旋等待（spin-wait）和睡眠（sleep），以等待\
  \ UI 线程处理消息。过程的这部分包含一个时机问题。当目标控件处理 `Invoke` 消息时，它并不是只处理一个委托，而是处理所有的 `Invoke` 委托。如果你始终使用同步版本的\
  \ `Control.Invoke`，你就不会看到副作用。然而，如果你混合使用 `Control.Invoke` 和 `Control.BeginInvoke()`，你会看到不同的行为。我们将在本项目的结束时回到这个问题，但现在请理解，控件的\
  \ `WndProc` 在处理*任何* `Invoke` 消息时都会处理*所有* `Invoke` 消息。在 WPF 中你有更多的控制权，因为你可以控制异步操作的优先级。具体来说，你可以指示调度器根据\
  \ (1) 系统或应用程序条件、(2) 正常顺序或 (3) 高优先级消息来队列处理消息。\n\n当然，这些委托可能会抛出异常，而异常无法跨线程边界。控件将对委托调用封装在\
  \ `try/catch` 块中并捕获所有异常。任何异常都会复制到结构中，在 UI 线程完成处理后在工作线程中检查。\n\n在 UI 线程处理完成后，`Control.Invoke`\
  \ 会查找从 UI 线程抛出的异常。如果发现异常，`Invoke` 将后台线程上重新抛出异常。如果没有异常，则继续正常处理。如所见，调用一个方法需要大量的处理。\n\
  \n`Control.Invoke` 在封送调用被处理期间会阻塞后台线程。它给出了同步行为的假象，尽管涉及到多个线程。\n\n\n\n有时，这种行为可能并不是你的应用程序所需要的。例如，如果工作线程触发了进度事件，你可能希望工作线程继续处理，而不是等待\
  \ UI 的同步更新。在这种情况下，你应该使用 `BeginInvoke`。该方法执行的许多处理与 `Control.Invoke` 相同。然而，在将消息发送到目标控件后，`BeginInvoke`\
  \ 会立即返回，而无需等待目标委托执行完毕。`BeginInvoke` 允许你发布一条消息供日后处理，并立即释放调用线程的阻塞。你可以向 `ControlExtensions`\
  \ 类添加相应的泛型异步方法，以便更方便地以异步方式处理跨线程 UI 调用。虽然你从这些方法中获得的益处比之前的方法要少，但为了保持一致性，让我们它们添加到 `ControlExtensions`\
  \ 类中：\n\n点击此处查看代码图片\n\n```csharp\npublic static void QueueInvoke(this Control ctl,\
  \ Action doit)\n{\n    ctl.BeginInvoke(doit);\n}\n\npublic static void QueueInvoke<T>(this\
  \ Control ctl,\n    Action<T> doit, T args)\n{\n    ctl.BeginInvoke(doit, args);\n\
  }\n```\n\n`QueueInvoke` 方法没有先测试 `InvokeRequired`，因为即使你当前正在 UI 线程上执行，可能想要异步调用某个方法。`BeginInvoke()`\
  \ 会处理这些工作。`Control.Invoke` 将消息发布到控件并返回。目标控件在下次检查消息队列时会处理该消息。如果在 UI 线程上调用 `BeginInvoke`，它并不是真正的异步。相反，处理仍然是同步的——只是在当前操作后的某个时间执行了该操作。\n\
  \n此讨论忽略了 `BeginInvoke` 返回的 `Async` 结果。在实践中，UI 更新很少有——这一因素使得异步处理这些消息变得容易得多。只需调用 `BeginInvoke`，并期望委托方法在之后的某个时间被调用即可。你需要防御性地编写这些委托方法，因为任何异常在跨线程封送过程中都会吞掉。\n\
  \n在我们完成此项内容之前，让我们清理控件 `WndProc` 内部的一个遗留问题。记住，当 `WndProc` 接收到 `Invoke` 消息时，`WndProc`\
  \ 会处理 `QueueInvoke` 中的每一个委托。如果你期望事件按特定顺序处理，并且混合使用了 `Invoke` 和 `BeginInvoke`，可能会遇到时机问题。你可以保证由\
  \ `Control.BeginInvoke`（或 `Control.Invoke`）调用的委托是它们接收到的顺序被处理的。`BeginInvoke` 将委托添加到队列中。任何对\
  \ `Control.Invoke` 的后续调用将处理队列上的所有消息，包括之前通过调用 `BeginInvoke()` 添加的消息。在“之后的某个时间”处理委托意味着你无法控制“之后的某个时间”究竟何时发生。在“现在”处理委托意味着应用程序处理所有等待中的的异步委托，然后再处理这一个。潜在地，`BeginInvoke`\
  \ 的某个等待中的委托目标可能会在你的 `Invoke` 委托被调用之前改变了程序状态。你需要防御性地编写代码，并确保在委托内部重新检查程序状态，而不是依赖于调用\
  \ `Control.Invoke` 时过去某个时刻传递的状态。\n\n非常简单，原始处理程序的的这个版本很少显示额外的文本：\n\n点击此处查看代码图片\n\n\
  ```csharp\nprivate void OnTick(object sender, EventArgs e)\n{\n    this.InvokeAsync(()\
  \ => toolStripStatusLabel1.Text =\n        DateTime.Now.ToLongTimeString());\n \
  \   toolStripStatusLabel1.Text += \"  And set more stuff\";\n}\n```\n\n该代码通过队列化来调用了第一次更改，而该更改在处理下一条消息时才会完成。那是在向标签添加更多文本的下一个语句之后。\n\
  \n`Invoke` 和 `InvokeRequired` 确实为你做了很多工作。所有这些工作都是必要的，因为 Windows Forms 控件是构建在单线程单元模型（STA）之上的。这种遗留行为在新的\
  \ WPF 库中仍然存在。在所有新的 .NET Framework 代码之下，Win32 API 和窗口消息仍然潜伏其中。那种消息传递和线程封送可能会导致意外的行为。你需要理解这些方法的作用，并根据它们的行为进行工作。\n\
  \n### 第 40 项：将 lock() 作为你同步的首选方案\n\n线程之间需要相互通信。因此，你需要为应用程序中的各种线程提供一种安全的方法来发送和接收数据。然而，在线程之间共享数据会引入以同步问题形式出现的数据完整性错误风险。为了避免由于这些错误导致的潜在问题，你需要确保每个共享数据项的当前状态是一致的。你可以通过使用同步原语来保护对共享数据的访问来实现这种安全性。同步原语确保当前线程在完成一组关键操作之前不会被中断。\n\
  \n.NET BCL 中提供了许多原语，你可以使用它们来安全地确保对共享数据的访问是同步的。只有其中一对——`Monitor.Enter()` 和 `Monitor.Exit()`——在\
  \ C# 语言中被赋予了特殊地位。`Monitor.Enter()` 和 `Monitor.Exit()` 实现临界区块。临界区是一种常用的同步技术，C# 语言设计者以\
  \ `lock()` 语句的形式增加了对它们的支持。你应该遵循他们的做法，将 `lock()` 成为你的主要工具。\n\n原因很简单：编译器会生成一致的代码，但人类会出错。C#\
  \ 语言引入了 `lock` 关键字来控制多线程程序。`lock` 语句生成的代码与你使用 `Monitor.Enter()` 和 `Monitor.Exit()`\
  \ 完全相同。此外，它更容易，并且会自动生成你所需的异常安全代码。\n\n然而，在两种情况下 `Monitor` 给了你 `lock` 无法提供的控制。首先，`lock`\
  \ 是词法作用域。因此，你不能在一个作用域进入 `Monitor` 在另一个作用域退出它（使用 `lock` 语句时）。这意味着你不能在一个方法中进入 `Monitor`\
  \ 并在方法内的 Lambda 表达式中退出（参见第 42 项\n\n```csharp\npublic int TotalValue\n{\n    get\n\
  \    {\n        lock (syncHandle) { return total; }\n    }\n}\n\npublic void IncrementTotal()\n\
  {\n    lock (syncHandle) { total++; }\n}\n```\n\n`lock` 语句获取对象的排斥锁，并确保在释放锁之前其他线程无法访问该对象。使用\
  \ `lock()` 的示例代码生成的行为与以下使用 `Monitor.Enter()` 和 `Monitor.Exit()` 的版本相同：\n\n点击此处查看代码图片\n\
  \n```csharp\npublic void IncrementTotal()\n{\n    object tmpObject = syncHandle;\n\
  \    System.Threading.Monitor.Enter(tmpObject);\n    try\n    {\n        total++;\n\
  \    }\n    finally\n    {\n        System.Threading.Monitor.Exit(tmpObject);\n\
  \    }\n}\n```\n\n`lock` 语句提供了许多检查，可以帮助你避免常见错误。例如，它会检查被锁类型是否为引用类型而非值类型。`Monitor.Enter`\
  \ 方法不包含此类保护。以下使用 `lock()` 的例程序无法编译：\n\n点击此处查看代码图片\n\n```csharp\npublic void IncrementTotal()\n\
  {\n    lock (total) // 编译错误：不能锁定值类型\n    {\n        total++;\n    }\n}\n```\n\n\n\
  \n但此例的操作如下：\n\n点击此处查看代码图像\n\n```csharp\npublic void IncrementTotal()\n{\n    //\
  \ 并没有锁住 total，而是\n    // 锁住包含 total 的盒子\n    Monitor.Enter(total);\n    try\n  \
  \  {\n        total++;\n    }\n    finally\n    {\n        // 可能会抛出异常\n        //\
  \ 解锁另一个包含 total 的盒子\n        Monitor.Exit(total);\n    }\n}\n```\n\n`Monitor.Enter()`\
  \ 能够编译是因为它的官方签名接收一个 `System.Object`。你可以通过装箱（boxing）将 `total` 强制转换为对象。`Monitor.Enter()`\
  \ 实际上锁定的是包含 `total` 的盒子——这正是第一个 bug 潜伏的地方。假设线程 1 进入 `IncrementTotal()` 并获取了锁。然后，在递增\
  \ `total` 时，第二个线程调用了 `IncrementTotal()`。线程 2 现在进入 `IncrementTotal()` 并获取了锁。它成功获取了不同的锁，因为\
  \ `total` 被放入了不同的盒子中。线程 1 拥有一个包含 `total` 值的盒子的锁；线程 2 拥有另一个包含 `total` 值的盒子的锁。你写了额外的代码，但没有任何同步机制。\n\
  \n接着你会被第二个 bug 坑害：当任何一个线程尝试释放 `total` 的锁时，`Monitor.Exit()` 方法会抛出 `SynchronizationLockException`。该异常的产生是因为\
  \ `total` 进入了另一个盒子，以强制转换为 `Monitor.Exit` 的方法签名（该签名也期望 `System.Object` 类型）。当你释放这个盒子的锁时，你解锁的是一个与加锁时使用的不同的资源。`Monitor.Exit()`\
  \ 执行失败并抛出异常。\n\n当然，某些聪明的灵魂可能会尝试这样做：\n\n点击此处查看代码图像\n\n```csharp\npublic void IncrementTotal()\n\
  {\n    // 同样不起通：\n    object lockHandle = total;\n    Monitor.Enter(lockHandle);\n\
  \    try\n    {\n        total++;\n    }\n    finally\n    {\n        Monitor.Exit(lockHandle);\n\
  \    }\n}\n```\n\n这个版本没有抛出任何异常，但它也没有提供任何同步保护。每次调用 `IncrementTotal()` 都会创建一个新盒子并获取该对象的锁。每个线程都成功立即获取了锁，但那并不是对共享资源的锁。每个线程都赢了，但\
  \ `total` 并不是一致的。\n\n`lock` 语句还防止了更微妙的错误。`Enter()` 和 `Exit()` 是两个独立的调用，所以你很容易犯下获取和释放不同对象的错误。这种操作可能会产生\
  \ `SynchronizationLockException`。然而，如果你恰好有一个类型锁了多个同步对象，那么就有可能在一个线程中获取两个不同的锁，并在临界区结束时释放错误的锁。\n\
  \n`lock` 语句会自动生成异常安全的代码——这是我们许多人类经常忘记做到的事情。此外，它生成的代码比 `Monitor.Enter()` 和 `Monitor.Exit()`\
  \ 更高效率，因为它只需要评估一次目标对象。由于所有这些原因，默认情况下，你应该使用 `lock` 语句来处理 C# 程序中的同步需求。\n\n尽管如此，存在一个局限性，是因为\
  \ `lock` 生成了与 `Monitor.Enter( )` 相同的 MSIL——即 `Monitor.Enter()` 会无限期等待以获取锁，因此你引入了可能的死锁条件。在大型企业系统中，在尝试访问关键资源时可能需要更具防御性。`Monitor.TryEnter(\
  \ )` 允许你为操作指定超时时间，并在无法访问资源时尝试解决方案。\n\n点击此处查看代码图像\n\n```csharp\npublic void IncrementTotal()\n\
  {\n    if (!Monitor.TryEnter(syncHandle, 1000)) // 等待 1 秒\n        throw new ResourceException(\"\
  无法进入临界区\");\n\n    try\n    {\n        total++;\n    }\n    finally\n    {\n   \
  \     Monitor.Exit(syncHandle);\n    }\n}\n```\n\n你可以将这种技术封装在一个实用的泛型类中：\n\n点击此处查看代码图像\n\
  \n```csharp\npublic sealed class LockHolder<T> : IDisposable where T : class\n{\n\
  \    private T handle;\n    private bool holdsLock;\n\n    public LockHolder(T handle,\
  \ int milliTimeout)\n    {\n        this.handle = handle;\n        if (!Monitor.TryEnter(this.handle,\
  \ milliTimeout))\n        {\n            throw new ResourceException(\"无法进入临界区\"\
  );\n        }\n        holdsLock = true;\n    }\n\n    public bool LockSuccessful\n\
  \    {\n        get { return holdsLock; }\n    }\n\n    public void Dispose()\n\
  \    {\n        if (holdsLock)\n        {\n            Monitor.Exit(this.handle);\n\
  \            holdsLock = false;\n        }\n    }\n}\n```\n\n你可以以如下方式使用此类：\n\n点击此处查看代码图像\n\
  \n```csharp\nobject lockHandle = new object();\nusing (LockHolder<object> lockObj\
  \ = new LockHolder<object>(lockHandle, 1000))\n{\n    if (lockObj.LockSuccessful)\n\
  \    {\n        // 在此处执行工作\n    }\n}\n```\n\nC# 团队以 `lock` 语句的形式为 `Monitor.Enter()`\
  \ 和 `Monitor.Exit()` 对引入了隐式支持，因为它是大多数同步问题的最佳选择。\n\n\n\n\n\n```csharp\nSystem.Threading.Interlocked.Increment(ref\
  \ total);\n```\n\n`Interlocked` 类包含其他用于处理内置数据类型的方法。`Interlocked.Decrement()` 减少一个值。`Interlocked.Exchange()`\
  \ 将一个值替换为新值并返回当前值。你可以使用 `Interlocked.Exchange()` 来设置新状态并返回之前的状态。例如，假设你想存储最后一次访问资源的用户\
  \ ID。你可以调用 `Interlocked.Exchange()` 在存储当前用户 ID 的同时，获取上一个用户 ID。\n\n最后，还有 `CompareExchange()`\
  \ 方法，它读取一段共享数据的值，如果该值与目标值匹配，则更新它。否则，什么都不会发生。在任一种情况下，`CompareExchange` 都会返回存储在该位置的原始值。项目\
  \ 41(#ch04.xhtml_ch04lev1sec7) 展示了如何使用 `CompareExchange` 在类内部创建一个私有的锁对象。\n\n`Interlocked`\
  \ 类和 `lock()` 并不是所有可同步原语。`Monitor` 类还包括 `Pulse` 和 `Wait` 方法，你可以使用它们来实现生产者/消费者设计。对于那些许多线程访问值而极少数线程修改值的设计，你也可以使用\
  \ `ReaderWriterLockSlim` 类。`ReaderWriterLockSlim` 比较早版本的 `ReaderWriterLock` 有若干改进，因此你应该在所有新开发工作中使用\
  \ `ReaderWriterLockSlim`。\n\n对于大多数常见的同步问题，请检查 `Interlocked` 类，看看是否可以使用它提供你所需的功能。对于许多单项操作，是可以这样做的。否则，你的首选是\
  \ `lock()` 语句。只有当你需要特殊用途的锁定能力时，才考虑这些选项之外。\n\n### 项目 41：锁句柄使用尽可能小的范围\n\n当你编写并发程序时，你希望尽可能地将同步原语局部化。应用程序中可以使用同步原语的地方越多，避免死锁、漏锁或其他并发编程问题就越越困难。这是一个规模问题：你需要查看的地方越多，发现某个特定问题就越越困难。\n\
  \n在面向对象的编程中，你通过使用私有成员变量来最小化——而不是消除——你需要搜索状态更改的位置数量。在并发程序中，你想做同样的事情，通过将你用于提供同步的对象局部化来实现。\n\
  \n从这个角度来看，最广泛使用的两种锁定技术都是非常糟糕的选择。`lock(this)` 和 `lock(typeof(MyType))` 会产生糟糕的副作用，即基于公开访问的实例创建你的锁对象。\n\
  \n假设你写了这样的代码：\n\n```csharp\npublic class LockingExample\n{\n    public void MyMethod()\n\
  \    {\n        lock (this)\n        {\n            // Elided\n        }\n    }\n\
  \    // Elided\n}\n```\n\n现在假设你的客户端之一——我们叫他 Alexander——发现他需要锁定某些东西。Alexander 写了以下代码：\n\
  \n点击此处查看代码图像\n\n```csharp\nLockingExample x = new LockingExample();\nlock (x)\n\
  \    x.MyMethod();\n```\n\n那种锁定策略很容易导致死锁。客户端代码已经获取了 `LockingExample` 对象的锁。在 `MyMethod`\
  \ 内部，你的代码又获取了该对象的另一个锁。这完全没问题，但很快某一天，不同的线程会从程序的某个地方锁定 `LockingExample` 对象。死锁问题发生了，而且没有好的方法找到锁是在哪里获取的。它可能在任何地方。\n\
  \n为了避免这个问题，你需要更改你的锁定策略。为此目的有三种策略可用。\n\n首先，如果你在保护整个方法，可以使用 `MethodImplAttribute`\
  \ 来指定该方法是同步的：\n\n点击此处查看代码图像\n\n```csharp\n[MethodImpl(MethodImplOptions.Synchronized)]\n\
  public void IncrementTotal()\n{\n    total++;\n}\n```\n\n当然，这并不是最常见的做法。\n\n其次，你可以强制开发者只能对当前类型或当前对象创建锁。换句话说，你建议所有人使用\
  \ `lock(this)` 或 `lock(MyType)`。这种策略将会生效——如果每个人都遵循你的建议的话。它依赖于世界上所有的客户端都知道他们永远无法锁定当前对象或当前类型以外的任何东西。它会失败，因为无法强制执行。\n\
  \n第三，也是最好的选择，你可以创建一个用于保护对对象共享资源访问的句柄。该句柄是一个私有成员变量，因此无法在使用的类型之外访问。通过这种方式，你可以确保用于同步访问的对象是私有的，并且不会被任何非私有属性访问。这种策略确保了给定对象上的任何锁原语都局限于给定位置。\n\
  \n在实践中，你会创建一个 `System.Object` 类型的变量作为同步句柄。然后当你需要保护类的任何部分时，可以锁定该句柄。\n\n这里是实现这些目标的简单代码：\n\
  \n点击此处查看代码图像\n\n```csharp\nprivate object syncHandle = new object();\npublic void\
  \ IncrementTotal()\n{\n    lock (syncHandle)\n    {\n        // Elided\n    }\n\
  }\n```\n\n你可能会发现你很少需要锁，因此你倾向于在实际需要时才创建同步对象。在这些情况下，你可以让同步句柄变得复杂一点：\n\n点击此处查看代码图像\n\
  \n```csharp\nprivate object syncHandle;\nprivate object GetSyncHandle()\n{\n   \
  \ System.Threading.Interlocked.CompareExchange(ref syncHandle, new object(), null);\n\
  \    return syncHandle;\n}\n\npublic void AnotherMethod()\n{\n    lock (GetSyncHandle())\n\
  \    {\n        // Elided\n    }\n}\n```\n\n`syncHandle` 对象用于控制对你类中任何共享资源的访问。私有方法\
  \ `GetSyncHandle()` 返回作为同步目标的单一对象。`CompareExchange` 调用不可中断的，它确保了你只创建了一份同步句柄副本。它将\
  \ `syncHandle` 的值与 `null` 进行比较。如果结果为 `null`，则 `CompareExchange` 会创建一个新对象并将该对象分配给\
  \ `syncHandle`。\n\n该讨论涵盖了可能对实例方法进行的任何锁定，但静态方法呢？相同的技术适用，但你会创建一个静态同步句柄，以便该类的所有实例共享同一个同步句柄。\n\
  \n当然，你可以锁定比单个方法更小的代码段。你可以在方法内部的任何代码段周围创建同步块（或者，在属性访问器或索引器中）。无论范围如何，你都需要采取措施来最小化锁定代码的范围。\n\
  \n点击此处查看代码图像\n\n```csharp\npublic void YetAnotherMethod()\n{\n    DoStuffThatIsNotSynchronized();\n\
  \    int val = RetrieveValue();\n    lock (GetSyncHandle())\n    {\n        // Elided\n\
  \    }\n    DoSomeFinalStuff();\n}\n```\n\n\n\n\n如果你决定在 lambda 表达式内部创建或使用锁（lock），务必格外小心。C#\
  \ 编译器为 lambda 表达式创建一个闭包（closure）。这种行为结合 C# 3.0 构造支持的延迟执行模型，意味着开发者很难确定锁的词法作用域（lexical\
  \ scope）何时结束。因此，这种方法更容易引发死锁问题——开发者可能无法确定代码是否处于锁定范围内。\n\n其他几条指南可以帮助你更有效地使用锁。如果你发现需要为类中的不同值创建不同的锁句柄（locking\
  \ handles），这强烈表明你应该将当前类拆分为多个类。简单来说，你的类正试图做太多的事情。如果你需要保护对某些变量的访问，并使用其他锁来保护类中的其他变量，这强烈表明你应该将类拆分为具有不同职责的不同类型。如果你将每个类型视为一个单一单元，控制同步将变得容易得多。每个持有共享数据（必须由不同线程访问或更新的数据）的类都应该使用单一同步句柄来保护对这些共享资源的访问。\n\
  \n当你决定锁定什么时，请选择一个对任何调用者不可见的私有字段。不要对公共可见的对象加锁。锁定公共可见的对象要求所有开发者始终如一地遵循相同的做法，而且这会让客户端代码容易地引入死锁问题。\n\
  \n### 项目 42：避免在锁定区域内调用未知代码\n\n在连续体的一端是由于加锁不足引起的问题。接着，当你开始创建锁时，下一个最可能的问题就是你可能会产生死锁。当一个线程在等待另一个线程完成时被阻塞，而第二个线程同时在等待第一个线程完成时，就会发生死锁。在\
  \ .NET Framework 中，存在一种特殊情况，即跨线程调用通过某种方式进行封送（marshalled），以模拟同步调用。因此，当仅有一个资源被锁定时，两个线程也可能导致死锁。（项目\
  \ 39 演示了其中这样一种情况。）\n\n你已经学习了避免这种问题的最简单的方法之一：项目 40 讨论了如何使用私有不可见数据成员作为锁的目标，以使应用程序中的锁定代码局部化。此外，还有其他引入死锁的方法。如果你在代码的同步区域内部调用未知代码，就会引入另一个线程导致你的应用程序死锁的可能性。\n\
  \n例如，假设你编写了类似下面的代码来处理后台操作：\n\n点击此处代码图像\n\n```csharp\npublic class WorkerClass\n\
  {\n    public event EventHandler<EventArgs> RaiseProgress;\n\n    private object\
  \ syncHandle = new object();\n\n    public void DoWork()\n    {\n        for (int\
  \ count = 0; count < 100; count++)\n        {\n            lock (syncHandle)\n \
  \           {\n                System.Threading.Thread.Sleep(100);\n           \
  \     progressCounter++;\n                RaiseProgress?.Invoke(this, EventArgs.Empty);\n\
  \            }\n        }\n    }\n\n    private int progressCounter = 0;\n    public\
  \ int Progress\n    {\n        get\n        {\n            lock (syncHandle)\n \
  \               return progressCounter;\n        }\n    }\n}\n```\n\n`raiseProgress()`\
  \ 方法通知所有监听器更新的进度。请注意，任何监听器都可以注册以处理该事件。在多线程程序中，典型的事件处理程序可能像这样：\n\n点击此处代码图像\n\n```csharp\n\
  static void engine_RaiseProgress(object sender, EventArgs e)\n{\n    WorkerClass\
  \ engine = sender as WorkerClass;\n    if (engine != null)\n        Console.WriteLine();\n\
  }\n```\n\n现在，假设该应用程序是 Windows Forms，并且你需要将事件封送回 UI 线程。项目 38 显示了 `Control.Invoke`\
  \ 如何将调用封送到 UI 线程。这种方法之所以有效，但仅仅是因为你运气好。\n\n根源问题是你尝试重新获取锁。因为你无法知道控制之外的代码可能会采取哪些操作，所以你应该尝试避免从锁定区域内部调用回调。在这个示例中，这意味着你必须在区域外部触发进度报告事件：\n\
  \n点击此处代码图像\n\n```csharp\npublic void DoWork()\n{\n    for (int count = 0; count\
  \ < 100; count++)\n    {\n        lock (syncHandle)\n        {\n            System.Threading.Thread.Sleep(100);\n\
  \            progressCounter++;\n        }\n    }\n    RaiseProgress?.Invoke(this,\
  \ EventArgs.Empty);\n}\n```\n\n`Progress` 访问器锁定了同一个句柄。从局部上下文来看这看起来是，但实际上不是。表 4.1\
  \ 显示了调用栈，它说明了为什么调试这些问题很困难。\n\n表 4.1 在后台线程与更新显示的前线程之间封送代码的调用栈\n\n| 方法 | 线程 |\n| :---\
  \ | :--- |\n| `DoWork` | 后台线程 |\n| `raiseProgress` | 后台线程 |\n| `OnUpdateProgress`\
  \ | 后台线程 |\n| `engine_UpdateProgress` | 后台线程 |\n| `Control.Invoke` | 后台线程 |\n| `UpdateUI`\
  \ | UI 线程 |\n| `Progress (属性访问)` | UI 线程 (死锁) |\n\n现在你已经了解了这个问题，是时候确保你理解了未知代码渗透到你应用程序中的各种方式了。显然，引发任何公开访问的事件都是回调。调用作为参数传递或通过公共\
  \ API 设置的委托也是回调。调用作为参数传递的 lambda 表达式也可能调用了未知代码（参见《Effective C#》第三版中的项目 7）。\n\n这些未知代码来源相当容易发现。但在大多数类中隐藏着另一个可能的未知代码来源：虚方法。你调用的任何虚方法都可以被派生类重写。派生类反过来可以调用类中的任何方法（公共或保护的）。这些调用中的任何一个都可能尝试再次锁定共享资源。\n\
  \n\n\n无论发生什么，这种模式都是相似的：你的类获取了一个锁。然后，在仍在同步区域内时，它调用了一个执行你无法控制的代码的方法。该客户端代码由一组开放的代码组成，这些代码最终可能会追溯到你的类，甚至在另一个线程中进行。你无法做任何事情来防止这些开放代码执行可能恶意的操作。相反，你必须防止这种情况的发生：不要在代码的加锁区域内部调用未知的代码。\n\
  \n## 5. 动态编程\n\n静态类型和动态类型各有优劣。动态类型可以提供更快的开发速度，并更易与异构系统进行互操作性。静态类型使编译器能够发现一类错误。由于编译器可以进行这些检查，运行时检查就可以被精简，从而获得更好的性能。`C#`\
  \ 是一门静态类型语言，并且未来也将保持如此。然而，在动态语言可以提供更高效解决方案的时刻，`C#` 提供了动态特性。这些特性允许你在有需要时在静态类型和动态类型之间切换。静态类型提供的丰富功能意味着你大部分的\
  \ `C#` 代码将是静态类型的。本章将重点介绍适用于动态编程的问题，以及你将用来最有效地解决这些问题的技术。\n\n### 事项 43：理解动态类型的优缺点\n\
  \n`C#` 对动态类型的支持旨在提供通往其他位置的桥梁。它并不是为了鼓励通用的动态语言编程，而是为了在 `C#` 相关的强静态类型与使用动态类型模型的环境之间提供平滑的过渡。\n\
  \n当然，这并不意味着你应该将对动态类型的使用限制在与其他环境的互操作上。`C#` 类型可以强制转换为动态对象并被视为动态对象。像这个世界上其他任何事情一样，将\
  \ `C#` 对象视为动态对象既有优点也有坏处。让我们来看一个例子看看发生了什么。\n\n`C#` 泛型的局限性之一是，访问 `System.Object` 定义之外的方法，你需要指定约束（constraints）。此外，这些约束必须以基类、一组接口，或者针对引用类型、值类型和公共无参构造函数的特殊约束的形式存在。你无法指定某个已知方法是可用的。当你创建一个依赖于某些运算符（如\
  \ `+`）的通用方法时，这种限制可能尤为局限。动态调用可以解决这个问题。只要成员在运行时可用，就可以使用。\n\n这里有一个添加两个动态对象的方法，只要运行时存在可用的运算符\
  \ `+`：\n\n```cs\npublic static dynamic Add(dynamic left, dynamic right)\n{\n   \
  \ return left + right;\n}\n```\n\n这是我第一次讨论动态类型，让我们让我们来看看这里发生了什么。动态类型可以被认为是“一个带有运行时绑定的\
  \ `System.Object`”。在编译时，动态变量仅具有 `System.Object` 中定义的方法。编译器随后添加代码，使得每个成员访问都实现为动态调用点。在运行时，代码将执行以检查对象并确定请求的方法是否可用。（参见实现动态对象的事项\
  \ 45）。这通常被称为“鸭子类型”：如果它看起来像鸭子，叫起来也像鸭子，那么它可能就是鸭子。你不需要声明特定的接口或提供任何编译类型操作。只要所需的成员在运行时可用，这种方法就能生效。\n\
  \n对于示例方法，动态调用点将确定对于出的两个对象的实际运行时类型是否存在可的 `+` 运算符。以下所有调用都将提供正确的答案：\n\n```cs\ndynamic\
  \ answer = Add(5, 5);\nanswer = Add(5.5, 7.3);\nanswer = Add(5, 12.3);\n```\n\n\
  注意，答案必须声明为动态对象。因为调用是动态的，编译器无法知道返回值的类型。该类型必须在运行时解析——而在运行时解析返回值类型的唯一方法是将其转为动态对象。返回值的静态类型是\
  \ `dynamic`，其运行时类型在运行时解析。\n\n当然，这个动态 `Add` 方法不仅限于与数值类型一起。你可以相加字符串（因为字符串确实定义了运算符\
  \ `+`）：\n\n```cs\ndynamic label = Add(\"Here is \", \"a label\");\n```\n\n你可以为日期相加一个时间跨度：\n\
  \n```cs\ndynamic tomorrow = Add(DateTime.Now, TimeSpan.FromDays(1));\n```\n\n只要存在可的运算符\
  \ `+`，动态版本的 `Add` 就能工作。\n\n这种对动态类型的初步解释可能会导致你过度使用动态编程。除了所介绍的动态编程的优点外，也有一些缺点。你放弃了类型系统的安全保障，随之，你限制了编译器可以帮助你的方式。解释类型时的任何错误只有在运行时才能被发现。\n\
  \n在任何操作中，如果操作数之一（包括可能的 `this` 引用）是动态的，结果本身就是动态的。在某个时刻，你想要将这些动态对象带回大部分 `C#` 代码使用的静态类型系统。这需要强制类型转换或转换操作：\n\
  \n```cs\ndynamic answer = Add(5, 12.3);\nint value = (int)answer;\nstring stringLabel\
  \ = System.Convert.ToString(answer);\n```\n\n当动态对象的实际类型是目标类型，或者它可以强制转换为目标类型时，强制转换操作将有效。你需要知道任何动态操作结果的正确类型以给它一个强类型。否则，转换将在运行时失败并抛出异常。\n\
  \n当你必须在未知类型的情况下在运行时解析方法时，动态类型是正确的工具。当你拥有编译时知识时，你应该使用 lambda 表达式和函数式编程结构来创建所需的解决方案。你可以使用如下\
  \ lambda 表达式重写 `Add` 方法：\n\n```cs\npublic static TResult Add<T1, T2, TResult>(T1\
  \ left, T2 right, Func<T1, T2, TResult> AddMethod)\n{\n    return AddMethod(left,\
  \ right);\n}\n```\n\n每个调用者都要求提供特定的方法。之前所有的示例都可以使用这种策略实现：\n\n```cs\nvar lambdaAnswer\
  \ = Add(5, 5, (a, b) => a + b);\nvar lambdaAnswer2 = Add(5.5, 7.3, (a, b) => a +\
  \ b);\nvar lambdaAnswer3 = Add(5, 12.3, (a, b) => a + b);\nvar lambdaLabel = Add(\"\
  Here is \", \"a label\", (a, b) => a + b);\ndynamic tomorrow = Add(DateTime.Now,\
  \ TimeSpan.FromDays(1));\nvar finalLabel = Add(\"something\", 3, (a, b) => a + b.ToString());\n\
  ```\n\n\n\n\n你可以看到，最后一种方法要求你指定从 `int` 到 `string` 的转换。它在感上略显粗陋，因为所有那些 lambda 表达式看起来可以转换为一个通用方法。遗憾的是，这就是该解决方案的运行方式。你必须在可以推断类型的地方提供\
  \ lambda 表达式。这意味着大量在人类看来相同的代码必须重复编写——因为这些代码对编译器来说并不是相同的。当然，为了实现 `Add` 方法而专门去定义一个\
  \ `Add` 方法看起来似乎很愚蠢。在实践中，你会将这种技术用于那些使用了 lambda 表达式但不仅仅是执行它的方法。例如，这种技术被用于 .NET 库中的\
  \ `Enumerable.Aggregate()`。`Aggregate()` 遍历整个序列，并通过相加（或执行某些其他操作）产生单一结果：\n\n点击此处查看代码图片\n\
  \n```csharp\nvar accumulatedTotal = Enumerable.Aggregate(sequence,\n    (a, b) =>\
  \ a + b);\n```\n\n这感觉仍然像是在重复代码。避免这种重复代码的一种方法是使用表达式树（expression trees）——另一种在运行时构建代码的方法。`System.Linq.Expression`\
  \ 类及其派生类提供了你可以用于构建表达式树的 API。然后你可以将表达式树转换为 lambda 表达式，并将其生成的 lambda 表达式编译为委托（delegate）。例如，以下代码在三个相同类型的值上构建并执行了\
  \ `Add`：\n\n点击此处查看代码图片\n\n```csharp\n// 简陋实现。请阅读后文获取更好的版本。\npublic static T AddExpression<T>(T\
  \ left, T right)\n{\n    ParameterExpression leftOperand = Expression.Parameter(\n\
  \        typeof(T), \"left\");\n    ParameterExpression rightOperand = Expression.Parameter(\n\
  \        typeof(T), \"right\");\n    BinaryExpression body = Expression.Add(\n \
  \       leftOperand, rightOperand);\n    Expression<Func<T, T, T>> adder =\n   \
  \     Expression.Lambda<Func<T, T, T>>(\n            body, leftOperand, rightOperand);\n\
  \    Func<T, T, T> theDelegate = adder.Compile();\n    return theDelegate(left,\
  \ right);\n}\n```\n\n大部分有趣的工作都涉及类型信息。因此，这里没有使用 `var`（在生产代码中为了清晰我会这样做），而是这段代码显式地命名了所有类型。\n\
  \n前两行为名为“left”和“right”的变量创建了参数表达式，类型均为 `T`。下一行使用这两个参数创建了一个 `Add` 表达式。`Add` 表达式派自\
  \ `BinaryExpression`。你应该能够为其他二元运算符创建类似的表达式。\n\n接下来，代码从表达式体和两个参数构建了一个 lambda 表达式。最后，它通过编译表达式创建了\
  \ `Func<T,T,T>` 委托。编译完成后，你可以执行该委托并返回结果。当然，你可以像调用其他泛泛方法一样调用它：\n\n点击此处查看代码图片\n\n```csharp\n\
  int sum = AddExpression(5, 7);\n```\n\n如示例之前的注释所注，这是一个简陋的实现。*不要*将此代码复制到你的工作应用程序中，因为它有两个问题。\n\
  \n首先，在很多情况下，这段代码无法工作但 `Add()` 应该可以工作。某些有效的 `Add()` 方法接收不同的参数——`int` 和 `double`、`DateTime`\
  \ 和 `TimeSpan` 等。这些不同的参数无法与此方法配合。要修复这个问题，你必须为方法添加另外两个泛型参数。这样，你就可以在操作的左侧和右侧指定不同的操作数。此外，让我们用\
  \ `var` 声明替换一些局部变量名。这模糊了类型信息，但它让方法的逻辑变得稍微清晰了一些。\n\n点击此处查看代码图片\n\n```csharp\n// 稍微好一点\n\
  public static TResult AddExpression<T1, T2, TResult>\n    (T1 left, T2 right)\n\
  {\n    var leftOperand = Expression.Parameter(typeof(T1),\n        \"left\");\n\
  \    var rightOperand = Expression.Parameter(typeof(T2),\n        \"right\");\n\
  \    var body = Expression.Add(leftOperand, rightOperand);\n    var adder = Expression.Lambda<Func<T1,\
  \ T2, TResult>>(\n        body, leftOperand, rightOperand);\n    return adder.Compile()(left,\
  \ right);\n}\n```\n\n这种方法看起来与之前的版本非常相似；修改后的代码只是允许你使用不同类型调用该方法。唯一的缺点是，每当你调用时都需要指定所有三个类型：点击此处查看代码图片\n\
  \n```csharp\nint sum = AddExpression<int, int>(5, 7);\n```\n\n然而，因为你指定了所有三个参数，不同参数也可以了：点击此处查看代码图片\n\
  \n```csharp\nDateTime nextWeek = AddExpression<DateTime, TimeSpan>(DateTime.Now,\
  \ TimeSpan.FromDays(7));\n```\n\n原始示例还有第二个问题。到目前为止，代码在每次调用 `AddExpression()` 时都会编译表达式。这是低效的，所以你应该缓存委托。这里是该方法的第一次尝试：点击此处查看代码图片\n\
  \n```csharp\n// 支持多种\npublic static class BinaryOperator<T1, T2, TResult>\n{\n \
  \   static Func<T1, T2, TResult> compiledExpression;\n    public static TResult\
  \ Add(T1 left, T2 right)\n    {\n        if (compiledExpression == null)\n     \
  \       createFunc();\n        return compiledExpression(left, right);\n    }\n\
  \    private static void createFunc()\n    {\n        var leftOperand = Expression.Parameter(typeof(T1),\n\
  \            \"left\");\n        var rightOperand = Expression.Parameter(typeof(T2),\n\
  \            \"right\");\n        var body = Expression.Add(leftOperand, rightOperand);\n\
  \        var adder = Expression.Lambda<Func<T1, T2, TResult>>(\n            body,\
  \ leftOperand, rightOperand);\n        compiledExpression = adder.Compile();\n \
  \   }\n}\n```\n\n让我们讨论一下如何在表达式和动态类型之间做选择。这取决于情况。表达式版本使用更简单的运行时计算，这在许多情况下可能更快。然而，表达式比动态调用不灵活。记住，通过动态调用你可以成功地添加不同类型：`int`\
  \ 和 `double`、`short` 和 `float` 等。只要在 C# 代码中是合，在编译版本中就是合法的。你甚至可以添加字符串和数字。如果你尝试使用表达式版本实现这些相同的场景，任何这些版本都会抛出\
  \ `InvalidOperationException`。尽管存在转换操作，你构建的表达式并没有在 lambda 表达式中包含这些转换。动态调用执行的工作更多，因此支持更多类型的操作。\n\
  \n例如，假设你想更新 `AddExpression` 以添加不同类型并执行正确的转换。你只需要更新表达式的代码以包含从参数类型到结果类型的转换即可。如下所示：点击此处查看代码图片\n\
  \n```csharp\n// 修复一个问题导致了另一个问题\npublic static TResult AddExpressionWithConversion\n\
  <T1, T2, TResult>(T1 left, T2 right)\n{\n    var leftOperand = Expression.Parameter(typeof(T1),\n\
  \        \"left\");\n    Expression convertedLeft = leftOperand;\n    if (typeof(T1)\
  \ != typeof(TResult))\n    {\n        convertedLeft = Expression.Convert(leftOperand,\n\
  \            typeof(TResult));\n    }\n    var rightOperand = Expression.Parameter(typeof(T2),\n\
  \        \"right\");\n}\n```\n\n\n\n\n```cs\nExpression convertedRight = rightOperand;\n\
  \nif (typeof(T2) != typeof(TResult))\n{\n    convertedRight = Expression.Convert(rightOperand,\n\
  \    typeof(TResult));\n}\nvar body = Expression.Add(convertedLeft, convertedRight);\n\
  var adder = Expression.Lambda<Func<T1, T2, TResult>>(\n    body, leftOperand, rightOperand);\n\
  return adder.Compile()(left, right);\n```\n\n此解决方案将解决所有需要类型转换的加法问题，例如将 `double`\
  \ 和 `int` 相加，或者将 `double` 加到 `string` 上并结果为 `string`。然而，它会破坏参数类型与预期结果不一致的合法用法。特别是，如果你想将\
  \ `TimeSpan` 加到 `DateTime` 上，这个版本将无法工作。通过编写更多的代码，你可以解决这个问题。但是，到那个时候，你实际上已经重新实现了了处理\
  \ C# 动态分发的代码（参见 第 43 项）。与其做那些工作，不如直接使用动态类型。\n\n在操作数和结果相同的相同情况下，你应该使用表达式版本。那种方法可以实现泛型类型参数推断，并在代码运行时失败时产生更少的组合。以下是我在用表达式实现运行时分发时推荐的版本：\n\
  \n点击此处查看代码图片\n\n```cs\npublic static class BinaryOperators<T>\n{\n    static Func<T,\
  \ T, T> compiledExpression;\n\n    public static T Add(T left, T right)\n    {\n\
  \        if (compiledExpression == null)\n            createFunc();\n        return\
  \ compiledExpression(left, right);\n    }\n\n    private static void createFunc()\n\
  \    {\n        var leftOperand = Expression.Parameter(typeof(T),\n            \"\
  left\");\n        var rightOperand = Expression.Parameter(typeof(T),\n         \
  \   \"right\");\n        var body = Expression.Add(leftOperand, rightOperand);\n\
  \        var adder = Expression.Lambda<Func<T, T, T>>(\n            body, leftOperand,\
  \ rightOperand);\n        compiledExpression = adder.Compile();\n    }\n}\n```\n\
  \n在调用 `Add` 时，你仍然需要指定唯一的类型参数。这样做允许你利用编译器在调用处创建任何转换。编译器随后可以将 `int` 提升为 `double`，以此此类推。\n\
  \n使用动态类型并在运行时构建表达式确实会带来性能开销。与任何动态类型系统一样，你的程序在运行时需要执行更多工作，因为编译器之前没有执行通常的类型检查。相反，编译器必须生成指令在运行时执行所有这些检查。这种成本不应被夸大，因为\
  \ C# 编译器为执行运行时检查生成高效的代码。在大多数情况下，使用动态类型将比编写自己的代码使用反射并生成自己的后期绑定版本要快。然而，运行时的工作量是非零；编译器执行这些工作的时间也是非零。如果你可以使用静态类型解决问题，那么这种解决方案无疑比使用动态类型更有效。\n\
  \n当你控制所有涉及的类型时，如果可以创建一个接口而不是使用动态编程，那是更好的解决方案。你可以定义接口，针对接口编程，并在所有应该表现出接口定义行为的类型中该接口。在这种情况下，C#\
  \ 类型系统将使在代码中引入类型错误变得更加困难，编译器将产生更高效的代码，因为它可以假设某些类的错误是不可能的。\n\n在许多情况下，你可以使用 lambda\
  \ 表达式创建泛型 API，并强制调用者定义你原本在动态算法中将执行的代码。\n\n第二个选择是使用表达式。如果你对不同类型的组合相对较少，且可能的转换较少，那么这就是正确的选择。你可以控制创建哪些表达式，从而控制运行时发生多少工作。\n\
  \n当你使用动态类型时，底层基础设施将如何运作。\n\n### 第 44 项：使用动态类型来利用泛型参数\n\n`System.Linq.Cast<T>` 是一个作用于\
  \ `IEnumerable<T>` 的泛型方法。在开始此项之前，你可能认为 `GetSomeStrings().Cast<T>()` 会通过 `MyType`\
  \ 中定义的隐式运算符正确将每个字符串转换为 `MyType`。现在你知道它不会；它会抛出 `InvalidCastException`。\n\n### 转换的问题\n\
  \n问题的根源在于 `Cast<T>` 被编译为 MSIL 时，除了 `T` 必须派生自 `System.Object` 之外没有任何关于 `T` 的信息。检查这个类：\n\
  \n点击此处查看代码图片\n\n```cs\npublic class MyType\n{\n    public String StringMember {\
  \ get; set; }\n    public static operator String(MyType aString) => aString.StringMember;\n\
  \    public static operator MyType(String aString) => new MyType { StringMember\
  \ = aString };\n}\n```\n\n考虑以下代码（假设 `GetSomeStrings()` 返回一个字符串序列）：\n\n点击此处查看代码图片\n\
  ```cs\nvar answer1 = GetSomeStrings().Cast<MyType>();\n\ntry\n{\n    foreach (var\
  \ v in answer1)\n        WriteLine(v);\n}\ncatch (InvalidCastException)\n{\n   \
  \ WriteLine(\"Cast Failed!\");\n}\n```\n\n第 11 项 解释了为什么转换运算符很糟糕；然而，用户定义的转换是此问题的关键。\n\
  \n之前的代码等同于以下结构，它使用了查询表达式：\n\n点击此处查看代码图片\n```cs\nvar answer2 = from MyType v in GetSomeStrings()\n\
  \              select v;\n\ntry\n{\n    foreach (var v in answer2)\n        WriteLine(v);\n\
  }\ncatch (InvalidCastException)\n{\n    WriteLine(\"Cast failed again\");\n}\n```\n\
  \n范围变量上的类型声明被编译器转换为对 `Cast<MyType>` 的调用。同样，它抛出了 `InvalidCastException`。\n\n这里是重构代码使其运行的方法之一：\n\
  \n点击此处查看代码图片\n```cs\nvar answer3 = from v in GetSomeStrings()\n              select\
  \ (MyType)v;\n\nforeach (var v in answer3)\n    WriteLine(v);\n```\n\n\n\n\n\n区别何？那两个不起作用的版本使用了\
  \ `Cast<T>()`，而可以运行的版本将类型转换包含在了作为 `Select()` 方法参数的 lambda 表达式中。`Cast<T>` 无法访问其参数的运行时类型的任何用户定义转换。它能进行的唯一转换是引用转换和装箱转换。当\
  \ `is` 操作符成功时，引用转换也会成功（参见 *《Effective C#，第三版》*中的条目 3）。装箱转换将值类型转换为引用类型，反之亦然（参见 *《Effective\
  \ C#，第三版》*中的条目 9）。`Cast<T>`无法访问任何用户定义转换，因为它只能假设 `T` 包含 `System.Object` 中定义的成员。`System.Object`\
  \ 不包含任何用户定义转换，因此这些转换不具备访问权限。使用 `Select<T>`的版本之所以成功，是因为 `Select()` 使用的 lambda 表达式接收的输入参数为\
  \ `string`。这意味着转换操作是基于 `MyType` 定义的。\n\n我通常将转换操作符视为一种“代码气味”。在某些情况下，它们是有用的，但往往产生的问题比带来的价值还多。如果没有转换操作符，没有开发者会想要去编写那些不起作用的示例代码。\n\
  \n当然，由于我的建议是不使用转换操作符，我应该提供一种替代方案。`MyType` 已经包含一个用于存储 `string` 属性的读写属性，因此你只需要移除转换操作符并编写以下构造之一：\n\
  \n点击此处查看代码图像\n\n```csharp\nvar answer4 = GetSomeStrings().\n    Select(n => new\
  \ MyType { StringMember = n });\n\nvar answer5 = from v in GetSomeStrings()\n  \
  \            select new MyType { StringMember = v };\n```\n\n此外，如果有必要，你可以为 `MyType`\
  \ 创建一个不同的构造函数。当然，这只是为了绕过 `Cast<T>()` 的局限性。既然你已经理解了为什么存在这些局限性，你可能更倾向于编写一个不同的方法来规避这些局限性。技巧是以这种方式编写泛方法：利用运行时信息来执行任何转换。\n\
  \n你可以编写数页数基于反射的代码来查看哪些转换是可用的，执行任何这些转换并返回正确的类型——但那是巨大的浪费。相反，让 C# 4.0 的动态类型来完成所有繁重工作吧。你将得到一个符合你预期的简单\
  \ `Convert<T>` 方法：\n\n点击此处查看代码图像\n\n```csharp\npublic static IEnumerable<TResult>\
  \ Convert<TResult>(\n    this System.Collections.IEnumerable sequence)\n{\n    foreach\
  \ (object item in sequence)\n    {\n        dynamic coercion = (dynamic)item;\n\
  \        yield return (TResult)coercion;\n    }\n}\n```\n\n现在，只要从源类型到目标类型存在转换（无论是隐式的还是显式的），该转换就能生效。其中仍然涉及强制转换，因此存在运行时失败的可能性。当你强制转换类型系统时，这只是游戏的一部分。`Convert<T>`\
  \ 适用的情况比 `Cast<T>()` 更多，但它做的工作也更多。作为开发者，我们应该更关注用户需要创建哪些代码，而不是关注我们自己的代码。`Convert<T>`\
  \ 通过了这一测试：\n\n点击此处查看代码图像\n\n```csharp\nvar convertedSequence = GetSomeStrings().Convert<MyType>();\n\
  ```\n\n`Cast<T>` 与所有泛型方法一样，编译时仅对其类型参数有有限的了解。这可能导致泛型方法无法按照你预期的方式运行。根源几乎总是泛型方法无法感知表示类型参数的类型的特定功能。当发生这种情况时，稍微应用动态类型就可以利用运行时反射来解决问题。\n\
  \n### 条目 45：使用 DynamicObject 或 IDynamicMetaObjectProvider 处理数据驱动的动态类型\n\n动态编程的一个大优势是能够构建其公共接口根据你的使用方式在运行时发生更改的类型。C#\
  \ 通过 `dynamic`、`System.Dynamic.DynamicObject` 基类以及 `System.Dynamic.IDynamicMetaObjectProvider`\
  \ 接口提供了这种能力。使用这些工具，你可以创建具有动态能力的自定义类型。\n\n创建具有动态能力的类型最简单的方法是使其继承自 `System.Dynamic.DynamicObject`。该类型使用私有嵌套类实现了\
  \ `IDynamicMetaObjectProvider` 接口。这个私有嵌套类负责解析表达式并将结果转发到 `DynamicObject` 类中某一个虚拟方法的艰性工作。如果你可以派自\
  \ `DynamicObject`，那么创建一个动态类就变成了一个相对简单的练习。\n\n例如，考虑一个实现动态属性包（dynamic property bag）的类。这个示例与\
  \ Razor 属性包、ExpandObject 以及 Clay 和 Gemini 项目类似；查看这些示例以获取生产级的实现。当你创建 `DynamicBag`\
  \ 时，它没有项，因此它没有属性。当你尝试检索任何属性时，它将抛出异常。点击此处查看代码图像\n\n```csharp\ndynamic dynamicProperties\
  \ = new DynamicBag();\ntry\n{\n    Console.WriteLine(dynamicProperties);\n}\ncatch\
  \ (Microsoft.CSharp.Runtime.RuntimeException)\n{\n    Console.WriteLine(\"There\
  \ are properties\");\n}\ndynamicProperties.Date = DateTime.Now;\ndynamicProperties.Name\
  \ = \"Wagner\";\ndynamicProperties.Content = \"Effective C#\";\n```\n\n动态属性包的实需要在\
  \ `DynamicObject` 基类中重写 `TrySetMember` 和 `TryGetMember`。点击此处查看代码图像\n\n```csharp\n\
  class DynamicBag : DynamicObject\n{\n    private Dictionary<string, object> storage\
  \ = new Dictionary<string, object>();\n\n    public override bool TryGetMember(GetBinder\
  \ binder, out object result)\n    {\n        if (storage.ContainsKey(binder.Name))\n\
  \        {\n            result = storage[binder.Name];\n            return true;\n\
  \        }\n        result = null;\n        return false;\n    }\n\n    public override\
  \ bool TrySetMember(SetMember binder, object value)\n    {\n        string key =\
  \ binder.Name;\n        if (storage.ContainsKey(key))\n        {\n            storage[key]\
  \ = value;\n        }\n        else\n        {\n            storage.Add(key, value);\n\
  \        }\n        return true;\n    }\n\n    public override string ToString()\n\
  \    {\n        StringWriter message = new StringWriter();\n        foreach (var\
  \ item in storage)\n        {\n            message.WriteLine($\"{item.Key}:\\t{item.Value}\"\
  );\n        }\n        return message.ToString();\n    }\n}\n```\n\n\n\n\n`DynamicObject`\
  \ 包含了类似的方法，用于处理索引器、方法、构造函数以及一元和二元运算符的动态调用。你可以重写这些任何成员来创建你自己的动态成员。在所有情况下，你都必须检查 `Binder`\
  \ 对象以查看请求了哪个成员，并执行执行所需的任何操作。如果有返回值，你需要设置它们（通过 `out` 参数）并返回你的重载方法是否已处理了该成员。\n\n如果你想创建一个能够启用动态行为的类型，使用\
  \ `DynamicObject` 作为基类是最简单的方法。当然，使用一个动态属性包也是可行的，但让我们来看另一个示例，它展示了在什么时候动态类型更有用。\n\n\
  LINQ to XML 在处理 XML 方面做了巨大的改进，但仍然不尽人意。考虑这段 XML 代码段，它包含了关于我们太阳系的一些信息：\n\n点击此处查看代码图像\n\
  \n```xml\n<Planets>\n  <Planet>\n    <Name>Mercury</Name>\n  </Planet>\n  <Planet>\n\
  \    <Name>Venus</Name>\n  </Planet>\n  <Planet>\n    <Name>Earth</Name>\n    <Moons>\n\
  \      <Moon>Moon</Moon>\n    </Moons>\n  </Planet>\n  <Planet>\n    <Name>Mars</Name>\n\
  \    <Moons>\n      <Moon>Phobos</Moon>\n      <Moon>Deimos</Moon>\n    </Moons>\n\
  \  </Planet>\n  <!-- other data elided -->\n</Planets>\n```\n\n要获取第一个行星，你会编写类似下面的代码：\n\
  \n点击此处查看代码图像\n\n```csharp\n// 创建一个包含\n// 太阳系数据的 XElement 文：\nvar xml = createXML();\n\
  var firstPlanet = xml.Element(\"Planet\");\n```\n\n这并不太糟，但你深入文件越深，代码就会变得越复杂。获取地球（第三个行星）的代码看起来如下：\n\
  \n点击此处查看代码图像\n\n```csharp\nvar earth = xml.Elements(\"Planet\").Skip(2).First();\n\
  ```\n\n获取第三个行星的名称需要更多的代码：\n\n点击此处查看代码图像\n\n```csharp\nvar earthName = xml.Elements(\"\
  Planet\").Skip(2).\n    First().Element(\"Name\");\n```\n\n当你想检索卫星的名称时，代码会变得非常长：\n\
  \n点击此处查看代码图像\n\n```csharp\nvar moon = xml.Elements(\"Planet\").Skip(2).First().\n\
  \      Elements(\"Moons\").First().Element(\"Moon\");\n```\n\n此外，这段代码只有在 XML 包含你正在寻找的节点时才有效。如果\
  \ XML 文件中发生问题，导致某些节点缺失，代码将抛出异常。指定如何处理缺失节点会增加大量的代码，而且仅仅是为了处理潜在的错误。到那时，就很难看出原始的意图了。\n\
  \n现在，假设你有一个数据驱动的类型，它可以使用元素名称返回 XML 元素的点符号表示。寻找第一个行星可以简单到这样：\n\n点击此处查看代码图像\n\n```csharp\n\
  // 创建一个包含\n// 太阳系数据的 XElement 文：\nvar xml = createXML();\nConsole.WriteLine(xml);\n\
  \ndynamic dynamicXML = new DynamicXElement(xml);\n\n// 旧方法：\nvar firstPlanet = xml.Element(\"\
  Planet\");\nConsole.WriteLine(firstPlanet);\n\n// 新方法：\ndynamic test2 = dynamicXML.Planet;\
  \ // 返回第一个行星。\nConsole.WriteLine(test2);\n```\n\n获取第三个行星只需要使用索引器：\n\n点击此处查看代码图像\n\
  \n```csharp\n// 获取第三个行星（地球）：\ndynamic test3 = dynamicXML[\"Planet\", 2];\n```\n\n\
  通过两个链式索引器可以到达卫星：\n\n点击此处查看代码图像\n\n```csharp\ndynamic earthMoon = dynamicXML[\"Planet\"\
  , 2][\"Moons\", 0].Moon;\n```\n\n最后，由于代码是动态的，你可以定义语义化，使得任何缺失的节点都返回一个空元素。例如，以下所有调用都会返回空的动态\
  \ XElement 节点：\n\n点击此处查看代码图像\n\n```csharp\ndynamic test6 = dynamicXML[\"Planet\"\
  , 2]\n    [\"Moons\", 3].Moon; // 地球没有 4 颗卫星\n\ndynamic fail = dynamicXML.NotAppearingInFile;\n\
  dynamic fail2 = dynamicXML.Not.Appearing.In.File;\n```\n\n因为缺失的元素返回缺失的元素，所以你可以继续对它进行解引用，并知道如果组合导航中的任何元素缺失，最终结果将是一个缺失的元素。这种行为是由\
  \ `DynamicObject` 的另一个类实现的。你必须同时重写 `TryGetMember` 和 `TryGetIndex` 以返回具有适当节点的动态元素：\n\
  \n点击此处查看代码图像\n\n```csharp\npublic class DynamicElement : DynamicObject\n{\n  private\
  \ XElement xmlSource;\n  public DynamicElement(XElement source)\n  {\n    xmlSource\
  \ = source;\n  }\n  public override bool TryGetMember(BinderBinder, out object result)\n\
  \  {\n    result = null;\n    if (binder.Name == \"Value\")\n    {\n      result\
  \ = xmlSource != null ? xmlSource.Value : \"\";\n      return true;\n    }\n   \
  \ if (xmlSource != null)\n      result = xmlSource.Element(binder.Name);\n    return\
  \ true;\n  }\n  public override bool TryGetIndex(IndexBinder binder, object[] indexes,\
  \ out object result)\n  {\n    result = null;\n    // 此仅支持 [string, int] 索引器\n \
  \   if (indexes.Length != 2)\n      return false;\n    if (!(indexes[0] is string))\n\
  \      return false;\n    if (!(indexes[1] is int))\n      return false;\n    var\
  \ allNodes = xmlSource.Elements((string)indexes[0]);\n    int index = (int)indexes[1];\n\
  \    if (index < allNodes.Count())\n      result = new DynamicElement(allNodes.ElementAt(index));\n\
  \    else\n      result = new DynamicElement(null);\n    return true;\n  }\n  public\
  \ override string ToString()\n  {\n    return xmlSource?.ToString() ?? \"\";\n \
  \ }\n}\n```\n\n大部分代码使用了之前在本项中演示的类似概念。然而，`TryGetIndex` 方法是新的。它在客户端代码调用索引器检索 XElement\
  \ 时实现动态行为。\n\n使用 `DynamicObject` 使实现动态类型变得简单得多。`DynamicObject` 隐藏了创建动态类型的复杂性。它提供了许多处理动态分发的实现。\n\
  \n然而，有时你可能想创建一个动态类型，但无法使用 `DynamicObject`，因为你需要不同的基类。在这种情况下，你可以通过实现 `IDynamicMetaObjectProvider`\
  \ 来创建一个动态字典，而不是依赖 `DynamicObject`。\n\n实现 `IDynamicMetaObjectProvider` 意味着一个方法：`GetMetaObject`。这里是\
  \ `DynamicDictionary` 的另一个版本，它实现了 `IDynamicMetaObjectProvider` 而不是派自 `DynamicObject`：\n\
  \n```csharp\nclass DynamicDictionary2 : IDynamicMetaObjectProvider\n{\n  DynamicMetaObject\
  \ IDynamicMetaObjectProvider.GetMetaObject(\n    System.Linq.Expressions.Expression\
  \ parameter)\n  {\n    return new DynamicMetaObject(parameter, this);\n  }\n  private\
  \ Dictionary<string, object> storage =\n    new Dictionary<string, object>();\n\
  \  public object SetDictionaryEntry(string key, object value)\n  {\n    if (storage.ContainsKey(key))\n\
  \      storage[key] = value;\n    else\n      storage.Add(key, value);\n    return\
  \ value;\n  }\n  public object GetDictionaryEntry(string key)\n  {\n    object result\
  \ = null;\n    if (storage.ContainsKey(key))\n    {\n      result = storage[key];\n\
  \    }\n    return result;\n  }\n}\n```\n\n\n\n\n\n```csharp\nStringWriter message\
  \ = new StringWriter();\n\nforeach (var item in storage)\n{\n    message.WriteLine($\"\
  {item.Key}:\\t{item.Value}\");\n}\n\nreturn message.ToString();\n}\n```\n\n`GetMetaObject()`\
  \ 每次被调用时都会返回一个新的 `DynamicDictionaryMetaObject`。这就是第一个复杂度出现的地方。每当调用 `DynamicDictionary`\
  \ 的任何成员时，都会调用 `GetMetaObject()`。因此，如果你调用同一个成员十次，`GetMetaObject()` 就会调用十次。即使方法在 `DynamicDictionary2`\
  \ 中是静态定义的，`GetMetaObject()` 也会被调用并拦截这些方法以调用可能的动态行为。记住，动态对象的静态类型被定义为 `dynamic`，因此对它们没有定义编译时行为。每个成员访问都是动态分派的。\n\
  \n`DynamicMetaObject` 负责构建一个表达式树，以执行处理动态调用所需的任何代码。它的构造函数接受表达式和动态对象作为参数。构造完成后，将调用其中一个\
  \ `Bind` 方法。它的职责是构建一个包含执行动态调用所需的表达式的 `DynamicMetaObject`。让我们逐步实现 `DynamicDictionary`\
  \ 所需的两个 `Bind` 方法：`BindSetMember` 和 `BindGetMember`。\n\n`BindSetMember` 构建一个表达式树，该树将调用\
  \ `DynamicDictionary2.SetDictionaryEntry()` 来设置字典中的值。以下是它的实现：\n\n点击此处查看代码图片\n\n\
  ```csharp\npublic override DynamicMetaObject BindSetMember(\n    SetMemberBinder\
  \ binder,\n    DynamicMetaObject value)\n{\n    // 在包含类中调的方法：\n    string methodName\
  \ = \"SetDictionaryEntry\";\n\n    // 设置绑定限制：\n    BindingRestrictions restrictions\
  \ =\n        BindingRestrictions.GetTypeRestriction(\n            Expression, LimitType);\n\
  \n    // 设置参数：\n    Expression[] args = new Expression[2];\n    // 第一个参数是待设置的属性名。\n\
  \    args[0] = Expression.Constant(binder.Name);\n    // 第二个参数是值：\n    args[1] =\
  \ Expression.Convert(value.Expression,\n        typeof(object));\n\n    // 设置“this”引用：\n\
  \    Expression self = Expression.Convert(Expression,\n        LimitType);\n\n \
  \   // 设置方法调用表达式：\n    Expression methodCall = Expression.Call(self,\n        typeof(DynamicDictionary2).GetMethod(methodName),\n\
  \        args);\n\n    // 创建一个稍后调用的元对象：\n    DynamicMetaObject setDictionaryEntry\
  \ =\n        new DynamicMetaObject(\n            methodCall,\n            restrictions);\n\
  \n    // 返回该动态对象：\n    return setDictionaryEntry;\n}\n```\n\n元编程很快就会变得复杂，所以让我们缓慢地分析这个例子。第一行设置了在\
  \ `DynamicDictionary` 中调用的方法名称：“SetDictionaryEntry”。注意 `SetDictionary` 返回属性赋值的右侧值。这很重要，因为接的结构必须能够工作：\n\
  \n点击此处查看代码图片\n\n```csharp\nDateTime current = propertyBag2.Date = DateTime.Now;\n\
  ```\n\n如果返回值没有设置正确，该结构将无法工作。\n\n接下来，该方法初始化了一组 `BindingRestrictions`。在大多数情况下，你将使用像示例这样的限制——即在源表达式中给出的一个或多个限制，以及用于作为动态调用目标的类型的限制。\n\
  \n方法的其余部分构建了方法调用表达式，该表达式将使用指定的属性名和值调用 `SetDictionaryEntry()`。属性名是一个常量表达式，但值是一个将进行延迟求值的\
  \ `Conversion` 表达式。记住，setter 的右侧可能是方法调用或带有副作用的表达式；这两个选项都必须在适当的时间进行求值。否则，使用方法的返回值来设置属性是不可能的。\n\
  \n`DynamicMetaObject` 负责构建一个表达式树，以执行处理动态调用所需的任何代码。……为了实现该字典，你还必须实现 `BindGetMember`。`BindGetMember`\
  \ 的工作完全相同。它构建一个从字典中检索值的表达式。\n\n点击此处查看代码图片\n\n```csharp\npublic override DynamicMetaObject\
  \ BindGetMember(\n    GetMemberBinder binder)\n{\n    // 在包含类中调的方法：\n    string\
  \ methodName = \"GetDictionaryEntry\";\n\n    // 设置绑定限制：\n    BindingRestrictions\
  \ restrictions =\n        BindingRestrictions.GetTypeRestriction(\n            Expression,\
  \ LimitType);\n\n    // 设置参数：\n    Expression[] args = new Expression[1];\n    //\
  \ 第一个参数是待获取的属性名。\n    args[0] = Expression.Constant(binder.Name);\n\n    // 设置“this”引用：\n\
  \    Expression self = Expression.Convert(Expression,\n        LimitType);\n\n \
  \   // 设置方法调用表达式：\n    Expression methodCall = Expression.Call(self,\n        typeof(DynamicDictionary2).GetMethod(methodName),\n\
  \        args);\n\n    // 创建一个稍后调用的元对象：\n    DynamicMetaObject getDictionaryEntry\
  \ =\n        new DynamicMetaObject(\n            methodCall,\n            restrictions);\n\
  \n    // 返回该动态对象：\n    return getDictionaryEntry;\n}\n```\n\n### 项目 46：理解如何使用表达式\
  \ API\n\n.NET Framework 包含了允许你对类型进行反射或在运行时创建代码的 API。在运行时检查代码或创建代码的能力是非常强大的。许多不同的问题通过检查代码或动态生成代码可以得到最佳解决。这些\
  \ API 的挑战在于它们非常底层，且非常难以使用。作为开发者，我们渴望一种更简单的方法来动态解决问题。\n\n现在 C# 已经了 LINQ 和动态支持，你有了比经典反射\
  \ API 更好的选择：表达式和表达式树。表达式看起来像代码，在许多情况下，它们会被编译为委托。然而，你也可以请求表达式格式的表达式。\n\n\n\n\n让我们考虑两个表达式（expressions）可以让你的生活变得许多的常见任务。第一个解决了通信框架中的一个常见问题。使用\
  \ `WCF`、`remoting` 或 Web 服务的典型工作流是应用某些代码生成工具为特定服务生成客户端代理。这种方法虽然可行，但它会导致一个相当笨肿的解决方案——由数百行代码组成。每当服务器增加新方法或更改参数列表时，你都需要更新该代理。现在，假设你可以编写类似这样的代码：\n\
  \n点击此处查看代码图像\n\n```csharp\nvar client = new ClientProxy<IService>();\n\nvar result\
  \ = client.CallInterface<string>(\n    srver => srver.DoWork(172));\n```\n\n在这里，`ClientProxy<T>`\
  \ 知道如何将每个参数和方法调用发送到网络上，尽管它并不了解你实际访问的服务的任何信息。这段代码并不依赖于带外的代码生成器，而是使用表达式树和泛型来确定你调用了哪种方法以及使用了哪些参数。\n\
  \n`CallInterface()` 方法接收一个参数，其类型为 `Expression<Func<T, TResult>>`。输入参数（类型为 `T`）代表一个实现\
  \ `IService` 的对象。`TResult` 自然是特定方法返回的任何内容。该参数是一个表达式，你甚至不需要一个实现 `IService` 的对象实例来编写这段代码。核心算法位于\
  \ `CallInterface()` 方法中。\n\n点击此处查看代码图像\n\n```csharp\npublic TResult CallInterface<TResult>(Expression<Func<T,\
  \ TResult>> op)\n{\n    var exp = op.Body as MethodCallExpression;\n    var methodName\
  \ = exp.Method.Name;\n    var methodInfo = exp.Method;\n    var allParameters =\
  \ from element in exp.Arguments\n                        select processArgument(element);\n\
  \n    Console.WriteLine($\"Calling {methodName}\");\n\n    foreach (var parm in\
  \ allParameters)\n        Console.WriteLine(@$\"\\tParameter type = {parm.ParmType},\
  \ Value = {parm.ParmValue}\");\n\n    return default(TResult);\n}\n\nprivate (Type\
  \ ParmType, object ParmValue) processArgument(Expression element)\n{\n    object\
  \ argument = default(object);\n    LambdaExpression expression = Expression.Lambda(\n\
  \        Expression.Convert(element, element.Type));\n    Type parmType = expression.ReturnType;\n\
  \    argument = expression.Compile().DynamicInvoke();\n    return (parmType, argument);\n\
  }\n```\n\n从 `CallInterface` 的开始，这段代码执行的第一件事是查看表达式树的主体——即 lambda 运算符右侧的部分。再次考虑使用\
  \ `CallInterface()` 的示例；它调用了带有 `srver.DoWork(172)` 方法。这个 `MethodCallExpression`\
  \ 包含了你理解所有参数和被调用方法名所需的信息。方法名非常简单：它存储在 `Method` 属性的 `Name` 属性中。在这个示例中，名称是“DoWork”。LINQ\
  \ 查询处理了该方法的任何所有参数。\n\n更有趣的工作发生在 `processArgument` 中，它评估每个参数表达式。在较早的示例中，只有一个参数——一个常量，值\
  \ 172。那种方法并不健壮，因此新代码采取了不同的策略。此示例中的任何参数都可能是方法调用、属性或索引器访问器，甚至是字段访问器。任何方法调用也可能包含任何这些类型的参数。该方法没有尝试解析所有内容，而是利用\
  \ `LambdaExpression` 类型并评估每个参数表达式。每个参数表达式——即使是 `ConstantExpression`——都可以表示为 lambda\
  \ 表达式的返回值。`ProcessArgument()` 将参数转换为 `LambdaExpression`。在常量表达式的情况下，它将其转换为等同于 `()\
  \ => 172` 的 lambda 表达式。如前所述，lambda 表达式可以编译为委托（delegate），然后调用该委托。在参数表达式的情况下，示例代码创建了一个返回常量值\
  \ 172 的委托。可以开发更复杂的表达式来创建更复杂的 lambda 表达式。\n\n一旦创建了 lambda 表达式，就可以从 lambda 中获取参数类型。注意，示例方法没有对参数进行任何处理。在\
  \ lambda 表达式中评估参数的代码只在 lambda 被调用时执行。这种方法的巧妙之处在于，方法可以包含其他对 `CallInterface()` 的调用。这类构造的工作方式如下：\n\
  \n点击此处查看代码图像\n\n```csharp\nclient.CallInterface(srver => srver.DoWork())\n```\n\n\
  通过应用这种技术，你可以使用表达式树在运行时确定用户想要执行哪些代码。在书中展示这一点很困难，但因为 `ClientProxy<T>` 是一个泛型类，`CallInterface`\
  \ 方法是强类型的。第一个示例说明了你可以如何进行解析。第二个示例以相反的方向运行，涵盖了你希望在运行时生成的场景。大型系统中必须解决的问题之一与从某种类型创建某种类型的对象有关。例如，你的大型主程序可能包含多个系统，每个系统都有不同的类型。当然，你可以手动输入类型，但那样太乏味。最好是创建某种能“推断出”实现的类型。你希望只写这样的代码：\n\
  \n点击此处查看代码图像\n\n```csharp\nvar converter = new Converter<SourceContact, DestinationContact>();\n\
  DestinationContact dest = converter.ConvertFrom(source);\n```\n\n作为解决方案的一部分，你会希望转换器从源拷贝每个属性到目标，使得属性名称相同，并且源对象具有\
  \ `get` 访问器而目标类型具有 `set` 访问器。这种运行时代码可以通过创建表达式并编译执行来得到最好的处理。你想要生成类似下面的代码：\n\n点击此处查看代码图像\n\
  \n```csharp\n// 非法 C#；仅用于解释\nTDest FromImaginary(TSource source)\n{\n    TDest destination\
  \ = new TDest();\n    foreach (var prop in sharedProperties)\n        destination.prop\
  \ = source.prop;\n    return destination;\n}\n```\n\n你需要创建一个表达式，反过来执行之前给出的伪代码。这里是创建该表达式并将其编译为函数的完整方法。紧接列表之后，我们将详细检查该方法的所有部分。起初有点棘手，但并不是你无法处理的。\n\
  \n点击此处查看代码图像\n\n```csharp\nprivate void createConverterIfNeeded()\n{\n    if (converter\
  \ == null)\n    {\n        var source = Expression.Parameter(typeof(TSource), \"\
  source\");\n        var dest = Expression.Variable(typeof(TDest), \"dest\");\n \
  \       var assignments = from srcProp in\n                            typeof(TSource).GetProperties(BindingFlags.Public\
  \ | BindingFlags.Instance)\n                          where srcProp.CanRead\n  \
  \                          let destProp = typeof(TDest).GetProperty(srcProp.Name,\n\
  ```\n\n\n\n```csharp\nBindingFlags.Public | BindingFlags.Instance)\nwhere (destProp\
  \ != null) && (destProp.CanWrite)\nselect Expression.Assign(\n    Expression.Property(dest,\
  \ destProp),\n    Expression.Property(source, srcProp));\n\n// 组合主体：\nvar body =\
  \ new List<Expression>();\nbody.Add(Expression.Assign(dest,\n    Expression.New(typeof(TDest))));\n\
  body.AddRange(assignments);\nbody.Add(dest);\nvar expr =\n    Expression.Lambda<Func<TSource,\
  \ TDest>>(\n        Expression.Block(\n            new[] { dest }, // 表达式参数\n  \
  \          body.ToArray() // 主体\n        ),\n        source  // Lambda 表达式\n   \
  \ );\nvar func = expr.Compile();\nconverter = func;\n}\n```\n\n此方法创建了之前显示的伪代码的代码。首先，你声明参数：\n\
  \n点击此处查看代码图像\n\n```csharp\nvar source = Expression.Parameter(typeof(TSource), \"\
  source\");\n```\n\n然后，你声明一个局部变量来持有目标：\n\n点击此处查看代码图像\n\n```csharp\nvar dest = Expression.Variable(typeof(TDest),\
  \ \"dest\");\n```\n\n该方法的大部分是将属性从源对象赋值给目标对象的代码——这里写成了 LINQ 查询的形式。LINQ 查询的源序列是源对象中所有具有\
  \ `get` 访问器的公共实例属性的集合：\n\n点击此处查看代码图像\n\n```csharp\nfrom srcProp in typeof(TSource).GetProperties(\n\
  \    BindingFlags.Public | BindingFlags.Instance)\nwhere srcProp.CanRead\n```\n\n\
  `let` 语句声明了一个局部变量，该变量持有目标类型中同名的属性。如果目标类型没有正确类型的属性，则它可能为 null：\n\n点击此处查看代码图像\n\n\
  ```csharp\nlet destProp = typeof(TDest).GetProperty(\n    srcProp.Name,\n    BindingFlags.Public\
  \ | BindingFlags.Instance)\nwhere (destProp != null) && (destProp.CanWrite)\n```\n\
  \n查询的投影是一个赋值语句的序列，它将目标对象的属性赋值为源对象中同名属性的值：\n\n点击此处查看代码图像\n\n```csharp\nselect Expression.Assign(\n\
  \    Expression.Property(dest, destProp),\n    Expression.Property(source, srcProp));\n\
  ```\n\n方法的其余部分构建了 Lambda 表达式的主体。`Expression` 类的 `Block()` 方法需要一个数组形式的所有语句。下一步是创建一个\
  \ `List<Expression>`，你可以在其中添加所有语句。该列表可以很容易地转换为数组。\n\n点击此处查看代码图像\n\n```csharp\nvar\
  \ body = new List<Expression>();\nbody.Add(Expression.Assign(dest,\n    Expression.New(typeof(TDest))));\n\
  body.AddRange(assignments);\nbody.Add(dest);\n```\n\n最后，是时候构建一个返回目标对象并包含所有已构建语句的\
  \ Lambda 表达式了：\n\n点击此处查看代码图像\n\n```csharp\nvar expr =\n    Expression.Lambda<Func<TSource,\
  \ TDest>>(\n        Expression.Block(\n            new[] { dest }, // 表达式参数\n  \
  \          body.ToArray() // 主体\n        ),\n        source // Lambda 表达式\n    );\n\
  ```\n\n这就是全部代码了。现在是时候编译它并将其转换为你可以调用的委托了：\n\n```csharp\nvar func = expr.Compile();\n\
  converter = func;\n```\n\n这个示例非常复杂，代码编写并不特别容易。你经常会发现编译器类的错误持续生成，直到表达式被正确构建为止。这种解决方案显然不是处理简单问题的最佳方法。尽管如此，表达式\
  \ API 比其前身（发射 IL 的反射 API 要简单得多。这一事实促成了关于何时应该使用表达式 API 的指南：当你认为想要使用反射时，尝试使用表达式 API\
  \ 来解决问题。\n\n表达式 API 可以以两种不同的方式使用。首先，你可以创建以表达式作为参数的方法，这允许你解析这些表达式并根据表达式背后的概念创建代码。其次，你可以在运行时创建代码；也就是说，你可以创建编写代码的类，然后执行这些代码。这种策略是解决你将遇到的一些更困难的通用问题的有力方法。\n\
  \n### 事项 47：在公共 API 中尽量减少动态对象\n\n动态对象在静态类型系统中表现并不良好。类型系统将它们感知为 `System.Object` 的实例，但它们实际上是特殊的实例。你可以要求动态对象的工作超出\
  \ `System.Object` 定义的范围。编译器生成的代码尝试寻找并执行你尝试访问的任何成员。\n\n但动态对象也是侵略性的——它们触及的一切都会变成动态的。执行一个任何一个参数为动态的操作，结果就是动态的。从方法返回动态对象，该对象被使用的任何地方都会变成动态。这就像在培养皿中观察霉菌生长。\n\
  \n为了限制有机物的扩散，你需要像生物在培养皿中培养物一样对待动态类型：返回静态类型对象而不是动态对象。否则，动态类型会产生负面影响，导致应用程序中的一切逐渐变成动态。\n\
  \n这并不是意味着动态编程在范围内都是糟糕的。本章的其他项目涵盖了动态编程作为优秀解决方案的某些技术。然而，动态类型和静态类型非常不同，具有不同的实践、惯用法和策略。在不采取相应措施的情况下混合两者会导致许多错误和效率低下。C#\
  \ 是一种静态类型语言，因此它在某些区域支持动态类型。因此，如果你在使用 C#，你应该花大部分时间使用静态类型，并减少动态类型的范围。如果你希望编写通用的动态程序，你应该考虑动态语言而不是静态类型语言。\n\
  \n如果你计划在程序中使用动态功能，尽量让它们离开你的类型的公共接口。这样，你可以在单个对象（或类型）培养皿中使用动态类型，同时防止动态类型感染程序的其他部分或使用你对象的开发者开发的所有代码。一种场景是你与动态环境创建的对象交互，例如\
  \ IronPython。当你的设计使用动态语言创建动态对象时，你应该将它们封装在 C# 对象中；此类对象让整个 C# 世界无忧地忽略动态类型发生的事实。\n\n\
  你可能希望为那些使用动态类型产生鸭子类型的情况选择不同的解决方案。查看 事项 43 中鸭子类型的使用。在每种情况下，计算结果都是动态的。这看起来可能并不糟糕，但你应该意识到编译器在这种情况下执行了大量工作。这两行代码（参见\
  \ 事项 43;\nConsole.WriteLine(answer);\n```\n\n转变为如下内容以处理动态对象：\n\n点击此处查看代码图像\n\n\n\
  \n\n\n```csharp\n// Compiler generated; not legal user C# code\n\nobject answer\
  \ = Add(5, 5);\n\nif (<Main>o__SiteContainer0.<>p__Site1 == null)\n{\n    <Main>o__SiteContainer0.<>p__Site1\
  \ =\n        CallSite<Action<CallSite, Type, object>>.Create(\n        new CSharpInvokeMemberBinder(\n\
  \        CSharpCallFlags.None, \"WriteLine\",\n        typeof(Program), null, new\
  \ CSharpArgumentInfo[]\n        {\n            new CSharpArgumentInfo(\n       \
  \     CSharpArgumentInfoFlags.IsStaticType |\n            CSharpArgumentInfoFlags.UseCompileTimeType,\n\
  \            null),\n            new CSharpArgumentInfo(\n                CSharpArgumentInfoFlags.None,\n\
  \                null)\n        }));\n}\n<Main>o__SiteContainer0.<>p__Site1.Target.Invoke(\n\
  \  <Main>o__SiteContainer0.<>p__Site1,\n  typeof(Console), answer);\n```\n\n动态类型并不是免费的。编译器必须生成大量的代码才能让\
  \ C# 中的动态调用工作。更糟糕的是，每当你调用动态 `Add()` 方法时，这段代码都会重复出现——而这种重复会对你的应用程序的大小和性能产生影响。\n\n\
  你可以将项目 43 中所示的 `Add()` 方法泛型化封装，创建一个将动态类型保留在受限位置的版本。通过这种方法，将生成相同的代码，但出现的次数会更少：\n\n\
  点击此处查看代码图像\n\n```csharp\nprivate static dynamic DynamicAdd(dynamic left,\n    dynamic\
  \ right) =>\n    left + right;\n\n// 封装它：\npublic static T1 Add<T1, T2>(T1 left,\
  \ T2 right)\n{\n    dynamic result = DynamicAdd(left, right);\n    return (T1)result;\n\
  }\n```\n\n编译器在泛型 `Add()` 方法中生成所有的动态调用点代码，将其隔离在一个位置中。此外，调用点变得简单了许多。以前每个结果都是动态的，而现在结果是静态类型的，以与第一个参数的类型匹配。当然，你可以创建一个重载来控制结果类型：\n\
  \n点击此处查看代码图像\n\n```csharp\npublic static TResult Add<T1, T2, TResult>\n    (T1 left,\
  \ T2 right)\n{\n    dynamic result = DynamicAdd(left, right);\n    return (TResult)result;\n\
  }\n```\n\n无论哪种情况，调用点都完全处于强类型世界中：\n\n点击此处查看代码图像\n\n```csharp\nint answer = Add(5,\
  \ 5);\nConsole.WriteLine(answer);\n\ndouble answer2 = Add(5.5, 7.3);\nConsole.WriteLine(answer2);\n\
  \n// 需要类型参数是因为\n// 参数类型不是同一种\nanswer2 = Add<int, double, double>(5, 12.3);\nConsole.WriteLine(answer);\n\
  \nstring stringLabel = System.Convert.ToString(answer);\nstring label = Add(\"Here\
  \ is \", \"a label\");\nConsole.WriteLine(label);\n\nDateTime tomorrow = Add(DateTime.Now,\
  \ TimeSpan.FromDays(1));\nConsole.WriteLine(tomorrow);\n\nlabel = \"something\"\
  \ + 3;\nConsole.WriteLine(label);\n\nlabel = Add(\"something\", 3);\nConsole.WriteLine(label);\n\
  ```\n\n前面的代码是项目 43 中相同的示例，但它包含了非动态的静态类型作为返回值。因此，调用者不需要处理动态类型对象。也就是说，调用者处理的是静态类型，安全地忽略了你为了让动态操作工作而执行的各种手段。事实上，他们不需要知道你的算法曾经离开过类型系统的保护。\n\
  \n在整个章节中，你已经看到动态类型应该被隔离在尽可能小的作用范围内。当代码需要使用动态功能时，示例依赖于动态的局部变量。然后方法将该动态对象转换为强类型对象，这样动态对象永远不会离开方法的作用范围。当你使用动态对象来实现算法时，你可以避免让动态对象成为你接口的一部分。\n\
  \n然而，有时问题的本质要求动态对象成为接口的一部分。但这仍然不是将一切都变成动态的借口：只有依赖动态行为的成员才应该使用动态对象。你可以在同一个 API 中混合使用动态和静态类型，但理想情况下，你应该尽可能创建静态类型的代码。只有在必须时才使用动态类型。\n\
  \n所有所有程序员在某些时候都必须处理不同形式的 CSV 数据。在 [`github.com/JoshClose/CsvHelper`](https://github.com/JoshClose/CsvHelper)\
  \ 提供了一个生产级的库。让我们来看一个基于此类数据的简化实现。下面的代码片段读取两个具有不同表头的 CSV 文件并显示项目。\n\n点击此处查看代码图像\n\n\
  ```csharp\nvar data = new CSVContainer(new System.IO.StringReader(csv));\nforeach\
  \ (var item in data.Rows)\n    Console.WriteLine($\"{item.Name}, {item.PhoneNumber}\"\
  );\n\ndata = new CSVContainer(new System.IO.StringReader(csv2));\nforeach (var item\
  \ in data.Rows)\n    Console.WriteLine($\"{item.Date}, {item.high}, {item.low}\"\
  );\n```\n\n这种风格更受普通读者欢迎。枚举数据返回的行包含属性。显然，行名在编译时是未知的，因此这些属性必须是动态的。但 `CSVContainer`\
  \ 中的其他部分都不需要动态的。`CSVContainer` 不支持动态。然而，`CSVContainer` 返回行的 API：\n\n点击此处查看代码图像\n\
  \n```csharp\npublic class CSVContainer\n{\n    class CSVRow : DynamicObject\n  \
  \  {\n        private List<(string, string)> values = new List<(string, string)>();\n\
  \        public CSVRow(IEnumerable<string> headers, IEnumerable<string> items)\n\
  \        {\n            values.AddRange(headers.Zip(items, (header, value) => (header,\
  \ value)));\n        }\n        public override bool TryGetMember(Binder binder,\
  \ out object result)\n        {\n            var answer = values.FirstOrDefault(n\
  \ => n.1 == binder.Name);\n            result = answer.2;\n            return result\
  \ != null;\n        }\n    }\n    private List<string> columnNames = new List<string>();\n\
  \    private List<CSVRow> data = new List<CSVRow>();\n    public CSVContainer(System.IO.TextReader\
  \ stream)\n    {\n        // 读取表头：\n        var headers = stream.ReadLine();\n \
  \       columnNames = (from header in headers.Split(',')\n                     \
  \  select header.Trim()).ToList();\n        var line = stream.ReadLine();\n    \
  \    while (line != null)\n        {\n            var items = line.Split(',');\n\
  \            data.Add(new CSVRow(columnNames, items));\n            line = stream.ReadLine();\n\
  \        }\n    }\n    public dynamic this[int index] => data[index];\n    public\
  \ IEnumerable<dynamic> Rows => data;\n}\n```\n\n由于空间限制，前面的示例省略了 `CSVContainer` 的其他功能。思考一下你将如何实现\
  \ `RowCount`、`ColumnCount`、`GetAt(row, column)` 以及其他 API。你脑海中的实现不会在 API 中使用动态对象，甚至在实现中也不会。你可以使用静态类型满足这些需求——并且你应该这样做。\n\
  \n\n\n\n动态类型是一个很有用的特性，即使在 C# 这样的静态类型语言中也是如此。但要意识到，C# 仍然是一门静态类型语言——并且要意识到大多数 C# 程序应该充分利用语言提供的类型系统。动态编程仍然很有用，但在\
  \ C# 中，只有当你将它限制在真正需要的地方，并立即将动态对象转换为不同的静态类型时，它才最有用处。当你的代码依赖于在另一个环境中创建的动态类型时，请将这些动态对象封装起来，并使用不同的静态类型提供一个公共接口。\n\
  \n## 6. 参与全球 C# 社区\n\nC# 语言被全球数百万开发者所使用。该社区创造了大量关于该语言的知识体系和常识。在 Stack Overflow 上，C#\
  \ 的问题与解答始终位列前十。语言团队也通过在 `GitHub` 上讨论语言设计为该社区做出贡献。此外，编译器以开源的基础上发布在 `GitHub` 上。你你也需要参与进来。成为社区的一员。\n\
  \n### 条目 48：寻求最佳答案，而不是最流行的答案\n\n流行编程语言社区面临的挑战之一，是随着新功能添加到语言中，不断演进实践方法。C# 团队继续向语言添加功能，以解决那些难以正确编写的惯用法。C#\
  \ 社区希望看到更多人采用这些新的实践。尽管如此，仍然存在大量工作推荐之前的模式。生产环境中的大量代码是用早期版本的语言编写的。这些产品中的示例代表了它们编写时的最佳实践。新的、更好的技术要成为搜索引擎和其他网站上最流行的选项，也需要时间。因此，你经常会发现，最流行的建议依赖于旧的技巧，而不是更现代、更好的选择。\n\
  \nC# 社区包含了一个庞大且多样化的开发者群体。好消息是，这个广阔的社区提供了丰富的信息，帮助你学习 C# 并提高你的编程技术。将你的问题输入任何搜索引擎，你将立即获得成百上千甚至上万个答案。优秀的答案需要时间来产生足够的人气，以便它们升到排名的最顶端。一旦它们出现在搜索结果的第一页，最流行的答案往往会挤掉更新的、更好的答案。\n\
  \nC# 社区的规模巨大意味着在线结果的变化速度非常缓慢。搜索解决方案的新开发者很可能会找到显示该语言两三个版本之前的最佳想法的优质答案。但事实上，这些过时答案的流行往往是添加新语言功能的动力。语言设计团队评估新功能，并添加那些对开发者日常工作影响最大的功能。以前需要的变通方案和额外代码往往正是添加这些新功能的原因。变通方案的流行表明了新功能的重要性；现在，轮到我们这些专业开发者来帮助这些特性流行化了。\n\
  \n一个相关的示例在*Effective C#（第三版）*的[条目 8] 中有所介绍。它指出，使用 `?.` 运算符调用委托或引发事件提供了一种线程安全的方法来检查\
  \ `null`，并在结果不为 `null` 时调用这些方法。初始化局部变量并在触发事件之前对其检查的实践有着悠久的历史，而这种过时的做法仍然是许多网站上显示的最流行方法。\n\
  \n绝大多数与文本输出协作的示例代码和生产代码使用过旧的位置语法来执行字符串格式化和替换。Effective C#（第三版）中的[条目 4] 和 [条目 5]\
  \ 涵盖了新的插值字符串语法。\n\n专业开发者应该尽所能地推广最好的现代技术。首先最重要的是，当你搜索答案时，要看向最流行的答案之外，寻找现代 C# 开发的*最佳*答案。做足够的研究，以确定哪个答案对于你的环境以及你必须支持的平台和版本是。\n\
  \n其次，一旦你找到了最佳答案，就支持它。这样更新的答案就会缓慢地升到顶部。\n\n第三，尽可能更新页面以引用更新的、更好的答案，使其成为最流行的答案。\n\n\
  最后，当你维护自己的代码库时，通过每次更新来让代码更好。查看你正在更新的代码，确定是否有重构它的机会——然后进行这些修复。你可能不会在一个冲刺中更新整个代码库，但小小的改进会积少成多。\n\
  \n遵循这些建议做一个良好的公民，你就能帮助 C# 社区的其他人找到现代问题的最佳答案。\n\n大型社区采用更新和更好的实践需要时间。有些可能会立即跃而出，另一些则要等多年。无论你和你的团队处于采用曲线的哪个位置，都可以通过推广开发的最佳答案来提供帮助。\n\
  \n### 条目 49：参与规范和代码\n\nC# 的开源性质不仅限于编译器代码。语言设计过程也是开放的。大量的资源可以帮助你继续学习和增长 C# 知识。访问这些资源是让你学习、保持更新以及参与\
  \ C# 持续进化的最佳方式。具体来说，你应该定期访问 `https://github.com/dotnet/roslyn` 和 `https://github.com/dotnet/csharplang`。\n\
  \n这种协作代表了 C# 社区的重大变化，但也为你提供了学习与同行互动的新方式。你有许多方式参与。\n\nC# 是一门开源语言，因此你可以自己构建编译器，并运行自己的\
  \ C# 编译器。你可以向语言开发者提交更改，甚至建议你自己的功能和增强。如果你有棒的想法，可以在你的 fork 中进行原型设计并提交拉取请求。\n\n这种社区参与方式可能需要你愿意付出的更多精力，但仍然有很多其他参与方式。如果你发现任何问题，请在\
  \ `GitHub` 上的 `Roslyn` 仓库报告它们。那里列出的开放问题表明了 C# 团队正在进行或计划的工作。这些问题涵盖了怀疑的 Bug、规范问题、新功能请求以及对语言的持续更新。\n\
  \n\n\n\n你也可以在 `CSharpLang` 仓库中找到任何新特性的规范。这些规范是你了解未来特性、并参与语言设计和演进的途径。所有规范都向大家开放评论和讨论。阅读其他社区成员的想法，参与讨论，并对你喜爱的语言的演进产生兴趣。新规范会在准备好进行评审时发布，其节奏随发布周期而变化。在发布版本规划的早期，发布的规范较多，随着发布接近最终阶段，发布的规范会较少。即使在早期阶段，你也可以通过每周阅读一或两个特性规范来跟上进度。规范的引用可以在\
  \ `CSharpLang` 仓库的“Proposals”（提案）文件夹中找到。每个提案都有一个跟踪其状态的“champion”（负责人）议题（issue）。这些议题也是你对活跃提案发表评论的地方。\n\
  \n除了规范之外，语言设计会议的纪要也会发布在 `CSharpLang` 仓库。阅读这些文档将让你更深入地了解语言中任何新特性背后的考量。你将了解到在成熟语言中添加任何新特性时所涉及的限制。语言设计团队会讨论任何新特性的积极和消面影响，权衡利弊，概述进度，并指出影响。你将了解到每个新特性预期的场景。这些笔记也开放了评论和讨论。贡献你的声音，对语言的演进产生兴趣。语言设计团队大约每月开一次会，笔记通常在每次会议后不久发布。阅读这些笔记不会花费你太多时间，但非常值得投入。会议纪要发布在\
  \ `CSharpLang` 仓库的“Meetings”（会议）文件夹中。\n\nC# 语言规范已转换为 markdown，并存储在 `CSharpLang`\
  \ 仓库中。如果你发现错误，可以进行评论、提交议题，甚至提交拉取请求（PR）。\n\n如果你觉得更有冒险精神，可以克隆 `Roslyn` 仓库并查看编译器的单元测试。你可以更深入地探索管理语言中任何特性的规则。\n\
  \n对于 C# 社区来说，从闭源实现（只有一小部分社区可以早期访问并参与讨论）转向面向整个 C# 社区的开源实现，是一个重大的变化。你应该参与进来。了解更多下几个发布中引入的特性。在你最感兴趣的地方积极投入。\n\
  \n### 事项 50：考虑使用分析器实现自动化实践\n\n*Effective C#, Third Edition* 以及本书都包含了关于编写更好代码的建议。实现这些许多建议可以通过应用使用\
  \ `Roslyn` APIs 构建的分析器和代码修复（code fixes）来支持。这些 APIs 允许插件在语义级别分析代码并修改这些代码以引入更好的实践。\n\
  \n好消息是，你可能不需要自己写那些分析器。有几个开源项目为各种实践提供了分析器和代码修复。\n\n一个非常流行的项目由 `Roslyn` 编译器团队构建。`Roslyn\
  \ Analyzers` 项目 ([`github.com/dotnet/roslyn-analyzers`](https://github.com/dotnet/roslyn-analyzers))\
  \ 最初是团队验证静态分析 APIs 的方式。从那时，它增长到包含了对 `Roslyn` 团队使用的许多常用准则的自动验证。\n\n另一个流行的库是 `Code\
  \ Cracker` 项目 ([`github.com/code-cracker/code-cracker`](https://github.com/code-cracker/code-cracker))。该项目由\
  \ .NET 社区成员创建，反映了他们对编写代码最佳实践的思考。该分析器提供了 C# 和 VB.NET 两个版本。\n\n另一组社区成员创建了一个 GitHub\
  \ 组织并编写了一系列分析器以实现不同的建议。访问 `.NET Analyzers` 组织页面 ([`github.com/DotNetAnalyzers`](https://github.com/DotNetAnalyzers))\
  \ 了解更多信息。这些开发者为不同的应用程序类型和库创建了分析器。\n\n在安装任何这些分析器之前，请研究它们强制执行哪些规则，以及它们在执行这些规则时有多严格。分析器可以以信息、警告甚至错误的形式报告规则违规。此外，不同的分析器对不同规则可能有不同的意见。规则之间可能会相互冲突。你可能会发现修复一个违规会触发另一个分析器识别出违规。（例如，某些分析器倾向于使用用\
  \ `var` 声明的隐式类型变量，而其他分析器则倾向于显式命名每个变量的类型。）许多分析器提供了配置选项，允许你决定哪些规则将被强制执行，哪些将被忽略。使用这些选项创建适合你自己的配置。在此过程中，你也将了解到更多关于每个分析器的规则和实践。\n\
  \n如果你有想要遵循但尚未找到对应分析器的实践，可以考虑构建你自己的分析器。`Roslyn Analyzers` 仓库中的分析器是开源的，为构建分析器提供了极佳的模板。构建分析器是一个高级主题，需要对\
  \ C# 语法和语义分析有深入的理解。尽管如此，编写一个简单的分析器也可以让你对 C# 语言有更深入的见解。要开始的话，你可以探索我用来解释这些技术的仓库。该仓库位于\
  \ GitHub ([`github.com/BillWagner/NonVirtualEventAnalyzer`](https://github.com/BillWagner/NonVirtualEventAnalyzer))，向你展示如何构建一个查找并替换虚拟事件的分析器（参见\
  \ Item 21）。每个数字分支显示了分析和修复代码的步骤。\n\n用于分析和代码修复的 Roslyn APIs 支持你想要强制的任何代码实践的自动验证。团队和社区已经构建了丰富的分析器并供你使用。如果这些分析器没有一个满足你的需求，你可以尝试构建自己的。这是一项高级技术，但它将帮助你获得更深入的\
