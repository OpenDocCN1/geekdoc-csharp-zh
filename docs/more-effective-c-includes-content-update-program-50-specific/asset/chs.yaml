  \nC# 仍在不断进化和变化。随着它的发展，围绕它的社区也在发生变化。现在更多开发者将 C# 语言作为他们的第一种专业编程语言。这些社区成员没有像我们这些在拥有多年\
  \ C 类语言经验后才开始使用 C# 的人那样，存在常见的刻板印象。即使对于那些使用 C# 多年的开发者来说，最近的这种速度也带来了养成许多新习惯的需求。自从编译器开源以来，C#\
  \ 语言的创新速度特别加快。对 C# 语言提议功能的评审现在包含了整个社区，而不仅仅是一小部分语言专家。社区成员也可以参与新功能的设计。\n\n在组织本版《More\
  \ Effective C#》时，我考虑了语言的变化以及 C# 社区的变化。《More Effective C#》并不会带你回溯语言变化的历史历程，而是提供如何使用当前\
  \ C# 语言的建议。本版中移除的项目是那些在当今的 C# 语言或当今的应用程序中已不再那么紧要的内容。新增条目则涵盖了新的内容。\n\n\n\n\n\n编程本质上是\
  \ API 设计。它是你向用户传达对代码使用期望的方式。它也充分体现了你对其他开发者需求和期望的理解。在第 2 章中，你将学习使用 C# 语言丰富的特性来表达你意图的最佳方法。你将看到如何利用延迟求值、创建可组合接口，并在公共接口中避免各种语言元素之间的混淆。\n\
  \n基于任务的异步编程为从异步组件构建应用程序提供了新的惯用法。掌握这些特性意味着你可以为异步操作创建 API，清晰地反映代码的执行方式，并且易于使用。在第 3\
  \ 章中，你将学习如何使用基于任务的异步语言支持来表达代码如何在多个服务和使用不同资源的情况下执行。\n\n第 4 章探讨了异步编程的一个特定子集：多线程并行执行。你将看到\
  \ `PLINQ` 如何能够更容易地在多个核心和多个 CPU 上分解复杂算法。\n\n第 5 章讨论了将 C# 作为动态语言的使用。C# 是一种强类型、静态类型语言。然而，今天，越来越多的程序同时包含动态和静态类型。C#\
  \ 为你提供了方法，让你利用动态编程惯用法，而不会丢失整个程序中静态类型的好处。在第 5 章中，你将学习如何使用动态特性，以及如何避免动态类型泄漏到整个程序中。\n\
  \n第 6 章以关于如何参与全球 C# 社区的建议作为结尾。有很多方法可以参与这个社区，并帮助塑造你每天使用的语言。\n\n### 代码规范\n\n在书中展示代码仍然需要在空间和清晰度之间做出一些妥协。我尝试精简示例以说明示例的特定点。这通常意味着省略类或方法的其他部分。有时意味着为了节省空间而省略了错误恢复代码。公共方法应该验证其参数和其他输入，但由于空间限制，这些代码通常在这里省略了。类似的空间考虑也促使删除了方法调用验证以及\
  \ `try`/`finally` 子句，这些通常包含在复杂的算法中。\n\n我通常还假设，当示例使用常用命名空间时，大多数开发者都能找到相应的命名空间。你可以安全地假设每个示例都隐式包含了以下\
  \ `using` 语句：\n\n点击此处查看代码图像\n\n```c\nusing System;\n\nusing static System.Console;\n\
