  \        {\n                integers[i] = i + 100;\n            }\n            //\
  \ 输出每个元素的值\n            for (int j = 0; j < 10; j++)\n            {\n          \
  \      Console.WriteLine(\"element[{0}] = {1}\", j, integers[j]);\n            }\n\
  \        }\n    }\n}\n```\n\n## 字符串\n\n类与对象\n\n\n\n\n\n## 类定义\n\n类是对象的定义表示形式。类定义了一种数据类型。在\
  \ C# 编程中，类定义以 `class` 关键字开头，随后是类名以及类体体。类体允许在类中使用访问修饰符来定义成员的访问规则，而 C# 编程中类的默认访问修饰符是\
  \ `internal`。成员也使用 `.` 运算符。\n\n类也被认为引用类型，变量在声明后包含评估为 `null` 的值，直到我们创建并实例化它。类通过使用\
  \ `new` 运算符来声明，并遵循下述的语法：\n\n```csharp\nPublic class student\n{\n    // 属性，方法和结构\n\
  }\n```\n\n示例：\n\n```java\nMyclass student = new myclass();\nMyclass student2 = student;\n\
  包含不同数据成员和函数的类\n```\n\n```csharp\npublic class student\n{\n    public int id = 0;\n\
  \    public string named = string.empty;\n    public student()\n    {\n        //\
  \ 构造函数语句\n    }\n    public void getstudentdetails(int uid, string uname)\n    {\n\
  \        id = uid;\n        named = name;\n        Console.WriteLine(\"id: {0},\
  \ name: {1}\", id, named);\n    }\n    public int designation { get; set; }\n  \
  \  public string location { get; set; }\n}\n```\n\n## 创建对象\n\n在 C# 编程中，对象完全基于类。类定义了对象的类型。它也被称为实例化类，可以使用以下语法创建：\n\
  \n```csharp\nStudent object1 = new student();\n```\n\n一旦创建了实例化类，引用的对象将被自动返回。例如：\n\
  \n```csharp\nStudent object2 = new student();\nStudent object3 = object2;\n```\n\
  \n以下程序展示了在 C# 编程语言中如何创建对象：\n\n1. 使用 `system;`\n2. Namespace Ut\n{\n3. Class Program\n\
  {\n4. Static void main(string[] args)\n{\nUser user = new User(\"harry potter\"\
  , 2);\nUser.userdetails();\nConsole.WriteLine(\"press enter to exit..\");\nConsole.read();\n\
  }\n}\n}\nPublic class Users\n{\nPublic string named { get; set; }\nPublic int aged\
