  \nobj = category(2000, 'mercedes')\nobj.display()\n```\n\n输出：`2000 mercedes`\n\n\
  要覆盖基类中的任何方法，我们可以在派生类中定义一个具有命名参数的新方法。语法为：\n\n```python\nclass parent:\n    # 父类\n\
  \    def display(self):\n        print('this is parent')\n\nclass child(parent):\n\
  \    # 派生类\n    def display(self):\n        print('this is derived')\n\nobj = child()\n\
  obj.display()\n```\n\n### 正则表达式\n\n在 Python 编程中，正则表达式用于从文档、日志文件、电子表格或代码等文本提取信息。正则表达式是以特殊顺序排列的字符，允许程序员使用专门语法查找相关的序列字符或字符串集。在\
