  \ age);\n}\n}\n```\n\n## 继承与多态\n\n继承是面向对象语言的重要部分，允许程序员使用需要相同功能的不同类，继承在父类和子类的方法中。父类被视为基类，而派生类从其父类继承所有功能。\n\
