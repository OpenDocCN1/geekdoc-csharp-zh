  \ 将帮助你在这 Python 编程方面打下坚实的基础。\n\n## 第八章：HTML\n\n### 介绍与概述\n超文本标记语言（HTML）是一种用于创建网站以显示颜色、字体、图片、媒体和图像的标准标记语言。HTML\
  \ 由不同的标签组成，这些标签可以描述网页的结构并告诉浏览器在互联网上显示内容。\n\n### 什么是标签？\n标签向浏览器提供有关任何网页结构、显示和内容的指令。它们通过闭合的角括号\
  \ `<>` 定义：标签由属性和元素组成。元素是网页上的一个对象，而属性描述了该元素的细节。记住标签是成对使用的：开始标签和结束标签。\n\n你使用标签创建的第一个示例\
  \ HTML 页面如下：\n\n```html\n<html>\n<head>\n<body>\n<h1>my heading</h1>\n<p>my paragraph</p>\n\
  </body>\n</html>\n```\n\n### 标签说明\n在上述的 HTML 文档中，`<html>` 标签封装了整个文档，并包括 `<head>`、`<body>`\
  \ 和 `<p>` 等其他主要标签。`<head>` 标签代表文件的头部，其中 `<title>` 标签用于显示文档标题。`<body>` 包含了其他用于创建页面的标签，如\
  \ `<h1>` 和 `<p>`。\n\n\n\n\n\n每个 HTML 文档在 `<body>` 标签后都应该以一个 `title`、`heading` 和\
  \ `paragraph` 开始，下一个要使用的主要标签是 `<h1>` 标题标签。根据你的内容需求，可以使用 `<h1>` 到 `<h6>` 定义的标题标签，例如：\n\
  \n### 标题 (Headings)\n```html\n<html>\n<body>\n<h1>first heading</h1>\n<h2>second\
  \ heading</h2>\n<h3>third heading</h3>\n<h4>fourth heading</h4>\n<h5>fifth heading\
  \ </h6>\n<h6>sixth heading </h6>\n</body>\n</html>\n```\n输出：![image_rsrc9FJ.jpg](img/image_rsrc9FJ.jpeg)\n\
  \n### 段落 (Paragraph)\n)\n为了添加内容，我们需要在 HTML 文档中包含段落。例如：\n\n```html\n<html>\n<head>\n\
  <h1>heading</h1>\n</head>\n<body>\n<p>first paragraph</p>\n<p>second paragraph</p>\n\
  </body>\n</html>\n```\n输出：标题\n第一段落\n第二段落\n\n为了在每个段落之间添加换行，我们可以使用换行标签 `<br>`。\n\n\
  ### 摘要 (Summary)\n要为段落添加摘要，带有 `summary` 标签的 HTML 语法定义如下：\n\n```html\n<details>\n\
  <summary>sampled text</summary>\n<p>we development tutorials</p>\n</details>\n```\n\
  \n### 跨元素 (Span)\n`<span>` 标签用于为文本特定部分上色。例如：\n\n```html\n<p>we development <span\
  \ style=\"color:red\">interesting</span> learned</p>\n```\n\n### 选择框 (Select)\n\
  `<select>` 标签用于从下拉列表中选择一个选项。例如：\n\n```html\n<select>\n<option value=\"red\">red</option>\n\
  <option value=\"blue\">blue</option>\n<option value=\"green\">green</option>\n<option\
  \ value=\"white\">white</option>\n</select>\n```\n\n### 表格 (The)\n`<thead>` 标签用于创建头部内容，并与\
  \ `<tbody>` 和 `<footer>` 元素一起使用。例如：\n\n```html\n<table>\n  <thead>\n    <tr>\n \
  \     <th>course</th>\n      <th>max marks</th>\n    </tr>\n  </thead>\n  <tbody>\n\
  \    <tr>\n      <td>engineering</td>\n      <td>85</td>\n    </tr>\n    <tr>\n\
  \      <td>english</td>\n      <td>90</td>\n    </tr>\n  </tbody>\n  <footer>\n\
  \    <tr>\n      <td>80</td>\n    </tr>\n  </footer>\n</table>\n```\n![image_src9FK.jpg](img/image_src9FK.jpeg)\n\
  \n### 格式化标签 (Formatting tags)\nHTML 文档中的文本可以格式化为不同的样式、字体和大小。格式化标题、段落和表格的标签如下：\n\n\
  #### 粗体 (Bold)\n写在 `<b>` 标签之间的任何文本将以粗体显示。例如：\n\n```html\n<p><b>development</b></p>\n\
  ```\n输出：development\n\n#### 斜体 (Italic)\n写在 `<i>` 标签之间的任何文本将以斜体显示。例如：\n\n```html\n\
  <p><i>development</i></p>\n```\n输出：development\n\n#### 上标/下标 (Superscript/subscript)\n\
  要以上标显示内容，使用 `<sup>` 和 `<sub>` 标签，例如：\n\n```html\n<p>this <sup>superscript</sup>scripts</p>\n\
  ```\n输出：this superscript(scripts)\n\n#### 下划线 (Underline)\n写在 `<u>` 标签之间的文本带有下划线：\n\
  \n```html\n<p><u>sampled text</u></p>\n```\n输出：sampled text\n\n#### 插入和删除标签 (Insert\
  \ and deleted tags)\n要插入，使用 `<ins>` 和 `<del>` 标签；要删除任何文本，使用 `<del>` 标签。\n\n```html\n\
  <ins>inserted</ins><del>deleted</del>\n```\n\n### 链接 (Link)\n要在文本中添加链接，我们使用以下标签：\n\
  \n```html\n<p><a href=\"document location\">document</a></p>\n```\n\n### 幕灯标签 (Marquee\
  \ tag)\n`<marquee>` 标签可以使用不同的属性，包括 `width`、`height`、`direction`、`behavior`、`scrollamount`、`scrolldelay`、`loop`、`bgcolor`、`hspace`\
  \ 和 `vspace`。幕灯标签的演示：\n\n```html\n<html>\n<head>\n<title>html marquee tag</title>\n\
  </head>\n<body>\n<marquee>sampled text</marquee>\n</body>\n</html>\n```\n\n### 容器标签\
  \ (Container tags)\n在 html 中，以下容器标签用于格式化文本：\n\n#### 开始标签 | 结束标签 | 功能 |\n| :--- |\
  \ :--- | :--- |\n| `<p>` | `</p>` | 段落 |\n| `<span>` | `</span>` | 在段落内添加行内内容 |\n\
  | `<em>` | `</em>` | 用于强调文本 |\n| `<ol>` | `</ol>` | 有序列表（数字） |\n| `<ul>` | `</ul>`\
  \ | 无序列表（符号） |\n| `<li>` | `</li>` | 列表项目 |\n\n### 表格 (Tables)\n表格、图像和框架用于以 HTML\
  \ 方式格式化信息。创建表格的标签为：\n\n```html\n<table>\n  <thead>\n    <tr>\n      <th>header</th>\n\
  \    </tr>\n  </thead>\n  <tbody>\n    <tr>\n      <td>...</td>\n    </tr>\n  </tbody>\n\
  </table>\n```\n```\n\n### 图像 (Images)\n图像是任何网站不可或缺的部分，用于更好地说明信息。插入图像：\n\n```html\n\
  <img src=\"image url\" ../>\n<img src=\"desktop/image1.png\" alt=\"sampled image\"\
  />\n```\n要设置图像特定的高度和宽度，我们使用了：\n\n```html\n<img src=\"desktop/image1.png\" alt=\"\
  sampled image\" width=\"100\" height=\"100\"/>\n```\n\n### 视频 (Videos)\n要在 HTML\
  \ 页面添加视频，使用带有以下语法的 `<video>` 标签：\n\n```html\n<video>\n  <source src=\"samplevideo.mp4\"\
  \ type=\"video/mp4\">\n</video>\n```\n\n### 对齐和边框 (Alignment and border)\n网页上有三个对齐位置，即居中、右对和左对。为此，我们使用了\
  \ `align` 属性。例如：\n\n```html\n<img src=\"desktop/image1.png\" alt=\"sampled image\"\
  \ align=\"center\"/>\n```\n\n\n\n\n\n## 图像\n\n为了创建图像，使用了以下 HTML 标签：\n\n`img`\n\n\
  `img` 标签需要 `src` 和 `alt` 属性。例如：\n\n```html\n<img src=\"image_src9FM.jpg\" alt=\"\
  image\">\n```\n\n## 表单\n\nHTML 表单具有用于处理用户交互的属性。创建表单的语法为：\n\n`<form action=\"url\"\
  \ method=\"get|post\">`\n\n表单中包含的元素：\n\n| `a` | `abbr` | `acronym` | `address` |\
  \ `applet` |\n| :--- | :--- | :--- | :--- | :--- |\n| `area` | `article` | `aside`\
  \ | `audio` | `b` |\n| `base` | `basefont` | `bdi` | `bdo` | `big` |\n| `blockquote`\
  \ | `body` | `br` | `button` | `canvas` |\n| `caption` | `center` | `cite` | `code`\
  \ | `col` |\n| `colgroup` | `data` | `datalist` | `dd` | |\n| `del` | | | | |\n\
  | `details` | `dfn` | `dialog` | `dir` | `div` |\n| `dl` | `dt` | `em` | `embed`\
  \ | `fieldset` |\n| `figcaption` | `figure` | `font` | `footer` | `form` |\n| `frame`\
  \ | `frameset` | `h1`-`h6` | `head` | `header` |\n| `hr` | `html` | `i` | `iframe`\
  \ | `img` |\n| `input` | `ins` | `kbd` | `label` | `legend` |\n| `li` | `link` |\
  \ `main` | `map` | `mark` |\n| `meta` | `meter` | `nav` | `noframes` | `noscript`\
  \ |\n| `object` | `ol` | `optgroup` | `option` | `output` |\n| `p` | `param` | `picture`\
  \ | `pre` | `progress` |\n| `q` | `rp` | `rt` | `ruby` | `s` |\n| `samp` | `script`\
  \ | `section` | `select` | `small` |\n| `source` | `span` | | `strong` | `style`\
  \ |\n| `sub` | `summary` | `sup` | `svg` | `table` |\n| `tbody` | `td` | `template`\
  \ | `textarea` | `tfoot` |\n| `th` | `thead` | `time` | `title` | `tr` |\n| `track`\
  \ | `tt` | `u` | `ul` | `var` |\n| `video` | `wbr` | | | |\n\n表单具有用于处理用户交互的属性。表单中包含的元素有输入字段、按钮。创建表单的语法为：\n\
  \n`<form action=\"url\" method=\"get|post\">`\n\n表单中包含的元素：\n\n```html\n<<html>\n\
  <head>\n<title>my form</title>\n</head>\n<body>\n<form>\n<input type=\"text\" name=\"\
  first\">\n<br>\n<input type=\"text\" name=\"last\">\n</form>\n</body>\n</</html>\n\
  ```\n\n## 按钮控件\n\n在表单中有多种提交数据的方法，使用以下 HTML 标签创建可点击按钮：\n\n```html\n<input type=\"\
  submit\" name=\"submit\">\n<input type=\"reset\" name=\"reset\">\n<input type=\"\
  button\" name=\"button\">\n```\n\n## 选择框\n\n为了在表单中创建下拉列表，我们使用 `<select>` 和 `<option>`\
  \ 元素。例如：\n\n```html\n<html>\n<head>\n<title>field upload box</title>\n</head>\n\
  <body>\n<form>\n<label for=\"course\">course:</label>\n<select name=\"course\" id=\"\
  course\">\n<option value=\"webengineering\">web engineering</option>\n<option value=\"\
  calculus\">calculus</option>\n<option value=\"datascience\">data science</option>\n\
  </select>\n</form>\n</body>\n</html>\n```\n\n`select` 元素为 HTML 中的下拉列表提供了选项。例如：\n\
  \n```html\n<html>\n<head>\n<title>select</title>\n</head>\n<body>\n<form>\n<select>\n\
  <option value=\"math\">math</option>\n<option value=\"physics\">physics</option>\n\
  </select>\n</form>\n</body>\n</html>\n```\n\n\n\n\n\n## 标记文本\n\n写在 `<mark>` 和 `</mark>`\
  \ 元素之间的文本将以黄色标记显示。\n\n例如：\n\n`<p>this text is marked as yellow</p>`\n\n输出：this text\
  \ is marked as yellow.\n\n## 元标签\n\n在 HTML 中，meta 标签可以用于为你的网页添加元数据。meta 标签的属性包括\
  \ `name`、`content`、`scheme` 和 `http-equiv`。我们可以使用 `<meta>` 标签为文档提供简短描述，这也可以提高你网页的搜索引擎索引。\n\
  \n例如：\n\n```html\n<html>\n\n<head>\n\n<title>meta tags example</title>\n\n<meta\
  \ name=\"keywords\" content=\"html, meta tags, metadata\"/>\n\n<meta name=\"description\"\
  \ content=\"meta tags.\"/>\n<meta name=\"revised\" content=\"3/7/2019\"/>\n<meta\
  \ http-equiv=\"cookie\" content=\"userid=abc; expires=Monday, 08-Sep-19 23:59:59\
  \ GMT;\"/>\n</head>\n\n<body>\n\n<p>welcomed to html</p>\n\n</body>\n\n</html>\n\
  ```\n\n## 注释\n\n要在 HTML 代码中放置注释，应遵循以下语法：\n\n```html\n<html>\n\n<head><!-- document\
  \ header starts -->\n\n<title>document title</title>\n\n</head><!-- document header\
  \ ends -->\n\n<body>\n\n<p>document content goes here...</p>\n\n</body>\n\n</html>\n\
  ```\n\n## HTML 样式表\n\n为了对 HTML 文档进行更进一步的设计，层级样式表 (CSS) 被应用于每个网站。它们为提供了一种简单、有效且易于管理的替代方案，用于为每个网站指定某些属性。我们将在下一章中详细讨论\
  \ CSS。\n\n### 布局与响应式\n\nHTML 包含了各种类型的语义元素，用于定义网页的不同部分。这些元素包括 header、container、section、article、aside、details\
  \ 和 footer。虽然 CSS 是设计网页布局的最佳方法，但我们也可以通过这些 HTML 元素完成该过程。\n\n响应式网页设计是通过使用 HTML 和 CSS\
  \ 创建的。这一过程会自动调整网站的尺寸和布局，使其在桌面电脑、智能手机和平板电脑等所有设备上看起来都很合适。关于响应式的更多细节，学习 CSS 和 Bootstrap\
  \ 将是一个巨大的优势。\n\nHTML 模板\n\nHTML 模板提供了一种快速简便开发网站的方法。使用 HTML 模板允许开发者修改和添加所需的功能。使用\
  \ HTML 模板最大的优势是，它们非常适合那些无法设计吸引人的网站的人，并且可以根据给定的指令进行定制。\n\n使用 HTML 的实用提示\n\n在讨论了 HTML\
  \ 的所有标签、属性和功能之后，请记住在使用起始标签时，始终在元素和属性之前编写相应的结束标签。例如 `<p>...</p>`，这将确保你的 HTML 页面在所有浏览器中都能正常工作，并尝试通过\
  \ CSS 为你的页面设置样式。\n\n在编写完所有网页的 HTML 代码后，在发布到互联网之前运行 HTML 验证器。此活动将显示任何错误或缺失的标签，以免你的网站在在线发布时缺少功能。此外，注意图像或视频的格式，因为它们在上传到互联网时有时会被破坏；在图像标签中指定宽度和高度可以帮助你克服这个问题。\n\
  \n虽然表格是可以在页面上布局内容的一种简单方法，但你应该关注 CSS 规则并通过 CSS 构建页面内容。这不仅能以更好的方式格式化你的网站，你还可以受益于 CSS\
  \ 定位并提高网站的响应式。\n\n## 第九章：CSS\n\n### 什么是 CSS？\n\nCSS 代表“cascading stylesheet”（层级样式表），负责控制文档的样式和外观。CSS\
  \ 通过控制颜色、字体和间距来允许网站的设计和布局。学习 CSS 和 Bootstrap 将提供更多的灵活性。\n\n\n\n\n\n内部 CSS 是为了给每个\
  \ HTML 文档提供独特而实现的。请记住，每个规则必须定义在 HTML 文件的 `head` 区域内。\n\n### 实现内部 CSS 的语法：\n\n```html\n\
  <head>\n  <title>internal css</title>\n  <style>\n    selector {\n      property:value;\n\
  \    }\n  </style>\n</head>\n```\n\n### 外部 CSS\n\n外部 CSS 有一个独立的文件，其中仅包含属性以及一个样式属性。外部\
  \ CSS 文件需要使用 `link` 标签与 HTML 文档关联。\n\n#### 外部 CSS 示例：\n\n```css\nbody {\n  background-color:green;\n\
  }\n\n.main {\n  Text-align:center;\n}\n\n.gfg {\n  color:#009900;\n  font-size:50px;\n\
  \  font-weight:bold;\n}\n```\n\n### 基础语法和在 HTML 中的引入\n\nCSS 由若干样式规则组成，这些规则由浏览器解释并应用于网页。通常，每个规则由三个关键元素组成：选择器（selector）、属性（property）和值（value）。\n\
  \n选择器和 HTML 标签都有 CSS 样式并可以应用于如 `<h1>` 等处，其中属性被赋予 HTML 标签（如 `color`）。值被分配给属性。创建 CSS\
  \ 样式规则的基础语法定义如下：\n\n```css\nselector{property:value}\n```\n\n通常使用内联 CSS 和外部 CSS\
  \ 方法将样式与 HTML 文档关联，其中 `<style>` 元素放置在 `<head>` 和 `</head>` 标签之间。HTML 文档中引入 CSS 的语法定义如下：\n\
  \n```html\n<html>\n<head>\n  <link rel=\"stylesheet\" type=\"text/css\" media=\"\
  all\">\n  <style>\n    body {\n      background-color:grey;\n    }\n    h1 {\n \
  \     color:white;\n      margin-left:40px;\n    }\n  </style>\n</head>\n<body>\n\
  \  <h1>Sample heading</h1>\n  <p>Sample paragraph</p>\n</body>\n</html>\n```\n\n\
  ![image_src9FU.jpg](img/image_src9FU.jpeg)\n\n### 导入 css 文件\n\n要导入外部样式表，必须在 `<head>`\
  \ 中实现以下规则：\n\n```html\n<head>\n  @import url(\"style\");\n</head>\n```\n\n### 背景颜色\n\
  \n背景颜色通过不同的名称来指定颜色，可能使用的格式如下：\n\n| 名称 | 关键字 | Hex 代码 | Rgb | Rgb absolute |\n| :---\
  \ | :--- | :--- | :--- | :--- |\n| Green | `#008000` | `rgb(0,128,0)` | `#rgb` |\n\
  \n例如，我们使用以下语法定义级联表：\n\n```css\nh1{color:green}\n```\n\n### 背景颜色\n\n设置页面背景颜色使用以下语法：\n\
  \n```css\nbody {\n  background-color:grey;\n}\n```\n\n### 背景图像\n\n添加背景图像的语法：\n\n\
  ```css\nbody {\n  background-image:url(\"image.gif\");\n}\n```\n\n重复图片：\n\n```css\n\
  body {\n  background-image:url(\"gradient_image.gif\");\n}\n```\n\n不重复：\n\n```css\n\
  body {\n  background-image:url(\"image_bike.jpg\");\n  background-repeat:no-repeat;\n\
  }\n```\n\n### 背景位置\n\n背景图像可以设置为不同的位置，如右、左、中心、顶和底。例如：\n\n```css\nbody {\n  background-image:url(\"\
  image.jpg\");\n  background-position:center;\n}\n```\n\n### 格式与设计\n\n#### 边框\n\n\
  `border` 属性用于设置 HTML 文档元素边框的独特样式、颜色和宽度。使用 CSS 创建边框的不同样式包括点线（dotted）、实线（solid）、虚线（dashed）、槽纹（groove）、双线（double）、内嵌（inset）、外嵌（outset）、隐藏（hidden）、脊起（ridge）和无（none）。\n\
  \n创建不同边框样式的语法：\n\n```css\n.dotted{border-style:dotted}\n.solid{border-style:solid}\n\
  .dashed{border-style:dashed}\n.groove{border-style:groove}\n.double{border-style:double}\n\
  .inset{border-style:inset}\n.outset{border-style:outset}\n.hidden{border-style:hidden}\n\
  .ridged{border-style:ridge}\n.none{border-style:none}\n```\n\n#### 高和宽\n\n在 CSS\
  \ 中，`height` 和 `width` 属性用于设置元素的高度和宽度。定义如下：\n\n```css\ndiv {\n  height:200px;\n\
  \  width:50%;\n  background-color:green;\n}\n```\n\n#### 外边距 (Margin)\n\n`margin`\
  \ 使用以下语法设置页面的字体大小：\n\n```css\nbody {\n  margin:0;\n}\n```\n\n#### 内边距 (Padding)\n\
  \n`padding` 用于设置页面的字体大小。语法为：\n\n```css\nh1{color:green}\n}\n```\n\n#### 字体\n\n`font-family`\
  \ 属性用于定义字体。现场演示：\n\n```html\n<html>\n<head>\n</head>\n<body>\n  <p style=\"font-family:calibri;\"\
  >this text is calibri</p>\n</body>\n</html>\n```\n\n\n\n\n\n![image_rsrc9FV.jpg](img/image_rsrc9FV.jpeg)\n\
  \n## 文本\n\n现在可以使用 CSS 属性将文本转换为不同的颜色、样式和缩进。这些属性包括：\n\n* `Text color`文本颜色：更改文本的颜色。\n\
  * `Text alignment`文本对齐：指定文本的水平或垂直对齐。\n* `Text decoration`文本装饰：规定文本的装饰样式。\n* `Text\
  \ transformation`文本转换：控制文本的大小写转换。\n* `Text indentation`文本缩进：指定第一行的缩进。\n* `Letter\
  \ spacing`字母间距：增加或减少字母之间的间距。\n* `Line height`行高：指定行高。\n* `Text direction`文本方向：设置书方向。\n\
  * `Word spacing`单词间距：指定单词之间的间距。\n* `Text shadow`文本阴影：为文本添加阴影效果。\n\n## CSS 文本属性语法：\n\
  \n### 文本颜色：\n```css\nBody {\n  color: red;\n}\n```\n\n### 文本对齐：\n```css\nH1 {\n\
  \  text-align: center;\n}\n\nH2 {\n  text-align: left;\n}\n\nH3 {\n  text-align:\
  \ right;\n}\n```\n\n### 文本装饰\n```css\nH1 {\n  text-decoration:overline/underline/line-through;\n\
  }\n```\n\n### 文本转换\n```css\nP.uppercased {\n  text-transform: uppercase;\n}\n\n\
  P.lowercased {\n  text-transform: lowercase;\n}\n\nP.capitalized {\n  text-transform:\
  \ capitalize;\n}\n```\n\n### 文本缩进\n```css\nP {\n  text-indent: 100px;\n}\n```\n\n\
  ### 字母间距\n```css\nH1 {\n  letter-spacing: 3px;\n}\n\nH2 {\n  letter-spacing: -3px;\n\
  }\n```\n\n### 行高\n```css\nP.small {\n  line-height: 0.6;\n}\n\nP.big {\n  line-height:\
  \ 1.6;\n}\n```\n\n### 文本方向\n```css\nP {\n  direction: rtl;\n}\n```\n\n### 文本阴影\n\
  ```css\nH1 {\n  text-shadow: 4px 3px green;\n}\n```\n\n### 单词间距\n```css\nH1 {\n\
  \  word-spacing: 10px;\n}\n\nH2 {\n  word-spacing: -5px;\n}\n```\n\n## 链接、表格与外边距\n\
  \n### 链接\n这里是通过 CSS 实现超链接的不同 CSS 属性。这些属性包括：`:link`, `:visited`, `:hover` 和 `:active`。实现\
  \ `link` 属性的 CSS 语法定义如下：\n\n```html\n<style type=\"text/css\">\n  A:link {color:\
  \ #000000}\n  A:visited {color: #006600}\n  A:hover {color: #ffcc00}\n  A:active\
  \ {color: #ff00cc}\n</style>\n```\n\n### 表格\n这里是用于转换和设计 HTML 表格的不同 CSS 属性。\n\n*\
  \ Border-collapse（边框合并）\n* Border-spacing（边框间距）\n* Caption side（标题对齐）\n* Empty cells（空单元格）\n\
  * Table layout（表格布局）\n\n### 使用 CSS 创建简单表格的语法：\n```html\n<html>\n<body>\n  <table\
  \ class=\"table\" border=\"1\">\n    <tr>\n      <th>first name</th>\n      <th>last\
  \ name</th>\n      <th>marks</th>\n    </tr>\n    <tr>\n      <td>john</td>\n  \
  \    <td>harry</td>\n      <td>40</td>\n    </tr>\n  </table>\n</body>\n</html>\n\
  ```\n\n**输出：**\n![image_rsrc9FW.jpg](img/image_rsrc9FW.jpeg)\n\n### Border-collapse（边框合并）\n\
  ```html\n<html>\n<head>\n  <style type=\"text/css\">\n    table.one{border-collapse:\
  \ collapse;}\n    table.two{border-collapse: separate;}\n    table.ad{border: dotted;\
  \ width: 3px; color: #000; padding: 10px;}\n    table.bd{border: solid; width: 3px;\
  \ color: #33333; padding: 10px;}\n  </style>\n</head>\n<body>\n  <table class=\"\
  one\" border=\"1\">\n    <td>john</td>\n    <td>harry</td>\n    <td>40</td>\n  </table>\n\
  \  <table class=\"two\" border=\"1\">\n    <tr>\n      <td>john</td>\n      <td>harry</td>\n\
  \      <td>40</td>\n    </tr>\n    <tr>\n      <td>john</td>\n      <td>harry</td>\n\
  \      <td>40</td>\n    </tr>\n  </table>\n</body>\n</html>\n```\n\n### Caption\
  \ sided（标题对齐）\n`caption-side` 属性的语法：\n```html\n<head>\n  <style type=\"text/css\"\
  >\n    .top{caption-side: top;}\n    .bottom{caption-side: bottom;}\n    .left{caption-side:\
  \ left;}\n    .right{caption-side: right;}\n  </style>\n</head>\n```\n使用该属性的语法：\n\
  ```html\n<head>\n  <style type=\"text/css\">\n    table{width: 350px; border-collapse:\
  \ separate; cells-spacing: 5px;}\n    td{border: solid; width: 1px; color: #999;}\n\
  \  </style>\n</head>\n```\n```html\ntable{table-layout: fixed;}\n```\n\n## Margins（外边距）\n\
  CSS `margin` 属性用于在 HTML 元素周围创建空间。其他属性有：`margin-bottom`, `margin-top`, `margin-left`\
  \ 和 `margin-right`。`margin` 属性的语法：\n```html\n<p style=\"margin:10px; border:1px\
  \ solid black;\">\n  外边距均为 10px\n</p>\n```\n\n### 列表、图标与下拉列表\n列表有两种：有序列表和无序列表。在有序列表中，项目用数字或字母标记；而在无序列表中，项目通常用符号标记。列表值可以使用\
  \ `circle`、`decimal`、`lower-roman`、`upper-roman`、`decimal-leading zeros`、`lower-alpha`、`upper-alpha`\
  \ 和 `square` 等值创建。\n\n**示例：**\n```html\n<html>\n<head>\n  <style>\n    ul.a{list-style-type:\
  \ square;}\n    ol.c{list-style-type: lower-alpha;}\n  </style>\n</head>\n<body>\n\
  \  <h2>有序与无序列表</h2>\n  <p>无序列表</p>\n  <ul class=\"a\">\n    <li>one</li>\n    <li>two</li>\n\
  \    <li>three</li>\n  </ul>\n  <ol class=\"b\">\n    <li>one</li>\n  </ol>\n</body>\n\
  </html>\n```\n\n\n\n\nCSS 有序列表和无序列表\n\n无序列表\n● 一\n● 二\n● 三\n● 一\n● 二\n● 三\n\n有序列表\n\
  A. 一\nB. 二\nC. 三\n1. 一\n2. 二\n3. 三\n\n### 图标\n\n通过使用 HTML 图标库，我们可以通过 CSS 添加不同类型的图标。类型包括\
  \ Font Awesome、Bootstrap icons 和 Google 图标。\n\nFont Awesome 图标语法：\n```html\n<link\
  \ rel=\"stylesheet\" href=\"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css\"\
  >\n```\n\nBootstrap 图标语法：\n```html\n<link rel=\"stylesheet\" href=\"https://maxcdn.bootstrapcdn.com/bootstrap/3.3.7/css/bootstrap.min.css\"\
  >\n```\n\nGoogle 图标语法：\n```html\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/icon?Family=material+icons\"\
  >\n```\n\n#### 示例：\n\n```html\n<!DOCTYPE html>\n<html\n<head>\n<link rel=\"stylesheet\"\
  \ href=\"https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css\"\
  >\n</head>\n<body>\n<h1>css icons</h1>\n<i class=\"fa fa-cloud\" style=\"font-size:32px;\"\
  ></i>\n<i class=\"fa fa-heart\" style=\"font-size:32px;\"></i>\n<i class=\"fa fa-file\"\
  \ style=\"font-size:32px;\"></i>\n<i class=\"fa fa-car\" style=\"font-size:32px;\"\
  ></i>\n<i class=\"fa fa-bars\" style=\"font-size:32px;\"></i>\n</body>\n</html>\n\
  ```\n\n![image_rsrc9FY.jpg](img/image_rsrc9FY.jpeg)\n\n### 下拉菜单\n\n我们也可以通过使用相同的\
  \ HTML 元素通过 CSS 创建下拉菜单，下拉菜单由一个无序列表和嵌套列表组成。列表用于创建下拉结构。例如：\n\n```html\n<html\n<head>\n\
  <title>dropdown css</title>\n</head>\n<body>\n<nav>\n<ul>\n<li class=\"lev-1\">\n\
  <a href=\"\">list\n<ul>\n<li><a href=\"#\">第 1 页</a>/</li>\n<li><a href=\"#\">第\
  \ 2 页</a>/</li>\n<li><a href=\"#\">第 3 页</a>/</li>\n<li><a href=\"#\">第 4 页</a>/</li>\n\
  </ul>\n</li>\n</ul>\n</nav>\n</body>\n</html>\n```\n\n![image_rsrc9FZ.jpg](img/image_rsrc9FZ.jpeg)\n\
  \n### 层级与可见性\n\n层\n\n通过 CSS，我们可以通过实现 `z-index` CSS 属性来创建多个各种划分层。例如：\n\n```html\n\
  <html\n<head>\n</head>\n<body>\n<div style=\"background-color:blue; width:300px;\
  \ height:100px; position:relative; top:10px; left:80px; z-index:2\"></div>\n<div\
  \ style=\"background-color:red; width:300px; height:100px; position:relative; top:-60px;\
  \ left:35px; z-index:1;\"></div>\n<div style=\"background-color:black; width:300px;\
  \ height:100px; position:relative; top:-20px; left:120px; z-index:3;\"></div>\n\
  </body>\n</html>\n```\n输出：\n![image_rsrc90.jpg](img/image_rsrc90.jpeg)\n\n### 可见性\n\
  \n`visibility` 属性允许我们隐藏元素并保留其空间。在 CSS 中为段落实现可见性属性的方法：\n\n```html\n<p></p>\n<p style=\"\
  visibility:hidden;\">文字不应该是可见的。</p>\n```\n\n### 布局与动画\n\n学习到的布局技术是包含元素包含在布局模块中的优秀方法，包括普通布局、flexbox、grid、浮动以及定位启用的布局。\n\
  \nCSS 动画允许通过 `@keyframes` 规则指定某些帧，使元素从一种样式变为另一种样式。例如：\n\n```css\n@keyframes example\
  \ {\nfrom {background-color:blue;}\nto {background-color: brown;}\n}\n\n/* 应用于元素\
  \ */\nDiv {\nwidth:100px;\nheight:100px;\nbackground-color:blue;\nanimation-name:example;\n\
  animation-duration:4s;\n}\n```\n\n如何有效使用这些多个自定义属性和元素来提高网页的显示和吸引力。虽然学习和实现所有 CSS 属性至关重要，但良好的编辑有助于创建完美的网站设计。此外，CSS\
  \ 中使用的每种方法应该保持一致，以避免出现误解等问题。\n\n在编写 CSS 时，你还应该避免使用内联代码，并将样式属性仅替换在外部样式表中。检查你的代码在\
  \ Internet Explorer、Chrome 和 Safari 等最新网络浏览器上运行情况，可以确保页面的正确显示和格式。此外，CSS 代码还可以作为模板供其他项目使用，你也可以将现有的代码回收到新代码中。还可以通过空格分隔实现多个类，并通应用特定元素从\
  \ CSS 继承中获益。\n\n## 第十章：编程基础\n\n选择编程语言 既然我们已经详细讨论了所有主要的编程语言及其语法，初学者可以选择看起来容易学习和实现的语言。\n\
  \n\n\n\n\n# 零基础编程入门\n\n福特正在开发网页插件、桌面应用程序、订单移动应用程序。Java 语言被认为并被广泛使用，因为它提供了完善的支持和功能。HTML、CSS\
  \ 和 PHP 是福特网站开发的核心语言之一，学者可以轻松学习。\n\n作为一名读者或有志成为程序员的人员，绝不应将自己局限在阅读一种语言上，而应该尝试学习最新的技术和实现方法。\n\
  \n存在多种计算机编程语言，它们被用于解决特定的问题。为了让事情变得简单，学者可以观察并提高自己的技能，选择最合适且易于实现的编程语言。编程还取决于其他几个因素，例如应用程序的易用性、安全性、兼容性和响应时间。\n\
  \n## 高效编程小贴士\n\n虽然编写易懂的代码是令人满足感的，但程序需求是计算机编程的主要部分。有一些实用的技巧和方法可以提高程序员的效率。从最关键的一点开始，程序员应该避免向函数传递长参数列表，并尽量尝试使用\
  \ `int`、`pointer` 或避免函数类型。此外，不要将字符转换为其他数据类型，因为硬编码变量可能位于 RAM 的任何位置。\n\n此外，绝不能用小函数初始化全局变量，并尽量减少对浮点数数学运算的使用。这将减少执行时间并消耗更少的内存。当代码达到数千行时，全局变量和循环会让程序员难以处理应用程序，并且微小的变化都会导致巨大的问题。\n\
  \n在方法或函数内部编写 `switch` 分支、语句、循环和 `try-catch` 是理想的方法。记住，方法也应该写在类定义和函数定义内部。此外，使用合适的结构来组织应用程序是一个很好的方法，这也能提高编码标准。\n\
  \n最后同样重要的是，还应该考虑版本控制软件，以提高应用程序性能并交付更新。虽然专业程序员在使用它，但此类工具让学者更容易学习。在编写代码时，避免深度嵌套并限制长度会使代码难以阅读。\n\
  \n为了加强你的技能并成为一名优秀的程序员，你必须学习计算机编程的所有核心概念。了解基础算法和数据结构是提高解决问题能力的极佳方法。此外，编写测试是另一种提升思维和编码技能的适用。编码完成后，必须通过使用适当的命名规范使代码保持简单且富有意义，并轻松地替换变量或方法。记住，为你的应用程序创建特定的文件夹将为你进行维护和调试带来巨大益处。学习基础是培养强大的开发和分析能力的关键方面。\n\
  \n此外，尝试通过解决编程练习和编写简单代码来实践你的编码技能。这不仅会提高你的编程水平，你还能开发出高效的新解决方案。花时间学习编程基础知识也更容易适应最新技术并学习新的编程方法。通过学习和实现新的方法、函数和方案，可以让编程变得有趣。\n\
  \n### 结论\n\n《零基础编程入门》的设计和编写旨在为学者提供计算机编程的有价值知识、信息和原则。本电子书彻底涵盖了主要的编程语言，并为实现给概念和发现提供了正确的指南。\n\
  \n编写计算机代码需要开发者遵循预定义的语法和流程。根据语言的不同，应该关注应用的特定需求并使用各种工具和技术。计算机编程由多个任务组成，包括编写代码、测试、实现系统、方法和调试。\n\
  \n阅读完本电子书后，你会发现自己已经具备了强大的开发和分析能力，并对每种语言的给定概念有了深入的理解。\n\n"
