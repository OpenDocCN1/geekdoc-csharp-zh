  country\": \"sweden\"\n}\n```\n\n### 面向对象的 Python\n\n在面向对象编程中，我们需要定义类和对象在程序中执行各种功能。像\
  \ C++ 和 C 等其他主要编程语言一样，我们可以使用面向对象的技术来创建、访问和更新类。\n\n在 Python 中创建一个学生类，代码如下：\n\n```python\n\
  class student:\n    def __init__(self, id, name, class):\n        self.rd = roll\n\
  \        self.nd = name\n        print((self.n))\n\nStud1 = student(1, \"james\"\
  )\nStud2 = student(2, \"william\")\nprint(\"data successfully stored in variables\"\
  )\n```\n\n访问对象的变量时，使用点运算符 `.`，其语法为：`object_name.variable_name`\n\n### 继承\n\n继承是面向对象编程中的一个非常有用的特性，它允许开发者创建一个新类来继承现有类的所有方法和属性。我们可以使用继承技术，定义一个具有父类属性的新子类或派生类。\n\
  \nPython 中实现继承的语法定义如下：\n\n```python\nclass baseclass1:\n    # 基类体\n\nclass derivedclass(baseclass1):\n\
  \    # 派生类体\n```\n\n以下程序展示了父类及其派生类如何继承父类的特征并良好地调用其函数。\n\n```python\nclass vehicle:\n\
  \    # 父类\n    def __init__(self, price):\n        self.price = price\n\n    def\
  \ display(self):\n        print(self.price)\n\nclass category(vehicle):\n    # 派生类\n\
  \    def __init__(self, price, name):\n        vehicle.__init__(self, price)\n \
