    \";\n  protected int points = 0;\n}\n```\n\nThis means that the variable `points`\
    \ is still not visible from the outside, but can be accessed in the derived class\
    \ `NPC`.\n\n```csharp\npublic class NPC: person {\n  public int health;\n  public\
    \ void DoSomething () {\n    points = 100;\n  }\n}\n```\n\n## Override inherited\
    \ method\n\nImagine that you have a basic class `person` who, in addition to various\
    \ variables and methods, also has a method called `Shoot`. To display this functionality,\
    \ a short text should first be output in the console (console tab). You can do\
    \ this with the `Debug.Log` command. While the class `Person` is provided with\
