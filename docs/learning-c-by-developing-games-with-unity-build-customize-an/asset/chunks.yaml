    上述方法存在一些缺点。因此，如果你想保存可自定义 GUI、玩家或背包的所有参数，这可能会非常昂贵。但至少当你想要将纹理和材质从一个场景传输到另一个场景时，你会在这里遇到一个问题。对于纹理，你无法通过
    `PlayerPrefs` 保存。为了解决这个问题，父类 `Object` 有一个静态方法 `DontDestroyOnLoad`，它可以防止任何对象在加载过程中被销毁。由于传递参数也是
    `Object` 类型，你可以将它传输到任何对象上（参见“Unity 的继承结构”），即使通常传递的是一个 `GameObject`。接面的示例脚本可以防止附加在后续脚本上的
    `GameObject` 及其所有组件被销毁。如果场景结束并启动了新场景，整个 `GameObject` 将被传输到下一个场景。以下示例脚本防止附加在后续脚本上的
    `GameObject` 及其所有组件被销毁。

