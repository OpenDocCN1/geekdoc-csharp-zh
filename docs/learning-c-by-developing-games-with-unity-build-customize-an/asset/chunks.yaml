  raw: 'The while loop continues until an abort condition is met. The termination
    condition is queried at the beginning of the loop, so that the loop may not even
    be able to be executed, namely if the termination condition is met from the beginning.


    int enemyIndex = 0;


    while (enemyIndex <5) {


        if (enemyIndex == 3)


                  break; //Code...


         enemyIndex ++;


    }


    This loop can also be simply ended with the break command without fulfilling the
    actual termination condition. In addition, there is also the continue command
    . This ensures that the loop behaves as if it had already arrived at the end of
    the loop code when the continue command is reached, and therefore begins with
    the next iteration of the loop.


    ## do loop


    In contrast to the while loop, where the termination condition is checked at the
    beginning, the condition in the do loop is only checked at the end. The result
    is that the loop makes at least one pass, regardless of whether the condition
    at the end of the loop was met from the beginning or not


    int enemyIndex = 0;


               do {


                 //Code...


                 enemyIndex ++;


                       }


       while (enemyIndex> 5);


    With the do loop it is also possible to leave the loop with the break command
    .


    ## Classes


    As already mentioned at the beginning, C # is a so-called object-oriented programming.
    The aim is to bundle and encapsulate coherent functionalities and values ​​in
    so-called objects (which are nothing more than variables). B. Everything that
    concerns the player is in an object called player . Everything that affects the
    enemy is saved by an object called enemy . What do we do if we want to have two
    or more opponents, not just one opponent? Do we have to program a completely new
    object for every opponent? No, of course not, because this is where classes come
    in. A class is a template for objects. It describes how objects in this class
    “look” and how they should work. A class begins with the word class , followed
    by the name of the class. To better distinguish it from normal variables, this
    begins with a capital letter in C #. Then the code of the class follows, which
    is enclosed in curly brackets:


    class enemy {


         int health;


             }


    In Unity, a script represents exactly one class. The name of the script must have
    the same name as the class in the script. If you now want to create an object
    from a script or a class, this is very easy in Unity. Since scripts are normally
    considered to be components (more on this in the chapter "Script programming"),
    you can easily drag them onto a respective GameObject, which automatically creates
    an object of this class. This process is also called instantiation. The result,
    i.e. the object, is therefore often referred to as an instance of this class.


    ## Assign components by code


    Instead of dragging such a component script onto a GameObject, you can alternatively
    assign a script or an object of your class to a GameObject using program code.
    For this there is the command AddComponent .


    gameObject.AddComponent <MyScriptName> ();


    ## Instantiation of non-components


    Instances of non-components, such as For example, GameObjects or script classes
    that do not inherit from the MonoBehaviour class (more on this in the " Scripting
    " chapter) are usually generated using the typical C # path. To do this, first
    declare a variable of the type of the class. Next comes the instantiation of the
    object. This creates the new object, which you do with the keyword new and the
    class name.


    Enemy enemy;


    enemy = new enemy ();


    The two lines above can also be made shorter, as follows:


    Enemy enemy = new Enemy ();


    The two brackets after new and the class name are important and must always be
    written, since this is not the class itself, but the constructor of this class,
    a method that is carried out when the object is created. You can find out more
    about the topic of constructor e.g. B. in the previously mentioned books by Wal-ter
    Doberenz and Thomas Profitus.


    ## Methods / functions


    Algorithms, i.e. lines of code that do not contain variable declarations or similar.
    within a class can only be written in methods. Methods are code units that are
    addressed by calling their method name and can have both transfer parameters and
    return values. Note that the term “method” is not normally used in JavaScript,
    instead the term “function” is used there . In both cases, however, the same is
    meant. And because, as already mentioned, Unity does not only support C # as a
    language, Unity developers often use both terms. For methods / functions there
    is a similar naming convention as for variables, except that they begin with a
    capital letter, e.g. B. SetPosition . A method definition has two important parts:


        Transfer parameters, they are defined after the method name within parentheses
    with the variable type. If the method has no transfer parameters, the brackets
    are still written. Please note that when a variable is passed, a copy is created,
    which is then used in the method. So it is not the same variable that is passed
    to the method and that is used in the method itself.


        Return value, it is defined in front of the method name in the form of a type
    definition. The return value is returned within the method with the keyword return
    . If the method should not have a return value, the key word void is written in
    front of the method. The following method checks whether the contents of two transferred
    string variables are the same.


    bool IsEqual (string stringA, string stringB) {


    bool result = false;


             if (stringA.ToLower () == stringB.ToLower ())


                  result = true;


               return result;


         }


    Note that the example also accesses methods, ToLower () , which provides each
    string variable. This returns the content of the variable stringB in lower case
    letters, so that "Test" becomes a "test". The following line now compares whether
    the two strings have the same letters and then gives a TRUE or a FALSE accordingly
    via the result variable.


    //Code...


    bool equal;


    string myName = "Test";


    string colliderName = "TEST"


    equal = IsEqual (myName, colliderName); // Returns a TRUE


    //Code...


    ## Don''t repeat yourself


    An important task of methods is to avoid repeating sections of code. Multiple-use
    code is separated into its own methods, which means that the code only has to
    be maintained at one point. Do you need z. For example, if you compare two positions
    in a method, but you have to calculate them in the same way beforehand, you could
    split the logic of the calculation into one method. You then use the transfer
    parameters of the method to give it the initial values ​​for the calculation.


    ## Value types and reference types


    Even if I don''t want to delve too deeply into the subject, you should still know
    that there are two different data types of variables, the differences of which
    are particularly noticeable when you transfer them to methods.


        Value types are data types that contain the value. Examples of this are the
    simple types int, bool or enumerations. If you pass a value type to a method,
    the value is also copied. In this case, you can change the variable within the
    method as desired, without this affecting the externally transferred variable.


        Reference types are data types that do not contain the value, but only a pointer
    to another memory location (i.e. the memory address). The actual content of the
    variables is only stored in this other storage location. If you now pass a reference
    type of a method, it is not the content that is copied here, but only the pointer.
    Changing the variable data within the method also changes the data of the object
    that was transferred to the method from outside. A typical example of reference
    types are instances of classes.'
