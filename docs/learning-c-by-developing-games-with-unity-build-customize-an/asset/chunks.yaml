    folders Standard Assets, Pro Standard Assets and Plugins are compiled.


    3\. All other scripts that are outside of folders named Editor are compiled.


    4\. Finally, any remaining scripts (in folders named editor) kompi- liert.Weiter
    , there is the reserved folder names WebPlayerTemplates whose scripts contained
    are not compiled.


    If you want to use your C # script to access a Boo or JavaScript class, the script
    you want to access must have been compiled in an earlier phase than itself. In
    this case, you could use the JS script in the Move the plugins folder and it is
    already accessible from your C # script.


    However, this creates a problem: you can only access in one direction, it is not
    possible to access in both directions. You should keep this in mind when working
    with several programming languages.


    ## Execution order


    Sometimes it is important to make sure that one script is executed before the
    other, with two scripts you can often still use Update and LateUpdate , but with
    three scripts this is no longer possible. For this there are the Script Execution
    Order Settings, which you can find under Edit / Project Settings / Script Execution
    Order .


    ![](Image00009.jpg)


    You can add a script by clicking the plus sign. You can then leave the script
    there or drag it up and change the time value. The scripts are then processed
    from top to bottom. All scripts not defined here are called in the Default Time
    area in a random order.


    # CHAPTER 3


    Create a simple game


    So far we have come a long way towards completing the mechanics of the game, where
    we have a scene where we can wander and zoom in and out of the camera, in addition
    to the possibility of building a stage within this scene using the building blocks
    and forms of monsters that we made. The next step is to make a slingshot to launch
    projectiles, in addition to the projectiles themselves for which we will use the
    animal images in the Kenney.nl \ AnimalPack folder. These animals are shown in
    the following picture:


      ![](Image00010.gif)


    We have to build a extruded mold for each of these four. This template will initially
    contain the Sprite Renderer component that has become known to us, as well as
    the Rigid Body 2D and Circle Collider 2D components. These components can transform
    each image into a physically active object.All we need to do is adjust the mass
    values of the solid body component to 5 for each of these images.In addition,
    to activate the Is Kinematic option, which prevents the solid body from responding
    to external forces, which we will need to change. Later. The large mass is necessary
    to make these projectiles have a noticeable effect when they hit the building
    blocks or the opponents upon launch. After that we start to write and add the
    necessary applets for these projectiles. The beginning will be with the main applet
    and most important is Projectile. The following narrative is described:


    using UnityEngine;


    using System.Collections;


    public class Projectile: MonoBehaviour {


    // The number of seconds the projectile will live in the scene after its launch


    public float lifeSpan = 7.5f;


    // Is the player allowed to control this projectile right now?


    private bool controllable = false;


    // Has the player grabbed this projectile and prepared it for launch?


    private bool held = false;


    // Is this projectile already launched?


    private bool launched = false;


    // Was the projectile attack carried out?


    private bool attackPerformed = false;


    // Variable to store the projectile location the moment the player grabs him and
    before pulling it in preparation for launch


    private Vector2 holdPosition;


    // It is called once at startup


    void Start () {


    }'
