- fmt: "\n```csharp\nint [0] = 20; // previously was 30\nint [4] = 140; // previously\
    \ was 120\n```\n\n## Determine the number of all array items\n\nArrays may also\
    \ be created automatically. If you want to know how many items the array now consists\
    \ of, you can determine this using the `Length` property:\n\n```csharp\nint len\
    \ = speedLimits.Length;\n```\n\n## Multidimensional arrays\n\nYou can also create\
    \ an array with multiple dimensions, imagine you want to use an array to represent\
    \ a square grid field (a chess board, for example). Then its is confusing to create\
    \ an array with 64 elements. It is easier to create an array with two dimensions,\
    \ where the first index represents the X axis (in chess it would be the letters\
    \ A to H) and the second the Y axis. Such a definition looks like this in C#:\n\
    \n```csharp\n[,] tile = new int [8,8];\n```\n\nAgain, keep in mind that each index\
    \ in the array begins with a 0. If you now encrypt the figures with numbers (0\
    \ means no figure, 1 represents a pawn, 2 is a tower), you can easily save the\
    \ positions of the figures in this array:\n\n```csharp\n[0.0] = 2; // There is\
    \ a tower on A1.\ntile [0,1] = 1; // There is a farmer on A2.\ntile [1,1] = 1;\
    \ // There is a farmer on B2.\ntile [0.2] = 0; // There is no figure on A3.\n\
    ```\n\n## Constants\n\nThere are always values that should not or should not be\
    \ changed. You can define these as constants, which means that they can no longer\
    \ be changed. To do this, you must write the keyword `const` before the data type.\
    \ It is also necessary to initialize constants when declaring:\n\n```csharp\n\
    const float gravity = 9.81F;\n```\n\n## Enumeration\n\nYou can use enumerations\
    \ to create legible lists of constants. What sounds a bit cryptic is a very practical\
    \ thing. Imagine you want to save the state of a figure. This has three states:\
    \ standing, walking, jumping. In order to query the current state of the figure,\
    \ you would like to save it in a variable. To do this, you first define an enumeration\
    \ (short enum) that has these three values. We just want to state this enumeration:\n\
    \n```csharp\nenum state {idle, walk, jump}\n```\n\nYou can then create a variable\
    \ of this enumeration type and assign one of the three values to it:\n\n```csharp\n\
    myState State; myState = State.Idle;\n```\n\n## Type conversion\n\nIt is also\
    \ possible to convert a variable of one type into another type. The prerequisite\
    \ is, of course, that it also fits in terms of content. An integer variable can\
    \ always be converted into a float variable. The reverse way only works if the\
    \ float number has no comma value. When converting a type, simply enter the target\
    \ type in parentheses before the value to be converted:\n\n```csharp\nint lifePoints;\
    \ string lifePointsText = \"2\";\nlifePoints = (int) lifePointsText;\n```\n\n\
    Converting numbers to a string is even easier. They inherently have a method /\
    \ function (I will explain what this is in a moment) that takes on this task.\
    \ To do this, enter a point after the number variable and then the text `ToString()`.\
    \ As soon as you tap the point, a selection should appear in MonoDevelop that\
