    public class MyGeneric <T> {\n    public T current;\n}\n```\n\nWherever the parameter\
    \ `T` was used in the generic class, the transferred type is used later. The variable\
    \ `current` will therefore have the data type that you specify when declaring\
    \ the instance.\n\n```csharp\nMyGeneric <string> test = new MyGeneric <string>\
    \ ();\ntest.current = \"ddd\";\n\nMyGeneric <int> test2 = new MyGeneric <int>\
    \ ();\ntest2.current = 2;\n```\n\n## Cunning\n\nA generic type that is often used\
