    }


    The second applet that we will be discussing from the projectile template applet
    is the applet for drawing the projectile motion path after launch. The drawn path
    will be points, including fixed distances, along the path that the projectile
    traveled from the moment it dropped at the launch slingshot to its last point.
    Before explaining the applet we will build a template that represents the point
    object that we will use to draw the path. To build the template, just add a new
    blank object to the scene and then add the SpriteRenderer component to it. Then
    click on the browse button for the Sprite cell in the component as in the image,
    and scroll down to the bottom of the window where you will find below a set of
    default images that Unity uses to build the user interface. Select the Knob image
    and then close the window. Then name the new template PathPoint and reduce its
    size on the x and y axes to 0.75:


    ![](Image00011.jpg)


    Now we can write the path drawing applet and add it to the projectile template.
    This applet is described in the following narrative:


    using UnityEngine;


    using System.Collections;


    public class PathDrawer: MonoBehaviour {


        // The template used to draw points


        public GameObject pathPointPrefab;


        // Distance between two consecutive points


        public float pointDistance = 0.75f;


        // Parent object for path point objects


        Transform pathParent;


        // Variable to store the location of the last point added


        Vector2 lastPointPosition;


        // Internal variable to see if the projectile was launched or not


        bool launched = false;


    // Called once at startup


    void Start () {


    // Path Find the parent object of the named path points


            pathParent = GameObject.Find ("Path"). transform;


    }


    // Called once when rendering each frame


    void Update () {


            if (launched)


            {


                float dist = Vector2.Distance (transform.position, lastPointPosition);


                if (dist> = pointDistance)


                {


                    // It''s time to add a new point


                    AddPathPoint ();


                }


            }


    }


        void ProjectileLaunched ()


        {


            // The projectile is just launched so delete the previous track


            for (int i = 0; i <pathParent.childCount; i ++)


            {


                Destroy (pathParent.GetChild (i) .gameObject);


            }


            AddPathPoint ();


            // Update the variable value as the projectile has been launched


            launched = true;


        }


        // Adds a new point to the path


        void AddPathPoint ()


        {


            // Create a new point using the template


            GameObject newPoint = (GameObject) Instantiate (pathPointPrefab);


            // Place the point in the current projectile location


            newPoint.transform.position = transform.position;


            // Set the parent object to the point


            newPoint.transform.parent = pathParent;


            // Store the location of the added point


            lastPointPosition = transform.position;


        }


    }


    This applet uses the template we just created in order to draw points along the
    path, so we''ll need to define this template via the pathPointPrefab variable.
    Then, with the pointDistance variable, we can adjust the distance we want between
    two consecutive points. Next we need a reference to Path, an empty object that
    we have to add to the hierarchy of the scene as the root object. This object will
    be the father of all the track points, and it helps us access them at once to
    delete them while drawing a new path as we''ll see shortly. Since we will calculate
    the distance between each two consecutive points as the projectile moves to draw
    the path, we always have to keep the location of the last point drawn. This location
    is stored in the lastPointPosition variable. Finally, we know that the path should
    be drawn only after the projectile is launched, so we use the launched variable
    to know whether or not it was launched.


    Remember that when the projectile is launched, the Projectile applet sends the
    ProjectileLaunched message, which the PathDrawer receives through the function
    of the same name. Once the message arrives, the previously drawn path (if any)
    is deleted by deleting all the sons of the empty object, which we keep a reference
    to in the pathParent variable. After the deletion is finished, we draw a point
    at the launch location by calling the AddPathPoint () function, and then the launched
    value is changed to true.


    What the AddPathPoint () function does is to create a new point in the current
    projectile location by using the pathPointPrefab template, add it as a son of
    the Path object, and then store its location in the lastPointPosition variable.
    As long as the projectile object is in the scene, the Update () function will
    be called in each frame, but it will not do anything until the launched value
    changes to true. If this condition is met, it means that the projectile has been
    released and therefore the path must be plotted as it moves; therefore, we calculate
    the distance between the current projectile location of transform.position and
    the location of the lastPointPosition. If this distance increases or is equal
    to pointDistance, then it is time to add a new point to this and AddNewPoint ()
    is called. The following image represents the process of drawing the projectile
