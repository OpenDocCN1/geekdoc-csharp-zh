  trans: "\n我们使用这种技术来计算弹体在向发射点移动过程的新位置，在这种情况下，插值发生在当前的最小 `projectilePos` 与我们想要达到的最大目标\
    \ `launcherPos` 之间。插值的值相对较低，即它更接近目标，该值是自上一帧渲染以来所经过的时间乘以 5。。在这里使用时间值的重要性在于，并不是所有帧都是以相同的速度渲染的。帧率不是固定的，可能会增加或减少。因此，为了保持恒定的移动速度，我们必须乘以时间（时间会随着每秒帧数的减少而增加，反之亦然），从而使得玩家看到的移动速度无论帧率高低都保持恒定。\n\
    \n这三个函数 `HoldProjectile()`、`DragProjectile()` 和 `ReleaseProjectile()` 分别调用了当前弹体\
    \ `currentProjectile` 的 `Hold()`、`Drag()` 和 `Launch()` 函数。这里需要解释的函数是 `DragProjectile()`，因为它包含一个\
    \ `Projectile` 中不具备的额外步骤，即验证在向后拉时弹体距离初始发射点的距离是否超过了橡皮弹弓允许的拉伸长度。这个拉伸长度在 `maxStretch`\
    \ 变量中定义。我们实施这种最大长度的方法也应该考虑到控制的便利性，如果玩家将光标拉到允许长度之外，弹体不应随之移动，但同时必须能够改变发射角度。为了实现这一机制，我们将再次使用线性插值，这种用法描述在第\
    \ 131 行和 132 行。\n\n其思路是计算发射位置与当前位置 `currentDist` 之间的距离，并与最大伸展值 `maxStretch` 进行比较。如果此距离超过了限制，我们将\
    \ `maxStretch` 除以 `currentDist`，从而获得原始 `launchPosition.position` 与新位置 `newPosition`\
    \ 之间所需的插值。该值会随着光标到发射点距离的增加而自然减少，从而保持与发射点的距离恒定为 `maxStretch` 距离。通过完成插值，我们得到了正确的\
    \ `newPosition` 而不影响平滑运动，然后使用 `Drag()` 函数移动弹体。有必要使用这个函数而不是直接移动弹体，因为它会验证条件，即弹体是否正被玩家持有且尚未发射，而这正是游戏规则的移动条件。\n\
    \n![](img/Image00015.gif)\n\n编写完脚本后，我们必须将其添加到空空的 `Object Launcher` 中，它是组成弹弓的所有层级对象的根节点。我们将添加的下一个脚本将在弹弓的端点和弹体之间绘制橡皮绳。但在继续下一个脚本之前，我们必须添加负责绘制代表这条绳子的线条的组件。我们要添加的组件称为\
    \ `Line Renderer`，可以像通常一样通过 `Add Component` 按钮添加，然后如如下所示输入组件名称。该组件会在通过 `positions`\
    \ 数组分配给它的一组点之间绘制一条实线，从数组中的第一个点到最后一个点：\n\n添加组件后，我们必须调整它的部分键值：首先，我们必须将绘制 `positions`\
    \ 线的点数改为 3，然后通过将 `Start Width` 和 `End Width` 均更改为 0.1 来使其变细，最后我们将起点和终点的颜色改为红色（当然，你也可以选择任何其他颜色）。这些设置在如下所示：\n\
    \n![](img/Image00016.jpg)\n\n现在让我们启动 `LauncherRope`，它负责在弹弓的端点和弹体之间绘制这条线。该脚本的叙述描述如下：\n\
    \n```csharp\nusing UnityEngine;\n\nusing System.Collections;\n\npublic class LauncherRope:\
    \ MonoBehaviour {\n\n    // 绳子左端的位置\n    public Transform leftEnd;\n\n    // 绳子右端的位置\n\
    \    public Transform rightEnd;\n\n    // 发射器脚本的引用\n    Launcher launcher;\n\n\
    \    // 对添加的渲染组件的引用\n    LineRenderer line;\n\n    // 启动时调用一次\n    void Start\
    \ () {\n        launcher = GetComponent <Launcher>();\n        line = GetComponent\
    \ <LineRenderer>();\n        // 最初通过禁用组件隐藏线条\n        line.enabled = false;\n\
    \    }\n\n    // 每帧渲染时调用一次\n    void Update () {\n        // 只有当弹体被玩家持有时才显示线条\n\
    \        if (launcher.currentProjectile != null &&\n            launcher.currentProjectile.IsHeld\
    \ ()) {\n            if (! line.enabled) {\n                line.enabled = true;\n\
    \            }\n            // 从左端（弹体）开始绘制线条\n            line.SetPosition(0,\
    \ leftEnd.position);\n            line.SetPosition(1, launcher.currentProjectile.transform.position);\n\
    \            line.SetPosition(2, rightEnd.position);\n        } else {\n     \
    \       line.enabled = false;\n        }\n    }\n}\n```\n\n你可以看到这个脚本是多么简单。它所做的只是先禁用线条，然后检查弹体的状态。如果它被玩家持有，则激活\
    \ `LineRenderer`，使线条可见。记住这两个弹弓对象：`leftEnd` 和 `rightEnd`。我们使用 `SetPosition` 函数来定义位置。当你玩时，线条看起来像这样：\n\
    \n![](img/Image00017.gif)\n\n因此，弹弓的任务已经完成，我们必须添加一个程序来读取玩家输入。这个脚本被称为 `LauncherMouse`，它的任务是读取玩家的鼠标。接下来的叙述说明了这一点：\n\
    \n```csharp\nusing UnityEngine;\n\nusing System.Collections;\n\npublic class LauncherMouse:\
    \ MonoBehaviour {\n\n    // 脚本引用\n    private Launcher launcher;\n\n    // 启动时调用一次\n\
    \    void Start () {\n        launcher = GetComponent <Launcher>();\n    }\n\n\
    \    // 每帧渲染时调用一次\n    void Update () {\n        CheckButtonDown();\n        CheckDragging();\n\
    \        CheckButtonUp();\n    }\n\n    void CheckButtonDown () {\n        if\
    \ (Input.GetMouseButtonDown(0)) {\n            // 左鼠标键刚刚被按下\n            // 是否有弹体？\n\
    \            if (launcher.currentProjectile != null) {\n                // 将光标位置从屏幕坐标转换为场景空间坐标\n\
    \                Vector2 mouseWorldPos = Camera.main.ScreenToWorldPoint (Input.mousePosition);\n\
    \                // 从对象中提取碰撞组件\n                Collider2D projectileCol = launcher.currentProjectile.GetComponent\
    \ <Collider2D>();\n                // 鼠标是否在弹体的碰撞组件范围内？\n                if (projectileCol.bounds.Contains\
    \ (mouseWorldPos)) {\n                    //\n                }\n            }\n\
    \        }\n    }\n}\n```\n\n"
