    \ `C#` 中会在行末尾添加一个分号 `;`。`C#` 中的其他重要字符是花括号 `{}`。它们被用于识别连贯的代码块。\n\n### 注释\n\n除了实际代码外，你可能还想给代码添加一些不供计算机运行的注释。这些不执行的行也被称为注释。使用双斜杠\
    \ `//` 标记注释。双斜杠之后到下一个换行符之间的任何内容都被视为不可执行代码。该行双斜杠之前的内容被视为可执行！\n\n数字 1 中的单行注释；`//\
