  trans: '

    Unity 提供了 `MonoDevelop` 编程环境用于编写脚本。`MonoDevelop` 是一个面向软件开发者的开源开发环境，作为 `Mono` 项目的一部分开发的，`Mono`
    是微软 .NET 框架的开源替代方案。Unity 提供了一个特别适配的版本，其功能之一是能够结合 Unity 方便调试。在 Unity 中双击脚本会自动打开
    `MonoDevelop` 并加载相应的脚本。如果 `MonoDevelop` 已经打开了另一个脚本，则会创建一个包含相应脚本的新标签页。另一个脚本仍保持在
    `MonoDevelop` 中打开，因此可以在不同脚本之间切换。


    作为一名 Unity 开发人员，`MonoDevelop` 的主窗口尤为重要，各种脚本的代码显示在其标签页中。左侧的 `Solution Explorer`（解决方案资源管理器）也很有帮助。它显示了按编程语言排序的
    Unity 项目所有代码文件，并允许打开其他脚本文件。`MonoDevelop` 的存储功能非常简单，你可以使用 `File / Save` 或组合键 `[Ctrl]
    + [S]`。在 Unity 中需要进行的调整必须始终在 `MonoDevelop` 中保存。我们将在“故障排除与性能”章节中讨论同样重要的调试功能。


    如果你已经其他开发环境的经验并偏好特定的环境（例如 `Visual Studio`），可以使用它代替 `MonoDevelop`。在这种情况下，你可以在 `Edit
    / Preferences` 的 `External Tools` 区域将替代 IDE 保存为 `External Script Editor`。


    ### MonoDevelop 中的帮助

    Unity 附带的 `MonoDevelop` 版本有一些特殊修改，包括一个额外的帮助功能，可引导开发者直接进入 Unity 的脚本引用。要执行此操作，选择你想要获取更多信息的命令，并在德国电脑键盘上按下
    `[Ctrl] + [Shift] + ['']`。或者，你可以通过 `MonoDevelop` 菜单 `Help / Unity API Reference`
    实现。如果你在 `MonoDevelop` 中只有一个类名，例如输入应用程序并调用帮助，它将给你有关该类提供的方法和变量的所有信息。


    ### 语法错误

    如果你在脚本中存在语法错误，例如忘记了分号（`"parsing error"`）或使用了未实例化的变量，Unity 将在你保存此错误脚本后显示错误消息。该消息会显示在
    Unity 窗口的底部和控制台（console 标签页）中。如果你点击此消息，`MonoDevelop` 将打开并带你到达错误发生的地方。


    ![](img/Image00006.jpg)


    ### 错误信息的传递

    点击控制台中的错误消息并不总是直接指向开发者编写编程错误的位置。例如，如果你在行末尾忘记了分号，编译器可能只认为下一行是错误的，因为（之前的）代码行尚未完成，而这个新命令不应该在此时出现。特别是对于初学者来说，这有时会导致长时间的错误搜索，因为错误所在的地方与其显示的地方不同。


    ### 可用的编程语言

    在编写脚本时，你可以在 `JavaScript`、`Boo` 和 `C#` 编程语言之间选择。虽然你可以在 Unity 项目中任意混合使用这些语言（但在同一个脚本内不能！），但在可行范围内建议避免这样做。在项目内部混合语言本身并不是问题。但一旦你尝试从一个脚本访问另一个语言，就可能会出现问题。我将在第
    4.14 节“编译顺序”中介绍细节。因此，我建议尽可能在一个项目内限制仅使用一种语言。


    ### 为什么选择 C#

    正如你所注意到的，我在书中使用了 `C#` 语言。起初，Unity 专注于 `JavaScript` 语言。然而，随着时间的推移，这种情况发生了巨大变化，因此
    `C#` 现在是重点。`C#` 提供了更多功能，并且比专门为 Unity 改的 JavaScript 分支（通常称为 `UnityScript`）更广泛。


    ### Unity 的继承结构

    正如我在上一章“C# 与 Unity”中提到的，所有作为组件使用的脚本必须继承自 `MonoBehaviour` 类。然而，该类继承自另一个类。最终，组件和
    `GameObject` 甚至拥有起源，即来自 `UnityEngine` 命名空间的 `Object` 类。图 4.3 在类图中显示了 `Unity` 引擎命名空间中最重要类之间的关系。箭头始终从派生类指向相应的基类。


    ![](img/Image00007.jpg)


    ### Object

    `Object` 是 Unity 中所有对象的父类。它提供了一些基本属性和方法，例如用于销毁对象的静态方法 `Destroy`，以及我将在本章解释的 `DontDestroyOnLoad`
    方法。`GameObject`、`Component` 和 `ScriptableObject` 类都派生自此类。对于更有经验的 `C#` 开发者，应该再次指出，这是一个
    Unity 对象类，而不是 .NET 框架提供的那个类。


    ### GameObject

    `GameObject` 直接继承自 `Object`，它是场景中所有对象的基类。大多数 `GameObjects` 是通过编辑器主菜单 `GameObject`
    创建的。如果你想通过代码创建 `GameObject` 实例，则使用 `new` 关键字像普通类对象一样对其进行实例化。


    ### ScriptableObject

    `ScriptableObject` 也直接继承自 `Object`。首先，`ScriptableObjects` 是继承自 `ScriptableObject`
    的通用脚本，通常用于存储大量数据。这些类的实例是通过 `ScriptableObject` 类的静态方法 `CreateInstance` 创建的，可以在运行时和开发期间创建。`ScriptableObjects`
    更多用于特殊情况，例如创建可以在场景之外存储、配置并在需要时读取的数据容器。


    ### Component

    `Component` 类也继承自 `Object`，它是所有可以附加到 `GameObject` 类的基础。这就是为什么它们是通过 `GameObject`
    方法 `AddComponent` 被添加到相应的实例中的原因。其他重要类也继承自 `Component`，我想以 `Transform` 和 `Behavior`
    类为例。因为在 Unity 中，所有这些类都派生自 `Component` 类，被称为组件的类在德语中通常被称为 "components"。


    ### Transform

    `Transform` 类继承自 `Component`，并默认添加到每个 `GameObject` 中。只有当你用代码创建 `GameObject` 时，它才不会自动拥有
    transform 组件。反之，`RectTransform` 类继承自 `Transform`，它被 GUI 设计中的 uGUI 系统。


    ### Behavior

    `Behavior` 类继承自 `Component` 类。继承自 `Behavior` 的类也称为 Behavior 或泛泛地称为组件，并通过 `enabled`
    属性开启或关闭。派生自 Behavior 的类示例包括 `Light` 或 `NavMeshAgent`，我将在其他章节中讨论。最后，`MonoBehaviour`
    类也继承自 `Behavior`。


    ### MonoBehaviour

    `MonoBehaviour` 类是 Unity 中所有作为组件使用并可以附加到 `GameObject` 的脚本类的基类。即使 `MonoBehaviour`
    继承自 `Behavior`，你必须记住，当 `enabled` 属性未激活时，`Start`、`Awake`、`Update` 和 `OnGUI` 方法的执行会被阻止。其他方法仍然可以调用和执行，例如物理方法
    `OnTriggerEnter` 或 `OnCollisionEnter`。

    '
- fmt: "\nIn Unity, each script contains exactly one class. The name of the script\
    \ is always the same as that of the class. Otherwise there will be an error later\
    \ if you want to use this. Therefore, when choosing the name of the script, the\
    \ following also applies: do not use spaces or special characters. To create a\
    \ script, do one of the following:\n\n- You use the main menu `Assets / Create`\
    \ and select the desired script type (in our case `C# Script`).\n- You use the\
    \ `Create` menu of the `Project Browser` (located above), where you can also find\
    \ the script types listed.\n- You use the context menu of the `Project Browser`,\
    \ which you can access with the right mouse button. You can also find the script\
    \ types there via the `Create` menu branch.\n- You use the `New Script` option\
    \ of the `Add Component` button in the `Inspector`. As soon as you select a `GameObject`\
    \ in the hierarchy, you will find it among all added components of the `GameObject`.\
    \ The script is created by default in the root of the project browser and attached\
    \ to the selected `GameObject`.\n\nDouble-clicking on the created script opens\
    \ it in the standard development environment `MonoDevelop`.\n\n# Rename scripts\n\
    \nIf you subsequently change the name of a script in the project browser or in\
    \ the script itself, the counterpart must always be changed at the same time.\
    \ If they differ, be it only case-sensitive, there will be an error later or you\
    \ simply cannot add it to a `GameObject`. Therefore, use the rename functionality\
    \ in `MonoDevelop` at best when renaming. This not only renames the class, but\
    \ also the script and all integrations of the script in the project. You can access\
    \ this function with the right mouse button `Refactor / Rename` as soon as you\
    \ have positioned the cursor in the class name. The `Rename` function also makes\
    \ sense if you want to rename related variables. In this case, too, all positions\
    \ where you have already used them will be renamed.\n\n# Rename scripts\n\nIf\
    \ you rename a script that has already been attached to a `GameObject` in a scene,\
    \ you may find an entry `\"Missing (MonoBehaviour )` instead of the script after\
    \ renaming it. In such a situation, delete this entry and add your renamed script\
    \ again. The easiest way to delete this entry is to use the `Remove Component`\
    \ function in the context menu of the component (symbolized by the gear in the\
    \ `Inspector`).\n\n# The script framework\n\nIf you have created a new `C#` script\
    \ as described above and now open it with a double click, you will see the following\
    \ basic structure:\n\n```csharp\nusing UnityEngine;\nusing System.Collections;\n\
    \npublic class MyScriptName: MonoBehaviour {\n\n    // Use this for initialization\n\
    \    void Start () {\n\n    }\n\n    // Update is called once per frame\n    void\
    \ Update () {\n\n    }\n}\n```\n\nIn the first two lines, the command `using`\
    \ with two namespaces is integrated. The `UnityEngine` namespace in particular\
    \ is mandatory for a `MonoBehaviour` script and must not be removed. If necessary,\
    \ additional namespaces can of course be added above. After the namespaces, the\
    \ class definition follows with the `MonoBehaviour` inheritance. By default, each\
    \ script inherits from this class, which also provides the `start` and `update`\
    \ methods. You can also delete these methods if necessary. You can also change\
    \ or completely remove the inheritance. Only then are these classes logically\
    \ no longer usable as components.\n\n# Unity's event methods\n\nYou now know how\
    \ to script in Unity. Now the question remains when the code in these scripts\
    \ will actually be executed. The procedure of Unity is the following: `MonoBehaviour`\
    \ provides several methods that are triggered by certain events or that are called\
    \ at regular intervals by Unity. Here Unity runs through all `GameObjects` and\
    \ their script instances and executes the corresponding methods there. I would\
    \ like to briefly introduce some of these important methods below. Keep in mind\
    \ that every script can / may have these methods, but they do not have to be implemented.\
    \ On the contrary, it is better to delete methods if they are not filled with\
    \ code. Because each of the following methods is called according to the definitions\
    \ and accordingly costs performance, even if they are empty.\n\n# Update\n\nThe\
    \ most important method in Unity is the `Update` method. Most of the code is programmed\
    \ here. `Update` runs throughout the game, each time before a frame is rendered,\
    \ that is, before a new frame is drawn on the monitor. Note that the rendering\
    \ times of the individual frames can vary. If you want to program in `update`\
    \ code that should be independent of frames, the values should be multiplied again\
    \ with the time value `deltaTime` of the class `Time`. This value represents the\
    \ time between the last and the current frame. For example, if you add motion\
    \ directly to a `GameObject` using the `Transform` component. Each time `Update`\
    \ is called, the object is moved a little bit further. You can find out more about\
    \ `Transform` in Chapter 5, \"Objects in the Third Dimension\".\n\n```csharp\n\
    void Update ( ) {\n    float speed = 20.0F;\n    float distance = speed * Time.deltaTime;\n\
    \    transform.Translate (Vector3.forward * distance);\n}\n```\n\n# FixedUpdate\n\
    \nThe `FixedUpdate` method is called in defined time intervals and should be used\
    \ if you `Rigidbodys` want to access (`Rigidbodys` are responsible for physical\
    \ behavior). The background is that the physics engine does not work frame-based,\
    \ but works in discrete time intervals, i.e. in fixed time periods. Therefore,\
    \ before each calculation of the physics in Unity, all `FixedUpdate` methods are\
    \ executed in the `MonoBehaviour` scripts. You can find out more about physics\
    \ in \"Physics\". The following example adds a torque to the rigid body in every\
    \ `FixedUpdate` call so that it rotates around Y axis.\n\n```csharp\nvoid FixedUpdate\
    \ ( ) {\n    rigidbody.AddTorque (0, 2, 0);\n}\n```\n\n# Change time interval\n\
    \nBy default, the time interval in which `FixedUpdate` is called is 0.2 seconds.\
    \ You can change this via `Edit / Project Settings / Time / Fixed Timestep`.\n\
    \n# Awake\n\nThis method is executed once, when the script instance is loaded.\
    \ When loading a scene, all objects in the scene are initially initialized. Then\
    \ the `Awake` methods of the individual `GameObjects` are called in a random order.\
    \ Since all `GameObjects` were initially initialized, it is already possible to\
    \ find `GameObjects` and assign variables.\n\n```csharp\nprivate GameObject cam;\n\
    \nvoid Awake ( ) {\n    cam = GameObject.FindWithTag (\"MainCamera\");\n}\n```\n\
    \n# begin\n\nThe `Start` method behaves similarly to `Awake`. However, unlike\
    \ `Awake`, this method is only carried out on active instances. If a script instance\
    \ is deactivated at the beginning and is later set to enabled, `Start` is only\
    \ called at that moment. In addition, the `Start` methods are only called after\
    \ all `Awake` methods have been executed, which makes it easy to control the order\
    \ of initialization and to delay certain executions. The following example uses\
    \ the `FindWithTag` method to find the player character for theirs. Assign a script\
    \ instance of the `HealthController` class to a temporary variable. The next step\
    \ is to query the current value of health and assign it to its own private variable.\n\
    \n```csharp\nprivate int playerHealth;\n\nvoid Start ( ) {\n    HealthController\
    \ hc = GameObject.FindWithTag (\"Player\").GetComponent <HealthController > ();\n\
    \    playerHealth = hc.health;\n}\n```\n\n# OnGUI\n\nThe `OnGUI` method is part\
    \ of Unity's own programming-oriented GUI system. In this method, the controls\
    \ for this system are programmed. Since the system does not work frame-based,\
    \ but rather event-based, where the events are triggered by user input or internal\
    \ Unity rendering processes, this method is also called accordingly. For this\
    \ reason, `OnGUI` can also be called several times per frame. You can find out\
    \ more about GUI in the chapter of the same name.\n\n```csharp\nvoid OnGUI ( )\
    \ {\n    GUI.Label (new Rect ( 0,0,100,30), \"Hello World!\");\n}\n```\n\n# LateUpdate\n"
  raw: 'In Unity, each script contains exactly one class. The name of the script is
    always the same as that of the class. Otherwise there will be an error later if
    you want to use this. Therefore, when choosing the name of the script, the following
    also applies: do not use spaces or special characters. To create a script, do
    one of the following:


    - You use the main menu Assets / Create and select the desired script type (in
    our case C # Script ).       


    - You use the Create menu of the Project Browser (located above), where you can
    also find the script types listed.       


    - You use the context menu of the Project Browser, which you can access with the
    right mouse button. You can also find the script types there via the Create menu
    branch .       


    - You use the New Script option of the Add Component button in the Inspector.
    As soon as you select a GameObject in the hierarchy, you will find it among all
    added components of the GameObject. The script is created by default in the root
    of the project browser and attached to the selected GameObject.       


    Double-clicking on the created script opens it in the standard development environment
    MonoDevelop.


    ## Rename scripts


    If you subsequently change the name of a script in the project browser or in the
    script itself, the counterpart must always be changed at the same time. If they
    differ, be it only case-sensitive, there will be an error later or you simply
    cannot add it to a GameObject. Therefore, use the rename functionality in MonoDevelop
    at best when renaming. This not only renames the class, but also the script and
    all integrations of the script in the project. You can access this function with
    the right mouse button Refactor / Rename as soon as you have positioned the cursor
    in the class name. The Rename function also makes sense if you want to rename
    related variables. In this case, too, all positions where you have already used
    them will be renamed.


    ## Rename scripts


    If you rename a script that has already been attached to a GameObject in a scene,
    you may find an entry "Missing (MonoBehaviour )" instead of the script after renaming
    it . In such a situation, delete this entry and add your renamed script again.
    The easiest way to delete this entry is to use the Remove Component function in
    the context menu of the component (symbolized by the gear in the Inspector).


    ## The script framework


    If you have created a new C # script as described above and now open it with a
    double click, you will see the following basic structure:


    using UnityEngine;


    using System.Collections;


         public class MyScriptName: MonoBehaviour {


             // Use this for initialization


               void Start () {


                       }


       // Update is called once per frame


         void Update () {


                      }


          }


    In the first two lines, the command using two namespaces is integrated. The UnityEngine
    namespace in particular is mandatory for a MonoBehaviour script and must not be
    removed. If necessary, additional namespaces can of course be added above. After
    the namespaces, the class definition follows with the MonoBehaviour inheritance.
    By default, each script inherits from this class, which also provides the start
    and update methods. You can also delete these methods if necessary. You can also
    change or completely remove the inheritance. Only then are these classes logically
    no longer usable as components.


    ## Unity''s event methods


    You now know how to script in Unity. Now the question remains when the code in
    these scripts will actually be executed. The procedure of Unity is the following:
    MonoBehaviour provides several methods that are triggered by certain events or
    that are called at regular intervals by Unity. Here Unity runs through all GameObjects
    and their script instances and executes the corresponding methods there . I would
    like to briefly introduce some of these important methods below. Keep in mind
    that every script can / may have these methods, but they do not have to be implemented.
    On the contrary, it is better to delete methods if they are not filled with code.
    Because each of the following methods is called according to the definitions and
    accordingly costs performance, even if they are empty.


    ## Update


    The most important method in Unity is the Update method . Most of the code is
    programmed here. Update runs throughout the game, each time before a frame is
    rendered, that is, before a new frame is drawn on the monitor. Note that the rendering
    times of the individual frames can vary. If you want to program in update code
    that should be independent of frames, the values ​​should be multiplied again
    with the time value deltaTime of the class Time . This value represents the time
    between the last and the current frame. For example, if you add motion directly
    to a GameObject using the Transform component. Each time Update is called, the
    object is moved a little bit further. You can find out more about Transform in
    Chapter 5, "Objects in the Third Dimension" .


    void Update ( ) {


    float speed = 20.0F;


    float distance = speed * Time.deltaTime


    ; transform.Translate (Vector3.forward * distance);


    }


    ## FixedUpdate


    The FixedUpdate method is called in defined time intervals and should be used
    if you Rigidbodys want to access (Rigidbodys are responsible for Simu lose physical
    behavior). The background is that the Unity physics engine does not work frame-based,
    but works in discrete time intervals, i.e. in fixed time periods. Therefore, before
    each calculation of the physics in Unity, all FixedUpdate methods are executed
    in the MonoBehaviour scripts. You can find out more about physics in the chapter
    “Physics in Unity”. The following example adds a torque to the rigid body of the
    object in every FixedUpdate call so that it rotates around the Y axis.


    void FixedUpdate ( ) {


    rigidbody.AddTorque (0, 2, 0);


    }


    ## Change time interval


    By default, the time interval in which FixedUpdate is called is 0.2 seconds. You
    can change this via Edit / Project Settings / Time / Fixed Timestep .


    ## Awake


    This method is executed once, when the script instance is loaded. When loading
    a scene, all objects in the scene are initially initialized. Then the Awake methods
    of the individual GameObjects are called in a random order . Since all GameObjects
    were initially initialized, it is already possible to find other GameObjects and
    assign variables.


    private GameObject cam;


            void Awake ( ) {


            cam = GameObject.FindWithTag ("MainCamera");


    }


    ## begin


    The Start method behaves similarly to Awake . However, unlike Awake , this method
    is only carried out on active instances. If a script instance is deactivated at
    the beginning and is later set to enabled , Start is only called at that moment.
    In addition, the Start methods are only called after all Awake methods have been
    executed, which makes it easy to control the order of initialization and to delay
    certain executions. The following example uses the FindWithTag method to find
    the player character for theirs Assign a script instance of the HealthController
    class to a temporary variable. The next step is to query the current value of
    health and assign it to its own private variable.


    private int playerHealth;


       void Start ( ) {


         HealthController hc = GameObject.FindWithTag ("Player"). GetComponent <HealthController
    > ( ); playerHealth = hc.health;


    }


    ## OnGUI


    The OnGUI method is part of Unity''s own programming- oriented GUI system. In
    this method, the controls for this system are programmed. Since the system does
    not work frame-based, but rather event-based, where the events are triggered by
    user input or internal Unity rendering processes, this method is also called accordingly.
    For this reason, OnGUI can also be called several times per frame. You can find
    out more about GUI in the chapter of the same name.


    void OnGUI ( ) {


          GUI.Label (new Rect ( 0,0,100,30), "Hello World!");


    }


    ## LateUpdate'
