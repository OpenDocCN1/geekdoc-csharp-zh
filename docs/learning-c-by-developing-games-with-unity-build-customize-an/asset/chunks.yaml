    Unity 同样适用于创建 2D 和 3D 游戏。但它们之间的区别是什么呢？当你 Unity 中创建一个新项目时，你可以选择以 2D 或 3D 模式启动。你可能已经知道想构建什么，但有几个细微之处可能会影响你选择哪种模式。选择从
    2D 还是 3D 模式启动决定了 Unity 编辑器的某些设置——例如，图像是被导入为纹理（textures）还是精灵（sprites）。不过不用担心选错，无论你在创建项目时设置了何种模式，你都可以随时在
    2D 或 3D 模式之间切换。以下是一些可以帮助你选择的指南。


    ### 全 3D (Full 3D)


    ![](img/Image00001.jpg)


    3D 游戏通常利用三维几何体，并在这些对象的表面渲染材质和纹理，使它们看起来像构成你游戏世界的实体环境、角色和物体。相机可以在场景中自由移动，光影以写实的方式投射在世界。3D
    游戏通常使用透视渲染场景，因此物体在靠近相机时在屏幕上显示得越大。对于所有符合这一描述的游戏，请从 3D 模式下启动。


    ### 正交 3D (Orthographic 3D)


    ![](img/Image00002.jpg)


    有时游戏使用 3D 几何体，但使用正交相机而不是透视相机。这在提供俯瞰视角的游戏中很常见，有时被称为“2.5D”。如果你正在制作这样的游戏，也应该在 3D
    模式下使用编辑器，因为尽管没有透视效果，你仍然在处理 3D 模型和资产。不过，你需要将相机和场景视图切换到正交（Orthographic。（上面的场景来自
    Synty Studios 和 BITGEM）


    ### 全 2D (Full 2D)


    ![](img/Image00003.jpg)


    许多 2D 游戏使用扁平化图形，有时称为精灵（sprites），这些图形完全没有三维几何体。它们作为扁平图像绘制在屏幕上，游戏相机没有透视关系。对于这类游戏，你应该在
    2D 模式下启动编辑器。


    ### 2D 玩法 + 3D 图形 (2D gameplay with 3D graphics)


    ![](img/Image00004.jpg)


    一些 2D 游戏使用 3D 几何体作为环境和角色，但将玩法限制在二维空间。例如，相机可能显示“侧滚视图”，玩家只能在两个维度上移动，但游戏仍然使用 3D 模型作为障碍物，并对相机使用
    3D 透视。对于这些游戏，3D 效果可能出于风格性而非功能性的目的。这类游戏有时也被称为“2.5D”。尽管玩法是 2D 的，但你大部分时间都在操作 3D 模型来构建游戏，因此你应该在
    3D 模式下启动编辑器。


    也许游戏行业是这个时代最困难的行业之一，在许多方面，这种困难始于技术挑战，穿过难以满足的观众（如果产品没有达到要求的水平，即使对大公司来说也是冷酷的），而且还面临着激烈的竞争、高失败率，以及实现覆盖高昂制作成本的利润的困难。


    另一方面，该行业也有一些特征使得在其中生存成为可能。从技术方面来说，例如绝大多数游戏并不缺乏相似的功能和重复的数据处理模式，这使得复用之前游戏的软件模块来创建新游戏成为可能。这反过来有助于克服技术障碍并缩短时间和精力投入。


    当你谈论制作游戏时，你指的是一个巨大的过程，涉及到在许多领域完成的几十个甚至可能上百个任务。制作游戏意味着生产、营销和发布游戏，以及这些操作中涉及的所有行政、技术、财务和法律程序和步骤。然而，对于我们这系列课程来说，重要的是技术方面，即**游戏开发**，它是构建包含所有组件的最终软件产品的过程。这个过程并不一定包含游戏设计，因为设计过程具有更广泛的视角，关注于故事、游戏的整体特征、关卡的形状和对手的本质，以及游戏的规则、目标和胜负判定条件等。


    回到游戏开发过程，我们发现许多专业领域和技能对这个过程做出了贡献。除了当然的程序员之外，还有画家、模型设计师、动画技术人员、音效工程师和导演。了解这种全面的视角很重要，程序员在制作游戏中的角色只是其他团队成员角色不可或缺的一部分，尽管这种形象正随着独立开发者（Indie
    Developers）的出现而发生变化，他们在执行编程之外还承担许多任务。


    ### 功能较少，前景更多 (Fewer features, more promise)


    如果你玩过《越野迅猛龙游猎》（Off-Road Velociraptor Safari）以及 Blurst 网站上的其他游戏，你将更好地理解在没有经验丰富的韩国
    MMO 开发者团队的情况下用 Unity 能做什么。该游戏有 3D 模型、物理效果（控制物体如何写实移动的代码）、碰撞（检测物体何时碰撞的代码）、音乐和音效。就像《融合坠》（Fusion
    Fall）一样，游戏可以通过 Unity Web Player 插件在浏览器中运行。Flashbang Studios 还销售其游戏的下载版本，证明了 Unity
    也可以生成可执行的游戏文件。


    ### 也许我们应该制作《越野迅猛龙游猎》？(Maybe we should build Off-Road Velociraptor Safari?)


    好吧！我们现在还不能创建《融合坠》，但完全可以创建一个像《越野迅猛龙游猎》这样的小游戏，对吧？嗯……不。再次，这本书并不是为了灭你的游戏开发梦想。但事实是，《越野迅猛龙游猎》是由五个非常有才华且经验丰富的专家花费了八周的全职时间完成的，从那时他们一直在对其进行调整和改进。

