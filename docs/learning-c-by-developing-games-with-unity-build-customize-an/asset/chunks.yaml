    The second type of special attacks as we mentioned is a fissile attack, which
    leads to the fragmentation of the projectile into smaller projectiles (fragments),
    which in turn scatter over a relatively large area. Before moving to the programmer
    for this attack, we note that its implementation will need to create new objects,
    fragments that will be scattered by the implementation of the attack. This means
    that we will need to build molds for these fragments, and there will be two molds
    specifically: one for elephant extruded fragments and the other for giraffe extruded
    fragments. I will call these two templates ElephantCluster and GiraffeCluster,
    which are virtually the same in everything except the image shown. These two molds
    are simple, each carrying the original projectile image with the object scaled
    down to 0.75 on the x and y axes to make the fragments smaller than the original
    projectile. In addition, we will add a Rigid Body 2D rigid component and a Circle
    Collider 2D collision component, making the fragment molds ready.


    The applet that will implement this type of attack is called ClusterAttack and
    is described in the following narrative:


    using UnityEngine;


    using System.Collections;


    public class ClusterAttack: MonoBehaviour {


        // template that will be used to create fragments


        public GameObject clusterPrefab;


         // The number of seconds each fragment will live before being destroyed and
    removed from the scene


        public float clusterLife = 4.0f;


        // How many fragments will be produced from this projectile


        public int clusterCount = 3;


    // Called once at startup


    void Start () {


    }


    // Called once when rendering each frame


    void Update () {


    }


        // Consequently implements the DoSpecialAttack fission attack to receive the
    message


        public void DoSpecialAttack ()


        {


            // Bring the current speed of the original projectile


            Rigidbody2D myRB = GetComponent <Rigidbody2D> ();


            float originalVelocity = myRB.velocity.magnitude;


            // Store all the collision components of the fragments in this array


            Collider2D [] colliders = new Collider2D [clusterCount];


            Collider2D myCollider = GetComponent <Collider2D> ();


            for (int i = 0; i <clusterCount; i ++)


            {


                // Create a new fragment


                GameObject cluster = (GameObject) Instantiate (clusterPrefab);


                // Set the location, name, and father of the splint object


                cluster.transform.parent = transform.parent;


                cluster.name = name + "_cluster_" + i;


                cluster.transform.position = transform.position;


                // Store the fragment collision component at the current location
    in the array


                colliders [i] = cluster.GetComponent <Collider2D> ();


                // Neglect the collision that can occur between this fragment and
    the fragments created before it


                // In addition to the collision that can occur between the fragment
    and the original object


                Physics2D.IgnoreCollision (colliders [i], myCollider);


                for (int a = 0; a <i; a ++)


                {


                   Physics2D.IgnoreCollision (colliders [i], colliders [a]);


                }


                Vector2 clusterVelocity;


                // With each new fragment we reduce the vehicle speed horizontally
    and increase it vertically in order to ensure fragmentation


                clusterVelocity.x = (originalVelocity / clusterCount) * (clusterCount
    - i);


                clusterVelocity.y = (originalVelocity / clusterCount) * -i;


                // Bring a solid body object to the new splinter


                Rigidbody2D clusterRB = cluster.GetComponent <Rigidbody2D> ();


                clusterRB.velocity = clusterVelocity;


                // Select the fragment block to equal the mass of the original object


                clusterRB.mass = myRB.mass;


                // Destroy the splinter after its age has passed


                Destroy (cluster, clusterLife);


            }


            // Finally destroy the original projectile object


            Destroy (gameObject);


        }


    }


    The idea of doing this attack is to receive the DoSpecialAttack message and then
    create the specified number of fragments using the specified template. In order
    to prevent collisions between fragments and some of them and also between fragments
    and the original projectile - where a collision can occur the moment before it
    is deleted from the scene - we use the Physics2D.IgnoreCollision () function and
    provide it with the two collision components that we want to ignore collisions
    between. Note that we knew a matrix of collision components in order to store
    the components of all fragments, and when creating a new fragment we pass on the
    components of the collisions of the previous fragments and call the function mentioned
    between the old and new components in order to negate the collisions. The next
    step is the speed of the splinter motion, where we take the amount of the original
    projectile''s velocity and multiply it each time by a different value to get the
    horizontal and vertical components of the new velocity. These two components change
    from fragment to another, where the first fragment begins with a high horizontal
    and low vertical vehicle, and then these values begin to change as the vertical
    value increases gradually downward and the horizontal decreases, resulting in
    the dispersion of projectiles in a manner similar to what you see in the picture
    below (I have in this picture Increase the number of fragments to clarify the
    idea):


      ![](Image00013.gif)


    Note that the fragments spread apart from the original projectile fission site.
    Then we adjust the mass of each fragment to equal the mass of the original projectile.
    While it is logical to divide the mass by the number of fragments in order to
    distribute them evenly, copying the original mass of all fragments will give them
    greater destruction power, giving the special attack its preferred advantage.


    ## Ejector industry


    Let us now turn to the ejector, a slingshot that will launch these projectiles
    towards its targets. Unfortunately, our graphics package does not contain a slingshot
    image, so we will try to use some wooden and metal shapes to create a simple shape
    that looks like it. Here I will use three wooden rectangles and a stone triangle
    to make the shape you see in the following picture. These objects must be placed
    as sons of one empty object containing all of them, and the Order in Layer value
    in the Sprite Renderer component of the triangle must also be adjusted and made
    1, so that it appears in front of the pieces as shown in the picture:


    ![](Image00014.jpg)


    In addition to the four images we have scaled and rotated to make a slingshot,
    there are 3 blank objects that indicate colored lines to their locations. These
    empty objects have a software utility that we will see shortly. The LaunchPos
    object represents where the projectile is placed before it is launched, and the
    RightEnd and LeftEnd objects represent the locations of the ends of the rubber
    band that will push the projectiles when they are launched. The slingshot in its
    current form is ready to make the initial version of the mold, to which we will
    add some applets and other components to it.


    The first of these is the main applet that launches projectiles at targets. Let''s
    get to know this applet called Launcher in the following narrative and then discuss
    the details of its functions:


    using UnityEngine;


    using System.Collections;


    public class Launcher: MonoBehaviour {


         // The launch force coefficient of this ejector


