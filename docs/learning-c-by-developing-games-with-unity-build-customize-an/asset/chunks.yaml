    ## 泛型类和方法\n\n面向对象编程中的“泛型”（generic）一词实际上意味着例如方法或类，即不无论类型如何设计。最终使用的类型（或方法）通过角括号传递给类（或方法）。在\
    \ C# 中，这种要分配的类型通常用泛型类（或方法）中的字母 `T` 表示。\n\n```csharp\nusing UnityEngine;\nusing\
    \ System.Collections;\n\npublic class MyGeneric <T> {\n    public T current;\n\
    }\n```\n\n在泛型类中使用类型参数 `T` 的地方，稍后都会使用传递的类型。因此，变量 `current` 将具有你在声明实例时所指定的数据类型。\n\
    \n```csharp\nMyGeneric <string> test = new MyGeneric <string> ();\ntest.current\
    \ = \"ddd\";\n\nMyGeneric <int> test2 = new MyGeneric <int> ();\ntest2.current\
    \ = 2;\n```\n\n## 巧妙运用\n\nUnity 项目中经常使用的泛型类型是 `List<T>`。它的工作原理与数组类似，但该类型提供的功能比普通数组多得多。你可以使用\
    \ `Add` 方法向这些对象添加许多新元素，使用各种命令搜索它们，或使用 `Remove` 删除特定元素。创建列表对象时只需输入对象应包含的类型。在接下来的示例中，你应该特别注意\
    \ `System.Collections.Generic` 的 `myNumbers` 变量声明。\n\n```csharp\nusing UnityEngine;\n\
    using System.Collections;\nusing System.Collections.Generic;\n\npublic class GenericTest:\
    \ MonoBehaviour {\n    private list <int> myNumbers = new list <int> ();\n\n \
    \   void Start () {\n        myNumbers.Add(2);\n        myNumbers.Add(3);\n  \
    \      myNumbers.Add(7);\n        if (myNumbers.IndexOf(3) == 0)\n           \
    \ myNumbers.Remove(3);\n        Debug.Log(myNumbers.Count.ToString()); // 输出 2\n\
    \    }\n}\n```\n\n## 排序对象\n\n`List` 类的另一个优势是使用 `Sort` 方法对不同元素进行排序。然而，你应该注意并不是每个类型都可以排序。只有当后者实现了\
    \ `system` 命名空间中的 `IComparable` 接口时才有效。你可以在互联网上找到更多关于这个主题的信息（“IComparable interface”）。\n\
    \n## 字典\n\n你应该知道的泛型命名空间中的另一个类是简称为 `Dictionary<TKey, TValue>`。它有两个泛型参数。字典存储所谓的键值对。第一个值表示唯一标识（键），第二个表示该键的值。每个键在字典中只能出现一次。下一个示例使用简单的库存展示了该类的一些功能。展示了你如何使用\
    \ `ContainsKey` 判断此键是否存在，如何使用 `Add` 方法创建新的键值对，以及如何使用键访问关联的值并进行更改。\n\n```csharp\n\
    using System.Collections;\nusing System.Collections.Generic;\n\npublic static\
    \ class SimpleInventory {\n    private static dictionary <string, int> items =\
    \ new dictionary <string, int> ();\n\n    public static void AddItems (string\
    \ key, int val) {\n        if (items.ContainsKey(key))\n            items[key]\
    \ += val;\n        else\n            items.Add(key, val);\n    }\n\n    public\
    \ static bool RemoveItems (string key, int val) {\n        if (items.ContainsKey(key))\
    \ {\n            if (items[key] >= val) {\n                items[key] -= val;\n\
    \                return true;\n            }\n        }\n        return false;\n\
    \    }\n}\n```\n"
- fmt: '

    Unity provides the programming environment `MonoDevelop` for programming the scripts.
    `MonoDevelop` is an open source development environment for software developers,
    which was developed as part of the `Mono` project, an open source alternative
    to the Microsoft .NET framework. Unity delivers a specially adapted version that,
    among other things, enables easy debugging in conjunction with Unity. Double-clicking
    a script in Unity automatically opens `MonoDevelop` with the respective script.
    If `MonoDevelop` is already open with another script, an additional tab is created
    with the respective script. The other script remains open in `MonoDevelop`, so
    it is possible to switch between the scripts.


    As a Unity developer, the main window of `MonoDevelop` is particularly important,
    in whose tabs the code of the various scripts is displayed. The `Solution Explorer`,
    which you can find on the left, is also helpful. This shows you all code files
    of the Unity project sorted according to programming languages and enables the
    opening of further script files. The storage function of `MonoDevelop` is particularly
    elementary, which you can use `File / Save` or the key combination `[Ctrl] + [S]`.
    Adjustments that should be available in Unity must always be saved in `MonoDevelop`
    first. We will talk about the debugging functionalities, which are of course also
    very important, in the chapter "Troubleshooting and Performance". If you already
    have experience with other development environments and prefer a special one (e.g.
    `Visual Studio`), you can use this instead of `MonoDevelop`. In this case you
    can save an alternative IDE in the `External Tools` area as `External Script Editor`
    under `Edit / Preferences`.


    ### Help in MonoDevelop

    The version of `MonoDevelop` that comes with Unity has some special modifications,
    including an additional help function that leads the developer directly to the
    scripting reference of Unity. To do this, select the command for which you want
    more information and press on the German PC keyboard `[Ctrl] + [Shift] + ['']`.
    Alternatively, you can do this via the `MonoDevelop` menu `Help / Unity API Reference`.
    If you only have one class name in `MonoDevelop`, such as for example, entering
    the application and calling the help will give you all the information about methods
    and variables that this class provides.


    ### Syntax error

    If you have a syntax error in a script, e.g. for example if you have forgotten
    a semicolon (`"parsing error"`) or use a non-instantiated variable, Unity will
    display an error message after you save this incorrect script. This appears both
    at the bottom of the Unity window and in the console (console tab). If you click
    on this message, `MonoDevelop` will open and you will get to where the error occurs.


    ![](Image00006.jpg)


    ### Forwarding of error messages

    Clicking on the error message in the console does not always lead to the location
    where the developer made the programming error. Should you e.g. for example if
    you forget a semicolon at the end of a line, the compiler may only recognize the
    next line as faulty, since the (previous) line of code has not yet been completed
    and this new command must not appear at this point. Especially for beginners,
    this sometimes leads to long error searches because the error can be found somewhere
    else than it is displayed.


    ### Usable programming languages

    When programming scripts, you can choose between the programming languages `JavaScript`,
    `Boo` and `C#`. While you can mix the languages in a Unity project any amount
    (not within a script!), it is recommended, as far as it goes toward it to abstain.
    An itself is the mixing of language within a project not a problem. But once you
    try to access another from one script, it can become problematic. I''ll get to
    the details in Section 4.14, "Compilation Order". Therefore, as far as possible,
    I recommend restricting yourself to one language within a project.


    ### Why C#

    As you will have noticed, I use the language `C#` in this book. Initially, Unity
    focused on the `JavaScript` language. However, this has changed significantly
    over time, so that `C#` is now the focus. `C#` offers more functionalities and
    is also more widespread than the JavaScript branch specially adapted for Unity,
    also often called `UnityScript`.


    ### Unity''s inheritance structure

    As I mentioned in the previous chapter "C# and Unity", all scripts that are to
    be used as components must inherit from the `MonoBehaviour` class. However, this
    class inherits from another class. In the end, components and `GameObject` even
    have the same origin, namely the `Object` class from the namespace `UnityEngine`.
    Figure 4.3 shows the relationships between the most important classes of the namespace
    `Unity` engine in a class diagram. The arrows always point from the derived class
    to the respective base class.


    ![](Image00007.jpg)


    ### Object

    `Object` is the parent base class of all objects in Unity. It provides some fundamental
    properties and methods, such as for example the static method `Destroy` to destroy
    an object or the method `DontDestroyOnLoad`, which I will explain in this chapter.
    The classes `GameObject`, `Component` and `ScriptableObject` are derived from
    this class. For more experienced `C#` developers, it should be pointed out again
    that this is a Unity object class, not the one provided by the framework .NET
    class.


    ### GameObject

    `GameObject` inherits directly from `Object` which is the base class of all objects
    in a scene scene. Most `GameObjects` are created via the main menu `GameObject`
    in the editor. If you want to create `GameObject` instances by code, they are
    instantiated like normal objects of a class with the keyword `new`.


    ### ScriptableObject

    `ScriptableObject` also inherits directly from `Object`. First of all, `ScriptableObjects`
    are common scripts that inherit from `ScriptableObject` and are usually used to
    store large amounts of data. Instances of these classes are created with the static
    method `CreateInstance` of the `ScriptableObject` class and can be created at
    runtime as well as development time. `ScriptableObjects` are used more in special
    situations, e.g. to create data containers that can be stored outside of a scene,
    configured and read in if required.


    ### Component

    The `Component` class also inherits from `Object` and is the basis of all classes
    that can be attached to a `GameObject`. That is why they are created by adding
    them to the respective instance using the `GameObject` method `AddComponent`.
    Other important classes inherit from `Component`, of which I would like to give
    the `Transform` and `Behavior` classes as examples. Because in Unity all of them
    are derived from `Component` classes referred to as components are often referred
    to in German as "components".


    ### Transform

    The `Transform` class inherits from `Component` and is added to every `GameObject`
    by default. Only if you create a `GameObject` with code does it not automatically
    have a transform component. In turn, the class `RectTransform` inherits from `Transform`,
    which is used by the uGUI system in the GUI design.


    ### Behavior

    The `Behavior` class inherits from the `Component` class. Classes that inherit
    from `Behavior` are also known as Behaviors or also generally as Components and
    can be switched on and off via the `enabled` property. Examples of classes that
    are derived from Behaviors are `Light` or `NavMeshAgent` which I will talk about
    in the other chapters. Finally, the `MonoBehaviour` class also inherited from
    `Behavior`.


    ### MonoBehaviour

    The class `MonoBehaviour` is the base class of all script classes in Unity that
    are to be used as components and can be attached to a `GameObject`. Even if `MonoBehaviour`
    inherits from `Behavior`, you have to keep in mind that with a deactivated enabled
    property only Execution of the methods `Start`, `Awake`, `Update` and `OnGUI`
    is prevented. Other methods can still be called and executed like the physics
    methods `OnTriggerEnter` or `OnCollisionEnter`.

    '
