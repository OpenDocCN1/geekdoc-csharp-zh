    \ that objects of this type offer significantly more functions than normal arrays.\
    \ You can add as many new elements to these objects using the `Add` method, search\
    \ them with various commands, or delete specific elements using `Remove`. You\
    \ only have to enter the type that the object should contain when creating a list\
