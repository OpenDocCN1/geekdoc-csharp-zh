  raw: 'C # was developed by Microsoft and belongs to the so-called object-oriented
    programming languages. It was developed to develop applications using the .NET
    Frame-work, a platform that provides a wide range of class libraries, programming
    interfaces and utilities. However, Unity uses the language in combination with
    the Mono Framework, an open source variant of the .NET Framework, which means
    that C # applications can also be operated on non-Microsoft systems (also known
    as a mono project) the language is very extensive, I will not introduce all of
    the possibilities of C # to you in the following and focus especially on the topics
    that are interesting for you as a Unity programmer. If you want more information
    about the C # language, you should find what you are looking for using the well-known
    search engines. There are also many good books, such as: For example, the Visual
    C # books by Walter Doberenz and Thomas Profitus, which deal with language in
    all its facets.


    If you don''t understand some of the topics right away, don''t despair. You will
    surely have one or the other eye-opening effect if you have also worked through
    the other book chapters and read through these passages again later. Game will
    be programming. The script is used to manage the strength of life and is used
    by both the player and the opponents.


    HealthController


    using UnityEngine;


    using System.Collections;


    public class HealthController : MonoBehaviour {


    public float health = 5;


    private bool isDead = false;


    void ApplyDamage(float damage) {


            health -= damage;


             if(health <= 0 && !isDead) {


                       isDead = true;


               Dying();


             }


            else {


          Damaging();


                 }


            }


    public virtual void Damaging() {


    }


    public virtual void Dying () {


    }


    }


    ## syntax


    First of all, a few words about basic programming: Program code (also called source
    code) consists of lines of code that are processed one after the other. So that
    the computer also understands these lines, they are translated into machine language
    with a program called compiler, the so-called compiling. So that the compiler
    also knows when the end of a single line of code is reached, a semicolon is added
    to the end in C #; written. Other important characters in C # are the curly braces
    {}. These are used to identify coherent blocks of code.


    ## Comments


    In addition to the actual code, you may also want to add annotations to your code
    that are not meant to be run by the computer. Such lines that are not to be executed
    are also called comments. Mark a comment with a double slash //. Anything behind
    it until the next line break is considered non-executable code. What is in this
    line before the double slash is considered executable!


    One-line comment in number1; // This is a command line that is also compiled.
    Number1 = 2; if you want to mark multiple lines as comments, you can do this by
    writing / * at the beginning and * / at the end:


    Multi-line comment


    / * This is old Codeint life


    Points;


    lifePoints = 2;


    * /


    int lifePoints = 2;


    // This is the new code


    Usually, comments from the development environment are highlighted in color, e.g.
    B. in green or red.


    ## variables


    First of all, variables are nothing more than placeholders for storing values.
    The name of a variable must always be unique and is assigned by you. Even if this
    doesn''t matter at first, you have to make sure that it doesn''t have any special
    characters, umlauts or spaces. In addition, variable names cannot begin with a
    number.


    ## Naming conventions


    To make program code easier to read, there are a few conventions that you should
    stick to. Firstly, the variable names should describe the content of the variables.
    It is best to use English terms, e.g. B. speed . In addition, variable names should
    always begin with a lowercase letter. For names that consist of several words,
    these should be separated from each other by capital letters, e.g. B. enemySpeed
    . This spelling is also called camel case.


    ## Data types


    So that the compiler also knows what values ​​can be stored in a variable (numbers,
    letters ...), you have to tell the variable what type of data it is. This is called
    a variable declaration. Frequently used data types are in Unity game development:
    ƒ string for text ƒ int for integer ƒ float for floating point number ƒ bool for
    Boolean ƒ enum for enumeration In C # the declaration of a variable begins with
    the data type followed by the name of the variable. At the end of course follows
    the semicolon:


    Variable declaration


    int lifePoints;


    float height;


    string name;


    To assign values ​​to these variables, the equal sign is used in C #:


    Assign values


    lifePoints = 2;


    name = "Carsten";


    height = 1.5F;


    As you can see, in addition to the text itself, I use quotes to tell the compiler
    where the assigned text begins and where it ends. When I assign commas (I need
    the float data type), I write a period instead of the comma. I also write an F
    after the value for float variables so that the compiler knows that the value
    is actually a floating point number of the float type. Alternatively, there is
    also the double type in C #, which, however, covers a larger number range than
    float and therefore does not "fit" into a float variable:


    Difference float and double


    float gravity;


    gravity = 9.81F;


    double gravity;


    double = 9.81;


    In Unity, however, float is more common than double, which is why I will only
    speak of float values ​​in the future. To shorten the code above, you can also
    assign a value to the variable when you declare it (also called initialization):


    ## Variable declaration with initialization


    float gravity = 9.81F;


    Another type that is used a lot in game programming is the data type Boolean (bool).
    This type can only assume two states: TRUE and FALSE, meaning true or false. A
    typical example of this is a checkbox, i.e. a checkmark in the GUI, for example
    to activate or deactivate a function. Depending on the state of this checkbox,
    the Boolean variable that stores the value in the program code has the value TRUE
    or FALSE.


    ## Boolean variable


    bool isAttacking = false;


    ## Keyword var


    In addition to specifying a data type with int, string, etc., there is also the
    option in C # to define a variable with var . In this case, the data type of this
    variable is only determined when the first value is assigned. Then the compiler
    decides which data type is the right one and defines it. Any future assignment
    that would require a different type then leads to an error.


    var lifePoint; lifePoint = 5;


    ## Data fields / array


    If you need several variables of one data type, you can create them using an array
    definition. An array is not a data type in itself, but rather a variation of a
    data type.


    ## Create arrays


    You define an array with square brackets after the actual data type:


    int [] speedLimits;


    In contrast to a normal variable, the array does not yet exist through the sole
    definition of the variable. You have to do this again with the keyword new . This
    process is also called instantiation. In addition, when you instantiate the array,
    you must also specify how large it should be, i.e. how many integer variables
    the array should consist of. It looks like this:


    speedLimits = new int [5];


    Or a little shorter:


    int [] speedLimits = new int [5];


    When instantiating, you can also give each element of the array a start value.
    This can look like this:


    int [] speedLimits = new int [5] {30,50,80,100,120};


    It is important that you actually pass as many values ​​in the curly brackets
    as there are elements in the array.


    ## Access to an array element


    If you now want to access a certain element of this array, you have to select
    the correct item using an index number. For inexperienced users, this will mean
    a change, because the first element of an array has the index 0, not 1! An array
    with five elements has the highest index 4!


    int [] speedLimits = new int [5] {30,50,80,100,120};'
