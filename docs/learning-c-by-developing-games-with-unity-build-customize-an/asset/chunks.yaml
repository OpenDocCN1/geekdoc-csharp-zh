    # 引言


    Unity 是一个跨平台开发平台，最初用于开发游戏，但现在用于许多领域，如架构、艺术、儿童应用、信息管理、教育、娱乐、营销、医疗、军事、物理装置、模拟、训练等。Unity
    承担了开发游戏及类似交互体验的许多复杂性，并在后台进行处理，让人们能够专注于游戏的设计和开发。这些复杂性包括图形渲染、世界物理和编译。更高级用户可以根据需要对其进行交互和调整，但初学者无需担心这些。在
    Unity 中，游戏开发分为两个部分：第一部分是在 Unity 编辑器内完成的，第二部分是使用代码，特别是 `C#`。Unity 绑定了 MonoDevelop
    或 `Visual Studio 2019 Community` 来编写 `C#`。


    ## 2D 或 3D 项目


    '
- fmt: '

    Unity is equally suited to creating both 2D and 3D games. But what’s the difference?
    When you create a new project in Unity, you have the choice to start in 2D or
    3D mode. You may already know what you want to build, but there are a few subtle
    points that may affect which mode you choose. The choice between starting in 2D
    or 3D mode determines some settings for the Unity Editor -such as whether images
    are imported as textures or sprites. Don’t worry about making the wrong choice
    though, you can swap between 2D or 3D mode at any time regardless of the mode
    you set when you created your project. Here are some guidelines which should help
    you choose.


    ### Full 3D


    ![](Image00001.jpg)


    3D games usually make use of three-dimensional geometry, with materials and textures
    rendered on the surface of these objects to make them appear as solid environments,
    characters and objects that make up your game world. The camera can move in and
    around the scene freely, with light and shadows cast around the world in a realistic
    way. 3D games usually render the scene using perspective, so objects appear larger
    on screen as they get closer to the camera. For all games that fit this description,
    start in 3D mode.


    ### Orthographic 3D


    ![](Image00002.jpg)


    Sometimes games use 3D geometry, but use an orthographic camera instead of perspective.
    This is a common technique used in games which give you a bird’s-eye view of the
    action, and is sometimes called “2.5D”. If you’re making a game like this, you
    should also use the editor in 3D mode, because even though there is no perspective,
    you will still be working with 3D models and assets. You’ll need to switch your
    camera and scene view to Orthographic though. (scenes above from Synty Studios
    and BITGEM)


    ### Full 2D


    ![](Image00003.jpg)


    Many 2D games use flat graphics, sometimes called sprites, which have no three-dimensional
    geometry at all. They are drawn to the screen as flat images, and the game’s camera
    has no perspective. For this type of game, you should start the editor in 2D mode.


    ### 2D gameplay with 3D graphics


    ![](Image00004.jpg)


    Some 2D games use 3D geometry for the environment and characters, but restrict
    the gameplay to two dimensions. For example, the camera may show a “side scrolling
    view” and the player can only move in two dimensions, but game still uses 3D models
    for the obstacles and a 3D perspective for the camera. For these games, the 3D
    effect may serve a stylistic rather than functional purpose. This type of game
    is also sometimes referred to as “2.5D”. Although the gameplay is 2D, you will
    mostly be manipulating 3D models to build the game so you should start the editor
    in 3D mode.


    Perhaps the gaming industry is one of the most difficult industries in this era,
    and that is in many ways that start with technical challenges, passing through
    an audience that is difficult to satisfy and ruthless even for the major companies
    if their products are not at the required level, and not an end to fierce competition
    and high failure rates and the difficulty of achieving profits that cover high
    production costs.


    On the other hand, there are features of this industry that make survival in it
    possible. On the technical side, for example, the vast majority of games are not
    free of similar functions and repetitive patterns of data processing, which makes
    the reuse of the software modules of previous games in order to create new games
    possible. This, in turn, contributes to overcoming technical obstacles and shortening
    time and effort.


    When you talk about making a game, you are here to mention the big process that
    involves dozens and possibly hundreds of tasks to accomplish in many areas. Making
    a game means producing, marketing, and publishing it, and all the administrative,
    technical, and financial, and legal procedures and steps involved in these operations.
    However, what is important for us in this series of lessons is the technical aspect
    which is game development, which is the process of building the final software
    product with all its components. This process does not necessarily include game
    design, as the design process has a broader perspective and focuses on such things
    as the story, the general characteristic of the game, the shapes of the stages
    and the nature of the opponents, as well as the rules of the game, its goals and
    terms of winning and losing.


    Returning to the game development process, we find that many specializations and
    skills contribute to this process. There are painters, model designers, animation
    technicians, sound engineers, and director, in addition to - of course - programmers.
    This comprehensive view is important to know that the programmer''s role in producing
    the game is only an integral role for the roles of other team members, though
    this image is beginning to change with the emergence of independent developers
    Indie Developers who perform many tasks besides programming.


    ### Fewer features, more promise


    If you play Off-Road Velociraptor Safari and some of the other games on the Blurst
    site, you''ll get a better sense of what you can do with Unity without a team
    of experienced Korean MMO developers. The game has 3D models, physics (code that
    controls how things move around somewhat realistically), collisions (code that
    detects when things hit each other), music, and sound effects. Just like Fusion
    Fall, the game can be played in the browser with the Unity Web Player plugin.
    Flashbang Studios also sells downloadable versions of its games, demonstrating
    that Unity can produce executable game files too.


    ### Maybe we should build Off-Road Velociraptor Safari?


    Right then! We can''t create Fusion Fall just yet, but we can surely create a
    tiny game like Off-Road Velociraptor Safari, right? Well... no. Again, this book
    isn''t about crushing your game development dreams. But the fact remains that
    Off-Road Velociraptor Safari took five supremely talented and experienced guys
    eight weeks to build on full-time hours, and they''ve been tweaking and improving
    it ever since. Even a game like this, which may seem quite small in comparison
    to full-blown MMO like Fusion Fall, is a daunting challenge for a solo developer.


    ### I bent my Wooglie


    Wooglie.com is a Unity game portal hosted by M2H Game Studio in the Netherlands.
    One glance at the front page will tell you that it''s a far different portal than
    Blurst.com. Many of the Wooglie games are rough around the edges, and lack the
    sophistication and the slick professional sheen of the games on Blurst. But here
    is where we''ll make our start with Unity. This is exactly where you need to begin
    as a new game developer, or as someone approaching a new piece of technology like
    Unity.

    '
