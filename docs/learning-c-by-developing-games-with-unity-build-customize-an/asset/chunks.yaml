    ## Save and load data


    With the PlayerPrefs class, Unity offers you a great way to save values ​​regardless
    of the system. Regardless of whether Windows, Mac OSX, the web player or Android,
    you simply transfer the values ​​to be saved to the PlayerPrefs methods. Unity
    will take care of where they actually end up. In the following section there is
    a small application example.


    ## PlayerPrefs preferences


    Even if the paths differ on all platforms, they all use the names for Company
    Name and Product Name stored in Unity. On Windows systems, the registry path HKCU
    \ Software \ [ company name is used for stand-alone applications, for example
    ] \ [product name] taken, web player applications write to the directory % APPDATA%
    \ Unity \ WebPlayerPrefs on Windows systems .


    Change the company name and product name in the Player Settings ( Edit / Project
    Settings / Player ). By default, Company Name is set to " DefaultCompany" and
    Product Name to the name of your project.


    ## save data


    PlayerPrefs provides three static methods to save values ​​as int, float or string.
    All three methods expect two parameters. Pass the first parameter a string that
    represents a unique identifier, i.e. the key (the ID or the name of the value).
    The second parameter is then the actual value in the particular data type.


    PlayerPrefs.SetInt ("Lifepoints", 4);


    PlayerPrefs.SetFloat ("Speed", 2.5F);


    string playerName = "Carsten";


    PlayerPrefs.SetString ("Name", playerName);


    There are also three static methods for loading the data. You also have to hand
    over the key here.


    int myLifepoints = PlayerPrefs.GetInt ("Lifepoints");


    float speed = PlayerPrefs.GetFloat ("Speed");


    string playerName = PlayerPrefs.GetString ("Name");


    ## Check the key


    Before loading data, i.e. accessing a key, it can often make sense to first check
    whether it actually exists. Even if Unity does not cause an error here, it can
    still make sense to assign default values ​​to the variable. You do this with
    the HasKey command .


    if (! PlayerPrefs.HasKey ("Lifepoints"))


    PlayerPrefs.SetInt ("Lifepoints", 5);


    ## Clear


    Of course, you can not only create new entries, you can also delete them. Here
    you can use the static method DeleteKey . To delete all saved values ​​at once,
    you can use DeleteAll .


    PlayerPrefs.DeleteKey ("Lifepoints");


    PlayerPrefs.DeleteAll ();


    ## Save


    On some platforms, such as the web player, Unity does not write the values to
    the hard drive when calling the methods SetInt , SetFloat and SetString . Instead,
    Unity temporarily saves them temporarily. Only when you exit the application,
    the web player that would be the proper closing the tab or the browser, these
    values are only to disk geschrieben.Da to Unity in the background taking care
    of everything that makes this behavior for First no difference. Only in the event
    of an error, e.g. For example, if the browser crashes, the values ​​may no longer
    be able to be written back in time. For this, Unity now provides the Save command,
    which you can use to force the actual saving.


    PlayerPrefs.Save ();


    ## Cross-scene data


    GameObjects actually only exist within a scene. If a new scene is started, all
    GameObjects of the previous scene are destroyed, loading a new scene is done with
    the LoadLevel method of the Application class. You pass this either the name or
    the level index of the respective scene. You define these in the Build Settings,
    which you can access via File / Build Settings . You can find out more about this
    in the chapter “Creating and publishing games ” .


    Application.LoadLevel (1);


    However, if all GameObjects are now destroyed, this of course has the disadvantage
    that data such. B. Experience points, strength of life, etc. are lost when the
    scene changes. After all, they are saved in scripts that are attached to a GameObject.
    There are, of course, solutions to this dilemma, even several. I would like to
    introduce two of these approaches to you.


    ## Passing values ​ ​ with PlayerPrefs


    You have already got to know the first approach: PlayerPrefs. You can easily all
    the values that you want to pass, they simply load when exiting a scene with PlayerPrefs
    abspei-manuals and at the start of a new scene and the variables again zuweisen.Hierfür
    one option would be storing the values in the OnDestroy - method provides every
    MonoBehaviour script. If the objects and components are then destroyed when changing
    to a new scene, the data of a script is written away here. In the start - or Awake
    method they can then read back werden.Hierzu a small example: The following script
    has a variable health whose aktuel-ler value is stored methods PlayerPrefs-on
    exit with. If a new scene is then started, the script reads this value back into
    the variable from the PlayerPrefs in the start method . Because the key will not
    yet exist when the script is called up for the first time, a check is carried
    out to prevent errors before reading in whether this key actually exists.


    using UnityEngine;


    using System.Collections;


         public class HealthValue: MonoBehaviour {


                 public int health = 2;


           void Start () {


             if (PlayerPrefs.HasKey ("Health"))


                           health = PlayerPrefs.GetInt ("Health");


        }


               void OnDestroy () {


                PlayerPrefs.SetInt ("Health ", health );


      }


    }


    ## Use start menus for initialization


    There are a few points to consider when using the above script. For example, when
    the game is ended and restarted, the variable is always assigned the value of
    the last game. This may be desirable when continuing an old game, but certainly
    not when restarting the game. To prevent this from happening, there is a simple
    solution: You can do this in an upstream scene, e.g. B. a start menu scene, the
    keys with the initial values. This allows you to use the above script even without
    the HasKey query. You can also use the start menu to ask the player whether they
    want to continue an old game or start a new one. Such a script could then look
    like this:


    using UnityEngine;


    using System.Collections;


           public class InitValues: MonoBehaviour {


              public int health = 2;


        void OnGUI ( ) {


               if ( GUILayout.Button ("New")) {


         PlayerPrefs.SetInt ("Health", health);


             Application.LoadLevel (1);


               }


        if (PlayerPrefs.HasKey ("Health")) {


         if (GUILayout.Button ("Continue")) {


           Application.LoadLevel (1);


          }


         }


      }


    }


    For example, the above script could be used in the scene with index 0, with the
    previous HealthValue script being used accordingly in a scene with index 1.


