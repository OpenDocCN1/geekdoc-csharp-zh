    \ - = 5; // 从当前值减去 5，因此 `health` 实际上将变为 -2`\n\n`h = npc.Health; // `Health` 返回\
    \ 0`\n\n由于 Unity 的检查器（Inspector）只显示公共变量而不显示属性方法，因此属性方法在 Unity 中并不经常使用。\n\n## 继承\n\
    \n面向对象编程的一个重要特性是继承的可能性。这意味着作为程序员，你可以开发一个新类，该类可以使用另一个类的所有方法、变量等作为基础，而无需重写代码。这个新类也称为派生类（derived\
    \ class）。它所继承的类被称为基类（base class）。如果一个类现在要继承另一个类，则在类名后写一个冒号，后面跟着基类的名称。\n\n```csharp\n\
    public class MyScriptName: MonoBehaviour {\n//Code\n}\n```\n\n即使你可能可能并不经常使用继承，但对于\
    \ Unity 程序员来说，这是一个非常重要的问题。在 Unity 中创建并准备作为组件使用的每个类必须继承自 Unity 类 `MonoBehaviour`。这包含了类能够作为组件使用所需的所有内容。你可以在第\
    \ 4 节“脚本编程”中找到更多相关信息。\n\n## 基类与派生类\n\n如果一个类在 C# 中要继承另一个类，必须在类名后写一个冒号，后面跟上基类的名称。假设我们有一个类\
    \ `person`，它有一个公共变量 `name` 和一个私有变量 `points`。\n\n```csharp\npublic class person\
    \ {\n  public string name = \"\";\n  private int points = 0;\n}\n```\n\n派生类 `NPC`\
    \ 应该有一个额外的变量 `health`，那么它看起来如下：\n\n```csharp\npublic class NPC: person {\n  public\
    \ int health;\n}\n```\n\n现在你可以创建一个 `NPC` 类的对象并使用两个公共变量：\n\n`NPC npc = new NPC\
    \ ();`\n\n`npc.name = \"Legolas\";`\n\n`npc.health = 10;`\n\n## 继承与可见性\n\n即使在上面的示例中\
    \ `NPC` 类继承了基类 `Person`，我之前解释的可见性规则仍然适用。你不能在派生类中访问基类的私有变量或私有方法。如果你仍然想允许访问，可以使用\
    \ `protected` 关键字代替 `private` 来定义这些成员。\n\n```csharp\npublic class person {\n \
    \ public string name = \"\";\n  protected int points = 0;\n}\n```\n\n这意味着变量 `points`\
    \ 仍然对外部不可见，但在派生类 `NPC` 中可以被访问。\n\n```csharp\npublic class NPC: person {\n  public\
    \ int health;\n  public void DoSomething () {\n    points = 100;\n  }\n}\n```\n\
    \n## 重写继承的方法\n\n假设你有一个基础类 `person`，它除了各种变量和方法外，还有一个名为 `Shoot` 的方法。为了显示此功能，应首先在控制台（console\
    \ 标签页）中输出一段短文本。你可以通过使用 `Debug.Log` 命令来实现。虽然 `Person` 类提供了标准文本 \"Peng!\"，但 `NPC`\
    \ 类现在应该说点别的。为了这个目的，在 C# 中有重写方法的可能性。要做到这一点，被重写的方法必须首先在基类中声明为可重写。这是通过 `virtual`\
    \ 关键字实现的。\n\n```csharp\npublic class person {\n  public virtual void Shoot ()\
    \ {\n    Debug.Log (\"Peng!\");\n  }\n}\n```\n\n派生类可以（但不必）重写此方法。这里的关键字是 `override`。\n\
    \n```csharp\npublic class NPC: person {\n  public override void Shoot () {\n \
    \   Debug.Log (\"Tie!\");\n  }\n}\n```\n\n## 对基类的访问\n\n如果你现在在派生类中重写了基类的方法，但现在想访问基类的方法，自然会产生如何做的问题。这是通过\
    \ `base` 关键字实现的。你通过 `base` 访问基类的方法、变量等。\n\n```csharp\npublic class NPC: person\
    \ {\n  public override void shoot () {\n    base.shoot();\n    Debug.Log (\"Tie!\"\
    );\n  }\n}\n```\n\n## 密封类\n\n继承的另一种方式是通过密封（sealing）。这意味着防止类的被继承。换句话说，如果你在类定义前面加上\
    \ `sealed` 关键字，则没有其他类可以继承它。\n\n```csharp\npublic sealed class NPC: person {\n\
    ```\n\n## 多态\n\n面向对象编程提供了另一种实用的技能：多态。你可以以相同的方式处理具有共同基类的对象。脚本并不关心对象实际上是否是某个特定类型。\n\
    \n```csharp\nvoid LetsShoot (Person person) {\n  person.Shoot();\n}\n\nPerson\
    \ person = new Person();\nNPC npc = new NPC();\nLetsShoot (person);\nLetsShoot\
    \ (npc);\n```\n\n## 接口\n\nC# 面向对象的另一个特性是接口（interfaces）。通过这些接口你可以定义不同类的共同特征并对其进行处理。通过这种方式你可以平等地对待不同的类，这在某些情况下非常有用。微软已经定义了一些通用接口，对于某些功能很重要，你也可以定义自己的接口。\n\
    \n## 定义接口\n\n定义接口使用 `interface` 关键字。按照约定，接口的名称始终以 `I` 开头，因此在示例中它是 `Shootable`。接口的其余部分与类相似，区别在于方法没有被实现。这只发生在实现该接口的类中。`Shootable`\
    \ 接口看起来如下：\n\n```csharp\npublic interface IShootable {\n  void shoot ();\n}\n\
    ```\n\n类和接口的一个重要区别在于访问修饰符。类中没有访问修饰符的内容被认为是私有的，而接口被认为是内部的。毕竟接口也用于描述类的外部影响。除了 `public`\
    \ 和 `internal` 之外，接口对其他访问修饰符都是禁止的。\n\n## 实现接口\n\n如果一个类要实现接口，其方法与继承类完全相同，即使用冒号。如果既继承类又实现一个（或多个）接口，可以在基类名称后面用逗号隔开列出这些接口。`IShootable`\
    \ 接口的实现看起来如下。请注意，脚本拥有 `Shoot` 方法，这是接口实现的强制要求的。\n\n```csharp\nusing UnityEngine;\n\
    using System.Collections;\n\npublic class gun: MonoBehaviour, IShootable {\n \
    \ private WeaponController weaponController;\n  void Awake () {\n    weaponController\
    \ = gameObject.GetComponent <WeaponController>();\n  }\n  public void UseMe ()\
    \ {\n    weaponController.Switch (this);\n  }\n  public void Shoot () {\n    Debug.Log\
    \ (\"Peng!\");\n  }\n}\n```\n"
