    CheckButtonDown (), CheckDragging (), and CheckButtonUp (). In the CheckButtonDown
    () function, it is first checked that a projectile is present on the slingshot.
    If found, the mouse pointer is converted from the screen coordinates to the scene
    coordinates, and then examines whether the site falls within the boundaries of
    the projectile''s collision component. This condition means that the player has
    pressed the left mouse button on the projectile and therefore grabs it, so the
    Hold () function is called from the launcher. In the CheckDragging () function,
    the left mouse button is checked, and in this case the projectile is moved to
    the cursor position by calling the DragProjectile () function. Remember that this
    function prevents the projector from exceeding the maximum stretch of the rubber
    cord, so regardless of the position of the indicator the projectile will remain
    within that limit. Finally, the CheckButtonUp () function checks whether the player
    has dropped the left mouse button, in which case the ReleaseProjectile () function
    is called from the launcher applet until the projectile is launched. The following
