    \ == 0)\n            myNumbers.Remove(3);\n        Debug.Log(myNumbers.Count.ToString());\
    \ // prints 2\n    }\n}\n```\n\n## Sort objects\n\nAnother strength of `List`\
    \ class is the sorting of the different elements using the `Sort` method. However,\
    \ you should note that every type can be sorted. This will only work if the latter\
    \ has implemented the `IComparable` interface from the `system` namespace. You\
    \ can find out more about this topic on the Internet (“IComparable interface”).\n\
