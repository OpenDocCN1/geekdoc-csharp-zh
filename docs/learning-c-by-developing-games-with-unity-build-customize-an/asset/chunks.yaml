    \n### 变量\n\n首先，变量仅仅是存储值的占位符。变量名必须始终唯一，并由你指定。即使起初并不重要，你也必须确保它不包含任何特殊字符、重音符号或空格。此外，变量名不能以数字开头。\n\
    \n### 命名规范\n\n为了让程序代码更易读，有一些你应该遵守的规范。首先，变量名应该描述变量的内容。最好使用英语术语，例如：`speed`。此外，变量名应该始终以小字母开头。对于由多个单词组成的名称，应该用大写字母分开，例如：`enemySpeed`。这种拼法也称为驼峰命名法（camel\
    \ case）。\n\n### 数据类型\n\n为了让编译器知道变量中可以存储什么值（数字、字母等），你必须告诉变量数据类型。这被称为变量声明。Unity\
