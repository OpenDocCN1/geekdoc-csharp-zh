    ## Special attacks for projectiles


    To complete the projectiles we manufacture a special attack that the player can
    perform after launching the projectile. This attack has multiple images in the
    original game Angry Birds from which we quote in this series of lessons. We will
    be satisfied with two examples to illustrate how these attacks are built. The
    first is the velocity attack, which we will adopt for bird-shaped projectiles,
    which doubles the speed of the projectile, making its impact even greater when
    it hits building blocks or opponents. The second attack we will adopt for giraffe
    and elephant projectiles is the fissile attack, where the original projectile
    is divided into a number of smaller projectiles that can hit more than one target
    in different places.


    Let''s start with the easiest attack, a speed attack. Since the logic of attacks
    is quite different from one attack to another, we have to separate each attack
    into a separate applet. The only common factor between these attacks is that they
