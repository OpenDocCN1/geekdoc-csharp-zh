    \ value represents a unique identifier (key) and the second the value of this\
    \ key. Each key may appear once in the dictionary. The next example shows some\
    \ functions of this class using a simple inventory. This shows how you can use\
    \ `ContainsKey` to determine whether this key already exists, how you can use\
    \ the `Add` method to create a new key-value pair, and how you use the key to\
    \ access the associated value to change it.\n\n```csharp\nusing System.Collections;\n\
    using System.Collections.Generic;\n\npublic static class SimpleInventory {\n \
    \   private static dictionary <string, int> items = new dictionary <string, int>\
    \ ();\n\n    public static void AddItems (string key, int val) {\n        if (items.ContainsKey(key))\n\
    \            items[key] += val;\n        else\n            items.Add(key, val);\n\
    \    }\n\n    public static bool RemoveItems (string key, int val) {\n       \
    \ if (items.ContainsKey(key)) {\n            if (items[key] >= val) {\n      \
    \          items[key] -= val;\n                return true;\n            }\n \
    \       }\n        return false;\n    }\n}\n```\n"
