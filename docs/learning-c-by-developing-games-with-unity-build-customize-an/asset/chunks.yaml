    \ {\n//Code\n}\n```\n\nEven if you may not make much use of inheritance yourself,\
    \ this is a very important issue for you as a Unity programmer. Every class that\
    \ is created in Unity and is to be used as a component must inherit from the Unity\
    \ class `MonoBehaviour`. This includes everything a class needs to be able to\
    \ be used as a component. You can find out more about this in Chapter 4, “Script\
    \ Programming”.\n\n## Base class and derived classes\n\nIf a class is to inherit\
    \ from another in C #`, a colon must be written after the class name, followed\
    \ by the name of the base class. Suppose we have a class `person` with a public\
    \ variable `name` and a private variable `points`.\n\n```csharp\npublic class\
    \ person {\n  public string name = \"\";\n  private int points = 0;\n}\n```\n\n\
