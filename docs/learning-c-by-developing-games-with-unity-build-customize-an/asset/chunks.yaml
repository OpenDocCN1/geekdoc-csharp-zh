    \ C# 中这种定义如下：\n\n```csharp\n[,] tile = new int [8,8];\n```\n\n再次，请记住数组中的每个索引都从\
    \ 0 开始。如果你现在用数字对数字进行加密（0 表示没有棋子，1 代表兵兵，2 是车），你就可以轻松地在数组数组中保存棋子的位置：\n\n```csharp\n\
