  trans: "\n`while` 循环会持续执行，直到满足中止条件。终止条件在循环的开始时进行查询，因此循环可能根本不会执行，也就是说如果从一开始开始就已经满足了终止条件。\n\
    \n```sharp\nint enemyIndex = 0;\n\nwhile (enemyIndex <5) {\n    if (enemyIndex\
    \ == 3)\n        break; // 代码...\n\n    enemyIndex ++;\n}\n```\n\n此循环也可以通过 `break`\
    \ 命令简单地结束，而无需满足实际的终止条件。此外，还有 `continue` 命令。它确保当遇到 `continue` 命令时，循环的行为就像已经到达了循环代码的末尾，从而开始循环的下一次迭代。\n\
    \n## do 循环\n\n与在开始时检查终止条件的 `while` 循环不同，`do` 循环中的条件只在结束时进行检查。结果是循环至少会执行一次，无论从开始时是否满足该条件。\n\
    \n```sharp\nint enemyIndex = 0;\ndo {\n    // 代码...\n    enemyIndex ++;\n} while\
    \ (enemyIndex < 5);\n```\n\n在 `do` 循环中，同样可以使用 `break` 命令提前退出循环。\n\n## 类\n\n正如前面提到的，在\
    \ C# 中，类是面向对象编程的基础。它将相关的数据和方法封装在一起。类就像一个蓝图，根据这个蓝图可以创建多个对象。类可以包含属性（变量）、方法（函数）以及构造器。通过\
    \ `new` 关键字可以创建类的实例（对象）。\n\n```csharp\npublic class Player {\n    public int health;\n\
    \    public void TakeDamage(int amount) {\n        health -= amount;\n    }\n\
    }\n\nPlayer player = new Player();\nplayer.TakeDamage(10);\n```\n\n## 方法 / 函数\n\
    \n方法是类中的代码块，用于执行特定的任务。方法可以接收参数（输入），并返回结果（输出）。如果方法不需要返回值，则使用 `void` 关键字。\n\n```csharp\n\
    public int Add(int a, int b) {\n    return a + b;\n}\n```\n\n方法参数是指你在调用方法时传递给方法的值。参数有两种传递方式：\n\
    \n1. **值传递**（Pass by value）：方法接收参数的副本。在方法内部对参数的修改不会影响外部的变量。\n2. **引用传递**（Pass\
    \ by reference）：方法接收的是变量的引用。方法内部对参数的修改会直接影响外部的变量。这通常使用 `ref` 关键字来实现。\n\n```csharp\n\
    public void Increment(ref int value) {\n    value++;\n}\n\nint x = 5;\nIncrement(ref\
    \ x); // x 现在变为了 6\n```\n\n## 实例化\n\n实例化是指根据类的蓝图创建具体对象的过程。在 C# 中，使用 `new` 关键字来实例化。此操作会在堆上分配内存，并调用类的构造函数。\n\
    \n```csharp\nPlayer myPlayer = new Player();\n```\n"
- fmt: "\nTo finally confuse you, I want to tell you that string variables are also\
    \ reference types. But, and that's the good news, strings have a value semantics.\
    \ This means that strings behave more or less like value types. Therefore, you\
    \ can usually use strings in exactly the same way as `int` variables or `Booleans`.\
    \ For the previous example method, this means that you can change the value of\
    \ `stringA` within the method without affecting the passed value of the `myName`\
    \ variable .\n\n## Overloaded methods\n\nIn C# there is also the possibility to\
    \ define two methods in a class with the same name. This works if the transfer\
    \ parameters differ. This technique is also known as overloading a method.\n\n\
    ```csharp\nstatic bool IsEqual (string stringA, string stringB)\n{// code ...}\n\
    \nstatic bool IsEqual (string stringA, string stringB, bool ignoreCase)\n{// code\
    \ ...}\n```\n\n## Local and global variables\n\nDepending on where you declare\
    \ your own variables in classes, they only exist in one function or in the entire\
    \ class. Local variables are declared within a method and only exist in this one\
    \ method. Global variables are declared outside of methods and apply to the entire\
    \ class.\n\n## Prevent confusion with this\n\nDue to the different areas of validity,\
    \ it can happen that a local variable and a global variable have the same name.\
    \ To avoid misunderstandings, C# offers the keyword `this`, which refers to your\
    \ own class instance. If you want to access the local variable in this case, simply\
    \ write the name of the variable. If you want to access the global variable, write\
    \ `this` first, then a period and then the name.\n\n```csharp\nint quantity =\
    \ 0;\n\nvoid Add (int quantity) {\n    this.quantity += quantity;\n}\n```\n\n\
    ## Access and visibility\n\nGlobal variables as well as all methods can be expanded\
    \ with additional access modifiers. These determine whether they are only visible\
    \ within the class and can therefore also be used, or whether they can also be\
    \ accessed by another class or instance.\n\n- `public` enables access from anywhere.\
    \ Public variables are also displayed in Unity in the Inspector.\n- `private`\
    \ limits access to your own class.\n- `protected` limits access to your own class\
    \ and all other classes that inherit from it.\n- `internal` limits access to all\
    \ classes in your own assembly (important for DLLs).\n\nIf you do not specify\
    \ any of these keywords, variables and methods in C# are automatically considered\
    \ `private`. By the way, classes can only be awarded `public` and `internal`.\
    \ If the keyword is missing, it is considered `internal`.\n\n```csharp\npublic\
    \ class test {\n    private int health;\n    public bool IsEqual (string stringA,\
    \ string stringB) {\n      //Code...\n    }\n}\n```\n\n## Static classes and class\
    \ members\n\nThere are situations where you program methods or variables that\
    \ should work independently of a created instance, e.g. a counter of all previously\
    \ created instances of this class. In this case, of course, not every instance\
    \ may have its own counting mechanism, the results of which may even differ. So-called\
    \ static methods / variables / are used for such applications... or also called\
    \ general class members. (In contrast, the conventional methods / variables...\
    \ are referred to as instance members.) They are declared with the keyword `static`\
    \ and are not accessible via an instance, but directly via the class name. Unity\
    \ uses this e.g. in his math class `Mathf`.\n\n```csharp\nint myInteger = Mathf.RoundToInt\
    \ (1.5f);\n```\n\nThe declaration of a static method then looks like this:\n\n\
    ```csharp\npublic static void SetLevelSettings (int levelIndex) {\n//Code...\n\
    }\n```\n\nThe `Mathf` class goes even further. Here the whole class was declared\
    \ static, so that the compiler only allows class members. Member is the overall\
    \ term for all “things” that can be in a class, for example: methods, variables,\
    \ etc. A static class is then defined as follows:\n\n```csharp\npublic static\
    \ class GameSettings {\n    public static string playerName = \"\";\n    public\
    \ static void SetLevelSettings (int levelIndex) {\n      //Code...\n    }\n}\n\
    ```\n\n## Parameter modifier out / ref\n\nUsually, a variable that is passed to\
    \ a function is copied, as mentioned above. This means that a change in value\
    \ type variables (or with a value type semantics) within a function has no influence\
    \ on the variable passed from outside. However, this may be desirable in certain\
    \ cases by using the parameter modifiers `ref` and `out`, which pass the variables\
    \ (regardless of whether they are value types or reference types) to a method\
    \ by reference and not by copying the content. Both the transfer parameter in\
    \ the method must be identified with the modifier and the variable that is transferred\
    \ to the method.\n\n```csharp\npublic bool IsEqual (ref myName, colliderName)\
    \ {\n    bool result = false;\n    if (stringA.ToLower () == stringB.ToLower ())\
    \ {\n        result = true; stringA = stringB;\n    }\n    return result;\n}\n\
    ```\n\nCall a method with the `ref` modifier:\n\n```csharp\nstring myName = \"\
    Player\";\nstring colliderName = \"player\";\nequal = IsEqual (ref myName, colliderName);\n\
    ```\n\nIn the above case, `myName` initially has the value \"Player\" and `colliderName`\
    \ has the value \"player\".\n\n- `ref` requests an initialized variable. The transferred\
    \ variable must therefore have a value before it is transferred.\n- `out` does\
    \ not need an initialized variable. To do this, however, it must be ensured in\
    \ the method that a value is assigned. A great advantage is that you now have\
    \ the option of returning multiple values from one method. For example, if something\
    \ has been hit, you can get further information about the hit via the out parameter.\n\
    \n```csharp\nRaycastHit hit;\nif (Physics.Raycast (transform.position, Vector3.down,\
    \ out hit))\n    float distanceToGround = hit.distance;\n```\n\n## Array passing\
    \ with params\n\nIn addition to the above parameter modifiers, there is also the\
    \ `params` modifier. This simplifies the passing of arrays to a method, so that\
    \ you do not necessarily have to define an array of a type when passing one or\
    \ more values. You can simply pass a comma-separated list of variables.\n\n```csharp\n\
    public int DamageAddition (params int [] damageValues) {\n    int val = 0;\n \
    \   foreach (int current in damageValues) {\n        val += current;\n    }\n\
    \    return val;\n}\n```\n\nIn the method, the transfer parameter `damageValues`\
    \ is treated like a normal array of the type `int`. This is nothing special at\
    \ first. What is special only becomes apparent when the array is passed to the\
    \ method.\n\n```csharp\nint sum;\nint damage1 = 5;\nint damage2 = 3;\nsum = DamageAddition\
    \ (damage1, damage2);\n\nint [] damageArray = new int [2];\ndamageArray [0] =\
    \ 5;\ndamageArray [1] = 3;\nsum = DamageAddition (damageArray);\n```\n\n## Properties\
    \ and property methods\n\nImagine that you have an NPC class that has a public\
    \ variable `health`. You can of course assign any value to objects of this class,\
    \ even if it is not allowed that objects have a negative health value. Instead\
    \ of taking this into account wherever you process this value, it would make sense\
    \ to ensure from the outset that this cannot happen. For this there are so-called\
    \ property methods in C#, which can check and change the value as soon as the\
    \ value is transferred. A property method, called property for short, consists\
    \ of two sub-methods called `get` and `set` accessors.\n\n- `get` is used to query\
    \ the value.\n- `set` is used to assign the value.\n"
