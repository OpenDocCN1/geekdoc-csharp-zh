    \ transform.position);\n    }\n\n    void ProjectileLaunched ()\n    {\n     \
    \   AudioSource.PlayClipAtPoint (launchSound, transform.position);\n    }\n}\n\
    ```\n\n我们将讨论的弹体模板脚本中的第二个脚本，是用于在发射后绘制弹体运动路径的脚本。绘制的路径将由点组成，这些点沿着弹体从离开发射弹弓那一刻到最后一点的路径，并以固定距离间隔分布。在解释该脚本之前，我们将先构建一个代表点对象的模板，并将使用该模板来绘制路径。要构建该模板，只需向场景中添加一个新的空白对象，然后为它添加\
    \ `SpriteRenderer` 组件。接着如图像所示，点击组件中 `Sprite` 单元的浏览按钮，滚动到窗口底部，你那里可以找到 Unity 用于构建用户界面的一组默认图像。选择\
    \ `Knob` 图像并关闭窗口。然后将新模板命名为 `PathPoint`，并将其 x 和 y 轴的尺寸缩小为 0.75：\n\n![](img/Image00011.jpg)\n\
    \n现在我们可以编写绘制路径的脚本并将其添加到弹体模板中。该脚本的叙述描述如下：\n\n```\nusing UnityEngine;\n\nusing System.Collections;\n\
    \npublic class PathDrawer: MonoBehaviour {\n\n    // The template used to draw\
    \ points\n    public GameObject pathPointPrefab;\n\n    // Distance between two\
    \ consecutive points\n    public float pointDistance = 0.75f;\n\n    // Parent\
    \ object for path point objects\n    Transform pathParent;\n\n    // Variable\
    \ to store the location of the last point added\n    Vector2 lastPointPosition;\n\
    \n    // Internal variable to see if the projectile was launched or not\n    bool\
    \ launched = false;\n\n    // Called once at startup\n    void Start () {\n  \
    \      // Path Find the parent object of the named path points\n        pathParent\
    \ = GameObject.Find (\"Path\").transform;\n    }\n\n    // Called once when rendering\
    \ each frame\n    void Update () {\n        if (launched)\n        {\n       \
    \     float dist = Vector2.Distance (transform.position, lastPointPosition);\n\
    \            if (dist >= pointDistance)\n            {\n                // It's\
    \ time to add a new point\n                AddPathPoint ();\n            }\n \
    \       }\n    }\n\n    void ProjectileLaunched ()\n    {\n        // The projectile\
    \ is just launched so delete the previous track\n        for (int i = 0; i <pathParent.childCount;\
    \ i ++)\n        {\n            Destroy (pathParent.GetChild (i).gameObject);\n\
    \        }\n        AddPathPoint ();\n        // Update the variable value as\
    \ the projectile has been launched\n        launched = true;\n    }\n\n    //\
    \ Adds a new point to the path\n    void AddPathPoint ()\n    {\n        // Create\
    \ a new point using the template\n        GameObject newPoint = (GameObject) Instantiate\
    \ (pathPointPrefab);\n        // Create a new point using the template\n     \
    \   newPoint.transform.position = transform.position;\n        // Create a new\
    \ point using the template\n        newPoint.transform.parent = pathParent;\n\
    \        // Create a new point using the template\n        lastPointPosition =\
    \ transform.position;\n    }\n}\n```\n\n`PathDrawer` 脚本使用 `PathPoint` 模板沿弹体轨迹绘制点。它跟踪当前位置与\
    \ `lastPointPosition` 之间的距离；当距离超过 `pointDistance` 时，它会实例化一个新的点。当调用 `ProjectileLaunched()`\
    \ 时，现有的轨迹点会被清除，并开始一条新路径。\n\n## 弹体的特殊攻击\n\n为了完善我们制造的弹体，我们设计了一种玩家在发射后可以执行的特殊攻击。这种攻击在原始游戏《愤怒的小鸟》中有多种图像形式，我们在本系列课程中引用了它们。我们只需用两个示例来说明这些攻击是如何构建的。第一个是速度攻击，我们将将其用于鸟形弹体，它会双倍弹体的速度，使其在撞击积木或对手时产生更大的影响力。第二个我们为长鹿和大象弹体采用分裂攻击，在这种攻击中，原始弹体会被分成若干个较小的弹体，可以命中多个目标。\n\
    \n让我们从最简单的攻击——速度攻击开始。由于各种攻击的逻辑非常不同，我们必须将每种攻击分离到独立的脚本。这些攻击之间的唯一共同点是它们都会接收 `DoSpecialAttack`\
    \ 消息，该消息是在调用 `PerformSpecialAttack()` 函数并检查执行此攻击的必要条件时由 `Projectile` 发送的。速度攻击实现脚本名为\
    \ `SpeedAttack`，它的功能是引入实体并在不改变其方向的情况下按一定倍数提高速度。\n\n```\nusing UnityEngine;\n\n\
    using System.Collections;\n\npublic class SpeedAttack: MonoBehaviour {\n\n   \
    \ // Multiply the current velocity of the projectile by this\n    // Amount when\
    \ carrying out the attack\n    public float speedFactor = 1.5f;\n\n    // It is\
    \ called once at startup\n    void Start () {\n    }\n\n    // It is called once\
    \ when each frame is rendered\n    void Update () {\n    }\n\n    // Consequently,\
    \ it performs the DoSpecialAttack speed attack that receives the message\n   \
    \ public void DoSpecialAttack ()\n    {\n    }\n}\n```\n\n"
- fmt: "\n```cs\n// Bring the rigid body component of the projectile object\nRigidbody2D\
    \ myRB = GetComponent<Rigidbody2D>();\n\n// Multiply the speed by multiplying\
    \ and then set the speed of the object to the new output\nmyRB.velocity = myRB.velocity\
    \ * speedFactor;\n\n}\n}\n```\n\nThe second type of special attacks as we mentioned\
    \ is a fissile attack, which leads to the fragmentation of the projectile into\
    \ smaller projectiles (fragments), which in turn scatter over a relatively large\
    \ area. Before moving to the programmer for this attack, we note that its implementation\
    \ will need to create new objects, fragments that will be scattered by the implementation\
    \ of the attack. This means that we will need to build molds for these fragments,\
    \ and there will be two molds specifically: one for elephant extruded fragments\
    \ and the other for giraffe extruded fragments. I will call these two templates\
    \ `ElephantCluster` and `GiraffeCluster`, which are virtually the same in everything\
    \ except the image shown. These two molds are simple, each carrying the original\
    \ projectile image with the object scaled down to 0.75 on the x and y axes to\
    \ make the fragments smaller than the original projectile. In addition, we will\
    \ add a `Rigid Body 2D` rigid component and a `Circle Collider 2D` collision component,\
    \ making the fragment molds ready.\n\nThe applet that will implement this type\
    \ of attack is called `ClusterAttack` and is described in the following narrative:\n\
    \n```cs\nusing UnityEngine;\n\nusing System.Collections;\n\npublic class ClusterAttack:\
    \ MonoBehaviour {\n\n    // template that will be used to create fragments\n \
    \   public GameObject clusterPrefab;\n\n    // The number of seconds each fragment\
    \ will live before being destroyed and removed from the scene\n    public float\
    \ clusterLife = 4.0f;\n\n    // How many fragments will be produced from this\
    \ projectile\n    public int clusterCount = 3;\n\n    // Called once at startup\n\
    \    void Start () {\n    }\n\n    // Called once when rendering each frame\n\
    \    void Update () {\n    }\n\n    // Consequently implements the DoSpecialAttack\
    \ fission attack to receive the message\n    public void DoSpecialAttack ()\n\
    \    {\n        // Bring the current speed of the original projectile\n      \
    \  Rigidbody2D myRB = GetComponent<Rigidbody2D>();\n        float originalVelocity\
    \ = myRB.velocity.magnitude;\n\n        // Store all the collision components\
    \ of the fragments in this array\n        Collider2D [] colliders = new Collider2D\
    \ [clusterCount];\n        Collider2D myCollider = GetComponent<Collider2D>();\n\
    \n        for (int i = 0; i <clusterCount; i ++)\n        {\n            // Create\
    \ a new fragment\n            GameObject cluster = (GameObject) Instantiate (clusterPrefab);\n\
    \            // Set the location, name, and father of the splint object\n    \
    \        cluster.transform.parent = transform.parent;\n            cluster.name\
    \ = name + \"_cluster_\" + i;\n            cluster.transform.position = transform.position;\n\
    \n            // Store the fragment collision component at the current location\
    \ in the array\n            colliders [i] = cluster.GetComponent<Collider2D>();\n\
    \n            // Neglect the collision that can occur between this fragment and\
    \ the fragments created before it\n            // In addition to the collision\
    \ that can occur between the fragment and the original object\n            Physics2D.IgnoreCollision(colliders\
    \ [i], myCollider);\n\n            for (int a = 0; a <i; a ++)\n            {\n\
    \                Physics2D.IgnoreCollision(colliders [i], colliders [a]);\n  \
    \          }\n\n            Vector2 clusterVelocity;\n            // With each\
    \ new fragment we reduce the vehicle speed horizontally and increase it vertically\
    \ in order to ensure fragmentation\n            clusterVelocity.x = (originalVelocity\
    \ / clusterCount) * (clusterCount - i);\n            clusterVelocity.y = (originalVelocity\
    \ / clusterCount) * -i;\n\n            // Bring a solid body object to the new\
    \ splinter\n            Rigidbody2D clusterRB = cluster.GetComponent<Rigidbody2D>();\n\
    \            clusterRB.velocity = clusterVelocity;\n\n            // Select the\
    \ mass of the original object\n            clusterRB.mass = myRB.mass;\n\n   \
    \         // After its life has passed destroy the fragment\n            Destroy(cluster,\
    \ clusterLife);\n        }\n    }\n}\n```\n"
