    \ launcherPos, Time.deltaTime * 5.0f);\n    // 将弹药置于新位置\n    currentProjectile.transform.position\
    \ = projectilePos;\n    if (Vector2.Distance(launcherPos, projectilePos) < 0.1f)\n\
    \    {\n        // 弹药非常接近，直接将其放置在发射点\n        currentProjectile.transform.position\
    \ = launcherPos;\n        currentProjectile.AllowControl();\n    }\n}\n\n// 持有当前弹药\n\
    public void HoldProjectile ()\n{\n    if (currentProjectile != null)\n    {\n\
    \        currentProjectile.Hold();\n    }\n}\n\n// 将当前弹药拖到新位置\npublic void DragProjectile\
    \ (Vector2 newPosition)\n{\n    if (currentProjectile != null)\n    {\n      \
    \  // 确保不超过最大绳索张力\n        float currentDist = Vector2.Distance(newPosition, launchPosition.position);\n\
    \        if (currentDist > maxStretch)\n        {\n            // 将提供的位置更改为允许的最远点\n\
    \            float lerpAmount = maxStretch / currentDist;\n            newPosition\
    \ = Vector2.Lerp(launchPosition.position, newPosition, lerpAmount);\n        }\n\
    \        // 将弹药放在新位置\n        currentProjectile.Drag(newPosition);\n    }\n}\n\
    \n// 如果玩家持有当前弹药，则释放并发射它\npublic void ReleaseProjectile ()\n{\n    if (currentProjectile\
    \ != null)\n    {\n        currentProjectile.Launch(launchForce);\n    }\n}\n\
    ```\n\n此小程序中的通用变量包括 `launchForce`（代表发射力）、`maxStretch`（代表在张力期间弹药与发射位置之间允许的最大距离，即橡胶线的最大延伸）以及\
