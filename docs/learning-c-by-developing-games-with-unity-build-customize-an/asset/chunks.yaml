    # INTRODUCTION


    Unity is a cross-platform development platform initially created for developing
    games but is now used for a wide range of things such as architecture, art, children''s
    apps, information management, education, entertainment, marketing, medical, military,
    physical installations, simulations, training, and many more. Unity takes a lot
    of the complexities of developing games and similar interactive experiences and
    looks after them behind the scenes so people can get on with designing and developing
    their games. These complexities include graphics rendering, world physics and
    compiling. More advanced users can interact and adapt them as needed but for beginners
    they need not worry about it. Games in Unity are developed in two halves; the
    first half -within the Unity editor, and the second half -using code, specifically
    `C#`. Unity is bundled with MonoDevelopor `Visual Studio 2019 Community` for writing
    `C#`.


