    using System.Collections;


         public class damage: MonoBehaviour {


                  public float amount = 1;


               void OnCollisionEnter ( Collision collision) {   collision.gameObject.SendMessage
    ("ApplyDamage", amount, SendMessageOptions.DontRequireReceiver);      }


    }


    The DontRequireReceiver parameter states that no receiver is necessary. This means
    that no error is triggered if the target object does not have a script using this
    method. You can find out more about collisions in the chapter “Physics in Unity”
    .


    ## Variable access


    If you want to access components of your own GameObjects, Unity offers access
    via variables for some, which considerably simplifies the programming effort.
    This includes, for example, the AudioSource component, the rigid body component
    or the transform component.


    audio.Play ();


    rigidbody.AddForce (0, 1, 0);


    transform.Translate (0, 10, 0);


    ## Add components


    Want to add a new component at runtime a GameObject, you can run the method AddComponent
    use of each GameObject offering. The following example adds a script component
    own GameObject Health controllers and a Rigidbody to.


    gameObject.AddComponent <HealthController > ( );


    gameObject.AddComponent <Rigidbody > ( );


    ## Remove components


    To remove a component from a GameObject, use the Destroy method as if you were
    destroying a GameObject . If you want to destroy your own script, use the keyword
    this . Here, too, you can incorporate time delays using a second parameter.


    Destroy (rigidbody); // destroy your own rigid body


    Destroy ( this, 2); // destroy your script instance with a 2 sec delay


    ## Activate and deactivate components


    Instead of removing a component completely straight away, it can also make sense
    to just deactivate it. The advantage is that you can reactivate it later. A classic
    example is light. The following example accesses the Light component of your own
    GameObject and uses the logical negation operator (the exclamation mark) to reverse
    the state of enabled. The effect is that the switched on light is switched off
    and the switched off light is switched on.


    void Switch ( ) {


    light.enabled =! light.enabled;


    }


    ## Random values


    Random values ​​are an important element in making games interesting. The application
    options range from assigning a random parameter value such as strength to generating
    and placing GameObjects to creating entire levels. For this, Unity offers the
    Random class , which offers several interesting methods for generating random
    values. The most common is the Range method . Please note that there are two different
    versions.


    - Range for float values ​​generates a random value that lies between the start
    and the end value. The start and end values ​​can also be returned as results.


    - Range for int values ​​generates a random value that ranges from the start value,
    but must be smaller (!) Than the end value.


    using UnityEngine;


    using System.Collections;


           public class RandomXPosition: MonoBehaviour {


                          void Start () {


                             float xPos = Random.Range (0.0F, 5.0F);


                             Vector3 pos = new Vector3 (xPos, 10.0);


                             transform.position = pos;


               }


    }


    The class offers a few more variants of the random calculation. How to achieve
    a random rotation of the type Quaternion via the static variable rotation or with
    the help of insideUnitSphere you get a random value in Vector3 format, in which
    x , y and z each have a random value between –1 and 1.


    using UnityEngine;


    using System.Collections;


              public class randomize: MonoBehaviour {


                               public float radius = 3;


                        void Start () {


            transform.position = Random.insideUnitSphere * radius; transform.rotation
    = random.rotation; }


    }


    ## Execute code in parallel


    With Coroutines, you have the option of executing methods that are executed in
    parallel to the actual Update and LateUpdate calls. While normal code, which is
    in the update method, runs in every frame, you can program code blocks with Coroutines
    that extend over any number of frames.


    string message = "";


    IEnumerator Countdown ( ) {


        yield return new WaitForSeconds ( 1);


    message = "3";


    yield return new WaitForSeconds ( 1);


    message = "2";


    yield return new WaitForSeconds ( 1);


    message = "1";


    yield return new WaitForSeconds ( 1);


    message = "Go!";


    }


    The example in Listing shows a countdown that waits four times a second and then
    assigns new content to the message variable (which is then visualized in the GUI,
    for example). To start such a coroutine, use the command StartCoroutine .


    void Start () {


            StartCoroutine ( Countdown ());


      }


    The key keywords of a coroutine are the IEnumerator interface definition , which
    enables the method to be run through several frames, and the yield return command
    (see listing). The latter saves the current status of the routine so that it can
    continue with the next frame at the same point. To do this, specify yield return
    null . The following coroutine runs through ten frames and writes the current
    playing time into the console in each frame.


    IEnumerator FrameTest ( ) {


                 for (int i = 0; i <10; i ++) {


               Debug.Log (Time.time);


                                 yield return null;


              }


    }


    The WaitForSeconds method used above extends the code suspension so that it does
    not continue in the next frame, but only after a second.


    ## WaitForSeconds


    With yield return WaitForSeconds (2.5F) you can interrupt the execution of a coroutine
    for a certain time. The passed float parameter specifies the waiting time. Please
    note that an interruption with WaitForSeconds can only be as precise as the frame
    duration. So if every frame lasts 0.02 seconds, the accuracy of WaitForSeconds
    cannot be better.


    ## Delayed and repeating function calls with Invoke


    Unity provides you with options so that you can delay other methods within a MonoBehaviour
    class and call them repeatedly. For this Unity offers the so-called Invoke commands.


    ## Invoke


    The Invoke method expects the name of a method to start and a second value that
    indicates the delay. The code continues to run normally after the command has
    been executed. The specified method is only triggered after the time has been
    reached. The specified method must be in the same script. You can use IsInvoking
    to find out whether a method has already been called with a delay via Invoke (more
    on this in a moment ). The following example executes the DelayedMessage method
    with a delay of 2.5 seconds after execution of the Start method. This assigns
    a welcome text to a variable, the content of which could in turn be displayed
    in the GUI.


    public string welcomeMessage = "";


         void Start () {


              Invoke ("DelayedMessage", 2.5F);


              }


    void DelayedMessage ( ) {


           welcomeMessage = "Welcome, Master!";


    }


    ## InvokeRepeating, IsInvoking and CancelInvoke


    InvokeRepeat works in a similar way to Invoke , except that this method also calls
    the specified method not just once, but as often as you like. You pass the interval
    of the repetition as the third parameter. The second one also determines the delay
    of the first execution. You can also use the IsInvoking method to check whether
    a method has already been initiated with an Invoke command. You can then cancel
    these statements with CancelInvoke . You pass the name of the method you want
    to cancel. If you don''t pass any, all methods that you started with an Invoke
    command are aborted. The following example could come from a Spawner script that
    creates a new object at a random position every second three seconds after the
    game starts.


    public GameObject go;


    public bool isGameOver = false;


            void Start () {


                // Starts the delayed retry of RandomInstantiation InvokeRepeating
    ("RandomInstantiation", 3.1);


    }


