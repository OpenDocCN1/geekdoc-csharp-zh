  trans: "\n\n为了彻底让你困惑，我想告诉的是，字符串变量也是引用类型。但是（这是一个好消息）-字符串具有值语义（value semantics）。这意味着字符串的行为在很大程度上类似于值类型。因此，你通常可以使用与\
    \ `int` 变量或 `Booleans` 完全相同的方式使用字符串。对于之前的示例方法，这意味着你可以在方法内部更改 `stringA` 的值，而不会影响传递进去的\
    \ `myName` 变量的值。\n\n## 重载方法\n\n在 C# 中，还可以在类中定义两个同名的方法。如果传递的参数不同，这种方法就是可行的。这种技术被称为方法重载（overloading）。\n\
    \n```csharp\nstatic bool IsEqual (string stringA, string stringB)\n{// code ...}\n\
    \nstatic bool IsEqual (string stringA, string stringB, bool ignoreCase)\n{// code\
    \ ...}\n```\n\n## 局部变量和全局变量\n\n根据你在类中声明自定义变量的位置，它们只存在于一个函数中或存在于整个类中。局部变量在方法内部声明，仅存在于该方法内部。全局变量在方法外部声明，适用于整个类。\n\
    \n## 通过此避免混淆\n\n由于作用域的不同，可能会出现局部变量和全局变量同名的情况。为了避免误解，C# 提供了关键字 `this`，它指向你自己的类实例。在这种情况下，如果你想访问局部变量，只需编写变量名即可。如果你想访问全局变量，先写\
    \ `this`，然后加一个点，最后是变量名。\n\n```csharp\nint quantity = 0;\n\nvoid Add (int quantity)\
    \ {\n    this.quantity += quantity;\n}\n```\n\n## 访问与可见性\n\n全局变量以及所有方法都可以使用额外的访问修饰符进行扩展。这些修饰符决定了它们仅在类内部可见（因此可以使用），还是也可以被另一个类或实例访问。\n\
    \n- `public` 允许从任何地方访问。公共变量也会在 Unity 的 Inspector（检查器）中显示。\n- `private` 将访问限制在你自己的类中。\n\
    - `protected` 将访问限制在你自己的类以及所有继承自它的类中。\n- `internal` 将访问限制在你程序集中的所有类中（对于 DLL 非常重要）。\n\
    \n如果你没有指定这些关键字中的一个，C# 中的变量和方法会被自动视为 `private`。顺便说一下，类只能被赋予 `public` 和 `internal`。如果缺少关键字，则被视为\
    \ `internal`。\n\n```csharp\npublic class test {\n    private int health;\n   \
    \ public bool IsEqual (string stringA, string stringB) {\n      //Code...\n  \
    \  }\n}\n```\n\n## 静态类和类成员\n\n在某些情况下，你编写的方法或变量应该独立于创建的实例运行，例如，该类之前创建的所有实例的计数器。在这种情况下，当然，并不是每个实例都拥有自己的计数机制，结果甚至可能不同。所谓的静态方法/变量被用于此类应用程序…………也称为通用类成员。（相比之下，传统的方法/变量……被称为实例成员。）它们使用关键字\
    \ `static` 声明，并且不能通过实例访问，而是直接通过类名访问。Unity 在此利用了这一点，例如在它的数学类 `Mathf` 中。\n\n```csharp\n\
    int myInteger = Mathf.RoundToInt (1.5f);\n```\n\n静态方法的声明如下：\n\n```csharp\npublic\
    \ static void SetLevelSettings (int levelIndex) {\n//Code...\n}\n```\n\n`Mathf`\
    \ 类更进了一步。在这里，整个类被声明为静态的，因此编译器只允许类成员。成员（Member）是类中可以存在的所有“东西”的统称，例如：方法、变量等。静态类的定义如下：\n\
    \n```csharp\npublic static class GameSettings {\n    public static string playerName\
    \ = \"\";\n    public static void SetLevelSettings (int levelIndex) {\n      //Code...\n\
    \    }\n}\n```\n\n## 引用与输出参数\n\n在某些情况下，你编写的方法或变量应该独立于创建的实例运行，例如，该类之前创建的所有实例的计数器。在这种情况下，当然，并不是每个实例都拥有自己的计数机制，结果甚至可能不同。传递的变量（无论它是值类型还是引用类型）在方法内部没有影响，除非使用\
    \ `ref` ` `。 `，`使用 `out` 修饰符来确保在方法中可以被赋值。\n\n```csharp\npublic bool IsEqual (ref\
    \ stringA, string stringB) {\n    bool result = false;\n    if (stringA == stringB)\
    \ {\n        result = true;\n    }\n    return result;\n}\n```\n\n使用 `ref` 修饰符调用方法：\n\
    \n```csharp\nstring myName = \"Player\";\nstring colliderName = \"player\";\n\
    equal = IsEqual (ref myName, colliderName);\n```\n\n在上述情况下，`myName` 的初始值为 \"Player\"\
    ，`colliderName` 的值为 \"player\"。\n\n- `ref` 请求一个初始化的变量。传递的变量必须有一个值。\n- `out` 不需要初始化的变量。但是，必须在方法中对其赋值。一个巨大的优势是你现在可以从方法返回多个值。例如，如果击中了某些东西，你可以通过\
    \ `out` 参数获取击中的信息。\n\n```csharp\nRaycastHit hit;\nif (Physics.Raycast (transform.position,\
    \ Vector3.down, out hit))\n    float distanceToGround = hit.distance;\n```\n\n\
    ## 使用 params 传递数组\n\n除了上述修饰符，还有 `params` 修饰符。它简化了向方法传递数组，使得你在传递多个值时并不需要定义数组。\n\
    \n```csharp\npublic int DamageAddition (params int [] damageValues) {\n    int\
    \ val = 0;\n    foreach (int current in damageValues) {\n        val += current;\n\
    \    }\n    return val;\n}\n```\n\n在方法中，传递参数 `damageValues` 被视为一个普通的 `int` 类型数组。这起初并没有特别之处。只有当数组传递给方法时，特殊性才会体现。\n\
    \n```csharp\nint sum;\nint damage1 = 5;\nint damage2 = 3;\nsum = DamageAddition\
    \ (damage1, damage2);\n\nint [] damageArray = new int [2];\ndamageArray [0] =\
    \ 5;\ndamageArray [1] = 3;\nsum = DamageAddition (damageArray);\n```\n\n## 属性和属性方法假设你有一个\
    \ NPC 类，它有一个公共变量 `health`。你当然可以给该类的对象分配任何值，即使这不允许对象具有负的健康值。与其在每次处理该值的地方都考虑这种情况，不如从一开始就确保这种情况不会发生。为了实现这一点，在\
    \ C# 中有所谓的“属性方法”，它们可以在值被传递时立即检查并更改该值。属性方法（简称为属性）由两个子方法 `get` 和 `set` 访问器组成。\n\n\
    - `get` 用于查询值。\n- `set` 用于分配值。\n\n"
