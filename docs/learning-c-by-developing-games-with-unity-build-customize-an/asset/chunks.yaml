    tile [0.2] = 0; // A3 上没有棋子。\n```\n\n## 常数\n\n总有一些不应该或不能更改的值。你可以将这些定义为常量，这意味着它们不能再被更改。要做到这一点，你必须在数据类型之前写入\
    \ `const` 关键字。在声明时也必须初始化常量：\n\n```csharp\nconst float gravity = 9.81F;\n```\n\n\
    ## 枚举\n\n你可以使用枚举来创建易读的常量列表。听起来有点神秘，但其实非常实用的。假设你想保存一个棋子的状态。它有三种状态：站立、行走、跳跃。为了查询棋子的当前状态，你想将其保存在变量中。为此，你首先定义一个包含这三个值的枚举（简写为\
    \ enum）。我们只需要声明这个枚举即可：\n\n```csharp\nenum state {idle, walk, jump}\n```\n\n然后你可以创建一个该枚举类型的变量，并将其分配为三个值之一：\n\
    \n```csharp\nmyState State; myState = State.Idle;\n```\n\n## 类型转换\n\n也可以将一种类型的变量转换为另一种类型。前提是，当然，它在内容上也是匹配的。整数变量（int）始终可以转换为浮点数变量（float）。反向操作只有在浮点数没有小数部分值时才有效。在转换类型时，只需在要转换的值之前的括号中输入目标类型即可：\n\
    \n```csharp\nint lifePoints; string lifePointsText = \"2\";\nlifePoints = (int)\
    \ lifePointsText;\n```\n\n将数字转换为字符串更加简单。它们本身带有一个执行此任务的方法/函数（我稍后会解释那是什么）。要做到这一点，在数字变量后输入一个点，然后输入文本\
    \ `ToString()`。一旦你点击该点，MonoDevelop 中就会出现一个选择框，使此命令可用：\n\n```csharp\nlifePointsText\
    \ = lifePoints.ToString ();\n```\n\n这个函数非常有用，因为通过这种方式整数变量可以像字符串一样处理：\n\n```csharp\n\
    lifePointsText = \"You own\" + lifePoints.ToString() + \"Life Points.\";\n```\n\
    \n如你所见，你可以在 C# 中使用 `+` 符号拼接字符串。此过程被称为字符串拼接，经常用于文本输出。\n\n## 分支（逻辑影响）\n\n现在你已经学习了编程所需的所有重要基础知识，我们终于可以开始实际编程了。因为这不仅仅关于定义变量并为其填充值，而是关于根据这些值做出决策，这正是所谓的“分支（ramifications）”发挥作用的地方。你根据定义的条件决定下一步执行哪些代码块。\n\
    \n## if 语句\n\n最简单的分支是所谓的 `if` 语句。它的工作方式像一个开关，可以根据条件执行某些代码。此外，还可以指定一个在条件不满足时执行的备选代码，使得整个代码的行为如下：“如果条件成立，则执行此操作，否则执行该操作。”\
    \ `if` 语句通过信号词 `if` 引入，后面跟着括号括内的条件。实际代码随后在大括号中跟随。可选的备选代码通过单词 `else` 启动：\n\n```csharp\n\
    if (lifePoints == 2) {\n  message = \"You have 2 lives\";\n} else {\n  message\
    \ = \"I don't know how many lives you have.\" + \"But there are definitely no\
    \ 2.\";\n}\n```\n\n如果代码块或 `else` 分支只包含一行，则也可以省略大括号：\n\n```csharp\nif (lifePoints\
    \ == 2) message = \"You have 2 lives\";\n```\n\n## switch 语句\n\n使用 `if` 语句，你始终最多有两个可能执行的代码段。虽然你可以通过嵌套\
    \ `if` 语句来表示多个状态，但到某个程度就会变得非常混乱。`switch` 语句可以提供帮助。通过它，你可以检查任何数量的状态，然后执行适用于相应 case\
    \ 代码。\n\n```csharp\nint damage = 1;\nstring title;\nswitch (damage) {\n  case\
    \ 0:\n    message = \"Beside!\";\n  case 1:\n    message = \"Oh, just a scratch!\"\
    ;\n    break;\n  case 2:\n    message = \"Damn it hurts!\";\n    break;\n  default:\n\
    \    message = \"Arrrgh!\";\n}\n```\n\nswitch 语句的每个 case 需要用 `break` 结束。如果一个 case\
    \ 都不，可以使用 `default`。\n\n## 循环\n\n除了分支，循环是另一个重要元素。它们确保某些部分重复执行直到满足终止条件。\n\n###\
    \ for 循环\n\n经典的循环是 `for` 循环。用于已知代码重复的次数。使用这种循环时，为变量（计数器）分配初始值并增加：\n\n```csharp\n\
    int counter = 0;\nfor (counter = 0; counter <10; counter++) {\n}\n```\n\n在上面的示例中，计数器设置为初始值\
    \ 0 并运行十次。这是由于 `counter++`，它每次运行都会增加计数的值。\n\n### 负步长\n\n下一个示例显示了步长为 -2，并在计数器大于\
    \ 0 时运行代码。此外，这里计数器在 `for` 循环中定义：\n\n```csharp\nfor (int counter = 10; counter>\
    \ 0; counter-=2)\n}\n```\n\n### Break\n\n`for` 循环并不总是运行到结束。它可以使用 `break` 关键字取消：\n\
    \n```csharp\nint [] speedLimits = new int [5] {30,50,80,100,120};\nint currentSpeed\
    \ = 100;\nint currentGear;\nfor (int counter = 0; counter <5; counter++) {\n \
    \ if (speedLimits[counter] >= currentSpeed) {\n    currentGear = counter +1; break;\n\
    \  }\n}\n```\n\n### Foreach 循环\n\n`foreach` 循环用于遍历数组。这里使用了一个额外的运行变量，它获取数组当前元素的值。由于它是原始值的副本，无法通过这种方式更改数组的内容。需要注意的是你只需要循环中定义运行变量：\n\
    \n```csharp\nforeach (int currentLimit in speedLimits) {\n  if (currentLimit ==\
    \ 80) {\n    // code ...\n  }\n}\n```\n\n"
- fmt: "\nThe while loop continues until an abort condition is met. The termination\
    \ condition is queried at the beginning of the loop, so that the loop may not\
    \ even be able to be executed, namely if the termination condition is met from\
    \ the beginning.\n\n```sharp\nint enemyIndex = 0;\n\nwhile (enemyIndex <5) {\n\
    \    if (enemyIndex == 3)\n        break; //Code...\n\n    enemyIndex ++;\n}\n\
    ```\n\nThis loop can also be simply ended with the `break` command without fulfilling\
    \ the actual termination condition. In addition, there is also the `continue`\
    \ command . This ensures that the loop behaves as if it had already arrived at\
    \ the end of the loop code when the `continue` command is reached, and therefore\
    \ begins with the next iteration of the loop.\n\n## do loop\n\nIn contrast to\
    \ the `while` loop, where the termination condition is checked at the beginning,\
    \ the condition in the `do` loop is only checked at the end. The result is that\
    \ the loop makes at least one pass, regardless of whether the condition at the\
    \ end of the loop was met from the beginning or not.\n\n```sharp\nint enemyIndex\
    \ = 0;\ndo {\n    //Code...\n    enemyIndex ++;\n} while (enemyIndex> 5);\n```\n\
    \nWith the `do` loop it is also possible to leave the loop with the `break` command\
    \ .\n\n## Classes\n\nAs already mentioned at the beginning, C# is a so-called\
    \ object-oriented programming. The aim is to bundle and encapsulate coherent functionalities\
    \ and values ​​in so-called objects (which are nothing more than variables). B.\
    \ Everything that concerns the player is in an object called `player`. Everything\
    \ that affects the enemy is saved by an object called `enemy`. What do we do if\
    \ we want to have two or more opponents, not just one opponent? Do we have to\
    \ program a completely new object for every opponent? No, of course not, because\
    \ this is where classes come in. A class is a template for objects. It describes\
    \ how objects in this class “look” and how they should work. A class begins with\
    \ the word `class`, followed by the name of the class. To better distinguish it\
    \ from normal variables, this begins with a capital letter in C#. Then the code\
    \ of the class follows, which is enclosed in curly brackets:\n\n```csharp\nclass\
    \ enemy {\n    int health;\n}\n```\n\nIn Unity, a script represents exactly one\
    \ class. The name of the script must have the same name as the class in the script.\
    \ If you now want to create an object from a script or a class, this is very easy\
    \ in Unity. Since scripts are normally considered to be components (more on this\
    \ in the chapter \"Script programming\"), you can easily drag them onto a respective\
    \ `GameObject`, which automatically creates an object of this class. This process\
    \ is also called instantiation. The result, i.e. the object, is therefore often\
    \ referred to as an instance of this class.\n\n## Assign components by code\n\n\
    Instead of dragging such a component script onto a `GameObject`, you can alternatively\
    \ assign a script or an object of your class to a `GameObject` using program code.\
    \ For this there is the command `AddComponent`.\n\n```csharp\ngameObject.AddComponent<MyScriptName>();\n\
    ```\n\n## Instantiation of non-components\n\nInstances of non-components, such\
    \ as for example `GameObjects` or script classes that do not inherit from the\
    \ `MonoBehaviour` class (more on this in the \"Scripting\" chapter) are usually\
    \ generated using the typical C# path. To do this, first declare a variable of\
    \ the type of the class. Next comes the instantiation of the object. This creates\
    \ the new object, which you do with the keyword `new` and the class name.\n\n\
    ```csharp\nEnemy enemy;\nenemy = new enemy ();\n```\n\nThe two lines above can\
    \ also be made shorter, as follows:\n\n```csharp\nEnemy enemy = new Enemy ();\
    \ own```\n\nThe two brackets after `new` and the class name are important and\
    \ must always be written, since this is not the class itself, but the constructor\
    \ of this class, a method that is carried out when the object is created. You\
    \ can find out more about the topic of constructor e.g. B. in the previously mentioned\
    \ books by Walter Doberenz and Thomas Profitus.\n\n## Methods / functions\n\n\
    Algorithms, i.e. lines of code that do not contain variable declarations or similar\
    \ within a class can only be written in methods. Methods are code units that are\
    \ addressed by calling their method name and can have both transfer parameters\
    \ and return values. Note that the term “method” is not normally used in JavaScript,\
    \ instead the term “function” is used there. In both cases, however, the same\
    \ is meant. And because, as already mentioned, Unity does not only support C#\
    \ as a language, Unity developers often use both terms. For methods / functions\
    \ there is a similar naming convention as for variables, except that they begin\
    \ with a capital letter, e.g. `SetPosition`. A method definition has two important\
    \ parts:\n\n1. Transfer parameters, they are defined after the method name within\
    \ parentheses with the variable type. If the method has no transfer parameters,\
