    \ damage: MonoBehaviour {\n    public float amount = 1;\n\n    void OnCollisionEnter\
    \ (Collision collision) {\n        collision.gameObject.SendMessage(\"ApplyDamage\"\
    , amount, SendMessageOptions.DontRequireReceiver);\n    }\n}\n```\n\n`DontRequireReceiver`\
    \ 参数表示不需要接收者。这意味着如果目标对象没有使用该方法的脚本，则不会触发错误。你可以在“Unity 中的物理（Physics in Unity）”章节中找到更多关于碰撞的知识。\n\
    \n## 变量访问\n\n如果你想访问自己 GameObject 的组件，Unity 为某些组件提供了通过变量访问的方法，这极大地简化了编程工作。这包括例如\
    \ `AudioSource` 组件、`rigidbody` 组件或 `transform` 组件。\n\n```csharp\naudio.Play ();\n\
    rigidbody.AddForce (0, 1, 0);\ntransform.Translate (0, 10, 0);\n```\n\n## 添加组件\n\
    \n想在运行时为 `GameObject` 添加新组件，你可以运行每个 `GameObject` 提供的 `AddComponent` 方法。下面的示例为自己的\
    \ `GameObject` 添加了一个脚本组件 `HealthController` 和一个 `Rigidbody`。\n\n```csharp\ngameObject.AddComponent\
    \ <HealthController> ();\ngameObject.AddComponent <Rigidbody> ();\n```\n\n## 移除组件\n\
    \n要从 `GameObject` 移除组件，使用 `Destroy` 方法，就像销毁 `GameObject` 一样。如果你想销毁自己的脚本，使用关键字\
    \ `this`。在这里，你也可以第二个参数引入时间延迟。\n\n```csharp\nDestroy (rigidbody); // 销毁自己的刚体\n\
    Destroy (this, 2); // 二秒后销毁你的脚本实例\n```\n\n## 激活与禁用组件\n\n与其立即完全移除组件，将其禁用可能更有意义。优点是你可以稍后重新激活它。一个经典的例子是光。下面的示例访问你自己\
    \ GameObject 的 `Light` 组件，并使用逻辑非运算符（感叹号）来反转 `enabled` 状态。效果是开启的灯被关闭，关闭的灯被开启。\n\
    \n```csharp\nvoid Switch () {\n    light.enabled =! light.enabled;\n}\n```\n\n\
    ## 随机值\n\n随机值是让游戏变得有趣的元素。应用范围从分配随机参数值（如 `strength`）到生成并放置 `GameObjects` 直到创建整个关卡。为此，Unity\
    \ 提供了 `Random` 类，它提供了几个生成随机值的有趣方法。最常用的是 `Range` 方法。请注意有两个不同的版本。\n\n- 用于 `float`\
    \ 值的 `Range` 生成一个位于 `start` 和 `end` 值之间的随机值。`start` 和 `end` 值也可以作为结果返回。\n- 用于\
    \ `int` 值的 `Range` 生成一个从 `start` 值开始的随机值，但必须小于（!）`end` 值。\n\n```csharp\nusing\
    \ UnityEngine;\nusing System.Collections;\n\npublic class RandomXPosition: MonoBehaviour\
    \ {\n    void Start () {\n        float xPos = Random.Range (0.0F, 5.0F);\n  \
    \      Vector3 pos = new Vector3 (xPos, 10.0);\n        transform.position = pos;\n\
    \    }\n}\n```\n\n该类还提供了随机计算的几种变体。通过静态变量 `rotation` 实现 `Quaternion` 类型的随机旋转，或者通过\
    \ `insideUnitSphere` 获得一个 `Vector3` 格式的随机值，其中 `x`、`y` 和 `z` 各自有一个在 –1 到 1 之间的随机值。\n\
    \n```csharp\nusing UnityEngine;\nusing System.Collections;\n\npublic class randomize:\
    \ MonoBehaviour {\n    public float radius = 3;\n    void Start () {\n       \
    \ transform.position = Random.insideUnitSphere * radius;\n        transform.rotation\
    \ = random.rotation;\n    }\n}\n```\n\n## 并行执行代码\n\n通过 `Coroutines`（协程），你可以选择与实际的\
    \ `Update` 和 `LateUpdate` 调用并行执行方法。虽然 `update` 方法中的普通代码每帧运行，但你可以使用 `Coroutines`\
    \ 编写跨越任意帧数的代码块。\n\n```csharp\nstring message = \"\";\nIEnumerator Countdown ()\
    \ {\n    yield return WaitForSeconds (1);\n    message = \"3\";\n    yield return\
    \ WaitForSeconds (1);\n    message = \"2\";\n    yield return WaitForSeconds (1);\n\
    \    message = \"1\";\n    yield return WaitForSeconds (1);\n    message = \"\
    Go!\";\n}\n```\n\n要启动协程，使用 `StartCoroutine`。\n\n```csharp\nvoid Start () {\n \
    \   StartCoroutine (Countdown ());\n}\n```\n\n`IEnumerator` 接口允许这种操作。`yield return\
    \ null` 可用于暂停执行直到下一帧。\n\n## WaitForSeconds\n\n通过 `yield return WaitForSeconds\
    \ (2.5F)`，你可以中断协程的执行一段时间。传递的 `float` 参数指定了等待时间。因此，如果每帧持续 0.02 秒，`WaitForSeconds`\
    \ 的精度就无法更高了。\n\n```csharp\nIEnumerator FrameTest () {\n    for (int i = 0; i <\
    \ 10; i++) {\n        Debug.Log (Time.time);\n        yield return null;\n   \
    \ }\n}\n```\n\n## 使用 Invoke 延迟和重复函数调用\n\nUnity 提供了选项，你可以在 `MonoBehaviour` 内部延迟其他方法并重复调用它们。为此\
    \ Unity 提供了所谓的 `Invoke` 命令。\n\n## Invoke\n\n`Invoke` 方法期望一个要启动的方法和一个表示延迟的第二个值。在命令执行后，代码将继续正常运行。指定的方法在时间到达后才会触发。指定的方法必须在同一个脚本中。你可以使用\
    \ `IsInvoking` 来判断方法是否已经通过 `Invoke` 延迟调用（稍后会介绍）。下面的示例在执行 `Start` 方法 2.5 秒后执行 `DelayedMessage`\
    \ 方法。这会将一个欢迎文本赋值给变量，该变量的内容可以显示 GUI 中。\n\n```csharp\npublic string welcomeMessage\
    \ = \"\";\n\nvoid Start () {\n    Invoke (\"DelayedMessage\", 2.5F);\n}\n\nvoid\
    \ DelayedMessage () {\n    welcomeMessage = \"Welcome, Master!\";\n}\n```\n\n\
    ## InvokeRepeating, IsInvoking 和 CancelInvoke\n\n`InvokeRepeating` 的工作方式与 `Invoke`\
    \ 类似，不同之处该方法不仅调用一次，还会多次调用。你将重复间隔作为第三个参数。第二个参数也决定了首次执行的延迟。你还可以使用 `IsInvoking` 方法检查方法是否已经通过\
    \ `Invoke` 命令启动。然后你可以使用 `CancelInvoke` 取消这些语句。传递你想取消的方法名称。如果你不传递任何参数，所有通过 `Invoke`\
    \ 命令启动的方法都会终止。下面的示例可能来自一个 `Spawner` 脚本，它在游戏开始三秒后，每秒在随机位置创建一个对象。\n\n```csharp\n\
    public GameObject go;\npublic bool isGameOver = false;\n\nvoid Start () {\n  \
    \  // 启动延迟重试 RandomInstantiation\n    InvokeRepeating (\"RandomInstantiation\"\
    , 3.1);\n}\n\nvoid Update () {\n}\n```\n\n"
- fmt: "\n```csharp\n// Checks whether RandomInstantiation is still running\nif (IsInvoking\
    \ (\"RandomInstantiation\")) {\n    // When the game is over\n    // RandomInstantiation\
    \ is to be canceled\n    if (isGameOver) CancelInvoke (\"RandomInstantiation\"\
    );\n}\n}\n\nvoid RandomInstantiation () {\n    // position where the prefab should\
    \ be instantiated\n    Vector3 pos = new Vector3 ();\n    pos = Random.insideUnitSphere\
    \ * 10;\n    // random values for all axes pos.y = 0;\n    // Y is set to 0. X\
    \ and Z are between -10 and 10 // instantiate prefab\n    Instantiate ( go, pos\
    \ , Quaternion.identity);\n}\n```\n\n## Save and load data\n\nWith the `PlayerPrefs`\
    \ class, Unity offers you a great way to save values regardless of the system.\
    \ Regardless of whether Windows, `Mac OSX`, the web player or `Android`, you simply\
    \ transfer the values to be saved to the `PlayerPrefs` methods. Unity will take\
    \ care of where they actually end up. In the following section there is a small\
    \ application example.\n\n## PlayerPrefs preferences\n\nEven if the paths differ\
    \ on all platforms, they all use the names for `Company Name` and `Product Name`\
    \ stored in Unity. On Windows systems, the registry path `HKCU \\ Software \\\
    \ [ company name is used for stand-alone applications, for example ] \\ [product\
    \ name]` taken, web player applications write to the directory `% APPDATA% \\\
    \ Unity \\ WebPlayerPrefs` on Windows systems .\n\nChange the company name and\
    \ product name in the `Player Settings` (`Edit / Project Settings / Player`).\
    \ By default, `Company Name` is set to `\"DefaultCompany\"` and `Product Name`\
    \ to the name of your project.\n\n## Save data\n\n`PlayerPrefs` provides three\
    \ static methods to save values as `int`, `float` or `string`. All three methods\
    \ expect two parameters. Pass the first parameter a string that represents a unique\
    \ identifier, i.e. the `key` (the ID or the name of the value). The second parameter\
    \ is then the actual value in the particular data type.\n\n```csharp\nPlayerPrefs.SetInt\
    \ (\"Lifepoints\", 4);\nPlayerPrefs.SetFloat (\"Speed\", 2.5F);\nstring playerName\
    \ = \"Carsten\";\nPlayerPrefs.SetString (\"Name\", playerName);\n```\n\nThere\
    \ are also three static methods for loading the data. You also have to hand over\
    \ the `key` here.\n\n```csharp\nint myLifepoints = PlayerPrefs.GetInt (\"Lifepoints\"\
    );\nfloat speed = PlayerPrefs.GetFloat (\"Speed\");\nstring playerName = PlayerPrefs.GetString\
    \ (\"Name\");\n```\n\n## Check the key\n\nBefore loading data, i.e. accessing\
    \ a `key`, it can often make sense to first check whether it actually exists.\
    \ Even if Unity does not cause an error here, it can still make sense to assign\
    \ default values to the variable. You do this with the `HasKey` command.\n\n```csharp\n\
    if (! PlayerPrefs.HasKey (\"Lifepoints\"))\nPlayerPrefs.SetInt (\"Lifepoints\"\
    , 5);\n```\n\n## Clear\n\nOf course, you can not only create new entries, you\
    \ can also delete them. Here you can use the static method `DeleteKey`. To delete\
    \ all saved values at once, you can use `DeleteAll`.\n\n```csharp\nPlayerPrefs.DeleteKey\
    \ (\"Lifepoints\");\nPlayerPrefs.DeleteAll ();\n```\n\n## Save\n\nOn some platforms,\
    \ such as the web player, Unity does not write the values to the hard drive when\
    \ calling the methods `SetInt`, `SetFloat` and `SetString`. Instead, Unity temporarily\
    \ saves them temporarily. Only when you exit the application, the web player that\
    \ would be the proper closing the tab or the browser, these values are only to\
    \ disk written. Da to Unity in the background taking care of everything that makes\
    \ this behavior for First no difference. Only in the event of an error, e.g. For\
    \ example if the browser crashes, the values may no longer be able to be written.\
    \ For this, Unity now provides `Save`, which you can use to force the actual.\n\
    \n```csharp\nPlayerPrefs.Save ();\n```\n\n## Cross-scene data\n\nGameObjects only\
    \ exist within a scene. If a new scene is started, the previous scene are destroyed,\
    \ loading a new scene is done with `Application.LoadLevel`. You pass either the\
    \ name or the index.\n\n```csharp\nApplication.LoadLevel (1);\n```\n\n## Passing\
    \ values with PlayerPrefs\n\nYou have already got the first approach: `PlayerPrefs`\
    \ in the start. If a new scene is started, the script reads back the the the the\
    \ the the the the the the the the the the the the the the the the the the the\
    \ the the the the the the the the the the the the the the the the the the the\
    \ the the the the the the the the the the the the the the the the the the the\
    \ the the the the the the the the. (Wait, let me re-format the code logic):\n\n\
    ```csharp\npublic class HealthValue: MonoBehaviour {\n    public int health =\
    \ 2;\n    void Start () {\n        if (PlayerPrefs.HasKey (\"Health\"))\n    \
    \        health = PlayerPrefs.GetInt (\"Health\");\n    }\n    void OnDestroy\
    \ () {\n        PlayerPrefs.SetInt (\"Health\", health);\n    }\n}\n```\n\n##\
    \ Use start menus for initialization\n\nThere are a few points to consider when\
    \ using the above script. For example, when the game is ended and restarted, the\
    \ variable is always assigned the value of the last game. This may be desirable\
