  trans: "\n另一种不那么常用，但仍然重要的方法是 `LateUpdate` 方法。它在所有 update 方法被调用之后、但在渲染之前执行。因此，该方法经常被使用，特别是对于相机脚本。如果相机跟踪一个在\
    \ `update` 方法中移动的目标，那么相机可以在最终渲染之前在 `LateUpdate` 中重新定位。以下示例可以添加到一个相机中，使其始终指向另一个\
    \ Object 的的方向，更精确地说，是朝其 transform（变换）组件所在的方向。例如，这可以用于监控摄像头的控制，它固定安装在一个地方，但会一直跟踪房间内的玩家。\n\
    \n```csharp\npublic transform target;\n\nvoid LateUpdate () {\n    transform.LookAt\
    \ (target.position);\n}\n```\n\n## 组件编程\n\nUnity 的一个重要原则是每个 `GameObject` 都有它自己的组件。因此，你编写的不是一个管理所有敌人生命值的生命系统，而是一个只管理单个敌人生命值的脚本。然后，该脚本会被再次添加到每个敌人中，这样每个敌人都有它自己的管理单元，而且在某些情况下，这个原则可以（也应该）不被严格遵守。但首先，你应该确保每个\
    \ `GameObject` 都有自己的组件。顺便提一下，这在访问组件时也有巨大差异，因为 Unity 经常为访问自己的组件提供简化方法，你从下面也会看到。\n\
    \n## 访问 GameObjects\n\n访问组件所属的 `GameObject` 非常简单。只需使用小写变量 `gameObject` 即可。这使得访问自己的\
    \ `GameObjects` 的组件变得非常容易，我稍后会介绍这一点。\n\n```csharp\nOtherScript otherScript = gameObject.GetComponent\
    \ <OtherScript > ( );\n```\n\n要访问其他的 `GameObjects`，有几种方法可以在开发和运行时使用。第一种方法对性能最友善，是\
    \ Inspector（检查器）赋值，在其中你创建一个公共变量，在开发期间可以将另一个 `GameObject` 拖入。\n\n```csharp\npublic\
    \ GameObject player;\n\nvoid Update ( ) {\n    //Code...\n    if ( player != null)\
    \ {\n        //Code...\n    }\n}\n```\n\n但你也可以在运行时访问其他的 `GameObjects`。如果你想更频繁地访问它们，请确保将它们保存在变量中。这带来了巨大的性能优势，因为在最坏的情况下，Unity\
    \ 必须遍历场景中所有的 `GameObjects` 才能找到正确的那一个。如果你随后在 update 方法中也进行这种访问，它将在每一帧中发生。\n\n\
    ## FindWithTag\n\n你可以通过标签（tag）查找 `GameObject`。为此，`GameObject` 类提供了 `FindWithTag`\
    \ 方法。如果场景中有多个带有此标签的 `GameObjects`，将随机选择其中一个。\n\n```csharp\nGameObject cam; \n\
    void Awake () {\n    cam = GameObject.FindWithTag (\"MainCamera\");\n}\n```\n\n\
    ## FindGameObjectsWithTag\n\n如果有多个具有相同标签的对象，但你又想将它们全部收集到一个数组中，你应该使用 `FindGameObjectsWithTag`\
    \ 方法。作为返回值，你将收到一个包含所有找到标签对象的 `GameObject` 数组。\n\n```csharp\nGameObject [ ] enemies;\n\
    \nvoid Awake ( ) {\n    enemies = GameObject.FindGameObjectsWithTag (\"Enemy\"\
    );\n}\n```\n\n## Find\n\n你可以通过名称查找 `GameObject`。`GameObject` 类的静态方法 `Find` 适用于此。\n\
    \n```csharp\nGameObject leftArm;\nleftArm = GameObject.Find (\"Left Arm\");\n\
    ```\n\n你还可以通过输入你正在查找的 `GameObject` 的父对象来进一步指定查询。使用斜杠字符 `/` 分隔不同的 `GameObjects`。要显示一个对象是最后一个且其本身没有父对象（根对象），你可以在前面加一个斜杠。\n\
    \n```csharp\nleftArm = GameObject.Find (\"Bob / Left Arm\"); // Left Arm 有父对象\
    \ Bob\nleftArm = GameObject.Find (\"/ Bob / Left Arm\"); // Bob 是根对象\n```\n\n\
    ## 激活和禁用 GameObjects\n\n每个 `GameObject` 都提供了 `SetActive` 方法。你可以用它来激活或禁用整个 `GameObject`。给该方法传递你想要实现的状态。\n\
    \n```csharp\nvoid Start ( ) {\n    gameObject.SetActive (false);\n}\n```\n\n注意，只有当你已经可以访问某个被禁用的对象（例如通过\
    \ Inspector 赋值）时才能激活它。使用上述查找方法没有机会找到被禁用的对象。\n\n## 销毁 GameObjects\n\n要完全销毁一个 `GameObject`，你将对象传递给\
    \ `Destroy` 方法。\n\n```csharp\nvoid DestroyPlayer ( ) {\n    GameObject player;\n\
    \    player = GameObject.FindWithTag (\"Player\");\n    Destroy (player);\n}\n\
    ```\n\n你还可以给 `Destroy` 方法传递一个浮点参数，按相应的秒数延迟销毁。\n\n```csharp\nDestroy (player, 2.5F);\n\
    ```\n\n## 创建 GameObjects\n\n大多数时候，你会通过主菜单或制体（prefabs，参见“Prefabs”章节）创建 `GameObjects`。但当然你也可以在运行时创建全新的\
    \ `GameObjects`。通过标准的 C# 方式创建 `GameObject` 类的新实例来实现。无论实例是局部变量还是全局变量，或者具有何种访问修饰符并不重要。由于每个\
    \ `GameObject` 默认名称为 \"New GameObject\"，你也可以在实例化时给你的 `GameObject` 命名。\n\n```csharp\n\
    GameObject go = new GameObject ( );\nGameObject go2 = new GameObject ( \"My Name\"\
    );\n```\n\n## 访问组件\n\n有几种方法访问组件。访问其他 `GameObjects` 组件的最简单方法是声明一个组件类型的公共变量，并在开发期间将该组件的\
    \ `GameObject` 拖入。该变量指向的不是 `GameObject`，而是该 `GameObject` 的组件。如果 `GameObject` 没有此组件，则变量的内容为\
    \ null。\n\n```csharp\npublic transform player;\n\nvoid Start ( ) {\n    if ( player\
    \ != null) {\n        player.position = Vector3.zero;\n    }\n}\n```\n\n## GetComponent\n\
    \n每个 `GameObject` 都有 `GetComponent` 方法，通过它可以你可以访问相应 `GameObject` 的所有组件。如果你在调用时不带上\
    \ `GameObject`，该方法会在你自己的 `GameObject` 中查找此组件。以下示例搜索了玩家的 `HealthController` 以及它自己的，并分配给两个不同的变量以便使用。\n\
    \n```csharp\nHealthController playerHc;\nHealthController myHc;\n\nvoid Awake\
    \ ( ) {\n    GameObject player;\n    player = GameObject.FindWithTag (\"Player\"\
    );\n    playerHc = player.GetComponent <HealthController>();\n    myHc = GetComponent\
    \ <HealthController> ();\n}\n\nvoid Update () {\n    if (playerHc.health > 0)\
    \ {\n        //Code...\n    }\n}\n```\n\n## 减少流量\n\n尽量减少 `GetComponent` 的访问。对于更频繁的访问，将组件保存在变量中。\n\
    \n## SendMessage\n\n调用方法的一种非常有趣的方法是 `SendMessage` 方法。`SendMessage` 由 `GameObject`\
    \ 类提供，它会遍历 `GameObject` 的所有 `MonoBehaviour` 脚本，调用所有同名的方法。因此你甚至不需要知道它在哪个脚本中。可选，你还可以给\
    \ `SendMessage` 传递一个传递参数以及一个类型为 `SendMessageOptions` 的选项参数。后者决定了接收方法是否绝对必要的。如果是必要的但未找到，则会触发错误。\n\
    \n以下示例脚本可以附加到任何带有碰撞器的武器或陷阱上，以便在接触时造成伤害。脚本尝试在另一个 `GameObject` 中调用名为 `ApplyDamage`\
    \ 的方法，并将伤害值 1 传递给它。为此，它访问了传递的碰撞参数的 `GameObject` 并调用了 `SendMessage`。\n\n"
- fmt: "\n```csharp\nusing UnityEngine;\nusing System.Collections;\n\npublic class\
    \ damage: MonoBehaviour {\n    public float amount = 1;\n\n    void OnCollisionEnter\
    \ (Collision collision) {\n        collision.gameObject.SendMessage(\"ApplyDamage\"\
    , amount, SendMessageOptions.DontRequireReceiver);\n    }\n}\n```\n\nThe `DontRequireReceiver`\
    \ parameter states that no receiver is necessary. This means that no error is\
    \ triggered if the target object does not have a script using this method. You\
    \ can find out more about collisions in the chapter “Physics in Unity”.\n\n##\
    \ Variable access\n\nIf you want to access components of your own GameObjects,\
    \ Unity offers access via variables for some, which considerably simplifies the\
    \ programming effort. This includes, for example, the `AudioSource` component,\
    \ the `rigidbody` component or the `transform` component.\n\n```csharp\naudio.Play\
    \ ();\nrigidbody.AddForce (0, 1, 0);\ntransform.Translate (0, 10, 0);\n```\n\n\
    ## Add components\n\nWant to add a new component at runtime a `GameObject`, you\
    \ can run the method `AddComponent` use of each `GameObject` offering. The following\
    \ example adds a script component own `GameObject` `HealthController` and a `Rigidbody`\
    \ to.\n\n```csharp\ngameObject.AddComponent <HealthController> ();\ngameObject.AddComponent\
    \ <Rigidbody> ();\n```\n\n## Remove components\n\nTo remove a component from a\
    \ `GameObject`, use the `Destroy` method as if you were destroying a `GameObject`.\
    \ If you want to destroy your own script, use the keyword `this`. Here, too, you\
    \ can incorporate time delays using a second parameter.\n\n```csharp\nDestroy\
    \ (rigidbody); // destroy your own rigid body\nDestroy (this, 2); // destroy your\
    \ script instance with a 2 sec delay\n```\n\n## Activate and deactivate components\n\
    \nInstead of removing a component completely straight away, it can also make sense\
    \ to just deactivate it. The advantage is that you can reactivate it later. A\
    \ classic example is light. The following example accesses the `Light` component\
    \ of your own `GameObject` and uses the logical negation operator (the exclamation\
    \ mark) to reverse the state of `enabled`. The effect is that the switched on\
    \ light is switched off and the switched off light is switched on.\n\n```csharp\n\
    void Switch () {\n    light.enabled =! light.enabled;\n}\n```\n\n## Random values\n\
    \nRandom values are an important element in making games interesting. The application\
    \ options range from assigning a random parameter value such as `strength` to\
    \ generating and placing `GameObjects` to creating entire levels. For this, Unity\
    \ offers the `Random` class, which offers several interesting methods for generating\
    \ random values. The most common is the `Range` method. Please note that there\
    \ are two different versions.\n\n- `Range` for `float` values generates a random\
    \ value that lies between the `start` and the `end` value. The `start` and `end`\
    \ values can also be returned as results.\n- `Range` for `int` values generates\
    \ a random value that ranges from the `start` value, but must be smaller (`!`\
