    ## Inheritance


    An important feature of object-oriented programming is the possibility of inheritance.
    That means nothing more than that as a programmer you can develop a new class
    that can use another class with all its methods, variables etc. as a basis without
    having to rewrite the code. This new class is also called the derived class. The
    class from which it inherits is called the base class. If a class should now inherit
    from another, a colon is written after the class name, followed by the name of
    the base class.


    public class MyScriptName: MonoBehaviour {


    //Code


    }


    Even if you may not make much use of inheritance yourself, this is a very important
    issue for you as a Unity programmer. Every class that is created in Unity and
    is to be used as a component must inherit from the Unity class MonoBehaviour .
    This includes everything a class needs to be able to be used as a component. You
    can find out more about this in Chapter 4, “Script Programming”.


    ## Base class and derived classes


    If a class is to inherit from another in C #, a colon must be written after the
    class name, followed by the name of the base class. Suppose we have a class person
    with a public variable name and a private variable points .


    public class person {


    public string name = "";


    private int points = 0;


    }


    The derived class NPC , which should have an additional variable health , would
    then look like this:


    public class NPC: person {


       public int health;


    }


    Now you can create an object of the class NPC and use both public variables:


    NPC npc = new NPC ();


    npc.name = "Legolas";


    npc.health = 10;


    ## Inheritance and visibility


    Even if the NPC class inherits from the base class Person in the example above
    , the rules of visibility that I explained earlier still apply. You cannot access
    a private variable or a private method of the base class in a derived class. If
    you still want to allow access, you can define these members with the keyword
    protected instead of private .


    public class person {


      public string name = "";


      protected int points = 0;


    }


    This means that the variable points is still not visible from the outside, but
    can be accessed in the derived class NPC .


    public class NPC: person {


       public int health;


        public void DoSomething () {


         points = 100;


        }


    }


    ## Override inherited method


    Imagine that you have a basic class person who, in addition to various variables
    and methods, also has a method called Shoot . To display this functionality, a
    short text should first be output in the console (console tab). You can do this
    with the Debug.Log command . While the class Person is provided with a standard
    text "Peng!", The class NPC should now say something else. For this purpose in
    C # there is the possibility to overwrite methods. To do this, the method to be
    overwritten must first be declared as overwritable in the base class. This is
    done with the keyword virtual .


    public class person {


       public virtual void Shoot () {


         Debug.Log ("Peng!");


                                     }


    }


    The derived class can (but does not have to) override this method. The key word
    here is override .


    public class NPC: person {


       public override void Shoot () {


      Debug.Log ("Tie!");


    }


    }


    ## Access to the base class


    If you have now overwritten a method of the base class in the derived class, but
    now want to access the method of the base class, the question naturally arises
    how to do it now. This is made possible by the base keyword . You access methods,
    variables etc. of the base class via base .


    public class NPC: person {


    public override void shoot ()


                    {


                          base.Shoot ();


                                              Debug.Log ("Tie!");


                  }


    }


    ## Seal classes


    Another way of inheritance is by sealing. This means preventing the inheritance
    ability of a class. In other words, if you prepend the sealed keyword in the class
    definition , no other class can inherit from it.


    public sealed class NPC: person {// code ...}


    ## Polymorphism


    Object-oriented programming languages ​​offer another useful skill called polymorphism.
    You can treat all objects / instances that have a common base class in the same
    way. The following method triggers the Shoot function from a passed object . The
    script does not care whether the object is actually of the Person type or a class
    that was derived from Person (e.g. NPC from the previous example).


    void LetsShoot (Person person) {


    person.Shoot ();


    }


    Delivery of various objects to LetsShoot


    Person person = new person ();


    NPC npc = new NPC ();


    LetsShoot (person);


    LetsShoot (npc);


    ## Interfaces


    Another feature of the object orientation of C # are interfaces. With these you
    define common features of different classes, via which you can address them again.
    In this way you can treat different classes equally, which can be very useful
    in certain situations. There are general interfaces that have already been predefined
    by Microsoft, which are also important for certain functionalities, and you can
    define your own interfaces.


    ## Define interface


    To define an interface, the keyword is interface used. By convention, the name
    of an interface always begins with an I , so in the example above it would be
    IShootable . The rest of the interface is similar to a class, with the difference
    that the methods are not programmed. Because this only happens in the classes
    that implement this interface. The IShootable interface could then look like this:


    public interface IShootable {


    public void shoot ();


    }


    An important difference between classes and interfaces concerns access modifiers.
    While everything in classes is considered private that has no access modifier,
    interfaces are considered internal. After all, an interface is also used to describe
    the external impact of a class. All other access modifiers, apart from public
    and internal , are even prohibited for interfaces.


    ## Implement interfaces


    If a class is to implement an interface, this is done in exactly the same way
    as inheriting a class, i.e. with a colon. If an inheritance is inherited from
    a class as well as one (or more) interfaces are implemented, these are listed
    separated by commas after the name of the base class. The implementation of the
    IShootable interface could then look like this. Please note above all that the
    script has the Shoot method , which is enforced by the implementation of the interface.


    using UnityEngine;


    using System.Collections;


        public class gun: MonoBehaviour, IShootable {


               private WeaponController weaponController;


                 void Awake () {


                 weaponController = gameObject.GetComponent <WeaponController> ();


                   }


           public void UseMe () {


            weaponController.Switch (this);


               }


        public void Shoot () {


        Debug.Log ("Peng!");


    }


