    \n```csharp\nint damage = 1;\nstring title;\nswitch (damage) {\n  case 0:\n  \
    \  message = \"Beside!\";\n  case 1:\n    message = \"Oh, just a scratch!\";\n\
    \    break;\n  case 2:\n    message = \"Damn it hurts!\";\n    break;\n  default:\n\
