    ## Determine the number of all array items


    Arrays may also be created automatically. If you want to know how many items the
    array now consists of, you can determine this using the Length property :


    int len ​​= speedLimits.Length;


    ## Multidimensional arrays


    You can also create an array with multiple dimensions, imagine you want to use
    an array to represent a square grid field (a chess board, for example). Then it
    is very confusing to create an array with 64 elements. It is easier to create
    an array with two dimensions, where the first index represents the X axis (in
    chess it would be the letters A to H) and the second the Y axis. Such a definition
    looks like this in C #:


    [,] tile = new int [8,8];


    Again, keep in mind that each index in the array begins with a 0\. If you now
    encrypt the figures with numbers (0 means no figure, 1 represents a pawn, 2 is
    a tower), you can easily save the positions of the figures in this array:


    [0.0] = 2; // There is a tower on A1.


    tile [0,1] = 1; // There is a farmer on A2.


    tile [1,1] = 1; // There is a farmer on B2.


    tile [0.2] = 0; // There is no figure on A3.


    ## Constants


    There are always values ​​that should not or should not be changed. You can define
    these as constants, which means that they can no longer be changed. To do this,
    you must write the keyword const before the data type . It is also necessary to
    initialize constants when declaring:


    const float gravity = 9.81F;


    ## Enumeration


    You can use enumerations to create legible lists of constants. What sounds a bit
    cryptic is a very practical thing. Imagine you want to save the state of a figure.
    This has three states: standing, walking, jumping. In order to query the current
    state of the figure, you would like to save it in a variable. To do this, you
    first define an enumeration (short enum) that has these three values. We just
    want to state this enumeration:


    enum state {idle, walk, jump}


    You can then create a variable of this enumeration type and assign one of the
    three values ​​to it.


    myState State; myState = State.Idle;


    ## Type conversion


    It is also possible to convert a variable of one type into another type. The prerequisite
    is, of course, that it also fits in terms of content. An integer variable can
    always be converted into a float variable. The reverse way only works if the float
    number has no comma value. When converting a type, simply enter the target type
    in parentheses before the value to be converted:


    int lifePoints; string lifePointsText = "2";


    lifePoints = (int) lifePointsText;


    Converting numbers to a string is even easier. They inherently have a method /
    function (I will explain what this is in a moment) that takes on this task. To
    do this, enter a point after the number variable and then the text ToString ()
    . As soon as you tap the point, a selection should appear in MonoDevelop that
    makes this command available.


    lifePointsText = lifePoints.ToString ();


    This function is very useful, because in this way the integer variable can be
    treated like a string:


    lifePointsText = "You own" + lifePoints.ToString () + "Life Points.";


    As you can see, you can append strings in C # using the + sign. This procedure
    is also known as string concatenation and is very often used for text output.


    ## Ramifications


    Now that you have learned all the important previous knowledge for programming,
    we can finally start with the actual programming. Because this is not just about
    defining variables and filling them with values, rather it is about making decisions
    based on these values, which is where so-called ramifications come into play.
    You decide which code blocks are to be executed next on the basis of defined conditions.


    ## if statements


    The simplest branch is the so-called if statement. It works like a switch that
    can execute a code depending on a condition. In addition, an alternative code
    can be specified that is to be executed if the condition is not met, so that the
    entire code then behaves as follows: "If the condition applies, then do this,
    otherwise do it." An if statement is introduced with the signal word if , followed
    by the condition enclosed in parentheses. The actual code then follows in curly
    brackets. The optional alternative code is then with the word else initiated


    if (lifePoints == 2) {


       message = "You have 2 lives";


        }


       else {


         message = "I don''t know how many lives you have." + "But there are definitely
    no 2.";


      }


    If the code block or else branch consists of only one line, the curly brackets
    can also be omitted.


    if (lifePoints == 2) message = "You have 2 lives";


    ## switch statement


    With an if statement, you always have a maximum of two possible sections of code
    that can be executed. Although you can represent several states by nesting the
    if statement, this becomes very confusing at some point. The switch statement
    can help here. With this you can check any number of states and then execute the
    code that applies to the respective case.


    int damage = 1;


    string title;


    switch (damage) {


    case 0:


    message = "Beside!";


    case 1:


    message = "Oh, just a scratch!";


    break;


    case 2:


    message = "Damn it hurts!";


    break;


    default:


    message = "Arrrgh!";


    break;


    }


    It is important for the switch statement to end each case section with the break
    command . This ensures that the switch statement is exited after the code has
    been executed. If none of the defined case conditions apply, you can finally use
    the default signal word to define a standard case that is selected as soon as
    none of the previous cases matched. In Listing 3.34 this would always be the case
    if the damage was higher than two ( we simply ignore a negative damage value).


    ## grind


    In addition to the branches, loops are another important element in programming.
    These ensure that certain code sections are repeated until a specified termination
    condition is met.


    ## for loop


    The classic loop is the for loop. It is used when it is known how often a code
    area should be repeated. With this type of loop, a count variable (loop counter)
    is assigned a start value and incremented as long as a specified running condition
    is fulfilled. In C # the first expression is the loop counter with the start value,
    the second represents the running condition, the third expression describes the
    counter increment.


    int counter = 0;


    for (counter = 0; counter <10; counter ++) {


    //Code...


    }


    In the example above, the counter counter was set to the start value 0 and runs
    through the following code ten times. This is due to the counter increase ++ ,
    which increases the value of counter by one after each run.


    ## Negative step size


    The next example shows a step size of –2 and runs through the code as long as
    the counter is greater than 0. In addition, here the loop counter is only defined
    in the for loop, which is also quite common in practice:


    for (int counter = 10; counter> 0; counter- = 2)


