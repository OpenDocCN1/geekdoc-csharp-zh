  trans: "\n\n在 Unity 中，每个脚本恰好包含一个类。脚本名称始终与类名相同。否则，如果你以后想使用它，将会导致错误。因此，在选择脚本名称时，还适用以下规则：不要使用空格或特殊字符。通过以下方式之一创建脚本：\n\
    \n- 你使用主菜单 `Assets / Create` 并选择所需的脚本类型（在本例中为 `C# Script`）。\n- 你使用 `Project Browser`（位于上方）的\
    \ `Create` 菜单，你也可以在那里找到列出的脚本类型。\n- 你使用 `Project Browser` 的右菜单（可以通过右键访问）。你也可以通过\
    \ `Create` 菜单分支找到脚本类型。\n- 你使用 `Inspector` 中 `Add Component` 按钮的 `New Script` 选项。一旦你在层级（hierarchy）中选择了一个\
    \ `GameObject`，你就会在该 `GameObject` 已添加的所有组件中找到它。脚本默认创建在项目浏览器的根目录下，并附加到选中的 `GameObject`\
    \ 上。\n\n双击创建的脚本将在标准开发环境 `MonoDevelop` 中打开它。\n\n# 重命名脚本\n\n如果你随后在项目浏览器或脚本本身中更改了脚本名称，则对应的类名必须同时更改。如果它们不一致（即使只是大小写不同），稍后将会报错，或者你无法将其添加到\
    \ `GameObject` 中。因此，在重命名时，最好使用 `MonoDevelop` 中的重命名功能。这不仅会重命名类，还会重命名脚本以及脚本在项目中的所有引用。只需将光标置于类名上，即可通过右键\
    \ `Refactor / Rename` 访问此功能。如果你想重命名相关变量，`Rename` 函数也有意义。在这种情况下，所有已使用过这些变量的位置也将重命名。\n\
    \n# 重命名脚本\n\n如果你重命名了一个已经附加到场景中 `GameObject` 的脚本，重命名后你可能会发现显示 `\"Missing (MonoBehaviour\
    \ )` 而不是脚本。在这种情况下，删除此条目并重新添加重命名后的脚本。删除此条目最简单的方法是使用组件右菜单中的 `Remove Component` 函数（由\
    \ `Inspector` 中的齿轮符号表示）。\n\n# 脚本框架\n\n如果你按照上述说明创建新的 `C#` 脚本并现在双击打开它，你将看到以下基础结构：\n\
    \n```csharp\nusing UnityEngine;\nusing System.Collections;\n\npublic class MyScriptName:\
    \ MonoBehaviour {\n\n    // 用于初始化\n    void Start () {\n\n    }\n\n    // Update\
    \ 每一帧调用一次\n    void Update () {\n\n    }\n}\n```\n\n在前两行中，集成了带有两个命名空间的 `using`\
    \ 命令。特别是 `UnityEngine` 命名空间，对于 `MonoBehaviour` 脚本是强制性的，不能删除。如有必要，当然可以在上方添加额外的命名空间。命名空间之后是带有\
    \ `MonoBehaviour` 继承的类定义。默认情况下，每个脚本都继承自此类，该类还提供了 `start` 和 `update` 方法。必要时你也可以删除这些方法。你也可以更改或完全移除继承。只有这样，这些类在逻辑上才无法再作为组件使用。\n\
    \n# Unity 事件方法\n\n你现在知道如何在 Unity 中编写脚本了。现在的问题是这些脚本中的代码实际上何时会被执行。Unity 的处理流程如下：`MonoBehaviour`\
    \ 提供了几个方法，这些方法由某些事件触发，或由 Unity 定期调用。在这里，Unity 会遍历所有的 `GameObjects` 及其脚本实例，并在那里执行对应的方法。我在下面简要介绍其中一些重要方法。请记住，每个脚本可以\
    \ / 可能拥有这些方法，但不必实现它们。相反，如果方法没有填充代码，那么删除它们更好。因为以下每个方法都是根据定义被调用的，即使它们是空的，也会消耗性能。\n\
    \n# Update\n\nUnity 中最重要的方法是 `Update` 方法。大部分代码都在这里编写。`Update` 在整个游戏过程中运行，在每一帧渲染之前运行，即在显示器上绘制新帧之前运行。请注意，单个帧的渲染时间可能有所不同。如果你想在\
    \ `update` 代码中编写与帧无关的代码，则应将值再次乘以类 `Time` 的时间值 `deltaTime`。该值代表上上一帧到当前帧之间的时间。例如，如果你使用\
    \ `Transform` 组件直接为 `GameObject` 添加运动。每当 `Update` 被调用时，物体就会向前移动一点。你可以在第 5 章“三维空间中的对象”中了解更多关于\
    \ `Transform` 的信息。\n\n```csharp\nvoid Update ( ) {\n    float speed = 20.0F;\n\
    \    float distance = speed * Time.deltaTime;\n    transform.Translate (Vector3.forward\
    \ * distance);\n}\n```\n\n# FixedUpdate\n\n`FixedUpdate` 方法在定义的时间间隔内被调用，如果你需要访问\
    \ `Rigidbodys`（`Rigidbodys` 负责物理行为），则应该使用它。背景是物理引擎不是基于帧工作的，而是以离散的时间间隔运行，即在固定的时间周期内。因此，在\
    \ Unity 每次进行物理计算之前，`MonoBehaviour` 脚本中的所有 `FixedUpdate` 方法都会执行。你可以在“Physics”中找到更多关于物理的信息。以下示例在每次\
    \ `FixedUpdate` 调用中为刚体添加一个力矩，使其绕 Y 轴旋转。\n\n```csharp\nvoid FixedUpdate ( ) {\n\
    \    rigidbody.AddTorque (0, 2, 0);\n}\n```\n\n# 修改时间间隔\n\n默认情况下，调用 `FixedUpdate`\
    \ 的时间间隔为 0.2 秒。你可以通过 `Edit / Project Settings / Time / Fixed Timestep` 更改此。\n\n\
    # Awake\n\n此方法在脚本实例加载时执行一次。在加载场景时，场景中的所有对象最初初始化。然后按随机顺序调用各个 `GameObjects` 的 `Awake`\
    \ 方法。由于所有 `GameObjects` 已经最初初始化，现在就可以找到 `GameObjects` 并分配变量。\n\n```csharp\nprivate\
    \ GameObject cam;\n\nvoid Awake ( ) {\n    cam = GameObject.FindWithTag (\"MainCamera\"\
    );\n}\n```\n\n# begin\n\n`Start` 方法的行为与 `Awake` 类似。然而，与 `Awake` 不同，此方法只在激活实例上执行。如果脚本实例在开始时被禁用，随后被设置为启用，则\
    \ `Start` 只在那个时刻被调用。此外，`Start` 方法在所有 `Awake` 方法执行后才会被调用，这使得控制初始化顺序和延迟某些执行变得容易。示例使用\
    \ `FindWithTag` 方法查找玩家角色。将 `HealthController` 类的脚本实例赋值给临时变量。下一步是查询当前的血量值并将其赋予自己的私有变量。\n\
    \n```csharp\nprivate int playerHealth;\n\nvoid Start ( ) {\n    HealthController\
    \ hc = GameObject.FindWithTag (\"Player\").GetComponent <HealthController > ();\n\
    \    playerHealth = hc.health;\n}\n```\n\n# OnGUI\n\n`OnGUI` 方法是 Unity 自有的面向编程的\
    \ GUI 系统的一部分。在这个方法中，为该系统编写控件。由于该系统不是基于帧的，而是基于事件的（其中事件由用户输入或 Unity 内部渲染过程触发），因此该方法也被相应调用。由于这个原因，`OnGUI`\
    \ 每帧也可能会被调用多次。你可以在同名章节中找到更多关于 GUI 的信息。\n\n```csharp\nvoid OnGUI ( ) {\n    GUI.Label\
    \ (new Rect ( 0,0,100,30), \"Hello World!\");\n}\n```\n\n# LateUpdate\n\n"
- fmt: "\nAnother method that is not used as often, but is still important, is the\
    \ `LateUpdate` method. This is carried out after all update methods have been\
    \ called, but before rendering. This method is therefore often used, especially\
    \ for camera scripts. If a camera tracks a target that is moved in the `update`\
    \ method, the camera can also be repositioned in `LateUpdate` before it is finally\
    \ rendered . The following example could be added to one camera so that it always\
    \ points in the direction of another Object is directed, more precisely in the\
    \ direction of its transform component. For example, this could be for the control\
    \ of a surveillance camera, which is permanently installed in one place, but keeps\
    \ track of the player in the room all the time.\n\n```csharp\npublic transform\
    \ target;\n\nvoid LateUpdate () {\n    transform.LookAt (target.position);\n}\n\
    ```\n\n## Component programming\n\nAn important principle of Unity is that every\
    \ `GameObject` has its own components. So you are not programming a life management\
    \ system that manages the life strength of all opponents, but a script that only\
    \ manages the health of an individual opponent. This script is then added to each\
    \ opponent again, so that each opponent has its own administration, and this principle\
    \ can (and should) sometimes not be adhered to in certain situations. But first\
    \ of all, you should make sure that each `GameObject` has its own components.\
    \ Incidentally, this also makes a big difference in access to the components,\
    \ since Unity often offers simplifications for access to its own components, which\
    \ you will also see below.\n\n## Access GameObjects\n\nAccessing a component's\
    \ own `GameObject` is very easy. Simply use the lowercase variable `gameObject`\
    \ for this . This makes it very easy to access components of your own `GameObjects`,\
    \ which I will talk about in a moment.\n\n```csharp\nOtherScript otherScript =\
    \ gameObject.GetComponent <OtherScript > ( );\n```\n\nTo access other `GameObjects`,\
    \ there are several methods that you can use both at development time and at runtime.\
    \ The first method, which is also the most gentle on performance, is the Inspector\
    \ assignment, in which you create a public variable to which you can drag and\
    \ drop the other `GameObject` during development.\n\n```csharp\npublic GameObject\
    \ player;\n\nvoid Update ( ) {\n    //Code...\n    if ( player != null) {\n  \
    \      //Code...\n    }\n}\n```\n\nBut you can also access other `GameObjects`\
    \ at runtime. If you want to access them more often, make sure that you save them\
    \ in variables. This brings an enormous performance advantage, since Unity has\
    \ to run through all `GameObjects` of a scene in the worst case to find the right\
    \ one. If you then also make this access in an update method, this would happen\
    \ in every frame.\n\n## FindWithTag\n\nYou can find a `GameObject` by its tag.\
    \ To this end, the class `GameObject` has method `FindWithTag` available. If there\
    \ are several `GameObjects` with this tag in the scene, one is selected at random.\n\
    \n```csharp\nGameObject cam; \nvoid Awake () {\n    cam = GameObject.FindWithTag\
    \ (\"MainCamera\");\n}\n```\n\n## FindGameObjectsWithTag\n\nIf there are several\
    \ objects with the same tag, but you also want to collect them all in an array,\
    \ you should use the `FindGameObjectsWithTag` method . As a return value, you\
    \ will receive a `GameObject` array of all objects found with this tag.\n\n```csharp\n\
    GameObject [ ] enemies;\n\nvoid Awake ( ) {\n    enemies = GameObject.FindGameObjectsWithTag\
    \ (\"Enemy\");\n}\n```\n\n## Find\n\nYou can find a `GameObject` by its name.\
    \ The static method `Find` of the class `GameObject` is suitable for this.\n\n\
    ```csharp\nGameObject leftArm;\nleftArm = GameObject.Find (\"Left Arm\");\n```\n\
    \nYou can also further specify the search query by also entering the parent objects\
    \ of the `GameObject` you are looking for. Separate the different `GameObjects`\
    \ with a slash character `/` . To show that an object is the last one and does\
    \ not itself have a parent object (root object), you can do this with a preceding\
    \ slash.\n\n```csharp\nleftArm = GameObject.Find (\"Bob / Left Arm\"); // Left\
    \ Arm has a parent Bob\nleftArm = GameObject.Find (\"/ Bob / Left Arm\"); // Bob\
    \ is the root object\n```\n\n## Activate and deactivate GameObjects\n\nEach `GameObject`\
    \ offers the `SetActive` method . You can use this to activate and deactivate\
    \ a complete `GameObject`. Give the method the state you want to achieve.\n\n\
    ```csharp\nvoid Start ( ) {\n    gameObject.SetActive (false);\n}\n```\n\nNote\
    \ that you can only activate a deactivated object if you already have access to\
    \ it (e.g. via an Inspector assignment). With the find methods presented above,\
    \ you have no chance of finding a deactivated object.\n\n## Destroy GameObjects\n\
    \nTo completely destroy a `GameObject`, you have to pass the object to the `Destroy`\
    \ method .\n\n```csharp\nvoid DestroyPlayer ( ) {\n    GameObject player;\n  \
    \  player = GameObject.FindWithTag (\"Player\");\n    Destroy (player);\n}\n```\n\
    \nYou can also give the `Destroy` method a float parameter that delays the destruction\
    \ by the respective seconds.\n\n```csharp\nDestroy (player, 2.5F);\n```\n\n##\
    \ Create GameObjects\n\nMost of the time you will create `GameObjects` via the\
    \ main menu or with prefabs (see chapter \" Prefabs\"). But of course you can\
    \ also create completely new `GameObjects` at runtime. You do this by creating\
    \ a new instance of the `GameObject` class in the normal C # way. It does not\
    \ matter whether the instance is a local or global variable or which access modifier\
    \ it has. Since each `GameObject` per Default initially has the name \"New GameObject\"\
    \ , you can also give your `GameObject` a name when you instantiate it.\n\n```csharp\n\
    GameObject go = new GameObject ( );\nGameObject go2 = new GameObject ( \"My Name\"\
    );\n```\n\n## Access components\n\nThere are several ways to access components.\
    \ The easiest way to access components of other `GameObjects` is to declare a\
    \ public variable of the type of the component to which you drag the component's\
    \ `GameObject` during development. The variable then does not refer to the `GameObject`,\
    \ but to the component of the `GameObject`. If the `GameObject` does not have\
    \ this component, the content of the variable is null.\n\n```csharp\npublic transform\
    \ player;\n\nvoid Start ( ) {\n    if ( player != null) {\n        player.position\
    \ = Vector3.zero;\n    }\n}\n```\n\n## GetComponent\n\nEach `GameObject` has the\
    \ `GetComponent` method , with which you can access all components of the respective\
    \ `GameObject`. If you write this call without a `GameObject`, the method looks\
    \ for this component in your own `GameObject`. The following example searches\
    \ for the `HealthController` of the player as well as its own and assigns two\
    \ different variables in order to use them.\n\n```csharp\nHealthController playerHc;\n\
    HealthController myHc;\n\nvoid Awake ( ) {\n    GameObject player;\n    player\
    \ = GameObject.FindWithTag (\"Player\");\n    playerHc = player.GetComponent <HealthController>();\n\
    \    myHc = GetComponent <HealthController> ();\n}\n\nvoid Update () {\n    if\
    \ (playerHc.health > 0) {\n        //Code...\n    }\n}\n```\n\n## Reduce traffic\n\
    \nBe sure to reduce `GetComponent` accesses as much as possible. For more frequent\
    \ access, save the components in variables instead.\n\n## SendMessage\n\nA very\
    \ interesting way to call a method is the `SendMessage` method . `SendMessage`\
    \ is provided by the `GameObject` class and runs through all `MonoBehaviour` scripts\
    \ of the `GameObject`, calling every method with this name. So you don't even\
    \ need to know which script it is in. Optionally, you can also give `SendMessage`\
    \ a transfer parameter as well as an option parameter of the type `SendMessageOptions`\
    \ . The latter determines whether a recipient method is absolutely necessary or\
    \ not. If one is necessary, but none is found, an error is triggered.\n\nThe following\
    \ example script could be attached to any weapon or trap with a collider to cause\
    \ damage on contact. The script tries to call a method called `ApplyDamage` in\
    \ the other `GameObject` and transfer the damage value 1 to it. For this purpose,\
    \ the `GameObject` of the passed collision parameter is accessed and `SendMessage`\
    \ is called.\n"
  raw: 'Another method that is not used as often, but is still important, is the LateUpdate
    method. This is carried out after all update methods have been called, but before
    rendering. This method is therefore often used, especially for camera scripts.
    If a camera tracks a target that is moved in the update method, the camera can
    also be repositioned in LateUpdate before it is finally rendered . The following
    example could be added to one camera so that it always points in the direction
    of another Object is directed, more precisely in the direction of its trans-form
    component. For example, this could be for the control of a surveillance camera,
    which is permanently installed in one place, but keeps track of the player in
    the room all the time.


    public transform target;


         void LateUpdate () {


           transform.LookAt (target.position);


    }


    ## Component programming


    An important principle of Unity is that every GameObject has its own components.
    So you are not programming a life management system that manages the life strength
    of all opponents, but a script that only manages the health of an individual opponent.
    This script is then added to each opponent again, so that each opponent has its
    own administration, and this principle can (and should) sometimes not be adhered
    to in certain situations. But first of all, you should make sure that each GameObject
    has its own components. Incidentally, this also makes a big difference in access
    to the components, since Unity often offers simplifications for access to its
    own components, which you will also see below.


    ## Access GameObjects


    Accessing a component''s own GameObject is very easy. Simply use the lowercase
    variable gameObject for this . This makes it very easy to access components of
    your own GameObjects, which I will talk about in a moment.


    OtherScript otherScript = gameObject.GetComponent <OtherScript > ( );


    To access other GameObjects, there are several methods that you can use both at
    development time and at runtime. The first method, which is also the most gentle
    on performance, is the Inspector assignment, in which you create a public variable
    to which you can drag and drop the other GameObject during development.


    public GameObject player;


                      void Update ( ) {


            //Code...


                           if ( player! = null) {


            //Code...


                       }


    }


    But you can also access other GameObjects at runtime. If you want to access them
    more often, make sure that you save them in variables. This brings an enormous
    performance advantage, since Unity has to run through all GameObjects of a scene
    in the worst case to find the right one. If you then also make this access in
    an update method, this would happen in every frame.


    ## FindWithTag


    You can find a GameObject by its tag. To this end, the class GameObjectdie method
    FindWithTag available. If there are several GameObjects with this tag in the scene,
    one is selected at random.


    GameObject cam; void Awake () {


    cam = GameObject.FindWithTag ("MainCamera");


    }


    ## FindGameObjectsWithTag


    If there are several objects with the same tag, but you also want to collect them
    all in an array, you should use the FindGameObjectsWithTag method . As a return
    value, you will receive a GameObject array of all objects found with this tag.


    GameObject [ ] enemies;


             void Awake ( ) {


              enemies = GameObject.FindGameObjectsWithTag ("Enemy");


    }


    ## Find


    You can find a GameObject by its name. The static method Find of the class GameObject
    is suitable for this.


    GameObject leftArm;


    leftArm = GameObject.Find ("Left Arm");


    You can also further specify the search query by also entering the parent objects
    of the GameObject you are looking for. Separate the different GameObjects with
    a slash character [/] . To show that an object is the last one and does not itself
    have a parent object (root object), you can do this with a preceding slash.


    leftArm = GameObject.Find ("Bob / Left Arm"); // Left Arm has a parent Bob


    leftArm = GameObject.Find ("/ Bob / Left Arm"); // Bob is the root object


    ## Activate and deactivate GameObjects


    Each GameObject offers the SetActive method . You can use this to activate and
    deactivate a complete GameObject. Give the method the state you want to achieve.


    void Start ( ) {


         gameObject.SetActive (false);


    }


    Note that you can only activate a deactivated object if you already have access
    to it (e.g. via an Inspector assignment). With the find methods presented above,
    you have no chance of finding a deactivated object


    ## Destroy GameObjects


    To completely destroy a GameObject, you have to pass the object to the Destroy
    method .


    void DestroyPlayer ( ) {


            GameObject player;


                 player = GameObject.FindWithTag ("Player");


               Destroy (player);


         }


    You can also give the Destroy method a float parameter that delays the destruction
    by the respective seconds.


    Destroy (player, 2.5F);


    ## Create GameObjects


    Most of the time you will create GameObjects via the main menu or with prefabs
    (see chapter " Prefabs" ). But of course you can also create completely new GameObjects
    at runtime. You do this by creating a new instance of the GameObject class in
    the normal C # way. It does not matter whether the instance is a local or global
    variable or which access modifier it has. Since each GameObjectper Default initially
    has the name "New GameObject" , you can also give your GameObject a name when
    you instantiate it.


    GameObject go = new GameObject ( );


    GameObject go2 = new GameObject ( "My Name");


    ## Access components


    There are several ways to access components. The easiest way to access components
    of other GameObjects is to declare a public variable of the type of the component
    to which you drag the component''s GameObject during development. The variable
    then does not refer to the GameObject, but to the component of the GameObject.
    If the GameObject does not have this component, the content of the variable is
    null, i.e. empty.


    public transform player;


         void Start ( ) {


                 if ( player! = null)


                   player.position = Vector3.zero;


    }


    ## GetComponent


    Each GameObject has the GetComponent method , with which you can access all components
    of the respective GameObject. If you write this call without a GameObject, the
    method looks for this component in your own GameObject. The following example
    searches for the HealthController of the player as well as its own and assigns
    two different variables in order to use them later.


    HealthController playerHc;


    HealthController myHc;


           void Awake ( ) {


                 GameObject player;


                 player = GameObject.FindWithTag ("Player");


                 playerHc = player.GetComponent <HealthController> ();


                myHc = GetComponent <HealthController > ( );


    }


         void Update () {


                   if (playerHc.health> 0) {


         //Code...


                        }


               }


    ## Reduce traffic


    Be sure to reduce GetComponent accesses as much as possible. For more frequent
    access, save the components in variables instead.


    ## SendMessage


    A very interesting way to call a method is the SendMessage method . SendMessage
    is provided by the GameObject class and runs through all MonoBehaviour scripts
    of the GameObject, calling every method with this name. So you don''t even need
    to know which script it is in. Optionally, you can also give SendMessage a transfer
    parameter as well as an option parameter of the type SendMessageOptions . The
    latter determines whether a recipient method is absolutely necessary or not. If
    one is necessary, but none is found, an error is triggered.


    The following example script could be attached to any weapon or trap with a collider
    to cause damage on contact. The script tries to call a method called ApplyDamage
    in the other GameObject and transfer the damage value 1 to it. For this purpose,
    the GameObject of the passed collision parameter is accessed and SendMessage is
    called.'
