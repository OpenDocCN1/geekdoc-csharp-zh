    public class NPC: person {\n  public override void shoot () {\n    base.shoot();\n\
    \    Debug.Log (\"Tie!\");\n  }\n}\n```\n\n## Seal classes\n\nAnother way of inheritance\
    \ is by sealing. This means preventing inheritance of a class. In other words,\
