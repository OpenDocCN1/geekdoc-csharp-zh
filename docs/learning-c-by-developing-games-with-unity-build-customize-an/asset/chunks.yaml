    \ functions, respectively: `CheckButtonDown()`, `CheckDragging()`, and `CheckButtonUp()`.\
    \ \n\nIn the `CheckButtonDown()` function, it is first checked that a projectile\
    \ is present on the slingshot. If found, the mouse pointer is converted from the\
    \ screen coordinates to the scene coordinates, and then examines whether the site\
    \ falls within the boundaries of the projectile's collision component. This condition\
    \ means that the player has pressed the left mouse button on the projectile and\
    \ therefore grabs it, so the `Hold()` function is called from the `launcher`.\
    \ \n\nIn the `CheckDragging()` function, the left mouse button is checked, and\
    \ in this case the projectile is moved to the cursor position by calling the `DragProjectile()`\
    \ function. Remember that this function prevents the projector from exceeding\
    \ the maximum stretch of the rubber cord, so regardless of the position of the\
