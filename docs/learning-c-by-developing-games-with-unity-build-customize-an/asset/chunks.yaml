    becomes apparent when the array is passed to the method.


    int sum;


    int damage1 = 5;


    int damage2 = 3;


    sum = DamageAddition (damage1, damage2);


    int [] damageArray = new int [2];


    damageArray [0] = 5;


    damageArray [1] = 3;


    sum = DamageAddition (damageArray);


    ## Properties and property methods


    Imagine that you have an NPC class that has a public variable health . You can
    of course assign any value to objects of this class, even if it is not allowed
    that objects have a negative health value. Instead of taking this into account
    wherever you process this value, it would make sense to ensure from the outset
    that this cannot happen. For this there are so-called property methods in C #,
    which can check and change the value as soon as the value is transferred. A property
    method, called property for short, consists of two sub-methods called get and
    set accessors.


        Get is used to query the value.


        Set is used to assign the value.'
