    ## 22. Strings


    A string is an object of type `String` whose value is text. Internally, the text
    is stored as a sequential read-only collection of `Char` objects.


    You can declare and initialize strings in various ways:


    ![](images/00171.jpeg)


    ### 22.1. Concatenate Multiple Strings


    Concatenation is the process of appending one string to the end of another string.
    When you concatenate string literals or string constants by using the `+` operator,
    the compiler creates a single string.


    ![](images/00172.jpeg)


    ![](images/00173.jpeg)


    ### 22.2. Modify String Contents


    Because strings are immutable, it is not possible (without using unsafe code)
    to modify the value of a string object after it has been created.


    ![](images/00174.jpeg)


    ![](images/00034.jpeg)String interpolation


    `String.Format` and its cousins are very versatile and useful, but their use is
    a little clunky and error prone. Particularly unfortunate is the use of `{0}`
    etc. placeholders in the format string, which must line up with arguments supplied
    separately:


    ![](images/00175.jpeg)


    String interpolation lets you put the expressions right in their place, by having
    “holes” directly in the string literal:


    ![](images/00176.jpeg)


    Just as with `String.Format`, optional alignment and format specifiers can be
    given:


    ![](images/00177.jpeg)


    The contents of the holes can be pretty much any expression, including even other
    strings:


    ![](images/00178.jpeg)


    Notice that the conditional expression is parenthesized, so that the `: "s"` doesn’t
    get confused with a format specifier


    ### 22.3. Compare Strings


    When you compare strings, you are producing a result that says one string is greater
    than or less than the other, or that the two strings are equal.


    ![](images/00179.jpeg)


    ### 22.4. Parse Strings Using String.Split


    A string can be parsed using the `String.Split` method. As input, `Split` takes
    an array of characters that indicate which characters separate interesting sub
    strings of the target string.


    ![](images/00180.jpeg)


    ### 22.5. Search Strings Using String Methods


    The string type, which is an alias for the `System.String` class, provides a number
    of useful methods for searching the contents of a string.


    ![](images/00181.jpeg)


    ### 22.6. Search Strings Using Regular Expressions


    The `System.Text.RegularExpressions.Regex` class can be used to search strings.
    These searches can range in complexity from very simple to making full use of
    regular expressions.


    ![](images/00182.jpeg)


    You can use regular expressions to validate the format of each string in an array.
    The validation requires that each string take the form of a telephone number in
    which three groups of digits are separated by dashes, the first two groups contain
    three digits, and the third group contains four digits. This is done by using
    the regular expression `^\\d{3}-\\d{3}-\\d{4}`.


    ![](images/00183.jpeg)


    ### 22.7. Determine Whether a String Represents a Numeric Value


    To determine whether a string is a valid representation of a specified numeric
    type, use the static `TryParse` method that is implemented by all primitive numeric
    types and also by types such as `DateTime` and `IPAddress`.


    ![](images/00184.jpeg)


    You can use `TryParse` with string representations of `long`, `byte`, and `decimal`
    values.


    ![](images/00185.jpeg)


    ### 22.8. Convert a String to a DateTime


    It is common for programs to enable users to enter dates as string values. To
    convert a string-based date to a `System.DateTime` object, you can use the `Convert.ToDateTime(String)`
    method or the `DateTime.Parse(String)` static method.


    ![](images/00186.jpeg)


    ### 22.9. Convert Between Legacy Encodings and Unicode


    All strings in memory are encoded as Unicode (UTF-16). When you bring data from
    storage into a string object, the data is automatically converted to UTF-16.


    ![](images/00187.jpeg)


