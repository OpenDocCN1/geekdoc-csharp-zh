    ### 14.2. Generic Type Parameters


    In a generic type or method definition, a type parameters is a placeholder for
    a specific type that a client specifies when they instantiate a variable of the
    generic type. A generic class, such as GenericList<T> cannot be used as-is because
    it is not really a type; it is more like a blueprint for a type.


