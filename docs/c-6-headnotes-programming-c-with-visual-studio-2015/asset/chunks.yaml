    ## 21. Statements, Expression and Operators


    The C# code that comprises an application consists of statements made up of keywords,
    expressions and operators.


    ### 21.1. Statements


    The actions that a program takes are expressed in statements. Common actions include
    declaring variables, assigning values, calling methods, looping through collections,
    and branching to one or another block of code, depending on a given condition.


    The order in which statements are executed in a program is called the flow of
    control or flow of execution.


    ![](images/00150.jpeg)


    There are various types of statements in C# and their associated keyword, mentioned
    in the following table:


    | Exception | Description |

    | :--- | :--- |

    | Declaration statements | A declaration statement introduces a new variable or
    constant. A variable declaration can optionally assign a value to the variable.![](images/00151.jpeg)
    |

    | Expression statements | Expression statements that calculate a value must store
    the value in a variable.![](images/00152.jpeg) |

    | Selection statements | Selection statements enable you to branch to different
    sections of code, depending on one or more specified conditions. `if-else`, `switch-case`
    |

    | Iteration statements | Iteration statements enable you to loop through collections
    like arrays, or perform the same set of statements repeatedly until a specified
    condition is met. `do`, `for`, `foreach-in`, `while` |

    | Jump statements | Jump statements transfer control to another section of code.
    `break`, `continue`, `default`, `goto`, `return`, `yield` |

    | Exception handling statements | Exception handling statements enable you to
    gracefully recover from exceptional conditions that occur at run time. `throw`,
    `try-catch`, `try-finally`, `try-catch-finally` |

    | Checked and unchecked | Checked and unchecked statements enable you to specify
    whether numerical operations are allowed to cause an overflow when the result
    is stored in a variable that is too small to hold the resulting value.![](images/00153.jpeg)
    |

