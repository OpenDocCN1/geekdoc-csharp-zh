    ### 24.2. Processing the XML File


    The compiler generates an ID string for each construct in your code that is tagged
    to generate documentation.


    | Character | Description |

    | :--- | :--- |

    | N | `namespace` You cannot add documentation comments to a namespace, but you
    can make `cref` references to them, where supported. |

    | T | type: class, interface, struct, enum, delegate |

    | F | Field |

    | P | property (including indexers or other indexed properties) |

    | M | method (including such special methods as constructors, operators, and so
    forth) |

    | E | event |

    | ! | error stringThe rest of the string provides information about the error.
    The C# compiler generates error information for links that cannot be resolved.
    |


    ### 24.3. Delimiters for Documentation Tags


    The use of XML doc comments requires delimiters, which indicate to the compiler
    where a documentation comment begins and ends.


    ```

    ///

    ```

    Single-line delimiter.


    ```

    /** */

    ```

    Multiline delimiters.


    ![](images/00209.jpeg)


    # III. Coding standards and naming conventions


    Because it is consistent with Microsoft’s .NET Framework or Microsoft practices
    and easy to read. There are some instructions to follow:


    ## 1. Do


    Use `PascalCasing` for class names and methods names.


    ![](images/00210.jpeg)


    Use `camelCasing` for method arguments and local variables.


    ![](images/00211.jpeg)


    Use `PascalCasing` for abbreviations 3 characters or more (2 chars are both uppercase)


    ![](images/00212.jpeg)


    Use predefined type names instead of system type names like `Int16`, `Single`,
    `UInt64`, etc.


    ![](images/00213.jpeg)


    Use implicit type `var` for local variable declarations. Exception: primitive
    types (`int`, `string`, `double`, etc) use predefined names.


    ![](images/00214.jpeg)


    Use noun or noun phrases to name a class.


    ![](images/00215.jpeg)


    Prefix interfaces with the letter `I`. Interface names are noun (phrases) or adjectives.


    ![](images/00216.jpeg)


    Name source files according to their main classes. Exception: file names with
    partial classes reflect their source or purpose, e.g. `designer`, `generated`,
    etc. Files are alphabetically sorted and partial classes remain adjacent.


    ![](images/00217.jpeg)


    Organize namespaces with a clearly defined structure. It maintains good organization
    of your code base.


    ![](images/00218.jpeg)


    Vertically align curly brackets.


    ![](images/00219.jpeg)


    Declare all member variables at the top of a class, with static variables at the
    very top.


    ![](images/00220.jpeg)


    Use singular names for enums. Exception: bit field enums. Plural flags because
    enum can hold multiple values (using bitwise ''OR'').


    ![](images/00221.jpeg)


    ## 2. Don’t


    Don’t use Hungarian notation or any other type identification in identifiers because
    it''s consistent with the Microsoft''s .NET Framework and Visual Studio IDE makes
    determining types very easy (via tooltips). In general you want to avoid type
    indicators in any identifier.


    ![](images/00222.jpeg)


    ![](images/00223.jpeg)


    Don’t use `SnailCasing` (Underscores in identifiers). Exception: you can prefix
    private static variables with an underscore. Also avoids underline stress (inability
    to see underline).


    ![](images/00224.jpeg)


    Explicitly specify a type of an enum or values of enums (except bit fields). It
    can create confusion when relying on actual types and values.


    ![](images/00225.jpeg)


    Suffix enum names with `Enum`


    ![](images/00226.jpeg)


    ## 3. Avoid


    Avoid using Abbreviations. Exceptions: abbreviations commonly used as names, such
    as `Id`, `Xml`, `Ftp`, `Uri`


    ![](images/00227.jpeg)

