    ## 22. Strings


    A string is an object of type String whose value is text. Internally, the text
    is stored as a sequential read-only collection of Char objects.


    You can declare and initialize strings in various ways:


    ![](images/00171.jpeg)


    ### 22.1. Concatenate Multiple Strings


    Concatenation is the process of appending one string to the end of another string.
    When you concatenate string literals or string constants by using the + operator,
    the compiler creates a single string.


    ![](images/00172.jpeg)


    ![](images/00173.jpeg)


    ### 22.2. Modify String Contents


    Because strings are immutable, it is not possible (without using unsafe code)
    to modify the value of a string object after it has been created.


    ![](images/00174.jpeg)


    ![](images/00034.jpeg)String interpolation


    String.Format and its cousins are very versatile and useful, but their use is
    a little clunky and error prone. Particularly unfortunate is the use of {0} etc.
    placeholders in the format string, which must line up with arguments supplied
    separately:


    ![](images/00175.jpeg)


    String interpolation lets you put the expressions right in their place, by having
    “holes” directly in the string literal:


    ![](images/00176.jpeg)


    Just as with String.Format, optional alignment and format specifiers can be given:


    ![](images/00177.jpeg)


    The contents of the holes can be pretty much any expression, including even other
    strings:


    ![](images/00178.jpeg)


    Notice that the conditional expression is parenthesized, so that the : "s" doesn’t
    get confused with a format specifier


    ### 22.3. Compare Strings


    When you compare strings, you are producing a result that says one string is greater
    than or less than the other, or that the two strings are equal.


    ![](images/00179.jpeg)


    ### 22.4. Parse Strings Using String.Split


    A string can be parsed using the String.Split method. As input, Split takes an
    array of characters that indicate which characters separate interesting sub strings
    of the target string.


    ![](images/00180.jpeg)


    ### 22.5. Search Strings Using String Methods


    The string type, which is an alias for the System.String class, provides a number
    of useful methods for searching the contents of a string.


    ![](images/00181.jpeg)


    ### 22.6. Search Strings Using Regular Expressions


    The System.Text.RegularExpressions.Regex class can be used to search strings.
    These searches can range in complexity from very simple to making full use of
    regular expressions.


    ![](images/00182.jpeg)


    You can use regular expressions to validate the format of each string in an array.
    The validation requires that each string take the form of a telephone number in
    which three groups of digits are separated by dashes, the first two groups contain
    three digits, and the third group contains four digits. This is done by using
    the regular expression ^\\d{3}-\\d{3}-\\d{4}$.


    ![](images/00183.jpeg)


    ### 22.7. Determine Whether a String Represents a Numeric Value


    To determine whether a string is a valid representation of a specified numeric
    type, use the static TryParse method that is implemented by all primitive numeric
    types and also by types such as DateTime and IPAddress.


    ![](images/00184.jpeg)


    You can use TryParse with string representations of long, byte, and decimal values.


    ![](images/00185.jpeg)


    ### 22.8. Convert a String to a DateTime


    It is common for programs to enable users to enter dates as string values. To
    convert a string-based date to a System.DateTime object, you can use the Convert.ToDateTime(String)
    method or the DateTime.Parse(String) static method.


    ![](images/00186.jpeg)


    ### 22.9. Convert Between Legacy Encodings and Unicode


    All strings in memory are encoded as Unicode (UTF-16). When you bring data from
    storage into a string object, the data is automatically converted to UTF-16.


    ![](images/00187.jpeg)


    ### 22.10. Convert RTF to Plain Text


    Rich Text Format (RTF) is a document format developed by Microsoft in the late
    1980s to enable the exchange of documents across operating systems.


    ![](images/00188.jpeg)


    ## 23. Unsafe Code and Pointers


    To maintain type safety and security, C# does not support pointer arithmetic,
    by default. However, by using the unsafe keyword, you can define an unsafe context
    in which pointers can be used.


    *   Unsafe code has the following properties:


    *   Methods, types, and code blocks can be defined as unsafe.


    *   In some cases, unsafe code may increase an application''s performance by removing
    array bounds checks.


    *   Unsafe code is required when you call native functions that require pointers.


    *   Using unsafe code introduces security and stability risks.


    *   In order for C# to compile unsafe code, the application must be compiled with
    /unsafe.


    ### 23.1. Fixed Size Buffers


    You can use the fixed statement to create a buffer with a fixed size array in
    a data structure. This is useful when you are working with existing code, such
    as code written in other languages.


    The only restriction is that the array type must be bool, byte, char, short, int,
    long, sbyte, ushort, uint, ulong, float, or double.


    ![](images/00189.jpeg)


    A struct can contain an embedded array. To access the elements of the array, you
    use a fixed statement to establish a pointer to the first element.


    ![](images/00190.jpeg)


    ### 23.2. Pointer types


    In an unsafe context, a type may be a pointer type, a value type, or a reference
    type. A pointer type declaration takes one of the following forms:


    ![](images/00191.jpeg)


    Any of the following types may be a pointer type:


    *   sbyte, byte, short, ushort, int, uint, long, ulong, char, float, double, decimal,
    or bool.


    *   Any enum type.


    *   Any pointer type.


    *   Any user-defined struct type that contains fields of unmanaged types only.


    | Example | Description |


    | int* p | p is a pointer to an integer. |


    | int** p | p is a pointer to a pointer to an integer. |


    | int*[] p | p is a single-dimensional array of pointers to integers. |


    | char* p | p is a pointer to a char. |


    | void* p | p is a pointer to an unknown type. |


