    下界为零的一维数组会自动实现 `IList<T>`。这使得你能够创建泛型方法，使用相同的代码来遍历数组和其他集合类型。这种技术主要对于读取集合中的数据非常有用。


    ![](img/00125.jpeg)


    ## 14.8. 泛型委托 (Generic Delegates)


    委托可以定义自己的类型参数。引用泛型委托的代码可以指定类型参数来创建一个闭合构造类型，就像实例化泛型类或调用泛型方法一样。


    ![](img/00126.jpeg)


    ## 14.9. Default 关键字


    在泛型类和方法中，出现的一个问题是当你无法预知以下内容时，如何为参数化类型 `T` 分配默认值：


    - `T` 是否会是引用类型或值类型。

    - 如果 `T` 是值类型，它将是数值还是结构体。


    ![](img/00127.jpeg)


    ## 15. 索引器 (Indexers)


    索引器允许类或结构体的实例像数组一样被索引。索引器类似于属性，不同之处它们的访问器带有参数。


    ### 15.1. 使用索引器


    索引器是一种语法便利工具，允许你创建一个类、结构体或接口，客户端应用程序可以像访问数组一样访问它们。索引器最常实现在主要目的是封装内部集合或数组的类型中。


    ![](img/00128.jpeg)


    ### 15.2. 接口中的索引器


    索引器可以在接口上声明（[C# 参考]）。接口索引器的访问器与类索引器的访问器有以下不同点：


    - 接口访问器不使用修饰符。

    - 接口访问器没有方法体。


    ![](img/00129.jpeg)


    ## 16. 接口 (Interfaces)


    接口包含了类或结构体可以实现的不同成员声明。你可以使用接口为来自多个来源的类包含行为，因为类不支持多重继承。或者如果你想为结构体模拟继承，因为结构体完全不支持继承。


    ![](img/00130.jpeg)


    ## 17. LINQ 查询表达式 (LINQ Query Expressions)


    语言集成查询 (LINQ) 是一组基于将查询能力直接集成到 C# 语言中的技术的名称。


    对于编写查询的开发者来说，LINQ 最可见的“语言集成”部分是查询表达式。


    ### 17.1. 查询集合


    查询是一组指令，描述了从给定的数据源（或多个源）检索哪些数据，以及返回的数据应该具有什么形状和组织形式。查询与它产生的结果是不同的。


    ![](img/00131.jpeg)


    如上一个示例所示检索元素序列，但将它们转换为新类型的对象。例如，查询可能只从数据源中的某些客户记录中检索姓。


    ![](img/00132.jpeg)


    ### 17.2. 过滤数据


    在某些情况下，直到运行时你并不知道要在 `where` 子句中对源元素应用多少个谓词。动态指定多个谓词过滤器的一种方法是使用 `Contains<TSource>`
    方法


    ![](img/00133.jpeg)


    ![](img/00134.jpeg)


    ### 17.3. 排序集合


    你可以对一个或多个源序列使用 `orderby` 子句。


    ![](img/00135.jpeg)


    ### 17.4. 关联对象


    在关系数据库术语中，内连接（inner join）产生一个结果集，其中第一个集合中的每个元素对应第二个集合中的每个匹配元素出现一次。如果第一个集合中的元素没有匹配的元素，则它不会出现在结果集中。


    ![](img/00136.jpeg)


    ![](img/00137.jpeg)


    执行使用 `join` 子句无法实现的连接操作。在查询表达式中，`join` 子句限于等值连接（equijoins）并对其进行了优化，等值连接是目前最常见的连接操作类型。在执行等值连接时，使用
    `join` 子句通常总是获得最佳性能


    ![](img/00138.jpeg)


    ![](img/00139.jpeg)


    ## 18. Main() 和命令行参数


    当应用程序启动时，第一个被调用的方法是 `Main` 方法。简而言之，它是 `.exe` 程序的入口。它必须是静态的且不能是公共的。


    它可以在类或结构体内部声明，带有或不带有 `string[]` 参数。


    ![](img/00140.jpeg)


    ## 19. 命名空间 (Namespaces)


    组织代码有多种方式，选择应该基于团队的标准以及你正在构建的项目性质。组织代码的常用方法之一是使用 C# 命名空间功能。


    ![](img/00141.jpeg)


    当你需要完全限定命名空间时，还可以创建/使用命名空间别名来简化语法。在此例中你可以调用别名 `Crypto` 而不是 `System.Security.Cryptography`。


    ![](img/00142.jpeg)


    ## 20. 可空类型 (Nullable Types)


    可空类型是 `System.Nullable<T>` 结构的实例。可空类型可以表示其底层值类型的正确范围，外加一个额外的 null 值。


    `Nullable<bool>` 可以分配值 `true`、`false` 或 `null`。可空类型可以表示底层值类型的所有值，外加一个 null 值。可空类型可以通过以下两种方式声明：


    `Nullable<T> 变量`


    -或-


    `T? 变量`


    可空类型具有以下特征：


    - 引用类型不能创建可空，因为它们已经支持 null。

    - `T?` 是 `Nullable<T>` 的简写，其中 `T` 是值类型。

    - 像普通值类型一样为可空类型分配值，例如 `int? x = 10;` 或 `double? d = 4.1;`。可空类型也可以分配 null：`int?
    x = null;`。

    - 使用 `Nullable<T>.GetValueOrDefault()` 方法返回的值，如果为空则返回底层类型的默认值，例如 `int j = x.GetValueOrDefault();`。

    - 使用 `HasValue` 和 `Value` 只读属性测试 null 获取值，如下所示：`if(x.HasValue) j = x.Value;`。

    - `HasValue` 属性在包含值时返回 true，为 null 时返回 false。

    - `Value` 属性在已赋值时返回值，否则将抛出 `System.InvalidOperationException`。

    - `HasValue` 的默认值为 false。`Value` 属性没有默认值。

    - 你也可以对可空类型使用 `==` 和 `!=` 运算符，如下所示：`if (x != null) y = x;`。

    - 使用 `??` 运算符分配一个默认值，当当前值为 null 的可空类型赋值给非可空类型时应用，例如 `int? x = null; int y = x
    ?? -1;`。

    - 不允许嵌套可空类型。以下行将无法编译：`Nullable<Nullable<int>> n;`。


    ### 20.1. 使用可空类型


    ![](img/00143.jpeg)


    ### 20.2. 装箱可空类型


    可空类型的对象在为空时才会被装箱。如果 `HasValue` 为 false，则将对象引用赋予 null 而不是装箱。如果对象为空——如果 `HasValue`
    为 true——则发生装箱，但只有基于该可空对象的底层类型被装箱。


    ![](img/00144.jpeg)


    ### 20.3. 识别可空类型


    你可以使用 C# `typeof` 运算符创建一个表示可空类型的 `Type` 对象：


    ![](img/00145.jpeg)


    在可空类型上调用 `GetType()` 会在类型隐式转换为 `Object` 时执行装箱操作。因此，`GetType()` 总是返回表示底层类型的 `Type`
    对象，而不是可空类型。


    ![](img/00146.jpeg)

