    `IList<T>`. This enables you to create generic methods that can use the same code
    to iterate through arrays and other collection types. This technique is primarily
    useful for reading data in collections.


    ![](images/00125.jpeg)


    ## 14.8. Generic Delegates


    A delegate can define its own type parameters. Code that references the generic
    delegate can specify the type argument to create a closed constructed type, just
    like when instantiating a generic class or calling a generic method.


    ![](images/00126.jpeg)


    ## 14.9. Default Keyword


    In generic classes and methods, one issue that arises is how to assign a default
    value to a parameterized type `T` when you do not know the following in advance:


    - Whether `T` will be a reference type or a value type.

    - If `T` is a value type, whether it will be a numeric value or a struct.


    ![](images/00127.jpeg)


    ## 15. Indexers


    Indexers allow instances of a class or struct to be indexed just like arrays.
    Indexers resemble properties except that their accessors take parameters.


    ### 15.1. Using Indexers


    Indexers are a syntactic convenience that enable you to create a class, struct,
    or interface that client applications can access just as an array. Indexers are
    most frequently implemented in types whose primary purpose is to encapsulate an
    internal collection or array.


    ![](images/00128.jpeg)


    ### 15.2. Indexers in Interfaces


    Indexers can be declared on an interface (C# Reference). Accessors of interface
    indexers differ from the accessors of class indexers in the following ways:


    - Interface accessors do not use modifiers.

    - An interface accessor does not have a body.


    ![](images/00129.jpeg)


    ## 16. Interfaces


    An interface contains different declarations of members that classes or strucs
    can implement. You may use interfaces to include behaviors for classes from multiple
    sources, because they don’t support multiple inheritance. Or if you want to simulate
    inheritance for structs because they don’t support it at all.


    ![](images/00130.jpeg)


    ## 17. LINQ Query Expressions


    Language-Integrated Query (LINQ) is the name for a set of technologies based on
    the integration of query capabilities directly into the C# language.


    For a developer who writes queries, the most visible "language-integrated" part
    of LINQ is the query expression.


    ### 17.1. Querying Collections


    A query is a set of instructions that describes what data to retrieve from a given
    data source (or sources) and what shape and organization the returned data should
    have. A query is distinct from the results that it produces.


    ![](images/00131.jpeg)


    Retrieve a sequence of elements as in the previous example but transform them
    to a new type of object. For example, a query may retrieve only the last names
    from certain customer records in a data source.


    ![](images/00132.jpeg)


    ### 17.2. Filtering Data


    In some cases you do not know until run time how many predicates you have to apply
    to source elements in the `where` clause. One way to dynamically specify multiple
    predicate filters is to use the `Contains<TSource>` method


    ![](images/00133.jpeg)


    ![](images/00134.jpeg)


    ### 17.3. Ordering Collections


    You can use an `orderby` clause with one or more of the source sequences.


    ![](images/00135.jpeg)


    ### 17.4. Joining Objects


    In relational database terms, an inner join produces a result set in which each
    element of the first collection appears one time for every matching element in
    the second collection. If an element in the first collection has no matching elements,
    it does not appear in the result set.


    ![](images/00136.jpeg)


    ![](images/00137.jpeg)


    To perform join operations that are not possible with the `join` clause. In a
    query expression, the `join` clause is limited to, and optimized for, equijoins,
    which are by far the most common type of join operation. When performing an equijoin,
    you will probably always get the best performance by using the `join` clause


    ![](images/00138.jpeg)


    ![](images/00139.jpeg)


    ## 18. Main() and Command-Line Arguments


    When an application is started, the first method to be invoked is the `Main` method.
    So briefly it’s the entry point of an `.exe` program. It must be static and not
    public.


    It could be declared inside a class or a struct, and with or without `string[]`
    arguments.


    ![](images/00140.jpeg)


    ## 19. Namespaces


    There are various ways to organize code and the choice should be based on the
    standards of your team and the nature of the project you’re building. One of the
    common ways to organize code is with the C# namespace feature.


    ![](images/00141.jpeg)


    You can also create/use a namespace alias to shorthand syntax when you need to
    fully qualify a namespace. In this example you can call the alias `Crypto` instead
    of `System.Security.Cryptography`.


    ![](images/00142.jpeg)


    ## 20. Nullable Types


    Nullable types are instances of the `System.Nullable<T>` struct. A nullable type
    can represent the correct range of values for its underlying value type, plus
    an additional null value.


    A `Nullable<bool>` can be assigned the values `true`, `false`, or `null`. Nullable
    types can represent all the values of an underlying type, and an additional null
    value. Nullable types are declared in one of two ways:


    `System.Nullable<T> variable`


    -or-


    `T? variable`


    Nullable types have the following characteristics:


    - Nullable types cannot be created based on a reference type because they already
    support null.

    - The syntax `T?` is shorthand for `Nullable<T>`, where `T` is a value type.

    - Assign a value to a nullable type just as you would an ordinary value type,
    for example `int? x = 10;` or `double? d = 4.1`. A nullable type can also be assigned
    null: `int? x = null`.

    - Use the `Nullable<T>.GetValueOrDefault()` method to return either the assigned
    value, or the default value for the underlying type if the value is null, for
    example `int j = x.GetValueOrDefault();`.

    - Use `HasValue` and `Value` read-only properties to test for null and retrieve
    the value, as shown in the following example: `if(x.HasValue) j = x.Value;`.

    - The `HasValue` property returns true if the variable contains a value, or false
    if it is null.

    - The `Value` property returns a value if one is assigned. Otherwise, a `System.InvalidOperationException`
    is thrown.

    - The default value for `HasValue` is false. The `Value` property has no default
    value.

    - You can also use the `==` and `!=` operators with a nullable type, as shown
    in the following example: `if (x != null) y = x;`.

    - Use the `??` operator to assign a default value that will be applied when a
    nullable type whose current value is null is assigned to a non-nullable type,
    for example `int? x = null; int y = x ?? -1;`.

    - Nested nullable types are not allowed. The following line will not compile:
    `Nullable<Nullable<int>> n;`.


    ### 20.1. Using Nullable Types


    ![](images/00143.jpeg)


    ### 20.2. Boxing Nullable Types


    Objects based on nullable types are only boxed if the object is non-null. If `HasValue`
    is false, the object reference is assigned to null instead of boxing. If the object
    is non-null -- if `HasValue` is true -- then boxing occurs, but only the underlying
    type that the nullable object is based on is boxed.


    ![](images/00144.jpeg)


    ### 20.3. Identifying a Nullable Type


    You can use the C# `typeof` operator to create a `Type` object that represents
    a Nullable type:


    ![](images/00145.jpeg)


    Calling `GetType()` on a nullable type causes a boxing operation to be performed
    when the type is implicitly converted to `Object`. Therefore `GetType()` always
    returns a `Type` object that represents the underlying type, not the Nullable
    type.


    ![](images/00146.jpeg)

