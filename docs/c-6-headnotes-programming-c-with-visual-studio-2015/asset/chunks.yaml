    ## 12. Exceptions and Exception Handling


    Exception handling is the process of responding to the occurrence, during computation,
    of exceptions – anomalous or exceptional conditions requiring special processing
    – often changing the normal flow of program execution using the `try`, `catch`,
    and `finally` keywords to try actions that may not succeed.


    ### 12.1. Using Exceptions


    Exceptions are represented by classes derived from `System.Exception`. This class
    identifies the type of exception and contains properties that have details about
    the exception. Throwing an exception involves creating an instance of an exception-derived
    class, optionally configuring properties of the exception, and then throwing the
    object by using the `throw` keyword.


    ![](images/00090.jpeg)


    After an exception is thrown, the runtime checks the current statement to see
    whether it is within a `try` block. If it is, any `catch` blocks associated with
    the `try` block are checked to see whether they can catch the exception.


    ![](images/00091.jpeg)


    A `try` statement can contain more than one `catch` block. The first `catch` statement
    that can handle the exception is executed; any following `catch` statements, even
    if they are compatible, are ignored.


    ![](images/00092.jpeg)


    Before the `catch` block is executed, the runtime checks for `finally` blocks.
    `Finally` blocks enable the programmer to clean up any ambiguous state that could
    be left from aborted try block.


    ![](images/00093.jpeg)


    ### 12.2. Exception Handling


    A `try` block is used by C# programmers to partition code that might be affected
    by an exception. Associated `catch` blocks are used to handle any resulting exceptions.
    A `finally` block contains code that is run regardless of whether or not an exception
    is thrown, such as releasing resources that are allocated in the `try` block.
    A `try` block requires one or more `catch` blocks, or a `finally` block, or both.


    The following examples show a `try-catch` statement: ![](images/00094.jpeg)


    A `try-finally` statement:


    ![](images/00095.jpeg)


    A `try-catch-finally` statement:


    ![](images/00096.jpeg)


    ### 12.3. Creating and Throwing Exceptions


    Exceptions are used to indicate that an error has occurred while running the program.
    Exception objects that describe an error are created and then thrown with the
    `throw` keyword.


    ![](images/00097.jpeg)


    ### 12.4. Compiler-Generated Exceptions


    Some exceptions are thrown automatically by the .NET Framework''s common language
    runtime (CLR) when basic operations fail. These exceptions and their error conditions
    are listed in the following table:


    | Exception | Description |

    | :--- | :--- |

    | `ArithmeticException` | A base class for exceptions that occur during arithmetic
    operations, such as `DivideByZeroException` and `OverflowException`. |

    | `ArrayTypeMismatchException` | Thrown when an array cannot store a given element
    because the actual type of the element is incompatible with the actual type of
    the array. |

    | `DivideByZeroException` | Thrown when an attempt is made to divide an integral
    value by zero. |

    | `IndexOutOfRangeException` | Thrown when an attempt is made to index an array
    when the index is less than zero or outside the bounds of the array. |

    | `InvalidCastException` | Thrown when an explicit conversion from a base type
    to an interface or to a derived type fails at runtime. |

    | `NullReferenceException` | Thrown when you attempt to reference an object whose
    value is null. |

    | `OutOfMemoryException` | Thrown when an attempt to allocate memory using the
    `new` operator fails. This indicates that the memory available to the common language
    runtime has been exhausted. |

    | `OverflowException` | Thrown when an arithmetic operation in a checked context
    overflows. |

