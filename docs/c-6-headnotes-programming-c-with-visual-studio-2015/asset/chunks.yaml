    class）。接受此事件的其他类被称为订阅者类（subscriber class）。`Events` 使用发布者-订阅模型。


    `publisher` 是一个包含事件定义和委托定义的对象。事件-委托的关联也定义在该对象中。发布者类对象引发事件并通知其他对象。


    `subscriber` 是一个接受事件并提供事件处理程序的对象。发布者类中的委托会调用订阅者类的方法（事件处理程序）。


