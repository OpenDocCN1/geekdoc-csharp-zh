    你也可以用元素初始化数组，在这种情况下，你不需要指定数组的大小。


    ![](img/00028.jpeg)


    ### 5.3. 多维数组


    如果需要声明一个 n 维的多维数组。


    ![](img/00029.jpeg)


    你仍然可以使用值初始化多维数组。


    ![](img/00030.jpeg)


    ### 5.4. 锯齿数组 (Jagged Arrays)


    锯齿数组是“数组的数组”，意味着数组的元素本身也是数组。在这种情况下，对于多维数组，如果我们认为主数组是行，那么每一行可以有不同的列大小。


    ![](img/00031.jpeg)


    ### 5.5. 将数组作为参数


    你可以将单维数组或多维数组作为方法的参数进行传递。


    ![](img/00032.jpeg)


    #### 5.5.1. 将数组作为参数传递


    如果你想传递方法参数时不关心它接收多少个参数，可以使用 `params` 关键字。它是作为参数数组传递的，在调用方法时不需要声明数组，它由 C# 编译器隐式创建。


    ![](img/00033.jpeg)

    ![](img/00034.jpeg)


    #### 索引初始化器 (Index initializers)


    对象和集合初始化器用于声明式地初始化对象的字段和属性，或者为集合提供一组初始元素。使用索引器初始化字典和其他对象显得不够优雅。


    ![](img/00035.jpeg)


    ## 6. 循环


    循环是一组语句，会按照指定的次数重复，或者直到满足逻辑条件。


    ### 6.1. 使用 for 循环


    for 循环允许代码重复执行。与其它类型的循环不同，for 循环的特点是具有显式的循环计数器。


    ![](img/00036.jpeg)


    ### 6.2. 使用 foreach 循环


    foreach 循环提供了遍历集合中各项项的可能性。与 for 循环不同，foreach 循环通常不维护显式的计数器。这里展示了如何使用 foreach 循环创建相同的循环：


    ![](img/00037.jpeg)


    ### 使用 while 循环


    ![](img/00038.jpeg)


    while 循环允许根据给定的布尔条件重复执行代码。


    ![](img/00039.jpeg)


    ### 6.3. 使用 do-while 循环


    ![](img/00040.jpeg)


    do-while 循环至少执行一次代码。然后根据给定的条件重复继续执行代码或停止。


    ![](img/00041.jpeg)


    ## 7. 类与结构体 (Classes and Structs)


    类和结构体是两种可扩展的程序代码模板，即蓝图，用于创建对象；为状态提供初始值并实现行为。


    有四个主要原则使一种语言成为面向对象：封装、数据抽象、多态和继承。这些原则将在稍后通过示例进行讨论。


    ### 7.1. 类


    可以使用 `class` 关键字声明类。所有类都继承自 `System.Object`，因此类是引用类型。


    ![](img/00042.jpeg)


    ### 7.2. 结构体


    可以使用 `struct` 关键字声明结构体。所有结构体都继承自 `System.ValueType`，而 `System.ValueType` 又继承自
    `System.Object`，因此结构体是值类型。


    ![](img/00043.jpeg)


    使用 `Struct` 时：


    - 非常量或非静态字段不能初始化。

    - 不能声明默认构造函数（无参数）或析构函数。但我们可以声明带有参数的构造函数。

    - 可以不使用 `new` 关键字即可实例化。

    - 可以实现接口。

    - 可以继承其他结构体或类，但不能作为类的基类。

    -与其他值类型不同，它可以作为可空类型 (Nullable type)。


    ### 7.3. 对象


    对象是类或结构体的实例。对于类，它们通过使用 `new` 运算符创建。对于结构体，可以使用 `new` 运算符创建，但不是强制的。


    ![](img/00044.jpeg)


    ### 7.4. 成员


    #### 7.4.1. 字段 (Fields)


    字段是在类作用域内定义的变量。字段可以是内置数值类型，也可以另一个类的实例。


    ![](img/00045.jpeg)


    #### 7.4.2. 常量 (Constants)


    常量是在编译时设置值且无法更改的字段或属性。


    ![](img/00046.jpeg)


    #### 7.4.3. 属性 (Properties)


    属性是类上的方法，访问方式就像该类上的字段一样。属性可以为类字段提供保护，防止其在对象不知情的情况下被更改。


    ![](img/00047.jpeg)

    ![](img/00048.jpeg)


    #### 自动属性的初始化器 (Initializers for auto-properties)


    你现在可以自动属性添加初始化器，就像在字段中这样做一样。


    ![](img/00049.jpeg)


    初始化器直接初始化底层字段（backing field）；它不通过自动属性的 setter 工作。初始化器按照编写顺序执行，与字段初始化器的执行顺序相同且一同执行。


    ![](img/00048.jpeg)


    #### 仅 getter 的自动属性 (Getter-only auto-properties)


    自动属性现在可以在不带 setter 的情况下声明。


    ![](img/00050.jpeg)


    foreach 通常不维护显式计数器。![](img/00051.jpeg)


    images/00052.jpeg)


