    ### 24.2. 处理 XML 文件


    编译器为代码中每个标记为要生成文档的构造结构生成 ID 字符串。


    | 字符 | 描述 |

    | :--- | :--- |

    | N | `namespace` 您无法为命名空间添加文档注释，但在支持的情况下，可以对其创建 `cref` 引用。 |

    | T | 类型：类、接口、结构体、枚举、委托 |

    | F | 字段 (Field) |

    | P | 属性（包括索引器或其他索引属性） |

    | M | 方法（包括构造函数、运算符等特殊方法） |

    | E | 事件 |

    | ! | 错误字符串字符串的其余部分提供了有关错误的信息。C# 编译器为无法解析的链接生成错误信息。 |


    ### 24.3. 文档标签的分隔符


    使用 XML 文档注释需要分隔符，分隔符指示编译器文档注释的开始和结束。


    ```

    ///

    ```

    单行分隔符。


    ```

    /** */

    ```

    多行分隔符。


