    ### 7.4.6.8. Logical, Conditional, and Null Operators


    | Expression | Purpose |

    | :--- | :--- |

    | `x & y` | Integer bitwise AND, Boolean logical AND |

    | `x ^ y` | Integer bitwise XOR, boolean logical XOR |

    | `x \| y` | Integer bitwise OR, boolean logical OR |

    | `x && y` | Evaluates `y` only if `x` is true |

    | `x \| y` | Evaluates `y` only if `x` is false |

    | `x ?? y` | Evaluates to `y` if `x` is null, to `x` otherwise |

    | `x ?: y : z` | Evaluates to `y` if `x` is true, `z` if `x` is false |


    ![](images/00034.jpeg) Null-conditional operators


    Sometimes code tends to drown a bit in null-checking. The null-conditional operator
    lets you access members and elements only when the receiver is not-null, providing
    a null result otherwise.


    ![](images/00053.jpeg)


    The null-conditional operator is conveniently used together with the null coalescing
    operator `??`:


    ![](images/00054.jpeg)


    The null-conditional operator exhibits short-circuiting behavior, where an immediately
    following chain of member accesses, element accesses and invocations will only
    be executed if the original receiver was not null:


    ![](images/00055.jpeg)


    This example is essentially equivalent to:


    ![](images/00056.jpeg)


    Except that `customers` is only evaluated once. None of the member accesses, element
    accesses and invocations immediately following the `?` are executed unless `customers`
    has a non-null value.


    Of course null-conditional operators can themselves be chained, in case there
    is a need to check for null more than once in a chain:


    ![](images/00057.jpeg)


    Note that an invocation (a parenthesized argument list) cannot immediately follow
    the `?` operator – that would lead to too many syntactic ambiguities. Thus, the
    straightforward way of calling a delegate only if it’s there does not work. However,
    you can do it via the `Invoke` method on the delegate:


    ![](images/00058.jpeg)


    We expect that a very common use of this pattern will be for triggering events:


    ![](images/00059.jpeg)


    This is an easy and thread-safe way to check for null before you trigger an event.
    The reason it’s thread-safe is that the feature evaluates the left-hand side only
    once, and keeps it in a temporary variable.


    ### 7.4.6.9. Assignment and Anonymous Operators


    | Expression | Purpose |

    | :--- | :--- |

    | `=` | Assignment |

    | `x op= y` | Compound assignment. Supports these operators: `+=`, `-=`, `*=`,
    `/=`, `%=`, `&=`, `|=`, `!=`, `<<=`, `>>=` |

    | `(T x) => y` | Anonymous function (lambda expression) |


    ### 7.4.7. Indexers


    Indexers enable an object to be indexed in a manner similar to arrays.


    ![](images/00060.jpeg)


    ### 7.4.8. Constructors


    Constructors are methods that are called when the object is first created. They
    are often used to initialize the data of an object. Structs cannot contain default
    constructor explicitly, because it’s provided by the compiler.


    ![](images/00061.jpeg)


    ### 7.4.9. Destructors


    Destructors are used very rarely in C#. They are methods that are called by the
    runtime execution engine when the object is about to be removed from memory. They
    are generally used to make sure that any resources which must be released are
    handled appropriately. You can have only one destructor in a class, structs cannot
    define it, without any modifiers or parameters and it cannot be called, it’s automatically
    invoked. To see it in action, build and run this Program without debugging using
    Ctrl+F5.


    ![](images/00062.jpeg)


    ### 7.4.10. Nested Types


    Nested types are types declared within another type. Nested types are often used
    to describe objects that are used only by the types that contain them.


    ![](images/00063.jpeg)


    You can create a new instance of the `Nested` class as follows:


    ![](images/00064.jpeg)


    ### 7.5. Encapsulation


    Encapsulation is one the 4 major principles that make a language object-oriented.
    It’s about the hiding of data implementation by restricting access to accessors
    and mutators.


    #### 7.5.1. Accessor


    An accessor is a method that is used to ask an object about itself. In OOP, these
    are usually in the form of properties, which have, under normal conditions, a
    `get` method, which is an accessor method.


    ![](images/00065.jpeg)


    #### 7.5.2. Mutator


    Mutators are public methods that are used to modify the state of an object, while
    hiding the implementation of exactly how the data gets modified.


    ![](images/00066.jpeg)


    ### 7.6. Inheritance


    Objects can relate to each other with either a “has a”, “uses a” or an “is a”
    relationship. “Is a” is the inheritance way of object relationship. As mentioned
    before, in C# all classes inherit from `System.Object`.


    ![](images/00067.jpeg)


    ![](images/00067.jpeg)


    ### 7.7. Polymorphism


    Polymorphism means one name, many forms. Polymorphism manifests itself by having
    multiple methods all the same name. There are 2 basic types of polymorphism. Overriding,
    also called run-time polymorphism, and overloading, which is referred to as compile-time
    polymorphism.


    ![](images/00069.jpeg)


    ### 7.8. Abstract and Sealed Classes and Members


    #### 7.8.1. Abstract classes and class members


    Data abstraction is the simplest of principles to understand. Data abstraction
    and Encapsulation are closely tied together, because a abstraction denotes a model,
    a view, or some other representation for an actual item. Encapsulation hides the
    details of.


    ![](images/00070.jpeg)


    Abstract methods have no implementations. You can use the `override` keyword to
    implement this method in the derived class. If a class declare a virtual method
    as `abstract`, it will virtual to any class inheriting from the abstract class.
    And a class inheriting an abstract cannot access the original implementation.


    ![](images/00071.jpeg)


    #### 7.8.2. Sealed classes and class members


    You can use the `sealed` keyword to declare a sealed class. A sealed class cannot
    be used as a base class so they prevent inheritance. If they are used on a derived
    virtual member, it negates the virtual aspect of this member for further derived
    classes.


    ![](images/00072.jpeg)


    #### 7.8.3. Difference between Override and New Keywords


    To use the keywords `override` and `new`, the base class method must be virtual.
    These keywords can be used also with properties, indexers and events. The difference
    between `override` and `new` is all about polymorphism. If you use the `override`
    keyword, the compiler will totally redefine this member regardless of the base
    class, in the other side by using the `new` keyword the compiler will hide the
    definition in this level of inheritance, but once called by the base class it
    will reveal the original definition. Without polymorphism, there is no difference.


    ![](images/00073.jpeg)


    ### 7.9. Static Classes and Static Class Members


    Basically the main characteristic of a static class that we can instantiate, it
    contains only static members and it is sealed. If need to call a public method
    of this class just do that by using the class name directly as shown:


    ![](images/00074.jpeg)


    A static member is a shared instance of this variable among all instances even
    in a non-static class.


    ![](images/00075.jpeg)


    Using static


    The feature allows all the accessible static members of a type to be imported,
    making them available without qualification in subsequent code.


    ![](images/00077.jpeg)


    This is great for when you have a set of functions related to a certain domain
    that you use all the time. `System.Math` would be a common example of that. It
    also lets you directly specify the individual named values of an enum type, like
    the `System.DayOfWeek` members above.


