    ### 21.4. Overloadable Operators


    C# allows user-defined types to overload operators by defining static member functions
    using the `operator` keyword. Not all operators can be overloaded, however, and
    others have restrictions.


    | Operators | Overloadability |

    | :--- | :--- |

    | `+`, `-`, `!`, `~`, `++`, `--`, `true`, `false` | These unary operators can
    be overloaded. |

    | `+`, `-`, `*`, `/`, `%`, `&`, `|`, `^`, `<<`, `>>` | These binary operators
    can be overloaded. |

    | `==`, `!=`, `<`, `>`, `<=`, `>=`, The comparison operators can be overloaded
    (but see the note that follows this table). |

    | `&&`, `||` | The conditional logical operators cannot be overloaded, but they
    are evaluated using `&` and `|`, which can be overloaded. |

    | `[]` | The array indexing operator cannot be overloaded, but you can define
    indexers. |

    | `(T)x` | The cast operator cannot be overloaded, but you can define new conversion
    operators. |

    | `+=`, `-=`, `*=`, `/=`, `%=`, `&=`, `|=`, `^=`, `<<=`, `>>=` | Assignment operators
    cannot be overloaded, but `+=`, for example, is evaluated using `+`, which can
    be overloaded. |

    | `=`, `.`, `?:`, `??`, `->`, `=>`, `f(x)`, `as`, `checked`, `unchecked`, `default`,
    `delegate`, `is`, `new`, `sizeof`, `typeof` | These operators cannot be overloaded.
    |


