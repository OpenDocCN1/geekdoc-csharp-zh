    ### 21.4. 可重载运算符


    C# 允许通过使用 `operator` 关键字定义静态成员来重载运算符。然而，并不是所有运算符都可以重载，某些还有限制。


    | 运算符 | 是否重载 |

    | :--- | :--- |

    | `+`、`-`、`!`、`~`、`++`、`--`、`true`、`false` | 这些一元运算符可以重载。 |

    | `+`、`-`、`*`、`/`、`%`、`&`、`|`、`^`、`<<`、`>>` | 这些二进制运算符可以重载。 |

    | `==`、`!=`、`<`、`>`、`<=`、`>=` | 比较运算符可以。 |

    | `&&`、`||` | 条件逻辑运算符不能重载，但它们使用重载的 `&` 和 `|` 进行计算。 |

    | `[]` | 数组索引运算符不能重载，但你可以定义索引器。 |

    | `(T)x` | 强制转换运算符不能重载，但你可以定义新的转换运算符。 |

    | `+=`、`-=`、`*=`、`/=`、`%=`、`&=`、`|=`、`^=`、`<<=`、`>>=` | 赋值运算符不能重载，但例如 `+=` 使用重载的
    `+` 进行计算。 |

    | `=`、`.`、`?:`、`??`、`->`、`=>`、`f(x)`、`as`、`checked`、`unchecked`、`default`、`delegate`、`is`、`new`、`sizeof`、`typeof`
    | 这些运算符不能重载。 |


    ![](img/0166.jpeg)


    ### 21.5. 转换运算符


    C# 允许对类或结构体声明转换，以便与其他类、结构体或基本类型转换。转换像运算符一样定义并为目标类型命名。被转换的参数类型或转换结果类型中，有一个必须是包含类型。


