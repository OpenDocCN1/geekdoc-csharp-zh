    ## 22. 字符串


    字符串是 `String` 类型的对象，其值为文本。在内部，文本存储为顺序的只读 `Char` 对象的集合。


    你可以通过多种方式声明和初始化字符串：


    ![](img/00171.jpeg)


    ### 22.1. 拼接多个字符串


    拼接是将一个字符串附加另一个字符串末尾的过程。当你使用 `+` 运算符拼接字符串字面量或字符串常量时，编译器会创建一个字符串。


    ![](img/00172.jpeg)


    ![](img/00173.jpeg)


    ### 22.2. 修改字符串内容


    由于字符串是不可变的，在不使用不安全代码的情况下，无法在创建后修改字符串对象的值。


    ![](img/00174.jpeg)


    ![](img/00034.jpeg)字符串插值


    `String.Format` 及其同类方法非常通用且有用，但它们的使用方式有些笨拙且容易出错。特别不幸的是在格式字符串中使用类似 `{0}` 等占位符，它们必须与单独提供的参数对齐：


    ![](img/00175.jpeg)


    字符串插值允许你通过直接在字符串字面量中设置“空洞”，将表达式直接放在它们的位置：


    ![](img/00176.jpeg)


    就像使用 `String.Format` 一样，可以提供可选的对齐和格式指定符：


    ![](img/00177.jpeg)


    空洞的内容可以几乎是任何表达式，甚至包括其他字符串：


    ![](img/00178.jpeg)


    注意条件表达式被括号括起来，这样 `: "s"` 就不会被误认为是格式指定符。


    ### 22.3. 比较字符串


    当你比较字符串时，你产生的是一个结果，说明一个字符串大于或小于另一个字符串，或者两个字符串相等。


    ![](img/00179.jpeg)


    ### 22.4. 使用 String.Split 解析字符串


    可以使用 `String.Split` 方法解析字符串。作为输入，`Split` 接收一个字符数组，指示哪些字符分隔了目标字符串中有意义的子字符串。


    ![](img/00180.jpeg)


    ### 22.5. 使用字符串方法搜索字符串


    stringstring 类型是 `System.String` 类的别名，它提供了许多搜索字符串内容的有用方法。


    ![](img/00181.jpeg)


    ### 22.6. 使用正则表达式搜索字符串


    `System.Text.RegularExpressions.Regex` 类可以用于搜索字符串。这些搜索的复杂度从非常简单到完全利用正则表达式不等。


    ![](img/00182.jpeg)


    你可以使用正则表达式来验证数组中每个字符串的格式。该验证要求每个字符串都符合电话号码的形式，其中三组数字由连字符分隔，前两组包含三位数字，第三组包含四位数字。这是通过使用正则表达式
    `^\\d{3}-\\d{3}-\\d{4}` 完成的。


    ![](img/00183.jpeg)


    ### 22.7. 确定字符串是否表示数值


    要确定字符串是否为指定数值类型的有效表示，请使用所有原始数值类型以及 `DateTime` 和 `IPAddress` 等类型实现的静态 `TryParse`
    方法。


    ![](img/00184.jpeg)


    你可以对 `long`、`byte` 和 `decimal` 值的字符串表示使用 `TryParse`。


    ![](img/00185.jpeg)


    ### 22.8. 将字符串转换为 DateTime


    程序允许用户以字符串值输入日期是常见的。要将基于字符串的日期转换为 `System.DateTime` 对象，你可以使用 `Convert.ToDateTime(String)`
    方法或 `DateTime.Parse(String)` 静态方法。


    ![](img/00186.jpeg)


    ### 22.9. 在旧编码和 Unicode 之间转换


    内存中的所有字符串都被编码为 Unicode (UTF-16)。从存储器将数据引入字符串对象时，数据会自动转换为 UTF-16。


    ![](img/00187.jpeg)


    ### 22.10. 将 RTF 转换为纯文本


    富文本格式 (RTF) 是微软在 20 世纪 80 年代后期开发的一种文档格式，用于跨操作系统的文档交换。


    ![](img/00188.jpeg)


    ## 23. 不安全代码和指针


    为了维护类型安全和安全性，C# 默认不支持指针算术。然而，通过使用 `unsafe` 关键字，你可以定义一个可以使用指针的不安全上下文。


    - 不安全代码具有以下属性：

    - 方法、类型和代码块可以被定义为不安全的。

    - 在某些情况下，不安全代码可以通过移除数组边界检查来提高应用程序性能。

    - 调用需要指针的本地函数时，需要不安全代码。

    - 使用不安全代码会引入安全性和风险。

    - 为了让 C# 编译不安全代码，应用程序必须使用 `/unsafe` 进行编译。


    ### 23.1. 固定大小缓冲区


    你可以使用 `fixed` 语句创建一个包含固定大小数组的缓冲区。


    ![](img/00189.jpeg)


    ### 23.2. 指针类型


    在不安全的上下文中，类型可以是指针、值类型或引用类型。可以是以下任何一种：


    - `sbyte`, `byte`, `short`, `ushort`, `int`, `uint`, `long`, `ulong`, `char`,
    `float`, `double`, `decimal`, `bool`。

    - 任何 `enum` 类型。

    - 任何用户定义的结构体类型。


    | 示例 | 说明 |

    |---|---|

    | `int* p` | 指向整数的指针。 |

    | `int** p` | 指向指针的指针。 |

    | `int*[] p` | 指针的一维数组。 |

    | `char* p` | 指向字符的指针。 |

    | `void* p` | 指向未知类型的指针。 |


    ## 24. XML 文档注释


    你可以通过在注释引用的代码块之前的特殊注释（用三个斜杠表示）中包含 XML 元素来为你的代码创建文档。


    ![](img/00192.jpeg)


    当你使用 `/doc` 选项编译时，编译器将搜索所有的 XML 标签并创建一个 XML 文件。


    ### 24.1. 文档注释推荐标签


    C# 编译器处理代码中的文档注释，并将其格式化为在 `/doc` 命令行中指定的 XML 文件。


    | 标签 | 说明 |

    |---|---|

    | `<c>` | `<c>` 标签提供了一种方法，将描述中的文本标记为代码。![](img/00193.jpeg) |

    | `<code>` | `<code>` 标签提供了一种将多行标记为代码的方法。 |

    | `<cref>` | XML 标签中的 `cref` 属性表示“代码引用”。它指定标签内部文本为代码元素。 |

    | `<example>` | `<example>` 标签允许指定方法或其他库成员的示例。![](img/00194.jpeg) |

    | `<exception>` | `<exception>` 标签允许指定可能抛出的异常。![](img/00195.jpeg) |

    | `<include>` | `<include>` 标签允许引用另一个文件中描述源代码中类型和成员的注释。![](img/00196.jpeg) |

    | `<list>` | `<list>` 块用于定义表格或定义列表的标题行。![](img/00197.jpeg) |


