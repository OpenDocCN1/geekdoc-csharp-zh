    ## 20.4. Safely Cast from `bool?` to `bool`


    The `bool?` nullable type can contain three different values: true, false, and
    null. Therefore, the `bool?` type cannot be used in conditionals such as with
    `if`, `for`, or `while`.


    ![](images/00148.jpeg)


    This is not allowed because it is unclear what null means in the context of a
    conditional. To use a `bool?` in a conditional statement, you need to perform
