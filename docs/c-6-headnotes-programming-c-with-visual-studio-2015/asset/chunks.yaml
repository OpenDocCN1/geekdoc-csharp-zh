    ## 21. 语句、表达式和运算符


    构成应用程序的 C# 代码由关键字、表达式和运算符组成的语句组成。


    ### 21.1. 语句


    程序执行的操作通过语句表示。常见操作包括声明变量、赋值赋值、调用方法、遍历集合以及根据给定条件跳转到一个或另一个代码块。


    程序中执行语句的顺序被称为控制流或执行流。


    ![](img/00150.jpeg)


    C# 中有各种类型的语句及其相关的关键字，如下表所示：


    | 异常 | 说明 |

    | :--- | :--- |

    | 声明语句 | 声明语句引入一个新的变量或常量。变量声明可以选择地为变量赋值。![](img/00151.jpeg) |

    | 表达式语句 | 计算一个值的表达式语句必须将该值存储在变量中。![](img/00152.jpeg) |

    | 选择语句 | 选择语句允许你根据一个或多个指定的条件跳转到不同的代码部分。`if-else`、`switch-case` |

    | 迭代语句 | 迭代语句允许你遍历数组等集合，或重复执行同一组语句，直到满足指定的条件。`do`、`for`、`foreach-in`、`while` |

    | 跳转语句 | 跳转语句将控制转移到另一个代码部分。`break`、`continue`、`default`、`goto`、`return`、`yield`
    |

    | 异常处理语句 | 异常处理语句允许你从运行时发生的异常状况中优雅地恢复。`throw`、`try-catch`、`try-finally`、`try-catch-finally`
    |

    | 检查和未检查 | checked 和 unchecked 语句允许你指定当结果存储在太小以无法容纳结果值的变量时，是否允许数值操作导致溢出。![](img/00153.jpeg)
    |

    | await 语句 | 如果你用 `async` 修饰符标记方法，则可以在方法中使用 `await` 运算符。当控制到达 `async` 方法中的 `await`
    表达式时，控制返回给调用者，方法中的进度被暂停，直到等待的任务完成。 |

    | yield return 语句 | 迭代器对集合（如列表或数组）执行自定义迭代。迭代器使用 `yield return` 语句一次性返回每个元素。当遇到
    `yield return` 语句时，代码中的当前位置会被记住。![](img/00154.jpeg) |

    | fixed 语句 | `fixed` 语句防止垃圾回收器移动可移动变量。![](img/00155.jpeg) |

    | lock 语句 | `lock` 语句允许你限制只有一个线程可以访问代码块。![](img/00156.jpeg) |

    | 标记语句 | 你可以给语句一个标记，然后使用 `goto` 关键字跳转到被标记的语句。![](img/00157.jpeg) |

    | 空语句 | 空语句由单个分号组成。它什么都不做，可以用于需要语句但不需要执行操作的地方。![](img/00158.jpeg) |


    ### 21.2. 表达式


    表达式是由一个或多个操作数和零或多个运算符组成的序列，可以求值为单个值、对象、方法或命名空间。表达式可以由字面量值、方法调用、运算符及其操作数或简单名称组成。


