    #### 4.4.1. Using the Conditional AND Operator


    The logical condition operator && is a “short-circuit” evaluation of the logical
    operator &. Means in a statement x && y if x is falsebecause the result of the
    AND-Operation is false no matter the value of y. To be clear in a logic statement
    ofbool  variables a,b,c..z given by a && b && c .. && z at the first false variable,
    the processor will stop evaluating the expression and the result will be false.


    ![](images/00018.jpeg)


    #### 4.4.2. Using the Conditional OR Operator


    The logical condition operator || is a “short-circuit” evaluation of the logical
    operator |. Means in a statement x || y if x is truebecause the result of the
    OR-Operation is false no matter the value of y. To be clear in a logic statement
    ofbool  variables a,b,c..z given by a || b || c .. || z at the first true variable,
    the processor will stop evaluating the expression and the result will be true.


