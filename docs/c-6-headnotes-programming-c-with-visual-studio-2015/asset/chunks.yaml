- fmt: "\n# I. Getting Started with C#\n\nC# is an elegant and type-safe object-oriented\
    \ language that enables developers to build a variety of secure and robust applications\
    \ that run on the .NET Framework. You can use C# to create Windows client applications,\
    \ XML Web services, distributed components, client-server applications, database\
    \ applications, and much, much more. Visual C# provides an advanced code editor,\
    \ convenient user interface designers, integrated debugger, and many other tools\
    \ to make it easier to develop applications based on the C# language and the .NET\
    \ Framework.\n\n## 1. What can I do with C#?\n\nC# syntax is highly expressive,\
    \ yet it is also simple and easy to learn. The curly-brace syntax of C# will be\
    \ instantly recognizable to anyone familiar with C, C++ or Java. Developers who\
    \ know any of these languages are typically able to begin to work productively\
    \ in C# within a very short time. C# syntax simplifies many of the complexities\
    \ of C++ and provides powerful features such as nullable value types, enumerations,\
    \ delegates, lambda expressions and direct memory access, which are not found\
    \ in Java. C# supports generic methods and types, which provide increased type\
    \ safety and performance, and iterators, which enable implementers of collection\
    \ classes to define custom iteration behaviors that are simple to use by client\
    \ code. Language-Integrated Query (LINQ) expressions make the strongly-typed query\
    \ a first-class language construct.\n\nAs an object-oriented language, C# supports\
    \ the concepts of encapsulation, inheritance, and polymorphism. All variables\
    \ and methods, including the `Main` method, the application's entry point, are\
    \ encapsulated within class definitions. A class may inherit directly from one\
    \ parent class, but it may implement any number of interfaces. Methods that override\
    \ virtual methods in a parent class require the `override` keyword as a way to\
    \ avoid accidental redefinition. In C#, a `struct` is like a lightweight class;\
    \ it is a stack-allocated type that can implement interfaces but does not support\
    \ inheritance.\n\nIn addition to these basic object-oriented principles, C# makes\
    \ it easy to develop software components through several innovative language constructs,\
    \ including the following:\n\n*   Encapsulated method signatures called `delegates`,\
    \ which enable type-safe event notifications.\n*   Properties, which serve as\
    \ accessors for private member variables.\n*   Attributes, which provide declarative\
    \ metadata about types at run time.\n*   Inline XML documentation comments.\n\
    *   Language-Integrated Query (LINQ) which provides built-in query capabilities\
    \ across a variety of data sources.\n\nIf you have to interact with other Windows\
    \ software such as COM objects or native Win32 DLLs, you can do this in C# through\
    \ a process called \"Interop.\" Interop enables C# programs to almost anything\
    \ that a native C++ application can do. C# even supports pointers and the concept\
    \ of \"unsafe\" code for those cases in which direct memory access is absolutely\
    \ critical.\n\nThe C# build process is simple compared to C and C++ and more flexible\
    \ than in Java. There are no separate header files, and no requirement that methods\
    \ and types be declared in a particular order. A C# source file may define any\
    \ number of classes, structs, interfaces, and events.\n\nThe following are additional\
    \ C# resources:\n\n*   For a good general introduction to the language, see Chapter\
    \ 1 of the C# Language Specification.\n*   For detailed information about specific\
    \ aspects of the C# language, see the C# Reference.\n*   For more information\
    \ about LINQ, see LINQ (Language-Integrated Query).\n*   To find the latest articles\
    \ and resources from the Visual C# team, see the Visual C# Developer Center.\n\
    \n## 2. What is .NET?\n\nC# programs run on the .NET Framework, an integral component\
    \ of Windows that includes a virtual execution system called the common language\
    \ runtime (`CLR`) and a unified set of class libraries. The `CLR` is the commercial\
    \ implementation by Microsoft of the common language infrastructure (`CLI`), an\
    \ international standard.\n\n## 22.10. Convert RTF to Plain Text\n\n## 23. Unsafe\
    \ Code and Pointers\n\n### 23.1. Fixed Size Buffers\n\n### 23.2. Pointer types\n\
    \n## 24. XML Documentation Comments\n\n### 24.1. Recommended Tags for Documentation\
    \ Comments\n\n### 24.2. Processing the XML File\n\n### 24.3. Delimiters for Documentation\
    \ Tags\n\n## III. Coding standards and naming conventions\n\n### 1. Do\n\n###\
    \ 2. Don’t\n\n### 3. Avoid\n\n# II. Language Guide\n\n## 1. First Steps\n\n###\
    \ 1.1. Your First Program\n\nWe will follow the tradition in a new language and\
    \ start with a first program that prints the words “Hello World!” on the screen.\
    \ In C# this could be made in a single line:\n\n```csharp\nConsole.WriteLine(\"\
    Hello World!\");\n```\n\nAnd our `Main` method should look like this, Press F5\
    \ to build and run the program:\n\n```csharp\nstatic void Main()\n{\n    Console.WriteLine(\"\
    Hello World!\");\n}\n```\n\nTo insert `Console.WriteLine();` line, just type the\
    \ shortcut `cw` and then Press `TAB` `TAB` to invoke the code snippet\n\n### 1.2.\
    \ C# Coding Conventions\n\nAs part of the best practices of the C# Programming\
    \ Language, to enable readers to understand the code more quickly, create consistent\
    \ look and facilitate copying and change the code, even if:\n\n> Copy and paste\
    \ is a design error. – David Parnas\n"
