    ### 4.5. Making decisions using the switch Statement


    A switch statement is used for multiple actions depending on the value of a given
    expression. The code between the case and the break keywords is executed if the
    condition is met. To move from one case to another use the keyword goto.


    ![](images/00022.jpeg)


    #### 4.5.1. Using an Enumeration with a switch Statement


    Switch can act upon enum values. An enum switch sometimes results in clearer code.
    It sometimes is faster. This code pattern is often effective.


    ![](images/00023.jpeg)


    ![](images/00003.jpeg)To insert these lines of code, just type the shortcut switch
    and then Press TAB TAB to invoke the code snippet, followed by the enum instance
    or the enumeration and Press ENTER ENTER.


    ### 4.6. Increment and Decrement Operators


    There are different shortcuts in C# that give you possibility to increase or decrease
    the value of your variable in postfix and prefix.


    | Operator | Purpose |


    | v++ | Increment variable v by 1. |


    | v-- | Decrement variable v by 1. |


    | v+=n | Increment variable v by n. |


    | v-=n | Subtract n from variable v. |


    | v*=n | Multiply variable v by n. |


    ![](images/00024.jpeg)


    ## 5. Arrays


    An array is a systematic arrangement of similar objects, it’s recognized also
    as a data structure. It’s a collection of elements identified by at least one
    array index or key. At declaration, you need to specify the type of its elements.


    ![](images/00025.jpeg)


    ### 5.1. Arrays as objects


    In C# Arrays are already objects, not like on C/C++. Therefore, you can use some
    predefined properties and methods and other class members.


    ![](images/00026.jpeg)


    ### 5.2. Single-dimensional Arrays


    You can declare an empty single-dimensional array of n elements. The first value
    has the index of 0, and the last one of n-1.


