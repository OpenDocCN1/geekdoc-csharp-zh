    ## 6. Looping


    A loop is a set of statements that are repeated for a specified number of time
    or until a logical condition is met.


    ### 6.1. Using the for loop


    The for-loop allows code to be executed repeatedly. Unlike other kinds of loops,
    the for-loop is distinguished by an explicit loop counter.


    ![](images/00036.jpeg)


    ### 6.2. Using the foreach loop


    The foreach-loop gives the possibility for traversing items in a collection. Unlike
    for-loop, foreach-loop usually maintain no explicit counter. Here, how the same
    loop could be created with foreach-loop:


    ![](images/00037.jpeg)


    ### Using the while loop


    ![](images/00038.jpeg)


    The while-loop allows code to be executed repeatedly based on a given Boolean
    condition.


    ![](images/00039.jpeg)


    ### 6.3. Using the do-while loop


    ![](images/00040.jpeg)


    The do-while loop executes the code at least one time. Then repeatedly continue
    executing the code, or not, depending on given condition.


    ![](images/00041.jpeg)


    ## 7. Classes and Structs


    Classes and Structs are two extensible program-code-template, a blueprint, for
    creating objects; providing initial values for state and implementations of behavior.


    There is 4 major principles that a make a language object-oriented: Encapsulation,
    Data Abstraction, Polymorphism and Inheritance. These principles will be discussed
    later with examples.


    ### 7.1. Classes


    Classes can be declared by using the keyword `class`. All classes inherit from
    `System.Object`, so classes are reference types.


    ![](images/00042.jpeg)


    ### 7.2. Structs


    Structscan be declared by using the keyword `struct`. All Structs inherit from
    `System.ValueType` which inherits from `System.Object`, so Structs are value types.


    ![](images/00043.jpeg)


    With a `Struct`:


    - Non const or static fields cannot be initialized.

    - Default Constructor (without parameters) or Destructor cannot be declared. But
    we can declare a Constructor that have parameters.

    - Can instantiate without the keyword `new`.

    - Can implement interfaces.

    - Can inherit from other Struct or class, but cannot be a base of a class.

    - Unlike other value types, it can be used as Nullable type.


    ### 7.3. Objects


    Objects are instances of Classes or Structs. In the case of Classes they are created
    by using the `new` operator. With Structs they can be created by using the `new`
    operator, but it’s not required.


    ![](images/00044.jpeg)


    ### 7.4. Members


    #### 7.4.1. Fields


    Fields are variables declared at class scope. A field may be a built-in numeric
    type or an instance of another class.


    ![](images/00045.jpeg)


    #### 7.4.2. Constants


    Constants are fields or properties whose value is set at compile time and cannot
    be changed.


    ![](images/00046.jpeg)


    #### 7.4.3. Properties


    Properties are methods on a class that are accessed as if they were fields on
    that class. A property can provide protection for a class field to keep it from
    being changed without the knowledge of the object.


    ![](images/00047.jpeg)

    ![](images/00048.jpeg)


    #### Initializers for auto-properties


    You can now add an initializer to an auto-property, just as you can in a field.


    ![](images/00049.jpeg)


    he initializer directly initializes the backing field; it doesn’t work through
    the setter of the auto-property. The initializers are executed in order as written,
    just as – and along with – field initializers.


    ![](images/00048.jpeg)


    #### Getter-only auto-properties


    Auto-properties can now be declared without a setter.


    ![](images/00050.jpeg)


    The backing field of a getter-only auto-property is implicitly declared as `readonly`
    (though this matters only for reflection purposes).


    #### 7.4.4. Methods


    Methods define the actions that a class can perform. Methods can take parameters
    that provide input data, and can return output data through parameters. Methods
    can also return a value directly, without using a parameter.


    ![](images/00051.jpeg)

    ![](images/00048.jpeg)


    #### Extension methods


    Extension methods are static methods, but are intended to be used as instance
    methods.


    ![](images/00052.jpeg)


    This does mean that it can now be a breaking change to turn an ordinary static
    method into an extension method, which was not the case before. But extension
    methods are generally only called as static methods in the rare cases where there
    is an ambiguity. In those cases, it seems right to require full qualification
    of the method anyway.


    #### 7.4.5. Events


    Events provide notifications about occurrences, such as button clicks or the successful
    completion of a method, to other objects. Events are defined and triggered by
    using delegates.


    #### 7.4.6. Operators


    Overloaded operators are considered class members. When you overload an operator,
    you define it as a public static method in a class. The predefined operators (`+`,
    `*`, `<`, and so on) are not considered members.


    ##### 7.4.6.1. Primary Operators


    | Expression | Purpose |

    | :--- | :--- |

    | `x.y` | Member access |

    | `x?.y` | Conditional member access |

    | `f(x)` | Method and delegate invocation |

    | `a[x]` | Array and indexer access |

    | `a?[x]` | Conditional array and indexer access |

    | `x++` | Post-increment |

    | `x--` | Post-decrement |

    | `new T(...)` | Object and delegate creation |

    | `new T(...){...}` | Object creation with initializer. |

    | `new {...}` | Anonymous object initializer. |

    | `new T[]` | Array creation. |

    | `typeof(T)` | Obtain `System.Type` object for `T` |

    | `checked(x)` | Evaluate expression in checked context |

    | `unchecked(x)` | Evaluate expression in unchecked context |

    | `default (T)` | Obtain default value of type `T` |


    ##### 7.4.6.2. Unary Operators


    | Expression | Purpose |

    | :--- | :--- |

    | `+x` | Identity |

    | `-x` | Negation |

    | `!x` | Logical negation |

    | `~x` | Bitwise negation |

    | `++x` | Pre-increment |

    | `--x` | Pre-decrement |

    | `(T)x` | Explicitly convert `x` to type `T` |


    ##### 7.4.6.3. Multiplicative Operators


    | Expression | Purpose |

    | :--- | :--- |

    | `*` | Multiplication |

    | `/` | Division |

    | `%` | Reaminder |


    ##### 7.4.6.4. Additive Operators


    | Expression | Purpose |

    | :--- | :--- |

    | `x + y` | Addition, string concatenation, delegate combination |

    | `x – y` | Subtraction, delegate removal |


    ##### 7.4.6.5. Shift Operators


    | Expression | Purpose |

    | :--- | :--- |

    | `x << y` | Shift left |

    | `x >> y` | Shift right |


    ##### 7.4.6.6. Relational and Type Operators


    | Expression | Purpose |

    | :--- | :--- |

    | `x < y` | Less than |

    | `x > y` | Greater than |

    | `x <= y` | Less than or equal |

    | `x >= y` | Greater than or equal |

    | `x is T` | Return true if `x` is a `T`, false otherwise |

    | `x as T` | Return `x` typed as `T`, or null if `x` is not a `T` |


    ##### 7.4.6.7. Equality Operators


    | Expression | Purpose |

    | :--- | :--- |

    | `x == y` | Equal |

    | `x != y` | Not Equal |

