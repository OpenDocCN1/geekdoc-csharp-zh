    We need to have a minimum of knowledge of some of these conventions to be able
    to write a good code.


    ### 1.2.1. Naming Conventions


    In short examples, without using directives, use namespace qualifications.


    ![](images/00004.jpeg)


    ### 1.2.2. Commenting Conventions


    Place a comment in a separate line, not at the end. It should begin with uppercase
    letter, each line with one space and it ends with a period.


    ![](images/00005.jpeg)


    ## 2. Constants and Variables


    Constants and variables associate a name with a value of particular type. The
    value of a constant cannot be changed once it is set, whereas a variable can be
    set to a different value in the future.


    ### 2.1. Declaring Constants and Variables


    Constants and variables must be declared before they are used.Use `const` keyword
    for declaring constants, declare anonymous variable with the keyword `var` and
    dynamic variable with the `dynamic` keyword.


    ![](images/00006.jpeg)


    `var` is static typed, the compiler and runtime know the type.


    ![](images/00007.jpeg)


    `dynamic` is very different beast, it is most similar to object, but with dynamic
    dispatch.


    ![](images/00008.jpeg)


    ## 3. Primitive Types


    The primitive types are identified by keywords predefined under the `System` namespace.
    These keywords are considered as reserved words.


    Primitive types permit values to be created literally:


    ![](images/00009.jpeg)


    C# defines the following primitive types:


    | Struct / Class | Data Type | Description | Range |

    | :--- | :--- | :--- | :--- |

    | `struct System.Byte` | byte | 8-bit unsigned integer | 0 .. 255 |

    | `struct System.SByte` | sbyte | 8-bit signed integer | -128 .. 127 |

    | `struct System.Int16` | short | 16-bit signed integer | -32,768 .. 32,767 |

    | `struct System.UInt16` | ushort | 16-bit unsigned integer | 0 .. 65,535 |

    | `struct System.Int32` | int | 32-bit signed integer | -2,147,483,648 .. 2,147,483,647
    |

    | `struct System.UInt32` | uint | 32-bit unsigned integer | 0 .. 4,294,967,295
    |

    | `struct System.Int64` | long | 64-bit signed integer | -9,223,372,036,854,775,808
    .. 9,223,372,036,854,775,807 |

    | `struct System.UInt64` | ulong | 64-bit unsigned integer | 0 .. 18,446,744,073,709,551,615
    |

    | `struct System.Single` | float | A single precision floating point number |
    -3.402823e38 .. 3.402823e38 |

    | `struct System.Double` | double | A double precision floating point number |
    -1.79769313486232 e308 .. 1.79769313486232 e308 |

    | `struct System.Decimal` | decimal | A Decimal number | -79228162514264337593543950335
    .. 79228162514264337593543950335 |

    | `struct System.Char` | char | A character as UTF-16 code unit | A Unicode character.
    |

    | `classSystem.String` | string | Text as a series of Unicode characters | A string
    of Unicode characters. |

    | `struct System.Boolean` | bool | A Boolean value | True or False. |

    | `classSystem.Object` | object | Supports all classes in the .NET Framework class
    hierarchy and provides low-levelservices to derived classes. | An object. |


    ### 3.1. Using Mathematical and Logical Operators


    The following is a list of the basic mathematical operators, listed in order of
    precedence. Use parentheses to force other ordering:


    | Operator | Purpose |

    | :--- | :--- |

    | `*`, `/`, `%` | Multiplication, Division, Modulus |

    | `+`, `-` | Addition , Subtraction |

    | `&` | Logical AND |

    | `^` | Logical XOR |

    | `\|` | Logical OR |


    ![](images/00010.jpeg)


    ![](images/00003.jpeg)Use predefined type names instead of system type names like
    `Int16`, `Single`, `UInt64`, etc which will makes code more natural to read.


    ![](images/00011.jpeg)


    Floating point puzzle


    ![](images/00012.jpeg)But always remember, it’s not a bug – it’s an undocumented
    feature!


    ![](images/00013.jpeg)


    ## 4. Making Decisions


    You have the ability to change the flow of an application according to a condition
    that will be tested.


    ### 4.1. Making decisions using the if Statement


    This one is the simplest form of conditional branching. If the condition is verified,
    then the code inside the if statement will be executes.


    ![](images/00014.jpeg)


    ### 4.2. Making decisions using the if-else Statement


    This one is the simplest form of conditional branching. If the condition is verified,
    then the code inside the if statement will be executes.


    ![](images/00015.jpeg)


    ![](images/00003.jpeg)You can use if-else to verify possibilities.


    ### 4.3. Using Relational Operators


    These operators compare values:


    | Operator | Purpose |

    | :--- | :--- |

    | `==` | Checks for equality. |

    | `!=` | Checks for inequality. |

    | `>` | Greater than. |

    | `<` | Less than. |

    | `>=` | Greater than or equal. |

    | `<=` | Less than or equal. |


    ![]((images/00016.jpeg)


    ### 4.4. Using Logical Operators


    The logical operators are used to evaluate conditions:


    | Operator | Purpose |

    | :--- | :--- |

    | `&&` | Logical AND |

    | `\|` | Logical OR |

    | `!` | Logical NOT |


    #### 4.4.1. Using the AND Operator


    The `&&` operator is a “short-circuit” evaluation of conditions.


    ![](images/00017.jpeg)


    #### 4.4.2. Using the OR Operator


    The `||` operator is a “short-circuit” evaluation of conditions.


    ![](images/00018.jpeg)


    #### 4.4.3. Using the NOT Operator


    It’s a unary operator for negation.


    ![](images/00019.jpeg)


    ### 4.5. Making decisions using the switch Statement


    A switch statement is used for multiple actions depending on the value of a given
    expression. The code between the `case` and `break` keywords is executed if the
    condition is met. To move from one case to another use `goto`.


    ![](images/00020.jpeg)


    #### 4.5.1. Using an Enumeration with a switch Statement


    Switch can act upon enum values. An enum switch sometimes results in clearer code.
    It sometimes is faster.


    ![](images/00021.jpeg)


    ### 4.6. Increment and Decrement Operators


    There are different shortcuts in C# that give you possibility to increase or decrease
    the value of your variable in postfix and prefix.


    | Operator | Purpose |

    | :--- | :--- |

    | `v++` | Increment variable v by 1. |

    | `v--` | Decrement variable v by 1. |

    | `v+=n` | Increment variable v by n. |

    | `v-=n` | Subtract n from variable v. |

    | `v*=n` | Multiply variable v by n. |


