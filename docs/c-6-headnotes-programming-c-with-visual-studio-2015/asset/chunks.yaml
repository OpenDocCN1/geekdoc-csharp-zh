    一样。上一个委托定义用于一个命名为 `Add` 的委托类型，它接受两个 `double` 参数并返回 `double` 类型的结果。与其他类型一样，委托的访问权限只能是
    `public` 或 `internal`，并且默认为 `internal`。


    ![](img/00079.jpeg)


