    ## 23. Unsafe Code and Pointers


    To maintain type safety and security, C# does not support pointer arithmetic,
    by default. However, by using the `unsafe` keyword, you can define an unsafe context
    in which pointers can be used.


    - Unsafe code has the following properties:

    - Methods, types, and code blocks can be defined as unsafe.

    - In some cases, unsafe code may increase an application''s performance by removing
    array bounds checks.

    - Unsafe code is required when you call native functions that require pointers.

    - Using unsafe code introduces security and stability risks.

    - In order for C# to compile unsafe code, the application must be compiled with
    `/unsafe`.


    ### 23.1. Fixed Size Buffers


    You can use the `fixed` statement to create a buffer with a fixed size array in.


    ![](images/00189.jpeg)


    ### 23.2. Pointer Types


    In an unsafe context, a type may be a pointer, a value type, or a reference type.
    Any of the following:


    - `sbyte`, `byte`, `short`, `ushort`, `int`, `uint`, `long`, `ulong`, `char`,
    `float`, `double`, `decimal`, `bool`.

    - Any `enum` type.

    - Any user-defined struct type.


    | Example | Description |

    |---|---|

    | `int* p` | pointer to integer. |

    | `int** p` | pointer to pointer to integer. |

    | `int*[] p` | single-dimensional array of pointers. |

    | `char* p` | pointer to char. |

    | `void* p` | pointer to unknown type. |


    ## 24. XML Documentation Comments


    You can create documentation for your code by including XML elements in special
    comment (indicated by triple slashes) in the source code before the code block
    to which the comments refer.


    ![](images/00192.jpeg)


    When you compile with the `/doc` option, the compiler will search for all XML
    tags in the source code and create an XML file.


    ### 24.1. Recommended Tags for Documentation Comments


    The C# compiler processes documentation comments in your code and formats them
    as XML in a file whose name you specify in the `/doc` command-line option.


    | Tag | Description |

    |---|---|

    | `<c>` | The `<c>` tag gives you a way to indicate that text within a description
    should be marked as code.![](images/00193.jpeg) |

    | `<code>` | The `<code>` tag gives you a way to indicate multiple lines as code.
    |

    | `<cref>` | The `cref` attribute in an XML documentation tag means "code reference."
    It specifies that the inner text of the tag is a code element. |

    | `<example>` | The `<example>` tag lets you specify an example of how to use
    a method or other library member.![](images/00194.jpeg) |

    | `<exception>` | The `<exception>` tag lets you specify which exceptions can
    be thrown.![](images/00195.jpeg) |

    | `<include>` | The `<include>` tag lets you refer to comments in another file
    that describe the types and members in your source code.![](images/00196.jpeg)
    |

    | `<list>` | The `<list>` block is used to define the heading row of either a
    table or definition list.![](images/00197.jpeg) |

