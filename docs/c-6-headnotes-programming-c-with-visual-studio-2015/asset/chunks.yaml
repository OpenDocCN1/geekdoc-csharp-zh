    to return each element one at a time. When a `yield return` statement is reached,
    the current location in code is remembered.![](images/00154.jpeg) |

    | The fixed statement | The `fixed` statement prevents the garbage collector from
    relocating a movable variable.![](images/00155.jpeg) |

