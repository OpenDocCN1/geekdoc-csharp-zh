    \ 中提供一个显示文件操作进展的标准对话框。\n\n![](img/00112.jpeg)\n\n### 13.6. 写入文本文件\n\n![](img/00113.jpeg)\n\
    \n### 13.7. 从文本文件中读取\n\n你可以使用 `System.IO.File` 类的静态方法 `ReadAllText` 和 `ReadAllLines`\
    \ 读取文本文件的内容。\n\n![](img/00114.jpeg)\n\n### 13.8. 一一行读取文本文件\n\n你可以使用 `StreamReader`\
    \ 类的 `ReadLine` 方法一次行将文本文件的内容读取到字符串中。每行文本都存储在字符串 `line` 中并显示在屏幕上。\n\n![](img/00115.jpeg)\n\
    \n### 13.9. 在注册表中创建键\n\n你可以在当前用户的注册表项 \"Names\" 键下，添加键值对 \"Name\" 和 \"Test\"。\n\
    \n![](img/00116.jpeg)\n\n## 14. 泛型\n\n### 14.1. 泛型简介\n\n泛型类和方法以非泛型对应项无法的方式结合了重用性、类型安全和效率。泛型最常用于集合以及操作集合的方法。\n\
    \n![](img/00117.jpeg)\n\n下面的代码示例显示了客户端代码如何使用泛型 `GenericList<T>` 类创建整数列表。只需通过更改类型参数，即可轻松修改后续代码以创建字符串或任何自定义类型的列表：\n\
    \n![](img/00118.jpeg)\n\n### 14.2. 泛型类型参数\n\n在泛型类型或方法定义中，类型参数是客户端在实例化时指定的类型的占位符。泛型类（如\
    \ `GenericList<T>`）不能直接使用，因为它本身不是一个类型；它更像是类型的蓝图。除非单个字母名称完全是自俗其懂，否则一个描述性的名称会增加价值。\n\
    \n![](img/00119.jpeg)\n\n### 14.3. 类型参数的约束\n\n当你定义泛型类时，可以对客户端代码可用于类型的类型种类进行限制。如果客户端代码尝试使用不受约束允许的类型实例化你的类，结果将是编译错误。这些限制被称为约束。\n\
    \n| 约束 | 说明 |\n| :--- | :--- |\n| `where T : struct` | 类型参数必须是值类型。可以指定除 `Nullable`\
    \ 外的值类型。 |\n| `where T : class` | 类型参数必须是引用类型；这也适用于任何类、委托或数组类型。 |\n| `where T\
    \ : new()` | 类型参数必须具有公共无参数构造函数。与其他约束一起使用时，`new()` 约束必须最后指定。 |\n| `where T : <base\
    \ class>` | 类型参数必须是或派自指定的基类。 |\n| `where T : <interface>` | 类型参数必须是或实现指定的接口。可以指定多个接口约束。约束接口也可以是泛型的。\
    \ |\n| `where T : U` | 为 `T` 提供的类型必须是或派自为 `U` 提供的类型。 |\n\n![](img/00120.jpeg)\n\
    \n### 14.4. 泛型类\n\n泛型类封装与特定数据类型无关的操作。泛型类最用途用于链表、哈希表、栈、队列、树等集合。\n\n![](img/00121.jpeg)\n\
    \n### 14.5. 泛型接口\n\n为泛型集合类或代表集合项目的泛型类定义接口通常很有用。泛型类的倾向是使用泛型接口（例如 `IComparable<T>`\
