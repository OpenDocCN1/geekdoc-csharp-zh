    \ 创建文件或文件夹\n\n你可以通过程序在计算机上创建文件夹，创建一个子文件夹，在子文件夹中创建一个文件，并向文件写入数据。\n\n![](img/00108.jpeg)\n\
    \n### 13.4. 复制、删除和移动文件及文件夹\n\n使用 `System.IO.File` 以同步方式复制、移动和删除文件及文件夹。\n\n![](img/00109.jpeg)\n\
