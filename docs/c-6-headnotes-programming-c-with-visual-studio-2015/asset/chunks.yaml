    ### 7.4.6.8. 逻辑、条件与空运算符


    | 表达式 | 目的 |

    | :--- | :--- |

    | `x & y` | 整数按位与，布尔逻辑与 |

    | `x ^ y` | 整数按位异异，布尔逻辑异异 |

    | `x \| y` | 整数按位或，布尔逻辑或 |

    | `x && y` | 仅当 `x` 为真时评估 `y` |

    | `x \| y` | 仅当 `x` 为假时评估 `y` |

    | `x ?? y` | 如果 `x` 为空则结果为 `y`，否则为 `x` |

    | `x ?: y : z` | 如果 `x` 为真则结果为 `y`，如果 `x` 为假则结果为 `z` |


    ![](img/00034.jpeg) 空条件运算符


    有时代码往往深陷在空检查中。空条件运算符允许仅在接收者不为空时访问成员和元素，否则提供空结果。


    ![](img/00053.jpeg)


    空条件运算符通常与空合并运算符 `??` 配合使用：


    ![](img/00054.jpeg)


    空条件运算符表现出短路行为，即紧随其后的成员访问、元素访问和调用的链仅在原始接收者不为空时才会执行：


    ![](img/00055.jpeg)


    此示例本质上等同于：


    ![](img/00056.jpeg)


    区别在于 `customers` 只被评估一次。除非 `customers` 有非空值，否则紧跟 `?` 之后的成员访问、元素访问和调用都不会执行。


    当然，空条件运算符本身也可以链用，以防在链中需要多次检查空：


    ![](img/00057.jpeg)


    注意，调用（带括号的参数列表）不能紧跟在 `?` 运算符——这会导致过多的语法歧义。因此，仅在委托存在时调用委托的直接方法行不通。然而，你可以通过委托上的
    `Invoke` 方法来实现：


    ![](img/00058.jpeg)


    我们预计这种模式的一个非常常见的用法是触发事件：


    ![](img/00059.jpeg)


    这是在触发事件之前检查空的一种简单且线程安全的方法。之所以是线程安全的是因为该特性只评估左侧一次，并将其保留在临时变量中。


    ### 7.4.6.9. 赋值与匿名运算符


    | 表达式 | 目的 |

    | :--- | :--- |

    | `=` | 赋值 |

    | `x op= y` | 复合赋值。支持这些运算符：`+=`, `-=`, `*=`, `/=`, `%=`, `&=`, `|=`, `!=`, `<<=`,
    `>>=` |

    | `(T x) => y` | 匿名函数（Lambda 表达式） |


    ### 7.4.7. 索引器


    索引器允许对象以类似于数组的方式索引。


    ![](img/00060.jpeg)


    ### 7.4.8. 构造函数


    构造函数是在对象首次创建时被调用的方法。它们通常用于初始化对象的数据。结构体（Structs）不能显式包含默认构造函数，因为它是由编译器提供的。


    ![](img/00061.jpeg)


    ### 7.4.9. 析构函数


    析构函数在 C# 中极少使用。它们是运行时执行引擎在对象从内存中移除之前调用的方法。它们通常用于确保任何必须释放的资源得到适当处理。一个类中只有一个析构函数，结构体不能定义它，它没有修饰符或参数且不能被调用，它是自动调用的。要查看它的运行，请使用
    Ctrl+F5 直接编译并运行此程序。


    ![](img/00062.jpeg)


    ### 7.4.10. 嵌套类型


    嵌套类型是在另一个类型内部定义的类型。嵌套类型通常用于描述仅包含它的类型使用的对象。


    ![](img/00063.jpeg)


    你可以如下所示创建 `Nested` 类的新实例：


    ![](img/00064.jpeg)


    ### 7.5. 封装


    封装是使语言面向对象的四个主要原则之一。它是关于通过限制对访问器和修改器的访问来隐藏数据实现。


    #### 7.5.1. 访问器


    访问器是用于询问对象自身信息的方法。在 OOP 中，这些通常以属性的形式存在，在正常条件下，它们有一个 `get` 方法，即一个访问器方法。


    ![](img/00065.jpeg)


    #### 7.5.2. 修改器


    修改器是用于修改对象状态的公共方法，同时隐藏数据如何被修改的具体实现。


    ![](img/00066.jpeg)


    ### 7.6. 继承


    对象之间可以通过“拥有”、“使用”或“是”的关系相关联。“是”是对象关系中的继承方式。正如之前提到的，在 C# 中，所有类都继承自 `System.Object`。


    ![](img/00067.jpeg)


    ![](img/00067.jpeg)


    ### 7.7. 多态


    多态意味着一个名称有多种形式。多态通过具有相同名称的方法表现出来。有两种基本类型态：重写（Overriding），也称为运行时多态，以及重载（Overloading），被称为编译时多态。


    ![](img/00069.jpeg)


    ### 7.8. 抽象类与密封类


    #### 7.8.1. 抽象类与类成员


    数据抽象是最容易理解的原则之一。数据抽象与封装紧密结合，因为抽象表示一个模型、视图或其他实际表示。


    ![](img/00070.jpeg)


    抽象方法没有实现。你可以在派生类中使用 `override` 关键字来实现此方法。如果一个类将方法声明为 `abstract`，则继承自该抽象类的类将实现它。


    ![](img/00071.jpeg)


    #### 7.8.2. 密封类与类成员


    你可以使用 `sealed` 关键字声明一个密封类。密封类不能作为基类，因此它们阻止了继承。如果它们用于虚成员，则将消除该成员对进一步派生类的虚属性。


    ![](img/00072.jpeg)


    #### 7.8.3. override 和 new 关键字的区别


    要使用 `override` 和 `new` 关键字，基类方法必须是虚的。这些关键字也可以用于属性、索引器和事件。`override` 和 `new` 的区别完全在于多态。如果你使用
    `override` 关键字，编译器将重新定义此成员，无论基类如何；另一方面，通过使用 `new` 关键字，编译器将在此继承级别上隐藏定义，但一旦通过基类调用，它将显示原始定义。如果没有多态，它们就没有区别。


    ### 7.9. 静态类与静态类成员


    静态类的主要特征是我们是我们无法实例化，它只包含静态成员并且是密封的。如果需要调用此类的公共方法，只需直接使用类名如所示：


    ![](img/00074.jpeg)


    静态成员是该变量在所有实例中的共享实例。


    ![](img/00075.jpeg)


    使用 static


    该功能允许导入类型的所有可访问静态成员，使其在随后的代码中无需限定符即可使用。这对于你拥有一组经常使用的特定领域的函数来说非常有用。`System.Math`
    就是其中的一个常见例子。它还允许你直接指定枚举类型的单个命名值，如上面的 `System.DayOfWeek` 成员。


    ![](img/00077.jpeg)


