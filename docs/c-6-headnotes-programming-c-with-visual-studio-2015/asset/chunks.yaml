    ### 12.3. 创建和抛出异常 (Creating and Throwing Exceptions)


    异常用于指示发生了错误。创建描述错误的异常对象，然后使用 `throw` 关键字抛出。


    ![](img/00097.jpeg)


    ### 12.4. 编译器生成的异常 (Compiler-Generated Exceptions)


    某些异常是由 .NET Framework 的公共语言运行时 (CLR) 在基本操作失败时自动抛出的。这些异常及其错误条件如下表所示：


    | 异常 |  |

    | :--- | :--- |

    | `ArithmeticException` | 算术运算期间发生异常的基类，例如 `DivideByZeroException` 和 `OverflowException`。
    |

    | `ArrayTypeMismatchException` | 当数组无法存储给定元素是因为元素的实际类型与数组的实际类型不兼容时抛出。 |

    | `DivideByZeroException` | 当尝试将整数除以零时抛出。 |

    | `IndexOutOfRangeException` | 当尝试索引数组时，索引小于零或超出数组边界时抛出。 |

    | `InvalidCastException` | 当运行时从基类型到接口或派生类型的显式转换失败时抛出。 |

    | `NullReferenceException` | 当你尝试引用值为空的对象时抛出。 |

    | `OutOfMemoryException` | 当使用 `new` 操作尝试分配内存失败时抛出。这表示公共语言运行时的可用内存已耗尽。 |

    | `OverflowException` | 在检查上下文中发生算术运算溢出时抛出。 |


