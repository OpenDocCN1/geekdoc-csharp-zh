    ## 12. 异常与异常处理 (Exceptions and Exception Handling)


    异常处理是在计算过程中响应异常异常——即需要特殊处理的异常或异常情况——的过程，通常使用 `try`、`catch` 和 `finally` 关键字来尝试可能不会成功的操作，从而改变程序的正常执行流。


    ### 12.1. 使用异常 (Using Exceptions)


    异常由派自 `System.Exception` 的类表示。该类识别异常类型并包含有关异常详细信息的属性。抛异常涉及创建一个异常派生类的实例，可选地配置异常的属性，然后使用
    `throw` 关键字抛出该对象。


    ![](img/00090.jpeg)


    抛出异常后，运行时会检查当前语句以确定是否在 `try` 块内。如果是，将检查与 `try` 块关联的所有 `catch` 块，查看它们是否可以捕获该异常。


    ![](img/00091.jpeg)


    一个 `try` 语句可以包含多个 `catch` 块。第一个可以处理异常的 `catch` 语句将被执行；后续兼容的 `catch` 语句将**忽略。


    ![](img/00092.jpeg)


    在执行 `catch` 块之前，运行时会检查 `finally` 块。`finally` 块允许程序员清理 `try` 块分配的任何资源。


    ![](img/00093.jpeg)


    ### 12.2. 异常处理 (Exception Handling)


    `try` 块被 C# 程序员用于划分受异常影响的代码。关联的 `catch` 块用于处理产生的异常。`try` 块需要一个或多个 `catch` 块，或者一个
    `finally` 块，或者两者都有。


    以下示例显示了 `try-catch` 语句：![](img/00094.jpeg)


    `try-finally` 语句：![](img/00095.jpeg)


