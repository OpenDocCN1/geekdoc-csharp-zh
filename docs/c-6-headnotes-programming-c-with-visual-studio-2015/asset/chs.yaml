- "# C# 6 技术指南：使用 Visual Studio 2015 编程 C#\n\n\n\n![](img/00228.jpeg)\n\n\n\n\n\n\n\
  \n\n## I. C# 入门\n\nC# 是一种优雅且类型安全的面向对象的语言，允许开发者构建运行在 .NET Framework 上的各种安全且健壮的应用程序。你可以使用\
  \ C# 创建 Windows 客户端应用程序、XML Web 服务、分布式组件、客户端/服务器应用程序、数据库应用程序等等更多内容。Visual C# 提供了高级代码编辑器、方便的用户界面设计器、集成调试器以及许多许多其他工具，使得基于\
  \ C# 语言和 .NET Framework 开发应用程序变得更容易。\n\n## 1. 我可以用 C# 做什么？\n\nC# 语法具有很强的表现力，但同时也简单易于学习。C#\
  \ 的大括号语法对于任何熟悉 C、C++ 或 Java 的人来说都是一目就能出的。熟悉其中任何一种语言的开发者通常能够在很短时间内开始在 C# 中进行高效工作。C#\
  \ 语法简化了 C++ 的许多复杂性，并提供了 Java 中不具备的强大功能，如可空值类型、枚举、委托、lambda 表达式和直接内存访问。C# 支持泛型方法和类型，这提供了更高的类型安全性和性能；还支持迭代器，它允许集合类的实现者定义自定义迭代行为，供客户端代码轻松使用。语言集成查询\
  \ (LINQ) 表达式让强类型查询成为一种一类语言结构。\n\n作为一种面向对象的语言，C# 支持封装、继承和多态的概念。所有的变量和方法（包括作为应用程序入口的\
  \ `Main` 方法）都封装在类定义中。一个类可以直接继承一个父类，但可以实现任意数量的接口。重写父类虚方法的方法需要 `override` 关键字以避免意外重新定义。在\
  \ C# 中，`struct` 类似于轻量级类；它是一种栈分配的类型，可以实现接口但不支持继承。\n\n除了这些基本的面向对象原则外，C# 还通过多种创新的语言结构轻松开发软件组件，包括：\n\
  \n*   称为 `delegates`（委托）的封装签名，实现了类型安全的事件通知。\n*   属性（Properties），作为私有成员变量的访问器。\n\
  *   特性（Attributes），提供了关于类型的运行时元数据。\n*   内联 XML 文档注释。\n*   语言集成查询 (LINQ)，提供了跨多种数据源的内置查询能力。\n\
  \n如果你必须与其他 Windows 软件（如 COM 对象或原生 Win32 DLL）交互，你可以在 C# 中通过名为“Interop”（互操作）的过程来实现。Interop\
  \ 允许 C# 程序几乎可以执行原生 C++ 应用程序的任何事情。对于直接内存访问至关重要的情况，C# 甚至支持指针和“unsafe”代码的概念。\n\n与 C\
  \ 和 C++ 相比，C# 的构建过程更简单且更灵活。没有单独的头文件，也不要求方法和类型按特定顺序声明。一个 C# 源文件可以定义任意数量的类、结构体、接口和事件。\n\
  \n以下是额外的 C# ：\n\n*   关于该语言良好的通用介绍，请参阅《C# 规范》第 1 章。\n*   有关 C# 语言特定方面的详细信息，请参阅 C#\
  \ 参考。\n*   有关 LINQ 的更多信息，请访问 LINQ（语言集成查询）。\n*   要查找 Visual C# 团队的最新文章和资源，请访问 Visual\
  \ C# 开发中心。\n\n## 2. 什么是 .NET？\n\nC# 程序运行在 .NET Framework 上，它是 Windows 的重要组成部分，包含一个名为通用语言运行时\
  \ (`CLR`) 的虚拟执行系统和一套统一的类库。`CLR` 是微软对国际标准通用语言基础 (`CLI`) 的商业实现。\n\n### 22.10. 将 RTF\
  \ 转换为纯文本\n\n## 23. 不安全代码与指针\n\n### 23.1. 固定大小缓冲区\n\n### 23.2. 指针类型\n\n## 24. XML\
  \ 文档注释\n\n### 24.1. 文档注释的推荐标签\n\n### 24.2. 处理 XML 文件\n\n### 24.3. 文档标签的分隔符\n\n##\
  \ III. 编码标准和命名规范\n\n### 1. 应当\n\n### 2. 不要\n\n### 3. 避免\n\n## II. 语言指南\n\n## 1.\
  \ 第一步\n\n### 1.1. 你的第一个程序\n\n我们将遵循新语言的传统，从第一个在屏幕上打印“Hello World!”字样的程序开始。在 C# 中，这可以通过一行代码实现：\n\
  \n```csharp\nConsole.WriteLine(\"Hello World!\");\n```\n\n我们的 `Main` 方法看起来应该是这样，按\
  \ F5 构建并运行程序：\n\n```csharp\nstatic void Main()\n{\n    Console.WriteLine(\"Hello\
  \ World!\");\n}\n```\n\n要插入 `Console.WriteLine();` 行，只需输入快捷键 `cw` 然后按两次 `TAB` 即可调用代码片段。\n\
  \n### 1.2. C# 编码规范\n\n作为 C# 编程语言最佳实践的一部分，为了让读者更快地理解代码，创建一致的外观并利于复制和修改代码，即使：\n\n\
  > 复制和粘贴是一种设计错误。 – David Parnas\n\n\n\n\n\n我们需要至少了解这些规范中的一些，才能编写出良好的代码。\n\n### 1.2.1.\
  \ 命名规范\n\n在简短的示例中，不使用指令的情况下，请使用命名空间限定。\n\n![](img/00004.jpeg)\n\n### 1.2.2. 注释规范\n\
  \n将注释放在单独的一行，而不是放在行尾。它应该以大写字母开头，每行开头有一个空格，并以句号结尾。\n\n![](img/00005.jpeg)\n\n## 2.\
  \ 常量与变量\n\n常量和变量将名称与特定类型的值关联起来。常量的值一旦设置就无法更改，而变量在将来可以被设置为不同的值。\n\n### 2.1. 声明常量和变量\n\
  \n常量和变量在使用之前必须声明。使用 `const` 关键字声明常量，使用 `var` 关键字声明匿名变量，使用 `dynamic` 关键字声明动态变量。\n\
  \n![](img/00006.jpeg)\n\n`var` 是静态类型，编译器和运行时都知其类型。\n\n![](img/00007.jpeg)\n\n`dynamic`\
  \ 是一个完全不同的物，它最像对象，但具有动态分发特性。\n\n![](img/00008.jpeg)\n\n## 3. 基本类型\n\n基本类型通过 `System`\
  \ 命名空间下预定义的关键字来标识。这些关键字被视为保留字。\n\n基本类型允许通过字面量创建值：\n\n![](img/00009.jpeg)\n\nC# 定义了以下基本类型：\n\
  \n| 结构体 / 类 | 数据类型 | 描述 | 范围 |\n| :--- | :--- | :--- | :--- |\n| `struct System.Byte`\
  \ | byte | 8 位无符号整数 | 0 .. 255 |\n| `struct System.SByte` | sbyte | 8 位符号整数 | -128\
  \ .. 127 |\n| `struct System.Int16` | short | 16 位符号整数 | -32,768 .. 32,767 |\n|\
  \ `struct System.UInt16` | ushort | 16 位无符号整数 | 0 .. 65,535 |\n| `struct System.Int32`\
  \ | int | 32 位符号整数 | -2,147,483,648 .. 2,147,483,647 |\n| `struct System.UInt32`\
  \ | uint | 32 位无符号整数 | 0 .. 4,294,967,295 |\n| `struct System.Int64` | long | 64\
  \ 位符号整数 | -9,223,372,036,854,775,808 .. 9,223,372,036,854,775,807 |\n| `struct System.UInt64`\
  \ | ulong | 64 位无符号整数 | 0 .. 18,446,744,073,709,551,615 |\n| `struct System.Single`\
  \ | float | 单精度浮点数 | -3.402823e38 .. 3.402823e38 |\n| `struct System.Double` | double\
  \ | 双精度浮点数 | -1.79769313486232 e308 .. 1.79769313486232 e308 |\n| `struct System.Decimal`\
  \ | decimal | 十进制数 | -79228162514264337593543950335 .. 79228162514264337593543950335\
  \ |\n| `struct System.Char` | char | 作为 UTF-16 编码单元的字符 | 一个 Unicode 字符。 |\n| `classSystem.String`\
  \ | string | 一系列 Unicode 字符组成的文本 | 一个 Unicode 字符组成的字符串。 |\n| `struct System.Boolean`\
  \ | bool | 布尔值 | 真或假。 |\n| `classSystem.Object` | object | 支持 .NET Framework 类层次结构中的所有类，并为派生类提供低级服务。\
  \ | 一个对象。 |\n\n### 3.1. 使用数学和逻辑运算符\n\n以下是基本数学运算符列表，按优先级顺序排列。使用括号强制执行其他顺序：\n\n| 运算符\
  \ | 用途 |\n| :--- | :--- |\n| `*`, `/`, `%` | 乘法、除法、取模 |\n| `+`, `-` | 加法、减法 |\n\
  | `&` | 逻辑与 |\n| `^` | 逻辑异异 |\n| `\\|` | 逻辑或 |\n\n![](img/00010.jpeg)\n\n使用预定义的类型名称而不是系统类型名称（如\
  \ `Int16`、`Single`、`UInt64` 等），这会让代码读起来更自然。\n\n![](img/00011.jpeg)\n\n浮点数谜题\n\n\
  ![](img/00012.jpeg)但始终记住，这不是 Bug —— 这是一个未说明的功能！\n\n![](img/00013.jpeg)\n\n## 4.\
  \ 决策\n\n你有能力根据将测试的条件改变应用程序的执行流。\n\n### 4.1. 使用 if 语句进行决策\n\n你可以根据将测试的条件改变执行流。如果条件满足，则执行\
  \ `if` 和 `else` 之间的代码。\n\n![](img/00014.jpeg)\n\n### 4.2. 使用 if-else 语句进行决策\n\n\
  你可以根据将测试的条件改变执行流。如果条件满足，则执行 `if` 和 `else` 之间的代码。\n\n![](img/015.jpeg)\n\n### 4.3.\
  \ 使用关系运算符\n\n这些运算符比较值：\n\n| 运算符 | 用途 |\n| :--- | :--- |\n| `==` | 检查相等 |\n| `!=`\
  \ | 检查不相等 |\n| `>` | 大于 |\n| `<` | 小于 |\n| `>=` | 大于等于 |\n| `<=` | 小于等于 |\n\n!((images/00016.jpeg)\n\
  \n### 4.4. 使用逻辑运算符\n\n逻辑运算符用于评估条件：\n\n| 运算符 | 用途 |\n| :--- | :--- |\n| `&&` | 逻辑与\
  \ |\n| `||` | 逻辑或 |\n| `!` | 逻辑非 |\n\n#### 4.4.1. 使用与运算符\n\n`&&` 运算符是条件的短路评估。\n\n\
  ![](img/00017.jpeg)\n\n#### 4.4.2. 使用或运算符\n\n`||` 运算符是条件的短路评估。\n\n![](img/00018.jpeg)\n\
  \n#### 4.4.3. 使用非运算符\n\n它是一个取反的一元运算符。\n\n![](img/00019.jpeg)\n\n### 4.5. 使用 switch\
  \ 语句进行决策\n\nswitch 语句用于根据给定表达式的值执行多个操作。如果条件满足，则执行 `case` 和 `break` 关键字之间的代码。要从一个\
  \ case 到另一个 case 使用 `goto`。\n\n![](img/00020.jpeg)\n\n#### 4.5.1. 在 switch 语句中使用枚举\n\
  \nswitch 可以作用于枚举值。枚举 switch 有会产生更的代码。有时更快。\n\n![](img/00021.jpeg)\n\n### 4.6. 增和和减运算符\n\
  \nC# 中有不同的快捷方式，允许你以后置和前置的形式增加或减少变量的值。\n\n| 运算符 | 用途 |\n| :--- | :--- |\n| `v++`\
  \ | 变量 v 增加 1 |\n| `v--` | 变量 v 减少 1 |\n| `v+=n` | 变量 v 增加 n |\n| `v-=n` | 从变量 v\
  \ 减去 n |\n| `v*=n` | 变量 v 乘以 n |\n\n\n\n\n\n你也可以用元素初始化数组，在这种情况下，你不需要指定数组的大小。\n\n\
  ![](img/00028.jpeg)\n\n### 5.3. 多维数组\n\n如果需要声明一个 n 维的多维数组。\n\n![](img/00029.jpeg)\n\
  \n你仍然可以使用值初始化多维数组。\n\n![](img/00030.jpeg)\n\n### 5.4. 锯齿数组 (Jagged Arrays)\n\n锯齿数组是“数组的数组”，意味着数组的元素本身也是数组。在这种情况下，对于多维数组，如果我们认为主数组是行，那么每一行可以有不同的列大小。\n\
  \n![](img/00031.jpeg)\n\n### 5.5. 将数组作为参数\n\n你可以将单维数组或多维数组作为方法的参数进行传递。\n\n![](img/00032.jpeg)\n\
  \n#### 5.5.1. 将数组作为参数传递\n\n如果你想传递方法参数时不关心它接收多少个参数，可以使用 `params` 关键字。它是作为参数数组传递的，在调用方法时不需要声明数组，它由\
  \ C# 编译器隐式创建。\n\n![](img/00033.jpeg)\n![](img/00034.jpeg)\n\n#### 索引初始化器 (Index\
  \ initializers)\n\n对象和集合初始化器用于声明式地初始化对象的字段和属性，或者为集合提供一组初始元素。使用索引器初始化字典和其他对象显得不够优雅。\n\
  \n![](img/00035.jpeg)\n\n## 6. 循环\n\n循环是一组语句，会按照指定的次数重复，或者直到满足逻辑条件。\n\n### 6.1.\
  \ 使用 for 循环\n\nfor 循环允许代码重复执行。与其它类型的循环不同，for 循环的特点是具有显式的循环计数器。\n\n![](img/00036.jpeg)\n\
  \n### 6.2. 使用 foreach 循环\n\nforeach 循环提供了遍历集合中各项项的可能性。与 for 循环不同，foreach 循环通常不维护显式的计数器。这里展示了如何使用\
  \ foreach 循环创建相同的循环：\n\n![](img/00037.jpeg)\n\n### 使用 while 循环\n\n![](img/00038.jpeg)\n\
  \nwhile 循环允许根据给定的布尔条件重复执行代码。\n\n![](img/00039.jpeg)\n\n### 6.3. 使用 do-while 循环\n\
  \n![](img/00040.jpeg)\n\ndo-while 循环至少执行一次代码。然后根据给定的条件重复继续执行代码或停止。\n\n![](img/00041.jpeg)\n\
  \n## 7. 类与结构体 (Classes and Structs)\n\n类和结构体是两种可扩展的程序代码模板，即蓝图，用于创建对象；为状态提供初始值并实现行为。\n\
  \n有四个主要原则使一种语言成为面向对象：封装、数据抽象、多态和继承。这些原则将在稍后通过示例进行讨论。\n\n### 7.1. 类\n\n可以使用 `class`\
  \ 关键字声明类。所有类都继承自 `System.Object`，因此类是引用类型。\n\n![](img/00042.jpeg)\n\n### 7.2. 结构体\n\
  \n可以使用 `struct` 关键字声明结构体。所有结构体都继承自 `System.ValueType`，而 `System.ValueType` 又继承自\
  \ `System.Object`，因此结构体是值类型。\n\n![](img/00043.jpeg)\n\n使用 `Struct` 时：\n\n- 非常量或非静态字段不能初始化。\n\
  - 不能声明默认构造函数（无参数）或析构函数。但我们可以声明带有参数的构造函数。\n- 可以不使用 `new` 关键字即可实例化。\n- 可以实现接口。\n-\
  \ 可以继承其他结构体或类，但不能作为类的基类。\n-与其他值类型不同，它可以作为可空类型 (Nullable type)。\n\n### 7.3. 对象\n\n\
  对象是类或结构体的实例。对于类，它们通过使用 `new` 运算符创建。对于结构体，可以使用 `new` 运算符创建，但不是强制的。\n\n![](img/00044.jpeg)\n\
  \n### 7.4. 成员\n\n#### 7.4.1. 字段 (Fields)\n\n字段是在类作用域内定义的变量。字段可以是内置数值类型，也可以另一个类的实例。\n\
  \n![](img/00045.jpeg)\n\n#### 7.4.2. 常量 (Constants)\n\n常量是在编译时设置值且无法更改的字段或属性。\n\n\
  ![](img/00046.jpeg)\n\n#### 7.4.3. 属性 (Properties)\n\n属性是类上的方法，访问方式就像该类上的字段一样。属性可以为类字段提供保护，防止其在对象不知情的情况下被更改。\n\
  \n![](img/00047.jpeg)\n![](img/00048.jpeg)\n\n#### 自动属性的初始化器 (Initializers for auto-properties)\n\
  \n你现在可以自动属性添加初始化器，就像在字段中这样做一样。\n\n![](img/00049.jpeg)\n\n初始化器直接初始化底层字段（backing field）；它不通过自动属性的\
  \ setter 工作。初始化器按照编写顺序执行，与字段初始化器的执行顺序相同且一同执行。\n\n![](img/00048.jpeg)\n\n#### 仅 getter\
  \ 的自动属性 (Getter-only auto-properties)\n\n自动属性现在可以在不带 setter 的情况下声明。\n\n![](img/00050.jpeg)\n\
  \nforeach 通常不维护显式计数器。![](img/00051.jpeg)\n\nimages/00052.jpeg)\n\n\n\n\n\n### 7.4.6.8.\
  \ 逻辑、条件与空运算符\n\n| 表达式 | 目的 |\n| :--- | :--- |\n| `x & y` | 整数按位与，布尔逻辑与 |\n| `x ^\
  \ y` | 整数按位异异，布尔逻辑异异 |\n| `x \\| y` | 整数按位或，布尔逻辑或 |\n| `x && y` | 仅当 `x` 为真时评估 `y`\
  \ |\n| `x \\| y` | 仅当 `x` 为假时评估 `y` |\n| `x ?? y` | 如果 `x` 为空则结果为 `y`，否则为 `x` |\n\
  | `x ?: y : z` | 如果 `x` 为真则结果为 `y`，如果 `x` 为假则结果为 `z` |\n\n![](img/00034.jpeg) 空条件运算符\n\
  \n有时代码往往深陷在空检查中。空条件运算符允许仅在接收者不为空时访问成员和元素，否则提供空结果。\n\n![](img/00053.jpeg)\n\n空条件运算符通常与空合并运算符\
