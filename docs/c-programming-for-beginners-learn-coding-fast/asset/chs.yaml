  \ var in arr)` 在数组 `arr` 的每个元素上执行代码块，并将所有元素值赋给变量 `var`。\n\n# 第 5 章：函数与异常\n\n## 函数\n\
  函数是一个可以重复运行多次的代码块。要定义一个函数，请使用 `type functionName() { }`。\n\n`| type functionName()\
  \ {……} |`\n\n要调用函数，请使用 `functionName();`\n`| functionName (); |`\n\n### 示例 5.1\n\
  ```csharp\nusing System;\nnamespace functionExample{\nclass Program{\n    static\
  \ void myFunction() {\n        // function declaration\n        Console. Write(\"\
  This is a function example. \");\n        Console. ReadLine();\n    }\n    static\
  \ void Main(string[] args){\n        myFunction(); // call function\n    }\n}}\n\
  ```\n输出：`This is a function example.`\n\n#### 解析\n`myFunction() { }` 是函数的声明。`myFunction();`\
  \ 调用函数 `myFunction() { }`。`static method`（静态方法）称为类方法，可以直接通过类访问。`static variable`（静态变量）称为类变量，可以直接通过类访问。\n\
  \n关于 `class`，后续章节将详细介绍。`void` 是一种返回类型。函数执行后将返回带有数据类型的结果，如 `int`、`string`、`bool`、`void`。`void`\
  \ 表示没有返回数据类型。\n\n### 带参数的函数\n括号内可以包含一个或多个参数。参数用于向函数传递数据，使用 `type functionName(type\
  \ arg) { }`。\n\n`| type functionName ( type arg ) {……} |`\n\n要调用函数，使用 `functionName(argument);`\n\
  `| functionName (argument ); |`\n\n### 示例 5.2\n```csharp\nusing System;\nnamespace\
  \ functionExample{\nclass Program{\n    static void myFunction(string arg ){\n \
  \       // function declaration\n        Console. Write(arg );\n        Console.\
  \ ReadLine();\n    }\n    static void Main(string[] args){\n        String str =\
  \ \"A function argument.\";\n        myFunction(str);\n    }\n}}\n```\n输出：`A function\
  \ argument.`\n\n#### 解析\n`myFunction(string arg){` 是函数声明。`myFunction(str);` 调用该函数。\n\
  \n### 返回值\n`return` 可以向调用者返回一个值。\n`| type functionName ( type arg ) {…… |`\n\n要调用函数，使用\
  \ `functionName(argument);`\n\n### 示例 5.3\n```csharp\nusing System;\nnamespace functionExample{\n\
  class Program{\n    static int add(int a, int b){\n        return a + b;\n    }\n\
  \    static void Main(string[] args){\n        int result = add(5, 10);\n      \
  \  Console. WriteLine(\"Result: \" + result);\n    }\n}}\n```\n输出：`Result: 15`\n\
  \n#### 解析\n`add(int a, int b)` 返回 `a` 和 `b` 的和。`result` 存储返回的值。\n\n## 异常\nC# 程序可能会出现某些错误，如下：\n\
  - `Arithmetic Exception`（算术异常）\n- `Array Mismatch Exception`（数组不匹配异常）\n- `Divided\
  \ By Zero Exception`（除零异常）\n- `Index Out of Range Exception`（越界异常）\n- `Invalid Cast\
  \ Exception`（无效转换异常）\n- `Null Reference Exception`（空引用异常）\n- `Out of Memory Exception`（内存不足异常）\n\
  - `Overflow Exception`（溢出异常）\n- `Type Initialization Exception`（类型初始化异常）\n\n###\
  \ TryCatch\n`| try{ …}catch(exception ex){……} |`\n\n当发生异常错误时，`try {…}` 将异常抛出到 `catch(\
  \ ) { }` 块。`catch( ){ }` 捕获 `try` 块中的任何异常并进行处理。`ex` 是异常对象。\n\n`| exceptionObject.\
  \ Message |`\n`exceptionObject.Message` 显示异常消息。\n\n### 示例 5.4\n```csharp\nusing\
  \ System;\nnamespace trycatch{\nclass Program{\n    static void Main(string[] args){\n\
  \        int a, b = 0;\n        try {\n            a = 100 / b;\n        } catch\
  \ (Exception ex){\n            Console. WriteLine(ex.Message ); // exception message\n\
  \        }\n        Console. ReadLine();\n    }\n}}\n```\n输出：`Attempted to divide\
  \ by zero.`\n\n#### 解析\n在 `try{ }` 块中，`a = 100 / b;` 导致异常。`catch(Exception ex){}`\
  \ 捕获该异常。`ex` 是异常对象。`ex.message` 显示消息。\n\n### TryCatchFinally\n`| try{…}catch(exception\
  \ ex){ …… }finally{ must-execute-code} |`\n\n`finally` 块包含必须执行的代码。\n\n### 示例 5.5\n\
  ```csharp\nusing System;\nnamespace trycatch{\nclass Program{\n    static void Main(string[]\
  \ args){\n        try {\n            string str1 = \"Java in 8 Hours\";\n      \
  \      string str2 = str1.Insert(100, \"Script\"); // 100 causes exception\n   \
  \     } catch (Exception ex){\n            Console. WriteLine(ex. Message);\n  \
  \      } finally {\n            // must execute\n            Console. WriteLine(\"\
  Exception has been handled! \");\n        }\n        Console. ReadLine();\n    }\n\
  }}\n```\n输出：`Index was out of range……Parameter name: startIndex.Exception has been\
  \ handled!`\n\n#### 解析\n`str1.Insert(100, \"Script\");` 导致异常，因为 `str1` 的长度小于 100\
  \ 个字符。`catch(exception ex)` 可以捕获异常。注意其参数是 `exception ex`，`ex` 是异常对象。`ex.message`\
  \ 显示异常消息。无论是否捕获到异常，`finally` 块都会执行。\n\n# 抛出异常\n`| try{ throw new exception(); }catch{……}\
  \ |`\n\n\n\n\n\n`throw new exception();` 可以为当前代码抛出异常。\n\n### 示例 5.7\n```csharp\n\
  using System;\nnamespace trycatch{\n    class Program{\n        static void Main(string[]\
  \ args){\n            try{\n                int a, b = 0;\n                if (b\
  \ == 0){\n                    throw new Exception (\"b is zero, Exception occurred!\
  \ \");\n                    // 抛出一个异常对象\n                }\n                a =\
  \ 100 / b;\n            }\n            catch (Exception ex){\n                //\
  \ 处理异常\n                Console.WriteLine(ex.Message); // 异常消息\n               \
  \ Console.ReadLine();\n            }\n        }\n    }\n}\n```\n输出：`b is zero, Exception\
  \ occurred!`\n解释：`throw new exception();` 为当前代码抛异常。如果 `b` 等于零，`a/b` 将报错。发生了异常！\n\
  \n## 列表 A\n`List` 是一个可以根据需要更改的动态数组。`List` 中的元素可以添加、插入、计数和清空。\n创建列表的语法如下：\n\n| `List<int>\
  \ MyList = new List<int>(0, 1, 2,…);` |\n\n访问列表的语法如下：\n\n| `MyList[0];MyList[1];MyList[2];……`\
  \ |\n\n### 示例 5.8\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
  namespace ListDemo{\n    class Program{\n        static void Main(string[] args){\n\
  \            List<int> MyList = new List<int>{10,11,12,13}; // 创建列表\n          \
  \  Console.Write(MyList[0] +\"  \");\n            Console.Write(MyList[1] +\"  \"\
  );\n            Console.Write(MyList[2] +\"  \");\n            Console.Write(MyList[3]\
  \ +\"  \");\n            Console.ReadLine();\n        }\n    }\n}\n```\n输出：`10 \
  \ 11  12  13`\n解释：`List<int> MyList = new List<int>{10,11,12,13};` 创建了一个包含四个项的列表。`MyList[0]`\
  \ 访问第 0 个元素。`MyList[1]` 访问第 1 个元素。`MyList[2]` 访问第 2 个元素。\n注意：`List` 的索引从零开始。\n\n\
  ## 访问列表元素\n访问 `List`元素的语法如下：\n\n| `foreach (var elements in MyList) {}` |\n\n例如：\n\
  ```csharp\nusing System;\nusing System.Collections.Generic;\nnamespace ListDemo{\n\
  \    class Program{\n        static void Main(string[] args){\n            List<int>\
  \ MyList = new List<int> { 10, 11, 12, 13 };\n            foreach (var elements\
  \ in MyList) {\n                // 访问所有元素\n                Console.Write(elements\
  \ + \" \");\n            }\n            Console.ReadLine();\n        }\n    }\n\
  }\n```\n输出：`10 11 12 13`\n解释：`foreach (var elements in MyList){ }` 访问 `MyList` 中的所有元素，并将所有值赋给变量\
  \ `elements`。\n\n## 列表方法\n| `Add()` | // 添加元素 |\n| `Insert()` | // 插入元素 |\n| `Reverse()`\
  \ | // 反转元素顺序 |\n| `Remove()` | // 移除一个元素 |\n| `Clear()` | // 清空所有元素 |\n| `IndexOf()`\
  \ | // 返回元素的索引 |\n| `Count` | // 返回元素数量 |\n\n### 示例 5.9\n```csharp\nusing System;\n\
  using System.Collections.Generic;\nnamespace ListDemo{\n    class Program{\n   \
  \     static void Main(string[] args){\n            List<int> MyList = new List<int>{10,11,12,13};\n\
  \            MyList.Add(14); // 现在变为 {10,11,12,13,14}\n            MyList.Insert(3,100);\
  \ // 现在变为 {10,11,12,100,13,14}\n            MyList.IndexOf(100); // 返回索引 3\n   \
  \         MyList.Reverse(); // 现在变为 {14,13,100,12,11,10}\n            MyList.Remove(100);\
  \ // 现在变为 {14,13,12,11,10}\n            Console.Write(MyList.Count); // 现在有五个元素\n\
  \            Console.ReadLine();\n        }\n    }\n}\n```\n输出：`5`\n解释：\n| `Add()`\
  \ | // 添加元素 |\n| `Insert()` | // 插入元素 |\n| `Reverse()` | // 反转元素顺序 |\n| `Remove()`\
  \ | // 移除一个元素 |\n| `Clear()` | // 清空所有元素 |\n| `IndexOf()` | // 返回元素的索引 |\n| `Count`\
  \ | // 返回元素数量 |\n\n### 总结\n函数是一个可以重复运行的代码块。要定义函数，请使用 `type functionName ( ) { }`。\n\
  要调用函数，请使用 `functionName ( );`。\n函数括号内可以有一个有一个或多个参数。参数用于将数据传递给函数，使用 `type functionName\
  \ (type arg) { }`。\n要调用函数，使用 `functionName (argument);`。\n`return` 可以向值返回给调用者。\n\
  `try {… …}` 在发生异常错误时会将异常抛出到 `catch( ) { }` 块。\n`catch( ){  }` 捕获 `try` 块中的任何异常并处理它。\n\
  `exception.Message` 显示异常消息。\n`finally` 块包含必须执行的代码。\n`throw new exception();` 可以为当前代码抛出异常。\n\
  `List` 是一个可以根据需要更改的动态数组。\n\n### 练习：发生错误！异常 示例\n请打开 Visual C#，点击文件 > 新项目 > 控制台应用程序。输入文件名\
  \ `TryAndCatch`。\n在编辑器中编写 C# 代码：\n```csharp\nusing System;\nnamespace TryAndCatch{\n\
  \    class Program{\n        static void Main(string[] args){\n            try{\n\
  \                // 可能会发生异常\n                int[] myArr = {0,1,2,3};\n        \
  \        myArr[4] = 4; // 发生异常\n            }\n            catch (Exception ex){\n\
  \                // 处理异常\n                Console.WriteLine(ex.Message); // 异常消息\n\
  \                Console.ReadLine();\n            }\n        }\n    }\n}\n```\n\
  保存文件，点击“开始调试”运行程序。\n输出：`Index was outside the bounds of array.`\n解释：数组的索引从零开始。`myArr\
  \ = {0,1,2,3};` 有四个元素，最后一个元素的索引是 3。`myArr[4]` 访问的是一个不存在的元素。`ex.Message` 显示异常消息。\n\
  \n# 第 6 章\n## 类与对象\n\n### 类声明\n类是相关对象的类别。`Class` 是一种类型。例如，如果 `Car` 是一个类，那么卡车、面包车、巴士、出租车和客车都是对象。\n\
  \n| `public class ClassName{ // 声明一个类;成员; }` |\n\n- `public` 是访问修饰符。\n- `class`\
  \ 是声明类的关键字。\n- `member` 是一些方法、属性和常量……\n在类中，函数被称为 `method`（方法），变量被称为 `property`（属性）。\n\
  \n### 示例 6.1\n```csharp\npublic class Color{\n   // 声明一个类“Color”\n   public string\
  \ c1; // 属性成员\n   public string c2; // 属性成员\n   public void brightness( ){ // 方法成员\n\
  \   Console.Write(\"……\");\n   }\n}\n```\n\n### 对象声明\n对象是类的实例。\n\n| `obj = new ClassName(\
  \ ); // 创建一个对象 obj.variable;obj.method( );` |\n\n- `obj = new ClassName( );` 为该类创建一个名为\
  \ `obj` 的新对象。\n- `obj.variable` 意味着 `obj` 引用一个变量。\n- `obj.method( );` 意味着 `obj`\
  \ 引用一个方法。\n\n### 示例 6.2\n```csharp\nColor obj = new Color( ); // 创建一个对象“obj”\nobj.c1=\
  \ \"yellow\"; // 对象引用变量\nobj.c2=\"purple\"; // 对象引用变量\nobj.brightness ( ); // 对象引用方法\n\
  ```\n解释：`Color obj = new Color;` 创建了一个名为 `obj` 的对象。`obj.c1` 意味着 `obj` 引用变量 `c1`。`obj.c2`\
  \ 意味着 `obj` 引用变量 `c2`。`obj.brightness ( );` 调用对象的方法 `brightness( ){ }`。\n\n### 类与对象示例\n\
  ```csharp\nusing System;\nnamespace ClassAndObject{\n    class Program{\n      \
  \  public class Color {\n           // 声明一个类“Color”\n           public string c1;\
  \ // 属性成员\n           public string c2; // 属性成员\n           public void brightness(\
  \ ){ // 方法成员\n           Console.WriteLine(\"The color of this flower is \"+ c1);\n\
  \           Console.WriteLine(\"The color of that flower is \"+ c2);\n         \
  \  Console.ReadLine();\n        }\n        static void Main(string[] args){\n  \
  \          Color obj = new Color( ); // 创建一个对象“obj”\n            obj.c1=\"yellow\"\
  ; // 对象引用变量\n            obj.c2=\"purple\"; // 对象引用变量\n            obj.brightness\
  \ ( ); // 对象引用方法\n        }\n    }\n}\n```\n输出：\n`The color of this flower is yellow`\n\
  `The color of that flower is purple`\n\n# 构造函数\n构造函数用于初始化变量。构造函数的名称与类名相同。\n\n| `class\
  \ ClassName{ClassName( ) { …} //这是一个构造函数}` ` |\n\n\n\n\n\n`ClassName{ …}` 定义一个类。`ClassName(\
  \ ) { …}` 声明一个构造函数。每当创建一个对象时，构造函数都会被自动调用。\n\n### 示例 6.3\n```csharp\npublic class\
  \ Color {\n    String c1, c2;\n    Color ( ) {\n        c1=\"yellow\";\n       \
  \ c2=\"purple\";\n    } // constructor\n}\n```\n解释：`Color ( ) { c1=\"yellow\"; c2=\"\
  purple\"; }` 是一个构造函数。它将变量 `c1` 初始化为“yellow”，将 `c2` 初始化为“purple”。在创建对象时会调用构造函数。\n\
  \n### 构造函数示例\n示例：\n```csharp\nusing System;\nnamespace ClassAndObject{\n    class\
  \ Program{\n        public class Color{\n            // 声明类“Color”\n           \
  \ public string c1;\n            // 属性成员\n            public string c2;\n      \
  \      // 属性成员\n            public Color( ){\n                c1=\"yellow\";\n \
  \               c2=\"purple\";\n            } // 构造函数\n            public void brightness(){\n\
  \                // 方法成员\n                Console.WriteLine(\"The color of this\
  \ flower is \" + c1);\n                Console.WriteLine(\"The color of that flower\
  \ is \" + c2);\n                Console.ReadLine();\n            }\n        }\n\
  \        static void Main(string[] args){\n            Color obj = new Color();\
  \ // 创建对象“obj”，调用构造函数\n            obj.brightness(); // 对象引用方法\n        }\n    }\n\
  }\n```\n输出：\n```\nThe color of this flower is yellow\nThe color of that flower is\
  \ purple\n```\n\n### 析构函数\n`Destructor` 用于释放内存占用，清理构造函数的数据。\n\n| ~ destructor( );\
  \ |\n\n析构函数的名称与类名相同，但前面带有一个 `~` 符号。析构函数没有任何参数，也没有返回值。\n\n### 示例 6.4\n```csharp\n\
  public class Color { \n    // 定义一个类\n    String c1, c2;\n    Color ( ) {\n     \
  \   c1=\"yellow\";\n        c2=\"purple\";\n    } // 构造函数\n    ~ Color ( ); // 这是一个析构函数。\n\
  }\n```\n解释：`~ Color ( );` 是一个析构函数，用于释放内存。析构函数的声明始终跟随构造函数之后。\n\n### 重载\n重载意味着类中存在两个或多个同名方法，但它们的参数不同。\n\
  \n### 示例 6.5\n```csharp\nusing System;\nnamespace Overloading{\n    class Color\
  \ {\n        // 声明类“Color”\n        String x, y; // 声明两个变量成员\n        Color( String\
  \ a, String b) { x = a; y = b; } // 构造函数\n        Color() { x = \"yellow \"; y =\
  \ \"purple \"; } // 构造函数\n        static void Main(string[] args){\n           \
  \ Color obj1 =new Color(\"green \", \"orange \");\n            Color obj2 = new\
  \ Color();\n            Console.WriteLine(obj1. x + obj1. y);\n            Console.WriteLine(obj2.\
  \ x + obj2. y);\n            Console.ReadLine();\n        }\n    }\n}\n```\n输出：\n\
  ```\ngreen  orange\nyellow  purple\n```\n解释：`class Color` 创建一个对象 `Color`。`Color(\
  \ String a, String b){}` 定义了一个带参数的构造函数。`Color(){}` 定义了一个不带参数的构造函数。在此类中，有两个名为 `Color(\
  \ )` 但参数不同的方法，这被称为“重载”。`Color obj1 =new Color(\"green \", \"orange \");` 创建了对象 `obj1`，调用构造函数\
  \ `Color(…){}` 并向构造函数传递了两个参数。`Color obj2 =new Color();` 创建了对象 `obj2` 并调用了构造函数 `Color(){}`。`object\
  \ property` 意味着对象引用了一个变量。\n\n### `this` 关键字\n`this` 用于表示当前对象。\n\n### 示例 6.6\n```csharp\n\
  using System;\nnamespace thisExample{\n    class MyClass{\n        int num;\n  \
  \      void test(int num){\n            this.num = num; // this 代表当前对象\n       \
  \     Console.Write(this.num);\n        }\n        static void Main(string[] args){\n\
  \            MyClass obj = new MyClass(); // 创建对象“obj”\n            obj.test(10);\n\
  \            Console.ReadLine();\n        }\n    }\n}\n```\n输出：\n```\n10\n```\n\
  解释：在上方，当 `obj.test(10)` 调用 `test( ){ }` 方法时，`this` 代表对象 `obj`。\n\n# 继承\n类可以被其派生类继承。派生类中的对象可以被基类中的对象。派生类按如下方式继承基类：\n\
  \n| 派生类: 基类 |\n\n`:` 是继承的符号。\n\n### 示例 6.7\n```csharp\nclass Computer { \n    //\
  \ 这是一个基类\n    // 基类成员\n    ...\n}\nclass Laptop: public Computer { \n    // 继承\n\
  \    // 派生类成员\n    ...\n}\n```\n解释：`Laptop` 是派生类，`Computer` 是基类。`Laptop` 类继承了 `Computer`\
  \ 类。派生类继承基类中所有的公共成员。\n\n### 使用派生类\n派生类的对象可以访问基类的公共成员。\n\n### 示例 6.8\n```csharp\n\
  using System;\nnamespace inheritance{\n    public class program{\n        class\
  \ Computer {\n            // 声明基类\n            public void display(){\n        \
  \        Console.WriteLine(\"Computer\");\n                Console.ReadLine();\n\
  \            }\n        }\n        class Laptop : Computer {\n            // 继承\n\
  \            public void display(){\n                Console.WriteLine(\"Laptop\"\
  );\n                Console.ReadLine();\n            }\n        }\n        static\
  \ void Main(string[] args){\n            Laptop obj = new Laptop(); // 创建对象“obj”\n\
  \            obj.display(); // 对象引用方法\n        }\n    }\n}\n```\n输出：\n```\nLaptop\n\
  ```\n解释：`Lt.display()` 意味着派生类对象 `Lt` 访问了基类方法。Computer OK!\n\n### 重写\n派生类可以重写基类的方法，前提是方法名和参数均相同。\n\
  \n### 示例 6.9\n```csharp\nusing System;\nnamespace Overriding{\n    class Program{\n\
  \        class Computer {\n            // 基类\n            public void harddrive(){\
  \ Console.WriteLine(\"5T\"); }\n            public void memory() { Console.WriteLine(\"\
  4G\"); Console.ReadLine(); }\n        }\n        class Laptop: Computer {\n    \
  \        // 派生类\n            public void harddrive(){ Console.WriteLine(\"10T\"\
  ); }\n            public void memory() { Console.WriteLine(\"8G\"); Console.ReadLine();\
  \ }\n        }\n        static void Main(string[] args){\n            Laptop myLaptop\
  \ = new Laptop(); // 创建对象“myLaptop”\n            myLaptop.harddrive();\n       \
  \     myLaptop.memory();\n        }\n    }\n}\n```\n输出：\n```\n10T\n8G\n```\n解释：基类中的\
  \ `harddrive( )` 和 `memory( )` 与派生类中的相同。因此，派生类的方法可以重写基类的方法。`myLaptop.harddrive(\
  \ );` 调用了派生类的方法，输出为 `10T`。`myLaptop.memory( );` 调用了派生类的方法，输出为 `8G`。\n\n### Sealed\
  \ 关键字\n`sealed` 关键字用于禁止基类的继承。`sealed` 关键字还可以防止重写基类中的方法。\n\n示例 (1)\n```csharp\nsealed\
  \ class MyClass{\n    ...\n}\n```\n`sealed` 禁止了对 `MyClass` 的继承，因此 `MyClass` 不能有派生类。\
  \ (2)\n```csharp\nsealed public void myMethod(){\n    ...\n}\n```\n`sealed` 禁止了重写\
  \ `myMethod`，因此 `myMethod` 无法被重写。\n\n### 总结\n| public class ClassName;{\n    //\
  \ 声明类\n    // 成员\n} |\n\n| obj = new ClassName(); // 创建对象\nobj.variable; // 对象引用变量\n\
  obj.method(); // 对象引用方法 |\n\n| class ClassName{\n    ClassName( ) { ... } // 这是一个构造函数\n\
  } |\n\n| ~ destructor( ); // 这是一个析构函数 |\n\n\n\n\n\n重载（Overloading）意味着类中存在两个或多个同名的方法，它们的参数不同。`this`\
  \ 用于表示当前对象。重写（Overriding）意味着派生类可以覆盖基类的方法，前提是方法名和参数相同。继承（Inheritance）：类可以被其派生类继承。派生类对象可以被视为基类对象。派生类的对象可以访问基类的公共成员。`sealed`\
  \ 关键字用于禁止继承基类。此外 `sealed` 关键字也可以防止重写基类中的方法。\n\n## 练习：狗与猫\n\n## 类与对象\n请打开 Visual\
  \ C#, 点击 `File > New Project > Console Application`。输入文件名 `ClassAndObject`。在编辑器中编写\
  \ C# 代码：\n\n```csharp\nusing System;\nnamespace Overloading{\nclass Animal {\n \
  \ // declare a class \"Animal\"\n  String dog, cat;\n  // declare two variable members\n\
  Animal() {dog = \"black. \"; cat = \"white. \";}  // constructor\nstatic void Main(string[]\
  \ args){\nAnimal pet = new Animal();    // create an object “pet”\nConsole. WriteLine(\"\
  This dog's color is \" + pet. dog);\nConsole. WriteLine(\"This cat's color is \"\
  \ + pet. cat);\nConsole. ReadLine();\n}}}\n```\n\n保存文件，点击 `Start Debugging` 运行程序。\n\
  \n**输出：**\nThis dog’s color is black.\nThis cat’s color is white.\n\n**解释：**\n`class\
  \ Animal` 声明了一个类 `Animal`。`Animal() {…}` 定义了一个构造函数。构造函数的名称始终与类名相同。`Animal pet =\
  \ new Animal();` 创建了一个对象 `pet`，并自动调用构造方法。`pet. dog` 意味着 `pet` 的 `dog`，对象 `pet` 引用了变量\
  \ `dog`。`pet. cat` 意味着 `pet` 的 `cat`，对象 `pet` 引用了变量 `cat`。\n\n# 第 7 章：访问修饰符\n\n\
  ### 公共 (Public)\n`public` 访问修饰符用于类型和类型成员。它具有最高权限访问级别。访问公共类型或类型成员没有任何限制。\n\n**示例\
  \ 7.1**\n```csharp\nusing System;\nnamespace PublicModifier{\nclass PublicDemo{\n\
  public int a;  // declare a public variable\npublic int b;  // declare a public\
  \ variable\n}\nclass Program{\nstatic void Main(string[] args){\nPublicDemo obj\
  \ = new PublicDemo();\nobj. a = 100;  // access the public member\nobj. b = 200;\
  \  // access the public member\nConsole. WriteLine(\"a=\" + obj. a);\nConsole. WriteLine(\"\
  b=\" + obj. b);\nConsole. ReadLine();\n}}}\n```\n**输出：**\na = 100\nb = 200\n\n**解释：**\n\
  `public int a;` 和 `public int b;` 声明了两个公共变量，任何对象都可以访问它们。`obj. a = 100;` 和 `obj.\
  \ b = 200;` 访问另一个类中的两个公共变量 `a` 和 `b`。\n\n### 私有 (Private)\n`private` 访问修饰符用于类型和类型成员。它具有最低权限访问级别。私有成员只能在定义的类体内被访问。类\
  \ `A` 中的私有成员无法从类 `B` 访问。在定义它的类外部引用私有成员将报错。\n\n**示例 7.2**\n```csharp\nusing System;\n\
  namespace PrivateModifier{\nclass privateDemo{\nprivate int a;     // declare a\
  \ private variable\nprivate int b;     // declare a private variable\n}\nclass Program{\n\
  static void Main(string[] args){\nprivateDemo obj = new privateDemo();\nobj.a =\
  \ 100;      // access the private member, error !\nobj.b = 200;      // access the\
  \ private member, error !\nConsole. WriteLine(\"a=\" + obj. a);\nConsole. WriteLine(\"\
  b=\" + obj. b);\nConsole. ReadLine();\n}}}\n```\n**输出：**\nError!\n`a` is inaccessible\
  \ due to its protection level.\n`b` is inaccessible due to its protection level.\n\
  \n**解释：**\n编译失败！`a` & `b` 是两个私有变量，不能在当前类之外访问。私有成员只能被同类中的代码访问。\n\n**注意：** 下面的示例是一个成功访问私有成员的程序。\n\
  \n**示例 7.3**\n```csharp\nusing System;\nnamespace PrivateModifier{\nclass PrivateDemo{\n\
  private int a = 100;  // declare a private variable\nprivate int b = 200;  // declare\
  \ a private variable\npublic void accessVariable(){\nConsole. WriteLine(\"a = \"\
  \ + a);  // access private variable, ok !\nConsole. WriteLine(\"b = \" + b);  //\
  \ access private variable, ok !\nConsole. ReadLine();\n}}\nclass Program{\nstatic\
  \ void Main(){\nPrivateDemo obj = new PrivateDemo();\nobj. accessVariable();   \
  \ // call the public method, ok !\n}}}\n```\n**输出：**\na = 100\nb = 200\n\n**解释：**\n\
  编译成功！`a` & `b` 是两个私有变量，可以在同类内部访问。私有成员只能被同类中的代码访问。\n\n### 保护 (Protected)\n`protected`\
  \ 访问修饰符用于类型和类型成员。受保护成员可以被派生类的实例访问。也就是说，基类的保护成员可以被派生类中的访问访问。\n\n**示例 7.4**\n```csharp\n\
  using System;\nnamespace ProtectedModifier{\nclass A{\nprotected int p = 100 ; \
  \     // declare a protected variable\n}\nclass B : A{\nstatic void Main(){\nA a\
  \ = new A();            // create an object of the base class\nConsole. WriteLine(a.p\
  \ );   // access protected variable, error !\nConsole. ReadLine();\n}}}\n```\n**输出：**\n\
  Error! Cannot access protected member.\n\n**解释：**\n编译失败！`a` 是来自基类的对象，它无法访问保护成员 `p`。只有派生类的对象可以访问保护成员。\n\
  \n**注意：** 基类的保护成员可以被派生类中的对象访问。下面的示例是一个成功访问保护成员的程序。\n\n**示例 7.5**\n```csharp\nusing\
  \ System;\nnamespace ProtectedModifier{\nclass A{\nprotected int p = 100 ;    //\
  \ declare a protected variable\n}\nclass B : A{\nstatic void Main(){\nB b = new\
  \ B();            // create an object of derived class\nConsole. WriteLine(b.p );\
  \   // access protected variable, ok !\nConsole. ReadLine();\n}}}\n```\n**输出：**\n\
  100\n\n**解释：**\n编译成功！`b` 是派生类的对象，它可以访问保护成员 `p`。只有派生类的对象可以访问保护成员。\n\n**注意：** 保护成员也可以被同类中的代码访问。下面的示例是一个成功访问保护成员的程序。\n\
  \n**示例 7.6**\n```csharp\nusing System;\nnamespace ProtectedDemo{\nclass protectedDemo{\n\
  protected int a = 800;   // declare a protected variable\nprotected int b = 1000;\
  \  // declare a protected variable\nprotected int sum;      // declare a protected\
  \ variable\npublic void accessVariable(){\nsum = a + b;            // access the\
  \ protected variables, ok !\nConsole. WriteLine(\"a + b = \" + sum);\nConsole. ReadLine();\n\
  }}\nclass Program{\nstatic void Main(){\nprotectedDemo obj = new protectedDemo();\n\
  obj. accessVariable();   // call the public method\n}}}\n```\n**输出：**\na + b = 1800\n\
  \n**解释：**\n编译成功！保护成员也可以被同类中的代码访问。\n\n### 获取与设置 (Get & Set)\n`get & set` 访问访问器通常用于从私有字段检索和存储值。`get`\
  \ 方法用于读取值。`set` 方法用于写入值。例如：\n\n```csharp\nprivate int number;\npublic int LuckyNumber{\n\
  \  // create a property access\n  get {\n    // read the value\n    return number;\n\
  \  }\n  set {\n    // write the value\n    number = value;\n  }\n}\n```\n\n\n\n\n\
  `LuckyNumber` 是一个属性访问器，用于读取或写入 `number` 的值。\n\n### 示例 7.7\n\n```csharp\nusing System;\n\
  public class Lottery{\n    private int number;\n    public int LuckyNumber {\n \
  \       // create a property accessor\n        get {\n            // read the value\n\
  \            return number;\n        }\n        set {\n            // write the\
  \ value\n            number = value;\n        }\n    }\n    public void print()\
  \ {\n        Console.WriteLine(\"Lucky Number is: \" + number);\n        Console.ReadLine();\n\
  \    }\n}\npublic class MainClass{\n    public static void Main() {\n        Lottery\
  \ lot = new Lottery();\n        lot.LuckyNumber = 16888; // reference the property\
  \ accessor\n        lot.print();\n    }\n}\n```\n\n**输出：**\n`Lucky Number is: 16888`\n\
  \n**解释：**\n- `public int LuckyNumber{ }` 创建了一个属性访问器。\n- `get{ }` 读取了 `number` 的值。\n\
  - `set{ }` 写入 `number` 的值。\n- `lot.LuckyNumber = \"16888\"` 引用了属性访问器。\n\n## LINQ\n\
  `LINQ` 代表集成语言查询（Language Integrated Query），是微软的一种查询所有类型数据的技术。创建 linq 的语法看起来所示：\n\
  \n| from ……where……select…… |\n\n\n\n\n以下示例是一个查询，用于查找数组中所有为 10, 20, 30……的数字。\n\n\
  示例 7.8\n```csharp\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
  namespace LinqDemo\n{\n    class IntroToLINQ\n    {\n        static void Main()\n\
  \        {\n            int[] MyArray = new int[6] { 10, 15, 20, 25, 30, 35};\n\
  \            var myQuery = // myQuery 是一个变量\n                from item in MyArray\
  \ // 创建一个 linq\n                where (item % 10) == 0\n                select item;\n\
  \            foreach (int item in myQuery)\n            {\n                Console.Write(item\
  \ + \"  \");\n            }\n            Console.ReadLine();\n        }\n    }\n\
  }\n```\n输出: 10   20   30\n\n解释： “`from…where…select…` ” 创建了一个 linq。“`from item in\
  \ MyArray`” 在 `MyArray` 数组上运行查询，“item” 代表数组中的每个项。“`where (item % 10) == 0`” 检查每个项，以确定\
  \ `item` 除以 10 的余数是否为零。“`select item;`” 选择所有符合此标准的项。\n\n### 委托 (Delegate)\n委托是一种引用类型，可以用于封装命名函数或匿名函数。具体来说，委托是一种在对象中持有函数引用的类型。\n\
  \n使用委托的四个步骤：\n(1) 选择一个函数作为委托函数，例如：`public static int myFunction(int a, int b) {}`\
  \ // `myFunction(){ }` 被选为委托函数。\n(2) 声明一个委托函数，其参数应与被委托函数的参数相同，例如：`public delegate\
  \ int DelegateFun(int a, int b);` // `DelegateFun` 是一个委托函数。\n(3) 创建一个委托对象，其参数应该是被委托函数的名称，例如：`DelegateFun\
  \ delegateObj = new DelegateFun(myFunction);` // `delegateObj` 是一个委托对象。\n(4) 执行委托，例如：`delegateObj(arg1,\
  \ arg2);` // 调用委托函数，传递参数。\n\n委托示例 (1)\n示例 7.9\n```csharp\nusing System;\npublic\
  \ static int Sum(int a, int b) \n{ \n    // 这是一个被委托函数“Sum”\n    return a + b;\n\
  }\npublic delegate int DelegateFun(int a, int b); // 声明一个委托函数“DelegateFun”，其参数应与被委托函数“Sum”的参数相同\n\
  class Program\n{\n    public static void Main(string[] args)\n    {\n        DelegateFun\
  \ delegateObj = new DelegateFun(Sum); // 创建一个委托对象“delegateObj”，其参数应该是被委托函数的名称“Sum”\
  \ \n        Console.WriteLine(\"100 + 2 = \" + delegateObj(100, 2)); // 调用委托函数“Sum”，并传递参数\n\
  \        Console.ReadLine();\n    }\n}\n```\n输出: 100 + 2 = 102\n\n解释：\n`public static\
  \ int Sum(int a, int b) { }` // 这是一个被委托函数“Sum”\n`public delegate int DelegateFun(int\
  \ a, int b);` // 声明一个委托函数“DelegateFun”，其参数应与被委托函数“Sum”的参数相同\n`DelegateFun delegateObj\
  \ = new DelegateFun(Sum);` // 创建一个委托对象“delegateObj”，其参数应该是被委托函数的名称“Sum”\n`delegateObj(100,\
  \ 2);` // 调用委托函数“Sum”，并传递参数\n\n委托示例 (2)\n示例 7.10\n```csharp\nusing System;\nclass\
  \ Program\n{\n    public static int Division (int a, int b) \n    { \n        //\
  \ 被委托函数\n        return a / b;   \n    }\n    public static int Multiply (int a,\
  \ int b) \n    { \n        // 被委托函数\n        return a * b;   \n    }\n    public\
  \ static int Subtract (int a, int b) \n    {   \n        // 被委托函数\n        return\
  \ a - b;\n    }\n    public delegate int DelegateFun (int a, int b); // 声明委托\n \
  \   public static void Main(string[] args)\n    {   \n        // 创建委托对象\n      \
  \  DelegateFun delegateObj1 = new DelegateFun(Division);\n        DelegateFun delegateObj2\
  \ = new DelegateFun(Multiply);\n        DelegateFun delegateObj3 = new DelegateFun(Subtract);\n\
  \        Console.WriteLine(\"100 / 2 = \" + delegateObj1(100, 2)); // 调用\n     \
  \   Console.WriteLine(\"100 * 2 = \" + delegateObj2(100, 2)); // 调用\n        Console.WriteLine(\"\
  100 - 2 = \" + delegateObj3(100, 2)); // 调用\n        Console.ReadLine();\n    }\n\
  }\n```\n输出: ![](img/rsrc597.jpg)\n\n解释：使用委托的四个步骤：\n1. 选择一个函数作为委托函数。\n2. 声明一个委托函数。\n\
  3. 创建一个委托对象。\n4. 调用委托函数。\n\n### 总结\n- “`public` 访问修饰符具有最宽松的访问权限。访问 public 类型或类型成员没有任何限制。”\n\
  - “`private` 访问修饰符具有最低的访问权限。只有在定义它的类内部才能访问其私有成员。”\n- “`protected` 访问修饰符具有有限的访问权限。保护成员可以被派生类访问。具体来说，基类的保护成员可以被派生类的实例访问。”\n\
  - “`get & set` 访问器”通常用于从私有字段检索和存储值。`get` 方法用于读取值，`set` 方法用于写入值。\n- `LINQ` 代表语言集成查询（Language\
  \ Integrated Query），是微软用于查询所有类型数据的一种技术。\n\n### 练习：私有成员\n（此处根据上下文逻辑推断为私有成员的练习内容）\n\
  \n\n\n\n## 静态变量\n\n| `static dataType variable;className. variable;` |\n\n`static`\
  \ 声明意味着该变量属于一个类。`className. variable;` 意味着类可以直接引用此静态变量。\n\n**示例 8.3**\n```csharp\n\
  using System;\nnamespace StaticVariable\n{\n    class MyClass\n    {\n        public\
  \ static int num = 100;  // 定义一个静态变量\n        static void Main(string[] args)\n\
  \        {\n            Console. Write(MyClass.num );  // 类引用变量\n            Console.\
  \ ReadLine();\n        }\n    }\n}\n```\n**输出：** 100\n**解释：**\n`static int num`\
  \ 定义了一个静态变量 `num`，它可以被类引用。`MyClass. num` 意味着类 `MyClass` 可以直接引用静态变量 `num`。非静态变量仅通过对象引用，而不通过类引用。\n\
  \n# 静态方法\n\n静态方法可以被类引用。非静态方法仅通过对象引用，而不通过类引用。\n\n| `static dataType method( );className.\
  \ method( );` |\n\n`static` 声明意味着该方法属于一个类。`className. method( );` 意味着类可以直接引用此静态方法。\n\
  \n**示例 8.4**\n```csharp\nusing System;\nnamespace StaticVariable\n{\n    class MyClass\n\
  \    {\n        public static int myMethod() { return 200;}  /* 定义一个静态方法 */\n  \
  \      static void Main(string[] args)\n        {\n            Console. Write(MyClass.myMethod()\
  \ );  /* 类引用该方法 */\n            Console. ReadLine();\n        }\n    }\n}\n```\n\
  **输出：** 200\n**解释：**\n`static int myMethod()` 定义了一个静态方法，它可以被类引用。`MyClass. myMethod\
  \ ()` 意味着类 `MyClass` 引用了静态方法 `myMethod()`。非静态方法仅通过对象引用，而不通过类引用。\n\n## 多态\n\n多态描述了对不同对象执行不同方法的能力。\n\
  \n| `virtual public method(){ }` // 定义一个虚方法 |\n| `public override method(){ }` //\
  \ 重写虚方法 |\n\n多态通过 `virtual method` 和 `override method` 共同完成。\n\n**示例 8.5**\n```csharp\n\
  using System;\nnamespace PolymorphismDemo\n{\n    class Program\n    {\n       \
  \ class Animal\n        {\n            virtual public void cry( ) {  // 定义一个虚方法\n\
  \                Console. WriteLine(\"crying...... \");\n            }\n       \
  \ }\n        class Dog: Animal\n        {\n            public override void cry(\
  \ ) {     // 重写虚方法\n                Console. WriteLine(\"Wow, Wow...... \");\n \
  \           }\n        }\n        class Cat: Animal\n        {\n            public\
  \ override void cry( ) {  // 重写虚方法\n                Console. WriteLine(\"Meow, Meow......\
  \ \");\n                Console. ReadLine();\n            }\n        }\n       \
  \ static void Main(string[] args)\n        {\n            Animal animalVar;\n  \
  \          animalVar = new Dog( );\n            animalVar. cry( );\n           \
  \ animalVar = new Cat( );\n            animalVar. cry( );\n        }\n    }\n}\n\
  ```\n**输出：** Wow, Wow……Meow, Meow……\n**解释：**\n`animalVar = new dog( )` 创建了一个狗对象，因此，`animalVar.\
  \ cry( )` 调用了子类 `Dog` 中的方法 `cry( )` 并重写了虚方法。`animalVar = new cat( )` 创建了一个猫对象，因此，`animalVar.\
  \ cry( )` 调用了子类 `Cat` 中的方法 `cry( )` 并重写了虚方法。\n\n## 写入文件\n\n要写入文件，你应该添加指令 `Using\
  \ System. IO;` 和类 `StreamWriter`。创建文件对象的语法如下：\n\n| `StreamWriter file = new StreamWriter(\"\
  c:\\\\myFile. txt\", true);` |\n\n`StreamWriter file = new StreamWriter(\"c:\\\\\
  myFile. txt\", true);` 创建了一个用于写入文本的文件对象 `file`。`C:\\\\myFile. txt` 指定了写入的路径和文件。`true`\
  \ 表示追加文本。如果没有 `true`，表示覆盖文本。\n\n**示例 8.6**\n```csharp\nusing System;\nusing System.\
  \ Text;\nusing System. IO;\nnamespace WriteFile\n{\n    class WriteTextFile\n  \
  \  {\n        static void Main()\n        {\n            string myText = \"VB in\
  \ 8 Hours\";\n            StreamWriter file = new StreamWriter(\"C:\\\\myFile.txt\"\
  , true);\n            file. WriteLine(myText);      // 将文本写入文件\n            file.\
  \ Close();\n        }\n    }\n}\n```\n**结果：** 请打开 myFile. txt，你可以找到文本：VB in 8 Hours\n\
  如果你第二次运行该程序，它会有文本：VB in 8 Hours\nVB in 8 Hours\n**解释：**\n`System. IO` 命名空间包含了 `StreamWriter`\
  \ 类。`StreamWriter` 类用于文件操作，用于将文本写入文件。`C:\\\\myFile. txt` 写入了文本 `VB in 8 Hours`。参数\
  \ `true` 表示追加文本。否则，如果没有 `true`，则覆盖文本。`file. WriteLine(myText);` 将文本写入文件。\n\n## 读取文件\n\
  \n要读取文件，你应该添加指令 `Using System. IO;` 和类 `StreamReader`。创建文件对象的语法如下：\n\n| `StreamReader\
  \ file = new StreamReader(\"c:\\\\myFile. txt\");` |\n\n\n\n\n\n## StreamReader\
  \ 示例\n\n`StreamReader file = new StreamReader(\"c:\\\\myFile.txt\");` 创建了一个文件对象\
  \ `file`，用于读取文本。`C:\\myFile.txt` 指定了要读取的文件路径和现在。假设 `C:\\myFile.txt` 的内容是 `VB in\
  \ 8 Hours`。\n\n### 示例 8.7\n\n```csharp\nusing System;\nusing System.Text;\nusing\
  \ System.IO;\n\nnamespace ReadFile\n{\n    class Program\n    {\n        static\
  \ void Main(string[] args)\n        {\n            String myText;\n            StreamReader\
  \ file = new StreamReader(\"C:\\\\myFile.txt\");\n            myText = file.ReadLine();\
  \ // 读取第一行\n            while (myText != null)\n            {\n                //\
  \ 读取到文件末尾\n                Console.WriteLine(myText);\n                myText =\
  \ file.ReadLine(); // 读取下一行\n            }\n            file.Close();\n        \
  \    Console.ReadLine();\n        }\n    }\n}\n```\n\n**输出：**\nVB in 8 Hours\nVB\
  \ in 8 Hours\n\n**解释：**\n- `System.IO` 命名空间包含 `StreamReader` 类。\n- `StreamReader`\
  \ 类用于文件操作，它用于从文件中读取文本。\n- `C:\\myFile.txt` 指定了要读取的文件路径。\n- `myText = file.ReadLine();`\
  \ 读取 `myFile.txt` 的文本。\n\n### 总结\n\n- **抽象类（Abstract class）** 作为父类工作，由其子类扩展。子类中的方法将重写抽象类中的抽象方法。\n\
  - **接口（Interface）** 是一种特殊的类，由类实现。接口包含一个或多个空方法，这些方法将由类的方法实现。\n- **静态变量（Static variable）**\
  \ 可以通过类引用。**非静态变量（Non-static variable）** 仅通过对象引用，通过类。\n- **静态方法（Static method）**\
  \ 可以通过类引用。**非静态方法（Non-static method）** 仅通过对象引用，通过类。\n- **多态（Polymorphism）** 描述了不同对象执行不同方法的能力。多态通过`虚方法（virtual\
  \ method）`和`重写方法（override method）`共同完成。\n- 要写入文件，你应该添加指令 `using System.IO;` 和类 `StreamWriter`。\n\
  - 要读取文件，你应该添加指令 `using System.IO;` 和类 `StreamReader`。\n\n## 练习：最大与最小值 - 抽象示例\n\n\
  启动 Visual Studio > 文件 > 新项目 > 控制台应用程序 > 命名为 `AbstractExample` > 确定。在 Visual Studio\
  \ 中编写以下代码。\n\n```csharp\nusing System;\nnamespace AbstractExample\n{\n    abstract\
  \ class A\n    {\n        // 定义一个抽象类\n        public abstract int max(int x, int\
  \ y); // 声明抽象方法\n        public abstract int min(int x, int y); // 声明抽象方法\n    }\n\
  \    class B : A\n    {\n        // 类 B 继承类 A\n        public override int max(int\
  \ x, int y)\n        {\n            // 重写抽象方法\n            return x > y ? x : y;\n\
  \        }\n        public override int min(int x, int y)\n        {\n         \
  \   // 重写抽象方法\n            return x < y ? x : y;\n        }\n    }\n    class Program\n\
  \    {\n        static void Main(string[] args)\n        {\n            B b = new\
  \ B();\n            int max = b.max(100, 200);\n            int min = b.min(100,\
  \ 200);\n            Console.WriteLine(\"Max=\" + max);\n            Console.WriteLine(\"\
  Min=\" + min);\n            Console.ReadLine();\n        }\n    }\n}\n```\n\n保存文件，并调试运行程序。\n\
  \n**输出：**\nMax = 200\nMin = 100\n\n**解释：**\n- `abstract class A { }` 定义了一个抽象类。\n\
  - `public abstract int max(int x, int y);` 定义了一个没有 `{ }` 的抽象方法。\n- `class B : A\
  \ { }` 意味着子类 `B` 继承父类 `A`。\n- `public override int max(int x, int y){ }` 意味着子类中的此方法重写了父类中的抽象方法。\n\
  - **注意：**抽象方法没有 `{ }`。\n\n## 练习：更大与更小 - 接口示例\n\n启动 Visual Studio > 文件 > 新项目 > 控制台应用程序\
  \ > 命名为 `InterfaceExample` > 确定。在 Visual Studio 中编写以下代码。\n\n```csharp\nusing System;\n\
  namespace InterfaceExample\n{\n    interface myInterface\n    {\n        // 定义一个接口\n\
  \        void compareNumbers(int num1, int num2); // 定义一个没有 { } 的空方法\n    }\n  \
  \  class MaxNum : myInterface\n    {\n        // 实现接口\n        public void compareNumbers(int\
  \ num1, int num2)\n        {\n            // 实现空方法\n            Console.WriteLine(\"\
  Two numbers are: \" + num1 + \" & \" + num2);\n            if (num1 >= num2)\n \
  \               Console.WriteLine(\"Maximum is:\" + num1);\n            else\n \
  \               Console.WriteLine(\"Maximum is:\" + num2);\n        }\n    }\n \
  \   class MinNum : myInterface\n    {\n        // 实现接口\n        public void compareNumbers(int\
  \ num1, int num2)\n        {\n            // 实现空方法\n            Console.WriteLine(\"\
  Two numbers are: \" + num1 + \" & \" + num2);\n            if (num1 <= num2)\n \
  \               Console.WriteLine(\"Minimum is:\" + num1);\n            else\n \
  \               Console.WriteLine(\"Maximum is:\" + num2);\n            Console.ReadLine();\n\
  \        }\n    }\n    class Program\n    {\n        static void Main(string[] args)\n\
  \        {\n            MaxNum maxObject = new MaxNum();\n            maxObject.compareNumbers(100,\
  \ 120);\n            MinNum minObject = new MinNum();\n            minObject.compareNumbers(60,\
  \ 80);\n        }\n    }\n}\n```\n\n保存文件，并调试运行程序。\n\n**输出：**\nTwo numbers are: 100\
  \ & 120\nMaximum is: 120\nTwo numbers are: 60 & 80\nMinimum is: 60\n\n**解释：**\n\
  - `interface myInterface { }` 定义了一个接口。\n- `void compareNumbers(int num1, int num2);`\
  \ 定义了一个没有 `{ }` 的空方法。\n- `class MaxNum : myInterface { }` 意味着类 `MaxNum` 实现了 `myInterface`。\n\
  - `public void compareNumbers(int num1, int num2){ }` 意味着子类中的此方法实现了接口中的空方法。\n- **注意：**空方法没有\
  \ `{ }`。\n\n## 录 & 答案\n\n选择正确答案。\n\n1)\n```csharp\nusing System;\nnamespace MyProgram\n\
  {\n    class Program\n    {\n        static ___ (string[] args){ // 定义 main 函数\n\
