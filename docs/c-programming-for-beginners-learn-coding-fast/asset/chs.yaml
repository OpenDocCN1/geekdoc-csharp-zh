  \ 表示 Ford 的价格。`Ford.size` 表示 Ford 的尺寸。`Ford.color` 表示 Ford 的颜色。\n\n## 练习：WeekdaysEnum\
  \ 学习\n\n默认情况下，第一个枚举器的值为 0，每个后续枚举器的值增加 1。例如，在下面的枚举中，星期日为 0；星期一 1，星期二为 2，以此类推。\n\n\
  请打开 Visual C#，点击 `File > New Project > Console Application`。输入文件名 `enumStudy`。在编辑器中编写\
  \ C# 代码：\n\n```csharp\nusing System;\npublic class enumStudy\n{\n    enum Week\n\
  \    {\n        // defines an enum type\n        Sunday,  // enum member\n     \
  \   Monday,  // enum member\n        Tuesday  // enum member\n    }\n    class Program\n\
  \    {\n        static void Main()\n        {\n            int w0, w1, w2;\n   \
  \         w0 = (int)Week.Sunday;\n            w1 = (int)Week.Monday;\n         \
  \   w2 = (int)Week.Tuesday;\n            Console.WriteLine(\"The value of Sunday\
  \ is \" + w0);\n            Console.WriteLine(\"The value of Monday is \" + w1);\n\
  \            Console.WriteLine(\"The value of Tuesday is \" + w2);\n           \
  \ Console.ReadLine();\n        }\n    }\n}\n```\n\n保存文件，点击 `Start Debugging` 运行程序。\n\
  \n**输出：**\nThe value of Sunday is 0\nThe value of Monday is 1\nThe value of Tuesday\
  \ is 2\n\n**解释：**\n`enum Week` 定义了一个枚举类型 `Week`。第一个枚举成员的默认值为 0，第二个枚举成员的默认值为 1，第三个枚举成员的默认值为\
  \ 2。\n\n# 第 3 章：控制结构\n\n### If 语句\n\n```\nif ( test-expression ) {\n   // if true\
  \ do this;\n}\n```\n\n`if statement` 仅在指定条件为真时才执行 `{ ... }` 内部的代码，如果条件为假，则不执行 `{…}`\
  \ 中的任何代码。\n\n**示例 3.1**\n```csharp\nusing System;\nnamespace IfStatement\n{\n  \
  \  class Program\n    {\n        static void Main(string[] args)\n        {\n  \
  \          int a = 200;\n            int b = 100;\n            if (a > b)\n    \
  \        {\n                // if true do this;\n                Console.WriteLine(\"\
  a is greater than b. \");\n                Console.ReadLine();\n            }\n\
  \        }\n    }\n}\n```\n**输出：**\na is greater than b\n\n**解释：**\n`(a>b)` 是一个测试表达式，即\
  \ `(200>100)`，如果 `if` 返回真，它将执行 `{ }` 内部的代码；如果 `if` 返回假，则不执行 `{ }` 内部的代码。\n\n###\
  \ If-else 语句\n\n```\nif ( test-expression) {\n    // if true do this;\n} else {\n\
  \    // if false do this;\n}\n```\n\n**示例 3.2**\n```csharp\nusing System;\nnamespace\
  \ IfelseStatement\n{\n    class Program\n    {\n        static void Main(string[]\
  \ args)\n        {\n            int a = 100;\n            int b = 200;\n       \
  \     if (a > b)\n            {\n                // if true do this;\n         \
  \       Console.WriteLine(\"a is greater than b. \");\n                Console.ReadLine();\n\
  \            }\n            else\n            {\n                // if false do\
  \ this;\n                Console.WriteLine(\"a is less than b. \");\n          \
  \      Console.ReadLine();\n            }\n        }\n    }\n}\n```\n**输出：**\na\
  \ is less than b\n\n**解释：**\n`(a>b)` 是一个测试表达式，即 `(100>200)`，如果 `if` 返回真，它将输出 `\"\
  a is greater than b. \"`；如果 `if` 返回假，它将输出 `\"a is less than b\"`。\n\n### Switch\
  \ 语句\n\n```\nswitch (variable ){\n    case 1: if equals this case, do this; break;\n\
  \    case 2: if equals this case, do this; break;\n    case 3: if equals this case,\
  \ do this; break;\n}\n```\n\n`switch` 语句将 `variable` 与多个 `case` 值进行比对。\n\n**示例 3.3**\n\
  ```csharp\nusing System;\nnamespace SwichStatement\n{\n    class Program\n    {\n\
  \        static void Main(string[] args)\n        {\n            // logic for switch\n\
  \        }\n    }\n}\n```\n\n# For 循环\n\n```\nfor ( init; test-expression; increment)\
  \ {\n    // some code\n}\n```\n\n`for` 循环按照指定的次数重复执行代码块。\n\n**示例 3.4**\n```csharp\n\
  using System;\nnamespace ForStatement\n{\n    class Program\n    {\n        static\
  \ void Main(string[] args)\n        {\n            for (int x = 0; x <= 5; x++)\n\
  \            {\n                // code\n            }\n        }\n    }\n}\n```\n\
  \n### While 循环\n\n```\nwhile ( test-expression ) {\n    // some code\n}\n```\n\n\
  `while` 循环只要条件为真就会重复执行代码块。\n\n**示例 3.5**\n```csharp\nusing System;\nnamespace WhileStatement\n\
  {\n    class Program\n    {\n        static void Main(string[] args)\n        {\n\
  \            int counter = 0;\n            while (counter < 8)\n            {\n\
  \                Console.Write(\"&\");\n                counter++;\n           \
  \ }\n        }\n    }\n}\n```\n\n### Do-While 循环\n\n```\ndo {\n    // some code\n\
  } while ( test-expression);\n```\n\n`do...while` 循环执行一次代码块，如果条件为真则重复执行。\n\n**示例\
  \ 3.6**\n```csharp\nusing System;\nnamespace DoWhileStatement\n{\n    class Program\n\
  \    {\n        static void Main(string[] args)\n        {\n            int counter\
  \ = 0;\n            do\n            {\n                Console.Write(\"@\");\n \
  \               counter++;\n            } while (counter < 8);\n        }\n    }\n\
  }\n```\n\n### Break 语句\n\n```\nbreak;\n```\n\n`break` 关键字用于根据条件停止循环。\n\n**示例 3.7**\n\
  ```csharp\nusing System;\nnamespace BreakStatement\n{\n    class Program\n    {\n\
  \        static void Main(string[] args)\n        {\n            int num = 0;\n\
  \            while (num < 10)\n            {\n                if (num == 5) break;\n\
  \                num++;\n            }\n            Console.Write(num);\n      \
  \  }\n    }\n}\n```\n\n### Continue 语句\n\n```\ncontinue;\n```\n\n`continue` 关键字用于停止当前迭代，忽略后续代码，并继续下一次循环。\n\
  \n**示例 3.8**\n```csharp\nusing System;\nnamespace ContinueStatement\n{\n    class\
  \ Program\n    {\n        static void Main(string[] args)\n        {\n         \
  \   int num = 0;\n            while (num < 10)\n            {\n                num++;\n\
  \                if (num == 5) continue;\n                Console.Write(num);\n\
  \            }\n        }\n    }\n}\n```\n\n### 用户输入\n\n```csharp\nvariable = Console.ReadLine();\n\
  ```\n\n\n\n\n\n`variable = Console.ReadLine();` 接收用户的输入，并将值赋值给变量。\n\n### 示例 3.9\n\
  ```csharp\nusing System;\nnamespace InputDemo\n{\n    class Program\n    {\n   \
  \     static void Main(string[] args)\n        {\n            string name;\n   \
  \         Console.Write(\"Enter your name:\");\n            name = Console.ReadLine();\
  \ // accept user input\n            Console.WriteLine(name);\n            Console.ReadLine();\n\
  \        }\n    }\n}\n```\n**输出:**\nEnter your name: Smith\nSmith\n\n**解释：** `name\
  \ = Console.ReadLine();` 接收用户输入，并将输入的值赋值给 `“name”`。\n\n### 总结\n- `if 语句` 仅在指定条件为真时才执行\
  \ `{ … }` 内部的代码。如果条件为假，则不执行 `{…}` 内的任何代码，并运行 `else {…}` 中的代码。\n- ```csharp\nswitch\
  \ (variable ) {\n    case 1: 如果等于此情况，执行此操作； break;\n    case 2: 如果等于此情况，执行此操作； break;\n\
  \    case 3: 如果等于此情况，执行此操作； break;\n    default : 如果不等于任何情况，运行默认代码； break;\n}\n\
  ```\n- `for 循环` 通过指定的次数重复运行一个代码块。\n- `while 循环` 如果指定条件为真，则循环运行一个代码块。\n- `do... while`\
  \ 循环一次一个代码块，如果指定条件为真，则重复循环。\n- `break` 关键字用于根据条件停止循环的运行。\n- `continue` 关键字用于停止当前迭代，忽略后续代码，然后继续下一次循环。\n\
  - `variable = Console.ReadLine();` 接收用户的输入，并将值赋值给变量。\n\n### 练习：第一题\n#### For 循环示例\n\
