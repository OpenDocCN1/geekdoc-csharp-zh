  \ = {\"value0\", \"value1\", \"value2\",…}; |`\n\n创建数组的第二方法如下：\n`| type [] arrayName\
  \ = new type [ number of elements ];arrayName[index0] = \"value0\";arrayName[index1]\
  \ = \"value1\";arrayName[index2] = \"value2\"; |`\n\n### 练习：C++ & C# 字符串与数组\n请打开\
