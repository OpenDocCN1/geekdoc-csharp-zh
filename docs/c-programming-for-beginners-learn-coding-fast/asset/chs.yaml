  \ {\n        static void Main(string[] args)\n        {\n            Car Ford; //\
  \ defines a struct variable\n            Ford.price = 90000;\n            Ford.size\
  \ = \"big\";\n            Ford.color = \"black\";\n            Console.WriteLine(\"\
  Ford's price is $\" + Ford.price);\n            Console.WriteLine(\"Ford's size\
  \ is \" + Ford.size);\n            Console.WriteLine(\"Ford's color is \" + Ford.color);\n\
