  - 推荐书籍\n- 第一章：C# 简介\n- 第二章：运算符\n- 第三章：控制结构\n- 第一个 C# 程序\n- 第四章：字符串与数组\n- 第五章：函数与异常\n\
  - 第六章：类与对象\n- 第七章：访问修符\n- 第八章：静态抽象接口\n\n## 前言\n本书旨在帮助初学者快速上手 C# 编程。通过实战示例，你将掌握 C#\
  \ 的核心概念。\n\n# 第一章：C# 简介\n### 什么是 C#？\nC# 是一种基于 C++ 的面向对象（OOP）语言，旨在与微软配合使用。\n\n在线\
  \ C# 编译器与编辑器\n如果你不想在本地计算机上安装 C#，可以使用在线的编译器与编辑器。将 C# 代码输入编辑器，点击“编译”，即可看到结果。\n\n###\
  \ 第一个 C# 程序\n让我们这样编写“Hello World”程序：\n```csharp\nusing System;\nnamespace HelloWorld\n\
  {\n    class Program\n    {\n        static void Main(string[] args)\n        {\n\
  \            Console.WriteLine(\"Hello World ! \");\n            Console.ReadLine();\n\
  \        }\n    }\n}\n```\n输出：\nHello World!\n\n解释：\n`using System`: `using` 是一个指令，指定编译器（或汇编器、解释器）如何处理数据。`System`\
  \ 是用于组织各种对象的命名空间，以便可以通过名称引用这些对象。\n`namespace HelloWorld`: 文件名为 `HelloWorld.cs`。\n\
  `class Program`: C# 程序的类总是包含一个 `Main` 方法。\n`static void Main(string[] args)`: 这是一个运行\
  \ C# 程序的入口方法。当应用程序执行时，`Main` 方法是第一个被调用的方法`(string[] args)` 用于传递输入参数。\n`Console.WriteLine()`:\
  \ 这是一个显示输出结果的方法。\n`Console.ReadLine()`: 这是一个暂停屏幕的方法，确保输出结果显示。如果没有此命令，输出结果将被跳过。\n\
  \n\n\n\n## C# 注释\n\nC# 注释用于解释当前代码，描述这段代码的作用。C# 编译器会忽略注释。`//` 用于单行注释。`/*…*/` 用于多行注释。\n\
  \n### 示例 1.2\n```csharp\nConsole.WriteLine (“Hello World”); // show “Hello World”\n\
  /* Console.WriteLine() 是一个 C# 输出命令，意味着显示或打印 .*/\n```\n**解释：**\n`//` `show “Hello\
  \ World ” 是一个单行注释。\n`/* Console.WriteLine() 是一个 C# 输出命令，意味着显示或打印 . */` 是一个多行注释。\n\
  \n## 转义字符\n\n`\\` 反斜杠字符可以用于转义字符。\n\n- `\\n` 将内容输出到下一行。\n- `\\r` 产生回车。\n- `\\t` 产生一个制表符。\n\
  - `\\'` 输出单引号。\n- `\\\"` 输出双引号。\n\n### 示例 1.3\n```csharp\nusing System;\nnamespace\
  \ EscapingCharacters{\n    class Program{\n        static void Main(string[] args){\n\
  \            Console.WriteLine(\"    \\\" Escaping Character Samples\\\"    \");\n\
  \            Console.ReadLine();\n        }\n    }\n}\n```\n**输出：** “ Escaping Character\
  \ Samples”\n**解释：** `\\\"` 输出双引号。\n**注意：** “ Escaping Character Samples” 带有一对双引号；你可以在输出结果中看到包含文本的双引号。\n\
  \n### 示例 1.4\n```csharp\nConsole.WriteLine ( “Hello \\t\\t\\t World! ” ); // 注意这里有三个制表\
  \ .\n```\n**输出：** Hello       World!\n**解释：** `\\t` 产生一个制表符\n\n### 示例 1.5\n```csharp\n\
  Console.WriteLine ( “Hello \\n World! ” ); // 注意这里有一个 \\n .\n```\n**输出：** \nHelloWorld\
  \ !\n**解释：** `\\n` 将内容输出到下一行。\n\n## C# 关键字\n\n某些单词仅供 C# 语言本身使用。在为变量、函数和标签选择标识符名称时不能使用它们。以下单词是\
  \ C# 保留字的一部分：\n\n| abstract | byte | char | continue | double | extern | float |\
  \ if | interface | object | public | string | this | try |\n\n### 总结\n\n- `using\
  \ System`：`using` 是一个关键字，意味着“运行”。`System` 是一个命名空间，用于分组 C# 类、对象等。\n- `namespace HelloWorld`：文件名“HelloWorld.cs”。\n\
  - `class Program`：C# Program 类始终包含一个 `main` 方法。\n- `static void Main(string[] args)`：这是主方法，是运行\
  \ C# 程序的入口点。`(string[] args)` 用于传递输入参数。\n- `Console.WriteLine()`：这是一个用于显示输出结果的方法。\n\
  - `Console.ReadLine()`：这是一个暂停屏幕的方法，并确保显示输出结果。否则，如果没有此命令，输出结果将被跳过。\n- `//` 用于单行注释。\n\
  - `/*…*/` 用于多行注释。\n- `\\n` 将内容输出到下一行。\n- `\\r` 产生回车。\n- `\\t` 产生一个制表符。\n- `\\'`\
  \ 输出单引号。\n- `\\\"` 输出双引号。\n\nC# 关键字仅供 C# 语言本身使用。在为变量、函数和标签选择标识符名称时不能使用它们。例如：`if`、`new`、`while`\
  \ 和 `try` 是 C# 语言保留的关键字。\n\n### 练习：运行 C# 程序！\n\n请打开 Visual C#，点击 `File > New Project\
  \ > Console Application`。输入文件名“MyProgram”。在编辑器中编写 C# 代码：\n\n```csharp\nusing System;\n\
  namespace MyProgram{\n    class Program{\n        static void Main(string[] args)\
  \ // Main 方法\n        {\n            string str = \"Let's study C# progrmming! \"\
  ; // 定义一个字符串\n            Console.Write(str); // 输出 str 的值\n            Console.ReadLine();\
  \ // 确保显示输出结果\n        }\n    }\n}\n```\n**输出：** Let’s study C# programming!\n**解释：**\n\
  - `static void Main(string[] args)` 是主方法，C# 程序始终从这个起点开始运行。\n- `string str = \"Let's\
  \ study C# progrmming! \";` 定义了一个字符串及其值。`string` 是数据类型。`str` 是变量，“Let’s study programming”是一个值。\n\
  - `Console.Write(str);` 显示 `str` 变量的值。`str` 的值为“Let’s study C# programming! ”，所以我们可以看到输出结果\
  \ \"Let's study C# programming!\".\n- `Console.ReadLine()`：确保显示输出结果。\n\n从上面的示例中，我们可以看到程序中的一些关键字，如\
  \ `using`、`static`、`void` 和 `string` 等。\n\n## 数据类型\n\nC# 有两类数据类型：\n1. 值类型：整数、数字、小数、`char`、`bool`\n\
  2. 引用类型：`object`、`string`\n\n| 类型 | 描述 |\n| :--- | :--- |\n| sbyte | 8 位符号整数 |\n\
  | byte | 8 位无符号整数 |\n| short | 16 位符号整数 |\n| ushort | 16 位无符号整数 |\n| int | 32 位符号整数\
  \ |\n| uint | 32 位无符号整数 |\n| long | 64 位符号整数 |\n| ulong | 64 位无符号整数 |\n| char |\
  \ Unicode 字符 |\n| float | 单精度浮点数 |\n| double | 双精度浮点数 |\n| bool | 布尔值，真或假 |\n| decimal\
  \ | 精确的小数值 |\n| string | 任意长度的字符串 |\n| Object | 任意类型 |\n\n## 变量\n\n变量是存储 C# 程序中所用值的容器。每个变量都有自己的名称，例如：`a`、`b`、`str`、`myVariable`……等（我们将在下一页再次讨论“变量”）。\n\
  \n### 示例 1.6\n```csharp\nint a = 10; // int 是数据类型，a 是变量，10 是一个值\nbool test = true;\
  \ // bool 是数据类型，test 是变量，true 是一个值 .\nfloat f = 1.0f; // float 是数据类型，f 是变量，1.0f\
  \ 是一个值 .\ndouble d = 1.0d; // double 是数据类型，d 是变量，1.0d 是一个值 .\ndecimal dec = 2.2m;\
  \ // decimal 是数据类型，dec 是变量，2.2m 是一个值 .\nbyte b = 10; // byte 是数据类型，b 是变量，10 是一个值\
  \ .\nlong l = 10L; // long 是数据类型，l 是变量，10L 是一个值 .\nchar c = 'V'; // char 是数据类型，c\
  \ 是变量，V 是一个值 .\nstring myString = \"Hello! \"; // string 是数据类型，myString 是变量，Hello\
  \ ! 是一个值 .\nobject myObject = \"C#\"; // object 是数据类型，myObject 是一个对象变量，“C#” 是一个值\
  \ .\n```\n**解释：**\n我们可以使用以下公式来定义数据类型、变量和值：\n`数据类型 变量 = 值`\n\n变量是存储 C# 程序中所用值的容器。变量代表存储位置。\n\
  `数据类型变量 = 值` 是用于定义变量及其值。\n\n### 示例 1.7\n```csharp\nstring name = \"Smith\"; // string\
  \ 变量\nint age = 16; // int 变量\nbool b = true; // bool 变量\n```\n**解释：** `string`、`int`、`bool`\
  \ 是数据类型。`name`、`age`、`b` 是变量。\n\n## 变量定义\n\n有不同的方法定义变量。\n\n### 示例 1.8\n```csharp\n\
  using System;\nnamespace VariableSample{\n    class Program{\n        static void\
  \ Main(string[] args){\n            float x, y;\n            y = 1.2356f;\n    \
  \        x = y;\n            Console.WriteLine(x);\n            int i;\n       \
  \     int a = 10, b = 20, c = 30;\n            i = a + b + c;\n            Console.WriteLine(i);\n\
  \            Console.ReadLine();\n        }\n    }\n}\n```\n**输出：**\n1.23456\n60\n\
  **解释：** `float x, y;` 定义了变量 `x, y`。`int i;` 定义了一个变量。`int a = 10, b = 20, c = 30;`\
  \ 定义了三个变量 `a`、`b` 和 `c`。\n\n## 常量\n\n常量是不可改变的值，例如 200、1.23e6、“GOOD”。\n\n`const 类型\
  \ 常量 = 值`\n“const”用于定义常量。\n\n### 示例 1.9\n```csharp\nconst double PI = 3.14159265;\
  \ // 定义常量\nconst string BOOK = \"C# Programming Language\"; // 常量\n```\n**解释：**\
  \ `PI` 是常量名。`3.14159265` 是常量值。`BOOK` 是常量名，“C# Programming Language”是常量值。常量值在运行时不可更改。\n\
  \n## 常量定义\n\n常量名通常大大写。\n\n### 示例 1.10\n```csharp\nusing System;\nnamespace ConstantSample{\n\
  \    class Program{\n        static void Main(string[] args){\n            const\
  \ double PI = 3.14159265; // PI 是常量\n            const string BOOK = \"C# Programming\
  \ Language\"; // 常量\n            Console.WriteLine(PI);\n            Console.WriteLine(BOOK);\n\
  \            Console.ReadLine();\n        }\n    }\n}\n```\n**输出：**\n3.14159265\n\
  C# Programming Language\n**解释：** `PI` 和 `BOOK` 是常量名。\n\n## 数据类型转换\n\n数据类型在 C# 程序中可以更改。\n\
  \n` (类型) 变量`\n\n\n\n\n\n`(Data Type)` 指定了要转换的数据类型。\n\n### 示例 1.11\n```csharp\nusing\
  \ System;\nnamespace TypyConvert{\n    class Program{\n        static void Main(string[]\
  \ args){\n            float oldValue = 20.123f, newValue;\n            newValue\
  \ = (int)oldValue; // 数据类型\n            Console.WriteLine(newValue);\n         \
  \   Console.ReadLine();\n        }\n    }\n}\n```\n输出：`20`\n解释：`newValue = (int)oldValue;`\
  \ 将数据类型从 `float` 转换为 `int`。\n\n### 装箱 (Boxing)\n变量的 `int` 类型转换为 `object` 类型，或者值类型转换为引用类型，这被称为“装箱”。\n\
  \n| `object newVariable = (object) oldVariable;` |\n\n`oldVariable` 的 `int` 类型可以转换为\
  \ `newVariable` 的 `object` 类型。\n\n### 示例 1.12\n```csharp\nusing System;\nnamespace\
  \ Boxing{\n    class Program{\n        static void Main(string[] args){\n      \
  \      int var1 = 100;\n            object var2 = (object)var1; // 装箱\n        \
  \    Console.WriteLine(\"The data type of var2 is object type now. \");\n      \
  \      Console.ReadLine();\n        }\n    }\n}\n```\n输出：`The data type of var2\
  \ is object type now.`\n解释：`object var2 = (object)var1;` 将 `var1` 的 `int` 类型转换为\
  \ `object` 类型。\n\n### 解箱 (Unboxing)\n变量的 `object` 类型转换为 `int` 类型，或者引用类型转换为值类型，这被称为“解箱”。\n\
  \n| `int newVariable = (int) oldVariable;` |\n\n`oldVariable` 的 `object` 类型可以转换为\
  \ `newVariable` 的 `int` 类型。\n\n### 示例 1.13\n```csharp\nusing System;\nnamespace\
  \ Boxing{\n    class Program{\n        static void Main(string[] args){\n      \
  \      int var1 = 100;\n            object var2 = (object)var1; // 装箱\n        \
  \    int var3 = (int)var2; // 解箱\n            Console.WriteLine(\"The data type\
  \ of var3 is int type now.\");\n            Console.ReadLine();\n        }\n   \
  \ }\n}\n```\n输出：`The data type of var3 is int type now.`\n解释：`int var3 = (int)var2;`\
  \ 将 `var2` 的 `object` 类型转换为 `int` 类型。\n\n### 总结\nC# 有两类数据类型：\n1. 值类型：整数 (integer)、数字\
  \ (decimal)、字符 (char)、bool。\n2. 引用类型：object、string。\n\n关于数据类型、变量和值的关系，可以使用以下等式：\n\
  \n| `datatype variable = value;` |\n\n`dataType variable = value;` 用于定义变量和它的值。`Constant`\
  \ 是一个不可改变的值，例如 `200`、`236`、`\"GOOD\"`。数据类型在 C# 编程中是可以改变的。\n\n| `(DataType) variable`\
  \ |\n\n`(Data Type)` 指定要转换的数据类型。变量的 `int` 类型转换为 `object` 类型，被称为“装箱”。`object` 类型转换为\
  \ `int` 类型被称为“解箱”。\n\n### 练习：计算与常量\n请打开 Visual Studio，点击 `File > New Project > Console\
  \ Application`。在编辑器中输入以下 `VariableAndConstant` 代码：\n\n```csharp\nusing System;\n\
  namespace VariableAndConstant{\n    class Program{\n        static void Main(string[]\
  \ args){\n            int num; // 定义变量\n            int a = 10, b = 20, c = 30;\
  \ // 定义 a, b, c\n            num = a * b * c;\n            const string RESULT =\
  \ \"The result is: \"; // 定义常量\n            Console.WriteLine(RESULT + num);\n \
  \           Console.ReadLine();\n        }\n    }\n}\n```\n保存文件，点击“调试”运行程序。\n输出：`The\
  \ result is: 600`\n解释：`int num;` 定义了一个变量 `num`。`const string RESULT` 定义了一个常量 `RESULT`。\n\
  \n# 第二章：运算符\n\n### 算术运算符\n| 运算符 |  |\n| :--- | --- |\n| `+` | 加 |\n| `-` | 减 |\n\
  | `*` | 乘 |\n| `/` | 除 |\n| `%` | 取模 |\n| `++` | 加 1 |\n| `--` | 减 1 |\n\n`%` 运算符将第一个操作数除以第二个操作数，返回余数。`%2`\
  \ 余数为 `0`。\n\n### 示例 2.1\n```csharp\nint add=100+200;\nConsole.WriteLine(add);\n\
  int div=800/2;\nConsole.WriteLine(div);\nint mod=100%3;\nConsole.WriteLine(mod);\n\
  int inc=10;\nConsole.WriteLine(inc);\n```\n解释：`add=100+200` 输出 `300`；`div=800/2`\
  \ 输出 `400`；`mod=100%3` 输出 `1`；`++inc` 输出 `11`。\n\n### 逻辑运算符\n使用逻辑运算符后，结果将为 true\
  \ 或 false。\n\n| 运算符 | |\n| :--- | --- |\n| `&&` | 与 (AND) |\n| `||` | 或 (OR) |\n\
  | `!` | 非 (NOT) |\n\n### 示例 2.2\n```csharp\nbool x=true; bool y=false;\nbool a=x\
  \ && y; Console.WriteLine(a); // 输出: false\nbool b=x || y; Console.WriteLine(b);\
  \ // 输出: true\nbool c=! x; Console.WriteLine(c); // 输出: false\n```\n解释：\n`true &&\
  \ true` 返回 `true`；`true && false` 返回 `false`；`false && false` 返回 `false`。\n`true\
  \ || true` 返回 `true`；`true || false` 返回 `true`；`false && false` 返回 `false`。\n`!\
  \ false` 返回 `true`；`! true` 返回 `false`。\n\n### 赋值运算符\n| 运算符 | 示例 |\n| :--- | ---\
  \ |\n| `+=` | `x+=y` |\n| `-=` | `x-=y` |\n| `*=` | `x*=y` |\n| `/=` | `x/=y` |\n\
  | `%=` | `x%=y` |\n\n### 示例 2.3\n```csharp\nint x=200; int y=100;\nx += y; Console.WriteLine(x);\n\
  x /= y; Console.WriteLine(x);\nx -= y; Console.WriteLine(x);\nm=\"abc\"; string\
  \ n=\"de\";\nm += n; Console.WriteLine(m);\n```\n解释：`x+=y` 输出 `300`；`x/=y` 输出 `2`；`x-=y`\
  \ 输出 `100`；`m+=n` 输出 `abcd`。\n\n### 比较运算符\n| 运算符 | |\n| :--- | --- |\n| `>` 大于 |\n\
  | `<` 小于 |\n| `>=` 大于等于 |\n| `<=` 小于等于 |\n| `==` 等于 |\n| `!=` 不等于 |\n\n使用比较运算符后，结果将为\
  \ true 或 false。\n\n### 示例 2.4\n```csharp\nint a = 100; int b = 200; bool result;\n\
  result = (a > b); Console.WriteLine(result);\nresult = (a == b); Console.WriteLine(result);\n\
  result = (a != b); Console.WriteLine(result);\n```\n解释：`result = (a > b)` 输出 `false`；`result\
  \ = (a == b)` 输出 `false`；`result = (a != b)` 输出 `true`。\n\n### 三元运算符\n`(表达式) ? (表达式为真时的语句)\
  \ : (表达式为假时的语句);`\n这类似于 `if-else`。\n\n### 示例 2.5\n```csharp\nint a = 100; int b\
  \ = 200;\nstring result;\nresult = (a < b) ? \"apple\" : \"banana\";\nConsole.WriteLine(result);\n\
  ```\n解释：`result = (a < b) ? \"apple\" : \"banana\"` 输出 `apple`。\n\n### 条件语句\n```csharp\n\
  if (条件) {\n    // 如果条件为真则执行\n} else {\n    // 如果条件为假则执行\n}\n```\n\n### 示例 2.6\n\
  ```csharp\nint age = 20;\nif (age >= 18) {\n    Console.WriteLine(\"成年人\");\n} else\
  \ {\n    Console.WriteLine(\"未成年\");\n}\n```\n\n### switch 语句\n```csharp\nswitch\
  \ (表达式) {\n    case 值 1:\n        // 语句\n        break;\n    case 值 2:\n       \
  \ // 语句\n        break;\n    default:\n        // 默认语句\n}\n```\n\n### 示例 2.7\n```csharp\n\
  int day = 2;\nswitch (day) {\n    case 1:\n        Console.WriteLine(\"星期一\");\n\
  \        break;\n    case 2:\n        Console.WriteLine(\"星期二\");\n        break;\n\
  \    default:\n        Console.WriteLine(\"其他日期\");\n        break;\n}\n```\n\n\n\
  \n\n\n`sizeof(dataType);` 用于获取数据类型的大小（以字节为单位）。\n\n### 示例 2.8\n```csharp\nusing System;\n\
  namespace sizeofsample\n{\n    class Program\n    {\n        static void Main(string[]\
  \ args)\n        {\n            Console.WriteLine(\"The size of short is \" + sizeof(short));\n\
  \            Console.WriteLine(\"The size of int is \" + sizeof(int));\n       \
  \     Console.WriteLine(\"The size of long is \" + sizeof(long));\n            Console.ReadLine();\n\
  \        }\n    }\n}\n```\n**输出：**\n```\nThe size of short is 2\nThe size of int\
  \ is 4\nThe size of long is 8\n```\n**解释：**\n`sizeof(dataType);` 用于获取数据类型的大小（以字节为单位）。\n\
  \n### 运算符优先级\n下表列出了按优先级优先级排序的运算符。\n\n| 优先级 | 运算符 |\n| :--- | :--- |\n| 1 | `( )`\
  \ `.` `[ ]` `++a` `--a` `sizeof()` |\n| 2 | `*` `/` `%` |\n| 3 | `+` `-` |\n| 4\
  \ | `a++` `a--` |\n| 5 | `<<` `>>` |\n| 6 | `<` `>` `<=` `>=` `is` |\n| 7 | `==`\
  \ `!=` |\n| 8 | `&` `^` `\\|` |\n| 9 | `!` |\n| 10 | `&&` |\n| 11 | `\\|` |\n| 12\
  \ | `? :` |\n| 13 | `=` `*=` `/=` `%=` `+=` `-=` `<<=` `>>=` |\n\n同一单元格内的运算符具有相同的优先级。\n\
  \n### 总结\n| 运算符 |\n| :--- |\n| `+` |\n| `-` |\n| `*` |\n| `/` |\n| `%` |\n| `++`\
  \ or `--` |\n\n| 运算符 |\n| :--- |\n| `&&` |\n| `\\|` |\n| `!` |\n\n| 运算符 | 示例 |\n\
  | :--- | :--- |\n| `+=` | `x+=y` |\n| `-=` | `x-=y` |\n| `*=` | `x*=y` |\n| `/=`\
  \ | `x/=y` |\n| `%=` | `x%=y` |\n\n| 运算符 | 运行逻辑 |\n| :--- | :--- |\n| `>` | 大于 |\n\
  | `<` | 小于 |\n| `>=` | 大于等于 |\n| `<=` | 小于等于 |\n| `==` | 等于 |\n| `!=` | 不等于 |\n\
  | `(test-expression) ? (if-true-do-this) : (if-false-do-this);` | |\n| `++ a` |\
  \ `a` 先加 1，再执行表达式 |\n| `a++` | 先执行表达式，后 `a` 加 1 |\n| `-- b` | `b` 先减 1，再执行表达式 |\n\
  | `b--` | 先执行表达式，后 `b` 减 1 |\n\n### 练习题：递减 --a & b\n请打开 Visual C#，点击文件 (File) >\
  \ 新项目 (New Project) > 控制台应用 (Console Application)。输入文件名“MinusMinus”。在编辑器中编写 C# 代码：\n\
  \n```csharp\nusing System;\nnamespace MinusMinus\n{\n    class Program\n    {\n\
  \        static void Main(string[] args)\n        {\n            int a = 10, num;\n\
  \            num = --a - 3; /* 10 先减 1，然后 9 减 3，结果“6”将被赋值给 num */\n            Console.WriteLine(num);\n\
  \            int b = 10, var;\n            var = b-- - 3; /* 10 先减 3，将值 7 赋值给 var，然后\
  \ b 减 1*/\n            Console.WriteLine(var);\n            Console.ReadLine();\n\
  \        }\n    }\n}\n```\n**输出：**\n```\n6\n7\n```\n**解释：**\n`--a`: `a` 先减 1，再执行表达式。\n\
  `b--`: 先执行表达式，后 `b` 减 1。\n\n## 结构体类型 (Struct Types)\n结构体类型是一种值类型，通常用于封装一组相关的变量。对于具有值语义的数据结构，结构体非常有用。声明一个结构体类型的语法如下所示：\n\
  \n```csharp\npublic struct Student {\n    public int id;\n    public string name;\n\
  \    public int age;\n}\n```\n`public` 是访问修饰符。`Student` 是结构体类型。`id, name, age` 是三个结构体字段。\n\
  \n### 示例 2.9\n```csharp\npublic struct Car {\n    //  // 定义一个结构体类型\n    public int\
  \ price;      // 结构体字段\n    public string size;    // 结构体字段\n    public string color;\
  \    // 结构体字段\n}\n```\n\n### 结构体变量 (Struct Variable)\n声明结构体变量的语法如下：\n\n```csharp\n\
  Student Smith;\n```\n`Student` 是结构体类型。`Smith` 是结构体变量。\n\n### 示例 2.10\n```csharp\n\
  Car Ford;   // Car 是结构体类型 . Ford 是结构体变量\n```\n访问结构体字段的语法：\n```csharp\nStructVariable.field\n\
  ```\n\n### 示例 2.11\n`Smith.id` 表示 Smith 的 id。`Smith.name` 表示 Smith 的名字。`Smith.age`\
  \ 表示 Smith 的年龄。`Ford.price` 表示 Ford 的价格。`Ford.size` 表示 Ford 的尺寸。`Ford.color` 表示\
  \ Ford 的颜色。\n\n### 结构体的用法\n### 示例 2.12\n```csharp\nusing System;\nnamespace structSample\n\
  {\n    struct Student {\n        //  // 定义一个结构体类型\n        public int id;\n    \
  \    public string name;\n        public int age;\n    }\n    class Program\n  \
  \  {\n        static void Main(string[] args)\n        {\n            Student Smith;\n\
  \            Smith.id = 1001;\n            Smith.name = \"Andy\";\n            Smith.age\
  \ = 16;\n            Console.WriteLine(\"Student's id is \" + Smith.id);\n     \
  \       Console.WriteLine(\"Student's name is \" + Smith.name);\n            Console.WriteLine(\"\
  Student's age is \" + Smith.age);\n        }\n    }\n}\n```\n**输出：**\n```\n1001\n\
  Andy\n16\n```\n**解释：**\n`struct Student` 定义了一个结构体类型。`Student Smith` 定义了一个结构体变量。`Student.id`\
  \ 表示学生的 id。`Student.name` 表示学生的名字。`Student.age` 表示学生的年龄。\n\n### 枚举类型 (Enum Types)\n\
  枚举类型提供了一种组织良好的方式，用于定义一组可能的整型常量，这些常量可以赋值给变量。声明枚举类型的语法如下：\n\n```csharp\npublic enum\
  \ Today {Morning, Afternoon, Evening};\n```\n`public` 是访问修饰符。`Today` 是枚举类型。`Morning,\
  \ Afternoon, Evening` 是枚举成员。\n\n### 示例 2.13\n```csharp\nenum Week {\n    //  //\
  \ 定义一个枚举类型\n    Sunday,   // 枚举成员\n    Monday,  // 枚举成员\n    Tuesday  // 枚举成员\n\
  }\n```\n\n### 枚举变量 (Enum Variable)\n声明枚举变量的语法如下：\n\n```csharp\nToday t;\n```\n`Today`\
  \ 是枚举类型。`t` 是枚举变量。\n\n### 示例 2.14\n```csharp\nWeek w;   // Week 是枚举类型, w 是枚举变量\n\
  ```\n访问枚举成员的语法：\n```csharp\nEnumType.member\n```\n\n### 示例 2.15\n`Today.Morning`\
  \ 表示今天的早晨。`Today.Afternoon` 表示今天的下午。`Today.Evening` 表示今天的傍晚。`Week.Sunday` 表示周日。`Week.Monday`\
  \ 表示周一。`Week.Tuesday` 表示周二。\n\n### 枚举的用法\n### 示例 2.16\n```csharp\nusing System;\n\
  namespace enumExample\n{\n    public enum Today {\n        //  // 定义一个枚举类型\n   \
  \     morning,   // 枚举成员\n        afternoon, // 枚举成员\n        evening    // 枚举成员\n\
  \    }\n    class Program\n    {\n        static void Main(string[] args)\n    \
  \    {\n            Today t0, t1, t2;\n            t0 = Today.morning;\n       \
  \     t1 = Today.afternoon;\n            t2 = Today.evening;\n            Console.WriteLine(\"\
  Have a breakfast in \" + t0);\n            Console.WriteLine(\"Have a lunch in \"\
  \ + t1);\n            Console.WriteLine(\"Have a supper in \" + t2);\n         \
  \   Console.ReadLine();\n        }\n    }\n}\n```\n**输出：**\n```\nmorning\nafternoon\n\
  evening\n```\n**解释：**\n`enum Today` 定义了枚举类型 `Today`。`Today t0, t1, t2` 定义了三个枚举变量。`Today.morning`\
  \ 表示今天的早晨。`Today.afternoon` 表示今天的下午。`Today.evening` 表示今天的傍晚。\n\n\n\n\n\n`public`\
  \ 是一个访问修符。`Today` 是一个 `Enum` 类型。`Morning, Afternoon, Evening` 是三个枚举成员。\n\n## 练习：Car\
  \ 的 FeatureStruct 学习\n\n请打开 Visual C#，点击 `File > New Project > Console Application`。输入文件名\
  \ `structStudy`。在编辑器中编写 C# 代码：\n\n```csharp\nusing System;\nnamespace structStudy\n\
  {\n    public struct Car\n    {\n        // defines a struct type\n        public\
