  \            } finally { \n                // 必须执行\n                Console.WriteLine(\"\
  Exception has been handled! \"); \n                Console.ReadLine();\n       \
  \     }\n        }\n    }\n}\n```\nA. `try`, `catch`, `finally`\nB. `except`, `catch`,\
  \ `finally`\nC. `try`, `handle`, `finally`\nD. `try`, `catch`, `final` (18)\n\n\
