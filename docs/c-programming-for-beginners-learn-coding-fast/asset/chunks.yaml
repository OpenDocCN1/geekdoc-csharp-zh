  trans: "\n以下示例是一个查询，用于查找数组中所有为 10, 20, 30……的数字。\n\n示例 7.8\n```csharp\nusing System;\n\
    using System.Collections.Generic;\nusing System.Linq;\nnamespace LinqDemo\n{\n\
    \    class IntroToLINQ\n    {\n        static void Main()\n        {\n       \
    \     int[] MyArray = new int[6] { 10, 15, 20, 25, 30, 35};\n            var myQuery\
    \ = // myQuery 是一个变量\n                from item in MyArray // 创建一个 linq\n    \
    \            where (item % 10) == 0\n                select item;\n          \
    \  foreach (int item in myQuery)\n            {\n                Console.Write(item\
    \ + \"  \");\n            }\n            Console.ReadLine();\n        }\n    }\n\
    }\n```\n输出: 10   20   30\n\n解释： “`from…where…select…` ” 创建了一个 linq。“`from item\
    \ in MyArray`” 在 `MyArray` 数组上运行查询，“item” 代表数组中的每个项。“`where (item % 10) == 0`”\
    \ 检查每个项，以确定 `item` 除以 10 的余数是否为零。“`select item;`” 选择所有符合此标准的项。\n\n### 委托 (Delegate)\n\
    委托是一种引用类型，可以用于封装命名函数或匿名函数。具体来说，委托是一种在对象中持有函数引用的类型。\n\n使用委托的四个步骤：\n(1) 选择一个函数作为委托函数，例如：`public\
    \ static int myFunction(int a, int b) {}` // `myFunction(){ }` 被选为委托函数。\n(2) 声明一个委托函数，其参数应与被委托函数的参数相同，例如：`public\
    \ delegate int DelegateFun(int a, int b);` // `DelegateFun` 是一个委托函数。\n(3) 创建一个委托对象，其参数应该是被委托函数的名称，例如：`DelegateFun\
    \ delegateObj = new DelegateFun(myFunction);` // `delegateObj` 是一个委托对象。\n(4) 执行委托，例如：`delegateObj(arg1,\
    \ arg2);` // 调用委托函数，传递参数。\n\n委托示例 (1)\n示例 7.9\n```csharp\nusing System;\npublic\
    \ static int Sum(int a, int b) \n{ \n    // 这是一个被委托函数“Sum”\n    return a + b;\n\
    }\npublic delegate int DelegateFun(int a, int b); // 声明一个委托函数“DelegateFun”，其参数应与被委托函数“Sum”的参数相同\n\
    class Program\n{\n    public static void Main(string[] args)\n    {\n        DelegateFun\
    \ delegateObj = new DelegateFun(Sum); // 创建一个委托对象“delegateObj”，其参数应该是被委托函数的名称“Sum”\
    \ \n        Console.WriteLine(\"100 + 2 = \" + delegateObj(100, 2)); // 调用委托函数“Sum”，并传递参数\n\
    \        Console.ReadLine();\n    }\n}\n```\n输出: 100 + 2 = 102\n\n解释：\n`public\
    \ static int Sum(int a, int b) { }` // 这是一个被委托函数“Sum”\n`public delegate int DelegateFun(int\
    \ a, int b);` // 声明一个委托函数“DelegateFun”，其参数应与被委托函数“Sum”的参数相同\n`DelegateFun delegateObj\
    \ = new DelegateFun(Sum);` // 创建一个委托对象“delegateObj”，其参数应该是被委托函数的名称“Sum”\n`delegateObj(100,\
    \ 2);` // 调用委托函数“Sum”，并传递参数\n\n委托示例 (2)\n示例 7.10\n```csharp\nusing System;\nclass\
    \ Program\n{\n    public static int Division (int a, int b) \n    { \n       \
    \ // 被委托函数\n        return a / b;   \n    }\n    public static int Multiply (int\
    \ a, int b) \n    { \n        // 被委托函数\n        return a * b;   \n    }\n    public\
    \ static int Subtract (int a, int b) \n    {   \n        // 被委托函数\n        return\
    \ a - b;\n    }\n    public delegate int DelegateFun (int a, int b); // 声明委托\n\
    \    public static void Main(string[] args)\n    {   \n        // 创建委托对象\n   \
    \     DelegateFun delegateObj1 = new DelegateFun(Division);\n        DelegateFun\
    \ delegateObj2 = new DelegateFun(Multiply);\n        DelegateFun delegateObj3\
    \ = new DelegateFun(Subtract);\n        Console.WriteLine(\"100 / 2 = \" + delegateObj1(100,\
    \ 2)); // 调用\n        Console.WriteLine(\"100 * 2 = \" + delegateObj2(100, 2));\
    \ // 调用\n        Console.WriteLine(\"100 - 2 = \" + delegateObj3(100, 2)); //\
    \ 调用\n        Console.ReadLine();\n    }\n}\n```\n输出: ![](img/rsrc597.jpg)\n\n\
    解释：使用委托的四个步骤：\n1. 选择一个函数作为委托函数。\n2. 声明一个委托函数。\n3. 创建一个委托对象。\n4. 调用委托函数。\n\n###\
    \ 总结\n- “`public` 访问修饰符具有最宽松的访问权限。访问 public 类型或类型成员没有任何限制。”\n- “`private` 访问修饰符具有最低的访问权限。只有在定义它的类内部才能访问其私有成员。”\n\
    - “`protected` 访问修饰符具有有限的访问权限。保护成员可以被派生类访问。具体来说，基类的保护成员可以被派生类的实例访问。”\n- “`get\
    \ & set` 访问器”通常用于从私有字段检索和存储值。`get` 方法用于读取值，`set` 方法用于写入值。\n- `LINQ` 代表语言集成查询（Language\
    \ Integrated Query），是微软用于查询所有类型数据的一种技术。\n\n### 练习：私有成员\n（此处根据上下文逻辑推断为私有成员的练习内容）\n"
- fmt: "\n## Static Variables\n\n| `static dataType variable;className. variable;`\
    \ |\n\n`static` declaration means that the variable belongs to a class. `className.\
    \ variable;` means that a class can reference this static variable directly.\n\
    \n**Example 8.3**\n```csharp\nusing System;\nnamespace StaticVariable\n{\n   \
    \ class MyClass\n    {\n        public static int num = 100;  // define a static\
    \ variable\n        static void Main(string[] args)\n        {\n            Console.\
    \ Write(MyClass.num );  // class references a variable\n            Console. ReadLine();\n\
    \        }\n    }\n}\n```\n**Output:** 100\n**Explanation:**\n`static int num`\
    \ defines a static variable `num` that can be referenced by a class. `MyClass.\
    \ num` means a class `MyClass` can reference a static variable `num` directly.\
    \ Non-static variable is referenced only by the object, not by class.\n\n## Static\
    \ Methods\n\nStatic method can be referenced by a class. Non-static method is\
    \ referenced only by the object, not by class.\n\n| `static dataType method( );className.\
    \ method( );` |\n\n`static` declaration means that the method belongs to a class.\
    \ `className. method( );` means that a class can reference this static method\
    \ directly.\n\n**Example 8.4**\n```csharp\nusing System;\nnamespace StaticVariable\n\
    {\n    class MyClass\n    {\n        public static int myMethod() { return 200;}\
    \  /* define a static method */\n        static void Main(string[] args)\n   \
    \     {\n            Console. Write(MyClass.myMethod() );  /* class references\
    \ the method */\n            Console. ReadLine();\n        }\n    }\n}\n```\n\
    **Output:** 200\n**Explanation:**\n`static int myMethod()` defines a static method\
    \ that can be referenced by a class. `MyClass. myMethod ()` means a class `MyClass`\
    \ references a static method `myMethod()`. Non-static method is referenced only\
    \ by the object, not by class.\n\n## Polymorphism\n\nPolymorphism describes the\
    \ ability to perform different method for different objects.\n\n| `virtual public\
    \ method(){ }` // defines a virtual method |\n| `public override method(){ }`\
    \ // overrides the virtual method |\n\nPolymorphism is completed by `virtual method`\
    \ and `override method` together.\n\n**Example 8.5**\n```csharp\nusing System;\n\
    namespace PolymorphismDemo\n{\n    class Program\n    {\n        class Animal\n\
    \        {\n            virtual public void cry( ) {  // defines a virtual method\n\
    \                Console. WriteLine(\"crying...... \");\n            }\n     \
    \   }\n        class Dog: Animal\n        {\n            public override void\
    \ cry( ) {     // overrides the virtual method\n                Console. WriteLine(\"\
    Wow, Wow...... \");\n            }\n        }\n        class Cat: Animal\n   \
    \     {\n            public override void cry( ) {  // overrides the virtual method\n\
    \                Console. WriteLine(\"Meow, Meow...... \");\n                Console.\
    \ ReadLine();\n            }\n        }\n        static void Main(string[] args)\n\
    \        {\n            Animal animalVar;\n            animalVar = new Dog( );\n\
    \            animalVar. cry( );\n            animalVar = new Cat( );\n       \
    \     animalVar. cry( );\n        }\n    }\n}\n```\n**Output:** Wow, Wow……Meow,\
    \ Meow……\n**Explanation:**\n`animalVar = new dog( )` creates a dog object, therefore,\
    \ `animalVar. cry( )` calls a method `cry( )` in subclass `Dog`, and overrides\
    \ the virtual method. `animalVar = new cat( )` creates a cat object, therefore,\
    \ `animalVar. cry( )` calls a method `cry( )` in subclass `Cat`, and overrides\
    \ the virtual method.\n\n## Write a File\n\nTo write a file, you should add a\
    \ directive `Using System. IO;` and a class `StreamWriter`. The syntax to create\
    \ a file object looks like this:\n\n| `StreamWriter file = new StreamWriter(\"\
    c:\\\\myFile. txt\", true);` |\n\n`StreamWriter file = new StreamWriter(\"c:\\\
    \\myFile. txt\", true);` creates a file object `file`, which is used to write\
    \ text. `C:\\\\myFile. txt` specifies the path and a file to write. `true` means\
    \ appending text. If no `true`, means overwriting text.\n\n**Example 8.6**\n```csharp\n\
    using System;\nusing System. Text;\nusing System. IO;\nnamespace WriteFile\n{\n\
    \    class WriteTextFile\n    {\n        static void Main()\n        {\n     \
    \       string myText = \"VB in 8 Hours\";\n            StreamWriter file = new\
