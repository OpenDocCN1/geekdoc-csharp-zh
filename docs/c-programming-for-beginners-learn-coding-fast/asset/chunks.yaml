  trans: "\n\n`throw new exception();` 可以为当前代码抛出异常。\n\n### 示例 5.7\n```csharp\nusing\
    \ System;\nnamespace trycatch{\n    class Program{\n        static void Main(string[]\
    \ args){\n            try{\n                int a, b = 0;\n                if\
    \ (b == 0){\n                    throw new Exception (\"b is zero, Exception occurred!\
    \ \");\n                    // 抛出一个异常对象\n                }\n                a\
    \ = 100 / b;\n            }\n            catch (Exception ex){\n             \
    \   // 处理异常\n                Console.WriteLine(ex.Message); // 异常消息\n        \
    \        Console.ReadLine();\n            }\n        }\n    }\n}\n```\n输出：`b is\
    \ zero, Exception occurred!`\n解释：`throw new exception();` 为当前代码抛异常。如果 `b` 等于零，`a/b`\
    \ 将报错。发生了异常！\n\n### 列表 A\n`List` 是一个可以根据需要更改的动态数组。`List` 中的元素可以添加、插入、计数和清空。\n\
    创建列表的语法如下：\n\n| `List<int> MyList = new List<int>(0, 1, 2,…);` |\n\n访问列表的语法如下：\n\
    \n| `MyList[0];MyList[1];MyList[2];……` |\n\n### 示例 5.8\n```csharp\nusing System;\n\
    using System.Collections.Generic;\nnamespace ListDemo{\n    class Program{\n \
    \       static void Main(string[] args){\n            List<int> MyList = new List<int>{10,11,12,13};\
    \ // 创建列表\n            Console.Write(MyList[0] +\"  \");\n            Console.Write(MyList[1]\
    \ +\"  \");\n            Console.Write(MyList[2] +\"  \");\n            Console.Write(MyList[3]\
    \ +\"  \");\n            Console.ReadLine();\n        }\n    }\n}\n```\n输出：`10\
    \  11  12  13`\n解释：`List<int> MyList = new List<int>{10,11,12,13};` 创建了一个包含四个项的列表。`MyList[0]`\
    \ 访问第 0 个元素。`MyList[1]` 访问第 1 个元素。`MyList[2]` 访问第 2 个元素。\n注意：`List` 的索引从零开始。\n\
    \n### 访问列表元素\n访问 `List`元素的语法如下：\n\n| `foreach (var elements in MyList) {}` |\n\
    \n例如：\n```csharp\nusing System;\nusing System.Collections.Generic;\nnamespace\
    \ ListDemo{\n    class Program{\n        static void Main(string[] args){\n  \
    \          List<int> MyList = new List<int> { 10, 11, 12, 13 };\n            foreach\
    \ (var elements in MyList) {\n                // 访问所有元素\n                Console.Write(elements\
    \ + \" \");\n            }\n            Console.ReadLine();\n        }\n    }\n\
    }\n```\n输出：`10 11 12 13`\n解释：`foreach (var elements in MyList){ }` 访问 `MyList`\
    \ 中的所有元素，并将所有值赋给变量 `elements`。\n\n### 列表方法\n| `Add()` | // 添加元素 |\n| `Insert()`\
    \ | // 插入元素 |\n| `Reverse()` | // 反转元素顺序 |\n| `Remove()` | // 移除一个元素 |\n| `Clear()`\
    \ | // 清空所有元素 |\n| `IndexOf()` | // 返回元素的索引 |\n| `Count` | // 返回元素数量 |\n\n###\
    \ 示例 5.9\n```csharp\nusing System;\nusing System.Collections.Generic;\nnamespace\
    \ ListDemo{\n    class Program{\n        static void Main(string[] args){\n  \
    \          List<int> MyList = new List<int>{10,11,12,13};\n            MyList.Add(14);\
    \ // 现在变为 {10,11,12,13,14}\n            MyList.Insert(3,100); // 现在变为 {10,11,12,100,13,14}\n\
    \            MyList.IndexOf(100); // 返回索引 3\n            MyList.Reverse(); //\
    \ 现在变为 {14,13,100,12,11,10}\n            MyList.Remove(100); // 现在变为 {14,13,12,11,10}\n\
    \            Console.Write(MyList.Count); // 现在有五个元素\n            Console.ReadLine();\n\
    \        }\n    }\n}\n```\n输出：`5`\n解释：\n| `Add()` | // 添加元素 |\n| `Insert()` |\
    \ // 插入元素 |\n| `Reverse()` | // 反转元素顺序 |\n| `Remove()` | // 移除一个元素 |\n| `Clear()`\
    \ | // 清空所有元素 |\n| `IndexOf()` | // 返回元素的索引 |\n| `Count` | // 返回元素数量 |\n\n###\
    \ 总结\n函数是一个可以重复运行的代码块。要定义函数，请使用 `type functionName ( ) { }`。\n要调用函数，请使用 `functionName\
    \ ( );`。\n函数括号内可以有一个有一个或多个参数。参数用于将数据传递给函数，使用 `type functionName (type arg) { }`。\n\
    要调用函数，使用 `functionName (argument);`。\n`return` 可以向值返回给调用者。\n`try {… …}` 在发生异常错误时会将异常抛出到\
    \ `catch( ) { }` 块。\n`catch( ){  }` 捕获 `try` 块中的任何异常并处理它。\n`exception.Message`\
    \ 显示异常消息。\n`finally` 块包含必须执行的代码。\n`throw new exception();` 可以为当前代码抛出异常。\n`List`\
    \ 是一个可以根据需要更改的动态数组。\n\n### 练习：发生错误！异常 示例\n请打开 Visual C#，点击文件 > 新项目 > 控制台应用程序。输入文件名\
    \ `TryAndCatch`。\n在编辑器中编写 C# 代码：\n```csharp\nusing System;\nnamespace TryAndCatch{\n\
    \    class Program{\n        static void Main(string[] args){\n            try{\n\
    \                // 可能会发生异常\n                int[] myArr = {0,1,2,3};\n      \
    \          myArr[4] = 4; // 发生异常\n            }\n            catch (Exception\
    \ ex){\n                // 处理异常\n                Console.WriteLine(ex.Message);\
    \ // 异常消息\n                Console.ReadLine();\n            }\n        }\n   \
    \ }\n}\n```\n保存文件，点击“开始调试”运行程序。\n输出：`Index was outside the bounds of array.`\n\
    解释：数组的索引从零开始。`myArr = {0,1,2,3};` 有四个元素，最后一个元素的索引是 3。`myArr[4]` 访问的是一个不存在的元素。`ex.Message`\
    \ 显示异常消息。\n\n# 第 6 章\n## 类与对象\n\n### 类声明\n类是相关对象的类别。`Class` 是一种类型。例如，如果 `Car`\
    \ 是一个类，那么卡车、面包车、巴士、出租车和客车都是对象。\n\n| `public class ClassName{ // 声明一个类;成员; }` |\n\
    \n- `public` 是访问修饰符。\n- `class` 是声明类的关键字。\n- `member` 是一些方法、属性和常量……\n在类中，函数被称为\
    \ `method`（方法），变量被称为 `property`（属性）。\n\n### 示例 6.1\n```csharp\npublic class Color{\n\
    \   // 声明一个类“Color”\n   public string c1; // 属性成员\n   public string c2; // 属性成员\n\
    \   public void brightness( ){ // 方法成员\n   Console.Write(\"……\");\n   }\n}\n```\n\
    \n### 对象声明\n对象是类的实例。\n\n| `obj = new ClassName( ); // 创建一个对象 obj.variable;obj.method(\
    \ );` |\n\n- `obj = new ClassName( );` 为该类创建一个名为 `obj` 的新对象。\n- `obj.variable`\
    \ 意味着 `obj` 引用一个变量。\n- `obj.method( );` 意味着 `obj` 引用一个方法。\n\n### 示例 6.2\n```csharp\n\
    Color obj = new Color( ); // 创建一个对象“obj”\nobj.c1= \"yellow\"; // 对象引用变量\nobj.c2=\"\
    purple\"; // 对象引用变量\nobj.brightness ( ); // 对象引用方法\n```\n解释：`Color obj = new Color;`\
    \ 创建了一个名为 `obj` 的对象。`obj.c1` 意味着 `obj` 引用变量 `c1`。`obj.c2` 意味着 `obj` 引用变量 `c2`。`obj.brightness\
    \ ( );` 调用对象的方法 `brightness( ){ }`。\n\n### 类与对象示例\n```csharp\nusing System;\n\
    namespace ClassAndObject{\n    class Program{\n        public class Color {\n\
    \           // 声明一个类“Color”\n           public string c1; // 属性成员\n          \
    \ public string c2; // 属性成员\n           public void brightness( ){ // 方法成员\n \
    \          Console.WriteLine(\"The color of this flower is \"+ c1);\n        \
    \   Console.WriteLine(\"The color of that flower is \"+ c2);\n           Console.ReadLine();\n\
    \        }\n        static void Main(string[] args){\n            Color obj =\
    \ new Color( ); // 创建一个对象“obj”\n            obj.c1=\"yellow\"; // 对象引用变量\n   \
    \         obj.c2=\"purple\"; // 对象引用变量\n            obj.brightness ( ); // 对象引用方法\n\
    \        }\n    }\n}\n```\n输出：\n`The color of this flower is yellow`\n`The color\
    \ of that flower is purple`\n\n### 构造函数\n构造函数用于初始化变量。构造函数的名称与类名相同。\n\n| `class\
    \ ClassName{ClassName( ) { …} //这是一个构造函数}` ` |\n\n"
- fmt: "\n`ClassName{ …}` defines a class. `ClassName( ) { …}` declares a constructor.\
    \ Whenever an object is created, the constructor will be called automatically.\n\
    \n### Example 6.3\n```csharp\npublic class Color {\n    String c1, c2;\n    Color\
    \ ( ) {\n        c1=\"yellow\";\n        c2=\"purple\";\n    } // constructor\n\
    }\n```\nExplanation: `Color ( ) { c1=\"yellow\"; c2=\"purple\"; }` is a constructor.\
    \ It initializes variable `c1` as “yellow” and `c2` as “purple”. The constructor\
    \ will be called when an object is created.\n\n### Constructor Example\nExample:\n\
    ```csharp\nusing System;\nnamespace ClassAndObject{\n    class Program{\n    \
    \    public class Color{\n            // declares a class “Color”\n          \
    \  public string c1;\n            // property member\n            public string\
    \ c2;\n            // property member\n            public Color( ){\n        \
    \        c1=\"yellow\";\n                c2=\"purple\";\n            } // constructor\n\
    \            public void brightness(){\n                // method member\n   \
    \             Console.WriteLine(\"The color of this flower is \" + c1);\n    \
    \            Console.WriteLine(\"The color of that flower is \" + c2);\n     \
    \           Console.ReadLine();\n            }\n        }\n        static void\
    \ Main(string[] args){\n            Color obj = new Color(); //create an object\
    \ “obj”,call constructor\n            obj.brightness(); // object references a\
    \ method\n        }\n    }\n}\n```\nOutput:\n```\nThe color of this flower is\
    \ yellow\nThe color of that flower is purple\n```\n\n### Destructors\n`Destructor`\
    \ is used to release the memory occupation, clean up the constructor data.\n\n\
    | ~ destructor( ); |\n\nDestructor name is the same as class name, but it is preceded\
    \ by a `~` symbol. The destructor has no any arguments, and has no return value.\n\
    \n### Example 6.4\n```csharp\npublic class Color { \n    // define a class\n \
    \   String c1, c2;\n    Color ( ) {\n        c1=\"yellow\";\n        c2=\"purple\"\
    ;\n    } // constructor\n    ~ Color ( ); // This is a destructor .\n}\n```\n\
    Explanation: `~ Color ( );` is a destructor, releasing the memory. The declaration\
    \ of destructor always follows the constructor.\n\n### Overloading\nOverloading\
    \ means that there are two or more same-name methods in a class, and their arguments\
    \ are different.\n\n### Example 6.5\n```csharp\nusing System;\nnamespace Overloading{\n\
    \    class Color {\n        // declare a class “Color”\n        String x, y; //\
    \ declare two variable members\n        Color( String a, String b) { x = a; y\
    \ = b; } // constructor\n        Color() { x = \"yellow \"; y = \"purple \"; }\
    \ // constructor\n        static void Main(string[] args){\n            Color\
    \ obj1 =new Color(\"green \", \"orange \");\n            Color obj2 =new Color();\n\
    \            Console.WriteLine(obj1. x + obj1. y);\n            Console.WriteLine(obj2.\
    \ x + obj2. y);\n            Console.ReadLine();\n        }\n    }\n}\n```\nOutput:\n\
    ```\ngreen  orange\nyellow  purple\n```\nExplanation: `class Color` creates an\
    \ object `Color`. `Color( String a, String b){}` defines a constructor with arguments.\
    \ `Color(){}` defines a constructor without argument. In this class, there are\
    \ two methods named `Color( )` with different argument, which are known as “overloading”.\
    \ `Color obj1 =new Color(\"green \", \"orange \");` creates an object `obj1`,\
    \ calls the constructor `Color(…){}`, and passes two arguments to the constructor.\
    \ `Color obj2 =new Color();` creates an object `obj2`, and calls the constructor\
    \ `Color(){}`. `object property` means an object references a variable.\n\n###\
    \ `this` Keyword\n`this` is used to represent a current object.\n\n### Example\
    \ 6.6\n```csharp\nusing System;\nnamespace thisExample{\n    class MyClass{\n\
    \        int num;\n        void test(int num){\n            this.num = num; //\
    \ this represents the current object\n            Console.Write(this.num);\n \
    \       }\n        static void Main(string[] args){\n            MyClass obj =\
    \ new MyClass(); // create an object “obj”\n            obj.test(10);\n      \
    \      Console.ReadLine();\n        }\n    }\n}\n```\nOutput:\n```\n10\n```\n\
    Explanation: In above, when `obj.test(10)` calls `test( ){ }` method, `this` signifies\
    \ the object `obj`.\n\n### Inheritance\nA class can be inherited by its derived\
    \ class. The object in derived class can be treated as the object in base class.\
    \ Derived class inherits base class as following:\n\n| derived class: base class\
    \ |\n\n`:` is a symbol of inheritance.\n\n### Example 6.7\n```csharp\nclass Computer\
    \ { \n    // this is a base class\n    // base class member\n    ...\n}\nclass\
    \ Laptop: public Computer { \n    // inheritance\n    // derived class member\n\
    \    ...\n}\n```\nExplanation: `Laptop` is a derived class, `Computer` is a base\
    \ class. `Laptop` class inherits `Computer` class. The derived class inherits\
    \ all public members in base class.\n\n### Using Derived class\nAn object of the\
    \ derived class can access the public member of a base class.\n\n### Example 6.8\n\
    ```csharp\nusing System;\nnamespace inheritance{\n    public class program{\n\
    \        class Computer {\n            // declare a base class\n            public\
    \ void display(){\n                Console.WriteLine(\"Computer OK\");\n     \
    \           Console.ReadLine();\n            }\n        }\n        class Laptop\
    \ : Computer {\n            // inheritance\n            // derived class's member\
    \ in here\n        }\n        static void Main(string[] args){\n            Laptop\
    \ Lt = new Laptop(); // derived class creates an object Lt\n            Lt.display();\
    \ // Lt calls base class's method\n        }\n    }\n}\n```\nOutput:\n```\nComputer\
    \ OK!\n```\nExplanation: `Lt.display( );` means a derived class object `Lt` calls\
    \ base class’s method because an object of the derived class can access the public\
    \ member of a base class.\n\n### Overriding\nThe method of derived class can override\
    \ the method of the base class, if names are the same and arguments are the same.\n\
    \n### Example 6.9\n```csharp\nusing System;\nnamespace Overriding{\n    class\
    \ Program{\n        class Computer {\n            // base class\n            public\
    \ void harddrive(){ Console.WriteLine(\"5T\"); }\n            public void memory()\
    \ { Console.WriteLine(\"4G\"); Console.ReadLine(); }\n        }\n        class\
    \ Laptop: Computer {\n            // derived class\n            public void harddrive(){\
    \ Console.WriteLine(\"10T\"); }\n            public void memory() { Console.WriteLine(\"\
    8G\"); Console.ReadLine(); }\n        }\n        static void Main(string[] args){\n\
    \            Laptop myLaptop = new Laptop(); // creates an object\n          \
    \  myLaptop.harddrive();\n            myLaptop.memory();\n        }\n    }\n}\n\
    ```\nOutput:\n```\n10T\n8G\n```\nExplanation: The method name `harddrive( )` and\
    \ `memory( )` in the base class is the same as the one in the derived class. Therefore,\
    \ the method in derived class can override the method in base class. `myLaptop.harddrive(\
    \ );` calls the method in the derived class, and the output is `10T`. `myLaptop.memory(\
    \ );` calls the method in the derived class, and the output is `8G`.\n\n### Sealed\
    \ keyword\nThe `sealed` keyword is used to forbid the inheritance from a base\
    \ class. And the `sealed` keyword can also prevent overriding the method in base\
    \ class.\n\nFor Example:(1)\n```csharp\nsealed class MyClass{\n    ...\n}\n```\n\
    The `sealed` prevents the inheritance from `MyClass`, so `MyClass` cannot have\
    \ a derived class. (2)\n```csharp\nsealed public void myMethod(){\n    ...\n}\n\
    ```\nThe `sealed` prevents overriding `myMethod`, so `myMethod` cannot be overridden.\n\
    \n### Summary\n| public class ClassName;{\n    // declare a Class\n    // members\n\
    } |\n\n| obj = new ClassName(); // create an object\nobj.variable; // obj references\
    \ a variable\nobj.method(); // obj references a method |\n\n| class ClassName{\n\
    \    ClassName( ) { ... } // This is a constructor\n} |\n\n| ~ destructor( );\
    \ // This is a destructor |\n"
