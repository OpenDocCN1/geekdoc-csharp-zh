  trans: "\n\n重载（Overloading）意味着类中存在两个或多个同名的方法，它们的参数不同。`this` 用于表示当前对象。重写（Overriding）意味着派生类可以覆盖基类的方法，前提是方法名和参数相同。继承（Inheritance）：类可以被其派生类继承。派生类对象可以被视为基类对象。派生类的对象可以访问基类的公共成员。`sealed`\
    \ 关键字用于禁止继承基类。此外 `sealed` 关键字也可以防止重写基类中的方法。\n\n## 练习：狗与猫\n\n### 类与对象\n请打开 Visual\
    \ C#, 点击 `File > New Project > Console Application`。输入文件名 `ClassAndObject`。在编辑器中编写\
    \ C# 代码：\n\n```csharp\nusing System;\nnamespace Overloading{\nclass Animal {\n\
    \  // declare a class \"Animal\"\n  String dog, cat;\n  // declare two variable\
    \ members\nAnimal() {dog = \"black. \"; cat = \"white. \";}  // constructor\n\
    static void Main(string[] args){\nAnimal pet = new Animal();    // create an object\
    \ “pet”\nConsole. WriteLine(\"This dog's color is \" + pet. dog);\nConsole. WriteLine(\"\
    This cat's color is \" + pet. cat);\nConsole. ReadLine();\n}}}\n```\n\n保存文件，点击\
    \ `Start Debugging` 运行程序。\n\n**输出：**\nThis dog’s color is black.\nThis cat’s color\
    \ is white.\n\n**解释：**\n`class Animal` 声明了一个类 `Animal`。`Animal() {…}` 定义了一个构造函数。构造函数的名称始终与类名相同。`Animal\
    \ pet = new Animal();` 创建了一个对象 `pet`，并自动调用构造方法。`pet. dog` 意味着 `pet` 的 `dog`，对象\
    \ `pet` 引用了变量 `dog`。`pet. cat` 意味着 `pet` 的 `cat`，对象 `pet` 引用了变量 `cat`。\n\n## 第\
    \ 7 章：访问修饰符\n\n### 公共 (Public)\n`public` 访问修饰符用于类型和类型成员。它具有最高权限访问级别。访问公共类型或类型成员没有任何限制。\n\
    \n**示例 7.1**\n```csharp\nusing System;\nnamespace PublicModifier{\nclass PublicDemo{\n\
    public int a;  // declare a public variable\npublic int b;  // declare a public\
    \ variable\n}\nclass Program{\nstatic void Main(string[] args){\nPublicDemo obj\
    \ = new PublicDemo();\nobj. a = 100;  // access the public member\nobj. b = 200;\
    \  // access the public member\nConsole. WriteLine(\"a=\" + obj. a);\nConsole.\
    \ WriteLine(\"b=\" + obj. b);\nConsole. ReadLine();\n}}}\n```\n**输出：**\na = 100\n\
    b = 200\n\n**解释：**\n`public int a;` 和 `public int b;` 声明了两个公共变量，任何对象都可以访问它们。`obj.\
    \ a = 100;` 和 `obj. b = 200;` 访问另一个类中的两个公共变量 `a` 和 `b`。\n\n### 私有 (Private)\n\
    `private` 访问修饰符用于类型和类型成员。它具有最低权限访问级别。私有成员只能在定义的类体内被访问。类 `A` 中的私有成员无法从类 `B` 访问。在定义它的类外部引用私有成员将报错。\n\
    \n**示例 7.2**\n```csharp\nusing System;\nnamespace PrivateModifier{\nclass privateDemo{\n\
    private int a;     // declare a private variable\nprivate int b;     // declare\
    \ a private variable\n}\nclass Program{\nstatic void Main(string[] args){\nprivateDemo\
    \ obj = new privateDemo();\nobj.a = 100;      // access the private member, error\
    \ !\nobj.b = 200;      // access the private member, error !\nConsole. WriteLine(\"\
    a=\" + obj. a);\nConsole. WriteLine(\"b=\" + obj. b);\nConsole. ReadLine();\n\
    }}}\n```\n**输出：**\nError!\n`a` is inaccessible due to its protection level.\n\
    `b` is inaccessible due to its protection level.\n\n**解释：**\n编译失败！`a` & `b` 是两个私有变量，不能在当前类之外访问。私有成员只能被同类中的代码访问。\n\
    \n**注意：** 下面的示例是一个成功访问私有成员的程序。\n\n**示例 7.3**\n```csharp\nusing System;\nnamespace\
    \ PrivateModifier{\nclass PrivateDemo{\nprivate int a = 100;  // declare a private\
    \ variable\nprivate int b = 200;  // declare a private variable\npublic void accessVariable(){\n\
    Console. WriteLine(\"a = \" + a);  // access private variable, ok !\nConsole.\
    \ WriteLine(\"b = \" + b);  // access private variable, ok !\nConsole. ReadLine();\n\
    }}\nclass Program{\nstatic void Main(){\nPrivateDemo obj = new PrivateDemo();\n\
    obj. accessVariable();    // call the public method, ok !\n}}}\n```\n**输出：**\n\
    a = 100\nb = 200\n\n**解释：**\n编译成功！`a` & `b` 是两个私有变量，可以在同类内部访问。私有成员只能被同类中的代码访问。\n\
    \n### 保护 (Protected)\n`protected` 访问修饰符用于类型和类型成员。受保护成员可以被派生类的实例访问。也就是说，基类的保护成员可以被派生类中的访问访问。\n\
    \n**示例 7.4**\n```csharp\nusing System;\nnamespace ProtectedModifier{\nclass A{\n\
    protected int p = 100 ;      // declare a protected variable\n}\nclass B : A{\n\
    static void Main(){\nA a = new A();            // create an object of the base\
    \ class\nConsole. WriteLine(a.p );   // access protected variable, error !\nConsole.\
    \ ReadLine();\n}}}\n```\n**输出：**\nError! Cannot access protected member.\n\n**解释：**\n\
    编译失败！`a` 是来自基类的对象，它无法访问保护成员 `p`。只有派生类的对象可以访问保护成员。\n\n**注意：** 基类的保护成员可以被派生类中的对象访问。下面的示例是一个成功访问保护成员的程序。\n\
    \n**示例 7.5**\n```csharp\nusing System;\nnamespace ProtectedModifier{\nclass A{\n\
    protected int p = 100 ;    // declare a protected variable\n}\nclass B : A{\n\
    static void Main(){\nB b = new B();            // create an object of derived\
    \ class\nConsole. WriteLine(b.p );   // access protected variable, ok !\nConsole.\
    \ ReadLine();\n}}}\n```\n**输出：**\n100\n\n**解释：**\n编译成功！`b` 是派生类的对象，它可以访问保护成员 `p`。只有派生类的对象可以访问保护成员。\n\
    \n**注意：** 保护成员也可以被同类中的代码访问。下面的示例是一个成功访问保护成员的程序。\n\n**示例 7.6**\n```csharp\nusing\
    \ System;\nnamespace ProtectedDemo{\nclass protectedDemo{\nprotected int a = 800;\
    \   // declare a protected variable\nprotected int b = 1000;  // declare a protected\
    \ variable\nprotected int sum;      // declare a protected variable\npublic void\
    \ accessVariable(){\nsum = a + b;            // access the protected variables,\
    \ ok !\nConsole. WriteLine(\"a + b = \" + sum);\nConsole. ReadLine();\n}}\nclass\
    \ Program{\nstatic void Main(){\nprotectedDemo obj = new protectedDemo();\nobj.\
    \ accessVariable();   // call the public method\n}}}\n```\n**输出：**\na + b = 1800\n\
    \n**解释：**\n编译成功！保护成员也可以被同类中的代码访问。\n\n### 获取与设置 (Get & Set)\n`get & set` 访问访问器通常用于从私有字段检索和存储值。`get`\
    \ 方法用于读取值。`set` 方法用于写入值。例如：\n\n```csharp\nprivate int number;\npublic int LuckyNumber{\n\
    \  // create a property access\n  get {\n    // read the value\n    return number;\n\
    \  }\n  set {\n    // write the value\n    number = value;\n  }\n}\n```\n\n"
- fmt: "\nThe `LuckyNumber` is a property accessor, reading or writing the value of\
    \ `number`.\n\n### Example 7.7\n\n```csharp\nusing System;\npublic class Lottery{\n\
    \    private int number;\n    public int LuckyNumber {\n        // create a property\
    \ accessor\n        get {\n            // read the value\n            return number;\n\
    \        }\n        set {\n            // write the value\n            number\
    \ = value;\n        }\n    }\n    public void print() {\n        Console.WriteLine(\"\
    Lucky Number is: \" + number);\n        Console.ReadLine();\n    }\n}\npublic\
    \ class MainClass{\n    public static void Main() {\n        Lottery lot = new\
    \ Lottery();\n        lot.LuckyNumber = 16888; // reference the property accessor\n\
    \        lot.print();\n    }\n}\n```\n\n**Output:**\n`Lucky Number is: 16888`\n\
    \n**Explanation:**\n- `public int LuckyNumber{ }` creates a property accessor.\n\
    - `get{ }` reads the value of the `number`.\n- `set{ }` writes the value of the\
    \ `number`.\n- `lot.LuckyNumber = \"16888\"` references the property accessor.\n\
    \n### LINQ\n`LINQ` stands for Language Integrated Query, which is a kind of Microsoft’s\
    \ technology for querying data of all types. The syntax to create a linq looks\
    \ just like this:\n\n| from ……where……select…… |\n"
