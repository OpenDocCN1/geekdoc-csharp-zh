  trans: "\n\n`(Data Type)` 指定了要转换的数据类型。\n\n### 示例 1.11\n```csharp\nusing System;\n\
    namespace TypyConvert{\n    class Program{\n        static void Main(string[]\
    \ args){\n            float oldValue = 20.123f, newValue;\n            newValue\
    \ = (int)oldValue; // 数据类型\n            Console.WriteLine(newValue);\n       \
    \     Console.ReadLine();\n        }\n    }\n}\n```\n输出：`20`\n解释：`newValue = (int)oldValue;`\
    \ 将数据类型从 `float` 转换为 `int`。\n\n### 装箱 (Boxing)\n变量的 `int` 类型转换为 `object` 类型，或者值类型转换为引用类型，这被称为“装箱”。\n\
    \n| `object newVariable = (object) oldVariable;` |\n\n`oldVariable` 的 `int` 类型可以转换为\
    \ `newVariable` 的 `object` 类型。\n\n### 示例 1.12\n```csharp\nusing System;\nnamespace\
    \ Boxing{\n    class Program{\n        static void Main(string[] args){\n    \
    \        int var1 = 100;\n            object var2 = (object)var1; // 装箱\n    \
    \        Console.WriteLine(\"The data type of var2 is object type now. \");\n\
    \            Console.ReadLine();\n        }\n    }\n}\n```\n输出：`The data type\
    \ of var2 is object type now.`\n解释：`object var2 = (object)var1;` 将 `var1` 的 `int`\
    \ 类型转换为 `object` 类型。\n\n### 解箱 (Unboxing)\n变量的 `object` 类型转换为 `int` 类型，或者引用类型转换为值类型，这被称为“解箱”。\n\
    \n| `int newVariable = (int) oldVariable;` |\n\n`oldVariable` 的 `object` 类型可以转换为\
    \ `newVariable` 的 `int` 类型。\n\n### 示例 1.13\n```csharp\nusing System;\nnamespace\
    \ Boxing{\n    class Program{\n        static void Main(string[] args){\n    \
    \        int var1 = 100;\n            object var2 = (object)var1; // 装箱\n    \
    \        int var3 = (int)var2; // 解箱\n            Console.WriteLine(\"The data\
    \ type of var3 is int type now.\");\n            Console.ReadLine();\n       \
    \ }\n    }\n}\n```\n输出：`The data type of var3 is int type now.`\n解释：`int var3\
    \ = (int)var2;` 将 `var2` 的 `object` 类型转换为 `int` 类型。\n\n### 总结\nC# 有两类数据类型：\n1.\
    \ 值类型：整数 (integer)、数字 (decimal)、字符 (char)、bool。\n2. 引用类型：object、string。\n\n关于数据类型、变量和值的关系，可以使用以下等式：\n\
    \n| `datatype variable = value;` |\n\n`dataType variable = value;` 用于定义变量和它的值。`Constant`\
    \ 是一个不可改变的值，例如 `200`、`236`、`\"GOOD\"`。数据类型在 C# 编程中是可以改变的。\n\n| `(DataType) variable`\
    \ |\n\n`(Data Type)` 指定要转换的数据类型。变量的 `int` 类型转换为 `object` 类型，被称为“装箱”。`object` 类型转换为\
    \ `int` 类型被称为“解箱”。\n\n### 练习：计算与常量\n请打开 Visual Studio，点击 `File > New Project >\
    \ Console Application`。在编辑器中输入以下 `VariableAndConstant` 代码：\n\n```csharp\nusing\
    \ System;\nnamespace VariableAndConstant{\n    class Program{\n        static\
    \ void Main(string[] args){\n            int num; // 定义变量\n            int a =\
    \ 10, b = 20, c = 30; // 定义 a, b, c\n            num = a * b * c;\n          \
    \  const string RESULT = \"The result is: \"; // 定义常量\n            Console.WriteLine(RESULT\
    \ + num);\n            Console.ReadLine();\n        }\n    }\n}\n```\n保存文件，点击“调试”运行程序。\n\
    输出：`The result is: 600`\n解释：`int num;` 定义了一个变量 `num`。`const string RESULT` 定义了一个常量\
    \ `RESULT`。\n\n## 第二章：运算符\n\n### 算术运算符\n| 运算符 |  |\n| :--- | --- |\n| `+` | 加\
    \ |\n| `-` | 减 |\n| `*` | 乘 |\n| `/` | 除 |\n| `%` | 取模 |\n| `++` | 加 1 |\n| `--`\
    \ | 减 1 |\n\n`%` 运算符将第一个操作数除以第二个操作数，返回余数。`%2` 余数为 `0`。\n\n### 示例 2.1\n```csharp\n\
    int add=100+200;\nConsole.WriteLine(add);\nint div=800/2;\nConsole.WriteLine(div);\n\
    int mod=100%3;\nConsole.WriteLine(mod);\nint inc=10;\nConsole.WriteLine(inc);\n\
    ```\n解释：`add=100+200` 输出 `300`；`div=800/2` 输出 `400`；`mod=100%3` 输出 `1`；`++inc`\
    \ 输出 `11`。\n\n### 逻辑运算符\n使用逻辑运算符后，结果将为 true 或 false。\n\n| 运算符 | |\n| :--- | ---\
    \ |\n| `&&` | 与 (AND) |\n| `||` | 或 (OR) |\n| `!` | 非 (NOT) |\n\n### 示例 2.2\n\
    ```csharp\nbool x=true; bool y=false;\nbool a=x && y; Console.WriteLine(a); //\
    \ 输出: false\nbool b=x || y; Console.WriteLine(b); // 输出: true\nbool c=! x; Console.WriteLine(c);\
    \ // 输出: false\n```\n解释：\n`true && true` 返回 `true`；`true && false` 返回 `false`；`false\
    \ && false` 返回 `false`。\n`true || true` 返回 `true`；`true || false` 返回 `true`；`false\
    \ && false` 返回 `false`。\n`! false` 返回 `true`；`! true` 返回 `false`。\n\n### 赋值运算符\n\
    | 运算符 | 示例 |\n| :--- | --- |\n| `+=` | `x+=y` |\n| `-=` | `x-=y` |\n| `*=` | `x*=y`\
    \ |\n| `/=` | `x/=y` |\n| `%=` | `x%=y` |\n\n### 示例 2.3\n```csharp\nint x=200;\
    \ int y=100;\nx += y; Console.WriteLine(x);\nx /= y; Console.WriteLine(x);\nx\
    \ -= y; Console.WriteLine(x);\nm=\"abc\"; string n=\"de\";\nm += n; Console.WriteLine(m);\n\
    ```\n解释：`x+=y` 输出 `300`；`x/=y` 输出 `2`；`x-=y` 输出 `100`；`m+=n` 输出 `abcd`。\n\n###\
    \ 比较运算符\n| 运算符 | |\n| :--- | --- |\n| `>` 大于 |\n| `<` 小于 |\n| `>=` 大于等于 |\n| `<=`\
    \ 小于等于 |\n| `==` 等于 |\n| `!=` 不等于 |\n\n使用比较运算符后，结果将为 true 或 false。\n\n### 示例 2.4\n\
    ```csharp\nint a = 100; int b = 200; bool result;\nresult = (a > b); Console.WriteLine(result);\n\
    result = (a == b); Console.WriteLine(result);\nresult = (a != b); Console.WriteLine(result);\n\
    ```\n解释：`result = (a > b)` 输出 `false`；`result = (a == b)` 输出 `false`；`result =\
    \ (a != b)` 输出 `true`。\n\n### 三元运算符\n`(表达式) ? (表达式为真时的语句) : (表达式为假时的语句);`\n这类似于\
    \ `if-else`。\n\n### 示例 2.5\n```csharp\nint a = 100; int b = 200;\nstring result;\n\
    result = (a < b) ? \"apple\" : \"banana\";\nConsole.WriteLine(result);\n```\n\
    解释：`result = (a < b) ? \"apple\" : \"banana\"` 输出 `apple`。\n\n### 条件语句\n```csharp\n\
    if (条件) {\n    // 如果条件为真则执行\n} else {\n    // 如果条件为假则执行\n}\n```\n\n### 示例 2.6\n\
    ```csharp\nint age = 20;\nif (age >= 18) {\n    Console.WriteLine(\"成年人\");\n\
    } else {\n    Console.WriteLine(\"未成年\");\n}\n```\n\n### switch 语句\n```csharp\n\
    switch (表达式) {\n    case 值 1:\n        // 语句\n        break;\n    case 值 2:\n\
    \        // 语句\n        break;\n    default:\n        // 默认语句\n}\n```\n\n### 示例\
    \ 2.7\n```csharp\nint day = 2;\nswitch (day) {\n    case 1:\n        Console.WriteLine(\"\
    星期一\");\n        break;\n    case 2:\n        Console.WriteLine(\"星期二\");\n  \
    \      break;\n    default:\n        Console.WriteLine(\"其他日期\");\n        break;\n\
    }\n```\n\n"
- fmt: "\n`sizeof(dataType);` is used to obtain the size in bytes for a data type.\n\
    \n### Example 2.8\n```csharp\nusing System;\nnamespace sizeofsample\n{\n    class\
    \ Program\n    {\n        static void Main(string[] args)\n        {\n       \
    \     Console.WriteLine(\"The size of short is \" + sizeof(short));\n        \
    \    Console.WriteLine(\"The size of int is \" + sizeof(int));\n            Console.WriteLine(\"\
    The size of long is \" + sizeof(long));\n            Console.ReadLine();\n   \
    \     }\n    }\n}\n```\n**Output:**\n```\nThe size of short is 2\nThe size of\
    \ int is 4\nThe size of long is 8\n```\n**Explanation:**\n`sizeof(dataType);`\
    \ is used to obtain the size in bytes for a data type.\n\n### Operator Precedence\n\
    The following table lists the operators in order of precedence.\n\n| Precedence\
    \ | Operators |\n| :--- | :--- |\n| 1 | `( )` `.` `[ ]` `++a` `--a` `sizeof()`\
    \ |\n| 2 | `*` `/` `%` |\n| 3 | `+` `-` |\n| 4 | `a++` `a--` |\n| 5 | `<<` `>>`\
    \ |\n| 6 | `<` `>` `<=` `>=` `is` |\n| 7 | `==` `!=` |\n| 8 | `&` `^` `\\|` |\n\
    | 9 | `!` |\n| 10 | `&&` |\n| 11 | `\\|` |\n| 12 | `? :` |\n| 13 | `=` `*=` `/=`\
    \ `%=` `+=` `-=` `<<=` `>>=` |\n\nOperators in the same box have the same precedence.\n\
    \n### Summary\n| Operators |\n| :--- |\n| `+` |\n| `-` |\n| `*` |\n| `/` |\n|\
    \ `%` |\n| `++` or `--` |\n\n| Operators |\n| :--- |\n| `&&` |\n| `\\|` |\n| `!`\
    \ |\n\n| Operators | Examples |\n| :--- | :--- |\n| `+=` | `x+=y` |\n| `-=` |\
    \ `x-=y` |\n| `*=` | `x*=y` |\n| `/=` | `x/=y` |\n| `%=` | `x%=y` |\n\n| Operators\
    \ | Running |\n| :--- | :--- |\n| `>` | greater than |\n| `<` | less than |\n\
    | `>=` | greater than or equal |\n| `<=` | less than or equal |\n| `==` | equal\
    \ |\n| `!=` | not equal |\n| `(test-expression) ? (if-true-do-this) : (if-false-do-this);`\
    \ | |\n| `++ a` | `a` plus 1 first, then run expression |\n| `a++` | run expression\
    \ first, then `a` plus 1 |\n| `-- b` | `b` minus 1 first, then run expression\
    \ |\n| `b--` | run expression first, then `b` minus 1 |\n\n### Exercise: Decrease\
    \ --a & b\nPlease open the Visual C#, click File > New Project > Console Application.\
    \ Type the file name “MinusMinus”. Write the C# code in editor:\n\n```csharp\n\
    using System;\nnamespace MinusMinus\n{\n    class Program\n    {\n        static\
    \ void Main(string[] args)\n        {\n            int a = 10, num;\n        \
    \    num = --a - 3; /* 10 decreases 1 first, then 9 minus 3 , the result “6” will\
    \ be assigned to num */\n            Console.WriteLine(num);\n            int\
    \ b = 10, var;\n            var = b-- - 3; /* 10 minus 3 first, assign the value\
    \ 7 to var, then b decreases 1*/\n            Console.WriteLine(var);\n      \
    \      Console.ReadLine();\n        }\n    }\n}\n```\n**Output:**\n```\n6\n7\n\
    ```\n**Explanation:**\n`--a`: `a` minus 1 first, then run expression.\n`b--`:\
    \ runs expression first, then `b` minus 1.\n\n### Struct Types\nA struct type\
    \ is a value type that is typically used to encapsulate small groups of related\
    \ variables. Struct is very useful for data structures that have value semantics.\
    \ The syntax to declare a struct type like this:\n\n```csharp\npublic struct Student\
    \ {\n    public int id;\n    public string name;\n    public int age;\n}\n```\n\
    `public` is an access modifier. `Student` is a struct type. `id, name, age` are\
    \ three struct fields.\n\n### Example 2.9\n```csharp\npublic struct Car {\n  \
    \  //  // defines a struct type\n    public int price;      // struct field\n\
    \    public string size;    // struct field\n    public string color;    // struct\
    \ field\n}\n```\n\n### Struct Variable\nThe syntax to declare a struct variable\
    \ like this:\n\n```csharp\nStudent Smith;\n```\n`Student` is a struct type. `Smith`\
    \ is a struct variable.\n\n### Example 2.10\n```csharp\nCar Ford;   // Car is\
    \ a struct type . Ford is a struct variable\n```\nThe syntax of access the struct\
    \ field:\n```csharp\nStructVariable.field\n```\n\n### Example 2.11\n`Smith.id`\
    \ means Smith’s id. `Smith.name` means Smith’s name. `Smith.age` means Smith’s\
    \ age. `Ford.price` means Ford’s price. `Ford.size` means Ford’s size. `Ford.color`\
    \ means Ford’s color.\n\n### Struct’s Usage\n### Example 2.12\n```csharp\nusing\
    \ System;\nnamespace structSample\n{\n    struct Student {\n        //  // defines\
    \ a struct type\n        public int id;\n        public string name;\n       \
    \ public int age;\n    }\n    class Program\n    {\n        static void Main(string[]\
    \ args)\n        {\n            Student Smith;\n            Smith.id = 1001;\n\
    \            Smith.name = \"Andy\";\n            Smith.age = 16;\n           \
    \ Console.WriteLine(\"Student's id is \" + Smith.id);\n            Console.WriteLine(\"\
    Student's name is \" + Smith.name);\n            Console.WriteLine(\"Student's\
    \ age is \" + Smith.age);\n        }\n    }\n}\n```\n**Output:**\n```\n1001\n\
    Andy\n16\n```\n**Explanation:**\n`struct Student` defines a struct type. `Student\
    \ Smith` defines a struct variable. `Student.id` means Student’s id. `Student.name`\
    \ means Student’s name. `Student.age` means Student’s age.\n\n### Enum Types\n\
    An enum type provides a well-organized way to define a set of integral constants\
    \ that may be assigned to a variable. The syntax to declare an enum type like\
    \ this:\n\n```csharp\npublic enum Today {Morning, Afternoon, Evening};\n```\n\
    `public` is an access modifier. `Today` is an enum type. `Morning, Afternoon,\
    \ Evening` are enum members.\n\n### Example 2.13\n```csharp\nenum Week {\n   \
    \ //  // defines an enum type\n    Sunday,   // enum member\n    Monday,  // enum\
    \ member\n    Tuesday  // enum member\n}\n```\n\n### Enum Variable\nThe syntax\
    \ to declare an enum variable like this:\n\n```csharp\nToday t;\n```\n`Today`\
    \ is an enum type. `t` is an enum variable.\n\n### Example 2.14\n```csharp\nWeek\
    \ w;   // Week is a enum type, w is an enum variable\n```\nThe syntax of access\
    \ the enum member:\n```csharp\nEnumType.member\n```\n\n### Example 2.15\n`Today.Morning`\
    \ means Today’s Morning. `Today.Afternoon` means Today’s Afternoon. `Today.Evening`\
    \ means Today’s Evening. `Week.Sunday` means Week’s Sunday. `Week.Monday` means\
    \ Week’s Monday. `Week.Tuesday` means Week’s Tuesday.\n\n### Enum’s Usage\n###\
    \ Example 2.16\n```csharp\nusing System;\nnamespace enumExample\n{\n    public\
    \ enum Today {\n        //  // defines an enum type\n        morning,   // enum\
    \ member\n        afternoon, // enum member\n        evening    // enum member\n\
