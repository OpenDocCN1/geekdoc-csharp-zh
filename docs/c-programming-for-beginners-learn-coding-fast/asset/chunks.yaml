  trans: "\n\n## 静态变量\n\n| `static dataType variable;className. variable;` |\n\n`static`\
    \ 声明意味着该变量属于一个类。`className. variable;` 意味着类可以直接引用此静态变量。\n\n**示例 8.3**\n```csharp\n\
    using System;\nnamespace StaticVariable\n{\n    class MyClass\n    {\n       \
    \ public static int num = 100;  // 定义一个静态变量\n        static void Main(string[]\
    \ args)\n        {\n            Console. Write(MyClass.num );  // 类引用变量\n    \
    \        Console. ReadLine();\n        }\n    }\n}\n```\n**输出：** 100\n**解释：**\n\
    `static int num` 定义了一个静态变量 `num`，它可以被类引用。`MyClass. num` 意味着类 `MyClass` 可以直接引用静态变量\
    \ `num`。非静态变量仅通过对象引用，而不通过类引用。\n\n## 静态方法\n\n静态方法可以被类引用。非静态方法仅通过对象引用，而不通过类引用。\n\
    \n| `static dataType method( );className. method( );` |\n\n`static` 声明意味着该方法属于一个类。`className.\
    \ method( );` 意味着类可以直接引用此静态方法。\n\n**示例 8.4**\n```csharp\nusing System;\nnamespace\
    \ StaticVariable\n{\n    class MyClass\n    {\n        public static int myMethod()\
    \ { return 200;}  /* 定义一个静态方法 */\n        static void Main(string[] args)\n  \
    \      {\n            Console. Write(MyClass.myMethod() );  /* 类引用该方法 */\n   \
    \         Console. ReadLine();\n        }\n    }\n}\n```\n**输出：** 200\n**解释：**\n\
    `static int myMethod()` 定义了一个静态方法，它可以被类引用。`MyClass. myMethod ()` 意味着类 `MyClass`\
    \ 引用了静态方法 `myMethod()`。非静态方法仅通过对象引用，而不通过类引用。\n\n## 多态\n\n多态描述了对不同对象执行不同方法的能力。\n\
    \n| `virtual public method(){ }` // 定义一个虚方法 |\n| `public override method(){ }`\
    \ // 重写虚方法 |\n\n多态通过 `virtual method` 和 `override method` 共同完成。\n\n**示例 8.5**\n\
    ```csharp\nusing System;\nnamespace PolymorphismDemo\n{\n    class Program\n \
    \   {\n        class Animal\n        {\n            virtual public void cry( )\
    \ {  // 定义一个虚方法\n                Console. WriteLine(\"crying...... \");\n    \
    \        }\n        }\n        class Dog: Animal\n        {\n            public\
    \ override void cry( ) {     // 重写虚方法\n                Console. WriteLine(\"Wow,\
    \ Wow...... \");\n            }\n        }\n        class Cat: Animal\n      \
    \  {\n            public override void cry( ) {  // 重写虚方法\n                Console.\
    \ WriteLine(\"Meow, Meow...... \");\n                Console. ReadLine();\n  \
    \          }\n        }\n        static void Main(string[] args)\n        {\n\
    \            Animal animalVar;\n            animalVar = new Dog( );\n        \
    \    animalVar. cry( );\n            animalVar = new Cat( );\n            animalVar.\
    \ cry( );\n        }\n    }\n}\n```\n**输出：** Wow, Wow……Meow, Meow……\n**解释：**\n\
    `animalVar = new dog( )` 创建了一个狗对象，因此，`animalVar. cry( )` 调用了子类 `Dog` 中的方法 `cry(\
    \ )` 并重写了虚方法。`animalVar = new cat( )` 创建了一个猫对象，因此，`animalVar. cry( )` 调用了子类 `Cat`\
    \ 中的方法 `cry( )` 并重写了虚方法。\n\n## 写入文件\n\n要写入文件，你应该添加指令 `Using System. IO;` 和类 `StreamWriter`。创建文件对象的语法如下：\n\
    \n| `StreamWriter file = new StreamWriter(\"c:\\\\myFile. txt\", true);` |\n\n\
    `StreamWriter file = new StreamWriter(\"c:\\\\myFile. txt\", true);` 创建了一个用于写入文本的文件对象\
    \ `file`。`C:\\\\myFile. txt` 指定了写入的路径和文件。`true` 表示追加文本。如果没有 `true`，表示覆盖文本。\n\n\
    **示例 8.6**\n```csharp\nusing System;\nusing System. Text;\nusing System. IO;\n\
    namespace WriteFile\n{\n    class WriteTextFile\n    {\n        static void Main()\n\
    \        {\n            string myText = \"VB in 8 Hours\";\n            StreamWriter\
    \ file = new StreamWriter(\"C:\\\\myFile.txt\", true);\n            file. WriteLine(myText);\
    \      // 将文本写入文件\n            file. Close();\n        }\n    }\n}\n```\n**结果：**\
    \ 请打开 myFile. txt，你可以找到文本：VB in 8 Hours\n如果你第二次运行该程序，它会有文本：VB in 8 Hours\nVB in\
    \ 8 Hours\n**解释：**\n`System. IO` 命名空间包含了 `StreamWriter` 类。`StreamWriter` 类用于文件操作，用于将文本写入文件。`C:\\\
    \\myFile. txt` 写入了文本 `VB in 8 Hours`。参数 `true` 表示追加文本。否则，如果没有 `true`，则覆盖文本。`file.\
    \ WriteLine(myText);` 将文本写入文件。\n\n## 读取文件\n\n要读取文件，你应该添加指令 `Using System. IO;`\
    \ 和类 `StreamReader`。创建文件对象的语法如下：\n\n| `StreamReader file = new StreamReader(\"\
    c:\\\\myFile. txt\");` |\n\n"
- fmt: "\n# StreamReader Example\n\n`StreamReader file = new StreamReader(\"c:\\\\\
    myFile.txt\");` creates a file object `file`, which is used to read text. `C:\\\
    myFile.txt` specifies the path and a file to read. Now assume that the content\
    \ of `C:\\myFile.txt` is `VB in 8 Hours`.\n\n## Example 8.7\n\n```csharp\nusing\
    \ System;\nusing System.Text;\nusing System.IO;\n\nnamespace ReadFile\n{\n   \
    \ class Program\n    {\n        static void Main(string[] args)\n        {\n \
    \           String myText;\n            StreamReader file = new StreamReader(\"\
    C:\\\\myFile.txt\");\n            myText = file.ReadLine(); //read the first text\n\
    \            while (myText != null)\n            {\n                //read until\
    \ reach end of file\n                Console.WriteLine(myText);\n            \
    \    myText = file.ReadLine(); //read the next text\n            }\n         \
    \   file.Close();\n            Console.ReadLine();\n        }\n    }\n}\n```\n\
    \n**Output:**\nVB in 8 Hours\nVB in 8 Hours\n\n**Explanation:**\n- `System.IO`\
    \ namespace includes `StreamReader` class.\n- `StreamReader` class works with\
    \ files, it is used to read text from a file.\n- `C:\\myFile.txt` specifies the\
    \ path and a file to read.\n- `myText = file.ReadLine();` reads the text of `myFile.txt`.\n\
    \n## Summary\n\n- **Abstract class** works as a parent class, which will be extended\
    \ by its subclass. The method in the subclass will override the abstract method\
    \ in the abstract class.\n- **Interface** is a special class, which will be implemented\
    \ by a class. The interface contains one or more empty method that will be implemented\
    \ by a method of the class.\n- **Static variable** can be referenced by a class.\
    \ **Non-static variable** is referenced only by the object, not by class.\n- **Static\
    \ method** can be referenced by a class. **Non-static method** is referenced only\
    \ by the object, not by class.\n- **Polymorphism** describes the ability to perform\
    \ different method for different objects. Polymorphism is completed by `virtual\
    \ method` and `override method` together.\n- To write a file, you should add a\
    \ directive `using System.IO;` and a class `StreamWriter`.\n- To read a file,\
    \ you should add a directive `using System.IO;` and a class `StreamReader`.\n\n\
    ## Exercise: Max & Min - Abstract Example\n\nStart up Visual Studio > File > New\
    \ Project > Console Application > Name > `AbstractExample` > OK. Write following\
    \ codes in Visual Studio.\n\n```csharp\nusing System;\nnamespace AbstractExample\n\
    {\n    abstract class A\n    {\n        // define an abstract class\n        public\
    \ abstract int max(int x, int y); // declare an abstract method\n        public\
    \ abstract int min(int x, int y); // declare an abstract method\n    }\n    class\
    \ B : A\n    {\n        // class B extends class A\n        public override int\
    \ max(int x, int y)\n        {\n            // override abstract method\n    \
    \        return x > y ? x : y;\n        }\n        public override int min(int\
    \ x, int y)\n        {\n            // override abstract method\n            return\
    \ x < y ? x : y;\n        }\n    }\n    class Program\n    {\n        static void\
    \ Main(string[] args)\n        {\n            B b = new B();\n            int\
    \ max = b.max(100, 200);\n            int min = b.min(100, 200);\n           \
    \ Console.WriteLine(\"Max=\" + max);\n            Console.WriteLine(\"Min=\" +\
    \ min);\n            Console.ReadLine();\n        }\n    }\n}\n```\n\nSave the\
    \ file, and debug to run the program.\n\n**Output:**\nMax = 200\nMin = 100\n\n\
    **Explanation:**\n- `abstract class A { }` defines an abstract class.\n- `public\
    \ abstract int max(int x, int y);` defines an abstract method without `{ }`.\n\
    - `class B : A { }` means a sub class `B` extends a parent class `A`.\n- `public\
    \ override int max(int x, int y){ }` means this method in sub class overrides\
    \ the abstract method in parent class. \n- **Note:** abstract method has no `{\
    \ }`.\n\n## Exercise: Larger & Smaller - Interface Example\n\nStart up Visual\
    \ Studio > File > New Project > Console Application > Name > `InterfaceExample`\
    \ > OK. Write following codes in Visual Studio.\n\n```csharp\nusing System;\n\
    namespace InterfaceExample\n{\n    interface myInterface\n    {\n        // define\
    \ an interface\n        void compareNumbers(int num1, int num2); // define an\
    \ empty method without { }\n    }\n    class MaxNum : myInterface\n    {\n   \
    \     // implement interface\n        public void compareNumbers(int num1, int\
    \ num2)\n        {\n            // implement the empty method\n            Console.WriteLine(\"\
    Two numbers are: \" + num1 + \" & \" + num2);\n            if (num1 >= num2)\n\
    \                Console.WriteLine(\"Maximum is:\" + num1);\n            else\n\
    \                Console.WriteLine(\"Maximum is:\" + num2);\n        }\n    }\n\
    \    class MinNum : myInterface\n    {\n        // implement interface\n     \
    \   public void compareNumbers(int num1, int num2)\n        {\n            //\
    \ implement the empty method\n            Console.WriteLine(\"Two numbers are:\
    \ \" + num1 + \" & \" + num2);\n            if (num1 <= num2)\n              \
    \  Console.WriteLine(\"Minimum is:\" + num1);\n            else\n            \
    \    Console.WriteLine(\"Maximum is:\" + num2);\n            Console.ReadLine();\n\
    \        }\n    }\n    class Program\n    {\n        static void Main(string[]\
    \ args)\n        {\n            MaxNum maxObject = new MaxNum();\n           \
    \ maxObject.compareNumbers(100, 120);\n            MinNum minObject = new MinNum();\n\
    \            minObject.compareNumbers(60, 80);\n        }\n    }\n}\n```\n\nSave\
    \ the file, and debug to run the program.\n\n**Output:**\nTwo numbers are: 100\
    \ & 120\nMaximum is: 120\nTwo numbers are: 60 & 80\nMinimum is: 60\n\n**Explanation:**\n\
    - `interface myInterface { }` defines an interface.\n- `void compareNumbers(int\
    \ num1, int num2);` defines an empty method without `{ }`.\n- `class MaxNum :\
    \ myInterface { }` means class `MaxNum` implements `myInterface`.\n- `public void\
    \ compareNumbers(int num1, int num2){ }` means this method in sub class implements\
    \ the empty method in interface.\n- **Note:** empty method has no `{ }`.\n\n##\
    \ Appendix & Answers\n\nPlease choose the correct answer.\n\n1)\n```csharp\nusing\
    \ System;\nnamespace MyProgram\n{\n    class Progra\n    {\n        static fill\
    \ in here (string[] args){ // define a main function\n            string str =\
    \ \"Let's study C# progrm! \";\n            Console.Write(str);\n            Console.ReadLine();\n\
    \        }\n    }\n}\n```\nA. function\nB. method\nC. Function\nD. Main\n\n2)\n\
    ```csharp\nusing System;\nnamespace VariableAndConstant\n{\n    class Program\n\
