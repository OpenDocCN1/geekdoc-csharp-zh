    \ Sample (2)\n- [Chapter 8: Static Abstract Interface](#\n    - Static Abstract\
    \ Interface\n    - Abstract\n    - Interface\n    - Static Variable\n    - Static\
    \ Method\n    - Write a File\n    - Read a File\n\n## Chapter 1: Introduction\
    \ to C#\n### Introduction to C#\nWhat is C#? C# is a general-oriented (OOP) language\
    \ based on C++ and intended to work with Microsoft.\n\nOnline C# Compiler & Editor\n\
    If you don’t want to install C# to your local computer, an online C# compiler\
    \ & editor is available. type C# codes into the editor, click “Compile”, the output\
    \ result will appear.\n\n### First C# Program\nLet’s write the “Hello World” program\
    \ like this:\n```csharp\nusing System;\nnamespace HelloWorld\n{\n    class Program\n\
    \    {\n        static void Main(string[] args)\n        {\n            Console.WriteLine(\"\
    Hello World ! \");\n            Console.ReadLine();\n        }\n    }\n}\n```\n\
    Output:\nHello World!\n\nExplanation:\n`using System`: The `using` is a directive\
    \ that specifies how a compiler (or assembler or interpreter) should process its\
    \ data. The `System` is a namespace that is used to organize objects of various\
    \ kinds, so that these objects can be referred to by name.\n`namespace HelloWorld`:\
    \ The file name is `HelloWorld.cs`.\n`class Program`: The class of C# Program\
    \ always contains one `Main` method.\n`static void Main(string[] args)`: This\
    \ is a `Main` method that is the entry point to run the C# program. When the application\
    \ is executed, the `Main` method is the first method to be called. `(string[]\
    \ args)` is used to pass input parameters.\n`Console.WriteLine()`: This is a method\
    \ to display the output result.\n`Console.ReadLine()`: This is a method to pause\
    \ the screen, and makes sure to show the output result. Otherwise, the output\
    \ result will be skipped without this command.\n\n### C# Comments\n(Content not\
    \ provided in source text)\n"
