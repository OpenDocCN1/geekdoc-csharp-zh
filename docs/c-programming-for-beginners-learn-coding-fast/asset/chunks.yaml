    \ Example 6.2\n```csharp\nColor obj = new Color( ); // create an object “obj”\n\
    obj.c1= \"yellow\"; // object references variable\nobj.c2=\"purple\"; // object\
    \ references variable\nobj.brightness ( ); // object references method\n```\n\
    Explanation: `Color obj = new Color;` creates an object named `obj`. `obj.c1`\
    \ means that `obj` references variable `c1`. `obj.c2` means that `obj` references\
    \ variable `c2`. `obj.brightness ( );` calls the obj’s method `brightness( ){\
    \ }`.\n\n### Class & Object Example\n```csharp\nusing System;\nnamespace ClassAndObject{\n\
