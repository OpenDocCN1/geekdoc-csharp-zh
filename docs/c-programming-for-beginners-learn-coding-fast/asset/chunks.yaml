  trans: "\n\n# C# 注释\n\nC# 注释用于解释当前代码，描述这段代码的作用。C# 编译器会忽略注释。`//` 用于单行注释。`/*…*/` 用于多行注释。\n\
    \n## 示例 1.2\n```csharp\nConsole.WriteLine (“Hello World”); // show “Hello World”\n\
    /* Console.WriteLine() 是一个 C# 输出命令，意味着显示或打印 .*/\n```\n**解释：**\n`//` `show “Hello\
    \ World ” 是一个单行注释。\n`/* Console.WriteLine() 是一个 C# 输出命令，意味着显示或打印 . */` 是一个多行注释。\n\
    \n# 转义字符\n\n`\\` 反斜杠字符可以用于转义字符。\n\n- `\\n` 将内容输出到下一行。\n- `\\r` 产生回车。\n- `\\t`\
    \ 产生一个制表符。\n- `\\'` 输出单引号。\n- `\\\"` 输出双引号。\n\n## 示例 1.3\n```csharp\nusing System;\n\
    namespace EscapingCharacters{\n    class Program{\n        static void Main(string[]\
    \ args){\n            Console.WriteLine(\"    \\\" Escaping Character Samples\\\
    \"    \");\n            Console.ReadLine();\n        }\n    }\n}\n```\n**输出：**\
    \ “ Escaping Character Samples”\n**解释：** `\\\"` 输出双引号。\n**注意：** “ Escaping Character\
    \ Samples” 带有一对双引号；你可以在输出结果中看到包含文本的双引号。\n\n## 示例 1.4\n```csharp\nConsole.WriteLine\
    \ ( “Hello \\t\\t\\t World! ” ); // 注意这里有三个制表 .\n```\n**输出：** Hello       World!\n\
    **解释：** `\\t` 产生一个制表符\n\n## 示例 1.5\n```csharp\nConsole.WriteLine ( “Hello \\n\
    \ World! ” ); // 注意这里有一个 \\n .\n```\n**输出：** \nHelloWorld !\n**解释：** `\\n` 将内容输出到下一行。\n\
    \n# C# 关键字\n\n某些单词仅供 C# 语言本身使用。在为变量、函数和标签选择标识符名称时不能使用它们。以下单词是 C# 保留字的一部分：\n\n\
    | abstract | byte | char | continue | double | extern | float | if | interface\
    \ | object | public | string | this | try |\n\n## 总结\n\n- `using System`：`using`\
    \ 是一个关键字，意味着“运行”。`System` 是一个命名空间，用于分组 C# 类、对象等。\n- `namespace HelloWorld`：文件名“HelloWorld.cs”。\n\
    - `class Program`：C# Program 类始终包含一个 `main` 方法。\n- `static void Main(string[]\
    \ args)`：这是主方法，是运行 C# 程序的入口点。`(string[] args)` 用于传递输入参数。\n- `Console.WriteLine()`：这是一个用于显示输出结果的方法。\n\
    - `Console.ReadLine()`：这是一个暂停屏幕的方法，并确保显示输出结果。否则，如果没有此命令，输出结果将被跳过。\n- `//` 用于单行注释。\n\
    - `/*…*/` 用于多行注释。\n- `\\n` 将内容输出到下一行。\n- `\\r` 产生回车。\n- `\\t` 产生一个制表符。\n- `\\\
    '` 输出单引号。\n- `\\\"` 输出双引号。\n\nC# 关键字仅供 C# 语言本身使用。在为变量、函数和标签选择标识符名称时不能使用它们。例如：`if`、`new`、`while`\
    \ 和 `try` 是 C# 语言保留的关键字。\n\n# 练习：运行 C# 程序！\n\n请打开 Visual C#，点击 `File > New Project\
    \ > Console Application`。输入文件名“MyProgram”。在编辑器中编写 C# 代码：\n\n```csharp\nusing System;\n\
    namespace MyProgram{\n    class Program{\n        static void Main(string[] args)\
    \ // Main 方法\n        {\n            string str = \"Let's study C# progrmming!\
    \ \"; // 定义一个字符串\n            Console.Write(str); // 输出 str 的值\n            Console.ReadLine();\
    \ // 确保显示输出结果\n        }\n    }\n}\n```\n**输出：** Let’s study C# programming!\n\
    **解释：**\n- `static void Main(string[] args)` 是主方法，C# 程序始终从这个起点开始运行。\n- `string\
    \ str = \"Let's study C# progrmming! \";` 定义了一个字符串及其值。`string` 是数据类型。`str` 是变量，“Let’s\
    \ study programming”是一个值。\n- `Console.Write(str);` 显示 `str` 变量的值。`str` 的值为“Let’s\
    \ study C# programming! ”，所以我们可以看到输出结果 \"Let's study C# programming!\".\n- `Console.ReadLine()`：确保显示输出结果。\n\
    \n从上面的示例中，我们可以看到程序中的一些关键字，如 `using`、`static`、`void` 和 `string` 等。\n\n# 数据类型\n\n\
    C# 有两类数据类型：\n1. 值类型：整数、数字、小数、`char`、`bool`\n2. 引用类型：`object`、`string`\n\n| 类型\
    \ | 描述 |\n| :--- | :--- |\n| sbyte | 8 位符号整数 |\n| byte | 8 位无符号整数 |\n| short |\
    \ 16 位符号整数 |\n| ushort | 16 位无符号整数 |\n| int | 32 位符号整数 |\n| uint | 32 位无符号整数 |\n\
    | long | 64 位符号整数 |\n| ulong | 64 位无符号整数 |\n| char | Unicode 字符 |\n| float | 单精度浮点数\
    \ |\n| double | 双精度浮点数 |\n| bool | 布尔值，真或假 |\n| decimal | 精确的小数值 |\n| string |\
    \ 任意长度的字符串 |\n| Object | 任意类型 |\n\n# 变量\n\n变量是存储 C# 程序中所用值的容器。每个变量都有自己的名称，例如：`a`、`b`、`str`、`myVariable`……等（我们将在下一页再次讨论“变量”）。\n\
    \n## 示例 1.6\n```csharp\nint a = 10; // int 是数据类型，a 是变量，10 是一个值\nbool test = true;\
    \ // bool 是数据类型，test 是变量，true 是一个值 .\nfloat f = 1.0f; // float 是数据类型，f 是变量，1.0f\
    \ 是一个值 .\ndouble d = 1.0d; // double 是数据类型，d 是变量，1.0d 是一个值 .\ndecimal dec = 2.2m;\
    \ // decimal 是数据类型，dec 是变量，2.2m 是一个值 .\nbyte b = 10; // byte 是数据类型，b 是变量，10 是一个值\
    \ .\nlong l = 10L; // long 是数据类型，l 是变量，10L 是一个值 .\nchar c = 'V'; // char 是数据类型，c\
    \ 是变量，V 是一个值 .\nstring myString = \"Hello! \"; // string 是数据类型，myString 是变量，Hello\
    \ ! 是一个值 .\nobject myObject = \"C#\"; // object 是数据类型，myObject 是一个对象变量，“C#” 是一个值\
    \ .\n```\n**解释：**\n我们可以使用以下公式来定义数据类型、变量和值：\n`数据类型 变量 = 值`\n\n变量是存储 C# 程序中所用值的容器。变量代表存储位置。\n\
    `数据类型变量 = 值` 是用于定义变量及其值。\n\n## 示例 1.7\n```csharp\nstring name = \"Smith\"; //\
    \ string 变量\nint age = 16; // int 变量\nbool b = true; // bool 变量\n```\n**解释：**\
    \ `string`、`int`、`bool` 是数据类型。`name`、`age`、`b` 是变量。\n\n# 变量定义\n\n有不同的方法定义变量。\n\
    \n## 示例 1.8\n```csharp\nusing System;\nnamespace VariableSample{\n    class Program{\n\
    \        static void Main(string[] args){\n            float x, y;\n         \
    \   y = 1.2356f;\n            x = y;\n            Console.WriteLine(x);\n    \
    \        int i;\n            int a = 10, b = 20, c = 30;\n            i = a +\
    \ b + c;\n            Console.WriteLine(i);\n            Console.ReadLine();\n\
    \        }\n    }\n}\n```\n**输出：**\n1.23456\n60\n**解释：** `float x, y;` 定义了变量 `x,\
    \ y`。`int i;` 定义了一个变量。`int a = 10, b = 20, c = 30;` 定义了三个变量 `a`、`b` 和 `c`。\n\n\
    # 常量\n\n常量是不可改变的值，例如 200、1.23e6、“GOOD”。\n\n`const 类型 常量 = 值`\n“const”用于定义常量。\n\
    \n## 示例 1.9\n```csharp\nconst double PI = 3.14159265; // 定义常量\nconst string BOOK\
    \ = \"C# Programming Language\"; // 常量\n```\n**解释：** `PI` 是常量名。`3.14159265` 是常量值。`BOOK`\
    \ 是常量名，“C# Programming Language”是常量值。常量值在运行时不可更改。\n\n# 常量定义\n\n常量名通常大大写。\n\n##\
    \ 示例 1.10\n```csharp\nusing System;\nnamespace ConstantSample{\n    class Program{\n\
    \        static void Main(string[] args){\n            const double PI = 3.14159265;\
    \ // PI 是常量\n            const string BOOK = \"C# Programming Language\"; // 常量\n\
    \            Console.WriteLine(PI);\n            Console.WriteLine(BOOK);\n  \
    \          Console.ReadLine();\n        }\n    }\n}\n```\n**输出：**\n3.14159265\n\
    C# Programming Language\n**解释：** `PI` 和 `BOOK` 是常量名。\n\n# 数据类型转换\n\n数据类型在 C# 程序中可以更改。\n\
    \n` (类型) 变量`\n\n"
- fmt: "\n`(Data Type)` specifies the data type that will be converted.\n\n### Example\
    \ 1.11\n```csharp\nusing System;\nnamespace TypyConvert{\n    class Program{\n\
    \        static void Main(string[] args){\n            float oldValue = 20.123f,\
    \ newValue;\n            newValue = (int)oldValue; // convert data type\n    \
    \        Console.WriteLine(newValue);\n            Console.ReadLine();\n     \
    \   }\n    }\n}\n```\nOutput: `20`\nExplanation: `newValue = (int)oldValue;` converts\
    \ the data type from `float` to `int`.\n\n### Boxing\nThe `int` type of a variable\
    \ is converted to `object` type, or value type is converted into reference type,\
    \ which is known as “Boxing”.\n\n| `object newVariable = (object) oldVariable;`\
    \ |\n\nThe `int` type of `oldVariable` can be converted to `object` type of `newVariable`.\n\
    \n### Example 1.12\n```csharp\nusing System;\nnamespace Boxing{\n    class Program{\n\
    \        static void Main(string[] args){\n            int var1 = 100;\n     \
    \       object var2 = (object)var1; // boxing\n            Console.WriteLine(\"\
    The data type of var2 is object type now. \");\n            Console.ReadLine();\n\
    \        }\n    }\n}\n```\nOutput: `The data type of var2 is object type now.`\n\
    Explanation: `object var2 = (object)var1;` converts the data type of `var1` from\
    \ `int` type to `object` type `var2`.\n\n### UnBoxing\nThe `object` type of a\
    \ variable is converted to `int` type, or reference type is converted into value\
    \ type, which is known as “Unboxing”.\n\n| `int newVariable = (int) oldVariable;`\
    \ |\n\nThe `object` type of `oldVariable` can be converted to `int` type of `newVariable`.\n\
    \n### Example 1.13\n```csharp\nusing System;\nnamespace UnBoxing{\n    class Program{\n\
    \        static void Main(string[] args){\n            int var1 = 100;\n     \
    \       object var2 = (object)var1; // boxing\n            int var3 = (int)var2;\
    \ // unboxing\n            Console.WriteLine(\"The data type of var3 is int type\
    \ now. \");\n            Console.ReadLine();\n        }\n    }\n}\n```\nOutput:\
    \ `The data type of var3 is int type now.`\nExplanation: `int var3 = (int)var2;`\
    \ converts the data type of `var2` from `object` type to `int` type `var3`.\n\n\
    ### Summary\nC# has two categories of data types:\n1. Value types: integers, numbers,\
    \ `decimal`, `char`, `bool`\n2. Reference types: `object`, `string`\n\nAbout the\
    \ relationship of data type, variable and value, we can use the following equation:\n\
    \n| `data-type variable = value;` |\n\n`dataType variable = value;` is used to\
    \ define a variable and its value.\n\n`Constant` is a value that is never changeable,\
    \ such as `200`, `1.23e6`, `\"GOOD\"`. `const` is used to define a constant. Data\
    \ Type can be changed in C# programming.\n\n| `(DataType) variable` |\n\n`(Data\
    \ Type)` specifies the data type that will be converted. The `int` type of a variable\
    \ is converted to `object` type, which is known as “Boxing”. The `object` type\
    \ of a variable is converted to `int` type is known as “Unboxing”.\n\n### Exercise:\
    \ Calculation and Constant\nPlease open the Visual C#, click `File > New Project\
    \ > Console Application`. Type the file name `VariableAndConstant`. Write the\
    \ C# code in editor:\n\n```csharp\nusing System;\nnamespace VariableAndConstant{\n\
    \    class Program{\n        static void Main(string[] args){\n            int\
    \ num; // define variable\n            int a = 10, b = 20, c = 30; // define a,\
    \ b, c\n            num = a * b * c;\n            const string RESULT = \"The\
    \ result is: // define a constant\n            Console.WriteLine(RESULT + num\
    \ );\n            Console.ReadLine();\n        }\n    }\n}\n```\nSave the file,\
    \ click “Debugging” to run the program.\nOutput: `The result is: 6000`\nExplanation:\
    \ `int num;` defines a variable `num`. `const string RESULT` defines a constant\
    \ `RESULT`.\n\n## Chapter 2: Operators\n\n### Arithmetical Operators\n| Operators\
    \ | Running |\n| :--- | :--- |\n| `+` | add |\n| `-` | subtract |\n| `*` | multiply\
    \ |\n| `/` | divide |\n| `%` | get modulus |\n| `++` | increase 1 |\n| `--` |\
    \ decrease 1 |\n\nThe `%` operator divides the first operand by the second operand,\
    \ returns the remainder. `%2`, the remainder is `0`.\n\n### Example 2.1\n```csharp\n\
    int add=100+200;\nConsole.WriteLine(add);\nint div=800/2;\nConsole.WriteLine(div);\n\
    int mod=100%3;\nConsole.WriteLine(mod);\nint inc=10;\nConsole.WriteLine(inc);\n\
    ```\nExplanation: `add=100+200` outputs `300`; `div=800/2` outputs `400`; `mod=100%3`\
    \ outputs `1`; `++inc` outputs `11`.\n\n### Logical Operators\nAfter using logical\
    \ operators, the result will be true or false.\n\n| Operators | Running |\n| :---\
    \ | :--- |\n| `&&` | AND |\n| `||` | OR |\n| `!` | NOT |\n\n### Example 2.2\n\
    ```csharp\nbool x=true; bool y=false;\nbool a=x && y; Console.WriteLine(a); //\
    \ output: false\nbool b=x || y; Console.WriteLine(b); // output: true\nbool c=!\
    \ x; Console.WriteLine(c); // output: false\n```\nExplanation:\n`true && true`\
    \ returns `true`; `true && false` returns `false`; `false && false` returns `false`.\n\
    `true || true` returns `true`; `true || false` returns `true`; `false || false`\
    \ returns `false`.\n`! false` returns `true`; `! true` returns `false`.\n\n###\
    \ Assignment Operators\n| Operators | Examples: |\n| :--- | :--- |\n| `+=` | `x+=y`\
    \ |\n| `-=` | `x-=y` |\n| `*=` | `x*=y` |\n| `/=` | `x/=y` |\n| `%=` | `x%=y`\
    \ |\n\n### Example 2.3\n```csharp\nint x=200; int y=100;\nx += y; Console.WriteLine(x);\n\
    x /= y; Console.WriteLine(x);\nx -= y; Console.WriteLine(x);\nstring m=\"abc\"\
    ; string n=\"de\";\nm += n; Console.WriteLine(m);\n```\nExplanation: `x+=y` outputs\
    \ `300`; `x/=y` outputs `2`; `x-=y` outputs `100`; `m+=n` outputs `abcd`.\n\n\
    ### Comparison Operators\n| Operators | Running |\n| :--- | :--- |\n| `>` | greater\
    \ than |\n| `<` | less than |\n| `>=` | greater than or equal |\n| `<=` | less\
    \ than or equal |\n| `==` | equal |\n| `!=` | not equal |\n\nAfter using comparison\
    \ operators, the result will be true or false.\n\n### Example 2.4\n```csharp\n\
    int a = 100; int b = 200; bool result;\nresult = (a > b); Console.WriteLine(result);\n\
    result = (a == b); Console.WriteLine(result);\nresult = (a != b); Console.WriteLine(result);\n\
    ```\nExplanation: `result = (a>b)` tests `100>200`, outputs `false`; `result =\
    \ (a==b)` tests `100==200`, outputs `false`; `result = (a!=b)` tests `100!=200`,\
    \ outputs `true`.\n\n### Conditional Operator\n`(test-expression) ? (if-true-do-this)\
    \ : (if-false-do-this);`\n`(test-expression)` looks like `a<b`, `x!=y`, `m==n`.\n\
    \n### Example 2.5\n```csharp\nusing System;\nnamespace ConditionalOperator{\n\
    \    class Program{\n        static void Main(string[] args){\n            int\
    \ a = 100; int b = 200;\n            string result1 = (a < b) ? \"apple\" : \"\
    banana\";\n            Console.WriteLine(\"result1 is: \" + result1);\n      \
    \      string result2 = (a > b) ? \"apple\" : \"banana\";\n            Console.WriteLine(\"\
    result2 is: \" + result2);\n            Console.ReadLine();\n        }\n    }\n\
    }\n```\nOutput:\n`result1 is: banana`\n`result2 is: apple`\n\n### Increment and\
    \ Decrement\n| `++a` | a plus 1 first, then run expression |\n| `a++` | run expression\
    \ first, then a plus 1 |\n| `--b` | b minus 1 first, then run expression |\n|\
    \ `b--` | run expression first, then b minus 1. |\n\n### Example 2.6\n```csharp\n\
    int a = 10, num;\nnum = ++a - 2;\nConsole.WriteLine(num);\n```\nOutput: `9`\n\
    Explanation: `++a` makes `a` 11, `11 - 2` equals `9`, the result `9` is assigned\
    \ to `num`.\n\n### Example 2.7\n```csharp\nint a = 10, num;\nnum = a++ - 2;\n\
    Console.WriteLine(num);\n```\nOutput: `8`\nExplanation: `a++` uses 10 for the\
    \ calculation, `10 - 2` equals `8`, the result `8` is assigned to `num`.\n(`--a`\
    \ and `a--` are the same usage as `++a` and `a++`.)\n\n### SizeOf\n```csharp\n\
    sizeof(dataType);\n```\n"
