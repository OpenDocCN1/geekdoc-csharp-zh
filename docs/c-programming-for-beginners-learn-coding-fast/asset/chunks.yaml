    B. `a ++` `++ a` `b --` `-- b` \nC. `++ a` `a ++` `b --` `-- b` \nD. `a ++` `++\
    \ a` `-- b` `b -` (14)\n\n# Structs in C#\n\n```csharp\nusing System;\nnamespace\
    \ structSample{\n    struct Student { \n        // defines a struct type\n   \
    \     public int id;      // struct field\n        public string name;  // struct\
    \ field\n        public int age;      // struct field\n    }\n    class Program{\n\
    \        static void Main(string[] args){\n            Student Smith; // define\
    \ a struct variable\n            Smith.id = 1001;\n            Smith.name = \"\
    Andy\";\n            Smith.age = 16;\n            Console.WriteLine(\"Smith's\
    \ id is \" + Smith.id);\n            Console.WriteLine(\"Smith's name is \" +\
    \ Smith.name);\n            Console.WriteLine(\"Smith's age is \" + Smith.age);\n\
    \            Console.ReadLine();\n        }\n    }\n}\n```\n\nA. Define `struct`\n\
    B. `struct Student`\nC. `struct Define`\nD. `Class Student` (15)\n\n# For Loops\n\
    \n```csharp\nusing System;\nnamespace ForStatement{\n    class Program{\n    \
    \    static void Main(string[] args){\n            for (int x = 0; x <= 5; x++)\
    \ { \n                // loop statement\n                Console.Write(x);\n \
    \           }\n            Console.ReadLine();\n        }\n    }\n}\n```\nA. `do`\n\
    B. `while`\nC. `if`\nD. `for` (16)\n\n# Array Length\n\n```csharp\nusing System;\n\
    namespace CreatArray1{\n    class Program{\n        static void Main(string[]\
    \ args){\n            int[] myArray = { 10, 20, 30, 40 };\n            int num\
    \ = myArray.Length; // get the array length\n            Console.WriteLine(num);\n\
    \            Console.ReadLine();\n        }\n    }\n}\n```\nA. `size`\nB. `size()`\n\
    C. `length`\nD. `length()` (17)\n\n# Try Catch Finally Blocks\n\n```csharp\nusing\
    \ System;\nnamespace trycatch{\n    class Program{\n        static void Main(string[]\
    \ args){\n            try { \n                // exception may occur\n       \
    \         string str1 = \"Java in 8 Hours\";\n                string str2 = str1.Insert(100,\
    \ \"Script\"); // 100 cause exception\n            } catch (Exception ex){ \n\
    \                // handle exception\n                Console.WriteLine(ex.Message);\n\
    \            } finally { \n                // must execute\n                Console.WriteLine(\"\
    Exception has been handled! \"); \n                Console.ReadLine();\n     \
