    \n## 目录\n- 前言\n- 关于作者\n- 推荐书籍\n- 第一章：C# 简介\n- 第二章：运算符\n- 第三章：控制结构\n- 第一个 C# 程序\n\
    - 第四章：字符串与数组\n- 第五章：函数与异常\n- 第六章：类与对象\n- 第七章：访问修符\n- 第八章：静态抽象接口\n\n## 前言\n本书旨在帮助初学者快速上手\
    \ C# 编程。通过实战示例，你将掌握 C# 的核心概念。\n\n## 第一章：C# 简介\n### 什么是 C#？\nC# 是一种基于 C++ 的面向对象（OOP）语言，旨在与微软配合使用。\n\
    \n在线 C# 编译器与编辑器\n如果你不想在本地计算机上安装 C#，可以使用在线的编译器与编辑器。将 C# 代码输入编辑器，点击“编译”，即可看到结果。\n\
    \n### 第一个 C# 程序\n让我们这样编写“Hello World”程序：\n```csharp\nusing System;\nnamespace\
    \ HelloWorld\n{\n    class Program\n    {\n        static void Main(string[] args)\n\
    \        {\n            Console.WriteLine(\"Hello World ! \");\n            Console.ReadLine();\n\
    \        }\n    }\n}\n```\n输出：\nHello World!\n\n解释：\n`using System`: `using` 是一个指令，指定编译器（或汇编器、解释器）如何处理数据。`System`\
    \ 是用于组织各种对象的命名空间，以便可以通过名称引用这些对象。\n`namespace HelloWorld`: 文件名为 `HelloWorld.cs`。\n\
    `class Program`: C# 程序的类总是包含一个 `Main` 方法。\n`static void Main(string[] args)`:\
    \ 这是一个运行 C# 程序的入口方法。当应用程序执行时，`Main` 方法是第一个被调用的方法`(string[] args)` 用于传递输入参数。\n\
    `Console.WriteLine()`: 这是一个显示输出结果的方法。\n`Console.ReadLine()`: 这是一个暂停屏幕的方法，确保输出结果显示。如果没有此命令，输出结果将被跳过。\n"
- fmt: "\n# C# Comments\n\nC# comments are used to explain the current code, describe\
    \ what this code is doing. C# compiler will ignore comments. ``//` is used for\
    \ a single line comment. `/*…*/` is used for multi line comments.\n\n## Example\
    \ 1.2\n```csharp\nConsole.WriteLine (“Hello World”); // show “Hello World”\n/*\
    \ Console.WriteLine() is a C# output command, meaning display or print .*/\n```\n\
    **Explanation:**\n`//` show “Hello World ” is a single line comment.\n`/* Console.WriteLine()\
    \ is a C# output command, meaning display or print . */` is a multi line comment.\n\
    \n# Escaping Characters\n\nThe `\\` backslash character can be used to escape\
    \ characters. \n\n- `\\n` outputs content to the next new line.\n- `\\r` makes\
    \ a return.\n- `\\t` makes a tab.\n- `\\'` outputs a single quotation mark.\n\
    - `\\\"` outputs a double quotation mark.\n\n## Example 1.3\n```csharp\nusing\
    \ System;\nnamespace EscapingCharacters{\n    class Program{\n        static void\
    \ Main(string[] args){\n            Console.WriteLine(\"    \\\" Escaping Character\
    \ Samples\\\"    \");\n            Console.ReadLine();\n        }\n    }\n}\n\
    ```\n**Output:** “ Escaping Character Samples”\n**Explanation:** `\\\"` outputs\
    \ a double quotation mark.\n**Note:** “ Escaping Character Samples” has a pair\
    \ of double quotations with it; you can see the double quotations including the\
    \ text in the output result.\n\n## Example 1.4\n```csharp\nConsole.WriteLine (\
    \ “Hello \\t\\t\\t World! ” ); // Note it has three taps .\n```\n**Output:** Hello\
    \       World!\n**Explanation:** `\\t` makes a tab\n\n## Example 1.5\n```csharp\n\
    Console.WriteLine ( “Hello \\n World! ” ); // Note it has a \\n .\n```\n**Output:**\
    \ \nHelloWorld !\n**Explanation:** `\\n` outputs content to the next new line.\n\
    \n# C# Keywords\n\nSome words are only used by C# language itself. They may not\
    \ be used when choosing identifier names for variable, function, and labels. The\
    \ following words are part of C# reserved words:\n\n| abstract | byte | char |\
    \ continue | double | extern | float | if | interface | object | public | string\
    \ | this | try |\n\n## Summary\n\n- `using System`: The `using` is a keyword meaning\
    \ “running”. The `System` means a namespace which is used to group the C# classes,\
    \ objects etc.\n- `namespace HelloWorld`: The file name is “HelloWorld.cs”.\n\
    - `class Program`: The class of C# Program always contains one main method.\n\
    - `static void Main(string[] args)`: This is a main method that is the entery\
    \ point to run the C# program. `(string[] args)` is used to pass input parameters.\n\
    - `Console.WriteLine()`: This is a method to display the output result.\n- `Console.ReadLine()`:\
    \ This is a method to pause the screen, and makes sure to show the output result.\
    \ Otherwise, the output result will be skipped without this command.\n- `//` is\
    \ used for single line comment.\n- `/*…*/` is used for multi line comments.\n\
    - `\\n` outputs content to the next new line.\n- `\\r` makes a return.\n- `\\\
    t` makes a tab.\n- `\\'` outputs a single quotation mark.\n- `\\\"` outputs a\
    \ double quotation mark.\n\nC# keywords are only used by C# language itself. They\
    \ may not be used when choosing identifier names for variable, function, and labels.\
    \ For example: `if`, `new`, `while` and `try` are C# keywords reserved by C# language.\n\
    \n# Exercise: Run C# Program!\n\nPlease open the Visual C#, click `File > New\
    \ Project > Console Application`. Type the file name “MyProgram”. Write the C#\
    \ code in editor:\n\n```csharp\nusing System;\nnamespace MyProgram{\n    class\
    \ Program{\n        static void Main(string[] args) // Main Method\n        {\n\
    \            string str = \"Let's study C# progrmming! \"; // define a string\n\
    \            Console.Write(str); // output the value of str\n            Console.ReadLine();\
    \ // makes sure to show the output result\n        }\n    }\n}\n```\n**Output:**\
    \ Let’s study C# programming!\n**Explanation:**\n- `static void Main(string[]\
    \ args)` is a main method, the C# program always runs from this starting point.\n\
    - `string str = \"Let's study C# progrmming! \";` defines a string and its value.\
    \ `string` is a data type. `str` is a variable, “Let’s study programming” is a\
    \ value.\n- `Console.Write(str);` shows the value of the `str` variable. The `str`\
    \ value is “Let’s study C# programming! ”, so we can see the output result \"\
    Let's study C# programming!\".\n- `Console.ReadLine()`: makes sure to show the\
    \ output result.\n\nFrom above example, we can see some keywords in the programs,\
    \ such as `using`, `static`, `void` and `string` etc.\n\n# Data Type\n\nC# has\
    \ two categories of data types:\n1. Value types: integers, numbers, decimal, `char`,\
    \ `bool`\n2. Reference types: `object`, `string`\n\n| Type | Description |\n|\
    \ :--- | :--- |\n| sbyte | 8 bit signed integer |\n| byte | 8 bit unsigned integer\
    \ |\n| short | 16 bit signed integer |\n| ushort | 16 bit unsigned integer |\n\
    | int | 32 bit signed integer |\n| uint | 32 bit unsigned integer |\n| long |\
    \ 64 bit signed integer |\n| ulong | 64 bit unsigned integer |\n| char | Unicode\
    \ character |\n| float | Single precision floating point number |\n| double |\
    \ Double precision floating point number |\n| bool | Boolean value, true or false\
    \ |\n| decimal | Precise decimal value |\n| string | String of any length |\n\
    | Object | Any type |\n\n# Variable\n\nA variable is a container that holds values\
    \ that are used in a C# program. Each variable has its own name such as: `a`,\
    \ `b`, `str`, `myVariable`…… etc. (We will talk about “Variable” again in next\
    \ page)\n\n## Example 1.6\n```csharp\nint a = 10; // int is a data type, a is\
    \ a variable, 10 is a value\nbool test = true; // bool is a data type, test is\
    \ a variable, true is a value .\nfloat f = 1.0f; // float is a data type, f is\
    \ a variable, 1.0f is a value .\ndouble d = 1.0d; // double is a data type, d\
    \ is a variable, 1.0d is a value .\ndecimal dec = 2.2m; // decimal is a data type,\
    \ dec is variable, 2.2m is a value .\nbyte b = 10; // byte is a data type, b is\
    \ a variable, 10 is a value .\nlong l = 10L; // long is a data type, l is a variable,\
    \ 10L is a value .\nchar c = 'V'; // char is a data type, c is a variable, V is\
    \ a value .\nstring myString = \"Hello! \"; // string is a data type, myString\
    \ is a variable, Hello ! is a value .\nobject myObject = \"C#\"; // object is\
    \ a data type, myObject is an object variable, “C#” is a value .\n```\n**Explanation:**\n\
    We can use following equation to define data type, variable and value:\n`data-type\
    \ variable = value`\n\nA variable is a container that holds values that are used\
    \ in a C# program; a variable represents a storage location.\n`dataType variable\
    \ = value`\n“dataType variable = value” is used to define a variable and its value.\n\
    \n## Example 1.7\n```csharp\nstring name = \"Smith\"; // string variable\nint\
    \ age = 16; // int variable\nbool b = true; // bool variable\n```\n**Explanation:**\
    \ `string`, `int`, `bool` are data type. `name`, `age`, `b` are variable.\n\n\
    # Variable Define\n\nThere are different ways to define a variable.\n\n## Example\
    \ 1.8\n```csharp\nusing System;\nnamespace VariableSample{\n    class Program{\n\
    \        static void Main(string[] args){\n            float x, y;\n         \
    \   y = 1.23456f;\n            x = y;\n            Console.WriteLine(x);\n   \
    \         int i;\n            int a = 10, b = 20, c = 30;\n            i = a +\
    \ b + c;\n            Console.WriteLine(i);\n            Console.ReadLine();\n\
    \        }\n    }\n}\n```\n**Output:**\n1.23456\n60\n**Explanation:** `float x,\
    \ y;` defines two variables `x, y`. `int i;` defines a variable. `int a = 10,\
    \ b = 20, c = 30;` defines three variable `a`, `b` and `c`.\n\n# Constant\n\n\
    Constant is a value that is never changeable, such as 200, 1.23e6, “GOOD”.\n\n\
    `const dataType constant = value`\n“const” is used to define a constant.\n\n##\
    \ Example 1.9\n```csharp\nconst double PI = 3.14159265; // define a constant\n\
    const string BOOK = \"C# Programming Language\"; // constant\n```\n**Explanation:**\
    \ `PI` is a constant name. `3.14159265` is a constant value. `BOOK` is a constant\
    \ name. “C# Programming Language” is a constant value. The constant value is unchangeable\
    \ in program running.\n\n# Constant Define\n\nConstant name is always written\
    \ in uppercase.\n\n## Example 1.10\n```csharp\nusing System;\nnamespace ConstantSample{\n\
    \    class Program{\n        static void Main(string[] args){\n            const\
    \ double PI = 3.14159265; // PI is a constant\n            const string BOOK =\
    \ \"C# Programming Language\"; // constant\n            Console.WriteLine(PI);\n\
    \            Console.WriteLine(BOOK);\n            Console.ReadLine();\n     \
    \   }\n    }\n}\n```\n**Output:**\n3.14159265\nC# Programming Language\n**Explanation:**\
    \ `PI` and `BOOK` are constant names.\n\n# Data Type Conversion\n\nData Type can\
    \ be changed in C# programming.\n\n` (DataType) variable`\n"
