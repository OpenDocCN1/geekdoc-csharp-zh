  trans: "\n\n`sizeof(dataType);` 用于获取数据类型的大小（以字节为单位）。\n\n### 示例 2.8\n```csharp\n\
    using System;\nnamespace sizeofsample\n{\n    class Program\n    {\n        static\
    \ void Main(string[] args)\n        {\n            Console.WriteLine(\"The size\
    \ of short is \" + sizeof(short));\n            Console.WriteLine(\"The size of\
    \ int is \" + sizeof(int));\n            Console.WriteLine(\"The size of long\
    \ is \" + sizeof(long));\n            Console.ReadLine();\n        }\n    }\n\
    }\n```\n**输出：**\n```\nThe size of short is 2\nThe size of int is 4\nThe size of\
    \ long is 8\n```\n**解释：**\n`sizeof(dataType);` 用于获取数据类型的大小（以字节为单位）。\n\n### 运算符优先级\n\
    下表列出了按优先级优先级排序的运算符。\n\n| 优先级 | 运算符 |\n| :--- | :--- |\n| 1 | `( )` `.` `[ ]` `++a`\
    \ `--a` `sizeof()` |\n| 2 | `*` `/` `%` |\n| 3 | `+` `-` |\n| 4 | `a++` `a--`\
    \ |\n| 5 | `<<` `>>` |\n| 6 | `<` `>` `<=` `>=` `is` |\n| 7 | `==` `!=` |\n| 8\
    \ | `&` `^` `\\|` |\n| 9 | `!` |\n| 10 | `&&` |\n| 11 | `\\|` |\n| 12 | `? :`\
    \ |\n| 13 | `=` `*=` `/=` `%=` `+=` `-=` `<<=` `>>=` |\n\n同一单元格内的运算符具有相同的优先级。\n\
    \n### 总结\n| 运算符 |\n| :--- |\n| `+` |\n| `-` |\n| `*` |\n| `/` |\n| `%` |\n| `++`\
    \ or `--` |\n\n| 运算符 |\n| :--- |\n| `&&` |\n| `\\|` |\n| `!` |\n\n| 运算符 | 示例 |\n\
    | :--- | :--- |\n| `+=` | `x+=y` |\n| `-=` | `x-=y` |\n| `*=` | `x*=y` |\n| `/=`\
    \ | `x/=y` |\n| `%=` | `x%=y` |\n\n| 运算符 | 运行逻辑 |\n| :--- | :--- |\n| `>` | 大于\
    \ |\n| `<` | 小于 |\n| `>=` | 大于等于 |\n| `<=` | 小于等于 |\n| `==` | 等于 |\n| `!=` | 不等于\
    \ |\n| `(test-expression) ? (if-true-do-this) : (if-false-do-this);` | |\n| `++\
    \ a` | `a` 先加 1，再执行表达式 |\n| `a++` | 先执行表达式，后 `a` 加 1 |\n| `-- b` | `b` 先减 1，再执行表达式\
    \ |\n| `b--` | 先执行表达式，后 `b` 减 1 |\n\n### 练习题：递减 --a & b\n请打开 Visual C#，点击文件 (File)\
    \ > 新项目 (New Project) > 控制台应用 (Console Application)。输入文件名“MinusMinus”。在编辑器中编写\
    \ C# 代码：\n\n```csharp\nusing System;\nnamespace MinusMinus\n{\n    class Program\n\
    \    {\n        static void Main(string[] args)\n        {\n            int a\
    \ = 10, num;\n            num = --a - 3; /* 10 先减 1，然后 9 减 3，结果“6”将被赋值给 num */\n\
    \            Console.WriteLine(num);\n            int b = 10, var;\n         \
    \   var = b-- - 3; /* 10 先减 3，将值 7 赋值给 var，然后 b 减 1*/\n            Console.WriteLine(var);\n\
    \            Console.ReadLine();\n        }\n    }\n}\n```\n**输出：**\n```\n6\n\
    7\n```\n**解释：**\n`--a`: `a` 先减 1，再执行表达式。\n`b--`: 先执行表达式，后 `b` 减 1。\n\n### 结构体类型\
    \ (Struct Types)\n结构体类型是一种值类型，通常用于封装一组相关的变量。对于具有值语义的数据结构，结构体非常有用。声明一个结构体类型的语法如下所示：\n\
    \n```csharp\npublic struct Student {\n    public int id;\n    public string name;\n\
    \    public int age;\n}\n```\n`public` 是访问修饰符。`Student` 是结构体类型。`id, name, age`\
    \ 是三个结构体字段。\n\n### 示例 2.9\n```csharp\npublic struct Car {\n    //  // 定义一个结构体类型\n\
    \    public int price;      // 结构体字段\n    public string size;    // 结构体字段\n  \
    \  public string color;    // 结构体字段\n}\n```\n\n### 结构体变量 (Struct Variable)\n声明结构体变量的语法如下：\n\
    \n```csharp\nStudent Smith;\n```\n`Student` 是结构体类型。`Smith` 是结构体变量。\n\n### 示例 2.10\n\
    ```csharp\nCar Ford;   // Car 是结构体类型 . Ford 是结构体变量\n```\n访问结构体字段的语法：\n```csharp\n\
    StructVariable.field\n```\n\n### 示例 2.11\n`Smith.id` 表示 Smith 的 id。`Smith.name`\
    \ 表示 Smith 的名字。`Smith.age` 表示 Smith 的年龄。`Ford.price` 表示 Ford 的价格。`Ford.size` 表示\
    \ Ford 的尺寸。`Ford.color` 表示 Ford 的颜色。\n\n### 结构体的用法\n### 示例 2.12\n```csharp\nusing\
    \ System;\nnamespace structSample\n{\n    struct Student {\n        //  // 定义一个结构体类型\n\
    \        public int id;\n        public string name;\n        public int age;\n\
    \    }\n    class Program\n    {\n        static void Main(string[] args)\n  \
    \      {\n            Student Smith;\n            Smith.id = 1001;\n         \
    \   Smith.name = \"Andy\";\n            Smith.age = 16;\n            Console.WriteLine(\"\
    Student's id is \" + Smith.id);\n            Console.WriteLine(\"Student's name\
    \ is \" + Smith.name);\n            Console.WriteLine(\"Student's age is \" +\
    \ Smith.age);\n        }\n    }\n}\n```\n**输出：**\n```\n1001\nAndy\n16\n```\n**解释：**\n\
    `struct Student` 定义了一个结构体类型。`Student Smith` 定义了一个结构体变量。`Student.id` 表示学生的 id。`Student.name`\
    \ 表示学生的名字。`Student.age` 表示学生的年龄。\n\n### 枚举类型 (Enum Types)\n枚举类型提供了一种组织良好的方式，用于定义一组可能的整型常量，这些常量可以赋值给变量。声明枚举类型的语法如下：\n\
    \n```csharp\npublic enum Today {Morning, Afternoon, Evening};\n```\n`public` 是访问修饰符。`Today`\
    \ 是枚举类型。`Morning, Afternoon, Evening` 是枚举成员。\n\n### 示例 2.13\n```csharp\nenum Week\
    \ {\n    //  // 定义一个枚举类型\n    Sunday,   // 枚举成员\n    Monday,  // 枚举成员\n    Tuesday\
    \  // 枚举成员\n}\n```\n\n### 枚举变量 (Enum Variable)\n声明枚举变量的语法如下：\n\n```csharp\nToday\
    \ t;\n```\n`Today` 是枚举类型。`t` 是枚举变量。\n\n### 示例 2.14\n```csharp\nWeek w;   // Week\
    \ 是枚举类型, w 是枚举变量\n```\n访问枚举成员的语法：\n```csharp\nEnumType.member\n```\n\n### 示例 2.15\n\
    `Today.Morning` 表示今天的早晨。`Today.Afternoon` 表示今天的下午。`Today.Evening` 表示今天的傍晚。`Week.Sunday`\
    \ 表示周日。`Week.Monday` 表示周一。`Week.Tuesday` 表示周二。\n\n### 枚举的用法\n### 示例 2.16\n```csharp\n\
    using System;\nnamespace enumExample\n{\n    public enum Today {\n        // \
    \ // 定义一个枚举类型\n        morning,   // 枚举成员\n        afternoon, // 枚举成员\n      \
    \  evening    // 枚举成员\n    }\n    class Program\n    {\n        static void Main(string[]\
    \ args)\n        {\n            Today t0, t1, t2;\n            t0 = Today.morning;\n\
    \            t1 = Today.afternoon;\n            t2 = Today.evening;\n        \
    \    Console.WriteLine(\"Have a breakfast in \" + t0);\n            Console.WriteLine(\"\
    Have a lunch in \" + t1);\n            Console.WriteLine(\"Have a supper in \"\
    \ + t2);\n            Console.ReadLine();\n        }\n    }\n}\n```\n**输出：**\n\
    ```\nmorning\nafternoon\nevening\n```\n**解释：**\n`enum Today` 定义了枚举类型 `Today`。`Today\
    \ t0, t1, t2` 定义了三个枚举变量。`Today.morning` 表示今天的早晨。`Today.afternoon` 表示今天的下午。`Today.evening`\
    \ 表示今天的傍晚。\n\n"
- fmt: "\n`public` is an access modifier. `Today` is an `Enum` type. `Morning, Afternoon,\
    \ Evening` are three enum members.\n\n## Exercise: Car’s FeatureStruct Study\n\
    \nPlease open the Visual C#, click `File > New Project > Console Application`.\
    \ Type the file name `structStudy`. Write the C# code in editor:\n\n```csharp\n\
    using System;\nnamespace structStudy\n{\n    public struct Car\n    {\n      \
    \  // defines a struct type\n        public int price;      // struct field\n\
    \        public string size;    // struct field\n        public string color;\
    \    // struct field\n    }\n    class Program\n    {\n        static void Main(string[]\
    \ args)\n        {\n            Car Ford; // defines a struct variable\n     \
    \       Ford.price = 90000;\n            Ford.size = \"big\";\n            Ford.color\
    \ = \"black\";\n            Console.WriteLine(\"Ford's price is $\" + Ford.price);\n\
    \            Console.WriteLine(\"Ford's size is \" + Ford.size);\n           \
    \ Console.WriteLine(\"Ford's color is \" + Ford.color);\n            Console.ReadLine();\n\
    \        }\n    }\n}\n```\n\nSave the file, click `Start Debugging` to run the\
    \ program.\n\n**Output:**\nFord’s price is $90000\nFord’s size is big\nFord’s\
    \ color is black\n\n**Explanation:**\n`struct Car` defines a struct type `Car`.\
    \ `Car Ford` declares a struct variable `Ford`. `Ford.price` means Ford’s price.\
    \ `Ford.size` means Ford’s size. `Ford.color` means Ford’s color.\n\n## Exercise:\
    \ WeekdaysEnum Study\n\nBy default the first enumerator has the value 0, and the\
    \ value of each successive enumerator is increased by 1. For instance, in the\
    \ following enumeration, Sunday is 0; Monday is 1, Tuesday is 2, and so on. \n\
    \nPlease open the Visual C#, click `File > New Project > Console Application`.\
    \ Type the file name `enumStudy`. Write the C# code in editor:\n\n```csharp\n\
    using System;\npublic class enumStudy\n{\n    enum Week\n    {\n        // defines\
    \ an enum type\n        Sunday,  // enum member\n        Monday,  // enum member\n\
    \        Tuesday  // enum member\n    }\n    class Program\n    {\n        static\
    \ void Main()\n        {\n            int w0, w1, w2;\n            w0 = (int)Week.Sunday;\n\
    \            w1 = (int)Week.Monday;\n            w2 = (int)Week.Tuesday;\n   \
    \         Console.WriteLine(\"The value of Sunday is \" + w0);\n            Console.WriteLine(\"\
    The value of Monday is \" + w1);\n            Console.WriteLine(\"The value of\
    \ Tuesday is \" + w2);\n            Console.ReadLine();\n        }\n    }\n}\n\
    ```\n\nSave the file, click `Start Debugging` to run the program.\n\n**Output:**\n\
    The value of Sunday is 0\nThe value of Monday is 1\nThe value of Tuesday is 2\n\
    \n**Explanation:**\n`enum Week` defines an enum type `Week`. The default value\
    \ of the first enum member is 0, the default value of the second enum member is\
    \ 1, the default value of the third enum member is 2.\n\n# Chapter 3: Control\
    \ Structures\n\n### If Statement\n\n```\nif ( test-expression ) {\n   // if true\
    \ do this;\n}\n```\n\nThe `if statement` executes codes inside `{ ... }` only\
    \ if a specified condition is true, does not execute any codes inside `{…}` if\
    \ the condition is false. \n\n**Example 3.1**\n```csharp\nusing System;\nnamespace\
    \ IfStatement\n{\n    class Program\n    {\n        static void Main(string[]\
    \ args)\n        {\n            int a = 200;\n            int b = 100;\n     \
    \       if (a > b)\n            {\n                // if true do this;\n     \
    \           Console.WriteLine(\"a is greater than b. \");\n                Console.ReadLine();\n\
    \            }\n        }\n    }\n}\n```\n**Output:**\na is greater than b\n\n\
    **Explanation:** \n`(a>b)` is a test expression, namely `(200>100)`, if `if` returns\
    \ true, it will execute the codes inside the `{ }`, if `if` returns false, it\
    \ will not execute the codes inside the `{ }`.\n\n### If-else Statement\n\n```\n\
    if ( test-expression) {\n    // if true do this;\n} else {\n    // if false do\
    \ this;\n}\n```\n\n**Example 3.2**\n```csharp\nusing System;\nnamespace IfelseStatement\n\
    {\n    class Program\n    {\n        static void Main(string[] args)\n       \
    \ {\n            int a = 100;\n            int b = 200;\n            if (a > b)\n\
    \            {\n                // if true do this;\n                Console.WriteLine(\"\
    a is greater than b. \");\n                Console.ReadLine();\n            }\n\
    \            else\n            {\n                // if false do this;\n     \
    \           Console.WriteLine(\"a is less than b. \");\n                Console.ReadLine();\n\
    \            }\n        }\n    }\n}\n```\n**Output:**\na is less than b\n\n**Explanation:**\
    \ \n`(a>b)` is a test expression, namely `(100>200)`, if `if` returns true, it\
    \ will output `\"a is greater than b. \"` if `if` returns false, it will output\
    \ `\"a is less than b\"`.\n\n### Switch Statement\n\n```\nswitch (variable ){\n\
    \    case 1: if equals this case, do this; break;\n    case 2: if equals this\
    \ case, do this; break;\n    case 3: if equals this case, do this; break;\n}\n\
    ```\n\nThe `switch` statement matches a `variable` against multiple `case` values.\n\
    \n**Example 3.3**\n```csharp\nusing System;\nnamespace SwichStatement\n{\n   \
    \ class Program\n    {\n        static void Main(string[] args)\n        {\n \
    \           // logic for switch\n        }\n    }\n}\n```\n\n### For Loop\n\n\
    ```\nfor ( init; test-expression; increment) {\n    // some code\n}\n```\n\nThe\
    \ `for` loop repeats a block of code a specific number of times.\n\n**Example\
    \ 3.4**\n```csharp\nusing System;\nnamespace ForStatement\n{\n    class Program\n\
    \    {\n        static void Main(string[] args)\n        {\n            for (int\
    \ x = 0; x <= 5; x++)\n            {\n                // code\n            }\n\
    \        }\n    }\n}\n```\n\n### While Loop\n\n```\nwhile ( test-expression )\
    \ {\n    // some code\n}\n```\n\nThe `while` loop repeats a block of code as long\
    \ as the condition is true.\n\n**Example 3.5**\n```csharp\nusing System;\nnamespace\
    \ WhileStatement\n{\n    class Program\n    {\n        static void Main(string[]\
    \ args)\n        {\n            int counter = 0;\n            while (counter <\
    \ 8)\n            {\n                Console.Write(\"&\");\n                counter++;\n\
    \            }\n        }\n    }\n}\n```\n\n### Do-While Loop\n\n```\ndo {\n \
    \   // some code\n} while ( test-expression);\n```\n\nThe `do...while` loop executes\
    \ a block of code once, and then repeats it if the condition is true.\n\n**Example\
    \ 3.6**\n```csharp\nusing System;\nnamespace DoWhileStatement\n{\n    class Program\n\
    \    {\n        static void Main(string[] args)\n        {\n            int counter\
    \ = 0;\n            do\n            {\n                Console.Write(\"@\");\n\
    \                counter++;\n            } while (counter < 8);\n        }\n \
    \   }\n}\n```\n\n### Break Statement\n\n```\nbreak;\n```\n\nThe `break` keyword\
    \ is used to stop the running of a loop according to the condition.\n\n**Example\
    \ 3.7**\n```csharp\nusing System;\nnamespace BreakStatement\n{\n    class Program\n\
    \    {\n        static void Main(string[] args)\n        {\n            int num\
    \ = 0;\n            while (num < 10)\n            {\n                if (num ==\
    \ 5) break;\n                num++;\n            }\n            Console.Write(num);\n\
    \        }\n    }\n}\n```\n\n### Continue Statement\n\n```\ncontinue;\n```\n\n\
    The `continue` keyword is used to stop the current iteration, ignoring the following\
    \ code, and then continue the next loop.\n\n**Example 3.8**\n```csharp\nusing\
    \ System;\nnamespace ContinueStatement\n{\n    class Program\n    {\n        static\
