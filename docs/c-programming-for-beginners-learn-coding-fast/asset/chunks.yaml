    it is used to read text from a file.“C:\\myFile. txt” specifies the path and a
    file to read.“myText = file. ReadLine();” reads the text of myFile. txt.SummaryAbstract
    class works as a parent class, which will be extended by its subclass. The method
    in the subclass will override the abstract method in the abstract class.Interface
    is a special class, which will be implemented by a class. The interface contains
    one or more empty method that will be implemented by a method of the class.Static
    variable can be referenced by a class. Non-static variable is referenced only
    by the object, not by class.Static method can be referenced by a class. Non-static
    method is referenced only by the object, not by class.Polymorphism describes the
    ability to perform different method for different objects. Polymorphism is completed
    by “virtual method” and “override method” together.To write a file, you should
    add a directive “Using System. IO;” and a class “StreamWriter ”.To read a file,
    you should add a directive “Using System. IO;” and a class “StreamReader ”.Exercise:
