  trans: "\n\n`Arrays.sort(arrayName);` 可以对数组元素进行排序。\n\n### 示例 4.12\n```csharp\nusing\
    \ System;\nnamespace sortArray{\nclass Program{\n    static void Main(string[]\
    \ args){\n        String [] arr = { \"Cat \", \"App \", \"Dog \", \"Boy \"};\n\
    \        Array.Sort(arr); // sort the array in order\n        foreach (String\
    \ var in arr){\n            Console. Write(var);\n        }\n        Console.\
    \ ReadLine();\n    }\n}}\n```\n输出：`App  Boy  Cat Dog`\n\n#### 解析\n`Array.Sort(arr);`\
    \ 根据元素值对数组 `arr` 进行排序。`foreach loop` 执行四次输出命令，显示排序后的结果：App Boy Cat Dog。\n\n###\
    \ 总结\n- `String.Length;` 返回字符串的长度。\n- `Substring(start, length )` 可以从字符串中提取子字符串。\n\
    - `Replace();` 可以替换字符串中的旧字符为新字符。\n- `Insert(index, character)` 在字符串索引处插入字符。\n\
    - `Remove(index, length )` 可以删除指定长度的字符串。\n\n`foreach` 语句在数组的每个元素上执行代码块，并将所有元素值赋给变量。\n\
    \n创建数组的第一种方法如下：\n`| type [] arrayName = {\"value0\", \"value1\", \"value2\",…};\
    \ |`\n\n创建数组的第二方法如下：\n`| type [] arrayName = new type [ number of elements ];arrayName[index0]\
    \ = \"value0\";arrayName[index1] = \"value1\";arrayName[index2] = \"value2\";\
    \ |`\n\n### 练习：C++ & C# 字符串与数组\n请打开 Visual#, 点击 `File > New Project > Console\
    \ Application`。输入文件名 `StringAndArray`。在编辑器中编写 C# 代码：\n\n```csharp\nusing System;\n\
    namespace StringAndArray{\nclass Program{\n    static void Main(string[] args){\n\
    \        string str1 = \"C++ in 8 Hours\";\n        string str2 = str1.Replace(\"\
    C++\", \"C#\"); // replace C++\n        Console. WriteLine(str2);\n        String[]\
    \ arr = { \"3rd \", \"2nd \", \"4th \", \"1st \" };\n        Array.Sort(arr);\
    \ // sort the array in order\n        foreach (String var in arr) {\n        \
    \    // put all element values to var\n            Console. Write(var);\n    \
    \    }\n        Console. ReadLine();\n    }\n}}\n```\n输出：`C# in 8 Hours 1st 2nd\
    \ 3rd 4th`\n\n#### 解析\n`str1.Replace(\"C++\", \"C#\");` 将 `C++` 替换为 `C#`。`Array.Sort(arr);`\
    \ 对数组 `arr` 进行排序。`foreach (String var in arr)` 在数组 `arr` 的每个元素上执行代码块，并将所有元素值赋给变量\
    \ `var`。\n\n# 第 5 章：函数与异常\n\n## 函数\n函数是一个可以重复运行多次的代码块。要定义一个函数，请使用 `type functionName()\
    \ { }`。\n\n`| type functionName() {……} |`\n\n要调用函数，请使用 `functionName();`\n`| functionName\
    \ (); |`\n\n### 示例 5.1\n```csharp\nusing System;\nnamespace functionExample{\n\
    class Program{\n    static void myFunction() {\n        // function declaration\n\
    \        Console. Write(\"This is a function example. \");\n        Console. ReadLine();\n\
    \    }\n    static void Main(string[] args){\n        myFunction(); // call function\n\
    \    }\n}}\n```\n输出：`This is a function example.`\n\n#### 解析\n`myFunction() {\
    \ }` 是函数的声明。`myFunction();` 调用函数 `myFunction() { }`。`static method`（静态方法）称为类方法，可以直接通过类访问。`static\
    \ variable`（静态变量）称为类变量，可以直接通过类访问。\n\n关于 `class`，后续章节将详细介绍。`void` 是一种返回类型。函数执行后将返回带有数据类型的结果，如\
    \ `int`、`string`、`bool`、`void`。`void` 表示没有返回数据类型。\n\n### 带参数的函数\n括号内可以包含一个或多个参数。参数用于向函数传递数据，使用\
    \ `type functionName(type arg) { }`。\n\n`| type functionName ( type arg ) {……}\
    \ |`\n\n要调用函数，使用 `functionName(argument);`\n`| functionName (argument ); |`\n\n\
    ### 示例 5.2\n```csharp\nusing System;\nnamespace functionExample{\nclass Program{\n\
    \    static void myFunction(string arg ){\n        // function declaration\n \
    \       Console. Write(arg );\n        Console. ReadLine();\n    }\n    static\
    \ void Main(string[] args){\n        String str = \"A function argument.\";\n\
    \        myFunction(str);\n    }\n}}\n```\n输出：`A function argument.`\n\n#### 解析\n\
    `myFunction(string arg){` 是函数声明。`myFunction(str);` 调用该函数。\n\n### 返回值\n`return`\
    \ 可以向调用者返回一个值。\n`| type functionName ( type arg ) {…… |`\n\n要调用函数，使用 `functionName(argument);`\n\
    \n### 示例 5.3\n```csharp\nusing System;\nnamespace functionExample{\nclass Program{\n\
    \    static int add(int a, int b){\n        return a + b;\n    }\n    static void\
    \ Main(string[] args){\n        int result = add(5, 10);\n        Console. WriteLine(\"\
    Result: \" + result);\n    }\n}}\n```\n输出：`Result: 15`\n\n#### 解析\n`add(int a,\
    \ int b)` 返回 `a` 和 `b` 的和。`result` 存储返回的值。\n\n### 异常\nC# 程序可能会出现某些错误，如下：\n- `Arithmetic\
    \ Exception`（算术异常）\n- `Array Mismatch Exception`（数组不匹配异常）\n- `Divided By Zero\
    \ Exception`（除零异常）\n- `Index Out of Range Exception`（越界异常）\n- `Invalid Cast Exception`（无效转换异常）\n\
    - `Null Reference Exception`（空引用异常）\n- `Out of Memory Exception`（内存不足异常）\n- `Overflow\
    \ Exception`（溢出异常）\n- `Type Initialization Exception`（类型初始化异常）\n\n### TryCatch\n\
    `| try{ …}catch(exception ex){……} |`\n\n当发生异常错误时，`try {…}` 将异常抛出到 `catch( ) {\
    \ }` 块。`catch( ){ }` 捕获 `try` 块中的任何异常并进行处理。`ex` 是异常对象。\n\n`| exceptionObject.\
    \ Message |`\n`exceptionObject.Message` 显示异常消息。\n\n#### 示例 5.4\n```csharp\nusing\
    \ System;\nnamespace trycatch{\nclass Program{\n    static void Main(string[]\
    \ args){\n        int a, b = 0;\n        try {\n            a = 100 / b;\n   \
    \     } catch (Exception ex){\n            Console. WriteLine(ex.Message ); //\
    \ exception message\n        }\n        Console. ReadLine();\n    }\n}}\n```\n\
    输出：`Attempted to divide by zero.`\n\n#### 解析\n在 `try{ }` 块中，`a = 100 / b;` 导致异常。`catch(Exception\
    \ ex){}` 捕获该异常。`ex` 是异常对象。`ex.message` 显示消息。\n\n### TryCatchFinally\n`| try{…}catch(exception\
    \ ex){ …… }finally{ must-execute-code} |`\n\n`finally` 块包含必须执行的代码。\n\n### 示例 5.5\n\
    ```csharp\nusing System;\nnamespace trycatch{\nclass Program{\n    static void\
    \ Main(string[] args){\n        try {\n            string str1 = \"Java in 8 Hours\"\
    ;\n            string str2 = str1.Insert(100, \"Script\"); // 100 causes exception\n\
    \        } catch (Exception ex){\n            Console. WriteLine(ex. Message);\n\
    \        } finally {\n            // must execute\n            Console. WriteLine(\"\
    Exception has been handled! \");\n        }\n        Console. ReadLine();\n  \
    \  }\n}}\n```\n输出：`Index was out of range……Parameter name: startIndex.Exception\
    \ has been handled!`\n\n#### 解析\n`str1.Insert(100, \"Script\");` 导致异常，因为 `str1`\
    \ 的长度小于 100 个字符。`catch(exception ex)` 可以捕获异常。注意其参数是 `exception ex`，`ex` 是异常对象。`ex.message`\
    \ 显示异常消息。无论是否捕获到异常，`finally` 块都会执行。\n\n### 抛出异常\n`| try{ throw new exception();\
    \ }catch{……} |`\n\n"
- fmt: "\n`throw new exception();` can throw out an exception for current code.\n\n\
    ### Example 5.7\n```csharp\nusing System;\nnamespace trycatch{\n    class Program{\n\
    \        static void Main(string[] args){\n            try{\n                int\
    \ a, b = 0;\n                if (b == 0){\n                    throw new Exception\
    \ (\"b is zero, Exception occurred! \");\n                    // throw an exception\
    \ object\n                }\n                a = 100 / b;\n            }\n   \
    \         catch (Exception ex){\n                // handle the exception\n   \
    \             Console.WriteLine(ex.Message); // exception message\n          \
    \      Console.ReadLine();\n            }\n        }\n    }\n}\n```\nOutput: `b\
    \ is zero, Exception occurred!`\nExplanation: `throw new exception();` throws\
    \ an exception for current code. If `b` equals zero, `a/b` will be an error. An\
    \ exception occurred!\n\n### ListA\nA `List` is a dynamic array that is changeable\
    \ as needed. The elements in the `List` can be added, inserted, counted and cleared.\n\
    The syntax to create a list looks like this:\n\n| `List<int> MyList = new List<int>(0,\
    \ 1, 2,…);` |\n\nThe syntax to access a list looks like this:\n\n| `MyList[0];MyList[1];MyList[2];……`\
    \ |\n\n### Example 5.8\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
    namespace ListDemo{\n    class Program{\n        static void Main(string[] args){\n\
    \            List<int> MyList = new List<int>{10,11,12,13}; // create list\n \
    \           Console.Write(MyList[0] +\"  \");\n            Console.Write(MyList[1]\
    \ +\"  \");\n            Console.Write(MyList[2] +\"  \");\n            Console.Write(MyList[3]\
    \ +\"  \");\n            Console.ReadLine();\n        }\n    }\n}\n```\nOutput:\
    \ `10  11  12  13`\nExplanation: `List<int> MyList = new List<int>{10,11,12,13};`\
    \ creates a list containing four items. `MyList[0]` accesses No. 0 element. `MyList[1]`\
    \ accesses No. 1 element. `MyList[2]` accesses No. 2 element.\nNote: the index\
    \ of `List` starts from zero.\n\n### Access List Elements\nThe syntax to access\
    \ `List` elements looks like this:\n\n| `foreach (var elements in MyList) {}`\
    \ |\n\nFor Example:\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
    namespace ListDemo{\n    class Program{\n        static void Main(string[] args){\n\
    \            List<int> MyList = new List<int> { 10, 11, 12, 13 };\n          \
    \  foreach (var elements in MyList) {\n                // access all elements\n\
    \                Console.Write(elements + \" \");\n            }\n           \
    \ Console.ReadLine();\n        }\n    }\n}\n```\nOutput: `10 11 12 13`\nExplanation:\
    \ `foreach (var elements in MyList){ }` accesses all elements in `MyList`, and\
    \ put all values to the variable `elements`.\n\n### List Methods\n| `Add()` |\
    \ // add elements |\n| `Insert()` | // insert elements |\n| `Reverse()` | // reverse\
    \ the order of elements |\n| `Remove()` | // remove an element |\n| `Clear()`\
    \ | // clear all elements |\n| `IndexOf()` | // returns the index of an element\
    \ |\n| `Count` | // returns the number of elements |\n\n### Example 5.9\n```csharp\n\
    using System;\nusing System.Collections.Generic;\nnamespace ListDemo{\n    class\
    \ Program{\n        static void Main(string[] args){\n            List<int> MyList\
    \ = new List<int>{10,11,12,13};\n            MyList.Add(14); // now becomes {10,11,12,13,14}\n\
    \            MyList.Insert(3,100); // now becomes {10,11,12,100,13,14}\n     \
