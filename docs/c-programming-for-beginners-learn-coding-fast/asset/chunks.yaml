  trans: "\n\n`ClassName{ …}` 定义一个类。`ClassName( ) { …}` 声明一个构造函数。每当创建一个对象时，构造函数都会被自动调用。\n\
    \n### 示例 6.3\n```csharp\npublic class Color {\n    String c1, c2;\n    Color (\
    \ ) {\n        c1=\"yellow\";\n        c2=\"purple\";\n    } // constructor\n\
    }\n```\n解释：`Color ( ) { c1=\"yellow\"; c2=\"purple\"; }` 是一个构造函数。它将变量 `c1` 初始化为“yellow”，将\
    \ `c2` 初始化为“purple”。在创建对象时会调用构造函数。\n\n### 构造函数示例\n示例：\n```csharp\nusing System;\n\
    namespace ClassAndObject{\n    class Program{\n        public class Color{\n \
    \           // 声明类“Color”\n            public string c1;\n            // 属性成员\n\
    \            public string c2;\n            // 属性成员\n            public Color(\
    \ ){\n                c1=\"yellow\";\n                c2=\"purple\";\n       \
    \     } // 构造函数\n            public void brightness(){\n                // 方法成员\n\
    \                Console.WriteLine(\"The color of this flower is \" + c1);\n \
    \               Console.WriteLine(\"The color of that flower is \" + c2);\n  \
    \              Console.ReadLine();\n            }\n        }\n        static void\
    \ Main(string[] args){\n            Color obj = new Color(); // 创建对象“obj”，调用构造函数\n\
    \            obj.brightness(); // 对象引用方法\n        }\n    }\n}\n```\n输出：\n```\n\
    The color of this flower is yellow\nThe color of that flower is purple\n```\n\n\
    ### 析构函数\n`Destructor` 用于释放内存占用，清理构造函数的数据。\n\n| ~ destructor( ); |\n\n析构函数的名称与类名相同，但前面带有一个\
    \ `~` 符号。析构函数没有任何参数，也没有返回值。\n\n### 示例 6.4\n```csharp\npublic class Color { \n\
    \    // 定义一个类\n    String c1, c2;\n    Color ( ) {\n        c1=\"yellow\";\n \
    \       c2=\"purple\";\n    } // 构造函数\n    ~ Color ( ); // 这是一个析构函数。\n}\n```\n\
    解释：`~ Color ( );` 是一个析构函数，用于释放内存。析构函数的声明始终跟随构造函数之后。\n\n### 重载\n重载意味着类中存在两个或多个同名方法，但它们的参数不同。\n\
    \n### 示例 6.5\n```csharp\nusing System;\nnamespace Overloading{\n    class Color\
    \ {\n        // 声明类“Color”\n        String x, y; // 声明两个变量成员\n        Color( String\
    \ a, String b) { x = a; y = b; } // 构造函数\n        Color() { x = \"yellow \"; y\
    \ = \"purple \"; } // 构造函数\n        static void Main(string[] args){\n       \
    \     Color obj1 =new Color(\"green \", \"orange \");\n            Color obj2\
    \ = new Color();\n            Console.WriteLine(obj1. x + obj1. y);\n        \
    \    Console.WriteLine(obj2. x + obj2. y);\n            Console.ReadLine();\n\
    \        }\n    }\n}\n```\n输出：\n```\ngreen  orange\nyellow  purple\n```\n解释：`class\
    \ Color` 创建一个对象 `Color`。`Color( String a, String b){}` 定义了一个带参数的构造函数。`Color(){}`\
    \ 定义了一个不带参数的构造函数。在此类中，有两个名为 `Color( )` 但参数不同的方法，这被称为“重载”。`Color obj1 =new Color(\"\
    green \", \"orange \");` 创建了对象 `obj1`，调用构造函数 `Color(…){}` 并向构造函数传递了两个参数。`Color\
    \ obj2 =new Color();` 创建了对象 `obj2` 并调用了构造函数 `Color(){}`。`object property` 意味着对象引用了一个变量。\n\
    \n### `this` 关键字\n`this` 用于表示当前对象。\n\n### 示例 6.6\n```csharp\nusing System;\nnamespace\
    \ thisExample{\n    class MyClass{\n        int num;\n        void test(int num){\n\
    \            this.num = num; // this 代表当前对象\n            Console.Write(this.num);\n\
    \        }\n        static void Main(string[] args){\n            MyClass obj\
    \ = new MyClass(); // 创建对象“obj”\n            obj.test(10);\n            Console.ReadLine();\n\
    \        }\n    }\n}\n```\n输出：\n```\n10\n```\n解释：在上方，当 `obj.test(10)` 调用 `test(\
    \ ){ }` 方法时，`this` 代表对象 `obj`。\n\n### 继承\n类可以被其派生类继承。派生类中的对象可以被基类中的对象。派生类按如下方式继承基类：\n\
    \n| 派生类: 基类 |\n\n`:` 是继承的符号。\n\n### 示例 6.7\n```csharp\nclass Computer { \n   \
    \ // 这是一个基类\n    // 基类成员\n    ...\n}\nclass Laptop: public Computer { \n    //\
    \ 继承\n    // 派生类成员\n    ...\n}\n```\n解释：`Laptop` 是派生类，`Computer` 是基类。`Laptop`\
    \ 类继承了 `Computer` 类。派生类继承基类中所有的公共成员。\n\n### 使用派生类\n派生类的对象可以访问基类的公共成员。\n\n### 示例\
    \ 6.8\n```csharp\nusing System;\nnamespace inheritance{\n    public class program{\n\
    \        class Computer {\n            // 声明基类\n            public void display(){\n\
    \                Console.WriteLine(\"Computer\");\n                Console.ReadLine();\n\
    \            }\n        }\n        class Laptop : Computer {\n            // 继承\n\
    \            public void display(){\n                Console.WriteLine(\"Laptop\"\
    );\n                Console.ReadLine();\n            }\n        }\n        static\
    \ void Main(string[] args){\n            Laptop obj = new Laptop(); // 创建对象“obj”\n\
    \            obj.display(); // 对象引用方法\n        }\n    }\n}\n```\n输出：\n```\nLaptop\n\
    ```\n解释：`Lt.display()` 意味着派生类对象 `Lt` 访问了基类方法。Computer OK!\n\n### 重写\n派生类可以重写基类的方法，前提是方法名和参数均相同。\n\
    \n### 示例 6.9\n```csharp\nusing System;\nnamespace Overriding{\n    class Program{\n\
    \        class Computer {\n            // 基类\n            public void harddrive(){\
    \ Console.WriteLine(\"5T\"); }\n            public void memory() { Console.WriteLine(\"\
    4G\"); Console.ReadLine(); }\n        }\n        class Laptop: Computer {\n  \
    \          // 派生类\n            public void harddrive(){ Console.WriteLine(\"10T\"\
    ); }\n            public void memory() { Console.WriteLine(\"8G\"); Console.ReadLine();\
    \ }\n        }\n        static void Main(string[] args){\n            Laptop myLaptop\
    \ = new Laptop(); // 创建对象“myLaptop”\n            myLaptop.harddrive();\n     \
    \       myLaptop.memory();\n        }\n    }\n}\n```\n输出：\n```\n10T\n8G\n```\n\
    解释：基类中的 `harddrive( )` 和 `memory( )` 与派生类中的相同。因此，派生类的方法可以重写基类的方法。`myLaptop.harddrive(\
    \ );` 调用了派生类的方法，输出为 `10T`。`myLaptop.memory( );` 调用了派生类的方法，输出为 `8G`。\n\n### Sealed\
    \ 关键字\n`sealed` 关键字用于禁止基类的继承。`sealed` 关键字还可以防止重写基类中的方法。\n\n示例 (1)\n```csharp\n\
    sealed class MyClass{\n    ...\n}\n```\n`sealed` 禁止了对 `MyClass` 的继承，因此 `MyClass`\
    \ 不能有派生类。 (2)\n```csharp\nsealed public void myMethod(){\n    ...\n}\n```\n`sealed`\
    \ 禁止了重写 `myMethod`，因此 `myMethod` 无法被重写。\n\n### 总结\n| public class ClassName;{\n\
    \    // 声明类\n    // 成员\n} |\n\n| obj = new ClassName(); // 创建对象\nobj.variable;\
    \ // 对象引用变量\nobj.method(); // 对象引用方法 |\n\n| class ClassName{\n    ClassName( )\
    \ { ... } // 这是一个构造函数\n} |\n\n| ~ destructor( ); // 这是一个析构函数 |\n\n"
- fmt: "\nOverloading means that there are two or more same-name methods in a class,\
    \ and their arguments are different. `this` is used to represent a current object.\
    \ Overriding means that the method of a derived class can override the method\
    \ of a base class, if two method names are the same and two arguments are the\
    \ same. Inheritance: A class can be inherited by its derived class. The object\
    \ in derived class can be treated as the object in base class. An object of the\
    \ derived class can access the public member of a base class. The `sealed` keyword\
    \ is used to forbid the inheritance from a base class. And the `sealed` keyword\
    \ can also prevent overriding the method in base class.\n\n## Exercise: Dog &\
    \ Cat\n\n### Class and Object\nPlease open the Visual C#, click `File > New Project\
    \ > Console Application`. Type the file name `ClassAndObject`.Write the C# code\
    \ in editor:\n\n```csharp\nusing System;\nnamespace Overloading{\nclass Animal\
    \ {\n  // declare a class \"Animal\"\n  String dog, cat;\n  // declare two variable\
    \ members\nAnimal() {dog = \"black. \"; cat = \"white. \";}  // constructor\n\
    static void Main(string[] args){\nAnimal pet = new Animal();    // create an object\
    \ “pet”\nConsole. WriteLine(\"This dog's color is \" + pet. dog);\nConsole. WriteLine(\"\
    This cat's color is \" + pet. cat);\nConsole. ReadLine();\n}}}\n```\n\nSave the\
    \ file, click `Start Debugging` to run the program.\n\n**Output:**\nThis dog’s\
    \ color is black.\nThis cat’s color is white.\n\n**Explanation:**\n`class Animal`\
    \ declares a class `Animal`. `Animal() {…}` defines a constructor. The constructor’s\
    \ name always is the same as the class name. `Animal pet = new Animal();` creates\
    \ an object `pet`, and calls the constructor method automatically. `pet. dog`\
    \ means `pet`’s `dog`, an object `pet` references a variable `dog`. `pet. cat`\
    \ means `pet`’s `cat`, an object `pet` references a variable `cat`.\n\n## Chapter\
    \ 7: Access Modifiers\n\n### Public\nThe `public` access modifier is used for\
    \ types and type members. It has the most permissive access level. There are no\
    \ any restrictions on accessing public type or type members.\n\n**Example 7.1**\n\
    ```csharp\nusing System;\nnamespace PublicModifier{\nclass PublicDemo{\npublic\
    \ int a;  // declare a public variable\npublic int b;  // declare a public variable\n\
    }\nclass Program{\nstatic void Main(string[] args){\nPublicDemo obj = new PublicDemo();\n\
    obj. a = 100;  // access the public member\nobj. b = 200;  // access the public\
    \ member\nConsole. WriteLine(\"a=\" + obj. a);\nConsole. WriteLine(\"b=\" + obj.\
    \ b);\nConsole. ReadLine();\n}}}\n```\n**Output:**\na = 100\nb = 200\n\n**Explanation:**\n\
    `public int a;` and `public int b;` declare two public variables, which can be\
    \ accessed by any objects. `obj. a = 100;` and `obj. b = 200;` access two public\
    \ variables `a` and `b` in another class.\n\n### Private\nThe `private` access\
    \ modifier is used for types and type members. It has the least permissive access\
    \ level. Private members can be accessed only within the body of the same class\
    \ where they are declared. Private members in Class `A` cannot be accessed from\
    \ Class `B`. It will be an error to reference a private member outside the class\
    \ where it is declared.\n\n**Example 7.2**\n```csharp\nusing System;\nnamespace\
    \ PrivateModifier{\nclass privateDemo{\nprivate int a;     // declare a private\
    \ variable\nprivate int b;     // declare a private variable\n}\nclass Program{\n\
    static void Main(string[] args){\nprivateDemo obj = new privateDemo();\nobj.a\
    \ = 100;      // access the private member, error !\nobj.b = 200;      // access\
    \ the private member, error !\nConsole. WriteLine(\"a=\" + obj. a);\nConsole.\
    \ WriteLine(\"b=\" + obj. b);\nConsole. ReadLine();\n}}}\n```\n**Output:**\nError!\n\
    `a` is inaccessible due to its protection level.\n`b` is inaccessible due to its\
    \ protection level.\n\n**Explanation:**\nCompile fail! `a` & `b` are two private\
    \ variables, which cannot be accessed outside the current class. The private members\
    \ can be accessed by codes in the same class only.\n\n**Note:** The following\
    \ example is a program to access private members successfully.\n\n**Example 7.3**\n\
    ```csharp\nusing System;\nnamespace PrivateModifier{\nclass PrivateDemo{\nprivate\
    \ int a = 100;  // declare a private variable\nprivate int b = 200;  // declare\
    \ a private variable\npublic void accessVariable(){\nConsole. WriteLine(\"a =\
    \ \" + a);  // access private variable, ok !\nConsole. WriteLine(\"b = \" + b);\
    \  // access private variable, ok !\nConsole. ReadLine();\n}}\nclass Program{\n\
    static void Main(){\nPrivateDemo obj = new PrivateDemo();\nobj. accessVariable();\
    \    // call the public method, ok !\n}}}\n```\n**Output:**\na = 100\nb = 200\n\
    \n**Explanation:**\nCompile successfully! `a` & `b` are two private variables,\
    \ which can be accessed inside the same class. The private members can be accessed\
    \ by codes in the same class only.\n\n### Protected\nThe `protected` access modifier\
    \ is used for types and type members. A protected member can be accessed by derived\
    \ class instances. Namely, a protected member of a base class can be accessed\
    \ by an object in a derived class.\n\n**Example 7.4**\n```csharp\nusing System;\n\
    namespace ProtectedModifier{\nclass A{\nprotected int p = 100 ;      // declare\
    \ a protected variable\n}\nclass B : A{\nstatic void Main(){\nA a = new A(); \
    \           // create an object of the base class\nConsole. WriteLine(a.p ); \
    \  // access protected variable, error !\nConsole. ReadLine();\n}}}\n```\n**Output:**\n\
    Error! Cannot access protected member.\n\n**Explanation:**\nCompile fail! `a`\
    \ is an object from base class, it cannot access the protected member `p`. Only\
    \ the object from derived class can access the protected member.\n\n**Note:**\
    \ A protected member of a base class can be accessed by an object in a derived\
    \ class. The following example is a program to access protected members successfully.\n\
    \n**Example 7.5**\n```csharp\nusing System;\nnamespace ProtectedModifier{\nclass\
    \ A{\nprotected int p = 100 ;    // declare a protected variable\n}\nclass B :\
    \ A{\nstatic void Main(){\nB b = new B();            // create an object of derived\
    \ class\nConsole. WriteLine(b.p );   // access protected variable, ok !\nConsole.\
    \ ReadLine();\n}}}\n```\n**Output:**\n100\n\n**Explanation:**\nCompile successfully!\
    \ `b` is an object from derived class, it can access the protected member `p`.\
    \ Only the object from derived class can access the protected member.\n\n**Note:**\
    \ The protected members can be also accessed by codes in the same class. The following\
    \ example is a program to access protected members successfully.\n\n**Example\
    \ 7.6**\n```csharp\nusing System;\nnamespace ProtectedDemo{\nclass protectedDemo{\n\
    protected int a = 800;   // declare a protected variable\nprotected int b = 1000;\
    \  // declare a protected variable\nprotected int sum;      // declare a protected\
    \ variable\npublic void accessVariable(){\nsum = a + b;            // access the\
    \ protected variables, ok !\nConsole. WriteLine(\"a + b = \" + sum);\nConsole.\
    \ ReadLine();\n}}\nclass Program{\nstatic void Main(){\nprotectedDemo obj = new\
    \ protectedDemo();\nobj. accessVariable();   // call the public method\n}}}\n\
    ```\n**Output:**\na + b = 1800\n\n**Explanation:**\nCompile successfully! The\
    \ protected members can be also accessed by codes in the same class.\n\n### Get\
    \ & Set\nThe `get & set accessor` is frequently used for retrieving and storing\
    \ a value from a private field. The `get` method is used to read a value. The\
    \ `set` method is used to write a value. For example:\n\n```csharp\nprivate int\
    \ number;\npublic int LuckyNumber{\n  // create a property access\n  get {\n \
    \   // read the value\n    return number;\n  }\n  set {\n    // write the value\n\
    \    number = value;\n  }\n}\n```\n"
