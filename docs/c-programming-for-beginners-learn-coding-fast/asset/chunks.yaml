  trans: "\n\n# StreamReader 示例\n\n`StreamReader file = new StreamReader(\"c:\\\\\
    myFile.txt\");` 创建了一个文件对象 `file`，用于读取文本。`C:\\myFile.txt` 指定了要读取的文件路径和现在。假设 `C:\\\
    myFile.txt` 的内容是 `VB in 8 Hours`。\n\n## 示例 8.7\n\n```csharp\nusing System;\nusing\
    \ System.Text;\nusing System.IO;\n\nnamespace ReadFile\n{\n    class Program\n\
    \    {\n        static void Main(string[] args)\n        {\n            String\
    \ myText;\n            StreamReader file = new StreamReader(\"C:\\\\myFile.txt\"\
    );\n            myText = file.ReadLine(); // 读取第一行\n            while (myText\
    \ != null)\n            {\n                // 读取到文件末尾\n                Console.WriteLine(myText);\n\
    \                myText = file.ReadLine(); // 读取下一行\n            }\n         \
    \   file.Close();\n            Console.ReadLine();\n        }\n    }\n}\n```\n\
    \n**输出：**\nVB in 8 Hours\nVB in 8 Hours\n\n**解释：**\n- `System.IO` 命名空间包含 `StreamReader`\
    \ 类。\n- `StreamReader` 类用于文件操作，它用于从文件中读取文本。\n- `C:\\myFile.txt` 指定了要读取的文件路径。\n\
    - `myText = file.ReadLine();` 读取 `myFile.txt` 的文本。\n\n## 总结\n\n- **抽象类（Abstract\
    \ class）** 作为父类工作，由其子类扩展。子类中的方法将重写抽象类中的抽象方法。\n- **接口（Interface）** 是一种特殊的类，由类实现。接口包含一个或多个空方法，这些方法将由类的方法实现。\n\
    - **静态变量（Static variable）** 可以通过类引用。**非静态变量（Non-static variable）** 仅通过对象引用，通过类。\n\
    - **静态方法（Static method）** 可以通过类引用。**非静态方法（Non-static method）** 仅通过对象引用，通过类。\n\
    - **多态（Polymorphism）** 描述了不同对象执行不同方法的能力。多态通过`虚方法（virtual method）`和`重写方法（override\
    \ method）`共同完成。\n- 要写入文件，你应该添加指令 `using System.IO;` 和类 `StreamWriter`。\n- 要读取文件，你应该添加指令\
    \ `using System.IO;` 和类 `StreamReader`。\n\n## 练习：最大与最小值 - 抽象示例\n\n启动 Visual Studio\
    \ > 文件 > 新项目 > 控制台应用程序 > 命名为 `AbstractExample` > 确定。在 Visual Studio 中编写以下代码。\n\
    \n```csharp\nusing System;\nnamespace AbstractExample\n{\n    abstract class A\n\
    \    {\n        // 定义一个抽象类\n        public abstract int max(int x, int y); //\
    \ 声明抽象方法\n        public abstract int min(int x, int y); // 声明抽象方法\n    }\n  \
    \  class B : A\n    {\n        // 类 B 继承类 A\n        public override int max(int\
    \ x, int y)\n        {\n            // 重写抽象方法\n            return x > y ? x :\
    \ y;\n        }\n        public override int min(int x, int y)\n        {\n  \
    \          // 重写抽象方法\n            return x < y ? x : y;\n        }\n    }\n  \
    \  class Program\n    {\n        static void Main(string[] args)\n        {\n\
    \            B b = new B();\n            int max = b.max(100, 200);\n        \
    \    int min = b.min(100, 200);\n            Console.WriteLine(\"Max=\" + max);\n\
    \            Console.WriteLine(\"Min=\" + min);\n            Console.ReadLine();\n\
    \        }\n    }\n}\n```\n\n保存文件，并调试运行程序。\n\n**输出：**\nMax = 200\nMin = 100\n\n\
    **解释：**\n- `abstract class A { }` 定义了一个抽象类。\n- `public abstract int max(int x,\
    \ int y);` 定义了一个没有 `{ }` 的抽象方法。\n- `class B : A { }` 意味着子类 `B` 继承父类 `A`。\n- `public\
    \ override int max(int x, int y){ }` 意味着子类中的此方法重写了父类中的抽象方法。\n- **注意：**抽象方法没有 `{\
    \ }`。\n\n## 练习：更大与更小 - 接口示例\n\n启动 Visual Studio > 文件 > 新项目 > 控制台应用程序 > 命名为 `InterfaceExample`\
    \ > 确定。在 Visual Studio 中编写以下代码。\n\n```csharp\nusing System;\nnamespace InterfaceExample\n\
    {\n    interface myInterface\n    {\n        // 定义一个接口\n        void compareNumbers(int\
    \ num1, int num2); // 定义一个没有 { } 的空方法\n    }\n    class MaxNum : myInterface\n\
    \    {\n        // 实现接口\n        public void compareNumbers(int num1, int num2)\n\
    \        {\n            // 实现空方法\n            Console.WriteLine(\"Two numbers\
    \ are: \" + num1 + \" & \" + num2);\n            if (num1 >= num2)\n         \
    \       Console.WriteLine(\"Maximum is:\" + num1);\n            else\n       \
    \         Console.WriteLine(\"Maximum is:\" + num2);\n        }\n    }\n    class\
    \ MinNum : myInterface\n    {\n        // 实现接口\n        public void compareNumbers(int\
    \ num1, int num2)\n        {\n            // 实现空方法\n            Console.WriteLine(\"\
    Two numbers are: \" + num1 + \" & \" + num2);\n            if (num1 <= num2)\n\
    \                Console.WriteLine(\"Minimum is:\" + num1);\n            else\n\
    \                Console.WriteLine(\"Maximum is:\" + num2);\n            Console.ReadLine();\n\
    \        }\n    }\n    class Program\n    {\n        static void Main(string[]\
    \ args)\n        {\n            MaxNum maxObject = new MaxNum();\n           \
    \ maxObject.compareNumbers(100, 120);\n            MinNum minObject = new MinNum();\n\
    \            minObject.compareNumbers(60, 80);\n        }\n    }\n}\n```\n\n保存文件，并调试运行程序。\n\
    \n**输出：**\nTwo numbers are: 100 & 120\nMaximum is: 120\nTwo numbers are: 60 &\
    \ 80\nMinimum is: 60\n\n**解释：**\n- `interface myInterface { }` 定义了一个接口。\n- `void\
    \ compareNumbers(int num1, int num2);` 定义了一个没有 `{ }` 的空方法。\n- `class MaxNum :\
    \ myInterface { }` 意味着类 `MaxNum` 实现了 `myInterface`。\n- `public void compareNumbers(int\
    \ num1, int num2){ }` 意味着子类中的此方法实现了接口中的空方法。\n- **注意：**空方法没有 `{ }`。\n\n## 录 & 答案\n\
    \n选择正确答案。\n\n1)\n```csharp\nusing System;\nnamespace MyProgram\n{\n    class Program\n\
    \    {\n        static ___ (string[] args){ // 定义 main 函数\n            string\
    \ str = \"Let's study C# \";\n            Console.Write(str);\n            Console.ReadLine();\n\
    \        }\n    }\n}\n```\nA. function\nB. method\nC. Function\nD. Main\n\n2)\n\
    ```csharp\nusing System;\nnamespace VariableAndConstant\n{\n    class Program\n\
    \    {\n        static void Main(string[] args)\n        {\n            int a\
    \ = 10, b = 20, c = 30; // 定义变量 a, b, c\n            int num = a * b * c;\n  \
    \          ___ RESULT = \"The result is \"; // 定义常量 RESULT\n            Console.WriteLine(RESULT);\n\
    \            Console.ReadLine();\n        }\n    }\n}\n```\nA. int\nB. const\n\
    C. bool\nD. int\n\n3)\n```csharp\nusing System;\nnamespace CondOperator\n{\n \
    \   class Program\n    {\n        static void Main(string[] args)\n        {\n\
    \            int a = 10; int b = 20;\n            string result1 = (a < b) ___\
    \ \"apple\" : \"banana\"; // 三元运算符\n            Console.WriteLine(\"result1: \"\
    \ + result1);\n            string result2 = (a > b) ___ \"apple\" : \"banana\"\
    ; // 三元运算符\n            Console.WriteLine(\"result2: \" + result2);\n        \
    \    Console.ReadLine();\n        }\n    }\n}\n```\nA. ! =\nB. $\nC. ?\nD. &\n\
    \n4)\n```csharp\nusing System;\nnamespace enumExample\n{\n    public ___ Today\
    \ { // 定义枚举类型\n        morning, // 枚举成员\n        afternoon, // 枚举成员\n        evening\
    \ // 枚举成员\n    }\n    class Program\n    {\n        static void Main(string[]\
    \ args)\n        {\n            ___ t0, t1, t2; // 定义枚举变量\n            t0 = Today.morning;\n\
    \            t1 = Today.afternoon;\n            t2 = Today.evening;\n        \
    \    Console.WriteLine(\"Have a breakfast in \" + t0);\n            Console.WriteLine(\"\
    Have a lunch in \" + t1);\n            Console.WriteLine(\"Have a supper in \"\
    \ + t2);\n            Console.ReadLine();\n        }\n    }\n}\n```\nA. enum enum\n\
    B. enum Today\nC. void Today\nD. enum String\n\n5)\n```csharp\nusing System;\n\
    namespace SwichStatement\n{\n    class Program\n    {\n        static void Main(string[]\
    \ args)\n        {\n            int number = 20;\n            ___ (number){ //\
    \ 评估变量 \"number\"\n                case 10: Console.WriteLine(\"Running case 10\"\
    );\n                Console.ReadLine(); break;\n                case 20: Console.WriteLine(\"\
    Running case 20\");\n                Console.ReadLine(); break;\n            \
    \    case 30: Console.WriteLine(\"Running case 30\");\n                Console.ReadLine();\
    \ break;\n                default: Console.WriteLine(\"Running default code\"\
    );\n                Console.ReadLine(); break;\n            }\n        }\n   \
    \ }\n}\n```\nA. do\nB. while\nC. for\nD. switch\n\n6)\n```csharp\nusing System;\n\
    namespace StringAndArray\n{\n    class Program\n    {\n        static void Main(string[]\
    \ args)\n        {\n            string str1 = \"C++ in 8 Hours\";\n          \
    \  string str2 = str1.Replace(\"C++\", \"C#\");\n            Console.WriteLine(str2);\n\
    \            String[] arr = { \"3rd \", \"2nd \", \"4th \", \"1st \" };\n    \
    \        ___ .Sort(arr); // 排序数组\n            ___ (String var in arr) { // 遍历数组\n\
    \                Console.Write(var);\n            }\n            Console.ReadLine();\n\
    \        }\n    }\n}\n```\nA. Math while\nB. Math\nC. Array for\nD. Array foreach\n\
    \n7)\n```csharp\nusing System;\nnamespace returnExample\n{\n    class program\n\
    \    {\n        static ___ add(int num1, int num2) // 返回类型\n        {\n      \
    \      return num1 + num2; // 返回值给调用者\n        }\n        static void Main()\n\
    \        {\n            int result = add(3, 5);\n            Console.WriteLine(\"\
    3 + 5 = \" + result);\n        }\n    }\n}\n```\nA. return\nB. send\n\n8)\n```csharp\n\
    using System;\nnamespace TryAndCatch\n{\n    class Program\n    {\n        static\
    \ void Main(string[] args)\n        {\n            try\n            {\n      \
    \          int[] myArr = {0, 1, 3};\n                myArr[4] = 4; // 发生异常\n \
    \           }\n            ___(Exception ex) // 处理异常\n            {\n        \
    \        Console.WriteLine(\"Exception occurred: \");\n            }\n       \
    \ }\n    }\n}\n```\nA. Note\nB. Alert\nC. Message\nD. Information\n\n"
