  trans: "\n\n`public` 是一个访问修符。`Today` 是一个 `Enum` 类型。`Morning, Afternoon, Evening`\
    \ 是三个枚举成员。\n\n## 练习：Car 的 FeatureStruct 学习\n\n请打开 Visual C#，点击 `File > New Project\
    \ > Console Application`。输入文件名 `structStudy`。在编辑器中编写 C# 代码：\n\n```csharp\nusing\
    \ System;\nnamespace structStudy\n{\n    public struct Car\n    {\n        //\
    \ defines a struct type\n        public int price;      // struct field\n    \
    \    public string size;    // struct field\n        public string color;    //\
    \ struct field\n    }\n    class Program\n    {\n        static void Main(string[]\
    \ args)\n        {\n            Car Ford; // defines a struct variable\n     \
    \       Ford.price = 90000;\n            Ford.size = \"big\";\n            Ford.color\
    \ = \"black\";\n            Console.WriteLine(\"Ford's price is $\" + Ford.price);\n\
    \            Console.WriteLine(\"Ford's size is \" + Ford.size);\n           \
    \ Console.WriteLine(\"Ford's color is \" + Ford.color);\n            Console.ReadLine();\n\
    \        }\n    }\n}\n```\n\n保存文件，点击 `Start Debugging` 运行程序。\n\n**输出：**\nFord’s\
    \ price is $90000\nFord’s size is big\nFord’s color is black\n\n**解释：**\n`struct\
    \ Car` 定义了一个结构类型 `Car`。`Car Ford` 声明了一个结构变量 `Ford`。`Ford.price` 表示 Ford 的价格。`Ford.size`\
    \ 表示 Ford 的尺寸。`Ford.color` 表示 Ford 的颜色。\n\n## 练习：WeekdaysEnum 学习\n\n默认情况下，第一个枚举器的值为\
    \ 0，每个后续枚举器的值增加 1。例如，在下面的枚举中，星期日为 0；星期一 1，星期二为 2，以此类推。\n\n请打开 Visual C#，点击 `File\
    \ > New Project > Console Application`。输入文件名 `enumStudy`。在编辑器中编写 C# 代码：\n\n```csharp\n\
    using System;\npublic class enumStudy\n{\n    enum Week\n    {\n        // defines\
    \ an enum type\n        Sunday,  // enum member\n        Monday,  // enum member\n\
    \        Tuesday  // enum member\n    }\n    class Program\n    {\n        static\
    \ void Main()\n        {\n            int w0, w1, w2;\n            w0 = (int)Week.Sunday;\n\
    \            w1 = (int)Week.Monday;\n            w2 = (int)Week.Tuesday;\n   \
    \         Console.WriteLine(\"The value of Sunday is \" + w0);\n            Console.WriteLine(\"\
    The value of Monday is \" + w1);\n            Console.WriteLine(\"The value of\
    \ Tuesday is \" + w2);\n            Console.ReadLine();\n        }\n    }\n}\n\
    ```\n\n保存文件，点击 `Start Debugging` 运行程序。\n\n**输出：**\nThe value of Sunday is 0\n\
    The value of Monday is 1\nThe value of Tuesday is 2\n\n**解释：**\n`enum Week` 定义了一个枚举类型\
    \ `Week`。第一个枚举成员的默认值为 0，第二个枚举成员的默认值为 1，第三个枚举成员的默认值为 2。\n\n# 第 3 章：控制结构\n\n###\
    \ If 语句\n\n```\nif ( test-expression ) {\n   // if true do this;\n}\n```\n\n`if\
    \ statement` 仅在指定条件为真时才执行 `{ ... }` 内部的代码，如果条件为假，则不执行 `{…}` 中的任何代码。\n\n**示例 3.1**\n\
    ```csharp\nusing System;\nnamespace IfStatement\n{\n    class Program\n    {\n\
    \        static void Main(string[] args)\n        {\n            int a = 200;\n\
    \            int b = 100;\n            if (a > b)\n            {\n           \
    \     // if true do this;\n                Console.WriteLine(\"a is greater than\
    \ b. \");\n                Console.ReadLine();\n            }\n        }\n   \
    \ }\n}\n```\n**输出：**\na is greater than b\n\n**解释：**\n`(a>b)` 是一个测试表达式，即 `(200>100)`，如果\
    \ `if` 返回真，它将执行 `{ }` 内部的代码；如果 `if` 返回假，则不执行 `{ }` 内部的代码。\n\n### If-else 语句\n\n\
    ```\nif ( test-expression) {\n    // if true do this;\n} else {\n    // if false\
    \ do this;\n}\n```\n\n**示例 3.2**\n```csharp\nusing System;\nnamespace IfelseStatement\n\
    {\n    class Program\n    {\n        static void Main(string[] args)\n       \
    \ {\n            int a = 100;\n            int b = 200;\n            if (a > b)\n\
    \            {\n                // if true do this;\n                Console.WriteLine(\"\
    a is greater than b. \");\n                Console.ReadLine();\n            }\n\
    \            else\n            {\n                // if false do this;\n     \
    \           Console.WriteLine(\"a is less than b. \");\n                Console.ReadLine();\n\
    \            }\n        }\n    }\n}\n```\n**输出：**\na is less than b\n\n**解释：**\n\
    `(a>b)` 是一个测试表达式，即 `(100>200)`，如果 `if` 返回真，它将输出 `\"a is greater than b. \"`；如果\
    \ `if` 返回假，它将输出 `\"a is less than b\"`。\n\n### Switch 语句\n\n```\nswitch (variable\
    \ ){\n    case 1: if equals this case, do this; break;\n    case 2: if equals\
    \ this case, do this; break;\n    case 3: if equals this case, do this; break;\n\
    }\n```\n\n`switch` 语句将 `variable` 与多个 `case` 值进行比对。\n\n**示例 3.3**\n```csharp\n\
    using System;\nnamespace SwichStatement\n{\n    class Program\n    {\n       \
    \ static void Main(string[] args)\n        {\n            // logic for switch\n\
    \        }\n    }\n}\n```\n\n### For 循环\n\n```\nfor ( init; test-expression; increment)\
    \ {\n    // some code\n}\n```\n\n`for` 循环按照指定的次数重复执行代码块。\n\n**示例 3.4**\n```csharp\n\
    using System;\nnamespace ForStatement\n{\n    class Program\n    {\n        static\
    \ void Main(string[] args)\n        {\n            for (int x = 0; x <= 5; x++)\n\
    \            {\n                // code\n            }\n        }\n    }\n}\n\
    ```\n\n### While 循环\n\n```\nwhile ( test-expression ) {\n    // some code\n}\n\
    ```\n\n`while` 循环只要条件为真就会重复执行代码块。\n\n**示例 3.5**\n```csharp\nusing System;\nnamespace\
    \ WhileStatement\n{\n    class Program\n    {\n        static void Main(string[]\
    \ args)\n        {\n            int counter = 0;\n            while (counter <\
    \ 8)\n            {\n                Console.Write(\"&\");\n                counter++;\n\
    \            }\n        }\n    }\n}\n```\n\n### Do-While 循环\n\n```\ndo {\n   \
    \ // some code\n} while ( test-expression);\n```\n\n`do...while` 循环执行一次代码块，如果条件为真则重复执行。\n\
    \n**示例 3.6**\n```csharp\nusing System;\nnamespace DoWhileStatement\n{\n    class\
    \ Program\n    {\n        static void Main(string[] args)\n        {\n       \
    \     int counter = 0;\n            do\n            {\n                Console.Write(\"\
    @\");\n                counter++;\n            } while (counter < 8);\n      \
    \  }\n    }\n}\n```\n\n### Break 语句\n\n```\nbreak;\n```\n\n`break` 关键字用于根据条件停止循环。\n\
    \n**示例 3.7**\n```csharp\nusing System;\nnamespace BreakStatement\n{\n    class\
    \ Program\n    {\n        static void Main(string[] args)\n        {\n       \
    \     int num = 0;\n            while (num < 10)\n            {\n            \
    \    if (num == 5) break;\n                num++;\n            }\n           \
    \ Console.Write(num);\n        }\n    }\n}\n```\n\n### Continue 语句\n\n```\ncontinue;\n\
    ```\n\n`continue` 关键字用于停止当前迭代，忽略后续代码，并继续下一次循环。\n\n**示例 3.8**\n```csharp\nusing\
    \ System;\nnamespace ContinueStatement\n{\n    class Program\n    {\n        static\
    \ void Main(string[] args)\n        {\n            int num = 0;\n            while\
    \ (num < 10)\n            {\n                num++;\n                if (num ==\
    \ 5) continue;\n                Console.Write(num);\n            }\n        }\n\
    \    }\n}\n```\n\n### 用户输入\n\n```csharp\nvariable = Console.ReadLine();\n```\n\
    \n"
- fmt: "\n`variable = Console.ReadLine();` accepts the input from the user, and assigns\
    \ the value to the variable.\n\n### Example 3.9\n```csharp\nusing System;\nnamespace\
    \ InputDemo\n{\n    class Program\n    {\n        static void Main(string[] args)\n\
    \        {\n            string name;\n            Console.Write(\"Enter your name:\"\
    );\n            name = Console.ReadLine(); // accept user input\n            Console.WriteLine(name);\n\
    \            Console.ReadLine();\n        }\n    }\n}\n```\n**Output:**\nEnter\
    \ your name: Smith\nSmith\n\n**Explanation:** `name = Console.ReadLine();` accepts\
    \ user input, and assigns the input value to the `“name”`.\n\n### Summary\n- `if\
    \ statement` executes codes inside `{ … }` only if a specified condition is true.\
    \ Does not execute any codes inside `{…}` if the condition is false, and run the\
    \ `else {…}` codes.\n- ```csharp\nswitch (variable ) {\n    case 1: if equals\
    \ this case, do this; break;\n    case 2: if equals this case, do this; break;\n\
    \    case 3: if equals this case, do this; break;\n    default : if not equals\
    \ any case, run default code; break;\n}\n```\n- `for loop` runs a block of code\
    \ repeatedly by the specified number of times.\n- `while loop` loops through a\
    \ block of code if the specified condition is true.\n- `do... while` loops through\
    \ a block of code once, and then repeats the loop if the specified condition is\
    \ true.\n- `break` keyword is used to stop the running of a loop according to\
    \ the condition.\n- `continue` keyword is used to stop the current iteration,\
    \ ignoring the following code, and then continue the next loop.\n- `variable =\
    \ Console.ReadLine();` accepts the input from the user, and assigns the value\
    \ to the variable.\n\n### Exercise: Number One\n#### For Loop Example\nPlease\
    \ open the Visual C#, click `File > New Project > Console Application`. Type the\
    \ file name `“ForStatement”`. Write the C# code in editor:\n\n```csharp\nusing\
    \ System;\nnamespace ForExercises\n{\n    class Program\n    {\n        static\
    \ void Main(string[] args)\n        {\n            int a;\n            for (a\
    \ = 1; a <= 6; a++)\n            {\n                // repeat 6 times\n      \
    \          Console.WriteLine(\"Number\" + a );\n            }\n            Console.ReadLine();\n\
    \        }\n    }\n}\n```\nSave the file, click `Start Debugging` to run the program.\n\
    \n**Output:**\nNumber 1\nNumber 2\nNumber 3\nNumber 4\nNumber 5\nNumber 6\n\n\
    **Explanation:** `for( init, test-expression, increment) { // some code; }` runs\
    \ a block of code repeatedly by specified number of times.\n- `a = 1` is an initializer,\
    \ initializing variable `“a”` as 1.\n- `a <= 6` is test-expression, the code will\
    \ run at most 6 times.\n- `a++` means that `“a”` will increase 1 each loop.\n\n\
    # Chapter 4: String & Array\n\n## String Length\n| `String.Length;` |\n\n`String.Length;`\
    \ returns the length of a string.\n\n### Example 4.1\n```csharp\nusing System;\n\
    namespace stringLength\n{\n    class Program\n    {\n        static void Main(string[]\
    \ args)\n        {\n            string str = \"JavaScript\";\n            int\
    \ num = str.Length;  // get the size of sting\n            Console.WriteLine(num);\n\
    \            Console.ReadLine();\n        }\n    }\n}\n```\n**Output:** 10\n**Explanation:**\
    \ `str.Length` returns the length of `“JavaScript”` which has 10 characters.\n\
    \n## Extract Substring\n| `String.Substring(index, length);` |\n\n`Substring(\
    \ start, length )` can extract a substring from a string.\n- `“index` argument\
    \ specifies the start position to extract.\n- `“length` argument specifies the\
    \ substring length.\n\n### Example 4.2\n```csharp\nusing System;\nnamespace substringExample\n\
    {\n    class Program\n    {\n        static void Main(string[] args)\n       \
    \ {\n            string str = \"JavaScript\";\n            string myString = str.Substring(4,\
    \ 6);  // extract a substring\n            Console.WriteLine(myString);\n    \
    \        Console.ReadLine();\n        }\n    }\n}\n```\n**Output:** Script\n**Explanation:**\
    \ `str.Substring(4, 6 )` extracts a substring from `str`. `( 4, 6 )` specify substring’s\
    \ start position is 4, length is 6. Note that string index begins with zero.\n\
    \n## String Replace\n| `String.Replace(old, new)` |\n\n`Replace( );` can replace\
    \ old characters with new characters in a string.\n\n### Example 4.3\n```csharp\n\
    using System;\nnamespace replaceString\n{\n    class Program\n    {\n        static\
    \ void Main(string[] args)\n        {\n            string str1 = \"JavaScript\
    \ in 8 Hours\";\n            string str2 = str1.Replace(\"JavaScript\", \"AngularJS\"\
    );\n            Console.Write(str2);  // replace JavaScript with AngularJS\n \
    \           Console.ReadLine();\n        }\n    }\n}\n```\n**Output:** AngularJS\
    \ in 8 Hours\n**Explanation:** `str1.Replace(\"JavaScript\", \"AngularJS\");`\
    \ replaces `“JavaScript”` with new characters `“AngularJS”`.\n\n## String Insert\n\
    | `String.Insert(index, character);` |\n\n`Insert(index, character)` inserts characters\
    \ in the string index.\n\n### Example 4.4\n```csharp\nusing System;\nnamespace\
    \ InsertString\n{\n    class Program\n    {\n        static void Main(string[]\
    \ args)\n        {\n            string str1 = \"Java in 8 Hours\";\n         \
    \   string str2 = str1.Insert(4, \"Script\");  // insert “Script” at index 4\n\
    \            Console.WriteLine(str2);\n            Console.ReadLine();\n     \
    \   }\n    }\n}\n```\n**Output:** JavaScript in 8 Hours\n**Explanation:** `str1.Insert(4,\
    \ \"Script\");` inserts `“Script”` at the index 4. Note that string index begins\
    \ with zero.\n\n## String Remove\n| `String.Remove(index, length);` |\n\n`Remove(\
    \ index, length )` can remove a specified length of string.\n- `“index` argument\
    \ specifies the start position to remove.\n- `“length` argument specifies the\
    \ length to remove.\n\n### Example 4.5\n```csharp\nusing System;\nnamespace InsertString\n\
    {\n    class Program\n    {\n        static void Main(string[] args)\n       \
    \ {\n            string str1 = \"JavaScript in 8 Hours\";\n            string\
    \ str2 = str1.Remove(4, 6);  // remove 6 characters\n            Console.ReadLine();\n\
    \        }\n    }\n}\n```\n**Output:** Java in 8 Hours\n**Explanation:** `str1.Remove(4,\
    \ 6);` removes 6 characters. (Wait, the text says \"remove 6 characters\" but\
    \ the output shows \"Java in 8 Hours\" which is removing \"Script\"). Let's stick\
    \ to the text: `str1.Remove(4, 6)` removes a specified length of string.\n\n###\
    \ Create Array (1)\n`“index` argument specifies the start position to remove.\n\
    `“length` argument specifies the length to remove.\n`Remove( index, length )`\
    \ can remove a specified length of string.\n`“index` argument specifies the start\
