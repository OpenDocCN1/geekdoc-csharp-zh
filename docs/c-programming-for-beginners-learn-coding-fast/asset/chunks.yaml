  trans: "\n`LuckyNumber` 是一个属性访问器，用于读取或写入 `number` 的值。\n\n### 示例 7.7\n\n```csharp\n\
    using System;\npublic class Lottery{\n    private int number;\n    public int\
    \ LuckyNumber {\n        // create a property accessor\n        get {\n      \
    \      // read the value\n            return number;\n        }\n        set {\n\
    \            // write the value\n            number = value;\n        }\n    }\n\
    \    public void print() {\n        Console.WriteLine(\"Lucky Number is: \" +\
    \ number);\n        Console.ReadLine();\n    }\n}\npublic class MainClass{\n \
    \   public static void Main() {\n        Lottery lot = new Lottery();\n      \
    \  lot.LuckyNumber = 16888; // reference the property accessor\n        lot.print();\n\
    \    }\n}\n```\n\n**输出：**\n`Lucky Number is: 16888`\n\n**解释：**\n- `public int\
    \ LuckyNumber{ }` 创建了一个属性访问器。\n- `get{ }` 读取了 `number` 的值。\n- `set{ }` 写入 `number`\
    \ 的值。\n- `lot.LuckyNumber = \"16888\"` 引用了属性访问器。\n\n### LINQ\n`LINQ` 代表集成语言查询（Language\
    \ Integrated Query），是微软的一种查询所有类型数据的技术。创建 linq 的语法看起来所示：\n\n| from ……where……select……\
    \ |\n\n"
- fmt: "\nThe following example is a query to look for all numbers that are 10, 20,\
    \ 30……. in an array.\n\nExample 7.8\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
    using System.Linq;\nnamespace LinqDemo\n{\n    class IntroToLINQ\n    {\n    \
    \    static void Main()\n        {\n            int[] MyArray = new int[6] { 10,\
    \ 15, 20, 25, 30, 35};\n            var myQuery = // myQuery is a variable\n \
    \               from item in MyArray // create a linq\n                where (item\
    \ % 10) == 0\n                select item;\n            foreach (int item in myQuery)\n\
    \            {\n                Console.Write(item + \"  \");\n            }\n\
    \            Console.ReadLine();\n        }\n    }\n}\n```\nOutput: 10   20  \
    \ 30\n\nExplanation: “`from…where…select…` ” creates a linq.“`from item in MyArray`”\
    \ runs the query on `MyArray` array, “`item`” represents each items in the array.“`where\
    \ (item % 10) == 0`” checks each items to determine whether the remainder of “`item`\
    \ divided by 10 is zero.“`select item;`” selects all items that meet this criterion.\n\
    \n### Delegate\nA delegate is a reference type that can be used to encapsulate\
    \ a named or an anonymous function. Namely a delegate is a type which holds the\
    \ function’s reference in an object.\n\nFour steps to use a delegate:\n(1) Select\
    \ a function as a delegated function, for example: `public static int myFunction(int\
    \ a, int b) {}` // `myFunction(){ }` is selected as a delegated function.\n(2)\
    \ Declare a delegate function, its arguments should be the same as the arguments\
    \ of the delegated function, for example: `public delegate int DelegateFun(int\
    \ a, int b);` // `DelegateFun` is a delegate function.\n(3) Create a delegate\
    \ object, its argument should be the delegated function name, for example: `DelegateFun\
    \ delegateObj = new DelegateFun(myFunction);` // `delegateObj` is a delegate object.\n\
    (4) Execute the delegate, for example: `delegateObj(arg1, arg2);` // call delegated\
    \ function, pass params.\n\nDelegate Sample (1)\nExample 7.9\n```csharp\nusing\
    \ System;\npublic static int Sum(int a, int b) \n{ \n    // this is a delegated\
    \ function “Sum”\n    return a + b;\n}\npublic delegate int DelegateFun(int a,\
    \ int b); // declare a delegate function “DelegateFun”, its arguments should be\
    \ the same as the arguments of the delegated function “Sum”\nclass Program\n{\n\
    \    public static void Main(string[] args)\n    {\n        DelegateFun delegateObj\
    \ = new DelegateFun(Sum); // create a delegate object “delegateObj”, its argument\
    \ should be the delegated function name “Sum” \n        Console.WriteLine(\"100\
    \ + 2 = \" + delegateObj(100, 2)); // call the delegated function “Sum” , and\
    \ pass arguments\n        Console.ReadLine();\n    }\n}\n```\nOutput: 100 + 2\
    \ = 102\n\nExplanation:\n`public static int Sum(int a, int b) { }` // this is\
    \ a delegated function “Sum”\n`public delegate int DelegateFun(int a, int b);`\
    \ // declare a delegate function “DelegateFun”, its arguments should be the same\
    \ as the arguments of the delegated function “Sum”\n`DelegateFun delegateObj =\
    \ new DelegateFun(Sum);` // create a delegate object “delegateObj”, its argument\
    \ should be the delegated function name “Sum”\n`delegateObj(100, 2);` // call\
    \ the delegated function “Sum”, and pass arguments\n\nDelegate Sample (2)\nExample\
    \ 7.10\n```csharp\nusing System;\nclass Program\n{\n    public static int Division\
    \ (int a, int b) \n    { \n        // delegated function\n        return a / b;\
    \   \n    }\n    public static int Multiply (int a, int b) \n    { \n        //\
    \ delegated function\n        return a * b;   \n    }\n    public static int Subtract\
    \ (int a, int b) \n    {   \n        // delegated function\n        return a -\
    \ b;\n    }\n    public delegate int DelegateFun (int a, int b); // declare delegate\n\
    \    public static void Main(string[] args)\n    {   \n        // create delegate\
    \ objects\n        DelegateFun delegateObj1 = new DelegateFun(Division);\n   \
    \     DelegateFun delegateObj2 = new DelegateFun(Multiply);\n        DelegateFun\
    \ delegateObj3 = new DelegateFun(Subtract);\n        Console.WriteLine(\"100 /\
    \ 2 = \" + delegateObj1(100, 2)); // call\n        Console.WriteLine(\"100 * 2\
    \ = \" + delegateObj2(100, 2)); // call\n        Console.WriteLine(\"100 - 2 =\
    \ \" + delegateObj3(100, 2)); // call\n        Console.ReadLine();\n    }\n}\n\
    ```\nOutput: ![](rsrc597.jpg)\n\nExplanation: Four steps to use delegate:\n1.\
    \ Choose a function as a delegated function.\n2. Declare a delegate function.\n\
    3. Create a delegate object.\n4. Call the delegated function.\n\n### Summary\n\
    - “`public` access modifier has the most permissive access level. There are no\
    \ any restrictions on accessing public type or type members.\n- “`private` access\
    \ modifier has the least permissive access level. Private members can be accessed\
    \ only within the body of the same class where they are declared. Private members\
    \ in Class A cannot be accessed from Class B. It will be an error to reference\
    \ a private member outside the class where it is declared. The private members\
    \ can be accessed by codes in the same class only.\n- “`protected` access modifier\
    \ has the limited permissive access level. A protected member can be accessed\
    \ by derived class instances. Namely, a protected member of a base class can be\
    \ accessed by an object in a derived class. The protected members can be also\
    \ accessed by codes in the same class.\n- The “`get & set accessor`” is frequently\
    \ used for retrieving and storing a value from a private field. The `get` method\
    \ is used to read a value. The `set` method is used to write a value.\n- `LINQ`\
    \ stands for Language Integrated Query, which is a kind of Microsoft’s technology\
    \ for querying data of all types.\n\n### Exercise: Private Member\nStart up Visual\
    \ Studio > File > New Project > Console Application > Name > PrivateMember > OK.\n\
    Write following codes in Visual Studio.\n```csharp\nusing System;\nnamespace PrivateMember\n\
    {\n    class PrivateDemo\n    {\n        private int a = 800; // declare a private\
    \ variable\n        private int b = 1000; // declare a private variable\n    \
    \    private int sum; // declare a private variable\n        public void accessVariable()\n\
    \        {\n            sum = a + b;\n            Console.WriteLine(sum);\n  \
    \      }\n    }\n    class Program\n    {\n        static void Main()\n      \
    \  {\n            PrivateDemo demo = new PrivateDemo();\n            demo.accessVariable();\n\
    \        }\n    }\n}\n```\n*(Note: The source text for the exercise was slightly\
    \ fragmented; I have reconstructed the logical flow based on the provided snippets\
    \ to maintain semantic integrity).*\n\n### Exercise: Protected Member\n(Logic\
    \ follows the pattern of Private Member exercise provided in the text).\n\n###\
    \ Chapter 8\nAbstract\nAbstract class works as a parent class, which will be extended\
    \ by its subclass. The method in the subclass will override the abstract method.\n\
    \nInterface\nThe interface is a special class, which will be implemented by a\
    \ class. The interface contains one or more empty method that will be implemented\
    \ by a method of the class.\n"
