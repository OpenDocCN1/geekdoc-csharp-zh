  trans: "\n\n`variable = Console.ReadLine();` 接收用户的输入，并将值赋值给变量。\n\n### 示例 3.9\n```csharp\n\
    using System;\nnamespace InputDemo\n{\n    class Program\n    {\n        static\
    \ void Main(string[] args)\n        {\n            string name;\n            Console.Write(\"\
    Enter your name:\");\n            name = Console.ReadLine(); // accept user input\n\
    \            Console.WriteLine(name);\n            Console.ReadLine();\n     \
    \   }\n    }\n}\n```\n**输出:**\nEnter your name: Smith\nSmith\n\n**解释：** `name\
    \ = Console.ReadLine();` 接收用户输入，并将输入的值赋值给 `“name”`。\n\n### 总结\n- `if 语句` 仅在指定条件为真时才执行\
    \ `{ … }` 内部的代码。如果条件为假，则不执行 `{…}` 内的任何代码，并运行 `else {…}` 中的代码。\n- ```csharp\nswitch\
    \ (variable ) {\n    case 1: 如果等于此情况，执行此操作； break;\n    case 2: 如果等于此情况，执行此操作；\
    \ break;\n    case 3: 如果等于此情况，执行此操作； break;\n    default : 如果不等于任何情况，运行默认代码； break;\n\
    }\n```\n- `for 循环` 通过指定的次数重复运行一个代码块。\n- `while 循环` 如果指定条件为真，则循环运行一个代码块。\n- `do...\
    \ while` 循环一次一个代码块，如果指定条件为真，则重复循环。\n- `break` 关键字用于根据条件停止循环的运行。\n- `continue`\
    \ 关键字用于停止当前迭代，忽略后续代码，然后继续下一次循环。\n- `variable = Console.ReadLine();` 接收用户的输入，并将值赋值给变量。\n\
    \n### 练习：第一题\n#### For 循环示例\n请打开 Visual C#，点击`文件 > 新项目 > 控制台应用程序`。输入文件名 `“ForStatement”`。在编辑器中编写\
    \ C# 代码：\n\n```csharp\nusing System;\nnamespace ForExercises\n{\n    class Program\n\
    \    {\n        static void Main(string[] args)\n        {\n            int a;\n\
    \            for (a = 1; a <= 6; a++)\n            {\n                // 重复 6\
    \ 次\n                Console.WriteLine(\"Number\" + a );\n            }\n    \
    \        Console.ReadLine();\n        }\n    }\n}\n```\n保存文件，点击`开始调试` 运行程序。\n\n\
    **输出:**\nNumber 1\nNumber 2\nNumber 3\nNumber 4\nNumber 5\nNumber 6\n\n**解释：**\
    \ `for( 初始化, 测试表达式, 递增) { // 一些代码; }` 通过指定的次数重复运行一个代码块。\n- `a = 1` 是初始化器，将变量 `“a”`\
    \ 初始化为 1。\n- `a <= 6` 是测试表达式，代码最多运行 6 次。\n- `a++` 意味着 `“a”` 每次循环都会增加 1。\n\n# 第\
    \ 4 章：字符串与数组\n\n## 字符串长度\n| `String.Length;` |\n\n`String.Length;` 返回字符串的长度。\n\
    \n### 示例 4.1\n```csharp\nusing System;\nnamespace stringLength\n{\n    class Program\n\
    \    {\n        static void Main(string[] args)\n        {\n            string\
    \ str = \"JavaScript\";\n            int num = str.Length;  // 获取字符串的大小\n    \
    \        Console.WriteLine(num);\n            Console.ReadLine();\n        }\n\
    \    }\n}\n```\n**输出:** 10\n**解释：** `str.Length` 返回 `“JavaScript”` 的长度，它有 10 个字符。\n\
    \n## 提取子字符串\n| `String.Substring(index, length);` |\n\n`Substring( 开始, 长度 )` 可以从字符串中提取子字符串。\n\
    - `index` 参数指定要提取的起始位置。\n- `length` 参数指定子字符串的长度。\n\n### 示例 4.2\n```csharp\nusing\
    \ System;\nnamespace substringExample\n{\n    class Program\n    {\n        static\
    \ void Main(string[] args)\n        {\n            string str = \"JavaScript\"\
    ;\n            string myString = str.Substring(4, 6);  // 提取子字符串\n           \
    \ Console.WriteLine(myString);\n            Console.ReadLine();\n        }\n \
    \   }\n}\n```\n**输出:** Script\n**解释：** `str.Substring(4, 6 )` 从 `str` 中提取子字符串。`(\
    \ 4, 6 )` 指定子字符串的起始位置为 4，长度为 6。注意字符串索引从零开始。\n\n## 字符串替换\n| `String.Replace(old,\
    \ new)` |\n\n`Replace( );` 可以将字符串中的旧字符替换为新字符。\n\n### 示例 4.3\n```csharp\nusing\
    \ System;\nnamespace replaceString\n{\n    class Program\n    {\n        static\
    \ void Main(string[] args)\n        {\n            string str1 = \"JavaScript\
    \ in 8 Hours\";\n            string str2 = str1.Replace(\"JavaScript\", \"AngularJS\"\
    );\n            Console.Write(str2);  // 将 JavaScript 替换为 AngularJS\n        \
    \    Console.ReadLine();\n        }\n    }\n}\n```\n**输出:** AngularJS in 8 Hours\n\
    **解释：** `str1.Replace(\"JavaScript\", \"AngularJS\");` 将 `“JavaScript”` 替换为新字符\
    \ `“AngularJS”`。\n\n## 字符串插入\n| `String.Insert(index, character);` |\n\n`Insert(index,\
    \ character)` 在字符串索引处插入字符。\n\n### 示例 4.4\n```csharp\nusing System;\nnamespace\
    \ InsertString\n{\n    class Program\n    {\n        static void Main(string[]\
    \ args)\n        {\n            string str1 = \"Java in 8 Hours\";\n         \
    \   string str2 = str1.Insert(4, \"Script\");  // 在索引 4 处插入“Script”\n        \
    \    Console.WriteLine(str2);\n            Console.ReadLine();\n        }\n  \
    \  }\n}\n```\n**输出:** JavaScript in 8 Hours\n**解释：** `str1.Insert(4, \"Script\"\
    );` 在索引 4 插入 `“Script”`。注意字符串索引从零开始。\n\n## 字符串删除\n| `String.Remove(index, length);`\
    \ |\n\n`Remove( , 长度 )` 可以删除指定长度的字符串。\n- `index` 参数指定删除的起始位置。\n- `length` 参数指定删除的长度。\n\
    \n### 示例 4.5\n```csharp\nusing System;\nnamespace InsertString\n{\n    class Program\n\
    \    {\n        static void Main(string[] args)\n        {\n            string\
    \ str1 = \"JavaScript in 8 Hours\";\n            string str2 = str1.Remove(4,\
    \ 6);  // 删除 6 个字符\n            Console.ReadLine();\n        }\n    }\n}\n```\n\
    **输出:** Java in 8 Hours\n**解释：** `str1.Remove(4, 6);` 删除了 6 个字符。（等等，文本说是“删除 6\
    \ 个字符”，但输出显示“Java in 8 Hours”，这意味着删除了“Script”）。我们遵循文本：`str1.Remove(4, 6)` 删除了指定长度的字符串。\n\
    \n### 创建数组 (1)\n`index` 参数指定删除的起始位置。\n`length` 参数指定删除的长度。\n`Remove( index, 长度\
    \ )` 可以删除指定长度的字符串。\n`index` 参数指定删除的起始位置。\n`length` 参数指定删除的长度。\n\n### 创建数组 (2)\n\
    `index` 参数指定删除的起始位置。\n`length` 参数指定删除的长度。\n`index` 参数指定删除的起始位置。\n`length` 参数指定删除的长度。\n\
    \n### 创建数组 (3)\n`index` 参数指定删除的起始位置。\n`length` 参数指定删除的长度。\n`index` 参数指定删除的起始位置。\n\
    `length` 参数指定删除的长度。\n\n### 创建数组 (4)\n`index` 参数指定删除的起始位置。\n`length` 参数指定删除的长度。\n\
    `index` 参数指定删除的起始位置。\n`length` 参数指定删除的长度。\n\n### 创建数组 (5)\n`index` 参数指定删除的起始位置。\n\
    `length` 参数指定删除的长度。\n`index` 参数指定删除的起始位置。\n`length` 参数指定删除的长度。\n\n### 创建数组 (6)\n\
    `index` 参数指定删除的起始位置。\n`length` 参数指定删除的长度。\n`index` 参数指定删除的起始位置。\n`length` 参数指定删除的长度。\n\
    \n### 创建数组 (延续)\n`index` 参数指定删除的起始位置。\n`length` 参数指定删除的长度。\n`index` 参数指定删除的起始位置。\n\
    `length` 参数指定删除的长度。\n\n### 创建数组 (完成)\n`index` 参数指定删除的起始位置。\n`length` 参数指定删除的长度。\n\
    \n"
- fmt: "\n`Arrays.sort(arrayName);` can sort the array elements in order.\n\n### Example\
    \ 4.12\n```csharp\nusing System;\nnamespace sortArray{\nclass Program{\n    static\
    \ void Main(string[] args){\n        String [] arr = { \"Cat \", \"App \", \"\
    Dog \", \"Boy \"};\n        Array.Sort(arr); // sort the array in order\n    \
    \    foreach (String var in arr){\n            Console. Write(var);\n        }\n\
    \        Console. ReadLine();\n    }\n}}\n```\nOutput: `App  Boy  Cat Dog`\n\n\
    #### Explanation\n`Array.Sort(arr);` sorts the array `arr` by its element values.\
    \ `foreach loop` runs the output command four times, and display the sorted result:\
    \ App Boy Cat Dog.\n\n### Summary\n- `String.Length;` returns the length of a\
    \ string.\n- `Substring(start, length )` can extract a substring from a string.\n\
    - `Replace();` can replace old characters with new characters in a string.\n-\
    \ `Insert(index, character)` inserts characters in the string index.\n- `Remove(index,\
    \ length )` can remove a specified length of string.\n\nThe `foreach` statement\
    \ executes a block of code on each element in an array, and put all the element\
    \ values to the variable.\n\nThe first method to create an array as following:\n\
    `| type [] arrayName = {\"value0\", \"value1\", \"value2\",…}; |`\n\nThe second\
    \ method to create an array as following:\n`| type [] arrayName = new type [ number\
    \ of elements ];arrayName[index0] = \"value0\";arrayName[index1] = \"value1\"\
    ;arrayName[index2] = \"value2\"; |`\n\n### Exercise: C++ & C# String & Array\n\
    Please open the Visual C#, click `File > New Project > Console Application`. Type\
    \ the file name `StringAndArray`. Write the C# code in editor:\n\n```csharp\n\
    using System;\nnamespace StringAndArray{\nclass Program{\n    static void Main(string[]\
    \ args){\n        string str1 = \"C++ in 8 Hours\";\n        string str2 = str1.Replace(\"\
    C++\", \"C#\"); // replace C++\n        Console. WriteLine(str2);\n        String[]\
    \ arr = { \"3rd \", \"2nd \", \"4th \", \"1st \" };\n        Array.Sort(arr);\
    \ // sort the array in order\n        foreach (String var in arr) {\n        \
    \    // put all element values to var\n            Console. Write(var);\n    \
    \    }\n        Console. ReadLine();\n    }\n}}\n```\nOutput: `C# in 8 Hours 1st\
    \ 2nd 3rd 4th`\n\n#### Explanation\n`str1.Replace(\"C++\", \"C#\");` replaces\
    \ `C++` with `C#`. `Array.Sort(arr);` sorts the array `arr` in order. `foreach\
    \ (String var in arr)` executes a block of code on each element in the array `arr`,\
    \ and put all the element values to the variable `var`.\n\n# Chapter 5: Function\
    \ & Exception\n\n## Functions\nA function is a code block that can repeat to run\
    \ many times. To define a function, please use `type functionName() { }`.\n\n\
    `| type functionName() {……} |`\n\nTo call a function, please use `functionName();`\n\
    `| functionName (); |`\n\n### Example 5.1\n```csharp\nusing System;\nnamespace\
    \ functionExample{\nclass Program{\n    static void myFunction() {\n        //\
    \ function declaration\n        Console. Write(\"This is a function example. \"\
    );\n        Console. ReadLine();\n    }\n    static void Main(string[] args){\n\
    \        myFunction(); // call function\n    }\n}}\n```\nOutput: `This is a function\
    \ example.`\n\n#### Explanation\n`myFunction() { }` is a declaration of a function.\
    \ `myFunction();` calls the function `myFunction() { }`. `static method` is known\
    \ as a class method, it can be accessed by the class directly. `static variable`\
    \ is known as a class variable, it can be accessed by the class directly. \n\n\
    About `class`, the later chapter will talk about `class` in detail. `void` is\
    \ a return type. After the function has been executed, it will return a result\
    \ with data type, such as `int`, `string`, `bool`, `void`. The `void` means there\
    \ is no any return data type.\n\n### Function with Arguments\nA function can have\
    \ one or more arguments inside the bracket. Arguments are used to pass data to\
    \ function, use `type functionName(type arg) { }`.\n\n`| type functionName ( type\
    \ arg ) {……} |`\n\nTo call a function, use `functionName(argument);`\n`| functionName\
    \ (argument ); |`\n\n### Example 5.2\n```csharp\nusing System;\nnamespace functionExample{\n\
    class Program{\n    static void myFunction(string arg ){\n        // function\
    \ declaration\n        Console. Write(arg );\n        Console. ReadLine();\n \
    \   }\n    static void Main(string[] args){\n        String str = \"A function\
    \ argument.\";\n        myFunction(str);\n    }\n}}\n```\nOutput: `A function\
    \ argument.`\n\n#### Explanation\n`myFunction(string arg){` is a function declaration.\
    \ `myFunction(str);` calls the function.\n\n### Return Values\n`return` can return\
    \ a value to the caller.\n`| type functionName ( type arg ) {…… |`\n\nTo call\
    \ a function, use `functionName(argument);`\n\n### Example 5.3\n```csharp\nusing\
    \ System;\nnamespace functionExample{\nclass Program{\n    static int add(int\
    \ a, int b){\n        return a + b;\n    }\n    static void Main(string[] args){\n\
    \        int result = add(5, 10);\n        Console. WriteLine(\"Result: \" + result);\n\
    \    }\n}}\n```\nOutput: `Result: 15`\n\n#### Explanation\n`add(int a, int b)`\
    \ returns the sum of `a` and `b`. `result` stores the returned value.\n\n### Exceptions\n\
    C# program may have some bugs, as following:\n- `Arithmetic Exception`\n- `Array\
    \ Mismatch Exception`\n- `Divided By Zero Exception`\n- `Index Out of Range Exception`\n\
    - `Invalid Cast Exception`\n- `Null Reference Exception`\n- `Out of Memory Exception`\n\
    - `Overflow Exception`\n- `Type Initialization Exception`\n\n### TryCatch\n`|\
    \ try{ …}catch(exception ex){……} |`\n\n`try {…}` throws the exception out to the\
    \ `catch( ) { }` block when an exceptional error occurs. `catch( ){ }` catches\
    \ any exception from the `try` block, and handles it. `ex` is an exception object.\n\
    \n`| exceptionObject. Message |`\n`exceptionObject.Message` displays the exception\
    \ message.\n\n#### Example 5.4\n```csharp\nusing System;\nnamespace trycatch{\n\
    class Program{\n    static void Main(string[] args){\n        int a, b = 0;\n\
    \        try {\n            a = 100 / b;\n        } catch (Exception ex){\n  \
    \          Console. WriteLine(ex.Message ); // exception message\n        }\n\
    \        Console. ReadLine();\n    }\n}}\n```\nOutput: `Attempted to divide by\
    \ zero.`\n\n#### Explanation\nIn `try{ }` block, `a = 100 / b;` causes an exception.\
    \ `catch(Exception ex){}` catches the exception. `ex` is an exception object.\
    \ `ex.message` displays the message.\n\n### TryCatchFinally\n`| try{…}catch(exception\
    \ ex){ …… }finally{ must-execute-code} |`\n\nThe `finally` block contains the\
    \ codes that must be executed.\n\n#### Example 5.5\n```csharp\nusing System;\n\
    namespace trycatch{\nclass Program{\n    static void Main(string[] args){\n  \
    \      try {\n            string str1 = \"Java in 8 Hours\";\n            string\
    \ str2 = str1.Insert(100, \"Script\"); // 100 causes exception\n        } catch\
    \ (Exception ex){\n            Console. WriteLine(ex. Message);\n        } finally\
    \ {\n            // must execute\n            Console. WriteLine(\"Exception has\
    \ been handled! \");\n        }\n        Console. ReadLine();\n    }\n}}\n```\n\
    Output: `Index was out of range……Parameter name: startIndex.Exception has been\
    \ handled!`\n\n#### Explanation\n`str1.Insert(100, \"Script\");` cause an exception,\
    \ because the length of `str1` is less than 100 characters. `catch(exception ex)`\
    \ can catch an exception. Note that its parameters are `exception ex`, `ex` is\
    \ an exception object. `ex.message` shows exception message. `finally` block executes\
    \ regardless of whether an exception was caught.\n\n### Throw Exception\n`| try{\
    \ throw new exception(); }catch{……} |`\n"
