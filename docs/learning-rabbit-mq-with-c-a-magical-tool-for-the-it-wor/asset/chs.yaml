  \ 的方法，在该方法中，我们使用 `RabbitMQ.Client` 创建了到 RabbitMQ 服务器的连接。创建连接后，我们将凭据同 `HostName`\
  \ 传递给 `connectionFactory`。接下来，我们写了一条简单的消息 `Message is of fanout Exchange type` 并将其转换为字节数组形式，最后，我们将所有这些值赋值给\
  \ `RabbitMQ.Client` 的 `BasicPublish` 方法。\n\n在赋值时，我们将交换机（exchange）设置为 `fanout.exchange`，并且\
  \ fanout 交换机不需要路由键（routing key）。\n\n### 代码片段\n\n```csharp\nusing System;\nusing\
  \ RabbitMQ.Client;\nusing System.Text;\nnamespace RequestRabbitMQ\n{\n    public\
  \ class Fanoutmessages\n    {\n        private const string UserName = \"guest\"\
  ;\n        private const string Password = \"guest\";\n        private const string\
  \ HostName = \"localhost\";\n        public void SendMessage()\n        {\n    \
  \        //RabbitMQ .NET AMQP 的主入口点\n            var connectionFactory = new RabbitMQ.Client.ConnectionFactory()\n\
  \            {\n                UserName = UserName,\n                Password =\
  \ Password,\n                HostName = HostName\n            };\n            var\
  \ connection = connectionFactory.CreateConnection();\n            var model = connection.CreateModel();\n\
  \            var properties = model.CreateBasicProperties();\n            properties.Persistent\
  \ = false;\n            byte[] messagebuffer = Encoding.Default.GetBytes(\"Message\
  \ is of fanout Exchange type\");\n            model.BasicPublish(\"fanout.exchange\"\
  , \"\", properties, messagebuffer);\n            Console.WriteLine(\"Message Sent\
  \ From :- fanout.exchange \");\n            Console.WriteLine(\"Routing Key :- Routing\
  \ key is Not required for fanout exchange\");\n            Console.WriteLine(\"\
  Message Sent\");\n        }\n    }\n}\n```\n\n### 主代码片段\n\n```csharp\nusing System;\n\
  namespace RequestRabbitMQ\n{\n    class Program\n    {\n        static void Main(string[]\
  \ args)\n        {\n            Fanoutmessages fanoutmessages = new Fanoutmessages();\n\
  \            fanoutmessages.SendMessage();\n            Console.ReadLine();\n  \
  \      }\n    }\n}\n```\n\n完成整个过程后，让我们保存并运行应用程序。运行程序后，你将在控制台窗口看到“Message sent”消息，这仅作为通知，意味着我们已成功向\
  \ \"fanout.exchange\" 交换机的所有队列发布了消息。\n\n### 发布到 \"fanout.exchange\" 所有队列的消息\n\n\
  ![jpg](img/094-01.jpg)\n\n### 现在让我们查看队列状态（Bangalore, Chennai, Hyderabad, Mumbai\
  \ 队列）\n\n如果你查看队列状态，你会看到 `Ready \"1\"`，这意味着我们已成功向 fanout 交换机的所有队列发布了消息。\n\n![jpg](img/094-02.jpg)\n\
  \n发布消息后，接下来创建一个 .Net 控制台应用程序来从队列中消费消息。\n\n### 创建 RabbitMQConsumer\n\n![jpg](img/094-03.jpg)\n\
  \n让我们创建另一个控制台应用程序来从队列消费消息。创建应用程序后，我们将添加 `RabbitMQ.Client` 包。\n\n## 添加 RabbitMQ.Client\
  \ NuGet 包\n\n在这一部分，为了创建与 RabbitMQ 服务器的连接以发送请求，我们需要从 NuGet 添加 `RabbitMQ.Client` 包。安装命令为：`Install-Package\
  \ RabbitMQ.Client -Version 5.1.0`\n\n![jpg](img/095-01.jpg)\n\n安装 `RabbitMQ.Client`\
  \ 后，接下来我们将添加一个名为 `MessageReceiver` 的类。\n\n### MessageReceiver 类\n\n在这一部分，我们创建了 `MessageReceiver`\
  \ 类，该类继承自来自 `RabbitMQ.Client` 的 `DefaultBasicConsumer` 类。接下来我们必须重写 `HandleBasicDeliver`\
  \ 方法，该方法接收消息体，接下来我们将如在控制台中看到的那样写出这些消息。\n\n```csharp\npublic class MessageReceiver\
  \ : DefaultBasicConsumer\n{\n    private readonly IModel _channel;\n    public MessageReceiver(IModel\
  \ channel)\n    {\n        _channel = channel;\n    }\n    public override void\
  \ HandleBasicDeliver(string consumerTag, ulong deliveryTag, bool redelivered, string\
  \ exchange, string routingKey, IBasicProperties properties, byte[] body)\n    {\n\
  \        Console.WriteLine($\"Consuming fanout Message\");\n        Console.WriteLine(string.Concat(\"\
  received from the exchange \", exchange));\n        Console.WriteLine(string.Concat(\"\
  Consumer tag:\", consumerTag));\n        Console.WriteLine(string.Concat(\"Delivery\
  \ tag:\", deliveryTag));\n        Console.WriteLine(string.Concat(\"Routing tag:\
  \ \", routingKey));\n        Console.WriteLine(string.Concat(\"Message: \", Encoding.UTF8.GetString(body)));\n\
  \        _channel.BasicAck(deliveryTag, false);\n    }\n}\n```\n\n理解 `MessageReceiver`\
  \ 类的代码片段后，接下来我们将在主方法中调用该类。\n\n### 消费 \"Mumbai\" 队列的主方法代码片段\n\n在主方法中，我们创建了 `connectionFactory`\
  \ 类并传递了凭据和 `Hostname`，之后我们创建了连接，接着创建了通道（channel）并将 `prefetchCount` 设置为 1，这样它就会告诉\
  \ RabbitMQ 不要一次向工作人员发送多一条消息。接下来创建了 `MessageReceiver` 类的实例并将 `IModel (channel)` 传递给它。在最后一步，我们调用了\
  \ `BasicConsume` 方法并将队列名 \"Mumbai\" 传递给它，同时我们将 `autoAck` 设置为 false 并将 `messageReceiver`\
  \ 实例传递给它。\n\n![jpg](img/096-01.jpg)\n\n```csharp\nusing System;\nusing RabbitMQ.Client;\n\
  namespace RabbitMQConsumer\n{\n    class Program\n    {\n        private const string\
  \ UserName = \"guest\";\n        private const string Password = \"guest\";\n  \
  \      private const string HostName = \"localhost\";\n        static void Main(string[]\
  \ args)\n        {\n            ConnectionFactory connectionFactory = new ConnectionFactory()\n\
  \            {\n                HostName = HostName,\n                UserName =\
  \ UserName,\n                Password = Password\n            };\n            var\
  \ connection = connectionFactory.CreateConnection();\n            var channel =\
  \ connection.CreateModel();\n            // 只接受一个未确认的消息\n            // uint prefetchSize,\
  \ ushort prefetchCount, bool\n            channel.Qos(0, 1, false);\n          \
  \  // ==== prefetchCount\n            // 为了克服这一点，我们可以将 prefetch count 设置为 1\n  \
  \          // 这告诉 RabbitMQ 不要一次向工作人员发送多一条消息。\n            // 或者换句话说，在工作人员处理并确认之前的消息之前，不要向其分发新消息。\n\
  \            // 相反，它将分发给\n            // 下一个不忙的工作人员。\n            MessageReceiver\
  \ messageReceiver = new MessageReceiver(channel);\n            channel.BasicConsume(\"\
  Mumbai\", false, messageReceiver);\n            Console.ReadLine();\n        }\n\
  \    }\n}\n```\n\n现在我们拥有了完整的工作机制。让我们从 `RequestRabbitMQ` 控制台创建请求并在 `RabbitMQConsumer`\
  \ 应用程序消费消息。\n\n### 队列有一个我们发布的请求\n\n下面的快照显示所有队列都有一个通过 fanout 交换机发布的消息。\n\n![jpg](img/098-01.jpg)\n\
  \n### 从 Mumbai 队列消费的消息\n\n此消息仅从 Mumbai 队列消费，其他队列直到为止尚未被读取。\n\n![jpg](img/098-02.jpg)\n\
  \n### 从 Mumbai 队列读取消息后的队列状态\n\n![jpg](img/098-03.jpg)\n\n以类似的方式，如果我们从 Bangalore\
  \ 队列读取消息，那么只需要在 `RabbitMQConsumer` 中更改“队列名”。\n\n### 从 Bangalore 队列消费的消息\n\n\n\n\n\
  ```csharp\nConnectionFactory connectionFactory = new ConnectionFactory\n{\n    HostName\
  \ = HostName,\n    UserName = UserName,\n    Password = Password,\n    var connection\
  \ = connectionFactory.CreateConnection();\n    var channel = connection.CreateModel();\n\
  \    // 每次只接受一个未确认（ack）的消息\n    // uint prefetchSize, ushort prefetchCount, bool\n\
  \    channel.BasicQos(0, 1, false);\n    #region MyRegion\n    // ==== prefetchCount\n\
  \    // 为了实现这一点，我们可以将 prefetch \n    // 计数设置为 1\n    // 这会告诉 RabbitMQ 不要一次性向工作线程\
  \ \n    // 发送多于的一条消息。\n    // 或者，换句话说，在处理并 \n    // 确认上一条消息之前，不要向工作线程\n    // 分发新消息。\n\
  \    // 相反，它将消息发送给\n    // 下一个没有在忙的工作线程。\n    #endregion\n    MessageReceiver messageReceiver\
  \ = new MessageReceiver(channel);\n    channel.BasicConsume(\"Bangalore\", false,\
  \ messageReceiver);\n    Console.ReadLine();\n}\n}\n```\n\n让我们保存并运行应用程序以从 Bangalore\
  \ 队列读取消息。\n\n![jpg](img/100-01.jpg)\n\n从 Bangalore 队列读取消息后的队列状态。\n\n![jpg](img/100-02.jpg)\n\
  \n最后，我们学习了扇出（fanout）交换机是如何工作的，以及我们如何一步步地从扇出交换机发布和消费消息。\n\n## 结论\n\n在这一部分，我们学习了如何使用\
  \ Fanout 消息交换机，如何为 Fanout 交换机创建交换机和队列，如何使用 .Net 应用和 `RabbitMQ.Client` 将消息推送到 RabbitMQ，并使用\
  \ .Net 应用和 `RabbitMQ.Client` 逐步从 RabbitMQ 读取消息。\n\n![jpg](img/logo.jpg)\n\n# 使用\
  \ .Net 应用使用 RabbitMQ Headers 消息交换机\n\n在这一部分，我们将使用 Headers 消息交换机，通过 .Net 应用和 `RabbitMQ.Client`\
  \ 将消息推送到 RabbitMQ，并使用 .Net 应用和 `RabbitMQ.Client` 逐步从 RabbitMQ 读取消息。\n\n![jpg](img/101-01.jpg)\n\
  \n## 什么是 Headers 交换机？\n\nHeaders 交换机使用消息头属性进行路由。\n\n当你想要向队列发送消息时使用这种交换机，但这次它不依赖于路由键（routing\
  \ key），而是根据头属性发送到队列。\n\n## 创建 RequestRabbitMQ \n\n让我们创建一个名为 \"RequestRabbitMQ\"\
  \ 的简单控制台应用程序。\n\n![jpg](img/101-02.jpg)\n\n创建应用程序后，我们将添加 \"RabbitMQ.Client\" NuGet\
  \ 包。\n\n## 添加 RabbitMQ.Client NuGet 包\n\n在这一部分，为了创建与 RabbitMQ 服务器的连接以创建请求，我们需要从\
  \ NuGet 包添加 `RabbitMQ.Client` 包。\n\n安装命令：`Install-Package RabbitMQ.Client -Version\
  \ 5.1.0`\n\n![jpg](img/102-01.jpg)\n\n安装 \"RabbitMQ.Client\" NuGet 包后，接下来我们将从 Web\
  \ 管理控制台创建一个交换机。\n\n**注意：**\n\nHeaders 交换机根据头值而不是路由键来路由消息。\n\n一个名为 `x-match` 的特殊参数有\
  \ 2 个值 {all, any}，其中 all 是 headers 绑定的默认值。\n\n- `x-match = all` : 意味着所有值必须匹配\n-\
  \ `x-match = any` : 意味着只需要一个匹配的头值\n\n***引用自：*** [`javasampleapproach.com/spring-framework/spring-boot/springboot-rabbitmq-headers-exchange`](http://javasampleapproach.com/spring-framework/spring-boot/springboot-rabbitmq-headers-exchange)\n\
  \n## 添加 Fanout 交换机\n\n访问 http://localhost:15672/#/exchanges，输入名称后将交换机命名为 `headers.exchange`，选择类型为\
  \ \"headers\" 并点击 add exchange 按钮创建。\n\n![jpg](img/102-02.jpg)\n\n添加 \"headers.exchange\"\
  \ 后，我们将添加两个队列并绑定到同一个交换机。\n\n### 添加队列\n\n在这一部分，我们将创建两个具有不同路由键但属于同一个 \"headers.exchange\"\
  \ 的队列。\n\n访问 http://localhost:15672/#/queues:\n\n1. ReportPDF\n2. ReportExcel\n\n\
  ![jpg](img/103-01.jpg)\n\n类似地，我按照下快照所示添加了其余队列。\n\n![jpg](img/103-02.jpg)\n\n添加所有队列后，我们将把队列与\
  \ \"headers.exchange\" 绑定。\n\n## 绑定队列\n\n在这一部分，我们将 `headers.exchange` 绑定到 \"ReportPDF\"\
  \ 队列，并在绑定过程中设置诸如 `format=pdf` 和 `x_match=all` 等参数，这些参数需要生产者在头中传递，以便消息能发送到准确的队列。\n\
  \n![jpg](img/104-01.jpg)\n\n### 绑定快照\n\n![jpg](img/104-02.jpg)\n\n在这一部分，我们将 `headers.exchange`\
  \ 绑定到 \"ReportPDF\" 队列，并在绑定过程中设置诸如 `format=pdf` 和 `x-match=all` 等参数，这些参数需要生产者在头中传递，以便消息能够发送到准确的队列。\n\
  \n![jpg](img/104-03.jpg)\n\n### 绑定快照\n\n![jpg](img/104-04.jpg)\n\n## Headersmessages\
  \ 类\n\n```csharp\npublic class Headersmessages\n{\n    private const string UserName\
  \ = \"guest\";\n    private const string Password = \"guest\";\n    private const\
  \ string HostName = \"localhost\";\n\n    public void SendMessage()\n    {\n   \
  \     ConnectionFactory connectionFactory = new ConnectionFactory()\n        {\n\
  \            HostName = HostName,\n            UserName = UserName,\n          \
  \  Password = Password\n        };\n        var connection = connectionFactory.CreateConnection();\n\
  \        var model = connection.CreateModel();\n        var properties = model.CreateBasicProperties();\n\
  \        properties.Persistent = false;\n        Dictionary<string,object> dictionary\
  \ = new Dictionary<string,object>();\n        dictionary.Add(\"format\", \"pdf\"\
  );\n        properties.Headers = dictionary;\n        byte[] messagebuffer = Encoding.Default.GetBytes(\"\
  Message to Headers Exchange 'format=pdf' \");\n        model.BasicPublish(\"headers.exchange\"\
  , \"\", properties, messagebuffer);\n        Console.WriteLine(\"Message Sent From\
  \ :- headers.exchange \");\n        Console.WriteLine(\"Routing Key Does not need\
  \ routing key\");\n        Console.WriteLine(\"Message Sent\");\n    }\n}\n```\n\
  \n### 主代码片段\n\n```csharp\nusing System;\nnamespace RequestRabbitMQ\n{\n    class\
  \ Program\n    {\n        static void Main(string[] args)\n        {\n         \
  \   Headersmessages headersmessages = new Headersmessages();\n            headersmessages.SendMessage();\n\
  \            Console.ReadLine();\n        }\n    }\n}\n```\n\n**发布消息到 \"Headers.exchange\"\
  \ 的 Reportpdf 队列**\n\n![jpg](img/106-01.jpg)\n\n**现在让我们来看看队列状态**\n\n\n\n\n\n如果你查看\
  \ `Reportpdf` 队列的状态，你会看到 `Ready \"1\"`，这意味着我们已经成功通过头部交换机（headers exchanges）向 `Reportpdf`\
  \ 队列发布了一条消息。\n\n![jpg](img/107-01.jpg)\n\n在发布消息之后，我们将创建一个 .Net 控制台应用程序来从队列中消费消息。\n\
  \n## 创建 RabbitMQConsumer 应用程序\n\n让我们创建另一个控制台应用程序，使用 `RabbitMQConsumer` 队列中的消息。\n\
  \n![jpg](img/107-02.jpg)\n\n创建应用程序后，我们将添加 `RabbitMQ.Client` NuGet 包。\n\n## 添加 RabbitMQ.Client\
  \ NuGet 包\n\n在这一部分，为了创建与 RabbitMQ 服务器的连接以创建请求，我们需要从 NuGet 包中添加 `RabbitMQ.Client`\
  \ 包。\n\n安装命令：`Install-Package RabbitMQ.Client -Version 5.1.0`\n\n![jpg](img/107-03.jpg)\n\
  \n安装 `RabbitMQ.Client` 后，我们将添加一个名为 `\"MessageReceiver\"` 的类。\n\n### MessageReceiver\
  \ 类代码片段\n\n在这一部分，我们创建了 `MessageReceiver` 类，该类继承自 `RabbitMQ.Client` 中的 `DefaultBasicConsumer`\
  \ 类。接下来我们需要重写 `HandleBasicDeliver` 方法，该方法接收消息体，接下来我们将像在控制台中所示写入这些消息。\n\n```csharp\n\
  using System;\nusing System.Text;\nusing RabbitMQ.Client;\nnamespace RabbitMQConsumer\n\
  {\npublic class MessageReceiver : DefaultBasicConsumer\n{\n    private readonly\
  \ IModel channel;\n    public MessageReceiver(IModel channel)\n    {\n    channel\
  \ = channel;\n    }\n    public override void HandleBasicDeliver(string\n    consumerTag,\
  \ ulong deliveryTag, bool\n    redelivered, string exchange, string routingKey,\n\
  \    IBasicProperties properties, byte[] body)\n    {\n      Console.WriteLine($\"\
  Consuming Headers Message\");\n      Console.WriteLine(string.Concat(\"Message received\n\
  from the exchange \", exchange));\n      Console.WriteLine(string.Concat(\"Consumer\
  \ tag:`\n\", consumerTag));\n      Console.WriteLine(string.Concat(\"Delivery tag:`\n\
  \", deliveryTag));\n      Console.WriteLine(string.Concat(\"Routing tag: \",\nroutingKey));\n\
  \      Console.WriteLine(string.Concat(\"Message: \",\nEncoding.UTF8.GetString(body)));\n\
  \      _channel.BasicAck(deliveryTag, false);\n    }\n}\n}\n}\n```\n\n在理解 `MessageReceiver`\
  \ 类代码片段后，接下来将在主方法中调用此类。\n\n### 消费 \"Mumbai\" 队列的主方法代码片段\n\n在主方法中，我们创建了 `connectionFactory`\
  \ 类并传递了凭据和主机名，之后我们创建了连接，接着创建了通道并将 `prefetchCount` 设置为 1，这样可以告诉 RabbitMQ 不要一次向工作负载发送多条消息。接下来，我们创建了\
  \ `MessageReceiver` 类实例并将 `IModel` (`channel`) 传递给它，在最后一步，我们调用了 `\"BasicConsume\"\
  ` 方法并将队列名称 `\"ReportPDF\"` 传递给它，同时我们将 `autoAck` 设置为 false，并将 `messageReceiver` 实例传递给它。\n\
  \n![jpg](img/109-01.jpg)\n\n```csharp\nusing System;\nusing RabbitMQ.Client;\nnamespace\
  \ RabbitMQConsumer\n{\nclass Program\n{\nprivate const string UserName = guest\"\
  ;\nprivate const string Password = guest\";\nprivate const string HostName = localhost\"\
  ;\nstatic void Main(string[] args)\n{\nConnectionFactory connectionFactory = new\n\
  ConnectionFactory\n{\nHostName = HostName,\nUserName = UserName,\nPassword = Password,\n\
  };\nvar connection = connectionFactory.CreateConnection();\nvar channel = connection.CreateModel();\n\
  // accept only one unack-ed message at a time\n// uint prefetchSize, ushort prefetchCount,\
  \ bool\nglobal\nchannel.BasicQos(0, 1, false);\n// ==== prefetchCount\n      //\
  \ In order to defeat that we can set the prefetch\ncount with the value of 1\n//\
  \ This tells RabbitMQ not to give more than one\nmessage to a worker at a time.\n\
  // Or, in other words,在工作负载处理\n//并确认之前的消息之前，不要向其\n// 分发新消息。\nInstead, it will dispatch\
  \ it to t\n// the next worker that is not still busy.\nMessageReceiver messageReceiver\
  \ = new\nMessageReceiver(channel);\nchannel.BasicConsume(\"ReportPDF\", false,\n\
  messageReceiver);\nConsole.ReadLine();\n}\n}\n}\n```\n\n现在我们已经完成了消费模块。让我们从已经发布的\
  \ `\"ReportPDF\"` 队列中消费一条消息。\n\n## 队列中有一条我们发布的请求\n\n下面的快照显示 ReportPDF 队列有一条我们使用头部交换机发布的的消息。\n\
