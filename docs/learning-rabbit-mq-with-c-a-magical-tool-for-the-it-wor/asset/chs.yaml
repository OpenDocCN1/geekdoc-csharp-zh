- "# C# 学习 RabbitMQ：IT 世界的魔法工具\n\n\n\n![](img/cover.jpg)\n\n![image](img/cover.jpg)\n\
  \n\n\n![](img/001-01.jpg)\n\n\n\n\n\n\n\n\n\n\n\n# 目录\n\n我想感谢以下人员：\n\n感谢我的父母的支持和鼓励。\n\
  \n感谢 Manish Jain 给我提供写这本书的书的机会。\n\n感谢 Shivprasad Koirala 和 Sukesh Marla 支持并鼓励我写这本书。\n\
  \n并感谢所有其他在本书准备过程中发挥过作用的人。感谢大家的辛勤工作！\n\n# RabbitMQ 简介\n\n## 什么是 RabbitMQ？\n\nRabbitMQ\
  \ 是一个 AMQP 消息中间件，它是最流行的开源且跨平台消息中间件。\n\n它基于 Erlang 构建，WhatsApp 也使用它进行通信。\n\nRabbitMQ\
  \ 也是一种应用程序之间交换数据的方法，例如从 .Net 应用发送的消息可以被 Node.js 应用或 Java 应用读取。\n\nRabbitMQ 轻量级且易于在本地和云端部署。它支持多种消息协议。RabbitMQ\
  \ 可以采用分布式和联邦配置部署，以满足高规模、高可用性的需求。\n\n![jpg](img/011-01.jpg)\n\n## 为什么以及何时应该使用 RabbitMQ？\n\
  \n我们应该使用 RabbitMQ 是因为它是开源且易于使用的，支持 .Net、Java、Python、Ruby、Node Js 等许多语言。\n\n我们可以使用\
  \ RabbitMQ 从我们的 Web 应用程序中移除一些繁重的工作，例如以电子邮件、Excel 或 Pdf 格式发送报告，或者发送电子邮件、短信或其他任务（如触发其他应用程序开始处理的器）。\n\
  \n现在，大多数人将所有这些任务（发送邮件或短信、报告）都放在单个应用程序中完成，这是一项相当繁重的任务，由 IIS 处理。如果你将此任务分离出来，IIS 将获得更多空间（内存）来提供更多请求。\n\
  \n在简单了解 RabbitMQ 之后，接下来我们将在 Windows 上安装 Erlang 和 RabbitMQ。\n\n## 什么是 AMQP？\n\n`高级消息队列协议`（`AMQP`）是一种面向消息的开放标准应用层协议，AMQP\
  \ 的定义特征是面向消息的、队列化、路由（包括点对点和发布/订阅）、可靠性和安全性。\n\n它由摩根大通和 iMatix 公司开发。\n\n### 主要特性\n\
  \nAMQP 设计的目标是具有以下主要特征：\n\n• 安全性 \n• 可靠性\n• 互操作性\n• 标准性\n• 开源\n\n### 各种客户端库\n\nRabbitMQ\
  \ 支持多种操作系统和各种语言，并为不同语言提供了各种客户端，例如：\n\n1. .Net\n2. Java\n3. Spring Framework\n4.\
  \ Ruby\n5. Python\n6. PHP\n7. Objective-C 和 Swift\n8. JavaScript\n9. GO\n10. Perl\n\
  \n![jpg](img/logo.jpg)\n\n# RabbitMQ 安装\n\n在这一部分，我们将学习如何一步步设置 RabbitMQ：\n\n1. 什么是\
  \ Erlang\n2. 下载 Erlang\n3. 安装 Erlang\n4. 下载 RabbitMQ\n5. 安装 RabbitMQ\n6.  RabbitMQ\
  \ 服务器\n7. 启用 Web 管理插件\n8. Web 管理插件\n9. 结论\n\n## 什么是 Erlang\n\nErlang 是一种通用编程语言和运行时环境。\n\
  \nErlang 内置了对并发、分布式和容错的支持。\n\nErlang 被爱立信的多个大型电信系统使用。\n\n引用自：[`erlang.org/faq/introduction.html`](http://erlang.org/faq/introduction.html)\n\
  \n### 下载 Erlang 的链接\n\n[`www.erlang.org/downloads`](http://www.erlang.org/downloads)\n\
  \n![jpg](img/013-01.jpg)\n\n下载 Erlang 后，现在我们将安装 Erlang。\n\n![jpg](img/logo.jpg)\n\
  \n# 安装 Erlang\n\n在这一部分，只需点击你下载的 Erlang 安装程序进行安装。\n\n![jpg](img/014-01.jpg)\n\n下载\
  \ Erlang 安装程序后，直接安装即可，安装完成后我们将下载 RabbitMQ。\n\n## 下载 RabbitMQ\n\n首先，我们将从以下链接下载 Windows\
  \ 版 RabbitMQ 安装程序：\n\n[`www.rabbitmq.com/download.html`](https://www.rabbitmq.com/download.html)\n\
  \n![jpg](img/014-02.jpg)\n\n下载 RabbitMQ 后，现在我们将安装 RabbitMQ。\n\n## 安装 RabbitMQ\n\n\
  在这一部分，只需点击你下载的 RabbitMQ 安装程序进行安装。\n\n![jpg](img/015-01.jpg)\n\n安装 RabbitMQ 后，搜索\
  \ RabbitMQ 命令提示符并以管理员权限打开它。\n\n## 启动 RabbitMQ 服务器\n\n在这一部分，我们将以管理员权限打开 `RabbitMQ\
  \ Command Prompt` 以检查 RabbitMQ 服务器的状态。\n\n![jpg](img/015-02.jpg)\n\n打开命令提示符后，输入\
  \ `rabbitmqctl status` 来检查 RabbitMQ 服务器的状态。\n\n```\nrabbitmqctl status\n```\n\n\
  ![jpg](img/016-01.jpg)\n\n如果你遇到如下错误，需要按照以下步骤操作：\n\n1. 在资源管理器中，导航到你的用户目录。（在地址栏输入\
  \ `%userprofile%）\n2. 如果那里已经有了 `.erlang.cookie` 文件，将其删除。如果没有，直接进入下一步。\n3. 在第二个资源管理器中，导航到\
  \ `C:\\Windows\\System32\\config`。\n4. 找到 `.erlang.cookie` 文件并将其复制到你的用户目录。\n5. 现在\
  \ `rabbitmqctl` 应该可以通过身份验证。\n\n### 解决方案链接\n\n• [`stackoverflow.com/questions/478939/authentication-failed-rejected-by-the-node-please-check-the-erlang-coo?rq=1`](https://stackoverflow.com/questions/478939/authentication-failed-rejected-by-the-node-please-check-the-erlang-coo?rq=1)\n\
  • [`stackoverflow.com/questions/2825832/rabbitmq-has-nodedown-error`](https://stackoverflow.com/questions/2825832/rabbitmq-has-nodedown-error)\n\
  \n完成步骤后，再次运行相同的命令 `rabbitmqctl status`，应该出现以下屏幕。\n\n![jpg](img/017-01.jpg)\n\n```\n\
  rabbitmq-plugins enable rabbitmq_management\n```\n\n执行此命令后，你将看到以下插件将被启用。\n\n![jpg](img/017-02.jpg)\n\
  \n屏幕是相同的，但由于我已经启用了插件，所以显示的信息不同\n\n![jpg](img/017-03.jpg)\n\n现在我们已经启动了服务器，接下来我们将启用\
  \ RabbitMQ 的 Web 管理插件。\n\n### Web 管理插件\n\n现在使用 Web 管理插件，在浏览器中输入本地地址 `http://localhost:15672/`。\n\
  \n在浏览器中输入本地地址后，它会要求访问 Web 管理插件的凭据。\n\n管理插件的默认`用户名`和`密码`为 `guest`（用户名：\"guest\" |\
  \ 密码：\"guest\"）。\n\n![jpg](img/018-01.jpg)\n\n使用默认凭据登录后，将出现以下概览屏幕。\n\n![jpg](img/018-02.jpg)\n\
  \n\n\n\n\n有关所有标签页的详细信息，您可以访问：[`www.cloudamqp.com/blog/2015-05-27-part3-rabbitmq-for-beginners_the-management-interface.html#overview`](https://www.cloudamqp.com/blog/2015-05-27-part3-rabbitmq-for-beginners_the-management-interface.html#overview)\n\
  \n![jpg](img/logo.jpg)\n\n# RabbitMQ 交换机 (Exchanges)\n\n## 什么是交换机？\n\n当生产者创建消息时，消息不会直接发送到队列，而是发送到交换机，随后路由代理根据头属性、绑定和路由键读取并发送到适当的队列。共有四种交换机以不同的方式路由消息，此外，还可以设置各种参数，如\
  \ `Type`（类型）、`Durability`（持久性）、`Auto-delete`（自动删除）和 `Internal`（内部）。\n\n### 直接交换机\
  \ (Direct Exchange)\n\n**Direct：** 直接交换机根据消息路由键将消息传递到队列。在直接交换机中，消息被路由到绑定键与消息路由键完全匹配的队列。\n\
  \n![jpg](img/019-01.jpg)\n\n### 广播交换机 (Fanout Exchange)\n\n**Fanout：** 广播交换机将消息路由到所有绑定到它的队列。\n\
  \n![jpg](img/019-02.jpg)\n\n### 主题交换机 (Topic Exchange)\n\n**Topic：** 主题交换机在路由键和绑定中指定的路由模式之间进行通配配符匹配。\n\
  \n![jpg](img/020-01.jpg)\n\n### 头部交换机 (Headers Exchange)\n\n**Headers：** 头部交换机使用消息头属性进行路由。\n\
  \n![jpg](img/020-02.jpg)\n\n### 属性详情\n\n### 名称 (Name)\n\n名称将是您设置的交换机名称，它必须是唯一的。\n\
  \n### 类型 (Type)\n\n**Direct：** 直接交换机根据消息路由键将消息传递到队列。在直接交换机中，消息被路由到绑定键与消息路由键完全匹配的队列。\n\
  \n**Fanout：** 广播交换机将消息路由到所有绑定到它的队列。\n\n**Topic：** 主题交换机在路由键和绑定中指定的路由模式之间进行通配符匹配。\n\
  \n**Headers：** 头部交换机使用消息头属性进行路由。\n\n### 持久性 (Durability)\n\n持久性是交换机的一个属性，告知消息是否可以在服务器重启后（代理重启）。\n\
  \n有两种持久性选项：\n\n1. 持久 (Durable)\n2. 瞬态 (Transient / 非持久)\n\n1. **Durable：** 如果您将交换机标记为持久，则它将在服务器重启后依然存在。\n\
  2. **Transient：** 如果您将交换机标记为瞬态，则它将在服务器重启后丢失。\n\n![jpg](img/021-01.jpg)\n\n### 自动删除\
  \ (Auto delete)\n\n![jpg](img/021-02.jpg)\n\n自动删除有两个选项：\n\n1. 是\n2. 否\n\n如果是，在至少有一个队列或交换机绑定到该交换机且所有队列或交换机都解绑后，该交换机将删除自己。例如：在此部分中，如果您创建一个交换机并将其绑定到队列，当您解绑队列时，它也会删除该交换机。\n\
  \n### 内部 (Internal)\n\n如果设置，交换机可能无法被发布者直接使用，只有在绑定到其他交换机时可以使用。内部交换机用于构建应用程序不可见的接线。\n\
  \n![jpg](img/022-01.jpg)\n\n### 备用交换机 (Alternate-exchange)\n\n如果在向交换机发布消息时出现问题，您可以指定备用交换机，它会将消息发送到另一个队列。\n\
  \n![jpg](img/022-02.jpg)\n\n## 添加交换机\n\n要添加交换机，我们首先将使用默认凭据登录，然后选择 Exchanges（交换机）标签页。\n\
  \n![jpg](img/023-01.jpg)\n\n选择标签页后，您将看到“Add a new exchange panel（添加新交换机面板）”，点击该面板即可展开。展开后会要求输入交换机名称，为了演示，我们将交换机命名为\
  \ `demoexchange`，并在类型中选择 *\"direct\"，然后点击添加按钮进行创建。\n\n![jpg](img/023-02.jpg)\n\n\
  输入所有详情后，我们将点击 **Add exchange**（添加交换机）按钮来创建交换机。\n\n## 添加交换机后的快\n\n![jpg](img/024-01.jpg)\n\
  \n以类似的方式，我们可以添加不同类型的交换机。\n\n![jpg](img/logo.jpg)\n\n# RabbitMQ 队列 (Queues)\n\n##\
  \ 什么是队列？\n\n队列是一个存储从交换机发送到队列的消息的缓冲区。\n\n![jpg](img/025-01.jpg)\n\n## 队列参数详情\n\n\
  ### 名称 (Name)\n\n队列的名称，我们可以在应用程序中引用。名称必须是唯一的，且不能是系统定义的队列名称。\n\n### 持久性 (Durability)\n\
  \n持久性是队列的一个属性，告知消息是否可以在服务器重启后（代理重启）。\n\n有两种持久性选项：\n\n1. 持久 (Durable)\n2. 瞬态 (Transient\
  \ / 非持久)\n\n1. **Durable：** 如果您将队列标记为持久，则它将在服务器重启后依然存在。\n2. **Transient：** 如果您将交换标记为瞬态，则它将在服务器重启后丢失。（注：此处原文误为\
  \ exchange，应为 queue）\n\n![jpg](img/025-02.jpg)\n\n### 自动删除 (Auto delete)\n\n自动删除有两个选项：\n\
  \n1. 是\n2. 否\n\n如果是，在至少有一个队列或交换机绑定到该交换机且所有队列或交换机都解绑后，该交换机将删除自己。例如：在此部分中，如果您创建一个交换机并将其绑定到队列，当您解绑队列时，它也会删除该交换机。\n\
  \n### 参数 (Arguments)\n\n参数（可选；用于插件和特定功能，如消息 TTL、队列长度等）\n\n### 生存时间 (Time-to-live)\n\
  \n在此部分中，您可以为队列设置过期时间，达到时间后将丢弃。\n\n时间为毫秒。\n\n![jpg](img/026-01.jpg)\n\n### 自动过期 (Auto\
  \ expire)\n\n在此部分中，您可以通过设置此属性为队列设置过期。\n\n这控制队列未使用多久后自动删除。\n\n未使用意味着队列没有消费者、队列未被重新声明，且至少没有调用过\
  \ `basic.get`。\n\n![jpg](img/027-01.jpg)\n\n### 最大长度 (Max Length)\n\n队列在开始丢弃头部之前可以包含的（就绪）消息数量。\n\
  \n通过在队列声明参数中提供非负值 `x-max-length` 设置消息数量。\n\n![jpg](img/027-02.jpg)\n\n例如，如果您设置 `x-max-length\
  \ = 2` 且向队列发布了三条消息，则队列将保留两条，最旧的删除。\n\n![jpg](img/027-03.jpg)\n\n### 最大长度字节 (Max\
  \ Length Bytes)\n\n队列在开始丢弃头部之前可以包含的就绪消息的总大小。\n\n通过在队列声明参数中提供非负整数值 `x-max-length-bytes`\
  \ 设置最大字节数。\n\n（设置 `x-max-length-bytes` 参数。） *1000000 bytes = 1MB*\n\n例如，如果您设置 `x-max-length-bytes\
  \ = 1000000` 并向队列发布消息导致队列大小超过 1 MB，则最旧的消息删除（从头部丢弃）。\n\n![jpg](img/028-01.jpg)\n\n\
  ### 溢出行为 (Overflow Behaviour)\n\n设置队列溢出行为。这决定了当达到最大长度时会发生什么。有效值为 `drop-head`（丢头部）或\
  \ `reject-publish`（拒绝发布）。\n\n![jpg](img/028-02.jpg)\n\n### 死信交换机 (Dead Letter Exchange)\n\
  \n当消息被拒绝或过期时，将重新发布到的可选交换机名称。\n\n![jpg](img/029-01.jpg)\n\n### 死信路由键 (Dead Letter\
  \ Routing Key)\n\n当消息进入死信时使用的可选替换路由键。如果没有设置，将使用消息的原始路由键。\n\n\n\n\n\n例如，如果你向一个路由键为\
  \ `foo` 的交换机发布消息，且该消息进入了死信队列，它将带有路由键 `foo` 被发布到其对应的死信交换机中。如果消息最初落入的队列在声明时将 `x-dead-letter-routing-key`\
  \ 设置为 `bar`，那么该消息将带有路由键 `bar` 被发布到其对应的死信交换机中。\n\n![jpg](img/029-02.jpg)\n\n### 最大优先级\
  \ (Maximum Priority)\n\n队列支持的最大优先级层数；如果没有设置，则队列将不支持消息优先级。\n\n（设置 `x-max-priority`\
  \ 参数。）\n\n要声明优先级队列，请使用可选的队列参数 `x-max-priority`。该参数应该是 1 到 255 之间的正整数，表示队列应该支持的最大优先级。\n\
  \n![jpg](img/030-01.jpg)\n\n### 懒惰模式 (Lazy Mode)\n\n将队列设置为懒惰模式，尽可能将更多消息保留在磁盘上以减少\
  \ RAM 占用；如果没有设置，队列将保留内存缓存以尽可能快的速度递送消息。\n\n（设置 `x-queue-mode` 参数。）\n\n![jpg](img/030-02.jpg)\n\
  \n### 主节点定位器 (Master Locator)\n\n将队列设置为主节点模式，确定在节点集群上声明队列时定位队列主节点的规则。\n\n（设置 `x-queue-master-locator`\
  \ 参数。）\n\n### 添加队列 (Adding Queue)\n\n要创建队列，你需要点击 Web 管理插件中的队列标签页。\n\n![jpg](img/030-03.jpg)\n\
  \n点击队列标签页后，你将看到一个带有箭头的“添加队列”面板，只需点击该面板即可展开。\n\n![jpg](img/031-01.jpg)\n\n点击“添加新队列”后，新队列面板将会展开，我们将进入队列详情设置。\n\
  \n首先，我们将从队列名称开始，将其命名为 `demoqueue`，然后选择将持久性设置为 `Durable`（持久化），最后一个选项，我们将将自动删除设置为\
  \ `No`，并点击“添加队列”按钮来创建队列。\n\n![jpg](img/031-02.jpg)\n\n添加队列后，你可以看到最近添加的队列，它位于“添加队列”面板上方。\n\
  \n![jpg](img/031-03.jpg)\n\n![jpg](img/logo.jpg)\n\n# RabbitMQ 中的绑定 (Binding in\
  \ RabbitMQ)\n\n## 什么是绑定 (What is Binding)\n\n绑定是我们在队列和交换机之间配置的连接。\n\n**简单来说：**绑定是交换机与队列之间的关系。\n\
  \n在这一部分，我们将使用路由键将交换机与队列绑定，这将用于直接类型（direct type）交换机。交换机将根据路由键将请求路由到特定的队列。\n\n要进行绑定，点击你输入的\
  \ `demoqueue` 队列名称，点击后，绑定面板将会展开，接下来它会询问交换机名称，输入我们创建的交换机名称 `demoexchange` 和路由键 `demokey`，然后点击绑定按钮。\n\
  \n### 队列列表 (Queues)\n\n![jpg](img/032-01.jpg)\n\n### 绑定后的快 (Snapshot after Binding)\n\
  \n![jpg](img/032-02.jpg)\n\n####为此队列添加绑定 (Add binding to this queue)\n\n![jpg](img/033-01.jpg)\n\
  \n绑定后，如果你想取消绑定，可以点击 `Unbind` 按钮移除绑定。\n\n![jpg](img/logo.jpg)\n\n# RabbitMQ 用户 (RabbitMQ\
  \ Users)\n\n在这一部分，我们将学习如何创建一个新用户并给新用户授予权限。\n\n要创建新用户，我们需要使用默认凭据登录 Web 管理插件。\n\n\
  ![jpg](img/034-01.jpg)\n\n登录应用程序后，我们将选择 `Admin` 标签页。\n\n![jpg](img/034-02.jpg)\n\
  \n选择 admin 标签页后，我们可以看到默认用户名 `guest`，它下方具有 `administrator`（标签）权限，下方我们可以看到添加新用户的面板。\n\
  \n![jpg](img/034-03.jpg)\n\n点击 `Add a User` 面板来创建新用户。\n\n![jpg](img/035-01.jpg)\n\
  \n在继续之前，让我们先看看标签（Tags）。这一部分中的标签是分配给创建用户的权限（特权）。如果需要，我们可以为用户设置单个或多个权限，如果需要多个权限，只需用逗号分隔的形式设置权限（例如\
  \ `administrator, management`）。\n\n## 管理插件当前支持的功能 (Currently Supported by the Management\
  \ Plugin)\n\n### 管理 (Management)\n用户可以访问管理插件。\n\n### 策略制定者 (Policymaker)\n用户可以访问管理插件，并对其拥有访问权限的虚拟主机（vhosts）管理策略和参数。\n\
  \n### 监控 (Monitoring)\n用户可以访问管理插件，并查看所有连接、通道以及节点相关的信息。\n\n### 管理员 (Administrator)\n\
  用户可以执行监控功能的所有操作，管理用户、虚拟主机和权限，关闭其他用户的连接，并管理所有虚拟主机的策略和参数。\n\n## 创建用户 (Creating Users)\n\
  \n在这一部分，我们将创建一个新用户并将用户名设置为 `demouser`，然后将密码设置为 `123456`，之后我们将给该用户的权限设置为 `administrator`（只需点击\
  \ Admin 链接，它就会在 tags 字段中设置 `administrator`），最后点击 `Add user` 创建新用户。\n\n添加队列后，你可以在面板中看到新添加的\
  \ `demouser`，我们可以看到 `No`，这意味着我们没有访问权限。\n\n### 为虚拟主机设置权限 (Setting Privilege to Virtual\
  \ Hosts)\n\n要设置权限，只需点击 `demouser`。\n\n权限设置完成后，你将在网格中看到 `demouser`。\n\n# RabbitMQ\
  \ 虚拟主机 (Virtual Hosts)\n\n## 什么是虚拟主机？ (What are Virtual Hosts?)\n\n虚拟主机就像一个虚拟盒子，包含了连接、交换机、队列、绑定、用户权限等的逻辑分组。\n\
  \n![jpg](img/039-01.jpg)\n\n我们可以创建不同的虚拟主机，每个虚拟主机都有自己的用户。\n\n## 创建虚拟主机 (Creating\
  \ Virtual host)\n\n要创建一个虚拟主机，我们首先使用默认凭据登录，然后选择 `admin` 标签页。\n\n![jpg](img/039-02.jpg)\n\
  \n选择 admin 标签页后，你将在页面右侧看到垂直菜单中的 `Virtual Hosts`。\n\n![jpg](img/040-01.jpg)\n\n选择\
  \ `Virtual Hosts` 后，你会看到已经存在的默认 `Virtual Hosts`，下方有一个 `Add a new virtual host` 面板，点击它即可展开。\n\
  \n![jpg](img/040-02.jpg)\n\n展开后可以看到添加虚拟主机需要添加 `Name` 参数，我在这里输入名称为 `demohost`，接下来点击\
  \ `Add a new virtual host` 按钮创建 `demohost` 虚拟主机。\n\n![jpg](img/040-03.jpg)\n\n添加虚拟主机后，你可以在\
  \ `All virtual hosts` 面板中看到新添加的虚拟主机。\n\n![jpg](img/040-04.jpg)\n\n\n\n\n\n添加用户后，你只需要展开所有用户的面板，即可看到所有用户。在展开后，你可以看到新用户\
  \ `virtualuser`，但在网格中，你可以看到 `Can access virtual hosts`（访问虚拟主机）列，其值为 `No access`（无访问），这意味着我们没有访问虚拟主机的权限。\n\
  \n![jpg](img/041-02.jpg)\n\n## 设置访问虚拟主机的权限\n\n设置权限，只需点击我们创建的用户名 `virtualuser`。\n\
  \n![jpg](img/041-03.jpg)\n\n点击 `virtualuser` 后，进入权限面板，它位于概述（overview）面板下方。\n\n展开权限面板，并点击设置权限（set\
  \ permission）按钮即可为 `virtualuser` 设置权限。\n\n![jpg](img/042-01.jpg)\n\n默认值为 `\".*\"\
  `，它允许访问虚拟主机中的所有交换机和队列。\n\n权限设置完成后，你将看到如下所示的 `Current permission`（当前权限）：\n\n![jpg](img/042-02.jpg)\n\
  \n现在你应该能够以此 `virtualuser` 身份登录 RabbitMQ Web 管理插件。\n\n让我们使用新用户 `virtualuser` 登录 RabbitMQ\
  \ Web 管理插件。\n\n![jpg](img/042-03.jpg)\n\n以下是用新用户 `virtualuser` 登录 RabbitMQ Web 管理插件后的快照。\n\
  \n![jpg](img/043-01.jpg)\n\n现在我们已经完成了新虚拟主机的创建，并且我们必须为其分配一个新用户。\n\n![jpg](img/logo.jpg)\n\
  \n# 连接 (Connections)\n\n连接（connection）是你的应用程序与 RabbitMQ 代理之间的 TCP 连接。\n\n引用自：[`www.cloudamqp.com/blog/2015-05-18-part1-rabbitmq-for-beginners-what-is-rabbitmq.html`](https://www.cloudamqp.com/blog/2015-05-18-part1-rabbitmq-for-beginners-what-is-rabbitmq.html)\n\
  \n在连接（connection）选项卡中，将显示消息生产者和消息消费者的实时连接，同时它还会显示每个连接的用户名以及连接状态；如果你使用 SSL/TLS，连接将用一个深色点\
  \ `.` 标记。它还会显示使用了什么协议，随后在网络部分显示从客户端和到客户端的网络利用率。\n\n![jpg](img/044-01.jpg)\n\n如果你想查看每个连接的详情，请点击连接名称。\n\
  \n## 连接 (Connections)\n\n![jpg](img/044-02.jpg)\n\n点击连接名称后，将显示连接的所有详情，包括数据速率、通道（channels）、客户端属性、运行时指标，最后关闭连接。\n\
  \n![jpg](img/045-01.jpg)\n\n如果你想关闭连接，可以打开 `Close this connection`（关闭此连接）标签页，输入原因并点击\
  \ `Force Close`（强制关闭）按钮。\n\n![jpg](img/045-02.jpg)\n\n![jpg](img/logo.jpg)\n\n#\
  \ 通道 (Channels)\n\n通道（channel）是连接内部的虚拟连接当你从队列发布或消费消息时——所有操作都是通过通道完成的。**引用自：** [`www.cloudamqp.com/blog/2015-05-18-part1-rabbitmq-for-beginners-what-is-rabbitmq.html`](https://www.cloudamqp.com/blog/2015-05-18-part1-rabbitmq-for-beginners-what-is-rabbitmq.html)\n\
  \n在通道（channel）选项卡中，将显示消息生产者和消息消费者的实时通道，同时会显示模式（mode）。有两种模式：C - 确认通道（confirm channel）发送流式发布确认；T\
  \ - 事务通道（transactional channel）是事务性的，随后将显示通道状态。后续详情中 `Unconfirmed`（未确认）列将显示尚未确认的发布消息数量；`Unconfirmed`\
  \ 列旁边是 `Prefetch`（预取）列，显示每个通道限制的详情；`Prefetch` 列旁边是 `Unacked` 列，`Unacked` 表示消费者已承诺处理但尚未确认已处理；此外我们还有消息速率，显示发布和确认速率，以及投递和确认详情。\n\
  \n## 模式的说明\n\n通道保证模式。可以是以下之一，或两者皆非：\n\nC - confirm（确认模式）\n通道将发送流式发布确认。\n\nT - transactional（事务模式）\n\
  通道是事务性的。\n\n## 预取计数数的说明\n\n通道预取计数（prefetch counts）。\n\n每个通道可以有两个预取计数：每个消费者的计数（限制通道上创建的每个新消费者）以及全局计数（在通道上的所有消费者之间共享）。\n\
  \n如果设置了限制，此列将显示其中一个、另一个或两个限制。\n\n![jpg](img/046-01.jpg)\n\n如果你想查看每个通道的详情，点击通道名称\
  \ `[::11:57086 (1)]`，将显示与该通道相关的所有详情。\n\n![jpg](img/047-01.jpg)\n\n![jpg](img/logo.jpg)\n\
  \n# 发布消息 (Publishing Message)\n\n要发布消息，使用凭据登录 web 管理插件。\n\n![jpg](img/048-01.jpg)\n\
  \n登录 web 管理插件后，下一步点击队列 `(demoqueue)`。\n\n![jpg](img/048-02.jpg)\n\n点击 demoqueue\
  \ \"queue\" 后，在绑定（bindings）面板下方是发布消息面板，在其中只需输入消息即可。\n\n![jpg](img/048-03.jpg)\n\n\
  ## 发布消息后的快照\n\n![jpg](img/049-01.jpg)\n\n# 读取消息 (Reading Message)\n\n要读取消息，使用凭据登录\
  \ web 管理插件。\n\n![jpg](img/050-01.jpg)\n\n登录 web 管理插件后，下一步点击队列 `(demoqueue)`。\n\n\
  ![jpg](img/050-02.jpg)\n\n要读取消息，在这里你可以输入消息数量并点击 `Get Message`（获取消息）即可获取消息。\n\n![jpg](img/050-03.jpg)\n\
  \n![jpg](img/051.jpg)\n\n## 读取消息时的快照\n\n![jpg](img/051-02.jpg)\n\n# 删除消息 (Delete\
  \ Message)\n\n要删除消息，使用凭据登录 web 管理插件。\n\n![jpg](img/052-01.jpg)\n\n登录 web 管理插件后，点击队列\
  \ `(demoqueue)`。\n\n要删除消息，你可以展开删除面板，在其中你会看到删除按钮。只需点击即可删除。\n\n![jpg](img/052-02.jpg)\n\
  \n点击删除按钮后会弹出一个确认消息，如所示：\n\n![jpg](img/052-03.jpg)\n\n如果我们点击 `OK` 按钮将删除该队列。\n\n![jpg](img/logo.jpg)\n\
  \n# 使用 C# 向 RabbitMQ 发布消息\n\n在本部分，我们将学习如何逐步使用 .Net 和 RabbitMQ.Client 向 RabbitMQ\
  \ 发布消息。\n\n## 创建 RequestRabbitMQ \n\n让我们创建一个名为 `RequestRabbitMQ` 的简单控制台应用程序。\n\n\
  ![jpg](img/053-01.jpg)\n\n创建应用程序后，我们将添加 `RabbitMQ.Client` 包。\n\n## 添加 RabbitMQ.Client\
  \ NuGet 包\n\n在本部分，为了创建与 RabbitMQ 服务器的连接，我们需要从 NuGet 包中添加 `RabbitMQ.Client` 包。\n\n\
  安装命令：`Install-Package RabbitMQ.Client -Version 5.1.0`\n\n![jpg](img/053-02.jpg)\n\
  \n安装 `RabbitMQ.Client` NuGet 包后，我们将从 web 管理控制台创建一个交换机。\n\n## 添加直接交换机 (Adding Direct\
  \ Exchange)\n\n在本部分，我们将创建一个交换机，为此我们首先使用 `RabbitMQ.Client` 创建与 RabbitMQ 服务器的连接，连接后我们将凭据连同\
  \ `HostName` 传递给 `connectionFactory`，之后通过调用 `CreateConnection` 方法创建连接，接下来添加交换机时调用了\
  \ `ExchangeDeclare` 方法并传递了*交换机名称*和*交换类型*等参数。\n\n```csharp\nusing RabbitMQ.Client;\n\
  using System;\n\nnamespace RequestRabbitMQ\n{\n    class Program\n    {\n      \
  \  static void Main(string[] args)\n        {\n            string UserName = \"\
  guest\";\n            string Password = \"guest\";\n            string HostName\
  \ = \"localhost\";\n            //RabbitMQ .NET AMQP 的主入口点\n            client\n\
  \            var c o n e c t i o n F a c t o r y = new\n```\n\n\n\n\n`RabbitMQ.Client.ConnectionFactory()`\n\
  \n```csharp\n{\n    UserName = UserName,\n    Password = Password,\n    HostName\
  \ = HostName\n};\n\nvar connect i on = connectionFactory.CreateConnection();\nvar\
  \ model = connection.CreateModel();\n//// Create Exchange\nmodel.ExchangeDeclare(\"\
  demoExchange\", ExchangeType.Direct);\nConsole.ReadLine();\n}\n}\n}\n```\n\n让我们运行应用程序来检查结果。\n\
  \n![jpg](img/055-01.jpg)\n\n添加交换后，让我们检查 Web 管理插件，你会看到我们已成功创建了交换。\n\n![jpg](img/055-02.jpg)\n\
  \n### 添加队列\n\n现在我们将添加一个队列。\n\n为了实现这一点，我们将调用 `QueueDeclare` 方法并向其传递参数。\n\n### 方法定义：\n\
  \n```csharp\n/// <summary> 声明队列。</summary>\n[AmqpMethodDoNotlmplement(null)]\nQueueDedareOk\
  \ QueueDedare(string queue, bool durable, bool exclusive, bool autoDelete, IDictionary<string,\
  \ object> arguments)\n```\n\n第一个参数是队列名称 `demoqueue`。\n\n第二个参数是持久性 `true`。\n\n第三个参数是专属\
  \ `false`。\n\n第四个参数是自动删除 `false`。\n\n第五个参数是参数 `null`。\n\n```csharp\n// 创建队列\nmodel.QueueDeclare(\"\
  demoqueue\", true, false, false, null);\n```\n\n### 代码片段\n\n```csharp\nusing RabbitMQ.Client;\n\
  using System;\nnamespace RequestRabbitMQ\n{\n    class Program\n    {\n        static\
  \ void Main(string[] args)\n        {\n            string UserName = \"guest\";\n\
  \            string Password = \"guest\";\n            string HostName = \"localhost\"\
  ;\n            // RabbitMQ .NET AMQP 客户端的主入口点\n            var connectionFactory\
  \ = new RabbitMQ.Client.ConnectionFactory()\n            {\n                UserName\
  \ = UserName,\n                Password = Password,\n                HostName =\
  \ HostName\n            };\n            var connection = connectionFactory.CreateConnection();\n\
  \            var model = connection.CreateModel();\n            //// 创建交换\n    \
  \        //model.ExchangeDeclare(\"demoExchange\", ExchangeType.Direct);\n     \
  \       //Console.WriteLine(\"Creating Exchange\");\n            // 创建队列\n     \
  \       model.QueueDeclare(\"demoqueue\", true, false, false, null);\n         \
  \   Console.WriteLine(\"Creating Queue\");\n            Console.ReadLine();\n  \
  \      }\n    }\n}\n```\n\n让我们运行应用程序来检查结果。\n\n![jpg](img/056-01.jpg)\n\n添加队列后，让我们检查\
  \ Web 管理插件，你会看到我们已成功创建了队列。\n\n![jpg](img/057-01.jpg)\n\n添加队列后，我们将队列绑定到交换上。\n\n#\
  \ 将 demoqueue 绑定到 demoExchange\n\n在绑定时，我们将输入交换名称 `demoExchange` 并输入路由键为 `directexchange_key`。\n\
  \n### 方法定义：\n\n![jpg](img/057-02.jpg)\n\n第一个参数是队列名称 `demoqueue`。\n\n第二个参数是交换 `demoExchange`。\n\
  \n第三个参数是路由键 `directexchange_key`。\n\n```csharp\n// 创建绑定\nmodel.QueueBind(\"demoqueue\"\
  , \"demoExchange\", \"directexchange_key\");\nConsole.WriteLine(\"Creating Binding\"\
  );\n```\n\n### 代码片段\n\n```csharp\nusing RabbitMQ.Client;\nusing System;\nnamespace\
  \ RequestRabbitMQ\n{\n    class Program\n    {\n        static void Main(string[]\
  \ args)\n        {\n            string UserName = \"guest\";\n            string\
  \ Password = \"guest\";\n            string HostName = \"localhost\"\n         \
  \   // RabbitMQ .NET AMQP 客户端的主入口点\n            var connectionFactory = new RabbitMQ.Client.ConnectionFactory()\n\
  \            {\n                UserName = UserName,\n                Password =\
  \ Password,\n                HostName = HostName\n            };\n            var\
  \ connection = connectionFactory.CreateConnection();\n            var model = connection.CreateMode();\n\
  \            //// 创建交换\n            //model.ExchangeDeclare(\"demoExchange\", ExchangeType.Direct);\n\
  \            //Console.WriteLine(\"Creating Exchange\");\n            //// 创建队列\n\
  \            //model.QueueDeclare(\"demoqueue\", true, false, false, null);\n  \
  \          //Console.WriteLine(\"Creating Queue\");\n            // 创建绑定\n     \
  \       model.QueueBind(\"demoqueue\", \"demoExchange\", \"directexchange_key\"\
  );\n            Console.WriteLine(\"Creating Binding\");\n            Console.ReadLine();\n\
  \        }\n    }\n}\n```\n\n![jpg](img/058-01.jpg)\n\n创建绑定后，让我们检查 Web 管理插件，你会看到我们已成功创建了绑定。\n\
  \n![jpg](img/059-01.jpg)\n\n现在让我们从控制台应用程序向 `demoqueue` 推送消息。\n\n## 添加 Directmessages\
  \ 类\n\n我们创建了一个 `Directmessage` 类，在这个类中，我们将创建请求并推送到 RabbitMQ。\n\n（注：原文此处存在大量重复句子，已根据文档工程师规范进行精简）\n\
  \n## 使用 C# 从 RabbitMQ 消费消息\n\n在本部分，我们将学习如何使用 .Net 逐步从 RabbitMQ 消费消息。\n\n## 创建 RabbitMQConsumer\
  \ \n\n让我们创建一个另一个控制台应用程序，从队列中消费消息。\n\n![jpg](img/061-03.jpg)\n\n## 添加 RabbitMQ.Client\
  \ NuGet 包\n\n在本部分，为了与 RabbitMQ 服务器建立连接以创建请求，我们需要从 NuGet 包添加 `RabbitMQ.Client` 包。\n\
  \n安装命令：`Install-Package RabbitMQ.Client -Version 5.1.0`\n\n![jpg](img/062-01.jpg)\n\
  \n安装 `RabbitMQ.Client` 后，我们将添加一个名为 `MessageReceiver` 的类。\n\n\n\n\n### MessageReceiver\
  \ 类代码片段\n\n在此部分中，我们创建了 `MessageReceiver` 类，该类继承自来自 `RabbitMQ.Client` 的 `DefaultBasicConsumer`\
  \ 类。接下来我们需要重写 `HandleBasicDeliver` 方法，该方法负责接收消息体，随后我们将像控制台中看到的那样写入这些消息。\n\n```csharp\n\
  using System;\nusing System.Text;\nusing RabbitMQ.Client;\nnamespace RabbitMQConsumer\n\
  {\n    public class MessageReceiver : DefaultBasicConsumer\n    {\n        private\
  \ readonly IModel _channel;\n        public MessageReceiver(IModel channel)\n  \
  \      {\n            _channel = channel;\n        }\n        public override void\
  \ HandleBasicDeliver(string consumerTag, ulong deliveryTag, bool redelivered, string\
  \ exchange, IBasicProperties properties, byte[] body)\n        {\n            Console.WriteLine($\"\
  Consuming Message\");\n            Console.WriteLine($\"Message received from the\
  \ exchange {exchange}\");\n            Console.WriteLine($\"Consumer tag:{consumerTag}\"\
  );\n            Console.WriteLine($\"Delivery tag:{deliveryTag}\");\n          \
  \  Console.WriteLine($\"Routing tag: {properties.RoutingKey}\");\n            Console.WriteLine($\"\
  Message: {Encoding.UTF8.GetString(body)}\");\n            _channel.BasicAck(deliveryTag,\
  \ false);\n        }\n    }\n}\n```\n\n理解 `MessageReceiver` 类的代码片段后，接下来我们将在 main\
  \ 方法中调用该类。\n\n#### Main 方法代码片段\n\n在 main 方法中，我们创建了 `ConnectionFactory` 类并传递了凭据和\
  \ `Hostname`。之后创建了连接，接着创建了通道并将 `prefetchCount` 设置为 `1`，这告诉 RabbitMQ 不要一次向工作者发送多条消息。接下来，我们创建了\
  \ `MessageReceiver` 实例并将 `IModel` (`channel`) 传递给它。最后一步，我们调用了 `BasicConsume` 方法并将队列名称\
  \ `demoqueue` 传递给它，同时将 `autoAck` 设置为 `false` 并传递了 `messageReceiver` 实例。\n\n```csharp\n\
  using System;\nusing System.Collections.Generic;\nusing System.Linq;\nusing System.Text;\n\
  using System.Threading.Tasks;\nusing RabbitMQ.Client;\nnamespace RabbitMQConsumer\n\
  {\n    class Program\n    {\n        private const string UserName = \"guest\";\n\
  \        private const string Password = \"guest\";\n        private const string\
  \ HostName = \"localhost\";\n        static void Main(string[] args)\n        {\n\
  \            ConnectionFactory connectionFactory = new ConnectionFactory()\n   \
  \         {\n                HostName = HostName,\n                UserName = UserName,\n\
  \                Password = Password,\n            };\n            var connection\
  \ = connectionFactory.CreateConnection();\n            var channel = connection.CreateModel();\n\
  \            // accept only one unack message at a time\n            // uint prefetchSize,\
  \ ushort prefetchCount, bool\n            channel.BasicQos(0, 1, false);\n     \
  \       MessageReceiver messageReceiver = new MessageReceiver(channel);\n      \
  \      channel.BasicConsume(\"demoqueue\", false, messageReceiver);\n          \
  \  Console.ReadLine();\n        }\n    }\n}\n```\n\n**注意：** `prefetchCount`\n\n\
  我们将计数设置为 `1`。这告诉 RabbitMQ 不要一次向工作者发送多于一条消息。换句话说，在工作者处理并确认之前的消息之前，不要分发新消息。相反，它会将消息发送给下一个空闲的工作者。\n\
  \n现在我们已经完成了工作机制。让我们从 `RequestRabbitMQ` 控制台创建请求并在 `RabbitMQConsumer` 中消费消息。\n\n##\
  \ 队列为空\n\n![images/065-01.jpg)\n\n在我们看到队列 `demoqueue` 是空的之后，我们将向 `demoqueue` 发布消息。\n\
