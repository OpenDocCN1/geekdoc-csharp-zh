  \ 类代码片段\n\n在此部分中，我们创建了 `MessageReceiver` 类，该类继承自来自 `RabbitMQ.Client` 的 `DefaultBasicConsumer`\
  \ 类。我们需要重写 `HandleBasicDeliver` 方法，该方法接收消息体，接下来我们将按照我们在控制台中看到的方式写入这些消息。\n\n```csharp\n\
  using System;\nusing System.Text;\nusing RabbitMQ.Client;\nnamespace RabbitMQConsumer\n\
  {\n    public class MessageReceiver : DefaultBasicConsumer\n    {\n        private\
  \ readonly IModel channel;\n        public MessageReceiver(IModel channel)\n   \
  \     {\n            channel = channel;\n        }\n        public override void\
  \ HandleBasicDeliver(string consumerTag, ulong deliveryTag, bool redelivered, string\
