  Routing tag:\", routingKey));\n            Console.WriteLine(string.Concat(\"Message:\
  \ \", Encoding.UTF8.GetString(body)));\n            _channel.BasicAck(deliveryTag,\
  \ false);\n        }\n    }\n}\n```\n\n理解 `MessageReceiver` 类代码片段后，我们将在主方法中调用该类。\n\
