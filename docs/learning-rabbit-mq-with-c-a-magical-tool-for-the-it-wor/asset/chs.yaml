  \n# 使用 .Net 使用 RabbitMQ Direct 交换器\n\n在此部分，我们将使用 Direct 交换器，通过 .Net 应用程序和 `RabbitMQ.Client`\
  \ 向 RabbitMQ 推送消息，并使用 .Net 应用程序和 `RabbitMQ.Client` 读取消息。\n\n![images/066-01.jpg)\n\
  \n## 交换器类型\n\n1. Direct（直接型）\n2. fanout（广播型）\n3. Headers（头部型）\n4. Topic（主题型）\n\n\
  ### 交换器详情\n\n1. **Direct**: Direct 交换器根据路由键传递消息。在 Direct 交换器中，消息被路由到键完全匹配的队列。\n\
  2. **Fanout**: Fanout 交换器将消息路由到所有绑定的队列。\n3. **Topic**: Topic 交换器在路由键和模式之间进行通配匹配。\n\
  4. **Headers**: Headers 交换器使用头部属性进行路由。\n\n## 创建 RequestRabbitMQ\n\n让我们创建应用程序 `RequestRabbitMQ`。\n\
  \n![images/067-01.jpg)\n\n## 添加 RabbitMQ.Client 包\n\n在此部分我们需要添加 `RabbitMQ.Client`\
  \ NuGet 包。\n\n![images/067-02.jpg)\n\n## 添加 Direct 交换\n\n命令：`Install-Package RabbitMQ.Client\
  \ -Version 5.1`\n\n![images/067-03.jpg)\n\n安装包后，访问 `http://localhost:15672/#exchanges`，命名为\
  \ `request.exchange`，输入名称后选择类型为 `direct` 并点击 Add 按钮进行创建。\n\n### 添加队列\n\n添加交换器 `request.exchange`\
  \ 后，接下来我们需要添加队列 (`request.queue`)。\n\n![images/068-01.jpg)\n\n访问 `http://localhost:15672/#queues`，添加队列：`request.queue`。\n\
  \n## 将 request.queue 绑定到交换器\n\n添加队列后，我们将队列与交换器绑定。\n\n在绑定中，我们将输入交换器名称 `request.exchange`\
  \ 并输入路由键为 `direct_key`。\n\n![images/068-02.jpg)\n\n我们创建了一个 `Directmessage` 类，在此类中我们将创建请求并推送到\
  \ RabbitMQ。\n\n首先，我们把 `Username`、`Password` 和 `HostName` 定义为常量。之后，我们创建了一个名为 `SendMessage`\
  \ 的方法，在该方法中使用通过 `RabbitMQ.Client` 创建了到 RabbitMQ 服务器的连接。创建连接后，我们将凭据连同 `Hostname`\
  \ 传递给 `connectionFactory`。接着，我们写了一条简单的消息 `Direct Message` 并以字节数组形式获取，最后，我们将所有这些值赋值给\
  \ `RabbitMQ.Client` 的 `BasicPublish` 方法。\n\n### BasicPublish \n\n![images/069-01.jpg)\n\
  \n### 传递给它的参数\n\nExchange: `request.exchange`\nRoutingkey: `direct_key`\n\n\n\n\n\
  \n```csharp\nvar connection = connectionFactory.CreateConnection();\nvar model =\
  \ connection.CreateModel();\nvar properties = model.CreateBasicProperties();\nproperties.Persistent\
  \ = false;\nbyte [] messagebuffer = Encoding.Default.GetBytes(\"Direct Message\"\
  );\nmodel.BasicPublish(\"request.exchange\", \"directexchange_key\", properties,\
  \ messagebuffer);\nConsole.WriteLine(\"Message Sent\");\n}\n}\n```\n\n### 主代码片段\n\
  \n```csharp\nusing System;\nnamespace RequestRabbitMQ\n{\n    class Program\n  \
  \  {\n        static void Main(string[] args)\n        {\n            Directmessages\
  \ directmessages = new Directmessages();\n            directmessages.SendMessage();\
  \ Console.ReadLine();\n        }\n    }\n}\n```\n\n完成整个流程后，让我们保存并运行应用程序。运行后，你将在控制台窗口看到“message\
  \ sent”消息，仅用于通知。\n\n![jpg](img/070-01.jpg)\n\n发送消息后，现在让我们来看队列 `request.queue`。\n\
