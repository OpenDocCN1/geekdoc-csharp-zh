    # **Binding in RabbitMQ**


    ## **What is Binding**


    A binding is a connection which we can configure between a queue and an exchange.


    **Simple words:** A binding is a relationship between an exchange and a queue.


    In this part, we are going to bind exchange with queue using routing key and this
    will be used for direct type exchange. The exchange will route the request to
    particular queue on basis of routing key.


    For binding, click on queue name which you have entered **"demoqueue",** after
    that click on it, bindings panel will expand, next it will ask for exchange name,
    enter exchange name which we have created **"demoexchange"** and routing key **"demokey"**
    and click on bind button.


    ### **Queues**


    ![jpg](images/032-01.jpg)


    ### **Snapshot after Binding**


    ![jpg](images/032-02.jpg)


    **Add binding to this queue**


    ![jpg](images/033-01.jpg)


    After binding if you want to unbind it then you can click on **Unbind** button
    to remove binding.


    ![jpg](images/logo.jpg)


    # **RabbitMQ Users**


    In this part, we are going to learn how to create a new User and give permission
    to New User.


    For creating a New user, we need to login into Web Management Plugin using default
    credentials.


    ![jpg](images/034-01.jpg)


    After logging into the application, we are going to choose **Admin** tab.


    ![jpg](images/034-02.jpg)


    After choosing admin tab we can see a default username which is "guest" which
    has "administrator" (Tags) privilege below that we can see add new user panel.


    ![jpg](images/034-03.jpg)


    Clicking on **Add a User** panel to create new Users.


    ![jpg](images/035-01.jpg)


    Before moving ahead lets first have a look at tags. Tags in this part are as rights
    (privileges) which are assigned to users which are created. We can set single
    or multiple privileges to a user if we want multiple privileges then just set
    privileges as comma-separated (administrator, management)


    ## **Currently Supported by the Management Plugin**


    ### **Management**


    The user can access the management plugin.


    ### **Policymaker**


    The user can access the management plugin and manage policies and parameters for
    the vhosts they have access to.


    ### **Monitoring**


    The user can access the management plugin and see all connections and channels
    as well as node-related information.


    ### **Administrator**


    The user can do everything monitoring can do, manage users, vhosts, and permissions,
    close other user''s connections, and manage policies and parameters for all vhosts.


    ## **Creating Users**


    In this part we are going to create new user and we are going to set Username
    as **"demouser**" after that we are going to set password as **123456** after
    that we are going set privilege to this user as **"administrator"** (just click
    on Admin link it will set "**administrator"** in tags field) finally click on
    **Add user** to create new user.


    ![jpg](images/036-01.jpg)


    After adding a user, you can see all users in all user''s panel just expand it.
    After expanding you can see the new user **demouser** but in the grid, you can
    see *can access virtual hosts* columns where it has the value **No access** which
    means we do not have the privilege to virtual hosts.


    ![jpg](images/036-02.jpg)


    ## **Setting Privilege to Access Virtual Hosts**


    For setting permission just click on username which we have created **demouser.**


    ![jpg](images/036-03.jpg)


    After clicking on **demouser** go to permission panel which is just below overview
    panel.


    Just expand permission panel and click on set permission button to set permission
    to demouser.


    ![jpg](images/037-01.jpg)


    Once the permission is set, you''ll see the **Current permissions** as shown below.
    Now you should be able to log in as this **demouser** to the RabbitMQ Web Management
    Plugin.


    ![jpg](images/037-02.jpg)


    Let''s login into RabbitMQ Web Management Plugin with new user **demouser.**


    ![jpg](images/038-01.jpg)


    Following is the snapshot after logging into RabbitMQ Web Management Plugin with
    new user **demouser.**


    ![jpg](images/038-02.jpg)


    ![jpg](images/logo.jpg)


    # **RabbitMQ Virtual Hosts**


    ## **What are Virtual Hosts?**


    Virtual hosts are like a virtual box which contains a logical grouping of connections,
    exchanges, queues, bindings, user permissions, policies, and many more things.


    ![jpg](images/039-01.jpg)


    We can create different virtual host and each virtual host will have users.


    ## **Creating Virtual host**


    To create a new virtual host, we are first going to log in with default credentials
    and then we are going to choose admin tab.


    ![jpg](images/039-02.jpg)


    After choosing admin tab you will see vertical menus in right part of the page
    in that choose **Virtual Hosts.**


    ![jpg](images/040-01.jpg)


    After choosing **Virtual Hosts** you will see the default **Virtual Hosts** which
    is already present below that there is a panel **Add a new virtual host** just
    click on it to expand.


    ![jpg](images/040-02.jpg)


    After expanding we can see for adding virtual host we need to add Name parameter
    here, I am entering the name as **demohost** next click on **Add a new virtual
    host** button to create **demohost** virtual host.


    ![jpg](images/040-03.jpg)


    After adding a virtual host, we can see the newly added virtual host in **All
    virtual hosts** panel.


    ![jpg](images/040-04.jpg)


    Till now, we have created virtual host but we have not assigned any user to this
    virtual host, let''s create new User.


    ## **Creating Users**


    In this part we are going to create new user and we are going to set Username
    as **virtualuser** after that we are going to set password as *123456,* after
    that we are going set privilege to this user as **administrator** (just click
    on Admin link it will set **administrator** in tags field) finally click on **Add
    user** to create new user.


    ![jpg](images/041-01.jpg)'
