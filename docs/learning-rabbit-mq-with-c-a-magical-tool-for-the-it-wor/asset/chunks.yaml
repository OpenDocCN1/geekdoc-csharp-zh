    # **Using RabbitMQ Topic Message Exchanges with .Net Application**


    In this part, we are going to use Topic Message Exchanges and push messages into
    RabbitMQ using .Net Application and RabbitMQ.Client and read messages from RabbitMQ
    using .Net Application and RabbitMQ.Client in step by step way.


    ![jpg](images/076-01.jpg)


    ## **What is the Topic Exchange?**


    The topic exchange does a wildcard match between the routing key and the routing
    pattern specified in the binding.


    In topic exchange, the routing key must not be a simple text such as *Bombay*
    it must be words delimited by dots such as "*.bombay.*" or "#.bombay" or "Bombay.#".


    For example: I have two queues, one for Bombay and the other for Delhi then the
    user must send routing key which will match the pattern of routing key, then only
    that message will be added to queue, else message will be lost.


    ### **Note:**


    * (star) can substitute for exactly one word.


    # (hash) can substitute for zero or more words.


