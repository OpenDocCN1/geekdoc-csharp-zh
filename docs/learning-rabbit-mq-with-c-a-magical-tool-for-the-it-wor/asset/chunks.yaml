    In this part for creating a connection with the RabbitMQ server to create request,
    we need to add **RabbitMQ.Client** package from NuGet Package.


    Command to install: - **Install-Package RabbitMQ.Client -Version 5.1.0**


    ![jpg](images/090-01.jpg)


    After installing NuGet package of **RabbitMQ.Client** next we are going to create
    an exchange from web admin console.


    ## **Adding Fanout Exchange**


    Go to http://localhost:15672/#/exchanges, name exchange as fanout.exchange after
    entering name, we select Type as "fanout" and click on add exchange button to
    create.


    ![jpg](images/090-02.jpg)


    After adding **fanout.exchange** next we are going to Add 4 Queue and bind it
    to same exchange.


    ## **Adding Queue**


    In this part we are going to create 4 queues with different routing key but for
    same **fanout.exchange**.


    Go to http://localhost:15672/#/queues


    1\. Mumbai


    2\. Hyderabad


    3\. Bangalore


    4\. Chennai


    Adding the first queue with name **Mumbai.**


    ![jpg](images/091-01.jpg)


    In a similar way, I have added rest of queues as shown in the following snapshot.


    ![jpg](images/091-02.jpg)


    After adding all queues, we are going to bind queues with **fanout.exchange.**


    ### **Binding the Queues (Bangalore, Chennai, Hyderabad, Mumbai) with fanout.exchange**


    In this part, we are binding **fanout.exchange** with all queues (Bangalore, Chennai,
    Hyderabad, Mumbai).


    First queue that we are going to bind is Bangalore.


    ![jpg](images/091-03.jpg)


    ### **Snapshot of Binding**


    ![jpg](images/092-01.jpg)


    An example is for Bangalore queue, in a similar way we are going to do for all
