  trans: "\n\n首先，我们把 `Username`、`Password` 和 `HostName` 定义为常量。之后，我们创建了一个名为 `SendMessage`\
    \ 的方法，在该方法中，我们使用 `RabbitMQ.Client` 创建了到 RabbitMQ 服务器的连接。创建连接后，我们将凭据同 `HostName`\
    \ 传递给 `connectionFactory`。接下来，我们写了一条简单的消息 `Message is of fanout Exchange type`\
    \ 并将其转换为字节数组形式，最后，我们将所有这些值赋值给 `RabbitMQ.Client` 的 `BasicPublish` 方法。\n\n在赋值时，我们将交换机（exchange）设置为\
    \ `fanout.exchange`，并且 fanout 交换机不需要路由键（routing key）。\n\n### 代码片段\n\n```csharp\n\
    using System;\nusing RabbitMQ.Client;\nusing System.Text;\nnamespace RequestRabbitMQ\n\
    {\n    public class Fanoutmessages\n    {\n        private const string UserName\
    \ = \"guest\";\n        private const string Password = \"guest\";\n        private\
    \ const string HostName = \"localhost\";\n        public void SendMessage()\n\
    \        {\n            //RabbitMQ .NET AMQP 的主入口点\n            var connectionFactory\
    \ = new RabbitMQ.Client.ConnectionFactory()\n            {\n                UserName\
    \ = UserName,\n                Password = Password,\n                HostName\
    \ = HostName\n            };\n            var connection = connectionFactory.CreateConnection();\n\
    \            var model = connection.CreateModel();\n            var properties\
    \ = model.CreateBasicProperties();\n            properties.Persistent = false;\n\
    \            byte[] messagebuffer = Encoding.Default.GetBytes(\"Message is of\
    \ fanout Exchange type\");\n            model.BasicPublish(\"fanout.exchange\"\
    , \"\", properties, messagebuffer);\n            Console.WriteLine(\"Message Sent\
    \ From :- fanout.exchange \");\n            Console.WriteLine(\"Routing Key :-\
    \ Routing key is Not required for fanout exchange\");\n            Console.WriteLine(\"\
    Message Sent\");\n        }\n    }\n}\n```\n\n### 主代码片段\n\n```csharp\nusing System;\n\
    namespace RequestRabbitMQ\n{\n    class Program\n    {\n        static void Main(string[]\
    \ args)\n        {\n            Fanoutmessages fanoutmessages = new Fanoutmessages();\n\
    \            fanoutmessages.SendMessage();\n            Console.ReadLine();\n\
    \        }\n    }\n}\n```\n\n完成整个过程后，让我们保存并运行应用程序。运行程序后，你将在控制台窗口看到“Message sent”消息，这仅作为通知，意味着我们已成功向\
    \ \"fanout.exchange\" 交换机的所有队列发布了消息。\n\n### 发布到 \"fanout.exchange\" 所有队列的消息\n\n\
    ![jpg](img/094-01.jpg)\n\n### 现在让我们查看队列状态（Bangalore, Chennai, Hyderabad, Mumbai\
    \ 队列）\n\n如果你查看队列状态，你会看到 `Ready \"1\"`，这意味着我们已成功向 fanout 交换机的所有队列发布了消息。\n\n![jpg](img/094-02.jpg)\n\
    \n发布消息后，接下来创建一个 .Net 控制台应用程序来从队列中消费消息。\n\n### 创建 RabbitMQConsumer\n\n![jpg](img/094-03.jpg)\n\
    \n让我们创建另一个控制台应用程序来从队列消费消息。创建应用程序后，我们将添加 `RabbitMQ.Client` 包。\n\n### 添加 RabbitMQ.Client\
    \ NuGet 包\n\n在这一部分，为了创建与 RabbitMQ 服务器的连接以发送请求，我们需要从 NuGet 添加 `RabbitMQ.Client`\
    \ 包。安装命令为：`Install-Package RabbitMQ.Client -Version 5.1.0`\n\n![jpg](img/095-01.jpg)\n\
    \n安装 `RabbitMQ.Client` 后，接下来我们将添加一个名为 `MessageReceiver` 的类。\n\n### MessageReceiver\
    \ 类\n\n在这一部分，我们创建了 `MessageReceiver` 类，该类继承自来自 `RabbitMQ.Client` 的 `DefaultBasicConsumer`\
    \ 类。接下来我们必须重写 `HandleBasicDeliver` 方法，该方法接收消息体，接下来我们将如在控制台中看到的那样写出这些消息。\n\n```csharp\n\
    public class MessageReceiver : DefaultBasicConsumer\n{\n    private readonly IModel\
    \ _channel;\n    public MessageReceiver(IModel channel)\n    {\n        _channel\
    \ = channel;\n    }\n    public override void HandleBasicDeliver(string consumerTag,\
    \ ulong deliveryTag, bool redelivered, string exchange, string routingKey, IBasicProperties\
    \ properties, byte[] body)\n    {\n        Console.WriteLine($\"Consuming fanout\
    \ Message\");\n        Console.WriteLine(string.Concat(\"received from the exchange\
    \ \", exchange));\n        Console.WriteLine(string.Concat(\"Consumer tag:\",\
    \ consumerTag));\n        Console.WriteLine(string.Concat(\"Delivery tag:\", deliveryTag));\n\
    \        Console.WriteLine(string.Concat(\"Routing tag: \", routingKey));\n  \
    \      Console.WriteLine(string.Concat(\"Message: \", Encoding.UTF8.GetString(body)));\n\
    \        _channel.BasicAck(deliveryTag, false);\n    }\n}\n```\n\n理解 `MessageReceiver`\
    \ 类的代码片段后，接下来我们将在主方法中调用该类。\n\n### 消费 \"Mumbai\" 队列的主方法代码片段\n\n在主方法中，我们创建了 `connectionFactory`\
    \ 类并传递了凭据和 `Hostname`，之后我们创建了连接，接着创建了通道（channel）并将 `prefetchCount` 设置为 1，这样它就会告诉\
    \ RabbitMQ 不要一次向工作人员发送多一条消息。接下来创建了 `MessageReceiver` 类的实例并将 `IModel (channel)`\
    \ 传递给它。在最后一步，我们调用了 `BasicConsume` 方法并将队列名 \"Mumbai\" 传递给它，同时我们将 `autoAck` 设置为\
    \ false 并将 `messageReceiver` 实例传递给它。\n\n![jpg](img/096-01.jpg)\n\n```csharp\n\
    using System;\nusing RabbitMQ.Client;\nnamespace RabbitMQConsumer\n{\n    class\
    \ Program\n    {\n        private const string UserName = \"guest\";\n       \
    \ private const string Password = \"guest\";\n        private const string HostName\
    \ = \"localhost\";\n        static void Main(string[] args)\n        {\n     \
    \       ConnectionFactory connectionFactory = new ConnectionFactory()\n      \
    \      {\n                HostName = HostName,\n                UserName = UserName,\n\
    \                Password = Password\n            };\n            var connection\
    \ = connectionFactory.CreateConnection();\n            var channel = connection.CreateModel();\n\
    \            // 只接受一个未确认的消息\n            // uint prefetchSize, ushort prefetchCount,\
    \ bool\n            channel.Qos(0, 1, false);\n            // ==== prefetchCount\n\
    \            // 为了克服这一点，我们可以将 prefetch count 设置为 1\n            // 这告诉 RabbitMQ\
    \ 不要一次向工作人员发送多一条消息。\n            // 或者换句话说，在工作人员处理并确认之前的消息之前，不要向其分发新消息。\n    \
    \        // 相反，它将分发给\n            // 下一个不忙的工作人员。\n            MessageReceiver\
    \ messageReceiver = new MessageReceiver(channel);\n            channel.BasicConsume(\"\
    Mumbai\", false, messageReceiver);\n            Console.ReadLine();\n        }\n\
    \    }\n}\n```\n\n现在我们拥有了完整的工作机制。让我们从 `RequestRabbitMQ` 控制台创建请求并在 `RabbitMQConsumer`\
    \ 应用程序消费消息。\n\n### 队列有一个我们发布的请求\n\n下面的快照显示所有队列都有一个通过 fanout 交换机发布的消息。\n\n![jpg](img/098-01.jpg)\n\
    \n### 从 Mumbai 队列消费的消息\n\n此消息仅从 Mumbai 队列消费，其他队列直到为止尚未被读取。\n\n![jpg](img/098-02.jpg)\n\
    \n### 从 Mumbai 队列读取消息后的队列状态\n\n![jpg](img/098-03.jpg)\n\n以类似的方式，如果我们从 Bangalore\
    \ 队列读取消息，那么只需要在 `RabbitMQConsumer` 中更改“队列名”。\n\n### 从 Bangalore 队列消费的消息\n\n"
