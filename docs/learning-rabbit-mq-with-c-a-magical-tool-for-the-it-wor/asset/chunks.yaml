    # **Using RabbitMQ Fanout Message Exchanges with .Net Application**


    In this part, we are going to use Fanout Message Exchanges and push messages into
    RabbitMQ using .Net Application and RabbitMQ.Client and read messages from RabbitMQ
    using .Net Application and RabbitMQ.Client in step by step way.


    ![jpg](images/089-01.jpg)


    ## **What is a Fanout Exchange?**


    A fanout exchange routes messages to all of the queues that are bound to it.


    This exchange is used when you want to publish a common message to all queue which
    is connected to the particular exchange and in fanout exchange **routing key**
    is ignored.


    For example, if a company has updated some guidelines and you want to push the
    guideline to all branches, at that time you can use fanout exchange. Creating
    RequestRabbitMQ Application


    Let''s Create a simple console application with **RequestRabbitMQ.**


    ![jpg](images/089-02.jpg)


    After creating application, we are going to add **RabbitMQ.Client** NuGet package.


