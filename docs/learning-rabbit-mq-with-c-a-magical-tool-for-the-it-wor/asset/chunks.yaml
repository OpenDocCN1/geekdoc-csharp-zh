  raw: 'RabbitMQ is an open source and cross-platform message broker which Implements
    AMQP protocol and is lightweight and easy to deploy on-premises or in the cloud.
    It is built on Erlang which is also used by WhatsApp for messaging. RabbitMQ provides
    a way to exchange data between applications such as a message sent a Node.js application,
    or Java application can read the from.Net application.


    In a fast-paced world where the applications need to provide fast responses to
    the end user, we develop Bussiness Web applications in the form of portals and
    also use same to send Emails, Messages, Notifications to ends Users slowing down
    the performance of the application. Using Rabbitmq, we can remove this burden
    from the Portal by using Exchanges and Queues for handling Messages and Notifications.


    RabbitMQ is a Magical Tool for the IT world.


    # **Acknowledgements**


    I''d like to thank the following people:


    To my parents for supporting and encouraging me.


    To Manish Jain for providing me with the opportunity to write this book.


    To Shivprasad Koirala and Sukesh Marla for supporting and encouraging me to write
    this book.


    And to all the other people who played a role in getting this book ready. Thanks
    for your hard work!


    # **RabbitMQ Introduction**


    ## **What is RabbitMQ?**


    RabbitMQ is an AMQP message broker, it is the most popular open source and cross-platform
    message broker.


    It is built on Erlang which is also used by WhatsApp for messaging.


    RabbitMQ is also a way to exchange data between applications such as a message
    sent from .Net application can be read by a Node.js application or Java application.


    RabbitMQ is lightweight and easy to deploy on premises and in the cloud. It supports
    multiple messaging protocols. RabbitMQ can be deployed in distributed and federated
    configurations to meet high-scale, high-availability requirements.


    ![jpg](images/011-01.jpg)


    ## **Why and when should we use RabbitMQ?**


    We should use RabbitMQ because it is open source and easy to use with many languages
    such as .Net, Java, Python, Ruby, Node Js.


    We can use RabbitMQ to remove some heavy work from our web application such as
    sending Reports in Emails, in Excel or Pdf format''s or sending email, SMS or
    another task such as a trigger to some other applications to start processing.


    Nowadays most people do all this task into single application sending emails or
    SMS, reports which bit heavy task which is also handled by IIS if you separate
    this task then IIS will get more space (memory) to serve more request.


    After understanding a bit about RabbitMQ next we are going to Install Erlang and
    RabbitMQ on Windows.


    ## **What is AMQP?**


    The **Advanced Message Queuing Protocol** (**AMQP**) is an open standard application
    layer protocol for message-oriented, the defining features of AMQP are message
    orientation, queuing, routing (including point-to-point and publish-and-subscribe),
    reliability and security.


    It was developed by JPMorgan and iMatix Corporation.


    ### **Key Features**


    AMQP was designed with the following main characteristics as goals:


    • Security


    • Reliability


    • Interoperability


    • Standard


    • Open


    ### **Various Client Libraries**


    RabbitMQ support various number of operating systems and various language and
    it has various clients for different languages such as:


    1\. .Net


    2\. Java


    3\. Spring Framework


    4\. Ruby


    5\. Python


    6\. PHP


    7\. Objective-C and Swift


    8\. JavaScript


    9\. GO


    10\. Perl


    ![jpg](images/logo.jpg)


    # **RabbitMQ Setup**


    In this part, we are going to learn how to setup RabbitMQ step by step:


    1\. What is Erlang


    2\. Downloading Erlang


    3\. Installing Erlang


    4\. Downloading RabbitMQ


    5\. Installing RabbitMQ


    6\. Starting RabbitMQ Server


    7\. Enabling web management plugin


    8\. Web Management plugin


    9\. Conclusion


    ## **What is Erlang**


    Erlang is a general-purpose programming language and runtime environment.


    Erlang has built-in support for concurrency, distribution, and fault tolerance.


    Erlang is used in several large telecommunication systems from Ericsson.


    Referred from: Referred from: [http://erlang.org/faq/introduction.html](http://erlang.org/faq/introduction.html)


    ### **Link to download Erlang**


    [http://www.erlang.org/downloads](http://www.erlang.org/downloads)


    ![jpg](images/013-01.jpg)


    After downloading Erlang now, we are going to install Erlang.


    ![jpg](images/logo.jpg)


    # **Installing Erlang**


    In this part, just click on Erlang setup which you have downloaded to install.


    ![jpg](images/014-01.jpg)


    After downloading Erlang setup, just install it, after installing we are going
    to download RabbitMQ.


    ## **Downloading RabbitMQ**


    First, we are going to download RabbitMQ setup for windows from link:


    [https://www.rabbitmq.com/download.html](https://www.rabbitmq.com/download.html)


    ![jpg](images/014-02.jpg)


    After downloading RabbitMQ, now we are going to Install RabbitMQ.


    ## **Installing RabbitMQ**


    In this part just click on RabbitMQ setup which you have downloaded to install.


    ![jpg](images/015-01.jpg)


    After installing Rabbit MQ, search RabbitMQ command prompt and open it with admin
    privilege.


    ## **Starting RabbitMQ Server**


    In this part we are going to open **RabbitMQ Command Prompt** with admin privileges
    for checking status of RabbitMQ server.


    ![jpg](images/015-02.jpg)


    After opening command prompt, enter command **"rabbitmqctl status"** for checking
    status of RabbitMQ server. If it shows you an error as below snapshot then you
    need to follow some step given as follows:.


    ![jpg](images/016-01.jpg)


    **Steps, if you get Error (Authentication failed (rejected by the remote node),
    check the Erlang cookie)**


    1\. In File Explorer, navigate to your user directory. (Paste %userprofile% in
    the address bar)


    2\. If you already have the file .erlang.cookie in there, delete it. If not, just
    go to the next step.


    3\. In a second File Explorer, navigate to C:\Windows\System32\config\system profile.


    4\. Find the file .erlang.cookie and copy it to your user directory.


    5\. Now your rabbitmqctl should be able to authenticate.


    ### **Links for solution**


    • [https://stackoverflow.com/questions/47893899/authentication-failed-rejected-by-the-remote-node-please-check-the-erlang-coo?rq=1](https://stackoverflow.com/questions/47893899/authentication-failed-rejected-by-the-remote-node-please-check-the-erlang-coo?rq=1)


    • [https://stackoverflow.com/questions/28258392/rabbitmq-has-nodedown-error](https://stackoverflow.com/questions/28258392/rabbitmq-has-nodedown-error)


    After you completed steps, again if you are running the same command **"rabbitmqctl
    status"** then the following screen should appear.


    ![jpg](images/017-01.jpg)


    Now we have started server, next we are going to enable web management plugin
    of RabbitMQ.


    ### **Enabling web management plugin**


    For enabling web management plugin, you need to start RabbitMQ command prompt
    with administrator privilege and enter the command **rabbitmq-plugins enable rabbitmq_management**.


    After executing this command, you will see following plugins will be enabled.


    ![jpg](images/017-02.jpg)


    This screen is same but I have already enabled plugin that''s why it is showing
    different messages


    ![jpg](images/017-03.jpg)


    Now you can open web management plugin in the browser.


    ### **Web Management plugin**


    Now to use web management plugin, enter localhost URL in browser http://localhost:15672/.


    After entering localhost URL in browser, it will ask for credentials for accessing
    web management plugin.


    The default **Username** and **Password** of management plugin is **guest** (Username:
    "guest" | Password: "guest").


    ![jpg](images/018-01.jpg)


    After login with default credentials, below overview screen will appear.


    ![jpg](images/018-02.jpg)'
