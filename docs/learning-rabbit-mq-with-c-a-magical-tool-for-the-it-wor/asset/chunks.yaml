    # RabbitMQ Users


    In this part, we are going to learn how to create a new User and give permission
    to New User.


    For creating a New user, we need to login into Web Management Plugin using default
    credentials.


    ![jpg](images/034-01.jpg)


    After logging into the application, we are going to choose `Admin` tab.


    ![jpg](images/034-02.jpg)


