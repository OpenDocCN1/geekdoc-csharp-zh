    # **Using RabbitMQ Direct Message Exchanges with .Net Application**


    In this part, we are going to use Direct Message Exchanges and push messages into
    RabbitMQ using .Net Application and RabbitMQ.Client and read messages from RabbitMQ
    using .Net Application and RabbitMQ.Client in step by step way.


    ![jpg](images/066-01.jpg)


    ## **Types of Exchanges**


    1\. Direct


    2\. fanout


    3\. Headers


    4\. Topic


    ### **Details of Exchanges**


    1\. **Direct:** A direct exchange delivers messages to queues based on a message
    routing key.


    In a direct exchange, the message is routed to the queues whose binding key exactly
    matches the routing key of the message.


    2\. **Fanout:** A fanout exchange routes messages to all of the queues that are
    bound to it.


    3\. **Topic:** The topic exchange does a wildcard match between the routing key
    and the routing pattern specified in the binding.


    4\. **Headers:** Headers exchanges use the message header attributes for routing.


    ## **Creating RequestRabbitMQ Application**


    Let''s Create a simple console application with the name **RequestRabbitMQ.**


    ![jpg](images/067-01.jpg)


    After creating application next we are going to add **RabbitMQ.Client** NuGet
    package.


    ## **Adding RabbitMQ.Client NuGet Package**


    In this part for creating a connection with RabbitMQ server to create request,
    we need to add **RabbitMQ.Client** package from NuGet Package. Command to install:
    - Install-Package *RabbitMQ.Client -Version 5.1.0*


    ![jpg](images/067-02.jpg)


    After installing NuGet package of **RabbitMQ.Client** next we are going to create
    an exchange from web admin console.


    ## **Adding Direct Exchange**


    Go to http://localhost:15672/#/exchanges, name exchange as request.exchange after
    entering name , we select Type as direct and click on Add exchange button to create.


    ![jpg](images/067-03.jpg)


    After adding exchange **(request.exchange)** next we are going to add Queue (request
    Queue).


    ## **Adding Queue**


    Go to http://localhost:15672/#/queues, add queue: request.queue.


    ![jpg](images/068-01.jpg)


    After adding queue next we are going to bind queue with exchange.


    ## **Binding the request.queue with request.exchange**


    In binding, we are going to enter the name of exchange **request.exchange** and
    we are going to enter routing key as **directexchange_key.**


    ![jpg](images/068-02.jpg)


    Now let''s Create Push Message to **request.queue** from a console application.


    ## **Adding a Directmessages Class**


    We have created a **Directmessage** class in this class we are going to create
    request and push to RabbitMQ.


    First, we have declared Username, Password, and HostName as constant. After that,
    we have created a method with name **SendMessage** in that message we have created
    a connection to RabbitMQ server using RabbitMQ.Client after creating connection
    next we have passed credentials along with HostName to connectionFactory. Next,
    we have written a simple message **Direct Message** and got it in bytes array
    form, finally, we are going to assign all these values to a BasicPublish method
    of **RabbitMQ.Client**


