    有关所有标签页的详细信息，您可以访问：[`www.cloudamqp.com/blog/2015-05-27-part3-rabbitmq-for-beginners_the-management-interface.html#overview`](https://www.cloudamqp.com/blog/2015-05-27-part3-rabbitmq-for-beginners_the-management-interface.html#overview)


    ![jpg](img/logo.jpg)


    # RabbitMQ 交换机 (Exchanges)


    ## 什么是交换机？


    当生产者创建消息时，消息不会直接发送到队列，而是发送到交换机，随后路由代理根据头属性、绑定和路由键读取并发送到适当的队列。共有四种交换机以不同的方式路由消息，此外，还可以设置各种参数，如
    `Type`（类型）、`Durability`（持久性）、`Auto-delete`（自动删除）和 `Internal`（内部）。


    ### 直接交换机 (Direct Exchange)


    **Direct：** 直接交换机根据消息路由键将消息传递到队列。在直接交换机中，消息被路由到绑定键与消息路由键完全匹配的队列。


    ![jpg](img/019-01.jpg)


    ### 广播交换机 (Fanout Exchange)


    **Fanout：** 广播交换机将消息路由到所有绑定到它的队列。


    ![jpg](img/019-02.jpg)


    ### 主题交换机 (Topic Exchange)


    **Topic：** 主题交换机在路由键和绑定中指定的路由模式之间进行通配配符匹配。


    ![jpg](img/020-01.jpg)


    ### 头部交换机 (Headers Exchange)


    **Headers：** 头部交换机使用消息头属性进行路由。


    ![jpg](img/020-02.jpg)


    ### 属性详情


    ### 名称 (Name)


    名称将是您设置的交换机名称，它必须是唯一的。


    ### 类型 (Type)


    **Direct：** 直接交换机根据消息路由键将消息传递到队列。在直接交换机中，消息被路由到绑定键与消息路由键完全匹配的队列。


    **Fanout：** 广播交换机将消息路由到所有绑定到它的队列。


    **Topic：** 主题交换机在路由键和绑定中指定的路由模式之间进行通配符匹配。


    **Headers：** 头部交换机使用消息头属性进行路由。


    ### 持久性 (Durability)


    持久性是交换机的一个属性，告知消息是否可以在服务器重启后（代理重启）。


    有两种持久性选项：


    1. 持久 (Durable)

    2. 瞬态 (Transient / 非持久)


    1. **Durable：** 如果您将交换机标记为持久，则它将在服务器重启后依然存在。

    2. **Transient：** 如果您将交换机标记为瞬态，则它将在服务器重启后丢失。


    ![jpg](img/021-01.jpg)


    ### 自动删除 (Auto delete)


    ![jpg](img/021-02.jpg)


    自动删除有两个选项：


    1. 是

    2. 否


    如果是，在至少有一个队列或交换机绑定到该交换机且所有队列或交换机都解绑后，该交换机将删除自己。例如：在此部分中，如果您创建一个交换机并将其绑定到队列，当您解绑队列时，它也会删除该交换机。


    ### 内部 (Internal)


    如果设置，交换机可能无法被发布者直接使用，只有在绑定到其他交换机时可以使用。内部交换机用于构建应用程序不可见的接线。


    ![jpg](img/022-01.jpg)


    ### 备用交换机 (Alternate-exchange)


    如果在向交换机发布消息时出现问题，您可以指定备用交换机，它会将消息发送到另一个队列。


    ![jpg](img/022-02.jpg)


    ## 添加交换机


    要添加交换机，我们首先将使用默认凭据登录，然后选择 Exchanges（交换机）标签页。


    ![jpg](img/023-01.jpg)


    选择标签页后，您将看到“Add a new exchange panel（添加新交换机面板）”，点击该面板即可展开。展开后会要求输入交换机名称，为了演示，我们将交换机命名为
    `demoexchange`，并在类型中选择 *"direct"，然后点击添加按钮进行创建。


    ![jpg](img/023-02.jpg)


    输入所有详情后，我们将点击 **Add exchange**（添加交换机）按钮来创建交换机。


    ## 添加交换机后的快


    ![jpg](img/024-01.jpg)


    以类似的方式，我们可以添加不同类型的交换机。


    ![jpg](img/logo.jpg)


    # RabbitMQ 队列 (Queues)


    ## 什么是队列？


    队列是一个存储从交换机发送到队列的消息的缓冲区。


    ![jpg](img/025-01.jpg)


    ## 队列参数详情


    ### 名称 (Name)


    队列的名称，我们可以在应用程序中引用。名称必须是唯一的，且不能是系统定义的队列名称。


    ### 持久性 (Durability)


    持久性是队列的一个属性，告知消息是否可以在服务器重启后（代理重启）。


    有两种持久性选项：


    1. 持久 (Durable)

    2. 瞬态 (Transient / 非持久)


    1. **Durable：** 如果您将队列标记为持久，则它将在服务器重启后依然存在。

    2. **Transient：** 如果您将交换标记为瞬态，则它将在服务器重启后丢失。（注：此处原文误为 exchange，应为 queue）


    ![jpg](img/025-02.jpg)


    ### 自动删除 (Auto delete)


    自动删除有两个选项：


    1. 是

    2. 否


    如果是，在至少有一个队列或交换机绑定到该交换机且所有队列或交换机都解绑后，该交换机将删除自己。例如：在此部分中，如果您创建一个交换机并将其绑定到队列，当您解绑队列时，它也会删除该交换机。


    ### 参数 (Arguments)


    参数（可选；用于插件和特定功能，如消息 TTL、队列长度等）


    ### 生存时间 (Time-to-live)


    在此部分中，您可以为队列设置过期时间，达到时间后将丢弃。


    时间为毫秒。


    ![jpg](img/026-01.jpg)


    ### 自动过期 (Auto expire)


    在此部分中，您可以通过设置此属性为队列设置过期。


    这控制队列未使用多久后自动删除。


    未使用意味着队列没有消费者、队列未被重新声明，且至少没有调用过 `basic.get`。


    ![jpg](img/027-01.jpg)


    ### 最大长度 (Max Length)


    队列在开始丢弃头部之前可以包含的（就绪）消息数量。


    通过在队列声明参数中提供非负值 `x-max-length` 设置消息数量。


    ![jpg](img/027-02.jpg)


    例如，如果您设置 `x-max-length = 2` 且向队列发布了三条消息，则队列将保留两条，最旧的删除。


    ![jpg](img/027-03.jpg)


    ### 最大长度字节 (Max Length Bytes)


    队列在开始丢弃头部之前可以包含的就绪消息的总大小。


    通过在队列声明参数中提供非负整数值 `x-max-length-bytes` 设置最大字节数。


    （设置 `x-max-length-bytes` 参数。） *1000000 bytes = 1MB*


    例如，如果您设置 `x-max-length-bytes = 1000000` 并向队列发布消息导致队列大小超过 1 MB，则最旧的消息删除（从头部丢弃）。


    ![jpg](img/028-01.jpg)


    ### 溢出行为 (Overflow Behaviour)


    设置队列溢出行为。这决定了当达到最大长度时会发生什么。有效值为 `drop-head`（丢头部）或 `reject-publish`（拒绝发布）。


    ![jpg](img/028-02.jpg)


    ### 死信交换机 (Dead Letter Exchange)


    当消息被拒绝或过期时，将重新发布到的可选交换机名称。


    ![jpg](img/029-01.jpg)


    ### 死信路由键 (Dead Letter Routing Key)


    当消息进入死信时使用的可选替换路由键。如果没有设置，将使用消息的原始路由键。


    '
- fmt: '

    For example, if you publish a message to an exchange with routing key `foo`, and
    that message is dead-lettered, it will be published to its dead letter exchange
    with routing key `foo`. If the queue the message originally landed on had been
    declared with `x-dead-letter-routing-key` set to `bar`, then the message will
    be published to its dead letter exchange with routing key `bar`.


    ![jpg](images/029-02.jpg)


    ### Maximum Priority


    A maximum number of priority levels for the queue to support; if not set, the
    queue will not support message priorities.


    (Sets the `x-max-priority` argument.)


    To declare a priority queue, use the `x-max-priority` optional queue argument.
    This argument should be a positive integer between 1 and 255, indicating the maximum
    priority the queue should support .


    ![jpg](images/030-01.jpg)


    ### Lazy Mode


    Set the queue into the lazy mode, keeping as many messages as possible on disk
    to reduce RAM usage; if not set, the queue will keep an in-memory cache to deliver
    messages as fast as possible.


    (Sets the `x-queue-mode` argument.)


    ![jpg](images/030-02.jpg)


    ### Master Locator


    Set the queue into master location mode, determining the rule by which the queue
    master is located when declared on a cluster of nodes.


    (Sets the `x-queue-master-locator` argument.)


