    \n## 添加 Fanout 交换机\n\n访问 http://localhost:15672/#/exchanges，输入名称后将交换机命名为 `headers.exchange`，选择类型为\
    \ \"headers\" 并点击 add exchange 按钮创建。\n\n![jpg](img/102-02.jpg)\n\n添加 \"headers.exchange\"\
    \ 后，我们将添加两个队列并绑定到同一个交换机。\n\n### 添加队列\n\n在这一部分，我们将创建两个具有不同路由键但属于同一个 \"headers.exchange\"\
