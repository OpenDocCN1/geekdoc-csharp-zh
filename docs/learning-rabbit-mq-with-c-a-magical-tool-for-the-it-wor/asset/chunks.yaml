    \ we have created `MessageReceiver` class and this class inherits `DefaultBasicConsumer`\
    \ class which is from `RabbitMQ.Client` next we have to override `HandleBasicDeliver`\
    \ method, this method receives message body next, we are going to write these\
    \ messages as we can see in its console.\n\n```c\nusing System;\nusing System.Text;\n\
    using RabbitMQ.Client;\nnamespace RabbitMQConsumer\n{\npublic class MessageReceiver\
    \ : DefaultBasicConsumer\n{\n    private readonly IModel channel;\n    public\
    \ MessageReceiver(IModel channel)\n    {\n    channel = channel;\n    }\n    public\
    \ override void HandleBasicDeliver(string\n    consumerTag, ulong deliveryTag,\
    \ bool\n    redelivered, string exchange, string routingKey,\n    IBasicProperties\
    \ properties, byte[] body)\n    {\n      Console.WriteLine($\"Consuming Headers\
    \ Message\");\n      Console.WriteLine(string.Concat(\"Message received\nfrom\
