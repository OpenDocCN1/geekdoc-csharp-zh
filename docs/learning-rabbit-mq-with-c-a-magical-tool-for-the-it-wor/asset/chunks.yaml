  trans: "\n\n## MessageReceiver 类代码片段\n\n在此部分中，我们创建了 `MessageReceiver` 类，该类继承自来自\
    \ `RabbitMQ.Client` 的 `DefaultBasicConsumer` 类。接下来我们需要重写 `HandleBasicDeliver`\
    \ 方法，该方法负责接收消息体，随后我们将像控制台中看到的那样写入这些消息。\n\n```csharp\nusing System;\nusing System.Text;\n\
    using RabbitMQ.Client;\nnamespace RabbitMQConsumer\n{\n    public class MessageReceiver\
    \ : DefaultBasicConsumer\n    {\n        private readonly IModel _channel;\n \
    \       public MessageReceiver(IModel channel)\n        {\n            _channel\
    \ = channel;\n        }\n        public override void HandleBasicDeliver(string\
    \ consumerTag, ulong deliveryTag, bool redelivered, string exchange, IBasicProperties\
    \ properties, byte[] body)\n        {\n            Console.WriteLine($\"Consuming\
    \ Message\");\n            Console.WriteLine($\"Message received from the exchange\
    \ {exchange}\");\n            Console.WriteLine($\"Consumer tag:{consumerTag}\"\
    );\n            Console.WriteLine($\"Delivery tag:{deliveryTag}\");\n        \
    \    Console.WriteLine($\"Routing tag: {properties.RoutingKey}\");\n         \
    \   Console.WriteLine($\"Message: {Encoding.UTF8.GetString(body)}\");\n      \
    \      _channel.BasicAck(deliveryTag, false);\n        }\n    }\n}\n```\n\n理解\
    \ `MessageReceiver` 类的代码片段后，接下来我们将在 main 方法中调用该类。\n\n### Main 方法代码片段\n\n在 main\
    \ 方法中，我们创建了 `ConnectionFactory` 类并传递了凭据和 `Hostname`。之后创建了连接，接着创建了通道并将 `prefetchCount`\
    \ 设置为 `1`，这告诉 RabbitMQ 不要一次向工作者发送多条消息。接下来，我们创建了 `MessageReceiver` 实例并将 `IModel`\
    \ (`channel`) 传递给它。最后一步，我们调用了 `BasicConsume` 方法并将队列名称 `demoqueue` 传递给它，同时将 `autoAck`\
    \ 设置为 `false` 并传递了 `messageReceiver` 实例。\n\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
    using System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\nusing RabbitMQ.Client;\n\
    namespace RabbitMQConsumer\n{\n    class Program\n    {\n        private const\
    \ string UserName = \"guest\";\n        private const string Password = \"guest\"\
    ;\n        private const string HostName = \"localhost\";\n        static void\
    \ Main(string[] args)\n        {\n            ConnectionFactory connectionFactory\
    \ = new ConnectionFactory()\n            {\n                HostName = HostName,\n\
    \                UserName = UserName,\n                Password = Password,\n\
    \            };\n            var connection = connectionFactory.CreateConnection();\n\
    \            var channel = connection.CreateModel();\n            // accept only\
    \ one unack message at a time\n            // uint prefetchSize, ushort prefetchCount,\
    \ bool\n            channel.BasicQos(0, 1, false);\n            MessageReceiver\
    \ messageReceiver = new MessageReceiver(channel);\n            channel.BasicConsume(\"\
    demoqueue\", false, messageReceiver);\n            Console.ReadLine();\n     \
    \   }\n    }\n}\n```\n\n**注意：** `prefetchCount`\n\n我们将计数设置为 `1`。这告诉 RabbitMQ 不要一次向工作者发送多于一条消息。换句话说，在工作者处理并确认之前的消息之前，不要分发新消息。相反，它会将消息发送给下一个空闲的工作者。\n\
    \n现在我们已经完成了工作机制。让我们从 `RequestRabbitMQ` 控制台创建请求并在 `RabbitMQConsumer` 中消费消息。\n\n\
    ## 队列为空\n\n![images/065-01.jpg)\n\n在我们看到队列 `demoqueue` 是空的之后，我们将向 `demoqueue`\
    \ 发布消息。\n\n### 发布消息\n\n![images/065-02.jpg)\n\n发布消息后，让我们查看 `demoqueue` 队列。\n\n\
    ## 发送消息后的队列\n\n![images/065-03.jpg)\n\n向 `demoqueue` 推送消息后，控制台应用程序将开始消费，如下：\n\n\
    ### 从 demoqueue 消费的消息\n\n![images/065-04.jpg)\n\n最后，我们完成了从 RabbitMQ 队列的消息消费。\n\
    \n![images/logo.jpg)\n\n# 使用 .Net 使用 RabbitMQ Direct 交换器\n\n在此部分，我们将使用 Direct\
    \ 交换器，通过 .Net 应用程序和 `RabbitMQ.Client` 向 RabbitMQ 推送消息，并使用 .Net 应用程序和 `RabbitMQ.Client`\
    \ 读取消息。\n\n![images/066-01.jpg)\n\n## 交换器类型\n\n1. Direct（直接型）\n2. fanout（广播型）\n\
    3. Headers（头部型）\n4. Topic（主题型）\n\n### 交换器详情\n\n1. **Direct**: Direct 交换器根据路由键传递消息。在\
    \ Direct 交换器中，消息被路由到键完全匹配的队列。\n2. **Fanout**: Fanout 交换器将消息路由到所有绑定的队列。\n3. **Topic**:\
    \ Topic 交换器在路由键和模式之间进行通配匹配。\n4. **Headers**: Headers 交换器使用头部属性进行路由。\n\n## 创建 RequestRabbitMQ\n\
    \n让我们创建应用程序 `RequestRabbitMQ`。\n\n![images/067-01.jpg)\n\n## 添加 RabbitMQ.Client\
    \ 包\n\n在此部分我们需要添加 `RabbitMQ.Client` NuGet 包。\n\n![images/067-02.jpg)\n\n## 添加\
    \ Direct 交换\n\n命令：`Install-Package RabbitMQ.Client -Version 5.1`\n\n![images/067-03.jpg)\n\
    \n安装包后，访问 `http://localhost:15672/#exchanges`，命名为 `request.exchange`，输入名称后选择类型为\
    \ `direct` 并点击 Add 按钮进行创建。\n\n## 添加队列\n\n添加交换器 `request.exchange` 后，接下来我们需要添加队列\
    \ (`request.queue`)。\n\n![images/068-01.jpg)\n\n访问 `http://localhost:15672/#queues`，添加队列：`request.queue`。\n\
    \n## 将 request.queue 绑定到交换器\n\n添加队列后，我们将队列与交换器绑定。\n\n在绑定中，我们将输入交换器名称 `request.exchange`\
    \ 并输入路由键为 `direct_key`。\n\n![images/068-02.jpg)\n\n我们创建了一个 `Directmessage` 类，在此类中我们将创建请求并推送到\
    \ RabbitMQ。\n\n首先，我们把 `Username`、`Password` 和 `HostName` 定义为常量。之后，我们创建了一个名为 `SendMessage`\
    \ 的方法，在该方法中使用通过 `RabbitMQ.Client` 创建了到 RabbitMQ 服务器的连接。创建连接后，我们将凭据连同 `Hostname`\
    \ 传递给 `connectionFactory`。接着，我们写了一条简单的消息 `Direct Message` 并以字节数组形式获取，最后，我们将所有这些值赋值给\
    \ `RabbitMQ.Client` 的 `BasicPublish` 方法。\n\n### BasicPublish \n\n![images/069-01.jpg)\n\
    \n### 传递给它的参数\n\nExchange: `request.exchange`\nRoutingkey: `direct_key`\n\n"
