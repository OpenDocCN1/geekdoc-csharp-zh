    \n当你想要向队列发送消息时使用这种交换机，但这次它不依赖于路由键（routing key），而是根据头属性发送到队列。\n\n## 创建 RequestRabbitMQ\
    \ \n\n让我们创建一个名为 \"RequestRabbitMQ\" 的简单控制台应用程序。\n\n![jpg](img/101-02.jpg)\n\n\
