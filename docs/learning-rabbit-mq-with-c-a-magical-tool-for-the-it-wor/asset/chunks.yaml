- fmt: "\n## Code snippet of MessageReceiver class\n\nIn this part, we have created\
    \ `MessageReceiver` class and this class inherits `DefaultBasicConsumer` class\
    \ which is from `RabbitMQ.Client`. next we have to override `HandleBasicDeliver`\
    \ method, this method receives message body next, we are going to write these\
    \ messages as we can see in its console.\n\n```csharp\nusing System;\nusing System.Text;\n\
    using RabbitMQ.Client;\nnamespace RabbitMQConsumer\n{\n    public class MessageReceiver\
    \ : DefaultBasicConsumer\n    {\n        private readonly IModel _channel;\n \
    \       public MessageReceiver(IModel channel)\n        {\n            _channel\
    \ = channel;\n        }\n        public override void HandleBasicDeliver(string\
    \ consumerTag, ulong deliveryTag, bool redelivered, string exchange, string routingKey,\
    \ IBasicProperties properties, byte[] body)\n        {\n            Console.WriteLine($\"\
    Consuming Message\");\n            Console.WriteLine(string.Concat(\"Message received\
    \ from the exchange \", exchange));\n            Console.WriteLine(string.Concat(\"\
    Consumer tag:\", consumerTag));\n            Console.WriteLine(string.Concat(\"\
    Delivery tag:\", deliveryTag));\n            Console.WriteLine(string.Concat(\"\
    Routing tag: \", routingKey)); own            Console.WriteLine(string.Concat(\"\
    Message: \", Encoding.UTF8.GetString(body)));\n            _channel.BasicAck(deliveryTag,\
    \ false);\n        }\n    }\n}\n```\n\nAfter completing with understanding code\
    \ snippet of `MessageReceiver` class next we are going to call this class in the\
    \ main method.\n\n### Code snippet of Main Method\n\nIn the main method we have\
    \ created `ConnectionFactory` class and passed credentials and `Hostname` after\
    \ that we have created connection, next we have created channel and set `prefetchCount`\
    \ to 1 such that it tells RabbitMQ not to give more than one message to a worker\
    \ at a time. Next, we have created instance of `MessageReceiver` class and passed\
    \ `IModel` (`channel`) to it, in final step we have called `BasicConsume` method\
    \ and passed queue name to it `demoqueue` along with this we have set `autoAck`\
    \ to false and passed the `messageReceiver` instance to it.\n\n```csharp\nusing\
    \ System;\nusing System.Collections.Generic;\nusing System.Linq; using System.Text;\n\
    using System.Threading.Tasks;\nusing RabbitMQ.Client;\nnamespace RabbitMQConsumer\n\
    {\n    class Program\n    {\n        private const string UserName = \"guest\"\
    ;\n        private const string Password = \"guest\";\n        private const string\
    \ HostName = \"localhost\";\n        static void Main(string[] args)\n       \
    \ {\n            ConnectionFactory connectionFactory = new ConnectionFactory()\n\
    \            {\n                HostName = HostName,\n                UserName\
    \ = UserName,\n                Password = Password,\n            };\n        \
    \    var connection = connectionFactory.CreateConnection();\n            var channel\
    \ = connection.CreateModel();\n            // accept only one unack-ed message\
    \ at a time\n            // uint prefetchSize, ushort prefetchCount, bool\n  \
    \          channel.BasicQos(0, 1, false);\n            MessageReceiver messageReceiver\
    \ = new MessageReceiver(channel);\n            channel.BasicConsume(\"demoqueue\"\
    , false, messageReceiver);\n            Console.ReadLine();\n        }\n    }\n\
    }\n```\n\n**Note:** `prefetchCount`\n\nIn order to defeat that we can set the\
    \ `prefetch count` with the value of 1. This tells RabbitMQ not to give more than\
    \ one message to a worker at a time. Or, in other words, don't dispatch a new\
    \ message to a worker until it has processed and acknowledged the previous one.\
    \ Instead, it will dispatch it to the next worker that is not still busy.\n\n\
    Now we have complete working mechanism. Let's create request from `RequestRabbitMQ`\
    \ console and consume a message from `RabbitMQConsumer` application.\n\n## Queue\
    \ is Empty\n\n![jpg](images/065-01.jpg)\n\nAfter we saw that queue (`demoqueue`)\
    \ is empty, we are going to publish message to `demoqueue`.\n\n### Publishing\
    \ Message\n\n![jpg](images/065-02.jpg)\n\nAfter we have published message now\
    \ let's have a view on (queue) `demoqueue`.\n\n## Queue after Publishing Message\n\
    \n![jpg](images/065-03.jpg)\n\nAfter we have push message to (queue) `demoqueue`\
    \ the console application will start consuming it, following is the snapshot:\n\
    \n### Consumed Message from demoqueue\n\n![jpg](images/065-04.jpg)\n\nFinally,\
    \ we have completed consuming message from RabbitMQ queue.\n\n![jpg](images/logo.jpg)\n\
    \n# Using RabbitMQ Direct Message Exchanges with .Net Application\n\nIn this part,\
    \ we are going to use Direct Message Exchanges and push messages into RabbitMQ\
    \ using .Net Application and `RabbitMQ.Client` and read messages from RabbitMQ\
    \ using .Net Application and `RabbitMQ.Client` in step by step way.\n\n![jpg](images/066-01.jpg)\n\
    \n## Types of Exchanges\n\n1. Direct\n2. fanout\n3. Headers\n4. Topic\n\n### Details\
    \ of Exchanges\n\n1. **Direct:** A direct exchange delivers messages to queues\
    \ based on routing key. In a direct exchange, messages are routed to queues whose\
