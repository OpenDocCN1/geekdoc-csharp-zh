    has `administrator` (Tags) privilege below that we can see add new user panel.


    ![jpg](images/034-03.jpg)


    Clicking on `Add a User` panel to create new Users.


    ![jpg](images/035-01.jpg)


    Before moving ahead lets first have a look at tags. Tags in this part are as rights
    (privileges) which are assigned to users which are created. We can set single
    or multiple privileges to a user if we want multiple privileges then just set
    privileges as comma-separated (administrator, management)


    ## Currently Supported by the Management Plugin


    ### Management

    The user can access the management plugin.


    ### Policymaker

    The user can access the management plugin and manage policies and parameters for
    the vhosts they have access to.


    ### Monitoring

    The user can access the management plugin and see all connections and channels
    as well as node-related information.


    ### Administrator

    The user can do everything monitoring can do, manage users, vhosts, and permissions,
    close other user''s connections, and manage policies and parameters for all vhosts.


    ## Creating Users


    In this part we are going to create new user and we are going to set Username
    as `demouser` after that we are going to set password as `123456` after that we
    are going set privilege to this user as `administrator` (just click on Admin link
    it will set `administrator` in tags field) finally click on `Add user` to create
    new user.


    After adding a queue, you can see the newly added `demouser` in the panel we can
    see `No` which means we do not have access.


    ### Setting Privilege to Virtual Hosts


    For setting permission just click on `demouser`.


    Once the permission is set, you''ll see `demouser` in the grid.


    # RabbitMQ Virtual Hosts


    ## What are Virtual Hosts?


    Virtual hosts are like a virtual box which contains a logical grouping of connections,
    exchanges, queues, bindings, user permissions, and many more.


    ![jpg](images/039-01.jpg)


    We can create different virtual host and each virtual host will have users.


    ## Creating Virtual host


    To create a new virtual host, we are first going to log in with default credentials
    and then we are going to choose `admin` tab.


    ![jpg](images/039-02.jpg)


    After choosing `admin` tab you will see vertical menus in right part of the page
