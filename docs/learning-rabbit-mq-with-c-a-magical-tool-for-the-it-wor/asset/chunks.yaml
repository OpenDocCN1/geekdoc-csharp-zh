  trans: "\n\n如果你查看 `Reportpdf` 队列的状态，你会看到 `Ready \"1\"`，这意味着我们已经成功通过头部交换机（headers\
    \ exchanges）向 `Reportpdf` 队列发布了一条消息。\n\n![jpg](img/107-01.jpg)\n\n在发布消息之后，我们将创建一个\
    \ .Net 控制台应用程序来从队列中消费消息。\n\n## 创建 RabbitMQConsumer 应用程序\n\n让我们创建另一个控制台应用程序，使用\
    \ `RabbitMQConsumer` 队列中的消息。\n\n![jpg](img/107-02.jpg)\n\n创建应用程序后，我们将添加 `RabbitMQ.Client`\
    \ NuGet 包。\n\n## 添加 RabbitMQ.Client NuGet 包\n\n在这一部分，为了创建与 RabbitMQ 服务器的连接以创建请求，我们需要从\
    \ NuGet 包中添加 `RabbitMQ.Client` 包。\n\n安装命令：`Install-Package RabbitMQ.Client -Version\
    \ 5.1.0`\n\n![jpg](img/107-03.jpg)\n\n安装 `RabbitMQ.Client` 后，我们将添加一个名为 `\"MessageReceiver\"\
    ` 的类。\n\n### MessageReceiver 类代码片段\n\n在这一部分，我们创建了 `MessageReceiver` 类，该类继承自 `RabbitMQ.Client`\
    \ 中的 `DefaultBasicConsumer` 类。接下来我们需要重写 `HandleBasicDeliver` 方法，该方法接收消息体，接下来我们将像在控制台中所示写入这些消息。\n\
    \n```csharp\nusing System;\nusing System.Text;\nusing RabbitMQ.Client;\nnamespace\
    \ RabbitMQConsumer\n{\npublic class MessageReceiver : DefaultBasicConsumer\n{\n\
    \    private readonly IModel channel;\n    public MessageReceiver(IModel channel)\n\
    \    {\n    channel = channel;\n    }\n    public override void HandleBasicDeliver(string\n\
    \    consumerTag, ulong deliveryTag, bool\n    redelivered, string exchange, string\
    \ routingKey,\n    IBasicProperties properties, byte[] body)\n    {\n      Console.WriteLine($\"\
    Consuming Headers Message\");\n      Console.WriteLine(string.Concat(\"Message\
    \ received\nfrom the exchange \", exchange));\n      Console.WriteLine(string.Concat(\"\
    Consumer tag:`\n\", consumerTag));\n      Console.WriteLine(string.Concat(\"Delivery\
    \ tag:`\n\", deliveryTag));\n      Console.WriteLine(string.Concat(\"Routing tag:\
    \ \",\nroutingKey));\n      Console.WriteLine(string.Concat(\"Message: \",\nEncoding.UTF8.GetString(body)));\n\
    \      _channel.BasicAck(deliveryTag, false);\n    }\n}\n}\n}\n```\n\n在理解 `MessageReceiver`\
    \ 类代码片段后，接下来将在主方法中调用此类。\n\n### 消费 \"Mumbai\" 队列的主方法代码片段\n\n在主方法中，我们创建了 `connectionFactory`\
    \ 类并传递了凭据和主机名，之后我们创建了连接，接着创建了通道并将 `prefetchCount` 设置为 1，这样可以告诉 RabbitMQ 不要一次向工作负载发送多条消息。接下来，我们创建了\
    \ `MessageReceiver` 类实例并将 `IModel` (`channel`) 传递给它，在最后一步，我们调用了 `\"BasicConsume\"\
    ` 方法并将队列名称 `\"ReportPDF\"` 传递给它，同时我们将 `autoAck` 设置为 false，并将 `messageReceiver`\
    \ 实例传递给它。\n\n![jpg](img/109-01.jpg)\n\n```csharp\nusing System;\nusing RabbitMQ.Client;\n\
    namespace RabbitMQConsumer\n{\nclass Program\n{\nprivate const string UserName\
    \ = guest\";\nprivate const string Password = guest\";\nprivate const string HostName\
    \ = localhost\";\nstatic void Main(string[] args)\n{\nConnectionFactory connectionFactory\
    \ = new\nConnectionFactory\n{\nHostName = HostName,\nUserName = UserName,\nPassword\
    \ = Password,\n};\nvar connection = connectionFactory.CreateConnection();\nvar\
    \ channel = connection.CreateModel();\n// accept only one unack-ed message at\
    \ a time\n// uint prefetchSize, ushort prefetchCount, bool\nglobal\nchannel.BasicQos(0,\
    \ 1, false);\n// ==== prefetchCount\n      // In order to defeat that we can set\
    \ the prefetch\ncount with the value of 1\n// This tells RabbitMQ not to give\
    \ more than one\nmessage to a worker at a time.\n// Or, in other words,在工作负载处理\n\
    //并确认之前的消息之前，不要向其\n// 分发新消息。\nInstead, it will dispatch it to t\n// the next worker\
    \ that is not still busy.\nMessageReceiver messageReceiver = new\nMessageReceiver(channel);\n\
    channel.BasicConsume(\"ReportPDF\", false,\nmessageReceiver);\nConsole.ReadLine();\n\
    }\n}\n}\n```\n\n现在我们已经完成了消费模块。让我们从已经发布的 `\"ReportPDF\"` 队列中消费一条消息。\n\n## 队列中有一条我们发布的请求\n\
    \n下面的快照显示 ReportPDF 队列有一条我们使用头部交换机发布的的消息。\n\n![jpg](img/110-01.jpg)\n\n### 从 ReportPDF\
    \ 队列消费的消息\n\n消费消息时的快照显示仅从 ReportPDF 队列消费。\n\n![jpg](img/111-01.jpg)\n\n从 ReportPDF\
    \ 队列读取消息后的队列状态。队列\n\n![jpg](img/111-02.jpg)\n\n我们已经完成了从 ReportPDF 队列消费消息的操作。\n\
    \n## 结论\n\n在这一部分，我们学习了如何使用头部交换机（headers Message Exchanges）、如何为头部交换机创建交换机和队列，如何使用\
    \ .Net 应用程序和 RabbitMQ.Client 向 RabbitMQ 推送消息，并逐步使用 .Net 应用程序和 RabbitMQ.Client\
    \ 从 RabbitMQ 中读取消息。\n\n![jpg](img/logo.jpg)\n\n"
