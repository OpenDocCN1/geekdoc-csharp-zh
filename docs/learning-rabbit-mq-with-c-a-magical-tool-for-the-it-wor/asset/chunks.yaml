  trans: "\n\nRabbitMQ 是一个开源且跨平台的消息中间件，它实现了 AMQP 协议，轻量级且易于在本地或云端部署。它基于 Erlang 构建，WhatsApp\
    \ 也使用它进行通信。RabbitMQ 提供了一种应用程序之间交换数据的方法，例如，Node.js 应用发送的消息可以被 .Net 应用或 Java 应用读取。\n\
    \n在如今节奏飞快的世界里，应用程序需要为终端用户提供快速响应，我们以门户的形式开发业务 Web 应用程序，并同时使用它们向终端用户发送电子邮件、消息、通知，这会减慢应用程序的性能。使用\
    \ RabbitMQ，我们可以通过交换器（Exchanges）和队列（Queues）处理消息和通知，从而从门户中减轻这种负担。\n\nRabbitMQ 是\
    \ IT 领域的一个魔法工具。\n\n# 致谢\n\n我想感谢以下人员：\n\n感谢我的父母的支持和鼓励。\n\n感谢 Manish Jain 给我提供写这本书的书的机会。\n\
    \n感谢 Shivprasad Koirala 和 Sukesh Marla 支持并鼓励我写这本书。\n\n并感谢所有其他在本书准备过程中发挥过作用的人。感谢大家的辛勤工作！\n\
    \n# RabbitMQ 简介\n\n## 什么是 RabbitMQ？\n\nRabbitMQ 是一个 AMQP 消息中间件，它是最流行的开源且跨平台消息中间件。\n\
    \n它基于 Erlang 构建，WhatsApp 也使用它进行通信。\n\nRabbitMQ 也是一种应用程序之间交换数据的方法，例如从 .Net 应用发送的消息可以被\
    \ Node.js 应用或 Java 应用读取。\n\nRabbitMQ 轻量级且易于在本地和云端部署。它支持多种消息协议。RabbitMQ 可以采用分布式和联邦配置部署，以满足高规模、高可用性的需求。\n\
    \n![jpg](img/011-01.jpg)\n\n## 为什么以及何时应该使用 RabbitMQ？\n\n我们应该使用 RabbitMQ 是因为它是开源且易于使用的，支持\
    \ .Net、Java、Python、Ruby、Node Js 等许多语言。\n\n我们可以使用 RabbitMQ 从我们的 Web 应用程序中移除一些繁重的工作，例如以电子邮件、Excel\
    \ 或 Pdf 格式发送报告，或者发送电子邮件、短信或其他任务（如触发其他应用程序开始处理的器）。\n\n现在，大多数人将所有这些任务（发送邮件或短信、报告）都放在单个应用程序中完成，这是一项相当繁重的任务，由\
    \ IIS 处理。如果你将此任务分离出来，IIS 将获得更多空间（内存）来提供更多请求。\n\n在简单了解 RabbitMQ 之后，接下来我们将在 Windows\
    \ 上安装 Erlang 和 RabbitMQ。\n\n## 什么是 AMQP？\n\n`高级消息队列协议`（`AMQP`）是一种面向消息的开放标准应用层协议，AMQP\
    \ 的定义特征是面向消息的、队列化、路由（包括点对点和发布/订阅）、可靠性和安全性。\n\n它由摩根大通和 iMatix 公司开发。\n\n### 主要特性\n\
    \nAMQP 设计的目标是具有以下主要特征：\n\n• 安全性 \n• 可靠性\n• 互操作性\n• 标准性\n• 开源\n\n### 各种客户端库\n\n\
    RabbitMQ 支持多种操作系统和各种语言，并为不同语言提供了各种客户端，例如：\n\n1. .Net\n2. Java\n3. Spring Framework\n\
    4. Ruby\n5. Python\n6. PHP\n7. Objective-C 和 Swift\n8. JavaScript\n9. GO\n10.\
    \ Perl\n\n![jpg](img/logo.jpg)\n\n# RabbitMQ 安装\n\n在这一部分，我们将学习如何一步步设置 RabbitMQ：\n\
    \n1. 什么是 Erlang\n2. 下载 Erlang\n3. 安装 Erlang\n4. 下载 RabbitMQ\n5. 安装 RabbitMQ\n\
    6.  RabbitMQ 服务器\n7. 启用 Web 管理插件\n8. Web 管理插件\n9. 结论\n\n## 什么是 Erlang\n\nErlang\
    \ 是一种通用编程语言和运行时环境。\n\nErlang 内置了对并发、分布式和容错的支持。\n\nErlang 被爱立信的多个大型电信系统使用。\n\n\
    引用自：[`erlang.org/faq/introduction.html`](http://erlang.org/faq/introduction.html)\n\
    \n### 下载 Erlang 的链接\n\n[`www.erlang.org/downloads`](http://www.erlang.org/downloads)\n\
    \n![jpg](img/013-01.jpg)\n\n下载 Erlang 后，现在我们将安装 Erlang。\n\n![jpg](img/logo.jpg)\n\
    \n# 安装 Erlang\n\n在这一部分，只需点击你下载的 Erlang 安装程序进行安装。\n\n![jpg](img/014-01.jpg)\n\n\
    下载 Erlang 安装程序后，直接安装即可，安装完成后我们将下载 RabbitMQ。\n\n## 下载 RabbitMQ\n\n首先，我们将从以下链接下载\
    \ Windows 版 RabbitMQ 安装程序：\n\n[`www.rabbitmq.com/download.html`](https://www.rabbitmq.com/download.html)\n\
    \n![jpg](img/014-02.jpg)\n\n下载 RabbitMQ 后，现在我们将安装 RabbitMQ。\n\n## 安装 RabbitMQ\n\
    \n在这一部分，只需点击你下载的 RabbitMQ 安装程序进行安装。\n\n![jpg](img/015-01.jpg)\n\n安装 RabbitMQ 后，搜索\
    \ RabbitMQ 命令提示符并以管理员权限打开它。\n\n## 启动 RabbitMQ 服务器\n\n在这一部分，我们将以管理员权限打开 `RabbitMQ\
    \ Command Prompt` 以检查 RabbitMQ 服务器的状态。\n\n![jpg](img/015-02.jpg)\n\n打开命令提示符后，输入\
    \ `rabbitmqctl status` 来检查 RabbitMQ 服务器的状态。\n\n```\nrabbitmqctl status\n```\n\n\
    ![jpg](img/016-01.jpg)\n\n如果你遇到如下错误，需要按照以下步骤操作：\n\n1. 在资源管理器中，导航到你的用户目录。（在地址栏输入\
    \ `%userprofile%）\n2. 如果那里已经有了 `.erlang.cookie` 文件，将其删除。如果没有，直接进入下一步。\n3. 在第二个资源管理器中，导航到\
    \ `C:\\Windows\\System32\\config`。\n4. 找到 `.erlang.cookie` 文件并将其复制到你的用户目录。\n5.\
    \ 现在 `rabbitmqctl` 应该可以通过身份验证。\n\n### 解决方案链接\n\n• [`stackoverflow.com/questions/478939/authentication-failed-rejected-by-the-node-please-check-the-erlang-coo?rq=1`](https://stackoverflow.com/questions/478939/authentication-failed-rejected-by-the-node-please-check-the-erlang-coo?rq=1)\n\
    • [`stackoverflow.com/questions/2825832/rabbitmq-has-nodedown-error`](https://stackoverflow.com/questions/2825832/rabbitmq-has-nodedown-error)\n\
    \n完成步骤后，再次运行相同的命令 `rabbitmqctl status`，应该出现以下屏幕。\n\n![jpg](img/017-01.jpg)\n\n\
    ```\nrabbitmq-plugins enable rabbitmq_management\n```\n\n执行此命令后，你将看到以下插件将被启用。\n\
    \n![jpg](img/017-02.jpg)\n\n屏幕是相同的，但由于我已经启用了插件，所以显示的信息不同\n\n![jpg](img/017-03.jpg)\n\
    \n现在我们已经启动了服务器，接下来我们将启用 RabbitMQ 的 Web 管理插件。\n\n### Web 管理插件\n\n现在使用 Web 管理插件，在浏览器中输入本地地址\
    \ `http://localhost:15672/`。\n\n在浏览器中输入本地地址后，它会要求访问 Web 管理插件的凭据。\n\n管理插件的默认`用户名`和`密码`为\
    \ `guest`（用户名：\"guest\" | 密码：\"guest\"）。\n\n![jpg](img/018-01.jpg)\n\n使用默认凭据登录后，将出现以下概览屏幕。\n\
    \n![jpg](img/018-02.jpg)\n\n"
- fmt: '

    For detail information on all tabs, you can visit: [https://www.cloudamqp.com/blog/2015-05-27-part3-rabbitmq-for-beginners_the-management-interface.html#overview](https://www.cloudamqp.com/blog/2015-05-27-part3-rabbitmq-for-beginners_the-management-interface.html#overview)


    ![jpg](images/logo.jpg)


    # RabbitMQ Exchanges


    ## What are the Exchanges?


    When a producer creates a message, it is not directly sent to a queue, first message
    is send to exchanges after that a routing agent reads and sends it to the appropriate
    queue with the help of header attributes, bindings, and routing keys. There are
    four types of exchanges which route the message in different ways along with that,
    there are various parameters which you can set such as `Type`, `Durability`, `Auto-delete`,
    `Internal`.


    ### Direct Exchange


    **Direct:** A direct exchange delivers messages to queues based on a message routing
    key. In a direct exchange, the message is routed to the queues whose binding key
    exactly matches the routing key of the message.


    ![jpg](images/019-01.jpg)


    ### Fanout Exchange


    **Fanout:** A fanout exchange routes messages to all of the queues that are bound
    to it.


    ![jpg](images/019-02.jpg)


    ### Topic Exchange


    **Topic:** The topic exchange does a wildcard match between the routing key and
    the routing pattern specified in the binding.


    ![jpg](images/020-01.jpg)


    ### Headers Exchange


    **Headers:** Headers exchanges use the message header attributes for routing.


    ![jpg](images/020-02.jpg)


    ### Properties Details


    ### Name


    The name will be an exchange name which you will set, it must be unique.


    ### Type


    **Direct:** A direct exchange delivers messages to queues based on a message routing
    key. In a direct exchange, the message is routed to the queues whose binding key
    exactly matches the routing key of the message.


    **Fanout:** A fanout exchange routes messages to all of the queues that are bound
    to it.


    **Topic:** The topic exchange does a wildcard match between the routing key and
    the routing pattern specified in the binding.


    **Headers:** Headers exchanges use the message header attributes for routing.


    ### Durability


    Durability is a property of exchange which tells that a message can survive server
    restarts (broker restart).


    There are two types of durability options:


    1. Durable

    2. Transient (Non-Durable)


    1. **Durable:** if you mark exchange as durable then it will survive server restarts.

    2. **Transient:** if you mark exchange as Transient then it will not survive server
    restarts.


    ![jpg](images/021-01.jpg)


    ### Auto delete


    ![jpg](images/021-02.jpg)


    There are two options in auto delete.


    1. Yes

    2. No


    If yes, the exchange will delete itself after at least one queue or exchange has
    been bound to this one, and then all queues or exchanges have been unbound. E.g.
    In this part, if you create an exchange and bind it to a queue and as you unbind
    queue it will delete it''s exchange also.


    ### Internal


    If set, the exchange may not be used directly by publishers, but only when bound
    to other exchanges. Internal exchanges are used to construct wiring that is not
    visible to applications.


    ![jpg](images/022-01.jpg)


    ### Alternate-exchange


    If there is an issue in publishing message to an exchange you can specify alternate
    exchange it will send a message to another queue.


    ![jpg](images/022-02.jpg)


    ## Adding Exchanges


    To add exchanges, we are first going to log in with default credentials and then
    we are going to choose Exchanges tab.


    ![jpg](images/023-01.jpg)


    After choosing tab you will see *"Add a new exchange panel"* just click on that
    panel to expand, next after expansion it will ask for exchange name for demo we
    are going to name exchange as `demoexchange`" and in type we are going to choose
    *"direct"* and click on the add button to create.


    ![jpg](images/023-02.jpg)


    After entering all details, we are going to click on **Add exchange** button to
    create an exchange.


    ## Snapshot after adding Exchanges


    ![jpg](images/024-01.jpg)


    In a similar way, we can add various exchanges and with different types.


    ![jpg](images/logo.jpg)


    # RabbitMQ Queues


    ## What is the Queue?


    A Queue is a Buffer that stores messages that are sent from exchanges to queues.


    ![jpg](images/025-01.jpg)


    ## Parameters of Queues in Details


    ### Name


    Name of the queue which we can reference in the application. The name must be
    unique and it must not be any system defined queue name.


    ### Durability


    Durability is a property of queue which tells that a message can survive server
    restarts (broker restart).


    There are two types of durability options:


    1. Durable

    2. Transient (Non-Durable)


    1. **Durable:** If you mark queue as durable then it will survive server restarts.

    2. **Transient:** If you mark exchange as Transient then it will not survive server
    restarts.


    ![jpg](images/025-02.jpg)


    ### Auto delete


    There are two options in auto delete:


    1. Yes

    2. No


    If yes, the exchange will delete itself after at least one queue or exchange has
    been bound to this one, and then all queues or exchanges have been unbound. E.g.
    In this part, if you create an exchange and bind it to a queue and as you unbind
    queue it will delete it''s exchange also.


    ### Arguments


    Arguments (optional; used by plugins and broker-specific features such as message
    TTL, queue length, etc)


    ### Time-to-live


    In this part, you can set timespan to a queue which will discard if it reaches
    its.


    Time will be in milliseconds.


    ![jpg](images/026-01.jpg)


    ### Auto expire


    In this part, you can set expiry to a queue by setting this property.


    This controls how long a queue can be unused before it is automatically deleted.


    Unused means the queue has no consumers, the queue has not been redeclared, and
    `basic.get` has not been invoked for at least the expiration period.


    ![jpg](images/027-01.jpg)


    ### Max Length


    How many (ready) messages a queue can contain before it starts to drop them from
    its head.


    A maximum number of messages can be set by supplying the `x-max-length` queue
    declaration argument with a non-negative value.


    ![jpg](images/027-02.jpg)


    For example, If you set value `x-max-length = 2` and if you publish three messages
    in the queue then two messages will be there, the oldest will be deleted from
    the queue.


    ![jpg](images/027-03.jpg)


    ### Max Length Bytes


    Total body size for ready messages a queue can contain before it starts to drop
    them from its head.


    Maximum length in bytes can be set by supplying the `x-max-length-bytes` queue
    declaration argument with a non-negative integer value.


    (Sets the `x-max-length-bytes` argument.) *1000000 bytes = 1MB*


    For example, If you set value `x-max-length-bytes = 1000000` and if you publish
    messages in queue and the queue size increase more than 1 MB then the oldest will
    be deleted from the queue (drop them from its head).


    ![jpg](images/028-01.jpg)


    ### Overflow Behaviour


    Sets the queue overflow behavior. This determines what happens to messages when
    the maximum length of a queue is reached. Valid values are `drop-head` or `reject-publish`.


    ![jpg](images/028-02.jpg)


    ### Dead Letter Exchange


    Optional name of an exchange to which messages will be republished if they are
    rejected or expire.


    ![jpg](images/029-01.jpg)


    ### Dead Letter Routing Key


    Optional replacement routing key to use when a message is dead-lettered. If this
    is not set, the message''s original routing key will be used.

