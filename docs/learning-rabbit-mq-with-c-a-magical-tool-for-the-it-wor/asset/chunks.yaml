    \n![jpg](img/logo.jpg)\n\n# 连接 (Connections)\n\n连接（connection）是你的应用程序与 RabbitMQ\
    \ 代理之间的 TCP 连接。\n\n引用自：[`www.cloudamqp.com/blog/2015-05-18-part1-rabbitmq-for-beginners-what-is-rabbitmq.html`](https://www.cloudamqp.com/blog/2015-05-18-part1-rabbitmq-for-beginners-what-is-rabbitmq.html)\n\
    \n在连接（connection）选项卡中，将显示消息生产者和消息消费者的实时连接，同时它还会显示每个连接的用户名以及连接状态；如果你使用 SSL/TLS，连接将用一个深色点\
    \ `.` 标记。它还会显示使用了什么协议，随后在网络部分显示从客户端和到客户端的网络利用率。\n\n![jpg](img/044-01.jpg)\n\n\
    如果你想查看每个连接的详情，请点击连接名称。\n\n## 连接 (Connections)\n\n![jpg](img/044-02.jpg)\n\n点击连接名称后，将显示连接的所有详情，包括数据速率、通道（channels）、客户端属性、运行时指标，最后关闭连接。\n\
    \n![jpg](img/045-01.jpg)\n\n如果你想关闭连接，可以打开 `Close this connection`（关闭此连接）标签页，输入原因并点击\
    \ `Force Close`（强制关闭）按钮。\n\n![jpg](img/045-02.jpg)\n\n![jpg](img/logo.jpg)\n\n\
    # 通道 (Channels)\n\n通道（channel）是连接内部的虚拟连接当你从队列发布或消费消息时——所有操作都是通过通道完成的。**引用自：**\
    \ [`www.cloudamqp.com/blog/2015-05-18-part1-rabbitmq-for-beginners-what-is-rabbitmq.html`](https://www.cloudamqp.com/blog/2015-05-18-part1-rabbitmq-for-beginners-what-is-rabbitmq.html)\n\
    \n在通道（channel）选项卡中，将显示消息生产者和消息消费者的实时通道，同时会显示模式（mode）。有两种模式：C - 确认通道（confirm channel）发送流式发布确认；T\
    \ - 事务通道（transactional channel）是事务性的，随后将显示通道状态。后续详情中 `Unconfirmed`（未确认）列将显示尚未确认的发布消息数量；`Unconfirmed`\
    \ 列旁边是 `Prefetch`（预取）列，显示每个通道限制的详情；`Prefetch` 列旁边是 `Unacked` 列，`Unacked` 表示消费者已承诺处理但尚未确认已处理；此外我们还有消息速率，显示发布和确认速率，以及投递和确认详情。\n\
    \n## 模式的说明\n\n通道保证模式。可以是以下之一，或两者皆非：\n\nC - confirm（确认模式）\n通道将发送流式发布确认。\n\nT -\
    \ transactional（事务模式）\n通道是事务性的。\n\n## 预取计数数的说明\n\n通道预取计数（prefetch counts）。\n\n\
    每个通道可以有两个预取计数：每个消费者的计数（限制通道上创建的每个新消费者）以及全局计数（在通道上的所有消费者之间共享）。\n\n如果设置了限制，此列将显示其中一个、另一个或两个限制。\n\
    \n![jpg](img/046-01.jpg)\n\n如果你想查看每个通道的详情，点击通道名称 `[::11:57086 (1)]`，将显示与该通道相关的所有详情。\n\
    \n![jpg](img/047-01.jpg)\n\n![jpg](img/logo.jpg)\n\n# 发布消息 (Publishing Message)\n\
