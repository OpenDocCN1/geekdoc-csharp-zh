  trans: "\n\n```csharp\nvar connection = connectionFactory.CreateConnection();\n\
    var model = connection.CreateModel();\nvar properties = model.CreateBasicProperties();\n\
    properties.Persistent = false;\nbyte [] messagebuffer = Encoding.Default.GetBytes(\"\
    Direct Message\");\nmodel.BasicPublish(\"request.exchange\", \"directexchange_key\"\
    , properties, messagebuffer);\nConsole.WriteLine(\"Message Sent\");\n}\n}\n```\n\
    \n### 主代码片段\n\n```csharp\nusing System;\nnamespace RequestRabbitMQ\n{\n    class\
    \ Program\n    {\n        static void Main(string[] args)\n        {\n       \
    \     Directmessages directmessages = new Directmessages();\n            directmessages.SendMessage();\
    \ Console.ReadLine();\n        }\n    }\n}\n```\n\n完成整个流程后，让我们保存并运行应用程序。运行后，你将在控制台窗口看到“message\
    \ sent”消息，仅用于通知。\n\n![jpg](img/070-01.jpg)\n\n发送消息后，现在让我们来看队列 `request.queue`。\n\
    \n# 现在让我们查看队列状态 request.queue\n\n如果你查看队列状态，你会看到 `Ready \"1\"`，这意味着我们已经成功地向 `request.queue`\
    \ 发布了了消息。\n\n![jpg](img/070-02.jpg)\n\n发布消息后，接下来我们将创建一个 .Net 控制台应用程序来从队列中消费消息。\n\
    \n## 创建 RabbitMQConsumer 应用程序\n\n让我们创建一个名为 `RabbitMQConsumer` 的控制台应用程序，用于从队列消费消息。\n\
    \n![jpg](img/071-01.jpg)\n\n创建应用程序后，我们将添加 `RabbitMQ.Client` NuGet 包。\n\n## 添加\
    \ RabbitMQ.Client NuGet 包\n\n在此部分，为了创建与 RabbitMQ 服务器的连接以发送请求，我们需要从 NuGet 包添加 `RabbitMQ.Client`\
    \ 包。\n\n**安装命令：** `Install-Package RabbitMQ.Client -Version 5.1.0`\n\n![jpg](img/071-02.jpg)\n\
    \n安装 `RabbitMQ.Client` 后，我们将添加一个名为 `MessageReceiver` 的类。\n\n### MessageReceiver\
    \ 类代码片段\n\n在此部分中，我们创建了 `MessageReceiver` 类，该类继承自来自 `RabbitMQ.Client` 的 `DefaultBasicConsumer`\
    \ 类。我们需要重写 `HandleBasicDeliver` 方法，该方法接收消息体，接下来我们将按照我们在控制台中看到的方式写入这些消息。\n\n```csharp\n\
    using System;\nusing System.Text;\nusing RabbitMQ.Client;\nnamespace RabbitMQConsumer\n\
    {\n    public class MessageReceiver : DefaultBasicConsumer\n    {\n        private\
    \ readonly IModel channel;\n        public MessageReceiver(IModel channel)\n \
    \       {\n            channel = channel;\n        }\n        public override\
    \ void HandleBasicDeliver(string consumerTag, ulong deliveryTag, bool redelivered,\
    \ string exchange, string routingKey, IBasicProperties properties, byte[] body)\n\
    \        {\n            Console.WriteLine($\"Consuming Message\");\n         \
    \   Console.WriteLine(string.Concat(\"Message received from the exchange \", exchange));\n\
    \            Console.WriteLine(string.Concat(\"Consumer tag:\", consumerTag));\n\
    \            Console.WriteLine(string.Concat(\"Delivery tag:\", deliveryTag));\n\
    \            Console.WriteLine(string.Concat(\"Routing tag:\", routingKey));\n\
    \            Console.WriteLine(string.Concat(\"Message: \", Encoding.UTF8.GetString(body)));\n\
    \            _channel.BasicAck(deliveryTag, false);\n        }\n    }\n}\n```\n\
    \n理解 `MessageReceiver` 类代码片段后，我们将在主方法中调用该类。\n\n### 主方法代码片段\n\n在主方法中，我们创建了 `connectionFactory`\
    \ 类并传递了凭据和 `Hostname`。之后我们创建了连接，接着创建了通道并将 `prefetchCount` 设置为 1，这将告诉 RabbitMQ\
    \ 不要一次向工作节点发送多条消息。接下来，我们创建了 `MessageReceiver` 类的实例并将 `IModel` (`channel`) 传递给它。最后一步，我们调用了\
    \ `BasicConsume` 方法并将队列名称 `\"request.queue\"` 传递给它，同时我们将 `autoAck` 设置为 `false`\
    \ 并 `messageReceiver` 实例传递给它。\n\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
    using System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\nusing RabbitMQ.Client;\n\
    namespace RabbitMQConsumer\n{\n    class Program\n    {\n        private const\
    \ string UserName = \"guest\";\n        private const string Password = \"guest\"\
    ;\n        private const string HostName = \"localhost\";\n        static void\
    \ Main(string[] args)\n        {\n            ConnectionFactory connectionFactory\
    \ = new ConnectionFactory()\n            {\n                HostName = HostName,\n\
    \                UserName = UserName,\n                Password = Password,\n\
    \            };\n            var connection = connectionFactory.CreateConnection();\n\
    \            var model = connection.CreateModel();\n            var properties\
    \ = model.CreateBasicProperties();\n            properties.Persistent = false;\n\
    \            byte [] messagebuffer = Encoding.Default.GetBytes(\"Direct Message\"\
    );\n            model.BasicPublish(\"request.exchange\", \"directexchange_key\"\
    , properties, messagebuffer);\n            Console.WriteLine(\"Message Sent\"\
    );\n        }\n    }\n}\n```\n\n"
