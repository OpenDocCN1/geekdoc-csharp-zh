    A method is basically a named block of code that is executable. It is capable
    of completing some tasks that will then allow objects to attain the right behavior.
    It can also execute the proper algorithms that are present in the codes.


    ## Custom classes

    Before you decide that you want to work with a specific class, you should make
    sure that you have an object that will go inside of it. You can do this by starting
    with a `new` keyword and then all you have to do is add in the constructors that
    you will need.


    While you are working on the C# language, you won’t have the access to manipulate
    the objects that you are creating directly. Instead, you need to assign your objects
    to a variable beforehand so that you can manipulate the objects if needed later
    on. Remember that to access the methods as well as the properties of that object
    you need to indicate the identifier that goes along with the object and then use
    your dot operator.


    ## How to organize your classes

    It is incredibly important that you can organize the classes that you are using
    the C# language. There is really only one rule that you must follow to make this
    all work. This one rule is that the classes must be saved as `.cs` files so that
    they are easier to find when you want to pull them up later to ensure that the
    codes will work properly.


    Technically, you do have the ability to save all of your classes into one big
    file, and the compiler should not have any issues with getting these to work without
    errors. But many programmers prefer to save their classes in different files because
    it helps them to easily find these classes later on and organize them as needed.
    It is really up to you how you would like to get this done though.


    Another thing that you will eventually gain some familiarity with as you continue
    working in this programming language is the `namespace`. This is a set of classes
    that are all related in some manner. The way that they are related will vary depending
    on the situation, but if examined, the way these classes relate to one another
    makes sense. These can include things like structures, interfaces, classes, and
    even the information that is placed inside of them. You even have the freedom
    to combine several classes together into a new namespace regardless of where they
    had been placed in the computer''s memory.


    If you are interested in creating a new namespace on the codes that you have already
    worked on, you should make sure that you add in the `using` directive to make
    things a bit easier for you. Most programmers will find that it is easier for
    them to write out the directives that they want to use inside the first few lines
    of the `.cs` file so that they do not forget to put them there later. After you
    made sure to insert this directive, you will then be able to declare the namespace.


    ## Accessing the classes

    The next thing that we will look at is how to access these classes. C# allows
    support from four modifiers when it comes to who can access each class. These
    modifiers are `public`, `internal`, `private`, and `protected`. What these modifiers
    do is that they allow you to control who will be able to see the elements that
    are in a particular class. Let''s look at how each of these work so you can decide
    which one to use when writing your own code:


    ### Private

    The function of this modifier is that will place some strict restrictions on one
    of your classes. If the class is tagged as a private class, it will not be accessible
    by the other classes in the code. The C# language will use this as the default
    modifier if you do not place anything else there. This can help to avoid problems
    in the future in case you forget to add on that modifier.


    ### Public

    You can also choose to make the class public. This means that the modifier will
    tell the other classes that they have access to this class. This modifier can
    take away all the limitations about how visible this class is to all the other
    classes.


    ### Internal

    If your code has the `internal` modifier on it, this means that this class will
    be accessible, but only to the files that fall in the same project.


    ### Protected

    '
