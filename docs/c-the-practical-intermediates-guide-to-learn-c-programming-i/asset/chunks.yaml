  trans: "\n\n在我们查看要执行的某些代码之前，需要注意的一点是，初始化部分在 `for` 循环开始之前只会被评估一次。如果你按照你希望看到的方式进行设置，那么这就足够了。考虑到这一点，让我们结合上面讨论的一些信息，并添加代码来观察这种循环是如何工作的。\n\
    \n```csharp\n// 用于演示 for 循环的 C# 程序。\nusing System;\nclass forLoopDemo{\n    public\
    \ static void Main(){\n        // for 循环从 x=1 开始\n        // 持续运行直到 x <=4 为止\n\
    \        for (int x = 1; x <= 4; x++)\n            Console.WriteLine(\"GeeksforGeeks\"\
    );\n    }\n}\n```\n\n既然我们刚刚讨论了 C# 中的一些进入控制循环，现在是时候转向我们在代码中可以使用的第二类型循环了。这些被称为**退出控制循环**（exit-controlled\
    \ loops）。测试条件位于循环体末尾的循环被称为退出控制循环。这类循环中最广为人的是 `do-while` 循环。\n\n在处理这些循环时，我们需要注意的一点是，由于测试条件位于循环体的末尾，退出控制循环的循环体至少会被评估一次。考虑到这一点，我们可以看看这里重点关注的\
    \ `do-while` 循环是如何工作。`do-while` 循环是一个实用的工具，但你可能会注意到它与我们将要看到的 `while` 循环有许多相似之处。`do\
    \ while` 和 `while` 循环之间的主要区别在于，`do while` 会在通过并执行语句后才检查条件。这意味着它肯定会至少执行一次循环体，因为它会先运行循环，然后再检查条件是否已经满足，而不是在开始时就检查。\n\
    \n现在，我们需要花一点时间查看在使用 `do while` 循环时会看到的一些语法。这些语法非常好用，并可以为我们提供很多优秀的代码，但请看下面的示例，注意\
    \ `do` 和 `while` 部分出现的位置，以及它们之间显示了什么信息。\n\n```csharp\n// 用于演示 do-while 循环的 C#\
    \ 程序\nusing System;\nclass dowhileloopDemo{\n    public static void Main(){\n\
    \        int x = 21;\n        do{\n            // 即使条件为假\n            // 这一行也会打印\n\
    \            Console.WriteLine(\"GeeksforGeeks\");\n            x++;\n       \
    \ }while (x < 20);\n    }\n}\n```\n\n我们还需要花时间考虑另一种选择，即**无限循环**（infinite loops）。这类循环的特点是，测试条件永远不会评估为假。这意味着它们将卡在循环中，并永远执行你放置的语句，直到你使用外部力量对其干预并确保它停止。\n\
    \n这在你没有实际为代码设置初初所需的某些条件时经常发生。你需要确保你立即添加了正确的条件，并将它们都保持在正确的位置，以确保你不会掉入此类循环的陷阱，从而避免在程序永远卡在那里之前不得不修复它。\n\
    \n为了让你看到如果你犯错并忘记本该有的条件时这种循环看起来像什么样，请看下面的代码，看看你是否能找到问题出在哪里。\n\n```csharp\n// 用于演示无限循环的\
    \ C# 程序\nusing System;\nclass infiniteLoop{\n    public static void Main(){\n\
    \        // 语句将被打印\n        // 无限次\n        for (;;)\n            Console.WriteLine(\"\
    This is printed infinite times\");\n    }\n}\n```\n\n在你要处理的代码中，有时你可能需要在代码的同一部分将两个循环结合。。确保它们能够相互结合，并且运行直到两者都完成。这对于你想要编写的一些代码非常重要，例如在过程中创建你自己的乘法表。这些**嵌套循环**（nested\
    \ loops，即一个循环位于另一个循环内部的良好示例包括：\n\n```csharp\n// 用于演示嵌套循环的 C# 程序\nusing System;\n\
    class nestedLoops{\n    public static void Main(){\n        // 循环中的循环打印 GeeksforGeeks\n\
    \        for (int i = 2; i < 3; i++)\n            for ( int j = 1; j < i; j++)\n\
    \                Console.WriteLine(\"GeeksforGeeks\");\n    }\n}\n```\n\n最后，在本章中我们将查看的最后一种循环被称为\
    \ `continue` 语句。这种语句非常有用，因为我们可以利用它在特定条件下跳过循环的执行部分，然后移动控制流，以便在需要时移动到下一个更新部分。在刚开始学习时，这可能看起来有点困惑，因此查看它的良好方法是查看下面我们需要整合在一起的一些代码。\n\
    \n```csharp\n// 用于演示 continue 语句的 C# 程序\nusing System;\nclass demoContinue{\n\
    \    public static void Main(){\n        // 因为 continue 语句\n        // GeeksforGeeks\
    \ 只打印了 2 次\n        for (int i = 1; i < 3; i++){\n            if (i == 2)\n  \
    \              continue ;\n            Console.WriteLine(\"GeeksforGeeks\");\n\
    \        }\n    }\n}\n```\n\n在处理 C# 时，有很多不同类型的循环，这是一件好事，因为在很多情况下你可能想在代码中引入这些循环，每种情况都需要不同类型的循环。好消息是，当你以适当的方式使用它们时，你将编写出所需的最佳代码，而不需要同时重写大量代码。花时间研究这些不同的循环以及它们能为你提供什么，并尝试几次，看看它们将如何适用于你自己的代码。\n\
    \n# 第 5 章 值类型与引用类型\n\nC# 中的类型可以分为：**值类型**（value types）或**引用类型**（reference types）。每类类型之间的差异源于拷贝策略的差异，这导致每种类型在内存中的存储方式不同。\n\
    \n### 值类型\n值类型涵盖大多数内置类型（具体来说，所有数值类型、`char` 类型和 `bool` 类型）以及自定义的 `struct` 和 `enum`\
    \ 类型。这些类型都具有固定的大小，值类型的变量直接包含它们自己的值。\n\n### 引用类型\n引用类型包括所有类（class）、数组、委托（delegate）和接口（interface）类型，编译器以不同的方式处理它们。例如，以\
    \ `Circle` 类为例。一旦你声明一个 `Circle` 变量，编译器就会分配一小部分内存，可能存储持有 `Circle` 的额外内存块的地址（或引用）。只有当通过\
    \ `new` 关键字创建了实际的 `Circle` 对象后，内存被分配。\n\n### 值类型与引用类型的拷贝\n（注：由于原文此段逻辑混乱，此处基于技术背景进行语义翻译）\n\
    当你处理这些类型时，需要注意内存分配。值类型存储在栈（stack）上，而引用类型存储在堆（heap）上。当你拷贝值类型时，拷贝的是实际的值；当你拷贝引用类型时，拷贝的是内存地址。例如，如果你创建一个名为\
    \ `i` 的整数变量并赋值为 `42`，然后创建一个名为 `copyi` 的变量并赋值相同值，`copyi` 和 `i` 将持有相同的值。\n\n###\
    \ 空值（Null）\n使用 `null` 关键字标识的空值表示该变量不引用任何有效对象。\n\n### 可空类型（Nullable types）\n值类型通常不能赋值为空，因为根据定义它们不持有引用。然而，C#\
    \ 定义了一个修饰符，允许你声明一个可空值类型，并以类似的方式处理空值。\n\n### Object 类\n.NET Framework 中最重要的引用类型之一是\
    \ `Object` 类。为了完全理解 `Object` 类的意义，你需要理解继承——稍后会介绍。目前，`Object` 可以作为所有类型的别名。在随后的示例中，变量\
    \ `c` 和 `o` 引用同一个对象，`c` 的类型是 `Circle`，而 `o` 的类型是 `object`。\n\n### 装箱（Boxing）\n\
    正如所述，类型为 `object` 的变量可以引用任何引用类型。然而，类型为 `object` 的变量也可以引用值类型。为了说明，以下语句将变量 `i`（类型为\
    \ `int`）初始化为 `42`：\n\n```csharp\nint i = 42;\nobject o = i; // 这里发生了装箱\n```\n\
    在这里，由于类型为 `object` 的变量可以引用值类型的拷贝，装箱操作是将值从栈拷贝到堆上。\n\n### 解箱（Unboxing）\n因为类型为 `object`\
    \ 的变量可以引用值类型的拷贝，所以通过变量获取该装箱值是合理的。通过简单的赋值将其转换为 `int`，例如：\n\n```csharp\nobject o\
    \ = 42;\nint i = (int)o; // 这里发生了解箱\n```\n\n# 第 6 章 枚举（Enumerations）\n\n`enum`\
    \ 是开发者可以声明的一种值类型。`enum` 的关键特性是它在编译时声明了一组可以通过名称引用的常量值。这是一个 `enum` 的示例：\n\n```csharp\n\
    enum Season { Spring, Summer, Winter }\n```\n\n一旦声明了枚举，你就可以像使用任何其他类型一样使用它。也就是说，如果枚举的名称是\
    \ `Season`，那么你可以在这里创建类型为 `Season` 的变量、字段和参数：\n\n```csharp\nenum Season { Spring,\
    \ Summer, Winter }\nclass Example{\n    public void Method(Season parameter) //\
    \ 方法参数\n    {\n        Season currentSeason; // 本地变量\n    }\n}\n```\n\n为了读取枚举，必须给它赋值一个值。你可以像下面这样为枚举变量赋值值：\n\
    \n```csharp\nenum Season { Spring, Summer, Winter }\nSeason colourful = Season.Autumn;\n\
    Console.WriteLine(colourful); // 输出 Autumn\n```\n\n# 第 7 章 决策（Decision-making）\n\
    \n在许多情况下，你需要仅在特定条件满足时执行语句块，或者在条件不满足时执行另一种。C# 支持许多决策结构，其变体是 `if...else` 结构。\n\n\
    ### if 语句\n`if` 语句是最基本的决策结构，用于测试条件。如果条件为真，则执行 `if` 块中的代码。\n\n```csharp\nint num\
    \ = 5;\nif (num > 3) {\n    Console.WriteLine(\"Greater than 3\");\n}\n```\n\n\
    ### else 语句\n如果 `if` 的条件不为真，则执行 `else` 块中的代码。\n\n```csharp\nint num = 2;\nif (num\
    \ > 3) {\n    Console.WriteLine(\"Greater than 3\");\n} else {\n    Console.WriteLine(\"\
    Less than or equal to 3\");\n}\n```\n\n### else if 语句\n当你有多个条件需要检查时，可以使用 `else\
    \ if` 。\n\n```csharp\nint num = 10;\nif (num > 15) {\n    Console.WriteLine(\"\
    Large\");\n} else if (num > 5) {\n    Console.WriteLine(\"Medium\");\n} else {\n\
    \    Console.WriteLine(\"Small\");\n}\n```\n\n### switch 语句\n为了减轻多个 `if` 语句带来的复杂性，C#\
    \ 提供了 `switch` 语句来测试变量。\n\n```csharp\nint day = 2;\nswitch (day) {\n    case 1:\n\
    \        Console.WriteLine(\"Monday\");\n        break;\n    case 2:\n       \
    \ Console.WriteLine(\"Tuesday\");\n        break;\n    default:\n        Console.WriteLine(\"\
    Other day\");\n        break;\n}\n```\n\n### 嵌套语句（Nested Statements）\n你可以在一个语句内部嵌套另一个语句，例如在\
    \ `if` 块中嵌套另一个 `if`。\n\n```csharp\nint x = 10;\nif (x > 0) {\n    if (x < 5) {\n\
    \        Console.WriteLine(\"Positive and less than 5\");\n    }\n}\n```\n\n#\
    \ 第 8 章 数组（Arrays）\n\n如果你希望存储许多相同元素，不想为每个元素创建一个单独的变量，那么数组是最好的格式。数组的标准定义是相同类型元素的集合。此外，元素的大小是固定的，且在内存分配上是顺序的。理解数组的良好方法是将其视为相同类型变量的集合。数组名称指向第一个元素，第一个元素的索引为\
    \ `0`。\n\n### 声明数组（Declaring Arrays）\n要声明数组，你需要使用以下语法：\n\n```text\ndata_type[]\
    \ name_array\n```\n\n在这里，`data_type` 是数组的数据类型，`name_array` 是用于访问数组的标识符，`[]` 是数组的或元素数量。数组声明的示例如下：\n\
    \n```csharp\ndouble[] bal;\n```\n\n### 初始化数组（Initializing Arrays）\n虽然数组声明告诉编译器要创建一个此名的数组，但实际上并未分配内存。只有在初始化数组后，才能为元素赋值。使用\
    \ `new` 关键字初始化数组：\n\n```csharp\ndouble[] bal = new double[5];\n```\n\n这初始化了类型为\
    \ `double` 且具有 5 个元素的数组。\n\n### 赋值（Assigning Values）\n正如我们提到的，可以通过在数组名称指定相关元素的索引来访问单个元素：\n\
    \n```csharp\nbal[0] = 4.5;\n```\n\n这将数组 `bal` 的第一个元素初始化为 `4.5`。上述方法将单个元素初始化为特定值。初始化和赋值可以如下方式结合：\n\
    \n```csharp\ndouble[] bal = {4.5, 66.7, 11.6, 34.0, 98.7};\n```\n\n或者，你也可以以这种方式执行此操作：\n\
    \n```csharp\ndouble[] bal = {4.5, 66.7, 11.6, 34.0, 98.7};\n```\n\n"
