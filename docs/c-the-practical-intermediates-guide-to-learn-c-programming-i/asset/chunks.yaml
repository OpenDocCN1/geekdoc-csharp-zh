    \    public static void Main(){\n        // for loop begins when x=1\n       \
    \ // and runs till x <=4\n        for (int x = 1; x <= 4; x++)\n            Console.WriteLine(\"\
    GeeksforGeeks\");\n    }\n}\n```\n\nNow that we just talked about some of the\
    \ entry-controlled loops in C#, it is time for us to move on to the second type\
    \ of loops that we are able to use in our codes. And these are going to be known\
    \ as the exit-controlled loops. The loops in which the testing condition is going\
    \ to be present at the end of the body of our loop are going to be known as the\
    \ exit-controlled loops. The best known of these kinds of loops is going to be\
    \ the exit-controlled loop.\n\nOne thing that we need to note when we are working\
    \ on these is that the exit-controlled loops will have the body of the loop evaluated\
    \ for at a minimum one time as the testing condition is present at the end of\
    \ the body of our loop. With that in mind, we can take a look at how to work with\
    \ the `do-while` loop that we want to focus on here. The `do-while` loop is a\
    \ great one to work with, but you may notice that it has a lot of similarities\
    \ to what we are going to see with the `while` loop. The main difference that\
    \ we are going to see between the `do while` and the `while` loop is that the\
    \ `do while` is going to check the condition after it goes through and executes\
    \ the statements. What this means is that it is going to execute the body of the\
    \ loop just one time for sure because it will run the loop, and then go through\
    \ and check the condition and see if it has been met yet or not, rather than doing\
    \ it in the beginning.\n\nNow we need to take a moment to look at some of the\
    \ syntaxes of what we are going to see when it comes to working with the `do while`\
    \ loop. These are nice to work with and can provide us with a lot of great codes,\
    \ but take a look at the example below and notice where they `do` and the `while`\
    \ part shows up, and what kind of information is showing up in between them.\n\
    \n```csharp\n// C# program to illustrate do-while loop\nusing System;\nclass dowhileloopDemo{\n\
    \    public static void Main(){\n        int x = 21;\n        do{\n          \
    \  // The line will be printed even\n            // If the condition is false\n\
    \            Console.WriteLine(\"GeeksforGeeks\");\n            x++;\n       \
    \ }while (x < 20);\n    }\n}\n```\n\nAnother option that we need to spend some\
    \ time on here is known as the infinite loops. These are going to be the types\
    \ of loops where we will find that the test condition is not going to evaluate\
    \ anything as false ever. This means that they are going to get stuck in the loop\
    \ and will continue to execute the statement that you have put into place forever,\
    \ or until you get an external force to work on it and make sure that it stops.\n\
    \nThis can often happen when you do not go through and actually put in some of\
    \ the conditions that your codes need in the first place. You need to make sure\
    \ that you are going through and adding in the right conditions right away and\
    \ keeping it all in the right place to ensure that you are not going to fall into\
    \ the trap of one of these loops and then having to fix your program before it\
    \ gets stuck there forever.\n\nTo see what this kind of loop is going to look\
    \ like in case you do make a mistake and forget the condition that should be there,\
    \ take a look at the code that is below and see if you are able to find where\
    \ the issue is inside of.\n\n```csharp\n// C# program to demonstrate infinite\
    \ loop\nusing System;\nclass infiniteLoop{\n    public static void Main(){\n \
    \       // The statement will be printed\n        // infinite times\n        for\
    \ (;;)\n            Console.WriteLine(\"This is printed infinite times\");\n \
    \   }\n}\n```\n\nThere are some times in the codes that you want to work with\
    \ that you will need to combine two loops together in the same part of the code.\
    \ You want to make sure that they are able to combine with one another and both\
    \ run until both of them are complete. This is going to be important to some of\
    \ the codes that you want to write, such as creating one of your own multiplication\
    \ tables along the way. A good example of these nested loops, where you have one\
    \ loop present inside of another loop, includes:\n\n```csharp\n// C# program to\
    \ demonstrate nested loops\nusing System;\nclass nestedLoops{\n    public static\
    \ void Main(){\n        // loop within loop printing GeeksforGeeks\n        for\
    \ (int i = 2; i < 3; i++)\n            for ( int j = 1; j < i; j++)\n        \
    \        Console.WriteLine(\"GeeksforGeeks\");\n    }\n}\n```\n\nAnd finally,\
    \ the last type of loop that we are going to take a look at in this chapter is\
    \ going to be known as the `continue` statement. This kind of statement is useful\
    \ because we can work with it to skip over the execution part of the loop on a\
    \ certain condition and then move the flow so that it is then on the next part\
    \ for updating when we need it. This one may seem a little bit confusing when\
    \ we are first getting started, so a good way to take a look at this is to look\
    \ at some of the coding that we need to put it together below.\n\n```csharp\n\
    // C# program to demonstrate continue statement\nusing System;\nclass demoContinue{\n\
    \    public static void Main(){\n        // GeeksforGeeks is printed only 2 times\n\
    \        // because of continue statement\n        for (int i = 1; i < 3; i++){\n\
    \            if (i == 2)\n                continue ;\n            Console.WriteLine(\"\
    GeeksforGeeks\");\n        }\n    }\n}\n```\n\nThere are a lot of different types\
    \ of loops when you are working with the C#, and this is a good thing because\
    \ there are many situations where you would want to bring up some of these loops\
    \ in your codes, and each situation will need a different kind of loop. The good\
    \ news is that when you use these in the proper manner, you will be able to write\
    \ out some of the best codes that you need, without having to rewrite a bunch\
    \ of lines of code at the same time. Spend some time looking at these different\
    \ loops and what they can offer to you, and try a few out to see how they are\
    \ going to work for your own codes as well.\n\n# Chapter 5 Value types and Reference\
    \ types\n\nTypes in C# can be split into either value types or reference types.\
    \ The differences between the types in each category stem from differences in\
    \ copying strategies, which in turn result in each type being stored differently\
    \ in memory.\n\n### Value types\nValue types encompass most built-in types (In\
    \ specific terms, all numeric types, `char` type, and `bool` type) as well as\
    \ custom `struct` and `enum` type. These types all have a fixed size, variables\
    \ of value types directly contain their own values.\n\n### Reference types\nReference\
    \ types comprise all classes, array, `delegate` and `interface` types and are\
    \ handled differently by the compiler. For example, take the `Circle` Class type.\
    \ Once you declare a `Circle` variable, the compiler allocates a small portion\
    \ of memory which can possibly hold the address of (or a reference to) additional\
    \ block of memory holding a `Circle`. Only once an actual `Circle` object is created\
    \ (via the `new` keyword) then the memory is allocated.\n\n### Copying value &\
    \ reference types\nWhen you take a copy of a value type there are two memory locations.\
    \ For example, should you create a integer variable called `i` and give it the\
    \ value `42` then an additional integer variable named `copyi` and assign `i`\
    \ to `copyi`, `copyi` will hold the identical value as `i` (`42`). Although `copyi`\
    \ and `i` hold the exact same value, there are actually two blocks of memory holding\
    \ the value `42`: one block for `i` and another block for `copyi`.\n\n### Null\
    \ values\nThe null value identified with the `null` keyword, indicates that the\
    \ variable does not refer to any valid object, i.e. it stipulates that a variable\
    \ is set to nothing. You can assign reference types, pointer types and nullable\
    \ types the value.\n\n### Nullable types\nValue types can’t typically be assigned\
    \ since by definition they can’t hold references, which includes references to\
    \ nothing. However, C# defines a modifier that you can use to declare a variable\
    \ is nullable value type which acts in a similar way to the original value, but\
    \ you can assign the null value to it.\n\n### The Object class\nOne of the most\
    \ important reference types in the .NET Framework is the `Object` class in the\
    \ `System` namespace. To completely appreciate the significance of `Object` class,\
    \ you need understand inheritance - described later in this ebook. For the time\
    \ being, simply accept that all classes are specialized types of `Object` and\
    \ C# provides the `object` keyword as an alias for `Object`. In the subsequent\
    \ example, the variables `c` and `o` reference the same object. The fact that\
    \ the type of `c` is `Circle` and the type of `o` is `object` (the alias for `Object`)\
    \ in effect offers two different views of the same item in memory.\n\n```csharp\n\
    Circle c = new Circle(42);\nobject o = c;\n```\n\n### Boxing\nAs discussed, variables\
    \ of type `object` can refer to any item of any reference type. However, variables\
    \ of type `object` can also refer to a value type. To illustrate, both the following\
    \ statements initialize the variable `i` (of type `int`, a value type) to `42`\
    \ and then initialize the variable `o` (of type `object`, a reference type) to\
    \ `i`:\n\n```csharp\nint i = 42;\nobject o = i;\n```\n\nIn the second there is\
    \ a bit more happening. Remember that `i` is a value type and that it lives on\
    \ the stack. Should the reference inside `o` referred directly to `i`, then the\
    \ reference would refer to the stack. Nevertheless, all references must refer\
    \ to objects on the heap; creating references to items on the stack could seriously\
    \ compromise the robustness of the runtime and create a potential flaw, so it\
    \ is not allowed. Therefore, the runtime allocates a piece of memory from the\
    \ heap, copies the value of integer `i` to this memory, and then refers the object\
    \ `o` to this copy. Boxing is term for automatically copying an item from the\
    \ stack to the heap.\n\n### Unboxing\nBecause a variable of type `object` can\
    \ refer to a boxed copy of a value, it’s only reasonable to allow you to get that\
    \ boxed value through the variable. You may be thinking that could access the\
    \ boxed int value that a variable `o` refers to via a simple assignment like:\n\
    \n```csharp\nint i = o; // This will result in a compile error\nYou can’t use\
    \ the `int i = o` code. The variable `o` could be referencing absolutely anything\
    \ - not just an integer. Take for example the subsequent code if such a statement\
    \ were allowable:\n\n```csharp\nCircle c = new Circle();\nint i = 42;\nobject\
    \ o;\no = c; // o refers to a circle\ni = o; // what is stored in i?\n```\n\n\
    To get the value of the boxed copy, you must utilise what is known as a cast.\
    \ This operation checks if it’s safe to convert an item of one type to another\
    \ before it actually making the copy. You prefix the object variable with the\
    \ name of the type in parentheses, as follows:\n\n```csharp\nint i = 42;\nobject\
    \ o = i; // boxing\ni = (int)o; // this compiles ok\nThe effect of this cast is\
    \ subtle. The compiler sees that you’ve specified the type `int` in the cast.\
    \ It generates code to check what `o` actually refers to at run time. It could\
    \ be really anything. Even though your cast says `o` refers to an `int`, it doesn’t\
    \ mean that it actually does. If `o` actually refer to a boxed `int` and everything\
    \ correlates, the cast will succeed and the compiler will extract the value from\
    \ the boxed `int` and copy it to `i`. (i.e. the boxed value will be stored in\
    \ `i`). This is called unboxing. However, if `o` does not refer to a boxed `int`,\
    \ there has been a type mismatch and the cast will fail. `InvalidCastException`\
    \ is invoked. The following illustrates an unboxing cast that fails:\n\n```csharp\n\
    Circle c = new Circle(42);\nobject o = c; // fails to box since Circle is a reference\
    \ variable\nint i = (int)o; // compiles ok but throws an exception at runtime\n\
    Note that boxing and unboxing are expensive operations because of the quantity\
    \ of checking that is required and the need to allocate additional heap memory.\
    \ Boxing is useful but overuse will really negatively impact the performance of\
    \ your program.\n\n### Casting data safely\nBy utilising a cast, you can in your\
    \ opinion specify that the data referenced by an object has a specific type and\
    \ it is safe to reference the object by using that type. It is important to note\
    \ that it is of your opinion. The C# compiler will not check that this is the\
    \ case, but the runtime will. If the type of object in memory doesn't match the\
    \ cast, the runtime will throw an `InvalidCastException`. You should expect this\
    \ exception and deal with it appropriately should occur. In saying that, catching\
    \ an exception and attempting to recover in the event that the type of an object\
    \ is rather an unwieldy approach.\n\n### The is operator\nYou can utilise the\
    \ `is` operator to authenticate that the type of an object is what you assume\
    \ to be, like so:\n\n```csharp\nWrappedInteger wi = new WrappedInteger();\nobject\
    \ o = wi;\nif (o is WrappedInteger){\n    // This is safe;\n}\n```\nThe `is` operator\
    \ accepts two operands: the left - reference to an object, the right – a type.\
    \ Should the type of the object, referred to on heap, has the specified type,\
    \ it evaluates to true; or else, evaluates to false.\n\n### The as operator\n\
    The `as` operator achieves a similar role to `is` but in a slightly condensed\
    \ method. You utilise `as` operator like so:\n\n```csharp\nWrappedInteger wi =\
    \ new WrappedInteger();\nobject o = wi;\nWrappedInteger temp = o as WrappedInteger;\n\
    if (temp != null){\n    // Cast was success!\n}\n```\nThe `as` operator is similar\
    \ to `is` in that it takes an object and a type as its operands. The runtime attempts\
    \ to cast the object to the specified type. If the cast fail, then `as` operator\
    \ apprais to the null and instead assigns that to `temp`.\n\n# Chapter 6 Enumerations\n\
    \nAn `enum` is a value type that the developer can declare. The key characteristic\
    \ of `enum` is that it declares at compile time a set of constant values that\
    \ can be referred to by name. This is an example of `enum`:\n\n```csharp\nenum\
    \ Season { Spring, Summer, Winter }\n```\n\nOnce you have declared an enum, you\
    \ can use it in the same way as any other type. That is, if the name of `enum`\
    \ is `Season` then you can create variables, fields and parameters of type `Season`\
    \ here:\n\n```csharp\nenum Season { Spring, Summer, Winter }\nclass Example{\n\
    \    public void Method(Season parameter) // method parameter\n    {\n       \
    \ Season currentSeason; // local variable\n}\n```\n\nIn order to read an enumeration,\
    \ you must assign a value to it. You can assign a value that defined by the enumeration\
    \ only to enumeration variable, as illustrated here:\n\n```csharp\nenum Season\
    \ { Spring, Summer, Winter }\nSeason colourful = Season.Autumn;\nConsole.WriteLine(colourful);\
    \ // writes out Autumn\n```\n\nYou can then assign the null value, as well. \n\
    \nStructures specify reference types that are solely created on the heap. However,\
    \ on some occasions the class may have so little data that the overhead of managing\
    \ the heap turns out be disproportionate. Since structs are stored on the stack,\
    \ as long as the structure is reasonably small, the memory overhead is often reduced.\
    \ A structure is similar to a class in that it have its own fields, methods, and\
    \ constructors. Declaring a structure is similar to that of a class. utilize the\
    \ `struct` keyword then use the name of the type, followed by the body of the\
    \ structure, between opening and closing braces. Here for example is a structure\
    \ named `Time` that contains three public fields named hours, minutes, and seconds:\n\
    \n```csharp\nstruct Time{\n    public int hours, minutes, seconds;\n}\nAs classes,\
    \ it is not recommended to make the fields of a structure public in most cases;\
    \ as there is no way to control the values held in public fields. A better idea\
    \ is to make the fields private and provide your structure with constructors and\
    \ methods to initialize these fields, as shown in example:\n\n```csharp\nstruct\
    \ Time{\n    private int hours, minutes, seconds;\n    public Time(int hh, int\
    \ mm, int ss){\n        this.hours = hh;\n        this.minutes = mm;\n       \
    \ this.seconds = ss;\n    }\n    public int Hours(){\n        return this.hours;\n\
    \    }\n}\n\n\n# Chapter 7 Decision-making\n\nThere are many situations when you\
    \ require a block of statements to be executed only if a particular condition\
    \ is satisfied or conversely, if the condition concerned is not satisfied. The\
    \ implementation of such programming scenarios require decision-making constructs.\
    \ C# supports many decision-making constructs; most of which are variations of\
    \ the classic `if...else` construct. All these decision-making elements of the\
    \ C# programming language are described in this chapter.\n\n### If Statement\n\
    The `if` statement is the most basic decision-making construct that tests the\
    \ condition, which appears in the `if` statement. If the condition is found true,\
    \ the block of statements that follow the `if` statement is executed. On the other\
    \ hand, if the condition is false, the `if` block is simply ignored by the system\
    \ and execution begins from the first statement that lies outside the `if` block.\
    \ Sample implementation for the `if` statement is given below.\n\n```csharp\n\
    using System;\nnamespace ConditionalStatements{\nclass DemoIf{\n    public static\
    \ void Main(string[] args){\n        int num = 5;\n        if (num < 5){\n   \
    \         Console.WriteLine(\"Inside If Block\");\n        }\n        Console.WriteLine(\"\
    If Executed.\");\n    }\n}\n```\n\n### If Else Statement\nThe `if else` is a modified\
    \ version of the standard `if` construct that tests the condition, which appears\
    \ in the `if` statement. If the condition is found true, the block of statements\
    \ that follow the `if` statement is executed. On the other hand, if the condition\
    \ is found false, the block of statements that follow the `else` statement is\
    \ executed. Sample implementation for the `if else` statement is given below.\n\
    \n```csharp\nusing System;\nnamespace ConditionalStatements{\nclass DemoIf{\n\
    \    public static void Main(string[] args){\n        int num = 5;\n        if\
    \ (num < 5){\n            Console.WriteLine(\"Inside If Block\");\n        }else{\n\
    \            Console.WriteLine(\"Inside Else Block\");\n        }\n        Console.WriteLine(\"\
    If Else Executed.\");\n    }\n}\n}\n```\n\n### Nested If Statements\nThere may\
    \ be situations where you may be required to test many conditions; each of which\
    \ being a sub-part of the main condition. In other words, if you have a programming\
    \ scenario that needs to perform a block of statements if the vehicle is an Audi.\
    \ So, firstly, you will need to put a condition that tests the vehicle. If this\
    \ condition is found true, the system must check for condition that tests the\
    \ car. You can have multiple if statements, one inside another, there is no limit\
    \ on the amount of nesting that can be performed. However, the higher the number\
    \ of ifs inside another, the time complexity of the program increases. Sample\
    \ code for implementing nested if as follows:\n\n```csharp\nusing System;\nnamespace\
    \ ConditionalStatements{\nclass DemoIf{\n    public static void Main(string[]\
    \ args){\n        int num1 = 5;\n        int num2 = 2;\n        if (num1 == 5){\n\
    \            Console.WriteLine(\"Inside If 1\");\n        }\n        if (num2\
    \ == 2){\n            Console.WriteLine(\"Inside If 2\");\n        }\n       \
    \ Console.WriteLine(\"Nested If Executed.\");\n    }\n}\n}\n```\n\n### Switch\
    \ Statement\nIn order to mitigate the complexity associated with nested if, C#\
    \ also provides `switch` statement, which can test one variable for multiple values\
    \ and execute corresponding statements for the same. The syntax for implementing\
    \ `switch` is as follows:\n\n```csharp\nswitch (variable_to_tested) {\n    case\
    \ Value_1:\n        Statement;\n        break;\n    case Value_2:\n        Statement;\n\
    \        break;\n    case Value_3:\n        Statement;\n        break;\n    default:\n\
    \        Statement;\n        break;\n}\n```\n\nNested Switch Statements\nThere\
    \ may be programming scenarios that may require you to test multiple variables\
    \ and this shall require nested switch. C# allows programmers to use nested switch\
    \ and there is no limit on the amount of.\n\n### Conditional Operator\nTo simplify\
    \ the conditional construct, C# also provides conditional operator (`?:`).\n\n\
    # Chapter 8 Arrays\n\nIf you wish to store many elements of the same type and\
    \ don’t want to create an individual variable for each of them, then the best\
    \ format available for you is an array. The standard definition of array is a\
    \ collection of elements are of the same type. Moreover, the size of the elements\
    \ is fixed and the order of the same is sequential in the way that memory is allocated.\
    \ One of the best ways to understand arrays is to see it as a collection of variables\
    \ of the same type. The name of the array points to the first element. The index\
    \ of the first element is `0`. Subsequent elements of the array can be accessed\
    \ by mentioning the index of the element using the syntax, `name_array[0]`.\n\n\
    ### Declaring Arrays\nIn order to declare an array, you need to use the syntax:\n\
    \n```text\ndata_type[] name_array\n```\n\nHere, `data_type` is the data type of\
    \ the array, `name_array` is the identifier that will be used for accessing the\
    \ array and `[]` is the rank or number of elements in the array. An example of\
    \ array declaration is given below.\n\n```csharp\ndouble[] bal;\n```\n\n### Initializing\
    \ Arrays\nWhile the array declaration tells the compiler that an array of this\
    \ name is to be created, memory for array is actually allocated. It is only after\
    \ array initialization that values can be assigned to the elements. Array is initialized\
    \ using `new` keyword in the following manner:\n\n```csharp\ndouble[] bal = new\
    \ double[5];\n```\n\nThis initializes the array `bal` of type `double` to have\
    \ 5 elements.\n\n### Assigning Values\nLike we mentioned, individual elements\
    \ of the array can be accessed by mentioning the index of the concerned element,\
    \ next to the array name in the following manner:\n\n```csharp\nbal[0] = 4.5;\n\
    ```\n\nThis initializes the first element of the array `bal` to the value `4.5`.\
    \ The above-mentioned method initializes individual elements of the array to specific\
    \ values. Initialization and assignment can be combined in the following manner:\n\
    \n```csharp\ndouble[] bal = {4.5, 66.7, 11.6, 34.0, 98.7};\n```\n\nAlternatively,\
    \ you may also perform this operation in the following manner:\n\n```csharp\n\
    double[] bal = new double[5] {4.5, 66.7, 11.6, 34.0, 98.7};\n```\n\n```csharp\n\
    double[] bal = new double[] {4.5, 66.7, 11.6, 34.0, 98.7};\n```\n\nIf you wish\
    \ to copy an array into another array, you can directly use the statement similar\
    \ to the one below:\n\n```csharp\ndouble[] cp_bal = bal;\n```\n\nThis creates\
    \ an array `cp_bal` that points to the same location as `bal`. It is important\
    \ to mention here that C# also performs auto-initialization of elements depending\
    \ on the data type of the array. For instance, if an `int` array is created, all\
    \ its values are initialized to `0`.\n\n### Accessing Elements\nJust like array\
    \ elements are initialized using their index, array elements can be accessed an\
    \ re-initialized using the name of the array followed by the index of the element,\
    \ which is enclosed within square brackets. An example of this is given below.\n\
    \n```csharp\ndouble val = bal[4];\n```\n\nThis assigns the value of the last element\
    \ of the array to the variable `val`. The sample code below demonstrates the working\
    \ of arrays in C#.\n\n```csharp\nusing System;\nnamespace DemoApp {\nclass DemoArray\
    \ {\n    static void Main(string[] args) {\n        int [] num = new int[5]; /*\
    \ num is an int array of 5 elements */\n        int x,y;\n        for ( x = 0;\
    \ x < 5; x++ ) {\n            num[ x ] = x + 100;\n        }\n        /*Print\
    \ the values of array elements*/\n        for (y = 0; y < 5; y++ ) {\n       \
    \     Console.WriteLine(\"Element[{0}] = {1}\", y, num[y]);\n        }\n     \
    \   Console.ReadKey();\n    }\n}}\n```\n\n### Foreach Loop\nC# provides a special\
    \ looping construct that uses the contiguous nature of arrays for performing iterations.\
    \ The loops iterates through the elements of the array and its syntax is as follows:\n\
    \n```csharp\nforeach (int var_name in array_name){}\n```\n\nHere, `var_name` is\
    \ the looping variable and `array_name` is the name of the array, which needs\
    \ to be involved for looping. Sample implementation of this looping construct\
    \ is given below.\n\n```csharp\nusing System;\nnamespace DemoApp {\nclass DemoArray\
    \ {\n    static void Main(string[] args) {\n        int[] num = new int[5];\n\
    \        foreach (int var_name in num) {\n            // ...\n        }\n    }\n\
    }\n}\n```\n\n### Multidimensional Arrays\nC# supports multidimensional arrays,\
    \ which are arrays that have more than one dimension. There are two types of multidimensional\
    \ arrays: rectangular arrays and jagged arrays.\n\n#### Rectangular Arrays\nRectangular\
    \ arrays are arrays where each row has the same number of columns. The syntax\
    \ for declaring a rectangular array is:\n\n```text\ndata_type [,] name_array\n\
    ```\n\nFor example, to declare a 2D rectangular array:\n\n```csharp\nint[,] matrix\
    \ = new int[3,3];\n```\n\nTo access and assign elements in a rectangular array:\n\
    \n```csharp\nmatrix[0,0] = 1;\nint val = matrix[0,0];\n```\n\n#### Jagged Arrays\n\
    Jagged arrays are arrays of arrays, where each array can have a different number\
    \ of columns. The syntax for declaring a jagged array is:\n\n```text\ndata_type\
    \ [][] name_array\n```\n\nFor example, to declare and initialize a jagged array:\n\
    \n```csharp\nint[][] jagged = new int[3][];\njagged[0] = new int[2];\njagged[1]\
    \ = new int[4];\njagged[2] = new int[3];\n```\n\nTo access and assign elements\
    \ in a jagged array:\n\n```csharp\njagged[0][0] = 1;\nint val = jagged[0][0];\n\
