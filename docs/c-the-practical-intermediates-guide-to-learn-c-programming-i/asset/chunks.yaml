    \n# Introduction\n\n`C` is a general high-level programming language ideal for\
    \ creating various firmware or portable applications. `C` is one of the most used\
    \ programming languages, as well as one of the oldest existing languages there\
    \ is. It has led to the creation of other languages such as `C++`. It’s one of\
    \ the preferred languages because of its power and flexibility. Even with its\
    \ low-level proficiencies, `C` was made to promote cross-platform programming\
    \ and has achieved a huge following, even in academic communities. It has also\
    \ been standardized and made a part of `POSIX`, which stands for Portable Operating\
    \ System Interface.\n\nThe first major creation using `C` was actually the `Unix`\
    \ operating system. Because of that, `Unix` has been always connected to `C`.\
    \ Today, however, `C` has become independent from `Unix` but is still viewed as\
    \ an important language for every programmer to use. It’s good to learn `C` programming;\
    \ it has been here for a while but because it’s such a low-level language, it’s\
    \ still very powerful and useful. It’s a great way to get to learn other languages\
    \ better. You’ll find it easy to move om to other programming languages. `C` is\
    \ also relatively easy to use for application development.\n\n# C Programming\
    \ Features\n\nWhat features does the C Programming Language offer? Here are some\
    \ of them:\n- It has this basic form of modularity; files can possibly be separately\
    \ linked and compiled.\n- You have a set number of keywords that includes control\
    \ primitives i.e. `if`, `for`, `switch`, `while` and `do while`.\n- Different\
    \ assignments can be used in one statement.\n- It offers different mathematical\
    \ and logical operators with bit manipulators.\n- You can choose to ignore function\
    \ return values if not needed.\n- Typing is static for `C`, but weakly enforced.\
    \ All the data has type, yet can possibly be implicitly converted such as using\
    \ characters as integers.\n\n# Chapter 1: Data Types\n\nIn the C programming language,\
    \ data types allude to a framework utilized for pronouncing variables or functions\
    \ of distinctive data types. The type of a variable decides the amount of space\
    \ it will take and how the bit pattern saved in it is utilized. The fundamental\
    \ classification used for data types is given below:\n\n- **Basic Types**: They\
    \ are number-crunching sorts and comprises of the two following types: (a) integer\
    \ sorts and (b) floating point sorts.\n- **Enumerated sorts**: They are again\
    \ number sorts and are utilized to characterize variables that must be allocated\
    \ discrete number values all through the system.\n- **Void type**: The keyword\
    \ `void` demonstrates that no value can be assigned.\n- **Derived sorts**: They\
    \ incorporate (a) `Array`, (b) `Pointer`, (c) `Union`, (d) `Structure` and (e)\
    \ `Function`.\n\nThe array and structure data types are also referred to as aggregate\
    \ types. The type of a function defines the kind of value the function will return\
    \ upon termination. We will discuss the essential data types in the accompanying\
    \ segments.\n\n## Integer Types\n\nHere is a list of data types that follow under\
    \ this category. In addition, the storage space occupied by them and their range\
    \ are also specified for your reference.\n\n- `char`:\n    - Allocated Memory:\
    \ 1 byte\n    - Range: -128 to 127 or 0 to 255\n- `signed char`:\n    - Allocated\
    \ Memory: 1 byte\n    - Range: -128 to 127\n- `unsigned char`:\n    - Allocated\
    \ Memory: 1 byte\n    - Range: 0 to 255\n- `int`:\n    - Allocated Memory: 2 or\
    \ 4 bytes\n    - Range: -32,768 to 32,767 or -2,147,483,648 to 2,147,483,647\n\
    - `short`:\n    - Allocated Memory: 2 bytes\n    - Range: -32,768 to 32,767\n\
    - `unsigned short`:\n    - Allocated Memory: 2 bytes\n    - Range: 0 to 65,535\n\
    - `unsigned int`:\n    - Allocated Memory: 2 or 4 bytes\n    - Range: 0 to 65,535\
    \ or 0 to 4,294,967,295\n- `long`:\n    - Allocated Memory: 4 bytes\n    - Range:\
    \ -2,147,483,648 to 2,147,483,647\n- `unsigned long`:\n    - Allocated Memory:\
    \ 4 bytes\n    - Range: 0 to 4,294,967,295\n"
