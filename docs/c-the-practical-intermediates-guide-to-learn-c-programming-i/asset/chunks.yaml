    \n在使用本书包含的内容和信息时，您同意使作者免受任何损害、成本和费用，包括因应用本书所提供的任何信息而可能导致的任何法律费用。本免责声明适用于由于直接或间接使用和应用所呈现的任何建议或信息而导致的任何损失、损害或伤害，无论是由于违约、侵权、过失、人身伤害、刑事故意或其他任何诉讼原因。您同意接受使用本书中呈现的信息的所有风险。您同意通过继续阅读本书，在适当和/或必要的情况下，在使用本书中任何建议的方案、技术或信息之前，您将咨询专业人士（包括但不限于您的医生、律师或财务顾问或其他所需的顾问）。\n\
    \n# 引言\n\n`C` 是一种通用的高级编程语言，非常适合用于创建各种固件或可移植应用程序。`C` 是最常用的编程语言之一，也是现有最古老的语言之一。它促成了如\
    \ `C++` 等其他语言的诞生。由于其强大和灵活性，它是首选语言之一。尽管具有低级特长，`C` 的设计初衷是促进跨平台编程，并获得了巨大的关注，即使在学术界也是如此。它还被标准化并成为\
    \ `POSIX`（可移植操作系统接口）的一部分。\n\n使用 `C` 创建的第一个主要作品实际上是 `Unix` 操作系统。正如此，`Unix` 一直与\
    \ `C` 联系在一起。然而，今天 `C` 已经独立于 `Unix`，但仍被认为是每个程序员都应该使用的重要语言。学习 `C` 编程是好的；它已经存在很长时间了，但因为它是一种低级语言，所以它仍然非常强大且有用。它是更好地学习其他语言的极佳方式。你会发现迁移到其他编程语言很容易。`C`\
    \ 对于应用程序开发也相对容易使用。\n\n# C 语言特性\n\nC 编程语言提供了哪些特性？以下是其中：\n- 它具有这种基本的模块化形式；文件可以被单独链接和编译。\n\
    - 你拥有一组数量的关键字，包括控制原语即 `if`、`for`、`switch`、`while` 和 `do while`。\n- 一个语句中可以使用不同的赋值。\n\
    - 它提供了不同的数学和逻辑运算符，以及位操作符。\n- 如果不需要，你可以选择忽略函数的返回值。\n- `C` 的类型是静态的，但执行较弱。所有数据都有类型，但可能被隐式转换，例如将字符作为整数使用。\n\
    \n# 第 1 章：数据类型\n\n在 C 编程语言中，数据类型是指用于声明不同数据类型的变量或函数的框架。变量的类型决定了它将占据空间的大小以及存储其中的位模式如何被使用。数据类型的基本分类如下：\n\
    \n- **基本类型**：它们是处理数字的类型，由以下两种类型组成：(a) 整数类型和 (b) 浮点类型。\n- **枚举类型**：它们也是数字类型，用于描述在整个系统中必须分配离散数值的变量。\n\
    - **Void 类型**：关键字 `void` 表示无法赋值。\n- **派生类型**：它们包括 (a) `Array`（数组）、(b) `Pointer`（指针）、(c)\
    \ `Union`（联合）、(d) `Structure`（结构）和 (e) `Function`（函数）。\n\n数组和结构数据类型也被称为聚合类型。函数的类型定义了函数终止时返回的值类型。我们将在后续章节中讨论基本数据类型。\n\
    \n## 整数类型\n\n以下是该类别数据类型列表。此外，还规定了它们占据的存储空间和范围供参考。\n\n- `char`:\n    - 分配内存：1 字节\n\
    \    - 范围：-128 到 127 或 0 到 255\n- `signed char`:\n    - 分配内存：1 字节\n    - 范围：-128\
    \ 到 127\n- `unsigned char`:\n    - 分配内存：1 字节\n    - 范围：0 到 255\n- `int`:\n   \
    \ - 分配内存：2 或 4 字节\n    - 范围：-32,768 到 32,767 或 -2,147,483,648 到 2,147,483,647\n\
    - `short`:\n    - 分配内存：2 字节\n    - 范围：-32,768 到 32,767\n- `unsigned short`:\n\
    \    - 分配内存：2 字节\n    - 范围：0 到 65,535\n- `unsigned int`:\n    - 分配内存：2 或 4 字节\n\
    \    - 范围：0 到 65,535 或 0 到 4,294,967,295\n- `long`:\n    - 分配内存：4 字节\n    - 范围：-2,147,483,648\
    \ 到 2,147,483,647\n- `unsigned long`:\n    - 分配内存：4 字节\n    - 范围：0 到 4,294,967,295\n\
    \n"
- fmt: "\nTo get the precise size of a variable or data type, you can utilize the\
    \ `sizeof` operator. The declarations `sizeof(<data type>)` yields the size of\
    \ the data type or variable in bytes. Given below is an example, which illustrates\
    \ the concept, discussed below:\n\n```c\n#include <limits.h>\n#include <stdio.h>\n\
    int main() {\n    printf(\"Data type char (size in bytes): %d \\n\", sizeof(char));\n\
    \    return 0;\n}\n```\nUpon compilation and execution of this code, you must\
    \ get the following output:\nData type char (size in bytes): 1\n\n## Floating\
    \ Point Data Types\nHere is a list of data types that follow under this category.\
    \ In addition, the storage space occupied by them, their range and precision value\
    \ are also specified for your reference.\n\n- **float**\n    - Allocated Memory:\
    \ 4 byte\n    - Range: 1.2e-38 to 3.4e+38\n    - Precision: 6 decimal places\n\
    - **double**\n    - Allocated Memory: 8 byte\n    - Range: 2.3e-308 to 1.7e+308\n\
    \    - Precision: 15 decimal places\n- **long double**\n    - Allocated Memory:\
    \ 10 byte\n    - Range: 3.4e-4932 to 1.1e+4932\n    - Precision: 19 decimal places\n\
    \nThe header file named `float.h` characterizes macros that permit you to utilize\
    \ these data type values. The following code will allow you to find the exact\
    \ amount of allocated memory in bytes on your system for the concerned data type.\n\
    \n```c\n#include <float.h>\n#include <stdio.h>\nint main(){\n    printf(\"Allocated\
    \ Memory for float : %d \\n\", sizeof(float));\n    printf(\"Precision: %d\\n\"\
    , FLT_DIG );\n    printf(\"Max Range Value: %E\\n\", FLT_MAX );\n    printf(\"\
    Min Range Value: %E\\n\", FLT_MIN );\n    return 0;\n}\n```\nUpon compilation\
    \ and execution of this code, you must get the following output:\nAllocated Memory\
    \ for float : 4\nPrecision: 6\nMax Range Value: 3.402823E+38\nMax Range Value:\
    \ 1.175494E-38\n\n## The void Type\nThe `void` data type points out that no value\
    \ is accessible. It is utilized as a part of three sorts of circumstances:\n\n\
    - **Void returned by a function**\nYou must have commonly noticed the use of the\
    \ data type `void` as return type of function. If not, you will see an extensive\
    \ use of the same as you move forward in your experience with C. The `void` data\
    \ type signifies that the function will not return anything. Example of such an\
    \ implementation is:\n```c\nvoid print(int);\n```\n\n- **Function Arguments as\
    \ void**\nThere are different functions in C, which don't acknowledge any parameter.\
    \ A function with no parameter can acknowledge as a `void`. Example of such an\
    \ implementation is:\n```c\nint print(void);\n```\n\n- **Pointers to void**\n\
    A pointer of sort `void *` signifies the location of a variable. For instance,\
    \ consider the following declaration:\n```c\nvoid *malloc( size_t size );\n```\n\
    This function returns a pointer to `void`. In other words, this function can return\
    \ a pointer to a location of any type. You may not be able to comprehend the use\
    \ and meaning of the `void` data type in entirety right now. However, as you move\
    \ forward, you will find it easier to relate to and use this data type in your\
    \ code.\n\n# Chapter 2: Data Structures, Handling and Functions\n\n### Introduction\
    \ and Significance of Data Structures\nIn this chapter we are going to learn about\
    \ the definition of data structures and their significance in the C# programming\
    \ language. We will learn on the importance of the data structures and when and\
    \ how to use them during the programming sessions. It is equally important to\
    \ know that a great programmer writes efficient and effective programs using very\
    \ appropriate data structures.\n\nProgramming is made up of two major components.\
    \ These are algorithms and data structures. This explains the reason why more\
    \ attention is given to these two components. A good developer or software engineer\
    \ is that which has vast skills and knowledge of data structures and efficient\
    \ in programming.\n\nBefore we get deeper into the data structure there are few\
    \ terms that we should know and understand in order to become a good developer.\
    \ **Algorithm complexity**- this can be defined as a standard which examines the\
    \ order of the operations count that is performed and evaluated by an algorithm\
    \ which becomes a function of input data size. This standard is commonly represented\
    \ by `O (f)` notation which is referred to as “Big O notation or asymptotic notation”.\
    \ There are many types of complexities such as constant, logarithmic, exponential,\
    \ linear, cubic and, quadratic.\n\n## Enumerations, Arrays and structs\n\n####\
    \ Enumerations\nThis can be defined as a data type that specifies the number of\
    \ items by equally assigning them to an identifier for example a name. This is\
    \ made possible by the consideration of the underlying pattern of the base type\
    \ of the components of the specification or the enumeration. The declaration of\
    \ an enumeration can be done as shown below;\n\n```csharp\nenum Months { January,\
    \ February, March, April, May, June, July, August, September, October, November,\
    \ December };\n```\n\n#### Understanding our code\nThe code above portray elements\
    \ of enumerations which are displayed as constants as shown below:\n```csharp\n\
    Month = Month.January;\n\nif (month == Month.February)\n{\n    Console.WriteLine(\"\
    Programming with C# through the months of the year is easy!\");\n}\n```\nThe first\
    \ element is always a zero when there is no explicit value which is assigned to\
    \ the specified or enumerated items. The subsequent elements will uptake the successive\
    \ value after zero. On the other end, the specific values that originate from\
    \ integral types can always be assigned to specified elements of enumeration as\
    \ shown below;\n\n```csharp\nenum Age { Baby = 0, Adolescence = 13, Youth = 18\
    \ };\n```\n```csharp\nAge age = Age.Adolescence;\nConsole.WriteLine(\"You are\
    \ an adolescence at the age of {0}.\", (int)age);\n```\nIn addition, values that\
    \ are underlying in enumeration usually go unused when the grouping function is\
    \ specific to a group.\n\n#### Arrays\nThis is a representation of a group of\
    \ items of a similar type or that bear similar characteristics. The declaration\
    \ of arrays may depend on constants and variables. It is important to note that\
    \ once the array length has been declared it cannot be altered after declaration\
    \ as shown below:\n\n```csharp\n// an array whose length is defined with a constant\n\
    int[] integers = new int[10];\n\nint length = 0;\nSystem.Console.Write(\"what\
    \ is the length of array? \");\nSystem.Console.ReadLine(length);\n\n// this is\
    \ an array. Its length has been defined with a variable\ndouble[] doubles = new\
    \ double[length];\n```\n\n#### Structs\nThe keyword that is used to declare a\
    \ struct is `struct`. They are referred to as light container for objects. They\
    \ are mostly applied when data is needed for collection of types of variables.\
    \ Structs can be compared to classes. Structs have methods, constructors and interfaces.\
    \ The other major differences include:\n\n- Structs are usually the value types\
    \ whereas the classes are considered to be reference types.\n- Structs cannot\
    \ inherit as compared to classes.\n- Structs require a less memory space and is\
    \ less expensive as compared to classes.\n- Structs have a compulsory default\
    \ constructor even if it is not required whereas a class gives the allowance to\
    \ hide the constructors.\n\nDeclaration of structs is done as follows:\n```csharp\n\
    struct Girl {\n    public string name;\n    public System.DateTime birthDate;\n\
    \    public int heightInMtrs;\n    public int weightInGrams;\n}\n```\nThe Person\
    \ Struct is used as follows:\n```csharp\nGirl dana = new Girl();\ndana.name =\
    \ \"Dana Programmer\";\ndana.birthDate = new DateTime(1975, 8, 19);\ndana.heightInMtrs\
    \ = 1.75;\ndana.weightInGrams = 50000;\n\nif (dana.birthDate < DateTime.Now)\n\
    {\n    Console.WriteLine(\"Dana Programmer is a genuine programmer!\");\n}\n```\n\
    The example below shows how constructors can be used in structs for initialization:\n\
    ```csharp\nusing System;\n\nstruct Girl {\n    string name;\n    DateTime birthDate;\n\
    \    int heightInMtrs;\n    int weightInGrams;\n\n    public Person(string name,\
    \ DateTime birthDate, int heightInMtrs, int weightInGrams) {\n        this.name\
    \ = name;\n        this.birthDate = birthDate;\n        this.heightInMtrs = heightInMtrs;\n\
    \        this.weightInGrams = weightInGrams;\n    }\n}\n```\n"
