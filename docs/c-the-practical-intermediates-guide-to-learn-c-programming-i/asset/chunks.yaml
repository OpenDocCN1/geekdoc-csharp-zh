    [content]

    # When to choose a data structure


    In this section of the book we are going to discuss situations in which the data
    structures listed in the table above is going to be used.


    ## Array

    As discussed before, this is a grouping or collection of number of components
    of a similar type. We can also refer to the arrays as “a small container of data
    having a predefined size”. Addition of new elements into an array as shown in
    the table is a very slow process. For this to occur successfully, allocation of
    definite space is done and an extra space that can transfer data from one array
    to another. Searching of an array is also a slow process because the comparison
    is done in accordance to the needed value. Deletion of an element from the array
    is a slow process because it’s a reverse of the addition process. In this case
    a definite memory is allocated and a single space is subtracted. However, accessing
    an array is very fast and efficient because it utilizes indexing. Arrays are best
    for situations like processing fixed amount or number of components which should
    be accessed by the use of an index.


    ## Dynamic Arrays

    This is the most commonly used type of data structure in modern programming. This
    is because it avoids a fixed list of components and enables direct access of data
    by the use of indices. Dynamic arrays can also be referred to as an “array or
    resizable list”. Dynamic arrays usually hold elements in a list of array. The
    advantage of this array is that the list has a bigger size than the number of
    stored components. Addition into the dynamic array takes a specific constant time.
    This is because there is always an empty cell before the addition of components.
    Searching the dynamic array is a slow operation because there is traversing through
    all the stored components in order to find what is being looked for. Deletion
    from the dynamic array is a slow process. The execution of this command is done
    using linear time. The other reason is that once a deletion is made, the stored
    elements are moved to the left in order to create an empty cell for addition.
    The dynamic array is used in situations that require quick addition and access
    by the use of indexing.


    ## Linked lists

    These can either be singly or doubly linked lists. The major function done by
    both the singly and doubly linked list is the storage of collection of components
    by maintaining their order. They are represented in the memory as dynamic and
    pointer-based. Addition into the linked list is a very fast process. Although
    it is slower than dynamic arrays, it is an advanced process. This is achieved
    by a new allocation of memory space. It is a high-speed process that is always
    unpredictable. Searching is a very slow process because it uses the same principle
    as dynamic arrays to traverse all the elements during the search. Deletion of
    an element is a slow operation. This is because searching is done before deletion
    hence the indexing process makes it generally slow. In summary, a linked list
    has a fast addition process. It is suitable for situations when addition and removal
    are needed at a faster rate at both sides of the linked lists.


    ## Stack

    This is a linear data structure that has three major steps; addition of components
    to the top of the specific stack(`push`), removing components from the top of
    the specific stack(`pop`) and inspection of the components at the top of the stack
    without interfering with the order(`peek`). The addition and deletion of the stack
    is a very fast process because a constant time is used. The stack does not have
    the searching and accessing by index features. It generally works with the LIFO
    technique where the Last In is the First Out. Stack is used in situations where
    LIFO (Last In First Out) is applicable.


    ## Queue

    This is also another type of linear data structures that is specific to two operations:
    addition of a component to the tail(`enqueue`) and extraction of the component
    from the head(`dequeue`). The two processes are fast because it utilizes a constant
    timing. The operations here are similar to the processes in addition and deletion
    of linked lists. The Queue uses the FIFO technique where First In usually leads
    to the First Out. Similar to stacks, the searching and access by index is not
    supported by the queue. Apart from FIFO, the queue embraces the concept of Breadth-first
    search (BFS). This works by starting from the first component in the list and
    hence its surrounding components are aligned in a queue. Queue is appropriate
    in situations where the BFS and the FIFO are applicable.


    ## Hash table (Dictionary Implementation)

    Implementation by dictionary means storage of key value and search by the latter
    mentioned key. The format of dictionary implementation makes the hash table to
    have a very fast addition, search and deletion processes. However, the hash table
    does not support the access by index feature because the components of the hash
    table have no particular order. The components are stored in an array and located
    by the use of a hash function. It is also important to note that if a function
    is wrong, or it causes a collision of single cells then the whole implementation
    becomes inefficient. Hash table is the fastest data structure. This is because
    it provides for quick addition and searching with the use of a key. Hash table
    is appropriate for a situation where fast addition is required as well as fast
    search by use of a key.


    ## Hash table (Set implementation)

    This data structure is a collection or grouping of components that have no duplicates.
    The basic processes that do happen in this data structure are the addition of
    components to a set, searching for the components in the set and deletion or removal
    of the components from the set. This is a special kind of hash table that contains
    keys. It is also important to note that searching using indices is not supported.
    The case is similar when a bad hash function is used. When this occurs, the whole
    program becomes inefficient. This situation rarely occurs. Hash table is used
    in situations where faster addition of components to a collection or a set is
    required. It is also good for checking and identification of components that do
    not belong to a specific data set.


    ## Balance Tree (Dictionary Implementation)

    This is a type of data structure that stores pairs of key-value where the keys
    used are sorted. It supports a faster operation of the addition, searching and
    removal processes. The algorithm complexity that is used in this data structure
    is logarithmic. Collisions of functions do not affect the data structure widely
    as seen in hash tables. In balance trees, there is a very minimum probability
    of an error and usage of bad hash functions. It is very evident that in balance
    tree of dictionary implementation there are fast basic operations. Because of
    faster operations, extraction feature is enabled which is also very first with
    dictionary implementation. Balance tree by dictionary implementation is used in
    situations where there is fast addition, searching and extraction of components
    that have been sorted by a particular key.


    ## Balance tree (Set implementation)

    This is a special data structure that has a red-black tree implementation where
    the keys and values always coincide. Similar to the dictionary implementation,
    the set implementation uses the logarithmic algorithm complexity. In summary,
    a balance tree by set implementation is required in situations where fast addition
    and checking of components is required. In addition, the components of the set
    are sorted in ascending order.


    # Practical Example of choice of a Data Structure


    ### Example 1

    In this small sub-chapter we are going to examine several examples of implemented
    data structures. I believe it is going to open our eyes in choices of data structures.
    Our first step is to generate the subsets of a set for example; `W = {Sea, wine,
    computer, joy}`. Our objective is to create a simple code that is going to output
    the subsets of `W`. We start from an empty set of `{}`. We add the empty set to
    each and every component of set `W` and we get the collection below; `{sea}, {wine},
    {computer}, {joy}`. Then we add to each element to the subsets from set `W` so
    that the ones which have not been included can be reflected in the two elemental
    subsets. There is freedom of addition up to the N-elemental subset `{sea, wine},
    {sea, computer}, {sea, joy}, {wine, computer}, {wine, joy}, {computer, joy}`.


    At this point, we are going to focus on and choose the right data structure to
    implement the above algorithm. In order to choose the right data structure, we
    are going to consider the type of operations that are needed to be done. At the
    moment, the main operation to be done is traversing through all the components
    of the set (subset). This operation can be done efficiently by the `array`, `dynamic
    array`, `hash tables` and almost all the other data structures.


    i) We shall first consider the `array` because it is the simplest data structure
    to work with.

    ii) The next step that comes after picking the data structure is to pick criterion
    for storing one of the subsets example `{beer, money}`.

    iii) Here we check the operations which will efficiently execute this subset.
    The operations to be done are addition and checking of the components. From our
    previous knowledge, we know `arrays` and `linked lists` perform a quicker search.
    We choose the data structure that is fast in addition and searching.

    iv) We pick on `hash table (set implementation)` and hence keep the collection
    or grouping of the words in the subsets as shown; `{sea, wine}, {sea, computer},
    {sea, joy}, {wine, computer}, {wine, joy}, {computer, joy}`.

    v) Using the chosen structure, addition and traversing through the components
    is very efficient. At this point we get to notice that other data structures such
    as `stacks`, `Sets`, `queue` and `list` also qualify for this characteristic.
    On the other end, if we study further we notice this set W works with FIFO technique.
    At this point we choose `queue`.

    vi) Lastly, we obtain that `queue` is the best data structure for this program.


    Using the queue data structure

    We can illustrate and describe the algorithm using the following procedure:

    i) Begin the queue with an empty set `{}`

    ii) Dequeue the components of the subset. Add each and every element from `W`
    in relation to the subset it is located.

    iii) Repeat until the queue is empty.


    It is very evident that once a developer understands the needs of the program
    and hence selects the correct data structure, implementation becomes very quick
    and easy. The example below is how the program will look after applying the correct
    data structure:


    ```

    string[] words = {"sea", "wine", "computer", "joy"};

    ```

