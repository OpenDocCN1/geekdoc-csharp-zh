    ### 1. 循环变量的初始化

    在这一步中，将对控制循环的变量或表达式进行初始化。它是循环的起点。可以使用已经声明的变量，也可以声明一个仅局部当前循环的局部变量。


    ### 2. 测试条件

    我们在这里需要关注的第二点是测试条件。我们将使用它来执行循环体中的语句。它被用于许多情况下，以测试循环的退出条件。它必须返回一个布尔值，这意味着我们将得到
    `true` 或 `false` 的结果。当条件为 `false` 时，控制权将跳出循环，这种循环也就结束了。


    ### 3. 递增与递减

    根据我们的要求，对循环变量进行递增或递减，当此操作发生时，控制权将再次回到测试条件。

