    方法（Method）基本上是一个可执行的命名代码块。它能够完成某些任务，从而让对象获得正确的行为。它还可以执行代码中存在的适当算法。


    ## 自定义类

    在决定要使用特定类之前，你应该确保你已经有一个要放入类中的对象。你可以通过使用 `new` 关键字开始，然后只需要添加你需要的构造函数即可。


    在学习 C# 语言时，你无法直接操作你创建的对象。相反，你必须预先将对象赋值给变量，以便以后在需要时操作这些对象。记住，要访问该对象的方法和属性，你需要指定与对象相关的标识符，然后使用点运算符（`.`）。


    ## 如何组织你的类

    在使用 C# 语言时，能够组织你所使用的类至关重要。为了让这一切正常运行，你实际上只需要遵循的一条规则。这条规则是：类必须保存为 `.cs` 文件，这样当你以后想要调用它们时就能更容易找到，从而确保代码能够正常工作。


    从技术上讲，你确实有能力将所有的类保存到一个大文件中，编译器在让它们无错误运行方面也不会遇到任何问题。但许多程序员更倾向于将类保存在不同的文件中，因为这有助于他们以后轻松地找到这些类并根据需要进行组织。不过，具体如何操作完全取决于你的个人。


    随着你继续学习这种编程语言，你最终会熟悉另一件事就是 `namespace`（命名空间）。这是一组在某种程度上相关的类。它们之间的关系方式取决于具体情况，但仔细观察就会发现，这些类之间的关系是合理的。它们可以包括结构（structures）、接口（interfaces）、类，甚至放在它们内部的信息。你甚至可以自由将几个类组合成一个新的命名空间，无论它们之前放置在计算机内存的什么位置。


    如果你感兴趣在你已经编写过的代码上创建一个新的命名空间，你应该确保添加 `using` 指令，以让你的工作更轻松一些。大多数程序员会发现，在 `.cs` 文件的前几行写出他们想要使用的指令更容易，这样他们以后就不会忘记把它们放在那里。在确保插入了此指令后，你就可以声明命名空间了。


    ## 访问类

    我们将接下来查看如何访问这些类。在涉及到谁可以访问每个类时，C# 支持四种修饰符。这些修饰符是 `public`、`internal`、`private`
    和 `protected`。这些修饰符的作用是允许你控制谁能够看到特定类中的元素。让我们看看每个修饰符是如何工作的，以便你可以在编写自己的代码时决定使用哪一个：


    ### Private（私有）

    此修饰符的功能是对你的其中一个类施加严格的限制。如果该类被标记为 `private` 类，则代码中的其他类将无法访问它。如果你没有放置其他任何内容，C# 语言将将其作为默认修饰符。这可以帮助在你以后忘记添加该修饰符的情况下避免出现问题。


    ### Public（公共）

    你也可以选择将类设为 `public`。这意味着该修饰符会告诉其他类它们可以访问此类。此修饰符可以消除关于该类对所有其他类可见性的所有限制。


    ### Internal（内部）

    如果你的代码对其有 `internal` 修饰符，这意味着该类是可以访问的，但仅限于属于同一个项目的文件。


    ### Protected（保护）


    '
- fmt: '

    This is the modifier that you want to use if you would like to prevent a user
    from accessing the element. However, it also allows all the descendant classes
    to have access to the elements of that class if they need it. As you can see,
    each of these elements all works in a slightly different way compared to one another
    based on how much you want your classes to be private in terms of permitted access.
    If you would like to make sure that the class remains private and that nothing
    or no one else is allowed to get ahold of it or use the information, then you
    working in the `private` setting is obviously the best for you. However, if you
    need other classes to have the ability to work with this particular class, then
    it is just fine to change it to the `public` modifier. As you go through your
    program, think about which of these modifiers will work out the best for your
    code. If you do not place any of these modifiers before your class, then it will
    default as a private class, which is not that bad of a thing. But if you feel
    that one of the other options is the best for making your code, then you must
    make sure that it is written in with the class to avoid issues later.


    ## Final word about classes


    The importance of these classes cannot be emphasized enough when it comes to writing
    out your code. They help you to keep things neat and organized and will also make
    sure that you can easily pull up the things that you need from the code. This
    can make things so much simpler to work with. Your code will work better, and
    you will find that writing your own codes isn’t even really that difficult. When
    it comes to picking out the objects that go with the class that you are writing,
    you must remember that these objects need to make sense if you put them together.
    You should have someone else, like a friend or a co-worker who’s familiar with
    programming, look at the class and agree that it makes sense that those objects
    ended up together. This does not mean that the objects need to be identical, but
    they need to at least be related in some way.


    For example, if you have a class that is called ‘Toys,’ you don’t just place the
    same toy inside and leave it as it is. You could include all sorts of ‘toys’ or
    other objects inside, but some rules have to be followed. This can work with any
    kind of class that you would like to work with. You could have a class of things
    that are colored blue, one for animals, and one for types of vehicles. As long
    as the objects that go inside match up a little bit, that means you’re doing everything
    right.


    It is important to spend some time learning about objects because they are so
    important to ensure that your code works the way that you would like. They provide
    the tools to organize your code and make sure it works amazingly well. Try out
    a few of the different codes that are in this guidebook, and you will quickly
    see how well these work once you try making your own code.


    ## Conclusion


    This really is just the beginning of your C# journey. There is so much more to
    learn and so much further you can go; this is only the tip of the iceberg. You’ve
    learned the syntax and the language conventions; you’ve learned what goes into
    a program and how to make things more complex. The most important part of any
    computer programming language is the logical aspect. Yes, you may have learned
    how to loop through an array like you would look through a list of grocery items.
    But, if someone asked you to take an image and process it, would you know how
    to do it? Would you know how to scale it? Rotate it? Flip it? By using an API
    and your brain, you could figure it out.


    Real programming requires you to use the logical part of your brain. It’s much
    like learning a foreign language. Learning the language conventions and the grammar
    rules is one thing, but the real skill comes from writing the language in a clean
    and structured way and in a well-thought-out and logical manner. As a programmer,
    the skill comes from being able to put your knowledge and logic into practice
    by writing clean code that makes sense, and most importantly, that works. Learning
    a program and truly understanding it is great – it really is the nearest we have
    to having magic power. You can make something from nothing, build it from the
    ground up, and have it do exactly what you want it to do.


    In this series of guides, you learned C# de basics, and while I couldn’t possibly
    teach you everything you need to know, I have at least set you off on a journey
    of discovery. I hope that you now feel you can take the next step, and that you
    are prepared to dive deeper into `C#` and learn it until you are proficient at
    it. Thank you for taking the time to read my guide and I want to take this opportunity
    to wish you luck on your C# journey.


    ## Conclusion


    This marks the end of this guide. `C#` is a compiled programming language developed
    by Microsoft. `C#` is also an object-oriented programming language, meaning that
    it supports concepts like the use of classes, objects, inheritance, polymorphism
    etc. To program in `C#`, you need the `.Net` framework. This framework was also
    developed by Microsoft. You also need an integrated development environment (IDE).
    `Visual studio` is the common IDE used for programming in `C#`. You can get its
    free edition online. The `.Net` framework can only run on the Windows operating
    system. This means that if you are using Linux or Mac OS, you have to look for
    an alternative so as to be able to program in `C#`. You can use `Mono`, an open
    source framework that acts as an alternative to the `.Net` framework. It can be
    used on both Linux and Mac OS.


    `C#` is an easy programming language, making it good even to the beginners in
    programming. One only needs to setup the environment and start writing and running
    their `C#` code. You can use `C#` alone to develop a complete computer application.


    If you enjoyed getting started with `C#`, there is so much more to learn and do
    with this wonderful language. Be sure to continue your journey with the second
    book in the series, which looks at slightly more complex topics while still being
    beginner friendly. `C#` is a valuable programming language with a large array
    of uses. It is practical, efficient, and extremely easy to use. It will be a great
    asset and reference point for your future in programming. If you can think it,
    you can create it. Don’t be afraid to try something new. Good luck and happy programming!

