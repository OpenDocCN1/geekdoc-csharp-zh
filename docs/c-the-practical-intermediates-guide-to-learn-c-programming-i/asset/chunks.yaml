    如果你想防止用户访问某个元素，就可以使用这个修饰符。然而，它也允许所有子类在需要时访问该类的元素。正如你所看到的，根据你希望类在许可访问权限方面的私有化程度，这些元素中的每一个元素的工作方式都略有不同。如果你想确保该类保持私有，并且不允许任何其他事物或人获取或使用这些信息，那么在
    `private` 设置下工作显然是你的最佳选择。但是，如果你需要其他类具有处理这个特定类的能力，那么将其更改为 `public` 修饰符也是完全可以的。编写程序时，请思考哪种修饰符对你的代码最有效。如果你没有在类之前放置任何一个这些修饰符，它将默认为私有类，这并不是什么坏事。但如果你觉得其他选项对于编写你的代码最好，那么你必须确保将它们写在类中，以避免以后出现问题。


    ## 关于类的结语


    在编写代码时，这些类的重要性无论如何强调都不为过。它们帮助你保持代码整洁和有序，并确保你可以轻松地从代码中提取出所需的内容。这会让工作变得简单得多。你的代码会运行得更好，你会发现编写自己的代码甚至并不那么困难。在选择与你编写的类相关的对象时，你必须记住，这些对象组合在一起必须是符合逻辑的。你应该让别人（比如朋友或熟悉编程的同事）看看这个类，并认同这些对象组合在一起是有意义的。这并不意味着这些对象必须完全相同，但它们至少要在某些方面是相关的。


    例如，如果你有一个名为“玩具 (Toys)”的类，你并不是把同一个玩具放进去并任置于不管。你可以在里面包含各种“玩具”或其他对象，但必须遵循某些规则。这适用于你任何想要使用的类。你可以有一个关于蓝色物体的类、一个关于动物的类，以及一个关于车辆类型的类。只要放在里面的对象彼此匹配，就意味着你所做的一切都是正确的。


    花时间学习对象是非常重要的，因为它们对于确保你的代码按照你想要的方式运行至关重要。它们提供了组织代码的工具，并确保其运行极其出色。尝试本指南中的几种不同代码，一旦你尝试编写自己的代码，你就会很快发现它们的效果有多好。


    ## 结论


    这真的只是你 C# 之旅的开始。还有非常多需要学习的内容，你还可以走得更远；这仅仅是冰山一角。你已经学习了语法和语言规范；你学习了程序的组成部分以及如何让事情变得复杂。任何计算机编程语言最重要的部分都是逻辑方面。是的，你可能已经学会了如何遍历数组，就像查看购物清单一样。但是，如果有人要求你获取一张图像并处理它，你知道如何做吗？你知道如何缩放它？旋转它？翻转它？通过使用
    API 和你的大脑，你可以解决这个问题。


    真正的编程要求你使用大脑的逻辑部分。这非常像学习一种外语。学习语言规范和语法规则是一回事，但真正的技能来自于以清晰、结构化的方式以及深思熟虑且逻辑化的方式编写语言。作为一名程序员，技能来自于能够通过编写有意义且最重要的是能够运行的代码，将你的知识和逻辑付诸实践。学习一个程序并真正理解它是非常棒的——这确实是我们最接近“魔法力量”的了。你可以无中生有，从零开始构建，并让它完全按照你的意愿执行。


    在这个系列指南中，你学习了 C# 的基础知识，虽然我不可能教你所有需要知道的一切，但我至少为你开启了一段发现之旅。我希望你现在觉得可以迈出下一步，并且准备好深入研究
    `C#` 并一直学习到你精通它为止。感谢你花时间阅读我的指南，我想借此机会祝你的 C# 之旅一路顺利。


    ## 结论


    这标志着本指南的结束。`C#` 是由微软开发的一种编译编程语言。`C#` 也是一种面向对象的编程语言，这意味着它支持如类、对象、继承、多态等概念。要在 `C#`
    中进行编程，你需要 `.Net` 框架。该框架也是由微软开发的。你还需要一个集成开发环境 (IDE)。`Visual studio` 是编程 `C#` 时常用的
    IDE。你可以在网上获得它的免费版。`.Net` 框架只能在 Windows 操作系统运行。这意味着如果你正在使用 Linux 或 Mac OS，你必须寻找替代方案以便能够在
    `C#` 中编程。你可以使用 `Mono`，这是一个作为 `.Net` 框架替代品的开源框架。它可以同时用于 Linux 和 Mac OS。


    `C#` 是一种易读的编程语言，即使对编程初学者也非常友好。你只需要设置环境并开始编写和运行你的 `C#` 代码。你可以单独使用 `C#` 来开发一个完整的计算机应用程序。


    如果你喜欢开始学习 `C#`，那么这种奇妙的语言还有很多可以学习和做的。请务必继续该系列第二本书的旅程，它涵盖了稍微复杂一些题，同时仍然对初学者友好。`C#`
    是一种用途广泛、非常有价值的编程语言。它是实用、高效且极易使用的。它将是你未来编程生涯的宝贵资产和参考点。只要你能想象到，你就能创造出来。不要害怕尝试新事物。祝你好运，编程愉快！

