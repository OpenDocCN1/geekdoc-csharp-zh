    \ }\n{ joy }\n{ sea wine }\n{ sea computer }\n{ sea joy }\n{ wine sea }\n…\n\n\
    ### 理解我们的代码\n上述代码执行成功，但存在一个主要问题。`W` 的某些子集被显示了两次。例如；{sea wine}` 和 `{wine sea}`\
    \ 是同一个子集。我们的代码遇到了重复的问题。\n\n### 我们如何克服重复？\n为了克服重复问题，我们使用如下所示的索引：\nsea → 0\nwine\
    \ → 1\ncomputer → 2\njoy → 3\n\n此外，我们将按照升序顺序使用它们的索引来生成子集。在此时，我们将避免使用 `Hash` 表并实现\
    \ `List`。这将使索引按升序排列。在选择列表后，我们的程序将查看以下内容：\n\n```csharp\nusing System;\n\nusing\
    \ System.Collections.Generic;\n\npublic class Subsets\n{\n    static string[]\
    \ words = { \"ocean\", \"beer\", \"money\", \"happiness\" };\n\n    static void\
    \ Main()\n    {\n\n        Queue<List<int>> subsetsQueue = new Queue<List<int>>();\n\
    \        List<int> emptySet = new List<int>();\n        subsetsQueue.Enqueue(emptySet);\n\
    \n        while (subsetsQueue.Count > 0)\n        {\n            List<int> subset\
    \ = subsetsQueue.Dequeue();\n            Print(subset);\n\n            int start\
    \ = -1;\n            if (subset.Count > 0)\n            {\n                start\
    \ = subset[subset.Count - 1];\n            }\n\n            for (int i = start\
    \ + 1; i < words.Length; i++)\n            {\n                List<int> newSubset\
    \ = new List<int>();\n                newSubset.AddRange(subset);\n          \
    \      newSubset.Add(i);\n                subsetsQueue.Enqueue(newSubset);\n \
    \           }\n        }\n    }\n\n    static void Print(List<int> subset) \n\
    \    { \n        Console.Write(\"[ \");\n        for (int i=0; i<subset.Count;\
    \ i++) \n        {\n            int index = subset[i];\n            Console.Write(\"\
    {0} \", words[index]);\n        }\n        Console.WriteLine(\"]\");\n    }\n\
    }\n```\n\n在通过编译器运行程序后，它将显示以下输出：\n[ ]\n[ ocean ]\n[ beer ]\n[ money ]\n[ happiness\
    \ ]\n[ ocean beer ]\n[ ocean money ]\n[ ocean happiness ]\n[ beer money ]\n[ beer\
    \ happiness ]\n[ money happiness ]\n[ ocean beer money ]\n[ ocean beer happiness\
    \ ]\n[ ocean money happiness ]\n[ beer money happiness ]\n[ ocean beer money happiness\
    \ ]\n\n### 示例 2- 电话簿中的数字排序\n这里我们有一个包含文本的文件，其中包含人员身份信息，如姓名、居住城市和手机号码。下表显示了信息：\n\
    \n| 姓名 | 城市 | 手机号码 |\n| :--- | :--- | :--- |\n| Kennedy | Nairobi | 1-234-567-8911\
    \ |\n| Silas | Lusaka | 2-345-678-9112 |\n| Joseph | Jerusalem | 3-456-789-1112\
    \ |\n| Diana | Kisumu | 4-567-891-2345 |\n| Winston | Migori | 5-678-912-3456\
    \ |\n\n**任务：** 编写代码以按字母顺序显示所有城市名称，并为每个城市按字母顺序打印所有人的姓名及其相应的电话号码。\n\n对于上表所示的示例，有许多解决方案。我们将利用在之前的主题中学习的关于数据结构的知识来解决这个问题。我们将使用\
    \ `Dot Net Framework` 中的数据结构示例。\n\n根据代码要求，我们需要对城市名称进行排序。为了实现排序，我们需要考虑数据结构。在这种情况下，我们可以考虑平衡树实现或字典实现。结果是电话簿将包含人员的姓名。我们将键（Key）设置为姓名，值（Value）设置为相应的手机号码。\n\
    \n以下是使用字典实现的程序示例：\n\n```csharp\n// 读取文件并构建电话簿\nSortedDictionary<string, SortedDictionary<string>>\
    \ phonesByTown = new SortedDictionary<string, SortedDictionary<string>>();\nStreamReader\
    \ reader = new StreamReader(\"PhoneBook.txt\");\nusing (reader)\n{\n    while\
    \ (true)\n    {\n        string line = reader.ReadLine();\n        if (line ==\
    \ null)\n        {\n            break;\n        }\n        string[] entry = line.Split(new\
    \ char[]{''});\n        string name = entry[0].Trim();\n        string town =\
    \ entry[1].Trim();\n        string phone = entry[2].Trim();\n\n        SortedDictionary<string,\
    \ string> phoneBook;\n        if (!phonesByTown.TryGetValue(town, out phoneBook))\n\
    \        {\n            // 这是一个新城市。为它创建一个电话簿\n            phoneBook = new SortedDictionary<string,\
    \ string>();\n            phonesByTown.Add(town, phoneBook);\n        }\n    \
    \    phoneBook.Add(name, phone);\n    }\n}\n\n// 按城市打印电话簿\nforeach (string town\
    \ in phonesByTown.Keys)\n{\n    Console.WriteLine(\"Town \" + town + \":\");\n\
    \    SortedDictionary<string, string> phoneBook = phonesByTown[town];\n    foreach\
    \ (var entry in phoneBook)\n    {\n        string name = entry.Key;\n        string\
    \ phone = entry.Value;\n        Console.WriteLine(\"\\t{0} - {1}\", name, phone);\n\
    \    }\n}\n```\n\n如果编译器运行代码，将显示相应的输出：\nTown Portland:\nMary - 1-234-765-1983\n\
    Town San Antonio:\nLaura - 1-454-345-2345\nPaul - 1-535-675-6745\nTown Virginia\
    \ Beach:\nDonna - 1-387-387-2389\nKenneth - 1-541-754-3010\n\n### 总结（如何选择合适的数据结构）\n\
    在目前的学习阶段，显然数据结构的选择取决于所编写程序的目标。在另一个场合，我们注意到可以通过组合数据结构来实现特定的情况和结果。\n\n在选择特定的数据结构之前，自己问自己几个问题。这些问题包括：\n\
    * 我在程序中将执行哪些操作？\n* 要执行的操作需要哪种类型的结构？\n* 我熟悉 `C#` 编程语言中存在的所有数据结构吗？\n* 我的程序需要单一数据结构还是多个数据结构的组合？\n\
    \n"
