    In conclusion, the choice of data structure is an important step. It is advised
    that before you choose a particular data structure you should design an algorithm.
    Never start by choosing the data structure back to the algorithm.


    # Chapter 3: How to Define Your Classes in C#


    Classes are one of the most important things that we are able to do when it comes
    to the C#` language, and other languages as well, and it can make sure that our
    code is going to work the way that we want. Let’s take a look at what we are able
    to do when it is time for us to really work on defining the classes that are found
    in this language.


    ## How to Work with These Classes


    When you are ready to work with the C#` programming language, the class is going
    to be important because it is the part that is able to define the types of the
    object, and the types of the data, that you will be able to use right in that
    point in the program. The object can help us contain the information that will
    define the class or the container that, that the object is going to be found in.


    These classes are great because they will hold onto a lot of the information that
    we need at this time. Not only will they hold onto the objects, but they can hold
    onto information that describes the features and the behavior of those objects.
    This is all of the behaviors that we would want the object to handle as we go
    along. When we are working with the OOP languages, you will want to work with
    methods that can help us with this.


    So, the first thing that we need to take a look at here is some of the components
    that are going to show up in the class. With these classes, there are going to
    be a number of different components that will come into play when it is time to
    take care of these classes. There are a few parts that we can pay attention to
    when it is time to handle the class including:


    *   **Declaration**: this is the line that will declare the identifier of the
    class.

    *   **Body**: just like with methods, the classes are going to have a single body.
    You will need to define the body right after you make the declaration. The body
    is the statement, or several statements, that are found between the curly brackets.
    An example of this is:

    ```csharp

    class Example{//This is the body of the “Example” class.}

    ```

    *   **Constructor**: This is the part that will allow you to create a new object.
    An example of this is:

    ```csharp

    Public Sample(){//Insert what you want to say here.}

    ```

    *   **Fields**: these are the variables that you will declare within your class.
    The fields are going to contain the values that will represent the exact state
    of the object they are trying to get to.

    *   **Properties**: this part will describe the different attributes of the class.
    Many programmers will write the class properties right inside the field of their
    chosen object.

    *   **Methods**: a method is basically a named block of code that is executable.
    It is able to complete some tasks and then will allow objects to attain the right
    behavior. It can also execute the right algorithms that are present inside the
    codes.


    Before we dive much more into these classes and start to create one of our own
    classes, you should make sure that there is already some object that is able to
    fit inside. You can do this with the help of a `new` keyword and then you can
    add in all of the constructors that you will need to work with.


    When we are creating these codes in the C#` language, you will not be able to
    do any manipulation on the objects that you are trying to create directly. Instead,
    you will need to be able to assign the objects over to the right objects ahead
    of time so that you can handle all of the manipulations that you want later without
    problems. Remember that when you would like to access these methods and the properties
    that go with the object, you will need to indicate to the compiler which identifier
    will go with the object, and then make sure the dot operator is there.


    ## Organizing the Classes


    It is important here for us to learn the proper manner to use in order to organize
    the classes that we want to work within this kind of language. There is mainly
    just one rule that we want to follow to make sure that this works and that rule
    is that we need to make sure that the classes are saved as a `.cs` file. This
    makes them easier to find and work on later when we would like to pull them out.


    Technically, the C#` language is going to allow us to save all of the classes
    that we will make in a program in just one big file and the compiler is going
    to be able to read through it all without an error. But there are going to be
    a lot of programmers who find that saving their classes in their own individual
    files makes it easier to bring out the classes when you need them later, and can
    keep things more organized. You can choose through which method you like working
    with here.


    Another thing that we are going to use here to gain some more familiarity with
    when working in C#` is the `namespace`. This is going to be a set of classes that
    are going to be related in some manner. The way that these will relate with one
    another is going to change based on the situation of how we use this, but they
    should make sense as to why they are related. These could include their classes,
    structures, interfaces, and even some of the information that is placed inside
    of it. It is even possible for us to take a few of these classes together and
    make our own `namespace`, even if they are sorted out into different parts of
    the memory of the computer.


    If you are looking to create a new `namespace` on some of the codes that you worked
    with previously, you need to make sure that the directive of `using` to make things
    a little bit easier. Most programmers are going to be able to find that it is
    easier to put into the very first lines of our file. This ensures that you don’t
    accidentally forget about these later on. After you have been able to insert this
    directive, then you can go through and declare the `namespace`.


    ## How to Access Our Classes


    The final thing that we are going to work with when it comes to our classes is
    how to access these. C#` is going to allow us to have some support from four different
    modifiers when it comes to who is able to access each of the classes we have.
    these are going to include `protected`, `private`, `internal`, and `public`. These
    modifiers are going to make it easier to control who is able to see each of the
    elements that are found in that class you are working with. The best way to make
    sure that each of these is going to work will include:


    *   **private**: this is the modifier that will place some strict restrictions
    on one of your classes. If the class is tagged as a `private` class, it will not
    be accessible by the other classes in the code. The C#` language will use this
    as the default modifier if you do not place anything else there. This can help
    to avoid problems if you forget to add on that modifier.

    *   **public**: you can also choose to make the class `public`. This means that
    the modifier will tell other classes that they are able to access this class.
    This modifier is going to take away all the limitations about how visible this
    class is to all the others.

    *   **internal**: if your code has the `internal` modifier on it, this means that
    this class is going to be accessible, but only to the files that fall in the same
    project.

    *   **protected**: this is the modifier that you will use if you would like to
    prevent a user from accessing the element. However, it also allows all the descendant
    classes to have access to the elements of that class if they need it.

