    This is called unboxing  However, if o does not refer to a boxed int, there has
    been a type mismatch and the cast will fail.  InvalidCastException is invoked.
    The following illustrates an unboxing cast that fails:Circle c = new Circle(42);object
    o = c; // fails to box since Circle is a reference variableint i = (int)o; //
    compiles ok but throws an exception @ run timeNote that boxing and unboxing are
    expensive operations because of the quantity of checking that is required and
    the need to allocate additional heap memory. Boxing is useful but overuse will
    really negatively impact the performance of your pro­gram.Casting data safelyBy
    utilising a cast, you can in your opinion specify that the data referenced by
    an object has a specific type and it is safe to reference the object by using
    that type.  It is important to note that it is of your opinion. The C# compiler
    will not check that this is the case, but the runtime will. If the type of object
    in memory doesnt match the cast, the runtime will throw an InvalidCastException. 
    You should expect this exception and and deal with it appropriately should it
    occur.In saying that, catching an exception and attempting to recover in the event
    that the type of an object is rather an unwieldly approach. C# offers two really
    useful operators that can help you perform casting in a much more elegant manner:
    is and as operators.The is operatorYou can utilise the is operator to authenticate
    that the type of an object is what you assume it to be, like so:WrappedInteger
    wi = new WrappedInteger();. . .object o = wi;if (o is WrappedInteger){WrappedInteger
    temp = (WrappedInteger)o;// This is safe;o is a  WrappedInteger. . .}The is operator
    accepts two operands: the left - a reference to an object, the right – a type. 
    Should the type of the object, referred to on the heap, has the specified type,
    it evaluates to true; or else, it evaluates to false. The prior code tries to
    cast the reference to the object variable o only if it knows that the cast will
    be successful.The as operatorThe as operator achieves a similar role to is but
    in a slightly condensed method. You utilise the as operator like so: WrappedInteger
    wi = new WrappedInteger();. . .object o = wi;WrappedInteger temp = o as WrappedInteger;if
    (temp != null){ . . . // Cast was a success !}The as operator is similar to the
    is operator in that it takes an object and a type as its operands. The runtime
    at­tempts to cast the object to the specified type. If the cast is a success,
    the result is returned and is assigned to the WrappedInteger variable.  Should
    the cast fail, then the as operator appraises to the null value and instead assigns
    that to temp.Chapter 6        EnumerationsAn enum is a value type that the developer
    can declare.  The key characteristic of an enum is that it declares at compile
    time a set of possible constant values that can be referred to by name.  The subsequent
    is an example of an enum:enum Season { Spring, Summer, Autumn, Winter }Once you
    have declared an enum, you can use it in the exact same way as any other type.
    That is, if the name of your enum is Season then you can create variables, fields
    and parameters of type Season as demonstrated here:enum Season { Spring, Summer,
    Autumn, Winter }class Example{public void Method(Season parameter) // method parameter{Season
    localVariable; // local variable. . .}private Season currentSeason; // private
    field}In order to read an enumeration, you must assign a value to it. You can
    assign a value that is defined by the enumeration only to an enumeration variable,
    as is illustrated here:Season colourful = Season. Autumn;Console.WriteLine(colourful);
    // writes out ‘Autumn''You can then assign the null value, as well the values
    defined by the enumeration, to the variable:Season? colourful = null;StructuresClasses
    specify reference types that are solely created on the heap.  However, on some
    occasions the class may have so little data that the overhead of managing the
    heap turns out to be disproportionate. In such cases, it is best to define the
    type as a structure which is a value type. Since structs are stored on the stack,
    as long as the structure is reasonably small, the memory management overhead is
    often reduced.A structure is similar to a class in that it can have its own fields,
    methods, and constructors.Declaring a structure is similar to that of a class. 
    You utilize the keyword struct then use the name of the type, then followed by
    the body of the structure, between opening and closing braces. Here for example
    is a structure named Time that contains three public int fields named hours, minutes,
    and seconds: struct Time{public int hours, minutes, seconds;}As per classes, it
    is not recommended to make the fields of a structure public in most cases; as
    there is no way to control the values held in public fields. Anyone could for
    example, set the value of minutes or seconds to a value greater than 60.  A better
    idea is to make the fields private and provide your structure with constructors
    and methods to initialize and manipulate these fields, as shown in this example:struct
    Time{private int hours, minutes, seconds;. . .public Time(int hh, int mm, int
    ss){this.hours = hh % 24;this.minutes = mm % 60;this.seconds = ss % 60;}public
    int Hours(){return this.hours;}When you copy a value type variable, you get two
    copies of the value. With reference types however, once you copy a variable of
    reference type, you get two references to the said object. In summary, use structures
    for small data values for which it’s just as or nearly as efficient to copy the
    value as it would be to copy an address. Utilise classes for larger more complex
    data where copying is too inefficient.Differences between structures and classesSyntactically
    a structure and a class are somewhat alike, although there are a few significant
    differences.  Firstly, its impossible to declare a default constructor (i.e. a
    constructor with zero parameters) for a structure. In the next example the code
    would compile if Time were a class, but since Time is a structure, it doesn’t:struct
    Time{public Time() { . . . } / Results in compile time error…}Secondly in a class,
    you can initialize instance fields at their point of declaration. In a structure,
    you cannot. In this next example, the code would compile if Time were a class,
    but because Time is a structure, it triggers a compile-time error:struct Time{private
    int hours = 0; // Results in compile time errorprivate int minutes;private int
    seconds;. . .}The main differences between a structure and a class as summarized
    here:QuestionStructureClassWhat type is it?Value type.Reference type.Are instances
    on the Structure instancesClass instances known asstack or the heap?known as values
    & liveobjects & live on the heap.on the stack.Can you declareNo.Yes.a default
    construc­tor?If you declare your ownconstructor, will the compilerstill generate
    the default constructor?Yes.No.Will the compilerautomatically initialize afield
    for you in the constructor if you don’t?No.Yes.Can you initialize instancefields
    at their point of declaration?No.Yes.Chapter 7        Decision-makingThere are
    many situations when you require a block of statements to be executed only if
    a particular condition is satisfied or conversely, if the condition concerned
    is not satisfied. The implementation of such programming scenarios require decision-making
    constructs. C# supports many decision-making constructs; most of which are variations
    of the classic if…else construct. All these decision-making elements of the C#
    programming language are described in this chapter.  If StatementThe if statement
    is the most basic decision-making construct that tests the condition, which appears
    in the if statement. If the condition is found true, the block of statements that
    follow the if statement is executed. On the other hand, if the condition is false,
    the if block is simply ignored by the system and execution begins from the first
    statement that lies outside the if block. Sample implementation for the if statement
    is given below. using System;namespace ConditionalStatements{class DemoIf{public
    static void Main(string[] args){int num = 5;if (num < 5){Console.WriteLine("Inside
    If Block”);}Console.WriteLine("If Executed.");}}}The output for this code is shown
    in the image given below. If Else StatementThe if else is a modified version of
    the standard if construct that tests the condition, which appears in the if statement.
    If the condition is found true, the block of statements that follow the if statement
    is executed. On the other hand, if the condition is found false, the block of
    statements that follow the else statement is executed. Sample implementation for
    the if else statement is given below. using System;namespace ConditionalStatements{class
    DemoIf{public static void Main(string[] args){int num = 5;if (num < 5){Console.WriteLine("Inside
    If Block”);}else{Console.WriteLine("Inside Else Block”);}Console.WriteLine("If
    Else Executed.");}}}The output for this code is shown in the image given below. Nested
    If StatementsThere may be situations where you may be required to test many conditions;
    each of which being a sub-part of the main condition. In other words, if you have
    a programming scenario that needs to perform a block of statements if the vehicle
    is an Audi car. So, firstly, you will need to put a condition that tests if the
    vehicle is a car. If this condition is found true, the system must check for a
    condition that tests if the car is an Audi. This requires two if statements, one
    inside another, or a nested if statement. You can have multiple if statements,
    one inside another to test multiple conditions. There is no limit of the amount
    of nesting that can be performed for if. However, the higher the number of ifs
    inside one another gets, the time complexity of the program increases. Sample
    code for implementing the nested if is as follows –using System;namespace ConditionalStatements{class
    DemoIf{public static void Main(string[] args){int num1 = 5;int num2 = 2if (num1
    == 5){Console.WriteLine("Inside If Block 1”);if (num2 == 2){Console.WriteLine("Inside
    If Block 2”);}}Console.WriteLine("Nested If Executed.");}}}The output generated
    upon the execution of this code can be seen in the image given below. Switch StatementIn
    order to mitigate the complexity issues associated with nested if statements,
    C# also provides switch statement, which can test one variable for multiple values
    and execute corresponding statements for the same. This construct internall creates
    a table, which is used for making execution faster. The syntax for implementing
    switch statement is as follows. Switch (variable_to_be_tested) {Value_1:Statement;break;Value_2:Statement;break;Value_3:Statement;break;default:Statement;break;}Nested
    Switch StatementsThere may be programming scenarios that may require you to test
    multiple variables and this shall require multiple nested switch statements. C#
    allows programmers to use nested switch statements and there is no limit on the
    amount of nesting that can be performed. Conditional OperatorTo simplify the conditional
    construct, C# also provides a conditional operator (?:).Chapter 8        ArraysIf
    you wish to store many elements of the same type and don’t want to create an individual
    variable for each of them, then the best data format available for you is an array.
    The standard definition of array is a collection of elements that are of the same
    data type. Moreover, the size of the elements is fixed and the order of the same
    is sequential in the way that contiguous memory is allocated for the storage of
    the array elements.One of the best ways to understand arrays is to see it as a
    collection of variables of the same type. The name of the array points to the
    first element of the array. The index of the first element is 0\. Therefore, the
    first element of the array is name_of_array[0]. Subsequent elements of the array
    can be accessed by mentioning the index of the element by using the syntax, name_of_array[0].  Declaring
    ArraysIn order to declare an array, you need to use the syntax given below –data_type[]
    name_of_array;Here, data_type is the data type of the array, name_of_array is
    the identifier that will be used for accessing the array and its elements and
    [] is the rank or number of elements in the array. An example of array declaration
    is given below. double[] bal;Initializing ArraysWhile the array declaration statement
    tells the compiler that an array of this name is to be created, memory for array
    is actually allocated when the array is initialized. It is only after array initialization
    that values can be assigned to the elements of the array. Array is initialized
    using the new keyword in the following manner –double[] bal = new double[5];This
    statement initializes the array named bal of the type double to have 5 elements. Assigning
    ValuesLike we mentioned, individual elements of the array can be accessed by mentioning
    the index of the concerned element, inside square brackets, next to the array
    name in the following manner –bal[0] = 4.5This statement initilizes the first
    element of the array bal to the double value 4.5\. The above-mentioned method
    initializes individual elements of the array to specific values. Initialization
    and assignment can be combined together in the following manner –double[] bal
    = {4.5, 66.7, 111.6, 34.0, 98.7};Alternatively, you may also perform this operation
    in the following manner –double[] bal = new bal[5] {4.5, 66.7, 111.6, 34.0, 98.7};double[]
    bal = new bal[] {4.5, 66.7, 111.6, 34.0, 98.7};If you wish to copy an array into
    another array, you can directly use the statement similar to the one given below. double[]
    cp_bal = bal;This statement creates an array cp_bal that points to the same location
    as that of bal. It is important to mention here that C# also performs auto-initialization
    of elements depending on the data type of the array. For instance, if an int array
    is created, all its values are initialized to 0. Accessing ElementsJust like array
    elements are initialized using their index, array elements can be accessed an
    re-initialized using the name of the array followed by the index of the element,
    which is enclosed within square brackets. An example of this is given below. double
    val = bal[4];This statement assigns the value of the last element of the array
    to the variable val. The sample code given below demonstrates the working of arrays
    in C#. using System;   namespace DemoApp {      class DemoArray {            static
    void Main(string[] args) {           int []  num = new int[5]; /* num is an int
    array of 5 elements */           int x,y;for ( x = 0; x < 5; x++ ) {              num[
    x ] = x + 100;           }                  /*Print the values of array elements*/    for
    (y = 0; y < 5; y++ ) {              Console.WriteLine("Element[{0}] = {1}", y,
    num[y]);           }           Console.ReadKey();        }     }}The output generated
    upon the execution of this code is shown below. Foreach LoopC# provides a special
    looping construct that uses the contiguous nature of arrays for performing iterations.
    The loops iterates through the elements of the array and its syntax is as follows
    –foreach (int var_name in array_name){…}Here, var_name is the looping variable
    and array_name is the name of the array, which needs to be involved for looping.
    Sample implementation of this looping construct is given below. using System;   namespace
    DemoApp {      class DemoArray {            static void Main(string[] args) {           int
    []  num = new int[5];for ( int x = 0; x < 5; x++ ) {              num[x] = x +
    100;           }foreach (int y in num ) {              int x = y-100;              Console.WriteLine("Value
    of Element[{0}] = {1}", x, y);}           Console.ReadKey();        }     }}The
    output generated upon the execution of this code is shown below. Arrays in C#C#
    supports multi-dimensional arrays and the simplest form of the same is 2-dimensional
    arrays. Two dimensional arrays are defined and accessed using the format, array_name[][].
    Every new dimension adds a square bracket combination in front of the array name.
    C# also supports the concepts of jagged arrays or arrays of arrays. Besides this,
    arrays can also be passed as parameters to functions. Lastly, C# has a defined
    class in the System namespace for arrays. This is the base class for all arrays,
    with inbuilt functions.Chapter 9        Creating Objects and Making Them WorkClasses
    and objects are really important to how C# and other object-oriented programming
    languages will work. This is a pretty simple topic that you won’t have trouble
    understanding, but this doesn’t mean it’s something you should ignore, it is actually
    very important that you should learn about it because it will help you learn how
    all of these works. This chapter will take the time to carefully look at how you
    can work with objects so that they will function the way they should in your code.  Classes
    and objectsThe first thing that we will spend our time talking about are the objects
    which are used in this programming language. Programming has changed a lot over
    the past few years, and this has changed how programmers create their new computer
    applications. The newest form of programming, known as ‘OOP’ or object-oriented
    programming, is the newest idea that most modern coding languages rely on to get
    the coding done. There are a lot of components that go with this, but it basically
    makes it easier to sort out and use the coding language.  What is OOP?As a beginner,
    you may be curious as to what OOP means and how it’s relevant to your coding.
    OOP is a style of coding that relies solely on objects to get the program to work.
    OOP will provide you with a model type that is based on how things would work
    in the real world and then you would use this idea and implement it in the codes
    that you are writing. In some of the older coding languages, you had to concentrate
    on abstract ideas to help you to get the coding done. This may sound like a great
    idea, but it does make things more difficult in the long run. With OOP, you have
    to work with real objects, rather than these abstract ideas, which makes the coding
    so much easier. This is the approach that most modern programming languages take
    and it does make it much easier for the beginner to write their own codes, create
    their own program, and even solve some of their own problems they might encounter
    as they go about their programming. ObjectsIn this section, we will spend some
    time working with objects to learn more about them. Programmers use digital objects
    to help represent the physical objects that they want to place inside of their
    code. While you are working with an OOP language, it is important to remember
    that these objects have more than a few characteristics that you should remember.
    These include: '
