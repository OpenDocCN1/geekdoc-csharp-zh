  trans: '


    # 状态 (State)

    这些是定义对象的特征。可以是通用的，也可以是特定的。


    # 行为 (Behavior)

    这些是声明能够执行的所有动作的特征。为了让我们准确理解这一切是如何运作的，我们需要来看一个例子。假设我们正在观察一个球。这个对象的状态或定义其特征的特质包括它的颜色、材质和大小。这只球的行为指的是这只球能够做什么，例如弹跳、滚动等等。当你使用面向对象编程（OOP）语言时，你可以轻松地将技术和信息结合起来，并将它们视为同一整体进行处理。编程对象随后将匹配它在现实世界中的行为或外观，并且它会保留这些动作和信息以备后之用。


    ## 类 (Classes)

    虽然我们将在稍后的章节中进一步讨论这一点，但在现在了解一下这些“类”是非常重要的。在这门语言中，“类”指的是定义上述对象所有特征的条目。这些类负责为你提供一个模型或结构，以便你能够有效地定义对象的本质。这些类通常被认为是
    OOP 语言的基础，并且与对象紧密相关。另一个需要注意的点是，你使用的每个对象也可以代表一个特定的类。让我们来看看它是如何运作的，以便让你更容易理解。例如，我们有一个命名为
    `Toys` 的类，而对象将是 `Ball`。在这个示例中，球是你所处理的 `Toy` 类的一个实例。然而，该类还将定义你添加到“类”中的所有“玩具”（包括“球”在内）的状态和行为。“类”听起来可能很复杂，但它们会让你的代码组织变得更容易处理，许多人经常将其视为几乎任何程序的基础。它们所持有的信息对于那些查看类内部的人来说是有意义的，这样他们就能准确了解它是什么。例如，如果你有一个命名为
    `Toys` 的类，其他用户可以访问或查看该类，并看到放在代码中的所有项目或对象实际上都属于那里。它们不必完全相同，但将它们放在同一个类中应该是合逻辑的。类的功能是定义对象的行为，例如你希望该对象能够执行的动作类型。对象也将会有自己的特征或属性。你会发现属性以不同变量的形式出现在类体中，而行为则由位于类内部的不同方法定义。让我们通过检查之前说过的
    `Toy` 类来看看它是如何运作的。当应用这些内容时，你将获得尺寸和颜色作为属性。为了让其起作用，你需要提取并使用 `move()` 和 `stop()`
    方法。


    # 如何在代码中使用这些类

    我们已经花了一些时间讨论类以及你如何让它们在你的代码中运行，但现在我们需要花更多时间观察它们在整个程序中是如何运作的，以及它们对于改变你在代码中编写的内容有什么用处。当你使用
    C# 编程语言时，你需要借助 `class` 关键字来定义所有的类，这不仅是为了确保一切运行正常，也是为了帮助使变得清晰简单。当你开始编写代码并输入 `class`
    单词后，这时你应该指定你希望与变量关联的标识符，以及有助于确保这一切运行正常的方法。至于如何确保这一切保持简单，由于你正在处理这类代码，有一些特定的部分是你需要使用的。在
    C# 中工作时，你需要添加到类中的不同部分包括：


    ### 字段 (Fields)

    这些是任何属于特定数据类型的变量。


    ### 方法 (Methods)

    你可以使用这些方法来操作数据。


    ### 属性 (Properties)


