  trans: "\n\n这是一个由于构造函数方法而发生的过程。对于我们在上面编写的代码，我们立即设置的参数是“类构造函数”的参数。这确保了对象将留在你选择创建的类中，并为该对象提供正确的特征，使其能够正常运行。\n\
    \n### 释放你的对象\n你需要关注的一点是学习如何释放你正在处理的对象。你将使用的其他某些语言会要求你手动遍历并释放对象，但在使用 C# 时，并不是必须的。这意味着你可以释放系统中任何占用过多内存的对象，而无需通过并手动销毁它们。你只需要使用可以在\
    \ `.NET` 框架内部找到的 `CLR` 系统来实现这一切。\n\n当你使用 `CLR` 系统进行工作时，计算机可以自动检测并释放未被引用的对象。为这些对象保留的内存现在可以再次使用，你可以将其用于在代码内部创建的其他对象或变量。如果你想释放一个对象，应该停止并学习如何销相应的引用。以下是如何执行此操作的示例：\n\
    \n```\nsomeBook = null;\n```\n\n这个过程并不意味着它会删除该对象，但它会确保所有对该对象的引用都被移除，这样 `CLR` 就可以在你处理完之后进行遍历并为你执行删除。这是一个非常棒的过程，因为它将帮助限制代码中出现的问题数量，并消除代码中可能出现的某些错误。\n\
    \n### 构造函数\n我们在本章中讨论的最后一个主题是“构造函数”。这些构造函数基本上是程序在创建新对象时运行的方法。使用这些构造函数背后的想法是你可以使用它们来初始化新对象的数据。当你使用这种方法时，不会有任何价值的内容显示。此外，此构造函数将使用与它所属类相同的名称，这意味着你不需要在过程中尝试匹配几个随机名称。在\
    \ C# 中处理构造函数工作时，你还可以选择为它们分配正确的参数。\n\nC# 自带的构造函数可以像你使用的该编程语言中的任何方法一样接受参数。你可以在类中设置好几个构造函数，但你始终需要检查构造函数是否来自不同类型和数量的参数。这将有助于确保每个参数都是唯一的。\n\
    \n在使用构造函数时，重要的是记住，每当你类中创建一个全新的对象时，这些构造函数就会运行。如果你正在处理的类内部有不同的构造函数，你可能想知道当代码中创建新对象时是哪个构造函数在运行。这种编程语言可以根据你正在操作的内容挑选出正确的构造函数，因此你不需要提供所有这些信息。编译器将接管，这样一切都会保持井然，而你不必为此感到太大的压力。\n\
    \n现在我们已经讨论了一部分构造函数，让我们来看一个在 C# 中它是如何工作的示例：\n\n```csharp\npublic class Device{\n\
    \    private string type;\n    private string size;\n    // 一个没有任何参数的构造函数\n  \
    \  public Device(){\n        this.type =\"laptop\";\n        this.type = “large”;\n\
    \    }\n    //一个带有两个参数的构造函数\n    {\n        this.type = type;\n        this.size\
    \ = size;\n    }\n}\n```\n\n我们刚刚设置的参数可以帮助程序确定需要完成的任务或函数是什么。它还负责帮助 C# 编译器确定你想让程序使用的构造函数。\n\
    \n### 如何借助 C# 定义类\n在处理任何编程语言时，类都至关重要，因为它们执行了各种有用的功能，这在 C# 中也是如此。所以，让我们花些时间看看如何在\
    \ C# 语言中定义类。\n\n#### 类工作的基础\n当你使用一种编程语言时，类是定义对象类型和你在程序该点可以使用的数据类型的部分。对象是包含定义类的信息或承载它的容器。这些类可以持有大量信息，并且可以被用于描述对象的行为。这些都是对象能够执行的所有行为。在处理\
    \ OOP（面向对象编程）语言时，你想使用有助于描述对象行为的方法。\n\n#### 类的组件\n当你处理一个类时，某些不同的组件将发挥作用帮助你处理这些类。每个类都包含几个不同的部分，包括：\n\
    \n*   **声明 (Declaration)**：这是声明类标识符的行。\n*   **主体 (Body)**：就像方法一样，类有一个单一的主体。你需要在做出声明之后定义主体。主体是位于大括号之间的语句或多个语句。这方面的示例是：\n\
    ```csharp\nclass Example{\n    // 这是 “Example” 类的主体。\n}\n```\n*   **构造函数 (Constructor)**：这是允许你创建新对象的部分。这方面的示例是：\n\
    ```csharp\npublic Sample(){\n    // 在此处插入你想说的内容。\n}\n```\n*   **字段 (Fields)**：这些你在类内部声明的变量。字段包含了代表它们试图达到的对象精确状态的值。\n\
    *   **属性 (Properties)**：这部分将描述类的不同属性。许多程序员将直接在所选对象的字段内部编写类属性。\n*   **方法 (Methods)**：（定义对象行为的函数）。\n\
    \n"
