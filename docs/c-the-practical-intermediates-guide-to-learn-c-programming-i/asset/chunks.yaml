  trans: "\n要获取变量或数据类型的精确大小，你可以利用 `sizeof` 运算符。声明 `sizeof(<data type>)` 会产生该数据类型或变量以字节为单位的大小。下面是一个示例，阐述了下文将讨论的概念：\n\
    \n```c\n#include <limits.h>\n#include <stdio.h>\nint main() {\n    printf(\"Data\
    \ type char (size in bytes): %d \\n\", sizeof(char));\n    return 0;\n}\n```\n\
    编译并执行此代码后，你将得到以下输出：\nData type char (size in bytes): 1\n\n## 浮点数据类型\n以下是属于此类别的的数据类型列表。此外，我们还列出了它们占用的存储空间、范围和精度值供你参考。\n\
    \n- **float**\n    - 分配内存：4 字节\n    - 范围：1.2e-38 到 3.4e+38\n    - 精度：6 位小数\n-\
    \ **double**\n    - 分配内存：8 字节\n    - 范围：2.3e-308 到 1.7e+308\n    - 精度：15 位小数\n\
    - **long double**\n    - 分配内存：10 字节\n    - 范围：3.4e-4932 到 1.1e+4932\n    - 精度：19\
    \ 位小数\n\n名为 `float.h` 的头文件定义了允许你使用这些数据类型值的宏。以下代码将允许你找到你的系统中相关数据类型所分配的精确内存（字节数）。\n\
    \n```c\n#include <float.h>\n#include <stdio.h>\nint main(){\n    printf(\"Allocated\
    \ Memory for float : %d \\n\", sizeof(float));\n    printf(\"Precision: %d\\n\"\
    , FLT_DIG );\n    printf(\"Max Range Value: %E\\n\", FLT_MAX );\n    printf(\"\
    Min Range Value: %E\\n\", FLT_MIN );\n    return 0;\n}\n```\n编译并执行此代码后，你将得到以下输出：\n\
    Allocated Memory for float : 4\nPrecision: 6\nMax Range Value: 3.402823E+38\n\
    Max Range Value: 1.175494E-38\n\n## void 类型\n`void` 数据类型表示没有可访问的值。它被用于以下三种情况之一：\n\
    \n- **函数返回 void**\n你可能已经经常注意到将 `void` 数据类型用作函数的返回类型。如果没有，随着你 C 语言经验的增加，你会看到它的广泛使用。`void`\
    \ 数据类型意味着函数将不返回任何内容。此类实现的示例如下：\n```c\nvoid print(int);\n```\n\n- **作为 void 的函数参数**\n\
    C 语言中有不同的函数不接受任何参数。没有参数的函数可以声明为 `void`。此类实现的示例如下：\n```csharp\nint print(void);\n\
    ```\n\n- **指向 void 的指针**\n类型为 `void *` 的指针表示变量的位置。例如，考虑以下声明：\n```c\nvoid *malloc(\
    \ size_t size );\n```\n此函数返回一个指向 `void` 的指针。换句话说，此函数可以返回指向任何类型位置的指针。你现在可能无法完全理解\
    \ `void` 数据类型的用途和意义。但是，随着学习的深入，你会发现更容易在代码中关联和使用这种数据类型。\n\n# 第 2 章：数据结构、处理与函数\n\
    \n### 数据结构的简介与意义\n在本章中，我们将学习数据结构的定义及其在 C# 编程语言中的重要性。我们将学习数据结构的重要性，以及在编程过程中何时以及如何使用它们。同样重要的是，一个出色的程序员会使用非常合适的数据结构来编写高效且有效的程序。\n\
    \n编程由两个主要部分组成：算法和数据结构。这解释了为什么这两个部分部分受到更多的关注。一个优秀的开发者或软件工程师应该是对数据结构拥有丰富技能和知识，并在编程方面表现高效的人。\n\
    \n在深入研究数据结构之前，有几个术语我们需要了解并理解，以便成为优秀的开发者。**算法复杂度**——这可以定义为一种标准，用于检查算法执行和评估的操作计数，该计数是输入数据大小的函数。这种标准通常用\
    \ `O (f)` 符号表示，称为“大 O 表示法或渐近符号”。复杂度有许多类型，如常数、对数、指数、线性、三次和二次。\n\n## 枚举、数组和结构体\n\
    \n#### 枚举\n这可以定义为一种数据类型，通过将项目等价分配给标识符（例如一个名称）来指定数量。这是通过考虑规范或枚举组件的基类型的底层模式来实现的。枚举的声明可以如下所示：\n\
    \n```csharp\nenum Months { January, February, March, April, May, June, July, August,\
    \ September, October, November, December };\n```\n\n#### 理解我们的代码\n上面的代码描述了枚举的元素，这些元素显示为常量如下所示：\n\
    ```csharp\nMonth = Month.January;\n\nif (month == Month.February)\n{\n    Console.WriteLine(\"\
    Programming with C# through the months of the year is easy!\");\n}\n```\n当为指定或枚举的项目没有显式赋值时，第一个元素始终为零。随后的元素将采用\
    \ 0 之后的连续值。另一方面，源自整型的特定值始终可以分配枚举的特定元素，如下所示：\n\n```csharp\nenum Age { Baby = 0,\
    \ Adolescence = 13, Youth = 18 };\n```\n```csharp\nAge age = Age.Adolescence;\n\
    Console.WriteLine(\"You are an adolescence at the age of {0}.\", (int)age);\n\
    ```\n此外，当分组函数特定于某组时，枚举中底层的值通常不被使用。\n\n#### 数组\n这是对相似类型或具有相似特征的项目组的表示。数组的声明取决于常量和变量。需要注意的是，一旦声明了数组长度，在声明后就无法更改，如下：\n\
    \n```csharp\n// 一个长度由常量定义的数组\nint[] integers = new int[10];\n\nint length = 0;\n\
    System.Console.Write(\"what is the length of array? \");\nSystem.Console.ReadLine(length);\n\
    \n// 这是一个数组。它的长度通过变量定义\ndouble[] doubles = new double[length];\n```\n\n#### 结构体\n\
    用于声明结构体的关键字是 `struct`。它们被视为对象的轻量级容器。它们通常适用于需要不同类型变量集合的数据。结构体可以与类比较。结构体拥有方法、构造函数和接口。其他主要区别包括：\n\
    \n- 结构体通常是值类型，而类被认为是引用类型。\n- 与类相比，结构体不能继承。\n- 与类相比，结构体需要的内存空间更少且更更。\n- 即使不需要，结构体也有强制性的默认构造函数，而类则允许隐藏构造函数。\n\
    \n结构体的声明如下：\n```csharp\nstruct Girl {\n    public string name;\n    public System.DateTime\
    \ birthDate;\n    public int heightInMtrs;\n    public int weightInGrams;\n}\n\
    ```\nPerson 结构体的用法如下：\n```csharp\nGirl dana = new Girl();\ndana.name = \"Dana\
    \ Programmer\";\ndana.birthDate = new DateTime(1975, 8, 19);\ndana.heightInMtrs\
    \ = 1.75;\ndana.weightInGrams = 50000;\n\nif (dana.birthDate < DateTime.Now)\n\
    {\n    Console.WriteLine(\"Dana Programmer is a genuine programmer!\");\n}\n```\n\
    下面的示例展示了如何在结构体中使用构造函数进行初始化：\n```csharp\nusing System;\n\nstruct Girl {\n    string\
    \ name;\n    DateTime birthDate;\n    int heightInMtrs;\n    int weightInGrams;\n\
    \n    public Person(string name, DateTime birthDate, int heightInMtrs, int weightInGrams)\
    \ {\n        this.name = name;\n        this.birthDate = birthDate;\n        this.heightInMtrs\
    \ = heightInMtrs;\n        this.weightInGrams = weightInGrams;\n    }\n}\n```\n"
