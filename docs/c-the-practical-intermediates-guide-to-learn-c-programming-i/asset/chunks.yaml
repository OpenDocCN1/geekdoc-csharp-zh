    \ class and then it will have the properties of `size` and `type.` The example\
    \ of this code is as follows:\n\n```csharp\nPublic class Book{\n    Private string\
    \ bookType:\n    Private string size;\n    Public string BookType{\n        Get{Return\
    \ this. bookType;}\n        Set{This.bookType = value}\n    }\n    public string\
    \ Size{\n        Get{Return this.size;}\n        Set{this.size = value;\n    }\n\
    \    public Book(){\n        this.bookType = “Dictionary”;\n        this.size\
    \ = “large”;\n    }\n    public book(string bookType, string size){\n        this.bookType\
    \ = bookType;\n        this.size = size;\n    }\n    public void Sample(){\n \
    \       Console.WriteLine(“ Is this a {0}, bookType)\n    }\n}\n```\n\nNow, at\
    \ first, this will look like a really complicated code to work with and you may\
    \ be worried about how you will keep all of this in order or if you can understand\
    \ how to use it at all. It is really not that complicated at all to work with\
    \ though and you can use the ideas that are inside. With this example, the `Book`\
    \ class will define two different properties, the book type, and the size. These\
    \ properties will hide the values inside the fields of the same names while the\
    \ code snippet will declare two constructors that will be generated on the `Book`\
    \ class. This code will also create a method called `Sample()`. You can use this\
    \ code for a number of different things, like adding in more characteristics if\
    \ you would like, and it doesn’t have to be limited to books, toys, vehicles,\
    \ or anything else. You can mess around with your text editor as much as you want\
    \ to try out this formula and change it around with some other classes to make\
    \ it easier to get the program to work for you.\n\n## How to create your own objects\n\
    Once you have a class in place to help you out, it is time to work on creating\
    \ some of the objects that you would like to use and place inside a class. Creating\
    \ your own object is not meant to be difficult to work with so in this part of\
    \ the book, we will take the time to have a look at the basics that you need to\
    \ know to get started.\n\n### Creating the object\nThe first thing we have to\
    \ do here is to create the object that you want to place inside an existing class.\
    \ To get this to happen, you need to make your own keywords. Usually, a programmer\
    \ will choose to assign the new object a variable so that it will stay as the\
    \ same data type as the class that you want to use. Remember that doing this won’t\
    \ copy the object over to the right variable, but it will help give the variable\
    \ a reference to the object that it is now assigned to. To make sure that this\
    \ actually works, use the following code to do so:\n\n```csharp\nBook someBook\
    \ = new Book()\n```\n\nThis is a good example that you can use because it will\
    \ take the instance of the book and assign it over to the variable that we named\
    \ `someBook`. This will ensure that the proper object will the right class as\
    \ is needed.\n\n### System classes\nIf you are new to working with the C# language,\
    \ you will find that this language already has a library that is built right in.\
    \ This library includes a lot of classes that are kind of default such as `string`,\
    \ `math`, and `console`. As you start to use this language more, you must remember\
    \ that the library is something that you can easily use and access with the `.Net`\
    \ applications. You are definitely going to love how the `.NET` framework will\
    \ do the job for you. This is because the library that you need for C# was installed\
    \ ahead of time. These classes are the parts that you can use all of the time,\
    \ and they are helpful as you start to learn some of the basics that come with\
    \ this language, such as networking, text procession, and execution. These classes\
    \ are also helpful to a beginner who has never worked in programming before because\
    \ they are prewritten and recognized by the program so you will not have to do\
    \ as much work.\n\nOne thing that you should remember when you are working with\
    \ these classes is that they will hide all the logical implementations. You need\
    \ to focus more on what your classes can do, rather than worrying so much about\
    \ the mechanics behind how they exactly do this. Because of this, the built-in\
    \ classes with C# are not something that the programmer can actually view. You\
    \ simply need to use these codes for their general purposes rather than worrying\
    \ so much about how they really work because that’s something you don’t really\
    \ have to think about.\n\n## How to assign a parameter to the object\nThis programming\
    \ language will allow you to assign some parameters to the object that you created.\
    \ This is something that’s pretty easy to work with, and you just need to have\
    \ the basic syntax in place to make sure that this will work for you. The syntax\
    \ that you need to use is this:\n\n```csharp\nBook someBook = new Book(“Biography”,\
    \ “large”)\n```\n\nThis code will create a new object named `someBook` and will\
    \ assign the two different parameters to it as well. With this adjustment, the\
    \ object’s `type` is now Biography while the size is now large.\n\nWhenever you\
    \ use the `new` keyword, the framework of `.NET` can complete two things:\n- It\
    \ will reserve some of the memory for this new object\n- It will initialize the\
    \ object’s data members\n"
