    this cast is subtle. The compiler sees that you’ve specified the type int in the
    cast.  It generates code to check what o actually refers to at run time. It could
    be really anything. Even though your cast says o refers to an int, it doesn’t
    mean that it actually does. If o does actually refer to a boxed int and everything
