    ### 1. Initialization of the loop variable

    The variable or the expression that is going to control the loop is going to be
    initialized in this step. It is going to be the starting point of the loop. An
    already declared variable can be used or a variable can be declared, local to
    the loop that you are currently working on only.


    ### 2. The testing condition

    The second thing that we need to focus on here is the testing condition. This
    is what we are going to use in order to execute the statements that are in the
    loop. It is going to be used in many situations in order to test the exit condition
    for the loop. It must return to us a value that is Boolean, which means we are
    going to get a result of either true or false. When the condition comes out as
    being false, then the control is going to be out from the loop, and this kind
    of loop is going to end for us.


    ### 3. Increment and decrement

    The loop variable is going to be either incremented or decremented based on the
    requirement that we put into it, and the control, when this happens, is then going
    to shift over to the testing condition again.

