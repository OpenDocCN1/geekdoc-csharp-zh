    # State

    These are the characteristics that will define the object. These can be general
    or specific.


    # Behavior

    These are the characteristics that will declare all the actions that an object
    is capable of. For us to understand exactly how all of this will work, we need
    to take a look at an example. Let''s say that we are looking at a ball. The state
    of this object or the traits that define its characteristics are things like its
    color, what the ball is made out of, and the size. The behavior of that ball would
    refer to what that ball is capable of, such as bouncing, rolling, and so on and
    so forth. When you are working on an OOP language, you can easily combine the
    technique and the information to process them as the same thing. The programming
    object will then match up to how it would behave or look when it is in the real
    world and then it will also hold onto the actions and the information until later.


    ## Classes

    While we will discuss this a little bit more in a later chapter, it is important
    to understand a little bit about what these classes are at this point. Within
    this language, the ‘classes’ refer to what defines all the characteristics of
    the objects from above. These classes are in charge of giving you a model or a
    structure so that you can effectively define the nature of the object. These classes
    are often considered the foundation of OOP languages, and they will be linked
    closely to the object. Another thing to note is that each of the objects that
    you are using can also represent one specific class. Let''s take a look at how
    this works so that it makes a lot more sense to you. For example, we have a class
    that we named `Toys` and while the object will be `Ball`. In this sample, the
    ball is one instance of that `Toy` class that you worked on. However, that the
    class will also define the state and the behavior of all the ‘toys’ that you add
    to the ‘class’ including the ‘ball.’ Classes may sound complicated, and they will
    make the organization of your code a lot easier to handle, many people often see
    them as the basis of just about any program. The information they hold onto is
    meaningful for those who will take a look inside of the class so they can understand
    exactly what it is. For example, if you have a class that you named `Toys`, the
    other users can access or look into the class and see that all the items or objects
    that were placed inside the code actually belong there. They do not have to be
    exactly the same, but putting them together in the same class should make sense.
    The classes function to define the behavior of an object, such as the kinds of
    actions you want that object to be capable of performing. The object will also
    have its own characteristics or attributes. You will see that the attributes appear
    as different variables in the body of the class while the behavior, on the other
    hand, is defined by the different methods that fall inside the class. Let''s take
    a look at how this works by examining the `Toy` class that we talked about before.
    When these are applied, you will get the size and the color as the attributes.
    To make this work, you will need to bring out and use the `move()` and the `stop()`
    methods.


    # How to use these classes in your code

    We have already spent a little bit of time talking about classes and how you can
    get them to work inside of your code, but now we need to spend some more time
    looking at how they work within the program as a whole and how they are useful
    at changing what you can write out inside of the code. When you are working with
    the C# programming language, you need to define all of the classes with the help
    of the `class` keyword to not only make sure that everything works but to also
    help make things clear and simple. After you have started with the code and you
    typed in the word `class`, this is when you should indicate the identifier that
    you would like to see with the variable and the methods that would help make it
    certain that all of this works. As for making sure that all of this would stay
    simple, there are specific parts that you need to use since you are working with
    this kind of code. The different parts that you need to add to the class when
    working in C# include:


    ### Fields

    These are any of the variables that belong to a particular data type.


    ### Methods

    You can use these methods to manipulate the data.


    ### Properties

