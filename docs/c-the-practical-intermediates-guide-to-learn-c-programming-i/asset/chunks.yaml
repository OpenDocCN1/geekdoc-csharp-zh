  trans: "\n正如你所看到的，这些元素中的每一个都将根据你对类隐私性的要求，以略有不同的方式工作。如果你想确保类保持私密，并且不允许任何其他内容获取或使用其中的信息，那么你将需要使用\
    \ `private` 设置。然而，如果你需要其他类能够处理这个特定的类，那么将其更改为 `public` 修饰符也是完全可以的。在我们学习一些程序时，你应该考虑哪种修饰符对于你所编写的代码是最合适的。如果你没有为类添加这些修饰符之一，默认情况下它是\
    \ `private`。这对于你的代码来说并不是什么坏事，但如果你有其他选项，就需要进行更改。\n\n记住，这些类在编写某些代码时是非常重要的，它们将有助于容器的良好组织，并确保你能够轻松提取代码中所需的内容。这使得你的代码运行得更好，在其他\
    \ 语言（如 `C#`）中编写代码也会变得更加容易。当你选择想要使用的循环对象时，需要记住这些对象并不总是完全相同的，但只要它们在逻辑上是合理的即可。例如，在我们之前处理过的\
    \ `Toys` 类中，你不需要把它们都放进去，只要符合规则，循环就能正常工作。只要这些对象彼此匹配，结果将没问题。\n\n在 `C#` 语言中，当你想要实现某些代码时，循环是非常重要的一部分。重要的是，我们需要查看我们想要执行的循环，但我们需要以正确的方式编写它们，并确保我们使用了正确的对象。\n\
    \n### 第 4 章：在 C# 中创建循环\n\n在许多 OOP 语言中，你会发现创建循环是一件很棒的事情，因为它允许你将大量代码整合到几行中，从而节省了时间并避免了麻烦。在本章中，我们将详细查看这些循环的本质、如何创建它们，以及可用的不同循环类型。\n\
    \n当我们谈论循环时，它是一种用于执行语句的方法，根据条件的结果，语句可能会执行很多次。有时循环只会发生几次，有时它会执行多次，这取决于你希望代码中执行执行的次数。\n\
    \n在大多数情况下，你会发现你所使用的循环被分为两类。第一类是进入控制型循环（entry-controlled loops），这些循环包括 `for` 循环和\
    \ `while` 循环。为了看到它们的工作原理，你需要在代码的开头测试相应的条件。编译器会首先检查该条件，如果是真的，它就会运行循环。这对于你将处理的大多数循环都有效，但有时意味着你的循环根本不会运行，因为条件从未被满足。\n\
    \n让我们看看适用于此的循环。第一类型是 `while` 循环。测试条件位于循环的开头，然后执行我们处理的所有语句，直到给定的条件（布尔值）满足为止。当条件被认为为假时，`while`\
    \ 循环就会停止。相反，它将移动到代码的下一个部分。\n\n处理这种代码循环并不困难。我们将查看一个处理它的示例。查看语法并进行少量实验，看看它是如何工作的。你也可以查看代码\
    \ `while` 部分，它告诉我们循环从哪里开始。\n\n```csharp\nusing System;\nclass whileLoop {\n  \
    \  public static void Main() {\n        int x = 1;\n        while (x <= 4) {\n\
    \            Console.WriteLine(\"Geeks\");\n            x++;\n        }\n    }\n\
    }\n```\n\n通过这个示例，我们创建了一个打印三次 \"Geeks\" 的循环。`while` 循环告诉语法不要运行超过三次。如果我们让循环运行四次，条件将被认为为假，那么我们就无法得到过程中期望的结果。当打印一次时，这个结果为真；打印两次和三次时也是如此。但当程序再次进入循环时，似乎再进行一次迭代并再次打印术语将我们达到四，这超过了我们的需求。\n\
    \n你完全可以更改想要使用的术语，并确定你想在代码中看到什么种语句。同样，尽管尝试 `while` 循环，并确定你想执行多少次迭代以获得你想要的结果。\n\n\
    然后是时候转向 `for` 循环了。它在功能上与 `while` 循环相似，但它具有不同的语法。如果你在开始之前就已经知道循环语句执行执行次数，那么 `for`\
    \ 循环将是首选的方法。\n\n循环变量的初始化、要测试的条件以及循环变量的递增或递可以在循环的单行代码中完成，这有助于为我们提供一个更短、更易编写的循环结构。当你遇到问题或需要修复代码部分时，可能会发现这实际上是一种更容易调试的循环格式，因此它可能是你想要考虑使用的。现在，当我们要使用\
    \ `C#` 中的 `for` 循环时，会有几个不同的部分涉及到。这些部分包括：\n"
