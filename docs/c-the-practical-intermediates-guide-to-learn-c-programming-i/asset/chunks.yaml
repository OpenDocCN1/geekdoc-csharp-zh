  trans: "\n\n在这种编程语言中，属性将增强字段的性能。属性将为信息提供一些额外的管理能力，并将其传递给字段。此时，如果你能先查看一下如何创建类以及如何确保它们完全按照你的意愿运行，可能会更容易一些。我们现在来看一下这段代码将如何运行的示例，以及与之相关的不同理论。在这个示例中，我们将使用\
    \ `book` 作为类名，然后它将拥有 `size` 和 `type` 属性。该代码示例如下：\n\n```csharp\nPublic class Book{\n\
    \    Private string bookType:\n    Private string size;\n    Public string BookType{\n\
    \        Get{Return this. bookType;}\n        Set{This.bookType = value}\n   \
    \ }\n    public string Size{\n        Get{Return this.size;}\n        Set{this.size\
    \ = value;\n    }\n    public Book(){\n        this.bookType = “Dictionary”;\n\
    \        this.size = “large”;\n    }\n    public book(string bookType, string\
    \ size){\n        this.bookType = bookType;\n        this.size = size;\n    }\n\
    \    public void Sample(){\n        Console.WriteLine(“ Is this a {0}, bookType)\n\
    \    }\n}\n```\n\n现在，起初这看起来像是一段非常复杂的代码，你可能在担心如何保持这一切井井有条，或者是否完全理解如何使用它。不过，处理起来其实并不复杂，你可以使用其中包含的思路。通过这个示例，`Book`\
    \ 类定义了两个不同的属性：书籍类型和大小。这些属性将值隐藏在同名的字段中，而代码段还声明了两个将在 `Book` 类上生成的构造函数。这段代码还会创建一个名为\
    \ `Sample()` 的方法。你可以将此代码用于许多不同的用途，例如根据需要添加更多特征，而且它并不限于书籍、玩具、车辆或任何其他物品。你可以随意使用你的文本编辑器来尝试这个公式，并用其他类对其进行修改，以便程序更更容易为你\
    \ own 工作。\n\n## 如何创建你自己的对象\n一旦你有了一个类来帮助你，就是时候创建一些你想要使用并放置在类中的对象了。创建自己的对象并不是为了增加难度，因此在本书的这部分，我们将花时间查看你入门需要了解的基础知识。\n\
    \n### 创建对象\n在这里我们要做的第一的是创建一个你想放在现有类中的对象。为了实现这一点，你需要创建你自己的关键字。通常，程序员会选择为新对象分配一个变量，以便它保持与你想使用的类相同的数据类型。请记住，这样做不会将对象复制到右变量中，但它将帮助变量提供指向它现在所赋值对象的引用。为了确保这确实有效，请使用以下代码：\n\
    \n```csharp\nBook someBook = new Book()\n```\n\n这是一个你可以使用的很好的示例，因为它会获取书籍的实例并将其分配给我们命名为\
    \ `someBook` 的变量。这将确保根据需要，对象具有正确的类。\n\n### 系统类\n如果你是刚开始接触 C# 语言的新手，你会发现这种语言已经内置了一个库。这个库包含了许多默认的类，如\
    \ `string`、`math` 和 `console`。当你开始更多地使用这种语言时，必须记住，库是你可以通过 `.Net` 应用程序轻松使用和访问的东西。你一定会喜欢\
    \ `.NET` 框架如何为你完成工作。这是因为 C# 所需的库已经提前安装好了。这些类是你可以一直使用的部分，当你开始学习该语言的一些基础知识（如网络、文本处理和执行）时，它们非常有帮助。这些类对于以前从未从事过编程的初学者也有帮助，因为它们是预先编写并被程序识别的，所以你不需要做那么多工作。\n\
    \n在处理这些类时你应该记住的一点是，它们会隐藏所有的逻辑实现。你需要更多地关注你的类可以做什么，而不是过度担心它们背后具体是如何实现这些点的机制。正因如此，C#\
    \ 的内置类并不是程序员实际上可以查看的。你只需要将这些代码用于它们的通用用途，而不必过度担心它们究竟是如何运行的，因为那是你并不需要考虑的事情。\n\n\
    ## 如何为对象分配参数\n这种编程语言允许你为你创建的对象分配一些参数。这是一项非常容易的操作，你只需要具备基础语法就能确保它对你起作用。你需要使用的语法如下：\n\
    \n```csharp\nBook someBook = new Book(“Biography”, “large”)\n```\n\n这段代码将创建一个名为\
    \ `someBook` 的新对象，并将两个不同的参数也分配给它。通过这种调整，对象的 `type` 现在是 Biography（传记），而大小现在是 large（大）。\n\
    \n每当你使用 `new` 关键字时，`.NET` 框架可以完成两件事：\n- 它将为这个新对象保留一些内存\n- 它将初始化对象的数据成员\n\n"
- fmt: "\nThis is a process that will occur because of the constructor method. For\
    \ the code that we wrote above, the parameters that we set out right away are\
    \ the parameters for a ‘class constructor.’ This is what will make sure that the\
    \ object will stay inside the class that you chose to create and it will provide\
    \ that object with the right characteristics so that it works properly.\n\n###\
    \ Releasing your objects\nOne thing that you need to concentrate on is learning\
    \ how to release the object that you are working with. Some other languages that\
    \ you will work with will make you go through and manually release the objects,\
    \ but this is not something that is required when it comes to working with C#.\
    \ This means that you can release any of the objects that are consuming up too\
    \ much memory in your system without having to go through and manually destroy\
    \ them. You can just use the `CLR` system that can be found inside the `.NET`\
    \ framework to make all of this work.\n\nWhen you are working with the `CLR` system,\
    \ the computer can automatically detect and then release the objects that were\
    \ not referenced. The memory that was reserved for these objects is now available\
    \ again, and you can use them for some of the other objects or variables that\
    \ you will create inside of your code. If you would like to release an object,\
    \ you should stop and learn how to destroy the corresponding references as well.\
    \ An example of how you would go through and do this is the following:\n\n```\n\
    someBook = null;\n```\n\nThis process doesn’t mean it’s going to delete the object,\
    \ but it will make sure that all references to that object are removed so that\
    \ the `CLR` can go through after you are done with it and perform the deletion\
    \ for you. This is a great process to have because it will help to limit the number\
    \ of issues that occur in your code and can get rid of some of the bugs that might\
    \ show up in the code.\n\n### The constructors\nThe last topic that we will discuss\
    \ in this chapter is the ‘constructors.’ These constructors are basically methods\
    \ that will run when the program creates a new object. The idea behind using these\
    \ is so that you can use it to initialize the data of that new object. You won’t\
    \ get anything of value to show up when you go with this method. In addition,\
    \ this constructor will use the same name as the class that it comes from, this\
    \ means you don’t have to try and match up a few random names along the way. You\
    \ also get the choice of assigning the right parameters to this when you work\
    \ with constructors in C#.\n\nThe constructors that come with C# can accept parameters\
    \ just like any method that you are using in this programming language. You can\
    \ set up several constructors in the class, but you always need to check to see\
    \ if the constructors are from different types and numbers of parameters. This\
    \ will help to make sure that each parameter is unique.\n\nAs you are working\
    \ with constructors, it is important to remember that these will run any time\
    \ that you create a brand new object in your class. If you are working with a\
    \ class that has a few different constructors inside of it, you may be curious\
    \ to figure out which of the constructors are running as a new object is created\
    \ in the code. This programming language can pick out the right constructor based\
    \ on what you are working on so you won’t be responsible for coming up with all\
    \ that information. The compiler will take over so things will stay organized\
    \ without you being stressed out so much about it.\n\nNow that we have talked\
    \ about the constructor a little bit, let’s take a look at an example of how this\
    \ would work in C#:\n\n```csharp\npublic class Device{\n    private string type;\n\
    \    private string size;\n    // A constructor without any parameter\n    public\
    \ Device(){\n        this.type =\"laptop\";\n        this.type = “large”;\n  \
    \  }\n    //A constructor with two parameters.\n    {\n        this.type = type;\n\
    \        this.size = size;\n    }\n}\n```\n\nThe parameters that we just set up\
    \ can help tell the program what are the tasks or functions that need to be fulfilled.\
    \ It is also responsible for helping the C# compiler to figure out the constructor\
    \ that you would like the program to use.\n\n### How to Define Classes with the\
