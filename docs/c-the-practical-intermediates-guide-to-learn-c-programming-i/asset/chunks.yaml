    loops and what they can offer to you, and try a few out to see how they are going
    to work for your own codes as well. Chapter 5        Value types and Reference
    typesTypes in C# can be split into either value types or reference types.  The
    differences between the types in each category stem from differences in copying
    strategies, which in turn result in each type being stored differently in memory.  Value
    typesValue types encompass most built-in types (In specific terms, all numeric
    types, char type, and bool type) as well as custom struct and enum type.  These
    types all have a fixed size, variables of value types directly contain their own
    values.   Reference typesReference types comprise all classes, array, delegate
    and interface types and are handled differently by the compiler.  For example,
    take the Circle Class type (previous code listing). Once you declare a Circle
    variable, the compiler allocates a small portion of memory which can possibly
    hold the address of (or a reference to) additional block of memory holding a Circle. 
    Only once an actual Circle object is created (via the new keyword) then the memory
    is allocated.Copying value & reference types When you take a copy of a value type
    there are two memory locations.  For example, should you create a integer variable
    called i and give it the value 42 then an additional integer variable named copyi
    and assign i to copyi , copyi will hold the identical value as i (42). Although
    copyi and i hold the exact same value, there are actually two blocks of memory
    holding the value 42: one block for i and another block for copyi . If you adjust
    the value of i , the value of copyi doesn’t change:int i = 42;              //
    declare i as integer & assign it 42int copyi = i;         /* decclare copyi equal
    to i (i.e copyi now holds a copyi of i – its value 42) */i++;/* incrementing i
    by 1.  copyi is unchanged;I now holds 43, but copyi still has 42 value*/This is
    in marked difference to declaring a variable as a class type where you are essentially
    copying the same address.  E.g. if you declare c as a Circle, c can refer to a
    Circle object; the actual value held by c is the address of a Circle object in
    memory. Should you declare a further variable called refc (a Circle) and assign
    c to refc , refc will have a copy of the identical address as c.  To summarize,
    both refc and c now denote the one Circle object. Circle c = new Circle(42); //
    declare new c variable of Cirlce object that = 42Circle refc = c;// assign c to
    refc. refc has identical address as c Note that the behaviour of method parameters
    hinge on on whether they are value types or reference types.  Null valuesThe null
    value identified with the null keyword, indicates that the variable does not refer
    to any valid object, i.e. it stipulates that a variable is set to nothing.  You
    can assign reference types, pointer types and nullable types the value null. 
    Code that sets a variable to null explicitly assigns the reference to refer to
    no valid value.  It is possible to check whether a reference refers to nothing. 
    The subsequent code demonstrates assigning null to a string variable:static void
    Main(){String phoneNum;// …// Clear the value of phoneNum.phoneNum = null;//..}Assigning
    the value null to a reference type is not the same as not assigning it at all. 
    In other words, a variable that has been assigned null has still been set, whereas
    a variable with no assignment has not been set and therefore, will often result
    in your program not compiling if used prior to assignment.Assigning a string value
    the value null is particularly dissimilar from assigning an empty string, “”. 
    Use of null indicates that the variable has no value, whereas “” indicates that
    there is an empty value – an empty string.  This difference is quite valuable
    in programming, you could take a phone number of null to mean that the phone number
    is unknown, while a phoneNum value of “” could stipulate no phone exists.Nullable
    typesValue types can’t typically be assigned null since by definition they can’t
    hold references, which includes references to nothing.  However, C# defines a
    modifier that you can use to declare that a variable is a nullable value type. 
    A nullable value type acts in a similar way to the original value type, but you
    can assign the null value to it. You use the (?) to specify that a value type
    is nullable, like so:int? i = null; // valid codeYou can ascertain whether a nullable
    variable contains null by testing it in the same way as a reference type:if (i
    == null)The System.Object classOne of the most important reference types in the
    .NET Framework is the Object class in the System namespace. To completely appreciate
    the significance of the System .Object class you need under­stand inheritance
    -  described later in this Ebook.  For the time being, simply accept that all
    classes are specialized types of System.Object and that you can use System.Ob­ject
    to create a variable that can refer to any reference type. System .Object is such
    an important class that C# provides the object keyword as an alias for System
    .Object.In the subsequent example, the variables c and o both reference the same
    Circle object. The fact that the type of c is Circle and the type of o is object
    (the alias for System.Object) in effect offers two dif­ferent views of the same
    item in memory.Circle c;c = new Circle(42);object o;o = c;BoxingAs discussed,
    variables of type object can refer to any item of any reference type. However,
    variables of type object can also refer to a value type. To illustrate, both the
    two following statements initialize the variable i (of type int, a value type)
    to 42 and then initialize the variable o (of type object, a reference type) to
    i :int i = 42;object o = i;In the second there is a bit more happening.  Re­member
    that i is a value type and that it lives on the stack. Should the reference inside
    o referred directly to i , then the reference would refer to the stack. Nevertheless,
    all references must refer to objects on the heap; creating references to items
    on the stack could seriously compromise the robustness of the runtime and create
    a potential security flaw, so it is not allowed. Therefore, the runtime allocates
    a piece of memory from the heap, copies the value of integer i to this piece of
    memory, and then refers the ob­ject o to this copy. Boxing is term for automatically
    copying an item from the stack to the heap. UnboxingBecause a variable of type
    object can refer to a boxed copy of a value, it’s only reasonable to allow you
