  trans: '

    早些时候，我提到将向你展示如何为设备设计一个本地数据库模式（schema），即使你打算与后端的 NoSQL 数据存储进行同步，它也能良好工作。很好，如果你查看我们为示例职位发布应用设计的数据库，你会看到一个**非常传统**的关系型模式。甚至我们的设计指南也是真正针对传统的关系型数据库模型的。在与关系型数据库同步时这完全没有问题，但当同步到
    NoSQL 数据存储时，该怎么办呢？


    事实证明，尝试创建一个既适用于传统关系型数据库又适用于 NoSQL 数据库的模式是愚蠢的。你几乎肯定会得到一个两者都不佳的设计。解决这个问题的答案是在设备上创建一个传统的关系型设计，并在
    `Mongo` 后端上创建一个扁平化的、反规范化的（denormalized）设计，并在同步时在代码中执行必要的转换。然而，为了实现这一目标，设备模式必须设计正确，特别是在创建主键和外键方面。正是这些键被用于执行从关系型模式到文档模式的转换。我们将在稍后讨论同步时详细介绍这一点。


    ## 关于设计你的 SQL 的建议


    关于用于移动端应用的 SQL，我有一些想法和建议想和你分享。


    通常情况下，你在为非移动应用编写良好的 SQL 时遵循的规则和原则也适用于移动应用。因此，实际上并没有许多需要学习的新内容。主要的区别在于 `SQLite`
    运行的环境和上下文与传统的数据库服务器非常不同。结果，在移动环境中使用 `SQLite` 时，一些广为人知且被接受的规则适用性较低。`SQLite` 是一个无服务器的数据库，它运行在应用程序的地址空间中，或者至少运行在同一颗
    CPU 上。无论哪种情况，影响都是相同的。


    对于为了完成给定的任务是应该使用更少的复杂查询还是更多的简单查询，存在不同的观点流派。我听过支持这两种观点的强有力的论点。坦率地说，我不确定自己是否已经对此形成了强有力的个人观点。尽管如此，我似乎倾向于编写更简单的查询。无论如何，在移动端为
    `SQLite` 编写 SQL 时，我相信作为一条一般规则，更简单的查询更好。让我解释一下原因。


    编写复杂 SQL（包括存储过程）主要有四个原因：


    *   编写存储过程通常是为了集中业务逻辑。由于其本质，这些查询往往是复杂的。虽然没有要求存储过程必须复杂的规定，但由于它们提供了灵活性，它们仍然鼓励了复杂性。

    *   编写复杂 SQL（包括存储过程）允许将某些处理卸载到数据库服务器。通过这种方式分担负载可以提供性能优势。

    *   较少的复杂查询可以显著减少与数据库之间的网络往返次数（over-the-wire trips）次数。网络流量往往是性能的瓶颈，而不是处理能力。

    *   发现单个复杂的 SQL 语句比多个简单语句更高效。


    除了最后一点，这些中都不适用于移动环境中的 `SQLite`。那里没有存储过程，没有卸载到独立服务器的处理器，应用程序与数据库之间也没有跨越线缆的的网络通信。前三点带来的收益在很大程度上被
    `SQLite` 运行的上下文抵消了。


    很简单，对吧？好吧，正如软件工程中通常的情况一样，没有什么是那么简单的。虽然前三个原因确实不适用于 `SQLite`，但第四个原因的适用性可能比常多或比常少。对于多线程且需要并发数据库访问的应用，更简单的查询可能更合适；更多细节请参见“锁定与并发”章节。此外，由于
    `SQLite` 不产生跨线缆的流量，与高速度数据库负载相关的常见问题（如网络延迟和流量瓶颈）并不存在。如果你的应用读取负载远高于写负载，你可能会选择较少的复杂查询，即使你的数据库访问是高度并发的。其原因是读取在
    `SQLite` 中是以最高并发级别执行的。我意识到这让问题变得更复杂了，所以我将给你一个具体的建议。


    如果你有权选择使用单个复杂查询或多个简单查询，并且不想经历性能剖析（performance profiling）的工作，请选择多个简单查询。


    ## 在 SQLite 中存储日期和时间


    “`SQLite` 没有专门留用于存储日期和/或时间的存储类。”这句话是直接摘自 `SQLite` 文档的。在 `SQLite` 中，日期和时间以以下格式存储：


    *   `TEXT`：作为 ISO8601 字符串（`"YYYY-MM-DD HH:MM:SS.SSS"`）。

    *   `INTEGER`：作为 Unix 时间，自 1970-01-01 00:00:00 UTC 以来的秒数。

    *   `REAL`：作为儒略日数字（Julian day numbers），根据推测格里略历，自公元前 4714 年 11 月 24 日格林治午以来的天数。


    你可以使用内置的 `SQLite` 日期时间函数进行转换。如果你不需要将设备数据库同步到服务器端数据存储，那么选择哪种格式并不重要。只需选择一个你在应用程序中处理起来最熟悉的格式即可。否则，最好的选择是选择目标复制服务器能够接受的格式。例如，`SQLite.XM`
    的默认同步与 `HotRiot` 同步。`HotRiot` 有专门的日期时间类型，接受 ISO8601 格式的日期时间，因此文本格式完全没问题。这样做的好处是在服务器上使用实际的日期时间字段。`HotRiot`
    也包含整数和实数数据类型，因此使用整数或实数表示日期时间也可以。当然，你需要进行转换以便以人类可读的形式输出。


    如果你想在设备数据库上使用一种格式存储日期时间，而在服务器上使用另一种格式呢？这不是问题，但需要你付出额外工作。同步包含了在向服务器发送数据之前修改记录数据的能力。你可以利用这一功能进行格式间的转换。这种功能被称为同步前处理（pre-synchronization
    processing），并在“自定义同步”章节中详细介绍。


    ## 获取 SQLite.XM


    `SQLite.XM`可以在 GitHub 上获取，这里是直接链接：`https://github.com/HotRiot/SQLite.XM-Xamarin`。将
    `SQLite.XM` 项目包含在你的解决方案中。如果你不确定如何操作，我将在下一节通过示例进行说明。

    '
- fmt: "\nI decided to use Xamarin Studio as it provides a fairly consistent and uniform\
    \ interface between Windows and OSX. If you haven’t already done so, go to the\
    \ following URI to install Xamarin: [http://xamarin.com/download](http://xamarin.com/download).\n\
    \n![](Image00015.jpg)\n\nOnce installed, start Xamarin Studio and select `New\
    \ Solution` on the opening screen, or select `File->New->Solution`. This will\
    \ open the `New Solutions` dialog, see the screenshot below. We’re going to start\
    \ by creating a basic Android application, that is, an Android project with a\
    \ single activity.\n\nIn the `New Solutions` dialog, select `Android` then `Android\
    \ Application`. I named the project `JSearch`, short for Job Search.\n\n![](Image00035.jpg)\n\
    \nOnce created, our solution should show up in Xamarin Studio similar to the screenshot\
    \ below.\n\n![](Image00007.jpg)\n\nNow, we are going to add `SQLite.XM` to our\
    \ newly created solution. `SQLite.XM` is a shared project that can be used by\
    \ all platforms targeted by Xamarin, including iOS, Android, and Windows. Right\
    \ click on the `JSearch` solution and navigate to `Add->Add Existing Project`,\
    \ see the screenshot below.\n\n![](Image00013.jpg)\n\nThis will bring up the open\
    \ project dialog, see the next screenshot. Navigate to the folder where you placed\
    \ the `SQLite.XM` project that you downloaded from GitHub and add it to the solution.\n\
    \n![](Image00009.jpg)\n\nNext, we need to add several references which are required\
    \ by `SQLite.XM`. Right click on the `References` folder listed under your project\
    \ heading. This will display the references menu, see the screenshot below. Select\
    \ the `Edit References` menu item.\n\n![](Image00025.jpg)\n\nThe `Edit Referenced`\
    \ dialog will display, see the next screenshot. Begin by selecting the `Packages`\
    \ tab, then add the following four packages.\n\n- `Mono.Data.Sqlite`\n- `System.Data`\n\
    - `System.Web.Services`\n- `System.Xml.Linq`\n\n![](Image00008.jpg)\n\nNext, select\
    \ the `Projects` tab of the edit `References` dialog, then select the `SQLite.XM`\
    \ project. See the screenshot below. Select the `OK` button to add the references.\n\
    \n![](Image00023.jpg)\n\nNext, select `Project->Add NuGet` Package.\n\n![](Image00039.jpg)\n\
    \nThis will open the `Add Packages` dialog; see the next screenshot.\n\n![](Image00000.jpg)\n\
    \nAdd the package `Json.NET` to your project. At this point, we have fully created\
    \ our project skeleton and we’re ready to get started!\n\n## Platform specific\
    \ code\n\n`SQLite.XM` was designed to be a cross-platform solution for your iOS\
    \ and Android applications. There is almost no platform specific code. At worst,\
    \ you will need to add one additional line of code to the Android `SQLite.XM`\
    \ initialization sequence that is not needed in iOS. I will show you this latter.\
    \ That’s all the platform specific code you will need to deal with, everything\
    \ else in `SQLite.XM` is consistent between Android and iOS.\n\nInternally however,\
    \ `SQLite.XM` has some platform specific code. Two files in `SQLite.XM` include\
    \ conditional compilation directives used for selecting the correct code depending\
    \ on the target platform for which you are compiling. At the top of the following\
    \ two files are two `#ifdef` statements, one for Android and one for iOS.\n\n\
    - `HotRiot->HotRiot_CS.cs`\n- `Synchronize.cs`\n\nUncomment the statement that\
    \ references the platform for which you are compiling. A screenshot showing the\
    \ top of the `Synchronize.cs` file is shown below, it has the Android directive\
    \ uncommented.\n\n![](Image00003.jpg)\n\n## Part 2. Data storage on the device\n\
    \n### Describing your apps databases\n\nThe first step to building a data persistence\
    \ layer is to create a descriptor for each database used by your application.\
    \ Descriptors provide basic information about the databases your app will be using.\
    \ Below is a partial listing of the database descriptor class.\n\n```c\npublic\
    \ class DatabaseDescriptor\n{\n    private string databaseName;\n    private Environment.SpecialFolder\
    \ databaseFolder;\n    public Environment.SpecialFolder DatabaseFolder\n    {\n\
    \        get { return databaseFolder; }\n    }\n    public bool noLog = false;\n\
    \    public string logfileName;\n    public int logfileMaxSize = 1024 * 1024;\n\
    \    public Environment.SpecialFolder logfileFolder = Environment.SpecialFolder.Personal;\n\
    \    public DatabaseDescriptor (string databaseName, Environment.SpecialFolder\
    \ databaseFolder = Environment.SpecialFolder.ApplicationData)...\n    public static\
    \ DatabaseDescriptor getDescriptor(string databaseName)...\n    public ArrayList\
    \ getNames()\n}\n```\n\nThe `DatabaseDescriptor` constructor takes a single required\
    \ parameter; the name of database you wish to create. It also accepts an optional\
    \ folder. By default, databases are located in the `Personal` folder. This is\
    \ the personal or home directory for the current user, which, in Android, translates\
    \ to:\n\n`/data/data/<application name>/files`\n\nand in iOS:\n\n`<application\
    \ name>/documents/`\n\nThe `DatabaseDescriptor` class has reasonable defaults\
    \ for its control. Of course, if you don’t like any of these defaults, you can\
    \ change them. In the example below, the location where the database will be is\
    \ set to the `Personal* folder.\n\n```csharp\ntry\n{\n    DatabaseDescriptor dd\
    \ = new DatabaseDescriptor(\"jSearch\", Environment.SpecialFolder.Personal);\n\
    \    dd.logfileMaxSize = 1024 * 1024 * 5;\n    dd.logfileName = \"jSearch-log\"\
    ;\n}\ncatch (Exception ex)\n{\n    string message = ex.Message;\n}\n```\n\nOnce\
    \ created, the database name and folder location in the descriptor cannot be changed.\
    \ This is reasonable; it’s hard to imagine a circumstance where this would make\
    \ sense. Anyway, changing either of these effectively changes the database referenced\
    \ by the descriptor. Each descriptor also includes properties for a log file.\
    \ What this means is, each database can, and should, have its own log. This may\
    \ seem like overkill; why not simply share a log file between databases. The reason\
    \ is twofold; this provides flexibility in managing logs and visually parsing\
    \ a single file shared between databases is more difficult than having separate\
    \ database logs.\n\nThe log file is automatically assigned the same name as the\
    \ database with the extension `.log` and its default size is 1MB. By default,\
    \ log files are placed in the `Personal` folder. This is the personal or home\
    \ directory for the current user, which, in Android, translates to:\n\n`/data/data/<application\
    \ name>/files`\n\nOf course, you can change any of these defaults. In the example\
    \ below, we change the maximum log file size from its default 1MB to 5MB and the\
    \ log file name to `jSearch-log`.\n\nWhen a log file reaches its maximum size,\
    \ it is renamed from `<` `logfile name` `>.log` to `<` `logfile name` `>.old.log`\
    \ and a new log file is started. If there was an existing old log file, it is\
    \ replaced. If you don’t want logging, set `noLog` to `false`.\n"
