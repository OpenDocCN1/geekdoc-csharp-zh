  trans: "\n\n同步后委托（post-synchronization delegate）可用于任何你想要执行的处理。一个典型的用途是修正同步错误。通常情况下，我喜欢将错误处理和实际错误纠正划分在错误委托和后处理委托之间。我的意思是，错误委托应该只识别错误是可恢复的还是不可恢复的。后处理委托则应负责采取纠正错误所需的行动。\n\
    \n在下方的同步后委托示例中，我们首先检查同步是否成功，这在第 `1` 行完成。如果 `synchResponse.synchErrorType` 为成功（success），则说明同步正常。你之所以知道这一点，是因为传递给委托的\
    \ `synchResponse` 参数是来自 `sdList` 中已处理的最后一条记录返回的响应。\n\n如果同步失败，代码将遍历 `sdList` 以找到触发失败的\
    \ `SynchDescriptor`。这在第 `2` 行完成。第 `3` 行接着检查错误是可恢复的还是不可恢复的。\n\n检查成功或失败，并在必要时识别导致错误的描述符，是非常容易的。你决定如何处理这些信息取决于你具体的应用需求。\n\
    \n```cs\npublic static async Task mySynchPostProcessDel(SynchDescriptor originalSD,\
    \ List<SynchDescriptor> sdList, SynchResponse synchResponse)\n{\n1 if (synchResponse.synchErrorType\
    \ == Defines.SynchErrorTypes.success)\n  {\n    // 在此处执行成功处理。\n  }\n  else\n \
    \ {\n    // 寻找失败的描述符。\n    foreach (SynchDescriptor sd in sdList)\n    {\n   \
    \   2 if (sd.synchResponse.synchErrorType != Defines.SynchErrorTypes.success)\n\
    \      {\n        // 这是一个可恢复的错误。\n        3 if (sd.synchResponse.removeFlag ==\
    \ false)\n        {\n          // 可恢复错误。\n        }\n        else\n        {\n\
    \          // 不可恢复错误。\n        }\n        // 已找到。处理后退出。剩余的响应对象将为 null。\n     \
    \   break;\n      }\n    }\n  }\n}\n```\n\n### 同步到你私有后端\n\n到目前为止，我们进行的所有同步都是针对\
    \ HotRiot 的。虽然在设计记录同步方式时具有很大的灵活性和控制权，但它们仍然被同步到 HotRiot 系统。这是让你的应用运行起来最简单、最快的方法，在许多情况下也是理想的。然而，想要复制你自己的私有后端也有其合情合理的理由。我不会详细阐述你为什么可能选择这样做。我假设如果你认真考虑复制到私有服务器，你一定有充分的理由。为了支持这一需求，`SQLite.XM`\
    \ 允许你将默认的 HotRiot 同步替换为自定义复制。这允许你接管复制并同步到你选择的任何服务器。\n\n自定义同步委托的方法签名所示所示。\n\n```cs\n\
    public delegate Task<bool> SynchDel(List<SynchDescriptor> sdList);\n```\n\n要将默认的\
    \ HotRiot 同步替换为你自己的复制，只需将你的同步委托传递给 `SxmInit.initialize` 方法；见下方。\n\n```cs\nbool\
    \ schema = SxmInit.initialize(mySynchDel);\nthis.StartService(new Intent(this,\
    \ typeof(SynchronizeService))); // 仅限 Android。\n```\n\n如你所示，自定义同步委托返回一个布尔值（bool），并接收以下参数：\n\
    \n*   `List<SynchDescriptor> sdList` - 这是需要同步到你的服务器的同步描述符列表。对于当前版本的 `SQLite.XM`，此列表将仅包含一个项目，但在未来版本中可能会发生变化。\n\
    \n下面是 `SynchDescriptor` 类的部分列表。\n\n```cs\npublic class SynchDescriptor\n{\n  public\
    \ string action;\n  public string dbName;\n  public string tableName;\n  public\
    \ SynchResponse synchResponse;\n  public Hashtable recordDataToSynch;\n  // .\
    \ . .\n}\n```\n\n以下是每个实例变量的描述。\n\n*   `string action` - 这是需要在该记录上执行的同步操作。在插入新记录时为\
    \ `insert`，删除记录时为 `delete`，在更新或修改记录时为 `update`。\n*   `string dbName` - 这是获取此记录的设备数据库名称。\n\
    *   `string tableName` - 这是获取此记录的数据库表名称。\n*   `SynchResponse synchResponse` -\
    \ 这是同步此描述符时返回的响应。在执行自定义同步时可以忽略它。\n*   `Hashtable recordDataToSynch` - 这是需要同步到你的服务器的实际记录数据。哈希中的键包含字段名，值包含实际字段数据。\n\
    \n如果传递给委托的描述符的 `action` 为 `delete`，那么传递到 `recordDataToSynch` 的什么？在这种情况下，哈希表中只有一个项目：`systemSynchID`。\n\
    \n### 自定义同步的工作原理\n\n"
- fmt: "\nHow and where you choose to replicate using a custom delegate is, of course,\
    \ entirely up to you. However, there are few things to keep in mind as you prepare\
    \ to engineer a design for custom synchronization. It’s entirely possible that\
    \ certain type of errors will cause synchronization to send your delegate the\
    \ same record multiple times. This could happen if your synchronization delegate\
    \ sends a request to your server and the request is received and correctly processed\
    \ but no answer is returned. This might occur because of a connection failure\
    \ or because of some error in the server-side code. Not knowing whether or not\
    \ a replication request was fully processed, your delegate will probably return\
    \ `false` in order to ensure that the record is reprocess. Your server must be\
    \ able to properly handle these types of conditions. For example, you server could\
    \ be asked to delete the same record more than once or perform an insert of a\
    \ record that already exists.\n\nIt’s strongly recommended that you include a\
    \ `systemSynchID` field wherever you will be replication your device data, and\
    \ that you replicate to this field. This is the only field sent in the `recordDataToSynch`\
    \ hash table when an `action` is `delete`. So without it, you will be unable to\
    \ fulfill a delete synchronization request.\n\nWe also recommend that you include\
    \ robust error processing as part of your synchronization design. Replication\
    \ needs to be viewed as an unreliable operation. This is mostly due to the transient\
    \ nature and sporadic quality of network connections on mobile devices. Your error\
    \ handler will be responsible for deciding which errors are recoverable and which\
    \ are not. And it’s likely that some recoverable errors will need to be explicitly\
    \ corrected. Now, I don’t want to get too deep into the specifics of a design,\
    \ as that is highly dependent on the particulars of your synchronization. But\
    \ you need to be careful not to design your error processing and correction logic\
    \ in such a way that it could put replication into an endless cycle that prevents\
    \ synchronization. For example, this could happen if your synchronization handler\
    \ encounters an error that it considers recoverable but requires an explicit correction\
    \ and that correction is never made.\n\nThere is another, more insidious problem\
    \ that you could encounter. It’s what I call a non-error timeout. It most often\
    \ happens when trying to synchronize a large record with a poor connection. Imagine\
    \ your delegate attempts to synch a record which includes a large video as a blob.\
    \ Assume for this example, that the time it takes to transfer the record and synchronize\
    \ the data exceeds the connection timeout interval. In this example, the synchronization\
    \ request was successfully processed by your server but the code on the device\
    \ received a `WebException` error with a timeout message. The error handler might\
    \ rightly consider this a recoverable error that simply needs to be reprocessed.\
    \ The problem, however, is not going away. Each time you try and replicate this\
    \ record, your synchronization code receives the same result.\n\nIf your synchronization\
    \ delegate throws an exception, the record from the replication log which triggered\
    \ the exception will be removed from the log and will not be processed any further.\
    \ Synchronization will continue with the next entry in the log, if one exists.\n\
    \n## Writing a custom synchronization delegate\n\nThe listing below should help\
    \ to get you going in writing your own custom synchronization delegate. It provides\
    \ a skeleton and a workflow that can be used as the basis for building a handler.\
    \ Naturally, it does not include the actual implementation specific synchronization\
    \ logic. You would, of course, need to fill in these missing parts. This just\
    \ presents one way you might go about structuring replication. It is entirely\
    \ possible, given the specifics of your requirements, that there is another better\
    \ design you might choose instead. But even so, this listing should be helpful\
    \ in giving you some ideas as to how you might do things.\n\nThe `synchDelegate`\
    \ method is the actual synchronization delegate. It starts by inspecting the `action`\
    \ and calling the appropriate lower level action-specific routine. If an error\
    \ or an exception is encountered during processing, it then calls the method `isErrorRecoverable`\
    \ or `isExceptionRecoverable`. As their names imply, these methods determine if\
    \ the error or exception is recoverable or not. If a recoverable error or exception\
    \ is encountered, the overloaded method `performErrorCorrection` is called. This\
    \ method is responsible for determining if an error requires an explicit correction,\
    \ and if it does, for making the correction. Some errors may not require any action\
    \ on the part of synchronization, for example, a connection error.\n\n```\npublic\
    \ static async Task<bool> SynchDelegate(List<SynchDescriptor> sdList)\n{\n  bool\
    \ removeSynchRecordFlag = true;\n  SynchResponse synchResponse = null;\n  try\n\
    \  {\n    foreach (SynchDescriptor synchDescriptor in sdList)\n    {\n     if\
    \ (synchDescriptor.action.Equals(\"insert\") == true)\n      synchResponse = await\
    \ synchInsert(synchDescriptor);\n      if (synchDescriptor.action.Equals(\"update\"\
    ) == true)\n        synchResponse = await synchUpdate(synchDescriptor);\n    \
    \ if (synchDescriptor.action.Equals(\"delete\") == true)\n      synchResponse\
    \ = await synchDelete(synchDescriptor);\n      if (synchResponse.ErrorType !=\
    \ SynchErrorTypes.success)\n       {\n        if (isErrorRecoverable(synchResponse)\
    \ == true)\n        {\n          removeSynchRecordFlag = false;\n          performErrorCorrection(synchResponse);\n\
    \        }\n      }\n    }\n  }\n  catch (Exception ex)\n  {\n    if (isExceptionRecoverable(ex))\n\
    \    {\n      removeSynchRecordFlag = false;\n      performErrorCorrection(ex);\n\
    \    }\n  }\n  return removeSynchRecordFlag;\n}\n\npublic static bool isErrorRecoverable(SynchResponse\
    \ synchResponse)\n{\n  bool recoverableFlag = true;\n  return recoverableFlag;\n\
    }\n\npublic static bool isExceptionRecoverable(Exception ex)\n{\n  bool recoverableFlag\
    \ = true;\n  return recoverableFlag;\n}\n\npublic static void performErrorCorrection(SynchResponse\
    \ synchResponse)\n{\n}\n\npublic static void performErrorCorrection(Exception\
    \ ex)\n{\n}\n\nprivate static async Task<SynchResponse> synchInsert(SynchDescriptor\
    \ synchDescriptor)\n{\n}\n\nprivate static async Task<SynchResponse> synchUpdate(SynchDescriptor\
    \ synchDescriptor)\n{\n}\n\nprivate static async Task<SynchResponse> synchDelete(SynchDescriptor\
    \ synchDescriptor)\n{\n}\n```\n"
