    ` `);`\n\n`    parameterValues.Add (` `\"testContact\"` `);`\n\n`    parameterValues.Add (`\
    \ `\"testemail@testCoName.com\"` `);`\n\n`    parameterValues.Add (` `\"testPassword\"\
    ` `);`\n\n `try` `{`\n\n `using` ` (` `SxmTransaction` `sxmTransaction = ` `new`\
    \  `SxmTransaction` ` (` `\"jsearch\"` `)){`\n\n `ir = sxmTransaction.executeInsert(`\
    \ `\"registerCompany\"` `, parameterValues);`\n\n  `if` ` (ir.SynchID == ` `null`\
    \ ` || ir.RecordID == -` `1L` ` )`\n\n  `throw`  `new`  `SxmException` ` ( ` `new`\
    \  `ErrorMessage` ` (` `\"Insert error @ processInsert.\"` `, `\n\n `Defines`\
    \ `.` `SxmErrorCode` `.userDefined));`\n\n  `sxmTransaction.executeQuery (` `\"\
    findCompany\"` `, ` `null` `);`\n\n  `allRows = sxmTransaction.getAllRows ();`\n\
    \n**`1`**  `if` `(sxmTransaction.commitTransaction () ==` `SQLiteErrorCode` `.Busy`\
    \ `){`\n\n `Thread` `.Sleep (` `50` `);`\n\n`           sxmTransaction.commitTransaction ();`\
    \ `// Try again.`\n\n`        }`\n\n`      }`\n\n`   }`\n\n `catch` ` (` `SxmException`\
    \ ` sxmEx){`\n\n `throw` `SxmException` `.getInnermostException (sxmEx);`\n\n\
    `    }`\n\n `catch` ` (System.` `Exception` ` ex){`\n\n `throw` ` ex;`\n\n`    }`\n\
    \n`  }`\n\nAn `SxmTransaction` object should always be instantiated within a `using`\
    \ statement. This is important in order to guarantee that database resources are\
    \ properly released. The transaction cleanup code, which is automatically called\
    \ when exiting the `using` block, has a no-throw guarantee. The reason for this,\
    \ is that even if cleanup encounters an error it makes a best effort to complete\
    \ processing and release all resources. We don’t want to leave the database in\
    \ an indeterminate state by interrupting cleanup midway through. The transaction\
    \ cleanup code has one additional behavior you need to be aware of;\n\n*   If\
    \ a transaction that performed a database update is being cleaned-up, and the\
    \ transaction is still active, i.e., a call to `commitTransaction` or `rollbackTransaction`\
    \ was not successfully executed, then the cleanup code will automatically roll\
    \ back the transaction.\n\nThis is important to understand. Exiting a `using`\
    \ block with an active transaction is essentially considered an error condition\
    \ by the cleanup code and will result in a rollback. As far as dealing with errors\
    \ inside the using block, there are a variety of try-catch combinations that you\
    \ could use, but they all basically boil down to three options.\n\n*   Place a\
    \ try-catch around the `using` block.\n\n*   Place a try-catch inside the `using`\
    \ block that encloses all statements.\n\n*   Place a try-catch around the `using`\
    \ block and around specific statements inside the `using` block."
