  trans: "\n\n我决定使用 Xamarin Studio，因为它在 Windows 和 OSX 之间提供了相当一致且统一的界面。如果你还没有安装，请访问以下\
    \ URI 安装 Xamarin：[`xamarin.com/download`](http://xamarin.com/download)。\n\n![](img/Image00015.jpg)\n\
    \n安装完成后，启动 Xamarin Studio 并在启动界面选择 `New Solution`，或者选择 `File->New->Solution`。这将打开\
    \ `New Solutions` 对话框，见下方的截图。我们将从创建一个基础 Android 应用程序开始，即一个包含单个 activity 的 Android\
    \ 项目。\n\n在 `New Solutions` 对话框中，选择 `Android` 然后 `Android Application`。我将项目命名为\
    \ `JSearch`，它是 Job Search 的缩写。\n\n![](img/Image00035.jpg)\n\n创建完成后，我们的解决方案应该会出现在\
    \ Xamarin Studio 中，类似于下方的截图。\n\n![](img/Image00007.jpg)\n\n现在，我们将为新创建的解决方案添加 `SQLite.XM`。`SQLite.XM`\
    \ 是一个共享项目，可以被 Xamarin 目标的所有平台使用，包括 iOS、Android 和 Windows。右键点击 `JSearch` 解决方案，导航到\
    \ `Add->Add Existing Project`，见下方的截图。\n\n![](img/Image00013.jpg)\n\n这将弹出打开项目对话框，见下一张截图。导航到你从\
    \ GitHub 下载的 `SQLite.XM` 项目所在的文件夹，并将其添加到解决方案。\n\n![](img/Image00009.jpg)\n\n接下来，我们需要添加\
    \ `SQLite.XM` 需要的若干引用。右键点击项目标题列出的 `References` 文件夹。这将显示引用菜单，见下方的截图。选择 `Edit References`\
    \ 菜单项。\n\n![](img/Image00025.jpg)\n\n`Edit Referenced` 对话框将显示，见下一张截图。首先选择 `Packages`\
    \ 标签，然后添加以下四个包：\n\n- `Mono.Data.Sqlite`\n- `System.Data`\n- `System.Web.Services`\n\
    - `System.Xml.Linq`\n\n![](img/Image00008.jpg)\n\n接下来，选择编辑 `References` 对话框的 `Projects`\
    \ 标签，然后选择 `SQLite.XM` 项目。见下方的截图。点击 `OK` 按钮添加引用。\n\n![](img/Image00023.jpg)\n\n\
    接下来，选择 `Project->Add NuGet` Package。\n\n![](img/Image00039.jpg)\n\n这将打开 `Add Packages`\
    \ 对话框；见下一张截图。\n\n![](img/Image00000.jpg)\n\n将包 `Json.NET` 添加到你的项目中。到此时，我们已经完全创建了项目骨架，准备好开始了！\n\
    \n## 平台特定代码\n\n`SQLite.XM` 被设计为适用于 iOS 和 Android 程序的跨平台解决方案。它几乎没有平台特定的代码。最坏的情况下，你可能需要在\
    \ Android 的 `SQLite.XM` 初始化序列中添加一行代码，这行代码在 iOS 中是不需要的。我将向你展示后者。这就是你需要处理的所有平台特定代码，`SQLite.XM`\
    \ 中的其他所有内容在 Android 和 iOS 之间都是一致的。\n\n但在内部，`SQLite.XM` 包含一些平台特定的代码。`SQLite.XM`\
    \ 中的两个文件包含了条件编译指令，用于根据你编译的目标平台来选择正确的代码。在以下两个文件的顶部有两个 `#ifdef` 语句，一个针对 Android，一个针对\
    \ iOS。\n\n- `HotRiot->HotRiot_CS.cs`\n- `Synchronize.cs`\n\n取消注释引用你正在编译平台的语句。下方显示了\
    \ `Synchronize.cs` 文件顶部的截图，它取消了 Android 指令的注释。\n\n![](img/Image00003.jpg)\n\n\
    ## 第 2 部分：设备上的数据存储\n\n### 描述你的应用程序数据库\n\n构建数据持久层的第一步是为应用程序使用的每个数据库创建一个描述符。描述符提供了关于你的应用将使用的数据库的基本信息。以下是数据库描述符类的部分列表。\n\
    \n```csharp\npublic class DatabaseDescriptor\n{\n    private string databaseName;\n\
    \    private Environment.SpecialFolder databaseFolder;\n    public Environment.SpecialFolder\
    \ DatabaseFolder\n    {\n        get { return databaseFolder; }\n    }\n    public\
    \ bool noLog = false;\n    public string logfileName;\n    public int logfileMaxSize\
    \ = 1024 * 1024;\n    public Environment.SpecialFolder logfileFolder = Environment.SpecialFolder.Personal;\n\
    \    public DatabaseDescriptor (string databaseName, Environment.SpecialFolder\
    \ databaseFolder = Environment.SpecialFolder.ApplicationData)...\n    public static\
    \ DatabaseDescriptor getDescriptor(string databaseName)...\n    public ArrayList\
    \ getNames()\n}\n```\n\n`DatabaseDescriptor` 构造函数接受一个必需参数；你想要创建的数据库名称。它还接受一个可选文件夹。默认情况下，数据库位于\
    \ `Personal` 文件夹中。这是当前用户的个人或主目录，在 Android 中，它相当于：\n\n`/data/data/<application\
    \ name>/files`\n\n在 iOS 中则是：\n\n`<application name>/documents/`\n\n`DatabaseDescriptor`\
    \ 类对其控制有合理的默认值。当然，如果你不喜欢这些默认值，可以更改它们。在下方的示例中，数据库的位置被设置为 `Personal*` 文件夹。\n\n```csharp\n\
    try\n{\n    DatabaseDescriptor dd = new DatabaseDescriptor(\"jSearch\", Environment.SpecialFolder.Personal);\n\
    \    dd.logfileMaxSize = 1024 * 1024 * 5;\n    dd.logfileName = \"jSearch-log\"\
    ;\n}\ncatch (Exception ex)\n{\n    string message = ex.Message;\n}\n```\n\n一旦创建，描述符中的数据库名称和文件夹位置无法更改。这是合理的；很难想象什么情况下这样做是有意义的。总之，其中任何项都会更改描述符所引用的数据库。每个描述符还包含了日志文件的属性。这意味着，每个数据库都可以且应该有自己的日志。这看起来可能有些过度设计；为什么不在数据库之间共享一个日志文件呢？原因有两个；这为日志管理提供了灵活性，而且解析多个数据库共享的单个文件要困难得多。\n\
    \n日志文件会自动分配与数据库相同的名称，扩展名为 `.log`，其默认大小为 1MB。默认情况下，日志文件放置在 `Personal` 文件夹中。这是当前用户的个人或主目录，在\
    \ Android 中，相当于：\n\n`/data/data/<application name>/files`\n\n当然，你可以更改这些默认值。在下方的示例中，我们将日志文件的最大大小从默认的\
    \ 1MB 更改为 5MB，并将文件名更改为 `jSearch-log`。\n\n当日志文件达到最大大时，它将从 `<` `logfile name` `>.log`\
    \ 重命名为 `<` `logfile name` `>.old.log` 并启动一个新的日志文件。如果存在旧日志文件，它将被覆盖。如果你不需要日志，将 `noLog`\
    \ 设置为 `false`。\n\n"
- fmt: "\nDatabase descriptors are used by the persistence layer as needed; this is\
    \ all automatic and under the covers. As part of your apps initialization, you\
    \ must create a descriptor for each database. Only create one per database. `SQLite.XM`\
    \ will quietly ignore attempts to initialize a descriptor for the same database\
    \ more than once. You do not need to keep the instances of the descriptor objects\
    \ that you create since the persistence layer automatically manages descriptors.\
    \ Once created, descriptors can safely be forgotten about. However, if you need\
    \ to get a descriptor, use the static method:\n\n`public static DatabaseDescriptor\
    \ getDescriptor(string databaseName)`\n\nThis method will return the descriptor\
    \ for the named database, or null of the descriptor could not be found.\n\nIn\
    \ the example below, we create three database descriptors. The first two use the\
    \ defaults for all of the control parameters. In the third descriptor, logging\
    \ is turned off.\n\n```csharp\ntry {\n    new DatabaseDescriptor(\"user\");\n\
    \    new DatabaseDescriptor(\"records\");\n    DatabaseDescriptor dd = new DatabaseDescriptor(\"\
    report\");\n    dd.noLog = true;\n}\ncatch (Exception ex) {\n    string message\
    \ = ex.Message;\n}\n```\n\nWhile you can create as many databases as your app\
    \ requires, as a practical matter, the vast majority of mobile applications really\
    \ only need a single database. This is the simplest approach and works well in\
    \ most cases. I would recommend this as the default unless you have a compelling\
    \ reason to do otherwise. Multiple databases can add complexity. For example,\
    \ joins across databases require that the joined databases be attached using the\
    \ `attachDatabase` method; explained in detail later. This introduces potential\
    \ concurrency issues, such as when trying to attach a currently locked database.\
    \ There is also additional system overhead when working with multiple databases.\
    \ While this generally not a serious concern, mobile devices are limited in resources\
    \ and efficiency should always be considered in your design. That being said,\
    \ there are times when multiple databases are the right choice.\n\n## Schema initialization\n\
    \nOnce the database descriptors have been initialized, the next step is to create\
    \ the tables and indexes required by your schema.\n\nOne feature not present in\
    \ SQLite, is stored procedures, so writing common callable SQL that is stored\
    \ in the database is not an option. Which is well enough, it doesn’t really seem\
    \ to make much sense to support stored procedures in a server-less, embedded database\
    \ like SQLite. So, we have to decide where to put our SQL statements. We have\
    \ a few choices:\n\n*   Put the SQL statements in the database.\n*   Imbed the\
    \ SQL statements in the code.\n*   Place the SQL statements in a properties file.\n\
    \nWhen not using stored procedures, I generally prefer putting SQL statements\
    \ in a centralized datastore, usually the database. It organizes the SQL in one\
    \ location and makes it easy to find, read, and modify independent of the code\
    \ base. I prefer this solution when building applications that use a traditional\
    \ database server, such as `MySQL` or `SQL Server`. In these cases, the database\
    \ is almost always running on a server managed by a DBA. But for SQLite, this\
    \ doesn’t seem to make much sense given how it would need to be implemented.\n\
    \nWe could place the SQL directly in the code, in a single class. This is probably\
    \ is the most efficient solution but it requires users to make code modifications.\
    \ We definitely want to keep that to a minimum, even if only entering SQL text.\
    \ The other possibility is to embed the SQL statements directly in the `SQLite.XM`\
    \ database calls. I really don’t like peppering SQL throughout the code base.\
    \ It is just a mess. It makes it more difficult to locate your SQL, which can\
    \ cause other problems; for example, missing indexing opportunities or increasing\
    \ the likelihood that you will duplicate code.\n\nThe best solution is to place\
    \ our SQL statements in a properties file. This allows us to keep our SQL in a\
    \ central location that makes it easy to read and modify without messing with\
    \ the code. This is not the most efficient solution, as it requires the SQL statements\
    \ properties file to be read and processed when initializing the app. But that\
    \ really shouldn’t cause a significant delay and the tradeoff seems worth it.\
    \ This solution is implemented slightly different on Android and iOS. So we need\
    \ to deal with some application specific issues. As with most engineering design\
    \ decisions, selecting one solution over another is really a balancing of tradeoffs.\n\
    \n## Including a SQL statements properties file in Android\n\nAll Android applications\
    \ include an `Assets` folder. This is the location where you place arbitrary files\
    \ that need to be processed by your app as raw data, for example, the SQL statements\
    \ properties file. You can find this folder in your project, it is created automatically\
    \ by Xamarin. Create an empty file and place it in this folder.\n\n![](Image00027.jpg)\n\
    \nYou can name the file whatever you like, for the examples in this book, we call\
    \ it `SqlStatements.txt`. This will be our SQL statements properties file. This\
    \ is all that’s needed in order to include a statements file in an Android project.\
    \ Later on, I’ll show you how to access the file.\n\n## Including a SQL statements\
    \ properties file in iOS\n\nXamarin based iOS application include a `Resources`\
    \ folder. This is the location where you place arbitrary files that need to be\
    \ processed by your app, for example, the SQL statements properties file. You\
    \ can find this folder in your project, it is created automatically by Xamarin.\
    \ Create an empty file and place it in this folder. If you like, you can place\
    \ it within a subfolder of the `Resources` folder. This can help to organize things\
    \ even further.\n\n![](Image00019.jpg)\n\nYou can name the file whatever you like.\
    \ In the screenshot above and for the iOS examples later in the book, we call\
    \ it `SqlStatements.txt` and we placed in the subfolder `sqlProperties`. This\
    \ will be our SQL statements properties file. This is all that’s needed in order\
    \ to include a statements file in an iOS project. Later on, I’ll show you how\
    \ to access the file.\n\nAs a side note, iOS requires that application resource\
    \ files be placed in the application's root directory. Unfortunately, this can\
    \ get a bit messy. To clean things up, Xamarin has this notion of a `BundledResource`\
    \ build action, which lets you put files in the `Resources` directory instead\
    \ of in the root. The contents of the `Resources` directory gets mapped to the\
    \ root of the application during the build process. This is done automatically\
    \ by Xamarin. I find this to be a really nice feature that helps to organize your\
    \ project a bit better.\n\n## Parameterized queries\n\nBefore explaining the structural\
    \ details of the SQL statements properties file, we need to understand how queries\
    \ should be written for SQLite.XM. All queries that require user supplied data\
    \ must be written as a parameterized query. Parameterized queries are also known\
    \ as prepared statements. A parameterized query is a query that is written where\
    \ place holders are put in the query where user supplied data would normally appear;\
    \ see the example below.\n\n```sql\nINSERT INTO companyReg (companyRegPK, coName,\
    \ hrContact, email, password) VALUES( ?, ?, ?, ?)\n```\n"
