- fmt: '

    Unfortunately, it is much more likely that you’re creating an app that follows
    the online or OCA model. In this case, things can get a bit murky. In most instances,
    an online mobile application can be designed as an OCA, and vice versa. Actually,
    I think it would be more accurate to say that most online mobile apps are really
    misidentified OCAs.


    Let us look at an example. Imagine you are creating an app for a specialty merchant
    that’s similar to the Amazon price comparison application. The app searches for
    items in inventory via a barcode scan and displays price comparisons. For this
    example, let’s say this is the only feature in our application. This would seem
    to be an online application, as the app needs to communicate with a back-end server
    in order to locate the scanned product information. This is true. But what are
    you going to do if there is no connectivity? You could simply error out of a price
    check request by displaying some status message to the user. Not such a great
    outcome. The other option is to offer to save the request locally until network
    connectivity is reestablished, at which time, the app will perform the search
    and present the results to the user. Much better! Our seemingly online application,
    when thought through, is really an OCA. When there is no network connectivity,
    it still allows users to perform product scans. The app completes its processing
    cycle, searching and displaying price comparisons, when connectivity is reestablished.


    As a general rule, it’s better to choose the OCA model whenever possible. If you
    think your app qualifies as a pure online application, think again. Really think
    through the various use case scenarios. In most instances, you will find your
    application is better designed as an OCA. While this does add complexity, it also
    provides for the best user experience.


    ## Is this some kind of joke?


    A complete cross-platform data storage solution for a typical OCA requires a number
    of technologies working together. The reason for this traces back to the need
    for OCAs to function offline and online and to be able to synch. This requires
    an infrastructure that can support a “store and forward” architecture for the
    application data. This, in turn, necessitates a database on the device, a server-side
    database, and a middleware tier to link the two. In our case, we want our solution
    to be cross platform, so we’ll also need a cross platform development framework.
    Admittedly, the reasons for choosing a cross-platform solution goes beyond the
    data layer, but this is nonetheless a requirement. It would also be nice to have
    an abstraction layer that simplifies working with `SQLite` and that include the
    logic for performing synching. If you put this all together, you end up with a
    list that looks like the one below


    *   `SQLite` : Our local device datastore.

    *   `SQLite.XM` : Our `SQLite` abstraction layer, which includes support for data
    synching.

    *   A server-side middle tier : For the examples in this book, we’re using `HotRiot.com`.

    *   A server side database : Either a traditional relational database, for example,
    `MySQL`, or a NoSQL document datastore, such as `MongoDB`.

    *   `Xamarin` : Our cross-platform framework.


    The list above is quite a combination of technologies. It includes a device-side
    and server-side database, a cross-platform development framework, a `SQLite` abstraction
    layer with synching logic, and a server-side middle tier. That might seem like
    a bit much just to support data persistence. But it turns out, to fully implement
    a cross-platform OCA, they are all needed.


    Let’s have a look at where each of these components fits in.


    ### SQLite

    `SQLite` is light weight, server-less traditional relational database. By “traditional”,
    I mean a database that supports transactions with ACID compliance, joins, triggers,
    implements standard `SQL`, etc. As the name implies, `SQLite` is a database implementation
    designed as a light weight solution with a small footprint intended to run on
    devices with limited resources.


    iOS and Android both have a `SQLite` database engine built in as part of their
    platform. So there’s nothing you need to do to make `SQLite` available to your
    application for these two OS’. Windows Phone offers `SQLite` as an extension that’s
    simple to install from `Visual Studio`. Most mobile applications need to save
    at least some data locally. `SQLite` is a natural choice as it is readily available
    for mobile and very capable.


    ### SQLite.XM

    `SQLite.XM` is a `SQLite` abstraction layer written in `C#` and designed to be
    used with apps developed using `Xamarin`. It makes using `SQLite` with `Xamarin`
    a snap. It shields your application from the details of working directly with
    `SQLite`. Instead, your app interfaces with a high level, cross-platform layer
    that provides database CRUD functionality. In addition to providing an abstraction
    layer that greatly simplifies database searching and record retrieval, `SQLite.XM`
    also takes care of organizing your `SQL`, initializing your apps schema, performing
    schema updates, and synchronizing data to a server-side database.


    At this point, the obvious question is: where does `SQLite.XM` synch device data?
    `SQLite.XM` comes out of the box ready to synch with `HotRiot.com`. `HotRiot`
    is a hosted server-side platform for mobile application; see the next section
    for more details. `SQLite.XM` is also capable of communicating with any server
    for the purpose of data synching. It allows you to insert your own delegate method
    into the synchronization processing chain for the purpose of writing an interface
    to any cloud based server of your choosing. I go into detail explaining this is
    part 3 of the book; “Data synchronization to the cloud.”


    ### A server-side middle tier

    An OCA needs to synch its device data to a server side datastore. This is taken
    care by by `SQLite.XM` on the device side. However, a middleware server is needed
    in order to actually write the data into to the database. As a general rule, you
    never let the device connect directly to the server database. Instead, requests
    are made to a middle tier which then performs the database operation on behalf
    of the client. However, there is more to this. We don’t just synch data to the
    server for the sake of synching. We do it to get information over to the server
    to support functionality needed by the app, which requires the support of a back-end.


    Just reading and writing to a back-end database such as `MySQL` or `Mongo` will
    require middleware support. But there is a host of other services that many apps
    also require, for instance:


    *   Push notifications through Apple Push Notification Service or Google Cloud
    Messaging.

    *   Provide a central repository for apps that need to share data generated between
    devices’

    *   Document management support. Such as generating thumbnails or moving file
    attachments to a key/value store such as `AWS S3`.

    *   Support for event triggers. For example, contacting a user when a record is
    stored in the database that includes some information of interest.

    *   Bulk email processing for contacting all of users by email.

    *   Managing permissions for security.

    *   Sending email confirmations, for example when a user registers with an application.


    This is not an exhaustive list by any means but it highlights a number of services
    requiring a back-end infrastructure. Now, there are several ways to approach this.
    You could build out your own server-side infrastructure. However, this is a lot
    of work to do correctly and adds little to differentiate your application. The
    back-end, while critical, is largely invisible to end users. Your users are never
    going to love your app because you did a great job developing the server-side.
    They will only notice when it doesn’t perform. It is a ton of work to write the
    code, deploy servers and provide ongoing support. Not to mention all of the time
    this adds to your development cycle. This can really get expensive. There is a
    better way. Find a good hosted service and use it!

