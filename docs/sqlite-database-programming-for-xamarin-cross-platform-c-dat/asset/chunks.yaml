  trans: "\n\n```\nrow.AddView (tv);\n}\njobsTable.AddView(row);\n}\n}\n```\n\n第 1\
    \ 行选择了下一行进行处理。行按照查询返回的顺序进行迭代。当没有更多记录可以处理时，`nextRow` 方法将返回 `false`。第 2、第 3 和第 5\
    \ 行通过调用 `getValue` 方法获取实际行数据。我们正在选择作业标题、描述和薪资。`getValue` 返回一个通用对象，因此可能需要将返回对象转换为其实际类型，正如我们在这里所做的那样。例如，在第\
    \ 2 行和第 3 行中，返回值被转换为字符串。在第 4 行中，我们正在获取 `pay` 字段返回的值的数据类型信息。通常情况下这是必要的，因为你通常预先知道字段的数据类型。然而，如果你需要动态获取字段的类型信息，可以像这样做。`nextRow`\
    \ 方法仅允许你在结果集中向前移动；有时这是一个问题，而有时则不是。如果你需要对结果进行多次迭代，或者需要在搜索结果中自由地向前向后移动，请先从结果集中提取记录并将放入集合中。\n\
    \n## 在代码中嵌入 SQL\n\n让我从一开始就说，除非你有非常充分的理由，否则我不建议将 SQL 直接嵌入到代码中。SQL 语句应该放置在 SQL 语句属性文件中。尽管如此，可能存在需要嵌入\
    \ SQL 的合法情况。`SQLite.XM` 包含了 `executeUpdate`、`executeDelete` 和 `executeQuery` 方法的变体，这些方法接受\
    \ SQL 字符串。它们列如下：\n\n* `executeDeleteDirect (string sqlStatement, ArrayList ParameterValues)`\n\
    * `executeUpdateDirect (string sqlStatement, ArrayList ParameterValues)`\n* `executeQueryDirect\
    \ (string sqlStatement, ArrayList ParameterValues)`\n\n这些是我们迄为止使用的 `executeUpdate`、`executeDelete`\
    \ 和 `executeQuery` 方法的直接替换方案。这三个方法的第一个参数都是你想要执行的实际 SQL 语句。你可以以任何喜欢的方式设计 SQL，但它必须使用书中贯穿且\
    \ `SQLite.XM` 要求的参数化形式。第二个参数是通常的数值 `ArrayList`，用于替换 SQL 语句中的占位符；它可以是 `null` 或空列表。\n\
    \n## 多数据库语句处理\n\n这个概念在稍后会进行更详细的探讨；然而，我需要对连接（attaching）和断开（detaching）数据库的概念进行简要介绍。当创建一个\
    \ `SxmTransaction` 对象时，它是针对某个特定命名数据库的。在下面的代码行中，我们为 `jsearch` 数据库实例化事务。这被称为事务的主数据库。\n\
    \n```\nsxmTransaction = new SxmTransaction(\"jsearch\");\n```\n\n这里没什么特别的，我们已经在许多示例中见过了。一旦创建，由事务对象执行的\
    \ SQL 语句将在与特定事务关联数据库上执行。然而，如果你想执行需要访问两个或多个数据库中表的语句呢？为了实现这一点，你需要将其他次要数据库“连接”到事务中，此时它们就可以参与事务执行的查询。以下是一个示例：\n\
    \n```\nsxmTransaction = new SxmTransaction(\"jsearch\");\nsxmTransaction.attachDatabase(\"\
    anotherDatabase\");\n```\n\n一旦连接，你就可以执行需要连接数据库的 SQL 语句。在断开之前，连接的数据库保持可访问状态并作为事务对象的一部分。这将在“跨数据库执行连接”章节中进行更详细的探讨。我只是想向你介绍这个概念，因为我在后面的章节中会引用它。\n\
    \n## 理解事务\n\n事务是一系列应用于数据库的 SQL 语句，作为一个原子操作执行，它要么全部成功，要么全部失败。不要将 `SxmTransaction`\
    \ 对象与事务混淆。并不是所有的 `SxmTransaction` 对象都实现了真正的数据库事务。让我解释一下。只有当 `SxmTransaction` 对象执行以某种方式修改数据库的\
    \ SQL 语句时（即任何除 select 语句以外的语句），才会会创建一个底层的数据库事务。以下是关于事务需要注意的几点。\n\n* 只执行 select\
    \ 语句的 `SxmTransaction` 对象永远不会创建底层数据库事务。实际上没有必要将一系列 select 语句封装在事务中，因为没有需要提交的内容。\n\
    * 底层数据库事务只有在 `SxmTransaction` 对象执行 select 语句以外的语句时，才由该对象启动。使用这种延迟初始化策略的原因是，事务会获取数据库锁，这可能会阻塞其他操作；例如，其他数据库的更新。根据计算的一般原则，你应尽量减少阻塞。\n\
    * 连接的数据库完全参与事务。如果你将一个数据库连接到 `SxmTransaction` 对象并处理修改该数据库的 SQL 语句，对 `commitTransaction`\
    \ 的调用将提交对主数据库和连接数据库所做的所有更新。\n* 一旦底层数据库事务启动，你就不能再连接或断开数据库。\n* 单个 `SxmTransaction`\
    \ 对象可以托管多个事务，当然，是串行执行。\n\n最后一点需要详细说明；考虑下面的代码。我们实例化了一个的 `SxmTransaction` 对象，然后使用它来执行两个独立的事务。在这个示例中，即使第一个事务失败，我们也允许第二个事务执行。只要事务是独立的，这就没有问题。需要记住点是，你必须在启动另一个事务之前完成一个事务。现在，我知道这看起来显而易见，但如果你未能成功调用\
    \ `commitTransaction` 或 `rollbackTransaction`，事务将保持激活状态。在这种情况下，额外的数据库操作将附加到未完成的激活事务中，这显然不是你想要的。\n\
    \n```\nusing (SxmTransaction sxmTransaction = new SxmTransaction(\"jsearch\"))\
    \ {\n    try {\n        sxmTransaction.executeInsert(\"registerCompany\", parameterValues);\n\
    \        if (sxmTransaction.commitTransaction() != SQLiteErrorCode.Ok) {\n   \
    \         throw new SxmException(\"registerCompany commit error.\", SQLiteErrorCode.userDefined);\n\
    \        }\n    } catch (Exception ex) {\n        sxmTransaction.rollbackTransaction();\n\
    \    }\n    try {\n        sxmTransaction.executeInsert(\"newRegistration\", parameterValues);\n\
    \        if (sxmTransaction.commitTransaction() != SQLiteErrorCode.Ok) {\n   \
    \         throw new SxmException(\"newRegistration commit error.\", SQLiteErrorCode.userDefined);\n\
    \        }\n    } catch (Exception ex) {\n        sxmTransaction.rollbackTransaction();\n\
    \    }\n    sxmTransaction.executeQuery(\"findCompany\", null);\n    return sxmTransaction.getAllRows();\n\
    }\n```\n\n## 事务可见性\n\n让我们更仔细观察一个事务执行的操作是如何被其他事务“看到”的。这个概念被称为事务隔离性。\n\n"
- fmt: "\nWhen there are multiple transaction objects active at the same time, operations\
    \ that modify the database that are performed by one transaction are not visible\
    \ to other transactions until they are committed. This can seem a bit strange\
    \ at first. You really need to understand how this works, otherwise you can wind\
    \ up with seemingly inexplicable behavior. The `processSubmitHandler` method below\
    \ is from our earlier example, rewritten to illustrate transaction isolation.\n\
    \n```csharp\nprivate  void  processSubmitHandler()\n{\n  ArrayList parameterValues\
    \ = new ArrayList ();\n  string registrationPK = Guid.NewGuid().ToString();\n\
    \  string companyName = FindViewById<EditText>(Resource.Id.coRegName).Text;\n\
    \  parameterValues.Add (registrationPK);\n  parameterValues.Add (companyName);\n\
    \  parameterValues.Add (FindViewById<EditText>(Resource.Id.coRegContact).Text);\n\
    \  parameterValues.Add (FindViewById<EditText>(Resource.Id.coRegEmail).Text);\n\
    \  parameterValues.Add (FindViewById<EditText>(Resource.Id.coRegPassword).Text);\n\
    \  using (SxmTransaction sxmTransaction1 = new SxmTransaction (\"jsearch\")){\n\
    \    InsertResponse ir = sxmTransaction1.executeInsert(\"registerCompany\", parameterValues);\n\
    \    using (SxmTransaction sxmTransaction2 = new SxmTransaction (\"jsearch\")){\n\
    \      parameterValues.Clear();\n      parameterValues.Add (companyName);\n  \
    \    sxmTransaction2.executeQuery(\"findCompany\", parameterValues);\n      List\
    \ <Hashtable > rows = sxmTransaction2.getAllRows();\n      sxmTransaction1.commitTransaction\
    \ ();\n      sxmTransaction2.executeQuery(\"findCompany\", parameterValues);\n\
    \      rows = sxmTransaction2.getAllRows();\n     }\n}\n```\n```\n\nThis example\
    \ shows how a record written to the database by one `SxmTransaction` object is\
    \ invisible to another `SxmTransaction` object until the first object commits\
    \ its transaction. For this example, assume we are starting with a database that\
    \ has no records. Let’s pick apart the method.\n\n*   On line 1, we instantiate\
    \ an `SxmTransaction` object.\n*   On line 2, a record is written to the `registration`\
    \ table using our newly created transaction object.\n*   On line 3, another `SxmTransaction`\
    \ object is created.\n*   On line 4, a query is executed using the transaction\
    \ object created on line 3. This query searches for all records in the `registration`\
    \ table.\n*   On line 5, we attempt to get the record data returned from the query\
    \ executed on line 4. However, because the insert that was executed on line 2\
    \ has not yet been committed, the result set is empty.\n*   On line 6, the transaction\
    \ object created on line 1 commits all of its updates. This transaction object\
    \ is no longer usable.\n*   On line 7, a query is executed using the transaction\
    \ object created on line 3. This query searches for all records in the `registration`\
    \ table.\n*   On line 8, we attempt to get the record data returned from the query\
    \ executed on line 7. Because a commit was performed by the transaction object\
    \ that insert the record, the record is found.\n\nA few things that should be\
    \ noted from the sequence above. First, the obvious; be careful not to write your\
    \ code in a such way that you wind up expecting to see updates to the database\
    \ made by other transactions before they are committed. One simple way to avoid\
    \ this problem altogether, is to have only one transaction object active at any\
    \ given time. This may or may not be an acceptable solution given your particular\
    \ application requirements.\n\nAnother, more subtle side effect that you need\
    \ to be aware of, is that when working with multiple concurrent transaction, you\
    \ can wind up with inconsistent results from database reads for which the reason\
    \ may not be obvious. In the example above, we execute the exact same query on\
    \ line 4 and line 7, and get different results each time, from the same transaction\
    \ object. When working with an enterprise database, this would hardly be worth\
    \ mentioning; as reads, writes, and deletes coming from multiple independent connections\
    \ is the norm. But, this behavior might be less expected when running a single\
    \ app against a dedicated database.\n\nAssuming a result set is not empty, from\
    \ the point that a select has executed, other `SxmTransaction` objects are blocked\
    \ until the `SxmTransaction` object is fully iterated. This guarantees that the\
    \ result set remains unchanged. SQLite does not have the ability for snapshot.\n\
    \n### Performing joins across databases\n\nFor the vast majority of applications,\
    \ a single database is all that is needed if your app falls into that category,\
    \ you can safely skip this section. Of course, there are exceptions, and some\
    \ developers may feel their requirements are better met having more than one database.\
    \ I am not going to go into detail the merits of single-database versus multi-database.\
    \ Here, I simply explain the mechanics of queries multiple databases.\n\n```csharp\n\
    try {\n  DatabaseDescriptor(\"user\");\n  DatabaseDescriptor(\"transaction\");\n\
    } catch (Exception ex) {\n  string message = ex.Message;\n}\n```\n\nThe `user`\
    \ database stores registrations and related information while the `transaction`\
    \ database stores purchases and related information. The following tables appear\
    \ in each database:\n\n(Image0014)\n\nOur databases include other tables but we\
    \ do not need to consider them in order to illustrate this example. Every time\
    \ a user purchases a product, an entry is made into the `purchase` table that\
    \ records the primary key of the user that made the purchase along with other\
    \ product information. We would like to run a query that joins these two tables\
    \ and returns all of the purchases made by a specific user along with the user’\
    \ registration information.\n\nLet’s write a function to do this. For readability,\
    \ I have opted to include the SQL query as part of the method rather than defining\
    \ it inside the SQL statements file.\n\n```csharp\nprivate ArrayList GetUserPurchases(string\
    \ userPK)\n{\n  ArrayList transactions = new ArrayList();\n  ArrayList searchCriterion\
    \ = new ArrayList();\n  searchCriterion.Add (userPK);\n  using (SxmTransaction\
    \ sxmTransaction = new SxmTransaction (\"user\")){\n    sxmTransaction.attachDatabase(\"\
    transaction\");\n    string selectStmt = \"SELECT reg.*, pur.name AS purName,\
    \ pur.productPK, pur.purchasePrice FROM registration AS reg JOIN transaction.purchase\
    \ AS pur ON pur.registrationFK == reg.registrationPK\";\n  }\n}\n```\n"
