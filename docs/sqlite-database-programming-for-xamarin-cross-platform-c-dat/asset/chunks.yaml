  trans: "\n\n```cs\nstring exType = (string)hex.Data[\"exceptionType\"];\n\n// 某种连接问题。\n\
    if (exType.Equals(\"WebException\") == true || exType.Equals(\"IOException\")\
    \ == true)\n{\n    // 通知用户存在连接问题且无法保存注册信息。\n}\nelse\n{\n    // 发生了其他异常。执行相应操作。\n\
    }\n}\n\nprivate async Task postRegistrationLocal(string registrationPK, string\
    \ systemSynchID)\n{\n    ArrayList parameterValues = new ArrayList ();\n    parameterValues.Add(registrationPK);\n\
    \    parameterValues.Add(FindViewById<EditText>(Resource.Id.coRegName).Text);\n\
    \    parameterValues.Add(FindViewById<EditText>(Resource.Id.coRegAddress).Text);\n\
    \    parameterValues.Add(FindViewById<EditText>(Resource.Id.coRegCity).Text);\n\
    \    parameterValues.Add(FindViewById<EditText>(Resource.Id.coRegState).Text);\n\
    \    parameterValues.Add(FindViewById<EditText>(Resource.Id.coRegZipcode).Text);\n\
    \    parameterValues.Add(FindViewById<EditText>(Resource.Id.coRegEmail).Text);\n\
    \    parameterValues.Add(FindViewById<EditText>(Resource.Id.coRegPhone).Text);\n\
    \    parameterValues.Add(FindViewById<EditText>(Resource.Id.hrContact).Text);\n\
    \    parameterValues.Add(FindViewById<EditText>(Resource.Id.hrEmail).Text);\n\
    \    parameterValues.Add(FindViewById<EditText>(Resource.Id.hrPhone).Text);\n\
    \    parameterValues.Add(FindViewById<EditText>(Resource.Id.hrPicture).Text);\n\
    \    parameterValues.Add(FindViewById<EditText>(Resource.Id.coIOSToken).Text);\n\
    \    parameterValues.Add(FindViewById<EditText>(Resource.Id.coAndroidToken).Text);\n\
    \    parameterValues.Add(FindViewById<EditText>(Resource.Id.coRegPassword).Text);\n\
    \    parameterValues.Add(systemSynchID);\n    try\n    {\n        using (SxmTransaction\
    \ sqlTransaction = new SxmTransaction(\"jsearch\"))\n        {\n            InsertResponse\
    \ ir = sqlTransaction.executeInsert(\"registerCompany\", parameterValues);\n \
    \           sqlTransaction.commitTransaction ();\n        }\n    }\n    finally\n\
    \    {\n        Intent CoHomeActivity = new Intent(this, typeof(CoHomeActivity));\n\
    \        CoHomeActivity.PutExtra(\"registrationPK\", registrationPK);\n      \
    \  StartActivity(CoHomeActivity);\n    }\n}\n```\n\n* 第 1 行将提交按钮的处理器设为 `registrationSubmit`。此方法负责将注册中的\
    \ `companyReg` 部分提交到 Hotriot。请记住，注册信息会保存到三个表中，此方法只提交到 `companyReg`。\n* 第 2 行实例化了一个名称值对。它包含了将保存到\
    \ Hotriot 的公司注册数据。\n* 在第 3 行，设置了记录的 `systemSynchID`。如你所知，`systemSynchID` 是一个必填字段，用于同步时唯一标识记录。在\
    \ Hotriot 中手动创建新记录时，该字段必须设置为 GUID。接下来的几行代码设置了记录的其余字段。\n* 在第 4 行，将记录提交到 Hotriot。我不想把它写成\
    \ Hotriot 教程，因此不再对此详述。详情请参阅 Hotriot 的 C# 文档。地址请访问：`https://hotriot.com/hrCSAPI/hotriot_interface_guide.htm`\n\
    * 第 5 行检查第 4 行提交操作的结果码。如果成功，则调用 `postRegistrationlocal` 方法将注册记录保存到设备数据库；否则，则检查结果码。\n\
    * 第 6 行检查失败是否由非唯一数据错误引起。如果是，则获取结果消息。\n* 第 7 行检查结果消息，确认密码字段是否是导致非唯一数据错误的原因。只有当记录中的多个字段都可能导致此类错误时，才需要此检查。我将此加入代码仅是为了说明如何操作。\n\
    \n顺便提一下，你可能对无效数据错误和非唯一数据错误在 `resultMessage` 字段中返回的内容感兴趣。在 Hotriot 创建数据库的第 4 步中输入的验证文本会在发生无效数据错误时返回，而在第\
    \ 5 步中输入的验证文本则会在发生非唯一数据错误时返回。通过检查结果消息，你可以轻松地确定触发错误的字段。当我设置验证文本时，我总是以字段名开头并跟一个冒号，这使得非常容易识别出出错的字段。\n\
    \n在执行某些需要连接的操作之前检查连接是否存在是可以的。但这并不是真正可以依赖的。你可能检查并发现连接存在，但在几毫秒后它就消失了。无论你认为认为连接是否存在，你都需要编写逻辑来处理连接错误。连接检查实际上只有在收到负面响应时才真正有用。在这种情况下，你可能决定跳过基于连接的操作，或者采取某些替代措施，例如通知用户。\n\
    \n如果你的应用程序设计为允许用户在包含唯一字段的表中执行离线插入（例如，在飞行模式下进行注册），那么在插入时将无法确定特定字段相对于其他用户保存的所有值来说是唯一的。你别无选择，只能设计某种机制，当以后发现唯一字段不唯一时，要求用户修改其输入。\n\
    \n### 编写同步错误处理器\n\n同步错误处理器的任务应限于判断触发同步失败的日志条目是否应该删除。仅此而已！这是通过将 `SynchResponse`\
    \ 对象的 `removeFlag` 设置为 `true` 或 `false` 实现的。实际修复应由同步后委托处理，而不是错误处理器；这将在下一节“同步后委托处理”中进行解释。默认的同步错误处理器所示：\n\
    \n```cs\ninternal static async Task myErrorDel(SynchDescriptor synchDescriptor,\
    \ SynchResponse synchResponse)\n{\n    if (synchResponse.synchErrorType == SQLiteXM.Defines.SynchErrorTypes.exception)\n\
    \    {\n        if (synchResponse.exceptionSynchError.exceptionType.Equals(\"\
    WebException\") == true ||\n            synchResponse.exceptionSynchError.exceptionType.Equals(\"\
    IOException\") == true ||\n            synchResponse.exceptionSynchError.exceptionType.Equals(\"\
    OutOfMemoryException\") == true)\n        {\n            synchResponse.removeFlag\
    \ = false;\n        }\n    }\n    else\n    if (synchResponse.synchErrorType ==\
    \ SQLiteXM.Defines.SynchErrorTypes.processing)\n    {\n        if (synchResponse.processingSynchError.resultCode\
    \ == Hotriot.DB_FULL_EXCEPTION)\n        {\n            synchResponse.removeFlag\
    \ = false;\n        }\n    }\n}\n```\n\n"
- fmt: "\nWhen writing your own handler, you’ll need to determine which errors are\
    \ recoverable and which ones are non-recoverable. Non-recoverable errors should\
    \ result in the current replication log entry being deleted, ending synchronization\
    \ for that record. Of course, synchronization continues processing the next entry\
    \ in the log, if one is present. Otherwise it goes into a wait state, waiting\
    \ for a new entry.\n\nRecoverable errors are a bit more involved. Returning `false`\
    \ in the `removeFlag`, instructs `SQLite.XM` to leave the current replication\
    \ log entry intact; to be re-processed at some later point. Replication then halts\
    \ for a period of time and then restarts processing, beginning with the same record.\
    \ Be careful not to put replication into an endless loop that blocks synchronization.\
    \ Let me explain. The screenshot below shows an invalid data processing error.\n\
    \n![](Image00038.jpg)\n\nThis particular error was caused by sending incorrectly\
    \ formatted data to an email address field. Unless the root cause of the error\
    \ is corrected, trying to resynchronize this record will only result in HotRiot\
    \ returning the same error response; putting replication into an endless loop\
    \ that blocks all synchronization.\n\nIf you return `false` in the `removeFlag`,\
    \ one of the following conditions MUST be true.\n\n*   The condition that caused\
    \ the error must be self-correcting. For example, a timeout from the HotRiot server,\
    \ or a Web or IO exception caused by a connection failure. It must be some sort\
    \ of error that you can be reasonably sure will correct itself when conditions\
    \ change.\n*   The cause of the error must be explicitly corrected.\n\n### Post-synchronization\
    \ processing\n\nA post-synchronization delegate is a method that is inserted into\
    \ the synchronization processing chain that’s called after replication has completed.\
    \ It’s called for each entry in the replication log that’s processed. And it is\
    \ called regardless of whether processing is successful, or a recoverable or non-recoverable\
    \ error is encountered. The post-processing delegate is not called for abort conditions;\
    \ see the section ‘Synchronization abort conditions.’\n\nThe post-processing method\
    \ signature is shown below.\n\n```csharp\npublic delegate Task SynchPostProcessDel(SynchDescriptor\
    \ originalSD, List<SynchDescriptor> sdList, SynchResponse synchResponse);\n```\n\
    \nTo insert a post-processing delegate into the `SQLite.XM` synchronization processing\
    \ chain, do the following.\n\n*   Create an instance of the `SynchOptions` class.\n\
    *   Set the `SynchPostProcessDel` field to your error delegate.\n*   Pass the\
    \ `SynchOptions` class to the `SxmInit.initialize` method.\n\nSee the first four\
    \ lines of code below.\n\n```csharp\nSynchOptions synchOptions = new SynchOptions();\n\
    synchOptions.SynchPostProcessDel = mySynchPostProcessDel;\nsynchOptions.SynchPreProcessDel\
    \ = mySynchPreProcessDel;\nSxmInit.initialize(\"YOUR HotRiot APPLICATION NAME\"\
    , synchOptions);\nthis.StartService(new Intent(this, typeof(SynchronizeService)));\
    \ // For Android only.\n```\n\nIn this short code fragment, we set both the pre-processing\
    \ delegate and the post-processing delegate. Synchronization delegates are not\
    \ interdependent in any way. They can be set individually or with other delegates.\
    \ We did this just to show how you could set multiple delegates.\n\nAs you can\
    \ see, the post-processing delegate method returns a void and is passed the following\
    \ three parameters.\n\n*   `SynchDescriptor originalSD` - This is the synch descriptor\
    \ for the record associated with the entry in the replication log being synchronized.\
    \ This is the descriptor that is passed to the pre-processing delegate, if one\
    \ is registered.\n*   `List<SynchDescriptor> sdList` - This is the list of descriptors\
    \ that `SQLite.XM` actually replicated to HotRiot. It is the output from the pre-processing\
    \ delegate, if one is registered. Otherwise, this list will contain a single entry\
    \ that points to the same object as the `originalSD` parameter.\n*   `SynchResponse\
    \ synchResponse` - This is the response result that was returned from the last\
    \ record in the `sdList` that was synchronized.\n\nThe `SynchResponse` parameter\
    \ requires some additional clarification. The `SynchDescriptors` in the `sdList`\
    \ are synchronized in the order that they appear in the list. A `SynchResponse`\
    \ is returned for each entry processed and is put in the `SynchResponse` instance\
    \ variable of the `SynchDescriptor` being synchronized. Synch descriptors were\
    \ explained in detail in the ‘pre-synchronization delegate processing’ section.\
    \ A partial listing of the `SynchDescriptor` class is shown below.\n\n```csharp\n\
    public class SynchDescriptor\n{\n    public string action;\n    public string\
    \ dbName;\n    public string tableName;\n    public SynchResponse synchResponse;\n\
    \    public Hashtable recordDataToSynch;\n    // ...\n}\n```\n\nThe response from\
    \ the last record processed in the list is returned as the last parameter to the\
    \ post-processing delegate. This is done as a matter of convenience. You could\
    \ easily iterate through the descriptors in the `sdList` and inspect each `SynchResponse`\
    \ object individually. But this is unnecessary, as you are really only interested\
    \ in the response from the last record in the `sdList` that was processed. If\
    \ this is a success response, then replication succeeded, otherwise replication\
    \ failed. Replication is immediately halted if an error is encountered. If there\
    \ is more than one descriptor in the `sdList`, then you will need to iterate through\
    \ the list to know which descriptor caused the failure. I show you how to do this\
    \ a bit later.\n\nThe `SynchResponse` class was covered in detail in the ‘Synchronization\
    \ error delegate processing’ section, so I’ll only do a quick overview. A partial\
    \ listing of this class is shown below.\n\n```csharp\npublic class SynchResponse\n\
    {\n    public SQLiteXM.Defines.SynchErrorTypes synchErrorType;\n    public ProcessingSynchError\
    \ processingSynchError;\n    public ExceptionSynchError exceptionSynchError;\n\
    \    public bool removeFlag = true;\n    // ...\n}\n```\n\nA description of each\
    \ instance variable follows.\n\n*   `SynchErrorTypes synchErrorType` - This is\
    \ a general success or error response value. It will indicate either success or\
    \ the type of error. It will be set to one of the following enums.\n    *   `Defines.SynchErrorTypes.success`\
    \ - Indicates success processing the `SynchDescriptor` associated with this `SynchResponse`\
    \ object.\n    *   `Defines.SynchErrorTypes.exception` - Indicates that an exception\
    \ occurred processing the `SynchDescriptor` associated with this `SynchResponse`\
    \ object. You will need to inspect the `exceptionSynchError` object for details.\n\
    \    *   `Defines.SynchErrorTypes.Processing` - Indicates that a processing error\
    \ occurred processing the `SynchDescriptor` associated with this `SynchResponse`\
    \ object. You will need to inspect the `processingSynchError` object for details.\n\
    *   `ProcessingSynchError processingSynchError` - If a processing type error occurred,\
    \ this object will provide details describing the error. Otherwise it will be\
    \ null.\n*   `ExceptionSynchError exceptionSynchError` - If an exception type\
    \ error occurred, this object will provide details regarding the exception. Otherwise\
    \ it will be null.\n*   `bool removeFlag` - This indicates whether the replication\
    \ entry in the replication log was deleted. If *true*, the entry was removed.\
    \ The remove flag will be *true* whenever the `synchErrorType` is success. Otherwise,\
    \ it will be *true* for non-recoverable errors and *false* for recoverable errors.\n"
  raw: "When writing your own handler, you’ll need to determine which errors are recoverable\
    \ and which ones are non-recoverable. Non-recoverable errors should result in\
    \ the current replication log entry being deleted, ending synchronization for\
    \ that record. Of course, synchronization continues processing the next entry\
    \ in the log, if one is present. Otherwise it goes into a wait state, waiting\
    \ for a new entry.\n\nRecoverable errors are a bit more involved. Returning *false*\
    \ in the `removeFlag,` instructs SQLite.XM to leave the current replication log\
    \ entry intact; to be re-processed at some later point. Replication then halts\
    \ for a period of time and then restarts processing, beginning with the same record.\
    \ Be careful not to put replication into an endless loop that blocks synchronization.\
    \ Let me explain. The screenshot below shows an invalid data processing error.\n\
    \n![](Image00038.jpg)\n\nThis particular error was caused by sending incorrectly\
    \ formatted data to an email address field. Unless the root cause of the error\
    \ is corrected, trying to resynchronize this record will only result in HotRiot\
    \ returning the same error response; putting replication into an endless loop\
    \ that blocks all synchronization.\n\nIf you return *false* in the `removeFlag,`\
    \ one of the following conditions MUST be true.\n\n*   The condition that caused\
    \ the error must be self-correcting. For example, a timeout from the HotRiot server,\
    \ or a Web or IO exception caused by a connection failure. It must be some sort\
    \ of error that you can be reasonably sure will correct itself when conditions\
    \ change.\n\n*   The cause of the error must be explicitly corrected.\n\nPost-synchronization\
    \ processing\n\nA post-synchronization delegate is a method that is inserted into\
    \ the synchronization processing chain that’s called after replication has completed.\
    \ It’s called for each entry in the replication log that’s processed. And it is\
    \ called regardless of whether processing is successful, or a recoverable or non-recoverable\
    \ error is encountered. The post-processing delegate is not called for abort conditions;\
    \ see the section ‘Synchronization abort conditions.’\n\nThe post-processing method\
    \ signature is shown below.\n\n`public`  `delegate`  `Task`  `SynchPostProcessDel`\
    \ ` (` `SynchDescriptor` ` originalSD, `\n\n `List` `<` `SynchDescriptor` `> sdList, `\n\
    \n `SynchResponse` ` synchResponse);`\n\nTo insert a post-processing delegate\
    \ into the SQLite.XM synchronization processing chain, do the following.\n\n*\
    \   Create an instance of the *`SynchOptions`* class.\n\n*   Set the `SynchPostProcessDel`\
    \ field to your error delegate.\n\n*   Pass the `SynchOptions` class to the *`SxmInit.initialize`*\
    \ method. \n\nSee the first four lines of code below.\n\n`  SynchOptions` ` synchOptions = `\
    \ `new`  `SynchOptions` `();`\n\n`  s` `ynchOptions.SynchPostProcessDel = mySynchPostProcessDel;`\n\
    \n`  s` `ynchOptions.SynchPreProcessDel = mySynchPreProcessDel;`\n\n `SxmInit.`\
    \ `initialize(“YOUR HotRiot APPLICATION NAME”, synchOptions);`\n\n `this` `.StartService (`\
    \ `new`  `Intent` ` (` `this` `, ` `typeof` `(` `SynchronizeService` `)));` ` \
    \ //` `For Android only.`\n\nIn this short code fragment, we set both the pre-processing\
    \ delegate and the post-processing delegate. Synchronization delegates are not\
    \ interdependent in any way. They can be set individually or with other delegates.\
    \ We did this just to show how you could set multiple delegates.\n\nAs you can\
    \ see, the post-processing delegate method returns a void and is passed the following\
    \ three parameters.\n\n*   `SynchDescriptor` `originalSD` - This is the synch\
    \ descriptor for the record associated with the entry in the replication log being\
    \ synchronized. This is the descriptor that is passed to the pre-processing delegate,\
    \ if one is registered.\n\n*   `List` `<` `SynchDescriptor` `> sdList` - This\
    \ is the list of descriptors that SQLite.XM actually replicated to HotRiot. It\
    \ is the output from the pre-processing delegate, if one is registered. Otherwise,\
    \ this list will contain a single entry that points to the same object as the\
    \ `originalSD` parameter.\n\n*   `SynchResponse` ` synchResponse` - This is the\
    \ response result that was returned from the last record in the `sdLis` t that\
    \ was synchronized.\n\nThe `SynchResponse` parameter requires some additional\
    \ clarification. The `SynchDescriptors` in the `sdList` are synchronized in the\
    \ order that they appear in the list. A `SynchResponse` is returned for each entry\
    \ processed and is put in the `SynchResponse` instance variable of the `SynchDescriptor`\
    \ being synchronized. Synch descriptors were explained in detail in the ‘pre-synchronization\
    \ delegate processing’ section. A partial listing of the `SynchDescriptor` class\
    \ is shown below.\n\n `public`  `class`  `SynchDescriptor`\n\n`  {`\n\n `public`\
    \  `string` ` action;`\n\n `public`  `string` ` dbName;`\n\n `public`  `string`\
    \ ` tableName;`\n\n `public`  `SynchResponse` `synchResponse;`\n\n `public`  `Hashtable`\
    \ ` recordDataToSynch;`\n\n`  . . .`\n\nThe response from the last record processed\
    \ in the list is returned as the last parameter to the post-processing delegate.\
    \ This is done as a matter of convenience. You could easily iterate through the\
    \ descriptors in the `sdList` and inspect each `SynchResponse` object individually.\
    \ But this is unnecessary, as you are really only interested in the response from\
    \ the last record in the `sdList` that was processed. If this is a success response,\
    \ then replication succeeded, otherwise replication failed. Replication is immediately\
    \ halted if an error is encountered. If there is more than one descriptor in the\
    \ `sdList,` then you will need to iterate through the list to know which descriptor\
    \ caused the failure. I show you how to do this a bit later.\n\nThe `SynchResponse`\
    \ class was covered in detail in the ‘Synchronization error delegate processing’\
    \ section, so I’ll only do a quick overview. A partial listing of this class is\
    \ shown below.\n\n `public`  `class`  `SynchResponse`\n\n`  {`\n\n  `public` ` SQLiteXM.`\
    \ `Defines` `.` `SynchErrorTypes` ` synchErrorType;`\n\n `public`  `ProcessingSynchError`\
    \ ` processingSynchError;`\n\n `public`  `ExceptionSynchError` ` exceptionSynchError;`\n\
    \n `public`  `bool` ` removeFlag = ` `true` `;`\n\n `...`\n\nA description of\
    \ each instance variable follows.\n\n*   `SynchErrorTypes` ` synchErrorType` -\
    \ This is a general success or error response value. It will indicate either success\
    \ or the type of error that occured. This will be set to one of the following\
    \ three enums.\n\n    `Defines` `.` `SynchErrorTypes.` **`success`** - Indicates\
    \ success processing the `SynchDescriptor` associated with this `SynchResponse`\
    \ object.\n\n    `Defines` `.` `SynchErrorTypes.` **`exception`** - Indicates\
    \ that an exception occurred processing the `SynchDescriptor` associated with\
    \ this `SynchResponse` object. You will need to inspect the `exceptionSynchError`\
    \ object for details.\n\n    `Defines` `.` `SynchErrorTypes.` **`Processing`**\
    \ - Indicates that a processing error occurred processing the `SynchDescriptor`\
    \ associated with this `SynchResponse` object. You will need to inspect the `processingSynchError`\
    \ object for details.\n\n*   `ProcessingSynchError` ` processingSynchError` -\
    \ If a processing type error occurred, this object will provide details describing\
    \ the error. Otherwise it will be null.\n\n*   `ExceptionSynchError` ` exceptionSynchError`\
    \ - If an exception type error occurred, this object will provide details regarding\
    \ the exception. Otherwise it will be null.\n\n*   `bool` ` removeFlag`  - This\
    \ indicates whether the replication entry in the replication log was deleted.\
    \ If *true* , the entry was removed. The remove flag will be *true* whenever the\
    \ the `synchErrorType` is success. Otherwise, it will be *true* for non-recoverable\
    \ errors and *false* for recoverable errors.\n\n**Writing a post-synchronization\
    \ delegate**"
