    The `ALTER` section of the SQL statements file should only include alter table
    statements. The alter table statement in SQLite supports a limited subset of commands.
    You can rename a table or you can add a new column to an existing table. DO NOT
    rename tables. The reason for this is when a table is created, `SQLite.XM` creates
    corresponding triggers needed for synchronization. When a table is renamed, the
    triggers do not automatically update. This will render the triggers inoperative
    and synchronization will start to fail. A future version of `SQLite.XM` may support
    table renames by automatically dropping and recreating triggers, but for now,
    do not rename tables.


    Each alter table statement is composed of three fields.


    `[` `database_name``.`table_name` `]` [`column name` `]` [`alter table statement`
    `]`


    Each field is placed inside opening and closing brackets. The fields must appear
    in the order shown above. However, you can format them on separate lines or include
    white spaces in order to enhance readability. The first field is the fully qualified
    name of the table being altered, that is the database name followed by a period
    followed by the table name. The second field is the name of the column being added
    to the table. The last field is the actual SQL alter table statement.


    Below is an example `ALTER` section with one alter statement.


    `[ALTER]`


    `[jsearch.companyReg] [president] [ALTER TABLE companyReg ADD president TEXT]`


    `[]`


    ### Defining index statements


    Unlike some other databases, index definitions are not part of the SQLite create
    table syntax. Therefore, indexes need to be created independently. This is not
    problem and in no way puts SQLite at a disadvantage, it’s just how they do things.
    The `INDEX` section of the SQL statements file should only include CREATE INDEX
    or DROP INDXED statements. Each index statement is composed of three fields.


    `[` `database_name``.`table_name` `]` [`index name` `]` [`index statement` `]`


    Each field is placed inside opening and closing brackets. The fields must appear
    in the order shown above. However, you can format them on separate lines or include
    white spaces in order to enhance the readability. The first field is the fully
    qualified name of the table being indexed, that is the database name followed
    by a period followed by the table name. The second field is the name of the index
    that is being created or dropped. The last field is the actual SQL index statement.


    Below is an example `INDEX` section with two index statements.


    `[INDEX]`


    `[jsearch.companyReg] [coNameIDX] [DROP INDEX coNameIDX]`


    `[jsearch.companyReg] [newCoNameIDX] [CREATE INDEX newCoNameIDX ON companyReg
    (hrContact, coName)]`


    `[]`


    Drop index and create index statements can appear in any order, intermingling
    them is okay. Having more than one drop or one create for the same index will
    cause an error. However, you can have one create and one drop statement for the
    same index.


    ### Defining select, update, and delete statements


    The `SELECT`, `UPDATE` and `DELETE` sections of the SQL statements file should
    only include their respective select, update, or delete SQL statements. Each of
    these statements is composed of two fields.


    `[` `statement name` `]` [`SQL statement` `]`


    Each field is placed inside opening and closing brackets. The fields must appear
    in the order shown above. However, you can format them on separate lines or include
    white spaces in order to enhance readability. The first field is the name of the
    statement. This can be any name of your choosing, however, it must be unique from
    all other statement names in the same section. We suggest you choose a name that
    is short but descriptive. The second field is the actual SQL statement.


    Below are several example statements.


    `[SELECT]`


    `[findCompany] [SELECT * FROM companyReg WHERE coName = ?]`


    `[]`


    `[UPDATE]`


    `[updateCompanyReg] [UPDATE companyReg SET hrContact = ? WHERE coName = ?]`


    `[]`


    `[DELETE]`


    `[deleteCompany] [DELETE companyReg WHERE coName = ?]`


    `[]`


    ### Creating tables


    Now that we understand the structure of the SQL statement properties file and
    how to include it in a project, the next step is to populate the `TABLE` section.
    Below is the table portion of our example job search site.


    `[TABLE]`


    **Create the company registration table.**


    `[jsearch.companyReg]`


    `[CREATE TABLE companyReg (id INTEGER PRIMARY KEY AUTOINCREMENT, companyRegPK
    TEXT, coName TEXT, hrContact TEXT, email TEXT, password TEXT)]`

    `[synch]`


    **Create the job postings table.**


    `[jsearch.jobPosting]`


    `[CREATE TABLE jobPosting (id INTEGER PRIMARY KEY AUTOINCREMENT, jobPostingPK
    TEXT, companyRegFK TEXT, jobTitle TEXT, description TEXT)]`


    **Create the company email table.**


    `[jsearch.companyEmail]`


    `[CREATE TABLE companyEmail (id INTEGER PRIMARY KEY AUTOINCREMENT, companyEmailPK
    TEXT, companyRegFK TEXT, subject TEXT, body TEXT)]`

    `[synch]`


    **Create the seeker registration table.**


    `[jsearch.seekerReg]`


    `[CREATE TABLE seekerReg (id INTEGER PRIMARY KEY AUTOINCREMENT, seekerRegPK TEXT,
    fName TEXT, lName TEXT, email TEXT)]`

    `[synch]`


    **Create the seeker favorites table.**


    `[jsearch.seekerFavorites]`


    `[CREATE TABLE seekerFavorites (id INTEGER PRIMARY KEY AUTOINCREMENT, seekerFavoritesPK
    TEXT, seekerRegFK TEXT, companyRegFK TEXT)]`

    `[synch]`


    **Create the seeker email table.**


    `[jsearch.seekerEmail]`


    `[CREATE TABLE seekerEmail (id INTEGER PRIMARY KEY AUTOINCREMENT, seekerEmailPK
    TEXT, seekerRegFK TEXT, subject TEXT, body TEXT)]`

    `[synch]`


    `[]`

