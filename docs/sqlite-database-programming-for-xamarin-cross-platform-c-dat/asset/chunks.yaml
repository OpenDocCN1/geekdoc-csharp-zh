    这是我首次尝试出版。我选择自版出版，是因为我想提供比博客或其他更短平台无法提供的更详尽的主题涵盖，但仍然免费提供我的著作。如果通过出版商，将是不可能的。我曾多次被问到：为什么免费的？诚然，写一本书需要花费大量的时间和精力。更不用说校对人员和技术评审人员投入的工作了。完成第一版修订如此困难，令我感到惊讶。对于作者在作品出版过程中所经历的，我有了新的认识。但我想回馈技术社区做出贡献。多年来，我受益于他人提供的无数资源；包括博客、编程帮助和开源代码。这是我做出贡献的机会。如果这本书受欢迎，我将推出另一本。我在
    `SignalR` 移动消息方面学到了很多想分享的内容。如果我再次出版，将尝试继续免费提供我的书籍。感谢选择阅读这本书，希望你有所收获并阅读愉快。


    ## 反馈


    如果你对这本书有任何反馈（例如错误、建议等），请随时我我。我会在进行编辑时不断更新在线手稿，这将改善未来读者的体验。非常感谢你的帮助。我一直乐意协助 `SQLite.XM`。如果你需要帮助、建议或需要澄清某些问题，请给我写信，我会尽力提供帮助。


    ajserpicoj@gmail.com


    ## 第 1 部分 移动应用的数据持久化


    ### 移动应用程序的本质


    在传统的客户端-服务器计算中，客户端通常连接到中央数据库服务器（通常通过前端代理）进行数据存储/处理服务。如果无法建立该连接，应用程序通常无法运行。在大多数情况下，这是可以的。根据这些应用程序的设计、封装和分发方式，这样做是合理的。这种传统模型依赖于与中间层的持续连接。对于这些应用程序执行的任务类型，这已经足够，并且有助于简化它们的设计。考虑任何具有意义的
    Web 应用程序或典型的企业应用。诚然，`HTML 5` 许多离线存储选项，但这些并未被广泛使用。可用的存储技术在能力上较为有限，且对浏览的支持并不统一。处理无数种浏览器组合就足以让大多数开发者放弃使用
    `HTML` 提供的某种结构化存储解决方案之一。


    对于移动应用，需要一种更灵活的模型。首先，移动设备的网络连接远没有确定得多。连接的进出频率高得多，而且质量和速度可能差异巨大。因此，依赖外部数据库可能是不可靠的。此外，移动应用被调用来执行的任务类型加上用户预期，要求它们比其
    Web 或企业对应物具有更多的自主性。用户不会容忍移动应用提供断断续续的服务。考虑到这一点，移动应用程序的设计应尽可能在最大程度上允许在没有网络连接的情况下运行。这几乎总是要求设备上具有某种结构化数据存储解决方案。幸运的是，最流行的移动操作系统都拥有数据库基础设施。iOS
    和 Android 均预装了关系型数据库：`SQLite`。


    ### SQLite


    `SQLite` 是到目前为止世界上部署最广泛的关系型数据库。它被包含在几乎每一个 iOS 和 Android 设备中。如果你按照 Google 和 Apple
    衡量的活跃设备数量计算，这个数字达到了数十亿。没有其他数据库可以与之比拟。


    除非你的应用程序数据存储需求极其简单，否则你将需要一种你可以在简单的键/值结构或基本属性文件中轻松实现的之外的存储解决方案。`SQLite` 是一个非常有吸引力的选择，因为
    iOS 或 Android 都不需要设置，并且在两个操作系统上都保证其存在。这简化了你应用程序的打包、部署和安装，消除了因安装和管理独立的嵌入式数据库服务器而可能造成的任何摩擦。此外，知道
    `SQLite` 是可用的，允许你在使用 `Xamarin` 时编写一个跨平台的通用共享数据持久化层。虽然微软没有将 `SQLite` 作为 Windows
    Phone 的一部分包含进来很遗憾，但使用 `NuGet` 安装仍然足够容易。


    现在，你可能会觉得我对 `SQLite` 的狂热仅仅是因为它方便。虽然使用起来很方便，但 `SQLite` 称得上功能齐全的关系型数据库，将传统事务数据库引擎的所有力量交由你的应用程序使用。你很难为你的移动应用找到更好的数据存储了。


    除了使用我们的持久化层 `SQLite.XM` 所需的内容外，我不会详细介绍 `SQLite`。但我鼓励你更深入地探索 `SQLite`。他们的网站 `sqlite.org`
    拥有丰富的信息。


    ### 离线、在线和偶尔连接的应用程序


    移动应用程序通常遵循以下三种模型之一：


    *   纯离线应用程序

    *   纯在线应用程序

    *   偶尔连接的应用程序 (OCA)


    #### 纯离线应用程序


    纯离线应用程序在运行时不需要任何网络连接。数据存储在设备本地，所有数据和应用程序逻辑都驻留在本地。应用程序生成的数据不会与外部或后端服务器同步。这类移动应用程序是完全自包含和自支持的，而且比较少见。看到纯离线移动应用程序是不太常的。


    相比之下，纯在线应用程序需要网络连接才能运行。这些应用程序可能包含本地数据库，但这不是要求的。即使使用了本地数据存储，它通常也仅限于配置信息或其他元数据。这些应用程序与远程服务器建立定期或持续的通信，服务器除了提供数据库服务外，可能还提供支持的应用程序逻辑。


    偶尔连接应用程序 (OCA) 代表离线和在线模型之间的中间地带。这些应用程序可以在没有网络连接的情况下运行一段时间，但最终需要连接来完成其处理周期。它们几乎总是包含本地数据库，并通常将其本地数据与后端服务器同步。尽管这些应用程序同步了本地数据，但
    OCA 的运行并不依赖于远程数据存储。这类应用程序的设计旨在于断开连接时提供基本功能，并在建立连接时提供完整功能。OCA 可能也依赖后端服务器提供支持的应用程序逻辑。在三个模型中，OCA
    在设计和编码上最灵活且最复杂。


    关于应该选择哪种模型，如果你的应用程序确实属于离线应用，那么答案是显而易见的。在这种情况下，只需使用离线模型。这是三个模型中最容易开发的，而且没有理由把事情复杂化。为自己感到幸运吧，你不需要处理间歇性连接问题、远程通信、同步以及客户端-服务器计算带来的一系列问题。


