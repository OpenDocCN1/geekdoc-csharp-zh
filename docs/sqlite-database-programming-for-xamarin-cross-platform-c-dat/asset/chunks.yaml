  trans: "\n\n*   将格式不正确的数据发布到字段中。例如，如果你在 `HotRiot` 中定义了一个字段来存储数字（在 `HotRiot` 创建数据库向导的第\
    \ 3 步中完成），但尝试向该字段发布文本数据。\n*   你在 `HotRiot` 中将一个字段定义为“必填”（同样在创建数据库向导的第 3 步完成），但\
    \ `SQLite.XM` 尝试同步的记录中缺少该数据字段。\n\n这两种情况都可以通过在你的应用程序中包含数据验证逻辑来轻松避免。无论如何你都应该这样做。\n\
    \n非唯一数据异常错误管理起来要复杂得多，或者更准确地说，是从源头上防止其发生。这些错误是由向要求唯一数据的数据字段发布非唯一数据引起的。如果你在 Hot\
    \ `HotRiot` 表中将一个字段定义为唯一，`HotRiot` 将拒绝任何记录插入或更新请求，前提是发布到该唯一字段的数据已存在于数据库中。这没什么奇怪，这是你预料之中的。问题在于，在分布式环境中，你如何能确保在设备上生成的数据在所有其他设备上确实是唯一的？这与我们在生成唯一主键时面临的问题非常相似。那时的解决方案是直接使用\
    \ `GUIDs` 而不是典型的自增值。遗憾的是，对于用户生成的数据（如密码），这不是一个可行的方案。即使对于应用程序生成的数据，这通常也是不可行的解决方案。那么，我们该怎么办？这个问题受到几个因素的影响：\n\
    \n*   移动应用运行在不可稳定的分布式环境中。在任何特定时间，将设备上生成的数据与复制服务器上的数据进行检查可能是不可行的。\n*   在一个设备生成的数据无法与等待同步的所有其他设备的数据进行检查。\n\
    *   应用程序在任何时刻可能在线也可能离线。\n*   复制是一个延迟过程。即使我们设计了即时复制，考虑到连接的瞬态性，实际上没有办法保证实时甚至近实时的同步。\n\
    \n那么，在存在上述约束的环境中，我们如何确保数据的唯一性？为了展示如何实现，我们将重新回顾之前的注册示例。\n\n![](img/Image00029.jpg)\n\
    \n你已经看了上面的图。它显示设备上有一个单一注册表，该表与服务器上的三个表同步。对于这个讨论，假设注册密码字段必须填充一个与其他用户输入的任何密码都唯一的密码。我们如何确保密码是唯一的？简单的解决方案是“作弊”，仅在设备/应用程序具有网络连接时才允许用户注册。在许多情况下，这是首选解决方案，也是最容易实现的。这里是实现该目标的一种方法。\n\
    \n对于此讨论，我们假设 `HotRiot` 中需要存储注册信息的三个表已经创建。并且 `companyReg` 表中的密码字段已定义为唯一。当用户提交注册时，不要像通常的那样立即将其保存到本地设备数据库，而是先尝试将记录保存到\
    \ `HotRiot`。在组成聚合注册的 `HotRiot` 三个表中，你只需要发布 `companyReg` 表的信息，因为这是唯一一个包含唯一字段的表。如果记录成功发布到\
    \ `HotRiot`，那么你就知道密码字段是唯一的。`HotRiot` 中新创建的记录将有效地作为一个占位符，为该用户预留密码。你现在需要将整个 `company_registration`\
    \ 记录发布到本地设备数据库。一旦完成这一步，你就大功告成了。`SQLite.XM` 将处理另外两个表（`hrContact` 和 `gcmApnsID`）的同步。当然，如果发布到\
    \ `HotRiot` 失败，你需要检查失败的原因，如果由于非唯一数据异常，你将需要要求用户重新输入密码。下面的代码列表显示了如何执行所述操作。\n\n这是一个非常简单的公司注册\
    \ Android Activity。`registrationSubmitHandler` 方法尝试将注册记录保存到 `HotRiot`。如果成功，它会调用方法\
    \ `postRegistrationLocal`，该方法将注册信息保存到设备数据库。列表后面将有详细解释。\n\n```java\nActivity (Label\
    \ = \"CoRegistrationActivity\")\n\npublic class CoRegistrationActivity : Activity\
    \ {\n\n    protected override void OnCreate (Bundle bundle) {\n        base.OnCreate\
    \ (bundle);\n        SetContentView (Resource.Layout.CoRegistration);\n      \
    \  Button submitCoRegButton = FindViewById<Button>(Resource.Id.submitCoRegButton);\n\
    \        1 submitCoRegButton.Click += async delegate { await registrationSubmitHandler();\
    \ };\n    }\n\n    private async Task registrationSubmitHandler() {\n        2\
    \ NameCollection hrRecord = new NameCollection();\n        string systemchID =\
    \ Guid.NewGuid().ToString();\n        3 hrRecord.add(\"systemchID\", systemchID);\n\
    \        string registrationPK = Guid.NewGuid().ToString();\n        hrRecord.add(\"\
    primary_key\", registrationPK);\n        hrRecord.add(\"name\", FindViewById<EditText>(Resource.Id.coReg).Text);\n\
    \        hrRecord.add(\"address\", FindViewById<EditText>(Resource.Id.coReg).Text);\n\
    \        hrRecord.add(\"city\", FindViewById<EditText>(Resource.Id.coReg).Text);\n\
    \        hrRecord.add(\"state\", FindViewById<EditText>(Resource.Id.coReg).Text);\n\
    \        hrRecord.add(\"zip_code\", FindViewById<EditText>(Resource.Id.coReg).Text);\n\
    \        hrRecord.add(\"email\", FindViewById<EditText>(Resource.Id.coReg).Text);\n\
    \        hrRecord.add(\"phone\", FindViewById<EditText>(Resource.Id.coReg).Text);\n\
    \        hrRecord.add(\"password\", FindViewById<EditText>(Resource.Id.coReg).Text);\n\
    \        TimeSpan elapsedSpan = new TimeSpan (DateTime.UtcNow.Ticks - new DateTime\
    \ (1970, 1, 1).Ticks);\n        hrRecord.add(\"time\", Convert.ToInt64(elapsedSpan.TotalSeconds).ToString());\
    \ // 这是 HotRiot 中将记录保存到那的表。\n        string tableName = \"companyReg\";\n    \
    \    string editKey = \"systemchID\";\n        HRInsertResponse hrInsertResponse\
    \ = null;\n        try {\n            4 hrInsertResponse = await HotRiot.getHotRiotInstance.submitKeyInsertRecord(tableName,\
    \ editKey, systemchID, hrRecord, null);\n            int resultCode = hrInsertResponse.getResultCode();\n\
    \            5 if (resultCode == HotRiot.SUCCESS)\n                await postRegistrationLocal(registrationPK,\
    \ systemchID);\n            else {\n                6 if (resultCode == HotRiot.NOT_UNIQUE_DATA_EXCEPTION)\
    \ {\n                    string resultMessage = hrInsertResponse.getResultMessage();\
    \ // 是密码字段导致了失败。\n                    7 if (resultMessage.StartsWith(\"password:\"\
    ) == true) {\n                        // 通知用户密码不是唯一的。\n                    } else\
    \ {\n                        // 其他字段导致了非唯一错误。执行某些操作。\n                    }\n\
    \                } else {\n                    // 发生了其他错误。执行某些操作。\n          \
    \      }\n            }\n        } catch (HotRiotException hex) {\n        }\n\
    \    }\n}\n```\n\n"
