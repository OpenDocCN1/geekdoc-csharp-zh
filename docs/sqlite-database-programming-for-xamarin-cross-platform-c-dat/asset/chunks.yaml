    ` `, parameterValues);`\n\n `if` ` (ir.SynchID == ` `null` ` || ir.RecordID == -`\
    \ `1L` ` )`\n\n `throw`  `new`  `SxmException` ` ( ` `new`  `ErrorMessage` ` (`\
    \ `\"Insert error @ processInsert.\"` `, `\n\n `Defines` `.` `SxmErrorCode` `.userDefined));`\n\
    \n `if` `(sxmTransaction.commitTransaction () !=` `SQLiteErrorCode` `.Ok` `)`\n\
    \n`        throw`  `new`  `SxmException` ` ( ` `new`  `ErrorMessage` ` (` `\"\
    Commit error @ processInsert.\"` `, `\n\n `Defines` `.` `SxmErrorCode` `.userDefined));`\n\
    \n`    }`\n\n `catch` ` (System.` `Exception` ` ex){`\n\n`      sxmTransaction.rollbackTransaction ()                           `\n\
    \n`    }`\n\n`    sxmTransaction.executeQuery (` `\"findCompany\"` `, ` `null`\
    \ `);`\n\n `return` `sxmTransaction.getAllRows ();`\n\n`  }`\n\n`}`\n\nThe transaction\
    \ object above is used to execute two independent transactions. If the first transaction\
    \ fails, the second is still permitted to execute. If the second transaction fails,\
    \ the query statement is still permitted to run. If you have independent transaction,\
    \ you might decide to process exceptions inside the `using` block in this manner.\
    \ This sequence leaves one unanswered question: what happens if the rollback fails?\
    \ If there is an error executing a rollback, an exception is thrown. This is true\
    \ unless the rollback is being executed by the `using` block cleanup code.  The\
    \ reason for throwing an exception, is a rollback is a pretty robust operation\
    \ and a failure indicates a likely serious problem, at that point, it is probably\
    \ best to exit the transaction and allow the cleanup code to run.\n\n**Programming\
    \ for errors**\n\nNow I’m going to say something really silly; the best way to\
    \ deal with errors is to write your code in such a way that they can’t occur.\
    \ I know what you’re thinking; that’s not possible, and for the most part, I agree.\
    \ However, approaching your code with that mind-set will cause you to seek out\
    \ solutions with a minimal error profile and get you to deal with potential errors\
    \ proactively. What do I mean by this? Let’s use the `SxmTransaction` class as\
    \ an example.\n\nBefore the `SxmTransaction` class was designed to be used with\
    \ a `using` statement, the typical usage pattern was as follows.\n\n`  SxmTransaction`\
    \ `sxmTransaction = null;`\n\n `try` `{`\n\n`    sxmTransaction = ` `new`  `SxmTransaction`\
    \ ` (` `\"jsearch\"` `);`\n\n `// Do database work.`\n\n`    sxmTransaction.commitTransaction\
    \ ();`\n\n`  }`\n\n `catch` ` (System.` `Exception` ` ex){`\n\n `if` ` (sxmTransaction != `\
    \ `null)` \n\n`        sxmTransaction.rollbackTransaction ();`\n\n`  }`\n\n `finally`\
    \ `{`\n\n `try` `{`\n\n `if` ` (sxmTransaction != ` `null)` \n\n `sxmTransaction.completeTransaction\
    \ ();`\n\n`    }`\n\n `catch` ` (System.` `Exception` ` doNothing) {} `\n\n` \
    \ }`\n\nThe transaction object and its accompanying statements are executed within\
    \ a try-catch. The call to `completeTransaction` in the finally block cleans up\
    \ the transaction. But looking at this, you see too many opportunities for problems.\n\
    \n*   Users might not wrap the transaction in a try-catch.\n\n*   The finally\
    \ clause might be omitted from the try-catch.\n\n*   Users might forget to make\
    \ the call to `completeTransaction` or place the call outside of a finally block\
    \ or they might fail to include the null check. \n\n*   Users might forget to\
    \ wrap the call to `completeTransaction` in a try-catch.\n\n*   Users might forget\
    \ to perform a rollback in the catch or they might fail to include the null check. \n\
    \nCould this be rewritten to eliminate these potential problems and shrink the\
    \ error footprint? Well, it turns out we could do much better. We made four modifications\
    \ that significantly improved code.\n\n*   The `SxmTransaction` object was fitted\
    \ to work with the `using` statement.\n\n*   The cleanup performed by the `completeTransaction`\
    \ method was redesigned to have a no-throw guarantee. The rational being, that\
    \ if an error occurred during cleanup, the cleanup code would be in the best position\
    \ to deal with the problem. There is no advantage to pushing the error up the\
    \ stack.\n\n*   A rollback was incorporated into the cleanup code for an active\
    \ transaction.\n\n*   A finalize method was added to the `SxmTransaction` class\
    \ in order to perform cleanup in the event a user failed to instantiate the transaction\
    \ inside of a `using` statement.\n\nSo, what was the result of these changes?\
    \ We reduced the five potential problems listed above to a single problem; a user\
    \ might fail to instantiate a transaction inside a `using` statement. But even\
    \ this was mitigated by adding a finalizer. In the process of tightening up the\
    \ code, we also improved resource usage. How, you ask. The `SxmTransaction` object\
    \ automatically goes out of scope when it exits the using block, making it immediately\
    \ available for garbage collection. By simply taking a critical look at our original\
    \ design, we found a few simple openings where we could improve usability. The\
    \ net result is not only more robust, resource efficient code but code that is\
    \ easier to read, write and harder to get wrong. This is what I mean when talking\
    \ about minimizing your codes error profile.\n\nWhen looking at your own code,\
    \ ask this question; how can this fail and what can I do to make failure less\
    \ likely.\n\n**Some final thoughts regarding errors**\n\n“ Any error that can\
    \ occur, given enough time, will occur.”"
