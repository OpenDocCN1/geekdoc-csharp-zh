  trans: "\n如果你查看 `SxmConnection` 代码，你会发现它并没有继承自 `SqliteConnection` 类。这有点奇怪，因为按理说，可以将\
    \ `SxmConnection` 视为 `SqliteConnection` 的特化版本。事实证明，`SqliteConnection` 类是密封的（sealed），因此不能作为基类使用。我不确定为什么要这样设计，但它让我们别无其他选择，只能让\
    \ `SxmConnection` 类包含一个 `SqliteConnection` 对象。这种做法运行良好，但使用继承比使用包含（containment）似乎更为合适。\n\
    \n`SxmConnection` 类的功能远不止于建立连接。它充当了所有与数据库 SQL 命令处理相关的封装器。例如，它维护连接命令对象，包含一个用于访问上一次查询记录数据的数据读取器，并管理错误日志。它还负责某些资源管理。正如你所预期的，这既有优点也有缺点。`SxmConnection`\
    \ 类非常易用，并消除了许多与处理数据库相关的负担。然而，与使用自定义代码直接管理连接相比，它的活性稍低。这些折中是相对较小的。主要问题是 `SxmConnection`\
    \ 类只维护单个命令对象，结果就是它只支持单个数据读取器。这意味着只能访问上一次执行查询的记录数据。这通常不是一个问题，因为你通常只对读取上一次查询的结果。如果你需要同时访问多个查询的结果集，变通方法非常简单：你只需创建多个连接对象，或者将第一次查询的数据从记录集中提取出来并放入集合中，然后在同一条连接上发布第二次查询。\n\
    \n### 创建 SxmConnection\n\n创建连接非常简单，你只需要实例化一个 `SxmConnection` 对象。\n\n```csharp\n\
    SxmConnection Conn = new SxmConnection(\"jsearch\");\n```\n\n`SxmConnection` 构造函数接受一个必需参数，即你想要建立连接的数据库名称。为同一个数据库创建多个连接是安全的。事实上，这是你可以使用的策略之一，用来允许多个线程访问同一个数据库。即使在连接到同一个数据库，你也不需要同步连接对象的创建。为了方便起见，如果你的应用程序只使用一个数据库（即只定义了一个数据库描述符），你可以省略数据库名称参数。在这种情况下，构造函数可以写为：\n\
    \n```csharp\nSxmConnection Conn = new SxmConnection();\n```\n\n关于连接的创建有一点值得注意。在实例化连接之前，你可以修改与你想要连接的数据库相关的描述符（descriptor）。这允许你在多次连接到同一个数据库时更改描述符的细节。让我们来看一个例子。\n\
    \n```csharp\ntry {\n  1 new DatabaseDescriptor(\"jsearch\");\n  // 用于 Android\
    \ 应用。\n  using (StreamReader sr = new StreamReader (Assets.Open(\"SqlStatements.txt\"\
    ))){ \n    // 用于 iOS 应用。\n    using (StreamReader sr = new StreamReader (\"sqlProperties/SqlStatements.txt\"\
    )){\n    ProcessSQLStatements.Parse (sr);\n  }\n  SxmInit.initialize ();\n  2\
    \ SxmConnection conn1 = new SxmConnection (\"jsearch\");\n}\n```\n\n上面的代码段初始化了数据库\
    \ `jsearch`。在第 1 行实例化的数据库描述符使用了描述符的默认设置。这意味着错误日志将被命名为 `jsearch`。在第 2 行，建立了到数据库的连接。该连接\
    \ `conn1` 将将所有错误记录到 `jsearch.log`。现在来看下面的代码段。\n\n```csharp\nDatabaseDescriptor\
    \ jsearchDD = null;\ntry {\n  1 jsearchDD = DatabaseDescriptor.getDescriptor (\"\
    jsearch\");\n  if ( jsearchDD != null ) {\n    2 jsearchDD.lockDescriptor();\n\
    \    3 jsearchDD.logfileName = \"jsearch-log1\";\n    4 jsearchDD.logfileMaxSize\
    \ = 1024 * 1024 * 5 ;\n    5 SxmConnection conn2 = new SxmConnection (\"jsearch\"\
    );\n  }\n} finally {\n  if ( jsearchDD != null )\n  6 jsearchDD.unlockDescriptor();\n\
    }\n```\n\n在第 1 行，我们获取与初始化的 `jsearch` 数据库相关的描述符。然后在在第 3 行，我们将日志文件名更改为 `jsearch-log1`。我们还将日志文件的最大大小改为\
