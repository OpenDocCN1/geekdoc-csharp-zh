  trans: "\n\n当同时有多个事务对象活跃时，一个事务所执行的修改数据库的操作在未提交之前，对其他事务是不可见的。这初看起来看起来可能有点奇怪。你真的需要理解它的工作原理，否则你可能会遇到看似无法解释的行为。下方的\
    \ `processSubmitHandler` 方法来自我们之前的示例，经过重写以说明事务隔离性。\n\n```csharp\nprivate  void\
    \  processSubmitHandler()\n{\n  ArrayList parameterValues = new ArrayList ();\n\
    \  string registrationPK = Guid.NewGuid().ToString();\n  string companyName =\
    \ FindViewById<EditText>(Resource.Id.coRegName).Text;\n  parameterValues.Add (registrationPK);\n\
    \  parameterValues.Add (companyName);\n  parameterValues.Add (FindViewById<EditText>(Resource.Id.coRegContact).Text);\n\
    \  parameterValues.Add (FindViewById<EditText>(Resource.Id.coRegEmail).Text);\n\
    \  parameterValues.Add (FindViewById<EditText>(Resource.Id.coRegPassword).Text);\n\
    \  using (SxmTransaction sxmTransaction1 = new SxmTransaction (\"jsearch\")){\n\
    \    InsertResponse ir = sxmTransaction1.executeInsert(\"registerCompany\", parameterValues);\n\
    \    using (SxmTransaction sxmTransaction2 = new SxmTransaction (\"jsearch\")){\n\
    \      parameterValues.Clear();\n      parameterValues.Add (companyName);\n  \
    \    sxmTransaction2.executeQuery(\"findCompany\", parameterValues);\n      List\
    \ <Hashtable > rows = sxmTransaction2.getAllRows();\n      sxmTransaction1.commitTransaction\
    \ ();\n      sxmTransaction2.executeQuery(\"findCompany\", parameterValues);\n\
    \      rows = sxmTransaction2.getAllRows();\n     }\n}\n```\n```\n\n此示例展示了一个 `SxmTransaction`\
    \ 对象写入数据库的记录在第一个对象提交事务之前，对另一个 `SxmTransaction` 对象是不可见的。对于这个示例，假设我们从一个没有记录的数据库开始。让我们分析这个方法。\n\
    \n*   第 1 行，我们实例化了一个 `SxmTransaction` 对象。\n*   第 2 行，使用我们新创建的事务对象向 `registration`\
    \ 表写入了一条记录。\n*   第 3 行，创建了另一个 `SxmTransaction` 对象。\n*   第 4 行，使用第 3 行创建的事务对象执行了一个查询。该查询搜索\
    \ `registration` 表中的所有记录。\n*   第 5 行，我们尝试获取第 4 行执行的查询返回的记录数据。然而，由于第 2 行执行的插入操作尚未提交，因此结果集是空的。\n\
    *   第 6 行，第 1 行创建的事务对象提交了它所有的更新。该事务对象不再可用。\n*   第 7 行，使用第 3 行创建的事务对象执行了一个查询。该查询搜索\
    \ `registration` 表中的所有记录。\n*   第 8 行，我们尝试获取第 7 行执行的查询返回的记录数据。因为插入该记录的事务对象执行了提交，所以找到了该记录。\n\
    \n从上述序列中应该注意以下几点。首先是显而易见的；编写代码要小心，不要导致你期望在其他事务提交之前看到它们对数据库所做的更新。完全避免此问题的一种简单方法是，在任何时刻只保持一个事务对象活跃。考虑到你特定的应用程序需求，这可能是一个可以或不可接受的解决方案。\n\
    \n另一个你需要注意的更微妙的副作用是，当处理多个并发事务时，你可能会从数据库读取中获得不一致的结果，其原因可能并不明显。在上面的示例中，我们在第 4 行和第\
    \ 7 行执行了完全相同的查询，并且从同一个事务对象每次得到了不同的结果。在处理企业级数据库时，这几乎不值一提；因为来自多个独立连接的读取、写入和删除是常态。但当针对专用数据库运行单个应用时，这种行为可能不符合预期。\n\
    \n假设结果集不为空，从 select 执行开始，其他 `SxmTransaction` 对象会被阻塞，直到 `SxmTransaction` 对象被完全迭代完毕。这保证了结果集保持不变。SQLite\
    \ 不具备快照功能。\n\n### 跨数据库执行连接\n\n对于大多数应用程序来说，如果你的应用属于这一类，单个数据库就足够了，你可以安全地跳过本节。当然，也有例外，某些开发者可能觉得拥有多个数据库能满足他们的需求。我将不会详细介绍单数据库与多数据库的优缺点。在这里，我简单解释查询多个数据库的机制。\n\
    \n```csharp\ntry {\n  DatabaseDescriptor(\"user\");\n  DatabaseDescriptor(\"transaction\"\
    );\n} catch (Exception ex) {\n  string message = ex.Message;\n}\n```\n\n`user`\
    \ 数据库存储注册及相关信息，而 `transaction` 数据库存储购买及相关信息。以下表出现在每个数据库中：\n\n(Image0014)\n\n我们的数据库包含其他表，但为了说明这个示例，我们不需要考虑它们。每当用户购买产品时，`purchase`\
    \ 表中就会创建一个条目，记录执行购买的用户的主键以及其他产品信息。我们想要运行一个查询，连接这两个表，返回特定用户的所有购买记录以及该用户的注册信息。\n\
    \n让我们写一个函数来实现此功能。为了可读性，我选择将 SQL 查询作为方法的一部分，而不是在 SQL 语句文件中定义它。\n\n```csharp\nprivate\
    \ ArrayList GetUserPurchases(string userPK)\n{\n  ArrayList transactions = new\
    \ ArrayList();\n  ArrayList searchCriterion = new ArrayList();\n  searchCriterion.Add\
    \ (userPK);\n  using (SxmTransaction sxmTransaction = new SxmTransaction (\"user\"\
    )){\n    sxmTransaction.attachDatabase(\"transaction\");\n    string selectStmt\
    \ = \"SELECT reg.*, pur.name AS purName, pur.productPK, pur.purchasePrice FROM\
    \ registration AS reg JOIN transaction.purchase AS pur ON pur.registrationFK ==\
    \ reg.registrationPK\";\n  }\n}\n```\n"
- fmt: "\n```sql\nWHERE reg.registrationPK = ?;\nsxmTransaction.executeQueryDirect(selectStmt,\
    \ searchCriterion);\nHashtable transaction = null;\nwhile ((transaction = sxmTransaction.getNextRow())\
    \ != null) {\n    transactions.Add(transaction);\n    // 4 // sxmTransaction.detachDatabase();\n\
    }\nreturn transactions;\n}\n```\n\nOn line 1 a transaction object is created on\
    \ the `user` database. Nothing unusual here. On line 2 the `transaction` database\
    \ is attached to our newly created transaction object. In order to include a database\
    \ in a transaction, it must be attached using the `attachDatabase` method. You\
    \ can call `attachDatabase` multiple times in order to attach more than one database\
    \ to a transaction. As an alternative, you can call `attachDatabase` without any\
    \ parameters and SQLite.XM will attach all of your databases to the current transaction.\n\
    \nThe actual SQL select statement is defined on line 3. There are a few things\
    \ in the query that are worth pointing out. First, notice the join clause uses\
    \ the fully qualified name for the `purchase` table. However, when aliasing the\
    \ `registration` table, we used the shorthand notation that only includes the\
    \ table name. Why is this? In a SQLite, when referencing tables in attached databases,\
    \ the table name must be qualified with the database name where it is defined.\
    \ In our example, the `transaction` database is the attached database. Full Disclosure:\
    \ There are exemptions to this rule that allow you to omit the database name.\
    \ However, I suggest you not bother learning these exemptions and just adhere\
    \ to this rule. I’ll give you five reasons.\n\n*   You will never get in trouble\
    \ using the full qualified table name. It’s just a bit more typing.\n*   More\
    \ specificity in your SQL requires you to think more about what you are doing.\n\
    *   Including more information in your queries makes them self-documenting, making\
    \ it easier for others to read. For example, by simply reading a query you will\
    \ be able to identify the attached databases.\n*   Always including the fully\
    \ qualified name for attached databases, whether required or not, supports code\
    \ consistency.\n*   If you inadvertently misapply any of the exemptions, you could\
    \ wind up with inconsistent, difficult to find bugs. Here is why, according to\
    \ the SQLite documentation:\n\n>“If two or more tables in different databases\
    \ have the same name and the database-name prefix is not used on a table reference,\
    \ then the table chosen is the one in the database that was least recently attached.”\n\
    \nTherefore, if your code is written in a way where databases could be attached\
    \ in different order, bugs may appear and disappear for no obvious reason.\n\n\
    Also, notice that the `pur.name` field is aliased as `purName`. The reason we\
    \ needed to alias this field is because the `registration` table also includes\
    \ a `name` field and had we not aliased one of these fields we would have gotten\
    \ an ambiguous field name error when trying to execute this query.\n\nYou will\
    \ notice on line 4 the commented call to `detatchDatabase`. I put it there to\
    \ show you what we could have done. However, it turns out that the way in which\
    \ we are using the transaction makes this call unnecessary, so I removed it. Below\
    \ are rules for attaching and detaching databases that will clarify this.\n\n\
    *   If you don’t care about resource usage, concurrency, or efficiency, make things\
    \ easy on yourself; ignore the rules below and just perform the attach immediately\
    \ after creating the `SxmTransaction` object. Then forget about it, and let the\
    \ detach automatically happen when the transaction object exits the `using` block.\
    \ Otherwise, follow the rules below.\n*   Attach a database as late as possible,\
    \ preferably right before you intend to execute a statement that requires the\
    \ attachment. One caveat: a database must be attached before any statement is\
    \ executed that modifies a database, i.e., a statement other than a select. The\
    \ reason for this is an underlying database transaction is started when a database\
    \ is modified and you cannot attach a database after the start of a transaction.\n\
    *   Detach databases as soon as you are done using them. For example, if you intend\
    \ to execute multiple select queries but only one of them uses the attached database,\
    \ detach the database as soon as you are done iterating through the results of\
    \ the query, but not before, otherwise you will lose the result set.\n*   Exiting\
    \ the `using` block for a transaction object will automatically detach any attached\
    \ database. So in our example, it was unnecessary to explicitly detach the database,\
    \ we just let it automatic happen.\n*   Do not explicitly detach a database that\
    \ is part of a transaction that performs an update until after you have called\
    \ the `commitTransaction` method. The reason for this, is you cannot detach a\
    \ database while in the middle of a transaction.\n\n### Locking and concurrency\n\
    \nIf your application is guaranteed to only have a single transaction object active\
    \ at any one time, for example, it performs database processing on a single thread\
    \ and does not nest open transactions, then issues associated with locking and\
    \ concurrency can largely be ignored. However, if your app creates multiple `SxmTransaction`\
    \ objects simultaneously, you will need to understand locking and concurrency.\n\
    \nNOTE: This explanation of locking and concurrency is intended to provide you\
    \ the practical knowledge necessary to manage concurrent connections. This is\
    \ a somewhat complicated subject and I want to avoid getting bogged down in details\
    \ that do not add to this goal. Some operational details are skipped over in order\
    \ simplify this discussion and focus on presenting the core request information.\
    \ For example, SQLite has a notion of `PENDING` locks, which I do not cover. I\
    \ don’t believe you need to be concerned with this in order to properly manage\
    \ concurrent connections.\n\nLocks are used by SQLite in order to signal the operational\
    \ state of a database. When multiple connections try and access a database concurrently,\
    \ the database examines the lock state in order to ascertain which operations\
    \ are permissible. Depending on the current lock state along the requested operation,\
    \ SQLite will either allow an operation to continue or block the operation until\
    \ the lock state changes or a timeout occurs. The following locks can be acquired\
    \ on a database.\n\n*   **Shared** – Multiple transaction objects can have a shared\
    \ lock simultaneously.\n*   **Reserved** – Only one transaction object can have\
    \ a reserved lock at any one time, however, a reserved lock can coexist with shared\
    \ locks.\n*   **Exclusive** – Only one transaction can have an exclusive lock.\
    \ All other locks must be disposed of before a transaction can acquire an exclusive\
    \ lock. Once acquired, no other locks may be acquired until the exclusive lock\
    \ is disposed.\n\nWhen an `SxmTransaction` object is first created, it holds no\
    \ lock on the database. An attempt to acquire a lock only occurs when performing\
    \ an operation. Let’s see which locks are acquired by which operations.\n\n* \
    \  SQL select statements attempt to acquire shared locks. A shared lock is used\
    \ to tell SQLite that the connection is currently reading from the database.\n\
    *   Operations that modify a database, i.e., `insert`, `update`, and `delete`,\
    \ attempt to acquire reserved locks. A reserved lock tells SQLite that at some\
    \ point this connection may update the database by committing its transaction.\n\
    *   A connection attempts to acquire an exclusive lock when it wishes to write\
    \ to the database, i.e., commit its transaction. In SQLite.XM, a commit is executed\
    \ by the `commitTransaction` method.\n"
  raw: "  `WHERE` ` reg.registrationPK = ?”;`\n\n  `sxmTransaction.executeQueryDirect (`\
    \ `selectStmt` `, searchCriterion);`\n\n   `Hashtable` ` transaction = ` `null`\
    \ `;`\n\n  `while` ` ((transaction = sxmTransaction.getNextRow ()) != ` `null`\
    \ `)`\n\n  `transactions.Add (transaction);`\n\n**`4`**   *`// sxmTransaction.detachDatabase ();`*\n\
    \n`    }`\n\n `return` ` transactions;`\n\n`  }`\n\nOn line 1 a transaction object\
    \ is created on the `user` database. Nothing unusual here. On line 2 the `transaction`\
    \ database is attached to our newly created transaction object. In order to include\
    \ a database in a transaction, it must be attached using the `attachDatabase`\
    \ method. You can call `attachDatabase` multiple times in order to attach more\
    \ than one database to a transaction. As an alternative, you can call `attachDatabase`\
    \ without any parameters and SQLite.XM will attach all of your databases to the\
    \ current transaction.\n\nThe actual SQL select statement is defined on line 3\\\
    . There are a few things in the query that are worth pointing out. First, notice\
    \ the join clause uses the fully qualified name for the `purchase` table. However,\
    \ when aliasing the `registration` table, we used the shorthand notation that\
    \ only includes the table name. Why is this? In a SQLite, when referencing tables\
    \ in attached databases, the table name must be qualified with the database name\
    \ where it is defined. In our example, the `transaction` database is the attached\
    \ database. Full Disclosure: There are exemptions to this rule that allow you\
    \ to omit the database name. However, I suggest you not bother learning these\
    \ exemptions and just adhere to this rule. I’ll give you five reasons.\n\n*  \
    \ You will never get in trouble using the full qualified table name. It’s just\
    \ a bit more typing.\n\n*   More specificity in your SQL requires you to think\
    \ more about what you are doing.\n\n*   Including more information in your queries\
    \ makes them self-documenting, making it easier for others to read. For example,\
    \ by simply reading a query you will be able to identify the attached databases.\n\
    \n*   Always including the fully qualified name for attached databases, whether\
    \ required or not, supports code consistency.\n\n*   If you inadvertently misapply\
    \ any of the exemptions, you could wind up with inconsistent, difficult to find\
    \ bugs. Here is why, according to the SQLite documentation:\n\n    “If two or\
    \ more tables in different databases have the same name and the database-name\
    \ prefix is not used on a table reference, then the table chosen is the one in\
    \ the database that was least recently attached.”\n\n    Therefore, if your code\
    \ is written in a way where databases could be attached in different order, bugs\
    \ may appear and disappear for no obvious reason.\n\nAlso, notice that the `pur.name`\
    \ field is aliased as `purName` . The reason we needed to alias this field is\
    \ because the `registration` table also includes a `name` field and had we not\
    \ aliased one of these fields we would have gotten an ambiguous field name error\
    \ when trying to execute this query.\n\nYou will notice on line 4 the commented\
    \ call to `detatchDatabase` . I put it there to show you what we could have done.\
    \ However, it turns out that the way in which we are using the transaction makes\
    \ this call unnecessary, so I removed it. Below are rules for attaching and detaching\
    \ databases that will clarify this.\n\n*   If you don’t care about resource usage,\
    \ concurrency, or efficiency, make things easy on yourself; ignore the rules below\
    \ and just perform the attach immediately after creating the `SxmTransaction`\
    \ object. Then forget about it, and let the detach automatically happen when the\
    \ transaction object exits the `using` block. Otherwise, follow the rules below.\n\
    \n*   Attach a database as late as possible, preferably right before you intend\
    \ to execute a statement that requires the attachment. One caveat: a database\
    \ must be attached before any statement is executed that modifies a database,\
    \ i.e., a statement other than a select. The reason for this is an underlying\
    \ database transaction is started when a database is modified and you cannot attach\
    \ a database after the start of a transaction.\n\n*   Detach databases as soon\
    \ as you are done using them. For example, if you intend to execute multiple select\
    \ queries but only one of them uses the attached database, detach the database\
    \ as soon as you are done iterating through the results of the query, but not\
    \ before, otherwise you will lose the result set.\n\n*   Exiting the `using` block\
    \ for a transaction object will automatically detach any attached database. So\
    \ in our example, it was unnecessary to explicitly detach the database, we just\
    \ let it automatic happen.\n\n*   Do not explicitly detach a database that is\
    \ part of a transaction that performs an update until after you have called the\
    \ `commitTransaction` method. The reason for this, is you cannot detach a database\
    \ while in the middle of a transaction.\n\nLocking and concurrency\n\nIf your\
    \ application is guaranteed to only have a single transaction object active at\
    \ any one time, for example, it performs database processing on a single thread\
    \ and does not nest open transactions, then issues associated with locking and\
    \ concurrency can largely be ignored. However, if your app creates multiple `SxmTransaction`\
    \ objects simultaneously, you will need to understand locking and concurrency.\n\
    \nNOTE: This explanation of locking and concurrency is intended to provide you\
    \ the practical knowledge necessary to manage concurrent connections. This is\
    \ a somewhat complicated subject and I want to avoid getting bogged down in details\
    \ that do not add to this goal. Some operational details are skipped over in order\
    \ simplify this discussion and focus on presenting the core request information.\
    \ For example, SQLite has a notion of PENDING locks, which I do not cover. I don’t\
    \ believe you need to be concerned with this in order to properly manage concurrent\
    \ connections.\n\nLocks are used by SQLite in order to signal the operational\
    \ state of a database. When multiple connections try and access a database concurrently,\
    \ the database examines the lock state in order to ascertain which operations\
    \ are permissible. Depending on the current lock state along with the requested\
    \ operation, SQLite will either allow an operation to continue or block the operation\
    \ until the lock state changes or a timeout occurs. The following locks can be\
    \ acquired on a database.\n\n*   **Shared** – Multiple transaction objects can\
    \ have a shared lock simultaneously.\n\n*   **Reserved** – Only one transaction\
    \ object can have a reserved lock at any one time, however, a reserved lock can\
    \ coexist with shared locks.\n\n*   **Exclusive** – Only one transaction can have\
    \ an exclusive lock. All other locks must be disposed of before a transaction\
    \ can acquire an exclusive lock. Once acquired, no other locks may be acquired\
    \ until the exclusive lock is disposed.\n\nWhen an `SxmTransaction` object is\
    \ first created, it holds no lock on the database. An attempt to acquire a lock\
    \ only occurs when performing an operation. Let’s see which locks are acquired\
    \ by which operations.\n\n*   SQL select statements attempt to acquire shared\
    \ locks. A shared lock is used to tell SQLite that the connection is currently\
    \ reading from the database.\n\n*   Operations that modify a database, i.e., insert,\
    \ update, and delete, attempt to acquire reserved locks. A reserved lock tells\
    \ SQLite that at some point this connection may update the database by committing\
    \ its transaction.\n\n*   A connection attempts to acquire an exclusive lock when\
    \ it wishes to write to the database, i.e., commit its transaction. In SQLite.XM,\
    \ a commit is executed by the `commitTransaction` method`.`"
