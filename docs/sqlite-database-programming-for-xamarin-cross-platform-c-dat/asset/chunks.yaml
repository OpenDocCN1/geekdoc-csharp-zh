  trans: "\n虽然 `SxmTransaction` 类的效率比手动管理连接略低，但对于许多应用程序来说，这种性能差异并不显著到需要花费额外精力直接处理连接。除了建立新连接的成本外，`SxmTransaction`\
    \ 类类主要的性能缺点是事务对象销毁时预编译语句（prepared statements）会丢失。尽管如此，我想指出，这些成本并没有你想象的那么高。\n\n\
    在与传统的数据库服务器交互时，开发者通常会尽量减少连接的工作负载。这是合理的，因为连接到数据库通常需要到数据库服务器的远程网络连接。这种成本很高，应该将其降到最低。通过池化重用连接是实现这一点的常用策略。但移动应用的要求有所不同。到本地\
    \ SQLite 数据库建立新连接的成本非常低，不涉及网络传输。移动环境资源有限，因此管理一个连接池可能比按需创建和销毁连接更好。此外，虽然 SQLite\
    \ 具有良好的并发性，但尚未达到全功能数据库服务器的水平。较少的活动连接可以最大限度地减少锁定引起的潜在冲突。\n\n预编译语句在重复执行复杂查询时能发挥最大的优势。对于移动应用而言，这种情况是例外而非常态。对于大多数移动应用，查询往往是简单的，且执行频率通常不会高到让预编译语句节省的成本变得显著。需要理解的是，在使用\
    \ `SxmTransaction` 类时，预编译语句的优势并没有完全丢失。`SxmTransaction` 类确实会在事务生命周期内创建并使用预编译语句，这可能跨越多次语句执行。然而，所有创建的预编译语句在事务完成后都会丢失，因此它们无法被另一个事务对象继承并重用。\n\
    \n## 向数据库插入记录\n\n让我们从一个向数据库发布记录的简单示例开始。下面是我们的求职应用程序注册页的截图。这是一个非常基本的输入表单，用于在我们的应用中注册公司。当选择提交按钮时，就会处理注册。\n\
    \n![](img/Image00006.jpg)\n\n下面是用于我们注册表单的公司注册活动类。它非常简单，向数据库提交注册记录。我们最感兴趣的是 `processSubmitHandler`\
    \ 方法。该方法在选择提交注册按钮时被调用，负责插入注册记录。在我们拆解这个方法之前，让我们来看看 SQL 语句属性文件中的插入语句，它是被用于实际保存注册记录的。\n\
    \n`[registerCompany]`\n\n`[companyReg]`\n\n`[INSERT INTO companyReg (companyRegPK,\
    \ coName, hrContact, email, password) VALUES(?, ?, ?, ?, ?)]`\n\n定义中的第一个字段是语句名称；`registerCompany`。第二个字段是插入语句要插入的表名；`companyReg`。最后是实际的插入语句本身。这是用于实际保存注册的\
    \ SQL 语句。如你所示，这是一个简单的参数化插入语句。好了回到下面的代码。\n\n```csharp\nActivity (Label = \"CoRegistrationActivity\"\
    )]\npublic class CoRegistrationActivity : Activity\n{\n    protected override\
    \ void OnCreate(Bundle bundle)\n    {\n        base.OnCreate(bundle);\n      \
    \  SetContentView(Resource.Layout.CoRegistration);\n        Button submitCoRegButton\
    \ = FindViewById<Button>(Resource.Id.submitCoRegButton);\n        submitCoRegButton.Click\
    \ += delegate { processSubmitHandler(); };\n    }\n\n    private void processSubmitHandler()\n\
    \    {\n        ArrayList parameterValues = new ArrayList ();\n        1 string\
    \ registrationPK = Guid.NewGuid().ToString();\n        2 parameterValues.Add(registrationPK);\n\
    \        3 parameterValues.Add(FindViewById<EditText>(Resource.Id.coRegName).Text);\n\
    \        4 parameterValues.Add(FindViewById<EditText>(Resource.Id.coRegContact).Text);\n\
    \        5 parameterValues.Add(FindViewById<EditText>(Resource.Id.coRegEmail).Text);\n\
    \        6 parameterValues.Add(FindViewById<EditText>(Resource.Id.coRegPassword).Text);\n\
    \        7 using (SxmTransaction sxmTransaction = new SxmTransaction(\"jsearch\"\
    ))\n        {\n            8 InsertResponse ir = sxmTransaction.executeInsert(\"\
    registerCompany\", parameterValues);\n            9 if (sxmTransaction.commitTransaction()\
    \ != SQLiteErrorCode.Ok)\n                throw new SxmException(new ErrorMessage(\"\
    Commit error.\", Defines.SxmErrorCode.userDefined));\n        }\n    }\n}\n```\n\
    \n让我们详细查看 `processSubmitHandler` 方法。\n\n- 在第 1 行，我们创建了一个新的 `Guid`。之前，我解释了 GUID\
    \ 如何用作主键，而不是传统的自增整数。\n- 在第 2 到第 6 行，向 `ArrayList` 中填充了我们新创建的 GUID 以及注册表单中输入的值。这些值进入\
    \ `ArrayList` 的顺序必须与插入语句中的命名顺序一致。\n- 在第 7 行，我们实例化 `SxmTransaction`。`SxmTransaction`\
    \ 构造函数接受一个参数，即你想要交互的数据库名称。为了方便，如果你的应用只使用一个数据库，可以省略数据库名称。\n- 在第 8 行，我们执行插入命令，执行记录插入数据库的实际操作。`executeInsert`\
    \ 方法接收两个参数：如上。\n- 在第 9 行，事务被提交。此时，记录将被插入。如果你在退出 `using` 块而不提交事务，清理代码将执行回滚。\n\n\
    上面的大部分代码都非常简单且通俗自懂。然而，有几点值得注意。始终在 `using` 语句内部实例化 `SxmTransaction`。这是为了确保妥善的清理。你应该在\
    \ `SxmTransaction` `using` 内部执行尽可能少的工作。这样做是为了限制事务对象的生命周期。例如，不要做类似以下的操作。\n\n```csharp\n\
    using (SxmTransaction sxmTransaction = new SxmTransaction(\"jsearch\"))\n{\n \
    \   ArrayList parameterValues = new ArrayList ();\n    string registrationPK =\
    \ Guid.NewGuid().ToString();\n    // ... more logic ...\n}\n```\n"
- fmt: '

    ```

    InsertResponse ir = sxmTransaction.executeInsert("registerCompany", parameterValues);

    SQLiteErrorCode SqliteErrorCode = sxmTransaction.commitTransaction();

    }

    ```


    In the coded fragment above, we are building the parameter values array inside
    the `using` block. This causes us to hold onto database resources longer than
    necessary. DO NOT pass an `SxmTransaction` object to other threads. Depending
    on the state of the transaction, this could cause problems.


    The `executeInsert` method locates the insert statement from the SQL statements
    properties file that matches the statement name passed in as the first parameter.
    In our example, this would be the entry below.


    `INSERT INTO companyReg (companyRegPK, coName, hrContact, email, password) VALUES(?,
    ?, ?, ?, ?)`


    The values in the `ArrayList` passed in as the second parameter replace the parameter
    placeholders in the SQL statement. The statement is then executed. If you have
    been following along closely, you are probably wondering why an insert definition
    must include the name of the table being inserted. As a refresher, the format
    of an insert definition in the SQL statements properties file is as follows:


    `[statement name][table name][insert SQL statement]`


    The purpose for the statement name and the insert SQL statement is obvious, but
    why the table name? Earlier I mentioned that an ID field used for synching records
    is added to every table. After an insert is performed, an immediate update to
    the record is then executed in order to add the synched ID. The table name is
    used by this update code. The table name could be extracted from the insert statement,
    but it is more efficient to have it as an explicit field rather than parsing the
    statement field.


    ### Committing transactions


    The `SxmTransaction` object performs a true transaction. That is, all SQL commands
    executed by an instance of `SxmTransaction` that modify the database are applied
    or discarded atomically by the `commitTransaction` or `rollbackTransaction` methods.
    `commitTransaction` returns a `SQLiteErrorCode`. If the commit is successful,
    the return value is `SQLiteErrorCode.Ok`. Any other return value indicates an
    error that occurred in the SQLite engine. A list of SQLite error codes can be
    found in Appendix A. Other errors encountered during the execution of `commitTransaction`
    will result in an exception. Modifications to the database will not be visible
    to other transaction objects until the changes are committed. A transaction object
    can see its own changes as they are occurring, before a commit. For more details,
    see the sections ‘Understanding Transactions’ and ‘Transaction Visibility.’


    ### The insertResponse object


    The `executeInsert` method returns an `InsertResponse` object.


    ```

    InsertResponse ir = sxmTransaction.executeInsert("registerCompany", parameterValues);

    ```


    This object contains the auto increment ID and the `systemSynchID` for the newly
    inserted record. Remember, the `systemSynchID` is a system managed field which
    is added to every table and is used for synching to the cloud. For the most part,
    these values are not really all that important for your application code. While
    the increment ID can be used to uniquely identify a record locally, this is really
    not a good idea. ID’s are not unique across devices and relying on them can cause
    problems. You are far better off using GUIDS as unique identifiers, I explained
    this earlier. The record ID and the synch ID are both properties with getters
    that can easily be accessed.


    ```

    string synchID = ir.SynchID;

    int recordID = ir.RecordID;

    ```


    If the record ID is -1 or the synch ID is null, then a problem occurred with the
    insert that didn’t result in an exception being thrown. This should be a very
    rare condition indeed. The `systemSynchID` is a system managed field and unless
    you have some compelling reason to do otherwise, it is best left alone.


    ### Saving file attachments


    File attachments can be saved directly in the database as a BLOB or as an external
    file with a pointer stored in the database. There are legitimate reasons for choosing
    one or the other. As a practical matter, unless you intend to store a large number
    of files or you expect the files to be rather large, it probably doesn’t make
    a huge difference which option you choose.


    According to the SQLite documentation:


    “For BLOBs smaller than 100KB, reads are faster when the BLOBs are stored directly
    in the database file. For BLOBs larger than 100KB, reads from a separate file
    are faster.”


    But processing speed should not be the only consideration or even the primary
    consideration. I find storing files outside the database to be more flexibility.
    Often times, it can be very difficult to know in advance the direction a project
    will take over time. Trying to predict future requirements is a fool’s errand.
    For this reason, when presented with the option of flexibility over performance
    or convenience, I almost always opt for a more flexible engineering solution.
    For example, one application I wrote ended up having a requirement to share file
    data between records without duplicating the file data. This particular requirement
    didn’t show up until 5 years after the initial release. This would have been very
    difficult to implement had we not chosen to store attachments as external files.
    I worked on another app which included support to save file attachments in virtually
    unlimited numbers. Initially, we stored the files on dedicated servers that were
    separate from the database server. This was before AWS S3 and other similar services.
    When S3 was introduced, we decided to move our all file from our servers into
    S3 storage. In this case, storing the files outside the database simplified the
    transition to S3. In both these cases, flexibility served us well as requirements
    changed in ways we could not have predicted when initially designing our application.


    Storing inside the database allows for file attachments to automatically participate
    in transactions and makes backups and some other database operations easier. And
    don’t forget, external files means there’s one more item that needs to be managed
    as part of every record. This can complicate your design significantly; for example,
    you’ll need to include exception processing in your app to deal with synching
    failures, such as when a record delete succeeds but the associated file delete
    fails.


    Let’s dig deeper into this to see what I’m talking about. Imagine you delete a
    database record that includes an external file attachment, but when you try and
    delete the associated file, you get some sort of failure. Now what do you do?


    1. Acknowledge the failure by performing a rollback on the record delete. If this
    was an automated delete, try it again later, otherwise, alert the user that a
    failure occurred and ask them to try the selected operation again later.

    2. Allow the record delete to fully process by issuing a commit. The file is marked
    somehow in order to permit automatic removal at some later date.

    3. Allow the record delete to fully process by issuing a commit. The file failure
    is ignored and the file is simply left orphaned.


    You can only make the “right” choice after considering the specifics of the particular
    application. Even so, none of these are particularly attractive options. It would
    be best if this problem were solved by not allowing the problem to occur in the
    first place. And you can do that by storing the file in the database.

