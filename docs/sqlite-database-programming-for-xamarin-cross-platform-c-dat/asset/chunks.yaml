    你之前见过见过这种方法，所以我就不再详细介绍了。不过，我想指出一下第 1 行的 `using` 语句。`SxmTransaction` 构造函数接受一个 `SxmConnection`
    实例作为唯一参数。在我们之前的所有示例中，`SxmTransaction` 对象都是使用数据库名称创建的。这种差异对它的用法没有影响。一旦创建，`SxmTransaction`
    对象的行为与之前解释的完全相同。在退出 `using` 块后，`SxmTransaction` 将不再可用。然而，`SxmConnection` 对象仍然保持激活状态，并可供其他事务继续使用。


    连接对象不能同时被多个事务使用。如果你尝试在连接附加到事务时使用该连接，它将抛出 `lockDB SxmException`。只要该连接当前没有被 `SxmTransaction`
    使用，你就可以安全地将连接对象传递给另一个线程。


    当你完成连接的使用后，请调用 `destroyConection` 方法。一旦调用，该连接对象将不再可用。


    ## 第 3 部分. 数据到云端的同步


    在深入研究之前，我们可能应该先理解我们正在尝试做什么。我们云同步的目标是将记录数据从本地 SQLite 数据库复制或移动到服务器端数据存储器；推测这是一个企业级数据库服务器，但
    SQLite.XM 并没有规定必须是这样。SQLite.XM 开箱即用即可支持 HotRiot.com，该平台同时使用 MySQL 和 MongoDB 作为其数据存储。然而，SQLite.XM
    可以与你选择的任何后端数据库或中间件配合。我稍后会向你展示如何实现，但本质上涉及到编写一个自定义委托方法，并将其插入到同步处理链中。当委托存在时，它将被调用，以将记录数据从设备传输到你希望保存的任何地方。这种传输可以用任何方式并在你选择的任何服务器上进行。你有完全的活性。我们稍后会讨论。本书部分的很大一部分将致力于使用内置的
    HotRiot 同步。


    下面的图描绘了数据如何从各个设备聚合到云服务器。


    ![](img/Image00010.jpg)


    这是一个持续且异步的单向过程。我的意思是，每个设备独立于所有其他设备进行同步；设备之间没有协调，也没有规定的同步时间。


    关于“同步”这个术语，让我说明几点。有些人可能会反对我使用这个术语，因为同步强烈暗示了两份或多份数据副本正保持更新或同步状态。这并不是我们正在做的，我们是将数据从设备复制到中央数据库服务器。这种活动可能被更好地描述为“复制”（replication）。但即使是这个词也不完全准确，因为并没有要求进行真正的复制。SQLite.XM
    非常乐于在将数据移动到服务器之前对源数据进行转换。不仅如此，服务器端数据存储器可以是与本地设备使用的完全不同的存储技术，SQLite.XM 并不在乎。整个活动可能被更准确地描述为
    ETL（提取、转换、加载）过程，但这取决于它是如何实现的的。所以我们最终决定就用“同步”这个词。对于那些持不同意见的人，我请求留一点回余地。此外，我交替使用“同步”和“复制”这两个术语。


    ## 理解 SQLite.XM 同步


    通常情况下，执行数据库同步有两种方法：


    -   基于语句的同步 (SBS)

    -   基于行的同步 (RBS)


    在 SBS 中，在源数据库上执行的 SQL 语句会被复制并在目标数据库上执行。在 RBS 中，实际的记录数据从源数据库复制到目标数据库。SQLite.XM
    使用 RBS。然而，每种方法都有优缺点，但由于 SQLite.XM 同步的性质，SBS 并不实用。在相同版本的相同数据库上成功执行 SBS 已经足够困难。期望在异构数据库技术（SQLite.XM
    允许的）之间使用 SBS 仅仅是不切实际的。不仅如此，SQLite.XM 同步允许在将数据传播到服务器之前对源数据进行转换。在这种情况下，SBS 真的没有意义。


    通常在 RBS 中，修改后的记录数据被复制到同步日志中，在那里临时保留，直到移动到目标数据存储器。每个新的插入或记录更新都会在日志中产生新条目。正如你可以想象的，取决于插入和/或更新的速度以及数据同步的频率，你可能会得到一个巨大的日志文件。这在实现上也有些复杂，因为同步日志文件的完整性必须作为每个事务的一部分得到保证。这可能会变得非常复杂，而且在实际数据库之外管理日志时，创建一个可靠的解决方案是非常困难的。


    SQLite.XM 采用了一种略有不同的 RBS 方法，这对于大多数应用程序来说效果良好。尽管如此，了解细节对你来说很重要，以便你判断它是否适用于你的特定应用程序。SQLite.XM
    并没有传统意义上维护同步日志。虽然存在日志，但日志仅包含了需要同步的记录的复制键（replication key）。该键用于查询记录，以便将整个记录数据作为同步操作的一部分发送。正如你预期的，这既有优点也有缺点。


    日志是在 SQLite 执行的正常插入、更新和删除事务处理过程中填充的。这是 SQLite 强制执行的 ACID 遵循的一部分。这有助于确保复制日志的完整性。因此，如果记录被成功插入、更新或删除，我们可以确定会在复制日志中创建相应的条目。反之，如果数据库插入、更新或删除失败，我们可以确保不会在复制日志中插入条目。这很重要，因为正确的同步始于一个准确反映数据库活动的复制日志。


    SQLite.XM 按照插入顺序查询复制日志中的条目；即先进先出 (FIFO)。每个日志条目的复制键用于查询该条目所引用的记录。然后将整个记录数据发送到复制服务器，在数据库中创建新条目或更新/删除现有记录。SQLite.XM
    不跟踪更新时修改的单个字段，它只是用当前的记录数据更新整个记录。这极大地简化了同步过程，有助于使其更加可靠。然而，它的副作用是可能会增加网络流量，超过了仅更新修改字段的所需的流量。如果你的应用程序对现有记录进行多次部分修改，这可能比实际所需的有显著增加。当然，这取决于你应用程序的具体情况。


