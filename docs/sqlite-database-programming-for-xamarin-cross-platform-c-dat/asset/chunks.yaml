    You will also notice that the data type for the *email* field is set to *Email
    Address* . For this table, the HotRiot validator will reject any insert where
    the value for the *email* field is anything other than a valid email address.
    SQLite does not have an email address data type; as far as I know, no database
    has this. In SQLite, an email address is simply a text field. It is the responsibility
    of the application to perform the required data validation. HotRiot has many data
    type options that are not in SQLite.  For example, phone number, zip code, and
    year; just to name a few. HotRiot validates all incoming data whenever inserting
    or updating a record. Any mismatches will result in the insert/update being rejected.
    This is important for you to bear in mind as you develop your application. The
    truth is, you should always validate the data that is processed by your app. This
    helps to ensure the integrity of your data. However, when synchronizing with HotRiot,
    this becomes mandatory.


    ![](Image00034.jpg)


    There is one other required setting for replication with HotRiot. The *systemSynchID*
    field must be set to an *Edit Key* , this is done on Step 5 of the *Create Database*
    wizard. Below is a partial screenshot of this step. Start by setting the special
    property for the *systemSynchID* field to ‘*Value must be unique* .’ A check box
    will appear by the name *Edit Key* ; select this check box.


    ![](Image00026.jpg)


    Once all of the tables that are required for synchronization have been created,
    you’re ready to activate the synchronization process in SQLite.XM.


    Activating synchronization in SQLite.XM


    Earlier, I showed you how to initialize the SQLite.XM library using the following
    method call.


    `SxmInit.` `initialize();`


    When the library is initialized in this manner, synchronization is inactive. That
    is to say, the SQLite.XM library will not attempt to perform data synchronization.
    In order to activate synchronization to your HotRiot account, you will need to
    perform initialization like this.


    `SxmInit.` `initialize(“YOUR HotRiot APPLICATION NAME”);`


    `this` `.StartService (` `new`  `Intent` ` (` `this` `, ` `typeof` `(` `SynchronizeService`
    `)));` `  //` `For Android only.`


    Replace `“` *`YOUR HotRiot APPLICATION NAME`* `”` with the application name you
    entered when you registered with HotRiot. You can look-up your application name
    by selecting the edit registration icon on the HotRiot *Main Console* page.


    Synchronization details


    When SQLite.XM starts, it immediately checks the replication log for any existing
    entries. Any records that are in the log are immediately synchronized, if possible.
    If synchronization succeeds and all outstanding records are synchronized, synchronization
    goes into a wait state waiting for an event notification. A notification is triggered
    whenever a record is inserted, updated, or deleted that needs to be synchronized.
    The notification immediately sets off the synchronization process, where the outstanding
    record or records are synchronized. That’s how it goes when everything works as
    planned.


    Of course, things never go as planned all of the time and errors are to be expected.
    Errors encountered by synchronization fall into two categories:


    *   Recoverable


    *   Non-recoverable


    While this seems simple enough, there are details that you need to be aware of.
    Recoverable errors are errors encountered by synchronization which prevented replication
    from successfully processing but which are expected to correct themselves. These
    types of errors cause synchronization to pause for a brief period of time while,
    hopefully, the error condition clears up. After pausing, synchronization will
    again attempt to perform replication. If the error persists, synchronization will
    again pause. It will perform this cycle until it successfully synchronizes or
    the app is shutdown. If the app is terminated, SQLite.XM will attempt to synchronize
    all outstanding records the next time it is restarted. Examples of recoverable
    errors are:


    *   Web exceptions


    *   IO exceptions


    *   Out of memory exceptions


    *   Unexpected exceptions


    A non-recoverable error is, as its name implies, an error which prevents synchronization
    from processing and has little or no chance of correcting itself. When SQLite.XM
    encounters this type of error, it removes the synchronization log entry that triggered
    the error, it then continues processing with the next record in the log. The offending
    record that is associated with the deleted log entry is not synchronized.  Examples
    of non-recoverable errors are:


    *   Validation errors in HotRiot. For example, you define a field in HotRiot to
    expect a number and the corresponding field in the record being synchronized contains
    text. In such a case, the HotRiot validator will always to reject the insert/update
    for the record in question. Synchronization has little choice but to skip over
    the offending record. There are other types of validation errors that can occur.
    For example, if you define a field in HotRiot as *required* and the field in the
    record being synchronized is missing, or is null.


    These types of validation errors are the primary source of unrecoverable errors.
    Fortunately, they are easy to prevent by simply including validation code in your
    app.


    The following is another interesting unrecoverable synchronization error. Actually
    it would be more proper to consider this a replication side effect rather than
    an error.


    ![](Image00031.jpg)


    Consider the log file above. The record represented by synchronization ID 2764
    is updated by log entry 167 and delete by log entry 169\. When synchronization
    tries to process the update from entry 167, it will be unable to locate the record
    in the SQLite database due to it being deleted. The logical course of action for
    synchronization to follow is to simply remove log entry 167 and continue processing. 


    Inserting, updating, and deleting of records while synchronization is in the running
    state, i.e., not waiting, is perfectly fine; there is no coordination that you
    need to perform. You’re free to modify the device database independent of synchronization.
    If a record is inserted, updated, or deleted while synchronization is in progress,
    the resulting replication log entry will be processed as part of the currently
    running synchronization cycle. Of course, if synchronization is in a wait state,
    the new log entry will trigger a synchronize event.


    Synchronizing files


    Earlier, in the section ’Saving file attachments’, I discuss the pros and cons
    of storing files inside the database verses storing them outside the database.
    I won’t bore you with a rehash of that material. However, we need to go over some
    specifics regarding how file attachments are processed by synchronization. This
    is important for applications that include files as part of their database records
    and that intend to synchronize with a server-side datastore.'
