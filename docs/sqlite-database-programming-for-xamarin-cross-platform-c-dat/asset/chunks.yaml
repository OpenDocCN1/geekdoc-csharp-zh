    Error Processing\n\nErrors are a fact of life for any app of significance, so\
    \ I suppose it goes without saying that proper error handling is critical. But\
    \ you’d be surprised how often I see error processing implemented as an afterthought.\
    \ Often what you see is the main line of the code implemented first and then the\
    \ exception processing grafted on at some later point. It is natural to set aside\
    \ error handling; it’s mostly mundane work that feels somewhat unproductive, and\
    \ it can be difficult to do well. But don’t wait. The sooner you start dealing\
    \ with exception conditions the better. It will prompt you to think about your\
    \ code in a deeper more critical way and probably get you to implement more robust\
    \ solutions. However, to get real benefit from this, it needs to be done while\
    \ you are writing the main line of code. Enough said, for now. Let’s have a look\
    \ at a two examples. The first will show exception processing during database\
    \ initialization. The second example will show error processing for an `SxmTransaction`\
    \ .\n\n**Initialization error processing**\n\nThe `initDB` method below initializes\
    \ the database, preparing it for use. It performs the basic tasks required by\
    \ SQLite.XM. The interesting dilemma with initializations, is that you often can’t\
    \ proceed if they fail. This is certainly almost always the case with database\
    \ initialization. It’s kind of hard to recover from errors rooted in the foundation\
    \ of an app. For example, if database schema initialization fails, how can you\
    \ really expect to run your app with any confidence? The answer is, you can’t.\
    \ That’s the bad news. The good news is, once you get initialization working,\
    \ it would be unusual for it to fail. So, for the most part, error processing\
    \ on initialization is used more during development than for recovery. That being\
    \ said, should initialization fail in production, you need to process the error\
    \ in a sane manner; don’t just let it go. It’s better to proactively deal with\
    \ an unrecoverable condition rather than let it manifest into something worse.\
    \ Let’s get on with the code below\n\n`  protected`  `void` ` initDB ()`\n\n`  {`\n\
