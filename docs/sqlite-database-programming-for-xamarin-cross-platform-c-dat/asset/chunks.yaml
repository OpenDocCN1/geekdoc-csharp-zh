- fmt: "\nInstead of creating a key field as a traditional auto increment value, you\
    \ define it as a text field. You then populate the field with a Globally Unique\
    \ Identifier (GUID) sometimes referred to as a Universally Unique Identifier (UUID).\
    \ Put simply, a GUID can be thought of as a random number that is virtually guaranteed\
    \ to be unique from all other GUIDs. It would be fair to ask how we can be so\
    \ sure that we won’t have the same duplicate key problem with GUIDs that we would\
    \ have with auto increment keys. I won’t go into details, but given how GUIDs\
    \ are generated and their enormous size (typically 128 bits), it is generally\
    \ accepted that it’s safe to rely on them being unique. Later, I will show you\
    \ how to generate a `GUID`.\n\n## SQLite naming constraints\n\nIn SQLite, table\
    \ names, index names, column names, or any other named object should only include\
    \ alphanumeric characters, including underscores, and must not start with a digit.\
    \ Avoid all other special characters, including spaces. This is the safest way\
    \ to go. That being said, SQLite will allow special characters in a named object\
    \ provided it is quoted using one of the mechanisms below.\n\n1. Use double quotes,\
    \ as in the following: `\"keyword\"`\n2. Use brackets, as in the following: `[keyword]`\n\
    3. Use grave accents (ASCII code 96), as in the following: `keyword`\n\nAnother\
    \ rule you might choose to follow when selecting names, is to avoid English words.\
    \ The reason for this is to avoid any conflicts with SQL keywords.\n\n## Initializing\
    \ the database\n\nWe now have everything in place to successfully initialize our\
    \ database. So let us take a look at an example that puts all of the pieces together.\
    \ Below is a code snippet for an Android main activity class. In the example below,\
    \ it is assumed that you have already created a SQL statements properties file\
    \ by the name `SqlStatements.txt` and have populated it with create table statements,\
    \ and, optionally, any required index statements.\n\n```java\npublic class MainActivity\
    \ : Activity\n{\n    protected override void OnCreate(Bundle bundle)\n    {\n\
    \        base.OnCreate(bundle);\n        SetContentView(Resource.Layout.Main);\n\
    \        try {\n            1 new DatabaseDescriptor(\"jsearch\");\n         \
    \   // Read the SQL statements properties file that we placed in the Assets folder.\n\
    \            2 using (StreamReader sr = new StreamReader(Assets.Open(\"SqlStatements.txt\"\
    ))){\n                3 ProcessSQLStatements.Parse(sr);\n            }\n     \
    \       4 SxmInit.initialize();\n            5 using (SxmTransaction sxmTrans\
    \ = new SxmTransaction(\"jsearch\"))\n            {\n            }\n        }\
    \ catch (System.Exception ex){\n            string message = ex.Message;\n   \
    \     }\n    }\n}\n```\n\nThe first step in initializing the database is to create\
    \ a database descriptor for each database needed by your app, see line 1. Our\
    \ example app only requires one database, this is typical for mobile applications.\
    \ Once this is done, the next step is to process the SQL statements properties\
    \ file. Have a look at lines 2 and 3. Line 2 creates a new stream reader for the\
    \ file. The file stream is then processed on line 3. Once these two steps are\
    \ complete, it’s time to actually perform the initialization. This is done on\
    \ line 4. Line 5 creates a transaction for the newly initialized database. This\
    \ step is not actually part of the initialization process and is only shown here\
    \ for illustration. I explain transactions in detail in a later section. It doesn’t\
    \ really matter when you actually initialize the database. In our example, we\
    \ are doing it in the main activity. The only rule is that you must initialize\
    \ the database before trying to establish a connection or create a transaction\
    \ object. This seems obvious enough.\n\nBelow is an example of how this initialization\
    \ might be done for iOS.\n\n```csharp\npublic class Application {\n    // This\
    \ is the main entry point of the application.\n    static void Main(string[] args)\n\
    \    {\n        Thread synchThread = new Thread(new ThreadStart(initDB));\n  \
    \      synchThread.Start();\n        // If you want to use a different Application\
    \ Delegate \n        // class from \"AppDelegate\" you can specify it here.\n\
    \        UIApplication.Main(args, null, \"AppDelegate\");\n    }\n    private\
    \ static void initDB() {\n        new DatabaseDescriptor(\"jsearch\", Environment.SpecialFolder.Personal);\n\
    \        // Read the SQL statements properties file that we placed in Resources\
    \ folder.\n        using (StreamReader sr = new StreamReader(\"Resources/SqlStatements.txt\"\
    )){\n            ProcessSQLStatements.Parse(sr);\n        }\n        SxmInit.initialize();\n\
    \    }\n}\n```\n\nAs you can see, the Android initialization and the iOS initialization\
    \ are virtually identical. The main difference is we performed the iOS initialization\
    \ on separate thread. Strictly speaking, this is probably not necessary and you\
    \ could always do this way for Android. The other, minor difference, is the way\
    \ we pass the path for SQL statements properties to the `StreamReader`. This is\
    \ done differently to account for the fact that in Android SQL statements properties\
    \ file is placed in `Assets` folder and in iOS it is placed in `Resources` folder.\n\
    \nNow, you might look at the initialization sequence and think that it is rather\
    \ inefficient to do this for startup. However, looking closely at the code, you\
    \ see that it’s really quite efficient. Parsing the statements properties file\
    \ is pretty light weight, and besides, even a file with a lot of statements is\
    \ not going to be very large, possibly 100 kB. The create schema code is also\
    \ very efficient. For each database used by your app, typically one, a single\
    \ query is made to get the names of existing tables. The create table statements\
    \ are compared to this list and those existing in the database are skipped. The\
    \ alter table statements are only executed against tables that already exist.\
    \ This allows you to make schema changes to tables without having to execute both\
    \ create and alter commands. Index and alter table statements are only executed\
    \ after their corresponding index or table field is first checked to verify that\
    \ the statement needs to run. More about this later.\n\nOne more important point.\
    \ It is perfectly safe to execute the initialization sequence multiple times for\
    \ each run of an application, the sequence is idempotent. This might, under certain\
    \ circumstances, ease dealing with application transitions. For example, the code\
    \ below would work just fine.\n\n```java\nfor (int i=0; i<4; i++) {\n    new DatabaseDescriptor(\"\
    jsearch\");\n    using (StreamReader sr = new StreamReader(Assets.Open(\"SqlStatements.txt\"\
    ))){\n        ProcessSQLStatements.Parse(sr);\n    }\n    SxmInit.initialize();\n\
    }\n```\n\nWhile this is not something that you would necessarily want to do, no\
    \ harm will come if you do.\n\nUsing the SxmTransaction class\n\nOnce the database\
    \ has been fully initialized, it is ready to be used. The `SxmTransaction` class\
    \ is the easiest and most direct way to interact with your database. It dynamically\
    \ creates connections to the database and manages all associated resources automatically.\
    \ For most applications, this is the best way to work with the database; you just\
    \ instantiate an instance of the class inside a `using` statement and use it.\
    \ All of the resource cleanup is taken care of automatically. Your other option\
    \ is to manually create your database connections, reusing them as needed. I explain\
    \ this in a later section. For more information, see the section ‘The `SxmConnection`\
    \ class.’\n"
