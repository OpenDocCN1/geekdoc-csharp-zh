  trans: '

    好的，新语句与旧语句相同，只是增加了 `CEO` 字段。对于安装你应用的新用户来说，一切看起来都很正常，但对于那些升级到新版本的现有用户来说呢？`SQLite.XM`
    的工作方式是：只有当创建的表在数据库中不存在时，它才会执行 `create table` 语句。如果表已存在，该语句将被跳过。你需要做的是在 SQL 语句属性文件的
    `ALTER` 部分中包含一个 `alter table` 语句，为该表添加新字段。`SQLite.XM` 只会对数据库中已存在的表执行 `alter table`
    语句。因此，创建和修改表的规则如下：


    - `create table` 语句仅在要创建的表在数据库中不存在时才会执行，否则该语句将被跳过。

    - `alter table` 语句仅在要修改的表已存在于数据库中时才会执行，否则该语句将被跳过。

    - `alter` 语句仅在要添加到表的字段不存在时才会执行。


    根据这些规则，修改我们公司注册表的正确方法是在 SQL 语句属性文件中同时包含 `create table` 语句和 `alter table` 语句。根据用户是首次安装还是升级现有安装，只有其中一条语句会执行。两个示例语句所示所示。


    ```

    [TABLE]

    CREATE TABLE companyReg (id INTEGER PRIMARY KEY AUTOINCREMENT,

    companyRegPK TEXT, coName TEXT, hrContact TEXT, email TEXT,

    password TEXT, ceo TEXT)

    []

    ```


    ```

    [ALTER]

    [jsearch.companyReg][ceo][ALTER TABLE companyReg ADD ceo TEXT]

    []

    ```


    你应用的每个新版本的 `create table` 语句应该根据最新版本的要求来创建表。你还应该包含所有所需的 `alter table` 语句，以便将表从应用的首次发布版本升级到最新版本。不要在应用的发布版本之间删除
    `alter` 语句，否则更新可能无法正确应用。对于正在升级的用户，`SQLite.XM` 将执行所需的 `alter table` 语句，以便将表从当前状态升级到最新版本。对于新用户，将只会执行
    `create table` 语句。


    添加字段的 `alter table` 语句仅在表已不包含该字段时才会执行。对于数据库中的每个表，都会执行一次查询来获取现有字段的名称。通过 `alter
    table` 命令添加的字段将与此列表进行比较，已存在的字段将被跳过。


    整个讨论规避了从表中删除字段或进行其他更复杂的结构更改的问题。遗憾的是，`SQLite` 不支持这些操作。如果你有一个不再需要的字段，我建议你直接从表中删除该字段的所有数据，而不是忍受模拟
    `drop column` 语句的痛苦。除非你有充分的理由这样做这样做，否则可能直接保留那个不需要的字段更好。如果你必须进行不支持的表更改，你将需要手动执行这些更改。你可以创建一个新表，然后手动将数据从旧表复制到新表，并在代码中执行转换。这种解决方案存在潜在问题，特别是在处理大型数据集时。


    ## 创建/删除索引


    表索引可以通过以下方式更改：


    - 删除现有索引

    - 创建新索引


    仅此而已，没有办法可以修改现有索引。如果你有一个想要更改的索引，处理过程是先删除该索引，然后使用新的索引名称以新结构重新创建它。正如我之前提到的，`create
    index` 和 `drop index` 语句位于 SQL 语句属性文件的 `INDEX` 部分。这些语句可以以任何顺序出现。


    让我们来看如何为应用的新发布更新索引。你的应用的第一个版本很可能包含某些索引，尽管这不是强制要求的。然而，为了我们的示例，我们假设我们的应用在发布时带有两个索引定义。下面是我们示例的
    SQL 语句属性文件的 `INDEX` 部分。


    ```

    [INDEX]

    [jsearch.companyReg][coRegNameIDX]

    [CREATE INDEX coRegNameIDX ON companyReg (coName)]

    [jsearch.jobPosting][jobTtileIDX]

    [CREATE INDEX jobTtileIDX ON jobPosting (jobTitle)]

    []

    ```


    我们有两个索引，一个在 `companyReg` 表上，另一个在 `jobPosting` 表上。现在，假设在下一次发布中，我们决定 `jobTitleIDX`
    索引需要更改，以便包含 `pay` 字段。此外，我们想在求职者注册表上创建一个新索引。以下是我们修改后的 SQL 语句 `INDEX` 部分。


    ```

    [INDEX]

    [jsearch.companyReg][coRegNameIDX]

    [CREATE INDEX coRegNameIDX ON companyReg (coName)]

    [jsearch.jobPosting][jobTtileIDX]

    [CREATE INDEX jobTtileIDX ON jobPosting (jobTitle)]

    [jsearch.jobPosting][jobTtileIDX]

    [DROP INDEX jobTtileIDX]

    [jsearch.jobPosting][jobTtilePayIDX]

    [CREATE INDEX jobTtilePayIDX ON jobPosting (jobTitle, pay)]

    [jsearch.seekerReg][seekerNameIDX]

    [CREATE INDEX seekerNameIDX ON seekerReg (fName, lName)]

    []

    ```


    表中的新条目已**加粗**显示。我们现在有三个活动索引：`coRegNameIDX`、`jobTitlePayIDX` 和 `seekerNameIDX`。属于我们第一个版本的
    `jobTitleIDX` 索引已被删除。删除语句可以出现在任何地方，我恰好把它放在了创建语句之后。`SQLite.XM` 在处理文件的 `INDEX` 部分时适用以下规则：


    - SQL 语句属性文件 `TABLE` 部分的 `create table` 语句在 `INDEX` 部分任何语句之前执行。

    - SQL 语句属性文件 `ALTER` 部分的 `alter table` 语句同样在 `INDEX` 部分任何语句之前执行。

    - `alter` 语句仅在添加到表的字段不存在时才会执行。

    - `create index` 语句仅在索引不存在且没有对应的 `drop index` 语句时才会执行。

    - `drop index` 语句仅在索引存在时才会执行。


    不要在应用的发布版本之间删除索引语句，否则更新可能无法正确应用。一旦索引被删除，你就无法再次使用被删除的索引名称。如果你删除了一个索引，请注意修改任何使用该索引
    `INDEXED BY` 子句的 SQL 语句`INDEXED BY` 强制 SQLite 查询计划器对 `DELETE`、`SELECT` 或 `UPDATE`
    语句使用特定的命名索引。


    ## 删除表


    要删除表，执行以下操作：


    - 将 SQL 语句属性文件 `TABLE` 部分的 `create table` 语句替换为 `drop table` 语句。

    - 从 SQL 语句属性文件的 `ALTER` 和 `INDEX` 部分中移除引用目标表的语句。


    仅此而已。不要在应用的发布版本之间删除 `drop table` 语句，否则更新可能无法正确应用。


    ## SxmConnection 类


    作为由 `SxmTransaction` 类管理连接的替代方案，你可以使用 `SxmConnection` 类直接创建并管理连接。然而，在向你展示如何操作之前，让我们先花时间看看这个类的设计。

    '
- fmt: "\nIf you take a look at the `SxmConnection` code you will notice that it does\
    \ not inherit from the `SqliteConnection` class. This is a bit strange, as it\
    \ would be reasonable to consider the `SxmConnection` to be a specialization of\
    \ the `SqliteConnection`. It turns out the `SqliteConnection` class is sealed\
    \ and therefore cannot be used as a base class. I am not sure why this was done\
    \ that way but it leaves us with few options except to have the `SxmConnection`\
    \ class contain a `SqliteConnection` object. This works just fine but it would\
    \ seem a more appropriate to use inheritance rather than containment.\n\nThe `SxmConnection`\
    \ class does quite a bit more than simply establish a connection. It acts as a\
    \ wrapper around all things related to processing database SQL commands. For example,\
    \ it maintains the connection command object, includes a data reader for accessing\
    \ record data from the last query and it manages error logging. It is also responsible\
    \ for some resource management. As you would expect, this all has advantages and\
    \ disadvantages. The `SxmConnection` class is very easy to use and removes much\
    \ of the burden associated with dealing with the database. However, it is a bit\
    \ less flexible than managing a connection directly using custom code. The compromises\
    \ are relatively minor. The main issue is the `SxmConnection` class only maintains\
    \ a single command object, as a result, it only supports a single data reader.\
    \ What this means is, only the record data from the last executed query is accessible.\
    \ This is generally not an issue as you are normally only interested in reading\
    \ the results from the last query. If you need access to the result set of multiple\
    \ queries simultaneously, the workaround is very easy, you simply create multiple\
    \ connection objects or you pull the data from the first query out of the record\
    \ set and into a collection and then issue a second query on the same connection.\n\
    \n### Creating an SxmConnection\n\nCreating a connection is very easy, you simply\
    \ instantiate an `SxmConnection` object.\n\n```csharp\nSxmConnection Conn = new\
    \ SxmConnection(\"jsearch\");\n```\n\nThe `SxmConnection` constructor takes one\
    \ required parameter, the name of database for which you wish to establish a connection.\
    \ It’s safe to create multiple connections to the same database. In fact, it’s\
    \ one of the strategies you can use in order to allow multiple threads to access\
    \ the same database. You do not need to synchronize the creation of connection\
    \ objects, even when connecting to the same database. As a convenience, you can\
    \ omit the database name parameter provided your app only uses one database, i.e.,\
    \ only defines one database descriptor. In this case, the constructor would be\
    \ written as:\n\n```csharp\nSxmConnection Conn = new SxmConnection();\n```\n\n\
    There is one interesting thing to note regarding the creation of connections.\
    \ Before instantiating a connection, you can modify the database descriptor associated\
    \ with the database you wish to connect. This allows you to alter descriptor details\
    \ when connecting to the same database multiple times. Let’s have a look at an\
    \ example.\n\n```csharp\ntry {\n  1 new DatabaseDescriptor(\"jsearch\");\n  //\
    \ For Android apps.\n  using (StreamReader sr = new StreamReader (Assets.Open(\"\
    SqlStatements.txt\"))){ \n    // For iOS apps.\n    using (StreamReader sr = new\
    \ StreamReader (\"sqlProperties/SqlStatements.txt\")){\n    ProcessSQLStatements.Parse\
    \ (sr);\n  }\n  SxmInit.initialize ();\n  2 SxmConnection conn1 = new SxmConnection\
    \ (\"jsearch\");\n}\n```\n\nThe code snippet above initializes the database `jsearch`.\
    \ The database descriptor that is instantiated on line 1 uses the descriptors\
    \ default settings. This means that the error log is going to be named `jsearch`.\
    \ On line 2, a connection to the database is established. The connection, `conn1`,\
    \ is going to log all errors to `jsearch.log`. Now have a look at the code snippet\
    \ below.\n\n```csharp\nDatabaseDescriptor jsearchDD = null;\ntry {\n  1 jsearchDD\
    \ = DatabaseDescriptor.getDescriptor (\"jsearch\");\n  if ( jsearchDD != null\
    \ ) {\n    2 jsearchDD.lockDescriptor();\n    3 jsearchDD.logfileName = \"jsearch-log1\"\
    ;\n    4 jsearchDD.logfileMaxSize = 1024 * 1024 * 5 ;\n    5 SxmConnection conn2\
    \ = new SxmConnection (\"jsearch\");\n  }\n} finally {\n  if ( jsearchDD != null\
    \ )\n  6 jsearchDD.unlockDescriptor();\n}\n```\n\nOn line 1, we get the descriptor\
    \ associated with the `jsearch` database we initialized. Then, on line 3, we change\
    \ the name of the log file to `jsearch-log1`. We also changed the maximum size\
    \ of the log file to 5 MB, this is done on line 4. On line 5, a connection to\
    \ the database is established. `conn2` is going to log all errors to `jsearch.log`.\
    \ These two connections, `conn1` and `conn2`, can be used simultaneously. Looking\
    \ at the code above, you will see we lock and unlock the descriptor on lines 2\
    \ and 6 respectively. This is to ensure that while we are creating the new connection\
    \ with modified settings, no thread will sneak in and make unexpected changes\
    \ to the descriptor. You won’t need to do this if you do all your work on a single\
    \ thread. Also, changing a descriptor for a particular connection is a bit unusual\
    \ anyway. You normally create a database descriptor and leave it alone. \n\nOnce\
    \ a connection object has been created, it can be used by an `SxmTransaction`.\
    \ Below is one of our examples modified so that the `SxmTransaction` is instantiated\
    \ with an `SxmConnection`.\n\n```csharp\nprivate void submitHandler(SxmConnection\
    \ sxmConnection) {\n  ArrayList parameterValues = new ArrayList();\n  string registrationPK\
    \ = Guid.NewGuid().ToString();\n  parameterValues.Add(registrationPK);\n  parameterValues.Add(FindViewById<EditText>(Resource.Id.coName).Text);\n\
    \  parameterValues.Add(FindViewById<EditText>(Resource.Id.coContact).Text);\n\
    \  parameterValues.Add(FindViewById<EditText>(Resource.Id.coEmail).Text);\n  parameterValues.Add(FindViewById<EditText>(Resource.Id.coPassword).Text);\n\
    \  using (SxmTransaction sxmTransaction = new SxmTransaction(sxmConnection)) {\n\
    \    InsertResponse ir = sxmTransaction.executeInsert(\"registerCompany\", parameterValues);\n\
    \    if (sxmTransaction.commitTransaction() != SQLiteErrorCode.Ok) {\n      throw\
    \ new SxmException(new ErrorMessage(\"Commit error.\", Defines.SxmErrorCode.userDefined));\n\
    \    }\n  }\n}\n```\n"
