    \  StartActivity(CoHomeActivity);\n    }\n}\n```\n\n* Line 1 sets the handler\
    \ for the submit button to `registrationSubmit`. This method takes care of posting\
    \ the `companyReg` portion of the registration to Hotriot. Remember, a registration\
    \ is saved to three tables, this method only posts to `companyReg`.\n* Line 2\
    \ instantiates a name value. This holds the company registration data that will\
    \ be saved to Hotriot.\n* On lines 3, the record’s `systemSynchID` is set. As\
