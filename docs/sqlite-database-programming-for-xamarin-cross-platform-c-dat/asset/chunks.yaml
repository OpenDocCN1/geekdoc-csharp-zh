  trans: '


    `SQLite.XM` 已经准备好可以配合 `HotRiot.com` 使用。重申一下，`HotRiot` 是一个为移动应用程序提供的托管服务端平台。它包含了上述列出的所有项目支持以及更多功能。`HotRiot
    C# Xamarin Xamarin API` 已内置在 `SQLite.XM` 中，因此在使用 `HotRiot` 使用 `SQLite.XM` 时，你不需要进行任何操作。当然，`SQLite.XM`
    不仅适用于 `HotRiot`，它的设计旨在与任何后端配合。我将在书的第三部分向你展示如何实现这一点。


    ### 服务端数据库

    我们需要一个服务端数据库来同步本地设备数据。这可以是传统的关系型数据库，也可以是 NoSQL 文档数据库。你可能想知道为什么我特别强调服务器数据存储应该是关系型数据库或
    NoSQL 文档数据库。原因很简单：`SQLite` 是传统的关系型数据库。与另一个关系型数据库或如 `MongoDB` 等 NoSQL 文档数据库同步将提供最好的设备到服务器之间的转换。虽然
    `SQLite.XM` 支持同步到任何后端，但如果服务器端数据库的数据模型与设备上的数据模型显著不同，将使同步变得困难。服务器上的模式（schema）与设备上的模式不同并不罕见，且
    `SQLite.XM` 完全支持同步到不同的模式。然而，当设备和服务器之间的基本数据模型相差得太远时，就很难执行合理且可行的转换。例如，作为一个一般原则，尝试将你的应用程序数据与键/值数据存储同步将是不理想的。当然，取决于你的应用程序的细节以及你在数据同步后打算用它做些什么，可能有许多合理的理由来打破这条规则。但这通常是不寻常的。


    `HotRiot` 包含了对 `MySQL` 和 `MongoDB` 的支持。


    问为什么在两个功能相似的情况下要包含两个服务端数据库选项是合理的。简短的回答是，这两个数据库各有优缺点。如果只支持关系型数据库或只支持 NoSQL 文档数据库，将把我们限制在可能并不合适的地方尝试解决方案。


    ### Xamarin

    `Xamarin` 是我们首选的跨平台开发框架。它允许我们使用大部分共享的 `C#` 代码创建原生的 Android、iOS 和 Windows 应用程序。`Xamarin`
    让你可以使用共享代码编写绝大部分非 UI 应用程序逻辑。平台特定层通常要小得多，通常涵盖用户界面代码。根据 `Xamarin` 的说法，使用 `Xamarin`
    编写的平均应用程序在三个开发平台上共享约 65% 到 70% 的应用代码。这大大减少了支持最流行的移动设备所需的编程工作。考虑到这些优势，`Xamarin`
    是创建跨平台持久层的自然选择。另一个选项是为我们希望支持的每个平台创建一个单独的数据层。这将需要为了支持 iOS、Android 和 Windows 而使用
    `Objective-C`、`Java` 和 `C#` 进行编码。使用一种语言创建单一的共享持久层，使我们能够专注于我们想要解决的问题，而必在平台相关问题上花费太多时间。


    这并不是一本旨在详细阐述 `Xamarin` 开发的书。关于这一点有其他很好的资源。我解释如何使用 `Xamarin` 仅达到创建我们数据持久层所需的程度。除此之外，`Xamarin`
    在很大程度上被忽略了。这让我们能够专注于我们的数据持久解决方案。你不需要成为一名 `Xamarin` 开发者也可以跟上学习。我们会解释足够的 `Xamarin`
    知识来带你通过。


    ### 我真的需要这一切吗？

    简短的回答是：可能需要。如果你正在开发一个 `OCA`（离线优先的应用程序），那么肯定需要。对于纯离线应用程序，你可能只需要本地数据库支持，并且取决于你构建的内容，你可能甚至都不需要。对于纯在线应用程序，你可能需要除了同步逻辑之外的整个技术栈。然而，这一切高度取决于你正在构建的内容。


    ### 理解 HotRiot 的所处位置

    我们将应用程序生成的本地数据同步到通过 `HotRiot` 提供的中央后端数据库。这个数据库可以用于各种用途，但真的需要从更广泛的角度来看。当你同步时，无论是同步到
    `HotRiot` 还是其他后端，你不仅仅是在同步到数据库，你实际上是在与一个为你的应用程序提供支持服务的服务端平台同步。


    如前所述，`HotRiot` 为移动应用程序提供云端服务端平台。`HotRiot` 包含了一套图形工具，用于为应用程序的服务端部分创建基础设施，使得创建表或集合、设计查询、设置权限、创建触发器等变得轻而易举。


    目前，我们选择后端服务器解决方案最有趣的一点是，所有的 `HotRiot` 账户都带有一个配置好的 SQL (`MySQL`) 和 NoSQL (`MongoDB`)
    数据库。这允许你选择最符合你需求的服务端数据存储类型。`HotRiot` 的另一个有趣特性是它可以使用你自己的 `MySQL` 或 `Mongo` 数据库来存储你的数据；而不是使用
    `HotRiot` 托管数据库服务器。稍后会详细介绍。


    ### 数据库设计考量

    本地设备上的数据库是 `SQLite`。这是一个传统的关系型数据库。从数据建模的角度来看，关系型数据库最有影响力的特征是它们对连接（joins）的支持。这一个特征比任何其他特征都决定了关系型数据库的基本结构。设备端数据库的设计应独立于同步本地数据的后端服务器数据库。但这带来了一个潜在的问题：如果我们希望使用
    `MongoDB` 或其他 NoSQL 数据库作为我们的后端数据存储，而不是关系型数据库，我们该如何处理大多数 NoSQL 数据库不支持连接这一事实？以及它们要求与本地数据库有根本不同的结构呢？


    遗憾的是，没有简单的答案，但这并不意味着问题无法解决。我们有利的因素之一是，与大型企业应用程序相比，移动应用程序的本地存储通常相对简单。虽然并非总是如此，但这种情况通常成立，并且有助于简化从关系模型到文档模型的转换。


    让我们花时间讨论一下 `MongoDB`、`MySQL` 和 `HotRiot`。


    在 `HotRiot` 中创建用于同步的后端数据库时，你可以选择使用 `MySQL` 或 `MongoDB` 作为底层存储引擎。`MySQL` 和 `MongoDB`
    都是非常强大的数据库，它们各自提供的特性可能使其中一个在任何特定情况下更合适。`HotRiot` 允许你同时使用 `Mongo` 和 `MySQL`，尽管我通常不建议这样做。虽然
    `HotRiot` 做了大量工作来平滑这些数据库之间的差异，让你拥有非常相似的用户体验，但它们终究是不同的数据库技术。因此，在同一个应用程序中混用它们通常是不被建议的。


    '
- fmt: '

    MySQL and Mongo are fundamentally different, one being a document store and the
    other using the traditional relational model. Even so, for the vast majority of
    mobile application, either one is fully capable of meeting design requirements.
    While there are many subtle and not so subtle differences between MySQL and Mongo,
    most of them are not significant to the point where they render one or the other
    unusable for most mobile apps. However, there are few significant differentiators
    that should carefully be considered when deciding which one to use. I highlight
    the ones I think are important, this list is surprisingly short.


    ### Transactions

    If your application requires transactions, then `MySQL` is realistically your
    only choice. This is a true requirement less often than you might think. However,
    for money transfers and some other complex operations, transactions can be indispensable.


    ### Joins

    If you think your data model can benefit from joins, then `MySQL` is your better
    choice. `Mongo` does not support joins and performing them in your code is not
    recommended. Do not attempt to do the job of the database, instead, select right
    database. I know that joins have fallen out of favor lately, especially with the
    rise in popularity of NoSQL databases. I will tell you without hesitation, I really
    like the capabilities that joins bring to the table, especially the flexibility
    in data modeling that joins permit. The problem with joins is in how they are
    used, not with joins themselves. When used correctly, joins are performant and
    flexible.


    ### Scalability

    If you’re expecting to generate huge amounts of data that needs to be part of
    the apps transactional data set, then `Mongo` may be your better choice. `Mongo`
    is designed from the ground up to support horizontal scaling. If you expect your
    data set to grow beyond what can be supported by a single database server, then
    `Mongo` could have some features that tip in its favor. But this is not the usual
    case. I know that it is popular these days to talk of supporting “Web scale,”
    but when looked at objectively, only a very small percentage of apps require anything
    near this level of scalability. You would be amazed at what a single, powerful
    database server can handle. For example, I have a good friend that is part owner
    of one of the more popular dating sites on the net. At any one time, his site
    can have tens of thousands of users online. Even with a site this large, his database
    hovers around 80 GB, not including file attachments, which are stored outside
    the database. Now, he doesn’t allow junk to accumulate in his database, otherwise
    it would grow to an unmanageable size. So he regularly culls the data in order
    to keep the working set down. This is smart. There is no point in keeping garbage
    in your transactional datastore; either delete it or move it to offline storage.
    His site uses `MySQL` hosted on `AWS`.


    Here is my advice: Use a relational database such as `MySQL` unless you have a
    specific, articulable reason for using `Mongo` or some other NoSQL solution. For
    example, if you expect to need horizontal scaling. Traditional relational databases
    are unmatched in their power and flexibility.


    ## Designing for SQLite


    Okay, let us get back to discussing how to design your local database. I will
    show you how to do a design that can be used for synching to either a traditional
    SQL database or a NoSQL database.


    Any application of significance is going to require a database design that is
    composed of multiple tables. Remember, were designing for the device, which uses
    a traditional SQL database. The information in different tables is usually related
    in some way and needs to be linked in order to effectively process the data produced
    and consumed by your application. The term relational, the way it is being used
    here, refers to the fact that the information between tables is connected in some
    way. The data in one record can be used to find additional related information
    in other records that exist in other tables. This is usually done using key fields.
    This allows you to create complex interrelationships between tables that can be
    used to accommodate a wide variety of requirements.


    ### Primary keys and foreign keys


    Before we go any further, we need to explain the concept of primary keys and foreign
    keys. A primary key is a field which uniquely identifies a record in a table.
    A foreign key is a field which identifies a record in some other table. A foreign
    key field contains the primary key value of the record it references in the "foreign"
    table, thus providing a direct link to the record. A table can have multiple foreign
    keys but only one primary key.


    For example, consider the two tables below:


    * Registration Table

    * Job Posting Table


    Both the Registration and Job Posting tables contain primary key fields. In this
    example, the primary keys are named `Registration PK` and `Job Posting PK`. I
    like to use a naming convention where I append `PK` to a primary key field name.
    This makes it easy to identify the field. The job posting table also contains
    a foreign key named `Registration FK`. As with primary key fields, I like to append
    `FK` to the name of a foreign key field. This field is the key that connects the
    records in each table. A record in the registration table can be used to find
    all jobs posted by a company by searching the job posting table on the `Registration
    FK` field. Conversely, you can locate the registration profile associated with
    a job record by searching the registration table on the `Registration PK` field.


    Let''s have a look at the internals of what these two tables look like:


    ![](Image00018.jpg)


    As you can see in the tables above, the values in the `Registration FK` column
    of the job postings database correspond to the `Registration PK` values in the
    registration table. This primary key / foreign key relationship provides a bi-directional
    link between the records in the two tables, allowing a lookup of one from the
    other.


    We don''t want to get too far ahead of ourselves. The purpose here is to get you
    to consider ways in which you can structure your tables, and how you can use primary
    keys and foreign keys to establish relationships.


    ### Structuring your database


    There is no clear cut correct way to structure a database. However, there are
    some general guidelines you should consider. Let''s take a look at an example
    database for a simple job search app.


    In the illustration below, we have defined six tables that comprise the database
    for a simple job search application. Notice each table contains a primary key
    field, which is used to uniquely identify records. In addition, most of the tables
    also contain foreign keys, which are used to link records between the tables.
    For example, the Job Postings table contains the foreign key `Co Registration
    FK`. This can be used to easily locate all jobs posted by a particular company
    by simply searching the Job Postings table on this field. Alternatively, this
    can be used to look up the registration details of the company that posted the
    job by searching the company registration table on the `Co Registration PK` field.


    ![](Image00021.jpg)


    As you can see from this diagram, things can start to get complicated as you create
    more complex interrelationships. Therefore, you need to take time to properly
    plan things out. Nonetheless, linking tables through primary key/foreign key relationships
    allows you to create sophisticated and flexible designs with relative ease.


    At this point, do not concern yourself with the mechanics of how you are going
    to create the tables. Right now, just think about the database structure in a
    broad sense. On paper, write out the name of each table and the information it
    will store. Try to follow our example above — identify the tables you will need,
    and include a couple of the fields they will contain. Follow the general guidelines
    below.

    '
