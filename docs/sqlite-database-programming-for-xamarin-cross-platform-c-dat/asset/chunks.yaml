    - 在 HotRiot 中定义的表中，创建在相应的 SQLite 表中不存在的字段是完全可以的。

    - 每一个复制表都必须包含一个名为 `systemSynchID` 的字段。该字段必须定义为 `Text` 类型，长度为 50。

    - 将你在 HotRiot 中定义的字段的数据类型设置为与 SQL 语句属性文件中定义的对应字段的数据类型相匹配。这非常重要。HotRiot 会对所有输入数据进行数据验证，并拒绝不匹配的数据。例如，如果你将一个字段设为数字类型并尝试插入文本，HotRiot
    将拒绝该插入。


    下面是 HotRiot `Create Database`（创建数据库）向导第 3 步的截图。在这里，你定义表字段以及数据类型和字段大小。如果你遵循了我之前的建议，所有的
    SQLite 表都包含一个主键，且该键是一个填充了 GUID 的文本字段。在 HotRiot 中，GUID 仅仅是最小大小为 40 的文本字段。你还会看到该表包含了所需的
    `systemSynchID` 字段。


    你还会注意到 `email` 字段的数据类型被设置为 `Email Address`。对于此表，HotRiot 验证器将拒绝任何 `email` 字段值不是有效电子邮件地址的插入操作。SQLite
    并没有电子邮件地址数据类型；据我所知，没有哪个数据库拥有这种类型。在 SQLite 中，电子邮件地址仅仅是一个文本字段。执行所需的数据验证是应用程序的责任。HotRiot
    拥有许多 SQLite 中不具备的数据类型选项，例如电话号码、邮政编码和年份；仅列举几个。在插入或更新记录时，HotRiot 会对所有输入数据进行验证。任何不匹配都会导致插入/更新被拒绝。在开发应用程序时，记住这一点非常重要。事实是，你应该始终对应用处理的数据进行验证。这有助于确保数据的完整性。然而，在与
    HotRiot 同步时，这是强制性的。


    ![](img/Image00034.jpg)


    与 HotRiot 同步时还有另一个强制性设置。`systemSynchID` 字段必须设置为 `Edit Key`（编辑键），这在 `Create Database`
    向导的第 5 步中完成。下面是该步骤的部分截图。首先，将 `systemSynchID` 字段的特殊属性设置为 `Value must be unique`（值必须唯一）。会出现一个名为
    `Edit Key` 的复选框；勾选该框。


    ![](img/Image00026.jpg)


    一旦创建了同步所需的所有表，你就可以准备在 SQLite.XM 中激活同步过程了。


    ### 在 SQLite.XM 中激活同步


    之前，我向你展示了如何使用下面的方法调用初始化 SQLite.XM 库。


    ```

    SxmInit.initialize();

    ```


    当以此方式初始化库时，同步处于未激活状态。这意味着 SQLite.XM 库不会尝试执行数据同步。为了激活到你的 HotRiot 账户的同步，你需要进行如下初始化。


    ```

    SxmInit.initialize("YOUR HotRiot APPLICATION NAME");

    this.StartService(new Intent(this, typeof(SynchronizeService))); // 仅限 Android。

    ```


    将 `YOUR HotRiot APPLICATION NAME` 替换为你注册 HotRiot 时输入的应用程序名称。你可以通过选择 HotRiot `Main
    Console`（主控制台）页面上的编辑注册图标来查询应用程序名称。


    ### 同步详情


    当 SQLite.XM 启动时，它会立即检查复制日志是否存在任何条目。日志中的任何记录都会在可能的情况下立即同步。如果同步成功且所有待处理记录都已同步，同步将进入等待状态，等待事件通知。每当插入、更新或删除需要同步的记录时，就会触发通知。该通知会立即触发同步过程，对待处理的记录或记录进行同步。一切按计划进行时情况就是这样。


    当然，事情并非总是如计划进行，错误是在预料之中的。同步遇到的错误分为两类：


    - 可恢复的 (Recoverable)

    - 不可恢复的 (Non-recoverable)


    虽然这看起来足够简单，但仍有一些你需要注意的细节。可恢复错误是同步过程中遇到的、阻止了复制成功处理但预计可以自我纠正的错误。这类错误会导致同步暂停短持续时间，期间希望错误状况能够消除。暂停后，同步将再次尝试执行复制。如果错误持续存在，同步将再次暂停。它将执行此循环，直到成功同步或应用程序关闭。如果应用程序被终止，SQLite.XM
    将在下次启动时尝试同步所有待处理记录。可恢复错误的示例包括：


    - Web 异常 (Web exceptions)

    - IO 异常 (IO exceptions)

    - 内存溢出异常 (Out of memory exceptions)

    - 意外异常 (Unexpected exceptions)


    不可恢复错误正如其名所示，是一种阻止同步处理且几乎或没有机会自我纠正的错误。当 SQLite.XM 遇到此类错误时，它会移除触发该错误的同步日志条目，然后继续处理日志中的下一条记录。与被删除的日志条目相关的违规记录不会被同步。不可恢复错误的示例包括：


    - HotRiot 中的验证错误。例如，你在 HotRiot 中定义一个字段期望为数字，但正在同步的记录中的对应字段包含文本。在这种情况下，HotRiot
    验证器将始终拒绝该记录的插入/更新。同步别无选择只能跳过该记录。还会发生其他类型的验证错误。例如，如果你在 HotRiot 中定义一个字段为 `required`（必填），但正在同步的记录中该字段缺失或为空。


    这类验证错误是不可恢复错误的主要来源。幸运的是，通过在在应用程序中包含验证代码，可以很容易避免它们。


