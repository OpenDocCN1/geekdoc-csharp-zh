  trans: "\n*   每个表应该只存储相关信息。例如，在 `Company Registration`（公司注册）表中包含职位招聘信息将是一个错误。更好的做法是简单创建另一个表来存放职位招聘信息，然后使用键字段将这两个表链接起来。\n\
    *   在你创建的每个表中都包含一个主键字段，即使你认为它永远不会被使用。你几乎不应该违反这条规则。宁可有主键而不用，也不要需要主键而没有。\n*   当两个表中的记录相关联时，请使用主键/外键关系将它们链接起来。这是构建关系型数据库的基础。有时，一个表会链接到多个其他表，如上方的“Job\
    \ Seeker Favorites”（求职者收藏）。如你所示，此表中的记录包含了三个外键，分别链接到三个表中的记录，包括：\n    *   求职者注册表（Job\
    \ Seeker Registration Table）\n    *   公司注册表（Company Registration Table）\n    *\
    \   职位招聘表（Job Postings Table）\n\n当你以此方式链接相关表时，你极大地增强了创建搜索以定位相关记录的能力。例如，求职者收藏表中的\
    \ `Co Registration FK` 字段可以用于创建搜索，以定位发布该职位的注册信息。同样，`Job Posting FK` 链接可以用于创建搜索，以定位完整的职位列表。这就是使用链接键字段背后的真正力量。\n\
    \n让我们仔细看看上述描述的三个基本原则。\n\n### 定义字段\n\n一旦你确定了应用程序所需的表，下一步就是决定每个表将存储哪些特定信息。这应该是相当容易的。例如，如果你的应用包含一个注册表，你必须决定想在注册过程中收集哪些信息。这些可以是你想要的任何。然而，在定义你的表字段时，请考虑以下三条指南：\n\
    *   只包含你真正需要的字段。你不希望在表中携带无用信息；它们只会导致系统变得缓慢。如果你在初始设计中漏掉了一些字段，请不要担心。你可以随时返回并添加它们。\n\
    *   每个表应该只存储相关信息。我们之前提到过这一点，但它值得重申一遍。\n*   注册表代表了一种特殊情况——这些表通常包含电子邮件地址字段和密码字段。这些字段共同代表了用户的登录凭据。你可以根据情况使用其他字段组合，只要它们组合后是唯一的即可。通常，具有注册功能的应用程序也会包含登录功能；这允许注册用户返回应用程序。你可以通过任何方式设置注册，但这是实现此操作的一种典型方法。\n\
    \n### 包含主键\n\n几乎公认的是，在所有表中包含主键字段是良好的数据库设计，即使你不确定自己是否会使用该键。经验表明，主键在大多数应用程序中都会广泛使用，特别是那些包含注册功能的程序。而且创建主键非常简单！这里的规则是：宁可有主键而不用，也不要需要主键而没有。\n\
    \n### 链接表\n\n链接相关表的能力是你正确设计数据库并包含键字段后获得的回报。让我们回到职位搜索的示例，帮助我们理解表是如何链接的。下面是我们之前介绍的职位搜索数据库的副本。\n\
    \n![](img/Image00021.jpg)\n\n这是一个虚拟职位搜索应用程序的数据库。该网站允许注册的公司在 `job postings` 数据库中发布职位列表。已注册的求职者可以搜索\
    \ `job postings` 表。当他们找到感兴趣的职位时，他们可以在 `job seeker favorites` 表中保存该职位的记录。这让他们能够轻松地返回并找到之前感兴趣的所有职位。求职者还可以通过\
    \ `company email` 数据库向公司发送电子邮件。如果我们没有创建链接这些相关表的主键和外键，这种功能的实现将非常困难，甚至无法实现。\n\n\
    让我们一步一步地看看我们是如何链接这些表的。从公司注册表开始。此表包含一个名为 `Co Registration PK` 的主键，该主键在公司在我们的应用程序上注册时自动创建。在某个时刻，一个已注册的公司将向\
    \ `Job Postings` 表发布职位。自然地，我们希望将他们注册时的主键值作为外键包含在职位发布记录中。与数据库设计原则 #2 一致，我们的职位发布表还包含一个名为\
    \ `Job Postings PK` 的主键字段。\n\n现在让我们看看求职者是如何与我们的网站交互的。求职者在搜索 `job postings` 表之前必须先注册。自然地，我们的注册表包含一个主键。该键存储在\
    \ `JS Registration PK` 字段中。一旦求职者提交了注册，他们就可以开始搜索 `job postings` 表。我们应用程序的功能之一是，我们允许求职者维护他们收藏职位的记录。\n\
    \n如你上图所示，求职者收藏表包含三个外键字段：\n*   `JS Registration FK`\n*   `Co Registration FK`\n\
    *   `Job Postings FK`\n\n这些外键引用它们各自表中的记录，这创建了 `Job Seeker Favorites` 表记录与三个外键表记录之间的链接。\n\
    \n### 搜索关系型数据库\n\n我们稍后会详细介绍这一点，但让我们简单提一下。良好的数据库设计带来的另一个好处是搜索的灵活性。图中设计的关键特性在于，它包含了将相关表链接在一起的键字段。这极大地增强了你创建二级搜索以定位相关记录的能力。例如，`Job\
    \ Seeker Favorites` 表中的 `Co Registration FK` 字段可以用于创建搜索，以定位发布该职位的注册信息。同样，`Job\
    \ Posting FK` 键可以用于创建搜索，以从职位发布表中定位完整的职位列表。除了可维护性之外，这是良好设计的真正力量。\n\n另一种选择是使用更高级的连接（join）技术进行搜索。连接可以被视为多表或多数据库搜索。它允许你执行包含来自两个或多个表（包括不同数据库中的表）记录数据的搜索。这将在稍后详细介绍。更多信息，请参阅章节\
    \ `跨数据库执行连接`。\n\n### 为 Mongo 同步设计\n\n"
- fmt: '

    Earlier, I said I was going to show you how to design a local database schema
    for the device which would work well even if you intend to synch with a NoSQL
    datastore on the back-end. Well, if you look at the database we designed for our
    example job posting application, what you see is a VERY traditional relational
    schema. Even our design guidelines are really targeted towards a traditional relational
    database model. This is all just fine when synching with a relational database
    but what about when synching to a NoSQL datastore, what gives?


    It turns out that trying to create a schema that will work for both a traditional
    relational database and a NoSQL database is a fool’s folly. You will almost certainly
    end up with a design that works well with neither. The answer to this problem
    is to create a traditional relational design on the device and create a flattened,
    denormalized design on the `Mongo` back-end, performing the required translation
    in code when synching. However, in order for this to work, the device schema must
    be done right, especially with respect to creating primary keys and foreign keys.
    It is these keys that are used to perform the translation from the relational
    schema to a document schema. We cover this in detail later when we discuss synching.


    ## Suggestions for designing your SQL


    I have some thoughts and suggestions I would like to share with you regarding
    SQL for mobile apps.


    Generally speaking, the rules and principals that you follow in order to write
    good SQL for non-mobile apps also apply to mobile applications. So, there really
    isn’t a bunch of new stuff that needs to be learned. The major differentiator
    is the environment and context in which `SQLite` runs is quite different from
    a traditional database server. As a result, some well-known and accepted rules
    are less applicable when using `SQLite` in a mobile environment. `SQLite` is a
    server-less database that runs in the address space of the application, or, at
    the very least, on the same CPU. Either way, the affect is the same.


    There are different schools of thought over whether to use fewer complex queries
    as opposed to more simple queries in order to accomplish a given task. I have
    heard compelling arguments to support both. And to be perfectly candid, I’m not
    really sure that I have formulated a strong opinion of my own on this. Although,
    I seem to gravitate towards writing simpler queries. In any case, when writing
    SQL for `SQLite` on mobile, I believe that as a general rule, simpler queries
    are better. Let me explain why.


    There are four primary reasons for writing complex SQL, including stored procedures:


    *   Stored procedures are often written in order to centralize business logic.
    Due to their very nature, these queries tend to be complex. While there is nothing
    that requires a stored procedure to be complex, they nonetheless encourage complexity
    due to the flexibility they provide.

    *   Writing complex SQL, including stored procedures, allows some processing to
    be offloaded to the database server. Sharing load in this way can provide performance
    benefits.

    *   Fewer complex queries can significantly reduce the number of over-the-wire
    trips that need to be made to the database. Network traffic is often times more
    of a performance bottleneck that processing power.

    *   A single complex SQL statement is found to be more efficient than multiple
    simple statements.


    None of these, except the last one, apply to `SQLite` in a mobile environment.
    There are no stored procedures, no offloading of processing to a separate server,
    and no over-the-wire network communication between the app and the database. Gains
    offered by the first three are largely nullified by the context in which `SQLite`
    runs.


    Simple right? Well, as is usually the case with software engineering, nothing
    is that simple. While it is true that the first three reasons don’t really apply
    to `SQLite`, it is possible that the fourth might be more or less applicable than
    usual. Simpler queries might be more appropriate for apps that are multithreaded
    and requires concurrent database access; for more details, see the section ‘Locking
    and concurrency.’ Also, because there is no over-the-wire traffic generated by
    `SQLite`, the normal issues associated with higher velocity database workloads,
    such as network latency and traffic bottlenecks, don’t exist. If your apps read
    load is much higher than its write load, you might choose fewer complex queries,
    even if your database access is highly concurrent. The reason for this is reads
    execute with the highest level of concurrency in `SQLite`. I realize that this
    just muddies the waters, so I am going to give you a concrete recommendation.


    If you have the choice to use a single complex query or multiple simple queries,
    and don’t want to go through the work of performance profiling, go with multiple
    simple queries.


    ## Storing dates and times in SQLite


    “`SQLite` does not have a storage class set aside for storing dates and/or times.“
    That sentence was copied directly from the `SQLite` documentation. In `SQLite`,
    dates and times are stored in the following formats:


    *   `TEXT` as ISO8601 strings (`"YYYY-MM-DD HH:MM:SS.SSS"`).

    *   `INTEGER` as Unix Time, the number of seconds since 1970-01-01 00:00:00 UTC.

    *   `REAL` as Julian day numbers, the number of days since noon in Greenwich on
    November 24, 4714 B.C. according to the proleptic Gregorian calendar.


    You can then use the built in `SQLite` date and time functions to perform conversions.
    If you don’t need to synchronize the device database to a server-side datastore,
    then it really doesn’t matter which format you select. Just choose the one you
    are most comfortable working with in your app. Otherwise, it’s easiest to choose
    a format that will be readily accepted by the target replication server. For example,
    `SQLite.XM’` default replication synchronizes with `HotRiot`. `HotRiot` has a
    dedicated date and time data type that accepts a date/time in the ISO8601 format,
    so the text format would work just fine. This also has the advantage of storing
    the date/time on the server using an actual date/time field. `HotRiot` also includes
    both integer and real number data types, so using an integer or real for date/time
    would also be okay. Of course, you would need to perform a conversion in order
    to print the output in a human readable form.


    What if you want to use one format for storing dates/times on the device database
    and a different format for them on the server? This is not a problem, but it requires
    extra work on your part. Synchronization includes the ability for you modify record
    data before sending it up to the server. You could use this capability to convert
    from one format to another. This feature is known as pre-synchronization processing
    and is covered in detail in the section ‘Customizing synchronization’.


    ## Getting SQLite.XM


    `SQLite.XM` is available on GitHub, here is a direct link: `https://github.com/HotRiot/SQLite.XM-Xamarin`.
    Just include the `SQLite.XM` project into your solution. If you’re not sure how
    this is done, I go through an example in the next section.


    For creating iOS based applications, `SQLite.XM` requires `Xamarin iOS` 5.2 or
    later and an iOS version that supports multithreading. It is very unlikely that
    you wouldn’t meet these minimum requirements. You would have to indeed be working
    with an old version of Xamarin and testing with a very outdated version of iOS.


    ## Creating an application skeleton


    In this section I’ll explain how to create an application skeleton that includes
    `SQLite.XM`. If your comfortable doing this on your own, just skip ahead to the
    next section. The examples in the book do not depend on your having a project
    that exactly matches the one I create here. Just as long as you have some project
    with `SQLite.XM`, you’ll be fine.

    '
  raw: 'Earlier, I said I was going to show you how to design a local database schema
    for the device which would work well even if you intend to synch with a NoSQL
    datastore on the back-end. Well, if you look at the database we designed for our
    example job posting application, what you see is a VERY traditional relational
    schema. Even our design guidelines are really targeted towards a traditional relational
    database model. This is all just fine when synching with a relational database
    but what about when synching to a NoSQL datastore, what gives? It turns out that
    trying to create a schema that will work for both a traditional relational database
    and a NoSQL database is a fool’s folly. You will almost certainly end up with
    a design that works well with neither. The answer to this problem is to create
    a traditional relational design on the device and create a flattened, denormalized
    design on the Mongo back-end, performing the required translation in code when
    synching. However, in order for this to work, the device schema must be done right,
    especially with respect to creating primary keys and foreign keys. It is these
    keys that are used to perform the translation from the relational schema to a
    document schema. We cover this in detail later when we discuss synching.


    Suggestions for designing your SQL


    I have some thoughts and suggestions I would like to share with you regarding
    SQL for mobile apps.


    Generally speaking, the rules and principals that you follow in order to write
    good SQL for non-mobile apps also apply to mobile applications. So, there really
    isn’t a bunch of new stuff that needs to be learned. The major differentiator
    is the environment and context in which SQLite runs is quite different from a
    traditional database server. As a result, some well-known and accepted rules are
    less applicable when using SQLite in a mobile environment. SQLite is a server-less
    database that runs in the address space of the application, or, at the very least,
    on the same CPU. Either way, the affect is the same.


    There are different schools of thought over whether to use fewer complex queries
    as opposed to more simple queries in order to accomplish a given task.  I have
    heard compelling arguments to support both. And to be perfectly candid, I’m not
    really sure that I have formulated a strong opinion of my own on this. Although,
    I seem to gravitate towards writing simpler queries. In any case, when writing
    SQL for SQLite on mobile, I believe that as a general rule, simpler queries are
    better. Let me explain why.


    There are four primary reasons for writing complex SQL, including stored procedures.


    *   Stored procedures are often written in order to centralize business logic.
    Due to their very nature, these queries tend to be complex. While there is nothing
    that requires a stored procedure to be complex, they nonetheless encourage complexity
    due to the flexibility they provide.


    *   Writing complex SQL, including stored procedures, allows some processing to
    be offloaded to the database server. Sharing load in this way can provide performance
    benefits.


    *   Fewer complex queries can significantly reduce the number of over-the-wire
    trips that need to be made to the database. Network traffic is often times more
    of a performance bottleneck that processing power.


    *   A single complex SQL statement is found to be more efficient than multiple
    simple statements.


    None of these, except the last one, apply to SQLite in a mobile environment. There
    are no stored procedures, no offloading of processing to a separate server, and
    no over-the-wire network communication between the app and the database. Gains
    offered by the first three are largely nullified by the context in which SQLite
    runs.


    Simple right? Well, as is usually the case with software engineering, nothing
    is that simple. While it is true that the first three reasons don’t really apply
    to SQLite, it is possible that the fourth might be more or less applicable than
    usual. Simpler queries might be more appropriate for apps that are multithreaded
    and requires concurrent database access; for more details, see the section ‘Locking
    and concurrency.’ Also, because there is no over-the-wire traffic generated by
    SQLite, the normal issues associated with higher velocity database workloads,
    such as network latency and traffic bottlenecks, don’t exist. If your apps read
    load is much higher than its write load, you might choose fewer complex queries,
    even if your database access is highly concurrent. The reason for this is reads
    execute with the highest level of concurrency in SQLite. I realize that this just
    muddies the waters, so I am going to give you a concrete recommendation.


    If you have the choice to use a single complex query or multiple simple queries,
    and don’t want to go through the work of performance profiling, go with multiple
    simple queries.


    **Storing dates and times in SQLite**


    “SQLite does not have a storage class set aside for storing dates and/or times.“
    That sentence was copied directly from the SQLite documentation. In SQLite, dates
    and times are stored in the following formats.


    *   **TEXT** as ISO8601 strings ("YYYY-MM-DD HH:MM:SS.SSS").


    *   **INTEGER** as Unix Time, the number of seconds since 1970-01-01 00:00:00
    UTC.


    *   **REAL** as Julian day numbers, the number of days since noon in Greenwich
    on November 24, 4714 B.C. according to the proleptic Gregorian calendar.


    You can then use the built in SQLite date and time functions to perform conversions.
    If you don’t need to synchronize the device database to a server-side datastore,
    then it really doesn’t matter which format you select. Just choose the one you
    are most comfortable working with in your app. Otherwise, it’s easiest to choose
    a format that will be readily accepted by the target replication server. For example,
    SQLite.XM’s default replication synchronizes with HotRiot. HotRiot has a dedicated
    date and time data type that accepts a date/time in the ISO8601format, so the
    text format would work just fine. This also has the advantage of storing the date/time
    on the server using an actual date/time field. HotRiot also includes both integer
    and real number data types, so using an integer or real for date/time would also
    be okay. Of course, you would need to perform a conversion in order to print the
    output in a human readable form.


    What if you want to use one format for storing dates/times on the device database
    and a different format for storing them on the server? This is not a problem,
    but it requires extra work on your part. Synchronization includes the ability
    for you modify record data before sending it up to the server. You could use this
    capability to convert from one format to another. This feature is known as pre-synchronization
    processing and is covered in detail in the section ‘Customizing synchronization’.


    Getting SQLite.XM


    SQLite.XM is available on GitHub, here is a direct link: [https://github.com/HotRiot/SQLite.XM-Xamarin](https://github.com/HotRiot/SQLite.XM-Xamarin)
    . Just include the SQLite.XM project into your solution. If you’re not sure how
    this is done, I go through an example in the next section.


    For creating iOS based applications, SQLite.XM requires Xamarin iOS 5.2 or later
    and an iOS version that supports multithreading. It is very unlikely that you
    wouldn’t meet these minimum requirements. You would have to indeed be working
    with an old version of Xamarin and testing with a very outdated version of iOS.


    Creating an application skeleton


    In this section I’ll explain how to create an application skeleton that includes
    SQLite.XM. If your comfortable doing this on your own, just skip ahead to the
    next section. The examples in the book do not depend on your having a project
    that exactly matches the one I create here. Just as long as you have some project
    with SQLite.XM, you’ll be fine.'
