  trans: "\n规则非常简单，但某些操作细节通过示例展示会更清楚；请参见下文。这段代码稍显刻意，但其目的是以易于理解的方式解释并发性。我没有创建一个可能较难理解的多线程示例，而是选择了嵌套事务。对于我们的目的而言，效果是一样的。对于此示例，假设在应用程序的任何地方都不存在其他的\
    \ `SxmTransaction` 对象。\n\n```java\npublic ArrayList deleteRegistration (int deleteRegPK)\n\
    {\n  ArrayList regList = null;\n  1 using (SxmTransaction sxmTransactionSearch\
    \ = new SxmTransaction (\"jsearch])){\n    2 sxmTransactionSearch.executeQuery\
    \ (\"getAllCompanies\", null);\n    3 deleteRegistration (deleteRegPK);\n    while\
    \ ((company = sxmTransactionSearch.getNextRow()) != null)\n    {\n      if (company\
    \ [\"name\"].Equals(\"\") == true)\n      {\n        4 deleteRegistration (company.companyPK);\n\
    \        5 regList = searchRegistrations ();\n      }\n    }\n    6 deleteRegistration\
    \ (deleteRegPK);\n  }\n  return regList;\n}\n\npublic void deleteRegistration\
    \ (int companyPK)\n{\n  ArrayList paramVaues = new ArrayList();\n  paramVaues.Add(companyPK);\n\
    \  using (SxmTransaction sxmTransactionDelete = new SxmTransaction (\"jsearch])){\n\
    \    7 sxmTransactionDelete.executeDelete (\"deleteCompanyReg\", paramVaues);\n\
    \    8 sxmTransactionDelete.commitTransaction ();\n  }\n}\n\npublic ArrayList\
    \ searchRegistrations ()\n{\n  using (SxmTransaction sxmTransactionSearch = new\
    \ SxmTransaction (\"jsearch])){\n    9 sxmTransactionSearch.executeQuery (\"getAllCompanies\"\
    , null);\n    10 List <Hashtable> searchResults = sxmTransactionSearch.getAllRows\
    \ ();\n  }\n  return searchResults;\n}\n```\n\n`deleteRegistration` 方法做了两件事：它删除与传入的主键关联的注册记录，并尝试删除公司注册表中“name”字段为空的任何注册。在进入此方法时，`jsearch`\
    \ 数据库锁状态如下：\n\nLocks: NONE\n\n在第 1 行，了一个新的 `SxmTransaction` 对象。在第 2 行，新创建的事务对象执行了一个查询以定位公司注册表中的所有注册。该查询的\
    \ select 语句在 SQL 语句属性文件中的形式如下所示：\n\n`[getAllCompanies] [SELECT * FROM companyReg]`\n\
    \n`executeQuery` 调用成功获取了数据库的读锁。现在的数据库锁状态如下：\n\nLocks: READ\n\n在第 3 行，调用了 `deleteRegistration`\
    \ 方法。如果你查看此方法，会发现它尝试删除与传入的主键关联的记录。在第 7 行，调用了 `executeDelete`。该删除操作的 SQL 语句在 SQL\
    \ 语句属性文件中的形式如下所示：*\n\n`[deleteCompanyReg] [DELETE FROM companyReg WHERE companyPK\
    \ = ?]`\n\n`executeDelete` 调用成功获取了预留锁（reserved lock）。现在的数据库锁状态如下：\n\nLocks: READ,\
    \ RESERVED\n\n在第 8 行，调用了 `commitTransaction`，它将尝试提交在第 7 行执行的删除操作。遗憾的是，此调用将由于超时而失败，因为它无法获取排他锁（exclusive\
    \ lock），因为读锁尚未释放；读取操作仍然处于激活。这里发生的情况是，事务尝试将其当前持有的预留锁转换为排他锁，但当前活跃的读锁导致提交阻塞直到超时。当退出\
    \ `using` 块时，`SQLite.XM` 将作为清理的一部分回滚事务；此事务对象持有的预留锁作为清理的一部分被释放。现在的数据库锁状态如下：\n\n\
    Locks: READ\n\n在第 4 行，在遍历第 2 行搜索返回的结果的循环中，调用了 `deleteRegistration`。此调用的失败与其在第\
    \ 3 行调用失败的原因相同。\n\n在第 5 行，调用了 `searchRegistrations`。如你所见，此方法对注册表进行搜索。在执行第 9 行的查询后，数据库锁状态将是：\n\
    \nLocks: READ, READ\n\n在第 10 行检索搜索结果后，数据库锁状态将如下：\n\nLocks: READ\n\n让我们停下来考虑一下刚刚发生了什么。`executeQuery`\
    \ 方法成功获取了读锁，而对 `getAllRows` 的调用释放了该锁。假设结果集不空；从执行 select 的点点开始，它将持有读锁，直到结果集被完全迭代，或者与\
    \ select 关联的 `SxmTransaction` 对象被 `using` 语句清理。这一点对于充分理解非常重要。长时间的 select 或未能快速完全遍历结果集，将阻塞其他连接获取排他锁。如果结果集是空的，则不会获取读锁。\n\
    \n在第 6 行，再次调用了 `deleteRegistration` 方法。然而，与我们之前的尝试不同，这次将成功。当进行此调用时，数据库锁状态如下：\n\
    \nLocks: NONE\n\n尽管连接仍然处于激活状态，但在到达第 6 行时，第 2 行查询获取的读锁已经被释放。这是因为搜索结果已经完全迭代完毕。第\
    \ 7 行的 `executeDelete` 调用将成功获取预留锁。在第 8 行进行的 `commitTransaction` 调用将快速获取排他锁，并在事务提交后立即释放锁。从第\
    \ 6 行返回时，数据库锁状态如下：\n\nLocks: NONE\n\n有一些需要考虑的情况。例如，如果数据库更新操作由于阻塞等待预留锁而超时，则会抛出异常。如果在提交时无法获取排他锁且提交超时，则不会抛出异常；在这种情况下，将返回\
    \ `SQLiteErrorCode`。详情请参阅“提交事务”和“处理错误”章节。注意长时间运行的 select 查询以及未快速迭代的结果集；它们都会阻塞排他锁。\n\
    \n### 死锁条件\n\n考虑以下情况：两个连接正在从数据库读取数据，它们各持有一个共享锁。然后，在相同的时间，它们都尝试执行写入操作，这需要获取预留锁。从我们之前的讨论可知，任何时候只能有一个连接持有预留锁。因此，其中一个连接被分配了锁，而另一个则阻塞等待锁可用。现在，持有共享锁的连接想要提交它的写入操作。因此它尝试获取排他锁。然而，它无法获取排他锁，因为被阻塞的连接持有一个共享锁。我们现在处于死锁状态，每个连接都在等待另一个。被阻塞的连接在等待预留锁可用，而持有预留锁的连接在等待共享锁释放以便其获取排他锁。\n\
    \n"
- fmt: "\nThe question is, how does SQLite handle such a condition? SQLite doesn’t\
    \ allow deadlock condition to persist. The lock manager either grants a request\
    \ for a lock or returns an error without blocking the requester. Therefore, in\
    \ this example, the connection trying to acquire the reserved lock will eventually\
    \ return with a database lock error.\n\n### Nesting connections\n\nI don’t believe\
    \ nested connections are too prevalent or even all that useful in most circumstances.\
    \ Consequently, this wasn’t something I was initially intending to discuss. However,\
    \ using them to explain locking revealed an opportunity to present some additional\
    \ nesting examples that you might find interesting.\n\nIt is acceptable to nest\
    \ connections so long as you are careful about what you are doing. If you need\
    \ the results of one query as an input to another transaction object that is performing\
    \ an update, pull all of the results out of the result set first, do not try to\
    \ process them in-line with connection nesting. The reason for this depends upon\
    \ the specifics of your implementation, in-line processing may not work, as the\
    \ update may block trying to acquire an exclusive lock. Let’s take a look at four\
    \ different ways of doing this.\n\nThe update in the code fragment below will\
    \ fail because the `commitTransaction` method on line 3 times out trying to acquire\
    \ an exclusive lock. The reason for the timeout, is the `sxmTransactionSearch`\
    \ object is holding a read lock. Admittedly, even if this could work, it is a\
    \ rather inefficient way of doing this anyway. Let me explain why. Lines 1 through\
    \ 3 represent a single update transaction. Due to the way transactions are processed\
    \ by SQLite, they generally take two full rotations of a disk platter in order\
    \ to complete. So, for a disk spinning at 10,000 RPM, the theoretical write limit\
    \ is ~83 updates per second. Of course, the actual limit is somewhat less. Certainly,\
    \ there are also inefficiencies associated with creating and tearing down a connection\
    \ inside a loop, not good.\n\n```\nusing (SxmTransaction sxmTransactionSearch\
    \ = new SxmTransaction(\"jsearch\")){\n  sxmTransactionSearch.executeQuery(\"\
    getAllCompanies\", null);\n  ArrayList paramVaues = new ArrayList();\n  while\
    \ ((company = sxmTransactionSearch.getNextRow()) != null) {\n    if (company [\"\
    name\"].Equals(\"\") == true) {\n      paramVaues.Clear ();\n      paramVaues.Add(company\
    \ [\"companyPK\"]);\n      1 using (SxmTransaction sxmTransactionDelete = new\
    \ SxmTransaction(\"jsearch\")){\n      2 sxmTransactionDelete.executeDelete(\"\
    deleteCompanyReg\", paramVaues);\n      3 sxmTransactionDelete.commitTransaction\
    \ ();\n     }\n  }\n}\n```\n\nThe update operation in the code fragment below\
    \ will succeed. By the time we get to the `commitTransaction` call on line 1,\
    \ the read lock acquired by the `sxmTransactionSearch` object will have already\
    \ been disposed as a result of all rows in the result set having been processed.\
    \ From a database performance perspective, this is an efficient way of doing this.\n\
    \n```\nArrayList paramVaues = new ArrayList();\nusing (SxmTransaction sxmTransactionSearch\
    \ = new SxmTransaction(\"jsearch\"),\n  sxmTransactionDelete = new SxmTransaction(\"\
    jsearch\")){\n    sxmTransactionSearch.executeQuery(\"getAllCompanies\", null);\n\
    \    while ((company = sxmTransactionSearch.getNextRow()) != null) \n    if (company\
    \ [\"name\"].Equals(\"\") == true) {\n      paramVaues.Clear ();\n      paramVaues.Add(company\
    \ [\"companyPK\"]);\n      sxmTransactionDelete.executeDelete(\"deleteCompanyReg\"\
    , paramVaues);\n      }\n  1 sxmTransactionDelete.commitTransaction ();\n  }\n\
    ```\n\nThe update operation in the code fragment below will also succeed. The\
    \ records are first read from the result set and placed in a collection before\
    \ being processed by the `SxmTransactionDelete` object. The read lock is released\
    \ by the `getAllRows` method on line 1. Of course, the `sxmTransactionSearch`\
    \ object is cleaned up when it exits the `using` block. Either of these will dispose\
    \ of the read lock. If the result set is really huge, consider paginating the\
    \ search to break it down into manageable chunks. From a database performance\
    \ perspective, this is also an efficient way of doing this. In the example above,\
    \ we maintain two transaction objects at any time.\n\n```\nArrayList paramVaues\
    \ = new ArrayList();\nusing (SxmTransaction sxmTransactionSearch = new SxmTransaction(\"\
    jsearch\")){\n  sxmTransactionSearch.executeQuery(\"getAllCompanies\", null);\n\
    1 List<Hashtable> allRecords = sxmTransactionSearch.getAllRows ();\n2 using (SxmTransaction\
    \ sxmTransactionDelete = new SxmTransaction(\"jsearch\")){\n  foreach (Hashtable\
    \ company in allRecords) {\n    if (company [\"name\"].Equals(\"\") == true) {\n\
    \      paramVaues.Clear ();\n      paramVaues.Add(company [\"companyPK\"]);\n\
    \      sxmTransactionDelete.executeDelete(\"deleteCompanyReg\", paramVaues);\n\
    \    }\n  }\n  sxmTransactionDelete.commitTransaction ();\n }\n```\n\nNow for\
    \ our final example. I have shown you three ways of processing the output from\
    \ one transaction. One of these was a non-working solution. You might have looked\
    \ at the solution above and thought there is a better way, and you would be right.\
    \ Creating a second `SxmTransaction` object was unnecessary. When comparing the\
    \ examples, we are trading resource usage for result set.\n\n```\nArrayList paramVaues\
    \ = new ArrayList();\nusing (SxmTransaction sxmTransactionSearch = new SxmTransaction(\"\
    jsearch\")){\n  sxmTransactionSearch.executeQuery(\"getAllCompanies\", null);\n\
    \  while ((company = sxmTransactionSearch.getNextRow()) != null) \n    if (company\
    \ [\"name\"].Equals(\"\") == true) {\n      paramVaues.Clear ();\n      paramVaues.Add(company\
    \ [\"companyPK\"]);\n      sxmTransaction.executeDelete(\"deleteCompanyReg\",\
    \ paramVaues);\n    } \n```\n\nThe example above works just fine. However, the\
    \ slightly modified example below will fail. Actually, it won’t fail; it just\
    \ won’t do what you expect. The `executeDelete` statement will clear the transaction’s\
    \ data reader, which, in effect, clears the result set. This will cause the code\
    \ to exit from the while statement. As a result, the delete can only execute a\
    \ maximum of one time.\n\n```\nArrayList paramVaues = new ArrayList();\nusing\
    \ (SxmTransaction sxmTransaction = new SxmTransaction(\"jsearch\")){\n  sxmTransaction.executeQuery(\"\
    getAllCompanies\", null);\n  while ((company = sxmTransaction.getNextRow()) !=\
    \ null) \n    if (company [\"name\"].Equals(\"\") == true) {\n      paramVaues.Clear\
    \ ();\n      paramVaues.Add(company [\"companyPK\"]);\n      sxmTransaction.executeDelete(\"\
    deleteCompanyReg\", paramVaues);\n    }\n  sxmTransaction.commitTransaction ();\n\
    \ }\n```\n"
