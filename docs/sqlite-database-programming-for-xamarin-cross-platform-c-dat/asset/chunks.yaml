    ```

    InsertResponse ir = sxmTransaction.executeInsert("registerCompany", parameterValues);

    SQLiteErrorCode SqliteErrorCode = sxmTransaction.commitTransaction();

    }

    ```


    在上面的代码段中，我们正在 `using` 块内部构建参数值数组。这导致我们持有数据库资源的时间比实际需要的要长。**不要**将 `SxmTransaction`
    对象传递给其他线程。根据事务的状态，这可能会导致问题。


    `executeInsert` 方法会从 SQL 语句属性文件中查找与作为第一个参数传递的语句名称匹配的插入语句。在我们的示例中，它就是下面的条目：


    `INSERT INTO companyReg (companyRegPK, coName, hrContact, email, password) VALUES(?,
    ?, ?, ?, ?)`


    作为第二个参数传递的 `ArrayList` 中的值将替换 SQL 语句中的参数占位符。然后执行该语句。如果你一直在紧跟学习，可能在想，为什么插入定义必须包含被插入的表名称。作为一个回顾，SQL
    语句属性文件中插入定义的格式如下：


    `[statement name][table name][insert SQL statement]`


    语句名称和插入 SQL 语句（statement）的目的是显而易见的，但为什么需要表名呢？我之前提到过，用于同步记录的 ID 字段会被添加到表中。在执行插入后，会立即执行对记录的更新以添加同步后的
    ID。该更新代码会使用表名。虽然可以从插入语句中提取表名，但将其作为一个显式字段比解析语句字段更高效。


    ### 提交事务 (Committing transactions)


    `SxmTransaction` 对象执行真正的事务。也就是说，由 `SxmTransaction` 实例执行的所有修改数据库的 SQL 命令都通过 `commitTransaction`
    或 `rollbackTransaction` 方法原子地应用或丢弃。`commitTransaction` 返回一个 `SQLiteErrorCode`。如果提交成功，返回值为
    `SQLiteErrorCode.Ok`。任何其他返回值都表示 SQLite 引擎中发生了错误。SQLite 错误代码列表可以在附 A 中找到。在执行 `commitTransaction`
    期间遇到的其他错误将导致异常。在更改提交之前，数据库的修改对其他事务对象是不可见的。事务对象可以在提交之前看到其正在发生的自身更改。更多细节，请参阅“理解事务”和“事务可见性”章节。


    ### insertResponse 对象 (The insertResponse object)


    `executeInsert` 方法返回一个 `InsertResponse` 对象。


    ```

    InsertResponse ir = sxmTransaction.executeInsert("registerCompany", parameterValues);

    ```


    该对象包含新插入记录的自增 ID 和 `systemSynchID`。记住，`systemSynchID` 是一个系统管理的字段，会被添加到每个表中，并用于同步到云端。大多数情况下，这些值对你的应用程序代码并不并不重要。虽然自增
    ID 可以用来本地唯一标识记录，但这并不是一个好主意。ID 在不同设备之间是不唯一的，依赖它们会导致问题。使用 GUIDs 作为唯一标识符要好得多，我之前已经解释过这一点。记录
    ID 和同步 ID 都是带有 getter 的属性，可以轻松访问。


    ```

    string synchID = ir.SynchID;

    int recordID = ir.RecordID;

    ```


    如果记录 ID 为 -1 或同步 ID 为空，则插入过程中发生了问题，但没有导致抛出异常。这应该是一个非常罕见的情况。`systemSynchID` 是系统管理的字段，除非你有某些迫切的理由要这样做，否则最好留着它。


    ### 保存文件附件 (Saving file attachments)


    文件附件可以直接作为 BLOB 存储在数据库中，也可以作为外部文件存储并将指针存在数据库中。选择其中一种都有正当的理由。从实际角度来看，除非你打算存储大量文件，或者你预计文件相当大，否则选择哪种方案可能没有太大区别。


    根据 SQLite 文档：


    “对于小于 100KB 的 BLOB，将 BLOB 直接存储在数据库文件中时读取速度更快。对于大于 100KB 的 BLOB，从单独文件读取的速度更快。”


    但处理速度不应该是唯一的考虑因素，甚至不是首要考虑因素。我发现将文件存储在数据库之外更具灵活性。通常，很难预知项目随着时间的推移会走向什么方向。尝试预测未来的需求是愚蠢的。因此，当在灵活性与性能或便利性之间做出抉择时，我几乎总是选择更具灵活性的工程解决方案。例如，我写的一个应用程序最终有一个在不重复文件数据的情况下在记录之间共享文件数据的需求。这一特定需求在初始发布
    5 年后才出现。如果我们没有选择将附件存储为外部文件，实现这一点将非常困难。我曾做过另一个应用，它支持保存几乎无限数量的文件附件。最初，我们将文件存储在与数据库服务器分离专用服务器上。这是在
    AWS S3 和其他类似服务之前。当 S3 引入后，我们决定将所有文件从服务器移动到 S3 存储。在这种情况下，将文件存储在数据库之外简化了向 S3 的迁移。在这两种情况下，灵活性都帮了我们，因为需求以我们最初设计应用程序时无法预测到的方式发生了变化。


    存储在数据库内部允许文件附件自动参与事务，并使备份及某些其他数据库操作变得更简单。不要忘记，外部文件意味着每个记录都多了一项需要管理的项目。这会显著增加你的设计的复杂度；例如，你需要在应用程序中包含异常处理来处理同步失败，例如当记录删除成功但关联文件删除失败时。


    让我们深入探讨一下，看看我在说什么。假设你删除了一个包含外部文件附件的数据库记录，但当你尝试删除关联文件时，遇到了某种失败。现在你该怎么办？


    1. 通过回滚记录删除来确认失败。如果这是自动删除，则稍后重试，否则通知用户发生了错误，并让他们稍后再次尝试所选操作。

    2. 通过提交让记录删除完全执行。对文件进行某种标记，以便在以后某个日期进行自动删除。

    3. 通过提交让记录删除完全执行。忽略文件失败，直接遗留该文件。


    你只有在考虑了特定应用程序的细节后，才能做出“正确”的选择。尽管如此，这些选项都不是特别吸引人。最好的办法是从根源上防止问题的发生来解决它。而你可以通过将文件存储在数据库中来实现。


