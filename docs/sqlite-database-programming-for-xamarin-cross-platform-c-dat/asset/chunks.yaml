  trans: "\n问题是，SQLite 是如何处理这种情况的？SQLite 不允许死锁状态持续。锁管理器要么授予锁请求，要么返回错误而不阻塞请求者。因此，在这一用例中，尝试获取预留锁（reserved\
    \ lock）的连接最终将返回数据库锁错误。\n\n### 嵌套连接\n\n我不认为嵌套连接在大多数情况下过于常见，甚至并不一定有用用。因此，这并不是我最初打算讨论的话题。然而，利用嵌套连接来解释锁机制提供了一个机会，让我展示一些你可能觉得感兴趣的额外嵌套示例。\n\
    \n只要你对自己的所作之事表现得审慎，嵌套连接是完全可以接受的。如果你需要将一个查询的结果作为另一个正在执行更新的事务对象的输入，请先从结果集中提取出所有结果，不要尝试在连接嵌套的过程中进行内联处理。这样做的原因取决于你具体的实现细节，内联处理可能无效，因为更新操作可能会在尝试获取排占锁时阻塞。让我们来看四种实现这种方法。\n\
    \n下面代码段中的更新操作将失败，因为第 3 行的 `commitTransaction` 方法在尝试获取排占锁时超时。超时的原因是 `sxmTransactionSearch`\
    \ 对象持有一个读锁。诚然，即使这种方法可行，它也是一种效率很低做法。让我解释为什么：第 1 行到第 3 行代表一个的更新事务。由于 SQLite 处理事务的方式，它们通常需要磁盘盘完整旋转两圈才能完成。因此，对于转速为\
    \ 10,000 RPM 的磁盘，理论写入限制为每秒约 83 次更新。当然，实际限制会低一些。此外，在循环内部创建和销毁连接也存在效率低的问题，这并不好。\n\
    \n```\nusing (SxmTransaction sxmTransactionSearch = new SxmTransaction(\"jsearch\"\
    )){\n  sxmTransactionSearch.executeQuery(\"getAllCompanies\", null);\n  ArrayList\
    \ paramVaues = new ArrayList();\n  while ((company = sxmTransactionSearch.getNextRow())\
    \ != null) {\n    if (company [\"name\"].Equals(\"\") == true) {\n      paramVaues.Clear\
    \ ();\n      paramVaues.Add(company [\"companyPK\"]);\n      1 using (SxmTransaction\
    \ sxmTransactionDelete = new SxmTransaction(\"jsearch\")){\n      2 sxmTransactionDelete.executeDelete(\"\
    deleteCompanyReg\", paramVaues);\n      3 sxmTransactionDelete.commitTransaction\
    \ ();\n     }\n  }\n}\n```\n\n下面代码段中的更新操作将成功。当我们执行到第 1 行的 `commitTransaction`\
    \ 调用时，`sxmTransactionSearch` 对象获取的读锁已经因为结果集中所有行都处理完毕而被释放。从数据库性能的角度来看，这是执行此操作的高效方法。\n\
    \n```\nArrayList paramVaues = new ArrayList();\nusing (SxmTransaction sxmTransactionSearch\
    \ = new SxmTransaction(\"jsearch\"),\n  sxmTransactionDelete = new SxmTransaction(\"\
    jsearch\")){\n    sxmTransactionSearch.executeQuery(\"getAllCompanies\", null);\n\
    \    while ((company = sxmTransactionSearch.getNextRow()) != null) \n    if (company\
    \ [\"name\"].Equals(\"\") == true) {\n      paramVaues.Clear ();\n      paramVaues.Add(company\
    \ [\"companyPK\"]);\n      sxmTransactionDelete.executeDelete(\"deleteCompanyReg\"\
    , paramVaues);\n      }\n  1 sxmTransactionDelete.commitTransaction ();\n  }\n\
    ```\n\n下面代码段中的更新操作也将成功。记录首先从结果集中读取并放入集合中，然后由 `SxmTransactionDelete` 对象处理。读锁由第\
    \ 1 行的 `getAllRows` 方法释放。当然，`sxmTransactionSearch` 对象在退出 `using` 块时会被清理。这两种方法中的任何一种都会释放读锁。如果结果集巨大，请考虑分页搜索将其拆分为可管理的块。从数据库性能的角度来看，这也是一种高效的执行方法。在上面的示例中，我们任何时候都维护两个事务对象。\n\
    \n```\nArrayList paramVaues = new ArrayList();\nusing (SxmTransaction sxmTransactionSearch\
    \ = new SxmTransaction(\"jsearch\")){\n  sxmTransactionSearch.executeQuery(\"\
    getAllCompanies\", null);\n1 List<Hashtable> allRecords = sxmTransactionSearch.getAllRows\
    \ ();\n2 using (SxmTransaction sxmTransactionDelete = new SxmTransaction(\"jsearch\"\
    )){\n  foreach (Hashtable company in allRecords) {\n    if (company [\"name\"\
    ].Equals(\"\") == true) {\n      paramVaues.Clear ();\n      paramVaues.Add(company\
    \ [\"companyPK\"]);\n      sxmTransactionDelete.executeDelete(\"deleteCompanyReg\"\
    , paramVaues);\n    }\n  }\n  sxmTransactionDelete.commitTransaction ();\n }\n\
    ```\n\n现在来看我们的最后一个示例。我已经向你展示了三种处理一个事务输出结果的方法。其中一种是不可行的方案。你可能看了上面的方案并认为有更好的方法，你是对的。创建第二个\
    \ `SxmTransaction` 对象是没有必要的。在比较这些示例时，我们是在用资源消耗换取结果集。\n\n```\nArrayList paramVaues\
    \ = new ArrayList();\nusing (SxmTransaction sxmTransactionSearch = new SxmTransaction(\"\
    jsearch\")){\n  sxmTransactionSearch.executeQuery(\"getAllCompanies\", null);\n\
    \  while ((company = sxmTransactionSearch.getNextRow()) != null) \n    if (company\
    \ [\"name\"].Equals(\"\") == true) {\n      paramVaues.Clear ();\n      paramVaues.Add(company\
    \ [\"companyPK\"]);\n      sxmTransaction.executeDelete(\"deleteCompanyReg\",\
    \ paramVaues);\n    } \n```\n\n上面的示例运行良好。然而，下面这个稍微修改过的示例将会失败。实际上，它不会失败；只是不会按照你的预期工作。`executeDelete`\
    \ 语句将清除事务的数据读取器，这实际上清空了结果集。这将导致代码退出 `while` 语句。结果，删除操作最多执行一次。\n\n```\nArrayList\
    \ paramVaues = new ArrayList();\nusing (SxmTransaction sxmTransaction = new SxmTransaction(\"\
    jsearch\")){\n  sxmTransaction.executeQuery(\"getAllCompanies\", null);\n  while\
    \ ((company = sxmTransaction.getNextRow()) != null) \n    if (company [\"name\"\
    ].Equals(\"\") == true) {\n      paramVaues.Clear ();\n      paramVaues.Add(company\
    \ [\"companyPK\"]);\n      sxmTransaction.executeDelete(\"deleteCompanyReg\",\
    \ paramVaues);\n    }\n  sxmTransaction.commitTransaction ();\n }\n```\n"
- fmt: "\nThis probably needs some clarification. Executing a database update operation\
    \ using an `SxmTransaction` object with an active result set, will cause the data\
    \ reader for the result set to be closed so that the update can proceed. If the\
    \ data reader is not closed, the update operation, in this example a delete, will\
    \ fail with an `InvalidOperationException` ; ”Cannot set CommandText while data\
    \ reader is active.” A decision was made that it was better to close the data\
    \ reader and allow the update to proceed rather than to let the update fail. If\
    \ this does not work for your particular requirements, the workaround is very\
    \ simple.\n\n*   Either read the entire results set into a collection using the\
    \ `getAllRows` method and then iterate through the collection. We did this in\
    \ the second to last example above.\n*   Or, use a separate `SxmTransaction` for\
    \ performing the update.\n\nBelow is a list of operations that acquire locks.\n\
    \n*   `excuteInsert :` RESERVED\n*   `executeQuery :` READ\n*   `executeQueryDirect\
    \ :` READ\n*   `executeUpdate :` RESERVED\n*   `executeUpdateDirect :` RESERVED\n\
    *   `executeDelete :` RESERVED\n*   `executeDeleteDirect :` RESERVED\n*   `commitTransaction\
    \ :` EXCLUSIVE, then disposes all locks\n\n### Serializing transactions using\
    \ the SxmSTransaction class\n\nIn the last section, we explained how the lock\
    \ state of the database is affected by various operations and how the database\
    \ uses the lock state for managing concurrency. To reiterate, if your application\
    \ is guaranteed to only have a single transaction object active at any one time,\
    \ then issues associated with locking and concurrency can largely be ignored.\
    \ However, if your app performs database operations on multiple threads, then\
    \ concurrency is an issue that needs to be considered.\n\nIn the ‘Locking and\
    \ concurrency’ section, we nested transactions in order to artificially create\
    \ conditions that would cause blocking and, ultimately, some timeouts. This was\
    \ done, of course, to illustrate how locking and concurrency works. In an actual\
    \ application, you probably wouldn’t nest transactions. In all likelihood, an\
    \ app will be executing multiple transactions on different threads. So, how does\
    \ this difference affect locking and concurrency? It actually works to our favor.\
    \ When lock contention occurs, for example, when trying to acquire an exclusive\
    \ lock while there are active read locks, SQLite will block the thread trying\
    \ to acquire the lock for a period of time while waiting for the lock state to\
    \ change. If the lock state changes before the timeout period elapses, the blocked\
    \ operation will be allowed to proceed.\n\nGenerally speaking, SQLite provides\
    \ very good concurrency. Provided you’t hold on to locks for extended periods\
    \ of time, timeouts due to locking shouldn’t be a problem. However, timeouts are\
    \ the extreme condition; you really need to do better than simply not pass a timeout\
    \ threshold. You should strive to avoid any delays that are likely to annoy users.\
    \ So, how can we do this?\n\n*   The first rule for successful concurrent database\
    \ processing is to always strive to minimize the amount of time you spend in the\
    \ `using` block of an `SxmTransaction`. This is your best, first-line defense\
    \ against blocking. While it doesn’t eliminate blocking, it helps to reduce it.\
    \ The more concurrency you require, the more important this rule becomes.\n\n\
    For the majority of applications, it is more critical that database reads proceed\
    \ unhindered than writes. With the exception of certain operations such as registrations,\
    \ many write operations can be delayed. For example, when submitting a job posting\
    \ to a job search site, it’s probably okay if the actual post occurs sometime\
    \ in the future. What’s the difference whether a job posting appears in the jobs\
    \ database immediately or within a few seconds? What I am trying to get at, is\
    \ that in many instances it is perfectly fine to delay inserts. If you “meter”\
    \ inserts, you will effectively be freeing the database to process other commands.\
    \ One way to do this is to serialize all transactions that update the database;\
    \ processing them one at a time. And, as luck would have it, the SQLite.XM library\
    \ includes a class that performs transaction serialization. The class is `SxmSTransaction`\
    \ and it inherits from the `SxmTransaction` class. Below is a code fragment from\
    \ one of our earlier examples rewritten to use the `SxmSTransaction` class.\n\n\
    ```java\nArrayList paramVaues = new ArrayList();\n\nusing (SxmTransaction sxmTransaction\
    \ = new SxmSTransaction(\"jsearch\")){\n    sxmTransaction.executeQuery(\"getAllCompanies\"\
    , null);\n    while ((company = sxmTransaction.getNextRow()) != null) \n     \
    \   if (company[\"name\"].Equals(\"\") == true) {\n            paramVaues.Clear\
    \ ();\n            paramVaues.Add(company[\"companyPK\"]);\n            sxmTransaction.executeDelete(\"\
    deleteCompanyReg\", paramVaues);\n        }\n    sxmTransaction.commitTransaction\
    \ ();\n}\n```\n\nThe only difference from the earlier example is that an `SxmSTransaction`\
    \ is instantiated in the `using` block instead of an `SxmTransaction`, see line\
    \ 1. Other than this minor difference, everything else remains the same. The default\
    \ behavior for `SxmSTransaction` is to block waiting for its turn. You can modify\
    \ this behavior by including a milliseconds value in the constructor; see below.\n\
    \n```java\nSxmTransaction sxmTransaction = new SxmSTransaction(\"jsearch\", 10000)\n\
    ```\n\nIn the line above, the `SxmSTransaction` constructor will wait 10 seconds\
    \ before throwing an `SxmTimeoutException`. The `SxmSTransaction` class will serialize\
    \ any transaction, not just transactions that update the database. A fair question\
    \ would be; do I really need to go through all this trouble? If you do not execute\
    \ a lot of concurrent writes and don’t hold onto read locks for long periods of\
    \ time, then I would say no. You can just let the database block any operations\
    \ as needed until the lock state changes and the blocked operations are permitted\
    \ to proceed. However, if you perform numerous concurrent write transactions mixed\
    \ with database reads that must be serviced, then you might consider this strategy.\n\
    \nIf you do decide to delay write operations, you should perform them on a worker\
    \ thread not the UI thread. The reason for this is pretty obvious. It makes little\
    \ sense to serialize some transactions in order to free the processor to perform\
    \ other work and then block the user interface waiting on the serialized transactions.\n\
    \n### Dynamic Queries\n\nUp to this point, all of our queries have been statically\
    \ defined in the SQL statements properties file. By static, I am referring to\
    \ parameterized queries where only the user supplied data in the query changes;\
    \ the logic of the query remains constant. Many applications require that some\
    \ of their queries be more flexibility. These apps need to be able to create queries\
    \ on-the-fly where the query logic can differ in ways that may not be known in\
    \ advance. These are often referred to as dynamic or ahoc queries. I classify\
    \ two levels of dynamic queries.\n\n*   Fully dynamic. These are queries that\
    \ are fully assembled in code.\n*   Partial dynamic. These are queries that are\
    \ partially static and partially dynamic.\n\nLet’s take a look at these individually.\n\
    \nFully dynamic queries are normally used for searches where the combination of\
    \ search constraints is not known in advance. For example, imagine you visit a\
    \ real estate Web site that allows you to search for a home based on several dozen\
    \ user selectable criteria, such as\n\n*   Sq. footage\n*   Number of bathrooms\n\
    *   Number of bedrooms\n*   Pool\n*   etc…\n"
