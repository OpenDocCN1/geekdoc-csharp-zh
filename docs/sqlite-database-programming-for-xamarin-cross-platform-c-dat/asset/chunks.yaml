  trans: "\n到目前为止，我已经向你展示了如何设置并执行我所描述的标准同步。在这种情况下，本地 SQLite 数据库中每个被标记为同步的表，在 HotRiot\
    \ 中都有一个对应的表，记录数据会在其中进行传播。此外，错误处理如前文所述，由同步过程完全管理。这种设置非常简单，而且对于许多应用程序来说，这已经足够了。然而，有时需要更大的灵活性。例如，某些时候，使用设备数据库上的表与复制服务器上的表之间一对一的关系进行同步可能并不理想。将源数据进行转换并将生成的转换数据保存到与设备不同的架构（schema）中可能更有意义。或者，你可能希望跳过默认的同步错误处理，而是插入你自定义的错误处理。最后，你可能希望在记录同步后执行某些处理。\n\
    \n为了满足这些需求，`SQLite.XM` 允许你在复制处理周期中的以下节点插入你自定义的代理方法（delegate methods）：\n\n* 同步前（Pre-synchronization）\n\
    * 同步后（Post-synchronization）\n* 错误处理（Error processing）\n\n你可以为其中任何或全部节点编写代理方法。\n\
    \n## 同步前处理\n\n同步前代理允许你对复制进行自定义，以便与非匹配的服务器端架构进行同步。实际上，一个同步前代理可以用于在复制记录之前执行你想要执行的任何处理。然而，它的设计意图是用于非匹配的服务器端复制。\n\
    \n在我们早期的同步示例中，本地 SQLite 数据库上每个标记为复制的表在 HotRiot 中都有一个对应的表。这种标准同步仅允许你对复制过程进行细微调整。例如，你可以通过在你在\
    \ HotRiot 中定义的对应表中省略某些字段，来选择不复制设备表中的特定字段。你也可以在 HotRiot 表中包含设备表中不存在的字段。虽然这些更改可能有用，但它们是相对微不足道的。设备与服务器数据存储之间的基本架构仍保持完整，至少对于那些被标记为同步的表是如此。\n\
    \n复制服务器上的架构与设备上的架构存在巨大差异的情况完全并不罕见。事实上，我发现这种情况经常发生。让我们来看一个例子。回到我们的职位搜索应用程序；假设我们有一个企业注册表单，用于收集典型的联系信息。因为这是一个职位搜索应用，我们还想收集人力资源联系信息，包括\
    \ HR 联系人的照片。此外，作为注册的一部分，我们的应用还会创建一个 Android 设备 ID 或 iOS 设备令牌；取决于应用程序运行在何种操作系统上。出于性能考虑，我们决定将设备上的数据库架构扁平化，并将所有这些信息存储在单一表中；`company_registration`\
    \ 表。该表在设备上的结构所示：\n\n![](img/Image00001.jpg)\n\n在服务器端数据存储中，我们希望使用更传统的架构。下面的图显示了归一化的服务器端架构的样子。如你所见，这与设备上的公司注册表非常不同。有四处显著的变化：\n\
    \n* 第一，显而易见，原始的公司注册表被拆分为三个独立的表，这些表通过外键连接到一个注册表。\n* `company_registration` 表名没有被用服务器端数据存储中任何表的名称。\n\
    * 每个表都添加了新字段，这些字段在设备公司注册表中并不。\n* `company_registration` 表中的字段不仅被移动到了服务器上不同的表中，而且被重命名了。\n\
    \n![](img/Image00002.jpg)\n\n问题是；我们如何将原始的单表注册转换为可以与服务器上修改后的架构同步的格式。在接下来的讨论中，假设这些表已经在\
    \ HotRiot 中创建，并且包含了上面显示的所有字段。并且字段的数据类型已正确设置。再次强调我们之前关于主键的讨论，服务器端数据库上所有主键字段的数据类型必须是文本。此外，每张表必须包含一个\
    \ `systemSynchID` 字段。没有这个字段，`SQLite.XM` 将无法执行复制；为了复习，请参见“创建复制数据库表”章节。为了让这个示例更有趣，我们在设备的\
    \ `company_registration` 表中包含了一个图片字段，该字段需要存储在服务器的 `hrContact` 表中。\n\n我们需要做的是创建一个可以执行这种转换的同步前处理代理。代理方法的签名所示：\n\
    \n```java\npublic delegate Task<List<SynchDescriptor>> SynchPreProcessDel(SynchDescriptor\
    \ sd);\n```\n\n要在 `SQLite.XM` 同步处理链中插入预处理代理，请执行以下操作：\n\n* 创建 `SynchOptions` 类的实例。\n\
    * 将 `SynchPreProcessDel` 字段设置为你的错误代理。\n* 将 `SynchOptions` 类类传递给 `SxmInit.initialize`\
    \ 方法。\n\n查看下方的前三行代码。\n\n```java\nSynchOptions synchOptions = new SynchOptions();\n\
    synchOptions.SynchPreProcessDel = mySynchDel;\nSxmInit.initialize(\"YOUR APPLICATION\"\
    , synchOptions);\nthis.StartService(new Intent(typeof(SynchronizeService))); //\
    \ 仅限 Android\n```\n\n如你所见，预处理代理传入一个 `SynchDescriptor`，并返回一个 `SynchDescriptors`\
    \ 列表。`SynchDescriptor` 是一个表示要复制记录的对象。传入的 `SynchDescriptor` 代表 `SQLite.XM` 在复制日志中找到的记录。返回的\
    \ `SynchDescriptor` 列表是实际复制的 `SynchDescriptors` 列表。`SynchDescriptor` 类的部分列表所示：\n\
    \n```java\npublic class SynchDescriptor {\n    public string action;\n    public\
    \ string dbName;\n    public string tableName;\n    public SynchResponse synchResponse;\n\
    \    public Hashtable recordDataToSynch;\n\n    public SynchDescriptor(string\
    \ action, string dbName, string tableName) {\n        this.action = action;\n\
    \        ...\n    }\n}\n```\n\n类变量非常通俗易懂，但我们还是应该过一遍：\n\n* `string` `action`：这是同步操作。插入新记录时为\
    \ *insert*，删除记录时为 *delete*，更新记录时为 *update*。\n* `string` `dbName`：这是获取该记录的设备数据库。\n\
    * `string` `tableName`：这是获取该记录的表。\n* `SynchResponse` `synchResponse`：这是与此 `SynchDescriptor`\
    \ 相关的同步的响应结果。这将在“同步后代理处理”章节中详细解释。\n* `Hashtable` `recordDataToSynch`：这是实际的记录数据。哈希表中的键包含字段名，而值包含实际的字段数据。\n"
- fmt: "\nThere is one interesting question regarding the `SynchDescriptor`. If a\
    \ descriptor is passed to your delegate with an `action` that is `delete`, then\
    \ what is passed in the `recordDataToSynch` field? In this case, there will only\
    \ be one entry in the this field; the `systemSynchID`. As you know, the synch\
    \ ID uniquely identifies a record, and as such, provides all the information that’s\
    \ needed in order to perform a delete.\n\n## Writing a pre-synchronization delegate\n\
    \nA pre-synchronization delegate can transform the record represented by the input\
    \ `SynchDescriptor` in any manner whatsoever. In our example, we are making some\
    \ fairly extensive changes. The delegate method below performs this transformation,\
    \ converting from a single table schema on the device to our multi-table server-side\
    \ schema. It looks like a lot of code, but it is really quite simple.\n\n```csharp\n\
    public static async Task<List<SynchDescriptor>> mySynchPreProcessDel(SynchDescriptor\
    \ sd)\n{\n    List<SynchDescriptor> processList = null;\n    try\n    {\n    \
    \    if ((sd.action.Equals(\"insert\") == true ||\n            sd.action.Equals(\"\
