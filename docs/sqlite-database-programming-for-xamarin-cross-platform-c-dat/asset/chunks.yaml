- fmt: "\nException processing is an ever-present fact of life, however, it almost\
    \ always injects complexity into your design. So, as a general rule, you should\
    \ design you code/application with as few failure points as possible. This seems\
    \ obvious but you would be surprised how often this simple rule is ignored. We\
    \ have considered competing file storage options each with strengths and weaknesses.\
    \ Let us try and boil them down to a single sentence and provide some concrete\
    \ advice.\n\n*   Storing files outside the database is likely to be more flexible,\
    \ but it usually create additional points of failure and is normally more complicated\
    \ to implement.\n*   Storing files inside the database is normally less flexible\
    \ but easier to design and implement.\n\nI prefer to store files outside the database,\
    \ that’s the advice I almost always give. That being said, every app is different\
    \ and only you know what’s best given your particular requirements. It might seem\
    \ strange that after I delineate the pitfalls of external file storage that I\
    \ would, as a general rule, recommend this solution. I believe, all things considered,\
    \ it is usually the better choice.\n\nSo, that’s it? Unfortunately, no. There\
    \ is still one more consideration. If the tables where you store files are going\
    \ to be replicated, you should consider the specifics of how file transfers are\
    \ performed between your app and the cloud server. In our case, we’ve decided\
    \ to use `HotRiot` as our cloud storage solution. The `HotRiot` API performs file\
    \ transfers expecting the file data to be an actual file on disk (SSD). This doesn’t\
    \ necessarily mean you can’t store files inside the database, but in our case,\
    \ it provide one more reason to use an external file instead.\n\n## Updating records\n\
    \nThe way records are updated is very similar to the way they are inserted. Let’s\
    \ take the record insert example from earlier and modify it in order to perform\
    \ an update.\n\n```\n[Activity (Label = \"UpdateHRActivity\")]\n\npublic class\
    \ UpdateHRActivity : Activity\n{\n  protected override void OnCreate (Bundle bundle)\n\
    \  {\n    base.OnCreate (bundle);\n    SetContentView(Resource.Layout.CoRegistration);\n\
    \    Button submitCoRegButton = FindViewById<Button>(Resource.Id.submitCoRegButton);\n\
    \    submitCoRegButton.Click += delegate { updateHRContactSubmitHandler (); };\n\
    \  }\n  private void updateHRContactSubmitHandler()\n  {\n    ArrayList updateValues\
    \ = new ArrayList ();\n    updateValues.Add(FindViewById<EditText>(Resource.Id.coRegContact).Text);\n\
    \    updateValues.Add(FindViewById<EditText>(Resource.Id.coRegName).Text\n   \
    \ using (SxmTransaction sxmTransaction = new SxmTransaction (\"jsearch\")){\n\
    \      1 sxmTransaction.executeUpdate(\"updateHRContact\" updateValues);\n   \
    \   2 if (sxmTransaction.commitTransaction () != SQLiteErrorCode.Ok)\n       \
    \   throw new SxmException (new ErrorMessage (\"Commit error.\", Defines.SxmErrorCode.userDefined));\n\
    \    }\n  }\n}\n```\n\nEverything here should look pretty familiar. Line 1 is\
    \ where the actual call is made to perform the update. As you can see, this is\
    \ very similar to the insert example. The `executeUpdate` method locates the update\
    \ statement from the SQL statements properties file that matches the statement\
    \ name passed in as the first parameter. In our example, this would be the entry\
    \ below.\n\n`[updateHRContact] [UPDATE companyReg SET hrContact = ? WHERE coName\
    \ = ?]`\n\nThe values in the `ArrayList` that’s passed in as the second parameter\
    \ replace the placeholders in the SQL statement. The statement is then executed.\
    \ Of course, update operations modify the database, they therefore require a commit,\
    \ which is done on line 2.\n\n## Deleting records\n\nThe method below performs\
    \ a record delete on the company registration table.\n\n```\nprivate void deleteCoRegistration\
    \ (string registrationRecordPK)\n{\n  ArrayList deleteKey = new ArrayList ();\n\
    \  deleteKey.Add(registrationRecordPK);\n  using (SxmTransaction sxmTransaction\
    \ = new SxmTransaction (\"jsearch\")){\n    1 sxmTransaction.executeDelete(deleteKey);\n\
    \    2 if (sxmTransaction.commitTransaction () != SQLiteErrorCode.Ok)\n      \
    \  throw new SxmException (new ErrorMessage (\"Commit error.\", Defines.SxmErrorCode.userDefined));\n\
    \  }\n}\n```\n\nEverything here should look pretty familiar. Line 1 is where the\
    \ actual call is made to perform the delete. As you can see, this is very similar\
    \ to the insert example. The `executeDelete` method locates the delete statement\
    \ from the SQL statements properties file that matches the statement name passed\
    \ in as the first parameter. In our example, this would be the entry below.\n\n\
    `[delete]`\n`[DELETE FROM companyReg WHERE registrationRecordPK = ?]`\n\nThe values\
    \ in the `ArrayList` that’s passed in as the second parameter replace the placeholders\
    \ in the SQL statement. The statement is then executed. Of course, delete operations\
    \ modify the database, they therefore require a commit, which is done on line\
    \ 2.\n\n## Error Processing\n\nErrors are a fact of life for any app, so I suppose\
    \ it goes without saying that proper error handling is critical. But you’d be\
    \ surprised how often I see error processing implemented as an afterthought. Often\
    \ you see the main line of code implemented first and then exception processing\
    \ grafted on at some later point. It is natural to wait. However, to get real\
    \ benefit from this, it needs to be done while you are writing the main line of\
    \ code. Enough said, for now. Let’s have a look at two examples. The first will\
    \ show exception processing.\n\n### Initialization error processing\n\nThe `initDB`\
    \ method initializes the database, preparing it for use. It performs the basic\
    \ tasks required by SQLite. The interesting dilemma with initializations, is that\
    \ you often can’t proceed if they fail. This is certainly always the case with\
    \ database initialization. It’s kind of hard to recover from errors rooted in\
    \ the foundation of an app. For example, if database initialization fails, how\
    \ can you really expect to run your app with any confidence? The answer is, you\
    \ can’t. That’s the bad news. The good news is, once you get initialization working,\
    \ it would be unusual for it to fail. So, for the most part, error processing\
    \ on initialization is used more during development than for recovery. That being\
    \ said, should initialization fail in production, you need to process the error\
    \ in a sane manner; don’t just let it go. It’s better to proactively deal with\
    \ an unrecoverable condition than let it manifest into something worse. Let’s\
    \ get on with the code below\n\n```\nprotected void initDB()\n{\n  1 DatabaseDescriptor\
    \ jsDD = null;\n  string errorMessage = null;\n  2 bool parsed = false;\n  3 bool\
    \ init = false;\n  try {\n    4 jsDD = new DatabaseDescriptor (\"jsearch\");\n\
    \    // For Android apps.\n    using (StreamReader sr = new StreamReader (Assets.Open\
    \ (\"SqlStatements.txt\"))){\n```\n"
