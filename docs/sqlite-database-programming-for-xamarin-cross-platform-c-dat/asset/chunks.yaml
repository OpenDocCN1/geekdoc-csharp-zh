    );\n    3 fieldData[1] = (string)sxmTransaction.getValue(\"description\");\n \
    \   4 Type payType = sxmTransaction.getType(\"pay\");\n    5 fieldData[2] = ((System.Int64)sxmTransaction.getValue(\"\
    pay\")).ToString();\n    TableRow row = new TableRow(this);\n    foreach (string\
    \ fieldValue in fieldData)\n    {\n      TextView tv = new TextView(this);\n \
    \     tv.SetPadding(8, 10, 8, 10);\n      tv.SetText(fieldValue, TextView.BufferType.Normal);\n\
    \      row.AddView(tv);\n    }\n    jobsTable.AddView(row);\n  }\n}\n```\n\n"
- fmt: "\n```\nrow.AddView (tv);\n}\njobsTable.AddView(row);\n}\n}\n```\n\nLine 1\
    \ selects the next row for processing. The rows are iterated in the order they\
    \ are returned by the query. The `nextRow` method will return `false` when there\
    \ are no more records to process. Lines 2, 3, and 5 retrieve the actual row data\
    \ by calling the `getValue` method. We are selecting the job title, description,\
    \ and pay. `getValue` returns a generic object, so it may be necessary to cast\
    \ the return object to its actual type, as we are doing here. For example, on\
    \ lines 2 and 3, the return values are cast to a string. On line 4, we are get\
    \ the data type information for the value returned in the `pay` field. Normally\
    \ this isn’t necessary as you usually know the data type for a field in advance.\
    \ However, if you need to dynamically get a field’s type information, this is\
    \ how you do it. The `nextRow` method only allows you to move forward in the result\
    \ set; sometimes this is a problem and other times it isn’t. If you need to iterate\
    \ over the results more than once or you need to be able to freely move forward\
    \ and backward through the search results, first pull the records from the result\
    \ set and place them into a collection.\n\n## Embedding SQL in your code\n\nLet\
    \ me say right from the start that I don’t recommend you embed SQL directly in\
    \ your code unless you have a very good reason. SQL statements should be placed\
    \ in the SQL statements properties file. That being said, there may be legitimate\
    \ circumstances which call for imbedded SQL. `SQLite.XM` includes variations of\
    \ the `executeUpdate`, `executeDelete`, and `executeQuery` methods that accept\
    \ a SQL string. They are listed below.\n\n* `executeDeleteDirect (string sqlStatement,\
    \ ArrayList ParameterValues)`\n* `executeUpdateDirect (string sqlStatement, ArrayList\
    \ ParameterValues)`\n* `executeQueryDirect (string sqlStatement, ArrayList ParameterValues)`\n\
    \nThese are drop-in replacements for the `executeUpdate`, `executeDelete`, and\
    \ `executeQuery` methods that we have been using thus far. The first parameter\
    \ to all three of these methods is the actual SQL statement that you wish to execute.\
    \ You can design your SQL any way you like, however, it must use the parameterized\
    \ form that is used throughout this book and required by `SQLite.XM`. The second\
    \ parameter is the usual `ArrayList` of values that replaces the placeholders\
    \ in the SQL statement; this can be a null or an empty list.\n\n## Multi-database\
    \ statement processing\n\nThis concept is explored in more detail a bit later;\
    \ however, I need to provide a brief introduction to the notion of attaching and\
    \ detaching databases. When an `SxmTransaction` object is created, it is for a\
    \ particular named database. In the line of code below, we instantiate a transaction\
    \ for the `jsearch` database. This is referred to as the transactions primary\
    \ database.\n\n```\nsxmTransaction = new SxmTransaction(\"jsearch\");\n```\n\n\
    There is nothing unusual here, we’ve already seen this in numerous examples. Once\
    \ created, SQL statements that are executed by a transaction object are executed\
    \ on the database associated with the particular transaction. However, what if\
    \ you want to execute statements that need to access tables in two or more databases?\
    \ In order to do that, you need to “attach” the other secondary databases to the\
    \ transaction, at which point, they can participate in queries executed by the\
    \ transaction. Below is an example\n\n```\nsxmTransaction = new SxmTransaction(\"\
    jsearch\");\nsxmTransaction.attachDatabase(\"anotherDatabase\");\n```\n\nOnce\
    \ attached, you can execute SQL statements that require the participation the\
    \ attached database. Attached databases remain accessible and part of a transaction\
    \ object until detached. This is explored in more detail in the section ‘Performing\
    \ joins across databases.’ I just wanted to introduce this concept to you as I\
    \ make reference to it in the following section.\n\n## Understanding transactions\n\
    \nA transaction is a series of SQL statements that are applied to a database as\
    \ one atomic operation that either succeeds or fails in its entirety. Do not confuse\
    \ an `SxmTransaction` object with a transaction. Not all `SxmTransaction` objects\
    \ implement a genuine database transaction. Let me explain. An underlying database\
    \ transaction is only created by an `SxmTransaction` object when it executes a\
    \ SQL statement that modifies a database in some way, i.e., any statement other\
    \ than a select statement. The following are some points to keep in mind with\
    \ respect to transactions.\n\n* An `SxmTransaction` object that only executes\
    \ select statements will never create an underlying database transaction. There\
    \ is really no need to wrap a series of select statements in a transaction, as\
    \ there is nothing to commit.\n* An underlying database transaction is started\
    \ by an `SxmTransaction` object only at the point that it executes a statement\
    \ other than a select statement. The reason for using this lazy initialization\
    \ tactic, is that transactions acquire database locks, which can block other operations;\
    \ for example, other databases updates. As a general rule of computing, you endeavor\
    \ to minimize blocking.\n* Attached databases fully participate in transactions.\
    \ If you attach a database to an `SxmTransaction` object and process a SQL statement\
    \ that modifies the attached database, the call to `commitTransaction` will commit\
    \ all updates made to both the primary and attached databases.\n* You cannot attach\
    \ or detach a database once an underlying database transaction has started.\n\
    * A single `SxmTransaction` object can host multiple transactions, serially, of\
    \ course.\n\nThe last bullet point requires some elaboration; consider the code\
    \ below. We instantiate a single `SxmTransaction` object and then use it to perform\
    \ two independent transactions. In this example, we allow the second transaction\
    \ to execute even if the first one fails. This is fine so long as the transactions\
    \ are independent. The point to keep in mind, is you must complete one transaction\
    \ before starting another. Now, I know this seems obvious, however, if you fail\
    \ to successfully call either `commitTransaction` or `rollbackTransaction`, the\
    \ transaction will remain active. In such a case, additional database operations\
    \ will be appended to the unfinished, active transaction, obviously not what you\
    \ would want.\n\n```\nusing (SxmTransaction sxmTransaction = new SxmTransaction(\"\
    jsearch\")) {\n    try {\n        sxmTransaction.executeInsert(\"registerCompany\"\
    , parameterValues);\n        if (sxmTransaction.commitTransaction() != SQLiteErrorCode.Ok)\
    \ {\n            throw new SxmException(\"registerCompany commit error.\", SQLiteErrorCode.userDefined);\n\
    \        }\n    } catch (Exception ex) {\n        sxmTransaction.rollbackTransaction();\n\
    \    }\n    try {\n        sxmTransaction.executeInsert(\"newRegistration\", parameterValues);\n\
    \        if (sxmTransaction.commitTransaction() != SQLiteErrorCode.Ok) {\n   \
    \         throw new SxmException(\"newRegistration commit error.\", SQLiteErrorCode.userDefined);\n\
    \        }\n    } catch (Exception ex) {\n        sxmTransaction.rollbackTransaction();\n\
    \    }\n    sxmTransaction.executeQuery(\"findCompany\", null);\n    return sxmTransaction.getAllRows();\n\
    }\n```\n\n## Transaction visibility\n\nLet’s take a closer look at how actions\
    \ performed by one transaction are “seen” by other transactions. This concept\
    \ is known as transaction isolation.\n"
