    The choice as as whether to store files inside or outside the database can depend
    heavily on the back-end server with which you intend to synchronize. If you use
    `SQLiteXM`’s default synchronization, you will, of course, be synchronizing to
    `HotRiot`. `HotRiot` does not include a `BLOB` data type. So there is no way to
    store a file inside a record. In `HotRiot`, all files are stored externally, in
    `AWS S3`. The database simply includes a pointer to the file. Now, this does not
    mean that you can’t choose to store files inside the database on the device if
    this is what you want. But if you do, you will need to write a pre-processing
    delegate in order to transfer the file data to an actual file on disk and then
    include the fully qualified path to the newly created file in the record. This
    is quite a bit of work that increases the complexity and memory footprint of your
    application. Depending on the size of the files being processed and the capabilities
    of the device, the memory overhead can be anywhere from insignificant to downright
    burdensome. There is also one other consideration. Because you will be creating
    files as part of synchronization, you will need to clean these files from disk.
    `SQLite.XM` synchronization includes post-synchronization processing, which would
    provide you a mechanism for performing the deletes. But this is one more bit of
    customization that you would need to add to the synchronization process. My advice
    is this; unless there is some compelling reason to do otherwise, when synchronizing
    with `HotRiot`, store files outside the database on the device and simply include
    a file pointer in the record.


    If you synchronize with a server that does support `BLOBs`, then you might choose
    to store files inside the `SQLite` database. That decision may depend on a number
    of factors, including how records are managed by the server. In any case, in order
    to make a fully informed decision, you need to be aware of how records that are
    being synchronized are processed. When a record is selected for synchronization,
    the entire record data is read from the device database and handed off to the
    `SQLite.XM` synchronization processing engine. The first thing synchronization
    does, is check to see if a pre-processing delegate has been registered with the
    system, if one has, the record is passed to the delegate for additional processing.
    Otherwise, the record is sent “as-is” to the server for synchronization. The pre-processing
    delegate will do whatever it does, possibly creating additional records from the
    input record. The return record list from the pre-processing delegate will then
    be synchronized to the server. Finally, if a post-synchronization delegate was
    registered, it will be called. The thing to keep in mind, is that the entire record
    is read and passed through the synchronization processing chain. If the files
    being stored in the database are very large, this could, depending on the constraints
    of the device, create memory issues. Of course, when synchronizing with a back-end
    other than `HotRiot`, you will need to write the code that performs the actual
    data transfer to the cloud. In this case you have complete control over the synchronization
    processing. You could choose to store files outside the database on the device
    and then store them inside the database on the server. The sky’s the limit. In
    any case, my advice remains the same; unless there is some compelling reason to
    do otherwise, when synchronizing with a custom back-end, store files outside the
    device database and simply include a file pointer in the record.


    ## Coordinating synchronization


    Earlier, in the section ‘Synchronization details’ I said the following:


    “Inserting, updating, and deleting of records while synchronization is in the
    running state, i.e., not waiting, is perfectly fine; there is no coordination
    that you need to perform. “


    So it would be understandable if you’re feeling a bit confused. For the most part,
    it is safe for your app to operate independent of synchronization. So the quote
    from above is generally applicable. However, there is one circumstance where you
    will need to coordinate your apps activities with synchronization.


    When synchronization is in the running state, you cannot safely delete files that
    are part of any records that could be in the process of being synchronized. You
    will recall from our earlier discussion regarding synchronizing files, that `HotRiot`
    requires file attachments to be stored outside the database. This could cause
    a potential conflict. Your app could attempt to delete a file that `SQLite.XM`
    is in the process of uploading to the `HotRiot` server. Of course, this is not
    acceptable and needs to be avoided. The solution is simple, before deleting any
    files that are part of any records that could be in the process of being synchronized,
    get the synchronization lock for the database where the records reside. You do
    this using the static `getSynchMonitor` method in the `SxmInit` class; see the
    method signature below.


    ```

    public static bool getSynchMonitor (string databaseName, int millisecondsTimeout)

    ```


    This method accepts two arguments:


    *   The name of the database for which you would like to get the synchronization
    lock.

    *   The number of milliseconds that you would like to wait trying to acquire the
    lock. The method returns immediately upon acquiring the lock or after the specified
    wait time has elapsed. Sending the value `Timeout.Infinite` wall cause the method
    to wait indefinitely until the lock is acquired.


    The `getSynchMonitor` method returns `true` if the lock was acquired, otherwise
    it returns `false`. The `SQLite.XM` synchronization code could wind up holding
    a synch lock for quite a long time if the records/files being replicated are very
    large or the connection quality is poor. This is something that you need to consider
    in your design. You definitely do not want to block for long periods of time on
    the user interface thread trying to acquire a lock. Either perform file deletes
    on a worker thread or set the timeout for acquiring locks to a very brief period
    of time and design your delete logic to survive failures acquiring locks.


    It’s important for your app to not hold a synchronization lock for any longer
    than necessary. While your app holds the lock, synchronization will block. You
    release the lock by calling the static `releaseSynchMonitor` method of the `SxmInit`
    class; see the method signature below.


    ```

    public static void releaseSynchMonitor (string databaseName)

    ```


    This method accepts as its only parameter the name of the database for which you
    would like to release the synchronization lock. This method MUST be called for
    every corresponding `getSynchMonitor` call that returns `true`. Failure to do
    so will cause synchronization to block indefinitely.


    In order to maximize concurrency with lock requests being made by your app, `SQLite.XM`
    acquires and releases the synch lock for each record being synchronized. For example,
    if there were ten records in the replication log, the lock would be acquired and
    then released for each record. That cycle would repeat ten times, giving your
    app an opportunity to interleave a lock acquisition of its own in the middle of
    the synchronization processing.


    ## Customizing synchronization

