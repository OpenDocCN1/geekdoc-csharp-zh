  trans: '

    MySQL 和 Mongo 在根本上是不同的，一个是文档存储器，另一个则使用传统的关系型模型。尽管如此，对于绝大多数移动应用而言，其中任何一个都能完全胜任设计需求。虽然
    MySQL 和 Mongo 之间存在许多微妙和不那么微妙的差异，但它们大多数差异并不足以让其中某一个对于大多数移动应用变得无法使用的程度。然而，在决定使用哪一个时，有少数几个显著的区别是需要仔细考虑的。我重点介绍了我认为重要的部分，这个列表短得令人意惊讶。


    ### 事务 (Transactions)

    如果你的应用程序需要事务，那么 `MySQL` 现实来说是你的唯一选择。这种真实需求其实比你想象的要少。然而，对于资金转账和一些其他复杂操作，事务是不可或缺的。


    ### 关联 (Joins)

    如果你认为你的数据模型可以从连接中获益，那么 `MySQL` 是更好的选择。`Mongo` 不支持连接，且不建议在代码中执行连接操作。不要尝试代替数据库的工作，相反，应该选择正确的数据库。我知道连接最近不再受到青睐，尤其是随着
    NoSQL 数据库的流行。我会毫不犹豫地告诉你，我非常喜欢连接带来的能力，特别是连接允许在数据建模中的灵活性。连接的问题在于它们的使用方式，而不是连接本身。当使用得当时，连接是高效且灵活的。


    ### 可扩展性 (Scalability)

    如果你预计将产生海量数据，并且这些数据需要作为应用程序事务数据集的一部分，那么 `Mongo` 可能是你的更好的选择。`Mongo` 从底层开始设计就支持水平扩展。如果你预计你的数据集增长将超过了单个数据库服务器能够支持的范围，那么
    `Mongo` 可能具有某些使其倾向于它的特性。但这通常不是常态。我知道现在讨论支持“Web 规模（Web scale）”很流行，但从客观来看，只有极小比例的应用需要接近这种程度的扩展性。你会对单个强大的数据库服务器所能处理的内容量感到惊讶的。例如，我有一个好朋友是网上最流行的交友网站之一的共同者。在任何时候，他的网站都可以有数万名在线用户。即使对于这样大的网站，他的数据库也维持在
    80 GB 左右，不包括存储在数据库之外的文件附件。现在，他不允许垃圾数据在数据库中堆积，否则它会增长到无法管理的规模。因此，他定期清理数据以保持工作集处于低水平。这是明智的。在你的事务数据存储中保留垃圾没有意义；要么删除它，要么将其移动到离线存储。他的网站使用的是托管在
    `AWS` 上的 `MySQL`。


    我的建议是：使用关系型数据库（如 `MySQL`），除非你有使用 `Mongo` 或其他 NoSQL 解决方案的具体且可以说明的理由。例如，如果你预计将需要水平扩展。传统的关系型数据库在力量和灵活性方面是无可比拟的。


    ## 为 SQLite 设计


    好了，让我们回到讨论如何设计你的本地数据库上。我将向你展示如何进行一个可以同步到传统 SQL 数据库或 NoSQL 数据库的设计。


    任何重要的应用程序都需要一个由多个表组成的数据库设计。记住，我们正在为设备设计，而设备使用传统的 SQL 数据库。不同表中的信息通常以某种方式相关，并需要链接，以便有效地处理应用程序产生和消耗的数据。“关系（relational）”一词在这里的用法是指表与表之间的信息是以某种方式连接的。一个记录中的数据可以用于在其他表的记录中查找额外的相关信息。这通常是使用键字段完成的。这允许你在表之间创建复杂的相互关系，并用于适应各种需求。


    ### 主键和外键 (Primary keys and foreign keys)


    在我们继续之前，我们需要解释主键和外键的概念。主键是唯一标识表中某条记录的字段。外键是标识其他表中某条记录的字段。外键字段包含它所引用的“外键表”中记录的主键值，从而提供了到该记录的直接链接。一个表可以有多个外键，但只能有一个主键。


    例如，考虑下面的两个表：


    * 注册表 (Registration Table)

    * 职位发布表 (Job Posting Table)


    注册表和职位发布表都包含主键字段。在这个示例中，主键命名为 `Registration PK` 和 `Job Posting PK`。我喜欢使用在主键字段名称后附加
    `PK` 的命名规范。这使得识别字段非常容易。职位发布表还包含一个名为 `Registration FK` 的外键。与主键字段一样，我喜欢在外键字段名称后附加
    `FK`。这个字段是连接每个表中记录的键。注册表中的记录可以用于通过搜索职位发布表的 `Registration FK` 字段来查找某公司发布的所有职位。反之，你可以通过在注册表上搜索
    `Registration PK` 字段来定位与职位记录关联的注册配置。


    让我们看看这两个表的内部结构是什么样的：


    ![](img/Image00018.jpg)


    如你上面的表所示，职位发布数据库中 `Registration FK` 列的值对应于注册表中的 `Registration PK` 值。这种主键/外键关系在两个表的记录之间提供了一个双向链接，允许从一个表查找另一个。


    我们不想跑得太快。这里的目的是让你考虑结构化表的方法，以及你如何使用主键和外键。


    ### 结构化你的数据库 (Structuring your database)


    没有一种明确的正确数据库结构方法。但是，有一些你应该考虑的通用指南。让我们来看一个简单的职位搜索应用的数据库示例。


    在下图中，我们定义了构成简单职位搜索应用的六个表。注意每个表都包含一个主键，用于唯一标识记录。此外，大多数表还包含外键，用于链接表之间的记录。例如，职位发布表包含外键
    `Co Registration FK`。通过搜索此字段，可以轻松找到特定公司发布的所有职位。反之，可以通过在公司注册表上搜索 `Co Registration
    PK` 字段来查找发布该职位的公司详情。


    ![](img/Image00021.jpg)


    从这张图中可以看出，随着你创建更复杂的相互关系，情况可能会开始变得复杂。因此，你需要花时间妥善规划。尽管如此，通过主键/外键关系链接表允许你相对容易地创建复杂灵活的设计。


    在这一点上，不要担心创建表格的机械方法。现在，只需从宏观上考虑数据库结构。在纸上，写出每个表的名称以及它存储的信息。尝试遵循我们上面的示例——识别你需要的表，并包含它们将包含的几个字段。遵循下面的通用指南。

    '
- fmt: "\n*   Each table should only store related information. For example, it would\
    \ be a mistake to include job posting information in the `Company Registration`\
    \ table. It is far better to simply create another table to hold the job posting\
    \ information and then link the two tables using key fields.\n*   Include a primary\
    \ key field in every table you create, even if you think it will never get used.\
    \ You should almost never break this rule. It is better to have a primary key\
    \ and not use it, than to need it and not have it.\n*   When records in two tables\
    \ are related, link them using a primary key / foreign key relationship. This\
    \ is the foundation upon which relational databases are built. Sometimes a table\
    \ is linked to more than one other table, as in the ‘Job Seeker Favorites’ above.\
    \ As you can see, the records in this table include three foreign keys that link\
    \ to records in three table, including:\n    *   The Job Seeker Registration Table\n\
    \    *   The Company Registration Table\n    *   The Job Postings Table\n\nWhen\
    \ you link related tables in this way, you greatly enhance your ability to create\
    \ searches that can locate related records. For example, the `Co Registration\
    \ FK` field in the Job Seeker Favorites table can be used to create a search that\
    \ can locate the registration information of the company that posted the job.\
    \ Similarly, the `Job Posting FK` link can be used to create a search that can\
    \ locate the complete job listing. This is the real power behind using linked\
    \ key fields.\n\nLet's take a closer look at the three basic principles described\
    \ above.\n\n### Defining fields\n\nOnce you have identified the tables required\
    \ by your application, the next step is to decide the specific information each\
    \ table will store. This should be fairly easy. For example, if your app includes\
    \ a registration table, you must decide the information you would like to collect\
    \ as part of the registration process. This can be whatever you want. However,\
    \ in defining your table fields, consider the three guidelines below:\n*   Only\
    \ include fields you really need. You do not want to carry around useless information\
    \ in your tables; it only serves to bog things down. Don't worry if you miss some\
    \ fields in your initial design. You can always go back and add them.\n*   Each\
    \ table should only store related information. We mentioned this earlier, however,\
    \ it is worth reiterating.\n*   Registration tables represent a special case —\
    \ these tables often include an email address field and a password field. Together,\
    \ these fields represent a user's login credentials. You can use some other combination\
    \ of fields if appropriate, which, when combined are unique. Normally, applications\
    \ that have a registration will also include a login; this allows registered users\
    \ returning to the application to enter. You can set up a registration in any\
    \ number of ways, but this is one typical way of doing this.\n\n### Including\
    \ primary keys\n\nIt is almost universally accepted that it is good database design\
    \ to include a primary key field in all tables, even if you are not sure that\
    \ you will ever use the key. Experience has shown that primary keys wind up being\
    \ used extensively in most applications, especially those that include registrations.\
    \ And creating a primary key is easy! The rule here is: it’s better to have a\
    \ primary key and not need it, than need it and not have it.\n\n### Linking tables\n\
    \nThe ability to link related tables is the payoff you get for properly designing\
    \ your database and including key fields. Let's go back and use the job search\
    \ example to help us understand how tables are linked. Below is copy of the job\
    \ search database we presented earlier.\n\n![](Image00021.jpg)\n\nThis is a database\
    \ for an imaginary job search Application. This site allows registered companies\
    \ to post job listings in the job postings database. Registered job seekers can\
    \ search the job postings table. When they find a job they are interested in,\
    \ they can save a record of the job in the job seeker favorites table. This allows\
    \ them to easily go back and find all jobs in which they were previously interested.\
    \ Job seekers can also send emails to a company through the company email database.\
    \ This functionality would have been difficult if not impossible provide if we\
    \ had not created primary keys and foreign keys that link these related tables.\n\
    \nLet us go step by step and see how we linked these tables. Let's start with\
    \ the company registration table. This table includes a primary key named `Co\
    \ Registration PK`, which is automatically created when a company registers with\
    \ our application. At some point, a registered company is going to post a job\
    \ to the `Job Postings` table. Naturally, we will want to include the primary\
    \ key value from their registration, as a foreign key, in the job postings record.\
    \ In keeping with database design principal #2, our job postings table also includes\
    \ a primary key field named `Job Postings PK`.\n\nNow let's look at how job seekers\
    \ interact with our site. Job seekers must register before they can search the\
    \ job postings table. Naturally, our registration table includes a primary key.\
    \ This key is stored in the `JS Registration PK` field. Once job seekers have\
    \ submitted their registrations, they can start searching the job postings table.\
    \ One of the features of our application is that we allow job seekers to maintain\
    \ records of their favorite jobs.\n\nAs you can see from the diagram above, the\
    \ job seeker favorites' table includes three foreign key fields:\n*   `JS Registration\
    \ FK`\n*   `Co Registration FK`\n*   `Job Postings FK`\n\nThese foreign keys reference\
    \ records in their respective tables, which is what creates the link between records\
    \ in the `Job Seeker Favorites` table and records in the three foreign tables.\n\
    \n### Searching a relational database\n\nWe are going to get into this in detail\
    \ later, but let’s just touch on it. Another benefit you get from a good database\
    \ design is flexibility in searching. The critical feature of the design in the\
    \ diagram above is the fact that it contains key fields that link related tables\
    \ to each other. This greatly enhances your ability to create secondary searches\
    \ that can locate related records. For example, the `Co Registration FK` field\
    \ in the `Job Seeker Favorites` table can be used to create a search that can\
    \ locate the registration information of the company that posted the job. Similarly,\
    \ the `Job Posting FK` key can be used to create a search that can locate the\
    \ complete job listing from the job posting table. Along with maintainability,\
    \ this is the real power behind a good design.\n\nAnother option, is to use the\
    \ more advanced technique of searching by using joins. A join can be thought of\
    \ as a multi-table or multi-database search. It allows you to perform searches\
    \ that include record data from two or more tables, including tables in different\
    \ databases. This is covered in more detail later. For more information, see the\
    \ section `Performing joins across databases.`\n\n### Designing for Mongo synching\n"
