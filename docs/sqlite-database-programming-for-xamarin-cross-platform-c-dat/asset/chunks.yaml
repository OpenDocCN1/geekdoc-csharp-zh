  trans: "\n在编写自己的处理程序（handler）时，你需要确定哪些错误是可恢复的，哪些是不可恢复的。不可恢复的错误会导致当前的复制日志条目被删除，从而结束该记录的同步。当然，如果日志中存在后续条目，同步将继续处理下一个条目。否则，它将进入等待状态，等待新条目的出现。\n\
    \n可恢复错误要复杂一些。在 `removeFlag` 中返回 `false` 会指示 `SQLite.XM` 保持当前复制日志条目完整，以便稍后某点重新处理。随后，同步将停止一段时间，然后重新启动处理并从同一条记录开始。务必不要让同步进入阻塞所有同步的无限循环。让我来解释一下。下方的截图显示了一个无效数据处理错误。\n\
    \n![](img/Image00038.jpg)\n\n此特定错误是由于向电子邮件地址字段发送了格式不的数据引起的。除非纠正错误的根源，否则尝试重新同步该记录只会导致\
    \ HotRiot 返回相同的错误响应；从而使同步进入阻塞所有同步的无限循环。\n\n如果你在 `removeFlag` 中返回 `false`，则必须满足以下条件之一：\n\
    \n*   导致错误的条件必须是自我修正的。例如，HotRiot 服务器的超时，或由连接失败引起的 Web 或 IO 异常。它必须是某种你合理确定在条件变化时会自动修复的错误。\n\
    *   错误原因必须被显式纠正。\n\n### 同步后处理\n\n同步后委托（post-synchronization delegate）是一种插入到同步处理链中的方法，在复制完成后被调用。对于复制日志中处理的每个条目，都会调用它。无论处理是否成功，或者遇到可恢复或不可恢复错误，都会调用它。后处理委托不会在中止条件下调用；请参见“同步中止条件”章节。\n\
    \n后处理方法的签名如下所示。\n\n```csharp\npublic delegate Task SynchPostProcessDel(SynchDescriptor\
    \ originalSD, List<SynchDescriptor> sdList, SynchResponse synchResponse);\n```\n\
    \n要向 `SQLite.XM` 同步处理链中插入后处理委托，请执行以下操作：\n\n*   创建 `SynchOptions` 类的实例。\n*   将\
    \ `SynchPostProcessDel` 字段设置为你的错误委托。\n*   将 `SynchOptions` 类传递给 `SxmInit.initialize`\
    \ 方法。\n\n参见下方的前四行代码。\n\n```csharp\nSynchOptions synchOptions = new SynchOptions();\n\
    synchOptions.SynchPostProcessDel = mySynchPostProcessDel;\nsynchOptions.SynchPreProcessDel\
    \ = mySynchPreProcessDel;\nSxmInit.initialize(\"YOUR HotRiot APPLICATION NAME\"\
    , synchOptions);\nthis.StartService(new Intent(this, typeof(SynchronizeService)));\
    \ // 仅限 Android\n```\n\n在这个短代码段中，我们同时设置了预处理委托和后处理委托。同步委托之间没有任何依赖关系。它们可以单独设置，也可以与其他委托一起设置。我们这样做只是为了展示如何设置多个委托。\n\
    \n如你所见，后处理委托方法返回 `void` 并接收以下三个参数：\n\n*   `SynchDescriptor originalSD` - 这是与正在同步的复制日志中的条目相关的记录的同步描述符。如果注册了预处理委托，该描述符将传递给它。\n\
    *   `List<SynchDescriptor> sdList` - 这是 `SQLite.XM` 实际复制到 HotRiot 的描述符列表。如果注册了预处理委托，则它是该委托的输出。否则，此列表将包含一个指向与\
    \ `originalSD` 参数相同对象的条目。\n*   `SynchResponse synchResponse` - 这是从 `sdList` 中同步的最后一条记录返回的响应结果。\n\
    \n`SynchResponse` 参数需要额外的说明。`sdList` 中的 `SynchDescriptors` 按照它们在列表中出现的顺序进行同步。每个被处理的条目都会返回一个\
    \ `SynchResponse`，并将其放入正在同步的 `SynchDescriptor` 的 `SynchResponse` 实例变量中。同步描述符在“同步前委托处理”章节中进行了详细解释。下面显示了\
    \ `SynchDescriptor` 类的部分列表。\n\n```csharp\npublic class SynchDescriptor\n{\n  \
    \  public string action;\n    public string dbName;\n    public string tableName;\n\
    \    public SynchResponse synchResponse;\n    public Hashtable recordDataToSynch;\n\
    \    // ...\n}\n```\n\n列表中处理的最后一条记录的响应将作为最后一个参数传递给后处理委托。这样做是为了方便。你可以轻松地遍历 `sdList`\
    \ 中的描述符并单独检查每个 `SynchResponse` 对象。但这是必要的，因为你真正感兴趣的是 `sdList` 中处理的最后一条记录的响应。如果这是一个成功响应，则复制成功，否则复制失败。如果遇到错误，复制将立即停止。如果\
    \ `sdList` 中有多个描述符，则你需要遍历列表以确定哪个描述符导致了失败。我稍后会向你展示如何这样做。\n\n`SynchResponse` 类在“同步错误委托处理”章节中已详细介绍，所以我只做一个简要概述。下面显示了该类的部分列表。\n\
    \n```csharp\npublic class SynchResponse\n{\n    public SQLiteXM.Defines.SynchErrorTypes\
    \ synchErrorType;\n    public ProcessingSynchError processingSynchError;\n   \
    \ public ExceptionSynchError exceptionSynchError;\n    public bool removeFlag\
    \ = true;\n    // ...\n}\n```\n\n以下是实例变量的描述：\n\n*   `SynchErrorTypes synchErrorType`\
    \ - 通用成功或错误响应值。它指示成功或错误类型。它被设置为枚举之一。\n    *   `Defines.SynchErrorTypes.success`\
    \ - 表示处理与此 `SynchResponse` 对象相关的 `SynchDescriptor` 成功。\n    *   `Defines.SynchErrorTypes.exception`\
    \ - 表示处理与此 `SynchResponse` 对象相关的 `SynchDescriptor` 时发生了异常。你需要检查 `exceptionSynchError`\
    \ 对象以获取详情。\n    *   `Defines.SynchErrorTypes.Processing` - 表示处理与此 `SynchResponse`\
    \ 对象相关的 `SynchDescriptor` 时发生了处理错误。你需要检查 `processingSynchError` 对象以获取详情。\n*  \
    \ `ProcessingSynchError processingSynchError` - 如果发生了处理类型错误，此对象将提供描述错误的详细信息。否则为\
    \ `null`。\n*   `ExceptionSynchError exceptionSynchError` - 如果发生了异常类型错误，此对象将提供有关异常的详细信息。否则为\
    \ `null`。\n*   `bool removeFlag` - 此标志指示复制日志中的复制条目是否被删除。如果是 *true*，则条目被移除。当 `synchErrorType`\
    \ 为 `success` 时，移除标志始终为 *true*。否则，它对于不可恢复错误为 *true*，而对于可恢复错误为 *false*。\n\n"
- fmt: "\nA post-synchronization delegate can be used for any processing that you\
    \ wish to perform. One typical use, is for correcting synchronization errors.\
    \ As a general rule, I like to divide error processing and actual error correction\
    \ between an error delegate and a post-processing delegate. By that I mean, an\
    \ error delegate should only identify an error as recoverable or non-recoverable.\
    \ The post-processing delegate should assume responsibility for taking action\
    \ necessary to correct an error.\n\nIn the post-synchronization delegate example\
    \ below, we start by checking to see if synchronization succeeded, this is done\
    \ on line `1`. If `synchResponse.synchErrorType` is success, then synchronization\
    \ worked. You know this because the `synchResponse` parameter passed to the delegate\
    \ is the response returned from the last record in the `sdList` that was processed.\n\
    \nIf synchronization failed, the code iterates through the `sdList` in order to\
    \ find the `SynchDescriptor` that triggered the failure. This is done on line\
    \ `2`. Line `3` then checks to see if the error is recoverable or non-recoverable.\n\
    \nChecking for success or failure, and then, if necessary, identifying the descriptor\
    \ that caused an error, is very easy. What you decide to do with this information\
    \ is specific to your particular application requirements.\n\n```cs\npublic static\
    \ async Task mySynchPostProcessDel(SynchDescriptor originalSD, List<SynchDescriptor>\
    \ sdList, SynchResponse synchResponse)\n{\n1 if (synchResponse.synchErrorType\
    \ == Defines.SynchErrorTypes.success)\n  {\n    // Do success Processsing here.\n\
    \  }\n  else\n  {\n    // Find the descriptor that failed.\n    foreach (SynchDescriptor\
    \ sd in sdList)\n    {\n      2 if (sd.synchResponse.synchErrorType != Defines.SynchErrorTypes.success)\n\
    \      {\n        // Is this a recoverable error.\n        3 if (sd.synchResponse.removeFlag\
    \ == false)\n        {\n          // Recoverable error.\n        }\n        else\n\
    \        {\n          // Non-recoverable error.\n        }\n        // Found.\
    \ Get out after processing. Remaining response objects will be null.\n       \
    \ break;\n      }\n    }\n  }\n}\n```\n\n### Synchronizing to your own private\
    \ back-end server\n\nUp to this point, all of the synchronizing that we have done\
    \ as been to HotRiot. While you have a lot of flexibility and control in designing\
    \ how records should be synchronized, they are, nonetheless, still synchronized\
    \ to the HotRiot system. This is by far the easiest and fastest way to get your\
    \ app up and running, and in many instances, ideal. However, there are legitimate\
    \ reasons for wanting to replicate your own private back-end. I’m not going to\
    \ delineate why you might choose to do this. I assume if you’re seriously considering\
    \ replicating to private server, that you have good reason. In order to support\
    \ this requirement, `SQLite.XM` allows you to replace the default HotRiot synchronization\
    \ with your own custom replication. This allows you to take over replication and\
    \ synchronize to any server of your choosing.\n\nThe method signature for the\
    \ custom synchronization delegate is shown below.\n\n```cs\npublic delegate Task<bool>\
    \ SynchDel(List<SynchDescriptor> sdList);\n```\n\nTo replace the default HotRiot\
    \ synchronization with your own replication, simply pass your synchronization\
    \ delegate to the `SxmInit.initialize` method; see below.\n\n```cs\nbool schema\
    \ = SxmInit.initialize(mySynchDel);\nthis.StartService(new Intent(this, typeof(SynchronizeService)));\
    \ // For Android only.\n```\n\nAs you can see, the custom synchronization delegate\
    \ returns a bool, and is passed the following parameter.\n\n*   `List<SynchDescriptor>\
    \ sdList` - This is the list of synch descriptors that need to be synchronized\
    \ to your server. For the current version of `SQLite.XM`, this list will only\
    \ contains a single entry, but that might change in future versions.\n\nA partial\
    \ listing of the `SynchDescriptor` class is shown below.\n\n```cs\npublic class\
    \ SynchDescriptor\n{\n  public string action;\n  public string dbName;\n  public\
    \ string tableName;\n  public SynchResponse synchResponse;\n  public Hashtable\
    \ recordDataToSynch;\n  // . . .\n}\n```\n\nA description of each instance variable\
    \ follows.\n\n*   `string action` - This is synchronization action that needs\
    \ to be performed on this record. It will be `insert` when inserting a new record,\
    \ `delete` when deleting a record, and `update` when updating or modifying a record.\n\
    *   `string dbName` - This is the name of the database on the device from where\
    \ this record was retreived.\n*   `string tableName` - This is the name of the\
    \ database table from where this record was retreived.\n*   `SynchResponse synchResponse`\
    \ - This is the that is is returned from synchronizing this descriptor. This can\
    \ be ignored when performing a custom synchronization. own*   `Hashtable recordDataToSynch`\
    \ - This is the actual record data that needs to be synchronized to your server.\
    \ The keys in the hash contain field names while the value contains actual field\
    \ data.\n\nIf a descriptor is passed to your delegate with an `action` that is\
    \ `delete`, then what is passed in `recordDataToSynch`? In this case, there will\
    \ only be one entry in the hash table; `systemSynchID`.\n\n### How custom synchronization\
    \ works\n"
