    \ 和 `conn2` 可以同时使用。查看上面的代码，你会发现我们分别在第 2 行和第 6 行锁定并解锁了描述符。这是为了确保当我们使用修改后的设置创建新连接时，没有线程会溜入并对描述符做出意外的更改。如果你在单线程上执行所有工作，则不需要这样做。此外，为特定连接更改描述符本身也有些不寻。你通常创建一个数据库描述符并将其置之不管。\n\
