  trans: "\n\n关于 `SynchDescriptor` 有一个有趣的问题。如果传递给委托程序的描述符的 `action` 为 `delete`，那么在\
    \ `recordDataToSynch` 字段中传递的是什么？在这种情况下，该字段中只有一个条目；即 `systemSynchID`。如你所知，同步 ID\
    \ 唯一地标识一条记录，因此它提供了执行删除操作所需的所有信息。\n\n## 编写同步前委托程序\n\n同步前委托程序可以以任何方式转换输入 `SynchDescriptor`\
    \ 表示的记录。在我们的示例中，我们正在进行一些相当大量的更改。下面的委托方法执行了这种转换，将数据从设备上的单表架构转换为我们的多表服务器端架构。这看起来代码很多，但实际上非常简单。\n\
    \n```csharp\npublic static async Task<List<SynchDescriptor>> mySynchPreProcessDel(SynchDescriptor\
    \ sd)\n{\n    List<SynchDescriptor> processList = null;\n    try\n    {\n    \
    \    if ((sd.action.Equals(\"insert\") == true ||\n            sd.action.Equals(\"\
    update\") == true) &&\n            sd.dbName.Equals(\"jsearch\") == true &&\n\
    \            sd.tableName.Equals(\"company_registration\") == true)\n        {\n\
    \            processList = transformCompanyReg(sd);\n        }\n        else\n\
    \        {\n            processList = new List<SynchDescriptor>();\n         \
    \   processList.Add(sd);\n        }\n    }\n    catch (Exception doNothing) {}\n\
    \    return processList;\n}\n```\n\n上面的方法是实际的预处理委托程序。它检查正在同步的记录的操作是 `insert` 还是\
    \ `update`，以及该记录是否来自 `company_registration` 表；参见第 1 行。如果所有条件都成立，则需要对记录进行转换，否则可以在不进行任何修改的情况下进行同步。下面的\
    \ `transformCompanyReg` 方法执行从设备架构到服务器端架构的实际转换。代码列表之后将有详细解释。\n\n```csharp\nprivate\
    \ static List<SynchDescriptor> transformCompanyReg(SynchDescriptor sourceSD)\n\
    {\n    List<SynchDescriptor> processList = new List<SynchDescriptor>();\n    1\
    \ SynchDescriptor companyRegSD = new SynchDescriptor(sourceSD.action, sourceSD.dbName,\
    \ \"companyReg\");\n    2 SynchDescriptor hrContactSD = new SynchDescriptor(sourceSD.action,\
    \ sourceSD.dbName, \"hrContact\");\n    3 SynchDescriptor pushConnectionIDSD =\
