  trans: "\n同步错误委托（Synchronization error delegate）是一种插入到同步处理链中的方法，当在同步记录时遇到错误就会调用该方法。它允许你插入自己的自定义错误处理逻辑。错误委托方法的签名如下所示。\n\
    \n```\npublic delegate Task SynchErrorDel(SynchDescriptor synchDescriptor, SynchResponse\
    \ synchResponse);\n```\n\n若要向 `SQLite.XM` 同步处理链中插入你自己的处理程序，请执行以下操作：\n\n*   创建\
    \ `SynchOptions` 类的实例。\n*   将 `SynchErrorDel` 字段设置为你的错误委托。\n*   将 `SynchOptions`\
    \ 类传递给 `SxmInit.initialize` 方法。\n\n请查看下方的前四行代码。\n\n```\nSynchOptions synchOptions\
    \ = new SynchOptions();\nsynchOptions.SynchErrorDel = mySynchErrorDel;\nsynchOptions.SynchProcessDel\
    \ = mySynchProcessDel;\nSxmInit.initialize(\"YOUR APPLICATION NAME\", synchOptions);\n\
    this.StartService(new Intent(this, typeof(SynchronizeService))); // 仅限 Android\n\
    ```\n\n在上述短代码片段中，我们设置了错误委托和预处理委托。同步委托之间互不相互依赖。它们可以单独设置，也可以与其他委托一起设置。这为了展示如何设置多个委托。\n\
    \n如你所示，错误委托返回 void 并传递了两个参数：\n\n*   `SynchDescriptor` `synchDescriptor` - 触发错误的同步记录的描述符。\n\
    *   `SynchResponse` `synchResponse` - 同步记录时返回的结果。\n\n同步描述符在前面的部分已解释过。为了让你不困惑，`SynchResponse`\
    \ 对象包含了在 `SynchDescriptor` 中同步记录的结果。以下是该类的部分列表：\n\n```java\npublic class SynchResponse\n\
    {\n  public SQLiteXM.Defines.SynchErrorTypes synchErrorType;\n  public ProcessingSynchError\
    \ processingSynchError;\n  public ExceptionSynchError exceptionSynchError;\n \
    \ public bool removeFlag = true;\n  ...\n}\n```\n\n以下是每个变量的描述：\n\n*   `SynchErrorTypes`\
    \ `synchErrorType` - 成功或错误响应。指示了发生的错误类型。同步错误分为两个大类：异常错误和处理错误。它将被设置为以下枚举之一：\n \
    \   *   `Defines.SynchErrorTypes.exception` - 尝试向 HotRiot 发同步请求时发生的失败。通常情况下，异常错误表示\
    \ HotRiot 未收到同步请求或未能返回响应。它们包括 IOException、WebException 等。你需要检查 `exceptionSynchError`\
    \ 对象的详情。\n    *   `Defines.SynchErrorTypes.processing` - HotRiot 在尝试履行同步请求时发生的失败。你需要检查\
    \ `processingSynchError` 的详情。\n*   `ProcessingSynchError` - 如果发生了处理错误，该对象将提供错误的详细信息。否则为\
    \ `null`。\n*   `ExceptionSynchError` - 如果发生了异常错误，该对象将提供异常的详细信息。否则为 `null`。\n*\
    \   `Bool` `removeFlag` - 表示触发此错误的复制日志记录应该被删除。如果是 `true`，则该条目将被移除；否则将保留。该字段的默认值为\
    \ `true`。你的处理程序应将可恢复错误设置为 `false`，将不可恢复错误设置为 `true`。稍后后将详细解释这一点。\n\n### 处理异常同步错误\n\
    \n异常错误表示向 HotRiot 发送同步请求时失败，即 HotRiot 未收到请求。它也可以表示 HotRiot 在超时发生前未能对请求失败。以下是 `ExceptionSynchError`\
    \ 类的部分列表。\n\n```java\npublic class ExceptionSynchError\n{\n  public Exception\
    \ exception;\n  public string exceptionType;\n  public string exceptionMessage;\n\
    \  ...\n}\n```\n\n以下是每个变量的描述：\n\n*   `Exception` `exception` - 异常的实际对象。\n*   `String`\
    \ `exceptionType` - 遇到的异常类型。例如：WebException、OutOfMemoryException、IOException 等。\n\
    *   `String` `exceptionMessage` - 该异常的错误信息。\n\n下面的截图显示了 `exception` 类型错误的输出。如你所示，`synchErrorType`\
    \ 被设置为 `exception`，`exceptionSynchError` 对象包含了异常的详情。此特定异常是超时。从设备的角度来看，服务器超时是一种临时状态。\n\
    \n### 处理处理错误\n\n处理错误发生在 HotRiot 尝试履行同步请求的过程中。它们表示在处理请求时导致无法成功完成的错误状态。以下是 `ProcessingSynchError`\
    \ 类的部分列表。\n\n```java\npublic class ProcessingSynchError\n{\n  public int resultCode;\n\
    \  public string resultText;\n  public string resultMessage;\n}\n```\n\n以下是每个变量的描述：\n\
    \n*   `int` `resultCode` - 处理错误的数字型错误代码。\n*   `String` `resultText` - 处理错误的通用错误消息。\n\
    *   `String` `resultMessage` - 具体的错误消息。\n\n下面的截图显示了 `processing` 类型错误的响应输出。如你所示，`synchErrorType`\
    \ 被设置为 `processing`，`processingSynchError` 对象包含了错误的详情。此特定错误是一个无效数据异常。`resultText`\
    \ 字段告诉我们发生处理错误的通用类型。`resultMessage` 为我们提供了导致错误的详细原因，在本例中，是因为向电子邮件地址字段发送了格式不正确的数据。SQLite.XM\
    \ 处理器认为无效数据错误是不可恢复的。因此，它将 `removeFlag` 设置为 `true`。正如你记得的，不可恢复错误是那些几乎无法自我修正的错误。\n"
- fmt: "\n*   Incorrectly formatted data being posted to a field. For example, if\
    \ you define a field in `HotRiot` to hold a number (done on step 3 of the `HotRiot`\
    \ create database wizard) and try posting text data to the field.\n*   You define\
    \ a field in `HotRiot` as “Required” (also done on step 3 of the create database\
    \ wizard) but the data field is missing in a record that `SQLite.XM` tries to\
    \ synchronize.\n\nBoth of these are easily avoided by simply including data validation\
    \ logic in your app. This is something you should always be doing anyway.\n\n\
    Non-unique data exception errors are a bit more complicated to manage, or, to\
    \ be more accurate, prevent from occurring in the first place. These errors are\
    \ caused by posting non-unique data to a data field that requires unique data.\
    \ If you define a field in a Hot `HotRiot` table as unique, `HotRiot` will reject\
    \ any record insert or update request where the data being posted to the unique\
    \ field already exists in the database. Nothing unusual here, this what you would\
    \ expect. The problem is, in a distributed environment how can you be sure the\
    \ data that’s being generated on the device is, in fact, unique across all other\
    \ devices? This is very similar to the problem we faced generating unique primary\
    \ keys. The solution there, was to simply use `GUIDs` instead of the typical auto-increment\
    \ value. Unfortunately, for user generated data, such as passwords, this is not\
    \ a viable option. Even for application generated data, this will often times\
    \ be an unworkable solution. So, what are we to do? This problem is complicated\
    \ by several factors.\n\n*   Mobile apps operate in the context of an unreliable\
    \ distributed environment. It may not be feasible at any particular point in time\
    \ to check data generated on the device against data already on the replication\
    \ server.\n*   Data generated on one device cannot realistically be checked against\
    \ the data on all other devices waiting to synchronize.\n*   The app may be online\
    \ or offline at any given moment.\n*   Replication is a deferred process. And\
    \ even if we designed for immediate replication, given the transient nature of\
    \ connections, there is really no way to guarantee real-time or even near real-time\
    \ synchronization.\n\nSo, how can we ensure unique data given an environment with\
    \ the constraints listed above? To show how this is done, we will be revisiting\
    \ the registration example from earlier.\n\n![](Image00029.jpg)\n\nYou’ve seen\
    \ the figure above. It shows a single registration table on the device that’s\
    \ synchronized with three tables on the server. For this discussion, imagine that\
    \ the registration password field must be populated with a password that is unique\
    \ from all passwords that have been entered by other users. How can we ensure\
    \ a unique password? The easy solution is to “cheat” and only allow users to register\
    \ when the device/app has network connectivity. In many instances, this is the\
    \ preferred solution and it’s the easiest to implement. Here’s one way to do it.\n\
    \nFor this discussion, we assume that the three tables in `HotRiot` needed to\
    \ hold the registration information have already been created. And that the password\
    \ field in the `companyReg` table has been defined as unique. When a user submits\
    \ a registration, don’t immediately save it to the local device database as you\
