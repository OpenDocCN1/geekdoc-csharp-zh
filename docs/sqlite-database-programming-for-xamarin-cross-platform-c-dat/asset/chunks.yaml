    \ and it inherits from the `SxmTransaction` class. Below is a code fragment from\
    \ one of our earlier examples rewritten to use the `SxmSTransaction` class.\n\n\
    \ `ArrayList` ` paramVaues =` `new` ` ArrayList();`\n\n**`1`** `using` ` (` `SxmTransaction`\
    \ ` sxmTransaction = ` `new`  **`SxmSTransaction`** ` (` `\"jsearch\"` `)){`\n\
    \n`    sxmTransaction.executeQuery (` `\"getAllCompanies\"` `, ` `null` `);`\n\
    \n `while` ` ((company = sxmTransaction.getNextRow ()) != ` `null` `) `\n\n `if`\
    \ ` (company [` `\"name\"` `].Equals(` `\"\"` `) ==` `true` `) `\n\n`      {`\n\
    \n`        paramVaues.Clear ();`\n\n`        paramVaues.Add(company [` `\"companyPK\"\
    ` `]);`\n\n`        sxmTransaction.executeDelete (` `\"deleteCompanyReg\"` `, paramVaues);`\n\
    \n`      }`\n\n`     sxmTransaction.commitTransaction ();`\n\n`  }`\n\nThe only\
    \ difference from the earlier example is that an `SxmSTransaction` is instantiated\
    \ in the `using` block instead of an `SxmTransaction` , see line 1\\. Other than\
    \ this one minor difference, everything else remains the same. The default behavior\
    \ for the `SxmSTransaction` class is to block indefinitely waiting for its turn\
    \ to execute. You can modify this behavior by including a milliseconds timeout\
    \ value in the call to the constructor; see below.\n\n`SxmTransaction` ` sxmTransaction = `\
    \ `new`  `SxmSTransaction` ` (` `\"jsearch\", 10000` `)`\n\nIn the line above,\
    \ the `SxmSTransaction` constructor will wait 10 seconds before throwing an `sxmSTransactionTimeout`\
    \ `SxmException` . The `SxmSTransaction` class will serialize any transaction,\
    \ not just transactions that update the database. A fair question would be; do\
    \ I really need to go through all this trouble? If you do not execute a lot of\
    \ concurrent writes transactions and don’t hold onto read locks for long periods\
    \ of time, then I would say no. You can just let the database block any operations\
    \ as needed until the lock state changes and the blocked operations are permitted\
    \ to proceed. However, if you perform numerous concurrent write transactions mixed\
    \ with database reads that must be serviced quickly, then you might consider this\
    \ strategy.\n\nIf you do decide to delay write operations, you should perform\
    \ them on a worker thread not the UI thread. The reason for this is pretty obvious.\
    \ It makes little sense to serialize some transactions in order to free the processor\
    \ to perform other work and then block the user interface waiting on the serialized\
    \ transactions.\n\nDynamic Queries\n\nUp to this point, all of our queries have\
    \ been statically defined in the SQL statements properties file.  By static, I\
    \ am referring to parameterized queries where only the user supplied data in the\
    \ query changes; the logic of the query remains constant. Many applications require\
    \ that some of their queries be more flexibility. These apps need to be able to\
    \ create queries on-the-fly where the query logic can differ in ways that may\
    \ not be known in advance. These are often referred to as dynamic or ah-hoc queries.\
    \ I classify two levels of dynamic queries.\n\n*   Fully dynamic. These are queries\
    \ that are fully assembled in code.\n\n*   Partial dynamic. These are queries\
    \ that are partially static and partially dynamic.\n\nLet’s take a look at these\
    \ individually.\n\nFully dynamic queries are normally used for searches where\
    \ the combination of search constraints is not known in advance. For example,\
    \ imagine you visit a real estate Web site that allows you to search for a home\
    \ based on several dozen user selectable criteria, such as\n\n*   Sq. footage\n\
    \n*   Number of  bathrooms\n\n*   Number of bedrooms\n\n*   Pool\n\n*   etc…"
