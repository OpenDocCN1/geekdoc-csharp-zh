    \ `recordCount =` `10` `;`\n\n `SxmTransaction` ` sxmTransaction = ` `null` `;`\n\
    \n**`1`**  `string` ` [] paramPlaceHolders = ` `Enumerable` `.Repeat<` `string`\
    \ `>(` `\"?\"` `, `\n\n `companiesList.Count).ToArray();`\n\n**`2`**  `string`\
    \ ` csvParamPlaceHolders = ` `string` `.Join (` `\",\"` `, paramPlaceHolders); `\n\
    \n `try`\n\n`    {      `\n\n**`3`**  `string` `rawSelect =` `SqlStatements` `.selectStatements [`\
    \ `\"getAllCompanyJobs\"` `];`\n\n**`4`**  `string` ` selectStatement = ` `String`\
    \ `.Format (rawSelect, ` **`csvParamPlaceHolders,`**\n\n **`recordCount`** `, `\
    \ **`recordCount*pageNumber`** `);`\n\n `using` ` (` `SxmTransaction` `sxmTransaction\
    \ = ` `new`  `SxmTransaction` ` (` `\"jsearch\"` `)){`\n\n**`5`**   `sxmTransaction.executeQueryDirect (selectStatement, companiesList);`\n\
    \n  `BuildTableInline (sxmTransaction);   `\n\n`      }` \n\n `}`\n\n `catch`\
    \ ` (` `Exception` ` ex)`\n\n`    {`\n\n *`// Exception processing here.`*\n\n\
    `    }`\n\n`  }`\n\nThis method retrieves records from the job postings database.\
    \ The select statement for this query as it appears in the SQL statements properties\
    \ file is shown below.\n\n`[getAllCompanyJobs]`\n\n`[SELECT * FROM jobPosting WHERE companyRegFK IN ({0}) LIMIT {1} OFFSET {2}]`\n\
    \nAs you can see, the query string is designed to be processed by `String.Format`\
    \ . The string includes three format items. The first, {0}, is where the query\
    \ parameter placeholders will go. The other two format items are where the limit\
    \ and offset values go. The placeholder string is constructed on lines 1 and 2.\n\
    \nOn line 3, the unprocessed query string is retrieved from the SQL statements\
    \ properties file. This is passed to the `String.Format` method on line 4, where\
    \ the format items are replaced with their respective values. A fully constructed\
    \ query string that is ready to execute is returned."
