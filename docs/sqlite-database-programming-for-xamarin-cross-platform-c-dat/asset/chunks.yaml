    You have seen this method before, so I’m not going to go through it in detail.
    However, I would like to point out the `using` statement on line 1. The `SxmTransaction`
    constructor takes an instance of an `SxmConnection` as its only parameter. In
    all of our earlier examples, an `SxmTransaction` object was created using the
    name of the database. This difference has no effect on its usage. Once created,
    the `SxmTransaction` object behaves exactly as previously explained. Upon exiting
    the `using` block, the `SxmTransaction` will no longer be useable. However, the
    `SxmConnection` object will still be active and available for further use by other
    transactions.


    A connection object cannot be used by multiple transactions at the same time.
    If you try to use a connection while it is attached to a transaction, it will
    throw a `lockDB SxmException`. You can safely pass a connection object to another
    thread as long as it is not currently in use by an `SxmTransaction`.


    When you are finished with a connection, call the `destroyConection` method. Once
    called, the connection object will no longer be useable.


    ## Part 3. Data synchronization to the cloud


    Before getting too far into this, we should probably first understand what it
    is we are trying to do. Our goal with cloud synchronization is to either copy
    or move the record data from the local SQLite database to a server side datastore;
    presumably this is an enterprise database server, but there is no requirement
    imposed by SQLite.XM that this is the case. SQLite.XM comes out of the box ready
    to work with HotRiot.com, which uses both MySQL and MongoDB for its datastore.
    However, SQLite.XM can work with any back-end database or middleware of your choosing.
    I’ll show you how this is done a bit later, but it essentially entails writing
    a custom delegate method that is inserted into the synchronization processing
    chain. When present, your delegate will be called on to transfer record data from
    the device to wherever it is you wish it to be saved. This transfer can be done
    in any manner and to any server of your choosing. You have complete flexibility.
    We will get into this later. Most of the remainder of this part of the book is
    dedicated to using the built-in HotRiot synchronization.


    The graphic below depicts how data is aggregated to from the individual devices
    to the cloud server.


    ![](Image00010.jpg)


    This is a one way process that is ongoing and asynchronous. By that I mean, each
    device synchronizes independent of all other devices; there is no coordination
    between devices and there are no prescribed times for synchronization.


    Let me make a few comments regarding the term synchronization. Some might object
    to my using this term, as synchronization strongly implies two or more copies
    of data that are being kept up-to date or in synch. This is not what we are doing,
    we are copying data from the devices to a central database server. This activity
    might better be described as replication. But even that term doesn’t exactly fit,
    as there is no requirement to truly replicate. SQLite.XM is perfectly happy to
    allow you to perform a transform on the source data before moving it up to the
    server. Not only that, the server side datastore can be a completely different
    storage technology from that used by the local device, SQLite.XM doesn’t care.
    The whole activity might be more accurately described as an ETL (Extract, Transform,
    Load) process, but that just depends on how it is implemented. So we just settled
    on the term synchronization. For those that disagree, I would ask for some wiggle
    room. Also, I use the term synchronization and replication interchangeable.


    ## Understanding SQLite.XM synchronization


    Generally speaking, there are two methods for performing database synchronization:


    - Statement based synchronization (SBS)

    - Row based synchronization (RBS).


    With SBS, the SQL statements that are executed on the source database are copied
    and executed on the destination database. With RBS, the actual record data is
    copied from the source to the destination database. SQLite.XM uses RBS. Each method
    has advantages and disadvantages, however due to the nature of synchronization
    with SQLite.XM, SBS is just not practical. SBS is difficult enough to successfully
    perform using identical versions of the same database. It is simply unrealistic
    to expect to use SBS between heterogeneous database technologies, which is permitted
    by SQLite.XM. Not only that, SQLite.XM synchronization synchronization allows
    for transforming of the source data before propagating it to the server. In this
    case, SBS really has no meaning.


    Normally with RBS, the modified record data is copied to a synchronization log
    where it is held temporarily until it is moved to the target datastore. Each new
    insert or record update results in a new entry in the log. As you can imagine,
    depending the velocity of the inserts and/or updates and the frequency with which
    data is synchronized, you could wind up a very large log file. This is also a
    bit complicated to implement as the integrity of the synchronization log file
    must be assured as part of every transaction. This can get quite involved and
    it can be very difficult to create a reliable solution when managing the log from
    outside the actual database.


    SQLite.XM uses a slightly different approach to RBS that works just fine for the
    vast majority of applications. That being said, it’s important for you to understand
    the details in order for you to make a decision as to whether it is appropriate
    for your particular app. SQLite.XM does not maintain a synchronization log in
    the traditional sense. While a log does exist, the log only includes the replication
    key for the records that needs to be synchronized. The key is used to query the
    record in order to send the entire record data as part of the synchronization
    operation. As you might expect, this has advantages and disadvantages.


    The log is populated as part of the normal insert, update, and delete transaction
    processing performed by SQLite. This is part of the ACID compliance that is enforced
    by SQLite. This helps to ensure the integrity of the replication log. Therefore,
    if a record is successfully inserted, updated, or deleted, we can be certain that
    a corresponding entry into the replication log will be properly made. Conversely,
    if a database insert, update, or delete should fail, we can be sure that no entry
    will be inserted into the replication log. This is important, as proper synchronization
    starts with a replication log that accurately reflects database activity.


    SQLite.XM queries entries in the replication log in the order in which they are
    inserted; First In First Out (FIFO). The replication key from each log entry is
    used to query the record referenced by the entry. The entire record data is then
    sent to the replication server, where a new entry is made in the database or the
    existing record is updated or deleted. SQLite.XM does not track the individual
    fields modified by an update, it simply updates the entire record with the current
    record data. This greatly simplifies the synchronization process, which helps
    to make it more reliable. However, it has the side effect of potentially increasing
    network traffic over what would be needed if synchronization only updated modified
    fields. If your app performs many partial modifications to existing records, this
    could represent a significant increase over what is actually required. Of course,
    this depends on the particulars of you application.


    The other issue to be aware of, is that fields in a record can be synchronized
    earlier in the replication process than when they were actually modified. The
    results of this are no different from what you could get with a traditional statement
    or row based replication. Let’s go through an example.


    ![](Image00028.jpg)

