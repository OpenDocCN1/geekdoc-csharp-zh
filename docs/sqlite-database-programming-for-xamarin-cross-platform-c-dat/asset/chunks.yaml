  trans: "\n\n```csharp\n// For iOS apps.\nusing (StreamReader sr = new StreamReader(\"\
    sqlProperties/SqlStatements.txt\")){\n5 parsed = ProcessSQLStatements.Parse(sr);\n\
    }\n6 init = SxmInit.initialize ();\n}\ncatch (SxmException sxmEx){\n    Exception\
    \ iex = SxmException.getInnermostException(sxmEx);\n    errorMessage = iex.Message;\n\
    }\ncatch (System.Exception ex){\n    errorMessage = ex.Message;\n}\nfinally {\n\
    \    if (errorMessage != null){\n        string initResult = String.Format (\"\
    jsDD: {0}, Parsed: {2}, Init: {3}, Error: {4}\",\n        jsDD, parsed, init,\n\
    \        errorMessage);\n        Log.Debug(\"initDB\", initResult);\n    }\n}\n\
    ```\n\n第 4 到第 6 行是初始化的地方。初始化应该始终包含带有 `finally` 块的 `try-catch` 结构中。`parse` 和 `initialize`\
    \ 方法在出错时会抛出 `SxmException`。实例化 `DatabaseDescriptor` 时的错误也会导致 `SxmException`。在我们的示例中，我们捕获了\
    \ `SxmException` 和基类 `System.Exception`。`SQLite.XM` 库中发生的绝异常都会被重新抛出为 `SxmException`。事实上，库中所有的\
    \ `try-catch` 块都会重新抛出 `SxmException`。你唯一会在库中看到另一种异常的情况是由于某些未捕获的情况。然而，这种情况是不常见的，且只允许在极端情况下发生。你应该始终捕获\
    \ `SxmException` 和基类 `System.Exception`。很多时候不需要基类异常捕获，但包含它并无害，可以作为一种保障。实际上，你所有的\
    \ `try-catch` 都应该捕获基类异常。\n\n在 `SxmException` 处理器内部，你会看到对 `getInnermostException`\
    \ 的调用。该方法返回根异常。SQLite.XM 会在适当设置内部异常。这对于追踪错误很有帮助，但很多时候你只感兴趣获取根源。如果没有内部异常，`getInnermostException`\
    \ 将仅返回顶层异常。\n\n`parse` 和 `initialize` 方法在成功完成后会返回 `true`。当然，第 4 行的 `new` 语句返回一个\
    \ `DatabaseDescriptor` 实例。我们可以利用这一知识帮助我们更容易地识别错误源。通过将返回值初始化为 `null` 和 `false`（见第\
    \ 1、2 和 3 行），我们随后可以在 `finally` 块中检查这些值的状态，以查看异常发生的位置。例如，如果我们进入了 `finally` 块并发现\
    \ `jsDD` 非空但 `parsed` 和 `init` 为 `false`，我们可以合理地推断出错误发生在 `Parse` 调用中。异常消息通常会指向问题所在代码，你始终可以查看堆栈跟踪以找到错误源。但这确实提供了一定的便利性，并且在共享方法中发生错误时，可以稍微简化问题。\n\
    \n### SxmException 对象\n\n下面是我故意制造的数据库超时错误产生的 `SxmException` 对象的输出。\n\n![](img/Image00024.jpg)\n\
    \n所有 SxmExceptions 的 `Data` 属性都包含一个 `SxmErrorCode` 键，它返回错误的枚举值。当然，也会总是设置一个错误消息。你可以通过检查检查位于\
    \ `Defines.cs` 中的枚举 `Defines.SxmErrorCode` 来查看所有可能的 `SxmErrorCodes`。如果 `SxmErrorCode`\
    \ 设置为 `sqliteException`，则表示错误源于 SQLite 内部。在这种情况下，`Data` 属性字段中另一个名为 `sqliteErrorCode`\
    \ 的键。这是 SQLite 分配给该错误的错误代码。所有 SQLite 错误代码列表请附录 A。你可以在 `ErrorMessages.cs` 源文件中找到所有\
    \ SQLite.XM 错误列表。当存在内部异常时，`sxmErrorCode` 将设置为 `innerException`。当然，`InnerException`\
    \ 属性也会被设置。\n\n你可以使用以下代码抛出你自定义的 `SxmException`。\n\n```csharp\nthrow new SxmException(\"\
    Some error.\", Defines.SxmErrorCode);\n```\n\n### 事务处理\n\n让我们来看 `SxmException`\
    \ 的错误处理。下面的代码执行了一个简单的插入，紧接着是搜索。然后检索并提交搜索结果。我将不再赘述代码，让我们只关注错误本身。\n\n```csharp\n\
    void process() {\n    try {\n        using (SxmTransaction sxmTransaction = new\
    \ SxmTransaction()){\n            // ... 插入逻辑 ...\n            // ... 搜索逻辑 ...\n\
    \            if (sxmTransaction.executeQuery() == SQLiteErrorCode.Busy){\n   \
    \             Thread.Sleep(50);\n            }\n            sxmTransaction.commitTransaction();\
    \ // 重试\n        }\n    } catch (SxmException sxmEx){\n        throw SxmException.getInnermostException(sxmEx);\n\
    \    } catch (System.Exception ex){\n        throw ex;\n    }\n}\n```\n\n"
- fmt: "\nThere is no “right” choice. Any one of these may be more or less appropriate\
    \ given different circumstances. By using the first option, you are essentially\
    \ saying that ANY exception that occurs while a transaction is active should result\
    \ in a rollback. The reason for this, is that all exceptions will exit the `using`\
    \ block. Remember our earlier rule: exiting a `using` block with an active transaction\
    \ will result in a rollback. This is the error processing strategy that I use\
    \ most. I feel that it best fits the spirit of transactions and how they are meant\
    \ to be used.\n\nThe second try-catch option allows you to examine an exception\
    \ and and take some remedial action before exiting the `using` block. You could,\
    \ presumably, decide to commit the currently active transaction or retry a failed\
    \ operation or execute other intermediate operations. This could be useful if\
    \ you have some cleanup of your own that you need to perform first before exiting\
    \ the `using` block, or if you wish to be able to commit a partially successful\
    \ transaction. I generally don’t find this strategy to be very useful. Generally\
    \ speaking, transactions are meant to be short-lived operations that either succeed\
    \ or fail in their entirety. And it is best to not perform other work inside a\
    \ transaction that needs its own cleanup.\n\nThe last try-catch option gives you\
    \ fine-grained control over how to process individual exceptions that occur inside\
    \ the `using` block. You might choose to use this strategy if you’re performing\
    \ multiple independent transactions using a single transaction object. See the\
    \ code fragment below.\n\n```java\ntry {\n  using (SxmTransaction sxmTransaction\
    \ = new SxmTransaction(\"jsearch\")){\n    try {\n      ir = sxmTransaction.executeInsert(\"\
    registerCompany\", parameterValues);\n      if (ir.SynchID == null || ir.RecordID\
    \ == -1L)\n        throw new SxmException(new ErrorMessage(\"Insert error @ processInsert.\"\
    , Defines.SxmErrorCode.userDefined));\n      if (sxmTransaction.commitTransaction()\
    \ != SQLiteErrorCode.Ok)\n        throw new SxmException(new ErrorMessage(\"Commit\
    \ error @ processInsert.\", Defines.SxmErrorCode.userDefined));\n    }\n    catch\
    \ (System.Exception ex){\n      sxmTransaction.rollbackTransaction();\n    }\n\
    \    try {\n      ir = sxmTransaction.executeInsert(\"newRegistration\", parameterValues);\n\
    \      if (ir.SynchID == null || ir.RecordID == -1L)\n        throw new SxmException(new\
    \ ErrorMessage(\"Insert error @ processInsert.\", Defines.SxmErrorCode.userDefined));\n\
    \      if (sxmTransaction.commitTransaction() != SQLiteErrorCode.Ok)\n       \
    \ throw new SxmException(new ErrorMessage(\"Commit error @ processInsert.\", Defines.SxmErrorCode.userDefined));\n\
    \    }\n    catch (System.Exception ex){\n      sxmTransaction.rollbackTransaction();\n\
    \    }\n    sxmTransaction.executeQuery(\"findCompany\", null);\n    return sxmTransaction.getAllRows();\n\
    \  }\n}\n```\n\nThe transaction object above is used to execute two independent\
    \ transactions. If the first transaction fails, the second is still permitted\
    \ to execute. If the second transaction fails, the query statement is still permitted\
    \ to run. If you have independent transaction, you might decide to process exceptions\
    \ inside the `using` block in this manner. This sequence leaves one unanswered\
    \ question: what happens if the rollback fails? If there is an error executing\
    \ a rollback, an exception is thrown. This is true unless the rollback is being\
    \ executed by the `using` block cleanup code. The reason for throwing an exception,\
    \ is a.\n\n**Programming for errors**\n\nWhat do I mean when talking about minimizing\
    \ your codes error profile? Well, it turns out we could do much better. We made\
    \ four modifications that significantly improved code. [.]\n\nIn the process of\
    \ tightening up the code, we also improved resource usage. How, you ask. The `SxmTransaction`\
    \ object automatically goes out of scope when it exits the `using` block, making\
    \ it immediately available for garbage collection. By simply taking a critical\
    \ look at our original design, we found a few simple openings where we could improve\
    \ usability. The net result is not only more robust, resource efficient code but\
    \ code that is easier to read, write and harder to get wrong.\n"
