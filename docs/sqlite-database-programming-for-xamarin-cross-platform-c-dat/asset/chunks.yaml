    \ to the Hotriot C# documentation for details. Here: `https://hotriot.com/hrCSAPI/hotriot_interface_guide.htm`\n\
    * Line 5 checks the result code from the post that was performed on line 4. If\
    \ successful, the `postRegistrationlocal` method is called, where the registration\
    \ record is saved to device database, otherwise the result code is examined.\n\
    * Line 6 checks to see if the failure was caused by a non-unique data error. If\
    \ it was, the result message is retrieved.\n* Line 7 checks the result message\
    \ to see if the password field was the cause of the non-unique data error. This\
    \ check is only needed if more than one field in a record could have caused this\
    \ error. I added this to the code just to illustrate how it’s done.\n\nAs a side\
    \ note, you might be interested as what’s returned in `resultMessage` field for\
    \ invalid data errors and non-unique data errors. The validation text you enter\
    \ on step 4 of the Hotriot create database is returned for invalid data errors\
    \ and the validation text you enter in step 5 is returned for non-unique data\
    \ errors. By inspecting the result message, you can easily determine the field\
    \ that triggered the error. When I set the validation text, I always start with\
    \ the field name followed by a colon. This makes it really easy to identify the\
    \ offending field.\n\nIt’s okay to check for the existence of a connection before\
    \ doing some operation that requires connectivity. But it’s not something you\
    \ can really rely on. You could check and find that a connection exists and then\
    \ a fraction of a millisecond later it’s gone. Regardless of whether you think\
    \ a connection exists, you will need to put in the logic to handle connectivity\
    \ errors. A connection check is really only useful when you receive a negative\
    \ response. In such a case, you might decide to skip connection-based operation\
    \ or take some alternate action, such as alerting the use.\n\nIf your app is designed\
    \ to allow users to perform offline inserts into tables that include unique fields,\
    \ for example, registering while in airplane mode. Then there will be no way to\
    \ be sure at the time of the insert that a particular fields is unique from all\
    \ other values saved by other users. You will be left with little choice but to\
    \ design some mechanism where a user can be asked to modify their entry if a unique\
    \ filed is later found to be non-unique.\n\n### Writing a synchronization error\
    \ handler\n\nThe task of a synchronization error handler should be limited to\
    \ determining whether the entry in the replication log which triggered the synchronization\
    \ failure should or should not be removed. That’s it! This is done by setting\
    \ the `removeFlag` of the `SynchResponse` object to either `true` or `false`.\
    \ Actual error correction should be handled by a post-synchronization delegate\
    \ not the error handler; this is explained in the next section ‘Post-synchronization\
    \ delegate processing.’ The default synchronization error handler is shown below.\n\
    \n```cs\ninternal static async Task myErrorDel(SynchDescriptor synchDescriptor,\
    \ SynchResponse synchResponse)\n{\n    if (synchResponse.synchErrorType == SQLiteXM.Defines.SynchErrorTypes.exception)\n\
    \    {\n        if (synchResponse.exceptionSynchError.exceptionType.Equals(\"\
    WebException\") == true ||\n            synchResponse.exceptionSynchError.exceptionType.Equals(\"\
    IOException\") == true ||\n            synchResponse.exceptionSynchError.exceptionType.Equals(\"\
    OutOfMemoryException\") == true)\n        {\n            synchResponse.removeFlag\
    \ = false;\n        }\n    }\n    else\n    if (synchResponse.synchErrorType ==\
    \ SQLiteXM.Defines.SynchErrorTypes.processing)\n    {\n        if (synchResponse.processingSynchError.resultCode\
    \ == Hotriot.DB_FULL_EXCEPTION)\n        {\n            synchResponse.removeFlag\
    \ = false;\n        }\n    }\n}\n```\n"
