  trans: "\n\n这可能需要一些说明。使用带有活动结果集的 `SxmTransaction` 对象执行数据库更新操作，将导致结果集的数据读取器被关闭，以便更新能够进行。如果数据读取器未关闭，更新操作（在本例中为删除操作）将会导致\
    \ `InvalidOperationException` 失败；“在数据读取器激活时无法设置命令（Cannot set CommandText while\
    \ data reader is active）”。我们决定关闭数据读取器并允许更新继续比让更新失败要好。如果这不符合你的特定需求，解决办法非常简单。\n\n\
    *   可以使用 `getAllRows` 方法将整个结果集读取到集合中，然后遍历该集合。我们在上面的倒数第二个示例中就是这样做。\n*   或者，使用独立的\
    \ `SxmTransaction` 来执行更新。\n\n以下是获取锁的操作列表。\n\n*   `excuteInsert :` RESERVED\n*\
    \   `executeQuery :` READ\n*   `executeQueryDirect :` READ\n*   `executeUpdate\
    \ :` RESERVED\n*   `executeUpdateDirect :` RESERVED\n*   `executeDelete :` RESERVED\n\
    *   `executeDeleteDirect :` RESERVED\n*   `commitTransaction :` EXCLUSIVE，然后释放所有锁\n\
    \n### 使用 SxmSTransaction 类实现事务序列化\n\n在上一节中，我们解释了各种操作如何影响数据库锁的状态，以及数据库如何使用锁状态管理并发。重申一下，如果你的应用程序保证在任何时候只有一个活跃的事务对象，那么与锁定和并发相关的问题就可以很大程度上被忽略。然而，如果你的程序在多个线程上执行数据库操作，那么并发就是一个需要考虑的问题。\n\
    \n在“锁定与并发”部分中，我们嵌套了事务，以人为地创建会引起阻塞并最终导致某些超时的条件。当然，这是为了说明锁定和并发是如何工作的。在实际应用程序中，你可能不会嵌套事务。很大情况下，应用程序会在不同的线程上执行多个事务。那么，这种差异如何影响锁定和并发呢？它实际上对我们有利。例如，当发生锁竞争时（例如在存在活动读锁时尝试获取排他锁），SQLite\
    \ 会阻塞尝试获取锁的线程一段时间，直到等待锁状态发生变化。如果锁状态在超时结束之前发生变化，则被阻塞的操作将允许继续。\n\n总的来说，SQLite 提供了非常好的并发性。只要你不长时间持有锁，由于锁定导致的超时就不应该是问题。然而，超时是极端情况；你真的需要做得比简单不通过超时阈值更好。你应该努力避免任何可能干扰用户的延迟。那么，我们如何做到这一点呢？\n\
    \n*   成功并发数据库处理的第一条规则是始终尽可能减少在 `SxmTransaction` 的 `using` 块中花费的时间。这是你防止阻塞的第一线防御。虽然它不能消除阻塞，但有助于减少阻塞。所需的并发量越高，这条规则就越重要。\n\
    \n对于大多数应用程序而言，数据库读取不受阻地进行比写入更关键。除了注册等某些特定操作外，许多写入操作都可以延迟。例如，当向招聘搜索网站提交职位发布时，实际发布在未来的某个时间发生可能是没问题的。职位信息立即出现在职位数据库中还是在几秒钟后有什么区别呢？我想表达的是，在许多情况下，延迟插入是完全可以的。如果你“节流”插入，你就能有效地释放数据库来处理其他命令。实现这一点的一种方法是将所有更新数据库的事务序列化；一个接一个地处理它们。幸运的是，SQLite.XM\
    \ 库包含一个执行事务序列化的类。该类是 `SxmSTransaction`，它继承自 `SxmTransaction` 类。下面是从我们早期的示例中重写的代码片段，改用使用\
    \ `SxmSTransaction` 类。\n\n```java\nArrayList paramVaues = new ArrayList();\n\n\
    using (SxmTransaction sxmTransaction = new SxmSTransaction(\"jsearch\")){\n  \
    \  sxmTransaction.executeQuery(\"getAllCompanies\", null);\n    while ((company\
    \ = sxmTransaction.getNextRow()) != null) \n        if (company[\"name\"].Equals(\"\
    \") == true) {\n            paramVaues.Clear ();\n            paramVaues.Add(company[\"\
    companyPK\"]);\n            sxmTransaction.executeDelete(\"deleteCompanyReg\"\
    , paramVaues);\n        }\n    sxmTransaction.commitTransaction ();\n}\n```\n\n\
    与之前的示例唯一的区别在于在 `using` 块中实例化了 `SxmSTransaction` 而不是 `SxmTransaction`，见第 1 行。除了这个微小区别外，其他一切保持不变。`SxmSTransaction`\
    \ 的默认行为是阻塞等待轮。你可以通过在构造函数中包含毫秒值来修改此行为；见下文。\n\n```java\nSxmTransaction sxmTransaction\
    \ = new SxmSTransaction(\"jsearch\", 10000)\n```\n\n在上一行中，`SxmSTransaction` 构造函数将在等待\
    \ 10 秒后抛出 `SxmTimeoutException`。`SxmSTransaction` 类将序列化任何事务，而不是更新数据库的事务。一个合理的问题是：我真的需要费这些精力吗？如果你没有执行大量的并发写入，并且长时间持有读锁，那么我会说不需要。你可以让数据库根据需要阻塞任何操作，直到锁状态改变并允许阻塞的操作进行。然而，如果你执行大量的并发写入并混合必须服务的数据库读取，那么你可能考虑这种策略。\n\
    \n如果你决定延迟写入操作，你应该在工作线程上执行它们，而不是 UI 线程。原因显而易见。为了序列化某些事务以释放处理器处理其他工作，却让用户界面等待事务是没有意义的。\n\
    \n### 动态查询\n\n到目前，我们所有的查询都是静态定义在 SQL 语句文件中。这里的静态指的是参数化查询，只有查询中用户提供的数据变化；查询逻辑保持不变。许多应用程序要求某些查询具有更大的灵活性。这些应用需要能够创建查询，其查询逻辑可能会以无法预知的方式变化。这些通常被称为动态查询或\
    \ ad hoc 查询（临时查询）。我将动态查询分为两个级别：\n\n*   完全动态查询。这些是在代码中完全组装的查询。\n*   部分动态查询。这些是部分静态和部分动态的查询。\n\
    \n让我们单独看看这些。\n\n完全动态查询通常用于搜索条件组合未预先的情况。例如，想象你访问一个房地产网站，该网站允许你根据几十个用户可选择的标准来搜索房屋，例如：\n\
    \n*   面积\n*   浴室数量\n*   卧室数量\n*   泳池\n*   等……\n\n"
- fmt: "\nThe problem with trying to create a static query to satisfy such a search,\
    \ is that you do not know in advance the combination of criteria any particular\
    \ user is going to select. The way this is handled is to allow users to select\
    \ the constraints that they wish to search and then to dynamically build a query\
    \ to satisfy their selections. As you can imagine, this can get somewhat complex.\
    \ And, to make matters worse, there is an issue with indexes. I am not going to\
    \ get into this in detail, but the order in which fields are defined in a compound\
    \ index affects its usability for any particular query. It’s not realistic to\
    \ formulate indexes for all possible query combinations for a fully dynamic query.\
    \ In order to solve this problem, you need to apply some crafty schema definition\
    \ techniques to the table being queried. Processing of fully dynamic queries is\
    \ beyond the scope of this book. So I don’t go into them in any additional detail.\n\
    \n### Partially Dynamic Queries\n\nPartially dynamic queries are queries where\
    \ only part of the query logic is dynamically constructed. These queries are mostly\
    \ static with select portions that are variable. \n\nFirst, I should probably\
    \ explain why you would even need partially dynamic queries. Imagine your app\
    \ includes a search that could return several thousand records. You would not\
    \ want to let such a query execute without some constraint on the number of selected\
    \ records. What you want to do is to paginate the search results. That is, return\
    \ the records in some limited way, for example, 20 per page. To do this, your\
    \ query needs to include a `LIMIT` and `OFFSET` clause. These SQL constructs tell\
    \ the database how many records to select and from where in the record set to\
    \ start selecting. Below is a rewritten version of our job selection query.\n\n\
    ```\nSELECT * FROM jobPosting WHERE companyRegFK = ? LIMIT n OFFSET m\n```\n\n\
    In order to select the first 20 records, the statement would be: \n\n```\nSELECT\
    \ * FROM jobPosting WHERE companyRegFK = ? LIMIT 20 OFFSET 0\n```\n\nTo select\
    \ the next 20 records:\n\n```\nSELECT * FROM jobPosting WHERE companyRegFK = ?\
    \ LIMIT 20 OFFSET 20\n```\n\nAs you can see, the `offset` value needs to change\
    \ in order to paginate the search results. In this example, we set the record\
    \ read limit to 20 records. But this could also be a variable, for example, if\
    \ you allow the number of returned records to be user selectable.\n\nLet’s take\
    \ a look at another example. Imagine we want to include the following query as\
    \ part of our job search application.\n\n```\nSELECT * FROM jobPosting WHERE companyRegFK\
    \ IN (?)\n```\n\nThe problem with this query as it is written, is that you cannot\
    \ parameterize an `IN` clause for a variable number of criterion. In order for\
    \ this query to work for more than a single input parameter, it will need to be\
    \ modified dynamically.\n\nLet’s rewrite our job select query from earlier to\
    \ include an `IN` clause and a limit/offset. Below is our new query as it appears\
    \ in the SQL statements properties file. This query is intended to selects all\
    \ jobs posted by all companies.\n\n```\n[getAllCompanyJobs] \n\n```\n[SELECT *\
    \ FROM jobPosting WHERE companyRegFK IN ({0}) LIMIT {1} OFFSET {2}]\n```\n\nThere\
    \ are actually two ways you can dynamically modify this query:\n\n* For each search\
    \ parameter, insert a placeholder in the `IN` clause.\n* Insert the actual search\
    \ parameters in the `IN` clause.\n\nI’ll provide an example for each of these\
    \ options, but I can tell you, the first option is your better choice. Here’s\
    \ why:\n\n* It is much easier to send query parameters to a query rather than\
    \ trying to construct a query string.\n* Sticking with parameterized queries keeps\
    \ your code consistent whether using static or partially dynamic queries. \n*\
    \ Parameterized queries are much less prone to SQL injection attacks. When used\
    \ correctly, they are probably immune to this sort of attack.\n\n### Using Parameterized\
    \ Placeholders\n\nLet’s start with inserting placeholders for the search parameters.\
    \ For this search, we will be inserting a placeholder for each primary key value\
    \ that is passed as a query parameter. Below is a screenshot of the administrators\
    \ get jobs search page.\n\n![](Image00016.jpg)\n\nThe `OnCreate` method for this\
    \ activity is pretty basic. The method `getAllCompaniesPK()` which is called on\
    \ line 1, performs a search of the company registration table, retrieving the\
    \ primary key values for each registration.\n\n```\nprivate static int pageNumber;\n\
    private static int recordCount = 10;\nprotected override void OnCreate (Bundle\
    \ bundle)\n{\n    pageNumber = 0;\n    base.OnCreate(bundle);\n    SetContentView(Resource.Layout.AdminGetAllJobs);\n\
    \    1 ArrayList companiesList = getAllCompaniesPK();\n    Button cancelGetAllJobsButton\
    \ = null;\n    cancelGetAllJobsButton = FindViewById<Button>(Resource.Id.cancelGetAllJobsButton);\n\
    \    cancelGetAllJobsButton.Click += () => { finish(); };\n    Button getJobsNextButton\
    \ = FindViewById<Button>(Resource.Id.getJobsNextButton);\n    2 getJobsNextButton.Click\
    \ += () => { GetJobs(companiesList); pageNumber++; };\n    Button getJobsPreviousButton\
    \ = FindViewById<Button>(Resource.Id.getJobsPreviousButton);\n    3 getJobsPreviousButton.Click\
    \ += () => { if(pageNumber > 0) pageNumber--; };\n}\n```\n\nThese values are placed\
    \ in an array. The select statement for this search is shown below. For brevity,\
    \ the `getAllCompaniesPK` method is not shown.\n\n```java\nvoid GetJobs(ArrayList\
    \ companiesList)\n{\n    int recordCount = 10;\n    SxmTransaction sxmTransaction\
    \ = null;\n    try\n    {\n        string[] paramHolders = Enumerable.Repeat(\"\
    ?\", companiesList.Count).ToArray();\n        string csvParamHolders = String.Join(\"\
    ,\", paramHolders);\n        SxmTransaction sxmTransaction = null; \n        string\
    \ rawSelect = SqlStatements[\"getAllCompanyJobs\"];\n        string selectStatement\
    \ = String.Format(rawSelect, csvParamHolders, recordCount, pageNumber);\n    \
    \    using (SxmTransaction sxmTransaction = new SxmTransaction(\"search\"))\n\
    \        {\n            sxmTransaction.executeQueryDirect(selectStatement, companiesList);\n\
    \            BuildTableInline(sxmTransaction);\n        }\n    }\n    catch (Exception\
    \ ex)\n    {\n        // Exception processing here.\n    }\n}\n```\n\nThis method\
    \ retrieves records from the job postings database. The select statement for this\
    \ query as it appears in the SQL statements properties file is shown below.\n"
