    将文件存储在数据库内部还是外部，在很大程度上取决于你打算同步的后端服务器。如果你使用 `SQLiteXM` 的默认同步方式，那么你自然会同步到 `HotRiot`。`HotRiot`
    不包含 `BLOB` 数据类型，因此没有办法将文件存储在记录内部。在 `HotRiot` 中，所有文件都存储在外部的 `AWS S3` 中，数据库仅包含一个指向文件的指针。现在，这并不意味着如果你想在设备上将文件存储在数据库内部就无法这样做。但如果你确实这样做，你需要编写一个预处理代理（pre-processing
    delegate），以便将文件数据传输到磁盘上的实际文件，然后在记录中包含新创建文件的完整路径。这是一项相当的工作，会增加应用程序的复杂性和内存占用。取决于所处理文件的大小和设备的能力，内存开销可能从微不足道到完全成为负担。此外还有另一个考虑因素。由于你将在同步过程中创建文件，因此你需要从磁盘上清理这些文件。`SQLite.XM`
    同步包含了同步后处理，这可以为你提供执行删除操作的机制。但这是你需要添加到同步过程的另一个自定义部分。我的建议是：除非有其他充分的理由，否则在与 `HotRiot`
    同步时，将文件存储在设备数据库外部，仅在记录中包含一个文件指针。


    如果你与支持 `BLOBs` 的服务器同步，那么你可能会选择将文件存储在 `SQLite` 数据库内部。该决定取决于许多因素，包括服务器如何管理记录。在任何情况下，为了做出充分知的决策，你需要了解正在同步的记录是如何处理的。当某条记录被选中用于同步时，整个记录数据将从设备数据库中读取并移交给
    `SQLite.XM` 同步处理引擎。同步执行的第一工作是检查系统是否注册了预处理代理，如果有，则将记录传递给代理进行额外处理；否则，记录将“按原样”发送到服务器进行同步。预处理代理将执行其逻辑，可能会从输入记录中创建额外的记录。随后，预处理代理返回的记录列表将同步到服务器。最后，如果注册了同步后代理，它将被调用。需要注意的是，整条记录都会被读取并通过同步处理链。如果存储在数据库中的文件很大，根据设备限制，可能会导致内存问题。当然，当与
    `HotRiot` 以外的后端同步时，你需要编写执行实际数据云端传输的代码。在这种情况下，你对同步处理具有完全控制权。你可以选择将文件存储在设备数据库外部，然后将其存储在服务器的数据库内部。这不受限制。无论如何，我的建议仍然是：除非有其他充分的理由，否则在与自定义后端同步时，将文件存储在设备数据库外部，仅在记录中包含一个文件指针。


    ## 协调同步


    在早前的“同步详情”章节中，我提到过以下内容：


    “在同步运行期间（即非等待状态）对记录进行插入、更新和删除是完全没问题的；你不需要执行任何协调。”


    所以，如果你感到有些困惑，也是可以的。在大多数情况下，你的应用程序独立于同步进行操作是安全的。因此，上面的引用通常适用。然而，在一种情况下，你需要将应用程序的活动与同步进行协调。


    当同步处于运行状态时，你无法安全地删除任何可能处于同步过程中的记录所包含的文件。你可能记得我们之前关于同步同步的讨论，`HotRiot` 要求文件附件存储在数据库外部。这可能会导致潜在的冲突。你的应用程序可能会尝试删除一个
    `SQLite.XM` 正在上传到 `HotRiot` 服务器的文件。当然，这是不可接受的并且需要被避免。解决方案是简单的：在删除任何可能处于同步过程中的记录所包含的文件之前，获取这些记录所在数据库的同步锁。你使用
    `SxmInit` 类中的静态方法 `getSynchMonitor` 来实现此；参见下方的方法签名。


    ```

    public static bool getSynchMonitor (string databaseName, int millisecondsTimeout)

    ```


    该方法接受两个参数：


    *   你想要获取同步锁的数据库名称。

    *   你希望尝试获取锁时等待的毫秒数。该方法在获取锁或在指定的等待时间结束后立即返回。发送值 `Timeout.Infinite` 将导致该方法无限等待直到获取锁。


    如果获取了锁，`getSynchMonitor` 方法返回 `true`，否则返回 `false`。如果正在复制的记录/文件很大或连接质量很差，`SQLite.XM`
    同步代码可能会长时间持有同步锁。这是你在设计中需要考虑的。你绝对不希望在用户界面线程上尝试获取锁而长时间阻塞。要么在工作线程上执行文件删除，要么将获取锁的超时时间设置为非常短的时间，并设计你的删除逻辑以应对获取锁失败的情况。


    让应用程序不要比需要更长时间持有同步锁是非常重要的。当应用程序持有锁时，同步会被阻塞。你通过调用 `SxmInit` 类的静态方法 `releaseSynchMonitor`
    来释放锁；参见下方的方法签名。


    ```

    public static void releaseSynchMonitor (string databaseName)

    ```


    该方法接受接受一个参数：想要释放同步锁的数据库名称。对于每一个返回 `true` 的对应 `getSynchMonitor` 调用，**必须**调用此方法。这样做会导致同步无限阻塞。


    为了最大化与应用程序提出的锁请求的并发性，`SQLite.XM` 会为每个正在同步的记录获取并释放同步锁。例如，如果复制日志中有十条记录，则会对每条记录获取并释放锁。该循环将重复十次，让你的应用程序有机会在同步处理中间穿插自己的锁获取。


    ## 自定义同步


