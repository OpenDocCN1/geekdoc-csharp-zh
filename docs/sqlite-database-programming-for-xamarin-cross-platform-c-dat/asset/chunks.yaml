  trans: "\n尝试创建一个静态查询来满足此类搜索，问题在于你无法预先知道任何特定用户会选择哪些标准的组合。处理这种问题的方法是允许用户选择他们想要搜索的约束条件，然后动态构建查询以满足他们的选择。你可以想象的，这可能会变得相当复杂。更糟糕的是，索引存在一个问题。我不会详细阐述这一点，但复合索引中字段定义的顺序会影响其对任何特定查询的可用性。对于完全动态的查询，要为所有可能的查询组合制定索引是不现实的。为了解决这个问题，你需要对被查询的表应用一些巧妙的模式定义技术。处理完全动态查询超出了本书的范围，因此我不会对其进行任何额外的详细介绍。\n\
    \n### 部分动态查询\n\n部分动态查询是指查询逻辑中部分是动态构建的查询。这些查询大部分是静态的，只有某些部分是可变的。\n\n首先，我可能应该解释一下为什么你需要部分动态查询。假设你的应用程序包含一个可能返回数千条记录的搜索。你不会希望在对所选记录数量没有限制的情况下执行此类查询。你想做的是对搜索结果分页。也就是说，以某种限制的方式返回记录，例如每页\
    \ 20 条。为了做到这一点，你的查询需要包含 `LIMIT` 和 `OFFSET` 子句。这些 SQL 结构告诉数据库选择多少条记录，以及从记录集的何种位置开始选择。以下是我们的职位选择查询的重写版本。\n\
    \n```\nSELECT * FROM jobPosting WHERE companyRegFK = ? LIMIT n OFFSET m\n```\n\
    \n为了选择前 20 条记录，语句将是：\n\n```\nSELECT * FROM jobPosting WHERE companyRegFK = ? LIMIT\
    \ 20 OFFSET 0\n```\n\n选择接下来的 20 条记录：\n\n```\nSELECT * FROM jobPosting WHERE companyRegFK\
    \ = ? LIMIT 20 OFFSET 20\n```\n\n如你所见，`offset` 值需要更改以便对搜索结果进行分页。在这个示例中，我们将记录读取限制设置为\
    \ 20 条记录。但也可以是一个变量，例如，如果你允许返回的记录数量由用户选择。\n\n让我们来看另一个例子。假设我们想将以下查询作为职位搜索应用程序的一部分。\n\
    \n```\nSELECT * FROM jobPosting WHERE companyRegFK IN (?)\n```\n\n该查询按目前写法的问题是，你无法对变数量的标准的\
    \ `IN` 子句进行参数化。为了让此查询适用于多一个输入参数，它需要被动态修改。\n\n让我们重写之前的职位选择查询，以包含一个 `IN` 子句和限制/偏移。以下是我们的新查询在\
    \ SQL 语句属性文件中的形式。此查询旨在选择所有公司发布的所有职位。\n\n```\n[getAllCompanyJobs] \n\n```\n[SELECT\
    \ * FROM jobPosting WHERE companyRegFK IN ({0}) LIMIT {1} OFFSET {2}]\n```\n\n\
    实际上你有两种方法可以动态修改此查询：\n\n*   对于每个搜索参数，在 `IN` 子句中插入一个占位符。\n*   在 `IN` 子句中插入实际的搜索参数。\n\
    \n我会为这些选项中的每个都提供一个示例，但我可以告诉你，第一个选项是你的更好的选择。原因如下：\n\n*   向查询发送查询参数比尝试构建查询字符串要容易得多。\n\
    *   无论使用静态查询还是部分动态查询，坚持使用参数化查询（Parameterized queries）可以保持你代码的一致性。\n*   参数化查询不容易受到\
    \ SQL 注入攻击。当正确使用时，它们可能对这类攻击免疫。\n\n### 使用参数化占位符\n\n让我们从为搜索参数插入占位符开始。对于这次搜索，我们将为每个作为查询参数传递的主键值插入一个占位符。以下是管理员获取职位搜索页面的截图。\n\
    \n![](img/Image00016.jpg)\n\n此活动的 `OnCreate` 方法非常基础。在第 1 行调用的 `getAllCompaniesPK()`\
    \ 方法对公司注册表进行搜索，检索每个注册的主键值。\n\n```java\nprivate static int pageNumber;\nprivate\
    \ static int recordCount = 10;\nprotected override void OnCreate (Bundle bundle)\n\
    {\n    pageNumber = 0;\n    base.OnCreate(bundle);\n    SetContentView(Resource.Layout.AdminGetAllJobs);\n\
    \    1 ArrayList companiesList = getAllCompaniesPK();\n    Button cancelGetAllJobsButton\
    \ = null;\n    cancelGetAllJobsButton = FindViewById<Button>(Resource.Id.cancelGetAllJobsButton);\n\
    \    cancelGetAllJobsButton.Click += () => { finish(); };\n    Button getJobsNextButton\
    \ = FindViewById<Button>(Resource.Id.getJobsNextButton);\n    2 getJobsNextButton.Click\
    \ += () => { GetJobs(companiesList); pageNumber++; };\n    Button getJobsPreviousButton\
    \ = FindViewById<Button>(Resource.Id.getJobsPreviousButton);\n    3 getJobsPreviousButton.Click\
    \ += () => { if(pageNumber > 0) pageNumber--; };\n}\n```\n\n这些值被放在一个数组中。此搜索的选择语句所示。为了简单起见，没有显示\
    \ `getAllCompaniesPK` 方法。\n\n```java\nvoid GetJobs(ArrayList companiesList)\n\
    {\n    int recordCount = 10;\n    SxmTransaction sxmTransaction = null;\n    try\n\
    \    {\n        string[] paramHolders = Enumerable.Repeat(\"?\", companiesList.Count).ToArray();\n\
    \        string csvParamHolders = String.Join(\",\", paramHolders);\n        SxmTransaction\
    \ sxmTransaction = null; \n        string rawSelect = SqlStatements[\"getAllCompanyJobs\"\
    ];\n        string selectStatement = String.Format(rawSelect, csvParamHolders,\
    \ recordCount, pageNumber);\n        using (SxmTransaction sxmTransaction = new\
    \ SxmTransaction(\"search\"))\n        {\n            sxmTransaction.executeQueryDirect(selectStatement,\
    \ companiesList);\n            BuildTableInline(sxmTransaction);\n        }\n\
    \    }\n    catch (Exception ex)\n    {\n        // 异常处理在此。\n    }\n}\n```\n\n\
    此方法从职位发布数据库中检索记录。此查询在 SQL 语句属性文件中的选择语句所示。\n\n"
- fmt: "\nThe `recordCount` and `pageNumber` variables are used to control the limit\
    \ and offset for the search. `recordCount` is hard coded to 10 and never changes.\
    \ However, the page number is incremented or decremented based on whether the\
    \ next or previous button is selected. On line 5, the actual call is made to execute\
    \ the query. Normally, you would call `executeQuery`, passing in the name of the\
    \ query in the SQL statements properties file that you wish to execute. However,\
    \ in this example, we dynamically constructed our query so we will be calling\
    \ the `executeQueryDirect` method instead, passing in the fully constructed SQL\
    \ statement. The method `executeQuery` should be used whenever executing a static\
    \ select statement. The method `executeQueryDirect` is used when executing a dynamic\
    \ query.\n\n## SQL Injection dangers\n\nIn this example, I did something that\
    \ I warned you earlier not to do, which is: modify a SQL statement by directly\
    \ editing the SQL string. I am not talking about the placeholders that we inserted,\
    \ that was safe. I am referring to the query control values of the limit and offset\
    \ clause. However small this change, it represents an alteration to the SQL string\
    \ in a potentially unsafe manner. In this case, I allow the exception for two\
    \ reasons:\n\n- In our example, the offset number supplied to the offset clause\
    \ is not an input that is taken directly from the user. It is calculated in code\
    \ based on whether the previous or next button is selected. Therefore, with proper\
    \ bounds checking, the possibility of using an errant, or to be more accurate,\
    \ malicious input is very low.\n- The inputs are very easy to accurately validate.\
    \ Only a number should be supplied to the limit and offset clauses.\n\nBut don’t\
    \ get too comfortable with this and repeat this in other ways without really thinking\
    \ things through. Let me go through an example to show how this seemingly simple\
    \ alteration can run afoul. Below is our query string from earlier. It is rewritten\
    \ with the limit hard coded to 10, of course, the offset is still dynamic.\n\n\
    `SELECT * FROM jobPosting WHERE companyRegFK IN ({0}) LIMIT 10 OFFSET {1}`\n\n\
    Now, for this example, assume the offset value is a user supplied input and that\
    \ there is an error in our code with validation. Further, assume a malicious user\
    \ supplies the following offset value.\n\n`1;DROP TABLE jobPosting`\n\nWhen we\
    \ construct our query, the final query string will look something like.\n\n`SELECT\
    \ * FROM jobPosting WHERE companyRegFK IN (?)`\n\n`LIMIT 10 OFFSET 1;DROP TABLE\
    \ jobPosting`\n\nYou can probably guess what will happen when we execute this\
    \ nifty little bit of SQL; the entire `jobPosting` table will be deleted. So,\
    \ as you can see, things can get ugly very easily when dynamically constructing\
    \ queries.\n\nAs an alternative to setting query control values directly using\
    \ `String.Format`, you could use parameterized values. To do this, you would append\
    \ the limit and offset onto the parameter array that is passed to the `executeQueryDirect`\
    \ method. However, you would first need to change the query to the following.\n\
    \n`[getAllCompanyJobs]`\n\n`[SELECT * FROM jobPosting WHERE companyRegFK IN ({0})\
    \ LIMIT ? OFFSET ?]`\n\nThe `String.Format` statement would be modified to the\
    \ following.\n\n`string selectStatement = String.Format (rawSelect, csvParamPlaceHolders);`\n\
    \nFinally, you would need to append the limit and offset values to the parameter\
    \ array list.\n\n`companyList.Add(recordCount);`\n\n`companyList.Add(recordCount*pageNumber);`\n\
    \nI didn’t use this approach for our example for the reasons I stated earlier;\
    \ I felt the way in which we were modifying the query was safe. That being said,\
    \ there are many circumstances where this is the preferred solution. The general\
    \ rules that I follow are:\n\n- Ask yourself: Can the insertion values easily\
    \ and accurately be validated? If the answer is yes, as in our example, then you\
    \ can consider further whether it is appropriate to modify the query control values\
    \ directly.\n- If you are taking SQL inputs directly from users of your app, be\
    \ very suspicious of any answer to the question above other than NO!\n- If you\
    \ are altering the SQL string with anything that could be misidentified as “safe”,\
    \ then modify the query using the parameterized method. It’s much more secure.\n\
    - If in doubt, use the parameterized method.\n\n## Directly inserting query parameters\n\
    \nNow that we’ve shown how to modify a query using parameterized placeholders,\
    \ let’s have a look at how we would modify a query by inserting the search parameters\
    \ directly into the query string.\n\nA new listing of the `GetJobs` method is\
    \ shown below. Instead of constructing a placeholder string as in our earlier\
    \ example, it builds an actual parameter string; see lines 1 thru 3. This parameter\
    \ string is then inserted into the query string on line 4.\n\n```\nprivate void\
    \ GetJobs (ArrayList companiesList)\n{\n  SxmTransaction sxmTransaction = null;\n\
    \  1 for (int i=0; i< companiesList.Count; i++)\n  2   companiesList [i] = \"\
    ’\" + companiesList [i] + \"’\";\n  3 string paramString = string.Join(\",\",\
    \ (string[])companiesList.ToArray(typeof(string))); \n  try\n   {\n      string\
    \ rawSelect = SqlStatements.selectStatements [\"getAllCompanyJobs\"];\n 4 string\
    \ selectStatement = String.Format (rawSelect, paramString, recordCount, recordCount*pageNumber);\n\
    \      using (SxmTransaction sxmTransaction = new SxmTransaction (\"jsearch\"\
    )){\n        sxmTransaction.executeQueryDirect (selectStatement, null);\n    \
    \    BuildTableInline (sxmTransaction);\n      }\n   }\n catch (Exception ex)\n\
    \  {\n    // Exception processing here.\n  }\n}\n```\n\nI do not recommend using\
    \ this approach for constructing a query unless you have some compelling reason.\
    \ This method can create real security problems in all but the simplest cases.\
    \ If you have any doubt about this, go back and reread the section on SQL injection\
    \ dangers.\n\n## Making schema changes\n\nIt’s inevitable that you are going to\
    \ need to make schema changes between releases of your app. With SQLite, there\
    \ are four types of changes that can be made to a schema:\n\n- Creating new tables\n\
    - Updating existing tables with a fields\n- Creating/deleting indexes\n- Dropping\
    \ tables\n\nThere are conceivable other changes that you might make, however,\
    \ the `alter table` statement in SQLite supports a limited subset of commands.\
    \ So modifying a table beyond what is supported would require you to engineer\
    \ a solution of your own. Index definitions are not supported by the `create table`\
    \ statement, as these are managed independently.\n\n## Adding/Modifying tables\n\
    \nAdding a new table is easy, you simply include a new create table statement\
    \ in the `TABLE` section of the SQL statements properties file. What happens when\
    \ you need to make a change to an existing table? In this case, you need to create\
    \ the table for new users and modify the table for existing users. These are inherently\
    \ different operations. Let’s go through an example.\n\nImagine that the first\
    \ release of your application includes a create table statement like the one below.\n\
    \n`CREATE TABLE companyReg (id INTEGER PRIMARY KEY AUTOINCREMENT, companyRegPK\
    \ TEXT, coName TEXT, hrContact TEXT, email TEXT, password TEXT)`\n\nThis is simple\
    \ enough, it creates a company registration table that includes a few basic fields.\
    \ Now imagine that in the next version of your application you decide to include\
    \ the name of the CEO in the registration table. The new create table statement\
    \ is shown below.\n\n`CREATE TABLE companyReg (id INTEGER PRIMARY KEY AUTOINCREMENT,\
    \ companyRegPK TEXT, coName TEXT, hrContact TEXT, email TEXT, password TEXT, ceo\
    \ TEXT)`\n"
