    \ `CommandType` `.Text;`\n\n**`2`** `     addCommandParameters (parameterValues);`\n\
    \n**`3`** `     connDataReader = connCommand.ExecuteReader ();`\n\n`    }`\n\n\
    \ `catch` ` (System.` `Exception` ` ex) `\n\n`    {`\n\n`      logger.log (ex, System.Reflection.`\
    \ `MethodBase` `.GetCurrentMethod ().ToString ());`\n\n`    }`\n\n` }`\n\nCode\
    \ listings are shown with the default color coding used by Xamarin Studio at the\
    \ time of writing. Paragraphs that explain listings will reference line numbers\
    \ that are shown in the left column of the listing. Referencing line numbers do\
    \ not necessarily start on the first line of code. Code listings are mostly devoid\
    \ of basic error checking, error processing, rudimentary optimizations or anything\
    \ else that might increase their length or otherwise detract from their primary\
    \ purpose.\n\nCode formatting\n\nI’ve worked hard to make the code examples as\
    \ easy to read as possible. Most are very short, so that helps a lot. Unfortunately,\
    \ the myriad of screen sizes and devices for eBooks makes formatting uncertain\
    \ at best. Code that displays nicely for one configuration may prove unreadable\
    \ for others.\n\nIt has been my experience that reading this book from a tablet\
    \ in landscape orientation provides the best view. If you find the code examples\
    \ difficult to follow due to formatting, you can try changing the font size to\
    \ see if that helps. Often times, this is enough to set things right.\n\nWho this\
    \ book is for\n\nThis book is designed to be read by mobile app developers that\
    \ are using or intend to use the Xamarin framework and want to learn how to use\
    \ the SQLite.XM library. In order to get the most out of this book, you’ll need\
    \ a basic understanding of C# and have at least some general knowledge of SQL.\
    \ There is no complex SQL or C# in this book, so a basic understanding of each\
    \ is sufficient to get you through. Of course, the more you know the better. If\
    \ you’re a Java developer, you should have no problem with the C# examples. Having\
    \ a basic understanding of Android or iOS development concepts will also be helpful.\
    \ Again, there isn’t any complex Android or iOS employed by any of the sample\
    \ code. For the most part, it’s pretty simple stuff. I try and stay on point and\
    \ focused on SQLite, SQLite.XM and the best database practices for mobile development.\n\
    \nHow to use this book\n\nThis book is intended to be more than a simple guide\
    \ to using SQLite.XM. I try and give advice and make suggestions, and, where appropriate,\
    \ provide you with a rational for making certain engineering choices. Every project\
    \ is different, and the choices you make may very well differ from my advice.\
    \ My hope is that by providing insight into my thinking, I will help you with\
    \ questioning your own decisions. Sometimes you’ll agree with my advice and suggestions\
    \ and other times you won’t. Either way, it doesn’t really matter, so long as\
    \ I promote critical thinking in weighing your own design options, I will have\
    \ done my job. There is rarely one right way when it comes to coding.\n\nIn Part\
    \ 1 of this book, I spend some time talking in general terms about data persistence\
    \ along with issues specific to mobile app development. I also spend a bit of\
    \ time going over the various technologies used in the book to build our data\
    \ persistence layer. I then go on to discuss database design and challenges specific\
    \ to designing for mobile apps.\n\nPart 2 is dedicated to explaining how to use\
    \ SQLite.XM for data persistence on the device. This is the heart of the book.\
    \ If you have some experience with mobile app development, and know a bit about\
    \ relational database design, you may choose to skip Part 1 and jump to this section\
    \ to get right into the specifics of SQLite.XM. If you do decide to skip ahead,\
    \ be sure to first read the section ‘Platform specific code’ as it has some instructions\
    \ that you need to be aware of.\n\nPart 3 is where I explain SQLite.XM and cloud\
    \ replication; how to set up a server-side database and how to get data moved,\
    \ or copied, from the device to your cloud server. If you don’t need to replicate\
    \ to a server, you can skip this section.\n\nAbout the author\n\nI have been a\
    \ professional software developer since 1986 doing work at IBM, The Nuclear Regulatory\
    \ Commission, for Bell Laboratories and at a host of smaller firms, including\
    \ the startup Sezme. I have had the opportunity to work a broad spectrum of computing,\
    \ from low level embedded systems development in assembler to JVM and .net CLR\
    \ virtual machine programming in Java and C#. I even had the opportunity to dabble\
    \ in microcode for a brief period of time. My early career was focused on computer\
    \ graphics, including OpenGL, digital image processing, and image compression.\
    \ I developed a proprietary spatial domain compression algorithm intended to be\
    \ used where traditional cosine transforms proved computationally too expensive.\
    \ A bit later I was the lead developer for SPG in the creation of the image editor\
    \ ColorWorks, which was delivered on the OS/2 and Windows platforms. ColorWorks\
    \ was one of NASAs favored tools for color correcting/enhancing images taken with\
    \ the Hubble telescope. I later focused my attention on database and Web work\
    \ for the creation of HotRiot. HotRiot is an SaaS that provides back-end services\
    \ for mobile and Web applications. I am currently the technical lead in the development\
    \ of a mobile messaging app for Android and iOS using Xamarin and SignalR.\n\n\
    Personal note"
