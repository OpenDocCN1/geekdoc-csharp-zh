  trans: "\n异常处理是生活中无处不在的事，但它几乎总是会为你的设计引入复杂性。因此，作为一个一般原则，你在设计代码/应用程序时应该尽可能减少失败点。这似乎是显而易见的，但你可能会对这个简单规则被忽视的频率感到惊讶。我们考虑了多种相互竞争的文件存储方案，它们各自有优缺点。让我们尝试将其总结为一句话并提供一些具体的建议。\n\
    \n*   将文件存储在数据库外部可能更灵活，但通常会产生额外的故障点，且实现起来更复杂。\n*   将文件存储在数据库内部通常灵活性较低，但更容易设计和实现。\n\
    \n我倾向于将文件存储在数据库外部，这是几乎总是给出的建议。尽管如此，每个应用程序都是不同的，只有你才能根据特定的需求知道什么是最好的。在 particular\
    \ 列述了外部文件存储的陷阱之后，我作为原则却推荐这种解决方案，这可能看起来很奇怪。我相信，考虑到所有因素，这通常是更好的选择。\n\n所以，就这样了吗？遗憾的是，还没有。还有最后一个考虑因素。如果你存储文件的表将被复制，你应该考虑在应用程序和云服务器之间执行文件传输的具体细节。在我们的案例中，我们决定使用\
    \ `HotRiot` 作为我们的云存储解决方案。`HotRiot` API 执行文件传输时，期望文件数据是磁盘（SSD）上的实际文件。这并不意味着你不能将文件存储在数据库中，但在我们的案例中，这提供了使用外部文件的另一个理由。\n\
    \n## 更新记录\n\n记录更新的方式与插入的方式非常相似。让我们取之前的记录插入示例并进行修改以执行更新。\n\n```\n[Activity (Label\
    \ = \"UpdateHRActivity\")]\n\npublic class UpdateHRActivity : Activity\n{\n  protected\
    \ override void OnCreate (Bundle bundle)\n  {\n    base.OnCreate (bundle);\n \
    \   SetContentView(Resource.Layout.CoRegistration);\n    Button submitCoRegButton\
    \ = FindViewById<Button>(Resource.Id.submitCoRegButton);\n    submitCoRegButton.Click\
    \ += delegate { updateHRContactSubmitHandler (); };\n  }\n  private void updateHRContactSubmitHandler()\n\
    \  {\n    ArrayList updateValues = new ArrayList ();\n    updateValues.Add(FindViewById<EditText>(Resource.Id.coRegContact).Text);\n\
    \    updateValues.Add(FindViewById<EditText>(Resource.Id.coRegName).Text\n   \
    \ using (SxmTransaction sxmTransaction = new SxmTransaction (\"jsearch\")){\n\
    \      1 sxmTransaction.executeUpdate(\"updateHRContact\" updateValues);\n   \
    \   2 if (sxmTransaction.commitTransaction () != SQLiteErrorCode.Ok)\n       \
    \   throw new SxmException (new ErrorMessage (\"Commit error.\", Defines.SxmErrorCode.userDefined));\n\
    \    }\n  }\n}\n```\n\n这里的一切看起来应该都很熟悉。第 1 行是执行更新的实际调用处。如你所见，这与插入示例非常相似。`executeUpdate`\
    \ 方法从 SQL 语句属性文件中查找与作为第一个参数传递的语句名称匹配的更新语句。在我们的示例中，将是下面的条目。\n\n`[updateHRContact]\
    \ [UPDATE companyReg SET hrContact = ? WHERE coName = ?]`\n\n作为第二个参数传递的 `ArrayList`\
    \ 中的值将替换 SQL 语句中的占位符。然后执行该语句。当然，更新操作会修改数据库，因此它们需要提交，这在第 2 行完成。\n\n## 删除记录\n\n\
    下面的方法在公司注册表上执行记录删除。\n\n```\nprivate void deleteCoRegistration (string registrationRecordPK)\n\
    {\n  ArrayList deleteKey = new ArrayList ();\n  deleteKey.Add(registrationRecordPK);\n\
    \  using (SxmTransaction sxmTransaction = new SxmTransaction (\"jsearch\")){\n\
    \    1 sxmTransaction.executeDelete(deleteKey);\n    2 if (sxmTransaction.commitTransaction\
    \ () != SQLiteErrorCode.Ok)\n        throw new SxmException (new ErrorMessage\
    \ (\"Commit error.\", Defines.SxmErrorCode.userDefined));\n  }\n}\n```\n\n这里的一切看起来应该都很熟悉。第\
    \ 1 行是执行删除的实际调用处。如你所见，这与插入示例非常相似。`executeDelete` 方法从 SQL 语句属性文件中查找与作为第一个参数传递的语句名称匹配的删除语句。在我们的示例中，将是下面的条目。\n\
    \n`[delete]`\n`[DELETE FROM companyReg WHERE registrationRecordPK = ?]`\n\n作为第二个参数传递的\
    \ `ArrayList` 中的值将替换 SQL 语句中的占位符。然后执行该语句。当然，删除操作会修改数据库，因此它们需要提交，这在第 2 行完成。\n\n\
    ## 错误处理\n\n错误对于任何应用程序来说都是生活的一部分，所以我想不说而知，适当的错误处理至关重要。但你可能会对我经常看到错误处理被当作事后考虑而感到惊讶。通常你会看到先实现主行代码，然后在之后的某个时间点嫁接异常处理。等待是自然的。然而，为了从中获得真正的收益，它需要在你编写主行代码时完成。目前，话说到此即可。让我们来看两个例子。第一个将显示异常处理。\n\
    \n### 初始化错误处理\n\n`initDB` 方法初始化数据库，为使用做准备。它执行了 SQLite 所需的基本任务。初始化中有趣的困境在于，如果它们失败了，你通常无法继续。这对于数据库初始化来说无疑如此。从根于应用程序基础的错误中恢复是很困难的。例如，如果数据库初始化失败，你如何能有信心地运行应用程序？答案是，你不能。这是坏消息。好消息是，一旦你让初始化正常工作，它失败是不常的。所以，在大多数情况下，初始化的错误处理更多是用于开发，而不是恢复。尽管如此，如果初始化在生产环境中失败，你需要以一种合理的方式处理错误；不要让它溜走。主动处理不可恢复的情况，比让它演变成更糟糕的情况要好。让我们继续下面的代码\n\
    \n```\nprotected void initDB()\n{\n  1 DatabaseDescriptor jsDD = null;\n  string\
    \ errorMessage = null;\n  2 bool parsed = false;\n  3 bool init = false;\n  try\
    \ {\n    4 jsDD = new DatabaseDescriptor (\"jsearch\");\n    // 对于 Android 应用程序。\n\
    \    using (StreamReader sr = new StreamReader (Assets.Open (\"SqlStatements.txt\"\
    )))){\n```\n"
- fmt: "\n```csharp\n// For iOS apps.\nusing (StreamReader sr = new StreamReader(\"\
    sqlProperties/SqlStatements.txt\")){\n5 parsed = ProcessSQLStatements.Parse(sr);\n\
    }\n6 init = SxmInit.initialize ();\n}\ncatch (SxmException sxmEx){\n    Exception\
    \ iex = SxmException.getInnermostException(sxmEx);\n    errorMessage = iex.Message;\n\
    }\ncatch (System.Exception ex){\n    errorMessage = ex.Message;\n}\nfinally {\n\
    \    if (errorMessage != null){\n        string initResult = String.Format (\"\
    jsDD: {0}, Parsed: {2}, Init: {3}, Error: {4}\",\n        jsDD, parsed, init,\n\
    \        errorMessage);\n        Log.Debug(\"initDB\", initResult);\n    }\n}\n\
    ```\n\nLines 4 through 6 is where the database is initialized. Initialization\
    \ should always be wrapped in a `try-catch` with an accompanying `finally` block.\
    \ The methods `parse` and `initialize` will throw an `SxmException` on error.\
    \ An error instantiating a `DatabaseDescriptor` will also result in an `SxmException`.\
    \ In our example, we catch the `SxmException` and the base `System.Exception`.\
    \ The vast majority of exceptions that occur in the `SQLite.XM` library are re-thrown\
    \ as `SxmExceptions`. In fact, all `try-catch` blocks in the library re-throw\
    \ an `SxmException`. The only time you would see another exception coming out\
    \ of the library is for something that’s uncaught. However, this is unusual and\
    \ is only allowed for really oddball conditions. You should always catch both\
    \ the `SxmException` and the base `System.Exception`. Often times, the base exception\
    \ catch won’t be needed but it won’t hurt to include it and it will serve as a\
    \ safety. Really, all of your `try-catches` should catch the base exception.\n\
    \nInside the `SxmException` handler, you will see a call to `getInnermostException`.\
    \ This method returns the root exception. SQLite.XM will set an inner exception\
    \ when appropriate. This can be helpful for tracing errors, however, often times\
    \ you are only interested in getting the root cause. If there is no inner exception,\
    \ `getInnermostException` will just return the top-level exception.\n\nThe methods\
    \ `parse` and `initialize` return `true` upon successful completion. Of course,\
    \ the `new` statement on line 4 returns a `DatabaseDescriptor` instance. We can\
    \ use this knowledge to help us more easily identify the source of an error. By\
    \ initializing the return values to `null` and `false` (see lines 1, 2 and 3),\
    \ we can then inspect the state of these values inside the `finally` block to\
    \ see where an exception occurred. For example, if we fall into the `finally`\
    \ block and see that `jsDD` is non-null but `parsed` and `init` are `false`, we\
    \ can reasonably deduce that the error occurred in the call to `Parse`. The exception\
    \ message will usually point you to the offending code and you can always look\
    \ at the stack trace to find the source of an error. But this does provide a level\
    \ of convenience and can simplify things a bit when an error occurs in a method\
    \ that is shared.\n\n### The SxmException object\n\nBelow is the output from an\
    \ `SxmException` object for a database timeout error I intentionally caused.\n\
    \n![](Image00024.jpg)\n\nThe `Data` property of all SxmExceptions include an `SxmErrorCode`\
    \ key, which returns the enum value of the error. Of course, an error message\
    \ is also always set. You can have a look at all possible `SxmErrorCodes` by inspecting\
    \ the enum `Defines.SxmErrorCode` located in `Defines.cs`. If the `SxmErrorCode`\
    \ is set to `sqliteException`, then this tells you that the error originated inside\
    \ SQLite. In that case, there will be another key in the `Data` property field\
    \ named `sqliteErrorCode`. This is the SQLite assigned error code for the error.\
    \ See Appendix A for a list of all SQLite error codes. You can find a list of\
    \ all SQLite.XM errors in the `ErrorMessages.cs` source file. When there is an\
    \ inner exception, the `sxmErrorCode` will be set to `innerException`. Of course,\
    \ the `InnerException` property will be also set.\n\nYou can throw your own user\
    \ defined `SxmException` using the following line of code.\n\n```csharp\nthrow\
    \ new SxmException(\"Some error.\", Defines.SxmErrorCode);\n```\n\n### Transaction\
    \ processing\n\nLet’s look at an error processing for an `SxmException`. The code\
    \ below performs a simple insert followed by a search. The search results are\
    \ then retrieved and committed. I won’t bother going through the code, let’s just\
    \ focus on the error.\n\n```csharp\nvoid process() {\n    try {\n        using\
    \ (SxmTransaction sxmTransaction = new SxmTransaction()){\n            // ...\
    \ insert logic ...\n            // ... search logic ...\n            if (sxmTransaction.executeQuery()\
    \ == SQLiteErrorCode.Busy){\n                Thread.Sleep(50);\n            }\n\
    \            sxmTransaction.commitTransaction(); // Try again\n        }\n   \
    \ } catch (SxmException sxmEx){\n        throw SxmException.getInnermostException(sxmEx);\n\
    \    } catch (System.Exception ex){\n        throw ex;\n    }\n}\n```\n"
