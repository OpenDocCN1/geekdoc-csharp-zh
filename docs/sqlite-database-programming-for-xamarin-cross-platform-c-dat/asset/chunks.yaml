- fmt: "Up to this point, I have shown you how to setup and perform what I would describe\
    \ as a standard synchronization. Where each table that is marked for synchronization\
    \ on the local SQLite database has a corresponding table in HotRiot where the\
    \ record data is propagated. In addition, error handling is fully managed by the\
    \ synchronization process as described earlier. This is very easy to setup and\
    \ for many applications, all that’s needed. However, there are times when more\
    \ flexibility is required. For example, there may be times when synchronizing\
    \ using a one-to-one relationship between tables on the device database and tables\
    \ on the replication server might not be ideal. It may make more sense to transform\
    \ the source data and save the resulting transformed data to a schema different\
    \ from the one on the device. Or, you might wish to bypass the default synchronization\
    \ error processing and instead insert your own custom error handling. And finally,\
    \ there may be some processing that you would like to perform after a record is\
    \ synchronized.\n\nIn order to accommodate these requirements, `SQLite.XM` allows\
    \ you to insert your own custom delegate methods at the following points along\
    \ the replication processing cycle:\n\n* Pre-synchronization\n* Post-synchronization\n\
    * Error processing\n\nYou can choose to write a delegate for any or all of these.\n\
    \n## Pre-synchronization processing\n\nA pre-synchronization delegate allows you\
    \ to customize replication in order to synchronize with a non-matching server-side\
    \ schema. Actually, a pre-synchronization delegate can be used to perform any\
    \ processing that you wish to execute before replicating a record. However, it\
    \ is intended to be used for non-matching server side replication.\n\nIn our earlier\
    \ synchronization example, each table marked for replication on the local SQLite\
    \ database had a corresponding table in HotRiot. This standard synchronization\
    \ only allows you to make minor tweaks to the replication process. For example,\
    \ you can choose to not replicate specific fields from a device tables by omitting\
    \ them from the corresponding tables you define in HotRiot. You can also include\
    \ fields in the HotRiot tables that are not present in the device tables. While\
    \ these kinds of changes can be useful, they are relatively minor. The fundamental\
    \ schema between the device and the server datastore remains largely intact, at\
    \ least for those tables marked for synchronization.\n\nIt’s not at all unusual\
    \ for the schema on the replication server to be dramatically different from the\
    \ schema found on the device. In fact, I have found this to often be the case.\
    \ Let’s have a look at an example. Going back to our job search application; imagine\
    \ we have a registration form for businesses that collects the typical contact\
    \ information. Because this is a job search app, we also want to collect The human\
    \ resources contact information, including a picture of the HR contact person.\
    \ In addition, as part of registering, our app also creates an Android devices\
    \ ID or an iOS device token; depending on which OS the app is being run. For performance\
    \ reasons, we’ve decided to flatten the database schema on the device and store\
    \ all of this information in a single table; the `company_registration` table.\
    \ This table, as it is structured on the device, is shown below.\n\n![](Image00001.jpg)\n\
    \nOn the server-side datastore, we would like a more traditional schema. The figure\
    \ below shows what the normalized, server-side schema looks like. As you can see,\
    \ this is quite different from the company registration table on the device. There\
    \ are four notable changes:\n\n* First, for the obvious, the original company\
    \ registration table has been split into three individual tables that are linked\
    \ to a registration table using foreign keys.\n* The `company_registration` table\
    \ name is not used as the name for any of the tables on the server-side datastore.\n\
    * New fields have been added to each of the tables which are not present in the\
    \ company registration table on the device.\n* The fields from the `company_registration`\
    \ table have not only been moved to different tables on the server, but they have\
    \ also been renamed.\n\n![](Image00002.jpg)\n\nThe question is; how can we transform\
    \ the original single table registration into a format that will synchronize with\
    \ the modified schema on the server. In the following discussion, it is assumed\
    \ that these tables have already been created in HotRiot and that they include\
    \ all of the fields show above. And that the data types for the fields have been\
    \ properly set. Just to reiterate from our earlier discussion regarding primary\
    \ keys, the data type for all primary key fields on the server-side database must\
    \ be text. In addition, every table must include a `systemSynchID` field. Without\
    \ this field, `SQLite.XM` is unable perform replication; for a refresher, see\
    \ the section ‘Creating the replication database tables’. To keep this example\
    \ a bit interesting, we have included a picture field in the devices `company_registration`\
    \ table that needs to be stored in the `hrContact` table on the server.\n\nWhat\
    \ we need to do is create a pre-synchronization processing delegate that can perform\
    \ this transformation. The delegate method signature is shown below.\n\n```java\n\
    public delegate Task<List<SynchDescriptor>> SynchPreProcessDel(SynchDescriptor\
    \ sd);\n```\n\nTo insert a pre-processing delegate into the `SQLite.XM` synchronization\
    \ processing chain, do the following:\n\n* Create an instance of the `SynchOptions`\
    \ class.\n* Set the `SynchPreProcessDel` field to your error delegate.\n* Pass\
    \ the `SynchOptions` class to the `SxmInit.initialize` method.\n\nSee the first\
    \ three lines of code below.\n\n```java\nSynchOptions synchOptions = new SynchOptions();\n\
    synchOptions.SynchPreProcessDel = mySynchDel;\nSxmInit.initialize(\"YOUR APPLICATION\"\
    , synchOptions);\nthis.StartService(new Intent(typeof(SynchronizeService))); //\
    \ For Android only\n```\n\nAs you can see, the pre-processing delegate is passed\
    \ in a `SynchDescriptor` and it returns a list of `SynchDescriptors`. A `SynchDescriptor`\
    \ is an object that represents a record to be replicated. The passed in `SynchDescriptor`\
    \ represents the next record that `SQLite.XM` found in the replication log. The\
    \ returned `SynchDescriptor` list, is the list of `SynchDescriptors` that actually\
    \ replicated. A partial listing of the `SynchDescriptor` class is shown below.\n\
    \n```java\npublic class SynchDescriptor {\n    public string action;\n    public\
    \ string dbName;\n    public string tableName;\n    public SynchResponse synchResponse;\n\
    \    public Hashtable recordDataToSynch;\n\n    public SynchDescriptor(string\
    \ action, string dbName, string tableName) {\n        this.action = action;\n\
    \        ...\n    }\n}\n```\n\nThe class variables are pretty self-explanatory\
    \ but we should to go them anyway:\n\n* `string` `action` : this is the synchronization\
    \ action. It will be *insert* when inserting a new record, *delete* when deleting\
    \ a record, and *update* when updating a record.\n* `string` `dbName` : this is\
    \ the database on the device from where this record was retreived.\n* `string`\
    \ `tableName` : this is the table from where this record was retreived.\n* `SynchResponse`\
    \ `synchResponse` : this is the response result of synchronizing the record associated\
    \ with this `SynchDescriptor` . This is explained in detail in the section ‘Post-synchronization\
    \ delegate processing’.\n* `Hashtable` `recordDataToSynch` : this is the actual\
    \ record data. The keys in the hash contain the field names while the value contains\
    \ the actual field data."
