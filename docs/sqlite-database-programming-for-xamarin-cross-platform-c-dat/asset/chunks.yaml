  trans: '


    此查询在通常放置记录数据的地方使用了问号 `?`。我们之所以这样做有几个原因。首先，参数化查询在代码中处理起来容易得多。手动组装一个包含实际记录数据的查询比使用参数化形式要费力得多。参数化查询几乎不受
    SQL 注入攻击。SQL 注入是一种恶意黑客攻击，可用于访问或破坏您的数据库。最后，参数化查询可能具有更高的性能。由于参数化查询的实现方式，当同一条语句被多次使用时，数据库可以跳过几个复杂的准备步骤。对于某些重复使用的特定查询，这可以节省大量时间。


    让我们更好地理解参数化语句提供的性能优势。在用于执行大量相同的查询（但用户提供的数据可能有所不同）时，预编译语句能提供最佳的性能提升。在执行复杂查询时，性能提升将尤为显著。如果语句相对简单，预编译语句的性能优势将不那么明显。


    参数化语句的生命周期仅限于连接。当连接结束时，所有关联的预编译语句也会终止，因此对于任何新连接都必须重新创建它们。这意味着预编译语句不能被多个连接共享；但是，每个连接可以创建自己的预编译语句。


    ## 理解 SQL 语句属性文件


    让我们先来看 SQL 语句属性文件的结构。


    ![](img/Image00004.jpg)


    SQL 语句属性文件分为七个部分：


    * `TABLE`

    * `INDEX`

    * `INSERT`

    * `SELECT`

    * `UPDATE`

    * `ALTER`

    * `DELETE`


    每个部分都以一个置于左右括号之间的头部名称开始，并以一对空括号结束。这些是该部分的开始和结束标记。这些部分可以以任何顺序排列，但它们必须存在于文件中，即使是空部分也是如此。在左右括号之间的任何内容都被视为注释并被
    `SQLite.XM` 忽略。不要在任何注释中使用括号符号；这些符号专门用作分隔符。每个部分的 SQL 语句放置在部分的开始标记和结束标记之间。每个部分应只包含与该部分相关的语句。


    * `TABLE` 部分应只包含创建表（create table)/删除表（drop table）SQL 语句。

    * `INDEX` 部分应只包含创建索引（create index)/删除索引（drop index）SQL 语句。

    * `INSERT` 部分应只包含插入记录（insert record）SQL 语句。

    * `SELECT` 部分应只包含查询（select）SQL 语句。

    * `UPDATE` 部分应只包含更新（update）SQL 语句。

    * `ALTER` 部分应只包含修改表（alter table）语句。

    * `DELETE` 部分应只包含删除记录（delete record）SQL 语句。


    让我们仔细查看一下 SQL 语句属性文件的每个部分。


    ### 定义表语句


    SQL 语句文件的 `TABLE` 部分应只包含创建表或删除表的语句。在此部分中放置任何其他数据定义或数据操纵语句都将导致运行时错误。每个创建表语句由三个字段组成。


    `[` `database_name``.`table_name` `]` [` `create/drop table statement` `]` [`
    `synch_key` `]`


    每个字段都放置在左右括号内。字段必须按照上述所示顺序出现。不过，你可以将它们分行格式化或包含空格以增强可读性。第一个字段是正在创建的表的完全限定名称，即数据库名后跟一个句点，然后是表名。第二个字段是实际的创建表
    SQL 语句。最后一个字段是同步键（synchronization key）。它告诉 `SQLite.XM` 如何同步表数据。目前有三个选项。


    * `no_synch`: 不同步表数据。

    * `synch`: 与服务器同步表数据。

    * `copy`: 将表数据复制到服务器。但是，不在服务器上执行记录删除。


    此字段不区分大小写。下面是一个包含两个创建表语句和一个注释的 `TABLE` 部分示例。


    `[TABLE]`


    `Create the database tables “People” and “Places”.`


    `[jSearch.People] [CREATE TABLE People (id INTEGER PRIMARY KEY AUTOINCREMENT,
    FName TEXT, LName TEXT)] [synch]`

    `[jSearch.Places] [CREATE TABLE Places (id INTEGER PRIMARY KEY AUTOINCREMENT,
    loc TEXT, reason TEXT)] [synch]`


    `[]`


    `SQLite.XM` 为每个表添加了一个用于协调同步的文本字段。字段名为 `systemSynchID`。该字段完全由 `SQLite.XM` 代码管理，因此可以安全地忽略。尽管如此，这是一个保留名称，所以你不能在你的任何表中使用此字段名。


    ### 定义插入语句


    SQL 语句文件的 `INSERT` 部分应只包含记录插入语句。每个插入语句由三个字段组成。


    `[` `statement name` `]` [` `table name` `]` [` `insert record statement` `]`


    每个字段都放置在左右括号内。字段必须按照上述所示顺序出现。不过，你可以将它们分行格式化或包含空格以增强可读性。第一个字段是插入语句的名称。你可以选择任何名称，但它必须与所有其他插入语句名称唯一。我们建议选择一个简短但具有描述性的名称。第二个字段是要插入表的名称。最后一个字段是实际的插入语句。


    下面是一个包含两个插入语句的 `INSERT` 部分示例。


    `[INSERT]`

    `[registerCompany]`

    `[companyReg]`

    `[INSERT INTO companyReg (companyRegPK, coName, hrContact, email, password) VALUES
    (?, ?, ?, ?)]`

    `[insertJobPosting]`

    `[jobPosting]`

    `[INSERT INTO jobPosting (jobPostingPK, companyRegFK, jobTitle, description, pay)
    VALUES (?, ?, ?, ?)]`

    `[]`


    之前我提到 `SQLite.XM` 为每个表添加了一个名为 `systemSynchID` 的字段，并且该字段可以安全地忽略。尽管如此，但由此产生的一个副作用在编写插入语句时必须考虑进去。


    `INSERT` 语句有两种基本形式：


    * `INSERT INTO table_name (column1, column2, column3, ...columnN) VALUES (?, ?,
    ?, ...?)`

    * `INSERT INTO table_name VALUES (?, ?, ?, ...?)`


    在第一种形式中，列名和对应的插入值是显式的。例如，`column1` 将获取参数 1，`column2` 将获取参数 2，以此类推。在第二种形式中，插入的列是由
    SQL 语句隐含的。例如，表中的第一列将获取参数 1，表中的第二列将获取参数 2，以此类推。


    在编写插入语句时，必须使用第一种形式。这是因为当表首次创建时，`systemSynchID` 字段已知是表的最后一列，正如下方的示例表所示。


    ![](img/Image00020.jpg)


    然而，如果你通过添加字段来修改表，新字段将位于 `systemSynchID` 字段之后。


    ![](img/Image00005.jpg)


    在这种情况下，尝试使用隐式插入语法进行更新可能会出现问题。这是由于 `systemSynchID` 字段现在位于表的中间位置。


