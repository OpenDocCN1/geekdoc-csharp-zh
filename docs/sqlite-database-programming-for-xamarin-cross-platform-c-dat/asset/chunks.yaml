    上表表示了一个包含四条条目的复制日志。同步 ID 是指向数据库中实际记录的链接。如你所见，表中针对记录 `2764` 有两个条目。在本文讨论中，假设 `widget`
    表有 7 个字段。此外，假设记录 `2764` 中的两个字段被日志条目 `167` 更新，而同一条记录中的另外三个字段被条目 `169` 更新。正如我之前提到的，复制日志条目是按照先入先出（FIFO）顺序顺序处理的。因此，第一个被处理的条目将是日志记录
    `167`。当日志条目 `167` 被处理时，关联记录的所有字段都将同步，这包括被日志条目 `167` 更新的两个字段以及被日志条目 `169` 更新的三个字段。


    这通常不会产生问题，但在某些情况下，它可能会引入你需要注意的副作用。考虑以下一组情况：


    *   被日志条目 `169` 引用的记录更新包含一个指向由日志条目 `170` 插入到 `project` 表中的记录的 ID 指针。想象这是一个 GUID
    外键字段。

    *   由于网络故障，同步在成功同步条目 `167` 后被中断了。


    由于网络中断，服务器上由同步 ID 为 `2764` 表示的记录将包含一个指向 `project` 表中尚未同步的记录的外键；即该记录在服务器上尚不存在。现在，这与传统的
    RBR（基于行的复制）或 SBR（基于状态的复制）在日志条目 `170` 同步失败时的情况没有区别，只是可能会在同步周期中更早发生。通常，你只需要设计访问服务器上数据的代码来处理这些情况，而你本来也应该这样做。


    关于早期字段复制需要注意的另一个问题是计数器。如果条目 `169` 包含对计数器字段的更新，那么该更新将在日志条目 `167` 同步时出现在服务器上。然而，即使是这些类型的不一致也极少导致致命问题。`SQLite.XM`
    中的同步是事件驱动的，当向本地数据库添加条目时，会立即触发同步。这有助于维护本地存储与远程服务器之间的一致性。当然，这并不能保证；例如，在长时间网络中断期间，你的应用可能对本地数据库进行修改。在这种情况下，同步将等待直到连接重新建立。但一旦连接恢复，复制日志中的所有记录都将很快地完成同步，除非出现其他问题。


    取决于你应用程序的具体情况，在处理复制时，可能还有其他你需要留意的问题。在思考这些时，请记住，当该记录的第一条复制日志条目被处理时，该记录将会被整体同步。


    ## 设置服务器端基础设施


    在开始复制之前，我们需要设置好服务器端基础设施。`SQLite.XM` 开箱即用即可与 `HotRiot.com` 配合工作。但并不是强制使用 `HotRiot`
    进行复制。`SQLite.XM` 复制可以与你选择的任何服务器端数据存储配合。我稍后会向你展示如何实现。与你自己的服务器同步真正的困难之处在于编写执行将数据通过网络移动到服务器实际工作的代码。这可能会变得有点复杂，特别是如果你需要支持文档存储时。幸运的是，所有这些代码已经为
    `HotRiot` 写好了，并作为 `SQLite.XM` 的一部分包含在内。


    在此处，你可能会问为什么选择 `HotRiot`？答案很简单，分为三个部分：


    *   `HotRiot` 完美适合这项任务。它为移动应用程序提供了一个健壮的服务器端平台。它包含了配置的关系型数据库和 NoSQL 数据库、丰富的文档支持、推送通知、近距离搜索等许多功能。

    *   `HotRiot` 包含一个专为与 `Xamarin` 配设计的全面的 C# API。

    *   我是 `HotRiot` 的首席开发人员之一，因此对我来说，使用我最熟悉的服务理所应当的。


    但再次，我想强调的是，你不必使用 `HotRiot` 也可以使用 `SQLite.XM` 同步。尽管你需要编写支持代码，但你可以自由使用选择的任何后端。作为另一种选择，你可以先使用
    `HotRiot` 开始开发，稍后切换到你自己的云服务器。这在开发阶段提供了一条阻力最小的路径。`HotRiot` 不需要信用卡即可注册，且免费使用 30
    天。如果你需要更多时间，在开发期间使用 `HotRiot` 的成本微乎其微。大多数应用在 `HotRiot` 上开发的总费用仅为 15 美元。因此，你有充足的时间切换到自己的服务器端基础设施，而无需花费大量资金。


    让我关于 `HotRiot` 再说一点。`HotRiot` 是一个功能非常全、强大的的产品。我只涵盖了支持 `SQLite.XM` 数据同步所需的内容。


    ## 创建复制数据库表


    如前所述，在开始复制之前，我们需要设置服务器端数据存储。我们需要创建云数据库以及用于复制的表。幸运的是，使用 `HotRiot` 这非常轻而易举。你可以使用
    `HotRiot` Web 内部的图形化工具构建并管理应用程序的基础设施。`HotRiot` 包含了相当详细的文档，因此我不尝试重复它。不过，当我认为有帮助时，我会提供说明。


    首先访问 `HotRiot.com` 并创建一个账户。注册后，你将被重定向到控制台页面。请看下方的截图。


    ![](img/Image0030)


    你的新 `HotRiot` 账户自带配置好的 MySQL 和 MongoDB 数据库。这部分已经完成了。你只需要创建用于复制的表。之前在“定义表语句”章节中，我向你展示了如何为
    SQL 语句文件创建表。作为提醒，每个创建表语句由三个字段组成。


    `[database_name.table_name] [create/drop table statement] [synch_key]`


    最后一个字段同步键控制表如何同步到云端。目前有三个选项：


    *   `no_sync`: 不同同步表数据。

    *   `synch`: 与服务器同步表数据。

    *   `copy`: 将表数据复制到服务器。但不在服务器上执行记录删除。


    所有同步键设置为 `synch` 或 `copy` 的表记录数据都将同步。这些表需要在复制服务器（在我们的案例中是 `HotRiot`）上有对应的表。

