    For now, only create MySQL tables. own*   Table names are case sensitive and must
    exactly match the table names used in the SQL statements properties file.

    *   Field names are case sensitive and must exactly match the field names used
    in the table definitions in the SQL statements properties file.

    *   If you don’t want a particular field replicated, simply omit it from the table
    you define in `HotRiot`.

