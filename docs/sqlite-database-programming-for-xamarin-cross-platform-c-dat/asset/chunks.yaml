    \ class.\n\n`public`  `class`  `DatabaseDescriptor`\n\n`{   `\n\n `private`  `string`\
    \ ` databaseName;`\n\n `private`  `Environment` `.` `SpecialFolder` ` databaseFolder;`\n\
    \n `public`  `Environment` `.` `SpecialFolder` ` DatabaseFolder`\n\n`    {`\n\n\
    \ `get` ` { ` `return` ` databaseFolder; }`\n\n`    }`\n\n `public`  `bool` ` noLog\
    \ =` `false` `;`\n\n `public`  `string` ` logfileName;`\n\n `public`  `int` ` logfileMaxSize = `\
    \ `1024` ` * ` `1024` `;`\n\n `public`  `Environment` `.` `SpecialFolder` ` logfileFolder =`\n\
    \n `Environment` `.` `SpecialFolder` `.Personal; `\n\n`    +` `public`  `DatabaseDescriptor`\
    \ `(` `string` ` databaseName,`\n\n `Environment` `.` `SpecialFolder` ` databaseFolder\
    \ =` `Environment` `.` `SpecialFolder` `.ApplicationData)…`\n\n`    +` `public`\
    \  `static`  `DatabaseDescriptor` ` getDescriptor(` `string` ` databaseName)…`\n\
    \n `+` `public`  `static`  `ArrayList` ` getDatabaseNames()…`\n\n`}`\n\nThe `DatabaseDescriptor`\
    \ constructor takes a single required parameter; the name of the database you\
    \ wish to create/connect. It also accepts an optional folder location for the\
    \ database. By default, databases are located in the *ApplicationData* folder.\
    \ This path is the value of the environment variable `XDG_CONFIG_HOME` , if it\
    \ is set, otherwise, it is in the ‘.config’ directory of the current user's home\
    \ directory, which, in Android, translates to the following location:\n\n `/data/data/<application\
    \ name>/files/.config`\n\nand in iOS:\n\n `<application base>/documents/`\n\n\
    DO NOT name your database ‘main’ or ‘temp’, these names are used by SQLite internally\
    \ and using them may cause problems.\n\nThe `DatabaseDescriptor` class has reasonable\
    \ defaults for its control parameters. Of course, if you don’t like any of the\
    \ default values, you can change them. In the example below, the location where\
    \ the database will be created is set to the *Personal* folder.\n\n`try`\n\n`{`\n\
    \n `new`  `DatabaseDescriptor` `(` `\"jSearch\",` `Environment` `.` `SpecialFolder`\
    \ `.Personal); `\n\n`}`\n\n`catch` `( System.` `Exception` ` ex)`\n\n`{`\n\n `string`\
    \ ` message = ex.Message;`\n\n`}`\n\nOnce created, the database name and folder\
    \ location in the descriptor cannot be changed. This is reasonable; it’s hard\
    \ to imagine a circumstance where this would make sense. Anyway, changing either\
    \ of these effectively changes the database being referenced by the descriptor.\
    \ Each database descriptor also includes properties for a log file. What this\
    \ means is, each database can, and should, have its own separate log. This may\
    \ seem like overkill; why not simply share a log file between all databases. The\
    \ reason is twofold; this provides flexibility in managing logs and visually parsing\
    \ a single file shared between databases is more difficult than having separate\
    \ database logs.\n\nThe log file is automatically assigned the same name as the\
    \ database with the extension ‘.log’ and its default size is 1MB. By default,\
    \ log files are placed in the `Personal` folder. This is the personal or home\
    \ directory for the current user, which, in Android, translates to the following\
    \ location:\n\n `/data/data/<application name>/files`\n\nOf course, you can change\
    \ any of these defaults. In the example below, we change the maximum log file\
    \ size from its default 1MB to 5MB and the log file name to `jSearch-log` .\n\n\
    `try`\n\n`{`\n\n `DatabaseDescriptor` ` dd = ` `new`  `DatabaseDescriptor` `(`\
    \ `\"jSearch\"` `);`\n\n`    dd.logfileMaxSize` `= 1024 * 1024 * 5;`\n\n`    dd.`\
    \ `logfileName =` `\"jSearch-log\"` `;`\n\n`}`\n\n`catch` `( System.` `Exception`\
    \ ` ex)`\n\n`{`\n\n `string` ` message = ex.Message;`\n\n`}`\n\nWhen a log file\
    \ reaches its maximum size, it is renamed from `<` *`logfile name`* `>.log` to\
    \ `<` *`logfile name`* `>.old.log` and a new log file is started. If there was\
    \ an existing old log file, it is replaced. If you don’t want logging, set `noLog`\
    \ to `false` ."
