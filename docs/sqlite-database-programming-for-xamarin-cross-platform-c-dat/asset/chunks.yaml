  trans: "\n`recordCount` 和 `pageNumber` 变量用于控制搜索的限制（limit）和偏移量（offset）。`recordCount`\
    \ 被硬编码为 10 且不会改变。然而，页码会根据是否选择上一页或下一页按钮来增加或减少。在第 5 行，执行了实际调用来执行查询。通常情况下，你会调用 `executeQuery`，并传入\
    \ SQL 语句属性文件中你想要执行的查询语句的名称。然而，在这个示例中，我们动态构建了查询，因此我们将调用 `executeQueryDirect` 方法，传入完整构建的\
    \ SQL 语句。在执行静态 `select` 语句时，应使用 `executeQuery` 方法。在执行动态查询时，使用 `executeQueryDirect`\
    \ 方法。\n\n## SQL 注入危险\n\n在这个示例中，我做了一件之前警告过你不要做的事，即：通过直接编辑 SQL 字符串来修改 SQL 语句。我指的不是我们插入的占位符，那些是安全的。我指的是\
    \ `limit` 和 `offset` 子句的查询控制值。尽管这种变化很小，它也代表了以潜在不安全的方式对 SQL 字符串进行了更改。在这种情况下，我允许这种异常有两个原因：\n\
    \n- 在我们的示例中，提供给 `offset` 子句的偏移数字不是直接从用户输入的。它是在代码中根据是否选择了上一页或下一页按钮计算出来的。因此，通过适当的边界检查，使用错误（更准确地说说是恶意）输入的可能性非常低。\n\
    - 输入非常容易进行准确验证。`limit` 和 `offset` 子句只需提供数字。\n\n但不要对这种做法感到太舒服，并在没有真正想清楚的情况下以其他方式重复这种操作。让我通过一个例子来展示这种看似简单的修改是如何导致出问题的。下面是我们之前的查询字符串。它被重写为\
    \ `limit` 硬编码为 10，当然，`offset` 仍然是动态的。\n\n`SELECT * FROM jobPosting WHERE companyRegFK\
    \ IN ({0}) LIMIT 10 OFFSET {1}`\n\n现在，对于这个示例，假设 `offset` 值是用户提供的，且我们的代码在验证上存在错误。此外，假设恶意用户提供了以下\
    \ `offset` 值。\n\n`1;DROP TABLE jobPosting`\n\n当我们构建查询时，最终的查询字符串看起来像这样：\n\n`SELECT\
    \ * FROM jobPosting WHERE companyRegFK IN (?)`\n\n`LIMIT 10 OFFSET 1;DROP TABLE\
    \ jobPosting`\n\n你可能已经猜到执行这段巧妙的小 SQL 代码会发生什么；整个 `jobPosting` 表将被删除。所以，正如你所看到的，当动态构建查询时，情况很容易变得非常糟糕。\n\
    \n作为直接使用 `String.Format` 设置查询控制值的替代方案，你可以使用参数化值。为了做到，你需要将 `limit` 和 `offset` 追加到传递给\
    \ `executeQueryDirect` 方法的参数数组中。然而，你首先需要将查询修改如下内容：\n\n`[getAllCompanyJobs]`\n\n\
    `[SELECT * FROM jobPosting WHERE companyRegFK IN ({0}) LIMIT ? OFFSET ?]`\n\n\
    `String.Format` 语句将修改为如下：\n\n`string selectStatement = String.Format (rawSelect,\
    \ csvParamPlaceHolders);`\n\n最后，你需要将 `limit` 和 `offset` 值添加到参数列表中。\n\n`companyList.Add(recordCount);`\n\
    \n`companyList.Add(recordCount*pageNumber);`\n\n我没有在示例中使用这种方法，是因为我之前提到的原因；我觉得我们修改查询的方式是安全的。尽管如此，在许多情况下这是首选解决方案。我遵循的通用规则是：\n\
    \n- 问自己：插入的值可以容易且准确地验证吗？如果答案是定的（如我们的示例所示），那么你可以进一步考虑直接修改查询控制值是否合适。\n- 如果你直接从应用程序的用户获取\
    \ SQL 输入，那么对上述问题的除“否”之外的回答都要非常怀疑！\n- 如果你正在使用任何可能被误认为“安全”的内容来更改 SQL 字符串，请使用参数化方法修改查询。这要安全得多。\n\
    - 如果怀疑，使用参数化方法。\n\n## 直接插入查询参数\n\n现在我们已经展示了如何使用参数化占位符修改查询，让我们来看看如何通过直接将搜索参数插入查询字符串来修改查询。\n\
    \n下面显示了 `GetJobs` 方法的新列表。它没有像我们之前的示例那样构建占位符字符串，而是构建了一个实际的参数字符串；参见第 1 到 3 行。该参数字符串随后被插入第\
    \ 4 行的查询字符串中。\n\n```\nprivate void GetJobs (ArrayList companiesList)\n{\n  SxmTransaction\
    \ sxmTransaction = null;\n  1 for (int i=0; i< companiesList.Count; i++)\n  2\
    \   companiesList [i] = \"’\" + companiesList [i] + \"’\";\n  3 string paramString\
    \ = string.Join(\",\", (string[])companiesList.ToArray(typeof(string))); \n  try\n\
    \   {\n      string rawSelect = SqlStatements.selectStatements [\"getAllCompanyJobs\"\
    ];\n 4 string selectStatement = String.Format (rawSelect, paramString, recordCount,\
    \ recordCount*pageNumber);\n      using (SxmTransaction sxmTransaction = new SxmTransaction\
    \ (\"jsearch\")){\n        sxmTransaction.executeQueryDirect (selectStatement,\
    \ null);\n        BuildTableInline (sxmTransaction);\n      }\n   }\n catch (Exception\
    \ ex)\n  {\n    // 此处处理异常。\n  }\n}\n```\n\n除非你有某些过人的理由，否则我不建议使用这种方法来构建查询。在最简单的情况下之外，这种方法可能会产生真正的安全问题。如果你对此有任何疑问，请回去重读\
    \ SQL 注入危险章节。\n\n## 修改模式（Schema）\n\n在应用程序发布之间，你不可避免地将需要更改模式。在 SQLite 中，对模式可以进行四种更改：\n\
    \n- 创建新表\n- 为现有表添加字段\n- 创建/删除索引\n- 删除表\n\n然而，你可能会进行其他可能的更改，SQLite 的 `alter table`\
    \ 语句仅支持有限的命令子集。因此，修改超出支持范围表将需要你设计自己的解决方案。索引定义不受 `create table` 语句的支持，因为它们是独立管理的。\n\
    \n## 添加/修改表\n\n添加新表很容易，你只需要在 SQL 语句属性文件的 `TABLE` 部分包含一个新的 `create table` 语句即可。当你需要修改现有表时会发生什么？在这种情况下，你需要为新用户创建表，并为现有用户修改表。这些本质上是不同的操作。让我们来看一个例子。\n\
    \n假设你应用程序的第一版本包含如下 `create table` 语句。\n\n`CREATE TABLE companyReg (id INTEGER\
    \ PRIMARY KEY AUTOINCREMENT, companyRegPK TEXT, coName TEXT, hrContact TEXT, email\
    \ TEXT, password TEXT)`\n\n"
- fmt: '

    Alright, the new statement is the same as the old one with the addition of the
    `CEO` field. For new users installing your app, everything seems just fine, but
    what about existing users that are upgrading to the new release? The way `SQLite.XM`
    works, is it only executes a `create table` statement if the table being created
    doesn’t already exist in the database. If it does, the statement is skipped. What
    you need to do is include an `alter table` statement in the `ALTER` section of
    the SQL statements properties file that adds the new field to the table. `SQLite.XM`
    will only execute `alter table` statements against tables that already exist in
    the database. So, the rules for creating and altering tables are as follows:


    - A `create table` statement will execute only if the table being created does
    not already exist in the database, otherwise the statement is skipped.

    - An `alter table` statement will execute only if the table that it alters already
    exists in the database, otherwise the statement is skipped.

    - An `alter` statement will only execute if the field being added to the table
    doesn’t already exist.


    Given these rules, the proper way to modify our company registration table is
    to include both a `create table` statement and an `alter table` statement in the
    SQL statements properties file. Depending on whether a user is installing for
    the first time or upgrading an existing installation, only one of the statements
    will execute. The two example statements are shown below.


    ```

    [TABLE]

    CREATE TABLE companyReg (id INTEGER PRIMARY KEY AUTOINCREMENT,

    companyRegPK TEXT, coName TEXT, hrContact TEXT, email TEXT,

    password TEXT, ceo TEXT)

    []

    ```


    ```

    [ALTER]

    [jsearch.companyReg][ceo][ALTER TABLE companyReg ADD ceo TEXT]

    []

    ```


    The `create table` statements for each new version of your app should create tables
    as they are required by the newest version. You should also include all of the
    `alter table` statements needed in order to upgrade tables from your apps first
    release to the latest. Do not remove `alter` statements between releases of your
    app, otherwise updates may not correctly apply. For users that are upgrading,
    `SQLite.XM` will execute the `alter table` statements needed in order to upgrade
    tables from their current state to the latest version. For new users, only the
    `create table` statement will be executed.


    An `alter table` statement that adds a field is only executed if the table does
    not already include the field. For each table in your database, a single query
    is made to get the names of the existing fields. Fields being added by `alter
    table` commands are compared to this list and those that already exist are skipped.


    This entire discussion sidesteps the issue of deleting fields from a table or
    making other more complex structural changes. Unfortunately, `SQLite` does not
    support these operations. If you have a field you no longer need, I suggest you
    simply remove all of the field data from the table rather than going through the
    pain of simulating a `drop column` statement. Unless you have a good reason to
    do otherwise, it’s probably better to just carry around the unneeded field. If
    you must make unsupported table changes, you will need to perform them manually.
    You can create a new table and then manually copy the data from the old table
    to the new one performing the translation in code. This solution has potential
    problems, especially when dealing with large data sets.


    ## Creating/Deleting indexes


    Table indexes can be changed in the following ways:


    - Drop an existing index

    - Create a new index


    That’s about it, there is no way to modify an existing index. If you have an index
    that you wish to change, the process is to first delete the index and then recreate
    it with the new structure using a new index name. As I mentioned earlier, `create
    index` and `drop index` statements go in the `INDEX` section of the SQL statements
    properties file. The statements can appear in any order.


    Let’s have a look at how we would update indexes for new releases of an app. It’s
    very likely that the first revision of your app will include at least some indexes,
    although this is not a requirement. However, for the purposes of our example,
    we are going to assume our app shipped with two index definitions. Below is the
    `INDEX` section of the SQL statements properties file for our example.


    ```

    [INDEX]

    [jsearch.companyReg][coRegNameIDX]

    [CREATE INDEX coRegNameIDX ON companyReg (coName)]

    [jsearch.jobPosting][jobTtileIDX]

    [CREATE INDEX jobTtileIDX ON jobPosting (jobTitle)]

    []

    ```


    We have two indexes, one on the `companyReg` table and one on the `jobPosting`
    table. Now, imagine that for our next release we decide that the `jobTitleIDX`
    index needs to change so that it includes the `pay` field. Also, we want to create
    a new index on the job seeker registration table. Below is our modified SQL statements
    `INDEX` section.


    ```

    [INDEX]

    [jsearch.companyReg][coRegNameIDX]

    [CREATE INDEX coRegNameIDX ON companyReg (coName)]

    [jsearch.jobPosting][jobTtileIDX]

    [CREATE INDEX jobTtileIDX ON jobPosting (jobTitle)]

    [jsearch.jobPosting][jobTtileIDX]

    [DROP INDEX jobTtileIDX]

    [jsearch.jobPosting][jobTtilePayIDX]

    [CREATE INDEX jobTtilePayIDX ON jobPosting (jobTitle, pay)]

    [jsearch.seekerReg][seekerNameIDX]

    [CREATE INDEX seekerNameIDX ON seekerReg (fName, lName)]

    []

    ```


    The new entries in the table are highlighted in bold. We now have three active
    indexes: `coRegNameIDX`, `jobTitlePayIDX`, and `seekerNameIDX`. The `jobTitleIDX`
    index that was part of our first release, has been dropped. The drop statement
    could have appeared anywhere, it just happens that I placed it right after the
    create statement. `SQLite.XM` applies the following rules when processing the
    `INDEX` section of the SQL file:


    - The `create table` statements in the `TABLE` section of the SQL statements properties
    file execute before any statements in the `INDEX` section.

    - The `alter table` statements in the `ALTER` section of the SQL statements properties
    file also execute before any statements in the `INDEX` section.

    - An `alter` statement will only execute if the field being added to the table
    doesn’t already exist.

    - A `create index` statement is only executed if the index does not already exist
    AND there is no `drop index` statement present for the index.

    - A `drop index` statement will only execute if the index exists.


    Do not remove index statements between releases of your app, otherwise updates
    may not correctly apply. Once an index has been dropped, you cannot reuse the
    dropped index name again. If you drop an index, be mindful to modify any SQL statements
    that use the `INDEXED BY` clause on the dropped index. The `INDEXED BY` phrase
    forces the SQLite query planner to use a particular named index on a `DELETE`,
    `SELECT`, or `UPDATE` statement.


    ## Dropping tables


    To drop a table, do the following:


    - Replace the `create table` statement in the `TABLE` section of the SQL statements
    properties with a `drop table` statement.

    - Remove all statements in the `ALTER` and `INDEX` sections of the SQL statements
    properties file that reference the table you wish to delete.


    That’s about it. Do not remove `drop table` statements between releases of your
    app, otherwise updates may not correctly apply.


    ## The SxmConnection class


    As an alternative to having the `SxmTransaction` class manage connections, you
    can create and manage connections directly using the `SxmConnection` class. However,
    before I show you how this is done, let’s take a moment to look at the design
    of this class.

    '
