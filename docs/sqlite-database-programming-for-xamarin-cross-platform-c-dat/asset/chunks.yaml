  raw: "*   Incorrectly formatted data being posted to a field. For example, if you\
    \ define a field in HotRiot to hold a number (done on step 3 of the HotRiot create\
    \ database wizard) and try posting text data to the field.\n\n*   You define a\
    \ field in HotRiot as “Required” (also done on step 3 of the create database wizard)\
    \ but the data field is missing in a record that SQLite.XM tries to synchronize.\n\
    \nBoth of these are easily avoided by simply including data validation logic in\
    \ your app. This is something you should always be doing anyway.\n\nNon-unique\
    \ data exception errors are a bit more complicated to manage, or, to be more accurate,\
    \ prevent from occurring in the first place. These errors are caused by posting\
    \ non-unique data to a data field that requires unique data. If you define a field\
    \ in a HotRiot table as unique, HotRiot will reject any record insert or update\
    \ request where the data being posted to the unique field already exists in the\
    \ database. Nothing unusual here, this what you would expect. The problem is,\
    \ in a distributed environment how can you be sure the data that’s being generated\
    \ on the device is, in fact, unique across all other devices? This is very similar\
    \ to the problem we faced generating unique primary keys. The solution there,\
    \ was to simply use GUIDs instead of the typical auto-increment value. Unfortunately,\
    \ for user generated data, such as passwords, this is not a viable option. Even\
    \ for application generated data, this will often times be an unworkable solution.\
    \ So, what are we to do? This problem is complicated by several factors.\n\n*\
    \   Mobile apps operate in the context of an unreliable distributed environment.\
    \ It may not be feasible at any particular point in time to check data generated\
    \ on the device against data already on the replication server.\n\n*   Data generated\
    \ on one device cannot realistically be checked against the data on all other\
    \ devices waiting to synchronize.\n\n*   The app may be online or offline at any\
    \ given moment.\n\n*   Replication is a deferred process. And even if we designed\
    \ for immediate replication, given the transient nature of connections, there\
    \ is really no way to guarantee real-time or even near real-time synchronization.\n\
    \nSo, how can we ensure unique data given an environment with the constraints\
    \ listed above? To show how this is done, we will be revisiting the registration\
    \ example from earlier.\n\n![](Image00029.jpg)\n\nYou’ve seen the figure above.\
    \ It shows a single registration table on the device that’s synchronized with\
    \ three tables on the server. For this discussion, imagine that the registration\
    \ password field must be populated with a password that is unique from all passwords\
    \ that have been entered by other users. How can we ensure a unique password?\
    \ The easy solution is to “cheat” and only allow users to register when the device/app\
    \ has network connectivity. In many instances, this is the preferred solution\
    \ and it’s the easiest to implement. Here’s one way to do it.\n\nFor this discussion,\
    \ we assume that the three tables in HotRiot needed to hold the registration information\
    \ have already been created. And that the password field in the `companyReg` table\
    \ has been defined as unique. When a user submits a registration, don’t immediately\
    \ save it to the local device database as you normally would, instead, first try\
    \ and save the record to HotRiot. Of the three tables in HotRiot that make up\
    \ the aggregate registration, you will only need to post the `companyReg` table\
    \ information, as this is the only table that includes a unique field. If the\
    \ record successfully posts to HotRiot, then you know the password field is unique.\
    \ The newly created record in HotRiot will serve as a placeholder effectively\
    \ reserving the password for this user. You now need to post the entire `company_registration`\
    \ record to the local device database. Once you have completed this step, you’re\
    \ done. SQLite.XM will take care of synchronizing the two other tables; `hrContact`\
    \ and `gcmApnsID` . Of course, if the post to HotRiot fails, you will need to\
    \ inspect the cause of the failure, and if it was due to a non-unique data exception,\
    \ you’ll need to ask the user to reenter their password. The code listing below\
    \ shows how to perform the operation just described.\n\nThis is a very simple\
    \ company registration Android activity. The `registrationSubmitHandler` method\
    \ attempts to save the registration record to HotRiot. If it succeeds, it calls\
    \ the method `postRegistrationLocal` , which saves the registration to the device\
    \ database. A detailed explanation follows the listing.\n\n `[` `Activity` ` (Label = `\
    \ `\"CoRegistrationActivity\"` `)]            `\n\n `public`  `class`  `CoRegistrationActivity`\
    \ ` : ` `Activity`\n\n`  {`\n\n `protected`  `override`  `void` ` OnCreate (`\
    \ `Bundle` ` bundle)`\n\n`    {`\n\n `base` `.OnCreate (bundle);`\n\n`      SetContentView (`\
