  trans: "\n\n虽然任何特定错误发生的概率可能非常，但从设计哲学的角度来说，我尝试将上述陈述作为准则来遵循。现在在实际操作中，你可能会稍微违背这条规则，否则错误处理可能会耗尽你的应用程序。某些错误非常罕见，不值得进行检查，或者它们指示了更深层次的问题，即使被捕获了，应用程序也无法处理。但在大多数情况下，我建议你坚持此作为指导原则。\n\
    \n错误报告子系统既是为了帮助你（开发者）高效地识别和修复问题，也是为了为应用程序提供必要的信息，以便在运行环境中理性地管理错误。在编写供其他开发者使用的代码时，这一点尤为真实。在设计错误管理系统时，力求尽可能具体地进行报告，并尝试为所有错误提供机器友好和人类友好的标识符。机器标识符通常是数字（最好是枚举），而人类当然显然对文本消息的处理效果更好。\n\
    \n## 搜索数据库\n\n让我们对我们的数据库执行一次简单的搜索。在这个示例中，我们将搜索职位发布数据库中由当前登录的公司用户提交的记录。下面是搜索页面的截图。\n\
    \n![](img/Image00017.jpg)\n\n当选中 `Get Jobs` 按钮时，将使用公司注册的主键作为搜索参数对职位发布数据库启动搜索。下面是\
    \ SQL 属性文件中该搜索的条目。\n\n`[getCompanyJobs] [SELECT * FROM jobPosting WHERE companyRegFK\
    \ = ?]`\n\n当选中 `Get Jobs` 按钮时，会调用下面的 `GetJobs` 方法。\n\n```csharp\nprivate ArrayList\
    \ GetJobs (string registrationPK)\n{\n  ArrayList parameterValues = new ArrayList();\n\
    \  parameterValues.Add(registrationPK);\n  List<Hashtable> postedJobs = new List<Hashtable>();\n\
    \  Hashtable postedJob = null;\n  using (SxmTransaction sxmTransaction = new SxmTransaction(\"\
    jsearch\")){\n    1 sxmTransaction.executeQuery(\"getCompanyJobs\", parameterValues);\n\
    \    2 while ((postedJob = sxmTransaction.getNextRow()) != null)\n    3 postedJobs.Add(postedJob);\n\
    \  }\n  4 buildTable (postedJobs);\n  return postedJobs;\n}\n```\n\n我们在第 1 行执行查询。然后，在第\
    \ 2 行和第 3 行，我们从结果集中提取每一行并将其放入一个列表中。每行都表示为一个哈希表，其中来自数据库表的字段名是键。我们可以使用简单的键查找从哈希表中提取字段数据。我们示例中的第\
    \ 2 行和第 3 行所示所示。它们被用于检索行数据。\n\n```csharp\n2 while ((postedJob = sxmTransaction.getNextRow())\
    \ != null)\n3    postedJobs.Add(postedJob);\n```\n\n作为替代方案，我们可以改而调用以下方法。\n\n```csharp\n\
    postedJobs = sxmTransaction.getAllRows()\n```\n\n这是获取所选记录数据更简单的方法。`getAllRows`\
    \ 方法的作用大致相当于上述第 2 行和第 3 行。然而，`getAllRows` 总是返回一个有效的 `ArrayList`，如果结果集为空，则列表将为空。\n\
    \n你会注意到，我们没有在 `using` 块的任何地方调用 `commitTransaction`。在事务期间没有处理数据库更新命令，因此没有需要提交的内容。当事务只包含\
    \ `select` 语句时，它不需要提交。\n\n作为一个一般规则，你应该尽可能地释放数据库资源。你可以通过限制在事务 `using` 块内执行的工作量来实现这一点。如你所见，记录数据从数据库移动到集合中，然后在\
    \ `using` 块之外进行处理。这允许我们提前完成事务，释放数据库使用的任何资源。在第 4 行，查询选择的数据被传递给 `BuildTable` 方法。但到此时，事务对象已经释放，因此我们可以花费任何需要的时间来处理搜索结果，而不必担心数据库资源。现在，让我们来看\
    \ `BuildTable` 方法。\n\n```csharp\nprivate void BuildTable (List<Hashtable> postedJobs)\n\
    {\n  TableLayout jobsTable = (TableLayout)FindViewById(Resource.Id.coJobsTable);\n\
    \  string[] fieldData = new string[3];\n  jobsTable.RemoveViews();\n  1 foreach\
    \ (Hashtable job in postedJobs)\n  {\n    2 fieldData[2] = job[\"pay\"].ToString();\n\
    \    3 fieldData[0] = (string)job[\"jobTitle\"];\n    4 fieldData[1] = (string)job[\"\
    description\"];\n    TableRow row = new TableRow(this);\n    foreach (string fieldValue\
    \ in fieldData)\n    {\n      TextView tv = new TextView(this);\n      tv.SetPadding(8,\
    \ 10, 8, 10);\n      tv.SetText(fieldValue, TextView.BufferType.Normal);\n   \
    \   row.AddView(tv);\n    }\n    jobsTable.AddView(row);\n  }\n}\n```\n\n此方法通过将行数据输出到动态创建的表格来处理搜索结果。第\
    \ 1 行到第 4 行显示如何访问每行的单独字段。下面的截图显示了定位到三个发布的搜索输出。这些都是不言自明的基础内容。\n\n![](img/Image0022.jpg)\n\
    \n### 内联处理记录数据\n\n在上面的示例中，所选的记录数据首先从数据库移动到集合中，然后由 `BuildTable` 方法进行处理。这种模式在某些情况下是有意义的，例如\n\
    \n*   将记录数据交给另一个线程。\n*   如果你预计对结果集进行某些耗时处理。\n*   如果你需要多次访问数据或由于其他原因需要保留数据。\n*\
    \   资源占用不是问题且你希望使用最简单的设计模式。\n\n作为替代方案，你可以在从结果集中读取所选记录时直接处理它们。下面是重写后的 `GetJobs`\
    \ 和 `BuildTable` 方法，用于展示如何实现。\n\n```csharp\nprivate void GetJobs (string registrationPK)\n\
    {\n  ArrayList parameterValues = new ArrayList();\n  parameterValues.Add(registrationPK);\n\
    \  using (SxmTransaction sxmTransaction = new SxmTransaction(\"jsearch\")){\n\
