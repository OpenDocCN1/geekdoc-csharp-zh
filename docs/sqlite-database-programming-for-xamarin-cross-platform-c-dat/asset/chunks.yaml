    `[` *`database_name`* ***`.`*** *`table_name`* `] [` *`column name`* `] [` *`alter
    table statement`* `]`


    Each field is placed inside opening and closing brackets. The fields must appear
    in the order shown above. However, you can format them on separate lines or include
    white spaces in order to enhance readability. The first field is the fully qualified
    name of the table being altered, that is, the database name followed by a period
    followed by the table name. The second field is the name of the column being added
    to the table. The last field is the actual SQL alter table statement.


