    \            sd.tableName.Equals(\"company_registration\") == true)\n        {\n\
    \            processList = transformCompanyReg(sd);\n        }\n        else\n\
    \        {\n            processList = new List<SynchDescriptor>();\n         \
    \   processList.Add(sd);\n        }\n    }\n    catch (Exception doNothing) {}\n\
    \    return processList;\n}\n```\n\nThe method above is the actual pre-processing\
    \ delegate. It checks if the action for the record being synchronized is either\
    \ an insert or an update and that the record came from the `company_registration`\
    \ table; see line number 1. If all of this is true, then the record needs to be\
    \ transformed, otherwise the record can be synchronized without any modification.\
    \ The `transformCompanyReg` method below performs the actual transformation from\
    \ the device schema to the server-side schema. A complete explanation follows\
    \ the code listing.\n\n```csharp\nprivate static List<SynchDescriptor> transformCompanyReg(SynchDescriptor\
    \ sourceSD)\n{\n    List<SynchDescriptor> processList = new List<SynchDescriptor>();\n\
    \    1 SynchDescriptor companyRegSD = new SynchDescriptor(sourceSD.action, sourceSD.dbName,\
    \ \"companyReg\");\n    2 SynchDescriptor hrContactSD = new SynchDescriptor(sourceSD.action,\
