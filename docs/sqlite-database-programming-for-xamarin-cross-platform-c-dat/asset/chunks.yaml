    , \"picture\");\n    translate.add(\"coRegPrimaryKey\", \"registration_fk\");\n\
    \    translateSynchDescriptor(sourceSD, hrContactSD, translate);\n    18 hrContactSD.recordDataToSynch.Add(\"\
    primary_key\", Guid.NewGuid().ToString());\n    // Set the source to destination\
    \ field name for the gcmApnsID table.\n    translate.Clear();\n    translate.add(\"\
    coIOSToken\", \"ios_device_token\");\n    translate.add(\"coAndroidToken\", \"\
    android_device_id\");\n    translate.add(\"coRegPrimaryKey\", \"registration_fk\"\
    );\n    translateSynchDescriptor(sourceSD, pushConnectionIDSD, translate);\n \
