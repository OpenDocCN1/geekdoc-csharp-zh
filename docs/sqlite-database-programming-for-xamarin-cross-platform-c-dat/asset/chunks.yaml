    遗憾的是，你更有可能正在创建一个遵循在线模式或 OCA（离线优先）模式的应用。在这种情况下，情况可能会变得模糊。在大多数情况下，在线移动应用程序可以设计成
    OCA，反之亦然。事实上，我认为更准确的说法是，大多数在线移动应用实际上是被误识别的 OCA。


    让我们来看一个例子。假设你正在为一家特种商户创建一个类似于亚马逊价格比较的应用程序。该应用通过扫描条形码搜索库存中的物品并显示价格比较。对于这个例子，假设这是我们应用程序中的唯一功能。这看起来像是一个在线应用程序，因为应用需要与后端服务器通信以定位扫描的产品信息。事实确实如此。但如果没有网络连接，你会怎么办？你可以简单地向用户显示某些状态消息，让价格检查请求报错。这种结果可算不上太理想。另一种选择是提议在本地保存请求，直到网络连接恢复，届时，应用程序将执行搜索并将结果呈现给用户。这好得多！我们这个表面上在线的应用程序，经过深思熟虑，实际上是一个
    OCA。在没有网络连接时，它仍然允许用户执行产品扫描。当连接恢复时，应用程序将完成其处理周期，即搜索并显示价格比较。


    作为一个一般原则，尽可能选择 OCA 模式。如果你认为你的应用符合纯在线应用程序的条件，请重新想一想。真的仔细考虑各种用例场景。在大多数情况下，你会发现你的应用程序被设计成
    OCA 更好。虽然这增加了复杂性，但它提供了最佳的用户体验。


    ## 这是一个某种笑话吗？


    对于典型的 OCA，一个完整的跨平台数据存储解决方案需要许多技术的共同工作。其原因追溯到 OCA 需要在离线和在线状态下运行并能够同步。这需要一个可以支持应用程序数据“存储并转发”架构的基础设施。这反过来需要在设备上有一个数据库、一个服务器端数据库以及一个连接两者的中间件层。在我们的案例中，我们希望解决方案是跨平台的，因此我们还需要一个跨平台开发框架。诚然，选择跨平台解决方案的原因不仅限于数据层，但这仍然是一项要求。如果能有一个抽象层来简化对
    `SQLite` 的操作并包含执行同步的逻辑，那就太棒了。如果你将所有这些整合在一起，你会得到一个像下面的列表


    *   `SQLite` : 我们的本地设备数据存储器。

    *   `SQLite.XM` : 我们的 `SQLite` 抽象层，包含了对数据同步的支持。

    *   服务器端中间层 : 对于书中的示例，我们使用 `HotRiot.com`。

    *   服务器端数据库 : 传统的关系型数据库（例如 `MySQL`）或 NoSQL 文档存储（例如 `MongoDB`）。

    *   `Xamarin` : 我们的跨平台框架。


    上面的列表是多种技术的组合。它包含了设备端和服务器端数据库、跨平台开发框架、带有同步逻辑的 `SQLite` 抽象层以及服务器端中间层。这仅仅为了支持数据持久化，看起来似乎有点过多。但事实证明，为了完全实现跨平台
    OCA，这些都是必不可少的。


    让我们来看看这些组件分别位于什么位置。


    ### SQLite

    `SQLite` 是一种轻量级、无服务器的传统关系型数据库。通过“传统”，指的是支持具有 ACID 特性的事务、连接、触发器、实现标准 `SQL` 等数据库。如名所示，`SQLite`
    是一种设计为轻量级解决方案、占用空间小、旨在在资源有限的设备上的数据库实现。


    iOS 和 Android 都作为其平台的一部分内置了 `SQLite` 数据库引擎。因此，对于这两个操作系统，你不需要做任何事情就可以让应用可以使用 `SQLite`。Windows
    Phone 提供 `SQLite` 扩展，可以从 `Visual Studio` 轻松安装。大多数移动应用程序都需要在本地保存一些数据。`SQLite` 是一个自然的选择，因为它随处可用且功能强大。


    ### SQLite.XM

    `SQLite.XM` 是用 `C#` 编写的 `SQLite` 抽象层，设计用于使用 `Xamarin` 开发的应用。它让在 `Xamarin` 中使用
    `SQLite` 变得轻而易举。它保护你的应用程序不受直接与 `SQLite` 操作的细节。相反，你的应用程序与一个提供数据库 CRUD 功能的高级跨平台层进行交互。除了提供一个极大简化数据库搜索和记录检索的抽象层外，`SQLite.XM`
    还负责组织你的 `SQL`、初始化应用架构、执行架构更新以及将数据同步到服务器端数据库。


    此时，显而易见的问题是：`SQLite.XM` 在哪里同步设备数据？`SQLite.XM` 开箱即用即可与 `HotRiot.com` 同步。`HotRiot`
    是一个用于移动应用程序的托管服务器端平台；更多细节请见下一节。`SQLite.XM` 也能与任何服务器进行通信以实现数据同步。它允许你将自己的委托方法插入同步处理链中，以便为你你选择的任何云端服务器编写接口。我将在书的第三部分“数据到云云的同步”中详细解释这一点。


    ### 服务器端中间层

    OCA 需要将其设备数据同步到服务器端数据存储器。这由设备端的 `SQLite.XM` 负责。然而，需要一个中间件服务器才能将数据写入数据库。作为一个一般原则，永远不要让设备直接连接服务器数据库。相反，请求会被到中间层，由中间层代表客户端执行数据库操作。但这远不止于。我们并不是为了同步而同步数据。我们将数据传输到服务器是为了支持应用程序的功能，而这需要后端的支持。


    仅仅读写 `MySQL` 或 `Mongo` 等后端数据库就需要中间件支持。但还有许多应用也需要的其他服务，例如：


    *   通过 Apple 推送服务 (APNs) 或 Google 云消息 (GCM) 进行推送通知。

    *   为需要在设备间共享生成的数据提供中央存储。

    *   文档管理支持。例如生成缩略图或将附件移动到键值存储（如 `AWS S3`）。

    *   事件触发器支持。例如，当数据库中存储了某些感兴趣的记录时联系用户。

    *   批量邮件处理，用于通过电子邮件联系所有用户。

    *   用于安全的权限管理。

    *   发送电子邮件确认，例如用户注册应用程序时。


    这不是一个详尽的列表，但它突出了许多需要后端基础设施的服务。现在，有几种方法可以处理。你可以自己构建服务器端基础设施。然而，正确完成这些工作的工作量巨大，且无法为你的应用增加差异。后端虽然至关重要，但对终端用户来说是不可见的。你的用户不会因为你后端开发得很好就爱上应用，他们只会在性能不佳时注意到。编写代码、部署服务器和提供持续支持是一项巨大的工程。更不用说这为你的开发周期增加了多少时间。这可能会非常昂贵。有一个更好的方法。找到良好的托管服务并使用它吧！


    '
- fmt: '

    `SQLite.XM` comes ready to work with `HotRiot.com`. To reiterate, `HotRiot` is
    a hosted server-side platform for mobile applications. It includes support for
    all of the bulleted items listed above and more. The `HotRiot C# Xamarin Xamarin
    API` is built into `SQLite.XM`, so there is nothing you need to do in order to
    use `SQLite.XM` with `HotRiot`. Of course, `SQLite.XM` doesn’t just work with
    `HotRiot`, it is designed to work with any back-end. I show you how to do this
    in part 3 of the book.


    ### A server-side database

    We are going to need a server-side database where we can synchronize the local
    device data. This can be either a traditional relational database or a NoSQL document
    database. You are probably wondering why I specifically state that the server
    datastore should be either a relational or a NoSQL document database. The reason
    is simple. `SQLite` is a traditional relational database. Synching with another
    relational database or a NoSQL document database such as `MongoDB`, will provide
    the best device-to-server translation. While `SQLite.XM` will support synching
    to any back-end, a server-side database whose data model is significantly different
    from the data model on the device can make synching difficult. It is not unusual
    to have a schema on the server that is different from the schema on the device,
    and `SQLite.XM` fully supports synching to different schemas. However, when the
    fundamental data models between the device and the server get too far apart, it
    becomes difficult to perform a rational, workable translation. For example, as
    a generally rule, it would be less than ideal to try and synch your apps data
    with a key/value datastore. Of course, depending on the particulars of your app
    and what you intend to with your data once it is synched, there are may legitimate
    reasons for breaking this rule. But it would be unusual.


    `HotRiot` includes support for `MySQL` and `MongoDB`.


    It would be fair to ask why include two server-side database options when they
    perform a similar function. The short answer is that each of these two databases
    have strengths and weaknesses. To only support a relational database or only a
    NoSQL document database would limit us to trying to fit a solution where it might
    not be best suited.


    ### Xamarin

    `Xamarin` is our cross platform development framework of choice. It allows us
    to create native Android, iOS, and Windows apps using a mostly shared `C#` code
    base. `Xamarin` lets you to write the vast majority of the non UI application
    logic using shared code. The platform specific layer is typically much smaller
    and generally encompasses the user interface code. According to `Xamarin`, the
    average application written using `Xamarin` shares about 65% to 70% of the app
    code across all three development platforms. This greatly reduces the programming
    effort needed to support the most popular mobile devices. Given these strengths,
    `Xamarin` is a natural choice for creating a cross platform persistence layer.
    The other option is to create a separate data layer for each of the platforms
    we wish to support. That would require coding in `Objective-C`, `Java` and `C#`
    in order to support iOS, Android and Windows. Using one language to create a single
    shared persistence layer allows us to focus on the problem we wish to solve, without
    having to spend too much time on platform related issues.


    This is not a book intended to detail `Xamarin` development. There are other good
    resources for that. I explain how to use `Xamarin` to the extent needed to create
    our data persistence layer. Beyond that, `Xamarin` is largely ignored. This allows
    us to stay focused on our data persistence solution. You don’t need to be a `Xamarin`
    developer to follow along. We will explain enough `Xamarin` to get you through.


    ### Do I really need all of this?

    The short answer is; probably. If you are developing an `OCA`, then definitely.
    For a pure offline application, you may only need local database support, and
    depending on what you build, you may not even need that. For pure online applications,
    you will probably need the entire stack except the synchronization logic. However
    this is all highly dependent on what you’re building.


    ### Understanding Where HotRiot fits in

    We are going to be synching local data generated by our application to a central
    back-end database provided to us through `HotRiot`. This database could be used
    for a variety of purposes, but this really needs to be thought of in broader terms.
    When you synch, whether to `HotRiot` or some other back-end, you’re not just synching
    to a database, what you’re really doing is synching with a server-side platform
    that provides support services to your application.


    As stated earlier, `HotRiot` provides mobile applications with a server-side platform
    in the cloud. `HotRiot` includes a set of graphical tools that are used to create
    an infrastructure for the server side portion of your application, making it a
    breeze to create tables or collections, design queries, set-up permissions, create
    triggers, etc.


    For the moment, the most interesting aspect of our choice for a back-end server
    solution is the fact that all `HotRiot` accounts come with a provisioned SQL (`MySQL`)
    and NoSQL (`MongoDB`) database. This allows you to choose which type of server-side
    datastore best fits your needs. Another interesting feature of `HotRiot` is that
    it can use your own personal `MySQL` or `Mongo` database for storing your data;
    this is instead of using a `HotRiot` managed database server. More on this later.


    ### Database design considerations

    The database on the local device is `SQLite`. This is a traditional relational
    database. From a data modeling perspective, the most influential feature of a
    relational database is their support for joins. This single feature, more than
    any other, dictates the fundamental structure of the data for a relational database.
    The device side database should be designed independent from the database used
    on the back-end server where the local data will be synched. But this presents
    a potential problem. If we wish to use `MongoDB` or some other NoSQL database
    as our back-end datastore, instead of relational database, how do we deal with
    the fact that most NoSQL databases do not support joins. And, as a result, require
    a fundamentally different structure from our local database?


    Unfortunately, there is no easy answer but that doesn’t mean the problem cannot
    be managed. One of the factors that works in our favor is that the local datastore
    for mobile apps tend to be relatively simple when compared to larger enterprise
    applications. Although this is not always the case this does generally hold true,
    and can help to make the translation from a relational model to a document model
    easier.


    Let’s take a moment to discuss `MongoDB`, `MySQL`, and `HotRiot`.


    When you create your back-end database in `HotRiot` for the purposes of synching,
    you are given the option to use either `MySQL` or `MongoDB` for the underlying
    storage engine. `MySQL` and `MongoDB` are both very capable databases, each offers
    features that might make one or the other more appropriate in any particular circumstance.
    `HotRiot` allows you to use both `Mongo` and `MySQL` simultaneously, although
    I generally don’t recommend this. While `HotRiot` has done a lot of work to smooth
    out the differences between these databases so that you have a very similar user
    experience, these are, nonetheless, different database technologies. Thus, intermingling
    them within the same application is generally not recommended.

    '
