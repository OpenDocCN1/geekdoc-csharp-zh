    \n**`4`** `       hrInsertResponse = ` `await`  `HotRiot` `.getHotRiotInstance.submitKeyUpdateInsertRecord (tableName, editKey,\
    \  `\n\n `systemSynchID, hrRecord, ` `null` `);`\n\n`        int resultCode =`\
