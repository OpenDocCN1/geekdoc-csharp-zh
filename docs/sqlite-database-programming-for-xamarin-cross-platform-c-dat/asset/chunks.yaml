  trans: "\n没有所谓的“正确”选择。在不同的情况下，这些选项中的任何一个可能更或不合适。使用第一种选项，你本质上是在说在事务活动期间发生的**任何**异常都应该导致回滚（rollback）。之所以这样做，是因为所有异常都会退出\
    \ `using` 块。请记住我们之前的规则：在事务处于激活状态时退出 `using` 块将导致回滚。这是我最常用的错误处理策略。我觉得它最符合事务的精神以及它们预期的使用方式。\n\
    \n第二种 `try-catch` 选项允许你在退出 `using` 块之前检查异常并采取某些补救措施。据此，你可能决定提交当前激活的事务、重试失败的操作，或者执行其他中间操作。如果你在退出\
    \ `using` 块之前需要先执行某些特定的清理工作，或者你希望能够提交部分成功的事务，这种方法可能会很有用。我通常不认为这种策略非常有用。通常来说，事务应该是短生命期的操作，要么全部成功，要么全部失败。最好不要在事务内部执行需要自己进行清理的工作。\n\
    \n最后一种 `try-catch` 选项让你对处理 `using` 块内部发生的单个异常拥有细粒度的控制权。如果你在使用单个事务对象执行多个独立的事务，你可能会选择使用这种策略。见下面的代码片段。\n\
    \n```java\ntry {\n  using (SxmTransaction sxmTransaction = new SxmTransaction(\"\
    jsearch\")){\n    try {\n      ir = sxmTransaction.executeInsert(\"registerCompany\"\
    , parameterValues);\n      if (ir.SynchID == null || ir.RecordID == -1L)\n   \
    \     throw new SxmException(new ErrorMessage(\"Insert error @ processInsert.\"\
    , Defines.SxmErrorCode.userDefined));\n      if (sxmTransaction.commitTransaction()\
    \ != SQLiteErrorCode.Ok)\n        throw new SxmException(new ErrorMessage(\"Commit\
    \ error @ processInsert.\", Defines.SxmErrorCode.userDefined));\n    }\n    catch\
    \ (System.Exception ex){\n      sxmTransaction.rollbackTransaction();\n    }\n\
    \    try {\n      ir = sxmTransaction.executeInsert(\"newRegistration\", parameterValues);\n\
    \      if (ir.SynchID == null || ir.RecordID == -1L)\n        throw new SxmException(new\
    \ ErrorMessage(\"Insert error @ processInsert.\", Defines.SxmErrorCode.userDefined));\n\
    \      if (sxmTransaction.commitTransaction() != SQLiteErrorCode.Ok)\n       \
    \ throw new SxmException(new ErrorMessage(\"Commit error @ processInsert.\", Defines.SxmErrorCode.userDefined));\n\
    \    }\n    catch (System.Exception ex){\n      sxmTransaction.rollbackTransaction();\n\
    \    }\n    sxmTransaction.executeQuery(\"findCompany\", null);\n    return sxmTransaction.getAllRows();\n\
    \  }\n}\n```\n\n上面的事务对象被用于执行两个独立的事务。如果第一个事务失败，第二个事务仍然允许执行。如果第二个事务失败，查询语句仍然允许运行。如果你有独立的事务，你可能会决定以这种方式在\
    \ `using` 块内部处理异常。这种序列留下了一个悬而的问题：如果回滚失败了会怎样？如果在执行回滚时发生错误，将抛出一个异常。除非回滚是由 `using`\
    \ 块的清理代码执行的，否则如此。抛出异常的原因是。\n\n**针对错误进行编程**\n\n当我谈到最小化代码的错误概况时，指的是什么？事实证明我们可以做得更好。我们做了四项修改，显著改进了代码。[.]。\n\
    \n在紧凑代码的过程中，我们还改进了资源使用。你问是如何做到的？`SxmTransaction` 对象在退出 `using` 块时会自动超出作用范围，使其可以立即被垃圾回收。通过对我们的原始设计进行审视，我们发现了几个可以改进易用性的简单突破口。最终结果不仅是代码更加健壮、资源利用率更高，而且代码更易读、更易写且不易出错。\n"
- fmt: "\nWhile the probability of any particular error occurring might be very low,\
    \ from a design philosophy, I try to following the statement above like a maxim.\
    \ Now, as a practical matter you will probably end up bending this rule a bit,\
    \ otherwise error processing could wind up consuming your app. Some errors are\
    \ so remote that they don’t warrant checking or indicate a much deeper problem\
    \ that an application is unequipped to handle even if caught. But for the most\
    \ part, I recommend that you stick to this as a guiding principal.\n\nAn error\
    \ reporting subsystem is as much about helping you, the developer identify and\
    \ fix problems with efficiency as it is about providing your app with the information\
    \ necessary for it to rationally manage errors in the wild. This is especially\
    \ true when writing code that will be consumed by other developers. When designing\
    \ your error management system, strive to always report with as much specificity\
    \ as possible and try to provide both machine friendly and human friendly identifiers\
    \ for all errors. Machine identifiers are typically numbers, preferably enums,\
    \ humans, of course, do better with text messages.\n\n## Searching the database\n\
    \nLet’s perform a simple search of our database. In this example, we are going\
    \ to search for records in the job postings database that were submitted by the\
    \ currently logged in company user. Below is a screenshot of the search page.\n\
    \n![](Image00017.jpg)\n\nWhen the `Get Jobs` button is selected, a search of the\
    \ job postings database is initiated using the primary key from the company registration\
    \ as the search parameter. Below is the entry in the SQL statements properties\
    \ file for this search.\n\n`[getCompanyJobs] [SELECT * FROM jobPosting WHERE companyRegFK\
    \ = ?]`\n\nThe `GetJobs` method shown below is called when the `Get Jobs` button\
    \ is selected.\n\n```csharp\nprivate ArrayList GetJobs (string registrationPK)\n\
    {\n  ArrayList parameterValues = new ArrayList();\n  parameterValues.Add(registrationPK);\n\
    \  List<Hashtable> postedJobs = new List<Hashtable>();\n  Hashtable postedJob\
    \ = null;\n  using (SxmTransaction sxmTransaction = new SxmTransaction(\"jsearch\"\
    )){\n    1 sxmTransaction.executeQuery(\"getCompanyJobs\", parameterValues);\n\
    \    2 while ((postedJob = sxmTransaction.getNextRow()) != null)\n    3 postedJobs.Add(postedJob);\n\
    \  }\n  4 buildTable (postedJobs);\n  return postedJobs;\n}\n```\n\nWe execute\
    \ our query on line 1. Then, on lines 2 and 3, we extract each row from the record\
    \ set and place it in an array list. Each row is represented as a hash table,\
    \ where the field names from the database table are the keys. We can extract the\
    \ field data from the hash table using a simple key lookup. Lines 2 and 3 from\
    \ our example are shown below. The are used to retrieve the row data.\n\n```csharp\n\
    2 while ((postedJob = sxmTransaction.getNextRow()) != null)\n3    postedJobs.Add(postedJob);\n\
    ```\n\nAs an alternative, we could have called the following method instead.\n\
    \n```csharp\npostedJobs = sxmTransaction.getAllRows()\n```\n\nThis is an even\
    \ easier way of getting the selected record data. The method `getAllRows` performs\
    \ roughly the equivalent of lines 2 and 3 above. `getAllRows` always returns a\
    \ valid `ArrayList`, however, the list will be empty if the record set is empty.\n\
    \nYou will notice that we don’t call `commitTransaction` anywhere in the `using`\
    \ block. There were no database update commands processed during the transaction,\
    \ so there is nothing to commit. When a transaction only includes select statements,\
    \ it doesn’t need to be committed.\n\nAs a general rule, you should free database\
    \ resources as quickly as possible. You do this by limiting the amount of work\
    \ you do within a transactions `using` block. As you can see, the record data\
    \ is moved from the database into a collection and is then processed outside the\
    \ using block. This allows us to complete the transaction early, releasing any\
    \ resources used by the database. On line 4, the data selected by the query is\
    \ passed to the `BuildTable` method. But by this time, the transaction object\
    \ has already been released so we can spend whatever time we need processing the\
    \ search results without having to concern ourselves about database resources.\
    \ Now let’s take a look at the `BuildTable` method.\n\n```csharp\nprivate void\
    \ BuildTable (List<Hashtable> postedJobs)\n{\n  TableLayout jobsTable = (TableLayout)FindViewById(Resource.Id.coJobsTable);\n\
    \  string[] fieldData = new string[3];\n  jobsTable.RemoveViews();\n  1 foreach\
    \ (Hashtable job in postedJobs)\n  {\n    2 fieldData[2] = job[\"pay\"].ToString();\n\
    \    3 fieldData[0] = (string)job[\"jobTitle\"];\n    4 fieldData[1] = (string)job[\"\
    description\"];\n    TableRow row = new TableRow(this);\n    foreach (string fieldValue\
    \ in fieldData)\n    {\n      TextView tv = new TextView(this);\n      tv.SetPadding(8,\
    \ 10, 8, 10);\n      tv.SetText(fieldValue, TextView.BufferType.Normal);\n   \
    \   row.AddView(tv);\n    }\n    jobsTable.AddView(row);\n  }\n}\n```\n\nThis\
    \ method processes the search results by outputting the row data to a table that\
    \ is dynamically created. Lines 1 thru 4 show how the individual field for each\
    \ row is accessed. The screenshot below shows the output for a search that located\
    \ three postings. This is basic stuff that’s self-explanatory.\n\n![](Image0022.jpg)\n\
    \n### Processing record data in-line\n\nIn the example above, the selected record\
    \ data was first moved out of the database and into a collection before being\
    \ processed by the `BuildTable` method. There are times when this pattern makes\
    \ sense, example:\n\n* When handing off the record data to another thread.\n*\
    \ If you expect to perform some time processing of the result set.\n* If you need\
    \ to access the data multiple times or you need to hold on the data for other\
    \ reasons.\n* Resource usage is not an issue and you wish to use the simplest\
    \ design pattern.\n\nAs an alternative, you can, instead, process the selected\
    \ records as they are read from the result set. Below is the `GetJobs` and `BuildTable`\
    \ methods rewritten to show how this is done.\n\n```csharp\nprivate void GetJobs\
    \ (string registrationPK)\n{\n  ArrayList parameterValues = new ArrayList();\n\
    \  parameterValues.Add(registrationPK);\n  using (SxmTransaction sxmTransaction\
    \ = new SxmTransaction(\"jsearch\")){\n    sxmTransaction.executeQuery(\"getCompanyJobs\"\
    , parameterValues);\n    BuildTable(sxmTransaction);\n  }\n}\n\nprivate void BuildTable\
    \ (SxmTransaction sxmTransaction)\n{\n  TableLayout jobsTable = (TableLayout)FindViewById(Resource.Id.coJobsTable);\n\
    \  string[] fieldData = new string[3];\n  jobsTable.RemoveAllViews();\n  1 while\
    \ (sxmTransaction.nextRow() == true)\n  {\n    2 fieldData[0] = (string)sxmTransaction.getValue(\"\
    jobTitle\");\n    3 fieldData[1] = (string)sxmTransaction.getValue(\"description\"\
    );\n    4 Type payType = sxmTransaction.getType(\"pay\");\n    5 fieldData[2]\
    \ = ((System.Int64)sxmTransaction.getValue(\"pay\")).ToString();\n    TableRow\
    \ row = new TableRow(this);\n    foreach (string fieldValue in fieldData)\n  \
    \  {\n      TextView tv = new TextView(this);\n      tv.SetPadding(8, 10, 8, 10);\n\
    \      tv.SetText(fieldValue, TextView.BufferType.Normal);\n      row.AddView(tv);\n\
    \    }\n    jobsTable.AddView(row);\n  }\n}\n```\n"
