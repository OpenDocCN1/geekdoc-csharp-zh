  trans: "\n与其创建一个传统的自增值作为键字段，不如将其定义为文本字段。然后你可以用全局唯一标识符（GUID）填充该字段，它有时称为通用唯一标识符（UUID）。简单来说，GUID\
    \ 可以被看作是一个随机数，几乎可以保证与所有其他 GUID 都是唯一的。我们可能会问，我们如何能如此确定 GUID 不会产生像自增键那样的重复键问题呢？我将不会详述，但考虑到\
    \ GUID 的生成方式及其庞大的体积（通常为 128 位），人们通常认为依赖它的唯一性是安全的。稍后，我将向你展示如何生成 `GUID`。\n\n## SQLite\
    \ 命名约束\n\n在 SQLite 中，表名、索引名、列名或任何其他命名对象应仅包含字母和数字（包括下划线），并且不能以数字开头。避免所有其他特殊字符，包括空格。这是最安全的方法。尽管如此，如果使用下面机制中的一种进行引用，SQLite\
    \ 将允许在命名对象中使用特殊字符。\n\n1. 使用双引号，如下：`\"keyword\"`\n2. 使用括号，如下：`[keyword]`\n3. 使用反引号（ASCII\
    \ 码 96），如下：`keyword`\n\n在选择名称时，你可能想要遵循的另一个规则是避免使用英文单词。这样做是为了避免与 SQL 关键字发生任何冲突。\n\
    \n## 初始化数据库\n\n现在我们准备就绪，可以成功初始化数据库。让我们来看一个将所有部分结合在一起的示例。下面是一个 Android 主 Activity\
    \ 类的代码片段。在下面的示例中，假设你已经创建一个名为 `SqlStatements.txt` 的 SQL 语句属性文件，并向其中填充了创建表语句，以及可选的、任何所需的索引语句。\n\
    \n```java\npublic class MainActivity : Activity\n{\n    protected override void\
    \ OnCreate(Bundle bundle)\n    {\n        base.OnCreate(bundle);\n        SetContentView(Resource.Layout.Main);\n\
    \        try {\n            1 new DatabaseDescriptor(\"jsearch\");\n         \
    \   // 读取放在 Assets 文件夹中的 SQL 语句属性文件。\n            2 using (StreamReader sr = new\
    \ StreamReader(Assets.Open(\"SqlStatements.txt\"))){\n                3 ProcessSQLStatements.Parse(sr);\n\
    \            }\n            4 SxmInit.initialize();\n            5 using (SxmTransaction\
    \ sxmTrans = new SxmTransaction(\"jsearch\"))\n            {\n            }\n\
    \        } catch (System.Exception ex){\n            string message = ex.Message;\n\
    \        }\n    }\n}\n```\n\n初始化数据库的第一步是为应用程序所需的每个数据库创建一个数据库描述符，参见第 1 行。我们的示例程序只需要一个数据库，这在移动应用程序中很典型。完成这一步后，下一步是处理\
    \ SQL 语句属性文件。查看第 2 行和第 3 行。第 2 行为文件创建了一个新的流读取器。文件流在第 3 行被处理。等这两个步骤完成后，就是时候实际执行初始化了。这在第\
    \ 4 行完成。第 5 行为新初始化的数据库创建了一个事务。这一步实际上并不是初始化过程的一部分，在这里仅仅用于说明目的。我将在稍后的章节中详细解释事务。你何时实际初始化数据库并不重要。在我们的示例中，我们在主\
    \ Activity 中执行操作。唯一的规则是，你在尝试建立连接或创建事务对象之前必须初始化数据库。这似乎显而易见。\n\n下面是一个如何在 iOS 上进行此类初始化的示例。\n\
    \n```csharp\npublic class Application {\n    // 这是应用程序的主入口点。\n    static void\
    \ Main(string[] args)\n    {\n        Thread synchThread = new Thread(new ThreadStart(initDB));\n\
    \        synchThread.Start();\n        // 如果你想使用不同于 \"AppDelegate\" 的 \n     \
    \   // Application Delegate 类，你可以在这里指定。\n        UIApplication.Main(args, null,\
    \ \"AppDelegate\");\n    }\n    private static void initDB() {\n        new DatabaseDescriptor(\"\
    jsearch\", Environment.SpecialFolder.Personal);\n        // 读取放在 Resources 文件夹中的\
    \ SQL 语句属性文件。\n        using (StreamReader sr = new StreamReader(\"Resources/SqlStatements.txt\"\
    )){\n            ProcessSQLStatements.Parse(sr);\n        }\n        SxmInit.initialize();\n\
    \    }\n}\n```\n\n你可以看到，Android 的初始化和 iOS 的初始化几乎相同。主要区别在于我们在独立的线程上执行了 iOS 初始化。严格来说，这可能没有必要，你也可以始终对\
    \ Android 这样做。另一个细微的区别是我们将 SQL 语句属性文件的路径传递给 `StreamReader` 的方式。这种处理方式不同是因为在 Android\
    \ 中 SQL 语句属性文件被放置在 `Assets` 文件夹中，而在 iOS 中它被放置在 `Resources` 文件夹中。\n\n现在，你可能会观察初始化序列，并认为在启动时这样做相当低效。然而，仔细观察代码，你会发现它其实非常高效。解析语句属性文件是非常轻量级的，而且，即使是包含许多语句的文件，也不会有多大，可能只有\
    \ 100 kB。创建架构的代码也十分高效。对于你的应用程序使用的每个数据库（通常只有一个），都会进行单次查询来获取现有表的名称。创建表语句与此列表进行比较，并跳过数据库中已存在的表。修改表语句仅对已存在的表执行。这允许你对表进行架构更改，而无需同时执行创建和修改命令。索引和修改表语句只有在首先检查相应的索引或表字段以验证语句需要运行后才会执行。关于这一点将在稍后详细介绍。\n\
    \n另一个重要的点是。在应用程序每次运行时多次执行初始化序列是完全安全的，该序列是等等的。在某些情况下，这可能会方便处理应用程序切换。例如，下面的代码就可以正常工作。\n\
    \n```java\nfor (int i=0; i<4; i++) {\n    new DatabaseDescriptor(\"jsearch\");\n\
    \    using (StreamReader sr = new StreamReader(Assets.Open(\"SqlStatements.txt\"\
    ))){\n        ProcessSQLStatements.Parse(sr);\n    }\n    SxmInit.initialize();\n\
    }\n```\n\n虽然这并不是你一定想要做的事情，但即使这样做也不会有坏处。\n\n使用 SxmTransaction 类\n\n一旦数据库完全初始化，就可以使用了。`SxmTransaction`\
    \ 类是与数据库交互的最简单、最直接的方法。它会动态创建到数据库的连接并自动管理所有关联资源。对于大多数应用程序，这是与数据库交互的最佳方式；你只需要在 `using`\
    \ 语句内实例化该类并使用。所有的资源清理都会自动完成。你的另一个选项是手动创建数据库连接并在需要时复用它们。我将在稍后的章节中解释这一点。更多信息，请参见“`SxmConnection`\
    \ 类”章节。\n"
- fmt: "\nAlthough the `SxmTransaction` class is a bit less efficient than managing\
    \ connections manually, for many apps, the performance difference is not significant\
    \ enough to warrant the extra effort of dealing with connections directly. Other\
    \ than the cost of establishing new connections, the main performance disadvantage\
    \ of the `SxmTransaction` class is that prepared statements are lost when the\
    \ transaction object is destroyed. With that said, I would like to point out that\
    \ these are not really as costly as you might think.\n\nWhen interacting with\
    \ a traditional database server, developers usually make an effort to minimize\
    \ connection workload. This makes sense, since connecting to a database typically\
    \ requires a remote network connection to a database server. This is costly and\
    \ should be kept to a minimum. Connection reuse through pooling is the strategy\
    \ most used to do this. But requirements are different for mobile apps. The cost\
    \ of establishing a new connection to a local SQLite database is very low. There\
    \ is no over-the-wire network involved. Mobile environments have limited resources,\
    \ so managing a pool of open connections is probably worse than just creating\
    \ and tearing down connections as needed. Also, while SQLite does have good concurrency,\
    \ it is not up to the level of a full-fledged database server. Fewer active connections\
    \ minimizes the potential for conflicts due to locking.\n\nPrepared statements\
    \ offer their greatest benefit when executing complex queries repetitively. This\
    \ condition is the exception rather than the rule for mobile applications. For\
    \ most mobile apps, queries tend to be simple and are generally not executed so\
    \ often that the cost savings of prepared statements is so significant. It is\
    \ important to understand that the advantage of prepared statements are not entirely\
    \ lost when using the `SxmTransaction` class. The `SxmTransaction` class does\
    \ create and use prepared statements for the life of a transaction, which can\
    \ span many statement executions. However, all prepared statement that are created\
    \ are lost when a transaction is completed, therefore they cannot be carried over\
    \ and reused by another transaction object.\n\n## Inserting records into the database\n\
    \nLet’s start with a simple example that posts a record to a database. Below is\
    \ a screenshot of the company registration page of our job search application.\
    \ This is a very basic input form used to register a company with our app. When\
    \ the submit button is selected, the registration is processed.\n\n![](Image00006.jpg)\n\
    \nBelow is the company registration activity class for our registration form.\
    \ It’s pretty simple, it submits a registration record to the database. We are\
    \ most interested in the `processSubmitHandler` method. This method is called\
    \ when the submit registration button is selected, it is responsible for inserting\
    \ the registration record. Before we pick this method apart, let’s have a look\
    \ at the insert statement in the SQL statements properties file that is used to\
    \ actually save the registration record.\n\n`[registerCompany]`\n\n`[companyReg]`\n\
    \n`[INSERT INTO companyReg (companyRegPK, coName, hrContact, email, password)\
    \ VALUES(?, ?, ?, ?, ?)]`\n\nThe first field in the definition is the name of\
    \ the statement; `registerCompany`. The second field is the name of the table\
    \ being inserted by the insert statement; `companyReg`. And lastly, we have the\
    \ actual insert statement itself. This is the SQL statement that is used to actually\
    \ save the registration. As you can see, it is a simple parameterized insert statement.\
    \ Okay, back to the code below.\n\n```csharp\nActivity (Label = \"CoRegistrationActivity\"\
    )]\npublic class CoRegistrationActivity : Activity\n{\n    protected override\
    \ void OnCreate(Bundle bundle)\n    {\n        base.OnCreate(bundle);\n      \
    \  SetContentView(Resource.Layout.CoRegistration);\n        Button submitCoRegButton\
    \ = FindViewById<Button>(Resource.Id.submitCoRegButton);\n        submitCoRegButton.Click\
    \ += delegate { processSubmitHandler(); };\n    }\n\n    private void processSubmitHandler()\n\
    \    {\n        ArrayList parameterValues = new ArrayList ();\n        1 string\
    \ registrationPK = Guid.NewGuid().ToString();\n        2 parameterValues.Add(registrationPK);\n\
    \        3 parameterValues.Add(FindViewById<EditText>(Resource.Id.coRegName).Text);\n\
    \        4 parameterValues.Add(FindViewById<EditText>(Resource.Id.coRegContact).Text);\n\
    \        5 parameterValues.Add(FindViewById<EditText>(Resource.Id.coRegEmail).Text);\n\
    \        6 parameterValues.Add(FindViewById<EditText>(Resource.Id.coRegPassword).Text);\n\
    \        7 using (SxmTransaction sxmTransaction = new SxmTransaction(\"jsearch\"\
    ))\n        {\n            8 InsertResponse ir = sxmTransaction.executeInsert(\"\
    registerCompany\", parameterValues);\n            9 if (sxmTransaction.commitTransaction()\
    \ != SQLiteErrorCode.Ok)\n                throw new SxmException(new ErrorMessage(\"\
    Commit error.\", Defines.SxmErrorCode.userDefined));\n        }\n    }\n}\n```\n\
    \nLet’s take a detailed look at the `processSubmitHandler` method.\n\n- On line\
    \ 1, we create a new `Guid`. Earlier, I explained how GUIDs would be used as the\
