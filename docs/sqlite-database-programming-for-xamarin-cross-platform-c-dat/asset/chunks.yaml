    SQL 语句文件中的 `ALTER` 部分应只包含 `alter table` 语句。SQLite 中的 `alter table` 语句支持有限的命令子集。你可以重命名表，也可以向现有表添加新列。**不要**重命名表。其原因在于，当表被创建时，`SQLite.XM`
    会创建同步所需的对应触发器。当表被重命名时，触发器不会自动更新。这将导致触发器失效，同步将开始失败。未来版本的 `SQLite.XM` 可能会通过自动删除并重新创建触发器来支持表重命名，但目前请勿重命名表。


    每个 `alter table` 语句由三个字段组成。


    `[` `database_name``.`table_name` `]` [`column name` `]` [`alter table statement`
    `]`


    每个字段都放置在起始和结束括号内。字段必须按照上述顺序出现。不过，你可以将它们格式化为多行或包含空格，以增强可读性。第一个字段是正在修改的表的完全限定名，即数据库名后跟一个点，然后是表名。第二个字段是准备添加到表的列名。最后一个字段是实际的
    SQL `alter table` 语句。


    下面是一个包含一个 alter 语句的 `ALTER` 部分示例。


    `[ALTER]`


    `[jsearch.companyReg] [president] [ALTER TABLE companyReg ADD president TEXT]`


    `[]`


    ### 定义索引语句


    与某些其他数据库不同，索引定义并不是 SQLite `create table` 语法的一部分。因此，索引需要独立创建。这并不是问题，也不会让 SQLite
    处于劣势，这只是它们的处理方式。SQL 语句文件中的 `INDEX` 部分应只包含 `CREATE INDEX` 或 `DROP INDEX` 语句。每个索引语句由三个字段组成。


    `[` `database_name``.`table_name` `]` [`index name` `]` [`index statement` `]`


    每个字段都放置在起始和结束括号内。字段必须按照上述顺序出现。不过，你可以将它们格式化为多行或包含空格，以增强可读性。第一个字段是建立索引的表的完全限定名，即数据库名后跟一个点，然后是表名。第二个字段是正在创建或删除的索引名称。最后一个字段是实际的
    SQL 索引语句。


    下面是一个包含两个索引语句的 `INDEX` 部分示例。


    `[INDEX]`


    `[jsearch.companyReg] [coNameIDX] [DROP INDEX coNameIDX]`


    `[jsearch.companyReg] [newCoNameIDX] [CREATE INDEX newCoNameIDX ON companyReg
    (hrContact, coName)]`


    `[]`


    删除索引和创建索引的语句可以任意顺序出现，交替出现是可以的。对于同一个索引，拥有多个删除或多个创建操作将导致错误。然而，你可以为同一个索引拥有创建一个语句和一个删除语句。


    ### 定义 select、update 和 delete 语句


    SQL 语句文件的 `SELECT`、`UPDATE` 和 `DELETE` 部分应只包含各自对应的 select、update 或 delete SQL
    语句。这些语句中的每一个都由两个字段组成。


    `[` `statement name` `]` [`SQL statement` `]`


    每个字段都放置在起始和结束括号内。字段必须按照上述顺序出现。不过，你可以将它们格式化为多行或包含空格，以增强可读性。第一个字段是语句名称。你可以任选选择任何名称，但它必须与同一部分的所有其他语句名称唯一。我们建议选择一个简短但具有描述性的名称。第二个字段是实际的
    SQL 语句。


    下面是几个示例语句。


    `[SELECT]`


    `[findCompany] [SELECT * FROM companyReg WHERE coName = ?]`


    `[]`


    `[UPDATE]`


    `[updateCompanyReg] [UPDATE companyReg SET hrContact = ? WHERE coName = ?]`


    `[]`


    `[DELETE]`


    `[deleteCompany] [DELETE companyReg WHERE coName = ?]`


    `[]`


    ### 创建表


    现在我们已经理解了 SQL 语句属性文件的结构以及如何将其包含项目中，下一步是填充 `TABLE` 部分。下面是我们的示例职位搜索网站的表格部分。


    `[TABLE]`


    **创建公司注册表。**


    `[jsearch.companyReg]`


    `[CREATE TABLE companyReg (id INTEGER PRIMARY KEY AUTOINCREMENT, companyRegPK
    TEXT, coName TEXT, hrContact TEXT, email TEXT, password TEXT)]`

    `[synch]`


    **创建职位发布表。**


    `[jsearch.jobPosting]`


    `[CREATE TABLE jobPosting (id INTEGER PRIMARY KEY AUTOINCREMENT, jobPostingPK
    TEXT, companyRegFK TEXT, jobTitle TEXT, description TEXT)]`


    **创建公司邮箱表。**


    `[jsearch.companyEmail]`


    `[CREATE TABLE companyEmail (id INTEGER PRIMARY KEY AUTOINCREMENT, companyEmailPK
    TEXT, companyRegFK TEXT, subject TEXT, body TEXT)]`

    `[synch]`


    **创建求职者注册表。**


    `[jsearch.seekerReg]`


    `[CREATE TABLE seekerReg (id INTEGER PRIMARY KEY AUTOINCREMENT, seekerRegPK TEXT,
    fName TEXT, lName TEXT, email TEXT)]`

    `[synch]`


    **创建求职者收藏表。**


    `[jsearch.seekerFavorites]`


