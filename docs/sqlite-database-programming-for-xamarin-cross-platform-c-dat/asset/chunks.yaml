    \        6 pushConnectionIDSD.recordDataToSynch.Add(\"systemSynchID\", dataObject);\n\
    \    }\n    else\n        // This should not happen!\n        throw new Exception(\"\
    Error, missing systemSynchID. This record cannot be synchronized.\");\n    Dictionary<string,\
    \ string> translate = new Dictionary<string, string>();\n    // Set the source\
    \ to destination field name for the companyReg table.\n    7 translate.add(\"\
    coRegName\", \"name\");\n    8 translate.add(\"coRegAddress\", \"address\");\n\
    \    9 translate.add(\"coRegCity\", \"city\");\n    10 translate.add(\"coRegState\"\
    , \"state\");\n    11 translate.add(\"coRegcode\", \"zip_code\");\n    12 translate.add(\"\
    coRegEmail\", \"email\");\n    13 translate.add(\"coRegPhone\", \"phone\");\n\
    \    14 translate.add(\"coRegPassword\", \"password\");\n    15 translate.add(\"\
    coRegPrimaryKey\", \"primary_key\");\n    16 translateSynchDescriptor(sourceSD,\
    \ companyRegSD, translate);\n    TimeSpan elapsedSpan = new TimeSpan(DateTime.UtcNow.Ticks\
    \ - new DateTime(1970, 1, 1).Ticks);\n    17 companyRegSD.recordDataToSynch.Add(\"\
    time\", Convert.ToInt64(elapsedSpan.TotalSeconds));\n    // Set the source to\
