  trans: "\n\n```sql\nWHERE reg.registrationPK = ?;\nsxmTransaction.executeQueryDirect(selectStmt,\
    \ searchCriterion);\nHashtable transaction = null;\nwhile ((transaction = sxmTransaction.getNextRow())\
    \ != null) {\n    transactions.Add(transaction);\n    // 4 // sxmTransaction.detachDatabase();\n\
    }\nreturn transactions;\n}\n```\n\n第 1 行在 `user` 数据库上创建了一个事务对象。这里没什么异常的。第 2 行将\
    \ `transaction` 数据库挂载到我们新创建的事务对象上。为了在事务中包含数据库，必须使用 `attachDatabase` 方法进行挂载。你可以多次调用\
    \ `attachDatabase` 以向一个事务挂载多个数据库。作为替代方案，你可以不带任何参数地调用 `attachDatabase`，SQLite.XM\
    \ 将将你所有的数据库挂载到当前事务中。\n\n实际的 SQL 选择语句定义在第 3 行。查询中有几点值得注意。首先，注意 `join` 子句使用了 `purchase`\
    \ 表的全限定名。然而，在给 `registration` 表起别名时，我们使用了只包含表名的简写符号。这是为什么呢？在 SQLite 中，引用挂载数据库中的表时，表名必须带有其定义所在数据库的名字进行限定。在我们的示例中，`transaction`\
    \ 数据库就是挂载的数据库。特别说明：该规则存在例外，允许你省略数据库名。但是，我建议你不要费精力学习这些例外，直接遵守这条规则即可。我给你五个理由：\n\n\
    *   使用全限定表名永远不会带来麻烦。这只是多打几个字而已。\n*   SQL 中更具针对性要求你对自己在做什么进行更多思考。\n*   在查询中包含更多信息可以使其具有自说明文档性，便于他人阅读。例如，仅通过读取查询，你就能识别出已挂载的数据库。\n\
    *   无论是否要求，始终对挂载的数据库使用全限定名，这有助于保持代码的一致性。\n*   如果你无意中误用了任何例外，你可能会导致不一致且难以发现的 错误。根据\
    \ SQLite 文档，原因如下：\n\n>“如果不同数据库中的两个或多个表具有相同的名称，并且在表引用中没有使用数据库名前缀，则所选表是最近挂载的数据库中的表。”\n\
    \n因此，如果你的代码编写方式使得数据库可能以不同的顺序挂载，那么错误可能会在没有任何明显原因的情况下出现又消失。\n\n此外，注意 `pur.name`\
    \ 字段被别名为 `purName`。我们需要对该字段起别名的原因是因为 `registration` 表也包含一个 `name` 字段，如果我们没有对其中一个字段起别名，在尝试执行此查询时将得到字段名歧义错误。\n\
    \n你会注意到第 4 行中被注释掉的 `detatchDatabase` 调用。我把它放在那里是为了向你展示我们可以做什么。然而，事实证明我们使用事务的方式使得这个调用是不必要的，因此我将其删除了。下面是关于挂载和卸载数据库的规则，将阐明这一点。\n\
    \n*   如果你不在乎资源使用、并发性或效率，请让自己轻松点；忽略以下规则，直接在创建 `SxmTransaction` 对象后立即执行挂载。然后忘记它，让卸载在事务对象退出\
    \ `using` 块时自动发生。否则，请遵循以下规则。\n*   尽可能在越晚时候挂载数据库，最好在你打算执行需要挂载的语句之前。有一个注意：在执行任何修改数据库的语句（即除\
    \ select 以外的语句）之前，必须先挂载数据库。原因是当数据库被修改时会启动底层的数据库事务，你不能在事务开始后挂载数据库。\n*   用完数据库后立即卸载数据库。例如，如果你打算执行多个\
    \ select 查询，但只有其中一个使用了挂载的数据库，那么在遍历完查询结果后立即卸载数据库，但在此之前不要这样做，否则你将丢失结果集。\n*   退出事务对象的\
    \ `using` 块会自动卸载任何已挂载的数据库。因此，在我们的示例中，没有必要显式地卸载数据库，我们只需让它自动发生即可。\n*   对于执行更新操作的事务，在调用\
    \ `commitTransaction` 方法之前，不要显式地卸载该事务所属的数据库。原因是，你不能在事务执行过程中卸载数据库。\n\n### 锁定与并发\n\
    \n如果你的应用程序保证在任何时候只有一个活跃的事务对象，例如，它在单线程上执行数据库处理且不嵌套打开的事务，那么与锁定和并发有关的问题很大程度上可以忽略。但是，如果你的应用同时创建多个\
    \ `SxmTransaction` 对象，你就需要理解锁定和并发。\n\n注意：对锁定和并发的解释旨在为你提供管理并发连接所需的实用知识。这是一个相当复杂的主题，我想避免陷入对实现目标没有帮助的细节中。为了简化讨论并侧重于呈现核心请求信息，跳过了一些操作细节。例如，SQLite\
    \ 有 `PENDING` 锁的概念，我没有涵盖它。我不认为为了正确管理并发连接你必须担心这一点。\n\nSQLite 使用锁来指示数据库的运行状态。当多个连接尝试并发访问数据库时，数据库会检查锁定状态以确定哪些操作是允许的。根据请求操作的当前锁定状态，SQLite\
    \ 将允许操作继续，或阻塞操作直到锁定状态发生变化或发生超时。数据库上可以获取以下锁：\n\n*   **共享锁 (Shared)**——多个事务对象可以同时持有共享锁。\n\
    *   **预留锁 (Reserved)**——任何时刻只有一个事务对象持有预留锁，但预留锁可以与共享锁共存。\n*   **独占锁 (Exclusive)**——只有一个事务可以持有独占锁。在事务获取独占锁之前，所有锁都必须释放。一旦获取，在独占锁释放之前不能获取任何其他锁。\n\
    \n当首次创建 `SxmTransaction` 对象时，它对数据库不持有任何锁。只有在执行操作时才会尝试获取锁。让我们看看哪些操作获取哪些锁：\n\n*\
    \   SQL select 语句尝试获取共享锁。共享锁用于告诉 SQLite 该连接正在从数据库读取数据。\n*   修改数据库的操作（即 `insert`、`update`\
    \ 和 `delete`）尝试获取预留锁。预留锁告诉 SQLite 该连接稍后可能会通过提交事务来更新数据库。\n*   当连接想要写入数据库（即提交事务）时，尝试获取独占锁。在\
    \ SQLite.XM 中，提交通过 `commitTransaction` 方法执行。\n\n"
- fmt: "\nThe rules are fairly simple, but there are operational details that are\
    \ best shown with an example; please see below. This code is a bit contrived,\
    \ but the goal here is to explain concurrency in a way that is easy to understand.\
    \ Rather than create a multi-threaded example, which might be a bit difficult\
    \ to follow, I chose to nest the transaction instead. For our purposes, the effect\
    \ is the same. For this example, assume no other `SxmTransaction` objects exist\
    \ anywhere else in our app.\n\n```java\npublic ArrayList deleteRegistration (int\
    \ deleteRegPK)\n{\n  ArrayList regList = null;\n  1 using (SxmTransaction sxmTransactionSearch\
    \ = new SxmTransaction (\"jsearch\")){\n    2 sxmTransactionSearch.executeQuery\
    \ (\"getAllCompanies\", null);\n    3 deleteRegistration (deleteRegPK);\n    while\
    \ ((company = sxmTransactionSearch.getNextRow()) != null)\n    {\n      if (company\
    \ [\"name\"].Equals(\"\") == true)\n      {\n        4 deleteRegistration (company.companyPK);\n\
    \        5 regList = searchRegistrations ();\n      }\n    }\n    6 deleteRegistration\
    \ (deleteRegPK);\n  }\n  return regList;\n}\n\npublic void deleteRegistration\
    \ (int companyPK)\n{\n  ArrayList paramVaues = new ArrayList();\n  paramVaues.Add(companyPK);\n\
    \  using (SxmTransaction sxmTransactionDelete = new SxmTransaction (\"jsearch\"\
    )){\n    7 sxmTransactionDelete.executeDelete (\"deleteCompanyReg\", paramVaues);\n\
    \    8 sxmTransactionDelete.commitTransaction ();\n  }\n}\n\npublic ArrayList\
    \ searchRegistrations ()\n{\n  using (SxmTransaction sxmTransactionSearch = new\
    \ SxmTransaction (\"jsearch\")){\n    9 sxmTransactionSearch.executeQuery (\"\
    getAllCompanies\", null);\n    10 List <Hashtable> searchResults = sxmTransactionSearch.getAllRows\
    \ ();\n  }\n  return searchResults;\n}\n```\n\nThe `deleteRegistration` method\
    \ does two things; it deletes the registration record associated with the passed\
    \ in primary key and it attempts to delete any registrations in the company registration\
    \ table where the ‘name’ field is blank. Coming into this method, the `jsearch`\
    \ database lock status is as follows:\n\nLocks: NONE\n\nOn line 1, a new `SxmTransaction`\
    \ object is created. On line 2, the newly created transaction object executes\
    \ a query to locate all registration in the company registration table. The select\
    \ statement for this query, as it appears in the SQL statements properties file,\
    \ is shown below.\n\n`[getAllCompanies] [SELECT * FROM companyReg]`\n\nThe `executeQuery`\
    \ call successfully acquires a read lock on the database. The database lock status\
    \ is now as follows:\n\nLocks: READ\n\nOn line 3, a call to the method `deleteRegistration`\
    \ is made. If you look at this method, you will see that it attempts to delete\
    \ the record associated with the passed in primary key. On line 7, a call to `executeDelete`\
    \ is made. The SQL statement for this delete, as it appears in the SQL statements\
    \ properties file, is shown below.\n\n`[deleteCompanyReg] [DELETE FROM companyReg\
    \ WHERE companyPK = ?]`\n\nThe `executeDelete` call successfully acquires a reserved\
    \ lock. The database lock status is now as follows:\n\nLocks: READ, RESERVED\n\
    \nOn line 8, a call to `commitTransaction` is made, where it will attempt to commit\
    \ the delete that was executed on line 7. Unfortunately, this call will fail with\
    \ a timeout, as it will be unable to acquire an exclusive lock because the read\
    \ lock has not yet been disposed; the read is still active. What happens here,\
    \ is the transaction attempts to convert the reserved lock it currently holds,\
    \ into an exclusive lock, but the currently active read lock causes the commit\
    \ to block until it times out. `SQLite.XM` will rollback the transaction as part\
    \ of its cleanup when existing the using block; the reserved lock held by this\
    \ transaction object is disposed as part of the cleanup. The database lock status\
    \ is now as follows:\n\nLocks: READ\n\nOn line 4, a call to `deleteRegistration`\
    \ is made inside the loop that iterates through the search results returned from\
    \ the search performed on line 2. This call fails for the same reason it failed\
    \ when called from line 3.\n\nOn line 5, a call is made to `searchRegistrations`.\
    \ As you can see, this method performs a search of the registration table. After\
    \ executing the query on line 9, the database lock status will be:\n\nLocks: READ,\
    \ READ\n\nAfter retrieving the search results on line 10, the database lock status\
    \ will be as follows:\n\nLocks: READ\n\nLet’s pause a moment to consider what\
    \ just happened. The `executeQuery` method successfully acquired a read lock,\
    \ while the call to `getAllRows` disposed of that lock. Assuming a result set\
    \ is not empty; from the point that a select is executed, it will hold a read\
    \ lock until the result set is fully iterated or until the `SxmTransaction` object\
    \ associated with the select is cleaned up by the `using` statement. This is important\
    \ to fully appreciate. A long running select or failing to fully iterate through\
    \ a result set quickly, will block other connections from acquiring an exclusive\
    \ lock. If the result set is empty, no read lock will be acquired.\n\nOn line\
    \ 6, another call to the `deleteRegistration` method is made. However, unlike\
    \ our previous attempts, this one will succeed. When this call is made, the database\
    \ lock status is as follows:\n\nLocks: NONE\n\nEven though the connection is still\
    \ active, the read lock acquired by the query on line 2 has already been disposed\
    \ of by the time we get to line 6. This is because the search results have been\
    \ fully iterated. The call to `executeDelete` on line 7 will successfully acquire\
    \ a reserved lock. The call to `commitTransaction`, which is made on line 8, will\
    \ quickly acquire an exclusive lock and then immediately dispose of the lock once\
    \ the transaction is committed. Returning from call on line 6, the database lock\
    \ status is as follows:\n\nLocks: NONE\n\nThere are some things to consider. For\
    \ example, if a database update operation times out due to blocking on acquiring\
    \ a reserved lock, an exception will be thrown. No exception is thrown if the\
    \ exclusive lock cannot be acquired on a commit and the commit times out; in this\
    \ case, a `SQLiteErrorCode` is returned. For details, see the sections ‘Committing\
    \ transactions’ and ‘Error processing.’ Be careful of long running selects and\
    \ not quickly iterating through result sets; they both block exclusive locks.\n\
    \nBlocking trying to acquire an exclusive lock during a commit should be limited\
    \ to the length of time needed to execute the longest running read operation.\
    \ Remember, their can be multiple concurrent read operations in play at any one\
    \ time. If you’re careful to not have any long-running queries, this delay should\
    \ be short lived. Once acquired, a commit normally only holds an exclusive lock\
    \ for a few milliseconds. Exclusive locks block everything.\n\n### Deadlock conditions\n\
    \nConsider the following: two connections are reading from the database and they\
    \ each hold a shared lock. Then, at about the same time, they both try to perform\
    \ a write operation, requiring them to obtain a reserved lock. We know from our\
    \ earlier discussion that only one connection can hold a reserved lock at any\
    \ one time. So, one of the connections is handed the lock while the other blocks,\
    \ waiting for the lock to come available. Now the connection that holds the shared\
    \ lock wants to commit its writes. So it tries to acquire an exclusive lock. However,\
    \ it can’t get the exclusive lock because the blocked connection is holding a\
    \ shared lock. We are now in a deadlock condition, where each connection is waiting\
    \ on the other. The blocked connection is waiting on the reserved lock to come\
    \ available while the connection holding the reserved lock is waiting for the\
    \ shared lock to be disposed so it can get the exclusive lock.\n"
