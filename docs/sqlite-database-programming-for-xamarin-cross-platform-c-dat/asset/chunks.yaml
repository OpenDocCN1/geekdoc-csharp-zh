- fmt: "\nOn lines 7 thru 15 we are setting the field translation dictionary. The\
    \ dictionary keys contain the field names from the input `SynchDescriptor`. The\
    \ dictionary values contain the translated field names, i.e., the corresponding\
    \ field names on the server-side table. For example, on line 7 the data from the\
    \ `coRegName` field from the `company_registration` table on the device will be\
    \ copied to the `name` field in the `companyReg` table on the server.\n\nOn line\
    \ 16 we call the method `translateSynchDescriptor()`, which copies the record\
    \ data from the source synch descriptor to the `companyReg` synch descriptor.\
    \ The `companyReg` table on the server includes a `time` field which is not present\
    \ in `company_registration` table on the device. On line 17 we set this field\
    \ to the number of seconds which have elapsed since 1970-01-01.\n\nThe logic from\
    \ lines 7 thru 16 is repeated for the `hrContact` and `gcmApnsID` tables. These\
    \ tables also include a primary key field, which are set on lines 18 and 19. The\
    \ synch descriptor list is populated on lines 20 thru 22 and is returned in the\
    \ last statement of the listing. `SQLite.XM` will synchronized the records in\
    \ the order that they appear in the list.\n\nIn the code above, I show one way\
    \ to convert an input `SynchDescriptor` that represents a single record on the\
    \ device to multiple `SynchDescriptors`, each representing a row to be synchronized\
    \ to the server. This is just one example of what can be done using pre-synchronization\
    \ processing. The ways in which you can perform a source-to-destination transformation\
    \ using pre-synchronization is virtually unlimited and provides you with the flexibility\
    \ to design the server datastore independent from the device database.\n\n###\
    \ Pre-synchronization abort conditions\n\nHow you choose to handle errors within\
    \ your pre-synchronization delegate is entirely up to you. Processing that is\
    \ internal to the delegate method does not affect synchronization, however, what\
    \ you return from a delegate does.\n\nIf the `SQLite.XM` synchronization engine\
    \ determines that it cannot synchronize what is returned by your delegate, it\
    \ will simply abort replication for the record that initiated the synchronization\
    \ operation; removing it from the synchronization log. Any of the following would\
    \ cause such a condition.\n\n*   Throwing an exception from the delegate.\n* \
    \  Returning an empty `SynchDescriptor` list.\n*   Returning `null`.\n*   Returning\
    \ a record in the `SynchDescriptor` list that does not include a `systemSynchID`\
    \ field.\n\nThese trigger an automatic unrecoverable replication failure, leaving\
    \ synchronization with little choice but to abort replication for the current\
    \ record.\n\nYou could use this knowledge to force the disposal of an entry in\
    \ the replication log without performing replication. For example, if your pre-processing\
    \ delegate were to experience some failure that rendered the log entry useless\
    \ for replication, you could choose to throw an exception in order to remove the\
    \ record from the log. In fact, this is exactly what we do in our pre-processing\
    \ delegate example from earlier. If you look at the code, you will see that we\
    \ throw an exception if the input synch descriptor does not include a `systemSynchID`.\
    \ In this case, the pre-processing delegate realizes there is no hope of replicating\
    \ this entry, so it just throws an exception in order to remove the record from\
    \ the log.\n\n### Multi-table synchronizations error processing\n\nBasic synchronization,\
    \ i.e., replication that does not include a pre-processing delegate, replicates\
    \ one record at a time. If an error is encountered, the replication operation\
    \ fails in an atomic manner; there are no partial synchronizations or partial\
    \ failures. Depending on whether an error is recoverable or non-recoverable, a\
    \ failed operation may be retried at a later time. But still, it either succeeds\
    \ or fails. Failures from a synchronization operation that includes a pre-processing\
    \ delegate can get more involved.\n\nIf the output from a pre-processing delegate\
    \ is a single synchronization operation, i.e., only one `SynchDescriptor` is returned\
    \ in the synch descriptor list, then a synchronization error will be processed\
    \ in the manner described above. However, if a pre-processing delegate generates\
    \ multiple `SynchDescriptors`, then things get a bit more complicated. But before\
    \ we try to understand how, we need to first to consider the kinds of synchronization\
    \ operations that are typically generated by pre-processing delegates.\n\n*  \
    \ If the `action` in a source `SynchDescriptor` is an insert, then a pre-processing\
    \ delegate will normally transform the single record insert into a multi-record\
    \ insert. This fits the description of our earlier example.\n*   If the `action`\
    \ in a source `SynchDescriptor` is a delete, then a pre-processing delegate will\
    \ normally transform the single record delete into a multi-record delete.\n* \
    \  If the `action` in a source `SynchDescriptor` is an update, then a pre-processing\
    \ delegate will normally transform the single record update into multi-record\
    \ update.\n\nThis is pretty typical. For example, it would be a bit unusual for\
    \ an insert synchronization action to be transformed by a pre-processing delegate\
    \ to include, say, a delete. The same is true for a delete action and an update\
    \ action. Mixing different actions in the same synchronization operation is unusual.\
    \ That being said, there is nothing in `SQLite.XM` that would disqualify such\
    \ a transform.\n\nLet’s use our earlier pre-synchronization example to help us\
    \ to understand error processing for a multi-table synchronization operation.\
    \ The figure below shows a single record on the device transformed into three\
    \ records that are to be replicated to HotRiot.\n\n![](Image00029.jpg)\n\nThe\
    \ records are synchronized in the following order: `companyReg, hrContact, gcmApnsID`.\
    \ With respect to error processing, there are several questions that need to be\
    \ answered:\n\n*   What happens if a recoverable error is encountered after successfully\
    \ replicating at least one entry in a replication list?\n    **Answer** : The\
    \ entry in the replication log that triggered the replication operation will not\
    \ be deleted and will get re-synchronized during the next replication cycle. Recoverable\
    \ errors are fully recoverable; it doesn’t matter what mix of entries are in the\
    \ replication list or which entries in the list were successfully posted, the\
    \ HotRiot server is capable of successfully reprocessing entries.\n*   What happens\
    \ if a non-recoverable error is encountered after successfully replicating at\
    \ least one entry in a replication list?\n    **Answer** : An attempt will be\
    \ made to delete all of the `insert` operations that were successfully posted\
    \ to HotRiot. If a non-recoverable error is encountered trying to perform the\
    \ deletes, the newly inserted records are simply orphaned. If a recoverable error\
    \ is encountered processing the deletes, the entry in the replication log that\
    \ triggered the replication operation will not be deleted and will get reprocessed\
    \ during the next replication cycle. Presumably, the same failure will occur and\
    \ the cleanup code will re-run. If the error does not reappear, then fine, the\
    \ synchronization will successfully process.\n\nFor `update` and `delete` operations,\
    \ things are handled a bit differently. No attempt is made to rollback any `update`\
    \ or `delete` operations which are successfully posted to HotRiot before a non-recoverable\
    \ error is encountered. These cannot be reversed.\n\n> Non-recoverable errors\
    \ should be a very rare occurrence, provided you properly validate all data being\
    \ sent to the server.\n"
