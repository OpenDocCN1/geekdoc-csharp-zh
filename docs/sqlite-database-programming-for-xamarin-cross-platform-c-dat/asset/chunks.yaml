    white spaces in order to enhance readability. The first field is the name of the
    statement. This can be any name of your choosing, however, it must be unique from
    all other statement names in the same section. We suggest you choose a name that
    is short but descriptive. The second field is the actual SQL statement.


    Below are several example statements.


    **`[SELECT]`**


    `[findCompany] [SELECT * FROM companyReg WHERE coName = ?]`


    **`[]`**


    **`[UPDATE]`**


    `[updateCompanyReg] [UPDATE companyReg SET hrContact = ? WHERE coName = ?]`


    **`[]`**


    **`[DELETE]`**


    `[deleteCompany] [DELETE companyReg WHERE coName = ?]`


    **`[]`**


    Creating tables


    Now that we understand the structure of the SQL statement properties file and
    how to include it in a project, the next step is to populate the `TABLE` section.
    Below is the table portion of our example job search site.


    **`[TABLE]`**


    **`Create the company registration table.`**


    `[jsearch.companyReg] `


    `[CREATE TABLE companyReg (id INTEGER PRIMARY KEY AUTOINCREMENT, `


    `companyRegPK TEXT, coName TEXT, hrContact TEXT, email TEXT, password TEXT)] `


    `[synch]`


    **`Create the job postings table.`**


    `[jsearch.jobPosting] `


    `[CREATE TABLE jobPosting (id INTEGER PRIMARY KEY AUTOINCREMENT,`


    `jobPostingPK TEXT, companyRegFK TEXT, jobTitle TEXT, description TEXT, pay INTEGER)]`


    `[synch]`


    **`Create the company email table.`**


    `[jsearch.companyEmail] `


    `[CREATE TABLE companyEmail (id INTEGER PRIMARY KEY AUTOINCREMENT,`


    `companyEmailPK TEXT, jobPostingFK TEXT, companyRegFK TEXT, subject TEXT, body
    INTEGER)]`


    `[synch]`


    **`Create the job seeker registration table.`**


    `[jsearch.seekerReg] `


    `[CREATE TABLE seekerReg (id INTEGER PRIMARY KEY AUTOINCREMENT,`


    `seekerRegPK TEXT, fName TEXT, lName TEXT, email TEXT, password INTEGER)]`


    `[synch]`


    **`Create the job seeker favorites table.`**


    `[jsearch.seekerFavorites] `


    `[CREATE TABLE seekerFavorites (id INTEGER PRIMARY KEY AUTOINCREMENT,`


    `seekerFavoritesPK TEXT, seekerRegFK TEXT, companyRegFK TEXT, jobPostingFK TEXT, password
    INTEGER)]`


    `[synch]`


    **`Create the job seeker email table.`**


    `[jsearch.seekerEmail] `


    `[CREATE TABLE seekerEmail (id INTEGER PRIMARY KEY AUTOINCREMENT,`


    `seekerEmailPK TEXT, seekerRegFK TEXT, companyRegFK TEXT, subject TEXT, body INTEGER)]`


    `[synch]`


    **`[]`**


    There are a few things worth noting in the example above. First, the use of comments.
    Anything not between brackets is considered a comment. I recommend you include
    a many comments as necessary in order to clarify what you are doing. Also, notice
    how the statements are formatted for readability. Finally, you will notice that
    every table includes an *id* field, which is defined as follows:


    *   `id INTEGER PRIMARY KEY AUTOINCREMENT`


    Every table you create must include this field. Other than these basic formatting
    options and this one structural requirement, you are free to create your tables
    however you like. In the example above, I have made extensive use of primary keys
    and foreign keys. I suggest you do the same.


    If you look closely at the primary key fields and foreign key fields you will
    notice they are all defined as type text. While this is not unheard of, it is
    a bit unusual. Key fields are normally defined as a number, or, more specifically,
    as a 64 bit long. However, when you define your tables, all key fields must also
    be created as text fields, similar to the way I have done in the example above.


    Why is this so?


    The answer is simple. As I stated above, key fields are typically defined as 64
    bit auto increment values. However, this poses a problem when synchronizing data
    from multiple devices with each running an independent database instance. In this
    case, you are sure to have duplicate key values generated on the different devices.
    When you then try an synchronize, you will encounter either duplicate key errors
    or simply create other problems due to the fact that you have duplicate keys,
    which, by definition, are expected to be unique. The graphic below depicts this
    condition. We see that records from two different devices with the same record
    ID (27) are being synchronized to the server database. This, of course, is unacceptable.
    Fortunately, the solution to this problem is fairly simple.


    ![](Image00036.jpg)'
