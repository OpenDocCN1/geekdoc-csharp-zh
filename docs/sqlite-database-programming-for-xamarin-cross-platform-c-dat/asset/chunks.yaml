  trans: "\n\n在第 7 到第 15 行中，我们设置了字段翻译字典。字典的键包含输入 `SynchDescriptor` 中的字段名。字典的值包含翻译后的字段名，即服务器端表中对应的字段名。例如，在第\
    \ 7 行中，来自设备 `company_registration` 表的 `coRegName` 字段的数据将被复制到服务器 `companyReg` 表的\
    \ `name` 字段中。\n\n在第 16 行，我们调用了 `translateSynchDescriptor()` 方法，该方法将记录数据从源同步描述符复制到\
    \ `companyReg` 同步描述符。服务器上的 `companyReg` 表包含一个 `time` 字段，该字段在设备上的 `company_registration`\
    \ 表中并不存在。在第 17 行中，我们将该字段设置为自 1970-01-01 以来经过的秒数。\n\n第 7 到第 16 行的逻辑在 `hrContact`\
    \ 和 `gcmApnsID` 表中重复。这些表也包含主键字段，在第 18 和第 19 行进行设置。同步描述符列表在第 20 到第 22 行中填充，并在列表的最后一个语句中返回。`SQLite.XM`\
    \ 将按照在列表中出现的顺序同步记录。\n\n在上面的代码中，我展示了将代表设备单条记录的输入 `SynchDescriptor` 转换为多个 `SynchDescriptors`\
    \ 的方法，每个代表一条要同步到服务器的行。这只是使用同步前处理可以实现的操作的一个示例。使用同步前处理执行源到目的转换的方法几乎是无限的，并为您提供了灵活性，可以设计独立于设备数据库的服务器数据存储。\n\
    \n### 同步前中止条件\n\n你如何选择在同步前代理函数（delegate）中处理错误，完全取决于你。在代理方法内部进行的处理不会影响同步，但你从代理函数返回的内容会产生影响。\n\
    \n如果 `SQLite.XM` 同步引擎确定无法同步你的代理函数返回的内容，它将简单地终止触发同步操作的记录的复制；并将其从同步日志中移除。任何以下情况都会导致这种状态：\n\
    \n*   从代理函数中抛出异常。\n*   返回一个空的 `SynchDescriptor` 列表。\n*   返回 `null`。\n*   返回 `SynchDescriptor`\
    \ 列表中一个不包含 `systemSynchID` 字段的记录。\n\n这些会触发自动的不可恢复复制失败，导致同步除了中止当前记录的复制外别无选择。\n\n\
    你可以利用这一知识在不执行复制的情况下强制删除复制日志中的条目。例如，如果你的预处理代理函数遇到了某些故障，导致日志条目对于复制无效，你可以选择抛出异常以从日志中移除该记录。事实上，这正是我们在之前的预处理代理函数示例中所做的。如果你查看代码，你会发现如果输入的同步描述符不包含\
    \ `systemSynchID`，我们就会抛出异常。在这种情况下，预处理代理函数意识到复制此条目没有希望，因此它直接抛出异常以便从日志中移除该记录。\n\n\
    ### 多表同步错误处理\n\n基础同步（即不包含预处理代理的复制）一次同步一条记录。如果遇到错误，复制操作将以原子方式失败；没有部分同步或部分失败。根据错误是可恢复的还是不可恢复的，失败的操作可以在稍后的时间重试。但尽管如此，它要么成功，要么失败。包含预处理代理的同步操作的失败可能会更加复杂。\n\
    \n如果预处理代理函数的输出是单次同步操作，即同步描述符列表中只返回一个 `SynchDescriptor`，那么同步错误将按上述方式进行处理。然而，如果预处理代理函数生成了多个\
    \ `SynchDescriptors`，情况就会变得复杂一些。在我们尝试理解如何操作之前，我们首先需要考虑预处理代理函数通常生成的同步操作类型。\n\n\
    *   如果源 `SynchDescriptor` 中的 `action` 是 `insert`（插入），那么预处理代理函数通常会将单条记录插入转换为多条记录插入。这符合我们之前示例的描述。\n\
    *   如果源 `SynchDescriptor` 中的 `action` 是 `delete`（删除），那么预处理代理函数通常会将单条记录删除转换为多条记录删除。\n\
    *   如果源 `SynchDescriptor` 中的 `action` 是 `update`（更新），那么预处理代理函数通常会将单条记录更新转换为多条记录更新。\n\
    \n这是非常典型的。例如，插入同步动作被预处理代理函数转换为包含（例如）删除的操作将是不寻常的。删除动作和更新动作也是如此。在同一个同步操作中混合不同的动作是不寻常的。尽管如此，`SQLite.XM`\
    \ 中没有任何机制会取消这种转换。\n\n让我们使用之前的同步前示例来帮助理解多表同步操作的错误处理。下图显示了设备上的单条记录转换为要复制到 HotRiot\
    \ 的三条记录。\n\n![](img/Image00029.jpg)\n\n记录按照以下顺序同步：`companyReg, hrContact, gcmApnsID`。在错误处理方面，有几个问题需要回答：\n\
    \n*   如果在成功同步复制列表中的至少一个条目后遇到可恢复错误，会发生什么？\n    **回答：** 触发同步操作的复制日志条目不会被删除，将在下次复制周期期间重新同步。可恢复错误是完全可以恢复的；无论复制列表中混合了什么种类的条目，或者列表中哪些条目已成功发布，HotRiot\
    \ 服务器都能成功重新处理条目。\n*   如果在成功同步复制列表中的至少一个条目后遇到不可恢复错误，会发生什么？\n    **回答：** 系统将尝试删除所有已成功发布到\
    \ HotRiot 的 `insert` 操作。如果在尝试执行删除操作时遇到不可恢复错误，则新插入的记录将处于孤立状态。如果在处理删除操作时遇到可恢复错误，触发同步操作的复制日志条目不会被删除，将在下次复制周期期间重新处理。推测会发生相同的故障，清理代码将重新运行。如果错误不再出现，那么很好，同步将成功处理。\n\
    \n对于 `update` 和 `delete` 操作，处理方式略有不同。在遇到不可恢复错误之前，不会尝试回滚任何已成功发布到 HotRiot 的 `update`\
    \ 或 `delete` 操作。这些操作是撤销的。\n\n> 只要你正确验证了发送到服务器的所有数据，不可恢复错误应该是非常罕见的事件。\n\n"
- fmt: "\nA synchronization error delegate is a method that is inserted into the synchronization\
    \ processing chain that is called when an error is encountered synchronizing a\
    \ record. It allows you to insert your own custom error processing. The signature\
    \ for the error delegate method is shown below.\n\n```\npublic delegate Task SynchErrorDel(SynchDescriptor\
    \ synchDescriptor, SynchResponse synchResponse);\n```\n\nTo insert your own handler\
    \ into the `SQLite.XM` synchronization processing chain, do the following.\n\n\
    *   Create an instance of the `SynchOptions` class.\n*   Set the `SynchErrorDel`\
    \ field to your error delegate.\n*   Pass the `SynchOptions` class to the `SxmInit.initialize`\
    \ method.\n\nSee the first four lines of code below.\n\n```\nSynchOptions synchOptions\
    \ = new SynchOptions();\nsynchOptions.SynchErrorDel = mySynchErrorDel;\nsynchOptions.SynchPreProcessDel\
    \ = mySynchPreProcessDel;\nSxmInit.initialize(\"YOUR HotRiot APPLICATION NAME\"\
    , synchOptions);\nthis.StartService(new Intent(this, typeof(SynchronizeService)));\
    \ // For Android only.\n```\n\nIn this short code fragment, we set both the error\
    \ delegate and the pre-processing delegate. Synchronization delegates are not\
    \ interdependent in any way. They can be set individually or with other delegates.\
    \ We did this just to show how you could set multiple delegates.\n\nAs you can\
    \ see, the error delegate method returns a void and is passed the following two\
    \ parameters.\n\n*   `SynchDescriptor` `synchDescriptor` - This is the synch descriptor\
    \ for the record being synchronized which triggered the error.\n*   `SynchResponse`\
    \ `synchResponse` - This is the response result that was returned from synchronizing\
    \ the record.\n\nSynch descriptors were explained earlier in the section ‘Post-synchronization\
    \ delegate processing.’ So I won’t bore you rehashing that material. The `SynchResponse`\
    \ object contains the results of synchronizing the record in the `SynchDescriptor`.\
    \ A partial listing of this class is shown below.\n\n```java\npublic class SynchResponse\n\
    {\n  public SQLiteXM.Defines.SynchErrorTypes synchErrorType;\n  public ProcessingSynchError\
    \ processingSynchError;\n  public ExceptionSynchError exceptionSynchError;\n \
    \ public bool removeFlag = true;\n  ...\n}\n```\n\nA description of each instance\
    \ variable follows.\n\n*   `SynchErrorTypes` `synchErrorType` - This field is\
    \ the success or error response value. It will indicate either success or the\
    \ category of error that occurred. Synchronization errors fall into two general\
    \ categories; exception errors and processing errors. It will be set to one of\
    \ the following two enums.\n    *   `Defines.SynchErrorTypes.exception` - These\
    \ are failures that occur trying to post a synchronization request to HotRiot.\
    \ As a general rule, an exception error indicates that HotRiot never received\
    \ the synchronization request or failed to send back a response. They include\
    \ such things as IOExceptions, WebExceptions, etc. You will need to inspect the\
    \ `exceptionSynchError` object for details.\n    *   `Defines.SynchErrorTypes.processing`\
    \ - These are failures that occur in HotRiot trying to fulfill a synchronization\
    \ request. You will need to inspect the `processingSynchError` object for details.\n\
    *   `ProcessingSynchError` - If a processing error occurred, this object will\
    \ provide details regarding the error. Otherwise it will be null.\n*   `ExceptionSynchError`\
    \ - If an exception error occurred, this object will provide details regarding\
    \ the exception. Otherwise it will be null.\n*   `Bool` `removeFlag` - This indicates\
    \ whether the record in the replication log that triggered this error should be\
    \ deleted. If `true`, the entry will be removed, otherwise it will be retained.\
    \ The default value for this field is `true`. Your handler should set this field\
    \ to `false` for recoverable errors and `true` for non-recoverable errors. This\
    \ will be explained in more detail a bit later.\n\n### Handling exception synchronization\
    \ errors\n\nException errors indicate a failure posting a synchronization request\
    \ to HotRiot, that is to say, HotRiot never received the request. It can also\
    \ indicate a failure by HotRiot to respond to a request before a timeout occurred.\
    \ A partial listing of the `ExceptionSynchError` class is shown below.\n\n```java\n\
    public class ExceptionSynchError\n{\n  public Exception exception;\n  public string\
    \ exceptionType;\n  public string exceptionMessage;\n  ...\n}\n```\n\nA description\
    \ of each instance variable follows\n\n*   `Exception` `exception` - This is the\
    \ actual exception object for the exception.\n*   `String` `exceptionType` - This\
    \ is the type of exception that was encountered. For example, WebException, OutOfMemoryException,\
    \ IOException, etc.\n*   `String` `exceptionMessage` - This is the error message\
    \ for this exception.\n\nThe screenshot below shows the output from an error response\
    \ for an `exception` type. As you can see, the `synchErrorType` is set to `exception`\
    \ and the `exceptionSynchError` object contains the details about the exception.\
    \ This particular exception was a timeout. From the perspective of the device,\
    \ a server timeout is a temporary condition.\n\n### Handling processing errors\n\
    \nProcessing errors are errors that occur within HotRiot trying to fulfill a synchronization\
    \ request. They indicates an error condition trying to process the request which\
    \ prevented it from successfully completed. A partial listing of the `ProcessingSynchError`\
    \ class is shown below.\n\n```java\npublic class ProcessingSynchError\n{\n  public\
    \ int resultCode;\n  public string resultText;\n  public string resultMessage;\n\
    }\n```\n\nA description of each instance variable follows\n\n*   `int`Code` -\
    \ This is the numeric error code for the processing error.\n*   `String` `resultText`\
    \ - This is the general error message for the processing error.\n*   `String`\
    \ `resultMessage` - This is the specific error message.\n\nThe screenshot below\
    \ shows the output from an error response for a `processing` type error. As you\
    \ can see, the `synchErrorType` is set to `processing` and the `processingSynchError`\
    \ object contains the details about the error. This particular error was an invalid\
    \ data exception. The `resultText` field tells us the general type of processing\
    \ error that occurred. The `resultMessage` gives us a more detailed reason as\
    \ to what caused the error, which in this case, was due to sending incorrectly\
    \ formatted data to an email address field. The SQLite.XM error handler considers\
    \ invalid data errors non-recoverable. It therefore set the `removeFlag` to `true`.\
    \ As you will recall, non-recoverable errors are errors that have little hope\
    \ of correcting themselves. No matter how many attempts are made to replicate\
    \ this record, the server is going to return the same error response, unless,\
    \ of course, the error is somehow corrected.\n"
