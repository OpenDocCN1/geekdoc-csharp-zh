- fmt: '

    The table above represents a replication log with four entries. The synchronization
    ID is the link to the actual record in the database. As you can see, there are
    two entries in the table for record `2764`. Assume for this discussion that the
    widget table has 7 fields. Further, assume that two of the fields in record `2764`
    were updated by log entry `167` and three other fields in the same record were
    updated by entry `169`. As I stated earlier, the replication log entries are processed
    sequentially in FIFO order. So, the first entry to be processed will be log record
    `167`. When log entry `167` is processed, all of the fields for the associated
    record will be synchronized, that includes the two fields updated by log entry
    `167` and the three fields updated by log entry `169`.


    This does not generally present a problem, however, there are times where it can
    introduce side affects you need to be aware of. Consider the following set of
    circumstances:


    *   The record update referenced by log entry `169` included an ID pointer to
    the record inserted into the `project` table by log entry `170`. Imagine this
    is a GUID foreign key field.

    *   Because of a network failure, synchronization was interrupted after successfully
    synchronizing entry `167`.


    Because of the network interruption, the record represented by synchronization
    ID `2764` on the server will include a foreign key to a record in the `project`
    table which has not yet been synchronized; i.e., the record does not yet exist
    on the server. Now, this is no different from what you would get with traditional
    RBR or SBR if synchronization failed on log entry `170`, it just has the potential
    to happen earlier in the synchronization cycle. Normally all you need to do is
    to design the code that accesses the data on the server to handle these conditions,
    which you should be doing anyway.


    Another issue to be aware of with early field replication is with counters. If
    entry `169` included an update to a counter field, that update would appear on
    the server when log entry `167` is synchronized. However, even these types of
    inconsistencies are rarely show stoppers. Synchronization in `SQLite.XM` is event
    driven, when an entry is made to the local database, synchronization is immediately
    triggered. This helps to maintain consistency between the local store and the
    remote server. Of course, this provides no guarantee; for example, your app could
    be making modifications to the local database while there is an extended network
    outage. In which case, synchronization will have to wait until connectivity is
    reestablished. But when it is, all records in the replication log will get synchronized
    fairly quickly, sans some other problem.


    Depending on the particulars of you application, there may be other issues you
    need to be cognizant of when dealing with replication. When thinking this through,
    keep in mind that a record is synchronized in its entirety when the first replication
    log entry for the record is processed.


    ## Setting-up a server-side infrastructure


    We need to set-up our server side infrastructure before we can begin replicating.
    `SQLite.XM` comes out of the box ready to work with `HotRiot.com`. But it’s not
    required that you use `HotRiot` for replication. `SQLite.XM` replication can be
    made to work with any server side datastore of your choosing. I’ll show you how
    this is done a bit later. The real difficulty with synchronizing with your own
    server, is in writing the code that performs the actual work of moving the data
    over the wire to the server. This can get a bit complicated, especially if you
    need support for document storage. Fortunately, all of that code has already been
    written for `HotRiot` and is included as part of `SQLite.XM`.


    At this point, you might be asking why `HotRiot`? The answer is simple, and comes
    in three parts:


    *   `HotRiot` is perfectly suited to this task. It provides a robust server-side
    platform for mobile applications. It includes a provisioned relational and NoSQL
    database, rich document support, push notifications, proximity searching and a
    whole lot more.

    *   `HotRiot` includes a comprehensive C# API designed to work with `Xamarin`.

    *   I was one of the lead developers on `HotRiot`, so it’s natural for me to use
    the service I know best.


    But again, and I want to reiterate, you don’t have to use `HotRiot` in order to
    use `SQLite.XM` synchronization. Although you will need to write the supporting
    code, you’re free to use any back-end of your choosing. As another option, you
    can start your development using `HotRiot` and then switch over to your own cloud
    server later. This provides a path of least resistance during the development
    phase. `HotRiot` provides a no credit card signup and is free to use for 30 days.
    And if you need more time, the cost to use `HotRiot` during development is nominal.
    Most apps can be developed on `HotRiot` for a grand total of $15. So you have
    plenty of time to perform a switch-over to your own server-side infrastructure
    without spending a whole lot of money.


    Let me say one other thing regarding `HotRiot`. `HotRiot` is a very comprehensive
    product that does a lot. I only cover what’s needed in order to support data synchronization
    from `SQLite.XM`.


    ## Creating the replication database tables


    As stated earlier, before we can begin replicating, we need to set-up the server
    side datastore. We need to create our cloud database along with the tables that
    will be used for replication. Fortunately, with `HotRiot` this is a breeze. You
    build and manage your application''s infrastructure using graphical tools from
    within the `HotRiot` Web application. `HotRiot` includes fairly comprehensive
    documentation, so I’m not going to attempt to duplicate it here. However, I will
    provide clarification when I believe it will be helpful.


    Start by going to `HotRiot.com` and create a new account. Upon registering, you
    will be forwarded to your *Main Console* page. Please see the screenshot below.


    ![](Image00030)


    Your new `HotRiot` account comes with a provisioned MySQL and MongoDB database.
    This is done for you. All you need to do is create the tables that will be used
    for replication. Earlier, in the section ‘Defining table statements’, I showed
    you how to create table entries for the SQL statements properties file. As a reminder,
    each create table statement is composed of three fields.


    `[database_name.table_name] [create/drop table statement] [synch_key]`


    The last field, the synch key, controls if/how a table is synched to the cloud.
    There are currently three options.


    *   `no_sync`: Do not synchronize the table data.

    *   `synch`: Synchronize the table data with the server.

    *   `copy`: Copy the table data to the server. However, do not execute record
    deletes on the server.


    The record data for every table with a synch key that is set to `synch` or `copy`
    will get synchronized. These tables require a corresponding table on the replication
    server, in our case, `HotRiot`. To create a table, select the *Create Database*
    link on the `HotRiot` *Main Console* page. And follow the instructions.


