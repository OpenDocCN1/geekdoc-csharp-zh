    \ error delegate should only identify an error as recoverable or non-recoverable.\
    \ The post-processing delegate should assume responsibility for taking action\
    \ necessary to correct an error.\n\nIn the post-synchronization delegate example\
    \ below, we start by checking to see if synchronization succeeded, this is done\
    \ on line 1\\. If `synchResponse.synchErrorType` is success, then synchronization\
    \ worked. You know this because the `synchResponse` parameter passed to the delegate\
    \ is the response returned from the last record in the `sdList` that was processed.\n\
    \nIf synchronization failed, the code iterates through the `sdList` in order to\
    \ find the `SynchDescriptor` that triggered the failure. This is done on line\
    \ 2\\. Line 3 then checks to see if the error is recoverable or non-recoverable.\n\
    \nChecking for success or failure, and then, if necessary, identifying the descriptor\
    \ that caused an error, is very easy. What you decide to do with this information\
    \ is specific to your particular application requirements.\n\n `public`  `static`\
    \  `async`  `Task` ` mySynchPostProcessDel(` `SynchDescriptor` ` originalSD, `\n\
    \n `List` `<` `SynchDescriptor` `> sdList, `\n\n  `SynchResponse` ` synchResponse)`\n\
    \n`  {`\n\n**`1`**  `if` ` (synchResponse.synchErrorType == ` `Defines` `.` `SynchErrorTypes`\
    \ `.success) `\n\n`    {`\n\n *`// Do success Processsing here.`*\n\n`    }`\n\
    \n `else`\n\n `{`\n\n *`// Find the descriptor that failed.`*\n\n `foreach` ` (`\
    \ `SynchDescriptor` ` sd ` `in` ` sdList)`\n\n`      {`\n\n**`2`**  `if` ` (sd.synchResponse.synchErrorType != `\
    \ `Defines` `.` `SynchErrorTypes` `.success) `\n\n`        {`\n\n *`// Is this\
    \ a recoverable error.`*\n\n**`3`**    `if` ` (sd.synchResponse.removeFlag == `\
    \ `false` `) `\n\n  `    {`\n\n   *`// Recoverable error.`*\n\n  `} `\n\n  `else`\
    \ \n\n  `      {`\n\n   *`// Non-recoverable error.`*\n\n  `  }`\n\n *`// Found.\
    \ Get out after processing. Remaining response objects will be null.`*\n\n `break`\
    \ `;`\n\n`        }`\n\n`      }`\n\n`    }`\n\n `}`\n\nSynchronizing to your\
    \ own private back-end server\n\nUp to this point, all of the synchronizing that\
    \ we have done as been to HotRiot. While you have a lot of flexibility and control\
    \ in designing how records should be synchronized, they are, nonetheless, still\
    \ synchronized to the HotRiot system. This is by far the easiest and fastest way\
    \ to get your app up and running, and in many instances, ideal. However, there\
    \ are legitimate reasons for wanting to replicate your own private back-end. I’m\
    \ not going to delineate why you might choose to do this. I assume if you’re seriously\
    \ considering replicating to private server, that you have good reason. In order\
    \ to support this requirement, SQLite.XM allows you to replace the default HotRiot\
    \ synchronization with your own custom replication. This allows you to take over\
    \ replication and synchronize to any server of your choosing.\n\nThe method signature\
    \ for the custom synchronization delegate is shown below.\n\n`public`  `delegate`\
    \  `Task` `<` `bool` `> ` `SynchDel` ` (` `List` `<` `SynchDescriptor` `> sdList);`\n\
    \nTo replace the default HotRiot synchronization with your own replication, simply\
    \ pass your synchronization delegate to the *`SxmInit.initialize`* method; see\
    \ below.\n\n`bool` `schema = ` `SxmInit` `.initialize(mySynchDel);`\n\n`this`\
    \ `.StartService (` `new`  `Intent` ` (` `this` `, ` `typeof` `(` `SynchronizeService`\
    \ `)));` `  //` `For Android only.`\n\nAs you can see, the custom synchronization\
    \ delegate returns a bool, and is passed the following parameter.\n\n*   `List`\
    \ `<` `SynchDescriptor` `> sdList` - This is the list of synch descriptors that\
    \ need to be synchronized to your server. For the current version of SQLite.XM,\
    \ this list will only contains a single entry, but that might change in future\
    \ versions.\n\nA partial listing of the `SynchDescriptor` class is shown below.\n\
    \n `public`  `class`  `SynchDescriptor`\n\n`  {`\n\n `public`  `string` ` action;`\n\
    \n `public`  `string` ` dbName;`\n\n `public`  `string` ` tableName;`\n\n `public`\
    \  `SynchResponse` `synchResponse;`\n\n `public`  `Hashtable` ` recordDataToSynch;`\n\
    \n`  . . .`\n\nA description of each instance variable follows.\n\n*   `string`\
    \ `action` -This is synchronization action that needs to be performed on this\
    \ record. It will be *insert* when inserting a new record, *delete* when deleting\
    \ a record, and *update* when updating or modifying a record.\n\n*   `string`\
    \ `dbName` -This is the name of the database on the device from where this record\
    \ was retreived.\n\n*   `string` `tableName` -This is the name of the database\
    \ table from where this record was retreived.\n\n*   `SynchResponse` `synchResponse`\
    \ -This is the respons that is returned from synchronizing this descriptor. This\
    \ can be ignored when performing a custom synchronization.\n\n*   `Hashtable`\
    \ ` recordDataToSynch` - This is the actual record data that needs to be synchronized\
    \ to your server. The keys in the hash contain the field names while the value\
    \ contains the actual field data.\n\nIf a descriptor is passed to your custom\
    \ delegate with an *action* that is *delete* , then what is passed in the `recordDataToSynch`\
    \ field? In this case, there will only be one entry in the hash table; the *systemSynchID*\
    \ . As you know, the synch ID uniquely identifies a record, and as such, provides\
    \ all the information that’s needed in order for a delegate to perform a delete.\n\
    \nHow custom synchronization works\n\nSQLite.XM starts by retrieving the first\
    \ record in the replication log that needs to be processed. It then creates a\
    \ `SynchDescriptor` based on this record. Your delegate is then called with the\
    \ newly created descriptor passed in the `sdList` parameter. At this point, your\
    \ delegate is in control and responsible for synchronizing the data in the descriptor.\
    \ How and where you choose to replicate this data is entirely up to you.\n\nYour\
    \ delegate method returns either *true* or *false* , depending on whether it wants\
    \ the record in the replication log that triggered this synchronization to be\
    \ deleted or not. If it returns *true* , the entry is deleted. In this case, it’s\
    \ assumed that replication for this log entry has finished to completion. SQLite.XM\
    \ will then continue processing with the next entry in the replication log, if\
    \ one exists. If *false* is returned, the log entry is retained. In this case,\
    \ it’s assumed that the record did not replicate. Synchronization will then pause\
    \ for a brief period of time. After pausing, it will again attempt to perform\
    \ replication, starting with the record that failed to process.\n\nThis cycle\
    \ is repeated for each entry in the log. When the last entry is successfully processed,\
    \ synchronization goes into a wait state, waiting for an event notification. A\
    \ notification is triggered whenever a record is inserted, updated, or deleted\
    \ that needs to be synchronized.\n\nDesigning for custom synchronization"
