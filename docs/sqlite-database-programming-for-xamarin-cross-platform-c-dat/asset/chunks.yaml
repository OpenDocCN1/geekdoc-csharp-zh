  trans: "\n在本书的编写过程中，我们已尽努力确保书中陈述信息的准确性。然而，本书中的信息不提供任何形式的明示或暗示的保证。本书的作者、出版商、经销商或分销商对因本书直接或间接引起或声称的损害不承担任何责任。\n\
    \n## 关于本书\n\n### 致谢\n\n我感谢 `Dr. Raoul Salazar` 博士作为技术编辑投入的大量时间和精力，并在本书过程中为我提供的指导和支持。\n\
    \n`Dr. Salazar` 是一位创新型、以结果为导向的 CTO 和教育者，他的职业生涯涵盖了工业界和学术界。他独特的技术专长，结合软件开发、问题解决和教学技巧，赢得了工业界、学术界以及为其服务的公司同事的尊重。他创建了\
    \ 150 多门培训课程。\n\n## 本书使用的约定\n\n本书使用了以下排版惯例。\n\n- `等宽字体:`：用于代码列表，包括 `SQL` 语句。也用于段落内部，用于引用程序元素，如函数名、变量名、环境设置和关键字。\n\
    - **粗体**：（少量使用）用于突出或强调某些重要点或增强可读性。\n- *等宽斜体*：用于显示将替换为用户提供的值的文本。\n\n下方是一个示例代码列表。\n\
    \n```c\npublic void executeQuery (string command, ArrayList parameterValues)\n\
    {\n    try\n    {\n        if (command == null)\n            throw new Exception\
    \ (ErrorMessages[\"missingSQL\"]);\n        if (connCommand == null)\n       \
    \     connCommand = dbConn.CreateCommand ();\n        else\n            releaseDataReader();\n\
    \        1 connCommand.CommandText = command;\n        connCommand.CommandType\
    \ = System.Data.CommandType.Text;\n        2 addCommandParameters (parameterValues);\n\
    \        3 connDataReader = connCommand.ExecuteReader ();\n    }\n    catch (Exception\
    \ ex)\n    {\n        logger.log (ex, System.Reflection.MethodBase.GetCurrentMethod().ToString());\n\
    \    }\n}\n```\n\n代码列表使用了编写时 `Xamarin Studio` 默认的颜色编码。解释代码列表的段落将引用列表左侧显示的行号。引用行号并不一定从代码的第一行开始。代码列表大多没有基本的错误检查、错误处理、基础优化或任何可能增加其长度或损害其主要目的的内容。\n\
    \n### 代码格式化\n\n我努力让代码示例尽可能易读。大多数代码都很短，这有很大帮助。遗憾的是，电子书各种屏幕尺寸和设备使得格式化在最好的情况下也是不确定的。在某一种配置下显示良好的代码，在其他配置下可能无法阅读。\n\
    \n根据我的经验，在平板电脑的横向模式下阅读本书效果最佳。如果你发现由于格式问题导致代码难以理解，可以尝试更改字体大小看看是否有帮助。通常情况下，这就足够解决问题了。\n\
    \n## 本书的读者\n\n本书旨在供正在使用或打算使用 `Xamarin` 框架的移动应用开发者阅读，并且他们希望学习如何使用 `SQLite.XM` 库。为了充分利用本书的价值，你需要对\
    \ `C#` 有基础了解，并至少具备一些 `SQL` 的通用知识。书中没有复杂的 `SQL` 或 `C#`，所以对每个领域都有基础了解就足够你读完。当然，知道得越多越好。如果你是\
    \ `Java` 开发者，处理 `C#` 示例应该应该没有问题。对 `Android` 或 `iOS` 开发概念的基础了解也会有所帮助。再次，任何示例代码都没有采用任何复杂的\
    \ `Android` 或 `iOS` 技术。大部分情况下，它们都是非常简单的内容。我力求保持重点，专注于 `SQLite`、`SQLite.XM` 以及移动开发的最佳数据库实践。\n\
    \n## 如何使用本书\n\n本书 intended 不仅仅是一本使用 `SQLite.XM` 的简单指南。我尝试提供建议和启发，并在适当的情况下为你的某些工程选择提供理由。每个项目都是不同的，你所做的选择可能与我的建议大不相同。我希望通过提供对我思维方式的洞察，帮助你质疑自己的决定。有时你会同意我的建议和想法，其他时候则不会。无论何种情况，这并不重要，只要我促进你在权衡自己的设计方案时培养批判性思维，我就完成了我的工作。在编码方面，很少有一种唯一的正确方法。\n\
    \n在本书的第一部分，我花了一些时间泛泛地讨论数据持久化以及移动开发特有的问题。我还花了一些时间回顾了书中用于构建持久化层的各种技术。然后，我将讨论针对移动应用的数据库设计和挑战。\n\
    \n第二部分专门用于解释如何使用 `SQLite.XM` 进行设备上的数据持久化。这是本书的核心。如果你有一定的移动应用开发经验，并了解一些关系型数据库设计，你可以选择跳过第一部分直接进入本节。如果你决定跳读，请务必先阅读平台特定的代码部分，因为其中包含一些你需要注意的说明。\n\
    \n第三部分我将解释 `SQLite.XM` 和云同步；如何设置服务器端数据库，以及如何将数据从设备移动（或复制）到你的云服务器。如果你不需要同步到服务器，可以跳过这一节。\n\
    \n## 关于作者\n\n自 1986 年以来，我一直是一名专业的软件开发人员，曾工作于 `IBM`、`核能监管委员会`、`贝尔实验室`以及包括初创公司 `Sezme`\
    \ 在内的许多小型公司。我有机会接触广泛的计算领域，从 `汇编` 底底层嵌入式系统开发到 `Java` 和 `C#` 中的 `JVM` 和 `.net CLR`\
    \ 虚拟机编程。我甚至曾短时间尝试过微代码。我的职业早期重点是计算机图形，包括 `OpenGL`、数字图像处理和图像压缩。我开发了一种专有的空间域压缩算法，用于传统的余弦变换证明计算开销过大的场合。稍后，我担任\
    \ `SPG` 的首席开发人员，创建了图像编辑器 `ColorWorks`，该软件发布于 `OS/2` 和 `Windows` 平台。`ColorWorks`\
    \ 是 `NASA` 对哈勃望远镜拍摄图像进行色彩校正/增强的青睐工具之一。后来，我将注意力转向数据库和 Web 工作，创建了 `HotRiot`。`HotRiot`\
    \ 是一个为移动和 Web 提供后端服务的 `SaaS`。目前，我担任一个使用 `Xamarin` 和 `SignalR` 为 `Android` 和 `iOS`\
    \ 开发移动即时消息应用的技术负责人。\n\n"
- fmt: "\nThis is my first foray into publishing. I opted to self-publish because\
    \ I wanted to provide detailed subject matter coverage beyond what is possible\
    \ in a blog or other shorter venue, but still offer my writing free of charge.\
    \ This would not have been possible with a publisher. I have been asked a number\
    \ of times; why free? It’s true that writing a book take a considerable amount\
    \ of time and energy. Not to mention the work put in by proof readers and tech\
    \ reviewers. I was surprised by how hard it was to get to a first revision. I\
    \ have a new appreciation for what authors go through in getting their works published.\
    \ But I wanted to contribute back into the tech community. Over the years, I have\
    \ benefited from countless resources made available by others; including blogs,\
    \ programming help, and open source code. This was an opportunity for me to make\
    \ a contribution back. If this book is well received, I will follow-up with another.\
    \ I have learned a lot about mobile messaging with `SignalR` that I would like\
    \ to share. If I publish again, I will try to continue to offer my books for free.\
    \ Thanks for choosing to read this book and I hope you learn and enjoy.\n\n##\
    \ Feedback\n\nIf you have any feedback related to this book, for example, errors,\
    \ suggestions etc., please let me know. I will continuously update the online\
    \ manuscript as I make edits, this should improve the experience for future readers.\
    \ Your help with this is greatly appreciated. I’m always happy to assist with\
    \ `SQLite.XM`. If you need some help or advice or need something clarified, please\
    \ drop me a line I’ll do my best to help.\n\najserpicoj@gmail.com\n\n## Part 1.\
    \ Data persistence for mobile apps\n\n### The nature of mobile applications \n\
    \nIn traditional client-server computing, a client normally connects to a central\
    \ database server, often through a front-end proxy, for data storage/processing\
    \ services. If that connection cannot be established, the application is normally\
    \ unable to run. For the most part, this is okay. The way these applications are\
    \ designed, packaged, and distributed, this makes sense. This traditional model\
    \ relies on a continuous connection to a middle tier. For the type of tasks these\
    \ applications perform, this is all well enough and it helps to simplify their\
    \ design. Think of any Web based application of significance or any typical enterprise\
    \ application. It’s true that `HTML 5` offers a number of offline storage options,\
    \ but these are not widely used. The storage technologies that are available are\
    \ somewhat limited in their capabilities and browser support is non-uniform. Having\
    \ to deal with the myriad of browser combinations is enough to dissuade most developers\
    \ from using one of the structured storage solutions offered in `HTML`.\n\nFor\
    \ mobile applications, a more flexible model is needed. First, network connectivity\
    \ for mobile devices is much less certain. Not only do connections go in-and-out\
    \ with much greater frequency, their quality and speed can vary greatly. So, relying\
    \ on an external database can be sketchy. Also, the type of tasks that mobile\
    \ apps are called on to perform, along with user expectations, require that they\
    \ have much more autonomy than their Web or enterprise counterparts. Users will\
    \ not tolerate spotty service from their mobile apps. With this in mind, mobile\
    \ applications should be designed to operate without a network connection to the\
    \ fullest extent possible. This will almost always require some kind of structured\
    \ data storage solution on the device. Fortunately, a database infrastructure\
    \ is present on the most popular mobile operating systems. Both iOS and Android\
    \ ship with a relational database pre-installed: `SQLite`.\n\n### SQLite\n\n`SQLite`\
    \ is the most widely deployed relational database in the world, by far. It is\
    \ included in virtually every iOS and Android device. If you count the number\
    \ of active devices as measured by Google and Apple, this adds up to several billion.\
    \ No other database comes close.\n\nUnless the data storage requirements for your\
    \ app are extremely simple, you’re going to need a storage solution beyond what\
    \ you can easily implement yourself in a simple key/value structure or basic properties\
    \ file. `SQLite` is a very attractive option as there’s no setup required for\
    \ iOS or Android and its presence is guaranteed on both OS’. This simplifies packaging,\
    \ deployment and installation for your app, removing any friction that might be\
    \ caused by installing and managing a separate, embedded database server. Also,\
    \ knowing that `SQLite` will be available, allows you to write a common, shared\
    \ data persistence layer that will work across platforms when using `Xamarin`.\
    \ While it is unfortunate that Microsoft doesn’t include `SQLite` as part of Windows\
    \ Phone, it is, nonetheless, easy enough to install using `NuGet`.\n\nNow, you\
    \ might get the sense that I’m enthusiastic about `SQLite` simply because it’s\
    \ convenient. While it is convenient to use, `SQLite` qualifies as full featured\
    \ relational database, putting all of the power of a traditional transactional\
    \ database engine at the disposal of your app. You would be hard pressed to find\
    \ a better datastore for your mobile application.\n\nI’m not going to go into\
    \ detail about `SQLite` beyond what is needed to use our persistence layer, `SQLite.XM`.\
    \ However, I encourage you to explore `SQLite` in more detail. Their website,\
    \ `sqlite.org`, has a wealth of information.\n\n### Offline, online, and occasionally\
    \ connected apps\n\nMobile applications generally follow one of three models:\n\
    \n*   Pure Offline Application\n*   Pure Online Application\n*   Occasionally\
    \ Connected Application (OCA)\n\n#### Pure offline applications\n\nPure offline\
    \ applications don’t require any network connectivity in order to operate. The\
    \ datastore is local on the device and all data and application logic resides\
    \ locally. Data that’s generated by the application is not synched with an external\
    \ or back-end server. These type of mobile application are entirely self-contained\
    \ and self-supported, and are a bit rare. It is somewhat unusual to see pure offline\
    \ mobile applications.\n\nIn contrast, pure online applications require a network\
    \ connection in order to function. These apps may include a local database, but\
    \ this is not a requirement. Even if a local datastore is used, it’s generally\
    \ limited to such things as configuration information or other metadata. These\
    \ apps establish regular or continuous communications with a remote server that\
    \ may, in addition to providing database services, also provide supporting application\
    \ logic.\n\nAn Occasionally Connected Application (OCA) represents a middle ground\
    \ between the offline and online model. These apps can operate for extended periods\
    \ without a network connection but eventually need connectivity in order to complete\
    \ their processing cycle. They almost always include a local database and normally\
    \ synch their local data with a back-end server. Even though these apps synch\
    \ their local data, OCAs don’t rely on a remote datastore in order to function.\
    \ These types of apps are designed to provide a base level of functionality when\
    \ disconnected with full functionality made available when connectivity is established.\
    \ OCAs may also rely on a back-end server for supporting application logic. Of\
    \ the three models, OCA is the most flexible and complex to design and code.\n\
    \nWith respect to which of the three models you should choose, the answer is easy\
    \ if your application truly qualifies as an offline app. In this case, simply\
    \ use the offline model. This is the easiest of the three to develop and there\
    \ is little benefit to complicating things. Consider yourself lucky, you don’t\
    \ need to deal with intermittent connectivity issues, remote communications, synching\
    \ or any of a host of problems that come along with client server computing.\n"
  raw: 'This is my first foray into publishing. I opted to self-publish because I
    wanted to provide detailed subject matter coverage beyond what is possible in
    a blog or other shorter venue, but still offer my writing free of charge. This
    would not have been possible with a publisher. I have been asked a number of times;
    why free?  It’s true that writing a book take a considerable amount of time and
    energy. Not to mention the work put in by proof readers and tech reviewers. I
    was surprised by how hard it was to get to a first revision. I have a new appreciation
    for what authors go through in getting their works published. But I wanted to
    contribute back into the tech community. Over the years, I have benefited from
    countless resources made available by others; including blogs, programming help,
    and open source code. This was an opportunity for me to make a contribution back.
    If this book is well received, I will follow-up with another. I have learned a
    lot about mobile messaging with SignalR that I would like to share. If I publish
    again, I will try to continue to offer my books for free. Thanks for choosing
    to read this book and I hope you learn and enjoy.


    Feedback


    If you have any feedback related to this book, for example, errors, suggestions
    etc., please let me know. I will continuously update the online manuscript as
    I make edits, this should improve the experience for future readers. Your help
    with this is greatly appreciated. I’m always happy to assist with SQLite.XM. If
    you need some help or advice or need something clarified, please drop me a line
    I’ll do my best to help.


    ajserpicoj@gmail.com


    Part 1\. Data persistence for mobile apps


    The nature of mobile applications


    In traditional client-server computing, a client normally connects to a central
    database server, often through a front-end proxy, for data storage/processing
    services. If that connection cannot be established, the application is normally
    unable to run. For the most part, this is okay. The way these applications are
    designed, packaged, and distributed, this makes sense. This traditional model
    relies on a continuous connection to a middle tier. For the type of tasks these
    applications perform, this is all well enough and it helps to simplify their design.
    Think of any Web based application of significance or any typical enterprise application.
    It’s true that HTML 5 offers a number of offline storage options, but these are
    not widely used. The storage technologies that are available are somewhat limited
    in their capabilities and browser support is non-uniform. Having to deal with
    the myriad of browser combinations is enough to dissuade most developers from
    using one of the structured storage solutions offered in HTML.


    For mobile applications, a more flexible model is needed. First, network connectivity
    for mobile devices is much less certain. Not only do connections go in-and-out
    with much greater frequency, their quality and speed can vary greatly. So, relying
    on an external database can be sketchy. Also, the type of tasks that mobile apps
    are called on to perform, along with user expectations, require that they have
    much more autonomy than their Web or enterprise counterparts. Users will not tolerate
    spotty service from their mobile apps. With this in mind, mobile applications
    should be designed to operate without a network connection to the fullest extent
    possible. This will almost always require some kind of structured data storage
    solution on the device. Fortunately, a database infrastructure is present on the
    most popular mobile operating systems. Both iOS and Android ship with a relational
    database pre-installed: SQLite.


    SQLite


    SQLite is the most widely deployed relational database in the world, by far. It
    is included in virtually every iOS and Android device. If you count the number
    of active devices as measured by Google and Apple, this adds up to several billion.
    No other database comes close.


    Unless the data storage requirements for your app are extremely simple, you’re
    going to need a storage solution beyond what you can easily implement yourself
    in a simple key/value structure or basic properties file. SQLite is a very attractive
    option as there’s no setup required for iOS or Android and its presence is guaranteed
    on both OS’. This simplifies packaging, deployment and installation for your app,
    removing any friction that might be caused by installing and managing a separate,
    embedded database server. Also, knowing that SQLite will be available, allows
    you to write a common, shared data persistence layer that will work across platforms
    when using Xamarin. While it is unfortunate that Microsoft doesn’t include SQLite
    as part of Windows Phone, it is, nonetheless, easy enough to install using NuGet.


    Now, you might get the sense that I’m enthusiastic about SQLite simply because
    it’s convenient. While it is convenient to use, SQLite qualifies as full featured
    relational database, putting all of the power of a traditional transactional database
    engine at the disposal of your app. You would be hard pressed to find a better
    datastore for your mobile application.


    I’m not going to go into detail about SQLite beyond what is needed to use our
    persistence layer, SQLite.XM. However, I encourage you to explore SQLite in more
    detail. Their website, *sqlite.org* , has a wealth of information.


    Offline, online, and occasionally connected apps


    Mobile applications generally follow one of three models:


    *   Pure Offline Application


    *   Pure Online Application


    *   Occasionally Connected Application (OCA)


    Pure offline applications don’t require any network connectivity in order to operate.
    The datastore is local on the device and all data and application logic resides
    locally. Data that’s generated by the application is not synched with an external
    or back-end server. These type of mobile application are entirely self-contained
    and self-supported, and are a bit rare. It is somewhat unusual to see pure offline
    mobile applications.


    In contrast, pure online applications require a network connection in order to
    function. These apps may include a local database, but this is not a requirement.
    Even if a local datastore is used, it’s generally limited to such things as configuration
    information or other metadata. These apps establish regular or continuous communications
    with a remote server that may, in addition to providing database services, also
    provide supporting application logic.


    An Occasionally Connected Application (OCA) represents a middle ground between
    the offline and online model. These apps can operate for extended periods without
    a network connection but eventually need connectivity in order to complete their
    processing cycle. They almost always include a local database and normally synch
    their local data with a back-end server. Even though these apps synch their local
    data, OCAs don’t rely on a remote datastore in order to function. These types
    of apps are designed to provide a base level of functionality when disconnected
    with full functionality made available when connectivity is established. OCAs
    may also rely on a back-end server for supporting application logic. Of the three
    models, OCA is the most flexible and complex to design and code.


    With respect to which of the three models you should choose, the answer is easy
    if your application truly qualifies as an offline app. In this case, simply use
    the offline model. This is the easiest of the three to develop and there is little
    benefit to complicating things. Consider yourself lucky, you don’t need to deal
    with intermittent connectivity issues, remote communications, synching or any
    of a host of problems that come along with client server computing.'
