  trans: "\n数据库描述符由持久化层根据需要使用；这些操作都是自动在后台完成的。在你的应用程序初始化时，你必须为每个数据库创建一个描述符。每个数据库只创建一个描述符。`SQLite.XM`\
    \ 会静默忽略多次对同一个数据库初始化描述符的尝试。你不需要保留所创建的描述符对象的实例，因为持久化层会自动管理描述符。一旦创建，就可以安全地忘记这些描述符。但是，如果你需要获取描述符，请使用静态方法：\n\
    \n`public static DatabaseDescriptor getDescriptor(string databaseName)`\n\n此方法将返回指定数据库的描述符，如果找不到该描述符，则返回\
    \ null。\n\n在下面的示例中，我们创建了三个数据库描述符。前两个所有的控制参数使用了默认值。在第三个描述符中，关闭了日志。\n\n```csharp\n\
    try {\n    new DatabaseDescriptor(\"user\");\n    new DatabaseDescriptor(\"records\"\
    );\n    DatabaseDescriptor dd = new DatabaseDescriptor(\"report\");\n    dd.noLog\
    \ = true;\n}\ncatch (Exception ex) {\n    string message = ex.Message;\n}\n```\n\
    \n虽然你可以根据需要创建任意数量的数据库，但从实际角度来看，绝大多数移动应用程序实际上只需要一个数据库。这是最简单的方法，并且在大多数情况下运行良好。除非你有充分的理由不这样做，否则我建议将其作为默认方案。多个数据库会增加复杂性。例如，跨数据库的连接要求使用\
    \ `attachDatabase` 方法附加被连接的数据库；这将在后面详细解释。这引入了潜在的并发问题，例如当尝试附加当前被锁定的数据库时。处理多个数据库时还存在额外的系统开销。虽然这通常不是严重的问题，但移动设备的资源有限，在设计中应始终考虑效率。尽管如此，在某些情况下，多个数据库是正确的选择。\n\
    \n## Schema 初始化\n\n一旦初始化了数据库描述符，下一步就是创建模式 需要的表和索引。\n\nSQLite 中不具备的一个功能是存储过程，因此编写存储在数据库中的常用可调用\
    \ SQL 并不是一个选项。这没关系，在像 SQLite 这样无服务器的嵌入式数据库中，支持存储过程似乎并没有太大意义。因此，我们必须决定将 SQL 语句放在哪里。我们有几种选择：\n\
    \n*   将 SQL 语句放在数据库中。\n*   将 SQL 语句嵌入代码中。\n*   将 SQL 语句放在属性文件中。\n\n在不使用存储过程时，我通常倾向于将\
    \ SQL 语句放在一个中的数据存储中，通常是数据库。它将 SQL 组织在一个位置，便于独立于代码库进行查找、读取和修改。在构建使用传统数据库服务器（如 `MySQL`\
    \ 或 `SQL Server`）的应用程序时，我更喜欢这种解决方案。在这些情况下，数据库几乎运行在 DBA 管理的服务器上。但对于 SQLite，考虑到它的实现方式，这似乎没有太大意义。\n\
    \n我们可以将 SQL 语句直接放在代码的单个类中。这可能是最高效的解决方案，但它要求用户修改代码。我们绝对希望尽可能减少这种操作，即使只是输入 SQL 文本。另一种可能性是将\
    \ SQL 语句直接嵌入 `SQLite.XM` 的数据库调用中。我真的不喜欢在整个代码库中散布 SQL。那简直是一团糟。它使得定位 SQL 变得更加困难，可能会导致其他问题；例如，错过索引机会或增加代码重复的概率。\n\
    \n最佳解决方案是将 SQL 语句放在属性文件中。这允许我们将 SQL 保持在一个中心位置，便于在不干扰代码的情况下读取和修改。这并不是最高效的解决方案，因为在初始化应用程序时需要读取和处理\
    \ SQL 语句属性文件。但这真的不会引起显著延迟，这种权衡是值得的。这种解决方案在 Android 和 iOS 实现略有不同。因此，我们需要处理一些特定应用程序的问题。与大多数工程设计决策一样，选择一种解决方案而不是另一种实际上是权衡的平衡。\n\
    \n## 在 Android 中包含 SQL 语句属性文件\n\n所有的 Android 应用程序都包含一个 `Assets` 文件夹。这是放置需要应用程序作为原始数据处理的任意文件的地方，例如\
    \ SQL 语句属性文件。你可以在项目中找到此文件夹，它是由 Xamarin 自动创建的。创建一个空文件并将其放在此文件夹中。\n\n![](img/Image00027.jpg)\n\
    \n你可以随心命名文件，对于书中的示例，我们将其命名为 `SqlStatements.txt`。这将我们的 SQL 语句属性文件。在 Android 项目中包含语句文件只需要这些了。稍后，我将向你展示如何访问该文件。\n\
    \n## 在 iOS 中包含 SQL 语句属性文件\n\n基于 Xamarin 的 iOS 应用程序包含一个 `Resources` 文件夹。这是放置需要应用程序处理的任意文件的地方，例如\
    \ SQL 语句属性文件。你可以在项目中找到此文件夹，它是由 Xamarin 自动创建的。创建一个空文件并将其放在此文件夹中。如果你喜欢，可以将其放在 `Resources`\
    \ 文件夹的子文件夹中。这有助于进一步组织内容。\n\n![](img/Image00019.jpg)\n\n你可以随心命名文件。在上面的截图以及书中后后的\
    \ iOS 示例中，我们将其命名为 `SqlStatements.txt` 并将其放置在子文件夹 `sqlProperties` 中。这将我们的 SQL 语句属性文件。在\
    \ iOS 项目中包含语句文件只需要这些了。稍后，我将向你展示如何访问该文件。\n\n顺带提，iOS 要求应用程序资源文件放置在应用程序的根目录下。不幸的是，这可能会变得有点混乱。为了清理，Xamarin\
    \ 有一个 `BundledResource` 生成操作的概念，它允许将文件放在 `Resources` 目录而不是根目录。`Resources` 目录的内容在构建过程中映射到应用程序根目录。这是由\
    \ Xamarin 自动完成的。我觉得这是一个非常棒的功能，有助于更好地组织你的项目。\n\n## 参数化查询\n\n在解释 SQL 语句属性文件的结构细节之前，我们需要了解如何为\
    \ SQLite.XM 编写查询。所有需要用户提供数据的查询必须写为参数化查询。参数化查询也称为预处理语句。参数化查询是在查询中在通常出现用户提供数据的地方使用占位符来编写的查询；参见下例。\n\
    \n```sql\nINSERT INTO companyReg (companyRegPK, coName, hrContact, email, password)\
    \ VALUES( ?, ?, ?, ?)\n```\n"
- fmt: '

    This query uses question marks at the location in the query where the record data
    would normally go. We do it this way for a number of reasons. First, parameterized
    queries are much easier to work with in code. Manually assembling a query that
    contains the actual record data is quite a bit more work than using the parameterized
    form. Parameterized queries are virtually immune to SQL injection attacks. SQL
    injection is a type of malicious hack that can be used to access or destroy your
    database. Finally, parameterized queries can me more performant. The way parameterized
    queries are implemented, the database can skip several complex preparatory steps
    when the same statement is used more than once. This can amount to a significant
    time savings for certain queries that are used repeatedly.


    Let’s get a better understanding of the performance benefits offered by parameterized
    statements. Prepared statements provide the best performance gains when being
    used to execute a large number of identical queries (the user supplied data can
    vary). The performance gains will be particularly significant when executing complex
    queries. If a statement is relatively simple, the performance advantage of a prepared
    statement will be less noticeable.


    Parameterized statements only last for the life of a connection. When a connection
    ends, all associated prepared statements are also terminated, so they must be
    recreated for any new connections. This also means that a prepared statement cannot
    be used by multiple connections; however, each connection can create their own
    prepared statements.


    ## Understanding the SQL statements properties file


    Let’s start by having a look at the structure of the SQL statements properties
    file.


    ![](Image00004.jpg)


    The SQL statements properties file is divided into seven sections:


    * `TABLE`

    * `INDEX`

    * `INSERT`

    * `SELECT`

    * `UPDATE`

    * `ALTER`

    * `DELETE`


    Each section starts with a header name that is placed between opening and closing
    brackets and ends with an empty set of brackets. These are the opening and closing
    markers for a section. The sections can be in any order, however, they all must
    be present in the file, even sections that are empty. Anything that is not between
    opening and closing brackets is considered a comment and is ignored by `SQLite.XM`.
    Do not use the brackets symbol in any of your comments; these are used exclusively
    as a delimiter. The SQL statements for each section are placed between the opening
    and closing section markers. Each section should only include statements relevant
    to the section.


    * The `TABLE` section should only include create/drop table SQL statements.

    * The `INDEX` section should only include create/drop index SQL statements.

    * The `INSERT` section should only include record insert SQL statements.

    * The `SELECT` section should only include select SQL statements.

    * The `UPDATE` section should only include update SQL statements.

    * The `ALTER` section should only include alter table statements.

    * The `DELETE` sections should only include record delete SQL statements.


    Let’s take a closer look at each section of the SQL statements properties file.


    ### Defining table statements


    The `TABLE` section of the SQL statements file should only include create table
    or drop table statements. Putting any other data definition or data manipulation
    statements in this section will result in a runtime error. Each create table statement
    is composed of three fields.


    `[` `database_name``.`table_name` `]` [` `create/drop table statement` `]` [`
    `synch_key` `]`


    Each field is placed inside opening and closing brackets. The fields must appear
    in the order shown above. However, you can format them on separate lines or include
    white spaces in order to enhance readability. The first field is the fully qualified
    name of the table being created, that is the database name followed by a period
    followed by the table name. The second field is the actual create table SQL statement.
    The last field is the synchronization key. This tells `SQLite.XM` how to synchronize
    the table data. There are currently three options.


    * `no_synch`: Do not synchronize the table data.

    * `synch`: Synchronize the table data with the server.

    * `copy`: Copy the table data to the server. However, do not execute record deletes
    on the server.


    This field is not case sensitive. Below is an example `TABLE` section with two
    create table statements and a comment.


    `[TABLE]`


    `Create the database tables “People” and “Places”.`


    `[jSearch.People] [CREATE TABLE People (id INTEGER PRIMARY KEY AUTOINCREMENT,
    FName TEXT, LName TEXT)] [synch]`

    `[jSearch.Places] [CREATE TABLE Places (id INTEGER PRIMARY KEY AUTOINCREMENT,
    loc TEXT, reason TEXT)] [synch]`


    `[]`


    `SQLite.XM` adds a text field to every table that’s used for coordinating synching.
    The field name is `systemSynchID`. This field is completely managed by the `SQLite.XM`
    code, so it can safely be ignored. That being said, this is a reserved name so
    you cannot use this field name in any of your tables.


    ### Defining insert statements


    The `INSERT` section of the SQL statements file should only include record insert
    statements. Each insert statement is composed of three fields.


    `[` `statement name` `]` [` `table name` `]` [` `insert record statement` `]`


    Each field is placed inside opening and closing brackets. The fields must appear
    in the order shown above. However, you can format them on separate lines or include
    white spaces in order to enhance readability. The first field is the name of the
    insert statement. This can be any name of your choosing, however, it must be unique
    from all other insert statement names. We suggest you choose a name that is short
    but descriptive. The second field is the name of the insert table. The last field
    is the actual insert statement.


    Below is an example `INSERT` section with two insert statements.


    `[INSERT]`

    `[registerCompany]`

    `[companyReg]`

    `[INSERT INTO companyReg (companyRegPK, coName, hrContact, email, password) VALUES
    (?, ?, ?, ?, ?)]`

    `[insertJobPosting]`

    `[jobPosting]`

    `[INSERT INTO jobPosting (jobPostingPK, companyRegFK, jobTitle, description, pay)
    VALUES (?, ?, ?, ?, ?)]`

    `[]`


    Earlier, I mentioned that `SQLite.XM` adds a field named `systemSynchID` to every
    table and that this field can safely be ignored as it is managed by the system.
    All that is true, however, there is one side effect caused by this that must be
    taken into consideration when writing insert statements.


    There are two basic forms for the `INSERT` statement:


    * `INSERT INTO table_name (column1, column2, column3, ...columnN) VALUES (?, ?,
    ?, ...?)`

    * `INSERT INTO table_name VALUES (?, ?, ?, ...?)`


    In the first form, the column names and the corresponding values being inserted
    are explicitly delineated. For example, `column1` will get the value from parameter
    1, `column2` will get value from parameter 2, and so forth. In the second form,
    the columns being inserted are implied by the SQL statement. For example, the
    first column in the table will get value from parameter 1, the second column in
    the table will get value from parameter 2, and so forth.


    When writing your insert statements, you must use the first form. The reason for
    this is when a table is first created, the `systemSynchID` field is known to be
    the last column in the table, as in the sample registration table below.


    ![](Image00020.jpg)


    However, if you alter a table by adding fields, the new fields will now come after
    the `systemSynchID` field.


    ![](Image00005.jpg)


    In this case, trying to perform updates using the implicit insert syntax may have
    problems. This is due to the fact that the `systemSynchID` field will now be located
    somewhere in the middle of the table.

    '
