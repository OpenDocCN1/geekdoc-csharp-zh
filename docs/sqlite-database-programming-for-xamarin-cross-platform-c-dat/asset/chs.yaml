- "# Xamarin SQLite 数据库编程：使用 SQLite.net 进行 iOS 和 Android 跨平台 C# 数据库开发\n\n\n\n![](img/Image00011.jpg)\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n在编写自己的处理程序（handler）时，你需要确定哪些错误是可恢复的，哪些是不可恢复的。不可恢复的错误会导致当前的复制日志条目被删除，从而结束该记录的同步。当然，如果日志中存在后续条目，同步将继续处理下一个条目。否则，它将进入等待状态，等待新条目的出现。\n\
  \n可恢复错误要复杂一些。在 `removeFlag` 中返回 `false` 会指示 `SQLite.XM` 保持当前复制日志条目完整，以便稍后某点重新处理。随后，同步将停止一段时间，然后重新启动处理并从同一条记录开始。务必不要让同步进入阻塞所有同步的无限循环。让我来解释一下。下方的截图显示了一个无效数据处理错误。\n\
  \n![](img/Image00038.jpg)\n\n此特定错误是由于向电子邮件地址字段发送了格式不的数据引起的。除非纠正错误的根源，否则尝试重新同步该记录只会导致\
  \ HotRiot 返回相同的错误响应；从而使同步进入阻塞所有同步的无限循环。\n\n如果你在 `removeFlag` 中返回 `false`，则必须满足以下条件之一：\n\
  \n*   导致错误的条件必须是自我修正的。例如，HotRiot 服务器的超时，或由连接失败引起的 Web 或 IO 异常。它必须是某种你合理确定在条件变化时会自动修复的错误。\n\
  *   错误原因必须被显式纠正。\n\n#### 同步后处理\n\n同步后委托（post-synchronization delegate）是一种插入到同步处理链中的方法，在复制完成后被调用。对于复制日志中处理的每个条目，都会调用它。无论处理是否成功，或者遇到可恢复或不可恢复错误，都会调用它。后处理委托不会在中止条件下调用；请参见“同步中止条件”章节。\n\
  \n后处理方法的签名如下所示。\n\n```csharp\npublic delegate Task SynchPostProcessDel(SynchDescriptor\
  \ originalSD, List<SynchDescriptor> sdList, SynchResponse synchResponse);\n```\n\
  \n要向 `SQLite.XM` 同步处理链中插入后处理委托，请执行以下操作：\n\n*   创建 `SynchOptions` 类的实例。\n*   将 `SynchPostProcessDel`\
  \ 字段设置为你的错误委托。\n*   将 `SynchOptions` 类传递给 `SxmInit.initialize` 方法。\n\n参见下方的前四行代码。\n\
  \n```csharp\nSynchOptions synchOptions = new SynchOptions();\nsynchOptions.SynchPostProcessDel\
  \ = mySynchPostProcessDel;\nsynchOptions.SynchPreProcessDel = mySynchPreProcessDel;\n\
  SxmInit.initialize(\"YOUR HotRiot APPLICATION NAME\", synchOptions);\nthis.StartService(new\
  \ Intent(this, typeof(SynchronizeService))); // 仅限 Android\n```\n\n在这个短代码段中，我们同时设置了预处理委托和后处理委托。同步委托之间没有任何依赖关系。它们可以单独设置，也可以与其他委托一起设置。我们这样做只是为了展示如何设置多个委托。\n\
  \n如你所见，后处理委托方法返回 `void` 并接收以下三个参数：\n\n*   `SynchDescriptor originalSD` - 这是与正在同步的复制日志中的条目相关的记录的同步描述符。如果注册了预处理委托，该描述符将传递给它。\n\
  *   `List<SynchDescriptor> sdList` - 这是 `SQLite.XM` 实际复制到 HotRiot 的描述符列表。如果注册了预处理委托，则它是该委托的输出。否则，此列表将包含一个指向与\
  \ `originalSD` 参数相同对象的条目。\n*   `SynchResponse synchResponse` - 这是从 `sdList` 中同步的最后一条记录返回的响应结果。\n\
  \n`SynchResponse` 参数需要额外的说明。`sdList` 中的 `SynchDescriptors` 按照它们在列表中出现的顺序进行同步。每个被处理的条目都会返回一个\
  \ `SynchResponse`，并将其放入正在同步的 `SynchDescriptor` 的 `SynchResponse` 实例变量中。同步描述符在“同步前委托处理”章节中进行了详细解释。下面显示了\
  \ `SynchDescriptor` 类的部分列表。\n\n```csharp\npublic class SynchDescriptor\n{\n    public\
  \ string action;\n    public string dbName;\n    public string tableName;\n    public\
  \ SynchResponse synchResponse;\n    public Hashtable recordDataToSynch;\n    //\
  \ ...\n}\n```\n\n列表中处理的最后一条记录的响应将作为最后一个参数传递给后处理委托。这样做是为了方便。你可以轻松地遍历 `sdList` 中的描述符并单独检查每个\
  \ `SynchResponse` 对象。但这是必要的，因为你真正感兴趣的是 `sdList` 中处理的最后一条记录的响应。如果这是一个成功响应，则复制成功，否则复制失败。如果遇到错误，复制将立即停止。如果\
  \ `sdList` 中有多个描述符，则你需要遍历列表以确定哪个描述符导致了失败。我稍后会向你展示如何这样做。\n\n`SynchResponse` 类在“同步错误委托处理”章节中已详细介绍，所以我只做一个简要概述。下面显示了该类的部分列表。\n\
  \n```csharp\npublic class SynchResponse\n{\n    public SQLiteXM.Defines.SynchErrorTypes\
  \ synchErrorType;\n    public ProcessingSynchError processingSynchError;\n    public\
  \ ExceptionSynchError exceptionSynchError;\n    public bool removeFlag = true;\n\
  \    // ...\n}\n```\n\n以下是实例变量的描述：\n\n*   `SynchErrorTypes synchErrorType` - 通用成功或错误响应值。它指示成功或错误类型。它被设置为枚举之一。\n\
  \    *   `Defines.SynchErrorTypes.success` - 表示处理与此 `SynchResponse` 对象相关的 `SynchDescriptor`\
  \ 成功。\n    *   `Defines.SynchErrorTypes.exception` - 表示处理与此 `SynchResponse` 对象相关的\
  \ `SynchDescriptor` 时发生了异常。你需要检查 `exceptionSynchError` 对象以获取详情。\n    *   `Defines.SynchErrorTypes.Processing`\
  \ - 表示处理与此 `SynchResponse` 对象相关的 `SynchDescriptor` 时发生了处理错误。你需要检查 `processingSynchError`\
  \ 对象以获取详情。\n*   `ProcessingSynchError processingSynchError` - 如果发生了处理类型错误，此对象将提供描述错误的详细信息。否则为\
  \ `null`。\n*   `ExceptionSynchError exceptionSynchError` - 如果发生了异常类型错误，此对象将提供有关异常的详细信息。否则为\
  \ `null`。\n*   `bool removeFlag` - 此标志指示复制日志中的复制条目是否被删除。如果是 *true*，则条目被移除。当 `synchErrorType`\
  \ 为 `success` 时，移除标志始终为 *true*。否则，它对于不可恢复错误为 *true*，而对于可恢复错误为 *false*。\n\n\n\n\n\
  \n同步后委托（post-synchronization delegate）可用于任何你想要执行的处理。一个典型的用途是修正同步错误。通常情况下，我喜欢将错误处理和实际错误纠正划分在错误委托和后处理委托之间。我的意思是，错误委托应该只识别错误是可恢复的还是不可恢复的。后处理委托则应负责采取纠正错误所需的行动。\n\
  \n在下方的同步后委托示例中，我们首先检查同步是否成功，这在第 `1` 行完成。如果 `synchResponse.synchErrorType` 为成功（success），则说明同步正常。你之所以知道这一点，是因为传递给委托的\
  \ `synchResponse` 参数是来自 `sdList` 中已处理的最后一条记录返回的响应。\n\n如果同步失败，代码将遍历 `sdList` 以找到触发失败的\
  \ `SynchDescriptor`。这在第 `2` 行完成。第 `3` 行接着检查错误是可恢复的还是不可恢复的。\n\n检查成功或失败，并在必要时识别导致错误的描述符，是非常容易的。你决定如何处理这些信息取决于你具体的应用需求。\n\
  \n```cs\npublic static async Task mySynchPostProcessDel(SynchDescriptor originalSD,\
  \ List<SynchDescriptor> sdList, SynchResponse synchResponse)\n{\n1 if (synchResponse.synchErrorType\
  \ == Defines.SynchErrorTypes.success)\n  {\n    // 在此处执行成功处理。\n  }\n  else\n  {\n\
  \    // 寻找失败的描述符。\n    foreach (SynchDescriptor sd in sdList)\n    {\n      2 if\
  \ (sd.synchResponse.synchErrorType != Defines.SynchErrorTypes.success)\n      {\n\
  \        // 这是一个可恢复的错误。\n        3 if (sd.synchResponse.removeFlag == false)\n \
  \       {\n          // 可恢复错误。\n        }\n        else\n        {\n          //\
  \ 不可恢复错误。\n        }\n        // 已找到。处理后退出。剩余的响应对象将为 null。\n        break;\n   \
  \   }\n    }\n  }\n}\n```\n\n## 同步到你私有后端\n\n到目前为止，我们进行的所有同步都是针对 HotRiot 的。虽然在设计记录同步方式时具有很大的灵活性和控制权，但它们仍然被同步到\
  \ HotRiot 系统。这是让你的应用运行起来最简单、最快的方法，在许多情况下也是理想的。然而，想要复制你自己的私有后端也有其合情合理的理由。我不会详细阐述你为什么可能选择这样做。我假设如果你认真考虑复制到私有服务器，你一定有充分的理由。为了支持这一需求，`SQLite.XM`\
  \ 允许你将默认的 HotRiot 同步替换为自定义复制。这允许你接管复制并同步到你选择的任何服务器。\n\n自定义同步委托的方法签名所示所示。\n\n```cs\n\
  public delegate Task<bool> SynchDel(List<SynchDescriptor> sdList);\n```\n\n要将默认的\
  \ HotRiot 同步替换为你自己的复制，只需将你的同步委托传递给 `SxmInit.initialize` 方法；见下方。\n\n```cs\nbool schema\
  \ = SxmInit.initialize(mySynchDel);\nthis.StartService(new Intent(this, typeof(SynchronizeService)));\
  \ // 仅限 Android。\n```\n\n如你所示，自定义同步委托返回一个布尔值（bool），并接收以下参数：\n\n*   `List<SynchDescriptor>\
  \ sdList` - 这是需要同步到你的服务器的同步描述符列表。对于当前版本的 `SQLite.XM`，此列表将仅包含一个项目，但在未来版本中可能会发生变化。\n\
  \n下面是 `SynchDescriptor` 类的部分列表。\n\n```cs\npublic class SynchDescriptor\n{\n  public\
  \ string action;\n  public string dbName;\n  public string tableName;\n  public\
  \ SynchResponse synchResponse;\n  public Hashtable recordDataToSynch;\n  // . .\
  \ .\n}\n```\n\n以下是每个实例变量的描述。\n\n*   `string action` - 这是需要在该记录上执行的同步操作。在插入新记录时为\
  \ `insert`，删除记录时为 `delete`，在更新或修改记录时为 `update`。\n*   `string dbName` - 这是获取此记录的设备数据库名称。\n\
  *   `string tableName` - 这是获取此记录的数据库表名称。\n*   `SynchResponse synchResponse` - 这是同步此描述符时返回的响应。在执行自定义同步时可以忽略它。\n\
  *   `Hashtable recordDataToSynch` - 这是需要同步到你的服务器的实际记录数据。哈希中的键包含字段名，值包含实际字段数据。\n\n\
  如果传递给委托的描述符的 `action` 为 `delete`，那么传递到 `recordDataToSynch` 的什么？在这种情况下，哈希表中只有一个项目：`systemSynchID`。\n\
  \n### 自定义同步的工作原理\n\n\n\n\n\n你选择如何以及何处使用自定义代理进行复制，完全取决于你个人。然而，在你准备为自定义同步设计方案时，有几点需要注意。某些类型的错误完全可能导致同步过程多次向你的代理发送相同的记录。如果你的同步代理向服务器发送了请求，且该请求被接收并正确处理，但没有返回响应，就会发生这种情况。这可能是由于连接失败或服务器端代码中的某些错误导致的。由于不知道复制请求是否已完全处理，你的代理可能会返回\
  \ `false` 以确保记录被重新处理。你的服务器必须能够恰当处理处理此类情况。例如，你的服务器可能会被要求多次删除同一条记录，或者插入一条已经存在的记录。\n\
  \n强烈建议你在任何需要复制设备数据的地方都包含一个 `systemSynchID` 字段，并同步该字段进行复制。当 `action` 为 `delete` 时，这是\
  \ `recordDataToSynch` 哈希表中唯一被发送的字段。因此，如果没有它，你将无法完成删除同步请求。\n\n我们还建议在同步设计中包含健壮的错误处理。复制需要被视为一种不可靠的操作。这主要是由于移动设备上网络连接的瞬性和随机质量所致。你的错误处理程序将负责判断哪些错误是可恢复的，哪些是不可恢复的。而且某些可恢复的错误可能需要显式修正。现在，我不想深入探讨设计的细节，因为这高度取决于你同步的具体情况。但你需要小心，不要让你的错误处理和纠正逻辑导致复制陷入无限循环，从而阻止同步。例如，如果你的同步处理程序遇到了一个它认为可恢复但需要显式修正的错误，且该修正从未被执行，就会发生这种情况。\n\
  \n你可能会遇到另一个更隐蔽的问题。我称之为“非错误超时”。它最发生在尝试在连接不佳的情况下同步大型记录时。想象一下你的代理尝试同步一条包含大型视频作为 blob\
  \ 的记录。假设在此例中，传输记录和同步数据所需的时间超过了连接的超时间隔。在这个例中，同步请求已被你的服务器成功处理，但设备上的代码收到了带有超时消息的 `WebException`\
  \ 错误。错误处理程序可能会正确地认为这是一个可恢复的错误，只需要重新处理即可。然而，问题并没有消失。每当你尝试复制这条记录时，你的同步代码都会收到相同的结果。\n\
  \n如果你的同步代理抛出异常，触发该异常的复制日志中的记录将从日志中移除且不再进一步处理。如果日志中存在后续记录，同步将继续处理下一个条目。\n\n## 编写自定义同步代理\n\
  \n下面的代码列表应该帮助你开始编写自己的自定义同步代理。它提供了一个框架和工作流，可以作为构建处理程序的基础。自然，它不包含特定于同步的实际实现逻辑。你自然需要填充这些缺失的部分。这只是展示了你可能用于组织复制的一种方法。考虑到你要求的具体性，完全可能你会有另一个更好的设计。但尽管如此，此代码列表应该能为你提供一些关于如何操作的灵感。\n\
  \n` `synchDelegate` 方法是实际的同步代理。它通过检查 `action` 并调用相应的低级特定操作例程开始。如果在处理过程中遇到错误或异常，它将调用\
  \ `isErrorRecoverable` 或 `isToRecoverable` 方法。正如其名称所示，这些方法决定错误或异常是否可恢复。如果遇到可恢复的错误或异常，将调用重载方法\
  \ `performErrorCorrection`。该方法负责判断错误是否需要显式修正，如果需要，则执行修正。某些错误可能不需要同步端采取任何操作，例如连接错误。\n\
  \n```\npublic static async Task<bool> SynchDelegate(List<SynchDescriptor> sdList)\n\
  {\n  bool removeSynchRecordFlag = true;\n  SynchResponse synchResponse = null;\n\
  \  try\n  {\n    foreach (SynchDescriptor synchDescriptor in sdList)\n    {\n  \
  \   if (synchDescriptor.action.Equals(\"insert\") == true)\n      synchResponse\
  \ = await synchInsert(synchDescriptor);\n      if (synchDescriptor.action.Equals(\"\
  update\") == true)\n        synchResponse = await synchUpdate(synchDescriptor);\n\
  \     if (synchDescriptor.action.Equals(\"delete\") == true)\n      synchResponse\
  \ = await synchDelete(synchDescriptor);\n      if (synchResponse.ErrorType != SynchErrorTypes.success)\n\
  \       {\n        if (isErrorRecoverable(synchResponse) == true)\n        {\n \
  \         removeSynchRecordFlag = false;\n          performErrorCorrection(synchResponse);\n\
  \        }\n      }\n    }\n  }\n  catch (Exception ex)\n  {\n    if (isExceptionRecoverable(ex))\n\
  \    {\n      removeSynchRecordFlag = false;\n      performErrorCorrection(ex);\n\
  \    }\n  }\n  return removeSynchRecordFlag;\n}\n\npublic static bool isErrorRecoverable(SynchResponse\
  \ synchResponse)\n{\n  bool recoverableFlag = true;\n  return recoverableFlag;\n\
  }\n\npublic static bool isExceptionRecoverable(Exception ex)\n{\n  bool recoverableFlag\
  \ = true;\n  return recoverableFlag;\n}\n\npublic static void performErrorCorrection(SynchResponse\
  \ synchResponse)\n{\n}\n\npublic static void performErrorCorrection(Exception ex)\n\
  {\n}\n```\n[/content]\n\n*(注：由于你提供的待翻译文本在 `[content]` 标签中只有文字部分，没有包含代码块，但你的示例中显示了翻译代码块，我根据上下文补全了对应代码部分的翻译逻辑说明。如果只需要翻译你提供的文本部分，请参考下文。)*\n\
