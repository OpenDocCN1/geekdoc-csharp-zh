  \ `recordDataToSynch` 哈希表中唯一被发送的字段。因此，如果没有它，你将无法完成删除同步请求。\n\n我们还建议在同步设计中包含健壮的错误处理。复制需要被视为一种不可靠的操作。这主要是由于移动设备上网络连接的瞬性和随机质量所致。你的错误处理程序将负责判断哪些错误是可恢复的，哪些是不可恢复的。而且某些可恢复的错误可能需要显式修正。现在，我不想深入探讨设计的细节，因为这高度取决于你同步的具体情况。但你需要小心，不要让你的错误处理和纠正逻辑导致复制陷入无限循环，从而阻止同步。例如，如果你的同步处理程序遇到了一个它认为可恢复但需要显式修正的错误，且该修正从未被执行，就会发生这种情况。\n\
  \n你可能会遇到另一个更隐蔽的问题。我称之为“非错误超时”。它最发生在尝试在连接不佳的情况下同步大型记录时。想象一下你的代理尝试同步一条包含大型视频作为 blob\
  \ 的记录。假设在此例中，传输记录和同步数据所需的时间超过了连接的超时间隔。在这个例中，同步请求已被你的服务器成功处理，但设备上的代码收到了带有超时消息的 `WebException`\
  \ 错误。错误处理程序可能会正确地认为这是一个可恢复的错误，只需要重新处理即可。然而，问题并没有消失。每当你尝试复制这条记录时，你的同步代码都会收到相同的结果。\n\
  \n如果你的同步代理抛出异常，触发该异常的复制日志中的记录将从日志中移除且不再进一步处理。如果日志中存在后续记录，同步将继续处理下一个条目。\n\n## 编写自定义同步代理\n\
  \n下面的代码列表应该帮助你开始编写自己的自定义同步代理。它提供了一个框架和工作流，可以作为构建处理程序的基础。自然，它不包含特定于同步的实际实现逻辑。你自然需要填充这些缺失的部分。这只是展示了你可能用于组织复制的一种方法。考虑到你要求的具体性，完全可能你会有另一个更好的设计。但尽管如此，此代码列表应该能为你提供一些关于如何操作的灵感。\n\
  \n`synchDelegate` 方法是实际的同步代理。它通过检查 `action` 并调用相应的低级特定操作例程开始。如果在处理过程中遇到错误或异常，它将调用\
  \ `isErrorRecoverable` 或 `isExceptionRecoverable` 方法。正如其名称所示，这些方法决定错误或异常是否可恢复。如果遇到可恢复的错误或异常，将调用重载方法\
  \ `performErrorCorrection`。该方法负责判断错误是否需要显式修正，如果需要，则执行修正。某些错误可能不需要同步端采取任何操作，例如连接错误。\n\
  \n\n\n```c\n// 执行复制插入操作。\nSynchResponse synchResponse = replicateInsertRecord(synchDescriptor);\n\
  return synchResponse;\n}\n\nprivate static async Task<SynchResponse> synchUpdate(SynchDescriptor\
  \ synchDescriptor)\n{\n    // 执行复制更新操作。\n    SynchResponse synchResponse = replicateUpdateRecord(synchDescriptor);\n\
  \    return synchResponse;\n}\n\nprivate static async Task<SynchResponse> synchDelete(SynchDescriptor\
  \ synchDescriptor)\n{\n    SynchResponse synchResponse = null;\n    NameValueCollection\
  \ recordData = new NameValueCollection();\n    foreach (DictionaryEntry pair in\
  \ synchDescriptor.recordDataToSynch)\n    {\n        if (pair.Key.ToString().Equals(\"\
  systemSynchID\") == true)\n        {\n            recordData.Add(\"systemSynchID\"\
  , pair.Value.ToString());\n            break;\n        }\n    }\n    HRDeleteResponse\
  \ hrDeleteResponse = null;\n    hrDeleteResponse = await HotRiot.getHotRiotInstance.submitKeyDeleteRecord(\n\
  \        synchDescriptor.tableName,\n        recordData);\n    if (hrDeleteResponse.getResultCode()\
  \ != HotRiot.SUCCESS)\n    {\n        ResultDetails rd = hrDeleteResponse.getResultDetails();\n\
  \        synchResponse = new SynchResponse(SQLiteXM.Defines.SynchErrorTypes.processing,\n\
  \            rd.ResultCode,\n            rd.ResultText, rd.ResultMessage);\n   \
  \ }\n    else\n        synchResponse = new SynchResponse(true, SQLiteXM.Defines.SynchErrorTypes.success);\n\
  \    return synchResponse;\n}\n```\n```\n\n# 附录 A - SQLite 错误代码\n\n| 错误名称 |  |\n\
