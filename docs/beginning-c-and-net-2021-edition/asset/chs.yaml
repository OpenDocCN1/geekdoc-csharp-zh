  \n## ▸ 本章学到的知识\n\n| 主题 (TOPIC) | 核心概念 (KEY CONCEPTS) |\n| --- | --- |\n| 命名空间限定\
  \ (Namespace qualification) | 为了避免命名空间限定产生义，你可以使用 `::` 运算符强制编译器使用你创建的别名。你还可以使用 `global`\
  \ 命名空间作为顶级命名空间的别名。 |\n| 自定义异常 (Custom exceptions) | 你可以通过派生根类 `Exception` 来创建自己的异常类。这很有帮助，因为它让你能更好地捕获特定的异常，并允许你自定义异常中包含的数据以便有效地处理它。\
  \ |\n| 事件处理 (Event handling) | 许多类暴露了事件，当代码中发生某些触发器时会引发事件。你可以为这些事件编写处理器，在触发时执行代码。这种双向通信是响应式代码的极佳机制，并防止你编写原本复杂、晦涩的代码来通过轮询对象检查更改。\
  \ |\n| 事件定义 (Event definitions) | 你可以定义自己的事件类型，这涉及创建一个具名的事件以及为该事件的任何处理器创建一个委托类型。你可以使用不带返回值的标准委托类型以及派生自\
  \ `System.EventArgs` 的自定义事件参数来允许多用途的事件处理器。你还可以使用 `EventHandler` 和 `EventHandler<T>`\
  \ 委托类型用更简单的代码定义事件。 |\n| 匿名方法 (Anonymous methods) | 通常，为了提高代码的可读性，你可以使用匿名方法代替完整的事件处理程序方法。这意味着在添加事件处理器的点上内联定义当事件被触发时要执行的代码。你通过\
  \ `delegate` 关键字实现这一点。 |\n| 特性 (Attributes) | 有时，可能因为你正在使用的框架要求，或者因为你的个人意愿，你会在代码中使用特性。你可以使用\
  \ `[AttributeName]` 语法为类、方法和其他成员添加特性，并可以通过派生自 `System.Attribute` 创建你自己的特性。你可以通过反射读取属性值。\
  \ |\n| 初始化器 (Initializers) | 你可以使用初始化器在创建对象或集合的同时对其进行初始化。两种类型的初始化器都由大括号包围的代码块组成。对象初始化器允许通过提供逗号分隔的属性名/值对列表来设置属性值。集合初始化器仅需要一个逗号分隔的值列表。当你使用对象初始化器时，还可以使用非默认构造函数。\
  \ |\n| 类型推断 (Type inference) | `var` 关键字允许你在声明变量时省略其类型。然而，这只有在类型可以在编译时确定时才是可行的。使用\
  \ `var` 不会破坏 C# 的强类型方法论，因为用 `var` 声明的变量有一个且仅有一个可能的类型。 |\n| 匿名类型 (Anonymous types)\
  \ | 对于许多用于结构化数据存储的简单类型，没有定义定义类型。相反，你可以使用匿名类型，其成员是根据用法推断的。你使用对象初始化器语法定义匿名类型，并且你设置的每个属性都是只读属性。\
  \ |\n| 动态查找 (Dynamic lookup) | 使用 `dynamic` 关键字定义一个可以持有任何值的动态类型变量。然后你可以使用普通的属性或方法语法访问包含的值的成员，这些成员仅在运行时检查。如果在运行时尝试访问不存在的成员，则会抛出异常。这种动态类型极大简化了访问非\
  \ .NET 类型或在编译时无法获取类型信息的 .NET 类型所需的语法。然而，必须谨慎使用动态类型，因为你丢失了编译时的代码检查。你可以通过实现 `IDynamicMetaObjectProvider`\
  \ 接口来控制动态查找的行为。有关此更多信息请访问 [`docs.microsoft.com/en-us/dotnet/api/system.dynamic.idynamicMetaObjectprovider`](http://docs.microsoft.com/en-us/dotnet/api/system.dynamic.idynamicMetaObjectprovider)。\
  \ |\n| 可选方法参数 (Optional method parameters) | 通常你可以定义一个有很多参数的方法，其中许多参数很少使用。与其强制客户端代码为很少使用的参数指定值，你可能提供多个方法重载。或者，你可以将这些参数定义为可选（为未指定的参数提供默认值）。调用你的方法的客户端代码就可以只指定所需的参数。\
  \ |\n| 命名方法参数 (Named method parameters) | 客户端可以通过位置或名称（或两者的混合，其中位置参数在前）指定方法参数值。命名参数可以按任何顺序指定。这与可选参数结合时特别有用。\
  \ |\n| Lambda 表达式 (Lambda expressions) | Lambda 表达式本质上是定义匿名方法的快捷方式，尽管它们具有额外的能力，如隐式类型。你通过单个参数（或括号内的零或多个参数）、`=>`\
  \ 运算符和一个表达式来定义 Lambda 表达式。该表达式可以是花括号包围的代码块。具有最多八个参数和可选返回类型的 Lambda 表达式可以使用 `Action`、`Action<>`\
  \ 和 `Func<>` 委托类型表示。许多用于集合的 LINQ 扩展方法使用 Lambda 表达式参数。 |\n\n# 第二部分\n\n数据访问\n\n* \
