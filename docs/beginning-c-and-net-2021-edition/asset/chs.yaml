  \ | 枚举项 | | |\n\n表 9-3: 类视图图标\n\n这里可以使用许多符号，还用于类以外的类型定义，例如枚举和结构体类型。某些条目下方可以放置符号，以表示其访问级别（public\
  \ 条目不显示符号）。这些列在表 9-4 中。\n\n| 图标 | 含义 | 图标 | 含义 | 图标 | 含义 |\n| --- | --- | --- |\
  \ --- | --- | --- |\n| ![私有类视图图标插图。](img/c09t014.png) | 私有 | ![保护性类视图图标插图。](img/c09t015.png)\
  \ | 保护 | ![内部类视图图标插图。](img/c09t016.png) | 内部 |\n\n**表 9-4**: 附加类视图图标\n\n这里没有使用符号来表示抽象、密封或虚方法条目。\n\
  \n除了可以在这里查看这些信息外，你还可以访问这些许多条目的相关代码。双击条目，或右键点击项目并选择“转到定义”（Go To Definition），将直接带你进入项目中定义该目的的代码。如果代码不可用（例如不可访问的基类型中的代码，例如\
  \ `System.Object`），你只有“浏览定义”（Browse Definition）选项，这将带你进入对象查看器视图（在下一节描述）。\n\n图 9-3\
  \ 中出现的另一个项是项目引用（Project References）。这让你能够看到项目引用了哪些程序集，在这种情况下，它包括 `mscorlib` 和 `System`\
  \ 中的核心 .NET 类型、`System.Data` 中的数据访问类型以及 `System.Xml` 中的 XML 操作类型。\n\n你可以通过右键点击项并选择“查找所有引用”（Find\
  \ All References），在代码中查找类型和成员的出现；搜索结果列表将在符号查找窗口（Find Symbol Results）中显示，该窗口通常在屏幕底部作为错误列表区域的一个标签页窗口出现。你还可以使用类视图窗口重命名项。如果你这样做，你将获得重命名该项在代码中所有出现处的引用的选项。这意味着你不再为类名的拼写错误找借口了，因为你可以随地更改它们！\n\
  \n\n\n此外，你可以通过名为 `Call Hierarchy`（调用层次结构）的视图来导航你的代码，可以通过主菜单导航栏（`Ctrl+W,K`）上的 `View\
  \ ➪ Call Hierarchy` 选项从 `Class View`（类视图）窗口访问。此功能对于查看类成员之间如何相互作用非常有用，我们将在下一章中介绍它。\n\
  \n## 对象浏览器\n\n`Object Browser`（对象浏览器）是 `Class View`（类视图）窗口的扩展版本，允许你查看项目中可用的其他类，甚至是外部类。你可以自动进入它（例如在上节中提到的情况），也可以通过\
  \ `View ➪ Object Browser` 手动进入。该视图显示在主窗口中，你可以像浏览 `Class View` 窗口一样进行浏览。\n\n此窗口提供了与\
  \ `Class View` 相同的信息，但还向你展示更多的 `.NET` 类型。当选择一个项时，你会在第三个窗口中获得关于它的信息，如图 9-4 所示。\n\n\
  ![对象浏览器窗口截图。](img/c09f004.png)\n\n**图 9-4**\n\n在这里，选择了 `Console` 类的 `ReadKey()`\
  \ 方法。（`Console` 位于 `mscorlib` 程序集的 `System` 命名空间中。）右角的角的窗口向你显示了方法签名、方法所属的类以及方法功能的摘要。当你探索\
  \ `.NET` 类型，或者只是想回想起特定类可以做什么时，这些信息会很有用。\n\n此外，你还可以在创建的类型中使用此信息窗口。对之前在 `Ch09Ex01`\
  \ 中创建的代码进行以下更改：\n\n```cpp\n /// <summary>\n   /// 此类包含我的程序！\n   /// </summary>\n\
  \   class Program\n   {\n      static void Main(string[] args)\n      {\n      \
  \   MyComplexClass myObj = new MyComplexClass();\n         Console.WriteLine(myObj.ToString());\n\
  \         Console.ReadKey();\n      }\n   }\n```\n\n返回 `Object Browser` 并导航到项目 `Ch09Ex01`\
  \ 中的 `Program` 类。摘要会反映在信息窗口中。这是 XML 文档的一个示例，虽然本书未涵盖该主题，但当你有空闲时非常值得学习。\n\n## 添加类\n\
  \nVisual Studio 包含了一些可以加速某些常用任务的工具，其中一些工具适用于面向对象编程（OOP）。这些工具之一的 `Add New Item Wizard`（新建项向导）允许你以最少的字数输入向项目添加新类。\n\
  \n你可以通过 `Project ➪ Add New Item` 菜单项或在 `Solution Explorer`（解决方案管理器）窗口中右键点击项目并选择相应的项来访问此工具。无论哪种方式，都会弹出一个对话框，允许你选择要添加的项。要添加类，请在模板窗口中选择\
  \ `Class` 项（如图 9-5\n\n**图 9-5**\n\n在本章较早的“尝试一下”中，你手动将类定义添加到了你的 `Program.cs` 文件中。通常，将类保持在独立的文件中更容易跟踪你的类。当\
  \ `Ch09Ex01` 项目打开时，在 `Add New Item` 对话框中输入信息将在 `MyNewClass.cs` 中生成以下代码：\n\n```cs\n\
  using System;\nusing System.Collections.Generic;\nusing System.Linq;\nusing System.Text;\n\
  using System.Threading.Tasks;\nnamespace Ch09Ex01\n{\n   class MyNewClass\n   {\n\
  \   }\n}\n```\n\n该类 `MyNewClass` 定义在与入口点类 `Program` 相同的命名空间中，因此你可以像它定义在同一个文件中一样在代码中使用它。如代码所示，为你生成的类不包含构造函数。记住，如果类定义不包含构造函数，那么编译器在你编译代码时会添加一个默认构造函数。\n\
  \n## 类图\n\nVisual Studio 的一个你尚未查看的强大功能是从代码生成类图并使用类图来修改项目。Visual Studio 中的类图编辑器允许你轻松地生成代码的类\
  \ UML 图。在接下来的“尝试一下”中，当你为你之前创建的 `Ch09Ex01` 项目生成类图时，将看到它的运行。\n\n## 类库项目\n\n除了将类放在项目中的独立文件中外，你还可以将它们放在完全独立的项目中。仅包含类（以及其他相关的类型定义，但没有入口点）的项目被称为\
  \ `class library`（类库）。\n\n类库项目编译为 `.dll` 程序集，你可以通过从其他项目向它们添加引用来访问其内容（这些项目可以是同一个解决方案的一部分，但不必是）。这扩展了对象提供的封装性，因为类库可以修订和更新，而无需接触使用它的项目。这意味着你可以轻松地升级类提供的服务（这可能会影响多个客户端应用程序）。\n\
  \n接下来的“尝试一下”提供了一个类库项目以及使用其包含的类的项目的示例。\n\n## 接口与抽象类\n\n本章已经演示了如何创建接口和抽象类（目前还没有成员——你将在第\
  \ 10 章介绍）。这两种类型在许多方面是相同的，因此了解何时应该使用哪种技术是很有用的。\n\n首先是相似之处：抽象类和接口都可以包含被派生类的成员。接口和抽象类都不能直接实例化，但可以声明这些类型的变量。如果你这样做，可以使用多态将继承自这些类型的对象赋值给这些类型的变量。在这两种情况下，你都可以通过这些变量使用这些类型的成员，尽管你无法直接访问派生对象的其他成员。\n\
  \n现在是区别：派生类只能继承一个基类，这意味着只能直接继承一个抽象类（尽管继承链可以包含多个抽象类）。相反，类可以使用任意数量的接口，但这并没有产生巨大的差异——以任何方式都可以实现类似的结果。只是接口实现的方法略有不同。\n\
  \n抽象类可以同时拥有 `abstract members`（这些没有代码体，必须在派生类中实现，除非派生类本身也是抽象的）和 `nonabstract members`（这些具有代码体，并且可以是虚的，以便在派生类中重写）。相反，`Interface\
  \ members` 必须在使用接口的类中实现——它们没有代码体。此外，接口成员根据定义是公共的（因为它们旨在供外部使用），但抽象类的成员也可以是私有的（只要它们不是抽象的）、保护的、内部的或保护内部（其中保护内部成员仅在程序内部的代码或派生类中可访问）。此外，接口不能包含字段、构造函数、析构函数、静态成员或常量。\n\
  \n\n\n\n例如，考虑一个代表火车的对象族。基类 `Train` 包含了火车的的核心定义，例如轨距和引擎类型（可以是蒸汽机、油机等）。然而，此类是抽象的，因为不存在所谓的“通用”火车。要创建一个“实际的”火车，你需要添加特定于该火车的特征。例如，如图\
  \ 9-11 所示，你可以派生出 `PassengerTrain`、`FreightTrain` 和 `424DoubleBogey` 等类。\n\n一组汽车对象也可以以同样的方式定义，拥有一个抽象基类\
  \ `Car` 以及如 `Compact`、`SUV` 和 `PickUp` 等派生类。`Car` 和 `Train` 甚至可以派自一个共同基类，例如 `Vehicle`。这在图\
  \ 9-12 中所示。\n\n![PassengerTrain、FreightTrain 和 424DoubleBogey 等派生类的快照。](img/c09f011.png)\n\
  \nFIGURE 9-11\n\n![Car 的抽象基类以及 Compact、SUV 和 PickUp 等派生类的快照。Car 和 Train 派自一个共同基类如\
  \ Vehicle。](img/c09f012.png)\n\nFIGURE 9-12\n\n层次结构中较低的某些类可以因为其用途而共享特征，而不仅仅是因为它们派自哪里。例如，`PassengerTrain`、`Compact`、`SUV`\
  \ 和 `Pickup` 都能运载乘客，因此它们可能拥有 `IPassengerCarrier` 接口。`FreightTrain` 和 `Pickup` 可以运载重物，因此它们可能都拥有\
  \ `IHeavyLoadCarrier` 接口。这在图 9-13 中所示。\n\n通过在分配具体细节之前以此方式分解对象系统，你可以清楚地看到哪些情况应该使用抽象类而不是接口，反之亦然。这个示例的结果无法仅通过接口或仅通过抽象继承来实现。\n\
  \n![PassengerTrain、Compact、SUV 和 Pickup 是 IPassengerCarrier 接口。FreightTrain 和 Pickup\
  \ 是 IHeavyLoadCarrier 接口。](img/c09f013.png)\n\nFIGURE 9-13\n\n## 结构类型\n\n第 8 章提到结构体（structs）和类是类似的，但结构体是值类型而类是引用类型。这对你意味着什么？嗯，观察此最简单的方法是通过示例，例如下面的“试一试”。\n\
  \n## 浅拷贝与深拷贝\n\n通过值而不是引用将对象从一个变量复制到另一个变量（即像复制结构体那样的复制它们）可能会非常复杂。因为单个对象可能包含指向许多其他对象的引用（例如字段成员等），因此可能涉及大量的处理。简单地将每个成员从一个对象复制到另一个对象可能不起作用，因为其中某些成员本身可能就是引用类型。\n\
  \n.NET 框架考虑到了这一点。你可以使用继承自 `System.Object` 的方法 `MemberwiseClone()` 创建对象的简单副本，其中每个成员都被复制到新对象。这是一个受保护的方法，但在对象上定义一个调用此方法的公共方法是很容易的。这种复制方法被称为**浅拷贝**，因为它没有考虑引用类型成员。这意味着新对象中的引用成员与源对象中的等效成员指向相同的对象，这在许多情况下是不理想的。如果你想通过跨越复制值（而不是引用）来创建相关成员的新实例，则需要执行**深拷贝**。\n\
  \n有一个你可以实现的接口，它能够允许你以标准方式进行深拷贝：`ICloneable`。如果你使用此接口，就必须实现它包含的唯一方法 `Clone()`。此方法返回一个\
  \ `System.Object` 类型的值。你可以以任何你的方式实现方法体，并使用任何你需要的处理来获取此对象。这意味着如果你愿意，可以实现深拷贝，尽管具体的行为并非强制性的，所以你也可以根据需要执行浅拷贝。对于你实际上从此方法返回的内容没有任何规则或限制，因此许多人建议避免使用它。相反，他们建议实现自己的深拷贝方法。你可以在第\
  \ 11 章中更详细查看此接口。\n\n### 练习题\n\n1. **9.1** 下列代码有什么问题？\n\n```\npublic sealed class\
  \ MyClass\n  {\n     // 类成员。\n  }\npublic class myDerivedClass : MyClass\n  {\n\
  \     // 类成员。\n}\n```\n\n2. **9.2** 你如何定义一个不可创建的类？\n\n3. **9.3** 为什么不可创建的类仍然很有用？你如何利用它们的功能？\n\
  \n4. **9.4** 在一个名为 `Vehicles` 的类库项目中编写代码，实现本章之前讨论的 `Vehicle` 对象族。有九个对象和两个接口需要实现。\n\
  \n5. **9.5** 创建一个控制台应用程序项目 `Traffic`，它引用 `Vehicles`（在练习 9.4 中创建）。创建一个名为 `AddPassenger`\
  \ 的函数，接受任何实现 `IPassengerCarrier` 接口的对象。为了证明代码有效，使用该接口的实例调用此函数，调用继承自 `System.Object`\
  \ 的 `ToString` 方法并将结果输出到屏幕。\n\n练习答案见附录。\n\n## 本章所学\n\n| 主题 | 核心概念 |\n| --- | ---\
  \ |\n| 类和接口定义 | 类使用 `class` 关键字定义，接口使用 `interface` 关键字定义。你可以使用 `public` 和 `internal`\
  \ 关键字定义类和接口的可见性，类可以被定义为 `abstract` 或 `sealed` 以控制继承。父类和接口在冒号后的逗号列表中指定。 |\n| 构造函数和析构函数\
  \ | 类自带默认构造函数和析构函数，你很少需要自己的析构函数。你可以使用可见性、类名和任何所需的参数定义构造函数。基类的构造函数在派生类的构造函数之前执行，你可以在类内部通过构造函数初始化关键字来控制执行顺序。\
  \ |\n| 类库 | 你可以创建只包含类定义的类库项目。这些项目无法直接执行；必须通过执行应用程序中的客户端代码访问。Visual Studio 提供了创建、修改和检查类的各种工具。\
  \ |\n| 类族 | 类可以组成一组具有共同行为或共享特征的族。你可以通过继承一个共享基类（可以是抽象的）或实现接口来实现。 |\n| 结构体定义 | 结构体的定义与类非常相似，但请记住结构体是值类型，而类是引用类型。\
  \ |\n| 对象复制 | 当你复制一个对象时，必须小心复制它可能包含的任何对象，而不仅仅是复制这些对象的引用。复制引用被称为浅拷贝，而完全复制被称为深拷贝。你可以使用\
  \ `ICloneable` 接口作为在类定义中提供深拷贝能力的框架。 |\n\n\n\n\n\n本章的代码下载可以在书籍页面的 [`www.wiley.com`](http://www.wiley.com)\
  \ 找到。点击 `Downloads` 链接。代码也可以在 github.com/benperk/BeginningCSharpAndDotNET`](http://github.com/benperk/BeginningCSharpAndDotNET)\
  \ 找到。代码位于 `Chapter10` 文件夹中，并根据整个章节中的名称单独命名。\n\n本章将通过查看如何定义字段、属性和方法类成员，继续探索 C# 中的类定义。你将从检查这些类型所需的代码开始，并学习如何生成这些代码的结构。你还将学习如何通过编辑它们的属性来快速修改成员。\n\
  \n在涵盖成员定义的基础知识之后，你将学习一些涉及成员的高级技术：隐藏基类成员、调用被重写的基类成员、嵌套类型定义以及部分类定义。\n\n最后，你将通过创建一个类库将理论付诸实践，该库可以在后续章节中进行构建和使用。\n\
  \n# 成员定义\n\n在类定义内部，你为类的所有成员提供定义，包括字段、方法和属性。所有成员都有自己的访问级别，在所有情况下都由以下一个关键字进行定义：\n\n\
  - `public`—成员可以从任何代码访问。\n- `private`—成员仅可以从类的一部分的代码访问（如果不使用关键字，则默认为此值）。\n- `internal`—成员仅可以从定义它们所在的程序集（项目）内部的代码访问。\n\
  - `protected`—成员仅可以从类或其派生类的一部分的代码访问。\n\n这最后两个可以结合使用，因此 `protected internal` 成员也是可能的。这些成员只能从项目内部（更准确地说是程序集内部）的代码或来自另一个程序集中的类派生类的代码访问。\n\
  \n字段、方法和属性还可以使用 `static` 关键字声明，这意味着它们是类拥有的静态成员，而不是对象实例拥有的，如 第 8 章 所示。\n\n## 定义字段\n\
  \n字段使用标准的变量声明格式（带有可选的初始化）以及之前讨论过的修饰符进行定义：\n\n```\nclass MyClass\n{\n   public int\
  \ MyInt;\n}\n```\n\n字段还可以使用 `readonly` 关键字，这意味着字段只能在构造函数执行期间或通过初始赋值被赋值：\n\n```class\n\
  class MyClass\n{\n   public readonly int MyInt = 17;\n}\n```\n\n正如章节介绍所示，字段可以使用\
  \ `static` 关键字声明为静态：\n\n```classclass MyClass\n{\n   public static int MyInt;\n\
  }\n```\n\n静态字段通过定义它们的类进行访问（如上一个例中的 `MyClass.MyInt`），而不是通过该类的对象实例。你可以使用 `const` 关键字创建一个常量值。`const`\
  \ 成员在定义上是静态的，因此你不需要使用 `static` 修饰符（事实上，这样做是错误）。\n\n## 定义方法\n\n方法使用标准的函数格式，加上访问权限和可选的\
  \ `static` 修饰符，如下例所示：\n\n```\nclass MyClass\n{\n   public string GetString() =>\
  \ \"Here is a string.\";\n}\n```\n\n记住，如果你使用 `static` 关键字，那么此方法只能通过类访问，不能通过对象实例访问。你还可以在方法定义中使用以下关键字：\n\
  \n- `virtual`—方法可以被重写。\n- `abstract`—方法必须在非抽象派生类中被重写（仅在抽象类中允许）。\n- `override`—方法重写了基类方法（如果正在重写方法，则必须使用）。\n\
  - `extern`—方法定义在别处。\n\n这是一个方法重写的示例：\n\n```\npublic class MyBaseClass\n{\n   public\
  \ virtual void DoSomething()\n   {\n      // 基类实现。\n   }\n}\npublic class MyDerivedClass\
  \ : MyBaseClass\n{\n   public override void DoSomething()\n   {\n      // 派生类实现，重写基类实现。\n\
  \   }\n}\n```\n\n如果使用了 `override`，也可以使用 `sealed` 来指定派生类中不能对此方法进行进一步修改——也就是说，该方法不能被派生类重写。这是一个示例：\n\
  \n```\npublic class MyDerivedClass : MyBaseClass\n{\n   public override sealed void\
  \ DoSomething()\n   {\n      // 派生类实现，重写基类实现。\n   }\n}\n```\n\n使用 `extern` 允许你在项目外部提供方法的实现，但这是一个此处未涵盖的高级主题。\n\
  \n## 定义属性\n\n属性的定义方式与字段类似，但它们包含更多内容。正如已经讨论过的，属性比字段更复杂，因为它们在修改状态之前可以执行额外的处理——事实上，它们可能根本不修改状态。它们通过拥有两个函数类的块来实现：一个用于获取属性值，另一个用于设置属性值。\n\
  \n这些块也被称为访问器，分别使用 `get` 和 `set` 关键字定义，并可用于控制属性的访问级别。你可以省略这些块中的任何一个来创建只读或只写属性（省略\
  \ `get` 块将提供只写访问，而省略 `set` 块将提供只读访问）。当然，这仅适用于外部代码，因为类内部其他代码将访问与这些代码块相同的数据。你还可以在访问器上包含访问修饰符——例如，将\
  \ `get` 块设为 public 而将 `set` 块设为 protected。你必须包含这些块中的至少一个以获得有效的属性（而且，一个无法读取或更改的属性是没用的）。\n\
  \n属性的基本结构由访问修饰符（`public`、`private` 等）、后后的类型名称、属性名称以及一个或两个 `get` 和 `set` 块组成，这些块包含属性处理：\n\
  \n```\npublic int MyIntProp\n{\n   get\n   {\n      // 属性 get 代码。\n   }\n   set\n\
  \   {\n      // 属性 set 代码。\n   }\n}\n```\n\n定义的第一行与字段定义相似。区别在于结尾没有分号；相反，你有一个包含嵌套\
  \ `get` 和 `set` 块的代码块。\n\n`get` 块必须返回属性类型相同的值。简单属性通常与单个私有字段（也称为备份字段）关联，用于控制该字段，在这种情况下\
  \ `get` 块可以返回字段的值：\n\n```\n// 属性字段。\nprivate int MyInt;\n// 属性。\npublic int MyIntProp\n\
  {\n   get { return MyInt; }\n   set { // 属性 set 代码。 }\n}\n```\n\n由于访问级别（它是私有的），类外部代码无法直接访问\
  \ `myInt` 字段。相反，外部代码必须使用属性来访问字段。`set` 函数同样为字段赋值。在这里，你可以使用 `value` 关键字引用从属性用户接收的值：\n\
  \n```\n// 属性字段。\nprivate int MyInt;\n// 属性。\npublic int MyIntProp\n{\n   get { return\
  \ MyInt; }\n   set { myInt = value; }\n}\n```\n\n`value` 等于与属性类型相同的值，因此如果属性使用与字段相同的类型，那么在这些情况下你不需要担心类型转换。为了在整数允许\
  \ `null` 的情况下提供默认值，你可以使用表达式体成员函数：\n\n```\nprivate int? myInt;\npublic int? MyIntProp\n\
  {\n   get => myInt;\n   set => myInt = value ?? 0; \n}\n```\n\n\n\n\n\n这个简单的属性属性仅仅是防止了对\
  \ `myInt` 字段的直接访问。当你对执行过程施加更多控制时，属性的真正威力就显而易见了。例如，你可能按如下方式实现你的 `set` 块：\n\n```cs\n\
  \ set\n   {\n      if (value >= 0 && value <= 10)\n         myInt = value;\n   }\n\
  ```\n\n在这里，只有当赋值给属性的值在 0 到 10 之间时，你才会修改 `myInt`。在这种情况下，你面临一个重要的设计选择。如果使用了无效值，你该怎么办？你有四种选择：\n\
  \n- 什么都不做（如前面的代码所示）。\n- 给字段分配一个默认值。\n- 继续执行仿佛什么都没有发生一样，但记录该事件以备后续分析。\n- 抛出一个异常。\n\
  \n通常情况下，最后两个选项更优。在两者之间决定取决于该类如何被使用，以及应该给类的用户分配多少控制权。抛出异常给了用户相当大的控制权，并让他们知道发生了什么，以便他们做出适当反应。你可以使用\
  \ `System` 命名空间中的标准异常之一来实现此：\n\n```cs\n set\n   {\n      if (value>= 0 && value\
  \ <= 10)\n         myInt = value;\n      else\n         throw (new ArgumentOutOfRangeException(\"\
  MyIntProp\", value,\n                   \"MyIntProp 必须赋予 0 到 10 之间的值。\"));\n   }\n\
  ```\n\n使用 `throw` 创建的异常可以使用使用属性的实现代码中的 `try…catch…finally` 逻辑进行处理，正如你在第 7 章中所所示。\n\
  \n记录数据（例如记录到文本文件或事件日志）可能是很有用的，比如在不应该出现问题的生产代码中。它允许开发者检查性能，并在必要时调试现有代码。\n\n属性可以像方法一样使用\
  \ `virtual`、`override` 和 `abstract` 关键字，而字段是无法实现的。最后，如前所述，访问器可以有自己的访问权限，如下所示：\n\n\
  ```cs\n// 属性属性使用的字段。\nprivate int myInt;\n// 属性。\npublic int MyIntProp\n{\n   get\
  \ { return myInt; }\n   protected set { myInt = value; }\n}\n```\n\n在这里，只有类内部或派生类中的代码可以使用\
  \ `set` 访问器。\n\n允许访问器的访问权限取决于属性本身的访问权限，并且禁止访问器的权限高于其所属的属性。这意味着私有属性的访问器不能包含任何访问修饰符，而公共属性可以在其访问器使用所有修饰符。\n\
  \n存在一种名为“表达式属性”（expression-based properties）的功能，它与之前在第 6 章中讨论的表达式方法类似。此功能将属性的范围缩小到单行代码。例如，返回某个值的单行数学计算结果的属性可以使用\
  \ lambda 箭头后跟方程：\n\n```cs\n// 属性属性使用的字段。\nprivate int myDoubledInt = 5;\n// 属性。\n\
  public int MyDoubledIntProp => (myDoubledInt * 2);\n```\n\n接下来的“试一试”将允许你尝试定义和使用字段、方法和属性。\n\
  \n### 元组解构\n\n在第 6 章中你学习了元组，元组对于从函数返回多个结果非常有用。当不需要使用类、结构或数组等更复杂的对象时，使用 `tuple`（元组）是处理这种情况的有效方法。这是一个简单的\
  \ `tuple` 示例：\n\n```cs\nvar numbers = (1, 2, 3, 4, 5);\n```\n\n定义一个返回多个结果的函数：\n\n\
  ```cs\nprivate static (int max, int min, double average)       \n    GetMaxMin(IEnumerable<int>\
  \ numbers) {…}\n```\n\n当你的代码调用 `GetMaxMin()` 函数时，必须由代码解析结果以显示。（如果你需要复习该特定方法，请回顾第\
  \ 6 章）。然而，如果你实现了元组解构，则不需要编写代码解析结果。元组解构通过向任何想要支持此功能的类添加一个名为 `Deconstruct()` 的函数来实现。例如，查看以下类：\n\
  \n```cs\npublic class Location\n{\n  public Location(double latitude, double longitude)\
  \ \n      => (Latitude, Longitude) = (latitude, longitude);\n\n  public double Latitude\
  \ { get; }\n  public double Longitude { get; }\n\n  public void Deconstruct(out\
  \ double latitude, out double longitude) \n     => (latitude, longitude) = (Latitude,\
  \ Longitude);\n}\n```\n\n`Location` 类实现了一个表达式体构造函数，它接受两个 `double` 类型的变量（`latitude`\
  \ 和 `longitude`），这些变量用于设置属性 `Latitude` 和 `Longitude` 的值。`Deconstruct()` 函数有两个 `out`\
  \ 参数：`out double latitude` 和 `out double longitude`。然后该表达式将两个 `out` 参数设置为初始化 `Location`\
  \ 类时填充的 `Latitude` 和 `Longitude` 属性。然后你就可以通过将元组分配给 `Location` 来访问字段：\n\n```cs\n\
  var location = new Location(48.137154, 11.576124);\n(double latitude, double longitude)\
  \ = location;\n```\n\n随后就可以引用结果了。\n\n### 重构成员\n\n在添加属性时，一种实用的技术是从字段生成属性的能力。这是*重构*的一个示例，意味着重写现有代码使其更易管理。这可以通过类图或代码视图中的右键单击来实现。例如，如果\
  \ `MyClass` 类包含此字段：\n\n```cs\npublic string myString;\n```\n\n你可以右键单击该字段并选择“快速操作和重构”（Ctrl+\
  \ .）。这将弹出图 10-2 所示的对话框。\n\n接受默认选项将修改 `MyClass` 的代码如下：\n\n```cs\npublic string myString;\n\
  public string MyString { get => myString; set => myString = value; }\nprivate string\
  \ myString;\n```\n\n在这里，`myString` 字段的访问权限已变为 `private`，并且创建了一个与 `myString` 关联的公共属性\
  \ `MyString`。\n\n### 自动属性\n\n属性是访问状态的首选方式，因为它们保护了对象内部的数据实现。它们还对数据的访问提供了更大的控制，正如你在本章代码中多次看到的。然而，你通常会以标准方式定义属性——也就是说，你有一个私有成员并通过公共属性直接访问它。这种代码通常与上一节的代码相同，它是\
  \ Visual Studio 重构工具自动生成的。\n\n重构在输入方面确实可以提高速度，但 C# 还有另一个绝技：自动属性。在*自动属性*中，你使用简化的语法声明属性，由\
  \ C# 编译器为你填充空白。具体来说，编译器会声明一个用于存储的私有字段，并在属性的 `get` 和 `set` 块中使用该字段——而你无需担心细节。\n\n\
  使用以下代码结构定义自动属性：\n\n```cs\npublic int MyIntProp\n{\n   get;\n   set;\n}\n```\n\n\
  你甚至可以在单行代码上定义自动属性以节省空间，而不会显著降低属性的可读性：\n\n```cs\npublic int MyIntProp { get; set;\
  \ }\n```\n\n\n\n\n你按照通常的方式定义属性的访问修性、类型和名称，但你不需要为 `get` 或 `set` 块提供任何实现。相反，编译器会提供这些块（以及底层字段）的实现。\n\
  \n当你使用自动属性时，你只能通过属性访问其数据，而不能通过其底层私有字段访问。这是因为在不知道该私有字段名称的情况下，你无法访问它，而该名称是在编译期间定义的。然而，这并不是真正的限制，因为直接使用属性名是可以没的。自动属性的唯一限制是它们必须同时包含\
  \ `get` 和 `set` 访问器——你无法通过这种方式定义只读或只写的属性。但是，你可以更改这些访问器的访问修性。例如，这意味着你可以按照如下方式创建一个外部只读的属性：\n\
  \n```\npublic int MyIntProp { get; private set; }\n```\n\n在这里，你只能从类定义中的代码设置 `MyIntProp`\
  \ 的值。\n\n## 额外的类成员主题\n\n现在你准备好查看一些高级的成员主题了。本节将处理以下内容：\n\n* 隐藏基类方法\n* 调用覆盖或隐藏的基类方法\n\
  * 使用嵌套类型定义\n\n### 隐藏基类方法\n\n当你从基类继承一个（非抽象）成员时，你也继承了一个实现。如果继承的成员是虚方法（virtual），那么你可以使用\
  \ `override` 关键字覆盖该实现。无论继承的成员是否为虚方法，你都可以 `hide`（隐藏）该实现。这在某些情况下非常有用，例如当一个公共继承成员的工作方式不符合你的预期时。\n\
  \n你可以通过使用如下代码来实现：\n\n```\npublic class MyBaseClass\n{\n   public void DoSomething()\n\
  \   {\n      // 基类实现。\n   }\n}\npublic class MyDerivedClass : MyBaseClass\n{\n \
  \  public void DoSomething()\n   {\n      // 派生类实现，隐藏了基类实现。\n   }\n}\n```\n\n尽管代码运行正常，但它会产生一个警告，提示你正在隐藏一个基类成员。如果你不小心隐藏了想要使用的成员，该警告给了你机会进行纠正。如果你确实想隐藏该成员，可以使用\
  \ `new` 关键字来显式指示这是你想要做的：\n\n```\npublic class MyDerivedClass : MyBaseClass\n{\n\
  \   new public void DoSomething()\n   {\n      // 派生类实现，隐藏了基类实现。\n   }\n}\n```\n\
  \n这种的工作的方式相同，但不会显示警告。此时，值得注意的是隐藏和覆盖基类成员之间的区别。考虑以下代码：\n\n```\npublic class MyBaseClass\n\
  {\n   public virtual void DoSomething() => Console.WriteLine(\"Base imp\");\n}\n\
  public class MyDerivedClass : MyBaseClass\n{\n   public override void DoSomething()\
  \ => Console.WriteLine(\"Derived imp\");\n}\n```\n\n在这里，覆盖的方法替换了基类中的实现，使得下面的代码即使是通过基类类型调用的（使用多态），也会使用新版本：\n\
  \n```\nMyDerivedClass myObj = new MyDerivedClass();\nMyBaseClass myBaseObj;\nmyBaseObj\
  \ = myObj;\nmyBaseObj.DoSomething();\n```\n\n这将导致以下输出：\n\n```\nDerived imp\n```\n\
  \n或者，你可以隐藏基类方法：\n\n```c\npublic class MyBaseClass\n{\n   public virtual void DoSomething()\
  \ => Console.WriteLine(\"Base imp\");\n}\npublic class MyDerivedClass : MyBaseClass\n\
  {\n   new public void DoSomething() => Console.WriteLine(\"Derived imp\");\n}\n\
  ```\n\n基类方法不需要是虚方法即可完成此工作，但效果完全相同，且前面的代码只需要更改一行。虚方法或非虚基类方法的结果如下：\n\n```\nBase imp\n\
  ```\n\n尽管基类实现被隐藏了，你仍然可以通过基类访问它。\n\n### 调用覆盖或隐藏的基类方法\n\n无论你是覆盖还是隐藏某个成员，你仍然可以从派生类访问基类成员。在许多情况下，这都是非常有用的，例如：\n\
  \n* 当你想要对派生类的用户隐藏继承的公共成员，但仍想在类内部访问其功能时\n* 当你想在继承的虚成员的实现基础上进行添加工作，而不是简单地用新的覆盖实现来替换它时\n\
  \n为了实现这一点，你使用 `base` 关键字，它引用派生类中包含的基类实现（类似于在上一章中控制构造函数时的使用方式）：\n\n```\npublic class\
  \ MyBaseClass\n{\n   public virtual void DoSomething()\n   {\n      // 基类实现。\n \
  \  }\n}\npublic class MyDerivedClass : MyBaseClass\n{\n   public override void DoSomething()\n\
  \   {\n      // 派生类实现，扩展了基类实现。\n      base.DoSomething();\n      // 更多派生类实现。\n \
  \  }\n}\n```\n\n这段代码从 `MyDerivedClass` 中的 `DoSomething()` 版本内部执行了 `MyBaseClass`（其基类）中的\
  \ `DoSomething()` 版本。由于 `base` 是通过对象实例工作的，因此在静态成员内部使用它是错误的。\n\n#### this 关键字\n\n\
  除了上一章使用 `base` 之外，你还使用了 `this` 关键字。像 `base` 一样，`this` 可以在类成员内部使用，并且像 `base` 一样，引用一个对象实例，尽管它是当前实例（这意味着你不能在静态成员中使用它）。\n\
  \n`this` 关键字最有用的功能是将当前对象实例的引用传递给方法，如下例所示：\n\n```\n public void doSomething()\n \
  \  {\n      MyTargetClass myObj = new MyTargetClass();\n      myObj.DoSomething(this);\n\
  \   }\n```\n\n在这里，被实例化的 `MyTargetClass` 实例 (`myObj`) 有一个名为 `DoSomething()` 的方法，该方法接受一个与类兼容的类型参数。该参数类型可能是此类类型、该类派自的类类型、该类实现的接口，或者（当然地）`System.Object`。\n\
  \n`this` 关键字的另一个常见用途是限定本地类型成员。例如：\n\n```\npublic class MyClass\n{\n   private int\
  \ someData;\n   public int SomeData => this.someData;\n}\n```\n\n许多开发者喜欢这种语法，它可以与任何成员类型一起使用，因为可以立即看出你引用的是一个成员而不是局部变量。\n\
  \n### 使用嵌套类型定义\n\n你可以在命名空间中定义类等类型，也可以在其他类内部定义它们。这时你可以对定义使用全范围的访问修饰符，而不仅仅是 `public`\
  \ 和 `internal`，并且可以使用 `new` 关键字来隐藏继承自基类的类型定义。例如，下面定义 `MyClass` 代码还定义了一个名为 `MyNestedClass`\
  \ 的嵌套类：\n\n```\npublic class MyClass\n{\n   public class MyNestedClass\n   {\n \
  \     public int NestedClassField;\n   }\n}\n```\n\n要从 `MyClass` 外部实例化 `MyNestedClass`，你必须限定名称，如下所示：\n\
  \n```\nMyClass.MyNestedClass myObj = new MyClass.MyNestedClass();\n```\n\n然而，如果嵌套类被声明为\
  \ `private`（例如），你可能无法这样做。该功能存在的一个原因是为了定义仅对包含类私有的类，从而使命名空间中的其他任何代码都无法访问它们。另一个原因是嵌套类可以访问其包含类的私有和受保护成员。下一个\
  \ Try it Out 将检查此功能。\n\n\n\n\n\n本节将详细介绍如何定义和实现接口。在上一一个章节中，你已经学习了接口的定义方式与类相似，使用了如下代码：\n\
  \n```c\ninterface IMyInterface\n{\n   // 接口成员。\n}\n```\n\n如果你想隐藏继承自基接口的成员，可以使用 `new`\
  \ 关键字来定义成员：\n\n```c\ninterface IMyBaseInterface\n{\n   void DoSomething();\n}\n\
  interface IMyDerivedInterface : IMyBaseInterface\n{\n   new void DoSomething();\n\
  }\n```\n\n这种工作方式与隐藏继承的类成员相同。\n\n接口中定义的属性定义了该属性允许的访问块——`get` 和 `set` 的其中一个或两者，如下所示：\n\
  \n```c\ninterface IMyInterface\n{\n   int MyInt { get; set; }\n}\n```\n\n在这里处，类型为\
  \ `int` 类型的属性 `MyInt` 同时具有 `get` 和 `set` 访问器。对于访问权限限制更严格的属性，可以省略其中任何一个。\n\n接口并不指定属性数据应如何存储。例如，接口不能指定可能用于存储属性数据的字段。最后，接口像类一样，可以定义为类的成员（但不能作为其他接口的成员）。\n\
  \n### 在类中实现接口\n\n实现接口的类必须包含该接口所有成员的实现，这些实现必须与指定的签名匹配（包括匹配指定的 `get` 和 `set` 块），并且必须是\
  \ `public` 的，如下：\n\n```c\npublic interface IMyInterface\n{\n   void DoSomething();\n\
  \   void DoSomethingElse();\n}\npublic class MyClass : IMyInterface\n{\n   public\
  \ void DoSomething() {}\n   public void DoSomethingElse() {}\n}\n```\n\n可以使用 `virtual`\
  \ 或 `abstract`、`static` 或 `const` 关键字来实现接口成员。接口成员也可以在基类中实现：\n\n```c\npublic interface\
  \ IMyInterface\n{\n   void DoSomething();\n   void DoSomethingElse();\n}\npublic\
  \ class MyBaseClass\n{\n   public void DoSomething() {}\n}\npublic class MyDerivedClass\
  \ : MyBaseClass, IMyInterface\n{\n   public void DoSomethingElse() {}\n}\n```\n\n\
  自一个实现了给定接口的基类意味着该派生类隐式地支持该接口。这是一个示例：\n\n```c\npublic interface IMyInterface\n{\n\
  \   void DoSomething();\n   void DoSomethingElse();\n}\npublic class MyBaseClass\
  \ : IMyInterface\n{\n   public virtual void DoSomething() {}\n   public virtual\
  \ void DoSomethingElse() {}\n}\npublic class MyDerivedClass : MyBaseClass\n{\n \
  \  public override void DoSomething() {}\n}\n```\n\n显然，在基类中将实现定义为 `virtual` 是很有用的，这样派生类就可以替换实现而不是隐藏它。如果你使用\
  \ `new` 关键字隐藏基类成员而不是通过这种方式进行重写（override），那么即使通过接口访问派生类，`IMyInterface.DoSomething()`\
  \ 方法也将始终指向基类版本。\n\n### 显式接口成员实现\n\n类也可以*显式地*explicitly 实现接口成员。如果你这样做，该成员只能通过接口访问，而不能通过类访问。你在上一节代码中使用的*隐式*implicit\
  \ 成员可以通过两种方式访问。\n\n例如，如果 `MyClass` 类隐式地实现了 `IMyInterface` 的 `DoSomething()` 方法（如上例所示），那么以下代码是有效的：\n\
  \n```c\nMyClass myObj = new MyClass();\nmyObj.DoSomething();\n```\n\n以下代码也是有效的：\n\
  \n```c\nMyClass myObj = new MyClass();\nIMyInterface myInt = myObj;\nmyInt.DoSomething();\n\
  ```\n\n或者，如果 `MyDerivedClass` 显式地实现 `DoSomething()`，则只允许后一种技术。相应的代码如下：\n\n```c\n\
  public class MyClass : IMyInterface\n{\n   void IMyInterface.DoSomething() {}\n\
  \   public void DoSomethingElse() {}\n}\n```\n\n在这里，`DoSomething()` 是显式实现的，而 `DoSomethingElse()`\
  \ 是隐式的。只有后者可以通过 `MyClass` 的对象实例直接访问。\n\n### 额外的属性访问器\n\n之前你学习过，如果你实现了一个带有属性的接口，就必须实现匹配的\
  \ `get/set` 访问器。这并不完全正确——在定义该属性的接口只包含 `set` 块的情况下，可以在类的属性中添加 `get` 块，反之亦然。然而，这只有在你隐式实现接口时才可行。此外，在大多数情况下，你可能希望添加一个比接口中定义的访问器更严格的访问可见性修饰符。由于接口中定义的访问器根据定义是\
  \ `public` 的，这意味着你将添加非公共（nonpublic）访问器。这里有一个示例：\n\n```c\npublic interface IMyInterface\n\
  {\n   int MyIntProperty { get; }\n}\npublic class MyBaseClass : IMyInterface\n{\n\
  \   public int MyIntProperty { get; protected set; }\n}\n```\n\n如果你将额外的访问器定义为 `public`，那么拥有实现接口类的代码就可以访问它。然而，仅访问接口的代码将无法访问它。\n\
  \n## 部分类定义\n\n当你创建一个具有许多类型成员的类时，代码可能会变得非常混乱，代码文件可能会变得非常长。一种有帮助的技术是使用代码大纲（code outlining）。通过在代码中定义区域（regions），你可以折叠和展开代码部分，使代码更易读。例如，你可能如下定义一个类：\n\
  \n```c\npublic class MyClass\n{\n   #region Fields\n   private int myInt;\n   #endregion\n\
  \   #region Constructor\n   public MyClass() { myInt = 99; }\n   #endregion\n  \
  \ #region Properties\n   public int MyInt\n   {\n      get { return myInt; }\n \
  \     set { myInt = value; }\n   }\n   #endregion\n   #region Methods\n   public\
  \ void DoSomething()\n   {\n      // 执行某些操作..\n   }\n   #endregion\n}\n```\n\n在这里，你可以展开和缩小字段、属性、构造函数和方法，从而关注你感兴趣的内容。你甚至可以这样嵌套区域，使得某些区域仅在包含它们的区域展开时可见。\n\
  \n使用区域的替代方案是使用*部分类定义*（partial class definitions）。简单来说，使用部分类定义可以将类的定义划分到多个文件中。例如，你可以将字段、属性和构造函数放在一个文件中，将方法放在另一个文件中。为了这一点，只需在每个包含定义的文件中使用\
  \ `partial` 关键字即可：\n\n```c\npublic partial class MyClass {}\n```\n\n如果你使用部分类定义，`partial`\
  \ 关键字必须出现在包含定义的每个文件的该位置。\n\n例如，名为 `MainWindow` 的类的 WPF 窗口的代码同时存储在 `MainWindow.xaml.cs`\
  \ 和 `MainWindow.g.i.cs` 中（如果在解决方案资源管理器中选择了“显示所有文件”，并深入到 `obj\\Debug\\*` 文件夹，其中 `*`\
  \ 代表目标框架别名，即可可见）。这让你能够专注于表单的功能，而无需担心代码被你并不真正感兴趣的信息所干扰。\n\n关于部分类的最后一点是：应用于一个部分类部分的接口适用于整个类，这意味着如下定义：\n\
  \n```c\npublic partial class MyClass : IMyInterface1 { … }\npublic partial class\
  \ MyClass : IMyInterface2 { … }\n```\n\n等同于：\n\n```c\npublic class MyClass : IMyInterface1,\
  \ IMyInterface2 { … }\n```\n\n部分类定义可以在单个部分类定义中包含基类，也可以在多个部分类定义中包含。然而，如果在多个定义中指定了基类，它必须是*同一个*基类；记住，C#\
  \ 中的类只能继承自单一基类。\n\n## 部分方法定义\n\n\n\n\n\n部分类也可以定义部分方法。部分方法在一个部分类定义中定义，且不包含方法体，并在另一个部分类定义中实现。在两个地方，都使用了\
  \ `partial` 关键字：\n\n```\npublic partial class MyClass\n{\n   partial void MyPartialMethod();\n\
  }\npublic partial class MyClass\n{\n   partial void MyPartialMethod()\n   {\n  \
  \    // 方法实现\n   }\n}\n```\n\n部分方法也可以是静态的，但它们是隐式私有的，且不能有返回值。它们使用的任何参数不能是 `out` 参数，但可以是\
  \ `ref` 参数。它们还不能使用 `virtual`、`abstract`、`override`、`new`、`sealed` 或 `extern` 修饰符。\n\
  \n由于这些限制，部分方法的作用似乎并不显而易见。事实上，它们在代码编译时非常重要，而不是使用时。考虑以下代码：\n\n```\npublic partial\
  \ class MyClass\n{\n   partial void DoSomethingElse();\n   public void DoSomething()\n\
  \   {\n      Console.WriteLine(\"DoSomething() execution started.\");\n      DoSomethingElse();\n\
  \      Console.WriteLine(\"DoSomething() execution finished.\");\n   }\n}\npublic\
  \ partial class MyClass\n{\n   partial void DoSomethingElse() =>\n      Console.WriteLine(\"\
  DoSomethingElse() called.\");\n}\n```\n\n在这里，部分方法 `DoSomethingElse()` 在第一个部分类定义中定义并调用，在第二个定义中实现。当从控制应用程序调用\
  \ `DoSomething()` 时，输出正如你所期的：\n\n```\nDoSomething() execution started.\nDoSomethingElse()\
  \ called.\nDoSomething() execution finished.\n```\n\n如果你完全删除了第二个部分类定义或部分方法实现（或注释掉代码），输出将如下：\n\
  \n```\nDoSomething() execution started.\nDoSomething() execution finished.\n```\n\
  \n你可能会认为发生的情况是：当调用 `DoSomethingElse()` 时，运行时发现该方法没有实现，因此继续执行下一行代码。实际情况要微妙得多。当你编译包含没有实现的部分方法定义的代码时，编译器会完全移除该方法。它还会移除对该方法的任何调用。当你执行代码时，不会对实现进行检查，因为没有可供检查的调用。这导致了性能的微小但显著的提升。\n\
  \n与部分类一样，部分方法在自定义自动生成的代码或设计器创建的代码时非常有用。设计器可能会声明部分方法，你可以根据情况选择实现或来实现。如果你不实现它们，就不会产生性能影响，因为该方法在编译后的代码中实际上并不存在。\n\
  \n此时，考虑为什么部分方法不能有返回类型。如果你能让自己满意地回答这个问题，你就可以确定你已经完全理解了这个主题——所以我们把这个问题留作为你的一项练习。\n\
  \n## 示例应用程序\n\n为了说明你到目前为止一直在使用的一些技术，在本节中，你将开发一个类模块，你可以在此基础上进行构建并在后续章节中使用。该类模块包含两个类：\n\
  \n* `Card`——代表标准的扑克牌，具有黑花、方片、红心或梅桃花花，以及介于王牌和国王之间的等级。\n* `Deck`——代表一套完整的 52 张牌牌组，可以通过牌组中的位置访问纸牌，并具有洗牌组的能力。\n\
  \n你还将开发一个简单的客户端以确保一切运行正常，但你还没有在完整的纸牌游戏应用程序中使用牌组。\n\n### 规划应用程序\n\n此应用的类库 `Ch10CardLib`\
  \ 将包含你的类。在开始编写任何代码之前，你应该规划类类所需的结构和功能。\n\n#### Card 类\n\n`Card` 类本质上是两个只读字段 `suit`\
  \ 和 `rank` 的容器。将字段设置为只读的原因是，拥有一个“空白”牌是没有意义的，而且纸牌在创建后不应该能够被改变。为了方便这一点，你将默认构造函数设为私有，并提供一个替代构造函数，根据提供的花色和等级构建纸牌。\n\
  \n除外，`Card` 类将重写 `System.Object` 的 `ToString()` 方法，以便你可以轻松获取代表纸牌的可读字符串。为了让事情更简单，你将为两个字段\
  \ `suit` 和 `rank` 提供枚举。\n\n`Card` 类如图 10-4 所示。\n\n![Card 类快照。](img/c10f004.png)\n\
  \n图 10-4\n\n#### Deck 类\n\n`Deck` 类将维护 52 个 `Card` 对象。你可以为此使用简单的数组类型。该数组将无法直接访问，因为对\
  \ `Card` 对象的访问是通过 `GetCard()` 方法实现的，该方法返回给定索引的 `Card` 对象。此类还应该暴露一个 `Shuffle()` 方法来重新排列数组中的纸牌。`Deck`\
  \ 类如图 10-5 所示。\n\n![Deck 类快照。](img/c10f005.png)\n\n图 10-5\n\n### 编写类库\n\n出于本示例的目的，假设你对\
  \ IDE 足够熟悉，因此不会列出标准的步骤。这里是对代码的详细查看，以确保你不会遇到任何问题。\n\n你的类和枚举将包含在一个名为 `Ch10CardLib`\
  \ 的类库项目中。该项目包含四个 `.cs` 文件：`Card.cs` 包含 `Card` 类定义，`Deck.cs` 包含 `Deck` 类定义，以及包含枚举的\
  \ `Suit.cs` 和 `Rank.cs`。\n\n你可以使用 Visual Studio 类图组合这些代码。\n\n要开始，你需要执行以下操作：\n\n\
  1. 创建名为 `Ch10CardLib` 的新类库项目并将其保存到 `C:\\BeginningCSharpAndNET\\Chapter10`。\n2. 从项目中删除\
  \ `Class1.cs`。\n3. 使用解决方案资源管理器打开项目的类图（右键点击项目并点击添加 -> 新项 -> 类图）。类图开始时应该是空的。这会在项目中创建一个名为\
  \ `ClassDiagram1.cd` 的文件供以后使用。\n\n#### 添加 Suit 和 Rank 枚举\n\n打开 `ClassDiagram1.cd`\
  \ 文件，通过从工具箱拖入枚举到图中来添加枚举，然后填充出现的 New Enum 对话框。例如，对于 `Suit` 枚举，如图 10-6](#c10.xhtml_c10-fig-0006)所示填充对话框。\n\
  \n![填充 Suit 对话框的快照。](img/c10f006.png)\n\n图 10-6\n\n接下来，使用类详细信息窗口添加枚举的成员（在 `ClassDiagram1.cd`\
  \ 文件中右键点击刚添加的 `Suit` Enum -> 类详细信息）。图 10-7 显示了所需的值。\n\n![类详细信息窗口的快照。](img/c10f007.png)\n\
  \n图 10-7\n\n以相同的方式从工具箱添加 `Rank` 枚举。所需的值如图 10-8](#c10.xhtml_c10-fig-0008)所示。\n\n\
  ![从工具箱添加 Rank 枚举的快照。](img/c10f008.png)\n\n图 10-8\n\n\n\n\n你可以在代码文件 `Suit.cs` 和 `Rank.cs`\
  \ 中找到为这两个枚举生成的代码。首先，你可以在 `Ch10CardLib Suit.cs` 中找到该枚举的完整代码：\n\n```cs\nusing System;\n\
  using System.Collections.Generic;\nusing System.Text;\nnamespace Ch10CardLib\n{\n\
  \   public enum Suit\n   {\n      Club,\n      Diamond,\n      Heart,\n      Spade,\n\
  \   }\n}\n```\n\n你还可以在 `Ch10CardLib Rank.cs` 中找到该枚举的完整代码：\n\n```cs\nusing System;\n\
  using System.Collections.Generic;\nusing System.Text;\nnamespace Ch10CardLib\n{\n\
  \   public enum Rank\n   {\n      Ace = 1,\n      Deuce,\n      Three,\n      Four,\n\
  \      Five,\n      Six,\n      Seven,\n      Eight,\n      Nine,\n      Ten,\n\
  \      Jack,\n      Queen,\n      King,\n   }\n}\n```\n\n或者，你也可以通过添加 `Suit.cs` 和\
  \ `Rank.cs` 代码文件并输入代码来手动添加这些代码。注意，代码生成器可能会在最后一个枚举成员后添加额外的逗号，但它们不会阻止编译，也不会导致创建额外的“空”成员——尽管它们看起来有点乱。\n\
  \n### 添加 Card 类\n\n要添加 `Card` 类，你将结合使用类设计器（class designer）和代码编辑器。在类设计器中添加类与添加枚举非常相似——你从工具箱中将相应的项拖入图中。在这种情况下，你将一个\
  \ `Class` 拖入图中并将新类命名为 `Card`。\n\n使用类详细（Class Details）窗口添加字段 `rank` 和 `suit`，然后使用属性（Properties）窗口将这些字段的常量类型（Constant\
  \ Kind）设置为 `readonly`。你还需要添加两个构造函数——一个私有默认构造函数和一个接受两个参数的公共构造函数，这两个参数分别为类型 `Suit`\
  \ 和 `Rank` 的 `newSuit` 和 `newRank`。最后，重写 `ToString()`，这要求你在属性窗口中将 `Inheritance Modifier`\
  \ 为 `override`。\n\n图 10-9 显示了输入了所有信息的类详细窗口和 `Card` 类。（你可以在 `Ch10CardLib\\Card.cs`\
  \ 中找到此代码。）\n\n![输入了所有信息的类详细窗口和 Card 类截图。](img/c10f009.png)\n\n**图 10-9**\n\n接下来，如果你没有使用类图窗口构建类，请按照如下方式修改\
  \ `Card.cs` 中的类代码（或将所示代码添加到 `Ch10CardLib` 命名空间中名为 `Card` 的新类中）：\n\n```cs\npublic\
  \ class Card\n{\n   public readonly Suit suit;\n   public readonly Rank rank;\n\
  \   public Card(Suit newSuit, Rank newRank)\n   {\n      suit = newSuit;\n     \
  \ rank = newRank;\n   }\n   private Card() {}\n   public override string ToString()\
  \ => \"The \" + rank + \" of \" + suit + \"s\";\n}\n```\n\n重写的 `ToString()` 方法将所存储的枚举值的字符串表示写入返回的字符串中，而非默认构造函数则初始化\
  \ `suit` 和 `rank` 字段的值。\n\n### 添加 Deck 类\n\n`Deck` 类需要使用类图定义以下成员：\n\n*   类型为 `Card[]`\
  \ 的私有字段 `cards`\n*   一个公共默认构造函数\n*   一个名为 `GetCard()` 的公共方法，它接受一个名为 `cardNum` 的\
  \ `int` 参数并返回一个 `Card` 类型的对象\n*   一个名为 `Shuffle()` 的公共方法，它不接受参数并返回 `void`\n\n当添加这些内容后，`Deck`\
  \ 类的类详细窗口将如图 10-10 所示。\n\n![Deck 类类详细窗口截图。](img/c10f010.png)\n\n**图 10-10**\n\n\
  为了让图表更清晰，你可以显示已添加成员和类型之间的关系。在类图中，依次右键点击以下每一项，并从菜单中选择“显示为关联”（Show as Association）：\n\
  \n*   `Deck` 中的 `cards`\n*   `Card` 中的 `suit`\n*   `Card` 中的 `rank`\n\n完成后，图表应该像图\
  \ 10-11 所示。\n\n![从菜单中选择“显示为关联”的截图。](img/c10f011.png)\n\n**图 10-11**\n\n接下来，修改 `Deck.cs`\
  \ 中的代码（如果你没有使用类设计器，则必须先使用此处代码添加此类）。你可以在 `Ch10CardLib\\Deck.cs` 中找到此代码。首先你实现构造函数，它简单地在\
  \ `cards` 字段中创建并分配 52 张卡牌。你遍历两个枚举的所有组合。\n\n```cs\nusing System;\nusing System.Collections.Generic;\n\
  using System.Text;\nnamespace Ch10CardLib\n{\n   public class Deck\n   {\n     \
  \ private Card[] cards;\n      public Deck()\n      {\n         cards = new Card[52];\n\
  \         for (int suitVal = 0; suitVal < 4; suitVal++)\n         {\n          \
  \  for (int rankVal = 0; rankVal < 13; rankVal++)\n            {\n             \
  \  cards[suitVal * 13 + rankVal] = new Card((Suit)suitVal, (Rank)rankVal);\n   \
  \         }\n         }\n      }\n    }\n}\n```\n\n接下来，实现 `GetCard()` 方法，它返回请求索引的\
  \ `Card` 对象或抛出异常：\n\n```cs\npublic Card GetCard(int cardNum)\n{\n    if (cardNum\
  \ >= 0 && cardNum <= 51)\n        return cards[cardNum];\n    else\n        throw\
  \ new ArgumentOutOfRangeException(\"cardNum\", \"值必须在 0 到 51 之间.\");\n}\n```\n\n\
  最后，你实现 `Shuffle()` 方法。该方法通过创建一个临时数组并将 `cards` 数组中的元素随机复制到其中来实现。代码如下：\n\n```cs\n\
  public void Shuffle()\n{\n   Card[] newDeck = new Card[52];\n   bool[] assigned\
  \ = new bool[52];\n   Random sourceGen = new Random();\n   for (int i = 0; i < 52;\
  \ i++)\n   {\n      int destCard = 0;\n      bool foundCard = false;\n      while\
  \ (foundCard == false)\n      {\n         destCard = sourceGen.Next(52);\n     \
  \    if (assigned[destCard] == false)\n            foundCard = true;\n      }\n\
  \      assigned[destCard] = true;\n      newDeck[destCard] = cards[i];\n   }\n \
  \  newDeck.CopyTo(cards, 0);\n}\n```\n\n\n\n\n该方法的最后一行使用 `System.Array` 类的 `CopyTo()`\
  \ 方法（每当你创建一个数组时都会使用）将 `newDeck` 中的每张卡牌复制回 `cards` 中。这意味着你正在同一个 `cards` 对象中使用同一组\
  \ `Card` 对象，而不是创建任何新实例。如果你改用 `cards = newDeck`，那么你将用另一个实例替换掉 `cards` 所引用的对象实例。如果代码的其他地方保留了对原始\
  \ `cards` 实例的引用，这可能会导致问题——因为原始实例并没有被洗牌！\n\n类库代码到此结束。\n\n## 类库的客户端应用程序\n\n为了保持简单，你可以向包含该类库的解决方案添加一个客户端控制台应用程序。为此，只需在“解决方案管理器”中右键点击解决方案，并选择\
  \ `Add ➪ New Project`。新的控制台应用程序项目命名为 `Ch10CardClient`。\n\n要在这个新的控制台应用程序项目中使用你创建的类库，请为你的\
  \ `Ch10CardLib` 类库项目添加引用。你可以通过引用管理器对话框的“项目”选项卡来操作（右键点击 `Ch10CardClient` 项目，然后 `Add\
  \ ➪ Project Reference ➪ Projects`），如图图 10-12\n\nFIGURE 10-12\n\n选择项目并点击确定以添加引用。\n\
  \n由于这个新项目是你创建的第二个项目，你还需要指定它是解决方案的启动项目，即点击“运行”时执行的项目。为此，只需在“解决方案管理器”窗口中右键点击项目名称，并选择\
  \ `Set as StartUp Project` 菜单选项。\n\n接下来，添加使用你新类的代码。这不需要任何特别的操作，使用以下代码即可（你可以在 `Ch10CardClient\\\
  Program.cs` 中找到这些代码）：\n\n```csharp\nusing System;\nusing Ch10CardLib;\nnamespace\
  \ Ch10CardClient\n{\n   class Program\n   {\n      static void Main(string[] args)\n\
  \      {\n         Deck myDeck = new Deck();\n         myDeck.Shuffle();\n     \
  \    for (int i = 0; i < 52; i++)\n         {\n            Card tempCard = myDeck.GetCard(i);\n\
  \            Console.Write(tempCard.ToString());\n            if (i != 51)\n   \
  \            Console.Write(\", \");\n            else\n               Console.WriteLine();\n\
  \         }\n         Console.ReadKey();\n      }\n   }\n}\n```\n\n图 10-13 显示了运行此应用程序后得到的结果。\n\
  \n![运行应用程序后结果显示的截图。](img/c10f013.png)\n\nFIGURE 10-13\n\n这是牌组中 52 张扑牌的随机排列。你将在稍后的章节中继续开发和使用此类库。\n\
  \n## 调用层次结构窗口\n\n现在是查看 Visual Studio 另一个功能的良好时机：调用层次结构窗口。该窗口允许你对代码进行查询，以找到你的方法是从哪里被调用的，以及它们与其他方法之间的关系。说明这一点的最佳方法是使用一个示例。\n\
  \n打开上一节中的示例应用程序并打开 `Deck.cs` 代码文件。找到 `Shuffle()` 方法，右键点击它，并选择 `View Call Hierarchy`\
  \ 菜单项。出现的窗口如图图 10-14\n\nFIGURE 10-14\n\n从 `Shuffle()` 方法开始，你可以深入窗口中的树形视图，找到所有调用该方法的代码。你可以双击位置以立即跳转到所引用的代码行。\n\
