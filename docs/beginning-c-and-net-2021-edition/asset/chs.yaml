  \ SOAP 的 WCF 和网络服务的替代方案。 |\n| Web API | Web API 是 ASP.NET 的 REST 实现，它没有用户界面，并且仅以\
  \ JSON 文档的形式返回数据负载。 |\n| JSON | 这种数据格式是客户端和服务器之间发送接收数据的开放标准。它是 XML 或 HTML 格式的替代方案。\
  \ |\n| WCF 基础 | WCF 提供了一个创建和与远程服务通信的框架。它结合了网络服务和远程架构的元素，以及新技术来实现这一目标。 |\n| 通信协议\
  \ | 你可以使用多种协议之一（包括 HTTP 和 TCP）与 WCF 服务通信。这意味着你可以使用本地于客户端应用程序的服务，也可以跨越机器或网络边界的服务。要实现这一点，你通过与所需的协议和功能对应的绑定访问服务的特定端点。你可以通过行为（behaviors）控制这些功能，例如使用会话状态或暴露元数据。.NET\
  \ 包含了许多默认设置，使得定义简单服务非常容易。 |\n| 通信负载 | 通常，对 WCF 服务的响应编码为 SOAP 消息。但也有其他替代方案，例如纯文 HTTP\
  \ 消息，如果你需要，你也可以从头定义自己的负载类型。 |\n| 托管 | WCF 服务可以托管在 IIS 或 Windows 服务中，也可以自托管。使用像 IIS\
  \ 这样的宿主机可以利用宿主机内置的功能，包括安全和应用程序池。自托管更加灵活，但可能需要更多的配置和编码。 |\n| 合约 | 你通过合约定义 WCF 服务与客户端代码之间的接口。服务本身及其暴露的任何操作都通过服务合约和操作合约来定义。数据类型通过数据合约定义。通信的进一步定制通过消息合约和故障合约来实现。\
  \ |\n| 客户端应用程序 | 客户端应用程序通过代理类与 WCF 服务通信。代理类实现了该服务的服务合约接口，任何对此接口操作方法的调用都会被重定向到服务。你可以使用“添加服务引用”工具生成代理类，也可以通过通道工厂方法以编程方式创建。为了确保通信成功，客户端的配置必须与服务的配置相匹配。\
  \ |\n\n# 21\n\n基础桌面编程\n\n本章的代码下载可以在书籍页面的 [`www.wiley.com`](http://www.wiley.com)\
  \ 找到。点击“Downloads”链接。代码也可以在 github.com/benperk/BeginningCSharpAndDotNET`](http://github.com/benperk/BeginningCSharpAndDotNET)\
  \ 找到。代码位于 `Chapter21` 文件夹中，并根据章节中的名称单独命名。\n\n本书的第一部分关注的是 C# 的细节，但现在是时候离开编程语言的细节，进入图形用户界面（GUI）的世界了。\n\
  \n多年来，Visual Studio 为 Windows 开发者提供了创建用户界面的选择：Windows Forms 是一种用于创建针对经典 Windows\
  \ 应用程序的基本工具；而 Windows Presentation Foundation（WPF）提供了更广泛的应用程序类型，并尝试解决 Windows Forms\
  \ 的许多问题。在本章中，你将学习如何使用 WPF 创建经典的 Windows 应用程序。\n\n大多数图形 Windows 应用程序开发的核心是窗口设计器（Window\
  \ Designer）。你通过从工具箱（Toolbox）拖放控件到窗口中来创建用户界面，将它们放置在你运行应用程序时希望它们出现的地方。对于 WPF 来说，这部分正确，因为用户界面实际上完全是用另一种名为可扩展应用程序标记语言（`XAML`，读作\
  \ *zammel*）的语言编写的。Visual Studio 允许你兼顾两者，随着你对 WPF 越来越熟悉，你可能会将拖放控件与原始 XAML 结合。\n\n\
  在本章中，你将使用 Visual Studio WPF 设计器为你之前章节编写的游戏创建多个窗口。你将学习使用 Visual Studio 自带的许多控件，这些控件涵盖了广泛的功能。通过\
  \ Visual Studio 的设计功能，开发用户界面和处理用户交互非常简单且有趣！在本书范围内介绍所有 Visual Studio 控件是不可能的，因此本章将介绍一些常用的控件，从标签、文本框到菜单栏和布局面板。\n\
  \n## XAML\n\nXAML 是一种使用 XML 语法的语言，能够以声明式的层次结构将控件添加到用户界面。也就是说，你可以通过 XML 元素添加控件，并通过\
  \ XML 属性指定控件属性。你还可以创建包含其他的控件，这对于布局和功能都是关重要的。\n\nXAML 的设计考虑到今天强大的显卡，因此它允许你使用这些显卡提供的所有高级功能。以下列出了其中的一些功能：\n\
  \n- 浮点坐标和矢量图形，提供了可以缩放、旋转或其他进行转换而不会丢失质量的布局\n- 用于高级渲染的 2D 和 3D 能力\n- 高级字体处理和渲染\n-\
  \ 带有可选透明度的 UI 对象的纯色、渐变和纹理填充\n- 动画故事板，可用于各种情况，包括点击按钮等用户触发的事件\n- 可复用的资源\n\n### 关注点分离\n\
  \n\n\n\n多年来编写的 Windows 应用程序存在的一个问题是，它们往往会将生成用户界面的代码与根据用户操作执行的代码混合在一起。这使得多个开发者和设计师很难在同一个项目上共同工作。WPF\
  \ 通过两种方式解决了这个问题。首先，通过使用 XAML 描述 GUI 而不是 C#，使得 GUI 变得与平台无关，你实际上可以在不编写任何代码的情况下渲染 XAML。其次，这意味着将\
  \ C# 代码放置在与 GUI 代码不同的文件中会感觉很自然。Visual Studio 利用了名为 `code-behind`（代码后置）的文件，这些是与 XAML\
  \ 文件动态链接的 C# 文件。\n\n由于 GUI 与代码是分离的，因此可以为设计 GUI 创建定制的应用程序，而这正是微软所做的。设计工具 Blend for\
  \ Visual Studio 是设计师们在为 WPF 创建 GUI 时的首选工具。该工具可以加载与 Visual Studio 相同的项目，但 Visual\
  \ Studio 更多地面向开发者而非设计师，而 Blend 则恰相反。这意味着在拥有设计师和开发者的大型项目中，每个人都可以就同一个项目共同工作，使用他们偏好的工具，而不必担心无意中影响他人。\n\
  \n## XAML 的实战\n\n如前所述，XAML 是 XML，这意味着只要文件足够小，就可以立即看到它们描述的内容。看一眼这个小示例，看看你是否能看出它是做什么的：\n\
  \n```\n<Window x:Class=\"Ch21Ex01.MainWindow\"\n        xmlns=\"http://schemas.microsoft.com/winfx/2006/xaml/presentation\"\
  \n        xmlns:x=\"http://schemas.microsoft.com/winfx/2006/xaml\"\n        xmlns:d=\"\
  http://schemas.microsoft.com/expression/blend/2008\"\n        xmlns:mc=\"http://schemas.openxmlformats.org/markup-compatibility/2006\"\
  \n        xmlns:local=\"clr-namespace:WpfApp1\"\n        mc:Ignorable=\"d\"\n  \
  \      Title=\"Hello World\" Height=\"350\" Width=\"525\">\n    <Grid>\n       \
  \ <Button Content=\"Hello World\" \n            HorizontalAlignment=\"Left\" \n\
  \            Margin=\"220,151,0,0\" \n            VerticalAlignment=\"Top\" \n \
  \           Width=\"75\"/>\n\n    </Grid>\n</Window>\n```\n\n此示例中的 XAML 创建了一个带有单个按钮的窗口。窗口和按钮都显示文本\
  \ `\"Hello World\"`。XML 允许你将标签放在其他标签内部，只要你正确地关闭它们即可。当 XAML 中的将一个元素放在另一个元素内部时，该元素就变成了包含元素的内容，这意味着\
  \ `Button` 也可以写成这样：\n\n```\n <Button HorizontalAlignment=\"Left\" \n           \
  \ Margin=\"220,151,0,0\" \n            VerticalAlignment=\"Top\" \n            Width=\"\
  75\">\n      Hello World\n          </Button>\n```\n\n在这里，`Button` 的 `Content` 属性被移除，文本现在是\
  \ `Button` 控件的子节点。在 XAML 中，`Content` 可以是任何内容，这在示例中也得到了证明：`Button` 元素是 `Grid` 元素的内容，而\
  \ `Grid` 又是 `Window` 元素的内容。\n\n大多数控件都可以包含内容，而且对于更改内置控件外观的操作限制非常少。\n\n### 命名空间\n\n\
  上一个示例中的 `Window` 元素是 XAML 文件的根元素。该元素通常包含许多命名空间声明。默认情况下，Visual Studio 设计器包含了两个你应该注意的命名空间：`http://schemas.microsoft.com/winfx/2006/xaml/presentation`\
  \ 和 `http://schemas.microsoft.com/winfx/2006/xaml`。第一个是 WPF 的默认命名空间，声明了许多你将用来创建用户界面的控件。第二个声明了\
  \ XAML 语言本身。命名空间不必非在根标签上声明，但这样做可以确保其内容在整个 XAML 文件中都能轻松访问，因此很少需要移动这些声明。\n\n当你在 Visual\
  \ Studio 中创建新窗口时，演示命名空间始终被声明为默认命名空间，语言命名空间声明为 `xmlns:x`。正如 `Window`、`Button` 和 `Grid`\
  \ 标签所示，这确保了你不需要为添加到窗口的控件添加前缀，但你指定的语言元素必须带有 `x` 前缀。\n\n你将非常经常看到的最后一个命名空间是系统命名空间：`xmlns:sys=\"\
  clr-namespace:System;assembly=mscorlib\"`。此命名空间允许你在 XAML 中使用 .NET Framework 的内置类型。通过这种方式，你编写标记可以显式地声明你正在创建的元素类型。例如，可以在标记中声明一个数组并说明数组的成员是字符串：\n\
  \n```\n <Window.Resources>\n    <ResourceDictionary>\n      <x:Array Type=\"sys:String\"\
  \ x:Key=\"localArray\">\n        <sys:String>\"Benjamin Perkins\"</sys:String>\n\
  \        <sys:String>\"Jon D. Reid\"</sys:String>\n      </x:Array>\n    </ResourceDictionary>\n\
  \    </Window.Resources>\n```\n\n### 代码后置文件\n\n虽然 XAML 是声明用户界面的强大方式，但它并不是一种编程语言。每当你想做比演示更多的操作，你就需要\
  \ C#。可以将 C# 代码直接嵌入 XAML 中，但不建议将代码和标记混合，你在书中也不会看到这样做。你经常看到的是代码后置文件。这些文件是与 XAML 文件同名的\
  \ C# 文件，带有 `.cs` 后缀。尽管你可以给它们起任何名称，但最好遵循这种命名规范。Visual Studio 在创建新窗口时会自动创建代码后置文件。它还在\
  \ XAML 的 `Window` 标签中添加了 `x:Class` 属性\n\n```\n<Window x:Class=\"Ch21Ex01.MainWindow\"\
  \n```\n\n这告诉编译器可以在名为 `Ch21Ex01.MainWindow` 的文件中找到此窗口的代码。由于你只能指定完全限定类名，而不是类所在的程序集，因此无法将代码后置放置在定义\
  \ XAML 的项目的任何地方。Visual Studio 将代码后置文件放在与 XAML 文件相同的目录中，因此在 Visual Studio 中工作时无需担心这个问题。\n\
  \n## 练习场\n\n现在你已经了解了足够关于 WPF 构建的知识以开始动手了，是时候查看编辑器了。通过选择 File ➪ New ➪ Project 开始一个新的\
  \ WPF 项目。在创建新项目的对话框中，通过 C#、Windows 和 Desktop 缩小范围到 Visual C# 下的 Windows Classic\
  \ Desktop 节点，并选择 WPF 项目模板。图 21-1 显示了带有正确模板的创建新项目对话框。\n\n![带有正确模板的创建新项目对话框的截图。](img/c21f001.png)\n\
  \n为了能够在后续示例中重用此示例，请将项目命名为 `Ch21Ex01`。点击 Next。对于 Target Framework 选择 .NET5 (Current)。\n\
  \nVisual Studio 现在显示了一个空窗口和周围的多个面板。屏幕大部分分为两个部分。上半部分称为 Design View（设计视图），显示你正在设计的窗口的\
  \ WYSIWYG（所见即所得）表示，下半部分称为 XAML View（XAML 视图），显示相同窗口的文本表示。\n\n\n\n\n在设计视图（Design\
  \ View）的右侧，你可以看到在项目中项目过的解决方案管理器（Solution Explorer），以及一个显示设计视图和 XAML 视图中当前选中信息的属性面板（Properties\
  \ panel）。值得注意的是，属性面板、`XAML View` 和 `Design View` 中的选择项始终是同步的，因此如果你在 `XAML View`\
  \ 中移动光标，你会看到另外两个视图中的选中项随之变化。\n\n设计视图左侧折叠了一些面板，其中一个就是 `Toolbox`（工具箱）。本章将向你展示如何使用\
  \ `Toolbox` 面中的许多控件为卡牌游戏创建对话框，因此请点击右上角的图钉将其展开并固定。。顺便也请展开面板中的 `Common WPF Controls`（常用\
  \ WPF 控件）节点。在本章中，你将使用这里显示的大多数控件。\n\n### WPF 控件\n\n控件将预封装的代码和 GUI 结合在一起，可以被重用以创建更复杂的应用程序。它们可以定义默认的绘制方式以及一组标准行为。某些控件，如\
  \ `Label`、`Button` 和 `TextBox` 控件很容易识别，并在 Windows 应用程序中已使用了十年。其他控件，如 `Canvas` 和\
  \ `StackPanel` 则不显示任何内容，仅帮助你组织 GUI。\n\n开箱即用的控件看起来与你预期的标准 Windows 应用程序中的控件完全一致，并使用当前的\
  \ Windows 主题来绘制自己。所有这些内容都是高度可定制的，只需点击几次，你就可以完全改变控件的显示方式。这种自定义是通过控件上定义的属性完成的。WPF\
  \ 使用你以前见过的普通属性，并增加了一种名为 `dependency property`（依赖属性）的新类型属性。本章稍后会详细介绍这些属性，但目前只需要知道\
  \ WPF 的许多属性不仅仅是获取和设置值；例如，它们能够通知观察者变化。\n\n除了定义元素在屏幕上的外观之外，控件还定义了标准行为，例如点击按钮和在列表中选择内容的能力。你可以通过“处理”控件定义的事件来更改用户对控件执行操作时会发生的情况。你何时以及如何实现事件处理程序会根据应用程序和控件而异，但总的来说，你总是会处理按钮的\
  \ `Click` 事件；对于 `ListBox` 控件，你通常需要在用户更改选择项时做出反应，因此应该处理 `SelectionChanged` 事件。在其他控件（如\
  \ `Label` 或 `TextBlock` 控件）上，你很少会实现任何事件。\n\n你可以通过多种方式将控件添加到窗口中，最常见的方法是将它们从 `Toolbox`\
  \ 拖放到 `Design View` 或 `XAML View`。在接下来的“尝试一下”（Try It Out）中，你将完成一个简单的示例。\n\n### 属性\n\
  \n如前所述，所有控件都有许多用于操纵控件行为的属性。其中某些很容易理解，例如 `Height` 和 `Width`，而另一些则不直观，例如 `RenderTransform`。它们都可以使用属性面板、直接在\
  \ XAML 中或通过在设计视图中操纵控件来设置。接下来的“尝试一下”演示了如何在设计视图中设置控件属性。\n\n#### 依赖属性\n\n用户在对话框上执行的操作（例如从列表中选择内容）通常会导致其他控件发生变化并更新其显示或内容。在大多数情况下，普通的\
  \ .NET 属性只是简单的 getter 和 setter，它们没有通知其他控件自身已发生变化的能力。`dependency property` 是以特定方式注册到\
  \ WPF 属性系统中的属性，允许扩展功能。这种扩展功能包括但不限于自动属性更改通知。具体而言，依赖属性具有以下特征：\n\n*   你可以使用样式来更改依赖属性的值。\n\
  *   你可以通过资源或数据绑定来设置依赖属性的值。\n*   你可以在动画中更改依赖属性的值。\n*   你可以在 XAML 中分层设置依赖属性——即，在父元素上设置的依赖属性值可以用于设置其子元素相同依赖属性的默认值。\n\
  *   你可以使用定义的编码模式配置属性值更改的通知。\n*   你可以配置一组相关的属性，以便它们都由于响应其中一个属性的变化而进行更新。这被称为 `coercion`（强制转换）。更改的属性被认为\
  \ `coerce`（强制）其他属性的值。\n*   你可以对依赖属性应用元数据（metadata）以指定其他行为特征。例如，你可能指定如果给定属性发生变化，则可能重新排列用户界面。\n\
  \n在实践中，由于依赖属性的实现方式，你可能不会注意到与普通属性有太大区别。然而，当你创建自己的控件时，你会很快发现使用普通的 .NET 属性时，许多功能突然消失了。\n\
  \n#### 附加属性\n\n`attached property`（附加属性）是一种为定义属性的类实例的每个子对象提供的属性。例如，正如你在本章稍后将看到的，你在之前的示例中使用的\
  \ `Grid` 控件允许你为 `Grid` 的子控件定义列和行。每个子控件随后可以使用附加属性 `Column` 和 `Row` 来指定它在网格中的位置：\n\
  \n```\n<Grid HorizontalAlignment=\"Left\" Height=\"167\" VerticalAlignment=\"Top\"\
  \ Width=\"290\">\n  <Button Content=\"Button\" HorizontalAlignment=\"Left\" Margin=\"\
  10,10,0,0\" \n                   VerticalAlignment=\"Top\" Width=\"75\" Grid.Column=\"\
  0\" Grid.Row=\"0\"/>\n</Grid>\n```\n\n在这里，附加属性通过父元素的名称、点和附加属性的名称引用。\n\n在 WPF 中，附加属性有多种用途。你很快就会看到很多附加属性，当你在“控件布局”（Control\
  \ Layout）部分查看时。你将学习容器控件如何定义附加属性，以便子控件定义停靠在容器的哪个边缘。\n\n### 事件\n\n在第 13 章中，你学习了事件以及如何使用它们。本节涵盖了特定类型的事件——特别是\
  \ WPF 控件生成的事件，并引入了通常与用户操作关联的 `routed events`（路由事件）。例如，当用户点击按钮时，该按钮会生成一个指示发生了什么的事件。处理事件是程序员为该按钮提供功能的手段。\n\
  \n你处理的许多事件会在你处理的大多数控件中暴露。这包括 `LostFocus` 和 `MouseEnter` 等事件。这是因为事件本身是从基类继承的。其他事件例如\
  \ `DatePicker` 的 `CalendarOpened` 事件更为具体，且仅存在专用控件。一些常用事件列在表 21-1 中。\n\n| 事件 | 描述\
  \ |\n| --- | --- |\n| `Click` | 在点击控件时发生。在某些情况下，当用户按下 Enter 或空格键时，也会发生此事件。 |\n|\
  \ `Drop` | 在拖放操作完成时发生——也就是说，当对象被拖到控件上方且用户释放鼠标按钮时发生。 |\n| `DragEnter` | 当被拖动的对象进入控件边界时发生。\
  \ |\n\n\n\n\n\n| `DragLeave` | 当被拖动对象离开控件的边界时发生。 |\n| `DragOver` | 当被拖动对象经过控件时发生。只要被拖动对象留在控件上方，此事件就会重复发生。\
  \ |\n| `KeyDown` | 当控件具有焦点且按下按键时发生。此事件始终发生在 `KeyPress` 和 `KeyUp` 之前。 |\n| `KeyUp`\
  \ | 当控件具有焦点且释放按键时发生。此事件始终发生在 `KeyDown` 事件之后。 |\n| `GotFocus` | 当控件接收到焦点时发生。不要使用此事件进行控件验证。请改用\
  \ `Validating` 和 `Validated`。 |\n| `LostFocus` | 当控件失去焦点时发生。不要使用此事件进行控件验证。请改用 `Validating`\
  \ 和 `Validated`。 |\n| `MouseDoubleClick` | 当双击控件时发生。 |\n| `MouseDown` | 当鼠标指针在控件上并按了鼠标按键时发生。这与\
  \ `Click` 事件不同，因为 `MouseDown` 在按钮按下时立即发生，在释放之前发生。 |\n| `MouseMove` | 当鼠标在控件上移动时持续发生。\
  \ |\n| `MouseUp` | 当鼠标指针在控件上并释放鼠标按键时发生。 |\n\n**表 21-1** (#c21.xhtml_R_c21-tbl-0001)：常见控件事件\n\
  \n你将在本章的示例中看到其中许多事件。\n\n### 处理事件\n\n添加事件处理程序有两种基本方法。一种方法是使用属性窗口中的 `Events` 列表，如图\
  \ 21-3 所示，该列表会在你点击闪电按钮时显示。\n\n![属性窗口中 Events 列表的截图。](img/c21f003.png)\n\n**图 21-3**](#c21.xhtml_R_c21-fig-0003)\n\
  \n要为特定事件添加处理程序，请双击 `Events` 列表中事件名称右侧。这会将该事件添加到 XAML 标签中。处理该事件的方法签名将被添加到 C# 后代码文件中。\n\
  \n```xml\n <Button x:Name=\"rotatedButton\" Content=\"2nd Button\" Width=\"75\"\
  \ \n            Height=\"22\" FontWeight=\"Bold\" Margin=\"218,138,224,159\" \n\
  \            RenderTransformOrigin=\"0.5,0.5\" \n            Click=\"rotatedButton_Click\"\
  >\n\n      …\n    </Button>\nprivate void rotatedButton_Click(object sender, RoutedEventArgs\
  \ e)\n    {\n    }\n```\n\n你也可以直接在 XAML 中输入事件名称并在那里添加处理程序的名称。如果你这样做，Visual Studio\
  \ 将会在你输入时显示“新建事件处理程序”菜单。选择此项将赋予事件默认名称，并在后代码文件中创建处理程序。如果你手动输入名称，稍后可以右键点击事件并选择 `转到定义`\
  \ 以在代码中生成事件处理程序。\n\n### 路由事件\n\nWPF 使用称为 `路由事件`（routed events）的事件。标准的 `.NET` 事件由显式订阅它的代码处理，并且仅发送给那些订阅者。路由事件的不同之处在于，它可以将事件发送到控件所参与的层次结构中的所有控件。\n\
  \n路由事件可以在发生事件控件层次结构中向上和向下传递。因此，如果你右键点击按钮，`MouseRightButtonDown` 事件首先发送给按钮本身，然后发送给控件的父级——在前面的示例中，即\
  \ `Grid` 控件。如果未处理，则事件最终将发送到窗口。相反，如果你不想让事件继续向层次结构向上传递，只需将 `RoutedEventArgs` 属性 `Handled`\
  \ 设置为 `true`，此时将不会进行任何额外的调用。当事件像这样沿控件层次结构向上传递时，它被称为 `冒泡事件`（bubbling event）。\n\n\
  路由事件也可以沿另一个方向传递，即从根元素到执行操作的控件。这被称为 隧道事件`（tunneling event），按照习惯，所有此类事件都以单词 `Preview`\
  \ 为前缀，并且始终在其对应的冒泡事件之前发生。一个例子是 `PreviewMouseRightButtonDown` 事件。\n\n最后，路由事件的行为可以完全像普通的\
  \ `.NET` 事件，仅被发送到执行操作的控件。\n\n### 路由命令\n\n路由命令的作用与事件非常相似，它们都会导致某些代码的执行。事件直接绑定到 XAML\
  \ 中的单个元素和代码中的处理程序，而路由命令则更为复杂。\n\n事件和命令之间的关键区别在于它们的用法。每当你有一段代码必须响应在应用程序中仅一处发生的用户操作时，就应该使用事件。此类事件的示例可以是用户点击窗口中的“确定”以保存并关闭窗口时。当你有一段代码将执行以响应在多处发生的操作时，可以使用使用命令。这的示例是当保存应用程序内容时。通常有一个带有\
  \ `Save` 命令的菜单可以选择，以及用于相同目的的工具栏按钮。可以使用事件处理程序来实现这一点，但这意味着要在许多地方实现相同的代码。\n\n## 控件布局\n\
  \n到本章为止，你一直使用 `Grid` 元素来布局几个控件，主要是因为这是创建新的 WPF 时默认提供的控件。然而，你尚未检查该类的完整功能，也没有学习用于实现替代布局的其他布局容器。本节将更详细地查看控件布局，因为它是\
  \ WPF 的一个基本概念。\n\n### 基础布局概念\n\n在 WPF 中，你使用布局控件来协助窗口上项的布局。有很多这样的控件，但在开始使用它们之前，你应该了解一些基本概念以及\
  \ Visual Studio 提供的视觉辅助。\n\n#### 堆栈顺序\n\n\n\n\n当一个容器控件包含多个子控件时，它们按照特定的堆栈顺序（stack\
  \ order）进行绘制。你可能在绘图软件包中熟悉过这个概念。理解堆栈顺序最好的方法是：想象每个控件都放置在一块玻璃板上，而容器包含了这样一叠玻璃板。因此，容器的外观，就是你从顶部穿过这些玻璃层向下看时所看到的内容。容器包含的控件会相互重叠，所以你看到的内容取决于玻璃板的顺序。如果某个控件在堆栈中的位置较高，那么它就是你在重叠区域看到的控件。位于堆栈下方的控件可能会被上方的控件部分或完全遮挡。\n\
  \n这也会影响 `hit testing`（命中测试），例如当你用鼠标点击某个控件时。在考虑重叠的控件时，目标控件始终是堆栈中最上方的那个。控件的堆栈顺序由它们在容器子元素列表顺序决定。容器中的第一个子控件被放置在堆栈的最底层，最后一个子控件位于最顶层。第一个和最后一个子控件之间的控件被放置在越来越高的层上。控件的堆栈顺序对你可以在\
  \ WPF 中使用的某些布局控件还有额外影响，正如你很快将看到的。\n\n## 对齐、外边距、内边距和尺寸\n\n之前的示例使用了 `Margin`、`HorizontalAlignment`\
  \ 和 `VerticalAlignment` 属性在 `Grid` 容器中定位控件，但没有详细介绍它们的用法。你已经看到过如何使用 `Height` 和 `Width`\
  \ 来指定尺寸。这些属性加上你尚未查看过的 `Padding`，对所有的布局控件（或大多数布局控件，正如你将看到的）都是有用的，但用法各不相同。不同的布局控件还可以为这些属性设置默认值。你将在后续章节中通过示例看到很多内容，但在那之前，介绍一下基础知识是值得的。\n\
  \n两个对齐属性 `HorizontalAlignment` 和 `VerticalAlignment` 决定了控件的对齐方式。`HorizontalAlignment`\
  \ 可以设置为 `Left`、`Right`、`Center` 或 `Stretch`。`Left` 和 `Right` 倾向于将控件位于容器的左边缘或右边缘，`Center`\
  \ 将控件置在中间，`Stretch` 则改变控件的宽度，使其边缘延伸到容器的两侧。`VerticalAlignment` 情况类似，其值为 `Top`、`Bottom`、`Center`\
  \ 或 `Stretch`。\n\n`Margin` 和 `Padding` 分别指定控件边缘周围和控件边缘内部的空白区域。之前的示例使用 `Margin` 相对于窗口边缘定位控件。这之所以奏效，是因为当\
  \ `HorizontalAlignment` 设置为 `Left` 且 `VerticalAlignment` 设置为 `Top` 时，控件紧贴左上角定位，而\
  \ `Margin` 在控件边缘周围插入了间隙。`Padding` 的用法类似，但它是将控件的内容与其边缘隔离开来。这对于 `Border` 来说特别有用，正如你将在下一节中看到的。`Padding`\
  \ 和 `Margin` 都可以以四部分的形式（格式为 `leftAmount`、`topAmount`、`rightAmount`、`bottomAmount`）或单个值（一个\
  \ `Thickness` 值）指定。\n\n之后你将看到 `Height` 和 `Width` 经常由其他属性控制。例如，当 `HorizontalAlignment`\
  \ 设置为 `Stretch` 时，控件的 `Width` 属性会随着容器宽度的变化而变化。\n\n## Border\n\n`Border` 控件是一种非常简单且实用的容器控件。它包含单个子控件，而不是像你稍后将看到的更复杂的控件那样的多个子控件。该子控件的大小将调整为完全填充\
  \ `Border` 控件。这看起来可能并不特别有用，但请记住你可以使用 `Margin` 和 `Padding` 属性在容器内定位 `Border`，并在 `Border`\
  \ 边缘内定位 `Border` 的内容。你还可以设置（例如）`Border` 的 `Background` 属性使其可见。你很快就会看到该控件的运行。\n\n\
  ## 视觉调试工具\n\n当你以调试模式运行 WPF 应用时，Visual Studio 在窗口顶部居中位置会覆盖一个小小的 4 点菜单。四个菜单项中的三个用于切换调试功能的开启，剩余的一个项打开\
  \ Live Visual Tree（实时视觉树）。接下来的“尝试一试”将继续上一个示例并演示视觉工具。\n\n## 布局面板\n\n所有内容布局控件都派自抽象的\
  \ `Panel` 类。该类简单地定义了一个可以包含派自 `UIElement` 对象集合的容器。所有的 WPF 控件都派自 `UIElement`。你不能直接使用\
  \ `Panel` 类进行控件布局，但如果你需要，可以从它派生。或者，你可以使用派自 `Panel` 的某个布局控件。表 21-2 描述了最常见的面板。\n\n\
  | PANEL | DESCRIPTION |\n| --- | --- |\n| `Canvas` | 此控件允许你按任何需要定位子控件。它对子控件的定位没有任何限制，也不提供任何定位帮助。\
  \ |\n| `DockPanel` | 此控件允许你将子控件停靠在其四个边缘之一。最后一个子控件填充剩余空间。 |\n| `Grid` | 此控件允许对子控件进行灵活定位。你可以将此控件的布局划分为行和列，从而允许在网格布局中对齐控件。\
  \ |\n| `StackPanel` | 此控件按水平或垂直布局对其子控件进行顺序定位。 |\n| `WrapPanel` | 此控件按水平或垂直布局对其子控件进行定位，相对于\
  \ StackPanel 的单行或单列，该控件将其元素换行到多行或多列。 |\n\n## Canvas\n\n`Canvas` 控件提供了完全的定位自由。关于\
  \ `Canvas` 的另一点是，与子元素配合 `HorizontalAlignment` 和 `VerticalAlignment` 属性对定位没有影响。\n\
  \n你可以使用 `Margin` 在 `Canvas` 中定位元素，正如之前的示例中所示，但更好的方法是使用 `Canvas` 类暴露的 `Canvas.Left`、`Canvas.Top`、`Canvas.Right`\
  \ 和 `Canvas.Bottom` 附加属性：\n\n```\n<Canvas>\n  <Button Canvas.Top=\"10\" Canvas.Left=\"\
  10\">Button1</Button>\n</Canvas>\n```\n\n上述代码将 `Button` 定位，使其顶边缘距离 `Canvas` 的顶边缘\
  \ 10 像素，左边缘距离 `Canvas` 的左边缘 10 像素。注意，`Top` 和 `Left` 属性的优先级高于 `Bottom` 和 `Right`。例如，如果你同时指定了\
  \ `Top` 和 `Bottom`，则 `Bottom` 属性将被忽略。\n\n图 21-4 显示在 `Canvas` 控件中定位的两个 `Rectangle`\
  \ 控件，窗口调整了两种大小。\n\n![在 Canvas 控件中定位的两个 Rectangle 控件，窗口调整了两种大小的截图。](img/c21f004.png)\n\
  \n**FIGURE 21-4** 一个 `Rectangle` 相对于左上角定位，另一个相对于右下角定位。当你调整窗口大小时，这些相对位置会被保持。你还可以看到\
  \ `Rectangle` 控件堆栈顺序的重要性。右下角的 `Rectangle` 在堆栈顺序中较高，所以当它们重叠时，你的是这个控件。\n\n此示例的代码如下（你可以在可下载的代码\
  \ `LayoutExamples\\Canvas.xaml` 中找到它）：\n\n\n\n\n\n```\n<Window x:Class=\"LayoutExamples.Canvas\"\
  \n        xmlns=\"http://schemas.microsoft.com/winfx/2006/xaml/presentation\"\n\
  \        xmlns:x=\"http://schemas.microsoft.com/winfx/2006/xaml\"\n        xmlns:d=\"\
  http://schemas.microsoft.com/expression/blend/2008\"\n        xmlns:mc=\"http://schemas.openxmlformats.org/markup-compatibility/2006\"\
  \n        xmlns:local=\"clr-namespace:LayoutExamples\"\n        mc:Ignorable=\"\
  d\"\n        Title=\"Canvas\" Height=\"300\" Width=\"300\">\n    <Canvas Background=\"\
  AliceBlue\">\n        <Rectangle Canvas.Left=\"50\" Canvas.Top=\"50\" Height=\"\
  40\" Width=\"100\"\n    Stroke=\"Black\" Fill=\"Chocolate\"/>\n        <Rectangle\
  \ Canvas.Right=\"50\" Canvas.Bottom=\"50\" Height=\"40\" Width=\"100\"\n    Stroke=\"\
  Black\" Fill=\"Bisque\"/>\n    </Canvas>\n</Window>\n```\n\n#### DockPanel\n\n`DockPanel`\
  \ 控件顾于名，允许你将控件停靠到它的边缘。这种布局对你来说应该很熟悉，即使你以前从未停下来注意过它。例如，Word 中的 `Ribbon` 控件是如何留在 Word\
  \ 窗口顶部的，或者 Visual Studio 中的各种窗口是如何定位的。在 Visual Studio 中，你还可以通过拖动窗口来更改窗口的停靠位置。\n\n\
  `DockPanel` 有一个附加属性，子控件可以使用该属性来指定控件停靠的边缘：`DockPanel.Dock`。你可以将此属性设置为 `Left`、`Top`、`Right`\
  \ 或 `Bottom`。\n\n控件在 `DockPanel` 中的堆叠顺序至关重要，因为每当你将一个控件停靠到边缘时，都会减少后续子控件的可用空间。例如，你可能会将一个工具栏停靠在\
  \ `DockPanel` 的顶部，然后将第二个工具栏停靠在 `DockPanel` 的左侧。第一个控件将横跨整个 `DockPanel` 显示区域的顶部，但第二个控件将仅从第一个工具栏的底部延伸到\
  \ `DockPanel` 底部（沿左边缘）。\n\n你指定的最后一个子控件（通常）将填充所有之前的子控件定位后剩余的区域。（你可以控制这种行为，这就是为什么这个说法带有限定条件的。）\n\
  \n当你在 `DockPanel` 中放置控件时，控件占据的区域可能小于为该控件保留的 `DockPanel` 区域。例如，如果你将一个 `Width` 为 `100`、`Height`\
  \ 为 `50` 且 `HorizontalAlignment` 为 `Left` 的 `Button` 停靠在 `DockPanel` 的顶部，那么 `Button`\
  \ 右侧将会有其他停靠子控件使用的空间。此外，如果 `Button` 控件具有 `20` 的 `Margin`，则 `DockPanel` 顶部将共预留 90\
  \ 像素（控件的高度加上顶部和底部的边距）。在用 `DockPanel` 进行布局时，你需要考虑这种行为；否则，可能会导致意外的结果。\n\n图 21-5 显示了一个示例\
  \ `DockPanel` 布局。\n\n![示例 DockPanel 布局的快照。](img/c21f005.png)\n\n**图 21-5**](#c21.xhtml_R_c21-fig-0005)\n\
  \n该布局的代码如下（你可以在可下载的代码 `LayoutExamples\\DockPanels.xaml` 中找到它）：\n\n```\n<Window x:Class=\"\
  LayoutExamples.DockPanels\"\n        xmlns=\"http://schemas.microsoft.com/winfx/2006/xaml/presentation\"\
  \n        xmlns:x=\"http://schemas.microsoft.com/winfx/2006/xaml\"\n        xmlns:d=\"\
  http://schemas.microsoft.com/expression/blend/2008\"\n        xmlns:mc=\"http://schemas.openxmlformats.org/markup-compatibility/2006\"\
  \n        xmlns:local=\"clr-namespace:LayoutExamples\"\n        mc:Ignorable=\"\
  d\"\n        Title=\"DockPanels\" Height=\"300\" Width=\"500\">\n    <DockPanel\
  \ Background=\"AliceBlue\">\n        <Border DockPanel.Dock=\"Top\" Padding=\"10\"\
  \ Margin=\"5\"\n    Background=\"Aquamarine\" Height=\"45\">\n            <Label>1)\
  \ DockPanel.Dock=\"Top\"</Label>\n        </Border>\n        <Border DockPanel.Dock=\"\
  Top\" Padding=\"10\" Margin=\"5\"\n    Background=\"PaleVioletRed\" Height=\"45\"\
  \ Width=\"200\">\n            <Label>2) DockPanel.Dock=\"Top\"</Label>\n       \
  \ </Border>\n        <Border DockPanel.Dock=\"Left\" Padding=\"10\" Margin=\"5\"\
  \n    Background=\"Bisque\" Width=\"200\">\n            <Label>3) DockPanel.Dock=\"\
  Left\"</Label>\n        </Border>\n        <Border DockPanel.Dock=\"Bottom\" Padding=\"\
  10\" Margin=\"5\"\n    Background=\"Ivory\" Width=\"200\" HorizontalAlignment=\"\
  Right\">\n            <Label>4) DockPanel.Dock=\"Bottom\"</Label>\n        </Border>\n\
  \        <Border DockPanel.Dock=\"Bottom\" Padding=\"10\" Margin=\"5\"\n    Background=\"\
  Blue\">\n            <Label>5) DockPanel.Dock=\"Bottom\"</Label>\n        </Border>\n\
  \    </DockPanel>\n</Window>\n```\n\n此代码使用 `DockPanel` 清晰地标记了：\n1. `DockPanel.Dock=\"\
  Top\"`\n2. `DockPanel.Dock=\"Top\"`\n3. `DockPanel.Dock=\"Left\"`\n4. `DockPanel.Dock=\"\
  Bottom\"`\n5. `DockPanel.Dock=\"Bottom\"`\n\n\n\n\n\n图 21-6\n\n此处使用的代码如下（你可以在可下载的代码\
  \ `LayoutExamples\\StackPanels.xaml` 中找到它）：\n\n```\n<Window x:Class=\"LayoutExamples.StackPanels\"\
  \n        xmlns=\"http://schemas.microsoft.com/winfx/2006/xaml/presentation\"\n\
  \        xmlns:x=\"http://schemas.microsoft.com/winfx/2006/xaml\"\n        xmlns:d=\"\
  http://schemas.microsoft.com/expression/blend/2008\"\n        xmlns:mc=\"http://schemas.openxmlformats.org/markup-compatibility/2006\"\
  \n        xmlns:local=\"clr-namespace:LayoutExamples\"\n        mc:Ignorable=\"\
  d\"\n        Title=\"StackPanels\" Height=\"300\" Width=\"300\">\n    <Grid>\n \
  \       <StackPanel HorizontalAlignment=\"Left\" Height=\"128\" VerticalAlignment=\"\
  Top\"\n Width=\"284\" Orientation=\"Horizontal\">\n            <Button Content=\"\
  Button\" Height=\"128\" VerticalAlignment=\"Top\" \n                    Width=\"\
  75\"/>\n            <Button Content=\"Button\" Height=\"128\" VerticalAlignment=\"\
  Top\" \n                    Width=\"75\"/>\n            <Button Content=\"Button\"\
  \ Height=\"128\" VerticalAlignment=\"Top\" \n                    Width=\"75\"/>\n\
  \        </StackPanel>\n        <StackPanel HorizontalAlignment=\"Left\" Height=\"\
  128\" VerticalAlignment=\"Top\"\n Width=\"284\" Margin=\"0,128,0,0\" Orientation=\"\
  Vertical\">\n            <Button Content=\"Button\" HorizontalAlignment=\"Left\"\
  \ Width=\"284\"/>\n            <Button Content=\"Button\" HorizontalAlignment=\"\
  Left\" Width=\"284\"/>\n            <Button Content=\"Button\" HorizontalAlignment=\"\
  Left\" Width=\"284\"/>\n        </StackPanel>\n    </Grid>\n    </Window>\n```\n\
  \n### WrapPanel\n\n`WrapPanel` 本质上是 `StackPanel` 的扩展版本；“无法容纳”的控件会被移动到额外的行（或列）。图\
  \ 21-7 显示了一个包含多个形状的 `WrapPanel` 控件，该窗口被调整为两种大小。\n\n![包含多个形状的 WrapPanel 控件快照，窗口已调整为两种大小。](img/c21f007.png)\n\
  \n图 21-7\n\n实现此效果的代码在此处（你可以在可下载的代码 `LayoutExamples\\WrapPanel.xaml` 中找到它）：\n\n```\n\
  <Window x:Class=\"LayoutExamples.WrapPanel\"\n        xmlns=\"http://schemas.microsoft.com/winfx/2006/xaml/presentation\"\
  \n        xmlns:x=\"http://schemas.microsoft.com/winfx/2006/xaml\"\n        xmlns:d=\"\
  http://schemas.microsoft.com/expression/blend/2008\"\n        xmlns:mc=\"http://schemas.openxmlformats.org/markup-compatibility/2006\"\
  \n        xmlns:local=\"clr-namespace:LayoutExamples\"\n        mc:Ignorable=\"\
  d\"\n        Title=\"WrapPanel\" Height=\"92\" Width=\"260\">\n    <WrapPanel Background=\"\
  AliceBlue\">\n        <Rectangle Fill=\"#FF000000\" Height=\"50\" Width=\"50\" Stroke=\"\
  Black\"\n    RadiusX=\"10\" RadiusY=\"10\"/>\n        <Rectangle Fill=\"#FF111111\"\
  \ Height=\"50\" Width=\"50\" Stroke=\"Black\"\n    RadiusX=\"10\" RadiusY=\"10\"\
  />\n        <Rectangle Fill=\"#FF222222\" Height=\"50\" Width=\"50\" Stroke=\"Black\"\
  \n    RadiusX=\"10\" RadiusY=\"10\"/>\n        <Rectangle Fill=\"#FFFFFFFF\" Height=\"\
  50\" Width=\"50\" Stroke=\"Black\"\n    RadiusX=\"10\" RadiusY=\"10\"/>\n    </WrapPanel>\n\
  \    </Window>\n```\n\n`WrapPanel` 控件是创建动态布局的一种极方法，允许用户精确控制内容的查看方式。\n\n### Grid\n\
  \n`Grid` 控件可以具有多行多列，你可以用它们来布局子控件。在本章中你已经使用过多次 `Grid` 控件，但在所有情况下，你使用的都是具有单行单列的 `Grid`。要添加更多行和列，你必须使用\
  \ `RowDefinitions` 和 `ColumnDefinitions` 属性，它们分别是 `RowDefinition` 和 `ColumnDefinition`\
  \ 对象的集合，并使用属性元素语法进行指定：\n\n```\n<Grid>\n  <Grid.RowDefinitions>\n    <RowDefinition/>\n\
  \    <RowDefinition/>\n  </Grid.RowDefinitions>\n  <Grid.ColumnDefinitions>\n  \
  \  <ColumnDefinition/>\n    <ColumnDefinition/>\n  </Grid.ColumnDefinitions>\n …\n\
  \  </Grid>\n```\n\n此代码定义了一个具有两行两列的 `Grid` 控件。注意，这里不需要额外的信息；通过这段代码，每行和每列都会随着 `Grid`\
  \ 控件的大小调整而自动调整大小。每行的高度将是 `Grid` 高度的一半，每列的也是一半。你可以通过设置 `ShowGridlines` 属性在 `Grid`\
  \ 的单元格之间显示线条。\n\n## 游戏客户端\n\n现在你已经了解了使用 WPF 和 Visual Studio 的基础，是时候开始使用控件创建一些实用的东西了。本章的剩余部分将致力于为你之前的章节中开发的游戏编写游戏客户端。在本章中，你将编写游戏的辅助对话框——包括关于、选项和新游戏窗口。\n\
  \n### 关于窗口\n\n关于窗口（有时称为关于对话框）用于显示有关应用程序开发者以及应用程序本身的信息。某些关于窗口非常复杂，例如 Microsoft Office\
  \ 程序和 Visual Studio 中的窗口，并显示版本和许可信息。关于窗口通常可以通过帮助菜单访问，它通常是列表的最后一项。\n\n图 21-9 显示了你即将创建的完成对话框的截图。\n\
  \n![即将创建的完成对话框截图](img/c21f009.png)\n\n#### 设计界面\n\n关于窗口不是用户经常看到的东西。事实上，它通常位于帮助菜单的原因是，它通常在用户需要查找应用程序版本信息或在出现问题时需要联系人时才被使用。但这也意味着用户访问它时是有特定目的的，如果你在应用程序中包含了这样的窗口，你应该认真对待它。\n\
  \n\n\n\n\n每当你设计应用程序时，都应该努力保持外观和感受尽可能一致。这意味着你应该坚持使用几种选定的颜色，并在应用程序的所有地方相同的相同的样式。在\
  \ Ben's Cards 案例中，你将使用三种主颜色——红色、黑色和白色。\n\n如果你查看图 21-9，你会发现窗口的左上角由 Wrox Press 的 Logo\
  \ 占据。你之前没有使用过图像，但为你的应用程序添加一些精选的图像可以使用户界面看起来更专业。\n\n## 图像控件\n\n`Image` 是一个非常简单的控件，可以产生很好的效果。它允许你显示单张图像，并根据需要调整图像的大小。该控件暴露了两个关键属性，如表\
  \ 21-3 所示。\n\n| 属性 | 描述 |\n| --- | --- |\n| `Source` | 使用此属性指定图像的位置。可以是磁盘上的位置，也可以网络上的某个地方。正如你在本章稍后将看到的，还可以创建一个静态资源并将其作为源。\
  \ |\n| `Stretch` | 实际上，图像大小恰好符合你的需求是非常罕见的，有时随着应用程序窗口的调整，图像的大小也必须改变。你可以使用此属性来控制图像的行为。有四种可能性：`None`——图像不调整大小。`Fill`——图像调整大小以填充整个空间。这可能会导致图像扭曲。`Uniform`——图像保持其宽高比，如果填充可用空间会改变纵横比，则不填充。`UniformToFill`——图像保持其纵横比并填充可用空间。如果保持比例意味着图像的某些对于可用空间太大，则图像将被裁剪以适应。\
  \ |\n\n**表 21-3****:** 图像控件属性\n\n## 标签控件\n\n你已经在之前的某些示例中见过这个最简单的控件了。它向用户显示简单的文本信息，并在某些情况下传达有关快捷键的信息。该控件使用\
  \ `Content` 属性来显示其文本。`Label` 控件在单行显示文本。如果你在字母前加上一个下划线字符“_”，该字母将变为下划线，然后就可以通过使用带前缀字母和\
  \ Alt 直接访问控件了。例如，`_Name` 为任何紧跟在标签后面的控件分配快捷键 Alt+N。\n\n## TextBlock 控件\n\n与 `Label`\
  \ 类似，此控件显示带有任何复杂格式的简单文本。与 `Label` 不同，`TextBlock` 控件能够显示多行文本。无法对文本的各个部分进行格式设置。\n\n\
  即使文本无法放入分配给控件的空间，`TextBlock` 也会显示文本。在这种情况下，控件本身不提供任何滚动条，但在需要时，可以将其包装在一个实用的视图控件中：`ScrollViewer`。\n\
  \n## 按钮控件\n\n与 `Label` 控件一样，你已经见过很多 `Button` 控件。该控件无处不在，在用户界面上易于识别。你的用户会期望通过左键点击它来执行操作——不多，也不少。改变这种行为很可能导致糟糕的界面设计并让用户沮丧。\n\
  \n默认情况下，按钮显示单行短文本或描述点击它时会发生情况的图像。\n\n按钮不包含任何显示图像或文本的属性，但你可以使用 `Content` 属性显示简单文本，或者在内容中嵌入一个\
  \ `Image` 控件来显示图像。你可以在下载的代码 `Ch21Ex01\\ImageButton.xaml` 中找到这段代码：\n\n```\n<Button\
  \ HorizontalAlignment=\"Left\" VerticalAlignment=\"Top\" Width=\"75\" Margin=\"\
  10\">\n      <StackPanel Orientation=\"Horizontal\">\n        <Image Source=\".\\\
  Images\\Delete_black_32x32.png\" Stretch=\"UniformToFill\" \nWidth=\"16\" Height=\"\
  16\"/>\n        <TextBlock>Delete</TextBlock>\n      </StackPanel>\n         </Button>\n\
  ```\n\n图 21-10 显示带有文本和图像的删除按钮。\n\n![带有文本和图像的删除按钮截图。](img/c21f010.png)\n\n**图 21-10**\n\
  \n## 选项窗口\n\n你将创建的下一个窗口是选项窗口。此窗口将允许玩家设置若干改变游戏性的的参数。它还将允许你使用你尚未使用的某些控件：`CheckBox`、`RadioButton`、`ComboBox`、`TextBox`\
  \ 和 `TabControl` 控件。\n\n图 21-11 显示了选择了第一个标签页的窗口。乍看之下窗口非常像“关于”窗口，但此窗口上有更多可以要做。\n\n\
  ![选择了第一个标签页的窗口截图。](img/c21f011.png)\n\n**图 21-11**\n\n## TextBox 控件\n\n在本章之前的章节，你已经使用了\
  \ `Label` 和 `TextBlock` 控件。这些控件专门用于显示文本。`TextBox` 控件允许用户在应用程序中输入文本。虽然它可以仅显示文本，如果你决定要显示文本，请确保将\
  \ `IsReadOnly` 属性设置为 `false`。你可以使用表 21-4 所示的若干属性来控制如何显示和输入 `TextBox` 中的文本。\n\n|\
  \ 属性 | 描述 |\n| --- | --- |\n| `Text` | TextBox 中当前显示的文本。 |\n| `IsEnabled` | 当设置为\
  \ `true` 时，用户可以编辑文本。设置为 `false` 时，文本呈灰色且用户无法赋予焦点。 |\n| `IsReadOnly` | 当设置为 `true`\
  \ 时，用户可以复制 TextBox 中的文本但不能修改它。 |\n| `TextWrapping` | 有时你希望 TextBox 只显示单行文本。在这种情况下，你可以将此属性设置为\
  \ `NoWrap`。这是默认值。如果你希望文本分多行显示，可以设置为 `Wrap` 或 `WrapWithOverflow`。`Wrap` 会导致超出框边界的文本移动到下一行。`WrapWithOverflow`\
  \ 在某些情况下允许非常长的词超出边界。 |\n| `VerticalScrollBarVisibility` | 如果你的 TextBox 允许用户输入多行文本，那么用户可能会输入超出框边缘的文本。在这种情况下，显示滚动条是一个好主意。如果你只想在文本过长无法显示时显示滚动条，请设置为\
  \ `Auto`。设置为 `Visible` 则始终显示，`Hidden` 或 `Disabled` 则永远不显示滚动条。 |\n| `AcceptsReturn`\
  \ | 此属性控制如何向控件输入文本。如果你将其设置为 `false`（默认值），则用户无法通过 Return 键换行。这也会影响默认按钮。如果存在默认按钮且你在文本框获得焦点时按下\
  \ Return，它要么会输入新行，要么会触发默认按钮。 |\n\n## CheckBox 控件\n\n\n\n\n\n`CheckBox` 控件为用户提供了可以选择或清除的选项。如果你想向用户展示一个可以开启或关闭的选项，或者希望用户对某个问题回答“是”或“否”，那么就应该使用\
  \ `CheckBox`。例如，在“选项”（Options）对话框中，你希望用户决定是否与电脑对战。为此，使用了一个文本为“与电脑对战”（Play Against\
  \ Computer）的 `CheckBox`。\n\n`CheckBox` 设计作为一个单一实体使用，不受视图上其他 `CheckBox` 控件的影响。你有时会看到\
  \ `CheckBox` 控件以相互链接的方式使用，使得选择其中一个会导致另一个被清空，但这并不是该控件的意图用途。如果你需要此功能，应该使用在下一节描述的 `RadioButton`。\n\
  \n`CheckBox` 控件还可以显示第三种状态，称为“不确定”（indeterminate），用于表示无法回答“是”或“否”的问题。当 `CheckBox`\
  \ 用于显示关于其他某物的信息时，这种状态很常见。例如，`CheckBox` 控件有时用于指示树形视图中的所有子节点是否都被选中。在这种情况下，如果所有节点都被选中，则\
  \ `CheckBox` 被选中；如果一个都没有选中，则被清空；如果部分选中但未全部选中，则为为不确定状态。\n\n表 21-5 列出了常用于控制 `CheckBox`\
  \ 控件的属性。\n\n| 属性 | 说明 |\n| --- | --- |\n| `Content` | CheckBox 是一个 `Content` 控件，因此其显示可以被高度自定义。在\
  \ `Content` 属性上添加文本会产生默认视图。 |\n| `IsThreeState` | 用于指示控件是否可以有两个或三个状态。默认值为 `false`，意味着只存在两个可能的值。\
  \ |\n| `IsChecked` | 该值是 `true` 或 `false`。默认情况下，设置为 `true` 会显示复选标记。如果 `IsThreeState`\
  \ 为 `true`，则可能是 `null`，表示状态为不确定。 |\n\n**表 21-5**](#c21.xhtml_R_c21-tbl-0005): CheckBox\
  \ 属性\n\n### RadioButton 控件\n\n`RadioButtons` 与其他 `RadioButton` 控件配合使用，允许用户在多个选项中进行选择，且任何时候只能选择其中一个。当你希望用户回答一个具有非常有限可能值的问题时，应该使用\
  \ `RadioButton` 控件。如果可能的值超过四个或五个，你应该考虑使用 `ListBox` 或 `ComboBox` 代替。在稍后你将创建的“选项”窗口中，用户可以选择电脑玩家的技能水平。有三个选项：愚蠢（Dumb）、良好（Good）和作弊（Cheats）。在任何时刻都应该只选择一个。\n\
  \n当在同一个视图中显示多个 `RadioButton` 时，它们默认会相互感知，一旦选中了任何一个，所有其他的都会被清空。如果你在同一个视图中有多个不相关的\
  \ `RadioButton` 控件，可以将它们分组，以避免控件清空不相关控件的值。\n\n你可以通过表 21-6 中列出的属性来控制 `RadioButton`。\n\
  \n| 属性 | 说明 |\n| --- | --- |\n| `Content` | RadioButtons 是 `Content` 控件，因此可以修改其显示内容。默认情况下，你在\
  \ `Content` 中输入文本（字符串）。 |\n| `IsChecked` | 该值是 `true` 或 `false`。如果 `IsThreeState`\
  \ 为 `true`，则可能是 `null`，表示状态为不确定。 |\n| `GroupName` | 控件所属组的名称。默认情况下此为空，任何没有 `GroupName`\
  \ 的 RadioButton 控件都被视为同一组。 |\n\n**表 21-6**](#c21.xhtml_R_c21-tbl-0006): RadioButton\
  \ 属性\n\n### ComboBox 控件\n\n与 `RadioButton` 控件类似，`ComboBox` 控件允许用户选择选择一个选项。然而，`ComboBox`\
  \ 控件在两个方面本质不同：\n\n*   `ComboBox` 控件在下拉列表中显示可能的选择。\n*   可以允许用户输入新值。\n\n`ComboBox`\
  \ 控件通常用于显示长值列表，例如国家或州名称，但它们也可用于许多目的。在“选项”对话框中，一个 `ComboBox` 用于显示一个列表，用户可以从列表中选择玩家人数。尽管这也可以通过\
  \ `Slider` 或一组 `RadioButton` 控件来实现，但使用 `ComboBox` 可以节省视图中的空间。\n\n`ComboBox` 可以更改为在顶部带有一个\
  \ `TextBox` 来显示自身，允许用户输入他们认为缺失的任何值。本章的练习之一要求你向“选项”对话框添加一个 `ComboBox`，用户可以在其中输入他们的名字，也可以从列表中选择。\n\
  \n这两个属性——`IsReadOnly` 和 `IsEditable`——对于控件的框非常重要，它们共同工作为用户提供了四种选择值的方式（见表 21-7](#c21.xhtml_c21-tbl-0007)）。\n\
  \n| | IsReadOnly TRUE | IsReadOnly FALSE |\n| --- | --- | --- |\n| IsEditable 为\
  \ `true` | `TextBox` 显示但控件不会对按键做出反应。如果选择了项，则 `TextBox`。 | `TextBox` 显示且用户可以输入任何。\
  \ |\n| IsEditable 为 `false` | 当 IsEditable 为 `false` 时，`IsReadOnly` 不产生影响，因为 `TextBox`。\
  \ | `TextBox` 显示但用户可以从列表中选择。 |\n\n**表 21-7**](#c21.xhtml_R_c21-tbl-0007): IsReadOnly\
  \ 和 IsEditable 的组合\n\n`ComboBox` 是一个 `Items` 控件，这意味着你可以向它添加多个项目。表 21-8 显示了 `ComboBox`\
  \ 的额外属性。\n\n| COMBOBOX 属性 | 说明 |\n| --- | --- |\n| `Text` | 代表 ComboBox 头部显示的文本。它是列表中的元素，或者是用户输入的新字符串。\
  \ |\n| `SelectedIndex` | 代表列表中选中项的索引。如果为 -1，则表示没有选中项。如果用户输入了列表中不存在的内容，情况也是如此。 |\n\
  | `SelectedItem` | 代表列表的实际项目，而不仅仅是索引或文本。如果没有选中项或用户输入了新内容，则返回 `null`。 |\n\n**表 21-8**](#c21.xhtml_R_c21-tbl-0008):\
  \ 其他 ComboBox 属性\n\n### TabControl 控件\n\n`TabControl` 与本节介绍的其他控件有本质不同。它是一种布局控件，用于对可以通过点击选择的页面进行分组。\n\
  \n`TabControl` 用于当你需要在单个窗口中显示大量信息，但又不想让视图过于混乱时。在这种情况下，你应该将信息分为相关项目的组，并为每个组创建一个单独的页面。通常情况下，你不应该允许一个页面上的控件影响另一个页面上的控件。即使你这样做这样做，用户也不会意识到另一个页面发生了什么变化，当设置在背后变化时，他们会感到困惑。\n\
  \n默认情况下，每个页面由 `TabItem` 控件构建，这些控件默认由单个 `Grid` 控件填充，但你可以根据需要将 `Grid` 更改为任何其他控件。在每个标签页上，你都可以布局\
  \ UI，并通过选择 `TabItems` 在标签页之间切换。\n\n\n\n\n\n# 在选项窗口中处理事件\n\n目前该窗口看起来很正常，用户甚至可以对其进行一些操作，尽管在更改设置时不会发生任何变化。用户期望他们选择的选项能被应用程序存储并使用。你可以通过存储窗口中控件的值来实现这一点，但这种方法并不灵活，并且会将应用程序的数据与\
  \ GUI 混合在一起，这并不是一个好主意。相反，你应该创建一个类来存储用户所的选择。\n\n在接下来的“尝试一试”（Try It Out）中，你将为选项窗口添加事件处理程序，这些程序会在用户与控件交互时执行。\n\
  \n## 数据绑定\n\n数据绑定是一种以声明式方式将控件与数据连接的方法。在选项窗口中，你处理了 `RadioButtons` 的 `Checked` 事件，以便设置\
  \ `GameOptions` 类中 `ComputerSkillLevel` 属性的值。这种方法运行良好，可以使用代码和事件处理来设置窗口中的所有值，但很多情况下，直接将控件的属性绑定到数据更好。\n\
  \n一个绑定由四个部分组成：\n\n*   绑定目标（binding target），指定使用绑定的对象\n*   目标属性（target property），指定要设置的属性\n\
  *   绑定源（binding source），指定绑定所使用的对象\n*   源属性（source property），指定哪个属性持有数据\n\n你并不总是显式地设置所有元素；特别是绑定目标，通常通过你正在为控件上的属性设置绑定这一事实隐式指定。\n\
  \n绑定源总是需要设置以使绑定生效，但它可以通过多种方式进行设置。在接下来的章节中，你将看到从源绑定数据的方法方法。\n\n### DataContext\n\n\
  `DataContext` 控件定义了一个数据源，该源可以用于该元素的所有后代元素上的数据绑定。你通常会有一个类的实例，它持有视图中使用的大部分数据。如果是这种情况，你可以将窗口的\
  \ `DataContext` 设置为该对象的实例，从而使能够在视图中绑定该类中的属性。这在“动态绑定到外部对象”部分有所演示。\n\n### 绑定到本地对象\n\
  \n只要编译器能够找到该对象，你就可以绑定到任何包含所需数据的 .NET 对象。如果与使用该对象的控件相同的上下文中（即相同的 XAML 块）找到该对象，你可以通过设置绑定的\
  \ `ElementName` 属性来指定绑定源。看看选项窗口中这个更改过的 `ComboBox`：\n\n```xml\n<ComboBox HorizontalAlignment=\"\
  Left\" Margin=\"196,58,0,0\" VerticalAlignment=\"Top\" \nWidth=\"86\" Name=\"numberOfPlayersComboBox\"\
  \ SelectedIndex=\"0\" \nIsEnabled=\"{Binding ElementName=playAgainstComputerCheck,\
  \ Path=IsChecked}\">\n```\n\n注意 `IsEnabled` 属性。现在不是指定 `true` 或 `false`，而是在大括号内有一段长文本。这种指定属性值的方法称为*标记扩展语法*（markup\
  \ extension syntax），它是指定属性的简写。同样的的内容也可以写成这样：\n\n```xml\n <ComboBox HorizontalAlignment=\"\
  Left\" Margin=\"196,58,0,0\" \nVerticalAlignment=\"Top\" Width=\"86\" Name=\"numberOfPlayersComboBox\"\
  \ \nSelectedIndex=\"0\">\n              <ComboBox.IsEnabled>\n                <Binding\
  \ ElementName=\"playAgainstComputerCheck\" \nPath=\"IsChecked\"/>\n            \
  \  </ComboBox.IsEnabled>\n```\n\n这两个示例都将绑定源设置为 `playAgainstComputerCheck` CheckBox。源属性通过\
  \ `Path` 被指定为 `IsChecked` 属性。\n\n绑定目标被设置为 `IsEnabled` 属性。这两个示例都是通过将绑定指定为属性的内容来实现的——它们只是使用了不同的语法。最后，绑定目标通过绑定是在\
  \ `ComboBox` 上完成这一事实隐式指定。\n\n此示例中的绑定根据 `CheckBox` 的 `IsChecked` 属性的值设置或清除 `ComboBox`\
  \ 的 `IsEnabled` 属性。结果是在没有任何代码的情况下，当用户更改 `CheckBox` 的值时，`ComboBox` 会启用或禁用。\n\n###\
  \ 外部对象的静态绑定\n\n通过指定将某个类作为 XAML 中的资源，可以动态创建对象实例。这是通过向 XAML 添加命名空间以便定位该类，然后在 XAML\
  \ 中的某个元素上将该类声明为资源来实现。\n\n接下来的“尝试一试”展示了如何在你想要数据绑定的对象的父元素上创建资源引用。\n\n### 动态绑定到外部对象\n\
  \n现在你可以绑定到根据需要提供某些数据而动态创建的对象。如果你已经有一个想要用于数据绑定的实例化对象怎么办？在这种，你需要在代码中做一些连接工作。\n\n在选项窗口的情况下，你不希望在每次打开窗口时都清除选项，并且你希望用户所做的选择持久化并在应用程序的其他部分使用。\n\
  \n在接下来的“尝试一试”中，你将 `DataContext` 设置为 `GameOptions` 类的实例，这允许你使用该类属性的动态绑定。\n\n## 使用\
  \ ListBox 控件启动游戏\n\n你现在只差一个窗口就可以创建游戏中的所有支持窗口了。在创建游戏板之前的最后一个窗口是玩家可以在其中添加新玩家并选择参与新游戏的玩家的窗口。此窗口将使用\
  \ `ListBox` 来显示玩家名称。\n\n`ListBox` 和 `ComboBox` 控件通常可以用于目的，但 `ComboBox` 通常允许你选择单条目，而\
  \ `ListBox` 控件通常允许用户选择多个项目。另一个关键区别是 `ListBox` 将其内容显示在始终展开的列表中。这意味着它占据了窗口上更多的空间，但它允许用户能够立即看到选项。\n\
  \n表 21-9 列出了 `ListBox` 控件的一些特别有趣的属性。\n\n在下一个“尝试一试”中，你将创建一个在以下显示的窗口：\n\n| 属性 | 描述\
  \ |\n| --- | --- |\n| `SelectionMode` | 控制用户如何从列表中选择项目。三个可能的值：Single（允许用户只选择一个项目）、`Multiple`（允许用户在不按住\
  \ Ctrl 键的情况下选择多个项目）以及 `Extended`（允许用户通过按住 Shift 键选择多个连续项目，通过按住 Ctrl 键选择非连续项目）。 |\n\
  | `SelectedItem` | 获取或设置第一个选定项目，如果没有选中项目则返回 null。即使选中了多个项目，也返回第一个项目。 |\n| `SelectedItems`\
  \ | 获取一个包含当前选中项目的列表。 |\n| `SelectedIndex` | 功能类似于 SelectedItem，但返回的是索引而不是项目本身，如果没有选中项目则返回\
  \ -1 而不是 `null`。 |\n\n\n\n\n这里存在一些重叠，因为样式可以包含模板。\n\n### 样式 (Styles)\n\nWPF 控制有一个名为\
  \ `Style` 的属性（继承自 `FrameworkElement`），它可以被设置为 `Style` 类的实例。`Style` 类非常复杂，能够实现高级的样式功能，但其核心是一组\
  \ `Setter` 对象。每个 `Setter` 对象负责根据其 `Property` 属性（要设置的属性名称）和 `Value` 属性（要设置的属性值）来设置属性的值。你可以通过对你在\
  \ `Property` 属性中使用的名称完全限定到控件类型（例如，`Button.Foreground`），或者设置 `Style` 对象的 `TargetType`\
  \ 属性（例如，`Button`），以便它能够解析属性名。\n\n以下代码显示了如何使用 `Style` 对象来设置 `Button` 控制的 `Foreground`\
  \ 属性：\n\n```xml\n<Button>\n  Click me!\n  <Button.Style>\n    <Style TargetType=\"\
  Button\">\n      <Setter Property=\"Foreground\">\n        <Setter.Value>\n    \
  \      <SolidColorBrush Color=\"Purple\"/>\n        </Setter.Value>\n      </Setter>\n\
  \    </Style>\n  </Button.Style>\n</Button>\n```\n\n显然，在这种情况下，直接用通常的方法设置按钮的 `Foreground`\
  \ 属性要得多。当你将样式转换为资源时，它们会变得有用得多，因为资源是可以重用的。\n\n### 模板 (Templates)\n\n控件是通过模板构建的，你可以对模板进行自定义。模板由用于构建控件显示的控件层次结构组成，其中可能包括用于按钮等显示内容的控件呈现器（Presenter）。控件的模板存储在它的\
  \ `Template` 属性中，该属性是 `ControlTemplate` 类的一个实例。`ControlTemplate` 类包含 `TargetType`\
  \ 属性，你可以将其设置为为定义模板的控件类型。通常，你通过使用 `Template` 属性为类设置模板：\n\n```xml\n<Button>\n  Click\
  \ me!\n  <Button.Style>\n    <Style TargetType=\"Button\">\n      <Setter Property=\"\
  Template\">\n        <Setter.Value>\n          <ControlTemplate TargetType=\"Button\"\
  >\n            <ContentPresenter/>\n          </ControlTemplate>\n        </Setter.Value>\n\
  \      </Setter>\n  </Button.Style>\n</Button>\n```\n\n某些控件可能需要多个模板。例如，`CheckBox`\
  \ 控件使用一个模板用于方框（`CheckBox.Template`），使用另一个模板在方框旁边输出文本（`CheckBox.ContentTemplate`）。允许你更改控件内容的模板可以通过在你想输出内容的位置包含一个\
  \ `ContentPresenter` 来实现。\n\n在本章较早之前，你开发了外观和感受相似的对话框。对话框的共同元素之一是页头，你在那里更改了标签的文本。你可以将该页头定义为标签，在接下来的内容中，你将开发一个新的\
  \ `Label` 样式并使用它来替换所有对话框中的页头。\n\n### 触发器 (Triggers)\n\nWPF 中的事件可以包含各种内容，包括按钮点击、应用程序启动和关闭事件等。WPF\
  \ 使用了几类型的触发器来提供诸如事件的功能，所有触发器都继承自 `TriggerBase` 类。其中一种触发器是 `EventTrigger` 类，它包含一个动作集合，每个动作都是派生自\
  \ `TriggerAction` 对象。这些动作在触发器被激活时执行。\n\n你可以使用 `EventTrigger` 通过 `BeginStoryboard`\
  \ 动作触发动画，使用 `ControllableStoryboardAction` 操作故事板，并使用 `SoundAction` 触发音效。每个控件都有一个\
  \ `Triggers` 属性，你可以用它直接在该控件上定义触发器。你也可以在层次结构更高处定义触发器——例如，在 `Window` 对象上。当你为控件设置样式时，最常用的触发器类型是\
  \ `Trigger`（尽管你仍将使用 `EventTrigger` 来触发控件动画）。`Trigger` 类用于响应其他属性的变化来设置属性，在在 `Style`\
  \ 对象中使用时特别有用。\n\n`Trigger` 对象的配置如下：\n\n*   要定义 `Trigger` 对象监控哪个属性，你使用 `Trigger.Property`\
  \ 属性。\n*   要定义 `Trigger` 对象何时激活，你设置 `Trigger.Value` 属性。\n*   要定义 `Trigger` 采取的动作，你将\
  \ `Trigger.Setters` 属性设置为 `Setter` 对象的集合。\n\n这里提到的 `Setter` 对象与你在“样式”部分看到的对象是完全相同的。以下代码显示了你在\
  \ `Style` 对象中使用的 `Trigger`：\n\n```xml\n<Style TargetType=\"Button\">\n  <Style.Triggers>\n\
  \    <Trigger Property=\"IsMouseOver\" Value=\"true\">\n      <Setter Property=\"\
  Foreground\" Value=\"Yellow\"/>\n    </Trigger>\n  </Style.Triggers>\n</Style>\n\
  ```\n\n此代码当 `Button.IsMouseOver` 属性为 `true` 时，将 `Button` 控件的 `Foreground` 属性更改为\
  \ `Yellow`。`IsMouseOver` 是非常有用的属性之一，你可以用它作为快捷查找有关控件和控件状态的信息。正如名称所示，如果鼠标悬停在控件上，它为\
  \ `true`。这允许你编写鼠标悬停代码。其他类似属性包括 `IsFocused`（用于判断控件是否具有焦点）、`IsHitTestVisible`（指示可以点击控件，即它没有被堆叠顺序中更后的控件遮挡）以及\
  \ `IsPressed`（指示按钮是否被按下）。最后一种属性仅适用于继承自 `ButtonBase` 的按钮，而其他适用于所有控件。\n\n你还可以通过使用\
  \ `ControlTemplate.Triggers` 属性来实现许多功能，它允许你创建包含触发器的控件模板。这就是默认 `Button` 模板能够响应鼠标悬停、点击和焦点变化的方式。这也是你为自己实现此功能时必须修改的内容。\n\
  \n### 动画 (Animations)\n\n动画是通过使用故事板（Storyboard）创建的。定义复杂动画的最佳方法是使用如 Expression Blend\
  \ 等的设计工具。你也可以通过直接编辑 XAML 代码和 C# 代码来定义它们。\n\nWPF 中的动画是使用名为 `Storyboard` 的对象定义的。通过故事板，你可以动画属性的值——例如按钮的背景颜色。非常重要的一点是，你可以以此方式动画化任何属性，而不只是影响控件显示的属性。\n\
  \n故事板可以单独定义在资源字典中，也可以通过事件触发器的 `BeginStoryboard` 属性在控件内部定义。在故事板内部，你定义了一个或多个动画或时间线。\n\
  \n上一节中，你使用触发器在鼠标悬停在控件上时设置 `Button` 控件的前景色值。请查看以下代码，它使用了故事板而不是触发器：\n\n\n\n\n\n```xml\n\
  \ <Button Content=\"Animation\" HorizontalAlignment=\"Left\" Margin=\"197,63,0,0\"\
  \ \n                               VerticalAlignment=\"Top\" Width=\"75\">\n   \
  \         <Button.Triggers>\n                <EventTrigger RoutedEvent=\"Button.MouseEnter\"\
  >\n                    <BeginStoryboard>\n                        <Storyboard>\n\
  \                            <ColorAnimation To=\"Yellow\" \n                  \
  \                  Storyboard.TargetProperty=\"(Button.Foreground)\n           \
  \                                              .(SolidColorBrush.Color)\"\n    \
  \                                FillBehavior=\"HoldEnd\" \n                   \
  \                 Duration=\"0:0:1\" AutoReverse=\"False\"/>\n                 \
  \       </Storyboard>\n                    </BeginStoryboard>\n                </EventTrigger>\n\
  \                <EventTrigger RoutedEvent=\"Button.MouseLeave\">\n            \
  \        <BeginStoryboard>\n                        <Storyboard>\n             \
  \               <ColorAnimation To=\"Black\" \n                                \
  \    Storyboard.TargetProperty=\"(Button.Foreground)\n                         \
  \                                .(SolidColorBrush.Color)\"\n                  \
  \                  FillBehavior=\"HoldEnd\" \n                                 \
  \   Duration=\"0:0:1\"/>\n                        </Storyboard>\n              \
  \      </BeginStoryboard>\n                </EventTrigger>\n            </Button.Triggers>\n\
  \        </Button>\n```\n\n`Button` 包含两个触发器，一个用于 `MouseEnter`，另一个用于 `MouseLeave`。每个触发器都包含一个\
  \ `ColorAnimation`，分别将文本的前景颜色改为黄色和黑色。使用 `Trigger` 直接设置 `Foreground` 属性与使用 Storyboard\
  \ 的区别在于细节：使用 Storyboard，你可以获得一个持续 1 秒的平滑过渡；但当你直接设置属性时，变化是瞬时发生的。这两者都是非常有价值的工具，并且应该在适当的情况下使用——过多的动画可能会让用户感到困扰，但几个位置恰当的动画可以让应用程序看起来非常惊艳。\n\
  \n# WPF 用户控件\n\n图形卡牌游戏的一个关键特性是……卡牌。显然，你不会在 WPF 自带的标准控件中找到一个名为“扑牌”的控件，因此你必须自己创建它。\n\
  \nWPF 提供了一组在许多情况下都非常有用的控件。然而，与所有的 .NET 开发框架一样，它也允许你扩展这些功能。具体来说，你可以通过从 WPF 类层次结构中的类派生来创建你自己的控件。\n\
  \n你可以派生的最实用的控件之一是 `UserControl`。该类提供了你可能需要的 WPF 控件的所有基本功能，并使你的控件能够无缝地接入现有的 WPF 控件套件。你希望通过\
  \ WPF 控件实现的所有内容——例如动画、样式和模板——都可以通过用户控件来实现。\n\n你可以通过使用项目 ➪ 添加用户控件（Add User Control）菜单项将用户控件添加到项目中。这会为你提供一个空白画布（实际上是一个空白的\
  \ `Grid` ）来开始工作。用户控件使用 XAML 中的顶层 `UserControl` 元素定义，而后台代码中的类派生自 `System.Windows.Controls.UserControl`\
  \ 类。\n\n一旦你向项目中添加了用户控件，你就可以添加控件来布局视觉外观，并使用后置代码来配置控件。完成这些操作后，你可以在整个应用程序中使用它，甚至可以在其他应用程序中复用它。\n\
  \n在创建用户控件时需要知道的关键点之一是如何实现依赖属性（dependency properties）。我们在在本章前面的部分简要讨论过这种属性，现在你已经接近要编写自己的控件了，是时候查看一下它们了。\n\
  \n## 实现依赖属性\n\n你可以将依赖属性添加到任何继承自 `System.Windows.DependencyObject` 的类中。该类位于 WPF 许多类的继承层次结构中，包括所有的控件和\
  \ `UserControl`。\n\n为了在类中实现依赖属性，你需要在类定义中添加一个类型为 `System.Windows.DependencyProperty`\
  \ 的公共静态成员。该成员的名称由你决定，但最佳实践是遵循命名约定 `<PropertyName>Property`：\n\n```cs\npublic static\
  \ DependencyProperty MyStringProperty;\n```\n\n该属性被定义为静态（static）似乎可能很奇怪，因为你最终将获得一个可以为类的每个实例唯一定义的属性。WPF\
  \ 属性框架会为你跟踪这些事项，所以你暂时不需要担心这个问题。\n\n你添加的成员必须通过使用静态 `DependencyProperty.Register()`\
  \ 方法进行配置：\n\n```cs\npublic static DependencyProperty MyStringProperty =\n   DependencyProperty.Register(…);\n\
  ```\n\n该方法接受三个到五个参数，如表 21-1 11 所示（这些参数按顺序显示，前三个参数是强制性的）。\n\n| 参数 | 用法 |\n| --- |\
  \ --- |\n| `string name` | 属性名称 |\n| `Type propertyType` | 属性的类型 |\n| `Type ownerType`\
  \ | 包含属性的类的类型 |\n| `PropertyMetadata typeMetadata` | 额外的属性设置：属性的默认值以及用于属性更改通知和强制转换的回调方法\
  \ |\n| `ValidateValueCallback validateValueCallback` | 用于验证属性值的回调方法 |\n\n**表 21-11:**\
  \ `Register( )` 方法的参数\n\n例如，你可以如下所示使用三个参数注册 `MyStringProperty` 依赖属性：\n\n```cs\n\
  public class MyClass : DependencyObject\n{\n   public static DependencyProperty\
  \ MyStringProperty = DependencyProperty.Register(\n      \"MyString\",\n      typeof(string),\n\
  \      typeof(MyClass));\n}\n```\n\n你也可以包含一个用于访问依赖属性的 .NET 属性（尽管这不是强制的）。然而，由于依赖属性被定义为静态成员，你不能使用与普通属性相同的语法。要访问依赖属性的值，你必须使用继承自\
  \ `DependencyObject` 的方法，如下：\n\n```cs\n public string MyString\n    {\n        get\
  \ { return (string)GetValue(MyStringProperty); }\n        set { SetValue(MyStringProperty,\
  \ value); }\n    }\n```\n\n在这里，`GetValue()` 和 `SetValue()` 方法分别获取和设置当前实例的 `MyStringProperty`\
  \ 依赖属性的值。这两个方法是公共的，因此客户端代码可以使用它们直接操作依赖属性值。这就是为什么添加 .NET 属性来访问依赖属性并不是强制。\n\n如果你想为属性设置元数据，则必须使用派自\
  \ `PropertyMetadata` 的对象（例如 `FrameworkPropertyMetadata`），并将此实例作为第四个参数传递给 `Register()`。`FrameworkPropertyMetadata`\
  \ 构造函数有 11 个重载，它们接受一个或多个如表 21-12 所示的参数。\n\n| 参数类型 | 用法 |\n| --- | --- |\n| `object\
  \ defaultValue` | 属性的默认值。 |\n| `FrameworkPropertyMetadataOptions flags` | 标志（来自\
  \ `FrameworkPropertyMetadataOptions` 枚举）的组合，你可以用它为属性指定额外的元数据。例如，你可能使用 `AffectsArrange`\
  \ 来声明属性的更改可能会影响控件布局。这将导致在属性更改时，窗口的布局引擎重新计算控件布局。查看 MSDN 文档以获取此处可用选项的完整列表。 |\n\n\n\
  \n\n\n| `PropertyChangedCallback propertyChangedCallback` | 当属性值更改时使用的回调方法。 |\n\
  | `CoerceValueCallback coerceValueCallback` | 如果属性值被强制类型转换时使用的回调方法。 |\n| `bool isAnimationProhibited`\
  \ | 指定此属性是否可以被动画更改。 |\n| `UpdateSourceTrigger defaultUpdateSourceTrigger` | 当对属性值进行数据绑定时，此属性根据\
  \ `UpdateSourceTrigger` 枚举中的值决定何时更新数据源。默认值为 `PropertyChanged`，这意味着只要属性发生变化，绑定源就会被更新。这并不总是合适的——例如，`TextBox.Text`\
  \ 属性在此项属性上使用了 `LostFocus` 值。这确保了绑定源不会过早更新。你还可以使用值 `Explicit` 来指定只有在需要请求时（通过调用派生自\
  \ `DependencyObject` 的类的 `UpdateSource()` 方法）才才更新绑定源。 |\n\n**表 21-12**(#c21.xhtml_R_c21-tbl-0012):\
  \ `FrameworkPropertyMetadata` 构造函数的重载\n\n使用 `FrameworkPropertyMetadata` 的简单示例是使用它来设置属性的默认值：\n\
  \n```cpp\n public static DependencyProperty MyStringProperty = \n         DependencyProperty.Register(\n\
  \               \"MyString\",\n               typeof(string),\n               typeof(MyClass),\n\
  \               new FrameworkPropertyMetadata(\"Default value\"));\n```\n\n到目前为止，你已经学习了三个指定的回调方法，分别用于属性更改通知、属性强制和属性值验证。这些回调与依赖属性本身一样，都必须实现为公共的静态方法。每个回调都有特定的返回类型和参数列表，你必须在你的回调方法中使用它们。\n\
  \n现在是时候回到正轨，继续编写 Ben's Cards 的游戏客户端了。在接下来的“尝试一试”（Try It Out）中，你将创建一个可以表示应用程序中扑牌的用户控件。\n\
  \n## 主窗口\n\n应用程序的主窗口是玩游戏的地方，因此它上只有几个控件。你将在这一部分构建游戏，但在开始之前，有几件事你需要完成。你需要在游戏客户端窗口中添加菜单，并将你已经构建的窗口绑定到菜单项上。\n\
  \n### 菜单控件 (The Menu Control)\n\n大多数应用程序都包含某种类型的菜单和工具栏。两者都是实现相同目的的手段：提供应用程序内容的便捷导航。工具栏通常包含菜单提供的相同条目的子集，可以被认为是菜单项的快捷方式。\n\
  \nVisual Studio 附带了 `Menu` 和 `Toolbar` 控件。这里的示例显示了 `Menu` 控件的使用，但使用 `Toolbar` 也非常相似。\n\
  \n默认情况下，菜单项显示为水平栏，你可以从其下拉出一个项目列表。该控件是一个 `Items` 控件，因此可以更改内容中包含的默认项目；但是你通常会以某种形式使用\
  \ `MenuItem` 控件，如下例所示。每个 `MenuItem` 都可以包含其他菜单项，你可以通过嵌套 `MenuItem` 控件来构建复杂的菜单，但你应该尝试尽可能保持菜单结构的简单性。\n\
  \n你可以使用多个属性来控制 `MenuItem` 的显示方式（参见表 21-13）。\n\n| 属性 | 描述 |\n| --- | --- |\n| `Icon`\
  \ | 在控件的左边缘显示图标 |\n| `IsCheckable` | 在控件的左侧显示复选框 (CheckBox) |\n| `IsChecked` | 获取或设置\
  \ `MenuItem` 上复选框的值 |\n\n**表 21-13**(#c21.xhtml_R_c21-tbl-0013): 显示 MenuItem 属性\n\
  \n### 带有菜单的路由命令 (Routed Commands with Menus)\n\n*路由命令*（Routed commands）在本章前面简要讨论过，但现在你将第一次看到它们的运行。回想起这些命令与事件类似，因为会在用户执行操作时执行代码，并且它们可以返回一个状态，指示在任何给定何时可以执行。\n\
  \n至少有三个你想要使用路由命令而不是事件的原因：\n\n1. 导致事件发生的动作可以从应用程序的多个位置触发。\n2. UI 元素应该只在特定条件下可访问，例如，如果没有可以保存的内容，保存按钮应被禁用。\n\
  3. 你希望将处理事件的代码与后台文件（code-behind file）分离。\n\n如果这些场景中任何一个符合你的需求，请考虑使用路由命令。在游戏的情况下，菜单中的某些项也可能可能从工具栏可用。此外，保存操作应该只在游戏进行时可用，并且它可能同时从菜单和工具栏可用。\n\
  \n## 整合在一起 (PUTTING IT ALL TOGETHER)\n\n在游戏开发的这个阶段，你有了两个独立的对话框、一个卡牌库和一个提供显示游戏的空白区域的主窗口。这仍然留下了大量工作，但基础已经打好，是时候开始构建游戏本身了。`CardLib`\
  \ 库中的类描述了游戏的“领域模型”（domain model），即游戏可以分解的这些。这些类需要稍微重构，以便游戏在 Windows 应用程序中运行得更好。接下来你将编写游戏的“视图模型”（View\
  \ Model），这是一个能够控制游戏显示的类。\n\n### 重构领域模型 (Refactoring the Domain Model)\n\n如所述，领域模型是描述游戏对象的代码。目前，你有以下描述游戏对象的类：\n\
  \n* `Card`\n* `Deck`\n* `Rank`\n* `Suit`\n\n除了这些类之外，游戏还需要 `Player` 和 `ComputerPlayer`\
  \ 类，因此你将添加它们。你还需要稍微修改 `Card` 和 `Deck` 类，以便它们更好地配合 Windows 应用程序。\n\n\n\n\n\n### 21.1\
  \ `TextBlock` 控制可以用于显示大量文本，但如果文本超出视口，该控件本身并不提供任何滚动文本的方法。通过将 `TextBlock` 与另一个控件结合，创建一个包含有大量文本的\
  \ `TextBlock` 窗口，该文本是可以滚滚的，并且仅当文本超出视口时才会出现滚动条。\n\n### 21.2 `Slider` 和 `Progress`\
  \ 控件具有一些共同点，例如最小值、最大值和当前值。仅通过对 `ProgressBar` 使用数据绑定，创建一个包含滑块和进度条的窗口，其中 `Slider`\
  \ 控制进度条的最小值、最大值和当前值。\n\n### 21.3 修改上一个问题中的 `ProgressBar`，使其从窗口的左下角到右上角对角线方式显示自己。\n\
  \n### 21.4 创建一个名为 `PersistentSlider` 的新类，并包含三个属性：`MinValue`、`MaxValue` 和 `CurrentValue`。该类必须能够参与数据绑定，并且所有属性都能够通知已绑定的控件发生了。\n\
  \n1. 在你之前两个练习中创建的窗口的后台代码（code-behind）中，创建一个类型为 `PersistentSlider` 的新字段并用一些默认值对其初始化。\n\
  2. 在构造函数中，将实例绑定到窗口的数据源。\n3. 将滑块的 `Minimum`、`Maximum` 和 `Value` 属性绑定到数据源。\n\n###\
  \ 21.5 当前的游戏客户端有一个问题。从选项（Options）对话框中，你可以设置计算机的技能水平。问题在于，下次打开选项对话框时，单选按钮没有更新以反映之前的选择。这部分是因为没有程序尝试去更新它们，部分是因为没有从\
  \ `ComputerSkillLevel` 的值转换器。通过创建一个新的值转换器并设置 `IsChecked` 绑定，而不是使用当前使用的 `Checked`\
  \ 事件来修复这个问题。\n\n提示：你必须使用 `Converter` 绑定中的 `ConverterParameter` 部分。\n\n### 21.6 计算机会作弊，所以你可能也想允许玩家作弊。在选项对话框上，为计算机创建一个明牌出玩的选项。\n\
  \n### 21.7 在游戏客户端底部创建一个状态栏，显示游戏的当前状态。\n\n练习题答案可以在附录中找到。\n\n## ▸ 本章学到的知识\n\n| 主题\
  \ | 核心概念 |\n| --- | --- |\n| XAML | XAML 是一种使用 XML 语法的语言，能够以声明式、层次化的方式将控件添加到用户界面。\
  \ |\n| 数据绑定 | 你可以使用数据绑定将控件的属性连接到其他控件的值。你还可以定义资源，并使用视图外部类定义的代码作为属性值和控件内容的数据源。`DataContexts`\
  \ 可以指定现有对象实例的绑定源，从而允许你绑定到在应用程序其他部分创建的实例。 |\n| 路由事件 | 路由事件是 WPF 中使用的特殊事件。它们分为两种类型：冒泡（bubbling）和隧道（tunneling）。冒泡事件首先在激活它的控件上触发，然后通过视图树向上冒泡到根元素。隧道事件则方向相反，从根元素移动到用户激活的控件。都可以通过将事件参数的\
  \ `Handled` 属性设置为 `true` 来停止冒泡或隧道事件。 |\n| `INotifyPropertyChanged` | `INotifyPropertyChanged`\
  \ 接口由用于 WPF 视图的类实现。当类的属性设置器被调用时，它们会触发 `PropertyChanged` 事件，并带有发生值变化的属性名称。任何绑定到触发该事件属性的控件属性都会收到通知并相应地更新自身。\
  \ |\n| `ObservableCollection` | `ObservableCollection` 是一种集合，除了其他外还实现了 `INotifyPropertyChanged`\
  \ 接口。当你想要为 WPF 视图提供列表类型的属性或值进行数据绑定时，使用这种专门的集合。 |\n| 内容控件 | 内容控件在其内容中可以包含单个控件。此类控件的示例是\
  \ `Button`。包含的控件可以是 `Grid` 或 `StackPanel`；它们允许你创建复杂的自定义。 |\n| 项目控件 | 项目控件在其内容中可以包含控件列表。此类控件的示例是\
  \ `ListBox`。列表中的每个控件都可以被自定义。 |\n| 布局控件 | 你学习了使用多种用于帮助你创建视图的控件：1. `Canvas` 允许对控件进行显式定位，但除此之外几乎没有其他功能。2.\
  \ `StackPanel` 水平或垂直地堆叠控件。3. `WrapPanel` 堆叠控件并根据面板的方向将其换行到下一行或下一列。4. `DockPanel`\
  \ 允许你将控件停靠在边缘或填充整个内容。5. `Grid` 允许你定义行和列并使用这些来定位控件。 |\n| UI 控件 | UI 控件显示在视图上，通常使用布局控件来引导它们的位置。这些控件包括：1.\
  \ `Label` 控件显示短文本。2. `TextBlock` 控件显示可能需要多行显示的文本。3. `TextBox` 控件允许用户提供输入。4. `Button`\
  \ 控件允许用户执行单个操作。5. `Image` 控件用于显示图像。6. `CheckBoxes` 让用户回答诸如“对战计算机？”之类的是否问题。7. `RadioButton`\
  \ 控件让用户从多个中恰选择一个。8. `ComboBox` 控件显示允许用户选择的项目列表。9. `ListBox` 控件显示列表。与 `ComboBox`\
  \ 不同，列表总是展开的。10. `TabControl` 允许在页面上分组控件。 |\n| 样式 | 你可以使用样式为可以使用的 XAML 元素创建样式。样式允许设置元素的属性。当你将元素的\
  \ `Style` 属性指向你定义的样式时，元素的属性将使用你在样式中指定的值。 |\n| 模板 | 模板用于定义控件的内容。通过模板，你可以更改标准控件的显示方式。你也可以用它们构建复杂的自定义控件。\
  \ |\n| 用户控件 | 用户控件用于在你自己的项目中可以复用的代码和 XAML。这些代码和 XAML 也可以导出到其他项目使用。 |\n\n# 附录\n\n\
