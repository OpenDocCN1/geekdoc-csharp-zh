  \ 17 章:** 数据库\n\n# 14 文件\n\n### 本章代码下载\n\n本章的代码可以在书籍页面的 [`www.wiley.com`](http://www.wiley.com)\
  \ 找到。点击 Downloads（下载）链接。代码也可以在 github.com/benperk/BeginningCSharpAndDotNET`](http://github.com/benperk/BeginningCSharpAndDotNET)\
  \ 找到。代码位于 `Chapter14` 文件夹中，并根据章节中的名称分别命名。\n\n文件是存储应用程序实例之间数据的极佳方式，也可以用于在应用程序之间传输数据。用户和应用程序配置设置可以存储起来，以便在下次运行应用程序时检索。\n\
  \n本章将向你展示如何在应用程序中有效使用文件，涉及用于创建、读取和写入文件的主要类，以及用于从 C# 代码操作文件系统的辅助类。尽管你不会详细检查所有的类，但本章的深度足以让你对这些概念和基础原理有一个良好的理解。\n\
  \n## 输入和输出文件类\n\n读取和写入文件是数据进入你的 C# 程序（输入）和离开程序发送数据（输出）的重要方式。由于文件被用于输入和输出，文件类包含在\
  \ `System.IO` 命名空间中（`IO` 是 Input/Output 的常用缩写）。\n\n`System.IO` 包含了用于在文件中读写数据的类，你可以在\
  \ C# 应用程序中引用此命名空间，以访问这些类，而无需使用完全限定类型名。\n\n本章涵盖的类在表 14-1 中描述。\n\n| 类 | 描述 |\n| ---\
  \ | --- |\n| `File` | 静态工具类，提供了许多静态方法，用于检查文件是否存在、读取和写入内容，以及移动、复制和删除文件。 |\n| `Directory`\
  \ | 静态工具类，提供了许多静态方法，用于检查目录是否存在以及移动、复制和删除目录。 |\n| `Path` | 用于处理路径名的工具类。 |\n| `FileInfo`\
  \ | 代表磁盘上的物理文件，并具有操作该文件的方法。对于任何对文件的读取和写入，必须创建一个 `Stream` 对象。 |\n| `DirectoryInfo`\
  \ | 代表磁盘上的物理目录，并具有操作该目录的方法。 |\n| `FileSystemInfo` | 作为 `FileInfo` 和 `DirectoryInfo`\
  \ 的基类，使得可以使用多态同时处理文件和目录。 |\n| `FileSystemWatcher` | 你在本章中检查的最先进的类。它用于监控文件和目录，并暴露了事件，当这些位置发生变化时你的应用程序可以捕获这些事件。\
  \ |\n\n**表 14-1:** 文件系统访问类\n\n你还将查看 `System.IO.Compression` 命名空间，它允许你从压缩文件（.ZIP\
  \ 扩展名）读取和写入。特别是，你将查看以下两个流类：\n\n* `DeflateStream`——代表一种流，数据在写入时自动压缩，或在读取时自动解压缩。压缩是使用\
  \ Deflate 算法实现的。\n* `GZipStream`—代表一种流，数据在写入时自动压缩，或在读取时自动解压缩。压缩是使用 GZIP (GNU Zip)\
  \ 算法实现的。\n\n### 文件和目录类\n\n`File` 和 `Directory` 工具类提供了许多静态方法来操作——（令人惊讶的是）文件和目录。这些方法使得移动文件、查询和更新属性以及创建\
  \ `FileStream` 对象成为可能。正如你在第 8 章中学到的，静态方法可以在无需创建实例的情况下在类上调用。\n\n`File` 类的一些最实用的静态方法在表\
  \ 14-2 中。\n\n| 方法 | 描述 |\n| --- | --- |\n| `Copy()` | 将文件从源位置复制到目标位置。 |\n| `Create()`\
  \ | 在指定路径下创建文件。 |\n| `Delete()` | 删除文件。 |\n| `Exists()` | 检查文件是否存在。 |\n| `Open()`\
  \ | 在指定路径返回 `FileStream` 对象。 |\n| `Move()` | 将指定文件移动到新位置。你可以为新位置上的文件指定不同的名称。 |\n\
  | `ReadAllText()` | 将文本文件的内容读取到字符串中。 |\n| `WriteAllText()` | 将字符串的内容写入文本文件。 |\n\n\
  **表 14-2:** File 类的静态方法\n\n`Directory` 类的一些实用静态方法在表 14-3 中。\n\n| 方法 | 描述 |\n| ---\
  \ | --- |\n| `CreateDirectory()` | 创建指定路径的目录。 |\n| `Delete()` | 删除指定的目录。 |\n| `GetDirectories()`\
  \ | 返回 `string` 对象数组，表示指定目录下的子目录的名称。 |\n| `EnumerateDirectories()` | 类似于 `GetDirectories()`，返回\
  \ `IEnumerable<string>` 集合。 |\n| `GetFiles()` | 返回指定目录内文件名的 `string` 对象数组。 |\n|\
  \ `EnumerateFiles()` | 类似于 `GetFiles()`，返回 `IEnumerable<string>` 集合。 |\n| `GetFileSystemEntries()`\
  \ | 返回指定目录内文件和目录名称的 `string` 对象数组。 |\n| `EnumerateFileSystemEntries()` | 类似于 `GetFileSystemEntries()`，返回\
  \ `IEnumerable<string>` 集合。 |\n| `Move()` | 将指定的目录移动到新位置。你可以为新位置上的文件夹指定新的名称。 |\n\
  \n**表 14-3:** Directory 类的静态方法\n\n当存在大量文件目录时，三个 `EnumerateXxx()` 方法的性能优于对应的 `GetXxx()`\
  \ 方法。\n\n### FileInfo 类\n\n与 `File` 类不同，`FileInfo` 类不是静态的，也没有静态方法。它在实例化后才有用。`FileInfo`\
  \ 对象代表磁盘或网络位置上的文件，你可以通过提供文件路径来创建它：\n\n```csharp\nFileInfo aFile = new FileInfo(@\"\
  C:\\Log.txt\");\n```\n\n你也可以目录名称传递给 `FileInfo` 构造函数，尽管在实践中这并不常用。这样做会导致 `FileInfo`\
  \ 的基类 `FileSystemInfo` 初始化为所有的目录信息，但 `FileInfo` 中专门针对文件的方法或属性将无法工作。\n\n`FileInfo`\
  \ 类暴露的许多方法与 `File` 类相似，但由于 `File` 是静态类，因此每次调用方法都需要一个字符串参数来指定文件位置。`FileInfo` 不需要引用一个实际存在的文件。因此，以下调用是相同的：\n\
  \n```csharp\nFileInfo aFile = new FileInfo(\"Data.txt\");\nif (aFile.Exists)\n \
  \  Console.WriteLine(\"File Exists\");\nif (File.Exists(\"Data.txt\"))\n   Console.WriteLine(\"\
  File Exists\");\n```\n\n在此段代码中，检查了 `Data.txt` 文件是否存在。注意这里没有指定目录信息，这意味着只检查当前工作目录。该目录是调用此代码的应用程序所在的目录。你将在稍后在“路径名称和相对路径”部分更详细地讨论这一点。\n\
  \n\n\n\n\n大多数 `FileInfo` 方法都以这种方式镜像了 `File` 类的方法。在大多数情况下，使用哪种技术并不重要，尽管以下标准可以帮助你判断哪种方法更合适：\n\
  \n- 如果你只进行单个方法调用，那么使用静态 `File` 类上的方法是有意义的——单次调用速度会更快，因为 .NET Framework 无需经过实例化新对象然后调用该方法的过程。\n\
  - 如果你的应用程序正在对一个文件执行若干项操作，那么实例化一个 `FileInfo` 对象并使用它的方法会更有意义——这可以节省时间，因为该对象已经引用了文件系统中正确的文件，而静态类每次都必须查找它。\n\
  \n`FileInfo` 类还暴露了与底层文件相关的属性，其中某些属性可以通过操纵来更新文件。这些属性中的许多继承自 `FileSystemInfo`，因此同时适用于\
  \ `FileInfo` 和 `DirectoryInfo` 类。`FileSystemInfo` 的属性如表 14-4 所示。\n\n| 属性 | 说明 |\n\
  | --- | --- |\n| `Attributes` | 使用 `FileAttributes` 枚举获取或设置当前文件或目录的属性。 |\n| `CreationTime`,\
  \ `CreationTimeUtc` | 获取或设置当前文件的创建日期和时间，提供协调世界时 (UTC) 和非 UTC 版本。 |\n| `Extension`\
  \ | 获取文件的扩展名。此属性是只读的。 |\n| `Exists` | 确定文件是否存在。这是一个只读抽象属性，在 `FileInfo` 和 `DirectoryInfo`\
  \ 中被重写。 |\n| `FullName` | 获取文件的完整路径。此属性是只读的。 |\n| `LastAccessTime`, `LastAccessTimeUtc`\
  \ | 获取或设置当前文件最后访问的日期和时间，提供 UTC 和非 UTC 版本。 |\n| `LastWriteTime`, `LastWriteTimeUtc`\
  \ | 获取或设置当前文件最后写入的日期和时间，提供 UTC 和非 UTC 版本。 |\n| `Name` | 获取文件名。这是一个只读抽象属性，在 `FileInfo`\
  \ 和 `DirectoryInfo` 中被重写。 |\n\n**表 14-4:** FileSystemInfo 属性\n\n`FileInfo` 特有的属性如表\
  \ 14-5 所示。\n\n| 属性 | 说明 |\n| --- | --- |\n| `Directory` | 获取一个表示包含当前文件的 `DirectoryInfo`\
  \ 对象。此属性是只读的。 |\n| `DirectoryName` | 返回文件目录的路径。此属性是只读的。 |\n| `IsReadOnly` | 文件只读属性的快捷方式。此属性也可以通过\
  \ `Attributes` 访问。 |\n| `Length` | 获取以字节为单位的文件大小，以 `long` 类型值返回。此属性是只读的。 |\n\n**表\
  \ 14-5:** FileInfo 属性\n\n### DirectoryInfo 类\n\n`DirectoryInfo` 类的工作方式与 `FileInfo`\
  \ 类完全相同，区别在于它引用的是目录而不是文件。它是一个表示机器上单个目录的实例化对象。与 `FileInfo` 类一样，许多方法调用在 `Directory`\
  \ 和 `DirectoryInfo` 之间是重复。选择使用 `File` 还是 `FileInfo` 方法的指南同样适用于 `DirectoryInfo` 方法：\n\
  \n- 如果你进行单次调用，请使用静态 `Directory` 类。\n- 如果你正在进行系列调用，请使用实例化的 `DirectoryInfo` 对象。\n\n\
  `DirectoryInfo` 类从 `FileSystemInfo` 继承了大部分属性，FileInfo 也是如此，尽管这些属性操作的是目录而不是文件。还有两个\
  \ `DirectoryInfo` 特有的属性，如表 14-6 所示。\n\n| 属性 | 说明 |\n| --- | --- |\n| `Parent` |\
  \ 获取一个表示包含当前目录的 `DirectoryInfo` 对象。此属性是只读的。 |\n| `Root` | 获取一个表示当前卷根目录的 `DirectoryInfo`\
  \ 对象——例如 `C:\\` 目录。此属性是只读的。 |\n\n**表 14-6:** DirectoryInfo 类专用属性\n\n### 路径名称与相对路径\n\
  \n在 .NET 代码中指定路径名称时，可以使用绝对路径或相对路径。绝对路径名显式指定从已知位置（如 `C:` 盘）开始的文件或目录。示例是 `C:\\Work\\\
  LogFile.txt`——此路径精确定义了文件所在的位置，没有任何歧义。\n\n相对路径名相对于起始位置。通过使用相对路径，不需要指定驱动器或已知位置。你之前见过这种情况，当前工作目录就是起点，这是相对路径的默认行为。例如，如果你的应用程序在\
  \ `C:\\Development\\FileDemo` 目录下运行并使用相对路径 `LogFile.txt`，则文件引用将 `C:\\Development\\\
  FileDemo`。\n\n## 流 (STREAMS)\n\nNET Framework 中的所有输入输出都涉及流的使用。流是串行设备的抽象表示。串行设备是以线性方式存储和访问数据的，即按一个字节顺序地。这种设备可以是磁盘文件、网络通道、内存位置或任何支持线性读取、写入或两者的对象。通过保持设备抽象，流的底层源可以被隐藏。这种抽象化实现了代码重用，并允许你编写更通用的例程，因为你不需要担心传输是如何发生的。因此，当从文件输入流、网络输入流或任何类型的流读取数据时，相似的代码可以传输并重用。由于你可以忽略每个设备的物理机制，因此在处理文件流时，你不需要担心例如硬盘头或内存分配。\n\
  \n流可以表示几乎任何源，如键盘、物理磁盘文件、网络位置、打印机甚至是另一个程序，但本章侧重于读取和写入磁盘文件。应用于读取/写入磁盘文件的概念适用于大多数设备，因此你将获得流的基础知识，并学习一种适用于许多情况的验证方法。\n\
  \n### 用于流的类\n\n用于流的类包含在 `System.IO` 命名空间中，与 `File` 和 `Directory` 类相同。这些类如表 14-7\
  \ 所示。\n\n| 类 |  |\n| --- | --- |\n| `FileStream` | 表示可以写入、读取或两者均可。该文件可以异步或同步的方式进行写入和读取。\
  \ |\n| `StreamReader` | 从流读取字符数据，可以使用 `FileStream` 作为基类创建。 |\n| `StreamWriter` |\
  \ 向流写入字符数据，可以使用 `FileStream` 作为基类创建。 |\n\n\n\n\n\n# 表 14-7: 流类\n\n现在让我们来看看如何使用这些中的类。\n\
  \n### FileStream 对象\n\n`FileStream` 对象代表一个指向磁盘上文件或网络路径的流。虽然该类确实暴露了从文件读取和写入字节的方法，但大多数情况下，你会使用\
  \ `StreamReader` 或 `StreamWriter` 来执行这些功能。这是因为 `FileStream` 类是基于字节和字节数组操作的，而 `Stream`\
  \ 类是基于字符数据操作的。字符数据更容易处理，但某些操作（例如随机文件访问，即访问文件中间某个点的数据）只能通过 `FileStream` 对象完成。你将在本章稍后的部分学习更多关于这的内容。\n\
  \n创建 `FileStream` 对象有多种方法。构造函数有许多不同的重载，但最简单的形式只需要两个参数：文件名以及一个 `FileMode` 枚举值：\n\n\
  ```\nFileStream aFile = new FileStream(filename, FileMode.<Member>);\n```\n\n`FileMode`\
  \ 枚举有几个成员，指定了如何打开或创建文件。你很快就会看到这些可能性。另一个常用的构造函数如下：\n\n```\nFileStream aFile = \n\
  new FileStream(filename, FileMode.<Member>, FileAccess.<Member>);\n```\n\n第三个参数是\
  \ `FileAccess` 枚举的成员，它是指定流目的的方法。`FileAccess` 枚举的成员如表 14-8 所示。\n\n| 成员 | 描述 |\n|\
  \ --- | --- |\n| `Read` | 以只读模式打开文件 |\n| `Write` | 以只写模式打开文件 |\n| `ReadWrite` |\
  \ 以读写模式打开文件 |\n\n# 表 14-8: FileAccess 枚举成员\n\n尝试执行由 FileAccess 枚举成员指定之外的操作将导致抛出异常。此属性通常被用作根据用户的授权级别来更改用户对文件的访问权限。\n\
  \n在不使用 `FileAccess` 枚举参数的 `FileStream` 构造函数版本中使用的是默认值，即 `FileAccess.ReadWrite`。\n\
  \n`FileMode` 枚举成员如表 14-9 所示。使用这些值中的每个值时实际发生了什么取决于指定的文件名是否指向一个存在的文件。请注意，表中的条目指的是流在创建时指向的文件的位置，这个主题你将在下一节中学习更多。除非另有说明，否则流指向文件的开头。\n\
  \n`File` 和 `FileInfo` 类都暴露了 `OpenRead()` 和 `OpenWrite()` 方法，这使得创建 `FileStream` 对象变得更加简单。第一个以只读访问打开文件，第二个允许只写访问。这些方法提供了快捷方式，因此你不需要以参数的形式向\
  \ `FileStream` 构造函数提供所需的所有信息。例如，下行代码以只读访问打开了 `Data.txt` 文件：\n\n```\nFileStream aFile\
  \ = File.OpenRead(\"Data.txt\");\n```\n\n以下代码执行相同的功能：\n\n```\nFileInfo aFileInfo\
  \ = new FileInfo(\"Data.txt\");\nFileStream aFile = aFileInfo.OpenRead();\n```\n\
  \n### 文件位置\n\n`FileStream` 类维护一个内部文件指针，该指针指向文件内下一次读取或写入操作将发生的位置。在大多数情况下，当打开文件时，它指向文件的开头，但此指针可以被修改。这使得应用程序可以在文件的任何地方进行读取或写入，从而实现了对文件的随机访问，以及直接跳转到文件中特定位置的能力。在处理非常大的文件时这可以节省大量时间，因为你可以立即移动到你想要的位置。\n\
  \n| 成员 | 文件存在时的行为 | 文件不存在时的行为 |\n| --- | --- | --- |\n| `Append` | 打开文件，并将流位于文件的末尾。只能配合\
  \ `FileAccess.Write` 使用。 | 创建一个新文件。只能配合 `FileAccess.Write` 使用。 |\n| `Create` | 销毁文件，并在原位置创建一个新文件。\
  \ | 创建一个新文件。 |\n| `CreateNew` | 抛出异常。 | 创建一个新文件。 |\n| `Open` | 打开文件，并将流位于文件的开头。\
  \ | 抛出异常。 |\n| `OpenOrCreate` | 打开文件，并将流位于文件的开头。 | 创建一个新文件。 |\n| `Truncate` | 打开并擦除文件。流位于文件的开头。保留原始文件的创建日期。\
  \ | 抛出异常。 |\n\n# 表 14-9: FileMode 枚举成员\n\n实现此功能的方法是 `Seek()` 方法，它接受两个参数。第一个参数指定移动文件指针的距离，以字节为单位。第二个参数指定从哪里开始计数，形式为来自\
  \ `SeekOrigin` 枚举的值。`SeekOrigin` 枚举包含 `Begin`、`Current` 和 `End`。\n\n例如，下行将文件指针从文件开始移动\
  \ 8 字节：\n\n```\naFile.Seek(8, Begin);\n```\n\n文件指针现在指向文件的第 9 个字节（因为第一个字节是 0）。下行从当前位置向前移动\
  \ 2 个字节。如果直接在上行之后执行，则文件指针现在指向文件的第 11 个字节：\n\n```\naFile.Seek(2, Current);\n```\n\
  \n当你从文件读取或写入时，文件指针也会发生变化。读取 10 个字节后，文件指针将指向第 10 个字节之后的字节。\n\n你还可以指定负的偏移位置，将其与 `SeekOrigin.End`\
  \ 枚举值结合可以到文件末尾。下行跳转到文件末尾的第 5 个字节：\n\n```\naFile.Seek(-5, End);\n```\n\n以这种方式访问的文件有时被称为随机访问文件，因为应用程序可以访问文件的任何位置。稍后描述的\
  \ `StreamReader` 和 `StreamWriter` 类是顺序访问文件的，不允许以这种方式操作文件指针。\n\n### 读取数据\n\n使用 `FileStream`\
  \ 类读取数据并没有使用 `StreamReader` 类那么简单，你将在本章稍后部分介绍它。这是因为 `FileStream` 类专门处理原始字节。以原始字节处理使得\
  \ `FileStream` 类适用于任何类型的数据文件，而不仅仅是文本文件。通过读取字节数据，`FileStream` 对象可以读取图像或声音文件等。这种灵活性的代价是，你无法使用\
  \ `FileStream` 直接将数据读取到字符串（像使用 `StreamReader` 类那样）。然而，几个转换类可以很方便地将字节数组转换为字符数组，反之亦然。\n\
  \n`FileStream.Read()` 方法是访问 `FileStream` 对象指向的文件数据的主要手段。该方法从文件中读取数据并将这些数据写入 `byte`\
  \ 数组。它有三个参数，第一个是传入的用于接收来自 `FileStream` 对象数据的 `byte` 数组。第二个参数是 `byte` 数组中开始写入数据的位置——通常为\
  \ 0，以便从数组开头开始写入文件数据。最后一个参数指定了从文件中读取的字节数。\n\n### 写入数据\n\n\n\n\n向随机访问文件写入数据的过程非常相似；必须创建一个字节数组。最简单的方法是首先构建你想要写入文件的字符数组。接下来，使用\
  \ `Encoder` 对象将其转换为字节数组，这就像你之前使用 `Decoder` 对象一样。最后，调用 `Write()` 方法将数组发送到文件。\n\n\
  接下来的“尝试一下（Try It Out）”是一个简单的示例，演示了如何实现这一操作。\n\n### StreamWriter 对象\n\n处理字节数组通常不是大多数人认为的趣事——在用过\
  \ `FileStream` 对象后，你可能在想是否有更简单的方法。不要担心，一旦你有了一个 `FileStream` 对象，你通常会创建一个 `StreamWriter`\
  \ 或 `StreamReader`，并使用它的方法来操作文件。如果你不需要将文件指针更改到任意位置的能力，这些类将使文件操作变得变得简单得多。\n\n`StreamWriter`\
  \ 类允许你向文件写入字符和字符串，由该类替你处理底层的转换，并将数据写入 `FileStream` 对象。\n\n创建 `StreamWriter` 对象有许多方法。如果你已经有一个\
  \ `FileStream` 对象，则可以使用它来创建 `StreamWriter`：\n\n```\nFileStream aFile = new FileStream(\"\
  Log.txt\", FileMode.CreateNew);\nStreamWriter sw = new StreamWriter(aFile);\n```\n\
  \n也可以直接从文件创建 `StreamWriter` 对象：\n\n```\nStreamWriter sw = new StreamWriter(\"Log.txt\"\
  , true);\n```\n\n此构造函数接受文件名和一个设置如下的布尔值：\n\n- 如果设置为 `false`，则创建一个新文件，或者截断现有文件并打开它。\n\
  - 如果设置为 `true`，则打开文件并保留数据。如果没有该文件，则创建一个新文件。\n\n与创建 `FileStream` 对象不同，创建 `StreamWriter`\
  \ 没有提供类似范围的选项——除了追加或创建新文件的布尔值外，你没有像使用 `FileStream` 类时那样指定 `FileMode` 属性的选项。你也没有设置\
  \ `FileAccess` 属性的选项，因此你始终拥有文件的读/写权限。要使用任何高级参数，你必须先在 `FileStream` 构造函数中指定它们，然后从\
  \ `FileStream` 对象创建 `StreamWriter`，正如在下面的“尝试一下”所示的那样。\n\n### StreamReader 对象\n\n\
  输入流用于从外部源读取数据。通常，这可能是磁盘或网络位置上的文件，但请记住，该源几乎可以是任何可以发送数据的源，例如网络应用程序甚至是控制台。\n\n`StreamReader`\
  \ 类是你将用于从文件中读取数据的。和 `StreamWriter` 类一样，这是一个泛型，可以与任何流配合。在下一个“尝试一下”中，你再次围绕一个 `FileStream`\
  \ 对象构造它，使其指向正确的文件。\n\n`StreamReader` 对象的创建方式与 `StreamWriter` 对象非常相似。创建它的常用方法是使用之前创建的\
  \ `FileStream` 对象：\n\n```\nFileStream aFile = new FileStream(\"Log.txt\", FileMode.Open);\n\
  StreamReader sr = new StreamReader(aFile);\n```\n\n像 `StreamWriter` 一样，`StreamReader`\
  \ 类可以直接从包含特定文件路径的字符串创建：\n\n```\nStreamReader sr = new StreamReader(\"Log.txt\");\n\
  ```\n\n#### 读取数据\n\n`ReadLine()` 方法并不是访问文件中数据的唯一方法。`StreamReader` 类有许多读取数据的方法。\n\
  \n最简单的读取方法是 `Read()`。它将流中的下一个字符作为正整数值返回，如果已到达末尾，则返回 `-1`。可以使用 `Convert` 工具类将此值转换为字符。在前面的示例中，程序的主要部分可以重写如下：\n\
  \n```\nStreamReader sr = new StreamReader(aFile);\nint charCode;\ncharCode = sr.Read();\n\
  while(charCode != –1)\n{\n   Write(Convert.ToChar(charCode));\n   charCode = sr.Read();\n\
  }\nsr.Close();\n```\n\n用于较小文件的一个非常方便的方法是 `ReadToEnd()` 方法。它读取整个文件并作为字符串返回。在这种情况下，之前的应用程序可以简化为：\n\
  \n```\nStreamReader sr = new StreamReader(aFile);\nline = sr.ReadToEnd();\nConsole.WriteLine(line);\n\
  sr.Close();\n```\n\n虽然这看起来既简单又方便，但请小心。通过将所有数据读入字符串对象中，你是在强制文件中的数据存在于内存中。根据数据文件的大小，这可能是不可接受的。如果数据文件非常大，最好将数据留留在文件中，并使用\
  \ `StreamReader` 的其他方法对其进行访问。\n\n处理大文件的另一种方法（在 .NET 4 中引入）是使用静态的 `File.ReadLines()`\
  \ 方法。事实上，`File` 有几个静态方法可以让你简化文件数据的读取和写入，但这一个方法特别有趣，因为它返回一个 `IEnumerable<string>`\
  \ 集合。你可以遍历此集合中的字符串，一次读取文件的一行内容。使用这种方法，你可以将之前的示例重写如下：\n\n```\nforeach (string alternativeLine\
  \ in File.ReadLines(\"Log.txt\"))\n   WriteLine(alternativeLine);\n```\n\n### 异步文件访问\n\
  \n有时——例如当你一次性执行大量文件操作或处理非常大的文件时——读取和写入数据可能会很慢。如果是这样，你可能希望在等待时执行其他操作。这对于桌面应用程序特别重要，因为你希望应用程序保持响应。\n\
  \n为了实现这一点，NET 4.5 引入了处理流的异步方法。这适用于 `FileStream` 类以及 `StreamReader` 和 `StreamWriter`。如果你浏览这些类的定义，可能会注意到一些以\
  \ `Async` 结尾的方法——例如，`StreamReader` 有 `ReadLineAsync()`，它是 `ReadLine()` 的异步版本。这些方法设计用于基于任务的异步编程模型。\n\
  \n异步编程是一种高级技术，本书没有详细介绍。但是，如果你对异步文件访问感兴趣，那么这里是一个开始的地方。你可能还想阅读 Christian Nagel 写的\
  \ *Professional C# 7.0 and .NET Core 2.0* (Wrox, 2018) 以获取更多细节。\n\n### 读取和写入压缩文件\n\
  \n在处理文件时，通常会占用大量的空间。对于图形和声音文件尤其如此。你可能遇到过可以压缩和解压缩文件的工具，这些工具在你移动或发送文件时非常有用。`System.IO.Compression`\
  \ 命名空间包含了允许你通过代码压缩文件的类，使用了 GZIP 或 Deflate 算法——这两种都是公开可用且免费供使用的。\n\n不过，压缩文件不仅仅是压缩它们本身。你可能见过商业应用程序如何将多个文件放在单个压缩文件中，通常称为归包。`System.IO.Compression`\
  \ 命名空间中的类可以实现类似的功能。然而，为了保持本书简单，我们只查看一种场景：将文本数据保存到压缩文件中。虽然你可能无法使用外部工具访问此文件，但你会发现它比未压缩的对应文件要小得多！\n\
  \n\n\n\n\n你在这里将查看 `System.IO.Compression` 命名空间下的两个压缩流类：`DeflateStream` 和 `GZipStream`，它们的工作方式非常相似。在这两种情况下，你都使用一个现有的流来初始化它们，对于文件来说，就是一个\
  \ `FileStream` 对象。之后，你就可以像使用其他流一样，配合 `StreamReader` 和 `StreamWriter` 使用它们。在此之外，你只需要指定该流是用于压缩（保存文件）还是解压缩（加载文件），以便该类知道如何处理通过它的数据。通过下面的“尝试一下”（Try\
  \ It Out）可以很好地说明这一点。\n\n## 监控文件系统\n\n有时，应用程序需要的操作不仅仅是向文件系统读或写文件。例如，知道文件或目录何时被修改可能是重要的。在\
  \ .NET 中，创建具有此功能的自定义应用程序非常简单。\n\n帮助你完成此工作的类是 `FileSystemWatcher` 类。它暴露了几个应用程序可以捕获的事件。这使得你的应用程序能够响应文件系统事件。\n\
  \n使用 `FileSystemWatcher` 的基本程序很简单。首先，你必须设置若干属性，这些属性指定了监控哪里、监控什么以及何时引发你的应用程序将处理的事件。然后，你给它提供自定义事件处理程序的地址，以便在发生重大事件时调用这些处理程序。最后，你开启它并等待事件发生。\n\
  \n在启用 `FileSystemWatcher` 对象之前必须设置的属性如表 14-10 所示。\n\n| 属性 | 描述 |\n| --- | --- |\n\
  | `Path` | 必须设置为要监控的文件位置或目录。 |\n| `NotifyFilter` | `NotifyFilters` 枚举值的组合，用于指定在监控的文件内关注的内容。这些值代表了被监控的文件或文件夹的属性。如果任何指定的属性发生变化，就会引发事件。可能的枚举值为\
  \ `Attributes`、`CreationTime`、`DirectoryName`、`FileName`、`LastAccess`、`LastWrite`、`Security`\
  \ 和 `Size`。注意，这些可以使用二进制 `OR` 运算符组合。 |\n| `Filter` | 指定要监控哪些文件的过滤器——例如 `*.txt`。 |\n\
  \n**表 14-10:** FileSystemWatcher 属性\n\n一旦设置了这些，你必须为四个事件编写事件处理程序：`Changed`、`Created`、`Deleted`\
  \ 和 `Renamed`。如第 13 章所示，这只需创建你自己的方法并将其分配给对象的事件。通过将你自己的事件处理程序方法分配给这些事件，当事件触发时，你的方法会被调用。当匹配\
  \ `Path`、`NotifyFilter` 和 `Filter` 属性的文件或目录被修改时，每个事件都会触发一次。\n\n一旦设置了属性和事件，将 `EnableRaisingEvents`\
  \ 属性设置为 `true` 以开始监控。在接下来的“尝试一下”中，你将在简单的客户端应用程序中使用 `FileSystemWatcher` 来跟踪你选择的目录。\n\
