  \ | 当 `FirstChild` 和 `LastChild` 属性返回当前节点的相应子节点时，`NextSibling` 节点返回具有相同父节点的下一个节点。在书籍示例中，这意味着获取\
  \ `title` 元素的 `NextSibling` 将返回 `author` 元素，而在该元素上调用 `NextSibling` 将返回 `code` 元素。\
  \ |\n| `HasChildNodes` | 允许你检查当前元素是否有子元素，而无需实际从 `FirstChild` 获取值并与 `null` 进行比较。\
