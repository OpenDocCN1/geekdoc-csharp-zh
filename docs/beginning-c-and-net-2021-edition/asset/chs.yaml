  \ 插入节点的方法\n\n### 删除节点\n\n现在你已经看到了如何创建新节点，剩下的就是学习如何再次删除它们。所有派自 `XmlNode` 的类都包含两个方法，如\
  \ 表 15-6 所示，允许你从文档中删除节点。\n\n| 方法 | 描述 |\n| --- | --- |\n| `RemoveAll` | 调用该方法的节点中的所有子节点。稍显不明显的是，它还删除了节点上的所有属性，因为它们也被视为子节点。\
  \ |\n| `RemoveChild` | 调用该方法的节点中的单个子节点。该方法返回已从文档中移除的节点，但如果你改变了主意，可以重新插入它。 |\n\n\
  **表 15-6:** 删除节点的方法\n\n接下来的简短“尝试一下”扩展了你在过去两个示例中一直在创建的应用程序，包含了删除节点的能力。目前，它只找到书籍节点的最后一个实例并将其移除。\n\
  \n### 选择节点\n\n你现在已经知道如何在 XML 文档中来回移动，如何操作文档的值，如何创建新节点，以及如何再次删除它们。本节仅剩一件事：如何在不需要遍历整个树的情况下选择节点。\n\
  \n`XmlNode` 类包含两个方法，如 表 15-7 所示，通常用于从文档中选择节点而不必遍历其中的每个节点：`SelectSingleNode` 和 `SelectNodes`，它们都使用一种名为\
  \ XPath 的特殊查询语言来选择节点。你将在下一节的“尝试一下”中学习这些。\n\n| 方法 | 描述 |\n| --- | --- |\n| `SelectSingleNode`\
  \ | 选择单个节点。如果创建了一个获取多个节点的查询，它将返回第一个节点。 |\n| `SelectNodes` | 返回 `XmlNode` 形式的节点集合。\
  \ |\n\n**表 15-7:** 选择节点的方法\n\n## 使用 XPath 搜索 XML\n\nXPath 是用于 XML 文档的查询语言，就像 SQL\
  \ 之于关系型数据库。它被 表 15-7 中描述的方法使用，允许你避免遍历整个树的麻烦。它确实需要一点适应，因为语法与 SQL 或 C# 不同。\n\n为了正确看到\
  \ XPath 的作用，你将使用一个名为 `Elements.xml` 的 XML 文件，它包含了周期表的部分化学元素。你将在本节稍后的“选择节点”示例中发现它，也可以在本章的代码中找到它。\n\
