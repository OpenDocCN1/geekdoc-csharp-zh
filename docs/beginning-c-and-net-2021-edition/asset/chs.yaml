  \ Microsoft 登录 Visual Studio。通过这样做，你的 Visual Studio 设置将在设备之间同步，这样在多个工作站上使用时无需配置\
  \ IDE。如果你没有 Microsoft 账户，请按照流程创建一个并登录。如果你不想登录，请点击“现在，以后再说”链接，并继续 Visual Studio 的初始配置。建议你在某个时候登录并获取开发者许可证。\n\
