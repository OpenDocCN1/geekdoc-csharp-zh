  \ 文档，但你在创建查询时必须知道文档结构这一事实意味着，只要文档符合相同的 Schema，确保文档的有效性（valid）也就意味着确保了查询在不同文档之间都能正常工作。\
  \ |\n\n# 16 LINQ\n\n### 本章代码下载\n\n本章的代码下载可以在书籍页面的[`www.wiley.com`](http://www.wiley.com)找到。点击\
  \ Downloads 链接。代码也可以在 github.com/benperk/BeginningCSharpAndDotNET`](http://github.com/benperk/BeginningCSharpAndDotNET)\
  \ 找到。代码位于 `Chapter16` 文件夹中，并根据全书名称单独命名。\n\n本章介绍了语言集成查询（LINQ）。LINQ 是 C# 语言的一种扩展，将数据查询直接集成到编程语言本身。\n\
  \n在 LINQ 之前，这类工作需要编写大量的循环代码，并且对找到的对象进行排序或分组等额外处理需要更多的代码，且这些代码会根据数据源而异。LINQ 提供了一种通用的、一致的方法来查询、排序和分组许多类型的数据（XML、JSON、SQL\
  \ 数据库、对象集合、Web 服务、企业目录等）。\n\n首先，你将基于上一章的内容，学习 `System.Xml.Linq` 命名空间为创建 XML 增加的额外功能。然后，你将通过使用查询语法、方法语法、lambda\
  \ 表达式、排序、分组和连接相关结果来进入 LINQ 的核心。\n\nLINQ 的规模非常大，完全涵盖其所有功能和方法超出了初级书籍的范围。然而，你将看到作为\
  \ LINQ 用户可能需要的各种不同类型的语句和操作符的示例，并在适当的情况下引导你参考更深入的覆盖资源。\n\n## LINQ to XML\n\nLINQ\
  \ to XML 是 XML 的一组替代类，它允许使用 LINQ 处理 XML 数据，并且即使你不使用 LINQ，也能让某些 XML 操作变得更容易。我们将两个特定的案例，在这些情况下\
  \ LINQ to XML 优于上一章介绍的 XML DOM（文档对象模型）。\n\n### LINQ to XML 函数式构造函数\n\n虽然你可以用 XML\
  \ DOM 在代码中创建 XML 文档，但 LINQ to XML 提供了一种更简单的创建 XML 文档的方法，称为函数式构造（functional construction）。在函数式构造中，构造函数的调用可以嵌套，自然地反映\
  \ XML 的结构。在下面的“尝试一下”中，你将使用函数式构造创建一个包含客户和订单的简单 XML 文档。\n\n与 XML DOM 不同，LINQ to XML\
  \ 以非常相同的方式处理 XML 片段（部分或不完整的 XML 文档）。处理片段时，只需使用 `XElement` 作为顶级对象，而不是 `XDocument`。\n\
  \n在下面的“尝试一下”中，你将加载、保存并操作 XML 元素及其子节点，就像你之前操作 XML 文档一样。\n\n## LINQ 提供者\n\nLINQ to\
  \ XML 只是 LINQ 提供者的一个示例。Visual Studio 和 .NET 带有许多内置 LINQ 提供者，为不同类型的数据提供查询解决方案：\n\n\
  - **LINQ to Objects**——对任何类型的 C# 内存对象（如数组、列表和其他集合类型）进行查询。\n- **LINQ to XML**——正如你所看到的，它使用相同的语法和通用查询机制提供\
  \ XML 文档的创建和操作。\n- **LINQ to Entities**——Entity Framework 是 .NET 最新的数据接口类，微软推荐用于新开发。\n\
  - **LINQ to Data Set**——`DataSet` 对象是在 .NET Framework 第一版本引入的。这种 LINQ 类型允许使用 LINQ\
  \ 轻松查询传统的 .NET 数据。\n- **LINQ to SQL**——这是另一种 LINQ 接口已被 LINQ to Entities 取代。\n- **PLINQ**——PLINQ（并行\
  \ LINQ）通过并行编程库扩展了 LINQ to Objects，可以将查询拆并在多核处理器上同时执行。\n- **LINQ to JSON**——使用相同的语法和通用查询机制支持\
  \ JSON 文档的创建和操作。\n\n由于 LINQ 的种类非常多，初级书籍中无法涵盖所有种类，但你看到的语法和方法适用于所有类型。接下来，让我们使用 LINQ\
  \ to Objects 提供者查看 LINQ 查询语法。\n\n\n\n\n在接下来的“尝试”（Try It Out）中，你将使用 LINQ 查询在一个简单的内存对象数组中查找某些数据并将其打印到控制台。\n\
  \n### 使用 var 关键字为结果声明变量\n\nLINQ 查询首先声明一个变量来存储查询结果，这通常通过使用 `var` 关键字声明变量来实现：\n\n\
  ```\nvar queryResult =\n```\n\n`var` 是 C# 中的一个关键字，用于声明一种通用变量类型，非常适合存储 LINQ 查询的结果。`var`\
  \ 关键字告诉 C# 编译器根据查询来推断结果的类型。这样一来，你就不需要提前声明 LINQ 查询将返回什么类型的对象了——编译器会为你处理好。如果查询可以返回多个项，那么它的行为就像查询数据源中对象的集合一样（从技术上讲，它并不是一个集合；它只是看起来是那样）。\n\
  \n顺便说一下，`queryResult` 的名称是随意的——你可以为结果命名任何名称。它可以是 `namesBeginningWithS` 或任何其他在你的程序中有意义的名称。\n\
  \n### 指定数据源：from 子句\n\nLINQ 查询的下一部分是 `from` 子句，它指定了你正在查询的数据：\n\n```\nfrom n in names\n\
  ```\n\n在这种情况下，你的数据源是 `names`，即之前声明的字符串数组。变量 `n` 只是数据源中单个元素的占位符，类似于 `foreach` 语句后面的变量名。通过指定\
  \ `from`，你是在明示你将要查询集合的子集。\n\n说到集合，LINQ 数据源必须是可枚举的（enumerable）——也就是说，它必须是一个数组或项的集合，你可以从中挑选一个或多个元素进行迭代。\n\
  \n数据源不能是一个孤立的值或对象，例如单个 `int` 变量。你已经拥有了这样一个单项，所以对它进行查询没有意义！\n\n### 指定条件：where 子句\n\
  \n在 LINQ 查询的下一部分中，你使用 `where` 子句来指定查询的条件，它的格式如下：\n\n```\nwhere n.StartsWith(\"S\"\
  )\n```\n\n任何可以应用于数据源项的布尔（真或假）表达式都可以指定在 `where` 子句中。实际上，`where` 子句是可选的，甚至可以省略，但在几乎所有情况下，你都会希望指定一个\
  \ `where` 条件来将结果限制为你需要的数据。`where` 子句在 LINQ 中被称为限制操作符（restriction operator），因为它限制了查询结果。\n\
  \n在这里，你指定名称 `string` 以字母 S 开头，但你也可以指定字符串的其他任何属性——例如，长度大于 10（`where n.Length > 10`）或包含字母\
  \ Q（`where n.Contains(\"Q\")`）。\n\n### 选择项：select 子句\n\n最后，`select` 子句指定了哪些项出现在结果集中。`select`\
  \ 子句的格式如下：\n\n```\nselect n\n```\n\n`select` 子句是必须，因为你必须指定查询中的哪些项出现在结果集中。对于这组数据来说，这并不十分有趣，因为结果集的每个元素都只有一个项，即名称。你之后会看到一些结果集中包含更复杂对象的示例，那时\
  \ `select` 子句的用处将更加明显，但首先，你需要完成这个示例。\n\n### 结束：使用 foreach 循环\n\n现在你打印查询结果。与用数据源的数组一样，这种\
  \ LINQ 查询的结果也是可枚举的，这意味着你可以使用 `foreach` 语句遍历结果：\n\n```\nWriteLine(\"Names beginning\
  \ with S:\");\nforeach (var item in queryResults) {\n       WriteLine(item);\n}\n\
  ```\n\n在这种情况下，你匹配了五个名称——Smith、Smythe、Small、Singh 和 Samba——所以你在 `foreach` 循环中显示这些内容。\n\
  \n### 延迟查询执行\n\n你可能在想 `foreach` 循环实际上并不是 LINQ 本身的一部分——它只是在遍历你的结果。虽然 `foreach` 结构本身不是\
  \ LINQ 的一部分，但它确实是你代码中实际执行 LINQ 查询的部分！查询结果变量的赋值只是保存了一个执行查询的计划；在 LINQ 中，在访问结果之前数据本身不会被检索。这被称为延迟查询执行（deferred\
  \ query execution）或查询的惰性求（lazy evaluation）。对于任何产生序列（即列表）结果的查询，执行都将被延迟。\n\n## LINQ\
  \ 方法语法\n\n在编程中，通常有多种方法实现相同的功能，LINQ 也是如此。正如提到的，之前的示例是使用 LINQ 查询语法编写的。在下一个示例中，你将使用\
  \ LINQ 的方法语法（也称为显式语法，但这里使用了方法语法）来编写相同的程序。\n\n### LINQ 扩展方法\n\nLINQ 被实现为针对集合、数组、查询结果以及任何实现\
  \ `IEnumerable<T>` 接口对象的系列扩展方法。你可以通过 Visual Studio 的智能感知（IntelliSense）功能看到这些方法。例如，在\
  \ Visual Studio 中，打开刚刚完成的 `BeginningCSharpAndDotNET_16_3_QuerySyntax` 程序中的 `Program.cs`\
  \ 文件，并在紧接着下方输入对 `names` 数组的新引用：\n\n```\nstring[] names = { \"Alonso\", \"Zheng\"\
  , \"Smith\", \"Smythe\", \"Small\", \"Singh\", \"Samba\", \"Ruiz\", \"Hsieh\", \"\
  Jorgenson\", \"Ilyich\", \"Fatimah\" };\nnames.\n```\n\n当你输入 `names` 后的点时，你将看到可用方法。`Where<T>`\
  \ 方法以及大多数其他方法都是扩展方法。通过注释掉顶部的 `using System.Linq` 指令你会发现它们是 LINQ 扩展。你之前使用的 `from...where...select`\
  \ 查询表达式会被 C# 编译器翻译成这些方法的调用。使用方法语法时，你直接调用这些方法。\n\n### 查询语法与方法语法\n\n查询语法是 LINQ 编程的首选方式，因为它通常更易读，且对于常见查询来说更简单。然而，对方法语法的基础理解是非常重要的，因为某些\
  \ LINQ 功能在查询语法中不可用，或者在方法语法中使用起来更容易。\n\n在本章中，你将主要使用查询语法，但在需要的地方会指出方法语法，并且你会学习如何使用方法语法来解决问题。\n\
  \n大多数使用方法语法的 LINQ 方法都需要你传递一个方法或函数来评估查询表达式。方法/函数参数以委托的形式传递，它通常引用一个匿名方法。\n\n幸运的是，LINQ\
  \ 让这变得比听起来简单得多！你通过使用 Lambda 表达式来创建方法/函数，以优雅的方式封装委托。\n\n### Lambda 表达式\n\nLambda\
  \ 表达式是一种在 LINQ 查询中现场创建方法的简单方法。它使用 `=>` 运算符，声明方法的参数后紧跟方法逻辑，全部写在一行！\n\n例如，考虑这个 Lambda\
  \ 表达式：\n\n```\nn => n < 0\n```\n\n这声明了一个名为 `n` 的单参数方法。如果 `n` 小于 0，方法返回 *true*，否则返回\
  \ *false*。这非常简单。你不需要为方法命名，不需要写 return 语句，也不需要用大括号包裹任何代码。\n\n\n\n像这样返回真/假尔值在 LINQ\
  \ lambda 表达式中使用的方法中很常见，但并非非要这样做。例如，这里有一个 lambda，创建了一个返回两个变量之和的方法。此 lambda 使用了多个参数：\n\
  \n```\n(a, b) => a + b\n```\n\n这声明了一个具有名为 `a` 和 `b` 的两个参数的方法。方法逻辑返回 `a` 和 `b` 的和。你不需要声明\
  \ `a` 和 `b` 的类型，它们可以是 `int`、`double` 或 `string`。C# 编译器会自动推断这些类型。\n\n最后，考虑下面这个 lambda\
  \ 表达式：\n\n```\nn => n.StartsWith(\"S\")\n```\n\n如果 `n` 以字母 S 开头，则该方法返回 `true`，否则返回\
  \ `false`。请在实际程序中尝试运行此代码，以更清晰地观察其结果。\n\n# 对查询结果进行排序\n\n一旦你使用 `where` 子句（或调用 `Where()`\
  \ 方法）定位了感兴趣的数据，LINQ 就可以轻松地让你对结果数据进行进一步处理——例如对结果进行重新排序。在接下来的“尝试一下”中，你把你第一次查询的结果按字母顺序进行排序。\n\
  \n# 理解 orderby 子句\n\n`orderby` 子句如下所示：\n\n```\norderby n\n```\n\n与 `where` 子句一样，`orderby`\
  \ 子句是可选的。只需添加一行，你就可以对任何任意查询的结果进行排序，否则这可能需要额外的代码以及可能的额外的方法或集合来存储重新排序后的结果，这取决于你选择实现的排序算法。如果需要对多种类型进行排序，你必须为每种类型实现一组排序方法。使用\
  \ LINQ，你不需要担心这些问题；只需在查询语句中添加一个额外的子句即可。\n\n默认情况下，`orderby` 按升序（从 A 到 Z）排序，但你只需通过添加\
  \ `descending` 关键字即可指定降序（从 Z 到 A）：\n\n```\norderby n descending\n```\n\n这将按如下顺序对示例结果排序：\n\
  \n```\nSmythe\nSmith\nSmall\nSingh\nSamba\n```\n\n此外，你可以根据任何任意表达式进行排序，而无需重写查询；例如，如果想按名称的最后一个字母而不是普通的字母顺序进行排序，只需将\
  \ `orderby` 子句更改为如下：\n\n```\norderby n.Substring(n.Length - 1)\n```\n\n这将产生以下输出：\n\
  \n```\nSamba\nSmythe\nSmith\nSingh\nSmall\n```\n\n# 查询大型数据集\n\n你可能会说，这些 LINQ 语法固然很好，但意义何在？通过查看源数组就能清楚地看到预期的结果，那么为什么要费这么大劲去查询一个显而易见的东西呢？正如前面提到的，有时查询结果并不并不那么显而易见。在接下来的“尝试一下”中，你创建了一个非常大的数字数组并使用\
  \ LINQ 对其查询。\n\n# 使用聚合运算符\n\n通常，查询的结果比你预期的要多。例如，如果你将刚刚创建的大数字查询程序的筛选条件更改为列出大于 1,000\
  \ 的数字，而不是小于 1,000 的数字，那么查询结果将多到数字打印出来都不会停止！\n\n幸运的是，LINQ 提供了一组聚合运算符，让你能够分析查询结果，而无需遍历所有结果。表\
  \ 16-1 显示了用于数值结果集（如大数字查询的结果）的最常用聚合运算符。如果你使用过 SQL 等数据库查询语言，这些可能你会很熟悉。\n\n| 运算符 |\
  \ 描述 |\n\n| --- | --- |\n\n| `Count()` | 结果计数 |\n| `Min()` | 结果中的最小值 |\n| `Max()`\
  \ | 结果中的最大值 |\n| `Average()` | 数值结果的平均值 |\n| `Sum()` | 所有数值结果的总和 |\n\n**表 16-1:**\
  \ 数值结果的聚合运算符\n\n还有更多的聚合运算符，例如 `Aggregate()`，用于执行任意代码，并允许你编写自己的聚合函数。然而，这些是针对高级用户的，因此超出了本书的范围。\n\
  \n在接下来的“尝试一下”中，你修改了大数字查询，并使用聚合运算符通过 LINQ 探索大于版本的大数字查询结果集。\n\n# 使用 SELECT DISTINCT\
  \ 查询\n\n熟悉 SQL 数据查询语言的人还会认识另一种查询类型，即 `SELECT DISTINCT` 查询，在其中你搜索数据中的唯一值——也就是说，查询从结果集中移除任何重复值。这在处理查询时是一个相当常见的需求。\n\
  \n假设你需要找到本章之前 XML 示例中使用的客户数据中的不同区域。在你刚刚使用的数据中没有单独的区域列表，因此你需要从客户列表中找到唯一的、不重复的区域列表。LINQ\
  \ 提供了一个 `Distinct()` 方法，可以让你轻松地找到这些数据。你将在接下来的“尝试一下”中使用它。\n\n# 多级排序\n\n现在你正在处理具有多个属性的对象，你可能预见到一种情况：仅通过单个字段对查询结果进行排序是不够的。如果你想查询客户并按地区字母顺序排序，然后按城市字母顺序排序会怎样？LINQ\
  \ 让这变得非常简单，正如你在接下来的“尝试一下”中看到的。\n\n# 使用 GROUP 查询\n\n分组查询将数据分组，并允许你对分组进行排序、计算聚合和比较。这些通常是业务背景中最有趣的查询（驱动决策的查询）。例如，你可能想按国家或地区比较销售情况，以决定在哪里开新店或雇更多员工。\n\
  \n# 使用 JOIN\n\n像你刚刚创建的客户列表这样具有共享键（ID）的数据集可以实现连接查询，通过它可以查询两个列表中相关数据。这类似于 SQL 语言中的\
  \ `JOIN` 操作；正如你所预期的，LINQ 在语法中提供了 `join` 命令。\n\n# 练习题\n\n1. **16.1** 修改示例程序（BeginningCSharpAndNET_16_3_QuerySyntax），按降序排列结果。\n\
  2. **16.2** 修改大数字查询示例（BeginningCSharpAndNET_16_6_LargeNumberQuery）中传递给 `GenerateLotsNumbers()`\
  \ 方法的数字，创建不同大小的结果集并观察结果如何受到影响。\n3. **16.3** 在大数字查询示例（BeginningCSharpAndNET_16_6_LargeNumberQuery）中添加\
  \ `orderby` 子句，以观察其如何影响性能。\n4. **16.4** 修改大数字查询示例（BeginningCSharpAndNET_16_6_LargeNumberQuery）中的查询条件，选择更大或更小的子集。这对性能有什么影响？\n\
  5. **16.5** 修改方法语法示例（BeginningCSharpAndNET_16_4_MethodSyntax），完全消除 `where` 子句。它会产生多少输出？\n\
  6. **16.6** 为第三个示例程序（BeginningCSharpAndNET_16_3_QuerySyntax）添加聚合运算符。对于这种非数值结果集，哪些简单的聚合运算符可用？\n\
  \n练习题的答案可以在附录](#b01.xhtml）中找到。\n\n\n\n\n\n| 如何获取 LINQ 查询结果 | 使用 `foreach` 语句遍历 LINQ\
  \ 查询的结果。 |\n| 延迟执行 | LINQ 查询的执行是延迟的，直到需要其结果时才会执行（通过循环、如 `ToArray` 的转换方法、聚合方法调用等等）。\
  \ |\n| 方法语法和查询语法 | 大多数 LINQ 查询使用查询语法，在需要时使用方法查询。对于任何给定的查询，查询语法或方法语法将产生相同的结果。 |\n\
  | Lambda 表达式 | Lambda 表达式允许你使用方法语法在 LINQ 查询中即时声明一个方法。 |\n| 聚合操作符 | 使用 LINQ 聚合操作符获取大型数据集的信息，而无需遍历每个结果。\
  \ |\n| 分组查询 | 使用分组查询将数据划组，然后按组进行排序、计算聚合和按组进行比较。 |\n| 排序 | 使用 `orderby` 运算符对查询结果进行排序。\
  \ |\n| 连接 | 使用 `join` 运算符在单次查询中查询多个集合中的相关数据。 |\n\n# 17 数据库\n\n### 本章代码下载\n\n本章的代码下载可以在书籍页面的\
  \ [`www.wiley.com`](http://www.wiley.com) 找到。点击 Downloads 链接。代码也可以 [`github.com/benperk/BeginningCSharpAndDotNet`](http://github.com/benperk/BeginningCSharpAndDotNet)\
  \ 找到。代码位于 `Chapter17` 文件夹中，并根据整个章节中的名称单独命名。\n\n上一节介绍了 LINQ（集成查询语言），并展示了 LINQ 如何与对象和\
  \ XML 协作。本章将教你如何将对象存储在数据库中并使用 LINQ 查询数据。\n\n## 使用数据库\n\n就本书而言，`database`（数据库）是一个持久的、结构化的数据仓库。有许多种数据库，但你在存储和查询业务数据时遇到的最常见的是`关系型数据库`，例如\
  \ Microsoft SQL Server 和 Oracle。关系型数据库使用 SQL 数据库语言（SQL 代表结构化查询语言）来查询和操作数据。关系型数据库将数据存储在由`行`和`列`组织的`表`中。\n\
  \n表、行、列之间的关系传统上通过`实体-关系模型`显示，其中`entity`（实体）是数据的抽象概念，例如客户，它在关系型数据库中与其他实体（如订单和产品）相关（例如，客户为产品下订单）。\n\
  \n直接处理此类数据库需要理解这种模型，并需要了解 SQL 语言。你会使用 SQL 在你的编程语言中嵌入 SQL 语句。你还会用它将包含 SQL 语句的字符串传递给\
  \ SQL 向数据库类库中的 API 调用或方法。\n\n听起来很复杂，不是吗？嗯，好消息是，我们将向你展示如何使用 `Entity Framework`（实体框架）来生成所需的代码，将你的\
  \ C# 类转换为数据库对象，将对象存储在数据库中，并使用 LINQ 查询对象，而无需使用 SQL 等其他语言。\n\n## ENTITY FRAMEWORK\n\
  \n.NET 中处理数据库的主要类库是 `Entity Framework`。该名称来源于本章引言中提到的实体-关系模型。\n\nEntity Framework\
  \ 将你程序中的 C# 对象映射到关系型数据库中的实体。这被称为`对象-关系映射 (ORM)`。对象-关系映射是代码，它将 C# 中的类、对象和属性映射到构成关系型数据库的表、行和列。手动创建这些映射代码既枯燥又耗时，但\
  \ Entity Framework 让它变得简单！\n\n针对不同版本的 .NET，Entity Framework 有几个不同的版本。你将使用与最新版本的\
  \ .NET 兼容的 Entity Framework，称为 `EntityFrameworkCore`。\n\n## 代码优先对比 数据库优先\n\nEntity\
  \ Framework 支持两种将 C# 对象映射到你的数据库的方法。我们将查看的第一种方法称为 `Code-First`（代码优先），你先创建 C# 类，然后\
  \ Entity Framework 直接从你的类生成数据库对象。另一种方法称为 `Database-First`（数据库优先），你从现有的数据库开始，Entity\
  \ Framework 生成映射到数据库中预存表、行和列的 C# 对象。我们将从 Code-First 开始（毕竟这是一本 C# 书），然后在章节末尾简要展示\
  \ Database-First。\n\n## 迁移与脚手架程序\n\nEntity Framework 使用了一些你起初可能不陌生的术语，但在 Code-First\
  \ 和 Database-First 方法的背景下，它们足够容易理解。\n\n第一个需要理解的术语是 `migrations`（迁移）。迁移用于 Code-First\
  \ 方法。迁移是一组类，用于从你的 C# 对象创建数据库对象。你需要创建一个初始迁移，用你的第一组 C# 类初始化数据库。在初始迁移之后，每当你对映射到数据库的\
  \ C# 类进行更改时，你都需要创建一个新的迁移以用你的更改更新数据库。幸运的是，Entity Framework 通过包含命令行工具来根据需要为你生成代码，使这变得简单。我们将在“尝试一试”示例中向你展示如何在\
  \ Visual Studio 中运行这些命令。\n\n第二个术语是 `scaffolding`（脚手架程序），用于 Database-First 方法。脚手架程序也使用命令行工具生成\
  \ C# 代码，但它的方向与迁移相反，从数据库开始生成 C# 代码中所需的类。我们将在章节的最后一个示例中向你展示如何生成脚手架程序。\n\n## 安装 SQL\
  \ EXPRESS LOCALDB\n\n为了与特定数据库工作，Entity Framework 需要该数据库的 `provider`（提供程序）。Entity\
  \ Framework 提供程序适用于许多数据库，如 SQL Server、MySQL、Oracle、SQLite 等。这些提供程序具有一致的架构，因此你将在本中学学会的技术适用于所有它们。然而，为了展示可运行的代码，我们需要在本章选择一个，我们选择的是\
  \ Microsoft SQL Server。\n\n你将使用 SQL Server Express，它是 Microsoft SQL Server 的免费轻量版本。你将使用\
  \ SQL Express 的 `LocalDB` ，这允许 Visual Studio 在你的开发计算机上本地创建和打开数据库文件，而无需通过网络连接到单独的数据库服务器。\n\
  \nVisual Studio 附了 SQL Express LocalDB。如果你在安装 Visual Studio 时指定了 ASP.NET 和 Web 开发或数据存储和处理负载，你已经安装了\
  \ SQL Express LocalDB。如果你没有安装这些工作负载，可以返回“单个组件”选项卡并在“云、数据库和服务器”部分进行安装，或者你也可以从此链接下载并安装\
  \ SQL Express LocalDB [`go.microsoft.com/fwlink/?linkid=866658`](http://go.microsoft.com/fwlink/?linkid=866658)。\n\
  \n## 代码优先数据库\n\n在下面的尝试一试中，你使用代码优先结合 Entity Framework 在数据库中创建一些对象，然后使用 LINQ to Entities\
  \ 查询你创建的对象。\n\n## 探索你的数据库\n\n但是等等，你说。你创建的数据库在哪里？你从没有指定过文件名或文件夹位置——这一切都是魔法！你可以通过\
  \ Visual Studio 中的“服务器管理器”查看数据库。转到工具 ➪ 连接到数据库。选择数据源并选择 Microsoft SQL Server，然后点击继续以获取图\
  \ 17-11 所示的对话框。\n\n\n\n\n\n![选择数据源并选择 Microsoft SQL Server 的截图](img/c17f011.png)\n\
  \n**图 17-11**\n\n在“添加连接”向导中，在“服务器名称”字段输入 `(localdb)\\MSSQLLocalDB`，并在“选择或输入数据库名称”字段中输入\
  \ `Books`，如图 17-12 所示。\n\n![添加连接向导的截图](img/c17f012.png)\n\n**图 17-12**\n\n点击“确定”。你将看到带有“数据连接”子树的“服务器资源管理器”，如图\
  \ 17-13 所示。\n\n![带有数据连接子树的服务器资源管理器的截图](img/c17f013.png)\n\n**图 17-13**\n\n服务器资源管理器将显示本地数据库的物理名称，类似于\
  \ `YourComputerName\\localdb###Books.dbo`。点击物理数据库旁边的展开器，然后展开“表”子树。你将看到包含 `Title`、`Author`\
  \ 和 `Code` 字段的 `Books` 表，如图 17-14 所示。\n\n![包含 Title、Author 和 Code 字段的 Books 表的截图](img/c17f014.png)\n\
  \n**图 17-14**\n\n从这里你可以直接探索数据库。例如，你可以右键点击 `Books` 表并选择“显示表数据”，以查看输入的数据，如图 17-15\
  \ 所示。\n\n![选择“显示表数据”的截图](img/c17f015.png)\n\n**图 17-15**\n\n你将看到列表中另一个名为 `EFMigrationsHistory`\
  \ 的表。这是在你使用包管理器控制台初始迁移并更新数据库时创建的。我们将在章后面的部分详细解释迁移的内容。但首先，我们将探索数据库关系。\n\n## 导航数据库关系\n\
  \nEntity Framework 最强大的功能之一是它能够自动创建 LINQ 对象，帮助你导航数据库中相关表之间的关系。\n\n在接下来的“尝试一下”（Try\
  \ It Out）中，你将添加两个与 `Book` 类相关的新类，以创建一个简单的书店库存报告。新类称为 `Store`（代表每家书店）和 `Stock`（代表现有库存——书店架子上的书籍以及向出版社订购的书籍）。这些新类及其关系的图表如图\
  \ 17-16 所示。\n\n![作为 store、stock 和 book 的新类及其关系截图](img/c17f016.png)\n\n**图 17-16**\n\
  \n每个商店都有一个名称、一个地址和一个 `Inventory` 集合，该集合由一个或多个库存对象组成，每个对象对应该商店经营的每种不同的书籍（标题）。`Store`\
  \ 和 `Stock` 之间的关系是一一对多。每个库存记录恰好对应一本书（`Book`）。`Stock` 和 `Book` 之间的关系是一一对一。你需要库存记录，是因为一家书店可能有某特定书籍的三本书，而另一家书店可能有同一本书的六本。\n\
  \n你将看到，通过代码优先（Code-First）方法，你只需要创建 C# 对象和集合，Entity Framework 就会为你创建数据库结构，并让你轻松地导航数据库对象之间的关系，然后查询数据库中的相关对象。\n\
  \n## 从现有数据库创建并查询 XML\n\n在最后一个示例中，你将结合所学的关于 LINQ、数据库和 XML 的知识。\n\n在接下来的“尝试一下”中，你将创建一个查询来查找上一个示例数据库中的某些数据，使用\
  \ LINQ to Entities 查询数据，然后使用 LINQ to XML 类将数据转换为 XML。这是数据库优先（Database-First）编程的示例，与代码优先相反，即获取一个现有数据库并从中生成\
  \ C# 对象。\n\n### 练习题\n\n1. **17.1** 修改第一个示例 `BeginningCSharpAndDotNet_17_1_CodeFirstDatabase`，提示用户输入标题和作者，并将用户输入的数据存储到数据库中。\n\
  2. **17.2** 示例 `BeginningCSharpAndDotNet_17_1_CodeFirstDatabase` 如果反复运行将创建重复记录。修改该示例以防止创建重复。\n\
  3. **17.3** 上一个示例 `BeginningCSharpAndDotNet_17_2_XMLfromDatabase` 中生成的 `BooksContext`\
  \ 类没有使用与之前示例相同的关系名称。修改 `BookContext` 类以使用相同的关系名称。\n4. **17.4** 创建数据库。\n\n\n\n\n\
  实际上，.NET Framework 从设计之初就是为了跨平台运行而设计的，它能够在不同类型的处理器（例如 `x86`、`ARM` 或 `x64`）上运行，并与其他编程语言进行互操作。.NET\
  \ Framework 预期的跨平台运行方式是首先编译成一种中间语言，通常被称为通用中间语言（`CIL`），以前称为微软中间语言（`MSIL`）。`CIL` 被认为是人类可读代码的最低级，然后它会被编译成原生代码（原生代码是直接由处理器执行的机器码\
  \ `[0s and 1s]`）。一旦编译成原生代码，指令就可以在目标平台和处理器上运行。最后，从 `CIL` 到原生代码的编译可以根据处理器的类型和版本进行优化。例如，英特尔酷\
  \ i5 处理器具有某些旧款奔腾 4 处理器不具备的特性和指令集。\n\n将 `CIL` 代码编译成原生代码的方法有两种方法：即时编译（`JIT`）或提前编译（`AOT`）。正如其名称所示的那样，`JIT`\
  \ 编译仅在执行程序集内容时发生。这意味着当你将 C# 代码部署到平台上时，在调用对特定方法的请求之前，它一直保持为 `CIL` 状态。程序集（或 `.dll`）会根据何时/是否被使用分批进行编译。这与\
  \ `AOT` 形成对比，在 `AOT` 中，你在部署之前就在目标平台和处理器类型将所有程序集编译成原生代码。用于 `AOT` 编译的工具被称为 `NGEN`。\n\
  \n.NET Framework 跨平台支持的前提是有一个通用语言运行时（`CLR`），它能够将 `CIL` 转换为在目标平台上运行所需的原生代码。`CLR`\
  \ 通常被称为“虚拟机”（注意不要与使用 `Hyper-V` 或 `VMMWare` 创建的 VM 混淆）。如果没有针对 Android、Apple OS 或\
  \ Linux 的 `CLR` 虚拟机，`CIL` 就无法在这些平台上进行编译和运行。由于这些虚拟机没有被完全创建或支持，这正是 `Mono`、`Xamarin`\
  \ 兴起以及最终创建 `.NET Standard` 和 `.NET Core` 框架的主要依据。\n\n最后，从互操作的角度来看，.NET Framework\
  \ 库可以使用许多语言进行消费，如 F#、`PowerShell`、`Eiffel`、`COBOL` 和 Visual Basic .NET。`互操作`的概念意味着如果一个模块（例如\
  \ `DLL` 文件）是用 F# 写的，那么该模块中的对象和方法就可以被任何支持的 CLI 语言（即 C#）编写的程序所消费。这种消费通过将 F# 模块作为引用添加到你的\
  \ C# 项目中，然后在 `.cs` 文件的顶部使用 `using` 指令声明该模块来实现。\n\n你现在知道 .NET Framework 最初的设计是用于跨平台运行的了，而这种设计意图通过\
  \ `CIL` 和 `CLR` 虚拟机来实现。本章的剩余部分将讨论发生从 .NET Framework 转向 `.NET Core` 的原因，并展示一些如何创建\
  \ `.NET Standard` 库和 `.NET Core` 项目的示例。你将在下一节开始学习一些“必须知道”的跨平台和开源术语。\n\n## 跨平台基础和关键“必须知道”术语\n\
  \n跨平台程序是指可以在多个操作系统上运行的程序，操作系统例如微软 Windows、Android、Mac OS 或 Linux。其目标是程序只需编写一次，在支持的操作系统上编译，并在部署时，代码在每个目标操作系统上的执行、执行和行为都是完全相同的。这在历史上是非常难以实现的，即使使用像\
  \ `Mono` 或 `Java` 这样的开源库也是如此，并且正如之前所述，使用完整的 .NET Framework 并不是真正可行的。\n\n| 关键术语 |\
  \ 描述 |\n| :--- | :--- |\n| .NET Native | 使用 `AOT` 编译。 |\n| API | 应用程序接口，用于描述程序的规模。\
  \ |\n| Assembly | `.dll` 或 `.exe` 文件。 |\n| BCL | 基础类库（BCL），是类的集合。 |\n| CoreCLR |\
  \ 运行时（Core Runtime）。 |\n| CoreFX | `System.*` 命名空间。 |\n| CoreRT | .NET Core 的运行时。\
  \ |\n| Cross platform | 编写一次并运行在任何平台。 |\n| Dependencies | 程序运行所需的特定集合。 |\n| Ecosystem\
  \ | 运行时、工具和软件。 |\n| Forking | .NET Core 的一个分支。 |\n| Framework/library | API 的包含性集合。\
  \ |\n| GitHub | 开源代码仓库。 |\n| Hardware platform | `X86`、`64 位`、`ARM` 等。 |\n| Metadata\
  \ | 提供其他数据的信息。 |\n| Metapackages | 具有相互依赖关系的包组。 |\n| NuGet | .NET 的包管理器。 |\n| Open\
  \ Source | 由软件开发者社区编写并支持。 |\n| Package | 程序集和元数据。 |\n| PCL | 可移植类库（PCL）。 |\n| Runtime\
  \ | 通用语言运行时（`CLR`）。 |\n| Semantic versioning | 格式为 `[主.次.补]` 的版本号概念。 |\n| Software\
  \ platform | 操作系统：Windows、Linux 等。 |\n| Stack | 用于构建和运行程序/解决方案的硬件、软件和生态系统。 |\n|\
  \ Standard | API 的正式规范或约定。 |\n| Target framework | 程序依赖的 API 集合。 |\n| TFM | 目标框架标记，目标框架的简写版本。\
  \ |\n\n\n\n\n| 术语 | 说明 |\n| :--- | :--- |\n| 版本 (Version) | Framework 的每个版本都包含新的或增强的\
  \ API 以及可能的错误修复。 |\n| 垂直领域 (Verticals) | Windows Forms, ASP.NET, WPF, WCF 等；通常称为应用模型。\
  \ |\n\n**表格 18-1:** 跨平台关键术语\n\n在充分理解这些关键术语后，是时候进入微软新的名为 `.NET Standard` 和 `.NET\
  \ Core` 的跨平台库和框架了。\n\n## 什么是 .NET Standard？\n\n在我们开始之前，重要的是自 2020 年发布 `.NET 5` 以来，从今起官方不再有\
  \ `.NET Framework`、`.NET Core` 和 `.NET Standard`；因此，本节的标题使用了过去式——“什么是 .NET Standard\
  \ ”。书中与这些术语相关的文字讨论仍保留在书中，因为学习 `C#` 和 `.NET` 的人肯定会遇到这些术语，并可能产生疑问。然而，`.NET Framework`、`.NET\
  \ Core` 和 `.NET Standard` 并没有完全消失。微软并没有保留这三个名称，而是将它们各自的能力合并到一个库中，并决定将其简单称为 `.NET`。从今以后，在引用\
  \ `.NET Framework`、`.NET Core` 和 `.NET Standard` 时，仅使用 `.NET` 术语。这反映了微软选择的最新路径。在引用旧的处理方法时，将使用旧名称。\n\
  \n将所有能力合并到单个 `.NET` 库的一个主要动力如图图 18-1 所示。注意，有许多垂直领域或应用模型是开发者和公司可以目标程序运行的平台。例如，`Windows\
  \ Forms`、`ASP.NET` 和 `WPF` 基于完整的 `.NET Framework`，而 `Windows Phone` 利用了 `.NET Compact\
  \ Framework`，而 `Universal Windows Apps` 则基于 `.NET Native` 库。\n\n`.NET Compact Framework`、`.NET\
  \ Core`、`.NET Microframework` 以及在图 18-1 中显示的其他都包含某种类型的基类库（BCL）能力，这些能力是从完整的 `.NET\
  \ Framework` 分支出来的。\n\n![.NET Compact Framework, .NET Core, .NET Microframework\
  \ 等其他的示意图](img/c18f001.png)\n\n**图 18-1**\n\n以 `.NET Microframework` 分支为例。这个分支带有精简的\
  \ `BCL`，是专门为在小型物联网 (IoT) 设备的限制内运行而创建的，因为对于该硬件平台来说，完整的 `.NET Framework` 内存占用空间太大了，无法作为一个可行的库。该框架版本对于这些小型设备来说消耗了太多的驱动器和内存空间。该分支减少了尺寸和内存要求，以便能够在该平台上适应并运行。为了减小\
  \ `.NET Microframework` 的尺寸，移除了一些完整 `.NET Framework` 中常见的特性。这些被最小化和/或修改的能力需要开发者学习该特定框架垂直\
  \ `BCL` 库的细微差别。每个应用模型都有略有不同的需求，这就是从 `.NET Framework` 分出大部分分支的原因。\n\n当开发者想要程序在 Windows\
  \ PC、Windows Phone 上运行并作为通用 Windows 运行时时，在历史上，有必要为这三个垂直领域中的每一个准备多个项目和源。如前所述，在大多数情况下，每个垂直领域\
  \ `BCL` 在功能实现上的差异是不同的，特别是在安全、网络、远程调用、反射和文件访问等案例中。这需要开发者学习、开发和支持每个垂直领域的 `BCL` 范围，这还为公司增加了额外成本。这些成本产生于必须开发、测试、部署和支持同一个程序的多个版本。\n\
  \n另请注意图 18-1 中，每个应用模型使用的每个 `.NET Framework` 运行时（Compact, Micro, Silverlight, Core\
  \ 等）对于在目标垂直领域和平台上成功运行程序仍然是必要的。当开发者决定目标针对某个垂直领域时，目标框架是在 `Visual Studio` 中创建解决方案和项目期间选定的。因此，每个垂直领域都将在其自己的运行时或虚拟机中执行，并且必须为目标应用模型进行编译，带有相关的依赖组件进行部署，并使用支持\
  \ `.NET Framework` 的语言进行编程。当目标是 `.NET Standard` 类库时，情况也是如此。\n\n## 共享项目、PCL 和 .NET\
  \ Standard\n\n在 `.NET Standard` 和可移植类库（PCL）之前（两者将在后文中描述），存在*共享项目*，在其中通常使用 `#if`、`#else`\
  \ 和 `#endif` 指令来识别代码运行在何种软件或硬件平台上，然后加载对应平台的正确程序集。例如，下面的代码段检查平台是否为 `.NET Framework\
  \ 4.0`。如果是，则使用对 `System.Net` 的引用；如果不是，则发生对 `System.Net.Http` 的引用。（代码假设没有早于 4.0 的\
  \ `.NET Framework` 版本。）在代码或类文件的后部分，开发者必须再次检查平台依赖并调用这些类中的方法来实现程序的目标，例如使用 `WebClient()`\
  \ 或 `HttpClient()` 方法。这些方法处理传入的 HTTP 请求和响应。根据 `.NET Framework` 版本，这两个方法有不同的实现。\n\
  \n```csharp\n#if NET40\n   using System.Net;\n#else\n   using System.Net.Http;\n\
  \   using System.Threading.Tasks;\n#endif\n```\n\n除了软件运行时验证外，开发者还可以使用那些指令（`#if`、`#else`\
  \ 和 `#endif`）来确定不同的硬件平台并根据结果加载特定的二进制文件：\n\n```csharp\n#if PLATFORM_X64\n   [DllImport(\"\
  BLIB64.dll\", CallingConvention=CallingConvention.Cdecl)]\n#else\n   [DllImport(\"\
  BLIB32.dll\", CallingConvention=CallingConvention.Cdecl)]\n#endif\n```\n\n使用 `#if`、`#else`\
  \ 和 `#endif` 指令提供跨平台支持从未是一种可靠、可扩展、可维护或易支持的方法。当软件或硬件组件更改时，程序会出现许多代码路径，并需要大量的更新和复杂的测试。随着针对多个垂直领域和平台的需求增加，市场需要一种新的跨平台支持解决方案。这种需求产生了可移植类库（PCL）的概念。PCL\
  \ 在很大程度上解决了扩展、维护、测试和支持性问题。在创建 PCL 时，开发者可以从垂直列表中选择目标（见图 18-2），工具（例如 `Visual Studio`）将为每个不同的应用模型生成特定的\
  \ `BCL` API。注意你还可以安装额外的目标，如 `Xamarin`、`Unity` 以及其他支持的完整 `.NET Framework` 版本。\n\n\
  ![添加可移植类库窗口的截图](img/c18f002.png)\n\n**图 18-2**\n\n\n\n\n如果你留在 Windows 堆栈和生态系统中，PCL（平台类库）运行良好。问题在于\
  \ Windows 操作系统具有该操作系统独有的功能。其中一个特性就是注册表，其他操作系统要么没有注册表，要么拥有类似但差异足够大的东西，导致无法与为读取和写入\
  \ Windows 注册表的 PCL 使用。此外，Windows 实现反射（reflection）的方式与其他操作系统不同，并且在应用域（即 `AppDomain`）方面有不同的概念，其中\
  \ `AppDomain` 是进程内部的一个隔离层。因此，使用 PCL 有助于解决为多个 Windows 垂直领域开发的问题，但无法实现完全的软件硬件跨平台支持。\n\
  \n解决方案是创建 .NET Standard 库并结合 .NET Core。.NET Standard 是一组 .NET API，旨在用于所有 .NET 垂直领域。如图\
  \ 18-3 所示，.NET Standard 替换了每个分支或框架垂直领域的各种特定 BCL（基础类库）的实现细节。.NET Standard 类库统一了所有\
  \ .NET Framework 垂直领域的 BCL。\n\n![.NET Standard 替换了每个分支或框架垂直领域的各种特定 BCL 实现细节的示意图。](img/c18f003.png)\n\
  \n**图 18-3**\n\n要详细查看 .NET Standard 2.1（这是最后一个支持的版本），请查看此页面：[`docs.microsoft.com/en-us/dotnet/standard/net-standard`](http://docs.microsoft.com/en-us/dotnet/standard/net-standard)。你现在应该对\
  \ .NET Standard 类库的用途以及行业向开源概念演进的一些历史有了一定程度的了解。在许多方面，.NET Standard 是一个桥梁，帮助开发者向这种开源、跨平台的解决方案移动。例如，如果开发者利用\
  \ .NET Core 1.0 并发现缺少某些功能，解决方案是在目标为 .NET Framework 的 .NET Standard 类中创建该功能。随着每次发布，.NET\
  \ Core 包含了越来越多在 .NET Framework 中找到的功能。.NET Core 5 是第一个与 .NET Framework 平齐的版本。\n\n\
  ### 构建和打包 .NET Standard 库\n\n.NET Standard 类库是一个 BCL，可以用于跨许多不同的垂直应用运行。在接下来的“试一试”中，你将创建一个包含处理手牌所需类的\
  \ .NET Standard 类库。\n\n## .NET 的引用与目标选择\n\n\n\n决定目标选择哪个版本的 .NET Standard 的因素取决于你的类库必须运行的平台和框架。请注意，如表\
  \ 18-2 所示，选择的 .NET Standard 版本越高，可用的功能越多，但结果该类运行的平台就越少。\n\n| 框架 (FRAMEWORK) | |\
  \ | | | | |\n| --- | --- | --- | --- | --- | --- | --- |\n| .NET Standard | 1.1\
  \ | **1.2** | 1.4 | 1.5 | 2.0 | 2.1 |\n| .NET | 5.0 | 5.0 | 5.0 | 5.0 | 5.0 | 5.0\
  \ |\n| .NET Core | 1.0 | **1.0** | 1.0 | 1.0 | 2.0 | 3.0 |\n| .NET Framework | 4.5\
  \ | **4.5.1** | 4.6.1 | 4.6.1 | 4.6.1 | none |\n| Mono | 4.6 | 4.6 | 4.6 | 4.6 |\
  \ 5.4 | 6.4 |\n| Xamarin.iOS | 10 | 10 | 10 | 10 | 10.14 | 12.16 |\n| Xamarin.Android\
  \ | 7.0 | **7.0** | 7.0 | 7.0 | 8.0 | 10.0 |\n| UWP | 10 | 10 | 10 | 10 | 10 | 10\
  \ |\n\n**表 18-2:** .NET Standard 支持版本摘要\n\n想象这样一个场景：你的 .NET Standard 类库需要运行，目标框架为\
  \ .NET Core 1.0、.NET Framework 4.5.1 和 Xamarin.Android 7.0。在这种情况下，.NET Standard\
  \ 类库必须目标为 .NET Standard 版本 1.2，因为该版本支持所有这些框架。考虑一种所有之前的框架都相同的场景，但 .NET Framework\
  \ 除外，后者需要目标为 4.5.1。由于 .NET Framework 需要目标为 4.5.1，.NET Standard 类库应该目标为 .NET Standard\
  \ 版本 1.2。.NET Standard 版本的包含了功能在 .NET Framework  . . . . . . . . . . . . . . .NET\
  \ . . . . . . . . . . . . . . . .NET，因此，降级级。 .NET Standard 版本的功能。\n\n\n\n\n有一个已经讨论过但值得再次提及的话题是：特定操作系统的特性（例如位于\
  \ `System.IO` 命名空间中的特性）必须针对目标操作系统编译的 `System.IO.dll` 进行编译。因此，如果你在 Linux 计算机上使用 Visual\
  \ Studio Code 创建了一个项目并包含 `System.IO` 命名空间，它将是能够在 Linux 操作系统上运行所需的版本。本节稍后将介绍的 NuGet\
  \ 将帮助确保你的项目获取正确的平台版本二进制文件。\n\n## 开源\n\n.NET 的源代码位于 [`github.com/dotnet/core`](http://github.com/dotnet/core)任何任何开发者（或任何能读懂代码的人）都可以查看它，并具体了解它的功能。此外，个人还可以与其他人合作，搜索、识别甚至修复代码中的\
  \ Bug 或问题。请注意，完整的 .NET Framework 源代码可以在 [`referencesource.microsoft.com`](http://referencesource.microsoft.com)\
  \ 找到，但它不是开源的，因此既无法对其进行分支（fork），也无法构建/编译该完整框架的版本。不要假设你必须克隆或下载 .NET GitHub 仓库并构建、编译它来使用它。如前所述，可以从这里下载并安装微软创建的稳定编译版本：[`dotnet.microsoft.com/download/dotnet`](http://dotnet.microsoft.com/download/dotnet)。\n\
  \n如果在 .NET 源码中发现某个方法或类，或者有你的应用程序优化运行所需的内容——这就是开源的酷酷之处——你可以添加它。在创建分支时，添加代码优化并让社区知道已完成此操作。如果优化被接受，它就可以被放入主分支并包含在下一个版本中。如果优化未被接受，你也可以仅为那个需要它的特定项目编译并构建一个\
  \ .NET 版本。\n\n最后，通过使 .NET 开源，微软真正投入了开发者和设计师的开放社区，为他们提供了一个极佳的机会来贡献、建立名声，并真正利用他们现有的技能做出贡献并促进职业发展。这种获取主要由微软开发者编写的代码的权限，在历史上对开放社区是封锁的。\n\
  \n## 针对云优化\n\n云优化型技术栈包含以下属性：\n\n*   可移植性 (Portability)\n*   可扩展性 (Scalability)\n\
  \    *   小巧且紧凑\n    *   模块化（并排执行）\n*   弹性性 (Resiliency)\n\n.NET 是可移植的，并且完全符合跨平台标准。由于其占用空间小，它也具有可扩展性，特别是与完整的\
  \ .NET Framework 相比。当 .NET 程序编译时，只有运行程序所需的二进制文件会被封装到程序集或可执行文件中，使其非常容易地复制到额外的云硬件上运行。由于\
  \ .NET 是完整 .NET Framework 的分支，而这是一个经过时间考验和高度工程化的编程库，因此代码对瞬时故障和处理异常具有弹性。更多信息请参阅第\
  \ 19 章中的“云模式和最佳实践”。\n\n.NET 运行时的的大小和速度也经过了优化，考虑到在云端客户根据使用量（即消耗）付费，这一点尤为重要。因此，如果程序占用空间小且运行快，所需的计算力就越少，成本也会降低。\n\
  \n## 性能\n\n与完整的 .NET Framework 相比，.NET 提供了许多性能改进。许多优化想法来自开源社区。现在，开发者不再需要绕过性能问题，而是可以查看导致缓慢的源代码并对其优化。检查\
  \ COREFX 和 CORECLR GitHub 仓库中包含“performance”的请求，你将发现数千处更改。部分示例见表 18-3。\n\n| 命名空间/模块\
  \ | 性能改进 |\n| --- | --- |\n| `System.Runtime.Serialization` | 12x |\n| `System.Security.Cryptography`\
  \ | 2x |\n| `System.IO.Compression` | 4x |\n| `System.Linq` | 高达 30x |\n| `System.Collections.Concurrent.CollectionBag<T>`\
  \ | 30% |\n| `System.Collections.Generic.List<T>` | 25% |\n| `System.Collections.Generic.SortedSet<T>`\
  \ | 600x |\n| `System.Collections.Generic.Queue<T>` | 2x |\n| `System.Text.RegularExpressions`\
  \ | 25% |\n\n**表 18-3：** .NET Core 相比 .NET Framework 的性能改进\n\n已经有了许多优化，随着更多的开发者和公司采用并贡献，该库将继续变得越来越好。访问\
  \ [`devblogs.microsoft.com/dotnet/performance-improvements-in-net-5`](http://devblogs.microsoft.com/dotnet/performance-improvements-in-net-5)\
  \ 可讨论 .NET 中的性能改进。\n\n## 模块化设计\n\n当创建一个新的 .NET 项目时（在稍后的“尝试”中完成），项目包含一组“标准”依赖项，当你展开依赖项\
  \ ➪ 框架 ➪ `Microsoft.NetCore.App` 时可以看到它们，如图 18-8 所示。尽管项目包含了 100 多个程序集，但只有运行程序所需的那些会被包含在程序集或可执行文件中，使其非常容易复制和运行。\n\
  \n![打开 NetCore.App 的快照](img/c18f008.png)\n**图 18-8** .NET 通过 NuGet 包分发。“标准”或默认程序集用于支持某些场景，例如开发者有一台未连接互联网因此无法下载包的计算机。\n\
  \n## 自包含部署\n\n完整的 .NET Framework 通常安装在运行程序的计算机或服务器上。这样做的好处是框架安装一次，所有应用程序都可以引用并使用，从而节省本地存储空间。然而，当所有应用程序引用相同的程序集并进行意外更新时，可能会发生不理想的情况。\n\
  \n在完整 .NET Framework 中，有两种不同的升级类型。它们是并排（side-by-side）和原地（in-place）。并排是一个主版本更改。例如，安装\
  \ .NET Framework 2.0 和 .NET Framework 4.0 将支持针对 2.0 或 4.0 的程序。当 CLR 和框架有重大修改或优化时，这种情况很常见。如果程序针对\
  \ .NET Framework 2.0 且安装了 .NET Framework 4.0，影响风险很小，因为是并排安装。相比之下，原地升级（例如从 .NET Framework\
  \ 4.5 升级到 .NET Framework 4.6.2）可能会包含 `mscorlib.dll` 以及其他 .NET 程序集的更改，而这些程序集是在针对\
  \ .NET Framework 4.x 的程序运行时运行的。\n\n.NET 通过自包含解决了这个问题，自包含也被称为*应用程序本地框架*。这意味着程序中引用的程序集都包含在模块或可执行文件中，在部署时，程序拥有运行所需的所有程序集（运行时、编译器和引用的框架组件）。程序不再依赖于机器范围内的任何\
  \ .NET Framework 安装，对机器范围的并排或原地 .NET 版本的任何修改都不会对 .NET 程序产生影响。\n\n\n\n\n\n这意味着，对于开发者和公司来说，一旦产品发布，就可以非常有信心地认为程序永远不会因为计算机或服务器上的框架升级而停止运行。在历史上，当发生破坏性升级（breaking\
  \ upgrades）时，开发者和 IT 支持人员通常会被召集到升级会议中，在危机状态下解决这一问题。这在企业中是非常复杂的情况，因为小组、团队和流程通常需要经过许多协议和批准才能在生产环境中进行更改。一种常见的做法是，一旦开发完成，代码的所有权就会移交给支持部门，这正是复杂性和审批流程的基础。这些限制条件使得情况变得更具挑战性。\n\
  \n当选择 `.NET` 作为目标框架时，这种危机模式的情况将不再发生。相反，升级将仅在应用层级进行，在那里可以提前进行充分的开发、集成和性能测试。如果在升级到新程序集版本的开发周期内确实出现了问题，开发者和公司就可以决定采取哪些行动。在开发环境中，决定升级代码以支持新版本或回滚到升级之前运行良好的版本，比在生产危机模式下要容易得多。\n\
  \n`.NET Standard` 类库较早就已经创建并打包好了；现在是时候使用它了。继续阅读以了解如何操作。`.NET` 是一个跨平台的开源应用程序框架。将此框架与\
  \ `.NET Standard` 类库结合使用，允许程序员编写一次 BCL（基础类库），并在所有支持的应用程序垂直领域中使用它。在 `.NET` 场景下，其优势是真正的跨平台支持。在接下来的“尝试尝试”中，你将创建一个\
  \ `Console Application` 来使用上一节创建的 `.NET Standard` 类库。该 `.NET` 控制台应用程序将处理一副扑牌。\n\n\
  到目前，讨论一直集中在创建新的 `.NET Standard` 类库和 `.NET` 上。下一节将讨论关于将最初针对完整版 `.NET Framework` 版本的程序迁移到\
  \ `.NET` 以实现跨平台运行的相关主题。\n\n# 从 .NET Framework 迁移到 .NET\n\n在阅读完 `.NET` 的所有优点后，你可能在想如何使用这个新库。如果现有程序使用完整版本的\
  \ `.NET Framework` 编写，那么将代码迁移到 `.NET` 是可行的。由于每个程序都有独特的限制和上下文，本节仅描述了迁移的一些基本思想和流程。在许多情况下，对于大型、复杂的程序，无疑需要并建议进行更多的分析、规划、代码开发和测试。\n\
  \n微软创建了一个名为 `.NET Portability Analyzer` 的工具，你可以在 Docs 上阅读关于它的信息，并可以在 Visual Studio\
  \ Marketplace 上下载。源代码在 GitHub 上可用。\n\n*   [`docs.microsoft.com/en-us/dotnet/standard/analyzers/portability-analyzer`](http://docs.microsoft.com/en-us/dotnet/standard/analyzers/portability-analyzer)\n\
  *   [`marketplace.visualstudio.com`](http://marketplace.visualstudio.com)\n*   [`github.com/Microsoft/dotnet-apiport`](http://github.com/Microsoft/dotnet-apiport)\n\
  \n`.NET Portability Analyzer` 将分析程序及其程序集，然后生成一份报告，识别出程序中任何当前不属于 `.NET` 的 API。一旦从\
  \ Marketplace 下载并安装，你就可以通过右键点击项目并从弹出菜单中选择 `Portability Analyzer Settings` 来配置分析器。结果将是一个如\
  \ 图 18-10 所示的窗口。\n\n![从弹出菜单中选择 Portability Analyzer Settings 的截图。](img/c18f010.png)\n\
  \n**图 18-10**\n\n此示例中的源程序是一个 `.NET Framework 4.7.2` 控制台应用程序，但源程序可以来自任何当前支持的平台。正如你在图\
  \ 8-10](#c08.xhtml_c08-fig-0010) 所示，目标平台是 `.NET`。点击 `OK` 按钮，然后右键点击项目并从弹出菜单中选择 `Analyze\
  \ Project Portability`。结果将是一个报告，显示你的当前项目与 `.NET` 之间发现的任何不兼容之处。你将看到检测到的问题及其描述的概述。这些描述对于解决每个特定识别出的问题非常有帮助。除了\
  \ `.NET Portability Analyzer` 外，还有一个名为 `.NET Upgrade Assistant` 的工具，你在计划迁移到 `.NET`\
  \ 时应该考虑使用它。在此处阅读更多相关信息：[`dotnet.microsoft.com/platform/upgrade-assistant`](http://dotnet.microsoft.com/platform/upgrade-assistant)。\n\
  \n从 `.NET Framework` 迁移到 `.NET` 时需要考虑的其他几点是：\n\n*   识别任何第三方依赖\n*   理解哪些功能可用\n* \
  \  升级当前的 `.NET Framework` 目标\n\n### 识别第三方依赖\n\n如前所述，`.NET` 可跨平台（Windows、Linux 或\
  \ MacOS）并跨多个芯片组（`x64`、`x86`、`ARM`）运行。`.NET` 程序集设计为针对这些目标编译时能够在这些平台上上工作并运行。然而，这并不意味着项目中包含的所有程序集都是如此。可能某个第三方包仅支持在\
  \ 32 位（`x86`）进程模式下运行，或者没有可以在 Linux 操作系统运行的包。在这种情况下，开发者必须找到替代方案或联系第三方询问是否有提供支持的计划。\n\
  \n### 理解哪些功能可用\n\n如果第三方程序使用了 Windows 特有的技术，如 `AppDomains`、`Remoting`、`File Access`、`Security`、`Registry`\
  \ 等，那么包含的程序集将无法按预期工作。这里有一个破坏变更列表：[`docs.microsoft.com/en-us/dotnet/core/compatibility/5.0`](http://docs.microsoft.com/en-us/dotnet/core/compatibility/5.0)。通过将此列表与\
  \ .NET Framework 程序中的代码进行对比，你可以更深入地了解迁移到 .NET 的工作量可行性，并实现跨平台的收益。\n\n### 升级当前的 .NET\
  \ Framework 目标\n\n除了将开发 IDE 升级到最新版本的 Visual Studio 外，计划迁移到 .NET 的团队还应该考虑目标 .NET\
  \ Framework 的最新版本。你应该在尝试迁移到 .NET 之前考虑这样做。例如，如果你的应用程序目标是 .NET Framework 4.5.1，那么迁移到\
  \ .NET Framework 4.8 再到 .NET 可能比直接迁移到 .NET 要容易得多。这是因为你减少了复杂性。通过从 `4.5.1` 迁移到 `.NET\
  \ Framework 4.8`，你将保持相同的运行时，因此只会遇到代码库问题，而不是可能出现的代码和运行时问题。确定问题的来源是复杂的，所以如果你能减少发生的地方，解决问题的概率会更高。\n\
  \n另一个原因是 `.NET Framework 4.8` 与在 .NET 中找到的代码非常接近。请记住 `.NET` 是开源的，并且经过了完全重写，而且它还有一个新的运行时。如果由于某种原因原始程序中的\
  \ API 不存在 .NET 中，你有以下选择：\n\n*   参考上一节“理解哪些功能可用”。\n*   确认该 API 在 Portability Analyzer\
  \ 报告中被识别。\n*   留在当前平台版本，直到该 API 被添加。\n*   寻找替代 API、第三方程序集或有助于解决问题并满足需求的 NuGet 包。\n\
  \n\n\n\n总之，当你尝试将应用程序迁移到新平台时，存在着极大的复杂性。你应该对现有程序进行分析，并将源程序中的功能映射到目标平台的功能上。然后，采取小小的、符合逻辑的步骤，不断排错并解决任何问题，直到你的代码在新版本上完全运行。大多数迁移都是独一无二的，这就是这里只提供指南的原因。聘请专门规划、设计、测试、执行和部署迁移项目的专业人士是很常见的。根据你的解决方案的复杂程度，你可以考虑这一点。\n\
  \n## Web 应用程序概述\n\nWindows Presentation Foundation (WPF) 及其前身 Windows Forms 是用于编写运行在\
  \ Windows 操作系统上的应用程序的技术。此外，已弃用的通用 Windows 应用程序 (UWA) 应用程序类型曾是编写可从 Microsoft Store\
  \ 下载并针对平板电脑或其他移动设备的应用程序的技术。通过 ASP.NET，开发者可以创建托管在互联网或局域网 Web 服务器上的 Web 应用程序，这些程序主要通过\
  \ HTTP 协议使用浏览器进行访问。\n\n本节提供了使用 ASP.NET Web Forms 和 ASP.NET Core 编写 Web 应用程序的概述。此外，由于\
  \ ASP.NET 有许多变体（例如 MVC、Web Forms、Web Pages 和 Web API），本文还描述了它们之间的差异以及使用每种变体的场景。此外，还展示并分析了\
  \ ASP.NET Web Site 和 ASP.NET Web Application 项目之间的区别。除了比较 ASP.NET 的变体和项目类型，还提供了关于\
  \ Web 控件、输入验证、状态管理和身份验证等主题的讨论。从下一节开始阅读什么是 Web 应用程序、它的优势及其独特的属性和特性。\n\nWeb 应用程序会导致\
  \ Web 服务器向客户端发送图形、HTML 和/或 JavaScript 代码。这些代码通常显示在 Web 浏览器中，例如 Microsoft Edge、Chrome\
  \ 或 Firefox。当用户在浏览器中输入 Web 地址（URL）并按回车键时，会向 Web 服务器发送 HTTP 请求。HTTP 请求可以包含像 `Default.aspx`\
  \ 的文件名以及其他信息，如 cookie、客户端支持的语言、安全令牌以及属于请求的其他数据。然后， Web 服务器返回包含 HTML 代码的 HTTP 响应。这些代码由\
  \ Web 浏览器解释，并向用户显示例如文本框、按钮和列表。如果 HTTP 响应中包含 JavaScript，该代码将在加载时在客户端运行，或在发送下一个 HTTP\
  \ 请求之前执行验证。例如，JavaScript 可能会在点击提交按钮时确认文本框中是否存在值。在随后编写 ASP.NET Web Form (ASPX) 和\
  \ ASP.NET Core 应用程序时，请注意 ASP.NET `Page` 对象及其属性。事实上，`Page` 属性中的两个是 `Request` 和 `Response`。\n\
  \nASP.NET 是一种使用服务器端代码动态创建 Web 页面的技术。这些 Web 页面的开发方法与客户端 Windows 程序有许多相似之处。与其直接处理\
  \ HTTP 请求和响应并手动创建 HTML 代码发送到客户端，不如使用 ASP.NET 控件（如 `TextBox`、`Label`、`ComboBox` 和\
  \ `Calendar`），它们会自动创建 HTML 代码。要创建一个 `TextBox` 服务器端控件，请在 ASP.NET Web Form (ASPX)\
  \ 文件中添加以下内容：\n\n```\n<asp:TextBox ID=\"player1TextBox\" runat=\"server\"/>\n```\n\
  \n要使用 Razor 语法（在本稍后及第 19 章](#c19.xhtml) 中再次介绍）实现相同效果，请使用此语法：\n\n```\n@Html.TextBox(\"\
  player1TextBox\")\n```\n\n在每种情况下，当对这些代码片段的文件发出 HTTP 请求时，代码会执行，并向客户端返回一个包含该控件 HTML\
  \ 表示的 HTTP 响应。图 18-11 展示了请求从浏览器到 IIS 服务器再返回的流向。\n\n![请求从浏览器到 IIS 服务器再返回的流向示意图。](img/c18f011.png)\n\
  \n**图 18-11**\n\n## 应使用哪种 ASP.NET 以及为什么\n\n在解决方案架构师或程序员决定运行其程序的最佳平台是网站之后，下一个问题是目标应该是哪种变体的\
  \ ASP.NET。微软 Web 开发平台的第一迭代是 Active Server Pages 或 ASP。Razor 使用了包含在 `.asp` 文件中的类\
  \ ASP 语法，并且通常包含一个使用 `Service.CreateObject()` 进行初始化的嵌入式 VB COM 对象，该对象提供了通过 API 暴露的方法引用。尽管\
  \ ASP 仍然是一项受支持的技术，但它不会是创建任何新 Web 基础程序的推荐应用程序类型。\n\n当 .NET Framework 在 21 世纪初创建时，ASP\
  \ 的自然演进是在更新 ASP 时利用该框架，ASP 被重命名为 ASP.NET。主要的变化是表示层（`.aspx` 文件）与业务逻辑层（`aspx.cs` 或\
  \ `aspx.vb` 文件）的分离，通常称为代码后台（code-behind）。代码后台中支持的语言是 C# 和 VB.NET，ASP.NET 模型被称为 Web\
  \ Forms。ASP.NET Web Forms 过去是现在仍然创建针对 IIS 和 Windows Server 操作系统的功能友好且高度复杂的应用程序的有效且完全支持的技术。在多年的工程和功能改进中，人们发现\
  \ ASP.NET Web Forms 显得有些“笨重”。“笨重”具体意味着什么，将在稍后描述，但这种“笨重”的标签导致了新的 ASP.NET 变体的开发，即\
  \ ASP.MVC。\n\nASP.NET MVC 中的 MVC 代表 Model-View-Controller（模型-视图-控制器）。如之前所述，ASP.NET\
  \ Web Forms 将 ASP 代码分为两个层：表示层和业务逻辑层。现在，MVC 将其分为三层：\n\n*   Model（模型）：业务层\n*   View（视图）：表示层\n\
  *   Controller（控制器）：输入控制层\n\nASP.NET MVC 是 ASP.NET Web Form 模型的逻辑演进，但请注意 ASP.NET\
  \ MVC 在设计、支持概念和实践上有显著不同。\n\nASP.NET Core 对齐 .NET，就像 ASP.NET 对齐 .NET Framework 一样。ASP.NET\
  \ Core 像 .NET 一样是一个开源框架和平台，可以针对 Microsoft Windows 以外的操作系统，例如 Linux 或 MacOS。ASP.NET\
  \ Core 支持 Web 应用程序和 Web 应用程序（模型-视图-控制器）项目类型。虽然 ASP.NET Core Web 应用程序类似于 ASP.NET\
  \ Web Pages 变体，并小型网站开发者提供了一种更简单、不复杂的实现，但 ASP.NET Core Web 应用程序 (MVC) 为跨平台运行 Web\
  \ 应用程序提供了完整的 MVC 能力。\n\n\n\n最后，ASP.NET Web API 就像一个暴露 API 的 `.dll`。它没有表示层；只有调用暴露的\
  \ API 方法并传递所需参数的能力。API 方法调用的结果是一个数据字符串。在 ASP.NET Web API 的上下文中，该字符串是 JSON 格式。调用客户端随后需要解析并以可用的形式呈现这些\
  \ JSON 数据。既然已经描述了微软 Web 框架的演进和演变，请继续阅读以了解为什么应该使用其中而非另一个。\n\n## ASP.NET Web Forms\n\
  \n选择 ASP.NET Web Forms 而不是其他框架是因为 Web Forms 具有以下特点：\n\n* 最适用于中小型开发团队和项目\n* 适用于需要在\
  \ HTTP 上维护会话（session）和状态（state）的 Web 应用程序\n* 基于一组非常主动的请求管道事件\n\n与其他 ASP.NET 版本相比，ASP.NET\
  \ Web Forms 是快速开发和部署功能丰富且高性能 Web 应用程序的最佳且最简单的方法。表示逻辑与业务逻辑的分离与前端、用户界面开发者和编码人员的特定技能集高度契合。这是最优的，因为团队可以安排专家并行处理项目的各个方面。\n\
  \n由于名为 `viewstate` 的功能，ASP.NET Web Forms 通常被认为是“沉重的”，它是 ASP.NET Web Form 中维护状态的一种方式。例如，考虑一个需要完成一系列页面并提交以下单的\
  \ Web 应用程序。如果客户端在过程中的某个点点击了后退按钮，`viewstate` 就是将之前表单中的内容重新填充为原始输入值的机制。`viewstate`\
  \ 功能的问题在于它可能被滥用（即过度使用），导致页面大小异常大，并在客户端和服务器之间来回。此外，`viewstate` 默认对 `Page` 启用，而不是仅对需要维护状态的\
  \ 页面控件启用。\n\n避免 `viewstate` 问题的最佳方法是通过将 `EnableViewState` 属性设置为 `false` 来在页面级别禁用它。如果你需要在\
  \ `TextBox` 上维护状态（例如），请使用以下代码段专门启用它。此外，监控 `.aspx` 文件的大小，以确保它们不会变得过大。\n\n```\n<asp:TextBox\
  \ EnableViewState=\"true\" ID=\"Name\" runat=\"server\"/>\n```\n\n在没有会话的情况下无法维护状态。维护会话源于客户端/服务器计算时代，当时计算机与服务器之间的连接是持久的。HTTP\
  \ 协议与无状态是同义词，最适合处理静态（即非动态）内容。\n\nASP.NET Web Forms 是动态的，因为在后代码文件（例如 `Default.aspx.cs`）中有\
  \ C# 代码，这些代码在文件被请求时执行。传递给浏览器的返回 HTML 极可能会由执行的 C# 代码根据客户端/用户的唯一输入进行更改。HTML 也可以根据会话\
  \ Cookie 中存储的内容对每个客户端有所不同。ASP.NET Web Form 程序员使用以下语法将信息存储在会话中：\n\n```\nSession[\"\
  username\"] = TextBoxUID.Text;\n```\n\n可以使用此代码在随后的 HTTP 请求中访问名为 `username` 的会话变量：\n\
  \n```\nvar username = Session[\"username\"];\n```\n\n最后，ASP.NET Web Forms 请求执行过程中的事件，例如\
  \ `BeginRequest`、`AuthenticateRequest`、`Init`、`Load`、`ProcessRequest` 和 `EndRequest`\
  \ 等，按名称完全直观。这很重要，因为当程序员想要对客户端验证执行某些特殊操作或在请求完成之前清理任何数据时，很容易识别放置代码的位置。接下来将继续详细讨论一些重要的\
  \ ASP.NET Web Form 概念。每种 ASP.NET 应用版本都有其独特之处（具体细节之前已讨论过）。阅读本节后，你将对以下 ASP.NET Web\
  \ Form 特性有深入理解：\n\n* 服务器控件\n* 输入验证\n* 状态管理\n* 身份验证和授权\n\n### 服务器控件\n\n在本节中，你将学习\
  \ ASP.NET 页面框架提供的服务器控件。这些控件旨在为 Web 应用程序编程提供一种结构化的、事件驱动的面向对象模型。表 18-4 列出了 ASP.NET\
  \ 可的一些主要 Web 服务器控件以及这些控件返回的 HTML 代码。\n\n| 控件 | HTML | 描述 |\n| --- | --- | --- |\n\
  | `Label` | `<span>` | 返回包含文本的 `span` 元素。 |\n| `TextBox` | `<input type=` \"text\"\
  \ `>` | 返回 HTML `<input type=` \"text\" `>`, 用户可以在其中输入某些值。当文本更改时，你可以编写服务端事件处理器。\
  \ |\n| `Button` | `<input type=` \"submit\" `>` | 将表单值发送到服务器。 |\n| `HyperLink` |\
  \ `<a>` | 创建引用 Web 页面的简单锚点标签。 |\n| `DropDownList` | `<select>` | 创建 `select` 标签，用户可以看到其中一个项目，并通过点击下拉列表选择多个项目中的一个。\
  \ |\n| `CheckBox` | `<input type=` \"checkbox\" `>` | 返回类型为 `check box` 的 `input`\
  \ 元素，显示一个可以选中或取消选的按钮。 |\n| `RadioButton` | `<input type=` \"radio\" `>` | 返回类型为\
  \ `radio` 的 `input` 元素。对于单选按钮，只能选择组中的一个。 |\n| `Image` | `<img src=\"\" `>` | 返回\
  \ `img` 标签以在客户端显示 GIF 或 JPG 文件。 |\n\n**表 18-4:** ASP.NET 服务器控件示例\n\n表中未显示还有许多额外的控件。然而，这些控件的共同点是都能触发由用户发起的事件，无论是自动触发还是作为页面生命周期的一部分。这些事件执行服务端事件处理器。你会发现\
  \ ASP.NET 应用程序很大程度上构建在这种事件驱动模型之上。\n\n### 输入验证\n\n当用户输入数据时，应对其有效性进行检查。检查可以在客户端和服务器同时进行。你可以使用\
  \ JavaScript 在客户端检查数据。然而，如果使用 JavaScript 在客户端检查数据，也应在服务器上进行检查，因为你永远无法完全信任客户端。浏览器可以禁用\
  \ JavaScript，黑客可以使用接受错误输入的不同 JavaScript 函数。在客户端检查数据可以获得更好的性能，因为在客户端验证之前，不会发生到服务器的往返。\n\
  \n使用 ASP.NET，你不需要自己编写验证函数。存在许多验证控件可以创建客户端和服务端的验证。以下示例显示了与文本框 `player1TextBox` 关联的\
  \ `RequiredFieldValidator` 验证控件。所有验证控件共有 `ErrorMessage` 和 `ControlToValidate` 属性。\n\
  \n\n\n\n```\n<asp:TextBox ID=\"player1TextBox\" runat=\"server\"></asp:TextBox>\n\
  <asp:RequiredFieldValidator ID=\"RequiredFieldValidator1\" runat=\"server\"\n  \
  \  ErrorMessage=\"Enter a name for player 1\" ControlToValidate=\"player1TextBox\"\
  >\n</asp:RequiredFieldValidator>\n```\n\n表 18-5 列出并描述了一些验证控件。\n\n| 控件 | 描述 |\n|\
  \ --- | --- |\n| `RequiredFieldValidator` | 指定被验证的控件必须输入内容。如果要验证的控件设置了初始值，且用户必须更改该值，您可以使用验证器控件的\
  \ `InitialValue` 属性设置此初始值。 |\n| `RangeValidator` | 定义用户可以输入的最小值和最大值。该控件的具体属性是 `MinimumValue`\
  \ 和 `MaximumValue`。 |\n| `CompareValidator` | 比较多个值（例如密码）。该验证器不仅支持比较两个值的相等性，还可以通过\
  \ `Operator` 属性设置额外的选项。`Operator` 属性的类型为 `ValidationCompareOperator`，它定义了枚举值，如 `Equal`、`NotEqual`、`GreaterThan`\
  \ 和 `DataTypeCheck`。使用 `DataTypeCheck` 可以检查输入值以确定其是否为特定数据类型；例如，正确的日期输入。 |\n\n**表\
  \ 18-5:** ASP.NET 验证控件示例\n\n### 状态管理\n\nHTTP 协议是无状态的。从客户端到服务器的连接在每次请求后都会关闭。然而，通常情况下，需要从一个页面记住某些客户端信息。有几种方法可以实现这一点。\n\
  \n保持状态的不同方法之间的区别在于状态是存储在客户端还是服务器上。表 18-6 显示了状态管理技术的概述以及状态的有效期。\n\n| 状态类型 | 客户端或服务器资源\
  \ | 有效时间 |\n| --- | --- | --- |\n| View State (视图状态) | 客户端 | 仅限单个页面。 |\n| Cookie\
  \ | 客户端 | 临时 Cookie 在浏览器关闭时删除；持久 Cookie 存储在客户端系统的磁盘上。 |\n| Session (会话) | 服务器 |\
  \ 会话状态与浏览器会话关联。会话会在超时后失效（默认为 20 分钟）。 |\n| Application (应用程序) | 服务器 | 应用程序状态在所有客户端共享。该状态有效直到服务器重启。\
  \ |\n| Cache (缓存) | 服务器 | 与应用程序状态一样是共享。开发者可以控制缓存何时失效。 |\n\n**表 18-6:** ASP.NET Web\
  \ Forms 状态管理技术\n\n### 身份验证与授权\n\n为了确保网站的安全，使用身份验证来验证用户是否有有效登录，而授权则确认经过身份验证的用户可以使用资源。Web\
  \ 常用的身份验证技术是 Forms 验证和 Windows 身份验证。Windows 身份验证利用 Windows 账户和 IIS 来验证用户，而 Forms\
  \ 验证需要一个包含用户访问信息的数据库。\n\nASP.NET 拥有许多用于用户身份验证的类。通过 ASP.NET，可以使用许多安全控件，如 `Login`\
  \ 和 `PasswordRecovery`。这些控件利用 Membership API。通过 Membership API，可以创建和删除用户、验证登录信息或获取当前登录用户的信息。Membership\
  \ API 使用成员提供程序（membership provider）。从 ASP.NET 4.5 开始，存在不同的提供程序来访问 Access 数据库、SQL\
  \ Server 数据库或活动目录（Active Directory）。还可以创建一个访问 XML 文件或任何自定义存储的提供程序。\n\n### ASP.NET\
  \ 网站与 ASP.NET Web 应用程序\n\n从历史上来看，如图 18-12 所示，新的 ASP.NET Web 应用程序有两种类型：项目（Projects）和网站（Web\
  \ Sites）。网站的概念已迁移到一个新模型中，称为单页应用程序（Single Page Applications）、Razor Pages 和 Blazor\
  \ Apps，这些将在后文中讨论。出于历史原因，仍然保留了网站，因为在生产环境中仍有许多网站，而且了解这些差异仍然具有价值。从进阶的角度来看，这些信息也可以增加价值，因为你可以意识到这项技术是如何演变而来的。\n\
  \n![新的 ASP.NET Web 应用程序有两种类型：项目和网站。](img/c18f012.png)\n\n**图 18-12**\n\n它们之间的差异如表\
  \ 18-7 所示。\n\n| 差异 | 项目 (Projects) | 网站 (Web Sites) |\n| --- | --- | --- |\n| 文件结构\
  \ | C# 项目有一个 `.csproj` 文件，其中包含运行程序所需的文件列表和程序集引用。 | 用 C# 创建的网站没有 `.csproj` 文件。目录结构中的所有文件都包含在站点中。\
  \ |\n| 编译 | 后代码文件（code-behind）被编译成单个程序集（`.dll`）。 | 代码在第一次被请求时动态编译。这通常会导致多个程序集（`.dll`）。\
  \ |\n| 部署 | 将程序集（`.dll`）、`.aspx` 和 `.ascx` 文件部署到使用应用程序的 Web 服务器上。 | 将 Web 应用程序源码副本部署到服务器上。\
  \ |\n\n**表 18-7:** 项目与网站的差异 |\n\n#### 文件结构\n\nC# 项目有一个 `.csproj` 文件，其中包含运行程序所需的文件列表和程序集引用。用\
  \ C# 创建的网站没有 `.csproj` 文件。目录结构中的所有文件都包含在站点中。`.csproj` 允许从项目中移除不会包含在部署中的文件，也不会将其删除，这在需要部署但某些文件尚未准备好时很有帮助。在没有\
  \ `.csproj` 文件的情况下（在网站上下文中），目录中的所有文件都被视为解决方案的一部分。此外，如你在上一章中所学习的，项目文件用于存储创建 NuGet\
  \ 包的 .NET 标准类。\n\n#### 编译\n\n在部署之前编译 Web 应用程序项目，可以节省在部署后第一次请求时编译 `.aspx` 文件及其后代码所花费的时间。虽然网站可以使用\
  \ NGEN 进行预编译，但那种预部署活动比简单地通过第一次请求让 ASP.NET 编译文件要复杂得多。\n\n#### 部署\n\n当被编译的程序集或 ASP.NET\
  \ 项目加载到内存中时，整个 Web 应用程序都会占用内存。相反，只有被请求的网站文件会被编译并加载到内存中。因此，对于一个只使用少数页面的项目，随着时间的推移，它占用的内存比网站更多，因为正如前面所述，只有被请求的文件会被编译并加载到内存中。当客户为云平台上的资源消耗付费时，这是一个重要的概念。\n\
  \n\n\n\n\n在 ASP.NET Web 应用程序项目的编译程序集（.dll）加载到 ASP.NET 运行时后，如果要对项目进行更改，必须停止 ASP.NET\
  \ 运行时进程并将其从内存中卸载，更改才能对使用该网站的客户端生效。如果进程拥有程序集的句柄（handle），则无法进行更改，因此必须停止以释放句柄。对于网站而言，情况并非如此，`.aspx.cs`\
  \ 或 `.aspx` 文件可以在不停止 ASP.NET 运行时的情况下进行更新，并在下一次请求它们时被编译并加载到内存中。\n\n## ASP.NET MVC/ASP.NET\
  \ Core Web App MVC\n\n选择 ASP.NET MVC 而非其他 ASP.NET 类型的某些原因包括：\n\n* 更适用于更大、更复杂的 Web\
  \ 应用程序\n* 与 `Entity Framework` (`EF`) 和模型绑定紧密耦合\n* 与测试驱动开发 (`TDD`) 深度集成\n\n此外，您知道选择\
  \ ASP.NET Core 以实现跨平台支持是非常重要的。\n\n正如前文所述，ASP.NET Web Forms 被拆分为两个独立的模块，而 MVC 则被分为三部分：`Model`（模型）、`View`（视图）和\
  \ `Controller`（控制器）（请参见图 18-13）。\n\n由于这种分离有助于 ASP.NET Web Forms 的相同原因，它也有助于 MVC。组件的分离允许较大的团队根据专业分进行分工，并并行开发应用程序，从而带来更快的开发周期。\n\
  \n`Entity Framework` (`EF`) 是一种对象关系模型 (`ORM`) 技术，在第 17 章中讨论过，它与 MVC 架构和模型绑定紧密耦合。ORM\
  \ 以及 `EF` 赋予了开发者以面向对象的方式设计数据库。例如，如果一个 MVC 旨在存储有关人员的信息，那么像下面的 `Person` 类就可以存储和检索这些信息：\n\
  \n```sharp\npublic class Person\n{\n  public string Name { get; set; }\n  public\
  \ int Age { get; set; }\n}\n```\n\n一旦设计好数据模型，开发者就可以模型和数据结构部署到数据库（如 `SQL Server`）中。数据库表、主键和外键是根据\
  \ C# 类描述生成的。在 Visual Studio 中创建 MVC 应用时，默认解决方案的一部分是一个名为 `Models` 的文件夹。这是数据库表的 C#\
  \ 类表示所在的位置。这些类用于将来自数据库的数据存储在内存中，以便控制器从视图更新时进行修改，每个应用在默认的 ASP.NET MVC 应用中也有一个名为 `Controllers`\
  \ 和 `Views` 的文件夹。\n\n![MVC 的示意图，分为三个部分：模型、视图和控制器。](img/c18f013.png)\n\n**图 18-13**\n\
  \n`controller`（控制器）是开发者放置代码的地方，通过 `EF` 逻辑和通过绑定的 `Model` 对象（如 `Person`）来创建、读取、更新或删除数据库内容。控制器也是执行应用程序所需的任何业务逻辑、身份验证或任何其他活动的地方。`view`（视图）是表现层，它将从客户端触发的并在控制器中使用面向对象模型执行的动作的输出结果呈现给客户端。\n\
  \nMVC 与测试驱动开发技术深度集成，与 ASP.NET Web Forms 相比，其单元测试要简单得多。如图图 18-14 所示，一旦创建了 ASP.NET\
  \ 应用，您就可以向解决方案添加一个单元测试项目，该项目与 ASP.NET MVC 模型紧密绑定。\n\n通过将测试代码放在 `Tests` 项目中，可以将如\
  \ `IIS`、数据库和外部类等依赖项从测试用例中抽象出来。这是一个重要且有益的特性，因为生产实例之间的数据通常不同，而且运行 `IIS` 的服务器构建在生产环境和测试环境之间也可能产生不一致的行为。移除这些依赖项——通过测试控制器内部的逻辑而不考虑依赖状态——可以提高测试的速度和效率。这是因为开发者不需要将所有依赖项都保持在有效且稳定的测试状态（这可能非常耗时），而只需专注于确保测试场景能够成功完成。\n\
  \n![创建 ASP.NET 应用的快照。](img/c18f014.png)\n\n**图 18-14**\n\nMVC 利用无扩展名的 URL（`extension-less\
  \ URLs`）：请求中不放置特定的文件名。ASP.NET Web Form 应用请求的是 `.aspx` 文件，但 MVC 并非如此。MVC 使用 `routes`（路由）或\
  \ `routing`（路由）的概念，使用 URL 段而不是文件名来将请求路由到正确的控制器和视图。例如，对 `/Home/About` 的请求将执行名为 `HomeController`\
  \ 的控制器中的 `About()` 方法，该控制器位于 `Controllers` 文件夹中。`About()` 方法的结果将使用 `Views\\Home`\
  \ 目录下名为 `About.cshtml` 的视图呈现给客户端。\n\n## ASP.NET Core Web API\n\n选择 ASP.NET Web API\
  \ 的优势与 ASP.NET MVC 应用类似，因为应用程序类型与 `EF` 紧密耦合，深度集成到 `TDD` 概念，并且适用于大型复杂的 Web 应用程序。主要的区别在于\
  \ ASP.NET Web API 项目中没有 `View` 组件或 `Views` 文件夹。\n\n## ASP.NET Core Web App\n\n选择\
  \ ASP.NET Web API 的优势与 ASP.NET MVC 应用类似，因为应用程序类型与 `EF` 紧密耦合，深度集成到 `TDD` 概念，并且适用于大型复杂的\
  \ Web 应用程序。之前已经讨论过 `.NET` 的优势、差异和用例。请注意，`.NET` 带来的优点也存在于 ASP.NET Core 中。以下是优势的示例：\n\
  \n* ASP.NET Core 跨平台运行\n* ASP.NET Core 不依赖于 `IIS`\n* ASP.NET Core 不依赖 `.NET Framework`；相反，它基于开源的\
  \ `.NET`\n* ASP.NET Core 针对云进行了优化且性能更高\n\n与 .NET 类似，ASP.NET Core 可以在 Windows 以外的操作系统（如\
  \ MacOS 和 Linux）上运行。历史上，当讨论任何 ASP.NET 应用时，它无疑是绑定于信息服务（IIS）。ASP.NET Core 包含一个名为 `Kestrel`\
  \ 的新 Web 服务器，在本章的“IIS 和 Kestrel”节中进行了详细介绍。ASP.NET Core 可以作为反向代理运行在 IIS 上，也可以在仅运行\
  \ `Kestrel` 的自包含容器中。\n\nASP.NET Core 不需要也不依赖完整的 `.NET Framework` 库。相反，像 `.NET` 一样，只有执行程序所需的程序集被包含在应用程序中。模块化、高性能且自包含的应用程序包是部署到服务器或云平台执行的。由于\
  \ ASP.NET Core Kestrel 在大小和代码执行路径上的优化，与 ASP.NET 4.8 Web Forms 相比，其处理每秒请求的能力性能提升了\
  \ 5.5 倍。\n\n\n\n\n\nRPS 测试是在相同的 Windows Server 操作系统上进行的，具有相同的内存、CPU 速度/类型以及网络适配器。因此，性能差异专门源于该类型应用程序现有的优化和执行效率。\n\
  \n本节讨论了许多 ASP.NET Core 概念。本节最核心的概念是 ASP.NET Core 可以跨平台运行。类似于 `.NET` 应用程序，`ASP.NET\
  \ Core` 网站除了 Microsoft Windows 之外，还可以运行在 Linux 和 MacOS 上。因此，如果 Web 应用程序需要跨平台运行，这就是你应该开发的\
  \ ASP.NET 版本。无论 Web 应用程序的目标是否仅在 Microsoft Windows 上运行，你都应该采用 ASP.NET Core 应用程序，如图\
  \ 18-15 所示。\n\n![ASP.NET Core 快照。](img/c18f015.png)\n\n**图 18-15**\n\n你将在本节中学习到以下\
  \ ASP.NET Core 细节：\n\n*   IIS 和 Kestrel\n*   Blazor App 和 Razor Pages\n*   输入验证\n\
  *   状态管理\n*   身份验证与授权\n*   依赖注入\n\n### IIS 和 Kestrel\n\n到目前，当开发者谈论 ASP.NET 版本时，人们认为\
  \ Web 应用程序将运行在带有 Internet 信息服务 (`IIS`) 的 Microsoft Windows 服务器上，`IIS` 是微软开发的 Web\
  \ 服务器，用于响应客户端的 HTTP 和 HTTPS 请求。然而，由于 `IIS` 不运行在 Linux 或 MacOS 上，因此需要一种方法让 `IIS`\
  \ 将请求发送到可以在这些操作系统运行的 Web 服务器。答案是使用 `Kestrel`，这是一个包含在 `ASP.NET Core` 项目中的新类型跨平台 Web\
  \ 服务器。\n\n如图 18-16 所示，当 `Kestrel` 配置为与 `IIS` 一起运行时，客户端的 HTTP 请求将被简单转发到 `Kestrel`\
  \ Web 服务器。然后 `Kestrel` 通过传递 `HttpContext` 类与 `ASP.NET Core` 源代码交互，该类包含了有关 HTTP 请求的特定\
  \ HTTP 信息（例如会话管理信息、查询字符串、文化信息、客户端证书以及更多更多信息）。\n\n![当 Kestrel 配置为与 IIS 一起运行时，客户端的\
  \ HTTP 请求被转发到 Kestrel Web 服务器的示意图。](img/c18f016.png)\n\n**图 18-16**\n\n除了 `IIS`，`Apache`\
  \ 和 `Nginx` 都是仅运行在其目标操作系统（如 Windows、Linux 或 MacOS）上的功能性 Web 服务器。`ASP.NET Core` 可以在没有特定操作系统的\
  \ Web 服务器的情况下运行，因为 `Kestrel` 本身就是一个 Web 服务器。以这种方式运行通常被称为*自托管*（self-hosting），因为 Web\
  \ 应用程序和运行所需的组件被封装在一个专用容器中。以这种方式将 Web 应用程序打包易于使用 `XCOPY` 等工具进行部署，而移植性是云优化程序的基本特性，这在第\
  \ 19 章中有更详细的描述。\n\n### Blazor App 和 Razor Pages\n\n技术不断演进，因此用于与这些技术进步交互的工具也必须演进。通过阅读本章，你已经学习了最早的微软\
  \ Web 编码模式，称为应用服务器页面 (`ASP`)，然后是 `ASP.NET Web Forms`，最后直到我们今天所处的 `ASP.NET Core`。这些演进不仅仅是名称的改变；在背后，你会发现数据绑定和呈现方法发生了许多变化。早期\
  \ Web 应用程序时代的一个变化示例是，在使用 `C#` 执行代码并在浏览器上渲染之后需要执行某些活动。另一个是表示层与业务逻辑代码分离，使得 Web 应用程序更易管理。这种将\
  \ Web 应用程序拆分为这些不同组件的分离是通过模型-视图-控制器 (`MVC`) 模型实现的。\n\nWeb 应用程序的视图或页面引擎是你在历史上找到 Razor\
  \ 语法的地方；它是你在处理 `ASP.NET Core` 应用程序时使用的工具。在第 19 章中，你将创建一个 `ASP.NET Core` Web 应用程序并在\
  \ `Index.cshtml` 文件中添加 Razor 语法。在页面中引用变量时，在 Razor 之前，表示层的标记语法类似于 `<%= %>`，这是五个字符。Razor\
  \ 的改进在于使用 `@` 符号来表示代码的起始点或设置变量的引用。你将在 `Blazor` 中发现使用 `@code` 的类似实现，它用于表示页面上需要执行的代码。本节剩余部分将讨论这两种语法之间的差异，并提供更多关于\
  \ `Blazor` 的细节，以便你更好地理解它们的优点以及何时应该使用它们：\n\n*   Blazor 对比 Razor\n*   Blazor Server\
  \ 对比 WebAssembly\n\n开始比较 Blazor 和 Razor 的最佳方法是定义它们。Razor 语法增加了开发者创建运行模型-视图-控制器模型应用程序的速度。Razor\
  \ 语法允许你使用类似的 `C#` 语法引用依赖项，如下：\n\n```csharp\n@using BeginningCSharp\n```\n\n随后在同一个\
  \ `.cshtml` 文件中，你可以引用所引用的程序集中的类和方法：\n\n```html\n<label id=\"labelPlayer1\">Player1</label>\n\
  <!-- 假设此处有在 .cshtml 文件中引用的逻辑 -->\n```\n*(注：由于原文示例 HTML 结构不完整，此处保持语意翻译并对齐)*\n\n\n\
  \n\n\n代码段还设置了 `players` 的名称，并为他们每个人分发了一手牌。将手牌渲染到浏览器中对于 Razor 和 Blazor 来说是相同的，之前已经使用\
  \ `@foreach` 语句和 HTML 展示了这一点。\n\nBlazor WebAssembly 让我联想到如 `ActiveX` 或 `Silverlight`\
  \ 等遗留技术，在这三种情况下，浏览器都会下载一个程序集并在客户端运行。运行 Blazor WebAssembly 通常意味着大部分业务逻辑都是通过 HTTP\
  \ 协议使用 API 进行引用的。`REST API` 和 `ASP.NET Web API` 概念将在第 20 章 中进一步讨论。这意味着 Blazor WebAssembly\
  \ 内部的代码通常执行客户端任务——这些这些任务在历史上是使用 JavaScript 完成的，例如输入验证或身份验证。需要复杂算法的数据处理或业务流程等活动仍留在服务器端。本章的剩余部分将关注\
  \ ASP.NET Core Web 应用程序。\n\n## 输入验证\n\nASP.NET Core 程序的验证是使用 `System.ComponentModel.DataAnnotations`\
  \ 命名空间中的验证属性进行配置的。验证器在特定模型的类定义中进行配置：\n\n```\npublic class Player\n{\n    [StringLength(20,\
  \ MinimumLength = 3)]\n    [Required]\n    public string Name { get; set; }\n}\n\
  ```\n\n当对绑定到定义的 `Player` 模型的发起请求时，ASP.NET Core 运行时会生成 jQuery 客户端验证语法。然后，如果用户尝试提交一个未提供\
  \ `Name` 值的表单，将在客户端进行验证并渲染错误。\n\n表 18-9 列出并描述了一些 ASP.NET Core 数据注解验证属性。数据注解是内置的验证属性，在设计时应用以强制执行预期的验证。查看之前的代码段，你将看到\
  \ `[Required]` 数据注解。这意味着在实例化玩家时，你必须提供玩家的 `Name`。\n\n| 控件 | 描述 |\n| --- | --- |\n\
  | `Required` | 表示该属性是必填的。 |\n| `StringLength` | 定义了用户必须满足的最大值和可选最小值。 |\n| `Range`\
  \ | 对于数值字段，可以设置最大值和最小值。 |\n| `EmailAddress` | 确认输入的值具有有效的电子邮件地址格式。 |\n| `DataType`\
  \ | 确认输入的值是特定类型，如 `Date` 或 `Currency`。 |\n| `RegularExpression` | 确认输入的值符合正则表达式语法。\
  \ |\n\n**表 18-9:** ASP.NET Core 验证属性示例\n\n## 状态管理\n\n如前所述，HTTP 协议是无状态的，这意味着一旦服务器成功响应了请求，就不会存储任何关于发送请求的客户端的信息。连接在每次请求后都会关闭并遗忘。然而，在管理来自客户端的多个请求时，经常需要持久化并重用某些客户端信息。与其他\
  \ ASP.NET 版本一样，在使用 HTTP 时有多种方法可以实现状态信息的管理。表 18-10 显示了状态管理技术的概述以及状态可以有效多久。\n\n| 状态类型\
  \ | 客户端或服务器资源 | 有效时间 |\n| --- | --- | --- |\n| TempData | 服务器 | 一旦数据被应用程序读取后就会删除。\
  \ |\n| Query strings | 两者 | 作为 URL 元素在客户端和服务器之间传递，仅在单次请求期间可用。 |\n| Cookie | 客户端\
  \ | 临时 Cookie 在浏览器关闭时删除；持久 Cookie 存储在客户端系统的磁盘上。 |\n| `HttpContext.Items` | 两者 |\
  \ 在客户端和服务器之间传递，存储在 `HttpContext` 对象中，仅在单次请求期间可用。 |\n| Cache | 服务器 | 与应用程序状态一样，缓存是共享的。然而，对于缓存何时应该失效有更好的控制。\
  \ |\n| Session | 服务器 | 会话状态与浏览器会话关联。会话通过超时超时设置失效。 |\n| Application | 服务器 | 应用程序状态在所有客户端之间共享。该状态一直有效到服务器重启。\
  \ |\n\n**表 18-10:** ASP.NET Core 状态管理技术\n\n## 身份验证与授权\n\n由于 ASP.NET Core 不专注于单一操作系统，身份验证和授权协议也必须跨平台工作。最流行的开源身份验证提供程序是\
  \ `OWIN` 和 `OAuth`。`OWIN`（全称 .NET 开放 Web 接口）本身并不是身份验证提供者；但它通常与 `Katana` 相关，而后者是。`OWIN`\
  \ 是一个规范，详细说明了 Web 服务器和 Web 应用程序如何相互解耦。`OWIN` 消除了 ASP.NET Core 对 `IIS` 的依赖，并帮助通过\
  \ `Kestrel` 实现自托管成为现实。`Katana` NuGet 包包含了实现 Windows 和 Forms 等许多类型身份验证所需的库。\n\n`OAuth`\
  \ 是由微软、Facebook、Twitter、Google 等公司暴露的接口，供 Web 应用程序进行身份验证。运行在移动设备或浏览器中的应用程序中提示客户端使用\
  \ Facebook 或 Microsoft 凭据访问网站是常见的。在这些情况下，`OAuth` 就是正在使用的协议。将 `OAuth` 实现到 ASP.NET\
  \ Core Web 应用程序中的类和方法位于 `Microsoft.AspNetCore.Authentication` 命名空间中。使用 `OAuth` 进行身份验证的客户端使用\
  \ JSON Web Token (`JWT`) 格式的持持令牌。\n\n*身份验证*是确认个人确实如他们所说的过程。通常当有人创建一个新账户时，它会与电子邮件地址和密码关联。验证电子邮件将发送到提供的邮箱，一旦点击，注册即完成。从那时起使用该电子邮件和密码访问资源将验证其确实是创建该账户的人。过程的另一部分是授权。*授权*是定义授权人员可以访问哪些功能或内容的过程。这通常被称为声明（claims）。\n\
  \n在最简单的形式中，某些源代码检查声明的存在，例如针对 `DealCard()` 方法，如果声明存在，则可以从请求的纸牌员调用该方法：\n\n```\nprinciple.FindFirst(c\
  \ => c.Type == \"DealerID\");\n```\n\n声明也可以用键值对表示，以提供对资源的更精细粒度的访问权限：\n\n```\npolicy.RequireClaim(\"\
  DealerID\", \"1\", \"2\", \"3\", \"4\", \"5\"));\n```\n\n这显示 `DealCard()` 方法仅对 `DealerID`\
  \ 等于 1, 2, 3, 4 或 5 的纸牌员可用。\n\n## 依赖注入\n\n依赖注入（DI）是一个非常高级的主题，但它是构建 ASP.NET Core\
  \ 的基础概念，因此在这里将进行简单介绍。涉及依赖注入的 Basic 要点是避免使用 `new` 关键字：\n\n```\nPlayer[] players =\
  \ new Player[2];\n```\n\n\n\n\n避免使用 `new` 的原因是因为它将程序永久地绑定到它引用的类上。在类修改概率极小的情况下，使用\
  \ `new` 是可以接受的，在这种情况下使用该关键字是一种设计决策。替代方案是实现接口，这在第 9 章、第 10 章和第 12 章中讨论过。接口将消费者与提供者松耦合或解耦，程序是消费者，类是提供者。如下代码段所示，在不使用\
  \ `new` 关键字的情况下使用了 `Player`：\n\n```\npublic interface ICardGameClient\n{\n    void\
  \ Player(string Name);\n}\npublic class PlaySomeCards\n{\n    private readonly ICardGameClient\
  \ _cardGameClient;\n    public PlaySomeCards(ICardGameClient cardGameClient)\n \
  \   {\n        _cardGameClient = cardGameClient;\n    }\n    public PlayHand\n \
  \   {\n        _cardGameClient.Player(\"Benjamin\");\n    }\n}\n```\n\nDI（依赖注入）更进一步，使用了被称为工厂或容器的机制。ASP.NET\
  \ Core 默认支持 DI，并配置在创建 ASP.NET Core Web 应用时生成的 `Startup.cs` 文件中。该文件包含名为 `ConfigureServices()`\
  \ 的方法，是配置提供者的地方：\n\n```\npublic void ConfigurServices(IServiceCollection services)\n\
  {\n    services.AddMvc();\n    services.AddDbContext<className>(options => ...\n\
  \    services.AddIdentity<className1,className2>()...\n    ...\n}\n```\n\n`ConfigureServices()`\
  \ 方法中配置的服务提供者会在程序内部运行的代码请求 `className` 时提供该类的实例。\n\n## 本章你学到的内容\n\n| 主题 | 核心概念 |\n\
