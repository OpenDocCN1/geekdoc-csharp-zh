  | 桌面应用程序 | 桌面应用程序是具有标准 Windows 应用程序外观和感觉的应用，包括熟悉的最大化、最小化和关闭应用程序的图标。它们是在“新建项目”对话框中使用\
  \ `WPF  (.NET)` 模板创建的。 |\n\n# 3 变量与表达式\n\n### 本章代码下载\n\n本章的代码下载可以在书籍页面的[`www.wiley.com`](http://www.wiley.com)\
  \ 找到。点击`下载`链接。代码也可以在 [`github.com/benperk/BeginningCSharpAndDotNET`](http://github.com/benperk/BeginningCSharpAndDotNET)\
  \ 找到。代码位于 `Chapter03` 文件夹中，并根据章节中的名称单独命名。\n\n为了有效使用 `C#`，理解你在创建计算机程序时实际在做什么非常重要。对计算机程序最基础的描述可能是它是一系列处理数据的操作。即使对于最复杂的示例，包括庞大的多功能\
  \ Windows 应用程序（如 Microsoft Office 套件），也是如此的。尽管这通常对应用程序用户是完全隐藏的，但它一直在后台运行。\n\n为了进一步说明这一点，考虑你计算机的显示单元。你在屏幕上看到的内容往往如此熟悉，以至于很难将其想象成“动态画面”以外的东西。事实上，你看到的只是某些数据的表示，其原始形式仅仅是存储在计算机内存某处的一串\
  \ 0 和 1 的流。屏幕上的任何操作——移动鼠标指针、点击图标、在文字处理器中输入文本——都会导致内存中数据的移动。\n\n当然，更简单的情况也能很好地说明这一点。当使用计算器应用程序时，你提供数字作为数据，并对数字进行操作，这与你使用纸和笔的方式非常相似——但快得多，而且没有出错的机会！\n\
  \n如果计算机程序从根本上是对数据执行操作，这意味着你需要一种存储这些数据的方法以及一些操作它们的方法。这两个功能分别由`变量`和`表达式`提供，本章将从通用和具体的术语方面探索这意味着什么。\n\
  \n不过，首先，你将查看涉及 `C#` 编程的基础语法，因为你需要一个语境，以便在其中学习和使用 `C#` 语言中的变量和表达式。\n\n## 基础 C# 语法\n\
  \n`C#` 代码的外观和感觉类似于 `C++` 和 `Java`。这种语法起初看起来可能很困惑，不像书面英语。然而，当你沉浸在 `C#` 编程的世界时，你会发现这种风格是合理的，并且可以毫不费力地编写出易读的代码。\n\
  \n与 Python 等其他语言的编译器不同，`C#` 编译器忽略代码中额外的间距，无论它是来自空格、换行符还是制表符（统称为`空白字符`）。这意味着你在格式代码方面有很大的自由，尽管遵循某些规则可以帮助你的代码更容易阅读。\n\
  \n`C#` 代码由一系列`语句`组成，每个语句都以分号结束。因为空白被忽略了，多个语句可以出现在同一行，但为了可读性，通常会在分号后添加换行符，以避免多个语句出现在同一行。然而，使用跨越几行的语句也是完全可以的（也是常见的）。\n\
  \n`C#` 是一种`块结构语言`，这意味着语句是代码块的一部分。这些块用大括号（ `{` 和 `}` ）界定，可以任意数量的语句，或者一个都没有。注意，大括号字符不需要相应的分号。\n\
  \n例如，一个简单的 `C#` 代码块可以采取以下形式：\n\n```\n{\n   <code line 1, statement 1>;\n   <code\
  \ line 2, statement 2>\n      <code line 3, statement 2>;\n}\n```\n\n在这里，`<code\
  \ line x, statement y>` 部分不是实际的 C# 代码；这些文本被用作放置 C# 语句的占位符。在这种情况下，第二行和第三行代码属于同一个语句，因为第二行之后没有分号。对第三行代码进行缩进可以更容易识别出它实际上是第二行的延续。\n\
  \n\n\n\n\n以下简单示例使用了 `indentation`（缩进）来明确 C# 代码本身。这是一种标准做法，事实上，Visual Studio 默认就会为你自动完成这一点。通常情况下，每个代码块都有其自己的缩进级别，意味着它向右侧偏移的程度。代码块可以相互嵌套（即块中可以包含其他块），在这种情况下，嵌套的块将进一步进一步缩进：\n\
  \n```\n{\n   <code line 1>;\n   {\n      <code line 2>;\n      <code line 3>;\n\
  \   }\n   <code line 4>;\n}\n```\n\n此外，作为前几行代码的延续行通常也会进一步缩进，正如第一个代码示例中的第三行代码所示。\n\
  \n当然，这种风格绝非强制。然而，如果你不使用它，当你阅读本书的后续内容时，很快就会发现事情变得变得非常困惑！\n\n`Comments`（注释）是你在 C#\
  \ 代码中经常看到的其他内容。严格来说，注释并不是 C# 代码，但它们与代码和谐地共处。注释是自解释其的：它们允许你向代码中添加描述性文本——使用纯英语（或法语、德语、蒙古语等），而这些文本会被编译器忽略。当你开始处理很长的代码段时，添加关于你具体在做什么的提醒是非常用的，例如“这行代码向用户索要一个数字”或“这段代码是由\
  \ Benjamin 编写的”。\n\nC# 提供了两种方法来实现此点。你可以在注释的开头和结尾放置标记，或者可以使用一个表示“此行剩余部分内容都是注释”的标记。后一种方法是前面提到的关于\
  \ C# 编译器忽略换行符规则的例外，但它是一个特殊情况。\n\n要使用第一种方法指示注释，你可以在注释的开头使用 `/*` 字符，在结尾使用 `*/` 字符。这些可能出现在单行中，也出现在不同的行上，在这种情况下，中间的所有行都是注释的一部分。你在注释体中唯一不能输入的是\
  \ `*/`，因为它会被解释为结束标记。例如，以下内容是可以的：\n\n```\n/* This is a comment */\n/* And so. . .\n\
  \               . . . is this! */\n```\n\n然而，以下内容会导致问题：\n\n```\n/* Comments often\
  \ end with \"*/\" characters */\n```\n\n在这里，注释的结束（`*/` 之后的字符）将被解释为 C# 代码，并会导致错误。\n\
  \n另一种注释方法涉及以 `//` 开始注释。之后，你可以编写任何你喜欢的内容——只要保持在同一行即可！以下内容是可以的：\n\n```\n// This is\
  \ a different sort of comment.\n```\n\n然而，以下内容会失败，因为第二行被解释为 C# 代码：\n\n```\n// So\
  \ is this,\n   but this bit isn't.\n```\n\n这种类型的注释对于记录语句非常有用，因为它们都可以放在同一行中：\n\n\
  ```\n<A statement>;         // Explanation of statement\n```\n\n前面提到过注释 C# 代码有两种方法，但\
  \ C# 中还有第三种类型的注释——尽管严格来说这是对 `//` 语法的扩展。你可以使用以三个 `/` 符号（而不是两个）开头的单行注释，如下所示：\n\n```\n\
  /// A special comment\n```\n\n在正常情况下，它们会被编译器忽略——就像其他注释一样——但你可以配置 Visual Studio 在编译项目时提取这些注释后的文本，并创建一个特殊格式的文本文件。然后你可以使用它来创建文档。为了创建此文档，注释必须遵循\
  \ [`docs.microsoft.com/en-us/dotnet/csharp/programming-guide/xmldoc`](http://docs.microsoft.com/en-us/dotnet/csharp/programming-guide/xmldoc)\
  \ 中描述的 XML 文档规则——这个主题本书未涵盖，但如果你有空闲时间，非常值得学习。\n\n关于 C# 代码的一个 `very` 重要的一点是它是 `case\
  \ sensitive`（区分大小写的）。与其他某些语言不同，你必须使用完全正确的字符输入代码，因为使用大写字母代替小写字母会导致项目无法编译。例如，考虑来自第\
  \ 2 章的以下行代码：\n\n```\nConsole.WriteLine(\"The first app in Beginning C# Programming!\"\
  );\n```\n\n这段代码被 C# 编译器理解，因为 `Console.WriteLine()` 命令的大小写是正确的。然而，以下任何一行都无法工作：\n\n\
  ```\nconsole.WriteLine(\"The first app in Beginning C# and .NET!\");\nCONSOLE.WRITELINE(\"\
  The first app in Beginning C# and .NET!\");\nConsole.Writeline(\"The first app in\
  \ Beginning C# and .NET!\");\n```\n\n在这里，使用的大小写是错误的，所以 C# 编译器将不知道你想表达什么。幸运的是，你很快就会发现，Visual\
  \ Studio 在输入代码方面非常有帮助，在大多数时候它知道（在程序能知的范围内）你正在尝试做什么。当你输入时，它会建议你可能想要使用的命令，并尝试修正大小写问题。\n\
  \n##  C# 控制台应用程序结构\n\n在这里，你将更仔细观察第 2 章中的控制台应用程序示例（`ConsoleApp1`）并对结构进行简单的分解。以下是代码：\n\
  \n```\nusing System;\nnamespace ConsoleApp1\n{\n   class Program\n   {\n      static\
  \ void Main(string[] args)\n      {\n         // Output text to the screen.\n  \
  \       Console.WriteLine(\"The first app in Beginning C# and .NET!\");\n      \
  \   Console.ReadKey();\n      }\n   }\n}\n```\n\n你可以立即看到之前讨论的所有语法元素——分号、大括号和注释——以及相应的缩进。\n\
  \n现在最重要的代码部分是：\n\n```\nstatic void Main(string[] args)\n{\n   // Output text to\
  \ the screen.\n   Console.WriteLine(\"The first app in Beginning C# and .NET!\"\
  );\n   Console.ReadKey();\n}\n```\n\n这是运行你的控制台应用程序时执行的代码。嗯，更准确地说，大括号封装的代码块被执行。注释行什么都不做；它只是为了清晰。\n\
  \n概述应用程序功能的代码是非常用的功能。你可以使用 `#region` 和 `#endregion` 关键字使用该功能，它们定义了可以展开和折叠的代码区域的开始和结束。例如，你可以这样修改生成的\
  \ `ConsoleApp1`：\n\n```\n#region Using directives\nusing System;\n#endregion\n```\n\
  \n这允许你将代码折叠为一行，并在需要查看细节时再次展开。这里包含 `using` 语句以及下方的 `namespace` 语句将在章末进行解释。\n\n变量\n\
  \n正如前面提到的，变量与数据存储有关。基本上，你可以将计算机内存中的变量想象成放在架子上的盒子。你可以把东西放在盒子里并再次取出来，或者只是看一眼盒子里有什么。变量也是如此的；你可以将数据放入其中，然后将其取出或查看它们，视需要而定。\n\
  \n\n\n\n\n虽然计算机中的所有数据本质上都是同一种东西（一系列 0 和 1），但变量有不同的“风味”，被称为 `types`（类型）。再次使用盒子的类比，箱子有不同的形状和大小，因此某些物品只能放入某些箱子里。这种类型系统背后的逻辑是，不同类型的数据可能需要不同的处理方法，通过将变量限制在特定类型，你可以避免将它们混淆。例如，将构成数字图片的\
  \ 0 和 1 序列视为音频文件是没有任何意义的。\n\n要使用变量，你必须对它们进行 `declare`（声明）。这意味着你必须为它们分配一个 `name`（名称）和一个\
  \ `type`（类型）。在声明变量后，你就可以将它们作为存储单元，存储你声明存放的数据类型。\n\nC# 声明变量的语法仅指定了类型和变量名：\n\n```\n\
  <type> <name>;\n```\n\n如果你尝试使用一个未声明的变量，你的代码将无法编译，但在这种情况下，编译器会准确地告诉你问题所在，所以这并不是一个灾难性的错误。尝试在不赋值的情况下使用变量也会导致错误，但同样，编译器会检测到这一点。\n\
  \n### Simple Types\n\n简单类型包括数字和布尔（true 或 false）值等类型，它们构成了你应用程序的基础构建块。与复杂类型不同，简单类型不能有子项或属性。大多数可用简单类型都是数值型的，这初看起来似乎有点奇怪——无疑，你只需要一种类型来存储数字，不是吗？\n\
  \n之所以有这么多数值类型，是因为在计算机内存中将数字存储为一系列 0 和 1 的机制。对于整数值，你只需要取几个 `bits`（位，即可以是 0 或 1 的单个数字）并以二进制格式表示你的数字。存储\
  \ `N` 位的变量允许你表示 0 到 `(2^N − 1)` 之间的任何数字。任何大于此数值的数字都太大了，无法存放入该变量中。\n\n例如，假设你有一个可以存储\
  \ 2 位的变量。那么整数与表示这些整数的位之间的映射如下：\n\n```\n0 = 00\n1 = 01\n2 = 10\n3 = 11\n```\n\n为了存储更多数字，你需要更多的位（例如，3\
  \ 位允许你存储从 0 到 7 的数字）。\n\n这种系统的不可避免的结果是，你需要无限数量的位才能存储每一个想象中的数字，这无法放入你那可靠的 PC 中。即使对于每个数字都有可用的位数量，将所有这些位都用于一个例如只需要存储\
  \ 0 到 10 之间数字的变量，显然也是不高效的（因为会浪费存储）。在这里，4 个位就能很好地胜任工作，允许你在相同的内存空间内存储该范围内的更多值。\n\n\
  相反，可以使用几种不同的整数类型来存储不同范围的数字，它们占用不同数量的内存（多达 64 位）。这些类型如表 3-1 所示。\n\n| TYPE | ALIAS\
  \ FOR | ALLOWED VALUES |\n\n| --- | --- | --- |\n| `sbyte` | `System.SByte` | −128\
  \ 到 127 之间的整数 |\n| `byte` | `System.Byte` | 0 到 255 之间的整数 |\n| `short` | `System.Int16`\
  \ | −32768 到 32767 之间的整数 |\n| `ushort` | `System.UInt16` | 0 到 65535 之间的整数 |\n|\
  \ `int` | `System.Int32` | −2147483648 到 2147483647 之间的整数 |\n| `uint` | `System.UInt32`\
  \ | 0 到 4294967295 之间的整数 |\n| `long` | `System.Int64` | −9223372036854775808 到 9223372036854775807\
  \ 之间的整数 |\n| `ulong` | `System.UInt64` | 0 到 18446744073709551615 之间的整数 |\n\n####\
  \ Integer Types\n\n某些变量名前的 `u` 字符是 `unsigned`（无符号）的缩写，意味着你不能在这些类型中存储负数，如表 3-1 的\
  \ Allowed（允许值）列所示。\n\n当然，你还需要存储 `floating-point`（浮点）值，那些不是整数的值。可以使用三种浮点类型：`float`、`double`\
  \ 和 `decimal`。前两个以 `m × 2^e` 的形式存储点，其中 `m` 和 `e` 的允许值因类型而异。`decimal` 使用另一种形式 `m\
  \ × 10^e`。这三种类型如表 3-2 所示，其 `m` 和 `e` 的允许值，以及最后两列所示的实际意义上的限制。\n\n| TYPE | ALIAS FOR\
  \ | MIN M | MAX M | MIN E | MAX E | APPROX MIN VALUE | APPROX MAX VALUE |\n| ---\
  \ | --- | --- | --- | --- | --- | --- | --- |\n| `float` | `System.Single` | 0 |\
  \ 2²⁴ | −149 | 127 | 1.5 × 10^-45 | 3.4 × 10³⁸ |\n| `double` | `System.Double` |\
  \ 0 | 2¹⁰²⁴ | −1075 | 308 | 5.0 × 10^-324 | 1.7 × 10³⁰⁸ |\n| `decimal` | `System.Decimal`\
  \ | 0 | 2⁹⁶ | −28 | 28 | 1.0 × 10^-28 | 7.9 × 10²⁸ |\n\n#### Floating-Point Types\n\
  \n除了数值类型还有三种简单类型（见表 3-3）。\n\n| TYPE | ALIAS FOR | ALLOWED VALUES |\n| --- | ---\
  \ | --- |\n| `char` | `System.Char` | Unicode 字符，存储为 0 到 65535 之间的整数 |\n| `bool`\
  \ | `System.Boolean` | 布尔值，`true` 或 `false` |\n| `string` | `System.String` | 字符序列\
  \ |\n\n#### Text and Boolean Types\n\n注意 `string` 的字符数量在技术上没有上限，因为它可以可以使用数量的内存。\n\
  \n布尔类型 `bool` 是 C# 中最常用的变量类型之一，事实上类似的类型在其他语言中同样流行。拥有一个可以是 `true` 或 `false` 的变量对于应用程序的逻辑流具有重要影响。作为一个简单的例子，考虑有多少问题可以用\
  \ true 或 false（或是与否）来回答。变量值之间的比较或输入验证是你很快就会熟悉的布尔变量程序用途。\n\n现在你已经看了这些类型，考虑一个声明并使用它们的简短示例。在下面的\
  \ Try It Out 中，你使用一些简单的代码声明两个变量并赋值，然后输出这些值。\n\n### Variable Naming\n\n正如上一节提到的，你不能选择任何字符序列作为变量名。这听起来可能没那么糟，因为你仍然拥有一个非常灵活的命名系统。\n\
  \n基本的变量命名规则如下：\n\n*   变量名的第一个字符必须是字母、下划线字符 (`_`) 或 `@` 符号 (`@`)。\n*   后续字符可以是字母、下划线字符或数字。\n\
  \n某些关键字对 C# 编译器具有特殊意含义，例如前面所示的 `using` 和 `namespace` 关键字。如果你不小心使用了其中一个，编译器会报错，所以不必担心。\n\
  \n例如，以下变量名是合法的：\n\n```\nmyBigVar\nVAR1\n_test\n```\n\n这些不是合法的：\n\n```\n99BottlesOfBeer\n\
  namespace\nIt's-All-Over\n```\n\n\n\n\n\n| `int`, `uint`, `long`, `ulong` | 整数 |\
  \ 无 | `100` |\n| `uint`, `ulong` | 整数 | `u` or `U` | `100U` |\n| `long`, `ulong`\
  \ | 整数 | `l` or `L` | `100L` |\n| `Ulong` | 整数 | `ul`, `uL`, `Ul`, `UL`, `lu`, `lU`,\
  \ `Lu`, or `LU` | `100UL` |\n| `Float` | 实数数 | `f` or `F` | `1.5F` |\n| `double`\
  \ | 实数数 | 无, `d`, or `D` | `1.5` |\n| `decimal` | 实数数 | `m` or `M` | `1.5M` |\n\
  | `char` | 字符 | 无 | `'a'`, 或转义序列 |\n| `string` | 字符串 | 无 | `\"a…a\"`，可能包含转义序列 |\n\
  \n**表 3-4:** 字面量\n\n### 二进制字面量与数字分隔符\n\n无论编程语法变得多么复杂或高级，计算机只运行在两种状态：0 和 1，也称为二进制（2\
  \ 进制）。如果你愿意，可以将所有的程序都编写为 0 和 1 的序列，然后运行该程序。虽然这样做既不可行也不建议，但通过这样做，你可以减轻解释器将程序从 C#、十进制（10\
  \ 进制）、八进制（8 进制）或十六进制（16 进制）转换程序的负担。这样做并不会带来太大价值，因此使用二进制仅保留给需要它的非常特定的场景。例如，你可能需要以二进制、十六进制或\
  \ ASCII 形式向第三方代码包传递值。在大多数情况下，除非需要这些字面量，否则你应该使用像 C# 这样的编程语言进行编码。\n\n需要对半字节（nibbles）、位（bits）、字节（bytes）、字符、字（words）、二进制、十六进制、八进制等有深的技术知识和历史理解，才能深入理解何时、何地、如何以及为什么要使用这些字面量。目前，无需深入探讨“为什么”的历史问题和专业级关于“如何做”的讨论，只需知道例如，你可以使用二进制字面量作为一种优雅的方式，将值存储为常量，用于模式匹配和比较，以及实现位掩码。正如后续代码行的二进制与十六进制示例所示，你可以看到二进制数从右向左旋转了一个位。十六进制值没有规律，这使得更难快速判断代码的意图。\n\
  \n```\nint[] binaryPhases = { 0b00110001, 0b01100010, 0b11000100, 0b10001001 };\n\
  int[] hexPhases    = { 0x31, 0x62, 0xC4, 0x89 };\n```\n\n现在你有了一些背景知识，与其太快地深入研究模式匹配和位掩码，本节剩余部分将专门关注\
  \ C# `二进制字面量` 和 `数字分隔符`。在阅读本书并获得更多编码经验后，你可以自己阅读更多关于二进制模式匹配和位掩码的知识以增加你的见识。\n\n为了更好地理解\
  \ C# 二进制字面量特性，参考以下代码：\n\n```\nint[] numbers = {1, 2, 4, 8, 16  };\n```\n\n在 C# 中，添加到\
  \ `numbers` 数组中的值可以直接以二进制形式写入，如下：\n\n```\nint[] numbers = { 0b0001, 0b0010, 0b00100,\
  \ 0b0001000, 0b00010000  };\n```\n\n就像前缀为 `0x` 的十六进制数一样，编译器将识别任何以 `0b` 开头的值为二进制值并对其进行相应处理。正如你可以想象的，较大数字的二进制值会变得很长，在手动输入时很容易出错。以数字\
  \ 128 为例，它的二进制值为 10000000——即一个 1 后面跟着 7 个 0。这正是数字分隔符派上用场。以以下代码为例：\n\n```\nint[]\
  \ numbers = { 32, 64, 128  };\nint[] numbers = { 0b0010_0000, 0b0100_0000, 0b1000_0000\
  \  };\n```\n\n知道可以将二进制字面量拆分为数字组，有助于代码的可读性和管理。数字分隔符不仅限于二进制值：它们也可以用于 `int`、`decimal`、`float`\
  \ 和 `double`。下面这行代码表示了每第三位数字后使用分隔符的 Pi 值。使用数字分隔符的主要原因是为了让代码更容易读。\n\n```\nconst double\
  \ Pi  = 3.141_592_653_589_793_238_462_643_383_279_502;\n```\n\n### 字符串字面量\n\n在章的前面，你看到了一些可以在\
  \ 表 5 中使用的转义序列。\n\n| 转义序列 | 产生的字符 | Unicode（十六进制）值 |\n| :--- | :--- | :--- |\n|\
  \ `\\'` | 单引号 | 0027 |\n| `\\\"` | 双引号 | 0022 |\n| `\\\\` | 反斜杠 | 005C |\n| `\\\
  0` | 空字符 | 0000 |\n| `\\a` | 警报（蜂鸣） | 0007 |\n| `\\b` | 退格 | 0008 |\n| `\\f` | 分页符\
  \ | 000C |\n| `\\n` | 行 | 000A |\n| `\\r` | 回车 | 000D |\n| `\\t` | 水平制表 | 0009 |\n\
  | `\\v` | 垂直制表 | 000B |\n\n这意味着以下字符串是等价的：\n\n```\n\"Benjamin's string.\"\n\"Benjamin\\\
  u0027s.\"\n```\n\n显然，使用 Unicode 转义序列更大的灵活性。它们由 `u` 后跟四个位十六进制值组成（例如 `\\u0027`）。\n\
  \n你还可以指定*逐字面*（verbatim）字符串。这意味着双引号之间的所有字符都包含在字符串中，包括原本需要转义的行尾字符。唯一的例外是双引号，它必须被指定以避免结束字符串。要这样做，在字符串前放置\
  \ `@` 字符：\n\n```\n@\"Verbatim string.\"\n```\n\n逐字面字符串在文件名中特别有用，因为这些路径中使用了大量的反斜杠字符。使用普通字符串，你必须在整个字符串中使用双倍反斜杠：\n\
  \n```\n\"C:\\\\Temp\\\\MyDir\\\\MyFile.doc\"\n```\n\n使用逐字面字符串，你可以使其更具可读性。以下逐字面字符串与前一个等价：\n\
  \n```\n@\"C:\\Temp\\MyDir\\MyFile.doc\"\n```\n\n\n\n\n大多数运算符属于二元运算符，只有少数是一元运算符和一个称为`条件运算符`的三元运算符（该条件运算符是一个逻辑运算符，将在第\
  \ 4 章中讨论）。让我们先来看数学运算符，它们涵盖了一元和二元类别。\n\n### 数学运算符\n\n共有五种简单的数学运算符，其中两个（`+` 和 `-`）同时具有二元和一元形式。表\
  \ 3-6 列出了这些运算符的每一个、其用法简短示例以及与简单数值类型（整数和浮点数）使用时的结果。\n\n| OPERATOR | CATEGORY | EXAMPLE\
  \ EXPRESSION | RESULT |\n| --- | --- | --- | --- |\n| `+` | Binary | `var1 = var2\
  \ + var3;` | `var1` 被赋值为 `var2` 和 `var3` 的和。 |\n| `-` | Binary | `var1 = var2 -\
  \ var3;` | `var1` 被赋值为 `var2` 的值减去 `var3` 的值。 |\n| `*` | Binary | `var1 = var2 *\
  \ var3;` | `var1` 被赋值为 `var2` 和 `var3` 的乘积。 |\n| `/` | Binary | `var1 = var2 / var3;`\
  \ | `var1` 被赋值为 `var2` 除以 `var3` 的结果。 |\n| `%` | Binary | `var1 = var2 % var3;`\
  \ | `var1` 被赋值为 `var2` 除以 `var3` 的余数。 |\n| `+` | Unary | `var1 = +var2;` | `var1`\
  \ 被赋值为 `var2` 的值。 |\n| `-` | Unary | `var1 = -var2;` | `var1` 被赋值为 `var2` 的值乘以 `-1`。\
  \ |\n\n**表 3-6:** 简单数学运算符\n\n示例使用了简单的数值类型，因为在使用其他简单类型时，结果可能不明确。例如，如果你加上两个布尔值，你会期望得到什么？在这种情况下，什么都没有，因为如果你尝试对\
  \ `bool` 变量使用 `+`（或任何其他数学运算符），编译器会报错。将 `char` 变量相加也稍微令人困惑。记住 `char` 变量是以数字存储的，所以两个两个\
  \ `char` 变量也会得到一个数字（准确来说是 `int` 类型）。这是`隐式转换`的一个示例，你稍后将学习更多相关内容（以及显式转换），因为它也适用于 `var1`、`var2`\
  \ 和 `var3` 为混合类型的情况。\n\n二元 `+` 运算符在与字符串类型变量一起使用时确实是有意义的。在这种情况下，表格条目应如表 3-7 所示。\n\
  \n| OPERATOR | CATEGORY | EXAMPLE EXPRESSION | RESULT |\n| --- | --- | --- | ---\
  \ |\n| `+` | Binary | `var1` = `var2 + var3;` | `var1` 被赋值为存储在 `var2` 和 `var3` 中的两个字符串的拼接结果。\
  \ |\n\n**表 3-7:** 字符串拼接运算符\n\n然而，其他数学运算符都无法用于字符串。\n\n这里你应该关注的两个运算符是自增自减运算符，它们都是一元运算符，可以通过两种方式使用：在操作数的立即之前或立即之后。在简单表达式中获得的结果如表\
  \ 3-8 所示。\n\n| OPERATOR | CATEGORY | EXAMPLE EXPRESSION | RESULT |\n| --- | ---\
  \ | --- | --- |\n| `++` | Unary | `var1 = ++var2;` | `var1` 被赋值为 `var2 + 1` 的值。`var2`\
  \ 增加了 `1`。 |\n| `--` | Unary | `var1 = --var2;` | `var1` 被赋值为 `var2 - 1` 的值。`var2`\
  \ 减少了 `1`。 |\n| `++` | Unary | `var1 = var2++;` | `var1` 被赋值为 `var2` 的值。`var2` 增加了\
  \ `1`。 |\n| `--` | Unary | `var1 = var2--;` | `var1` 被赋值为 `var2` 的值。`var2` 减少了 `1`。\
  \ |\n\n**表 3-8:** 自增自减运算符\n\n这些运算符始终会导致操作数中存储的值发生变化：\n\n- `++` 总是导致其操作数增加 1。\n-\
  \ `--` 总是导致其操作数减少 1。\n\n存储在 `var1` 中的结果之间的差异是因为运算符的位置决定了它何时生效。将这些运算符之一放在操作数之前，意味着操作数在任何其他计算之前就会受到影响。\n\
  \n*(注：源文本包含了一些重复/乱码句子，已根据指令清理以保持专业文档标准。）*\n\n\n\n\n在这里，括号内的内容首先求值，这意味着 `+` 运算符的执行在\
  \ `*` 运算符之前。\n\n表 3-10 显示了你目前为止遇到的运算符的优先级顺序。优先级相同的运算符（例如 `*` 和 `/`）从左到右进行求值。\n\n\
  | 优先级 | 运算符 |\n| --- | --- |\n| 最高 | `++`, `--` (用作前缀); `+`, `-` (元运算符) |\n| | `*`,\
  \ `/`, `%` |\n| | `+`, `-` |\n| | `=`, `*=`, `/=`, `%=`, `+=`, `-=` |\n| 最低 | `++`,\
  \ `--` (用作后缀) |\n\n**表 3-10:** 运算符优先级\n\n## 命名空间 (Namespaces)\n\n在继续之前，考虑另一个重要主题——`namespaces`（命名空间）是值得的。这是\
  \ .NET 为应用程序代码提供容器的方式，以便代码及其内容可以被唯一标识。命名空间也被用作 .NET 中项的分类手段。这些项中的大部分是类型定义，例如本章中的简单类型（`System.Int32`\
  \ 等）。\n\nC# 代码默认包含在 `global namespace`（全局命名空间）中。这意味着此代码中包含的项只需通过其名称引用即可从全局命名空间中的其他代码访问。然而，你可以使用\
  \ `namespace` 关键字来显式地为大括号括起来的代码块定义命名空间。如果在该命名空间外部的代码中使用此类命名空间中的名称，则该名称必须是“限定的”（`qualified`）。\n\
  \n限定名称包含了所有的层级信息，这基本上意味着，如果你在一个命名空间中的代码需要使用在另一个命名空间中定义的名称，你必须包含对该命名空间的引用：\n\n```\n\
  namespace LevelOne\n{\n   // LevelOne 命名空间中的代码\n   // 定义名称 \"NameOne\"\n}\n// 全局命名空间中的代码\n\
  ```\n\n这段代码定义了一个命名空间 `LevelOne` 以及该命名空间中的一个名称 `NameOne`（为了保持讨论的通用，这里没有显示实际代码；相反，在定义所在的地方显示了注释）。在\
  \ `LevelOne` 命名空间内部编写的代码可以直接使用 `NameOne` 引用此名称——不需要分类。然而，全局命名空间中的代码必须使用限定名称 `LevelOne.NameOne`\
  \ 来引用此名称。\n\n此处还有另外一个重要点：`using` 语句本身并不能赋予访问另一个命名空间中名称的权限。除非命名空间中的代码以某种方式与你的项目关联（通过定义在项目中的源文件中，或定义在链接到项目的其他代码中），否则你无法访问包含的名称。此外，如果包含命名空间的代码链接到你的项目，那么无论你是否使用\
  \ `using`，你都可以访问该代码中包含的名称。`using` 语句只是让你更容易访问这些名称，它可以缩短原本冗长的代码使其更具可读性。\n\n回到本章开头所示的\
  \ `ConsoleApp1` 代码，以下是适用于命名空间的行：\n\n```\nusing System;\nnamespace ConsoleApp1\n\
  {\n   …\n}\n```\n\n这里显示了其他常见的命名空间，例如：\n\n```\nusing System.Collections.Generic;\n\
  using System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\n```\n\n以\
  \ `using` 关键字开头的行用于声明 `System`、`System.Collections.Generic`、`System.Linq`、`System.Text`\
  \ 和 `System.Threading.Tasks` 命名将在此 C# 代码中使用，并且可以在此文件的所有命名空间无需分类访问。`System` 命名空间是\
  \ .NET 应用程序的根命名空间，包含了控制应用程序所需的所有基本功能。其他四个命名空间在控制台中非常常用，所以那里是为了备不之。此外，注意为应用程序代码本身\
  \ `ConsoleApp1` 定义了一个命名空间。\n\nC# 包含了名为 `using static` 的关键字。这些关键字允许将静态成员直接引入 C# 程序的作用范围内。例如，本章中的两个“尝试一下”（Try\
  \ It Out）代码演示都使用了 `System.Console.WriteLine()` 方法，它是 `System.Console` 静态类的一部分。注意，在这些示例中，必须包含\
  \ `Console` 类结合 `WriteLine()` 方法。当将 `using static System.Console` 命名空间添加到包含的命名空间列表时，访问\
  \ `WriteLine()` 方法就不再需要之前的静态类名。\n\n## 练习题 (EXERCISES)\n\n1. 3.1 在以下代码中，你如何从 `fabulous`\
  \ 命名空间的代码中引用名称 `great`？\n\n```\n namespace fabulous\n  {\n      // fabulous 命名空间中的代码\n\
  \  }\n  namespace super\n  {\n     namespace smashing\n     {\n        // 定义名称 great\n\
  \     }\n  }\n```\n\n2. 3.2 下面哪一个不是合法的变量名？\n\n   - `myVariableIsGood`\n   - `99Flake`\n\
  \   - `_floor`\n   - `time2GetJiggyWidIt`\n   - `wrox.com`\n\n3. 3.3 字符串 `\"supercalifragilisticexpialidocious\"\
  ` 是否太大无法放入 `string` 变量中？如果是，为什么？\n\n4. 3.4 通过考虑运算符优先级，列出计算以下表达式涉及的步骤：\n\n```\nresultVar\
  \ += var1 * var2 + var3 % var4;\n```\n\n5. 3.5 写一个控制台应用程序，从用户获取四个 `int` 值并显示乘积。提示：你可能记得\
  \ `Convert.ToDouble()` 命令被用于将输入转换为 `double`；将 `string` 转换为 `int` 的等效命令是 `Convert.ToInt32()`。\n\
  \n练习题答案可以在附录中找到。\n\n\n\n\n你目前为止看到的所有 C# 代码都有一个共同点。在每个情况下，程序的执行都是按照从上到下的顺序逐行进行的，没有任何遗漏。如果所有应用程序都这样工作，那么你能做的事情将受到极大限制。本章描述了控制程序流（即\
  \ C# 代码行的执行顺序）的方法——`branching`（分支）和 `looping`（循环）。`branching` 根据求值结果条件执行代码，例如“只有当变量\
  \ `myVal` 小于 10 时执行此代码”。`looping` 则重复执行相同的语句，要么执行特定的次数，要么直到达到测试条件。\n\n这两种技术都涉及 `Boolean\
  \ logic`（布尔逻辑）的使用。在上一章中，你看到了 `bool` 类型，但实际上并没有对它做很多操作。在本章中，你将频繁地使用它，因此本章开头首先讨论了布尔逻辑的含义，然后介绍了如何在流控制场景中使用它。\n\
  \n## 布尔逻辑 (BOOLEAN LOGIC)\n\n上一章引入的 `bool` 类型只能包含两个值之一：`true` 或 `false`。这种类型通常用于记录某些操作的结果，以便你可以根据此结果采取行动。特别是，`bool`\
  \ 类型用于存储 `comparison`（比较）的结果。\n\n例如，考虑（在本章开头提到过）这种情况：你想根据变量 `myVal` 是否小于 10 来执行代码。为了做到这一点，你需要某种指示来判断“`myVal`\
  \ 小于 10”这一语句是 `true` 还是 `false`——也就是说，你需要知道比较的布尔结果。\n\n布尔比较需要使用布尔 `comparison operators`（比较运算符，也称为\
  \ `relational operators` 关系运算符），它们所示在 表 4-1 中。\n\n| 运算符 | 类别 | 示例表达式 | 结果 |\n| ---\
  \ | --- | --- | --- |\n| `==` | 二进制 | `var1 = var2 == var3;` | 如果 `var2` 等于 `var3`，则\
  \ `var1` 被赋值为 `true`，否则为 `false`。 |\n| `!=` | 二进制 | `var1 = var2 != var3;` | 如果\
  \ `var2` 不等于 `var3`，则 `var1` 被赋值为 `true`，否则为 `false`。 |\n| `<` | 二进制 | `var1 = var2\
  \ < var3;` | 如果 `var2` 小于 `var3`，则 `var1` 被赋值为 `true`，否则为 `false`。 |\n| `>` | 二进制\
  \ | `var1 = var2 > var3;` | 如果 `var2` 大于 `var3`，则 `var1` 被赋值为 `true`，否则为 `false`。\
  \ |\n| `<=` | 二进制 | `var1 = var2 <= var3;` | 如果 `var2` 小于或等于 `var3`，则 `var1` 被赋值为\
  \ `true`，否则为 `false`。 |\n| `>=` | 二进制 | `var1 = var2 >= var3;` | 如果 `var2` 大于或等于\
  \ `var3`，则 `var1` 被赋值为 `true`，否则为 `false`。 |\n\n**表 4-1:** 布尔比较运算符\n\n在 表 4-1 的所有情况下，`var1`\
  \ 都是 `bool` 类型变量，而 `var2` 和 `var3` 的类型可能不同。\n\n你可能在代码对数值值上使用这样的运算符：\n\n```\nbool\
  \ isLessThan10;\nisLessThan10 = myVal < 10;\n```\n\n前面的代码会导致：如果 `myVal` 存储的值小于 10，则\
  \ `isLessThan10` 被赋值为 `true`，否则赋值为 `false`。\n\n你也可以在其他类型上使用这些比较运算符，例如字符串：\n\n```\n\
  bool isBenjamin;\nisBenjamin = myString == \"Benjamin\";\n```\n\n在这里，只有当 `myString`\
  \ 存储字符串 `\"Benjamin\"` 时，`isBenjamin` 才为 `true`。\n\n你还可以将变量与布尔值进行比较：\n\n```\nbool\
  \ isTrue;\nisTrue = myBool == true;\n```\n\n但是，在这里你被限制只能使用 `==` 和 `!=` 运算符。\n\n\
  `&&` 和 `||` 运算符被称为 `conditional Boolean operators`（条件布尔运算符），描述在 表 4-2 中。\n\n| 运算符\
  \ | 类别 | 示例表达式 | 结果 |\n| --- | --- | --- | --- |\n| `&&` | 二进制 | `var1 = var2 &&\
  \ var3;` | 如果 `var2` 和 `var3` 均为 `true`，则 `var1` 被赋值为 `true`，否则为 `false`。（逻辑与 `AND`）\
  \ |\n| `||` | 二进制 | `var1 = var2 || var3;` | 如果 `var2` 或 `var3`（或两者）为 `true`，则 `var1`\
  \ 被赋值为 `true`，否则为 `false`。（逻辑或 `OR`） |\n\n**表 4-2:** 条件布尔运算符\n\nThe `&&` 和 `||`\
  \ 运算符被称为 `conditional Boolean operators`，并描述在 表 4-2 中。（注：原文此后存在大量重复段落，已按要求进行处理）。\n\
  \n\n\n\n分支是指控制下一步执行哪行代码的行为。要跳转到的代码行由某种条件语句控制。该条件语句基于布尔逻辑，通过测试值与一个或多个可能值之间的比较来实现。\n\
  \n本节描述了 C# 中提供的三种分支技术：\n\n*   三元运算符\n*   `if` 语句\n*   `switch` 语句\n\n### 三元运算符\n\
  \n执行比较的最简单方法是使用上一节提到的三元（或`条件`）运算符。你已经见过作用于一个操作数的一元运算符和作用于两个操作数的二进制运算符，因此这个运算符作用于三个操作数也不令人意外。其语法如下：\n\
  \n```\n<test> ? <resultIfTrue>: <resultIfFalse>;\n```\n\n在这里，`<test>` 被求值以获得布尔值，根据该值，运算符的结果为`<resultIfTrue>`\
  \ 或 `<resultIfFalse>`。\n\n你可以像这样使用来测试名为 `myInteger` 的 `int` 变量的值：\n\n```\nstring\
  \ resultString = (myInteger < 10) ? \"Less than 10\"\n                         \
  \         : \"Greater than or equal to 10\";\n```\n\n三元运算符的结果是两个字符串之一，两者都可能赋值给 `resultString`。赋值哪个字符串是通过比较\
  \ `myInteger` 的值与 10 的大小决定的。在这种情况下，小于 10 的值会导致赋值第一个字符串，而大于等于 10 的值会导致赋值第二个字符串。例如，如果\
  \ `myInteger` 为 `4`，则 `resultString` 将被赋值字符串 `Less than 10`。\n\n### if 语句\n\n`if`\
  \ 语句是一种多得多且实用的决策方式。与 `?:` 语句不同，`if` 语句没有结果（因此你不能将它们用于赋值）；相反，你使用该语句根据条件执行其他语句。\n\n\
  `if` 语句的最简单用法如下，其中 `<test>` 被求值（它必须求值为布尔值才能通过编译），如果 `<test>` 求值为 `true`，则执行语句后的代码行：\n\
  \n```\nif (<test>) \n   <code executed if <test> is true>;\n```\n\n在执行此代码后，或者由于\
  \ `<test>` 求值为 `false` 而未执行，程序执行将从下一行代码继续。\n\n你还可以结合 `else` 语句使用 `if` 语句指定额外的代码。如果\
  \ `<test>` 求值为 `false`，则执行该语句：\n\n```\nif (<test>)\n   <code executed if <test>\
  \ is true>;\nelse\n   <code executed if <test> is false>;\n```\n\n这两部分代码都可以使用大括号块来跨越多行：\n\
  \n```\nif (<test>)\n{\n   <code executed if <test> is true>;\n}\nelse\n{\n   <code\
  \ executed if <test> is false>;\n}\n```\n\n作为一个快速的示例，你可以重写上一节中使用三元运算符的代码：\n\n```\n\
  string resultString = (myInteger < 10) ? \"Less than 10\"\n                    \
  \              : \"Greater than or equal to 10\";\n```\n\n由于 `if` 语句的结果不能赋值给变量，你必须在单独的步骤中为变量赋值：\n\
  \n```\nstring resultString;\nif (myInteger < 10)\n   resultString = \"Less than\
  \ 10\";\nelse\n   resultString = \"Greater than or equal to 10\";\n```\n\n这样的代码虽然更冗长，但比等价的三元形式更容易阅读和理解，并提供了更大的灵活性。\n\
  \n接下来的“试一试”演示了 `if` 语句的使用。\n\n#### 使用 if 语句检查更多条件\n\n在前面的示例中，你检查了三个涉及 `var1` 值的条件。这涵盖了该变量的所有可能取值。有时，你可能想检查特定的值——例如，如果\
  \ `var1` 等于 1、2、3 或 4 等。使用像前一个示例那代码会导致令人烦恼的嵌套代码：\n\n```\nif (var1 == 1)\n{\n   //\
  \ Do something.\n}\nelse\n{\n   if (var1 == 2)\n   {\n      // Do something else.\n\
  \   }\n   else\n   {\n      if (var1 == 3 || var1 == 4)\n      {\n         // Do\
  \ something else.\n      }\n      else\n      {\n         // Do something else.\n\
  \      }\n   }\n}\n```\n\n在这些情况下，考虑使用稍微不同的缩进方案，并压缩 `else` 块的代码段（即在 `else` 块后使用单行代码，而不是代码块）。这样，你将得到一个包含\
  \ `else if` 语句的结构：\n\n```\nif (var1 == 1)\n{\n   // Do something.\n}\nelse if (var1\
  \ == 2)\n{\n   // Do something else.\n}\nelse if (var1 == 3 || var1 == 4)\n{\n \
  \  // Do something else.\n}\nelse\n{\n   // Do something else.\n}\n```\n\n这些 `else\
  \ if` 语句实际上是两个独立的语句，代码在功能上与之前的示例完全相同。\n\n### switch 语句\n\n`switch` 语句类似于 `if` 语句，它根据测试值的值执行代码。然而，`switch`\
  \ 允许你一次测试多个值，而不仅仅是单一个条件。`switch` 语句的基本结构如下：\n\n```\nswitch (<testVar>)\n{\n   case\
  \ <comparisonVal1>:\n      <code to execute if <testVar> == <comparisonVal1>>\n\
  \      break;\n   case <comparisonVal2>:\n      <code to execute if <testVar> ==\
  \ <comparisonVal2>>\n      break;\n   …\n   case <comparisonValN>:\n      <code\
  \ to execute if <testVar> == <comparisonValN>>\n      break;\n   default:\n    \
  \  <code to execute if no match>\n      break;\n}\n```\n\n`<testVar>` 中的值与每个 `<comparisonVal>`\
  \ 值进行比较。如果有匹配，则执行为该匹配提供的代码。如果没有匹配，则如果存在 `default` 部分，则执行 `default` 部分中的代码。\n\n在完成每个部分的代码后，你还有一个额外的命令\
  \ `break`。执行流到达第二个 `case` 语句是非合法的。`break` 语句直接终止 `switch` 语句，处理将从结构之后的语句继续。\n\n\
  在 C# 代码中，有其他方法可以防止流从一个 `case` 语句进入下一个 `case` 语句。你可以使用 `return` 语句（导致当前函数终止而不仅仅是\
  \ `switch` 语句），或者使用 `goto` 语句。`goto` 语句在这里有效工作是因为 `case` 语句在 C# 代码中实际上定义了标签。这是一个示例：\n\
  \n```\nswitch (<testVar>)\n{\n   case <comparisonVal1>:\n      <code to execute\
  \ if <testVar> == <comparisonVal1>>\n      goto case <comparisonVal2>;\n   case\
  \ <comparisonVal2>:\n      <code to execute if <testVar> == <comparisonVal2>>\n\
  \      break;\n   …\n}\n```\n\n这里有一个“一个 `case` 语句的处理不能自由运行到下一个语句”这一规则的例外：如果你在单个代码块之前将多个\
  \ `case` 语句放在一起（堆叠它们），那么你实际上是在一次检查多个条件。如果满足了这些条件中的任何一个，就会执行该代码。这是一个示例：\n\n```\n\
  switch (<testVar>)\n{\n   case <comparisonVal1>:\n   case <comparisonVal2>:\n  \
  \    <code to execute if <testVar> == <comparisonVal1> or\n                    \
  \      <testVar> == <comparisonVal2>>\n      break;\n   …\n}\n```\n\n\n\n\n\n这些条件也适用于\
  \ `default` 语句。并没有规则规定该语句必须是比较列表中的最后一个，而且你可以根据需要将它与 `case` 语句堆叠。通过 `break` 或 `return`\
  \ 添加断点，可以确保在所有情况下该结构中都存在一条有效的执行路径。\n\n下面的“尝试运行”（Try It Out）使用 `switch` 语句根据你输入的测试字符串的值，向控制台写入不同的字符串。\n\
  \n# 循环 (LOOPING)\n\n`Looping`（循环）指的是语句的重复执行。这项技术非常有用，因为它意味着你可以根据需要重复执行操作（数千次甚至数百万次），而无需每次都编写相同的代码。\n\
  \n举个简单的例子，考虑以下计算 10 年后银行账户中金额的代码，假设每年支付利息且账户没有其他资金流入或流出：\n\n```\ndouble balance\
  \ = 1000;\ndouble interestRate = 1.05; // 5% interest/year\nbalance *= interestRate;\n\
  balance *= interestRate;\nbalance *= interestRate;\nbalance *= interestRate;\nbalance\
  \ *= interestRate;\nbalance *= interestRate;\nbalance *= interestRate;\nbalance\
  \ *= interestRate;\nbalance *= interestRate;\nbalance *= interestRate;\n```\n\n\
  编写 10 次相同的代码似乎有点浪费，而且如果你想将时长从 10 年改为其他值怎么办？你将不得不手动复制所需次数的行代码，这会非常头疼！幸运的是，你不必这样做。相反，你可以使用一个循环来按照所需的次数执行你想要的指令。\n\
  \n另一种重要的循环类型是持续循环直到满足某个特定条件为止。这些循环比之前详细述述的情况稍微简单一些（尽管用处并不减），因此它们是一个很好的起点。\n\n##\
  \ do 循环\n\n`do` 循环的操作机制如下：执行你标记为循环的代码，进行一个布尔测试，如果该测试结果为 `true`，则再次执行代码，依此类推。当测试结果为\
  \ `false` 时，循环退出。\n\n`do` 循环的结构如下，其中 `<Test>` 评估为布尔值：\n\n```\ndo\n{\n   <code to\
  \ be looped>\n} while (<Test>);\n```\n\n例如，你可以使用以下代码按列写出 1 到 10 的数字：\n\n```\nint\
  \ i = 1;\ndo\n{\n   Console.WriteLine($\"{i++}\");\n} while (i <= 10);\n```\n\n\
  在这里，你使用 `++` 运算符的后缀版本在 `i` 写入屏幕后增加其值，因此你需要检查 `i <= 10`，以便将 10 包含写入控制台的数字中。\n\n下面的“尝试运行”对前显示的代码进行了稍稍修改的版本，之前的代码计算了账户\
  \ 10 年后的余额。在这里，你使用循环来根据初始金额和固定利率，计算账户中获得指定金额需要多少年。\n\n## while 循环\n\n`while` 循环与\
  \ `do` 循环非常相似，但它们有一个重要的区别：`while` 循环中的布尔测试发生在循环周期的开始，而不是结束。如果测试结果为 `false`，则循环周期永远不会执行。相反，程序执行将直接跳转到循环后的代码。\n\
  \n以下是 `while` 循环的指定方式：\n\n```\nwhile (<Test>)\n{\n   <code to be looped>\n}\n```\n\
  \n它们的使用方式几乎与 `do` 循环相同：\n\n```\nint i = 1;\nwhile (i <= 10)\n{\n   Console.WriteLine($\"\
  {i++}\");\n}\n```\n\n这段代码与之前显示的 `do` 循环结果相同；它按列输出数字 1 到 10。下接下来的“尝试运行”演示了你如何修改上一个示例以使用\
  \ `while` 循环。\n\n## for 循环\n\n本章最后查看的循环类型是 `for` 循环。这种循环执行固定次数并维护自己的计数器。要定义一个 `for`\
  \ 循环，你需要以下信息：\n\n*   一个初始化计数器变量的起始值\n*   一个继续循环的条件，涉及计数器变量\n*   在每个循环结束时对计数器变量执行的操作\n\
  \n例如，如果你想要一个计数器从 1 递增到 10 的循环，那么起始值就是 1；条件是计数器小于或等于 10；每个周期结束时执行的操作是对计数器加 1。\n\n\
  这些信息必须如下放入 `for` 循环的结构中：\n\n```\nfor (<initialization>; <condition>; <operation>)\n\
  {\n   <code to loop>\n}\n```\n\n它的工作方式与下面的 `while` 循环完全相同：\n\n```\n<initialization>\n\
  while (<condition>)\n{\n   <code to loop>\n   <operation>\n}\n```\n\n之前，你使用 `do`\
  \ 和 `while` 循环来写出 1 到 10 的数字。后面的代码显示了使用 `for` 循环实现此所需的内容：\n\n```\nint i;\nfor (i\
  \ = 1; i <= 10; ++i)\n{\n   Console.WriteLine($\"{i}\");\n}\n```\n\n\n\n在这里，`i`\
  \ 直到循环的最后一行代码才会增加，而该代码位于 `continue` 语句之后。如果遇到了这个 `continue` 语句（当 `i` 等于 2 时就会遇到），下一次循环将继续使用相同的\
  \ `i` 值，导致循环继续、测试相同的 `i` 值、继续循环，依此类推。这将会导致应用程序冻结。请注意，仍然可以通过正常方式退出冻结的应用程序，因此如果发生这种情况，你不需要重启。\n\
  \n### 练习题\n\n1. **4.1** 如果你在变量 `var1` 和 `var2` 中存储了两个整数，可以执行何种布尔测试来判断是否其中一个（但不是两个都是）大于\
  \ 10？\n2. **4.2** 编写一个应用程序，该程序应包含练习题 1 中的逻辑，从用户处获取两个数字并显示它们，但拒绝任何两个数字都大于 10 的输入，并要求输入两个数字。\n\
  3. **4.3** 下面代码有什么问题？\n\n```\nint i;\nfor (i = 1; i <= 10; i++)\n{\n   if ((i %\
  \ 2) = 0)\n      continue;\n   Console.WriteLine(i);\n}\n```\n\n练习题的答案可以在附录中找到。\n\
  \n## 本章你学到了什么\n\n| 主题 | 核心概念 |\n| --- | --- |\n| 布尔逻辑 | 布尔逻辑涉及使用布尔值（`true` 或 `false`）来评估条件。布尔运算符用于在值之间进行比较并返回布尔结果。某些布尔运算符还用于对值的底层位结构执行位操作，而且还有一些专门的位运算符。\
  \ |\n| 分支结构 | 你可以使用布尔逻辑来控制程序流。评估为布尔值的表达式的结果可以可以用于确定是否执行某个代码块。你可以通过 `if` 语句或 `?:`（三元）运算符进行简单分支，或者使用\
  \ `switch` 语句同时检查多个条件。 |\n| 循环 | 循环允许你根据指定的条件多次执行执行代码块。你可以使用 `do` 和 `while` 循环在布尔表达式评估为\
  \ `true` 时执行代码，并使用 `for` 循环在你的循环代码中包含一个计数器。循环可以在当前周期被中断（使用 `continue`）或完全中断（使用 `break`）。某些循环只有在被中断时才会结束；这些被称为无限循环。\
  \ |\n\n# 5. 关于变量的更多\n\n### 本章代码下载\n\n本章的代码下载可以在书籍页面 [`www.wiley.com`](http://www.wiley.com)\
  \ 上找到。点击 Downloads 链接。代码也可以在 [`github.com/benperk/BeginningCSharpAndDotNET`](http://github.com/benperk/BeginningCSharpAndDotNET)\
  \ 找到。代码位于 Chapter05 文件夹，并根据章节中的名称进行单独命名。\n\n现在你已经了解了更多 C# 语言，可以回去处理一些关于变量的更复杂的话题。\n\
  \n你在本章看到的第一个主题是 `类型转换`，即将值从一种类型转换为另一种类型。你已经见过其中的一部分，但在这里你将正式地审视它。掌握这个主题可以让你更深入理解在表达式中混合类型（无论是故意还是无意）时发生了什么，并对数据处理方式有更紧紧的控制。这有助于你精简代码并避免糟糕的意外。\n\
  \n然后你将查看更多你可以使用的变量类型：\n\n* **枚举 (Enumerations)**——具有用户定义的离散可能值集合的变量类型，可以以人类可读的方式使用。\n\
  * **结构体 (Structs)**——由一组用户定义的其他变量类型组成的复合变量类型。\n* **数组 (Arrays)**——持有同一种类型的多个值的类型，允许通过索引访问单个值。\n\
  \n这些类型比你目前为止使用的简单类型稍微复杂一些，但它们可以让你的生活变得简单得多。最后，你将探索另一个关于字符串的有用主题：基础字符串操作。\n\n## 类型转换\n\
  \n在书的前面，你看到所有数据（无论类型如何）都仅仅是位序列——即 0 和 1 的序列。变量的含义取决于解释这些数据的方式。这最简单的例子是 `char` 类型。该类型使用数字表示\
  \ Unicode 字符集中的一个字符。事实上，该数字的存储方式与 `ushort` 完全相同——它们都存储 0 到 65535 之间的数字。\n\n然而，通常情况下，不同类型的变量使用不同的方案来表示数据。这意味着，即使可能将从一个变量的位序列放置到不同类型的变量中（可能它们使用相同的存储空间，或者目标类型有足够的存储空间包含所有源位），结果也可能不是你预期的。\n\
  \n与其将位从一个变量到另一个变量进行这种一对一映射，你必须对数据使用 `类型转换`。类型转换有两种形式：\n\n* **隐式转换 (Implicit conversion)**——从类型\
  \ A 到类型 B 的转换在所有情况下都是可能的，且执行转换的规则足够简单，你可以信任编译器。\n* **显式转换 (Explicit conversion)**——从类型\
  \ A 到类型 B 的转换仅在某些情况下可能，或者当转换规则复杂到需要某种额外处理时才可能。\n\n### 隐式转换\n\n隐式转换不需要你进行任何工作也不需要额外的代码。考虑这里的代码：\n\
  \n```\nvar1 = var2;\n```\n\n如果 `var2` 的类型可以隐式转换为 `var1` 的类型，则该赋值可能涉及隐式转换；然而，它可能只是相同类型的变量，在这种不需要隐式转换。例如，`ushort`\
  \ 和 `char` 的值可以相互转换，因为它们都存储 0 到 65535 之间的数字。你可以隐式地在这些类型之间转换值，如下代码所示：\n\n```\nushort\
  \ destinationVar;\nchar sourceVar = 'a';\ndestinationVar = sourceVar;\nConsole.WriteLine($\"\
  sourceVar val: {sourceVar}\");\nConsole.WriteLine($\"destinationVar val: {destinationVar}\"\
  );\n```\n\n在这里，存储在 `sourceVar` 中的值被放置在 `destinationVar` 中。当你使用两个 `WriteLine()` 输出变量时，得到如下输出：\n\
  \n```\nsourceVar val: a\ndestinationVar val: 97\n```\n\n尽管两个变量存储相同的信息，但其解释的方式不同。\n\
  \n简单类型有很多隐式转换；`bool` 和 `string` 没有隐式转换，但数字类型有一些。作为参考，表 5-1 显示了编译器可以隐式执行的数字转换（记住\
  \ `char` 存储数字，所以 `char` 视为数字类型）。\n\n| 类型 | 可以安全转换为 |\n| --- | --- |\n| `byte` |\
  \ `short, ushort, int, uint, long, ulong, float, double, decimal` |\n| `sbyte` |\
  \ `short, int, long, float, double, decimal` |\n| `short` | `int, long, float, double,\
  \ decimal` |\n| `ushort` | `int, uint, long, ulong, float, double, decimal` |\n\
  | `int` | `long, float, double, decimal` |\n| `uint` | `long, ulong, float, double,\
  \ decimal` |\n| `long` | `float, double, decimal` |\n| `ulong` | `float, double,\
  \ decimal` |\n| `float` | `Double` |\n| `char` | `ushort, int, uint, long, ulong,\
  \ float, double, decimal` |\n\n**表 5-1:** 隐式数字转换\n\n\n\n\n\n不要担心——你不需要背诵这张表，因为实际上很容易推导出编译器可以哪些哪些式转换。在第\
  \ 3 章中，表 3-1、3-2 和 3-3 显示了每种简单数值类型的取值范围。这些类型的隐式转换规则是：任何类型 `A` 的取值范围完全位于类型 `B` 的取值范围内，就可以隐式转换为该类型。\n\
  \n这种推理性非常简单。如果你尝试将一个值放入变量中，但该值超出了变量可以取值的范围，那么就会出现问题。例如，`short` 类型变量能够存储高达到 32767\
  \ 的值，而 `byte` 允许的最大值是 255，因此如果你尝试将 `short` 值转换为 `byte` 值，就可能会出现问题。如果 `short` 持有的值在\
  \ 256 到 32767 之间，那么它就无法放入 `byte` 中。\n\n如果你知道你的 `short` 类型变量中的值小于 255，那么你应该能够转换这个值，对吧？简单的答案是，当然，你可以这样做。稍微复杂一点的答案是，你当然可以，但你必须使用显式转换。执行显式转换有点像是在说：“好的，我知道你警告过我不要这样做，但我会对发生的结果负责。”\n\
  \n### 显式转换\n\n如名所示，当你显式要求编译器将一个值从一种数据类型转换为另一种数据类型时，就会发生显式转换。这些转换需要额外的代码，并且这些代码的格式可能会取决于具体的转换方法。在查看任何显式转换代码之前，先看看如果你不添加任何此类代码会发生什么。\n\
  \n例如，对前一节代码的以下修改尝试将 `short` 值转换为 `byte`：\n\n```\nbyte destinationVar;\nshort sourceVar\
  \ = 7;\ndestinationVar = sourceVar;\nConsole.WriteLine($\"sourceVar val: {sourceVar}\"\
  );\nConsole.WriteLine($\"destinationVar val: {destinationVar}\");\n```\n\n如果你尝试编译上面的代码，将收到以下错误：\n\
  \n```\nCannot implicitly convert type 'short' to 'byte'. An explicit conversion\
  \ exists\n(are you missing a cast?)\n```\n\n为了让这段代码通过编译，你需要添加执行显式转换的代码。在这种情况下，实现此操作最简单的方法是将\
  \ `short` 变量强制转换为 `byte`（如前面的错误字符串所示）。强制类型转换基本上意味着将数据从一种类型强制转到另一种类型，它使用以下简单语法：\n\
  \n```\n(<destinationType>)<sourceVar>\n```\n\n这会将 `<sourceVar>` 中的值转换为 `<destinationType>`。\n\
  \n因此，你可以使用此语法修改你的示例，强制从 `short` 转换为 `byte`：\n\n```\nbyte destinationVar;\nshort\
  \ sourceVar = 7;\ndestinationVar = (byte)sourceVar;\nConsole.WriteLine($\"sourceVar\
  \ val: {sourceVar}\");\nConsole.WriteLine($\"destinationVar val: {destinationVar}\"\
  );\n```\n\n这将导致以下输出：\n\n```\nsourceVar val: 7\ndestinationVar val: 7\n```\n\n当你尝试将一个值强制放入一个不兼容的变量类型时会发生什么？例如，你无法将一个大整数放入太小的数值类型中。按照如下方式修改你的代码可以说明这一点：\n\
  \n```\nbyte destinationVar;\nshort sourceVar = 281;\ndestinationVar = (byte)sourceVar;\n\
  Console.WriteLine($\"sourceVar val: {sourceVar}\");\nConsole.WriteLine($\"destinationVar\
  \ val: {destinationVar}\");\n```\n\n这将导致以下结果：\n\n```\nsourceVar val: 281\ndestinationVar\
  \ val: 25\n```\n\n发生了什么？嗯，看看这两个数字的二进制表示，以及 `byte` 能够存储的最大值（即 255）：\n\n```\n281 =\
  \ 100011001\n 25 = 000011001\n255 = 011111111\n```\n\n你可以看到源数据的左侧位丢失了。这立即引发了一个问题：你如何判断这种情况发生？显然，你会有需要显式将一种类型转换为另一种类型的时候，如果能知道过程中是否丢失了数据将很好。无法检测到这一点可能会导致严重错误——例如，在会计应用程序或确定火箭飞月球轨迹的应用程序中。\n\
  \n实现此点的方法之一是检查源变量的值，并将其与目标变量的已知限制进行比较。另一种技术是强制系统在运行时对转换特别注意。当一个值对于该变量的类型太大时，尝试将该值放入变量会导致溢出，而这就是你想检查的情况。\n\
  \n有两个关键字用于设置表达式的所谓“溢出检查上下文”：`checked` 和 `unchecked`。你按以下方式使用它们：\n\n```\nchecked(<expression>)\n\
  unchecked(<expression>)\n```\n\n你可以在上一个示例中强制溢出检查：\n\n```\nbyte destinationVar;\n\
  short sourceVar = 281;\ndestinationVar = checked((byte)sourceVar);\nConsole.WriteLine($\"\
  sourceVar val: {sourceVar}\");\nConsole.WriteLine($\"destinationVar val: {destinationVar}\"\
  );\n```\n\n当执行这段代码时，它将崩溃并显示如图 5-1 所示的错误消息（这在一个名为 OverflowCheck 的项目中编译的）。然而，如果你将代码中的\
  \ `checked` 替换为 `unchecked`，你将得到之前的的结果且不会发生错误。这与默认行为相同。\n\n你还可以配置你的应用程序，使得这种类型的表达式都包含\
  \ `checked` 关键字，除非该表达式显式使用了 `unchecked` 关键字（换句话说，你可以更改溢出检查的默认设置）。执行此操作，你需要通过在解决方案窗口中右键点击项目并选择\
  \ Properties 来修改属性。点击窗口左侧的 Build 打开生成设置。你想更改的属性是高级设置之一，因此点击 Advanced 按钮。在弹出的对话框中，勾选\
  \ Check for Arithmetic Overflow/Underflow 框，如图 5-2 所示。默认情况下设置为禁用；启用它可以提供之前详细的行为。\n\
  \n### 使用 Convert 命令进行显式转换\n\n你在书中许多 Try Out 示例中使用的显式转换类型与你到目前为止在本章中看到的有所不同。你一直在使用\
  \ `Convert.ToDouble()` 等命令将字符串值转换为数字，这显然对于所有可能的字符串都是无效。\n\n例如，如果你尝试使用 `Convert.ToDouble()`\
  \ 将类似 `Number` 的字符串转换为双精度浮点数，当你执行代码时，将看到如图 5-3 所示的对话框。\n\n\n\n\n如你所看到的，操作失败了。为了让此类转换生效，提供的字符串*必须*是数字的有效表示，且该数字必须是不会引起溢出的。数字的有效表示包含：一个可选的符号（即加或减）、零或多个数字、一个可选的小数点后跟一个或多个数字，以及可选的\
  \ `e` 或 `E` 后跟一个可选的符号、一个或多个数字，且除了该序列前后的空格外没有其他内容。通过使用所有这些可选的额外内容，你可以将像 `-1.2451e-24`\
  \ 这样复杂的字符串识别为数字。\n\n关于这些转换需要注意的重要点是，它们*始终*会进行溢出检查，`checked` 和 `unchecked` 关键字以及项目属性设置没有任何影响。\n\
  \n下一个“尝试一下”是一个示例，涵盖了本节中的许多转换类型。它声明并初始化了几个不同类型的变量，然后在它们之间进行隐式和显式的转换。\n\n## 复杂变量类型\n\
  \n除了所有的简单变量类型外，C# 还提供了三种稍微复杂（但非常有用）的变量类型：枚举（通常称为 enums）、结构体（偶尔称为 structures）和数组。\n\
  \n### 枚举\n\n你目前为止看到的每种类型（`string` 除外）都有一个组明确定义的允许值。诚然，在 `double` 等类型中，这个集合非常大，以至于实际上可以被视为连续体，但它仍然是一个固定的集合。最简单的例子是\
  \ `bool` 类型，它只能取两个值之一：`true` 或 `false`。\n\n在许多其他情况下，你可能希望一个变量可以取固定结果集中的一个值。例如，你可能希望有一个\
  \ `orientation` 类型，可以存储 `north`、`south`、`east` 或 `west` 值之一。\n\n在这样的情况下，*枚举*会非常有用。枚举在你的\
  \ `orientation` 类型中完全实现了你想要的功能：它们允许定义一种类型，该类型可以取你提供的有限值集中的之一。那么，你需要做的是创建一个名为 `orientation`\
  \ 的自定义枚举类型，它可以取四个可能值之一。\n\n请注意，这里涉及一个额外的步骤——你不仅仅是声明一个给定类型的变量；你声明并详细说明一个用户定义类型，然后声明该新类型的变量。\n\
  \n#### 定义枚举\n\n你可以使用 `enum` 关键字如下定义枚举：\n\n```\nenum <typeName>\n{\n   <value1>,\n\
  \   <value2>,\n   <value3>,\n   …\n   <valueN>\n}\n```\n\n接下来，你可以如下声明这种新类型的变量：\n\
  \n```\n<typeName> <varName>;\n```\n\n你可以使用以下方式进行赋值：\n\n```\n<varName> = <typeName>.<value>;\n\
  ```\n\n枚举有一个用于存储的*底层类型*。枚举类型可以取取的每个值都存储为该底层类型的值，该底层类型默认为 `int`。你可以通过在枚举声明中添加类型来指定不同的底层类型：\n\
  \n```c\nenum <typeName> : <underlyingType>\n{\n   <value1>,\n   <value2>,\n   <value3>,\n\
  \   …\n   <valueN>\n}\n```\n\n枚举的底层类型可以是 `byte`、`sbyte`、`short`、`ushort`、`int`、`uint`、`long`\
  \ 和 `ulong`。\n\n默认情况下，每个值根据其定义的顺序（从零开始）自动分配一个对应的底层类型值。这意味着 `<value1>` 获得值 0，`<value2>`\
  \ 获得 1，`<value3>` 获得 2，以此此类推。你可以通过使用 `=` 运算符为每个枚举值指定实际值来覆盖此赋值：\n\n```c\nenum <typeName>\
  \ : <underlyingType>\n{\n   <value1> = <actualVal1>,\n   <value2> = <actualVal2>,\n\
  \   <value3> = <actualVal3>,\n   …\n   <valueN> = <actualValN>\n}\n```\n\n此外，你还可以通过使用一个值作为另一个值的底层值，为多个枚举值指定相同的值：\n\
  \n```c\nenum <typeName> : <underlyingType>\n{\n   <value1> = <actualVal1>,\n   <value2>\
  \ = <value1>,\n   <value3>,\n   …\n   <valueN> = <actualValN>\n}\n```\n\n任何未分配的值都会自动获得一个底层值，其中使用的值是从上一个显式声明的值加\
  \ 1 开始的序列。在前述代码中，例如，`<value3>` 将获得值 `<value1>` + 1。\n\n请注意，这可能会导致问题，因为定义后指定的值（如\
  \ `<value2>` = `<value1>`）将与其他值相同。例如，在以下代码中，`<value4>` 将具有 `<value2>` 相同的值：\n\n\
  ```c\nenum <typeName> : <underlyingType>\n{\n   <value1> = <actualVal1>,\n   <value2>,\n\
  \   <value3> = <value1>,\n   <value4>,\n   …\n   <valueN> = <actualValN>\n}\n```\n\
  \n当然，如果这是你想要的行为，那么这段代码没有问题。还要注意，以循环方式赋值会导致定义后指定的值与其他值相同。\n\n```c\nenum <typeName>\
  \ : <underlyingType>\n{\n   <value1> = <actualVal1>,\n   <value2>\n   <value3> =\
  \ <value1>,\n   <value4>,\n   …\n   <valueN> = <actualValN>\n}\n```\n\n\n\n\n```\n\
  string friendName1 = \"Todd Anthony\";\nstring friendName2 = \"Kevin Holton\";\n\
  string friendName3 = \"Shane Laigle\";\n```\n\n但这看起来需要花费大量精力，特别是因为你必须为每个变量编写不同的代码进行处理。例如，你不能通过循环来遍历这个字符串列表。\n\
  \n另一种替代方案是使用 `array`（数组）。数组是存储在单个数组类型变量中的带索引的变量列表。例如，你可能有一个名为 `friendNames` 的数组，存储了前面字符串变量中显示的三个名称。你可以通过在方括号中指定索引来访问数组的单个成员，如下所示：\n\
  \n```\nfriendNames[<index>]\n```\n\n索引仅仅是一个整数，从第一个条目的 0 开始开始，第二个条目使用 1，依此类推。这意味着你可以使用循环来遍历这些条目：\n\
  \n```\nint i;\nfor (i = 0; i < 3; i++)\n{\n   Console.WriteLine($\"Name with index\
  \ of {i}: {friendNames[i]}\");\n}\n```\n\n数组有一个单一的 `base type`（基础类型）——也就是说，数组中的每个条目都是相同类型。这个\
  \ `friendNames` 数组的基础类型是 `string`，因为它是为了存储 `string` 变量设计的。数组条目通常被称为 `elements`（元素）。\n\
  \n### 声明数组\n\n数组以以下方式声明：\n\n```\n<baseType>[] <name>;\n```\n\n在这里，`< `baseType `>`可以是任何变量类型，包括你在本章中看到的枚举和结构体类型。在访问数组之前，必须对其进行初始化。你不能像这样直接访问或给数组元素赋值：\n\
  \n```\nint[] myIntArray;\nmyIntArray[10] = 5;\n```\n\n数组可以通过两种方式进行初始化。你可以直接以字面量形式指定数组的完整内容，也可以指定数组的大小并使用\
  \ `new` 关键字初始化所有数组元素。\n\n使用字面量值指定数组只需要提供一个用大括号括起来、逗号分隔的元素值列表：\n\n```\nint[] myIntArray\
  \ = { 5, 9, 10, 2, 99 };\n```\n\n在这里，`myIntArray` 有五个元素，每个元素都有分配的整数值。\n\n另一种方法需要以下语法：\n\
  \n```\nint[] myIntArray = new int[5];\n```\n\n在这里，你使用 `new` 关键字显式初始化数组，并使用常量值定义大小。这种方法会导致所有数组成员被分配一个默认值，对于数值类型，该\
  \ 0。你也可以使用非常量变量进行此类初始化：\n\n```\nint[] myIntArray = new int[arraySize];\n```\n\n\
  此外，如果你愿意，可以结合这两种初始化方法：\n\n```\nint[] myIntArray = new int[5] { 5, 9, 10, 2, 99 };\n\
  ```\n\n使用这种方法时，大小 `must` 匹配。例如，你不能写以下代码：\n\n```\nint[] myIntArray = new int[10]\
  \ { 5, 9, 10, 2, 99 };\n```\n\n在这里，数组定义为有 10 个成员，但只定义了五个，因此编译将失败。此的一个副作用是，如果你使用变量定义大小，那么该变量必须是一个常量：\n\
  \n```\nconst int arraySize = 5;\nint[] myIntArray = new int[arraySize] { 5, 9, 10,\
  \ 2, 99 };\n```\n\n如果省略了 `const` 关键字，这段代码将失败。\n\n与其他变量类型一样，不需要在声明数组的同一行进行初始化。以下代码是完全合法的：\n\
  \n```\nint[] myIntArray;\nmyIntArray = new int[5];\n```\n\n在接下来的 Try It Out 中，你将使用本节引言中的示例创建并使用一个字符串数组。\n\
  \n### foreach 循环\n\n`foreach` 循环允许你使用这种简单的语法处理数组中的每个元素：\n\n```\nforeach (<baseType>\
  \ <name> in <array>)\n{\n   // 可以对每个元素使用 <name>\n}\n```\n\n此循环将遍历每个元素，依次将其放入变量 `<\
  \ name >` 中，而没有访问非法元素的危险。你不需要担心数组中有多少个元素，并且可以确定你将在循环中使用每一个元素。使用这种方法，你可以如下所示修改上一个示例中的代码：\n\
  \n```csharp\nstatic void Main(string[] args)\n{\n   string[] friendNames = { \"\
  Todd Anthony\", \"Mary Chris\",\n                            \"Autry Rual\" };\n\
  \   Console.WriteLine($\"Here are {friendNames.Length} of my friends:\");\n   foreach\
  \ (string friendName in friendNames)\n   {\n      Console.WriteLine(friendName);\n\
  \   }\n   Console.ReadKey();\n}\n```\n\n这段代码的输出与上一个 Try It Out 完全相同。使用这种方法与标准 `for`\
  \ 循环的主要区别是 `foreach` 提供了数组内容的 `read-only`（只读）访问权限，因此你不能更改任何元素的值。例如，你不能执行以下操作：\n\n\
  ```sharp\nforeach (string friendName in friendNames)\n{\n   friendName = \"Lea the\
  \ unicorn\";\n}\n```\n\n如果你尝试这样做，编译将失败。如果你使用简单的 `for` 循环，就可以为数组元素赋值。\n\n### 使用 switch\
  \ 进行模式匹配\n\n在第 4 章 中，引入了 `switch` 语句。在该讨论中，case 根据特定值进行切换。查看以下代码，其中 `<testVar>`\
  \ 是某个值：\n\n```\nswitch (testVar)\n{\n   case comparisonVal1: // 如果 testVar 等于 comparisonVal1\n\
  \      break;\n   case comparisonVal2: // 如果 testVar 等于 comparisonVal2\n      break;\n\
  \   …\n   case comparisonValN: // 如果 testVar 等于 comparisonValN\n      break;\n \
  \  default: // 如果都不匹配\n      break;\n}\n```\n\n还可以根据变量类型进行 switch 匹配，例如 `string`\
  \ 或 `integer`。考虑以下 `switch` 结构：\n\n```\nswitch (testVar)\n{\n   case int value:\
  \ // 如果 testVar 是 int\n      break;\n   case string s when s.Length == 0: // 如果\
  \ testVar 是长度为 0 的字符串\n      break;\n   …\n   case null: // 如果 testVar 为 null\n\
  \      break;\n   default: // 如果不符合上述情况\n      break;\n}\n```\n\n在 `case` 关键字直接之后是你想要检查的变量类型（`string`、`int`\
  \ 等）。当匹配成功时，该类型的值会被放入声明的变量中。接下来，注意 `when` 修饰符——它通常被称为“过滤表达式”（在第 7 章 中进一步讨论）——它已应用于\
  \ `switch case` 表达式。`when` 修饰符允许你扩展或添加执行 `case` 语句内代码所需的额外条件。\n\n接下来的 Try It Out\
  \ 将更详细地涵盖上述解释的内容，并包含一些额外的概念。\n\n### 多维数组\n\n多维数组简单来说是通过多个索引来访问元素的数组。例如，假设你想根据测量的位置绘制山丘图。你可能使用两个坐标\
  \ `x` 和 `y` 来指定一个位置。你想使用这两个坐标作为索引，这样名为 `hillHeight` 的数组将存储每对坐标的高度。这涉及到使用多维数组。\n\n\
  这样的二维数组以如下方式声明：\n\n```\n<baseType>[,] <name>;\n```\n\n更多维度的数组只需要更多的逗号：\n\n```\n\
  <baseType>[,,,] <name>;\n```\n\n\n\n\n这将声明一个四维数组。赋值也使用类似的语法，用逗号分隔大小。声明并初始化二维数组 `hillHeight`，其基础类型为\
  \ `double`，`x` 大小为 3，`y` 大小为 4，需要如下：\n\n```\ndouble[,] hillHeight = new double[3,4];\n\
  ```\n\n或者，你可以使用字面量值进行初始赋值。在这里，你使用嵌套的大括号块，并用逗号分隔：\n\n```\ndouble[,] hillHeight =\
  \ { { 1, 2, 3, 4 }, { 2, 3, 4, 5 }, { 3, 4, 5, 6 } };\n```\n\n该数组的维度与上一个相同——即三行四列。通过提供字面量值，这些维度是隐式定义的。\n\
  \n要访问多维数组的单个元素，你只需要指定用逗号分隔的索引：\n\n```\nhillHeight[2,1]\n```\n\n然后你可以像操作其他元素一样操纵这个元素。此表达式将访问之前定义的第三个嵌套数组的第二个元素（值将为\
  \ 4）。记住，计数从 0 开始，且第一个数字是嵌套数组。换句话说，第一个数字指定一对大括号，第二个数字指定该对大括号内的元素。你可以直视觉化地表示此数组，所示图\
  \ 5-11。\n\n![数组视觉化表示的快照。](img/c05f011.png)\n\n图 5-11\n\n`foreach` 循环允许你以多维方式访问所有元素，就像处理单维数组一样：\n\
  \n```\ndouble[,] hillHeight = { { 1, 2, 3, 4 }, { 2, 3, 4, 5 }, { 3, 4, 5, 6 } };\n\
  foreach (double height in hillHeight)\n{\n   Console.WriteLine($\"{height}\");\n\
  }\n```\n\n元素输出的顺序与赋值字面量值的顺序相同。该序列如下（此处显示的是元素标识符，而非实际值）：\n\n```\nhillHeight[0,0]\n\
  hillHeight[0,1]\nhillHeight[0,2]\nhillHeight[0,3]\nhillHeight[1,0]\nhillHeight[1,1]\n\
  hillHeight[1,2]\n…\n```\n\n### 数组的数组\n\n如上一节所述，多维数组被称为*矩形*数组，因为每条“行”的大小都是相同的。使用上一个例子，对于任何可能的\
  \ `x` 坐标，你都可以拥有从 0 到 3 的 `y` 坐标。\n\n也可能存在*交错*数组（jagged arrays），其中“行”的大小可能各不相同。对于这种情况，你需要一个数组，其中每个元素都是另一个数组。你也可以拥有数组数组的数组，甚至更复杂的情况。然而，只有当数组具有相同的基础类型时，所有这一切才是可能的。\n\
  \n声明数组数组的语法涉及在数组声明中指定多组方括号，如下所示：\n\n```\nint[][] jaggedArray;\n```\n\n遗憾的是，初始化这样的数组并没有多维数组那么简单。例如，你不能在上述声明后紧跟以下代码：\n\
  \n```\njaggedArray = new int[3][4];\n```\n\n即使你可以这样做，它也是没有用的，因为你可以用更少的精力通过多维数组实现相同的效果。你不能使用像这样的代码：\n\
  \n```\njaggedArray = { { 1, 2, 3 }, { 1 }, { 1, 2 } };\n```\n\n你有两个选择。你可以初始化包含其他数组的数组（为了清晰，我们称这些子数组），然后逐一初始化子数组：\n\
  \n```\njaggedArray = new int[2][];\njaggedArray[0] = new int[3];\njaggedArray[1]\
  \ = new int[4];\n```\n\n或者，你可以使用上述字面量赋值的修改形式：\n\n```\njaggedArray = new int[3][]\
  \ { { 1, 2, 3 }, { 1 }, { 1, 2 } };\n```\n\n如果数组在声明的同一行进行初始化，则可以被简化：\n\n```\nint[][]\
  \ jaggedArray = { { 1, 2, 3 }, { 1 }, { 1, 2 } };\n```\n\n你可以在交错数组在使用 `foreach`\
  \ 循环，但你通常需要嵌套这些循环来获取实际数据。例如，假设你有一个如下交错数组，它包含 10 个数组，每个数组都包含一个 1 到 10 之间的整数数组：\n\n\
  ```\nint[][] divisorsTo10 = { { 1 }, { 1, 2 }, { 1, 3 }, { 1, 2, 4 }, { 1, 5 },\
  \ { 1, 2, 3, 6 }, { 1, 7 }, { 1, 2, 4, 8 }, { 1, 3, 9 }, { 1, 2, 5, 10 } };\n```\n\
  \n以下代码将失败：\n\n```\nforeach (int divisor in divisorsTo10)\n{\n   Console.WriteLine(divisor);\n\
  }\n```\n\n失败的原因是数组 `divisorsTo10` 包含的是 `int[]`，而不是 `int`。相反，你需要遍历 `divisorsTo10`\
  \ 本身：\n\n```\nforeach (int[] divisorsInt in divisorsTo10)\n{\n   foreach (int divisor\
  \ in divisorsInt)\n   {\n      Console.WriteLine(divisor);\n   }\n}\n```\n\n## 字符串操作\n\
  \n到目前为止，对字符串的使用主要是向控制台写入字符串、从控制台读取字符串以及使用 `+` 运算符拼接字符串。在编写有趣的应用程序时，你会发现处理字符串是你经常要做的事情。因此，值得花几页来看一些常用的字符串操作技术。\n\
  \n首先，`string` 类型变量可以被视为只读的 `char` 数组。这意味着你可以使用如下语法访问单个字符：\n\n```\nstring myString\
  \ = \"A string\";\nchar myChar = myString[1];\n```\n\n然而，你不能这样赋值单个字符。为了获得一个可以写入的\
  \ `char` 数组，你可以使用以下代码。这使用了数组的 `ToCharArray()` 方法：\n\n```\nstring myString = \"A\
  \ string\";\nchar[] myChars = myString.ToCharArray();\n```\n\n然后你可以像标准方式一样操纵 `char`\
  \ 数组。你也可以在 `foreach` 循环中使用字符串，如下：\n\n```\nforeach (char character in myString)\n\
  {\n   Console.WriteLine($\"{character}\");\n}\n```\n\n就像数组一样，你也可以使用 `myString.Length`\
  \ 获取元素的数量。这给出了字符串中的字符数：\n\n```\nstring myString = Console.ReadLine();\nConsole.WriteLine($\"\
  你输入了 {myString.Length} 个字符.\");\n```\n\n其他基础字符串操作技术使用与此 `string.ToCharArray()` 命令类似的命令。两个简单但实用的的是\
  \ `string.ToLower()` 和 `string.ToUpper()`。它们允许将字符串转换为小写或大写。为了理解为什么这很有用，考虑需要检查用户特定响应的情况——例如，字符串\
  \ `yes`。如果你将用户输入的字符串转换为小写，那么你也可以检查 `YES`、`Yes`、`yeS` 等——我们在上一章中见过这种方法的示例：\n\n```csharp\n\
  string userResponse = Console.ReadLine();\nif (userResponse.ToLower() == \"yes\"\
  )\n{\n   // 对响应进行操作。\n}\n```\n\n\n\n\n此命令与本节中的其他命令一样，实际上并不会更改它所作用的字符串。相反，将此命令与字符串结合会创建一个新的字符串，你可以将它与另一个字符串进行比较（如下所示），或将其赋值给另一个变量。该变量可能是正在操作的同一个变量：\n\
  \n```\nuserResponse = userResponse.ToLower();\n```\n\n这是一个需要记住的重要点，因为仅仅编写\n\n```\n\
  userResponse.ToLower();\n```\n\n实际上并不能起到什么太大作用！\n\n你还可以做其他事情来简化对用户输入的解析。如果用户不小心在输入的开头或结尾多了一个空格会怎样呢？在这种情况下，之前的代码将无法工作。你需要修剪输入的字符串，可以使用\
  \ `string.Trim()` 命令来完成：\n\n```\nstring userResponse = Console.ReadLine();\nuserResponse\
  \ = userResponse.Trim();\nif (userResponse.ToLower() == \"yes\")\n{\n   // 对响应进行操作。\n\
  }\n```\n\n之前的代码也能检测到像下面这样的字符串：\n\n```\n\" YES\"\n\"Yes \"\n```\n\n你还可以通过在 `char`\
  \ 数组中指定字符来移除任何其他字符，例如：\n\n```\nchar[] trimChars = {' ', 'e', 's'};\nstring userResponse\
  \ = Console.ReadLine();\nuserResponse = userResponse.ToLower();\nuserResponse =\
  \ userResponse.Trim(trimChars);\nif (userResponse == \"y\")\n{\n   // 对响应进行操作。\n\
  }\n```\n\n这消除了字符串开头或结尾的任何空格以及字母 `\"e\"` 和 `\"s\"`。只要字符串中没有其他字符，这将导致检测到如下的字符串：\n\n\
  ```\n\"Yeeeees\"\n\" y\"\n```\n\n等此类推。\n\n你还可以使用 `string.TrimStart()` 和 `string.TrimEnd()`\
  \ 命令，它们分别修剪字符串开头和结尾的空格。这些命令也可以指定 `char` 数组。\n\n你可以使用另外两个字符串命令来处理字符串的间距：`string.PadLeft()`\
  \ 和 `string.PadRight()`。它们允许你在字符串的左侧或右侧添加空格，以强制达到所需的长度。使用方法如下：\n\n```\n<string>.PadX(<desiredLength>);\n\
  ```\n\n这是一个示例：\n\n```\nmyString = \"Aligned\";\nmyString = myString.PadLeft(10);\n\
  ```\n\n这将在 `myString` 中的单词 `Aligned` 左侧添加三个空格。这些方法在对齐列字符串时非常有帮助，这对于包含数字的字符串的定位特别有用。\n\
  \n与修剪命令一样，你也可以通过另一种方式使用这些命令，即提供用于填充字符串的字符。这涉及单个的 `char`，而不是像修剪那样的 `char` 数组：\n\n\
  ```\nmyString = \"Aligned\";\nmyString = myString.PadLeft(10, '-');\n```\n\n这会在\
  \ `myString` 的开头添加三个连字符。\n\n还有许多此类字符串处理命令，其中许多仅在非常特定的情况下才有用。我们将在接后的章节中使用它们时进行讨论。不过，在继续之前，值得查看\
  \ Visual Studio 2017 包含的一个功能，你可能在过去的几个章节（特别是本章）中已经注意到。在接下来的“尝试一试”（Try It Out）中，你将检查自动补全，IDE\
  \ 会通过建议你可能想要插入的代码来提供帮助。\n\n#### 练习题\n\n1. 5.1 下列转换中哪一个不能隐式执行？\n    1. `int` 到 `short`\n\
  \    2. `short` 到 `int`\n    3. `bool` 到 `string`\n    4. `byte` 到 `float`\n2. 5.2\
  \ 显示一个基于 `short` 类型的 `color` 枚举代码，包含彩虹色加上黑色和白色。此枚举可以基于 `byte` 类型吗？\n3. 5.3 下列代码可以编译吗？为什么可以或不可以？\n\
  \    ```\n    string[] blab = new string[5]\n    blab[5] = 5th string.\n    ```\n\
  4. 5.4 编写一个控制台应用程序，接受用户的字符串并输出字符顺序反的字符串。\n5. 5.5 编写一个控制台应用程序，接受字符串并将所有出现的字符串 `no`\
  \ 替换为 `yes`。\n6. 5.6 编写一个控制台应用程序，在字符串的每个周围加上双引号。\n\n练习题答案可以在附录中找到。\n\n## ▸ 本章所学\n\
  \n| 主题 | 核心概念 |\n| --- | --- |\n| 类型转换 | 你可以将值从一种类型转换为另一种类型，但在这样做时会有相应的规则。隐式转换会自动发生，但仅当源值类型的所有可能值在目标值类型中可用时才会。显式转换也是可能的，但你面临值未按预期赋值的风险，甚至会导致错误。\
  \ |\n| 枚举 | 枚举（enums）是具有离散值集的类型，每个值都有一个名称。枚举使用 `enum` 关键字定义。这使得它们在代码中易于理解，因为具有良好的可读性。枚举有一个底层数值类型（默认认为\
  \ `int`），你可以利用枚举值的属性在枚举值和数值之间进行转换。 |\n| 结构体 | 结构体（structures）是同时包含多个不同值的类型。结构体使用\
  \ `struct` 关键字定义。结构体包含的每个值都有名称和类型；并不要求存储在结构体中的每个值都是相同类型。 |\n| 数组 | 数组是相同类型值的集合。数组具有固定的大小或长度，这决定了它们可以包含多少值。你可以定义多维数组或锯齿数组来存储不同数量和形状的数据。你还可以使用\
  \ `foreach` 循环遍历数组中的值。 |\n\n# 6 函数\n\n### 本章代码下载\n\n本章的代码下载可以在书籍页面的 [`www.wiley.com`](http://www.wiley.com)\
  \ 找到。点击 Downloads 链接。代码也可以在 [`github.com/benperk/BeginningCSharpAndNET`](http://github.com/benperk/BeginningCSharpAndNET)\
  \ 找到。代码位于 Chapter06 文件夹中，并根据章节中的名称单独命名。\n\n目前为止的所有代码都以单个块的形式，可能带有一些循环来重复代码行，以及用于执行语句的分支。在你的数据上执行操作意味着将代码放在你希望它工作的地方。\n\
  \n这种代码结构是有限的。通常，某些任务——例如找到数组中的最大值——可能需要在程序的多个点执行。你可以在需要时在应用程序中放置相同（或几乎相同）的代码段，但这会有自己的问题。更改有关常见任务的任何一个微小细节（例如纠正代码错误）可能需要修改多个代码段，这些段散布在整个应用程序中。漏掉任何一处都会导致严重的后果并导致整个应用程序失败。此外，应用程序可能会变得非常长。\n\
  \n解决此问题的方案是使用*函数*。C# 中的函数是提供可以在应用程序中任何点执行的代码块的手段。\n\n例如，你可以编写一个计算数组中最大值的函数。你可以从代码的任何点调用该函数，并在每次情况下都使用相同的代码行。由于你只需要提供一次代码，因此你对其所做的任何更改将影响使用该计算的所有地方。函数可以被认为包含*可重用*的代码。\n\
  \n\n\n\n函数还具有提高代码可读性的优势，因为你可以使用它们将相关的代码组合在一起。这样，你的应用程序主体就可以变得非常短，因为代码的内部工作机制被分离出来。这类似于你在\
  \ Visual Studio 中通过展开和收起解决方案管理器（Solution Explorer）窗口中的对象来折叠代码区域的方式。这样做可以让你的应用程序具有更具逻辑性的结构。\n\
  \n函数还可用于创建多功能代码，使其能够对不同的数据执行相同的操作。你可以通过参数的形式向函数提供信息进行处理，并以返回值的形式从函数获取结果。在前面的示例中，你可以提供一个待搜索的数组作为参数，并将数组中的最大值作为返回值。这意味着你每次都可以使用同一个函数来处理不同的数组。函数定义由一个名称、一个返回类型和一个参数列表组成，该列表指定了函数所需的参数数量和类型。函数的名称和参数（但不包括其返回类型）共同定义了函数的\
  \ `signature`（签名）。\n\n# 定义和使用函数\n\n本节描述了你如何向应用程序中添加函数，然后从代码中调用（使用）它们。从基础知识开始，你将看到与调用它的代码不交换任何数据的简单函数，然后查看更高级的函数用法。接下来的“Try\
  \ It Out”（尝试一下）将带上手。\n\n## 返回值\n\n与函数交换数据最简单的方法是使用返回值。具有返回值的函数 `evaluate`（评估）该值的方式，与你在表达式中使用变量时评估其包含的值的方式完全相同。与变量一样，返回值也有类型。\n\
  \n例如，你可能有一个名为 `GetString()` 的函数，其返回值为字符串。你可以在代码中使用它，如下：\n\n```cs\nstring myString;\n\
  myString = GetString();\n```\n\n或者，你可能有一个名为 `GetVal()` 的函数，它返回一个 `double` 值，你可以在数学表达式中使用它：\n\
  \n```cs\ndouble myVal;\ndouble multiplier = 5.3;\nmyVal = GetVal() * multiplier;\n\
  ```\n\n当函数返回值时，你必须以两种方式修改你的函数：\n\n* 在函数声明中指定返回值的类型，而不是使用 `void` 关键字。\n* 使用 `return`\n\
  \n关键字结束函数执行并将返回值传递给调用代码。\n\n在代码术语中，在你之前看到的此类类型的控制应用程序函数中，它看起来如下：\n\n```cs\nstatic\
  \ <returnType> <FunctionName>()\n{\n   …\n   return <returnValue>;\n}\n```\n\n这里的限制是\
  \ `returnValue` 必须是一个类型为 `returnType` 的值或可以隐式转换为该类型的值。然而，`returnType`可以是你想要的任何类型，包括你过的更复杂的类型。这可能简单如下：\n\
  \n```cs\nstatic double GetVal()\n{\n   return 3.2;\n}\n```\n\n然而，返回值通常是函数执行某些处理的结果；前面的操作也可以很容易地使用\
  \ `const` 变量来实现。\n\n当运行到 `return` 语句时，程序执行立即返回到调用代码。该语句后的任何代码行都不会被执行，但这并不意味着 `return`\
  \ 语句只能放置在函数体的最后一行。你可以在代码较早的地方使用 `return`，也许在执行完某些分支逻辑之后。在 `for` 循环、`if` 块或任何其他结构中放置\
  \ `return` 会导致该结构立即终止且函数终止：\n\n```cs\nstatic double GetVal()\n{\n   double checkVal;\n\
  \   // checkVal 通过某些逻辑赋值了值（此处未显示）。\n   if (checkVal < 5)\n      return 4.7;\n  \
  \ return 3.2;\n}\n```\n\n在这里，返回两个值之一，取决于 `checkVal` 的值。在这种情况下，唯一的限制是在到达函数的结束大括号\
  \ `}` 之前必须处理 `return` 语句。以下是非法的：\n\n```cs\nstatic double GetVal()\n{\n   double\
  \ checkVal;\n   // checkVal 通过某些逻辑赋值了值。\n   if (checkVal < 5)\n      return 4.7;\n\
  }\n```\n\n如果 `checkVal >= 5`，则没有满足 `return` 语句，这是不允许的。所有的处理路径都必须到达 `return` 语句。在大多数情况下，编译器会检测到这一点并给你错误“并非所有代码路径都返回了值”。\n\
  \n执行单行代码的函数可以使用称为“表达式体方法”（expression-bodied methods）的特性。下面的函数模式使用 `=>`（lambda 箭头）来实现这一特性：\n\
  \n```cs\nstatic <returnType> <FunctionName>() => <myVal1 * myVal2>;\n```\n\n例如，考虑一个\
  \ `Multiply()` 函数，它可以以任种格式编写：\n\n```cs\nstatic double Multiply(double myVal1, double\
  \ myVal2)\n{\n      return myVal1 * myVal2;\n}\n```\n\n它也可以使用 `=>`（lambda 箭头）编写。这里编写的代码的结果以更简单、更整合的方式表达了函数的意图：\n\
  \n```cs\nstatic double Multiply(double myVal1, double myVal2) => mVal1 * MyVal2;\n\
  ```\n\n## 参数\n\n当函数需要接受参数时，你必须指定以下内容：\n\n* 函数接受的参数列表\n* 每次函数调用中匹配的参数列表\n\n这涉及以下代码，你可以拥有任意数量的参数，每个参数都有一个类型：\n\
  \n```cs\nstatic <returnType> <FunctionName>(<paramType> <paramName>, …,\n{\n   …\n\
  \   return <returnValue>;\n}\n```\n\n参数使用逗号分隔，这些参数可以在函数内部作为变量访问。例如，一个简单的函数可能接收两个\
  \ `double` 参数并返回它们的乘积：\n\n```cs\nstatic double Product(double param1, double param2)\n\
  {\n   …\n   return param1 * param2;\n}\n```\n\n或者\n\n```cs\nstatic double Product(double\
  \ param1, double param2) => param1 * param2;\n```\n\n接下来的 Try It Out 提供更多示例。\n\n\
  ### 参数匹配\n\n当你调用函数时，你必须提供与函数定义匹配的参数。这意味着要匹配参数类型、参数数量以及参数顺序。例如，函数\n\n```cs\nstatic\
  \ void MyFunction(string myString, double myDouble)\n{\n   …\n}\n```\n\n不能通过以下方式调用：\n\
  \n```cs\nMyFunction(2.6, \"Hello\");\n```\n\n在这里，你试图将 `double` 值作为第一个参数，将 `string`\
  \ 值作为第二个参数，这与函数定义中的顺序不符。代码将无法编译，因为参数类型错误。在本章后面的“重载函数”部分中，你将学习解决此问题的有效技巧。\n\n###\
  \ 参数数组\n\nC# 允许你为函数指定一个（仅一个）特殊参数。该参数必须是函数定义中的最后一个，被称为“参数数组”（parameter array）。参数数组允许使用可变数量参数调用函数，并使用\
  \ `params` 关键字定义。\n\n参数数组可以是简化代码的有用方法，因为你不需要从调用代码中传递数组。相反，你传递多个相同类型的参数，这些参数会被放在可以在函数内部使用的数组中。\n\
  \n定义使用参数数组的函数需要以下代码：\n\n```cs\nstatic <returnType> <FunctionName>(<p1Type> <p1Name>,\
  \ …,\n                                   params <type>[] <name>)\n{\n   …\n   return\
  \ <returnValue>;\n}\n```\n\n你可以使用如下代码调用此函数：\n\n\n\n\n```\n<FunctionName>(<p1>, …,\
  \ <val1>, <val2>, …)\n```\n\n`<val1>`、`<val2>` 等是类型 `<type>` 的值，用于初始化 `<name>` 数组。你可以在此处指定的参数数量几乎是无限的；唯一的限制是它们必须都是\
  \ `<type>` 类型。你甚至可以指定任何参数。\n\n下面的“尝试一下”（Try It Out）定义并使用了一个带有 `params` 类型参数的函数。\n\
  \n### 引用和值参数\n\n本章到目前为止定义函数都具有值参数。也就是说，当你使用参数时，你将一个值传递给函数所使用的变量。在函数中对该变量所做的任何更改对函数调用中指定的参数都没有影响。例如，考虑一个将传递参数的值翻倍并输出的函数：\n\
  \n```cs\nstatic void ShowDouble(int val)\n{\n   val *= 2;\n   Console.WriteLine($\"\
  val doubled = {val}\");\n}\n```\n\n在这里，参数 `val` 在此函数中被翻倍了。如果你这样调用它：\n\n```cs\nint\
  \ myNumber = 5;\nConsole.WriteLine($\"myNumber = {myNumber}\");\nShowDouble(myNumber);\n\
  Console.WriteLine($\"myNumber = {myNumber}\");\n```\n\n那么控制台的文本输出如下：\n\n```\nmyNumber\
  \ = 5\nval doubled = 10\nmyNumber = 5\n```\n\n使用 `myNumber` 作为参数调用 `ShowDouble()`\
  \ 不影响 `Main()` 中 `myNumber` 的值，尽管赋值给它的参数 `val` 被翻倍了。\n\n这很好，但如果你*想要*让 `myNumber`\
  \ 的值发生变化，你就遇到问题了。你可以使用一个返回 `myNumber` 新值的函数，如下：\n\n```cs\nstatic int DoubleNum(int\
  \ val)\n{\n   val *= 2;\n   return val;\n}\n```\n\n你可以使用以下方式调用此函数：\n\n```cs\nint\
  \ myNumber = 5;\nConsole.WriteLine($\"myNumber = {myNumber}\"); \nmyNumber = DoubleNum(myNumber);\n\
  Console.WriteLine($\"myNumber = {myNumber}\");\n```\n\n然而，这段代码极不直观，而且无法处理作为参数的多个变量的值变化（因为函数只有一个返回值）。\n\
  \n相反，你希望通过*引用*传递参数，这意味着函数将与函数调用中使用的变量完全相同，而不仅仅是一个具有相同值的变量。因此，对该变量所做的任何更改将反映在作为参数的变量的值上。要实现这一点，只需使用\
  \ `ref` 关键字来指定参数：\n\n```cs\nstatic void ShowDouble(ref int val)\n{\n   val *= 2;\n\
  \   Console.WriteLine($\"val doubled = {val}\");\n}\n```\n\n然后，在函数调用中再次指定（这是强制性的）：\n\
  \n```cs\nint myNumber = 5;\nConsole.WriteLine($\"myNumber = {myNumber}\");\nShowDouble(ref\
  \ myNumber);\nConsole.WriteLine($\"myNumber = {myNumber}\");\n```\n\n现在控制台的文本输出如下：\n\
  \n```\nmyNumber = 5\nval doubled = 10\nmyNumber = 10\n```\n\n注意作为 `ref` 参数的变量有两个限制。首先，函数可能会引用参数的值发生变化，因此你必须在函数调用中使用非常量变量。因此，以下代码是非法的：\n\
  \n```cs\nconst int myNumber = 5;\nConsole.WriteLine($\"myNumber = {myNumber}\");\n\
  ShowDouble(ref myNumber);\n```\n\n其次，你必须使用已化的变量。C# 不允许你假设 `ref` 参数会在使用它的函数中被初始化。以下代码也是非法的：\n\
  \n```cs\nint myNumber;\nShowDouble(ref myNumber);\n```\n\n到目前为止，你只看到 `ref` 关键字应用于函数参数，但它也可以应用于局部变量和返回值。在这里，`myNumberRef`\
  \ 引用了 `myNumber`，更改 `myNumberRef` 会导致 `myNumber` 改变：\n\n```cs\nint myNumber = 5;\n\
  ref int myNumberRef = myNumber;\n```\n\n还可以将 `ref` 关键字作为返回类型。注意下面的代码中，`ref` 关键字标识返回类型为\
  \ `ref int`，并且位于代码体中，这指示函数返回 `ref val`：\n\n```cs\nstatic ref int ShowDouble(int\
  \ val)\n{\n  val *= 2;\n  return val;\n}\n```\n\n如果你尝试编译前面的函数，将收到一个错误。原因为你不能在不给变量声明加上\
  \ `ref` 关键字的情况下，将变量通过引用作为函数参数传递。查看下面的代码，其中添加了 `ref` 关键字——该函数将按预期编译并运行：\n\n```cs\n\
  static ref int ShowDouble(ref int val)\n{\n  val *= 2;\n  return val;\n}\n```\n\n\
  像 `strings` 和 `arrays` 这样的变量是引用类型，`arrays` 可以在不声明参数的情况下使用 `ref` 关键字返回：\n\n```cs\n\
  static ref int ReturnByRef()\n{\n  int[] array = { 2 };\n  return array[0];\n}\n\
  ```\n\n### 输出参数\n\n除了通过引用传递值外，你可以使用 `out` 关键字指定给定参数为*输出参数*，这与 `ref` 关键字的方式相同（在函数定义和函数调用中）。实际上，这带给你与\
  \ `ref` 参数几乎相同的行为，但有重要的区别：\n\n- 对于 `ref` 参数使用未初始化的变量是非法的，但对于 `out` 参数可以是。`out` 参数在使用它的函数中必须被视为未初始化的。\n\
  - 在函数执行时，`ref` 参数存储的值会丢失。\n\n作为一个例子，考虑早先 `MaxValue()` 函数的扩展，它返回数组中的最大值。稍微修改该函数，以便获取具有最大值的元素的索引。为了保持简单，当存在多个具有最大值的元素时，获取其第一次出现的索引。通过如下方式修改函数来添加\
  \ `out` 参数：\n\n```cs\nstatic int MaxValue(int[] intArray, out int maxIndex)\n{\n\
  \   int maxVal = intArray[0];\n   maxIndex = 0;\n   for (int i = 1; i < intArray.Length;\
  \ i++)\n   {\n      if (intArray[i] > maxVal)\n      {\n         maxVal = intArray[i];\n\
  \         maxIndex = i;\n      }\n   }\n   return maxVal;\n}\n```\n\n你可以这样使用函数：\n\
  \n```cs\nint[] myArray = { 1, 8, 3, 6, 2, 5, 9, 3, 0, 2 };\nConsole.WriteLine(\"\
  The maximum value in myArray is \" + \n                 $\"{MaxValue(myArray, out\
  \ int maxIndex)}\");\nConsole.WriteLine(\"The first occurrence of this value is\
  \ \" +\n                 $\"at element {maxIndex + 1}\");\n```\n\n结果如下：\n\n```\n\
  The maximum value in myArray is 9\nThe first occurrence of this value is at element\
  \ 7\n```\n\n你必须在函数调用中使用 `out` 关键字，就像使用 `ref` 关键字一样。`out` 关键字的另一个有用场景是配合 `TryParse()`\
  \ 方法解析数据，在这种情况下，它检查输入是否为整数：\n\n```cs\nif (!int.TryParse(input, out int result))\n\
  {\n  return null;\n}\nreturn result;\n```\n\n### 元组 (Tuples)\n\n\n\n\n有许多方法可以让函数返回多个值。例如，你可以使用\
  \ `out` 关键字、结构体或数组，或者通过本章稍后讨论的类来实现。使用 `out` 关键字可以实现从函数返回多个值的目标；然而，这样做使用的该功能并非其设计初衷。请记住，`out`\
  \ 关键字旨在通过引用传递参数，而无需事先对其进行初始化。结构体、数组和类都是有效的选项，但它们需要额外的代码来创建、初始化、引用和读取。相比之下，`tuple`（元组）是一种非常优雅的方法，可以用很小的开销实现这一目标。\n\
  \n由于 `tuple` 提供了一种非常方便且直接的方法来从函数返回多个值，因此当程序不需要结构体或更复杂的实现时，它是最有用的。来看这个简单的 `tuple`\
  \ 示例：\n\n```\nvar numbers = (1, 2, 3, 4, 5);\n```\n\n该代码创建了一个名为 `numbers` 的 `tuple`，包含成员\
  \ `Item1`、`Item2`、`Item3`、`Item4` 和 `Item5`，可以通过以下方式访问它们（例如）：\n\n```\nvar number\
  \ = numbers.Item1;\n```\n\n或者，为了给成员指定特定的名称，你可以明确地标识它们：\n\n```\n(int one, int two,\
  \ int three, int four, int five) nums = (1, 2, 3, 4, 5);\nint first = nums.one;\n\
  ```\n\n函数声明看起来像如下所示，它使用了 `IEnumerable` 接口。接口将在第 8 章中引入，但现在请知道，`Enumerable` 对象意味着它暴露了允许查询其中包含值的方法。\n\
  \n```\nprivate static (int max, int min, double average)       \n    GetMaxMin(IEnumerable<int>\
  \ numbers)\n    {\n      return (Enumerable.Max(numbers), \n              Enumerable.Min(numbers),\
  \ \n              Enumerable.Average(numbers));\n    }\n```\n\n然后在简单的控制台应用程序中使用此代码：\n\
  \n```\nstatic void Main(string[] args)\n{\n  IEnumerable<int> numbers = new int[]\
  \ { 1, 2, 3, 4, 5, 6 };\n  var result = GetMaxMin(numbers);\n  Console.WriteLine($\"\
  Max number is {result.max}, \" +\n                    $\"Min number is {result.min},\
  \ \" +\n                    $\"Average is {result.average}\");\n  Console.ReadLine();\n\
  }\n```\n\n结果将如 图 6-4 所示。你可以在章节下载包的 `Tuple\\Program.cs` 中找到本章讨论的代码。\n\n![代码输出的截图](img/c06f004.png)\n\
  \n**图 6-4**\n\n# 变量作用域\n\n在前面的部分中，你可能一直在想为什么与函数交换数据是必要的。这是因为 C# 中的变量只能从代码的局部区域访问。给定的变量认为有一个\
  \ `scope`（作用域），在该作用域内是可以访问的。\n\n变量作用域是一个重要的主题，通过示例介绍是最好的。下面的“尝试一试”说明了这样一种情况：在一个作用域中定义变量，并在另一个作用域中尝试使用它。\n\
  \n## 其他结构中的变量作用域\n\n前述部分提到的点之一在函数之间的变量作用域之外还有影响：即变量的作用域涵盖了定义它们的代码块以及任何直接嵌套的代码块。你可以在章节下载包的\
  \ `VariableScopeInLoops\\Program.cs` 中找到下文讨论的代码。这也适用于其他代码块，例如分支和循环结构中的代码块。考虑以下代码：\n\
  \n```\nint i;\nfor (i = 0; i < 10; i++)\n{\n   string text = $\"Line {Convert.ToString(i)}\"\
  ;\n   Console.WriteLine($\"{text}\");\n}\nConsole.WriteLine($\"Last text output\
  \ in loop: {text}\");\n```\n\n在这里，字符串变量 `text` 是 `for` 循环局部的。此代码将无法编译，因为发生在循环外的\
  \ `WriteLine()` 调用尝试使用变量 `text`，而该变量在循环外部已超出作用域。尝试按照如下所示修改代码：\n\n```\nint i;\nstring\
  \ text;\nfor (i = 0; i < 10; i++)\n{\n   text = $\"Line {Convert.ToString(i)}\"\
  ;\n   Console.WriteLine($\"{text}\");\n}\nConsole.WriteLine($\"Last text output\
  \ in loop: {text}\");\n```\n\n此代码也将失败，因为变量必须在使用之前进行声明和初始化，而 `text` 只在 `for` 循环中初始化了。当退出循环块时，分配给\
  \ `text` 的值就会丢失，因为它在块外部没有被初始化。然而，你可以进行以下更改：\n\n```\nint i;\nstring text = \"\";\n\
  for (i = 0; i < 10; i++)\n{\n   text = $\"Line {Convert.ToString(i)}\";\n   Console.WriteLine($\"\
  {text}\");\n}\nConsole.WriteLine($\"Last text output in loop: {text}\");\n```\n\n\
  这一次，`text` 在循环外进行了初始化，你可以访问它的值。此简易代码的结果如 图 6-7 所示。\n\n![执行代码后的结果截图](img/c06f004.png)\n\
  \n**图 6-7**\n\n循环中最后赋值给 `text` 的值可以从循环外部访问。\n\n## 参数、返回值与全局数据\n\n让我们仔细观察一下通过全局数据以及通过参数和返回值与函数进行数据交换。回顾一下，考虑以下代码：\n\
  \n```class Program\n{\n   static void ShowDouble(ref int val)\n   {\n      val *=\
  \ 2;\n      Console.WriteLine($\"val doubled = {val}\");\n   }\n   static void Main(string[]\
  \ args)\n   {\n      int val = 5;\n      Console.WriteLine($\"val = {val}\");\n\
  \      ShowDouble(ref val);\n      Console.WriteLine($\"val = {val}\");\n      Console.ReadLine();\n\
  \   }\n}\n```\n\n现在将其与此代码对比：\n\n```\nclass Program\n{\n   static int val;\n   static\
  \ void ShowDouble()\n   {\n      val *= 2;\n      Console.WriteLine($\"val doubled\
  \ = {val}\");\n   }\n   static void Main(string[] args)\n   {\n      val = 5;\n\
  \      Console.WriteLine($\"val = {val}\");\n      ShowDouble();\n      Console.WriteLine($\"\
  val = {val}\");\n      Console.ReadLine();\n   }\n}\n```\n\n这两个 `ShowDouble()` 函数的结果是完全相同的。\n\
  \n对于使用一种技术而不是另一种技术，并没有硬性的规定，且两种技术在某种上都是完全可的，但你可能想要考虑以下指南。\n\n\n\n\n首先，正如在首次介绍此主题时所提到的，使用全局值的\
  \ `ShowDouble()` 版本仅使用了全局变量 `val`。要使用此版本，你必须使用这个全局变量。这在某种程度上限制了函数的通用性，意味着如果你打算存储结果，就必须不断将全局变量的值复制到其他变量中。此外，全局数据可能会被应用程序其他部分的代码修改，这可能导致不可预测的结果（值可能会在你没有察觉的情况下发生变化，直到事已为晚）。最后，使用名为\
  \ `VAL` 的全局变量意味着项目代码中的任何其他地方都不能使用该名称；如果真的发生了这种情况，那么在引用它时就会产生关于指的是哪一个的困惑。请审慎地使用全局变量。\n\
  \n当然，也有人认为，这种简单性使得你的代码更难理解。显式地指定参数可以让你一目了然看到正在发生的变化。如果你看到类似 `FunctionName(val1,\
  \ out val2)` 的调用，你立即知道 `val1` 和 `val2` 是需要考虑的重要变量，并且在函数完成时 `val2` 将被赋予新值。相反，如果此函数没有接受参数，你将无法对它所处理的数据做出任何假设。\n\
  \n请自由使用任一种技术来交换数据。通常情况下，请使用参数而不是全局数据；然而，在某些情况下全局数据可能更合适，使用该技术也绝对不是错误。\n\n### 局部函数\
  \ (Local Functions)\n\n在本章开头介绍函数概念时提到过，这一点是：将代码从 `Main(string[] args)` 函数中提取出来的理由是为了它可以被重用，而不是在同一个程序中多次重新编写。在大多数情况下，设计和创建程序时，你应该遵循这种思维方式。\n\
