  \   }\n   public int Count\n   {\n      get\n      {\n         return innerCollection.Count;\n\
  \      }\n   }\n   public bool IsReadOnly\n   {\n      get\n      {\n         return\
  \ innerCollection.IsReadOnly;\n      }\n   }\n   public bool Remove(T item) => innerCollection.Remove(item);\n\
  \   #endregion\n   #region IEnumerable<T> Members\n   public IEnumerator<T> GetEnumerator()\
