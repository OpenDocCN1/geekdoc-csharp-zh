  \n### 错误列表窗口 (The Error List Window)\n\n\n\n\n目前，“错误列表”窗口（视图 ➪错误列表）没有显示任何有趣的内容，因为应用程序没有出现错误。然而，这确实是一个非常有用的窗口。作为一个测试，请删除你在上一节中添加的某行代码中的分号。过了一会儿，你应该会看到类似图\
  \ 2-10 所示的显示。\n\n![错误列表窗口截图。](img/c02f010.png)\n\n`图 2-10`\n\n此外，项目将不再能够编译。\n\n\
  此窗口可以帮助你消除代码中的错误，因为它记录了你编译项目必须执行的操作。如果你双击此处显示的错误，光标将跳转到源代码中错误所在的位置（如果包含错误的源文件尚未打开，则会自动打开），这样你就可以快速修复它了。代码中的错误位置会出现红色波浪线，因此你可以快速扫描源代码以查看问题所在之处。\n\
  \n错误位置是通过行号指定的。默认情况下，Visual Studio 文本编辑器不显示行号，但这是非常值得开启的功能。要这样做，请勾选 `选项` 对话框中的 `行号`\
  \ 复选框（通过 `工具` ➪ `选项` 菜单项选择）。它出现在 `文本编辑器` ➪ `所有语言` ➪ `常规` 中。\n\n你也可以通过对话框中的特定语言设置页面按语言更改此设置。通过此对话框可以找到许多其他实用选项，你将在本书的后后部分中使用其中几个。\n\
  \n## 桌面应用程序\n\n将代码作为桌面应用程序的一部分运行来演示，通常比通过控制窗口或命令提示符运行更容易。你可以使用用户界面构建块来拼凑出一个用户界面。\n\
  \n接下来的“尝试一下”（Try It Out）将仅展示这种操作的基本知识，你将看到如何在不了解应用程序具体操作细节的情况下让一个桌面应用程序运行起来。在这里你将使用\
  \ `WPF`，这是微软推荐用于创建桌面应用程序的技术。稍后，你将详细查看应用程序，并学习更多关于 WPF 是什么及其能力的知识。\n\n## 本章学到的知识\n\
