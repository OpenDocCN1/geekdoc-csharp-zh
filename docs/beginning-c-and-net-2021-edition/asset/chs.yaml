  \ `@Type` |\n| 选择当前节点的所有属性 | `@*` |\n| 按索引选择子节点——在此情况下为第二个元素节点 | `element[2]` |\n\
  | 选择当前节点的所有文本节点 | `text()` |\n| 选择此节点元素子节点的文本节点 | `element/text()` |\n| 选择文档中具有特定名称的所有节点——在此情况下为所有\
  \ `mass` 节点 | `//mass` |\n| 选择文档中具有特定名称和特定父节点的节点——在此情况下，父节点名称为 `element`，节点名称为 `name`\
  \ | `//element/name` |\n| 选择符合值标准的节点——在此情况下，名称为 `Hydrogen` 的元素 | `//element[name='Hydrogen']`\
