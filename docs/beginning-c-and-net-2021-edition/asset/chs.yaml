  \n## ▸ 本章所学\n\n| 主题 | 核心概念 |\n| --- | --- |\n| 流 (Streams) | 流是串行设备的抽象表示，你可以一次读取或向其写入一个字节。文件就是这种设备的示例。流有两种类型——输入流和输出流——分别用于从设备读取和写入设备。\
  \ |\n| 文件类 (File classes) | .NET Framework 中有许多类抽象了文件系统访问，包括通过静态方法处理文件和目录的 `File`\
  \ 和 `Directory`，以及可以实例化以表示特定文件和目录的 `FileInfo` 和 `DirectoryInfo`。当你对同一个文件和目录执行多次操作时，后两类类非常有用，因为这些类不需要为每个方法调用都提供路径。你可以在文件和目录上执行的典型操作包括查询和更改属性、创建、删除和复制。\
  \ |\n| 文件路径 (File paths) | 文件和目录路径可以是绝对路径或相对路径。绝对提供了从包含它的磁盘根目录开始的位置的完整描述；所有父目录通过反斜杠与子目录分开。相对目录类似，但它们从文件系统中的定义点开始，例如应用程序执行所在的目录（工作目录）。要导航到文件系统，你通常使用\
  \ `..` 父目录别名。 |\n| `FileStream` 对象 | `FileStream` 对象提供了对文件内容的访问，用于读取和写入。它在字节级上访问文件数据，因此并不总是访问文件数据的最佳选择。`FileStream`\
  \ 实例维护文件中的位置索引，以便你导航文件内容。以这种方式访问文件被称为*随机访问*。 |\n| 在流中读写 | 读写文件数据的更简单方法是结合使用 `FileStream`\
  \ 使用 `StreamReader` 和 `StreamWriter`。这些类允许读取和写入字符和字符串数据，而不是处理字节。这些类型暴露了熟悉字符串的方法，包括\
  \ `ReadLine()` 和 `WriteLine()`。由于它们处理字符串数据，这些类使得处理逗号分隔文件变得简单，这是表示结构化数据的常用方式。 |\n\
  | 压缩文件 | 你可以使用 `DeflateStream` 和 `GZipStream` 压缩流类从文件读取和写入压缩数据。这些类与 `FileStream`\
  \ 一样处理字节数据，但与 `FileStream` 一样，你可以通过 `StreamReader` 和 `StreamWriter` 类访问数据。 |\n|\
