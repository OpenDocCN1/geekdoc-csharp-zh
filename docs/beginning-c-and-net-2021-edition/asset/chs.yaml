  \ Members\n   IEnumerator IEnumerable.GetEnumerator() => GetEnumerator();\n   #endregion\n\
  }\n```\n\n## 练习 6\n\n不，不会的。类型参数 `T` 被定义为协变的。然而，协变类型参数只能用作方法的返回值，而不能作为方法的参数。如果你尝试这样做，你将得到以下编译器错误（假设你使用了命名空间\
