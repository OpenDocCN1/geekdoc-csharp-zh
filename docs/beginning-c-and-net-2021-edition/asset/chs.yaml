  \ 事件或 `Connection.MessageArrived` 事件。处理程序应输出一个字符串，指定接收到了什么类型的事件，以及 `MessageArrivedEventArgs`\
  \ 参数的 `Message` 属性或 `ElapsedEventArgs` 参数的 `SignalTime` 属性，取决于发生了哪种事件。\n\n\n\n\n\
