  \ C# 对象与 JSON 格式之间的快速`serialization`（序列化）和`deserialization`（反序列化）。序列是将对象转换为字符字符串格式的过程，该格式可以通过网络传输或保存到文件中。反序列化是序列化的反过程，即从字符字符串读取并创建代码使用的对象。你也可以对\
  \ XML 或二进制数据进行序列化和反序列化，但 JSON 是最理想的，因为它紧凑且易于人类阅读，使得调试更加容易。\n\n下面的简短“尝试一下”（Try It\
  \ Out）展示了如何将对象集合序列化为 JSON 并保存到文件，然后读取刚刚创建的文件并反序列化为另一个对象集合。\n\n### 练习\n\n1. **15.1**\
