  \ C# 代码。在本章中，你将探索 ASP.NET Core Web API 和 Blazor 应用程序。\n\n## 创建 ASP.NET CORE WEB\
  \ API\n\n*应用程序编程接口*（API）计算机编程概念已经存在几十年了，通常被描述为包含一组用于构建软件程序的有用函数的模块。最初，从 Windows\
  \ 客户端应用程序的角度来看，这些模块是动态链接库（`.dll`），它们公开了可以通过编程访问的接口，将内部函数暴露给其他程序。在这样的系统中，当消费程序使用\
  \ API 时，它就会依赖于接口的模式。接口的更改会导致消费程序出现异常和失败，因为当前访问和执行模块内函数的程序不再有效。一旦程序依赖于接口，就不应对其进行更改。当发生更改时，该事件通常被称为“DLL\
  \ 地狱”（DLL Hell）。有关 DLL 地狱的更多信息，请阅读这篇文章：`en.wikipedia.org/wiki/DLL_Hell`。\n\n随着时间的推移，互联网和内网解决方案的实现成为主流，对\
  \ Web 服务和 Windows Communication Foundation（WCF）等技术的依赖也产生了。Web 服务和 WCF 都暴露了正式的合约接口，将它们包含的函数暴露给其他程序。与之前提到的模块与消费程序位于同一台计算机上的\
  \ DLL API 相比，Web 服务和 WCF 托管在 Web 服务器上。由于托管在互联网或内网 Web 服务器上，对 Web 界面的访问不再局限于单台计算机，而是从任何设备、任何具有互联网或网络化内网连接的地方都可以进行。\n\
  \n回想上一章中对云优化堆栈的分析。从该讨论中，你学到要实现*云优化*，程序必须具有较小的内存占用、能够处理高吞吐量并且支持跨平台。ASP.NET Core Web\
  \ API 基于 ASP.NET MVC（模型-视图-控制器）概念，该概念直接与新的云优化堆栈对齐。\n\n在接下来的“尝试”中，你将创建一个发牌的 ASP.NET\
  \ Core Web API。现在 ASP.NET Core Web API 已创建，进入下一节学习 API 的消费。\n\n## 消费 ASP.NET CORE\
  \ WEB API\n\n当你在上一个练习中运行 ASP.NET Core Web API 时，可以使用 Swagger 页面来测试 API。你也可以在应用程序运行时直接将\
  \ URL 输入浏览器，并将收到 JSON 响应的输出。请求 `https://localhost:44348/api/HandOfCards/Benjamin`\
  \ 将输出类似于图 20-5 所示的内容。请确保将端口号（分号后的数字串）更改为你在浏览器中看到的。`Benjamin` 是你想要获取牌的玩家名称。\n\n![请求\
  \ https://localhost:44348/api/ HandOfCards/Benjamin 的输出页面截图](img/c20f005.png)\n\n\
  **图 20-5**\n\n还有一个名为 CURL 的工具，在处理 Web API 时非常有用。如图 20-6 所示，执行以下命令也将为你提供 Web API\
  \ 的 JSON 输出。应用程序必须运行才能通过 Visual Studio Fix 工作：\n\n```\ncurl https://localhost:44348/api/HandOfCards/Benjamin\n\
  ```\n\n![在命令提示符中执行命令的截图](img/c20f006.png)\n\n**图 20-6**\n\n\n\n仅仅看到 `JSON` 文件的内容并不会增加价值；它需要以某种方式被使用。例如，牌面的名称（如\
  \ `PNG`）可以用来显示发出的牌，而不仅仅是它的等级和花色。这使得游戏更具吸引力。你可以将 `ASP.NET Core Web API` 部署到云服务器上，也可以在自己的本地客户端上消费它。在本地消费\
  \ API 将在下一个练习中完成。在那个练习中，你将创建一个 Blazor WebAssembly App，该应用将调用 `Core Web API`、解析 `JSON`\
  \ 并使用其内容进行显示。\n\n关于 Web API 的讨论到此结束。请记住，这些信息旨在为你提供一个进入代码应用程序世界的大门。本章的剩余部分将介绍这种基于\
  \ REST 的 Web API 概念的前身，称为 `Windows Communication Foundation`（WCF）。`WCF` 不会迁移到跨平台的\
  \ `.NET` 版本，将保留在 `.NET Framework 4.8` 上。由于该技术在 IT 行业中有许多实现，对于需要它的人来说，这些信息是有价值的。在\
  \ `WCF` 之前，有一种被称为 `web service`（网络服务）的东西。网络服务就像是供计算机而非人类使用的网站。例如，你可能不需要浏览到你喜欢的程序，而是使用一个获取相同信息的桌面应用程序。这里的优势是，同一个网络服务可以被各种应用程序使用，事实确实如此。\n\
  \n`.NET Framework` 支持网络服务已经很长时间了。然而，在较新的版本中，网络服务已与另一种名为 `remoting`（远程调用）的技术结合，创建了\
  \ `WCF service`，这是一种应用程序之间通信的通用基础。`Remoting` 使得在一个进程中创建对象实例并在另一个进程中使用它们成为——即使该对象是在另一台计算机上创建的。然而，单凭远程调用是有局限性的，而且对于初学者来说并不是容易学习的。\n\
  \n`WCF` 吸收了来自网络服务的平台无关的 `Simple Object Access Protocol (SOAP)` 消息等概念，并将其与宿主应用程序和高级绑定等概念相结合。其结果是一种你可以认为是超集的技术，它同时包含了网络服务和\
  \ `remoting`，但它比网络服务强大得多，也更容易使用。通过 `WCF`，你可以从简单应用程序转向到使用 `service-oriented architecture\
  \ (SOA)`（面向服务的架构）的应用程序。`SOA` 意味着你通过跨本地网络和互联网连接所需的服务和数据来实现去中心化处理并利用分布式处理。\n\n本章将引导你了解如何从应用程序代码中创建和消费\
  \ `WCF services`。同样重要的是，它还涵盖了 `WCF` 背后的原理，以便你理解为什么它们是那样运行的。在我们深入研究 `WCF` 之前，这里将概述一下\
  \ `REST` 是什么以及它与 Web APIs 的。\n\n## 什么是 REST？\n\n`representation state transfer (REST)`\
  \ 是一种软件架构风格，它设定了客户端和服务器之间通过 `HTTP` 通信的标准。与 `WCF` 相比，你需要考虑 `WCF` 仅限 Windows，而 `REST`\
  \ 可以用于跨平台。`ASP.NET Web API` 的情况也是如此；注意该产品名称中缺少了“Core”。`ASP.NET Core Web API` 是跨平台的，而针对\
  \ `.NET Framework` 的 `ASP.NET Web API` 版本则不是。\n\n回想之前的练习，在练习中你创建并消费了一个 `ASP.NET\
  \ Core Web API`。无论你是否知道，你在底层都在使用 `REST`。当你创建发送到 API 的消息时，该消息被格式化为包含玩家名称的 `JSON`\
  \ 文档。API 的响应也是 `JSON` 形式的，你使用 `Newtonsoft` 来反序列化响应并解析其包含的内容。如果你再次查看图 20-6](#c20.xhtml_c20-fig-0006)\
  \ 以查看 API 的响应，这可能会更清楚。\n\n`REST` 的简单性使其成为一种如此实用的技术，特别是当你将其与以前的东西进行比较时。使用 `SOAP`\
  \ 甚至 `WCF` 的网络是取决于平台的，并且配置和支持相当复杂。还要考虑在这些之前的东西，即被称为 `Electronic Data Interchange\
  \ (EDI)`（电子数据交换）的东西，它实际上并不是一种行业标准。相反，它只是特定客户端和服务器之间的约定，规定文件将采用可识别的格式；例如，逗号分隔的文本文件。你可以在此处阅读更多关于\
  \ `REST` 的信息：[`en.wikipedia.org/wiki/Representational_state_transfer`](http://en.wikipedia.org/wiki/Representational_state_transfer)。\n\
  \n## 什么是 WCF？\n\n`WCF` 是一种技术，使你能够创建跨进程、机器和网络边界的从其他应用程序访问的服务。你可以使用这些服务在多个应用程序之间共享功能、暴露数据源或抽象复杂的过程。`WCF\
  \ services` 提供的功能被封装为由服务暴露的单个方法。每个方法——或者在 `WCF` 术语中称为每个 `operation`（操作）都有一个 `endpoint`（端点），你与之交换数据以使用它。这种数据交换可以由一个或多个协议定义，取决于你用于连接服务的网络以及你的特定需求。\n\
  \n在 `WCF` 中，一个 `endpoint` 可以有多个 `bindings`（绑定），每个绑定都指定了一种通信方式。绑定还可以指定额外信息，例如与端点通信时必须满足哪些安全要求。例如，绑定可能需要用户名和密码身份验证或\
  \ Windows 用户帐户令牌。当你连接到端点时，绑定所使用的协议可能会影响你使用的地址，正如你很快看到的的那样。\n\n一旦你连接到端点，你就可以使用 `SOAP`\
  \ 或 `REST` 消息与其进行通信。你使用的消息形式取决于你正在使用的操作以及向该操作发送消息（以及从该操作接收消息）所需的数据结构。`WCF` 使用 `contracts`（合约）来指定所有这些。你可以通过与服务的元交换来发现合约。服务发现的一种常用格式是服务描述语言\
  \ (`WSDL`)，它最初用于网络服务，尽管 `WCF services` 也可以通过其他方式进行描述。\n\n当你确定了想要使用的服务和端点，并且知道你使用哪种绑定以及遵守哪些合约后，你就可以像使用本地对象一样简单地与\
  \ `WCF service` 通信。与 `WCF services` 的通信可以是简单的单向事务、请求/响应消息，或者从通信通道任一端发起的全双工通信。如果需要，你还可以使用消息负载优化技术，例如消息传输优化机制\
  \ (MTOM) 来封装数据。\n\n\n\n\nWCF 服务本身可能运行在托管它的计算机上的几个不同进程之一。与始终运行在 Internet 信息服务 (`IIS`)\
  \ 中的 Web 服务不同，你可以根据自己的情况选择适当的宿主进程。你可以使用 `IIS` 来托管 WCF 服务，也可以使用 Windows 服务或可执行文件。如果你在本地网络上使用\
  \ `TCP` 与 WCF 服务进行通信，那么甚至不需要在托管该服务的 PC 上安装 `IIS`。WCF 框架的设计初衷是允许你自定义你在本节中已经读过的几乎所有内容。然而，这是一个高级主题，在这一章中，你将只使用\
  \ `.NET 4.8` 默认提供的技术。\n\n现在你已经学习了 WCF 服务的基础知识，将在接下来的章节中进一步探索这些概念。\n\n# WCF 概念\n\n\
  本节描述了 WCF 的以下方面：\n\n* WCF 通信协议\n* 节点 (Addresses)、端点 (Endpoints) 和绑定 (Bindings)\n\
  * 合约 (Contracts)\n* 消息模式 (Message patterns)\n* 行为 (Behaviors)\n* 托管 (Hosting)\n\n\
  ## WCF 通信协议\n\n如前所述，你可以通过多种传输协议与 WCF 服务通信。事实上，`.NET 4.8` 框架定义了五种协议：\n\n* `HTTP`——允许你从任何地方与\
  \ WCF 服务通信，包括跨越互联网。你可以使用 `HTTP` 通信创建 WCF Web 服务。\n* `TCP`——允许你在适当配置防火墙的情况下，在本地网络或跨越互联网与\
  \ WCF 服务进行通信。`TCP` 比 `HTTP` 更高效且具有更多功能，但配置起来可能更复杂。\n* `UDP`——用户数据报协议与 `TCP` 类似，允许通过本地网络或互联网进行通信，但其实现方式略有不同。这种实现方式的结果之一是服务可以同时向多个客户端广播消息。\n\
  * `Named pipe`（命名管道）——允许你与调用代码所在同一台机器但位于独立进程中的 WCF 服务进行通信。\n* `MSMQ`——微软消息队列是一种队列技术，允许应用程序发送的消息通过队列路由并到达目的地。`MSMQ`\
  \ 是一种可靠的消息技术，可确保发送到队列的消息能够到达队列。`MSMQ` 本质上是异步的，因此只有当队列中前面的消息被处理且有处理服务可用时，队列消息才会被处理。\n\
  \n这些协议通常允许你建立安全连接。例如，你可以使用 `HTTPS` 协议跨越互联网建立 `TLS` 连接。`TCP` 通过使用 Windows 安全框架为本地网络安全提供了广泛的可能性。`UDP`\
  \ 不支持安全性。要连接到 WCF 服务，你必须知道它在哪里。在实践中，这意味着要知道端点的地址。\n\n## 节点、端点和绑定\n\n你为服务使用的的地址类型取决于你所使用的协议。服务地址针对本节描述的三种协议（不涵盖\
  \ `MSMQ`）的格式化如下：\n\n* `HTTP`——`HTTP` 协议的地址是常见形式 `http://<server>:<port>/<service>`\
  \ 的 URL。对于 `TLS` 连接，你也可以使用 `https://<server>:<port>/<service>`。如果你在 `IIS` 中托管服务，`<service>`\
  \ 将是一个带有 `.svc` 扩展的文件。IIS 地址可能包含比此示例更多的子目录——即在 `.svc` 文件之前有更多由 `/` 字符分隔的章节。\n* `TCP`——`TCP`\
  \ 地址的格式为 `net.tcp://<server>:<port>/<service>`。\n* `UDP`——`UDP` 地址的格式为 `soap.udp://<server>:<port>/<service>`。组播通信需要特定的\
  \ `<server>` 值，但这超出了本节的范畴。\n* `Named pipe`——命名管道连接的地址与此类似，但没有端口号。它们的格式为 `net.pipe://<server>/<service>`。\n\
  \n服务的地址是一个基地址，你可以用它创建表示操作的端点地址。例如，你可能在此位置有一个操作：`net.tcp://<server>:<port>/<service>/operation1`。\n\
  \n假设你创建了一个只有一个操作的 WCF 服务，该操作具有此处列出的三种协议的绑定。你可能会使用以下基地址：\n\n```\nhttp://www.mydomain.com/services/amazingservices/mygreatservice.svc\n\
  net.tcp://myhugeserver:8080/mygreatservice\nnet.pipe://localhost/mygreatservice\n\
  ```\n\n然后你可以对操作使用以下地址：\n\n```\nhttp://www.mydomain.com/services/amazingservices/mygreatservice.svc/greatop\n\
  net.tcp://myhugeserver:8080/mygreatservice/greatop\nnet.pipe://localhost/mygreatservice/greatop\n\
  ```\n\n可以使用默认端点进行操作，而无需显式地配置它们。这简化了配置，特别是在你想使用标准端点地址时（如前面的示例所示）。如前所述，绑定指定的不仅是操作将使用的传输协议。你还可以使用它们来指定通过传输协议通信的安全性。\n\
  \n\n\n\n\n| HTTP | `BasicHttpBinding` |\n| TCP | `NetTcpBinding` |\n| UDP | `UdpBinding`\
  \ |\n| Named pipe | `NetNamedPipeBinding` |\n\n表 20-2:** NET 默认绑定\n\n### 合约 (Contracts)\n\
  \n合约定义了如何使用 WCF 服务。可以定义几种类型的合约：\n\n*   **服务合约（Service contract）**——包含有关服务的通用信息以及服务公开的操作。这包括服务使用的命名空间。服务具有唯一的命名空间，在定义\
  \ SOAP 消息架构时使用这些命名空间，以避免与其他服务发生可能的冲突。\n*   **操作合约（Operation contract）**——定义了如何使用操作。这包括操作方法的参数和返回类型，以及其他信息，例如方法是否会返回响应消息。\n\
  *   **消息合约（Message contract）**——允许你自定义 SOAP 消息内部信息的格式化——例如，数据是否应该包含在 SOAP 头部或 SOAP\
  \ 消息正文中。在创建必须与遗留系统集成的 WCF 服务时，这非常有用。\n*   **故障合约（Fault contract）**——定义了操作可以返回的故障。当你使用\
  \ .NET 客户端时，故障会导致异常，你可以像通常一样捕获并处理它们。\n*   **数据合约（Data contract）**——如果你使用复杂类型（如用户定义的结构体和对象）作为操作参数或返回类型，则你必须为这些类型定义数据合约。数据合约根据类型通过属性公开的数据来定义类型。\n\
  \n你通常通过特性将合约添加到服务类和方法中，正如你将在本章稍后部分看到的 true。\n\n### 消息模式 (Message Patterns)\n\n在上一节中，你已经看到操作合约可以定义操作是否返回值。你还读到了通过\
  \ `WSDualHttpBinding` 绑定实现的双向通信。这些都是消息模式的形式，共有三种类型：\n\n*   **请求/响应消息传递（Request/response\
  \ messaging）**——交换消息的“普通”方式，其中发送到服务的每条消息都会向客户端发回一个响应。这并不意味着客户端必须等待响应，因为你可以像通常一样异步调用操作。\n\
  *   **单向或半双工消息传递（One-way, or simplex, messaging）**——消息从客户端发送到 WCF 操作，但不发送响应。\n*\
  \   **双向或全双工消息传递（Two-way, or duplex, messaging）**——一种更高级的方案，其中客户端既充当服务器又是客户端，服务器既充当客户端又是服务器。一旦建立，双向消息传递允许客户端和服务器互相发送消息，这些消息可能没有响应。\n\
  \n你将在本章稍后部分看到这些消息模式在实践中是如何使用的。\n\n### 行为 (Behaviors)\n\n行为是对服务和操作应用额外配置的一种。通过向服务添加行为，你可以控制它如何被其托管进程实例化和使用、它如何参与事务、服务中如何处理多线程问题等。操作行为可以控制在操作执行期间是否使用身份冒充、单个操作如何影响事务等。\n\
  \n你可以在各个级别指定默认行为，这样你就不需要为每个服务和操作的每个行为的每个方面进行指定。相反，你可以提供默认值并在必要时覆盖设置，从而减少所需的配置量。\n\
  \n### 托管 (Hosting)\n\n在本节的开始，你学习了 WCF 服务可以托管在几个不同的进程中。你的选项如下：\n\n*   **Web 服务器（Web\
  \ server）**——IIS 托管的 WCF 服务是 WCF 的最接近纯 Web 服务的东西。但你可以在 WCF 服务中使用高级功能和安全特性，这些特性在\
  \ Web 服务中实现困难困难。你还可以与 IIS 特性（如 IIS 安全）集成。\n*   **可执行文件（Executable）**——你可以在 .NET\
  \ 中创建的任何应用程序类型中托管 WCF 服务，例如控制台应用程序、Windows Forms 应用程序和 WPF 应用程序。\n*   **Windows\
  \ 服务（Windows service）**——你可以在 Windows 服务中托管 WCF 服务，并利用 Windows 服务提供的功能，例如自动启动和故障恢复。\n\
  *   **Windows 激活服务（WAS）**——WAS 专为托管 WCF 服务而设计，它基本上是 IIS 的简化版本，你可以在无法使用 IIS 的地方使用它。上述列表中的两个选项（IIS\
  \ 和 WAS）为 WCF 服务提供了如激活、进程回收和对象池等实用功能。如果你使用另外两个托管选项之一，则称 WCF 服务为`自托管（self-hosted）`。你可能会为了测试目的偶尔自托管服务，但创建自托管的生产级服务也有很好的理由。例如，你可能处于不允许在运行服务的计算机上安装\
  \ Web 服务器的情况下。如果服务运行在域控制器上，或者你组织的本地策略简单地禁止运行 IIS，可能会出现这种情况。在这种情况下，你可以将服务托管在 Windows\
  \ 服务中，它的工作效果与正常情况下一样好。\n\n## WCF 编程 (WCF PROGRAMMING)\n\n现在你已经涵盖了所有基础知识，是时候开始编写代码了。在本节中，你将首先查看一个简单的\
  \ Web 服务器托管的 WCF 服务和一个控制台应用程序客户端。在查看了创建的代码结构后，你将学习 WCF 服务和客户端应用程序的基本结构。然后你将更详细地查看一些关键主题：\n\
  \n*   定义 WCF 服务合约\n*   自托管 WCF 服务\n\n在接下来的“尝试一下”（Try It Out）中，你将创建一个简单的 WCF 服务，它公开两个方法以及一个用于这些方法的客户端。\n\
  \n### WCF 测试客户端 (The WCF Test Client)\n\n在之前的一个“尝试一下”中，你同时创建了服务和客户端，以便观察 WCF 基础架构如何工作以及如何实现\
  \ WCF 配置。但在在实践中，你想要使用的客户端应用程序可能是复杂的，正确测试服务可能很棘手。为了简化 WCF 服务的开发，Visual Studio 提供了一个测试工具来确保你的\
  \ WCF 操作正常工作。该工具已配置为与你的 WCF 服务项目配合工作，因此如果你运行项目，该工具就会出现。你只需要确保要测试的服务（即 `.svc` 文件）被设置为\
  \ WCF 服务项目的启动页。该工具允许你调用服务操作并以其他方式检查服务。接下来的“尝试一下”将说明这一点。\n\n### 定义 WCF 服务合约 (Defining\
  \ WCF Service Contracts)\n\n之前的示例展示了 WCF 基础设施如何通过类、接口和特性的组合为 WCF 服务定义合约。本节将深入探讨这种技术。\n\
  \n#### 数据合约 (Data Contracts)\n\n要为服务定义数据合约，需要在类定义上应用 `DataContractAttribute` 特性。该特性位于\
  \ `System.Runtime.Serialization` 命名空间。你可以使用表 20-3 所示所示属性来配置此特性。\n\n| 属性 (PROPERTY)\
  \ | 描述 (DESCRIPTION) |\n| --- | --- |\n| `Name` | 使用与类定义不同的名称命名数据合约。该名称将用于 SOAP\
  \ 消息和从服务元数据定义的客户端数据对象。 |\n| `Namespace` | 定义数据合约在 SOAP 消息中使用的命名空间。 |\n\n\n\n\n\n\
  | `IsReference` | 影响对象序列化的方式。如果此项设置为 `true`，则即使对象实例被多次引用，它也只序列化一次，这在某些情况下非常重要。默认值为\
  \ `false`。 |\n\n### DataContractAttribute 属性\n\n当你需要与现有的 SOAP 消息格式进行互操作时，`Name`\
  \ 和 `Namespace` 属性非常有用（与其他合约的同名属性类似），但在其他情况下，你可能不需要它们。\n\n作为数据合约一部分的每个类成员都必须使用 `DataMemberAttribute`\
  \ 属性，该属性也位于 `System.Runtime.Serialization` 命名空间中。[表 20-4] 列出了该属性的属性。\n\n| 属性 | 描述\
  \ |\n| --- | --- |\n| `Name` | 指定序列化时数据成员的名称（默认是成员名称）。 |\n| `IsRequired` | 指定成员是否必须出现在\
  \ SOAP 消息中。 |\n| `Order` | 一个 `int` 值，用于指定成员序列化或反序列化的顺序。如果一个成员必须在另一个成员之前存在，则可能需要此属性。先处理\
  \ `Order` 较小的成员。 |\n| `EmitDefaultValue` | 将此项设置为 `false`，可以防止在成员的值为该成员的默认值时将其包含在\
  \ SOAP 消息中。 |\n\n#### 服务合约 (Service Contracts)\n\n服务合约通过在接口定义上应用 `System.ServiceModel.ServiceContractAttribute`\
  \ 属性来定义。你可以通过 [表 20-5] 所示的属性来自定义服务合约。\n\n| 属性 | 描述 |\n| --- | --- |\n| `Name` |\
  \ 指定 WSDL 中 `<portType>` 元素中定义的服务合约名称。 |\n| `Namespace` | 定义 WSDL 中 `<portType>`\
  \ 元素使用的服务合约命名空间。 |\n| `ConfigurationName` | 配置文件使用的服务合约名称。 |\n| `HasProtectionLevel`\
  \ | 决定服务使用的消息是否有显式定义的保护级别。保护级别允许你对消息进行签名，或进行签名和加密。 |\n| `ProtectionLevel` | 用于消息保护的保护级别。\
  \ |\n| `SessionMode` | 决定是否为消息启用会话。如果你使用会话，就可以确保发送到服务不同端点的消息是关联的——也就是说它们使用同一个服务实例并可以共享状态，以此此类推。\
  \ |\n| `CallbackContract` | 对于双工消息，客户端像服务一样也暴露一个合约。这是因为如前面讨论过的，双工通信中的客户端也充当服务器。此属性允许你指定客户端使用的哪个合约。\
  \ |\n\n#### 操作合约 (Operation Contracts)\n\n在定义服务合约的接口内部，你通过应用 `System.ServiceModel.OperationContractAttribute`\
  \ 属性将成员定义为操作。该属性具有 [表 20-6] 中描述的属性。\n\n| 属性 | 描述 |\n| --- | --- |\n| `Name` | 指定服务操作的名称。默认是成员名称。\
  \ |\n| `IsOneWay` | 指定操作是否返回响应。如果你将此项设置为 `true`，则客户端无需等待操作完成即可继续执行。 |\n| `AsyncPattern`\
  \ | 如果设置为 `true`，则操作被实现为两个方法，你可以使用它们来异步调用操作：`Begin<methodName>()` 和 `End<methodName>()`。\
  \ |\n| `HasProtectionLevel` | 见上一节。 |\n| `ProtectionLevel` | 见上一节。 |\n| `IsInitiating`\
  \ | 如果使用了会话，则此属性决定调用此操作是否可以启动新会话。 |\n| `IsTerminating` | 如果使用了会话，则此属性决定调用此操作是否终止当前会话。\
  \ |\n| `Action` | 如果你正在使用寻址（WCF 服务的一项高级功能），则操作有一个关联的操作名称，你可以通过此属性指定该名称。 |\n| `ReplyAction`\
  \ | 与 `Action` 类似，但指定操作响应的名称。 |\n\n#### 消息合约 (Message Contracts)\n\n之前的示例没有使用消息合约规范。如果你使用这些规范，将通过定义一个表示消息的类并在类上应用\
  \ `MessageContractAttribute` 属性来实现。然后对该类的成员应用 `MessageBodyMemberAttribute`、`MessageHeaderAttribute`\
  \ 或 `MessageHeaderArrayAttribute` 属性。所有这些属性都在 `System.ServiceModel` 命名空间中。除非你需要对\
  \ WCF 服务使用的 SOAP 消息进行高程度的控制，否则你可能不想这样做，因此此处不提供详细细节。\n\n#### 故障合约 (Fault Contracts)\n\
  \n如果你有一个特定的异常类型（例如自定义异常）希望让客户端应用程序可用，那么你可以在类上应用 `System.ServiceModel.FaultContractAttribute`\
  \ 属性。\n\n#### 自托管 WCF 服务 (Self-Hosted WCF Services)\n\n在本章到为止，你已经看到了托管在 Web 服务器中的\
  \ WCF 服务。这允许你跨互联网进行通信，但对于本地网络来说，这并不是最高的方法。此外，你应用程序的架构可能导致拥有独立的 WCF 服务并不是理想的。\n\n\
  相反，你可能想使用自托管的 WCF 服务。自托管 WCF 服务存在于你创建的进程中，而不是专门托管应用程序的进程（如 Web 服务器）。这意味着例如，你可以使用控制台应用程序或\
  \ Windows 应用程序来托管你的服务。\n\n要自托管 WCF 服务，你需要使用 `System.ServiceModel.ServiceHost` 类。你通过要托管的服务类型或服务类的实例来实例化此类。你可以通过属性或方法配置服务宿主机，或者（这是最巧妙的一点）通过配置文件进行配置。事实上，托管进程（如\
  \ Web 服务器）使用 `ServiceHost` 实例来执行托管。自托管时的区别在于你与该类进行交互。然而，你在主机应用程序的 `app.config` 文件的\
  \ `<system.serviceModel>` 部分使用的配置与你在本章中看到的语法相同。\n\n\n\n\n一旦你配置了 `ServiceHost` 实例，就可以使用\
  \ `ServiceHost.Open()` 方法来开始托管服务。同样，你通过 `ServiceHost.Close()` 方法停止托管服务。当你第一次托管一个绑定到\
  \ TCP 的服务时，如果你启用了相关功能，可能会收到来自 Windows 防火墙服务的警告，因为它默认会阻止 TCP 端口。你必须为服务打开 TCP 端口，服务才能开始在该端口上进行监听。\n\
  \n在接下来的“尝试一下”（Try it Out）中，你将使用自托管技术通过 WCF 服务暴露 WPF 应用程序的一些功能。\n\n#### 练习题\n\n1.\
  \ **20.1** 哪些应用程序可以托管 WCF 服务？\n    1. Web 应用程序\n    2. Windows Forms 应用程序\n    3.\
  \ Windows 服务\n    4. COM+ 应用程序\n    5. 控制台应用程序\n\n2. **20.2** 如果你想与 WCF 服务交换类型为\
  \ `MyClass` 的参数，你会实现哪种类型的合约？你需要哪些特性？\n\n3. **20.3** 如果你在 Web 应用程序中托管 WCF 服务，该服务的基端点（base\
  \ endpoint）将使用什么扩展名？\n\n4. **20.4** 在自托管 WCF 服务时，你必须通过设置 `ServiceHost` 类的属性并调用方法来配置服务。对还是错？\n\
  \n5. **20.5** 为服务合约 `IMusicPlayer` 提供代码，定义了 `Play()`、`Stop()` 和 `GetTrackInformation()`\
  \ 操作。在适当的情况下使用单向方法（one-way methods）。为了使此服务运行，你可能还会定义哪些合约？\n\n练习题答案可以在附录。\n\n## ▸\
