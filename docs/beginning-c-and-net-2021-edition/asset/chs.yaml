  \n**Benjamin Perkins** 目前在德国微软担任高级升级工程师，负责 IIS、.NET 和 Azure。他在 IT 行业工作了二十多年，从上高中就开始用\
  \ `QBasic` 编程。在完成兵役后，他在德克萨斯 A&M 州立大学获得了信息系统管理学士学位，并在欧洲大学获得了管理学硕士学位。他在 IT 行业中的角色涵盖了程序员、系统架构师、技术支持和团队领导。在惠普公司工作期间，他获得了许多奖励、学位。他对技术和客户服务充满热情。“我的方法是考虑到支持性来编写代码，并一次性到位，这样我们就不需要回来了。”Benjamin\
  \ 写了许多文章和培训课程，是一位活跃的博客作者。他的著作涵盖 C#、NHibernate 和 Microsoft。\n\n* 在 LinkedIn 上联系 Benjamin：[www.linkedin.com/in/csharuitar](https://www.linkedin.com/in/csharuitar)\n\
  * 在 Twitter 上关注 Benjamin @csharuitar：[twitter.com/csharuitar](https://twitter.com/csharuitar)\n\
  * 阅读 Benjamin 的博客：[www.thebestcsharmerperworld.com](https://www.thebestcsharmerperworld.com)\n\
  * 在 GitHub 上访问 Benjamin：[github.com/benk](https://github.com/benk)\n\nBenjamin 与\
  \ Andrea 结婚，有两个孩子。\n\n**Jon D. Reid** 是 IFS AB（[www.ifs.com](https://www.ifs.com)）研发部门的项目经理，专注于现场服务管理。他合著了许多关于技术的书籍，包括\
  \ *Beginning C# 7 Programming with Visual Studio 2017*、*Fast Track C#*、*Pro Visual\
  \ Studio .NET* 等。\n\n# 技术编辑介绍\n\n**Rod Stephens** 是一位资深开发者和作者，写了数百篇文章和 35 本被翻译成多种语言的书。在职业生涯中，Rod\
  \ 参与了电话交换、计费、维修调度、税务处理、废水处理、演唱会票务、地图绘制以及职业足球队的培训。\n\nRod 受欢迎的 C# Helper 网站 ([www.csharphelper.com](https://www.csharphelper.com))\
  \ 每年获得数次访问，为 C# 程序员提供提示、技巧和示例程序。他的 VB Helper 网站 ([www.vb-helper.com](https://www.vb-helper.com))\
  \ 为 Visual Basic 程序员提供了类似的材料。\n\n你可以通过以下方式联系 Rod：RodStephens@csharphelper.com 或\
  \ RodStephens@vb-helper.com。\n\n\n\n\n将内容整理成适合学生和 IT 专业人员阅读并从中获得价值的格式需要投入大量工作。作者们确实拥有可以分享的技术知识和经验，但如果没有技术写作者、技术评审人员、开发者、编辑、出版商、平面设计师等（人员还有很多）提供的宝贵投入，就无法写出一本高质量的书。技术变化的速度太快，个人无法完成所有这些任务，还能在技术过时之前出版出一本仍然有效的书。这就是为什么作者们与强大的团队合作，以快速汇集书籍的所有组成部分。这样做是为了确保在特性仍然新颖且实用的时，将最及的信息传递给读者。我要感谢\
  \ Rod Stephens 在整个过程中提供的技术评审和建议。最后，我要感谢所有在幕后帮助完成这本书的众多同仁。\n\n# WILEY 最终许可协议\n\n\
