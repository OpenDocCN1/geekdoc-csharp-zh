  \ `Ch10CardLib` 编写一个控制台客户端，从洗牌过的 `Deck` 对象中一次抽取五张牌。如果五张牌花色相同，则客户端应在屏幕上显示牌名并带有文本\
  \ `Flush`；否则以 `No flush` 退出。\n\n练习题答案见附录。\n\n## ▸ 本章学到的内容\n\n| 主题 | 关键概念 |\n| ---\
  \ | --- |\n| 成员定义 | 你可以在类中定义字段、方法和属性成员。字段通过访问级别、名称和类型定义。方法通过访问级别、返回类型、名称和参数定义。属性通过访问级别、名称以及\
  \ `get` 和/或 `set` 访问器定义。单个属性访问器可以自己的访问级别，但必须低于属性本身的访问级别。 |\n| 成员隐藏与重写 | 属性和方法可以在基类中定义为\
  \ `abstract` 或 `virtual` 以定义继承。派生类必须实现抽象成员，可以使用 `override` 关键字重写虚成员。它们可以使用 `new`\
  \ 关键字提供新的实现，并使用 `sealed` 关键字阻止对 `virtual`成员的进一步重写。可以使用 `base` 关键字调用基实现。 |\n| 接口实现\
  \ | 实现接口的类必须实现接口定义的所有成员。你可以隐式或显式地实现接口，其中显式实现仅通过接口引用可用。 |\n| 部分定义 | 你可以使用 `partial`\
  \ 关键字将类定义跨越多个代码文件划分。你还可以使用 `partial` 关键字创建部分方法。 |\n\n\n\n\n\n- **集合（Collections）**——集合允许你维护一组对象。与你之前在章节中使用的数组不同，集合可以包含更高级的功能，例如控制对所包含对象的访问、搜索和排序等。你将学习如何使用和创建集合类，并学习一些为了充分利用其优势的强大技术。\n\
  - **比较（Comparisons）**——在处理对象时，你通常想对它们进行比较。这在集合中尤为重要，因为它是实现排序的基础。你将查看如何以多种方式比较对象，包括运算符重载，以及如何使用\
  \ `IComparable` 和 `IComparer` 接口对集合排序。\n- **转换（Conversions）**——之前的章节向你展示了如何将对象从一种类型转换为另一种。在本章，你将学习如何自定义类型转换以满足你的需求。\n\
  \n## 集合\n\n在第 5 章中，你学习了如何使用数组创建包含多个对象或值的可变类型。然而，数组有其局限性。最大的限制是，一旦创建了数组，的大小就是固定的，因此在不创建新数组的情况下，你无法向现有数组的末尾添加新项。这通常意味着用于操作数组的语法可能会变得极其复杂。面向对象（OOP）技术允许你创建在内部执行许多此类操作的类，从而简化了使用项目列表或数组的代码。\n\
  \nC# 中的数组实现为 `System.Array` 类的实例，它们只是被称为“集合类”的类型之一。通常情况下，集合类用于维护一组对象，它们可能提供比简单数组更多的功能。这些功能中的大部分通过实现来自\
  \ `System.Collections` 命名空间的接口来实现，从而标准化了集合语法。该命名空间还包含其他有趣的内容，例如以非 `System.Array`\
  \ 方式实现这些接口的类。\n\n由于集合的功能（包括通过 `[index]` 语法访问集合项的基本功能）可以通过接口使用，因此你并不局限于使用 `System.Array`\
  \ 等基础集合类。相反，你可以创建自己的自定义集合类。这些类可以针对你想要枚举的对象（即你想要维护维护其集合的对象）而变得更具特定性。这样做的一个优势是（正如你很快将看到的），自定义集合类可以是强类型的。这意味着，当你从集合中提取项时，你不需要将它们转换为正确的类型，因为项必须已经转换为它们要存储的对象类型。例如，你不能将一个\
  \ `Cow` 存储到 `Cards` 集合中。如果尝试这样做，将抛出异常且代码将无法编译。另一个优势是能够暴露专门的方法。例如，你可以提供一种快速获取项的子集的方法。在牌牌示例中，你可以添加一个方法来获取特定花色的所有\
  \ `Card` 项。\n\n`System.Collections` 命名空间中的几个接口提供了基本的集合功能：\n\n- `IEnumerable`——提供循环遍历集合中项的能力。\n\
  - `ICollection`——提供获取集合中项数以及将项复制到简单数组类型的能力（继承自 `IEnumerable`）。\n- `IList`——为集合提供项列表，以及访问这些项的能力，以及一些与项列表相关的其他基本功能（继承自\
  \ `IEnumerable` 和 `ICollection`）。\n- `IDictionary`——与 `IList` 类似，但提供了通过键值访问的项列表，而不是通过索引（继承自\
  \ `IEnumerable` 和 `ICollection`）。\n\n`System.Array` 类实现了 `IList`、`ICollection` 和\
  \ `IEnumerable`。然而，它不支持 `IList` 的一些更高级的功能，并且它通过固定大小来表示项列表。\n\n### 使用集合\n\n`Systems.Collections`\
  \ 命名空间中的类之一 `System.Collections.ArrayList` 也实现了 `IList`、`ICollection` 和 `IEnumerable`，但其实现方式比\
  \ `System.Array` 更复杂。数组的大小是固定的（你不能添加或删除元素），而此类可以用来表示变长度的项列表。为了让你更好地感受这种高度高级集合的可能用法，下面的“尝试一下”（Try\
  \ It Out）使用了该类以及一个简单的数组。\n\n### 定义集合\n\n现在你已经知道使用更高级的集合类可以实现什么，是时候学习如何创建自己的强类型集合了。实现此点的方法之一手动实现所需的方法，但这可能是一个耗时且复杂的过程。或者，你可以从一个类派生你的集合，例如\
  \ `System.Collections.CollectionBase`，这是一个抽象类，它为你提供了集合的大部分实现。强烈建议使用这种选项。\n\n`CollectionBase`\
  \ 类暴露了 `IEnumerable`、`ICollection` 和 `IList` 接口，但仅提供了部分所需的实现——特别是 `IList` 的 `Clear()`\
  \ 和 `RemoveAt()` 方法以及 `ICollection` 的 `Count` 属性。如果你想要所提供的功能，你需要自己实现所有其他内容。\n\n\
  为了方便这一点，`CollectionBase` 提供了两个保护属性，允许访问存储的对象本身。你可以使用 `List`，它让你通过 `IList` 接口访问项；以及使用\
  \ `InnerList`，它是用于存储项的 `ArrayList` 对象。\n\n例如，存储 `Animal` 对象的集合类的基础可以定义如下（你很快就会看到一个更完整的实现）：\n\
  \n```\npublic class AnimalCollection : CollectionBase\n{\n   public void Add(Animal\
  \ newAnimal) => List.Add(newAnimal);\n\n   public void Remove(Animal oldAnimal)\
  \ => List.Remove(oldAnimal);\n}\n```\n\n在这里，`Add()` 和 `Remove()` 被实现为强类型方法，使用 `IList`\
  \ 接口的标准 `Add()` 方法来访问项。现在暴露的方法将仅适用于 `Animal` 类或派自 `Animal` 的类，这与之前显示的 `ArrayList`\
  \ 实现不同，后者适用于任何对象。\n\n`CollectionBase` 类允许你在你的派生集合器 `foreach` 语法。例如，你可以使用如下代码：\n\n\
  ```\nConsole.WriteLine(\"使用集合类 AnimalCollection:\");\nAnimalCollection animalCollection\
  \ = new AnimalCollection();\nanimalCollection.Add(new Cow(\"Lea\"));\nforeach (Animal\
  \ myAnimal in animalCollection)\n{\n   Console.WriteLine($\"已添加 { myAnimal} 对象到自定义\
  \ \" +\n                     $\"集合, 名称为 {myAnimal.Name}\");\n}\n```\n\n然而，你无法执行以下操作：\n\
  \n```\nanimalCollection[0].Feed();\n```\n\n要以此通过索引访问项，你需要使用索引器。\n\n### 索引器\n\n索引器是一种特殊的属性，你可以将其添加到类中提供类似数组的访问。事实上，你可以通过索引器提供更复杂的访问，因为你可以根据需要使用括号语法定义并使用复杂的参数类型。然而，为项实现简单的数字索引是最常见的用法。\n\
  \n你可以如下所示为 `Animal` 对象的 `AnimalCollection` 集合添加索引器：\n\n```\n public class AnimalCollection\
  \ : CollectionBase\n   {\n      …\n      public Animal this[int animalIndex]\n \
  \     {\n         get { return (Animal)List[animalIndex]; }\n         set { List[animalIndex]\
  \ = value; }\n      }\n   }\n```\n\n\n\n\n`this` 关键字与方括号中的参数一起使用，但在其他情况下，索引器看起来与任何其他属性非常相似。这种语法是有逻辑的，因为你通过使用对象名称后跟方括号中的索引参数（例如\
  \ `MyAnimals[0]`）来访问索引器。\n\n该索引器代码在 `List` 属性上使用了索引器（即在提供访问存储项的 `CollectionBase`\
  \ 中 `ArrayList` 的 `IList` 接口上）：\n\n```\nreturn (Animal)List[animalIndex];\n```\n\
  \n这里需要显式类型转换，因为 `IList.List` 属性返回一个 `System.Object` 对象。这里需要注意的重要点是，你为这个索引器定义了一个类型。这就是当你使用此索引器访问项时将获得的类型。这种强类型特性意味着你可以编写如下代码：\n\
  \n```\nanimalCollection[0].Feed();\n```\n\n而不是\n\n```\n((Animal)animalCollection[0]).Feed();\n\
  ```\n\n这是强类型自定义集合的另一个方便的特性。在接下来的“尝试一下”（Try It Out）中，你将扩展之前的“尝试一下”以将其付诸实践。\n\n###\
  \ 为 CardLib 添加 CardCollection\n\n在上一章中，你创建了一个名为 `Ch10CardLib` 的类库项目，其中包含一个代表扑克牌的\
  \ `Card` 类和一个代表一幅牌的 `Deck` 类——即 `Card` 类的集合。该集合是作为简单的简单的数组实现的。\n\n在本章中，你将向该库中添加一个新类，并将其重命名为\
  \ `Ch11CardLib`。这个新类 `CardCollection` 将是 `Card` 对象的自定义集合，为你带来在本章早些部分描述的所有优势。在 `C:\\\
  BeginningCSharpAndDotNET\\Chapter11` 目录下创建一个名为 `Ch11CardLib` 的新类库（.NET Core）。接下来，删除自动生成的\
  \ `Class1.cs` 文件；选择项目 ➪ 添加现有项；从 `C:\\BeginningCSharpAndDotNET\\Chapter10\\Ch10CardLib`\
  \ 目录选择 `Card.cs`、`Deck.cs`、`Suit.cs` 和 `Rank.cs` 文件；并将这些文件添加到项目中。与在 第 10 章 中引入的项目的之前的版本一样，这些更改在不使用标准的“尝试一下”格式的情况下呈现。如果你想直接跳转到代码，可以随时打开本章下载代码中包含的项目版本或\
  \ GitHub 上的版本。\n\n本章的可下载代码包含一个 `Ch11CardLib` 文件夹，其中包含了 `Ch11CardLib` 项目各种扩展所需的所有代码。正因如此，你可能会注意到一些未包含在此示例中的额外代码，但这不会影响它在此阶段的运行方式。通常情况下你会发现某些代码被注释掉了；但是，当你到达相关的示例时，可以取消你想要实验的部分。\n\
  \n添加一个名为 `CardCollection` 的新类并按如下修改 `CardCollection.cs` 中的代码：\n\n```\nusing System;\n\
  using System.Collections;\nnamespace Ch11CardLib\n{\n   public class CardCollection\
  \ : CollectionBase\n   {\n      public void Add(Card newCard) => List.Add(newCard);\n\
  \n      public void Remove(Card oldCard) => List.Remove(oldCard);\n\n      public\
  \ Card this[int cardIndex]\n      {\n         get { return (Card)List[cardIndex];\
  \ }\n         set { List[cardIndex] = value; }\n      }\n      /// <summary>\n \
  \     /// 将卡牌实例复制到另一个 CardCollection 实例的实用方法\n      /// 用于 Deck.Shuffle()。此实现假设源集合和目标集合的\
  \ l 相同。\n      /// </summary>\n      public void CopyTo(CardCollections targetCards)\n\
  \      {\n         for (int index = 0; index < this.Count; index++)\n         {\n\
  \            targetCards[index] = this[index];\n         }\n      }\n      /// <summary>\n\
  \      /// 检查 CardCollection 集合是否包含特定的卡牌。\n      /// 这调用了集合 ArrayList 的 Contains()\
  \ 方法，\n      /// 你通过 InnerList 属性访问它。\n      /// </summary>\n      public bool Contains(Card\
  \ card) => InnerList.Contains(card);\n   }\n}\n```\n\n接下来，修改 `Deck.cs` 以使用这个新集合而不是数组：\n\
  \n```\nusing System;\nnamespace Ch11CardLib\n{\n   public class Deck\n   {\n   \
  \   private CardCollection cards = new CardCollection();\n      public Deck()\n\
  \      {\n         // 此处删除了代码行\n         for (int suitVal = 0; suitVal < 4; suitVal++)\n\
  \         {\n            for (int rankVal = 1; rankVal < 14; rankVal++)\n      \
  \      {\n               cards.Add(new Card((Suit)suitVal, (Rank)rankVal));\n  \
  \          }\n         }\n      }\n      public Card GetCard(int cardNum)\n    \
  \  {\n         if (cardNum>= 0 && cardNum <= 51)\n            return cards[cardNum];\n\
  \         else\n            throw (new System.ArgumentOutOfRangeException(\"cardNum\"\
  , cardNum,\n                   \"值必须在 0 到 51 之间。\"));\n      }\n      public void\
  \ Shuffle()\n      {\n         CardCollection newDeck = new CardCollection();\n\
  \         bool[] assigned = new bool[52];\n         Random sourceGen = new Random();\n\
  \         for (int i = 0; i < 52; i++)\n         {\n            int sourceCard =\
  \ 0;\n            bool foundCard = false;\n            while (foundCard == false)\n\
  \            {\n               sourceCard = sourceGen.Next(52);\n              \
  \ if (assigned[sourceCard] == false)\n                  foundCard = true;\n    \
  \        }\n            assigned[sourceCard] = true;\n            newDeck.Add(cards[sourceCard]);\n\
  \         }\n         newDeck.CopyTo(cards);\n      }\n   }\n}\n```\n\n这里不需要很多更改。大多数更改涉及修改洗牌逻辑，以允许卡牌添加到新的\
  \ `CardCollection` 集合 `newDeck` 的开头，而不是 `cards` 中的顺序位置。\n\n用于 `Ch10CardLib` 解决方案的客户端应用程序\
  \ `Ch10CardClient` 仍然可以使用此新库并获得之前相同的结果，因为 `Deck` 的方法签名没有变化。然而，此类库的客户端现在可以利用 `CardCollection`\
  \ 类，而不是依赖 `Card` 对象的数组来定义牌牌游戏应用程序中的牌组（例如）。\n\n### 键值集合与 IDictionary\n\n除了实现 `IList`\
  \ 接口外，集合也可以实现类似的 `IDictionary` 接口，该接口允许通过键值（例如字符串名称）而不是索引来索引项。这同样是通过索引器来实现，尽管这里的索引器参数是与存储项相关的键，而不是\
  \ `int` 索引，这可以使集合变得更加易用。\n\n与索引集合一样，有一个可以使用的基类来简化 `IDictionary` 接口的实现：`DictionaryBase`。该类还实现了\
  \ `IEnumerable` 和 `ICollection`，提供了任何集合通用的基本集合操作能力。\n\n`DictionaryBase` 与 `CollectionBase`\
  \ 实现了通过其支持的接口获取的部分（而非全部）成员。与 `CollectionBase` 一样，`Clear` 和 `Count` 成员已实现，但 `RemoveAt()`\
  \ 没有，因为它是 `IList` 接口上的方法，没有出现在 `IDictionary` 接口中。然而，`IDictionary` 确实有一个 `Remove()`\
  \ 方法，这是基于 `DictionaryBase` 的自定义集合类中应该实现的方法之一。\n\n以下代码展示了 `Animals` 类的另一种版本，这次派生自\
  \ `DictionaryBase`。其中包含了 `Add()`、`Remove()` 和键访问索引器的实现：\n\n\n\n\n\n```python\npublic\
  \ class Animals : DictionaryBase\n{\n   public void Add(string newID, Animal newAnimal)\
  \ =>\n       Dictionary.Add(newID, newAnimal);\n\n   public void Remove(string animalID)\
  \ => \n       Dictionary.Remove(animalID);\n\n   public Animals() {}\n   public\
  \ Animal this[string animalID]\n   {\n      get { return (Animal)Dictionary[animalID];\
  \ }\n      set { Dictionary[animalID] = value; }\n   }\n}\n```\n\n这些成员之间的差异如下：\n\
  \n- `Add()`——接收两个参数，一个键和一个值，并将它们一起存储。字典集合拥有一个从 `DictionaryBase` 继承的 `Dictionary`\
  \ 成员，它是一个 `IDictionary` 接口。该接口有它自己的 `Add()` 方法，接收两个对象参数。你的实现接受一个字符串值作为键，并将一个 `Animal`\
  \ 对象作为数据与该键一起存储。\n\n- `Remove()`——接收一个键参数，而不是对象引用。移除具有指定键值的项。\n\n- `Indexer`（索引器）——使用字符串键值而不是索引，通过继承的\
  \ `Dictionary` 成员来访问存储的项。同样，这里需要进行类型转换。\n\n基于 `DictionaryBase` 的集合与基于 `CollectionBase`\
  \ 的集合之间的另一个区别是 `foreach` 的工作略有不同。上一节中的集合允许你直接从集合中提取 `Animal` 对象。对派自 `DictionaryBase`\
  \ 的类使用 `foreach` 会给你 `DictionaryEntry` 结构体，这是 `System.Collections` 命名空间定义的另一种类型。要获取\
  \ `Animal` 对象本身，必须使用该结构体的 `Value` 成员，或者使用结构体的 `Key` 成员获取关联键。要获得与早期代码的代码：\n\n```python\n\
  foreach (Animal myAnimal in animalCollection)\n{\n   Console.WriteLine($\"New {myAnimal}\
  \ object added to custom \" +\n                     $\"collection, Name = {myAnimal.Name}\"\
  );\n}\n```\n\n你需要以下代码：\n\n```python\nforeach (DictionaryEntry myEntry in animalCollection)\n\
  {\n   Console.WriteLine($\"New {myEntry.Value} object added to \" +\n          \
  \    $\"custom collection, Name = {((Animal)myEntry.Value).Name}\");\n}\n```\n\n\
  可以覆盖此行为，以便你通过 `foreach` 直接访问 `Animal` 对象。有几种方法可以实现，最简单的是实现迭代器。\n\n### 迭代器\n\n在本章前面的部分，你已经看到\
  \ `IEnumerable` 接口允许你使用 `foreach` 循环。在 `foreach` 循环中使用你的类通常是有益的，而不仅仅是像之前节中显示的集合类。\n\
  \n然而，覆盖此行为或提供你自己的自定义实现并不总是简单的。为了说明这一点，有必要详细查看 `foreach` 循环。以下步骤向你展示了 `foreach` 循环遍历名为\
  \ `collectionObject` 的集合时实际上发生了什么：\n\n1. 调用 `collectionObject.GetEnumerator()`，它返回一个\
  \ `IEnumerator` 引用。该方法通过 `IEnumerable` 接口的实现变得可用。\n2. 调用返回的 `IEnumerator` 接口的 `MoveNext()`\
  \ 方法。\n3. 如果 `MoveNext()` 返回 `true`，则使用 `IEnumerator` 接口的 `Current` 属性来获取对象的引用，该引用将用于\
  \ `foreach` 循环中。\n4. 重复前两个步骤，直到 `MoveNext()` 返回 `false` 为止，此时循环终止。\n\n要在你的类中启用此行为，你必须覆盖多个方法、跟踪索引、维护\
  \ `Current` 属性等。为了达到有限的效果这可能耗费大量工作。\n\n一个更简单的替代方案是使用迭代器。有效而言，使用迭代器会在背后为你生成大量代码并将它们全部正确地连接起来。此外，使用迭代器的语法要更容易掌握。\n\
  \n迭代器的良好定义是：按顺序提供 `foreach` 块中使用的所有值的代码块。通常，此代码块是一个方法，尽管你也可以使用属性访问器和其他代码块作为迭代器。为了保持简单，你在这里将只查看方法。\n\
  \n无论代码块是什么，它的返回类型都是受限的。可能与预期相反，此返回类型与被枚举对象的类型不同。例如，在一个表示 `Animal` 对象集合的类中，迭代器块的返回类型不能是\
  \ `Animal`。两种可能的返回类型是前面提到的接口类型：`IEnumerable` 或 `IEnumerator`。你如下所示使用这些类型：\n\n- 要遍历一个类，使用返回类型为\
  \ `IEnumerator` 的 `GetEnumerator()` 方法。\n- 要遍历一个类的成员（例如方法），使用 `IEnumerable`。\n\n\
  在迭代器块内部，你通过使用 `yield` 关键字来选择用于 `foreach` 循环的值。此操作的语法如下：\n\n```python\nyield return\
  \ <value>;\n```\n\n这些信息就是构建简单示例所需的所有内容，如下（你可以在 `SimpleIterators\\Program.cs` 中找到这段代码）：\n\
  \n```python\n using System.Collections;\n      public static IEnumerable SimpleList()\n\
  \      {\n         yield return \"string 1\";\n         yield return \"string 2\"\
  ;\n         yield return \"string 3\";\n      }\n      static void Main(string[]\
  \ args)\n      {\n         foreach (string item in SimpleList())\n            Console.WriteLine(item);\n\
  \      }\n```\n\n\n\n\n你可以将此简单的迭代器添加到代码中以获得预期的行为。方法签名中的 `new` 关键字用于实现一种名为“方法隐藏”（`method\
  \ hiding`）的概念。这是一个高级主题，但请注意，该概念用于通过避免看似重复的代码来使代码更加自然、易读且易于理解：\n\n```\n public new\
  \ IEnumerator GetEnumerator()\n      {\n         foreach (object animal in Dictionary.Values)\n\
  \            yield return (Animal)animal;\n      }\n```\n\n现在，你可以使用以下代码来遍历集合中的 `Animal`\
  \ 对象：\n\n```\n foreach (Animal myAnimal in animalCollection)\n         {\n     \
  \       Console.WriteLine($\"New {myAnimal.ToString()} object added to \" +\n  \
  \                            $\" custom collection, Name = {myAnimal.Name}\");\n\
  \         }\n```\n\n### 深拷贝\n\n第 9 章 描述了如何通过受保护方法 `System.Object.MemberwiseClone()`\
  \ 执行浅拷贝，你可以使用如此处所示的 `GetCopy()` 方法：\n\n```\npublic class Cloner\n{\n   public int\
  \ Val;\n   public Cloner(int newVal) => Val = newVal;\n   public object GetCopy()\
  \ => MemberwiseClone();\n}\n```\n\n假设你的字段是引用类型而不是值类型（例如，对象）：\n\n```public\npublic\
  \ class Content\n{\n   public int Val;\n}\npublic class Cloner\n{\n   public Content\
  \ MyContent = new Content();\n   public Cloner(int newVal) => MyContent.Val = newVal;\n\
  \   public object GetCopy() => MemberwiseClone();\n}\n```\n\n在这种情况下，通过 `GetCopy()`\
  \ 的浅拷贝包含一个与原对象指向同一个对象的字段。以下代码使用了此 `Cloner` 类，阐明了浅拷贝引用类型的后果：\n\n```\nCloner mySource\
  \ = new Cloner(5);\nCloner myTarget = (Cloner)mySource.GetCopy();\nConsole.WriteLine($\"\
  myTarget.MyContent.Val = {myTarget.MyContent.Val}\");\nmySource.MyContent.Val =\
  \ 2;\nConsole.WriteLine($\"myTarget.MyContent.Val = {myTarget.MyContent.Val}\");\n\
  ```\n\n第四行为 `mySource.MyContent.Val` 赋值（即原对象中 `MyContent` 公有字段的 `Val` 公有字段），同时也更改了\
  \ `myTarget.MyContent.Val` 的值。这是因为 `mySource.MyContent` 指向与 `myTarget.MyContent`\
  \ 相同的对象实例。上述代码的输出如下：\n\n```\nmyTarget.MyContent.Val = 5\nmyTarget.MyContent.Val\
  \ = 2\n```\n\n为了解决这个问题，你需要执行深拷贝。你可以直接修改之前使用的 `GetCopy()` 方法来实现这一点，但更优的方法是使用 .NET\
  \ Framework 的标准做法：实现 `ICloneable` 接口，该接口有一个单一方法 `Clone()`。该方法不接受参数并返回一个 `object`\
  \ 类型的结果，其签名与之前使用的 `GetCopy()` 方法相同。\n\n要修改前面的类，请尝试使用以下深拷贝代码：\n\n```\npublic class\
  \ Content\n{\n   public int Val;\n}\npublic class Cloner : ICloneable\n{\n   public\
  \ Content MyContent = new Content();\n   public Cloner(int newVal) => MyContent.Val\
  \ = newVal;\n   public object Clone()\n   {\n      Cloner clonedCloner = new Cloner(MyContent.Val);\n\
  \      return clonedCloner;\n   }\n}\n```\n\n这通过使用原始 `Cloner` 对象 (`MyContent`) 中包含的\
  \ `Content` 对象的 `Val` 字段创建了一个新的 `Cloner` 对象。该字段是一个值类型，因此不需要更深拷贝。\n\n使用像刚才示例那代码来测试浅拷贝——但使用\
  \ `Clone()` 代替 `GetCopy()`——将得到以下结果：\n\n```\nmyTarget.MyContent.Val = 5\nmyTarget.MyContent.Val\
  \ = 5\n```\n\n这一次，包含的对象是相互独立的。请注意，在更复杂的对象系统中，对 `Clone()` 的调用有时是递归的。例如，如果 `Cloner`\
  \ 类的 `MyContent` 字段也需要深拷贝，那么你可能需要以下代码：\n\n```\npublic class Cloner : ICloneable\n\
  {\n   public Content MyContent = new Content();\n   …\n   public object Clone()\n\
  \   {\n      Cloner clonedCloner = new Cloner();\n      clonedCloner.MyContent =\
  \ MyContent.Clone();\n      return clonedCloner;\n   }\n}\n```\n\n你在这里调用默认构造函数以简化创建新\
  \ `Cloner` 对象的语法。为了让此代码工作，你还需要对 `Content` 类实现 `ICloneable`。\n\n### 在 CardLib 中添加深拷贝\n\
  \n你可以通过使用 `ICloneable` 接口实现复制 `Card`、`CardCollection` 和 `Deck` 对象的能力来付诸实践。这在某些卡牌游戏中可能有用，在这些游戏中，你可能并不希望两个牌组指向同一组\
  \ `Card` 对象，尽管你可能想让一个牌组的牌牌顺序与另一个相同。\n\n在 `Ch11CardLib` 中为 `Card` 类实现复制功能是简单的，因为浅拷贝就足够（`Card`\
  \ 仅包含字段形式的值类型数据）。首先对 `class` 定义进行以下更改：\n\n```\n public class Card : ICloneable\n\
  \   {\n      public object Clone() => MemberwiseClone();\n```\n\n接下来，在 `CardCollection`\
  \ 类上实现 `ICloneable`。这稍微复杂一些，因为它涉及到复制集合中的每个 `Card`——所以你需要进行深拷贝：\n\n```\n public class\
  \ CardCollection : CollectionBase, ICloneable\n   {\n      public object Clone()\n\
  \      {\n         CardCollection newCards = new CardCollection();\n         foreach\
  \ (Card sourceCard in this)\n         {\n            newCards.Add((Card)sourceCard.Clone());\n\
  \         }\n         return newCards;\n      }\n```\n\n最后，在 `Deck` 类上实现 `ICloneable`。注意这里有一个小问题：`Ch11Lib`\
  \ 中的 `Deck` 类没有方法修改它包含的牌。为了解决这个问题，为 `Deck` 定义一个新的私有构造函数，允许在实例化 `Deck` 对象时传入 `CardCollection`。以下在此类中实现复制的代码：\n\
  \n```\n public class Deck : ICloneable\n   {\n      public object Clone()\n    \
  \  {\n         Deck newDeck = new Deck(cards.Clone() as CardCollection);\n     \
  \    return newDeck;\n      }\n      private Deck(CardCollection newCards) => cards\
  \ = newCards;\n```\n\n再次，你可以使用客户端代码进行测试。与之前一样，将此代码放在客户端项目的 `Main()` 方法中测试（你可以在章节下载的\
  \ `Ch11Client\\Program.cs` 中找到此代码）：\n\n```\nDeck deck1 = new Deck();\nDeck deck2\
  \ = (Deck)deck1.Clone();\nConsole.WriteLine($\"The first card in the original deck\
  \ is: {deck1.GetCard(0)}\");\nConsole.WriteLine($\"The first card in the cloned\
  \ deck is: {deck2.GetCard(0)}\");\ndeck1.Shuffle();\nConsole.WriteLine(\"Original\
  \ deck shuffled.\");\nConsole.WriteLine($\"The first card in the original deck is:\
  \ {deck1.GetCard(0)}\");\nConsole.WriteLine($\"The first card in the cloned deck\
  \ is: {deck2.GetCard(0)}\");\nConsole.ReadKey();\n```\n\n\n\n\n你可能见过很多值比较的情况，至少在使用简单类型时是如此。当涉及到比较对象的值时，情况会变得复杂一些。首先，你必须定义什么是“比较”，以及像\
  \ `>` 这样的运算符在你的类语境下意味着什么。这在集合中尤为重要，你可能想要根据某些条件对对象进行排序，例如按照字母顺序或根据某种更复杂的算法。\n\n###\
  \ 类型比较\n\n在比较对象时，你通常需要知道它们的类型，这将让你能够判断是否可以进行值比较。在第 9 章中，你了解了 `GetType()` 方法，所有类都继承自\
  \ `System.Object`，以及该方法如何与 `typeof()` 运算符结合使用来确定（并根据对象类型执行操作）：\n\n```\nif (myObj.GetType()\
  \ == typeof(MyComplexClass))\n{\n   // myObj 是类 MyComplexClass 的实例。\n}\n```\n\n\
  你还见过 `ToString()` 的默认实现（它也继承自 `System.Object`），它可以让你获取对象类型的字符串表示。你也可以比较这些字符串，尽管这种实现目标的方法相当杂乱。\n\
  \n本节演示了一种方便的简写方式：`is` 运算符。该运算符允许编写更具读性的代码，并且正如你将看到的，它具有检查基类的优势。在在查看 `is` 运算符之前，你需要了解在处理值类型（相对于引用类型）时后台通常会发生什么：*装箱（boxing）*和*拆箱（unboxing）*。\n\
  \n#### 装箱与拆箱\n\n在第 8 章中，你学习了引用类型和值类型之间的区别，这在第 9 章中通过比较结构体（值类型）和类（引用类型）进行了说明。装箱是将类型转换为\
  \ `System.Object` 类型或该值类型所实现的接口类型的行为。拆箱则是相反的转换。\n\n例如，假设你有如下的结构体类型：\n\n```\nstruct\
  \ MyStruct\n{\n   public int Val;\n}\n```\n\n你可以通过将该类型的结构体放入 `object` 类型变量中来对其装箱：\n\
  \n```\nMyStruct valType1 = new MyStruct();\nvalType1.Val = 5;\nobject refType =\
  \ valType1;\n```\n\n在这里，你创建了一个类型为 `MyStruct` 的新变量 (`valType1`)，给该结构体的 `Val` 成员赋值，然后将其装箱到\
  \ `object` 类型的变量 (`refType`) 中。\n\n通过这种方式装箱变量创建的对象包含对值类型变量副本的引用，而不是对原始值类型变量的引用。你可以通过修改原始结构体的内容，然后将对象中的结构体拆箱到一个新变量并检查其内容来验证：\n\
  \n```\nvalType1.Val = 6;\nMyStruct valType2 = (MyStruct)refType;\nConsole.WriteLine($\"\
  valType2.Val = {valType2.Val}\");\n```\n\n这段代码给出了如下输出：\n\n```\nvalType2.Val = 5\n\
  ```\n\n然而，当你将引用类型赋值给对象时，你会得到不同的行为。通过将 `MyStruct` 改为类（忽略该类名现在不合适的事实），你可以看到：\n\n```\n\
  class MyStruct\n{\n   public int Val;\n}\n```\n\n在不更改之前所示的客户端代码的情况下（再次忽略命名错误的变量），你得到了如下输出：\n\
  \n```\nvalType2.Val = 6\n```\n\n你也可以将值类型装箱到接口类型，只要它们实现了该接口。例如，假设 `MyStruct` 类型如下所示实现了\
  \ `IMyInterface` 接口：\n\n```\ninterface IMyInterface {}\nstruct MyStruct : IMyInterface\n\
  {\n   public int Val;\n}\n```\n\n你可以按照如下方式将结构体装箱为 `IMyInterface` 类型：\n\n```\nMyStruct\
  \ valType1 = new MyStruct();\nIMyInterface refType = valType1;\n```\n\n你可以使用标准的强制转换语法将其拆箱：\n\
  \n```\nMyStruct ValType2 = (MyStruct)refType;\n```\n\n如这些示例所示，装箱是在你不干预的情况下完成的——也就是说，你不需要编写任何代码来实现它。然而，拆箱一个值需要显式转换，并且它要求你进行强制转换（装箱是隐式的，没有这一要求）。\n\
  \n你可能在奇怪为什么要这样做。装箱极其有用有两个非常充分的理由。首先，它允许你在集合（如 `ArrayList`）中使用值类型，其中项的类型为 `object`。其次，它是允许你对值类型（如\
  \ `int` 和结构体）调用 `object` 方法的内部机制。\n\n值得注意的是，你不需要拆箱即可访问由接口定义的成员。接口不能定义字段，因此你总是需要拆箱来访问字段，但接口可以定义属性。\n\
  \n#### is 运算符\n\n尽管名字如此，但 `is` 运算符并不是判断对象是否为特定类型的方法。相反，`is` 运算符允许你检查对象是否是某个给定类型或*可以转换为*该类型。如果是这种情况，则运算符求值为为\
  \ `true`。在面向对象编程（OOP）术语中，`is` 测试的是“是”（is-a）关系。\n\n早前的示例展示了 `Cow` 类和 `Chicken` 类，它们都继承自\
  \ `Animal`。使用 `is` 运算符比较 `Animal` 类型，对于这三种类型都会返回 `true`，这是使用之前显示的 `GetType()` 方法很难实现的内容。\n\
  \n`is` 运算符具有如下语法：\n\n```\n<operand> is <type>\n```\n\n该表达式可能的可能如下：\n\n*   如果 `<type>`\
  \ 是类类型，当 `<operand>` 是该类型、继承自该类型或可以装箱为该类型时，结果为 `true`。\n*   如果 `<type>` 是接口类型，当\
  \ `<operand>` 是该类型或实现了该接口时，结果为 `true`。\n*   如果 `<type>` 是值类型，当 `<operand>` 是该类型或可以拆箱为该类型时，结果为\
  \ `true`。\n\n接下来的“尝试”展示了这在实践中是如何运作的。\n\n### 使用 is 表达式进行模式匹配\n\n回第 4 章中引入的 `switch`\
  \ 语句，以及第 5 章中扩展的包含支持基于变量类型（`string`、`int` 等）匹配的情况。一旦确定了类型，就可以访问其属性和方法以进一步过滤匹配。\n\
  \n`switch case` 方法是更优雅的模式匹配方法，因为 `is` 运算符通常实现了许多 `if…else if…` 语句。随着模式匹配场景的扩大，语句可能会变得很深很长，降低代码的可读性。如果发生这种情况，请记住另一种方案是\
  \ `switch case` 模式匹配功能。然而，对于较小的代码段，`is` 运算符是匹配模式和过滤数据集的非常有效且强大的策略。例如下面的代码：\n\n```\n\
  object[] data = \n      { 1.6180, null, new Cow(\"Lea\"), new Chicken(\"Rual\"),\
  \ \"none\" };\n\nforeach (var item in data)\n{\n  if (item is 1.6180) Console.WriteLine(\"\
  黄金分割率\");\n  else if (item is null) Console.WriteLine(\"该值为空\");\n  else if (item\
  \ is Cow co) Console.WriteLine($\"奶牛的名字是 {co.Name}.\");\n  else if (item is Chicken\
  \ ch) Console.WriteLine(\"这只鸡的名字是\" +\n           $\" {ch.Name} 并且 {ch.RunInCircles()}\"\
  );\n  else if (item is var catcher) Console.WriteLine(\"捕获所有\" +\n           $\"\
  \ {catcher.GetType().Name}\");\n}\n```\n\n\n\n\n`data` 变量中存储的对象包含几种不同的类型。通过 `foreach`\
  \ 语句遍历 `object[]` 数组，你可以使用 `is` 运算符检查变量的类型，并在匹配成功时采取适当的操作。第一个模式匹配针对的是 1.6180，这是一个常量值，是\
  \ `const pattern` 的一个示例，第二个模式匹配中的 `null` 也是如此。在匹配常量时，可以使用 `==` 运算符来实现达到相同的结果；但是，`is`\
  \ 运算符更容易理解得多，也更加友好。\n\n`data` 变量中的最后两个对象类型类型为 `Cow` 和 `Chicken`。`type pattern` 在发生模式匹配时会为指定的类型分配一个新变量。例如，当匹配到\
  \ `Chicken` 时，会创建一个新的 `ch` 变量，该变量包含指向 `Chicken` 对象的引用，允许程序员访问 `Chicken` 类中包含的属性和方法（例如，属性\
  \ `Name` 和名为 `RunInCircles()` 的方法）。\n\n最后，你可以使用 `var pattern` 来捕获代码路径中未匹配任何上方 `if…else\
  \ if…` 语句的所有场景。然后使用 `catcher` 变量通过 `GetType().Name` 属性获取变量类型。\n\n### 数值比较\n\n考虑两个代表人的\
  \ `Person` 对象，每个对象都有一个整数 `Age` 属性。你可能想比较它们以查看谁年龄更大。你可以直接使用以下代码：\n\n```\nif (person1.Age>\
  \ person2.Age)\n{\n   …\n}\n```\n\n这种方式运行良好，但也有其他方案。你可能更喜欢使用如下语法：\n\n```\nif (person1>\
  \ person2)\n{\n   …\n}\n```\n\n这是通过 `operator overloading`（运算符重载）实现的，你将在本节中看到。这是一项强大的技术，但应该谨慎使用。在前面的代码中，无法立即看出比较的是年龄——它也可能是身高、体重、IQ\
  \ 或仅仅是通用的“伟大”。\n\n另一个选项是使用 `IComparable` 和 `IComparer` 接口，它们允许你以标准的方式定义对象之间如何进行比较。.NET\
  \ Framework 中的各种集合类都支持这种技术，它是对集合中的对象的极佳方式。\n\n### 运算符重载\n\n`operator overloading`\
  \ 允许你在自己设计的类中使用标准运算符，如 `+`、`>` 等。这被称为“重载”，因为当与特定参数类型一起使用时，你这些这些提供了了自己的实现，这与你通过为同名方法提供不同参数来重载方法非常。\n\
  \n运算符重载非常有用，因为你可以在运算符重载的实现中执行任何你想要的处理，这可能并不像例如 `+`（意味着“将这两个操作数相加”）那样简单。稍后，你将在 `CardLib`\
  \ 库的进一步升级中看到此示例，届时你将为比较运算符提供实现，通过比较两张牌来查看在一次回合（纸牌游戏的一轮）中哪一张能赢另一张。\n\n由于许多纸牌游戏中的回合取决于涉及的牌的点数和花色，这并不像比较牌面上的数字那么简单。如果落下的第二张牌花色与第一张不同，那么第一张牌无论点数如何都可能获胜。你可以通过考虑两个操作数的顺序来实现这一点。你还可以考虑王牌花色，它可以击败其他花色，即使它不是第一张出的花色。这意味着计算出\
  \ `card1 > card2` 为 `true`（即如果 `card1` 先出，则 `card1` 将击败 `card2`）并不一定意味着 `card2 >\
  \ card1` 为 `false`。如果 `card1` 和 `card2` 都不是王牌且它们属于不同的花色，那么两次比较都将为 `true`。\n\n不过，首先，这里是运算符重载的基本语法。可以通过向类中添加运算符类型成员（必须是静态的）来重载运算符。某些运算符有多种用途（例如\
  \ `-`，它具有一元和二元能力）；因此，你还需要指定你正在处理多少个操作数以及这些操作数的类型。通常情况下，你的操作数与定义运算符的类类型相同，尽管也可以定义处理混合类型的运算符，正如你很快将看到的。。\n\
  \n例如，考虑定义如下的简单类型 `AddClass1`：\n\n```\npublic class AddClass1\n{\n   public int val;\n\
  }\n```\n\n这只是对 `int` 值的封装，但它说明了这些原理。使用这个类，下面的代码将无法编译：\n\n```\nAddClass1 op1 = new\
  \ AddClass1();\nop1.val = 5;\nAddClass1 op2 = new AddClass1();\nop2.val = 5;\nAddClass1\
  \ op3 = op1 + op2;\n```\n\n你得到的错误告知 `+` 运算符不能应用于 `AddClass1` 类型的操作数。这是因为你还没有定义要执行的操作。类似下面的代码可以运行，但它不会给你你可能想要的结果：\n\
  \n```\nAddClass1 op1 = new AddClass1();\nop1.val = 5;\nAddClass1 op2 = new AddClass1();\n\
  op2.val = 5;\nbool op3 = op1 == op2;\n```\n\n\n\n\n\n此外，如果你混合了类型，那么操作数的提供的顺序必须与运算符重载中参数的顺序一致。如果你尝试以错误的顺序使用你重载的运算符，则操作将失败。例如，你不能如下所示使用该运算符：\n\
  \n```cs\nAddClass3 op3 = op2 + op1;\n```\n\n除非当然，你提供了另一个参数反反的重载版本：\n\n```cs\npublic\
  \ static AddClass3 operator +(AddClass2 op1, AddClass1 op2)\n{\n   AddClass3 returnVal\
  \ = new AddClass3();\n   returnVal.val = op1.val + op2.val;\n   return returnVal;\n\
  }\n```\n\n以下运算符是可以被重载的：\n\n- `一元运算符`—`+`, `-`, `!`, `~`, `++`, `--`, `true`, `false`\n\
  - `二元运算符`—`+`, `-`, `*`, `/`, `%`, `&`, `|`, `^`, `<<`, `>>`\n- `比较运算符`—`==`, `!=`,\
  \ `<`, `>`, `<=`, `>=`\n\n你不能重载赋值运算符（例如 `+=`），但这些运算符使用了其简单的对应运算符（如 `+`），所以你不需要担心这个问题。重载\
  \ `+` 意味着 `+=` 将按预期运行。`=` 赋值运算符不能重载，因为它具有如此基础的用法，但此运算符与用户定义的转换运算符有关，你将在下一节中查看它们。\n\
  \n你也不能重载 `&&` 和 `||`，但这些运算符使用 `&` 和 `|` 运算符来执行计算，因此重载这些运算符就足够了。`&&` 和 `||` 运算符通常被称为*短路求值器*，这意味着\
  \ C# 一旦确定了最终的真或假结果，就会停止求值。这防止了代码执行不必要的执行。\n\n某些运算符（如 `<` 和 `>`）必须成对进行重载。也就是说，除非你也重载了\
  \ `>`，否则你不能重载 `<`。在许多情况下，你可以直接从这些运算符中调用其他运算符来减少所需代码（以及可能发生的错误），如下例所示：\n\n```cs\n\
  public class AddClass1\n{\n   public int val;\n   public static bool operator >=(AddClass1\
  \ op1, AddClass1 op2)\n          => (op1.val >= op2.val);\n   public static bool\
  \ operator <(AddClass1 op1, AddClass1 op2)\n          => !(op1 >= op2);\n   // 还需要\
  \ <= 和 > 运算符的实现。\n}\n```\n\n在更复杂的运算符定义中，这可以减少代码行。这也意味着如果你以后决定修改这些运算符的实现，你需要更改的代码就会更少。\n\
  \n同样的情况也适用于 `==` 和 `!=`，但对于这些运算符，重写 `Object.Equals()` 和 `Object.GetHashCode()` 往往是值得的，因为这两个函数也可以用于比较对象。通过重写这些方法，你可以确保无论该类的用户使用什么种技术，都能得到相同的结果。这并非必须的，但为了完整性，它是值得添加的。它需要以下非静态重写方法：\n\
  \n```cs\npublic class AddClass1\n{\n   public int val;\n   public static bool operator\
  \ ==(AddClass1 op1, AddClass1 op2)\n          => (op1.val == op2.val);\n   public\
  \ static bool operator !=(AddClass1 op1, AddClass1 op2)\n          => !(op1 == op2);\n\
  \   public override bool Equals(object op1) => val == ((AddClass1)op1).val;\n  \
  \ public override int GetHashCode() => val;\n}\n```\n\n`GetHashCode()` 用于根据对象的状态为对象实例获取一个唯一的\
  \ `int` 值。在这里，使用 `val` 是的，因为它也是一个 `int` 值。\n\n注意，`Equals()` 使用了 `object` 类型参数。你需要使用此签名，否则你将是在重载该方法而不是重写它，并且类的用户仍然可以访问该类的默认实现。相反，你必须使用类型转换来获取所需的结果。在如下所示的代码中，使用之前讨论过的\
  \ `is` 运算符检查对象类型通常是值得的：\n\n```cs\n public override bool Equals(object op1)\n   {\n\
  \      if (op1 is AddClass1)\n      {\n         return val == ((AddClass1)op1).val;\n\
  \      }\n      else\n      {\n         throw new ArgumentException(\n         \
  \   \"无法将 AddClass1 对象与类型为 \" 的对象进行比较\"\n            + op1.GetType().ToString());\n\
  \      }\n   }\n```\n\n在此代码中，如果传递给 `Equals` 的操作数类型错误或无法转换为正确的类型，则会抛出异常。当然，这种行为可能不是你想要的。你可能希望能够比较一种类型的对象与另一种类型的对象，在这种情况下将需要更多的分支。或者，你可能希望将比较限制在两个对象都是相同类型的情况下，这将需要对第一个\
  \ `if` 语句进行如下更改：\n\n```cs\n if (op1.GetType() == typeof(AddClass1))\n```\n\n####\
