  \ 2-4 所示。\n\n主窗口是显示所有代码的地方，它将根据你创建的解决方案类型而不同。图 2-4 中所示的是`ASP.NET Core 应用程序`；启动页提供了一些与该应用程序相关的链接和附加信息。此窗口可以包含许多文档，每个文档都由标签页指示，因此你可以通过点击文件名轻松地在多个文件之间切换。它还具有其他功能：它可以显示你为项目设计的\
