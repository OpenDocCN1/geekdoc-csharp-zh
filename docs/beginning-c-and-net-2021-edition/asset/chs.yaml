  \ 实例通过引发你可以在代码中处理的事件来通知你。 |\n\n# 15 XML 和 JSON\n\n### 本章代码下载\n\n本章的代码下载可以在 [`www.wiley.com`](http://www.wiley.com)\
  \ 的书籍页面找到。点击 Downloads 链接。代码也可以在 [`github.com/benpk/BeginningCSharpAndNet](http://github.com/benpk/BeginningCSharpAndNet)\
  \ 找到。代码位于 Chapter15 文件夹中，并根据章中的名称单独命名。\n\n就像 C# 等编程语言以机器和人类都能读懂的格式描述计算机逻辑一样，XML\
  \ 和 JSON 都是*数据语言*，用于以简单的文本格式存储和检索数据，这种格式可以被人类和几乎任何计算机读取。\n\n\n\n\n大多数 C# .NET 都以某种形式使用\
  \ XML 来存储数据，例如存储配置细节的 `.config` 文件以及在 WPF 和 UWP 应用程序使用的 XAML 文件。由于这一重要事实，我们本章将花费大部分时间在\
  \ XML 上，仅对 JSON 进行简单介绍。\n\n在本章中，你将学习 XML 和 JSON 的基础，然后学习如何创建 XML 文档和架构。你将学习 `XmlDocument`\
  \ 类的基础、如何读写 XML、如何插入和删除节点、如何使用 `XPath` 在 XML 文档中搜索数据，最后如何读写 JSON。\n\n## XML 基础\n\
  \n可扩展标记语言（XML）是一种`data language`，一种以简单的文本格式存储数据的方法，人类和几乎任何计算机都可以读取。它像 HTML 一样是 W3C\
  \ 标准格式（[XML 官方网站](http://www.w3.org/XML)）。它已在 .NET Framework 和其他微软产品中被全面采用。即使是新版本的\
  \ Microsoft Office 引入的文档格式也是基于 XML 的，尽管 Office 本身并不是 .NET 程序。\n\nXML 的细节可能非常复杂，因此我们在这里不会查看每一个细节。幸运的是，大多数任务并不需要\
  \ XML 的详细知识，因为 Visual Studio 通常会处理大部分工作——你很少需要手动编写 XML 文档。如果你想更深入地学习 XML，可以阅读如 Joe\
  \ Fawcett、Danny Ayers 和 Liam Quin 编写的 *Beginning XML* 第 5 版（Wrox, 2021），或许多在线教程之一，例如\
  \ [XML 基础](http://www.xmlnews.org/docs/xml-basics.html) 或 [W3Schools XML 教程](http://www.w3schools.com/xml)。\n\
  \n基本格式非常简单，如下例所示，该示例展示了共享书籍信息的 XML 格式：\n\n```\n <book>\n    <title>Beginning C#\
  \ and .NET</title>\n    <author>Benjamin Perkins and Jon Reid</author>\n    <code>978-1119795780</code>\n\
  \  </book>\n  <book>\n    <title>Beginning XML</title>\n    <author> Joe Fawcett\
  \ et al </author>\n    <code>978-1118162132</code>\n  </book>\n  <book>\n    <title>\
  \ Professional C# 7 and .NET Core =</title>\n    <author>Christian Nagel</author>\n\
  \    <code>978-1119449270</code>\n  </book>\n```\n\n在这个示例中，每本书都有标题、作者和一个用于标识书籍的唯一代码。每本书的数据都包含在一个书籍\
  \ `element` 中，它以 `<book>` `tag` 开始并以 `</book>` 结束标签结束。`title`、`author` 和 `code`\
  \ 值存储在书籍元素内部的嵌套元素中。\n\n可选地，元素在标签内部还可以拥有 `attributes`。如果书籍代码是书籍元素的属性而不是它自己的元素，你将看到书籍元素开头如下所示：`<book\
  \ code=458685>`。为了简单起见，我们在本章的示例中坚持使用元素。通常情况下，属性和元素都被称为 `nodes`，就像树节点一样。\n\n## JSON\
  \ 基础\n\n你在开发 C# 应用程序时可能会遇到的另一种数据语言是 JSON。JSON 代表 JavaScript 对象表示法。和 XML 一样，它也是一种标准（[JSON\
  \ 官方网站](http://www.json.org)），尽管从名称上可以看出，它源自 JavaScript 语言而非 C#。虽然它不像 XML 那样在整个\
  \ .NET 中使用，但它是从 Web 服务和网络浏览器传输数据的常用格式。\n\nJSON 也有非常简单的格式。我们之前在 XML 中展示的相同书籍数据在这里以\
  \ JSON 形式呈现：\n\n```\n[\n  {\n    \"title\": \"Beginning C# and .NET\",\n    \"author\"\
  : \"Benjamin Perkins and Jon Reid\",\n    \"code\": \"978-1119795780\"\n  },\n \
  \ {\n    \"title\": \"Beginning XML\",\n    \"author\": \"Joe Fawcett et al\",\n\
  \    \"code\": \"978-1118162132\"\n   },\n  {\n    \"title\": \"Professional C#\
  \ 7 and .NET Core\",\n    \"author\": \"Christian Nagel\",\n    \"code\": \"978-1119449270\"\
  \n  }\n]\n```\n\n与之前的 XML 示例一样，我们看到了带有标题、作者和唯一代码的书籍。JSON 使用大括号（ `{}` ）来界定数据块，使用方括号（\
  \ `[]` ）来界定数组和集合，类似于 C#、JavaScript 和其他 C 类语言使用大括号表示代码块、使用方括号引用数组和集合中的项。\n\nJSON\
  \ 是比 XML 更紧凑的格式，但对人类来说更难阅读，尤其是当大括号和小括号在复杂数据中深度嵌套时。\n\n## XML 架构\n\nXML 文档可以通过 `schema`\
  \ 来描述，架构是另一个 XML 文件，用于描述特定文档中允许哪些元素和属性。你可以根据架构对 XML 文档进行`validate$，确保你的程序不会遇到预料之外的数据。\n\
  \nXML 文档可以通过 `schema` 来描述，架构是另一个 XML 文件，用于描述特定文档中允许哪些元素和属性。你可以根据架构对 XML 文档进行验证，确保你的程序不会遇到预料之外的数据。\n\
  \nXML 文档可以通过 `schema` 来描述，架构是另一个 XML 文件，用于描述特定文档中允许哪些元素和属性。你可以根据架构对 XML 文档进行验证，确保你的程序不会遇到预料之外的数据。\n\
  \nXML 文档可以通过 `schema` 来描述，架构是另一个 XML 文件，用于描述特定文档中允许哪些元素和属性。你可以根据架构对 XML 文档进行验证，确保你的程序不会遇到预料之外的数据。\n\
  \nXML 文档可以通过 `schema` 来描述，架构是另一个 XML 文件，用于描述特定文档中允许哪些元素和属性。你可以根据架构对 XML 文档进行验证，确保你的程序不会遇到预料之外的数据。\n\
  \n\n\n```xml\nusing System.Xml;\n.\n.\n.\nXmlDocument document=new XmlDocument();\n\
  document.Load(@\"C:\\BeginningCSharpAndDotNET\\Chapter15\\XML and Schema\\books.xml\"\
  );\n```\n\n这两行代码创建了 `XmlDocument` 类的一个新实例，并将 `books.xml` 文件加载到其中。\n\n记住，`XmlDocument`\
  \ 类位于 `System.Xml` 命名空间，你应该在代码开头的 `using` 部分插入 `using System.Xml;` 指令。\n\n除了加载和保存\
  \ XML 之外，`XmlDocument` 类还负责维护 XML 结构本身。因此，你将在该类上发现许多用于创建、修改和删除树中节点的方法。你很快就会查看其中一些方法，但为了很好地介绍这些方法，你需要进一步了解另一个类：`XmlElement`。\n\
  \n### XmlElement 类\n\n现在文档已经加载到内存中，你想要对其进行一些操作。你在前面的代码中创建的 `XmlDocument` 实例的 `DocumentElement`\
  \ 属性返回 `XmlElement` 实例，它代表 `XmlDocument` 的根元素。这个元素非常重要，因为它让你访问文档中的每一比特信息：\n\n```csharp\n\
  XmlDocument document=new XmlDocument();\ndocument.Load(\n       @\"C:\\BeginningCSharpAndDotNET\\\
  Chapter15\\XML and Schema\\books.xml\");\nXmlElement element = document.DocumentElement;\n\
  ```\n\n获取文档的根元素后，你就可以使用这些信息了。`XmlElement` 类包含了用于操作树的节点和属性的方法和属性。让我们先检查导航 XML 元素的属性，如表\
  \ 15-2 所示。\n\n| 属性 | 描述 |\n| --- | --- |\n| `FirstChild` | 返回此元素之后的第一个子元素。如果你还记得章节早些之前的\
  \ `books.xml` 文件，文档的根节点被称为“books”，随后的下一个节点是“book”。那么在那个文档中，根节点“books”的第一个节点就是“book”。`<books>`\
  \ *根节点* `<book>` *FirstChild* `FirstChild` 返回一个 `XmlNode` 对象，你应该检查返回的节点类型，因为它可能并不总是\
