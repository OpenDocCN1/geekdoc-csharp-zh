  \n**图 6-11**\n\n在重载函数时，包含了函数签名的所有方面。例如，你可能有两个不同的函数，分别通过按值和按引用接收参数：\n\n```cs\nstatic\
  \ void ShowDouble(ref int val)\n{\n   …\n}\nstatic void ShowDouble(int val)\n{\n\
  \   …\n}\n```\n\n决定使用哪个版本完全取决于函数调用是否包含 `ref` 关键字。以下代码将调用引用版本：\n\n```cs\nShowDouble(ref\
  \ val);\n```\n\n这将调用按值版本：\n\n```cs\nShowDouble(val);\n```\n\n或者，你也可以拥有所需参数数量不同的函数等。\n\
  \n## 使用 DELEGATES\n\n`delegate`（委托）是一种类型，允许你存储对函数的引用。虽然这听起来相当复杂，但其机制出奇地简单。委托最重要的用途将在本书的后面当你查看事件和事件处理时变得变得明朗，但在这里简要考虑它们是有用的。委托的声明方式与函数非常相似，但没有函数体并使用了\
  \ `delegate` 关键字。委托声明指定了返回类型和参数列表。\n\n定义委托后，你可以声明一个该委托类型的变量。然后你可以将该变量初始化为任何与该委托返回类型和参数列表相同的函数引用。一旦完成，你就可以像使用函数一样通过委托变量调用该函数。\n\
  \n当你有一个引用函数的变量时，还可以执行其他原本无法的操作。例如，你可以将委托变量作为参数传递给函数，然后该函数可以使用该委托来调用它引用的任何函数，而无需在运行时知道将调用哪个函数。下面的“试一试”演示了如何使用委托访问两个函数之一。\n\
  \n#### 练习题\n\n1. **6.1** 以下两个函数都有错误。错误是什么？\n\n```cs\n     static bool Write()\n\
  \          {\n             Console.WriteLine(\"Text output from function.\");\n\
  \          }\n          static void MyFunction(string label, params int[] args,\
  \ bool showLabel)\n          {\n             if (showLabel)\n                Console.WriteLine(label);\n\
  \             foreach (int i in args)\n                Console.WriteLine($\"{i}\"\
  );\n         }\n```\n\n2. **6.2** 编写一个应用程序，使用两个命令行参数分别将值放入字符串和整数变量中。然后显示这些值。\n\n\
  3. **6.3** 创建一个委托并在请求输入时使用它模拟 `Console.ReadLine()` 函数。\n\n4. **6.4** 修改以下结构体以包含一个返回订单总价的函数：\n\
  \n```cs\n     struct Order\n          {\n             public string itemName;\n\
  \             public int unitCount;\n             public double unitCost;\n    \
  \     }\n```\n\n5. **6.5** 向 `Order` 结构体添加另一个函数，返回如下格式的字符串（角括号内替换为值）：\n\n```cs\n\
  \ Order Information: <unit count> <item name> items at $<unit cost> each, total\
  \ cost $<total cost>\n```\n\n练习题的答案可以在附录中找到。\n\n## 总结\n\n| 主题 | 关键概念 |\n| --- |\
  \ --- |\n| 定义函数 | 函数通过名称、零或多个参数以及返回类型定义。函数的名称和参数共同定义函数的签名。可以定义多个同名但签名不同的函数，被称为函数重载。函数也可以在结构体类型中定义。\
  \ |\n| 返回值和参数 | 函数的类型可以是任何类型，如果不返回值则为 `void`。参数也可以是任何类型，由类型和名称的列表组成。可以通过参数数组指定指定数量的参数，它必须位于参数列表的最后。参数可以指定为\
  \ `ref` 或 `out` 参数，以便向调用者返回值。调用函数时，指定的任何参数在类型和顺序上必须与参数匹配，如果定义中使用了这些关键字，还需包含。 |\n\
  | 变量作用域 | 变量的作用域取决于其定义的代码块。代码块包括函数以及其他结构（如循环）。可以在不同的作用域级别上定义多个同名的独立变量。 |\n| 命令行参数\
  \ | 控制台应用程序中的 `Main()` 函数可以接收执行应用程序时传递给程序的命令行参数。在执行应用程序时，这些参数通过由空格分隔的参数来指定，较长的参数可以放在引号中。\
  \ |\n\n\n\n\n\n### 本章代码下载\n\n本章的下载下载可以在书籍页面 [`www.wiley.com`](http://www.wiley.com)\
  \ 找到。点击 Downloads 链接。代码也可以在 [`github.com/benperk/BeginningCSharpAndDotNET`](http://github.com/benperk/BeginningCSharpAndDotNET)\
  \ 获取。代码位于 `Chapter07` 文件夹中，并根据全章中的名称单独命名。\n\n到目前为止，本书已经涵盖了 C# 简单编程的所有基础。在进入下一部分的面向对象编程之前，你需要了解\
  \ C# 代码中的调试和错误处理。\n\n代码中的错误将永远贯伴你的左右。无论程序员有多优秀，问题总是会漏掉，成为一名优秀程序员的一部分就是意识到这一点并做好应对准备。当然，有些问题是微不足道的，不会影响应用程序的执行，例如按钮上的拼写错误，但也会出现明显的错误，包括那些导致应用程序完全失败的错误（通常称为\
  \ `fatal errors`）。致命错误包括阻止编译的简单代码错误（`syntax errors`），或只在运行时发生的更严重的问题。某些错误是微妙的。也许是你的应用程序由于缺少请求的字段而未能向数据库添加记录，或者在其他限制情况下添加了错误的数据记录。这类应用程序逻辑在某种程度上存在的错误被称为\
  \ `semantic errors`（语义错误）或 `logic errors`（逻辑错误）。\n\n通常，在用户抱怨某些功能运行不正常之前，你并不知道这些微妙的错误。这让你面临着追踪代码以查明发生了什么并修复它，使其按预期工作任务。在这些情况下，Visual\
  \ Studio 的调试功能是极大的帮助。本章的第一部分将介绍一些可用技术，并将它们应用于一些常见问题。\n\n然后，你将学习 C# 中可用的错误处理技术。这些技术允许你在可能发生错误的情况下采取预防措施，并编写足够健壮的代码来应对可能导致致命的错误。这些技术是\
  \ C# 语言的一部分，而不是调试功能，但 IDE 也提供了一些工具来帮助你。\n\n## 在 VISUAL STUDIO 中调试\n\n早些时候，你学会了有两种方式执行应用程序：启用调试或不启用调试。默认情况下，当你从\
  \ Visual Studio (VS) 执行应用程序时，它会在启用调试的状态下运行。例如，当你按下 `F5` 或点击工具栏上的绿色启动箭头时，就会发生这种情况。要在不启用调试的情况下执行应用程序，选择\
  \ `Debug ➪ Start Without Debugging`，或按 `Ctrl+F5`。\n\nVisual Studio 允许你在多种配置下构建应用程序，包括\
  \ debug（默认）和 release。你可以使用标准工具栏中的解决方案配置下拉菜单在这些配置之间切换。你也可以通过选择 Build 菜单项然后选择 Connection\
  \ Manager（连接管理器）来更改配置。\n\n当你在 debug 配置下构建应用程序并在调试模式下执行它时，发生的情况比单纯执行代码要多得多。debug\
  \ 构建维护了关于应用程序的 `symbolic information`（符号信息），以便 IDE 在执行每行代码时都能确切地知道正在发生什么。符号信息意味着跟踪（例如）未编译代码中使用的变量名称，以便它们可以与编译后的机器代码应用程序中的值相匹配，而机器代码本身不包含此类人类可读的信息。这些信息包含在\
  \ `.pdb` 文件中，你可能在计算机的 `Debug` 目录见过这些文件。\n\n在 release 配置中，应用程序代码经过了优化，你无法执行这些操作。然而，release\
  \ 构建运行得更快；当你完成应用程序的开发后，通常会向用户提供 release 构建，因为它们不需要 debug 构建中包含的符号信息。\n\n本节描述了你可以使用的调试技术，用于识别并修复不符合预期代码区域，这一过程被称为\
  \ `debugging`（调试）。这些技术根据使用方法分为两个部分。通常，调试是通过中断程序执行或记录笔记以便以后分析来进行。在 Visual Studio\
  \ 术语中，应用程序要么正在运行，要么处于 break mode（断点模式），即停止正常执行。你将首先查看非断点模式（运行时或正常）技术。\n\n### 在非断点（正常）模式下调试\n\
  \n你在全书中一直使用的命令之一是 `Console.WriteLine()` 函数，它向控制台输出文本。在开发应用程序时，此函数对于获取操作的额外反馈非常有用：\n\
  \n```\nConsole.WriteLine(\"MyFunc() Function is about to be called.\");\nMyFunc(\"\
  Do something.\");\nConsole.WriteLine(\"MyFunc() Function execution completed.\"\
  );\n```\n\n这段代码段展示了你如何获取有关名为 `MyFunc()` 函数调用的额外信息。这听起来很好，但可能会让你的控制台输出变得杂乱；而且当你开发其他类型的应用程序（如桌面应用程序）时，你没有控制台可以输出信息。作为替代，你可以将文本输出到单独的位置——IDE\
  \ 中的 Output（输出）窗口。\n\n第 2 章 描述了 Error List（错误列表）窗口，提到其他窗口也可以显示在同一个位置。其中 Output 窗口对调试特别有用。要显示此窗口，选择\
  \ `View ➪ Output`。此窗口提供与代码编译和执行相关的信息，包括编译期间遇到的错误。你也可以使用此窗口（如图 7-1 所示），通过直接写入来显示自定义诊断信息。\n\
  \n![输出窗口的截图，选择了调试模式。](img/c07f001.png)\n\n图 7-1\n\n或者，你可能想创建一个日志文件，在应用程序执行时向其追加信息。实现此目的的技术与向输出窗口写入文本相似，尽管该过程需要了解如何访问系统。目前，将该功能放在后考虑，因为在陷入文件访问技术之前，你有很多事情要做。\n\
  \n#### 输出调试信息\n\n在运行时向输出窗口写入文本非常简单。你只需将对 `Console.WriteLine()` 的调用替换为在所需位置写入文本的调用即可。你可以使用两个命令来实现此操作：\n\
  \n* `Debug.WriteLine()`\n* `Trace.WriteLine()`\n\n这两个命令的功能几乎相同，只有一个关键区别——第一个命令仅在\
  \ debug 构建中有效；第二个命令在 release 构建中也有效。事实上，`Debug.WriteLine()` 命令甚至不会不会被编译到 release\
  \ 构建中；它直接消失，这确实有优势。\n\n这些函数的工作方式与 `Console.WriteLine()` 不同。它们只接受单个字符串参数作为输出消息，而不是让你使用\
  \ `{X}` 语法插入变量值。这意味着你必须使用替代技术将变量值嵌入字符串——例如使用 `+` 拼接运算符。你还可以（可选）提供第二个字符串参数，为输出文本提供分类。这能让你一眼看出输出窗口显示了哪些输出消息，当从应用程序的不同位置输出相似的消息时这非常有用。\n\
  \n这些函数的通用输出如下：\n\n\n\n\n\n```\n<category>: <message>\n```\n\n例如，以下语句将 `\"MyFunc\"\
  ` 作为可选的类别参数：\n\n```\nDebug.WriteLine(\"Added 1 to i\", \"MyFunc\");\n```\n\n将产生如下结果：\n\
  \n```\nMyFunc: Added 1 to i\n```\n\n下一个“尝试运行”（Try It Out）将演示如何以这种方式输出调试信息。\n\n##\
  \ 跟踪点 (Tracepoints)\n\n向“输出”窗口写入信息的另一种方法是使用 `tracepoints`。这些是 Visual Studio 的功能，而不是\
  \ C# 的功能，但它们的作用与使用 `Debug.WriteLine()` 相同。从本质上，它们允许你在不修改代码的情况下输出调试信息。\n\n为了演示跟踪点，你可以使用它们来替换上一个示例中的调试命令。（详情请参阅本章可下载代码中的\
  \ `Ch07Ex01TracePoints` 文件。）添加跟踪点的步骤如下：\n\n1.  将光标置于你想要插入跟踪点的行，例如第 31 行。跟踪点在该行代码执行**之前**（before）被处理。\n\
  2.  在行号左侧点击侧边栏，会出现一个红圈。将鼠标指针悬停在代码行旁的红圈上，选择“设置”（Settings）菜单项。\n3.  勾选“操作”（Actions）复选框，并在“记录消息”（Log\
  \ a Message）部分的“消息”（Message）文本框中输入要输出的字符串。如果你想输出变量值，请将变量名括在大括号中。\n4.  点击“确定”。包含跟踪点的代码行左侧红圈变为红菱形，代码本身的高亮显示也会从红色变为白色。\n\
  \n正如添加跟踪点的对话框标题以及其所需的菜单选择所暗示的那样，跟踪点是断点的一种形式（如果需要，它们可以导致应用程序执行暂停，就像断点一样）。在本章稍后的部分，将学习断点，它们通常用于更高级的调试目的。\n\
  \n图 7-4 显示了 `Ch07Ex01TracePoints` 中第 31 行所需的跟踪点，其中行号适用于删除现有的 `Debug.WriteLine()`\
  \ 语句后的代码。\n\n![Ch07Ex01TracePoints 第 31 行所需的跟踪点快照。](img/c07f004.png)\n\n**图 7-4**](#c07.xhtml_R_c07-fig-0004)\n\
  \n你可以使用另一个窗口来快速查看应用程序中的跟踪点。要显示此窗口，从 Visual Studio 菜单中选择 `调试`(Debug) ➪ `窗口`(Windows)\
  \ ➪ `断点`(Breakpoints)。这是一个显示断点的通用窗口（如前所述，跟踪点是断点的一种形式）。你可以通过在此窗口的“列”（Columns）下拉菜单中添加“命中时”（When\
  \ Hit）列，来自定义显示以显示更多特定于跟踪点的信息。图 7-5 显示了配置了该列并向 `Ch07Ex01TracePoints` 添加了所有跟踪点后的显示情况。\n\
  \n![在调试模式下执行应用程序后的结果快照。](img/c07f005.png)\n\n**图 7-5**](#c07.xhtml_R_c07-fig-0005)\n\
  \n在调试模式下执行此应用程序的结果与之前相同。你可以通过在代码窗口中右键点击跟踪点或通过“断点”窗口来删除或临时禁用跟踪点。在“断点”窗口中，跟踪点左侧的复选框指示跟踪点是否启用；被禁用的跟踪点未勾选，并在代码窗口中显示为菱形轮廓，而不是实心菱形。\n\
  \n## 诊断输出与跟踪点\n\n现在你已经看到了了两种输出本质上相同信息的方法，请考虑每种方法的优缺点。首先，跟踪点没有等同于 `Trace` 命令的物；也就是说，无法在发布生成（release\
  \ build）中使用跟踪点来输出信息。这是因为跟踪点没有包含在你的应用程序中。跟踪点由 Visual Studio 处理，因此在应用程序的编译版本中不存在。只有当应用程序在\
  \ Visual Studio 调试器中运行时，你才会看到跟踪点在执行操作。\n\n跟踪点的主要缺点也是它们的主要优势，即它们存储在 Visual Studio\
  \ 中。这使得你能够根据需要快速方便地将它们添加到应用程序中，但也使得它们太容易被删除。删除跟踪点只需点击指示其位置的红菱形，如果你正在输出一段复杂的信息字符串，这可能会令人心恼。\n\
  \n然而，跟踪点的一个额外好处是可以轻松添加附加信息，例如 `$FUNCTION`，它会将当前函数名称添加到输出消息中。虽然使用 `Debug` 和 `Trace`\
  \ 命令编写的代码也可以获取这些信息，但获取起来更为棘手。总之，按以下方式使用这两种输出调试信息的方法：\n\n*   **诊断输出 (Diagnostics\
  \ output)**——当你希望始终从应用程序输出某些调试输出时使用，特别是当你想要输出的字符串很复杂，涉及多个变量或大量信息时。此外，如果你想在发布模式构建的应用程序执行期间获得输出，`Trace`\
  \ 命令通常是唯一的选择。\n*   **跟踪点 (Tracepoints)**——在调试应用程序时使用这些，以快速输出可能帮助你解决语义错误的重要信息。\n\n\
  ## 在断点模式下调试 (Debugging in Break Mode)\n\n本章描述的其余调试技术都在断点模式下工作。这种模式可以通过几种方式进入。\n\n\
  ### 进入断点模式\n\n进入断点模式最简单的方法是在应用程序运行时点击暂停按钮。该按钮位于工具栏上，是 Visual Studio 默认添加的。要这样做，请右键点击工具栏并选择“调试”（Debug）。图\
  \ 7-6 显示了调试工具栏。\n\n![调试工具栏的快照。](img/c07f006.png)\n\n**图 7-6**](#c07.xhtml_R_c07-fig-0006)\n\
  \n工具栏上的前三个按钮允许手动控制。在图 7-6 中，它们是灰色的，因为它们对于没有执行的程序无效。接下来的部分将描述其余按钮。\n\n当应用程序运行时，工具栏会变成像图\
  \ 7-7 那样。\n\n![应用程序运行时工具栏变化的快照。](img/c07f007.png)\n\n**图 7-7**](#c07.xhtml_R_c07-fig-0007)\n\
  \n之前灰色的三个按钮现在允许你执行以下操作：\n\n*   暂停应用程序并进入断点模式。\n*   完全停止应用程序（这不会进入断点模式；只是直接退出）。\n\
  *   重启应用程序。\n\n暂停应用程序可能是进入断点模式最简单的方法，但它没有让你对具体的停止位置进行精细控制。你可能会在应用程序的自然停顿处，例如请求用户输入的地方停止。你可能在长时间的操作或长循环中进入断点模式，但具体的停止点可能是随机的。通常，使用断点要好得多。\n\
  \n### 断点 (Breakpoints)\n\n断点是源代码中的标记，用于触发自动进入断点模式。断点可以配置为执行以下操作：\n\n*   当到达断点时立即进入断点模式。\n\
  *   当到达断点且布尔表达式求值为 `true` 时进入断点模式。\n*   当到达断点达到指定的次数后进入断点模式。\n*   当到达断点且变量值自上次到达该断点以来发生变化时进入断点模式。\n\
  \n这些功能仅在调试生成中可用。如果你编译的是发布生成，所有断点都将被忽略。\n\n\n\n\n\n有几种方法可以添加断点。要添加在到达某行时中断的简单断点，只需点击代码行最左侧即可。或者，你也可以从菜单中选择调试（Debug）➪\
  \ 切换断点（Toggle Breakpoint），或按 `F9`，断点将放置在当前获得焦点的代码上。\n\n断点会以代码行旁边红圈的形式出现，该行会被高亮，如图\
  \ 7-8\n\n`图 7-8`\n\n`Breakpoints`窗口中显示的其他列（`Condition` 条件和`Hit Count` 命中次数）只是可用列中的两个，但它们是最用的。你可以通过右键点击断点并选择`Conditions`来编辑这些内容。展开`Conditions`下拉框将显示以下选项：\n\
  \n*   条件表达式（Conditional Expression）\n*   命中次数（Hit Count）\n*   筛选（Filter）\n\n选择`Conditions`会打开一个对话框，可以在其中输入任何布尔表达式，该表达式可能涉及断点作用范围内的任何变量。例如，你可以通过输入表达式\
  \ `\"maxVal > 4\"` 并选择 `Is true` 选项，配置一个在到达此处且 `maxVal` 的值大于 4 时触发的断点。你还可以检查此表达式的值是否发生了变化，并仅在发生变化时触发断点（例如，如果在两次遇到断点之间\
  \ `maxVal` 从 2 变为 6，你可能会触发它）。\n\n从下拉列表中选择`Hit Count`会打开一个对话框，可以在其中指定断点在触发之前需要被命中多少次。下拉列表提供以下选项：\n\
  \n*   始终中断（Break always）（默认值）\n*   当命中次数等于...时中断\n*   当命中次数是...的倍数时中断\n*   当命中次数大于或等于...时中断\n\
  \n你选择的选项结合选项旁文本框中输入的值，决定了断点的行为。命中次数在长循环中非常有用，例如，你可能希望在运行 5,000 次循环后中断。如果你不能做到这一点，那么中断并重启\
  \ 5,000 次将是痛苦的！\n\n### 进入断点模式的其他方法\n\n进入断点模式还有两种方法。其一是在抛出未处理的异常时进入。该主题将在本章稍后的部分查看错误处理时进行介绍。另一种方法是在生成断言（assertion）时中断。\n\
  \n`Assertions`（断言）是可以用带有一个用户定义的消息来中断应用程序执行的指令。它们通常在应用程序开发期间使用，以测试程序运行是否顺利。例如，在应用程序的某处，你可能要求给定的变量的值小于\
  \ 10。你可以使用断言来确认这一点是否成立，如果不是，则中断程序。当断言发生时，你可以选择 `Abort`（中止），这将终止应用程序；`Retry`（重试），这将进入断点模式；或`Ignore`（忽略），这将使应用程序继续运行。\n\
  \n与之前所示的调试输出函数一样，断言函数有两个版本：\n\n*   `Debug.Assert()`\n*   `Trace.Assert()`\n\n`Debug`\
  \ 类仅编译到调试版本（debug builds）中，而 `Trace` 存在于发布版本（release builds）中。\n\n这些函数接受三个参数。第一个是布尔值，值为\
  \ `false` 会触发断言。第二个和第三个是字符串参数，用于将信息同时写入弹出对话框和 `Output` 窗口。前面的示例需要如下的函数调用：\n\n```\n\
  Debug.Assert(myVar < 10, \"myVar is 10 or greater.\",\n             \"Assertion\
  \ occurred in Main().\");\n```\n\n断言在用户采用应用程序的初始阶段通常有用。你可以分发包含 `Trace.Assert()`\
  \ 函数的应用程序发布版本以监控情况。如果触发了断言，用户将收到通知，此信息可以传递给你。这样你即使不知道故障原因，也可以确定发生了什么问题。\n\n例如，你可以在第一个字符串中提供错误的的简要描述，并在第二个字符串中提供后续操作的指令：\n\
  \n```\nTrace.Assert(myVar < 10, \"Variable out of bounds.\",\n             \"Please\
  \ contact vendor with the error code KCW001.\");\n```\n\n如果发生此断言，用户将看到图 7-9 所示的对话框。\n\
  \n![断言对话框的快照。](img/c07f009.png)\n\n`图 7-9`\n\n\n\n\n\n左下角出现的新窗口对于调试特别有用。它允许你在断点模式（break\
  \ mode）下跟踪应用程序中变量的值：\n\n*   `Autos`（自动）—当前和上一条语句中使用的变量（Ctrl+D, A）\n*   `Locals`（局部）—作用范围内所有的变量（Ctrl+D,\
  \ L）\n*   `Watch N*`（监视）—自定义变量和表达式显示（N 为 1 到 4，可在调试 ➪ Windows ➪ Watch 中找到）\n\n所有这些标签的工作方式大体相同，但根据其特定功能具有不同的附加功能。通常，每个标签包含一个变量列表，以及每个变量的名称、值和类型信息。对于数组等更复杂的变量，可以使用名称左侧的展开/折叠符号进行进一步检查，从而查看内容的树形视图。例如，图\
  \ 7-11](#c07.xhtml_c07-fig-0011) 显示了在示例代码中设置断点后获得的 `Locals` 标签。它显示了其中数组变量 `maxValIndices`\
  \ 的展开视图。\n\n![通过在示例代码中设置断点获取 Locals 标签的快照。](img/c07f011.png)\n\n图 7-11\n\n你还可以从此视图编辑变量的内容。这有效地绕过了早期代码中可能发生的任何变量赋值。要执行此操作，只需在你想要编辑的变量的\
  \ Value（值）列中输入新值。例如，你可以这样做来尝试某些不需要更改代码即可实现的场景。\n\n`Watch` 窗口允许你监控特定变量或涉及特定变量的表达式。要使用此窗口，在\
  \ Name（名称）列中输入变量或表达式名称并查看结果。注意，应用程序中的所有变量并非一直处于作用范围内，它们在 `Watch` 窗口会被标记为如此。例如，图\
  \ 7-12](#c07.xhtml_c07-fig-0012) 显示了一个包含几个示例变量和表达式的 `Watch` 窗口，这是在到达 `Maxima()`\
  \ 函数结束之前的断点时获得的。\n\n![包含几个示例变量和表达式的 Watch 窗口快照。](img/c07f012.png)\n\n图 7-12\n\n\
  `testArray` 数组是 `Main()` 局部的，因此你在这里看不到它的值，它是灰色的。\n\n### 单步执行代码\n\n到目前为止，你已经学习了如何在进入断点模式时发现应用程序中发生了什么。现在是时候如何使用\
  \ IDE 在保持断点模式的同时单步执行代码了，这让你看到代码执行的准确结果。对于我们这些思考速度跟不上计算机的人来说，这是一种非常有价值的技巧。\n\n当 Visual\
  \ Studio 进入断点模式时，黄色箭头光标会出现在代码视图的左侧（如果使用断点进入断点模式，它最初可能会出现在断点的红圈内），位于即将执行的代码行旁边，如图\
  \ 7-13](#c07.xhtml_c07-fig-0013) 所示。\n\n![即将执行的代码行左侧黄色箭头光标的快照。](img/c07f013.png)\n\
  \n图 7-13\n\n这显示了进入断点模式时执行到达了哪个点。在此处，你可以逐行执行程序。要实现这一点，你可以使用图 7-14](#c07.xhtml_c07-fig-0014)\
  \ 所示的一些调试工具栏按钮。\n\n![调试工具栏按钮的快照。](img/c07f014.png)\n\n图 7-14\n\n第六、第七和第八个图标控制断点模式下的程序流。按顺序排列如下：\n\
  \n*   `Step Into`（单步调）—执行并移动到下一条要执行的语句。\n*   `Step Over`（单步跳）—与 Step Into 类似，但不会进入包括函数在内的嵌套代码块。\n\
  *   `Step Out`（单步跳）—运行到代码块结束，并在随后的语句处恢复断点模式。\n\n要查看应用程序执行的每项操作，你可以使用 `Step Into`\
  \ 按顺序跟踪指令。这包括进入函数内部，例如前一个示例中的 `Maxima()`。当光标到达第 16 行（即调用 `Maxima()` 的行）时点击此图标，光标将移动到\
  \ `Maxima()` 函数内部的第一行。或者，当到达第 16 行时点击 `Step Over`，光标将直接移动到第 17 行，而不通过 `Maxima()`\
  \ 中的代码（尽管这些代码仍会被执行）。如果你单步进入了一个感兴趣感兴趣函数，可以点击 `Step Out` 返回到调用该函数的代码。在单步执行代码时，变量的值可能会发生。如果你关注刚才讨论的监控窗口，可以清楚地看到这种情况。\n\
  \n你还可以通过右键点击代码行来更改将执行哪行代码。\n\n### Immediate 和 Command 窗口\n\n`Immediate`（立即）和 `Command`（命令）窗口（位于调试菜单）允许你在应用程序运行时执行命令。`Command`\
  \ 窗口允许你执行操作（如菜单操作），而 `Immediate` 窗口允许你执行代码之外的其他代码。\n\n这两个窗口是内在关联的。你甚至可以通过输入 `immed`\
  \ 从 Command 窗口切换到 Immediate 窗口，输入 `cmd` 返回。\n\n本节重点介绍 `Immediate` 窗口，因为 `Command`\
  \ 窗口主要用于复杂操作。`Immediate` 窗口最简单的用法是评估表达式，有点类似于 `Watch` 窗口的一次性使用。要执行此操作，输入表达式并按回车。然后将显示请求的信息。示例见图\
  \ 7-15](#c07.xhtml_c07-fig-0015)。\n\n![在 Immediate 窗口中输入表达式的快照。](img/c07f015.png)\n\
  \n图 7-15\n\n你也可以在此更改变量的内容，如图 7-16](#c07.xhtml_c07-fig-0016) 所示。\n\n![在 Immediate\
  \ 窗口中更改变量内容的快照。](img/c07f016.png)\n\n图 7-16\n\n大多数情况下，使用之前显示的变量监控窗口更容易实现你想要的效果，但这种技术对于调整值仍然很有用。\n\
  \n### Call Stack 窗口\n\n最后一个查看的窗口是 `Call Stack`（调用栈）窗口，它显示了程序到达当前位置的路径。简单来说，它显示了当前函数以及调用它的函数、调用该函数的函数，以此此类推（即嵌套函数调用的列表）。调用发生的确切点也被记录下来。\n\
  \n在之前的示例中，在 `Maxima()` 中进入断点模式，或通过代码单步进入此函数时，会显示图 7-17](#c07.xhtml_c07-fig-0017)\
  \ 所示的信息。\n\n\n\n\n\n![调用堆栈窗口截图。](img/c07f017.png)\n\n**图 7-17**\n\n如果你双击某条目，将把你带到相应的位置，让你能够跟踪代码执行到达当前地点的路径。此窗口在首次检测错误时特别有用，因为你可以看到错误发生前立即发生了什么。当错误发生在常用函数中时，这可以帮助你确定源的源头。\n\
  \n## 错误处理\n\n本章的第一部分解释了如何在应用程序开发过程中查找并纠正错误，以便它们不会出现在发布级代码中。然而，有时你明知错误可能会发生，并且无法\
  \ 100% 确定它们不会发生。在这些情况下，最好是预见到问题，并编写足够健壮的代码来以优雅的方式处理这些错误，而不中断执行。\n\n`Error handling`（错误处理）是此类所有技术的术语，本节将介绍异常以及你如何处理它们。异常（exception）是在你的代码或你的代码调用的函数在运行时生成的错误。这里对“错误”的定义比之前的更为模糊，因为异常可能是手动生成的、在函数中生成的等。例如，如果一个函数的某个字符串参数不以字母“a”开头，你可能在那个函数中生成一个异常。严格来说，这在函数上下文之外并不算是一个错误，尽管调用该函数的代码将其视为错误。\n\
  \n你已经在书中看到过几次异常了。也许最简单的例子是尝试访问超出范围的数组元素：\n\n```\nint[] myArray = { 1, 2, 3, 4 };\n\
  int myElem = myArray[4];\n```\n\n这会输出以下异常消息，然后终止应用程序：\n\n```\nIndex was outside\
  \ the bounds of the array.\n```\n\n异常定义在命名空间中，且大多数异常的名称都能清楚地表示其用途。在这个示例中，生成的异常被称为\
  \ `System.IndexOutOfRangeException`，这是合理的，因为你提供的索引不在 `myArray` 允许的索引范围之内。只有当异常未被处理时，此消息才会出现，应用程序才会终止。在下一节中，你将确切看到为了处理异常你必须做哪些工作。\n\
  \n### try…catch…finally\n\nC# 语言包含了 `structured exception handling`（结构化异常处理，简称 SEH）的语法。三个关键字标记代码能够处理异常，并附带指定发生异常时该做什么的指令：`try`、`catch`\
  \ 和 `finally`。这些每个关键字都有一个关联的代码块，并且必须在连续的代码行中使用。其基本结构如下：\n\n```\ntry\n{\n   …\n}\n\
  catch (<exceptionType> e) when (<filterIsTrue>)\n{\n   await <methodName(e);> \n\
  \   …\n}\nfinally\n{\n   await <methodName;>\n   …\n}\n```\n\n`await` 关键字用于支持高级异步编程技术，这些技术可以避免瓶颈并提高应用程序的整体性能和响应能力。本书没有讨论利用\
  \ `async` 和 `await` 关键字的异步编程；尽管如此，由于这些关键字简化了这种编程技术的实现，强烈建议学习它们。\n\n然而，也可以有一个没有 `catch`\
  \ 块的 `try`块和`finally`块，或者带有多个 `catch` 块的 `try`块。如果存在一个或多个 `catch` 块，则 `finally`\
  \ 块是可选的；否则，它是强制性的。这些块的用法如下：\n\n* `try`——包含可能抛出异常的代码（``throw` 是 C# 在讨论异常时表示“生成”或“引起”的说法）。\n\
  * `catch`——包含在抛出异常时执行的代码。`catch` 块只能使用 `<exceptionType>` 响应特定的异常类型（如 `System.IndexOutOfRangeException`），因此具有提供多个\
  \ `catch` 块的能力。也可以完全省略此参数，以获得一个响应所有异常的通用 `catch` 块。C# 6 引入了名为 `exception filtering`（异常过滤）的概念，通过在异常类型表达式后添加\
  \ `when` 关键字来实现。只有当该异常类型发生且过滤表达式为真时，`catch` 块中的代码才会执行。\n* `finally`——包含始终执行的代码，要么在未发生异常后在\
  \ `try` 块之后执行，要么在异常被处理后在 `catch` 块之后执行，或者在未处理的异常移动“调用堆栈上方”之前执行。这个短语意味着 SEH 允许你将\
  \ `try…catch…finally` 块嵌套在一起，无论是直接嵌套，还是由于在 `try` 块中调用了函数。例如，如果异常没有被调用函数中的任何 `catch`\
  \ 块处理，它可能会由调用代码中的 `catch` 块处理。最终，如果没有匹配到任何 `catch` 块，应用程序将终止。`finally` 块在此发生之前被处理，这一事实就是它存在的原因；否则，你大可以将代码放在\
  \ `try…catch…finally` 结构之外。\n\n以下是 `try` 块中的代码发生异常后所发生的事件序列，如图 7-18 所示：\n\n* `try`\
  \ 块在发生异常点终止。\n* 如果存在 `catch` 块，则对抛出的异常类型进行检查。\n* 如果 `catch` 块匹配异常类型且异常过滤器结果为 `true`，则执行其中的代码，然后执行\
  \ `finally` 块。\n* 如果 `catch` 块匹配异常类型且没有异常过滤器，则执行其包含的代码，然后执行 `finally` 块。\n* 如果没有匹配的\
  \ `catch` 块，则应用程序终止。\n\n下面的 Try Out（尝试输出）展示了在 `try` 块代码中发生异常后的情况，并展示了多种处理异常的方式。\n\
  \n![展示处理异常的流程图。](img/c07f018.png)\n\n**图 7-18**\n\n### Throw 表达式\n\n在之前的 Try Out\
  \ 中，`throw` 仅用于程序操作的代码语句。你也可以像这里在表达式中使用 `throw`：\n\n```\nfriend ?? throw new ArgumentNullException(paraName:\
  \ nameof(friend), message: \"null\")\n```\n\n此代码段使用合并运算符来检查赋值的值是否为 `null`。如果是 `null`，则抛出\
  \ `ArgumentNullException`。如果值不是 `null`，则将值赋值给变量。\n\n### 列出和配置异常\n\n.NET Framework\
  \ 包含了大量的异常类型，你可以在自己的代码中自由地抛出并处理任何异常。IDE 提供了一个对话框用于查看和编辑可用异常，可以通过 Debug ➪ Windows\
  \ ➪ Exception Settings 菜单项（或按 Ctrl+Alt+E）调用。图 7-20 显示了异常设置对话框。\n\n![异常设置对话框截图。](img/c07f020.png)\n\
  \n**图 7-20**\n\n异常按类别和 .NET 库命名空间列出。你可以通过展开 Common Language Runtime Exceptions 箭头符号查看\
  \ `System` 命名空间中的异常。列表包含了你之前使用的 `System.IndexOutOfRangeException` 异常。\n\n\n\n\n\
  每个异常都可以通过异常类型旁边的选择框进行配置。勾选后，调试器会在异常被 `Thrown`（抛出）时中断，导致即使对于已处理的异常，也会进入调试器状态。\n\n\
  ### 练习题\n\n1. **7.1** “使用 `Trace.WriteLine()` 比使用 `Debug.WriteLine()` 更好，因为 `Debug`\
  \ 版本仅在调试构建中有效。”你同意这个说法吗？如果，为什么？\n\n2. **7.2** 为一个简单的应用程序编写代码，包含一个循环，该循环在 5,000 次循环后产生一个错误。使用断点在第\
  \ 5,000 次循环产生错误之前的瞬间进入中断模式。（注意：产生错误的一种简单方法是尝试访问不存在的数组元素，例如在一个有 100 个元素的数组中尝试访问 `myArray[1000]`。）\n\
  \n3. **7.3** “`finally` 代码块仅在 `catch` 块未执行时才会执行。”正确还是错误？\n\n4. **7.4** 给定在代码中定义的枚举类型\
  \ `orientation`，编写一个应用程序，使用结构化异常处理 (SEH) 以安全的方式将 `byte` 类型的变量转换为 `orientation` 类型的变量。（注意：你可以使用\
  \ `checked` 关键字强制抛出异常，此处显示了一个示例。你的应用程序应该使用此代码。）\n\n```\nenum Orientation : byte\n\
  {\n   North = 1,\n   South = 2,\n   East  = 3,\n   West  = 4\n}\nmyDirection = checked((Orientation)myByte);\n\
  ```\n\n这些练习题的答案可以在附录找到。\n\n## 本章学到的知识\n\n| 主题 | 核心概念 |\n| --- | --- |\n| 错误类型 |\
  \ 致命错误会导致你的应用程序完全失败，无论是在编译时（语法错误）还是在运行时。语义错误或逻辑错误更具隐蔽性，可能导致你的应用程序运行不正常或不可预测。 |\n\
  | 输出调试信息 | 你可以编写代码向 `Output`（输出）输出有用信息，以辅助 IDE 中的调试。你通过 `Debug` 和 `Trace` 族函数来实现这一点，其中\
  \ `Debug` 函数在发布构建中会被忽略。对于生产应用程序，你可能希望将调试输出写入日志文件。你还可以使用跟踪点（tracepoints）来输出调试信息。\
  \ |\n| 中断模式 | 你可以手动进入中断模式（本质上是应用程序暂停的状态）、通过断点、断言或当发生未处理的异常时进入。你可以在代码的任何地方添加断点，并配置断点仅在特定条件下中断执行。在处于模式模式下，你可以检查变量的内容（借助各种调试信息窗口）并逐行执行代码，以帮助你确定错误所在的位置。\
  \ |\n| 异常 | 异常是运行时发生的错误，你可以通过程序对其进行捕获和处理，以防止应用程序终止。在调用函数或操作变量时会发生许多类型的异常。你还可以使用\
  \ `throw` 关键字生成异常。 |\n| 异常处理 | 代码中未处理的异常将导致应用程序终止。你使用 `try`、`catch` 和 `finally`\
  \ 代码块来处理异常。`try` 块标记了启用异常处理的代码区域。`catch` 块包含仅在发生异常时执行的代码，并可以匹配特定类型的异常。你可以包含多个 `catch`\
  \ 块。`finally` 块指定了在异常处理之后（或在未发生异常且 `try` 块完成之后）执行的代码。你可以只包含一个 `finally` 块，而且如果你包含了任何\
  \ `catch` 块，则 `finally` 块是可选的。 |\n\n# 8 面向对象简介\n\n### 本章代码下载\n\n本章的代码下载可以在书籍页面 [`www.wiley.com`](http://www.wiley.com)\
  \ 找到。点击 Downloads 链接。代码也可以在 [`github.com/benperk/BeginningCSharpAndDotNET`](http://github.com/benperk/BeginningCSharpAndDotNET)\
  \ 找到。代码位于 `Chapter08` 文件夹中，并根据章节中的名称单独命名。\n\n此时，你已经涵盖了 C# 语法和编程的所有基础，并学会了如何调试你的应用程序。你已经可以组装可用的控制台应用程序。然而，要访问\
  \ C# 语言和 .NET 的真正力量，你需要利用面向对象编程 (OOP) 技术。事实上，正如你很快看到的，你一直在使用这些技术了，尽管为了简单起见我们之前没有关注这一点。\n\
  \n本章暂时避开代码，而是关注 OOP 背后的原理。这引导你回到 C# 语言，因为它与 OOP 具有共生关系。本章介绍的所有概念将在后面的章节中回顾，并配有说明性代码——所以如果你在第一次阅读这些材料时没有理解所有内容，不要恐慌。\n\
  \n首先，你将学习 OOP 的基础，包括回答那个最基本的问题：“什么是对象？”你会很快发现，许多与 OOP 相关的术语起初可能会让人困惑，但书中提供了大量的解释。你还会发现，使用\
  \ OOP 要求你以不同的方式看待编程。\n\n在讨论 OOP 通用原理的同时，本章还查看了一个需要彻底理解 OOP 的领域：桌面应用程序。这类应用程序依赖于\
  \ Windows 环境，具有菜单、按钮等功能。因此，它提供了大量的描述空间，你将能够在 Windows 环境中有效地观察 OOP 的点。\n\n## 什么是面向对象编程？\n\
  \n面向对象编程旨在解决传统编程技术中的许多问题。你到为止看到的编程类型被称为过程式编程，它通常会导致单体应用程序，意味着所有功能都包含在少数代码模块中。使用\
  \ OOP 技术，你通常会使用更多的代码模块，每个模块提供特定的功能。此外，每个模块可以是相互隔离的甚至是独立的。这种模块化的编程方法赋予了你更大的灵活性，并提供了更多的代码重用机会。\n\
  \n为了进一步说明这一点，想象一下你计算机上的一个高性能应用程序是一辆顶配赛车。用传统编程技术编写的这辆运动跑基本上是一个单一单元。如果你想改进这辆车，你就必须更换整个单元，将其送回厂家让他们的专家技师进行升级，或者买一辆新的。然而，如果使用了\
  \ OOP 技术，你只需要从厂家那里购买一个新引擎并按照他们的说明自行更换，而不是对车身进行锯锯切割。\n\n\n\n\n使用 OOP（面向对象编程），事情很少是如此线性的。尽管实现了相同的结果，但实现目标的方法往往完全不同。OOP\
  \ 技术根根于数据的结构和含义，以及这些数据与其他数据之间的交互。这通常意味着在项目设计阶段需要投入更多精力，但它具有扩展性的用处。一旦对特定类型的数据表示达成共识，这种共识就可以被应用于应用程序的后续版本中，甚至是完全全新的应用程序中。这种共识的存在可以极大地缩短开发时间。这解释了赛车示例是如何运作的。这里的共识是“引擎”代码的结构方式，使得新代码（用于新引擎的代码）可以轻松地替换，而无需返回制造商处。这也意味着引擎一旦被创建，就可以用于其他用途。例如，你可以把它放在不同的汽车中，或者用它来驱动潜艇。\n\
  \nOOP 经常通过对数据表示方法以及更抽象实体的结构和用法提供共识，从而简化问题。例如，可以不仅就发送到打印机等设备上的输出的数据格式达成共识，还可以就与该设备进行数据交换的方法达成共识，包括它理解的指令等。在赛车的类比中，这种共识将包括引擎如何连接燃料箱、它如何将驱动力传递给轮子等。\n\
  \n正如这项技术的名称所暗示的那样，这是通过使用对象实现的。\n\n## 什么是对象？\n\n`object`（对象）是 OOP 程序的构建单元。这个构建单元封装了应用程序的一部分，它可以是一个进程、一段数据，或一个更抽象的实体。\n\
  \n从最简单的意义上说，对象可以类似于书中之前所示的 `struct`（结构体）类型，包含变量和函数类型的成员。包含的变量组成了存储在对象中的数据，包含的函数允许访问对象的功能。稍微复杂的对象可能不维护任何数据；相反，它们可以通过仅包含函数来表示一个过程。例如，可以使用一个代表打印机的对象，它将拥有能够控制打印机的函数（因此你可以打印文档、测试页等）。\n\
  \nC# 中的对象是根据类型（types）创建的，就像你已经看到的变量一样。对象的类型在 OOP 中有一个特殊的名称，即它的 `class`（类）。你可以使用类定义来\
  \ `instantiate`（实例化）对象，这意味着创建一个类的真实的、具名的 `instance`（实例）。在这里，`instance of a class`（类的实例）和\
  \ `object`（对象）的意思是相同的；但 `class` 和 `object` 的含义有着本质区别。\n\n在本章中，你将使用 `Unified Modeling\
  \ Language`（UML，统一建模语言）语法处理类和对象。UML 设计用于应用程序建模，从构建它的对象到它们执行的操作，再到预期的用例。在这里，你只使用这种语言的基础知识，我们将在过程中对其进行解释。UML\
  \ 是一门专门的学科，有整本书都在介绍它，因此这里不涵盖其更复杂的方面。\n\n图 8-1 显示了你的打印机类 `Printer` 的 UML 表示。类名显示在框的顶部区域（你稍后会学习底部的两个部分）。\n\
  \n![打印机类 UML 表示快照，标记为 Printer。](img/c08f001.png)\n\n**图 8-1**](#c08.xhtml_R_c08-fig-0001)\n\
  \n图 8-2 显示了该 `Printer` 类实例 `myPrinter` 的 UML 表示。\n\n![Printer 类实例 UML 表示快照，标记为 myPrinter。](img/c08f002.png)\n\
  \n**图 8-2**](#c08.xhtml_R_c08-fig-0002)\n\n在这里，实例名首先显示在顶部，随后是它的类名。两个名称之间用冒号分隔。\n\
  \n## 属性和字段\n\n属性（Properties）和字段（Fields）提供了对对象包含数据的访问。这些对象数据区分了不同的对象，因为同一类的不同对象可以在属性和字段中存储不同的值。\n\
  \n对象中包含的各种数据共同组成了该对象的 `state`（状态）。想象一个代表咖啡杯的对象类，命名为 `CupOfCoffee`。当你实例化这个类（即创建该类的对象）时，你必须为它提供一个状态它才有意义。在这种情况下，你可能使用属性和字段来允许使用该对象的代码设置咖啡的类型、咖啡是否含有牛奶和/或糖、咖啡是否是速溶咖啡等。一个特定的咖啡杯对象将具有特定的状态，例如“带牛奶和两块糖的哥伦比亚过滤咖啡”。\n\
  \n字段和属性都是有类型的，因此你可以在它们中存储 `string` 值、`int` 值等信息。然而，属性与字段的区别在于，它们不提供对数据的直接访问。对象可以保护用户免受其数据细节的影响，这些细节不需要在现有属性中以一一对应的方式表示。如果你使用一个字段来表示\
  \ `CupOfCoffee` 实例中糖的量，那么用户可以在字段中放置任何他们喜欢的值，仅受限于存储此信息的类型的限制。例如，如果你使用一个 `int` 来存储这些数据，那么用户可以使用从\
  \ -2147483648 到 2147483647 之间的任何值（显然，并不是所有值都是合理的，特别是负值，某些巨大的正值可能是不需要的）。如果你使用属性来处理此信息，你可以将该值限制在\
  \ 0 到 2 之间。\n\n通常情况下，提供属性比提供字段更好，因为你对各种行为有更多的控制。这种选择不会影响使用对象的代码，因为使用属性和字段的语法是相同的。\n\
  \n属性的读写访问也可以由对象清晰定义。某些属性可以是只读的，允许你查看它们但不能更改它们。这对于同时读取多个状态通常是一种非常有用的技术。你可能为 `CupOfCoffee`\
  \ 类有一个只读属性命名为 `Description`，在请求时返回代表实例状态的字符串（例如之前的字符串）。你可能可以通过查询多个属性来组合相同的数据，但这样的属性可以节省你的精力和精力。你可能还有以类似方式运行的写属性。\n\
  \n除了属性的读写访问外，你还可以为字段和属性指定不同的访问权限，称为 `accessibility`（可访问性）。可访问性决定了哪些代码可以访问这些成员——即是对所有代码可见（public）、仅对类内部代码可见（private），还是应该使用更复杂的方案（在章节后面合适时详细介绍）。一种常见的做法是将字段设为私有，并通过公共属性对其访问。这意味着类内部代码可以直接访问存储在字段中的数据，而公共属性则保护外部用户不受影响并防止他们向其中放置无效内容。公共成员被认为是类\
  \ `exposed`（暴露）。\n\n可视化这一点的一种方法将其与变量的作用范围等同。例如，私有字段和属性可以被认为是所属对象的局部的，而公共字段和属性的作用范围也涵盖了对象外部的代码。\n\
  \n\n\n\n在类的 UML 表示中，你使用第二个部分来显示属性和字段，如图 8-3 所示。\n\n![CupOfCoffee 类 UML 表示的快照，包含五个成员属性或字段。](img/c08f003.png)\n\
  \n图 8-3\n\n这是 `CupOfCoffee` 类的表示，其中如前面讨论的那样，定义了五个成员（属性或字段，因为 UML 中不区分这两者）。每个条目都包含以下信息：\n\
  \n*   访问性——使用 `+` 符号表示公共成员，使用 `−` 符号表示私有成员。通常，本章的图表中不显示私有成员，因为这些信息是类的内部的。没有提供关于读/写访问的任何信息。\n\
  *   成员名。\n*   成员类型。\n\n使用冒号 `:` 分隔成员名和类型。\n\n### 方法\n\n`Method` 是用于指代对象暴露函数的术语。它们的调用方式与任何其他函数相同，并且可以以相同的方式使用返回值和参数——你在第\
  \ 6 章中详细查看过函数。\n\n方法用于提供对对象功能的访问。像字段和属性一样，它们可以是公共的，也可以是私有的，根据需要限制外部代码的访问。它们通常利用对象的状态来影响其操作，并在需要时可以访问私有成员（如私有字段）。例如，`CupOfCoffee`\
  \ 类可能会定义一个名为 `AddSugar()` 的方法，与设置相应的 `Sugar` 属性相比，该方法为增加糖量提供了更具可读性的语法。\n\n在 UML\
  \ 中，类框的第三部分显示方法，如图 8-4 所示。\n\n![CupOfCoffee 类 UML 表示的快照，包含五个成员属性或字段。类框在第三部分显示方法。](img/c08f004.png)\n\
  \n图 8-4\n\n这里的语法与字段和属性的语法类似，不同在于最后显示的类型是返回值，并且显示了方法参数。每个参数在 UML 中用以下标识符之一显示：`return`、`in`、`out`\
  \ 或 `inout`。这些被用于指示数据流的方向，其中 `out` 和 `inout` 大致对应于第 6 章中描述的 C# 关键字 `out` 和 `ref`。`in`\
  \ 大致对应于 C# 的默认行为，即既不使用 `out` 不使用 `ref`，而 `return` 表示将值返回给调用方法。\n\n### 万物皆对象\n\n\
  到这里，是时候说明真相了：在整本书中你一直在使用对象、属性和方法。事实上，C# 和 .NET 中的一切都是对象！控制台应用程序中的 `Main()` 函数是一个类的方法。你查看过的每个变量类型都是一个类。你使用过的每个命令都有一个属性或方法，例如\
  \ `<String>.Length`、`<String>.ToUpper()` 等。（这里的句号字符将对象实例名与属性或方法名隔开，方法在末尾显示有 `()`\
  \ 以区分区别于属性。）\n\n对象确实无处不在，使用它们的语法通常非常简单。到目前为止，它显然足够简单，让你专注于 C# 的一些更基础的方面。从现在开始，你将开始详细观察对象。请记住，这里引入的概念具有深远的影响。\n\
  \n### 对象的生命周期\n\n每个对象都有定义的生命周期。除了初始化之外，它包括两个重要阶段：\n\n*   **构造**——当对象首次实例化时，需要进行初始化。这通常是由构造函数执行的，被称为**构造函数**。\n\
  *   **析构**——当对象被销毁时，通常需要执行清理工作。这是由析构方法执行的，被称为**析构**。\n\n### 构造函数\n\n构造函数用于初始化对象。通常，你不需要为析构方法提供代码；相反，默认操作会为你完成工作。但是，如果对象实例被删除之前需要执行某些操作，你可以提供特定的指令。\n\
  \n构造函数像字段、属性和方法一样，可以是公共或私有的。类定义通常包含一个**默认构造函数**。也可以带有参数的**非默认构造函数**。\n\n在 C# 中，构造函数通过\
  \ `new` 关键字调用。例如，你可以使用其**默认构造函数**来实例化 `CupOfCoffee`：\n\n```sharp\nCupOfCoffee myCup\
  \ = new CupOfCoffee();\n```\n\n对象也可以通过**非默认构造函数**进行实例化。例如，`CupOfCoffee` 类可能有一个带有参数的非默认构造函数：\n\
  \n```csharp\nCupOfCoffee myCup = new CupOfCoffee(\"Blue Mountain\");\n```\n\n构造函数可以是公共或私有的。某些类没有公共构造函数，这意味着外部代码无法通过构造函数来实例化它们（它们被称为**不可实例化的**）。然而，这并不意味着它们完全没用，你很快就会看到。\n\
  \n### 析构函数\n\n析构函数用于 .NET 清理对象。通常，你不需要为**析构方法**提供代码；默认操作会自动完成工作。但是，如果在对象被删除之前需要执行某些操作，你可以提供特定的指令。\n\
  \n例如，当变量超出作用范围时，它可能无法从代码中访问；但它可能仍然存在于计算机的某处。只有当 .NET 运行时执行垃圾回收时，实例才会被完全销毁。\n\n###\
  \ 静态和实例类成员\n\n除了特定实例的属性、方法和字段外，还可能拥有**静态**（对于我们的 Visual Basic 兄弟来说称为 `shared`）成员，这些可以是方法、属性或字段。静态成员在类的实例之间共享，因此它们可以被认为是类的全局变量。静态属性和字段允许你访问与任何实例无关的数据，静态方法允许你执行与类类型相关但与特定对象实例相关的命令。事实上，在使用静态成员时，你甚至不需要实例化。\n\
  \n\n\n\n\n在许多此类情况下，静态属性和方法可以发挥很好的作用。例如，你可能会使用静态属性来跟踪创建了多少个该类的实例。在 UML 语法中，类的静态成员以下划线形式显示，如图\
  \ 8-5 所示。\n\n![UML 语法快照，类的静态成员以下划线形式显示。](img/c08f005.png)\n\n`图 8-5`\n\n### 静态构造函数\n\
  \n在类中使用静态成员时，你可能希望预先初始化这些成员。你可以在声明时为静态成员提供初始值，但有时你可能想要执行更复杂的初始化，或者在赋值值或允许静态方法执行之前执行某些操作。\n\
  \n你可以使用静态构造函数来执行此类初始化初始化任务。一个类可以有一个静态构造函数，它不能有任何访问修饰符且不能有任何参数。静态构造函数永远无法被直接调用；相反，它会在发生以下情况之一时执行：\n\
  \n*   创建包含静态构造函数的类实例。\n*   访问了包含静态构造函数的类的静态成员。\n\n在这两种情况下，静态构造函数都会在类实例化或访问静态成员之前首先调用。无论创建了多少个类实例，它的静态构造函数只会被调用一次。为了区分静态构造函数和本章前面描述的构造函数，所有非静态构造函数也被称为*实例构造函数*。\n\
  \n### 静态类\n\n通常，你可能希望使用仅包含静态成员且不能用于实例化对象的类（例如 `Console`）。实现此目的的一种简便方法，而不是将类的构造函数设为私有，而是使用*静态类*。静态类只能包含静态成员且不能有实例构造函数，因为从隐含意义上，它永远无法被实例化。然而，静态类可以拥有静态构造函数，如前一节所述。\n\
  \n## OOP 技巧\n\n现在你已经了解了基础知识，以及对象是什么以及它们如何工作，你可以花些时间查看对象的其他特性。本节涵盖了以下所有内容：\n\n* \
  \  接口\n*   继承\n*   多态\n*   对象之间的关系\n*   运算符重载\n*   事件\n*   引用类型与值类型\n\n### 接口\n\n\
  *接口*是公共实例（即非静态）方法和属性的集合，它们组合在一起以封装特定的功能。在定义接口后，你可以在类中实现它。这意味着该类随后将支持接口指定的所有属性和成员。\n\
  \n接口不能独立存在。你不能像实例化类那样“实例化接口”。此外，接口不能包含任何实现其成员的代码；它只是定义了成员。实现必须来自实现该接口的类。\n\n在较早的咖啡示例中，你可能会将许多更通用的属性和方法分组到接口中，例如\
  \ `AddSugar()`、`Milk`、`Sugar` 和 `Instant`。你可以将此接口命名为类似 `IHotDrink`（接口名称通常以大写字母 `I`\
  \ 开头）。你可以在其他对象上使用此接口，可能是 `CupOfTea` 类的对象。因此，你可以以类似的方式处理这些对象，它们仍然可以拥有自己的独立属性（例如，`CupOfCoffee`\
  \ 的 `BeanType` 和 `CupOfTea` 的 `LeafType`）。\n\nUML 中在对象上实现的接口使用*棒棒糖*语法（连接到圆圈的线）显示。在图\
  \ 8-6 中，`IHotDrink` 的成员使用类语法拆分到单独框中。\n\n![棒棒糖语法快照，其中 IHotDrink 的成员使用类语法被拆分到单独框中。](img/c08f006.png)\n\
  \n`图 8-6`\n\n一个类可以支持多个接口，多个类也可以支持同一个接口。因此，接口的概念让用户和其他开发人员的生活变得更容易。例如，你可能有一些代码使用了具有特定接口的对象。只要你不使用该对象的其他属性和方法，就有可能将一个对象替换为另一个（例如，之前所示使用\
  \ `IHotDrink` 接口的代码可以同时与 `CupOfCoffee` 和 `CupOfTea` 实例工作）。此外，对象本身的开发人员可以为你提供对象的更新版本，只要它支持已使用的接口，在你的代码中使用此新版本就是很容易的。\n\
  \n一旦接口发布——也就是说它已对其他开发人员或最终用户可用——那么不更改它是一个良好做法。考虑这种问题的一种方法是将接口想象成类创建者和类消费者之间的合同。你实际上是在说：“每个支持接口\
  \ `X` 的类都支持这些方法和属性。”如果接口以后更改（可能是由于底层代码的升级），这可能会导致该接口的消费者运行错误，甚至失败。相反，你应该创建一个扩展旧接口的新接口，可能还包含一个版本号，例如\
  \ `X2`。这已成为处理此类问题的标准方法，你可能会遇到带编号的接口。\n\n### 可销毁对象\n\n一个特别感兴趣的接口是 `IDisposable`。支持\
  \ `IDisposable` 接口的对象必须实现 `Dispose()` 方法——也就是说，它必须为该方法提供代码。可以在对象不再需要时调用此方法（例如在它超出作用范围之前），并应用于释放可能留到垃圾回收期间析构方法调用时才会释放的关键资源。这让你对对象使用的资源有更多控制。\n\
  \nC# 允许你使用一种极佳利用该方法的结构。`using` 关键字允许你在代码块中初始化使用关键资源的对象，在代码块结束时会自动调用 `Dispose()`：\n\
  \n```\n<ClassName> <VariableName> = new <ClassName>();\n…\nusing (<VariableName>)\n\
  {\n   …\n}\n```\n\n或者，你可以在 `using` 语句中实例化对象 `<VariableName>`：\n\n```\nusing (<ClassName>\
  \ <VariableName> = new <ClassName>())\n{\n   …\n}\n```\n\n在这两种情况下，变量 `<VariableName>`\
  \ 在 `using` 代码块内都是可用的，并在结束时自动销毁（即在代码块执行完毕时调用 `Dispose()`）。\n\n### 继承\n\n*继承*是 OOP\
  \ 最重要的特性之一。任何类都可以继承另一个类，这意味着它将拥有其所自自类的所有成员。在 OOP 术语中，被继承的类（*派生*自）被称为*父类*（也称为*基类*）。C#\
  \ 中的类可以直接派生自单个基类，尽管该该基类当然可以有它自己的基类，依此类推。\n\n\n\n\n继承允许你从单一的、更通用的基类扩展或创建更具体的类。例如，考虑一个代表农场动物的类（正如\
  \ 80 岁的老开发者老农麦当纳在他的牲畜应用程序中使用的那样）。该类可能命名为 `Animal`，并拥有如 `EatFood()` 或 `Breed()` 等方法。你可以创建一个名为\
  \ `Cow` 的派生类，它支持所有这些方法，但可能还会提供自己的方法，如 `Moo()` 和 `SupplyMilk()`。你还可以创建另一个派生类 `Chicken`，它拥有\
  \ `Cluck()` 和 `LayEgg()` 方法。\n\n在 UML 中，你使用箭头表示继承，如图 8-7 所示。\n\n![UML 表示快照，使用箭头表示继承。](img/c08f007.png)\n\
  \n图 8-7\n\n当使用基类继承时，成员的可访问性问题变成了一个重要问题。基类的私有成员在派生类中不可访问，但公共成员是可以访问的。然而，公共成员对于派生类和外部代码都是可见的。因此，如果你只能使用这两种访问性级别，你就无法拥有一个既能被基类和派生类访问，又不能被外部代码访问的成员。\n\
  \n为了解决这个问题，存在第三种访问级别类型 `protected`（受保护），其中只有基类和派生类可以访问该成员。对于外部代码而言，这与私有成员是相同的——在这两种情况下它都无法访问。\n\
  \n除了定义成员的保护级别外，你还可以为它定义继承行为。基类的成员可以是 `virtual`（虚的），这意味着该成员可以被继承它的类所重写。因此，派生类可以为该成员提供替代实现。这种替代实现不会删除原始代码（原始代码在类内部仍然可以访问），但它将其从外部代码中屏蔽。如果没有提供替代方案，那么任何通过派生类使用该成员的外部代码将自动使用该成员的基类实现。\n\
  \n在动物示例中，你可以将 `EatFood()` 设置为虚方法，并在任何派生类上为其提供新的实现——例如，仅在 `Cow` 类上，如图 8-8 所示。这显示了\
  \ `Animal` 和 `Cow` 类上的 `EatFood()` 方法，以表示它们有自己的实现。\n\n基类也可以被定义为 `abstract`（抽象）类。抽象类不能直接实例化；要使用它，你需要继承自它。抽象类可以拥有抽象成员，这些成员在基类中没有实现，因此必须在派生类中提供实现。如果\
  \ `Animal` 是一个抽象类，那么 UML 将如图 8-9 所示。\n\n![UML 表示快照，其中 Animal 是一个抽象类。](img/c08f008.png)\n\
  \n图 8-8\n\n在图 8-9 中，`EatFood()` 和 `Breed()` 都显示在派生类 `Chicken` 和 `Cow` 中，这意味着这些方法要么是抽象的（因此，必须在派生类中重写），要么是虚的（在这种情况下，它们在\
  \ `Chicken` 和 `Cow` 中已被重写）。当然，抽象基类可以提供成员的实现，这非常常见。不能实例化抽象类的事实并不意味着你不能在其中封装功能。\n\n\
  最后，一个类可以是 `sealed`（密封的）。密封类不能作为基类，因此不存在可能的派生类。\n\nC# 为所有对象提供了一个公共基类，称为 `object`（它是\
  \ .NET Framework 中 `System.Object` 类的别名）。如果一个类没有派自任何其他类，那么它隐式地派自 `object`。你可以在第\
  \ 9 章中详细查看此类。\n\n![在派生类 Chicken 和 Cow 中显示了 EatFood() 和 Breed()。](img/c08f009.png)\n\
  \n图 8-9\n\n### 多态\n\n继承的一个结果是，派自基类的类在它们公开的方法和属性上存在重叠。由于由于，通常可以使用相同的语法处理从具有共同基类型的类实例化的对象。例如，如果一个名为\
  \ `Animal` 的基类有一个名为 `EatFood()` 的方法，那么从派生类 `Cow` 和 `Chicken` 运行此方法的语法将是类似的：\n\n\
  ```\nCow myCow = new Cow();\nChicken myChicken = new Chicken();\nmyCow.EatFood();\n\
  myChicken.EatFood();\n```\n\n多态更进了一步。你可以将一个派生类型的对象赋值给其中一个基类类型的变量，如下所示：\n\n```\n\
  Animal myAnimal = myCow;\n```\n\n这不需要任何强制类型转换。然后，你可以通过此变量调用基类的方法：\n\n```\nmyAnimal.EatFood();\n\
  ```\n\n这将导致调用派生类中 `EatFood()` 的实现。请注意，你不能调用定义在派生类上的方法。以下代码将无法工作：\n\n```\nmyAnimal.Moo();\n\
  ```\n\n然而，你可以将基类型变量强制转换为派生类并调用该方法：\n\n```\nCow myCow = (Cow)myAnimal;\nmyCow.Moo();\n\
  ```\n\n如果变量类型不是 `Cow` 或其派生类，此强制类型转换将引发异常。有确定对象类型的方法，你将在下一章中学习。\n\n多态是一种用极少代码对不同对象执行任务的极有用的技术。不仅共享相同父类的类可以使用多态。也可以以相同的方式处理（例如）子类和孙子类，前提是它们的继承层次结构中有一个公共类。\n\
  \n这里的进一步说明是，记住在 C# 中所有类都派自 `object` 类层次结构。因此，可以将所有对象视为 `object` 实例。这就是 `WriteLine()`\
  \ 在构建字符串时处理几乎无限参数组合的原因。第一个参数之后的每个参数都被视为 `object`，允许将任何对象的输出写入屏幕。为此，调用了 `ToString()`\
  \ 方法（`object` 的成员）。你可以重写此方法以提供适用于类的实现，或者简单使用默认实现，它返回根据命名空间限定的类名。\n\n#### 接口多态\n\n\
  虽然你不能像实例化那样实例化接口，但你可以拥有一个接口类型的变量。然后可以使用该变量访问支持该接口的对象上公开的方法和属性。\n\n例如，假设不是使用 `Animal`\
  \ 基类来提供 `EatFood()` 方法，而是将此 `EatFood()` 方法放在名为 `IConsume` 的接口上。`Cow` 和 `Chicken`\
  \ 类都可以支持此接口，唯一的区别是它们被强制提供 `EatFood()` 的实现，因为接口不包含实现。可以使用如下代码访问此方法：\n\n```\nCow myCow\
  \ = new Cow();\nChicken myChicken = new Chicken();\nIConsume consumeInterface;\n\
  consumeInterface = myCow;\nconsumeInterface.EatFood();\nconsumeInterface = myChicken;\n\
  consumeInterface.EatFood();\n```\n\n这为以相同方式调用多个对象提供了一种简单的方法，并且不依赖于公共基类。例如，此接口可以由一个派自\
  \ `Vegetable` 而不是 `Animal` 的 `VenusFlyTrap` 类实现。\n\n\n\n\n```\nVenusFlyTrap myVenusFlyTrap\
  \ = new VenusFlyTrap();\nIConsume consumeInterface;\nconsumeInterface = myVenusFlyTrap;\n\
  consumeInterface.EatFood();\n```\n\n在前面的代码段中，调用 `consumeInterface.EatFood()` 会导致调用\
  \ `Cow`、`Chicken` 或 `VenusFlyTrap` 类的 `EatFood()` 方法，这取决于哪个实例被赋值给接口类型变量。\n\n这里需要注意，派生类继承了其基类支持的接口。在前面的第一个示例中，可能是\
  \ `Animal` 支持 `IConsume`，也可能是 `Cow` 和 `Chicken` 都支持 `IConsume`。请记住，具有共同基类的类并不一定具有共同的接口，反之亦然。\n\
  \n## 对象之间的关系\n\n继承是对象之间的一种简单关系，它导致基类被派生类完全暴露，其中派生类还可以访问其基类的内部实现（通过受保护成员）。在其他情况下，对象之间的关系也会变得非常重要。\n\
  \n本节将简要介绍以下内容：\n\n*   **包含（Containment）**——一个类包含另一个类。这类似于继承，但它允许包含类控制对被包含类成员的访问，甚至在使用类类成员之前执行额外的处理。\n\
  *   **集合（Collections）**——一个类充当另一个类的多个实例的容器。这类似于拥有对象数组，但集合具有额外的功能，包括索引、排序、调整大小等。\n\
  \n### 包含\n\n通过成员字段来持有对象实例可以轻松地实现包含。该成员字段可以是公共的（public），在这种情况下，容器对象的用户就可以访问其暴露的方法和属性，这与继承非常相似。但是，你将无法像继承那样通过派生类访问该类的内部实现。\n\
  \n或者，你可以将被包含的成员对象设为私有（private）成员。如果你这样做，那么用户将无法直接访问它的任何成员，即使这些成员是公共的。相反，你可以通过包含类的成员来提供对这些成员的访问。这意味着你可以完全控制要暴露被包含类中的哪些成员（如果存在的话话），并且你可以在访问被包含类的成员之前，在包含类的成员中执行额外的处理。\n\
  \n例如，一个 `Cow` 类可能包含一个带有公共方法 `Milk()` 的 `Udder` 对象。`Cow` 对象可以根据需要调用此方法，也许作为其 `SupplyMilk()`\
  \ 方法的一部分，但这些细节对 `Cow` 对象的用户来说是不可见的（或重要的）。\n\n包含的类可以在 UML 中使用关联线进行可视化。对于简单的包含，你在线的末端标记为\
  \ 1，显示出一对一的关系（一个 `Cow` 实例将包含一个 `Udder` 实例）。为了清晰，你也可以将包含的 `Udder` 类实例显示为 `Cow` 类的私有字段（参见图\
  \ 8-10）。\n\n![UML 表示快，其中 Udder 类实例作为 Cow 类的私有字段以清晰起。](img/c08f010.png)\n\n**图 8-10**](#c08.xhtml_R_c08-fig-0010)\n\
  \n### 集合\n\n第 5 章描述了你如何使用数组来存储相同类型的多个变量。这对于对象同样有效（记住，你一直使用的变量类型实际上是对象，所以这并不意外）。这是一个示例：\n\
  \n```\nAnimal[] animals = new Animal[5];\n```\n\n*集合*（collection）基本上是一个带有额外功能的数组。集合的实现方式与其他对象非常相似，都是作为类。它们通常以其存储的对象的复数形式命名——例如，一个名为\
  \ `Animals` 的类可能包含一个 `Animal` 对象的集合。\n\n与数组的主要区别在于，集合通常实现了额外的功能，例如 `Add()` 和 `Remove()`\
  \ 方法，用于向集合中添加和删除项目。通常还有一个 `Item` 属性，根据其索引返回对象。在大多数情况下，该属性的实现方式允许更复杂的访问。例如，可以设计 `Animals`\
  \ 类，使得可以通过名称访问特定的 `Animal` 对象。\n\n在 UML 中，你可以像图 8-11 所示那样对其进行可视化。图 8-11 中不包含成员，因为该图说明的是它们之间的关系。连接线末端的数字显示，一个\
  \ `Animals` 对象将包含零个或多个 `Animal` 对象。你将在第 11 章中更详细地查看集合。\n\n![UML 表示快，其中不包含成员。](img/c08f011.png)\n\
  \n**图 8-11**](#c08.xhtml_R_c08-fig-0011)\n\n### 运算符重载\n\n在书的前部，你已经看到如何使用运算符来处理简单的变量类型。在有时，对从你自定义类实例化的对象使用运算符是有逻辑的。这是可能的因为类可以包含关于如何处理运算符的指令。\n\
  \n例如，你可能会为 `Animal` 类添加一个名为 `Weight` 的新属性。然后你可以使用以下代码来比较动物重量：\n\n```\nif (cowA.Weight\
  \ > cowB.Weight) {\n   …\n}\n```\n\n使用运算符重载，你可以在代码中隐式地使用 `Weight` 属性，如下：\n\n```\n\
  if (cowA > cowB) {\n   …\n}\n```\n\n在这里，大于运算符 `>` 被*重载*了。重载运算符是你编写了代码以执行操作的运算符——在前面的示例中，你正在使用两个\
  \ `Cow` 对象，因此重载位于 `Cow` 类中。你只能以这种方式重载现有的 C# 运算符；你无法创建新的。然而，你可以为 `+` 或 `>` 等运算符的一元用法和二元用法提供实现。你将在第\
  \ 13 章中学习如何完成这一点。\n\n### 事件\n\n对象可以在处理过程中引发（并消费）*事件*。事件是你可以在代码中采取行动的重要发生，类似于（但比异常更强大）。例如，你可能希望在向集合添加\
  \ `Animal` 对象时执行某些代码，而这些代码既不属于 `Animals` 类，也不属于调用 `Add()` 的代码。为了这样做，你需要在代码中添加一个事件处理器（event\
  \ handler），它是在事件发生时调用的特殊函数。你还需要配置此处理器来监听你感兴趣的事件。\n\n你可以创建*事件驱动应用程序*，这种程序比你想象的要多得多。例如，记住\
  \ Windows 应用程序完全依赖事件。你进行的每次按钮点击或滚动条移动都是通过事件处理实现的。\n\n在本章的后面部分，你将看到它在 Windows 应用程序中是如何工作的，并在第\
  \ 13 章中对事件有更深入的讨论\n\n### 引用类型与值类型\n\nC# 中的数据以两种方式之一存储在变量中，取决于变量的类型。这种类型分为两类：引用或值。区别如下：\n\
  \n*   值类型将自身及其内容存储在内存中的一个位置（称为*栈*）。\n\n\n\n\n\n-   引用类型持有指向内存中其他位置（称为 `heap`）的引用，内容存储在其中。\n\
  \n事实上，在使用 C# 时你不需要过于担心这个问题。到目前为止，你几乎以相同的方式使用了 `string` 变量（引用类型）和其他简单变量（大部分是值类型，例如\
  \ `int`）。\n\n值类型和引用类型之间的一个关键区别是，值类型始终包含一个值，而引用类型可以为 `null`，这反映了它们不包含任何值的情况。然而，通过使用可空类型（`nullable\
  \ types`），可以创建一个在这方面表现得像引用类型的值类型（即它可以为 `null`）。当你查看第 12 章中的高级技术——泛型（`generic types`，其中包含了可空类型）时，会对这些进行详细描述。\n\
  \n只有 `string` 和 `object` 是作为引用类型的简单类型，尽管数组也是隐式的`reference types`。你创建的每个类都将是一个`reference\
  \ type`，这就是为什么在这里强调了这一点。\n\n## 桌面应用程序中的 OOP\n\n在第 2 章中，你使用 Windows Presentation\
  \ Foundation (WPF) 在 C# 中创建了一个简单的桌面应用程序。WPF 桌面应用程序高度依赖 OOP 技术，本节将介绍这些技术以说明本章中的某些观点。接下来的“尝试一试”将允许你完成一个简单的示例。\n\
  \n### 练习题\n\n1. **8.1** 下面哪些是 OOP 中真实的访问权限级别？\n    1. Friend（友元）\n    2. Public（公共）\n\
  \    3. Secure（安全）\n    4. Private（私有）\n    5. Protected（保护）\n    6. Loose（松散）\n\
  \    7. Wildcard（通配符）\n2. **8.2** “你必须手动调用对象的析构函数，否则它将浪费内存。”对还是错？\n3. **8.3** 调用类的静态方法需要创建对象吗？\n\
  4. **8.4** 为以下类和接口绘制与本章中所示类似的 UML 图：\n    * 一个名为 `HotDrink` 的抽象类，它拥有 `Drink`、`AddMilk`\
  \ 和 `AddSugar` 方法，以及 `Milk` 和 `Sugar` 属性\n    * 一个名为 `ICup` 的接口，它拥有 `Refill` 和 `Wash`\
  \ 方法，以及 `Color` 和 `Volume` 属性\n    * 一个名为 `CupOfCoffee` 的类，派自 `HotDrink`，支持 `ICup`\
  \ 接口，并拥有额外的属性 `BeanType`\n    * 一个名为 `CupOfTea` 的类，派自 `HotDrink`，支持 `ICup` 接口，并拥有额外的属性\
  \ `LeafType`\n5. **8.5** 编写一个函数，该函数接受上述示例中的两个杯对象之一作为参数。该函数应该对其传递的任何杯对象调用 `AddMilk`、`Drink`\
  \ 和 `Wash` 方法。\n\n练习题的答案可以在附录中找到。\n\n## 本章学到的知识\n\n| 主题 | 核心概念 |\n| --- | --- |\n\
  | 对象和类 | 对象是 OOP 应用的构建模块。类是用于实例化对象的类型定义。对象可以包含数据和/或暴露其他代码可以使用的操作。数据可以通过属性提供给外部代码，操作可以通过方法提供给外部代码。属性和方法都是类的成员。属性允许读取访问、写入访问或两者兼有。类成员可以是公共的（对所有代码可用）或私有的（仅对类定义内部的代码可用）。在\
  \ .NET 中，一切都是对象。 |\n| 对象生命 | 对象通过调用其构造函数之一来实例化。当对象不再需要时，通过执行其析构函数来销毁。为了清理对象后的工作，通常需要手动对其进行释放。当应用\
  \ `using` 块或实现 `IDispose` 时，对象会被释放。 |\n| 静态和实例成员 | 实例成员仅对类的对象实例可用。静态成员仅通过类定义直接可用，不与实例关联。\
  \ |\n| 接口 | 接口是一系列公共属性和方法的集合，可以在类上实现。实例类型变量可以被赋值任何类定义实现了该接口的对象的任何值。此时，只有接口定义的成员可以通过该变量可用。\
  \ |\n| 继承 | 继承允许一个类定义派自另一个类的机制。类继承其父类的成员，且它只能有一个父类。子类无法访问父类中的私有成员，但可以定义保护成员，这些成员仅在该类或派生自该类的类中可用。子类可以重写父类中定义为\
  \ `virtual` 的成员。所有类都有继承链，并于 `System.Object` 结束，它在 C# 中有一个别名为 `object`。 |\n| 多态 |\
  \ 所有从派生类实例化的对象都可以被视为同于祖先类的实例。 |\n| 对象关系和特性 | 对象可以包含其他对象，也可以代表其他对象的集合。为了在表达式中操作对象，你通常需要通过运算符重载来定义运算符如何与对象协作。对象可以暴露由于某些内部过程触发的事件，客户端代码可以通过提供事件处理程序来响应事件。\
  \ |\n\n# 9 定义类\n\n### 本章代码下载\n\n本章的代码下载可以在书籍页面[`www.wiley.com`](http://www.wiley.com)\
  \ 找到。代码也可以在 [`github.com/benperk/BeginningCSharpDotNET`](http://github.com/benperk/BeginningCSharpDotNET)\
  \ 找到。代码位于 Chapter09 文件夹中，并根据名称单独命名。\n\n在第 8 章中，你查看了面向对象编程 (OOP) 的特性。在本章中，你把理论付诸实践并在\
  \ C# 中定义类。我们不会深入定义类成员，而是将关注类定义。首先，我们探索基本的类定义语法、确定类访问权限的关键字以及指定继承的方式。我们还将查看接口定义，因为它们在许多方面类似于类定义。\n\
  \n## C# 中的类定义\n\nC# 使用 `class` 关键字来定义类：\n\n```\nclass MyClass\n{\n   // 类成员。\n}\n\
  ```\n\n这段代码定义了一个名为 `MyClass` 的类。一旦定义了类，你就可以在访问项目的任何地方实例化它。默认情况下，类被声明为 `internal`，这意味着只有当前项目可以访问它们。你可以如下所示显式指定\
  \ `internal` 访问修饰符（尽管不需要这样做）：\n\n```c\ninternal class MyClass\n{\n   // 类成员。\n}\n\
  ```\n\n或者，你可以指定该类是公共的，并且应该被其他项目访问。为此，你使用 `public` 关键字：\n\n```c\npublic class MyClass\n\
  {\n   // 类成员。\n}\n```\n\n\n\n\n与抽象类一样，`sealed` 类可以是 `public` 或 `internal` 的。\n\n\
  继承关系也可以在类定义中指定。你只需要在类名后跟一个冒号，然后跟上基类的名称：\n\n```cpp\npublic class MyClass : MyBase\n\
  {\n   // 类成员。\n}\n```\n\nC# 的类定义中只允许一个基类；如果你继承自一个抽象类，则必须实现所有继承来的抽象成员（除非派生类本身也是抽象的）。\n\
  \n编译器不允许派生类的访问级别高于于其基类。这意味着一个 `internal` 类可以继承自一个 `public` 基类，但一个 `public` 类不能继承自一个\
  \ `internal` 基类。以下代码是合法的：\n\n```cpp\npublic class MyBase\n{\n   // 类成员。\n}\ninternal\
  \ class MyClass : MyBase\n{\n   // 类成员。\n}\n```\n\n以下代码将无法编译：\n\n```cpp\ninternal\
  \ class MyBase\n{\n   // 类成员。\n}\npublic class MyClass : MyBase\n{\n   // 类成员。\n\
  }\n```\n\n如果不使用基类，该类将仅继承自基类 `System.Object`（在 C# 中其别名为 `object`）。最终，所有类在继承层次结构的根部都有\
  \ `System.Object`。稍后我们将更详细地查看这个基础类。\n\n除了通过这种方式指定基类外，你还可以在冒号字符之后指定支持的接口。如果指定了基类，它必须是冒号后的第一个项，接口在随后的指定。如果没有指定基类，则直接在冒号后指定接口。必须使用逗号来分隔基类名称（如果有的话）和各个接口名称。\n\
  \n例如，你可以按照如下方式为 `MyClass` 添加一个接口：\n\n```cpp\npublic class MyClass : IMyInterface\n\
  {\n   // 类成员。\n}\n```\n\n在任何支持该接口的类中，必须实现所有接口成员，尽管如果你不想对给定的接口成员执行任何操作，可以提供一个“空”实现（不包含功能代码），并且你可以在抽象类中将接口成员实现为抽象成员。\n\
  \n以下声明无效的，因为基类 `MyBase` 不是继承列表中的第一个项：\n\n```cpp\npublic class MyClass : IMyInterface,\
  \ MyBase\n{\n   // 类成员。\n}\n```\n\n指定基类和接口的正确方式如下：\n\n```cpp\npublic class MyClass\
  \ : MyBase, IMyInterface\n{\n   // 类成员。\n}\n```\n\n记住多个接口是可能的，因此以下内容也是有效的：\n\n```cpp\n\
  public class MyClass : MyBase, IMyInterface, IMySecondInterface\n{\n   // 类成员。\n\
  }\n```\n\n表 9-1 显示了类定义允许的访问修饰符组合。\n\n| 修饰符 | 说明 |\n| --- | --- |\n| none 或 `internal`\
  \ | 类仅可从当前项目内部访问。 |\n| `Public` | 类可以从任何地方访问。 |\n| `abstract` 或 `internal abstract`\
  \ | 类仅可从当前项目内部访问，且不能实例化，只能被派生。 |\n| `public abstract` | 类可以从任何地方访问，且不能实例化，只能被派生。\
  \ |\n| `sealed` 或 `internal sealed` | 类仅可从当前项目内部访问，且不能被派生，只能实例化。 |\n| `public sealed`\
  \ | 类可以从任何地方访问，且不能被派生，只能实例化。 |\n| `private` | 类内容仅可从同一类内部访问。 |\n| `protected` |\
  \ 类内容可从同一类或派生类内部访问。 |\n\n**表 9-1:** 类定义的访问修饰符\n\n### 接口定义\n\n接口的声明方式与类类似，但使用的是 `interface`\
  \ 关键字而不是 `class`：\n\n```interface\ninterface IMyInterface\n{\n   // 接口成员。\n}\n```\n\
  \n访问修饰符关键字 `public` 和 `internal` 的用法相同；且与类一样，接口默认定义为 `internal`。要使接口为公开可访问，你必须使用\
  \ `public` 关键字：\n\n```cpp\npublic interface IMyInterface\n{\n   // 接口成员。\n}\n```\n\
  \n不允许使用 `abstract` 和 `sealed` 关键字，因为这两个修饰符在接口的语文中都没有意义（它们不包含任何实现，因此无法直接实例化，并且它们必须是可派生的才有用）。\n\
  \n接口继承的指定方式也与类继承类似。这里的主要区别是可以使用多个基接口，如下所示：\n\n```interface\npublic interface IMyInterface\
  \ : IMyBaseInterface, IMyBaseInterface2\n{\n   // 接口成员。\n}\n```\n\n接口不是类，因此不继承自\
  \ `System.Object`。然而，`System.Object` 的成员可以通过接口类型变量可用，这纯粹是为了方便。此外，正如已经讨论过的，无法以与类相同的方式实例化接口。接下来的“试一试”（Try\
  \ It Out）提供了一些类定义的示例，以及使用这些类的代码。\n\n## SYSTEM.OBJECT\n\n由于所有类都继承自 `System.Object`，因此所有类都可以访问该类的受保护和公开成员。因此，查看其中可用的内容是值得的。`System.Object`\
  \ 包含了表 9-2 中描述的方法。\n\n| 方法 | 返回类型 | 虚拟 | 静态 | 说明 |\n| --- | --- | --- | --- | ---\
  \ |\n| `Object()` | N/A | 否 | 否 | `System.Object` 类型的构造函数。由派生类型调用。 |\n| `Finalize()`\
  \ | N/A | 否 | 否 | `System.Object` 类型的析构函数。由派生类型调用；不能手动调用。 |\n| `Equals(object)`\
  \ | `bool` | 是 | 否 | 比较调用此方法的对象与另一个对象，如果相等则返回 `true`。默认实现检查对象是否引用同一个对象（因为对象是引用类型）。如果你想以不同的方式比较对象（例如比较对象的状态），可以重写此方法。\
  \ |\n| `Equals(object, object)` | `bool` | 否 | 是 | 比较传递的两个对象并检查它们是否相等。此检查使用 `Equals(object)`\
  \ 方法。如果两个对象都是空引用，则此方法返回 `true`。 |\n| `ReferenceEquals(object, object)` | `bool`\
  \ | 否 | 是 | 比较传递的两个对象并检查它们是否是同一个实例。 |\n| `ToString()` | `string` | 是 | 否 | 返回对应于对象的字符串。默认情况下，这是类的限定名称，但可以重写以提供适用于类类型的实现。\
  \ |\n| `MemberwiseClone()` | `object` | 否 | 否 | 通过创建新对象实例并复制成员来复制对象。这种成员复制不会产生这些成员的新实例。新对象的任何引用类型成员都指向原始类的相同对象。此方法是受保护的，因此只能在类内部或派生类中使用。\
  \ |\n| `GetType()` | `System.Type` | 否 | 否 | 以 `System.Type` 对象的形式返回对象的类型。 |\n|\
  \ `GetHashCode()` | `int` | 是 | 否 | 在需要时作为对象的哈希函数。哈希函数以某种压缩的形式返回一个标识对象状态的值。 |\n\n\
  这些是 .NET 中对象类型必须支持的基本方法，尽管你可能永远不会使用某些方法（或者你只在特殊情况下使用它们，例如 `GetHashCode()` ）。\n\n\
  \n\n\n当你使用多态时，`GetType()` 非常有用，因为它允许你根据对象的类型对其执行不同的操作，而不是像通常情况下那样对所有对象执行相同的操作。例如，如果你有一个接受\
  \ `object` 类型参数的函数（这意味着你可以传递几乎任何内容），那么在遇到某些对象时，你可能会执行额外的任务。通过结合 `GetType()` 和 `typeof`（一种将类名转换为\
  \ `System.Type` 对象的 C# 运算符），你可以执行如下所示的：\n\n```\nif (myObj.GetType() == typeof(MyComplexClass))\n\
  {\n   // myObj 是 MyComplexClass 类的实例。\n}\n```\n\n执行相同比较的另一种方法是使用 `is` 运算符，该运算符在第\
  \ 11 章中介绍。\n\n返回的 `System.Type` 对象的功能远不止于此，但这里仅涵盖了这一点。重写 `ToString()` 方法也特别有用，特别是在对象的内容可以用单个人类可读字符串轻松表示的情况下。你将在随后的章节中反复看到这些\
  \ `System.Object` 方法，因此你将根据需要学习更多细节。\n\n## 构造函数与析构函数\n\n在 C# 中定义类时，通常没有必要定义相关的构造函数和析构函数，因为如果你没有提供它们，编译器在构建代码时会自动为你添加它们。然而，如果需要，你可以提供自己的构造函数，以便分别对对象进行初始化和清理。\n\
  \n你可以使用以下语法为类添加一个简单的构造函数：\n\n```\nclass MyClass\n{\n   public MyClass()\n   {\n\
  \      // 构造函数代码。\n   }\n}\n```\n\n此构造函数的名称与包含它的类相同，没有参数（使其成为该类的默认构造函数），并且是公共的，因此该类的对象可以使用此构造函数实例化（有关此点的更多信息，请参考第\
  \ 8 章）。\n\n你也可以使用私有默认构造函数，它通常用于仅包含静态成员的类。将构造函数设置为私有意味着无法使用该构造函数创建此类类的实例（它是*不可创建的*——再次，请参阅第\
  \ 8 章中的讨论）：\n\n```\nclass MyClass\n{\n   private MyClass()\n   {\n      // 构造函数代码。\n\
  \   }\n}\n```\n\n最后，你可以以类似的方式为类添加非默认构造函数，只需提供参数即可：\n\n```\nclass MyClass\n{\n  \
  \ public MyClass()\n   {\n      // 默认构造函数代码。\n   }\n   public MyClass(int myInt)\n\
  \   {\n      // 非默认构造函数代码（使用 myInt）。\n   }\n}\n```\n\n你可以提供无限数量的构造函数（直到内存耗尽或没有更多不同的参数集，所以也许“几乎无限”更恰切）。\n\
  \n析构函数使用略有不同的语法声明。.NET 中使用的析构函数（由 `System.Object` 类提供）被称为 `Finalize()`，但这不是你声明析构函数的名称。你不是重写\
  \ `Finalize()`，而是使用以下代码：\n\n```\nclass MyClass\n{\n   ~MyClass()\n   {\n      //\
  \ 析构函数体。\n   }\n}\n```\n\n类的析构函数通过类名声明（与构造函数相同），带有波浪号 (`~`) 前缀。析构函数中的代码在发生垃圾收集时执行，允许你释放资源。在调用析构函数后，还会发生对基类析构函数的隐式调用，包括对\
  \ `System.Object` 根类中 `Finalize()` 的调用。这种技术使得 .NET Framework 能够确保这种情况发生，因为重写 `Finalize()`\
  \ 意味着需要显式执行基类调用，这具有潜在的危险（你将在下一章学习如何调用基类方法）。\n\n### 构造函数执行顺序\n\n如果你在类的构造函数中执行多个任务，那么将这些代码放在一个地方会很方便，这与将代码拆分为函数具有相同的处，如第\
  \ 6 章所示。你可以使用方法来实现（参见第 10 章），但 C# 提供了一个极佳的替代方案。你可以配置任何构造函数在执行自己的代码之前调用任何其他构造函数。\n\
  \n首先，你需要仔细观察在实例化类实例时默认发生了什么。除了如前所述有助于初始化代码的集中化外，这本身也值得了解。在开发过程中，对象的行为往往并不符合你的预期，这是由于构造函数调用期间的错误——通常是你的类继承体系中某处的基类没有被正确实例化，或者信息没有被正确提供给基类构造函数。理解对象生命周期这一阶段发生了什么，可以让你更容易解决这类问题。\n\
  \n要实例化一个派生类，其基类必须先实例化。要实例化这个基类，它自己的基类必须被实例化，以此类推，直到 `System.Object`（所有类的根）。结果，无论你使用哪种构造函数来实例化类，`System.Object.Object()`\
  \ 总是第一个被调用。\n\n无论你在派生类中使用哪种构造函数（默认构造函数或非默认构造函数），除非有指定，否则将使用基类的默认构造函数。（你很快就会看到如何更改这种行为。）这里有一个简短的示例说明了该顺序。考虑以下对象层次结构：\n\
  \n```\npublic class MyClass\n{\n   public MyClass()\n   {\n   }\n   public MyClass(int\
  \ i)\n   {\n   }\n}\npublic class MyDerivedClass : MyClass\n{\n   public MyDerivedClass()\n\
  \   {\n   }\n   public MyDerivedClass(int i)\n   {\n   }\n   public MyDerivedClass(int\
  \ i, int j)\n   {\n   }\n}\n```\n\n你可以通过以下方式实例化 `MyDerivedClass`：\n\n```\nMyDerivedClass\
  \ myObj = new MyDerivedClass();\n```\n\n在这种情况下，发生的事件序列为：\n\n*   `System.Object.Object()`\
  \ 构造函数执行。\n*   `MyClass()` 构造函数执行。\n*   `MyDerivedClass()` 构造函数执行。\n\n或者，你可以使用：\n\
  \n```\nMyDerivedClass myObj = new MyDerivedClass(4);\n```\n\n序列如下：\n\n*   `System.Object.Object()`\
  \ 构造函数执行。\n*   `MyClass()` 构造函数执行。\n*   `MyDerivedClass(int i)` 构造函数执行。\n\n最后，你可以使用：\n\
  \n```\nMyDerivedClass myObj = new MyDerivedClass(4, 8);\n```\n\n结果是以下序列：\n\n*  \
  \ `System.Object.Object()` 构造函数执行。\n*   `MyClass()` 构造函数执行。\n*   `MyDerivedClass(int\
  \ i, int j)` 构造函数执行。\n\n这种系统大多数情况下运行良好，但有时你希望对发生的事件有更多的控制。例如，你可能希望将之前的实例化更改为以下序列：\n\
  \n*   `System.Object.Object()` 构造函数执行。\n*   `MyClass(int i)` 构造函数执行。\n*   `MyDerivedClass(int\
  \ i, int j)` 构造函数执行。\n\n使用这种序列，你可以将使用 `int i` 参数的代码放在 `MyClass(int i)` 中，这意味着 `MyDerivedClass(int\
  \ i, int j)` 构造函数要做的工作更少——它只需要处理 `int j` 参数。（这假定 `int i` 参数在两种情况下具有相同的含义，这并不总是如此；但在实践中，通过这种安排通常是这样的。）C#\
  \ 允许你在需要时指定这种行为。\n\n\n\n\n要做到这一点，你可以使用*构造函数初始化器*（constructor initializer），它由位于方法定义中冒号后面的代码组成。例如，你可以在派生类的构造函数定义中指定要使用的基类构造函数，如下所示：\n\
  \n```\npublic class MyDerivedClass : MyBaseClass\n{\n   …\n   public MyDerivedClass(int\
  \ i, int j) : base(i)\n   {\n   }\n}\n```\n\n`base` 关键字引导 .NET 实例化过程使用具有指定参数的基类构造函数。在这里，你使用了一个单一\
  \ `int` 参数（其值是传递给 `MyDerivedClass` 构造函数的参数 `i` 的值），因此将使用 `MyBaseClass(int i)`。这样做意味着\
  \ `MyBaseClass()` 不会被调用，从而得到了此示例之前列出的事件序列——这正是你想要的。\n\n你还可以使用此 `base` 关键字为基类构造函数指定字面量，例如使用\
  \ `MyDerivedClass` 的默认构造函数来调用 `MyBaseClass` 的非默认构造函数：\n\n```cs\npublic class MyDerivedClass\
  \ : MyBaseClass\n{\n   public MyDerivedClass() : base(5)\n   {\n   }\n   …\n}\n\
  ```\n\n这会产生以下序列：\n\n* `System.Object.Object()` 构造函数将执行。\n* `MyBaseClass.MyBaseClass(int\
  \ i)` 构造函数将执行。\n* `MyDerivedClass.MyDerivedClass()` 构造函数将执行。\n\n除了这个 `base` 关键字，你还可以使用另一个关键字作为构造函数初始化器：`this`。此关键字指示\
  \ .NET 实例化过程在调用指定的构造函数之前，使用当前类上的另一个非默认构造函数：\n\n```cs\npublic class MyDerivedClass\
  \ : MyBaseClass\n{\n   public MyDerivedClass() : this(5, 6)\n   {\n   }\n   …\n\
  \   public MyDerivedClass(int i, int j) : base(i)\n   {\n   }\n}\n```\n\n在这里，使用\
  \ `MyDerivedClass`.MyDerivedClass()` 构造函数将给你以下序列：\n\n* `System.Object.Object()`\
  \ 构造函数将执行。\n* `MyBaseClass.MyBaseClass(int i)` 构造函数将执行。\n* `MyDerivedClass.MyDerivedClass(int\
  \ i, j)` 构造函数将执行。\n* `MyDerivedClass.MyDerivedClass()` 构造函数将执行。\n\n这里的唯一限性是你可以使用构造函数初始化器只能指定一个构造函数。然而，如上一个示例所示，这并不是很大的限制，因为你仍然可以构建复杂的执行序列。\n\
  \n在定义构造函数时，小心不要意外创建循环引用。例如，考虑这段代码：\n\n```cs\npublic class MyBaseClass\n{\n   public\
  \ MyBaseClass() : this(5)\n   {\n   }\n   public MyBaseClass(int i) : this()\n \
  \  {\n   }\n}\n```\n\n使用这些构造函数中的任何一个都需要另一个先执行，而反过来又需要另一个先执行，依此类推。这段代码可以编译通过，但如果你尝试实例化\
  \ `MyBaseClass`，将收到一个异常。\n\n# VISUAL STUDIO 中的 OOP 工具\n\n由于 OOP 是 .NET 的一个非常基础方面，Visual\
  \ Studio 提供了若干工具来辅助开发 OOP 应用程序。本节描述了其中一些工具。\n\n### 类视图窗口（Class View Window）\n\n\
  在第 2 章中，你看到解决方案资源管理器（Solution Explorer）窗口与名为类视图的窗口共享空间。此窗口向你显示应用程序的类层次结构，并让你一目看出所用类的特征。图\
  \ 9-3 显示了上一个“尝试”中示例项目的视图。\n\n窗口分为两个主要部分；底部部分显示类型的成员。注意，图 9-3 显示的是当类视图窗口顶部的类视图设置下拉菜单中的所有项都勾选时的显示情况。点击图像右侧类似齿轮的小箭头可以访问类视图设置。\n\
  \n![类视图窗口截图。](img/c09f003.png)\n\n**图 9-3**\n\n这里可以使用许多符号，包括表 9-3 中所示的。\n\n| 图标\
