  \  }\n   public ShortList(IEnumerable<T> list)\n      : this(10, list)\n   {\n \
  \  }\n   public ShortList(int size, IEnumerable<T> list)\n   {\n      maxSize =\
  \ size;\n      innerCollection = new List<T>(list);\n      if (Count> maxSize)\n\
  \      {\n         ThrowTooManyItemsException();\n      }\n   }\n   protected void\
