  \ (DI) | DI 解耦了消费者和提供者。 |\n\n# 19\n基础云编程\n\n### 本章代码下载\n\n本章的代码下载可以在书籍页面的 [`www.wiley.com`](http://www.wiley.com)\
  \ 找到。点击 Downloads 链接。代码也可以在 github.com/benperk/BeginningCSharpAndDotNet`](http://github.com/benperk/BeginningCSharpAndDotNet)\
  \ 找到。代码位于 Chapter19 文件夹中，并根据本章中的名称单独命名。\n\n在本书中，C# 编程基础主要通过控制台应用程序和带有 WPF 的桌面应用程序来传达。尽管这些是可行且吸引人的开发技术，但它们并不是适合在云端托管和运行的程序示例。这类程序通常部署并运行在用户的计算机、平板或移动设备上。这些程序被编译为可执行文件或动态链接库，这些库依赖于如\
  \ .NET 等预装软件。这些依赖项通常假设存在于安装位置，或者它们被包含在安装过程中。相比之下，基于 ASP.NET 在云端运行的 Internet 应用无法依赖访问程序的计算机或设备上存在任何此类库或依赖。相反，所有依赖项都安装在托管\
  \ Internet 应用的服务器上，并由设备使用 `HTTP`、`WS` (web socket)、`FTP` 或 `SMTP` 等协议进行访问。\n\n\n\
  \n如果你尚未开始，那么开始创建完全或部分运行在云端的应用程序只是早晚的问题。这不再是“是否”的问题，而是“何时”的问题。决定程序的哪些组件将运行在云端、选择何种云类型以及云服务模型，需要进行一些研究、理解和规划。首先，你需要明确什么是云。云简单来说就是运行在数据中心内部的大量商品化计算机硬件，这些硬件可以运行程序并存储大量数据。其区别在于**弹性**（elasticity），即动态地向上扩展（例如增加\
  \ CPU 和内存）和/或向外扩展（例如增加虚拟服务器实例的数量），然后以几乎极小或毫不费力的精力回缩的能力。\n\n这与当前的 IT 运营格局有巨大区别。在当前格局下，差异化的计算资源往往在公司的某个区域部分或完全未被使用，而在其他区域又严重缺乏计算资源。云通过在你需要时提供计算资源来解决这个问题，而当你不需要它们时，这些资源就会提供给其他人。对于个人开发者来说，云是一个部署你的程序并将其推给世界的地方。如果程序偶然变得流行起来，你可以扩展规模以满足资源需求；如果程序平庸了，那么你也不会在设置专用计算机硬件和基础设施上花费大量的资金或时间。\n\
  \n### 云类型与云服务模型\n\n现在让我们详细探索云类型和云服务模型。常见的云类型有公有云、私有云和混合云，并在以下要点中描述并在图 19-1 中所示。\n\
  \n*   `Public cloud` 公公有云是由 Microsoft Azure、Amazon AWS、Rackspace 或 Google Cloud\
  \ 等云供应商拥有并运营的共享计算机硬件和基础设施。这种云类型对于需要管理客户和用户需求波动的中小企业理想。\n*   `Private cloud`（私有云是位于现场或外包数据中心的专用计算机硬件和基础设施。这种云类型对于大型公司或必须提供更高水平数据安全或政府合规性的公司理想。\n\
  *   `Hybrid cloud` 混合云是公共和私有云类型的结合，你可以选择 IT 解决方案的哪些部分运行在私有云上，哪些运行在公有云上。理想的解决方案是将需要更高安全性的业务关键程序运行在私有云中，并将非敏感的、可能出现峰值的任务运行在公有云中。\n\
  \n![常见云类型（如公有云、私有云和混合云）的示意图](img/c19f001.png)\n\n**图 19-1**\n\n云服务模型的数量持续增加，但最常见的云服务模型在以下要点中描述并在图\
  \ 19-2 中所示。\n\n*   `Infrastructure as a Service (IaaS)`——基础设施即服务：你负责从操作系统以上的部分。你不需要负责硬件或网络基础设施；然而，你负责负责操作系统补丁和第三方依赖库。\n\
  *   `Platform as a Service (PaaS)`——平台即服务：你仅负责运行在所选操作系统上的程序及其依赖项。你不需要负责操作系统维护、硬件或网络基础设施。\n\
  *   `Software as a Service (SaaS)`——软件即服务：通过 Internet 访问的设备使用的软件程序或服务；例如 O365、Salesforce、OneDrive\
  \ 或 Box，所有这些都可以从任何有 Internet 连接的地方访问，并且不需要在客户端安装软件即可运行。你仅负责运行在平台上的软件，其他概不负责。\n\n\
  ![最常见云服务模型的示意图](img/c19f002.png)\n\n**图 19-2**\n\n总结来说，云是一种运行程序的商品化计算机硬件的弹性结构。这些程序运行在\
  \ `IaaS`、`PaaS` 或 `SaaS` 服务模型上，并处于混合、公有或私有云类型中。\n\n### 云编程\n\n云编程是开发运行在任何云服务模型上的代码逻辑。云程序应该结合可移植性、可扩展性和弹性等模式，以提高程序的性能和稳定性。没有实现这些可移植性、可扩展性和弹性模式的程序可能会运行在云端，但某些情况（如硬件故障或网络延迟问题）可能会导致程序执行意外之外的代码路径并终止。\n\
  \n回过来看，作为云最有利的优势之一，不仅平台能够扩展，云程序同样也可以扩展。例如，代码是否依赖于后端资源（如数据库、读取或打开文件，或解析大型数据对象）？云程序中的此类功能操作可能会降低其扩展能力，因此对吞吐量的支持较低。确保你的云程序管理执行长时间运行方法的代码路径，并可能将它们放入离线处理机制中。\n\
  \n### 云优化栈\n\n云优化栈（Cloud optimized stack）是一个概念，用于指能够处理高吞吐量、占用空间小、可以与同一服务器上的其他应用程序并排运行并且支持跨平台的代码。`small\
  \ footprint`（小占用）指的是在你的云程序中仅封装存在依赖关系的组件，使部署尺寸尽可能小。考虑云程序是否需要整个 `.NET Framework` 才能运行。如果不需要，那么不要封装整个\
  \ `.NET Framework`，而是包含运行你的云程序所需的库，然后将你的云程序编译为自包含应用程序以支持并排执行。云程序可以与其他任何云程序并排运行，因为它二进制包本身包含了所需的依赖项。最后，通过使用开源的\
  \ `.NET Core` 或 `ASP.NET Core`，云程序可以打包、编译并部署到 Microsoft 外的操作系统上——例如 macOS 或 Linux。在这里特意使用\
  \ `.NET Framework` 和 `.NET Core` 是为了强调它们用法之间的区别。正如前面的章节中所提到的，从 `.NET 5` 开始，`.NET\
  \ Framework` 和 `.NET Core` 的功能已经平起平坐，库现在被简单称为 `.NET`。\n\n### 云模式与最佳实践\n\n在云中，短暂的延迟增加或停机是预期的，你的代码必须对此做好准备，并包含从这些平台异常中恢复的逻辑。如果你一直以来都是现场或本地程序执行进行编程，这是一个巨大的思维转变。你需要忘记许多关于异常处理的旧知识，并学会接受失败，创建你的代码来从此类失败中恢复。\n\
  \n\n\n\n在上一节中，我们提到了可移植性、扩展性和韧性等词汇，背景是将这些概念集成到你计划在云端运行的程序。但这里的 `portability`（可移植性）具体指什么？如果程序可以在多个平台（例如\
  \ Windows、Linux 和 Mac OS）上移动或执行，那么它就是可移植的。以某些 `ASP.NET Core` 特性为例，它们构建在新的开源技术栈之上，为开发者提供了选项，可以将代码编译为能够在上述任何一个平台上运行的二进制文件。传统上，使用\
  \ `ASP.NET` 并以 `C#` 为背景编写程序的开发者会在使用 `Internet Information Server (IIS)` 的 Windows\
  \ 服务器上运行它。然而，从以云为核心的视角来看，你的程序及其所有依赖项无需手动或程序干预即可从一台虚拟机移动到另一台虚拟机，是这种背景下最适用的移植性形式。请记住，云端的故障是可以预期的，运行你程序的虚拟机（`VM`）可能在任何时候被清除，然后在另一台\
  \ `VM` 上重新构建。因此，你的程序需要是可移植的，并能够从此类事件中恢复。\n\n`Scalability`（扩展性）意味着你的代码在多个客户使用时能够良好响应。例如，如果你每分钟有\
  \ 1,500 次请求，如果每个请求在 1 秒内完成并响应，那么大约是每秒 25 次并发请求。但如果你每分钟有 15,000 次请求，意味着每秒 250 次并发请求。云程序在\
  \ 25 次或 250 次并发请求下会以相同的方式响应吗？2,550 次呢？以下是一些用于管理扩展性的实用云编程模式：\n\n*   `Command and\
  \ Query Responsibility Segregation (CQRS) pattern`——该模式涉及读取数据的操作与修改或更新数据操作的分离。\n\
  *   `Materialized View pattern`（物化视图模式）——通过修改存储结构来反映数据查询模式。例如，为特定的高频查询创建视图可以实现更高效的查询。\n\
  *   `Sharding pattern`（分片模式）——将你的数据拆分为多个水平或垂直分片，每个分片包含独特的数据子集，而不是通过增加硬件容量进行垂直扩展。\n\
  *   `Valet Key pattern`（管家钥匙模式）——赋予客户端直接访问数据存储的权限，用于流传输或上传大文件。与其让 Web 客户端管理数据存储的门禁，不如为客户端提供\
  \ `Valet Key` 以及直接访问数据存储的权限。\n\n`Resiliency`（韧性）指的是你的程序对服务故障和异常的响应及恢复能力。从历史上看，IT\
  \ 基础设施侧于故障预防，对停机的接受度降至最低，99.99% 或 99.999% 的 `SLAs`（服务水平协议）是预期。然而，在云端运行程序需要可靠性的思维转变，即一种拥抱失败并明确面向恢复而非预防的思维。拥有数据库、存储、网络和第三方服务等多个依赖项（其中某些服务可能没有\
  \ `SLA`），这需要这种视角的转变。对于停机或不被视为正常运行的情况，做出友好的响应将使你的云程序具有韧性。以下是一些用于将韧性嵌入你的云程序中的实用云编程模式：\n\
  \n*   `Circuit Breaker pattern`（断路器模式）——这是一种感知远程服务状态的代码设计，只有在服务可用时才会尝试建立连接。这避免了在通过之前的故障已知远程服务不可用时，仍然尝试请求并浪费\
  \ CPU 周期。\n*   `Health Endpoint Monitoring pattern`（健康端点监控模式）——通过实现端点监控来检查云应用程序在功能上是否可用状态。\n\
  *   `Retry pattern`（重试模式）——在瞬态异常或失败后重试请求。该模式在给定的时间范围内重试次数，并在超过重试阈值时停止。\n*   `Throttling\
  \ pattern`（节流模式）——管理云程序的消耗，以确保满足 `SLAs` 并让程序在高负载下保持功能正常。\n\n使用本节描述的一种种或多种模式将有助于你的云迁移更具成功。所讨论的模式通过提高程序的扩展性和韧性，增强了程序的易用性。这反过来又为用户或客户带来了更愉悦的体验。\n\
  \n## 使用 MICROSOFT AZURE C# 库创建存储容器\n\n尽管有许多云提供商，但本章和下一章示例中使用的云提供商是微软。微软提供的云平台称为\
  \ `Azure`。`Azure` 拥有许多不同的功能。例如，`IaaS` 服务称为 `Azure VM`，`PaaS` 服务称为 `Azure App Services`。此外，微软还有用于数据库的\
  \ `SQL Azure`、用于用户身份验证的 `Azure Active Directory` 以及用于存储 `BLOBs` 的 `Azure storage`。\n\
  \n以下两个练习将演示创建一个 `Azure` 存储账户和一个 `Azure` 存储容器。创建完成后，使用 `Azure Storage SDK for .NET`\
  \ 将 52 张扑牌图像存储在容器中。在下一节中，你将创建一个 `ASP.NET Core Web Application` 来访问存储在 `Azure` 存储容器中的图像。然后，遵循书中的牌牌主题，`ASP.NET\
  \ Core Web Application` 将发出一手扑牌。扑牌图像就是存储在 `Azure` 存储容器中的 `blobs`。\n\n现在，微软 `Azure`\
  \ 存储账户和容器已经创建并加载了 52 张扑牌的图像，你可以创建一个 `ASP.NET Core Web Application` 来引用微软 `Azure`\
  \ 存储容器。\n\n## 创建使用存储容器的 ASP.NET CORE WEB APPLICATION\n\n我们在上一节中已经检查了 `ASP.NET` 主题，所以如果你跳过了那节，可以考虑在继续之前阅读它。为了重申上一节的一些内容，请记住\
  \ Web 应用程序会导致服务器向客户端发送 HTML 代码。代码显示在 `Microsoft Edge` 或 `Google Chrome` 等浏览器中。当用户在浏览器中输入\
  \ URL 字符串时，会向服务器发送 HTTP 请求。HTTP 请求包含所请求的文件，以及标识应用程序、客户端支持的语言等附加信息。服务器返回包含 HTML 代码的\
  \ HTTP 响应，浏览器解析并向用户显示文本框、按钮和列表。\n\n`ASP.NET` 是一种使用服务器端代码动态创建网页的技术。这些网页的开发方式与客户端\
  \ Windows 程序有许多相似之处。与其直接处理 HTTP 请求和响应并手动创建发送到客户端的 HTML 代码，不如使用 `TextBox`、`Label`、`ComboBox`\
  \ 和 `Calendar` 等控件。\n\n\n\n\n要理解 ASP.NET 运行时是如何运作的，请考虑来自浏览器的典型 Web 请求（参见图 19-11）。客户端向服务器请求文件，例如\
  \ `default.aspx` 或 `index.cshtml`。ASP.NET Web Form 通常具有 `.aspx` 文件扩展名（ASP.NET MVC\
  \ 没有扩展名，即无扩展名），而 `.cshtml` 用于 Razor Pages。由于这些文件扩展名已经在 IIS 中注册或被 IIS Express 识别，ASP.NET\
  \ 运行时和 ASP.NET 工作进程便进入了场景。IIS 工作进程名为 `w3wp.exe`，它是你在 Web 服务器上应用程序的宿主。当对 `index.cshtml`\
  \ 文件发起首次请求时，ASP.NET 解析器启动，编译器将该文件与 `.cshtml` 文件关联的 C# 代码一起编译，并创建一个程序集。然后，.NET 运行时的即时（JIT）编译器会将该程序集编译为原生代码。不过，程序集会被保留供后续请求使用，因此没有必要再次编译程序集。\n\
  \n现在你已经对 Web 应用程序和 ASP.NET 是什么有了基本的了解，请执行以下“尝试一下”中的步骤。\n\n![来自浏览器的典型 Web 请求的示意图。](img/c19f011.png)\n\
