  \n[**图 11-7**]\n\n#### IComparable 和 IComparer 接口\n\n`IComparable` 和 `IComparer`\
  \ 接口是 .NET 框架中比较对象的标准方法。接口之间的区别如下：\n\n*   `IComparable` 实现于比较对象的类中，允许该对象与另一个对象进行比较。\n\
  \n*   `IComparer` 实现于独立的类中，允许任意两个对象之间进行比较。\n\n通常，你通过使用 `IComparable` 为类提供默认比较代码，而使用其他类提供非默认比较。\n\
  \n\n\n\n\n`IComparable` 暴露了单一方法 `CompareTo()`，它接受一个对象并返回一个小于零、等于零或大于零的结果，以指示第一个项目是小于、等于还是大于第二个对象。例如，你可以以此方式实现它，以便你向它传递一个\
  \ `Person` 对象并判断该人员是否比当前人员大或小。事实上，此方法返回一个 `int`，因此你也可以确定第二个人比第一个人大或小多少岁：\n\n```\n\
  if (person1.CompareTo(person2) == 0)\n{\n   Console.WriteLine(\"Same age\");\n}\n\
  else if (person1.CompareTo(person2)> 0)\n{\n   Console.WriteLine(\"person 1 is Older\"\
  );\n}\nelse\n{\n   Console.WriteLine(\"person1 is Younger\");\n}\n```\n\n`IComparer`\
  \ 暴露了单一方法 `Compare()`，它接受两个对象并返回一个整数结果，就像 `CompareTo()` 一样。对于支持 `IComparer` 的对象，可以使用下面的代码：\n\
  \n```\nif (personComparer.Compare(person1, person2) == 0)\n{\n   Console.WriteLine(\"\
  Same age\");\n}\nelse if (personComparer.Compare(person1, person2)> 0)\n{\n   Console.WriteLine(\"\
  person 1 is Older\");\n}\nelse\n{\n   Console.WriteLine(\"person1 is Younger\");\n\
  }\n```\n\n在两种情况下，提供给方法的参数类型都是 `System.Object`。这意味着你可以将一个对象与任何其他类型的对象进行比较，因此你通常需要在返回结果之前执行某些类型比较，甚至在使用了错误的类型时抛出异常。\n\
  \n.NET Framework 在 `System.Collections` 命名空间下的一个名为 `Comparer` 的类包含了 `IComparer`\
  \ 接口的默认实现。该类可以对简单类型进行特定文化的比较，也可以对任何支持 `IComparable` 接口的类型进行比较。例如，你可以配合以下代码使用：\n\n\
  ```\nstring firstString = \"First String\";\nstring secondString = \"Second String\"\
  ;\nConsole.WriteLine($\"Comparing '{firstString}' and '{secondString}', \" +\n \
  \                 $\"result: {Comparer.Default.Compare(firstString, secondString)}\"\
  );\nint firstNumber = 35;\nint secondNumber = 23;\nConsole.WriteLine($\"Comparing\
  \ '{firstNumber}' and '{ secondNumber }', \" +\n                  $\"result: {Comparer.Default.Compare(firstNumber,\
  \ secondNumber)}\");\n```\n\n这使用了 `Comparer.Default` 静态成员来获取 `Comparer` 类的实例，然后使用\
  \ `Compare()` 方法比较两个字符串，然后比较两个整数。\n\n结果如下：\n\n```\nComparing 'First String' and\
  \ 'Second String', result: -1\nComparing '35' and '23', result: 1\n```\n\n由于 F 在字母表中排在\
  \ S 之前，它被认为“小于” S，因此第一次比较的结果为 −1。同样，35 大于 23，因此结果为 1。注意，结果并不表示差异的幅度。\n\n使用 `Comparer`\
  \ 时，你必须使用可以比较的类型。例如，尝试比较 `firstString` 和 `firstNumber` 将产生异常。\n\n以下是关于该类行为的更多几点：\n\
  \n*   传递给 `Comparer.Compare()` 的对象将经过检查，以确定它们是否支持 `IComparable`。如果是，则使用该实现。\n* \
  \  允许空值，并将其解释为“小于”任何其他对象。\n*   字符串根据当前文化进行处理。要根据不同的文化（或语言）处理字符串，必须使用其构造函数实例化 `Comparer`\
  \ 类，这允许你传递一个指定要用文化的 `System.Globalization.CultureInfo` 对象。\n*   字符串以区分大小写的方式进行处理。要以不区分大小写的方式处理它们，你需要使用\
  \ `CaseInsensitiveComparer` 类，否则它的工作方式完全相同。\n\n### 排序集合\n\n许多集合类都允许排序，既可以通过对象之间的默认比较，也可以通过自定义方法。`ArrayList`\
  \ 就是一个例子。它包含 `Sort()` 方法，该方法可以在不带参数的情况下（在这种情况下将使用默认比较），或者传递一个 `IComparer` 接口来比较成对的对象。\n\
  \n当你有一个填充了简单类型（如整数或字符串）的 `ArrayList` 时，使用默认比较器就足够了。对于你自己的类，你必须在类定义中实现 `IComparable`，或者创建一个支持\
  \ `IComparer` 的独立类用于比较。\n\n注意，`System.Collections` 命名空间中的某些类（包括 `CollectionBase`）没有暴露排序方法。如果你想对从自该类的派生集合进行排序，你必须多做一些工作并自己对内部的\
  \ `List` 集合进行排序。\n\n下面的“尝试一下”显示了如何使用默认和非默认比较器对列表进行排序。\n\n## 转换\n\n为止，你每需要将一种类型转换为另一种类型时都使用了强制转换，但这不是处理此问题的唯一方法。就像\
  \ `int` 在计算过程中隐式转换为 `long` 或 `double` 一样，你可以定义你创建的类如何转换为其他类（隐式或显式地）。要实现这一点，你需要重载转换操作符，就像在本章前面的部分重载其他运算符一样。你将在本节的第一部分看到。你还会看到另一个有用的运算符，`as`\
  \ 运算符，在通常情况下它比强制转换更优。\n\n### 重载转换操作符\n\n除了前面所示的数学和逻辑运算符外，你还可以定义两个类型之间的隐式和显式转换。如果你想转换没有关系的类型，这是必要的。\n\
  \n假设你定义了 `ConvClass1` 和 `ConvClass2` 之间的隐式转换。这意味着你可以编写如下代码：\n\n```\nConvClass1 op1\
  \ = new ConvClass1();\nConvClass2 op2 = op1;\n```\n\n或者，你可以定义显式转换：\n\n```\nConvClass1\
  \ op1 = new ConvClass1();\nConvClass2 op2 = (ConvClass2)op1;\n```\n\n作为示例，考虑以下代码：\n\
  \n```\npublic class ConvClass1\n{\n   public int val;\n   public static implicit\
  \ operator ConvClass2(ConvClass1 op1)\n   {\n      ConvClass2 returnVal = new ConvClass2();\n\
  \      returnVal.val = op1.val;\n      return returnVal;\n   }\n}\npublic class\
  \ ConvClass2\n{\n   public double val;\n   public static explicit operator ConvClass1(ConvClass2\
  \ op1)\n   {\n      ConvClass1 returnVal = new ConvClass1();\n      checked {returnVal.val\
  \ = (int)op1.val};\n      return returnVal;\n   }\n}\n```\n\n在这里，`ConvClass1` 包含\
  \ `int` 值，`ConvClass2` 包含 `double` 值。由于 `int` 值可以隐式转换为 `double` 值，你可以定义 `ConvClass1`\
  \ 和 `ConvClass2` 之间的隐式转换。然而，反之则不然，并且你应该将 `ConvClass2` 到 `ConvClass1` 的转换运算符定义为显式。\n\
  \n使用所示的 `implicit` 和 `explicit` 关键字来指定。使用这些类时，以下代码是正常的：\n\n```\nConvClass1 op1 =\
  \ new ConvClass1();\nop1.val = 3;\nConvClass2 op2 = op1;\n```\n\n然而，相反方向的转换需要下面的显式强制转换：\n\
  \n```\nConvClass2 op2 = new ConvClass2();\nop2.val = 3;\nConvClass1 op1 = (ConvClass1)op2;\n\
  ```\n\n由于你在显式转换使用了 `checked` 关键字，上述代码将产生异常，因为 `op1` 的 `val` 属性无法放入 `op2` 的 `val`\
  \ 属性。\n\n### as 运算符\n\n`as` 运算符将类型转换为指定的引用类型，使用以下语法：\n\n```\n<operand> as <type>\n\
  ```\n\n这在某些情况下是可能的：\n\n*   如果 `<` **`operand`** `>` 的类型是 `<` **`type`** `>`\n\n\n\
  \n\n\n*   如果 `<operand>` 可以隐式转换为类型 `<type>`\n*   如果 `<operand>` 可以装箱（boxed）为类型 `<type>`\n\
  \n如果无法从 `<operand>` 到 `<type>` 的转换，则表达式的结果将为 `null`。\n\n通过显式转换可以将基类类转换为派生类，但这种方法并不总是有效。考虑上一个示例中的两个类\
  \ `ClassA` 和 `ClassD`，其中 `ClassD` 继承自 `ClassA`：\n\n```\n class ClassA : IMyInterface\
  \ {}\n   class ClassD : ClassA {}\n```\n\n以下代码使用 `as` 运算符将存储在 `obj1` 中的 `ClassA`\
  \ 实例转换为 `ClassD` 类型：\n\n```\nClassA obj1 = new ClassA();\nClassD obj2 = obj1 as\
  \ ClassD;\n```\n\n这将导致 `obj2` 为 `null`。\n\n然而，通过多态，可以将 `ClassD` 实例存储在 `ClassA` 类型变量中。以下代码说明了如何使用\
  \ `as` 运算符将包含 `ClassD` 类型实例的 `ClassA` 类型变量转换为 `ClassD` 类型：\n\n```\nClassD obj1 =\
  \ new ClassD();\nClassA obj2 = obj1;\nClassD obj3 = obj2 as ClassD;\n```\n\n这一次，结果是\
  \ `obj3` 最终包含与 `obj1` 相同的对象引用，而不是 `null`。\n\n此功能使得 `as` 运算符变得特别有用，因为以下代码（使用简单的强制转换）会导致抛出异常：\n\
  \n```\nClassA obj1 = new ClassA();\nClassD obj2 = (ClassD)obj1;\n```\n\n该代码的 `as`\
  \ 等等实现方式会将 `null` 值赋值给 `obj2`——而不会抛出异常。这意味着像下面的代码（使用本章之前开发的两个类：`Animal` 和派自 `Animal`\
  \ 的派生类 `Cow`）在 C# 应用中非常常见：\n\n```\npublic void MilkCow(Animal myAnimal)\n{\n   Cow\
  \ myCow = myAnimal as Cow;\n   if (myCow != null)\n   {\n      myCow.Milk();\n \
  \  }\n   else\n   {\n     Console.WriteLine($\"{myAnimal.Name} isn't a cow, and\
  \ so can't be milked.\");\n   }\n}\n```\n\n### 练习题\n\n1. **11.1** 创建一个名为 `People`\
  \ 的集合类，它是以下 `Person` 类的集合。集合中的项可以通过一个字符串索引器访问，该索引器的键为人的姓名，与 `Person.Name` 属性相同。\n\
  \n```\npublic class Person\n{\n   private string name;\n   private int age;\n  \
  \ public string Name\n   {\n      get { return name; }\n      set { name = value;\
  \ }\n   }\n   public int Age\n   {\n      get { return age; }\n      set { age =\
  \ value; }\n   }\n}\n```\n\n2. **11.2** 扩展上一个练习中的 `Person` 类，重载 `>`, `<`, `>=`,\
  \ `<=` 运算符，并比较 `Person` 实例的 `Age` 属性。\n\n3. **11.3** 在 `People` 类中添加一个 `GetOldest()`\
  \ 方法，返回一个具有最大 `Age` 属性的 `Person` 对象数组（一个或多个对象，因为多个项可能具有该属性的相同值），使用练习 11.2 中定义的重载运算符。\n\
  \n4. **11.4** 在 `People` 类上实现 `ICloneable` 接口以提供深拷贝能力。\n\n5. **11.5** 在 `People`\
  \ 类中添加一个迭代器，使你能够如下所示通过 `foreach` 循环获取所有成员的年龄：\n\n```\nforeach (int age in myPeople.Ages)\n\
  {\n   // Display ages.\n}\n```\n\n练习题的答案可以在附录中找到。\n\n## ▸ 你在本章中学到的知识\n\n| 核心概念 |\
  \ 描述 |\n| --- | --- |\n| 定义集合 | 集合是可以包含其他实例的类。你可以通过派生 `CollectionBase` 来定义集合，或者自己实现集合接口（如\
  \ `IEnumerable`、`ICollection` 和 `IList`）。通常，你会为你的集合定义一个索引器，以便使用 `collection[index]`\
  \ 语法访问成员。 |\n| 字典 | 你还可以定义键值集合（即字典），其中每个项都有一个关联的键。在这种情况下，可以使用键来识别项，而不是使用项的索引。你可以通过实现\
  \ `IDictionary` 或派生自 `DictionaryBase` 类来定义字典。 |\n| 迭代器 | 你可以实现一个迭代器来控制循环代码如何在循环周期中获取值。要遍历一个类，请实现一个返回类型为\
  \ `IEnumerator` 的 `GetEnumerator()` 方法。要遍历类的成员（例如方法），请使用返回类型为 `IEnumerable`。在迭代器代码块中，使用\
  \ `yield return` 关键字返回值。 |\n| 类型比较 | 你可以使用 `GetType()` 获取对象的类型，或使用 `typeof()` 获取类型。你还可以使用\
  \ `is` 来判断对象是否与特定类型兼容。 |\n| 值比较 | 如果你想让类的实例可以使用标准运算符进行进行操作，那么你就必须重载这些运算符。对于其他类型的值比较，可以使用\
  \ `IComparable` 或 `IComparer` 接口，它们对于排序特别有用。 |\n| `as` 运算符 | 你可以使用 `as` 运算符将值转换为引用类型。如果无法转换，`as`\
  \ 运算符将返回 `null` 值。 |\n\n\n\n\n\n*   使用你已经创建过的集合类，该类可以包含新类型的项。\n*   创建一个新的集合类，它可以容纳新类型的项，并实现所有需要的方法。\n\
  \n通常情况下，对于一个新类型，你需要额外的功能，因此在大多数情况下，你仍然需要一个新的集合类。因此，创建集合类会占据你相当的时间！\n\n相反，泛型类让编码变得简单许多。泛型类根据你在实例化时提供的任何类型（或多个类型）构建，使你能够几乎毫不费力地对对象进行强类型处理。在集合上下文中，创建一个“类型为\
  \ `T` 的对象的集合”就像口说的那样简单——并且可以通过一行代码实现。与其像这样的代码：\n\n```\nCollectionClass items = new\
  \ CollectionClass();\nitems.Add(new ItemClass());\n```\n\n你可以使用这个：\n\n```\nCollectionClass<ItemClass>\
  \ items = new CollectionClass<ItemClass>();\nitems.Add(new ItemClass());\n```\n\n\
  尖括号语法是向泛型传递类型参数的方法。在前面的代码中，将 `CollectionClass<ItemClass>` 读取为 `ItemClass` 类型的 `CollectionClass`。当然，你将在本章稍后的部分详细检查这种语法。\n\
  \n泛型的主题不仅限于集合，但它们特别适用于这一领域，正如你在本章稍后查看 `System.Collections.Generic` 命名空间时将会看到的。通过创建泛型类，你可以生成具有签名的方法，可以对你需要的任何类型进行强类型，甚至可以考虑到类型可以是值类型或引用类型的事实，并对发生的单个情况进行处理。你甚至可以通过限制实例化泛型类的类型为支持给定接口或派生自特定类型的类型，来只允许某些子集类型被使用。此外，你并不限于泛型类——你还可以创建泛型接口、泛型方法（可以定义在非泛型类中），甚至泛型委托。这一切为你的代码增添了极大的灵活性，明智地使用泛型可以消除数小时的开发时间。\n\
  \n你可能在想这一切是如何实现的。通常，当你创建一个类时，它会被编译成一种类型，然后你可以在代码中使用该类型。你可能认为，当你创建一个泛型类时，它必须被编译成大量的类型，以便你实例化它。幸运的是，情况并非如此——考虑到\
  \ .NET 中可能的类数量是无限的，这样也很好。在幕后，.NET 运行时允许在你需要时动态生成泛型类。一个给定的 `B` 泛型类 `A` 在你通过实例化来请求它之前是不存在的的。\n\
  \n# 使用泛型\n\n在查看如何创建自己的泛型类型之前，查看由 .NET Framework 提供的类型是值得的。这些类型包括 `System.Collections.Generic`\
  \ 命名空间中的类型，你在代码中多次见过这个命名空间，因为控制台应用程序默认包含了它。你尚未使用过该命名空间中的任何类型，但情况即将发生变化。本节介绍了该命名空间中的类型，以及你如何使用它们来创建强类型集合并改进你现有集合的功能。\n\
  \n首先，你将查看另一个简单的泛型类型，它规避了值类型的一个小问题：可空类型。\n\n### 可空类型\n\n在早的章节中，你看到值类型（包括大多数基本类型，如\
  \ `int` 和 `double` 以及所有结构体）与引用类型（`string` 和任何类）的区别之一是，它们必须包含一个值。引用类型在声明之后、赋值之前可以处于未赋值状态，但你无法以任何方式利用该状态下的值类型。相反，引用类型可以为\
  \ `null`。\n\n有时（这种情况发生比你想象的要频繁，特别是当你处理数据库时），一个可以为 `null` 的值类型是有用的。泛型提供了一种使用 `System.Nullable<T>`\
  \ 类型来实现的方法，如下所示：\n\n```\nSystem.Nullable<int> nullableInt;\n```\n\n这段代码声明了一个名为 `nullableInt`\
  \ 的变量，它可以具有 `int` 变量的任何值，加上 `null` 值。这使你能够编写如下代码：\n\n```\nnullableInt = null;\n\
  ```\n\n如果 `nullableInt` 是一个 `int` 类型变量，那么前面的代码将无法编译。\n\n前面的赋值等同于以下：\n\n```\nnullableInt\
  \ = new System.Nullable<int>();\n```\n\n与任何其他变量一样，你不能在初始化之前使用它，无论是通过之前显示的任何语法设置为\
  \ `null`，还是通过赋值一个值。\n\n你可以测试可空类型以判断它们是否为 `null`，就像测试引用类型一样：\n\n```\nif (nullableInt\
  \ == null)\n{\n   …\n}\n```\n\n或者，你可以使用 `HasValue` 属性：\n\n```\nif (nullableInt.HasValue)\n\
  {\n   …\n}\n```\n\n这对于引用类型不起作用，即使它有自己的 `HasValue` 属性，因为一个具有 `null` 值的引用类型变量意味着没有对象可以访问此属性，并且会抛出异常。\n\
  \n你还可以通过 `Value` 属性查看可空类型的值。如果 `HasValue` 为 `true`，则可以保证获得一个非 `null` 值；如果 `HasValue`\
  \ 为 `false`——即分配了 `null`——那么访问 `Value` 将导致异常。\n\n可空类型非常有用，以至于导致了 C# 语法的修改。与其使用之前显示的语法来声明可空类型，你反而可以使用：\n\
  \n```\nint? nullableInt;\n```\n\n`int?` 只是 `Nullable<int>` 的简写，但更易读。\n\n#### 运算符与可空类型\n\
  \n对于简单类型（如 `int`），你可以使用 `+`、`-` 等运算符处理值。对于可空类型等价项，没有区别：可空类型包含的值会被转换为所需的类型，并使用相应的运算符。这同样适用于提供的带有运算符的结构体：\n\
  \n```\nint? op1 = 5;\nint? result = op1 * 2;\n```\n\n注意，这里的 `result` 变量也是 `int?`\
  \ 类型。以下代码将无法编译：\n\n```\nint? op1 = 5;\nint result = op1 * 2;\n```\n\n为了使其工作，你必须执行显式转换或通过\
  \ `Value` 属性访问值，这需要如下代码：\n\n```\nint? op1 = 5;\nint result = (int)op1 * 2;\n```\n\
  \n或者：\n\n```\nint? op1 = 5;\nint result = op1.Value * 2;\n```\n\n如果 `op1` 有值，这种方法运行良好——如果它是\
  \ `null`，你将得到 `System.InvalidOperationException` 异常。这产生了一个明显的问题：当涉及两个可空值的运算符评估中，一个或两个值为\
  \ `null` 时会发生什么？例如以下代码中的 `op1`：\n\n```\nint? op1 = null;\nint? op2 = 5;\nint? result\
  \ = op1 * op2;\n```\n\n答案是，对于除 `bool?` 之外的所有简单可空类型，操作的结果都是 `null`，你可以将其解释为“无法计算”。\n\
  \n```\nbool? maybe = null;\nbool? yes = true;\nbool? result = yes | maybe; // result\
  \ 为 true.\n```\n\n\n\n\n对于结构体（structs），你可以定义自己的操作符来处理这种情况（如本章稍后部分所示），而对于 `bool?`，定义了\
  \ `&&` 和 `||` 的运算符，这些运算符可能会导致非 `null` 返回值。表格中的结果在逻辑上是完全合理的——如果有足够的信息可以得出计算结果，而无需知道其中一个操作数的值，那么该操作数是否为\
  \ `null` 并不重要。\n\n## ?? 运算符\n\n为了进一步减少处理可空类型所需的代码量，并更更容易处理可能为 `null` 的变量，你可以使用 `??`\
  \ 运算符。它被称为空合并运算符，是一个二元运算符，允许为可能求值为 `null` 的表达式提供一个备用值。如果第一个操作数不是 `null`，则运算符求值为第一个操作数；如果第一个操作数为\
  \ `null`，则求值为第二个操作数。在功能上，以下两个表达式是等价的：\n\n```\nop1 ?? op2\nop1 == null ? op2 : op1\n\
  ```\n\n在这段代码中，`op1` 可以任何可空表达式，包括引用类型，更重要的是，包括可空类型。这意味着你可以使用 `??` 运算符在可空类型为 `null`\
  \ 时提供使用的默认值，如下：\n\n```\nint? op1 = null;\nint result = op1 * 2 ?? 5;\n```\n\n因为在示例中\
  \ `op1` 是 `null`，所以 `op1 * 2` 也会是 `null`。然而，`??` 运算符检测到了这一点并将值 `5` 赋值给 `result`。重要的是，注意这里不需要将结果放入\
  \ `int` 类型变量 `result` 中显式转换。`??` 运算符为你处理了这一转换。或者，你也可以轻松地将 `??` 评估的结果传递给 `int?` 而不会出现问题：\n\
  \n```\nint? result = op1 * 2 ?? 5;\n```\n\n这种行为使得 `??` 运算符在处理可空变量时非常非常多功能，并且是一种提供默认值的方便方法，而无需使用\
  \ `if` 结构中的代码块或经常令人困惑的三元运算符。\n\n## ?. 运算符\n\n该运算符被称为空条件成员访问运算符，通常称为“埃尔斯运算符”（Elvis\
  \ operator），有助于克服由繁琐的空检查引起的代码歧义。例如，如果你想获取给定客户的订单计数，你需要在设置计数值之前检查是否为空：\n\n```\nint\
  \ count = 0;\nif (customer.orders ! = null)\n{\n  count = customer.orders.Count();\n\
  }\n```\n\n如果你直接编写这段代码且该客户没有订单（即它为 `null`），则会抛出 `System.ArgumentNullException` 异常：\n\
  \n```\nint count = customer.orders.Count();\n```\n\n使用 `?.` 运算符会导致 `int? count`\
  \ 被设置为 `null` 而不是发生异常：\n\n```\nint? count = customer.orders?.Count();\n```\n\n将上一节讨论的空合并运算符\
  \ `??` 与空条件运算符 `?.` 结合，可以在结果为 `null` 时设置默认值：\n\n```\nint? count = customer.orders?.Count()\
  \ ?? 0;\n```\n\n空条件运算符的另一个用途是触发事件。事件将在第 13 章中详细讨论。触发事件的最常见方法是使用这种代码模式：\n\n```\n\
  var onChanged = OnChanged;\nif (onChanged != null)\n{\n  onChanged(this, args);\n\
  }\n```\n\n这种模式不是线程安全的，因为有人可能在空检查完成后立即取消订阅最后一个事件处理程序。当这种情况发生时，会抛出异常并导致应用程序崩溃。可以通过以下方式避免这种情况：在检查之前复制委托引用（如上一个代码段所示\
  \ `var onChanged = onChanged;`），或者像此处所示使用空条件运算符：\n\n```\nOnChanged?.Invoke(this,\
  \ args);\n```\n\n正如在第 11 章中提到的，使用 `?.` 运算符配合 `==` 运算符重载，在 `C:\\BeginningCSharpAndDotNET\\\
  Chapter12\\Ch12CardLib\\Card.cs` 类中检查空值，以防止在使用该方法时抛出异常。例如：\n\n```sharp\npublic static\
  \ bool operator ==(Card card1, Card card2) \n        => (card1?.suit == card2?.suit)\
  \ && (card1?.rank == card2?.rank);\n```\n\n通过在语句中包含空条件运算符，你实际上是在表达如果左侧的对象不是 `null`（在这种情况下为\
  \ `card1` 或 `card2`），则获取右侧的内容。如果左侧的对象是 `null`（即 `card1` 或 `card2`），则终止访问链并返回 `null`。\n\
  \n## 使用可空类型\n\n使用下面的“尝试一下”（Try It Out）来实验可空 `Vector` 类型。\n\n## System.Collections.Generic\
  \ 命名空间\n\n在书中目前使用的每个应用程序中，你都看到了 `System` 命名空间。这里显示并在列表中解释了许多其他常用的命名空间：\n\n```\n\
  using System;\nusing System.Collections.Generic;\nusing System.Linq;\nusing System.Text;\n\
  using System.Threading.Tasks;\nusing static System.Console;\n```\n\n- `System` 命名空间包含了\
  \ .NET 中使用的大多数基本类型。\n- `System.Collections.Generic` 命名空间包含了处理集合的泛型类型，通常配合 `using`\
  \ 语句使用。\n- 你将在稍后查看 `System.Linq` 命名空间。\n- `System.Text` 命名空间包含了与字符串处理和编码相关的类型。\n\
  - `System.Threading.Tasks` 命名空间包含了帮助你编写异步代码的类型，书中书中未涵盖。\n- `using static System.Console`\
  \ 声明在编写控制台应用程序时很有帮助。手动添加后，你就不需要反复编写 `Console.WriteLine()` 和 `ReadLine()`。\n\n你现在将查看一些泛型集合类型，它们将让你的工作变得更容易。它们让你几乎毫不费力就能创建强类型集合类。例如，表\
  \ 12-1](#c12.xhtml_c12-0001) 列出了 `System.Collections.Generic` 命名空间中的类型。该命名空间的更多类型将在本章稍后介绍。\n\
  \n| 类型 | 描述 |\n| --- | --- |\n| `List<T>` | `T` 对象集合 |\n| `Dictionary<K, V>` | 与\
  \ `K` 类型键关联的 `V` 类型项集合 |\n\n**表 12-1](#c12.xhtml_R_c12-0001)：泛型类型**\n\n本节还描述了用于这些类的各种接口和委托。\n\
  \n### List<T>\n\n与其派生自 `CollectionBase` 并像你在上一章那样实现所需的方法，不如直接使用 `List<T>` 泛型集合类型更快、更简单。这里额外的好处是许多你通常需要实现的方法（如\
  \ `Add()`）已经为你实现了。\n\n创建一个类型为 `T` 的集合需要以下代码：\n\n```\nList<T> myCollection = new\
  \ List<T>();\n```\n\n仅此而已。你不需要定义任何类、实现任何方法或进行任何其他操作。你也可以通过向构造函数传递 `List<T>` 对象来设置集合的初始列表。`List<T>`\
  \ 还具有 `Item` 属性，允许使用索引器进行数组数组访问：\n\n```\nT itemAtIndex2 = myCollectionOfT[2];\n\
  ```\n\n该类支持许多其他方法，但对于入门来说已经足够了。下面的“尝试一下”演示了如何在实践中使用 `List<T>`。\n\n#### 泛型列表的排序与搜索\n\
  \n\n\n\n\n对泛型列表进行排序与对任何其他列表非常相似。上一章描述了如何使用 `IComparer` 和 `IComparable` 接口来比较两个对象，从而对该类型的对象列表进行排序。这里的区别在于你可以使用泛型接口\
  \ `IComparer<T>` 和 `IComparable<T>`，它们暴露了略有不同且特定于类型的方法。表 12-2 解释了这些差异。\n\n| 泛型方法\
  \ | 非泛型方法 | 差异 |\n| --- | --- | --- |\n| `int IComparable<T>.CompareTo(T otherObj)`\
  \ | `int IComparable.CompareTo(object otherObj)` | 泛型版本中是强类型的。 |\n| `bool IComparable<T>.Equals(T\
  \ otherObj)` | N/A | 非泛型接口上不存在；可以重写继承的 `object.Equals()`。 |\n| `int IComparer<T>.Compare(T\
  \ objectA, T objectB)` | `int IComparer.Compare(object objectA, object objectB)`\
  \ | 泛型版本中是强类型的。 |\n| `bool IComparer<T>.Equals(T objectA, T objectB)` | N/A | 非泛型接口上不存在；可以重写继承的\
  \ `object.Equals()`。 |\n| `int IComparer<T>.GetHashCode(T objectA)` | N/A | 非泛型接口上不存在；可以重写继承的\
  \ `object.GetHashCode()`。 |\n\n**表 12-2:** 使用泛型类型进行排序\n\n要排序 `List<T>`，你可以为待排序的类型提供\
  \ `IComparable<T>` 接口，或者提供一个 `IComparer<T>` 对象。或者，你可以提供一个*泛型委托*作为排序方法。从代码工作原理的角度来看，这更有趣，因为实现这里描述的接口并不比实现它们的非泛型版本花费更多精力。\n\
  \n总的来说，排序列表只需要一个比较两个 `T` 类型对象的方法；而搜索只需要一个检查 `T` 类型对象以确定其是否符合某些标准的方法。定义此类方法是非常简单的事，为了帮助你，这里可以使用两种泛型委托类型：\n\
  \n*   `Comparison<T>`——一种用于排序方法的委托类型，具有以下返回类型和参数：\n\n    ```\n    int method(T objectA,\
  \ T objectB)\n    ```\n\n*   `Predicate<T>`——一种用于搜索方法的委托类型，具有以下返回类型和参数：\n\n    ```\n\
  \    bool method(T targetObject)\n    ```\n\n你可以定义任意数量此类方法，并使用它们“插拔”到 `List<T>`\
  \ 的搜索和排序方法中。接下来的“尝试一试”将说明这种技术。\n\n### Dictionary<K, V>\n\n`Dictionary<K, V>` 类型允许你定义一个键值对集合。与在本章中看到的其他泛型集合类型不同，此类需要实例化两个类型：代表集合中每个项目的键类型和值类型。\n\
  \n一旦实例化了 `Dictionary<K, V>` 对象，你就可以对它进行操作，与继承自 `DictionaryBase` 的类的操作类似，但已经内置了类型安全的方法和属性。例如，你可以使用强类型的\
  \ `Add()` 方法添加键值对：\n\n```\nDictionary<string, int> things = new Dictionary<string,\
  \ int>();\nthings.Add(\"Green Things\", 29);\nthings.Add(\"Blue Things\", 94);\n\
  things.Add(\"Yellow Things\", 34);\nthings.Add(\"Red Things\", 52);\nthings.Add(\"\
  Brown Things\", 27);\n```\n\n不使用 `Add()` 方法也可以实现键值对的初始化，并且看起来更优雅：\n\n```\nDictionary<string,\
  \ int> things = new Dictionary<string, int>(){\n    {\"Green Things\", 29},\n  \
  \  {\"Blue Things\", 94},\n    {\"Yellow Things\", 34},\n    {\"Red Things\", 52},\n\
  \    {\"Brown Things\", 27}\n};\n```\n\n通过 `Keys` 和 `Values` 属性遍历集合中的键和值：\n\n```\n\
  foreach (string key in things.Keys)\n{\n   Console.WriteLine(key);\n}\nforeach (int\
  \ value in things.Values)\n{\n   Console.WriteLine(value);\n}\n```\n\n此外，通过获取每个项目作为\
  \ `KeyValuePair<K, V>` 实例来遍历集合中的项目，就像在上一章中对 `DictionaryEntry` 对象所做的一样：\n\n```\n\
  foreach (KeyValuePair<string, int> thing in things)\n{\n   Console.WriteLine($\"\
  {thing.Key} = {thing.Value}\");\n}\n```\n\n关于 `Dictionary<K, V>` 需要注意的是，每个项目的键必须是唯一的。尝试添加具有相同键的项目将导致抛出\
  \ `ArgumentException` 异常。由于由于，`Dictionary<K, V>` 允许向其构造函数传递 `IComparer<K>` 接口。如果你使用自定义类作为键且它们不支持\
  \ `IComparable` 或 `IComparable<K>` 接口，或者你想使用非默认过程来比较对象，则可能是必要的。例如，在前面的示例中，你可以使用：\n\
  \n```\nDictionary<string, int> things = new Dictionary<string, int>(StringComparer.OrdinalIgnoreCase);\n\
  ```\n\n\n\n\n\n# 通用操作符\n\n### 定义泛型类\n\n要创建一个泛型类，只需在类定义中包含角括号语法即可：\n\n```cs\nclass\
  \ MyGenericClass<T> { … }\n```\n\n在这里，`T` 可以是你喜欢的任何标识符，只要遵循通常的 C# 命名规则（例如不以数字开头等）。不过，通常你只需要使用\
  \ `T` 即可。泛型类在定义中可以包含任意数量的类型参数，并用逗号分隔：\n\n```cs\nclass MyGenericClass<T1, T2, T3>\
  \ { … }\n```\n\n一旦定义了这些类型，你就可以像使用其他类型一样在类定义中使用它们。你可以将它们用成员变量的类型、属性或方法等成员的返回类型，以及方法参数的类型：\n\
  \n```cs\nclass MyGenericClass<T1, T2, T3>\n{\n   private T1 innerT1Object;\n   public\
  \ MyGenericClass(T1 item)\n   {\n      innerT1Object = item;\n   }\n   public T1\
  \ InnerT1Object\n   {\n      get { return innerT1Object; }\n   }\n}\n```\n\n在这里，可以将类型为\
  \ `T1` 的对象传递给构造函数，并允许通过属性 `InnerT1Object` 对该对象进行只读访问。注意，你几乎无法对传递给类的类型做出任何假设。例如，以下代码将无法编译：\n\
  \n```cs\nclass MyGenericClass<T1, T2, T3>\n{\n   private T1 innerT1Object;\n   public\
  \ MyGenericClass()\n   {\n      innerT1Object = new T1();\n   }\n   public T1 InnerT1Object\n\
  \   {\n      get { return innerT1Object; }\n   }\n}\n```\n\n由于你不知道 `T1` 是什么，因此你无法使用它的任何构造函数——它可能根本没有构造函数，或者可能没有公开访问的默认构造函数。在不涉及本节稍后所示技术的更复杂代码的情况下，你只能对\
  \ `T1` 做出以下假设：你可以将其视为要么继承自 `System.Object` 或者可以装箱为 `System.Object` 的类型。\n\n如果不使用\
  \ `reflection`（这是一种用于运行时检查类型的高级技术，反射将在第 13 章中讨论），你将被局限于不比以下更复杂的代码：\n\n```cs\n public\
  \ string GetAllTypesAsString()\n   {\n      return \"T1 = \" + typeof(T1).ToString()\n\
  \         + \", T2 = \" + typeof(T2).ToString()\n         + \", T3 = \" + typeof(T3).ToString();\n\
  \   }\n```\n\n你还可以做更多，特别是在集合方面，因为处理对象组是一个非常简单的过程，不需要对对象类型做出任何假设——这就是为什么你在本章中看到的泛型集合类存在的一个很好的理由。\n\
  \n你需要注意的另一个局限性是，只有当使用运算符 `==` 或 `!=` 比较提供给泛型类型的值与 `null` 时，才是允许的。也就是说，以下代码运行正常：\n\
  \n```cs\n public bool Compare(T1 op1, T1 op2)\n   {\n      if (op1 != null && op2\
  \ != null)\n      {\n         return true;\n      }\n      else\n      {\n     \
  \    return false;\n      }\n   }\n```\n\n在这里，如果 `T1` 是值类型，那么它被始终假设为非空，因此在前面的代码\
  \ `Compare` 将始终返回 `true`。然而，尝试比较两个参数 `op1` 和 `op2` 将导致编译失败：\n\n```cs\n public bool\
  \ Compare(T1 op1, T1 op2)\n   {\n      if (op1 == op2)\n      {\n         return\
  \ true;\n      }\n      else\n      {\n         return false;\n      }\n   }\n```\n\
  \n这是因为这段代码假设 `T1` 支持 `==` 运算符。简之，要对泛型进行任何有趣的操作，你需要对类中使用的类型进一步了解。\n\n### default\
  \ 关键字\n\n关于用于创建泛型类实例的类型，你可能想知道的最基础之一就是它们是引用类型还是值类型。在不知道这一点的情况下，你甚至无法如下代码分配 `null`\
  \ 值：\n\n```cs\n public MyGenericClass()\n   {\n      innerT1Object = null;\n   }\n\
  ```\n\n如果 `T1` 是不可空的值类型，那么 `innerT1Object` 就不能有 `null` 值，因此这段代码将无法编译。幸运的是，这个问题已经解决，产生了\
  \ `default` 关键字的新用法（你之前在书前面的 `switch` 结构中见过它的用法）。它的用法如下：\n\n```cs\n public MyGenericClass()\n\
  \   {\n      innerT1Object = default(T1);\n   }\n```\n\n结果是，如果 `innerT1Object` 是引用类型或可空值类型，则会被赋值为\
  \ `null` 值；如果是值类型，则被赋值默认值。对于数值类型，此默认值是 `0`，而结构体的每个成员都将以相同的方式初始化为 `0` 或 `null`。`default`\
  \ 关键字让你在被迫使用的类型上进行稍多操作方面更进了一步，但要真正领先，你需要对提供的类型进行约束。\n\n### 约束类型\n\n到目前为止使用的类型被称为*无界类型*（unbounded\
  \ types），因为对它们是什么类型没有任何限制。通过*约束类型*（constraining types），可以将类型限制为继承自某个特定类型。例如，以下代码将是行的：\n\
  \n```cs\nMyGenericClass<Animal> = new MyGenericClass<Animal>();\n```\n\n然而，代码将失败：\n\
  \n```cs\nMyGenericClass<string> = new MyGenericClass<string>();\n```\n\n你可以使用 `where`\
  \ 关键字对类型定义约束。在这里，`constraint` 定义了约束的内容：\n\n```cs\nclass MyGenericClass<T> where\
  \ T : constraint { … }\n```\n\n你可以通过逗号分隔这种方式提供多个约束：\n\n```cs\nclass MyGenericClass<T>\
  \ where T : constraint1, constraint2 { … }\n```\n\n你可以使用多个 `where` 语句对任意或类型定义约束：\n\
  \n```cs\nclass MyGenericClass<T1, T2> where T1 : constraint1 where T2 : constraint2\
  \ { … }\n```\n\n你使用的任何约束必须出现在继承标识符之后：\n\n```cs\nclass MyGenericClass<T1, T2> : MyBaseClass,\
  \ IMyInterface\n   where T1 : constraint1 where T2 : constraint2 { … }\n```\n\n\
  可用的约束见表 12-3。\n\n| 约束 | 定义 | 用途 |\n| --- | --- | --- |\n| `Struct` | 类型必须是不可空的值类型。\
  \ | 在需要值类型的类中工作——例如，`T` 的成员变量为 `0` 有某种意义。 |\n| `Class` | 类型必须是可空或不可空的引用类型。 | 在需要引用类型的类中工作——例如，`T`\
  \ 的成员变量为 `null` 有某种意义。 |\n| `base-class` | 类型必须是或继承自 `base-class`。你可以提供任何类名作为此约束。\
  \ | 在需要继承自 `base-class` 的某些基础功能的类中工作。 |\n| `interface` | 类型必须是或实现 `interface`。 |\
  \ 在需要 `interface` 暴露的某些基础功能的类中工作。 |\n| `new()` | 类型必须有一个公共的无参数构造函数。 | 在需要实例化类型为\
  \ `T` 的变量类中使用。 |\n\n可以通过 `base-class` 约束将一个类型参数作为另一个类型参数的约束：\n\n```cs\nclass MyGenericClass<T1,\
  \ T2> where T2 : T1 { … }\n```\n\n在这里，`T2` 必须与 `T1` 相同类型或继承自 `T1`。这被称为*裸类型约束*（naked\
  \ type constraint），意味着一个泛型类型参数被用作另一个参数的约束。\n\n循环类型约束（所示）是被禁止的：\n\n```cs\nclass MyGenericClass<T1,\
  \ T2> where T2 : T1 where T1 : T2 { … }\n```\n\n\n\n\n\n这段代码无法编译。在接下来的“尝试”（Try It\
  \ Out）中，你将定义并使用一个使用了之前章节中所示 `Animal` 类族的泛型类。\n\n## 继承泛型类\n\n上一个示例中的 `Farm<T>` 类以及本章中看到的其他几个类都继承自一个泛型。在\
  \ `Farm<T>` 的情况下，该类型是一个接口：`IEnumerable<T>`。在这里，`Farm<T>` 提供的 `T` 约束导致了 `IEnumerable<T>`\
  \ 中使用的 `T` 额外的约束。这对于约束原本无边界的类型很有用的技术。但是，你需要遵循一些规则。\n\n首先，你不能“取消”所继承基类中已约束类型的约束。换句话说，在你继承的类型使用的类型\
  \ `T`，其约束程度至少要与在该类型中的约束相等。例如，以下代码是正确的：\n\n```csharp\nclass SuperFarm<T> : Farm<T>\n\
  \      where T : SuperCow {}\n```\n\n这可以正常工作，是因为 `T` 在 `Farm<T>` 中被约束为 `Animal`，而将其约束为\
  \ `SuperCow` 是将 `T` 约束为这些值的一个子集。然而，以下代码无法编译：\n\n```csharp\nclass SuperFarm<T> :\
  \ Farm<T>\n      where T : struct{}\n```\n\n在这里，你可以明确表示提供给 `SuperFarm<T>` 的类型 `T`\
  \ 无法转换为 `Farm<T>` 可用的 `T`，因此代码无法编译。\n\n即使在约束是超集的情况下也会遇到相同的问题：\n\n```csharp\nclass\
  \ SuperFarm<T> : Farm<T>\n      where T : class{}\n```\n\n尽管 `Animal` 等类型是 `Farm<T>`\
  \ 允许的，但满足 `class` 约束的其他类型将不会被允许在 `Farm<T>` 中。同样，编译将失败。此规则适用于本章之前显示的所有约束类型。\n\n还要注意，如果你继承自泛型类型，则你必须提供所有所需的类型信息，要么如所示以其他泛型类型的形式的形式，要么显式提供。这同样适用于继承自泛型类型的非泛型类，正如你在其他地方看到的那样。这是一个示例：\n\
  \n```csharp\npublic class CardCollection : List<Card>, ICloneable{}\n```\n\n这是没问题的，但尝试以下操作将失败：\n\
  \n```csharp\npublic class CardCollection : List<T>, ICloneable{}\n```\n\n在这里，没有为\
  \ `T` 提供信息，因此无法进行编译。\n\n## 泛型运算符\n\n运算符重载在 C# 中的实现方式与其他方法一样，并且可以在泛型类中实现。例如，你可以在\
  \ `Farm<T>` 中定义以下隐式转换运算符：\n\n```csharp\npublic static implicit operator List<Animal>(Farm<T>\
  \ farm)\n{\n   List<Animal> result = new List<Animal>();\n   foreach (T animal in\
  \ farm)\n   {\n      result.Add(animal);\n   }\n   return result;\n}\n```\n\n这允许在需要时，将\
  \ `Farm<T>` 中的 `Animal` 对象直接作为 `List<Animal>` 访问。当你想要将两个 `Farm<T>` 实例相加时，这非常有用，例如使用以下运算符：\n\
  \n```csharp\npublic static Farm<T> operator +(Farm<T> farm, List<T> list)\n{\n \
  \  Farm<T> result = new Farm<T>();\n   foreach (T animal in farm)\n   {\n      result.Animals.Add(animal);\n\
  \   }\n   foreach (T animal in list)\n   {\n      if (!result.Animals.Contains(animal))\n\
  \      {\n         result.Animals.Add(animal);\n      }\n   }\n   return result;\n\
  }\npublic static Farm<T> operator +(Farm<T> farm, List<T> list) \n         => farm\
  \ + list;\n```\n\n然后你可以如下所示添加 `Farm<Animal>` 和 `Farm<Cow>` 的实例：\n\n```csharp\nFarm<Animal>\
  \ newFarm = farm + dairyFarm;\n```\n\n在此代码中，`dairyFarm`（`Farm<Cow>` 的实例）被隐式转换为 `List<Animal>`，这使得\
  \ `Farm<T>` 中重载的 `+` 运算符可以使用。\n\n你可能会认为这可以通过简单使用以下代码实现：\n\n```csharp\npublic static\
  \ Farm<T> operator +(Farm<T> farm1, Farm<T> farm2){ … }\n```\n\n然而，由于 `Farm<Cow>`\
  \ 无法转换为 `Farm<Animal>`，加法运算将失败。更进一步，你可以使用以下转换运算符来解决这个问题：\n\n```csharp\npublic static\
  \ implicit operator Farm<Animal>(Farm<T> farm)\n{\n   Farm <Animal> result = new\
  \ Farm <Animal>();\n   foreach (T animal in farm)\n   {\n      result.Animals.Add(animal);\n\
  \   }\n   return result;\n}\n```\n\n通过此运算符，`Farm<T>` 实例（如 `Farm<Cow>`）可以转换为 `Farm<Animal>`\
  \ 实例，从而解决问题。你可以使用所示的任一种方法，尽管后者由于简单而更好。\n\n## 泛型结构体\n\n你在之前的章节中了解到，结构体（structs）本质上与类相同，仅有一些细微的区别以及结构体是值类型而非引用类型。正如此，泛型结构体可以以与泛型类相同的方式创建，如下：\n\
  \n```csharp\npublic struct MyStruct<T1, T2>\n```\n\n## 定义泛型接口\n\n你现在已经见过泛型接口——例如\
  \ `System.Collections.Generic` 中的 `IEnumerable<T>`。定义泛型接口涉及与定义类相同的技术：\n\n```csharp\n\
  interface FarmingInterface<T>\n   where T : Animal\n{\n   bool AttemptBreed(T animal1,\
  \ T animal2);\n   T OldestHerd { get; }\n}\n```\n\n## 泛型方法\n\n之前的示例使用了 `GetCows()`，讨论中提到可以使用泛型方法使其更通用。泛型方法是指返回类型和参数类型由泛型参数决的方法：\n\
  \n```csharp\npublic T GetDefault<T>() => default(T);\n```\n\n这个简单的示例使用了你之前过的 `default`\
  \ 关键字为类型 `T` 返回默认值。该方法的调用如下：\n\n```csharp\nint myDefault = GetDefault<int>();\n\
  ```\n\n类型参数 `T` 在调用方法时提供的。\n\n这个 `T` 与用于类的泛型参数是完全独立的。事实上，泛型方法可以由非泛型类实现：\n\n```csharp\n\
  public class Defauler\n{\n   public T GetDefault<T>() => default(T);\n}\n```\n\n\
  但如果类是泛型的，你必须为泛型类型使用不同的标识符。以下代码无法编译：\n\n```csharp\npublic class Defauler<T>\n{\n\
  \   public T GetDefault<T>() => default(T);\n}\n```\n\n方法或类使用的类型 `T` 必须重命名。\n\n\
  泛型方法参数使用约束的方式与类相同，在在这种情况下，你可以使用任何类类型参数：\n\n```csharp\npublic class Defauler<T1>\n\
  {\n   public T2 GetDefault<T2>()\n      where T2 : T1\n   {\n      return default(T2);\n\
  \   }\n}\n```\n\n在这里，提供给方法的类型 `T2` 必须与提供给类的 `T1` 相同或继承自后者。这是约束泛型方法的常用方法。\n\n在之前显示的\
  \ `Farm<T>` 类中，你可以包含以下方法（在下载的代码 `Ch12Ex04` 中包含但被注释掉了）：\n\n```csharp\npublic Farm<U>\
  \ GetSpecies<U>() where U : T\n{\n   Farm<U> speciesFarm = new Farm<U>();\n   foreach\
  \ (T animal in animals)\n   {\n      if (animal is U)\n      {\n         speciesFarm.Animals.Add(animal\
  \ as U);\n      }\n   }\n   return speciesFarm;\n}\n```\n\n\n\n\n\n这可以替换 `GetCows()`\
  \ 以及其他相同类型的方法。这里使用的泛型类型参数 `U` 被 `T` 约束，而 `T`  又被 `Farm<T>` 类约束为 `Animal`。这使得你可以在需要时，将\
  \ `T` 的实例视为 `Animal` 的实例来处理。\n\n在 `Ch12Ex04` 的客户端代码 `Program.cs` 中，使用这个新方法需要一次修改：\n\
  \n```\nFarm<Cow> dairyFarm = farm.GetSpecies<Cow>();\n```\n\n类似地，你可以写：\n\n```\n\
  Farm<Chicken> poultryFarm = farm.GetSpecies<Chicken>();\n```\n\n你可以对任何继承自 `Animal`\
  \ 的类采用相同的方法。\n\n在此处注意，在方法上使用泛型类型参数会改变方法的签名。这意味着你可以有多个重载方法，它们之间的区别仅在于泛型类型参数，如下例所示：\n\
  \n```\npublic void ProcessT<T>(T op1){ … }\npublic void ProcessT<T, U>(T op1){ …\
  \ }\n```\n\n应该使用哪种方法取决于调用方法时指定的泛型类型参数的数量。\n\n### 定义泛型委托\n\n最后一个考虑的泛型类型是*泛型委托*。你在在本章前面的部分中学习如何排序和搜索泛型列表时，已经看到这些委托的作用了。你分别使用了\
  \ `Comparison<T>` 和 `Predicate<T>` 委托。\n\n第 6 章 描述了如何使用方法的参数和返回类型、`delegate`关键字以及委托名称来定义委托：\n\
  \n```\npublic delegate int MyDelegate(int op1, int op2);\n```\n\n要定义泛型委托，你只需要声明并使用一个或多个泛型类型参数：\n\
  \n```c\npublic delegate T1 MyDelegate<T1, T2>(T2 op1, T2 op2) where T1: T2;\n```\n\
  \n正如你所看到的，在这里也可以应用约束。你将在下一章学习更多关于委托的知识，包括如何在常用的 C# 编程技术——事件中使用它们。\n\n### 变异（VARIANCE）\n\
  \n变异性（Variance）是*协变*（covariance）和*逆变*（contravariance）的统称。理解这些术语含义最简单的方法是将它们与多态进行比较。正如你所记得的，多态使你能够将派生类型的对象放入基类类型的变量中。例如：\n\
  \n```\nCow myCow = new Cow(\"Mary\");\nAnimal myAnimal = myCow;\n```\n\n在这里，一个 `Cow`\
  \ 类型的对象被放在了一个 `Animal` 类型的变量中——这可能是因为 `Cow` 派自 `Animal`。\n\n然而，接口的情况并非如此。也就是说，下面的代码无法运行：\n\
  \n```\nIMethaneProducer<Cow> cowMethaneProducer = myCow;\nIMethaneProducer<Animal>\
  \ animalMethaneProducer = cowMethaneProducer;\n```\n\n第一行代码是没问题的，假设 `Cow` 支持 `IMethaneProducer<Cow>`\
  \ 接口。然而，第二行代码假设了两个接口类型之间存在并不的关系，因此没有办法将一个转换为另一个。或者有呢？使用你在本章为止所看到的技术，确实没有办法，因为泛型类型的所有类型参数都是*不变的*（invariant）。但是，你可以在泛型接口和泛型委托上定义变异类型参数，以恰恰适用于前面代码所示的情况。\n\
  \n为了让前面的代码运行，`IMethaneProducer<T>` 接口的类型参数 `T` 必须是*协变的*（covariant）。拥有协变类型参数实际上在\
  \ `IMethaneProducer<Cow>` 和 `IMethaneProducer<Animal>` 之间建立了一种继承关系，使得一种类型的变量可以持有另一种类型的值，就像多态中一样（尽管稍微复杂一点）。\n\
  \n为了完成对变异的介绍，你需要查看另一种类型，*逆变*（contravariance）。这与协变类似，但工作方向相反。与其像协变那样能够将泛型接口值放入包含基类的变量中，逆变允许你将该接口放入一个使用派生类型的变量中。例如：\n\
  \n```\nIGrassMuncher<Cow> cowGrassMuncher = myCow;\nIGrassMuncher<SuperCow> superCowGrassMuncher\
  \ = cowGrassMuncher;\n```\n\n乍看这似乎有点奇怪，因为你不能通过多态实现同样的操作。然而，在某些情况下这是一种很有技巧，正如你将在“逆变”节中看到的。\n\
  \n在接下来的两个节中，你将如何在泛型类型中实现变异，以及 .NET Framework 如何利用变异来让你的生活更轻松。\n\n### 协变（Covariance）\n\
  \n要将泛型类型参数定义为协变，你在类型定义中使用 `out` 关键字，如下例：\n\n```\npublic interface IMethaneProducer<out\
  \ T>{ … }\n```\n\n对于接口定义，协变类型参数只能作为方法的返回值或属性的 `get` 访问器。\n\n这种用处的一个很好的例子可以在 .NET\
  \ Framework 中找到，在你之前使用过的 `IEnumerable<T>` 接口中。该接口中的项类型 `T` 被定义为协变的。这意味着你可以将一个支持（例如）`IEnumerable<Cow>`的对象放入\
  \ `IEnumerable<Animal>` 类型的变量中。\n\n这使得下面的代码成为：\n\n```\nstatic void Main(string[]\
  \ args)\n{\n   List<Cow> cows = new List<Cow>();\n   cows.Add(new Cow(\"Mary\"));\n\
  \   ListAnimals(cows);\n}\nstatic void ListAnimals(IEnumerable<Animal> animals)\n\
  {\n   foreach (Animal animal in animals)\n   {\n      Console.WriteLine(animal.ToString());\n\
  \   }\n}\n```\n\n在这里 `cows` 的类型是 `List<Cow>`，它支持 `IEnumerable<Cow>` 接口。该变量可以通过协变传递给接受\
  \ `IEnumerable<Animal>` 类型参数的方法。回顾你对 `foreach` 循环的知识，你知道 `GetEnumerator()` 方法用于获取\
  \ `IEnumerator<T>` 枚举器，而该枚举器的 `Current` 属性用于访问项。`IEnumerator<T>` 也将其类型参数定义为协变的，这意味着它可以完美。\n\
  \n对于接口定义，逆变类型参数只能作为方法参数，不能作为返回类型。\n\n再次，理解这一点最好的方法是查看 .NET 中使用逆变的例子。一个具有逆变类型参数的接口（也是你已经使用过的）是\
  \ `IComparer<T>`。你可以这样为动物实现此接口：\n\n```\npublic class AnimalNameLengthComparer :\
  \ IComparer<Animal>\n{\n    public int Compare(Animal x, Animal y) \n         =>\
  \ x.Name.Length.CompareTo(y.Name.Length);\n}\n```\n\n这个比较器根据名称长度比较动物，因此你可以用它来排序\
  \ `List<Animal>` 实例。通过逆变，你也可以用它来排序 `List<Cow>` 实例，尽管 `List<Cow>.Sort()` 方法期望一个 `IComparer<Cow>`\
  \ 实例：\n\n```\nList<Cow> cows = new List<Cow>();\ncows.Add(new Cow(\"Lea\"));\ncows.Add(new\
  \ SuperCow(\"Donna\"));\ncows.Add(new Cow(\"Mary\"));\ncows.Add(new Cow(\"Ben\"\
  ));\ncows.Sort(new AnimalNameLengthComparer());\n```\n\n在大多数情况下，逆变是自然发生的——它被引入 .NET\
  \ 以帮助处理这种操作。然而，两种类型变异的好处在于，你现在需要时可以使用在本节所示的技术来实现它们。\n\n### 逆变（Contravariance）\n\n\
  要将泛型类型参数定义为逆变，你在类型定义中使用 `in` 关键字：\n\n```\npublic interface IGrassMuncher<in T>{\
  \ … }\n```\n\n### 练习（EXERCISES）\n\n1.  **12.1** 下列哪些可以是泛型的？\n\n    1. 类\n\n    2.\
  \ 方法\n\n    3. 属性\n\n    4. 运算符重载\n\n    5. 结构体\n\n    6. 枚举\n\n2.  **12.2** 扩展\
  \ `Ch12Ex01` 中的 `Vector` 类，使得 `*` 运算符返回两个向量的点积。\n\n\n\n\n\n### 3. 12.3 下面的代码有什么问题？请修复它。\n\
  \n```csharp\npublic class Instantiator<T>\n{\n   public T instance;\n   public Instantiator()\n\
  \   {\n      instance = new T();\n   }\n}\n```\n\n### 4. 12.4 下面的代码有什么问题？请修复它。\n\
  \n```csharp\npublic class StringGetter<T>\n{\n   public string GetString<T>(T item)\
  \ => item.ToString();\n}\n```\n\n### 5. 12.5 创建一个名为 `ShortList<T>` 的泛型类，它实现了 `IList<T>`\
  \ 并由一个具有最大大小的集合组成。该最大大小应该是一个整数，可以通过 `ShortList<T>` 的构造函数提供，或者默认为 10。构造函数还应该能够通过\
  \ `IEnumerable<T>` 参数接收一个初始项列表。该类的功能与 `List<T>` 完全相同，但如果尝试向集合中添加过多项，或者传递给构造函数的 `IEnumerable<T>`\
  \ 包含过多过多，则应抛出 `IndexOutOfRangeException` 类型的异常。\n\n### 6. 12.6 下面代码可以编译吗？如果不能，为什么不能？\n\
  \n```csharp\npublic interface IMethaneProducer<out T>\n{\n   void BelchAt(T target);\n\
  }\n```\n\n练习答案可以在附录中找到。\n\n## 本章你学到了什么\n\n| 主题 | 核心概念 |\n| --- | --- |\n| 使用泛型类型\
  \ | 泛型类型需要一个或多个类型参数才能工作。你可以在声明变量时传递所需的类型参数，并将泛型类型作为变量的类型。你通过在角括号中包含一个用逗号分隔的类型列表来实现这一点。\
  \ |\n| 可空类型 | 可空类型是可以取任何指定值类型的任何值或 `null` 值的类型。你可以使用 `Nullable<T>` 或 `T?` 语法来申声明一个可空类型变量。\
  \ |\n| `??`、`?.` 和 `?[]` 运算符 | 空合并运算符 `??` 返回其第一个操作数的值，或者如果第一个操作数为 `null`，则返回第二个操作数的值。成员访问\
  \ `?.` 和元素访问 `?[]` 空条件运算符会在对对象执行操作之前评估对象是否为 `null`。 |\n| 泛型集合 | 泛型集合因为内置了强类型而非常有用。你可以使用\
  \ `List<T>`、`Collection<T>` 和 `Dictionary<K, V>` 等集合类型。这些类型还暴露了泛型接口。要对泛型集合进行排序和搜索，你需要使用\
  \ `IComparer<T>` 和 `IComparable<T>` 接口。 |\n| 定义泛型类型 | 定义泛型类型类似于定义任何其他类型，只需指定类型名称指定泛型类型参数。与使用泛型类型一样，你将这些指定为包含在角括号中的逗号分隔的列表。你可以在代码中任何可以使用类型名称的地方使用泛型类型参数；例如，在方法的返回值和参数中。\
  \ |\n| 泛型类型参数约束 | 为了在泛型类型代码更有效地有效地泛型类型参数，你可以对在使用类型时可以提供的类型进行约束。你可以通过基类、支持的接口、是否必须是值类型或引用类型，以及是否支持无参数构造函数来约束类型参数。如果没有此类约束，你必须使用\
  \ `default` 关键字来实例化泛型类型的变量。 |\n| 其他泛型类型 | 除了类，你还可以定义泛型接口、委托和方法。 |\n| 变型 | 变型是一个是一个类似于多态的概念，但应用于类型参数。它允许你用一个泛型类型代替另一个泛型类型，这些泛型类型仅在使用的泛型类型参数上不同。协变允许在两个类型之间进行转换，目标类型的类型参数是源类型类型参数的基类。逆变允许在上述关系反转时进行转换。协变类型参数通过\
  \ `out` 参数定义，只能用作返回值和属性 `get` 访问器类型。逆变类型参数通过 `in` 参数定义，只能用作方法参数。 |\n\n# 13\n进阶 C#\
  \ 技术\n\n### 本章代码下载\n\n本章的代码下载可以在书籍的页面 [`www.wiley.com`](http://www.wiley.com) 找到。点击\
  \ Downloads 链接。代码也可以在 [`github.com/benperk/BeginningCSharpAndDotNET`](http://github.com/benperk/BeginningCSharpAndDotNET)\
  \ 找到。代码位于 `Chapter13` 文件夹中，并根据整个章节中的名称单独命名。\n\n在本章中，你将通过查看一些在其他地方并不完全合适的小部分继续探索\
  \ C# 语言。Anders Hejlsberg（C# 的发明者）以及微软的其他人员继续更新和完善该语言。在编写本文时，最新的更改是 C# 语言第 9 版本的一部分。在书的这个位置，你可能在想还需要什么；事实上，C#\
  \ 的之前的版本在功能方面几乎没有。但这并不意味着让 C# 编程的某些方面变得更容易，或者 C#与其他技术之间的关系无法简化。\n\n你还将对最后几章构建的 `CardLib`\
  \ 代码进行一些最后的修改，甚至创建一个纸牌游戏。\n\n## :: 运算符和全局命名符\n\n`::` 运算符提供了访问命名空间中类型的替代方法。如果你想使用命名空间别名且该别名与实际命名空间存在冲突，这可能是必要的。为了理解这意味着，请考虑以下代码：\n\
  \n```csharp\nusing MyNamespaceAlias = MyRootNamespace.MyNestedNamespace;\nnamespace\
  \ MyRootNamespace\n{\n   namespace MyNamespaceAlias\n   {\n      public class MyClass\
  \ {}\n   }\n   namespace MyNestedNamespace\n   {\n      public class MyClass {}\n\
  \   }\n}\n```\n\n在 `RootNamespace` 中的代码可能会使用以下代码引用类：\n\n```csharp\nMyNamespaceAlias.MyClass\n\
  ```\n\n此代码引用的类是 `RootNamespace.MyNamespaceAlias.MyClass` 类，而不是 `RootNamespace.MyNestedNamespace.MyClass`\
  \ 类。也就是说，命名空间 `RootNamespace.MyNamespaceAlias` 隐藏了 `using` 语句定义的别名，该别名指向 `RootNamespace.MyNestedNamespace`。你仍然可以访问，但需要不同的语法：\n\
  \n```csharp\nMyClass\n```\n\n或者，你可以使用 `::` 运算符：\n\n```csharp\nMyNamespaceAlias::MyClass\n\
  ```\n\n使用此运算符强制编译器使用 `using` 语句定义的别名，因此代码引用 `RootNamespace.MyNestedNamespace.MyClass`。\n\
  \n你还可以配合 `::` 运算符使用 `global` 关键字，它本质上是顶层根命名空间的别名。这对于更清楚地说明你指的是哪个命名空间很有用，如下：\n\n\
  ```csharp\nglobal::System.Collections.Generic.List<int>\n```\n\n这是你预期的类，即泛型 `List<T>`\
  \ 集合类。它不是以下代码定义的类：\n\n```csharp\nnamespace MyRootNamespace\n{\n   namespace System\n\
  \   {\n      namespace Collections\n      {\n         namespace Generic\n      \
  \   {\n            class List<T> {}\n         }\n      }\n   }\n}\n```\n\n当然，你应该避免将你的命名空间命名为已存在的\
  \ .NET 命名空间相同的名称，尽管类似的问题在大项目中可能会，特别是当你作为大型团队的一部分工作时。使用 `::` 运算符和 `global` 关键字可能是你访问所需类型的唯一方法。\n\
  \n## 自定义异常\n\n\n\n\n\n\n\n# 第 7 章 (#c07.xhtml) 涵盖了异常，并解释了如何使用 `try`…`catch`…`finally`\
  \ 块来对异常进行处理。你还看到了几个标准的 .NET 异常，包括异常的基类 `System.Exception`。有时，从此基类派生你自己的异常类并在应用程序中使用是很有用的，而不是使用标准异常。这使你能够向任何捕获该异常的代码发送更具体的信息，并让捕获代码能够更具体地指定它处理哪些异常。例如，你可能会为你的异常类添加一个新属性，允许访问某些底层信息，使得异常的接收者能够进行必要的更改，或者仅仅提供更多关于异常原因的信息。\n\
  \n## 在 CardLib 中添加自定义异常\n\n如何使用自定义异常，再次通过升级 `CardLib` 项目得到了最好的明说明。`Deck.GetCard()`\
  \ 方法目前在尝试访问索引小于 0 或大于 51 的卡片时会抛出标准的 .NET 异常，但你将对其进行修改为使用自定义异常。\n\n首先，你需要创建一个名为 `Ch13CardLib`\
  \ 的新类库项目，将其保存到 `BeginningCSharpAndDotNET\\Chapter13` 目录下，并像以前一样从 `Ch12CardLib` 复制类，根据需要将命名空间更改为\
  \ `Ch13CardLib`。接下来，定义异常。你通过在一个名为 `CardOutOfRangeException.cs` 的新类文件中定义一个新类来实现此，你可以通过项目\
  \ ➪ 添加类将其添加到 `Ch13CardLib` 项目（你可以在 `Ch13CardLib\\CardOutOfRangeException.cs` 中找到这段代码）：\n\
  \n```\n public class CardOutOfRangeException : Exception\n   {\n      private Cards\
  \ deckContents;\n      public Cards DeckContents\n      {\n         get { return\
  \ deckContents; }\n      }\n      public CardOutOfRangeException(Cards sourceDeckContents)\n\
  \         : base(\"There are only 52 cards in the deck.\")\n      {\n         deckContents\
  \ = sourceDeckContents;\n      }\n   }\n```\n\n该类的构造函数需要一个 `Cards` 类的实例。它允许通过 `DeckContents`\
  \ 属性访问此 `Cards` 对象，并向基类 `Exception` 构造函数提供合适的错误消息，以便通过该类的 `Message` 属性可以使用该消息。\n\
  \n接下来，向 `Deck.cs` 添加代码以抛出此异常，替换旧的标准异常（你可以在 `Ch13CardLib\\Deck.cs` 中找到这段代码）：\n\n\
  ```\n public Card GetCard(int cardNum)\n      {\n         if (cardNum >= 0 && cardNum\
  \ <= 51)\n            return cards[cardNum];\n         else\n            throw new\
  \ CardOutOfRangeException(cards.Clone() as Cards);\n      }\n```\n\n`CardOutOfRangeException`\
  \ 类中的 `DeckContents` 属性用 `Cards` 对象形式的当前 `Deck` 对象内容的深拷贝进行初始化。这意味着你看到的是异常抛出点刻的内容，因此对牌组内容的后续修改将不会“丢失”这些信息。\n\
  \n要测试这一点，请使用以下客户端代码（你可以在 `Ch13CardClient\\Program.cs` 中找到这段代码）：\n\n```\nDeck deck1\
  \ = new Deck();\ntry\n{\n   Card myCard = deck1.GetCard(60);\n}\ncatch (CardOutOfRangeException\
  \ e)\n{\n   Console.WriteLine(e.Message);\n   Console.WriteLine(e.DeckContents[0]);\n\
  }\nConsole.ReadKey();\n```\n\n在添加对 `Ch13CardLib.dll` 的引用依赖并使用 `using Ch13CardLib`\
  \ 后，执行代码的结果得到如图 13-1 所示所示输出。\n\n![执行结果输出屏幕的截图。](img/c13f001.png)\n\n**图 13-1**\n\
  \n在这里，捕获代码将异常的 `Message` 属性写入屏幕。你还显示了通过 `DeckContents` 获取的 `Cards` 对象的第一张卡片，以此证明你可以通过自定义异常对象访问\
  \ `Cards` 集合。\n\n## 事件 (EVENTS)\n\n本节涵盖了 .NET 中最常用的 OOP 技术之一：事件。你将像往一样从基础开始——查看什么是事件。之后，你将看到一些简单事件的运行，并学习可以使用它们做什么。然后，你将学习如何创建和使用自己的事件。\n\
  \n在本章中，你将通过添加事件来完成 `CardLib` 类库。最后，由于这是到达某些高级主题之前的最后一站，你将尽情地创建一个使用此类库的卡牌游戏应用程序。\n\
  \n### 什么是事件？\n\n事件类似于异常，因为它们由对象引发（抛出），并且你可以提供对它们进行操作的代码。然而，它们之间有几个重要的区别，其中最重要的一点是，没有用于处理事件的\
  \ `try` …`catch` 结构。相反，你必须订阅它们。订阅事件意味着提供在事件引发时以事件处理程序（event handler）形式执行的代码。\n\n\
  单个事件可以订阅多个处理器，所有这些处理器都会在事件引发时被调用。这可能包括作为引发事件的对象所在类的一部分的事件处理器，但在其他类中同样可能找到事件处理器。\n\
  \n\n\n\n现在是时候定义并使用自己的事件了。接下来的“尝试一下”（Try It Out）实现了本章之前介绍的即时消息场景的示例版本，创建一个 `Connection`\
  \ 对象，该对象会触发由 `Display` 对象处理的事件。\n\n## 多用途事件处理程序\n\n你之前看到的用于 `Timer.Elapsed` 事件的委托包含两个参数，这些类型在事件处理程序非常常见：\n\
  \n- `object source`—引发事件的对象的引用\n- `ElapsedEventArgs e`—由事件发送的参数\n\n在此事件中（实际上在许多其他事件中）使用\
  \ `object` 类型参数的原因是，你通常会使用单个事件处理程序来处理由不同对象生成的多个相同事件，并且仍然能够判断出是哪个对象生成了事件。\n\n为了解释并说明这一概念，接下来的“尝试一下”对上一个示例进行了稍作扩展。\n\
  \n## EventHandler 和 Generic EventHandler<T> 类型\n\n在大多数情况下，你将遵循上一节概述的模式，使用具有 `void`\
  \ 返回类型和两个参数的事件处理程序。第一个参数的类型将是 `object`，并将作为事件源。第二个参数的类型将派自 `System.EventArgs`，并将包含任何与事件相关的信息。由于这种情况非常常见，NET\
  \ 提供了两种委托类型以便于定义事件：`EventHandler` 和 `EventHandler<T>`。它们都是使用标准事件处理程序模式的委托。泛型版本允许你指定想要使用的事件参数的类型。\n\
  \n在之前的“尝试一下”中，你已经通过如下方式使用泛型 `EventHandler<T>` 委托类型看到了它的实际运行情况：\n\n```cpp\n public\
  \ class Connection\n   {\n      public event EventHandler<MessageArrivedEventArgs>\
  \ MessageArrived;\n      ...\n   }\n```\n\n这显然是件好事，因为它简化了你的代码。通常情况下，在定义事件时使用这些委托类型是最佳实践。请注意，如果你有一个不需要事件参数数据的事件，你仍然可以使用\
  \ `EventHandler` 委托类型。你只需将 `EventArgs.Empty` 作为参数值传递即可。\n\n## 返回值和事件处理程序\n\n到目前为止看到的所有事件处理程序的返回类型都是\
  \ `void`。可以为事件提供返回类型，但这会导致问题，因为给定的事件可能会导致多个事件处理程序被调用。如果所有这些处理程序都返回值，那么可能不清楚实际上返回的是哪一个值。\n\
  \n系统通过允许你仅访问事件处理程序返回的最后一个值来解决这个问题。这将是订阅事件的事件处理程序返回的值。虽然此功能在某些情况下可能有用，但建议使用 `void`\
  \ 类型事件处理程序，并避免使用 `out` 类型参数（这会导致关于参数返回值的来源产生同样的歧义）。\n\n## 匿名方法\n\n与其定义事件处理程序方法，你可以选择使用匿名方法。匿名方法在传统意义上并不作为方法存在——也就是说，它不是任何特定类上的方法。相反，匿名方法纯粹是为了作为委托的目标而创建。\n\
  \n要创建一个匿名方法，你需要以下代码：\n\n```cpp\ndelegate(parameters)\n{\n   // 匿名方法代码。\n};\n```\n\
  \n`parameters` 是一个参数列表，与你正在实例化的委托类型的参数匹配，并在匿名方法代码中使用：\n\n```cpp\n delegate(Connection\
  \ source, MessageArrivedEventArgs e)\n{\n   //  Ch13Ex03 中 MessageHandler 事件的匿名方法代码。\n\
  };\n```\n\n例如，你可以使用这段代码完全跳过 Ch13Ex03 中的 `Display.DisplayMessage()` 方法：\n\n```cpp\n\
  \ myConnection1.MessageArrived +=\n            delegate(object source, MessageArrivedEventArgs\
  \ e)\n            {\n               Console.WriteLine($\"Message arrived from: {((Connection)source).Name}\"\
  );\n               Console.WriteLine($\"Message Text: {e.Message}\");\n        \
  \    };\n```\n\n关于匿名方法的一个有趣点是，它们实际上对于包含它们的代码块是局部的，并且可以访问该作用范围内的局部变量。如果你使用这样的变量，那么它就变成了一个*外部*（outer）变量。外部变量在离开作用范围时不会像其他局部变量那样被释放；相反，它们会一直存在到使用它们的匿名方法被销毁为止。这可能比你预期的要晚得多，所以这绝对需要注意的。如果外部变量占用了大量内存，或者它使用了在其他方面昂贵的资源（例如，数量有限的资源），可能会导致内存或性能问题。\n\
  \n## 扩展和使用 CARDLIB\n\n现在你已经查看了定义和使用事件，你可以在 Ch13CardLib 中使用它们了。你将添加到库中的事件将在使用 `GetCard`\
  \ 获取 `Deck` 对象中的最后一个 `Card` 对象时生成，并命名为 `LastCardDrawn`。该事件允许订阅者自动重新洗牌，减少了客户端所需的处理工作。该事件将使用\
  \ `EventHandler` 委托类型，并将 `Deck` 对象的引用作为源，这样在处理程序所在的任何地方都可以访问 `Shuffle()` 方法。将以下代码添加到\
  \ `Deck.cs`（你可以在 `Ch13CardLib\\Deck.cs` 中找到此代码）以定义并触发该事件：\n\n```cpp\nnamespace Ch13CardLib\n\
  {\n      public class Deck : ICloneable\n      {\n        public event EventHandler\
  \ LastCardDrawn;\n        ...\n        public Card GetCard(int cardNum)\n      \
  \  {\n           if (cardNum >= 0 && cardNum <= 51)\n              {\n         \
  \        if (cardNum == 51 && (LastCardDrawn != null))\n                    LastCardDrawn(this,\
  \ EventArgs.Empty);\n              return cards[cardNum];\n           }\n      \
  \     else\n              throw new CardOutOfRangeException((Cards)cards());\n \
  \       }\n        ...\n      }\n```\n\n这就是向 Deck 类添加该事件所需的所有代码。\n\n在花了大量时间开发 `CardLib`\
  \ 库之后如果不使用它就太可惜了。在完成关于 C# 和 .NET 框架的 OOP 章节之前，是时候玩一下并编写一个使用熟悉的纸牌类的扑游戏应用程序。\n\n与之前的章节一样，你将为\
  \ Ch13CardLib 解决方案添加客户端控制应用程序，为 Ch13CardLib 项目添加引用，并将其启动项目。该应用程序将命名为 Ch13CardClient。\n\
  \n首先，你将在 Ch13CardClient 的新文件中创建一个名为 `Player` 的类。你可以在本章的在线下载中的 `Ch13CardClient\\\
  Player.cs` 中找到此代码。该类将包含两个自动属性：`Name`（ `string` 类型）和 `PlayHand`（`Cards` 类型）。这两个属性都具有私有的\
  \ `set` 访问器，但尽管如此，`PlayHand` 对象提供了对其内容的写入访问，这使得你能够修改玩家手中的牌。\n\n你还将通过将默认构造函数设为私有来隐藏它，并提供一个公共非默认构造函数，为\
  \ Player 实例的 `Name` 属性接受初始值。\n\n最后，你将提供一个返回类型为 `bool` 的方法 `HasWon()`，如果玩家手中的所有牌都属于同一种花色（这是一个简单的获胜条件，但那并不重要）。\n\
  \n以下是 Player.cs 的代码：\n\n\n\n\n\n```cs\nusing System;\nusing System.Collections.Generic;\n\
  using System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\nusing Ch13CardLib;\n\
  namespace Ch13CardClient\n{\n   public class Player\n   {\n      public string Name\
  \ { get; private set; }\n      public Cards PlayHand { get; private set; }\n   \
  \   private Player() {}\n      public Player(string name)\n      {\n         Name\
  \ = name;\n         PlayHand = new Cards();\n      }\n      public bool HasWon()\n\
  \      {\n         bool won = true;\n         Suit match = PlayHand[0].suit;\n \
  \        for (int i = 1; i < PlayHand.Count; i++)\n         {\n            won &=\
  \ PlayHand[i].suit == match;\n         }\n         return won;\n      }\n   }\n\
  }\n```\n\n接下来，定义一个处理游戏本身的类，命名为 `Game`。该类位于 `Ch13CardClient` 项目的 `Game.cs` 文件中。该类有四个私有成员字段：\n\
  \n- `playDeck`—一个 `Deck` 类型的变量，包含要使用的牌组\n- `currentCard`—一个 `int` 值，用作指向牌组中下一张牌的指针\n\
  - `players`—一个 `Player` 对象的数组，代表游戏的玩家\n- `discardedCards`—一个 `Cards` 集合，用于存放玩家丢弃但尚未洗回牌组的牌\n\
  \n该类的默认构造函数初始化并洗牌存储在 `playDeck` 中的 `Deck`，将 `currentCard` 指针变量设置为 `0`（`playDeck`\
  \ 中的第一张牌），并将一个名为 `LastCardDrawnEventHandler()` 的事件处理器绑定到 `playDeck.LastCardDrawn`\
  \ 事件。该处理程序简单地重新洗牌牌，初始化 `discardedCards` 集合，并将 `currentCard` 重置为 `0`，准备从新牌组中读牌。\n\
  \n`Game` 类还包含两个实用方法：`SetPlayers()` 用于设置游戏玩家（作为 `Player` 对象的数组），以及 `DealHands()`\
  \ 用于向玩家发牌（每人七张）。允许的人数限制在 2 到 7 人之间，以确保有足够的牌供大家使用。\n\n最后，有一个 `PlayGame()` 方法，它包含了游戏逻辑本身。在你查看过\
  \ `Program.cs` 中的代码后，很快就会回到这个方法。`Game.cs` 中的其余部分代码如下所示（你可以在 `Ch13CardClient\\Game.cs`\
  \ 中找到这些代码）：\n\n```cs\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
  using System.Text;\nusing System.Threading.Tasks;\nusing Ch13CardLib;\nnamespace\
  \ Ch13CardClient\n{\n   public class Game\n   {\n      private int currentCard;\n\
  \      private Deck playDeck;\n      private Player[] players;\n      private Cards\
  \ discardedCards;\n      public Game()\n      {\n         currentCard = 0;\n   \
  \      playDeck = new Deck(true);\n         playDeck.LastCardDrawn += LastCardDrawnEventHandler;\n\
  \         playDeck.Shuffle();\n         discardedCards = new Cards();\n      }\n\
  \      private void LastCardDrawnEventHandler(object source, EventArgs args)\n \
  \     {\n         Console.WriteLine(\"Discarded cards reshuffled into deck.\");\n\
  \         ((Deck)source).Shuffle();\n         discardedCards.Clear();\n        \
  \ currentCard = 0;\n      }\n      public void SetPlayers(Player[] newPlayers)\n\
  \      {\n         if (newPlayers.Length > 7)\n            throw new ArgumentException(\n\
  \               \"A maximum of 7 players may play this game.\");\n         if (newPlayers.Length\
  \ < 2)\n            throw new ArgumentException(\n               \"A minimum of\
  \ 2 players may play this game.\");\n         players = newPlayers;\n      }\n \
  \     private void DealHands()\n      {\n         for (int p = 0; p < players.Length;\
  \ p++)\n         {\n            for (int c = 0; c < 7; c++)\n            {\n   \
  \            players[p].PlayHand.Add(playDeck.GetCard(currentCard++));\n       \
  \     }\n         }\n      }\n      public int PlayGame()\n      {\n         //\
  \ Code to follow.\n      }\n   }\n}\n```\n\n`Program.cs` 包含 `Main()` 方法，该方法初始化并运行游戏。该方法执行以下步骤：\n\
  \n1. 显示介绍信息。\n2. 提示用户输入 2 到 7 之间的玩家人数。\n3. 相应地设置 `Player` 对象的数组。\n4. 提示每个玩家输入名称，该名称用于初始化数组中的一个\
  \ `Player` 对象。\n5. 创建 `Game` 对象，并使用 `SetPlayers()` 方法分配玩家。\n6. 使用 `PlayGame()` 方法启动游戏。\n\
  7. 使用 `PlayGame()` 的 `int` 返回值显示胜利消息（返回的值是 `Player` 对象数组中获胜玩家的索引）。\n\n以下是后续代码，并为了清晰添加了注释（你可以在\
  \ `Ch13CardClient\\Program.cs` 中找到这些代码）：\n\n```cs\n static void Main(string[] args)\n\
  \      {\n         // Display introduction.\n         Console.WriteLine(\"BenjaminCards:\
  \ a new and exciting card game.\");\n         Console.WriteLine(\"To win you must\
  \ have 7 cards of the same suit in your hand.\");\n         Console.WriteLine();\n\
  \         // Prompt for number of players.\n         bool inputOK = false;\n   \
  \      int choice = -1;\n         do\n         {\n            Console.WriteLine(\"\
  How many players (2–7)?\");\n            string input = Console.ReadLine();\n  \
  \          try\n            {\n               // Attempt to convert input into a\
  \ valid number of players.\n               choice = Convert.ToInt32(input);\n  \
  \             if ((choice >= 2) && (choice <= 7))\n                  inputOK = true;\n\
  \            }\n            catch\n            {\n               // Ignore failed\
  \ conversions, just continue.\n            }\n         } while (inputOK == false);\n\
  \         // Initialize array of Player objects.\n         Player[] players = new\
  \ Player[choice];\n         // Get player names.\n         for (int p = 0; p < players.Length;\
  \ p++)\n         {\n            Console.WriteLine($\"Player {p + 1}, enter your\
  \ name:\");\n            string playerName = Console.ReadLine();\n            players[p]\
  \ = new Player(playerName);\n         }\n         // Start game.\n         Game\
  \ newGame = new Game();\n         newGame.SetPlayers(players);\n         int whoWon\
  \ = newGame.PlayGame();\n         // Display winning player.\n         Console.WriteLine($\"\
  {players[whoWon].Name has won the game!\");\n         Console.ReadKey();\n     \
  \ }\n```\n\n现在你来到 `PlayGame()`，这是应用程序的主体。由于空间限制，我们无法对该方法提供许多细节，但代码经过了注释以便理解。代码本身并不复杂，只是量很大。\n\
  \n在考虑这段代码时，请记住 `Card` 对象是如何操作的。现在，将这些对象定义为引用类型而不是值类型（使用 `struct`）应该是显而易见的。一个给定的\
  \ `Card` 对象似乎同时存在于多个地方，因为可以被 `Deck` 对象、`Player` 对象的 `hand` 字段、`discardedCards` 集合以及\
  \ `playCard` 对象（当前在桌面上的牌）持有。这使得追踪牌变得容易，并被用于从牌组中抽取新牌的代码。只有当该牌不在任何玩家的手中也不在 `discardedCards`\
  \ 集合中，它才会被接受。\n\n\n\n\n\n```csharp\n public int PlayGame()\n      {\n         //\
  \ 只有在玩家存在时才游戏。\n         if (players == null)\n            return -1;\n        \
  \ // 发发初始牌。\n         DealHands();\n         // 初始化游戏变量，包括一张放在桌面上的初始卡牌：\n      \
  \   // playCard。\n         bool GameWon = false;\n         int currentPlayer;\n\
  \         Card playCard = playDeck.GetCard(currentCard++);\n         discardedCards.Add(playCard);\n\
  \         // 主游戏循环，直到 GameWon 为 true 为止。\n         do\n         {\n            //\
  \ 遍历每轮游戏中的每个玩家。\n            for (currentPlayer = 0; currentPlayer < players.Length;\n\
  \                 currentPlayer++)\n            {\n               // 输出当前玩家、玩家手牌以及桌面上的牌。\n\
  \               Console.WriteLine($\"{players[currentPlayer].Name}'s turn.\");\n\
  \               Console.WriteLine(\"Current hand:\");\n               foreach (Card\
  \ card in players[currentPlayer].PlayHand)\n               {\n                 \
  \ Console.WriteLine(card);\n               }\n               Console.WriteLine($\"\
  Card in play: {playCard}\");\n               // 提示玩家选取桌面上的牌或抽取一张新牌。\n          \
  \     bool inputOK = false;\n               do\n               {\n             \
  \     Console.WriteLine(\"Press T to take card in play or D to draw:\");\n     \
  \             string input = Console.ReadLine();\n                  if (input.ToLower()\
  \ == \"t\")\n                  {\n                     // 将桌面上的牌加入玩家手牌。\n      \
  \               Console.WriteLine($\"Drawn: {playCard}\");\n                   \
  \  // 如果可能，从弃牌堆中移除（如果牌堆\n                     // 重新洗牌，它将不在那里了）。\n              \
  \       if (discardedCards.Contains(playCard))\n                     {\n       \
  \                 discardedCards.Remove(playCard);\n                     }\n   \
  \                  players[currentPlayer].PlayHand.Add(playCard);\n            \
  \         inputOK = true;\n                  }\n                  if (input.ToLower()\
  \ == \"d\")\n                  {\n                     // 将牌堆的新牌加入玩家手牌。\n      \
  \               Card newCard;\n                     // 只有当卡牌不在玩家手牌中\n          \
  \           // 也不在弃牌堆中时才添加。\n                     bool cardIsAvailable;\n      \
  \               do\n                     {\n                        newCard = playDeck.GetCard(currentCard++);\n\
  \                        // 检查卡牌是否在弃牌堆中\n                        cardIsAvailable\
  \ = !discardedCards.Contains(newCard);\n                        if (cardIsAvailable)\n\
  \                        {\n                           // 遍历所有玩家的手牌查看 newCard \n\
  \                           // 是否已经在手牌中。\n                           foreach (Player\
  \ testPlayer in players)\n                           {\n                       \
  \       if (testPlayer.PlayHand.Contains(newCard))\n                           \
  \   {\n                                 cardIsAvailable = false;\n             \
  \                    break;\n                              }\n                 \
  \          }\n                        }\n                     } while (!cardIsAvailable);\n\
  \                     // 将找到的牌加入玩家手牌。\n                     Console.WriteLine($\"\
  Drawn: {newCard}\");\n                     players[currentPlayer].PlayHand.Add(newCard);\n\
  \                     inputOK = true;\n                  }\n               } while\
  \ (inputOK == false);\n               // 显示带编号的新手牌。\n               Console.WriteLine(\"\
  New hand:\");\n               for (int i = 0; i < players[currentPlayer].PlayHand.Count;\
  \ i++)\n               {\n                  Console.WriteLine($\"{i + 1}: \" + \n\
  \                                    $\"{ players[currentPlayer].PlayHand[i]}\"\
  );\n               }\n               // 提示玩家选择一张牌要弃牌。\n               inputOK =\
  \ false;\n               int choice = -1;\n               do\n               {\n\
  \                  Console.WriteLine(\"Choose card to discard:\");\n           \
  \       string input = Console.ReadLine();\n                  try\n            \
  \      {\n                     // 尝试将输入转换为有效的牌号。\n                     choice =\
  \ Convert.ToInt32(input);\n                     if ((choice > 0) && (choice <= 8))\n\
  \                        inputOK = true;\n                  }\n                \
  \  catch\n                  {\n                     // 忽略失败的转换，继续提示。\n         \
  \         }\n               } while (inputOK == false);\n               // 将移除的牌的引用放入\
  \ playCard（将牌放在\n               // 桌面上），然后从玩家手牌中移除该牌并\n               // 加入弃牌堆。\n\
  \               playCard = players[currentPlayer].PlayHand[choice - 1];\n      \
  \         players[currentPlayer].PlayHand.RemoveAt(choice - 1);\n              \
  \ discardedCards.Add(playCard);\n               Console.WriteLine($\"Discarding:\
  \ {playCard}\");\n               // 为玩家留出空行\n               Console.WriteLine();\n\
  \               // 检查玩家是否赢了游戏，如果是则退出玩家\n               // 循环。\n               GameWon\
  \ = players[currentPlayer].HasWon();\n               if (GameWon == true)\n    \
  \              break;\n            }\n         } while (GameWon == false);\n   \
  \      // 结束，记录胜利玩家。\n         return currentPlayer;\n      }\n```\n\n图 13-8 显示了正在进行的游戏。\n\
  \n作为最后一个练习，仔细查看 `Player.HasWon()` 中的代码。你能想到某种让这段代码更高效的方法吗，也许不需要每次调用此方法时都检查玩家手牌中的每张牌？\n\
  \n![游戏进行中的截图。](img/c13f008.png)\n\n图 13-8\n\n## 属性\n\n本节简要介绍一种为使用类型的代码提供额外信息的有用方法：属性（attributes）。属性允许你为代码段标记信息，这些信息可以从外部读取，并以各种方式影响类型的使用。这通常被称为装饰代码（decorating）。你可以在本章在线下载的\
  \ `CustomAttributes\\Program.cs` 中找到相关代码。\n\n例如，假设你创建了一个类，其中有一个非常简单的方法。事实上，它简单到你对调试它并不感兴趣。不幸的是——这让你非常困扰的是——在调试应用程序时你一直在这样做。在这种情况下，可以给该方法添加一个属性，告诉\
  \ Visual Studio 在调试时不要进入该代码；相反，Visual Studio 应该跳过它并执行下一个语句。代码如下：\n\n```\n[DebuggerStepThrough]\n\
  public void DullMethod() { ... }\n```\n\n\n\n\n\n当你以这种方式添加属性时，编译器会创建属性类的实例并将其与类方法关联。某些属性可以通过构造函数参数或属性进行自定义，这些内容可以在添加属性时进行指定。例如：\n\
  \n```csharp\n[DoesInterestingThings(1000, WhatDoesItDo = \"voodoo\")]\npublic class\
  \ DecoratedClass {}\n```\n\n此属性向 `DoesInterestingThingsAttribute` 的构造函数传递了 `1000`\
  \ 的值，并将名为 `WhatDoesItDo` 的属性值设置为字符串 `\"voodoo\"`。\n\n## 读取属性\n\n要读取属性值，你必须使用一种名为\
  \ `reflection`（反射）的技术。这是一种相当高级的技术，允许你在运行时动态地检查类型信息，甚至可以在你不知道这些对象是什么的情况下创建对象并调用它们方法。本书将不会详细介绍这种技术，但为了使用属性，你确实需要了解一些基础知识。有关关于该技术的更多信息，请访问\
  \ [`docs.microsoft.com/en-us/dotnet/framework/reflection-and-codedom/reflection`](http://docs.microsoft.com/en-us/dotnet/framework/reflection-and-codedom/reflection)。\n\
  \n本质上，反射涉及使用存储在 `Type` 对象中的信息（你已经在本书的多个地方见过它们）以及 `System.Reflection` 命名空间中的类型来处理类型信息。你已经看到过通过\
  \ `typeof` 操作符从类获取类型信息，以及使用 `GetType()` 方法从对象实例获取信息的快捷方法。使用反射，你可以继续从 `Type` 对象查询成员信息。然后你可以从类或其各种成员获取属性信息。\n\
  \n执行此操作的最简单方法（也是你在书中看到的唯一方法）是使用 `Type.GetCustomAttributes()` 方法。该方法接受最多两个参数，并返回\
  \ `object` 实例数组，每个实例都是一个属性实例。首先，你可以选择传递感兴趣的属性类型或类型（任何其他属性将被忽略）。如果你省略此参数，将返回所有属性。其次，你必须传递一个布尔值，指示只查看类本身，还是查看类及其派生的所有类。\n\
  \n例如，以下代码将列出 `DecoratedClass` 类的属性：\n\n```csharp\nType classType = typeof(DecoratedClass);\n\
  object[] customAttributes = classType.GetCustomAttributes(true);\nforeach (object\
  \ customAttribute in customAttributes)\n{\n   Console.WriteLine($\"Attribute of\
  \ type {customAttribute} found.\");\n}\n```\n\n一旦你通过这种方式找到了属性，就可以对该属性采取任何适当的操作。这正是\
  \ Visual Studio 在遇到之前讨论的 `DebuggerStepThroughAttribute` 属性时所做的。\n\n## 创建属性\n\n你只需通过派自\
  \ `System.Attribute` 类来创建自己的属性。有时，你不需要做其他操作，因为如果你的代码只关心属性是否存在，则不需要额外信息。然而，如果你希望属性是可自定义的，可以提供非默认构造函数和/或可写属性。\n\
  \n你还需要对你的属性决定两点：它可以应用于什么类型的目标（类、属性等），以及它是否可以多次应用于同一个目标。你通过一个应用到你的属性上的属性来指定这些信息（这具有某种“禅意”十足的正确性感！），该属性被称为\
  \ `AttributeUsageAttribute`。该属性有一个类型为 `AttributeTargets` 的构造函数参数，这是一个枚举，允许你使用 `|`\
  \ 操作符组合它的值。它还有一个名为 `AllowMultiple` 的布尔属性，用于指定该属性是否可以多次应用。\n\n例如，以下代码指定了一个可以（一次）应用于类或属性的属性：\n\
  \n```csharp\n[AttributeUsage(AttributeTargets.Class | AttributeTargets.Method,\n\
  \                AllowMultiple = false)]\nclass DoesInterestingThingsAttribute :\
  \ Attribute\n{\n   public DoesInterestingThingsAttribute(int howManyTimes)\n   {\n\
  \      HowManyTimes = howManyTimes;\n   }\n   public string WhatDoesItDo { get;\
  \ set; }\n   public int HowManyTimes { get; private set; }\n}\n```\n\n这个属性 `DoesInterestingThingsAttribute`\
  \ 可以像之前的代码段那样使用：\n\n```csharp\n[DoesInterestingThings(1000, WhatDoesItDo = \"karma\"\
  )]\npublic class DecoratedClass {}\n```\n\n通过修改上一节中的代码，你可以访问该属性的属性：\n\n```csharp\n\
  Type classType = typeof(DecoratedClass);\nobject[] customAttributes = classType.GetCustomAttributes(true);\n\
  foreach (object customAttribute in customAttributes)\n{\n   Console.WriteLine($\"\
  Attribute of type {customAttribute} found.\");\n   DoesInterestingThingsAttribute\
  \ interestingAttribute =\n      customAttribute as DoesInterestingThingsAttribute;\n\
  \   if (interestingAttribute != null)\n   {\n      Console.WriteLine($\"This class\
  \ does {interestingAttribute.WhatDoesItDo} x \" +\n                        $\"{interestingAttribute.HowManyTimes}!\"\
  );\n   }\n}\n```\n\n将本节的所有内容结合起来并使用这段代码，将得到图 13-9 所示的结果。\n\n![运行应用程序后出现的结果截图。](img/c13f009.png)\n\
  \n图 13-9\n\n属性非常有用，遍布 .NET 应用程序——特别是 WPF 和 Universal Windows 应用程序。你将在本书剩余部分反复遇到它们。\n\
  \n## 初始化器\n\n到为止，你已经学习了以各种方式实例化和初始化对象。通常这需要你在类定义中添加代码以初始化，或者通过单独的语句实例化并初始化。你还学习了如何创建各种类型的集合，包括泛型集合。再次，你可能注意到没有一种简单的方法可以将创建集合与添加项结合起来。\n\
  \n对象初始化器通过允许你结合对象的实例化和初始化来简化代码。集合初始化器为你提供了一种简单、优雅的语法来创建并填充集合。本节将解释如何使用这两个功能。\n\n\
  ### 对象初始化器\n\n考虑以下简单的类定义：\n\n```csharp\npublic class Animal\n{\n   public string\
  \ Name { get; set; }\n   public int Age { get; set; }\n   public double Weight {\
  \ get; set; }\n}\n```\n\n该类具有使用第 10 章所示自动属性定义的三个属性。如果你想实例化并初始化此类的对象实例，必须执行多个语句：\n\
  \n```csharp\nAnimal animal = new Animal();\nanimal.Name = \"Benjamin\";\nanimal.Age\
  \ = 42;\nanimal.Weight = 185.4;\n```\n\n此代码使用了 C# 编译器在类定义中没有包含构造函数的情况下提供的默认无参数构造函数。为了简化初始化，你可以提供适当的非默认构造函数：\n\
  \n```csharp\npublic class Animal\n{\n   public Animal(string name, int age, double\
  \ weight)\n   {\n       Name = name;\n       Age = age;\n       Weight = weight;\n\
  \   }\n   ...\n}\n```\n\n这允许你编写结合实例化和初始化的代码：\n\n```csharp\nAnimal animal = new Animal(\"\
  Noa\", 5, 45.2);\n```\n\n这种方式运行良好，尽管它强制使用该类的代码使用此构造函数。然而，这将导致使用无参数构造函数的之前的代码无法工作。通常，当类必须被序列化时，有必要提供无参数构造函数：\n\
  \n```csharp\npublic class Animal\n{\n   public Animal() {}\n   ...\n}\n```\n\n\n\
  \n\n现在你处于一种可以随你喜欢的方式实例化并初始化 `Animal` 类的情况下。然而，你在初始类定义中添加了几行代码，这些代码除了为这种灵活性提供基础管道支持外，并没有做太多其他事情。\n\
  \n引入**对象初始化器**（object initializers），这是一种无需向类中添加代码（如此处详细介绍的构造函数）即可实例化和初始化对象的方法。当你实例化一个对象时，可以使用“名称/值”对来为每个想要初始化的公共访问属性或字段提供值。其语法如下：\n\
  \n```\n<ClassName> <variableName> = new <ClassName>\n{\n   <propertyOrField1> =\
  \ <value1>,\n   <propertyOrField2> = <value2>,\n   ...\n   <propertyOrFieldN> =\
  \ <valueN>\n};\n```\n\n例如，你可以如下所示重写之前显示的代码（该代码实例化并初始化了一个 `Animal` 类型对象）：\n\n```\n\
  Animal animal = new Animal\n{\n   Name = \"Lea\",\n   Age = 14,\n   Weight = 35.2\n\
  };\n```\n\n通常，你可以将这样的代码放在单行内，而不会严重降低可读性。\n\n当你使用对象初始化器时，不需要显式地调用类的构造函数。如果你省略了构造函数的括号（如前面的代码所示），会自动调用默认的无参数构造函数。这发生在初始化器设置任何参数值之前，这允许你根据需要为默认构造函数中的参数提供默认值。或者，你也可以调用特定的构造函数。同样，该构造函数会被首先调用，因此在构造函数进行的任何公共属性初始化可能会被你在初始化器中提供的值所覆盖。为了让对象初始化器工作，你必须能够访问所使用的构造函数（如果没有显式指定，则为默认的）。\n\
  \n如果你想要用对象初始化器初始化的属性比本示例中使用的简单类型更复杂，你可能会发现自己在使用`嵌套对象初始化器`。这简单意味着使用你已经看到的完全相同的语法：\n\
  \n```\nAnimal animal = new Animal\n{\n    Name = \"Rual\",\n    Age = \"80\",\n\
  \    Weight = 172.7,\n    Origin = new Farm\n    {\n      Name = \"Circle Perk Ranch\"\
  ,\n      Location = \"Ann Road\",\n      Rating = 15\n    }\n};\n```\n\n在这里，初始化了一个类型为\
  \ `Farm`（此处未显示）的属性 `Origin`。代码初始化了 `Origin` 属性的三个属性——`Name`、`Location` 和 `Rating`，分别使用\
  \ `string`、`string` 和 `int` 类型的值。这种使用了嵌套对象初始化器。\n\n注意，对象初始化器并不是非默认构造函数的替代品。你可以在实例化对象时使用对象初始化器设置属性和字段值，这一事实并不意味着你总是知道哪些状态需要初始化。通过构造函数，你可以精确地指定对象运行所需的哪些值，然后立即执行响应于这些值的代码。\n\
  \n此外，在上一个示例中，使用嵌套对象初始化器和使用构造函数之间还有另一个（诚然非常细微）的区别。这种区别在于对象创建的顺序。使用嵌套初始化器时，顶层对象（`Animal`）首先创建。接下来，创建嵌套对象（`Farm`）并将其赋值给属性\
  \ `Origin`。如果你使用构造函数，将反转这种构造顺序，并将 `Farm` 实例传递给 `Animal` 的构造函数。在这个简单的示例中，这没有实际区别，但在某些情况下，这可能是重大的。\n\
  \n### 集合初始化器\n\n第 5 章 描述了如何使用以下语法用值初始化数组：\n\n```\nint[] myIntArray = new int[5]\
  \ { 5, 9, 10, 2, 99 };\n```\n\n这是结合数组实例化和初始化的一种快速方便的方法。集合初始化器仅是将此语法扩展到集合：\n\n```\n\
  List<int> myIntCollection = new List<int> { 5, 9, 10, 2, 99 };\n```\n\n通过结合对象初始化器和集合初始化器，可以使用简单优雅的代码来配置集合。而不是像这样的代码：\n\
  \n```\nList<Animal> animals = new List<Animal>();\nanimals.Add(new Animal(\"Donna\"\
  , 72, 116));\nanimals.Add(new Animal(\"Mary\", 53, 132));\nanimals.Add(new Animal(\"\
  Andrea\", 49, 109.1));\n```\n\n你可以使用：\n\n```\nList<Animal>  moreAnimals = new List<Animal>\n\
  {\n   new Animal\n   {\n       Name = \"Donna\",\n       Age = 72,\n       Weight\
  \ = 116\n   },\n   new Animal\n   {\n      Name  = \"Mary\",\n      Age   = 53,\n\
  \      Weight  = 132\n   },\n   new Animal\n   {\n      Name  = \"Andrea\",\n  \
  \    Age   = 49,\n      Weight  = 109.1\n   }\n};\n```\n\n这对于主要用于数据表示的类型非常有效，因此，集合初始化器是书中后面描述的\
  \ LINQ 技术的绝佳辅助。\n\n接下来的“尝试一试”演示了你如何使用对象和集合初始化器。\n\n### 类型推断\n\n在本书的早些部分，你看到 C# 是一种`强类型`（strongly\
  \ typed）语言，这意味着每个变量都有固定的类型。在你目前看到的每个示例中：\n\n你可以使用 `var` 关键字作为前面代码中显式类型的替代：\n\n```\n\
  int myInt = 5;\n```\n\n在此代码中，`myInt` 是 `int` 类型而不是 `var` 类型。再次，如[图 13-12](#c13.xhtml_13-12）所示，IDE\
  \ 感知这一点。\n\n```\nvar myInt = 5;\n```\n\n在此代码中，`myInt` 隐式类型为 `int`。注意，并没有名为 `var`\
  \ 的类型。\n\n这是一个极其重要的点。当你使用 `var` 时，你并不是声明一个没有类型的变量，甚至是一个可以变化的类型。如果是那样，C# 就不再是强类型语言了。你所做的只是依赖编译器来确定变量的类型。\n\
  \n如果编译器无法确定使用 `var` 声明的类型，那么你的代码将无法编译。因此，你不能在初始化变量的同时声明 `var`。如果这样做，编译器就没有可以使用值来确定变量的类型。以下代码无法编译：\n\
  \n```\nvar myVar;\n```\n\n`var` 关键字也可以通过数组初始化器推断数组的类型：\n\n```\nvar myArray = new[]\
  \ { 4, 5, 2 };\n```\n\n在此代码中，`myArray` 的类型是隐式的 `int[]`。当你以这种方式隐式类型数组时，初始化器中的数组元素必须满足以下条件之一：\n\
  \n- 全是相同类型\n- 全是相同引用类型或 null\n- 全是可以隐式转换为单个类型的元素\n\n如果对于这个最佳类型存在任何歧义——即存在两个或多个所有元素都可以隐式转换的类型——你的代码将无法编译。相反，你会收到指示没有可用最佳类型的错误，如下代码所示：\n\
  \n\n\n\n\n```cs\nvar myArray = new[] { 4, \"not an int\", 2 };\n```\n\n请注意，数值永远不会被解释为可空类型，因此以下代码将无法编译：\n\
  \n```cs\nvar myArray = new[] { 4, null, 2 };\n```\n\n然而，你可以使用标准数组初始化器来使其工作：\n\n\
  ```cs\nvar myArray = new int?[] { 4, null, 2 };\n```\n\n最后一点：标识符 `var` 并不是禁止用于类名的受用标识符。这意味着，例如，如果你的代码在作用域内有一个名为\
  \ `var` 的类（在同一个命名空间或引用的命名空间中），那么你就不能使用 `var` 关键字进行隐式类型声明。\n\n类型推断本身并不有用，因为在这一节看到的代码中，它只是起到了使问题复杂的作用。使用\
  \ `var` 会让你更难一眼看出给定变量的类型。然而，正如你将在本章稍后部分看到的，推断类型的概念是非常重要的，因为它是其他技术的基础。下一个主题匿名类型，是一个对推断类型至关重要的主题。\n\
  \n## 匿名类型\n\n编程一段时间后，你可能会发现（特别是在数据库应用程序中），你花费了大量时间创建简单、单调的类来表示数据。拥有一系列除了暴露属性之外什么都不做的类并不罕见。本章之前所示的\
  \ `Animal` 类就是一个完美的例子：\n\n```cs\npublic class Animal\n{\n   public string Name {\
  \ get; set; }\n   public int Age { get; set; }\n   public double Weight { get; set;\
  \ }\n}\n```\n\n这个类什么都不做——它仅仅存储了结构化数据。在数据库或电子表格术语中，你可以将此类认为代表表格中的行。可以包含该类实例的集合类是表格或电子表格中多行的表示。\n\
  \n这是类的一种完全可以接受的用法，但编写这些类的代码可能会变得单调，而且对底层数据模式的任何修改都要求你添加、删除或修改定义类的代码。\n\n匿名类型是简化这种编程模型的方法。匿名类型背后的想法是，与其定义这些简单的数据存储类型，你可以使用\
  \ C# 编译器根据你想要存储在它们中的数据自动创建类型。\n\n之前的 `Animal` 类型可以如下所示实例化：\n\n```cs\nAnimal animal\
  \ = new Animal\n{\n    Name = \"Benjamin\",\n    Age = 49,\n    Weight = 185.4\n\
  };\n```\n\n或者，你可以使用匿名类型，如下代码所示：\n\n```cs\nvar animal = new\n{\n    Name = \"Lea\"\
  ,\n    Age = 14,\n    Weight = 35.2\n};\n```\n\n这里有两个不同之处。首先，使用了 `var` 关键字。这是因为匿名类型没有你可以使用的类型标识符。在内部，它们确实有一个标识符（正如你稍后看到的），但它在你的代码中是不可用的。其次，在\
  \ `new` 关键字之后没有指定类型名。这就是编译器知道你想要使用匿名类型的方式。\n\nIDE 检测到匿名类型的定义并相应地更新 IntelliSense。通过前面的声明，你可以看到匿名类型，如图\
  \ 13-14 所示。\n\n![编码截图，显示了匿名类型。](img/c13f014.png)\n\n**图 13-14**\n\n在这里，内部，变量 `animal`\
  \ 的类型是 `a`。显然，你不能在代码中使用这种类型——它甚至不是一个合法的标识符名称。`'` 仅仅是用于在 IntelliSense 中表示匿名类型的符号。IntelliSense\
  \ 还允许你检查匿名类型的成员，如图 13-15 所示。\n\n![匿名类型成员的截图。](img/c13f015.png)\n\n**图 13-15**\n\n\
  注意，这里显示的属性被定义为只读属性。这意味着如果你想能够更改数据存储对象中属性的值，你就不能使用匿名类型。\n\n匿名类型的其他成员的实现，如下所示的“尝试一试”所示。\n\
  \n## 动态查找\n\n如前所述，`var` 关键字本身并不是一种类型，因此它没有破坏 C# 的“强类型”方法论。然而，从 `var` 引入以来，事情变得稍微没那么固定了。另一个相关的概念被称为动态变量，正如其名所示，它们是没有固定类型的变量。\n\
  \n此举的主要动机是，在许多情况下，你会希望使用 C# 来操作由另一种语言创建的对象。这包括与组件对象模型 (COM) 等旧技术的互操作性，以及处理 JavaScript、Python\
  \ 和 Ruby 等动态语言。在不涉及过多实现细节的情况下，使用 C# 访问这些语言创建的对象的方法和属性过去涉及到笨拙的语法。例如，假设你有一段代码从 JavaScript\
  \ 获取了一个具有名为 `Add()` 方法的对象，它可以加两个数字。在不涉及过多实现细节的情况下，使用 C# 访问这些语言创建的对象的方法和属性过去涉及到笨拙的语法。例如，假设你有一段代码从\
  \ JavaScript 获取了一个具有名为 `Add()` 方法的对象，它可以加两个数字。\n\n```cs\nScriptObject jsObj = SomeMethodThatGetsObject();\n\
  int sum = Convert.ToInt32(jsObj.Invoke(\"Add\", 2, 3));\n```\n\n`ScriptObject` 类型（不再深入讨论）提供了一种访问\
  \ JavaScript 对象的方法，但即使是无法无法：\n\n```cs\nint sum = jsObj.Add(2, 3);\n```\n\n实际上，你使用这样的代码是在提供一个在运行时应用的的“配方”。`myDynamicVar`\
  \ 的值将被检查，并且具有单个字符串参数的 `DoSomething()` 方法将在需要的地方被找到并调用。\n\n这通过示例说明最为清楚。\n\n### 动态类型\n\
  \n`dynamic` 关键字（可以使用它来定义变量）如下示例所示：\n\n```cs\ndynamic myDynamicVar;\n```\n\n与早期引入的\
  \ `var` 关键字不同，这里确实存在一种 `dynamic` 类型，因此在声明时不需要初始化 `myDynamicVar` 的值。\n\n一旦有了动态变量，你就可以继续访问其成员（此处未显示获取变量值的代码）：\n\
  \n```cs\nmyDynamicVar.DoSomething(\"With this!\");\n```\n\n无论 `myDynamicVar` 包含什么值，此代码都可以通过编译。然而，如果请求的成员不存在，当你执行此代码时将得到一个异常，类型为\
  \ `RuntimeBinderException`。\n\n\n\n\n\n# 高级方法参数\n\n在定义和使用方法参数时有许多可能性。这些方法的创建主要是为了在使用外部定义的接口（例如\
  \ Microsoft Office 编程模型）时出现的特定问题。在这里，某些方法暴露了大量的参数，其中许多参数在每次调用时都是需要的。在过去，这意味着需要一种方法来指定缺失的参数，或者代码中会出现大量的\
  \ `null`：\n\n```\nRemoteCall(var1, var2, null, null, null, null, null);\n```\n\n\
  在这段代码中，完全不清楚这些 `null` 值指的是什么，或者为什么它们被省略了。\n\n也许，在一个理想的世界里，这个 `RemoteCall()` 方法会有多个重载版本，其中一个仅需要两个参数，如下所示：\n\
  \n```\nRemoteCall(var1, var2);\n```\n\n然而，这将需要更多具有不同参数组合的方法，这本身就会导致更多问题（需要维护的代码更多、代码复杂性增加等）。\n\
  \nVisual Basic 等语言通过一种不同的方式处理了这种情况，即允许使用命名参数和可选参数。这在 C# 中变得可能，展示了所有 .NET 语言演进正在趋同的一种方式。\n\
  \n在接下来的章节中，你将看到如何使用这些参数类型。\n\n## 可选参数\n\n当你调用方法时，通常会为特定参数传递相同的值。例如，可以是一个布尔值，它可能控制方法操作的非本质部分。更具体地说，考虑以下方法定义：\n\
  \n```\npublic List<string> GetWords(string sentence, bool capitalizeWords)\n{\n\
  \   ...\n}\n```\n\n无论传递给 `capitalizeWords` 参数的值是什么，此方法都将返回一个 `string` 值列表，其中每个值都是输入句子中的一个单词。根据该方法的使用方式，你可能偶尔想将返回的单词列表大写（也许你正在格式化像本节标题“可选参数”之类的标题）。但在大多数情况下，你可能不想这样做，因此大多数调用将如下：\n\
  \n```\nList<string> words = GetWords(sentence, false);\n```\n\n为了让这种行为成为“默认”行为，你可以如下所示声明第二个方法：\n\
  \n```c\npublic List<string> GetWords(string sentence) => GetWords(sentence, false);\n\
  ```\n\n此方法调用第二个方法，并为 `capitalizeWords` 传递 `false` 值。\n\n这样做没有问题，但你可能可以想象在在使用许多更多参数的情况下，情况会变得多么复杂。\n\
  \n另一种方法是将 `capitalizeWords` 参数变为可选参数。这涉及到在方法定义中通过提供默认值将该参数定义为可选，如果未提供值则使用该默认值，如下：\n\
  \n```c\npublic List<string> GetWords(string sentence, bool capitalizeWords = false)\n\
  {\n   ...\n}\n```\n\n如果你这样定义方法，那么你就可以提供一个或两个参数，其中只有在你让 `capitalizeWords` 为 `true`\
  \ 时，才需要第二个参数。重载方法必须与带有可选参数的方法不同。例如，如果一个方法接受两个可选的 `int` 参数，那么你不能拥有不带参数、一个 `int` 或两个\
  \ `int` 的重载版本，因为编译器无法判断应该使用它们还是使用带有可选参数的方法。\n\n### 可选参数值\n\n如上一节所述，方法定义通过以下语法定义可选参数：\n\
  \n```\n<parameterType> <parameterName> = <defaultValue>\n```\n\n对于`<defaultValue>`\
  \ 默认值可以使用什么内容有限制。默认值必须是字面量值、常量值或类型的默认值。因此，以下内容将无法编译：\n\n```c\npublic bool CapitalizationDefault;\n\
  public List<string> GetWords(string sentence,\n   bool capitalizeWords = CapitalizationDefault)\n\
  {\n   ...\n}\n```\n\n为了使这能够工作，`CapitalizationDefault` 值必须定义为常量：\n\n```c\npublic\
  \ const bool CapitalizationDefault = false;\n```\n\n这样做是否有意义取决于具体情况；在大多数情况下，你可能像上一节那样提供一个字面量值会更好。\n\
  \n### OptionalAttribute 特性\n\n作为前几节描述语法的替代方案，你可以使用 `OptionalAttribute` 特性如下定义可选参数：\n\
  \n```\n[Optional] <parameterType> <parameterName>\n```\n\n该特性位于 `System.Runtime.InteropServices`\
  \ 命名空间。请注意，如果你使用这种语法，没有办法为参数提供默认值。\n\n### 可选参数顺序\n\n当你使用可选值时，它们必须出现在方法参数列表的末尾。任何没有默认值的参数不能出现在任何带有默认值的参数之后。\n\
  \n因此，以下代码是非合法的：\n\n```c\npublic List<string> GetWords(bool capitalizeWords = false,\
  \ string sentence)\n{\n   ...\n}\n```\n\n在这里，`sentence` 是一个必要参数，因此必须出现在可选的 `capitalizedWords`\
  \ 参数之前。\n\n## 命名参数\n\n当你使用可选参数时，你可能会发现某个特定方法有多个可选参数。那么，在想象范围内，可以设想出一种情况，即你只想向例如第三个可选参数传递值。仅凭上一节的语法，在不为第一个和第二个可选参数提供值的情况下是无法实现的。\n\
  \n命名参数允许你指定任何你想要的参数。这不需要你对方法定义进行任何特殊处理；它是你在调用方法时使用的一种技术。语法如下：\n\n```\nMyMethod(\n\
  \   <param1Name>: <param1Value>,\n   ...\n   <paramNName>: <paramNValue>);\n```\n\
  \n参数名称是方法定义中使用的变量名称。\n\n你可以这种方式指定任意数量的参数，只要这些命名参数存在，并且以任何顺序进行。命名参数也可以是可选的。\n\n如果你愿意，可以只对方法调用中的某些参数使用命名参数。当方法签名中有多个可选参数，但也有一些必要参数时，这特别有用。你可能先指定必要参数，然后以命名的可选参数结束。例如：\n\
  \n```\nMyMethod(\nrequiredParameter1Value,\noptionalParameter5: optionalParameter5Value);\n\
  ```\n\n但是，如果你混合使用命名参数和位置参数，请注意你必须在命名参数之前包含所有位置参数。然而，如果你倾向于整个过程中都使用命名参数，如下例所示），也可以使用不同的顺序：\n\
  \n```c\nMyMethod(\noptionalParameter5: optionalParameter5Value,\nrequiredParameter1:\
  \ requiredParameter1Value);\n```\n\n如果你这样做，你必须包含所有必要参数的值。使用命名参数的另一个理由是为了更容易理解哪些值适用于哪些参数。例如，如果你有\
  \ 10 个参数，那么仅仅按顺序列出可能很难阅读。\n\n在接下来的“尝试一试”中，你将看到如何使用命名参数和可选参数。\n\n## Lambda 表达式\n\n\
  \n\n\n\n`Lambda expressions` 是一种你可以用于简化 C# 编程某些方面的构造结构，特别是当它们与 `LINQ` 结合时。它们在起初可能很难理解，主要是因为它们的用法非常灵活。当\
  \ Lambda 表达式与其它 C# 语言特性（如匿名方法）结合时，它们会变得极其有用。在不先过 `LINQ`（这是书中稍后才会介绍的主题）的情况下，匿名方法是研究该主题的最佳切入点。让我们从快速的复习开始。\n\
  \n### 匿名方法回顾\n\n在本章之前的内容中，你学习了匿名方法——即你内联提供的方法，而在其他情况下则需要一个 `delegate` 类型的变量。当你向事件添加事件处理程序时，事件序列如下：\n\
  \n1. 定义一个事件处理程序方法，其返回类型和参数与你想要订阅的事件所需的 `delegate` 类型匹配。\n2. 声明一个用于该事件的 `delegate`\
  \ 类型的变量。\n3. 将 `delegate` 变量初始化为 `delegate` 类型的实例，该实例指向事件处理方法。\n4. 将 `delegate`\
  \ 变量添加到事件的订阅者列表中。\n\n在实践中，情况会比这简单一点，因为你通常不会费心用一个变量来存储委托——你只需要在订阅事件时直接使用委托的实例即可。\n\
  \n在你之前使用以下代码时情况此类此：\n\n```\nTimer myTimer = new Timer(100);\nmyTimer.Elapsed +=\
  \ new ElapsedEventHandler(WriteChar);\n```\n\n这段代码订阅了 `Timer` 对象的 `Elapsed` 事件。该事件使用\
  \ `ElapsedEventHandler` `delegate` 类型，该类型通过方法标识符 `WriteChar` 实例化。这里的结果是，当 `Timer`\
  \ 触发 `Elapsed` 事件时，会调用 `WriteChar()` 方法。传递给 `WriteChar()` 的参数取决于 `ElapsedEventHandler`\
  \ `delegate` 定义的参数类型，以及 `Timer` 中触发事件的代码所传递的值。\n\n事实上，C# 编译器可以通过方法组语法用更更少的代码来实现相同的结果：\n\
  \n```\nmyTimer.Elapsed += WriteChar;\n```\n\nC# 编译器知道 `Elapsed` 事件所需的 `delegate`\
  \ 类型，因此它可以填充空白。然而，你应该谨慎地使用这种语法，因为它可能会让你的代码更难阅读，并让你无法确切地知道正在发生什么。当你使用匿名方法时，之前显示的事件序列简化为了单个步骤：\n\
  \n使用一个内联的匿名方法，该方法与订阅该事件所需的 `delegate` 的返回类型和参数匹配以订阅该事件。\n\n内联匿名方法通过使用 `delegate`\
  \ 关键字定义：\n\n```\nmyTimer.Elapsed +=\n   delegate(object source, ElapsedEventArgs\
  \ e)\n   {\n      Console.WriteLine(\"Event handler called after {0} milliseconds.\"\
  ,\n         (source as Timer).Interval);\n   };\n```\n\n这段代码的效果与单独使用事件处理程序一样好。主要的区别在于，这里使用的匿名方法实际上对你代码的其他部分是隐藏的。例如，你无法在应用程序的其他地方重用此事件处理程序。此外，这里使用的语法（如果找个更好的描述的话）有点笨拙。`delegate`\
  \ 关键字立即让人困惑，因为它实际上是被重载了——你既将其用于匿名方法，又将其定义 `delegate` 类型。\n\n### 用于匿名方法的 Lambda 表达式\n\
  \n这就引出了 Lambda 表达式。Lambda 表达式是简化匿名方法语法的一种。事实上，它们不仅于此，但本节目前将保持简单。使用 Lambda 表达式，你可以按照如下方式重写上一节末尾的代码：\n\
  \n```\nmyTimer.Elapsed += (source, e) => Console.WriteLine(\"Event handler called\
  \ after \" +\n                      $\"{(source as Timer).Interval} milliseconds.\"\
  );\n```\n\n乍看之下，这看起来……嗯，有点费惑（除非你熟悉如 `Lisp` 或 `Haskell` 等所谓的函数式编程语言）。然而，如果你仔细观察，就可以看到或至少推断出它是如何工作的，以及它与被取代的匿名方法有什么联系。Lambda\
  \ 表达式由三部分组成：\n\n- 括号中的一组（无类型）参数列表\n- `=>` 运算符\n- 一个 C# 语句\n\n参数的类型是从上下文中推断出来的，使用了本章稍早“匿名类型”部分中所示的逻辑。`=>`\
  \ 运算符简单地将参数列表与表达式体隔开。表达式体在 Lambda 表达式被调用时执行。\n\n编译器获取此 Lambda 表达式并创建一个与上一节中匿名方法工作方式完全相同的匿名方法。事实上，它将被编译成相同或相似的公共中间语言\
  \ (`CIL`) 代码。\n\n接下来的“尝试一试”将阐明 Lambda 表达式中发生了什么。\n\n### Lambda 表达式参数\n\n在你目前看到的代码中，Lambda\
  \ 表达式使用了类型推断来确定传递的参数类型。事实上，这并不是强制的；如果你愿意，可以定义类型。例如，你可以使用以下 Lambda 表达式：\n\n```\n\
  (int paramA, int paramB) => paramA + paramB\n```\n\n这种方式具有提高代码可读性的优点，尽管你在简洁性和活性上有所损失。你可以将之前“尝试一试”中的隐式类型\
  \ Lambda 表达式用于使用了其他数值类型（如 `long` 变量）的 `delegate` 类型。\n\n注意，你不能在同一个 Lambda 表达式中使用隐式和显式参数类型。以下\
  \ Lambda 表达式将无法编译，因为 `paramA` 是显式类型而 `paramB` 是隐式类型：\n\n```\n(int paramA, paramB)\
  \ => paramA + paramB\n```\n\nLambda 表达式中的参数列表始终由隐式类型或显式类型的参数逗号分隔列表组成。如果你只有一个隐式参数，则可以省略括号；否则，作为参数列表的一部分是要求的，如之前所示。例如，你可以拥有如下单参数隐式类型\
  \ Lambda 表达式：\n\n```\nparam1 => param1 * param1\n```\n\n你也可以定义没有参数的 Lambda 表达式。这通过使用空括号\
  \ `()` 表示：\n\n```\n() => Math.PI\n```\n\n这可以用于需要无参数但返回 `double` 值的委托。\n\n### Lambda\
  \ 语句体\n\n在你目前看到的所有代码中，Lambda 表达式的语句体使用的是单个表达式。你还看到这个单个表达式被解释为 Lambda 表达式的返回值，例如，你可以将表达式\
  \ `paramA + paramB` 作为返回类型为 `int` 的 Lambda 表达式的语句体（假设 `paramA` 和 `paramB` 正如示例代码所示隐式或显式类型为\
  \ `int`）。之前的示例显示了返回 `void` 类型的委托对语句体中的代码不那么挑剔：\n\n```\nmyTimer.Elapsed += (source,\
  \ e) => Console.WriteLine(\"Event handler called after \" + \n                 \
  \  $\"{(source as Timer).Interval} milliseconds.\");\n```\n\n在这里，语句产生产生结果，因此它只是执行，没有任何地方使用返回值。\n\
  \n既然 Lambda 表达式可以被视为匿名方法语法的扩展，你可能不会惊讶于发现，你也可以将多个语句作为 Lambda 表达式的语句体。要做到这一点，你只需提供一个用大括号封闭的代码块，就像在\
  \ C# 中任何其他需要提供多行代码的情况一样：\n\n```\n(param1, param2) =>\n{\n   // 多条语句来喽！\n}\n```\n\
  \n\n\n\n\n如果你将 lambda 表达式与具有非 `void` 返回类型的委托类型结合使用，那么你必须使用 `return` 关键字返回一个值，就像任何其他方法一样：\n\
  \n```c\n(param1, param2) =>\n{\n   // 有多条语句！\n   return returnValue;\n}\n```\n\n\
  例如，你之前已经看到如何重写上一个“尝试运行”（Try It Out）中的以下代码：\n\n```c\n PerformOperations((paramA,\
  \ paramB) => paramA + paramB);\n```\n\n写为：\n\n```c\n PerformOperations(delegate(int\
  \ paramA, int paramB)\n            {\n               return paramA + paramB;\n \
  \           });\n```\n\n或者，你也可以如下所示重写代码：\n\n```c\n PerformOperations((paramA, paramB)\
  \ =>\n            {\n               return paramA + paramB;\n            });\n```\n\
  \n这更符合原始代码的习惯，因为它保持了 `paramA` 和 `paramB` 参数的隐式类型。\n\n大多数情况下，lambda 表达式在与单个表达式配合时最有用——也无疑最优雅。坦率地说，如果你需要多条语句，那么定义一个独立的、非匿名的方法来使用而不是\
  \ lambda 表达式，你的代码读起来可能会好得多；这也能让你的代码更具重用性。\n\n### 作为委托和表达式树的 Lambda 表达式\n\n你已经看到了\
  \ lambda 表达式与匿名方法之间的某些区别，lambda 方法具有更高的灵活性——例如，隐式类型参数。此时，值得注意另一个关键区别，尽管其影响直到在书中后部分你学习\
  \ LINQ 时才会显现出来。\n\n你可以通过两种方式来解释 lambda 表达式。第一种方法是你在本章中一直看到的，即将其视为委托。也就是说，你可以将 lambda\
  \ 表达式赋值给委托类型变量，就像你在之前的“尝试运行”中做的那样。\n\n通来说，你可以将具有最多八个参数的 lambda 表达式表示为以下泛型类型之一，它们都定义在\
  \ `System` 命名空间中：\n\n*   `Action` 用于无参数且返回类型 `void` 的 lambda 表达式\n*   `Action<>`\
  \ 用于最多有八个参数且返回类型为 `void` 的 lambda 表达式\n*   `Func<>` 用于最多有八个参数且返回类型非 `void` 的 lambda\
  \ 表达式\n\n`Action<>` 有最多八个泛型类型参数，每个对应一个参数，而 `Func<>` 有最多九个泛型类型参数，用于最多八个参数和一个返回类型。在\
  \ `Func<>` 中，返回类型始终是列表中的最后一个。\n\n例如，你之前看到的以下 lambda 表达式\n\n```c\n(int paramA, int\
  \ paramB) => paramA + paramB\n```\n\n可以表示为类型为 `Func<int, int, int>` 的委托，因为它有两个参数且返回类型均为\
  \ `int` 类型。请注意，在许多情况下，你可以使用这些泛型委托类型而不是定义自己的。例如，你可以使用它们来代替你在之前的“尝试运行”中定义的 `TwoIntegerOperationDelegate`\
  \ 委托。\n\n解释 lambda 表达式的第二种方法将其视为表达式树（expression tree）。表达式树是 lambda 表达式的抽象表示；因此，它不能直接执行。相反，你可以使用表达式树通过程序分析\
  \ lambda 表达式，并根据 lambda 表达式执行操作。\n\n这显然是一个复杂的课题。然而，表达式树对于你将在书中后面学习的 LINQ 功能至关重要。为了给出一个更具体的例子，LINQ\
  \ 框架包含一个名为 `Expression<>` 的泛型类，你可以用它来封装 lambda 表达式。该类的用法方法之一是将你在 C# 中编写的 lambda\
  \ 表达式转换为等效的 SQL 脚本表示，以便直接在数据库中执行。当你在书中后面遇到此功能时，你将能够更好地理解发生了什么，因为你现在对 C# 语言提供的关键概念已经有了透彻的基础。\n\
  \n### Lambda 表达式与集合\n\n现在你已经学习了 `Func<>` 泛型委托，就可以理解 `System.Linq` 命名空间为数组类型提供的一些扩展方法（你可能在编码过程的不同阶段在\
  \ IntelliSense 中看到它们出现）。例如，有一个名为 `Aggregate()` 的扩展方法，它具有以下三个重载定义：\n\n```c\npublic\
  \ static TSource Aggregate<TSource>(\n   this IEnumerable<TSource> source,\n   Func<TSource,\
  \ TSource, TSource> func);\npublic static TAccumulate Aggregate<TSource, TAccumulate>(\n\
  \   this IEnumerable<TSource> source,\n   TAccumulate seed,\n   Func<TAccumulate,\
  \ TSource, TAccumulate> func);\npublic static TResult Aggregate<TSource, TAccumulate,\n\
  \                                Aggregate<TSource, TAccumulate, TResult>( TResult>(\n\
  \   this IEnumerable<TSource> source,\n   TAccumulate seed,\n   Func<TAccumulate,\
  \ TSource, TAccumulate> func,\n   Func<TAccumulate, TResult> resultSelector);\n\
  ```\n\n与之前显示的扩展方法一样，这初眼看上去似乎深不可测，但如果你将其拆解开，就可以很容易地理解。该函数的 IntelliSense 告诉我们它执行了以下操作：\n\
  \n```\n在序列上应用累加函数。\n```\n\n这意味着一个累加函数（你可以以 lambda 表达式的形式提供）将从头到尾应用到集合中的每个元素上。这个累加函数必须有两个参数和一个返回值。一个输入是当前元素；另一个输入可以是种子值（seed\
  \ value，集合中的第一个值）或上一次计算的结果。\n\n在三个重载中最简单的一个中，只有一个泛型类型指定，它可以从实例的类型推断出来。例如，在下面的代码中泛型类型指定为\
  \ `int`（累加函数暂留空）：\n\n```c\nint[] myIntArray = { 2, 6, 3 };\nint result = myIntArray.Aggregate(...);\n\
  ```\n\n这等同于：\n\n```c\nint[] myIntArray = { 2, 6, 3 };\nint result = myIntArray.Aggregate<int>(...);\n\
  ```\n\n这里需要的 lambda 表达式可以从扩展方法推断出来。因为此代码中的 `TSource` 类型是 `int`，你必须为委托 `Func<int,\
  \ int, int>` 提供一个 lambda 表达式。例如，你可以使用之前看到的那个：\n\n```c\nint[] myIntArray = { 2, 6,\
  \ 3 };\nint result = myIntArray.Aggregate((paramA, paramB) => paramA + paramB);\n\
  ```\n\n此调用会导致 lambda 表达式被调用两次，第一次 `paramA`为 2 `paramB`为 6，第二次 `paramA`为 8（第一次计算的结果）`paramB`为\
  \ 3。赋值给变量 `result` 的结果将是 `int` 值 `11`——数组中所有元素的和。\n\n`Aggregate()` 扩展方法的另外两个重载类似，但允许你执行稍微复杂一点。这在接下来的简短“尝试运行”中进行了说明。\n\
  \n这个例子并没有做任何了不起的事，但它演示了如何使用涉及泛型类型参数、集合以及看似复杂的语法的扩展方法。你将在书中后面看到更多此类。\n\n#### 练习\n\
