  \ ➪ `属性窗口`）显示关于上方窗口所选任何内容的附加信息。例如，图 2-9 所示的视图在选中项目中的`Program.cs`文件时显示。此窗口还显示其他所选项目的信息，例如用户界面组件（如本章“桌面应用程序”部分所示）。\n\
