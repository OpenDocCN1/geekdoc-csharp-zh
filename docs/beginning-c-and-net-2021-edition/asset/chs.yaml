  ## 源代码\n\n当你学习书中的示例时，你可以选择手动输入所有代码，或者使用[`www.wiley.com`](http://www.wiley.com) 和\
  \ [`github.com/benperk/BeginningCSharpAndDotNET`](http://github.com/benperk/BeginningCSharpAndDotNET)\
  \ 上的 .ZIP、.RAR 或类似的压缩文件（适用于相应的平台）。\n\n## 勘误\n\n我们尽力确保文本或代码中没有错误。然而，没有人是完美的，错误确实会发生。如果在我们的书中发现错误（如拼写错误或错误的代码），我们将非常感谢你的反馈。提交勘误可能会为读者节省数小时的挫败，同时也帮助我们提供更高的质量。\n\
  \n要找到本书的勘误页面，请访问在[`www.wiley.com`](http://www.wiley.com) 的页面并点击 Errata 链接。在该你可以查看提交的所有勘误。\n\
  \n# 第一部分\n\nC# 语言\n\n*   **第 1 章:** 介绍 C#\n*   **第 2 章:** 编写 C# 程序\n*   **第 3 章:**\
  \ 变量与表达式\n*   **第 4 章:** 流程控制\n*   **第 5 章:** 关于变量的更多\n*   **第 6 章:** 函数\n*   **第\
  \ 7 章:** 调试与错误处理\n*   **第 8 章:** 面向对象编程简介\n*   **第 9 章:** 定义类\n*   **第 10 章:** 定义类成员\n\
  *   **第 11 章:** 集合、比较与转换\n*   **第 12 章:** 泛型\n*   **第 13 章:** 额外的 C# 技术\n\n# 1\n\
  \n介绍 C#\n\n欢迎来到本书第一部分的第一章。第一部分 为你提供了上手 C# 所需的基础知识。具体而言，本章概述了 .NET 和 C#，包括这些技术是什么、使用它们的动机，以及它们之间的关系。\n\
  \n\n\n本章从对 .NET 的通用讨论开始，它包含了许多初学者难以掌握的概念。这意味着，由于需要，讨论在简短的篇幅内涵盖了许多概念。然而，快速浏览基础知识对于理解如何使用\
  \ C# 进行编程至关重要。在书的后续章节，你将再次访问此处过的许多主题，并对它们进行更详细的探索。\n\n在对 .NET 的总体介绍之后，本章将对 C# 本身进行基础描述，包括它的起源以及与\
  \ C++ 的相似之处。最后，你将了解本书使用的主要工具：Visual Studio (VS)。Visual Studio 是微软自 20 世纪 90 年代后期以来开发的集成开发环境\
  \ (IDE)，并定期更新新功能。Visual Studio 包含了各种功能，包括对桌面、云、Web、移动端、数据库、机器学习、AI 以及跨平台编程的全支持，你将在本书中学习到这些内容。\n\
  \n# 什么是 .NET？\n\n.NET 是微软创建的一种革命性软件框架，用于开发计算机程序。首先，请注意 .NET 不仅提供了创建针对 Windows 操作系统的程序的手段。.NET\
  \ 是完全开源的，并完全支持跨平台运行。`Cross platform` 意味着你使用 .NET 编写的代码可以在 Linux 和 MacOS 操作系统上运行。.NET\
  \ 的源码是开源的，你可以在 `github.com/dotnet/core` 找到它。\n\n.NET 软件框架由预写的计算机代码组成，这些代码提供了对硬盘和计算机内存等基本计算资源的简单访问。该框架的一个被称为\
  \ `Base Class Library` (BCL，基类库)，它包含了 `System` 类。随着本书的深入，你将变得非常熟悉。深入研究 `System`\
  \ 类内部的源码，你会发现它包含了`strings`(字符串）、`integers`(整数）、`Boolean`(布尔值）和`characters`(字符）等数据类型的定义。如果你在程序中需要这些数据类型之一来存储信息，可以使用已经写好的\
  \ .NET 代码来实现。如果不存在此类代码，你将需要使用汇编语言或机器码等低级编程语言来自己分配和管理所需的内存。`System` 类中的基本类型还促进了 .NET\
  \ 编程语言之间的互操作性，这一概念被称为 `Common Type System` (CTS，通用类型系统)。互操作性意味着 C# 中的 `string` 与\
  \ Visual Basic 或 F# 中的 `string` 具有相同的属性和行为。除了提供此源码库，.NET 还包含了 `Common Language Runtime`\
  \ (CLR，通用语言运行时)，它负责所有使用 .NET 库开发的应用程序的执行；更多内容稍后介绍。\n\n除了 `System` 类之外，.NET 还包含许多许多其他类，通常称为模块（modules）。有人会说它是一个巨大的面向对象编程\
  \ (OOP) 代码库，被分类为不同的模块——你根据想要实现的结果使用它的部分内容。例如，`System.IO` 和 `System.Text` 是你用于读写计算机硬盘上文件的类。程序员只需通过使用\
  \ `System.IO` 类中已有的代码即可操作文件内容，而无需管理句柄或将文件从硬盘加载到内存中。.NET 中存在许多类可以帮助程序员以快速速度编写程序，因为实现任务所需的所有低级代码都已经写好了。程序员只需要知道需要哪些类来实现程序目标。\n\
  \n.NET 不仅加速了应用程序的开发，它还可以被许多其他编程语言利用，而不只是 C#（这是本书的主题）。用 C++、F#、Visual Basic 甚至更老旧语言（如\
  \ COBOL）编写的程序可以使用 .NET 中存在的类。这些语言可以访问 .NET 库中的代码，但用一种编程语言编写的代码与另一种语言的代码进行通信。例如，用\
  \ C# 编写的程序可以使用 Visual Basic 或 F# 编写的代码，反之亦然。所有这些示例使得 .NET 成为构建定制软件极具吸引力的前景。\n\n\
  ## .NET Framework, .NET Standard 和 .NET Core\n\n当 .NET Framework 最初创建时，它针对的是 Windows\
  \ 操作系统平台。多年来，.NET Framework 代码被分支（forked）以支持许多其他平台，如 IoT 设备、桌面、移动设备和其他操作系统。你可能认识某些分支以\
  \ .NET Compact Framework、.NET Portable 或 .NET Micro Framework 的命名。这些分支每一个包含它们自己的、略微修改的\
  \ BCL。请注意，BCL 不仅仅是 `strings`、`Booleans` 和 `integers`。它还包括文件访问、字符串操作、流管理、在集合中存储数据、安全属性等许多其他功能。\n\
  \n即使是略有不同的 BCL，也需要程序员学习、开发和管理每个 .NET 分支之间 BCL 的细微差异。针对桌面、互联网或移动平台的 .NET Framework\
  \ 每个分支可能存在显著的实现差异，尽管每个程序都使用了 .NET。对于一家公司来说，桌面、网站和手机应用程序运行相同的程序逻辑但在不同的平台上运行，这在过去（现在仍然）非常常见。在这种情况下，使用\
  \ .NET 需要为每个平台准备一个版本的公司应用程序。那是无效的。这就是 .NET Standard 解决的问题。.NET Standard 为程序员提供了一个地方，创建可以跨任何\
  \ .NET Framework 分支使用的应用程序逻辑。.NET Standard 通过解耦公司的程序逻辑，使得桌面、移动和 Web 等不同平台与 BCL 无关（agnostic）。\n\
  \n.NET Core 是 .NET 库的开源跨平台版本。该代码分支可用于创建针对 Linux、MacOS 以及 Windows 在内的许多不同程序。它也是最终成为\
  \ .NET 源码库唯一受维护分支的分支。尽管 2020 年，了解 .NET Framework、.NET Standard 和 .NET Core 已不再像以前那样重要。但必须在这里提及这三个\
  \ .NET 分支，因为在未来几年里你可能仍然看到、阅读关于它们的内容并遇到它们。了解它们是什么以及用途是重要的，以防你需要处理实现它们的项目。截至 2020\
  \ 年，有一个简单命名为 “.NET.” 的新版本，它是完全开源的、完全跨平台的，并且可以在许多平台上运行，而无需为程序支持多个版本、分支和分支。\n\n##\
  \ 使用 .NET 编写程序\n\n使用 .NET 创建计算机程序意味着编写使用 .NET 库中现有代码的代码。在书中你中使用 Visual Studio 开发程序。Visual\
  \ Studio 是一个强大的集成开发环境，支持 C#（以及 C++、Visual Basic、F# 等其他）。该环境的优势在于可以将 .NET 特性集成到代码中。你创建的代码将完全使用\
  \ .NET，并在需要时使用 Visual Studio 的一些额外工具。为了让 C# 代码执行，必须将其转换为目标操作系统可以理解的语言，即*原生代码*（native\
  \ code）。这种转换被称为*编译*（compiling），这是一种由*编译器*（compiler）执行的行为，这是一个两个阶段的过程。\n\n### CIL\
  \ 和 JIT\n\n\n\n\n当你编译使用 .NET 的代码时，并不会立即创建特定操作系统的原生代码。相反，你将代码编译成`通用中间语言`（CIL`）代码。这段代码不特定于任何操作系统（OS），也不特定于\
  \ C#。其他 .NET 语言——例如 Visual Basic .NET 或 F#——在第一阶段也会编译为这种语言。当你开发 C# 应用程序时，Visual\
  \ Studio 会执行这一编译步骤。\n\n显然，执行应用程序还需要更多工作。这就是`即时编译`（`just-in-time`，简称 JIT）编译器的工作，它将\
  \ `CIL` 编译成针对目标操作系统和机器架构的原生代码。只有在这一步，操作系统才能执行该程序。名称中的“即时”（`just-in-time`）部分反映了 `CIL`\
  \ 代码仅在需要时才被编译的特性。这种编译可以在你的应用程序运行时动态进行，尽管幸运的是，作为开发者，你通常不需要担心这一点。除非你正在编写对性能至关重要的极高级代码，否则只需要知道这个编译过程会在后台愉快地运行，而不会产生干扰即可。\n\
  \n在过去，通常需要将代码编译成多个应用程序，每个程序都针对特定的操作系统和 CPU 架构。通常，这是一种优化（例如让代码在 AMD 芯片组上运行得更快），但有时它是至关重要的（例如让应用程序同时在\
  \ Win9x 和 WinNT/2000 环境中运行）。现在这是没有必要的，因为 JIT 编译器（如其所示）使用 `CIL` 代码，这种代码独立于机器、操作系统和\
  \ CPU。存在多个 JIT 编译器，每个针对不同的架构，而 `CLR` 会使用合适的编译器来创建所需的原生代码。\n\n这一切的妙之处在于，它减少了你方面的工作——事实上，你可以忘记依赖于系统的细节，而专注于代码中更有趣的功能。\n\
  \n## 程序集 (Assemblies)\n\n当你编译一个应用程序时，`CIL` 代码存储在“程序集”（`assembly`）中。程序集包括你可以从 Windows\
  \ 直接运行而无需任何其他程序的可执行应用程序文件（具有 `.exe` 扩展名）以及供其他使用的库（具有 `.dll` 扩展名）。\n\n除了包含 `CIL`\
  \ 外，程序集还包含 `meta` 信息（即关于程序集所包含的信息，也称为“元数据”`metadata`）和可选的“资源”（`resources`，`CIL`\
  \ 使用的其他数据，如声音文件和图片）。元信息使得程序集能够完全自描述。你不需要其他信息即可使用一个程序集，这意味着你避免了诸如未能向系统注册表中添加所需数据等情况，这在与其他平台进行开发时通常是一个问题。\n\
  \n这意味着部署应用程序通常简单如将文件复制到远程计算机的目录中。因为目标系统不需要额外信息，你只需要从该目录运行可执行文件，并且假设已为目标 .NET 应用程序安装了\
  \ `CLR`，你就可以开始运行。取决于部署场景，运行程序所需的模块已包含在部署包中，这意味着不需要额外的配置。\n\n从 .NET 的角度来看，你不一定想将运行应用程序所需的所有内容都包含在一个目录中。你可能会编写一些执行多个应用程序所需任务的代码。在这些情况下，将可用代码放置在所有应用程序都可以访问的地方通常是有用的。在\
  \ .NET 中，这个地方是“全局程序集缓存”（`global assembly cache`，简称 GAC）。将代码放在 `GAC` 中非常简单——你只需要包含代码的程序集放在包含此缓存的目录中。\n\
  \n## 托管代码 (Managed Code)\n\n在你将代码编译为 `CIL` 且 JIT 编译器将其编译为原生代码后，`CLR` 的作用并没有结束。使用\
  \ .NET 编写的代码在执行时是“托管的”（`managed`）（这一阶段通常被称为“运行时”`runtime`）。这意味着 `CLR` 通过管理内存、处理安全、允许跨语言调试等来维护你的应用程序。相比之下，在不在\
  \ `CLR` 控制下运行的应用程序被称为“未托管的”（`unmanaged`），可以使用 C++ 等某些语言来编写此类应用程序，例如，访问操作系统的底层函数。然而，在\
  \ C# 中，你只能编写在托管环境中运行的代码。你将利用 `CLR` 的托管功能，并允许 .NET 自己处理与操作系统的任何交互。\n\n## 垃圾回收 (Garbage\
  \ Collection)\n\n托管代码最重要的功能之一是“垃圾回收”（`garbage collection`）概念。这是 .NET 确保在应用程序不再使用内存时，完全释放应用程序所用内存的方法。在\
  \ .NET 之前，这很大程度上是程序员的责任，代码中的几个简单错误就会导致大块内存由于被分配到内存中的错误位置而神秘消失。这通常意味着你的计算机速度逐渐变慢，随后导致系统崩溃。\n\
  \n.NET 垃圾回收通过定期检查你计算机的内存并从中删除任何不再需要的内容来工作。没有固定的时间范围；可能每秒发生几千次、每几秒一次或随时发生，但你可以放心它会发生。这里对程序员有一些影响。由于这项工作是不可预测的，应用程序必须考虑到这一点。需要大量内存的代码应该自己清理，而不是等待垃圾回收，但这并没有那么复杂。\n\
  \n## 汇总 (Fitting Together)\n\n在继续之前，让我们总结一下讨论过的创建 .NET 应用程序所需的步骤：\n\n1. 使用 .NET\
  \ 兼容语言（如 C#）编写应用程序代码（参见图 1-1）。![使用 .NET 兼容语言编写的应用程序代码](img/c01f001.png)\n   **图\
  \ 1-1**\n2. 将代码编译为 `CIL` 并存储在程序集中（参见图 1-2）。![编译为 CIL 并存储在程序集中的](img/c01f002.png)\n\
  \   **图 1-2**\n3. 当执行此代码（如果是可执行文件则独立运行或从其他代码调用）时，必须使用 JIT 编译器将其编译为原生代码（参见图 1-3）。![使用\
  \ JIT 编译器编译为原生代码](img/c01f003.png)\n   **图 1-3**\n4. 原生代码在托管 `CLR` 的上下文中与其他任何正在运行的应用程序或进程一起执行，如图\
  \ 1-4 所示。![原生代码在托管 CLR 的上下文中执行，与其他任何正在运行的应用程序或进程一起](img/c01f004.png)\n   **图 1-4**\n\
  \n\n\n\n\n关于这一过程，还有一点需要注意。在第 2 步中编译为 CIL 的 C# 代码不需要包含在单个文件中。可以将应用程序代码分布在多个源文件中，然后将它们一起编译成单个程序集。这一极其有过程被称为\
  \ `linking`（链接）。之所以需要这样做，是因为处理几个较小的文件比处理一个巨大的文件要容易得多。你可以将逻辑相关的代码分离到单独的文件中，以便进行独立开发，并在完成后实际上可以将其“忘掉”。这使得在需要时查找特定代码段时可以轻松找到它们，并允许开发团队将编程负担拆分为易于管理的区块。这允许个人“检出”部分代码进行工作，而不会冒着损坏其他运行良好的代码部分或他人正在编写的部分的风险。\n\
  \n# 什么是 C#？\n\n如前所述，C# 是你可以用于创建运行在 .NET CLR 上的应用程序的语言之一。它是 C 和 C++ 语言的演进，由微软专门为配合\
  \ .NET 平台工作而创建。C# 语言的设计旨在整合其他语言许多许多特性，同时解决它们存在的问题。\n\n使用 C# 开发应用程序比使用 C++ 更简单，因为该语言语法更简单。尽管如此，C#\
  \ 是一门强大的语言，你在 C++ 中可能想做的任何事情在 C# 中几乎都能做。。话虽如此，C# 中那些与 C++ 高级特性并行的功能（例如直接访问和操作系统内存）只能通过使用标记为\
  \ `unsafe` 的代码来实现。这种高级编程技术具有潜在的危险性（因此得此名），因为它可能会覆盖系统关键的内存块，导致灾难性的结果。由于这个原因及其他原因，本书不涵盖该主题。\n\
  \n有时，C# 代码比 C++ 稍微冗长一些。这是由于 C# 是一门 `typesafe`（类型安全）语言（与 C++ 不一样）。用通俗的话说，这意味着一旦某些数据被分配给某种类型，它就无法随后转换为另一个不相关的类型。因此，在不同类型之间转换时必须遵守严格规则，这意味着在\
  \ C# 中执行相同任务时，你通常需要比在 C++ 中编写更多的代码。然而，这样做也有好处——代码更健壮，调试更简单，且 .NET 始终可以在任何时候跟踪某段数据的类型。在\
  \ C# 中，你可能无法执行诸如“将 4 字节、10 字节长的内存区域提取到数据中并将其解释为 X”的操作，但这并不一定是坏事。\n\nC# 只是 .NET 开发可用语言之一，但它无疑是最好的。它的优势是唯一从底层为\
  \ .NET 设计的语言，并且是移植到其他操作系统的 .NET 版本的主要语言。为了让 .NET 版的 Visual Basic 等语言与其前身尽可能相似同时符合\
  \ CLR 标准，.NET 代码库的某些功能没有被完全支持，或者至少需要不寻常的语法。\n\n相反，C# 可以利用 .NET 代码库提供的每一个功能。此外，每个新版本的\
  \ .NET 均包含了对 C# 语言的补充，部分是为了响应开发者的请求，使其变得更加强大。\n\n## 你用 C# 可以编写的应用程序\n\n.NET 对可能的应用程序类型没有限制。C#\
  \ 使用该框架，因此对可能的应用程序没有限制。然而，这里是一些更常见的应用程序类型：\n\n*   **桌面应用程序**——如 Microsoft Office\
  \ 等应用程序，它们具有熟悉的 Windows 外观和感受。通过使用 .NET 的 Windows Presentation Foundation (WPF)\
  \ 模块可以使这变得简单，该模块是 `controls`（如按钮、工具栏、菜单等）的库，你可以用它构建 Windows 用户界面 (UI)。\n*   **云/Web\
  \ 应用程序**-.NET 包含一个名为 ASP.NET Core 的强大系统，用于动态生成 Web 内容、实现个性化、安全等功能。此外，这些应用程序可以在云端托管和访问，例如在\
  \ Microsoft Azure 平台上。\n*   **移动应用程序**——通过使用 C# 和 Xamarin 移动 UI 框架，你可以构建针对 Android\
  \ 操作系统的移动应用程序。\n*   **Web APIs**——构建 RESTful HTTP 服务的理想框架，支持各种客户端，包括移动设备和浏览器。这些也被称为\
  \ REST API。\n*   **WCF 服务**——一种创建多功能分布式应用程序的方法。通过 WCF，你可以在本地网络或 Internet 上交换几乎任何数据，无论使用什么创建服务的语言或服务所处的的系统，都使用相同的相同的简单语法。这是一项旧技术，需要旧版本的\
  \ .NET Framework 来创建。\n\n这些任何一类应用程序都可能需要某种形式的数据库访问，这可以通过 .NET 的 ADO.NET（Active Data\
  \ Objects .NET）功能集、通过 Entity Framework 或通过 C# 的 LINQ（语言集成查询）能力来实现。许多其他资源程序集也可以利用，它们有助于创建网络组件、输出图形、执行复杂的数学任务等。\n\
  \n## 本书中的 C#\n\n本书的第一部分 涉及 C# 语言的语法和用法，没有过多强调 .NET。这是必要的，因为如果没有坚实的 C# 编程基础，你完全无法使用\
  \ .NET。事实上，你将从更简单的开始，并在涵盖基础后再处理更复杂的 OOP（面向对象编程）话题。这些是从基本原理开始教学的，假设没有任何编程知识。\n\n\
  之后，你将准备好开发更复杂（但更有用）的应用程序。第二部分 检查数据访问（ORM 数据库概念、文件系统和 XML 数据）和 LINQ。第三部分 探索 REST\
  \ API、云和 Windows 桌面等额外技术。\n\n## VIS STUDIO\n\n在书中，你使用最新版本的 Visual Studio 开发工具进行所有的\
  \ C# 编程，从简单的命令行应用程序到更复杂的项目类型。开发工具或集成开发环境 (IDE)，例如 Visual Studio 对于开发 C# 应用程序并非必需的，但它能让事情变得简单得多。你可以（如果你愿意的话）在基础文本编辑器（如常用的记事本程序）中操作\
  \ C# 源代码文件，并使用 .NET 部分的命令行编译器将代码编译成程序集。然而，当你有 IDE 的帮助时，何必这样做呢。\n\n### Visual Studio\
  \ 产品\n\n微软提供了多个版本的 Visual Studio。例如：\n\n*   Visual Studio Community\n*   Visual\
  \ Studio Professional\n*   Visual Studio Enterprise\n*   Visual Studio Code\n* \
  \  Visual Studio for Mac\n\nVisual Studio Code、Mac 和 Community 版可以在 [`visualstudio.microsoft.com/downloads`](http://visualstudio.microsoft.com/downloads)\
  \ 免费获取。Professional 和 Enterprise 版具有额外的功能，需要付费。\n\n\n\n\n\n各种 Visual Studio 产品允许你创建几乎可能需要的任何\
  \ C# `application`。Visual Studio Code 是一个简单而强大的代码编辑器，运行在 Windows、Linux 和 iOS 上。与\
  \ Visual Studio Code 不同，Visual Studio Community 保留了与 Visual Studio 专业版和企业版相同的界面和操作体验。微软在\
  \ Visual Studio Community 中提供了许多与专业版和企业版相同的功能；但是，缺少了一些显著的功能，例如深度调试能力和代码优化工具。不过，缺失的功能并不多到让你无法使用社区版来完成本书的章节。Visual\
  \ Studio Community 是用于完成本书中示例的 IDE 版本。\n\n## 解决方案\n\n当你使用 Visual Studio 开发应用程序时，你是通过创建\
  \ `solutions`（解决方案）来实现的。在 Visual Studio 术中，解决方案不仅仅是一个应用程序。解决方案包含 `projects`（项目），这些可能是\
  \ `Console Applications`控制台应用程序、`WPF projects`、`Cloud/Web Application projects`云/Web\
  \ 项目、`ASP.NET Core projects`等。由于解决方案可以包含多个项目，你可以将相关代码组合在一个地方，即使它们最终编译到硬盘上不同位置的多个程序集中。\n\
  \n这特别有用，因为允许你能够在使用该代码的应用程序的同时，处理共享代码（这些代码可能放置在 `GAC` 中）。当只使用一个开发环境时，调试代码要容易得多，因为你可以在多个代码模块中逐步执行。\n\
  \n## 本章学习内容\n\n| 主题 | 核心概念 |\n| --- | --- |\n| .NET 基础 | .NET 是微软的 own 开发库。它包含了通用类型系统\
  \ (`CTS`) 和通用语言运行时 (`CLR`)。.NET 应用程序使用面向对象编程 (`OOP`) 方法编写，并且通常包含托管代码。托管代码的内存管理由\
  \ .NET 运行时处理；这包括垃圾回收机制。 |\n| .NET 应用程序 | 使用 .NET 编写的应用程序首先编译为 `CIL`。当执行应用程序时，`CLR`\
  \ 会根据需要使用 `JIT` 将此 `CIL` 编译为原生代码。应用程序被编译后，不同部分被链接到包含 `CIL` 的程序集中。 |\n| .NET Core\
  \ | .NET Core 的工作原理与 .NET Framework 类似；但它没有使用 `CLR` 而是使用 `CoreCLR`。.NET Core 是原始\
  \ .NET Framework 的分支，可以跨平台运行。 |\n| .NET Standard | .NET Standard 提供了一个统一的类库，可以作为\
  \ .NET Micro Framework、.NET Core 和 `Xamarin` 等多个 .NET 平台的目标。 |\n| C# 基础 | C# 是 .NET\
  \ 包含的语言之一。它是 `C++` 等以前语言的演进，可以编写任意数量的应用程序，包括 Web、跨平台桌面应用程序。 |\n| 集成开发环境 (IDEs) |\
  \ 你可以使用 Visual Studio 使用 C# 编写任何类型的 .NET 应用程序。你也可以使用免费但强大的社区版产品创建 C# 的 .NET 应用程序。此\
  \ IDE 与解决方案配合，解决方案可以由多个项目组成。 |\n\n# 2. 编写 C# 程序\n\n### 本章代码下载\n\n本章的代码下载可以在书籍页面\
  \ [`www.wiley.com`](http://www.wiley.com)找到。点击 Downloads 链接。代码也可以在 [`github.com/benperk/BeginningCSharpAndDotNET`](http://github.com/benperk/BeginningCSharpAndDotNET)找到。代码位于\
  \ `Chapter02` 文件夹，并根据章节中的名称单独命名。\n\n现在你已经花了一些时间学习 C# 是什么以及它是如何融入 .NET 的，是时候大起干一场写些代码了。你在整个书中都会使用\
  \ Visual Studio Community (`VS`)，所以首先要做的是查看一下这个开发环境的一些基础知识。\n\nVisual Studio 是一个庞大且复杂的产品，对于初次用户来说可能会令人生畏，但用它来创建基础应用程序可以异常地简单。当你在本章中开始使用\
  \ Visual Studio 时，你会发现你不需要了解它的大量知识就可以开始编写 C# 代码。在书的后面部分，你将看到 Visual Studio 可以执行的一些更复杂的操作，但目前基础的工作性知识就足够了。\n\
  \n在查看了 IDE 之后，你将整合两个简单的应用程序。目前你不需要太担心这些应用程序中的代码；你只需要证明这些东西是运行良好的即可。通过完成这些早期示例中的应用程序创建过程，它们很快就会变成你的本能。\n\
  \n你将在本章中学习如何创建两种类型的应用程序：`console application`（控制台应用程序）和 `desktop application`（桌面应用程序）。\n\
  \n你创建的第一个应用程序是一个简单的 `console application`。控制台应用程序不使用图形化窗口环境，因此你不需要担心按钮、菜单与鼠标指针的交互等。相反，你在命令提示符窗口中运行应用程序，并以更简单的方式与它交互。\n\
  \n第二个应用程序是 `desktop application`，你使用 Windows Presentation Foundation (`WPF`) 创建它。桌面应用程序的外观和体验对\
  \ Windows 用户来说非常熟悉，而且（令人惊讶的是）创建该应用程序不需要更多精力。然而，所需的代码语法更复杂，尽管在许多情况下你不需要担心细节。\n\n\
  你在书的第二部分 和 第三部分 中使用了这两种应用程序，并在开头注重控制台应用程序。在学习 C# 语言时，桌面应用程序的额外灵活性性，而控制台应用程序的简单性让你能够专注于学习语法，而无需担心外观和体验。\n\
  \n## VISUAL STUDIO 开发环境\n\n当你开始安装 Visual Studio Community 时，系统会提示一个类似于图 2-1 的窗口。它提供了与核心编辑器一起安装的负载、组件和语言包列表。\n\
