  ```\n\n### 练习 4\n\n`PersistentSlider` 类必须实现 `INotifyPropertyChanged` 接口。\n\n创建字段来存储三个属性每个的值。\n\
  \n在每个属性的设置器（setter）中，实现对 `PropertyChanged` 事件任何订阅者的调用。建议为此目的创建一个名为 `OnPropertyChanged`\
  \ 的辅助方法。\n\n`PersistentSlider.cs:`\n\n```csharp\nusing System.ComponentModel;\n\
  namespace Answers\n{\n  public class PersistentSlider : INotifyPropertyChanged\n\
  \  {\n    private int _minValue;\n    private int _maxValue;\n    private int _currentValue;\n\
  \    public int MinValue\n    {\n      get { return _minValue; }\n      set { _minValue\
  \ = value; OnPropertyChanged(nameof(MinValue)); }\n    }\n    public int MaxValue\n\
  \    {\n      get { return _maxValue; }\n      set { _maxValue = value; OnPropertyChanged(nameof(MaxValue));\
  \ }\n    }\n    public int CurrentValue\n    {\n      get { return _currentValue;\
  \ }\n      set { _currentValue = value; OnPropertyChanged(nameof(CurrentValue));\
  \ }\n    }\n    public event PropertyChangedEventHandler PropertyChanged;\n    protected\
  \ void OnPropertyChanged(string propertyName) =>\n       PropertyChanged?.Invoke(this,\
