  - 592. 617\n- 593. 618\n- 594. 619\n\n\n\n\n# 引言\n\n当微软在 2002 年发布第一个版本的 .NET Framework\
  \ 时，**C# 语言向世推出**。从那时起，它的迅速飙升，可以说它已成为使用 .NET 的桌面、Web、云端和跨平台开发者的首选语言。C# 的魅力之处在于其清晰的语法，这种语法源于\
  \ C/C++，但简化了一些以前让某些程序员望而却步的环节。尽管进行了这些简化，C# 仍然保留了 C++ 的强大，现在没有理由不转向 C#。这门语言并不困难，是一门学习基础编程技巧的极佳语言。这种易用性结合\
  \ .NET Framework 的功能，使得 C# 成为开启编程生涯的绝佳选择。\n\nC# 的最新版本是 C# 9（包含在 .NET 5.0 和 .NET\
  \ Framework 4.8 中），它在现有成功的基础上增加了更多具吸引力的特性。Visual Studio 和 Visual Studio Code 开发工具系列的最新发布版本也带来了许多调整和改进，让你的生活变得更轻松，并大幅提高你的生产力。\n\
  \n\n\n\n本书旨在向你介绍 C# 编程的所有方面，包括语言本身、桌面、云端和跨平台编程、数据源的使用，以及一些新颖先进的技术。你还将学习 `Visual\
  \ Studio` 的功能，以及该产品辅助你应用程序开发的各种方式。\n\n本书以友好的导师式风格编写，每一章都建立在之前章节的基础上，并尽最大努力让你无痛地过渡到高级技术。在任何时候，都不会出现凭空冒出的技术术语来让你丧失继续学习的动力；每个概念都会根据需要进行介绍和讨论。技术术语被降至最低，但在必要时，也会在语境中进行适当的定义和阐述。\n\
  \n本书的作者都是各自领域的专家，并且 `C#` 语言和 `.NET` 充满热情。你将在任何地方都找不到比他们更合适的人来带领你，并在他们的共同指导下，从第一性原理到高级技术培养你对\
  \ `C#` 的理解。除了书书中提供的基础知识外，书中还充满了实用的提示、技巧、练习和完整的示例代码（你可以在本书的网页 [`www.wiley.com`](http://www.wiley.com）以及\
  \ [`github.com/benperk/BeginningCSharpAndDotNET`](http://github.com/benperk/BeginningCSharpAndDotNET)\
  \ 上下载），随着你职业的发展，你会发现自己反复参考这些内容。\n\n我们毫无吝啬地传这些知识，并希望你能够利用它们成为最优秀的程序员。祝你好运，一切顺利！\n\
  \n## 本书的读者群\n\n本书适合所有想学习使用 `.NET` 进行 `C#` 编程的人。它也适用于想要通过学习一种整洁、现代、优雅的编程语言来尝试编程的初学者。但同时也适用于熟悉其他编程语言并想要探索\
  \ `.NET` 平台的人员，以及想要尝试微软 `.NET` 旗舰语言的现有 `.NET` 开发人员。\n\n## 本书涵盖的内容\n\n早期章节涵盖了语言本身，假设读者没有之前的编程经验。如果你以前用其他语言编程过，这些章节中的大部分材料对你来说是熟悉的。`C#`\
  \ 语法的许多方面与其他语言共用，许多结构也是几乎所有编程语言中通用的（例如循环和分支结构）。然而，即使你是一个丰富的程序员，通过阅读这些章节来学习这些技术如何应用于\
  \ `C#`，也将将受益匪浅。\n\n如果你是编程新手，应该从头开始，在其中你将学习基础编程概念，并熟悉 `C#` 及其底层 `.NET` 平台。如果你是 `.NET`\
  \ 新手但知道如何编程，你应该阅读 第 1 章，然后快速浏览接下来的几章，再继续应用 `C#` 语言。如果你知道如何编程但没有接触过面向对象的编程语言，你应该从\
  \ 第 8 章开始阅读后续章节。\n\n或者，如果你已经熟悉 `C#` 语言，你可能想集中关注处理最新 `.NET` 和 `C#` 语言开发的章节，特别是关于集合、泛型和\
  \ `C#` 语言增强的章节（第 11 章 和 第 12 章）。\n\n本书章节的设计有两个目的：它们可以顺序阅读以提供完整的 `C#` 语言教程，也可以根据需要作为参考材料查阅。\n\
  \n除了核心内容外，从 第 3 章 开始，大多数章节末尾都包含了一些练习，你可以通过完成练习来确保自己已经理解了材料。练习范围从简单的多选题或判断题到需要你修改或构建应用程序的更复杂的练习。所有练习的答案都提供在附录中。你也可以在本书的\
  \ [`www.wiley.com`](http://www.wiley.com) 页面通过 [`wiley.com`](http://wiley.com) 代码下载找到这些练习。\n\
  \n每当 `C#` 和 `.NET` 发布新版本时，每一章都会进行修订，删除相关性较低的内容并添加新内容。所有代码都已针对所用开发工具的最新版本进行了测试，所有截图已在最新版本的\
  \ `Windows` 操作系统中重新拍摄，以提供最新的窗口和对话框。本版的新亮点包括：\n\n* 提供了更多且改进后的代码示例供你尝试\n*   用于编写 `ASP.NET\
  \ Core` 以跨平台运行的示例\n*   使用 `Azure SDK` 创建和访问云资源的云应用程序编程示例\n\n## 本书的结构\n\n本书分为四个部分：\n\
  \n*   **引言 (Introduction)**——本书的目的和内容大纲\n*   **C# 语言 (The C# Language)**——涵盖 `C#`\
  \ 语言的所有方面，从基础到面向对象的技术\n*   **数据访问 (Data Access)**——如何在应用程序中使用数据，包括存储在硬盘文件中的数据、`XML`\
  \ 格式存储的数据以及数据库中的数据\n*   **其他技术 (Additional Techniques)**——研究使用 `C#` 和 `.NET` 的一些额外方法，包括云和跨平台开发、`ASP.NET\
  \ Web API`、Windows Presentation Foundation (WPF)、Windows Communication Foundation\
  \ (WCF) 和通用 Windows 应用程序\n\n以下章节描述了书中三个主要部分的章节。\n\n### C# 语言（第 1–13 章）\n\n第 1 章\
  \ 向你介绍 `C#` 以及它如何融入 `.NET` 格局。你将学习在该环境中编程的基础知识，以及 `Visual Studio` 如何其中。\n\n第 2 章\
  \ 开始让你编写 `C#` 应用程序。你将学习 `C#` 的语法并在示例命令行和 `Windows` 应用程序中使用它。这些示例演示了启动运行是有多快速简单，在此过程中你将熟悉\
  \ `Visual Studio` 开发环境以及在书中将使用的基本窗口和工具。\n\n接下来，你将学习更多 `C#` 语言的基础知识。在第 3 章中你将学习变量以及如何操作它们。在第\
  \ 4 章中你通过流程控制（循环和分支）增强应用程序的结构，并在第 5 章中查看一些更高级的变量类型，如数组。在第 6 章中你将开始将代码封装成函数，这使得重复操作变得容易得多并使代码更具可读性。\n\
  \n到第 7 章，你已经掌握了 `C#` 语言的基础，并将专注于应用程序的调试。这包括在程序运行时输出跟踪信息，以及如何利用强大的调试环境使用 Visual Studio\
  \ 来捕捉错误并引导你找到解决方案。\n\n从第 8 章开始你将学习面向对象编程 (`OOP`)，从了解这个术语的含义以及回答经典问题：“什么是对象？”开始。`OOP`\
  \ 初看起来看起来很难。整个[第 8 章](#c08.xhtml]都致力于揭秘 `OOP` 的神秘性并解释它为什么如此伟大，直到章节末尾你才会实际处理大量的 `C#`\
  \ 代码。\n\n\n\n\n一切在第 9 章都发生了变化，此时你将理论付诸实践，并在你的 C# 应用中使用 OOP（面向对象编程）。这正是 C# 真正的威力所在。你将从学习如何定义类和接口开始，然后进入第\
  \ 10 章中学习类成员（包括字段、属性和方法）。在该章的最后，你将开始构建一个卡牌游戏应用程序，该程序将跨越多个章节开发，并将帮助说明 OOP。\n\n一旦你学会了\
  \ OOP 在 C# 中是如何运作的，第 11 章将转向常见的 OOP 场景，包括处理对象集合以及比较和转换对象。第 12 章将介绍 .NET 2.0 引入 C#\
  \ 有用功能：泛型（generics），它允许你创建非常灵活的类。接下来，第 13 章将继续讨论 C# 语言和 OOP，并介绍一些额外的技术，特别是事件（events），这在例如\
  \ Windows 编程中变得非常重要。第 13 章通过关注在 C# 较新版本中引入的语言特征，总结了基础知识。\n\n## 数据访问（第 14–17 章）\n\
  \n第 14 章介绍了你的应用程序如何向磁盘保存和检索数据，包括作为简单的文本文件和更复杂的数据表示。你还将学习如何压缩数据，以及如何监控并响应文件系统的变化。\n\
  \n在第 15 章中，你将学习数据交换的事实标准——XML，以及一种快速兴起的格式 JSON。在书的目前阶段，你已经在之前的章节中多次接触过 XML，但章制定了基本规则并向你展示了它为何如此关注。\n\
  \n该部分的其余内容介绍了 LINQ，这是 .NET 内置的查询语言。你将在第 16 章开始对 LINQ 进行概括介绍，然后在第 17 章中使用 LINQ 访问数据库和其他数据。\n\
  \n## 额外技术（第 18–21 章）\n\n第 18 章引入了 .NET Standard 和 .NET Core，这些是用于目标任何应用程序类型的工具——例如\
  \ Windows Presentation Foundation (WPF)、Windows 和 ASP.NET。一种新兴的应用是可以在跨平台运行的，例如在\
  \ Linux 或 macOS 上运行。该章提供了安装 .NET 以及创建和实现 .NET Standard 库的说明。此外，还涵盖了 ASP.NET 及其许多不同类型（例如\
  \ ASP.NET Webforms、ASP.NET MVC 和 ASP.NET Core）。\n\n第 19 章从描述什么是云编程开始，并讨论了云优化堆栈。云环境与传统的程序编码方式并不相同，因此讨论并定义了一些云编程模式。为了完成本章，你需要一个\
  \ Azure 试用账户（trail account），该账户可以免费创建，并带有一些额度以便你创建并测试 App Service Web App。然后，使用带有\
  \ C# 的 Azure SDK，从 ASP.NET Web 应用程序创建并访问存储帐户。\n\n在第 20 章中，你学习了如何创建一个 ASP.NET Web\
  \ API 并使用 Blazor WebAssembly App 消费它。然后，本章介绍了 Windows Communication Foundation (WCF)，它为你提供了所需的工具，用于跨本地网络和互联网对信息和能力进行企业级的程序访问。你将看到如何使用\
  \ WCF 以平台无关的方式将复杂数据和功能暴露给 Web 和桌面应用程序。\n\n第 21 章从向你介绍什么是 Windows 编程开始，并查看如何在 Visual\
  \ Studio 中实现它。它重点关注 WPF (Windows Presentation Foundation)，该工具能够使你以图形化的方式构建桌面应用程序，并以最少的精力和时间组装高级应用程序。你将从\
  \ WPF 编程的基础开始，并将你的知识扩展到更高级的概念。\n\n## 使用本书需要的条件\n\n书中关于 C# 和 .NET 的代码和描述适用于 C# 9\
  \ 和 .NET 4.8。为了理解书的这部分，你不需要 .NET 之外的任何东西，但许多示例需要一个开发工具。本书使用最新版本的 Visual Studio Community\
  \ 2019 作为其主要开发工具。使用 Visual Studio Community 2019 创建 Windows、云端和跨平台应用程序，并使用 SQL Server\
  \ Express 用于访问数据库的应用程序。\n\n示例的源代码可以从本书在[`www.wiley.com`](http://www.wiley.com) 的页面下载，也可以在[`github.com/benperk/BeginningCSharpAndDotNET`](http://github.com/benperk/BeginningCSharpAndDotNET)。\n\
  \n## 约定\n\n为了帮助你从文本中获得最大收益并跟踪发生的情况，我们在书中中使用了一些约定。\n\n关于文本中的样式：\n\n*   当我们引入新术语和重要词汇时，会对它们进行*斜体处理*（italic）。\n\
  *   我们像这样显示击键操作：`Ctrl+A`。\n*   我们在正文中这样显示文件名、URL 和代码：\n\n`persistence.properties`\n\
