  \n● 为关键事件、性能阈值和安全事件设置警报。\n\n2\\. 定期更新和维护：\n\n● 定期更新应用程序中使用的依赖项、库和框架。\n\n● 应用安全补丁和更新，以确保环境的安全性和最新状态。\n\
  \n遵循这些步骤和最佳实践，你就可以成功地将带有 Angular 14 前端的 ASP.NET Core 8 应用程序托管在 Azure App Service\
  \ 或其他云平台上。Azure App Service 提供了一个具有可扩展性、安全性和监控功能的托管托管环境，使其成为托管现代 Web 应用程序的合适选择。\n\
  \n## 监控和调试已部署的应用程序\n\n监控和调试是维护和优化已部署应用程序的关键方面。在本指南中，我们将探讨如何使用适用于后端和前端组件的工具和技术，监控和调试带有集成\
  \ Angular 14 前端的已部署 ASP.NET Core 8 应用程序。\n\n### 1\\. 监控 ASP.NET Core 应用程序\n\n监控\
  \ ASP.NET Core 应用程序涉及跟踪性能指标、日志记录和错误处理，以确保应用程序在生产环境中平稳高效地运行。\n\n1\\. 配置日志记录：在你的 ASP.NET\
  \ Core 应用程序中，配置日志记录以捕获重要事件和错误。使用 Serilog 等日志提供程序或内置的日志记录功能。\n\n```csharp\npublic\
  \ class Startup\n{\n    public void ConfigureLogging(IApplicationBuilder app, IWebHostEnvironment\
  \ env)\n    {\n        // Configure logging\n        ILoggerFactory loggerFactory\
  \ = LoggerFactory.Create(builder =>\n        {\n            builder.AddConsole();\n\
  \            builder.AddDebug();\n            // Add other logging providers as\
  \ needed\n        });\n\n        app.UseSerilogRequestLogging(); // Serilog request\
  \ logging middleware\n\n        ILogger logger = loggerFactory.CreateLogger<Startup>();\n\
  \        logger.LogInformation(\"Application started.\");\n    }\n}\n```\n\n2\\\
  . 集成 Application Insights：Azure Application Insights 为 ASP.NET Core 应用程序提供了强大的监控功能。\n\
  \n● 将 Application Insights SDK 集成到你的项目中。\n\n```bash\ndotnet add package Microsoft.ApplicationInsights.AspNetCore\n\
  ```\n\n● 在 `Startup.cs` 中配置 Application Insights：\n\n```csharp\npublic void ConfigureServices(IServiceCollection\
  \ services)\n{\n    services.AddApplicationInsightsTelemetry(Configuration[\"ApplicationInsights:InstrumentationKey\"\
  ]);\n    // Other configurations\n}\n```\n\n3\\. 监控性能指标：使用 Application Insights\
  \ 或其他监控工具来跟踪性能指标，例如响应时间、请求速率、CPU 使用率、内存消耗等。\n\n4\\. 设置警报：根据关键事件或性能阈值配置警报，以便在需要立即关注的问题发生时收到通知。\n\
  \n### 2\\. 调试 ASP.NET Core 应用程序\n\n调试已部署的 ASP.NET Core 应用程序有助于识别和修复代码库中的问题，确保平稳运行和用户体验。\n\
  \n1\\. 远程调试：Azure App Service 和其他托管平台支持远程调试，允许你将调试器附加到已部署的应用程序以进行实时调试。\n\n2\\. 日志记录和错误处理：增强\
  \ ASP.NET Core 应用程序中的日志记录和错误处理，以捕获生产环境中遇到的异常和错误的详细信息。\n\n```csharp\npublic void\
  \ Configure(IApplicationBuilder app, IWebHostEnvironment env)\n{\n    // Configure\
  \ error handling\n    if (env.IsDevelopment())\n    {\n        app.UseDeveloperExceptionPage();\n\
  \    }\n    else\n    {\n        app.UseExceptionHandler(\"/Home/Error\");\n   \
  \     app.UseHsts();\n    }\n}\n```\n\n3\\. 健康检查：在你的 ASP.NET Core 应用程序中实现健康检查，以监控关键组件（例如数据库连接、外部服务）的健康状况。\n\
  \n```csharp\npublic void ConfigureServices(IServiceCollection services)\n{\n   \
  \ services.AddHealthChecks();\n    // Other configurations\n}\n\npublic void Configure(IApplicationBuilder\
  \ app, IWebHostEnvironment env)\n{\n    app.UseHealthChecks(\"/health\");\n    //\
  \ Other configurations\n}\n```\n\n### 3\\. 监控和调试 Angular 14 应用程序\n\n监控和调试 Angular\
  \ 14 应用程序侧重于跟踪客户端错误、性能问题和用户交互。\n\n1\\. Angular CLI 调试：在开发过程中使用 Angular CLI 工具调试\
  \ Angular 应用程序：\n\n1.  运行带有 `--source-map` 选项的 `ng serve` 以生成用于调试的源映射\n\n2.  使用浏览器开发者工具（Chrome\
  \ DevTools、Firefox Developer Tools）调试 TypeScript 代码、检查网络请求和分析性能。\n\n2\\. 错误处理和日志记录：使用\
  \ Angular 的错误处理机制和日志记录服务（例如 ngxLogger）在你的 Angular 应用程序中实现错误处理和日志记录。\n\n3\\. 性能监控：使用\
  \ Google Analytics、New Relic 或自定义监控解决方案等工具来跟踪你的 Angular 应用程序中的用户交互、页面加载时间和性能指标。\n\
  \n### 4\\. 组合监控和调试\n\n要监控和调试整个应用程序栈（ASP.NET Core 后端和 Angular 前端），请考虑以下策略：\n\n1\\\
  . 端到端跟踪：使用分布式跟踪工具，例如 Application Insights、OpenTelemetry 或 Jaeger，来跟踪跨后端和前端组件的请求，捕获端到端事务详情。\n\
  \n2\\. 与监控平台集成：将你的 ASP.NET Core 应用程序的监控数据（日志、指标）与监控平台集成，以实现集中监控和警报。\n\n3\\. 跨域调试：在浏览器开发者工具中启用跨域调试，以调试\
  \ API 调用和前端与后端的交互。\n\n4\\. 实时调试：利用 Azure DevOps、Visual Studio 或其他集成开发环境提供的实时调试功能，在生产环境中进行实时调试会话。\n\
  \n### 5\\. 持续改进和优化\n\n定期审查监控数据、日志和调试见解，以识别需要改进、优化和错误修复的领域。实施反馈循环和敏捷实践，以迭代方式增强应用程序的性能、可靠性和用户体验。\n\
  \n通过为 ASP.NET Core 8 和 Angular 14 组件实施强大的监控和调试实践，你可以维护一个健康高效的应用程序环境，有效地排除故障，并为用户提供高质量的用户体验。\n\
  \n## 第 7 章：深入探索 Angular 14 以构建动态前端\n\n\n\n\nAngular 14 是一个强大的 JavaScript 框架，用于构建具有丰富用户界面的动态\
  \ Web 应用程序。Angular 开发的核心是组件和模板，它们定义了应用程序 UI 的结构和行为。在本指南中，我们将探讨 Angular 组件和模板，包括如何有效地将它们与\
  \ ASP.NET Core 8 后端结合使用。\n\n## 1. 理解 Angular 组件\n\nAngular 应用程序使用组件构建，这些组件是可重用且封装的构建块，定义了应用程序的\
  \ UI 元素。每个组件由三个主要部分组成：组件类、HTML 模板和组件特定的样式。\n\n## 2. 创建 Angular 组件\n\n要创建一个新的 Angular\
  \ 组件，你可以使用 Angular CLI（命令行界面）或手动创建文件。以下是使用 Angular CLI 创建新组件的方法：\n\n```bash\nng\
  \ generate component my-component\n```\n\n此命令会生成新组件所需的文件，包括 TypeScript 类、HTML 模板、CSS\
  \ 样式，并更新应用模块以声明新组件。\n\n## 3. Angular 组件的剖析\n\n让我们更仔细地看看 Angular 组件的不同部分：\n\n###\
  \ 组件类 (TypeScript)\n\n包含组件的逻辑和数据。此类使用 `@Component` 装饰器进行装饰，以定义选择器、模板、样式等元数据。\n\n\
  ```typescript\nimport { Component } from '@angular/core';\n\n@Component({\n  selector:\
  \ 'app-my-component',\n  templateUrl: './my-component.component.html',\n  styleUrls:\
  \ ['./my-component.component.css']\n})\nexport class MyComponent {\n  // 组件逻辑和数据属性\n\
  }\n```\n\n### HTML 模板\n\n定义组件 UI 的结构和布局。你可以使用 Angular 模板语法来绑定数据、处理事件和显示动态内容。\n\n\
  ```html\n<div>\n  <h1>欢迎来到 MyComponent！</h1>\n  <p>{{ message }}</p>\n  <button\
  \ (click)=\"onClick()\">点击我</button>\n</div>\n```\n\n### 组件样式\n\n可选的、特定于组件的 CSS\
  \ 样式。样式可以内联定义，在单独的 CSS 文件中定义，或使用 Sass 或 Less 等 CSS 预处理器定义。\n\n```css\ndiv {\n  background-color:\
  \ #f0f0f0;\n  padding: 20px;\n  border: 1px solid #ccc;\n  border-radius: 5px;\n\
  }\n```\n\n## 4. 使用 Angular 组件和模板\n\n创建组件后，你可以在其他组件中或在应用程序的路由配置中使用它。\n\n### 在模板中使用组件\n\
  \n要在另一个组件的模板中使用一个组件，只需引用其选择器标签。\n\n```html\n<app-my-component></app-my-component>\n\
  ```\n\n### 向组件传递数据\n\n你可以使用输入属性向组件传递数据。在组件类中定义输入属性，并在父组件的模板中绑定它们。\n\n```typescript\n\
  import { Component, Input } from '@angular/core';\n\n@Component({\n  selector: 'app-my-component',\n\
  \  templateUrl: './my-component.component.html',\n  styleUrls: ['./my-component.component.css']\n\
  })\nexport class MyComponent {\n  @Input() message: string;\n}\n```\n\n```html\n\
  <app-my-component [message]=\"'来自父组件的问候'\"></app-my-component>\n```\n\n### 处理事件\n\
  \n组件可以发出事件，以通知父组件有关更改或用户交互的信息。使用 `EventEmitter` 定义自定义事件，并从组件类中发出它们。\n\n```typescript\n\
  import { Component, Output, EventEmitter } from '@angular/core';\n\n@Component({\n\
  \  selector: 'app-my-component',\n  templateUrl: './my-component.component.html',\n\
  \  styleUrls: ['./my-component.component.css']\n})\nexport class MyComponent {\n\
  \  @Output() buttonClick: EventEmitter<void> = new EventEmitter<void>();\n\n  onClick():\
  \ void {\n    this.buttonClick.emit();\n  }\n}\n```\n\n```html\n<app-my-component\
  \ (buttonClick)=\"handleButtonClick()\"></app-my-component>\n```\n\nAngular 组件和模板是创建动态和交互式\
  \ Web 应用程序的基本构建块。通过掌握熟练创建和利用组件的艺术，你可以开发出模块化、易于维护且可扩展的 Angular 14 应用程序。结合 ASP.NET\
  \ Core 8 后端，Angular 组件为现代 Web 开发项目提供了强大的前端架构，实现了应用程序前端和后端组件之间的无缝集成。\n\n## 理解 Angular\
  \ 应用程序中的数据绑定和用户交互\n\n理解数据绑定和用户交互在 Angular 开发中至关重要，因为它们能够实现动态和交互式的用户界面。在本指南中，我们将深入探讨\
  \ Angular 14 应用程序中的数据绑定类型、事件处理和用户交互，并提供基于 ASP.NET Core 8 后端集成的示例。\n\n### 1. Angular\
  \ 中的数据绑定\n\nAngular 中的数据绑定允许你在 UI（用户界面）和应用程序的数据模型之间建立连接。Angular 支持多种数据绑定类型：\n\n\
  1.  插值 (`{{ }}`)：从组件到视图（模板）的单向数据绑定。\n2.  属性绑定 (`[property]=\"value\"`)：从组件到视图的单向数据绑定，用于元素属性。\n\
  3.  事件绑定 (`(event)=\"handler()\"`)：绑定到 DOM 事件以处理用户交互。\n4.  双向绑定 (`[(ngModel)]=\"\
  property\"`)：用于表单元素的双向数据绑定，结合了属性绑定和事件绑定。\n\n### 2. 数据绑定的类型\n\n让我们通过示例来探讨每种数据绑定类型：\n\
  \n#### 插值\n\n插值用于在视图（模板）中显示组件数据。\n\n```typescript\n// 组件类\nexport class AppComponent\
  \ {\n  greeting: string = '你好，Angular！';\n}\n```\n\n```html\n<!-- 模板 -->\n<h1>{{\
  \ greeting }}</h1>\n```\n\n#### 属性绑定\n\n属性绑定用于根据组件数据动态设置元素属性。\n\n```typescript\n\
  // 组件类\nexport class AppComponent {\n  imageUrl: string = 'path/to/image.jpg';\n\
  }\n```\n\n```html\n<!-- 模板 -->\n<img [src]=\"imageUrl\" alt=\"图片\">\n```\n\n####\
  \ 事件绑定\n\n事件绑定允许你处理由用户交互触发的 DOM 事件。\n\n```typescript\n// 组件类\nexport class AppComponent\
  \ {\n  handleClick(): void {\n    alert('按钮被点击！');\n  }\n}\n```\n\n```html\n<!--\
  \ 模板 -->\n<button (click)=\"handleClick()\">点击我</button>\n```\n\n#### 双向绑定（表单）\n\
  \n双向绑定通常用于表单，以同步输入字段和组件属性之间的数据。\n\n```typescript\n// 组件类\nexport class AppComponent\
  \ {\n  username: string = '';\n}\n```\n\n```html\n<!-- 模板 -->\n<input type=\"text\"\
  \ [(ngModel)]=\"username\">\n<p>欢迎，{{ username }}！</p>\n```\n\n### 3. 处理用户交互\n\n\
  Angular 提供了处理用户交互的机制，例如点击、输入更改和表单提交。\n\n#### 事件处理\n\n使用事件绑定在组件类中处理用户触发的事件。\n\n```typescript\n\
  // 组件类\nexport class AppComponent {\n  handleClick(): void {\n    alert('按钮被点击！');\n\
  \  }\n}\n```\n\n```html\n<!-- 模板 -->\n<button (click)=\"handleClick()\">点击我</button>\n\
  ```\n\n#### 表单处理\n\nAngular 通过 `ngModel`（用于双向绑定）和 `ngForm`（用于表单验证）等指令简化了表单处理。\n\n\
  ```typescript\n// 组件类\nexport class AppComponent {\n  formData: any = {};\n\n  onSubmit():\
  \ void {\n    console.log('表单已提交：', this.formData);\n  }\n}\n```\n\n```html\n<!--\
  \ 模板 -->\n<form (ngSubmit)=\"onSubmit()\">\n  <input type=\"text\" [(ngModel)]=\"\
  formData.username\" name=\"username\" required>\n  <button type=\"submit\">提交</button>\n\
  </form>\n```\n\n## 响应式表单\n\nAngular 还支持响应式表单，为表单管理提供了一种更具可扩展性和结构化的方法。\n\n```typescript\n\
  import { Component } from '@angular/core';\nimport { FormBuilder, FormGroup, Validators\
  \ } from '@angular/forms';\n\n@Component({\n  selector: 'app-root',\n  templateUrl:\
  \ './app.component.html',\n  styleUrls: ['./app.component.css']\n})\nexport class\
  \ AppComponent {\n```\n\n\n\n\n`form: FormGroup;`\n\n`constructor(private fb: FormBuilder)\
  \ {`\n\n`this.form = this.fb.group({`\n\n`username: ['', Validators.required],`\n\
  \n`email: ['', [Validators.required, Validators.email]],`\n\n`password: ['', [Validators.required,\
  \ Validators.minLength(6)]]`\n\n`});`\n\n`}`\n\n`onSubmit(): void {`\n\n`if (this.form.valid)\
  \ {`\n\n`console.log('Form submitted:', this.form.value);`\n\n`}`\n\n`}`\n\n`}`\n\
  \n```html\n<!-- 模板 -->\n<form [formGroup]=\"form\" (ngSubmit)=\"onSubmit()\">\n\
  \  <input type=\"text\" formControlName=\"username\" placeholder=\"用户名\">\n  <input\
  \ type=\"email\" formControlName=\"email\" placeholder=\"邮箱\">\n  <input type=\"\
  password\" formControlName=\"password\" placeholder=\"密码\">\n  <button type=\"submit\"\
  \ [disabled]=\"form.invalid\">提交</button>\n</form>\n```\n\n4\\. ASP.NET Core 集成：当将\
  \ Angular 与 ASP.NET Core 后端集成时，你可以在 Angular 中处理用户交互，并通过 HTTP 请求（使用 Angular 的 `HttpClient`）与后端通信。\n\
  \n```typescript\nimport { HttpClient } from '@angular/common/http';\n\nexport class\
  \ AppComponent {\n  constructor(private http: HttpClient) {}\n\n  fetchData(): void\
  \ {\n    this.http.get('https://api.example.com/data')\n      .subscribe((data:\
  \ any) => {\n        console.log('Received data:', data);\n      });\n  }\n}\n```\n\
  \n在此示例中，`HttpClient` 用于向 API 端点发起 GET 请求，以异步方式获取数据。\n\n理解数据绑定和用户交互对于构建交互式和动态的 Angular\
  \ 应用程序至关重要。无论是单向绑定、事件处理、表单管理还是双向数据绑定，Angular 都提供了强大的工具和指令来简化前端开发。通过将 Angular 与 ASP.NET\
  \ Core 后端集成，你可以创建响应迅速、可扩展且用户友好的全栈 Web 应用程序，在整个应用程序中提供无缝的用户体验。\n\n## 第 8 章：构建功能丰富的\
  \ Angular 14 组件\n\n### 使用 Angular Router 实现路由\n\n使用 Angular Router 实现路由对于创建具有多个视图或页面的单页应用程序（SPA）至关重要。Angular\
  \ Router 提供了一种强大且灵活的方式来管理 Angular 应用程序中的导航、路由参数和嵌套路由。让我们通过基于 ASP.NET Core 8 后端和\
  \ Angular 14 前端的示例，探索如何使用 Angular Router 实现路由。\n\n1\\. 设置 Angular Router：首先，确保你的\
  \ Angular 项目中已安装 Angular Router。你可以使用 Angular CLI 生成一个带有路由的新 Angular 模块。\n\n```bash\n\
  ng generate module app-routing --flat --module=app\n```\n\n此命令会生成一个包含必要路由配置的 `app-routing.module.ts`\
  \ 文件。\n\n2\\. 配置路由：在 `app-routing.module.ts` 文件中，使用 `RouterModule.forRoot()` 方法定义你的应用程序路由。每个路由由一个路径、一个组件以及可选的附加配置（如路由参数或子路由）组成。\n\
  \n```typescript\nimport { NgModule } from '@angular/core';\nimport { Routes, RouterModule\
  \ } from '@angular/router';\nimport { HomeComponent } from './home/home.component';\n\
  import { AboutComponent } from './about/about.component';\nimport { ContactComponent\
  \ } from './contact/contact.component';\n\nconst routes: Routes = [\n  { path: '',\
  \ component: HomeComponent },\n  { path: 'about', component: AboutComponent },\n\
  \  { path: 'contact', component: ContactComponent },\n  // 根据需要添加更多路由\n];\n\n@NgModule({\n\
  \  imports: [RouterModule.forRoot(routes)],\n  exports: [RouterModule]\n})\nexport\
  \ class AppRoutingModule { }\n```\n\n3\\. 添加路由出口：在你的主 `app.component.html` 文件中，添加一个\
  \ `<router-outlet></router-outlet>` 标签，路由组件将根据当前路由在此处显示。\n\n```html\n<!-- app.component.html\
  \ -->\n<router-outlet></router-outlet>\n```\n\n4\\. 创建路由组件：为路由配置中定义的每个路由创建 Angular\
  \ 组件。例如，创建 `home.component.ts`、`about.component.ts` 和 `contact.component.ts`。\n\n\
  ```bash\nng generate component home\nng generate component about\nng generate component\
  \ contact\n```\n\n5\\. 导航和链接：使用 Angular Router 的 `routerLink` 指令在应用程序中的路由之间进行导航。相应地更新你的导航菜单或链接。\n\
  \n```html\n<!-- 示例导航菜单 -->\n<ul>\n  <li><a routerLink=\"/\">首页</a></li>\n  <li><a\
  \ routerLink=\"/about\">关于</a></li>\n  <li><a routerLink=\"/contact\">联系</a></li>\n\
  </ul>\n```\n\n6\\. 路由参数：你可以使用路由参数向路由传递参数。更新你的路由配置，并在相应的组件中访问参数。\n\n```typescript\n\
  const routes: Routes = [\n  { path: 'product/:id', component: ProductComponent },\n\
  ];\n\n// 在组件中访问路由参数\nimport { ActivatedRoute } from '@angular/router';\n\nexport\
  \ class ProductComponent implements OnInit {\n  constructor(private route: ActivatedRoute)\
  \ { }\n\n  ngOnInit(): void {\n    this.route.params.subscribe(params => {\n   \
  \   const productId = params['id'];\n      // 在你的组件逻辑中使用 productId\n    });\n  }\n\
  }\n```\n\n7\\. 子路由和嵌套路由：Angular Router 支持嵌套或子路由，允许你在其他路由内定义路由。这对于组织复杂的应用程序布局非常有用。\n\
  \n```typescript\nconst routes: Routes = [\n  {\n    path: 'admin',\n    component:\
  \ AdminComponent,\n    children: [\n      { path: 'dashboard', component: DashboardComponent\
  \ },\n      { path: 'users', component: UsersComponent },\n      // 添加更多子路由\n  \
  \  ]\n  },\n];\n```\n\n8\\. 路由守卫：Angular Router 中的路由守卫允许你根据特定条件控制导航和访问。例如，你可以实现一个认证守卫来限制对某些路由的访问。\n\
  \n```typescript\nimport { Injectable } from '@angular/core';\nimport { CanActivate,\
  \ Router } from '@angular/router';\nimport { AuthService } from './auth.service';\n\
  \n@Injectable({\n  providedIn: 'root'\n})\nexport class AuthGuard implements CanActivate\
  \ {\n  constructor(private authService: AuthService, private router: Router) { }\n\
  \n  canActivate(): boolean {\n    if (this.authService.isLoggedIn()) {\n      return\
  \ true;\n    } else {\n      this.router.navigate(['/login']); // 重定向到登录页面\n   \
  \   return false;\n    }\n  }\n}\n```\n\n9\\. 与 ASP.NET Core 后端集成：当将 Angular Router\
  \ 与 ASP.NET Core 后端集成时，请确保你的后端 API 端点与 Angular 应用程序中预期的路由相匹配。例如，如果你的 Angular 应用有像\
  \ `/api/products` 这样的路由，请确保你的 ASP.NET Core 后端在 `/api/products` 处公开 API。\n\nAngular\
  \ Router 为在 Angular 应用程序中实现客户端路由和导航提供了强大的机制。通过配置路由、定义路由组件、处理路由参数和使用路由守卫，你可以创建动态且响应迅速的\
  \ SPA，提供无缝的用户体验。当与 ASP.NET Core 后端集成时，Angular Router 能够实现高效的客户端-服务器通信和导航功能，从而支持全栈\
  \ Web 开发。\n\n### Angular 应用程序中的表单和数据验证\n\n表单和数据验证是 Web 开发的重要方面，允许用户输入数据并确保其准确性和完整性。在\
  \ Angular 应用程序中，可以使用模板驱动表单或响应式表单来创建表单。让我们结合基于 ASP.NET Core 8 后端和 Angular 14 前端的示例，探讨这两种方法以及数据验证技术。\n\
  \n1\\. 模板驱动表单：Angular 中的模板驱动表单基于指令和模板驱动验证。以下是使用模板驱动表单创建带有验证的基本表单的方法：\n\n表单创建：在 Angular\
  \ 组件的 HTML 模板中，使用 `ngForm` 指令和带有 `ngModel` 的表单控件（用于双向数据绑定）来创建表单。\n\n```html\n<form\
  \ #myForm=\"ngForm\" (ngSubmit)=\"onSubmit(myForm)\">\n  <div>\n    <label for=\"\
  name\">姓名：</label>\n```\n\n\n\n\n\n# Angular 表单与数据验证\n\n## 模板驱动表单\n\n```html\n<input\
  \ type=\"text\" id=\"name\" name=\"name\" [(ngModel)]=\"formData.name\" required>\n\
  </div>\n<div>\n<label for=\"email\">Email:</label>\n<input type=\"email\" id=\"\
  email\" name=\"email\" [(ngModel)]=\"formData.email\" required email>\n<div *ngIf=\"\
  myForm.controls.email.invalid && (myForm.controls.email.dirty || myForm.controls.email.touched)\"\
  >\n<div *ngIf=\"myForm.controls.email.errors.required\">Email is required.</div>\n\
  <div *ngIf=\"myForm.controls.email.errors.email\">Invalid email format.</div>\n\
  </div>\n</div>\n<button type=\"submit\" [disabled]=\"myForm.invalid\">Submit</button>\n\
  </form>\n```\n\n### 表单验证\n\n使用 Angular 指令，如 `required` 和 `email` 进行内置验证。\n\n● 根据表单控件的有效性和用户交互显示错误消息。\n\
  \n### 表单提交\n\n在组件类中处理表单提交。\n\n```typescript\nimport { Component } from '@angular/core';\n\
  \n@Component({\nselector: 'app-my-form',\ntemplateUrl: './my-form.component.html',\n\
  styleUrls: ['./my-form.component.css']\n})\nexport class MyFormComponent {\nformData:\
  \ any = {};\n\nonSubmit(form: any): void {\nif (form.valid) {\nconsole.log('Form\
  \ submitted:', this.formData);\n// You can perform HTTP requests to submit data\
  \ to the backend\n}\n}\n}\n```\n\n## 响应式表单\n\n响应式表单在 Angular 中提供了一种更结构化、以代码为中心的表单处理方法。以下是创建带有验证的响应式表单的方法：\n\
  \n### 表单创建\n\n在组件类中使用 `FormBuilder` 定义响应式表单。\n\n```typescript\nimport { Component,\
  \ OnInit } from '@angular/core';\nimport { FormBuilder, FormGroup, Validators }\
  \ from '@angular/forms';\n\n@Component({\nselector: 'app-my-reactive-form',\ntemplateUrl:\
  \ './my-reactive-form.component.html',\nstyleUrls: ['./my-reactive-form.component.css']\n\
  })\nexport class MyReactiveFormComponent implements OnInit {\nmyForm: FormGroup;\n\
  \nconstructor(private fb: FormBuilder) { }\n\nngOnInit(): void {\nthis.myForm =\
  \ this.fb.group({\nname: ['', Validators.required],\nemail: ['', [Validators.required,\
  \ Validators.email]]\n});\n}\n\nonSubmit(): void {\nif (this.myForm.valid) {\nconsole.log('Form\
  \ submitted:', this.myForm.value);\n// You can perform HTTP requests to submit data\
  \ to the backend\n}\n}\n}\n```\n\n### 表单验证\n\n使用 `Validators` 定义验证规则，如 `required`\
  \ 和 `email`。\n\n● 在表单初始化期间将验证器应用于表单控件。\n\n## 表单模板\n\n在 HTML 模板中将表单控件绑定到响应式表单。\n\n\
  ```html\n<form [formGroup]=\"myForm\" (ngSubmit)=\"onSubmit()\">\n<div>\n<label\
  \ for=\"name\">Name:</label>\n<input type=\"text\" id=\"name\" formControlName=\"\
  name\">\n<div *ngIf=\"myForm.controls.name.invalid && myForm.controls.name.touched\"\
  >\n<div *ngIf=\"myForm.controls.name.errors.required\">Name is required.</div>\n\
  </div>\n</div>\n<div>\n<label for=\"email\">Email:</label>\n<input type=\"email\"\
  \ id=\"email\" formControlName=\"email\">\n<div *ngIf=\"myForm.controls.email.invalid\
  \ && (myForm.controls.email.dirty || myForm.controls.email.touched)\">\n<div *ngIf=\"\
  myForm.controls.email.errors.required\">Email is required.</div>\n<div *ngIf=\"\
  myForm.controls.email.errors.email\">Invalid email format.</div>\n</div>\n</div>\n\
  <button type=\"submit\" [disabled]=\"myForm.invalid\">Submit</button>\n</form>\n\
  ```\n\n## ASP.NET Core 后端中的数据验证\n\n虽然 Angular 处理客户端验证，但在服务器端（ASP.NET Core）验证数据对于确保数据完整性和安全性至关重要。在\
  \ ASP.NET Core 控制器和服务中实现服务器端验证逻辑。\n\n```csharp\nusing System.ComponentModel.DataAnnotations;\n\
  \npublic class FormData\n{\n[Required(ErrorMessage = \"Name is required.\")]\npublic\
  \ string Name { get; set; }\n\n[Required(ErrorMessage = \"Email is required.\")]\n\
  [EmailAddress(ErrorMessage = \"Invalid email format.\")]\npublic string Email {\
  \ get; set; }\n}\n\n[ApiController]\n[Route(\"api/[controller]\")]\npublic class\
  \ FormController : ControllerBase\n{\n[HttpPost(\"submit\")]\npublic IActionResult\
  \ SubmitForm([FromBody] FormData formData)\n{\nif (!ModelState.IsValid)\n{\nreturn\
  \ BadRequest(ModelState);\n}\n// Process the valid form data (e.g., save to database,\
  \ send email, etc.)\nreturn Ok(\"Form submitted successfully.\");\n}\n}\n```\n\n\
  在此示例中，`FormData` 类使用数据注解，如 `[Required]` 和 `[EmailAddress]` 进行验证。控制器的 `SubmitForm`\
  \ 操作检查 `ModelState.IsValid` 属性，以确保传入的数据在处理之前符合验证规则。\n\n表单和数据验证是 Web 开发的关键方面，确保用户输入准确、完整且安全。在\
  \ Angular 应用程序中，您可以使用模板驱动表单或响应式表单来实现表单，每种方式都提供了其优势和灵活性。Angular 中的客户端验证通过向用户提供即时反馈来帮助改善用户体验。\n\
  \n在服务器端（本例中为 ASP.NET Core），再次执行数据验证以确保数据完整性和安全性至关重要。通过将 Angular 中的客户端验证与 ASP.NET\
  \ Core 中的服务器端验证相结合，您可以创建一个健壮可靠的应用程序，有效且安全地处理用户输入。\n\n## 使用 Angular HttpClient 消费\
  \ Web API\n\n消费 Web API 是现代 Web 开发中的常见任务，Angular 提供了一个强大的 HTTP 客户端模块 `HttpClient`，用于向后端\
  \ API 发出 HTTP 请求。在本指南中，我们将探讨如何在 Angular 14 应用程序中使用 `HttpClient` 消费 Web API，示例基于\
  \ ASP.NET Core 8 后端。\n\n### 设置 Angular HttpClient\n\nAngular 应用程序使用 `HttpClientModule`\
  \ 与 HTTP 服务交互。首先，确保在 Angular 模块（`app.module.ts`）中导入了 `HttpClientModule`。\n\n```typescript\n\
  import { BrowserModule } from '@angular/platform-browser';\nimport { NgModule }\
  \ from '@angular/core';\nimport { HttpClientModule } from '@angular/common/http';\n\
  import { FormsModule } from '@angular/forms'; // If using forms\nimport { AppComponent\
  \ } from './app.component';\n\n@NgModule({\ndeclarations: [\nAppComponent\n],\n\
  imports: [\nBrowserModule,\nHttpClientModule,\nFormsModule // If using forms\n],\n\
  providers: [],\nbootstrap: [AppComponent]\n})\nexport class AppModule { }\n```\n\
  \n### 发出 HTTP GET 请求\n\n要从 ASP.NET Core 后端消费 GET 端点，请在 Angular 服务或组件中使用 `HttpClient`。\n\
  \n● **创建 Angular 服务**：创建一个服务来封装 HTTP 请求。使用 Angular CLI 生成服务：\n\n```bash\nng generate\
  \ service data\n```\n\n● **服务实现**：在您的服务（`data.service.ts`）中，注入 `HttpClient` 并定义发出\
  \ HTTP 请求的方法。\n\n```typescript\nimport { Injectable } from '@angular/core';\nimport\
  \ { HttpClient } from '@angular/common/http';\nimport { Observable } from 'rxjs';\n\
  \n@Injectable({\nprovidedIn: 'root'\n})\nexport class DataService {\nprivate apiUrl\
  \ = 'https://localhost:5001/api/data'; // API endpoint\n\nconstructor(private http:\
  \ HttpClient) { }\n\ngetData(): Observable<any> {\nreturn this.http.get<any>(this.apiUrl);\n\
  }\n}\n```\n\n● **在组件中使用服务**：在组件中使用该服务从 API 获取数据。\n\n```typescript\nimport { Component,\
  \ OnInit } from '@angular/core';\nimport { DataService } from './data.service';\n\
  \n@Component({\nselector: 'app-root',\ntemplateUrl: './app.component.html',\nstyleUrls:\
  \ ['./app.component.css']\n})\nexport class AppComponent implements OnInit {\ndata:\
  \ any;\n\nconstructor(private dataService: DataService) { }\n\nngOnInit(): void\
  \ {\nthis.loadData();\n}\n\nloadData(): void {\nthis.dataService.getData().subscribe(response\
  \ => {\nthis.data = response;\n});\n}\n}\n```\n\n● **在模板中显示数据**：在组件的模板（`app.component.html`）中显示获取的数据。\n\
  \n```html\n<div *ngIf=\"data\">\n<h1>Data from API:</h1>\n<ul>\n<li *ngFor=\"let\
  \ item of data\">{{ item.name }}</li>\n</ul>\n</div>\n```\n\n\n\n\n```\n3. 发起其他\
  \ HTTP 请求：除了 GET 请求，你还可以使用 `HttpClient` 的 `post`、`put`、`patch` 和 `delete` 等方法发起其他\
  \ HTTP 请求，如 POST、PUT、PATCH、DELETE 等。以下是一个 POST 请求的示例：\n\n```typescript\nimport {\
  \ Injectable } from '@angular/core';\nimport { HttpClient } from '@angular/common/http';\n\
  import { Observable } from 'rxjs';\n\n@Injectable({\n  providedIn: 'root'\n})\n\
  export class DataService {\n  private apiUrl = 'https://localhost:5001/api/data';\
  \ // API 端点\n\n  constructor(private http: HttpClient) { }\n\n  postData(data: any):\
  \ Observable<any> {\n    return this.http.post<any>(this.apiUrl, data);\n  }\n}\n\
  ```\n\n4. 处理错误和 Observable 管道：在使用 Web API 时，处理错误和管理 observable 管道非常重要。使用 RxJS 库中的\
  \ `catchError`、`map`、`tap` 等操作符可以进行高级 HTTP 请求处理。\n\n```typescript\nimport { Injectable\
  \ } from '@angular/core';\nimport { HttpClient, HttpErrorResponse } from '@angular/common/http';\n\
  import { Observable, throwError } from 'rxjs';\nimport { catchError } from 'rxjs/operators';\n\
  \n@Injectable({\n  providedIn: 'root'\n})\nexport class DataService {\n  private\
  \ apiUrl = 'https://localhost:5001/api/data'; // API 端点\n\n  constructor(private\
  \ http: HttpClient) { }\n\n  getData(): Observable<any> {\n    return this.http.get<any>(this.apiUrl)\n\
  \      .pipe(\n        catchError((error: HttpErrorResponse) => {\n          console.error('发生错误:',\
  \ error);\n          return throwError('出了点问题。请稍后再试。');\n        })\n      );\n\
  \  }\n}\n```\n\nAngular 的 `HttpClient` 模块为在 Angular 应用中使用 Web API 提供了一种便捷高效的方式。通过创建服务来封装\
  \ HTTP 请求并处理 observable 管道，你可以轻松地与 ASP.NET Core 等后端 API 集成，以获取和发送数据。请记住，要优雅地处理错误，并使用\
  \ RxJS 操作符管理异步操作，以在你的 Angular 应用中实现健壮的 API 使用。\n\n## 第 9 章：Angular 14 应用中的状态管理\n\
  \n### 理解状态管理的必要性\n\n状态管理是现代 Web 应用的关键方面，尤其是那些使用 Angular 和 ASP.NET Core 等框架构建的应用。它指的是管理应用数据及其在应用不同组件或模块间的同步。在复杂的应用中，适当的状态管理可确保数据在各种视图或组件间保持一致和最新。让我们深入探讨状态管理的必要性，以及如何在\
  \ Angular 14 应用与 ASP.NET Core 8 后端中解决这一问题。\n\n1. 状态管理的必要性：\n    - 组件通信：在 Angular\
  \ 应用中，组件经常需要通信和共享数据。简单的数据绑定或输入/输出机制可能足以满足父子组件间的通信。然而，当组件之间没有直接关系时（例如，兄弟组件），就需要一种集中式的状态管理方法。\n\
  \    - 复杂的 UI 和交互：现代 Web 应用通常具有复杂的用户界面，包含多个视图、表单和交互元素。如果没有结构化的状态管理方法，管理这些 UI 组件的状态（包括用户输入、表单数据和应用状态）可能会很困难。\n\
  \    - 异步数据处理：在处理异步操作（如 HTTP 请求、数据获取或实时更新（例如通过 WebSocket 连接））时，管理获取的数据或应用加载状态对于提供无缝的用户体验至关重要。\n\
  \    - 可扩展性和可维护性：随着应用复杂性和规模的增长，使用本地组件状态或基于服务的数据共享进行临时状态管理可能会导致代码重复、数据不一致和维护挑战。集中式的状态管理解决方案有助于组织和扩展应用的数据处理逻辑。\n\
  \n2. Angular 中的状态管理选项：\n    - 本地组件状态：特定于组件且不与其他组件共享的简单状态可以使用本地组件状态（例如组件类中的属性）来管理。\n\
  \    - 服务：Angular 服务可用于在组件间共享状态和数据。然而，服务通常是单例实例，其状态在应用中共享。这种方法适用于管理全局应用状态或共享数据。\n\
  \    - RxJS 和 Observables：RxJS 提供了管理异步数据流和状态的强大工具。Observable 和 subject 可用于表示和管理随时间变化的状态，从而在\
  \ Angular 应用中实现响应式编程范式。\n    - NgRx（Redux 模式）：NgRx 是一个用于 Angular 的状态管理库，它实现了 Redux\
  \ 模式。它提供了一个集中式的存储来管理应用状态，用于状态更改的操作，用于处理操作并不可变地更新状态的 reducer，以及用于访问状态特定部分的 selector。\n\
  \n3. 使用 NgRx 进行状态管理的示例：NgRx 是 Angular 应用中状态管理的流行选择。以下是如何使用 NgRx 进行状态管理的简化示例：\n \
  \   - 安装 NgRx：\n\n```bash\nnpm install @ngrx/store @ngrx/effects @ngrx/entity @ngrx/store-devtools\n\
  ```\n\n    - 定义 Actions、Reducers 和 Effects：为管理状态和处理副作用（例如 HTTP 请求）创建操作类型、操作创建者、reducer\
  \ 和 effect。\n    - 定义状态结构：定义应用状态的结构，包括实体、集合和与 UI 相关的状态。\n    - 设置 Store 和 Effects：在\
  \ Angular 模块中配置 NgRx store、effect 和 reducer。使用初始状态值初始化 store。\n    - 分发 Actions：从你的组件或服务中分发操作以触发状态更改和副作用。\n\
  \    - 使用 Selectors 获取数据：在组件中使用 selector 来获取状态的特定部分。selector 有助于维护数据获取的单一事实来源。\n\
  \    - 响应式更新 UI：在组件中使用 observable 订阅状态更改。根据状态更改响应式地更新 UI。\n\n状态管理在构建可扩展、可维护和响应迅速的\
  \ Web 应用中起着至关重要的作用。虽然简单的应用可能依赖本地组件状态或服务进行数据共享，但复杂的应用可以从 Angular 中像 NgRx 这样的集中式状态管理解决方案中受益。通过理解状态管理的必要性并选择适当的策略和工具，开发者可以有效地管理应用状态，提高数据一致性，并在与\
  \ ASP.NET Core 后端集成的 Angular 应用中增强用户体验。\n\n### 利用 NgRx 进行全局状态管理\n\n在 Angular 应用中利用\
  \ NgRx 进行全局状态管理是一种强大的方法，可以高效地处理复杂的应用状态和数据流。NgRx 实现了 Redux 模式，它集中管理应用状态，并通过操作和 reducer\
  \ 提供了一种可预测的方式来管理状态更改。让我们探讨如何在集成 ASP.NET Core 8 后端的 Angular 14 应用中利用 NgRx 进行全局状态管理。\n\
  \n1. 安装 NgRx：在利用 NgRx 之前，你需要安装所需的 NgRx 包。NgRx 包含多个包，如 `@ngrx/store`、`@ngrx/effects`、`@ngrx/entity`\
  \ 和 `@ngrx/store-devtools`。\n\n```bash\nnpm install @ngrx/store @ngrx/effects @ngrx/entity\
  \ @ngrx/store-devtools\n```\n\n2. 设置 NgRx Store：\n    - 定义 Actions：操作代表可以触发应用状态更改的事件或操作。为每个操作定义操作类型和操作创建者。\n\
  \n```typescript\n// data.actions.ts\nimport { createAction, props } from '@ngrx/store';\n\
  \nexport const loadData = createAction('[Data] Load Data');\n```\n\n\n\n\nexport\
  \ const loadDataSuccess = createAction('[Data] Load Data Success', props<{ data:\
  \ any[] }>());\n\nexport const loadDataFailure = createAction('[Data] Load Data\
  \ Failure', props<{ error: any }>());\n\n## 定义 Reducers\n\nReducers 是纯函数，负责根据分发的\
  \ actions 处理状态转换。为应用状态的每个切片定义 reducers。\n\n```typescript\n// data.reducer.ts\nimport\
  \ { createReducer, on } from '@ngrx/store';\nimport * as DataActions from './data.actions';\n\
  \nexport interface DataState {\n  data: any[];\n  loading: boolean;\n  error: any;\n\
  }\n\nexport const initialState: DataState = {\n  data: [],\n  loading: false,\n\
  \  error: null\n};\n\nexport const dataReducer = createReducer(\n  initialState,\n\
  \  on(DataActions.loadData, state => ({ ...state, loading: true })),\n  on(DataActions.loadDataSuccess,\
  \ (state, { data }) => ({ ...state, data, loading: false })),\n  on(DataActions.loadDataFailure,\
  \ (state, { error }) => ({ ...state, error, loading: false }))\n);\n```\n\n## 设置\
  \ Effects\n\nEffects 用于处理副作用，例如 HTTP 请求，并根据这些副作用的结果分发新的 actions。\n\n```typescript\n\
  // data.effects.ts\nimport { Injectable } from '@angular/core';\nimport { Actions,\
  \ createEffect, ofType } from '@ngrx/effects';\nimport { of } from 'rxjs';\nimport\
  \ { catchError, map, switchMap } from 'rxjs/operators';\nimport * as DataActions\
  \ from './data.actions';\nimport { DataService } from './data.service';\n\n@Injectable()\n\
  export class DataEffects {\n  loadData$ = createEffect(() => this.actions$.pipe(\n\
  \    ofType(DataActions.loadData),\n    switchMap(() =>\n      this.dataService.getData().pipe(\n\
  \        map(data => DataActions.loadDataSuccess({ data })),\n        catchError(error\
  \ => of(DataActions.loadDataFailure({ error })))\n      )\n    )\n  ));\n\n  constructor(private\
  \ actions$: Actions, private dataService: DataService) { }\n}\n```\n\n## 注册 NgRx\
  \ 模块\n\n在 Angular 模块（`app.module.ts`）中注册 NgRx 模块（store, effects 等）。\n\n```typescript\n\
  import { StoreModule } from '@ngrx/store';\nimport { EffectsModule } from '@ngrx/effects';\n\
  import { dataReducer } from './data.reducer';\nimport { DataEffects } from './data.effects';\n\
  \n@NgModule({\n  imports: [\n    StoreModule.forRoot({ data: dataReducer }),\n \
  \   EffectsModule.forRoot([DataEffects]),\n    // Other imports\n  ],\n  providers:\
  \ [DataEffects],\n  // Other configurations\n})\nexport class AppModule { }\n```\n\
  \n## 在组件中使用全局状态\n\n### 分发 Actions\n\n从组件中分发 NgRx actions 以触发状态更改。\n\n```typescript\n\
  import { Component, OnInit } from '@angular/core';\nimport { Store } from '@ngrx/store';\n\
  import { loadData } from './data.actions';\n\n@Component({\n  selector: 'app-data',\n\
  \  templateUrl: './data.component.html',\n  styleUrls: ['./data.component.css']\n\
  })\nexport class DataComponent implements OnInit {\n  constructor(private store:\
  \ Store<{ data: DataState }>) { }\n\n  ngOnInit(): void {\n    this.loadData();\n\
  \  }\n\n  loadData(): void {\n    this.store.dispatch(loadData());\n  }\n}\n```\n\
  \n### 使用 Selectors 访问状态\n\n使用 NgRx selectors 在组件中访问全局状态的特定部分。\n\n```typescript\n\
  import { Component } from '@angular/core';\nimport { Store, select } from '@ngrx/store';\n\
  import { Observable } from 'rxjs';\nimport { DataState } from './data.reducer';\n\
  import { selectData } from './data.selectors';\n\n@Component({\n  selector: 'app-data-view',\n\
  \  templateUrl: './data-view.component.html',\n  styleUrls: ['./data-view.component.css']\n\
  })\nexport class DataViewComponent {\n  data$: Observable<any[]>;\n\n  constructor(private\
  \ store: Store<{ data: DataState }>) {\n    this.data$ = this.store.pipe(select(selectData));\n\
  \  }\n}\n```\n\nNgRx 为 Angular 应用中的全局状态管理提供了强大的解决方案。通过定义 actions、reducers、effects\
  \ 和 selectors，您可以高效地管理复杂的应用状态。这种方法为您的应用数据提供了单一事实来源，并促进了组件间可预测的状态更改。当与 ASP.NET Core\
  \ 后端集成时，NgRx 有助于无缝管理应用数据流，并确保一致的用户体验。\n\n## 在组件中实现本地状态管理\n\n在 Angular 组件中实现本地状态管理对于管理特定于组件的数据和\
  \ UI 状态至关重要。与适用于管理应用范围状态的全局状态管理库（如 NgRx）不同，本地状态管理侧重于特定于某个组件的数据。让我们探讨如何在基于 ASP.NET\
  \ Core 8 后端的 Angular 14 组件中实现本地状态管理。\n\n### 1. 使用组件类属性\n\n管理 Angular 组件本地状态最简单的方法之一是在组件类中直接使用属性。\n\
  \n```typescript\nimport { Component } from '@angular/core';\n\n@Component({\n  selector:\
  \ 'app-example',\n  templateUrl: './example.component.html',\n  styleUrls: ['./example.component.css']\n\
  })\nexport class ExampleComponent {\n  count: number = 0;\n  message: string = '';\n\
  \n  increment(): void {\n    this.count++;\n  }\n\n  decrement(): void {\n    this.count--;\n\
  \  }\n\n  updateMessage(newMessage: string): void {\n    this.message = newMessage;\n\
  \  }\n}\n```\n\n在此示例中，`count` 和 `message` 是 `ExampleComponent` 的本地状态变量。`increment`、`decrement`\
  \ 和 `updateMessage` 方法用于更新这些状态变量。\n\n### 2. 使用模板绑定显示状态\n\n您可以将本地状态变量绑定到组件的模板以显示动态数据。\n\
  \n```html\n<!-- example.component.html -->\n<p>Count: {{ count }}</p>\n<p>Message:\
  \ {{ message }}</p>\n<button (click)=\"increment()\">Increment</button>\n<button\
  \ (click)=\"decrement()\">Decrement</button>\n<input type=\"text\" [(ngModel)]=\"\
  newMessage\">\n<button (click)=\"updateMessage(newMessage)\">Update Message</button>\n\
  ```\n\n在模板中，`{{ count }}` 和 `{{ message }}` 分别显示 `count` 和 `message` 变量的当前值。`(click)`\
  \ 事件绑定调用相应的方法来更新状态。\n\n### 3. 管理 UI 状态和交互性\n\n本地状态管理通常用于管理与 UI 相关的状态，例如可见性、表单输入值、加载指示器等。\n\
  \n```typescript\nimport { Component } from '@angular/core';\n\n@Component({\n  selector:\
  \ 'app-example',\n  templateUrl: './example.component.html',\n  styleUrls: ['./example.component.css']\n\
  })\nexport class ExampleComponent {\n  showDetails: boolean = false;\n  inputValue:\
  \ string = '';\n\n  toggleDetails(): void {\n    this.showDetails = !this.showDetails;\n\
  \  }\n\n  handleInputChange(value: string): void {\n    this.inputValue = value;\n\
  \  }\n\n  submitForm(): void {\n    // Handle form submission with inputValue\n\
  \  }\n}\n```\n\n### 4. 处理组件生命周期和本地状态\n\nAngular 组件具有生命周期钩子，允许您在组件生命周期的特定阶段执行操作。这些钩子可用于相应地管理本地状态。\n\
  \n```typescript\nimport { Component, OnInit, OnDestroy } from '@angular/core';\n\
  \n@Component({\n  selector: 'app-example',\n  templateUrl: './example.component.html',\n\
  \  styleUrls: ['./example.component.css']\n})\nexport class ExampleComponent implements\
  \ OnInit, OnDestroy {\n  timer: any;\n  counter: number = 0;\n\n  ngOnInit(): void\
  \ {\n    this.timer = setInterval(() => {\n      this.counter++;\n    }, 1000);\n\
  \  }\n\n  ngOnDestroy(): void {\n    clearInterval(this.timer);\n  }\n}\n```\n\n\
  \n\n\n在此示例中，`ngOnInit` 初始化了一个计时器，该计时器每秒递增 `counter`。`ngOnDestroy` 在组件销毁时清理资源，防止内存泄漏。\n\
  \n本地状态管理对于管理 Angular 应用程序中的特定于组件的数据和 UI 状态至关重要。通过利用组件类属性、模板绑定和生命周期钩子，你可以有效地管理 Angular\
  \ 组件内的本地状态。这种方法使组件保持自包含，促进可重用性，并增强 Angular 应用程序的可维护性。当与 NgRx 等用于应用程序范围状态的全局状态管理解决方案结合使用时，本地状态管理有助于构建与\
  \ ASP.NET Core 后端服务集成的健壮且可扩展的 Angular 应用程序。\n\n## 第 10 章：使用 Angular 14 特性增强用户体验\n\
  \n### 使用动画和指令构建交互式 UI\n\n在 Angular 14 中使用动画和指令构建交互式 UI，为你的 Web 应用程序增加了一层用户体验增强。Angular\
  \ 提供了强大的工具和库来创建动态和动画化的用户界面。让我们探索如何将动画和指令集成到基于 ASP.NET Core 8 后端的 Angular 14 应用程序中。\n\
  \n1.  **使用 Angular 动画**：Angular 的内置动画模块 (`@angular/animations`) 允许你为各种 UI 元素（如组件、过渡和状态更改）创建动画。以下是如何在\
  \ Angular 中使用动画的示例：\n\n    *   **安装 Angular 动画**：\n\n        ```bash\n        npm\
  \ install @angular/animations\n        ```\n\n    *   **导入 BrowserAnimationsModule**：在你的\
  \ Angular 模块 (`app.module.ts`) 中导入 `BrowserAnimationsModule` 以在应用程序中启用动画。\n\n  \
  \      ```typescript\n        import { BrowserModule } from '@angular/platform-browser';\n\
  \        import { NgModule } from '@angular/core';\n        import { BrowserAnimationsModule\
  \ } from '@angular/platform-browser/animations';\n        import { AppComponent\
  \ } from './app.component';\n\n        @NgModule({\n          declarations: [\n\
  \            AppComponent\n          ],\n          imports: [\n            BrowserModule,\n\
  \            BrowserAnimationsModule\n          ],\n          providers: [],\n \
  \         bootstrap: [AppComponent]\n        })\n        export class AppModule\
  \ { }\n        ```\n\n    *   **定义动画**：在你的组件中使用 Angular 的 `trigger`、`transition`\
  \ 和 `style` 函数创建动画。\n\n        ```typescript\n        import { Component } from\
  \ '@angular/core';\n        import { trigger, transition, style, animate } from\
  \ '@angular/animations';\n\n        @Component({\n          selector: 'app-example',\n\
  \          templateUrl: './example.component.html',\n          styleUrls: ['./example.component.css'],\n\
  \          animations: [\n            trigger('fadeInOut', [\n              transition(':enter',\
  \ [\n                style({ opacity: 0 }),\n                animate('500ms', style({\
  \ opacity: 1 })),\n              ]),\n              transition(':leave', [\n   \
  \             animate('500ms', style({ opacity: 0 })),\n              ]),\n    \
  \        ]),\n          ]\n        })\n        export class ExampleComponent {\n\
  \          showElement: boolean = false;\n\n          toggleElement(): void {\n\
  \            this.showElement = !this.showElement;\n          }\n        }\n   \
  \     ```\n\n    *   **在模板中应用动画**：在你的组件模板 (`example.component.html`) 中应用定义的动画。\n\
  \n        ```html\n        <div @fadeInOut *ngIf=\"showElement\">\n          <p>This\
  \ element will fade in and out</p>\n        </div>\n\n        <button (click)=\"\
  toggleElement()\">Toggle Element</button>\n        ```\n\n        在此示例中，`@fadeInOut`\
  \ 动画根据 `showElement` 状态应用于 `div` 元素。\n\n2.  **使用 Angular 指令**：Angular 指令是 DOM 元素上的标记，它告诉\
  \ Angular 对该元素或其子元素执行某些操作。指令可用于创建可重用组件、控制元素的行为以及增强 UI 的交互性。\n\n    *   **创建自定义指令**：你可以创建自定义指令来封装行为并将其应用于模板中的元素。\n\
  \n        ```typescript\n        import { Directive, HostListener, ElementRef }\
  \ from '@angular/core';\n\n        @Directive({\n          selector: '[appHighlight]'\n\
  \        })\n        export class HighlightDirective {\n          constructor(private\
  \ el: ElementRef) { }\n\n          @HostListener('mouseenter') onMouseEnter(): void\
  \ {\n            this.highlight('yellow');\n          }\n\n          @HostListener('mouseleave')\
  \ onMouseLeave(): void {\n            this.highlight(null);\n          }\n\n   \
  \       private highlight(color: string | null): void {\n            this.el.nativeElement.style.backgroundColor\
  \ = color;\n          }\n        }\n        ```\n\n    *   **使用自定义指令**：在你的组件模板中应用自定义指令以添加高亮行为。\n\
  \n        ```html\n        <div appHighlight>\n          Hover over me to highlight!\n\
  \        </div>\n        ```\n\n        在此示例中，当鼠标进入或离开 `div` 元素时，`appHighlight`\
  \ 指令会更改其背景颜色。\n\n利用 Angular 动画和指令可以增强 Web 应用程序 UI 的交互性和视觉吸引力。动画可用于创建平滑的过渡、效果和视觉提示，而指令允许你封装行为并创建可重用组件。通过将动画和指令集成到你的\
  \ Angular 14 应用程序中，你可以构建引人入胜且动态的用户界面，从而提供更好的用户体验。这些技术与 ASP.NET Core 8 后端结合使用，使你能够创建满足用户对响应性和交互性期望的现代交互式\
  \ Web 应用程序。\n\n### 实现服务器端渲染 (SSR) 以提升性能\n\n在 Angular 应用程序中实现服务器端渲染 (SSR) 可以通过在将页面发送到客户端之前在服务器上预渲染页面来提高性能并增强搜索引擎优化\
  \ (SEO)。在本指南中，我们将探讨如何在与 ASP.NET Core 8 后端集成的 Angular 14 应用程序中实现 SSR。\n\n1.  **为\
  \ SSR 设置 Angular Universal**：Angular Universal 是在 Angular 应用程序中实现 SSR 的解决方案。它允许使用\
  \ Node.js 或其他服务器平台在服务器端渲染 Angular 应用程序。\n\n    *   **安装 Angular Universal**：首先，安装必要的\
  \ Angular Universal 包。\n\n        ```bash\n        ng add @nguniversal/express-engine\n\
  \        ```\n\n    *   **生成 SSR 文件**：Angular Universal 生成与 SSR 相关的文件和配置。\n\n  \
  \      ```bash\n        ng generate universal --clientProject [your-project-name]\n\
  \        ```\n\n        将 `[your-project-name]` 替换为你的 Angular 项目名称。\n\n2.  **将 Angular\
  \ Universal 与 ASP.NET Core 配置**：设置好 Angular Universal 后，将其与你的 ASP.NET Core 后端集成。\n\
  \n    *   **Angular SSR 中间件**：配置 ASP.NET Core 以提供 Angular Universal SSR 输出。\n\n\
  \        ```csharp\n        // Startup.cs\n        public void ConfigureServices(IServiceCollection\
  \ services)\n        {\n            // Add Angular Universal services\n        \
  \    services.AddSpaStaticFiles(configuration =>\n            {\n              \
  \  configuration.RootPath = \"ClientApp/dist\";\n            });\n        }\n\n\
  \        public void Configure(IApplicationBuilder app, IWebHostEnvironment env)\n\
  \        {\n            // Other middleware configurations\n            app.UseSpaStaticFiles();\n\
  \            app.UseSpa(spa =>\n            {\n                spa.Options.SourcePath\
  \ = \"ClientApp\";\n\n                if (env.IsDevelopment())\n               \
  \ {\n                    // Use Angular CLI server in development mode\n       \
  \             spa.UseAngularCliServer(npmScript: \"start\");\n                }\n\
  \            });\n        }\n        ```\n\n    *   **SSR 构建和运行**：构建并运行你的应用程序以确保\
  \ SSR 按预期工作。\n\n        ```bash\n        npm run build:ssr\n        dotnet run\n\
  \        ```\n\n3.  **在 Angular 组件中处理 SSR**：\n\n    *   **修改 App 模块**：在你的 `app.module.ts`\
  \ 中，确保将 ` BrowserModule` 替换为 `BrowserModule.withServerTransition({ appId: 'your-app-id'\
  \ })`。\n\n        ```typescript\n        // app.module.ts\n        import { BrowserModule\
  \ } from '@angular/platform-browser';\n        import { NgModule } from '@angular/core';\n\
  \        import { AppModule } from './app.module';\n        import { AppComponent\
  \ } from './app.component';\n        import { ServerModule } from '@angular/platform-server';\n\
  \n        @NgModule({\n          imports: [\n            BrowserModule.withServerTransition({\
  \ appId: 'your-app-id' }),\n            ServerModule,\n            AppModule\n \
  \         ],\n          bootstrap: [AppComponent]\n        })\n        export class\
  \ AppServerModule { }\n        ```\n\n    *   **使用 TransferState 服务**：要在服务器和客户端之间传输状态，请使用\
  \ Angular 的 `TransferState` 服务。\n\n        ```typescript\n        import { Component,\
  \ OnInit } from '@angular/core';\n        ```\n\n\n\nimport { TransferState, makeStateKey\
  \ } from '@angular/platform-browser';\nimport { HttpClient } from '@angular/common/http';\n\
  \n@Component({\n  selector: 'app-root',\n  templateUrl: './app.component.html',\n\
  \  styleUrls: ['./app.component.css']\n})\nexport class AppComponent implements\
  \ OnInit {\n  constructor(private transferState: TransferState, private http: HttpClient)\
  \ {}\n\n  ngOnInit(): void {\n    const key = makeStateKey<any>('your-data-key');\n\
  \    const data = this.transferState.get(key, null);\n    if (!data) {\n      this.http.get<any>('your-api-url').subscribe(apiData\
  \ => {\n        this.transferState.set(key, apiData);\n      });\n    }\n  }\n}\n\
  \n```\n在此示例中，`TransferState` 用于在 SSR 期间将数据从服务器传输到客户端。\n```\n\n## SSR 的优势\n\n1. \
  \ **提升性能**：SSR 减少了初始加载时间并提升了感知性能，尤其对于网络连接较慢或设备性能较低的用户。\n2.  **SEO 优化**：搜索引擎可以更有效地抓取和索引\
  \ SSR 渲染的页面，从而提升搜索引擎排名。\n3.  **增强用户体验**：用户能更快地看到内容渲染，从而获得更流畅、响应更及时的用户体验。\n\n在 Angular\
  \ 应用中使用 Angular Universal 实现服务端渲染（SSR），并将其与 ASP.NET Core 8 后端集成，能带来显著的性能和 SEO 优势。它加快了初始页面加载速度，提升了\
  \ SEO 排名，并增强了整体用户体验。通过遵循上述步骤并理解 SSR 和 Angular Universal 的概念，你可以创建高性能的 Angular 应用，提升其可访问性和搜索引擎可见性。\n\
  \n# 第 11 章：测试与部署 Angular 14 应用\n\n## Angular 的单元测试与端到端测试策略\n\n单元测试和端到端（E2E）测试是确保\
  \ Angular 应用质量和可靠性的关键环节。让我们探讨一下与 ASP.NET Core 8 后端集成的 Angular 应用的单元测试和 E2E 测试策略。\n\
  \n### Angular 中的单元测试\n\n单元测试涉及在隔离环境中测试代码的各个单元或组件，以验证其正确性。在 Angular 中，单元测试通常使用 Jasmine\
  \ 等框架编写，并通过 Angular 测试工具执行。\n\n**设置单元测试**：Angular CLI 内置了对单元测试的支持。你可以使用 Angular\
  \ CLI 为组件生成单元测试文件。\n\n```bash\nng generate component my-component --skip-tests=false\n\
  ```\n\n此命令会生成一个组件及其对应的单元测试文件。\n\n**编写单元测试**：让我们看一个使用 Jasmine 和 Angular 测试工具对组件方法进行单元测试的简单示例。\n\
  \n```typescript\nimport { TestBed } from '@angular/core/testing';\nimport { MyComponent\
  \ } from './my-component.component';\n\ndescribe('MyComponent', () => {\n  beforeEach(async\
  \ () => {\n    await TestBed.configureTestingModule({\n      declarations: [MyComponent]\n\
  \    }).compileComponents();\n  });\n\n  it('should create the component', () =>\
  \ {\n    const fixture = TestBed.createComponent(MyComponent);\n    const component\
  \ = fixture.componentInstance;\n    expect(component).toBeTruthy();\n  });\n\n \
  \ it('should increment count', () => {\n    const fixture = TestBed.createComponent(MyComponent);\n\
  \    const component = fixture.componentInstance;\n    component.increment();\n\
  \    expect(component.count).toEqual(1);\n  });\n});\n```\n\n在此示例中，我们测试了组件的创建以及其\
  \ `increment` 方法的行为。\n\n### Angular 中的端到端（E2E）测试\n\nE2E 测试涉及从开始到结束测试整个应用流程，模拟用户交互并验证预期结果。Angular\
  \ 应用可以使用基于 Selenium WebDriver 的 Protractor 等工具进行 E2E 测试。\n\n**设置 E2E 测试**：Angular\
  \ CLI 支持使用 Protractor 进行 E2E 测试。你可以使用 Angular CLI 生成 E2E 测试配置。\n\n```bash\nng e2e\n\
  ```\n\n此命令会生成一个 E2E 测试配置文件（`protractor.conf.js`）和一个示例 E2E 测试文件（`app.e2e-spec.ts`）。\n\
  \n**编写 E2E 测试**：以下是使用 Protractor 测试登录功能的 E2E 测试示例。\n\n```typescript\nimport { browser,\
  \ by, element } from 'protractor';\n\ndescribe('Login Page', () => {\n  beforeEach(()\
  \ => {\n    browser.get('/login');\n  });\n\n  it('should display login form', ()\
  \ => {\n    expect(element(by.tagName('form'))).toBeTruthy();\n  });\n\n  it('should\
  \ login with valid credentials', () => {\n    element(by.id('username')).sendKeys('user1');\n\
  \    element(by.id('password')).sendKeys('password');\n    element(by.id('loginBtn')).click();\n\
  \    browser.waitForAngular();\n    expect(browser.getCurrentUrl()).toContain('/dashboard');\n\
  \  });\n\n  it('should show error message with invalid credentials', () => {\n \
  \   element(by.id('username')).sendKeys('invalidUser');\n    element(by.id('password')).sendKeys('invalidPassword');\n\
  \    element(by.id('loginBtn')).click();\n    browser.waitForAngular();\n    expect(element(by.className('error-msg')).getText()).toContain('Invalid\
  \ credentials');\n  });\n});\n```\n\n在此 E2E 测试中，我们模拟了用户操作，如输入凭据和点击登录按钮，然后验证预期结果，例如成功登录重定向或错误消息显示。\n\
  \n### 测试策略的优势\n\n**单元测试优势**：\n\n1.  确保各个组件在隔离环境中按预期工作。\n2.  便于重构和代码维护。\n3.  在开发早期阶段识别错误和问题。\n\
  \n**E2E 测试优势**：\n\n1.  从用户角度验证应用的功能。\n2.  测试实际的用户交互和用户流程。\n3.  有助于识别集成问题和端到端场景。\n\
  \n单元测试和 E2E 测试是 Angular 应用健壮测试策略不可或缺的组成部分。单元测试确保各个组件和函数的正确性，而 E2E 测试则从用户角度验证整个应用流程。通过采用这些测试策略并使用\
  \ Jasmine、Protractor 和 Angular 测试工具等工具，开发者可以确保与 ASP.NET Core 8 后端集成的 Angular 应用的质量、可靠性和性能。\n\
  \n## 构建和优化用于生产的 Angular 应用\n\n构建和优化用于生产的 Angular 应用涉及多个步骤，以确保高性能、可靠性和效率。让我们深入了解为生产部署构建和优化与\
  \ ASP.NET Core 8 后端集成的 Angular 应用的过程。\n\n### Angular 中的生产构建\n\nAngular CLI 提供了工具来为\
  \ Angular 应用构建优化的生产就绪包。生产构建会减小文件大小、优化代码，并启用高效缓存以提升性能。\n\n**运行生产构建**：执行 Angular CLI\
  \ 命令以生成 Angular 应用的生产构建。\n\n```bash\nng build --prod\n```\n\n\n\n\n此命令会创建一个 `dist`\
  \ 文件夹，其中包含已优化、可直接部署的构建文件。\n\n## 2. 优化技术\n\n1.  **代码压缩**：在生产构建期间，Angular CLI 会自动压缩和混淆\
  \ JavaScript 和 CSS 文件，以减小其体积。\n2.  **摇树优化**：Angular CLI 执行摇树优化以移除未使用的代码和依赖项，从而减小打包体积。\n\
  3.  **预编译**：生产构建默认启用预编译。它在构建过程中编译 Angular 模板和组件，减少运行时开销。\n4.  **优化资源加载**：Angular\
  \ CLI 通过高效打包图像、字体和样式表等资源来优化资源加载。\n\n## 3. Angular 生产环境最佳实践\n\n1.  **延迟加载**：使用延迟加载仅在需要时加载模块和组件，减小初始打包体积并提升应用启动性能。\n\
  2.  **优化打包**：根据你的应用结构配置 Angular CLI 以生成优化的打包文件。智能地拆分打包文件可以提升应用特定部分的加载时间。\n3.  **生产环境配置**：使用特定于环境的配置文件（`environment.prod.ts`）来设置生产环境特有的变量，如\
  \ API 端点、调试标志等。\n4.  **Service Worker 与渐进式 Web 应用**：实现 Service Worker 并启用 PWA 功能，以提供离线能力、更快的加载速度以及更接近原生应用的用户体验。\n\
  \n## 4. 优化 ASP.NET Core 后端\n\n虽然 Angular 负责前端优化，但优化后端（ASP.NET Core）对于整体应用性能也起着至关重要的作用。\n\
  \n- **启用压缩**：配置 ASP.NET Core 以启用响应压缩，减少服务器与客户端之间的数据传输量。\n- **缓存策略**：为频繁访问的数据或静态内容实现缓存策略，以减少服务器负载并提升响应时间。\n\
  - **数据库优化**：优化数据库查询、索引和数据检索策略，确保高效的数据访问和处理。\n\n## 5. 部署策略\n\n- **部署流水线**：使用 Azure\
  \ DevOps、Jenkins 或 GitHub Actions 等工具设置部署流水线，以自动化构建和部署过程。\n- **持续集成/持续部署**：实现 CI/CD\
  \ 流水线以自动化测试、构建和部署工作流，确保部署的一致性和可靠性。\n- **部署环境**：使用独立的部署环境（例如，开发、预发布、生产）在受控环境中测试变更，然后再部署到生产环境。\n\
  \n## 6. 监控与性能分析\n\n- **监控工具**：使用 Application Insights、New Relic 或 Google Analytics\
  \ 等监控工具来监控应用性能、跟踪错误并收集使用分析数据。\n- **性能优化**：持续监控和分析应用性能指标，如加载时间、服务器响应时间和资源利用率。根据从监控工具获得的洞察来优化性能。\n\
  \n构建和优化用于生产的 Angular 应用涉及前端和后端优化、部署策略以及性能监控的结合。通过遵循最佳实践，如运行生产构建、优化代码和资源、实现延迟加载、启用缓存以及设置部署流水线，开发者可以确保与\
  \ ASP.NET Core 后端集成的 Angular 应用在生产环境中具有高性能、可扩展性和可靠性。定期的监控和性能分析有助于识别和解决性能瓶颈，确保为终端用户提供流畅高效的体验。\n\
  \n## Angular Web 应用的部署选项\n\n部署 Angular Web 应用涉及选择正确的部署选项，以确保高效、可靠且可扩展的部署流程。让我们探讨一些与\
  \ ASP.NET Core 8 后端集成的 Angular Web 应用的部署选项。\n\n### 1. 传统托管\n\n- **手动部署**：使用传统托管时，你需要手动将\
  \ Angular 应用和 ASP.NET Core 后端部署到 Web 服务器。这可以是共享主机提供商、虚拟专用服务器（VPS）或专用服务器。\n- **FTP/SFTP\
  \ 上传**：你可以使用 FTP（文件传输协议）或 SFTP（SSH 文件传输协议）将你的 Angular 构建文件（`dist` 文件夹）和 ASP.NET\
  \ Core 后端文件上传到服务器。\n\n### 2. 云托管\n\n- **Microsoft Azure 应用服务**：Azure 应用服务提供了一个平台即服务（PaaS）环境来托管\
  \ Web 应用。你可以将 Angular 应用和 ASP.NET Core 后端都部署到 Azure 应用服务。\n- **AWS Elastic Beanstalk**：AWS\
  \ Elastic Beanstalk 是一个用于部署和扩展 Web 应用及服务的平台。你可以在 Elastic Beanstalk 中将 Angular 和\
  \ ASP.NET Core 应用部署为独立的环境。\n- **Google Cloud Platform (GCP) App Engine**：GCP App\
  \ Engine 提供了一个用于部署和扩展 Web 应用的环境。你可以将 Angular 和 ASP.NET Core 应用部署到 App Engine，并受益于自动扩展和托管基础设施。\n\
  \n### 3. 容器化部署\n\n1.  **Docker 容器**：使用 Docker 将你的 Angular 和 ASP.NET Core 应用容器化，可以实现跨不同环境的一致部署。你可以为前端和后端创建\
  \ Docker 镜像，然后将它们部署到 Kubernetes 等容器编排平台。\n2.  **Azure 容器实例**：Azure 容器实例提供了一个无服务器的容器托管解决方案。你可以将\
  \ Docker 容器部署到 ACI，无需管理虚拟机。\n3.  **Amazon ECS/EKS**：Amazon ECS（弹性容器服务）和 EKS（弹性 Kubernetes\
  \ 服务）是 AWS 上的容器编排服务。你可以将 Docker 容器部署到 ECS 集群或 EKS 集群，以实现可扩展和托管的部署。\n\n### 4. 部署脚本与自动化\n\
  \n- **CI/CD 流水线**：使用 Azure DevOps、GitHub Actions、Jenkins 或 GitLab CI/CD 等工具设置持续集成和持续部署（CI/CD）流水线。这些流水线自动化了构建、测试和部署过程，确保高效可靠的部署。\n\
  - **部署脚本**：使用 Shell 脚本、PowerShell 脚本或配置管理工具（例如 Ansible、Chef、Puppet）编写部署脚本，以自动化构建、打包、上传和配置应用程序等部署步骤。\n\
  \n### 5. 部署示例\n\n以下是使用 Azure 应用服务和 Azure DevOps CI/CD 流水线部署带有 ASP.NET Core 后端的 Angular\
  \ 应用的示例：\n\n1.  配置你的 Angular 应用以进行生产构建（`ng build --prod`）。\n2.  配置你的 ASP.NET Core\
  \ 应用以进行生产部署。\n3.  为你的 Angular 前端设置一个 Azure 应用服务，为你的 ASP.NET Core 后端设置另一个应用服务。\n\
  4.  在 Azure DevOps 中创建一个 CI/CD 流水线，该流水线在代码提交到你的仓库时触发。\n5.  配置流水线以构建你的 Angular 和\
  \ ASP.NET Core 应用，将它们打包，并部署到各自对应的 Azure 应用服务。\n\n选择正确的部署选项取决于可扩展性需求、自动化需求、云提供商偏好以及基础设施管理偏好等因素。无论你选择传统托管、云托管、容器化部署，还是这些方式的组合，确保与\
  \ ASP.NET Core 后端服务集成的 Angular Web 应用部署流程无缝、高效和可靠都至关重要。定期的测试、监控和自动化有助于随时间推移维护和改进部署工作流。\n\
  \n# 第 12 章：集成 ASP.NET Core 8 与 Angular 14\n\n## 从 Angular 调用 ASP.NET Core 8 Web\
  \ API\n\n从 Angular 应用调用 ASP.NET Core 8 Web API 是现代 Web 开发中的常见场景。在本指南中，我们将探讨如何在 Angular\
  \ 中发起 HTTP 请求并处理响应，以与使用 ASP.NET Core 8 构建的后端 API 进行交互。\n\n### 1. 设置 Angular HTTP\
  \ 客户端\n\nAngular 提供了 `HttpClientModule` 用于向外部 API 发起 HTTP 请求。在使用之前，请确保在 Angular\
  \ 应用的根模块（`app.module.ts`）中导入了 `HttpClientModule`。\n\n```typescript\n\n\n\n\n\n//\
  \ app.module.ts\n\nimport { BrowserModule } from '@angular/platform-browser';\n\
  import { NgModule } from '@angular/core';\nimport { HttpClientModule } from '@angular/common/http';\
  \ // 导入 HttpClientModule\nimport { AppComponent } from './app.component';\n\n@NgModule({\n\
  \  declarations: [\n    AppComponent\n  ],\n  imports: [\n    BrowserModule,\n \
  \   HttpClientModule // 将 HttpClientModule 添加到 imports 中\n  ],\n  providers: [],\n\
  \  bootstrap: [AppComponent]\n})\nexport class AppModule { }\n\n```\n\n## 2. 发起\
  \ HTTP GET 请求\n\n让我们从发起一个简单的 HTTP GET 请求开始，从 ASP.NET Core Web API 端点获取数据。\n\n###\
  \ 服务实现\n\n创建一个 Angular 服务来封装与 API 相关的 HTTP 请求。\n\n```typescript\n// api.service.ts\n\
  import { Injectable } from '@angular/core';\nimport { HttpClient } from '@angular/common/http';\n\
  import { Observable } from 'rxjs';\nimport { catchError } from 'rxjs/operators';\n\
  \n@Injectable({\n  providedIn: 'root'\n})\nexport class ApiService {\n  private\
  \ apiUrl = 'https://your-api-url/api/';\n\n  constructor(private http: HttpClient)\
  \ {}\n\n  getData(): Observable<any> {\n    return this.http.get<any>(this.apiUrl\
  \ + 'data')\n      .pipe(\n        catchError((error) => {\n          throw 'Error\
  \ in fetching data: ' + error;\n        })\n      );\n  }\n}\n```\n\n### 组件使用\n\n\
  现在，在你的组件中使用 `ApiService` 来从 API 获取数据。\n\n```typescript\n// app.component.ts\nimport\
  \ { Component } from '@angular/core';\nimport { ApiService } from './api.service';\n\
  \n@Component({\n  selector: 'app-root',\n  templateUrl: './app.component.html',\n\
  \  styleUrls: ['./app.component.css']\n})\nexport class AppComponent {\n  responseData:\
  \ any;\n\n  constructor(private apiService: ApiService) {}\n\n  fetchData(): void\
  \ {\n    this.apiService.getData().subscribe(\n      (data) => {\n        this.responseData\
  \ = data;\n      },\n      (error) => {\n        console.error('Error fetching data:',\
  \ error);\n      }\n    );\n  }\n}\n```\n\n### HTML 模板\n\n在你的组件 HTML 模板中显示获取到的数据。\n\
  \n```html\n<!-- app.component.html -->\n<button (click)=\"fetchData()\">获取数据</button>\n\
  <div *ngIf=\"responseData\">\n  <p>来自 API 的数据：</p>\n  <ul>\n    <li *ngFor=\"let\
  \ item of responseData\">{{ item.name }}</li>\n  </ul>\n</div>\n```\n\n## 3. 发起\
  \ HTTP POST 请求\n\n让我们扩展示例，加入一个 HTTP POST 请求，向 ASP.NET Core Web API 发送数据。\n\n###\
  \ 服务实现\n\n在你的服务中添加一个方法来处理 HTTP POST 请求。\n\n```typescript\n// api.service.ts\nimport\
  \ { Injectable } from '@angular/core';\nimport { HttpClient } from '@angular/common/http';\n\
  import { Observable } from 'rxjs';\nimport { catchError } from 'rxjs/operators';\n\
  \n@Injectable({\n  providedIn: 'root'\n})\nexport class ApiService {\n  private\
  \ apiUrl = 'https://your-api-url/api/';\n\n  constructor(private http: HttpClient)\
  \ {}\n\n  getData(): Observable<any> {\n    return this.http.get<any>(this.apiUrl\
  \ + 'data')\n      .pipe(\n        catchError((error) => {\n          throw 'Error\
  \ in fetching data: ' + error;\n        })\n      );\n  }\n\n  postData(data: any):\
  \ Observable<any> {\n    return this.http.post<any>(this.apiUrl + 'post', data)\n\
  \      .pipe(\n        catchError((error) => {\n          throw 'Error in posting\
  \ data: ' + error;\n        })\n      );\n  }\n}\n```\n\n### 组件使用\n\n修改你的组件，添加一个用于向\
  \ API 发送数据的方法。\n\n```typescript\n// app.component.ts\nimport { Component } from\
  \ '@angular/core';\nimport { ApiService } from './api.service';\n\n@Component({\n\
  \  selector: 'app-root',\n  templateUrl: './app.component.html',\n  styleUrls: ['./app.component.css']\n\
  })\nexport class AppComponent {\n  responseData: any;\n  postDataInput: string =\
  \ '';\n\n  constructor(private apiService: ApiService) {}\n\n  fetchData(): void\
  \ {\n    this.apiService.getData().subscribe(\n      (data) => {\n        this.responseData\
  \ = data;\n      },\n      (error) => {\n        console.error('Error fetching data:',\
  \ error);\n      }\n    );\n  }\n\n  postData(): void {\n    const data = { message:\
  \ this.postDataInput };\n    this.apiService.postData(data).subscribe(\n      (response)\
  \ => {\n        console.log('Response from API:', response);\n      },\n      (error)\
  \ => {\n        console.error('Error posting data:', error);\n      }\n    );\n\
  \  }\n}\n```\n\n### HTML 模板\n\n添加一个输入框和一个按钮来触发 POST 请求。\n\n```html\n<!-- app.component.html\
  \ -->\n<button (click)=\"fetchData()\">获取数据</button>\n<div *ngIf=\"responseData\"\
  >\n  <p>来自 API 的数据：</p>\n  <ul>\n    <li *ngFor=\"let item of responseData\">{{\
  \ item.name }}</li>\n  </ul>\n</div>\n<input type=\"text\" [(ngModel)]=\"postDataInput\"\
  \ placeholder=\"输入消息\">\n<button (click)=\"postData()\">发送数据</button>\n```\n\n##\
  \ 4. 处理响应与错误处理\n\n在上面的示例中，我们使用 `subscribe` 方法处理 API 响应，其中指定了成功和错误处理的独立函数。这使我们能够处理\
  \ API 响应，并处理 HTTP 请求期间可能发生的任何错误。\n\n从 Angular 应用程序使用 ASP.NET Core 8 Web API 涉及利用\
  \ Angular 的 `HttpClientModule` 发起 GET 和 POST 等 HTTP 请求。通过将 API 交互封装在 Angular 服务中、处理响应并与\
  \ Angular 组件集成，你可以在 Angular 前端和 ASP.NET Core 后端之间创建无缝通信。请记住，在 Angular 应用程序中处理 API\
  \ 时，要优雅地处理错误，并考虑身份验证和授权等安全方面。\n\n## 将身份验证和授权流程与 Angular 集成\n\n集成身份验证和授权流程对于保护与 ASP.NET\
  \ Core 8 Web API 交互的 Angular 应用程序至关重要。此过程涉及实现用户身份验证、管理用户会话，以及基于用户角色和权限强制执行访问控制。让我们深入了解如何将身份验证和授权流程与\
  \ Angular 集成，使用基于 ASP.NET Core 8 后端的示例。\n\n### 1. Angular 中的身份验证\n\n身份验证验证访问应用程序的用户的身份。Angular\
  \ 应用程序通常使用 JSON Web Tokens (JWT) 进行身份验证，其中后端在成功登录时颁发令牌，前端在后续 API 请求中包含此令牌。\n\n####\
  \ 用户身份验证服务\n\n创建一个 Angular 服务来处理用户身份验证任务，如登录、注销和令牌管理。\n\n```typescript\n// auth.service.ts\n\
  import { Injectable } from '@angular/core';\nimport { HttpClient } from '@angular/common/http';\n\
  import { BehaviorSubject, Observable } from 'rxjs';\nimport { tap } from 'rxjs/operators';\n\
  \n@Injectable({\n  providedIn: 'root'\n})\nexport class AuthService {\n  private\
  \ apiUrl = 'https://your-api-url/auth/';\n  private tokenSubject: BehaviorSubject<string\
  \ | null>;\n\n  constructor(private http: HttpClient) {\n    // 如果 localStorage\
  \ 中有令牌，则用它初始化 tokenSubject\n    this.tokenSubject = new BehaviorSubject<string |\
  \ null>(\n      localStorage.getItem('token')\n    );\n  }\n\n  get token(): Observable<string\
  \ | null> {\n    return this.tokenSubject.asObservable();\n  }\n\n  login(username:\
  \ string, password: string): Observable<any> {\n    return this.http.post<any>(this.apiUrl\
  \ + 'login', { username, password })\n      .pipe(\n        tap(response => {\n\
  \          const token = response.token;\n          localStorage.setItem('token',\
  \ token);\n          this.tokenSubject.next(token);\n        })\n      );\n  }\n\
  \n  logout(): void {\n    localStorage.removeItem('token');\n    this.tokenSubject.next(null);\n\
  \  }\n}\n```\n\n### 登录组件\n\n创建一个登录组件，用户可以在其中输入凭据并进行身份验证。\n\n```typescript\n// login.component.ts\n\
  import { Component } from '@angular/core';\nimport { AuthService } from './auth.service';\n\
  \n@Component({\n  selector: 'app-login',\n  templateUrl: './login.component.html',\n\
  \  styleUrls: ['./login.component.css']\n})\nexport class LoginComponent {\n  username:\
  \ string = '';\n  password: string = '';\n\n  constructor(private authService: AuthService)\
  \ {}\n\n  login(): void {\n    this.authService.login(this.username, this.password).subscribe(\n\
  \      () => {\n        // 登录成功后重定向到主页/仪表板或执行必要的操作\n      },\n      error => {\n\
  \        console.error('Login failed:', error);\n        // 处理登录错误（例如，显示错误消息）\n\
  \      }\n    );\n  }\n}\n```\n\n\n\n\n● 登录组件模板：为登录组件创建一个 HTML 模板。\n\n```html\n\
  <!-- login.component.html -->\n<form (ngSubmit)=\"login()\">\n  <input type=\"text\"\
  \ [(ngModel)]=\"username\" placeholder=\"Username\">\n  <input type=\"password\"\
  \ [(ngModel)]=\"password\" placeholder=\"Password\">\n  <button type=\"submit\"\
  >Login</button>\n</form>\n```\n\n2\\. 授权与访问控制：授权根据用户的角色和权限，决定他们可以访问哪些操作和资源。Angular\
  \ 可以通过根据从后端获取的用户角色来控制 UI 元素和路由，从而处理授权。\n\n● 基于角色的授权服务：创建一个服务来管理用户角色和权限。\n\n```typescript\n\
  // auth.service.ts (extended for authorization)\nimport { Injectable } from '@angular/core';\n\
  import { HttpClient } from '@angular/common/http';\nimport { BehaviorSubject, Observable\
  \ } from 'rxjs';\nimport { tap } from 'rxjs/operators';\n\n@Injectable({\n  providedIn:\
  \ 'root'\n})\nexport class AuthService {\n  // Existing code for authentication...\n\
  \  private rolesSubject: BehaviorSubject<string[]>;\n\n  constructor(private http:\
  \ HttpClient) {\n    // Initialize rolesSubject with roles from localStorage if\
  \ available\n    this.rolesSubject = new BehaviorSubject<string[]>(\n      JSON.parse(localStorage.getItem('roles'))\
  \ || []\n    );\n  }\n\n  get roles(): Observable<string[]> {\n    return this.rolesSubject.asObservable();\n\
  \  }\n\n  setRoles(roles: string[]): void {\n    localStorage.setItem('roles', JSON.stringify(roles));\n\
  \    this.rolesSubject.next(roles);\n  }\n\n  clearRoles(): void {\n    localStorage.removeItem('roles');\n\
  \    this.rolesSubject.next([]);\n  }\n}\n```\n\n● 授权守卫：创建一个 Angular 路由守卫，根据用户角色控制对特定路由的访问。\n\
  \n```typescript\n// auth.guard.ts\nimport { Injectable } from '@angular/core';\n\
  import { CanActivate, ActivatedRouteSnapshot, RouterStateSnapshot, Router } from\
  \ '@angular/router';\nimport { Observable } from 'rxjs';\nimport { AuthService }\
  \ from './auth.service';\n\n@Injectable({\n  providedIn: 'root'\n})\nexport class\
  \ AuthGuard implements CanActivate {\n  constructor(private authService: AuthService,\
  \ private router: Router) {}\n\n  canActivate(\n    next: ActivatedRouteSnapshot,\n\
  \    state: RouterStateSnapshot): Observable<boolean> | Promise<boolean> | boolean\
  \ {\n    const requiredRoles = next.data.roles as string[];\n    const userRoles\
  \ = this.authService.getRolesFromLocalStorage(); // Implement this method in AuthService\n\
  \    if (userRoles && requiredRoles.every(role => userRoles.includes(role))) {\n\
  \      return true;\n    } else {\n      // Redirect to unauthorized page or handle\
  \ unauthorized access\n      this.router.navigate(['/unauthorized']);\n      return\
  \ false;\n    }\n  }\n}\n```\n\n● 路由配置：配置你的应用程序路由，并使用 `AuthGuard` 来控制访问。\n\n```typescript\n\
  // app-routing.module.ts\nimport { NgModule } from '@angular/core';\nimport { Routes,\
  \ RouterModule } from '@angular/router';\nimport { AuthGuard } from './auth.guard';\n\
  import { DashboardComponent } from './dashboard.component';\nimport { AdminComponent\
  \ } from './admin.component';\n\nconst routes: Routes = [\n  { path: '', component:\
  \ DashboardComponent, canActivate: [AuthGuard], data: { roles: ['user', 'admin']\
  \ } },\n  { path: 'admin', component: AdminComponent, canActivate: [AuthGuard],\
  \ data: { roles: ['admin'] } },\n  { path: 'unauthorized', component: UnauthorizedComponent\
  \ },\n  { path: '**', redirectTo: '' } // Handle other routes or 404\n];\n\n@NgModule({\n\
  \  imports: [RouterModule.forRoot(routes)],\n  exports: [RouterModule]\n})\nexport\
  \ class AppRoutingModule { }\n```\n\n在 ASP.NET Core 8 后端集成 Angular 应用程序中的认证和授权流程，涉及管理用户认证、处理\
  \ JWT 令牌、基于用户角色控制访问以及保护路由。通过实现认证和授权服务、使用路由守卫以及配置基于角色的访问控制，你可以确保你的 Angular 应用程序在与后端\
  \ API 交互时，提供安全且受控的用户体验。定期测试和验证认证与授权机制对于维护应用程序的安全标准至关重要。\n\n## 第 13 章：构建具有认证和数据的全栈\
  \ Web 应用程序\n\n### 实现安全的用户登录系统\n\n实现一个安全的用户登录系统涉及多个步骤，以确保认证并保护用户凭证。我们将介绍使用 ASP.NET\
  \ Core 8 作为后端 API 和 Angular 14 作为前端的实现方法。以下是如何创建一个安全的用户登录系统：\n\n1\\. 后端实现 (ASP.NET\
  \ Core 8)：\n\n● 用户模型和数据库设置：首先，定义一个 `User` 模型来表示用户信息，如用户名、密码（哈希值）和角色。\n\n```csharp\n\
  // User.cs\nusing System.ComponentModel.DataAnnotations;\n\npublic class User\n\
  {\n    [Key]\n    public int Id { get; set; }\n\n    [Required]\n    public string\
  \ Username { get; set; }\n\n    [Required]\n    public string PasswordHash { get;\
  \ set; }\n\n    // Add other user properties as needed (e.g., roles, email)\n}\n\
  ```\n\n确保你已在 ASP.NET Core 项目中设置并配置了数据库，以安全地存储用户数据。\n\n● 认证控制器：创建一个认证控制器来处理用户登录请求，并在认证成功后颁发\
  \ JWT 令牌。\n\n```csharp\n// AuthController.cs\nusing Microsoft.AspNetCore.Mvc;\n\
  using Microsoft.Extensions.Configuration;\nusing Microsoft.IdentityModel.Tokens;\n\
  using System;\nusing System.IdentityModel.Tokens.Jwt;\nusing System.Security.Claims;\n\
  using System.Text;\n\n[Route(\"api/[controller]\")]\n[ApiController]\npublic class\
  \ AuthController : ControllerBase\n{\n    private readonly IConfiguration _config;\n\
  \    private readonly IUserRepository _userRepository; // Inject user repository\n\
  \n    public AuthController(IConfiguration config, IUserRepository userRepository)\n\
  \    {\n        _config = config;\n        _userRepository = userRepository;\n \
  \   }\n\n    [HttpPost(\"login\")]\n    public IActionResult Login([FromBody] LoginModel\
  \ loginModel)\n    {\n        var user = _userRepository.GetUserByUsername(loginModel.Username);\n\
  \        if (user == null || !VerifyPassword(loginModel.Password, user.PasswordHash))\n\
  \        {\n            return Unauthorized(); // Invalid credentials\n        }\n\
  \n        var token = GenerateJwtToken(user);\n        return Ok(new { Token = token\
  \ });\n    }\n\n    private string GenerateJwtToken(User user)\n    {\n        var\
  \ claims = new[]\n        {\n            new Claim(ClaimTypes.Name, user.Username),\n\
  \            // Add other claims (e.g., roles) as needed\n        };\n\n       \
  \ var key = new SymmetricSecurityKey(Encoding.UTF8.GetBytes(_config[\"Jwt:Secret\"\
  ]));\n        var creds = new SigningCredentials(key, SecurityAlgorithms.HmacSha256);\n\
  \n        var token = new JwtSecurityToken(\n            issuer: _config[\"Jwt:Issuer\"\
  ],\n            audience: _config[\"Jwt:Audience\"],\n            claims: claims,\n\
  \            expires: DateTime.Now.AddMinutes(30), // Token expiration time\n  \
  \          signingCredentials: creds);\n\n        return new JwtSecurityTokenHandler().WriteToken(token);\n\
  \    }\n\n    private bool VerifyPassword(string password, string passwordHash)\n\
  \    {\n        // Implement password verification logic (e.g., using hashing algorithms)\n\
  \    }\n}\n```\n\n● JWT 配置：在 `Startup.cs` 中配置 JWT 认证，以验证传入的 JWT 令牌并认证用户。\n\n```csharp\n\
  // Startup.cs\npublic void ConfigureServices(IServiceCollection services)\n{\n \
  \   // Other service configurations\n    services.AddAuthentication(JwtBearerDefaults.AuthenticationScheme)\n\
  \        .AddJwtBearer(options =>\n        {\n            options.TokenValidationParameters\
  \ = new TokenValidationParameters\n            {\n                ValidateIssuer\
  \ = true,\n                ValidateAudience = true,\n                ValidateLifetime\
  \ = true,\n                ValidateIssuerSigningKey = true,\n                ValidIssuer\
  \ = Configuration[\"Jwt:Issuer\"],\n                ValidAudience = Configuration[\"\
  Jwt:Audience\"],\n                IssuerSigningKey = new SymmetricSecurityKey(Encoding.UTF8.GetBytes(Configuration[\"\
  Jwt:Secret\"]))\n            };\n        });\n}\n```\n\n2\\. 前端实现 (Angular 14)：\n\
