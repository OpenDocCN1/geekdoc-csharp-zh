  \ ASP.NET Core 8 与 Angular 14 全栈开发\n\n想象一下构建动态、交互式的 Web 应用程序，吸引用户并驱动创新。停止在零散的技术间疲于奔命——使用\
  \ `ASP.NET Core 8` 和 `Angular 14` 释放全栈开发的潜力。这一强大组合让您能够从熟悉的 `C#` 环境出发，打造无缝的后端和引人入胜的前端。\n\
  \n`ASP.NET Core 8` 与 `Angular 14`：全栈 Web 开发是您掌握这一前沿技术栈的全面指南。告别不同语言和框架的复杂性——本书为您提供必要的知识和实用技能，以无与伦比的效率构建健壮、高性能的\
  \ Web 应用程序。\n\n以下是您在这段全栈开发之旅中将收获的内容：\n\n● 深入 `ASP.NET Core 8`：构建可扩展且安全的 Web API，它们是您应用程序的基石。利用\
  \ `Entity Framework Core 8` 的强大功能无缝管理数据访问和操作。使用 `IdentityServer` 等工具实现用户身份验证和授权，确保强大的安全措施。学习部署、监控和故障排除服务器端代码的最佳实践。\n\
  \n● 用 `Angular 14` 征服前端：使用 Angular 创新的基于组件的架构构建动态且交互式的用户界面。掌握数据绑定、用户交互和路由，以创造引人入胜的体验。探索高级功能，如使用\
  \ `ngRx` 进行复杂应用的状态管理。学习优化和测试您的 Angular 应用程序以获得卓越性能。\n\n● 弥合鸿沟：无缝集成：本书超越了单独的技术。我们将向您展示如何将\
  \ `ASP.NET Core 8` 后端与 `Angular 14` 前端无缝集成。学习从您的 Angular 应用程序中调用 Web API，确保流畅的数据流。实现跨越服务器和客户端的用户身份验证和授权流程，保证整体体验的安全性。\n\
  \n但等等，还有更多！我们超越基础，让您能够构建尖端的 Web 应用程序。深入研究构建支持离线功能的渐进式 Web 应用（PWAs）等技术，并探索使用 `SignalR`\
  \ 等工具进行实时通信。我们还将指导您遵循安全、调试和实施 CI/CD 流水线的最佳实践，以简化开发工作流程。\n\n\n\n无论你是希望拓展全栈技能的 Web\
  \ 开发者，还是渴望掌握最新技术的热心学习者，《ASP.NET Core 8 与 Angular 14：全栈 Web 开发》都是你的终极伙伴。\n\n拥抱 Web\
  \ 开发的未来。立即订购，开启开发可能性的新世界！\n\n## 第 1 章\n\n### 揭秘全栈开发：理解前端与后端技术\n\n#### 使用 Angular\
  \ 14 进行前端开发\n\nAngular 是一个流行的前端框架，允许开发者构建动态且交互式的 Web 应用。在本节中，我们将介绍设置 Angular 项目和创建简单组件的基础知识。\n\
  \n##### 设置 Angular 14 项目\n\n首先，确保你已安装`Node.js`和`npm`。然后，你可以使用 Angular CLI 创建一个新的\
  \ Angular 项目：\n\n```bash\nnpm install -g @angular/cli   # 全局安装 Angular CLI\nng new\
  \ my-angular-app # 创建一个新的 Angular 项目\ncd my-angular-app # 进入项目目录\n```\n\n##### 创建一个简单组件\n\
  \n让我们创建一个简单的 Angular 组件来显示问候消息。在你的终端中运行以下命令：\n\n```bash\nng generate component greeting\
  \  # 生成一个名为'greeting'的新 Angular 组件\n```\n\n此命令将创建一个包含组件所需文件的`greeting`文件夹。\n\n现在，让我们编辑`greeting.component.html`文件来显示我们的消息：\n\
  \n```html\n<!-- greeting.component.html -->\n<h1>欢迎来到我的 Angular 应用！</h1>\n```\n\n\
  ##### 运行 Angular 应用\n\n你可以使用 Angular CLI 在本地运行你的 Angular 应用：\n\n```bash\nng serve\
  \ --open   # 启动开发服务器并在默认浏览器中打开应用\n```\n\n在浏览器中导航到`http://localhost:4200/`，即可看到你的\
  \ Angular 组件显示的问候消息。\n\n#### 使用 ASP.NET Core 8 进行后端开发\n\nASP.NET Core 是一个多功能框架，专为创建支持云、可跨平台运行且性能优化的现代应用而设计。让我们深入了解如何设置一个基本的\
  \ ASP.NET Core API 并将其与我们的 Angular 前端连接。\n\n##### 设置 ASP.NET Core 8 项目\n\n首先，确保你的机器上安装了.NET\
  \ SDK 8。然后，启动你的终端或命令提示符并执行以下命令：\n\n```bash\ndotnet new webapi -n MyApi  # 创建一个名为'MyApi'的新\
  \ ASP.NET Core Web API 项目\ncd MyApi  # 进入项目目录\n```\n\n##### 创建控制器和 API 端点\n\n让我们创建一个简单的\
  \ API 控制器来返回问候消息。在你的 ASP.NET Core 项目的`Controllers`文件夹中创建一个名为`GreetingController.cs`的新文件，并添加以下代码：\n\
  \n```csharp\n// GreetingController.cs\nusing Microsoft.AspNetCore.Mvc;\n\nnamespace\
  \ MyApi.Controllers\n{\n    [ApiController]\n    [Route(\"api/[controller]\")]\n\
  \    public class GreetingController : ControllerBase\n    {\n        [HttpGet]\n\
  \        public IActionResult Get()\n        {\n            return Ok(\"欢迎来到我的 API！\"\
  );\n        }\n    }\n}\n```\n\n##### 运行 ASP.NET Core API\n\n你可以使用以下命令运行你的 ASP.NET\
  \ Core API：\n\n```bash\ndotnet run\n```\n\n在浏览器中导航到`https://localhost:5001/api/greeting`，或使用\
  \ Postman 等工具发送 GET 请求，即可看到你的 API 返回的问候消息。\n\n#### 集成前端与后端\n\n现在我们已经设置了 Angular\
  \ 前端和 ASP.NET Core API，让我们将它们集成起来，从 API 获取数据并在我们的 Angular 应用中显示。\n\n##### 从 Angular\
  \ 发起 HTTP 请求\n\n打开你 Angular 项目中的`greeting.component.ts`文件，并更新它以向你的 API 发起 HTTP 请求：\n\
  \n```typescript\nThe request was rejected because it was considered high risk\n\n\
  \n\n# 设置你的开发环境\n\n## 安装 Visual Studio 或 Code\n\n为 `ASP.NET Core 8` 和 `Angular 14`\
  \ 开发安装 Visual Studio 或 Visual Studio Code 是一个简单直接的过程，它为开发者提供了构建现代 Web 应用程序的强大工具和功能。让我们逐步了解如何安装\
  \ Visual Studio 和 Visual Studio Code，以及用于 `ASP.NET Core` 和 `Angular` 开发所需的必要扩展。\n\
  \n### 安装 Visual Studio\n\nVisual Studio 是微软推出的一款功能全面的集成开发环境（IDE），支持多种编程语言和平台，包括\
  \ `ASP.NET Core` 开发。以下是为 `ASP.NET Core 8` 开发安装 Visual Studio 的步骤：\n\n1.  **下载 Visual\
  \ Studio**：访问 Visual Studio 官方网站 (`https://visualstudio.microsoft.com/downloads/`)\
  \ 并下载 Visual Studio 安装程序。\n2.  **运行安装程序**：下载安装程序后，运行它。你将看到选择要安装的工作负载和组件的选项。对于 `ASP.NET\
  \ Core` 开发，请确保选择“.NET 桌面开发”工作负载，其中包含 `ASP.NET` 和 `.NET Core` 组件。\n3.  **安装 ASP.NET\
  \ Core SDK**：在安装过程中，安装程序会提示你安装必要的 SDK。请确保安装 `ASP.NET Core SDK`，这是开发 `ASP.NET Core`\
  \ 应用程序所必需的。\n4.  **安装其他组件（可选）**：根据你的项目需求，你可能需要安装其他组件，例如 Azure 开发工具、SQL Server 工具等。\n\
  5.  **完成安装**：按照屏幕上的说明完成安装过程。安装完成后，你可以启动 Visual Studio 并开始创建 `ASP.NET Core` 项目。\n\
  \n## 创建新项目\n\n现在，让我们创建一个 Angular 服务来调用 API：\n\n```bash\nng generate service api\
  \ # 生成一个名为 'api' 的新 Angular 服务\n```\n\n更新该服务以向我们的 API 发送 HTTP GET 请求：\n\n```typescript\n\
  // api.service.ts\nimport { Injectable } from '@angular/core';\nimport { HttpClient\
  \ } from '@angular/common/http';\nimport { Observable } from 'rxjs';\n\n@Injectable({\n\
  \  providedIn: 'root'\n})\nexport class ApiService {\n  private apiUrl = 'https://localhost:5001/api/greeting';\n\
  \n  constructor(private http: HttpClient) { }\n\n  getGreeting(): Observable<string>\
  \ {\n    return this.http.get<string>(this.apiUrl);\n  }\n}\n```\n\n最后，更新一个组件以使用\
  \ API 服务：\n\n```typescript\n// greeting.component.ts\nimport { Component, OnInit\
  \ } from '@angular/core';\nimport { ApiService } from './api.service';\n\n@Component({\n\
  \  selector: 'app-greeting',\n  templateUrl: './greeting.component.html',\n  styleUrls:\
  \ ['./greeting.component.css']\n})\nexport class GreetingComponent implements OnInit\
  \ {\n  greetingMessage: string;\n\n  constructor(private apiService: ApiService)\
  \ { }\n\n  ngOnInit(): void {\n    this.apiService.getGreeting().subscribe({\n \
  \     next: (message) => {\n        this.greetingMessage = message;\n      },\n\
  \      error: (error) => {\n        console.error('Error fetching greeting:', error);\n\
  \      }\n    });\n  }\n}\n```\n\n这个示例演示了如何将 `Angular` 前端与 `ASP.NET Core` API 集成，以无缝地获取和显示数据。\n\
  \n使用 `ASP.NET Core 8` 和 `Angular 14` 的全栈方法提供了诸多优势，包括无缝集成、一致的开发环境、增强的生产力、代码可重用性以及性能优化。通过结合利用这些技术，开发者可以高效地构建健壮、可扩展且现代化的\
  \ Web 应用程序。\n\n## 选择合适的技术：ASP.NET Core 8 & Angular 14\n\n为 Web 开发项目选择合适的技术对其成功至关重要。`ASP.NET\
  \ Core` 和 `Angular` 都是构建现代 Web 应用程序的热门选择，提供了强大的功能和可扩展性。让我们探讨一下为什么 `ASP.NET Core\
  \ 8` 和 `Angular 14` 是 Web 开发的绝佳组合，并深入一些代码示例来说明它们的能力。\n\n### ASP.NET Core 8\n\n`ASP.NET\
  \ Core` 是一个跨平台、高性能的框架，专为构建基于云和互联网连接的现代应用程序而量身定制。版本 8 带来了许多改进和特性，提升了开发者的生产力和应用程序性能。\n\
  \n`ASP.NET Core` 的一个关键优势是它支持构建 RESTful API，这对于创建可被 `Angular` 等前端应用程序调用的后端服务至关重要。让我们使用\
  \ `ASP.NET Core 8` 创建一个简单的 API 端点：\n\n```csharp\n// Startup.cs\npublic void ConfigureServices(IServiceCollection\
  \ services)\n{\n    services.AddControllers();\n}\n\npublic void Configure(IApplicationBuilder\
  \ app, IWebHostEnvironment env)\n{\n    if (env.IsDevelopment())\n    {\n      \
  \  app.UseDeveloperExceptionPage();\n    }\n\n    app.UseRouting();\n\n    app.UseEndpoints(endpoints\
  \ =>\n    {\n        endpoints.MapControllers();\n    });\n}\n\n// WeatherForecastController.cs\n\
  [ApiController]\n[Route(\"api/[controller]\")]\npublic class WeatherForecastController\
  \ : ControllerBase\n{\n    [HttpGet]\n    public IEnumerable<WeatherForecast> Get()\n\
  \    {\n        var rng = new Random();\n        return Enumerable.Range(1, 5).Select(index\
  \ => new WeatherForecast\n        {\n            Date = DateTime.Now.AddDays(index),\n\
  \            TemperatureC = rng.Next(-20, 55),\n            Summary = Summaries[rng.Next(Summaries.Length)]\n\
  \        })\n        .ToArray();\n    }\n}\n```\n\n这段代码设置了一个简单的 API 端点 `/api/weatherforecast`，它返回一个天气预报列表。\n\
  \n### Angular 14\n\n`Angular` 是由 Google 开发的一个强大的前端框架，用于构建动态的单页 Web 应用程序。`Angular\
  \ 14` 引入了新的特性和优化，以提升开发者体验和应用程序性能。\n\n让我们创建一个 `Angular` 组件，它调用我们之前创建的 API 端点并显示天气预报数据：\n\
  \n```typescript\n// weather-forecast.component.ts\nimport { Component, OnInit }\
  \ from '@angular/core';\nimport { HttpClient } from '@angular/common/http';\n\n\
  @Component({\n  selector: 'app-weather-forecast',\n  templateUrl: './weather-forecast.component.html',\n\
  \  styleUrls: ['./weather-forecast.component.css']\n})\nexport class WeatherForecastComponent\
  \ implements OnInit {\n  forecasts: any[];\n\n  constructor(private http: HttpClient)\
  \ { }\n\n  ngOnInit(): void {\n    this.http.get<any[]>('https://localhost:5001/api/weatherforecast').subscribe(data\
  \ => {\n      this.forecasts = data;\n    });\n  }\n}\n```\n\n在这个 `Angular` 组件中，我们使用\
  \ `HttpClient` 模块向我们的 `ASP.NET Core` API 端点发送 HTTP GET 请求，并检索天气预报数据。\n\n### HTML\
  \ 模板\n\n现在，让我们创建 HTML 模板，以便在我们的 `Angular` 组件中显示天气预报数据：\n\n```html\n<!-- weather-forecast.component.html\
  \ -->\n<div *ngIf=\"forecasts\">\n  <h2>Weather Forecasts</h2>\n  <ul>\n    <li\
  \ *ngFor=\"let forecast of forecasts\">\n      Date: {{ forecast.date | date }},\
  \ Temperature: {{ forecast.temperatureC }}°C, Summary: {{ forecast.summary }}\n\
  \    </li>\n  </ul>\n</div>\n```\n\n这个 HTML 模板使用了 `Angular` 的数据绑定和结构指令（`*ngIf` 和\
  \ `*ngFor`）来动态显示从 API 获取的天气预报数据。\n\n通过结合使用 `ASP.NET Core 8` 进行后端 API 开发和 `Angular\
  \ 14` 进行前端开发，你将获得一个强大且现代化的技术栈，用于构建可扩展的 Web 应用程序。`ASP.NET Core` 在创建 RESTful API 方面的健壮性，与\
  \ `Angular` 在创建动态和交互式用户界面方面的能力相辅相成，使它们成为 Web 开发项目的绝佳选择。\n\n\n\n\n## 2. 安装 Visual\
  \ Studio Code\n\nVisual Studio Code (VS Code) 是一款轻量级且功能强大的代码编辑器，具有高度可扩展性，支持多种编程语言和框架，包括\
  \ Angular 开发。以下是为 Angular 14 开发安装 Visual Studio Code 的步骤：\n\n1.  **下载 Visual Studio\
  \ Code**：访问 Visual Studio Code 官方网站 (https://code.visualstudio.com/)，下载适合您操作系统（Windows、macOS\
  \ 或 Linux）的版本。\n2.  **安装 Visual Studio Code**：下载安装程序后，运行它以在您的系统上安装 Visual Studio\
  \ Code。通常，安装过程很简单，您只需同意许可条款并选择安装偏好设置。\n3.  **安装 Angular Essentials 扩展**：安装完成后，打开\
  \ Visual Studio Code。您首先要做的一件事就是安装 Angular Essentials 扩展包，其中包含 Angular 开发所需的基本扩展。操作如下：\n\
  \    *   从侧边栏选择扩展图标（或使用快捷键 `Ctrl+Shift+X`）。\n    *   在扩展市场中搜索 \"Angular Essentials\"\
  。\n    *   点击安装以安装该扩展包。\n4.  **安装 .NET Core SDK**：除了 Visual Studio Code，您还需要单独安装\
  \ .NET Core SDK 才能处理 ASP.NET Core 项目。您可以从 .NET 官方网站 (https://dotnet.microsoft.com/download)\
  \ 下载该 SDK。\n5.  **设置 Angular CLI（可选）**：如果您计划使用 Angular CLI 创建新的 Angular 项目，则需要在系统上全局安装它。在\
  \ Visual Studio Code 中启动终端并执行此命令：\n    ```\n    npm install -g @angular/cli\n  \
  \  ```\n6.  **开始编码**：安装好 Visual Studio Code、Angular Essentials 扩展、.NET Core SDK\
  \ 以及 Angular CLI（如果需要）后，您就可以开始编写 ASP.NET Core 8 API 和 Angular 14 前端应用程序了。\n\n为 ASP.NET\
  \ Core 8 和 Angular 14 开发安装 Visual Studio 或 Visual Studio Code 涉及下载相应的安装程序、选择必要的组件或扩展，并完成安装过程。安装完成后，您就拥有了一个强大的开发环境，可以无缝地创建和构建现代\
  \ Web 应用程序。\n\n## 配置 ASP.NET Core 8 和 Angular 14 开发工具\n\n配置 ASP.NET Core 8 和 Angular\
  \ 14 的开发工具对于确保流畅的开发体验至关重要。在本指南中，我们将逐步介绍为后端 (ASP.NET Core) 和前端 (Angular) 开发设置必要工具和配置的步骤。\n\
  \n### 1. 安装所需软件\n\n在深入配置特定工具之前，请确保您的开发机器上已安装以下软件：\n\n*   **Visual Studio 或 Visual\
  \ Studio Code**：根据您的偏好选择其一。Visual Studio 是一个功能齐全的 IDE，而 Visual Studio Code 是一个轻量级的代码编辑器。\n\
  *   **Node.js 和 npm**：Angular 需要 `Node.js` 和 `npm`（Node 包管理器）来管理依赖项和运行脚本。您可以选择从其官方网站\
  \ [`nodejs.org/`](https://nodejs.org/) 下载并安装 `Node.js`。\n*   **.NET Core SDK**：从\
  \ .NET 官方网站 (https://dotnet.microsoft.com/download) 安装 .NET Core SDK，因为 ASP.NET\
  \ Core 开发需要它。\n\n### 2. 配置 ASP.NET Core 8\n\n如果您使用 Visual Studio，ASP.NET Core 项目的设置过程在\
  \ IDE 中是简化的。如果您使用 Visual Studio Code，则需要手动或通过命令行设置您的 ASP.NET Core 项目。\n\n#### 使用\
  \ Visual Studio\n\n1.  **创建新的 ASP.NET Core 项目**：打开 Visual Studio 并创建一个新的 ASP.NET\
  \ Core Web 应用程序项目。根据您的项目需求选择适当的模板（例如，API、MVC、Razor Pages）。\n2.  **配置启动项和中间件**：在\
  \ ASP.NET Core 项目的 `Startup.cs` 文件中，根据您的应用程序需求配置中间件、服务和路由。例如，要启用 CORS（跨域资源共享），您可以在\
  \ `ConfigureServices` 方法中添加以下代码：\n    ```csharp\n    services.AddCors(options =>\n\
  \    {\n        options.AddPolicy(\"AllowAll\",\n            builder =>\n      \
  \      {\n                builder.AllowAnyOrigin()\n                       .AllowAnyMethod()\n\
  \                       .AllowAnyHeader();\n            });\n    });\n    ```\n\
  3.  **创建控制器和模型**：创建 ASP.NET Core 控制器来处理 API 端点。定义模型来表示您的数据结构。以下是一个基本控制器的示例：\n  \
  \  ```csharp\n    [ApiController]\n    [Route(\"api/[controller]\")]\n    public\
  \ class TodoController : ControllerBase\n    {\n        private readonly ITodoRepository\
  \ _todoRepository;\n\n        public TodoController(ITodoRepository todoRepository)\n\
  \        {\n            _todoRepository = todoRepository;\n        }\n\n       \
  \ [HttpGet]\n        public async Task<IActionResult> GetAllTodos()\n        {\n\
  \            var todos = await _todoRepository.GetAllTodos();\n            return\
  \ Ok(todos);\n        }\n\n        // 可以在此处添加其他 CRUD 操作\n    }\n    ```\n4.  **运行和测试应用程序**：您可以直接从\
  \ Visual Studio 运行您的 ASP.NET Core 应用程序。使用 Postman 或 Swagger 等工具验证您的 API 端点。\n\n\
  #### 使用 Visual Studio Code\n\n1.  **创建新的 ASP.NET Core 项目**：在 Visual Studio Code\
  \ 中打开终端，并使用 .NET CLI 创建新的 ASP.NET Core 项目。例如，要创建一个 Web API 项目，请运行：\n    ```\n  \
  \  dotnet new webapi -n MyWebApi\n    ```\n2.  **安装所需的包**：如果您的项目需要额外的包或依赖项，请使用 `npm`\
  \ 处理前端依赖项，使用 NuGet 处理后端依赖项。\n3.  **配置 CORS 和中间件**：与 Visual Studio 设置类似，在 `Startup.cs`\
  \ 文件中手动配置中间件、服务和其他配置。\n4.  **添加控制器和模型**：根据您的应用程序逻辑需要创建控制器和模型。使用 `dotnet` CLI 或 Visual\
  \ Studio Code 的内置功能来搭建控制器和 CRUD 操作。\n5.  **运行和测试应用程序**：使用 `dotnet run` 命令从终端运行您的\
  \ ASP.NET Core 应用程序。使用 Postman 或 Swagger 等工具验证您的 API 端点。\n\n### 3. 配置 Angular 14\n\
  \nAngular 开发需要设置 Angular CLI、创建组件、服务以及管理依赖项。让我们逐步介绍在项目中配置 Angular 14 的步骤。\n\n1.\
  \  **创建新的 Angular 项目**：在 Visual Studio Code 或任何首选的代码编辑器中打开终端，并使用 Angular CLI 创建新的\
  \ Angular 项目。运行以下命令：\n    ```\n    ng new my-angular-app\n    ```\n2.  **安装 Angular\
  \ Material（可选）**：如果您计划使用 Angular Material 作为 UI 组件，可以通过运行以下命令安装它：\n    ```\n   \
  \ ng add @angular/material\n    ```\n3.  **创建组件和服务**：使用 Angular CLI 生成组件、服务、模块等。例如，要创建一个新组件，请运行：\n\
  \    ```\n    ng generate component my-component\n    ```\n4.  **配置 HttpClient 模块**：如果您的\
  \ Angular 应用程序需要与后端 API (ASP.NET Core) 通信，请在 Angular 应用模块 (`app.module.ts`) 中配置\
  \ `HttpClientModule`。在导入列表中导入并包含 `HttpClientModule`。\n    ```typescript\n    import\
  \ { HttpClientModule } from '@angular/common/http';\n\n    @NgModule({\n      declarations:\
  \ [\n        // 您的组件\n      ],\n      imports: [\n        BrowserModule,\n     \
  \   HttpClientModule\n      ],\n      providers: [],\n      bootstrap: [AppComponent]\n\
  \    })\n    export class AppModule { }\n    ```\n5.  **调用后端 API**：使用 Angular 的\
  \ `HttpClient` 向您的 ASP.NET Core API 端点发出 HTTP 请求。以下是一个发出 HTTP GET 请求的服务示例：\n   \
  \ ```typescript\n    import { Injectable } from '@angular/core';\n    import { HttpClient\
  \ } from '@angular/common/http';\n\n    @Injectable({\n      providedIn: 'root'\n\
  \    })\n    export class ApiService {\n      apiUrl = 'https://localhost:5001/api';\n\
  \n      constructor(private http: HttpClient) { }\n\n      getAllTodos() {\n   \
  \     return this.http.get<any[]>(`${this.apiUrl}/todo`);\n      }\n\n      // 可以在此部分包含其他\
  \ CRUD 操作。\n    }\n    ```\n\n\n\n6\\. 运行并测试 Angular 应用：使用 `ng serve` 命令在本地运行你的\
  \ Angular 应用程序。在浏览器中访问你的 Angular 应用（默认运行在 `http://localhost:4200`）并测试其功能。\n\n配置\
  \ ASP.NET Core 8 和 Angular 14 开发工具涉及设置必要的软件、创建项目、配置中间件、服务、路由以及管理依赖项。通过使用 Visual\
  \ Studio 或 Visual Studio Code，以及 Angular CLI 和 .NET Core SDK，你将拥有一个强大的开发环境，可以无缝构建现代\
  \ Web 应用程序。使用适当的工具测试和调试你的应用程序，可以确保流畅的开发体验。\n\n## 使用 Git 设置版本控制\n\n使用 Git 设置版本控制对于管理代码更改、与团队成员协作以及维护项目修订历史至关重要。无论你是在开发\
  \ ASP.NET Core 8 后端还是 Angular 14 前端（或两者兼有），Git 都提供了一个可靠的版本控制系统。让我们逐步了解如何为包含 ASP.NET\
  \ Core 和 Angular 开发的项目设置 Git。\n\n1\\. 安装 Git：如果你尚未安装 Git，可以从官方网站 (https://git-scm.com/)\
  \ 下载。请遵循适用于你的操作系统（Windows、macOS 或 Linux）的安装指南。\n\n2\\. 创建 Git 仓库：安装 Git 后，使用终端或命令提示符导航到项目的根目录。\n\
  \n对于新项目，你可以使用以下命令初始化一个新的 Git 仓库：\n\n```bash\ngit init\n```\n\n此命令在当前目录中创建一个新的 Git\
  \ 仓库，并将其标记为版本控制项目。\n\n3\\. 设置 `.gitignore`：在 ASP.NET Core 和 Angular 项目中，有些文件和目录你不想包含在版本控制中。例如，构建产物、临时文件和依赖项。在项目根目录创建一个\
  \ `.gitignore` 文件，以指定 Git 应忽略哪些文件和目录。\n\n以下是一个适用于 ASP.NET Core 和 Angular 项目的 `.gitignore`\
  \ 文件示例：\n\n```\n### ASP.NET Core\nbin/\nobj/\n*.csproj.user\n*.dll\n*.exe\n\n###\
  \ Angular\nnode_modules/\ndist/\n```\n\n根据你的具体项目结构和依赖项调整 `.gitignore` 文件。\n\n4\\\
  . 添加和提交更改：设置好 `.gitignore` 后，你可以开始将文件添加到 Git 仓库并提交更改。\n\n要将所有文件添加到暂存区以进行下一次提交，请使用：\n\
  \n```bash\ngit add .\n```\n\n使用以下命令将更改提交到仓库：\n\n```bash\ngit commit -m \"Initial\
  \ commit\"\n```\n\n将 `\"Initial commit\"` 替换为描述你所做更改的适当提交消息。\n\n5\\. 远程仓库（可选）：如果你在团队中工作，或者想在远程服务器（如\
  \ GitHub、GitLab 或 Bitbucket）上备份代码，你可以添加一个远程仓库。\n\n例如，要在 GitHub 上添加一个远程仓库：\n\n1\\\
  . 在 GitHub 上创建一个新仓库。\n\n2\\. 使用以下命令添加远程仓库：\n\n```bash\ngit remote add origin https://github.com/username/repo-name.git\n\
  ```\n\n将 `https://github.com/username/repo-name.git` 替换为你的 GitHub 仓库的 URL。\n\n3\\\
  . 将你的代码推送到远程仓库：\n\n```bash\ngit push -u origin main\n```\n\n此命令将你的代码推送到远程仓库的 `main`\
  \ 分支。如果你使用的是不同的分支，请将 `main` 替换为该分支的名称。\n\n6\\. 分支和合并（可选）：Git 允许你在单独的分支上处理不同的功能或错误修复，这些分支稍后可以合并到主分支（或其他目标分支）。\n\
  \n要创建一个新分支并切换到它：\n\n```bash\ngit checkout -b feature-name\n```\n\n将 `feature-name`\
  \ 替换为适当的分支名称。\n\n在分支中进行更改后，你可以提交它们，然后使用 Git 命令（如 `git merge`）或使用 GitHub 等 Git 托管平台的拉取请求机制将分支合并到主分支。\n\
  \n7\\. 拉取更改（可选）：如果你在团队中工作或与他人协作，你可能需要从远程仓库拉取更改以保持本地仓库的更新。\n\n要从远程仓库拉取更改：\n\n```bash\n\
  git pull origin main\n```\n\n将 `main` 替换为你想要拉取更改的分支。\n\n为 ASP.NET Core 8 和 Angular\
  \ 14 项目设置 Git 版本控制涉及初始化 Git 仓库、创建 `.gitignore` 文件、添加和提交更改，以及可选地设置远程仓库以进行协作。分支、合并和拉取更改是额外的\
  \ Git 操作，可以增强你的开发工作流程，尤其是在团队环境中。通过遵循这些步骤，你可以有效地管理代码版本、跟踪更改，并在项目中无缝协作。\n\n## 第 3\
  \ 章\n\n### 掌握 ASP.NET Core 8 以构建健壮的后端\n\n构建你的第一个 ASP.NET Core 8 Web API 是开始后端开发的好方法。我们将逐步介绍在\
  \ Visual Studio 中创建新的 ASP.NET Core 项目、设置一个简单的 Web API 以及使用 Postman 等工具进行测试的过程。同时，我们将考虑与\
  \ Angular 14 前端开发的集成。\n\n1\\. 在 Visual Studio 中创建 ASP.NET Core 8 项目：\n\n1\\. 打开\
  \ Visual Studio：在你的开发机器上启动 Visual Studio。\n\n2\\. 开始新项目：单击“创建新项目”或导航到“文件” > “新建”\
  \ > “项目”。\n\n3\\. 选择项目模板：在“创建新项目”窗口中，选择“ASP.NET Core Web 应用程序”作为项目类型。单击“下一步”。\n\n\
  4\\. 配置项目：为你的项目提供名称和位置。选择所需的框架（ASP.NET Core 8）和项目类型（如 API 或 Web 应用程序）。单击“创建”。\n\n\
  5\\. 选择模板：在“创建新的 ASP.NET Core Web 应用程序”窗口中，选择“API”模板。确保选择了“ASP.NET Core 8”作为目标框架。\n\
  \n6\\. 配置身份验证（可选）：你可以根据项目要求选择配置身份验证。目前，如果不需要，你可以选择“无身份验证”。\n\n7\\. 创建项目：单击“创建”以基于选定的模板和配置创建\
  \ ASP.NET Core 项目。\n\n2\\. 设置一个简单的 Web API：\n\n项目创建后，你将拥有一个包含 `Controllers`、`Models`\
  \ 和 `Startup.cs` 等文件夹的基本结构。让我们创建一个简单的 Web API 控制器来处理请求。\n\n1\\. 创建控制器：在解决方案资源管理器中右键单击“Controllers”文件夹，然后选择“添加”\
  \ > “控制器”。\n\n2\\. 选择控制器模板：选择“API 控制器 - 空”模板，然后单击“添加”。\n\n3\\. 添加控制器代码：在新创建的控制器文件（例如\
  \ `ValuesController.cs`）中，添加一些示例代码以创建 API 端点。\n\n```csharp\nusing Microsoft.AspNetCore.Mvc;\n\
  using System;\nusing System.Collections.Generic;\n\nnamespace YourNamespace.Controllers\n\
  {\n    [Route(\"api/[controller]\")]\n    [ApiController]\n    public class ValuesController\
  \ : ControllerBase\n    {\n        // GET: api/values\n        [HttpGet]\n     \
  \   public ActionResult<IEnumerable<string>> Get()\n        {\n            return\
  \ new string[] { \"value1\", \"value2\" };\n        }\n\n        // GET api/values/5\n\
  \        [HttpGet(\"{id}\")]\n        public ActionResult<string> Get(int id)\n\
  \        {\n            return \"value\";\n        }\n\n        // POST api/values\n\
  \        [HttpPost]\n        public ActionResult Post([FromBody] string value)\n\
  \        {\n            // Save the value or perform necessary actions\n       \
  \     return Ok();\n        }\n\n        // PUT api/values/5\n        [HttpPut(\"\
  {id}\")]\n        public ActionResult Put(int id, [FromBody] string value)\n   \
  \     {\n            // Update the value with the provided ID\n            return\
  \ Ok();\n        }\n\n        // DELETE api/values/5\n        [HttpDelete(\"{id}\"\
  )]\n        public ActionResult Delete(int id)\n        {\n            // Delete\
  \ the value with the provided ID\n            return Ok();\n        }\n    }\n}\n\
  ```\n\n\n\n4\\. 运行应用程序：使用 Visual Studio 构建并运行你的 ASP.NET Core 应用程序。这将启动开发服务器，允许你测试\
  \ Web API 端点。\n\n3\\. 测试 Web API：\n\n你可以使用 Postman 等工具测试你的 Web API，该工具允许你发送 HTTP\
  \ 请求并检查响应。\n\n1\\. 打开 Postman：在你的机器上启动 Postman。\n\n2\\. 发送 GET 请求：输入你的 Web API 端点的\
  \ URL（例如，`https://localhost:5001/api/values`）并选择 GET 方法。提交请求以查看响应。\n\n3\\. 测试其他端点：尝试使用\
  \ Postman 测试其他端点，如 POST、PUT 和 DELETE。根据需要，在 POST 和 PUT 请求的请求体中提供适当的数据。\n\n4\\. 与\
  \ Angular 14 集成（可选）：如果你正在将 ASP.NET Core Web API 与 Angular 前端集成，你可以从 Angular 应用程序发出\
  \ HTTP 请求以从 API 获取数据。\n\n1\\. 创建 Angular 服务：\n\n在你的 Angular 项目中，创建一个服务来处理 HTTP 请求。例如，创建一个名为\
  \ `ApiService` 的服务。\n\n```typescript\nimport { Injectable } from '@angular/core';\n\
  import { HttpClient } from '@angular/common/http';\nimport { Observable } from 'rxjs';\n\
  \n@Injectable({\n  providedIn: 'root'\n})\nexport class ApiService {\n  apiUrl =\
  \ 'https://localhost:5001/api/values'; // 根据你的 API 更新 URL\n\n  constructor(private\
  \ http: HttpClient) { }\n\n  getValues(): Observable<string[]> {\n    return this.http.get<string[]>(this.apiUrl);\n\
  \  }\n\n  // 根据需要实现其他 HTTP 方法（POST、PUT、DELETE）\n}\n```\n\n2\\. 在组件中使用服务：在需要发出 API\
  \ 请求的 Angular 组件中注入 `ApiService`。\n\n```typescript\nimport { Component, OnInit }\
  \ from '@angular/core';\nimport { ApiService } from './api.service';\n\n@Component({\n\
  \  selector: 'app-root',\n  templateUrl: './app.component.html',\n  styleUrls: ['./app.component.css']\n\
  })\nexport class AppComponent implements OnInit {\n  values: string[] = [];\n\n\
  \  constructor(private apiService: ApiService) {}\n\n  ngOnInit(): void {\n    this.apiService.getValues().subscribe(data\
  \ => {\n      this.values = data;\n    });\n  }\n}\n```\n\n3\\. 在 Angular 模板中显示数据：使用\
  \ Angular 的数据绑定在组件的 HTML 模板中显示获取的数据。\n\n```html\n<h1>Values from API:</h1>\n<ul>\n\
  \  <li *ngFor=\"let value of values\">{{ value }}</li>\n</ul>\n```\n\n4\\. 运行 Angular\
  \ 应用程序：构建并运行你的 Angular 应用程序（`ng serve`），以查看从 ASP.NET Core Web API 获取的数据在前端显示。\n\n\
  在 Visual Studio 中创建 ASP.NET Core 8 Web API 涉及设置项目、创建带有 API 端点的控制器，以及使用 Postman 等工具测试\
  \ API。与 Angular 14（或任何前端框架）的集成允许你构建一个全栈应用程序，其中前端与后端 API 通信以获取和操作数据。这种方法使你能够开发可扩展且交互式的\
  \ Web 应用程序，并在前端和后端功能之间实现清晰的关注点分离。\n\n理解控制器和路由\n\n理解控制器和路由是使用 ASP.NET Core 8 作为后端和\
  \ Angular 14 作为前端构建 Web 应用程序的基础。ASP.NET Core 中的控制器处理传入的 HTTP 请求并生成响应，而路由将 URL 映射到特定的控制器操作。让我们通过\
  \ ASP.NET Core 和 Angular 的代码示例来深入探讨这些概念。\n\n1\\. ASP.NET Core 8 中的控制器：ASP.NET Core\
  \ 中的控制器是处理传入 HTTP 请求并返回适当响应的类。它们负责处理客户端请求、从模型或服务访问数据，并返回视图或数据作为响应。\n\n以下是一个简单的 ASP.NET\
  \ Core 控制器示例：\n\n```csharp\nusing Microsoft.AspNetCore.Mvc;\nusing System.Collections.Generic;\n\
  \nnamespace MyApp.Controllers\n{\n    [ApiController]\n    [Route(\"api/[controller]\"\
  )]\n    public class ProductsController : ControllerBase\n    {\n        private\
  \ readonly IProductService _productService;\n\n        public ProductsController(IProductService\
  \ productService)\n        {\n            _productService = productService;\n  \
  \      }\n\n        [HttpGet]\n        public IEnumerable<Product> GetAllProducts()\n\
  \        {\n            return _productService.GetAllProducts();\n        }\n\n\
  \        [HttpGet(\"{id}\")]\n        public IActionResult GetProductById(int id)\n\
  \        {\n            var product = _productService.GetProductById(id);\n    \
  \        if (product == null)\n            {\n                return NotFound();\n\
  \            }\n            return Ok(product);\n        }\n\n        [HttpPost]\n\
  \        public IActionResult CreateProduct([FromBody] Product product)\n      \
  \  {\n            _productService.AddProduct(product);\n            return CreatedAtAction(nameof(GetProductById),\
  \ new { id = product.Id }, product);\n        }\n\n        [HttpPut(\"{id}\")]\n\
  \        public IActionResult UpdateProduct(int id, [FromBody] Product product)\n\
  \        {\n            var existingProduct = _productService.GetProductById(id);\n\
  \            if (existingProduct == null)\n            {\n                return\
  \ NotFound();\n            }\n            existingProduct.Name = product.Name;\n\
  \            existingProduct.Price = product.Price;\n            _productService.UpdateProduct(existingProduct);\n\
  \            return NoContent();\n        }\n\n        [HttpDelete(\"{id}\")]\n\
  \        public IActionResult DeleteProduct(int id)\n        {\n            var\
  \ existingProduct = _productService.GetProductById(id);\n            if (existingProduct\
  \ == null)\n            {\n                return NotFound();\n            }\n \
  \           _productService.DeleteProduct(id);\n            return NoContent();\n\
  \        }\n    }\n}\n```\n\n在这个示例中，`ProductsController` 处理产品的 CRUD 操作。它定义了各种 HTTP\
  \ 方法（`HttpGet`、`HttpPost`、`HttpPut`、`HttpDelete`），这些方法对应于对产品资源的不同操作。\n\n2\\. ASP.NET\
  \ Core 8 中的路由：ASP.NET Core 中的路由根据 URL 模式将传入的 HTTP 请求映射到特定的控制器操作。它使框架能够确定哪个控制器和操作应该处理每个请求。\n\
  \n路由通常在 `Startup.cs` 文件中使用 `MapControllerRoute` 方法或属性路由进行配置。\n\n以下是在 `Startup.cs`\
  \ 中使用属性路由配置路由的示例：\n\n```csharp\nusing Microsoft.AspNetCore.Builder;\nusing Microsoft.AspNetCore.Hosting;\n\
  using Microsoft.Extensions.DependencyInjection;\nusing Microsoft.Extensions.Hosting;\n\
  \nnamespace MyApp\n{\n    public class Startup\n    {\n        public void ConfigureServices(IServiceCollection\
  \ services)\n        {\n            services.AddControllers();\n        }\n\n  \
  \      public void Configure(IApplicationBuilder app, IWebHostEnvironment env)\n\
  \        {\n            if (env.IsDevelopment())\n            {\n              \
  \  app.UseDeveloperExceptionPage();\n            }\n\n            app.UseRouting();\n\
  \n            app.UseEndpoints(endpoints =>\n            {\n                endpoints.MapControllers();\n\
  \            });\n        }\n    }\n}\n```\n\n在这个示例中，我们通过在 `ConfigureServices` 方法中调用\
  \ `services.AddControllers()` 为控制器启用路由。`UseEndpoints` 中的 `MapControllers` 方法为应用程序设置默认路由。\n\
  \n3\\. Angular 14 中的路由：在 Angular 中，路由用于根据 URL 在不同组件之间导航。Angular 内置的 `RouterModule`\
  \ 提供了强大的路由功能。\n\n以下是在 Angular 中配置路由的示例：\n\n1\\. 创建路由模块：在你的 Angular 项目中为路由创建一个新模块（例如，`app-routing.module.ts`）。\n\
  \n```typescript\nimport { NgModule } from '@angular/core';\nimport { RouterModule,\
  \ Routes } from '@angular/router';\nimport { HomeComponent } from './home/home.component';\n\
  import { ProductsComponent } from './products/products.component';\n\nconst routes:\
  \ Routes = [\n  { path: '', component: HomeComponent },\n  { path: 'products', component:\
  \ ProductsComponent }\n];\n\n@NgModule({\n  imports: [RouterModule.forRoot(routes)],\n\
  \  exports: [RouterModule]\n})\nexport class AppRoutingModule { }\n```\n\n2\\. 使用路由器出口：在你的主\
  \ `app.component.html` 中，使用 `<router-outlet></router-outlet>` 标签根据路由渲染组件。\n\n```html\n\
  <router-outlet></router-outlet>\n```\n\n3\\. 定义组件：为不同的视图或页面创建 Angular 组件（例如，`home.component.ts`、`products.component.ts`）。\n\
  \n\n\n4\\. 在路由间导航：使用 Angular 的 `Router` 服务或 HTML 模板中的 `routerLink` 指令，通过编程方式或用户交互在路由间导航。\n\
  \n```typescript\nimport { Component } from '@angular/core';\nimport { Router } from\
  \ '@angular/router';\n\n@Component({\n  selector: 'app-navbar',\n  templateUrl:\
  \ './navbar.component.html'\n})\nexport class NavbarComponent {\n  constructor(private\
  \ router: Router) {}\n\n  navigateToProducts() {\n    this.router.navigate(['/products']);\n\
  \  }\n}\n```\n\n```html\n<button (click)=\"navigateToProducts()\">前往产品页</button>\n\
  ```\n\nASP.NET Core 中的控制器处理 HTTP 请求，并根据定义的操作生成响应，而路由则将 URL 映射到特定的控制器操作。在 Angular\
  \ 中，路由支持基于 URL 在组件之间导航。理解这些概念并正确实现它们，对于构建使用 ASP.NET Core 8 作为后端、Angular 14 作为前端的健壮\
  \ Web 应用程序至关重要。\n\n## 使用 ASP.NET Core MVC 处理 HTTP 请求和响应\n\n处理 HTTP 请求和响应是使用 ASP.NET\
  \ Core MVC 作为后端、Angular 14 作为前端构建 Web 应用程序的核心方面。在本指南中，我们将探讨如何在 ASP.NET Core MVC\
  \ 应用程序中处理各种类型的 HTTP 请求（`GET`、`POST`、`PUT`、`DELETE`）和响应，并将其与 Angular 14 前端集成。\n\n\
  ### 1. 设置 ASP.NET Core MVC 项目\n\n首先，让我们在 Visual Studio 中创建一个 ASP.NET Core MVC 项目，并设置必要的控制器、模型和视图。\n\
  \n1.  **创建 ASP.NET Core MVC 项目**：打开 Visual Studio，创建一个新的 ASP.NET Core Web 应用程序项目。选择模板\
  \ \"ASP.NET Core Web App (Model-View-Controller)\"。\n2.  **添加模型类**：创建一个模型类来表示你的数据。作为示例，我们来生成一个\
  \ `Product` 模型：\n\n```csharp\npublic class Product\n{\n    public int Id { get;\
  \ set; }\n    public string Name { get; set; }\n    public decimal Price { get;\
  \ set; }\n}\n```\n\n3.  **创建控制器**：添加一个控制器来处理与产品相关的 HTTP 请求。右键单击 `Controllers` 文件夹，添加一个名为\
  \ `ProductsController` 的新控制器。\n\n```csharp\nusing Microsoft.AspNetCore.Mvc;\nusing\
  \ System.Collections.Generic;\nusing System.Linq;\n\nnamespace MyApp.Controllers\n\
  {\n    [ApiController]\n    [Route(\"api/[controller]\")]\n    public class ProductsController\
  \ : ControllerBase\n    {\n        private static List<Product> _products = new\
  \ List<Product>\n        {\n            new Product { Id = 1, Name = \"Product 1\"\
  , Price = 10.99m },\n            new Product { Id = 2, Name = \"Product 2\", Price\
  \ = 20.39m }\n        };\n\n        [HttpGet]\n        public IActionResult GetProducts()\n\
  \        {\n            return Ok(_products);\n        }\n\n        [HttpGet(\"\
  {id}\")]\n        public IActionResult GetProductById(int id)\n        {\n     \
  \       var product = _products.FirstOrDefault(p => p.Id == id);\n            if\
  \ (product == null)\n            {\n                return NotFound();\n       \
  \     }\n            return Ok(product);\n        }\n\n        [HttpPost]\n    \
  \    public IActionResult CreateProduct([FromBody] Product product)\n        {\n\
  \            product.Id = _products.Count + 1;\n            _products.Add(product);\n\
  \            return CreatedAtAction(nameof(GetProductById), new { id = product.Id\
  \ }, product);\n        }\n\n        [HttpPut(\"{id}\")]\n        public IActionResult\
  \ UpdateProduct(int id, [FromBody] Product product)\n        {\n            var\
  \ existingProduct = _products.FirstOrDefault(p => p.Id == id);\n            if (existingProduct\
  \ == null)\n            {\n                return NotFound();\n            }\n \
  \           existingProduct.Name = product.Name;\n            existingProduct.Price\
  \ = product.Price;\n            return NoContent();\n        }\n\n        [HttpDelete(\"\
  {id}\")]\n        public IActionResult DeleteProduct(int id)\n        {\n      \
  \      var existingProduct = _products.FirstOrDefault(p => p.Id == id);\n      \
  \      if (existingProduct == null)\n            {\n                return NotFound();\n\
  \            }\n            _products.Remove(existingProduct);\n            return\
  \ NoContent();\n        }\n    }\n}\n```\n\n### 2. 在 ASP.NET Core MVC 中处理 HTTP 请求和响应\n\
  \n现在我们已经设置好了带有 `ProductsController` 的 ASP.NET Core MVC 项目，让我们来理解每种 HTTP 方法是如何被处理的。\n\
  \n*   **GET 请求**：`GetProducts` 方法处理 `GET` 请求以检索所有产品，而 `GetProductById` 处理 `GET`\
  \ 请求以通过 ID 检索特定产品。\n*   **POST 请求**：`CreateProduct` 方法处理 `POST` 请求以创建新产品。产品详情在请求体（`[FromBody]`）中接收。\n\
  *   **PUT 请求**：`UpdateProduct` 方法处理 `PUT` 请求以更新现有产品。它期望在 URL 中提供产品 ID，并在请求体中提供更新后的产品详情。\n\
  *   **DELETE 请求**：`DeleteProduct` 方法处理 `DELETE` 请求以通过 ID 删除产品。\n\n### 3. 与 Angular\
  \ 14 前端集成\n\n让我们将 ASP.NET Core MVC 后端与 Angular 14 前端集成，以演示如何从客户端处理 HTTP 请求和响应。\n\
  \n1.  **创建 Angular 服务**：在你的 Angular 项目中，创建一个服务来处理对 ASP.NET Core API 的 HTTP 请求。\n\
  \n```typescript\nimport { Injectable } from '@angular/core';\nimport { HttpClient\
  \ } from '@angular/common/http';\nimport { Observable } from 'rxjs';\nimport { Product\
  \ } from './product.model';\n\n@Injectable({\n  providedIn: 'root'\n})\nexport class\
  \ ProductService {\n  private apiUrl = 'https://localhost:5001/api/products'; //\
  \ 根据你的 API 更新 URL\n\n  constructor(private http: HttpClient) { }\n\n  getProducts():\
  \ Observable<Product[]> {\n    return this.http.get<Product[]>(this.apiUrl);\n \
  \ }\n\n  getProductById(id: number): Observable<Product> {\n    return this.http.get<Product>(`${this.apiUrl}/${id}`);\n\
  \  }\n\n  createProduct(product: Product): Observable<Product> {\n    return this.http.post<Product>(this.apiUrl,\
  \ product);\n  }\n\n  updateProduct(id: number, product: Product): Observable<Product>\
  \ {\n    return this.http.put<Product>(`${this.apiUrl}/${id}`, product);\n  }\n\n\
  \  deleteProduct(id: number): Observable<void> {\n    return this.http.delete<void>(`${this.apiUrl}/${id}`);\n\
  \  }\n}\n```\n\n2.  **在 Angular 组件中使用服务**：在需要发起 API 请求的 Angular 组件中注入 `ProductService`。\n\
  \n```typescript\nimport { Component, OnInit } from '@angular/core';\nimport { ProductService\
  \ } from './product.service';\nimport { Product } from './product.model';\n\n@Component({\n\
  \  selector: 'app-products',\n  templateUrl: './products.component.html'\n})\nexport\
  \ class ProductsComponent implements OnInit {\n  products: Product[] = [];\n\n \
  \ constructor(private productService: ProductService) {}\n\n  ngOnInit(): void {\n\
  \    this.productService.getProducts().subscribe(data => {\n      this.products\
  \ = data;\n    });\n  }\n}\n```\n\n3.  **在 Angular 模板中显示数据**：使用 Angular 的数据绑定在组件的\
  \ HTML 模板中显示获取的数据。\n\n```html\n<h1>产品列表</h1>\n<ul>\n  <li *ngFor=\"let product of\
  \ products\">\n    {{ product.id }} - {{ product.name }} - ${{ product.price }}\n\
  \  </li>\n</ul>\n```\n\n4.  **添加创建产品功能**：在你想要创建产品的 Angular 组件中，实现调用 `ProductService`\
  \ 的 `createProduct` 方法的逻辑。\n\n```typescript\nimport { Component } from '@angular/core';\n\
  import { ProductService } from './product.service';\nimport { Product } from './product.model';\n\
  \n@Component({\n  selector: 'app-product-form',\n  templateUrl: './product-form.component.html'\n\
  })\nexport class ProductFormComponent {\n  newProduct: Product = { id: 0, name:\
  \ '', price: 0 };\n\n  constructor(private productService: ProductService) {}\n\n\
  \  createProduct() {\n    this.productService.createProduct(this.newProduct).subscribe(()\
  \ => {\n      // 刷新产品列表或根据需要执行其他操作\n      this.newProduct = { id: 0, name: '', price:\
  \ 0 }; // 创建后清空表单\n    });\n  }\n}\n```\n\n5.  **添加更新产品功能**：类似地，在你的 Angular 组件中实现更新产品的逻辑。\n\
  \n\n\n\n## Angular 组件：产品编辑\n\n```typescript\nimport { Component } from '@angular/core';\n\
  import { ProductService } from './product.service';\nimport { Product } from './product.model';\n\
  \n@Component({\n  selector: 'app-product-edit',\n  templateUrl: './product-edit.component.html'\n\
  })\nexport class ProductEditComponent {\n  selectedProduct: Product | null = null;\n\
  \n  constructor(private productService: ProductService) {}\n\n  editProduct(product:\
  \ Product) {\n    this.selectedProduct = { ...product }; // 创建副本以避免直接修改\n  }\n\n\
  \  updateProduct() {\n    if (this.selectedProduct) {\n      this.productService.updateProduct(this.selectedProduct.id,\
  \ this.selectedProduct).subscribe(() => {\n        // 刷新产品列表或根据需要执行其他操作\n      \
  \  this.selectedProduct = null; // 更新后清除选择\n      });\n    }\n  }\n}\n```\n\n##\
  \ 6. 添加删除产品功能\n\n最后，在你的 Angular 组件中添加删除产品的功能。\n\n```typescript\nimport { Component\
  \ } from '@angular/core';\nimport { ProductService } from './product.service';\n\
  import { Product } from './product.model';\n\n@Component({\n  selector: 'app-product-list',\n\
  \  templateUrl: './product-list.component.html'\n})\nexport class ProductListComponent\
  \ {\n  products: Product[] = [];\n\n  constructor(private productService: ProductService)\
  \ {}\n\n  deleteProduct(id: number) {\n    this.productService.deleteProduct(id).subscribe(()\
  \ => {\n      // 刷新产品列表或根据需要执行其他操作\n    });\n  }\n}\n```\n\n现在，让我们看看如何在 Angular\
  \ 模板中使用这些功能。\n\n## Angular 模板\n\n### 1. 显示产品\n\n使用 Angular 的数据绑定在组件的 HTML 模板 (`products.component.html`)\
  \ 中显示产品。\n\n```html\n<h1>产品</h1>\n<ul>\n  <li *ngFor=\"let product of products\"\
  >\n    {{ product.id }} - {{ product.name }} - ${{ product.price }}\n    <button\
  \ (click)=\"editProduct(product)\">编辑</button>\n    <button (click)=\"deleteProduct(product.id)\"\
  >删除</button>\n  </li>\n</ul>\n```\n\n### 2. 创建产品表单\n\n创建一个表单来添加新产品 (`product-form.component.html`)。\n\
  \n```html\n<h2>创建产品</h2>\n<form (submit)=\"createProduct()\">\n  <input type=\"\
  text\" [(ngModel)]=\"newProduct.name\" placeholder=\"产品名称\" required>\n  <input\
  \ type=\"number\" [(ngModel)]=\"newProduct.price\" placeholder=\"价格\" required>\n\
  \  <button type=\"submit\">添加产品</button>\n</form>\n```\n\n### 3. 编辑产品表单\n\n创建一个表单来编辑现有产品\
  \ (`product-edit.component.html`)。\n\n```html\n<h2>编辑产品</h2>\n<form (submit)=\"\
  updateProduct()\">\n  <input type=\"text\" [(ngModel)]=\"selectedProduct.name\"\
  \ placeholder=\"产品名称\" required>\n  <input type=\"number\" [(ngModel)]=\"selectedProduct.price\"\
  \ placeholder=\"价格\" required>\n  <button type=\"submit\">更新产品</button>\n</form>\n\
  ```\n\n有了这些模板和组件功能，你就拥有了一个完整的 Angular 应用程序，它可以与你的 ASP.NET Core MVC 后端交互，处理与产品相关的\
  \ HTTP 请求和响应。这种设置允许你在前端和后端之间无缝执行 CRUD 操作，提供全面的用户体验。\n\n## 第 4 章：在 ASP.NET Core 8\
  \ 中处理数据\n\n### Entity Framework Core 8 数据库访问简介\n\nEntity Framework Core 8 (`EF Core`)\
  \ 是微软为 .NET 应用程序开发的一个现代对象关系映射器 (ORM) 框架。它提供了一种便捷高效的方式，使用面向对象编程技术与数据库交互，从而减少了数据访问任务所需的样板代码量。在本指南中，我们将介绍\
  \ `EF Core` 8，并演示如何在具有 Angular 14 前端的 ASP.NET Core 8 后端应用程序中使用它。\n\n### 1. EF Core\
  \ 8 入门\n\n要在 ASP.NET Core 8 应用程序中使用 `EF Core` 8，你需要设置必要的依赖项并配置数据上下文。\n\n#### 1.1\
  \ 安装 EF Core 包\n\n首先，在你的 ASP.NET Core 项目中安装 Entity Framework Core 包。打开 NuGet 包管理器控制台并运行以下命令：\n\
  \n```bash\nInstall-Package Microsoft.EntityFrameworkCore.SqlServer\n```\n\n此命令安装\
  \ `EF Core` SQL Server 提供程序，该程序允许 `EF Core` 与 SQL Server 数据库通信。\n\n### 1.2 创建数据模型\n\
  \n通过创建表示数据库表的 C# 类来定义你的数据模型。例如，让我们创建一个 `Product` 类：\n\n```csharp\npublic class Product\n\
  {\n    public int Id { get; set; }\n    public string Name { get; set; }\n    public\
  \ decimal Price { get; set; }\n}\n```\n\n#### 1.3 创建 DbContext\n\n`EF Core` 中的 `DbContext`\
  \ 类表示数据库会话，并允许你查询和保存数据模型的实例。构建一个派生自 `DbContext` 的类：\n\n```csharp\npublic class ApplicationDbContext\
  \ : DbContext\n{\n    public ApplicationDbContext(DbContextOptions<ApplicationDbContext>\
  \ options)\n        : base(options)\n    {\n    }\n\n    public DbSet<Product> Products\
  \ { get; set; }\n}\n```\n\n#### 1.4 在 Startup 中配置 DbContext\n\n在 `Startup.cs` 文件中，配置\
  \ `DbContext` 并指定数据库的连接字符串：\n\n```csharp\npublic void ConfigureServices(IServiceCollection\
  \ services)\n{\n    services.AddDbContext<ApplicationDbContext>(options =>\n   \
  \     options.UseSqlServer(Configuration.GetConnectionString(\"DefaultConnection\"\
  )));\n\n    // 其他服务配置\n}\n```\n\n确保你在 `appsettings.json` 文件中指定了连接字符串：\n\n```json\n\
  \"ConnectionStrings\": {\n    \"DefaultConnection\": \"Server=localhost;Database=YourDatabaseName;User=YourUsername;Password=YourPassword;\"\
  \n}\n```\n\n### 2. 在控制器中使用 EF Core\n\n现在你已经在 ASP.NET Core 应用程序中设置了 `EF Core`，你可以在控制器中使用它来执行数据库操作。\n\
  \n#### 2.1 将 DbContext 注入控制器\n\n使用依赖注入将 `ApplicationDbContext` 注入到你的控制器中：\n\n```csharp\n\
  public class ProductsController : ControllerBase\n{\n    private readonly ApplicationDbContext\
  \ _context;\n\n    public ProductsController(ApplicationDbContext context)\n   \
  \ {\n        _context = context;\n    }\n\n    // 控制器操作\n}\n```\n\n#### 2.2 执行 CRUD\
  \ 操作\n\n你现在可以使用 LINQ 查询和 `EF Core` 方法来执行 CRUD 操作。以下是一些示例：\n\n- **检索产品：**\n\n```csharp\n\
  [HttpGet]\npublic IActionResult GetProducts()\n{\n    var products = _context.Products.ToList();\n\
  \    return Ok(products);\n}\n```\n\n- **创建产品：**\n\n```csharp\n[HttpPost]\npublic\
  \ IActionResult CreateProduct([FromBody] Product product)\n{\n    _context.Products.Add(product);\n\
  \    _context.SaveChanges();\n    return CreatedAtAction(nameof(GetProductById),\
  \ new { id = product.Id }, product);\n}\n```\n\n- **更新产品：**\n\n```csharp\n[HttpPut(\"\
  {id}\")]\npublic IActionResult UpdateProduct(int id, [FromBody] Product product)\n\
  {\n    var existingProduct = _context.Products.FirstOrDefault(p => p.Id == id);\n\
  \    if (existingProduct == null)\n    {\n        return NotFound();\n    }\n\n\
  \    existingProduct.Name = product.Name;\n    existingProduct.Price = product.Price;\n\
  \    _context.SaveChanges();\n    return NoContent();\n}\n```\n\n- **删除产品：**\n\n\
  ```csharp\n[HttpDelete(\"{id}\")]\npublic IActionResult DeleteProduct(int id)\n\
  {\n    var product = _context.Products.Find(id);\n    if (product == null)\n   \
  \ {\n        return NotFound();\n    }\n\n    _context.Products.Remove(product);\n\
  \    _context.SaveChanges();\n    return NoContent();\n}\n```\n\n### 3. 将 EF Core\
  \ 与 Angular 14 结合使用\n\n要将 `EF Core` 与前端的 Angular 14 集成，你通常使用 HTTP 请求与你的 ASP.NET\
  \ Core API 端点进行通信。\n\n#### 3.1 Angular HTTP 服务\n\n创建一个 Angular 服务来处理对你的 ASP.NET\
  \ Core API 的 HTTP 请求：\n\n\n\n\n# 建模数据实体与关系\n\n建模数据实体与关系是设计数据库驱动应用程序的关键环节。在本指南中，我们将探讨如何在\
  \ ASP.NET Core 8 后端应用中使用 Entity Framework Core 8 来建模数据实体与关系，并将其与 Angular 14 前端集成。\n\
  \n## 1. 在 ASP.NET Core 8 中定义数据实体\n\n数据实体代表映射到数据库表的对象。通过 Entity Framework Core，你可以将这些实体定义为\
  \ C#类，而 EF Core 会处理与底层数据库表的映射。\n\n让我们以一个电子商务应用为例，其中包含`Product`和`Category`等实体。\n\n\
  ### 1.1 创建数据模型类\n\n在 ASP.NET Core 项目中定义你的数据模型类。例如：\n\n```csharp\npublic class Product\n\
  {\n    public int Id { get; set; }\n    public string Name { get; set; }\n    public\
  \ decimal Price { get; set; }\n    // Category 的导航属性\n    public int CategoryId\
  \ { get; set; }\n    public Category Category { get; set; }\n}\n\npublic class Category\n\
  {\n    public int Id { get; set; }\n    public string Name { get; set; }\n    //\
  \ Products 的导航属性\n    public List<Product> Products { get; set; }\n}\n```\n\n在此示例中，`Product`类有一个导航属性`Category`，表示产品与类别之间的关系。类似地，`Category`类有一个产品集合。\n\
  \n### 1.2 DbContext 配置\n\n更新你的`DbContext`类以包含这些实体：\n\n```csharp\npublic class ApplicationDbContext\
  \ : DbContext\n{\n    public ApplicationDbContext(DbContextOptions<ApplicationDbContext>\
  \ options)\n        : base(options)\n    {\n    }\n\n    public DbSet<Product> Products\
  \ { get; set; }\n    public DbSet<Category> Categories { get; set; }\n\n    protected\
  \ override void OnModelCreating(ModelBuilder modelBuilder)\n    {\n        // 配置关系\n\
  \        modelBuilder.Entity<Product>()\n            .HasOne(p => p.Category)\n\
  \            .WithMany(c => c.Products)\n            .HasForeignKey(p => p.CategoryId);\n\
  \    }\n}\n```\n\n`OnModelCreating`方法用于配置实体之间的关系。\n\n## 2. 与 Angular 14 前端集成\n\n\
  在 ASP.NET Core 后端建模好数据实体后，你可以将其与 Angular 14 前端集成，以获取和显示数据。\n\n### 2.1 Angular 模型\n\
  \n在你的 Angular 项目中创建相应的 TypeScript 模型来表示数据实体。例如：\n\n```typescript\nexport interface\
  \ Product {\n    id: number;\n    name: string;\n    price: number;\n    categoryId:\
  \ number;\n    category: Category;\n}\n\nexport interface Category {\n    id: number;\n\
  \    name: string;\n    products: Product[];\n}\n```\n\n### 2.2 Angular 服务\n\n修改你的\
  \ Angular 服务，以便从 ASP.NET Core API 端点获取数据：\n\n```typescript\nimport { Injectable\
  \ } from '@angular/core';\nimport { HttpClient } from '@angular/common/http';\n\
  import { Observable } from 'rxjs';\nimport { Product, Category } from './models';\n\
  \n@Injectable({\n    providedIn: 'root'\n})\nexport class DataService {\n    private\
  \ apiUrl = 'https://localhost:5001/api'; // API 端点 URL\n\n    constructor(private\
  \ http: HttpClient) { }\n\n    getProducts(): Observable<Product[]> {\n        return\
  \ this.http.get<Product[]>(`${this.apiUrl}/products`);\n    }\n\n    getCategories():\
  \ Observable<Category[]> {\n        return this.http.get<Category[]>(`${this.apiUrl}/categories`);\n\
  \    }\n\n    // 根据需要添加其他 CRUD 方法\n}\n```\n\n### 2.3 Angular 组件使用\n\n在你的 Angular\
  \ 组件中，使用数据服务来获取和显示数据：\n\n```typescript\nimport { Component, OnInit } from '@angular/core';\n\
  import { DataService } from './data.service';\nimport { Product, Category } from\
  \ './models';\n\n@Component({\n    selector: 'app-product-list',\n    templateUrl:\
  \ './product-list.component.html'\n})\nexport class ProductListComponent implements\
  \ OnInit {\n    products: Product[] = [];\n\n    constructor(private dataService:\
  \ DataService) { }\n\n    ngOnInit(): void {\n        this.dataService.getProducts().subscribe(products\
  \ => {\n            this.products = products;\n        });\n    }\n}\n```\n\n###\
  \ 2.4 在 Angular 模板中显示数据\n\n使用 Angular 的数据绑定在组件模板中显示数据：\n\n```html\n<h1>Products</h1>\n\
  <ul>\n    <li *ngFor=\"let product of products\">\n        {{ product.name }} -\
  \ ${{ product.price }} - Category: {{ product.category.name }}\n    </li>\n</ul>\n\
  ```\n\n在 ASP.NET Core 8 中使用 Entity Framework Core 8 建模数据实体与关系，为数据库设计提供了一种结构化的方法。通过定义实体、配置关系并与\
  \ Angular 14 前端集成，你可以创建一个强大的应用程序，高效地管理和显示数据。后端与前端之间的这种关注点分离有助于构建可扩展且易于维护的 Web 应用程序。\n\
  \n# 使用 Web API 创建 CRUD 操作（创建、读取、更新、删除）\n\n使用 Web API 创建 CRUD（创建、读取、更新、删除）操作是构建现代\
  \ Web 应用程序的基本方面。在本指南中，我们将演示如何使用 ASP.NET Core 8 实现后端 API 的 CRUD 操作，并将其与 Angular 14\
  \ 前端集成。\n\n## 1. 设置 ASP.NET Core Web API\n\n首先，让我们设置一个 ASP.NET Core Web API 项目，以处理示例实体（如`Product`）的\
  \ CRUD 操作。\n\n### 1.1 创建 ASP.NET Core Web API 项目\n\n打开 Visual Studio 并创建一个新的 ASP.NET\
  \ Core Web API 项目。\n\n### 1.2 创建数据模型\n\n为你的实体（例如`Product`）定义一个数据模型类：\n\n```csharp\n\
  public class Product\n{\n    public int Id { get; set; }\n    public string Name\
  \ { get; set; }\n    public decimal Price { get; set; }\n}\n```\n\n### 1.3 创建控制器\n\
  \n添加一个控制器来处理`Product`实体的 CRUD 操作。右键单击`Controllers`文件夹，添加一个名为`ProductsController`的新控制器。\n\
  \n## 2. 在 Angular 组件中使用 API\n\n将`ProductService`注入到你的 Angular 组件中，以获取和操作数据：\n\n\
  ```typescript\nimport { Component, OnInit } from '@angular/core';\nimport { ProductService\
  \ } from './product.service';\nimport { Product } from './product.model';\n\n@Component({\n\
  \    selector: 'app-product-list',\n    templateUrl: './product-list.component.html'\n\
  })\nexport class ProductListComponent implements OnInit {\n    products: Product[]\
  \ = [];\n\n    constructor(private productService: ProductService) {}\n\n    ngOnInit():\
  \ void {\n        this.productService.getProducts().subscribe(data => {\n      \
  \      this.products = data;\n        });\n    }\n}\n```\n\n## 3. 在 Angular 模板中显示数据\n\
  \n使用 Angular 的数据绑定在组件模板中显示从 API 检索到的数据。\n\n```html\n<h1>Products</h1>\n<ul>\n  \
  \  <li *ngFor=\"let product of products\">\n        {{ product.id }} - {{ product.name\
  \ }} - ${{ product.price }}\n    </li>\n</ul>\n```\n\nEntity Framework Core 8 通过提供高级\
  \ ORM 框架，简化了 ASP.NET Core 8 应用程序中的数据库访问。按照上述步骤，你可以有效地将 EF Core 与你的 ASP.NET Core\
  \ 后端和 Angular 14 前端集成，以执行 CRUD 操作并无缝管理数据。这种方法提高了 Web 应用程序开发的生产力和可维护性。\n\n\n\n# ASP.NET\
  \ Core 8 与 Angular 14 的 CRUD 操作与身份验证\n\n## 1. ASP.NET Core Web API 控制器\n\n```csharp\n\
  [ApiController]\n[Route(\"api/[controller]\")]\npublic class ProductsController\
  \ : ControllerBase\n{\n    private static List<Product> _products = new List<Product>\n\
  \    {\n        new Product { Id = 1, Name = \"Product 1\", Price = 10.99m },\n\
  \        new Product { Id = 2, Name = \"Product 2\", Price = 20.39m }\n    };\n\n\
  \    [HttpGet]\n    public IActionResult GetProducts()\n    {\n        return Ok(_products);\n\
  \    }\n\n    [HttpGet(\"{id}\")]\n    public IActionResult GetProductById(int id)\n\
  \    {\n        var product = _products.FirstOrDefault(p => p.Id == id);\n     \
  \   if (product == null)\n        {\n            return NotFound();\n        }\n\
  \        return Ok(product);\n    }\n\n    [HttpPost]\n    public IActionResult\
  \ CreateProduct([FromBody] Product product)\n    {\n        product.Id = _products.Count\
  \ + 1;\n        _products.Add(product);\n        return CreatedAtAction(nameof(GetProductById),\
  \ new { id = product.Id }, product);\n    }\n\n    [HttpPut(\"{id}\")]\n    public\
  \ IActionResult UpdateProduct(int id, [FromBody] Product product)\n    {\n     \
  \   var existingProduct = _products.FirstOrDefault(p => p.Id == id);\n        if\
  \ (existingProduct == null)\n        {\n            return NotFound();\n       \
  \ }\n        existingProduct.Name = product.Name;\n        existingProduct.Price\
  \ = product.Price;\n        return NoContent();\n    }\n\n    [HttpDelete(\"{id}\"\
  )]\n    public IActionResult DeleteProduct(int id)\n    {\n        var existingProduct\
  \ = _products.FirstOrDefault(p => p.Id == id);\n        if (existingProduct == null)\n\
  \        {\n            return NotFound();\n        }\n        _products.Remove(existingProduct);\n\
  \        return NoContent();\n    }\n}\n```\n\n在此控制器中：\n- `GetProducts`: 检索所有产品。\n\
  - `GetProductById`: 通过 ID 检索产品。\n- `CreateProduct`: 创建新产品。\n- `UpdateProduct`: 更新现有产品。\n\
  - `DeleteProduct`: 通过 ID 删除产品。\n\n## 2. 在 Angular 14 中使用 Web API\n\n接下来，我们将 ASP.NET\
  \ Core Web API 与 Angular 14 前端集成，以执行 CRUD 操作。\n\n### 2.1 用于 API 调用的 Angular 服务\n\
  \n在你的 Angular 项目中创建一个服务，使用 Angular 的 `HttpClient` 模块处理 API 调用。\n\n```typescript\n\
  import { Injectable } from '@angular/core';\nimport { HttpClient } from '@angular/common/http';\n\
  import { Observable } from 'rxjs';\nimport { Product } from './product.model';\n\
  \n@Injectable({\n  providedIn: 'root'\n})\nexport class ProductService {\n  private\
  \ apiUrl = 'https://localhost:5001/api/products'; // API 端点 URL\n\n  constructor(private\
  \ http: HttpClient) { }\n\n  getProducts(): Observable<Product[]> {\n    return\
  \ this.http.get<Product[]>(this.apiUrl);\n  }\n\n  getProductById(id: number): Observable<Product>\
  \ {\n    return this.http.get<Product>(`${this.apiUrl}/${id}`);\n  }\n\n  createProduct(product:\
  \ Product): Observable<Product> {\n    return this.http.post<Product>(this.apiUrl,\
  \ product);\n  }\n\n  updateProduct(id: number, product: Product): Observable<Product>\
  \ {\n    return this.http.put<Product>(`${this.apiUrl}/${id}`, product);\n  }\n\n\
  \  deleteProduct(id: number): Observable<void> {\n    return this.http.delete<void>(`${this.apiUrl}/${id}`);\n\
  \  }\n}\n```\n\n### 2.2 Angular 组件使用\n\n在你的 Angular 组件中使用该服务与 Web API 交互。\n\n```typescript\n\
  import { Component, OnInit } from '@angular/core';\nimport { ProductService } from\
  \ './product.service';\nimport { Product } from './product.model';\n\n@Component({\n\
  \  selector: 'app-product-list',\n  templateUrl: './product-list.component.html'\n\
  })\nexport class ProductListComponent implements OnInit {\n  products: Product[]\
  \ = [];\n\n  constructor(private productService: ProductService) { }\n\n  ngOnInit():\
  \ void {\n    this.loadProducts();\n  }\n\n  loadProducts(): void {\n    this.productService.getProducts().subscribe(products\
  \ => {\n      this.products = products;\n    });\n  }\n\n  deleteProduct(id: number):\
  \ void {\n    if (confirm('Are you certain you wish to remove this product?')) {\n\
  \      this.productService.deleteProduct(id).subscribe(() => {\n        this.loadProducts();\
  \ // 删除后刷新产品列表\n      });\n    }\n  }\n}\n```\n\n### 2.3 用于显示的 Angular 模板\n\n在你的组件模板中使用\
  \ Angular 的数据绑定来显示产品并执行 CRUD 操作。\n\n```html\n<h1>Product List</h1>\n<ul>\n  <li\
  \ *ngFor=\"let product of products\">\n    {{ product.id }} - {{ product.name }}\
  \ - ${{ product.price }}\n    <button (click)=\"deleteProduct(product.id)\">Delete</button>\n\
  \  </li>\n</ul>\n```\n\n## 3. 测试 CRUD 操作\n\n现在你已经设置了后端 API 并将其与 Angular 前端集成，你可以测试\
  \ CRUD 操作：\n- **创建操作**：填写表单以创建新产品，它应被添加到列表中。\n- **读取操作**：查看产品列表，并点击单个产品以查看详细信息。\n\
  - **更新操作**：编辑产品详细信息并保存更改。\n- **删除操作**：点击产品旁边的删除按钮以将其从列表中移除。\n\n确保数据在每个操作中都能在 Angular\
  \ 前端和 ASP.NET Core Web API 后端之间正确流动。\n\n在 ASP.NET Core 8 和 Angular 14 中使用 Web API\
  \ 实现 CRUD 操作，使你能够构建交互式和数据驱动的 Web 应用程序。通过遵循上述步骤，你可以在前端和后端之间无缝地创建、检索、更新和删除数据实体，提供完整的用户体验。这种方法有助于高效的数据管理，并提高应用程序的可扩展性和可维护性。\n\
  \n# 第 5 章：ASP.NET Core 8 中的身份验证与授权\n\n## 使用 IdentityServer 实现用户身份验证\n\n实现用户身份验证对于保护\
  \ Web 应用程序至关重要。在本指南中，我们将逐步介绍如何使用 IdentityServer 与 ASP.NET Core 8 后端 API 实现用户身份验证，并将其与\
  \ Angular 14 前端集成。\n\n### 1. 在 ASP.NET Core 中设置 IdentityServer\n\nIdentityServer\
  \ 是一个流行的 .NET OpenID Connect 和 OAuth 2.0 框架。它为 Web 应用程序提供强大的身份验证和授权功能。\n\n#### 1.1\
  \ 安装 IdentityServer 包\n\n首先，在你的 ASP.NET Core 项目中安装必要的 IdentityServer 包。打开 NuGet\
  \ 包管理器控制台并运行以下命令：\n\n```bash\nInstall-Package IdentityServer4\nInstall-Package IdentityServer4.AspNetIdentity\n\
  ```\n\n#### 1.2 配置 IdentityServer\n\n在你的 ASP.NET Core 应用程序中设置 IdentityServer。修改你的\
  \ `Startup.cs` 文件以包含 IdentityServer 服务并配置身份验证。\n\n```csharp\npublic void ConfigureServices(IServiceCollection\
  \ services)\n{\n    // 其他服务配置\n    services.AddIdentity<ApplicationUser, IdentityRole>()\n\
  \        .AddEntityFrameworkStores<ApplicationDbContext>()\n        .AddDefaultTokenProviders();\n\
  \n    services.AddIdentityServer()\n        .AddApiAuthorization<ApplicationUser,\
  \ ApplicationDbContext>();\n\n    services.AddAuthentication()\n        .AddIdentityServerJwt();\n\
  \n    // 其他配置\n}\n\npublic void Configure(IApplicationBuilder app, IWebHostEnvironment\
  \ env)\n{\n    // 其他应用配置\n    app.UseRouting();\n    app.UseAuthentication();\n\
  \    app.UseAuthorization();\n    app.UseEndpoints(endpoints =>\n    {\n       \
  \ endpoints.MapControllers();\n        endpoints.MapRazorPages();\n        endpoints.MapIdentityServer();\n\
  \    });\n}\n```\n\n#### 1.3 创建用户模型和 DbContext\n\n定义用户模型并更新你的 `DbContext` 以包含用户相关实体。\n\
  \n```csharp\npublic class ApplicationUser : IdentityUser\n{\n    // 如果需要，可添加额外的用户属性\n\
  }\n\npublic class ApplicationDbContext : IdentityDbContext<ApplicationUser>\n{\n\
  \    public ApplicationDbContext(DbContextOptions<ApplicationDbContext> options)\n\
  \        : base(options)\n    {\n    }\n\n    // 如果需要，可添加其他实体的 DbSet\n}\n```\n\n\
  #### 1.4 填充默认用户和角色（可选）\n\n你可以在应用程序启动期间填充默认用户和角色，用于测试目的或初始设置。\n\n#### 1.5 在控制器中启用身份验证\n\
  \n向需要身份验证的控制器或操作添加身份验证属性。\n\n```csharp\n[Authorize]\npublic class ProductsController\
  \ : ControllerBase\n{\n    // 控制器操作\n}\n```\n\n### 2. 在 Angular 14 中集成身份验证\n\n在\
  \ ASP.NET Core 后端设置 IdentityServer 后，你将把身份验证与你的 Angular 14 前端集成。\n\n\n\n\n# Angular\
  \ 认证服务\n\n在你的 Angular 项目中创建一个认证服务，使用 Angular 的 `HttpClient` 模块处理用户认证。\n\n```typescript\n\
  import { Injectable } from '@angular/core';\nimport { HttpClient } from '@angular/common/http';\n\
  import { Observable } from 'rxjs';\n\n@Injectable({\n  providedIn: 'root'\n})\n\
  export class AuthService {\n  private apiUrl = 'https://localhost:5001/api/auth';\
  \ // 认证 API 端点 URL\n\n  constructor(private http: HttpClient) { }\n\n  login(credentials:\
  \ { username: string, password: string }): Observable<any> {\n    return this.http.post<any>(`${this.apiUrl}/login`,\
  \ credentials);\n  }\n\n  logout(): Observable<any> {\n    return this.http.post<any>(`${this.apiUrl}/logout`,\
  \ {});\n  }\n}\n```\n\n# Angular 登录组件\n\n创建一个登录组件，用户可以在其中输入凭据进行认证。\n\n```typescript\n\
  import { Component } from '@angular/core';\nimport { AuthService } from './auth.service';\n\
  \n@Component({\n  selector: 'app-login',\n  templateUrl: './login.component.html'\n\
  })\nexport class LoginComponent {\n  credentials = { username: '', password: ''\
  \ };\n\n  constructor(private authService: AuthService) { }\n\n  login(): void {\n\
  \    this.authService.login(this.credentials).subscribe(response => {\n      //\
  \ 处理登录成功（例如，存储令牌，重定向）\n    }, error => {\n      // 处理登录错误\n    });\n  }\n}\n```\n\
  \n# Angular 登录模板\n\n在你的组件模板（`login.component.html`）中创建一个登录表单。\n\n```html\n<h1>登录</h1>\n\
  <form (submit)=\"login()\">\n  <input type=\"text\" [(ngModel)]=\"credentials.username\"\
  \ placeholder=\"用户名\" required>\n  <input type=\"password\" [(ngModel)]=\"credentials.password\"\
  \ placeholder=\"密码\" required>\n  <button type=\"submit\">登录</button>\n</form>\n\
  ```\n\n# 测试认证流程\n\n现在你已经设置了认证，可以测试认证流程：\n\n- **登录**：在登录表单中输入有效的凭据并提交。后端 API 验证凭据并颁发认证令牌（例如\
  \ JWT）。\n- **授权**：已认证的用户可以通过在请求头中包含认证令牌来访问受保护的路由或 API 端点。\n- **登出**：在你的 UI 中提供一个登出选项，以使认证令牌失效并让用户登出。\n\
  \n确保在你的 Angular 应用程序中处理令牌存储（例如本地存储）、令牌过期和令牌续期，以实现无缝的认证体验。\n\n在 ASP.NET Core 8 中使用\
  \ IdentityServer 实现用户认证，并将其与 Angular 14 前端集成，为 Web 应用程序提供了强大的认证和授权机制。通过遵循上述步骤，你可以保护应用程序的端点并高效地认证用户，从而增强整体安全性和用户体验。\n\
  \n# 使用 JWT（JSON Web 令牌）保护 Web API\n\n确保 Web API 的安全性对于保护敏感数据并保证只有授权用户才能访问特定资源至关重要。JSON\
  \ Web 令牌（JWT）通过生成携带用户信息并在服务器端进行验证的令牌，为保护 API 提供了一种可靠的机制。在本指南中，我们将探讨如何使用 ASP.NET\
  \ Core 8 作为后端 API，并将其与 Angular 14 前端集成，来使用 JWT 保护 Web API。\n\n## 在 ASP.NET Core\
  \ 中设置 JWT 认证\n\nASP.NET Core 通过中间件和服务提供了对 JWT 认证的内置支持。\n\n### 1. 安装 JWT 包\n\n首先，在你的\
  \ ASP.NET Core 项目中安装必要的 JWT 包。打开 NuGet 包管理器控制台并运行以下命令：\n\n```bash\nInstall-Package\
  \ Microsoft.AspNetCore.Authentication.JwtBearer\n```\n\n### 2. 配置 JWT 认证\n\n在你的\
  \ `Startup.cs` 文件中配置 JWT 认证。\n\n```csharp\npublic void ConfigureServices(IServiceCollection\
  \ services)\n{\n    // 其他服务配置\n    services.AddAuthentication(JwtBearerDefaults.AuthenticationScheme)\n\
  \        .AddJwtBearer(options =>\n        {\n            options.TokenValidationParameters\
  \ = new TokenValidationParameters\n            {\n                ValidateIssuer\
  \ = true,\n                ValidateAudience = true,\n                ValidateLifetime\
  \ = true,\n                ValidateIssuerSigningKey = true,\n                ValidIssuer\
  \ = Configuration[\"Jwt:Issuer\"],\n                ValidAudience = Configuration[\"\
  Jwt:Audience\"],\n                IssuerSigningKey = new SymmetricSecurityKey(Encoding.UTF8.GetBytes(Configuration[\"\
  Jwt:SecretKey\"]))\n            };\n        });\n    // 其他配置\n}\n\npublic void Configure(IApplicationBuilder\
  \ app, IWebHostEnvironment env)\n{\n    // 其他应用配置\n    app.UseAuthentication();\n\
  \    app.UseAuthorization();\n    // 其他配置\n}\n```\n\n确保你已在 `appsettings.json` 文件中配置了\
  \ JWT 参数，如颁发者、受众和密钥。\n\n### 3. 生成 JWT 令牌\n\n创建一个服务或控制器方法，在用户成功认证时生成 JWT 令牌。\n\n\
  ```csharp\npublic class AuthController : ControllerBase\n{\n    private readonly\
  \ IConfiguration _configuration;\n\n    public AuthController(IConfiguration configuration)\n\
  \    {\n        _configuration = configuration;\n    }\n\n    [HttpPost(\"login\"\
  )]\n    public IActionResult Login(LoginModel model)\n    {\n        // 验证用户凭据（例如，从数据库）\n\
  \        var isValid = ...; // 你的验证逻辑\n        if (!isValid)\n        {\n      \
  \      return Unauthorized();\n        }\n\n        var token = GenerateJwtToken();\n\
  \        return Ok(new { token });\n    }\n\n    private string GenerateJwtToken()\n\
  \    {\n        var tokenHandler = new JwtSecurityTokenHandler();\n        var key\
  \ = Encoding.ASCII.GetBytes(_configuration[\"Jwt:SecretKey\"]);\n\n        var tokenDescriptor\
  \ = new SecurityTokenDescriptor\n        {\n            Subject = new ClaimsIdentity(new[]\n\
  \            {\n                new Claim(ClaimTypes.Name, \"username\"),\n    \
  \            // 根据需要添加更多声明\n            }),\n            Expires = DateTime.UtcNow.AddDays(1),\
  \ // 令牌过期时间\n            SigningCredentials = new SigningCredentials(new SymmetricSecurityKey(key),\
  \ SecurityAlgorithms.HmacSha256Signature)\n        };\n\n        var token = tokenHandler.CreateToken(tokenDescriptor);\n\
  \        return tokenHandler.WriteToken(token);\n    }\n}\n```\n\n## 在 Angular 14\
  \ 中集成 JWT 认证\n\n在 ASP.NET Core 后端设置好 JWT 认证后，你将把它与你的 Angular 14 前端集成。\n\n### 1.\
  \ Angular 认证服务\n\n修改你在 Angular 中的认证服务，以处理 JWT 令牌存储和带有 JWT 头的 HTTP 请求。\n\n```typescript\n\
  import { Injectable } from '@angular/core';\nimport { HttpClient, HttpHeaders }\
  \ from '@angular/common/http';\nimport { Observable } from 'rxjs';\n\n@Injectable({\n\
  \  providedIn: 'root'\n})\nexport class AuthService {\n  private apiUrl = 'https://localhost:5001/api/auth';\
  \ // 认证 API 端点 URL\n  private authToken: string | null = null;\n\n  constructor(private\
  \ http: HttpClient) { }\n\n  login(credentials: { username: string, password: string\
  \ }): Observable<any> {\n    return this.http.post<any>(`${this.apiUrl}/login`,\
  \ credentials);\n  }\n\n  setAuthToken(token: string): void {\n    this.authToken\
  \ = token;\n    // 将令牌存储在本地存储或会话存储中\n  }\n\n  getAuthToken(): string | null {\n\
  \    // 从本地存储或会话存储中检索令牌\n    return this.authToken;\n  }\n\n  logout(): Observable<any>\
  \ {\n    // 从存储中清除令牌\n    this.authToken = null;\n    return this.http.post<any>(`${this.apiUrl}/logout`,\
  \ {});\n  }\n\n  // 添加方法以在 HTTP 头中包含 JWT 令牌\n  getHeaders(): HttpHeaders {\n   \
  \ const token = this.getAuthToken();\n    if (token) {\n      return new HttpHeaders({\n\
  \        'Authorization': `Bearer ${token}`\n      });\n    }\n    return new HttpHeaders();\n\
  \  }\n}\n```\n\n### 2. 在 API 请求中使用 JWT\n\n更新你的 Angular 服务方法，以便在需要认证的请求的 HTTP 头中包含\
  \ JWT 令牌。\n\n\n\n\n```typescript\nimport { Injectable } from '@angular/core';\n\
  import { HttpClient, HttpHeaders } from '@angular/common/http';\nimport { Observable\
  \ } from 'rxjs';\nimport { AuthService } from './auth.service';\n\n@Injectable({\n\
  \  providedIn: 'root'\n})\nexport class ProductService {\n  private apiUrl = 'https://localhost:5001/api/products';\
  \ // API 端点 URL\n\n  constructor(private http: HttpClient, private authService:\
  \ AuthService) { }\n\n  getProducts(): Observable<Product[]> {\n    const headers\
  \ = this.authService.getHeaders();\n    return this.http.get<Product[]>(this.apiUrl,\
  \ { headers });\n  }\n\n  // 其他带有 JWT 头的 CRUD 方法\n}\n```\n\n## 测试 JWT 认证\n\n既然 JWT\
  \ 认证已经实现，你可以测试认证流程：\n\n- **登录**：使用 Angular 应用中的登录表单将凭据发送到后端。认证成功后，后端会颁发一个 JWT 令牌。\n\
  - **API 请求**：在 API 请求的 HTTP 头中包含 JWT 令牌。后端会验证令牌并允许访问受保护的资源。\n- **登出**：在用户界面中提供登出选项，以清除存储中的\
  \ JWT 令牌并让用户登出。\n\n为 ASP.NET Core 8 和 Angular 14 实现 JWT 认证以保护 Web API，提供了一种强大的用户认证和授权机制，确保只有授权用户才能访问受保护的资源。通过遵循上述步骤，你已经使用\
  \ JWT 令牌在 ASP.NET Core 后端和 Angular 前端之间建立了一个安全的认证流程。\n\n在使用 JWT 认证时，以下是一些需要牢记的额外考虑因素和最佳实践：\n\
  \n1.  **令牌过期**：为 JWT 令牌设置适当的过期时间，以最小化安全风险。通常，令牌在短时间内（例如 15 分钟到几小时）过期，并需要刷新。\n2.\
  \  **令牌刷新**：实现令牌刷新机制，以便在不要求用户重新输入凭据的情况下生成新的 JWT 令牌。当令牌即将过期时，前端可以使用刷新令牌（如果可用）来请求新令牌。\n\
  3.  **安全存储**：在客户端安全地存储 JWT 令牌。使用浏览器存储机制，如本地存储或会话存储，并在处理 JWT 令牌时避免将敏感信息存储在 Cookie\
  \ 中。\n4.  **HTTPS**：始终使用 HTTPS 来加密客户端和服务器之间传输的数据，包括 JWT 令牌。这有助于防止令牌被恶意方截获。\n5. \
  \ **授权**：在 ASP.NET Core 后端实现基于角色或基于声明的授权，以根据用户角色或 JWT 令牌中的特定声明来控制对 API 不同部分的访问。\n\
  6.  **错误处理**：在服务器端优雅地处理 JWT 令牌验证错误，并向客户端提供适当的错误响应。这有助于调试和改善用户体验。\n7.  **令牌撤销**：考虑实现令牌撤销机制，用于在令牌过期时间之前需要撤销用户访问权限的场景（例如，登出、账户停用）。\n\
  \n通过整合这些最佳实践并持续监控和更新你的认证机制，你可以为你的 Web 应用维护一个安全可靠的认证系统。\n\n总的来说，JWT 认证为保护 Web API\
  \ 提供了一种可扩展且无状态的方法，使其成为现代 Web 开发场景的热门选择。当与 ASP.NET Core 和 Angular 结合使用时，你可以创建强大、安全且用户友好的应用程序，满足现代安全标准。\n\
  \n## 基于角色的授权以实现安全访问控制\n\n基于角色的授权是 Web 应用程序访问控制的一个关键方面，它允许你根据分配给用户的角色来限制对某些资源的访问。在本指南中，我们将探讨如何使用\
  \ ASP.NET Core 8 为后端 API 实现基于角色的授权，并将其与 Angular 14 前端集成。\n\n### 1. 在 ASP.NET Core\
  \ 中设置基于角色的授权\n\nASP.NET Core 使用属性和策略提供了灵活且强大的基于角色的授权机制。\n\n1.  **定义角色**：首先定义你希望用于授权的角色。这些角色可以代表应用程序中不同的访问级别。\n\
  \n```csharp\npublic static class Roles\n{\n    public const string Admin = \"Admin\"\
  ;\n    public const string User = \"User\";\n}\n```\n\n2.  **配置授权策略**：在你的 `Startup.cs`\
  \ 文件中，基于角色配置授权策略。\n\n```csharp\npublic void ConfigureServices(IServiceCollection\
  \ services)\n{\n    // 其他服务配置\n    services.AddAuthorization(options =>\n    {\n\
  \        options.AddPolicy(Roles.Admin, policy => policy.RequireRole(Roles.Admin));\n\
  \        options.AddPolicy(Roles.User, policy => policy.RequireRole(Roles.User));\n\
  \    });\n    // 其他配置\n}\n```\n\n3.  **应用基于角色的授权**：使用授权属性将基于角色的授权应用于你的控制器或操作。\n\n\
  ```csharp\n[Authorize(Roles = Roles.Admin)]\npublic class AdminController : ControllerBase\n\
  {\n    // 仅对拥有 Admin 角色的用户可访问的操作\n}\n\n[Authorize(Roles = Roles.User)]\npublic class\
  \ UserController : ControllerBase\n{\n    // 仅对拥有 User 角色的用户可访问的操作\n}\n```\n\n###\
  \ 2. 在 Angular 14 中集成基于角色的授权\n\n在 ASP.NET Core 后端设置好基于角色的授权后，你将把它与你的 Angular 14\
  \ 前端集成。\n\n1.  **JWT 令牌中的用户角色**：修改你的 JWT 令牌生成，以在令牌负载中包含用户角色作为声明。\n\n```csharp\n\
  private string GenerateJwtToken(ApplicationUser user)\n{\n    var tokenHandler =\
  \ new JwtSecurityTokenHandler();\n    var key = Encoding.ASCII.GetBytes(Configuration[\"\
  Jwt:SecretKey\"]);\n    var tokenDescriptor = new SecurityTokenDescriptor\n    {\n\
  \        Subject = new ClaimsIdentity(new[]\n        {\n            new Claim(ClaimTypes.Name,\
  \ user.UserName),\n            new Claim(ClaimTypes.Role, Roles.Admin), // 示例：根据用户角色分配角色\n\
  \            // 根据需要添加更多声明\n        }),\n        Expires = DateTime.UtcNow.AddDays(1),\
  \ // 令牌过期时间\n        SigningCredentials = new SigningCredentials(new SymmetricSecurityKey(key),\
  \ SecurityAlgorithms.HmacSha256Signature)\n    };\n    var token = tokenHandler.CreateToken(tokenDescriptor);\n\
  \    return tokenHandler.WriteToken(token);\n}\n```\n\n2.  **Angular 授权服务**：在 Angular\
  \ 中创建一个授权服务，以检查用户角色并控制对组件或路由的访问。\n\n```typescript\nimport { Injectable } from '@angular/core';\n\
  import { AuthService } from './auth.service';\n\n@Injectable({\n  providedIn: 'root'\n\
  })\nexport class AuthorizationService {\n  constructor(private authService: AuthService)\
  \ { }\n\n  isAdmin(): boolean {\n    const userRoles = this.authService.getUserRoles();\n\
  \    return userRoles.includes('Admin');\n  }\n\n  isUser(): boolean {\n    const\
  \ userRoles = this.authService.getUserRoles();\n    return userRoles.includes('User');\n\
  \  }\n}\n```\n\n3.  **Angular 路由守卫**：使用 Angular 路由守卫根据用户角色限制对路由的访问。\n\n```typescript\n\
  import { Injectable } from '@angular/core';\nimport { CanActivate, Router } from\
  \ '@angular/router';\nimport { AuthService } from './auth.service';\nimport { AuthorizationService\
  \ } from './authorization.service';\n\n@Injectable({\n  providedIn: 'root'\n})\n\
  export class AdminGuard implements CanActivate {\n  constructor(private authService:\
  \ AuthService, private authorizationService: AuthorizationService, private router:\
  \ Router) { }\n\n  canActivate(): boolean {\n    if (this.authService.isLoggedIn()\
  \ && this.authorizationService.isAdmin()) {\n      return true;\n    } else {\n\
  \      this.router.navigate(['/unauthorized']); // 重定向到未授权页面或根据需要处理\n      return\
  \ false;\n    }\n  }\n}\n```\n\n### 3. 测试基于角色的授权\n\n实现基于角色的授权后，你可以根据用户角色测试访问控制：\n\
  \n\n\n● 管理员访问：以具有管理员角色的用户身份登录，并访问受 `AdminGuard` 保护的路由或组件。\n\n● 用户访问：以具有用户角色的用户身份登录，并访问受\
  \ `UserGuard` 保护的路由或组件。\n\n● 未授权访问：尝试在没有相应角色的情况下访问路由或组件，并验证是否重定向到未授权页面或进行了适当处理。\n\
  \n基于角色的授权通过确保只有具有特定角色的授权用户才能访问应用程序内的受保护资源来增强安全性。通过在 ASP.NET Core 8 后端 API 中实现基于角色的授权，并使用路由守卫和授权服务将其与\
  \ Angular 14 前端集成，你可以有效地实施访问控制。这种方法有助于根据用户角色和权限维护数据的机密性、完整性以及整体应用程序安全性。\n\n## 第\
  \ 6 章：部署 ASP.NET Core 8 Web API\n\n### 为生产环境发布 ASP.NET Core 应用程序\n\n为生产环境发布 ASP.NET\
  \ Core 应用程序涉及为部署准备应用程序、配置生产设置以及将其部署到托管环境。以下是关于如何为生产环境发布 ASP.NET Core 8 应用程序（包括 Angular\
  \ 14 前端集成）的指南。\n\n1.  **为生产环境准备 ASP.NET Core 应用程序：** 在发布之前，确保你的 ASP.NET Core 应用程序已针对生产使用进行了优化。\n\
  \    1.  **优化代码和资源：**\n        *   压缩和打包 JavaScript 和 CSS 文件以减少加载时间。\n        *\
  \   为静态文件启用压缩以减少带宽使用。\n        *   移除不必要的日志记录和调试信息。\n    2.  **配置生产环境：** 使用生产特定的设置（如数据库连接字符串、日志级别和安全配置）更新你的\
  \ `appsettings.json` 或 `appsettings.Production.json` 文件。\n    3.  **设置环境变量：** 为\
  \ API 密钥或连接字符串等敏感信息配置环境变量。在代码中使用 `IConfiguration` 或 `IOptions` 模式访问这些变量。\n\n2. \
  \ **发布 ASP.NET Core 应用程序：** 你可以使用 Visual Studio 或命令行发布 ASP.NET Core 应用程序。以下是使用命令行的方法：\n\
  \    1.  **打开命令提示符：** 打开命令提示符或终端窗口。\n    2.  **导航到项目目录：** 更改目录到你的 ASP.NET Core 项目文件夹。\n\
  \        ```bash\n        cd path/to/your/project\n        ```\n    3.  **发布命令：**\
  \ 运行 `dotnet publish` 命令来发布你的应用程序。\n        ```bash\n        dotnet publish -c Release\n\
  \        ```\n        如果你有用于生产的自定义配置，请将 `-c Release` 替换为 `-c Production`。\n    4.\
  \  **输出目录：** 成功发布后，你的应用程序文件将被放置在指定的输出目录中（通常是 `bin/Release/netcoreappX.X/publish`）。\n\
  \n3.  **部署 ASP.NET Core 应用程序：** 发布后，将你的 ASP.NET Core 应用程序部署到托管环境。你可以选择各种托管选项，如 IIS、Azure\
  \ App Service、Docker 容器或 AWS 或 Google Cloud 等云平台。\n    1.  **部署到 IIS：**\n      \
  \  *   在服务器上安装 .NET Core Hosting Bundle。\n        *   在 IIS 中创建一个新的站点或应用程序池，并将其配置为指向已发布的文件夹。\n\
  \        *   设置适当的权限和绑定（HTTP 或 HTTPS）。\n    2.  **部署到 Azure App Service：**\n   \
  \     *   为你的应用程序创建一个 Azure App Service（Web 应用）。\n        *   使用 Azure DevOps、Visual\
  \ Studio 发布或 FTP 将你发布的文件部署到 App Service。\n    3.  **使用 Docker 部署：**\n        * \
  \  使用 `Dockerfile` 将你的 ASP.NET Core 应用程序容器化。\n        *   构建一个 Docker 镜像并将其上传到容器注册表。\n\
  \        *   将 Docker 镜像部署到容器运行时环境，如 Docker Swarm 或 Kubernetes。\n\n4.  **集成 Angular\
  \ 14 前端：** 如果你的 ASP.NET Core 应用程序包含 Angular 14 前端，请在发布和部署过程中将其集成。\n    1.  **Angular\
  \ 构建：** 在发布 ASP.NET Core 应用程序之前，为生产环境构建你的 Angular 前端。\n        ```bash\n       \
  \ ng build --prod\n        ```\n        此命令会在你的 Angular 项目的 `dist` 文件夹中生成优化的、可用于生产的文件。\n\
  \    2.  **与 Angular 一起发布：** 将 Angular 生产文件（`dist` 文件夹）包含在你的 ASP.NET Core 应用程序的发布输出中。\n\
  \        ```bash\n        dotnet publish -c Release --output path/to/publish --source\
  \ path/to/angular/dist\n        ```\n    3.  **部署组合应用程序：** 将组合的 ASP.NET Core 和 Angular\
  \ 应用程序部署到你选择的托管环境，确保为后端 API 端点和前端路由进行正确的配置和路由。\n\n5.  **监控和维护：** 部署后，监控你的应用程序的性能、错误和安全问题。设置日志记录和监控工具以跟踪应用程序健康状况和用户交互。定期更新依赖项、应用安全补丁并执行维护任务，以确保生产环境平稳且安全。\n\
  \n通过遵循这些步骤，你可以成功地为生产环境发布和部署集成了 Angular 14 前端的 ASP.NET Core 8 应用程序，为用户提供可靠且可扩展的 Web\
  \ 应用程序体验。\n\n### 在 Azure App Service 或云平台上托管\n\n在 Azure App Service 或 AWS 或 Google\
