  using System;\nusing System.Collections.Generic;\nusing System.Linq;\n\npublic class\
  \ UserRepository : IUserRepository\n{\n    private readonly List<User> _users =\
  \ new List<User>();\n\n    public UserRepository()\n    {\n        // 使用示例数据初始化（替换为数据库操作）\n\
  \        _users.Add(new User { Id = 1, Username = \"user1\", PasswordHash = \"hashed_password\"\
  \ });\n        _users.Add(new User { Id = 2, Username = \"user2\", PasswordHash\
  \ = \"hashed_password\" });\n    }\n\n    public IEnumerable<User> GetAllUsers()\n\
  \    {\n        return _users;\n    }\n\n    public User GetUserById(int id)\n \
  \   {\n        return _users.FirstOrDefault(u => u.Id == id);\n    }\n\n    public\
  \ User GetUserByUsername(string username)\n    {\n        return _users.FirstOrDefault(u\
  \ => u.Username == username);\n    }\n\n    public void AddUser(User user)\n   \
  \ {\n        user.Id = _users.Count + 1; // 生成新 ID（替换为数据库生成的 ID）\n        _users.Add(user);\n\
  \    }\n\n    public void UpdateUser(User user)\n    {\n        var existingUser\
  \ = _users.FirstOrDefault(u => u.Id == user.Id);\n        if (existingUser != null)\n\
  \        {\n            existingUser.Username = user.Username;\n            existingUser.PasswordHash\
  \ = user.PasswordHash;\n            // 根据需要更新其他属性\n        }\n    }\n\n    public\
  \ void DeleteUser(int id)\n    {\n        var userToRemove = _users.FirstOrDefault(u\
  \ => u.Id == id);\n        if (userToRemove != null)\n        {\n            _users.Remove(userToRemove);\n\
  \        }\n    }\n}\n```\n\n### 用户控制器\n\n创建一个控制器来处理与用户管理相关的 HTTP 请求。\n\n```csharp\n\
  // UserController.cs\nusing Microsoft.AspNetCore.Mvc;\n\n[Route(\"api/[controller]\"\
  )]\n[ApiController]\npublic class UserController : ControllerBase\n{\n    private\
