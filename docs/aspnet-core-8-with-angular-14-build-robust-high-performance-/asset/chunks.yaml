    [ApiController]


    [Route("api/[controller]")]


    public class ProductsController : ControllerBase


    {


    A static private List<Product> _products = new List<Product>


    {


    new Product { Id = 1, Name = "Product 1", Price = 10.99m },


    new Product { Id = 2, Name = "Product 2", Price = 20.39m }


    };


    [HttpGet]


    public IActionResult GetProducts()


    {


    return Ok(_products);


    }


    [HttpGet("{id}")]


    public IActionResult GetProductById(int id)


    {


    var product = _products.FirstOrDefault(p => p.Id == id);


    if (product == null)


    {


    return NotFound();


    }


    return Ok(product);


    }


    [HttpPost]


    public IActionResult CreateProduct([FromBody] Product product)


    {


    product.Id = _products.Count + 1;


    _products.Add(product);


    return CreatedAtAction(nameof(GetProductById), new { id = product.Id }, product);


    }


    [HttpPut("{id}")]


    public IActionResult UpdateProduct(int id, [FromBody] Product product)


    {


    var existingProduct = _products.FirstOrDefault(p => p.Id == id);


    if (existingProduct == null)


    {


    return NotFound();


    }


    existingProduct.Name = product.Name;


    existingProduct.Price = product.Price;


    return NoContent();


    }


    [HttpDelete("{id}")]


    public IActionResult DeleteProduct(int id)


    {


    var existingProduct = _products.FirstOrDefault(p => p.Id == id);


    if (existingProduct == null)


    {


    return NotFound();


    }


    _products.Remove(existingProduct);


    return NoContent();


    }


    }


    ```


    In this controller:


    ●     `GetProducts`: Retrieves all products.


    ●     `GetProductById`: Retrieves a product by its ID.


    ●     `CreateProduct`: Creates a new product.


    ●     `UpdateProduct`: Updates an existing product.


    ●     `DeleteProduct`: Deletes a product by its ID.


    2\. Consuming Web API in Angular 14: Next, let''s integrate the ASP.NET Core Web
    API with an Angular 14 frontend to perform CRUD operations.


    1\. Angular Service for API Calls: Create a service in your Angular project to
    handle API calls using Angular''s HttpClient module.


    ```typescript


    import { Injectable } from ''@angular/core'';


    import { HttpClient } from ''@angular/common/http'';


    import { Observable } from ''rxjs'';


    import { Product } from ''./product.model'';


    @Injectable({


    providedIn: ''root''


    })


    export class ProductService {


    private apiUrl = ''https://localhost:5001/api/products''; // API endpoint URL


    constructor(private http: HttpClient) { }


    getProducts(): Observable<Product[]> {


    return this.http.get<Product[]>(this.apiUrl);


    }


    getProductById(id: number): Observable<Product> {


    return this.http.get<Product>(`${this.apiUrl}/${id}`);


    }


    createProduct(product: Product): Observable<Product> {


    return this.http.post<Product>(this.apiUrl, product);


    }


    updateProduct(id: number, product: Product): Observable<Product> {


    return this.http.put<Product>(`${this.apiUrl}/${id}`, product);


    }


    deleteProduct(id: number): Observable<void> {


    return this.http.delete<void>(`${this.apiUrl}/${id}`);


    }


    }


    ```


    2\. Angular Component Usage: Use the service in your Angular components to interact
    with the Web API.


    ```typescript


    import { Component, OnInit } from ''@angular/core'';


    import { ProductService } from ''./product.service'';


    import { Product } from ''./product.model'';


    @Component({


    selector: ''app-product-list'',


    templateUrl: ''./product-list.component.html''


    })


    export class ProductListComponent implements OnInit {


    products: Product[] = [];


    constructor(private productService: ProductService) { }


    ngOnInit(): void {


    this.loadProducts();


    }


    loadProducts(): void {


    this.productService.getProducts().subscribe(products => {


    this.products = products;


    });


    }


    deleteProduct(id: number): void {


    if (confirm(''Are you certain you wish to remove this product?'')) {


    this.productService.deleteProduct(id).subscribe(() => {


    this.loadProducts(); // Refresh product list after deletion


    });


    }


    }


    }


    ```


    3\. Angular Template for Display: Use Angular''s data binding in your component
    template to display products and perform CRUD operations.


    ```html


    <h1>Product List</h1>


    <ul>


    <li *ngFor="let product of products">


    {{ product.id }} - {{ product.name }} - ${{ product.price }}


    <button (click)="deleteProduct(product.id)">Delete</button>


    </li>


    </ul>


    ```


    3\. Testing CRUD Operations: Now that you have set up the backend API and integrated
    it with the Angular frontend, you can test CRUD operations:


    ● Create Operation: Fill out a form to create a new product, and it should be
    added to the list.


    ● Read Operation: View the list of products and click on individual products to
    view details.


    ● Update Operation: Edit the details of a product and save the changes.


    ● Delete Operation: Click on the delete button next to a product to remove it
    from the list.


    Ensure that the data flows correctly between the Angular frontend and the ASP.NET
    Core Web API backend for each operation.


    Implementing CRUD operations with Web APIs in ASP.NET Core 8 and Angular 14 allows
    you to build interactive and data-driven web applications. By following the steps
    outlined above, you can create, retrieve, update, and delete data entities seamlessly
    between the frontend and backend, providing a complete user experience. This approach
    facilitates efficient data management and improves application scalability and
    maintainability.


    Chapter 5


    Authentication and Authorization in ASP.NET Core 8


    Implementing User Authentication with IdentityServer


    Implementing user authentication is crucial for securing web applications. In
    this guide, we''ll walk through implementing user authentication using IdentityServer
    with ASP.NET Core 8 for the backend API and integrating it with an Angular 14
    frontend.


    1\. Setting Up IdentityServer in ASP.NET Core: IdentityServer is a popular OpenID
    Connect and OAuth 2.0 framework for .NET. It provides robust authentication and
    authorization capabilities for web applications.


    1\. Install IdentityServer Packages: Start by installing the necessary IdentityServer
    packages in your ASP.NET Core project. Open the NuGet Package Manager Console
    and run the following commands:


    ```bash


    Install-Package IdentityServer4


    Install-Package IdentityServer4.AspNetIdentity


    ```


    2\. Configure IdentityServer: Set up IdentityServer in your ASP.NET Core application.
    Modify your `Startup.cs` file to include IdentityServer services and configure
    authentication.


    ```csharp


    public void ConfigureServices(IServiceCollection services)


    {


    // Other service configurations


    services.AddIdentity<ApplicationUser, IdentityRole>()


    .AddEntityFrameworkStores<ApplicationDbContext>()


    .AddDefaultTokenProviders();


    services.AddIdentityServer()


    .AddApiAuthorization<ApplicationUser, ApplicationDbContext>();


    services.AddAuthentication()


    .AddIdentityServerJwt();


    // Other configurations


    }


    public void Configure(IApplicationBuilder app, IWebHostEnvironment env)


    {


    // Other app configurations


    app.UseRouting();


    app.UseAuthentication();


    app.UseAuthorization();


    app.UseEndpoints(endpoints =>


    {


    endpoints.MapControllers();


    endpoints.MapRazorPages();


    endpoints.MapIdentityServer();


    });


    }


    ```


    3\. Create User Model and DbContext: Define a user model and update your `DbContext`
    to include user-related entities.


    ```csharp


    public class ApplicationUser : IdentityUser


    {


    // Additional user properties if needed


    }


    public class ApplicationDbContext : IdentityDbContext<ApplicationUser>


    {


    public ApplicationDbContext(DbContextOptions<ApplicationDbContext> options)


    : base(options)


    {


    }


    // DbSet for additional entities if needed


    }


    ```


    4\. Seed Default Users and Roles (Optional): You can seed default users and roles
    during application startup for testing purposes or initial setup.


    5\. Enable Authentication in Controllers: Add authentication attributes to controllers
    or actions that require authentication.


    ```csharp


    [Authorize]


    public class ProductsController : ControllerBase


    {


    // Controller actions


    }


    ```


    2\. Integrating Authentication in Angular 14: After setting up IdentityServer
    in the ASP.NET Core backend, you''ll integrate authentication with your Angular
    14 frontend.'
