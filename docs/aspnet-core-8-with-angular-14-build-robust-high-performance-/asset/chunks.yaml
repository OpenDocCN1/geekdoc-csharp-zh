  raw: '4\. Navigate Between Routes: Use Angular''s `Router` service or `routerLink`
    directive in HTML templates to navigate between routes programmatically or via
    user interaction.


    ```typescript


    import { Component } from ''@angular/core'';


    import { Router } from ''@angular/router'';


    @Component({


    selector: ''app-navbar'',


    templateUrl: ''./navbar.component.html''


    })


    export class NavbarComponent {


    constructor(private router: Router) {}


    navigateToProducts() {


    this.router.navigate([''/products'']);


    }


    }


