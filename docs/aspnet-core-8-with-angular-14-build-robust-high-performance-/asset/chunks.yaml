    Finally, update a component to use the API service:


    ```typescript


    // greeting.component.ts


    import { Component, OnInit } from ''@angular/core'';


    import { ApiService } from ''./api.service'';


    @Component({


    selector: ''app-greeting'',


    templateUrl: ''./greeting.component.html'',


    styleUrls: [''./greeting.component.css'']


    })


    export class GreetingComponent implements OnInit {


    greetingMessage: string;


    constructor(private apiService: ApiService) { }


    ngOnInit(): void {


    this.apiService.getGreeting().subscribe({


    next: (message) => {


    this.greetingMessage = message;


    },


    error: (error) => {


    console.error(''Error fetching greeting:'', error);


    }


    });


    }


    }


    ```


    This example demonstrates how to integrate an Angular front-end with an ASP.NET
    Core API to fetch and display data seamlessly.


    The full-stack approach using ASP.NET Core 8 and Angular 14 offers numerous benefits,
    including seamless integration, consistent development environment, enhanced productivity,
    code reusability, and performance optimization. By leveraging these technologies
    together, developers can build robust, scalable, and modern web applications effectively.


    Choosing the Right Technologies: ASP.NET Core 8 & Angular 14


    Choosing the right technologies for a web development project is crucial for its
    success. ASP.NET Core and Angular are both popular choices for building modern
    web applications, offering robust features and scalability. Let''s explore why
    ASP.NET Core 8 and Angular 14 make a great combination for web development and
    delve into some code examples to illustrate their capabilities.


    ASP.NET Core 8: ASP.NET Core represents a cross-platform, high-performance framework
    tailored for constructing modern applications that are cloud-based and internet-connected.Version
    8 brings numerous improvements and features that enhance developer productivity
    and application performance.


    One of the key advantages of ASP.NET Core is its support for building RESTful
    APIs, which are essential for creating backend services that can be consumed by
    frontend applications like Angular. Let''s create a simple API endpoint using
    ASP.NET Core 8:


    ```csharp


    // Startup.cs


    public void ConfigureServices(IServiceCollection services)


    {


    services.AddControllers();


    }


    public void Configure(IApplicationBuilder app, IWebHostEnvironment env)


    {


    if (env.IsDevelopment())


    {


    app.UseDeveloperExceptionPage();


    }


    app.UseRouting();


    app.UseEndpoints(endpoints =>


    {


    endpoints.MapControllers();


    });


    }


    // WeatherForecastController.cs


    [ApiController]


    [Route("api/[controller]")]


    public class WeatherForecastController : ControllerBase


    {


    [HttpGet]


    public IEnumerable<WeatherForecast> Get()


    {


    var rng = new Random();


    return Enumerable.Range(1, 5).Select(index => new WeatherForecast


    {


    Date = DateTime.Now.AddDays(index),


    TemperatureC = rng.Next(-20, 55),


    Summary = Summaries[rng.Next(Summaries.Length)]


    })


    .ToArray();


    }


    }


    ```


    This code sets up a simple API endpoint `/api/weatherforecast` that returns a
    list of weather forecasts.


    Angular 14: Angular is a powerful frontend framework developed by Google for building
    dynamic, single-page web applications. Angular 14 introduces new features and
    optimizations to enhance the developer experience and application performance.


    Let''s create an Angular component that consumes the API endpoint we created earlier
    and displays the weather forecast data:


    ```typescript


    // weather-forecast.component.ts


    import { Component, OnInit } from ''@angular/core'';


    import { HttpClient } from ''@angular/common/http'';


    @Component({


    selector: ''app-weather-forecast'',


    templateUrl: ''./weather-forecast.component.html'',


    styleUrls: [''./weather-forecast.component.css'']


    })


    export class WeatherForecastComponent implements OnInit {


    forecasts: any[];


    constructor(private http: HttpClient) { }


    ngOnInit(): void {


    this.http.get<any[]>(''https://localhost:5001/api/weatherforecast'').subscribe(data
    => {


    this.forecasts = data;


    });


    }


    }


    ```


    In this Angular component, we use the HttpClient module to make an HTTP GET request
    to our ASP.NET Core API endpoint and retrieve the weather forecast data.


    HTML Template: Now, let''s create the HTML template to display the weather forecast
    data in our Angular component:


    ```html


    <!-- weather-forecast.component.html -->


    <div *ngIf="forecasts">


    <h2>Weather Forecasts</h2>


    <ul>


    <li *ngFor="let forecast of forecasts">


    Date: {{ forecast.date | date }}, Temperature: {{ forecast.temperatureC }}°C,
    Summary: {{ forecast.summary }}


    </li>


    </ul>


    </div>


    ```


    This HTML template uses Angular''s data binding and structural directives (`*ngIf`
    and `*ngFor`) to dynamically display the weather forecast data fetched from the
    API.


    By combining ASP.NET Core 8 for backend API development and Angular 14 for frontend
    development, you get a powerful and modern stack for building scalable web applications.
    ASP.NET Core''s robustness in creating RESTful APIs complements Angular''s capabilities
    in creating dynamic and interactive user interfaces, making them a great choice
    for web development projects.


    Chapter 2


    Setting Up Your Development Environment


    Installing Visual Studio or Code


    Installing Visual Studio or Visual Studio Code for ASP.NET Core 8 and Angular
    14 development is a straightforward process that provides developers with powerful
    tools and features to build modern web applications. Let''s go through the steps
    to install both Visual Studio and Visual Studio Code along with the necessary
    extensions for ASP.NET Core and Angular development.


    1\. Installing Visual Studio:


    Visual Studio is a comprehensive integrated development environment (IDE) from
    Microsoft that supports a wide range of programming languages and platforms, including
    ASP.NET Core development. Here are the steps to install Visual Studio for ASP.NET
    Core 8 development:


    1\. Download Visual Studio: Go to the official Visual Studio website (https://visualstudio.microsoft.com/downloads/)
    and download the Visual Studio installer.


    2\. Run the Installer: Once the installer is downloaded, run it. You will be presented
    with options to select the workload and components you want to install. For ASP.NET
    Core development, make sure to select the ".NET desktop development" workload,
    which includes ASP.NET and .NET Core components.


    3\. Install ASP.NET Core SDK: During the installation process, the installer will
    prompt you to install the necessary SDKs. Make sure to install the ASP.NET Core
    SDK, which is required for developing ASP.NET Core applications.


    4\. Install Additional Components (Optional): Depending on your project requirements,
    you may want to install additional components such as Azure development tools,
    SQL Server tools, etc.


    5\. Complete Installation: Follow the on-screen instructions to complete the installation
    process. Once installed, you can launch Visual Studio and start creating ASP.NET
    Core projects.'
  trans: "\n\n# 设置你的开发环境\n\n## 安装 Visual Studio 或 Code\n\n为 `ASP.NET Core 8` 和 `Angular\
    \ 14` 开发安装 Visual Studio 或 Visual Studio Code 是一个简单直接的过程，它为开发者提供了构建现代 Web 应用程序的强大工具和功能。让我们逐步了解如何安装\
    \ Visual Studio 和 Visual Studio Code，以及用于 `ASP.NET Core` 和 `Angular` 开发所需的必要扩展。\n\
    \n### 安装 Visual Studio\n\nVisual Studio 是微软推出的一款功能全面的集成开发环境（IDE），支持多种编程语言和平台，包括\
