    Building API Endpoints for User Management and Data Access


    Building API endpoints for user management and data access is a crucial part of
    developing a robust web application. In this guide, we''ll cover how to create
    API endpoints for user CRUD operations and data access using ASP.NET Core 8 for
    the backend and Angular 14 for the frontend.


    1\. User Management API Endpoints:


    ● User Model: First, define a User model in your ASP.NET Core 8 application to
    represent user data.


    ```csharp


    // User.cs


    using System.ComponentModel.DataAnnotations;


    public class User


    {


    [Key]


    integer public Id{ get; set; }


    [Required]


    Username declared as a public string{ get; set; }


    [Required]


    PasswordHash declared as a public string { get; set; }


    // Add other user properties as needed (e.g., roles, email)


    }


    ```


    ● User Repository Interface: Create a repository interface to define methods for
    user CRUD operations.


    ```csharp


    // IUserRepository.cs


    using System.Collections.Generic;


    public interface IUserRepository


    {


    IEnumerable<User> GetAllUsers();


    User GetUserById(int id);


    User GetUserByUsername(string username);


    void AddUser(User user);


    void UpdateUser(User user);


    void DeleteUser(int id);


    }


    ```


    ● User Repository Implementation: Implement the IUserRepository interface in a
    concrete class.


    ```csharp


    // UserRepository.cs


    using System;


    using System.Collections.Generic;


    using System.Linq;


    public class UserRepository : IUserRepository


    {


    private readonly List<User> _users = new List<User>();


    public UserRepository()


    {


    // Initialize with sample data (replace with database operations)


    _users.Add(new User { Id = 1, Username = "user1", PasswordHash = "hashed_password"
    });


    _users.Add(new User { Id = 2, Username = "user2", PasswordHash = "hashed_password"
    });


    }


    public IEnumerable<User> GetAllUsers()


    {


    return _users;


    }


    public User GetUserById(int id)


    {


    return _users.FirstOrDefault(u => u.Id == id);


    }


    public User GetUserByUsername(string username)


    {


    return _users.FirstOrDefault(u => u.Username == username);


    }


    public void AddUser(User user)


    {


    user.Id = _users.Count + 1; // Generate new ID (replace with database-generated
    ID)


    _users.Add(user);


    }


    public void UpdateUser(User user)


    {


    var existingUser = _users.FirstOrDefault(u => u.Id == user.Id);


    if (existingUser != null)


    {


    existingUser.Username = user.Username;


    existingUser.PasswordHash = user.PasswordHash;


    // Update other properties as needed


    }


    }


    public void DeleteUser(int id)


    {


    var userToRemove = _users.FirstOrDefault(u => u.Id == id);


    if (userToRemove != null)


    {


    _users.Remove(userToRemove);


    }


    }


    }


    ```


    ● User Controller: Create a controller to handle HTTP requests related to user
    management.


    ```csharp


    // UserController.cs


    using Microsoft.AspNetCore.Mvc;


    [Route("api/[controller]")]


    [ApiController]


    public class UserController : ControllerBase


    {


    private readonly IUserRepository _userRepository;


    public UserController(IUserRepository userRepository)


    {


    _userRepository = userRepository;


    }


    [HttpGet]


    public IActionResult GetAllUsers()


    {


    var users = _userRepository.GetAllUsers();


    return Ok(users);


    }


    [HttpGet("{id}")]


    public IActionResult GetUserById(int id)


    {


    var user = _userRepository.GetUserById(id);


    if (user == null)


    {


    return NotFound(); // User not found


    }


    return Ok(user);


    }


    [HttpPost]


    public IActionResult AddUser([FromBody] User user)


    {


    _userRepository.AddUser(user);


    return CreatedAtAction(nameof(GetUserById), new { id = user.Id }, user);


    }


    [HttpPut("{id}")]


    public IActionResult UpdateUser(int id, [FromBody] User user)


    {


    var existingUser = _userRepository.GetUserById(id);


    if (existingUser == null)


    {


    return NotFound(); // User not found


    }


    existingUser.Username = user.Username;


    existingUser.PasswordHash = user.PasswordHash;


    // Update other properties as needed


    _userRepository.UpdateUser(existingUser);


    return NoContent();


    }


    [HttpDelete("{id}")]


    public IActionResult DeleteUser(int id)


    {


    var existingUser = _userRepository.GetUserById(id);


    if (existingUser == null)


    {


    return NotFound(); // User not found


    }


    _userRepository.DeleteUser(id);


    return NoContent();


    }


    }


    ```


