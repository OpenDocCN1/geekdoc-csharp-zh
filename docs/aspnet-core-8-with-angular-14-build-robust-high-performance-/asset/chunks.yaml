  raw: 'Whether you''re a web developer seeking to expand your full-stack skillset
    or a passionate learner eager to master the latest technologies, ASP.NET Core
    8 and Angular 14: Full-stack Web Development is your ultimate companion.


    Embrace the future of web development. Order your copy today and unlock a world
    of development possibilities!


    Chapter 1


    Unraveling Full-Stack Development: Comprehending Front-End and Back-End Technologies


    Front-End Development with Angular 14


    Angular is a popular front-end framework that allows developers to build dynamic
    and interactive web applications. In this section, we''ll cover the basics of
    setting up an Angular project and creating a simple component.


    Setting Up Angular 14 Project


    First, make sure you have Node.js and npm installed. Then, you can create a new
    Angular project using the Angular CLI:


    ```bash


    npm install -g @angular/cli   # Install Angular CLI globally


    ng new my-angular-app # Create a new Angular project


    cd my-angular-app # Navigate to the project directory


    ```


    Creating a Simple Component


    Let''s create a simple Angular component to display a greeting message. Run the
    following commands in your terminal:


    ```bash


    ng generate component greeting  # Generate a new Angular component named ''greeting''


    ```


    This command will create a `greeting` folder with the necessary files for your
    component.


    Now, let''s edit the `greeting.component.html` file to display our message:


    ```html


    <!-- greeting.component.html -->


    <h1>Welcome to My Angular App!</h1>


    ```


    Running the Angular App


    You can run your Angular app locally using the Angular CLI:


    ```bash


    ng serve --open   # Launch the development server and open the app in your default
    browser


    ```


    Navigate to `http://localhost:4200/` in your browser to see the greeting message
    displayed by your Angular component.


    Back-End Development with ASP.NET Core 8


    ASP.NET Core is a versatile framework designed for creating contemporary applications
    that are cloud-enabled and can run across different platforms with optimal performance.
    Let''s dive into setting up a basic ASP.NET Core API and connecting it with our
    Angular front-end.


    Setting Up ASP.NET Core 8 Project


    First, ensure you have .NET SDK 8 installed on your machine. Afterward, launch
    your terminal or command prompt and execute these commands:


    ```bash


    dotnet new webapi -n MyApi  # Create a new ASP.NET Core Web API project named
    ''MyApi''


    cd MyApi  # Navigate to the project directory


    ```


    Creating a Controller and API Endpoint


    Let''s create a simple API controller that returns a greeting message. Create
    a new file named `GreetingController.cs` in the `Controllers` folder of your ASP.NET
    Core project and add the following code:


    ```csharp


    // GreetingController.cs


    using Microsoft.AspNetCore.Mvc;


    namespace MyApi.Controllers


    {


    [ApiController]


    [Route("api/[controller]")]


    public class GreetingController : ControllerBase


    {


    [HttpGet]


    public IActionResult Get()


    {


    return Ok("Welcome to My API!");


    }


    }


    }


    ```


    Running the ASP.NET Core API


    You can run your ASP.NET Core API using the following command:


    ```bash


    dotnet run


    ```


    Navigate to `https://localhost:5001/api/greeting` in your browser or use tools
    like Postman to send a GET request to see the greeting message returned by your
    API.


    Integrating Front-End with Back-End


    Now that we have our Angular front-end and ASP.NET Core API set up, let''s integrate
    them to fetch data from the API and display it in our Angular app.


    Making HTTP Request from Angular


    Open the `greeting.component.ts` file in your Angular project and update it to
    make an HTTP request to your API:


    ```typescript


    // greeting.component.ts


    import { Component, OnInit } from ''@angular/core'';


    import { HttpClient } from ''@angular/common/http'';


    @Component({


    selector: ''app-greeting'',


    templateUrl: ''./greeting.component.html'',


    styleUrls: [''./greeting.component.css'']


    })


    export class GreetingComponent implements OnInit {


    greetingMessage: string;


    constructor(private http: HttpClient) { }


    ngOnInit(): void {


    this.http.get<string>(''https://localhost:5001/api/greeting'').subscribe({


    next: (message) => {


    this.greetingMessage = message;


    },


    error: (error) => {


    console.error(''Error fetching greeting:'', error);


    }


    });


    }


    }


    ```


    Displaying API Response in Angular Component


    Update the `greeting.component.html` file to display the greeting message fetched
    from the API:


    ```html


    <!-- greeting.component.html -->


    <h1>{{ greetingMessage }}</h1>


    ```


    Now, when you run your Angular app (`ng serve --open`), it will fetch the greeting
    message from your ASP.NET Core API and display it on the page.


    In this guide, we''ve covered the basics of full-stack development using ASP.NET
    Core 8 for the back-end and Angular 14 for the front-end. Understanding how to
    create components, set up APIs, and integrate front-end with back-end is crucial
    for building modern web applications. Feel free to explore further and expand
    on these concepts to enhance your full-stack development skills!


    Benefits of a Full-Stack Approach


    1\. Seamless Integration: One of the key advantages of a full-stack approach is
    the seamless integration between the front-end and back-end components. Using
    technologies like ASP.NET Core and Angular, developers can create APIs on the
    server-side and consume them directly in the client-side application. This integration
    streamlines data flow and enhances overall application performance.


    2\. Consistent Development Environment: By adopting a full-stack approach with
    ASP.NET Core and Angular, developers can work in a consistent development environment
    throughout the entire application stack. This reduces compatibility issues and
    ensures smooth collaboration between front-end and back-end teams.


    3\. Enhanced Productivity: The combination of ASP.NET Core and Angular offers
    powerful tools, libraries, and frameworks that boost developer productivity. For
    instance, ASP.NET Core provides features like dependency injection, middleware,
    and MVC pattern for server-side development, while Angular offers components,
    services, and RxJS for client-side development. These tools enable developers
    to write clean, modular, and maintainable code, thereby enhancing productivity.


    4\. Code Reusability: A full-stack approach promotes code reusability across different
    parts of the application. With Angular components on the front-end and ASP.NET
    Core controllers on the back-end, developers can structure their codebase in a
    modular and reusable manner. This reduces duplication of code and makes it easier
    to maintain and scale the application over time.


    5\. Performance Optimization: By leveraging the capabilities of ASP.NET Core and
    Angular, developers can optimize the performance of their web applications. ASP.NET
    Core offers features like caching, asynchronous programming, and efficient database
    access, while Angular provides tools for lazy loading, AOT compilation, and state
    management. These optimizations lead to faster load times, smoother user experiences,
    and better scalability.


    Code Example: Integrating ASP.NET Core 8 with Angular 14


    Let''s demonstrate how to integrate ASP.NET Core API with an Angular front-end
    using code examples.


    Setting Up ASP.NET Core API


    To begin, generate a fresh ASP.NET Core Web API project:


    ```bash


    dotnet new webapi -n MyApi  # Create a new ASP.NET Core Web API project named
    ''MyApi''


    cd MyApi                    # Navigate to the project directory


    ```


    Next, create a simple API controller to handle GET requests:


    ```csharp


    // GreetingController.cs


    using Microsoft.AspNetCore.Mvc;


    namespace MyApi.Controllers


    {


    [ApiController]


    [Route("api/[controller]")]


    public class GreetingController : ControllerBase


    {


    [HttpGet]


    public IActionResult Get()


    {


    return Ok("Welcome to My API!");


    }


    }


    }


    ```


    Setting Up Angular 14 Project


    Install Angular CLI globally and create a new Angular project:'
