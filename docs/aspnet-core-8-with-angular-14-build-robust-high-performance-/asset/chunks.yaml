  trans: "\n6\\. 运行并测试 Angular 应用：使用 `ng serve` 命令在本地运行你的 Angular 应用程序。在浏览器中访问你的 Angular\
    \ 应用（默认运行在 `http://localhost:4200`）并测试其功能。\n\n配置 ASP.NET Core 8 和 Angular 14 开发工具涉及设置必要的软件、创建项目、配置中间件、服务、路由以及管理依赖项。通过使用\
    \ Visual Studio 或 Visual Studio Code，以及 Angular CLI 和 .NET Core SDK，你将拥有一个强大的开发环境，可以无缝构建现代\
    \ Web 应用程序。使用适当的工具测试和调试你的应用程序，可以确保流畅的开发体验。\n\n## 使用 Git 设置版本控制\n\n使用 Git 设置版本控制对于管理代码更改、与团队成员协作以及维护项目修订历史至关重要。无论你是在开发\
    \ ASP.NET Core 8 后端还是 Angular 14 前端（或两者兼有），Git 都提供了一个可靠的版本控制系统。让我们逐步了解如何为包含 ASP.NET\
    \ Core 和 Angular 开发的项目设置 Git。\n\n1\\. 安装 Git：如果你尚未安装 Git，可以从官方网站 (https://git-scm.com/)\
    \ 下载。请遵循适用于你的操作系统（Windows、macOS 或 Linux）的安装指南。\n\n2\\. 创建 Git 仓库：安装 Git 后，使用终端或命令提示符导航到项目的根目录。\n\
    \n对于新项目，你可以使用以下命令初始化一个新的 Git 仓库：\n\n```bash\ngit init\n```\n\n此命令在当前目录中创建一个新的\
    \ Git 仓库，并将其标记为版本控制项目。\n\n3\\. 设置 `.gitignore`：在 ASP.NET Core 和 Angular 项目中，有些文件和目录你不想包含在版本控制中。例如，构建产物、临时文件和依赖项。在项目根目录创建一个\
    \ `.gitignore` 文件，以指定 Git 应忽略哪些文件和目录。\n\n以下是一个适用于 ASP.NET Core 和 Angular 项目的 `.gitignore`\
    \ 文件示例：\n\n```\n# ASP.NET Core\nbin/\nobj/\n*.csproj.user\n*.dll\n*.exe\n\n# Angular\n\
    node_modules/\ndist/\n```\n\n根据你的具体项目结构和依赖项调整 `.gitignore` 文件。\n\n4\\. 添加和提交更改：设置好\
    \ `.gitignore` 后，你可以开始将文件添加到 Git 仓库并提交更改。\n\n要将所有文件添加到暂存区以进行下一次提交，请使用：\n\n```bash\n\
    git add .\n```\n\n使用以下命令将更改提交到仓库：\n\n```bash\ngit commit -m \"Initial commit\"\
    \n```\n\n将 `\"Initial commit\"` 替换为描述你所做更改的适当提交消息。\n\n5\\. 远程仓库（可选）：如果你在团队中工作，或者想在远程服务器（如\
    \ GitHub、GitLab 或 Bitbucket）上备份代码，你可以添加一个远程仓库。\n\n例如，要在 GitHub 上添加一个远程仓库：\n\n\
    1\\. 在 GitHub 上创建一个新仓库。\n\n2\\. 使用以下命令添加远程仓库：\n\n```bash\ngit remote add origin\
    \ https://github.com/username/repo-name.git\n```\n\n将 `https://github.com/username/repo-name.git`\
    \ 替换为你的 GitHub 仓库的 URL。\n\n3\\. 将你的代码推送到远程仓库：\n\n```bash\ngit push -u origin main\n\
    ```\n\n此命令将你的代码推送到远程仓库的 `main` 分支。如果你使用的是不同的分支，请将 `main` 替换为该分支的名称。\n\n6\\. 分支和合并（可选）：Git\
    \ 允许你在单独的分支上处理不同的功能或错误修复，这些分支稍后可以合并到主分支（或其他目标分支）。\n\n要创建一个新分支并切换到它：\n\n```bash\n\
    git checkout -b feature-name\n```\n\n将 `feature-name` 替换为适当的分支名称。\n\n在分支中进行更改后，你可以提交它们，然后使用\
    \ Git 命令（如 `git merge`）或使用 GitHub 等 Git 托管平台的拉取请求机制将分支合并到主分支。\n\n7\\. 拉取更改（可选）：如果你在团队中工作或与他人协作，你可能需要从远程仓库拉取更改以保持本地仓库的更新。\n\
    \n要从远程仓库拉取更改：\n\n```bash\ngit pull origin main\n```\n\n将 `main` 替换为你想要拉取更改的分支。\n\
    \n为 ASP.NET Core 8 和 Angular 14 项目设置 Git 版本控制涉及初始化 Git 仓库、创建 `.gitignore` 文件、添加和提交更改，以及可选地设置远程仓库以进行协作。分支、合并和拉取更改是额外的\
    \ Git 操作，可以增强你的开发工作流程，尤其是在团队环境中。通过遵循这些步骤，你可以有效地管理代码版本、跟踪更改，并在项目中无缝协作。\n\n## 第\
    \ 3 章\n\n### 掌握 ASP.NET Core 8 以构建健壮的后端\n\n构建你的第一个 ASP.NET Core 8 Web API 是开始后端开发的好方法。我们将逐步介绍在\
    \ Visual Studio 中创建新的 ASP.NET Core 项目、设置一个简单的 Web API 以及使用 Postman 等工具进行测试的过程。同时，我们将考虑与\
    \ Angular 14 前端开发的集成。\n\n1\\. 在 Visual Studio 中创建 ASP.NET Core 8 项目：\n\n1\\. 打开\
    \ Visual Studio：在你的开发机器上启动 Visual Studio。\n\n2\\. 开始新项目：单击“创建新项目”或导航到“文件” > “新建”\
    \ > “项目”。\n\n3\\. 选择项目模板：在“创建新项目”窗口中，选择“ASP.NET Core Web 应用程序”作为项目类型。单击“下一步”。\n\
    \n4\\. 配置项目：为你的项目提供名称和位置。选择所需的框架（ASP.NET Core 8）和项目类型（如 API 或 Web 应用程序）。单击“创建”。\n\
    \n5\\. 选择模板：在“创建新的 ASP.NET Core Web 应用程序”窗口中，选择“API”模板。确保选择了“ASP.NET Core 8”作为目标框架。\n\
    \n6\\. 配置身份验证（可选）：你可以根据项目要求选择配置身份验证。目前，如果不需要，你可以选择“无身份验证”。\n\n7\\. 创建项目：单击“创建”以基于选定的模板和配置创建\
    \ ASP.NET Core 项目。\n\n2\\. 设置一个简单的 Web API：\n\n项目创建后，你将拥有一个包含 `Controllers`、`Models`\
    \ 和 `Startup.cs` 等文件夹的基本结构。让我们创建一个简单的 Web API 控制器来处理请求。\n\n1\\. 创建控制器：在解决方案资源管理器中右键单击“Controllers”文件夹，然后选择“添加”\
    \ > “控制器”。\n\n2\\. 选择控制器模板：选择“API 控制器 - 空”模板，然后单击“添加”。\n\n3\\. 添加控制器代码：在新创建的控制器文件（例如\
    \ `ValuesController.cs`）中，添加一些示例代码以创建 API 端点。\n\n```csharp\nusing Microsoft.AspNetCore.Mvc;\n\
    using System;\nusing System.Collections.Generic;\n\nnamespace YourNamespace.Controllers\n\
    {\n    [Route(\"api/[controller]\")]\n    [ApiController]\n    public class ValuesController\
    \ : ControllerBase\n    {\n        // GET: api/values\n        [HttpGet]\n   \
    \     public ActionResult<IEnumerable<string>> Get()\n        {\n            return\
    \ new string[] { \"value1\", \"value2\" };\n        }\n\n        // GET api/values/5\n\
    \        [HttpGet(\"{id}\")]\n        public ActionResult<string> Get(int id)\n\
    \        {\n            return \"value\";\n        }\n\n        // POST api/values\n\
    \        [HttpPost]\n        public ActionResult Post([FromBody] string value)\n\
    \        {\n            // Save the value or perform necessary actions\n     \
    \       return Ok();\n        }\n\n        // PUT api/values/5\n        [HttpPut(\"\
    {id}\")]\n        public ActionResult Put(int id, [FromBody] string value)\n \
    \       {\n            // Update the value with the provided ID\n            return\
    \ Ok();\n        }\n\n        // DELETE api/values/5\n        [HttpDelete(\"{id}\"\
    )]\n        public ActionResult Delete(int id)\n        {\n            // Delete\
    \ the value with the provided ID\n            return Ok();\n        }\n    }\n\
    }\n```\n"
- fmt: "4\\. 运行应用程序：使用 Visual Studio 构建并运行你的 ASP.NET Core 应用程序。这将启动开发服务器，允许你测试 Web\
    \ API 端点。\n\n3\\. 测试 Web API：\n\n你可以使用 Postman 等工具测试你的 Web API，该工具允许你发送 HTTP 请求并检查响应。\n\
    \n1\\. 打开 Postman：在你的机器上启动 Postman。\n\n2\\. 发送 GET 请求：输入你的 Web API 端点的 URL（例如，`https://localhost:5001/api/values`）并选择\
    \ GET 方法。提交请求以查看响应。\n\n3\\. 测试其他端点：尝试使用 Postman 测试其他端点，如 POST、PUT 和 DELETE。根据需要，在\
    \ POST 和 PUT 请求的请求体中提供适当的数据。\n\n4\\. 与 Angular 14 集成（可选）：如果你正在将 ASP.NET Core Web\
    \ API 与 Angular 前端集成，你可以从 Angular 应用程序发出 HTTP 请求以从 API 获取数据。\n\n1\\. 创建 Angular\
    \ 服务：\n\n在你的 Angular 项目中，创建一个服务来处理 HTTP 请求。例如，创建一个名为 `ApiService` 的服务。\n\n```typescript\n\
    import { Injectable } from '@angular/core';\nimport { HttpClient } from '@angular/common/http';\n\
    import { Observable } from 'rxjs';\n\n@Injectable({\n  providedIn: 'root'\n})\n\
    export class ApiService {\n  apiUrl = 'https://localhost:5001/api/values'; //\
    \ 根据你的 API 更新 URL\n\n  constructor(private http: HttpClient) { }\n\n  getValues():\
    \ Observable<string[]> {\n    return this.http.get<string[]>(this.apiUrl);\n \
    \ }\n\n  // 根据需要实现其他 HTTP 方法（POST、PUT、DELETE）\n}\n```\n\n2\\. 在组件中使用服务：在需要发出 API\
    \ 请求的 Angular 组件中注入 `ApiService`。\n\n```typescript\nimport { Component, OnInit\
    \ } from '@angular/core';\nimport { ApiService } from './api.service';\n\n@Component({\n\
    \  selector: 'app-root',\n  templateUrl: './app.component.html',\n  styleUrls:\
    \ ['./app.component.css']\n})\nexport class AppComponent implements OnInit {\n\
    \  values: string[] = [];\n\n  constructor(private apiService: ApiService) {}\n\
    \n  ngOnInit(): void {\n    this.apiService.getValues().subscribe(data => {\n\
    \      this.values = data;\n    });\n  }\n}\n```\n\n3\\. 在 Angular 模板中显示数据：使用\
    \ Angular 的数据绑定在组件的 HTML 模板中显示获取的数据。\n\n```html\n<h1>Values from API:</h1>\n<ul>\n\
    \  <li *ngFor=\"let value of values\">{{ value }}</li>\n</ul>\n```\n\n4\\. 运行\
    \ Angular 应用程序：构建并运行你的 Angular 应用程序（`ng serve`），以查看从 ASP.NET Core Web API 获取的数据在前端显示。\n\
    \n在 Visual Studio 中创建 ASP.NET Core 8 Web API 涉及设置项目、创建带有 API 端点的控制器，以及使用 Postman\
    \ 等工具测试 API。与 Angular 14（或任何前端框架）的集成允许你构建一个全栈应用程序，其中前端与后端 API 通信以获取和操作数据。这种方法使你能够开发可扩展且交互式的\
    \ Web 应用程序，并在前端和后端功能之间实现清晰的关注点分离。\n\n理解控制器和路由\n\n理解控制器和路由是使用 ASP.NET Core 8 作为后端和\
    \ Angular 14 作为前端构建 Web 应用程序的基础。ASP.NET Core 中的控制器处理传入的 HTTP 请求并生成响应，而路由将 URL\
    \ 映射到特定的控制器操作。让我们通过 ASP.NET Core 和 Angular 的代码示例来深入探讨这些概念。\n\n1\\. ASP.NET Core\
    \ 8 中的控制器：ASP.NET Core 中的控制器是处理传入 HTTP 请求并返回适当响应的类。它们负责处理客户端请求、从模型或服务访问数据，并返回视图或数据作为响应。\n\
    \n以下是一个简单的 ASP.NET Core 控制器示例：\n\n```csharp\nusing Microsoft.AspNetCore.Mvc;\n\
    using System.Collections.Generic;\n\nnamespace MyApp.Controllers\n{\n    [ApiController]\n\
    \    [Route(\"api/[controller]\")]\n    public class ProductsController : ControllerBase\n\
    \    {\n        private readonly IProductService _productService;\n\n        public\
    \ ProductsController(IProductService productService)\n        {\n            _productService\
    \ = productService;\n        }\n\n        [HttpGet]\n        public IEnumerable<Product>\
    \ GetAllProducts()\n        {\n            return _productService.GetAllProducts();\n\
    \        }\n\n        [HttpGet(\"{id}\")]\n        public IActionResult GetProductById(int\
    \ id)\n        {\n            var product = _productService.GetProductById(id);\n\
    \            if (product == null)\n            {\n                return NotFound();\n\
    \            }\n            return Ok(product);\n        }\n\n        [HttpPost]\n\
    \        public IActionResult CreateProduct([FromBody] Product product)\n    \
    \    {\n            _productService.AddProduct(product);\n            return CreatedAtAction(nameof(GetProductById),\
    \ new { id = product.Id }, product);\n        }\n\n        [HttpPut(\"{id}\")]\n\
    \        public IActionResult UpdateProduct(int id, [FromBody] Product product)\n\
    \        {\n            var existingProduct = _productService.GetProductById(id);\n\
    \            if (existingProduct == null)\n            {\n                return\
    \ NotFound();\n            }\n            existingProduct.Name = product.Name;\n\
    \            existingProduct.Price = product.Price;\n            _productService.UpdateProduct(existingProduct);\n\
    \            return NoContent();\n        }\n\n        [HttpDelete(\"{id}\")]\n\
    \        public IActionResult DeleteProduct(int id)\n        {\n            var\
    \ existingProduct = _productService.GetProductById(id);\n            if (existingProduct\
    \ == null)\n            {\n                return NotFound();\n            }\n\
    \            _productService.DeleteProduct(id);\n            return NoContent();\n\
