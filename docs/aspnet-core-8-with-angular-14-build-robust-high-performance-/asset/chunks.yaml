    ```\n\nASP.NET Core 中的控制器处理 HTTP 请求，并根据定义的操作生成响应，而路由则将 URL 映射到特定的控制器操作。在 Angular\
    \ 中，路由支持基于 URL 在组件之间导航。理解这些概念并正确实现它们，对于构建使用 ASP.NET Core 8 作为后端、Angular 14 作为前端的健壮\
    \ Web 应用程序至关重要。\n\n## 使用 ASP.NET Core MVC 处理 HTTP 请求和响应\n\n处理 HTTP 请求和响应是使用 ASP.NET\
    \ Core MVC 作为后端、Angular 14 作为前端构建 Web 应用程序的核心方面。在本指南中，我们将探讨如何在 ASP.NET Core MVC\
    \ 应用程序中处理各种类型的 HTTP 请求（`GET`、`POST`、`PUT`、`DELETE`）和响应，并将其与 Angular 14 前端集成。\n\
    \n### 1. 设置 ASP.NET Core MVC 项目\n\n首先，让我们在 Visual Studio 中创建一个 ASP.NET Core MVC\
    \ 项目，并设置必要的控制器、模型和视图。\n\n1.  **创建 ASP.NET Core MVC 项目**：打开 Visual Studio，创建一个新的\
    \ ASP.NET Core Web 应用程序项目。选择模板 \"ASP.NET Core Web App (Model-View-Controller)\"\
    。\n2.  **添加模型类**：创建一个模型类来表示你的数据。作为示例，我们来生成一个 `Product` 模型：\n\n```csharp\npublic\
    \ class Product\n{\n    public int Id { get; set; }\n    public string Name {\
    \ get; set; }\n    public decimal Price { get; set; }\n}\n```\n\n3.  **创建控制器**：添加一个控制器来处理与产品相关的\
    \ HTTP 请求。右键单击 `Controllers` 文件夹，添加一个名为 `ProductsController` 的新控制器。\n\n```csharp\n\
    using Microsoft.AspNetCore.Mvc;\nusing System.Collections.Generic;\nusing System.Linq;\n\
    \nnamespace MyApp.Controllers\n{\n    [ApiController]\n    [Route(\"api/[controller]\"\
    )]\n    public class ProductsController : ControllerBase\n    {\n        private\
    \ static List<Product> _products = new List<Product>\n        {\n            new\
    \ Product { Id = 1, Name = \"Product 1\", Price = 10.99m },\n            new Product\
    \ { Id = 2, Name = \"Product 2\", Price = 20.39m }\n        };\n\n        [HttpGet]\n\
    \        public IActionResult GetProducts()\n        {\n            return Ok(_products);\n\
    \        }\n\n        [HttpGet(\"{id}\")]\n        public IActionResult GetProductById(int\
    \ id)\n        {\n            var product = _products.FirstOrDefault(p => p.Id\
    \ == id);\n            if (product == null)\n            {\n                return\
    \ NotFound();\n            }\n            return Ok(product);\n        }\n\n \
    \       [HttpPost]\n        public IActionResult CreateProduct([FromBody] Product\
    \ product)\n        {\n            product.Id = _products.Count + 1;\n       \
    \     _products.Add(product);\n            return CreatedAtAction(nameof(GetProductById),\
    \ new { id = product.Id }, product);\n        }\n\n        [HttpPut(\"{id}\")]\n\
    \        public IActionResult UpdateProduct(int id, [FromBody] Product product)\n\
    \        {\n            var existingProduct = _products.FirstOrDefault(p => p.Id\
    \ == id);\n            if (existingProduct == null)\n            {\n         \
    \       return NotFound();\n            }\n            existingProduct.Name =\
    \ product.Name;\n            existingProduct.Price = product.Price;\n        \
    \    return NoContent();\n        }\n\n        [HttpDelete(\"{id}\")]\n      \
    \  public IActionResult DeleteProduct(int id)\n        {\n            var existingProduct\
    \ = _products.FirstOrDefault(p => p.Id == id);\n            if (existingProduct\
    \ == null)\n            {\n                return NotFound();\n            }\n\
    \            _products.Remove(existingProduct);\n            return NoContent();\n\
    \        }\n    }\n}\n```\n\n### 2. 在 ASP.NET Core MVC 中处理 HTTP 请求和响应\n\n现在我们已经设置好了带有\
    \ `ProductsController` 的 ASP.NET Core MVC 项目，让我们来理解每种 HTTP 方法是如何被处理的。\n\n*   **GET\
    \ 请求**：`GetProducts` 方法处理 `GET` 请求以检索所有产品，而 `GetProductById` 处理 `GET` 请求以通过 ID\
    \ 检索特定产品。\n*   **POST 请求**：`CreateProduct` 方法处理 `POST` 请求以创建新产品。产品详情在请求体（`[FromBody]`）中接收。\n\
    *   **PUT 请求**：`UpdateProduct` 方法处理 `PUT` 请求以更新现有产品。它期望在 URL 中提供产品 ID，并在请求体中提供更新后的产品详情。\n\
    *   **DELETE 请求**：`DeleteProduct` 方法处理 `DELETE` 请求以通过 ID 删除产品。\n\n### 3. 与 Angular\
    \ 14 前端集成\n\n让我们将 ASP.NET Core MVC 后端与 Angular 14 前端集成，以演示如何从客户端处理 HTTP 请求和响应。\n\
    \n1.  **创建 Angular 服务**：在你的 Angular 项目中，创建一个服务来处理对 ASP.NET Core API 的 HTTP 请求。\n\
    \n```typescript\nimport { Injectable } from '@angular/core';\nimport { HttpClient\
    \ } from '@angular/common/http';\nimport { Observable } from 'rxjs';\nimport {\
    \ Product } from './product.model';\n\n@Injectable({\n  providedIn: 'root'\n})\n\
    export class ProductService {\n  private apiUrl = 'https://localhost:5001/api/products';\
    \ // 根据你的 API 更新 URL\n\n  constructor(private http: HttpClient) { }\n\n  getProducts():\
    \ Observable<Product[]> {\n    return this.http.get<Product[]>(this.apiUrl);\n\
    \  }\n\n  getProductById(id: number): Observable<Product> {\n    return this.http.get<Product>(`${this.apiUrl}/${id}`);\n\
    \  }\n\n  createProduct(product: Product): Observable<Product> {\n    return this.http.post<Product>(this.apiUrl,\
    \ product);\n  }\n\n  updateProduct(id: number, product: Product): Observable<Product>\
    \ {\n    return this.http.put<Product>(`${this.apiUrl}/${id}`, product);\n  }\n\
    \n  deleteProduct(id: number): Observable<void> {\n    return this.http.delete<void>(`${this.apiUrl}/${id}`);\n\
    \  }\n}\n```\n\n2.  **在 Angular 组件中使用服务**：在需要发起 API 请求的 Angular 组件中注入 `ProductService`。\n\
    \n```typescript\nimport { Component, OnInit } from '@angular/core';\nimport {\
    \ ProductService } from './product.service';\nimport { Product } from './product.model';\n\
    \n@Component({\n  selector: 'app-products',\n  templateUrl: './products.component.html'\n\
    })\nexport class ProductsComponent implements OnInit {\n  products: Product[]\
    \ = [];\n\n  constructor(private productService: ProductService) {}\n\n  ngOnInit():\
    \ void {\n    this.productService.getProducts().subscribe(data => {\n      this.products\
    \ = data;\n    });\n  }\n}\n```\n\n3.  **在 Angular 模板中显示数据**：使用 Angular 的数据绑定在组件的\
    \ HTML 模板中显示获取的数据。\n\n```html\n<h1>产品列表</h1>\n<ul>\n  <li *ngFor=\"let product\
    \ of products\">\n    {{ product.id }} - {{ product.name }} - ${{ product.price\
    \ }}\n  </li>\n</ul>\n```\n\n4.  **添加创建产品功能**：在你想要创建产品的 Angular 组件中，实现调用 `ProductService`\
    \ 的 `createProduct` 方法的逻辑。\n\n```typescript\nimport { Component } from '@angular/core';\n\
    import { ProductService } from './product.service';\nimport { Product } from './product.model';\n\
    \n@Component({\n  selector: 'app-product-form',\n  templateUrl: './product-form.component.html'\n\
    })\nexport class ProductFormComponent {\n  newProduct: Product = { id: 0, name:\
    \ '', price: 0 };\n\n  constructor(private productService: ProductService) {}\n\
    \n  createProduct() {\n    this.productService.createProduct(this.newProduct).subscribe(()\
    \ => {\n      // 刷新产品列表或根据需要执行其他操作\n      this.newProduct = { id: 0, name: '',\
    \ price: 0 }; // 创建后清空表单\n    });\n  }\n}\n```\n\n5.  **添加更新产品功能**：类似地，在你的 Angular\
    \ 组件中实现更新产品的逻辑。\n"
- fmt: "\n## Angular Component: Product Edit\n\n```typescript\nimport { Component\
    \ } from '@angular/core';\nimport { ProductService } from './product.service';\n\
    import { Product } from './product.model';\n\n@Component({\n  selector: 'app-product-edit',\n\
    \  templateUrl: './product-edit.component.html'\n})\nexport class ProductEditComponent\
    \ {\n  selectedProduct: Product | null = null;\n\n  constructor(private productService:\
    \ ProductService) {}\n\n  editProduct(product: Product) {\n    this.selectedProduct\
    \ = { ...product }; // Create a copy to avoid direct changes\n  }\n\n  updateProduct()\
    \ {\n    if (this.selectedProduct) {\n      this.productService.updateProduct(this.selectedProduct.id,\
    \ this.selectedProduct).subscribe(() => {\n        // Refresh product list or\
    \ perform other actions as needed\n        this.selectedProduct = null; // Clear\
    \ selection after update\n      });\n    }\n  }\n}\n```\n\n## 6. Add Delete Product\
    \ Functionality\n\nLastly, add functionality to delete products in your Angular\
    \ component.\n\n```typescript\nimport { Component } from '@angular/core';\nimport\
    \ { ProductService } from './product.service';\nimport { Product } from './product.model';\n\
    \n@Component({\n  selector: 'app-product-list',\n  templateUrl: './product-list.component.html'\n\
    })\nexport class ProductListComponent {\n  products: Product[] = [];\n\n  constructor(private\
    \ productService: ProductService) {}\n\n  deleteProduct(id: number) {\n    this.productService.deleteProduct(id).subscribe(()\
    \ => {\n      // Refresh product list or perform other actions as needed\n   \
    \ });\n  }\n}\n```\n\nNow, let's take a look at how you would use these functionalities\
    \ in your Angular templates.\n\n## Angular Templates\n\n### 1. Display Products\n\
    \nUse Angular's data binding to display products in your component's HTML template\
    \ (`products.component.html`).\n\n```html\n<h1>Products</h1>\n<ul>\n  <li *ngFor=\"\
    let product of products\">\n    {{ product.id }} - {{ product.name }} - ${{ product.price\
    \ }}\n    <button (click)=\"editProduct(product)\">Edit</button>\n    <button\
    \ (click)=\"deleteProduct(product.id)\">Delete</button>\n  </li>\n</ul>\n```\n\
    \n### 2. Create Product Form\n\nCreate a form to add new products (`product-form.component.html`).\n\
    \n```html\n<h2>Create Product</h2>\n<form (submit)=\"createProduct()\">\n  <input\
    \ type=\"text\" [(ngModel)]=\"newProduct.name\" placeholder=\"Product Name\" required>\n\
    \  <input type=\"number\" [(ngModel)]=\"newProduct.price\" placeholder=\"Price\"\
    \ required>\n  <button type=\"submit\">Add Product</button>\n</form>\n```\n\n\
    ### 3. Edit Product Form\n\nCreate a form to edit existing products (`product-edit.component.html`).\n\
    \n```html\n<h2>Edit Product</h2>\n<form (submit)=\"updateProduct()\">\n  <input\
    \ type=\"text\" [(ngModel)]=\"selectedProduct.name\" placeholder=\"Product Name\"\
