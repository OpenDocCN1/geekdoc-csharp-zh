    \ 并下载 Visual Studio 安装程序。\n2.  **运行安装程序**：下载安装程序后，运行它。你将看到选择要安装的工作负载和组件的选项。对于\
    \ `ASP.NET Core` 开发，请确保选择“.NET 桌面开发”工作负载，其中包含 `ASP.NET` 和 `.NET Core` 组件。\n3.\
    \  **安装 ASP.NET Core SDK**：在安装过程中，安装程序会提示你安装必要的 SDK。请确保安装 `ASP.NET Core SDK`，这是开发\
    \ `ASP.NET Core` 应用程序所必需的。\n4.  **安装其他组件（可选）**：根据你的项目需求，你可能需要安装其他组件，例如 Azure 开发工具、SQL\
    \ Server 工具等。\n5.  **完成安装**：按照屏幕上的说明完成安装过程。安装完成后，你可以启动 Visual Studio 并开始创建 `ASP.NET\
    \ Core` 项目。\n\n## 创建新项目\n\n现在，让我们创建一个 Angular 服务来调用 API：\n\n```bash\nng generate\
    \ service api # 生成一个名为 'api' 的新 Angular 服务\n```\n\n更新该服务以向我们的 API 发送 HTTP GET\
    \ 请求：\n\n```typescript\n// api.service.ts\nimport { Injectable } from '@angular/core';\n\
    import { HttpClient } from '@angular/common/http';\nimport { Observable } from\
    \ 'rxjs';\n\n@Injectable({\n  providedIn: 'root'\n})\nexport class ApiService\
    \ {\n  private apiUrl = 'https://localhost:5001/api/greeting';\n\n  constructor(private\
    \ http: HttpClient) { }\n\n  getGreeting(): Observable<string> {\n    return this.http.get<string>(this.apiUrl);\n\
    \  }\n}\n```\n\n最后，更新一个组件以使用 API 服务：\n\n```typescript\n// greeting.component.ts\n\
    import { Component, OnInit } from '@angular/core';\nimport { ApiService } from\
    \ './api.service';\n\n@Component({\n  selector: 'app-greeting',\n  templateUrl:\
    \ './greeting.component.html',\n  styleUrls: ['./greeting.component.css']\n})\n\
    export class GreetingComponent implements OnInit {\n  greetingMessage: string;\n\
    \n  constructor(private apiService: ApiService) { }\n\n  ngOnInit(): void {\n\
    \    this.apiService.getGreeting().subscribe({\n      next: (message) => {\n \
    \       this.greetingMessage = message;\n      },\n      error: (error) => {\n\
    \        console.error('Error fetching greeting:', error);\n      }\n    });\n\
    \  }\n}\n```\n\n这个示例演示了如何将 `Angular` 前端与 `ASP.NET Core` API 集成，以无缝地获取和显示数据。\n\n\
    使用 `ASP.NET Core 8` 和 `Angular 14` 的全栈方法提供了诸多优势，包括无缝集成、一致的开发环境、增强的生产力、代码可重用性以及性能优化。通过结合利用这些技术，开发者可以高效地构建健壮、可扩展且现代化的\
    \ Web 应用程序。\n\n## 选择合适的技术：ASP.NET Core 8 & Angular 14\n\n为 Web 开发项目选择合适的技术对其成功至关重要。`ASP.NET\
    \ Core` 和 `Angular` 都是构建现代 Web 应用程序的热门选择，提供了强大的功能和可扩展性。让我们探讨一下为什么 `ASP.NET Core\
    \ 8` 和 `Angular 14` 是 Web 开发的绝佳组合，并深入一些代码示例来说明它们的能力。\n\n### ASP.NET Core 8\n\n\
    `ASP.NET Core` 是一个跨平台、高性能的框架，专为构建基于云和互联网连接的现代应用程序而量身定制。版本 8 带来了许多改进和特性，提升了开发者的生产力和应用程序性能。\n\
    \n`ASP.NET Core` 的一个关键优势是它支持构建 RESTful API，这对于创建可被 `Angular` 等前端应用程序调用的后端服务至关重要。让我们使用\
    \ `ASP.NET Core 8` 创建一个简单的 API 端点：\n\n```csharp\n// Startup.cs\npublic void ConfigureServices(IServiceCollection\
    \ services)\n{\n    services.AddControllers();\n}\n\npublic void Configure(IApplicationBuilder\
    \ app, IWebHostEnvironment env)\n{\n    if (env.IsDevelopment())\n    {\n    \
    \    app.UseDeveloperExceptionPage();\n    }\n\n    app.UseRouting();\n\n    app.UseEndpoints(endpoints\
    \ =>\n    {\n        endpoints.MapControllers();\n    });\n}\n\n// WeatherForecastController.cs\n\
    [ApiController]\n[Route(\"api/[controller]\")]\npublic class WeatherForecastController\
    \ : ControllerBase\n{\n    [HttpGet]\n    public IEnumerable<WeatherForecast>\
    \ Get()\n    {\n        var rng = new Random();\n        return Enumerable.Range(1,\
    \ 5).Select(index => new WeatherForecast\n        {\n            Date = DateTime.Now.AddDays(index),\n\
    \            TemperatureC = rng.Next(-20, 55),\n            Summary = Summaries[rng.Next(Summaries.Length)]\n\
    \        })\n        .ToArray();\n    }\n}\n```\n\n这段代码设置了一个简单的 API 端点 `/api/weatherforecast`，它返回一个天气预报列表。\n\
    \n### Angular 14\n\n`Angular` 是由 Google 开发的一个强大的前端框架，用于构建动态的单页 Web 应用程序。`Angular\
    \ 14` 引入了新的特性和优化，以提升开发者体验和应用程序性能。\n\n让我们创建一个 `Angular` 组件，它调用我们之前创建的 API 端点并显示天气预报数据：\n\
    \n```typescript\n// weather-forecast.component.ts\nimport { Component, OnInit\
    \ } from '@angular/core';\nimport { HttpClient } from '@angular/common/http';\n\
    \n@Component({\n  selector: 'app-weather-forecast',\n  templateUrl: './weather-forecast.component.html',\n\
    \  styleUrls: ['./weather-forecast.component.css']\n})\nexport class WeatherForecastComponent\
    \ implements OnInit {\n  forecasts: any[];\n\n  constructor(private http: HttpClient)\
    \ { }\n\n  ngOnInit(): void {\n    this.http.get<any[]>('https://localhost:5001/api/weatherforecast').subscribe(data\
    \ => {\n      this.forecasts = data;\n    });\n  }\n}\n```\n\n在这个 `Angular` 组件中，我们使用\
    \ `HttpClient` 模块向我们的 `ASP.NET Core` API 端点发送 HTTP GET 请求，并检索天气预报数据。\n\n### HTML\
    \ 模板\n\n现在，让我们创建 HTML 模板，以便在我们的 `Angular` 组件中显示天气预报数据：\n\n```html\n<!-- weather-forecast.component.html\
    \ -->\n<div *ngIf=\"forecasts\">\n  <h2>Weather Forecasts</h2>\n  <ul>\n    <li\
    \ *ngFor=\"let forecast of forecasts\">\n      Date: {{ forecast.date | date }},\
    \ Temperature: {{ forecast.temperatureC }}°C, Summary: {{ forecast.summary }}\n\
    \    </li>\n  </ul>\n</div>\n```\n\n这个 HTML 模板使用了 `Angular` 的数据绑定和结构指令（`*ngIf`\
    \ 和 `*ngFor`）来动态显示从 API 获取的天气预报数据。\n\n通过结合使用 `ASP.NET Core 8` 进行后端 API 开发和 `Angular\
    \ 14` 进行前端开发，你将获得一个强大且现代化的技术栈，用于构建可扩展的 Web 应用程序。`ASP.NET Core` 在创建 RESTful API\
    \ 方面的健壮性，与 `Angular` 在创建动态和交互式用户界面方面的能力相辅相成，使它们成为 Web 开发项目的绝佳选择。\n\n"
- fmt: "## 2. Installing Visual Studio Code\n\nVisual Studio Code (VS Code) is a lightweight\
    \ and powerful code editor that is highly extensible and supports a wide range\
    \ of programming languages and frameworks, including Angular development. Here\
    \ are the steps to install Visual Studio Code for Angular 14 development:\n\n\
    1.  **Download Visual Studio Code**: Go to the official Visual Studio Code website\
    \ (https://code.visualstudio.com/) and download the appropriate version for your\
    \ operating system (Windows, macOS, or Linux).\n2.  **Install Visual Studio Code**:\
    \ Once the installer is downloaded, run it to install Visual Studio Code on your\
    \ system. Usually, the installation procedure is simple, requiring you to agree\
    \ to the license terms and select installation preferences.\n3.  **Install Angular\
    \ Essentials Extension**: Open Visual Studio Code after installation. One of the\
    \ first things you'll want to do is install the Angular Essentials extension pack,\
    \ which includes essential extensions for Angular development. To do this:\n \
    \   *   Select the Extensions icon from the sidebar (or use the shortcut `Ctrl+Shift+X`).\n\
    \    *   Search for \"Angular Essentials\" in the Extensions Marketplace.\n  \
    \  *   Click Install to install the extension pack.\n4.  **Install .NET Core SDK**:\
    \ In addition to Visual Studio Code, you'll need to install the .NET Core SDK\
    \ separately to work with ASP.NET Core projects. You can download the SDK from\
    \ the official .NET website (https://dotnet.microsoft.com/download).\n5.  **Set\
    \ Up Angular CLI (Optional)**: If you plan to create new Angular projects using\
    \ the Angular CLI, you'll need to install it globally on your system. Launch a\
    \ terminal within Visual Studio Code and execute this command:\n    ```\n    npm\
    \ install -g @angular/cli\n    ```\n6.  **Start Coding**: With Visual Studio Code,\
    \ Angular Essentials extension, .NET Core SDK, and Angular CLI (if needed) installed,\
    \ you're ready to start coding ASP.NET Core 8 APIs and Angular 14 frontend applications.\n\
    \nInstalling Visual Studio or Visual Studio Code for ASP.NET Core 8 and Angular\
    \ 14 development involves downloading the respective installers, selecting the\
    \ necessary components or extensions, and completing the installation process.\
    \ Once installed, you have a powerful development environment to create and build\
    \ modern web applications seamlessly.\n\n## Configuring ASP.NET Core 8 and Angular\
    \ 14 Development Tools\n\nConfiguring development tools for ASP.NET Core 8 and\
    \ Angular 14 is essential to ensure a smooth development experience. In this guide,\
    \ we'll walk through the steps to set up the necessary tools and configurations\
    \ for both backend (ASP.NET Core) and frontend (Angular) development.\n\n### 1.\
    \ Installing Required Software\n\nBefore we dive into configuring specific tools,\
    \ make sure you have the following software installed on your development machine:\n\
    \n*   **Visual Studio or Visual Studio Code**: Choose one based on your preference.\
    \ Visual Studio is a full-featured IDE, while Visual Studio Code is a lightweight\
    \ code editor.\n*   **Node.js and npm**: Angular requires `Node.js` and `npm`\
    \ (Node Package Manager) for managing dependencies and running scripts. You have\
    \ the option to download and install `Node.js` from its official website at [https://nodejs.org/](https://nodejs.org/).\n\
    *   **.NET Core SDK**: Install the .NET Core SDK from the official .NET website\
    \ (https://dotnet.microsoft.com/download) as it is required for ASP.NET Core development.\n\
    \n### 2. Configuring ASP.NET Core 8\n\nIf you are using Visual Studio, the setup\
    \ process for ASP.NET Core projects is streamlined within the IDE. If you are\
    \ using Visual Studio Code, you'll need to set up your ASP.NET Core project manually\
    \ or through the command line.\n\n#### Using Visual Studio\n\n1.  **Create a New\
    \ ASP.NET Core Project**: Open Visual Studio and create a new ASP.NET Core Web\
    \ Application project. Choose the appropriate template based on your project requirements\
    \ (e.g., API, MVC, Razor Pages).\n2.  **Configure Startup and Middleware**: In\
    \ the `Startup.cs` file of your ASP.NET Core project, configure middleware, services,\
    \ and routing based on your application needs. For example, to enable CORS (Cross-Origin\
    \ Resource Sharing), you can add the following code in the `ConfigureServices`\
    \ method:\n    ```csharp\n    services.AddCors(options =>\n    {\n        options.AddPolicy(\"\
    AllowAll\",\n            builder =>\n            {\n                builder.AllowAnyOrigin()\n\
    \                       .AllowAnyMethod()\n                       .AllowAnyHeader();\n\
    \            });\n    });\n    ```\n3.  **Create Controllers and Models**: Create\
    \ ASP.NET Core controllers to handle API endpoints. Define models to represent\
    \ your data structures. Here is a sample of a basic controller:\n    ```csharp\n\
    \    [ApiController]\n    [Route(\"api/[controller]\")]\n    public class TodoController\
    \ : ControllerBase\n    {\n        private readonly ITodoRepository _todoRepository;\n\
    \n        public TodoController(ITodoRepository todoRepository)\n        {\n \
    \           _todoRepository = todoRepository;\n        }\n\n        [HttpGet]\n\
    \        public async Task<IActionResult> GetAllTodos()\n        {\n         \
    \   var todos = await _todoRepository.GetAllTodos();\n            return Ok(todos);\n\
    \        }\n\n        // Other CRUD actions can be added here\n    }\n    ```\n\
    4.  **Run and Test the Application**: You can run your ASP.NET Core application\
    \ directly from Visual Studio. Validate your API endpoints using tools such as\
    \ Postman or Swagger.\n\n#### Using Visual Studio Code\n\n1.  **Create a New ASP.NET\
    \ Core Project**: Open a terminal in Visual Studio Code and use the .NET CLI to\
    \ create a new ASP.NET Core project. For example, to create a Web API project,\
    \ run:\n    ```\n    dotnet new webapi -n MyWebApi\n    ```\n2.  **Install Required\
    \ Packages**: If your project requires additional packages or dependencies, use\
    \ `npm` for frontend dependencies and NuGet for backend dependencies.\n3.  **Configure\
    \ CORS and Middleware**: Similar to Visual Studio setup, configure middleware,\
    \ services, and other configurations in the `Startup.cs` file manually.\n4.  **Add\
    \ Controllers and Models**: Create controllers and models as needed for your application\
    \ logic. Use the `dotnet` CLI or Visual Studio Code's built-in features to scaffold\
    \ controllers and CRUD operations.\n5.  **Run and Test the Application**: Use\
    \ the `dotnet run` command to run your ASP.NET Core application from the terminal.\
    \ Validate your API endpoints using tools such as Postman or Swagger.\n\n### 3.\
    \ Configuring Angular 14\n\nAngular development requires setting up Angular CLI,\
    \ creating components, services, and managing dependencies. Let's go through the\
    \ steps to configure Angular 14 in your project.\n\n1.  **Create a New Angular\
    \ Project**: Open a terminal in Visual Studio Code or any preferred code editor\
    \ and create a new Angular project using Angular CLI. Run the following command:\n\
    \    ```\n    ng new my-angular-app\n    ```\n2.  **Install Angular Material (Optional)**:\
    \ If you plan to use Angular Material for UI components, you can install it by\
    \ running:\n    ```\n    ng add @angular/material\n    ```\n3.  **Create Components\
    \ and Services**: Use Angular CLI to generate components, services, modules, etc.\
    \ For example, to create a new component, run:\n    ```\n    ng generate component\
    \ my-component\n    ```\n4.  **Configure HttpClient Module**: If your Angular\
    \ application needs to communicate with the backend API (ASP.NET Core), configure\
    \ the `HttpClientModule` in your Angular app module (`app.module.ts`). Import\
    \ and include `HttpClientModule` in the imports list.\n    ```typescript\n   \
    \ import { HttpClientModule } from '@angular/common/http';\n\n    @NgModule({\n\
    \      declarations: [\n        // Your components\n      ],\n      imports: [\n\
    \        BrowserModule,\n        HttpClientModule\n      ],\n      providers:\
    \ [],\n      bootstrap: [AppComponent]\n    })\n    export class AppModule { }\n\
    \    ```\n5.  **Consuming Backend APIs**: Use Angular's `HttpClient` to make HTTP\
    \ requests to your ASP.NET Core API endpoints. Here's an example of a service\
    \ that makes an HTTP GET request:\n    ```typescript\n    import { Injectable\
    \ } from '@angular/core';\n    import { HttpClient } from '@angular/common/http';\n\
    \n    @Injectable({\n      providedIn: 'root'\n    })\n    export class ApiService\
    \ {\n      apiUrl = 'https://localhost:5001/api';\n\n      constructor(private\
    \ http: HttpClient) { }\n\n      getAllTodos() {\n        return this.http.get<any[]>(`${this.apiUrl}/todo`);\n\
    \      }\n\n      // Additional CRUD operations can be included in this section.\n\
    \    }\n    ```"
