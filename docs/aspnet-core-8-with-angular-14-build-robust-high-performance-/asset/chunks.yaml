  raw: '4\. Run the Application: Build and run your ASP.NET Core application using
    Visual Studio. This will start the development server, allowing you to test your
    Web API endpoints.


    3\. Testing the Web API:


    You can test your Web API using tools like Postman, which allows you to send HTTP
    requests and inspect the responses.


    1\. Open Postman: Launch Postman on your machine.


    2\. Send GET Request: Enter the URL of your Web API endpoint (e.g., `https://localhost:5001/api/values`)
    and choose the GET method. Submit the request to view the response.


    3\. Test Other Endpoints: Try testing other endpoints like POST, PUT, and DELETE
    using Postman. Provide appropriate data (if required) in the request body for
    POST and PUT requests.


    4\. Integration with Angular 14 (Optional): If you''re integrating your ASP.NET
    Core Web API with an Angular frontend, you can make HTTP requests from your Angular
    application to fetch data from the API.


    1\. Create Angular Service:


    In your Angular project, create a service to handle HTTP requests. For example,
    create a service named `ApiService`.


    ```typescript


    import { Injectable } from ''@angular/core'';


    import { HttpClient } from ''@angular/common/http'';


    import { Observable } from ''rxjs'';


    @Injectable({


    providedIn: ''root''


    })


    export class ApiService {


    apiUrl = ''https://localhost:5001/api/values''; // Update URL as per your API


    constructor(private http: HttpClient) { }


    getValues(): Observable<string[]> {


    return this.http.get<string[]>(this.apiUrl);


    }


    // Implement other HTTP methods as needed (POST, PUT, DELETE)


    }


    ```


    2\. Use the Service in Components: Inject the `ApiService` in your Angular components
    where you need to make API requests.


    ```typescript


    import { Component, OnInit } from ''@angular/core'';


    import { ApiService } from ''./api.service'';


    @Component({


    selector: ''app-root'',


    templateUrl: ''./app.component.html'',


    styleUrls: [''./app.component.css'']


    })


    export class AppComponent implements OnInit {


    values: string[] = [];


    constructor(private apiService: ApiService) {}


    ngOnInit(): void {


    this.apiService.getValues().subscribe(data => {


    this.values = data;


    });


    }


    }


    ```


    3\. Display Data in Angular Templates: Use Angular''s data binding to display
    the fetched data in your component''s HTML template.


    ```html


    <h1>Values from API:</h1>


    <ul>


    <li *ngFor="let value of values">{{ value }}</li>


    </ul>


    ```


    4\. Run Angular Application: Build and run your Angular application (`ng serve`)
    to see the data fetched from your ASP.NET Core Web API being displayed in the
    frontend.


    Creating an ASP.NET Core 8 Web API in Visual Studio involves setting up a project,
    creating controllers with API endpoints, and testing the API using tools like
    Postman. Integration with Angular 14 (or any frontend framework) allows you to
    build a full-stack application where the frontend communicates with the backend
    API to fetch and manipulate data. This approach enables you to develop scalable
    and interactive web applications with a clear separation of concerns between frontend
    and backend functionalities.


    Understanding Controllers and Routing


    Understanding controllers and routing is fundamental when building web applications
    using ASP.NET Core 8 for the backend and Angular 14 for the frontend. Controllers
    in ASP.NET Core handle incoming HTTP requests and generate responses, while routing
    maps URLs to specific controller actions. Let''s delve into these concepts with
    code examples for both ASP.NET Core and Angular.


    1\. Controllers in ASP.NET Core 8: Controllers in ASP.NET Core are classes that
    handle incoming HTTP requests and return appropriate responses. They are responsible
    for processing client requests, accessing data from models or services, and returning
    views or data in response to those requests.


    Here''s an example of a simple controller in ASP.NET Core:


    ```csharp


    using Microsoft.AspNetCore.Mvc;


    using System.Collections.Generic;


    namespace MyApp.Controllers


    {


    [ApiController]


    [Route("api/[controller]")]


    public class ProductsController : ControllerBase


    {


    private readonly IProductService _productService;


    public ProductsController(IProductService productService)


    {


    _productService = productService;


    }


    [HttpGet]


    public IEnumerable<Product> GetAllProducts()


    {


    return _productService.GetAllProducts();


    }


    [HttpGet("{id}")]


    public IActionResult GetProductById(int id)


    {


    var product = _productService.GetProductById(id);


    if (product == null)


    {


    return NotFound();


    }


    return Ok(product);


    }


    [HttpPost]


    public IActionResult CreateProduct([FromBody] Product product)


    {


    _productService.AddProduct(product);


    return CreatedAtAction(nameof(GetProductById), new { id = product.Id }, product);


    }


    [HttpPut("{id}")]


    public IActionResult UpdateProduct(int id, [FromBody] Product product)


    {


    var existingProduct = _productService.GetProductById(id);


    if (existingProduct == null)


    {


    return NotFound();


    }


    existingProduct.Name = product.Name;


    existingProduct.Price = product.Price;


    _productService.UpdateProduct(existingProduct);


    return NoContent();


    }


    [HttpDelete("{id}")]


    public IActionResult DeleteProduct(int id)


    {


    var existingProduct = _productService.GetProductById(id);


    if (existingProduct == null)


    {


    return NotFound();


    }


    _productService.DeleteProduct(id);


    return NoContent();


    }


    }


    }


    ```


    In this example, the `ProductsController` handles CRUD operations for products.
    It defines various HTTP methods (`HttpGet`, `HttpPost`, `HttpPut`, `HttpDelete`)
    that correspond to different actions on the product resource.


    2\. Routing in ASP.NET Core 8: Routing in ASP.NET Core maps incoming HTTP requests
    to specific controller actions based on the URL pattern. It enables the framework
    to determine which controller and action should handle each request.


    Routing is typically configured in the `Startup.cs` file using the `MapControllerRoute`
    method or attribute routing.


    Here''s an example of configuring routing in `Startup.cs` using attribute routing:


    ```csharp


    using Microsoft.AspNetCore.Builder;


    using Microsoft.AspNetCore.Hosting;


    using Microsoft.Extensions.DependencyInjection;


    using Microsoft.Extensions.Hosting;


    namespace MyApp


    {


    public class Startup


    {


    public void ConfigureServices(IServiceCollection services)


    {


    services.AddControllers();


    }


    public void Configure(IApplicationBuilder app, IWebHostEnvironment env)


    {


    if (env.IsDevelopment())


    {


    app.UseDeveloperExceptionPage();


    }


    app.UseRouting();


    app.UseEndpoints(endpoints =>


    {


    endpoints.MapControllers();


    });


    }


    }


    }


    ```


    In this example, we enable routing for controllers by calling `services.AddControllers()`
    in the `ConfigureServices` method. The `MapControllers` method in `UseEndpoints`
    sets up the default routing for the application.


    3\. Routing in Angular 14: In Angular, routing is used to navigate between different
    components based on the URL. Angular built-in `RouterModule` provides powerful
    routing capabilities.


    Here''s an example of configuring routing in Angular:


    1\. Create a Routing Module: Create a new module (e.g., `app-routing.module.ts`)
    for routing in your Angular project.


    ```typescript


    import { NgModule } from ''@angular/core'';


    import { RouterModule, Routes } from ''@angular/router'';


    import { HomeComponent } from ''./home/home.component'';


    import { ProductsComponent } from ''./products/products.component'';


    const routes: Routes = [


    { path: '''', component: HomeComponent },


    { path: ''products'', component: ProductsComponent }


    ];


    @NgModule({


    imports: [RouterModule.forRoot(routes)],


    exports: [RouterModule]


    })


    export class AppRoutingModule { }


    ```


    2\. Use Router Outlet: In your main `app.component.html`, use the `<router-outlet></router-outlet>`
    tag to render the components based on the route.


    ```html


    <router-outlet></router-outlet>


    ```


    3\. Define Components: Create Angular components for different views or pages
    (e.g., `home.component.ts`, `products.component.ts`).'
