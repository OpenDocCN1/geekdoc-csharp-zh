    Chapter 17


    Continuous Integration and Continuous Delivery (CI/CD)


    Automating builds and deployments is a crucial aspect of modern software development
    that helps ensure consistent releases, streamline development workflows, and improve
    overall productivity. In this guide, we''ll explore how to automate builds and
    deployments for web applications built with ASP.NET Core 8 on the backend and
    Angular 14 on the frontend using popular tools and practices.


    Backend: ASP.NET Core 8


    Continuous Integration and Continuous Deployment (CI/CD)


    1\. Setting Up CI/CD Pipeline:


    ● Use a CI/CD platform like Azure DevOps, GitHub Actions, or Jenkins to automate
    the build and deployment process.


    2\. CI Pipeline:


    ● Configure a CI pipeline to build, test, and package your ASP.NET Core application
    on each code commit or pull request.


    ```yaml


    # azure-pipelines.yml


    trigger:


    branches:


    include:


    - main


    - development


    pool:


    vmImage: ''windows-latest''


    jobs:


    - job: Build


    steps:


    - task: DotNetCoreCLI@2


    inputs:


    command: ''build''


    projects: ''**/*.csproj''


    arguments: ''--configuration Release''


    - task: DotNetCoreCLI@2


    inputs:


    command: ''test''


    projects: ''**/*Tests.csproj''


    arguments: ''--configuration Release''


    - task: DotNetCoreCLI@2


    inputs:


    command: ''publish''


    publishWebProjects: true


    arguments: ''--configuration Release --output $(Build.ArtifactStagingDirectory)/publish''


    - task: PublishPipelineArtifact@1


    inputs:


    targetPath: ''$(Build.ArtifactStagingDirectory)/publish''


    artifact: ''publish''


    ```


    3\. CD Pipeline:


    ● Configure a CD pipeline to deploy the built artifacts to your target environment
    (e.g., Azure App Service, Docker, etc.).


    ```yaml


    # azure-pipelines.yml (CD section)


    - deployment: Deploy


    pool:


    vmImage: ''windows-latest''


    environment: ''production''


    strategy:


    runOnce:


    deploy:


    steps:


    - task: AzureWebApp@1


    inputs:


    azureSubscription: ''AzureSubscription''


    appName: ''YourApp''


    package: $(Pipeline.Workspace)/publish/*.zip


    deploymentMethod: ''zipDeploy''


    ```


    Frontend: Angular 14


    Automated Builds and Deployments


    1\. Angular CLI Build:


    ● Use Angular CLI commands for building and packaging your Angular application.


    ```bash


    ng build --prod


    ```


    2\. Automating Deployment:


    ● Use a CI/CD platform or scripts to automate the deployment of your Angular application.


    ```yaml


    # Example GitHub Actions workflow for Angular deployment


    name: Angular Deployment


    on:


    push:


    branches:


    - main


    jobs:


    build:


    runs-on: ubuntu-latest


    steps:


    - uses: actions/checkout@v2


    - name: Setup Node.js


    uses: actions/setup-node@v2


    with:


    node-version: ''14''


    - name: Install Angular CLI


    run: npm install -g @angular/cli


    - name: Build Angular App


    run: ng build --prod


    - name: Deploy to GitHub Pages


    uses: JamesIves/github-pages-deploy-action@4.1.2


    with:


    ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}


    BRANCH: gh-pages


    FOLDER: dist/your-angular-app


    ```


    Benefits of Automated Builds and Deployments


    1\. Consistency:


    ● Automation ensures consistent builds and deployments across environments, reducing
    human errors and configuration drift.


    2\. Efficiency:


    ● Developers can focus more on coding and less on manual build and deployment
    tasks, leading to faster release cycles.


    3\. Reliability:


    ● Automated testing and deployment pipelines help catch issues early and ensure
    a reliable release process.


    4\. Scalability:


    ● As your application and team grow, automation scales seamlessly to handle increased
    complexity and workload.


    Automating builds and deployments for ASP.NET Core 8 and Angular 14 applications
    is a best practice that improves development efficiency, reduces errors, and enables
    faster and more reliable releases. By leveraging CI/CD platforms, version control
    systems, and scripting tools, teams can establish a robust pipeline for continuous
