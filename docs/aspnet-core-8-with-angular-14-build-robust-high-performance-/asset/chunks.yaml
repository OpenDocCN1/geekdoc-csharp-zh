    Displaying and Managing User Data in Angular Components


    Displaying and managing user data in Angular components involves fetching user
    data from the backend API (built with ASP.NET Core 8) and presenting it in the
    frontend using Angular components. Let''s walk through how to achieve this with
    code examples.


    1\. Angular Service for User Data: First, create an Angular service to handle
    HTTP requests for user data from the backend API.


    ```typescript


    // user.service.ts


    import { Injectable } from ''@angular/core'';


    import { HttpClient } from ''@angular/common/http'';


    import { Observable } from ''rxjs'';


    import { User } from ''./user.model''; // Assuming you have a User model


    @Injectable({


    providedIn: ''root''


    })


    export class UserService {


    private apiUrl = ''https://your-api-url/api/user/'';


    constructor(private http: HttpClient) {}


    getUsers(): Observable<User[]> {


    return this.http.get<User[]>(this.apiUrl);


    }


    getUserById(id: number): Observable<User> {


    return this.http.get<User>(`${this.apiUrl}${id}`);


    }


    addUser(user: User): Observable<User> {


    return this.http.post<User>(this.apiUrl, user);


    }


    updateUser(user: User): Observable<User> {


    return this.http.put<User>(`${this.apiUrl}${user.id}`, user);


    }


    deleteUser(id: number): Observable<any> {


    return this.http.delete(`${this.apiUrl}${id}`);


    }


    }


    ```


