    \n基于角色的授权通过确保只有具有特定角色的授权用户才能访问应用程序内的受保护资源来增强安全性。通过在 ASP.NET Core 8 后端 API 中实现基于角色的授权，并使用路由守卫和授权服务将其与\
    \ Angular 14 前端集成，你可以有效地实施访问控制。这种方法有助于根据用户角色和权限维护数据的机密性、完整性以及整体应用程序安全性。\n\n##\
    \ 第 6 章：部署 ASP.NET Core 8 Web API\n\n### 为生产环境发布 ASP.NET Core 应用程序\n\n为生产环境发布\
    \ ASP.NET Core 应用程序涉及为部署准备应用程序、配置生产设置以及将其部署到托管环境。以下是关于如何为生产环境发布 ASP.NET Core 8\
    \ 应用程序（包括 Angular 14 前端集成）的指南。\n\n1.  **为生产环境准备 ASP.NET Core 应用程序：** 在发布之前，确保你的\
    \ ASP.NET Core 应用程序已针对生产使用进行了优化。\n    1.  **优化代码和资源：**\n        *   压缩和打包 JavaScript\
    \ 和 CSS 文件以减少加载时间。\n        *   为静态文件启用压缩以减少带宽使用。\n        *   移除不必要的日志记录和调试信息。\n\
    \    2.  **配置生产环境：** 使用生产特定的设置（如数据库连接字符串、日志级别和安全配置）更新你的 `appsettings.json` 或 `appsettings.Production.json`\
    \ 文件。\n    3.  **设置环境变量：** 为 API 密钥或连接字符串等敏感信息配置环境变量。在代码中使用 `IConfiguration` 或\
    \ `IOptions` 模式访问这些变量。\n\n2.  **发布 ASP.NET Core 应用程序：** 你可以使用 Visual Studio 或命令行发布\
    \ ASP.NET Core 应用程序。以下是使用命令行的方法：\n    1.  **打开命令提示符：** 打开命令提示符或终端窗口。\n    2. \
    \ **导航到项目目录：** 更改目录到你的 ASP.NET Core 项目文件夹。\n        ```bash\n        cd path/to/your/project\n\
    \        ```\n    3.  **发布命令：** 运行 `dotnet publish` 命令来发布你的应用程序。\n        ```bash\n\
    \        dotnet publish -c Release\n        ```\n        如果你有用于生产的自定义配置，请将 `-c\
    \ Release` 替换为 `-c Production`。\n    4.  **输出目录：** 成功发布后，你的应用程序文件将被放置在指定的输出目录中（通常是\
    \ `bin/Release/netcoreappX.X/publish`）。\n\n3.  **部署 ASP.NET Core 应用程序：** 发布后，将你的\
    \ ASP.NET Core 应用程序部署到托管环境。你可以选择各种托管选项，如 IIS、Azure App Service、Docker 容器或 AWS\
    \ 或 Google Cloud 等云平台。\n    1.  **部署到 IIS：**\n        *   在服务器上安装 .NET Core Hosting\
    \ Bundle。\n        *   在 IIS 中创建一个新的站点或应用程序池，并将其配置为指向已发布的文件夹。\n        *   设置适当的权限和绑定（HTTP\
    \ 或 HTTPS）。\n    2.  **部署到 Azure App Service：**\n        *   为你的应用程序创建一个 Azure\
    \ App Service（Web 应用）。\n        *   使用 Azure DevOps、Visual Studio 发布或 FTP 将你发布的文件部署到\
    \ App Service。\n    3.  **使用 Docker 部署：**\n        *   使用 `Dockerfile` 将你的 ASP.NET\
    \ Core 应用程序容器化。\n        *   构建一个 Docker 镜像并将其上传到容器注册表。\n        *   将 Docker\
    \ 镜像部署到容器运行时环境，如 Docker Swarm 或 Kubernetes。\n\n4.  **集成 Angular 14 前端：** 如果你的\
    \ ASP.NET Core 应用程序包含 Angular 14 前端，请在发布和部署过程中将其集成。\n    1.  **Angular 构建：** 在发布\
    \ ASP.NET Core 应用程序之前，为生产环境构建你的 Angular 前端。\n        ```bash\n        ng build\
    \ --prod\n        ```\n        此命令会在你的 Angular 项目的 `dist` 文件夹中生成优化的、可用于生产的文件。\n\
    \    2.  **与 Angular 一起发布：** 将 Angular 生产文件（`dist` 文件夹）包含在你的 ASP.NET Core 应用程序的发布输出中。\n\
    \        ```bash\n        dotnet publish -c Release --output path/to/publish --source\
    \ path/to/angular/dist\n        ```\n    3.  **部署组合应用程序：** 将组合的 ASP.NET Core 和\
    \ Angular 应用程序部署到你选择的托管环境，确保为后端 API 端点和前端路由进行正确的配置和路由。\n\n5.  **监控和维护：** 部署后，监控你的应用程序的性能、错误和安全问题。设置日志记录和监控工具以跟踪应用程序健康状况和用户交互。定期更新依赖项、应用安全补丁并执行维护任务，以确保生产环境平稳且安全。\n\
    \n通过遵循这些步骤，你可以成功地为生产环境发布和部署集成了 Angular 14 前端的 ASP.NET Core 8 应用程序，为用户提供可靠且可扩展的\
    \ Web 应用程序体验。\n\n### 在 Azure App Service 或云平台上托管\n\n在 Azure App Service 或 AWS\
    \ 或 Google Cloud 等其他云平台上托管集成了 Angular 14 前端的 ASP.NET Core 8 应用程序，可提供可扩展性、可靠性和部署的便捷性。在本指南中，我们将重点介绍在\
    \ Azure App Service 上的托管，包括部署和配置步骤。\n\n1.  **为 Azure App Service 准备你的应用程序：** 在部署到\
    \ Azure App Service 之前，确保你的应用程序已准备好进行生产部署。\n    *   使用 `ng build --prod` 为生产环境构建你的\
    \ Angular 前端。\n    *   使用 `dotnet publish -c Release` 发布你的 ASP.NET Core 后端。\n\
    2.  **配置更新：** 使用生产设置（包括连接字符串、API 端点和安全配置）更新你的应用程序配置文件（`appsettings.json`、环境变量等）。\n\
    3.  **准备部署：** 确保你拥有必要的部署脚本或配置，以便顺利进行部署过程。\n\n2.  **部署到 Azure App Service：** 按照以下步骤将集成了\
    \ Angular 14 前端的 ASP.NET Core 8 应用程序部署到 Azure App Service。\n    1.  **创建 Azure\
