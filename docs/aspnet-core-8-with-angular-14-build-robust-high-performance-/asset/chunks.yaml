    Entity Framework Core 8 simplifies database access in ASP.NET Core 8 applications
    by providing a high-level ORM framework. By following the steps outlined above,
    you can effectively integrate EF Core with your ASP.NET Core backend and Angular
    14 frontend to perform CRUD operations and manage data seamlessly. This approach
    enhances productivity and maintainability in web application development.


    Modeling Data Entities and Relationships


    Modeling data entities and relationships is a crucial aspect of designing database-driven
    applications. In this guide, we''ll explore how to model data entities and relationships
    using Entity Framework Core 8 in an ASP.NET Core 8 backend application and integrate
    it with an Angular 14 frontend.


    1\. Defining Data Entities in ASP.NET Core 8: Data entities represent the objects
    that map to tables in the database. With Entity Framework Core, you define these
    entities as C# classes, and EF Core handles the mapping to the underlying database
    tables.


    Let''s consider an example of an e-commerce application with entities such as
    `Product` and `Category`.


    1\. Create Data Model Classes: Define your data model classes in the ASP.NET Core
    project. For example:


    ```csharp


    public class Product


    {


    This represents a public integer identifier { get; set; }


    This denotes a public string variable named "Name" { get; set; }


    This indicates a public decimal variable named "Price" { get; set; }


    // Navigation property for Category


    public integer CategoryId { get; set; }


    public Category Category { get; set; }


    }


    public class Category


    {


    This represents a public integer identifier { get; set; }


    This denotes a public string variable named "Name" { get; set; }


    // Navigation property for Products


    public List<Product> Products { get; set; }


    }


    ```


    In this example, the `Product` class has a navigation property `Category` representing
    the relationship between products and categories. Similarly, the `Category` class
    has a collection of products.


    2\. DbContext Configuration: Update your `DbContext` class to include these entities:


    ```csharp


    public class ApplicationDbContext : DbContext


    {


    public ApplicationDbContext(DbContextOptions<ApplicationDbContext> options)


    : base(options)


    {


    }


    public DbSet<Product> Products { get; set; }


    public DbSet<Category> Categories { get; set; }


    protected override void OnModelCreating(ModelBuilder modelBuilder)


    {


    // Configure relationships


    modelBuilder.Entity<Product>()


    .HasOne(p => p.Category)


    .WithMany(c => c.Products)


    .HasForeignKey(p => p.CategoryId);


    }


    }


    ```


    The `OnModelCreating` method is used to configure relationships between entities.


    2\. Integrating with Angular 14 Frontend: Once you have modeled your data entities
    in the ASP.NET Core backend, you can integrate them with an Angular 14 frontend
    to fetch and display data.


    1\. Angular Models: Create corresponding TypeScript models in your Angular project
    to represent the data entities. For example:


    ```typescript


    export interface Product {


    id: number;


    name: string;


    price: number;


    categoryId: number;


    category: Category;


    }


    export interface Category {


    id: number;


    name: string;


    products: Product[];


    }


    ```


    2\. Angular Service: Modify your Angular service to fetch data from the ASP.NET
    Core API endpoint:


    ```typescript


    import { Injectable } from ''@angular/core'';


    import { HttpClient } from ''@angular/common/http'';


    import { Observable } from ''rxjs'';


    import { Product, Category } from ''./models'';


    @Injectable({


    providedIn: ''root''


    })


    export class DataService {


    private apiUrl = ''https://localhost:5001/api''; // API endpoint URL


    constructor(private http: HttpClient) { }


    getProducts(): Observable<Product[]> {


    return this.http.get<Product[]>(`${this.apiUrl}/products`);


    }


    getCategories(): Observable<Category[]> {


    return this.http.get<Category[]>(`${this.apiUrl}/categories`);


    }


    // Add other CRUD methods as needed


    }


    ```


    3\. Angular Component Usage: In your Angular components, use the data service
    to fetch and display data:


    ```typescript


    import { Component, OnInit } from ''@angular/core'';


    import { DataService } from ''./data.service'';


    import { Product, Category } from ''./models'';


    @Component({


    selector: ''app-product-list'',


    templateUrl: ''./product-list.component.html''


    })


    export class ProductListComponent implements OnInit {


    products: Product[] = [];


    constructor(private dataService: DataService) { }


    ngOnInit(): void {


    this.dataService.getProducts().subscribe(products => {


    this.products = products;


    });


    }


    }


    ```


    4\. Displaying Data in Angular Templates: Use Angular''s data binding to display
    data in your component templates:


    ```html


    <h1>Products</h1>


    <ul>


    <li *ngFor="let product of products">


    {{ product.name }} - ${{ product.price }} - Category: {{ product.category.name
    }}


    </li>


    </ul>


    ```


    Modeling data entities and relationships in ASP.NET Core 8 with Entity Framework
    Core 8 provides a structured approach to database design. By defining entities,
    configuring relationships, and integrating with an Angular 14 frontend, you can
    create a robust application that efficiently manages and displays data. This separation
    of concerns between the backend and frontend helps in building scalable and maintainable
    web applications.


    Creating CRUD Operations (Create, Read, Update, Delete) with Web APIs


    Creating CRUD (Create, Read, Update, Delete) operations with Web APIs is a fundamental
    aspect of building modern web applications. In this guide, we''ll demonstrate
    how to implement CRUD operations using ASP.NET Core 8 for the backend API and
    integrate it with an Angular 14 frontend.


    1\. Setting Up ASP.NET Core Web API: First, let''s set up an ASP.NET Core Web
    API project to handle CRUD operations for a sample entity, such as `Product`.


    1\. Create ASP.NET Core Web API Project: Open Visual Studio and create a new ASP.NET
    Core Web API project.


    2\. Create Data Model: Define a data model class for your entity (e.g., `Product`):


    ```csharp


    public class Product


    {


    This represents a public integer identifier { get; set; }


    This denotes a public string variable named "Name"{ get; set; }


    This indicates a public decimal variable named "Price"{ get; set; }


    }


    ```


    3\. Create a Controller: Add a controller to handle CRUD operations for the `Product`
    entity. Right-click on the `Controllers` folder and add a new controller named
    `ProductsController`.'
  trans: "\n# 建模数据实体与关系\n\n建模数据实体与关系是设计数据库驱动应用程序的关键环节。在本指南中，我们将探讨如何在 ASP.NET Core\
    \ 8 后端应用中使用 Entity Framework Core 8 来建模数据实体与关系，并将其与 Angular 14 前端集成。\n\n## 1.\
    \ 在 ASP.NET Core 8 中定义数据实体\n\n数据实体代表映射到数据库表的对象。通过 Entity Framework Core，你可以将这些实体定义为\
    \ C#类，而 EF Core 会处理与底层数据库表的映射。\n\n让我们以一个电子商务应用为例，其中包含`Product`和`Category`等实体。\n\
    \n### 1.1 创建数据模型类\n\n在 ASP.NET Core 项目中定义你的数据模型类。例如：\n\n```csharp\npublic class\
    \ Product\n{\n    public int Id { get; set; }\n    public string Name { get; set;\
    \ }\n    public decimal Price { get; set; }\n    // Category 的导航属性\n    public\
    \ int CategoryId { get; set; }\n    public Category Category { get; set; }\n}\n\
    \npublic class Category\n{\n    public int Id { get; set; }\n    public string\
    \ Name { get; set; }\n    // Products 的导航属性\n    public List<Product> Products\
    \ { get; set; }\n}\n```\n\n在此示例中，`Product`类有一个导航属性`Category`，表示产品与类别之间的关系。类似地，`Category`类有一个产品集合。\n\
    \n### 1.2 DbContext 配置\n\n更新你的`DbContext`类以包含这些实体：\n\n```csharp\npublic class\
    \ ApplicationDbContext : DbContext\n{\n    public ApplicationDbContext(DbContextOptions<ApplicationDbContext>\
    \ options)\n        : base(options)\n    {\n    }\n\n    public DbSet<Product>\
    \ Products { get; set; }\n    public DbSet<Category> Categories { get; set; }\n\
    \n    protected override void OnModelCreating(ModelBuilder modelBuilder)\n   \
    \ {\n        // 配置关系\n        modelBuilder.Entity<Product>()\n            .HasOne(p\
    \ => p.Category)\n            .WithMany(c => c.Products)\n            .HasForeignKey(p\
    \ => p.CategoryId);\n    }\n}\n```\n\n`OnModelCreating`方法用于配置实体之间的关系。\n\n## 2.\
    \ 与 Angular 14 前端集成\n\n在 ASP.NET Core 后端建模好数据实体后，你可以将其与 Angular 14 前端集成，以获取和显示数据。\n\
    \n### 2.1 Angular 模型\n\n在你的 Angular 项目中创建相应的 TypeScript 模型来表示数据实体。例如：\n\n```typescript\n\
    export interface Product {\n    id: number;\n    name: string;\n    price: number;\n\
    \    categoryId: number;\n    category: Category;\n}\n\nexport interface Category\
    \ {\n    id: number;\n    name: string;\n    products: Product[];\n}\n```\n\n\
    ### 2.2 Angular 服务\n\n修改你的 Angular 服务，以便从 ASP.NET Core API 端点获取数据：\n\n```typescript\n\
    import { Injectable } from '@angular/core';\nimport { HttpClient } from '@angular/common/http';\n\
    import { Observable } from 'rxjs';\nimport { Product, Category } from './models';\n\
    \n@Injectable({\n    providedIn: 'root'\n})\nexport class DataService {\n    private\
    \ apiUrl = 'https://localhost:5001/api'; // API 端点 URL\n\n    constructor(private\
    \ http: HttpClient) { }\n\n    getProducts(): Observable<Product[]> {\n      \
    \  return this.http.get<Product[]>(`${this.apiUrl}/products`);\n    }\n\n    getCategories():\
    \ Observable<Category[]> {\n        return this.http.get<Category[]>(`${this.apiUrl}/categories`);\n\
    \    }\n\n    // 根据需要添加其他 CRUD 方法\n}\n```\n\n### 2.3 Angular 组件使用\n\n在你的 Angular\
    \ 组件中，使用数据服务来获取和显示数据：\n\n```typescript\nimport { Component, OnInit } from '@angular/core';\n\
    import { DataService } from './data.service';\nimport { Product, Category } from\
    \ './models';\n\n@Component({\n    selector: 'app-product-list',\n    templateUrl:\
    \ './product-list.component.html'\n})\nexport class ProductListComponent implements\
    \ OnInit {\n    products: Product[] = [];\n\n    constructor(private dataService:\
    \ DataService) { }\n\n    ngOnInit(): void {\n        this.dataService.getProducts().subscribe(products\
    \ => {\n            this.products = products;\n        });\n    }\n}\n```\n\n\
    ### 2.4 在 Angular 模板中显示数据\n\n使用 Angular 的数据绑定在组件模板中显示数据：\n\n```html\n<h1>Products</h1>\n\
    <ul>\n    <li *ngFor=\"let product of products\">\n        {{ product.name }}\
    \ - ${{ product.price }} - Category: {{ product.category.name }}\n    </li>\n\
    </ul>\n```\n\n在 ASP.NET Core 8 中使用 Entity Framework Core 8 建模数据实体与关系，为数据库设计提供了一种结构化的方法。通过定义实体、配置关系并与\
    \ Angular 14 前端集成，你可以创建一个强大的应用程序，高效地管理和显示数据。后端与前端之间的这种关注点分离有助于构建可扩展且易于维护的 Web\
    \ 应用程序。\n\n# 使用 Web API 创建 CRUD 操作（创建、读取、更新、删除）\n\n使用 Web API 创建 CRUD（创建、读取、更新、删除）操作是构建现代\
    \ Web 应用程序的基本方面。在本指南中，我们将演示如何使用 ASP.NET Core 8 实现后端 API 的 CRUD 操作，并将其与 Angular\
    \ 14 前端集成。\n\n## 1. 设置 ASP.NET Core Web API\n\n首先，让我们设置一个 ASP.NET Core Web API\
    \ 项目，以处理示例实体（如`Product`）的 CRUD 操作。\n\n### 1.1 创建 ASP.NET Core Web API 项目\n\n打开\
    \ Visual Studio 并创建一个新的 ASP.NET Core Web API 项目。\n\n### 1.2 创建数据模型\n\n为你的实体（例如`Product`）定义一个数据模型类：\n\
    \n```csharp\npublic class Product\n{\n    public int Id { get; set; }\n    public\
    \ string Name { get; set; }\n    public decimal Price { get; set; }\n}\n```\n\n\
    ### 1.3 创建控制器\n\n添加一个控制器来处理`Product`实体的 CRUD 操作。右键单击`Controllers`文件夹，添加一个名为`ProductsController`的新控制器。\n\
    \n## 2. 在 Angular 组件中使用 API\n\n将`ProductService`注入到你的 Angular 组件中，以获取和操作数据：\n\n\
    ```typescript\nimport { Component, OnInit } from '@angular/core';\nimport { ProductService\
    \ } from './product.service';\nimport { Product } from './product.model';\n\n\
    @Component({\n    selector: 'app-product-list',\n    templateUrl: './product-list.component.html'\n\
    })\nexport class ProductListComponent implements OnInit {\n    products: Product[]\
    \ = [];\n\n    constructor(private productService: ProductService) {}\n\n    ngOnInit():\
    \ void {\n        this.productService.getProducts().subscribe(data => {\n    \
    \        this.products = data;\n        });\n    }\n}\n```\n\n## 3. 在 Angular\
    \ 模板中显示数据\n\n使用 Angular 的数据绑定在组件模板中显示从 API 检索到的数据。\n\n```html\n<h1>Products</h1>\n\
    <ul>\n    <li *ngFor=\"let product of products\">\n        {{ product.id }} -\
    \ {{ product.name }} - ${{ product.price }}\n    </li>\n</ul>\n```\n\nEntity Framework\
    \ Core 8 通过提供高级 ORM 框架，简化了 ASP.NET Core 8 应用程序中的数据库访问。按照上述步骤，你可以有效地将 EF Core 与你的\
    \ ASP.NET Core 后端和 Angular 14 前端集成，以执行 CRUD 操作并无缝管理数据。这种方法提高了 Web 应用程序开发的生产力和可维护性。\n"
- fmt: "# ASP.NET Core 8 与 Angular 14 的 CRUD 操作与身份验证\n\n## 1. ASP.NET Core Web API\
    \ 控制器\n\n```csharp\n[ApiController]\n[Route(\"api/[controller]\")]\npublic class\
    \ ProductsController : ControllerBase\n{\n    private static List<Product> _products\
    \ = new List<Product>\n    {\n        new Product { Id = 1, Name = \"Product 1\"\
    , Price = 10.99m },\n        new Product { Id = 2, Name = \"Product 2\", Price\
    \ = 20.39m }\n    };\n\n    [HttpGet]\n    public IActionResult GetProducts()\n\
    \    {\n        return Ok(_products);\n    }\n\n    [HttpGet(\"{id}\")]\n    public\
    \ IActionResult GetProductById(int id)\n    {\n        var product = _products.FirstOrDefault(p\
    \ => p.Id == id);\n        if (product == null)\n        {\n            return\
    \ NotFound();\n        }\n        return Ok(product);\n    }\n\n    [HttpPost]\n\
    \    public IActionResult CreateProduct([FromBody] Product product)\n    {\n \
    \       product.Id = _products.Count + 1;\n        _products.Add(product);\n \
    \       return CreatedAtAction(nameof(GetProductById), new { id = product.Id },\
    \ product);\n    }\n\n    [HttpPut(\"{id}\")]\n    public IActionResult UpdateProduct(int\
    \ id, [FromBody] Product product)\n    {\n        var existingProduct = _products.FirstOrDefault(p\
    \ => p.Id == id);\n        if (existingProduct == null)\n        {\n         \
    \   return NotFound();\n        }\n        existingProduct.Name = product.Name;\n\
    \        existingProduct.Price = product.Price;\n        return NoContent();\n\
    \    }\n\n    [HttpDelete(\"{id}\")]\n    public IActionResult DeleteProduct(int\
    \ id)\n    {\n        var existingProduct = _products.FirstOrDefault(p => p.Id\
    \ == id);\n        if (existingProduct == null)\n        {\n            return\
    \ NotFound();\n        }\n        _products.Remove(existingProduct);\n       \
    \ return NoContent();\n    }\n}\n```\n\n在此控制器中：\n- `GetProducts`: 检索所有产品。\n- `GetProductById`:\
    \ 通过 ID 检索产品。\n- `CreateProduct`: 创建新产品。\n- `UpdateProduct`: 更新现有产品。\n- `DeleteProduct`:\
    \ 通过 ID 删除产品。\n\n## 2. 在 Angular 14 中使用 Web API\n\n接下来，我们将 ASP.NET Core Web API\
    \ 与 Angular 14 前端集成，以执行 CRUD 操作。\n\n### 2.1 用于 API 调用的 Angular 服务\n\n在你的 Angular\
    \ 项目中创建一个服务，使用 Angular 的 `HttpClient` 模块处理 API 调用。\n\n```typescript\nimport {\
    \ Injectable } from '@angular/core';\nimport { HttpClient } from '@angular/common/http';\n\
    import { Observable } from 'rxjs';\nimport { Product } from './product.model';\n\
    \n@Injectable({\n  providedIn: 'root'\n})\nexport class ProductService {\n  private\
    \ apiUrl = 'https://localhost:5001/api/products'; // API 端点 URL\n\n  constructor(private\
    \ http: HttpClient) { }\n\n  getProducts(): Observable<Product[]> {\n    return\
    \ this.http.get<Product[]>(this.apiUrl);\n  }\n\n  getProductById(id: number):\
    \ Observable<Product> {\n    return this.http.get<Product>(`${this.apiUrl}/${id}`);\n\
    \  }\n\n  createProduct(product: Product): Observable<Product> {\n    return this.http.post<Product>(this.apiUrl,\
    \ product);\n  }\n\n  updateProduct(id: number, product: Product): Observable<Product>\
    \ {\n    return this.http.put<Product>(`${this.apiUrl}/${id}`, product);\n  }\n\
    \n  deleteProduct(id: number): Observable<void> {\n    return this.http.delete<void>(`${this.apiUrl}/${id}`);\n\
    \  }\n}\n```\n\n### 2.2 Angular 组件使用\n\n在你的 Angular 组件中使用该服务与 Web API 交互。\n\n\
    ```typescript\nimport { Component, OnInit } from '@angular/core';\nimport { ProductService\
    \ } from './product.service';\nimport { Product } from './product.model';\n\n\
