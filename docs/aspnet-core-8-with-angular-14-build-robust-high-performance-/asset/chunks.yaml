    ```html


    <button (click)="navigateToProducts()">Go to Products</button>


    ```


    Controllers in ASP.NET Core handle HTTP requests and generate responses based
    on defined actions, while routing maps URLs to specific controller actions. In
    Angular, routing enables navigation between components based on the URL. Understanding
    these concepts and implementing them correctly is essential for building robust
    web applications with ASP.NET Core 8 for the backend and Angular 14 for the frontend.


    Handling HTTP Requests and Responses with ASP.NET Core MVC


    Handling HTTP requests and responses is a core aspect of building web applications
    with ASP.NET Core MVC for the backend and Angular 14 for the frontend. In this
    guide, we''ll explore how to handle various types of HTTP requests (GET, POST,
    PUT, DELETE) and responses in an ASP.NET Core MVC application and integrate it
    with an Angular 14 frontend.


    1\. Setting Up ASP.NET Core MVC Project: First, let''s create an ASP.NET Core
    MVC project in Visual Studio and set up the necessary controllers, models, and
    views.


    1\. Create ASP.NET Core MVC Project: Open Visual Studio and create a new ASP.NET
    Core Web Application project. Select the template "ASP.NET Core Web App (Model-View-Controller)."


    2\. Add Model Class: Create a model class to represent your data. As an illustration,
    let''s generate a `Product` model:


    ```csharp


    public class Product


    {


    This represents a public integer identifier { get; set; }


    This denotes a public string variable named "Name" { get; set; }


    This indicates a public decimal variable named "Price" { get; set; }


    }


    ```


    3\. Create Controller: Add a controller to handle HTTP requests related to products.
    Right-click on the `Controllers` folder and add a new controller named `ProductsController`.


    ```csharp


    using Microsoft.AspNetCore.Mvc;


    using System.Collections.Generic;


    using System.Linq;


    namespace MyApp.Controllers


    {


    [ApiController]


    [Route("api/[controller]")]


    public class ProductsController : ControllerBase


    {


    A static private List<Product> _products = new List<Product>


    {


    new Product { Id = 1, Name = "Product 1", Price = 10.99m },


    new Product { Id = 2, Name = "Product 2", Price = 20.39 }


    };


    [HttpGet]


    public IActionResult GetProducts()


    {


    return Ok(_products);


    }


    [HttpGet("{id}")]


    public IActionResult GetProductById(int id)


    {


    var product = _products.FirstOrDefault(p => p.Id == id);


    if (product == null)


    {


    return NotFound();


    }


    return Ok(product);


    }


    [HttpPost]


    public IActionResult CreateProduct([FromBody] Product product)


    {


    product.Id = _products.Count + 1;


    _products.Add(product);


    return CreatedAtAction(nameof(GetProductById), new { id = product.Id }, product);


    }


    [HttpPut("{id}")]


    public IActionResult UpdateProduct(int id, [FromBody] Product product)


    {


    var existingProduct = _products.FirstOrDefault(p => p.Id == id);


    if (existingProduct == null)


    {


    return NotFound();


    }


    existingProduct.Name = product.Name;


    existingProduct.Price = product.Price;


    return NoContent();


    }


    [HttpDelete("{id}")]


    public IActionResult DeleteProduct(int id)


    {


    var existingProduct = _products.FirstOrDefault(p => p.Id == id);


    if (existingProduct == null)


    {


    return NotFound();


    }


    _products.Remove(existingProduct);


    return NoContent();


    }


    }


    }


    ```


    2\. Handling HTTP Requests and Responses in ASP.NET Core MVC: Now that we have
    our ASP.NET Core MVC project set up with a `ProductsController`, let''s understand
    how each HTTP method is handled.


    ● GET Request: The `GetProducts` method handles a GET request to retrieve all
    products, while `GetProductById` handles a GET request to retrieve a specific
    product by its ID.


    ● POST Request: The `CreateProduct` method handles a POST request to create a
    new product. The product details are received in the request body (`[FromBody]`).


    ● PUT Request: The `UpdateProduct` method handles a PUT request to update an existing
    product. It expects the product ID in the URL and the updated product details
    in the request body.


    ● DELETE Request: The `DeleteProduct` method handles a DELETE request to delete
    a product by its ID.


    3\. Integrating with Angular 14 Frontend: Let''s integrate our ASP.NET Core MVC
    backend with an Angular 14 frontend to demonstrate handling HTTP requests and
    responses from the client side.


    1\. Create Angular Service: In your Angular project, create a service to handle
    HTTP requests to the ASP.NET Core API.


    ```typescript


    import { Injectable } from ''@angular/core'';


    import { HttpClient } from ''@angular/common/http'';


    import { Observable } from ''rxjs'';


    import { Product } from ''./product.model'';


    @Injectable({


    providedIn: ''root''


    })


    export class ProductService {


    private apiUrl = ''https://localhost:5001/api/products''; // Update URL as per
    your API


    constructor(private http: HttpClient) { }


    getProducts(): Observable<Product[]> {


    return this.http.get<Product[]>(this.apiUrl);


    }


    getProductById(id: number): Observable<Product> {


    return this.http.get<Product>(`${this.apiUrl}/${id}`);


    }


    createProduct(product: Product): Observable<Product> {


    return this.http.post<Product>(this.apiUrl, product);


    }


    updateProduct(id: number, product: Product): Observable<Product> {


    return this.http.put<Product>(`${this.apiUrl}/${id}`, product);


    }


    deleteProduct(id: number): Observable<void> {


    return this.http.delete<void>(`${this.apiUrl}/${id}`);


    }


    }


    ```


    2\. Use the Service in Angular Components: Inject the `ProductService` in your
    Angular components where you need to make API requests.


    ```typescript


    import { Component, OnInit } from ''@angular/core'';


    import { ProductService } from ''./product.service'';


    import { Product } from ''./product.model'';


    @Component({


    selector: ''app-products'',


    templateUrl: ''./products.component.html''


    })


    export class ProductsComponent implements OnInit {


    products: Product[] = [];


    constructor(private productService: ProductService) {}


    ngOnInit(): void {


    this.productService.getProducts().subscribe(data => {


    this.products = data;


    });


    }


    }


    ```


    3\. Display Data in Angular Templates: Use Angular''s data binding to display
    the fetched data in your component''s HTML template.


    ```html


    <h1>Products</h1>


    <ul>


    <li *ngFor="let product of products">


    {{ product.id }} - {{ product.name }} - ${{ product.price


    });


    }


    }


    ```


    4\. Add Create Product Functionality: In your Angular component where you want
    to create products, implement the logic to call the `createProduct` method from
    `ProductService`.


    ```typescript


    import { Component } from ''@angular/core'';


    import { ProductService } from ''./product.service'';


    import { Product } from ''./product.model'';


    @Component({


    selector: ''app-product-form'',


    templateUrl: ''./product-form.component.html''


    })


    export class ProductFormComponent {


    newProduct: Product = { id: 0, name: '''', price: 0 };


    constructor(private productService: ProductService) {}


    createProduct() {


    this.productService.createProduct(this.newProduct).subscribe(() => {


    // Refresh product list or perform other actions as needed


    this.newProduct = { id: 0, name: '''', price: 0 }; // Clear form after creation


    });


    }


    }


    ```


    5\. Add Update Product Functionality: Similarly, implement the logic to update
    products in your Angular component.'
  trans: "\n4\\. 在路由间导航：使用 Angular 的 `Router` 服务或 HTML 模板中的 `routerLink` 指令，通过编程方式或用户交互在路由间导航。\n\
