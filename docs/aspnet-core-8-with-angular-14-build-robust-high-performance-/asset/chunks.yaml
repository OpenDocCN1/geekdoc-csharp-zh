    Securing Web APIs with JWT (JSON Web Tokens)


    Ensuring the security of web APIs is vital to safeguard sensitive data and guarantee
    that only authorized users can reach particular resources. JSON Web Tokens (JWT)
    provide a reliable mechanism for securing APIs by generating tokens that carry
    user information and are validated on the server side. In this guide, we''ll explore
    how to secure web APIs with JWT using ASP.NET Core 8 for the backend API and integrate
    it with an Angular 14 frontend.


    1\. Setting Up JWT Authentication in ASP.NET Core: ASP.NET Core provides built-in
    support for JWT authentication through middleware and services.


    1\. Install JWT Packages: Start by installing the necessary JWT packages in your
    ASP.NET Core project. Open the NuGet Package Manager Console and run the following
    command:


    ```bash


    Install-Package Microsoft.AspNetCore.Authentication.JwtBearer


    ```


    2\. Configure JWT Authentication: Configure JWT authentication in your `Startup.cs`
    file.


    ```csharp


    public void ConfigureServices(IServiceCollection services)


    {


    // Other service configurations


    services.AddAuthentication(JwtBearerDefaults.AuthenticationScheme)


    .AddJwtBearer(options =>


    {


    options.TokenValidationParameters = new TokenValidationParameters


    {


    ValidateIssuer = true,


    ValidateAudience = true,


    ValidateLifetime = true,


    ValidateIssuerSigningKey = true,


    ValidIssuer = Configuration["Jwt:Issuer"],


    ValidAudience = Configuration["Jwt:Audience"],


    IssuerSigningKey = new SymmetricSecurityKey(Encoding.UTF8.GetBytes(Configuration["Jwt:SecretKey"]))


    };


    });


    // Other configurations


    }


    public void Configure(IApplicationBuilder app, IWebHostEnvironment env)


    {


    // Other app configurations


    app.UseAuthentication();


    app.UseAuthorization();


    // Other configurations


    }


    ```


    Ensure you have configured the JWT parameters such as issuer, audience, and secret
    key in your `appsettings.json` file.


    3\. Generate JWT Tokens: Create a service or controller method to generate JWT
    tokens when users authenticate successfully.


    ```csharp


    public class AuthController : ControllerBase


    {


    private readonly IConfiguration _configuration;


    public AuthController(IConfiguration configuration)


    {


    _configuration = configuration;


    }


    [HttpPost("login")]


    public IActionResult Login(LoginModel model)


    {


    // Validate user credentials (e.g., from database)


    var isValid = ...; // Your validation logic


    if (!isValid)


    {


    return Unauthorized();


    }


    var token = GenerateJwtToken();


    return Ok(new { token });


    }


    private string GenerateJwtToken()


    {


    var tokenHandler = new JwtSecurityTokenHandler();


    var key = Encoding.ASCII.GetBytes(_configuration["Jwt:SecretKey"]);


    var tokenDescriptor = new SecurityTokenDescriptor


    {


    Subject = new ClaimsIdentity(new[]


    {


    new Claim(ClaimTypes.Name, "username"),


    // Add more claims as needed


    }),


    Expires = DateTime.UtcNow.AddDays(1), // Token expiration time


    SigningCredentials = new SigningCredentials(new SymmetricSecurityKey(key), SecurityAlgorithms.HmacSha256Signature)


    };


    var token = tokenHandler.CreateToken(tokenDescriptor);


    return tokenHandler.WriteToken(token);


    }


    }


    ```


    2\. Integrating JWT Authentication in Angular 14: After setting up JWT authentication
    in the ASP.NET Core backend, you''ll integrate it with your Angular 14 frontend.


    1\. Angular Auth Service: Modify your authentication service in Angular to handle
    JWT token storage and HTTP requests with JWT headers.


    ```typescript


    import { Injectable } from ''@angular/core'';


    import { HttpClient, HttpHeaders } from ''@angular/common/http'';


    import { Observable } from ''rxjs'';


