    Chapter 6


    Deploying ASP.NET Core 8 Web APIs


    Publishing ASP.NET Core Applications for Production


    Publishing ASP.NET Core applications for production involves preparing your application
    for deployment, configuring production settings, and deploying it to a hosting
    environment. Here''s a guide on how to publish ASP.NET Core 8 applications for
    production, including Angular 14 frontend integration.


    1\. Prepare ASP.NET Core Application for Production: Before publishing, ensure
    that your ASP.NET Core application is optimized for production use.


    1\. Optimize Code and Assets:


    ● Minimize and bundle JavaScript and CSS files to reduce load times.


    ●     Enable compression for static files to reduce bandwidth usage.


    ●     Remove unnecessary logging and debugging information.


    2\. Configure Production Environment: Update your `appsettings.json` or `appsettings.Production.json`
    file with production-specific settings such as database connection strings, logging
    levels, and security configurations.


    3\. Set Environment Variables: Configure environment variables for sensitive information
    like API keys or connection strings. Access these variables in your code using
    `IConfiguration` or `IOptions` pattern.


    2\. Publish ASP.NET Core Application: You can publish your ASP.NET Core application
    using Visual Studio or the command line. Here''s how to do it using the command
    line:


    1\. Open Command Prompt:Open a command prompt or terminal window.


    2\. Navigate to Project Directory: Change directory to your ASP.NET Core project
    folder.


    ```bash


    cd path/to/your/project


    ```


    3\. Publish Command: Run the `dotnet publish` command to publish your application.


    ```bash


    dotnet publish -c Release


    ```


    Replace `-c Release` with `-c Production` if you have a custom configuration for
    production.


    4\. Output Directory: After successful publishing, your application files will
    be placed in the specified output directory (usually `bin/Release/netcoreappX.X/publish`).


    3\. Deploy ASP.NET Core Application: After publishing, deploy your ASP.NET Core
    application to a hosting environment. You can choose various hosting options such
    as IIS, Azure App Service, Docker containers, or cloud platforms like AWS or Google
    Cloud.


    1\. Deploy to IIS:


    ●     Install the .NET Core Hosting Bundle onto the server.


    ● Create a new site or application pool in IIS and configure it to point to the
    published folder.


    ●     Set up appropriate permissions and bindings (HTTP or HTTPS).


    2\. Deploy to Azure App Service:


    ● Create an Azure App Service (Web App) for your application.


    ● Use Azure DevOps, Visual Studio Publishing, or FTP to deploy your published
    files to the App Service.


    3\. Deploy with Docker:


    ●     Dockerize your ASP.NET Core application using a Dockerfile.


    ● Construct a Docker image and upload it to a container registry.


    ● Deploy the Docker image to a container runtime environment such as Docker Swarm
    or Kubernetes.


    4\. Integrate Angular 14 Frontend: If your ASP.NET Core application includes an
    Angular 14 frontend, integrate it during the publish and deployment process.


    1\. Angular Build: Before publishing the ASP.NET Core application, build your
    Angular frontend for production.


    ```bash


    ng build --prod


    ```


    This command generates optimized production-ready files in the `dist` folder of
    your Angular project.


    2\. Publish with Angular: Include the Angular production files (`dist` folder)
    in the published output of your ASP.NET Core application.


    ```bash


    dotnet publish -c Release --output path/to/publish --source path/to/angular/dist


    ```


    3\. Deploy Combined Application: Deploy the combined ASP.NET Core and Angular
    application to your chosen hosting environment, ensuring proper configuration
    and routing for both backend API endpoints and frontend routes.


    5\. Monitoring and Maintenance: After deployment, monitor your application for
    performance, errors, and security issues. Set up logging and monitoring tools
    to track application health and user interactions. Regularly update dependencies,
    apply security patches, and perform maintenance tasks to ensure a smooth and secure
    production environment.


    By following these steps, you can successfully publish and deploy your ASP.NET
    Core 8 application with an integrated Angular 14 frontend for production use,
    providing a reliable and scalable web application experience for users.


    Hosting on Azure App Service or Cloud Platforms


    Hosting your ASP.NET Core 8 application with an integrated Angular 14 frontend
    on Azure App Service or other cloud platforms like AWS or Google Cloud offers
    scalability, reliability, and ease of deployment. In this guide, we''ll focus
    on hosting on Azure App Service, including steps for deployment and configuration.


    1\. Prepare Your Application for Azure App Service: Before deploying to Azure
    App Service, ensure your application is ready for production deployment.


    Optional update


    ● Build your Angular frontend for production using `ng build --prod`.


    ● Publish your ASP.NET Core backend using `dotnet publish -c Release`.


    2\. Configuration Updates: Update your application configuration files (`appsettings.json`,
    environment variables, etc.) with production settings, including connection strings,
    API endpoints, and security configurations.


    3\. Prepare for Deployment: Make sure you have the necessary deployment scripts
    or configurations in place for a smooth deployment process.


    2\. Deploy to Azure App Service: Follow these steps to deploy your ASP.NET Core
    8 application with Angular 14 frontend to Azure App Service.


    1\. Create an Azure App Service:


    ●     Log in to the Azure Portal (portal.azure.com).


    ● Navigate to App Services and click on "Create App Service."


    ● Configure the required settings such as resource group, app name, runtime stack
    (.NET Core), and region.


    2\. Deployment Options: Azure App Service supports various deployment methods
    including:


    ● Azure DevOps: Set up a CI/CD pipeline using Azure DevOps to automate build and
    deployment.


    ● Visual Studio Publishing: Publish directly from Visual Studio to Azure App Service.


    ●     FTP Deployment: Manually upload your published files via FTP.


    3\. Deploy Using Visual Studio: If you choose to deploy from Visual Studio.


    ● Click with the right mouse button on your ASP.NET Core project and choose "Publish."


    ● Choose Azure App Service as the target and follow the wizard to select your
    Azure subscription and App Service instance.


    ●     Publish the application directly from Visual Studio.


    4\. Deploy Using Azure DevOps: Set up a CI/CD pipeline in Azure DevOps to automate
    deployment:


    ● Create a build pipeline to build and package your ASP.NET Core and Angular application.


    ● Create a release pipeline to deploy the packaged application to Azure App Service.


    ● Configure triggers to automatically deploy on code changes or manual approval.


    3\. Configuration and Scaling: Once deployed, configure your Azure App Service
    and consider scaling options for optimal performance and scalability.


