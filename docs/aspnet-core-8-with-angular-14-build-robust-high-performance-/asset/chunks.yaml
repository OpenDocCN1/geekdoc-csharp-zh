    A：术语表


    ## 引言


    ### 铸就 Web 开发的未来：精通 ASP.NET Core 8 与 Angular 14 全栈开发


    想象一下构建动态、交互式的 Web 应用程序，吸引用户并驱动创新。停止在零散的技术间疲于奔命——使用 `ASP.NET Core 8` 和 `Angular
    14` 释放全栈开发的潜力。这一强大组合让您能够从熟悉的 `C#` 环境出发，打造无缝的后端和引人入胜的前端。


    `ASP.NET Core 8` 与 `Angular 14`：全栈 Web 开发是您掌握这一前沿技术栈的全面指南。告别不同语言和框架的复杂性——本书为您提供必要的知识和实用技能，以无与伦比的效率构建健壮、高性能的
    Web 应用程序。


    以下是您在这段全栈开发之旅中将收获的内容：


    ● 深入 `ASP.NET Core 8`：构建可扩展且安全的 Web API，它们是您应用程序的基石。利用 `Entity Framework Core
    8` 的强大功能无缝管理数据访问和操作。使用 `IdentityServer` 等工具实现用户身份验证和授权，确保强大的安全措施。学习部署、监控和故障排除服务器端代码的最佳实践。


    ● 用 `Angular 14` 征服前端：使用 Angular 创新的基于组件的架构构建动态且交互式的用户界面。掌握数据绑定、用户交互和路由，以创造引人入胜的体验。探索高级功能，如使用
    `ngRx` 进行复杂应用的状态管理。学习优化和测试您的 Angular 应用程序以获得卓越性能。


    ● 弥合鸿沟：无缝集成：本书超越了单独的技术。我们将向您展示如何将 `ASP.NET Core 8` 后端与 `Angular 14` 前端无缝集成。学习从您的
    Angular 应用程序中调用 Web API，确保流畅的数据流。实现跨越服务器和客户端的用户身份验证和授权流程，保证整体体验的安全性。


    但等等，还有更多！我们超越基础，让您能够构建尖端的 Web 应用程序。深入研究构建支持离线功能的渐进式 Web 应用（PWAs）等技术，并探索使用 `SignalR`
    等工具进行实时通信。我们还将指导您遵循安全、调试和实施 CI/CD 流水线的最佳实践，以简化开发工作流程。

