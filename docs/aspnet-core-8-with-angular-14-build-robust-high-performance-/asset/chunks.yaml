    ● Define Reducers: Reducers are pure functions responsible for handling state
    transitions based on dispatched actions. Define reducers for each slice of the
    application state.


    ```typescript


    // data.reducer.ts


    import { createReducer, on } from ''@ngrx/store'';


    import * as DataActions from ''./data.actions'';


    export interface DataState {


    data: any[];


    loading: boolean;


    error: any;


    }


    export const initialState: DataState = {


    data: [],


    loading: false,


    error: null


    };


    export const dataReducer = createReducer(


    initialState,


    on(DataActions.loadData, state => ({ ...state, loading: true })),


    on(DataActions.loadDataSuccess, (state, { data }) => ({ ...state, data, loading:
    false })),


    on(DataActions.loadDataFailure, (state, { error }) => ({ ...state, error, loading:
    false }))


    );


    ```


    ● Setup Effects: Effects are used for handling side effects such as HTTP requests,
    and they dispatch new actions based on the results of these effects.


    ```typescript


    // data.effects.ts


    import { Injectable } from ''@angular/core'';


    import { Actions, createEffect, ofType } from ''@ngrx/effects'';


    import { of } from ''rxjs'';


    import { catchError, map, switchMap } from ''rxjs/operators'';


    import * as DataActions from ''./data.actions'';


    import { DataService } from ''./data.service'';


    @Injectable()


    export class DataEffects {


    loadData$ = createEffect(() => this.actions$.pipe(


    ofType(DataActions.loadData),


    switchMap(() =>


    this.dataService.getData().pipe(


    map(data => DataActions.loadDataSuccess({ data })),


    catchError(error => of(DataActions.loadDataFailure({ error })))


    )


    )


    ));


    constructor(private actions$: Actions, private dataService: DataService) { }


    }


    ```


    ● Register NgRx Modules: Register NgRx modules (store, effects, etc.) in your
    Angular module (`app.module.ts`).


    ```typescript


    import { StoreModule } from ''@ngrx/store'';


    import { EffectsModule } from ''@ngrx/effects'';


    import { dataReducer } from ''./data.reducer'';


    import { DataEffects } from ''./data.effects'';


    @NgModule({


    imports: [


    StoreModule.forRoot({ data: dataReducer }),


    EffectsModule.forRoot([DataEffects]),


    // Other imports


    ],


    providers: [DataEffects],


    // Other configurations


    })


    export class AppModule { }


    ```


    3\. Consuming Global State in Components:


    ● Dispatch Actions: Dispatch NgRx actions from your components to trigger state
    changes.


    ```typescript


    import { Component, OnInit } from ''@angular/core'';


    import { Store } from ''@ngrx/store'';


    import { loadData } from ''./data.actions'';


    @Component({


    selector: ''app-data'',


    templateUrl: ''./data.component.html'',


    styleUrls: [''./data.component.css'']


    })


    export class DataComponent implements OnInit {


    constructor(private store: Store<{ data: DataState }>) { }


    ngOnInit(): void {


    this.loadData();


    }


    loadData(): void {


    this.store.dispatch(loadData());


    }


    }


    ```


    ● Access State with Selectors: Use NgRx selectors to access specific parts of
    the global state in your components.


    ```typescript


    import { Component } from ''@angular/core'';


    import { Store, select } from ''@ngrx/store'';


    import { Observable } from ''rxjs'';


    import { DataState } from ''./data.reducer'';


    import { selectData } from ''./data.selectors'';


    @Component({


    selector: ''app-data-view'',


    templateUrl: ''./data-view.component.html'',


    styleUrls: [''./data-view.component.css'']


    })


    export class DataViewComponent {


    data$: Observable<any[]>;


    constructor(private store: Store<{ data: DataState }>) {


    this.data$ = this.store.pipe(select(selectData));


    }


    }


    ```


    NgRx provides a robust solution for global state management in Angular applications.
    By defining actions, reducers, effects, and selectors, you can manage complex
    application states efficiently. This approach promotes a single source of truth
    for your application data and facilitates predictable state changes across components.
    When integrated with an ASP.NET Core backend, NgRx helps in managing application
    data flow seamlessly and ensures a consistent user experience.


    Implementing Local State Management in Components


    Implementing local state management in Angular components is essential for managing
    component-specific data and UI states. Unlike global state management libraries
    like NgRx, which are suitable for managing application-wide state, local state
    management focuses on data specific to a particular component. Let''s explore
    how to implement local state management in Angular 14 components based on an ASP.NET
    Core 8 backend.


    1\. Using Component Class Properties: One of the simplest ways to manage local
    state in Angular components is by using properties directly within the component
    class.


    ```typescript


    import { Component } from ''@angular/core'';


    @Component({


    selector: ''app-example'',


    templateUrl: ''./example.component.html'',


    styleUrls: [''./example.component.css'']


    })


    export class ExampleComponent {


    count: number = 0;


    message: string = '''';


    increment(): void {


    this.count++;


    }


    decrement(): void {


    this.count--;


    }


    updateMessage(newMessage: string): void {


    this.message = newMessage;


    }


    }


    ```


    In this example, `count` and `message` are local state variables of the `ExampleComponent`.
    The `increment`, `decrement`, and `updateMessage` methods are used to update these
    state variables.


    2\. Using Template Binding for State Display: You can bind local state variables
    to your component''s template to display dynamic data.


    ```html


    <!-- example.component.html -->


    <p>Count: {{ count }}</p>


    <p>Message: {{ message }}</p>


    <button (click)="increment()">Increment</button>


    <button (click)="decrement()">Decrement</button>


    <input type="text" [(ngModel)]="newMessage">


    <button (click)="updateMessage(newMessage)">Update Message</button>


    ```


    In the template, `{{ count }}` and `{{ message }}` display the current values
    of the `count` and `message` variables, respectively. The `(click)` event bindings
    call the corresponding methods to update the state.


    3\. Managing UI State and Interactivity: Local state management is often used
    to manage UI-related states such as visibility, form input values, loading indicators,
    etc.


    ```typescript


    import { Component } from ''@angular/core'';


    @Component({


    selector: ''app-example'',


    templateUrl: ''./example.component.html'',


    styleUrls: [''./example.component.css'']


    })


    export class ExampleComponent {


    showDetails: boolean = false;


    inputValue: string = '''';


    toggleDetails(): void {


    this.showDetails = !this.showDetails;


    }


    handleInputChange(value: string): void {


    this.inputValue = value;


    }


    submitForm(): void {


    // Handle form submission with inputValue


    }


    }


    ```


    4\. Handling Component Lifecycle and Local State: Angular components have lifecycle
    hooks that allow you to perform actions at specific stages of a component''s lifecycle.
    These hooks can be used to manage local state accordingly.


    ```typescript


    import { Component, OnInit, OnDestroy } from ''@angular/core'';


    @Component({


    selector: ''app-example'',


    templateUrl: ''./example.component.html'',


    styleUrls: [''./example.component.css'']


    })


    export class ExampleComponent implements OnInit, OnDestroy {


    timer: any;


    counter: number = 0;


    ngOnInit(): void {


    this.timer = setInterval(() => {


    this.counter++;


    }, 1000);


    }


    ngOnDestroy(): void {


    clearInterval(this.timer);


    }


