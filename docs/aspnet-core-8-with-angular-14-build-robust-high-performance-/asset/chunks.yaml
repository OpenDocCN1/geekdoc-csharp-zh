    3\. 管理用户数据：


    ● 用户详情组件：创建一个组件来查看和编辑用户详情。


    ```typescript


    // user-details.component.ts


    import { Component, OnInit } from ''@angular/core'';


    import { ActivatedRoute } from ''@angular/router'';


    import { UserService } from ''./user.service'';


    import { User } from ''./user.model'';


