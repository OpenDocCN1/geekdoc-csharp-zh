    providedIn: ''root''


    })


    export class AuthService {


    private apiUrl = ''https://localhost:5001/api/auth''; // Authentication API endpoint
    URL


    private authToken: string | null = null;


    constructor(private http: HttpClient) { }


    login(credentials: { username: string, password: string }): Observable<any> {


    return this.http.post<any>(`${this.apiUrl}/login`, credentials);


    }


    setAuthToken(token: string): void {


    this.authToken = token;


    // Store token in local storage or session storage


    }


    getAuthToken(): string | null {


    // Retrieve token from local storage or session storage


    return this.authToken;


    }


    logout(): Observable<any> {


    // Clear token from storage


    this.authToken = null;


    return this.http.post<any>(`${this.apiUrl}/logout`, {});


    }


    // Add method to include JWT token in HTTP headers


    getHeaders(): HttpHeaders {


    const token = this.getAuthToken();


    if (token) {


    return new HttpHeaders({


    ''Authorization'': `Bearer ${token}`


    });


    }


    return new HttpHeaders();


    }


    }


    ```


    2\. Using JWT in API Requests: Update your Angular service methods to include
    JWT tokens in HTTP headers for authenticated requests.'
