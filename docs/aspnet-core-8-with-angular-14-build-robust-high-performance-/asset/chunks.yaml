    Securing web APIs from common vulnerabilities is crucial for protecting your application
    and user data. By following best practices such as parameterized queries for SQL
    injection prevention, automatic request validation for XSS prevention, and using
    anti-forgery tokens for CSRF prevention in ASP.NET Core, along with HTTPS usage,
    input validation, and secure authentication mechanisms in Angular, you can significantly
    reduce the risk of security breaches and ensure a safer user experience. Always
    stay updated with security standards and guidelines to adapt to evolving threats
    and enhance your application''s security posture.


    Chapter 16


    Debugging and Troubleshooting Full-Stack Applications


    Utilizing developer tools and logging effectively is crucial for debugging and
    troubleshooting issues in web applications built with ASP.NET Core 8 on the backend
    and Angular 14 on the frontend. In this guide, we''ll explore how to leverage
    developer tools and logging techniques to enhance the debugging process.


    Backend: ASP.NET Core 8


    Logging Configuration


    ASP.NET Core provides a flexible logging framework that allows developers to configure
    logging levels, providers, and destinations.


    1\. Configure Logging in `Startup.cs`:


    ```csharp


    // Startup.cs


    public void Configure(IApplicationBuilder app, IWebHostEnvironment env, ILoggerFactory
    loggerFactory)


    {


    loggerFactory.AddFile("Logs/myapp-{Date}.txt");


    if (env.IsDevelopment())


    {


    app.UseDeveloperExceptionPage();


    loggerFactory.AddDebug(LogLevel.Debug); // Add debug logging in development mode


    }


    else


    {


    app.UseExceptionHandler("/Home/Error");


    loggerFactory.AddDebug(LogLevel.Information); // Add info logging in production
    mode


    }


    // Other middleware configurations


    }


    ```


    2\. Logging in Controllers or Services:


    ```csharp


    // Controllers/UserController.cs


    using Microsoft.Extensions.Logging;


    [ApiController]


    [Route("api/[controller]")]


    public class UserController : ControllerBase


    {


    private readonly ILogger<UserController> _logger;


    public UserController(ILogger<UserController> logger)


    {


    _logger = logger;


    }


    [HttpGet("{id}")]


    public IActionResult GetUser(int id)


    {


    _logger.LogInformation("Getting user with ID {Id}", id);


    // Process and return user data


    }


    }


    ```


    Frontend: Angular 14


    Browser Developer Tools


    Angular applications can be debugged using browser developer tools like Chrome
    DevTools or Firefox Developer Tools.


    1\. Inspecting Elements:


    ● Use the Elements tab to inspect HTML elements and their styles.


    ●     Debug CSS and layout issues directly in the browser.


    2\. Console Logging:


    ● Utilize `console.log()`, `console.debug()`, `console.error()`, etc., for logging
    messages and debugging JavaScript code.


    3\. Network Monitoring*l:


    ● Monitor network requests and responses to debug API interactions and identify
    performance bottlenecks.


    Angular Logging Service


    Create a logging service in Angular to handle logging in different parts of your
    application.


    1\. Logging Service:


    ```typescript


    // src/app/logger.service.ts


    import { Injectable } from ''@angular/core'';


    @Injectable({


    providedIn: ''root''


    })


    export class LoggerService {


    log(message: string): void {


    console.log(`[INFO] ${message}`);


    }


    error(message: string): void {


    console.error(`[ERROR] ${message}`);


    }


    debug(message: string): void {


    console.debug(`[DEBUG] ${message}`);


    }


    }


    ```


    2\. Usage in Components or Services:


    ```typescript


    // src/app/user/user.service.ts


    import { Injectable } from ''@angular/core'';


    import { LoggerService } from ''../logger.service'';


    @Injectable({


    providedIn: ''root''


    })


    export class UserService {


    constructor(private logger: LoggerService) { }


    getUser(id: number): void {


    this.logger.log(`Fetching user with ID ${id}`);


    // API call and other logic


    }


    }


    ```


    Effective Debugging Practices


    1\. Use Breakpoints:


    ● Place breakpoints in your code to pause execution and inspect variables and
    state.


    ● Debug server-side code in Visual Studio or VS Code, and client-side code in
    browser developer tools.


    2\. Logging Best Practices:


    ● Log relevant information such as input parameters, method calls, and errors
    to track application flow and identify issues.


    ● Use different log levels (info, debug, error) appropriately based on the severity
    of the message.


    3\. Testing and Reproducing Issues:


    ● Reproduce reported issues in development or staging environments to debug effectively.


    ● Write unit tests and integration tests to catch and prevent regressions.


    4\. Continuous Monitoring:


    ● Monitor application logs, performance metrics, and error reports in production
    environments to proactively identify and fix issues.


    By leveraging developer tools like browser consoles, logging services, and proper
    configuration of logging in ASP.NET Core, you can streamline the debugging process
    and ensure a robust and reliable web application. Debugging is an ongoing process,
    so continuously iterate and improve your debugging practices based on feedback
    and experiences.


    Identifying Common Errors and Troubleshooting Strategies


    Identifying common errors and implementing effective troubleshooting strategies
    is crucial for maintaining and improving the reliability of web applications built
    with ASP.NET Core 8 on the backend and Angular 14 on the frontend. Let''s delve
    into some common errors and strategies to troubleshoot them in both environments.


    Backend: ASP.NET Core 8


    Common Errors


    1\. HTTP 500 Internal Server Error:


    ● Occurs due to server-side issues like unhandled exceptions or misconfigured
    middleware.


    2\. Database Connection Errors:


    ●     Issues with database connections, authentication, or query errors.


    3\. Dependency Injection Errors:


    ●     Problems related to dependency injection configuration or service registration.


    Troubleshooting Strategies


    1\. Logging and Exception Handling:


    ● Use logging to track application flow and identify errors. Implement structured
    exception handling to catch and handle exceptions gracefully.


    ```csharp


    // Startup.cs


    public void Configure(IApplicationBuilder app, IWebHostEnvironment env, ILoggerFactory
    loggerFactory)


    {


    if (env.IsDevelopment())


    {


    app.UseDeveloperExceptionPage();


    }


    else


    {


    app.UseExceptionHandler("/Home/Error");


    }


    loggerFactory.AddFile("Logs/myapp-{Date}.txt");


    // Other middleware configurations


    }


    ```


    2\. Database Connection Debugging:


    ● Check database connection strings, credentials, and ensure the database server
    is running.


    ●     Use logging and try-catch blocks to handle database-related exceptions.


    ```csharp


    // Services/UserService.cs


    public class UserService


    {


    private readonly ApplicationDbContext _context;


    public UserService(ApplicationDbContext context)


    {


    _context = context;


    }


    public async Task<User> GetUserByIdAsync(int id)


    {


    try


    {


    return await _context.Users.FindAsync(id);


    }


    catch (Exception ex)


    {


    _logger.LogError(ex, "Error fetching user from database.");


    throw;


    }


    }


    }


    ```


    3\. Dependency Injection Issues:


    ●     Double-check service registrations in `Startup.cs`.


