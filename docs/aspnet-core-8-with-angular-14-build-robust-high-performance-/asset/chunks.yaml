    });

    }


    onSubmit(): void {

    if (this.myForm.valid) {

    console.log(''Form submitted:'', this.myForm.value);

    // You can perform HTTP requests to submit data to the backend

    }

    }

    }

    ```


    ### 表单验证


    使用 `Validators` 定义验证规则，如 `required` 和 `email`。


    ● 在表单初始化期间将验证器应用于表单控件。


    ### 表单模板


    在 HTML 模板中将表单控件绑定到响应式表单。


