    Implementing Server-Side Rendering (SSR) for Performance


    Implementing Server-Side Rendering (SSR) in Angular applications improves performance
    and enhances search engine optimization (SEO) by pre-rendering pages on the server
    before sending them to the client. In this guide, we''ll explore how to implement
    SSR in an Angular 14 application integrated with an ASP.NET Core 8 backend.


    1\. Setting Up Angular Universal for SSR: Angular Universal is the solution for
    implementing SSR in Angular applications. It allows rendering Angular applications
    on the server-side using Node.js or other server platforms.


    ● Installing Angular Universal: First, install the necessary Angular Universal
    packages.


    ```bash


    ng add @nguniversal/express-engine


    ```


    ● Generating SSR Files: Angular Universal generates SSR-related files and configurations.


    ```bash


    ng generate universal --clientProject [your-project-name]


    ```


    Replace `[your-project-name]` with the name of your Angular project.


    2\. Configuring Angular Universal with ASP.NET Core: Once you have Angular Universal
    set up, integrate it with your ASP.NET Core backend.


    ● Angular SSR Middleware: Configure ASP.NET Core to serve the Angular Universal
    SSR output.


    ```csharp


    // Startup.cs


    public void ConfigureServices(IServiceCollection services)


    {


    // Add Angular Universal services


    services.AddSpaStaticFiles(configuration =>


    {


    configuration.RootPath = "ClientApp/dist";


    });


    }


    public void Configure(IApplicationBuilder app, IWebHostEnvironment env)


    {


    // Other middleware configurations


    app.UseSpaStaticFiles();


    app.UseSpa(spa =>


    {


    spa.Options.SourcePath = "ClientApp";


    if (env.IsDevelopment())


    {


    // Use Angular CLI server in development mode


    spa.UseAngularCliServer(npmScript: "start");


    }


    });


    }


    ```


    ● SSR Build and Run: Build and run your application to ensure SSR works as expected.


    ```bash


    npm run build:ssr


    dotnet run


    ```


