    application locally. Access your Angular app in the browser (by default, it runs
    on http://localhost:4200) and test its functionality.


    Configuring ASP.NET Core 8 and Angular 14 development tools involves setting up
    the necessary software, creating projects, configuring middleware, services, routing,
    and managing dependencies. With Visual Studio or Visual Studio Code, along with
    Angular CLI and .NET Core SDK, you have a powerful development environment to
    build modern web applications seamlessly. Testing and debugging your applications
    using appropriate tools ensure a smooth development experience.


    Setting Up Version Control with Git


    Setting up version control with Git is crucial for managing code changes, collaborating
    with team members, and maintaining a history of project revisions. Whether you''re
    working on an ASP.NET Core 8 backend or an Angular 14 frontend (or both), Git
    provides a reliable version control system. Let''s walk through the process of
    setting up Git for a project that includes both ASP.NET Core and Angular development.


    1\. Installing Git: If you haven''t installed Git already, you can download it
    from the official Git website (https://git-scm.com/). Please adhere to the installation
    guidelines specific to your operating system (Windows, macOS, or Linux).


    2\. Creating a Git Repository: Once Git is installed, navigate to the root directory
    of your project using a terminal or command prompt.


    For a new project, you can initialize a new Git repository using the following
    command:


    ```bash


    git init


    ```


    This command creates a new Git repository in the current directory, marking it
    as a version-controlled project.


    3\. Setting Up .gitignore: In ASP.NET Core and Angular projects, there are certain
    files and directories that you don''t want to include in version control. For
    example, build artifacts, temporary files, and dependencies. Create a `.gitignore`
    file in the root of your project to specify which files and directories Git should
    ignore.


    Here''s an example `.gitignore` file for an ASP.NET Core and Angular project:


    ```


    # ASP.NET Core


    bin/


    obj/


    *.csproj.user


    *.dll


    *.exe


    # Angular


    node_modules/


    dist/


    ```


    Adjust the `.gitignore` file based on your specific project structure and dependencies.


    4\. Adding and Committing Changes: After setting up `.gitignore`, you can start
    adding files to the Git repository and committing changes.


    To add all files to the staging area for the next commit, use:


    ```bash


    git add .


    ```


    Use the following command to commit the changes to the repository:


    ```bash


    git commit -m "Initial commit"


    ```


    Replace `"Initial commit"` with an appropriate commit message describing the changes
    you''ve made.


    5\. Remote Repository (Optional): If you''re working in a team or want to keep
    a backup of your code on a remote server (such as GitHub, GitLab, or Bitbucket),
    you can add a remote repository.


    For example, to add a remote repository on GitHub:


    1\. Create a new repository on GitHub.


    2\. Use the following command to add the remote repository:


    ```bash


    git remote add origin https://github.com/username/repo-name.git


    ```


    Replace `https://github.com/username/repo-name.git` with the URL of your GitHub
    repository.


    3\. Push your code to the remote repository:


    ```bash


    git push -u origin main


    ```


    This command pushes your code to the `main` branch of the remote repository. If
    you''re using a different branch, replace `main` with the branch name.


    6\. Branching and Merging (Optional): Git allows you to work on different features
    or bug fixes in separate branches, which can later be merged into the main branch
    (or other target branches).


    To generate a fresh branch and transition to it:


    ```bash


    git checkout -b feature-name


    ```


    Replace `feature-name` with an appropriate branch name.


    After making changes in the branch, you can commit them and then merge the branch
    into the main branch using Git commands like `git merge` or pull request mechanisms
    if you''re using a Git hosting platform like GitHub.


    7\. Pulling Changes (Optional): If you''re working in a team or collaborating
    with others, you may need to pull changes from the remote repository to keep your
    local repository up to date.


    To pull changes from the remote repository:


    ```bash


    git pull origin main


    ```


    Replace `main` with the branch you want to pull changes from.


    Setting up version control with Git for an ASP.NET Core 8 and Angular 14 project
    involves initializing a Git repository, creating a `.gitignore` file, adding and
    committing changes, and optionally setting up a remote repository for collaboration.
    Branching, merging, and pulling changes are additional Git operations that can
    enhance your development workflow, especially in team environments. By following
    these steps, you can effectively manage code versions, track changes, and collaborate
    seamlessly on your project.


    Chapter 3


    Mastering ASP.NET Core 8 for Robust Back-Ends


    Building your first ASP.NET Core 8 Web API is a great way to get started with
    backend development. We''ll walk through the process of creating a new ASP.NET
    Core project in Visual Studio, setting up a simple Web API, and testing it using
    tools like Postman. Additionally, we''ll keep in mind integration with Angular
    14 for frontend development.


    1\. Creating an ASP.NET Core 8 Project in Visual Studio:


    1\. Open Visual Studio: Launch Visual Studio on your development machine.


    2\. Start a New Project: Click on "Create a new project" or navigate to File >
    New > Project.


    3\. Select Project Template: In the "Create a new project" window, choose "ASP.NET
    Core Web Application" as the project type. Click "Next."


    4\. Configure Project: Provide a name and location for your project. Choose the
    desired framework (ASP.NET Core 8) and project type (such as API or Web Application).
    Click "Create."


    5\. Select Template: In the "Create a new ASP.NET Core Web Application" window,
    choose the "API" template. Ensure that "ASP.NET Core 8" is selected as the target
    framework.


    6\. Configure Authentication (Optional): You can choose to configure authentication
    based on your project requirements. For now, you can select "No Authentication"
    if not needed.


    7\. Create Project: Click "Create" to create the ASP.NET Core project based on
    the selected template and configuration.


    2\. Setting Up a Simple Web API:


    Once your project is created, you''ll have a basic structure with folders like
    Controllers, Models, and Startup.cs. Let''s create a simple Web API controller
    to handle requests.


    1\. Create a Controller: Right-click on the "Controllers" folder in the Solution
    Explorer and choose "Add" > "Controller."


    2\. Select Controller Template: Choose the "API Controller - Empty" template and
    click "Add."


    3\. Add Controller Code: In the newly created controller file (e.g., `ValuesController.cs`),
    add some sample code to create API endpoints.


    ```csharp


    using Microsoft.AspNetCore.Mvc;


    using System;


    using System.Collections.Generic;


    namespace YourNamespace.Controllers


    {


    [Route("api/[controller]")]


    [ApiController]


    public class ValuesController : ControllerBase


    {


    // GET: api/values


    [HttpGet]


    public ActionResult<IEnumerable<string>> Get()


    {


    return new string[] { "value1", "value2" };


    }


    // GET api/values/5


    [HttpGet("{id}")]


    public ActionResult<string> Get(int id)


    {


    return "value";


    }


    // POST api/values


    [HttpPost]


    public ActionResult Post([FromBody] string value)


    {


    // Save the value or perform necessary actions


    return Ok();


    }


    // PUT api/values/5


    [HttpPut("{id}")]


    public ActionResult Put(int id, [FromBody] string value)


    {


    // Update the value with the provided ID


    return Ok();


    }


    // DELETE api/values/5


    [HttpDelete("{id}")]


    public ActionResult Delete(int id)


    {


    // Delete the value with the provided ID


    return Ok();


    }


    }


    }


