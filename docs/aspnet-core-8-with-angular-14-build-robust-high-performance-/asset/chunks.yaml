    Introduction to Entity Framework Core 8 for Database Access


    Entity Framework Core 8 (EF Core) is a contemporary object-relational mapper (ORM)
    framework crafted by Microsoft for .NET applications. It provides a convenient
    and efficient way to interact with databases using object-oriented programming
    techniques, thereby reducing the amount of boilerplate code needed for data access
    tasks. In this guide, we''ll introduce EF Core 8 and demonstrate how to use it
    in an ASP.NET Core 8 backend application with an Angular 14 frontend.


    1\. Getting Started with EF Core 8: To use EF Core 8 in an ASP.NET Core 8 application,
    you need to set up the necessary dependencies and configure your data context.


    1\. Install EF Core Package: Start by installing the Entity Framework Core package
    in your ASP.NET Core project. Open the NuGet Package Manager Console and run the
    following command:


    ```bash


    Install-Package Microsoft.EntityFrameworkCore.SqlServer


    ```


    This command installs the EF Core SQL Server provider, which allows EF Core to
    communicate with SQL Server databases.


    2\. Create a Data Model:Define your data model by creating C# classes that represent
    your database tables. As an instance, let''s craft a `Product` class:


    ```csharp


    public class Product


    {


    This represents a public integer identifier { get; set; }


    This denotes a public string variable named "Name" { get; set; }


    This indicates a public decimal variable named "Price" { get; set; }


    }


    ```


    3\. Create a DbContext: The `DbContext` class in EF Core represents the database
    session and allows you to query and save instances of your data model. Construct
    a class that derives from `DbContext`:


    ```csharp


    public class ApplicationDbContext : DbContext


    {


    public ApplicationDbContext(DbContextOptions<ApplicationDbContext> options)


    : base(options)


    {


    }


    public DbSet<Product> Products { get; set; }


    }


    ```


    4\. Configure DbContext in Startup: In the `Startup.cs` file, configure the DbContext
    and specify the connection string to your database:


    ```csharp


    public void ConfigureServices(IServiceCollection services)


    {


    services.AddDbContext<ApplicationDbContext>(options =>


    options.UseSqlServer(Configuration.GetConnectionString("DefaultConnection")));


    // Other service configurations


    }


    ```


    Make sure you have the connection string specified in your `appsettings.json`
    file:


    ```json


    "ConnectionStrings": {


    "DefaultConnection": "Server=localhost;Database=YourDatabaseName;User=YourUsername;Password=YourPassword;"


    }


    ```


    2\. Using EF Core in Controllers: Now that you have set up EF Core in your ASP.NET
    Core application, you can use it in your controllers to perform database operations.


    1\. Inject DbContext into Controller: Inject the `ApplicationDbContext` into your
    controller using dependency injection:


    ```csharp


    public class ProductsController : ControllerBase


    {


    private readonly ApplicationDbContext _context;


    public ProductsController(ApplicationDbContext context)


    {


    _context = context;


    }


    // Controller actions


    }


    ```


    2\. Perform CRUD Operations: You can now use LINQ queries and EF Core methods
    to perform CRUD operations. Here are some examples:


    ●     Retrieve Products:


    ```csharp


    [HttpGet]


    public IActionResult GetProducts()


    {


    var products = _context.Products.ToList();


    return Ok(products);


    }


    ```


    ●     Create a Product:


    ```csharp


    [HttpPost]


    public IActionResult CreateProduct([FromBody] Product product)


    {


    _context.Products.Add(product);


    _context.SaveChanges();


    return CreatedAtAction(nameof(GetProductById), new { id = product.Id }, product);


    }


    ```


    ●     Update a Product:


    ```csharp


    [HttpPut("{id}")]


    public IActionResult UpdateProduct(int id, [FromBody] Product product)


    {


    var existingProduct = _context.Products.FirstOrDefault(p => p.Id == id);


    if (existingProduct == null)


    {


    return NotFound();


    }


    existingProduct.Name = product.Name;


    existingProduct.Price = product.Price;


    _context.SaveChanges();


    return NoContent();


    }


    ```


    ●     Delete a Product:


    ```csharp


    [HttpDelete("{id}")]


    public IActionResult DeleteProduct(int id)


    {


    var product = _context.Products.Find(id);


    if (product == null)


    {


    return NotFound();


    }


    _context.Products.Remove(product);


    _context.SaveChanges();


    return NoContent();


    }


    ```


