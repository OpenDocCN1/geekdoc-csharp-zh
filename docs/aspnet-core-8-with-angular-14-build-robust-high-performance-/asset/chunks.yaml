    import { BrowserAnimationsModule } from ''@angular/platform-browser/animations'';


    import { AppComponent } from ''./app.component'';


    @NgModule({


    declarations: [


    AppComponent


    ],


    imports: [


    BrowserModule,


    BrowserAnimationsModule


    ],


    providers: [],


    bootstrap: [AppComponent]


    })


    export class AppModule { }


    ```


    ● Defining Animations: Create animations using Angular''s `trigger`, `transition`,
    and `style` functions within your component.


    ```typescript


    import { Component } from ''@angular/core'';


    import { trigger, transition, style, animate } from ''@angular/animations'';


    @Component({


    selector: ''app-example'',


    templateUrl: ''./example.component.html'',


    styleUrls: [''./example.component.css''],


    animations: [


    trigger(''fadeInOut'', [


    transition('':enter'', [


    style({ opacity: 0 }),


    animate(''500ms'', style({ opacity: 1 })),


    ]),


    transition('':leave'', [


    animate(''500ms'', style({ opacity: 0 })),


    ]),


    ]),


    ]


    })


    export class ExampleComponent {


    showElement: boolean = false;


    toggleElement(): void {


    this.showElement = !this.showElement;


    }


    }


    ```


    ● Applying Animations in Template: Apply the defined animations in your component''s
    template (`example.component.html`).


    ```html


    <div @fadeInOut *ngIf="showElement">


    <p>This element will fade in and out</p>


    </div>


    <button (click)="toggleElement()">Toggle Element</button>


    ```


    In this example, the `@fadeInOut` animation is applied to the `div` element based
    on the `showElement` state.


    2\. Using Angular Directives: Angular directives are markers on a DOM element
    that tell Angular to do something with that element or its children. Directives
    can be used to create reusable components, control the behavior of elements, and
    enhance the interactivity of the UI.


    ● Creating a Custom Directive: You can create custom directives to encapsulate
    behavior and apply it to elements in your templates.


    ```typescript


    import { Directive, HostListener, ElementRef } from ''@angular/core'';


    @Directive({


    selector: ''[appHighlight]''


    })


    export class HighlightDirective {


    constructor(private el: ElementRef) { }


