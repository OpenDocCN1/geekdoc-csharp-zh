    Implementing Routing with Angular Router


    Implementing routing with Angular Router is crucial for creating single-page applications
    (SPAs) with multiple views or pages. Angular Router provides a powerful and flexible
    way to manage navigation, route parameters, and nested routes in your Angular
    application. Let''s explore how to implement routing using Angular Router with
    examples based on ASP.NET Core 8 backend and Angular 14 frontend.


    1\. Setting Up Angular Router: First, ensure that Angular Router is installed
    in your Angular project. You can use the Angular CLI to generate a new Angular
    module with routing.


    ```bash


    ng generate module app-routing --flat --module=app


    ```


    This command generates an `app-routing.module.ts` file with the necessary routing
    configuration.


    2\. Configuring Routes: In the `app-routing.module.ts` file, define your application
    routes using the `RouterModule.forRoot()` method. Each route consists of a path,
    component, and optional additional configuration such as route parameters or child
    routes.


    ```typescript


    import { NgModule } from ''@angular/core'';


    import { Routes, RouterModule } from ''@angular/router'';


    import { HomeComponent } from ''./home/home.component'';


    import { AboutComponent } from ''./about/about.component'';


    import { ContactComponent } from ''./contact/contact.component'';


    const routes: Routes = [


    { path: '''', component: HomeComponent },


    { path: ''about'', component: AboutComponent },


    { path: ''contact'', component: ContactComponent },


    // Add more routes as needed


    ];


    @NgModule({


    imports: [RouterModule.forRoot(routes)],


    exports: [RouterModule]


    })


    export class AppRoutingModule { }


    ```


    3\. Adding Router Outlet: In your main `app.component.html`, add a `<router-outlet></router-outlet>`
    tag where the routed components will be displayed based on the current route.


    ```html


    <!-- app.component.html -->


    <router-outlet></router-outlet>


    ```


    4\. Creating Route Components: Create Angular components for each route defined
    in your routing configuration. For example, create `home.component.ts`, `about.component.ts`,
    and `contact.component.ts`.


    ```bash


    ng generate component home


    ng generate component about


    ng generate component contact


    ```


    5\. Navigation and Links: Use Angular Router''s `routerLink` directive to navigate
    between routes in your application. Update your navigation menus or links accordingly.


    ```html


    <!-- Example navigation menu -->


    <ul>


    <li><a routerLink="/">Home</a></li>


    <li><a routerLink="/about">About</a></li>


    <li><a routerLink="/contact">Contact</a></li>


    </ul>


    ```


    6\. Route Parameters: You can pass parameters to routes using route parameters.
    Update your route configuration and access parameters in the corresponding component.


    ```typescript


    const routes: Routes = [


    { path: ''product/:id'', component: ProductComponent },


    ];


    // Accessing route parameters in component


    import { ActivatedRoute } from ''@angular/router'';


    export class ProductComponent implements OnInit {


    constructor(private route: ActivatedRoute) { }


    ngOnInit(): void {


    this.route.params.subscribe(params => {


    const productId = params[''id''];


    // Use productId in your component logic


    });


    }


    }


    ```


    7\. Child Routes and Nested Routing: Angular Router supports nested or child routes,
    allowing you to define routes within other routes. This is useful for organizing
    complex application layouts.


    ```typescript


    const routes: Routes = [


    {


    path: ''admin'',


    component: AdminComponent,


    children: [


    { path: ''dashboard'', component: DashboardComponent },


    { path: ''users'', component: UsersComponent },


    // Add more child routes


    ]


    },


    ];


    ```


    8\. Route Guards: Route guards in Angular Router allow you to control navigation
    and access based on certain conditions. For example, you can implement an authentication
    guard to restrict access to certain routes.


    ```typescript


    import { Injectable } from ''@angular/core'';


    import { CanActivate, Router } from ''@angular/router'';


    import { AuthService } from ''./auth.service'';


    @Injectable({


    providedIn: ''root''


    })


    export class AuthGuard implements CanActivate {


    constructor(private authService: AuthService, private router: Router) { }


    canActivate(): boolean {


    if (this.authService.isLoggedIn()) {


    return true;


    } else {


    this.router.navigate([''/login'']); // Redirect to login page


    return false;


    }


    }


    }


    ```


    9\. Integration with ASP.NET Core Backend: When integrating Angular Router with
    an ASP.NET Core backend, ensure that your backend API endpoints match the expected
    routes in your Angular application. For example, if your Angular app has routes
    like `/api/products`, make sure your ASP.NET Core backend exposes APIs at `/api/products`.


    Angular Router provides a powerful mechanism for implementing client-side routing
    and navigation in Angular applications. By configuring routes, defining route
    components, handling route parameters, and using route guards, you can create
    dynamic and responsive SPAs that offer a seamless user experience. When integrated
    with an ASP.NET Core backend, Angular Router enables full-stack web development
    with efficient client-server communication and navigation capabilities.


