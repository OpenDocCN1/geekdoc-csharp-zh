  \n# 第 2 章 变量、运算符和表达式的操作\n\n在完成本章后，你将能够：\n\n![Image](img/Image00001.jpg) 理解语句、标识符和关键字。\n\
  \n![Image](img/Image00001.jpg) 使用变量存储信息。\n\n![Image](img/Image00001.jpg) 使用原始数据类型工作。\n\
  \n![Image](img/Image00001.jpg) 使用算术运算符，如加号（+`）和减号（–）。\n\n![Image](img/Image00001.jpg)\
  \ 递增和递减变量。\n\n第 1 章，“欢迎来到 C#](#text00006.html_ch01)”，介绍了如何使用 Microsoft Visual Studio\
  \ 2015 编程环境来构建和运行控制台程序。\n\n## 理解语句\n\n语句是执行操作的命令，例如计算值或显示消息。你将在第 3 章中学习更多关于方法。\n\
  \nC# 中的语句遵循一套定义良好的规则，描述它们的格式和结构。这些规则统称为语法。（相比之下，语句作用的规范统称为语义。）C# 最简单且最重要的语法规则之一是使用分号终止所有语句。例如，第\
  \ 1 章演示了如果没有终止分号，以下语句将无法编译：\n\n```\nConsole.WriteLine(\"Hello, World!\");\n```\n\
  \n* * *\n\n![Image](img/Image00013.jpg) 提示\n\nC# 是一种“自由格式”语言，这意味着空白（如空格字符或换行）除了作为分隔符外没有意义。也就是说，你可以自由选择任何样式布局你的语句。然而，你应该采用简单、一致的布局样式，以便更易阅读和理解程序。\n\
  \n## 使用标识符\n\n标识符是你用于标识程序中元素的名称，例如命名空间、类、方法和变量。（你很快就会学习变量。）在 C# 中选择标识符时必须遵守以下语法规则：\n\
  \n![Image](img/Image00001.jpg) 你只能使用字母（大写和小写）、数字和下划线。\n\n![Image](img/Image00001.jpg)\
  \ 标识符必须以字母或下划线开头。\n\n例如，*result*、*_score*、*footballTeam* 和 *plan9* 都是有效的标识符，而 *result%*、*footballTeam$*\
  \ 和 *9plan* 则不是。\n\n* * *\n\n![Image](img/Image00004.jpg) 重要\n\nC# 是一种大小敏感语言：*footballTeam*\
  \ 和 *FootballTeam* 是两个不同的标识符。\n\n* * *\n\n### 识别关键字\n\n\n\n\nC# 语言预留了 77 个标识符供自身使用，你不能将这些标识符用于自己的目的。这些标识符被称为\
  \ `keywords`（关键字），每个都有特定的含义。关键字的示例包括 `class`、`namespace` 和 `using`。随着本书的进行，你将学习大多数\
  \ C# 关键字的含义。以下是关键字列表：\n\n![Image](img/Image00032.jpg)\n\n***\n\n![Image](img/Image00013.jpg)\
  \ 提示\n\n在 Visual Studio 2015 代码和文本编辑器中，当你输入关键字时，它们会显示为蓝色。\n\n***\n\nC# 还使用以下标识符。这些标识符没有被\
  \ C# 预留，这意味着你可以将这些名称作为自己的方法、变量和类的标识符，但如果可能，你应该尽量避免这样做。\n\n![Image](img/Image00033.jpg)\n\
  \n## 使用变量\n\n`variable`（变量）是一个存储值的存储位置。你可以将变量看作计算机内存中的一个盒子，用于存放临时信息。你必须为程序中的每个变量提供一个无歧的名称，以便在使用的上下文中唯一地标识它。你使用变量名来引用它所持的值。例如，如果你想存储商店中某件物品的价格，你可以创建一个简单的\
  \ `cost` 变量，并将物品的价格存储在该变量中。稍后，如果你引用 `cost` 变量，检索到的值将是你之前存储在那里的物品价格。\n\n### 变量命名\n\
  \n你应该为变量采用一种命名规范，以帮助你避免对已定义的变量产生混淆。如果你处于一个由多个开发人员负责应用程序不同部分的项目团队中，这一点尤为重要；一致的命名规范有助于避免混淆，并可以减少\
  \ bug 的发生范围。以下列表包含了一些通用建议：\n\n![Image](img/Image00001.jpg) 不要以下划线开头标识符。_ 虽然这在 C#\
  \ 中是合法的，但它可能会限制你的代码与其他使用语言（如 Microsoft Visual Basic）构建的应用程序之间的互操作性。\n\n![Image](img/Image00001.jpg)\
  \ 不要创建仅字母大小写不同的标识符。例如，不要同时创建一个名为 `myVariable` 的变量和另一个名为 `MyVariable` 的变量，因为它们太容易混淆了。此外，定义仅字母大小写不同的标识符可能会限制在其他不区分大小写的语言（如\
  \ Visual Basic）开发的应用程序中重用类的能力。\n\n![Image](img/Image00001.jpg) 以小写字母开头名称。\n\n![Image](img/Image00001.jpg)\
  \ 在多单词标识符中，第二个及随后的每个单词以大写字母开头。（这被称为 `camelCase notation` 驼峰命名法。）\n\n![Image](img/Image00001.jpg)\
  \ 不要使用匈牙命名法。（如果你是 Microsoft Visual C++ 开发人员，你可能熟悉匈牙命名法。如果你不知道什么是匈牙命名法，不用担心！）\n\n\
  例如，`score`、`footballTeam`、`score` 和 `FootballTeam` 都是有效的变量名，但只有前两个是推荐的。\n\n### 声明变量\n\
  \n变量持有值。C# 有许多可以它可以存储和处理的不同类型的值——例如，，整数、浮点数和字符字符串。当你声明变量时，必须指定它将持有的数据类型。\n\n你在声明语句中声明变量的类型和名称。例如，下面的语句声明名为\
  \ `age` 的变量持有 `int`（整数）值。一如既往，你必须用分号结束语句。\n\n```cs\nint age;\n```\n\n变量类型 `int`\
  \ 是 C# `primitive`（原始）类型之一 `integer`（整数），它是一个全整数。（你将在本章的稍后部分学习几种原始数据类型。）\n\n***\n\
  \n![Image](img/Image00005.jpg) 备注\n\n如果你是 Visual Basic 程序员，你应该注意 C# 不允许隐式变量声明。你必须在使用所有变量之前显式地声明它们。\n\
  \n***\n\n在声明变量后，你可以给它赋值。下面的语句将值 42 赋值给 `age`。再次注意，分号是必须的。\n\n```cs\nage = 42;\n\
  ```\n\n等号 (`=`) 是 `assignment`（赋值）运算符，它将右侧的值分配左侧的变量。赋值后，你可以在代码中使用 `age` 变量来引用它所持的值。下一个语句将\
  \ `age` 变量的值 (42) 写入控制台：\n\n```cs\nConsole.WriteLine(age);\n```\n\n***\n\n![Image](img/Image00013.jpg)\
  \ 提示\n\n如果你将 Visual Studio 2015 代码和文本编辑器窗口中的鼠标停变量上，屏幕提示（ScreenTip）会指示变量的类型。\n\n\
  ***\n\n## 使用原始数据类型\n\nC# 有若干种称为 `primitive data types`（原始数据类型）的内置类型。下表列出了 C# 中常用的原始数据类型以及你在每个类型中可以存储的值。\n\
