  \n### # 使用可选参数和命名参数\n\n你已经看到，通过定义重载方法，你可以实现具有不同参数的方法。当你构建使用重载方法的应用程序时，编译器会确定使用哪些特定的方法实例来满足每次方法调用。这是许多面向对象语言的共同特征，而不只是\
  \ C#。\n\n然而，开发者可以使用其他语言和技术来构建不遵循这些规则的 Windows 应用程序和组件。C# 以及其他为 .NET Framework 设计语言的一个关键功能是与其他技术编写的应用程序和组件进行互操作。支持许多外部\
  \ Windows 应用程序和服务的主要技术之一是组件模型（COM）。事实上，.NET Framework 使用通用语言运行时（CLR）也高度依赖 COM，Windows\
  \ 10 的 Windows Runtime 也是如此。COM 不支持重载方法；相反，它使用带有可选参数的方法。为了方便将 COM 库和组件集成到 C# 解决方案中，C#\
  \ 也支持可选参数。\n\n\n\n\n可选参数在其他情况下也很有用。当参数类型的变化不足以让编译器区分不同的实现，导致无法使用方法重载时，可选参数提供了一个紧凑且简单的解决方案。例如，考虑以下方法：\n\
  \n点击此处查看代码图像\n\n```java\npublic void DoWorkWithData(int intData, float floatData,\
  \ int moreIntData)\n{\n    ...\n}\n```\n\n`DoWorkWithData` 方法接收三个参数：两个 `int` 和一个\
  \ `float`。现在，假设你想提供一个只接收两个参数（`intData` 和 `floatData`）的 `DoWorkWithData` 这种版本。你可以像这样重载该方法：\n\
  \n点击此处查看代码图像\n\n```java\npublic void DoWorkWithData(int intData, float floatData)\n\
  {\n    ...\n}\n```\n\n如果你编写了调用 `DoWorkWithData` 方法的语句，你可以提供两个或三个相应类型的参数，编译器将使用类型信息来确定调用哪一个重载：\n\
  \n点击此处查看代码图像\n\n```java\nint arg1 = 99;\nfloat arg2 = 100.0F;\nint arg3 = 101;\n\
  DoWorkWithData(arg1, arg2, arg3); // 调用带有三个参数的重载\nDoWorkWithData(arg1, arg2); //\
  \ 调用两个参数的重载\n```\n\n然而，假设你想为 `DoWorkWithData` 实现两个额外的版本，它们只接收第一个参数和第三个参数。你可能会尝试这样做：\n\
  \n点击此处查看代码图像\n\n```java\npublic void DoWorkWithData(int intData)\n{\n    ...\n}\n\
  \npublic void DoWorkWithData(int moreIntData)\n{\n    ...\n}\n```\n\n这里的问题在于，对于编译器来说，这两个重载版本看起来是相同的。你的代码将无法编译，而是会生成错误“类型‘typename’已定义了参数类型相同的成员\
  \ `DoWorkWithData’”。为了理解为什么会这样，请思考如果这段代码是合法的会发生什么。考虑以下语句：\n\n```java\nint arg1 =\
  \ 99;\nint arg3 = 101;\nDoWorkWithData(arg1);\nDoWorkWithData(arg3);\n```\n\n对 `DoWorkWithData`\
  \ 的调用将触发哪一个或多个重载？使用可选参数和命名参数可以帮助解决这个问题。\n\n### 定义可选参数\n\n当你通过为参数提供默认值来定义方法时，即该参数是可选的。你通过赋值运算符来指定默认值。在接下来所示的\
  \ `optMethod` 方法中，`first` 参数是强制性的因为它没有指定默认值，但 `second` 和 `third` 参数是可选的：\n\n点击此处查看代码图像\n\
  \n```java\nvoid optMethod(int first, double second = 0.0, string third = \"Hello\"\
  )\n{\n    ...\n}\n```\n\n你必须在任何可选参数之前指定所有强制性参数。\n\n你可以像调用任何其他方法一样调用带有可选参数的方法：指定方法名并提供任何必要的参数。带有可选参数的方法的区别在于，你可以省略相应的参数，方法在运行时将使用默认值。在接下来的示例中，对\
  \ `optMethod` 方法的第一次调用提供了三个参数的值。第二次调用仅指定了两个参数，这些值被应用于 `first` 和 `second` 参数。当方法运行时，`third`\
  \ 参数将接收默认值“Hello”。\n\n点击此处查看代码图像\n\n```java\noptMethod(99, 123.45, \"World\"); //\
  \ 为所有三个参数提供了参数\noptMethod(100, 54.321); // 仅为前两个参数提供了参数\n```\n\n### 传递命名参数\n\n默认情况下，C#\
  \ 使用每个参数在方法调用中的位置来确定该参数适用于哪个参数（形参参数）。因此，上一节中所示的 `OptMethod` 方法的第二个示例将两个参数传递给方法中的\
  \ `first` 和 `second` 参数，因为这是它们在方法声明中出现的顺序。在 C# 中，你也可以通过名称指定参数。此功能允许你以不同的顺序传递参数。要将参数作为命名参数传递，你需要指定参数名称，后跟冒号和要使用的值。以下示例执行的功能与上一节所示相同，不同的是通过名称指定参数：\n\
  \n点击此处查看代码图像\n\n```java\noptMethod(first : 99, second : 123.45, third : \"World\"\
  );\noptMethod(first : 100, second : 54.321);\n```\n\n命名参数赋予了你以任何顺序传递参数的能力。你可以如下所示重写调用\
  \ `optMethod` 方法的代码：\n\n点击此处查看代码图像\n\n```java\noptMethod(third : \"World\", second\
  \ : 123.45, first : 99);\noptMethod(second : 54.321, first : 100);\n```\n\n这种特性使得你能够省略参数。例如，你可以调用\
  \ `optMethod` 方法并仅指定 `second` 参数的值，如下如下：\n\n点击此处查看代码图像\n\n```java\noptMethod(99,\
  \ third : \"World\");\n```\n\n此外，你可以混合使用位置参数和命名参数。然而，如果你使用这种技术，必须在命名参数之前指定所有位置参数。\n\
  \n点击此处查看代码图像\n\n```java\noptMethod(99, \"World\"); \n```\n\n### 使用可选参数和命名参数解决歧义\n\
  \n使用可选参数和命名参数可能会导致代码中产生一些歧义。你需要理解编译器如何解决这些歧义；否则你的应用程序可能会以意想不到的方式运行。假设你如下所示定义了 `optMethod`\
  \ 方法为重载方法：\n\n点击此处查看代码图像\n\n```java\nvoid optMethod(int first, double second = 0.0,\
  \ string third = \"Hello\")\n{\n    ...\n}\n\nvoid optMethod(int first, double second\
  \ = 1.0, string third = \"Goodbye\", int fourth = 100)\n{\n    ...\n}\n```\n\n这是完全合法的\
  \ C# 代码，符合重方法的规则。编译器可以区分这些方法，因为它们的参数列表不同。然而，正如下面的示例所示，如果你尝试调用 `optMethod` 方法并省略对应一个或多个可选参数的参数，就会出现问题：\n\
  \n```java\noptMethod(1, 2.5, \"World\");\n```\n\n再次，这是完全合法的代码，但运行的是哪一个 `optMethod`\
  \ 版本？答案是最匹配方法调用的版本，因此代码调用了带有三个参数的方法而不是带有四个参数的版本。这很合理，那么考虑这一个：\n\n```java\noptMethod(1,\
  \ fourth : 101);\n```\n\n在这段代码中，`optMethod` 的调用省略了 `second` 和 `third` 参数，但它通过名称指定了\
  \ `fourth` 参数。只有一个 `optMethod` 版本匹配此调用，所以这不是问题。但接下来的示例会引发你的思考：\n\n```java\noptMethod(1,\
  \ 2.5);\n```\n\n\n\n\n\n这一次，`optMethod` 方法的两个版本都不与提供的参数列表完全匹配。`optMethod` 方法的两个版本对第二、第三和第四个参数都有可选参数。那么，此语句是调用了接受三个参数并对\
  \ `third` 参数使用默认值的 `optMethod` 版本，还是调用了接受四个参数并对 `third` 和 `fourth` 参数使用默认值的 `optMethod`\
  \ 版本呢？答案是两者皆非。这是一个无法解决的歧义，编译器不允许你编译应用程序。如果你尝试像下面任何语句所示调用 `optMethod` 方法，将会出现相同的情况和结果：\n\
  \n点击此处查看代码图片\n\n```\noptMethod(1, third : \"World\");\n```\n\n```\noptMethod(1);\n\
  ```\n\n```\noptMethod(second : 2.5, first : 1);\n```\n\n在这一章的最后一个练习中中，你将练习实现带有可选参数的方法，并使用命名参数来调用它们。你还将测试\
  \ C# 编译器解析涉及可选参数和命名参数的方法调用的常见示例。\n\n### 定义并调用带有可选参数的方法\n\n**1.** 使用 Visual Studio\
  \ 2015，打开 `DailyRate` 项目，该项目位于文档文件夹中的 `\\Microsoft Press\\VCSBS\\Chapter 3\\DailyRate\
