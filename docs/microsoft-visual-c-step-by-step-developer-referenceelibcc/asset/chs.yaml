  \n***\n\n![Image](img/Image00005.jpg) 备注\n属性与类型共享相同的名称（在本例中为 `Color`）是一种常见做法。\n\n\
  ***\n\n### 14. 返回到代码和文本编辑器窗口中的 `DrawingShape` 类。将该类中的 `SetColor` 方法替换为在此处所示的 `Color`\
