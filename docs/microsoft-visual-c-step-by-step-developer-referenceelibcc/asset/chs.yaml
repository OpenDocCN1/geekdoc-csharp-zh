  \ 应该显示消息“操作已取消”（The operation was cancelled.）。\n\n![图像](img/Image00164.jpg)\n\n\
  ### 15. 回到 Visual Studio 并停止调试。\n\n## 定义返回值的异步方法\n\n到目前为止，你看到的所有示例都使用 `Task` 对象来执行不返回值的工作。然而，你也会使用任务来运行计算结果的方法。为了实现这一点，你使用泛型\
  \ `Task<TResult>` 类，其中类型参数 `TResult` 指定了结果的类型。\n\n你以与普通 `Task` 类似的方式创建并启动 `Task<TResult>`\
  \ 对象。主要的区别在于你执行的代码应该返回一个值。例如，接下来的代码示例中名为 `calculateValue` 的方法生成一个整数结果。要使用任务调用此方法，你必须创建并运行一个\
  \ `Task<int>` 对象。你通过查询 `Task<int>` 对象的 `Result` 属性来获取方法返回的值。如果任务尚未完成运行且结果尚不可，`Result`\
  \ 属性将阻塞调用者。这意味着你不需要自己执行任何同步操作，并且你知道当 `Result` 属性返回值时，任务已经完成了它的工作。\n\n点击此处查看代码图像\n\
  \n```csharp\nTask<int> calculateValueTask = Task.Run(() => calculateValue(...));\n\
  ...\nint calculatedData = calculateValueTask.Result; // 阻塞直到 calculateValueTask\
  \ 完成\n...\nprivate int calculateValue(...)\n{\n    int someValue;\n    // 执行计算并填充\
  \ someValue\n    ...\n    return someValue;\n}\n```\n\n泛型 `Task<TResult>` 类型也是定义返回返回值的异步方法机制的基础。在之前的示例中，你看到你通过返回\
  \ `Task` 来实现异步 `void` 方法。如果一个异步方法实际上生成了结果，它应该返回 `Task<TResult>`，如下示例所示，该示例创建了 `calculateValue`\
  \ 方法的异步版本：\n\n点击此处查看代码图像\n\n```csharp\nprivate async Task<int> calculateValueAsync(...)\n\
  {\n    // 使用 Task 调用 calculateValue\n    Task<int> generateResultTask = Task.Run(()\
  \ => calculateValue(...));\n    await generateResultTask;\n    return generateResultTask.Result;\n\
  }\n```\n\n此方法看起来有点困惑，因为返回类型被指定为 `Task<int>`，但 `return` 语句实际上返回一个 `int`。记住，当你定义 `async`\
  \ 方法时，编译器会对你的代码进行某些重构，它本质上返回一个指向 `Task` 的引用，用于运行 `return generateResultTask.Result;`\
  \ 语句的延续。此延续返回的表达式类型是 `int`，因此方法的返回类型是 `Task<int>`。\n\n要调用返回值的异步方法，请如下所示使用 `await`\
  \ 运算符：\n\n点击此处查看代码图像\n\n```csharp\nint result = await calculateValueAsync();\n```\n\
  \n`await` 运算符从 `calculateValueAsync` 返回的 `Task` 中提取值，在这种情况下将其赋值给 `result`。\n\n##\
  \ 异步方法的陷阱（gotchas）\n\n`async` 和 `await` 运算符已知会让程序员产生困惑。重要的是理解：\n\n![图像](img/Image00001.jpg)\
  \ 将方法标记为 `async` 并不意味着它是异步运行的。这意味着该方法包含可以异步运行的语句。\n\n![图像](img/Image00001.jpg) `await`\
  \ 运算符表示方法应由分离的任务运行，直到方法完成。调用代码使用的线程被释放并可以重用。如果该线程是用户界面，这将允许用户界面保持响应。\n\n![图像](img/Image00001.jpg)\
  \ `await` 运算符不同于使用任务的 `Wait` 方法。`Wait` 方法始终阻塞当前线程，不允许在任务完成前重用它。\n\n![图像](img/Image00001.jpg)\
  \ 默认情况下，`await` 之后恢复执行的代码尝试获取调用异步方法时的原始线程。如果此线程忙，代码将被阻塞。你可以使用 `ConfigureAwait(false)`\
  \ 方法来指定代码可以在任何线程上恢复，从而减少阻塞概率。这对于可能需要处理数千个并发请求的 Web 应用程序和服务特别有用。\n\n![图像](img/Image00001.jpg)\
  \ 如果 `await` 运算符之后运行的代码必须在原始线程上执行，则你不应该使用 `ConfigureAwait(false)`。在之前讨论的示例中，对每个被等待的操作添加\
  \ `ConfigureAwait(false)` 将导致编译器生成的延续在分离线程上运行。这包括尝试设置 `message` 的 `Text` 属性的延续，再次导致“应用程序调用了针对不同线程交叉的接口”异常。\n\
  \n点击此处查看代码图像\n\n```csharp\nprivate async void slowMethod()\n{\n    await doFirstLongRunningOperation().ConfigureAwait(false);\n\
  \    await doSecondLongRunningOperation().ConfigureAwait(false);\n    await doThirdLongRunningOperation().ConfigureAwait(false);\n\
  \    message.Text = \"Processing Complete\";\n}\n```\n\n![图像](img/Image00001.jpg)\
  \ 轻率使用返回结果且在用户界面线程运行的异步方法会导致死锁，导致应用程序冻结。考虑以下示例：\n\n```csharp\nprivate async void\
  \ myMethod()\n{\n    var data = generateResult();\n    ...\n    message.Text = $\"\
  result: {data.Result}\";\n}\n\nprivate async Task<string> generateResult()\n{\n\
  \    string result;\n    ...\n    result = ...;\n    return result;\n}\n```\n\n\n\
  \n\n\n在此代码中，`generateResult` 方法返回一个字符串值。然而，`myMethod` 方法在尝试访问 `data.Result` 属性之前，实际上并没有启动运行\
  \ `generateResult` 方法的任务；由于`data` 是该任务的引用，如果由于任务尚未运行导致 `Result` 属性不可用，那么访问该属性将阻塞当前线程，直到\
  \ `generateResult` 方法完成。此外，用于运行 `generateResult` 方法的任务会在方法完成后尝试恢复调用该方法时所处的线程（即用户界面线程），但该线程现在正处于阻塞状态。结果是，`myMethod`\
  \ 方法在 `generateResult` 方法完成之前无法结束，而 `generateResult` 方法在 `myMethod` 方法完成之前也无法结束。\n\
  \n解决此问题的方法是 `await`（等待）运行 `generateResult` 方法的任务。你可以如下所示操作：\n\n点击此处查看代码图像\n\n```csharp\n\
  private async void myMethod()\n{\nvar data = generateResult();\n\n...\n\nmessage.Text\
  \ = $\"result: {await data}\";\n}\n```\n\n### 异步方法与 Windows Runtime API\n\nWindows\
  \ 8 及后续版本的设计者希望确保应用程序尽可能具有响应性，因此它们在实现 WinRT 时做出了决定：任何可能耗时超过 50 毫秒的操作都应该通过异步 API\
  \ 提供。你可能已经在书中注意到一两处这种方法的用例了。例如，为了向用户显示消息，你可以使用 `MessageDialog` 对象。然而，当你显示此消息时，必须使用\
  \ `ShowAsync` 方法，如下：\n\n点击此处查看代码图像\n\n```csharp\nusing Windows.UI.Popups;\n\n...\n\
  \nMessageDialog dlg = new MessageDialog(\"Message to user\");\n\nawait dlg.ShowAsync();\n\
  ```\n\n`MessageDialog` 对象显示消息并等待用户点击作为该对话框一部分出现的“关闭”（Close）按钮。任何形式的用户交互都可能需要不确定的时间（用户在点击“关闭”之前可能去吃午饭了），因此在对话框显示期间，不阻塞应用程序或防止其执行其他操作（例如响应事件）是非常重要的。`MessageDialog`\
  \ 类没有提供 `ShowAsync` 方法的同步版本，但如果你需要同步地显示对话框，只需调用 `dlg.ShowAsync()` 而不使用 `await` 操作符即可。\n\
  \n异步处理的另一个常见示例涉及 `FileOpenPicker` 类，你已经在第 5 章 中的“使用复合赋值和迭代语句””中见过它。`FileOpenPicker`\
  \ 类显示文件列表，用户可以从中选择文件。与 `MessageDialog` 类一样，用户可能会花费大量时间浏览和选择文件，因此此操作不应阻塞应用程序。下面的示例展示了如何使用\
  \ `FileOpenPicker` 类显示用户“文档”文件夹中的文件，并在用户从此列表中选择单个文件时等待：\n\n点击此处查看代码图像\n\n```csharp\n\
  using Windows.Storage;\nusing Windows.Storage.Pickers;\n\n...\n\nFileOpenPicker\
  \ fp = new FileOpenPicker();\n\nfp.SuggestedStartLocation = PickerLocationId.DocumentsLibrary;\n\
  \nfp.ViewMode = PickerViewMode.List;\n\nfp.FileTypeFilter.Add(\"*\");\n\n###File\
  \ file = await fp.PickSingleFileAsync();\n```\n\n关键语句是调用 `PickSingleFileAsync` 方法的行行。该方法显示文件列表，并允许用户在文件系统中导航并选择文件。（`FileOpenPicker`\
  \ 类还提供了 `PickMultipleFilesAsync` 方法，用户可以通过它选择多个文件。）该方法返回的值为 `Task<StorageFile>`，`await`\
  \ 操作符从该结果中提取出 `StorageFile` 对象。`StorageFile` 类提供了存储在硬盘上的文件的抽象，通过使用该类，你可以打开文件并对其进行读取或写入。\n\
  \n***\n\n![Image](img/Image00005.jpg) 注意\n\n严格来说，`PickSingleFileAsync` 方法返回的是一个类型为\
  \ `IAsyncOperation<StorageFile>` 的对象。WinRT 使用它自己的异步操作抽象，并将 .NET Framework `Task`\
  \ 对象映射到此抽象上；`Task` 类实现了 `IAsyncOperation` 接口。如果你使用 C# 进行编程，你的代码不会受此转换的影响，你可以直接使用\
  \ `Task` 对象，而无需担心它们是如何映射到 WinRT 异步操作的。\n\n***\n\n文件输入/输出 (I/O) 是另一个潜在的慢操作来源，`StorageFile`\
  \ 类实现了一系列异步方法，通过这些方法可以执行操作而不影响应用程序的响应性。例如，在第 5 章中，在用户使用 `FileOpenPicker` 对象选择文件后，代码随后异步地打开该文件进行读取：\n\
  \n点击此处查看代码图像\n\n```csharp\nStorageFile file = await fp.PickSingleFileAsync();\n\n\
  ...\n\nvar fileStream = await file.OpenAsync(FileAccessMode.Read);\n```\n\n最后一个直接适用于本章和上一章练习的示例涉及写入流（stream）。你可能注意到，尽管生成图表数据报告了几几秒，但在图表出现之前可能还会花费双倍的时间。这是由于数据写入位图的方式。位图渲染位于\
  \ `WriteableBitmap` 对象缓冲区中的数据，而 `AsStream` 扩展方法提供了该缓冲区的 `Stream` 接口。通过该流使用 `Write`\
  \ 方法将数据写入缓冲区，如下：\n\n点击此处查看代码图像\n\n```csharp\n...\n\nStream pixelStream = graphBitmap.PixelBuffer.AsStream();\n\
  \npixelStream.Seek(0, SeekOrigin.Begin);\n\npixelStream.Write(data, 0, data.Length);\n\
  \n```\n\n...除非你为了内存减少了 `pixelWidth` 和 `pixelHeight` 字段的值，否则写入缓冲区的数据量略大于 570 MB (15000\
  \ * 10000 * 4 字节)，因此此 `Write` 操作可能需要几秒。为了提高响应时间，你可以通过 `WriteAsync` 方法异步执行此操作：\n\n\
  点击此处查看代码图像\n\n```csharp\nawait pixelStream.WriteAsync(data, 0, data.Length);\n```\n\
  \n总之，当你为 Windows 开发应用程序时，应该尽可能地利用异步性。\n\n***\n\n.NET Framework 早期版本中的 `IAsyncResult`\
  \ 设计模式\n\n\n\n\n异步性长期以来被认为是使用 .NET Framework 构建响应式应用程序的关键元素，且该概念在 .NET Framework\
  \ 4.0 版本引入 `Task` 类之前就已经存在。微软引入了基于 `AsyncCallback` 委托类型的 `IAsyncResult` 设计模式来处理这些情况。本书中不宜详述该模式工作原理的具体细节，但从程序员的角度来看，该模式的实现意味着\
  \ .NET Framework 类库中的许多类型以两种方式暴露了耗时操作：一种是由单个方法组成的同步形式；另一种形式是使用一对命名为 `BeginOperationName`\
  \ 和 `EndOperationName` 的方法的异步形式，其中 `OperationName` 指定了正在执行的操作。例如，`System.IO` 命名空间下的\
  \ `MemoryStream` 类提供了 `Write` 方法来将数据同步写入内存中的流中，但它也提供了 `BeginWrite` 和 `EndWrite`\
  \ 方法以异步方式执行相同的操作。`BeginWrite` 方法启动了在新线程上执行的写入操作。`BeginWrite` 方法要求程序员提供一个回调方法的引用，该方法会在写入操作完成后运行；该引用以\
  \ `AsyncCallback` 委托的形式存在。在此方法中，程序员应该实现任何适当的清理工作，并调用 `EndWrite` 方法表示操作已完成。下面的代码示例展示了该模式的应用：\n\
  \n```cs\nByte[] buffer = ...; // 填充了要写入 MemoryStream 的数据\n\nMemoryStream ms = new\
  \ MemoryStream();\n\nAsyncCallback callback = new AsyncCallback(handleWriteCompleted);\n\
  \nms.BeginWrite(buffer, 0, buffer.Length, callback, ms);\n\n...\n\nprivate void\
  \ handleWriteCompleted(IAsyncResult ar)\n{\n    MemoryStream ms = ar.AsyncState\
  \ as MemoryStream;\n    ... // 执行任何适当的清理\n\n    ms.EndWrite(ar);\n}\n```\n\n回调方法（`handleWriteCompleted`）的参数是一个\
  \ `IAsyncResult` 对象，它包含了有关异步操作状态以及任何其他状态的信息。你可以通过此参数向回调传递用户定义的信息；传递给 `BeginOperationName`\
  \ 方法的最后一个会被封装到此参数中。在示例中，回调传递了 `MemoryStream` 的引用。\n\n尽管这种序列可以工作，但它是一种杂乱的范式，模糊了你正在执行的操作。操作代码被分成了两个方法，如果你必须维护这些代码，很容易丢失这些方法之间的逻辑联系。如果你正在使用\
  \ `Task` 对象，可以通过调用 `TaskFactory` 类的静态方法 `FromAsync` 来简化这种模型。该方法接收 `BeginOperationName`\
  \ 和 `EndOperationName` 方法并将它们封装成使用 `Task` 执行的代码。不需要创建 `AsyncCallback` 委托，因为这是由 `FromAsync`\
  \ 方法在后台自动生成的。因此，你可以像这样执行上一个示例所示的相同操作：\n\n```cs\nByte[] buffer = ...;\n\nMemoryStream\
  \ s = new MemoryStream();\n\nTask t = Task<int>.Factory.FromAsync(s.Beginwrite,\
  \ s.EndWrite, buffer, 0, buffer.Length, null);\n\nt.Start();\n\nawait t;\n```\n\n\
  如果你需要访问 .NET Framework 早期版本开发的类型所暴露的异步功能，这种技术非常有用。\n\n***\n\n### 使用 PLINQ 使声明式数据访问并行\n\
  \n数据访问是另一个对响应时间重要的领域，特别是当你构建需要搜索长长数据结构的应用程序时。在前面的章节中，你已经看到 LINQ 从枚举数据结构中检索数据是多么强大，但展示的示例本质上是单线程的。PLINQ\
  \ 提供了一组基于 `Task` 的 LINQ 扩展，可以帮助你提升性能并使某些查询操作并行。\n\nPLINQ 的工作原理是将数据集划分为多个分区，然后使用任务并行地为每个分区检索符合查询指定标准的数据。当任务完成后，为每个分区检索到的结果将合并为一个单一的枚举结果集。PLINQ\
  \ 非常适用于包含大量元素的数据集场景，或者用于匹配数据所指定的标准涉及复杂的、计算密集型操作的场景。\n\nPLINQ 的一个重要目标是尽可能不具侵入性。要将\
  \ LINQ 查询转换为 PLINQ 查询，你需要使用 `AsParallel` 扩展方法。`AsParallel` 方法返回一个 `ParallelQuery`\
  \ 对象，其行为与原始枚举对象类似，不同之处在于它为许多 LINQ 算子（如 `join` 和 `where`）提供了并行实现。这些 LINQ 算子的实现基于任务，并使用各种算法尝试在尽可能的情况下并行运行你的\
  \ LINQ 查询部分。然而，并行计算世界中一如常的是，`AsParallel` 方法并不是魔法。你无法保证代码一定会变快；这完全取决于你的 LINQ 查询的性质，以及它们所执行的任务是否适合并行化。\n\
  \n为了理解 PLINQ 如何工作以及它的适用场景，查看一些示例会有帮助。后续章节中的练习演示了两对简单的场景。\n\n#### 使用 PLINQ 在遍历集合时提高性能\n\
  \n第一个场景是简单的。考虑一个 LINQ 查询，该查询遍历集合并根据处理器密集型计算从集合中检索元素。只要计算是独立的，这种形式的查询就可以从并行执行中获益。集合中的元素可以被分为若干分区；具体数量取决于计算机的当前负载和可用\
  \ CPU 的数量。每个分区中的元素由单独的线程处理。当所有分区处理完成后，可以合并结果。任何支持通过索引访问元素的集合（例如数组或实现 `IList<T>`\
  \ 的集合）都可以以此方式进行管理。\n\n对简单集合并行化 LINQ 查询\n\n1. 使用 Visual Studio 2015 打开 PLINQ 解决方案，它位于文档文件夹中的\
  \ `\\Microsoft Press\\VCSBS\\Chapter24\\PLINQ` 文件夹。\n2. 在解决方案管理器中，双击 PLINQ 项目中的\
  \ `Program.cs` 以在代码窗口中显示该文件。\n\n这是一个控制台应用程序。应用程序的骨架结构已经为你准备好。`Program` 类包含名为 `Test1`\
  \ 和 `Test2` 的方法，说明了两对常见场景。`Main` 方法轮流调用这些测试方法。两个测试方法具有相似的总体结构：它们创建一个 LINQ 查询（你将在本组练习稍后添加相应的代码），运行它并显示所需时间。每个方法的代码与实际创建和运行查询的语句几乎完全分离。\n\
  \n3. 检查 `Test1` 方法。\n\n该方法创建了一个大型整数数组，并填充了一组 0 到 200 之间的随机数。随机数生成器设置了种子，因此每次运行应用程序时都应该得到相同的结果。\n\
  \n4. 在此方法中第一个 `TO DO` 注释之后，添加此处加粗显示的 LINQ 查询：\n\n```cs\n// TO DO: 创建一个 LINQ 查询以检索所有大于\
  \ 100 的数字\n\nvar over100 = from n in numbers\nwhere TestIfTrue(n > 100)\nselect\
  \ n;\n```\n\n\n\n\n此 LINQ 查询检索 `numbers` 数组中所有值大于 100 的项。`n > 100` 测试本身的计算密集程度并不高，不足以展示并行化此查询的好处，因此代码调用了一个名为\
  \ `TestIfTrue` 的方法，该方法通过执行 `SpinWait` 操作稍微减慢运行速度。`SpinWait` 方法使处理器在短时间内持续执行一个特殊的“无操作”指令循环，使处理器保持忙碌但实际上没有执行任何工作（这被称为“自旋”\
  \ `spinning`）。`TestIfTrue` 方法如下：\n\n点击此处查看代码图像\n\n```csharp\npublic static bool\
  \ TestIfTrue(bool expr)\n{\n    Thread.SpinWait(1000);\n    return expr;\n}\n```\n\
  \n**5.** 在 `Test1` 方法的第二个 `TO DO` 注释之后，添加如下加粗所示代码：\n\n点击此处查看代码图像\n\n```csharp\n\
  // TO DO: Run the LINQ query, and save the results in a List<int> object\nList<int>\
  \ numbersOver100 = new List<int>(over100);\n```\n\n记住 LINQ 查询使用延迟执行，因此在您从中检索结果之前它们不会运行。此语句创建了一个\
  \ `List<int>` 对象并用运行 `over100` 查询的结果填充它。\n\n**6.** 在 `Test1` 方法的第三个 `TO DO` 注释之后，添加如下加粗所示的语句：\n\
  \n点击此处查看代码图像\n\n```csharp\n// TO DO: Display the results\nConsole.WriteLine($\"\
  There are {numbersOver100.Count} numbers over 100\");\n```\n\n**7.** 在“调试”（Debug）菜单上，点击“转转调试的启动”。注意运行\
  \ `Test 1` 所花费的时间，以及数组中大于 100 的项数。\n\n**8.** 运行应用程序几次，并对时间取平均值。验证大于 100 的项数在每次运行时都是相同的（应用程序每次运行时都使用相同的随机数种子，以确保测试的可重复性）。完成后返回\
  \ Visual Studio。\n\n**9.** 选择 LINQ 查询返回的每个项的逻辑与其他所有项的选择逻辑是独立的，因此此查询是分区（partitioning）的理想候选者。修改定义\
  \ LINQ 查询的语句，并对 `numbers` 数组指定 `AsParallel` 扩展方法，如下所示加粗所示：\n\n点击此处查看代码图像\n\n```csharp\n\
  var over100 = from n in numbers.AsParallel()\nwhere TestIfTrue(n > 100)\nselect\
  \ n;\n```\n\n***\n\n![Image](img/Image00005.jpg) 注意\n\n如果选择逻辑或计算需要访问共享数据，则必须同步并行运行的任务；否则，结果可能是不可预测的。然而，同步可能会产生开销，并可能抵消并行化查询带来的处。\n\
  \n***\n\n**10.** 在“调试”（Debug）菜单上，点击“转转调试的启动”。验证 `Test1` 报告的项数与之前相同，但执行测试所需的时间显著缩短。运行测试几次，并对测试所需的持续取平均值。\n\
  \n如果您在双核处理器（或双处理器计算机）上运行，您应该看到时间减少了 40% 到 45%。如果您有更多的处理器内核，这种减少应该更加剧烈（在我的四核机器上，处理时间从\
  \ 10.3 秒骤减到 2.8 秒）。\n\n**11.** 关闭应用程序并返回 Visual Studio。\n\n前面的练习显示了通过对 LINQ 查询进行微小更改可以获得的性能提升。然而，请牢记，只有当查询执行的计算花费一些时间时，您才会看到类似这样的结果。我通过让处理器自旋稍微作了小弊。如果没有这个开销，查询的并行版本实际上比串行版本慢。在下一个练习中，您将看到一个在内存中连接两个数组的\
  \ LINQ 查询。这次，练习使用了更真实的数据量，因此不需要人为降低查询。\n\n### 并行化连接两个集合的 LINQ 查询\n\n**1.** 在解决方案资源管理器（Solution\
  \ Explorer）中，在代码和文本编辑器中打开 `Data.cs` 文件，并找到 `CustomersInMemory` 类。\n\n该类包含一个名为 `Customers`\
  \ 的公共字符串数组。`Customers` 数组中的每个 `string` 都持有单个客户的数据，字段由逗号分隔；这种格式是应用程序可能从使用逗号分隔字段的文本文件中读取的数据。第一个字段包含客户\
  \ ID，第二个字段包含客户代表的公司名称，其余字段持有地址、城市、国家或地区以及邮政编码。\n\n**2.** 找到 `OrdersInMemory` 类。\n\
  \n该类与 `CustomersInMemory` 类类似，包含一个名为 `Orders` 的字符串数组。每个字符串的第一个字段是订单号，第二个字段是客户 ID，第三个字段是下单日期。\n\
  \n**3.** 找到 `OrderInfo` 类。该类包含四个字段：客户 ID、公司名称、订单 ID 和日期。\n\n**4.** 显示 `Program.cs`\
  \ 文件并定位 `Test2` 方法。\n\n在此方法中，您将创建一个使用客户 ID 连接 `Customers` 和 `Orders` 数组的查询，返回每个客户的订单列表。\n\
  \n**5.** 在此方法的 `try` 块中，在第一个 `TO DO` 之后添加如下代码：\n\n点击此处查看代码图像\n\n```csharp\n// TO\
  \ DO: Create a LINQ query that retrieves customers and orders from arrays\n// Store\
  \ each row in OrderInfo object\nvar orderInfoQuery = from c in CustomersInMemory.Customers\n\
  join o in OrdersInMemory.Orders\non c.Split(',')[0] equals o.Split(',')[1]\nselect\
  \ new OrderInfo\n{\n    CustomerID = c.Split(',')[0],\n    CompanyName = c.Split(',')[1],\n\
  \    OrderID = Convert.ToInt32(o.Split(',')[0]),\n    OrderDate = Convert.ToDateTime(o.Split(',')[2],\
  \ new CultureInfo(\"en-US\"))\n};\n```\n\n此语句定义了 LINQ 查询。注意它使用 `String` 类的 `Split`\
  \ 方法来分割字符串。由于数组中的日期是以美国英语格式持有的，因此 `OrderInfo` 中将其转换为 `DateTime` 对象的代码指定了美国英语格式化。如果您使用本地的默认格式化，日期可能无法正确解析。总之，此查询为每个项生成数据执行了大量工作。\n\
  \n**6.** 在 `Test2` 方法中，在第二个 `TO DO` 语句之后，添加如下加粗所示：\n\n点击此处查看代码图像\n\n```csharp\n\
  // TO DO: Run the LINQ query, and save the results in a List<OrderInfo> object\n\
  List<OrderInfo> orderInfo = new List<OrderInfo>(orderInfoQuery);\n```\n\n此语句运行查询并填充\
  \ `orderInfo` 集合。\n\n**7.** 在第三个 `TO DO` 语句之后，添加如下加粗所示的语句：\n\n点击此处查看代码图像\n\n```csharp\n\
  // TO DO: Display the results\nConsole.WriteLine($\"There are {orderInfo.Count}\
  \ orders\");\n```\n\n**8.** 在 `Main` 方法中，注释掉调用 `Test1` 方法的语句并取消注释调用 `Test2` 方法的语句，如下所示加粗代码：\n\
  \n```csharp\nstatic void Main(string[] args)\n{\n    // Test1();\n    Test2();\n\
  }\n```\n\n\n\n\n## 10. 验证 `Test2` 检索了 830 个订单，并记录测试的持续时间。运行应用程序几次以获取平均时长，然后返回 Visual\
  \ Studio。\n\n## 11. 在 `Test2` 方法中，修改 LINQ 查询并为 `Customers` 和 `Orders` 数组添加 `AsParallel`\
  \ 扩展方法，如下所示加粗所示：\n\n点击此处查看代码图像\n\n```csharp\nvar orderInfoQuery = from c in CustomersInMemory.Customers.AsParallel()\n\
  join o in OrdersInMemory.Orders.AsParallel()\non c.Split(',')[0] equals o.Split(',')[1]\n\
  select new OrderInfo\n{\nCustomerID = c.Split(',')[0],\nCompanyName = c.Split(',')[1],\n\
  OrderID = Convert.ToInt32(o.Split(',')[0]),\nOrderDate = Convert.ToDateTime(o.Split(',')[2],\n\
  New CultureInfo(\"en-US\"))\n};\n```\n\n![Image](img/Image00165.jpg) 警告\n\n当你以这种方式连接两个数据源时，它们都必须是\
  \ `IEnumerable` 对象或 `ParallelQuery` 对象。这意味着如果你为一个源指定了 `AsParallel` 方法，也应该为另一个源指定\
  \ `AsParallel`。如果你没有这样做，你的代码将无法运行——它会报错停止。\n\n## 12. 多运行几次应用程序。注意 `Test2` 所花费的时间应该明显少于之前。PLINQ\
  \ 可以利用多个线程，通过并行获取连接中每个部分的数据来优化连接操作。\n\n## 13. 关闭应用程序并返回 Visual Studio。\n\n这两个简单的练习已经向你展示了\
  \ `AsParallel` 扩展方法和 PLINQ 的威力。请注意，PLINQ 是一项不断演进的技术，其内部实现可能会随着时间的而改变。此外，你在查询中执行的数据量和处理的数据量也会影响使用\
  \ PLINQ 的有效性。因此，你不应该将这些练习视为你应该始终遵循的固定规则。相反，它们说明了这样一点：你应该在自己的环境中，针对自己的数据，仔细衡量并评估使用\
  \ PLINQ 可能带来的性能或其他收益。\n\n### 取消 PLINQ 查询\n\n与普通的 LINQ 查询不同，你可以取消 PLINQ 查询。要做到这一点，你需要从\
  \ `CancellationTokenSource` 指定一个 `CancellationToken` 对象，并使用 `ParallelQuery` 的 `WithCancellation`\
  \ 扩展方法。\n\n点击此处查看代码图像\n\n```csharp\nCancellationToken tok = ...;\n...\nvar orderInfoQuery\
  \ = from c in CustomersInMemory.Customers.AsParallel().WithCancellation(tok)\njoin\
  \ o in OrdersInMemory.Orders.AsParallel()\non ...\n```\n\n你只需要在查询中指定一次 `WithCancellation`。取消适用于查询中的所有源。如果用于生成\
  \ `CancellationToken` 的 `CancellationTokenSource` 对象被取消，查询将带有 `OperationCanceledException`\
  \ 异常停止。\n\n### 同步对数据的并发访问\n\nPLINQ 并不总是应用程序最合适的技术。如果你手动创建任务，需要确保这些任务正确地协调它们的活动。.NET\
  \ Framework 类库提供了可以让你等待任务完成的方法，你可以使用这些方法在非常粗的粒度上协调任务。但请考虑如果两个任务尝试访问并修改相同的数据会发生什么。如果两个任务同时运行，它们的重叠操作可能会损坏数据。这种情况会导致难以纠正的错误，主要是因为它们具有不可预测性。\n\
  \n`Task` 类提供了一个强大的框架，你可以通过它设计并构建利用多个 CPU 内并行执行任务的应用程序。然而，在构建执行并发操作的解决方案时，你需要小心，特别是当这些操作共享数据访问时。你几乎无法控制并行操作的调度方式，甚至无法控制操作系统为使用任务构建的应用程序可能提供的并行程度。这些决定被留给运行时考虑，并取决于运行你应用程序的计算机的工作负载和硬件能力。这种级别的抽象是微软开发团队的一项刻意设计决策，它让你在构建需要并发任务的应用程序时，无需理解底层的线程和调度细节。但这种抽象是有代价的。尽管一切看起来都像魔法一样，但你必须花努力理解你的代码是如何运行的；否则，你可能会得到表现出不可预测（错误）行为的应用程序，如下例所示（此示例可以在包含第\
  \ 24 章 代码的文件夹中的 ParallelTest 项目找到）：\n\n点击此处查看代码图像\n\n```csharp\nusing System;\n\
  using System.Threading;\nclass Program\n{\n    private const int NUMELEMENTS = 10;\n\
  \    static void Main(string[] args)\n    {\n        SerialTest();\n    }\n    static\
  \ void SerialTest()\n    {\n        int[] data = new int[NUMELEMENTS];\n       \
  \ int j = 0;\n        for (int i = 0; i < NUMELEMENTS; i++)\n        {\n       \
  \     j = i;\n            doAdditionalProcessing();\n            data[i] = j;\n\
  \            doMoreAdditionalProcessing();\n        }\n        for (int i = 0; i\
  \ < NUMELEMENTS; i++)\n        {\n            Console.WriteLine($\"Element {i} has\
  \ value {data[i]}\");\n        }\n    }\n    static void doAdditionalProcessing()\n\
  \    {\n        Thread.Sleep(10);\n    }\n    static void doMoreAdditionalProcessing()\n\
  \    {\n        Thread.Sleep(10);\n    }\n}\n```\n\n`SerialTest` 方法以一种相当长的方式向整数数组填充值，然后遍历该数组打印每个项的索引及其值。`doAdditionalProcessing`\
  \ 和 `doMoreAdditionalProcessing` 方法模拟了会导致运行时交出控制权的长时间操作。程序的输出如下：\n\nElement 0 has\
  \ value 0\nElement 1 has value 1\nElement 2 has value 2\nElement 3 has value 3\n\
  Element 4 has value 4\nElement 5 has value 5\nElement 6 has value 6\nElement 7 has\
  \ value 7\nElement 8 has value 8\nElement 9 has value 9\n\n现在考虑下面的 `ParallelTest`\
  \ 方法。它与 `SerialTest` 方法相同，只是使用 `Parallel.For` 构造通过运行并发任务来填充 `data` 数组。每个运行的的表达式代码与\
  \ `SerialTest` 方法中的 `for` 循环相同。\n\n点击此处查看代码图像\n\n```csharp\nusing System;\nusing\
  \ System.Threading;\nusing System.Threading.Tasks;\n...\nstatic void ParallelTest()\n\
  {\n    int[] data = new int[NUMELEMENTS];\n    int j = 0;\n    Parallel.For(0, NUMELEMENTS,\
  \ (i) =>\n    {\n        j = i;\n        doAdditionalProcessing();\n        data[i]\
  \ = j;\n        doMoreAdditionalProcessing();\n    });\n    for (int i = 0; i <\
  \ NUMELEMENTS; i++)\n    {\n        Console.WriteLine($\"Element {i} has value {data[i]}\"\
  );\n    }\n}\n```\n\n意图是让 `ParallelTest` 方法执行与 `SerialTest` 方法相同的操作，使用了并发任务，并且（如果运气好）运行得快一点。问题是它可能并不总是按预期工作。`ParallelTest`\
  \ 方法生成的示例输出如下：\n\nElement 0 has value 1\nElement 1 has value 1\nElement 2 has value\
  \ 4\nElement 3 has value 8\nElement 4 has value 4\nElement 5 has value 1\nElement\
  \ 6 has value 4\nElement 7 has value 8\nElement 8 has value 8\nElement 9 has value\
  \ 9\n\n分配给 `data` 数组中每个项的值并不总是与 `SerialTest` 方法生成的值相同。此外，多次运行 `ParallelTest` 方法可能会产生不同的结果。\n\
  \n如果你检查 `Parallel.For` 构造中的逻辑，你应该能看到问题所在。每个任务运行的 表达式包含以下语句：\n\nj = i;\n\ndoAdditionalProcessing();\n\
  \ndata[i] = j;\n\ndoMoreAdditionalProcessing();\n\n\n\n\n\n```csharp\ndoMoreAdditionalProcessing();\n\
  ```\n\n这段代码看起来足够无害。它将变量 `i` 的当前值（标识正在运行循环迭代的索引变量）复制到变量 `j` 中，随后将 `j` 的值存储在数据数组中由\
  \ `i` 索引的元素中。如果 `i` 包含 5，则 `j` 被赋值为 5，随后 `j` 的值被存储在 `data[5]` 中。但在赋值给 `j` 和随后将其读取回之间，代码执行了更多工作；它调用了\
  \ `doAdditionalProcessing` 方法。如果该方法的执行需要很长时间，运行时可能会挂起线程并调度另一个任务。运行 `Parallel.For`\
  \ 结构另一个迭代的并发任务可能会运行并为 `j` 分配新值。因此，当原始任务恢复时，它赋值给 `data[5]` 的 `j` 值并不是它之前存储的值，导致数据损坏。更棘手的是，有时这段代码可能会按预期运行并产生正确的结果，而在另一些时候可能不会；这完全取决于计算机的忙程度以及各种任务的调度情况。因此，这些类型的\
  \ bug 在测试期间可能处于休眠状态，然后在生产环境中突然出现。\n\n变量 `j` 被所有并发任务共享。如果一个任务在 `j` 中存储一个值并在以后读取它，它必须确保在此期间没有其他任务修改\
  \ `j`。这要求在所有可以访问该变量的并发任务之间同步访问。实现同步访问的一种方法是锁定数据。\n\n### 锁定数据\n\nC# 语言通过 `lock` 关键字提供了锁定语义，你可以用它来保证对资源的独占访问。你可以像这样使用\
  \ `lock` 关键字：\n\n```csharp\nobject myLockObject = new object();\n\n...\n\nlock (myLockObject)\n\
  {\n    // 需要对共享资源进行独占访问的代码\n    ...\n}\n```\n\n`lock` 语句尝试在指定的对象上获取互斥锁（你实际上可以使用任何引用类型，而不仅仅是\
  \ `object`），如果该对象当前被另一个线程锁定，它将会阻塞。当线程获取锁时，`lock` 语句后的块中的代码将运行。在该块结束时，锁会被释放。如果另一个线程被阻塞等待锁，它随后就可以获取锁并继续其处理。\n\
  \n### 用于协调任务的同步原语\n\n`lock` 关键字对于许多简单场景很好，但在某些情况下，你可能有更复杂的需求。`System.Threading`\
  \ 命名空间包含了许多额外的同步原语，你可以使用它们来处理这些情况。这些同步原语是为任务设计的类；它们暴露了锁定机制，可以在任务持有锁时限制对资源的访问。它们支持多种锁定技术，你可以使用这些技术实现不同风格的并发访问，从简单的独占锁（单个任务对资源具有唯一访问权限）到信号量（多个任务可以同时访问资源，但是受控的），再到读/写锁（它允许不同的任务共享对资源的只读访问权限，同时保证需要修改资源的的线程具有独占访问权限）。\n\
  \n以下列表总结了这些原语中的一部分。如需更多信息，请参阅文档。\n\n-   **ManualResetEvent**: `ManualResetEvent`\
  \ 类提供了一种机制，一个或多个线程可以通过它等待接收信号。`ManualResetEvent` 对象可以处于两种状态：`signaled`（true）和 `unsignaled`（false）。任务创建一个\
  \ `ManualResetEvent` 对象并指定其初始状态。其他任务可以通过调用 `Wait` 方法等待 `ManualResetEvent` 对象被信号。如果\
  \ `ManualResetEvent` 对象处于 `unsignaled` 状态，`Wait` 方法将阻塞任务。另一个任务通过调用 `Set` 方法将 `ManualResetEvent`\
  \ 对象的状态更改为 `signaled`。`Reset` 方法将其更改为 `unsignaled`。\n\n-   **SemaphoreSlim**: 你可以使用\
  \ `SemaphoreSlim` 类来控制对资源池的访问。`SemaphoreSlim` 对象有一个初始值（非负整数）和一个可选的最大值。通常，`SemaphoreSlim`\
  \ 对象的初始值是池中资源的数量。访问池的任务首先调用 `Wait` 方法。该方法尝试递减 `SemaphoreSlim` 对象的值，如果结果不为零，则允许线程继续并从池中获取一个资源。任务完成后，任务应该调用\
  \ `SemaphoreSlim` 对象的 `Release` 方法。如果任务调用 `Wait` 方法且递减 `SemaphoreSlim` 对象值的结果会导致负值，则任务将等待直到另一个任务调用\
  \ `Release`。`SemaphoreSlim` 类还提供了 `CurrentCount` 属性，你可以用它来判断 `Wait` 操作是否可能成功或会导致阻塞。\n\
  \n-   **CountdownEvent**: 你可以将 `CountdownEvent` 类类为信号量的反向和手动重置事件的交叉。当任务创建一个 `CountdownEvent`\
  \ 对象时，它指定了一个初始值（非负整数）。一个或多个任务可以调用 `CountdownEvent` 对象的 `Wait` 方法，如果其值不零，任务将被阻塞。`Wait`\
  \ 不递减 `CountdownEvent` 对象的值；相反，其他任务可以调用 `Signal` 方法来减少该值。当 `CountdownEvent` 对象的值达到零时，所有阻塞的任务都会被信号并可以恢复运行。任务可以使用\
  \ `Reset` 方法将 `CountdownEvent` 对象的值设置回构造函数中指定的值，任务可以通过调用 `AddCount` 方法来增加此值。\n\n\
  -   **ReaderWriterLockSlim**: `ReaderWriterLockSlim` 类是一种高级的同步原语，支持单写写入者和多个读取者。其思想是：修改（写入）资源需要独占访问，但读取资源不需要；多个读取者可以同时访问同一资源，但不能与写入者同时访问。\n\
  \n\n\n\n想要读取资源的任务会调用 `ReaderWriterLockSlim` 对象的 `EnterReadLock` 方法。此操作会在对象上获取一个读锁。当任务完成对资源的操作后，它会调用\
  \ `ExitReadLock` 方法释放读锁。多个任务可以同时读取同一个资源，且每个任务都获取它自己的读锁。\n\n当任务修改资源时，它可以调用同一个 `ReaderWriterLockSlim`\
  \ 对象的 `EnterWriteLock` 方法来获取写锁。如果当前有一个或多个任务持有该对象的读锁，则 `EnterWriteLock` 方法将阻塞，直到所有读锁都已释放。任务获取写锁后，它就可以修改资源并调用\
  \ `ExitWriteLock` 方法释放锁。\n\n`ReaderWriterLockSlim` 对象仅有一个写锁。如果另一个任务尝试获取写锁，它将被阻塞，直到第一个任务释放该写锁。\n\
  \n为了确保写入任务不会被无限期阻塞，一旦任务请求了写锁，其他任务发的所有后续 `EnterReadLock` 调用都将被阻塞，直到写锁被获取并释放为止。\n\n\
  ![Image](img/Image00001.jpg)\n\n## Barrier（屏障）\n使用 `Barrier` 类，你可以在应用程序的特定点临时停止一组任务的执行，并且只有当所有任务都到达该点时才继续执行。它对于需要同步执行一系列并发操作的任务非常有用。\n\
  \n当任务创建一个 `Barrier` 对象时，它指定了该集合中将同步的任务数量。你可以将此值视为在 `Barrier` 类内部维护的任务计数器。该值稍后可以通过调用\
  \ `AddParticipant` 或 `RemoveParticipant` 方法进行修改。当任务到达同步点时，它会调用 `Barrier` 对象的 `SignalAndWait`\
  \ 方法，这会递减 `Barrier` 对象内部的线程计数器。如果该计数器大于 0，则任务会被阻塞。只有当计数器达到 0 时，所有等待 `Barrier` 对象的任务才会被释放，此时它们才能继续运行。\n\
  \n`Barrier` 类提供了 `ParticipantCount` 属性，它指定了所同步的任务数量；以及 `ParticipantsRemaining` 属性，该属性表示在屏障释放且被阻塞的任务继续运行之前，还需要多少个任务调用\
  \ `SignalAndWait`。\n\n你还可以在 `Barrier` 构造函数中指定一个委托。该委托可以引用一个在所有任务都到达屏障时运行的方法。`Barrier`\
  \ 对象将作为参数传递给该方法。在方法完成之前，屏障不会释放，任务也不会被释放。\n\n### 取消同步\n`ManualResetEventSlim`、`SemaphoreSlim`、`CountdownEvent`\
  \ 和 `Barrier` 类都支持遵循 第 23 章 中描述的取消模型来实现取消。这些类的每个等待操作都可以接受一个可选的 `CancellationToken`\
  \ 参数，该参数从 `CancellationTokenSource` 对象获取。如果你调用 `CancellationTokenSource` 对象的 `Cancel`\
  \ 方法，每个引用了从该源生成的 `CancellationToken` 的等待操作都将中止并抛出 `OperationCanceledException` 异常（取决于等待操作的上下文，可能被包装在\
  \ `AggregateException` 异常中）。\n\n下面的代码显示了如何调用 `SemaphoreSlim` 对象的 `Wait` 方法并指定取消令牌。如果等待操作被取消，将运行\
  \ `OperationCanceledException` 异常处理器。\n\n点击此处查看代码图片\n\n```csharp\nCancellationTokenSource\
  \ cancellationTokenSource = new CancellationTokenSource();\n\nCancellationToken\
  \ cancellationToken = cancellationTokenSource.Token;\n\n...\n\n// 保护包含 3 个资源池的信号量\n\
  \nSemaphoreSlim semaphoreSlim = new SemaphoreSlim(3);\n\n...\n\n// 在信号量上等待，如果另一个线程对\
  \ cancellationTokenSource\n// 调用了 Cancel，则捕获 OperationCanceledException\n\ntry\n\
  {\nsemaphoreSlim.Wait(cancellationToken);\n}\ncatch (OperationCanceledException\
  \ e)\n{\n...\n}\n```\n\n### 并发集合类\n许多多线程应用程序的一个共同需求是在集合中存储和检索数据。.NET Framework 提供的标准集合类默认不是线程安全的，尽管你可以使用上一节中描述的同步原语来封装在集合中添加、查询和删除元素的代码。然而，这个过程极易出错且扩展性不佳，因此\
  \ .NET Framework 类库在 `System.Collections.Concurrent` 命名空间中包含了一小部分线程安全的集合类和接口，这些类专门为任务任务设计。以下列表简要概述了该命名空间中的关键类型：\n\
  \n![Image](img/Image00001.jpg) **ConcurrentBag<T>** 这是一个用于持有无序项目集合的通用类。它包含了插入（`Add`）、删除（`TryTake()`）和检查（`TryPeek()`）集合中项目的方法。这些方法是线程安全的。该集合也是可枚举的，因此你可以使用\
  \ `foreach` 语句遍历其内容。\n\n![Image](img/Image00001.jpg) **ConcurrentDictionary<TKey,\
  \ TValue>** 此类实现了第 18 章中“使用集合)”描述的泛型 `Dictionary<TKey, TValue>` 集合类的线程安全版本。它提供了你可以使用的\
  \ `TryAdd`、`ContainsKey`、`TryGetValue`、`TryRemove` 和 `TryUpdate` 方法。\n\n![Image](img/Image00001.jpg)\
  \ **ConcurrentQueue<T>** 此类实现了第 18 章中描述的泛型 `Queue<T>` 集合类的线程安全版本。它包含了 `Enqueue`、`TryDequeue()`\
  \ 和 `TryPeek()` 方法。\n\n![Image](img/Image00001.jpg) **ConcurrentStack<T>** 这是泛型\
  \ `Stack<T>` 类的线程安全实现，同样描述于第 18 章。它提供了 `Push`、`TryPop()` 和 `TryPeek()` 等方法。\n\n\
  * *\n\n![Image](img/Image00005.jpg) **注意**\n为集合添加线程安全性会产生额外的运行时开销，因此这些类没有普通集合类快。在决定是否并行一组访问共享集合的操作时，你需要考虑这一点。\n\
  \n* *\n\n### 使用并发集合和锁实现线程安全访问\n在接下来的练习中，你将实现一个使用几何近似来计算 pi 的应用程序。最初，你将以单线程方式计算，然后将修改代码使用并行任务执行计算。在此过程中，你将发现一些需要解决的数据同步问题，并将通过使用并发集合类和锁来确保任务正确协调活动。\n\
  \n你将实现的算法基于简单的数学和统计采样来计算 pi。如果你画一个半径为 `r` 的圆，并画一个边切于圆的正方形，正方形的边长为 `2 * r`，如下所示：\n\
  \n![Image](img/Image00166.jpg)\n\n你可以这样计算正方形的面积 `S`：\n\n`S = (2 * r) * (2 * r)`\n\
  \n或者\n\n`S = 4 * r * r`\n\n圆的面积 `C` 计算公式如下：\n\n`C = pi * r * r`\n\n通过排列这些公式，你可以看到：\n\
  \n`r * r = C / pi`\n\n以及\n\n`r * r = S / 4`\n\n结合这些方程，我们得到：\n\n`pi = 4 * C / S`\n\
  \n\n\n\n该技巧在于确定圆 `C` 的面积相对于正方形 `S` 面积的比值。这正是统计采样的用用场。你可以生成一组落在正方形内的随机点，并统计这些点中有多少个也落在圆内。如果你生成了足够大且随机的样本，落在圆内的点与落在正方形内（且在圆内）的点的比例，就接近这两个形状面积的比值\
  \ `C / S`。你所做的仅仅是计数。\n\n如何判断一个点是否在圆内？为了帮助可视化解决方案，请在网格纸上画一个正方形，正方形的中心位于原点 `(0,0)`。然后你可以生成位于\
  \ `(r, r)` 到 `(+r, +r)` 范围内的数值对（或坐标）。你可以通过应用勾股定理确定这些坐标到原点的距离 `d`，从而判断任何坐标集合 `(x,\
  \ y)` 是否在圆内。你可以将 `d` 计算为 `((x * x) + (y * y))` 的平方根。如果 `d` 小于或等于半径 `r`，则坐标 `(x,\
  \ y)` 表示圆内的一个点，如下图所示：\n\n![Image](img/Image00167.jpg)\n\n你可以通过生成仅位于图表右上象限坐标来进一步简化问题，这样你只需要生成\
  \ 0 到 `r` 之间的随机数对。这就是你将在练习中采用的方法。\n\n***\n\n![Image](img/Image00005.jpg)  注意\n\n\
  本章的练习旨在设计在具有多核处理器的计算机上运行。如果你只有一个单核 CPU，将无法观察到相同的效果。此外，你不应该在练习之间启动任何额外的程序或服务，因为这些程序可能会影响你看到的结果。\n\
  \n***\n\n# 使用单线程计算 pi\n\n**1.** 如果 Visual Studio 2015 尚未运行，请启动它。\n\n**2.** 打开 `CalculatePI`\
  \ 解决方案，它位于文档文件夹中的 `\\Microsoft Press\\VCSBS\\Chapter 24\\CalculatePI` 文件夹中。\n\n\
  **3.** 在解决方案管理器（Solution Explorer）中，找到 `CalculatePI` 项目，双击 `Program.cs` 在代码和文本编辑器窗口中显示该文件。\n\
  \n这是一个控制台应用程序。应用程序的骨架结构已经为你创建好了。\n\n**4.** 滚动到文件底部并检查 `Main` 方法。它看起来如下：\n\n点击此处查看代码图像\n\
  \n```\nstatic void Main(string[] args)\n{\n    double pi = SerialPI();\n    Console.WriteLine($\"\
  Geometric approximation of PI calculated serially: {pi}\");\n    Console.WriteLine();\n\
  \    // pi = ParallelPI();\n    // Console.WriteLine($\"Geometric approximation\
  \ of PI calculated in parallel: {pi}\");\n}\n```\n\n此代码调用了 `SerialPI` 方法，该方法通过在本练习之前描述的几何算法计算\
  \ pi。结果作为 `double` 类型返回并显示。目前被注释的代码调用了 `ParallelPI` 方法，它通过并发任务执行相同的计算。显示的结果应该与 `SerialPI`\
  \ 方法返回的结果相同。\n\n**5.** 检查 `SerialPI` 方法。\n\n点击此处查看代码图像\n\n```csharp\nstatic double\
  \ SerialPI()\n{\n    List<double> pointsList = new List<double>();\n    Random random\
  \ = new Random(SEED);\n    int numPointsInCircle = 0;\n    Stopwatch timer = new\
  \ Stopwatch();\n    timer.Start();\n    try\n    {\n        // 待完成: 实现 PI 的几何近似计算\n\
  \        return 0;\n    }\n    finally\n    {\n        long milliseconds = timer.ElapsedMilliseconds;\n\
  \        Console.WriteLine($\"SerialPI complete: Duration: {milliseconds} ms\",);\n\
  \        Console.WriteLine($\"Points in pointsList: {pointsList.Count}. Points within\
  \ circle: {numPointsInCircle}\");\n    }\n}\n```\n\n该方法生成了一组大量的坐标，并计算每组坐标到原点的距离。集合的大小由\
  \ `Program` 类顶部的常量 `NUMPOINTS` 决定。该值越大，坐标集合就越大，该方法计算出的 pi 值就越准确。如果你的计算机内存足够，你可以增加\
  \ `NUMPOINTS` 的值。同样，如果你发现应用程序在运行时抛出 `OutOfMemoryException` 异常，可以减小此值。\n\n你将每个点到原点的距离存储在\
  \ `pointsList List<double>` 集合中。坐标数据通过 `random` 变量生成。这是一个 `Random` 对象，使用常量作为种子，以便每次运行程序时生成相同的随机数集。（这有助于你判断运行是否正确。）如果你想用不同的值初始化随机数生成器，可以更改\
  \ `Program` 类顶部的 `SEED` 常量。\n\n你使用 `numPointsInCircle` 变量来统计 `pointsList` 集合中位于圆边界内的点数。圆半径由\
  \ `Program` 类顶部的常量 `RADIUS` 指定。\n\n为了帮助你比较此方法与 `ParallelPI` 方法之间的性能，代码创建了一个名为 `timer`\
  \ 的 `Stopwatch` 变量并启动它。`finally` 块确定计算所需的时间并显示 `pointsList` 中的项目以及圆内的点数。\n\n**6.**\
  \ 在 `try` 块中，删除注释并移除 `return` 语句。（该语句仅用于确保代码编译。）在 `try` 块中添加如下所示的 `for` 块和语句：\n\n\
  点击此处查看代码图像\n\n```csharp\ntry\n{\n    for (int points = 0; points < NUMPOINTS; points++)\n\
  \    {\n        int xCoord = random.Next(RADIUS);\n        int yCoord = random.Next(RADIUS);\n\
  \        double distanceFromOrigin = Math.Sqrt(xCoord * xCoord + yCoord * yCoord);\n\
  \        pointsList.Add(distanceFromOrigin);\n        doAdditionalProcessing();\n\
  \    }\n}\n```\n\n此代码块生成了位于 0 到 `RADIUS` 范围内的坐标对，并将它们存储在 `xCoord` 和 `yCoord` 变量中。代码利用勾股定理计算这些坐标到原点的距离，并将结果添加到\
  \ `pointsList` 集合中。\n\n尽管此代码块计算量很少，但在真实的科学应用程序中，你可能会包含更复杂的计算会让处理器长时间运行。为了模拟这种情况，此代码块调用了另一个方法\
  \ `doAdditionalProcessing`。该方法的作用只是如代码所示占用若干 CPU 周期：\n\n点击此处查看代码图像\n\n```csharp\n\
  private static void doAdditionalProcessing()\n{\n    Thread.SpinWait(SPINWAITS);\n\
  }\n```\n\n`SPINWAITS` 是 `Program` 类顶部定义的另一个常量。\n\n***\n\n**7.** 在 `SerialPI` 方法中，在\
  \ `try` 块的 `for` 块之后，添加示例所示的 `foreach` 语句。\n\n点击此处查看代码图像\n\n```csharp\ntry\n{\n\
  \    for (int points = 0; points < NUMPOINTS; points++)\n    {\n        ...\n  \
  \  }\n    foreach (double datum in pointsList)\n    {\n        if (datum <= RADIUS)\n\
  \        {\n            numPointsInCircle++;\n        }\n    }\n}\n```\n\n\n\n\n\
  这段代码遍历 `pointsList` 集合并逐个检查每个值。如果该值小于或等于圆的半径，则增加 `numPointsInCircle` 变量的值。循环结束后，`numPointsInCircle`\
  \ 应该包含发现在圆边界内的坐标总数。\n\n### 8. 在 `foreach` 语句之后，在 `try` 块中添加以下**粗体**所示语句：\n\n点击此处查看代码图像\n\
  \n```cs\ntry\n{\n    for (int points = 0; points < NUMPOINTS; points++)\n    {\n\
  \        ...\n    }\n    foreach (double datum in pointsList)\n    {\n        ...\n\
  \    }\n    double pi = 4.0 * numPointsInCircle / NUMPOINTS;\n    return pi;\n}\n\
  ```\n\n第一条语句根据之前描述的公式，根据圆内点数与总点数的比例来计算 `pi`。该值作为方法的返回值返回。\n\n### 9. 在“调试”（Debug）菜单上，点击“不调试调试启动”（Start\
  \ Without Debugging）。\n\n程序运行并显示其对 `pi` 的近似值，如下图像所示。（在我的电脑上花了略多于 46 秒，所以请准备好等一会儿。）计算结果所需的时间也会显示。\n\
  \n![Image](img/Image00168.jpg)\n\n***\n\n![Image](img/Image00005.jpg) 注意\n\n除了计时之外，除非你更改了\
  \ `NUMPOINTS`、`RADIUS` 或 `SEED` 常量，否则你的结果应该是相同的。\n\n***\n\n### 10. 关闭控制台窗口并返回 Visual\
  \ Studio。\n\n在 `SerialPI` 方法中，生成点并计算它们与原点距离的 `for` 循环代码是一个明显的可以并行化的区域。这正是你将在下一个练习中要做的事情。\n\
  \n## 使用并行任务计算 pi\n\n### 1. 在“解决方案资源管理器”（Solution Explorer）中，双击 `Program.cs`，如果文件尚未打开，则在“代码和文本编辑器”窗口中显示它。\n\
  \n### 2. 找到 `ParallelPI` 方法。它包含与你在向 `try` 块中添加计算 `pi` 代码之前的 `SerialPI` 方法初始版本相同的代码。\n\
  \n### 3. 在 `try` 块中，删除注释并移除 `return` 语句。将此处**粗体**所示的 `Parallel.For` 语句添加到 `try`\
  \ 块中：\n\n点击此处查看代码图像\n\n```cs\ntry\n{\n    Parallel.For (0, NUMPOINTS, (x) =>\n \
  \   {\n        int xCoord = random.Next(RADIUS);\n        int yCoord = random.Next(RADIUS);\n\
  \        double distanceFromOrigin = Math.Sqrt(xCoord * xCoord + yCoord * yCoord);\n\
  \        pointsList.Add(distanceFromOrigin);\n        doAdditionalProcessing();\n\
  \    });\n}\n```\n\n此结构是 `SerialPI` 方法中 `for` 循环代码的并行对应。原始 `for` 循环体封装在一个 lambda\
  \ 表达式中。记住，循环的每次迭代都是通过任务执行的，任务可以并行运行。并行程度取决于计算机上的处理器核心数和其他可用资源。\n\n### 4. 在 `Parallel.For`\
  \ 语句之后，向 `try` 块中添加以下**粗体**所示代码。此代码与 `SerialPI` 方法中对应的语句相同。\n\n点击此处查看代码图像\n\n```cs\n\
  try\n{\n    Parallel.For (...\n    {\n        ...\n    });\n    foreach (double\
  \ datum in pointsList)\n    {\n        if (datum <= RADIUS)\n        {\n       \
  \     numPointsInCircle++;\n        }\n    }\n    double pi = 4.0 * numPointsInCircle\
  \ / NUMPOINTS;\n    return pi;\n}\n```\n\n### 5. 在 `Program.cs` 文件末附近的 `Main` 方法中，取消调用\
  \ `ParallelPI` 方法的代码以及显示结果的 `Console.WriteLine` 语句的注释。\n\n### 6. 在“调试”（Debug）菜单上，点击“不调试调试启动”。\n\
  \n程序运行。下面的图像显示了典型的输出（你的计时可能不同；我使用的是四核处理器）：\n\n![Image](img/Image00169.jpg)\n\n`SerialPI`\
  \ 方法计算的值与之前完全相同，但 `ParallelPI` 方法的结果实际上看起来有些可疑。随机数生成器使用了与 `SerialPI` 方法相同的值作为种子，因此它应该产生相同的随机数序列、相同的结果以及圆内点的数量。另一个奇怪的点是，`ParallelPI`\
  \ 方法中的 `pointsList` 集合似乎包含的点比 `SerialPI` 方法中的相同集合要少。\n\n***\n\n![Image](img/Image00005.jpg)\
  \ 注意\n\n如果 `pointsList` 集合实际上包含了预期的项数，请再次运行应用程序。你会发现在大多数（但并非所有）运行中，它包含的项比预期的少。\n\
  \n***\n\n### 7. 关闭控制台窗口并返回 Visual Studio。\n\n并行计算哪里出了问题？一个很好的起点是查看 `pointsList`\
  \ 集合中的项数。此集合是一个泛型 `List<double>`。然而，该类型不是线程安全的。`Parallel.For` 语句调用 `Add` 方法向集合添加值，但记住这些调用可能会相互干扰并导致损坏。解决方案是使用\
  \ `Concurrent` 命名空间中的集合，因为这些集合是线程安全的。\n\n## 使用线程安全的集合\n\n### 1. 在“解决方案资源管理器”中，双击\
  \ `Program.cs`，如果文件尚未打开，则在“代码和文本编辑器”窗口中显示它。\n\n### 2. 在文件顶部添加以下 `using` 指令：\n\n\
  点击此处查看代码图像\n\n```cs\nusing System.Concurrent;\n```\n\n### 3. 找到 `ParallelPI` 方法。在该方法的开头，将实例化\
  \ `List<double>` 集合的语句替换为创建 `ConcurrentBag<double>` 集合的代码，如下代码示例中的**粗体**所示：\n\n\
  点击此处查看代码图像\n\n```cs\nstatic double ParallelPI()\n{\n    ConcurrentBag<double> pointsList\
  \ = new ConcurrentBag<double>();\n    ...\n    ...\n}\n```\n\n注意该类无法指定默认容量，因此构造函数不接受参数。\n\
  \n你不需要更改此方法的任何其他代码；你通过 `Add` 方法向 `ConcurrentBag<T>` 集合添加项，这与向 `List<T>` 集合添加项的机制相同。\n\
  \n### 4. 在“调试”（Debug）菜单上，点击“不调试调试启动”。\n\n程序运行并使用 `SerialPI` 和 `ParallelPI` 方法显示对\
  \ `pi` 的近似值。下面的图像显示了典型的输出。\n\n![Image](img/Image00170.jpg)\n\n这次，`ParallelPI` 方法中的\
  \ `pointsList` 集合包含了正确数量，但圆内点的数量看起来仍然很高；它应该与 `SerialPI` 方法报告的相同。\n\n你还应该注意到，`ParallelPI`\
  \ 方法所需的时间与之前的练习相比增加了。这是因为 `ConcurrentBag<T>` 类中的方法必须锁定和解锁数据以保证线程安全，而这个过程增加了调用这些方法的开销。当你考虑是否适当并行化某个操作时，请记住这一点。\n\
  \n### 5. 关闭控制台窗口并返回 Visual Studio。\n\n\n\n你目前 `pointsList` 集合中的点数量是正确的，但为这些每个点记录的值现在存在疑问。`Parallel.For`\
  \ 结构中的代码调用了 `Random` 对象的 `Next` 方法，但与泛型 `List<T>` 类中的方法一样，该方法不是线程安全的。遗憾的是，`Random`\
  \ 类没有并发版本，因此你必须求助于使用其他技术来对 `Next` 方法的调用进行序列化。由于每次调用都非常短，因此使用简单的 `lock` 来保护该方法的调用是合理的。\n\
  \n### 使用 lock 序列化方法调用\n\n**1.** 在“解决方案管理器”中，双击 `Program.cs` 以在代码和文本编辑器窗口中显示该文件（如果它尚未打开）。\n\
  \n**2.** 找到 `ParallelPI` 方法。修改 `Parallel.For` 语句中 lambda 表达式的代码，使用 `lock` 语句保护对\
  \ `random.Next` 的调用。将 `pointsList` 集合指定为 lock 的主体，如下文加粗部分所示：\n\n点击此处查看代码图像\n\n```cpp\n\
  static double ParallelPI()\n{\n\n...\n\nParallel.For(0, NUMPOINTS, (x) =>\n{\n\n\
  int xCoord;\n\nint yCoord;\nlock(pointsList)\n{\n\nxCoord = random.Next(RADIUS);\n\
  \nyCoord = random.Next(RADIUS);\n}\ndouble distanceFromOrigin = Math.Sqrt(xCoord\
  \ * xCoord + yCoord * yCoord);\n\npointsList.Add(distanceFromOrigin);\n\ndoAdditionalProcessing();\n\
  \n});\n\n...\n\n}\n```\n\n注意 `xCoord` 和 `yCoord` 变量是在 `lock` 语句之外声明的。你这样做是因为 `lock`\
  \ 语句定义了自己的作用域，在指定 lock 语句作用域的块内定义的任何变量都会结构退出时消失。\n\n**3.** 在“调试”菜单上，点击“无调试启动”。\n\
  \n这一次，`SerialPI` 和 `ParallelPI` 方法计算出的 pi 值是相同的。唯一的区别是 `ParallelPI` 方法运行得更快。\n\n\
  ![Image](img/Image00171.jpg)\n\n**4.** 关闭控制窗口，返回 Visual Studio。\n\n### 总结\n\n在本章中，你学习了如何使用\
  \ `async` 修饰符和 `await` 运算符定义异步方法。异步方法基于任务（tasks），而 `await` 运算符指定了可以使用任务来执行异步处理的点。\n\
  \n你还学习了一些关于 PLINQ 的知识，以及你如何使用 `AsParallel` 扩展方法将某些 LINQ 查询并行化。然而，PLINQ 本身是一个大课题，本章仅向你展示了如何入门。更多信息，请参阅\
  \ Visual Studio 提供的文档中的“Parallel LINQ (PLINQ)”主题。\n\n本章还向你展示了如何使用为任务提供的同步原语来同步并发任务的数据访问。你学习了如何使用并发集合类以线程安全的方式维护数据集合。\n\
  \n![Image](img/Image00001.jpg) 如果你想继续阅读下一章，请保持 Visual Studio 2015 运行并转到第 25 章，“为\
  \ Universal Windows Platform 应用实现用户界面](#text00033.html_ch25)”。\n\n![Image](img/Image00001.jpg)\
  \ 如果你现在想退出 Visual Studio 2015，在“文件”菜单上，点击“退出”。如果看到保存对话框，点击“是”并保存项目。\n\n### 快速参考\n\
  \n![Image](img/Image00172.jpg)![Image](img/Image00173.jpg)![Image](img/Image00174.jpg)\n\
  \n## 第 25 章为 Universal Windows Platform 应用实现用户界面\n\n完成本章后，你将能够：\n\n![Image](img/Image00001.jpg)\
  \ 描述典型的 Universal Windows Platform 应用的功能。\n\n![Image](img/Image00001.jpg) 为 Universal\
  \ Windows Platform 应用实现可扩展的用户界面，该界面能够适应不同的设备形态和设备方向。\n\n![Image](img/Image00001.jpg)\
  \ 为 Universal Windows Platform 应用创建并应用样式。\n\n最近版本的 Windows 引入了一个用于构建和运行高度交互应用程序的平台，具有持续连接的、触摸驱动的用户界面，并支持嵌入式设备传感器。更新的应用程序安全和生命周期模型改变了用户与应用程序工作的方式。该平台被称为\
  \ Windows Runtime (WinRT)，我在本书中偶尔提到了它。你可以使用 Visual Studio 构建 WinRT ，它们可以适应各种设备形态，从手持平板电脑到带有大高分辨率屏幕的桌面级\
  \ PC。使用 Windows 8 和 Visual Studio 2013，你还可以将这些应用程序作为 Windows Store 应用发布到 Windows\
  \ Store。\n\n此外，你可以使用 Windows Phone SDK 8.0（集成在 Visual Studio 中）设计并实现运行在 Windows\
  \ Phone 8 设备上的应用程序。这些应用程序与其面向平板和桌面的兄弟版本有很多相似之处，但它们在更受限的环境中运行，通常资源较少，并且需要支持不同的用户界面布局。因此，Windows\
  \ Phone 8 应用使用不同版本的 WinRT，称为 Windows Phone Runtime，你可以将 Windows Phone 8 应用作为 Windows\
  \ Phone Store 应用。你可以创建一个类库，在 Windows 平板/桌面应用程序之间共享应用程序和业务逻辑。\n\n\n\n\n# 通用 Windows\
  \ 平台 (UWP) 应用特性\n\n许多现代手持设备和平板电脑使用户能够通过触摸与应用程序交互。你应该基于这种用户体验（UX）风格来设计你的 UWP 应用。Windows\
  \ 10 包含了大量的触摸控件，这些控件也可以配合鼠标和键盘共同工作。你不需要在应用中分离触摸和鼠标功能；只需为触摸设计你的应用，这样如果用户愿意，或在使用不支持触摸交互的设备时，他们仍然可以使用鼠标和键盘进行操作。\n\
  \n图形用户界面（GUI）响应手势并向用户提供反馈的方式可以极大提升应用程序的专业感。`Visual Studio 2015` 带的 UWP 应用模板包含了一个动画库，你可以在应用中使用该库来标准化这种反馈，并与微软提供的操作系统和软件无缝融合。\n\
  \n***\n\n![Image](img/Image00005.jpg) 注意\n\n`gesture`（手势）一词是指用户可以执行的手动触控型操作。例如，用户可以用手指点击某个项目，这种\
  \ `gesture` 的响应通常与你预期的鼠标点击行为相同。然而，手势比使用鼠标捕获的简单操作要表达丰富得多。例如，旋转手势涉及用户将两个手指放在屏幕上并用它们画出圆弧；在典型的\
  \ Windows 10 应用中，这种 `gesture` 应该导致 UI 根据用户手指移动的方向旋转选定的对象。其他手势还包括通过捏合放大某个项目以显示更多细节、长按显示有关项目的更多信息（类似于鼠标右键点击），以及滑动选择项目并将其拖过屏幕。\n\
  \n***\n\nUWP 旨在运行在具有不同屏幕尺寸和分辨率的广泛设备上。因此，当你实现 UWP 应用时，你需要构建你的软件，使其能够适应运行的环境，并自动缩放至设备的屏幕尺寸和方向向。这种方法让你的软件面向了日益广阔的市场。此外，许多现代设备还可以通过内置传感器和加速度计检测其方向，以及用户更改该方向的速度。UWP\
  \ 应用可以在用户倾斜或旋转设备时调整布局，使用户能够以最符合其个人习惯的模式工作。你还应该理解，移动性是许多现代应用的关键需求，而通过 UWP 应用，用户可以漫游，其数据可以通过云迁移到他们特定时刻运行你应用程序的任何设备上。\n\
  \nUWP 应用的生命周期与传统的桌面应用有所不同。你应该设计成可以在智能手机等设备上运行的应用，在用户切换焦点到另一个应用时挂起执行，并在焦点返回时恢复运行。这种方法有助于在受限设备上节省资源和电量。当\
  \ Windows 确定需要释放系统资源（如内存）时，它实际上可能会关闭一个挂起的应用。当应用下次运行时，它应该能够从上次离开的地方继续。这意味着你需要准备好在代码中管理应用状态信息，将其保存到硬盘，并在适当的时机进行还原。\n\
  \n***\n\n![Image](img/Image00005.jpg) 注意\n\n你可以在微软网站上的“Guidelines for app suspend\
  \ and resume”（应用挂起和恢复指南）页面找到更多关于如何管理 UWP 应用生命周期的信息，地址为 `[`msdn.microsoft.com/library/windows/apps/hh465088.aspx`](https://msdn.microsoft.com/library/windows/apps/hh465088.aspx)`。\n\
  \n当你构建新的 UWP 应用时，可以使用 `Visual Studio 2015` 提供的工具对其进行打包并将其上传到 Windows Store。其他用户随后可以连接到商店、下载你的应用并安装它。你可以为你的应用收费，也可以免费提供。这种分发和部署机制取决于你的应用是可靠的，并符合微软指定的安全策略。当你将应用上传到\
  \ Windows Store 时，它将通过一系列检查，以验证其不包含恶意代码，并符合 UWP 应用的安全要求。这些安全限制规定了你的应用访问安装其的计算机上资源的方式。例如，默认情况下，UWP\
  \ 应用无法直接写入文件系统或无法监听来自网络的入站请求（这是病毒和其他恶意软件通常表现出的两种行为之一）。但是，如果你的应用需要执行受限操作，你可以在存储在\
  \ `Package.appxmanifest` 文件的应用清单数据中将它们指定为能力（capabilities）。这些信息记录在应用的元数据中，并指示微软执行额外测试，以验证你的应用使用这些功能的方式。\n\
  \n`Package.appxmanifest` 文件是一个 XML 文档，但你可以在 `Visual Studio` 中使用 `Manifest Designer`\
  \ 对其进行编辑。下面的图片显示了一个示例。在这里，正在使用 `Capabilities` 选项来指定应用程序可以执行的受限操作。\n\n![Image](img/Image00175.jpg)\n\
  \n在此示例中，应用程序声明它需要：\n\n![Image](img/Image00001.jpg) 从互联网接收入站数据，但不能作为服务器，且没有本地网络访问权限。\n\
  \n![Image](img/Image00001.jpg) 读取和写入用户“文档”文件夹中的文件。\n\n![Image](img/Image00001.jpg)\
  \ 访问提供设备位置 GPS 信息。\n\n![Image00001.jpg] 访问内置摄像头或外部网络摄像头的视频流。\n\n用户会被告知这些要求，并且在所有情况下，用户可以在安装应用后禁用这些设置；应用程序必须准备好替代方案或禁用这些功能的功能。\n\
  \n***\n\n![Image](img/Image00005.jpg) 注意\n\n你可以在微软网站上的“App declarations”页面找到更多关于\
  \ UWP 应用支持的能力的信息：`[`msdn.microsoft.com/library/windows/apps/hh46936.aspx`](http://msdn.microsoft.com/library/windows/apps/hh46936.aspx)`。\n\
  \n***\n\n理论足够了——让我们开始构建 UWP 应用。\n\n## 使用空应用模板构建通用平台应用\n\n构建 UWP 应用的最简单方法是使用 `Visual\
  \ Studio 2015` 自带的 UWP 应用模板。早期章节中实现的许多基于 GUI 的应用程序都使用了空应用模板，这是一个很好的起点。\n\n在接下来的练习中，你将为一家名为\
  \ Adventure Works 的虚拟公司设计用户界面。这家公司制造并供应自行车及配件。该应用将允许用户输入和修改 Adventure Works 的客户详情。\n\
  \n### 创建 Adventure Works Customers 应用\n\n1. 如果尚未运行，启动 `Visual Studio 2015`。\n2.\
  \ 在 **File** 菜单上指向 **New**，然后点击 **Project**。\n3. 在 **New Project** 对话框中，在左窗格中，展开\
  \ **Templates**，展开 **Visual C**，展开 **Windows**，点击 **Universal**。\n4. 在中间窗格中，点击 **Blank\
  \ App (Windows Universal)** 图标。\n5. 在 **Name** 字段中，输入 `Customers`。\n6. 在 **Location**\
  \ 字段中，在你的文档文件夹输入 `\\Microsoft Press\\VCSBS\\Chapter 25`。\n7. 点击 **OK**。\n\n新应用已创建，`App.xaml.cs`\
  \ 文件已在 **Code and Text Editor** 窗口中显示。你目前可以忽略此文件。\n\n\n\n\n\n### 8. 在解决方案资源管理器中，双击\
  \ `MainPage.xaml`。\n\n设计视图窗口出现并显示一个空白页面。你可以从工具箱拖入控件来添加应用程序所需的各种控件，如第 1 章中“欢迎来到 C#”所示。然而，出于本次练习的考虑，集中精力研究定义表单布局的\
  \ XAML 标记会更具启发性。如果你检查这些标记，它们看起来应该是这样的：\n\n点击此处此处查看代码图像\n\n```xml\n<Page\nx:Class=\"\
  Customers.MainPage\"\nxmlns=\"http://schemas.microsoft.com/winfx/2006/xaml/presentation\"\
  \nxmlns:x=\"http://schemas.microsoft.com/winfx/2006/xaml\"\nxmlns:local=\"using:Customers\"\
  \nxmlns:d=\"http://schemas.microsoft.com/expression/blend/2008\"\nxmlns:mc=\"http://schemas.openxmlformats.org/markup-compatibility/2006\"\
  \nmc:Ignorable=\"d\">\n<Grid Background=\"{ThemeResource ApplicationPageBackgroundThemeBrush}\"\
  >\n</Grid>\n</Page>\n```\n\n表单以 XAML `<Page>` 标签开始，以结束标签 `</Page>` 结束。这些标签之间的所有内容定义了页的内容。\n\
  \n`<Page>` 标签的属性包含许多格式为 `xmlns:id = “...”` 的声明。这些是 XAML 命名空间声明，它们的工作方式与 C# `using`\
  \ 指令类似，因为都能将项目引入作用范围。许多控件和其他项目都定义在这些 XAML 命名空间中，你可以忽略大部分此类声明。但是，有一个看起来相当奇怪的声明需要你注意：\n\
  \n`xmlns:local=\"using:Customers\"`\n\n此声明将 C# `Customers` 命名空间中的项目引入作用范围。你可以在 XAML\
  \ 代码中通过为它们添加 `local` 前缀来引用此命名空间中的类和其他类型。`Customers` 命名空间是为应用程序中的代码生成的命名空间。\n\n###\
  \ 9. 在解决方案资源管理器中，展开 `MainPage.xaml`，然后双击 `MainPage.xaml.cs` 以在代码和文本编辑器窗口中显示它。\n\n\
  ### 10. 回想本书之前的练习可知，这是包含应用程序逻辑和表单事件处理程序的 C# 文件。它看起来像这样（为了节省空间，省略了文件顶部的 `using` 指令）：\n\
  \n点击此处查看代码图像\n\n```csharp\n// The Blank Page item template is documented at http://go.microsoft.com/fwlink/?LinkId\n\
  =402352&clcid=0x409\nnamespace Customers\n{\n    /// <summary>\n    /// 一个可以单独使用或在\
  \ Frame 内进行导航的空页面。\n    /// </summary>\n    public sealed partial class MainPage\
  \ : Page\n    {\n        public MainPage()\n        {\n            this.InitializeComponent();\n\
  \        }\n    }\n}\n```\n\n此文件定义了 `Customers` 命名空间中的类型。页面由名为 `MainPage` 的类实现，并继承自\
  \ `Page` 类。`Page` 类实现了 UWP 应用程序中 XAML 页面的默认功能，因此你只需要在 `MainPage` 类中编写定义特定于你的应用程序逻辑的代码。\n\
  \n### 11. 返回设计视图窗口中的 `MainPage.xaml` 文件。如果你查看页面的 XAML 标记，你应该会注意到 `<Page>` 标签包含了以下属性：\n\
  \n`x:Class=\"Customers.MainPage\"`\n\n此属性将定义页面布局的 XAML 标记与提供页面背后逻辑的 `MainPage` 类连接起来。\n\
  \n这就是一个简单 UWP 应用程序的基础管道工作。当然，让图形化应用程序产生价值的是它向用户呈现信息的方式。这并不总是像听起来那么简单。设计一个吸引人且易用的图形界面需要并非所有开发者都具备的专业技能（我知道，因为我自己就缺乏这些技能）。然而，许多拥有这些技能的图形艺术家并不是程序员，因此尽管他们可能设计出极佳的用户界面，但可能无法实现使其其实用的所需的逻辑。幸运的是，Visual\
  \ Studio 2015 使你能够将用户界面设计与业务逻辑分离，这样图形艺术家和开发者就可以合作构建出一个既外观酷又运行良好的应用程序。开发者只需要专注于应用程序的基础布局，让图形艺术家提供样式即可。\n\
  \n#### 实现可缩放的用户界面\n\n为 UWP 应用程序布局用户界面的关键在于理解如何使其缩放并适应用户可能运行应用程序的设备上不同的形状因素。在接下来的练习中，你将研究如何实现这种缩放。\n\
  \n#### 为 Customers 应用程序布局页面\n\n**1.** 在设计视图窗口顶部的工具栏中，注意有一个允许选择设计表面分辨率和形状因素的下拉列表框，以及一组允许为支持旋转的设备（平板电脑和手机支持；桌面设备不支持）选择方向（竖屏或横屏）的按钮。目的是可以使用这些选项快速查看用户界面在不同设备上的显示。\n\
  \n![Image](img/Image0176.jpg)\n\n默认布局是 5 英寸屏幕的竖屏。在下拉列表框中，选择 13.3” 桌面 (1280)。注意此形状因素默认为横屏。\n\
  \n**2.** 查看页面的 XAML 标记。\n\n页面包含一个 `Grid` 控件：\n\n点击此处查看代码图像\n\n```xml\n<Grid Background=\"\
  {ThemeResource ApplicationPageBackgroundThemeBrush}\">\n```\n\n* * *\n\n![Image](img/Image00005.jpg)\n\
  \n不要担心 `Grid` 控件指定的 `Background` 属性。这是使用的一种示例，你将在本章晚些时候学习样式。\n\n* * *\n\n理解 `Grid`\
  \ 控件如何工作是构建可缩放灵活界面的基础。<Page>` 元素只能包含一个项目，如果你愿意，可以将 `Grid` 控件替换为 `Button`，如下例所示：\n\
  \n* * *\n\n![Image](img/Image00005.jpg)\n\n不要输入以下代码。仅用于说明目的。\n\n* * *\n\n点击此处查看代码图像\n\
  \n```xml\n<Page\n...\n<Button Content=\"Click Me\"/>\n</Page>\n```\n\n然而，生成的应用程序可能并不实用——一个包含按钮且不显示其他内容的表单不太可能获得伟大应用程序奖。如果你尝试向页面添加第二个控件（例如\
  \ `TextBox`），你的代码将无法编译，并发生如下所示的错误：\n\n![Image](img/Image0177.jpg)\n\n`Grid` 控件的目的是方便向页面添加多个项目`Grid`\
  \ 控件是容器控件的一个示例；它可以包含许多其他控件，你可以指定这些其他控件在网格中的位置。其他容器控件也是可用的。例如，`StackPanel` 控件会自动将其包含的控件按垂直排列，每个控件直接位于其前一个控件下方。\n\
  \n在本文应用程序中，你将使用 `Grid` 来持有用户输入和查看客户数据所需的控件。\n\n**3.** 向页面添加一个 `TextBlock` 控件，可以通过从工具箱拖入，也可以在\
  \ XAML 窗格中直接输入文本 `<TextBlock />`，位于起始 `<Grid>` 标签后的空白行，如下：\n\n点击此处查看代码图像\n\n```xml\n\
  <Grid Background=\"{ThemeResource ApplicationPageBackgroundThemeBrush}\">\n<TextBlock\
  \ />\n</Grid>\n```\n\n* * *\n\n![Image](img/Image00013.jpg)\n\n\n\n\n\n如果未出现 `Toolbox`（工具箱），请点击\
  \ `View` 菜单上的 `Toolbox`，它将显示在左侧的工具栏中。此外请注意，你可以直接在页面的 XAML 窗口中输入控件代码，无需从 `Toolbox`\
  \ 拖放控件。\n\n### 4. 此 `TextBlock` 为页面提供标题。使用下表中的值设置 `TextBlock` 控件的属性：\n\n![Image](img/Image00178.jpg)\n\
  \n你可以通过 `Properties` 窗口或在 XAML 窗口中输入相应的 XAML 标记来设置这些属性，如下所示粗部分所示：\n\n点击此处查看代码图像\n\
  \n```xml\n<TextBlock HorizontalAlignment=\"Left\" Margin=\"400,90,0,0\" TextWrapping=\"\
  Wrap\" Text=\"Adventure Works Customers\" VerticalAlignment=\"Top\" FontSize=\"\
  50\"/>\n```\n\n生成的文本应显示在 Design View（设计视图）窗口中，如下：\n\n![Image](img/Image00179.jpg)\n\
  \n注意，当你从 `Toolbox` 将控件拖到表单时，会出现连接器，指定控件的两个边距离其放置的容器控件边缘的距离。在前面的示例中，`TextBlock` 控件的这些连接器标记为值\
  \ `400`（距离网格左边缘）和 `90`（距离网格顶边缘）。在运行时，如果调整了 `Grid` 控件的大小，`TextBlock` 将移动以保持这些距离，在这种情况下，这可能会导致\
  \ `TextBlock`  `Grid` 右边缘和底边缘的像素距离发生变化。你可以通过设置 `HorizontalAlignment` 和 `VerticalAlignment`\
  \ 属性来指定控件锚定的边缘或边缘。`Margin` 属性指定了到锚定边缘的距离。再次，在示例中，`TextBlock` 的 `HorizontalAlignment`\
  \ 属性被设置为 `Left`，`VerticalAlignment` 属性设置为 `Top`，这就是为什么控件锚定在网格的左侧和顶部边缘的原因。`Margin`\
  \ 属性包含四个值，指定控件的左、上、右、下侧（按此顺序）距离容器相应边缘的距离。如果控件的某边未锚定到容器的边缘，你可以将 `Margin` 属性中的相应值设置为\
  \ `0`。\n\n### 5. 向页面再添加四个 `TextBlock` 控件。这些 `TextBlock` 控件是标签，有助于用户识别显示在页面上的数据。使用下表中的值设置这些控件的属性：\n\
  \n![Image](img/Image00180.jpg)\n\n与之前一样，你可以从 `Toolbox` 拖放控件并使用 `Properties` 窗口设置它们的属性，也可以在现有的\
  \ `TextBlock` 控件之后、闭合标签 `</Grid>` 之前在 XAML 格中输入以下 XAML 标记：\n\n点击此处查看代码图像\n\n```xml\n\
  <TextBlock HorizontalAlignment=\"Left\" Margin=\"330,190,0,0\" TextWrapping=\"Wrap\"\
  \ Text=\"ID\" VerticalAlignment=\"Top\" FontSize=\"20\"/>\n<TextBlock HorizontalAlignment=\"\
  Left\" Margin=\"460,190,0,0\" TextWrapping=\"Wrap\" Text=\"Title\" VerticalAlignment=\"\
  Top\" FontSize=\"20\"/>\n<TextBlock HorizontalAlignment=\"Left\" Margin=\"620,190,0,0\"\
  \ TextWrapping=\"Wrap\" Text=\"First Name\" VerticalAlignment=\"Top\" FontSize=\"\
  20\"/>\n<TextBlock HorizontalAlignment=\"Left\" Margin=\"975,190,0,0\" TextWrapping=\"\
  Wrap\" Text=\"Last Name\" VerticalAlignment=\"Top\" FontSize=\"20\"/>\n```\n\n###\
  \ 6. 在 `TextBlock` 控件下方，添加三个显示文本 ID、First Name` 和 `Last Name` 的 `TextBox` 控件。使用下表设置这些控件的值。注意，`Text`\
  \ 属性应设置为空字符串 `\"\"`。同样注意，`id` `TextBox` 控件被标记为只读，因为客户 ID 将在你稍后添加的代码中自动生成：\n\n![Image](img/Image00181.jpg)\n\
  \n以下代码显示了这些控件的相应 XAML 标记：\n\n```xml\n<TextBox x:Name=\"id\" HorizontalAlignment=\"\
  Left\" Margin=\"300,240,0,0\" TextWrapping=\"Wrap\" Text=\"\" VerticalAlignment=\"\
  Top\" FontSize=\"20\" IsReadOnly=\"True\"/>\n<TextBox x:Name=\"firstName\" HorizontalAlignment=\"\
  Left\" Margin=\"550,240,0,0\" TextWrapping=\"Wrap\" Text=\"\" VerticalAlignment=\"\
  Top\" FontSize=\"20\"/>\n<TextBox x:Name=\"lastName\" HorizontalAlignment=\"Left\"\
  \ Margin=\"875,240,0,0\" TextWrapping=\"Wrap\" Text=\"\" VerticalAlignment=\"Top\"\
  \ FontSize=\"20\"/>\n```\n\n`Name` 属性对于控件不是必须的，但如果你想在应用的 C# 代码中引用该控件，它是有用的。注意 `Name`\
  \ 属性带有 `x:` 前缀。这是对 XAML 标记顶部 `Page` 属性中指定的 XML 命名空间 `http://schemas.microsoft.com/winfx/2006/xaml`\
  \ 的引用。此命名空间定义了所有控件的 `Name` 属性。\n\n![Image](img/Image00005.jpg)\n\n注意不需要理解为什么 `Name`\
  \ 属性这样定义，但需更多信息，你可以阅读 `http://msdn.microsoft.com/library/ms75290.aspx` 上的文章“x:Name\
  \ Directive”。\n\n`Width` 属性指定控件的宽度，`TextWrapping` 属性指示如果用户尝试向控件中输入超过其宽度的信息会发生什么。在这种情况下，所有\
  \ `TextBox` 控件将文本换行到相同宽度的另一行（控件将垂直方向扩展）。替代值 `NoWrap` 会导致文本在用户输入时水平滚动。\n\n### 7.\
  \ 向表单中添加一个 `ComboBox` 控件，将其放在 `Title` `TextBlock` 控件下方、`id` 和 `firstName` `TextBox`\
  \ 控件之间。按如下设置此控件的属性：\n\n![Image](img/Image00182.jpg)\n\n此控件的相应 XAML 标记如下：\n\n```xml\n\
  <ComboBox x:Name=\"title\" HorizontalAlignment=\"Left\" Margin=\"420,240,0,0\" VerticalAlignment=\"\
  Top\" Width=\"100\" FontSize=\"20\"/>\n```\n\n你使用 `ComboBox` 控件来显示值列表，用户可以从中选择。\n\
  \n### 8. 在 Design View 窗口中，点击 `ComboBox` 控件。在 `Properties` 窗口中，如果 `Common` 属性类别尚未展开，请将其展开。然后，点击\
  \ `Items` 属性旁出现的省略号按钮。\n\nObject Collection Editor（对象集合编辑器）窗口打开。\n\n### 9. 在窗口左下方的列表中，选择\
  \ `ComboBoxItem`，然后点击 `Add`。在显示项目属性的右窗格中，如果 `Common` 部分尚未展开，请将其展开，然后在 `Content`\
  \ 属性中输入 `Mr`。\n\n![Image](img/Image00183.jpg)\n\n### 10. 点击 OK。\n\nObject Collection\
  \ Editor 关闭。如果你检查 `title` `ComboBox` 的 XAML 标记，它现在应该像这样：\n\n```xml\n<ComboBox x:Name=\"\
  title\" HorizontalAlignment=\"Left\" Margin=\"420,240,0,0\" VerticalAlignment=\"\
  Top\" Width=\"100\" FontSize=\"20\">\n    <ComboBoxItem Content=\"Mr\"/>\n</ComboBox>\n\
  ```\n\n这里有两点需要注意。第一是 `ComboBox` 标记被拆分为起始 `<ComboBox>` 标签和闭合 `</ComboBox>` 标签。第二点是在这些标签之间，Visual\
  \ Studio 添加了一个 `Content` 属性设置为 `Mr` 的 `ComboBoxItem` 元素。当应用程序运行时，该项将显示在下拉列表中。\n\n\
  ### 11. 向 `title` `ComboBox` 添加值 `Mrs`、`Ms` 和 `Miss`。你可以使用 Object Collection Editor，也可以手动输入\
  \ XAML 标记。生成的标记应该像这样：\n\n```xml\n<ComboBox x:Name=\"title\" HorizontalAlignment=\"\
  Left\" Margin=\"420,240,0,0\" VerticalAlignment=\"Top\" Width=\"75\" FontSize=\"\
  20\">\n    <ComboBoxItem Content=\"Mr\"/>\n    <ComboBoxItem Content=\"Mrs\"/>\n\
  \    <ComboBoxItem Content=\"Ms\"/>\n    <ComboBoxItem Content=\"Miss\"/>\n</ComboBox>\n\
  ```\n\n\n\n\n\n![Image](img/Image00005.jpg) 注意\n\n`ComboBox` 控件可以显示简单的元素，例如显示文本的\
  \ `ComboBoxItem` 控件集合，但也可以包含更复杂的元素，如按钮、复选框和单选按钮。如果你正在添加简单的 `ComboBoxItem` 控件，手动输入\
  \ XAML 标记可能更简单；但如果你正在添加更复杂的控件，对象集合编辑器（Object Collection Editor）可能会变得非常有用。然而，你应该避免在组合框中试图过度聪明；最好的应用程序是那些提供最直观\
  \ UI 的程序，在组合框中嵌入复杂的控件会让用户感到困惑。\n\n* * *\n\n### 12. 向表单再添加两个 `TextBox` 控件和两个 `TextBlock`\
  \ 控件。通过 `TextBox` 控件，用户将能够为客户输入电子邮件地址和电话号码，“TextBlock` 控件为文本框提供标签。使用下表中的值设置控件的属性。\n\
  \n![Image](img/Image00184.jpg)![Image](img/Image00185.jpg)\n\n这些控件的 XAML 标记应该如下：\n\
  \n点击此处查看代码图像\n\n```xml\n<TextBlock HorizontalAlignment=\"Left\" Margin=\"300,390,0,0\"\
  \ TextWrapping=\"Wrap\" Text=\"Email\" VerticalAlignment=\"Top\" FontSize=\"20\"\
  />\n<TextBox x:Name=\"email\" HorizontalAlignment=\"Left\" Margin=\"450,390,0,0\"\
  \ TextWrapping=\"Wrap\" Text=\"\" VerticalAlignment=\"Top\" Width=\"400\" FontSize=\"\
  20\"/>\n<TextBlock HorizontalAlignment=\"Left\" Margin=\"300,540,0,0\" TextWrapping=\"\
  Wrap\" Text=\"Phone\" VerticalAlignment=\"Top\" FontSize=\"20\"/>\n<TextBox x:Name=\"\
  phone\" HorizontalAlignment=\"Left\" Margin=\"450,540,0,0\" TextWrapping=\"Wrap\"\
  \ Text=\"\" VerticalAlignment=\"Top\" Width=\"200\" FontSize=\"20\"/>\n```\n\n设计视图窗口中完成后的表单应该看起来：\n\
  \n![Image](img/Image00186.jpg)\n\n### 13. 在调试（Debug）菜单上，点击“启动调试”（Start Debugging）来生成并运行应用程序。\n\
  \n应用程序启动并显示表单。你可以向表单中输入数据并从组合框中选择标题，但你还做不了其他操作。然而，一个大得的问题是表单看起来非常糟糕。显示器的右侧被截断了，大部分文本发生了换行，而且“姓”（Last\
  \ Name）文本框被截断了：\n\n![Image](img/Image00187.jpg)\n\n### 14. 点击并拖动窗口的右侧以扩展显示，使文本和控件的显示与在\
  \ Visual Studio 设计视图窗口中显示的一。这是表单设计的原始尺寸。\n\n### 15. 调整显示 Customer 应用程序的窗口到最小宽度。这一次，表单的大部分内容消失了。部分\
  \ `TextBlock` 内容发生了换行，但表单在此视图下显然是不可用的。\n\n### 16. 回到 Visual Studio，在调试（Debug）菜单上，点击“停止调试”（Stop\
  \ Debugging）。\n\n这是一个关于谨慎布局应用程序的有益的教训。尽管应用程序在与设计视图窗口相相同的窗口中运行时看起来良好，但一旦你将窗口调整为更窄的视图，它就会变得不再实用（甚至完全没用）。此外，该应用程序假设用户将在横屏模式的设备上查看屏幕。如果你临时将设计视图窗口切换到\
  \ 12 英寸平板电脑设备尺寸并点击竖屏模式（Portrait orientation）按钮，你就可以看到用户在支持不同方向的平板电脑上运行应用程序并旋转设备切换到竖屏模式时，表单会是什么样子。（之后忘了切换回\
  \ 13.3 英寸桌面设备尺寸。）\n\n![Image](img/Image00188.jpg)\n\n问题在于，目前为止所示的布局技术无法扩展并适应不同的设备尺寸和方向。幸运的是，你可以使用\
  \ `Grid` 控件的属性以及另一个称为视觉状态管理器（Visual State Manager）的功能来解决这些问题。\n\n* * *\n\n### 使用模拟器测试通用\
  \ Windows 应用程序\n\n即使你没有平板电脑，你仍然可以使用 Visual Studio 2015 提供的模拟器测试你的 UWP 应用程序，并查看它们在移动设备上的表现。模拟器模仿了平板电脑设备，让你能够模拟用户手势（如缩放和滑动对象），以及旋转和更改设备的分辨率。\n\
  \n若要在模拟器中运行应用程序，请打开 Visual Studio 工具栏上的“调试目标”（Debug Target）下拉列表。默认情况下，调试目标设置为 `Local\
  \ Machine`（本地机器），会导致应用程序在你的计算机上全屏运行，但你可以从列表中选择 `Simulator`（模拟器），这会在调试应用程序时启动模拟器。请注意，如果你需要进行远程调试，也可以将调试目标设置为另一台计算机（选择此选项时，系统会提示输入远程计算机的网络地址）。下面的图片显示了调试目标列表：\n\
  \n![Image](img/Image00189.jpg)\n\n选择 `Simulator` 后，当你从 Visual Studio 的调试（Debug）菜单中运行应用程序时，模拟器将启动并显示你的应用程序。模拟器窗口右侧的工具栏包含一组工具，你可以通过鼠标来模拟用户手势。如果应用程序需要设备地理位置信息，你甚至可以模拟用户的位置。然而，对于测试应用程序布局，最重要的工具是\
  \ `Clockwise`（顺时针旋转）、`Counterclockwise`（逆时针旋转）和 `Change Resolution`（更改分辨率）。下面的图片显示了模拟器中运行的\
  \ Customer 应用程序。应用程序已最大化以占据整个屏幕。标签描述了每个按钮的功能。\n\n![Image](img/Image00190.jpg)\n\n\
  * * *\n\n![Image](img/Image00005.jpg) 注意\n\n本节中的截图是在分辨率为 1366x768 的计算机上截取的（代表 10.6\
  \ 英制显示）。如果你使用的是不同的显示分辨率，可能需要点击 `Change Resolution` 按钮切换到 1366 ×768 以获得此处所示的结果。\n\
  \n* * *\n\n下面的图片显示了用户点击 `Clockwise` 按钮后相同的应用程序，这会导致应用程序以竖屏模式运行：\n\n![Image](img/Image00191.jpg)\n\
  \n你还可以尝试更改模拟器的分辨率，查看应用程序如何表现。下面的图片显示了当模拟器设置为高分辨率设备（2560 ×1440，27 英寸显示器的典型分辨率）时的\
  \ Customer 应用程序。你可以看到应用程序显示被挤在屏幕的左上角：\n\n![Image](img/Image00192.jpg)\n\n模拟器的行为与\
  \ Windows 10 计算机完全相同（实际上，它是到你计算机的远程桌面连接）。要停止模拟器，点击 Windows 按钮（在模拟器中，而不是你的桌面上），点击“电源”，然后点击\
  \ `Disconnect`（断开连接）。\n\n你应该注意到 Visual Studio 还支持特定移动设备的模拟器。某些模拟器可能列在模拟器下拉列表中，但你可以通过选择\
  \ `Download New Emulators`（下载新模拟器）来下载新模拟器。\n\n* * *\n\n##### 使用 *Grid* 控件实现表格化布局\n\
  \n\n\n\n你可以使用 `Grid` 控件来实现表格化布局。一个 `Grid` 包含行和列，你可以指定其他控件放置在哪些行和列中。`Grid` 控件的妙之处在于，你可以将其包含的行和列的大小指定为相对值；当网格缩小或增大以适应用户可能切换的不同表单尺寸和方向时，行和列会随网格成比例地缩小或增大。网格中行与列的交点定义了一个单元格，如果你将控件放置在单元格中，它们将随着行和列的缩小和增大而移动。因此，实现可扩展\
  \ UI 的关键在于将其分解为单元格集合，并将相关元素放在同一个单元格中。单元格可以包含另一个 `Grid`，让你能够精细调整每个元素的精确位置。\n\n如果你考虑\
  \ Customers（客户）应用程序，你会发现 UI 分为两个主要区域：包含标题的头部部分和包含客户详情的正文部分。在这些区域之间留出一些间距并在表单底部留出边距后，你可以为这些区域分配相对大小，如下所示：\n\
  \n![Image](img/Image00193.jpg)\n\n该图仅显示了粗略的估计，但标题行的高度是下方间距行高度的两倍。正文行的高度是间距行的十倍，底部边距的高度是间距高度的两倍。\n\
  \n为了放置每个区域中的元素，你可以定义一个具有四行的 `Grid` 并在每行中放置适当的项目。然而，表单的正文可以用另一个复杂的 `Grid` 来描述，如下所示：\n\
  \n![Image](img/Image001994.jpg)\n\n同样，每行的高度都是以相对方式指定的，每列的宽度也是如此。此外，你可以清楚地看到 Email（电子邮件）和\
  \ Phone（电话）的 `TextBox` 元素并不完全符合此网格模式。如果你非常吹求细节，可能会选择在表单正文内部定义进一步的 `Grid` 以使这些元素适应布局。然而，你应该记住此网格的目的，即定义元素的相对位置和间距。因此，元素超出网格布局中单元格的边界是可以接受的。\n\
  \n在接下来的练习中，你将修改 Customers 应用程序的布局，使用这种网格格式来定位控件。\n\n### 修改布局以适应不同的表单尺寸和方向\n\n**1.**\
  \ 在 Customers 应用程序的 XAML 窗格中，在现有 `Grid` 元素内部添加另一个 `Grid`。为这个新的 `Grid` 设置距离父 `Grid`\
  \ 左右边缘 10 像素的边距，距离上下边缘 20 像素的边距，如下所示代码中的粗体部分：\n\n点击此处查看代码图像\n\n```xml\n<Grid Background=\"\
  {ThemeResource ApplicationPageBackgroundThemeBrush}\">\n\n<Grid Margin=\"10,20,10,20\"\
  >\n\n</Grid>\n\n<TextBlock HorizontalAlignment=\"Left\" TextWrapping=\"Wrap\"\n\
  Text=\"Adventure Works Customers\" ... />\n\n...\n\n</Grid>\n```\n\n你可以将行和列定义为现有\
  \ `Grid` 的一部分，为了与其他 UWP 应用程序保持一致的视觉效果，你应该在页面左侧和顶部留出空白区域。\n\n**2.** 在新的 `Grid` 元素中添加粗体所示的\
  \ `<Grid.RowDefinitions>` 部分。\n\n点击此处查看代码图像\n\n```xml\n<Grid Margin=\"10,20,10,20\"\
  >\n\n<Grid.RowDefinitions>\n\n<RowDefinition Height=\"2*\"/>\n<RowDefinition Height=\"\
  *\"/>\n<RowDefinition Height=\"10*\"/>\n<RowDefinition Height=\"2*\"/>\n\n</Grid.RowDefinitions>\n\
  \n</Grid>\n```\n\n`<Grid.RowDefinitions>` 部分定义了网格的行。在示例中，你定义了四行。你可以指定像素指定的绝对值来指定行的大小，也可以使用\
  \ `*` 运算符表示大小是相对的，并让 Windows 在应用程序运行时根据屏幕的表单尺寸和分辨率自行计算行的大小。示例中使用的值对应于之前图中所示 Customers\
  \ 表单的头部、正文、间距和底部边距的相对行大小。\n\n**3.** 将包含文本“Adventure Works Customers”的 `TextBlock`\
  \ 控件移动到 `Grid` 中，紧跟在 `</Grid.RowDefinitions>` 标签之后。\n\n**4.** 为 `TextBlock` 控件添加\
  \ `Grid.Row` 属性并将其值设置为 `0`。\n\n这表示 `TextBlock` 应该定位在 `Grid` 的第一行内。（`Grid` 控件从零开始对行和列进行计数。）\n\
  \n***\n\n![Image](img/Image00005.jpg) 注意\n\n`Grid.Row` 属性是附加属性（attached property）的一个示例。附加属性是控件从其所放置的容器控件中接收的属性。在网格外部，`TextBlock`\
  \ 没有 `Row` 属性（这将毫无意义），但当放置在网格内部时，`Row` 属性附加到 `TextBlock` 上，`TextBlock` 控件可以为其分配值。`Grid`\
  \ 控件随后使用此值来决定在哪里显示 `TextBlock` 控件。附加属性很容易识别，因为它们的格式为 `容器类型.属性名`。\n\n***\n\n**5.**\
  \ 删除 `Margin` 属性，并将 `HorizontalAlignment` 和 `VerticalAlignment` 属性设置为 `Center`。\n\
  \n这将使 `TextBlock` 在行中居中。`Grid` 和 `TextBlock` 的 XAML 代码所示（突出 `TextBlock` 的变化）：\n\n\
  点击此处查看代码图像\n\n```xml\n<Grid Margin=\"10,20,10,20\">\n\n<Grid.RowDefinitions>\n\n\
  <RowDefinition Height=\"2*\"/>\n<RowDefinition Height=\"*\"/>\n<RowDefinition Height=\"\
  10*\"/>\n<RowDefinition Height=\"2*\"/>\n\n</Grid.RowDefinitions>\n\n<TextBlock\
  \ Grid.Row=\"0\" HorizontalAlignment=\"Center\" ...\n\n```\n\n**6.** 在 `TextBlock`\
  \ 控件之后添加另一个嵌套的 `Grid` 控件。此 `Grid` 将用于布局表单正文中的控件，并应该出现在外部 `Grid` 的第三行（大小为 `10` 的行），因此将\
  \ `Grid.Row` 属性设置为 `2`，如下面代码中的粗体所示：\n\n点击此处查看代码图像\n\n```xml\n<Grid Margin=\"10,20,10,20\"\
  >\n\n<Grid.RowDefinitions>\n\n<RowDefinition Height=\"2*\"/>\n<RowDefinition Height=\"\
  *\"/>\n<RowDefinition Height=\"10*\"/>\n<RowDefinition Height=\"2*\"/>\n\n</Grid.RowDefinitions>\n\
  \n<TextBlock Grid.Row=\"0\" HorizontalAlignment=\"Center\" .../>\n\n<Grid Grid.Row=\"\
  2\">\n\n</Grid>\n\n...\n\n</Grid>\n```\n\n**7.** 为新的 `Grid` 控件添加以下 `<Grid.RowDefinitions>`\
  \ 和 `<Grid.ColumnDefinitions>` 部分：\n\n点击此处查看代码图像\n\n```xml\n<Grid Grid.Row=\"2\"\
  >\n\n<Grid.RowDefinitions>\n\n<RowDefinition Height=\"*\"/>\n<RowDefinition Height=\"\
  *\"/>\n<RowDefinition Height=\"2*\"/>\n<RowDefinition Height=\"*\"/>\n<RowDefinition\
  \ Height=\"2*\"/>\n<RowDefinition Height=\"*\"/>\n<RowDefinition Height=\"4*\"/>\n\
  \n</Grid.RowDefinitions>\n\n<Grid.ColumnDefinitions>\n\n<ColumnDefinition Width=\"\
  *\"/>\n<ColumnDefinition Width=\"*\"/>\n<ColumnDefinition Width=\"20\"/>\n<ColumnDefinition\
  \ Width=\"*\"/>\n<ColumnDefinition Width=\"20\"/>\n<ColumnDefinition Width=\"2*\"\
  />\n<ColumnDefinition Width=\"20\"/>\n<ColumnDefinition Width=\"2*\"/>\n<ColumnDefinition\
  \ Width=\"*\"/>\n\n</Grid.ColumnDefinitions>\n\n</Grid>\n```\n\n这些行和列定义指定了之前图中所示表单正文每行和列的高度和宽度。在放置控件的每列之间留有\
  \ 20 像素的小间距。\n\n**8.** 将显示 ID、Title、Last Name 和 First Name 标签的 `TextBlock` 控件移动到嵌套的\
  \ `Grid` 控件内部，紧跟在 `</Grid.ColumnDefinitions>` 标签之后。\n\n\n\n\n### 9. 将每个 `TextBlock`\
  \ 控制的 `Grid.Row` 属性设置为 `0`（这些标签将出现在网格的第一行）。将 ID 标签的 `Grid.Column` 属性设置为 `1`，Title\
  \ 标签的 `Grid.Column` 属性设置为 `3`，First Name 标签的 `Grid.Column` 属性设置为 `5`，Last Name 标签的\
  \ `Grid.Column` 属性设置为 `7`。\n\n### 10. 移除每个 `TextBlock` 控件的 `Margin` 属性，并将 `HorizontalAlignment`\
  \ 和 `VerticalAlignment` 属性设置为 `Center`。这些控件的 XAML 标记如下所示（更改部分已用粗体标记）：\n\n点击此处查看代码图片\n\
  \n```xml\n<Grid Grid.Row=\"2\">\n<Grid.RowDefinitions>\n...\n</Grid.RowDefinitions>\n\
  <Grid.ColumnDefinitions>\n...\n</Grid.ColumnDefinitions>\n<TextBlock Grid.Row=\"\
  0\" Grid.Column=\"1\" HorizontalAlignment=\"Center\"\nTextWrapping=\"Wrap\" Text=\"\
  ID\" VerticalAlignment=\"Center\" FontSize=\"20\"/>\n<TextBlock Grid.Row=\"0\" Grid.Column=\"\
  3\" HorizontalAlignment=\"Center\"\nTextWrapping=\"Wrap\" Text=\"Title\" VerticalAlignment=\"\
  Center\" FontSize=\"20\"/>\n<TextBlock Grid.Row=\"0\" Grid.Column=\"5\" HorizontalAlignment=\"\
  Center\"\nTextWrapping=\"Wrap\" Text=\"First Name\" VerticalAlignment=\"Center \"\
  \ FontSize=\"20\"/>\n<TextBlock Grid.Row=\"0\" Grid.Column=\"7\" HorizontalAlignment=\"\
  Center\"\nTextWrapping=\"Wrap\" Text=\"Last Name\" VerticalAlignment=\"Center\"\
  \ FontSize=\"20\"/>\n</Grid>\n```\n\n### 11. 将 `id`、`firstName` 和 `lastName` TextBox\
  \ 控件以及 `title` ComboBox 控件移动到嵌套 `Grid` 控件内部，紧邻 `Last Name` `TextBlock` 控件。\n\n将这些控件放在\
  \ `Grid` 控件的第 1 行。将 `id` 控件放在第 1 列，`title` 控件放在第 3 列，`firstName` 控件放在第 5 列，`lastName`\
  \ 控件放在第 7 列。\n\n移除这些控件的每个 `Margin`，并将 `VerticalAlignment` 属性设置为 `Center`。移除 `Width`\
  \ 属性，并将 `HorizontalAlignment` 属性设置为 `Stretch`。这会导致控件在显示时占据整个单元格，并且控件会随着单元格大小的变化而收缩或放大。\n\
  \n这些控件完成后的 XAML 标记如下所示，更改部分已用粗体标记：\n\n点击此处查看代码图片\n\n```xml\n<Grid Grid.Row=\"2\"\
  >\n<Grid.RowDefinitions>\n...\n</Grid.RowDefinitions>\n<Grid.ColumnDefinitions>\n\
  ...\n</Grid.ColumnDefinitions>\n...\n<TextBlock Grid.Row=\"0\" Grid.Column=\"7\"\
  \ ... Text=\"Last Name\" .../>\n<TextBox Grid.Row=\"1\" Grid.Column=\"1\" x:Name=\"\
  id\" HorizontalAlignment=\"Stretch\"\nTextWrapping=\"Wrap\" Text=\"\" VerticalAlignment=\"\
  Center\" FontSize=\"20\" IsReadOnly=\"True\"/>\n<TextBox Grid.Row=\"1\" Grid.Column=\"\
  5\" x:Name=\"firstName\" HorizontalAlignment=\"Stretch \"\nTextWrapping=\"Wrap\"\
  \ Text=\"\" VerticalAlignment=\"Center\" FontSize=\"20\"/>\n<TextBox Grid.Row=\"\
  1\" Grid.Column=\"7\" x:Name=\"lastName\" HorizontalAlignment=\"Stretch\"\nTextWrapping=\"\
  Wrap\" Text=\"\" VerticalAlignment=\"Center\" FontSize=\"20\"/>\n<ComboBox Grid.Row=\"\
  1\" Grid.Column=\"3\" x:Name=\"title\" HorizontalAlignment=\"Stretch\"\nVerticalAlignment=\"\
  Center\" FontSize=\"20\">\n<ComboBoxItem Content=\"Mr\"/>\n<ComboBoxItem Content=\"\
  Mrs\"/>\n<ComboBoxItem Content=\"Ms\"/>\n<ComboBoxItem Content=\"Miss\"/>\n</ComboBox>\n\
  </Grid>\n```\n\n### 12. 将 Email 标签的 `TextBlock` 控件和 `email` TextBox 控件移动到嵌套 `Grid`\
  \ 控件中，紧邻 `title` ComboBox 控件的结束标签。\n\n将这些控件放在 `Grid` 控件的第 3 行。将 Email 标签放在第 1 列，`email`\
  \ TextBox 控件放在第 3 列。此外，将 `email` TextBox 控件的 `Grid.ColumnSpan` 属性设置为 5；这样，该列就可以跨越五列扩展到其\
  \ `Width` 属性指定的值，如前面的图所示。\n\n将 Email 标签控件的 `HorizontalAlignment` 属性设置为 `Center`，但将\
  \ `email` TextBox 控件的 `HorizontalAlignment` 属性设置为 `Left`；该控件应保持相对于其所跨越的第一列的左对齐，而不是在所有列中居中。\n\
  \n将 Email 标签和 `email` TextBox 控件的 `VerticalAlignment` 属性设置为 `Center`。\n\n移除这两个控件的\
  \ `Margin` 属性。\n\n接下来的 XAML 标记显示了这些控件完成后的定义：\n\n点击此处查看代码图片\n\n```xml\n<Grid Grid.Row=\"\
  2\">\n<Grid.RowDefinitions>\n...\n</Grid.RowDefinitions>\n<Grid.ColumnDefinitions>\n\
  ...\n</Grid.ColumnDefinitions>\n...\n<ComboBox Grid.Row=\"1\" Grid.Column=\"3\"\
  \ x:Name=\"title\" ...>\n...\n</ComboBox>\n<TextBlock Grid.Row=\"3\" Grid.Column=\"\
  1\" HorizontalAlignment=\"Center\" TextWrapping=\"Wrap\" Text=\"Email\" VerticalAlignment=\"\
  Center\" FontSize=\"20\"/>\n<TextBox Grid.Row=\"3\" Grid.Column=\"3\" Grid.ColumnSpan=\"\
  5\" x:Name=\"email\" HorizontalAlignment=\"Left\"\nTextWrapping=\"Wrap\" Text=\"\
  \" VerticalAlignment=\"Center\" FontSize=\"20\"/>\n</Grid>\n```\n\n\n\n\n# 20. 在模拟器中，双击表单顶部边缘将视图恢复为窗口，然后拖动并调整窗口大小，使表单显示在屏幕左半部分。将窗口缩小到最小。这就是应用程序在手机等设备上可能的外。\n\
  \n所有控件仍然可见，但 Phone 标签的文本和标题会换行，导致它们难以阅读，而且控件也不再特别容易使用：\n\n![Image](img/Image00197.jpg)\n\
  \n# 21. 在模拟器中，点击 Start 按钮，点击 Settings（设置），点击 Power（电源），然后点击 Disconnect（断）。\n\n模拟器关闭，你返回\
  \ Visual Studio。\n\n# 22. 在 Visual Studio 工具栏上，在 Debug Target（调试目标）下拉列表框中，选择 `Local\
  \ Machine`。\n\n## 使用 Visual State Manager 适配布局\n\nCustomers 应用的用户界面可以根据不同的分辨率和外因子缩放，但如果你缩小视图宽度，它仍然运行得良好，而且在宽度更窄的手机上可能看起来也不太好。想一想，这些情况下问题的解决方案与其说是缩放控件，不如说是实际上以不同的方式重新布局它们。例如，如果\
  \ Customers 表单在窄视图中像这样显示，会更有意义：\n\n![Image](img/Image001198.jpg)\n\n你可以通过几种方式实现这种效果：\n\
  \n![Image](img/Image00001.jpg) 你可以为 `MainPage.xaml` 文件创建多个版本，每个设备族对应一个。这些 XAML 文件中的都可以链接到同一个后台代码文件（`MainPage.xaml.cs`），以便它们都运行相同的代码。例如，要为手机创建一个\
  \ XAML 文件，向项目添加一个名为 `DeviceFamily-Mobile` 的文件夹（此名称非常重要），然后使用 `Add New Item` 命令向该文件夹添加名为\
  \ `MainPage.xaml` 的新 XAML 视图。在此页面文件夹上按照它们在手机上显示的方式布局控件。XAML 视图将自动链接到现有的 `MainPage.xaml.cs`\
  \ 文件。在运行时，UWP 将根据运行应用程序的设备类型选择合适的视图。\n\n![Image](img/Image00001.jpg) 你可以使用 `Visual\
  \ State Manager` 在运行时修改页面的布局。所有 UWP 应用都实现了一个跟踪应用程序视觉状态的 `Visual State Manager`。它可以检测窗口高度和宽度的变化，你可以添加\
  \ XAML 标记根据窗口的大小对控件进行定位。这些标记可以移动控件或显示和隐藏控件。\n\n![Image](img/Image00001.jpg) 你可以使用\
  \ `Visual State Manager` 根据窗口的高度和宽度在视图之间切换。这种方法是这里描述的前两个选项的混合体，但它是最不混乱（你不需要大量复杂的\
  \ XAML 代码来计算每个控件的最佳位置），而且是最灵活的（如果在同一台设备上缩小了窗口，它仍然有效）。\n\n你将在接下来的练习中遵循这些方法中的第三种。第一步是为应该在窄视图中显示的客户数据定义布局。\n\
  \n### 为窄视图定义布局\n\n# 1. 在 Customers 应用的 XAML 格中，为 `Grid` 控件添加下方加粗显示所示的 `x:Name` 和\
  \ `Visibility` 属性：\n\n```xml\n<Grid Background=\"{ThemeResource ApplicationPageBackgroundThemeBrush}\"\
  >\n  <Grid x:Name=\"customersTabularView\" Margin=\"10,20,10,20\" Visibility=\"\
  Collapsed\" >\n    ...\n  </Grid>\n</Grid>\n```\n\n此 `Grid` 控件将包含表单的默认视图。你将在本系列练习的其他\
  \ XAML 标记中引用此 `Grid` 控件，因此需要给它一个名称。`Visibility` 属性指定控件是显示（`Visible`）还是隐藏（`Collapsed`）。默认值为\
  \ `Visible`，但在定义另一个以列格式显示数据的 Grid ，你会先隐藏此 `Grid`。\n\n# 2. 在 `customersTabularView`\
  \ Grid 控件的结束标签 `</Grid>` 之后，添加另一个 `Grid` 控件。将 `x:Name` 属性设置为 `customersColumnarView`，将\
  \ `Margin` 属性设置为 `10,20,10,20`，并将 `Visibility` 属性设置为 `Visible`。\n\n![Image](img/Image00013.jpg)\
  \ 提示\n\n你可以在设计视图窗口的 XAML 格中展开和收起元素，通过点击出现在 XAML 标记左边缘的 + 和 – 号，使结构更易于阅读。\n\n```xml\n\
  <Grid Background=\"{ThemeResource ApplicationPageBackgroundThemeBrush}\">\n  <Grid\
  \ x:Name=\"customersTabularView\" Margin=\"10,20,10,20\" Visibility=\"Collapsed\"\
  >\n    ...\n  </Grid>\n  <Grid x:Name=\"customersColumnarView\" Margin=\"10,20,10,20\"\
  \ Visibility=\"Visible\">\n  </Grid>\n</Grid>\n```\n\n此 `Grid` 控件将包含表单的“窄”视图。此格中的字段将如之前所述，以列的方式布局。\n\
  \n# 3. 在 `customersColumnarView` Grid 控件中，添加以下行定义：\n\n```xml\n<Grid x:Name=\"customersColumnarView\"\
  \ Margin=\"10,20,10,20\" Visibility=\"Visible\">\n  <Grid.RowDefinitions>\n    <RowDefinition\
  \ Height=\"\"/>\n    <RowDefinition Height=\"\"/>\n  </Grid.RowDefinitions>\n</Grid>\n\
  ```\n\n你将使用第一行显示标题，使用第二行输入数据。\n\n# 4. 紧接行定义，添加下方所示的 `TextBlock` 控件。该控件在第一行显示截断的标题\
  \ Customers。将 `FontSize` 设置为 30。\n\n```xml\n<Grid x:Name=\"customersColumnarView\"\
  \ Margin=\"10,20,10,20\" Visibility=\"Visible\">\n  <Grid.RowDefinitions>\n    ...\n\
  \  </Grid.RowDefinitions>\n  <TextBlock Grid.Row=\"0\" HorizontalAlignment=\"Center\"\
  \ TextWrapping=\"Wrap\" Text=\"Customers\" VerticalAlignment=\"Center\" FontSize=\"\
  30\"/>\n</Grid>\n```\n\n# 5. 在 `customersColumnarView` 控件的第 1 行添加另一个 `Grid` 控件，直接位于包含标题的\
  \ `TextBlock` 控件。此 `Grid` 控件将分列显示标签和数据输入控件，因此向此 `Grid` 添加下方代码示例所示的行和列定义。\n\n```xml\n\
  <Grid Grid.Row=\"1\">\n  <Grid.ColumnDefinitions>\n    <ColumnDefinition/>\n   \
  \ <ColumnDefinition/>\n  </Grid.ColumnDefinitions>\n  <Grid.RowDefinitions>\n  \
  \  <RowDefinition/>\n    <RowDefinition/>\n    <RowDefinition/>\n    <RowDefinition/>\n\
  \    <RowDefinition/>\n  </Grid.RowDefinitions>\n</Grid>\n```\n\n注意，如果一组行或列具有相同的高度或宽度，则不需要指定它们的大小。\n\
  \n# 6. 从 `customersTabularView` Grid 控件将 ID、Title、First Name 和 Last Name `TextBlock`\
  \ 控件的 XAML 标记复制到新的 `Grid` 控件中，紧接刚刚添加的行定义。将 ID 控件放在第 0 行，Title 控件放在第 1 行，First Name\
  \ 控件放在第 2 行，Last Name 控件放在第 3 行。将所有控件放在第 0 列。\n\n```xml\n<Grid.RowDefinitions>\n\
  \  ...\n</Grid.RowDefinitions>\n<TextBlock Grid.Row=\"0\" Grid.Column=\"0\" HorizontalAlignment=\"\
  Center\" TextWrapping=\"Wrap\" Text=\"ID\" VerticalAlignment=\"Center\" FontSize=\"\
  20\"/>\n<TextBlock Grid.Row=\"1\" Grid.Column=\"0\" HorizontalAlignment=\"Center\"\
  \ TextWrapping=\"Wrap\" Text=\"Title\" VerticalAlignment=\"Center\" FontSize=\"\
  20\"/>\n<TextBlock Grid.Row=\"2\" Grid.Column=\"0\" HorizontalAlignment=\"Center\"\
  \ TextWrapping=\"Wrap\" Text=\"First Name\" VerticalAlignment=\"Center\" FontSize=\"\
  20\"/>\n<TextBlock Grid.Row=\"3\" Grid.Column=\"0\" HorizontalAlignment=\"Center\"\
  \ TextWrapping=\"Wrap\" Text=\"Last Name\" VerticalAlignment=\"Center\" FontSize=\"\
  20\"/>\n```\n\n\n\n\n\n## 7. 将 `customersTabularView Grid` 控件中的 `id`、`title`、`firstName`\
  \ 和 `lastName TextBox` 以及 `ComboBox` 控件的 XAML 标记复制到新的 `Grid` 控件中，紧随 `TextBox` 控件之后。将\
  \ `id` 控件放在第 0 行，`title` 控件放在第 1 行，`firstName` 控件放在第 2 行，`lastName` 控件放在第 3 行。将四个控件放在第\
  \ 1 列。同时，通过在前名前加上字母 `c`（代表 column）来更改控件名称。此最终更改是为了避免与 `customersTabularView Grid`\
  \ 控件中现有控件名称冲突。\n\n点击此处查看代码图像\n\n```xml\n<TextBlock Grid.Row=\"3\" Grid.Column=\"\
  0\" HorizontalAlignment=\"Center\"\nTextWrapping=\"Wrap\" Text=\"Last Name\" .../>\n\
  \n<TextBox Grid.Row=\"0\" Grid.Column=\"1\" x:Name=\"cId\" HorizontalAlignment=\"\
  Stretch\"\nTextWrapping=\"Wrap\" Text=\"\" VerticalAlignment=\"Center\" FontSize=\"\
  20\" IsReadOnly=\"True\"/>\n\n<TextBox Grid.Row=\"2\" Grid.Column=\"1\" x:Name=\"\
  cFirstName\" HorizontalAlignment=\"Stretch\"\nTextWrapping=\"Wrap\" Text=\"\" VerticalAlignment=\"\
  Center\" FontSize=\"20\"/>\n\n<TextBox Grid.Row=\"3\" Grid.Column=\"1\" x:Name=\"\
  cLastName\" HorizontalAlignment=\"Stretch\"\nTextWrapping=\"Wrap\" Text=\"\" VerticalAlignment=\"\
  Center\" FontSize=\"20\"/>\n\n<ComboBox Grid.Row=\"1\" Grid.Column=\"1\" x:Name=\"\
  cTitle\" HorizontalAlignment=\"Stretch\"\nVerticalAlignment=\"Center\" FontSize=\"\
  20\">\n<ComboBoxItem Content=\"Mr\"/>\n<ComboBoxItem Content=\"Mrs\"/>\n<ComboBoxItem\
  \ Content=\"Ms\"/>\n<ComboBoxItem Content=\"Miss\"/>\n</ComboBox>\n```\n\n## 8.\
  \ 将 `customersTabularView Grid` 控件中用于地址和电话的 `TextBlock` 和 `TextBox` 控件复制到新的 `Grid`\
  \ 控件中，放在 `cTitle ComboBox` 控件之后。将 `TextBlock` 控件放在第 0 列的第 4 行和第 5 行，将 `TextBox`\
  \ 控件放在第 1 列的第 4 行和第 5 行。将 `email TextBox` 控件名称更改为 `cEmail`，将 `phone TextBox` 控件名称更改为\
  \ `cPhone`。删除 `cEmail` 和 `cPhone` 控件的 `Width` 属性，并将它们的 `HorizontalAlignment` 属性设置为\
  \ `Stretch`。\n\n点击此处查看代码图像\n\n```xml\n<ComboBox ...>\n...\n</ComboBox>\n\n<TextBlock\
  \ Grid.Row=\"4\" Grid.Column=\"0\" HorizontalAlignment=\"Center\" TextWrapping=\"\
  Wrap\"\nText=\"Email\" VerticalAlignment=\"Center\" FontSize=\"20\"/>\n\n<TextBox\
  \ Grid.Row=\"4\" Grid.Column=\"1\" x:Name=\"cEmail\" HorizontalAlignment=\"Stretch\"\
  \nTextWrapping=\"Wrap\" Text=\"\" VerticalAlignment=\"Center\" FontSize=\"20\"/>\n\
  \n<TextBlock Grid.Row=\"5\" Grid.Column=\"0\" HorizontalAlignment=\"Center\" TextWrapping=\"\
  Wrap\"\nText=\"Phone\" VerticalAlignment=\"Center\" FontSize=\"20\"/>\n\n<TextBox\
  \ Grid.Row=\"5\" Grid.Column=\"1\" x:Name=\"cPhone\" HorizontalAlignment=\"Stretch\"\
  \nTextWrapping=\"Wrap\" Text=\"\" VerticalAlignment=\"Center\" FontSize=\"20\"/>\n\
  ```\n\n设计视图窗口应该显示如下所示的列布局：\n\n![图像](img/Image00199.jpg)\n\n## 9. 返回 `customersTabularView\
  \ Grid` 控件的 XAML 标记，并将 `Visibility` 属性设置为 `Visible`。\n\n点击此处查看代码图像\n\n```xml\n<Grid\
  \ x:Name=\"customersTabularView\" Margin=\"10,20,10,20\" Visibility=\"Visible\"\
  \ >\n```\n\n## 10. 在 `customersColumnarView Grid` 控件的 XAML 标记中，将 `Visibility` 属性设置为\
  \ `Collapsed`。\n\n点击此处查看代码图像\n\n```xml\n<Grid x:Name=\"customersColumnarView\" Margin=\"\
  10,20,10,20\" Visibility=\"Collapsed\" >\n```\n\n设计视图窗口应该显示 Customers 表单的原始表格布局。这是应用程序将要使用的默认视图。\n\
  \n你现在已经定义了在窄视图下显示的布局。你可能担心，本质上你所做的只是复制了许多控件并以不同的方式排列它们。如果你运行表单并在视图之间切换，一个视图中的数据将如何传输到另一个视图呢？例如，如果你在应用程序全屏运行时输入了客户详细信息，然后切换到窄视图，新显示的控件将不包含你刚刚输入的相同数据。UWP\
  \ 通过使用 `data binding`（数据绑定）来解决这个问题。这种技术允许你将同一份数据关联到多个控件上，随着数据的更改，所有控件都会显示更新后的信息。你将在第\
  \ 26 章 中了解它是如何工作的。目前，你只需要考虑如何使用视觉状态管理器（Visual State Manager）在视图更改时切换布局。\n\n你可以使用触发器（triggers），当视图的某些方面（如高度或宽度）变化时提醒视觉状态管理器。\n\
  \n### 1. 使用视觉状态管理器\n\n在 `customersColumnarView Grid` 控件的 XAML 标记中，将 `Visibility`\
  \ 属性设置为 `Collapsed`。在闭合的 `Grid` 标签之后添加以下 `VisualStateManager`：\n\n点击此处查看代码图像\n\n\
  ```xml\n<VisualStateManager>\n<VisualStateGroups>\n<VisualState x:Name=\"TabularLayout\"\
  >\n</VisualState>\n</VisualStateGroups>\n</VisualStateManager>\n```\n\n你通过实现视觉状态来定义状态。\n\
  \n### 2. 添加视觉状态触发器\n\n在 `VisualStateGroups` 中，为视觉状态添加以下视觉状态触发器：\n\n点击此处查看代码图像\n\n\
  ```xml\n<VisualStateManager>\n<VisualStateGroups>\n<VisualState x:Name=\"TabularLayout\"\
  >\n<VisualState.Triggers>\n<AdaptiveTrigger MinWindowWidth=\"660\"/>\n</VisualState.Triggers>\n\
  </VisualState>\n</VisualStateGroups>\n</VisualStateManager>\n```\n\n当窗口宽度低于 660\
  \ 像素时，该触发器将触发。这是 Customers 表单上的控件开始折行并变得难以使用的宽度。\n\n### 3. 添加 Setter 元素\n\n在触发器定义之后，向\
  \ XAML 标记添加以下代码：\n\n点击此处查看代码图像\n\n```xml\n<VisualStateManager>\n<VisualStateGroups>\n\
  <VisualState x:Name=\"TabularLayout\">\n<VisualState.Triggers>\n<AdaptiveTrigger\
  \ MinWindowWidth=\"660\"/>\n</VisualState.Triggers>\n<VisualState.Setters>\n<Setter\
  \ Target=\"customersTabularView.Visibility\" Value=\"Visible\"/>\n<Setter Target=\"\
  customersColumnarView.Visibility\" Value=\"Collapsed\"/>\n</VisualState.Setters>\n\
  </VisualState>\n</VisualStateGroups>\n</VisualStateManager>\n```\n\n此代码指定了触发时发生的操作。在示例中，操作是通过使用\
  \ `Setter` 元素定义的。`Setter` 元素指定要设置的属性以及要设置的值。对于此视图，`Setter` 命令更改指定属性的值；`customersTabularView\
  \ Grid` 控件变为可见，`customersColumnarView Grid` 控件被折叠。\n\n### 4. 定义 ColumnarLayout 状态\n\
  \n在 `TabularLayout` 视觉状态定义之后，添加以下标记，它定义了窄视图等等的功能：\n\n点击此处查看代码图像\n\n```xml\n<VisualStateManager>\n\
  <VisualStateGroups>\n<VisualState x:Name=\"TabularLayout\">\n...\n</VisualState>\n\
  <VisualState x:Name=\"ColumnarLayout\">\n<VisualState.Triggers>\n<AdaptiveTrigger\
  \ MinWindowWidth=\"0\"/>\n</VisualState.Triggers>\n<VisualState.Setters>\n<Setter\
  \ Target=\"customersTabularView.Visibility\" Value=\"Collapsed\"/>\n<Setter Target=\"\
  customersColumnarView.Visibility\" Value=\"Visible\"/>\n</VisualState.Setters>\n\
  </VisualState>\n</VisualStateGroups>\n</VisualStateManager>\n```\n\n\n\n\n\n```xml\n\
  </VisualState.Setters>\n</VisualState>\n</VisualStateGroup>\n</VisualStateManager.VisualStateGroups>\n\
  ```\n\n当窗口宽度降至 660 像素时，将发生此转换。应用程序切换到 `ColumnarLayout`状态；`customersTabularView Grid`\
  \ 控件被折叠，而 `customersColumnarView Grid` 控件变为可见。\n\n**5.** 在调试菜单上，点击“开始调试”。\n\n应用程序启动并全屏显示客户表单。数据使用表格布局进行显示。\n\
  \n***\n\n![Image](img/Image00005.jpg) 备注\n\n如果您使用的显示器分辨率低于 1366 × 768，请按照前面的说明，在模拟器中启动运行应用程序。为模拟器配置\
  \ 1366 × 768 的分辨率。\n\n***\n\n**6.** 调整 Customer 应用程序窗口的大小，以在窄视图显示表单。当窗口宽度降至 660\
  \ 像素时，显示将切换到列布局。\n\n**7.** 调整 Customer 应用程序窗口的大小，使其大于 660 像素（或将其最大化为全屏）。\n\nCustomer\
  \ 表单将恢复为表格布局。\n\n**8.** 返回 Visual Studio 并停止调试。\n\n####为 UI 应用样式\n\n现在你已经解决了应用程序基本布局的机制，下一步是应用一些样式使\
  \ UI 看起来更具吸引力。UWP 应用程序中的控件具有多种属性，你可以利用这些属性来更改元素的字体、颜色、大小和其他属性等特征。你可以为每个控件单独设置这些属性，但如果你需要对多个控件应用相同的样式，这种方法可能会变得繁琐且重复。此外，最好的应用程序会在整个\
  \ UI 上应用一致的样式，如果你需要在添加或更改控件时反复设置相同的属性和值，将很难保持一致性。你重复执行相同的事情越多，至少出错一次的可能性就越大！\n\n\
  对于 UWP 应用程序，你可以定义可重用的样式。可以通过创建资源字典将它们实现为应用程序范围内的资源，这样应用程序中所有页的所有控件都可以可用。你也可以在该页面的\
  \ XAML 标记中定义仅适用于单个页面的本地资源。在以下练习中，你将为 Customers 应用程序定义一些简单的样式，并将这些样式应用于 Customers\
  \ 表单上的控件。\n\n#### 为 Customers 表单定义样式\n\n**1.** 在解决方案管理器中，右键点击 Customers 项目，指向“添加”，然后点击“新建项”。\n\
  \n**2.** 在“添加新项 – Customers”对话框中，点击“资源字典”。在“名称”框中，输入 `AppStyles.xaml`，然后点击“添加”。\n\
  \n`AppStyles.xaml` 文件出现在代码和文本编辑器窗口中。资源字典是一个包含应用程序可以使用的资源的 XAML 文件。`AppStyles.xaml`\
  \ 文件如下所示：\n\n点击此处查看代码图像\n\n```xml\n<ResourceDictionary\nxmlns=\"http://schemas.microsoft.com/winfx/2006/xaml/presentation\"\
  \nxmlns:x=\"http://schemas.microsoft.com/winfx/2006/xaml\"\nxmlns:local=\"using:Customers\"\
  >\n\n</ResourceDictionary>\n```\n\n`AppStyles.xaml` 文件是一个包含应用程序可以使用的资源的 XAML 文件。`AppStyles.xaml`\
  \ 文件如下所示：\n\n**3.** 在解决方案管理器中，右键点击 Customers 项目，指向“添加”，然后点击“新建项”。\n\n**4.** 右键点击\
  \ Images 文件夹，指向“添加”，并点击“现有项”。\n\n**5.** 在“添加新项 – Customers”对话框中，浏览到 `Images.jpg`\
  \ 并点击“添加”。\n\n**6.** 在显示 `AppStyles.xaml` 的代码编辑器窗口中，添加以下内容：\n\n```xml\n<ResourceDictionary\n\
  xmlns=\"http://schemas.microsoft.com/winfx/2006/xaml/presentation\"\nxmlns:x=\"\
  http://schemas.microsoft.com/winfx/2006/xaml\"\nxmlns:local=\"using:Customers\"\
  >\n\n<ImageBrush x:Key=\"WoodBrush\" Source=\"Images.jpg\"/>\n\n</ResourceDictionary>\n\
  ```\n\n`AppStyles.xaml` 文件包含应用程序可以使用的资源的 XAML 文件。`AppStyles.xaml` 文件如下所示：\n\n**7.**\
