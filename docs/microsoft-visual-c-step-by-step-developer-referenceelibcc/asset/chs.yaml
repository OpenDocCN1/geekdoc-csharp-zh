  \  dlg.ShowAsync();\n    }\n}\n}\n}\n```\n\n\n\n\n在接下来的练习中，你将修改 `Auditor` 和 `Shipper`\
  \ 类，以便它们在完成处理时抛出一个事件。应用程序将订阅每个组件的事件，并在事件发生时显示适当的消息。\n\n#### 向 `CheckoutController`\
