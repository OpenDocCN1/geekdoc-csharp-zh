  `GetCustomer` 方法从数据库中检索客户 1 的详细信息，并以 JSON 格式的对象返回，显示在浏览器中。数据看起来如下（`ModifiedDate`\
  \ 的值可能与此处所示不同）：\n\n点击此处查看代码图像\n\n```json\n{\"CustomerID\":1,\"Title\":\"Mr\",\"\
  FirstName\":\"Orlando\",\"LastName\":\"Gee\",\"EmailAddress\":\"orlando0@adventure-works.com\"\
  ,\"Phone\":\"245-555-0173\",\"rowguid\":\"3f5ae95e-b87d-4aed-95b4-c3797afcb74fModifiedDate\"\
  :\"2001-08-01T00:00:00\"}\n```\n\n### 9. 关闭网络浏览器并返回 Visual Studio。\n\n你现在可以将 Web\
  \ 服务部署到 Azure 而不是在本地运行。你可以通过 Visual Studio 2015 提供的发布向导在云端创建 Web 应用并上传 Web 服务。\n\
  \n#### 将 Web 服务部署到云端\n\n1. 在解决方案资源中，右键点击 `AdventureWorksService` 项目，点击“发布”。\n\n\
  发布向导启动。\n\n![Image](img/Image00234.jpg)\n\n2. 在选择发布目标下，点击 Azure Web Apps。\n\n3.\
  \ 在选择现有 Web 应用程序对话框中，选择你的 Azure 账户。如果出现添加账户选项而不是账户列表，请点击此选项，然后点击添加账户。在登录 Visual\
  \ Studio 对话框中，使用你的 Microsoft 账户登录。\n\n4. 在 Azure 上创建 Web 应用程序框中，为 Web 应用程序提供唯一的名称，并指定靠近你所在的区域。不要指定数据库服务器（你\
  \ Web 服务中的 Entity Framework 代码将处理数据库连接）。在应用程序服务计划框中，点击“新建应用程序服务计划”并命名。同样地，在资源组框中，点击“新建资源组”并命名。当你输入完所有数据后，点击“创建”。\n\
  \n![Image](img/Image00235.jpg)\n\n6. 在发布向导的连接页面上，接受默认值，点击“验证连接”以验证托管 Web 服务的 Web\
  \ 应用程序已成功创建，然后点击“下一步”。\n\n7. 在设置页面上，接受默认值，然后点击“下一步”。\n\n8. 在预览页面上，点击“发布”。\n\nWeb\
  \ 服务应该已经上传。浏览器应该打开并显示网站的主页，正如你之前在本地运行服务时看到的那样。\n\n\n\n\n\n这段旅程的下一阶段是从 Customers\
  \ UWP 应用连接到 Web 服务，然后使用该 Web 服务获取某些数据。.NET Framework 提供了 `HttpClient` 类，应用程序可以使用该类来构建并向\
  \ Web 服务发送 HTTP REST 请求，以及 `HttpResponseMessage` 类，应用程序可以使用该类来处理来自 Web 服务的响应结果。这些类将\
  \ HTTP 协议的实现细节从你的应用程序代码中抽象出来。这样一来，你就可以专注于显示和操作通过 Web 服务发布的对象的业务逻辑。你将在接下来的练习中使用这些类。你还将使用由\
  \ `Json.NET` 程序包实现的 JSON 解析器。你必须将此包添加到 Customers 项目中。\n\n![Image](img/Image00004.jpg)\
  \  重要性\n\n此练习检索了每个客户的数据。这作为一个原型，对于证明通过位于云端的 Web 服务检索数据的概念是很有用的，但在现实世界中，你应该更具选择性。如果数据库包含大量数据，这种方法在网络带宽和运行在用户设备上的应用程序的内存需求方面可能会非常浪费。更好的方法是使用分页功能，即分块获取客户数据（例如每次获取\
  \ 20 个客户）。Web 服务需要更新以支持这种方法，而 Customers 应用中的 `ViewModel` 则需要透明地管理客户块的获取。这留给读者作为练习\
  \ ![Image](img/Image00236.jpg)。\n\n## 从 AdventureWorks Web 服务获取数据\n\n1.  在解决方案管理器中，在\
  \ Customers 项目中，右键点击 `DataSource.cs` 文件，然后点击`删除`。在消息框中，点击`确定`以确认你要删除该文件。\n\n此文件包含\
  \ Customers 应用 使用的示例数据。你将修改 `ViewModel` 类以从 Web 服务获取这些数据，因此不再需要此文件。\n\n2.  右键点击\
  \ Customers 项目，然后点击`管理 NuGet 包`。\n\n![Image](img/Image00005.jpg)  注意\n\n如果提示你输入连接到\
  \ SQL Server 的密码，请关闭对话框。密码信息已由 Web 服务提供。\n\n3.  在 NuGet 包管理器：Customers 窗口中，确保筛选（Filter）下拉列表框设置为`全部`，然后在搜索框中输入\
  \ `Json.NET`。\n\n4.  在显示搜索结果的窗格中，选择 `Newtonsoft.Json` 包。在右侧窗格中，将操作（Action）设置为`安装`，然后点击`安装`。\n\
  \n5.  在预览窗口中，点击`确定`。\n\n6.  等待包安装完成，然后关闭 NuGet 包管理器：Customers 窗口。\n\n7.  在解决方案管理器中，双击\
  \ `ViewModel.cs` 以在代码和文本编辑器中显示该文件。\n\n8.  在文件顶部的列表中添加以下 `using` 指令：\n\n```\nusing\
  \ System.Net.Http;\nusing System.Net.Http.Headers;\nusing Newtonsoft.Json;\n```\n\
  \n9.  在 `ViewModel` 类中，在 `ViewModel` 构造函数之前添加以下加粗所示的变量。将 `<webappname>` 替换为在上一个练习中创建的托管\
  \ Web 服务的 Web 应用名称。\n\n```csharp\npublic class ViewModel : INotifyPropertyChanged\n\
  {\n    ...\n\n    private const string ServerUrl = \"http://<webappname>.azurewebsites.net/\"\
  ;\n\n    private HttpClient client = null;\n\n    public ViewModel()\n    {\n  \
  \      ...\n    }\n\n    ...\n}\n```\n\n`ServerUrl` 变量包含 Web 服务的基地址。你将使用 `client`\
  \ 变量连接到 Web 服务。\n\n10. 在 `ViewModel` 构造函数中，将 `customers` 列表初始化为 null，并添加以下加粗的语句来配置\
  \ `client` 变量：\n\n```csharp\npublic ViewModel()\n{\n    ...\n    this.customers\
  \ = null;\n    this.client = new HttpClient();\n    this.client.BaseAddress = new\
  \ Uri(ServerUrl);\n    this.client.DefaultHeaders.Accept.Add(new MediaTypeWithQualityValue(\"\
  application/json\"));\n}\n```\n\n`customers` 列表包含了 Web 服务显示的数据。你将使用 `client` 变量连接到\
  \ Web 服务。该 `client` 变量在之前的 `DataSource.cs` 文件中初始化。REST Web 服务可以接收各种格式的响应，但应用程序将使用\
  \ JSON。前面的代码配置了格式。\n\n11. 在解决方案管理器中，双击 Customers 项目根目录下的 `Customer.cs` 文件以在代码编辑器中显示它。\n\
  \n12. 在 `Phone` 属性之后，向 `Customer` 类中添加以下加粗所示的公共属性：\n\n```csharp\npublic class Customer\
  \ : INotifyPropertyChanged\n{\n    ...\n    public string Phone\n    {\n       \
  \ ...\n    }\n    public Guid rowguid { get; set; }\n    public DateTime ModifiedDate\
  \ { get; set; }\n    ...\n}\n```\n\nWeb 服务从数据库中检索这些字段，应用程序必须准备好处理它们；否则如果用户决定修改客户详情，这些将会丢失。（我们将在本章节之后添加此功能。）\n\
  \n13. 回到 `ViewModel` 类。在构造函数之后，在此处添加公共方法 `GetDataAsync`：\n\n```csharp\npublic async\
  \ Task GetDataAsync()\n{\n    try\n    {\n        var response = await this.client.GetAsync(\"\
  api/customers\");\n        if (response.IsSuccessStatusCode)\n        {\n      \
  \      var customerData = await response.Content.ReadAsStringAsync();\n        \
  \    this.customers = JsonConvert.DeserializeObject<List<Customer>>(customerData);\n\
  \            this.currentCustomer = 0;\n            OnPropertyChanged(nameof(CurrentCustomer));\n\
  \            this.IsAtStart = true;\n            this.IsAtEnd = (this.customers.Count\
  \ == 0);\n        }\n        else\n        {\n            // TODO: 处理 GET 失败\n \
  \       }\n    }\n    catch (Exception e)\n    {\n        // TODO: 处理异常\n    }\n\
  }\n```\n\n\n\n\n\n请注意，目前 `GetDataAsync` 方法没有处理任何异常或失败，只是静默地消耗了它们。你将在本章后续部分看到在 UWP\
  \ 应用中报告异常的技巧。\n\n***\n\n![Image](img/Image00005.jpg) 注意\n\n在生产应用中，你不应该不必要地通过网络获取数据。相反，你应该对检索的数据进行选择性获取。然而，在此应用程序中，AdventureWorks\
  \ 数据库仅包含几百名客户，因此它们都被检索并缓存到客户列表中。\n\n***\n\n### 14. 如下所示，修改 `Current` 属性的 `get` 访问器：\n\
  \n点击此处查看代码图像\n\n```csharp\npublic Customer Current\n{\n    get\n    {\n        if\
  \ (this.customers != null)\n        {\n            return this.customers[currentCustomer];\n\
  \        }\n        else\n        {\n            return null;\n        }\n    }\n\
  }\n```\n\n`GetDataAsync` 方法是异步的，因此当 MainPage 表单上的控件尝试绑定到客户时，`customers` 集合可能尚未填充。在这种情况下，此修改可以防止数据绑定在访问\
  \ `customers` 集合时产生 `null` 引用异常。\n\n### 15. 在 `ViewModel` 构造函数中，更新启用每个命令运行的条件，如下所示代码中的**粗体**所示：\n\
  \n点击此处查看代码图像\n\n```csharp\npublic ViewModel()\n{\n    ...\n    this.NextCustomer\
  \ = new Command(this.Next,\n    () => { return this.customers != null &&\n    this.customers.Count\
  \ > 1 && !this.IsAtEnd; });\n    this.PreviousCustomer = new Command(this.Previous,\n\
  \    () => { return this.customers != null &&\n    this.customers.Count > 0 && !this.IsAtStart;\
  \ });\n    this.FirstCustomer = new Command(this.First,\n    () => { return this.customers\
  \ != null &&\n    this.customers.Count > 0 && !this.IsAtStart; });\n    this.LastCustomer\
  \ = new Command(this.Last,\n    () => { return this.customers != null &&\n    this.customers.Count\
  \ > 1 && !this.IsAtEnd; });\n}\n```\n\n这些更改确保了在命令栏上的按钮在有数据可显示之前不会启用。\n\n### 16.\
