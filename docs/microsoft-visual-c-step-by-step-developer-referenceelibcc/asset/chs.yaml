  \ 程序的副本。它尚未使用任务功能。\n\n2. 在解决方案资源管理器（Solution Explorer）中，展开 `GraphDemo` 项目，展开 `MainPage.xaml`\
  \ 节点，然后双击 `MainPage.xaml.cs` 以在代码和文本编辑器中显示表单的代码。\n\n3. 在文件顶部的列表中添加以下 `using` 指令：\n\
  \n```csharp\nusing System.Threading.Tasks;\n```\n\n4. 找到 `generateGraphData` 方法。它看起来如下：\n\
  \n点击此处查看代码图像\n\n```csharp\nprivate void generateGraphData(byte[] data)\n{\n    int\
  \ a = pixelWidth / 2;\n    int b = a * a;\n    int c = pixelHeight / 2;\n    for\
  \ (int x = 0; x < a; x++)\n    {\n        int s = x * x;\n        double p = Math.Sqrt(b\
  \ - s);\n        for (double i = -p; i < p; i += 3)\n        {\n            double\
  \ r = Math.Sqrt(s + i * i) / a;\n            double q = (r - 1) * Math.Sin(24 *\
  \ r);\n            double y = i / 3 + (q * c);\n            plotXY(data, (int)(-x\
  \ + (pixelWidth / 2)), (int)(y + (pixelHeight / 2)));\n            plotXY(data,\
  \ (int)(x + (pixelWidth / 2)), (int)(y + (pixelHeight / 2)));\n        }\n    }\n\
  }\n```\n\n遍历整数变量 `x` 值的外层 `for` 循环是并行化的理想候选对象。你也可以考虑基于变量 `i` 的内部循环，但由于 `i` 的类型原因，并行化该循环需要花费更多精力（`Parallel`\
  \ 类中的方法期望控制变量为整数）。此外，如果你有像此代码那样的嵌套循环，良好的做法是先并行化外层循环，然后测试应用程序的性能是否足够。如果不够，则从外层到内层逐层处理并并行嵌套循环，并在修改每个循环后测试性能。你会发现，在许多情况下，并行化外层循环对性能的影响最大，而修改内部循环的效果变得微乎其微。\n\
  \n5. 剪切 `for` 循环体中的代码，并创建一个名为 `calculateData` 的新私有 `void` 方法并包含这些代码。`calculateData`\
