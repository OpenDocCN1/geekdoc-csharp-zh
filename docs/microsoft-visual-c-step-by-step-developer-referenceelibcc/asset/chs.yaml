  \n### 理解转换运算符\n\n有时，你可能需要将一种类型的表达式转换为另一种类型。例如，以下方法声明了一个单个 `double` 参数：\n\n点击此处查看代码图像\n\
  \n```csharp\nclass Example\n{\n  public static void MyDoubleMethod(double parameter)\n\
  \  {\n    ...\n  }\n}\n```\n\n你可能会合理地认为，当你的代码调用 `MyDoubleMethod` 时，只有 `double` 类型的值可以作为参数，但事实并非如此。C#\
  \ 编译器也允许使用其他类型的参数调用 `MyDoubleMethod`，但前提是该参数的值可以转换为 `double`。例如，如果你提供了一个 `int` 参数，编译器会在调用该方法时生成代码，将参数的值转换为\
  \ `double`。\n\n#### 提供内置转换\n\n内置类型具有一些内置转换。例如，如前所述，`int` 可以隐式地转换为 `double`。隐式转换不需要特殊的语法，并且永远不会抛出异常。\n\
  \n点击此处查看代码图像\n\n```csharp\nExample.MyDoubleMethod(42); // 隐式 int 到 double 的转换\n\
  ```\n\n隐式转换有时被称为*宽式转换*（widening conversion），因为结果比原始值*宽*（wider）——它包含的信息至少与原始值一样多，且没有任何丢失。在\
  \ `int` 和 `double` 的情况下，`double` 的范围大于 `int`，并且所有的 `int` 值都有等效的 `double` 值。然而，反则不然，`double`\
  \ 值无法隐式地转换为 `int`：\n\n点击此处查看代码图像\n\n```csharp\nclass Example\n{\n  public static\
  \ void MyIntMethod(int parameter)\n  {\n    ...\n  }\n}\n...\nExample.MyIntMethod(42.0);\
  \ // 编译时错误\n```\n\n当你将 `double` 转换为 `int` 时，你面临丢失信息的风险，因此转换不会自动执行。（考虑一下如果 `MyIntMethod`\
  \ 的参数是 42.5 会发生什么。它应该如何转换？）`double` 可以转换为 `int`，但这种转换需要显式的表示（强制类型转换）：\n\n点击此处查看代码图像\n\
  \n```csharp\nExample.MyIntMethod((int)42.5);\n```\n\n显式转换有时被称为*窄式转换*（narrowing conversion），因为结果比原始值*窄*（narrower）——它可以包含更少的信息，如果值超出范围，可能会抛出\
  \ `OverflowException` 异常。在 C# 中，你可以为自己的类型创建转换运算符，以控制转换为其他类型是否合理，你还可以指定这些转换是隐式的还是显式的。\n\
  \n#### 实现用户定义转换\n\n声明自定义转换运算符的语法与声明重载运算符的语法有一些相似之处，但它也有一些重要的区别。这是一个允许将 `Hour` 对象隐式转换为\
  \ `int` 的转换运算符：\n\n点击此处查看代码图像\n\n```csharp\nstruct Hour\n{\n  ...\n  public static\
  \ implicit int (Hour from)\n  {\n    return from.value;\n  }\n  private int value;\n\
  }\n```\n\n转换运算符必须是 `public` 的，并且必须是 `static` 的。从中转换的类型被声明为参数（在本例中为 `Hour`），转换的目标类型被声明为\
  \ `operator` 关键字后的类型（在本例中为 `int`）。在 `operator` 关键字之前没有指定返回类型。\n\n在声明转换运算符时，必须指定它们是隐式转换运算符还是显式转换运算符。你通过使用\
  \ `implicit` 和 `explicit` 关键字来实现。上例所示的 `Hour` 到 `int` 的转换运算符是隐式的，这意味着 C# 编译器可以在不需要强制转换的情况下使用它。\n\
  \n点击此处查看代码图像\n\n```csharp\nclass Example\n{\n  public static void MyOtherMethod(int\
  \ parameter) { ... }\n  public static void Main()\n  {\n    Hour lunch = new Hour(12);\n\
  \    Example.MyOtherMethod(lunch); // 隐式 Hour 到 int 的转换\n  }\n}\n```\n\n如果转换运算符被声明为\
  \ `explicit`，上面的示例将无法编译，因为显式转换运算符需要强制转换。\n\n点击此处查看代码图像\n\n```csharp\nExample.MyOtherMethod((int)lunch);\
  \ // 显式 Hour 到 int 的转换\n```\n\n何时应该将转换运算符声明为显式或隐式？如果一个转换总是安全的、没有丢失信息的风险且不会抛出异常，则可以定义为`implicit`转换。否则，它应该声明为`explicit`转换。从\
  \ `Hour` 转换为 `int` 总是安全的——每个 `Hour` 都有一个对应的 `int` 值——因此将其设为隐式是合理的。将 `string` 转换为\
  \ `Hour` 的运算符应该是显式的，因为并不是所有字符串代表有效的 `Hour`。\n\n#### 创建对称运算符（重申）\n\n\n\n\n转换运算符为你提供了一种解决提供对称运算符问题的替代方法。例如，如前文所示，你不需要为\
  \ `Hour` 结构体提供三个版本的 `operator+`（`Hour + Hour`、`Hour + int` 和 `int + Hour`），而是可以提供一个单一版本的\
  \ `operator+`（接受两个 `Hour` 参数）以及一个从 `int` 到 `Hour` 的隐式转换，如下所示：\n\n点击此处查看代码图片\n\n\
  ```csharp\nstruct Hour\n{\n    public Hour(int initialValue)\n    {\n        this.value\
  \ = initialValue;\n    }\n\n    public static Hour operator +(Hour lhs, Hour rhs)\n\
  \    {\n        return new Hour(lhs.value + rhs.value);\n    }\n\n    public static\
  \ implicit operator Hour (int from)\n    {\n        return new Hour (from);\n  \
  \  }\n    ...\n\n    private int value;\n}\n```\n\n如果你向 `int` 中添加一个 `Hour`（无论何种顺序），C#\
  \ 编译器会自动将 `int` 转换为 `Hour`，然后调用带有两个 `Hour` 参数的 `operator+`，此处所示：\n\n点击此处查看代码图片\n\
  \n```csharp\nvoid Example(Hour a, int b)\n{\n    Hour eg1 = a + b; // b 转换为 Hour\n\
  \    Hour eg2 = b + a; // b 转换为 Hour\n}\n```\n\n### 编写转换运算符\n\n在本章的最后一个练习中，你将为 `Complex`\
  \ 类添加转换运算符。你将从编写一对转换运算符开始，它们用于在 `int` 类型和 `Complex` 类型之间进行转换。将 `int` 转换为 `Complex`\
  \ 对象始终是一个安全的过程，永远不会丢失信息（因为 `int` 实际上只是不带虚部的复数）。你将将其实现为隐式转换运算符。然而，反过来并不如此——要将 `Complex`\
  \ 对象转换为 `int`，你必须丢弃虚部。因此，你将把此转换运算符实现为显式。\n\n### 实现转换运算符\n\n**1.** 返回 Visual Studio\
  \ 2015 并在代码和文本编辑器窗口中显示 `Complex.cs` 文件。将后续代码中**加粗显示**的构造函数添加到 `Complex` 类中，紧接在现有构造函数之后且\
  \ `ToString` 方法之前。这个新构造函数接受单个 `int` 参数，并用它初始化 `Real` 属性。`Imaginary` 属性被设置为 `0`。\n\
  \n点击此处查看代码图片\n\n```csharp\nclass Complex\n{\n    ...\n\n    public Complex(int real)\n\
  \    {\n        this.Real = real;\n        this.Imaginary = 0;\n    }\n    ...\n\
  }\n```\n\n**2.** 向 `Complex` 类中添加以下隐式转换运算符。\n\n点击此处查看代码图片\n\n```csharp\nclass Complex\n\
  {\n    ...\n    public static implicit operator Complex(int from)\n    {\n     \
  \   return new Complex(from);\n    }\n    ...\n}\n```\n\n该运算符通过返回使用你在上一步中创建的构造函数构建的\
  \ `Complex` 类新实例，来实现从 `int` 到 `Complex` 对象的转换。\n\n**3.** 向 `Complex` 类添加以下**加粗显示**的显式转换运算符。\n\
  \n点击此处查看代码图片\n\n```csharp\nclass Complex\n{\n    ...\n    public static explicit\
  \ operator int(Complex from)\n    {\n        return from.Real;\n    }\n    ...\n\
  }\n```\n\n该运算符接收一个 `Complex` 对象并返回 `Real` 属性的值。此转换丢弃了复数的虚部。\n\n**4.** 在代码和文本编辑器窗口中显示\
  \ `Program.cs` 文件。将以下**加粗显示**的代码添加到 `doWork` 方法的末尾：\n\n点击此处查看代码图片\n\n```csharp\n\
  static void doWork()\n{\n    ...\n    Console.WriteLine($\"Current value of temp\
  \ is {temp}\");\n    if (temp == 2)\n    {\n        Console.WriteLine(\"Comparison\
  \ after conversion: temp == 2\");\n    }\n    else\n    {\n        Console.WriteLine(\"\
  Comparison after conversion: temp != 2\");\n    }\n    temp += 2;\n    Console.WriteLine($\"\
  Value after adding 2: temp = {temp}\");\n}\n```\n\n这些语句测试了将 `int` 转换为 `Complex`\
  \ 对象的隐式运算符。`if` 语句将 `Complex` 对象与 `int` 进行比较。编译器生成的代码首先将 `int` 转换为 `Complex` 对象，然后调用\
  \ `Complex` 类的 `==` 运算符。为 `temp` 变量加 2 的语句将 `int` 值 2 转换为 `Complex` 对象，然后使用 `Complex`\
  \ 类的 `+` 运算符。\n\n**5.** 将以下语句添加到 `doWork` 方法的尾：\n\n点击此处查看代码图片\n\n```csharp\nstatic\
  \ void doWork()\n{\n    ...\n    int tempInt = temp;\n    Console.WriteLine($\"\
  Int value after conversion: tempInt == {tempInt}\");\n}\n```\n\n第一条语句尝试将 `Complex`\
  \ 对象赋值给 `int` 变量。\n\n**6.** 在生成菜单中，点击重新生成解决方案。\n\n生成失败，编译器在错误列表中报告以下错误。\n\n**7.**\
  \ 在生成菜单中，点击重新生成解决方案。\n\n生成失败，编译器在错误列表中报告以下错误。\n\n**8.** 在生成菜单中，点击重新生成解决方案。\n\n生成失败，编译器在错误列表中报告以下错误。\n\
  \n**9.** 在生成菜单中，点击重新生成解决方案。\n\n生成失败，编译器在错误列表中报告以下错误。\n\n\n\n完成本章后，你将能够：\n\n- 描述在应用程序中实现并行操作的好处。\n\
  - 使用 `Task` 类在应用程序中创建并运行并行操作。\n- 使用 `Parallel` 类对某些常见的编程结构进行并行化处理。\n- 取消耗时任务并处理由并行操作抛出的异常。\n\
  \n在本书的大部分章节中，你已经学习了如何使用 C# 编写以单线程方式运行的程序。我所说的`single-threaded`（单线程）是指在任何一个时刻，程序只执行单条指令。这并不总是应用程序采取最高效的方法。如果你有适当的可用资源，通过将应用程序划分为可以并发运行的并行执行路径，某些可能会运行得更快。本章关注如何通过最大化对可用处理能力的使用来提高应用程序的吞吐量。具体而言，在本章中，你将学习如何使用\
  \ `Task` 对象为计算密集型应用程序应用有效的多任务处理。\n\n## 为什么要通过并行处理来执行多任务？\n\n你可能想在应用程序中执行多任务的主要原因有二：\n\
  \n- **为了提高响应性** 耗时操作可能涉及不需要处理器时间的任务。常见示例包括 I/O 密集型操作，例如从本地磁盘读取或写入数据，或跨网络发送和接收数据。在这两种情况下，如果程序可以做更有用的事情（例如响应用户输入），让程序空耗\
  \ CPU 周期来等待操作完成是没有意义的。大多数移动设备用户认为这种响应性是理所当然的，他们不期望平板电脑在发送和接收电子邮件时直接停滞，例如。第 24 章，“通过执行异步操作提高响应时间](#text00032.html_ch24)”更详细地讨论了这些特性。\n\
  \n- **为了提高可扩展性** 如果某个操作是 CPU 密集型的，你可以通过有效利用可用处理资源并使用这些资源来缩短执行操作所需的时间，从而提高可扩展性。开发者可以确定哪些操作包含可以并行的任务，并安排这些元素并发运行。随着更多计算资源的增加，可以并行运行更多实例的这些任务。直到不久，这种模型仅适用于具有多个\
  \ CPU 或能够将处理分散到不同网络连接计算机上的科学和工程系统。然而，大多数现代计算设备现在都包含能够支持真多任务处理的强大 CPU，且许多操作系统提供了可以让你轻松实现任务并行化的原语操作。\n\
  \n### 多核处理器的兴起\n\n在世纪之交，一台良好的个人电脑的价格在 800 美元到 1500 美元之间。今天，在经历了 15 年的通货膨胀后，一台良好的个人电脑价格仍然相似。今天典型电脑的配置可能包括运行速度在\
  \ 2 GHz 到 3 GHz 之间的处理器、超过 1000 GB 的硬盘存储、4–8 GB 的内存、高速高分辨率显示图形、快速网络接口以及可重写 DVD 光驱器。十五年前，典型机器的处理器速度在\
  \ 500 MHz 到 1 GHz 之间，80 GB 是一个大硬盘，Windows 在 256 MB 或更少的内存下运行良好良好，而可重写 CD 光驱的价格远高于\
  \ 100 美元。（可重写 DVD 光驱器很少见且极其昂贵。）这就是进步的乐趣：越来越快、越来越强大的硬件，价格越来越廉。\n\n这并不是一个新趋势。1965\
  \ 年，英特尔联合创始人戈登·摩尔（Gordon E. Moore）写了一篇题为《在集成电路上挤入更多组件》的文章，讨论了组件的日益微型化如何使更多晶体管能够嵌入硅片中，以及随着技术的普及，生产成本的下降如何导致经济学决定在\
  \ 1975 年之前向单个芯片上挤入多达 65,000 个组件。摩尔的观察导致了经常被称为摩尔定律的格言，该定律基本上指出，廉价放置在集成电路上的晶体管数量将呈指数增长，大约每两年翻一倍。（实际上，戈登·摩尔最初比这更乐观，假设晶体管数量可能每年翻一倍，但他后来修改了自己的计算。）晶体管封装在一起的能力导致了它们之间更快数据传输的能力。这意味着我们可以预计芯片制造商将以几乎不懈的速度生产出更快、更强大的微处理器，使软件开发者能够编写越来越复杂的软件，且运行速度越来越快。\n\
  \n关于电子组件微型化的摩尔定律在半个世纪后仍然成立。然而，物理学已开始干预。当单个芯片上的晶体管无论多小或多密，都无法更快地之间传输信号时，限制就出现了。对于软件开发者来说，这种限制最明显的结果是处理器已经停止变快。十年前，快速处理器的运行频率为\
  \ 3 GHz。今天，快速处理器仍然运行在 3 GHz。\n\n处理器在组件之间传输数据的速度限制促使芯片公司寻找替代机制来增加处理器可以执行的工作量。结果是，大多数现代处理器现在都有两个或多个\
  \ `processor cores`（处理器内核）。实际上，芯片制造商在同一芯片上放置了多个处理器，并添加了必要的逻辑使它们能够通信和协调。四核（四个核心）和八核处理器现在已很常见。16\
  \ 核、32 核和 64 核芯片已上市，双核和四核处理器的价格现在低到足以使其成为笔记本电脑、平板电脑和智能手机的预期配置。因此，虽然处理器已停止加速，但你现在可以预计在单个芯片上获得更多的内核。\n\
  \n### 对于编写 C# 应用程序的开发者意味着什么？\n\n在多核处理器出现之前，你只需要通过在更快的处理器上运行来加速单线程应用程序。有了多核处理器后，情况就不如此了。单线程应用程序在时钟频率相同的单核、双核或四核处理器上的运行速度相同。区别在于，在双核处理器上，就你的应用程序而言，其中一个处理器内核将处于闲置状态，而在四核处理器上，三个内核将仅仅在滴答作响等待工作。为了充分利用多核处理器，你需要编写应用程序以利用多任务处理的优势。\n\
  \n## 使用 Microsoft .NET Framework 实现多任务\n\n多任务处理是同时做多一件事的能力。它是那些容易描述但直到最近一直难以实现的概念之一。\n\
  \n在理想情况下，运行在多核处理器上的应用程序所执行的并发任务数量与可用处理器内核数量相同，使每个内核都忙碌。然而，要实现并发，你需要考虑许多问题，包括以下内容：\n\
  \n\n\n\n\n![Image](img/Image00001.jpg) 如何将应用程序划分为一组并发操作？\n\n![Image](img/Image00001.jpg)\
  \ 如何安排一组操作在多个处理器上并发执行？\n\n![Image](img/Image00001.jpg) 如何确保你尝试执行的并发操作数量恰好与可用处理器的数量一样多？\n\
  \n![Image](img/Image00001.jpg) 如果某个操作被阻塞（例如在等待 I/O 完成时），你如何检测到这一点，并安排处理器运行另一个操作而不是处于空闲？\n\
  \n![Image](img/Image00001.jpg) 你如何确定一个或多个并发操作何时已完成？\n\n对于应用程序开发者来说，第一个问题属于应用程序设计范围。其余问题取决于编程体系结构。微软在\
  \ `System.Threading.Tasks` 命名空间中提供了 `Task` 类和一组关联类型来帮助解决这些问题。\n\n***\n\n![Image](img/Image00004.jpg)\
  \ # 重要性\n\n关于应用程序设计的这一点是基础性的。如果一个应用程序在实现时没有考虑多任务处理，那么无论你为它投入多少个处理器核心，它的运行速度都不会比在单核机器上更快。\n\
  \n***\n\n## Task、线程与线程池 (ThreadPool)\n\n`Task` 类是并发操作的抽象。你通过创建一个 `Task` 对象来运行代码块。如果有足够的处理器或处理器核心，你可以实例化多个\
  \ `Task` 对象并启动它们并行运行。\n\n***\n\n![Image](img/Image00005.jpg) # 注意\n\n从现在起，我将使用 `processor`（处理器）一词指代单核处理器或多核处理器上的单个处理器核心。\n\
  \n***\n\n在内部，Windows Runtime (WinRT) 使用 `Thread` 对象和 `ThreadPool` 类来实现任务并调度它们执行。多线程和线程池从\
  \ .NET Framework 1.0 版本开始就已经是可用的了，如果你正在构建传统的桌面应用程序，可以直接在代码中使用位于 `System.Threading`\
  \ 命名空间中的 `Thread` 类。然而，`Thread` 类不再适用于通用 Windows 平台 (UWP) 应用；相反，你应该使用 `Task` 类。\n\
  \n`Task` 类为线程提供了一个强大的抽象，你可以通过它轻松区分应用程序中的并行程度（任务）和并行单元（线程）。在单处理器计算机上，这些项通常是相同的。但在具有多个处理器或多核处理器的计算机上，它们是不同的。如果你直接基于线程设计程序，你会发现你的应用程序扩展性可能并不良好；程序将使用你显式创建的线程数量，操作系统只会调度该数量的线程。如果线程数量远大于可用处理器的数量，可能会导致过载和响应时间差；如果线程数量少于处理器数量，则会导致效率低下和吞吐量低。\n\
  \nWinRT 优化了实现一组并发任务所需的线程数量，并根据可用处理器的数量高效地调度它们。它实现了一种队列机制，将工作负载分配到分配线程池的线程集合（通过使用\
  \ `ThreadPool` 对象实现）。当程序创建一个 `Task` 对象时，该任务会被添加到全局队列。当某个线程变为可用时，任务从全局队列中移除并由该线程执行。`ThreadPool`\
  \ 类实现了许多优化，并使用工作窃算法（work-stealing algorithm）确保线程得到高效调度。\n\n***\n\n![Image](img/Image00005.jpg)\
  \ # 注意\n\n`ThreadPool` 类在之前的 .NET Framework 版本中已经可用，但在 .NET Framework 4.0 中经过了显著增强以支持\
  \ `Task`。\n\n***\n\n你应当注意，为处理你的任务而创建的线程数量并不一定与处理器数量相同。取决于具体情况，处理任务创建的线程数可能与处理器数量不一致。\n\
  \n\n\n\n当任务运行的方法完成后，该任务即结束，用于运行任务的线程可以被回收以执行另一个任务。\n\n当一个任务完成时，你可以通过创建一个 `continuation`（延续）来安排调度另一个任务。要执行此操作，请调用\
  \ `Task` 对象的 `ContinueWith` 方法。当 `Task` 对象执行的动作完成时，调度器会自动创建一个新的 `Task` 对象来运行由 `ContinueWith`\
  \ 方法指定的动作。延续所指定的方法期望接收一个 `Task` 参数，调度器会将已完成任务的引用传递给该方法。`ContinueWith` 返回的值是新 `Task`\
  \ 对象的引用。下面的代码示例创建了一个 `Task` 对象，该对象运行 `doWork` 方法，并指定了一个延续，该延续会在第一个任务完成后在一个新任务中运行\
  \ `doMoreWork` 方法：\n\n点击此处查看代码图像\n\n```cs\nTask task = new Task(doWork);\n\ntask.Start();\n\
  \nTask newTask = task.ContinueWith(doMoreWork);\n\n...\n\nprivate void doWork()\n\
  {\n\n// 任务启动时运行此代码\n\n...\n}\n\n...\n\nprivate void doMoreWork(Task task)\n{\n\n\
  // 当 doWork 完成时，延续运行此代码\n\n...\n}\n```\n\n`ContinueWith` 方法高度重载，你可以提供多个参数来指定额外项目，包括一个\
  \ `TaskContinuationOptions` 值。`TaskContinuationOptions` 类型是一个枚举，它包含了 `TaskCreationOptions`\
  \ 枚举中所有值的超集。可用的额外值包括以下：\n\n![Image](img/Image00001.jpg) `NotOnCanceled` 和 `OnlyOnCanceled`\
  \ `NotOnCanceled` 选项指定只有在之前的操作完成且未被取消时，延续才会运行；而 `OnlyOnCanceled` 选项指定只有在之前的操作被取消时延续才会运行。本章后续的“[取消任务和处理异常`”节描述了如何取消任务。\n\
  \n![Image](img/Image00001.jpg) `NotOnFaulted` 和 `OnlyOnFaulted` `NotOnFaulted` 选项表示只有在之前的操作完成且没有抛出未处理的异常时，延续才会运行。`OnlyOnFaulted`\
  \ 选项导致延续仅在之前的操作抛出未处理的异常时才运行。“[取消任务和处理异常`”节提供了关于如何在任务中管理异常的更多信息。\n\n![Image](img/Image00001.jpg)\
  \ `NotOnRanToCompletion` 和 `OnlyOnRanToCompletion` `NotOnRanToCompletion` 选项指定只有在之前的操作没有成功完成时，延续才会运行；它必须是被取消或抛出异常。`OnlyOnRanToCompletion`\
  \ 导致延续仅在之前的操作成功完成后才运行。\n\n下面的代码示例显示了如何向任务添加一个延续，该延续仅在初始操作没有抛出未处理的异常时才运行：\n\n点击此处查看代码图像\n\
  \n```cs\nTask task = new Task(doWork);\n\ntask.ContinueWith(doMoreWork, TaskContinuationOptions.NotOnFaulted);\n\
  \ntask.Start();\n```\n\n调用并行操作的应用程序常见需求是同步任务。`Task` 类提供了 `Wait` 方法，它实现了一种简单的任务协调机制。使用此方法，你可以挂起当前线程的执行直到指定的任务完成，如下：\n\
  \n点击此处查看代码图像\n\n```cs\nTask task2 = ...\n\ntask2.Start();\n\n...\n\ntask2.Wait();\
  \ // 在此处等待直到 task2 完成\n```\n\n你可以通过使用 `Task` 类的静态方法 `WaitAll` 和 `WaitAny` 来等待一组任务。这两个方法都接受一个包含一组\
  \ `Task` 对象的 `params` 数组。`WaitAll` 方法等待直到所有指定的任务都完成，而 `WaitAny` 则停止直到至少有一个指定的任务已完成。你可以这样使用它们：\n\
  \n点击此处查看代码图像\n\n```cs\nTask.WaitAll(task, task2); // 等待 task 和 task2 完成\n\nTask.WaitAny(task,\
  \ task2); // 等待 task 或 task2 任一完成\n```\n\n### 使用 Task 类实现并行\n\n在下一个练习中，你将使用 `Task`\
  \ 类使应用程序中的计算密集型代码并行化，并将看到这种并行化如何通过将计算分布在多个处理器核心上缩短应用程序运行的时间。\n\n该应用程序名为 `GraphDemo`，包含一个使用\
  \ `Image` 控件显示图表的页面。应用程序通过执行复杂的计算来绘制图表的数据点。\n\n***\n\n![Image](img/Image00005.jpg)\
  \ 注意\n\n本章的练习旨在在具有多核处理器的计算机上运行。如果你只有一个单核 CPU，你将观察到相同的效果。此外，你不应该在练习之间启动任何额外的程序或服务，因为这些程序可能会影响你看到的结果。\n\
  \n***\n\n### 检查并运行 GraphDemo 单线程应用程序\n\n**1.** 如果 Microsoft Visual Studio 没有运行，请启动它。\n\
  \n**2.** 打开 `GraphDemo` 解决方案，它位于 `Microsoft Press\\VCS\\Chapter 23\\GraphDemo` 文件夹中。\n\
