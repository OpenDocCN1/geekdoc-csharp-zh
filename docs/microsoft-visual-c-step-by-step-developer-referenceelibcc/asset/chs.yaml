  \ 9. 确认控制台输出了 1568.454726，然后按回车。\n\n### 理解静态方法和数据\n\n在前面的练习中，你使用了 `Math` 类的 `Sqrt`\
  \ 方法。同样，在查看 `Circle` 类时，你读取了 `PI` 字段。回想，你调用 `Sqrt` 方法或读取 `PI` 字段的方式是在类本身，而不是对象。\n\
  \n书中广泛使用的 `Console.WriteLine` 方法是一个常见的例子。`Sqrt` 方法是另一个例子。如果 `Sqrt` 是一个实例方法，你将不得不创建一个\
  \ `Math` 对象以便调用它：\n\n```csharp\nMath m = new Math();\ndouble d = m.Sqrt(42.24);\n\
  ```\n\n这样做将非常繁琐。`Math` 对象在平方根的计算中没有任何作用。`Sqrt` 需要的所有输入数据通过参数列表提供，而结果通过方法的返回值传递给调用者。\n\
  \n![Image](img/Image00005.jpg) 注意\n\n除了 `Sqrt` 方法和 `PI` 字段外，`Math` 类还包含许多数学工具方法，如\
  \ `Sin, Cos, Tan` 和 `Log`。\n\n在 C# 中，所有方法都必须声明在类内部。然而，如果你将方法或字段声明为 `static`，你就可以使用类名来调用方法或访问字段。不需要实例。这就是\
  \ `Math` 类 `Sqrt` 方法的声明方式：\n\n```csharp\nclass Math\n{\n    public static double\
  \ Sqrt(double d)\n    {\n        ...\n    }\n    ...\n}\n```\n\n你可以这样调用 `Sqrt` 方法：\n\
  \n```csharp\ndouble d = Math.Sqrt(42.24);\n```\n\n### 创建共享字段\n\n\n\n\n将字段定义为 `static`（静态）可以让你创建一个单一字段实例，该实例由从同一个类创建的所有对象共享。（非静态字段是每个对象实例所私有的。）在下面的示例中，每当创建一个新的\
  \ `Circle` 对象时，`Circle` 类中的静态字段 `NumCircles` 就会递加 1：\n\n点击此处查看代码图像\n\n```cs\nclass\
  \ Circle\n{\n    private int radius;\n    public static int NumCircles = 0;\n\n\
  \    public Circle() // 默认构造函数\n    {\n        radius = 0;\n        NumCircles++;\n\
  \    }\n\n    public Circle(int initialRadius) // 载载构造函数\n    {\n        radius\
  \ = initialRadius;\n        NumCircles++;\n    }\n}\n```\n\n所有的 `Circle` 对象都共享 `NumCircles`\
  \ 字段的同一个实例，因此 `NumCircles++;` 语句在每次创建新实例时都会增加相同的数据。注意，你不能用 `this` 关键字前缀 `NumCircles`，因为\
  \ `NumCircles` 不属于某个特定的对象。\n\n你可以通过指定 `Circle` 类而不是 `Circle` 对象从类外部访问 `NumCircles`\
  \ 字段，如下例所示：\n\n点击此处查看代码图像\n\n```cs\nConsole.WriteLine($\"Number of Circle objects:\
  \ {Circle.NumCircles}\");\n```\n\n* * *\n\n![Image](img/Image00005.jpg) 注意\n\n请记住，静态方法也被称为*类方法*（class\
  \ methods）。然而，静态字段通常被称为*类字段*（class fields）；它们只被称为*静态字段*（static fields）（或有时被称为*静态变量*）。\n\
  \n* * *\n\n### 使用 const 关键字创建静态字段\n\n通过在字段前加上 `const` 关键字，你可以声明一个字段是静态的，但它的值永远无法改变。`const`\
  \ 关键字是 *constant*（常量）的缩写。`const` 字段在声明时不使用 `static` 关键字，但它仍然是静态的。然而，由于超出本书范围的原因，只有当字段为数值类型（如\
  \ `int` 或 `double`）、字符串或枚举时，你才能将字段声明为 `const`。（你将在第 9 章，“使用枚举和结构体创建值类型””中学习枚举。）例如，这里是\
  \ `Math` 类如何将 `PI` 声明为 `const` 字段：\n\n点击此处查看代码图像\n\n```cs\nclass Math\n{\n    ...\n\
  \    public const double PI = 3.14159265358979;\n}\n```\n\n### 理解静态类\n\nC# 语言的另一个特性是能够将类声明为\
  \ `static`（静态）。静态类只能包含静态成员。（你通过使用该类创建的所有对象都共享这些成员的单一副本。）静态类的目的纯粹是作为工具方法和字段的载体。静态类不能包含任何实例数据或方法，而且尝试使用\
  \ `new` 运算符从静态类创建对象是毫无意义的。事实上，即使你想这样做，实际上也无法使用 `new` 使用静态类来创建对象的实例。（如果你尝试这样做，编译器将报告错误。）如果你需要执行任何初始化，静态类可以有一个默认构造函数，只要它也被声明为\
  \ `static`。任何其他类型的构造函数都是非法的，并将会被编译器报告为非法。\n\n如果你正在定义你自己的版本的 `Math` 类（一个只包含静态成员的类），它可能像这样：\n\
  \n点击此处查看代码图像\n\n```cs\npublic static class Math\n{\n    public static double Sin(double\
  \ x) {...}\n    public static double Cos(double x) {...}\n    public static double\
  \ Sqrt(double x) {...}\n    ...\n}\n```\n\n* * *\n\n![Image](img/Image00005.jpg)\
  \ 注意\n\n真正的 `Math` 类并不是这样定义的，因为它实际上确实包含一些实例方法。\n\n* * *\n\n### 静态 using 语句\n\n每当你调用静态方法或引用静态字段时，都必须指定该方法或字段所属的类，例如\
  \ `Math.Sqrt` 或 `Console.WriteLine`。静态 `using` 语句允许你将一个类引入作用域，并在访问静态成员时省略类名。它们的工作方式与将命名空间引入作用域的普通\
  \ `using` 语句非常相似。下面的示例说明了如何使用它们：\n\n点击此处查看代码图像\n\n```cs\nusing static System.Math;\n\
  using static System.Console;\n...\n\nvar root = Sqrt(99.9);\nWriteLine($\"The square\
  \ root of 99.9 is {root}\");\n```\n\n注意在 `using` 语句中使用 `static` 关键字。示例将 `System.Math`\
  \ 和 `System.Console` 类的静态方法引入作用域（你必须使用命名空间对类进行完全限定）。你可以简单地调用 `Sqrt` 和 `WriteLine`\
  \ 方法。编译器会确定每个方法属于哪个类。然而，这里存在一个潜在的维护问题。虽然你减少了代码量，但你必须平衡这种额外的工作。\n\n编写静态成员并调用静态方法\n\
  \n**1.** 在 Visual Studio 中显示 `Point` 类。\n\n**2.** 在构造函数之前添加一个 `int` 类型的私有静态字段 `objectCount`。在声明时将其初始化为\
  \ 0，如下所示：\n\n```cs\nclass Point\n{\n    ...\n    private static int objectCount\
  \ = 0;\n    ...\n}\n```\n\n* * *\n\n注意：在声明 `objectCount` 等字段时，你可以任意编写 `private`\
  \ 和 `static` 关键字的顺序。然而，推荐的顺序是 `private` 在前，`static` 在后。\n\n* * *\n\n**3.** 在两个 *Point*\
  \ 构造函数中添加语句来增加 `objectCount` 字段，如下代码示例粗体所示。\n\n现在 `Point` 类应该像这样：\n\n```cs\nclass\
  \ Point\n{\n    private int x, y;\n    private static int objectCount = 0;\n\n \
  \   public Point()\n    {\n        this.x = -1;\n        this.y = -1;\n        objectCount++;\n\
  \    }\n\n    public Point(int x, int y)\n    {\n        this.x = x;\n        this.y\
  \ = y;\n        objectCount++;\n    }\n\n    public double DistanceTo(Point other)\n\
  \    {\n        int xDiff = this.x - other.x;\n        int yDiff = this.y - other.y;\n\
  \        double distance = Math.Sqrt((xDiff * xDiff) + (yDiff * yDiff));\n     \
  \   return distance;\n    }\n}\n```\n\n每当创建一个对象时，其构造函数就会被调用。只要你在每个构造函数中增加 `objectCount`（包括默认构造函数），`objectCount`\
  \ 就会保存到目前为止创建的对象数量。这种策略之所以有效是因为 `objectCount` 是一个共享的静态字段。\n\n\n\n\n现在的问题是：`Point`\
  \ 类的用户如何知道创建了多少个 `Point` 对象？目前，`objectCount` 字段是私有的，在类外部不可用。一个糟糕的解决方案是让 `objectCount`\
  \ 字段设为公开访问。这种策略会破坏类的封装性，此时你无法保证 `objectCount` 字段的值是正确的，因为任何人都可以更改该字段的值。一个好得多的主意是提供一个公共静态方法，返回\
  \ `objectCount` 字段的值。这正是你现在要执行的操作。\n\n### 4. 在 `Point` 类中添加一个名为 `ObjectCount` 的公共静态方法，该方法返回一个\
  \ `int` 但不接受任何参数。此方法应该返回 `objectCount` 字段的值，如下文中的粗体字体所示：\n\n点击此处查看代码图像\n\n```csharp\n\
  class Point\n{\n...\npublic static int ObjectCount() => objectCount;\n}\n```\n\n\
  #### 5. 在代码和文本编辑器窗口中显示 `Program` 类。在 `doWork` 方法中添加一条语句，将 `Point` 类的 `ObjectCount`\
  \ 方法返回的值写入屏幕，如下方的代码示例中的粗体字体所示：\n\n点击此处查看代码图像\n\n```csharp\nstatic void doWork()\n\
  {\nPoint origin = new Point();\nPoint bottomRight = new Point(1366, 768);\ndouble\
  \ distance = origin.distanceTo(bottomRight);\nConsole.WriteLine($\"Distance is:\
  \ {distance}\");\nConsole.WriteLine($\"Number of Point objects: {Point.ObjectCount()}\"\
  );\n}\n```\n\n调用 `ObjectCount` 方法是通过引用类名 `Point` 来实现的，而不是引用 `Point` 变量名（如 `origin`\
  \ 或 `bottomRight`）。由于在调用 `ObjectCount` 时已经创建了两个 `Point` 对象，因此该方法应该返回值 2。\n\n###\
  \ 6. 在调试（Debug）菜单上，点击转转调试运行（Start Without Debugging）。\n\n确认控制台窗口写入了消息“Number of\
  \ Point objects: 2”（紧在显示 `distance` 变量值的消息之后）。\n\n### 7. 按回车键关闭程序并返回 Visual Studio\
  \ 2015。\n\n### 匿名类\n\n`匿名类`（anonymous class）是没有名字的类。这听起来有点奇怪，但在你本书后面会看到的某些情况下，它实际上非常有用，特别是在使用查询表达式时（你将在第\
  \ 20 章 中的“解耦应用程序逻辑和处理事件”中学习查询表达式）。目前，你只需深信它们是有用的。\n\n你只需通过使用 `new` 关键字和一对大括号来定义类想要包含的字段和值，即可创建一个匿名类，如下：\n\
  \n点击此处查看代码图像\n\n```csharp\nmyAnonymousObject = new { Name = \"John\", Age = 47 };\n\
  ```\n\n该类包含名为 `Name`（初始化为字符串“John”）和 `Age`（初始化为整数 47）的公共字段。编译器根据你指定的用于初始化字段的数据类型来推断字段的类型。\n\
  \n当你定义匿名类时，编译器会为该类生成自己的名称，但它不会告诉你它是什么。因此，匿名类引发了一个潜在的趣味难题：如果你不知道类的名称，又如何创建相应类型的对象并将类的实例赋值给它呢？在之前显示的代码示例中，变量\
  \ `myAnonymousObject` 的类型应该是什么？答案是你并不知道——这正是匿名类的意义所在！但是，如果你使用 `var` 关键字将 `myAnonymousObject`\
  \ 声明为隐式类型变量，这就不是问题了，如下：\n\n点击此处查看代码图像\n\n```csharp\nvar myAnonymousObject = new\
  \ { Name = \"John\", Age = 47 };\n```\n\n记住，`var` 关键字会导致编译器创建一个与初始化它的表达式相同类型的变量。在这种情况下，该表达式的类型是编译器恰好为匿名类生成的任何名称。\n\
  \n你可以使用熟悉的点符号表示法来访问对象中的字段，如下所示：\n\n点击此处查看代码图像\n\n```csharp\nConsole.WriteLine($\"\
  Name: {myAnonymousObject.Name} Age: {myAnonymousObject.Age}\");\n```\n\n你甚至可以创建同一个匿名类的其他实例，但具有不同的值，如下：\n\
  \n点击此处查看代码图像\n\n```csharp\nvar anotherAnonymousObject = new { Name = \"Diana\",\
  \ Age = 46 };\n```\n\nC# 编译器使用字段的名称、类型、数量和顺序来确定两个匿名类实例是否具有相同类型。在这种情况下，变量 `myAnonymousObject`\
  \ 和 `anotherAnonymousObject` 具有相同数量的字段、相同的名称和类型以及顺序，因此这两个变量都是同一个匿名类的实例。这意味着你可以执行如下的赋值语句：\n\
  \n点击此处查看代码图像\n\n```csharp\nanotherAnonymousObject = myAnonymousObject;\n```\n\n\
  注意：警告这种赋值可能无法实现预期的效果。你将在第 8 章中学习更多关于赋值的内容。\n\n匿名类的内容有相当限制。例如，匿名类只能包含公共字段，所有字段必须已初始化，不能是静态的，且不能定义任何方法。你将在本书中经常使用匿名类。\n\
  \n### 总结\n\n在本章中，你学习了如何定义新类。你了解到默认情况下，类的字段和方法是私有的，类外部代码无法访问，但你可以使用 `public` 关键字将字段和方法暴露给外部。你学习了如何使用\
  \ `new` 关键字创建类的新实例，以及如何定义初始化实例的构造函数。最后，你了解如何实现静态字段和方法以提供独立于任何实例的数据和操作。\n\n如果你想继续下一章，请保持\
  \ Visual Studio 2015 运行并转到第 8 章。\n\n如果你现在想退出 Visual Studio 2015，在文件（File）菜单上点击退出。如果看到保存对话框，点击“是”并保存项目。\n\
  \n\n\n\nC# 中内置的大多数原始类型，如 `int`、`float`、`double` 和 `char`（但由于后文将介绍的原因，不包括 `string`）统称为`值类型`（value\
  \ types）。这些类型具有固定的大小，当你将一个变量声明为值类型时，编译器会生成代码，分配一个足够大的内存块来存储对应的值。例如，声明一个 `int` 变量会导致编译器分配\
  \ 4 字节（32 位）的内存来存储该整数值。向 `int` 赋值值（例如 42）的语句会将该值复制到这块内存中。\n\n对于诸如 `Circle`（在第 7\
  \ 章中描述）之类的类类型的处理方式不同。当你声明一个 `Circle` 变量时，编译器*不会*生成分配足够大内存块来存储 `Circle` 的代码；它只是分配一小块内存，可能可以存储指向包含\
  \ `Circle` 的另一个内存块的地址（或引用）（地址指定了内存中某个项目的位置）。只有当使用 `new` 关键字创建对象时，才会为实际的 `Circle`\
  \ 对象分配内存。类是`引用类型`（reference type）的一个示例。引用类型持有对内存块的引用。为了编写充分利用 Microsoft .NET Framework\
  \ 的高效 C# 程序，你需要理解值类型和引用类型的区别。\n\n![Image](img/Image00005.jpg) 注意\n\nC# 中的 `string`\
  \ 类型实际上是一个类。这是因为字符串没有标准大小（不同的字符串可以包含不同数量的字符），而且在程序运行时动态地为字符串分配内存比在编译时进行静态分配要高效得多。本章对类等引用类型的描述也适用于\
  \ `string` 类型。事实上，C# 中的 `string` 关键字只是 `System.String` 类的别名。\n\n考虑这样一种情况：你声明了一个名为\
  \ `i` 的变量为 `int` 类型，并给它赋值为 42。如果你声明了另一个名为 `copyi` 的变量为 `int` 类型，然后将 `i` 赋值给 `copyi`，`copyi`\
  \ 将持有与 `i` 相同的值（42）。然而，尽管 `copyi` 和 `i` 恰好持有相同的值，但有两个内存块包含值 42：一个块用于 `i`，另一个块用于\
  \ `copyi`。如果你修改 `i` 的值，`copyi` 的值不会改变。让我们通过代码来看这一点：\n\n点击此处查看代码图像\n\n```cs\nint\
  \ i = 42; // 声明并初始化 i\n\nint copyi = i; /* copyi 包含了 i 中数据的拷贝：\n\ni 和 copyi 均包含值\
  \ 42 */\n\ni++; /* 增加 i 对 copyi 没有影响；\n\ni 现在包含 43，但 copyi 仍然包含 42 */\n```\n\n将变量\
  \ `c` 声明为类类型（例如 `Circle`）产生则完全不同。当你将 `c` 声明为 `Circle` 时，`c` 可以引用一个 `Circle` 对象；`c`\
  \ 持有的实际值是内存中 `Circle` 对象的地址。如果你又声明了一个名为 `refc` 的变量（同样为 `Circle` 类型）并将 `c` 赋值给 `refc`，则\
  \ `refc` 将拥有与 `c` 相同的地址拷贝；换句话说，只有一个 `Circle` 对象，且 `refc` 和 `c` 现在都引用它。以下是代码示例：\n\
  \n```cs\nCircle c = new Circle(42);\n\nCircle refc = c;\n```\n\n接下来的插图展示了这两个示例。`Circle`\
  \ 对象中的 符号（`@`）代表持有内存地址的引用：\n\n![Image](img/Image00074.jpg)\n\n这种差异非常重要。特别是方法参数的行为取决于它们是值类型还是引用类型。你将在下一个练习中探索这种差异。\n\
  \n### 复制引用类型和数据隐私性\n\n如果你实际上想将 `Circle` 对象 `c` 的内容复制到另一个 `Circle` 对象 `refc` 中，而不是仅仅复制引用，你必须让\
  \ `refc` 指向 `Circle` 类的新实例，然后逐字段地将数据从 `c` 复制到 `refc`，如下所示：\n\n点击此处查看代码图像\n\n```cs\n\
  Circle refc = new Circle();\n\nrefc.radius = c.radius; // 不要尝试这样做\n```\n\n然而，如果\
  \ `Circle` 类的任何成员是私有的（例如 `radius` 字段），你将无法复制这些数据。相反，你可以通过将它们暴露为属性使私有字段中的数据可访问，然后使用这些属性从\
  \ `c` 读取数据并复制到 `refc`。你将在第 15 章中的“实现属性以访问字段”中学习如何操作。\n\n或者，类可以提供一个 `Clone` 方法，返回另一个同类实例，但填充了相同的数据。例如，`Circle`\
  \ 类的 `Clone` 方法可以定义所示：\n\n点击此处查看代码图像\n\n```cs\nclass Circle\n{\n    private int\
  \ radius;\n\n    // 构造函数和其他方法\n\n    public Circle Clone()\n    {\n        // 创建一个新的\
  \ Circle\n        Circle clone = new Circle();\n        // 将私有数据复制到 clone\n    \
  \    clone.radius = this.radius;\n        // 返回新的 Circle\n        return clone;\n\
  \    }\n}\n```\n\n如果所有私有数据都是值，这种方法非常简单；但如果一个或多个字段本身是引用类型（例如，`Circle` 类可能包含第 7 章中的\
  \ `Point` 对象），这些引用类型也需要提供 `Clone` 方法，否则 `Circle` 类的 `Clone` 方法将仅复制这些字段的引用。这种过程被称为深拷贝（deep\
  \ copy）。而那种简单复制引用的替代方法被称为浅拷贝（shallow copy）。\n\n### 使用值参数和引用参数\n\n1. 如果尚未运行，请启动 Visual\
