  \ Settings）。在“异常设置”窗口工具栏上，点击“将列表还原为默认设置”（Restore The List To The Default Settings）按钮，然后点击“确定”。\n\
  \n***\n\n### 使用 `AggregateException` 类处理任务异常\n\n在整本书中你已经看到异常处理是任何商业应用程序中的重要元素。到目前为止你遇到的异常处理结构易于使用，如果你使用谨慎，捕获异常并确定是哪部分代码抛出异常是简单的事。然而，当你开始将工作分为多个并发任务时，跟踪和处理异常就变成了一个更复杂的问题。之前的练习显示了如何捕获取消任务时抛出的\
  \ `OperationCanceledException` 异常。然而，还有许多其他异常可能发生，不同的任务可能会各自生成自己的异常。因此，你需要一种方法来捕获并处理可能并发抛出的多个异常。\n\
  \n如果你正在使用 `Task` 等待方法来等待多个任务完成（使用实例方法 `Wait` 或静态方法 `Task.WaitAll` 和 `Task.WaitAny`\
  \ 方法），这些任务运行的方法所抛出的任何异常都会汇到一个被称为 `AggregateException` 的异常异常中。`AggregateException`\
  \ 异常是异常集合的封装。集合中的每个异常都可能由不同的任务抛出。在你的应用程序中，你可以捕获 `AggregateException` 异常，然后遍历此集合并执行任何必要的处理。为了帮助你，`AggregateException`\
  \ 类提供了 `Handle` 方法。`Handle` 方法接收一个 `Func<Exception, bool>` 委托，该委托引用一个接受 `Exception`\
  \ 对象作为参数并返回布尔值的方法。当你调用 `Handle` 时，被引用的方法会在 `AggregateException` 对象中集合中的每个异常运行。被引用的方法可以检查异常并采取适当的行动。如果被引用的方法处理了异常，它应该返回\
  \ `true`。如果不是，它应该返回 `false`。当 `Handle` 方法完成执行时，任何未处理的异常将将被捆成一个新的新的 `AggregateException`\
  \ 异常，并抛出该异常。随后的外层异常处理程序可以捕获此异常并进行处理。\n\n以下代码段显示了一个可以与 `AggregateException` 异常处理程序注册的方法示例。如果该方法检测到\
  \ `DivideByZeroException` 异常，它将显示消息“Division by zero occurred”；如果发生 `IndexOutOfRangeException`\
  \ 异常，则显示消息“Array index out of bounds”。任何其他异常将保持未处理。\n\n点击此处查看代码图像\n\n```csharp\n\
  private bool handleException(Exception e)\n{\n    if (e is DivideByZeroException)\n\
  \    {\n        displayErrorMessage(\"Division by zero occurred\");\n        return\
  \ true;\n    }\n    if (e is IndexOutOfRangeException)\n    {\n        displayErrorMessage(\"\
  Array index out of bounds\");\n        return true;\n    }\n    return false;\n\
  }\n```\n\n当你使用 `Task` 等待方法时，可以捕获 `AggregateException` 异常并注册 `handleException` 方法，如下：\n\
  \n点击此处查看代码图像\n\n```csharp\ntry\n{\n    Task first = Task.Run(...);\n    Task second\
  \ = Task.Run(...);\n    Task.WaitAll(first, second);\n}\ncatch (AggregateException\
  \ ae)\n{\n    ae.Handle(handleException);\n}\n```\n\n如果任何任务生成了 `DivideByZeroException`\
  \ 异常或 `IndexOutOfRangeException` 异常，`handleException` 方法将显示适当的消息并确认异常已处理。任何其他异常都将被归类为未处理，并将传播到\
  \ `AggregateException` 异常处理程序之外。\n\n你应该注意一个额外复杂性：当你取消任务时，你已经看到 CLR 抛出 `OperationCanceled`\
  \ 异常，如果你使用 `await` 运算符来等待任务，这就是被报告的异常。然而，如果你正在使用 `Task` 等待方法之一，此异常将被转换为 `TaskCanceledException`\
  \ 异常，这是你应该在 `AggregateException` 异常处理程序中准备处理的异常类型。\n\n***\n\n#### 对已取消和故障任务使用连续任务\n\
  \n如果你需要在任务被取消或抛出未处理异常时执行额外工作，请记住你可以使用带有适当 `TaskContinuationOptions` 值的 `ContinueWith`\
  \ 方法。例如，以下代码创建了一个运行 `doWork` 方法的任务。如果任务被取消，`ContinueWith` 方法将指定创建另一个任务并运行 `doCancellationWork`。该方法可以执行一些简单的记录或清理工作。如果任务未取消，连续任务将不会运行。\n\
  \n点击此处查看代码图像\n\n```csharp\nTask task = new Task(doWork);\ntask.ContinueWith(doCancellationWork,\
  \ TaskContinuationOptions.OnlyOnCanceled);\ntask.Start();\n\n...\n\nprivate void\
  \ doWork()\n{\n    // 任务启动时运行此代码\n    ...\n}\n\n...\n\nprivate void doCancellationWork(Task\
  \ task)\n{\n    // 当 doWork 完成时任务运行此代码\n    ...\n}\n```\n\n同样，你可以指定值 `TaskContinuationOptions.OnlyOnFaulted`，以指定一个在任务运行的原方法抛出未处理异常时运行的连续任务。\n\
  \n\n\n\n在本章中，你学习了为什么编写能够跨多个处理器和处理器核心进行扩展的应用程序非常重要。你了解了如何使用 `Task` 类来并行运行操作，以及如何同步并发操作并等待它们完成。你学习了如何使用\
  \ `Parallel` 类对某些常用的编程结构进行并行化，还了解了在什么时候对代码进行并行化是不合适的。你在图形用户界面中结合使用了任务和线程来提高响应速度和吞吐量，并了解如何以一种简洁且受控的方式取消任务。\n\
