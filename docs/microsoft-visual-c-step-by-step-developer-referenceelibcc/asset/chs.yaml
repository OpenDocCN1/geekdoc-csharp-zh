  ```csharp\nConsole.WriteLine(Util.Sum());\n```\n\n这次调用方法时没有传递任何参数。编译器将空参数列表翻译为空数组。\n\
  \n6. 在“调试”菜单上，点击“转调试启动”。\n\n程序生成并运行，在控制台中写入以下消息：\n\n点击此处查看代码图像\n\nException: Util.Sum:\
  \ empty parameter list\n\n这证实了方法中的第二个检查是有效的。\n\n7. 按回车键关闭程序并返回 Visual Studio 2015。\n\
