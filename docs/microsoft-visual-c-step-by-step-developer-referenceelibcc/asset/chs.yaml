  \n![Image](img/Image00005.jpg) 注意\n\n这些步骤是关重要的。如果没有它们，你将无法从计算机上的应用程序连接到数据库。如果你需要为一组计算机开放访问，还可以创建跨\
  \ IP 地址范围的防火墙。\n\n***\n\n**11.** 关闭 `Firewall Settings` 格，关闭 `Settings` 格，然后关闭数据库服务器格。\n\
  \n示例 AdventureWorks 数据库包含 `SalesLT` 模式下的名为 `Customer` 的表。该表包含了 Customers 应用显示的数据列，以及其他几个列。使用\
  \ `Entity Framework`，你可以忽略不相关的列，但如果你忽略的任何列不允许空且没有默认值，则你将无法创建新客户。在 `Customer` 表中，此限制适用于\
  \ `NameStyle`、`PasswordHash` 和 `PasswordSalt` 列（用于加密用户密码）。为了避免复杂性并让你专注于应用程序本身的功能，在下一个练习中，你将从\
  \ `Customer` 表中删除这些列。\n\n# 从 AdventureWorks 数据库中删除需要的列\n\n**1.** 在 Azure 门户中，在 `All\
