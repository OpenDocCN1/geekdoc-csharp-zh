  \ Visual Studio 2015。\n\n## 变型与泛型接口\n\n8 章 展示了可以使用 `object` 类型来持有任何类型的值或引用。例如，以下代码是完全合法的：\n\
  \n```cs\nstring myString = \"Hello\";\nobject myObject = myString;\n```\n\n记住，在继承关系中，`String`\
  \ 类派自 `Object` 类，因此所有字符串都是对象。\n\n现在考虑以下泛型接口和类：\n\n点击此处查看代码图像\n\n```cs\ninterface\
  \ IWrapper<T>\n{\n    void SetData(T data);\n    T GetData();\n}\n\nclass Wrapper<T>\
  \ : IWrapper<T>\n{\n    private T storedData;\n\n    void IWrapper<T>.SetData(T\
  \ data)\n    {\n        this.storedData = data;\n    }\n\n    T IWrapper<T>.GetData()\n\
  \    {\n        return this.storedData;\n    }\n}\n```\n\n`Wrapper<T>` 类为指定类型提供了一个简单的封装。`IWrapper`\
  \ 接口定义了 `SetData` 方法（`Wrapper<T>` 实现它以存储数据）和 `GetData` 方法（`Wrapper<T>` 实现以获取数据）。你可以创建该类的实例并使用它封装字符串，如下：\n\
  \n```cs\nWrapper<string> stringWrapper = new Wrapper<string>();\nIWrapper<string>\
  \ storedStringWrapper = stringWrapper;\nstoredStringWrapper.SetData(\" Hello\" );\n\
  Console.WriteLine($\" Stored value is {storedStringWrapper.GetData()}\" );\n```\n\
  \n\n\n这段代码创建了 `Wrapper<string>` 类型的实例。它通过 `IWrapper<string>` 接口引用该对象并调用 `SetData`\
  \ 方法。（`Wrapper<T>` 类型显式地实现了其接口，因此你必须通过适当的接口引用来调用方法。）代码还通过 `IWrapper<string>` 接口调用了\
  \ `GetData` 方法。如果你运行这段代码，它将输出消息“Stored value is Hello”。\n\n看下面这行代码：\n\n点击此处查看代码图片\n\
  \n```\nIWrapper<object> storedObjectWrapper = stringWrapper;\n```\n\n此语句与上一个代码示例中创建\
  \ `IWrapper<string>` 引用的语句相似，区别在于类型参数是 `object` 而不是 `string`。这段代码是合法的吗？记住所有的字符串都是对象（如之前所示，你可以将\
  \ `string` 值分配给 `object` 引用），因此从理论上来说，这个语句看起来是有行的。然而，如果你尝试这样做，该语句将编译失败并显示消息“无法隐式将类型\
  \ ‘Wrapper<string>’ 转换为 ‘IWrapper<object>’”。\n\n你可以尝试显式强制转换，如下：\n\n点击此处查看代码图片\n\n\
  ```\nIWrapper<object> storedObjectWrapper = (IWrapper<object>)stringWrapper;\n```\n\
  \n这段代码可以编译，但在运行时会抛出 `InvalidCastException` 异常失败。问题在于，虽然所有的字符串都是对象，但反过来却不然。如果允许该语句，你可以编写如下所示的代码，它最终尝试将\
  \ `Circle` 对象存储在 `string` 字段中：\n\n点击此处查看代码图片\n\n```\nIWrapper<object> storedObjectWrapper\
  \ = (IWrapper<object>)stringWrapper;\n\nCircle myCircle = new Circle();\n\nstoredObjectWrapper.SetData(myCircle);\n\
  ```\n\n`IWrapper<T>` 接口被认为是**不变的（invariant）**的。你不能将 `IWrapper<A>*` 对象赋值给类型为 `IWrapper<B>`\
  \ 的引用，即使类型 `A` 派生自类型 `B`。默认情况下，C# 实现了此限制以确保你代码的类型安全。\n\n### 协变接口 (Covariant interfaces)\n\
  \n假设你定义了如下所示的 `IStoreWrapper<T>` 和 `IRetrieveWrapper<T>` 接口来代替 `IWrapper<T>`，并在\
  \ `Wrapper<T>` 类中这样实现这些接口：\n\n点击此处查看代码图片\n\n```cs\ninterface IStoreWrapper<T>\n\
  {\n    void SetData(T data);\n}\n\ninterface IRetrieveWrapper<T>\n{\n    T GetData();\n\
  }\n\nclass Wrapper<T> : IStoreWrapper<T>, IRetrieveWrapper<T>\n{\n    private T\
  \ storedData;\n    void IStoreWrapper<T>.SetData(T data)\n    {\n        this.storedData\
  \ = data;\n    }\n\n    T IRetrieveWrapper<T>.GetData()\n    {\n        return this.storedData;\n\
  \    }\n}\n```\n\n在功能上，`Wrapper<T>` 类与之前相同，不同在于你通过不同的接口访问 `SetData` 和 `GetData`\
  \ 方法。\n\n点击此处查看代码图片\n\n```cs\nWrapper<string> stringWrapper = new Wrapper<string>();\n\
  \nIStoreWrapper<string> storedStringWrapper = stringWrapper;\n\nstoredStringWrapper.SetData(\"\
  Hello\");\n\nIRetrieveWrapper<string> retrievedStringWrapper = stringWrapper;\n\n\
  Console.WriteLine($\"Stored value is {retrievedStringWrapper.GetData()}\");\n```\n\
  \n因此，以下代码是合法的吗？\n\n点击此处查看代码图片\n\n```cs\nIRetrieveWrapper<object> retrievedObjectWrapper\
  \ = stringWrapper;\n```\n\n简单的回答是不，并且它会像之前一样由于错误编译失败。但如果你仔细考虑，虽然 C# 编译器认为该语句不是类型安全的，但假设此点的理由已经不再有效了。`IRetrieveWrapper<T>`\
  \ 接口仅允许你通过 `GetData` 方法读取 `Wrapper<T>` 对象持有的数据，并且没有提供任何更改数据的方法。在像这种类型参数仅作为泛型接口方法的返回值出现的情况下，你可以告知编译器某些隐式转换是合法的，它不需要强制执行严格类型安全。你可以在声明类型参数时指定\
  \ `out` 关键字来实现此，如下：\n\n点击此处查看代码图片\n\n```cs\ninterface IRetrieveWrapper<out T>\n\
  {\n    T GetData();\n}\n```\n\n这一特性被称为**协变（covariance）**。只要从类型 `A` 到类型 `B` 有有效的转换或者类型\
  \ `A` 派生自类型 `B`，你就可以将 `IRetrieveWrapper<A>` 对象赋值给 `IRetrieveWrapper<B>` 引用。现在的代码可以编译并按预期运行：\n\
  \n点击此处查看代码图片\n\n```cs\n// string 派生自 object，所以现在是合法的\n\nIRetrieveWrapper<object>\
  \ retrievedObjectWrapper = stringWrapper;\n```\n\n指定 `out` 修饰符仅当类型参数作为方法的返回值时才有效。如果你在泛型类中使用\
  \ `out`，它是非法的且你的代码无法编译。由于值类型不能形成层次结构，协变仅适用于引用类型。因此，以下代码无法编译，因为 `int` 是值类型：\n\n```cs\n\
  Wrapper<int> intWrapper = new Wrapper<int>();\n\nIStoreWrapper<object> intWrapper;\
  \ // 这是非法的\n```\n\n.NET Framework 定义的许多接口都表现出协变，包括 `IEnumerable<T>` 接口，它在第 19 章详细介绍。\n\
  \n### 逆变接口 (Contravariant interfaces)\n\n逆变与协变的原理相似，但工作方向相反；只要类型 `B` 派生自类型 `A`，你就可以通过类型\
  \ `A` 的引用使用泛型接口引用类型 `B` 对象。这听起来很复杂，所以值得查看 .NET 类库中的示例。\n\n.NET Framework 中的 `System.Collections.Generic`\
  \ 命名空间提供了一个名为 `IComparer<T>` 的接口，如下：\n\n```cs\npublic interface IComparer<in T>\n\
  {\n    int Compare(T x, T y);\n}\n```\n\n实现此接口的类必须定义 `Compare` 方法，用于比较两个类型为 `T`\
  \ 的对象。`Compare` 方法预期返回一个整数值：如果参数 `x` 和 `y` 相同则返回零，如果 `x` 小于 `y` 则返回负数，如果 `x` 大于\
  \ `y` 则返回正数。以下代码显示了一个根据哈希值排序对象的示例（`GetHashCode` 方法由 `Object` 类实现。它只是返回一个标识对象的整数值。所有引用类型都继承此方法并可以使用自己的实现进行重写）：\n\
  \n```cs\nclass ObjectComparer : IComparer<Object>\n{\n    int IComparer<Object>.Compare(Object\
  \ x, Object y)\n    {\n        int xHash = x.GetHashCode();\n        int yHash =\
  \ y.GetHashCode();\n        if (xHash == yHash)\n            return 0;\n       \
  \ if (xHash < yHash)\n            return -1;\n        return 1;\n    }\n}\n```\n\
  \n你可以创建一个 `ObjectComparer` 对象并通过 `IComparer<Object>` 接口调用 `Compare` 方法来比较两个对象，如下：\n\
  \n```cs\nObject x = ...;\n\nObject y = ...;\n\nObjectComparer objectComparer = new\
  \ ObjectComparer();\n\nIComparer<Object> objectComparator = objectComparer;\n\n\
  int result = objectComparator.Compare(x, y);\n```\n\n\n\n那是比较无聊的部分。更有趣的是，你可以通过一个比较字符串的\
  \ `IComparer` 接口版本来引用同一个对象，如下：\n\n点击此处查看代码图像\n\n```csharp\nIComparer<String> stringComparator\
  \ = objectComparer;\n```\n\n乍一看，此语句似乎打破了你所想象的每种类型安全规则。然而，如果你考虑 `IComparer<T>` 接口的作用，这种方法就是合理的。`Compare`\
  \ 方法的目的是根据传入的参数之间的比较结果返回一个值。如果你能够比较 `Objects`，那么你当然也能够比较 `Strings`，因为字符串仅仅是 `Objects`\
  \ 的特化类型。毕竟，一个 `String` 应该能够做 `Object` 能做的任何事情——这正是继承的目的。\n\n然而，这听起来仍然有一点主臆性。C# 编译器如何知道你不会在\
  \ `Compare` 方法的代码中执行任何特定类型的操作，而这些操作在通过一个基于不同类型的接口调用该方法时可能会失败的呢？如果你重新查看 `IComparer`\
  \ 接口的定义，你可以看到类型参数之前有一个 `in` 限定符：\n\n点击此处查看代码图像\n\n```csharp\npublic interface IComparer<in\
  \ T>\n{\n    int Compare(T x, T y);\n}\n```\n\n`in` 关键字告诉 C# 编译器，你可以将类型 `T` 作为参数类型传递给方法，也可以传递任何派自\
  \ `T` 的类型。你不能将 `T` 作为任何方法的返回值。基本上，这使得你能够基于对象类型的泛型接口或基于派生自对象类型的泛型接口来引用对象。基本上，如果类型\
  \ `A` 暴露了某些操作、属性或字段，那么如果类型 `B` 派自类型 `A`，它也必须暴露相同的操作（如果被重写，行为可能会不同）、属性和字段。因此，用类型\
  \ B 对象替换类型 A 对象应该是安全的。协变和逆变在泛型世界中似乎是边缘话题，但它们很有用。例如，`List<T>` 泛型集合类（位于 `System.Collections.Generic`\
  \ 命名空间中）使用 `IComparer<T>` 对象来实现 `Sort` 和 `BinarySearch` 方法。一个 `List<Object>` 对象可以包含任何类型的对象的集合，因此\
  \ `Sort` 和 `BinarySearch` 方法需要能够对任何类型的对象进行排序。如果没有逆变，`Sort` 和 `BinarySearch` 方法将需要包含逻辑，以确定正在排序或搜索的项目的真实类型，然后实现特定类型的排序或搜索机制。然而，除非你是一个数学家，否则很难回想起协变和逆变实际上是做什么的。根据根据本节的示例，我记忆的方式如下：\n\
  \n![Image](img/Image00001.jpg) **协变示例**：如果泛型接口中的方法可以返回字符串，那么它们也可以返回对象。（所有字符串都是对象。）\n\
  \n![Image](img/Image00001.jpg) **逆变示例**：如果泛型接口中的方法可以接受对象参数，那么它们就可以接受字符串参数。（如果你可以使用对象执行某项操作，那么你就可以使用字符串执行相同的操作，因为所有字符串都是对象。）\n\
  \n* * *\n\n![Image](img/Image00005.jpg) 注意\n\n与协变一样，只有接口和委托类型可以声明为逆变。你不能在泛型类中指定\
  \ `in` 修饰符。\n\n* * *\n\n### 总结\n\n在本章中，你学习了如何使用泛型创建类型安全的类。你看到了如何通过指定类型参数来实例化泛型类型。你还看到了如何实现泛型接口并定义泛型方法。最后，你学习了如何定义可以操作类型层次结构的协变和逆变泛型接口。\n\
