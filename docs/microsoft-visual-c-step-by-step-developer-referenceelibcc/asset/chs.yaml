  ![Image](img/Image00206.jpg)\n\n## 第 26 章 在通用平台应用程序中显示和搜索\n\n完成本章后，你能够：\n\n![Image](img/Image00001.jpg)\
  \ 解释如何使用 Model-View-ViewModel 模式来实现通用平台应用程序的逻辑。\n\n![Image](img/Image00001.jpg)\
  \ 使用数据绑定在视图中显示和修改数据。\n\n![Image](img/Image00001.jpg) 创建一个视图可以与模型交互的 ViewModel。\n\
  \n![Image](img/Image00001.jpg) 将 UWP 应用程序与 Cortana 集以提供语音搜索。\n\n### 实现 Model-View-ViewModel\
  \ 模式\n\n良好的图形化应用程序将用户界面设计与应用程序使用的数据以及组成应用程序功能的业务逻辑分离。这种分离有助于消除各个组件之间的依赖关系，允许数据的不同的显示方式而无需更改逻辑或底层数据模型。这种方法还为具有相应专业技能的人设计和实现不同元素扫清了道路。例如，艺术家可以专注于设计吸引且直观的\
  \ UI，数据库专家可以专注于实现用于存储和访问数据的优化数据结构，而 C# 开发者可以将其精力投入实现应用程序的业务逻辑。\n\n\n\n\n\n可以说，最流行的方法是遵循模型-视图-ViewModel（MVVM）设计模式。在这种设计模式中，模型（Model）提供应用使用的数据，而视图（View）代表数据在\
  \ UI 中的显示方式。ViewModel 包含连接两者的逻辑，它接收用户输入并将其转换为在模型上执行业务操作的命令，同时从模型中获取数据并按照视图预期的格式进行格式化。下图显示了\
  \ MVVM 模式元素之间的简化关系。请注意，应用程序可能会为同一份数据提供多个视图。例如，在 UWP 应用中，你可能实现不同的视图状态，通过不同的屏幕布局来呈现信息。ViewModel\
  \ 的工作之一是确保来自同一模型的数据可以被许多不同的视图显示和操作。在 UWP 应用中，视图可以使用数据绑定来连接到 ViewModel 显示的数据。此外，视图还可以调用\
  \ ViewModel 实现的命令，请求 ViewModel 更新模型中的数据或执行业务任务。\n\n![Image](img/Image00207.jpg)\n\
  \n## 使用数据绑定显示数据\n\n在开始为 Customers 应用程序实现 ViewModel 之前，进一步了解一些数据绑定以及你如何应用此技术在 UI\
  \ 中显示数据会有帮助。使用数据绑定，你可以将控件的属性链接到对象的属性；如果对象的指定属性值发生变化，与对象链接的控件属性也会随之变化。此外，数据绑定可以是双向的：如果使用数据绑定的控件属性值发生变化，修改将传播到控件所链接的对象。以下练习提供了如何使用数据绑定显示数据的简要介绍。它基于第\
  \ 25 章中的 Customers 应用程序。\n\n### 使用数据绑定显示客户信息\n\n1. 如果 Visual Studio 2015 尚未运行，请启动它。\n\
  \n2. 打开 Customers 项目，它位于文档文件夹中的 `\\Microsoft Press\\VCSBS\\Chapter 26\\Data Binding`\
  \ 文件夹。这是在第 25 章中开发的 Customers 应用程序版本，但 UI 布局略有修改——控件显示在蓝色背景上，使得它们更容易脱颖。\n\n![Image](img/Image00005.jpg)\
  \ 注意\n\n蓝色背景是通过使用 `Rectangle` 控件创建的，它与显示标题和数据的 `TextBlock` 以及 `TextBox` 控件跨越相同的行列。该矩形使用\
  \ `LinearGradientBrush` 填充，该画笔将矩形的颜色从顶部的中蓝色渐变为底部的深蓝色。在 `customersTabularView Grid`\
  \ 控件视图显示的 `Rectangle` 控件的 XAML 标记所示（`customersColumnarView Grid` 控件的 XAML 标记包含一个类似的\
  \ `Rectangle` 控件，跨越该布局使用的行列）：\n\n点击此处查看代码图像\n\n```xml\n<Rectangle Grid.Row=\"0\"\
  \ Grid.RowSpan=\"6\" Grid.Column=\"1\" Grid.ColumnSpan=\"7\" ...>\n  <Rectangle.Fill>\n\
  \    <LinearGradientBrush EndPoint=\"0.5,1\" StartPoint=\"0.5,0\">\n      <GradientStop\
  \ Color=\"#FF0E3895\"/>\n      <GradientStop Color=\"#FF141415\" Offset=\"0.929\"\
  />\n    </LinearGradientBrush>\n  </Rectangle.Fill>\n</Rectangle>\n```\n\n3. 在解决方案管理器中，右键点击\
  \ Customers 项目，指向“添加”，然后点击“类”。\n\n4. 在“添加新建 – Customers”对话框中，确保选中了类模板。在“名称”框中输入\
  \ `Customer.cs`，然后点击“添加”。你将使用此类来实现 `Customer` 数据类型，并实现数据绑定以在 UI 中显示 `Customer` 对象的细节。\n\
  \n5. 在显示 `Customer.cs` 文件的编辑器中，将 `Customer` 类设为公共，并添加以下私有字段和属性：\n\n```csharp\npublic\
  \ class Customer\n{\n    private int _customerID;\n    public int CustomerID\n \
  \   {\n        get { return _customerID; }\n        set { _customerID = value; }\n\
  \    }\n    private string _title;\n    public string Title\n    {\n        get\
  \ { return _title; }\n        set { _title = value; }\n    }\n    private string\
  \ _firstName;\n    public string FirstName\n    {\n        get { return _firstName;\
  \ }\n        set { _firstName = value; }\n    }\n    private string _lastName;\n\
  \    public string LastName\n    {\n        get { return _lastName; }\n        set\
  \ { _lastName = value; }\n    }\n    private string _emailAddress;\n    public string\
  \ EmailAddress\n    {\n        get { return _emailAddress; }\n        set { _emailAddress\
  \ = value; }\n    }\n    private string _phone;\n    public string Phone\n    {\n\
  \        get { return _phone; }\n        set { _phone = value; }\n    }\n}\n```\n\
  \n你可能会好奇为什么这些属性没有实现为自动属性，因为它们所做的只是获取和设置私有字段中的值。你将在后面的练习中为这些属性添加额外代码。\n\n6. 在解决方案管理器中，在\
  \ Customers 项目中双击 `MainPage.xaml` 文件，在设计视图显示应用程序的用户界面。\n\n7. 在 XAML 窗中，找到 `id` TextBox\
  \ 控件。修改 XAML 标记以设置该控件的 `Text` 属性，如下所示：\n\n```xml\n<TextBox Grid.Row=\"1\" Grid.Column=\"\
  1\" Text=\"{Binding}\" />\n```\n\n`Text=\"{Binding}\" 语法指定 `Text` 属性的值将由 `Path`\
  \ 提供。在这种情况下，`Path` 设置为 `CustomerID`，因此 `CustomerID` 表达式中的值将由该控件显示。然而，你需要提供更多信息以指示\
  \ `CustomerID` 实际上是 `Customer` 对象的属性。为了这一点，设置控件的 `DataContext` 属性，你稍后会这样做。\n\n8.\
  \ 为表单上的其他文本控件添加绑定表达式。为 `customersTabularView` 和 `customersColumnarView Grid` 控件中的\
  \ `TextBox` 应用数据绑定，如下文所示。（`ComboBox` 控件需要不同的处理方式，你将在本章的与 ComboBox 使用数据绑定 中介绍。）\n\
  \n点击此处查看代码图像\n\n```xml\n<Grid x:Name=\"customersTabularView\" ...>\n  <TextBox Grid.Row=\"\
  1\" Grid.Column=\"1\" x:Name=\"id\" Text=\"{Binding CustomerID}\" ... />\n  <TextBox\
  \ Grid.Row=\"1\" Grid.Column=\"5\" x:Name=\"firstName\" Text=\"{Binding FirstName}\"\
  \ ... />\n  <TextBox Grid.Row=\"1\" Grid.Column=\"7\" x:Name=\"lastName\" Text=\"\
  {Binding LastName}\" ... />\n  <TextBox Grid.Row=\"3\" Grid.Column=\"3\" Grid.ColumnSpan=\"\
  3\" x:Name=\"email\" Text=\"{Binding EmailAddress}\" ... />\n  <TextBox Grid.Row=\"\
  5\" Grid.Column=\"3\" Grid.ColumnSpan=\"3\" x:Name=\"phone\" Text=\"{Binding Phone}\"\
  \ .../>\n</Grid>\n\n<Grid x:Name=\"customersColumnarView\" Margin=\"10,20,10,20\"\
  \ Visibility=\"Collapsed\">\n  <TextBox Grid.Row=\"0\" Grid.Column=\"1\" x:Name=\"\
  cId\" Text=\"{Binding CustomerID}\" ... />\n  <TextBox Grid.Row=\"2\" Grid.Column=\"\
  1\" x:Name=\"cFirstName\" Text=\"{Binding FirstName}\" ... />\n  <TextBox Grid.Row=\"\
  3\" Grid.Column=\"1\" x:Name=\"cLastName\" Text=\"{Binding LastName}\" ... />\n\
  \  <TextBox Grid.Row=\"4\" Grid.Column=\"1\" x:Name=\"cEmail\" Text=\"{Binding EmailAddress}\"\
  \ ... />\n  <TextBox Grid.Row=\"5\" Grid.Column=\"1\" x:Name=\"cPhone\" Text=\"\
  {Binding Phone}\" ... />\n</Grid>\n```\n\n\n\n注意同一个绑定表达式可以用于多个控件。例如，表达式 `{Binding\
  \ CustomerID}` 被 `id` 和 `cId TextBox` 控件引用，这导致两个控件都显示相同的数据。\n\n9. 在“解决方案管理器”中，展开\
  \ `MainPage.xaml` 文件，然后双击 `MainPage.xaml.cs` 文件，在代码和文本编辑器窗口中显示 `MainPage.xaml` 表单的代码。在\
  \ `MainPage` 构造函数中添加下所示**粗体**的语句。\n\n点击此处查看代码图像\n\n```csharp\npublic MainPage()\n\
  {\n    this.InitializeComponent();\n    Customer customer = new Customer\n    {\n\
  \        CustomerID = 1,\n        Title = \"Mr\",\n        FirstName = \"John\"\
  ,\n        LastName = \"Sharp\",\n        EmailAddress = \"john@contoso.com\",\n\
  \        Phone = \"111-1111\"\n    };\n}\n```\n\n此代码创建了 `Customer` 类的一个新实例并为其填充了一些示例数据。\n\
  \n10. 在创建新 `Customer` 对象的代码之后，添加下所示**粗体**的语句：\n\n点击此处查看代码图像\n\n```csharp\nCustomer\
  \ customer = new Customer\n{\n    ...\n};\nthis.DataContext = customer;\n```\n\n\
  此语句指定了 `MainPage` 表单上的控件应该绑定的对象。在每个控件中，XAML 标记 `Text=\"{Binding Path}\"` 将将此此对象进行解析。例如，`id\
  \ TextBox` 和 `cId TextBox` 控件都指定了 `Text=\"{Binding CustomerID}\"`，因此它们将显示表单所绑定的\
  \ `Customer` 对象中 `CustomerID` 属性找到的值。\n\n***\n\n![Image](img/Image00005.jpg) 注意\n\
  \n在例例中，你设置了表单的 `DataContext` 属性，因此相同的数据绑定会自动应用到表单上的所有控件。如果你需要将特定控件绑定到不同的对象，也可以为单个控件设置\
  \ `DataContext` 属性。\n\n***\n\n11. 在“调试”菜单上，点击“启动调试”以生成并运行应用程序。\n\n验证表单是否占据全屏并显示如图像所示的客户\
  \ John Sharp 的详情：\n\n![Image](img/Image00208.jpg)\n\n12. 调整应用程序窗口大小以在窄视图下显示。验证它是否显示如此处所示相同的数据：\n\
  \n![Image](img/Image00209.jpg)\n\n在窄视图中显示的控件与在全屏视图中显示的控件绑定到相同的数据。\n\n13. 在窄视图中，将电子邮件地址更改为\
  \ john@treyresearch.com。\n\n14. 扩展应用程序窗口以切换到宽视图。\n\n注意此视图中显示的电子邮件地址没有更改。\n\n15.\
  \ 回到 Visual Studio 并停止调试。\n\n16. 在 Visual Studio 中，在代码和文本编辑器窗口中显示 `Customer` 类的代码，并在\
  \ `EmailAddress` 属性的 `set` 访问器中设置断点。\n\n17. 在“调试”菜单上，点击“启动调试”再次生成并运行应用程序。\n\n18.\
  \ 当调试器第一次到达断点时，按 F5 继续运行应用程序。\n\n19. 当 Customers 应用程序的 UI 出现时，调整应用程序窗口大小以显示窄视图，并将电子邮件地址更改为\
  \ john@treyresearch.com。\n\n20. 将应用程序窗口扩展回宽视图。\n\n注意调试器没有到达 `EmailAddress` 属性的 `set`\
  \ 访问器中的断点；当电子邮件 `TextBox` 失去焦点时，更新的值没有写回到 `Customer` 对象。\n\n21. 回到 Visual Studio\
  \ 并停止调试。\n\n22. 移除 `Customer` 类中 `EmailAddress` 属性 `set` 访问器中的断点。\n\n### 使用数据绑定修改数据\n\
  \n在上一个练习中，你看到了如何使用数据绑定可以轻松地显示对象中的数据。然而，默认情况下数据绑定是单向操作，你对显示的数据所做的任何更改都不会回写到数据源。在练习中，当你更改窄视图中显示的电子邮件地址时，你看到了这一点；当你切换回宽视图时，数据并没有发生变化。你可以通过修改控件的\
  \ XAML 标记中 `Binding` 规范的 `Mode` 参数来实现双向数据绑定。`Mode` 参数指示数据绑定是单向的还是双向的。这就是你接下来要执行的操作。\n\
  \n#### 实现 TwoWay 数据绑定以修改客户信息\n\n1. 在设计视图窗口中显示 `MainPage.xaml` 文件，并对每个 `TextBox`\
  \ 控件修改 XAML 标记，如下所示代码中的**粗体**所示：\n\n点击此处查看代码图像\n\n```xml\n<Grid x:Name=\"customersTabularView\"\
  \ ...>\n...\n<TextBox Grid.Row=\"1\" Grid.Column=\"1\" x:Name=\"id\" ...\nText=\"\
  {Binding CustomerID, Mode=TwoWay }\" .../>\n...\n<TextBox Grid.Row=\"1\" Grid.Column=\"\
  5\" x:Name=\"firstName\" ...\nText=\"{Binding FirstName, Mode=TwoWay }\" .../>\n\
  <TextBox Grid.Row=\"1\" Grid.Column=\"7\" x:Name=\"lastName\" ...\nText=\"{Binding\
  \ LastName, Mode=TwoWay }\" .../>\n...\n```\n```xml\n<Grid x:Name=\"customersColumnView\"\
  \ Margin=\"10,20,10,20\" ...>\n...\n<TextBox Grid.Row=\"0\" Grid.Column=\"1\" x:Name=\"\
  cId\" ...\nText=\"{Binding CustomerID, Mode=TwoWay }\" .../>\n<TextBox Grid.Row=\"\
  2\" Grid.Column=\"1\" x:Name=\"cFirstName\" ...\nText=\"{Binding FirstName, Mode=TwoWay\
  \ }\" .../>\n<TextBox Grid.Row=\"3\" Grid.Column=\"1\" x:Name=\"cLastName\" ...\n\
  Text=\"{Binding LastName, Mode=TwoWay }\" .../>\n<TextBox Grid.Row=\"4\" Grid.Column=\"\
  1\" x:Name=\"cEmail\" ...\nText=\"{Binding EmailAddress, Mode=TwoWay }\" .../>\n\
  ...\n<TextBox Grid.Row=\"5\" Grid.Column=\"1\" x:Name=\"cPhone\" ...\nText=\"{Binding\
  \ Phone, Mode=TwoWay }\" .../>\n</Grid>\n```\n\n`Mode` 参数指明了数据绑定是单向的（默认值）还是双向的。将\
  \ `Mode` 设置为 `TwoWay` 会导致用户所做的任何更改传递回到绑定的对象。\n\n2. 在“调试”菜单上，点击“启动调试”以生成并运行应用程序。\n\
  \n3. 在宽视图下，将电子邮件地址更改为 john@treyresearch.com，然后调整窗口以在窄视图下显示应用程序。\n\n注意尽管数据绑定更改了 `TwoWay`\
  \ 模式，窄视图中显示的电子邮件地址也没有更新——它仍然是 john@contoso.com。\n\n4. 回到 Visual Studio 并停止调试。\n\n\
  显然，某些地方没有正常！现在的问题不是数据没有更新，而是视图没有显示最新版本。（如果你重新在 `Customer` 类 `EmailAddress` 属性的 `set`\
  \ 访问器中设置断点并在调试器中运行，每当你更改电子邮件的值并离开 `TextBox` 控件时，你都会看到调试器到达断点。）尽管如此，数据绑定过程并不是魔法，数据绑定不知道它所绑定的数据何时已更改。对象需要通过发送\
  \ `PropertyChanged` 事件来通知数据绑定任何修改。此事件是 `INotifyPropertyChanged` 接口的一部分，所有支持双向绑定的对象都应该实现此接口。你将在下一个练习中实现此接口。\n\
  \n#### 在 Customer 类中实现 INotifyPropertyChanged 接口\n\n1. 在 Visual Studio 中，在代码和文本编辑器窗口中显示\
  \ `Customer.cs` 文件。\n\n2. 在文件顶部的列表中添加以下 *using* 指令：\n\n```csharp\nusing System.ComponentModel;\n\
  ```\n\n\n\n\n`INotifyPropertyChanged` 接口定义在此命名空间中。\n\n### 3. 修改 `Customer` 类的定义，指定它实现了\
  \ `INotifyPropertyChanged` 接口，如下所示加粗所示：\n\n点击此处查看代码图像\n\n```csharp\nclass Customer\
  \ : INotifyPropertyChanged\n```\n\n### 4. 在 `Customer` 类的 `Phone` 属性之后，按照下面的代码添加**加粗显示**的\
  \ `PropertyChanged` 事件：\n\n点击此处查看代码图像\n\n```csharp\nclass Customer : INotifyPropertyChanged\n\
  \n{\n\n...\n\npublic string _phone;\npublic string Phone {\nget { return this._phone;\
  \ }\nset { this._phone = value; }\n}\n\npublic event PropertyChangedEventHandler\
  \ PropertyChanged;\n\n}\n```\n\n此事件是 `INotifyPropertyChanged` 接口定义的唯一项。所有实现此接口的对象都必须提供此事件，并且当它们想要通知外部属性值发生变化时，都应该引发此事件。\n\
  \n### 5. 在 `PropertyChanged` 事件之后，向 `Customer` 类中添加下方**加粗显示**的 `OnPropertyChanged`\
  \ 方法：\n\n点击此处查看代码图像\n\n```csharp\nclass Customer : INotifyPropertyChanged\n\n{\n\
  \n...\n\npublic event PropertyChangedEventHandler PropertyChanged;\nprotected virtual\
  \ void OnPropertyChanged(string propertyName)\n{\n\nif (PropertyChanged != null)\n\
  {\nPropertyChanged(this,\nnew PropertyChangedEventArgs(propertyName));\n}\n}\n\n\
  }\n```\n\n`OnPropertyChanged` 方法引发 `PropertyChanged` 事件。传递 `PropertyChanged` 事件的\
  \ `PropertyChangedEventArgs` 参数应该指定发生变化的属性名称。此值作为参数传递给 `OnPropertyChanged` 方法。\n\
  \n### 6. 修改 `Customer` 类中每个属性的 `set` 访问器，以便每当它们包含的值被修改时，都调用 `OnPropertyChanged`\
  \ 方法，如下所示**加粗所示**：\n\n点击此处查看代码图像\n\n```csharp\nclass Customer : INotifyPropertyChanged\n\
  \n{\n\npublic int _customerID;\npublic int CustomerID\n{\nget { return this._customerID;\
  \ }\nset\n{\nthis._customerID = value;\nthis.OnPropertyChanged(nameof(CustomerID));\n\
  }\n}\n\npublic string _title;\npublic string Title\n{\nget { return this._title;\
  \ }\nset\n{\nthis._title = value;\nthis.OnPropertyChanged(nameof(Title));\n}\n}\n\
  \npublic string _firstName;\npublic string FirstName\n{\nget { return this._firstName;\
  \ }\nset\n{\nthis._firstName = value;\nthis.OnPropertyChanged(nameof(FirstName));\n\
  }\n}\n\npublic string _lastName;\npublic string LastName\n{\nget { return this._lastName;\
  \ }\nset\n{\nthis._lastName = value;\nthis.OnPropertyChanged(nameof(LastName));\n\
  }\n}\n\npublic string _emailAddress;\npublic string EmailAddress\n{\nget { return\
  \ this._emailAddress; }\nset\n{\nthis._emailAddress = value;\nthis.OnPropertyChanged(nameof(EmailAddress));\n\
  }\n\npublic string _phone;\npublic string Phone\n{\nget { return this._phone; }\n\
  set\n{\nthis._phone = value;\nthis.OnPropertyChanged(nameof(Phone));\n}\n}\n\n...\n\
  \n}\n```\n\n***\n\n### `nameof` 运算符\n\n在 `Customer` 类中演示的 `nameof` 运算符是 C# 代码中一个较少使用但非常有用的特性。它将将作为参数传递的变量名称以字符串的形式返回。如果不使用\
  \ `nameof` 运算符，你将不得不使用硬编码的字符串值。例如：\n\n点击此处查看代码图像\n\n```csharp\npublic int CustomerID\n\
  {\nget { return this._customerID; }\nset\n{\nthis._customerID = value;\nthis.OnPropertyChanged(\"\
  CustomerID\");\n}\n}\n```\n\n虽然使用字符串值需要的输入较少，但请考虑如果你在未来的某个点需要更改属性名称，会发生什么。如果使用字符串方法，你将需要修改字符串值。如果不这样做，代码仍然可以编译和运行，但在运行时对属性值的任何更改将不会被通知，导致难以发现的错误。使用\
  \ `nameof` 运算符，如果你更改了属性名称但忘记更改 `nameof` 的参数，代码将无法编译，从而立即提醒你一个应该快速方便地修复的错误。\n\n***\n\
  \n### 7. 在“调试”菜单上，点击“启动调试”以再次生成并运行应用程序。\n\n### 8. 当“Customers”表单出现时，将电子邮件地址更改为 `john@treyresearch.com`，并将电话号码更改为\
  \ `222-2222`。\n\n### 9. 调整窗口大小以窄视图显示应用程序，并验证电子邮件地址和电话号码已更改。\n\n### 10. 将名字更改为 `James`，扩展窗口以显示宽视图，并验证名字已更改。\n\
  \n### 11. 返回 Visual Studio 并停止调试。\n\n#### 与 `ComboBox` 控件使用数据绑定\n\n对 `TextBox` 或\
  \ `TextBlock` 等控件使用数据绑定是简单的。另一方面，`ComboBox` 需要更多的关注。问题在于 `ComboBox` 控件实际上显示两个内容：一个用户从中选择项目的列表，以及当前选中项目的值。如果你实现数据绑定以显示列表，可以通过如下所示设置\
  \ `SelectedValue` 属性来配置选中值：\n\n点击此处查看代码图像\n\n```xml\n<ComboBox ... x:Name=\"title\"\
  \ SelectedValue=\"{Binding Title}\" />\n```\n\n然而，下拉列表的值被硬编码在 XAML 标记中，如下所示：\n\n\
  点击此处查看代码图像\n\n```xml\n<ComboBox ... x:Name=\"title\" ... >\n<ComboBoxItem Content=\"\
  Mr\"/>\n<ComboBoxItem Content=\"Mrs\"/>\n<ComboBoxItem Content=\"Ms\"/>\n<ComboBoxItem\
  \ Content=\"Miss\"/>\n</ComboBox>\n```\n\n这种标记在控件创建之前尚未应用，因此数据绑定的值在列表中未找到。如果你喜欢，可以尝试像这样配置\
  \ `SelectedValue` 的绑定并运行应用程序。尽管客户拥有 Mr 头衔，`ComboBox` 显示为空为空。\n\n解决这个问题有几种方法，但简单的方法创建一个包含有效列表的数据源，然后指定\
  \ `ComboBox` 控件使用此列表作为其值集。此外，你需要在应用 `ComboBox` 数据绑定之前执行此操作。\n\n#### 为 `title` ComboBox\
  \ 控件实现数据绑定\n\n**1.** 在 Visual Studio 中，在代码和文本窗口显示 `MainPage.xaml.cs` 文件。\n\n**2.**\
  \ 在 `MainPage` 构造函数中添加下方**加粗显示**的代码：\n\n点击此处查看代码图像\n\n```csharp\npublic MainPage()\n\
  {\nthis.InitializeComponent();\n\nList<string> titles = new List<string>\n{\n\"\
  Mr\", \"Mrs\", \"Ms\", \"Miss\"\n};\n\nthis.title.ItemsSource = titles;\nthis.cTitle.ItemsSource\
  \ = titles;\n\nCustomer customer = new Customer\n{\n...\n};\n\nthis.DataContext\
  \ = customer;\n}\n```\n\n此代码创建了一个包含客户可能拥有效头衔的字符串列表。代码随后将两个 `ComboBox` 控件的 `ItemsSource`\
  \ 属性设置为此列表（记住每个视图有一个 `ComboBox` 控件）。\n\n***\n\n![Image](img/Image00005.jpg) 注意\n\
  \n在商业应用程序中，你很可能会从数据库或其他数据源检索 `ComboBox` 控件显示的值列表，而不是像本示例这样使用硬编码列表。\n\n\n\n\n\n这段代码的位置非常重要。它必须在设置\
  \ `MainPage` 表单的 `DataContext` 属性的语句之前运行，因为该语句是表单上控件数据绑定发生的时刻。\n\n### 3. 在设计视图窗口显示\
  \ `MainPage.xaml` 文件。\n\n### 4. 修改 `title` 和 `cTitle` ComboBox 控件的 XAML 标记，如下面的**粗体**所示：\n\
  \n点击此处查看代码图像\n\n```xml\n<Grid x:Name=\"customersTabularView\" ...>\n\n...\n\n<ComboBox\
  \ Grid.Row=\"1\" Grid.Column=\"3\" x:Name=\"title\" ...\n\nSelectedValue=\"{Binding\
  \ Title, Mode=TwoWay}\">\n\n</ComboBox>\n\n...\n\n</Grid>\n\n<Grid x:Name=\"customersColumnarView\"\
  \ ...>\n\n...\n\n<ComboBox Grid.Row=\"1\" Grid.Column=\"1\" x:Name=\"cTitle\" ...\n\
  \nSelectedValue=\"{Binding Title, Mode=TwoWay}\">\n\n</ComboBox>\n\n...\n</Grid>\n\
  ```\n\n注意，每个控件的 `ComboBoxItem` 元素列表已被移除，`SelectedValue` 属性已配置为与 `Customer` 对象中的\
  \ `Title` 字段进行数据绑定。\n\n### 5. 在调试菜单上，点击“开始调试”以生成并运行应用程序。\n\n### 6. 验证客户标题的值显示正确（应该是\
  \ Mr）。点击 `ComboBox` 控件的下拉箭头，验证它是否包含 `Mr`、`Mrs`、`Ms` 和 `Miss` 值。\n\n### 7. 调整窗口大小以在窄视图显示应用，并执行相同的检查。注意，你可以更改标题，当切换回宽视图时，将显示新标题。\n\
  \n### 8. 返回 Visual Studio 并停止调试。\n\n## 创建 ViewModel\n\n你现在已经了解如何配置数据绑定将数据源连接到用户界面中的控件，但你一直使用的数据源非常简单，只包含一个客户。在现实世界中，数据源可能复杂得多，由不同类型的对象集合组成。记住在\
  \ MVVM 术语中，数据源通常由模型（Model）提供，UI（视图）通过 `ViewModel` 对象间接与模型通信。这种方法的背后的原理是模型与显示模型提供的数据的视图应该是独立的；如果修改了用户界面，你不应该更改模型；如果底层模型发生变化，你也不应该需要调整\
  \ UI。\n\n`ViewModel` 提供了视图和模型之间的连接，并实现了应用程序的业务逻辑。同样，这些业务逻辑应该独立于视图和模型。`ViewModel`\
  \ 通过实现一组命令将业务逻辑暴露给视图。UI 可以根据用户在应用程序中的导航方式触发这些命令。在接下来的练习中，你将通过实现一个包含 `Customer` 对象列表的模型，并创建一个提供命令的\
  \ `ViewModel`（用户可以通过命令在视图中的客户之间切换）来扩展 Customers 应用程序。\n\n### 创建一个用于管理客户信息的 ViewModel\n\
  \n### 1. 打开 Customers 项目，它位于你文档文件夹中的 `\\Microsoft Press\\VCSBS\\Chapter 26\\ViewModel`\
  \ 文件夹中。该项目包含上一组练习中 Customers 应用程序的完成版本；如果你愿意，也可以继续使用你自己的项目版本。\n\n### 2. 在解决方案管理器中，右键点击\
  \ Customers 项目，指向“添加”，然后点击“类”。\n\n### 3. 在“添加新项 – Customers”对话框中，在“名称”框中输入 `ViewModel.cs`，然后点击“添加”。\n\
  \n此类提供了一个包含 `Customer` 对象集合的 basic `ViewModel`。用户界面将绑定到此 `ViewModel` 暴露的数据。\n\n\
  ### 4. 在显示 `ViewModel.cs` 文件的代码和文本编辑器中，将类标记为公共（public），并将后续示例中以**粗体**所示的代码添加到 `ViewModel`\
  \ 类中：\n\n点击此处查看代码图像\n\n```csharp\npublic class ViewModel\n{\n    private List<Customer>\
  \ customers;\n\n    public ViewModel()\n    {\n        this.customers = new List<Customer>\n\
  \        {\n            new Customer\n            {\n                CustomerID\
  \ = 1,\n                Title = \"Mr\",\n                FirstName=\"John\",\n \
  \               LastName=\"Sharp\",\n                EmailAddress=\"john@contoso.com\"\
  ,\n                Phone=\"111-1111\"\n            },\n            new Customer\n\
  \            {\n                CustomerID = 2,\n                Title = \"Mrs\"\
  ,\n                FirstName=\"Diana\",\n                LastName=\"Sharp\",\n \
  \               EmailAddress=\"diana@contoso.com\",\n                Phone=\"111-1112\"\
  \n            },\n            new Customer\n            {\n                CustomerID\
  \ = 3,\n                Title = \"Ms\",\n                FirstName=\"Francesca\"\
  ,\n                LastName=\"Sharp\",\n                EmailAddress=\"frankie@contoso.com\"\
  ,\n                Phone=\"111-1113\"\n            }\n        };\n    }\n}\n```\n\
  \n`ViewModel` 类使用 `List<Customer>` 对象作为它的模型，构造函数用一些示例数据填充了此列表。严格来说，这些数据应该存储在单独的\
  \ `Model` 类中，但为了练习的目的，我们将凑合这些示例数据。\n\n### 5. 将后续代码中**粗体**所示的私有变量 `currentCustomer`\
  \ 添加到 `ViewModel` 类中，并在构造函数中将其初始化为零：\n\n点击此处查看代码图像\n\n```csharp\npublic class ViewModel\n\
  {\n    private List<Customer> customers;\n    private int currentCustomer;\n\n \
  \   public ViewModel()\n    {\n        this.currentCustomer = 0;\n        this.customers\
  \ = new List<Customer>\n        {\n            ...\n        };\n    }\n}\n```\n\n\
  `ViewModel` 类将使用此变量来跟踪视图正在显示的 `Customer` 对象。\n\n### 6. 将后续代码中**粗体**所示的 `Current`\
  \ 属性添加到 `ViewModel` 类中，位于构造函数之后：\n\n点击此处查看代码图像\n\n```csharp\npublic class ViewModel\n\
  {\n    private List<Customer> customers;\n    private int currentCustomer;\n\n \
  \   public ViewModel()\n    {\n        ...\n    }\n\n    public Customer Current\n\
  \    {\n        get { return customers.Count > 0 ? customers[currentCustomer] :\
  \ null; }\n    }\n}\n```\n\n`Current` 属性提供了对当前 `Customer` 对象的访问。如果没有客户，它返回 `null`。注意：对模型进行控制访问是良好的做法，只有\
  \ ViewModel 应该能够修改它。但这种限制并没有阻止视图更新由 ViewModel 提供的数据。\n\n### 7. 在代码和文本编辑器中打开 `MainPage.xaml.cs`\
  \ 文件。\n\n### 8. 在 `MainPage` 构造函数中，删除创建 `Customer` 对象的代码，并替换为创建 `ViewModel` 类的语句。将设置\
  \ `MainPage` 对象 `DataContext` 属性的语句引用新的 `ViewModel` 对象，如下面的**粗体**所示：\n\n点击此处查看代码图像\n\
  \n```csharp\npublic MainPage()\n{\n    ...\n    ViewModel viewModel = new ViewModel();\n\
  \    this.DataContext = viewModel;\n}\n```\n\n### 9. 在设计视图中打开 `MainPage.xaml` 文件。\n\
  \n### 10. 在 XAML 窗中，修改 `TextBox` 和 `ComboBox` 控件的数据绑定，通过 `ViewModel` 提供的 `Current`\
  \ 对象引用属性，如后续代码中**粗体**所示：\n\n点击此处查看代码图像\n\n```xml\n<Grid x:Name=\"customersTabularView\"\
  \ ...>\n\n...\n\n<TextBox Grid.Row=\"1\" Grid.Column=\"1\" x:Name=\"id\" ...\n\n\
  Text=\"{Binding Current.CustomerID, Mode=TwoWay}\" .../>\n\n<TextBox Grid.Row=\"\
  1\" Grid.Column=\"5\" x:Name=\"firstName\" ...\n\nText=\"{Binding Current.FirstName,\
  \ Mode=TwoWay }\" .../>\n\n<TextBox Grid.Row=\"1\" Grid.Column=\"7\" x:Name=\"lastName\"\
  \ ...\n\nText=\"{Binding Current.LastName, Mode=TwoWay }\" .../>\n\n<ComboBox Grid.Row=\"\
  1\" Grid.Column=\"3\" x:Name=\"title\" ...\n\nSelectedValue=\"{Binding Current.Title,\
  \ Mode=TwoWay}\">\n\n</ComboBox>\n\n...\n\n<TextBox Grid.Row=\"3\" Grid.Column=\"\
  3\" x:Name=\"email\" ...\n\nText=\"{Binding Current.EmailAddress, Mode=TwoWay }\"\
  \ .../>\n\n...\n\n<TextBox Grid.Row=\"5\" Grid.Column=\"3\" x:Name=\"phone\" ...\n\
  \nText=\"{Binding Current.Phone, Mode=TwoWay }\" .../>\n\n</Grid>\n\n<Grid x:Name=\"\
  customersColumnarView\" Margin=\"20,10,20,110\" ...>\n\n...\n</Grid>\n```\n\n\n\n\
  \n\n```xml\n<TextBox Grid.Row=\"0\" Grid.Column=\"1\" x:Name=\"cId\" ...\nText=\"\
  {Binding Current .CustomerID, Mode=TwoWay }\" .../>\n\n<TextBox Grid.Row=\"2\" Grid.Column=\"\
  1\" x:Name=\"cFirstName\" ...\nText=\"{Binding Current .FirstName, Mode=TwoWay }\"\
  \ .../>\n\n<TextBox Grid.Row=\"3\" Grid.Column=\"1\" x:Name=\"cLastName\" ...\n\
  Text=\"{Binding Current .LastName, Mode=TwoWay }\" .../>\n\n<ComboBox Grid.Row=\"\
  1\" Grid.Column=\"1\" x:Name=\"cTitle\" ...\nSelectedValue=\"{Binding Current .Title,\
  \ Mode=TwoWay}\">\n</ComboBox>\n\n...\n\n<TextBox Grid.Row=\"4\" Grid.Column=\"\
  1\" x:Name=\"cEmail\" ...\nText=\"{Binding Current .EmailAddress, Mode=TwoWay }\"\
  \ .../>\n\n...\n\n<TextBox Grid.Row=\"5\" Grid.Column=\"1\" x:Name=\"cPhone\" ...\n\
  Text=\"{Binding Current .Phone, Mode=TwoWay }\" .../>\n</Grid>\n```\n\n11. 在 `Debug`\
  \ 菜单上，点击 `Start Debugging` 以编译并运行应用程序。\n12. 验证应用程序是否显示了 John Sharp 的详情（客户列表中的第一个客户）。更改客户详情并在视图之间切换，以证明数据绑定仍然正常运行。\n\
  13. 返回 `Visual Studio` 并停止调试。\n\nViewModel 通过 `Current` 属性访问客户信息，但目前它没有提供任何在客户之间进行导航的方法。你可以实现能够增加和减少\
  \ `currentCustomer` 变量的方法，以便 `Current` 属性能够检索不同的客户，但你应该以一种不将视图与 ViewModel 耦合的方式来这样做。最为接受的技术是使用\
  \ `Command` 模式。在这一模式中，ViewModel 以命令的形式暴露方法，视图可以调用这些方法。技巧之处在于避免在视图的代码中显式地通过名称引用这些方法。为了实现这一点，XAML\
  \ 允许你以声明式的方式将命令绑定到 UI 控件触发的操作上，正如你将在下一节的练习中看到的那样。\n\n### 向 ViewModel 中添加命令\n\n将控件的操作绑定到命令的\
  \ XAML 标记要求 ViewModel 暴露的命令必须实现 `ICommand` 接口。该接口定义了以下项：\n\n![Image](img/Image00001.jpg)\
  \ `CanExecute` 此方法返回一个布尔值，指示命令是否可以运行。使用此方法，ViewModel 可以根据上下文启用或禁用命令。例如，一个从列表中获取下一个客户的命令应该只有在有下一个客户可获取时才能运行；如果没有更多客户，则该命令应被禁用。\n\
  \n![Image](img/Image00001.jpg) `Execute` 此方法在命令被调用时运行。\n\n![Image](img/Image00001.jpg)\
  \ `CanExecuteChanged` 此事件在 ViewModel 状态发生变化时触发。在这些情况下，之前可以运行的命令现在可能会被禁用，反之亦然。例如，如果\
  \ UI 调用了一个从列表中获取下一个客户的命令，而该客户恰好是最后一个，那么后续对 `CanExecute` 的调用应该返回 `false`。在这种情况下，应该触发\
  \ `CanExecuteChanged` 事件以指示该命令已禁用。\n\n在下一个练习中，你将创建一个实现 `ICommand` 接口的泛型类。\n\n###\
  \ 实现 Command 类\n\n1. 在 `Visual Studio` 中，右键点击 `Customers` 项目，指向 `Add`，然后点击 `Class`。\n\
  2. 在 `Add New Item – Customers` 对话框中，选择 `Class` 模板。在 `Name` 框中输入 `Command.cs`，然后点击\
  \ `Add`。\n3. 在显示 `Command.cs` 文件的代码和文本编辑器中，向文件顶部列表添加以下 `using` 指令：\n```csharp\n\
  using System.Windows.Input;\n```\n`ICommand` 接口定义在此命名空间中。\n4. 将 `Command` 类设置为 `public`，并指定它实现了\
  \ `ICommand` 接口，如下所示：\n点击此处查看代码图片\n```csharp\npublic class Command : ICommand\n\
  {\n\n}\n```\n5. 向 `Command` 类中添加以下私有字段：\n点击此处查看代码图片\n```csharp\npublic class Command\
  \ : ICommand\n{\nprivate Action methodToExecute = null;\nprivate Func<bool> methodToDetectCanExecute\
  \ = null;\n}\n```\n`Action` 和 `Func` 类型在 第 20 章，“解耦应用程序逻辑和处理事件](#text00027.html_ch20)”中有要描述。`Action`\
  \ 类型是一个委托，你可以用它引用不带参数且没有返回值的方法，而 `Func<T>` 类型也是一个委托，可以引用不带参数但返回由类型参数 `T` 指定类型值的方法。在此类中，你将使用\
  \ `methodToExecute` 字段来引用 `Command` 对象在被视图调用时运行的代码。`methodToDetectCanExecute` 字段将用于引用检测命令是否可以运行的方法（根据应用程序或数据状态，可能会由于某些原因被禁用）。\n\
  6. 为 `Command` 类添加构造函数。该构造函数接受两个参数：一个 `Action` 对象和一个 `Func<bool>` 对象。将这些参数赋值给 `methodToExecute`\
  \ 和 `methodToDetectCanExecute` 字段，如下所示：\n点击此处查看代码图片\n```csharp\npublic class Command\
  \ : ICommand\n{\npublic Command(Action methodToExecute, Func<bool> methodToDetectCanExecute)\n\
  {\nthis.methodToExecute = methodToExecute;\nthis.methodToDetectCanExecute = methodToDetectCanExecute;\n\
  }\n```\nViewModel 将为每个命令创建此类的实例。\n7. 通过使用 `methodToExecute` 和 `methodToDetectCanExecute`\
  \ 方法来实现 `Command` 类的 `Execute` 和 `CanExecute` 方法，如下：\n点击此处查看代码图片\n```csharp\npublic\
  \ class Command : ICommand\n{\npublic Command(Action methodToExecute, Func<bool>\
  \ methodToDetectCanExecute)\n{\n}\npublic void Execute(object parameter)\n{\nthis.methodToExecute();\n\
  }\npublic bool CanExecute(object parameter)\n{\nif (this.methodToDetectCanExecute\
  \ == null)\n{\nreturn true;\n}\nelse\n{\nreturn this.methodToDetectCanExecute();\n\
  }\n}\n```\n注意，如果 ViewModel 为构造函数的 `methodToDetectCanExecute` 参数提供了 `null` 引用，则默认操作是假设命令可以运行，`CanExecute`\
  \ 方法返回 `true`。\n8. 为 `Command` 类添加公共 `CanExecuteChanged` 事件：\n点击此处查看代码图片\n```csharp\n\
  public class Command : ICommand\n{\npublic bool CanExecute(object parameter)\n{\n\
  }\npublic event EventHandler CanExecuteChanged;\n}\n```\n当你将命令绑定到控件时，控件会自动订阅此事件。当\
  \ ViewModel 的状态更新且 `CanExecute` 方法的返回值变化时，应由 `Command` 对象触发此事件。简单的策略是使用计时器每秒触发一次\
  \ `CanExecuteChanged` 事件。然后控件可以调用 `CanExecute` 来确定命令是否仍然可以执行，并根据结果采取启用或禁用自身的步骤。\n\
  9. 在文件顶部列表添加以下 `using` 指令：\n```csharp\nusing Windows.UI.Xaml;\n```\n10. 在 `Command`\
  \ 类构造函数上方添加以下**粗体**所示字段：\n点击此处查看代码图片\n```csharp\npublic class Command : ICommand\n\
  {\nprivate Func<bool> methodToDetectCanExecute = null;\nprivate DispatcherTimer\
  \ canExecuteChangedEventTimer = null;\npublic Command(Action methodToExecute, Func<bool>\
  \ methodToDetectCanExecute)\n{\n}\n}\n```\n\n\n\n\n\n`DispatcherTimer` 类定义在 `Windows.UI.Xaml`\
  \ 命名空间下，实现了一个可以在指定间隔引发事件的计时器。你将使用 `canExecuteChangedEventTimer` 字段来每一秒触发一次 `CanExecuteChanged`\
  \ 事件。\n\n### 11. 将以下代码中**加粗显示**的 `canExecuteChangedEventTimer_Tick` 方法添加到 `Command`\
  \ 类的末尾：\n\n点击此处查看代码图像\n\n```csharp\npublic class Command : ICommand\n{\n\n...\n\n\
  public event EventHandler CanExecuteChanged;\nvoid canExecuteChangedEventTimer_Tick(object\
  \ sender, object e)\n{\n\nif (this.CanExecuteChanged != null)\n{\nthis.CanExecuteChanged(this,\
  \ EventArgs.Empty);\n}}}\n\n}\n```\n\n该方法仅在至少有一个控件绑定到该命令时，简单地引发 `CanExecuteChanged`\
  \ 事件。严格来说，此方法在引发事件之前还应该检查对象的状态是否发生了变化。然而，你将把计时器间隔设置为一段很的时间（从处理的角度来看），以尽量减少由于不检查状态变化而导致的低效率。\n\
  \n### 12. 在 `Command` 构造函数中，添加以下**加粗显示**的语句。\n\n点击此处查看代码图像\n\n```csharp\npublic\
  \ class Command : ICommand\n{\n\n...\n\npublic Command(Action methodToExecute, Func<bool>\
  \ methodToDetectCanExecute)\n{\n\nthis.methodToExecute = methodToExecute;\nthis.methodToDetectCanExecute\
  \ = methodToDetectCanExecute;\nthis.canExecuteChangedEventTimer = new DispatcherTimer();\n\
  this.canExecuteChangedEventTimer.Tick += canExecuteChangedEventTimer_Tick;\nthis.canExecuteChangedEventTimer.Interval\
  \ = new TimeSpan(0, 0, 1);\nthis.canExecuteChangedEventTimer.Start();\n}\n\n...\n\
  }\n```\n\n此代码初始化了 `DispatcherTimer` 对象，并在启动计时器之前将计时器事件的间隔设置为一秒。\n\n### 13. 在“生成”（Build）菜单上，点击“生成解决方案”（Build\
  \ Solution），并确保你的应用程序无错误地生成。\n\n你现在可以使用 `Command` 类为 `ViewModel` 类添加命令了。在下一个练习中，你将定义命令以使用户能够在视图中的不同客户之间移动。\n\
  \n## 向 `ViewModel` 类中添加 `NextCustomer` 和 `PreviousCustomer` 命令\n\n### 1. 在 Visual\
  \ Studio 中，在代码和文本编辑器窗口中打开 `ViewModel.cs` 文件。\n\n### 2. 在文件顶部添加以下 `using` 指令，并修改\
  \ `ViewModel` 类的定义以实现 `INotifyPropertyChanged` 接口。\n\n点击此处查看代码图像\n\n```csharp\n\
  ...\nusing System.ComponentModel;\n\nnamespace Customers\n{\n\npublic class ViewModel\
  \ : INotifyPropertyChanged\n{\n\n...\n}\n}\n```\n\n### 3. 在 `ViewModel` 类的末尾添加 `PropertyChanged`\
  \ 事件和 `OnPropertyChanged` 方法。这与你在 `Customer` 类中包含的代码相同。\n\n点击此处查看代码图像\n\n```csharp\n\
  public class ViewModel : INotifyPropertyChanged\n{\n\n...\n\npublic event PropertyChangedEventHandler\
  \ PropertyChanged;\nprotected virtual void OnPropertyChanged(string propertyName)\n\
  {\n\nif (PropertyChanged != null)\n{\nPropertyChanged(this,\nnew PropertyChangedEventArgs(propertyName));\n\
  }}}\n```\n\n记住，视图通过其包含的各种控件的数据绑定表达式中的 `Current` 属性来引用数据。当 `ViewModel` 类移动到不同的客户时，它必须引发\
  \ `PropertyChanged` 事件，以通知视图要显示的数据已更改。\n\n### 4. 在构造函数之后，紧接着向 `ViewModel` 类添加以下字段和属性：\n\
  \n点击此处查看代码图像\n\n```csharp\npublic class ViewModel : INotifyPropertyChanged\n{\n\n\
  ...\n\npublic ViewModel()\n{\n\n...\n}\nprivate bool _isAtStart;\npublic bool IsAtStart\n\
  {\nget { return this._isAtStart; }\nset\n{\nthis._isAtStart = value;\nthis.OnPropertyChanged(nameof(IsAtStart));\n\
  }}\nprivate bool _isAtEnd;\npublic bool IsAtEnd\n{\nget { return this._isAtEnd;\
  \ }\nset\n{\nthis._isAtEnd = value;\nthis.OnPropertyChanged(nameof(IsAtEnd));\n\
  }}\n\n...\n}\n```\n\n你将使用这两个属性来跟踪 `ViewModel` 的状态。当 `ViewModel` 中的 `currentCustomer`\
  \ 字段位于客户集合的开头时，`IsAtStart` 属性将被设置为 `true`，而当 `ViewModel` 位于客户集合的末尾时，`IsAtEnd` 属性将被设置为\
  \ `true`。\n\n### 5. 修改构造函数以设置 `IsAtStart` 和 `IsAtEnd` 属性，如此处**加粗显示**所示：\n\n点击此处查看代码图像\n\
  \n```csharp\npublic ViewModel()\n{\n\nthis.currentCustomer = 0;\nthis.IsAtStart\
  \ = true;\nthis.IsAtEnd = false;\nthis.customers = new List<Customer>\n...\n}\n\
  ```\n\n### 6. 在 `Current` 属性之后，向 `ViewModel` 类添加所示**加粗显示**的 `Next` 和 `Previous`\
  \ 私有方法：\n\n点击此处查看代码图像\n\n```csharp\npublic class ViewModel : INotifyPropertyChanged\n\
  {\n\n...\n\npublic Customer Current\n{\n\n...\n}\nprivate void Next()\n{\n\nif (this.customers.Count\
  \ - 1 > this.currentCustomer)\n{\nthis.currentCustomer++;\nthis.OnPropertyChanged(nameof(Current));\n\
  this.IsAtStart = false;\nthis.IsAtEnd = (this.customers.Count - 1 == this.currentCustomer);}}\n\
  \nprivate void Previous()\n{\n\nif (this.currentCustomer > 0)\n{\nthis.currentCustomer--;\n\
  this.OnPropertyChanged(nameof(Current));\nthis.IsAtEnd = false;\nthis.IsAtStart\
  \ = (this.currentCustomer == 0);}}\n\n...\n}\n```\n\n![Image0005.jpg] 注意 `Count`\
  \ 属性返回集合的数量，但请记住集合中的项目是从 `0` 到 `Count – 1` 的。\n\n这些方法通过更新 `currentCustomer` 变量来指向下一个（或上一个）客户。注意这些方法通过维护\
  \ `IsAtStart` 和 `IsAtEnd` 属性的值，并引发 `Current` 属性的事件来指示客户已更改。这些方法是私有的，因为它们不应该从 `ViewModel`\
  \ 类外部访问。外部类将通过后续添加的命令来运行这些方法。\n\n### 7. 在 `ViewModel` 类中添加 `NextCustomer` 和 `PreviousCustomer`\
  \ 自动属性，如此处**加粗显示**所示：\n\n[点击此处查看代码图像]\n\n```csharp\npublic class ViewModel : INotifyPropertyChanged\n\
  {\n\nprivate List<Customer> customers;\nprivate int currentCustomer;\npublic Command\
  \ NextCustomer { get; private set; }\npublic Command PreviousCustomer { get; private\
  \ set; }\n\n...\n}\n```\n\n视图将绑定到这些 `Command` 对象，以便使用户能够在客户之间导航。\n\n### 8. 在 `ViewModel`\
  \ 构造函数中，将 `NextCustomer` 和 `PreviousCustomer` 属性设置为新的 `Command` 对象，如下：\n\n点击此处查看代码图像\n\
  \n```csharp\npublic ViewModel()\n{\n\nthis.currentCustomer = 0;\nthis.IsAtStart\
  \ = true;\nthis.IsAtEnd = false;\nthis.NextCustomer = new Command(this.Next, ()\
  \ =>\n\n{\nreturn this.customers.Count > 1 && !this.IsAtEnd; });\nthis.PreviousCustomer\
  \ = new Command(this.Previous, () =>\n\n{\nreturn this.customers.Count > 0 && !this.IsAtStart;\
  \ });\n\n...\n}\n```\n\n`NextCustomer Command` 指定了 `Next` 方法为在调用 `Execute` 方法时要执行的操作。Lambda\
  \ 表达式 `() => { return this.customers.Count > 1 && !this.IsAtEnd; }` 指定为在 `CanExecute\
  \ method` 调用的函数。\n\n\n\n\n只要客户列表包含一个以上的客户，且 `ViewModel` 未定位在该列表的最后一个客户，此表达式就会返回\
  \ `true`。`PreviousCustomer Command` 遵循相同的模式：它调用 `Previous` 方法从列表中检索上一个客户，而 `CanExecute`\
  \ 方法引用表达式 `() => { return this.customers.Count > 0 && !this.IsAtStart; }`，只要客户列表包含至少一个客户且\
  \ `ViewModel` 未定位在该列表的第一个客户，该表达式就会返回 `true`。\n\n**9.** 在“生成”（Build）菜单上，点击“生成解决方案”（Build\
  \ Solution），并验证你的应用程序仍然可以无错误地生成。\n\n现在你已经向 `ViewModel` 中添加了 `NextCustomer` 和 `PreviousCustomer`\
  \ 命令，你可以将这些命令绑定到视图中的按钮上。当用户点击按钮时，相应的命令将会运行。\n\nMicrosoft 发布了关于在 UWP 应用视图中添加按钮的指南，通用的建议是将调用命令的按钮放置在命令栏（command\
  \ bar）上。UWP 应用提供两个命令栏：一个出现在表单顶部，另一个出现在底部。用于导航应用程序或数据的按钮通常放置在顶部命令栏上，这也是你将在下一个练习中采用的方法。\n\
  \n* *\n\n![Image](img/Image00005.jpg) 注意\n\n你可以在此处找到实现命令栏的 Microsoft 指南：[`msdn.microsoft.com/library/windows/apps/hh465302.aspx`](http://msdn.microsoft.com/library/windows/apps/hh465302.aspx)。\n\
  \n* *\n\n#### 向 Customers 表单添加上一个和下一个一个按钮\n\n**1.** 在设计视图窗口中打开 `MainPage.xaml` 文件。\n\
  \n**2.** 滚动到 XAML 格的底部，在闭合标签 `</Page>` 立即上方添加以下**加粗**显示的标记代码：\n\n点击此处查看代码图像\n\n\
  ...\n\n```xml\n<Page.TopAppBar>\n<CommandBar>\n<AppBarButton x:Name=\"previousCustomer\"\
  \ Icon=\"Previous\"\nLabel=\"Previous\" Command=\"{Binding Path=PreviousCustomer}\"\
  />\n<AppBarButton x:Name=\"nextCustomer\" Icon=\"Next\"\nLabel=\"Next\" Command=\"\
  {Binding Path=NextCustomer}\"/>\n</CommandBar>\n</Page.TopAppBar>\n</Page>\n```\n\
  \n在此段 XAML 标记片段中有几点需要注意：\n\n• 默认情况下，命令栏出现在屏幕顶部，并显示其包含的按钮的图标。只有当用户点击命令栏右侧出现的“更多更多\
  \ (...)”按钮时，才会显示每个按钮的标签。然而，如果你正在设计一个可能用于多种语言的应用程序，你不应该使用硬编码的值作为标签，而应该将这些标签的文本存储在特定特定语言的资源文件中，并在应用程序运行时动态绑定\
  \ `Label` 属性。欲需更多信息，请访问 Microsoft 网站上的“快速入门：翻译 UI 资源 (XAML)”页面：`[`msdn.microsoft.com/library/windows/apps/xaml/hh965329.aspx`](https://msdn.microsoft.com/library/windows/apps/xaml/hh965329.aspx)`。\n\
  \n• `CommandBar` 控件只能包含一组特定的控件（实现 `ICommandBarElement` 接口的控件）。该集合包括 `AppBarButton`、`AppBarToggleButton`\
  \ 和 `AppBarSeparator` 控件。这些控件专门设计用于 `CommandBar` 内部运行。如果你尝试将按钮等控件添加到命令栏中，将收到错误消息“无法将指定的值赋值给集合。”\n\
  \n• UWP 应用模板包含多种内置图标（如示例代码所示的“上一个”和“下一个”），你可以将其显示在 `AppBarButton` 控件上。你可以通过“属性”窗口浏览完整的可用内置图标。在“图标”部分，点击“符号图标”。可用的内置图标将出现在显示的列表框中。你也可以定义自己的图标和位图。\n\
  \n• 每个按钮都有一个 `Command` 属性，你可以将其绑定到实现 `ICommand` 接口的对象的。在此应用程序中，你已将按钮绑定到 `ViewModel`\
  \ 类中的 `PreviousCustomer` 和 `NextCustomer` 命令。当用户在运行时点击其中任一按钮时，相应的命令将会运行。\n\n**3.**\
  \ 在“调试”（Debug）菜单上，点击“开始调试”（Start Debugging）。\n\nCustomers 表单应该出现并显示 John Sharp 的详情。命令栏应该显示在表单顶部，并包含“下一个”和“上一个”按钮，如下图所示：\n\
  \n![Image](img/Image00210.jpg)\n\n注意，“上一个”按钮不可用。这是因为 `ViewModel` 的 `IsAtStart` 属性为\
  \ `true`，而由“上一个”按钮引用的 `Command` 对象的 `CanExecute` 方法指示命令无法运行。\n\n**4.** 点击命令栏上的省略号按钮。按钮标签应该出现。这些标签将一直显示直到你点击命令栏上的任一个按钮。\n\
  \n**5.** 在命令栏上，点击“下一个”（Next）。\n\n客户 2 Diana Sharp 的详情应该出现，在短暂的延迟（长达一秒）后，“上一个”按钮应该变为可用。`IsAtStart`\
  \ 属性不再为 `true`，因此命令的 `CanExecute` 方法返回 `true`。然而，在命令中的计时器过期并触发 `CanExecuteChanged`\
  \ 事件之前，按钮不会收到此状态更改。这可能需要一秒时间。\n\n* *\n\n![Image](img/Image0005.jpg) 注意\n\n如果你对状态的变化有更即时的响应，可以安排命令中的计时器更频繁地过期。然而，避免过度缩短时间，因为频繁触发\
  \ `CanExecuteChanged` 事件可能会影响 UI 的性能。\n\n* *\n\n**6.** 在命令栏上，再次点击“下一个”。\n\n**7.**\
  \ 客户 3 Francesca Sharp 的详情应该出现，在短暂的延迟后，“下一个”按钮将不再可用。这一次，ViewModel 的 `IsAtEnd` 属性为\
  \ `true`，因此 `CanExecute` 方法返回 `false`，命令被禁用。\n\n**8.** 调整窗口以窄视图显示应用程序，并验证应用程序继续正常运行。“下一个”和“上一个”按钮应该可以在客户列表中来回移动。\n\
  \n**9.** 返回 Visual Studio 并停止调试。\n\n### 使用 Cortana 搜索数据\n\nWindows 10 应用的一项关键功能是与语音激活数字助手（也称为\
  \ Cortana）集成。通过 Cortana，你可以激活应用程序并传递命令。常见需求是使用 Cortana 启动搜索请求并让应用程序做出响应。应用程序可以将结果传回给\
  \ Cortana 显示（称为*后台激活*），或者由应用程序本身显示结果（称为*前台激活*）。在本节中，你将扩展 Customers 应用以允许使用户按名称搜索特定客户。你可以扩展此示例以涵盖其他属性，或者将搜索元素组合成更复杂的查询。\n\
  \n\n\n\n# 1. 创建一个语音命令定义 (VCD) 文件，描述你的应用程序可以响应的命令。这是一个 XML 文件，作为应用程序的一部分进行部署。\n\n\
  # 2. 在 Cortana 中注册语音命令。你通常在应用程序启动运行时执行此操作。在 Cortana 识别它之前，你必须至少运行一次应用程序。此后，如果 Cortana\
  \ 将特定命令与你的应用程序关联，它将自动启动你的程序。为了避免其词汇过于混乱，如果某个应用程序在几周内没有被激活，Cortana 将“忘记”与该程序关联的命令，此时需要重新注册命令才能被识别。因此，通常的做法是每次程序启动时都注册语音命令——以重置“遗忘”计数器并为程序提供额外的几周宽限限期。\n\
  \n# 3. 在你的应用程序中处理语音激活。程序将接收来自 Cortana 的信息，关于触发程序激活的命令。解析此命令、提取任何参数并执行相应操作是你的代码的责任。这是实现语音集成中最复杂的部分。\n\
  \n接下来的练习将使用 Customers 应用程序演示这一过程。\n\n## 为 Customers 应用程序创建语音命令定义 (VCD) 文件\n\n###\
  \ 1. 在 Visual Studio 中，打开位于文档文件夹中 `\\Microsoft Press\\VCSBS\\Chapter 26\\Cortana`\
  \ 文件夹下的 Customers 项目。\n\n此版本的 Customers 应用程序具有与上一个练习中创建的相同的 `ViewModel`，但数据源包含了更多客户的详情。客户信息仍然存储在\
  \ `List<Customer>` 对象中，但该对象现在是由 `DataSource.cs` 文件中的 `DataSource` 类创建的。`ViewModel`\
  \ 类引用此列表，而不是创建上一个练习中使用的三个客户的小集合。\n\n### 2. 在解决方案管理器中，右键点击 Customers 项目，指向“添加 (Add)然后点击“新建项\
  \ (New Item)”。\n\n### 3. 在“添加新建项 – Customers”对话框中，在左侧格中点击“Visual C#”。在中间格中向下滚动并选择“XML\
  \ 文件”模板。在“名称”框中输入 `CustomerVoiceCommands.xml`，然后点击“添加”，如底图所示：\n\n![Image](img/Image00212.jpg)\n\
  \nVisual Studio 会生成一个默认 XML 文件并在代码和文本编辑器中打开它。\n\n### 4. 在 XML 文件中添加此处加粗显示的标记标记。\n\
  \n点击此处查看代码图像\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<VoiceCommands\
  \ xmlns=\"http://schemas.microsoft.com/voicecommands/1.2\">\n<CommandSet xml:lang=\"\
  en-us\" Name=\"CustomersCommands\">\n<CommandPrefix>Customers</CommandPrefix>\n\
  <Example>Show details of John Sharp</Example>\n</CommandSet>\n</VoiceCommands>\n\
  ```\n\n语音命令定义在命令集中。每个命令集都有一个命令前缀（由 `CommandPrefix` 元素指定），Cortana 在运行时可以使用它来识别应用程序。命令前缀不需要与应用程序名称相同。例如，如果你的应用程序名称很长或包含数字字符，Cortana\
  \ 可能会难以识别，因此你可以使用命令前缀提供一个更短且更易发音的别名。`Example` 元素包含一个短语，显示用户如何调用该命令。Cortana 在响应如“我可以说什么？”或“帮助”之类的查询时显示此示例。\n\
  \n![Image](img/Image00005.jpg) 注意\n\n### 命令前缀应反映应用程序的用途，并且不与其他常见的应用程序或服务产生冲突。例如，如果你指定“Facebook”作为命令前缀，如果你的应用程序被提交到\
  \ Windows 商店，它很可能无法通过验证。\n\n### 5. 如果你不在美国境内，请更改 `CommandSet` 元素的 `xml:lang` 属性以反映你的本地设置。例如，如果你在英国，请指定\
  \ `xml:lang=\"en-gb\"`。\n\n这一点很重要。如果指定的语言与你的本地设置不匹配，Cortana 将在运行时无法识别你的语音命令。背后的原因是，你应该为应用程序运行的每个区域指定单独的\
  \ `CommandSet` 元素。这允许你为不同的语言提供替代命令。Cortana 使用运行应用程序的机器的本地设置来确定使用哪种命令集。\n\n### 6.\
  \ 在 XML 文件的 `CommandSet` 元素中添加此处加粗显示的 `Command` 和 `PhraseTopic` 元素：\n\n点击此处查看代码图像\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<VoiceCommands xmlns=\"http://schemas.microsoft.com/voicecommands/1.2\"\
  >\n<CommandSet xml:lang=\"en-us\" Name=\"CustomersCommands\">\n<CommandPrefix>Customers</CommandPrefix>\n\
  <Example>Show details of John Sharp</Example>\n<Command Name=\"showDetailsOf\">\n\
  <Example>show details of John Sharp</Example>\n<ListenFor RequireAppName=\"BeforeOrAfterPhrase\"\
  >\nshow details of {customer}\n</ListenFor>\n<ListenFor RequireAppName=\"BeforeOrAfterPhrase\"\
  >\nshow details for {customer}\n</ListenFor>\n<ListenFor RequireAppName=\"BeforeOrAfterPhrase\"\
  >\nsearch for {customer}\n</ListenFor>\n<Feedback>Looking for {customer}</Feedback>\n\
  <Navigate/>\n</Command>\n<PhraseTopic Label=\"customer\" Scenario=\"Search\">\n\
  <Subject>Person Names</Subject>\n</PhraseTopic>\n</CommandSet>\n</VoiceCommands>\n\
  ```\n\n你可以向命令集中添加一个或多个命令，每个命令都可以调用应用程序中的不同操作。每个命令都有唯一的标识符（`Name` 属性）。该标识符会被传递给 Cortana\
  \ 调用的应用程序，以便应用程序确定用户说了了哪个命令，从而决定执行什么操作。\n\n`Example` 元素中的文本在用户针对查询“我可以说什么？”选择你的应用程序时显示。Cortana\
  \ 会为你应用程序所理解的每个命令显示示例短语。\n\n`ListenFor` 元素用于 Cortana 识别应该调用此应用程序的请求。你可以指定多个 `ListenFor`\
  \ 短语为用户提供灵活性。在这种情况下，用户可以使用相同短语的变体来调用命令。用户说的短语应包含应用程序名称或 `CommandSet` 元素指定的前缀。在示例中，名称或前缀可以指定在短语的开头或结尾（`RequireAppName`\
  \ 属性设置为 `BeforeOrAfterPhrase`）——例如，“Customers, show details of John Sharp”或“Search\
  \ for John Sharp in Customers”。`ListenFor` 短语中的文本 `{customer}` 是占位符，由 `PhraseTopic`\
  \ 元素控制（稍后描述）。\n\n`Feedback` 元素在 Cortana 识别请求时读出。指定的客户将替换 `{customer}` 占位符。\n\n`Navigate`\
  \ 元素表示 Cortana 将在前台启动应用程序。你可以通过该元素的 `Target` 属性指定要显示的页面（如果应用程序包含多个页面）。Customers\
  \ 应用程序仅包含一个页面，因此未指定 `Target` 属性。如果应用程序旨在在后台运行并将数据传回 Cortana 显示，则应使用 `VoiceCommandService`\
  \ 元素而不是 `Navigate`。\n\n\n\n\n`PhraseTopic` 元素用于在口语短语中定义占位符。`Label` 属性指定该元素与哪个占位符关联。在运行时，Cortana\
  \ 将短语中此处说出的一个或多个单词替换到短语主题中。`Scenario` 属性和 `Subject` 元素是可选的，它们为 Cortana 提供如何解释这些单词的提示。在此示例中，这些单词被用作搜索参数并构成人名。你可以指定其他场景，例如\
  \ `Short Message`（短消息）或 `Natural Language`（自然语言），在这种情况下，Cortana 可能会尝试不同的方式解析这些单词。你还可以指定替代主题，如地址、电话号码或城市和州。\n\
  \n7. 在“文件”菜单上，点击 `SaveCustomerVoiceCommands.xml`，然后关闭该文件。\n\n8. 在解决方案管理器中，选择 `CustomerVoiceCommands.xml`\
  \ 文件。在“属性”窗口中，将 `Copy To Output Directory`（复制到输出目录）属性更改为 `Copy If Newer`（较新则复制）。\n\
  \n此操作会在 XML 文件发生更改时将其复制到应用程序文件夹并随程序一起部署。\n\n下一步是在应用程序运行时向 Cortana 注册语音命令。你可以在 `text`App.xaml.cs`\
  \ 文件中的 `OnLaunched` 方法代码中执行此操作。每当应用程序启动运行并发生 `Launched` 事件时，都会触发 `OnLaunched` 方法。当应用程序关闭时，你可以保存有关应用程序状态的信息（例如，用户正在查看哪个客户），并且你可以使用此事件在应用程序重新启动时恢复应用程序状态（通过显示相同的客户）。你还可以使用此事件来执行每次运行应用程序都应该发生的操作。\n\
  \n### 向 Cortana 注册语音命令\n\n1. 在解决方案管理器中，展开 `App.xaml`，然后双击 `App.xaml.cs` 以在代码和文本编辑器窗口中显示该文件。\n\
  \n2. 在文件顶部的列表中添加以下 `using` 指令。\n\n点击此处查看代码图像\n\n```csharp\nusing Windows.Storage;\n\
  using Windows.ApplicationModel.VoiceCommands;\nusing System.Diagnostics;\n```\n\n\
  3. 找到 `OnLaunched` 方法并通过添加 `async` 修饰符来启用异步操作：\n\n点击此处查看代码图像\n\n```csharp\nprotected\
  \ async override void OnLaunched(LaunchActivatedEventArgs e)\n{\n    ...\n}\n```\n\
  \n4. 将下方加粗所示的代码添加到 `OnLaunched` 方法的末尾：\n\n点击此处查看代码图像\n\n```csharp\nprotected async\
  \ override void OnLaunched(LaunchActivatedEventArgs e)\n{\n    ...\n    // 确保当前窗口激活状态\n\
  \    Window.Current.Activate();\n    try\n    {\n        var storageFile = await\
  \ Package.Current.InstalledLocation.GetFileAsync(@\"CustomerVoiceCommands.xml\"\
  );\n        await VoiceCommandDefinitionManager.InstallCommandDefinitionsFromStorageFileAsync(storageFile);\n\
  \    }\n    catch (Exception ex)\n    {\n        Debug.WriteLine(\n            $\"\
  Installing Voice Commands Failed: {ex.ToString()}\");\n    }\n}\n```\n\n第一条语句从应用程序文件夹检索包含语音命令定义的\
  \ XML 文件。然后将该文件传递给 `VoiceCommandDefinitionManager` 管理器。该类提供了向操作系统注册和查询语音命令定义的接口。静态方法\
  \ `InstallCommandDefinitionsFromStorageFileAsync` 注册在指定存储文件中找到的语音命令。如果在此过程中发生异常，将记录该异常，但允许应用程序继续运行（它只是不会响应语音命令）。\n\
  \n最后一步是让你的应用程序在 Cortana 识别出用于应用程序的语音命令时做出响应。在这种情况下，你可以通过使用 `OnActivated` 方法捕获 `Activated`\
  \ 事件。在这种情况下，你可以让你的应用程序对 Cortana 识别出的用于应用程序的语音命令做出响应。该方法接收一个 `ActivatedEventArgs`\
  \ 类型的 `args` 参数，其中包含了传递给应用程序的详细信息。\n\n### 在应用程序中处理语音激活\n\n1. 在解决方案管理器中，展开 `App.xaml`，然后双击\
  \ `App.xaml.cs` 以在代码和文本编辑器窗口中显示该文件。\n\n2. 在代码和文本编辑器中，在 `App` 类末尾添加所示的 `OnActivated`\
  \ 方法：\n\n```csharp\nprotected override void OnActivated(ActivatedEventArgs args)\n\
  {\n    base.OnActivated(args);\n}\n```\n\n此语句调用了重写的 `OnActivated` 方法来处理激活。\n\n2.\
  \ 在 `OnActivated` 方法中，添加此处所示的加粗所示的 `if` 语句块：\n\n```csharp\nprotected override void\
  \ OnActivated(ActivatedEventArgs args)\n{\n    base.OnActivated(args);\n    if (args.Kind\
  \ == ActivationKind.VoiceCommand)\n    {\n        var commandArgs = args as VoiceCommandEventArgs;\n\
  \        var speechRecognitionResult = commandArgs.Result;\n        var commandName\
  \ = speechRecognitionResult.RulePath.First();\n    }\n}\n```\n\n此块判断应用程序是否通过语音命令被激活。如果是，`args`\
  \ 参数包含 `VoiceCommandEventArgs` 对象。`Result` 属性包含 `speechRecognitionResult` 对象，该对象包含了关于命令的信息。`RulePath`\
  \ 列表包含了触发激活的短语的元素。\n\n3. 在 `OnActivated` 方法中添加下方加粗所示的代码：\n\n```csharp\nprotected\
  \ override void OnActivated(ActivatedEventArgs args)\n{\n    base.OnActivated(args);\n\
  \    if (args.Kind == ActivationKind.VoiceCommand)\n    {\n        ...\n       \
  \ var commandName = speechRecognitionResult.RulePath.First();\n        string customerName\
  \ = \"\";\n        switch (commandName)\n        {\n            case \"showDetailsOf\"\
  :\n                customerName = speechRecognitionResult.SemanticInterpretation.Properties[\"\
  customer\"].FirstOrDefault();\n                break;\n            default:\n  \
  \              break;\n        }\n    }\n}\n```\n\n`switch` 语句验证语音命令是否为 `showDetailsOf`。如果你添加更多语音命令，应该扩展此\
  \ `switch` 语句。如果语音数据包含未知命令，则会被忽略。\n\n`speechRecognitionResult` 对象的 `SemanticInterpretation`\
  \ 属性包含了关于被识别短语的属性的信息。应用程序的命令包含 `{customer}` 占位符，此代码获取用户口说并由 Cortana 解析的该占位符的值。\n\
  \n4. 在 `OnActivated` 方法的末尾（`switch` 语句之后）添加以下代码：\n\n点击此处查看代码图像\n\n```csharp\nFrame\
  \ rootFrame = Window.Current.Content as Frame;\nif (rootFrame == null)\n{\n    rootFrame\
  \ = new Frame();\n    rootFrame.NavigationFailed += OnNavigationFailed;\n    Window.Current.Content\
  \ = rootFrame;\n}\nrootFrame.Navigate(typeof(MainPage), customerName);\nWindow.Current.Activate();\n\
  ```\n\n这里的第一个块是样板代码，确保打开了一个应用程序窗口以显示页面。第二个块在此窗口中显示 `MainPage` 页面。`Frame` 对象的 `Navigate`\
  \ 方法使 `MainPage` 成为活动页面。第二个参数作为对象传递，供页面用于提供上下文信息。在此代码中，参数是包含客户名称的字符串。\n\n5. 在代码和文本编辑器中打开\
  \ `ViewModel.cs` 文件，并找到 `ViewModel` 构造函数。此构造函数中的代码已经过重构，初始化视图状态的语句已移动到名为 `_initializeState`\
  \ 的独立方法中，如下所示：\n\n\n\n\n点击此处查看代码图像\n\n```csharp\npublic ViewModel()\n{\n    _initializeState();\n\
  \    this.customers = DataSource.Customers;\n}\n\nprivate void _initializeState()\n\
  {\n    this.currentCustomer = 0;\n    this.IsAtStart = true;\n    this.IsAtEnd =\
  \ false;\n    this.NextCustomer = new Command(this.Next, () =>\n    { return this.customers.Count\
  \ > 1 && !this.IsAtEnd; });\n    this.PreviousCustomer = new Command(this.Previous,\
  \ () =>\n    { return this.customers.Count > 0 && !this.IsAtStart; });\n}\n```\n\
  \n**6.** 向 `ViewModel` 类中添加另一个构造函数。该构造函数应接收一个包含客户名称的字符串，并使用该名称过滤数据源中的记录，如下所示：\n\n\
  点击此处查看代码图像\n\n```csharp\npublic ViewModel(string customerName)\n{\n    _initializeState();\n\
  \    string[] names = customerName.Split(new[] {' '}, 2,\n    StringSplitOptions.RemoveEmptyEntries);\n\
  \    this.customers =\n    (from c in DataSource.Customers\n    where string.Compare(c.FirstName.ToUpper(),\
  \ names[0].ToUpper()) == 0 &&\n    (names.Length > 1 ?\n    string.Compare(c.LastName.ToUpper(),\
  \ names[1].ToUpper()) == 0 : true)\n    select c).ToList();\n}\n```\n\n客户的名称可以包含两个部分：名和姓。`String`\
  \ 类的 `Split` 方法可以根据分隔符字符列表将字符串拆分为子字符串。在这种情况下，如果用户提供了由一个或多个空格字符分隔的名和姓，`Split` 方法将客户名称划分为最多两个部分。结果存储在\
  \ `names` 数组中。LINQ 查询使用这些数据来查找所有名匹配 `names` 数组中第一个项且姓匹配 `names` 数组中第二个项的客户。如果用户只指定了单个名称，`names`\
  \ 数组将只包含一个项，LINQ 查询将仅与名进行匹配。为了消除任何大小敏感性，所有的字符串比较都是针对字符串的大写版本进行的。匹配的客户结果列表被赋值给视图模型中的\
  \ `customers` 列表。\n\n**7.** 返回代码和文本编辑器窗口中的 `MainPage.xaml.cs` 文件。\n\n**8.** 将此处所示的\
  \ `OnNavigatedTo` 方法添加到 `MainPage` 类的末尾，位于构造函数之后：\n\n点击此处查看代码图像\n\n```csharp\npublic\
  \ sealed partial class MainPage : Page\n{\n    public MainPage()\n    {\n      \
  \  ...\n    }\n\n    protected override void OnNavigatedTo(NavigationEventArgs e)\n\
  \    {\n        string customerName = e.Parameter as string;\n        if (!string.IsNullOrEmpty(customerName))\n\
  \        {\n            ViewModel viewModel = new ViewModel(customerName);\n   \
  \         this.DataContext = viewModel;\n        }\n    }\n}\n```\n\n当应用程序使用 `Navigate`\
  \ 方法显示（导航到）此页面时，会运行 `OnNavigatedTo` 方法。提供的任何参数都会出现在 `NavigationEventArgs` 参数的 `Parameter`\
  \ 属性中。此代码尝试将 `Parameter` 属性中的数据转换为字符串，如果成功，则将此字符串作为客户名称传递给 `ViewModel` 构造函数。生成的\
  \ `ViewModel`（应仅包含匹配此名称的客户）随后被设置为页面的数据上下文。\n\n**9.** 在“生成”（Build）菜单上，点击“生成解决方案”（Build\
  \ Solution）并验证解决方案是否成功编译。\n\n作为最后的润色，下一个练习将添加一组图标，Windows 10 和 Cortana 可以使用这些图标在视觉上表示应用程序。这些图标比空白应用模板提供的默认灰白色交叉图像更丰富。\n\
  \n## 向 Customers 应用程序中添加图标\n\n**1.** 在“解决方案管理器”（Solution Explorer）中，右键点击 `Assets`\
