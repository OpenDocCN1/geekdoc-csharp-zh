- "# Microsoft Visual C# 步步指南 (开发者参考)\n\n\n\n![](img/Image01272.jpg)\n![](img/Image01272.jpg)\n\
  \n\n\n![Image](img/Image00000.jpg)\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n* [使用块分组语句]\n\
  \n\n\n\n\n\n\n\n命名空间（Namespaces）通过为类等项创建容器来解决这个问题。如果两个同名的类位于不同的命名空间，它们就不会相互混淆。你可以像这样使用\
  \ `namespace` 关键字在名为 `TestHello` 的命名空间内创建一个名为 `Greeting` 的类：\n\n```namespace\nnamespace\
  \ TestHello\n{\nclass Greeting\n{\n...\n}\n}\n```\n\n然后，你可以在程序中使用 `TestHello.Greeting`\
  \ 来引用 `Greeting` 类。如果另一个开发者在不同的命名空间（例如 `NewNamespace`）中也创建了 `Greeting` 类，并且你在计算机上安装了包含该类的程序集（assembly），你的程序仍然会按预期工作，因为它们使用的是你的\
  \ `TestHello.Greeting` 类。如果你想引用另一个开发者的 `Greeting` 类，必须将其指定为 `NewNamespace.Greeting`。\n\
  \n在命名空间中定义所有类是一个良好的习惯，Visual Studio 2015 环境通过使用你的项目名称作为顶层命名空间遵循了这一建议。.NET Framework\
  \ 类库也遵循这一建议；.NET Framework 中的每个类都存在于命名空间中。例如，`Console` 类位于 `System` 命名空间中。这意味着它的全称实际上是\
  \ `System.Console`。\n\n当然，如果你每次使用类时都必须编写类的全称，那么这种情况与加上前缀限定符甚至仅为类命名一个如 `SystemConsole`\
  \ 之类的全局唯一名称并无二致。幸运的是，你可以在程序中使用 `using` 指令来解决这个问题。如果你回到 Visual Studio 2015 中的 `TestHello`\
  \ 程序，并在代码和文本编辑器窗口查看 `Program.cs` 文件，你会注意到文件顶部有以下几行：\n\n点击此处查看代码图像\n\n```cs\nusing\
  \ System;\nusing System.Collections.Generic;\nusing System.Linq;\nusing System.Text;\n\
  using System.Threading.Tasks;\n```\n\n这些行是 `using` 指令。`using` 指令将命名空间引入作用范围。在同一份文件的后续代码中，你不再需要显式地使用对象所属的命名空间来限定对象。显示的五个命名空间包含的类非常频繁，以至于\
  \ Visual Studio 2015 在你创建新项目时都会自动添加这些 `using` 指令。如果你需要引用其他命名空间，可以在源文件的顶部添加更多 `using`\
  \ 指令。\n\n下面的练习将更深入地演示命名空间的概念。\n\n## 尝试使用全称\n\n**1.** 在显示 `Program.cs` 文件的代码和文本编辑器窗口中，注释掉顶部的第一个\
  \ `using` 指令，如下：\n\n```cs\n//using System;\n```\n\n**2.** 在“生成”（Build）菜单上，点击“生成解决方案”。\n\
  \n生成失败了，“错误列表”（Error List）窗口显示了以下错误消息：\n\n点击此处查看代码图像\n\n当前上下文中不存在名称 'Console'。\n\
  \n**3.** 在“错误列表”窗口中，双击错误消息。导致错误的标识符在 `Program.cs` 源文件中用红色波浪线标出。\n\n**4.** 在代码和文本编辑器窗口中，编辑\
  \ `Main` 方法以使用全限定名 `System.Console`。`Main` 应该像这样：\n\n点击此处查看代码图像\n\n```cs\nstatic\
  \ void Main(string[] args)\n{\nSystem.Console.WriteLine(\"Hello World!\");\n}\n\
  ```\n\n![Image](img/Image00005.jpg) 注意\n\n当你在 `System` 之后输入点时，IntelliSense 会显示 `System`\
  \ 命名空间中所有项的名称。\n\n**5.** 在“生成”菜单上，点击“生成解决方案”。这次项目应该可以成功生成。如果没有，请确保 `Main` 与前面的代码中显示的完全一致，然后重试生成。\n\
  \n**6.** 点击“调试”（Debug）菜单上的“不调试启动”来运行应用程序，以确保它仍然有效。\n\n**7.** 当程序运行并在控制台窗口显示“Hello\
  \ World!”时，按回车键返回 Visual Studio 2015。\n\n## 命名空间与程序集\n\n`using` 指令简单地将命名空间中的项引入作用范围，使你无需在代码中完全限定类的名称。类被编译成`assemblies`（程序集）。\n\
  \n\n\n程序集通常是一个具有 `.dll` 文件扩展名的文件，尽管从严格来说，具有 `.exe` 文件扩展名的可执行程序也是程序集。\n\n一个程序集可以包含许多类。.NET\
  \ Framework 类库包含的类（如 `System.Console`）是在与 Visual Studio 一起安装在计算机上的程序集中提供的。你会发现 .NET\
  \ Framework 类库包含数千个类。如果它们都保存在同一个程序集中，该程序集将变得非常巨大且难以维护。（如果微软要更新某个类中的某一个方法，它将不得不向所有开发者分发整个类库！）\n\
  \n出于这个原因，.NET Framework 类库被分成多个程序集，并根据其包含的类所属的功能区域进行划分。例如一个一个核心”程序集（实际上称为 `mscorlib.dll`）包含所有常用类，如\
  \ `System.Console`，其他程序集则包含用于操作数据库、访问 Web 服务、构建 GUI 等类。如果你想使用程序集中的类，必须向你的项目添加该程序集的引用。然后你可以在代码中添加\
  \ `using` 指令将程序集中的命名空间引入作用范围。\n\n你应该注意，程序集与命名空间之间并不一定存在一一的关系：一个程序集可以包含多个命名空间的类，而一个命名空间可以跨越多个程序集。例如，`System`\
  \ 命名空间中的类和项实际上由几个程序集实现，包括 `mscorlib.dll`、`System.dll` 和 `System.Core.dll` 等。这听起来很复杂，但你很快就会习惯。\n\
  \n当你使用 Visual 创建应用程序时，选择的模板会自动包含相应的程序集。例如，在 TestHello 项目的解决方案管理器中，展开引用（References）。你会发现控制台应用程序包含了\
  \ `Microsoft.CSharp`、`System`、`System.Core`、`System.Data`、`System.Data.DataSetExtensions`、`System.Net.Http`、`System.Xml`\
  \ 和 `System.Xml.Linq` 等程序集的引用。你可能会发现列表中没有 `mscorlib.dll`。这是因为所有 .NET Framework 都使用该程序集，因为它包含了基本的运行功能。引用文件夹列出的只是可选程序集；你可以根据需要添加或删除程序集。\n\
  \n要向项目添加其他程序集的引用，请右键点击引用文件夹并点击“添加引用”——你将在后面的练习中执行此任务。你可以通过右键点击引用中的程序集并点击“删除”来移除它。\n\
  \n* * *\n\n## 创建图形应用程序\n\n到目前为止，你一直使用 Visual Studio 2015 创建并运行基本的控制台应用程序。Visual\
  \ Studio 2015 编程环境包含了创建 Windows 10 图形应用程序所需的所有内容。这些模板被称为通用 Windows 平台（UWP）应用，因为它们让你能够能够在运行\
  \ Windows 的任何设备（如桌面电脑、平板电脑和手机）上运行的应用。你可以交互地设计 Windows 应用程序的用户界面（UI）。Visual Studio\
  \ 2015 然后会生成你设计的用户界面的程序语句。\n\n\n\n\n\nVisual Studio 2015 为你提供了图形应用程序的两种视图：`设计视图`和`代码视图`。你使用代码和文本编辑器窗口来修改和维护图形应用程序的代码和程序逻辑，并使用设计视图窗口来布局你的用户界面。你可以随时在这两个视图之间切换。\n\
  \n在接下来的系列练习中，你将学习如何使用 Visual Studio 2015 创建图形应用程序。该程序将显示一个简单的表单，其中包含一个可以输入名称的文本框以及一个按钮，点击该按钮会在消息框中显示个性化的问候语。\n\
  \n*如果你想了解更多关于编写 UWP 应用程序的细节，本书第第四部分的最后几章提供了更详细的信息和指导。*\n\n## 在 Visual Studio 2015\
  \ 中创建图形应用程序\n\n1. 如果 Visual Studio 2015 尚未运行，请启动它。\n\n2. 在`文件` 菜单上，指向`新建`，然后点击`项目`。\n\
  \n打开“新建项目”对话框。\n\n3. 在左侧窗格中，展开`安装` 节点（如果尚未展开），展开`模板`，展开`Visual C#`，展开`Windows`，然后点击`通用`。\n\
  \n4. 在中间窗格中，点击`空白应用（Windows 通用）`图标。\n\n![Image](img/Image00005.jpg) 注意\n\nXAML 代表可扩展应用程序标记语言，它是通用\
  \ Windows 平台应用程序用于定义应用程序 GUI 布局的语言。随着本书中练习的进行，你将学习更多关于 XAML 的知识。\n\n5. 确保`位置`字段指向你文档文件夹中的`\\\
  Microsoft Press\\VCSBS\\Chapter 1` 文件夹。\n\n6. 在`名称`框中，输入 `Hello`。\n\n7. 确保勾选了`为解决方案创建目录`复框，然后点击`确定`。\n\
  \n如果这是你第一次创建 UWP 应用程序，系统可能会提示你启用 Windows 10 的开发者模式。根据你的设备和 Windows 10 版本，你可能可以或无法通过用户界面启用开发者模式。有关启用开发者模式的更多指导，请参阅\
  \ `https://msdn.microsoft.com/library/windows/apps/xaml/dn706236.aspx` 上的“为你的设备启用开发”。\n\
  \n![Image](img/Image00022.jpg)\n\n![Image](img/Image00005.jpg) 注意\n\n当你创建一个新的 UWP\
  \ 应用程序或第一次尝试从 Visual Studio 运行 UWP 应用程序时，可能会出现此对话框。\n\n8. 应用程序创建后，查看`解决方案管理器`窗格。\n\
  \n不要被应用程序模板的名称欺骗了——尽管它被称为“空白应用”，但此模板实际上提供了许多文件并包含一些代码。例如，如果你展开 `MainPage.xaml` 文件夹，你会发现一个名为\
  \ `MainPage.xaml.cs` 的 C# 文件。该文件就是你添加当 `MainPage.xaml` 文件定义的 UI 显示时运行的代码的地方。\n\n\
  9. 在`解决方案管理器`中，双击 `MainPage.xaml`。\n\n此文件包含 UI 的布局。设计视图窗口显示了该文件的两种表示形式：\n\n![Image](img/Image00023.jpg)\n\
  \n顶部是一个图形视图，描绘了默认情况下 5 英寸手机的屏幕。下方窗格使用 XAML 对该屏幕内容的描述。XAML 是 UWP 应用程序用于定义表单布局及其内容的类\
  \ XML 语言。如果你有 XML 知识，XAML 看起来应该很熟悉。\n\n在下一个练习中，你将使用设计视图窗口为应用程序布局 UI，并将检查由此布局生成的\
  \ XAML 代码。\n\n![Image](img/Image00013.jpg) 提示\n\n关闭输出和错误列表窗口，为显示设计视图窗口留出更多空间。\n\n\
  ![Image](img/Image00005.jpg) 注意\n\n在继续之前，有必要解释一些术语。在传统的 Windows 应用程序中，UI 由一个或多个`窗口`组成，但在通用\
  \ Windows 平台应用中，相应的项被称为`页`。为了清晰起见，我将统用术语`表单`来指代这两项。然而，我将继续使用`窗口`来表示 Visual Studio\
  \ 2015 IDE 中的项，例如设计视图窗口。\n\n在接下来的练习中，你将使用设计视图窗口为应用程序显示的表单添加三个控件。你还将检查 Visual Studio\
  \ 2015 自动生成的用于实现这些控件的一些 C# 代码。\n\n## 创建用户界面\n\n1. 点击设计视图窗口中表单左侧出现的`工具箱`选项卡。\n\n\
  工具箱出现并显示了你可以放置在表单上的各种组件和控件。\n\n2. 展开`常用 XAML 控件`部分。\n\n此部分显示了大多数图形应用程序使用的控件列表。\n\
  \n![Image](img/Image00013.jpg) 提示\n\n`所有 XAML 控件`部分显示了更广泛的控件列表。\n\n3. 在`常用 XAML\
  \ 控件`部分中，点击`TextBlock`，然后将 `TextBlock` 控件拖到设计视图窗口显示的表单上。\n\n![Image](img/Image00013.jpg)\
  \ 提示\n\n确保你选择的是 `TextBlock` 控件而不是 `TextBox` 控件。如果你不小心将错误的控件放置在表单上，可以通过点击该项然后按`Delete`\
  \ 键来轻松将其删除。\n\n表单上被添加了一个 `TextBlock` 控件（你稍后会移动它），工具箱也会随之消失。\n\n![Image](img/Image00013.jpg)\
  \ 提示\n\n如果你想让工具箱保持可见但不隐藏表单的任何部分，请点击工具箱标题栏右侧的自动隐藏按钮（它看起来像一个大钉）。工具箱将停靠在 Visual Studio\
  \ 2015 窗口的左侧，设计视图窗口将缩小以适应它。（如果你使用的是低分辨率屏幕，可能会丢失大量空间。）点击一次自动隐藏按钮会导致工具箱消失。\n\n4. 表单上的\
  \ `TextBlock` 控件可能不是你想要的位置。你可以点击并拖动已添加到表单的控件来重新定位它们。使用这种技术，移动 `TextBlock` 控件，使其位于表单的左上角。（对于此应用程序而言，确切的位置并不重要。）注意，你可能需要先点击控件以外的地方再次点击它，才能在设计视图窗口中移动它。\n\
  \n下方窗格中表单的 XAML 描述现在包含了 `TextBlock` 控件，以及一些属性，例如由 `Margin` 属性控制的表单上的位置、由 `Text`\
  \ 属性指定的默认文本、由 `HorizontalAlignment` 和 `VerticalAlignment` 属性指定的文本对齐方式，以及当文本超出控件宽度时是否换行。\n\
  \n你的 `TextBlock` XAML 代码将类似于所示（根据你在表单上放置 `TextBlock` 控件的位置，你的 `Margin` 属性值可能会略不同）：\n\
  \n点击此处查看代码图像\n\n```xml\n<TextBlock x:Name=\"textBlock\" HorizontalAlignment=\"Left\"\
  \ Margin=\"10,10,0,0\"\nTextWrapping=\"Wrap\"\nText=\"TextBlock\" VerticalAlignment=\"\
  Top\"/>\n```\n\nXAML 格和设计视图窗口之间存在双向关系。你可以编辑 XAML 格中的值，更改将反映在设计视图中。例如，你可以通过修改 `Margin`\
  \ 属性值来更改 `TextBlock` 控件的位置。\n\n5. 在`视图`菜单上，点击`属性窗口`。\n\n\n\n\n\n如果属性窗口尚未显示，它将出现在屏幕右下角，位于解决方案资源管理器（Solution\
  \ Explorer）窗格下方。你可以通过设计视图窗口下的 XAML 窗格指定控件的属性，但属性窗口为我们提供了一种更方便的方法来修改表单项以及项目中其他项的属性。\n\
  \n属性窗口具有上下文敏感性，因为它会显示当前选中项目的属性。如果你点击设计视图窗口中显示的表单（`TextBlock` 控件之外），你可以看到属性窗口显示的是\
  \ `Grid` 元素的属性。如果你查看 XAML 窗格，应该发现 `TextBlock` 控件包含在一个 `Grid` 元素中。所有表单都包含一个 `Grid`\
  \ 元素用于控制显示项目的布局；例如，你可以通过向 `Grid` 添加行和列来定义表格状布局。\n\n**6.** 在设计视图窗口中，点击 `TextBlock`\
  \ 控件。属性窗口再次显示 `TextBlock` 控件的属性。\n\n**7.** 在属性窗口中，展开 `Text` 属性。将 `FontSize` 属性更改为\
  \ `20 pt` 然后按回车键。该属性位于包含字体名称的下拉列表旁边，它将显示 Segoe UI：\n\n![Image](img/Image00024.jpg)\n\
  \n* * *\n\n![Image](img/Image00005.jpg) 注意\n\n后缀 `pt` 表示字体大小以磅（points）为单位，1 磅等于\
  \ 1/72 英寸。\n\n* * *\n\n**8.** 在设计视图窗口下 XAML 窗格中，检查定义 `TextBlock` 控件的文本。如果你滚动到行尾，你应该看到文本\
  \ `FontSize=\"26.667\"`。这是字体大小从磅到像素的近似转换（假设 3 磅大约等于 4 像素，尽管精确的转换取决于你的屏幕尺寸和分辨率）。你使用属性窗口进行的任何更改都会自动反映在\
  \ XAML 定义中，反之亦然。\n\n在 XAML 窗格中覆盖 `FontSize` 属性的值并将其更改为 `24`。设计视图窗口和属性窗口中 `TextBlock`\
  \ 控件的文本字体大小随之变化。\n\n**9.** 在属性窗口中，检查 `TextBlock` 控件的其他属性。可以尝试更改它们以观察其效果。\n\n请注意，当你更改属性值时，这些属性会被添加到\
  \ XAML 窗格中 `TextBlock` 控件的定义中。添加到表单的每个控件都有一组默认属性值，除非你更改它们，否则这些值不会显示在 XAML 窗格中。\n\
  \n**10.** 将 `TextBlock` 控件的 `Text` 属性值从 `TextBlock` 更改为 `Please enter your name`。你可以通过编辑\
  \ XAML 窗格中的 `Text` 元素或通过更改属性窗口中的值来实现（该属性位于属性窗口的 Common 部分）。\n\n请注意，设计视图窗口中 `TextBlock`\
  \ 控件中显示的文本发生了变化。\n\n**11.** 点击设计视图窗口中的表单，然后再次显示工具箱（Toolbox）。\n\n**12.** 在工具箱中，点击并拖动\
  \ `TextBox` 控件到表单上。将 `TextBox` 控件移动到表单上。\n\n![Image](img/Image00005.jpg) 注意\n\n\
  后缀 `pt` 表示字体大小以磅（points）为单位，1 磅等于 1/72 英寸。\n\n* * *\n\n**13.** 在设计视图窗口下 XAML 窗格中，检查定义\
  \ `TextBlock` 控件的文本。如果你滚动到行尾，你应该看到文本 `FontSize=\"26.667\"`。这是字体大小从磅到像素的近似转换（假设 3\
  \ 磅大约等于 4 像素，尽管精确的转换取决于你的屏幕尺寸和分辨率）。你使用属性窗口进行的任何更改都会自动反映在 XAML 定义中，反之亦然。\n\n在 XAML\
  \ 窗格中覆盖 `FontSize` 属性的值并将其更改为 `24`。设计视图窗口和属性窗口中 `TextBlock` 控件的文本字体大小随之变化。\n\n**14.**\
  \ 在属性窗口中，检查 `TextBlock` 控件的其他属性。可以尝试更改它们以观察其效果。\n\n请注意，当你更改属性值时，这些属性会被添加到 XAML 窗格中\
  \ `TextBlock` 控件的定义中。添加到表单的每个控件都有一组默认属性值，除非你更改它们，否则这些值不会显示在 XAML 窗格中。\n\n**15.**\
  \ 将 `TextBlock` 控件的 `Text` 属性值从 `TextBlock` 更改为 `Please enter your name`。你可以通过编辑\
