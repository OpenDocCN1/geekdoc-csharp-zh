  \ Name` 框中输入内容：`tcp:<servername>.database.windows.net,1433,`，其中 `<servername>` 是你在上一个练习中创建的\
  \ Azure SQL 服务器的唯一名称。点击 `Use SQL Server Authentication` 并输入你在上一个练习中指定的管理员登录名称和密码。在\
