  **7.** [源文件中文本缺失或不完整]\n\n### 总结\n\n在本章中，你学习了如何使用迭代器实现 `IEnumerable<TItem>` 和 `IEnumerator`。你还学习了如何使用委托来实现事件。\n\
  \n## 解耦逻辑和处理事件\n\n完成本章后，你将能够：\n\n-   声明委托类型以指定方法签名。\n-   创建委托实例以引用方法。\n-   通过委托调用方法。\n\
  -   定义 lambda 表达式以指定要执行的代码。\n-   声明事件字段。\n-   使用委托处理事件。\n-   触发事件。\n\n书中的许多示例和练习都非常强调封装。通过这种方式，方法的实现可以发生变化，而不影响使用它们的应用程序。然而，有时无法或不希望封装一个类型的全部功能。例如，方法的逻辑可能取决于调用它的是哪个应用程序或组件。当你构建此类类时，你可能不知道哪些应用程序将使用它，因此你需要避免在代码中引入可能会限制该类使用的依赖关系。委托提供了理想的解决方案，使你能够将方法中的应用程序逻辑与调用它的应用程序完全解耦。\n\
  \nC# 中的事件支持相关的场景。你在书中练习中编写的大部分代码假设语句是顺序执行的。虽然这是最常见的情况，但你会发现，有时需要中断当前的执行流以执行另一个更重要的任务。当该任务完成后，程序可以从之前中断的地方继续执行。这种风格程序的经典示例是你在涉及图形应用程序练习中使用的通用\
  \ Windows 平台 (UWP) 表单。表单显示如按钮和文本框之类的控件。当你点击按钮或在文本框中输入文本时，你期望表单立即做出响应。应用程序必须临时停止正在操作并处理你的输入。这种操作风格不仅适用于图形用户界面\
  \ (GUI)，还适用于任何必须紧急执行操作的应用程序——例如关闭核电厂的反应堆。为了处理这种类型的处理，运行时必须提供两点：一种指示紧急情况发生的机制，以及一种指定在紧急事件发生时运行代码的方法。事件与委托配合，提供了你实现系统的基础设施。\n\
  \n### 理解委托\n\n委托是方法的引用。这是一个非常简单的概念，但具有极其强大的影响。让我解释一下。\n\n委托之所以命名为委托，是因为它们在被调用时会将处理过程“委托”给所引的方法。\n\
  \n\n\n\n通常，当你编写一个调用方法的语句时，你会指定方法的名称（并可能指定该方法所属的对象或结构）。从你的代码中，可以清楚地看到你正在运行哪一个方法以及何时运行它。请看下面这个简单的示例，它调用了\
  \ `Processor` 对象的 `performCalculation` 方法（该方法的具体功能或 `Processor` 类如何定义对于本文讨论并不重要）：\n\
  \n点击此处查看代码图片\n\n```text\nProcessor p = new Processor();\n\np.performCalculation();\n\
  ```\n\n`delegate`（委托）是一个引用方法的对象。你可以以非常类似于将 `int` 值赋值给 `int` 变量的方式，将方法的引用赋值给委托。接接的示例创建了一个名为\
  \ `performCalculationDelegate` 的委托，它引用了 `Processor` 对象的 `performCalculation` 方法。我刻意省略了声明该委托的语句中的某些元素，因为理解这一概念比担心语法更重要（你稍后就会看到完整的语法）。\n\
  \n点击此处查看代码图片\n\n```text\nProcessor p = new Processor();\n\ndelegate ... performCalculationDelegate\
  \ ...;\n\nperformCalculationDelegate = p.performCalculation;\n```\n\n请记住，将方法引用赋值给委托的语句并不会在此时运行该方法；方法名后没有括号，你不需要指定任何参数（如果该方法接收参数的话）。这仅仅是一个赋值语句。\n\
  \n在委托中存储了 `Processor` 对象的 `performCalculation` 方法引用后，应用程序随后可以通过该委托调用该方法，如下：\n\n\
  ```text\nperformCalculationDelegate();\n```\n\n这看起来像是一个普通的方法调用；如果你不知道真相，看起来看起来你可能实际上在运行一个名为\
  \ `performCalculationDelegate` 的方法。然而，公共语言运行时（CLR）知道这是一个委托，因此它会检索委托所引用的方法并运行它。稍后，你可以更改委托引用的方法，因此调用委托的语句在每次执行时实际上可能会运行不同的方法。此外，一个委托可以同时引用多个方法（将其看作是方法引用的集合），当你调用该委托时，它所引用的所有方法都会运行。\n\
  \n***\n\n![Image](img/Image00005.jpg) 注意\n\n如果你熟悉 C++，那么委托类似于函数指针。然而，与函数指针不同，委托是完全类型安全的。你可以让委托仅引用与委托签名匹配的方法，而且你不能调用未引用有效方法的委托。\n\
  \n***\n\n### .NET Framework 类库中的委托示例\n\nMicrosoft .NET Framework 类库在许多类型中广泛地使用了委托，其中两个示例在第\
  \ 18 章 的“使用集合”中：`List<T>` 类的 `Find` 方法和 `Exists` 方法。如果你还记得，这些方法会搜索 `List<T>` 集合，要么返回匹配的项，要么测试匹配项是否存在。当\
  \ `List<T>` 类的设计人员实现它时，他们完全不知道在你的应用程序代码中什么才算作匹配，因此他们让你通过以谓词（predicate）的形式提供自己的代码来定义它。谓词实际上只是一个恰好返回布尔（Boolean）值的委托。\n\
  \n以下代码应该帮助你回想起如何使用 `Find` 方法：\n\n点击此处查看代码图片\n\n```text\nstruct Person\n{\n    public\
  \ int ID { get; set; }\n    public string Name { get; set; }\n    public int Age\
  \ { get; set; }\n}\n\n...\n\nList<Person> personnel = new List<Person>()\n{\n  \
  \  new Person() { ID = 1, Name = \"John\", Age = 47 },\n    new Person() { ID =\
  \ 2, Name = \"Sid\", Age = 28 },\n    new Person() { ID = 3, Name = \"Fred\", Age\
  \ = 34 },\n    new Person() { ID = 4, Name = \"Paul\", Age = 22 },\n};\n\n...\n\n\
  // 查找列表中 ID 为 3 的成员\nPerson match = personnel.Find(p => p.ID == 3);\n```\n\n由 `List<T>`\
  \ 类暴露的其他使用委托执行操作的方法示例还有 `Average`、`Max`、`Min`、`Count` 和 `Sum`。这些方法接受一个 `Func` 委托作为参数。`Func`\
  \ 委托引用一个返回数值的方法（函数）。在下面的示例中，使用 `Average` 方法计算人员集合中项的平均年龄（`Func<T>` 委托只需返回集合中每个项的\
  \ `Age` 字段的值），使用 `Max` 方法确定 ID 最大的项，使用 `Count` 方法计算年龄在 30 到 39 之间（包含）的项目有多少。\n\n\
  点击此处查看代码图片\n\n```text\ndouble averageAge = personnel.Average(p => p.Age);\nConsole.WriteLine($\"\
  Average age is {averageAge}\");\n\n...\n\nint id = personnel.Max(p => p.ID);\nConsole.WriteLine($\"\
  Person with highest ID is {id}\");\n\n...\n\nint thirties = personnel.Count(p =>\
  \ p.Age >= 30 && p.Age <= 39);\nConsole.WriteLine($\"Number of personnel in their\
  \ is {thirties}\");\n```\n\n此代码产生了以下输出：\n\n点击此处查看代码图片\n\n```text\nAverage age is\
  \ 32.75\nPerson with highest ID is 4\nNumber of personnel in their is 1\n```\n\n\
  在上面的示例中，`Count` 方法期望的委托类型是 `Func<Person, int>`。\n\n在本书剩余部分，你会遇到许多 .NET Framework\
  \ 类库使用的委托。你也可以定义自己的委托。\n\n***\n\n### `Func<T, ...>` 和 `Action<T, ...>` 委托类型\n\n\
  `List<T>` 类 `Average`、`Max`、`Count` 方法接受的参数实际上是一个泛型 `Func<T, TResult>` 委托；类型参数引用传递给委托的类型以及返回值的类型。对于文中所示\
  \ `List<Person>` 的 `Average`、`Max` 和 `Count` 方法，第一个类型参数 `T` 是数据的类型（`Person` 结构体），而\
  \ `TResult` 类型参数由使用委托的上下文决定。在下面的示例中，`TResult` 的类型是 `int`，因为 `Count` 方法返回的值应该是整数：\n\
  \n点击此处查看代码图片\n\n```text\nint thirties = personnel.Count(p => p.Age >= 30 && p.Age\
  \ <= 39);\n```\n\n因此，在这个示例中，`Count` 方法期望的委托类型是 `Func<Person, int>`。\n\n这一点可能看起来有些学术化，因为编译器根据\
  \ `List<T>` 的类型自动生成委托，但熟悉这种用法是有价值，因为它在 .NET Framework 类库中反复出现。事实上，`System` 命名空间定义了一整族\
  \ `Func` 委托类型，从不接受任何参数就返回结果的 `Func<TResult>`，到接受 16 个参数的 `Func<T1, T2, T3, T4, ...,\
  \ T16, TResult>`。如果你发现自己需要创建一个符合此模式的自定义委托类型，你应该考虑使用适当的 `Func` 委托类型。你将在第 21 章中再次遇到\
  \ `Func` 委托类型。\n\n\n\n\n除了 `Func` 之外，`System` 命名空间还定义了一系列 `Action` 委托类型。`Action`\
  \ 委托用于引用执行操作而不返回值的方法（即 `void` 方法）。同样，有一系列 `Action` 委托类型可用，其范围从 `Action<T>`（指定一个接收单个参数的委托）到\
  \ `Action<T1, T2, T3, T4, ..., T16>`。\n\n***\n\n### 自动化工厂场景\n\n假设你正在为一个自动化工厂编写控制系统。该工厂包含许多不同的机器，每台机器在工厂制造的产品生产过程中执行不同的任务——成型和折叠金属板、将金属板焊接在一起、给金属板喷漆等。每台机器都是由一家专门的供应商制造并安装的。所有机器都由计算机控制，每个供应商都提供了一组函数，你可以使用这些函数来控制其机器。你的任务是将机器使用的不同系统集成到一个单一控制程序中。你决定关注的一个方面是提供一种关闭所有机器的方法——如果需要，要快快！\n\
  \n每台机器都有自己独特的、计算机控制的进程（和函数）用于安全关闭，总结如下：\n\n点击此处查看代码图像\n\n```cs\nStopFolding(); //\
  \ 折叠和成型机\nFinishWelding(); // 焊接机\nPaintOff(); // 喷漆机\n```\n\n### 不使用委托实现工厂控制系统\n\
  \n在控制程序中实现关闭功能的简单方法如下：\n\n点击此处查看代码图像\n\n```cs\nclass Controller\n{\n    // 表示不同机器的字段\n\
  \    private FoldingMachine folder;\n    private WeldingMachine welder;\n    private\
  \ PaintingMachine painter;\n    ...\n\n    public void ShutDown()\n    {\n     \
  \   folder.StopFolding();\n        welder.FinishWelding();\n        painter.PaintOff();\n\
  \    }\n    ...\n}\n```\n\n尽管这种方法有效，但它并不具有很强的扩展性或灵活性。如果工厂购买了一台新机器，你必须修改这段代码；`Controller`\
  \ 类和管理机器的代码是紧耦合的。\n\n### 使用委托实现工厂\n\n虽然每个方法的名称不同，但它们具有相同的“形状”：它们不接收参数，并且不返回值。（稍后我们会考虑如果情况不是这样会发生什么，请稍等。）因此，每个方法的通用格式如下：\n\
  \n`void methodName();`\n\n这就是委托大显身场。你可以使用与此形状匹配的委托来引用任何机器的关闭方法。你可以像这样声明委托：\n\n点击此处查看代码图像\n\
  \n```cs\ndelegate void stopMachineryDelegate();\n```\n\n注意以下几点：\n\n![图像](img/Image00001.jpg)\
  \ 你使用了 `delegate` 关键字。\n\n![图像](img/Image00001.jpg) 你指定了返回类型（此例中为 `void`）、委托的名称（`stopMachineryDelegate`）以及任何参数（在这种情况下没有）。\n\
  \n声明委托后，你可以创建一个实例并使用 `+=` 复合赋值运算符使其引用匹配的方法。你可以像这样在控制器的类的构造函数中这样做：\n\n点击此处查看代码图像\n\
  \n```cs\nclass Controller\n{\n    delegate void stopMachineryDelegate(); // 委托类型\n\
  \    private stopMachineryDelegate stopMachinery; // 委托的实例\n    ...\n\n    public\
  \ Controller()\n    {\n        this.stopMachinery += folder.StopFolding;\n    }\n\
  \    ...\n}\n```\n\n习惯这种语法需要一点研究。你将方法“添加”到委托中——记住，在此时你并没有真正调用该方法。`+` 运算符在与委托一起使用时被重载，以具有这种新含义。（你将在第\
  \ 22 章中学习更多关于运算符重载的内容，“运算符重载](#text00029.html_ch22)。”）注意，你只需指定方法名，而不包含任何括号或参数。\n\
  \n在未初始化的委托上使用 `+=` 运算符是安全的。它将被自动初始化。或者，你可以使用 `new` 关键字使用单个特定方法显式地初始化委托，如下：\n\n点击此处查看代码图像\n\
  \n```cs\nthis.stopMachinery = new stopMachineryDelegate(folder.StopFolding);\n```\n\
  \n你可以通过调用委托来调用该方法，如下：\n\n```cs\npublic void ShutDown()\n{\n    this.stopMachinery();\n\
  \    ...\n}\n```\n\n调用委托的语法与你调用方法的方法相同。如果委托引用的方法接收任何参数，你应该在此时的括号之间指定它们。\n\n***\n\
  \n![图像](img/Image00005.jpg) 注意\n\n如果你尝试调用一个未初始化且未引用任何方法的委托，你将得到一个 `NullReferenceException`\
  \ 异常。\n\n***\n\n使用委托的一个重要优势是它可以同时引用多个方法。你只需要使用 `+=` 运算符将方法添加到委托中，如下：\n\n点击此处查看代码图像\n\
  \n```cs\npublic Controller()\n{\n    this.stopMachinery += folder.StopFolding;\n\
  \    this.stopMachinery += welder.FinishWelding;\n    this.stopMachinery += painter.PaintOff;\n\
  }\n```\n\n在类的 `Shutdown` 方法中调用 `this.stopMachinery()` 会自动调用每个方法。`Shutdown` 方法不需要知道有多少台机器或方法是什么。\n\
  \n你可以使用 `-=` 运算符从委托中移除方法，如下：\n\n点击此处查看代码图像\n\n```cs\nthis.stopMachinery -= folder.StopFolding;\n\
  ```\n\n当前的方案在 `Controller` 构造函数中将方法添加到委托。为了让 `Controller` 类完全独立于机器，你需要将 `stopMachinery`\
  \ 类型公开。你有几种选择：\n\n![图像](img/Image00001.jpg) 将 `stopMachinery` 委托公开：\n\n点击此处查看代码图像\n\
  \n```cs\npublic stopMachineryDelegate stopMachinery;\n```\n\n![图像](img/Image00001.jpg)\
  \ 将 `stopMachinery` 委托设为私有，但创建一个属性来访问它：\n\n点击此处查看代码图像\n\n```cs\nprivate stopMachineryDelegate\
  \ stopMachinery;\n...\n\npublic stopMachineryDelegate StopMachinery\n{\n    get\n\
  \    {\n        return this.stopMachinery;\n    }\n    set\n    {\n        this.stopMachinery\
  \ = value;\n    }\n}\n```\n\n![图像](img/Image00001.jpg) 通过实现单独 `Add` 和 `Remove` 方法提供完全封装。`Add`\
  \ 方法接收方法作为参数并将其添加到委托，而 `Remove` 方法从委托中移除指定的方法（注意你通过使用 `stopMachineryDelegate` 类型指定方法作为参数）：\n\
  \n点击此处查看代码图像\n\n```cs\npublic void Add(stopMachineryDelegate stopMethod)\n{\n  \
  \  this.stopMachinery += stopMethod;\n}\n\npublic void Remove(stopMachineryDelegate\
  \ stopMethod)\n{\n    this.stopMachinery -= stopMethod;\n}\n```\n\n面向对象的纯主义者可能会选择\
  \ `Add`/`Remove` 方法。然而，其他方法也是经常常用的替代方案，这就是为什么在这里展示它们的原因。\n\n无论你选择哪种技术，都应该从 `Controller`\
  \ 构造函数中移除将机器方法添加到委托的代码。然后你可以这样实例化 `Controller` 和代表其他机器的对象（此示例使用了 `Add`/`Remove`\
  \ 方法）：\n\n点击此处查看代码图像\n\n```cs\nController control = new Controller();\nFoldingMachine\
  \ folder = new FoldingMachine();\nWeldingMachine welder = new WeldingMachine();\n\
  ```\n\n\n\n\n\n```cs\nPaintingMachine painter = new PaintingMachine();\n\n...\n\n\
  control.Add(folder.StopFolding);\n\ncontrol.Add(welder.FinishWelding);\n\ncontrol.Add(painter.PaintOff);\n\
  \n...\n\ncontrol.ShutDown();\n\n...\n```\n\n### 声明和使用委托\n\n在接下来的练习中，你将完成一个作为 Wide\
  \ World Importers 公司系统部分的应用程序。Wide World Importers 进口并销售建筑材料和工具，你将处理的应用程序让客户能够浏览\
  \ Wide World Importers 当前的库存物品，并为这些物品下单。该应用程序包含一个显示当前可用商品的表单，以及一个列出客户已选项目的窗格。当客户想要下单时，可以点击表单上的“结账”（Checkout）按钮。随后将处理订单，窗格将被清空。\n\
  \n目前，当客户下单时，会发生几项操作：\n\n![Image](img/Image00001.jpg) 向客户请求付款。\n\n![Image](img/Image00001.jpg)\
  \ 检查订单中的物品，如果其中任何物品受年龄限制（例如电动工具），则对订单详情进行审计和跟踪。\n\n![Image](img/Image00001.jpg)\
  \ 为出运目的生成发货单。该发货单包含订单的摘要。\n\n审计和发货过程的逻辑与结账逻辑是独立的，尽管这些过程发生的顺序并不重要。此外，随着未来业务状况或监管要求的变化，这些元素中的任何一个都可能被修改，并且结账操作可能需要额外的处理。因此，将付款和结账逻辑与审计及发货过程解耦是理想的，这样可以更容易维护和升级。你将开始检查应用程序，查看它目前是如何未能实现这一目标的。然后，你将修改应用程序的结构，消除结账逻辑与审计及发货逻辑之间的依赖。\n\
  \n#### 检查 Wide World Importers 应用程序\n\n**1.** 如果 Microsoft Visual Studio 2015 运行，请启动它。\n\
  \n**2.** 打开 `Delegates` 项目，它位于文档文件夹中的 `\\Microsoft Press\\VCSBS\\Chapter 20\\Delegates`\
  \ 文件夹中。\n\n**3.** 在“调试”（Debug）菜单上，点击“开始调试”（Start Debugging）。\n\n项目编译并运行。出现一个表单，显示可用物品，以及一个显示订单详情的面板（初始为空）。应用程序在\
  \ `GridView` 控件中显示物品，该控件水平滚动：\n\n![Image](img/Image00134.jpg)\n\n**4.** 选择一个或多个项目，然后点击“添加”（Add）将它们加入购物车。确保你至少选择了一个受年龄限制的物品。\n\
  \n当你添加物品时，它会出现在右侧的“订单详情”（Order Details）窗格中。请注意，如果你多次添加同一个物品，每次点击数量都会递增。（此版本的应用程序未实现从购物车中移除物品的功能。）\n\
  \n**5.** 在“订单详情”窗格中，点击“结账”（Checkout）。\n\n出现一条消息表示订单已提交。订单被赋予了一个唯一的 ID，该 ID 将与订单金额一起显示。\n\
  \n**6.** 点击“关闭”（Close）关闭消息，然后返回 Visual Studio 2015 环境并停止调试。\n\n**7.** 在“解决方案资源管理器”（Solution\
  \ Explorer）中，展开 `Delegates` 项目节点，然后打开 `Package.appxmanifest` 文件。\n\n程序包清单编辑器出现。\n\
  \n**8.** 在程序包清单编辑器中，点击“打包”（Packaging）选项卡。\n\n注意“包名称”（Package Name）字段中的值。它采用全局唯一标识符（GUID）的形式。\n\
