  \n### 快速参考\n\n![Image](img/Image00125.jpg)![Image](img/Image00126.jpg)\n\n## 第 18\
  \ 章 使用集合\n\n完成本章后，你将能够：\n\n![Image](img/Image00001.jpg) 解释 .NET Framework 提供的不同集合类实现的功能。\n\
  \n![Image](img/Image00001.jpg) 创建类型安全的集合。\n\n![Image](img/Image00001.jpg) 用一组数据填充集合。\n\
  \n![Image](img/Image00001.jpg) 操作并访问集合中持有的数据项。\n\n![Image](img/Image00001.jpg) 使用谓词在列表型集合中搜索匹配项。\n\
  \n第 10 章，“使用数组”引入了用于存储数据集的数组。数组在这方面非常有用，但它们也有自己的局限性。数组提供的功能有限；例如，增加或减少数组的大小很容易，排序数组中持有的数据并不简单。此外，数组只提供了一种访问数据的方法——使用整数索引。如果你的应用程序需要使用其他机制存储和检索数据（例如第\
  \ 17 章中提到的集合类，它们位于 `System.Collections.Generic` 命名空间。\n\n正如命名空间所示，这些集合是泛型类型；它们都要求提供一个类型参数，指示应用程序将在其中存储的数据类型。每个集合类都针对特定的数据存储和访问形式进行了优化，每个类都提供了支持此功能的特殊方法。例如，`Stack<T>`\
  \ 类实现了后入先出模型，使用 `Push` 方法将元素添加到栈顶，使用 `Pop` 方法从栈顶取出元素。`Pop` 方法始终检索最近推送的元素并从栈中移除。相比之下，`Queue<T>`\
  \ 类型提供了第 17 章描述的 `Enqueue` 和 `Dequeue` 方法。`Enqueue` 方法将元素添加到队列，而 `Dequeue` 方法按相同顺序从队列中检索元素，实现了先入先出模型。还有许多其他集合类，下表提供了最常用类的总结。\n\
  \n![Image](img/Image00127.jpg)\n\n接下来的章节提供了这些集合类的简要概述。有关每个类的更多信息，请参阅 .NET Framework\
  \ 类库文档。\n\n\n\n\n.NET Framework 类库还通过 `System.Collections` 命名空间提供了另一组集合类型。这些是非泛型集合，它们是在\
  \ C# 支持泛型类型之前设计的（泛型是在为 .NET Framework 2.0 版本开发的 C# 版本中引入的）。除其中一个类型外，这些类型都存储对象引用，因此在存储和检索项时，你需要执行适当的类型转换。包含这些类是为了与现有应用程序向后兼容，不建议在构建新解决方案时使用它们。事实上，如果你正在构建通用\
  \ Windows 平台 (UWP) 应用，无法使用这些类。\n\n唯一不存储对象引用的类是 `BitArray` 类。该类通过 `int` 实现了一个紧凑的布尔值数组；每个位表示真\
  \ (1) 或假 (0)。如果这听起来很熟悉，那是应该是；这与你在第 16 章 中的示例以及“使用索引器器”中看到的 `IntBits` 结构体非常相似。`BitArray`\
  \ 类适用于 UWP 应用。\n\n还有另一组重要的集合 set 可用，这些类定义在 `System.Collections.Concurrent` 命名空间中。这些是线程安全的集合类，可以在构建多线程应用程序时使用。第\
  \ 24 章“通过执行异步操作提高响应时间”提供了关于这些类的更多信息。\n\n***\n\n### `List<T>` 集合类\n\n泛型 `List<T>`\
  \ 类是集合类中最简单的。你可以像使用数组一样使用它——你可以使用普通的数组符号（方括号和元素索引）来引用 `List<T>` 集合中的现有元素，尽管你不能使用数组符号来添加新元素。然而，通常情况下，`List<T>`\
  \ 类比数组提供了更大的活性，并旨在克服数组表现出的以下限制：\n\n![Image](img/Image00001.jpg) 如果你想调整数组的大小，必须创建一个新数组，复制元素（如果新数组较小，则跳过某些元素），然后更新指向原始数组的所有引用，使其指向新数组。\n\
  \n![Image](img/Image00001.jpg) 如果你想从数组中删除一个元素，必须将所有后续元素向上移动一个位置。即使这样做也不完全可行，因为你最终会两个最后一个元素的副本。\n\
  \n![Image](img/Image00001.jpg) 如果你想向数组中插入一个元素，必须将元素向下移动一个位置以留出空位。然而，你会丢失数组的最后一个元素！\n\
  \n`List<T>` 集合类提供了以下功能以避免这些限制：\n\n![Image](img/Image00001.jpg) 创建 `List<T>` 集合时不需要指定其容量；它可以随着元素的添加而增长和收缩。这种动态行为带有一定的开销，如果有必要，你可以指定初始大小。但是，如果超过了这个大小，`List<T>`\
  \ 集合将根据需要自动增长。\n\n![Image](img/Image00001.jpg) 你可以使用 `Remove` 方法从 `List<T>` 集合中删除指定的元素。`List<T>`\
  \ 集合会自动重新排列元素并填补隙。你还可以使用 `RemoveAt` 方法删除 `List<T>` 集合中指定位置的项。\n\n![Image](img/Image00001.jpg)\
  \ 你可以使用 `Add` 方法向 `List<T>` 集合的末尾添加元素。你提供要添加的元素。`List<T>` 集合会自动调整大小。\n\n![Image](img/Image00001.jpg)\
  \ 你可以使用 `Insert` 方法向 `List<T>` 集合的中间插入元素。同样，`List<T>` 集合会自动调整大小。\n\n![Image](img/Image00001.jpg)\
  \ 你可以通过调用 `Sort` 方法轻松地对 `List<T>` 对象中的数据排序。\n\n***\n\n![Image](img/Image00005.jpg)\
  \ 注意\n\n与数组一样，如果你使用 `foreach` 遍历 `List<T>` 集合，则不能使用迭代变量来修改集合的内容。此外，你不能在遍历 `List<T>`\
  \ 集合的 `foreach` 循环中调用 `Remove`、`Add` 或 `Insert` 方法；任何此类尝试都会导致 `InvalidOperationException`\
  \ 异常。\n\n***\n\n以下示例展示了你如何创建、操作和遍历 `List<int>` 集合的内容：\n\n点击此处查看代码图像\n\n```csharp\n\
  using System;\n\nusing System.Collections.Generic;\n\n...\n\nList<int> numbers =\
  \ new List<int>();\n\n// 使用 Add 方法填充 List<int>\nforeach (int number in new int[12]{10,\
  \ 9, 8, 7, 7, 6, 5, 10, 4, 3, 2, 1})\n{\n    numbers.Add(number);\n}\n\n// 在列表倒数第二个位置插入一个元素，并将最后一个项向上移动\n\
  numbers.Insert(numbers.Count - 1, 99);\n\n// 删除现在为 7 的元素\nnumbers.RemoveAt(7);\n\
  \n// 删除为 6 的元素\nnumbers.Remove(6);\n\n// 使用 for 语句遍历相同的元素\nfor (int i = 0; i < numbers.Count;\
  \ i++)\n{\n    int number = numbers[i];\n    Console.WriteLine(number);\n}\n\n//\
  \ 使用 foreach 语句遍历\nforeach (int number in numbers)\n{\n    Console.WriteLine(number);\n\
  }\n```\n\n***\n\n![Image](img/Image00005.jpg) 注意\n\n确定 `List<T>` 集合元素数量的方法与查询数组中项的数量不同。在使用\
  \ `List<T>` 集合时，你检查 `Count` 属性；当使用数组时，你检查 `Length` 属性。\n\n***\n\n### `LinkedList<T>`\
  \ 集合类\n\n`LinkedList<T>` 集合类实现了双向链表。列表中的每个项都持有该项的值，以及指向列表中下一个项的引用（`Next` 属性）和上一个项的引用（`Previous`\
  \ 属性）。列表开头的项其 `Previous` 属性为 `null`，列表末尾的项其 `Next` 属性为 `null`。\n\n与 `List<T>` 类不同，`LinkedList<T>`\
  \ 不支持使用数组符号插入或检查元素。相反，你可以使用 `AddFirst` 方法在列表开头插入元素，将先的第一个项向上移动并将其 `Previous` 属性指向新项。同样，你可以使用\
  \ `AddLast` 方法在列表末尾插入元素，将之前最后一个项的 `Next` 属性指向新项。你还可以使用 `AddBefore` 和 `AddAfter`\
  \ 方法在列表中指定项之前或之后插入元素（你必须先获取该项）。\n\n你可以通过查询 `First` 属性找到 `LinkedList<T>` 集合中的第一个项，而\
  \ `Last` 属性返回列表最后一个项的引用。要遍历链表，你可以从一端开始，通过 `Next` 或 `Previous` 引用进行移动，直到找到该属性值为 `null`\
  \ 的项。或者，你可以使用 `foreach` 语句，它会正向遍历 `LinkedList<T>` 对象并在结束时自动停止。\n\n使用 `Remove`、`RemoveFirst`\
  \ 和 `RemoveLast` 方法从 `LinkedList<T>` 集合中删除项。\n\n\n\n\n\n以下示例展示了 `LinkedList<T>`\
  \ 集合的用法。注意使用 `for` 语句遍历列表的代码是如何通过 `Next`（或 `Previous`）引用进行移动的，只有在到达 `null` 引用（即列表末尾）时才会停止：\n\
  \n点击此处查看代码图像\n\n```csharp\nusing System;\nusing System.Collections.Generic;\n...\n\
  \nLinkedList<int> numbers = new LinkedList<int>();\n\n// 使用 AddFirst 方法填充 List<int>\n\
  foreach (int number in new int[] { 10, 8, 6, 4, 2 })\n{\n    numbers.AddFirst(number);\n\
  }\n\n// 使用 for 语句迭代\nConsole.WriteLine(\"Iterating using a for statement:\");\n\
  for (LinkedListNode<int> node = numbers.First; node != null; node = node.Next)\n\
  {\n    int number = node.Value;\n    Console.WriteLine(number);\n}\n\n// 使用 foreach\
  \ 语句迭代\nConsole.WriteLine(\"\\nIterating using a foreach statement:\");\nforeach\
  \ (int number in numbers)\n{\n    Console.WriteLine(number);\n}\n\n// 反向迭代\nConsole.WriteLine(\"\
  \\nIterating list in reverse order:\");\nfor (LinkedListNode<int> node = numbers.Last;\
  \ node != null; node = node.Previous)\n{\n    int number = node.Value;\n    Console.WriteLine(number);\n\
  }\n```\n\n这是该代码生成的输出结果：\n\n点击此处查看代码图像\n\n```\nIterating using a for statement:\n\
  2\n4\n6\n8\n10\nIterating using a foreach statement:\n2\n4\n6\n8\n10\nIterating\
  \ list in reverse order:\n10\n8\n6\n4\n2\n```\n\n### `Queue<T>` 集合类\n\n`Queue<T>`\
  \ 类实现了先进先出（FIFO）机制。元素在队列末尾插入（`Enqueue` 操作），并从队列头部被移除（`Dequeue` 操作）。\n\n以下代码是 `Queue<int>`\
  \ 集合及其常用操作的示例：\n\n点击此处查看代码图像\n\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
  ...\n\nQueue<int> numbers = new Queue<int>();\n\n// 填充队列\nConsole.WriteLine(\"Populating\
  \ the queue:\");\nforeach (int number in new int[4]{9, 3, 7, 2})\n{\n    numbers.Enqueue(number);\n\
  \    Console.WriteLine($\"{number} has joined the queue\");\n}\n\n// 遍历队列\nConsole.WriteLine(\"\
  \\nThe queue contains the following items:\");\nforeach (int number in numbers)\n\
  {\n    Console.WriteLine(number);\n}\n\n// 清空队列\nConsole.WriteLine(\"\\nDraining\
  \ the queue:\");\nwhile (numbers.Count > 0)\n{\n    int number = numbers.Dequeue();\n\
  \    Console.WriteLine($\"{number} has left the queue\");\n}\n```\n\n这是该代码的输出：\n\
  \n点击此处查看代码图像\n\n```\nPopulating the queue:\n9 has joined the queue\n3 has joined\
  \ the queue\n7 has joined the queue\n2 has joined the queue\nThe queue contains\
  \ the following items:\n9\n3\n7\n2\nDraining the queue:\n9 has left the queue\n\
  3 has left the queue\n7 has left the queue\n2 has left the queue\n```\n\n### `Stack<T>`\
  \ 集合类\n\n`Stack<T>` 类实现了后进先出（LIFO）机制。元素在栈顶加入栈（push 操作），并从栈顶离开栈（pop 操作）。为了直观理解这一点，可以想象一叠盘子：新盘子添加到顶部，盘子从顶部移除，使得最后一个放置在栈上的盘子是第一个被移除的盘子。（底部的盘子很少使用，而且在上面放置任何食物之前，不可避免地需要清洗——因为会有污垢！）这是一个示例——注意\
  \ `foreach` 循环列出项目的顺序：\n\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
  ...\n\nStack<int> numbers = new Stack<int>();\n\n// 填充栈\nConsole.WriteLine(\"Pushing\
  \ items onto the stack:\");\nforeach (int number in new int[4]{9, 3, 7, 2})\n{\n\
  \    numbers.Push(number);\n    Console.WriteLine($\"{number} has been pushed on\
  \ the stack\");\n}\n\n// 遍历栈\nConsole.WriteLine(\"\\nThe stack now contains:\");\n\
  foreach (int number in numbers)\n{\n    Console.WriteLine(number);\n}\n\n// 清空栈\n\
  Console.WriteLine(\"\\nPopping items from the stack:\");\nwhile (numbers.Count >\
  \ 0)\n{\n    int number = numbers.Pop();\n    Console.WriteLine($\"{number} has\
  \ been popped off the stack\");\n}\n```\n\n这是该程序的输出：\n\n点击此处查看代码图像\n\n```\nPushing\
  \ items onto the stack:\n9 has been pushed on the stack\n3 has been pushed on the\
  \ stack\n7 has been pushed on the stack\n2 has been pushed on the stack\nThe stack\
  \ now contains:\n2\n7\n3\n9\nPopping items from the stack:\n9\n3\n7\n2\n```\n\n\
  ### `Dictionary<TKey, TValue>` 集合类\n\n`Dictionary<TKey, TValue>` 类提供了一种将整数到元素的方法。在其他语言中，这被称为关联数组。`Dictionary<TKey,\
  \ TValue>` 类通过内部维护两个数组（一个用于键，一个用于值）来实现`Dictionary<TKey, TValue>` 集合具有以下 set：\n\n\
  1. `Dictionary<TKey, TValue>` 集合不能包含重复键。如果你调用 `Add` 方法添加已存在的键，将抛出异常。然而，你可以使用括号符号添加键值对，即使键已存在，值也会被覆盖。\n\
  2. 你可以使用 `ContainsKey` 方法测试 `Dictionary<TKey, TValue>` 集合是否包含特定键。\n3. 在内部，`Dictionary<TKey,\
  \ TValue>` 集合是一种稀疏数据结构，当有足够的内存可用时运行效率最高。`Dictionary<TKey, TValue>` 集合的大小会随着插入元素而迅速增长。\n\
  4. 当你使用 `foreach` 语句遍历 `Dictionary<TKey, TValue>` 集合时，你会得到一个 `KeyValuePair<TKey,\
  \ TValue>` 。这是一个包含集合项键和值拷贝的结构，你可以通过 `Key` 属性和 `Value` 属性访问每个元素。这些元素是只读的；你不能它们修改\
  \ `Dictionary<TKey, TValue>` 集合的数据。\n\n这是一个示例，将家庭成员的年龄与其姓名关联，然后打印这些信息：\n\n点击此处查看代码图像\n\
  \n```csharp\nusing System;\nusing System.Collections.Generic;\n...\n\nDictionary<string,\
  \ int> ages = new Dictionary<string, int>();\n\n// 填充 Dictionary\nages.Add(\"John\"\
  , 51); // 使用 Add 方法\nages.Add(\"Diana\", 50);\nages[\"James\"] = 23; // 使用数组符号\n\
  ages[\"Francesca\"] = 21;\n\n// 使用 foreach 语句迭代\n// 迭代器生成 KeyValuePair\nConsole.WriteLine(\"\
  The Dictionary contains:\");\nforeach (KeyValuePair<string, int> element in ages)\n\
  {\n    string name = element.Key;\n    int age = element.Value;\n    Console.WriteLine($\"\
  Name: {name}, Age: {age}\");\n}\n```\n\n这是该程序的输出：\n\n```\nThe Dictionary contains:\n\
  Name: John, Age: 51\nName: Diana, Age: 50\nName: James, Age: 23\nName: Francesca,\
  \ Age: 21\n```\n\n\n\n\n\n姓名：Diana，年龄：50\n\n姓名：James，年龄：23\n\n姓名：Francesca，年龄：21\n\
  \n* * *\n\n![Image](img/Image00005.jpg) 备注\n\n`System.Collections.Generic` 命名空间还包含了\
  \ `SortedDictionary<TKey, TValue>` 集合类型。该类按键对集合进行排序并保持顺序。\n\n* * *\n\n#### SortedList<TKey,\
  \ TValue> 集合类\n\n`SortedList<TKey, TValue>` 类与 `Dictionary<TKey, TValue>` 类非常相似，可以使用它将键与值关联起来。主要的区别在于键数组始终是排序的（毕竟，它被名叫做\
  \ `SortedList`）。在大多数情况下，向 `SortedList<TKey, TValue>` 对象中插入数据比向 `SortedDictionary<TKey,\
  \ TValue>` 对象插入数据需要更长时间，但数据检索通常更快（或至少一样快），而且 `SortedList<TKey, TValue>` 类使用的内存更少。\n\
  \n当你向 `SortedList<TKey, TValue>` 集合中插入键/值对时，键会被插入到键数组的正确索引处，以保持键数组排序。然后，值会被插入到值数组的相同索引处。`SortedList<TKey,\
  \ TValue>` 类会自动确保键和值保持同步，即使在添加和删除元素也是如此。这意味着你可以以任何顺序向 `SortedList<TKey, TValue>`\
  \ 插入键/值对；它们始终根据键的值进行排序。\n\n与 `Dictionary<TKey, TValue>` 类一样，`SortedList<TKey, TValue>`\
  \ 集合不能包含重复的键。当你使用 `foreach` 语句遍历 `SortedList<TKey, TValue>` 时，你将返回一个 `KeyValuePair<TKey,\
  \ TValue>` 项。然而，`KeyValuePair<TKey, TValue>` 项将按 `Key` 属性排序后返回。\n\n以下是相同的示例，它将我家族成员的年龄与其姓名关联并打印信息，但这个版本已调整为使用\
  \ `SortedList<TKey, TValue>` 对象而不是 `Dictionary<TKey, TValue>` 集合：\n\n点击此处查看代码图像\n\
  \n```csharp\nusing System;\n\nusing System.Collections.Generic;\n...\n\nSortedList<string,\
  \ int> ages = new SortedList<string, int>();\n\n// 填充 SortedList\nages.Add(\"John\"\
  , 51); // 使用 Add 方法\nages.Add(\"Diana\", 50);\nages[\"James\"] = 23; // 使用数组表示法\n\
  ages[\"Francesca\"] = 21;\n\n// 使用 foreach 语句迭代\n// 迭代器生成 KeyValuePair 项\nConsole.WriteLine(\"\
  The SortedList contains:\");\nforeach (KeyValuePair<string, int> element in ages)\n\
  {\nstring name = element.Key;\nint age = element.Value;\nConsole.WriteLine($\"Name:\
  \ {name}, Age: {age}\");\n}\n```\n\n该程序的输出按我家族成员姓名的字母顺序排序的：\n\nThe SortedList contains:\n\
  \nName: Diana, Age: 50\nName: Francesca, Age: 21\nName: James, Age: 23\nName: John,\
  \ Age: 51\n\n#### HashSet<T> 集合类\n\n`HashSet<T>` 类针对执行集合操作进行了优化，例如确定集合成员身份以及生成集合的并集和交集。\n\
  \n你通过 `Add` 方法向 `HashSet<T>` 集合插入项，并通过 `Remove` 方法删除项。然而，`HashSet<T>` 类真正的威力由 `IntersectWith`、`UnionWith`\
  \ 和 `ExceptWith` 方法提供。这些方法修改 `HashSet<T>` 集合以生成一个新的集合，该集合与指定的 `HashSet<T>` 集合取交集、并集或不包含其中的项。这些操作是破坏性的，因为它们用新数据集覆盖了原始\
  \ `HashSet<T>` 标识的内容。你还可以通过 `IsSubsetOf`、`IsSupersetOf`、`IsProperSubsetOf` 和 `IsProperSupersetOf`\
  \ 方法判断一个 `HashSet<T>` 集合中的数据是另一个的超集还是子集。这些方法返回布尔值且是非破坏性的。\n\n在内部，`HashSet<T>` 集合以哈希表的形式存储，能够快速查找项。然而，大型\
  \ `HashSet<T>` 集合可能大量的内存才能快速运行。\n\n下面的示例展示了如何填充 `HashSet<T>` 集合，并说明了使用 `IntersectWith`\
  \ 方法查找两个集合之间叠数据的方法：\n\n点击此处查看代码图像\n\n```csharp\nusing System;\n\nusing System.Collections.Generic;\n\
  ...\n\nHashSet<string> employees = new HashSet<string>(new string[] {\"Fred\",\"\
  Bert\",\"Harry\",\"John\"});\nHashSet<string> customers = new HashSet<string>(new\
  \ string[] {\"John\",\"Sid\",\"Harry\",\"Diana\"});\n\nemployees.Add(\"James\");\n\
  customers.Add(\"Francesca\");\n\nConsole.WriteLine(\"Employees:\");\nforeach (string\
  \ name in employees)\n{\nConsole.WriteLine(name);\n}\n\nConsole.WriteLine(\"\\nCustomers:\"\
  );\nforeach (string name in customers)\n{\nConsole.WriteLine(name);\n}\n\nConsole.WriteLine(\"\
  \\nCustomers who are employees:\");\ncustomers.IntersectWith(employees);\nforeach\
  \ (string name in customers)\n{\nConsole.WriteLine(name);\n}\n```\n\n此代码产生了以下输出：\n\
  \n点击此处查看代码图像\n\nEmployees:\nFred\nBert\nHarry\nJames\n\nCustomers:\nJohn\nSid\n\
  Harry\nDiana\nFrancesca\n\nCustomers who are employees:\nJohn\nHarry\n\n* * *\n\n\
