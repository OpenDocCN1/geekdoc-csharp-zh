  class TreeEnumerator<TItem> : IEnumerator<TItem> where TItem : IComparable<TItem>\n\
  {\n    private Tree<TItem> currentData = null;\n    private TItem currentItem =\
  \ default;\n    private Queue<TItem> enumData = null;\n}\n```\n\n`currentData` 变量将用于持有所枚举树的引用，`currentItem`\
  \ 变量将持有 `Current` 属性返回的值。你用从树中提取的值填充 `enumData` 队列，`MoveNext` 方法将返回该队列中的每个项目。`default`\
  \ 关键字在本章的“使用类型参数初始化变量”部分进行了解释。\n\n**6.** 为 `TreeEnumerator<TItem>` 类添加一个接受 `Tree<TItem>`\
  \ 参数 `data` 的构造函数。在构造函数的体内，添加一条语句将 `currentData` 变量初始化为 `data`：\n\n点击此处查看代码图像\n\n\
  ```csharp\nclass TreeEnumerator<TItem> : IEnumerator<TItem> where TItem : IComparable<TItem>\n\
  {\n    // ...\n    public TreeEnumerator(Tree<TItem> data)\n    {\n        this.currentData\
  \ = data;\n    }\n}\n```\n\n**7.** 紧接构造函数之后，为 `TreeEnumerator<TItem>` 类添加以下名为 `populate`\
  \ 的私有方法：\n\n点击此处查看代码图像\n\n```csharp\nclass TreeEnumerator<TItem> : IEnumerator<TItem>\
  \ where TItem : IComparable<TItem>\n{\n    // ... 变量和构造函数 ...\n    private void\
  \ populate(Queue<TItem> enumQueue, Tree<TItem> tree)\n    {\n        if (tree.LeftTree\
  \ != null)\n        {\n            populate(enumQueue, tree.LeftTree);\n       \
  \ }\n        enumQueue.Enqueue(tree.NodeData);\n        if (tree.RightTree != null)\n\
  \        {\n            populate(enumQueue, tree.RightTree);\n        }\n    }\n\
  }\n```\n\n该方法遍历二叉树，将其包含的内容添加到队列。使用的算法与 `Tree<TItem>` 类中的 `WalkTree` 方法类似，该方法在第 17\
  \ 章中有所描述。主要区别在于，不是将 `NodeData` 值附加字符串，而是将这些值存储在队列中。\n\n**8.** 回到 `TreeEnumerator<TItem>`\
  \ 类的定义。在类声明中，悬停在 `IEnumerator<TItem>` 文字上。在出现的下拉菜单（带有灯泡图标）上，点击“显式实现接口”。\n\n此操作会为\
  \ `IEnumerator<TItem>` 接口和 `IEnumerator` 接口的方法生成存根并将它们添加到类末尾。它还会为 `IDisposable`\
  \ 接口生成 `Dispose` 方法。\n\n\n\n\n\n![Image](img/Image00005.jpg) 备注\n\n`IEnumerator<TItem>`\
  \ 接口继承自 `IEnumerator` 和 `IDisposable` 接口，这就是为什么它们的方法也会出现在这里的原因。事实上，属于 `IEnumerator<TItem>`\
  \ 接口的唯一项是泛型属性 `Current`。`MoveNext` 和 `Reset` 方法属于非泛型的 `IEnumerator` 接口。第 14 章，“使用垃圾回收和资源管理””描述了\
  \ `IDisposable` 接口。\n\n* * *\n\n### 9. 检查生成的代码。\n\n属性和方法的主体包含默认实现，该实现仅抛出一个 `NotImplementedException`\
  \ 异常。你将在接下来的步骤中用实际实现替换这些代码。\n\n### 10. 使用此处加粗的代码更新 `MoveNext` 方法的主体：\n\n点击此处查看代码图像\n\
  \n```csharp\nbool IEnumerator.MoveNext()\n{\n    if (this.enumData == null)\n  \
  \  {\n        this.enumData = new Queue<TItem>();\n        populate(this.enumData,\
  \ this.currentData);\n    }\n    if (this.enumData.Count > 0)\n    {\n        this.currentItem\
  \ = this.enumData.Dequeue();\n        return true;\n    }\n    return false;\n}\n\
  ```\n\n枚举器 `MoveNext` 方法的作用实际上是双重的。当它第一次被调用时，它应该初始化枚举器使用的数据，并移动到要返回的第一条数据。（在第一次调用\
  \ `MoveNext` 之前，`Current` 属性返回的值是未定义的，并且会导致异常。）在在这种情况下，初始化过程包括实例化队列，然后调用 `populate`\
  \ 方法用从树中提取的数据填充队列。\n\n对 `MoveNext` 方法的后续调用应只需在数据项之间移动，直到没有剩余项，如本例所示，出队列项直到队列为空。必须记住，`MoveNext`\
  \ 并没有实际返回数据项——那是 `Current` 属性的作用。`MoveNext` 所做的只是更新枚举器的内部状态（即将 `currentItem` 变量的值设置为从队列中提取的数据项），供\
  \ `Current` 属性使用，如果有下一个值则返回 `true`，否则返回 `false`。\n\n### 11. 按如下加粗所示修改泛型属性 `Current`\
  \ 的 `get` 访问器的定义：\n\n点击此处查看代码图像\n\n```csharp\nTItem IEnumerator<TItem>.Current\n\
  {\n    get\n    {\n        if (this.enumData == null)\n        {\n            throw\
  \ new InvalidOperationException(\"在调用 Current 之前使用 MoveNext\");\n        }\n   \
  \     return this.currentItem;\n    }\n}\n```\n\n* * *\n\n![Image](img/Image00004.jpg)\n\
  \n确保将代码添加到 `Current` 属性的正确实现中。保留非泛型版本 `System.Collections.IEnumerator.Current` 及其抛出\
  \ `NotImplementedException` 异常的默认实现。\n\n* * *\n\n`Current` 属性检查 `enumData` 变量以确保已调用\
  \ `MoveNext`。（在第一次调用 `MoveNext` 之前，该变量将为 `null`。）如果情况并非如此，该属性将抛出 `InvalidOperationException`——这是\
  \ .NET Framework 用于指示当前状态下无法执行操作的常规机制。如果在此已调用 `MoveNext`，它将已更新 `currentItem` 变量，因此\
  \ `Current` 属性只需要返回该变量中的值即可。\n\n### 12. 定位 `IDisposable.Dispose` 方法。按照后续代码中加粗所示注释掉\
