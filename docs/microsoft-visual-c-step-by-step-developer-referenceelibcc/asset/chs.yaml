  \ 2015。\n\n### 总结\n\n在本章中，你学习了 LINQ 如何使用 `IEnumerable<T>` 接口和扩展方法来提供一种查询数据的机制。你还看到了这些功能如何支持\
  \ C# 中的查询表达式语法。\n\n\n\n\n\n![Image](img/Image00001.jpg) 你不能更改操作符的多重性（操作数数量）。例如，`*`（乘法符号）是一个二元运算符。如果你为自己的类型声明了\
  \ `*` 运算符，它也必须是一个二元运算符。\n\n![Image](img/Image00001.jpg) 你不能发明新的操作符符号。例如，你不能创建一个诸如\
  \ `**` 这样的操作符符号来计算一个数字的另一个数的次方。你必须定义一个方法来实现该功能。\n\n![Image](img/Image00001.jpg)\
  \ 当操作符被应用于内置类型时，你不能更改它们的含义。例如，表达式 `1 + 2` 具有预定义的含义，你不被允许重写这个含义。如果你可以这样做，那么事情将会变得过于复杂。\n\
  \n![Image](img/Image00001.jpg) 有些操作符符号是无法重载的。例如，你不能重载点运算符 `.*`，它表示访问类成员。再次，如果你可以这样做，会导致不必要的复杂性。\n\
  \n***\n\n![Image](img/Image00013.jpg) 提示\n\n你可以使用索引器来模拟 `[]` 作为操作符。同样，你可以使用属性来模拟赋值\
  \ `==` 作为操作符，并可以使用委托来模拟函数调用作为操作符。\n\n***\n\n### 重载的操作符\n\n要定义你自己的操作符行为，你必须重载一个选定的操作符。你使用类似于方法的语法，带有返回类型和参数，但方法的名称是关键字\
  \ `operator` 加上你正在声明的操作符符号。例如，以下代码显示了一个名为 `Hour` 的用户定义结构体，它定义了一个二元 `+` 运算符来将两个 `Hour`\
  \ 实例相加：\n\n点击此处查看代码图片\n\n```cs\nstruct Hour\n{\n    public Hour(int initialValue)\n\
  \    {\n        this.value = initialValue;\n    }\n\n    public static Hour operator\
  \ +(Hour lhs, Hour rhs)\n    {\n        return new Hour(lhs.value + rhs.value);\n\
  \    }\n    ...\n\n    private int value;\n}\n```\n\n注意以下几点：\n\n![Image](img/Image00001.jpg)\
  \ 操作符是公共的（public）。所有操作符`必须`是公共的。\n\n![Image](img/Image00001.jpg) 操作符是静态的（static）。所有操作符`必须`是静态的。操作符永远不是多态的，不能使用\
  \ `virtual`、`abstract`、`override` 或 `sealed` 修饰符。\n\n![Image](img/Image00001.jpg)\
  \ 二元运算符（例如示例所示的 `+` 运算符）有两个显式参数，而一元运算符仅有一个显式参数。（C++ 程序员应该注意，操作符永远没有隐藏的 `this` 参数。）\n\
  \n***\n\n![Image](img/Image00013.jpg) 提示\n\n当你声明高度样式化的功能（如操作符）时，采用参数的命名约定是有帮助的。例如，开发者经常为二元运算符使用\
  \ `lhs` 和 `rhs`（分别为左操作数和右操作数的缩写）。\n\n***\n\n当你对两个类型为 `Hour` 的表达式使用 `+` 运算符时，C# 编译器会自动将你的代码转换为对你定义的\
  \ `operator +` 方法的调用。C# 编译器会将此代码\n\n```cs\nHour Example(Hour a, Hour b)\n{\n   \
  \ return a + b;\n}\n```\n\n转换为此：\n\n点击此处查看代码图片\n\n```cs\nHour Example(Hour a, Hour\
  \ b)\n{\n    return Hour.operator +(a,b); // 伪代码\n}\n```\n\n然而，请注意这种语法是伪代码，而不是有效的\
  \ C#。你只能在标准的中置表示法中（符号位于操作数之间）使用二元运算符。\n\n在声明操作符时，你必须遵循最后一个规则是：参数中至少有一个必须是包含类型的类型。在前面的\
  \ `Hour` 类的 `operator+` 示例中，参数 `a` 或 `b` 之一必须是 `Hour` 对象。在这个示例中，两个参数都是 `Hour` 对象。但是，在某些情况下你可能想要定义\
  \ `operator+` 的额外实现，例如将一个整数（小时数）加到 `Hour` 对象上——第一个参数可以是 `Hour`，第二个参数可以是整数。这条规则使得编译器在尝试解析操作符调用时更容易知道去哪里查找，同时也确保了你不能更改内置操作符的含义。\n\
  \n### 创建对称操作符\n\n在上一节中，你看到了如何声明一个二元 `+` 运算符来将两个 `Hour` 类型的实例相加。`Hour` 结构体还有一个构造函数，可以从\
  \ `int` 创建 `Hour`。这意味着你可以将一个 `Hour` 和一个 `int` 相加；你只需要先使用 `Hour` 构造函数将 `int` 转换为\
  \ `Hour`，如下例所示：\n\n```cs\nHour a = ...;\nint b = ...;\nHour sum = a + new Hour(b);\n\
  ```\n\n这无疑是有效代码，但它不如直接添加 `Hour` 和 `int` 那样清晰或简洁，如下：\n\n```cs\nHour a = ...;\nint\
  \ b = ...;\nHour sum = a + b;\n```\n\n为了使表达式 `(a + b)` 有效，你必须指定将 `Hour` 作为左操作数、`int`\
  \ 作为右操作数时的含义。也就是说，你必须声明一个第一个参数为 `Hour`、第二个参数为 `int` 的二元 `+` 运算符。以下代码显示了推荐的方法：\n\n\
  点击此处查看代码图片\n\n```cs\nstruct Hour\n{\n    public Hour(int initialValue)\n    {\n\
  \        this.value = initialValue;\n    }\n    ...\n\n    public static Hour operator\
  \ +(Hour lhs, int rhs)\n    {\n        return lhs.value + rhs;\n    }\n}\n```\n\n\
  注意，操作符背后的所有逻辑保持在一个地方。这一点在于，额外的 `operator+` 使得功能更易用。\n\n```cs\nint a = ...;\nint\
  \ b = ...;\nHour sum = a + b;\n```\n\n这是违反直觉的。如果你可以写 `a + b`，你会期望能够写 `b + a`。因此，你应该提供\
  \ `operator+` 的另一个重载：\n\n点击此处查看代码图片\n\n```cs\nstruct Hour\n{\n    public Hour(int\
  \ initialValue)\n    {\n        this.value = initialValue;\n    }\n    ...\n\n \
  \   public static Hour operator +(Hour lhs, int rhs)\n    {\n        return lhs\
  \ + new Hour(rhs);\n    }\n\n    public static Hour operator +(int lhs, Hour rhs)\n\
  \    {\n        return new Hour(lhs) + rhs;\n    }\n}\n```\n\n***\n\n![Image](img/Image00005.jpg)\
  \ 注意\n\nC++ 程序员应该注意，你必须自己提供重载。编译器不会为你编写重载，也不会通过交换两个操作数的顺序来寻找匹配的操作符。\n\n***\n\n###\
  \ 操作符与语言互操作\n\n并不是所有使用通用语言运行时（CLR）的语言都支持或理解操作符重载。如果你重载了操作符，你应该提供另一种实现相同功能的机制，以便从不支持操作符重载的语言使用该类。例如，假设你为\
  \ `Hour` 结构体实现了 `operator+`，如下所示：\n\n点击此处查看代码图片\n\n```cs\npublic static Hour operator\
  \ +(Hour lhs, int rhs)\n{\n    ...\n}\n```\n\n如果你需要在 Microsoft Visual Basic 应用程序中使用你的类，还应该提供实现相同内容的\
  \ `Add` 方法，如所示：\n\n点击此处查看代码图片\n\n\n\n\n\n```csharp\npublic static Hour Add(Hour\
  \ lhs, int rhs)\n{\n\n    ...\n}\n```\n\n***\n\n### 理解复合赋值的求值\n\n复合赋值运算符（例如 `+=`）始终根据其相关的简单运算符（例如\
  \ `+`）进行评估。换句话说，语句\n\n```csharp\na += b;\n```\n\n会自动评估为如下形式：\n\n```csharp\na = a\
  \ + b;\n```\n\n通常情况下，表达式 `a @= b`（其中 `@` 代表任何有效的运算符）始终被评估为 `a = a @ b`。如果你重载了相应的简单运算符，那么在使用与其相关的复合赋值运算符时，会自动调用重载版本，例所示：\n\
  \n```csharp\nHour a = ...;\nint b = ...;\n\na += a; // 等同于 a = a + a\na += b; //\
  \ 等同于 a = a + b\n```\n\n第一个复合赋值表达式 `(a += a)` 是有效的，因为 `a` 的类型是 `Hour`，并且 `Hour`\
  \ 类型声明了一个二元运算符 `operator+`，其参数都是 `Hour`。同样，第二个复合赋值表达式 `(a += b)` 有效的，因为 `a` 的类型是\
  \ `Hour` 且 `b` 的类型是 `int`。`Hour` 类型还声明了一个二元运算符 `operator+`，其第一个参数是 `Hour`，第二个参数是\
  \ `int`。但请注意，你不能编写表达式 `b += a`，因为这等于 `b = b + a`。虽然加法是有效的，但赋值无效，因为没有办法将 `Hour` 赋值给内置类型\
  \ `int`。\n\n### 声明递增和递减运算符\n\n在 C# 中，你可以声明自己的递增（++）和递减（--）运算符。声明这些运算符时遵循通常的规则：它们必须是公共的、必须是静态的，并且必须是单元的（它们只能接受一个参数）。以下是\
  \ `Hour` 结构体的递增运算符：\n\n点击此处查看代码图像\n\n```csharp\nstruct Hour\n{\n    ...\n\n    public\
  \ static Hour operator ++(Hour arg)\n    {\n        arg.value++;\n        return\
  \ arg;\n    }\n\n    ...\n\n    private int value;\n}\n```\n\n递增和递减运算符的独特之处在于它们可以以前缀和后置的形式使用。C#\
  \ 巧妙地使用同一个单运算符来处理前缀和后置版本。后置表达式的结果是表达式执行*之前*操作数的值。换句话说，编译器实际上将代码\n\n```csharp\nHour\
  \ now = new Hour(9);\nHour postfix = now++;\n```\n\n转换为如下：\n\n点击此处查看代码图像\n\n```csharp\n\
  Hour now = new Hour(9);\nHour postfix = now;\nnow = Hour.operator ++(now); // 伪代码，不是有效的\
  \ C#\n```\n\n前缀表达式的结果是运算符的返回值，因此 C# 编译器实际上将代码\n\n```csharp\nHour now = new Hour(9);\n\
  Hour prefix = ++now;\n```\n\n转换为如下：\n\n点击此处查看代码图像\n\n```csharp\nHour now = new Hour(9);\n\
  now = Hour.operator ++(now); // 伪代码，不是有效的 C#\nHour prefix = now;\n```\n\n这种等效性意味着递增和递减运算符的返回类型必须与参数类型相同。\n\
  \n### 结构和类中的比较运算符\n\n请注意，`Hour` 结构中递增运算符的实现之所以有效是因为 `Hour` 是一个结构。如果你将 `Hour` 改为类但保持递增运算符实现不变，你会发现后置转换将无法给出正确答案。如果你记得类是引用类型，并重新回顾之前解释的编译器转换，你可以从下面的示例看出为什么\
  \ `Hour` 类的运算符不再按预期工作了：\n\n点击此处查看代码图像\n\n```csharp\nHour now = new Hour(9);\nHour\
  \ postfix = now;\nnow = Hour.operator ++(now); // 伪代码，不是有效的 C#\n```\n\n如果 `Hour`\
  \ 是一个类，赋值语句 `postfix = now` 会让变量 `postfix` 指向与 `now` 的对象。更新 `now` 会自动更新 `postfix`！如果\
  \ `Hour` 是一个结构，赋值语句会在 `postfix` 中创建 `now` 的拷贝，对 `now` 的任何更改都会让 `postfix` 保持不变，这正是你想要的。\n\
  \n当 `Hour` 为类时，递增运算符的正确实现如下：\n\n点击此处查看代码图像\n\n```csharp\nclass Hour\n{\n    public\
  \ Hour(int initialValue)\n    {\n        this.value = initialValue;\n    }\n\n \
  \   ...\n\n    public static Hour operator ++(Hour arg)\n    {\n        return new\
  \ Hour(arg.value + 1);\n    }\n\n    ...\n\n    private int value;\n}\n```\n\n注意\
  \ `operator ++` 现在根据原始对象中的数据创建一个新对象。新对象中的数据增加了，但原始对象中的数据保持不变。虽然这种方法可行，但递增运算符的编译器转换会导致每次使用时都创建一个新对象。这在内存使用和垃圾回收开销方面可能是昂贵的。因此，建议在定义类型时限制运算符重载。此建议适用于所有运算符，而是递增运算符。\n\
  \n### 定义运算符对\n\n某些运算符是成对出现的。例如，如果你可以使用 `!=` 运算符比较两个 `Hour` 值，那么你预期能够使用 `==` 运算符比较两个\
  \ `Hour` 值。C# 编译器通过强制要求来执行这一合理的预期：如果你定义了 `==` 或 `!=`，就必须定义两者。这种“非此即彼”的规则也适用于 `<`、`>`\
  \ 以及 `<=` 和 `>=` 运算符。C# 编译器不会为你编写其中任何一个。你必须显式地编写它们。以下是 `Hour` 结构体的 `==` 和 `!=` 运算符：\n\
  \n点击此处查看代码图像\n\n```csharp\nstruct Hour\n{\n    public Hour(int initialValue)\n \
  \   {\n        this.value = initialValue;\n    }\n\n    ...\n\n    public static\
  \ bool ==(Hour lhs, Hour rhs)\n    {\n        return lhs.value == rhs.value;\n \
  \   }\n\n    public static bool !=(Hour lhs, Hour rhs)\n    {\n        return lhs.value\
  \ != rhs.value;\n    }\n\n    ...\n\n    private int value;\n}\n```\n\n这些运算符的返回类型并不实际上是布尔值。然而，除非你有使用其他类型的充分理由，否则这些运算符可能会变得困惑。\n\
  \n### 重写相等运算符\n\n如果你在类中定义了 `operator ==` 和 `operator !=`，你还应该重写继承自 `System.Object`（如果是结构体则继承自\
  \ `System.ValueType`）的 `Equals` 和 `GetHashCode` 方法。`Equals` 方法的行为应与 `operator ==`\
  \ 相同。（通过后者来定义前者。）`GetHashCode` 方法被 .NET Framework 中的其他类使用。（例如，当一个对象作为哈希表的键时，会调用该对象的\
  \ `GetHashCode` 方法来帮助计算哈希值。更多信息请参阅 Visual Studio 2015 提供的 .NET Framework 参考文档。）该方法只需要返回一个具有区分性的整数值。但是，不要从所有对象的\
  \ `GetHashCode` 方法中返回相同的整数，这将破坏哈希算法的有效性。\n\n### 实现运算符\n\n在下面的练习中，你将开发一个模拟复数的类。\n\
  \n复数有两个部分：实部和一个虚部。通常，复数表示为 (x + y*i)，其中 x 是实部，y*i 是虚部。x 和 y 的值是普通的整数，而 *i* 代表 -1\
  \ 的平方根（这就是为什么 y*i 是虚部的原因）。\n\n\n\n\n\n![Image](img/Image00005.jpg) 注意\n\nMicrosoft\
  \ .NET Framework 4.0 及更高版本在 `System.Numerics` 命名空间中包含一个名为 `Complex` 的类型，该类型实现了复数，因此你不再真正需要定义自己的该类型版本了。然而，查看如何实现该类型的一些常用运算符仍然具有启发意义。\n\
  \n* *\n\n你将把复数实现为一对整数，分别代表实部和虚部的系数 `x` 和 `y`。你还将实现为了使用复数进行简单算术运算所需的运算符。下表总结了如何对一对复数\
  \ `(a + b*i)` 和 `(c + d*i)` 执行四种主要的算术运算。\n\n![Image](img/Image0000145.jpg)\n\n###\
  \ 创建 `Complex` 类并实现算术运算符\n\n**1.** 如果 Visual Studio 2015 尚未运行，请启动它。\n\n**2.** 打开\
