  \n你可以看到通过使用样式，你可以轻松实现许多非常酷的效果。此外，仔细使用样式可以使你的代码比在单个控件上设置属性更具可维护性。例如，如果你想切换 `Customers`\
  \ 应用程序中标签和标题使用的字体，你只需要对 `FontStyle` 样式进行单次更改。通常情况下，你应该尽可能地使用样式；除了有助于可维护性外，使用样式有助于保持表单\
  \ XAML 标记的整洁且不杂，而表单的 XAML 只需要指定控件和布局，而不是控件在表单上的显示方式。你还可以使用 `Visual Studio 2015`\
  \ 中的 `Microsoft Blend` 来定义复杂的样式，并将这些样式集成到应用程序中。专业图形艺术家可以使用 `Blend` 开发自定义样式，并以 XAML\
  \ 标记的形式将这些样式提供构建应用程序的开发者。开发者只需要向用户界面元素添加适当的 `Style` 标签以引用相应的样式即可。\n\n### 总结\n\n\
  在本章中，你学习了如何使用 `Grid` 控件来实现可以缩放到不同设备形状因子和方向的用户界面。你还学习了如何使用 `Visual State Manager`\
  \ 在用户更改显示应用程序的窗口大时调整控件的布局。最后，你学习了如何创建自定义样式并将其应用到表单控件上。现在你已经定义了用户界面，下一个挑战是为应用程序添加功能，使用户显示并更新数据，这是我们在最后几个章节中将要做的\n\
