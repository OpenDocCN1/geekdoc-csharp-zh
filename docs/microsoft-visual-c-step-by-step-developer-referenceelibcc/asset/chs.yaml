  \ `AdventureWorksEntities`。点击 `Next`。\n\n![Image](img/Image00226.jpg)\n\n**21.**\
  \ 在 `Choose Your Version` 页上，选择 `Entity Framework 6.x`，然后点击 `Next`。\n\n**22.** 在\
  \ `Choose Your Database Objects And Settings` 页上，展开 `Tables`，展开 `SalesLT`，然后选择 `Customer`。验证\
  \ `Pluralize Or Singularize Generated Object Names` 复选框已选中。（此页上的另外两个选项默认也会被选中。）观察\
  \ `Entity Framework` 在 `AdventureWorksModel` 命名空间中为实体模型生成类，然后点击 `Finish`。\n\n![Image](img/Image00227.jpg)\n\
  \n实体数据模型向导为 `Customer` 表生成一个实体模型，并在屏幕上的 `Entity Model` 编辑器中显示图形化表示，如下所示：\n\n![Image](img/Image002228.jpg)\n\
  \n如果出现以下 `Security Warning` 消息框，勾选 `Do Not Show This Again` 复选框，然后点击 `OK`。出现此安全警告是因为\
  \ `Entity Framework` 使用了名为 `T4 templates` 的技术为你的实体模型生成代码，并且它通过 `NuGet` 从网络下载了这些模板。`Entity\
  \ Framework` 模板已通过微软验证，安全安全。\n\n![Image](img/Image00229.jpg)\n\n**23.** 在 `Entity\
  \ Model` 编辑器中，右键点击 `MiddleName` 列，然后点击 `Delete From Model`。使用相同的过程，从实体模型中删除 `Suffix`、`CompanyName`\
  \ 和 `SalesPerson` 列。\n\n`Customers` 应用程序不需要这些列，因此没有从数据库中检索它们。它们允许空值，因此可以安全地作为数据库表的一部分。但是，你不应该移除\
  \ `rowguid` 和 `ModifiedDate` 列。这些列被数据库用于识别 `Customer` 表中的行，并在多用户环境中跟踪对这些行的变化。如果你删除了这些列，将无法正确将数据保存回数据库。\n\
  \n**24.** 在 `Build` 菜单上，点击 `Build Solution`。\n\n**25.** 在 `Solution Explorer` 中，找到\
  \ `AdventureWorksService` 项目，展开 `Models` 文件夹，展开 `AdventureWorksModel.edmx`，展开 `AdventureWorksModel.tt`，并双击\
  \ `Customer.cs`。\n\n该文件包含 `Entity Data Model Wizard` 生成的表示客户的类。该类包含包含在实体模型中的 `Customer`\
  \ 表每一列的自动属性：\n\n```csharp\npublic partial class Customer\n{\n    public int CustomerID\
  \ { get; set; }\n\n    public string Title { get; set; }\n\n    public string FirstName\
  \ { get; set; }\n\n    public string LastName { get; set; }\n\n    public string\
  \ EmailAddress { get; set; }\n\n    public string Phone { get; set; }\n\n    public\
  \ System.Guid rowguid { get; set; }\n\n    public System.DateTime ModifiedDate {\
  \ get; set; }\n}\n```\n\n**26.** 在 `Solution Explorer` 中，在 `AdventureWorksModel.edmx`\
  \ 条目下，展开 `AdventureWorksModel.tt`，并双击 `AdventureWorksModel.Context.cs`。\n\n该文件包含名为\
  \ `AdventureWorksEntities` 的类定义。（其名称与你在生成数据库连接时使用的名称相同。）\n\n```csharp\npublic partial\
  \ class AdventureWorksEntities : DbContext\n{\n    public AdventureWorksEntities()\n\
  \        : base(\"name=AdventureWorksEntities\")\n    {\n    }\n\n    protected\
  \ override void OnCreating(DbModelBuilder modelBuilder)\n    {\n        throw new\
  \ UnintentionalCodeFirstException();\n    }\n\n    public DbSet<Customer> Customers\
  \ { get; set; }\n}\n```\n\n`AdventureWorksEntities` 类继承自 `DbContext` 类，该类提供了应用程序连接数据库的功能。默认构造函数向基类传递了一个参数，指定了连接数据库的连接字符串。如果你查看\
  \ `web.config` 文件，可以在 `<ConnectionString>` 部分找到该字符串。它包含了你在运行 `Entity Data Model\
  \ Wizard` 时指定的参数等。但是，此字符串不包含身份验证所需的密码信息，因为你选择了在运行时提供这些数据。你将在后续步骤中处理这些。\n\n你可以忽略\
  \ `AdventureWorksEntities` 类中的 `OnCreating` 方法。另一个项目是 `Customers` 集合。该集合的类型为 `DbSet<Customer>`。`DbSet`\
  \ 泛型提供了对数据库对象进行添加、插入、删除和查询的方法。它与 `DbContext` 类协作工作，生成必要的 SQL SELECT 命令以从数据库获取客户信息并填充集合。它还用于在\
  \ `Customer` 对象从集合中添加、修改或删除时创建 SQL INSERT、`UPDATE` 和 `DELETE` 命令。`DbSet` 集合通常被称为\
  \ `entity set`。\n\n**27.** 在 `Solution Explorer` 中，右键点击 `Models` 文件夹，点击 `Add`，然后点击\
  \ `Class`。\n\n**28.** 在 `Add New Item – AdventureWorksService` 对话框中，确保选中了 `Class`\
  \ 模板。在 `Name` 框中输入 `AdventureWorksEntities` ，然后点击 `Add`。\n\n\n\n\n\n向项目中添加了一个名为\
  \ `AdventureWorksEntities` 的新类，并显示在代码和文本编辑器窗口中。该类目前与 Entity Framework 生成的同名现有类冲突，但你将通过将其转换为部分类（partial\
  \ class）来增强 Entity Framework 代码。部分类是类代码分布在一个或多个源文件中的类。这种方法对于 Entity Framework 等工具非常有用，因为允许你添加自己的代码，而无必担心在未来某个时刻重新生成\
  \ Entity Framework 代码时，你的代码会被意外覆盖。\n\n### 29. 在代码和文本编辑器窗口中，修改 `AdventureWorksEntities`\
  \ 类的定义以使其成为部分类，如下文**粗体**所示。\n\n点击此处查看代码图像\n\n```cs\npublic partial class AdventureWorksEntities\n\
  {\n\n}\n```\n\n### 30. 在 `AdventureWorksEntities` 类中，添加一个接受名为 `password` 的字符串参数的构造函数。该构造函数应该调用基类构造函数，并传入之前由\
  \ Entity 数据模型向导写入 `web.config` 文件的连接字符串名称（在“选择数据连接”页面上指定）。\n\n点击此处查看代码图像\n\n```cs\n\
  public partial class AdventureWorksEntities\n{\n\npublic AdventureWorksEntities(string\
  \ password)\n: base(\"name=AdventureWorksEntities\")\n{\n\n}\n\n}\n```\n\n### 31.\
  \ 在构造函数中添加下文**粗体**所示的代码。此代码修改了 Entity Framework 使用的连接字符串，使其包含密码。Customers 将在运行时调用此构造函数并提供密码。\n\
  \n点击此处查看代码图像\n\n```cs\npublic partial class AdventureWorksEntities\n{\npublic AdventureWorksEntities(string\
  \ password)\n: base(\"name=AdventureWorksEntities\")\n{\nthis.Database.Connection.ConnectionString\
  \ += $\";Password={password}\";\n\n}\n\n}\n```\n\n## 创建和使用 REST Web 服务\n\n你已经创建了一个实体模型，该模型提供了检索和维护客户信息的操作。下一步是实现一个\
  \ Web 服务，以便 UWP 应用程序访问该实体模型。\n\n使用 Visual Studio 2015，你可以直接基于 Entity Framework 生成的实体模型在\
  \ ASP.NET Web 中创建 Web 服务。该 Web 服务使用实体模型从数据库检索数据并更新数据库。你通过使用“添加挂架”（Add Scaffold）向导创建\
  \ Web 服务。该向导可以生成实现 REST 模型的 Web 服务，该模型使用导航方案（navigational scheme）在网络上表示业务对象和服务，并使用\
  \ HTTP 协议传输访问这些对象和服务的请求。访问资源的客户端以 URL 形式提交请求，由 Web 服务解析并处理该请求。例如，Adventure Works\
  \ 可能会使用类似的方案发布客户信息，将每个客户的详情作为单个资源暴露：\n\n点击此处查看代码图像\n\n`http://Adventure-Works.com/DataService/Customers/1`\n\
  \n访问此 URL 会导致 Web 服务检索客户 1 的数据。这些数据可以用多种格式返回，但为了可移植性，最常见的格式包括 XML 和 JavaScript 对象表示法\
  \ (JSON)。REST Web 服务请求执行之前的查询时生成的典型 JSON 响应如下：\n\n点击此处查看代码图像\n\n```json\n{\n\"CustomerID\"\
  :1,\n\"Title\":\"Mr\",\n\"FirstName\":\"Orlando\",\n\"LastName\":\"Gee\",\n\"EmailAddress\"\
  :\"orlando0@adventure-works.com\",\n\"Phone\":\"245-555-0173\"\n}\n```\n\nREST 模型依赖于访问数据的应用程序在访问数据的请求中发送适当的\
  \ HTTP 动词。例如之前所示的简单请求应该向 Web 服务发送一个 HTTP GET 请求。HTTP 还支持其他动词，例如 POST、PUT 和 DELETE，你可以分别使用它们创建、修改和删除资源。编写生成适当\
  \ HTTP 请求并解析 REST Web 服务返回响应的代码听起来相当复杂。幸运的是，“添加挂架”向导可以为你生成大部分代码。\n\n在接下来的练习中，你将为\
  \ AdventureWorks 实体模型创建一个简单的 REST Web 服务。该 Web 服务将使客户端能够查询和维护客户信息。\n\n### 创建 AdventureWorks\
  \ Web 服务\n\n**1.** 在 Visual Studio 中，在 `AdventureWorksService` 项目中，右键点击 `Controllers`\
  \ 文件夹，指向“添加”，然后点击“新建挂架项”。\n\n**2.** 在“添加挂架”向导中，在中间面板中，点击 `Web API 2 Controller With\
  \ Actions, Using Entity Framework` 模板，然后点击“添加”。\n\n![Image](img/Image00230.jpg)\n\
  \n**3.** 在“添加控制器”对话框中，在“模型类”下拉列表中选择 `Customer` (`AdventureWorksService.Models`)。在“数据上下文类”下拉列表中选择\
  \ `AdventureWorksEntities` (`AdventureWorksService.Models`)。勾选“使用异步控制器操作”复框框。控制器名称已设置为\
  \ `CustomersController`，然后点击“添加”。\n\n![Image](img/Image00231.jpg)\n\n使用 ASP.NET\
  \ Web API 模板创建的 Web 服务，所有传入的 Web 请求都由一个或多个控制器类处理，每个控制器类都暴露映射到不同类型 REST 请求的方法，用于控制器暴露的资源。例如，`CustomersController`\
  \ 如下：\n\n点击此处查看代码图像\n\n```cs\npublic class CustomersController : ApiController\n\
  {\nprivate AdventureWorksEntities db = new AdventureWorksEntities();\n\n// GET:\
  \ api/Customers\npublic IQueryable<Customer> GetCustomers()\n{\n    return db.Customers;\n\
  }\n\n// GET: api/Customers/5\n[ResponseType(typeof(Customer))]\npublic async Task<HttpActionResult>\
  \ GetCustomer(int id)\n{\n    Customer customer = await db.Customers.FindAsync(id);\n\
  \    if (customer == null)\n    {\n        return NotFound();\n    }\n    return\
  \ Ok(customer);\n}\n\n// PUT: api/Customers/5\n[ResponseType(typeof(void))]\npublic\
  \ async Task<HttpActionResult> PutCustomer(int id, Customer customer)\n{\n    if\
  \ (!ModelState.IsValid)\n    {\n        return BadRequest(ModelState);\n    }\n\
  \    if (id != customer.CustomerID)\n    {\n        return BadRequest();\n    }\n\
  \    db.Entry(customer).State = EntityState.Modified;\n    try\n    {\n        await\
  \ db.SaveChangesAsync();\n    }\n    catch (DbConcurrencyException)\n    {\n   \
  \     if (!CustomerExists(id))\n        {\n            return NotFound();\n    \
  \    }\n        else\n        {\n            throw;\n        }\n    }\n    return\
  \ StatusCode(HttpStatusCode.NoContent);\n}\n\n// POST: api/Customers\n[ResponseType(typeof(Customer))]\n\
  public async Task<HttpActionResult> PostCustomer(Customer customer)\n{\n    ...\n\
  }\n\n// DELETE: api/Customers/5\n[ResponseType(typeof(Customer))]\npublic async\
  \ Task<HttpActionResult> DeleteCustomer(int id)\n{\n    ...\n}\n\n...\n}\n```\n\n\
  `GetCustomers` 方法处理检索所有客户的请求，它通过返回之前创建的 Entity Framework 数据模型中的整个 `Customers` 集合来满足该请求。在后台，Entity\
  \ Framework 从数据库获取所有客户并使用这些信息填充 `Customers` 集合。如果应用程序向此 Web 服务的 `api/Customers`\
  \ 发送 HTTP GET 请求，就会调用此方法。\n\n`GetCustomer` 方法（不要与 `GetCustomers` 混淆）接受一个整数参数。该参数指定特定客户的\
  \ `CustomerID`，方法在返回之前使用 Entity Framework 进行查找。当应用程序向 `api/Customers/* n` URL 发送\
  \ HTTP GET 请求时（*n* 是要检索客户的 ID），`GetCustomer` 将运行。\n\n\n\n\n当应用程序向 Web 服务发送 HTTP\
  \ PUT 请求时，`PutCustomer` 方法将会运行。该请求指定了客户 ID 和客户详细信息，方法中的代码使用 Entity Framework 根据详细信息更新指定的客户。`PostCustomer`\
  \ 方法响应 HTTP POST 请求，并将客户详细信息作为其参数。此方法将带有这些详细信息的新客户添加到数据库中（前述代码示例中未显示这些信息）。最后，`DeleteCustomer`\
  \ 方法处理 HTTP DELETE 请求并删除具有指定客户 ID 的客户。\n\n![Image](img/Image00005.jpg) 注意\n\nWeb\
  \ API 模板生成的代码乐观地假设它将始终能够连接到数据库。在分布式系统中，数据库和 Web 服务位于不同的服务器上，情况可能并不总是如此。网络容易出现瞬态错误和超时；连接尝试可能会因为临时故障而失败，如果在短时间后重试则可能会成功。将临时故障作为错误报告给客户端可能会让用户感到困扰。如果可能，只要在重试次数不过多的情况下，静默地重试失败的操作可能会是（的（因为你不希望在数据库真的不可用时\
  \ Web 服务被冻结。）。有关此策略的详细信息，请参阅[`http://social.technet.microsoft.com/wiki/contents/articles/18665.cloud-service-fundamentals-data-access-layer-transient-fault-handling.aspx`](http://social.technet.microsoft.com/wiki/contents/articles/18665.cloud-service-fundamentals-data-access-layer-transient-fault-handling.aspx)\
  \ 中的“云服务基础数据访问层—瞬态故障处理”。\n\nASP.NET Web API 模板自动生成将请求定向到控制器类中适当方法的代码，如果需要管理其他资源（例如产品或订单），你可以添加更多控制器类。\n\
  \n![Image](img/Image00005.jpg) 注意\n\n有关使用 ASP.NET Web API 模板实现 REST 服务的详细信息，请参阅[`http://www.asp.net/web-api`](http://www.asp.net/web-api)\
  \ 中的“Web API”。\n\n你也可以通过与 `CustomersController` 类所示相同的模式手动创建控制器类——你不一定需要使用 Entity\
  \ Framework 在数据库中获取和存储数据。ASP.Net Web API 模板在 `ValuesController.cs` 文件中包含一个示例控制器，你可以进行复制并用自己的代码进行扩展。\n\
  \n### 4. 在 `CustomersController` 类中，修改创建 `AdventureWorksEntities` 上下对象的语句，以使用带有密码作为参数的构造函数。作为构造函数的参数，提供你在创建数据库时指定的管理员密码。（在以下代码示例中，请将字符串\
  \ `YourPassword` 替换为你自己的密码。）\n\n点击此处查看代码图像\n\n```csharp\npublic class CustomersController\
  \ : ApiController\n{\n\n    private AdventureWorksEntities db = new AdventureWorksEntities(\"\
  YourPassword\" );\n\n    // GET: api/Customers\n    public IQueryable<Customer>\
  \ GetCustomers()\n    {\n        return db.Customers;\n    }\n\n    ...\n}\n```\n\
  \n![Image](img/Image00005.jpg) 注意\n\n在现实世界中，你可以提示运行 Customers 应用程序的用户提供此信息（或允许应用程序将密码本地保存到用户的设备上，作为应用程序配置数据的一部分）。Customers\
  \ 应用程序随后会将此信息传递给 Web 服务。\n\n### 5. 在 Controllers 文件夹中，右键点击 `ValuesController.cs`\
  \ 文件，然后点击删除。在消息框中，点击 OK 以确认你要删除此文件。\n\n在此练习中，你将不会使用示例 `ValuesController` 类。\n\n\
  ![Image](img/Image00005.jpg) 注意\n\n不要删除 `HomeController` 类。此控制器作为托管 Web 服务的 Web\
  \ 应用程序的入口点。\n\n### 6. 在解决方案资源中，右键点击 `AdventureWorksService` 项目，点击“查看”，然后点击“在浏览器中查看\
  \ (Microsoft Edge)”。\n\n如果 Web 服务配置正确，你的网络浏览器应该启动并显示以下页面：\n\n![Image](img/Image00232.jpg)\n\
  \n### 7. 在标题栏上，点击 API。\n\n出现另一个页面，总结了应用程序可以发送到 Web 服务的 REST 请求：\n\n![Image](img/Image00233.jpg)\n\
  \n### 8. 在地址栏中，输入 `http://localhost:50000/api/Customers/1`，然后按回车。\n\n此请求被指向 `CustomersController`\
