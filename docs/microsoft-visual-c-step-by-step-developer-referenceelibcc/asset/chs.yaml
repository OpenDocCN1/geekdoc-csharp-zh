  \n### 5. 按回车键返回 Visual Studio 2015。\n\n### LINQ 与延迟计算\n\n当你使用 LINQ 定义一个枚举集合时（无论是使用\
  \ LINQ 扩展方法还是使用查询操作符），请记住，集合在被枚举之前并不会实际构建。这意味着在定义查询和遍历它之间，原始集合可能会发生变化。例如，以下查询定义了美国公司的名称枚举集合：\n\
  \n点击此处查看代码图像\n\n```csharp\nvar usCompanies = from a in addresses\nwhere String.Equals(a.Country,\
  \ \"United States\")\nselect a.CompanyName;\n```\n\n`addresses` 数组中的数据直到你遍历 `usCompanies`\
  \ 集合时才会被被检索。使用方式如下：\n\n点击此处查看代码图像\n\n```csharp\nforeach (string name in usCompanies)\n\
  {\n    Console.WriteLine(name);\n}\n```\n\n这种策略被称为**延迟计算**（deferred evaluation）。\n\
  \n你可以在定义查询时强制计算并生成静态的缓存集合。该集合是原始数据的副本，如果原始集合发生变化，它不会改变。LINQ 提供了 `ToList` 方法来构建包含缓存数据的\
  \ `List` 对象。使用方式如下：\n\n点击此处查看代码图像\n\n```csharp\nvar usCompanies = from a in addresses.ToList()\n\
  where String.Equals(a.Country, \"United States\")\nselect a.CompanyName;\n```\n\n\
  这一次，公司列表在你创建查询时就已经固定了。如果你向 `addresses` 数组添加了更多美国公司，在遍历 `usCompanies` 集合时将看不到它们。LINQ\
  \ 还提供了 `ToArray` 方法将缓存集合存储为数组。在本章的最后一个练习中，你将比较使用 LINQ 延迟计算与生成缓存集合的影响。\n\n## 查看 LINQ\
  \ 查询延迟计算和缓存计算的影响\n\n### 1. 返回 Visual Studio 2015，显示 `QueryBinaryTree` 项目，然后编辑 `Program.cs`\
