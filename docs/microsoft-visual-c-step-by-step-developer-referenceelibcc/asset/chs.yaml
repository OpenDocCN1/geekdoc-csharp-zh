  \n要判断 `List<T>` 集合中是否存在某个项，你使用 `Exists` 方法。该方法与 `Find` 的相似之处在于它们都接受一个谓词作为参数。谓词依次从集合中传递每个项，如果该项符合某些指定标准，则返回\
