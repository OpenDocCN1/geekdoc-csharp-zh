  \ 9, 8, 7, 6, 5, 4, 3, 2, 1));\n```\n\n9. 在“调试”菜单上，点击“转调试启动”。\n\n验证程序已生成、运行，并在控制台中写入值\
  \ `55`。\n\n10. 按回车关闭应用程序并返回 Visual Studio 2015。\n\n### 比较参数数组和可选参数\n\n第 3 章，“编写方法和应用作用域](#text00008.html_ch03)，”\
  \ 阐述了如何定义接收可选参数的方法。乍一看，使用参数数组的方法与接收可选参数的方法之间似乎存在某种重叠。然而，它们之间存在本质的差异：\n\n![Image](img/Image00001.jpg)\
  \ 接收可选参数的方法仍然有一个固定的参数列表，你不能传递任意的参数列表。编译器会生成代码，在方法运行之前将任何缺失参数的默认值插入到栈中，而且方法本身并不知道哪些参数是调用者提供的，哪些是编译器生成的默认值。\n\
  \n![Image](img/Image00001.jpg) 使用参数数组的方法实际上拥有一组完全任意的参数列表，且其中任何一个参数都没有默认值。此外，方法可以精确地确定调用者提供了多少个参数。\n\
  \n通常情况下，对于可以接收任意数量参数（包括零个）的方法，你会使用参数数组；而只有在不方便强制调用者为每个参数都提供参数时，你才使用可选参数。\n\n最后还有一个值得深思的情况。如果你定义了一个接收参数列表的方法，并提供了一个接收可选参数的重载，当调用语句中的参数列表同时匹配两个方法签名时，并不总是能直观看出将调用哪个版本的方法。你将在本章的最后一个练习中研究这种场景。\n\
  \n比较 `params` 数组和可选参数\n\n1. 返回 Visual Studio 2015 中的 `ParamsArray` 解决方案，并在“代码和文本编辑器”窗口中显示\
  \ `Util.cs` 文件。\n\n2. 在 `Util` 类的 `Sum` 方法开头添加此处加粗所示的 `Console.WriteLine` 语句：\n\n\
  点击此处查看代码图像\n\n```csharp\npublic static int Sum(params int[] paramList)\n{\n    Console.WriteLine(\"\
  Using parameter list\");\n    ...\n}\n```\n\n3. 在 `Util` 类中添加另一个 `Sum` 方法的实现。此版本应该接收四个可选的\
  \ `int` 参数，每个参数的默认值为 0。在方法体中，输出消息“Using optional parameters”，然后计算并返回这四个参数之和。完成后的方法应该如加粗代码所示：\n\
  \n点击此处查看代码图像\n\n```csharp\nclass Util\n{\n    ...\n    public static int Sum(int\
  \ param1 = 0, int param2 = 0, int param3 = 0, int param4 = 0)\n    {\n        Console.WriteLine(\"\
  Using optional parameters\");\n        int sumTotal = param1 + param2 + param3 +\
  \ param4;\n        return sumTotal;\n    }\n}\n```\n\n4. 在“代码和文本编辑器”窗口中显示 `Program.cs`\
  \ 文件。\n\n5. 在 `doWork` 方法中，注释掉现有代码并添加以下语句：\n\n点击此处查看代码图像\n\n```csharp\nConsole.WriteLine(Util.Sum(2,\
  \ 4, 6));\n```\n\n该语句调用了 `Sum` 方法并传递了四个 `int` 参数。这匹配了 `Sum` 的两个重载。\n\n6. 在“调试”菜单上，点击“转调试启动”。\n\
  \n当应用程序运行时，它显示以下消息：\n\nUsing optional parameters\n\n20\n\n编译器生成的代码调用了接收可选参数的方法。\n\
  \n7. 按回车返回 Visual Studio。\n\n8. 在 `doWork` 方法中，如下更改调用 `Sum` 的语句：\n\n点击此处查看代码图像\n\
  \n```csharp\nConsole.WriteLine(Util.Sum(2, 4, 6));\n```\n\n9. 在“调试”菜单上，点击“转调试启动”。\n\
  \n当应用程序运行时，它显示以下消息：\n\nUsing optional parameters\n\n12\n\n即使签名不匹配，编译器仍然生成了调用接收可选参数的方法。在接收可选参数的方法和接收参数列表的方法之间，C#\
  \ 编译器将使用接收可选参数的方法。\n\n10. 按回车返回 Visual Studio。\n\n11. 在 `doWork` 方法中再次更改调用 `Sum`\
  \ 的语句并增加两个参数：\n\n点击此处查看代码图像\n\n```csharp\nConsole.WriteLine(Util.Sum(2, 4, 6, 8,\
  \ 10));\n```\n\n12. 在“调试”菜单上，点击“转调试启动”。\n\n当应用程序运行时，它显示以下消息：\n\nUsing parameter\
  \ list\n\n30\n\n这次提供的参数多于可选参数方法指定的，因此编译器生成的代码调用接收参数数组的方法。\n\n13. 按回车返回 Visual Studio。\n\
  \n### 总结\n\n在本章中，你学习了如何使用 `params` 数组定义一个可以接收任意数量参数的方法。你还了解了如何使用 `object` 类型的 `params`\
  \ 数组创建一个接收任意类型任意数量参数的方法。此外，你还了解了编译器在需要在调用接收参数数组的方法和接收可选参数的方法之间做出选择时如何解析方法调用。\n\n\
