  \ 字段已重命名为 `_size`，且 `locX` 和 `locY` 字段已重命名为 `_x` 和 `_y`。\n\n点击此处查看代码图像\n\n```csharp\n\
  abstract class DrawingShape\n{\n    protected int _size;\n    protected int _x =\
  \ 0, _y = 0;\n    ...\n}\n```\n\n4 在代码和文本编辑器窗口中打开 Drawing 项目的 `IDraw.cs` 文件。此接口指定了\
