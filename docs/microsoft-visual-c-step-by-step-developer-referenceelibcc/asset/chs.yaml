  \ `Program.cs` 文件。注释掉 `doWork` 方法中现有的代码，并添加四条语句执行以下任务：\n\n**a.** 声明一个名为 `wi` 的局部\
  \ `WrappedInt` 变量并将其初始化为 `null`。\n\n**b.** 使用 `Console.WriteLine` 将 `wi` 的值写入控制台。\n\
  \n**c.** 调用 `Pass.Reference`，将 `wi` 作为参数传递。\n\n**d.** 再次将 `wi` 的值写入控制台。\n\n在调用 `Pass.Reference`\
