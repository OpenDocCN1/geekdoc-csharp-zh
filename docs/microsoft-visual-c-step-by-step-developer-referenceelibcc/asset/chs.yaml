  \ `a`、`b` 和 `c` 的语句移动到 `calculateData` 方法开头。以下代码显示了删除了这些代码的 `generateGraphData`\
  \ 方法以及 `calculateData` 方法（不要尝试编译此代码）：\n\n点击此处查看代码图像\n\n```csharp\nprivate void generateGraphData(byte[]\
  \ data)\n{\n    for (int x = 0; x < a; x++)\n    {\n    }\n}\n\nprivate void calculateData(int\
  \ x, byte[] data)\n{\n    int a = pixelWidth / 2;\n    int b = a * a;\n    int c\
  \ = pixelHeight / 2;\n    int s = x * x;\n    double p = Math.Sqrt(b - s);\n   \
  \ for (double i = -p; i < p; i += 3)\n    {\n        double r = Math.Sqrt(s + i\
  \ * i) / a;\n        double q = (r - 1) * Math.Sin(24 * r);\n        double y =\
  \ i / 3 + (q * c);\n        plotXY(data, (int)(-x + (pixelWidth / 2)), (int)(y +\
  \ (pixelHeight / 2)));\n        plotXY(data, (int)(x + (pixelWidth / 2)), (int)(y\
  \ + (pixelHeight / 2)));\n    }\n}\n```\n\n6. 在 `generateGraphData` 方法中，将 `for`\
  \ 循环替换为以下调用静态 `Parallel.For` 方法的语句：\n\n点击此处查看代码图像\n\n```csharp\nprivate void generateGraphData(byte[]\
  \ data)\n{\n    Parallel.For(0, pixelWidth / 2, x => calculateData(x, data));\n\
  }\n```\n\n这段代码是原始 `for` 循环的并行等实现。它遍历从 0 到 `pixelWidth / 2 – 1` 闭区间内的值。每次调用都使用一个任务运行，每个任务可能会运行多次迭代。`Parallel.For`\
  \ 方法仅在它创建的所有任务完成其工作后才会结束。记住，`Parallel.For` 方法期望最后一个参数是一个接受单个整数参数的方法。它将当前循环索引作为参数传递给该方法。在例例中，`calculateData`\
  \ 方法不符合所需的签名，因为它接受两个参数：一个整数和一个字节数组。由于由于原因，代码使用了 Lambda 表达式充当适配器，使用适当参数调用 `calculateData`\
  \ 方法。\n\n7. 在“调试”（Debug）菜单上，点击“启动调试（Start Debugging）”来生成并运行应用程序。\n\n8. 在 Graph Demo\
