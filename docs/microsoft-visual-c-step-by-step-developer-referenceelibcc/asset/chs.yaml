  \ Visual Studio 2015。\n\n## 使用迭代器实现枚举器\n\n如你所见，使集合变为可枚举的过程可能会变得复杂，并且容易出错。为了简化操作，C#\
  \ 提供了迭代器，可以自动处理这一过程的很大一部分。\n\n`迭代器`(iterator) 是一个产生有序值序列的 own 块。迭代器实际上并不是可枚举类的成员；相反，它指定了枚举器在返回值时应该使用的序列。换句话说，迭代器只是对枚举序列的描述，C#\
  \ 编译器可以使用该描述来创建自己的枚举器。这个概念需要稍微思考才能正确理解，因此请考虑下面的简单示例。\n\n### 简单的迭代器\n\n`BasicCollection<T>`\
  \ 类阐释了实现迭代器的原理。该类使用 `List<T>` 对象存储数据，并提供 `FillList` 方法来填充此列表。同时注意，`BasicCollection<T>`\
  \ 类实现了 `IEnumerable<T>` 接口。`GetEnumerator` 方法是通过使用迭代器实现的：\n\n点击此处查看代码图像\n\n```csharp\n\
  using System;\nusing System.Collections.Generic;\nusing System.Collections;\n\n\
  class BasicCollection<T> : IEnumerable<T>\n{\n    private List<T> data = new List<T>();\n\
  \n    public void FillList(params T [] items)\n    {\n        foreach (var datum\
  \ in items)\n        {\n            data.Add(datum);\n        }\n    }\n\n    IEnumerator<T>\
  \ IEnumerable<T>.GetEnumerator()\n    {\n        foreach (var datum in data)\n \
  \       {\n            yield return datum;\n        }\n    }\n\n    IEnumerator\
  \ IEnumerable.GetEnumerator()\n    {\n        // 此示例中未实现\n        throw new NotImplementedException();\n\
  \    }\n}\n```\n\n`GetEnumerator` 方法看起来很简单，但值得仔细检查。首先要注意的一点是，它似乎并没有返回 `IEnumerator<T>`\
  \ 类型。相反，它遍历 `data` 数组中的项，并逐个返回每个项。关键点在于使用了 `yield` 关键字。`yield` 关键字指明了每次迭代应该返回的值。如果有帮助，你可以将\
  \ `yield` 语句认为是在调用了方法的临时挂起，并将一个值传回调用者。当调用者需要下一个值时，`GetEnumerator` 方法将从它离开的地方继续执行，循环并产生下一个值。最终，数据耗尽，循环结束，`GetEnumerator`\
  \ 方法终止。此时，迭代已完成。\n\n请记住，这并不是通常意义上的普通方法。`GetEnumerator` 方法中的代码定义了一个`迭代器`。编译器使用这些代码生成一个包含\
  \ `Current` 方法的 `IEnumerator<T>` 类实现。\n\n#### 使用迭代器为 *Tree<TItem>* 类定义枚举器\n\n在下一个练习中，你将使用迭代器为\
  \ `Tree<TItem>` 类实现枚举器。与之前的练习不同（之前的练习需要通过 `MoveNext` 方法将树中的数据预处理为队列），在这里你可以使用更自然的递归机制来遍历树，类似于在第\
  \ 17 章中讨论的 `WalkTree` 方法。\n\n为 *Tree<TItem>* 类添加枚举器\n\n1. 使用 Visual Studio 2015\
  \ 打开 `BinaryTree` 解决方案，该解决方案位于文档文件夹中的 `\\Microsoft Press\\VCSBS\\Chapter 19\\IteratorBinaryTree`\
  \ 文件夹。该解决方案包含了你在第 17 章创建的 `BinaryTree` 项目的副本。\n\n2. 在代码和文本编辑器窗口中打开 `Tree.cs` 文件。修改\
  \ `Tree<TItem>` 类的定义，使其实现 `IEnumerable<TItem>` 接口，如下**粗体**所示：\n\n点击此处查看代码图像\n\n\
  ```csharp\npublic class Tree<TItem> : IEnumerable<TItem> where TItem : IComparable<TItem>\n\
  {\n    ...\n}\n```\n\n\n\n\n\n**3.** 在类定义中将鼠标悬停在 `IEnumerable<TItem>` 接口上。在出现的下拉上下文菜单中，点击`Implement\
  \ Interface Explicitly`（式接口），将 `IEnumerable<TItem>.GetEnumerator` 和 `IEnumerable.GetEnumerator`\
  \ 方法添加到类的末尾。\n\n**4.** 找到泛型 `IEnumerable<TItem>.GetEnumerator` 方法。将 `GetEnumerator`\
  \ 方法的内容替换为如下代码中加粗所示的内容：\n\n点击此处查看代码图片\n\n```csharp\nIEnumerator<TItem> IEnumerable<TItem>.GetEnumerator()\n\
  {\n    if (this.LeftTree != null)\n    {\n        foreach (TItem item in this.LeftTree)\n\
  \        {\n            yield return item;\n        }\n    }\n    yield return this.NodeData;\n\
  \n    if (this.RightTree != null)\n    {\n        foreach (TItem item in this.RightTree)\n\
  \        {\n            yield return item;\n        }\n    }\n}\n```\n\n乍看之下可能并不明显，但这段代码遵循了你在第\
  \ 17 章中用于列出二叉树内容的相同递归算法。如果 `LeftTree` 不为空，第一个 `foreach` 语句将隐式地对其调用 `GetEnumerator`\
  \ 方法（即你正在定义的方法）。此过程一直持续到找到没有左子树的节点。此时，`NodeData` 属性的值被产生，并以相同的方式检查右子树。当右子树耗尽时，过程将回溯到父节点，输出父节点的\
  \ `NodeData` 属性并检查父节点的右子树。这一系列操作将持续，直到整个树被枚举完毕且所有节点都已输出。\n\n### 测试新的枚举器\n\n**1.**\
