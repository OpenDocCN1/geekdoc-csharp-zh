  \n### 快速参考\n\n![Image](img/Image00114.jpg)![Image](img/Image00115.jpg)\n\n## 第 16\
  \ 章。使用索引器\n\n完成本章后，你将能够：\n\n![Image](img/Image00001.jpg) 使用索引器对对象封装逻辑类数组的访问。\n\n\
  ![Image](img/Image00001.jpg) 通过声明 `get` 访问器来控制索引器的读取访问。\n\n![Image](img/Image00001.jpg)\
  \ 通过声明 `set` 访问器来控制索引器的写入访问。\n\n![![Image](img/Image00001.jpg) 创建声明索引器的接口。\n\n![Image](img/Image00001.jpg)\
  \ 在继承接口的结构体和类中实现索引器。\n\n第 15 章“实现属性以访问字段” 描述了如何实现和使用属性作为对类中字段提供受控访问的手段。属性对于镜像包含单个值的字段非常有用。然而，如果你想对包含多个值的项提供访问，并使用自然且熟悉的语法来实现这一点，那么索引器将是无价之。\n\
  \n### 什么是索引器？\n\n你可以将 `indexer` 认为是一个智能数组，就像你可以将属性视为智能字段一样。属性在类中封装了一个单一值，而索引器则封装了一组值。你用于索引器的语法与你用于数组的语法完全相同。\n\
  \n理解索引器的最佳方法是运行一个示例。首先，你将考虑一个问题并检查一个不使用索引器的解决方案。然后你将处理相同的问题并查看一个使用索引器的更好的解决方案。该问题涉及整数，更准确地说涉及\
  \ `int` 类型。\n\n#### 一个不使用索引器的示例\n\n你通常使用 `int` 来存储整数值。在内部，`int` 将其值存储为 32 位的序列，其中每个位可以是\
  \ 0 或 1。大多数情况下，你并不关心这种内部的二进制表示；你只需要使用 `int` 即可。\n\n\n\n你可以结合使用这些运算符来确定 `int` 中每个位的值。例如，以下表达式使用了左移\
  \ (`<<`) 和按位与 (`&`) 运算符，用以判断名为 `bits` 的 `byte` 变量从右数起第六个位是被设置为 `0` 还是 `1`：\n\n```csharp\n\
  (bits & (1 << 5)) != 0\n```\n\n***\n\n![Image](img/Image00005.jpg) 注意\n\n按位运算符从右到左计算位的位置，且位从\
  \ `0` 开始编号。因此，位 `0` 是最右侧的位，而位置 `5` 的位是从右数起第六个位。\n\n***\n\n假设变量 `bits` 包含十进制值 `42`。在二进制中，它是\
  \ `00101010`。十进制值 `1` 在二进制中是 `00000001`，而表达式 `1 << 5` 的值为 `00100000`；第六个位是 `1`。在二进制中，表达式\
  \ `bits & (1 << 5)` 是 `00101010 & 00100000`，该表达式的值为二进制 `00100000`，即非零。如果变量 `bits`\
  \ 包含值 `65`（即二进制的 `01000001`），则表达式的值为 `01000001 & 00100000`，得到二进制结果 `00000000`，即零。\n\
  \n这是一个相当复杂的例子，但与下面的表达式相比就显得微不足道了，后一个表达式使用了复合赋值运算符 `&=` 将位置 6 的位设置为 `0`：\n\n```csharp\n\
  bits &= ~(1 << 5)\n```\n\n同样，如果你想将位置 6 的位设置为 `1`，可以使用按位或 (`|`) 运算符。下面的复杂表达式基于复合赋值运算符\
  \ `|=`：\n\n```csharp\nbits |= (1 << 5)\n```\n\n这些示例的麻烦之处在于，尽管它们可以工作，但理解起来极其困难。它们非常复杂，而且解决方案是极其底层的：它未能为所解决的问题创建一个抽象，因此维护执行此类操作的代码会非常困难。\n\
  \n### 使用索引器的相同示例\n\n让我们暂时跳出上述底层的解决方案，记住问题所在。你希望将一个 `int` 不仅仅看作 `int`，而是看作一个位数组。因此，解决这个问题的最好方法是将\
  \ `int` 像位数组一样使用；换句话说，为了访问 `bits` 变量中从右数起第六个位，你希望能够写出如下表达式（记住数组从索引 0 开始）：\n\n```csharp\n\
  bits[5]\n```\n\n并且，为了将从右数起第四个位设置为 `true`，你希望能够写出：\n\n```csharp\nbits[3] = true\n\
  ```\n\n***\n\n![Image](img/Image00005.jpg) 注意\n\n对于资深的 C 开发者来说，布尔值 `true` 与二进制值\
  \ `1` 同义，布尔值 `false` 与二进制值 `0` 同义。因此，表达式 `bits[3] = true` 意味着“将 `bits` 变量从右数起第四个位设置为\
  \ 1”。\n\n***\n\n遗憾的是，你不能在 `int` 上使用方括号符号；它仅适用于数组或行为类似于数组的类型。因此，解决该问题的方案是创建一个新类型，其行为像、感觉像且用起来像一个\
  \ `bool` 变量数组，但通过使用 `int` 实现。你可以通过定义索引器来实现这一目标。我们将这个新类型命名为 `IntBits`。`IntBits` 将包含一个\
  \ `int` 值（在构造函数中初始化），但思路是将 `IntBits` 作为 `bool` 变量数组使用。\n\n***\n\n![Image](img/Image0013.jpg)\
  \ 提示\n\n`IntBits` 类型很小且轻量，因此将其作为结构体（struct）而不是类（class）是合理的。\n\n***\n\n点击此处查看代码图像\n\
  \n```csharp\nstruct IntBits\n{\n    private int bits;\n\n    public IntBits(int\
  \ initialBitValue)\n    {\n        bits = initialBitValue;\n    }\n    // 在此处编写索引器\n\
  }\n```\n\n要定义索引器，你使用一种属性和数组之间的符号。你通过 `this` 关键字引入索引器，指定索引器返回值的类型，并指定用于方括号内作为索引的值的类型。`IntBits`\
  \ 结构体的索引器使用整数作为其索引类型并返回布尔值。它看起来如下：\n\n点击此处查看代码图像\n\n```csharp\nstruct IntBits\n\
  {\n    ...\n    public bool this [int index]\n    {\n        get\n        {\n  \
  \          return (bits & (1 << index)) != 0;\n        }\n        set\n        {\n\
  \            if (value) // 如果 value 为 true 则开启位；否则关闭位\n                bits |= (1\
  \ << index);\n            else\n                bits &= ~(1 << index);\n       \
  \ }\n    }\n}\n```\n\n\n\n当您使用索引器（indexer）时，其语法刻意非常像数组。然而，索引器和数组之间存在一些重要的区别：\n\n\
  ![Image](img/Image00001.jpg) 索引器可以使用非数字下标，例如字符串（如下例所示），而数组只能使用整数下标。\n\n点击此处查看代码图片\n\
  \n```\npublic int this [ string name ] { ... } // OK\n```\n\n![Image](img/Image00001.jpg)\
  \ 索引器可以被重载（就像方法一样），而数组则不能。\n\n点击此处查看代码图片\n\n```\npublic Name this [ PhoneNumber\
  \ number ] { ... }\n\npublic PhoneNumber this [ Name name ] { ... }\n```\n\n![Image](img/Image00001.jpg)\
  \ 索引器不能用作 `ref` 或 `out` 参数，但数组元素可以。\n\n点击此处查看代码图片\n\n```\nIntBits bits; // bits\
  \ contains an indexer\n\nMethod(ref bits[1]); // compile-time error\n```\n\n***\n\
  \n# 属性、数组和索引器\n\n属性可以返回一个数组，但请记住数组是引用类型，因此将数组作为属性暴露会产生意外覆盖大量数据的可能性。查看下面的结构体，它暴露了一个名为\
  \ `Data` 的数组属性：\n\n点击此处查看代码图片\n\n```cs\nstruct Wrapper\n{\n    private int[] data;\n\
  \    ...\n    public int[] Data\n    {\n        get { return this.data; }\n    \
  \    set { this.data = value; }\n    }\n}\n```\n\n现在，考虑以下使用该属性的代码：\n\n```cs\nWrapper\
  \ wrap = new Wrapper();\n...\nint[] myData = wrap.Data;\n\nmyData[0]++;\nmyData[1]++;\n\
  ```\n\n这看起来是完全无害的。然而，因为数组是引用类型，变量 `myData` 指向与 `Wrapper` 结构体中的私有变量 `data` 相同的对象。您对\
  \ `myData` 元素所做的任何更改都会应用到 `data` 数组上；表达式 `myData[0]++` 的效果与 `data[0]++` 完全相同。如果这不是您的意图，您应该在\
  \ `Data` 属性的 `get` 和 `set` 访问器中使用 `Clone` 方法来返回 `data` 数组的副本，或者对被设置的值进行复制，如下文代码所示（第\
  \ 8 章，“理解值和引用](#text00014.html_ch08)” 讨论了用于复制数组的 `Clone` 方法）。注意，`Clone` 方法返回一个对象，您必须将其强制转换为整数数组。\n\
  \n点击此处查看代码图片\n\n```cs\nstruct Wrapper\n{\n    private int[] data;\n    ...\n   \
  \ public int[] Data\n    {\n        get { return this.data.Clone() as int[]; }\n\
  \        set { this.data = value.Clone() as int[]; }\n    }\n}\n```\n\n然而，这种方法在内存使用上可能会变得非常混乱且昂贵。索引器为此问题提供了一个自然的解决方案——不要将整个数组暴露为属性；只需通过索引器提供其单个元素即可：\n\
  \n点击此处查看代码图片\n\n```cs\nstruct Wrapper\n{\n    private int[] data;\n    ...\n   \
  \ public int this [int i]\n    {\n        get { return this.data[i]; }\n       \
  \ set { this.data[i] = value; }\n    }\n}\n```\n\n以下代码使用索引器的方式与之前所示的属性类似：\n\n```cs\n\
  Wrapper wrap = new Wrapper();\n...\nint[] myData = new int[2];\nmyData[0] = wrap[0];\n\
  myData[1] = wrap[1];\nmyData[0]++;\nmyData[1]++;\n```\n\n这一次，递增 `myData` 数组中的值不会影响\
  \ `Wrapper` 对象中的原始数组。如果您确实想修改 `Wrapper` 对象中的数据，您必须编写类似这样的语句：\n\n```cs\nwrap[0]++;\n\
  ```\n\n这要清晰得多且安全得多！\n\n***\n\n### 接口中的索引器\n\n您可以在接口中声明索引器。要做到这一点，请指定 `get` 关键字、`set`\
  \ 关键字或两者，但将 `get` 或 `set` 访问器的体替换为分号。任何实现接口的类或结构体必须实现接口中声明的 `indexer` 访问器，此处所示：\n\
  \n点击此处查看代码图片\n\n```cs\ninterface IRawInt\n{\n    bool this [ int index ] { get;\
  \ set; }\n}\n\nstruct RawInt : IRawInt\n{\n    ...\n    public bool this [ int index\
  \ ]\n    {\n        get { ... }\n        set { ... }\n    }\n    ...\n}\n```\n\n\
  如果您在类中实现接口索引器，可以将索引器实现声明为 `virtual`。这允许进一步的派生类覆盖 `get` 和 `set` 访问器，如下：\n\n点击此处查看代码图片\n\
  \n```cs\nclass RawInt : IRawInt\n{\n    ...\n    public virtual bool this [ int\
  \ index ]\n    {\n        get { ... }\n        set { ... }\n    }\n}\n```\n\n您也可以通过\
  \ 第 13 章 中涵盖的语法来显式实现索引器：\n\n```cs\nstruct RawInt : IRawInt\n{\n    bool IRawInt.this[int\
  \ index]\n    {\n        get ...\n    }\n}\n```\n\n### 在 Windows 应用程序中使用索引器\n\n\
  在下面的练习中，您将检查一个简单的电话簿应用程序并完成其实现。您将在 `PhoneBook` 类中编写两个索引器：一个接受 `Name` 参数并返回 `PhoneNumber`，另一个接受\
  \ `PhoneNumber` 参数并返回 `Name`。您还需要在正确的位置调用这些索引器。\n\n1. 如果尚未运行，请启动 Visual Studio 2015。\n\
  2. 打开 Indexers 项目，位于 `Microsoft Press\\Chapter16\\Indexers`。\n3. 在调试菜单上点击调试。\n\n\
  项目编译并运行。出现了一个表单，显示了 Name 和 Phone Number 文本框。表单最初显示两个按钮：一个根据名称查找电话号码，另一个根据电话号码查找名称。扩展表单底部的命令行栏会出现\
  \ Add 按钮，它可以添加另一个名称/号码对。所有按钮（包括 Add 按钮）目前都没有作用。应用程序如下：\n\n![Image](img/Image0116.jpg)\n\
  \n您的任务是完成应用程序使按钮能够工作。\n\n4. 返回 Visual Studio 2015 并停止调试。\n5. 在代码窗口中显示 Indexers 项目的\
  \ `Name.cs` 文件。检查 `Name` 结构体。它的目的是名称的容器。\n\n名称作为字符串提供构造函数。可以通过名为 `Text` 的只读属性检索名称。（`Equals`\
  \ 和 `GetHashCode` 方法用于在遍历 `Name` 值的数组时比较 `Name`——您现在可以忽略它们。）\n6. 在代码窗口中显示 `PhoneNumber.cs`\
  \ 文件并检查 `PhoneNumber` 结构体。\n7. 在代码窗口中显示 `PhoneBook.cs` 文件并检查 `PhoneBook` 类。\n\n\
  该类包含两个私有数组：一个 `Name` 值的数组 `names`，和一个 `PhoneNumber` 值的数组 `phoneNumbers` 。`PhoneBook`\
  \ 类还包含一个 `Add` 方法，可以将电话号码和名称添加到电话簿中。该方法在用户点击表单上的 Add 按钮时调用。`enlargeIfFull` 方法由 `Add`\
  \ 调用，以便在用户添加其他条目时检查数组是否已满。\n\n\n\n\n`Add` 方法被刻意保持得简单，它不会检查名称或电话号码是否已添加到电话录中。\n\n\
  `PhoneBook` 类目前没有提供任何允许用户查找名称或电话号码的功能；你将在下一次练习中添加两个索引器来提供此功能。\n\n## 编写索引器\n\n**1.**\
  \ 在 `PhoneBook.cs` 文件中，删除注释 `// TODO: write 1st indexer here`，并将其替换为用于 `PhoneBook`\
  \ 类的公共只读索引器，如下所示代码中**粗体**部分所示。该索引器应该返回一个 `Name`，并接受一个 `PhoneNumber` 项作为其索引。将 `get`\
  \ 访问器的主体留空。\n\n索引器应该像这样所示：\n\n点击此处查看代码图片\n\n```csharp\nsealed class PhoneBook\n\
  {\n    ...\n\n    public Name this[PhoneNumber number]\n    {\n        get\n   \
  \     {\n\n        }\n    }\n    ...\n}\n```\n\n**2.** 按照后续代码中**粗体**所示的方式实现 `get`\
  \ 访问器。\n\n该访问器的目的是找到与指定电话号码匹配的名称。要实现这一点，你需要调用 `Array` 类的静态方法 `IndexOf`。`IndexOf`\
  \ 方法对数组进行搜索，返回数组中第一个匹配指定值的项的索引。`IndexOf` 的第一个参数是要搜索的数组（`phoneNumbers`）。`IndexOf`\
  \ 的第二个参数是你正在搜索的项。如果 `IndexOf` 找到了该元素，它将返回该元素的整数索引；否则，`IndexOf` 返回 `-1`。如果索引器找到了电话号码，它应该返回相应的名称，否则，它应该返回一个空的\
  \ `Name` 值。（注意 `Name` 是一个结构，因此默认构造函数会将将其私有的 `name` 字段设置为 `null`。）\n\n点击此处查看代码图片\n\
  \n```csharp\nsealed class PhoneBook\n{\n    ...\n\n    public Name this [PhoneNumber\
  \ number]\n    {\n        get\n        {\n            int i = Array.IndexOf(this.phoneNumbers,\
  \ number);\n            if (i != -1)\n            {\n                return this.names[i];\n\
  \            }\n            else\n            {\n                return new Name();\n\
  \            }\n        }\n    }\n    ...\n}\n```\n\n**3.** 删除注释 `// TODO: write\
  \ 2nd indexer here`，并将其替换为用于 `PhoneBook` 类的第二个公共只读索引器，该索引器返回一个 `PhoneNumber` 并接受单个\
  \ `Name` 参数。以与第一个索引器相同的方式实现此索引器。（再次注意，`PhoneNumber` 是一个结构，因此始终有一个默认构造函数。）\n\n第二个索引器应该像这样所示：\n\
  \n点击此处查看代码图片\n\n```csharp\nsealed class PhoneBook\n{\n    ...\n\n    public PhoneNumber\
  \ this [Name name]\n    {\n        get\n        {\n            int i = Array.IndexOf(this.names,\
  \ name);\n            if (i != -1)\n            {\n                return this.phoneNumbers[i];\n\
  \            }\n            else\n            {\n                return new PhoneNumber();\n\
  \            }\n        }\n    }\n    ...\n}\n```\n\n注意，这些重载索引器可以共存，因为它们的签名类型不同。如果将\
  \ `Name` 和 `PhoneNumber` 替换为简单的字符串，重载将无法编译。\n\n**4.** 在 Build 菜单上，点击 Build，并修正任何错误。\n\
  \n## 调用索引器\n\n**1.** 在 `PhoneBook.cs` 文件中，找到 `findByName` 方法。`findByName` 方法在点击\
  \ Name 按钮时被调用。该方法目前为空。你需要按照以下方式实现它：\n\n**a.** 从 `name` 框中读取 `Text` 属性的值。这是一个包含名称的字符串。\n\
  \n**b.** 如果字符串不为空，使用索引器在 `PhoneBook` 中搜索与该号码对应的名称。\n\n**c.** 将索引器返回的 `Name` 结构的\
  \ `Text` 属性写入 `phoneNumber` 框中。\n\n完成的方法应该像这样所示：\n\n点击此处查看代码图片\n\n```csharp\nprivate\
  \ void findByName(object sender, RoutedEventArgs e)\n{\n    string text = name.Text;\n\
  \    if (!String.IsNullOrEmpty(text))\n    {\n        Name personsName = this.phoneBook[text];\n\
  \        phoneNumber.Text = String.IsNullOrEmpty(personsName.Text) ? \"Not Found\"\
  \ : personsName.Text;\n    }\n}\n```\n\n除了该语句，还有两个值得关注的点：\n\n- `String.IsNullOrEmpty`\
  \ 方法用于判断字符串是否为空。如果字符串为 null 或空，它返回 `true`；否则返回 `false`。\n- `?:` 运算符相当于内联 `if...else`\
  \ 语句。它接受三个操作数：布尔表达式、为真时返回的表达式，以及为假时返回的另一个表达式。\n\n**2.** 在 `PhoneBook.cs` 文件中，找到\
  \ `findByPhoneNumberClick` 方法。`findByPhoneNumberClick` 方法在点击 Phone Number 按钮时被调用。除了\
  \ `// TODO:` 注释外，该方法目前为空。你需要按照以下方式实现（完成的代码已**粗体**所示）：\n\n**a.** 从 `phoneNumber`\
  \ 框中读取 `Text` 属性的值。这是一个包含用户输入的电话号码的字符串。\n\n**b.** 如果字符串不为空，使用索引器在 `PhoneBook` 中搜索与该号码对应的名称。\n\
  \n**c.** 将索引器返回的 `Name` 结构的 `Text` 属性写入 `name` 框中。\n\n完成的方法像这样所示：\n\n点击此处查看代码图片\n\
  \n```csharp\nprivate void findByPhoneNumberClick(object sender, RoutedEventArgs\
  \ e)\n{\n    string text = phoneNumber.Text;\n    if (!String.IsNullOrEmpty(text))\n\
  \    {\n        PhoneNumber personsPhoneNumber = new PhoneNumber(text);\n      \
  \  Name personsName = this.phoneBook[personsPhoneNumber];\n        name.Text = String.IsNullOrEmpty(personsName.Text)\
  \ ? \"Not Found\" : personsName.Text;\n    }\n}\n```\n\n## 测试应用程序\n\n**1.** 在 Debug\
  \ 菜单上，点击 Start Debugging。\n\n**2.** 在相应的的框中输入你的名称和电话号码，然后展开命令栏并点击 Add。（你可以通过点击省略号来展开命令栏。）\n\
  \n当你点击 Add 按钮时，`Add` 方法会将信息存储在电话录中并清空文本框，以便进行搜索。\n\n\n\n\n\n### 3. 重复步骤 2 几次，使用不同的名称和电话号码，以便电话录包含若干条目。注意，应用程序不会对你输入的名称和电话号码进行任何检查，你可以多次输入相同的名称和电话号码。为了演示起见，避免混淆，请务必提供不同的名称和电话号码。\n\
  \n### 4. 在 `Name` 框中输入你在步骤 3 中使用的名称，然后点击 `Find By Name`（按名称查找）。\n\n你在步骤 3 中为该联系人添加的电话号码将从电话录中检索并显示在\
