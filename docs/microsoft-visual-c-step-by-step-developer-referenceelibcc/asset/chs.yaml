  \n## 16. 测试其他日期，并验证结果是否符合预期。完成后返回 Visual Studio 2015 并停止调试。\n\n***\n\n## 在实际应用中比较日期\n\
  \n现在你已经了解了如何使用一系列相当长且复杂的 `if` 和 `else` 语句，我应该提到，这并不是你在真实世界应用中比较日期时会采用的技术。如果你查看从上一个练习中的\
  \ `dateCompare` 方法，你会发现两个参数 `leftHandSide` 和 `rightHandSide` 是 `DateTime` 值。你编写的逻辑只比较了这些参数的日期部分，但它们还包含你没有考虑（或显示）的时间元素。要使两个\
  \ `DateTime` 值被视为相等，它们不仅应该具有相同的日期，还应该具有相同。比较日期和时间是一个如此常见的的操作，以至于 `DateTime` 类型实际上有一个名为\
  \ `Compare` 的内置方法专门执行此操作：它接受两个 `DateTime` 参数并进行比较，返回一个值表示第一个参数是否小于第二个参数（在这种情况下结果为负），第一个参数是否大于第二个参数（在这种情况下结果为正），或者两个参数是否代表相同的日期和时间（在这种情况下结果为\
  \ 0）。\n\n### 使用 `switch` 语句\n\n有时当你编写级联 `if` 语句时，每个 `if` 语句看起来都很相似，因为它们都在评估相同的表达式。唯一的区别是每个\
  \ `if` 都会将表达式的结果与不同的值进行比较。例如，考虑以下代码块，它使用 `if` 语句来检查 `day` 变量的值并计算出是星期几：\n\n```java\n\
  if (day == 0)\n{\n    dayName = \"Sunday\";\n}\nelse if (day == 1)\n{\n    dayName\
  \ = \"Monday\";\n}\nelse if (day == 2)\n{\n    dayName = \"Tuesday\";\n}\nelse if\
  \ (day == 3)\n{\n...\n}\nelse\n{\n    dayName = \"Unknown\";\n}\n```\n\n在这些情况下，你可以将级联\
  \ `if` 语句重写为 `switch` 语句，以使程序更高效、更易读。\n\n#### 理解 `switch` 语句语法\n\n`switch` 语句的语法如下（`switch`、`case`\
  \ 和 `default` 是关键字）：\n\n点击此处查看代码图片\n\n```java\nswitch ( controllingExpression )\n\
  {\n    case constantExpression :\n        statements\n        break;\n    case constantExpression\
  \ :\n        statements\n        break;\n    ...\n    default :\n        statements\n\
  \        break;\n}\n```\n\n`controllingExpression` 必须在括号内，会被评估一次。然后控制流跳转到由与其相等的\
  \ `constantExpression` 标识的代码块。`constantExpression` 标识符也称为 `case`。执行一直持续到 `break`\
  \ 语句，此时 `switch` 语句结束；程序继续执行 `switch` 语句右括号之后的第一条语句。如果 `controllingExpression` 的值不匹配任何\
  \ `constantExpression` 且没有 `default` 标签，程序执行将从 `switch` 语句右括号之后的语句继续。\n\n\n\n\n\
  `break` 语句是停止贯穿（fall-through）最常见的方法，但你也可以使用 `return` 语句退出包含 `switch` 语句的方法，或者使用\
  \ `throw` 语句生成异常并终止 `switch` 语句。`throw` 语句在第 6 章“管理错误和异常 ””中有所描述。\n\n## switch 贯穿规则\n\
  \n因为如果在 `case` 标签之间存在任何中间代码，你就无法从一个 `case` 标签意外穿到下一个标签，因此你可以自由地调整 `switch` 语句的各个部分，而不会影响其含义（包括\
  \ `default` 标签，按照惯例，它通常——但不必——被放在最后一个标签）。\n\nC 和 C++ 程序员应该注意，`switch` 语句中的每个 `case`\
  \ 必须强制使用 `break` 语句（即使是 `default` 情况也是如此）。这一要求是一件好事——在 C 或 C++ 程序中，忘记 `break` 语句是很常见的现象，这会导致执行贯穿到下一个标签，从而产生难以发现的错误。\n\
  \n如果你确实想这样做，可以使用 `goto` 语句跳转到下一个 `case` 或 `default` 标签，在 C# 中模拟 C/C++ 的贯穿。不过，通常不建议使用\
  \ `goto`，本书也不会教你如何实现。\n\n在接下来的练习中，你将完成一个程序，该程序读取字符串的字符并将每个字符映射到它的 XML 表示。例如，左尖角字符\
  \ `<` 在 XML 中具有特殊含义（它被用于构建元素）。如果你有包含该字符的数据，必须将其转换为文本实体 `&lt;`，以便 XML 处理器知道它是数据而不是\
  \ XML 指令的一部分。类似的规则也适用于右尖角字符（`>`）、安培符号（`&`）、单引号（`‘`）和双引号（`“`）字符。你将编写一个 `switch` 语句来测试字符的值，并将特殊的\
  \ XML 字符捕获为 `case` 标签。\n\n### 编写 switch 语句\n\n**1.** 如果 Visual Studio 2015 尚未运行，请启动它。\n\
  \n**2.** 打开 `SwitchStatement` 项目，它位于文档文件夹中的 `\\Microsoft Press\\VCSBS\\Chapter 4\\\
  SwitchStatement` 文件夹下。\n\n**3.** 在调试（Debug）菜单上，点击启动调试（Start Debugging）。\n\nVisual\
  \ Studio 2015 构建并运行应用程序。该应用程序显示一个包含两个文本框的表单，它们由一个复制按钮分开。\n\n**4.** 在上方文本框中输入以下示例文本：\n\
  \n`inRange = (lo <= number) && (hi >= number);`\n\n**5.** 点击复制（Copy）。\n\n语句被逐字复制到下方的文本框中，且不对\
  \ `<`, `&` 或 `>` 字符进行任何翻译，如下所示。\n\n![Image](img/Image00053.jpg)\n\n**6.** 返回 Visual\
  \ Studio 2015 并停止调试。\n\n**7.** 在代码和文本编辑器（Code and Text Editor）窗口中显示 `MainPage.xaml.cs`\
  \ 的代码，并找到 `copyOne` 方法。\n\n`copyOne` 方法将指定的输入参数指定的字符复制到下方文本框显示文本的末尾。目前，`copyOne`\
  \ 包含一个带有 `default` 动作的 `switch` 语句。在接下来的几步中，将修改此 `switch` 语句，将 XML 中有意义的字符转换为它们的\
  \ XML 映射。例如，`<` 字符将被转换为字符串 `&lt;`。\n\n**8.** 在 `switch` 语句的左大括号之后、`default` 标签之前，添加以下粗体显示的语句：\n\
  \n点击此处查看代码图像\n\n```csharp\nswitch (current)\n{\ncase '<' :\n    target.Text += \"\
  &lt;\";\n    break;\ndefault:\n    target.Text += current;\n    break;\n}\n```\n\
  \n如果正在复制的当前字符是左尖角 `<`，则前面的代码会在输出文本中在其处追加字符串 `\"&lt;\"`。\n\n**9.** 在你刚刚添加的 `break`\
  \ 语句之后、`default` 标签之前，向 `switch` 语句中添加以下语句：\n\n```csharp\ncase '>' :\n    target.Text\
  \ += \"&gt;\";\n    break;\ncase '&' :\n    target.Text += \"&amp;\";\n    break;\n\
  case '\\\"' :\n    target.Text += \"&#34;\";\n    break;\ncase '\\'' :\n    target.Text\
  \ += \"&#39;\";\n    break;\n```\n\n![Image](img/Image00005.jpg) 注意\n\n单引号（`‘`）和双引号（`“`）在\
  \ C# 中具有特殊含义——它们被用于界定字符和字符串常量。最后两个 `case` 标签中的反斜杠（`\\`）是转义字符，会导致 C# 编译器将这些字符字字量而不是分隔符。\n\
  \n**10.** 在调试（Debug）菜单上，点击启动调试。\n\n**11.** 在上方文本框中输入以下文本：\n\n`inRange = (lo <= number)\
  \ && (hi >= number);`\n\n**12.** 点击复制。\n\n语句被复制到下方文本框中。这次，每个字符都经历了 `switch` 语句中实现的\
  \ XML 映射。目标文本框显示以下文本：\n\n`inRange = (lo &lt;= number) &amp;&amp; (hi &gt;= number);`\n\
  \n**13.** 使用字符 `>`, `&`、`“` 和 `‘` 进行实验以验证它们处理正确。\n\n**14.** 返回 Visual Studio 并停止调试。\n\
  \n### 总结\n\n在本章中，你学习了表达式和变量。你了解如何使用 `if` 和 `switch` 语句进行决策，并通过逻辑运算符组合了布尔表达式。Image\
  \ 如果你想继续，请转到第 5 章“复合赋值和迭代语句” ”\n\n### 快速参考\n\n![Image0054.jpg)\n\n## 使用复合赋值语句\n\n\
  在本章之后，你将能够：\n\n- 使用复合赋值运算符更新变量的值。\n- 编写 `while`、`for` 和 `do` 迭代语句。\n- 单步执行 `do`\
  \ 语句并观察变量的变化。\n\n\n\n\n虽然这个语句可以工作，但你可能永远不会看到经验丰富的程序员像这样写代码。给变量增加值是非常常见的操作，因此 `C#`\
  \ 提供了一种方法，让你通过使用运算符 `+=` 以一种简便的方式完成此任务。要向 `answer` 添加 42，你可以编写以下语句：\n\n```csharp\n\
  answer += 42;\n```\n\n你可以使用这种表示法将任何算术运算符与赋值运算符结合起来，如下表所示。这些运算符统称为 `复合赋值运算符`（compound\
  \ assignment operators）。\n\n![Image](img/Image00055.jpg)\n\n* * *\n\n![Image](img/Image000113.jpg)\
  \ 提示\n\n复合赋值运算符与简单赋值运算符 `=` 具有相同的优先级和右结合性。\n\n* * *\n\n`+=` 运算符也适用于字符串；它将一个字符串附加到另一个字符串的末尾。例如，以下代码会在控制台上显示“Hello\
  \ John”：\n\n```csharp\nstring name = \"John\";\nstring greeting = \"Hello \";\n\
  greeting += name;\nConsole.WriteLine(greeting);\n```\n\n你不能在字符串上使用任何其他复合赋值运算符。\n\
  \n* * *\n\n![Image](img/Image000113.jpg) 提示\n\n当变量加 1 或减 1 时，使用递增（`++`）和递减（`--`）运算符代替复合赋值运算符。例如，将\n\
  \n```csharp\ncount += 1;\ncount++;\n```\n\n* * *\n\n### 编写 while 语句\n\n你使用 `while`\
  \ 语句在某个条件为真时重复运行某个语句。`while` 语句的语法如下：\n\n```csharp\nwhile ( booleanExpression )\n\
  statement\n```\n\n布尔表达式（必须括在括号内）会被求值，如果为真，则执行语句，然后再次评估布尔表达式。如果表达式仍然为真，则重复语句，然后再次评估布尔表达式。这个过程一直持续，直到布尔表达式求值为假，此时\
  \ `while` 语句退出。执行程序将从 `while` 语句之后的第一个语句继续进行。`while` 语句与 `if` 语句具有以下语法相似性（事实上，除了关键字外，语法是相同的）：\n\
  \n![Image](img/Image00001.jpg) 表达式必须是一个布尔表达式。\n\n![Image](img/Image00001.jpg) 布尔表达式必须在括号内。\n\
  \n![Image](img/Image00001.jpg) 如果布尔表达式在第一次求值时为假，则不执行语句。\n\n![Image](img/Image00001.jpg)\
  \ 如果你想在 `while` 语句控制下执行两个或多个语句，必须使用大括号将这些语句分组在一个块中。\n\n这是一个向控制台写入 0 到 9 值的 `while`\
  \ 语句。注意，一旦变量 `i` 达到值 10，`while` 语句就会结束，语句块中的代码不再执行：\n\n```csharp\nint i = 0;\nwhile\
  \ (i < 10)\n{\n    Console.WriteLine(i);\n    i++;\n}\n```\n\n所有的 `while` 语句应该在某处终止。初学者常见的错误是忘记包含一个语句来使布尔表达式最终求值为假并终止循环，导致程序无限运行。在示例中，`i++;`\
  \ 语句承担了这一角色。\n\n* * *\n\n![Image](img/Image00005.jpg) 注意\n\n`while` 循环中的变量 `i` 控制循环执行的次数。这是一种常见的用法，执行此角色的变量有时被称为\
  \ `哨兵`（sentinel）变量。你还可以创建嵌套循环（一个循环内部另一个循环），在这种情况下，通常会将这种命名模式扩展，使用字母 `j`、`k` 甚至 `l`\
  \ 作为控制这些循环迭代的哨兵变量名。\n\n* * *\n\n* * *\n\n![Image](img/Image000113.jpg) 提示\n\n与 `if`\
  \ 语句一样，建议在使用 `while` 语句时始终使用块，即使该块中只包含一个语句。这样，如果你以后决定向 `while` 结构体中添加更多语句，就很清楚你应该将它们添加到块中。如果不这样做，只有紧跟\
  \ `while` 结构中布尔表达式之后的第一个语句将作为循环的一部分执行，从而导致难以察觉的错误，例如：\n\n```csharp\nint i = 0;\n\
  while (i < 10)\n    Console.WriteLine(i);\n    i++;\n```\n\n这段代码会无限迭代，显示无限个零，因为只有\
  \ `Console.WriteLine` 语句——而不是 `i++;` 语句——被作为 `while` 结构的一部分执行。\n\n* * *\n\n在下面的练习中，你将编写一个\
  \ `while` 循环来逐行遍历文本文件的内容，并将每行写入表单的文本框中。\n\n### 编写 while 语句\n\n**1.** 使用 Microsoft\
  \ Visual Studio 2015，打开 `WhileStatement` 项目，它位于你文档文件夹中的 `Microsoft Press\\VCSBS\\\
  Chapter 5\\WhileStatement` 文件夹中。\n\n**2.** 在调试（Debug）菜单上，点击“启动调试”（Start Debugging）。\n\
  \nVisual Studio 2015 构建并运行应用程序。该应用程序是一个简单的文本文件查看器，你可以用它选择文本文件并显示其内容。\n\n**3.** 点击“打开文件”（Open\
  \ File）。\n\n出现文件选择器并显示文档文件夹中的文件，如下所示。\n\n![Image](img/Image00056.jpg) 你可以使用此对话框选择文件。\n\
  \n**4.** 移动到文档文件夹中的 `Microsoft Press\\VCSBS\\Chapter 5\\WhileStatement` 文件夹。\n\n\
  **5.** 选择 `MainPage.xaml.cs`，然后点击打开。\n\n文件名 `MainPage.xaml.cs` 显示在表单顶部文本框中，但文件内容没有显示。这是因为你还没有实现读取文件的代码。\n\
  \n**6.** 返回 Visual Studio 2015 并停止调试。\n\n**7.** 显示 `MainPage.xaml.cs` 的代码，并找到 `openFileClick`\
  \ 方法。\n\n该方法在用户点击按钮选择文件时运行。此时你不需要理解该方法的具体细节——只需接受它会提示用户选择文件即可。\n\n然而，`openFileClick`\
  \ 方法的最后两个语句是重要的。它们看起来如下：\n\n```csharp\nTextReader reader = new StreamReader(inputStream.AsStreamForRead());\n\
  displayData(reader);\n```\n\n第一个语句声明了一个名为 `reader` 的 `TextReader` 变量。`TextReader`\
  \ 是一个类用于从文件等源读取字符流。它位于 `System.IO` 命名空间。此语句使得用户在 `FileOpenPicker` 中指定的文件对 `TextReader`\
  \ 对象可用，然后可以使用它读取数据。最后一个语句调用了名为 `displayData` 的方法，并将 `reader` 作为参数传递给该方法。\n\n**8.**\
  \ 检查 `displayData` 方法。它目前看起来是这样的：\n\n```csharp\nprivate void displayData(TextReader\
  \ reader)\n{\n    // TODO: add while loop here\n}\n```\n\n你可以看到，除了注释外，该方法目前是空的。你需要在这里添加获取和显示数据的代码。\n\
  \n**9.** 将 `// TODO: add while loop here` 注释替换为以下语句：\n\n```csharp\nsource.Text =\
  \ \"\";\n```\n\n\n\n\n`source` 变量指向表单上的大型文本框。将它的 `Text` 属性设置为空字符串（`\"\"`）可以清除此文本框中当前显示的任何文本。\n\
  \n**10.** 在 `displayData` 方法中你添加的上一行代码之后，添加以下语句：\n\n点击此处查看代码图片\n\n```cs\nstring\
  \ line = reader.ReadLine();\n```\n\n此语句声明了一个名为 `line` 的 `string` 变量，并调用 `reader.ReadLine`\
  \ 方法从文件中读取第一行并将其存入该变量。该方法返回文件的下一行文本，或者在没有更多行可读时，返回一个名为 `null` 的特殊值。\n\n**11.** 在\
  \ `displayData` 方法中，在你刚刚输入的代码之后，添加以下语句语句：\n\n点击此处查看代码图片\n\n```cs\nwhile (line !=\
  \ null)\n{\n    source.Text += line + '\\n';\n    line = reader.ReadLine();\n}\n\
  ```\n\n这是一个 `while` 循环，它逐行遍历文件，直到没有更多可用行为止。\n\n`while` 循环开头的布尔表达式检查 `line` 变量的值。如果它不是\
  \ `null`，循环体通过将当前行文本追加到 `source` 文本框的 `Text` 属性中来显示该行，并带上换行符（`'\\n'`——由于 `TextReader`\
  \ 对象的 `ReadLine` 方法在读取每行时会剥离换行符，因此代码需要将其重新添加）。然后，`while` 循环在执行下一次迭代之前读取下一行文本。当文件中没有更多文本可读且\
  \ `ReadLine` 方法返回 `null` 值时，`while` 循环结束。\n\n**12.** 在 `while` 循环结束的右括号之后，输入以下语句：\n\
  \n```cs\nreader.Dispose();\n```\n\n此语句释放与文件相关的资源并关闭它。这是一个良好的习惯，因为它使得其他应用程序可以使用该文件，并且释放了访问文件时使用的任何内存和其他资源。\n\
  \n**13.** 在调试（Debug）菜单上，点击启动调试（Start Debugging）。\n\n**14.** 当表单出现时，点击打开文件（Open File）。\n\
  \n**15.** 在打开文件选择器或打开对话框中，移动到文档文件夹中的 `\\Microsoft Press\\VCSBS\\Chapter 5\\WhileStatement\\\
  WhileStatement` 文件夹，选择文件 `MainPage.xaml.cs`，然后点击打开。\n\n***\n\n![Image](img/Image00005.jpg)\
  \ 注意\n\n不要尝试打开不包含文本的文件。如果你尝试打开一个可执行程序或图形文件，应用程序将仅仅显示该文件中二进制信息的文本表示。如果文件很大，可能会导致应用程序挂起，需要你强制终止它。\n\
  \n***\n\n这一次，所选文件的内容出现在文本框中——你应该能认出你一直在编辑的代码。下面的图片显示了正在运行应用程序：\n\n![Image](img/Image00057.jpg)\n\
  \n**16.** 滚动文本框中的文本并找到 `displayData` 方法。验证该方法是否包含你刚刚添加的代码。\n\n**17.** 返回 Visual\
  \ Studio 并停止调试。\n\n### 编写 `for` 语句\n\n在 C# 中，大多数 `while` 语句具有以下通用结构：\n\n```cs\n\
  initialization\nwhile (Boolean expression)\n{\n    statement\nupdate control variable\n\
  }\n```\n\nC# 中的 `for` 语句通过结合初始化、布尔表达式和更新控制变量的代码，为这种结构提供了一个更正式的版本。你会发现 `for` 语句非常有用，因为在\
  \ `for` 语句中，很难不小心遗漏初始化或更新控制变量的代码，所以你不可能写出无限循环的代码。以下是 `for` 语句的语法：\n\n点击此处查看代码图片\n\
  \n```cs\nfor (initialization; Boolean expression; update control variable)\n   \
  \ statement\n```\n\n构成 `for` 结构主体的语句可以是单行代码，也可以是花括号括起来的代码块。\n\n你可以将早些显示的显示 0 到 9\
  \ 整数的 `while` 循环重写为以下 `for` 循环：\n\n```cs\nfor (int i = 0; i < 10; i++)\n{\n    Console.WriteLine(i);\n\
  }\n```\n\n初始化只发生一次，在循环的最开始处。然后，如果布尔表达式的值为 `true`，则执行语句。发生控制变量更新，然后重新评估布尔表达式。如果条件仍为\
  \ `true`，则再次执行语句，更新控制变量，再次评估布尔表达式，依此类推。\n\n注意，初始化只发生一次，循环体中的语句始终在更新之前执行，而更新发生在布尔表达式重新评估之前。\n\
  \n***\n\n![Image](img/Image00013.jpg) 提示\n\n与 `while` 语句一样，即使 `for` 循环体只包含一个单一语句，始终使用代码块也被认为是一个良好的习惯。如果你以后在\
  \ `for` 循环体中添加额外的语句，这种方法将有助于确保你的代码始终作为每次迭代的一部分执行。\n\n***\n\n你可以省略 `for` 语句的任何部分。如果你省略了布尔表达式，它默认为\
  \ `true`，因此以下 `for` 语句将无限运行：\n\n点击此处查看代码图片\n\n```cs\nfor (int i = 0; ; i++)\n{\n\
  \    //\n}\n```\n\n如果你省略了初始化和更新部分，你会得到一个奇怪格式的 `while` 循环：\n\n```cs\nint i = 0;\n\
  for (; i < 10; )\n{\n    //\n}\n```\n\n***\n\n![Image](img/Image00005.jpg) 注意\n\n\
  `for` 语句的初始化、布尔表达式和控制变量部分必须由分号分隔，即使它们被省略了。\n\n***\n\n你还可以在 `for` 循环中提供多个初始化和多个更新。（尽管你只有一个布尔表达式。）要实现这一点，用逗号分隔各种初始化和更新，如下例所示：\n\
  \n点击此处查看代码图片\n\n```cs\nfor (int i = 0, j = 10; i <= j; i++, j--)\n{\n    //\n}\n\
  ```\n\n作为最后一个示例，是将之前的 `while` 循环重写为 `for` 循环：\n\n点击此处查看代码图片\n\n```cs\nfor (string\
  \ line = reader.ReadLine(); line != null; line = reader.ReadLine())\n{\n    source.Text\
  \ += line + '\\n';\n}\n```\n\n#### `for` 语句的作用域\n\n你可能注意到可以在 `for` 语句的初始化部分声明变量。该变量的作用域是\
  \ `for` 语句体，并在 `for` 语句结束时消失。这一规则有两个重要的后果。首先，在 `for` 语句结束后你无法使用该变量。这里有一个例子：\n\n\
  点击此处查看代码图片\n\n```cs\nfor (int i = 0; i < 10; i++)\n{\n    //\n}\nConsole.WriteLine(i);\
  \ // 编译错误\n```\n\n其次，你可以编写多个重用变量名的 `for` 语句，因为每个变量都在不同的作用域内，如下代码所示：\n\n点击此处查看代码图片\n\
  \n```cs\nfor (int i = 0; i < 10; i++)\n{\n    //\n}\n\nfor (int i = 0; i < 20; i\
  \ += 2) // 允许\n{\n    //\n}\n```\n\n### 编写 `do` 语句\n\n`while` 和 `for` 语句都在循环开始时测试布尔表达式。这意味着如果表达式在第一次测试时为\
  \ `false`，循环体就不会运行——即使只有一次。`do` 语句不同：它的布尔表达式在每次迭代之后评估，因此循环体至少执行一次。\n\n`do` 语句的语法如下（不要忘记最后的分号）：\n\
  \n```cs\ndo\nstatement\nwhile (booleanExpression);\n```\n\n\n\n\n\n如果循环体包含多个语句，则你必须使用\
  \ `statement` 块（如果不这样做，编译器将报告语法错误）。以下是一个将 0 到 9 的值写入控制台的示例版本，这次使用 `do` 语句构建：\n\n\
  ```cs\nint i = 0;\n\ndo\n{\n    Console.WriteLine(i);\n    i++;\n}\nwhile (i < 10);\n\
  ```\n\n### `break` 和 `continue` 语句\n\n在第 4 章中，你已经学习了如何使用 `break` 语句跳出 `switch` 语句。你也可以使用\
  \ `break` 语句跳出迭代语句的体。当你跳出循环时，循环会立即退出，执行将继续循环后的第一条语句。循环的更新部分或继续条件都不会重新运行。\n\n相比之下，`continue`\
  \ 语句会导致程序立即执行循环的下次迭代（在重新评估布尔表达式之后）。这里是另一个将 0 到 9 的值写入控制台的示例版本，这次使用了 `break` 和 `continue`\
  \ 语句：\n\n```cs\nint i = 0;\n\nwhile (true)\n{\n    Console.WriteLine(i);\n    i++;\n\
  \    if (i < 10)\n        continue;\n    else\n        break;\n}\n```\n\n这段代码绝对非常糟糕。许多编程规范建议谨慎使用\
  \ `continue`，或者完全不使用它，因为它通常与难以理解的代码相关联。`continue` 的行为也相当微妙。例如，如果你在 `for` 语句内部执行\
  \ `continue` 语句，更新部分将在执行循环的下次迭代之前运行。\n\n在接下来的练习中，你将编写一个 `do` 语句，将一个正十进制整数转换为八进制表示法的字符串形式。该程序基于以下算法，该算法源于一种广知的数学步骤：\n\
  \n点击此处查看代码图片\n\n1. 将十进制数字存储变量 `dec` 中\n2. 执行以下操作：\n   - 将 `dec` 除以 8 并存储余数\n   -\
  \ 将 `dec` 设置为上一步的商\n3. 只要 `dec` 不等于 0 就继续执行\n4. 按反序组合每次计算所存储的余数值\n\n例如，假设你想将十进制数字\
  \ 999 转换为八进制。你执行以下步骤：\n\n**1.** 999 除以 8。商是 124，余数是 7。\n**2.** 124 除以 8。商是 15，余数是\
  \ 4。\n**3.** 15 除以 8。商是 1，余数是 7。\n**4.** 1 除以 8。商是 0，余数是 1。\n**5.** 按反序组合每一步计算出的余数。结果为\
  \ 1747。这就是十进制值 999 的八进制表示。\n\n### 编写一个 `do` 语句\n\n**1.** 使用 Visual Studio 2015，打开\
  \ `DoStatement` 项目，它位于你文档文件夹中的 `\\Microsoft Press\\VCSBS\\Chapter 5\\DoStatement`\
  \ 文件夹下。\n\n**2.** 在设计视图窗口中显示 `MainPage.xaml` 表单。\n\n表单包含一个名为 `number` 的文本框，用户可以在其中输入十进制数字。当用户点击\
  \ Show Steps 按钮时，将生成输入数字的八进制表示。右侧名为 `steps` 的文本框显示计算每个阶段的结果。\n\n**3.** 在代码和文本编辑器窗口中显示\
  \ `MainPage.xaml.cs` 的代码，并找到 `showStepsClick` 方法。\n\n该方法在用户点击表单上的 Show Steps 按钮时运行。目前它是空的。\n\
  \n**4.** 在 `showStepsClick` 方法中添加以下**粗体**所示语句：\n\n点击此处查看代码图片\n\n```cs\nprivate void\
  \ showStepsClick(object sender, RoutedEventArgs e)\n{\n    int amount = int.Parse(number.Text);\n\
  \    steps.Text = \"\";\n    string current = \"\";\n}\n```\n\n第一条语句使用 `int` 类型的\
  \ `Parse` 方法将 `number` 文本框 `Text` 属性中的字符串值转换为 `int`，并将其存储在名为 `amount` 的局部变量中。\n\n\
  第二条语句通过将其 `Text` 属性设置为空字符串，来清除下方文本框中显示的文本。\n\n第三条语句声明了一个名为 `current` 的 `string`\
  \ 变量并初始化为空字符串。你将使用此字符串来存储用于将十进制数转换为八进制表示的循环在每次迭代中生成的数字。\n\n**5.** 向 `showStepsClick`\
  \ 方法添加以下 `do` 语句（如**粗体**所示）：\n\n点击此处查看代码图片\n\n```cs\nprivate void showStepsClick(object\
  \ sender, RoutedEventArgs e)\n{\n    int amount = int.Parse(number.Text);\n    steps.Text\
  \ = \"\";\n    string current = \"\";\n    do\n    {\n        int nextDigit = amount\
  \ % 8;\n        amount /= 8;\n        int digitCode = '0' + nextDigit;\n       \
  \ char digit = Convert.ToChar(digitCode);\n        current = digit + current;\n\
  \        steps.Text += current + \"\\n\";\n    }\n    while (amount != 0);\n}\n\
  ```\n\n\n\n\n由于 `amount` 的值尚未为 0，循环执行下一次迭代。\n\n在本章的最后一个练习中，你将使用 Visual Studio 2015\
  \ 调试器逐步执行之前的 `do` 语句，帮助你理解它的工作原理。\n\n### 逐步执行 `do` 语句\n\n**1.** 在显示 `MainPage.xaml.cs`\
  \ 文件的代码和文本编辑器中，将光标移动到 `showStepsClick` 方法的第一条语句：\n\n点击此处查看代码图像\n\n```cs\nint amount\
  \ = int.Parse(number.Text); own```\n\n**2.** 在第一条语句的任何地方点击右键，然后点击“运行到光标”（Run To\
  \ Cursor）。\n\n**3.** 当表单出现时，在左侧的数字文本框输入 `999`，然后点击“显示步骤”（Show Steps）。\n\n程序停止，你进入了\
