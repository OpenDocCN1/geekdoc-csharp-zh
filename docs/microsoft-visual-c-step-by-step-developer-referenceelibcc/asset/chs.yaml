  \ Logo 文件，然后点击“添加”。\n\n**3.** 在“解决方案管理器”中，双击 `Package.appxmanifest` 文件，使其在“清单设计器”（Manifest\
  \ Designer）窗口中显示。\n\n**4.** 点击“视觉资产”（Visual Assets）选项卡。然后，在左窗格中，点击“所有图像资产”（All Image\
