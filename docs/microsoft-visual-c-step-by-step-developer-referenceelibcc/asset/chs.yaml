  \n***\n\n**6.** 在控制台窗口中，按回车键（Enter）返回 Visual Studio 2015。\n\n### 总结\n\n在本章中，你了解了垃圾回收器的工作原理以及\
  \ .NET Framework 如何使用它丢弃对象并回收内存。你学习了如何编写析构函数以便垃圾回收器回收内存时清理对象使用的资源。你还学习了如何使用 `using`\
