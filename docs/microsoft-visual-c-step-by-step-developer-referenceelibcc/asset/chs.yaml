  \ 在 `Add New Item – AdventureWorksService` 对话框中，在左列点击 `Data` 节点。在中间面板中，点击 `ADO.NET\
  \ Entity Data Model` 模板。在 `Name` 框中输入 `AdventureWorksModel` ，然后点击 `Add`。\n\n实体数据模型向导启动。你可以使用此向导从现有数据库生成实体模型。\n\
  \n**16.** 在向导的 `Choose Model Contents` 页上，点击 `EF Designer From Database`，然后点击 `Next`。\n\
