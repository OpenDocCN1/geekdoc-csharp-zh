  \ For Fetching And Updating Data）区域（如有需要请展开该区域）。在此区域内，`ValidateCustomer` 方法上方创建所示的\
  \ `Add` 方法：\n\n点击此处查看代码图像\n\n```csharp\n// 创建一个新的（空的）客户\n// 并表单进入添加模式\nprivate void\
  \ Add()\n{\n\n    Customer newCustomer = new Customer { CustomerID = 0 };\n    this.customers.Insert(currentCustomer,\
  \ newCustomer);\n    this.IsAdding = true;\n    this.OnPropertyChanged(nameof(Current));\n\
  }\n```\n\n\n\n\n\n此方法创建了一个新的 `Customer` 对象。除了 `CustomerID` 属性外，该对象为空，该属性为了显示目的被临时设置为\
  \ `0`。该属性的真实值将在客户保存到数据库时生成，如前文所述。该客户将被添加到 `customers` 列表中（视图使用数据绑定来显示此列表中的数据），ViewModel\
  \ 进入“正在添加”（Adding）模式，并触发 `PropertyChanged` 事件以指示 `Current` 客户已发生更改。\n\n### 7. 在\
  \ `ViewModel` 类开头的列表中添加以下**加粗显示**的 `Command` 变量：\n\n点击此处查看代码图像\n\n```csharp\npublic\
  \ class ViewModel : INotifyPropertyChanged\n\n{\n...\n\npublic Command LastCustomer\
  \ { get; private set; }\n\npublic Command AddCustomer { get; private set; }\n\n\
  ...\n}\n```\n\n### 8. 在 `ViewModel` 构造函数中，如下所示**加粗显示**实例化 `AddCustomer` 命令：\n\n\
  点击此处查看代码图像\n\n```csharp\npublic ViewModel()\n\n{\n...\n\nthis.LastCustomer = new\
  \ Command(this.Last, ...);\n\nthis.AddCustomer = new Command(this.Add,\n\n() =>\
  \ { return this.CanBrowse; });\n\n...\n}\n```\n\n此代码引用了你刚刚创建的 `Add` 方法。如果 ViewModel\
  \ 连接到 Web 服务且处于“浏览”（Browsing）模式，则启用该命令（如果 ViewModel 已经处于“正在添加”模式，则 `AddCustomer`\
  \ 命令将不会启用）。\n\n### 9. 在“获取和更新数据方法”（Methods For Fetching And Updating Data）区域的 `Add`\
  \ 方法之后创建一个名为 `oldCustomer` 的私有 `Customer` 变量，并定义另一个名为 `Edit` 的方法：\n\n点击此处查看代码图像\n\
  \n```csharp\n// 编辑当前客户\n// - 保存客户的现有详细\n// 并将表单置于编辑（Editing）模式\nprivate Customer\
  \ oldCustomer;\n\nprivate void Edit ()\n{\nthis.oldCustomer = new Customer();\n\
  this.CopyCustomer(this.Current, this.oldCustomer);\nthis.IsEditing = true;\n}\n\
  ```\n\n此方法将 `Current` 客户的详情复制到 `oldCustomer` 变量中，并将 ViewModel 进入“编辑”（Editing）模式。在此模式下，用户可以更改当前客户的详情。如果用户随后决定放弃这些更改，则可以从\
  \ `oldCustomer` 变量中复制原始数据。\n\n### 10. 在 `ViewModel` 类开头的列表中添加以下**加粗显示**的 `Command`\
  \ 变量：\n\n点击此处查看代码图像\n\n```csharp\npublic class ViewModel : INotifyPropertyChanged\n\
  \n{\n...\n\npublic Command AddCustomer { get; private set; }\n\npublic Command EditCustomer\
  \ { get; private set; }\n\n...\n}\n```\n\n### 11. 在 `ViewModel` 构造函数中，如后续代码所示**加粗显示**实例化\
  \ `EditCustomer` 命令：\n\n点击此处查看代码图像\n\n```csharp\npublic ViewModel()\n\n{\n...\n\n\
  this.AddCustomer = new Command(this.Add, ...);\n\nthis.EditCustomer = new Command(this.Edit,\n\
  \n() => { return this.CanBrowse; });\n\n...\n}\n```\n\n此代码与 `AddCustomer` 命令的语句类似，不同在于它引用了\
  \ `Edit` 方法。\n\n### 12. 在“获取和更新数据方法”区域的 `Edit` 方法之后，为 `ViewModel` 类添加一个名为 `Discard`\
  \ 的方法，如下所示：\n\n点击此处查看代码图像\n\n```csharp\n// 放弃在“正在添加”或“编辑”模式下所做的更改\n// 并将表单返回浏览（Browsing）模式\n\
  private void Discard ()\n{\n// 如果用户正在添加新客户，则将其移除\nif (this.IsAdding)\n{\nthis.customers.Remove(this.Current);\n\
  this.OnPropertyChanged(nameof(Current));\n}\n// 如果用户正在编辑现有客户，\n// 则恢复已保存的详情\nif\
  \ (this.IsEditing)\n{\nthis.CopyCustomer(this.oldCustomer, this.Current);\n}\nthis.IsBrowsing\
  \ = true;\n}\n```\n\n此方法的目的是使用户能够放弃 ViewModel 处于“正在添加”或“编辑”模式时所做的任何更改。如果 ViewModel\
  \ 处于“正在添加”模式，则从列表中移除当前客户（这是由 `Add` 方法创建的新客户），并触发 `PropertyChanged` 事件以指示 `customers`\
  \ 列表中的当前客户已更改。如果 ViewModel 处于“编辑”模式，则将 `oldCustomer` 变量中的原始详情复制回当前显示的客户。最后，将 ViewModel\
  \ 返回到“浏览”模式。\n\n### 13. 在 `ViewModel` 类开头的列表中添加 `DiscardChanges Command` 变量，并更新构造函数以实例化此命令，如下所示**加粗显示**：\n\
  \n点击此处查看代码图像\n\n```csharp\npublic class ViewModel : INotifyPropertyChanged\n\n{\n\
  ...\n\npublic Command EditCustomer { get; private set; }\n\npublic Command DiscardChanges\
  \ { get; private set; }\n\n...\npublic ViewModel()\n{\n...\nthis.EditCustomer =\
  \ new Command(this.Edit, ...);\n\nthis.DiscardChanges = new Command(this.Discard,\n\
  \n() => { return this.CanSaveOrChanges; });\n}\n}\n```\n\n注意，`DiscardChanges` 命令只有在\
  \ `CanSaveOrChanges` 属性为 `true`、ViewModel 连接到 Web 服务且处于“添加”或“编辑”模式时才可用。\n\n### 14.\
  \ 在“获取和更新数据方法”区域，`Discard` 方法之后添加一个名为 `SaveAsync` 的方法，代码如下。该方法应标记为 `async` 修饰符。\n\
  \n点击此处查看代码图像\n\n```csharp\n// 将新或更新的客户保存回 Web 服务\n// 并表单返回浏览模式\nprivate async void\
  \ SaveAsync()\n{\n// 验证客户详情\nif (this.ValidateCustomer(this.Current))\n{\n// 如果详情有效则继续\n\
  this.IsBusy = true;\ntry\n{\n// 将当前客户转换为 HTTP 请求格式的 JSON 负载\nvar serializedData\
  \ = JsonConvert.SerializeObject(this.Current);\nStringContent content =\nnew StringContent(serializedData,\
  \ Encoding.UTF8, \"text/json\");\n// 如果用户正在添加新客户，\n// 发送详情 POST 请求\nif (this.IsAdding)\n\
  {\nvar response = await client.PostAsync(\"api/customers\", content);\nif (response.SuccessStatusCode)\n\
  {\n// TODO: 显示新客户详情\n}\n// TODO: 处理 POST 失败\n}\n// 用户必须编辑现有客户，\n// 因此使用 PUT 请求发送详情\n\
  else\n{\nstring path = $\"api/customers/{this.Current.CustomerID}\";\nvar response\
  \ = await client.PutAsync(path, content);\nif (response.SuccessStatusCode)\n{\n\
  this.IsEditing = false;\nthis.IsBrowsing = true;\n}\n// TODO: 处理 PUT 失败\n}\n}\n\
  catch (Exception e)\n{\n// TODO: 处理异常\n}\nfinally\n{\nthis.IsBusy = false;\n}\n\
  }\n}\n\n\n此方法尚未完成。你输入的代码验证了客户详情是否有效。如果是，则可以保存详情，然后将 ViewModel 的 `IsBusy` 属性设置为 `true`，以指示保存操作在通过网络发送\
  \ Web 服务时可能需要一些时间。（记住，客户表单上 `ProgressRing` 控件的 `IsActive` 绑定到此属性，因此在保存数据时将显示进度环。）\n\
  \n\n\n\n\n如果用户正在编辑现有的客户，应用程序将调用 `HttpClient` 对象的 `PutAsync` 方法。该方法生成一个 PUT 请求，并将其传递给\
  \ Web 服务中 `CustomersController` 类的 `PutCustomer` 方法。`PutCustomer` 方法更新数据库中的客户详情，并期望客户\
  \ ID 和客户详情作为参数。同样，这些数据以 JSON 格式传输到 Web 服务。\n\n当数据发送后，`IsBusy` 属性被设置为 `false`，这会导致\
  \ `ProgressRing` 控件从显示中消失。\n\n**15.** 在 `SaveAsync` 方法中，将注释 `// TODO: Display the\
  \ details of the new customer` 替换为如下加粗所示的代码：\n\n点击此处查看代码图像\n\n```c\nif (response.IsSuccessStatusCode)\n\
  {\n    // 获取新创建的客户 ID 并显示它\n    Uri customerUri = response.Headers.Location;\n \
  \   var newCust = await this.client.GetAsync(customerUri);\n    if (newCust.IsSuccessStatusCode)\n\
  \    {\n        var customerData = await newCust.Content.ReadAsStringAsync();\n\
  \        this.CopyCustomer(JsonConvert.DeserializeObject<Customer>(customerData),\
  \ this.Current);\n        this.OnPropertyChanged(nameof(Current));\n        this.IsAdding\
  \ = false;\n        this.IsBrowsing = true;\n    }\n    else\n    {\n        //\
  \ TODO: Handle failure\n    }\n}\n```\n\nAdventureWorks 数据库中 Customer 表的 `CustomerID`\
  \ 列包含自动生成的值。创建客户时，用户不提供此值，而是由数据库在添加客户时生成的。通过这种方式，数据库可以确保每个客户都有唯一的 ID。因此，在发送 POST\
  \ 请求后，必须发送 GET 请求来获取客户 ID。幸运的是，POST 请求返回的 `HttpResponseMessage` 对象包含一个应用程序可以使用的查询新数据的\
  \ URL。该 URL 位于响应的 `Headers.Location` 属性中，格式为 `api/Customers/n`，其中 `n` 是客户的 ID。代码通过\
  \ `HttpClient` 对象的 `GetAsync` 方法向此 URL 发送 GET 请求；使用响应的 `ReadAsStringAsync` 方法读回新客户的数据。然后代码使用这些数据更新集合中的客户详情。\n\
  \n***\n\n![图像](img/Image00005.jpg) 注意：此代码看起来似乎对 Web 服务进行了不必要的往返以获取客户 ID，该 ID 位于\
  \ POST 请求响应的 `Headers.Location` 属性。然而，此步骤验证了数据已正确保存，Web 服务在保存数据时可能会转换其他字段，因此确保应用程序显示数据库中出现的数据。\n\
  \n***\n\n**16.** 在 `ViewModel` 类开头添加此处所示的 `SaveChanges Command` 变量，并更新构造函数以实例化该命令，如下：\n\
  \n点击此处查看代码图像\n\n```csharp\npublic class ViewModel : INotifyPropertyChanged\n{\n\
  \    ...\n    public Command DiscardChanges { get; private set; }\n    public Command\
  \ SaveChanges { get; private set; }\n    ...\n    public ViewModel()\n    {\n  \
