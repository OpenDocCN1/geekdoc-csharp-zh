  \n* * *\n\n### 初始化用类型参数定义的变量\n\n你应该已经注意到定义并初始化 `currentItem` 变量的语句使用了 `default`\
  \ 关键字。`currentItem` 变量是通过使用类型参数 `TItem` 定义的。当程序编写和编译时，替换 `TItem` 的实际类型可能未知——这个问题只有在代码执行时才能解决。这使得指定如何初始化该变量变得困难。人们的倾向是将其设置为\
  \ `null`。然而，如果替换 `TItem` 的类型是值类型，则这种赋值是非法的。（你不能将值类型设置为 `null`，只能设置为引用类型。）同样，如果你将其设置为\
  \ `0` 并期望该类型是数值型，那么如果实际使用的类型实际上是引用类型，这将是非法的。还有其他可能性——例如，`TItem` 可能是布尔型。`default`\
  \ 关键字解决了这个问题。用于初始化变量的值将在语句执行时确定。如果 `TItem` 是引用类型，`default(TItem)` 返回 `null`；如果 `TItem`\
  \ 是数值型，`default(TItem)` 返回 `0`；如果 `TItem` 是布尔型，`default(TItem)` 返回 `false`。\n\n\
