  \ 18. 在调试（Debug）菜单上，点击调试（Debugging）。\n\n\n\n\n定义自动属性的语法与在接口中定义属性的语法几乎相同。不同之处在于自动属性可以指定如\
  \ `private`、`public` 或 `protected` 等访问修饰符。\n\n***\n\n你可以通过在属性声明中省略空的 `set` 访问器来创建一个只读自动属性，如下所示：\n\
  \n点击此处查看代码图片\n\n```csharp\nclass Circle\n{\npublic DateTime CircleCreatedDate {\
  \ get; }\n...\n}\n```\n\n这种在在你想要创建一个不可变属性的场景中非常有用；即一个在对象构造时设置且此后无法更改的属性。例如，你可能想要设置对象创建的日期或创建该对象的用户名，或者你可能想为对象生成一个唯一标识符值。这些都是你通常只想设置一次，然后防止它们被修改的值。考虑到这一点，C#\
  \ 允许你通过两种方式之一初始化只读自动属性。你可以从构造函数中初始化属性，如下所示：\n\n点击此处查看代码图片\n\n```csharp\nclass Circle\n\
  {\npublic Circle()\n{\nCircleCreatedDate = DateTime.Now;\n}\npublic DateTime CircleCreatedDate\
  \ { get; }\n...\n}\n```\n\n或者，你可以在声明属性作为初始化属性，如下所示：\n\n点击此处查看代码图片\n\n```csharp\n\
  class Circle\n{\npublic DateTime CircleCreatedDate { get; } = DateTime.Now;\n...\n\
  }\n```\n\n请注意，如果你以这种方式初始化了属性，并且在构造函数也设置了它的值，则构造函数提供的值将覆盖属性初始化器指定的值；请使用其中一种方法，而不要两者兼用！\n\
  \n***\n\n![Image](img/Image00005.jpg) 备注\n\n你不能创建只写入的自动属性。如果你尝试创建一个不带 `get` 访问器的自动属性，你将看到编译时错误。\n\
  \n***\n\n### 使用属性初始化对象\n\n在第 7 章中，你学习了如何定义构造函数来初始化对象。一个对象可以有多个构造函数，你可以定义具有不同参数的构造函数来初始化对象中的不同元素。例如，你可以定义一个建模三角形的类，如下：\n\
  \n点击此处查看代码图片\n\n```csharp\npublic class Triangle\n{\nprivate int side1Length;\n\
  private int side2Length;\nprivate int side3Length;\n// 默认构造函数 - 所有边的默认值\npublic\
  \ Triangle()\n{\nthis.side1Length = this.side2Length = this.side3Length = 10;\n\
  }\n// 为 side1Length 指定长度，对其他边使用默认值\npublic Triangle(int length1)\n{\nthis.side1Length\
  \ = length1;\nthis.side2Length = this.side3Length = 10;\n}\n// 为 side1Length 和 side2Length\
  \ 指定长度，\n// side3Length 使用默认值\npublic Triangle(int length1, int length2)\n{\nthis.side1Length\
  \ = length1;\nthis.side2Length = length2;\nthis.side3Length = 10;\n}\n// 为所有边指定长度\n\
  public Triangle(int length1, int length2, int length3)\n{\nthis.side1Length = length1;\n\
  this.side2Length = length2;\nthis.side3Length = length3;\n}\n}\n```\n\n取决于类包含的字段数量以及你想要启用的初始化字段的各种组合，你可能会编写很多构造函数。如果许多字段具有相同类型，也可能存在潜在问题：你可能无法为所有字段的组合编写一个唯一的构造函数。例如，在前面的\
  \ `Triangle` 类中，你无法轻松地添加一个只初始化 `side1Length` 和 `side3Length` 字段的构造函数，因为它将没有唯一的签名；它将接受两个\
  \ `int` 参数，而初始化 `side1Length` 和 `side2Length` 的构造函数已经具有此签名。一种可能的解决方案是定义一个接受可选参数的构造函数，并在创建\
  \ `Triangle` 对象时使用命名参数为这些参数指定值。然而，一个更好且更透明的解决方案是将私有字段初始化为一组默认值，并将它们作为属性暴露出来，如下所示：\n\
  \n点击此处查看代码图片\n\n```csharp\npublic class Triangle\n{\nprivate int side1Length = 10;\n\
  private int side2Length = 10;\nprivate int side3Length = 10;\npublic int Side1Length\n\
  {\nset { this.side1Length = value; }\n}\npublic int Side2Length\n{\nset { this.side2Length\
  \ = value; }\n}\npublic int Side3Length\n{\nset { this.side3Length = value; }\n\
  }\n}\n```\n\n当你创建一个类的实例时，你可以通过指定任何具有 `set` 访问器的公共属性的名称和值来初始化它。例如，你可以创建 `Triangle`\
  \ 对象并初始化三边的任何组合，如下所示：\n\n点击此处查看代码图片\n\n```csharp\n```\n\n\n```csharp\nthis.NumSides\
  \ = 4;\nthis.SideLength = 10.0;\n}\n```\n\n此构造函数用默认值初始化 `NumSides` 和 `SideLength`\
  \ 字段。在本次练习中，默认多边形是一个边长为 10 个单位的正方形。\n\n### 5. 在代码和文本编辑器窗口中显示 `Program.cs` 文件。\n\n\
  ### 6. 在 `doWork` 方法中添加此处所示**粗体**语句，替换 `// TODO:` 注释：\n\n点击此处查看代码图像\n\n```csharp\n\
