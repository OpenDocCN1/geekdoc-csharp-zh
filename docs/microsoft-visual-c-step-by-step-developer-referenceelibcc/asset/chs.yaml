  \n## 测试搜索\n\n**1.** 激活 Cortana，然后说出或输入以下查询：\n\n*Customers show details for*\n\n\
  ![Image00005.jpg] 注意无论说话还是输入，Cortana 都会以相同的方式响应。\n\n![Image0213.jpg] 注意由于只有一个客户，上一个和下一个按钮是不可用的。\n\
  \n**2.** 返回 Cortana，然后说出或输入以下查询：\n\n*Search for John in Customers*\n\n这次应用程序找到了所有\
  \ John 的客户。返回了多个匹配项，你可以使用命令栏上的上一个和下一个按钮在结果之间移动。\n\n**3.** 尝试其他搜索。注意你可以使用“Search\
  \ for ...”、“Show details for ...”和“Show details of ...”格式，并将应用程序指定在命令开头或结尾（以“in”为前缀）。注意如果你使用不同的格式，Cortana\
  \ 将无法理解，而是执行 Bing 搜索。\n\n**4.** 完成后，返回 Visual Studio。\n\n## 为语音命令提供语音响应\n\n除了向应用程序发送语音命令外，你还可以让应用程序做出语音响应。为了实现这一点，UWP\
  \ 应用程序使用了 Windows 10 提供的合成功能。实现此功能实际上很简单，但有一个例外：应用程序应该只在被要求时做出语音响应。如果用户是输入而不是说出，应用程序应该保持沉默。幸运的是，你可以通过检查执行语义解释后返回的\
  \ `commandMode` 属性来检测命令是说的还是输入的，如下：\n\n```csharp\nSpeechRecognitionResult speechRecognitionResult\
  \ = ...;\n\nstring commandMode = speechRecognitionResult.SemanticInterpretation.\n\
  Properties[\"commandMode\"].FirstOrDefault();\n```\n\n`commandMode` 属性的值是一个字符串，根据用户输入命令的方式包含“text”或“voice”。在下面的练习中，你将使用此字符串来确定应用程序应该语音响应还是保持沉默。\n\
  \n## 为搜索请求添加语音响应\n\n**1.** 在 Visual Studio 中，打开 `App.xaml.cs` 文件并使其在代码和文本编辑器窗口中显示。\n\
  \n**2.** 在 `OnActivated` 方法中，添加加粗所示的语句：\n\n\n\n\n\n```csharp\nprotected override\
  \ void OnActivated(IActivatedEventArgs args)\n{\n    ...\n    if (args.Kind == ActivationKind.VoiceCommand)\n\
  \    {\n        var commandArgs = args as VoiceCommandActivatedEventArgs;\n    \
  \    var speechRecognitionResult = commandArgs.Result;\n        var commandName\
  \ = speechRecognitionResult.RulePath.First();\n        string commandMode = speechRecognitionResult.SemanticInterpretation.Properties[\"\
  commandMode\"].FirstOrDefault();\n        string customerName = \"\";\n        ...\n\
  \    }\n}\n```\n\n**3.** 在方法的末尾，更改调用 `Navigate` 方法的语句，使其一个 `NavigationArgs` 对象作为第二个参数。该对象封装了客户名称和命令模式。\n\
  \n点击此处查看代码图片\n\n```csharp\nprotected override void OnActivated(IActivatedEventArgs\
  \ args)\n{\n    ...\n    if (args.Kind == ActivationKind.VoiceCommand)\n    {\n\
  \        ...\n        switch (commandName)\n        {\n            ...\n       \
  \ }\n        rootFrame.Navigate(typeof(MainPage), new NavigationArgs(customerName,\
  \ commandMode));\n        Window.Current.Activate();\n    }\n}\n```\n\nVisual Studio\
  \ 将报告找不到 `NavigationArgs` 类型。这是因为 `NavigationArgs` 类型尚不存在；你需要创建它。\n\n**4.** 在代码中右键点击\
  \ `NavigationArgs` 对象的引用，然后点击“快速操作”（Quick Actions）。在快速操作弹出窗口中，点击`Generate Class\
  \ For NavigationArgs In Customers (In New File)`，如下所示：\n\n![Image](img/Image00215.jpg)\n\
  \n此操作会创建一个名为 `NavigationArgs.cs` 的新文件，其中包含一个带有名为 `commandMode` 和 `customerName`\
  \ 私有字段的类，以及一个填充这些字段的公共构造函数。你必须修改此类以便让外部访问这些字段。实现此点的最佳方法是将字段转换为只读属性。\n\n**5.** 在“解决方案管理器”（Solution\
  \ Explorer）中，双击 `NavigationArgs.cs` 文件以在代码和文本编辑器窗口中显示它。\n\n**6.** 修改 `commandMode`\
  \ 和 `customerName` 字段，使其成为可以被应用程序其他类型访问的只读字段，如下所示代码中的加粗部分：\n\n点击此处查看代码图片\n\n```csharp\n\
  internal class NavigationArgs\n{\n    internal string commandMode { get; }\n   \
  \ internal string customerName { get; }\n\n    public NavigationArgs(string customerName,\
  \ string commandMode)\n    {\n        this.customerName = customerName;\n      \
  \  this.commandMode = commandMode;\n    }\n}\n```\n\n**7.** 返回代码和文本编辑器窗口中的 `MainPage.xaml.cs`\
  \ 并定位到 `OnNavigatedTo` 方法。按照如下方式修改该方法：\n\n点击此处查看代码图片\n\n```csharp\nprotected override\
  \ async void OnNavigatedTo(NavigationEventArgs e)\n{\n    NavigationArgs args =\
  \ e.Parameter as NavigationArgs;\n    if (args != null)\n    {\n        string customerName\
  \ = args.customerName;\n        ViewModel viewModel = new ViewModel(customerName);\n\
  \        this.DataContext = viewModel;\n        if (args.commandMode == \"voice\"\
  )\n        {\n            if (viewModel.Current != null)\n            {\n      \
  \          await Say($\"Here are the details for {customerName}\");\n          \
  \  }\n            else\n            {\n                await Say($\"{customerName}\
  \ was not found\");\n            }\n        }\n    }\n}\n```\n\n注意，`Say` 方法尚未实现。你稍后将创建此方法。\n\
  \n**8.** 在文件顶部的列表中添加以下 `using` 指令：\n\n点击此处查看代码图片\n\n```csharp\nusing Windows.Media.SpeechSynthesis;\n\
  using System.Threading.Tasks;\n```\n\n**9.** 将此处所示的 `Say` 方法添加到 `MainPage` 类的末尾：\n\
  \n点击此处查看代码图片\n\n```csharp\nprivate async Task Say(string message)\n{\n    MediaElement\
  \ mediaElement = new MediaElement();\n    var synth = new SpeechSynthesizer();\n\
  \    SpeechSynthesisStream stream = await synth.SynthesizeTextToStreamAsync(message);\n\
  \    mediaElement.SetSource(stream, stream.ContentType);\n    mediaElement.Play();\n\
  }\n```\n\n`Windows.Media.SpeechSynthesis` 命名空间下的 `SpeechSynthesizer` 类可以生成包含从文本合成语音的媒体流。该流随后被传递给\
  \ `MediaElement` 对象并由其播放。\n\n**10.** 在“调试”菜单上，点击“无调试启动”（Start Without Debugging）来生成并运行应用程序。\n\
  \n**11.** 激活 Cortana，然后说出查询：\n\n*Customers show details for Brian Johnson*\n\nCortana\
  \ 应该通过在 Customers 应用中显示 Brian Johnson 的详情并说“Here are the details for Brian Johnson”。\n\
  \n**12.** 在 Cortana 搜索框中输入以下查询：\n\n*Customers show details for John*\n\n验证这次在显示名字为\
  \ John 的客户列表后，应用程序仍然保持静音状态。\n\n**13.** 尝试通过输入和语音执行其他查询进行实验。完成后关闭应用程序。\n\n### 总结\n\
  \n在本章中，你学习了如何使用数据绑定在表单上显示数据。你了解了如何为表单设置数据上下文，以及如何通过实现 `INotifyPropertyChanged` 接口创建支持数据绑定的数据源。你还学习了如何使用模型-视图-视图（MVVM）模式创建\
  \ UWP 应用，并了解了如何集成 Cortana 以提供搜索功能。\n\n\n\n\n到目前为止，你所使用的数据仅限于嵌入在应用 `ViewModel` 中的简单集合。在现实世界中，应用显示和维护的数据更有可能存储在如关系型数据库等数据源中。\n\
  \nUWP 应用无法直接使用微软提供的技术访问关系型数据库（尽管有某些第三方数据库解决方案）。这听起来可能是一个非常严苛的限制，但这种限制有其合理的理由。首先，它消除了\
  \ UWP 应用对外部资源可能的依赖，使应用程序成为一个独立的项，可以方便地从 Windows Store 打包并下载，而无需用户在计算机上安装和配置数据库管理系统。此外，即使是许多\
  \ Windows 10 设备也受到资源限制，没有足够的内存或磁盘空间来运行本地数据库管理系统。然而，许多业务应用仍然有访问数据库的需求，为了解决这种场景，你可以使用\
  \ Web 服务。\n\nWeb 服务可以实现多种功能，但一种常见的场景是提供一个接口，应用可以通过该接口连接到远程数据源以检索和更新数据。Web 服务可以位于几乎任何地方，从运行应用的计算机到托管在另一个大洲计算机上的\
  \ Web 服务器。只要你能够连接到 Web 服务，就可以使用它来访问你的信息库。Microsoft Visual Studio 提供了模板和工具，让你能够非常快速方便地构建\
  \ Web 服务。最简单的策略是基于使用 `Entity Framework` 生成的实体模型构建 Web 服务，如下图所示：\n\n![Image](img/Image00217.jpg)\n\
  \n`Entity Framework` 是一项强大的技术，通过你可以连接到关系型数据库。它可以减少大多数开发者在为应用添加数据访问能力时编写的代码量。这将是你开始的地方，但首先你需要设置\
  \ AdventureWorks 数据库，它包含了 AdventureWorks 客户的详细信息。\n\n***\n\n![Image](img/Image00005.jpg)\
  \ 注意\n\n书中没有足够的空间来详细介绍如何使用 `Entity Framework`，本节的练习仅引导你完成入门最核心的步骤。如果你想获取更多信息，请查看微软网站上的“Entity\
  \ Framework”：`[`msdn.microsoft.com/data/aa937723`](http://msdn.microsoft.com/data/aa937723)`。\n\
  \n***\n\n为了使场景更加真实，本章的练习将向你展示如何使用 Microsoft Azure SQL Database 在云端创建数据库，以及如何将 Web\
  \ 服务部署到 Azure。这种架构对于许多商业应用都是通，包括电子商务应用程序、移动银行服务，甚至是视频流系统。\n\n***\n\n![Image](img/Image00005.jpg)\
  \ 注意\n\n练习要求你拥有一个 Azure 账户和订阅。如果你还没有 Azure 账户，可以在 `[`azure.microsoft.com/pricing/free-trial/`](https://azure.microsoft.com/pricing/free-trial/)`\
  \ 注册免费试用账户。此外，Azure 要求你拥有一个有效的 Microsoft 账户以便其关联你的 Azure 账户。你可以在 `[`signup.live.com/`](https://signup.live.com/)`\
  \ 注册 Microsoft 账户。\n\n***\n\n# 创建 Azure SQL 数据库服务器并安装 AdventureWorks 示例数据库\n\n**1.**\
  \ 使用浏览器，连接到 Azure 门户 `[`portal.azure.com`](https://portal.azure.com)`。使用你的 Microsoft\
  \ 账户登录。\n\n**2.** 在门户左侧的工具栏上，点击 `New`（新建）。\n\n**3.** 在创建（Create）页面，点击 `Data + Storage`（数据+存储），然后点击\
  \ `SQL Database`（SQL 数据库）。\n\n**4.** 在 `SQL Database`窗格中，执行以下任务：\n\n**a.** 在 `Name`（名称）框中，输入\
  \ `AdventureWorks`。\n\n**b.** 点击 `Server`（服务器），然后点击 `Create A New Server`（创建新服务器）。在\
  \ `New Server` 格中，为你的服务器输入唯一的名称。（可以使用你的公司名称甚至你自己的名字——我使用了 `csharpstepbystep`。如果你输入的名称已被他人使用，将收到警告，此时请输入另一个名称。）为管理员登录输入名称和密码（记下这些信息——我使用了\
  \ `JohnSharp`，但我不会告诉你是我的密码），选择离你最近的位置，然后点击 `OK`（确定）。\n\n**c.** 点击 `Select Source`（选择源），然后点击\
  \ `Sample`（示例）。验证已选择 `AdventureWorksLT [V12]`。\n\n**d.** 点击 `Pricing Tier`（定价层级）。在\
  \ `Choose Your Pricing Tier`（选择你的定价层级）面板中，点击 `Basic`（基本）然后点击 `Select`（选择）。（如果你自己为数据库付费，这是最便宜的选项，并且足够本章的练习。如果你正在构建大型商业应用，可能需要使用\
  \ `Premium`（高级）定价层级，它提供更大的空间和更高的性能，但成本更高。）下图显示了这些设置。\n\n***\n\n![Image](img/Image00004.jpg)\
  \ 重要\n\n除非你想在月底收到一份可能巨大的账单，否则不要选择 `Basic` 以外的任何定价层级。有关 SQL Database 定价的信息，请参阅 `[`azure.microsoft.com/en-us/pricing/details/sql-database/`](https://azure.microsoft.com/en-us/pricing/details/sql-database/)`。\n\
  \n***\n\n![Image](img/Image00218.jpg)\n\n**e.** 点击 `Create`（创建），等待数据库服务器和数据库的创建。你可以通过点击工具栏中的\
  \ `Notifications`（通知）来监控进度。\n\n**5.** 在门户左侧的工具栏中，点击 `Browse`（浏览）。\n\n**6.** 在浏览页面，在\
  \ `All Resources` 格中，点击你的数据库服务器。\n\n**7.** 在数据库服务器上方的工具栏上，点击 `Settings`（设置）。\n\n\
