  {\n    // 执行结账处理\n    if (requestPayment())\n    {\n        CheckoutProcessing?.Invoke(order);\n\
  \    }\n}\n```\n\n11. 在解决方案管理器中，在 `Delegates` 项目中，右键点击 `References` 节点，然后点击“添加引用”。\n\
  \n12. 在“引用管理器 – Delegates”对话框中，在左侧面板格中点击 `Solution`。在中间面板格中，选择 `CheckoutService`\
  \ 项目，然后点击“确定”。\n\n13. 返回 `Delegates` 项目的 `MainPage.cs` 文件，并在文件顶部的列表中添加以下 `using`\
  \ 指令：\n\n```csharp\nusing CheckoutService;\n```\n\n14. 在 `MainPage` 类中添加一个类型为 `CheckoutController`\
  \ 的私有变量 `checkoutController` 并将其初始化为 `null`，如下：\n\n点击此处查看代码图像\n\n```csharp\npublic\
  \ partial class MainPage : ...\n{\n    private Auditor auditor = null;\n    private\
  \ Shipper shipper = null;\n    private CheckoutController checkoutController = null;\n\
  }\n```\n\n15. 定位 `MainPage` 构造函数。在创建 `Auditor` 和 `Shipper` 组件的语句之后，实例化 `CheckoutController`\
  \ 组件，如下：\n\n点击此处查看代码图像\n\n```csharp\npublic MainPage()\n{\n    this.auditor = new\
  \ Auditor();\n    this.shipper = new Shipper();\n    this.checkoutController = new\
  \ CheckoutController();\n}\n```\n\n16. 在你刚刚输入的语句之后，向构造函数添加以下语句：\n\n点击此处查看代码图像\n\n\
  ```csharp\nthis.checkoutController.CheckoutProcessing += this.auditor.AuditOrder;\n\
  this.checkoutController.CheckoutProcessing += this.shipper.ShipOrder;\n```\n\n此代码将\
  \ `Auditor` 和 `Shipper` 对象的 `AuditOrder` 和 `ShipOrder` 方法引用添加到 `CheckoutController`\
  \ 对象的 `CheckoutProcessing` 委托中。\n\n17. 找到 `CheckoutButtonClicked` 方法。在 `try` 块中，将执行结账处理的代码（`if`\
  \ 语句块）替换为此处所示语句：\n\n点击此处查看代码图像\n\n```csharp\nprivate void CheckoutButtonClicked(object\
  \ sender, RoutedEventArgs e)\n{\n    try\n    {\n        // 执行结账处理\n        this.checkoutController.StartCheckoutProcessing(this.order);\n\
  \        // 显示订单摘要\n        ...\n    }\n    ...\n}\n```\n\n\n\n\n\n你现在已经将结账逻辑与该结账处理所需的组件解耦。`MainPage`\
  \ 类中的业务逻辑指定了 `CheckoutController` 应该使用的组件。\n\n### 测试应用程序\n\n1. 在调试（Debug）菜单上，点击启动调试（Start\
  \ Debugging）以生成并运行应用程序。\n2. 当 Wide World Importers 表单出现，选择一些项目（至少包含一个年龄限制项目），然后点击结账（Checkout）。\n\
  3. 当出现订单已提交（Order Placed）消息时，记下订单号，然后点击关闭（Close）或确定（OK）。\n4. 切换到文件管理器并移动到 `%USERPROFILE%\\\
  AppData\\Local\\Packages\\*yyy* \\LocalState` 文件夹，其中 `*yyy*`是以你记录的 GUID 开头的标识值。验证是否已创建新的\
  \ `audit-*nnnnnn*.xml` 文件和 `dispatch-*nnnnnn*.txt` 文件，其中 `nnnnnn` 是标识新订单的数字。检查这些文件并验证它们包含订单详情。\n\
  5. 返回 Visual Studio 2015 并停止调试。\n\n### Lambda 表达式和委托\n\n到目前为止看到的所有向委托添加方法的示例都使用了方法名。例如，在之前描述的自动化工厂场景中，你按照如下所示将\
  \ `folder` 对象的 `StopFolding` 方法添加到 `stopMachinery` 委托中：\n\n点击此处查看代码图像\n\n```c\n\
  this.stopMachinery += folder.StopFolding;\n```\n\n如果有一个与委托签名匹配的便捷方法，这种方法将非常有用。但如果\
  \ `StopFolding` 方法的签名实际上如下所示：\n\n点击此处查看代码图像\n\n```sharp\nvoid StopFolding(int shutDownTime);\
  \ // 在指定的秒数后关机\n```\n\n此签名现在与 `FinishWelding` 和 `PaintOff` 方法的签名不同，因此你不能使用同一个委托来处理所有三个方法。你该怎么办？\n\
  \n#### 创建方法适配器\n\n解决此问题的一种方法是创建另一个调用 `StopFolding` 但其本身不接受任何参数的方法，如下所示：\n\n点击此处查看代码图像\n\
  \n```sharp\nvoid FinishFolding()\n{\n    folder.StopFolding(0); // 立即关机\n}\n```\n\
  \n然后你可以使用之前相同的语法将 `FinishFolding` 方法代替 `StopFolding` 方法添加到 `stopMachinery` 委托中：\n\
  \n点击此处查看代码图像\n\n```csharp\nthis.stopMachinery += folder.FinishFolding;\n```\n\n\
  当调用 `stopMachinery` 委托时，它会调用 `FinishFolding`，进而转而调用 `StopFolding` 方法并传递参数 0。\n\n\
  ![Image](img/Image00005.jpg) 注意\n\n`FinishFolding` 方法是适配器的经典示例：一个转换（或适配）方法以使其具有不同签名的方法。这种模式非常常见，是\
  \ Erich Gamma、Richard Helm、Ralph Johnson 和 John Vlissides 编写的《设计模式：可复用面向对象设计的基础》（Addison-Wesley\
  \ Professional, 1994）一书中记录的模式集之一。\n\n在许多情况下，像这样的适配器方法很小，很容易在方法的海洋中丢失它们，特别是在一个大类中。此外，除了为了供委托使用而适配\
  \ `StopFolding` 方法之外，该方法不太可能被调用。C# 为此类情况提供了 Lambda 表达式。Lambda 表达式在第 18 章 中有所描述，在本章前面有更多它们的示例。在工厂场景中，你可以使用以下\
  \ Lambda 表达式：\n\n点击此处查看代码图像\n\n```csharp\nthis.stopMachinery += (() => folder.StopFolding(0));\n\
  ```\n\n当你调用 `stopMachinery` 委托时，它将运行 Lambda 表达式定义的代码，该代码转而带相应的参数调用 `StopFolding`\
  \ 方法。\n\n### 使用事件启用通知\n\n你现在已经了解如何声明委托类型、调用委托以及创建委托实例。然而，这只是故事的一半。尽管你可以通过委托间接调用任意数量的方法，但仍然必须显式地调用委托。在许多情况下，当发生重大事件时让委托自动运行将很有用。例如，在自动化工厂场景中，如果系统检测到机器过热，能够调用\
  \ `stopMachinery` 委托并停止设备可能是至关重要的。\n\n.NET Framework 事件（events），你可以使用它来定义和捕获重大操作，并安排调用委托来处理这种情况。.NET\
  \ Framework 中的许多类都暴露了事件。你在 UWP 应用表单上放置的大多数控件以及 `Windows` 类本身都使用事件在例如用户点击按钮或在字段中输入内容时运行代码。你也可以声明自己的事件。\n\
  \n#### 声明事件\n\n你在旨在作为事件源的类中声明事件。事件源（event source）通常是一个监控其环境并在发生重大事件时抛出事件的类。在自动化工厂中，事件源可以是一个监控机器温度的类。`TemperatureMonitor`\
  \ 类中的逻辑（未显示）必要时引发事件（将在后续章节中介绍如何引发事件）。此外，你是将方法添加到事件（这一过程被称为*订阅*），而不是添加到委托。我们将讨论事件的这一方面。\n\
  \n你声明事件的方式类似于声明字段。但是，由于事件旨在与委托配合，事件的类型必须是委托，并且必须在声明时加上 `event` 关键字。使用以下语法声明事件：\n\
  \n点击此处查看代码图像\n\n```sharp\nevent delegateTypeName eventName\n```\n\n例如，这里是自动化工厂中的\
  \ `StopMachineryDelegate`。它被移动到了名为 `TemperatureMonitor` 的类中，该类为各种温度探头提供了接口（将事件放在这里比放在\
  \ `Controller` 类中更有逻辑）：\n\n点击此处查看代码图像\n\n```sharp\nclass TemperatureMonitor\n{\n\
  \    public delegate void StopMachineryDelegate();\n}\n```\n\n你可以定义 `MachineOverheating`\
  \ 事件，它将调用 `StopMachineryDelegate`：\n\n点击此处查看代码图像\n\n```sharp\nclass TemperatureMonitor\n\
  {\n    public delegate void StopMachineryDelegate();\n    public event StopMachineryDelegate\
  \ MachineOverheating;\n}\n```\n\n#### 订阅事件\n\n像委托一样，事件自带 `+=` 运算符。你通过使用 `+=` 运算符订阅事件。在自动化工厂中，控制每个机器的软件可以安排在引发\
  \ `MachineOverheating` 事件时调用关机方法，如下所示：\n\n点击此处查看代码图像\n\n```csharp\nTemperatureMonitor\
  \ tempMonitor = new TemperatureMonitor();\n\ntempMonitor.MachineOverheating += (()\
  \ => { folder.StopFolding(0); });\ntempMonitor.MachineOverheating += welder.FinishWelding;\n\
  ```\n\n\n\n\n\n```tempMonitor.MachineOverheating += painter.PaintOff;\n```\n\n注意，该语法与向委托添加方法的语法相同。你甚至可以使用\
  \ Lambda 表达式（lambda expression）进行订阅。当 `tempMonitor.MachineOverheating` 事件运行时，它将调用所有订阅的方法并关机机器。\n\
  \n## 从事件中取消订阅\n\n既然你知道使用 `-=` 运算符将委托绑定到事件上，你可能已经猜到，也可以使用 `-=` 运算符将委托从事件中解除绑定。调用\
  \ `-=` 运算符会将该方法从事件的内部委托集合中移除。此操作通常被称为从事件中*取消订阅*（unsubscribing）。\n\n## 触发事件\n\n你可以像调用方法一样调用事件来触发它。当你触发事件时，所有绑定的委托都会按顺序调用。例如，这里是\
  \ `TemperatureMonitor` 类，它包含一个私有的 `Notify` 方法，该方法用于触发 `MachineOverheating` 事件：\n\
  \n点击此处查看代码图片\n\n```csharp\nclass TemperatureMonitor\n{\n    public delegate void\
  \ StopMachineryDelegate();\n    public event StopMachineryDelegate MachineOverheating;\n\
  \    ...\n    private void Notify()\n    {\n        if (this.MachineOverheating\
  \ != null)\n        {\n            this.MachineOverheating();\n        }\n    }\n\
  \    ...\n}\n```\n\n这是一个常用的惯用法。`null` 检查是必要的，因为事件字段隐式为 null，只有当方法使用 `+=` 运算符对其进行订阅时，它才会变为非空。如果你尝试触发空事件，将得到\
  \ `NullReferenceException` 异常。如果定义事件的委托需要任何参数，则在触发事件时必须提供相应的参数。你稍后会看到一些示例。\n\n***\n\
  \n![Image](img/Image00004.jpg) 重要\n\n事件具有非常实用的内置安全功能。公共事件（如 `MachineOverheating`）只能由定义它的类（即\
  \ `TemperatureMonitor` 类）中的方法触发。任何在类外部触发事件的尝试都会导致编译错误。\n\n***\n\n### 理解用户界面事件\n\n\
  如前所述，用于构建 GUI 的 .NET Framework 类和控件广泛使用了事件。例如，`Button` 类派自 `ButtonBase` 类，继承了一个类型为\
  \ `RoutedEventHandler` 的公共事件 `Click`。`RoutedEventHandler` 委托期望两个参数：导致事件触发的对象的引用，以及一个包含事件附加信息的\
  \ `RoutedEventArgs` 对象：\n\n点击此处查看代码图片\n\n```csharp\npublic delegate void RoutedEventHandler(Object\
  \ sender, RoutedEventArgs e);\n```\n\n`Button` 类看起来如下：\n\n点击此处查看代码图片\n\n```csharp\n\
  public class ButtonBase: ...\n{\n    public event RoutedEventHandler Click;\n  \
  \  ...\n}\n\npublic class Button: ButtonBase\n{\n    ...\n}\n```\n\n当单击屏幕上的按钮时，`Button`\
  \ 类会自动触发 `Click` 事件。这种安排可以很方便地为选定的方法创建委托，并将该委托绑定到所需的事件上。接下来的示例显示了一个 UWP 表单的代码，该表单包含一个名为\
  \ `okay` 的按钮，以及将 `okay` 按钮的 `Click` 事件连接到 `okayClick` 方法的代码：\n\n点击此处查看代码图片\n\n```csharp\n\
  partial class MainPage :\nglobal::Windows.UI.Xaml.Controls.Page,\nglobal::Windows.UI.Xaml.Markup.IComponentConnector,\n\
  global::Windows.UI.Xaml.Markup.IComponentConnector2\n{\n    ...\n    public void\
  \ Connect(int connectionId, object target)\n    {\n        switch(connectionId)\n\
  \        {\n            case 1:\n            {\n                this.okay = (global::Windows.UI.Xaml.Controls.Button)(target);\n\
  \                ...\n                ((global::Windows.UI.Xaml.Controls.Button)this.okay).Click\
  \ += this.okayClick;\n                ...\n            }\n            break;\n \
  \           default:\n                break;\n        }\n        this._contentLoaded\
  \ = true;\n    }\n    ...\n}\n```\n\n这段代码通常对你是隐藏的当你当你 Visual Studio 2015 中的设计视图窗口，并在表单的可扩展应用程序标记语言（XAML）描述中将\
  \ `okay` 按钮的 `Click` 属性设置为 `okayClick` 时，Visual Studio 2015 会为你生成这段代码。你所做的就是在你有访问权限的代码部分在事件处理方法\
  \ `okayClick` 中编写你的应用程序逻辑，在此例中，这就是 `MainPage.xaml.cs` 文件：\n\n点击此处查看代码图片\n\n```csharp\n\
  public sealed partial class MainPage : Page\n{\n    ...\n    private void okayClick(object\
  \ sender, RoutedEventArgs e)\n    {\n        // 处理 Click 事件的代码\n    }\n}\n```\n\n\
  各种 GUI 控件生成的事件始终遵循相同的模式。这些事件是委托类型，其签名具有 `void` 返回类型和两个参数。第一个参数始终事件的 `sender`（源），第二个参数始终是一个\
  \ `EventArgs` 参数（或派自 `EventArgs` 的类）。\n\n通过 `sender` 参数，你可以重用同一个方法处理多个事件。委托方法可以检查\
  \ `sender` 参数并做出相应。\n\n## 使用事件\n\n在之前的练习中，你修改了应用程序以将审计和出运解耦。你构建的 `CheckoutController`\
  \ 类通过使用委托调用审计和出运组件，并且对这些组件或其运行的方法一无所知；然而，如果组件能够在完成处理时通知应用程序，可能是非常有用的。\n\n这初听起来可能有点奇怪——当应用程序调用\
  \ `CheckoutController` 对象中的委托时，该委托引用的方法运行，应用程序继续执行后续语句。但事实并非如此！第 24 章“通过异步操作提高响应时间”演示了方法可以异步运行，当你调用一个方法时，在执行后续语句之前它可能尚未完成。这在后台线程上执行耗时操作以保持用户界面响应的\
  \ UWP 应用中尤其如此。在订单应用程序中，在 `CheckoutButtonClicked` 方法中，调用委托的代码后面是一个显示订单已放置对话框的语句：\n\
