  \ / 4, pixelWidth / 2));\n\nTask.WaitAll(first, second);\n```\n\n## 9. 在“调试”（Debug）菜单上，点击“开始调试”（Start\
  \ Debugging）来编译并运行应用程序。调整显示以确保可以看到任务管理器窗口显示 CPU 利用率。\n\n## 10. 在 Graph Demo 窗口中，点击“绘制图表”（Plot\
  \ Graph）。在任务管理器窗口中，等待 CPU 利用率趋于稳定。\n\n## 11. 重复步骤 10 几次，在每次点击之间等待 CPU 利用率趋于稳定。记录每次点击按钮时记录的持续时间，然后计算平均值。\n\
  \n你会发现应用程序的运行速度比以前快得多。在我的电脑上，典型时间缩短到了 2858 毫秒——时间减少了大约 40%。\n\n在大多数情况下，执行计算所需的时间将几乎减少一半，但应用程序仍然具有一些单线程元素，例如在数据生成后实际显示图表的逻辑。这就是为什么总时间仍然是应用程序以前版本所需时间的一半以上。\n\
  \n## 12. 切换到任务管理器窗口。\n\n你会发现应用程序使用了 CPU 的更多核心。在我的四核机器上，每当我点击“绘制图表”时，CPU 使用率都会达到约\
  \ 50% 的峰。这是因为两个任务分别运行在不同的核心上，但剩余的两个核心保持了空闲状态。如果你有一台双核机器，你可能会看到在每次生成图表时，处理器利用率会短暂接近\
  \ 100%。\n\n![Image](img/Image00155.jpg)\n\n如果你有一台四核电脑，可以通过在 `plotButton_Click` 方法中添加两个\
  \ `Task` 对象并将工作划分为四个部分来进一步增加 CPU 利用率并缩短时间，如下文加粗部分所示：\n\n点击此处查看代码图像\n\n```\nTask\
  \ first = Task.Run(() => generateGraphData(data, 0, pixelWidth / 8));\n\nTask second\
  \ = Task.Run(() => generateGraphData(data, pixelWidth / 8, pixelWidth / 4));\n\n\
  Task third = Task.Run(() => generateGraphData(data, pixelWidth / 4, pixelWidth *\
  \ 3 / 8));\n\nTask fourth = Task.Run(() => generateGraphData(data, pixelWidth *\
  \ 3 / 8, pixelWidth / 2));\n\nTask.WaitAll(first, second, third, fourth);\n```\n\
  \n如果你只有一个双核处理器，仍然可以尝试这种修改，并且你应该注意到时间上有了微小的获益效果。这主要是因为 CLR（公共语言运行时）所使用的算法优化了用于每个任务线程的调度方式。\n\
  \n### 使用 `Parallel` 类来抽象任务\n\n通过使用 `Task` 类，你可以完全控制应用程序创建的任务数量。然而，你必须修改应用程序的设计以适应\
  \ `Task` 对象的使用。你还需要添加代码来同步操作；应用程序只有在所有任务都完成后才能渲染图表。在复杂的应用程序中，任务的同步可能变成一个不平凡的过程，并且很容易出错。\n\
  \n通过使用 `Parallel` 类，你可以在无需重新设计应用程序的情况下将一些常见的编程结构并行化。在内部，`Parallel` 类创建它自己的的一组 `Task`\
  \ 对象，并在它们完成时自动同步这些任务。`Parallel` 类位于 `System.Threading.Tasks` 命名空间，并提供了一小组静态方法，你可以使用这些方法来指示尽可能以并行运行代码。这些方法如下：\n\
  \n![Image](img/Image00001.jpg)\n\n`Parallel.For` 你可以使用此方法代替 C# 的 `for` 语句。它定义了一个循环，在该循环中的迭代可以通过任务并行运行。此方法有许多重载，但每个重载的原理是相同的：你指定一个起始值、一个结束值以及一个接受整数参数的方法的引用。该方法会在起始值和指定的结束值减一之间的每个值上执行一次，并且参数被填充为指定当前值的整数。例如，考虑以下按顺序执行每次迭代的简单\
  \ `for` 循环：\n\n点击此处查看代码图像\n\n```csharp\nfor (int x = 0; x < 100; x++)\n{\n    //\
  \ 执行循环处理\n}\n```\n\n根据循环体中执行的操作，你可能可以将此循环替换为 `Parallel.For` 结构，该结构可以并行执行迭代，如下：\n\
  \n点击此处查看代码图像\n\n```csharp\nParallel.For(0, 100, performLoopProcessing);\n\nprivate\
  \ void performLoopProcessing(int x)\n{\n    // 执行循环处理\n}\n```\n\n使用 `Parallel.For`\
  \ 方法的重载，你可以提供每个线程私有的本地数据，为由 `For` 方法创建的任务指定各种选项，并创建一个用于传递状态的 `ParallelLoopState`\
  \ 对象。\n\n![Image](img/Image00001.jpg)\n\n`Parallel.ForEach` 你可以使用此方法代替 C# 的 `foreach`\
  \ 语句。它定义了一个循环，在该循环中的迭代可以通过任务并行运行。与 `For` 方法一样，它指定一个实现 `IEnumerable<T>` 的集合和一个接受单个\
  \ `T` 类型参数的方法引用。该方法对集合中的每个项执行一次，并将该项作为参数传递。提供了重载，供你提供本地数据并为创建的任务指定选项。\n\n`Parallel.Invoke`\
  \ 你可以使用此方法作为并行任务执行一组无参数的方法调用。你指定不接受参数且不返回值的委托方法（或表达式）。每个方法调用都可以在单独线程上运行，顺序任意。例如，以下代码执行了一系列方法调用：\n\
  \n```csharp\ndoWork();\ndoMoreWork();\ndoYetWork();\n```\n\n你可以可以使用代码替换这些语句，通过一系列任务调用这些方法：\n\
  \n```csharp\nParallel.Invoke(\n    doWork,\n    doMoreWork,\n    doYetWork\n);\n\
  ```\n\n你应该记住，`Parallel` 类根据环境和负载确定合适的实际并行度。例如，如果你使用 `Parallel.For` 实现一个执行 1000 次迭代的循环，`Parallel`\
  \ 类并不一定会创建 1000 个并发任务（除非你拥有具有 1000 核心的极其强大的处理器）。相反，`Parallel` 类会创建它认为平衡可用资源与保持处理器需求的最佳任务数量。单个任务可能会执行多次迭代，任务之间相互协调以确定每个任务将执行哪些迭代。一个重要结果是，你无法保证迭代的顺序，因此你必须确保迭代之间没有依赖关系；否则，你可能会遇到意外的结果，正如我们在在本章后面看到的那样。\n\
  \n在下一个练习中，你将回到原始版本的 GraphDemo 应用程序并使用 `Parallel` 类并发操作。\n\n### 使用 *Parallel* 类并行化\
  \ GraphDemo 应用程序中的操作\n\n**1.** 使用 Visual Studio 2015 打开 GraphDemo 解决方案，它位于你文档文件夹中的\
