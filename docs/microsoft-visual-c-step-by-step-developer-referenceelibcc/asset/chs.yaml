  \n**10.** 切换到显示 Customers 表单 UI 的 `MainPage.xaml` 文件。在 XAML 格中，找到最外层的 `Grid` 控件：\n\
  \n```xml\n<Grid Background=\"{ThemeResource ApplicationPageBackgroundThemeBrush}\"\
  >\n```\n\n在该控件的 XAML 标记中，将 `Background` 属性替换为引用 `GridStyle` 样式的 `Style` 属性：\n\n\
  ```xml\n<Grid Style=\"{StaticResource GridStyle}\" >\n```\n\n\n\n\n\n设计视图（Design\
  \ View）窗口中 `Grid` 控件的背景应该切换并显示木面板，如下所示：\n\n![Image](img/Image00200.jpg)\n\n* *\n\
  \n![Image](img/Image00005.jpg) 注意\n\n理想情况下，你应该确保应用于页面或控件的任何背景图像在设备构型因子和方向发生变化时都能保持其美感。在\
  \ 30 英寸显示器上很酷的图像在 Windows 手机上可能会显得失真和压缩。可能需要为不同的视图和方向提供替代背景，并使用视觉状态管理器（Visual State\
  \ Manager）修改控件的 `Background` 属性，以便随着视觉状态的变化进行切换。\n\n* *\n\n### 11. 返回代码和文本编辑器窗口中的\
  \ `AppStyles.xaml`，在 `GridStyle` 样式之后添加以下 `FontStyle` 样式：\n\n点击此处查看代码图像\n\n```xml\n\
  <Style x:Key=\"GridStyle\" TargetType=\"Grid\">\n\n...\n\n</Style>\n\n<Style x:Key=\"\
  FontStyle\" TargetType=\"TextBlock\">\n\n<Setter Property=\"FontFamily\" Value=\"\
  Segoe Print\"/>\n\n</Style>\n```\n\n此样式应用于 `TextBlock` 元素，并将字体更改为 Segoe Print。这种字体类似于手写风格。\n\
  \n在此阶段，可以在每个需要此字体的 `TextBlock` 控件中引用 `FontStyle` 样式，但这种方法与直接在每个控件的标记语言中设置 `FontFamily`\
  \ 相比并没有提供任何优势。样式的真正威力在于当你组合多个属性时，正如你将在接下来的步骤中看到的那样。\n\n点击此处查看代码图像\n\n在 `AppStyles.xaml`\
  \ 文件中添加此处所示的 `HeaderStyle` 样式：\n\n```xml\n<Style x:Key=\"FontStyle\" TargetType=\"\
  TextBlock\">\n\n...\n\n</Style>\n\n<Style x:Key=\"HeaderStyle\" TargetType=\"TextBlock\"\
  \ BasedOn=\"{StaticResource FontStyle}\">\n\n<Setter Property=\"HorizontalAlignment\"\
  \ Value=\"Center\"/>\n\n<Setter Property=\"TextWrapping\" Value=\"Wrap\"/>\n\n<Setter\
  \ Property=\"VerticalAlignment\" Value=\"Center\"/>\n\n<Setter Property=\"Foreground\"\
  \ Value=\"SteelBlue\"/>\n\n</Style>\n```\n\n这是一个复合样式，设置了 `TextBlock` 的 `HorizontalAlignment`、`TextWrapping`、`VerticalAlignment`\
  \ 和 `Foreground` 属性。此外，`HeaderStyle` 样式通过 `BasedOn` 属性引用了 `FontStyle` 样式。`BasedOn`\
  \ 属性提供了样式的简单继承形式。\n\n你将使用此样式来格式化出现在 `customersTabularView` 和 `customersColumnarView`\
  \ 控件顶部的标签。然而，这些标题的字体大小不同（表格布局的标题比列布局的标题大），因此你将额外另外两个样式。\n\n### 12. 将以下样式添加到 `AppStyles.xaml`\
  \ 文件中：\n\n点击此处查看代码图像\n\n```xml\n<Style x:Key=\"HeaderStyle\" TargetType=\"TextBlock\"\
