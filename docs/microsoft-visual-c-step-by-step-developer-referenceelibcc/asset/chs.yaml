  \n9. 在“调试”（Debug）菜单上，点击“启动调试（Start Debugging）”来生成并运行应用程序。\n\n#### 考虑使用 `Parallel`\
  \ 类的其他考虑因素\n\n#### 何时不使用 `Parallel` 类\n\n使用 `Parallel` 类的另一个考虑是并行操作应该是独立的。例如，如果你尝试使用\
  \ `Parallel.For` 并行化一个相互依赖的循环，结果将是不可预测的。\n\n为了说明我的意思，请查看以下代码（你可以在 `ParallelLoop`\
  \ 解决方案中找到此示例，位于 `\\Microsoft Press\\VBS\\Chapter23\\ParallelLoop` 文件夹）：\n\n点击此处查看代码图像\n\
  \n```csharp\nusing System;\nusing System.Threading;\nusing System.Threading.Tasks;\n\
  \nnamespace ParallelLoop\n{\n    class Program\n    {\n        private static int\
  \ accumulator = 0;\n        static void Main(string[] args)\n        {\n       \
  \     for (int i = 0; i < 100; i++)\n            {\n                AddToAccumulator(i);\n\
  \            }\n            Console.WriteLine($\"Accumulator is {accumulator}\"\
  );\n        }\n\n        private static void AddToAccumulator(int data)\n      \
  \  {\n            if ((accumulator % 2) == 0)\n            {\n                accumulator\
  \ += data;\n            }\n            else\n            {\n                accumulator\
  \ -= data;\n            }\n        }\n    }\n}\n```\n\n此程序遍历 0 到 99 的值并依次调用 `AddToAccumulator`\
  \ 方法。`AddToAccumulator` 方法检查 `accumulator` 变量的当前值，如果是偶数，则将参数值加到 `accumulator` 变量；否则，减去参数值。在程序结束时，显示结果。\n\
  \n为了增加此简单应用程序的并行程度，你可能会想过用 `Parallel.For` 替换 `Main` 方法中的 `for` 循环，如下：\n\n```csharp\n\
  static void Main(string[] args)\n{\n    Parallel.For(0, 100, AddToAccumulator);\n\
  \    Console.WriteLine($\"Accumulator is {accumulator}\");\n}\n```\n\n\n\n然而，无法保证为运行\
  \ `AddToAccumulator` 方法的多次调用而创建的任务会按照任何特定顺序执行。（该代码不是线程安全的，因为运行任务的多个线程可能会尝试并发修改 `accumulator`\
  \ 变量。）`AddToAccumulator` 方法计算出的值取决于所维护的顺序，因此此项修改的结果是，应用程序现在每次运行时都可能生成不同的值。在某种简单的情况下，你可能实际上并不会看到计算出的值有任何差异，因为\
  \ `AddToAccumulator` 方法的运行速度非常快，且 .NET Framework 可能会选择使用同一个线程按顺序运行每次调用。但是，如果你对 `AddToAccumulator`\
  \ 方法进行以下更改（如**加粗**显示所示），你将会获得不同的结果：\n\n点击此处查看代码图像\n\n```csharp\nprivate static void\
  \ AddToAccumulator(int data)\n{\n    if ((accumulator % 2) == 0)\n    {\n      \
  \  accumulator += data;\n        Thread.Sleep(10); // 等待 10 毫秒\n    }\n    else\n\
  \    {\n        accumulator -= data;\n    }\n}\n```\n\n`Thread.Sleep` 方法仅仅是导致当前线程等待指定的时间。此修改模拟了线程执行额外的处理过程，并影响了\
  \ `Parallel` 类调度任务的方式，任务现在运行在不同的线程上，导致了不同的顺序。\n\n通用规则是，只有在你能够保证循环的每次迭代都是相互独立的条件下，才使用\
  \ `Parallel.For` 和 `Parallel.ForEach` 并对你的代码进行彻底测试。类似的考虑也适用于 `Parallel.Invoke`：仅当方法调用是相互独立的，且应用程序不依赖于它们按特定顺序运行运行时，才使用此构造结构。\n\
  \n### 取消任务和处理异常\n\n执行长时间运行操作的应用程序，一个共同需求是在必要时能够停止这些操作。然而，你不应该简单地中止任务，因为这可能会导致应用程序中的数据处于不确定的状态。相反，`Task`\
  \ 类实现了一种协作取消策略。协作取消允许任务选择一个方便的时间点停止处理，并在必要时允许它撤销取消之前已执行的任何工作。\n\n#### 协作取消的机制\n\n\
  协作取消基于“取消令牌”（`cancellation token`）的概念。取消令牌是一个表示取消一个或多个任务请求的结构。任务运行的方法应该包含一个 `System.Threading.CancellationToken`\
  \ 参数。想要取消任务的应用程序会将该参数的布尔属性 `IsCancellationRequested` 设置为 `true`。在任务中运行的方法可以在处理过程的各个位点查询此属性。如果该属性在任何点被设置为\
  \ `true`，它就知道应用程序已请求取消任务。此外，方法还知道它到为止做了哪些工作，因此在必要时它可以撤销任何更改并完成。或者，方法可以简单地忽略该请求并继续运行。\n\
  \n***\n\n![图像](img/Image00013.jpg) 提示\n\n你应该频繁检查任务中的取消令牌，但频率不要高到会对任务性能产生不利。如果可能，你的目标应该是至少每\
  \ 10 毫秒检查一次取消，但频率不能高于每毫秒一次一次。\n\n***\n\n应用程序通过创建 `System.Threading.CancellationTokenSource`\
  \ 对象并查询该对象的 `Token` 属性来获取 `CancellationToken`。然后应用程序可以将此 `CancellationToken` 对象作为参数传递给应用程序创建并运行的任务所启动的任何方法。如果应用程序需要取消任务，它调用\
  \ `CancellationTokenSource` 对象的 `Cancel` 方法。此方法会将传递给所有任务的 `CancellationToken` 的\
  \ `IsCancellationRequested` 属性设置为 `true`。\n\n下面的代码示例显示了如何创建取消令牌并使用它取消任务。`initiateTasks`\
  \ 方法实例化取消令牌并使用它来取消任务。应用程序可以将此 `CancellationToken` 对象作为参数传递给应用程序创建并运行的任务所启动的任何方法。如果应用程序需要取消任务，它调用\
  \ `CancellationTokenSource` 对象的 `Cancel` 方法。此方法会将传递给所有任务的 `CancellationToken` 的\
  \ `IsCancellationRequested` 属性设置为 `true`。\n\n点击此处查看代码图像\n\n```csharp\npublic class\
  \ MyApplication\n{\n    // 管理任务的方法\n    private void initiateTasks()\n    {\n  \
  \      // 创建取消令牌并获取令牌\n        CancellationTokenSource tokenSource = new CancellationTokenSource();\n\
  \        CancellationToken cancellationToken = tokenSource.Token;\n\n        //\
  \ 创建任务并运行 doWork 方法\n        Task myTask = Task.Run(() => doWork(cancellationToken));\n\
  \n        ...\n\n        if (...)\n        {\n            // 取消任务\n            tokenSource.Cancel();\n\
  \        }\n\n        ...\n    }\n\n    // 由任务运行的方法\n    private void doWork(CancellationToken\
  \ token)\n    {\n        ...\n\n        // 如果应用程序设置了取消令牌\n        if (token.IsCancellationRequested)\n\
  \        {\n            // 清理并完成\n            return;\n        }\n        // 如果任务未取消，则正常运行\n\
  \        ...\n    }\n}\n```\n\n除了对取消提供高程度的控制外，这种方法可以扩展到任意数量的任务；可以将相同的 `CancellationToken`\
  \ 对象传递给它们。如果你调用 `CancellationTokenSource` 的 `Cancel` 方法，每个任务都会检查 `IsCancellationRequested`\
  \ 属性是否被设置并相应处理。\n\n你还可以通过 `Register` 方法向取消令牌注册一个回调方法（`Action` 委托的形式）。当应用程序调用 `CancellationTokenSource`\
  \ 的 `Cancel` 方法时，该回调就会运行。然而，你无法确定它的执行时间；它可能在任务执行自己的取消处理之前或之后，甚至在过程中执行。\n\n点击此处查看代码图像\n\
  \n```csharp\n...\ncancellationToken.Register(doAdditionalWork);\n...\nprivate void\
  \ doAdditionalWork()\n{\n    // 执行额外的取消处理\n}\n```\n\n### 为 GraphDemo 添加取消功能\n\n\
