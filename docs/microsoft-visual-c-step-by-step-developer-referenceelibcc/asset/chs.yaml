  \ `x` 是参数？答案是它并！与字段同名的方法参数会隐藏方法中所有语句的该字段。这段代码实际上所做的是将参数赋值给自身；它完全没有修改字段。这显然不是你想要的。\n\
  \n解决方案是使用 `this` 关键字来区分哪些变量是参数，哪些是字段。在变量前加上 `this` 意味着“此对象中的字段”。\n\n\n\n\n\n###\
