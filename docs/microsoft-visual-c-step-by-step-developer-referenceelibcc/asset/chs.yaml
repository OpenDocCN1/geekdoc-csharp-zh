  \ `private` 术语是在类级别起的，而不是在对象级别；作为同一类实例的两个对象可以访问彼此的私有数据，但作为另一个类实例的对象则不能访问。\n\n要计算距离，你可以使用勾股定理计算\
  \ `xDiff` 平方与 `yDiff` 平方和的平方根。`System.Math` 类提供了 `Sqrt` 方法，可以使用它来计算平方根。\n\n####\
  \ 4. 声明一个 `double` 类型变量 `distance`，并用它存储上述计算的结果。\n\n点击此处查看代码图片\n\n```csharp\npublic\
