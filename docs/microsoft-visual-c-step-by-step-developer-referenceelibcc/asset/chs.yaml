  \ 方法应该完全如下（粗体部分）：\n\n点击此处查看代码图像\n\n*(此处由于您提供的原文存在重复，已按要求翻译了所有内容)*\n\n\n\n\n```csharp\n\
  copy = c; // copy and c refer to the same object\n\n...\n\n}\n```\n\n## 空条件运算符 (Null-conditional\
  \ operators)\n\nC# 的最新版本包含了一个新运算符，即空条件运算符（null-conditional operator），它让你能够更简洁地测试空值。要使用空条件运算符，你需要在变量名后面添加一个问号（`?`）。\n\
  \n例如，假设你尝试在一个 `Circle` 对象值为 `null` 的情况下调用该对象的 `Area` 方法：\n\n点击此处查看代码图片\n\n```csharp\n\
  Circle c = null;\n\nConsole.WriteLine($\"The area of circle c is {c.Area()}\");\n\
  ```\n\n在这种情况下，`Circle.Area` 方法会抛出一个 `NullReferenceException` 异常，这是合理的，因为你无法计算一个不存在的圆的面积。\n\
  \n为了避免此异常，你可以在尝试调用 `Circle.Area` 方法之前，测试 `Circle` 对象是否为 `null`：\n\n点击此处查看代码图片\n\n\
  ```csharp\nif (c != null)\n{\n    Console.WriteLine($\"The area of circle c is {c.Area()}\"\
  );\n}\n```\n\n在这种情况下，如果 `c` 是 `null`，则没有任何内容被写入命令行窗口。或者，你可以在尝试调用 `Circle.Area` 方法之前，在\
  \ `Circle` 对象上使用空条件运算符：\n\n点击此处查看代码图片\n\n```csharp\nConsole.WriteLine($\"The area\
  \ of circle c is {c?.Area()}\");\n```\n\n空条件运算符告诉运行时引擎，如果应用运算符的变量为 `null`，则忽略当前语句。在这种情况下，命令行窗口将显示以下文本：\n\
  \nThe area of circle c is\n\n两种方法都是有效的，并可能在不同场景下你的需求。空条件运算符可以帮助你保持代码简洁，特别是当你处理具有嵌套引用类型的复杂属性时，这些类型都可能为\
  \ `null`。\n\n## 使用可空类型 (Using nullable types)\n\n`null` 值对于初始化引用类型非常有用。有时，你需要为值类型提供等价的值，但\
  \ `null` 本身是一个引用，因此你不能将其赋值给值类型。因此，以下语句在 C# 中是非法的：\n\n```csharp\nint i = null; //\
  \ 非法\n```\n\n然而，C# 定义了一个修饰符，你可以用它声明一个变量为可空值类型。可空值类型的行为与原始值类型相似，但你可以向它分配 `null` 值。你使用问号（`?`）来表示值类型是可空的，如下：\n\
  \n```csharp\nint? i = null; // 合法\n```\n\n你可以通过像测试引用类型一样来确定可空变量是否包含 `null`。\n\n\
  ```csharp\nif (i == null)\n...\n```\n\n你可以直接将相应值类型的表达式赋值给可空变量。以下示例均都是合法的：\n\n点击此处查看代码图片\n\
  \n```csharp\nint? i = null;\n\nint j = 99;\n\ni = 100; // 将值类型常量拷贝到可空类型\n\ni = j;\
  \ // 将值类型变量拷贝到可空类型\n```\n\n你应该注意，反过来则不成立。你不能将可空变量赋值给普通的值类型变量。因此，根据上一个示例中变量 `i` 和\
  \ `j` 的定义，以下语句是不允许的：\n\n```csharp\nj = i; // 非法\n```\n\n考虑到变量 `i` 可能包含 `null`，而\
  \ `j` 是一个不能包含 `null` 的值类型，这是合理的。这意味着你不能将可空变量作为参数传递给一个期望普通值类型的方法。如果你还记得，上一个练习中的 `Pass.Value`\
  \ 方法期望一个普通的 `int` 参数，因此以下方法调用将无法编译：\n\n点击此处查看代码图片\n\n```csharp\nint? i = 99;\n\n\
  Pass.Value(i); // 编译错误\n```\n\n![Image](img/Image00005.jpg) 注意\n\n注意不要将可空类型与空条件运算符混淆。可空类型通过在类型名称后添加问号来指示，而空条件运算符是附加在变量名上的。\n\
  \n## 理解可空类型的属性 (Understanding the properties of nullable types)\n\n可空类型暴露了一对属性，你可以使用它们来判断类型实际上是否具有非空值以及该值是什么。`HasValue`\
  \ 属性指示可空类型是包含值还是为 `null`。你可以通过读取 `Value` 属性来获取非空可空类型的值，如下：\n\n点击此处查看代码图片\n\n```csharp\n\
  int? i = null;\n\n...\n\nif (!i.HasValue)\n{\n    // 如果 i 为 null，则给它赋值为 99\n   \
  \ i = 99;\n}\nelse\n{\n    // 如果 i 不是 null，则显示它的值\n    Console.WriteLine(i.Value);\n\
  }\n```\n\n第 4 章, “使用决策语句,”指示了非运算符（`!`）反转布尔值。这段代码片段测试了可空变量 `i`，如果它没有值（即为 `null`），则给其赋值\
  \ 99；否则，显示它的值。在这个示例中，使用 `HasValue` 属性相比直接测试 `null` 并没有任何优势。然而，这些表面上的缺陷是因为 `int?`\
  \ 是一个非常简单的可空类型。你将在第 9 章, “创建值类型和结构体”中看到一些示例。\n\n可空类型的 `Value` 属性是只读的。你可以使用该属性读取值，但不能对其修改它。\n\
  \n## 使用 ref 和 out 参数 (Using ref and out parameters)\n\n通常，当你将参数传递给方法时，相应的参数会用参数的副本进行初始化。无论参数是值类型（如\
  \ `int`）、可空类型（如 `int?`）还是引用类型（如 `WrappedInt`），都是如此。这种安排意味着对参数的任何更改都不可能影响传入参数的值。例如，在以下代码中，控制台输出的值是\
  \ 42 而不是 43。`doIncrement` 方法增加的是参数（`arg`）的*副本*，而不是原始参数，演示如下：\n\n点击此处查看代码图片\n\n```cs\n\
  static void doIncrement(int param)\n{\n    param++;\n}\n\nstatic void Main()\n{\n\
  \    int arg = 42;\n    doIncrement(arg);\n    Console.WriteLine(arg); // 写入 42，不是\
  \ 43\n}\n```\n\n\n\n\n如果你在参数名前加上 `ref` 关键字，C# 编译器将生成代码，传递实际参数的引用而不是参数的副本。当使用 `ref`\
  \ 参数时，你对该参数所执行的任何操作都会应用到原始参数上，因为参数和参数都引用同一数据。当你将一个参数作为 `ref` 参数传递时，你必须在在参数名前也加上\
  \ `ref` 关键字。这种语法为程序员提供了一个有用的视觉提示，表明该参数可能会发生变化。这里是之前的示例，这次它被修改为使用 `ref` 关键字：\n\n\
  点击此处查看代码图像\n\n```csharp\nstatic void doIncrement(ref int param) // 使用 ref\n{\n \
  \   param++;\n}\n\nstatic void Main()\n{\n    int arg = 42;\n    doIncrement(ref\
  \ arg); // 使用 ref\n    Console.WriteLine(arg); // 写入 43\n}\n```\n\n这一次，`doIncrement`\
  \ 方法接收的是原始参数的引用而不是副本，因此该方法通过使用该引用所做的任何更改实际上都会更改原始值。这就是为什么控制台上显示了值 43。\n\n请记住，C#\
  \ 强制执行一条规则：在读取变量之前必须先为变量赋值。这条规则也适用于方法参数；即使参数被定义为 `ref` 参数，你不能将未初始化的值作为参数传递给方法。例如，在下面的示例中，`arg`\
  \ 未初始化，因此这段代码将无法编译。这种失败是因为 `doIncrement` 方法内部的语句 `param++;` 实际上是语句 `arg++;` 的别名——而只有当\
  \ `arg` 具有定义值时，才允许此操作：\n\n点击此处查看代码图像\n\n```csharp\nstatic void doIncrement(ref int\
  \ param)\n{\n    param++;\n}\n\nstatic void Main()\n{\n    int arg; // 未初始化\n  \
  \  doIncrement(ref arg);\n    Console.WriteLine(arg);\n}\n```\n\n### 创建 `out` 参数\n\
  \n编译器在调用方法之前会检查 `ref` 参数是否已赋值。然而，在某些情况下，你可能希望方法本身来初始化参数。你可以使用 `out` 关键字来实现此。\n\n\
  `out` 关键字在语法上与 `ref` 关键字相似。你可以在参数名前加上 `out` 关键字，使参数成为参数的别名。与使用 `ref` 时一样，你对参数所执行的任何操作也会应用到原始参数上。当你将参数传递给\
  \ `out` 参数时，你必须在参数名前也加上 `out` 关键字。\n\n`out` 关键字是 `output`（输出）的缩写。当你将 `out` 参数传递给方法时，方法在结束或返回之前*必须*为其赋一个值，如下面的示例所示：\n\
  \n点击此处查看代码图像\n\n```csharp\nstatic void doInitialize(out int param)\n{\n    param\
  \ = 42; // 在结束前初始化 param\n}\n```\n\n下面的示例无法编译，因为 `doInitialize` 没有为 `param` 赋值：\n\
  \n点击此处查看代码图像\n\n```csharp\nstatic void doInitialize(out int param)\n{\n    // 什么都不做\n\
  }\n```\n\n因为 `out` 参数必须由方法赋值，所以你允许在不初始化参数的情况下调用该方法。例如，下面的代码调用了 `doInitialize` 来初始化变量\
  \ `arg`，然后在控制台上显示了它：\n\n点击此处查看代码图像\n\n```csharp\nstatic void doInitialize(out int\
  \ param)\n{\n    param = 42;\n}\n\nstatic void Main()\n{\n    int arg; // 未初始化\n\
  \    doInitialize(out arg); // 合法\n    Console.WriteLine(arg); // 写入 42\n}\n```\n\
  \n你将在下一次练习中检查 `ref` 参数。\n\n### 使用 `ref` 参数\n\n1. **在 Visual Studio 2015 中返回 Parameters（参数）项目。**\n\
  2. **在代码和文本编辑器窗口中显示 `Pass.cs` 文件。**\n3. **编辑 `Value` 方法，使其接受 `ref` 参数作为参数。**\n\n\
  `Value` 方法看起来应该像这样：\n\n点击此处查看代码图像\n\n```csharp\nclass Pass\n{\n    public static\
  \ void Value(ref int param)\n    {\n        param = 42;\n    }\n    ...\n}\n```\n\
  \n4. **在代码和文本编辑器窗口中显示 `Program.cs` 文件。**\n5. **取消前四条语句的注释。注意 `doWork` 方法的第三条语句——`Pass.Value(i);`——指示了一个错误。该错误是因为\
  \ `Value` 方法现在期望一个 `ref` 参数。编辑此语句，使 `Pass.Value` 方法的调用以 `ref` 参数传递其参数。**\n\n***\n\
  \n![Image](img/Image00005.jpg) 注意\n保持创建和测试 `WrappedInt` 对象的四条语句不变。\n\n***\n\n`doWork`\
  \ 方法现在看起来应该像这样：\n\n```csharp\nclass Program\n{\n    static void doWork()\n    {\n\
  \        int i = 0;\n        Console.WriteLine(i);\n        Pass.Value(ref i);\n\
  \        Console.WriteLine(i);\n    }\n}\n```\n\n6. **在调试菜单上，点击无调试启动。** 这次，控制台上显示的是\
  \ 0 和 42。这显示 `Value` 方法成功修改了 `i`。\n7. **按 Enter 键关闭应用程序并返回 Visual Studio 2015。**\n\
  \n***\n\n![Image](img/Image00005.jpg) 注意\n你也可以对引用类型使用 `ref` 和 `out` 修饰符。效果完全相同：参数变为参数的别名。\n\
  \n### 内存是如何组织的\n\n计算机使用内存来存储执行中的程序。为了理解值类型和引用类型的区别，了解数据是如何组织的会有帮助。\n\n操作系统和像 C#\
  \ 这样的运行时将用于数据的内存分为两个区域，每个区域的管理方式都不同。这两个内存区域传统上称为栈（stack）和堆（heap）。它们的作用如下：\n\n![Image](img/Image00001.jpg)\
  \ 当你调用方法时，参数和局部变量内存总是从栈中获取。当方法结束（返回或抛出异常）时，获取的内存会被释放，并在调用另一个方法时再次可用。栈上的方法参数和局部变量具有定义的生命周期：它们在方法开始时产生，在方法完成时消失。\n\
  \n***\n\n![Image](img/Image00005.jpg) 注意\n实际上，相同的生命周期适用于定义在大括号包围的代码块中的变量。在下面的代码示例中，变量\
  \ `i` 在 `while` 循环开始时创建，但在 `while` 循环结束并执行到右括号之后消失：\n\n```csharp\nwhile (...)\n\
  {\n    int i = ...; // i 在栈上被创建\n    ...\n}\n// i 在此处从栈消失\n```\n\n***\n\n![Image](img/Image00001.jpg)\
  \ 注意\n当你使用 `new` 关键字创建对象（类的实例）时，构建对象所需的内存总是从堆中获取。你已经看到同一个对象可以在多个地方通过引用变量进行引用。当对象的最后一个引用消失时，对象所使用的内存将变得可用（尽管可能不会立即回收）。第\
  \ 14 章包含了关于堆内存回收的更详细讨论。因此，在堆上创建的对象具有不确定的生命周期；对象通过 `new` 关键字创建，但只有在最后一个引用被移除一段时间后才会消失。\n\
  \n\n\n所有的值类型都创建在栈（stack）上。所有的引用类型（对象）都创建在堆（heap）上（尽管引用本身在栈上）。可空类型实际上是引用类型，它们创建在堆上。\n\
  \n***\n\n`stack`（栈）和 `heap`（堆）这两个名称来自于运行时管理内存的方式：\n\n![Image](img/Image00001.jpg)\
  \ 栈内存的结构就像一堆堆叠在一起的盒子。当调用一个方法时，每个参数都会被放入一个盒子中并放在栈的顶端。每个局部变量同样会被分配一个盒子，这些盒子被放在栈上已有的盒子的上方。当方法结束时，你可以认为这些盒子从栈中被移除。\n\
  \n![Image](img/Image00001.jpg) 堆内存就像是散落在房间里的一大堆盒子，而不是整齐地堆叠在一起。每个盒子上都有一个标签，标明它是否正在被使用。当创建一个新对象时，运行时会搜索一个空盒子并将其分配给该对象。该对象的引用存储在栈上的局部变量中。运行时跟踪每个盒子的引用计数。（记住，两个变量可以引用同一个对象。）当最后一个引用消失时，运行时会将该盒子标记为未使用，并在未来的某个时刻清空该盒子，使其变为可用。\n\
  \n### 使用栈和堆\n\n现在，让我们来看当调用一个名为 `Method` 的方法时会发生什么：\n\n```cpp\nvoid Method(int param)\n\
  {\n    Circle c;\n    c = new Circle(param);\n    ...\n}\n```\n\n假设传递给 `param` 的参数值\
  \ 42。当调用该方法时，会从栈上分配一块内存（仅足够容纳一个 `int` 的内存）并将其初始化为值 42。随着执行进入方法内部，还会从栈上分配另一块足够容纳引用（一个内存地址）的内存，但保持未初始化。这是给\
  \ `Circle` 变量 `c` 使用的。接下来，从堆上分配另一块足够容纳 `Circle` 对象的内存。这就是 `new` 关键字所做的。`Circle`\
  \ 构造函数运行，将这段原始堆内存转换为 `Circle` 对象。指向该 `Circle` 对象的引用存储在变量 `c` 中。接下来的插图展示了这种情况：\n\n\
  ![Image](img/Image00076.jpg)\n\n此时，你应该注意以下两点：\n\n![Image](img/Image00001.jpg) 虽然对象存储在堆上，但指向该对象的引用（变量\
  \ `c`）存储在栈上。\n\n![Image](img/Image00001.jpg) 堆内存不是无限的。如果堆内存耗尽，`new` 操作符将抛出 `OutOfMemoryException`\
  \ 异常，且对象不会被创建。\n\n***\n\n![Image](img/Image00005.jpg) 注意\n\n`Circle` 构造函数也可能抛出异常。如果发生这种情况，分配给\
  \ `Circle` 对象的内存将被回收，构造函数返回的值将是 `null`。\n\n***\n\n当方法结束时，参数和局部变量离开了作用范围。为 `c` 和\
  \ `param` 获取的内存会自动释放回栈中。运行时注意到 `Circle` 对象不再被引用，并将在未来的某个时刻安排堆来回收其内存。（参见第 14 章。）\n\
  \n### System.Object 类\n\n.NET Framework 中最重要的引用类型之一是 `System` 命名空间中的 `Object` 类。为了充分理解\
  \ `System.Object` 类的意义，你需要理解继承，这在第 12 章 的“处理继承”中已有描述。目前，只需接受这一点：所有类都是 `System.Object`\
  \ 的特化类型，并且你可以使用 `System.Object` 创建一个可以引用任何引用类型的变量。`System.Object` 是一个如此重要的类，以至于\
  \ C# 为 `object` 关键字作为 `System.Object` 的别名。在代码中，你可以使用 `object`，也可以写 `System.Object`——它们的含义完全相同。\n\
  \n***\n\n![Image](img/Image00013.jpg) 提示\n\n优先使用 `object` 关键字而不是 `System.Object`。它更直接，并且与其他作为类的同义词关键字保持一致（例如用于\
  \ `System.String` 的 `string` 以及其他一些在第 9 章 中涵盖的词汇）。\n\n***\n\n在接下来的示例中，变量 `c` 和 `o`\
  \ 都引用同一个 `Circle` 对象。`c` 的类型是 `Circle` 而 `o` 的类型是 `object`（`System.Object` 的别名），这一事实实际上为内存中的同一个项目提供了两个不同的视图。\n\
  \n```cpp\nCircle c;\nc = new Circle(42);\nobject o;\no = c;\n```\n\n下方的图说明了变量 `c`\
  \ 和 `o` 如何引用堆上的同一个项目。\n\n![Image](img/Image00077.jpg)\n\n### 装箱 (Boxing)\n\n正如你刚刚看到的，`object`\
  \ 类型的变量可以引用任何引用类型的任何项目。然而，`object` 类型的变量也可以引用任何引用类型。等等，文中说 `object` 也可以引用值类型。例如，以下语句初始化了变量\
  \ `i`（类型为 `int`）为 42，然后初始化了变量 `o`（类型为 `object`）：\n\n```cpp\nint i = 42;\nobject\
  \ o = i;\n```\n\n第二条语句需要一些解释来理解实际发生了什么。记住 `i` 是一个值类型，它位于栈上。如果 `o` 直接引用 `i`，引用将指向栈。然而，所有的引用必须指向堆；引用栈会严重损害运行时的健壮性，因此是不允许的。因此，运行时分配堆内存并将\
  \ `i` 的值拷贝到该内存中，然后让对象 `o` 指向该内存。这种从栈到堆的自动拷贝被称为**装箱**。接下来的插图展示了结果：\n\n![Image](img/Image0078.jpg)\n\
  \n***\n\n![Image](img/Image00004.jpg) 重要\n\n如果你修改变量 `i` 的原始值，通过 `o` 引用的堆值将不会改变。同样，如果你修改堆上的值，变量的原始值将不会改变。\n\
  \n***\n\n### 解箱 (Unboxing)\n\n由于 `object` 类型的变量可以引用值的装箱副本，因此允许你通过变量获取该装箱值是合理的。你可能期望通过简单的赋值语句访问变量\
  \ `o` 引用的装箱 `int` 值：\n\n```cpp\nint i = o;\n```\n\n然而，如果你尝试这种语法，将得到编译错误。如果你仔细考虑，会发现使用\
  \ `int i = o;` 语法是非常合理的。毕竟，`o` 可能引用任何内容，而不仅仅是 `int`。考虑如果允许以下语句，以下代码会发生什么：\n\n```cpp\n\
  Circle c = new Circle();\nint i = 42;\nobject o;\no = c; // o 引用 circle\ni = o;\
  \ // i 中存储了什么？\n```\n\n要获取装箱副本的值，你必须使用所谓的**强制转换 (cast)**。这种操作在实际拷贝之前会检查将一种类型转换为另一种类型是否安全。你在\
  \ `object` 变量前加上括号内的类型名称，如下例所示：\n\n```cpp\nint i = 42;\nobject o = i; // 装箱\ni =\
  \ (int)o; // 编译通过\n```\n\n\n\n这种转换的效果是细微的。编译器注意到你在转换中指定了类型 `int`。接下来，编译器会生成代码在运行时检查\
  \ `o` 实际上指向什么。它完全可以是任何内容。仅仅因为你的转换说 `o` 指向一个 `int`，并不意味着它实际上确实指向一个 `int`。如果 `o` 确实指向一个装箱的\
  \ `int` 且所有内容都匹配，转换就会成功，编译器生成的代码从装箱的 `int` 中提取值并将其复制到 `i` 中。（在本例中，装箱后的值随后存储在 `i`\
  \ 中。）这被称为 `unboxing`（拆箱）。接下来的图显示了正在发生的过程：\n\n![Image](img/Image00079.jpg)\n\n另一方面，如果\
  \ `o` 不指向一个装箱的 `int`，则存在类型不匹配，导致转换失败。编译器生成的代码会在运行时抛出 `InvalidCastException` 异常。这里是一个失败的拆箱转换示例：\n\
  \n点击此处查看代码图像\n\n```\nCircle c = new Circle(42);\nobject o = c; // 因为 Circle 是引用变量，所以不会箱\n\
  int i = (int)o; // 编译通过但在运行时会抛出异常\n```\n\n接下来的图说明了这种情况：\n\n![Image](img/Image00080.jpg)\n\
  \n你将在稍后的练习中使用装箱和拆箱。请记住，由于需要大量的检查以及需要分配额外的堆内存，装箱和拆箱是开销较大的操作。装箱有其用处，但如果使用不当，会严重损害程序的性能。你将在\
  \ 第 17 章 中看到装箱的替代方案，“引入泛型 ”。\n\n### 安全地转换数据\n\n通过使用转换，你可以指定根据你认为，对象引用的数据具有特定类型，并且使用该类型引用对象是安全的。这里的关键短语是“根据你认为”。C#\
  \ 编译器不会检查这种情况是否成立，但运行时会检查。如果内存中的对象类型与转换不匹配，运行时将像前一节描述的那样抛出 `InvalidCastException`。你应该准备好在异常发生时捕获它并进行妥善处理。\n\
  \n然而，在对象类型不是你预期时捕获异常并尝试恢复是一种相当麻烦的方法。C# 提供了另外两个非常有用的运算符，可以帮助你以更优雅的方式执行转换：`is` 和 `as`\
  \ 运算符。\n\n### `is` 运算符\n\n你可以使用 `is` 运算符来验证对象的类型是否是你预期的类型，如下所示：\n\n点击此处查看代码图像\n\n\
  ```c\nWrappedInt wi = new WrappedInt();\n...\nobject o = wi;\nif (o is WrappedInt)\n\
  {\n    WrappedInt temp = (WrappedInt)o; // 这是安全的；o 是 WrappedInt\n...\n}\n```\n\n\
  `is` 运算符接受两个操作数：左侧是对象的引用，右侧是类型的名称。如果堆上引用的对象具有指定的类型，则 `is` 求值为 `true`；否则，`is` 求值为\
  \ `false`。前面的代码仅在知道转换将成功时，才尝试将引用转换为 `object` 变量 `o`。\n\n### `as` 运算符\n\n`as` 运算符的作用与\
  \ `is` 类似，但方式略有精简。你可以这样使用 `as` 运算符：\n\n点击此处查看代码图像\n\n```csharp\nWrappedInt wi =\
  \ new WrappedInt();\n...\nobject o = wi;\nWrappedInt temp = o as WrappedInt;\nif\
  \ (temp != null)\n{\n    ... // 转换成功\n}\n```\n\n与 `is` 运算符一样，`as` 运算符接受一个对象和一个类型作为其操作数。运行时尝试将对象转换为指定的类型。如果转换成功，则返回结果，在本例中，结果被赋值给\
  \ `WrappedInt` 变量 `temp`。如果转换失败，`as` 运算符求值为 `null` 并将其赋值给 `temp`。\n\n`is` 和 `as`\
  \ 运算符的内容比这里描述的要多，第 12 章](#text00018.html_ch12) 对它们进行了更详细的讨论。\n\n* *\n\n### 指针和不安全代码\n\
  \n本节仅供你参考，针对熟悉 C 或 C++ 的开发者。如果你是编程新手，请随时跳过本节。\n\n如果你已经用 C 或 C++ 等语言编写过程序，那么本章关于对象引用的很多讨论对你来说可能是熟悉的。指针是内存项的地址。在\
  \ C 和 C++ 语言中都有类似的结构来处理引用。指针持有内存（堆或栈上）的地址。例如，使用特殊语法来标识指针：\n\n```csharp\nint *pi;\n\
  ```\n\n虽然变量 `pi` 被声明为指针，但在初始化它之前，它并不指向任何地方。例如，使用以下语句声明一个指针：\n\n```csharp\nint *pi;\n\
  ```\n\n要使用 `pi` 指向 `i`，你可以使用地址运算符 `&`：\n\n```csharp\nint *pi;\nint i = 99;\n...\n\
  pi = &i;\n```\n\n你可以通过指针 `pi` 访问并修改位于 `i` 中的值：\n\n```csharp\n*pi = 100;\n```\n\n\
  学习 C 和 C++ 的开发者遇到的主要问题之一是理解指针使用的语法。`*` 运算符至少有两个含义（除了乘法运算符外），并且对于何时使用 `&` 还是 `*`\
  \ 往往存在困惑。指针的另一个问题很容易指向无效的地方，或者完全没有指向地方，然后尝试引用数据。结果将是垃圾数据，或者程序因操作系统检测到访问非法地址而失败。\n\
  \n引用变量是为了避免所有这些问题。如果你真的想，可以在 C# 中继续使用指针，但必须将代码标记为 `unsafe`。`unsafe` 关键字可以标记代码块或整个方法，如下所示：\n\
  \n```csharp\npublic static void Main(string [] args)\n{\n    int x = 99, y = 100;\n\
  \    unsafe\n    {\n        swap (&x, &y);\n    }\n    Console.WriteLine($\"x 现在是\
  \ {x}, y 现在是 {y}\");\n}\n\npublic static unsafe void swap(int *a, int *b)\n{\n \
  \   int temp;\n    temp = *a;\n    *a = *b;\n    *b = temp;\n}\n```\n\n编译包含不安全代码的程序时，需要在构建项目时指定允许不安全代码选项。执行此操作，右键点击解决方案管理器中的项目，然后点击属性。在属性窗口中，点击生成选项卡，选择“允许不安全代码”，然后在文件菜单上点击“保存所有”。\n\
  \n不安全代码还会影响内存管理。在不安全代码中创建的对象被称为未托管对象。虽然需要以这种方式访问内存的情况并不常见，但你可能会遇到，特别是当你编写需要执行某些底层\
  \ Windows 操作的代码时。\n\n\n\n在本章中，你学习了直接在栈（stack）上存储值的值类型与间接引用堆（heap）上对象的引用类型之间的一些重要区别。你还学习了如何在方法参数中使用\
  \ `ref` 和 `out` 关键字来获取对参数的访问。你看到为 `System.Object` 类的变量赋值一个值（例如 `int` 42）会在堆上创建一个该值的装箱拷贝（boxed\
  \ copy），然后使 `System.Object` 变量引用此装箱拷贝。你还看到从 `System.Object` 类的变量赋值一个值类型变量（如 `int`），会将\
  \ `System.Object` 类中的值拷贝（或解箱，unboxes）到 `int` 所使用的内存中。\n\n![Image](img/Image00001.jpg)\
  \ 如果你想继续阅读下一章，请保持 Visual Studio 2015 运行并转到第 9 章。\n\n![Image](img/Image00001.jpg)\
  \ 如果你现在想退出 Visual Studio 2015，在“文件”菜单上，点击“退出”。如果你看到保存对话框，请点击“是”并保存项目。\n\n### 快速参考\n\
  \n![Image](img/Image000081.jpg)![Image](img/Image00002.jpg)\n\n# 第 9 章 使用枚举和结构体创建值类型\n\
  \n完成本章后，你将能够：\n\n* ![Image](img/Image00001.jpg) 声明枚举类型。\n* ![Image](img/Image00001.jpg)\
  \ 创建并使用枚举类型。\n* ![Image](img/Image00001.jpg) 声明结构体类型。\n* ![Image](img/Image00001.jpg)\
  \ 创建并使用结构体类型。\n* ![Image](img/Image00001.jpg) 解释结构体与类之间的行为差异。\n\n第 8 章，“理解值和引用](text00014.html)”涵盖了\
  \ Microsoft C# 中的两种基本类型：`值类型`和`引用类型`。记住，值类型变量直接在栈上持有其值，而引用类型变量持有指向堆上对象的引用。第 7 章，“创建和管理类与对象](text0013.html)”\
  \ 演示了如何通过定义类来创建自己的引用类型。在本章中，你将学习如何创建自己的值类型。\n\nC# 支持两种值类型：`枚举`和`结构体`。我们将逐一查看。\n\n\
  ### 使用枚举\n\n假设你想用程序表示季节。你可以使用 0、1、2 和 3 分别表示春天、夏天、秋季和冬天。这种系统可行，但并不直观。如果你在代码中使用整数\
  \ 0，很难看出它代表春天。这不是一个健壮的解决方案。例如，如果你声明一个名为 `season` 的 `int` 变量，没有任何阻止你赋值 0、1、2 之外的任何整数。C#\
  \ 提供了更好的解决方案。你可以创建一个枚举（有时称为 `enum` 类型），其值受限于一组符号。\n\n### 声明枚举\n\n你通过 `enum` 关键字定义枚举，后跟该类型可以拥有的合法值集合，并将它们括在大括号之间。以下是声明名为\
  \ `Season` 枚举的方法，其字面量值限制为符号 `Spring`、`Summer`、`Fall` 和 `Winter`：\n\n点击此处查看代码\n\n\
  ```cs\nenum Season { Spring, Summer, Fall, Winter }\n```\n\n### 使用枚举\n\n声明枚举后，你可以像使用其他类型一样使用它。如果你的枚举是\
  \ `Season`，你可以像示例所示创建 `Season` 类型变量、`Season` 类型字段和 `Season` 类型参数：\n\n点击此处查看代码\n\n\
  ```csharp\nenum Season { Spring, Summer, Fall, Winter }\n\nclass Example\n{\n  \
  \  public void Method(Season parameter) // 方法参数示例\n    {\n        Season localVariable;\
  \ // 局部变量示例\n        ...\n    }\n\n    private Season currentSeason; // 字段示例\n}\n\
  ```\n\n在读取枚举变量的值之前，必须对其赋值。如下所示，你只能为枚举变量赋值枚举定义的值：\n\n点击此处查看代码\n\n```csharp\nSeason\
  \ colorful = Season.Fall;\nConsole.WriteLine(colorful); // 输出 'Fall'\n```\n\n***\n\
  \n![Image](img/Image00005.jpg) **注意**\n\n就像对待所有值类型一样，你可以使用 `?` 修符创建一个枚举变量的可空版本。然后你可以将\
  \ `null` 值以及枚举定义的值赋给变量：\n\n```csharp\nSeason? colorful = null;\n```\n\n***\n\n注意你必须写\
  \ `Season.Fall` 而不仅仅是 `Fall`。\n\n注意你必须写 `Season.Fall` 而不仅仅是 `Fall`。\n\n此外，注意当你使用所有枚举包含的内置\
  \ `ToString()` 方法显示枚举变量时，它会输出字面量的名称。如果需要，你可以如下所示将枚举变量转换为字符串：\n\n```csharp\nstring\
  \ name = colorful.ToString();\nConsole.WriteLine(name);\n```\n\n你在整数变量上使用的许多标准运算符也可以用于枚举变量（位位运算符和移位运算符除外，这些在第\
  \ 16 章，“索引器](text00023.html_ch16)”中有所介绍）。例如，你可以使用相等运算符 `==` 比较两个相同类型的枚举变量是否相等，你甚至可以对枚举变量进行算术运算——尽管结果并不总是有意义！\n\
  \n### 选择枚举值\n\n在内部，枚举类型将枚举的每个元素关联到一个整数值。默认情况下，编号从第一个元素的 0 开始，并以 1 为步长增加。可以检索枚举变量的底层整数值。要做到这一点，你必须将其强制转换为其底层类型。第\
  \ 8 章 关于解箱的讨论说明，只要转换有效，转换会将数据从一种类型转换为另一种。以下代码示例输出的是值 2 而不是单词 Fall（记住，在 `Season`\
  \ 枚举中，`Spring` 是 0，`Summer` 是 1，`Fall` 是 2，`Winter` 是 3）：\n\n点击此处查看代码\n\n```csharp\n\
  enum Season { Spring, Summer, Fall, Winter }\n\n...\n\nSeason colorful = Season.Fall;\n\
  Console.WriteLine((int)colorful); // 输出 '2'\n```\n\n如果你喜欢，可以将特定的整数常量（例如 1）与枚举字面量（例如\
  \ `Spring`）关联，如下所示：\n\n点击此处查看代码\n\n```cs\nenum Season { Spring = 1, Summer, Fall,\
  \ Winter }\n```\n\n***\n\n![Image](img/Image00004.jpg) **重要**\n\n初始化枚举字面量的整数值必须是编译时常量值（例如\
  \ 1）。\n\n***\n\n如果你没有显式为枚举字面量分配常量整数值，编译器 own 一个比上一个枚举字面量大 1 的值，但第一个枚举字面量编译器会给它默认值\
  \ 0。在前面的示例中，`Spring`、`Summer`、`Fall` 和 `Winter` 的底层值现在是 1、2、3 和 4。\n\n\n\n\n点击此处查看代码图片\n\
  \n```cs\nenum Season { Spring, Summer, Fall, Autumn = Fall, Winter }\n```\n\n###\
  \ 选择枚举的底层类型\n\n当你声明一个枚举时，枚举字面量会被赋予类型为 `int` 的值。你也可以选择基于不同的底层整数类型来创建枚举。例如，若要声明 `Season`\
  \ 的底层类型为 `short` 而不是 `int`，可以这样写：\n\n点击此处查看代码图片\n\n```cs\nenum Season : short {\
  \ Spring, Summer, Fall, Winter }\n```\n\n使用 `short` 的主要原因是节省内存；`int` 占据的内存比 `short`\
  \ 多，如果你不需要 `int` 提供的整个数值范围，那么使用较小的数据类型是有意义的。\n\n你可以基于八种整数类型之一来创建枚举：`byte`、`sbyte`、`short`、`ushort`、`int`、`uint`、`long`\
  \ 或 `ulong`。所有枚举字面量的值必须在所选基础类型的范围之内。例如，如果你基于 `byte` 数据类型创建枚举，你最多可以拥有 256 个字面量（从\
  \ 0 开始）。\n\n现在你已经知道如何声明枚举，下一步是使用它。在接下来的练习中，你将通过控制台应用程序声明并使用代表月份的枚举。\n\n### 创建并使用枚举\n\
  \n1. 如果 Microsoft Visual Studio 2015 没有运行，请启动它。\n\n2. 打开 `StructsAndEnums` 项目，它位于你“文档”文件夹中的\
  \ `\\Microsoft Press\\VCSBS\\Chapter 9\\StructsAndEnums` 文件夹。\n\n3. 在代码和文本编辑器窗口中显示\
  \ `Month.cs` 文件。\n\n该源文件除了名为 `StructsAndEnums` 的命名空间声明以及一个 `// TODO:` 注释外，内容是空的。\n\
  \n4. 将 `// TODO:` 注释替换为 `StructsAndEnums` 命名空间中名为 `Month` 的枚举，如下所示代码中的**粗体**所示。此枚举模拟了一年的中的月份。`Month`\
  \ 的 12 个枚举字面量从 `January` 到 `December`。\n\n点击此处查看代码图片\n\n```cs\nnamespace StructsAndEnums\n\
  {\n    enum Month\n    {\n        January, February, March, April,\n        May,\
  \ June, July, August,\n        September, October, November, December\n    }\n}\n\
  ```\n\n5. 在代码和文本编辑器窗口中显示 `Program.cs` 文件。\n\n与之前章节中的练习一样，`Main` 方法调用 `doWork` 方法并捕获发生的任何异常。\n\
  \n6. 在代码和文本编辑器窗口中，在 `doWork` 方法中添加语句，声明一个类型为 `Month` 名为 `first` 的变量并将其初始化为 `Month.January`。添加另一个语句将变量\
  \ `first` 的值写入控制台。\n\n`doWork` 方法看起来如下：\n\n点击此处查看代码图片\n\n```cs\nstatic void doWork()\n\
  {\n    Month first = Month.January;\n    Console.WriteLine(first);\n}\n```\n\n![Image](img/Image00005.jpg)\
  \ **注意**\n\n当你输入 `Month` 后输入点时，Microsoft IntelliSense 会自动显示 `Month` 枚举中的所有值。\n\n\
  7. 在“调试”（Debug）菜单上，点击“无调试启动”（Start Without Debugging）。\n\nVisual Studio 2015 编译并运行程序。确认\
  \ `January` 一词已写入控制台。\n\n8. 按回车键关闭程序并返回 Visual Studio 2015 编程环境。\n\n9. 在 `doWork`\
  \ 方法中添加两个语句来递增 `first` 变量并将其新值显示在控制台上，如下方的**粗体**所示：\n\n点击此处查看代码图片\n\n```cs\nstatic\
  \ void doWork()\n{\n    Month first = Month.January;\n    Console.WriteLine(first);\n\
  \    first++;\n    Console.WriteLine(first);\n}\n```\n\n10. 在“调试”菜单上，点击“无调试启动”。\n\
  \nVisual Studio 2015 编译并运行程序。确认 `January` 和 `February` 词已写入控制台。\n\n注意，在枚举变量上执行数学运算（如递增操作）会改变变量的内部整数值。当变量写入控制台时，会显示相应的枚举值。\n\
  \n11. 按回车键关闭程序并返回 Visual Studio 2015 编程环境。\n\n12. 修改 `doWork` 方法中的第一个语句，将 `first`\
