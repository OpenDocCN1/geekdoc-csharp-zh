  \n`John Sharp` 是英国软件开发和咨询公司 CM Group Ltd 的首席技术专家。他作为软件顾问、开发人员、作者和培训师，拥有近 30 年的经验，涵盖了从\
  \ CP/M 上的 Pascal 编程、各种版本的 UNIX 上的 C/Oracle 应用开发，到 C# 和 JavaScript 分布式应用程序的设计以及在\
  \ Windows 10 和 Microsoft Azure 上的开发。他是使用 Microsoft .NET Framework 构建应用程序的专家，也是 *Windows\
  \ Communication Foundation 4 Step By Step*（Microsoft Press）的作者。\n\n![Image](img/Image00245.jpg)![Image](img/Image00246.jpg)![Image](img/Image00247.jpg)![Image](img/Image00248.jpg)\n\
