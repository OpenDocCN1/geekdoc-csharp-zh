  \n### 实现相等性运算符\n\n**1.** 在 Visual Studio 2015 中，在代码和文本编辑器中显示 `Complex.cs` 文件。\n\n\
  **2.** 如下方示例加粗所示，将 `==` 和 `!=` 运算符添加到 `Complex` 类：\n\n```csharp\nclass Complex\n\
