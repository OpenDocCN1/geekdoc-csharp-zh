  \n### 3. 在表单上，点击用户输入数字的两个 `TextBox` 控件。在文档大纲窗口中，核实它们的名称是否为 `lhsOperand` 和 `rhsOperand`。\n\
  \n当表单运行时，这些控件的 `Text` 属性持有用户输入的值。\n\n### 4. 在表单底部，核实用于显示正在评估的表达式的 `TextBlock` 控件名称是否为\
  \ `expression`，用于显示计算结果的 `TextBlock` 控件名称是否为 `result`。\n\n### 5. 关闭文档大纲窗口。\n\n###\
  \ 6. 在“视图”（View）菜单上，点击“代码”（Code），在代码和文本编辑器中显示 `MainPage.xaml.cs` 代码。\n\n### 7. 在代码和文本编辑器中，找到\
  \ `addValues` 方法。它看起来如下：\n\n点击此处查看代码图像\n\n```csharp\nprivate void addValues()\n\
  {\n    int lhs = int.Parse(lhsOperand.Text);\n    int rhs = int.Parse(rhsOperand.Text);\n\
  \    int outcome = 0;\n    // TODO: Add rhs to lhs and store the result in outcome\n\
  \    expression.Text = $\"{lhsOperand.Text} + {rhsOperand.Text}\";\n    result.Text\
  \ = outcome.ToString();\n}\n```\n\n该方法中的第一个语句声明了一个名为 `lhs` 的 `int` 变量，并用用户在 `lhsOperand`\
  \ 框中输入的值对应的整数对其初始化。记住 `TextBox` 控件的 `Text` 属性包含字符串，但 `lhs` 是 `int`，因此在将其赋值给 `lhs`\
  \ 之前，你必须将此字符串转换为整数。`int` 数据类型提供了 `int.Parse` 方法，正是这样做。\n\n第二个语句声明了一个名为 `rhs` 的 `int`\
  \ 变量，并在将其转换为 `int` 后将其初始化为 `rhsOperand` 框中的值。\n\n第三个语句声明了一个名为 `outcome` 的 `int`\
  \ 变量。\n\n随后是一条注释，说明你需要将 `rhs` 加到 `lhs` 上并将结果存储在 `outcome` 中。这是你需要实现的代码缺失部分，你将在下一步中完成它。\n\
  \n第五个语句使用字符串插值来构造一个指示正在执行计算的字符串，并将结果赋值给 `expression.Text` 属性。这会导致字符串出现在表单的表达式框中。\n\
  \n最后一条语句通过将计算结果赋值给结果框的 `Text` 属性来显示结果。记住 `Text` 属性是字符串，而计算结果是 `int`，因此在将其赋值给 `Text`\
  \ 属性之前，你必须将 `int` 转换为字符串。回想起 `int` 类型的 `ToString` 方法正是起作用。\n\n### 8. 在 `addValues`\
  \ 方法中间注释下方，添加以下语句（下文加粗所示）：\n\n点击此处查看代码图像\n\n```csharp\nprivate void addValues()\n\
  {\n    int lhs = int.Parse(lhsOperand.Text);\n    int rhs = int.Parse(rhsOperand.Text);\n\
  \    int outcome = 0;\n    // TODO: Add rhs to lhs and store the result in outcome\n\
  \    expression.Text = $\"{lhsOperand.Text} + {rhsOperand.Text}\";\n    result.Text\
  \ = outcome.ToString();\n}\n```\n\n该语句计算 `lhs` + `rhs` 并结果存储在 `outcome` 中。\n\n###\
  \ 9. 查看 `subtractValues` 方法。你应该看到它遵循类似的模式。在这里你需要添加语句来计算 `lhs` 减去 `rhs` 的结果并存储在 `outcome`\
  \ 中。添加以下语句（加粗所示）：\n\n点击此处查看代码图像\n\n```csharp\nprivate void subtractValues()\n{\n\
  \    int lhs = int.Parse(lhsOperand.Text);\n    int rhs = int.Parse(rhsOperand.Text);\n\
  \    int outcome = 0;\n    // TODO: Add rhs to lhs and store the result in outcome\n\
  \    expression.Text = $\"{lhsOperand.Text} - {rhsOperand.Text}\";\n    result.Text\
  \ = outcome.ToString();\n}\n```\n\n### 10. 查看 `multiplyValues`、`divideValues` 和\
  \ `remainderValues` 方法。同样，它们都缺少执行指定计算的语句。在这些方法中添加相应的语句（加粗所示）。\n\n点击此处查看代码图像\n\n\
  ```csharp\nprivate void multiplyValues()\n{\n    int lhs = int.Parse(lhsOperand.Text);\n\
  \    int rhs = int.Parse(rhsOperand.Text);\n    int outcome = 0;\n    // TODO: Add\
  \ rhs to lhs and store the result in outcome\n    expression.Text = $\"{lhsOperand.Text}\
  \ * {rhsOperand.Text}\";\n    result.Text = outcome.ToString();\n}\n\nprivate void\
  \ divideValues()\n{\n    int lhs = int.Parse(lhsOperand.Text);\n    int rhs = int.Parse(rhsOperand.Text);\n\
  \    int outcome = 0;\n    // TODO: Add rhs to lhs and store the result in outcome\n\
  \    expression.Text = $\"{lhsOperand.Text} / {rhsOperand.Text}\";\n    result.Text\
  \ = outcome.ToString();\n}\n\nprivate void remainderValues()\n{\n    int lhs = int.Parse(lhsOperand.Text);\n\
  \    int rhs = int.Parse(rhsOperand.Text);\n    int outcome = 0;\n    // TODO: Add\
  \ rhs to lhs and store the result in outcome\n    expression.Text = $\"{lhsOperand.Text}\
  \ % {rhsOperand.Text}\";\n    result.Text = outcome.ToString();\n}\n```\n\n\n\n\n\
  5. 点击 `/ Division`（除法）选项，然后点击 Calculate（计算）。验证结果现在变为 4。\n\n在现实生活中，54/13 等于 4.153846\
  \ 循环小数，但并不是现实生活——这是 C# 在执行整数除法。正如之前解释的，当你用一个整数除以另一个整数时，得到的答案是一个整数。\n\n6. 点击 `% Remainder`（取余）选项，然后点击\
  \ Calculate（计算）。验证结果现在变为 2。\n\n在处理整数时，54 除以 13 的余数是 2；(54 – ((54/13) * 13)) 等于 2。这是因为计算在每个阶段都会向下取整为整数。（如果告诉我高中的数学老师\
  \ (54/13) * 13 不等于 54，他会得惊掉的！）\n\n7. 返回 Visual Studio 并停止调试。\n\n### 控制优先级\n\n`Precedence`（优先级）决定了表达式中运算符的求值顺序。考虑以下表达式，它使用了\
  \ `+` 和 `*` 运算符：\n\n```\n2 + 3 * 4\n```\n\n这个表达式具有潜在的歧义：你是先执行加法还是乘法？操作顺序很重要，因为它会改变结果：\n\
  \n![Image](img/Image00001.jpg) 如果你先执行加法，再执行乘法，加法的结果 (2 + 3) 形成 `*` 运算符的左操作数，整个表达式的结果是\
  \ 5 * 4，即 20。\n\n![Image](img/Image00001.jpg) 如果你先执行乘法，再执行加法，乘法的结果 (3 * 4) 形成 `+`\
  \ 运算符的右操作数，整个表达式的结果是 2 + 12，即 14。\n\n在 C# 中，乘法运算符（`*`、`/` 和 `%`）的优先级高于加法运算符（`+`\
  \ 和 `–`），因此在 `2 + 3 * 4` 等表达式中，先执行乘法，后执行加法。因此，`2 + 3 * 4` 的答案是 14。\n\n你可以使用括号来覆盖优先级，强制操作数以不同的方式绑定到运算符。例如，在以下表达式中，括号强制\
  \ 2 和 3 绑定到 `+` 运算符（得到 5），该加法的结果形成 `*` 运算符的左操作数，从而产生值 20：\n\n```\n(2 + 3) * 4\n\
  ```\n\n![Image](img/Image00005.jpg) 注意\n\n术语 `parentheses` 或 `round brackets`（圆括号）指的是\
  \ `()`。术语 `braces` 或 `curly brackets`（大括号）指的是 `{ }`。术语 `square brackets`（方括号）指的是\
  \ `[ ]`。\n\n### 使用结合性求值表达式\n\n运算符优先级只是问题的一半。当表达式包含具有相同优先级的不同运算符会发生什么？这就是 `associativity`（结合性）变得重要的地方。`Associativity`\
  \ 是运算符的操作数求值的方向（从左或从右）。考虑以下使用 `/` 和 `*` 运算符的表达式：\n\n```\n4 / 2 * 6\n```\n\n乍眼看，这个表达式具有潜在的歧义。你是先执行除法还是乘法？这两个运算符的优先级相同（它们都是乘法运算符），但表达式中运算符应用的顺序很重要，因为你可以得到两个不同的结果：\n\
  \n![Image](img/Image00001.jpg) 如果你先执行除法，除法的结果 (4/2) 形成 `*` 运算符的左操作数，整个表达式的结果是 (4/2)\
  \ * 6，即 12。\n\n![Image](img/Image00001.jpg) 如果你先执行乘法，乘法的结果 (2 * 6) 形成 `/` 运算符的右操作数，整个表达式的结果是\
  \ 4/(2 * 6)，即 4/12。\n\n在这种情况下，运算符的结合性决定了表达式的求值方式。`*` 和 `/` 运算符都是左结合的，这意味着操作数从左到右求值。在这种情况下，`4/2`\
  \ 将在乘以 6 之前被求值，得到结果 12。\n\n### 结合性与赋值运算符\n\n在 C# 中，等号（`=`）是一个运算符。所有运算符都根据其操作数返回一个值。赋值运算符\
  \ `*=` 也不例外。它接受两个操作数：右侧的操作数求值，然后存储在左侧的操作数中。赋值运算符的值是分配给左操作数的值。例如，在下面的赋值语句中，赋值运算符返回的值是\
  \ 10，它也是分配给变量 `myInt` 的值：\n\n```\nint myInt;\nmyInt = 10; // 赋值表达式的值为 10\n```\n\n\
  此时，你可能在想这些都很奇妙且深奥，但又怎样呢？因为赋值运算符返回一个值，你可以在另一个赋值语句中使用这个相同的值，如下所示：\n\n```\nint myInt;\n\
  int myInt2;\nmyInt2 = myInt = 10;\n```\n\n分配给变量 `myInt2` 的值是分配给 `myInt` 的值。赋值语句为两个变量分配了相同的值。如果你想将多个变量初始化为相同的值，这种技术非常有用。它让任何阅读你代码的人都能清楚地知道所有变量必须具有相同的值。\n\
  \n![Image](img/Image00005.jpg) 注意\n```\nmyInt2 = myInt = 10;\n```\n分配给变量 `myInt2`\
  \ 的值是分配给 `myInt` 的值。赋值语句为两个变量分配了相同的值。\n\n![Image](img/Image00005.jpg) 注意\n```\n\
  int myInt, myInt2, myInt3 = 10;\n```\n这是合法的 C# 代码（可以编译）。它的作用是声明变量 `myInt`、`myInt2`\
  \ 和 `myInt3`，并将 `myInt3` 初始化为 10。然而，它没有初始化 `myInt` 或 `myInt2`。如果你在表达式中使用 `myInt`\
  \ 或 `myInt2`，例如\n\n```\nmyInt3 = myInt / myInt2;\n```\n编译器将生成以下错误：\n\n![Image](img/Image00005.jpg)\
  \ 注意\n未赋值的局部变量 'myInt'\n未赋值的局部变量 'myInt2'\n\n### 变量递减\n\n如果你想给变量加 1，可以使用 `+` 运算符，如下所示：\n\
  \n```\ncount = count + 1;\n```\n\n然而，给变量加 1 是非常常见的，因此 C# 为此目的提供了专门的运算符：`++` 运算符。要让变量\
  \ `count` 加 1，你可以编写以下语句：\n\n```\ncount++;\n```\n\n同样，C# 提供了 `--` 运算符，你可以用它从变量减 1，如下：\n\
  \n```\ncount--;\n```\n\n`++` 和 `--` 运算符是`unary`（元运算符），意味着它们只需要一个操作数。它们具有相同的优先级且都是左结合的。\n\
  \n### 前缀与后缀\n\n递增（++）和递减（--）运算符的特殊之处在于你可以放在变量之前或之后。将运算符符号放在变量之前称为该运算符的`前缀形式`，而将运算符符号放在变量之后则称为`后缀形式`。例如下：\n\
  \n```\ncount++; // 后缀递增\n++count; // 前缀递增\ncount--; // 后缀递减\n--count; // 前缀递减\n\
  ```\n\n\n\n\n\n无论你使用 `++` 或 `--` 运算符的前缀形式还是后缀形式，对于被增加或减少的变量来说没有区别。例如，如果你编写 `count++`，`count`\
  \ 的值会增加 1；如果你编写 `++count`，`count` 的值也会增加 1。知道这一点后，你可能在奇怪为什么有两种方式来编写相同的内容。要理解这个答案，你必须记住\
  \ `++` 和 `--` 是运算符，而且所有运算符都用于评估一个具有值的表达式。`count++` 返回的值是 `count` 在增加发生之前的值，而 `++count`\
  \ 返回的值是 `count` 在增加发生后的值。这是一个示例：\n\n点击此处查看代码图片\n\n```int\nint x;\n\nx = 42;\n\n\
  Console.WriteLine(x++); // x 现在是 43, 输出了 42\n\nx = 42;\n\nConsole.WriteLine(++x);\
  \ // x 现在是 43, 输出了 43\n```\n\n记住哪个操作数执行什么操作的方法，是查看前缀或后缀表达式中元素（操作数和运算符）的顺序。在表达式 `x++`\
  \ 中，变量 `x` 先出现，因此它的值在 `x` 增加之前用作表达式的值。在表达式 `++x` 中，运算符先出现，因此它的操作在 `x` 的值被评估为结果之前被执行。\n\
  \n这些运算符最常用于 `while` 和 `do` 语句，这些语句在第 5 章 中的“使用复合赋值和迭代语句”中介绍。如果你只是单独地使用增加和减少运算符，请坚持使用后缀形式并保持一致。\n\
  \n### 声明隐式类型局部变量\n\n在本章较早之前，你看到了通过指定数据类型和标识符来声明变量，如下：\n\n```int\nint myInt;\n```\n\
  \n文中还提到，你应该在尝试使用变量之前为它赋值。你可以在同一语句中声明并初始化变量，如下例所示：\n\n```int\nint myInt = 99;\n```\n\
  \n或者，你甚至可以这样做，假设 `myOtherInt` 是一个已初始化的整数变量：\n\n```int\nint myInt = myOtherInt *\
  \ 99;\n```\n\n现在，记住你赋给变量的值必须与变量的类型相同。例如，你只能将 `int` 值赋给 `int` 变量。C# 编译器可以快速计算出用于初始化变量的表达式的类型，并指示该类型是否与变量的类型匹配。你也可以要求\
  \ C# 编译器从表达式推断变量的类型，并在声明变量时使用 `var` 关键字代替类型来使用该类型，如下：\n\n点击此处查看代码图片\n\n```csharp\n\
  var myVariable = 99;\n\nvar myOtherVariable = \"Hello\";\n```\n\n变量 `myVariable`\
  \ 和 `myOtherVariable`被称为*隐式类型*变量。`var` 关键字导致编译器从初始化它们的表达式类型中推导出变量的类型。在这些示例中，`myVariable`\
  \ 是 `int`，而 `myOtherVariable` 是 `string`。但重要的是，你必须理解这仅是声明变量的一种方便方法，在变量声明之后，你只能为其赋值推断出的类型——例如，在程序的后期你不能为\
  \ `myVariable` 赋值 `float`、`double` 或 `string` 值。你还应该理解，只有当你提供一个表达式来初始化变量时，才能使用 `var`\
  \ 关键字。以下声明是非合法的并会导致编译错误：\n\n点击此处查看代码图片\n\n```csharp\nvar yetAnotherVariable; //\
  \ 错误 - 编译器无法推断类型\n```\n\n***\n\n![图像](img/Image00004.jpg) 重要\n\n如果你过去用过 Visual Basic\
  \ 编程，你可能熟悉 `Variant` 类型，你可以用它在变量中存储任何类型的值。我在这里现在强调，你应该忘记过去在用 Visual Basic 编程时学到的关于\
  \ `Variant` 变量的一切。虽然关键字看起来相似，但 `var` 和 `Variant` 的含义完全不同。当你使用 `var` 关键字在 C# 中声明变量时，你赋给变量的类型*不能改变*为初始化变量时所使用的类型。\n\
  \n***\n\n如果你是一个纯主义者，此时你可能在咬牙，并思考为什么像 C# 这样整洁语言的设计者竟然允许 `var` 这样的功能渗透进来。毕竟，这听起来像是程序员极度懒惰的借口，并让理解程序正在做什么或追踪\
  \ bug 变得困难（甚至可以很容易在你的代码中引入新的 bug）。但是，请相信，`var` 在 C# 中有非常合理的位置，当你阅读接下来的许多章节时就会看到。然而，在目前，除非隐式类型成为必要，否则我们仍坚持使用显式类型变量。\n\
  \n### 总结\n\n在本章中，你学习了如何创建和使用变量，并学习了 C# 中常用的数据类型。你还学习了标识符。此外，你学习了如何使用运算符构建表达式，并学习了运算符的优先级和结合性。\n\
  \n![图像](img/Image00001.jpg) 如果你想继续下一章，请保持 Visual Studio 2015 运行并转到第 3 章。\n\n如果你现在想退出\
  \ Visual Studio 2015，点击文件菜单，点击退出。\n\n### 快速参考\n\n![图像](img/Image00040.jpg)\n\n#\
  \ 第 3 章 编写方法和作用域\n\n完成本章后，你将能够：\n\n- ![Image](img/Image00001.jpg) 声明和调用方法。\n- ![Image](img/Image00001.jpg)\
  \ 向方法传递信息。\n- ![Image](img/Image00001.jpg) 从方法返回信息。\n- ![Image](img/Image00001.jpg)\
  \ 定义局部和类作用域。\n- ![Image](img/Image00001.jpg) 使用调试器进入和退出方法。\n\n在第 2 章中的“变量、运算符和表达式，”你学习了如何声明变量、如何使用运算符创建表达式，以及优先级和结合性如何控制表达式的评估方式。在本章中，我们将学习方法。你将看到如何声明和调用方法、如何使用参数和参数向方法传递信息，以及如何通过返回语句从方法返回信息。你还将看到如何使用\
  \ Visual Studio 2015 集成调试器进入和退出方法。当你需要追踪方法执行不符合预期的轨迹时，这些信息非常有用。最后，你将学习声明带有可选参数的方法以及如何使用命名参数调用方法。\n\
  \n## 创建方法\n\n*方法*是命名的语句序列。如果你以前使用过 C、C++ 或 Microsoft Visual Basic 等语言编程，你会发现方法类似于函数或子程序。方法有一个名称和一个主体。方法名称应该是指示方法整体用途的有意义标识符（例如\
  \ `calculateIncomeTax`）。方法主体包含在调用方法时运行的实际语句。此外，方法可以接收一些数据进行处理并返回信息，通常是处理的结果。方法是一种基础且强大的机制。\n\
  \n### 声明方法\n\nC# 方法的声明语法如下：\n\n点击此处查看代码图片\n\n\n\n\n\n```\nreturnType methodName\
  \ ( parameterList )\n{\n    // method body statements go here\n}\n```\n\n以下是构成声明的元素描述：\n\
  \n![Image](img/Image00001.jpg) `returnType` 是类型的名称，它指定了方法在处理后返回的信息类型。它可以是任何类型，例如\
  \ `int` 或 `string`。如果你正在编写一个不返回值的方法，则必须使用 `void` 关键字来代替返回类型。\n\n![Image](img/Image00001.jpg)\
  \ `methodName` 是调用方法时使用的名称。方法名遵循与变量名相同的标识符规则。例如，`addValues` 是一个有效的方法名，而 `add$Values`\
  \ 则不是。目前，你应该遵循驼峰命名命名法（camelCase）来编写方法名；例如，`displayCustomer`。\n\n![Image](img/Image00001.jpg)\
  \ `parameterList` 是可选的，它描述了你可以传递给方法进行处理的信息的类型和名称。你在左括号和右括号 `()` 之间编写参数，就像声明变量一样，类型名称后紧跟参数名称。如果你编写的方法有两个或更多参数，必须用逗号分隔它们。\n\
  \n![Image](img/Image00001.jpg) 方法体语句是调用方法时运行的代码行。它们被包含在左括号和右括号 `{ }` 之间。\n\n***\n\
  \n![Image](img/Image00004.jpg) 重要\n\n如果你使用 C、C++ 和 Visual Basic 编程，你应该注意 C# 不支持全局方法。你必须在类内部编写所有方法；否则，你的代码将无法编译。\n\
  \n***\n\n这是一个名为 `addValues` 的方法的定义，它返回 `int` 结果并有两个 `int` 参数 `leftHandSide` 和 `rightHandSide`：\n\
  \n点击此处查看代码图像\n\n```csharp\nint addValues(int leftHandSide, int rightHandSide)\n\
  {\n    // ...\n    // 方法体语句在这里\n    // ...\n}\n```\n\n***\n\n![Image](img/Image00005.jpg)\
  \ 注意\n\n必须显式指定任何参数的类型以及方法的返回类型。不能使用 `var` 关键字。\n\n***\n\n名为 `showResult` 的方法定义，它不返回任何值并有一个\
  \ `int` 参数 `answer`：\n\n```csharp\nvoid showResult(int answer)\n{\n    // ...\n\
  }\n```\n\n注意使用 `void` 关键字表示该方法不返回任何内容。\n\n***\n\n![Image](img/Image00004.jpg) 重要\n\
  \n如果你熟悉 Visual Basic，请注意 C# 没有使用不同的关键字来区分返回值的方法（函数）和不返回值的方法（过程或子程序）。你必须指定返回类型或 `void`。\n\
  \n***\n\n### 从方法返回数据\n\n如果你希望方法返回信息（即其返回类型不是 `void`），则必须在方法体的结尾包含一个 `return` 语句。`return`\
  \ 语句由 `return` 关键字、指定返回值的表达式以及分号组成。表达式的类型必须与指定的类型相同。例如，如果方法返回 `int`，则 `return` 语句必须返回\
  \ `int`；否则你的程序将无法编译。这是一个带有 `return` 语句的方法示例：\n\n点击此处查看代码图像\n\n```csharp\nint addValues(int\
  \ leftHandSide, int rightHandSide)\n{\n    // ...\n    return leftHandSide + rightHandSide;\n\
  }\n```\n\n`return` 语句通常位于方法的末尾，因为它会导致方法结束并将控制权返回到调用方法的语句（本章稍后描述）。`return` 语句之后的任何语句都不会执行（如果你在\
  \ `return` 语句后放置语句，编译器会对此警告）。\n\n如果你不希望方法返回信息（即其返回类型为 `void`），可以使用 `return` 语句的变体来立即退出方法。你编写\
  \ `return` 关键字并紧跟一个分号。例如：\n\n点击此处查看代码图像\n\n```csharp\nvoid showResult(int answer)\n\
  {\n    // 显示答案\n    Console.WriteLine($\"The answer is {answer}\");\n    return;\n\
  }\n```\n\n如果你的方法不返回任何内容，也可以省略 `return` 语句，因为方法到达方法结尾的右括号时会自动结束。这种做法很常见，但并不总是被认为是良好的风格。\n\
  \n### 使用表达式体方法\n\n某些方法可以非常简单，执行单个任务或在不涉及任何额外逻辑的情况下返回计算结果。C# 支持由单个表达式组成的方法的简化形式。这些方法仍然可以接收参数并返回值，其工作方式与你目前看到的方法相同。以下代码示例显示了以表达式体方法编写的\
  \ `addValues` 和 `showResult` 方法：\n\n点击此处查看代码图像\n\n```csharp\nint addValues(int leftHandSide,\
  \ int rightHandSide) => leftHandSide + rightHandSide;\n\nvoid showResult(int answer)\
  \ => Console.WriteLine($\"The answer is {answer}\");\n```\n\n主要区别在于使用 `=>` 运算符引用形成方法体的表达式，以及缺少\
  \ `return` 语句。表达式的值被用返回值；如果表达式没有返回值，则方法为 void。\n\n使用普通方法和表达式体方法在功能上实际上没有区别——表达式体方法仅仅是一种语法上的便利。然而，你将在书后看到示例，其中表达式体方法可以通过移除大量的\
  \ `{` 和 `}` 字符来简化程序，使代码更易读。\n\n检查方法定义\n\n1. 如果 Visual Studio 2015 尚未运行，请启动它。\n2.\
  \ 打开 `Methods` 项目，它位于文档文件夹中的 `\\Microsoft Press\\VCSBS\\Chapter 3\\Methods` 文件夹中。\n\
  3. 在 `Debug` 菜单上，点击“启动调试”。\n4. Visual Studio 2015 编译并运行应用程序。它看起来应该与第 2 章中的应用程序相同。重新熟悉该应用程序及其工作原理，然后返回\
  \ Visual Studio。在 `Debug` 菜单上，点击“停止调试”。\n5. 在代码和编辑器窗口中显示 `MainPage.xaml.cs` 的代码（在解决方案管理器中，展开\
  \ `MainPage.xaml` 文件，然后双击 `MainPage.xaml.cs`）。\n6. 在代码和编辑器窗口中，找到 `addValues` 方法，它看起来如下：\n\
  \n点击此处查看代码图像\n\n```csharp\nprivate int addValues(int leftHandSide, int rightHandSide)\n\
  {\n    expression.Text = $\"{leftHandSide} + {rightHandSide}\";\n    return leftHandSide\
  \ + rightHandSide;\n}\n```\n\n***\n\n![Image](img/Image00005.jpg) 注意\n\n目前，不要担心方法定义开头的\
  \ `private` 关键字；你将在第 7 章“创建和管理类和对象”中学习这个关键字的含义。\n\n***\n\n`addValues` 方法包含两个语句。第一条语句在表单上的\
  \ `expression` 框中显示正在进行的计算。\n\n\n\n\n第二个语句使用 `int` 版本的 `+` 运算符来加 `leftHandSide`\
  \ 和 `rightHandSide` 变量的值，然后返回此操作的结果。请记住，两个 `int` 值相加会创建一个另一个 `int` 值，因此 `addValues`\
  \ 方法的返回类型为 `int`。\n\n如果你查看 `subtractValues`、`multiplyValues`、`divideValues` 和 `remainderValues`\
  \ 方法，你会发现它们遵循相似的模式。\n\n### 7. 在代码和文本编辑器窗口中，找到 `showResult` 方法，它如下所示：\n\n点击此处查看代码图片\n\
  \n```\nprivate void showResult(int answer) => result.Text = answer.ToString();\n\
  ```\n\n这是一个表达式方法，用于在 `result` 框中显示参数 `answer` 的字符串表示。它不返回值，因此该方法的类型为 `void`。\n\n\
  * * *\n\n![Image](img/Image00013.jpg) 提示\n\n方法没有最小长度限制。如果一个方法有助于避免重复并让你的程序更容易理解，那么无论该方法多么小，它都是有用的。\n\
  \n方法也没有最大长度限制，但通常你希望保持方法代码足够小以完成任务。如果你的方法长度超过一个屏幕，请考虑将其拆分为更小的方法以提高可读性性。\n\n* * *\n\
  \n### 调用方法\n\n方法的存在是为了被调用的！你通过名称调用方法来请求它执行其任务。如果方法需要信息（如其参数所示），你必须提供所请求的信息。如果方法返回信息（如其返回类型所示），你应该安排以某种方式捕获这些信息。\n\
  \n### 指定方法调用语法\n\nC# 方法调用的语法如下：\n\n点击此处查看代码图片\n\n```\nresult = methodName ( argumentList\
  \ )\n```\n\n以下是构成方法调用的元素描述：\n\n![Image](img/Image00001.jpg) `methodName` 必须与你调用的方法名称完全匹配。请记住，C#\
  \ 是一种区分大小写的语言。\n\n![Image](img/Image00001.jpg) `result =` 子句是可选的。如果指定，由 `result`\
  \ 标识的变量将包含方法返回的值。如果方法是 `void`（即它不返回值），你必须省略语句中的 `result =` 子句。如果你没有指定 `result =`\
  \ 子句且方法确实返回了值，则方法会运行但返回值会被丢弃。\n\n![Image](img/Image00001.jpg) `argumentList` 提供了方法接受的信息。你必须为每个参数提供一个参数，并且每个参数的值必须与其对应参数的类型兼容。如果你调用的方法有两个或更多参数，你必须用逗号分隔这些参数。\n\
  \n* * *\n\n![Image](img/Image00004.jpg) 重要\n\n你必须在每个方法调用中包含括号，即使调用没有参数的方法也是如此。\n\
  \n* * *\n\n为了澄清这些点，请再次查看 `addValues` 方法：\n\n点击此处查看代码图片\n\n```\nint addValues(int\
  \ leftHandSide, int rightHandSide)\n{\n// ...\n}\n```\n\n`addValues` 方法有两个 `int`\
  \ 参数，因此你必须使用两个逗号分隔的 `int` 参数来调用它，如下：\n\n```\naddValues(39, 3); // 可以\n```\n\n你也可以用字面值\
  \ 39 和 3 替换 `int` 变量名。这些变量中的值将作为方法的参数传递给方法，如下所示：\n\n```c\nint arg1 = 99;\nint arg2\
  \ = 1;\naddValues(arg1, arg2);\n```\n\n如果你尝试用其他方式调用 `addValues`，可能会因为以下示例说明的原因而无法成功：\n\
  \n点击此处查看代码图片\n\n```\naddValues; // 编译错误，缺少括号\naddValues(); // 编译错误，参数不足\naddValues(39);\
  \ // 编译错误，参数不足\naddValues(\"39\", \"3\"); // 编译错误，参数类型错误\n```\n\n`addValues` 方法返回一个\
  \ `int` 值。你可以在任何可以使用 `int` 值的地方使用这个 `int` 值。考虑一下这些示例：\n\n点击此处查看代码图片\n\n```c\nint\
  \ result = addValues(39, 3); // 在赋值语句的右侧\nshowResult(addValues(39, 3)); // 作为另一个方法调用的参数\n\
  ```\n\n接下来的练习继续应用方法。这次，你将检查一些方法调用。\n\n### 检查方法调用\n\n**1.** 返回 Methods 项目。（如果你是从上一个练习继续，那么此项目在\
  \ Visual Studio 2015 中已打开。如果不是，请从“文档”文件夹中的 `\\Microsoft Press\\VCSBS\\Chapter 3\\\
  Methods` 文件夹打开它。）\n\n**2.** 在代码编辑器窗口中显示 `MainPage.xaml.cs` 的代码。\n\n**3.** 找到 `calculateClick`\
  \ 方法，查看 `try` 语句后的前两个语句（关于 `try` 语句，将在第 6 章 中介绍）。这些语句如下：\n\n点击此处查看代码图片\n\n```c\n\
  int leftHandSide = System.Int32.Parse(lhsOperand.Text);\nint rightHandSide = System.Int32.Parse(rhsOperand.Text);\n\
  ```\n\n这两个语句声明了两个 `int` 变量，`leftHandSide` 和 `rightHandSide`。注意初始化变量的方式。在两种情况下都调用了\
  \ `System.Int32` 的 `Parse` 方法（`System` 是命名空间，`Int32` 是结构体的名称）。\n\n**4.** 查看 `calculateClick`\
  \ 方法中的第四条语句（`if` 语句和大括号之后）：\n\n点击此处查看代码图片\n\n```c\ncalculatedValue = addValues(leftHandSide,\
  \ rightHandSide);\n```\n\n该语句调用了 `addValues` 方法，将 `leftHandSide` 和 `rightHandSide`\
  \ 变量的值作为参数传递。方法返回的值存储在 `calculatedValue` 变量中。\n\n**5.** 查看下一个语句：\n\n```c\nshowResult(calculatedValue);\n\
  ```\n\n该语句调用了 `showResult` 方法，将 `calculatedValue` 变量的值作为参数传递。`showResult` 方法不返回值。\n\
  \n**6.** 在代码编辑器窗口中，找到你之前看过的 `showResult` 方法。\n\n该方法的唯一语句是：\n\n点击此处查看代码图片\n\n```c\n\
  result.Text = answer.ToString();\n```\n\n注意 `ToString` 方法调用即使没有参数也使用了括号。\n\n* *\
  \ *\n\n![Image](img/Image00013.jpg) 提示\n\n你可以通过在前面加上对象名称来调用其他对象的方法。在前面的示例中，表达式 `answer.ToString()`\
  \ 调用了属于对象 `answer` 的 `ToString` 方法。\n\n* * *\n\n### 应用范围\n\n你创建变量来存储值。你可以在应用程序的各个点创建变量。例如，Methods\
  \ 项目中的 `calculateClick` 方法创建一个名为 `calculatedValue` 的 `int` 变量并为其分配初始值零，如下：\n\n点击此处查看代码图片\n\
  \n```csharp\nprivate void calculateClick(object sender, RoutedEventArgs e)\n{\n\
  \    int calculatedValue = 0;\n    ...\n}\n```\n\n\n\n该变量在定义处产生，随后 `calculateClick`\
  \ 方法中的后续语句就可以使用该变量。这是一个重要的点：变量只有在创建后才能被使用。当方法执行完毕，该变量就会消失，无法在其他地方使用。\n\n当一个变量在程序的特定位置可以被访问时，就说该变量在该位置处于`作用域`（scope）。`calculatedValue`\
  \ 变量具有方法作用域；它可以在整个 `calculateClick` 方法中被访问，但在该方法之外不能。你也可以定义不同作用域的变量；例如，你可以在方法之外但类内部定义一个变量，该变量可以被类中的任何方法访问。这种变量被称为具有`类作用域`（class\
  \ scope）。\n\n换句话说，变量的作用域简单来说就是变量可使用的程序区域。作用域不仅适用于变量，也适用于方法。标识符（变量或方法）的作用域与程序中引入该标识符的声明位置相关，正如你接下来将学到的那样。\n\
  \n### 定义局部作用域\n\n构成方法体的左右大括号定义了方法的作用域。你在方法体内部声明的变量其作用域都是该方法；它们在方法结束时消失，且只能由在该方法中运行的代码访问。这些变量被称为`局部变量`（local\
  \ variables），因为它们对于其定义的方法是局部的；它们在任何其他方法中都不在范围内。\n\n局部变量的作用域意味着你不能使用它们在方法之间共享信息。考虑这个示例：\n\
  \n点击此处查看代码图像\n\n```csharp\nclass Example\n{\nvoid firstMethod()\n{\nint myVar;\n\
  ...\n}\n\nvoid anotherMethod()\n{\nmyVar = 42; // error - 不在作用域内\n...\n}\n}\n```\n\
  \n这段代码无法编译，因为 `anotherMethod` 尝试使用变量 `myVar`，而它不在作用域内。变量 `myVar` 仅对 `firstMethod`\
  \ 中位于声明 `myVar` 代码行之后的语句可用。\n\n### 定义类作用域\n\n构成类体的左右大括号定义了该类的作用域。你在类体内部（但方法之外）声明的任何变量其作用域都是该类。C#\
  \ 中由类定义的变量的正确术语是`字段`（field）。如前提到的，与局部变量不同，你可以使用字段在方法之间共享信息。这里有一个示例：\n\n```csharp\n\
  class Example\n{\nvoid firstMethod()\n{\nmyField = 42; // ok\n...\n}\n\nvoid anotherMethod()\n\
  {\nmyField++; // ok\n...\n}\n\nint myField = 0;\n}\n```\n\n变量 `myField` 定义在类中，但在方法\
  \ `firstMethod` 和 `anotherMethod` 之外。因此，`myField` 具有类作用域，供类中的所有方法使用。\n\n关于这个示例还有另一点需要注意。在方法中，你必须在使用变量之前对其进行声明。字段则有些不同。方法可以在定义字段的语句之前使用该字段——编译器会为你处理这些细节。\n\
  \n### 重载方法\n\n如果两个标识符具有相同的名称并且在同一个作用域内声明，它们被视为`重载`（overloaded）。通常，重载标识符是一个会被编译时错误捕获的\
  \ Bug。例如，如果你在同一个方法中声明了两个同名的局部变量，编译器会报告错误。同样，如果你在同一个类中声明了两个同名的字段，或者在同一个类中声明了两个完全相同的方法，你也会得到编译时错误。鉴于目前为止所有情况都是编译时错误，这一事实似乎不值一提。然而，有一种方法可以对方法标识符进行重载，这既有用又重要。\n\
  \n考虑 `Console` 类的 `WriteLine` 方法。你已经使用过此方法向屏幕写入字符串。然而，当你编写 C# 代码时，在代码和文本编辑器窗口输入\
  \ `WriteLine`，请注意 Microsoft IntelliSense 为你提供了 19 种不同的选项！每个版本的 `WriteLine` 方法都接受不同的参数集；一个版本不接受参数并仅输出一个空行，另一个版本接受一个\
  \ `bool` 参数并输出其值的字符串表示（`True` 或 `False`），而还有一种实现接受一个 `decimal` 参数并将其作为字符串输出，以此此类推。在编译时，编译器查看你传递的参数的类型，然后安排你的应用程序调用具有匹配参数集的方法版本。这里有一个示例：\n\
  \n点击此处查看代码图像\n\n```csharp\nstatic void Main()\n{\nConsole.WriteLine(\"The answer\
  \ is \");\nConsole.WriteLine(42);\n}\n```\n\n当你需要对不同数据类型或不同组信息执行相同操作时，重载主要非常有用。当不同的实现具有不同的参数集时，你就可以重载方法——即当它们具有相同名称但参数数量不同，或者参数类型不同时。当你调用方法时，你提供一个用逗号分隔的参数列表，编译器将使用参数的数量和类型来选择重载方法中的一个。然而，请记住，尽管你可以重载方法的参数，但你不能重载方法的返回类型。换句话说，你不能声明两个仅返回类型不同的同名方法。（编译器很聪明，但还没那么聪明。）\n\
  \n## 编写方法\n\n在以下练习中，你将创建一个方法，用于计算顾问根据固定日费对给定咨询天数的收费费用。你将从开发应用程序逻辑开始，然后使用“生成方法存根向导”（Generate\
  \ Method Stub Wizard）帮助你编写该逻辑所用的方法。接下来，你将在控制台应用程序中运行这些方法以获得感。最后，你将使用 Visual Studio\
  \ 2015 调试器这些方法。\n\n### 开发应用程序逻辑\n\n1. 使用 Visual Studio 2015 打开 `DailyRate` 项目，该项目位于\
  \ `\\Microsoft Press\\VBS\\Chapter 3\\DailyRate` 文件夹。\n2. 在解决方案管理器中，在 `DailyRate`\
  \ 项目中双击 `Program.cs` 文件，在代码和文本编辑器中显示程序代码。\n\n此程序只是你尝试代码的测试框架。当应用程序启动时，它会调用 `run`\
  \ 方法。你在 `run` 方法中添加想要尝试的代码。（方法的调用方式需要对类的理解，请参阅第 7 章\n\n```csharp\nvoid run()\n{\n\
  double dailyRate = readDouble(\"Enter your daily rate: \");\nint noOfDays = readInt(\"\
  Enter the number of days: \");\nwriteFee(calculateFee(dailyRate, noOfDays));\n}\n\
  ```\n\n你刚刚添加到 `run` 方法的代码块调用了 `readDouble` 方法（你稍后会编写），向用户询问日费。下一条语句调用 `readInt`\
  \ 方法（你也将编写）来获取天数。最后，调用 `writeFee` 方法（待编写）在屏幕上显示结果。注意传递给 `writeFee` 的值是 `calculateFee`\
  \ 方法（最后一个你需要编写的方法）的返回值，该方法接收日费和天数并计算应付总费用。你将使用 Visual Studio 2015 调试器在运行方法调用时进行步和跳出。\n\
  \n\n\n你尚未编写 `readDouble`、`readInt`、`writeFee` 和 `calculateFee` 方法，因此当你输入这些代码时，IntelliSense\
  \ 不显示这些方法。先不要尝试生成应用程序——它会失败。\n\n***\n\n使用生成方法存根向导（Generate Method Stub Wizard）编写方法\n\
  \n**1.** 在代码和文本编辑器（Code and Text Editor）窗口中，在 `run` 方法中，右键点击 `readDouble` 方法调用。\n\
  \n会出现一个快捷菜单，其中包含用于生成和编辑代码的有用命令，如下所示：\n\n![Image](img/Image00041.jpg)\n\n**2.** 在快捷菜单上，点击\
  \ `Quick Actions`（快速操作）。\n\nVisual Studio 验证 `readDouble` 方法不存在，并显示一个向导，允许你为该方法生成一个存根（stub）。Visual\
  \ Studio 会检查对 `readDouble` 方法的调用，确定其参数和返回值的类型，并建议一个默认实现，下图所示：\n\n![Image](img/Image00042.jpg)\n\
  \n**3.** 点击 Generate Method `Program.readDouble`。Visual Studio 将以下方法添加到你的代码中：\n\n\
  点击此处查看代码图像\n\n```csharp\nprivate double readDouble(string v)\n{\nthrow new NotImplementedException();\n\
  }\n```\n\n新方法带有 `private` 修饰符，该修饰符在 第 7 章 中有所描述。方法体目前只是抛出一个 `NotImplementedException`\
  \ 异常。（异常在 第 6 章 中描述）。在下一步中用你自己的代码替换方法体。\n\n**4.** 从 `readDouble` 方法中删除 `throw new\
  \ NotImplementedException();` 语句，并将其替换为加粗显示的以下代码行：\n\n点击此处查看代码图像\n\n```csharp\n\
  private double readDouble(string v)\n{\n    Console.Write(v);\n    string line =\
  \ Console.ReadLine();\n    return double.Parse(line);\n}\n```\n\n此代码块将变量 `v` 中的字符串显示在屏幕上。该变量是调用方法时传递的字符串参数；它包含了提示用户输入每日费率的消息。\n\
  \n***\n\n![Image](img/Image00005.jpg) 备注\n\n`Console.Write` 方法与你在早期练习中使用的 `Console.WriteLine`\
