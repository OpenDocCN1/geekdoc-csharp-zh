  \ (此处：响应翻译和重要)\n\n(注：由于提供的原文文本中包含大量逻辑重复的内容，翻译时已根据语意整合，确保文档的流畅性。)\n\n***\n\n### 异步性与可扩展性\n\
  \n异步性是一个强大的概念，如果你在构建大型应用程序和服务时，就需要理解它。Web 服务器具有有限的资源来处理请求，如果用户调用一个可能需要长时间的操作，在很多情况下，这种操作是异步的。例如，考虑一个电子商务系统，用户正在查询目录或下单。许多\
  \ Web 服务器只能支持有限的并发连接，如果与连接的线程等待 I/O 操作完成，该线程就会被阻塞。如果线程创建一个任务来处理 I/O，那么线程就可以释放。这种方法比同步实现此类操作具有更好的可扩展性。\n\
  \n关于同步操作的示例以及详细说明，请阅读 GitHub 仓库中的同步 I/O 模式：`https://github.com/mspnp/performance-optimization/tree/master/SynchronousIO`\n\
  \n***\n\n### 实现异步方法\n\n`异步`方法是不阻塞其启动的当前线程。当应用程序调用异步方法时，隐含的约定是该方法会快速返回控制权，并在单独的线程上执行工作。*快速*并没有数学上的定义，但预期是如果异步方法执行可能导致明显延迟的操作，它应该在后台线程执行，以便调用者继续运行。这个过程听起来很复杂，在之前的\
  \ .NET 框架中确实如此。然而，C# 现在提供了 `async` 方法修饰符和 `await` 运算符，由编译器处理大部分复杂性，这意味着你不再需要担心线程的细节。\n\
  \n定义 定义异步方法：问题\n\n你已经看到过如何使用 `Task` 对象来实现并发操作。快速回顾：当你使用 `Task` 类型的 `Start` 或 `Run`\
  \ 方法启动任务时，公共语言运行时 (CLR) 会使用自己的调度算法将任务分配给线程，并在资源充足时选择方便的时间运行该线程。这种方法使你的代码不再需要识别和管理计算机的工作负载。\n\
  \n如果你需要在特定任务完成后执行另一个操作，你有以下选择：\n\n![Image](img/Image00001.jpg) 你可以使用 `Task` 类型提供的任一\
  \ `Wait` 方法手动等待任务完成。然后你可以启动新操作，可能是定义另一个任务。\n\n![Image](img/Image00001.jpg) 你可以定义一个延续。延续操作只是指定了在给定任务完成后执行的操作。.NET\
  \ 框架会在原始任务完成时自动作为一个任务执行延续操作。延续操作将重用与原始任务相同的线程。\n\n\n\n然而，尽管 `Task` 类型为操作提供了方便的泛化，但你仍然经常需要编写可能有些生拙的代码来解决开发者在使用后台线程时遇到的一些常见问题。例如，假设你定义了以下方法，它执行了一系列必须串顺序运行的长时操作，然后在屏幕上的\
  \ `TextBox` 控件中显示消息：\n\n点击此处查看代码图像\n\n```csharp\nprivate void slowMethod()\n{\n\
  \    doFirstLongRunningOperation();\n    doSecondLongRunningOperation();\n    doThirdLongRunningOperation();\n\
  \    message.Text = \"Processing Completed\";\n}\n\nprivate void doFirstLongRunningOperation()\n\
  {\n    ...\n}\n\nprivate void doSecondLongRunningOperation()\n{\n    ...\n}\n\n\
  private void doThirdLongRunningOperation()\n{\n    ...\n}\n```\n\n如果你从用户界面代码（例如按钮控件的\
  \ `Click` 事件处理程序）中调用 `slowMethod()`，则用户界面将在该方法完成之前一直无响应。你可以通过使用 `Task` 对象来运行 `doFirstLongRunningOperation()`\
  \ 方法，并为同一个 `Task` 定义连续任务，按顺序运行 `doSecondLongRunningOperation()` 和 `doThirdLongRunningOperation()`\
  \ 方法，从而让 `slowMethod()` 方法更具响应性，如下：\n\n点击此处查看代码图像\n\n```csharp\nprivate void slowMethod()\n\
  {\n    Task task = new Task(doFirstLongRunningOperation);\n    task.ContinueWith(doSecondLongRunningOperation);\n\
  \    task.ContinueWith(doThirdLongRunningOperation);\n    task.Start();\n    message.Text\
  \ = \"Processing Completed\"; // 消息何时出现？\n}\n\nprivate void doFirstLongRunningOperation()\n\
  {\n    ...\n}\n\nprivate void doSecondLongRunningOperation(Task t)\n{\n    ...\n\
  }\n\nprivate void doThirdLongRunningOperation(Task t)\n{\n    ...\n}\n```\n\n尽管这种重构似乎简单，但仍有一些点需要注意。具体来说，`doSecondLongRunningOperation()`\
  \ 和 `doThirdLongRunningOperation()` 方法的签名已经更改，以适应连续任务的要求（触发连续任务的 `Task` 对象被作为参数传递给连续任务方法）。更重要的是，你需要问自己：“消息何时在\
  \ `TextBox` 控件中显示？”第二个点产生的问题在于，尽管 `Start()` 方法启动了一个 `Task`，但它并不会等待其完成，因此消息会在处理进行期间显示，而不是在完成后显示。\n\
  \n这是一个有些微不足道的例子，但通用原理是重要的，而且至少有两种解决方案。第一种是在显示消息之前等待 `Task` 完成，如下：\n\n点击此处查看代码图像\n\
  \n```csharp\nprivate void slowMethod()\n{\n    Task task = new Task(doFirstLongRunningOperation);\n\
  \    task.ContinueWith(doSecondLongRunningOperation);\n    task.ContinueWith(doThirdLongRunningOperation);\n\
  \    task.Start();\n    task.Wait();\n    message.Text = \"Processing Completed\"\
  ;\n}\n```\n\n然而，现在对 `Wait()` 方法的会阻塞执行 `slowMethod()` 方法的线程，这抵消了最初使用 `Task` 的目的。\n\
  \n***\n\n![Image](img/Image00004.jpg) 重要\n\n通常情况下，你**绝对不要**在用户界面线程中直接调用 `Wait()`\
  \ 方法。\n\n***\n\n更好的解决方案是定义一个显示消息的连续任务，并安排它仅在 `doThirdLongRunningOperation()` 方法完成后运行，在这种情况下，你可以删除对\
  \ `Wait()` 方法的调用。你可能倾向于将此连续任务实现为委托，如下面代码中的**粗体**所示（记住，连续任务接收一个 `Task` 对象作为参数；这就是委托中参数\
  \ `t` 的作用）：\n\n点击此处查看代码图像\n\n```csharp\nprivate void slowMethod()\n{\n    Task task\
  \ = new Task(doFirstLongRunningOperation);\n    task.ContinueWith(doSecondLongRunningOperation);\n\
  \    task.ContinueWith(doThirdLongRunningOperation);\n    task.ContinueWith((t)\
  \ => message.Text = \"Processing Complete\");\n    task.Start();\n}\n```\n\n遗憾的是，这种方法暴露了另一个问题。如果你尝试在调试（Debug）模式下运行此代码，你会发现最后的连续任务生成了一个\
  \ `System.Exception` 异常，其信息相当晦涩：“应用程序调用了为不同线程封送的接口。”这里的问题在于，只有用户界面线程可以操作用户界面控件，而你现在正尝试从不同的线程（用于运行\
  \ `Task` 的线程）写入 `TextBox` 控件。你可以通过 `Dispatcher` 对象来解决这个问题。`Dispatcher` 对象是用户界面基础设施的一个组件，你可以通过调用其\
  \ `RunAsync()` 方法向它发送请求，在用户界面线程上执行工作。该方法接收一个 `Action` 委托，指定要运行的代码。`Dispatcher` 对象和\
  \ `RunAsync()` 方法的细节超出了本书的范围，但下面的示例显示了你如何使用它们从连续任务显示 `slowMethod()` 方法所需的消息：\n\n\
  点击此处查看代码图像\n\n```csharp\nprivate void slowMethod()\n{\n    Task task = new Task(doFirstLongRunningOperation);\n\
  \    task.ContinueWith(doSecondLongRunningOperation);\n    task.ContinueWith(doThirdLongRunningOperation);\n\
  \    task.ContinueWith((t) => this.Dispatcher.RunAsync(CoreDispatcherPriority.Normal,\
  \ () => message.Text = \"Processing Complete\"));\n    task.Start();\n}\n```\n\n\
  这种方法可行，但它很凌乱且难以维护。你现在有一个委托（连续任务）指定了另一个委托（由 `RunAsync` 执行的代码）。\n\n***\n\n![Image](img/Image00148.jpg)\
  \ 更多信息\n\n你可以在微软网站上找到关于 `Dispatcher` 对象和 `RunAsync` 方法的更多信息 [`msdn.microsoft.com/library/windows.ui.core.dispatcher.runasync`](https://msdn.microsoft.com/library/windows.ui.core.dispatcher.runasync)。\n\
  \n***\n\n#### 定义异步方法\n\nC# 中的 `async` 关键字是为了让你定义和调用可以异步运行的方法。这意味着你不需要担心指定连续任务，或在\
  \ `Dispatcher` 对象上调度代码以确保在正确的线程上操作数据。简单来说：\n\n![Image](img/Image00001.jpg) `async`\
  \ 修饰符表示方法包含可以异步运行的功能。\n\n![Image](img/Image00001.jpg) `await` 运算符指定了应该执行这些异步功能的点。\n\
  \n下面的代码示例显示了使用 `async` 修饰符和 `await` 运算符实现的 `slowMethod()` 方法：\n\n```csharp\nprivate\
  \ async void slowMethod()\n{\n    await doFirstLongRunningOperation();\n    await\
  \ doSecondLongRunningOperation();\n    await doThirdLongRunningOperation();\n  \
  \  message.Text = \"Processing Complete\";\n}\n```\n\n该方法现在看起来与原始版本非常相似，这就是 `async`\
  \ 和 `await` 的威力。事实上，这种魔法仅仅是 C# 编译器对你的代码进行的改造工作。当 C# 编译器在 `async` 方法中遇到 `await` 运算符时，它实际上会将该运算符后续的操作数重新格式化为在\
  \ `async` 方法相同的线程上运行的任务。剩余代码被转换为任务完成后运行的连续任务，再次在相同的线程上运行。\n\n\n\n\n尽管这种方法一眼看起来非常简单，但请务必记住以下几点并避免一些可能的误解：\n\
  \n![Image](img/Image00001.jpg) `async` 修饰符并不意味着方法会在单独的线程上异步运行。它仅仅是指定方法中的代码可以被分为一个或多个后续操作（continuations）。当这些后续操作执行时，它们在与原始方法调用相同的线程上执行。\n\
  \n![Image](img/Image00001.jpg) `await` 算符指定了 C# 编译器可以将代码拆分为后续操作的点。`await` 操作符本身期望其操作数是一个\
  \ `awaitable`（可等待）对象。可等待对象是一个提供 `GetAwaiter` 方法的类型，该方法返回一个对象，后者提供了运行代码和等待其完成的方法。C#\
  \ 编译器将你的代码转换为使用这些方法的语句，以创建适当的后续操作。\n\n***\n\n![Image](img/Image00004.jpg) 重要提示\n\
  \n你只能在标记为 `async` 的方法中使用 `await` 操作符。在 `async` 方法之外，`await` 关键字被视为普通的标识符（你甚至可以创建一个名为\
  \ `await` 的变量，尽管不建议这样做）。\n\n***\n\n在 `await` 操作符的当前实现中，它期望你指定的操作数的可等待对象是 `Task`。这意味着你必须对\
  \ `doFirstLongRunningOperation`、`doSecondLongRunningOperation` 和 `doThirdLongRunningOperation`\
  \ 方法进行一些修改。具体来说，每个方法现在必须创建并运行一个 `Task` 来执行工作，并返回该 `Task` 的引用。以下示例显示了 `doFirstLongRunningOperation`\
  \ 方法的修改版本：\n\n点击此处查看代码图像\n\n```csharp\nprivate Task doFirstLongRunningOperation()\n\
  {\n    Task t = Task.Run(() => { /* 此方法的原始代码在此 */ });\n    return t;\n}\n```\n\n\
  同样值得考虑是否有机会将 `doFirstLongRunningOperation` 方法执行的工作分解为一系列并行操作。如果是，你可以将工作划分为一组 `Task`，如\
  \ 第 23 章 所示。然而，你应该返回这些 `Task` 对象中的哪一个作为方法的结果？\n\n点击此处查看代码图像\n\n```csharp\nprivate\
  \ Task doFirstLongRunningOperation()\n{\n    Task first = Task.Run(() => { /* 第一个操作的代码\
  \ */ });\n    Task second = Task.Run(() => { /* 第二个操作的代码 */ });\n    return ...;\
  \ // 你返回 first 还是 second？\n}\n```\n\n如果方法返回 `first`，`slowMethod` 中的 `await` 操作符将只等待该\
  \ `Task` 完成，而不等待 `second`。如果方法返回 `second`，则适用类似的逻辑。解决方案是使用 `async` 定义 `doFirstLongRunningOperation`\
  \ 方法并等待每个 `Task`，如下所示：\n\n点击此处查看代码图像\n\n```csharp\nprivate async Task doFirstLongRunningOperation()\n\
  {\n    Task first = Task.Run(() => { /* 第一个操作的代码 */ });\n    Task second = Task.Run(()\
  \ => { /* 第二个操作的代码 */ });\n    await first;\n    await second;\n}\n```\n\n记住，当编译器遇到\
  \ `await` 操作符时，它会生成等待参数所指定的项目完成的代码，连同一个执行后续语句的后续操作。你可以将 `async` 方法返回的值认为是运行此后续操作的\
  \ `Task` 的引用（这个描述并不完全准确，但对于本章的目的来说是一个足够好的模型）。因此，`doFirstLongRunningOperation` 方法创建并启动了并行运行的任务\
  \ `first` 和 `second`，编译器将 `await` 语句重格式化为等待 `first` 完成的代码，随后 是一个等待 `second` 完成的后续操作，而\
  \ `async` 修饰符导致编译器返回该后续操作的引用。注意，由于编译器现在确定了方法的返回值，你不再需要自己指定返回值（事实上，如果在这种情况下你尝试返回一个值，你的代码将无法通过编译）。\n\
  \n***\n\n![Image](img/Image00005.jpg) 注意事项\n\n如果你不在 `async` 方法中包含 `await` 语句，那么该方法仅仅是某个执行方法体内代码的\
  \ `Task` 的引用。因此，当你调用该方法时，它并不会实际异步运行。在这种情况下，编译器将向你发出警告信息：“此 `async` 方法缺少 await 操作符并将同步运行。”\n\
  \n***\n\n***\n\n![Image](img/Image00013.jpg) 提示\n\n你可以使用 `async` 修饰符为委托添加前缀，使得能够通过使用\
  \ `await` 操作符创建包含异步处理的委托。\n\n***\n\n在接下来的练习中，你将使用 第 23 章 中的 GraphDemo 应用并修改它，以使用异步方法生成图表数据。\n\
  \n### 修改 GraphDemo 应用以使用异步方法\n\n1. 使用 Microsoft Visual Studio 2015 打开 GraphDemo\
  \ 解决方案，它位于 `\\Microsoft Press\\VCSBS\\Chapter 23` 目录下。\n\n2. 在解决方案管理器中展开 `MainPage.xaml`\
  \ 节点并打开它。\n\n3. 在代码编辑器器的 `MainPage` 类中，找到 `plotButton_Click` 方法。\n\n该方法的代码如下：\n\n\
  点击此处查看代码图像\n\n```csharp\nprivate void plotButton_Click(object sender, RoutedEventArgs\
  \ e)\n{\n    Random rand = new Random();\n    CancellationTokenSource tokenSource\
  \ = new CancellationTokenSource();\n    CancellationToken token = tokenSource.Token;\n\
  \    Stopwatch watch = Stopwatch.StartNew();\n    try\n    {\n        generateGraphData(data,\
  \ 0, pixelWidth / 2, token);\n        duration.Text = $\"Duration (ms): {watch.ElapsedMilliseconds}\"\
