  Calculator being created\");\n    }\n    ...\n}\n```\n\n此构造函数的作用是使你能够验证一个 `Calculator`\
  \ 对象是否已成功创建。\n\n**8.** 在 `Calculator` 类中，在构造函数之后添加后续代码中**加粗**显示的析构函数：\n\n点击此处查看代码图像\n\
  \n```csharp\nclass Calculator\n{\n    ...\n    ~Calculator()\n    {\n        Console.WriteLine(\"\
  Calculator being finalized\");\n    }\n    ...\n}\n```\n\n此析构函数只是显示一条消息，以便你可以看到垃圾回收器何时运行并终化该类的实例。在为实际应用程序编写类时，通常不会在析构函数中输出文本。\n\
  \n**9.** 在代码和文本编辑器窗口中显示 `Program.cs` 文件。\n\n**10.** 在 `Program` 类中，在 `Main` 方法中添加以下**加粗**显示的语句：\n\
  \n点击此处查看代码图像\n\n```csharp\nstatic void Main(string[] args)\n{\n    Calculator calculator\
  \ = new Calculator();\n    Console.WriteLine($\"120 / 15 = {calculator.Divide(120,\
  \ 15)}\");\n    Console.WriteLine(\"Program finishing\");\n}\n```\n\n这段代码创建了一个 `Calculator`\
  \ 对象，调用了该对象的 `Divide` 方法（并显示结果），然后在程序结束时输出一条消息。\n\n**11.** 在调试菜单上，点击“不调试启动”。验证程序是否显示了以下系列消息：\n\
  \nCalculator being created\n120 / 15 = 8\nProgram finishing\nCalculator being finalized\n\
  \n注意，`Calculator` 对象的终化器仅在应用程序即将结束、`Main` 方法完成后才会运行。\n\n**12.** 在控制台窗口中，按 Enter\
  \ 键返回 Visual Studio 2015。\n\nCLR 保证由你的应用程序创建的所有对象都将接受垃圾回收，但你不能总是确定这将在何时发生。在练习中，该程序运行时间非常短，当\
  \ CLR 在程序结束时进行清理时，`Calculator` 对象被终化了。然而，你可能也会发现，在具有消耗稀缺资源的更实质性的应用程序中，情况也是如此；除非你采取必要的步骤来提供释放方法，否则你的应用程序创建的对象可能会一直保留其资源，直到应用程序结束。如果资源是文件，这可能会阻止其他用户访问该文件；如果资源是数据库连接，你的应用程序可能会阻止其他用户连接到同一个数据库。理想情况下，你希望在完成使用资源后立即释放它们，而不是等待程序终止。\n\
  \n在下一个练习中，你将在 `Calculator` 类中实现 `IDisposable` 接口，并允许程序在其选择的时间终化 `Calculator` 对象。\n\
  \n## 实现 IDisposable 接口\n\n**1.** 在代码和文本编辑器窗口中显示 `Calculator.cs` 文件。\n\n**2.** 修改\
  \ `Calculator` 类的定义，使其实现 `IDisposable` 接口，如下所示**加粗**所示：\n\n点击此处查看代码图像\n\n```csharp\n\
  class Calculator : IDisposable\n{\n    ...\n}\n```\n\n**3.** 在 `Calculator` 类的末尾添加以下方法（命名为\
  \ `Dispose`）。该方法由 `IDisposable` 接口定义：\n\n点击此处查看代码图像\n\n```csharp\nclass Calculator\
  \ : IDisposable\n{\n    ...\n    public void Dispose()\n    {\n        Console.WriteLine(\"\
  Calculator being disposed\");\n    }\n}\n```\n\n通常会在 `Dispose` 方法中添加代码来释放对象所持有的资源。在这种情况下没有资源，该方法中\
  \ `Console.WriteLine` 语句的作用只是为了让你看到 `Dispose` 方法何时运行。然而，你可以看到，在实际应用程序中，析构函数和 `Dispose`\
  \ 方法之间可能会存在某些代码重复。为了消除这种重复，你通常会将这些代码放在一个地方并从另一个地方调用它。但由于你不能从 `Dispose` 方法中显式调用析构函数，因此合理的做法是在析构函数中调用\
  \ `Dispose` 方法，并将释放资源的逻辑放在 `Dispose` 方法中。\n\n**4.** 修改析构函数使其调用 `Dispose` 方法，如下述代码中**加粗**所示。（在终化器中保留显示消息的语句，以便你可以看到它何时被垃圾回收器运行）。\n\
  \n点击此处查看代码图像\n\n```csharp\n~Calculator()\n{\n    Console.WriteLine(\"Calculator\
  \ being finalized\");\n    this.Dispose();\n}\n```\n\n当你想在应用程序中销毁 `Calculator` 对象时，`Dispose`\
  \ 方法不会自动运行；你的代码必须显式地调用它（例如 `calculator.Dispose()`），或者在 `using` 语句中创建 `Calculator`\
  \ 对象。在你的程序中，将采用后者。\n\n**5.** 在代码和编辑器窗口中显示 `Program.cs` 文件。修改 `Main` 方法中创建 `Calculator`\
  \ 对象并调用 `Divide` 方法的语句，如下所示**加粗**所示：\n\n点击此处查看代码图像\n\n```csharp\nstatic void Main(string[]\
  \ args)\n{\n    using (Calculator calculator = new Calculator())\n    {\n      \
  \  Console.WriteLine($\"120 / 15 = {calculator.Divide(120, 15)}\");\n    }\n   \
  \ Console.WriteLine(\"Program finishing\");\n}\n```\n\n**6.** 在调试菜单上，点击“不调试启动”。验证程序现在显示了以下系列消息：\n\
  \nCalculator being created\n120 / 15 = 8\nCalculator being disposed\nProgram finishing\n\
  Calculator being finalized\nCalculator being disposed\n\n`using` 语句在显示“Program finishing”语句之前运行\
  \ `Dispose` 方法。然而，你可以看到应用程序结束时 `Calculator` 对象的析构函数仍然运行，并且它再次调用了 `Dispose` 方法。这显然是浪费资源。\n\
  \n**7.** 在控制台窗口中，按 Enter 键返回 Visual Studio 2015。\n\n多次释放对象持有的资源可能也可能是灾难性的，但绝对不是良好的做法。解决此问题的建议方法是在类中添加一个私有布尔字段以指示\
  \ `Dispose` 方法是否已调用，然后在 `Dispose` 方法中检查该字段。\n\n## 防止对象多次释放\n\n**1.** 在代码和文本编辑器窗口中显示\
  \ `Calculator.cs` 文件。\n\n**2.** 在 `Calculator` 类中添加一个名为 `disposed` 的私有布尔字段，并将该字段的值初始化为\
  \ `false`，如下**加粗**所示：\n\n```csharp\nclass Calculator : IDisposable\n{\n    private\
  \ bool disposed = false;\n    ...\n}\n```\n\n该字段的作用跟踪对象的状态并指示 `Dispose` 方法是否已调用。\n\
  \n**3.** 修改 `Dispose` 方法中的代码，仅当 `disposed` 字段为 `false` 时才显示消息。显示消息后，将 `disposed`\
  \ 字段设置为 `true`，如下所示**加粗**所示：\n\n```csharp\npublic void Dispose()\n{\n    if (!this.disposed)\n\
  \    {\n        Console.WriteLine(\"Calculator being disposed\");\n    }\n}\n```\n\
  \n\n\n\n\n```csharp\nthis.disposed = true;\n}\n```\n\n**4.** 在“调试”（Debug）菜单上，点击“不调试启动”（Start\
  \ Without Debugging）。注意程序显示了以下系列消息：\n\nCalculator being created\n120 / 15 = 8\n\
  Calculator being disposed\nProgram finishing\nCalculator being finalized\n\n`Calculator`\
  \ 对象现在仅丢弃一次，但析构函数仍在运行。同样，这是一种浪费；对于一个已经释放了资源的对象运行析构函数没有意义。\n\n### 5. 在控制台窗口中，按回车键（Enter）返回\
  \ Visual Studio 2015。\n\n### 6. 在 `Calculator` 类中，在 `Dispose` 方法的末尾添加此处加粗显示的语句：\n\
  \n点击此处查看代码图像\n\n```csharp\npublic void Dispose()\n{\n    if (!this.disposed)\n \
  \   {\n        Console.WriteLine(\"Calculator being disposed\");\n    }\n    this.disposed\
  \ = true;\n    GC.SuppressFinalize(this);\n}\n```\n\n`GC` 类提供了对垃圾回收器的访问，并实现了几个静态方法，通过这些方法你可以控制它执行某些操作。使用\
  \ `SuppressFinalize` 方法，你可以指示垃圾回收器不要对指定对象执行终结化，这可以防止析构函数的运行。\n\n***\n\n![Image](img/Image00004.jpg)\
  \ **重要**\n\n`GC` 类暴露了许多方法，你可以通过这些方法配置垃圾回收器。然而，通常让 `CLR` 自己管理垃圾回收器更好，因为如果你不加地调用这些方法，可能会严重损害应用程序的性能。你应该极其谨慎地对待\
  \ `SuppressFinalize` 方法，因为如果你未能释放一个对象，就会面临丢失数据的风险（例如，如果你未能正确关闭文件，内存中缓冲但尚未写入磁盘的任何数据可能会丢失）。仅在像本练习中所示的情况下调用此方法，即当你确定一个对象已经被丢弃时。\n\
  \n***\n\n### 7. 在“调试”（Debug）菜单上，点击“不调试启动”。注意程序显示了以下系列消息：\n\nCalculator being created\n\
  120 / 15 = 8\nCalculator being disposed\nProgram finishing\n\n你可以看到析构函数不再运行，因为 `Calculator`\
  \ 对象在程序结束之前已经执行了释放。\n\n### 8. 在控制台窗口中，按回车键（Enter）返回 Visual Studio 2015。\n\n***\n\
  \n## 线程安全与 `Dispose` 方法\n\n使用 `disposed` 字段防止对象被多次丢弃的示例在大多数情况下运行良好，但请记住，你无法控制终结器运行的时机。在本章的练习中，它总是在程序结束时执行的，但情况并不总是如此——它可以在对象的最后一个引用消失后的任何时间运行。因此，可能在运行\
  \ `Dispose` 方法时，垃圾回收器会在自己的线程上实际上调用了终结器，特别是当 `Dispose` 方法需要执行大量工作时。你可以通过将设置 `disposed`\
  \ 字段设为 `true` 的语句移动到 `Dispose` 方法的开始处来减少资源被多次释放的可能性，但在这种情况下，如果你在设置该变量之后释放资源之前发生了异常，你就会面临完全不释放资源的风险。\n\
  \n为了完全消除两个并发线程同时释放同一个对象中相同资源的可能，你可以通过将代码嵌入 C# `lock` 语句中来编写线程安全的代码，如下所示：\n\n点击此处查看代码图像\n\
  \n```csharp\npublic void Dispose()\n{\n    lock(this)\n    {\n        if (!disposed)\n\
  \        {\n            Console.WriteLine(\"Calculator being disposed\");\n    \
  \    }\n        this.disposed = true;\n        GC.SuppressFinalize(this);\n    }\n\
  }\n```\n\n`lock` 语句的作用是防止同一块代码在不同的线程上同时运行。`lock` 语句的参数（上例例中的 `this`）应该是对象的引用。大括号之间的代码定义了\
  \ `lock` 语句的作用范围。当执行到 `lock` 语句时，如果指定的对象当前被锁定，请求锁的线程将被阻塞，代码在此处暂停。当当前持有锁的线程到达 `lock`\
  \ 语句的右大括号时，锁会被释放，允许被阻塞的线程获取锁并继续执行。然而，当这种情况发生时，`disposed` 字段已经被设置为 `true`，因此第二个线程将不会尝试执行\
  \ `if (!disposed)` 块中的代码。\n\n像这样使用锁是安全的，但可能会损害性能。另一种方法是使用本章早期描述的策略，即仅对对托管资源的重复释放进行抑制。（多次释放托管资源不是异常安全的；你不会损害计算机的安全性，但如果你尝试释放一个不再存在的托管对象，可能会影响你应用程序的逻辑完整性。）\
  \ 这种策略实现了 `Dispose` 方法的重载版本；`using` 语句调用 `Dispose()`，随后 `Dispose()` 反过来运行 `Dispose(true)`\
  \ 语句，而析构函数调用 `Dispose(false)`。只有当 `Dispose` 方法重载版本的参数为 `true` 时，才会释放托管资源。有关更多信息，请参阅“从析构函数中调用\
  \ dispose 方法”部分中的示例。\n\n***\n\n## 验证对象在异常发生后已释放\n\n`using` 语句的作用是确保即使发生异常，对象也始终会被丢弃。在本章的最后一个练习中，你将通过在\
  \ `using` 块中生成异常来验证这一点。\n\n**1.** 在代码编辑器窗口中显示 `Program.cs` 文件。\n\n**2.** 按此处加粗所示修改调用\
  \ `Calculator` 对象的 `Divide` 方法的语句：\n\n点击此处查看代码图像\n\n```csharp\nstatic void Main(string[]\
  \ args)\n{\n    using (Calculator calculator = new Calculator())\n    {\n      \
  \  Console.WriteLine($\"120 / 0 = {calculator.Divide(120, 0)}\");\n    }\n    Console.WriteLine(\"\
  Program finishing\");\n}\n```\n\n修改后的语句尝试将 120 除以 0。\n\n**3.** 在“调试”（Debug）菜单上，点击“不调试启动”。\n\
  \n正如你预期的那样，应用程序抛出了未处理的 `DivideZeroException` 异常。\n\n**4.** 在 `GarbageCollectionDemo`\
  \ 消息框中，点击取消。（你需要在 Debug 和 Close 按钮出现之前这样做。）\n\n![Image](img/Image00108.jpg)\n\n\
  **5.** 验证控制台窗口在未处理的异常后出现了“Calculator being disposed”消息。\n\n![Image](img/Image00109.jpg)\n\
