  \ 2015 编译并运行程序。这次，`December` 一词被写入控制台。\n\n![Image](img/Image00083.jpg) 在枚举变量上执行数学运算（如递增操作）会改变变量的内部整数值。当变量写入控制台时，会显示相应的枚举值。\n\
  \n14. 按回车键关闭程序并返回 Visual Studio 2015 编程环境。\n\n### 使用结构体\n\n8 章 说明类定义在堆上创建的引用类型。在某些情况下，类包含的数据很少，以至于管理堆的开销变得不成比例。在这种情况下将类型定义为结构体更好。结构体的值类型。\n\
  \n常见类型\n\n你可能没有意识到，你已经在之前的练习中使用过结构体。在 C# 中，基本数值类型 `int`、`long` 和 `float` 分别是结构体\
  \ `System.Int32`、`System.Int64` 和 `System.Single` 的别名。这些结构体具有字段和方法，你实际上可以在变量和字面量上调用方法。例如，所有这些结构体都提供\
  \ `ToString` 方法，可以将数值转换为字符串表示。以下语句在 C# 中都是合法的：\n\n```cs\nint i = 55;\nConsole.WriteLine(i.ToString());\n\
  Console.WriteLine(55.ToString());\n\nfloat f = 98.765F;\nConsole.WriteLine(f.ToString());\n\
  Console.WriteLine(98.765F.ToString());\n```\n\n你不经常看到这种 `ToString` 方法的用法，因为 `Console.WriteLine`\
  \ 方法在需要时会自动调用它。更常用这些结构体暴露的一些静态方法。例如，在前面的章节中，你使用了静态 `int.Parse` 方法将字符串转换为相应的整数值。你实际上执行的是调用\
  \ `Int32` 结构的 `Parse` 方法：\n\n点击此处查看代码图片\n\n```cs\nstring s = \"42\";\nint i = int.Parse(s);\
  \ // 等同于 Int32.Parse(s)\n```\n\n这些结构体还包含一些有静态字段。例如，`Int32.MaxValue` 是 `int` 可以容的最大值，而\
  \ `Int32.MinValue` 是存储在 `int` 中的最小值。\n\n下表显示了 C# 基本类型及其在 Microsoft .NET 框架中的对应类型。注意\
  \ `string` 和 `object` 类型是类（引用类型），而非结构体。\n\n\n\n\n要声明你自己的结构体类型，你需要使用 `struct` 关键字，后跟类型名称，然后用左、右大括号括起结构体的体。在语法上，这个过程与声明类相似。例如，这里有一个名为\
  \ `Time` 的结构体，它包含了三个名为 `hours`、`minutes` 和 `seconds` 的公共 `int` 字段：\n\n点击此处查看代码图像\n\
  \n```csharp\nstruct Time\n{\n\npublic int hours, minutes, seconds;\n}\n```\n\n与类一样，在大多数情况下，将结构体的字段设置为公共是不建议的；因为没有办法可以控制字段中存储的值。例如，任何人都可以将\
  \ `minutes` 或 `seconds` 的值设置为大于 60。更好的主意是将字段设置为私有，并为你的结构体提供构造函数和方法来初始化和操作这些字段，如下所示：\n\
  \n点击此处查看代码图像\n\n```csharp\nstruct Time\n{\nprivate int hours, minutes, seconds;\n\
  ...\npublic Time(int hh, int mm, int ss)\n{\nthis.hours = hh % 24;\nthis.minutes\
  \ = mm % 60;\nthis.seconds = ss % 60;\n}\n\npublic int Hours()\n{\nreturn this.hours;\n\
  }\n```\n\n***\n\n![Image](img/Image00005.jpg) **注意**\n\n默认情况下，你不能对自己的结构体使用许多常用运算符。例如，你不能对结构体使用相等运算符\
  \ `==` 和不等运算符 `!=`。然而，你可以使用所有结构体暴露的 `Equals()` 方法来比较结构体变量，也可以显式地为你的结构体声明并实现运算符。实现此点的语法在第\
  \ 21 章，“使用表达式查询内存数据”中有所介绍。\n\n***\n\n当你复制一个值（类型）变量时，你会获得两个值的拷贝。相比之下，当你复制引用类型变量时，你获得的是同一个对象的两个引用。总之，对于小型数据，使用结构体复制值与复制地址一样高效。对于无法高效复制的复杂数据，请使用类。\n\
  \n***\n\n![Image](img/Image00013.jpg) **提示**\n\n使用结构体来实现其主要特征——值，而不是它们提供的功能。\n\n\
  ***\n\n### 理解结构体和类的区别\n\n结构体和类在语法上相似，但它们有一些重要的区别。让我们来看这些差异：\n\n![Image](img/Image00001.jpg)\
  \ 你不能为结构体声明默认构造函数（没有参数的构造函数）。如果 `Time` 是一个类，则下面的示例将会编译，但因为 `Time` 是结构体，它不能：\n\n\
  点击此处查看代码图像\n\n```csharp\nstruct Time\n{\npublic Time() { ... } // 编译错误\n...\n}\n\
  ```\n\n你不能为结构体声明默认构造函数是因为编译器*总是*会生成一个。在类中，只有在你没有编写构造函数时，编译器才会生成默认构造函数。结构体生成的默认构造函数会将字段设置为\
  \ `0`、`false` 或 `null`——与类一样。因此，你应该确保由默认构造函数创建的结构体值在这些默认值下逻辑上是合理的。这在下一个练习中将探讨一些影响。\n\
  \n可以通过提供非默认构造函数将字段初始化为不同的值。但是，当你这样做时，你的非默认构造函数必须显式初始化结构体中的所有字段；默认初始化不再发生。如果你这样做，将会得到编译错误。例如，尽管如果\
  \ `Time` 是类，下面的示例将会编译并静默地将 `seconds` 初始化为 `0`，但由于 `Time` 是结构体，它失败了：\n\n点击此处查看代码图像\n\
  \n```csharp\nstruct Time\n{\nprivate int hours, minutes, seconds;\n...\npublic Time(int\
  \ hh, int mm)\n{\nthis.hours = hh;\nthis.minutes = mm;\n} // 编译错误：seconds 未初始化\n\
  }\n```\n\n![Image](img/Image00001.jpg) 在类中，可以在声明处初始化实例字段。在结构体中，你不能。如果 `Time` 是类，下面的示例将会编译，但因为\
  \ `Time` 是结构体，它导致了编译错误：\n\n点击此处查看代码图像\n\n```csharp\nstruct Time\n{\nprivate int\
  \ hours = 0; // 编译错误\nprivate int minutes;\nprivate int seconds;\n...\n}\n```\n\n\
  下表总结了结构体和类之间的主要区别。\n\n![Image](img/Image00085.jpg)\n\n类和结构体在继承方面还有其他差异。这些差异在第 12\
  \ 章，“处理继承”#text00018.html_ch12)。\n\n### 声明结构体变量\n\n定义结构体类型后，你可以像使用任何其他类型一样完全使用它。例如，如果你定义了\
  \ `Time` 结构体，你可以创建 `Time` 类型的变量、字段和参数，如下示例所示：\n\n点击此处查看代码图像\n\n```csharp\nstruct\
  \ Time\n{\nprivate int hours, minutes, seconds;\n...\n}\n\nclass Example\n{\nprivate\
  \ Time currentTime;\npublic void Method(Time parameter)\n{\nTime localVariable;\n\
  ...\n}\n}\n```\n\n***\n\n![Image](img/Image00005.jpg) **注意**\n\n与枚举一样，你可以通过使用 `?`\
  \ 修饰创建结构体的可空版本。你可以将 `null` 值赋值给变量：\n\n```csharp\nTime? currentTime = null;\n```\n\
  \n***\n\n### 理解结构体初始化\n\n在本章之前，你看到了如何通过构造函数初始化结构体中的字段。如果你调用构造函数，之前提到的规则将确保所有字段都已初始化：\n\
  \n```csharp\nTime now = new Time();\n```\n\n下面的插图描述了字段的状态：\n\n![Image](img/Image00086.jpg)\n\
  \n然而，由于结构体是值类型，你也可以不调用构造函数就创建结构体变量，如下：\n\n```csharp\nTime now;\n```\n\n这种情况下，变量被创建了，但其字段处于未初始化状态。对这些字段的任何访问都将导致编译错误：\n\
  \n如果你已经写了自己的结构体构造函数，你也可以用它来初始化结构体变量。在本章之前提到的，结构体构造函数必须显式初始化它的所有字段。例如：\n\n```csharp\n\
  struct Time\n{\nprivate int hours, minutes, seconds;\n...\npublic Time(int hh, int\
  \ mm)\n{\nhours = hh;\nminutes = mm;\nseconds = 0;\n}\n}\n```\n\n下面的示例通过调用自定义构造函数初始化了\
  \ `now`：\n\n```csharp\nTime now = new Time(12, 30);\n```\n\n下面的插图显示了此示例的效果：\n\n\
  ![Image](img/Image00088.jpg)\n\n注意，在这两种情况下，*now* 变量都在栈上创建。\n\n是时候把这些知识付诸实践了。在接下来的练习中，你将创建一个结构体来表示日期。\n\
  \n### 创建并使用结构体类型\n\n1. 在 StructsAndEnums 项目中，在代码文本编辑器窗口显示 Date.cs 文件。\n\n2. 在 `StructsAndEnums`\
  \ 命名空间内，将 TODO 注释替换为名为 `Date` 的结构体。\n\n该结构应包含三个私有字段：一个类型为 `int` 的 `year`、一个类型为 `Month`\
  \ 的 `month`（使用上一个练习中创建的枚举）以及一个类型为 `int` 的 `day`。`Date` 结构体看起来完全如下：\n\n```csharp\n\
  struct Date\n{\nprivate int year;\n}\n```\n\n\n\n\n```csharp\nprivate Month month;\n\
  \nprivate int day;\n\n}\n```\n\n### 默认构造函数\n\n考虑编译器为 `Date` 生成的默认构造函数。此构造函数将 `year`\
  \ 设置为 `0`，`month` 设置为 `0`（1 月的值），并将 `day` 设置为 `0`。`year` 的值 `0` 是无效的（因为没有公元 0 年），`day`\
  \ 的值 `0` 也是无效的（因为每个月都从 1 号开始）。解决这个问题的一种方法是通过实现 `Date` 结构体来转换 `year` 和 `day` 的值，使得当\
  \ `year` 字段持有值 `Y` 时，该值代表年份 `Y + 1900`（或者你可以根据喜选择不同的世纪），当 `day` 字段持有值 `D` 时，该值代表第\
  \ `D + 1` 天。这样，默认构造函数会将这三个字段设置为代表 1900 年 1 月 1 日日期的值。\n\n如果你可以重写默认构造函数并编写自己的，那么这个问题就不是问题了，因为你可以直接将年份和日期字段初始化为有效值。然而，你无法做到这一点，所以你必须在结构体中实现逻辑，将编译器生成的默认值转换为对你的问题领域有意义的值。\n\
  \n然而，尽管你不能重写默认构造函数，但定义非默认构造函数仍然是一个良好的习惯，允许用户显式地将结构体的字段初始化为有意义的非默认值。\n\n### 3. 为\
  \ `Date` 结构体添加一个公共构造函数。**此构造函数应该接受三个参数：一个名为 `ccyy` 的 `int` 表示年份，一个名为 `mm` 的 `Month`\
  \ 表示月份，以及一个名为 `dd` 的 `int` 表示日期。使用这三个参数来初始化相应的字段。值为 `Y` 的 `year` 字段代表年份 `Y + 1900`，因此你需要将\
  \ `year` 字段初始化为 `ccyy - 1900`。值为 `D` 的 `day` 字段代表第 `D + 1` 天，因此你需要将 `day` 字段初始化为\
  \ `dd - 1`。\n\n`Date` 结构体现在看起来应该是这样（构造函数已加粗显示）：\n\n点击此处查看代码图像\n\n```csharp\nstruct\
  \ Date\n{\n    private int year;\n    private Month month;\n    private int day;\n\
  \n    public Date(int ccyy, Month mm, int dd)\n    {\n        this.year = ccyy -\
  \ 1900;\n        this.month = mm;\n        this.day = dd - 1;\n    }\n}\n```\n\n\
  **4. 在构造函数之后为 `Date` 结构体添加一个名为 `ToString` 的公共方法。**此方法不接受任何参数并返回日期的字符串表示。记住，`year`\
  \ 字段的值代表 `year + 1900`，而 `day` 字段的值代表 `day + 1`。\n\n* * *\n\n![图像](img/Image00005.jpg)\
  \  注释\n\n`ToString` 方法与你目前为止看到的方法稍有不同。每个类型（包括你定义的结构体和类）无论你是否想要，都自动拥有一个 `ToString`\
  \ 方法。它的默认行为是将变量中的数据转换为该数据的字符串表示。有时默认行为是有意义的；而在其他时候则意义不大。例如，为 `Date` 结构体生成的 `ToString`\
  \ 方法的默认行为只是生成字符串“StructsAndEnums.Date”。引用道拉斯·亚 在《宇宙尽头的餐厅》（Pan Macmillan, 1980）中\
  \ Zaphod Beeblebrox 的话，这是“精明的，但乏味的”。你需要定义该方法的新版本，通过使用 `override` 关键字来重写默认行为。重写方法将在第\
  \ 12 章中更详细地讨论。\n\n* * *\n\n`ToString` 方法看起来应该是这样的：\n\n点击此处查看代码图像\n\n```csharp\n\
  struct Date\n{\n    ...\n\n    public override string ToString()\n    {\n      \
  \  string data = $\"{this.month} {this.day + 1} {this.year + 1900}\";\n        return\
  \ data;\n    }\n}\n```\n\n在此方法中，你使用 `month` 字段值的文本表示、表达式 `this.day + 1` 以及表达式 `this.year\
  \ + 1900` 构建了一个格式化字符串。`ToString` 方法将格式化字符串作为结果返回。\n\n**5. 在代码和文本编辑器窗口中显示 Program.cs\
  \ 文件。**\n\n**6. 在 `doWork` 方法中，注释掉现有的四个语句。**\n\n**7. 在 `doWork` 方法中添加语句，声明一个名为 `defaultDate`\
  \ 的局部变量，并使用默认 `Date` 构造函数构造一个 `Date` 值。在 `doWork` 中添加另一个语句，通过调用 `Console.WriteLine`\
  \ 在控制台上显示 `defaultDate` 变量。\n\n* * *\n\n![图像](img/Image00005.jpg)  注释\n\n`Console.WriteLine`\
  \ 方法会自动调用其参数的 `ToString` 方法，将参数格式化为字符串。\n\n* * *\n\n`doWork` 方法现在看起来应该是这样的：\n\n\
  点击此处查看代码图像\n\n```csharp\nstatic void doWork()\n{\n    ...\n    Date defaultDate\
  \ = new Date();\n    Console.WriteLine(defaultDate);\n}\n```\n\n\n\n\n\n### 2. 为\
  \ `Date` 结构体添加以下方法。该方法会将结构体中的日期向推一个月。如果在增加月份后，`month` 字段的值超过了 12 月，代码将把月份重置为 1 月，并将\
  \ `year` 字段的值加 1。\n\n点击此处查看代码图片\n\n```cs\nstruct Date\n{\n  ...\n\n  public void\
  \ AdvanceMonth()\n  {\n    this.month++;\n    if (this.month == Month.December +\
  \ 1)\n    {\n      this.month = Month.January;\n      this.year++;\n    }\n  }\n\
  }\n```\n\n### 3. 在代码和文本编辑器窗口中显示 `Program.cs` 文件。\n\n### 4. 在 `doWork` 方法中，注释掉前两个未注释的创建并显示\
  \ `defaultDate` 变量值的语句。\n\n### 5. 在 `doWork` 方法的末尾添加以下**粗体显示**的代码。这段代码创建了一个名为 `weddingAnniversaryCopy`\
  \ 的 `weddingAnniversary` 变量的副本，并打印此新变量的值。\n\n点击此处查看代码图片\n\n```cs\nstatic void doWork()\n\
  {\n  ...\n\n  Date weddingAnniversaryCopy = weddingAnniversary;\n  Console.WriteLine($\"\
  Value of copy is {weddingAnniversaryCopy}\");\n}\n```\n\n### 6. 在 `doWork` 方法的末尾添加以下**粗体显示**的语句。这些语句调用\
  \ `weddingAnniversary` 变量的 `AdvanceMonth` 方法，然后显示 `weddingAnniversary` 和 `weddingAnniversaryCopy`\
  \ 变量的值：\n\n点击此处查看代码图片\n\n```cs\nstatic void doWork()\n{\n  ...\n  weddingAnniversary.AdvanceMonth();\n\
  \  Console.WriteLine($\"New value of weddingAnniversary is {weddingAnniversary}\"\
  );\n  Console.WriteLine($\"Value of copy is still {weddingAnniversaryCopy}\");\n\
  }\n```\n\n### 7. 在“调试”菜单上，点击“不调试启动”来生成并运行应用程序。验证控制台窗口是否显示以下消息：\n\n点击此处查看代码图片\n\n\
  ```\nJuly 4 2015\nValue of copy is July 4 2015\nNew value of weddingAnniversary\
  \ is August 4 2015\nValue of copy is still July 4 2015\n```\n\n第一条消息显示 `weddingAnniversary`\
  \ 变量的初始值（2015 年 7 月 4 日）。第二条消息显示 `weddingAnniversaryCopy` 变量的值。你可以看到它包含与 `weddingAnniversary`\
  \ 变量中持相同的日期（2015 年 7 月 4 日）。第三条消息显示了将月份更改为 8 月后 `weddingAnniversary` 变量的值（2015 年\
  \ 8 月 4 日）。最后一条语句显示了 `weddingAnniversaryCopy` 变量的值。注意，它没有从原始的 2015 年 7 月 4 日的值改变。\n\
  \n如果 `Date` 是一个类（class），那么创建副本将引用内存中与原始实例相同的对象。因此，更改原始实例中的月份也会更改通过副本引用的日期。你将在后续步骤中验证这一断言。\n\
