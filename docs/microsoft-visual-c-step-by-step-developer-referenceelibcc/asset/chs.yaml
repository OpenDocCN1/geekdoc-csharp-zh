  \ 注意\n\n`readonly` 字段适用于初始化后不再更改的数据。你可以在声明时使用初始化器或在构造函数为 `readonly` 字段赋值，但此后无法更改它。\n\
  \n***\n\n该类包含一对名为 `CardValue` 和 `CardSuit` 的方法来返回这些信息，并重写了 `ToString` 方法以返回牌的字符串表示。\n\
  \n***\n\n![图像](img/Image00005.jpg) 注意\n\n`CardValue` 和 `CardSuit` 方法实际上通过属性实现会更好，你将在第\
  \ 15 节 中学习如何这样做。\n\n***\n\n**9.** 在代码和文本编辑器中打开 `Pack.cs` 文件。\n\n\n\n\n此文件包含 `Pack`\
  \ 类，该类模型化了一个扑牌。在 `Pack` 类顶部有两个名为 `NumSuits` 和 `CardsPerSuit` 的公共常量（`public const\
  \ int`）字段。这两个字段指定了扑牌中花色的数量以及每种花色中牌的数量。私有变量 `cardPack` 是一个 `PlayingCard` 对象的二维数组。你将使用第一个维度来指定花色，使用第二个维度来指定该花色中牌的值。`randomCardSelector`\
  \ 变量基于 `Random` 类生成的随机数。你将使用 `randomCardSelector` 变量在将牌发给每个手牌之前帮助进行洗牌。\n\n点击此处查看代码图像\n\
  \n```csharp\nclass Pack\n{\n    public const int NumSuits = 4;\n    public const\
  \ int CardsPerSuit = 13;\n    private PlayingCard[,] cardPack;\n    private Random\
  \ randomCardSelector = new Random();\n    ...\n}\n```\n\n### 10. 找到 `Pack` 类的默认构造函数。目前该构造函数除了一个\
  \ `// TODO:` 注释外是空的。删除该注释，并添加此处**加粗**所示的语句，用每个维度适当的值实例化 `cardPack` 数组：\n\n点击此处查看代码图像\n\
  \n```csharp\npublic Pack()\n{\n    this.cardPack = new PlayingCard[NumSuits, CardsPerSuit];\n\
  }\n```\n\n### 11. 在 `Pack` 构造函数中添加以下**加粗**代码。这些语句将 `cardPack` 数组填充为整副排序好的牌。\n\n\
  点击此处查看代码图像\n\n```csharp\npublic Pack()\n{\n    this.cardPack = new PlayingCard[NumSuits,\
  \ CardsPerSuit];\n    for (Suit suit = Suit.Clubs; suit <= Suit.Spades; suit++)\n\
  \    {\n        for (Value value = Value.Two; value <= Value.Ace; value++)\n   \
  \     {\n            this.cardPack[(int)suit, (int)value] = new PlayingCard(suit,\
  \ value);\n        }\n    }\n}\n```\n\n外部 `for` 循环遍历 `Suit` 枚举列表，内部 `for` 循环遍历每种花色中可能具有的值。内部循环创建一个指定花色和值的\
  \ `PlayingCard` 对象，并将其添加到 `cardPack` 数组的相应位置。\n\n***\n\n![图像](img/Image00005.jpg)\
  \ 注意必须使用整数类型作为索引。`suit` 和 `value` 变量是枚举类型。然而，枚举是基于整数类型的，因此将它们强制转换为 `int` 是安全的。\n\
  \n***\n\n### 12. 找到 `Pack` 类中的 `DealCardPack` 方法。该方法的目的是从扑牌中抽取一张牌，从扑牌中移除该牌以防止再次被选取，然后将其作为方法的返回值。\n\
  \n该方法的第一个任务是随机选取花色。删除该方法中的注释和抛出 `NotImplementedException` 异常的语句，并用此处**加粗**所示的语句替换它们：\n\
  \n点击此处查看代码图像\n\n```csharp\npublic PlayingCard DealCardPack()\n{\n    Suit suit =\
  \ (Suit)randomCardSelector.Next(NumSuits);\n}\n```\n\n此语句使用 `randomCardSelector`\
  \ 随机数生成器的 `Next` 方法返回一个对应花色的随机数。`Next` 方法的参数指定了范围的上限；选取的值在 0 到该值减 1 之间。注意返回值是 `int`，因此在将其赋值给\
  \ `Suit` 变量之前必须进行转换。\n\n始终存在所选花色没有剩余牌的情况。你需要处理这种情况并在另一个花色。\n\n在随机选取花色的代码之后，添加后续**加粗**所示的\
  \ `while` 循环。\n\n此循环调用 `IsSuitEmpty` 方法判断扑牌中是否还有该花色的牌（你稍后将实现该方法的逻辑）。如果没有，它会随机选取另一个花色（可能会再次选取同一个花色）并再次检查。循环重复此过程直到找到至少一张牌的花色。\n\
  \n点击此处查看代码图像\n\n```csharp\npublic PlayingCard DealCardPack()\n{\n    Suit suit =\
  \ (Suit)randomCardSelector.Next(NumSuits);\n    while (this.IsSuitEmpty(suit))\n\
  \    {\n        suit = (Suit)randomCardSelector.Next(NumSuits);\n    }\n}\n```\n\
  \n### 14. 你现在已经随机选择了一个至少一张牌的花色。下一个任务是在该花色中随机选取一张牌。你可以使用随机数生成器选择一个牌值，但和之前一样，无法保证所选值的牌还没有发过。然而，你可以使用与相同的用法：调用\
  \ `IsCardAlreadyDealt` 方法（你稍后将检查并完成它）来判断牌是否已经发过，如果是，则选取另一张牌并重试，重复此过程直到找到牌。为了这一点，在\
  \ `DealCardPack` 方法的现有代码之后添加以下**加粗**所示的语句：\n\n点击此处查看代码图像\n\n```csharp\npublic PlayingCard\
  \ DealCardPack()\n{\n    ...\n    Value value = (Value)randomCardSelector.Next(CardsPerSuit);\n\
  \    while (this.IsCardAlreadyDealt(suit, value))\n    {\n        value = (Value)randomCardSelector.Next(CardsPerSuit);\n\
  \    }\n}\n```\n\n### 15. 你现在已经选取了一张未发过的随机牌。在 `DealCardPack` 方法末尾添加以下代码，返回该牌并将 `cardPack`\
  \ 数组中的相应元素设置为 `null`：\n\n点击此处查看代码图像\n\n```csharp\npublic PlayingCard DealCardPack()\n\
  {\n    ...\n    PlayingCard card = this.cardPack[(int)suit, (int)value];\n    this.cardPack[(int)suit,\
  \ (int)value] = null;\n    return card;\n}\n```\n\n### 16. 找到 `IsSuitEmpty` 方法。记住该方法的目的是接收一个\
  \ `Suit` 参数并返回一个布尔值，指示扑牌中是否还有该花色的牌。删除该方法中的注释和抛出 `NotImplementedException` 异常的语句，然后添加此处**加粗**所示的代码：\n\
  \n点击此处查看代码图像\n\n```csharp\nprivate bool IsSuitEmpty(Suit suit)\n{\n    bool result\
  \ = true;\n    for (Value value = Value.Two; value <= Value.Ace; value++)\n    {\n\
  \        if (!IsCardAlreadyDealt(suit, value))\n        {\n            result =\
  \ false;\n            break;\n        }\n    }\n    return result;\n}\n```\n\n此代码遍历可能的牌值，并使用\
  \ `IsCardAlreadyDealt` 方法（你将在下一步完成）判断 `cardPack` 数组中是否还有指定花色和值的牌。如果循环找到了牌，`result`\
  \ 变量的值设置为 `false`，`break` 语句终止循环。如果循环结束未找到牌，`result` 变量保持初始值 `true`。`result` 变量的值作为方法的返回值。\n\
