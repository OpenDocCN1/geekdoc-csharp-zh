  ### 创建泛型方法\n\n定义泛型类，你还可以创建泛型方法。\n\n\n\n\n通过泛型方法，你可以使用类型参数来指定参数的类型和返回类型，这种方法与定义泛型类时的方法类似。通过这种方式，你可以定义类型安全的泛型方法，并避免类型转换的开销（在某些情况下还有装箱开销）。泛型方法经常与泛型类结合使用；当你需要方法接收泛型类型作为参数，或者返回类型为泛型类型的方法时，就需要泛型方法。\n\
  \n你通过与创建泛型类时相同的类型参数语法来定义泛型方法。（你也可以指定约束）。例如，后续代码中的泛型方法 `Swap<T>` 会交换其参数中的值。由于此功能无论所交换的数据类型如何都很有用，因此将其定义为泛型方法是有帮助的：\n\
  \n点击此处查看代码图像\n\n```cs\nstatic void Swap<T>(ref T first, ref T second)\n{\n    T\
  \ temp = first;\n    first = second;\n    second = temp;\n}\n```\n\n你通过为其类型参数指定适当的类型来调用该方法。以下示例显示了如何调用\
  \ `Swap<T>` 方法交换两个 `int` 和两个 `string`：\n\n点击此处查看代码图像\n\n```cs\nint a = 1, b = 2;\n\
  Swap<int>(ref a, ref b);\n\n...\n\nstring s1 = \" Hello\" , s2 = \" World\" ;\n\
  Swap<string>(ref s1, ref s2);\n```\n\n***\n\n![Image](img/Image00005.jpg) 注意\n\n\
  正如使用不同的类型参数实例化泛型类会导致编译器生成不同的类型一样，`Swap<T>` 方法的每次不同使用会导致编译器生成该方法的不同版本。`Swap<int>`\
  \ 和 `Swap<string>` 不是同一个方法——这两个方法恰好都是从同一个泛型模板中生成的，因此它们表现出相同的行为，尽管处理的是不同的类型。\n\n\
  ***\n\n## 定义构建二叉树的泛型方法\n\n在在上一个练习中，你创建了一个用于实现二叉树的泛型类。`Tree<TItem>` 类提供了 `Insert`\
