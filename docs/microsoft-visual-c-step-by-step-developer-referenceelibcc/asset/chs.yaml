  \n# 27. 返回 Studio 并停止调试。\n\n### 总结\n\n在本章中，你学习了如何使用数组来处理数据。你看到了如何声明和初始化数组、访问数组中的数据、将数组作为参数以及从方法返回数组。你还学习了如何创建多维数组。\n\
  \n## 第 11 章 了解参数数组\n\n### 快速参考\n\n完成本章后，你将能够：\n\n- 使用 `params` 关键字编写可以接受任意数量参数的方法。\n\
  - 使用 `params` 关键字结合 `object` 类型编写可以接受任意数量任意类型参数的方法。\n- 解释接受参数数组的方法与接受可选参数的方法之间的区别。\n\
  \n### 重载——回顾\n\n*重载*（Overloading）是在相同作用域内声明两个或多个同名方法的专业术语。重载方法对于那些希望对不同类型的参数执行相同操作的情况非常有用。Microsoft\
  \ Visual C# 中重载的经典示例是 `Console.WriteLine` 方法。该方法被多次重载，以便你可以传递任何基本类型参数。以下代码示例说明了\
  \ `WriteLine` 方法在 `Console` 类中定义的某些方式：\n\n\n\n\n\n```cs\nclass Console\n{\n    public\
  \ static void WriteLine(Int32 value)\n    public static void WriteLine(Double value)\n\
  \    public static void WriteLine(Decimal value)\n    public static void WriteLine(Boolean\
  \ value)\n    public static void WriteLine(String value)\n    ...\n}\n```\n\n***\n\
  \n![Image](img/Image00005.jpg) 注意\n\n`WriteLine` 方法的文档使用了 `System` 命名空间中定义的结构类型作为其参数，而不是这些类型的\
  \ C# 别名。例如，打印 `int` 值的重载版本实际上接收一个 `Int32` 作为参数。请参阅第 9 章，“使用枚举和结构创建值类型”，以获取结构类型列表及其与这些类型\
  \ C# 别名的映射关系。\n\n***\n\n虽然重载非常有用，但它并不能涵盖所有情况。特别是，重载无法轻松处理参数类型没有变化但参数数量变化的情况。例如，如果你想向控制台写入许多值怎么办？你是否必须为\
  \ `Console.WriteLine` 提供可以接收各种组合的两个参数的版本、其他可以接收三个参数的版本，以此此类推？这很快就会变得繁琐。而且这些重载方法的大量重复难道不会让你担心吗？确实应该担心。幸运的是，有一种方法可以编写一个接受变数量参数的方法（即*变长方法*）：你可以使用通过\
  \ `params` 关键字声明的参数数组。\n\n要理解 `params` 数组如何解决这个问题，首先理解普通数组的用途和缺点将有所帮助。\n\n### 使用数组参数\n\
  \n假设你想写一个方法来确定作为参数传递的一组值中的最小值。一种方法是使用数组。例如，为了找到几个 `int` 值中的最小值，你可以写一个名为 `Min` 的静态方法，它带有一个参数，表示\
  \ `int` 值的数组：\n\n点击此处查看代码图像\n\n```cs\nclass Util\n{\n    public static int Min(int[]\
  \ paramList)\n    {\n        // 验证调用者是否至少提供了一个参数。\n        // 如果没有，则抛出 ArgumentException\
  \ 异常——无法\n        // 在空列表中找到最小值。\n        if (paramList == null || paramList.Length\
  \ == 0)\n        {\n            throw new ArgumentException(\"Util.Min: not enough\
  \ arguments\");\n        }\n        // 将参数列表中找到的当前最小值设为第一个元素\n        int currentMin\
  \ = paramList[0];\n        // 遍历参数列表，查找是否有任何一个\n        // 小于 currentMin 中存储的值\n\
  \        foreach (int i in paramList)\n        {\n            // 如果循环找到比 currentMin\
  \ 中存储\n            // 值更小的项，则将 currentMin 设置为此值\n            if (i < currentMin)\n\
  \            {\n                currentMin = i;\n            }\n        }\n    \
  \    // 循环结束时，currentMin 保存了参数列表中\n        // 最小的值，因此返回该值。\n        return currentMin;\n\
  \    }\n}\n```\n\n***\n\n![Image](img/Image00005.jpg) 注意\n\n`ArgumentException`\
  \ 类专门设计用于在提供的参数不满足方法要求时由方法抛出。\n\n***\n\n要使用 `Min` 方法找到名为 `first` 和 `second` 的两个\
  \ `int` 变量的最小值，你可以这样写：\n\n```cs\nint[] array = new int[2];\narray[0] = first;\n\
  array[1] = second;\nint min = Util.Min(array);\n```\n\n要使用 `Min` 方法找到三个 `int` 变量（命名为\
  \ `first`、`second` 和 `third`）的最小值，你可以这样写：\n\n```cs\nint[] array = new int[3];\n\
  array[0] = first;\narray[1] = second;\narray[2] = third;\nint min = Util.Min(array);\n\
  ```\n\n你可以看到，这种解决方案避免了大量重载的需求，但它付出了代价：你必须编写额外的代码来填充你传递的数组。当然，如果你愿意，可以使用匿名数组，如下所示：\n\
  \n点击此处查看代码图像\n\n```cs\nint min = Util.Min(new int[] {first, second, third});\n```\n\
  \n然而，点在于你仍然需要创建并填充一个数组，而且语法可能会变得有点困惑。解决方案是使用 `params` 数组作为 `Min` 方法的参数，让编译器为你编写这部分代码。\n\
  \n### 声明 `params` 数组\n\n使用 `params` 数组，你可以向方法传递变数量的参数。在定义方法参数时，通过使用 `params` 关键字作为数组参数修饰符来指示\
  \ `params` 数组。例如，这里是再次 `Min`——这次它的数组参数被声明为 `params` 数组：\n\n点击此处查看代码图像\n\n```cs\n\
  class Util\n{\n    public static int Min(params int[] paramList)\n    {\n      \
  \  // 代码与之前完全相同\n    }\n}\n```\n\n`params` 关键字对 `Min` 方法的作用是，允许你使用任何数量的参数调用该方法，而无需担心创建数组。例如，要找到两个整数值的最小值，你只需要写如下代码：\n\
  \n点击此处查看代码图像\n\n```cs\nint min = Util.Min(first, second);\n```\n\n编译器将此调用翻译为类似下面的代码：\n\
  \n```cs\nint[] array = new int[2];\narray[0] = first;\narray[1] = second;\nint min\
  \ = Util.Min(array);\n```\n\n要找到三个整数值的最小值，你编写下面的代码，它也会被编译器转换为相应的代码：\n\n点击此处查看代码图像\n\
  \n```cs\nint[] array = new int[3];\narray[0] = first;\narray[1] = second;\narray[2]\
  \ = third;\nint min = Util.Min(array);\n```\n\n你可以看到这种解决方案避免了大量重载的需求，但它付出了代价：你必须编写额外的代码来填充传递的数组。`params`\
  \ 关键字允许你使用任意数量的参数调用此方法。编译器计算参数的数量，创建一个该大小的数组，填充该数组，然后调用方法。\n\n***\n\n![Image](img/Image00005.jpg)\
  \ 注意\n\n如果你是 C 或 C++ 程序员，可能认为 `params` 是 `stdarg.h` 中安全的等效物。Java 也有与 `params` 关键字工作方式类似的变长参数机制。\n\
  \n***\n\n关于 `params` 数组有几点值得注意：\n\n![Image](img/Image00001.jpg) 你不能对多维数组使用 `params`\
  \ 关键字。下面的代码将无法编译：\n\n点击此处查看代码图像\n\n```cs\npublic static int Min(params int table)\n\
  ```\n\n![Image](img/Image00001.jpg) 你不能仅根据 `params` 关键字重载方法。`params` 关键字不构成方法签名的一部分，如下例所示。在这里，编译器在调用这些方法时将无法区分它们：\n\
  \n点击此处查看代码图像\n\n```cs\npublic static int Min(int[] paramList)\npublic static int\
  \ Min(params int[] paramList)\n```\n\n![Image](img/Image00001.jpg) 你不允许在 `params`\
  \ 数组上指定 `ref` 或 `out` 修饰符，如下例所示：\n\n点击此处查看代码图像\n\n```cs\npublic static int Min(ref\
  \ params int[] paramList)\npublic static int Min(out params[] paramList)\n```\n\n\
  ![Image](img/Image00001.jpg) `params` 数组必须是最后一个参数。（这意味着每个方法只能有一个 `params` 数组。）考虑这个用例：\n\
  \n点击此处查看代码图像\n\n```cs\npublic static int Min(params int[] paramList, int i)\n```\n\
  \n![Image](img/Image00001.jpg) 非-*params* 方法总是优先于 `params` 方法。这意味着你仍然可以为常见情况创建方法的重载版本，如下例所示：\n\
  \n\n\n\n\n点击此处查看代码图像\n\n```csharp\npublic static int Min(int leftHandSide, int rightHandSide)\n\
  \n...\n\npublic static int Min(params int[] paramList)\n\n...\n```\n\n`Min` 方法的第一个版本在使用两个\
  \ `int` 参数调用它时使用。第二个版本在提供任何其他数量的 `int` 参数时使用。这包括在调用该方法时不传递任何参数的情况。添加一个非 `params`\
  \ 数组方法可能是一种实用的优化技术，因为编译器不需要创建和填充这么多数组。\n\n### 使用 `params object[]`\n\n`int` 类型的参数数组非常有用。通过它，你可以在方法调用中传递任意数量的\
  \ `int` 参数。然而，如果不仅参数的数量会变化，而且参数的类型也会发生变化呢？C# 也有解决这一问题的方法。该技术基于以下事实：`object` 是所有类的根类型，并且编译器可以通过使用“装箱”（boxing）来生成代码，将值类型（非类对象）转换为对象，正如第\
  \ 8 章，“理解值和引用](#text00014.html_ch08)”中所描述的那样。你可以使用 `object` 类型的参数数组声明一个接受任意数量 `object`\
  \ 参数的方法，允许传递的参数是任何类型。看这个示例：\n\n点击此处查看代码图像\n\n```csharp\nclass Black\n{\n    public\
  \ static void Hole(params object[] paramList)\n\n    ...\n}\n```\n\n我将此方法命名为 `Black.Hole`，因为没有任何参数可以逃离它：\n\
  \n![Image](img/Image00001.jpg) 你可以完全不给方法传递参数，在这种情况下，编译器将传递一个长度为 0 的对象数组：\n\n点击此处查看代码图像\n\
  \n```csharp\nBlack.Hole();\n// 转换为 Black.Hole(new object[0]);\n```\n\n![Image](img/Image00001.jpg)\
  \ 你可以通过通过传递 `null` 作为参数来调用 `Black.Hole` 方法。数组是一种引用类型，因此你允许使用 `null` 初始化数组：\n\n```csharp\n\
  Black.Hole(null);\n```\n\n![Image](img/Image00001.jpg) 你可以向 `Black.Hole` 方法传递一个实际数组。换说，你可以手动创建编译器正常生成的数组：\n\
  \n点击此处查看代码图像\n\n```csharp\nobject[] array = new object[2];\narray[0] = \"forty two\"\
  ;\narray[1] = 42;\nBlack.Hole(array);\n```\n\n![Image](img/Image00001.jpg) 你可以向\
  \ `Black.Hole` 方法传递不同类型的参数，这些参数将自动封装在 `object` 数组内部：\n\n点击此处查看代码图像\n\n```csharp\n\
  Black.Hole(\"forty two\", 42);\n// 转换为 Black.Hole(new object[]{\"forty two\", 42});\n\
  ```\n\n### `Console.WriteLine` 方法\n\n`Console` 类包含许多 `WriteLine` 方法的重载。其中一个重载看起来如下所示：\n\
  \n点击此处查看代码图像\n\n```csharp\npublic static void WriteLine(string format, params object[]\
  \ arg);\n```\n\n尽管字符串插值几乎已经让此版本的 `WriteLine` 方法变得多余，但此重载在 C# 语言之前的版本中被频繁使用。此重载允许\
  \ `WriteLine` 方法支持包含占位符的格式字符串，每个占位符可以在运行时被替换为列表中指定的任意类型的变量（占位符 `{i}` 被替换为后续后续列表中第\
  \ `i` 个变量）。以下是调用此方法的示例（变量 `fname` 和 `lname` 是 `string`，`mi` 是 `char`，`age` 是 `int`）：\n\
  \n点击此处查看代码图像\n\n```csharp\nConsole.WriteLine(\"Forename:{0}, Middle Initial:{1},\
  \ Last name:{2}\", fname, mi, age);\n```\n\n编译器将此调用解析为以下内容：\n\n点击此处查看代码图像\n\n```csharp\n\
  Console.WriteLine(\"Forename:{0}, Middle Initial:{1}, Last name:{2}\", new object[]{fname,\
  \ mi, age});\n```\n\n### 使用 `params` 数组\n\n在下面的练习中，你将实现并测试一个名为 `Sum` 的静态方法。该方法的目的是计算传递给它的任意数量\
  \ `int` 参数之和，并将结果作为 `int` 返回。你将通过编写 `Sum` 以接收一个 `params int[]` 参数来实现这一点。你将对 `params`\
  \ 参数进行两个检查，以确保 `Sum` 方法完全健壮。然后，你将使用各种不同的参数调用 `Sum` 方法对其进行测试。\n\n#### 编写一个 `params`\
  \ 数组\n\n1. 编写一个 `params` 数组方法。你将通过编写 `Sum` 以接收一个 `params int[]` 参数来实现这一点。你将对 `params`\
  \ 参数进行两个检查，以确保 `Sum` 方法完全健壮。然后，你将使用各种不同的参数调用 `Sum` 方法对其进行测试。\n\n2. 在下面的练习中，你将实现并测试一个名为\
  \ `Sum` 的静态方法。该方法的目的是计算传递给它的任意数量 `int` 参数之和，并将结果作为 `int` 返回。你将通过编写 `Sum` 以接收一个 `params\
  \ int[]` 参数来实现这一点。你将对 `params` 参数进行两个检查，以确保 `Sum` 方法完全健壮。然后，你将使用各种不同的参数调用 `Sum`\
  \ 方法对其进行测试。\n\n*(注：原文此处似乎存在内容重复或错乱，翻译已根据逻辑结构进行对应处理)*\n\n\n\n\n\n点击此处查看代码图像\n\n```csharp\n\
  public static int Sum(params int[] paramList)\n{\n    ...\n    int sumTotal = 0;\n\
  \    foreach (int i in paramList)\n    {\n        sumTotal += i;\n    }\n    return\
  \ sumTotal;\n}\n```\n\n10. 在“生成”（Build）菜单上，点击“生成解决方案”（Build Solution），然后确认您的解决方案无错误生成。\n\
