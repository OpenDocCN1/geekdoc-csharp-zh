  \ 创建实体模型，并可以使用该模型连接到 SQL Server 数据库。该数据库可以在本地运行，也可以在云端运行。你还看到了如何创建一个 REST Web 服务，UWP\
  \ 应用可以使用它通过实体模型查询和更新数据库中的数据，并且学习了如何将调用网络服务的代码集成到 `ViewModel` 中。\n\n你现在已经完成了书中的所有练习。我希望你已经彻底熟悉了\
  \ C# 语言，并理解如何使用 Visual Studio 2015 为 Windows 10 构建专业应用程序。然而，故事并没有此结束。你已经越过了第一道门槛，但最好的\
  \ C# 程序员通过持续的经验学习，而你只有通过构建 C# 应用才能获得这种经验。在此过程中，你将发现使用 C# 语言的新方法，以及 Visual Studio\
  \ 2015 中许多我在书中没有空间涵盖的功能。此外，请记住 C# 是一门不断演变的语言。回到 2001 年我写这本书的第一版时，C# 引入了构建使用 Microsoft\
  \ .NET Framework 1.0 的应用程序所需的语法和语义。2003 年，Visual Studio 和 .NET Framework 1.1 增加了一些增强，然后在\
  \ 2005 年，C# 2.0 问世并支持泛型和 .NET Framework 2.0。C# 3.0 增加了许多功能，例如匿名类型、Lambda 表达式，以及最重要的\
  \ LINQ。C# 4.0 进一步扩展了语言，支持命名参数、可选参数、逆变和协变接口以及与动态语言的集成。C# 5.0 增加了通过 `async` 关键字和 `await`\
  \ 操作符对异步处理的全支持。C# 6.0 为语言提供了更进一步的微调，例如表达式体方法、字符串插值、`nameof` 运算符、异常过滤器等许多。\n\n在 C#\
  \ 编程语言演化的同时，Windows 操作系统自本书的第一版以来发生了巨大的变化。可以说，从 Windows 8 及以后引发的变化是这一时期最激进的，熟悉 Windows\
  \ 早期版本的开发者现在面临着令人兴奋的新挑战，即为 Windows 10 提供的现代以触摸为中心的移动平台构建应用。Visual Studio 2015 和\
  \ C# 将对帮助你应对这些挑战起到不可重要的作用。\n\n下一版本的 C# 和 Visual Studio 将带来什么？请关注后续！\n\n### 快速参考\n\
