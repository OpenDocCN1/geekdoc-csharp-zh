  \n***\n\n**13.** 在 `Delegates` 项目中，在代码和文本窗口显示 `MainPage.xaml.cs` 文件，并检查该文件中的私有字段和\
  \ `MainPage` 构造函数。重要的元素如下：\n\n```cs\nprivate Auditor auditor = null;\nprivate Shipper\
  \ shipper = null;\n\npublic MainPage()\n{\n    ...\n    this.auditor = new Auditor();\n\
  \    this.shipper = new Shipper();\n}\n```\n\n`auditor` 和 `shipper` 字段包含 `Auditor`\
  \ 和 `Shipper` 类类的引用，构造函数实例化这些对象。\n\n**14.** 找到 `CheckoutButtonClicked` 方法。当用户点击结账下单时会运行此方法。前几行如下：\n\
  \n```cs\nprivate void CheckoutButtonClicked(object sender, RoutedEventArgs e)\n\
