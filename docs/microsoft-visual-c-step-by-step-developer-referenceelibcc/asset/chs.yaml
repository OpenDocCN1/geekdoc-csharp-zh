  \ requested.*\n\n### Understanding extension methods\n\nInheritance is a powerful\
  \ feature that makes it possible for you to extend the functionality of a class\
  \ by creating a new class that derives from it. However, sometimes using inheritance\
  \ is not the most appropriate mechanism for adding new behaviors, especially if\
  \ you need to quickly extend a type without affecting existing code.\n\nFor example,\
  \ suppose you want to add a new feature to the `int` type, such as a method named\
  \ `Negate` that returns the negative value. Since `int` is a value type, you cannot\
  \ inherit from it. But you can use extension methods to achieve this.\n\nOne way\
  \ to do this is to define a new static class and a static method within it, where\
  \ the first parameter is prefixed with the `this` keyword to specify the type being\
  \ extended.\n\n```csharp\nstatic class Extensions\n{\n    public static int Negate(this\
  \ int i)\n    {\n        return -i;\n    }\n}\n```\n\nOnce defined, you can call\
  \ the extension method as if it were a member of the type:\n\n```csharp\nint number\
  \ = 5;\nint result = number.Negate(); // result is -5\n```\n\n\n\n\n\n本练习中使用的算法在该值范围之外无法可靠地工作。如果\
  \ `baseToConvertTo` 的值超出此范围，请抛出一个带有适当消息的 `ArgumentException` 异常。\n\n`ConvertToBase`\
  \ 方法应该如下：\n\n点击此处查看代码图像\n\n```cs\npublic static int ConvertToBase(this int i, int\
  \ baseToConvertTo)\n{\n    if (baseToConvertTo < 2 || baseToConvertTo > 10)\n  \
  \  {\n        throw new ArgumentException(\"Value cannot be converted to base \"\
  \ +\n        baseToConvertTo.ToString());\n    }\n}\n```\n\n### 5. 在 `ConvertToBase`\
  \ 方法中，在抛出 `ArgumentException` 异常的语句之后添加以下**加粗**显示的语句。\n\n这段代码实现了一种著名的算法，可以将数字从 10\
  \ 进制转换为不同的数制。（第 5 章，“使用复合赋值和迭代语句，”展示了该算法的一个版本，用于将十进制数转换为八进制。）\n\n点击此处查看代码图像\n\n\
  ```cs\npublic static int ConvertToBase(this int i, int baseToConvertTo)\n{\n   \
  \ ...\n    int result = 0;\n    int iterations = 0;\n    do\n    {\n        int\
  \ nextDigit = i % baseToConvertTo;\n        i /= baseToConvertTo;\n        result\
  \ += nextDigit * (int)Math.Pow(10, iterations);\n        iterations++;\n    }\n\
  \    while (i != 0);\n    return result;\n}\n```\n\n### 6. 在“代码和文本编辑器”窗口中显示 `Program.cs`\
  \ 文件。\n\n### 7. 在文件顶部的 `using System;` 指令之后添加以下 `using` 指令：\n\n```cs\nusing Extensions;\n\
  ```\n\n此语句将包含 `Util` 类的命名空间引入作用域。如果不执行此项任务，`ConvertToBase` 扩展方法在 `Program.cs` 文件中将不可见。\n\
  \n### 8. 在 `Program` 类的 `doWork` 方法中，替换 `// TODO:` 注释并添加以下**加粗**显示的语句：\n\n点击此处查看代码图像\n\
  \n```cs\nstatic void doWork()\n{\n    int x = 591;\n    for (int i = 2; i <= 10;\
  \ i++)\n    {\n        Console.WriteLine($\"{x} in base {i} is {x.ConvertToBase(i)}\"\
  );\n    }\n}\n```\n\n这段代码创建了一个名为 `x` 的 `int` 变量并将其设置为值 `591`。（你可以选择任何需要的整数值。）然后代码使用循环打印\
  \ 2 到 10 之间所有数制下的值 591。注意，当你在 `Console.WriteLine` 语句中的 `x` 之后输入点 (`.`) 时，`ConvertToBase`\
  \ 会作为扩展方法出现。\n\n![Image](img/Image00100.jpg)\n\n### 9. 在“调试”菜单上，点击“不调试启动”。确认程序在控制台中显示了消息，显示不同数制下的值\
