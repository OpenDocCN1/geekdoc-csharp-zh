  \ 关闭表单并返回 Visual Studio 2015。\n\n### 总结\n\n在本章中，你学习了如何使用索引器为类中的数据提供类似数组的访问。你学习了如何创建索引器，它可以接收索引并使用\
  \ `get` 访问器定义的逻辑返回相应的值，并且看到了如何使用带索引的 `set` 访问器为索引器填充值。\n\n![Image](img/Image00001.jpg)\
