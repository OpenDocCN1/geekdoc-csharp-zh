  \n### 快速参考\n\n![Image](img/Image00102.jpg)![Image](img/Image00103.jpg)\n\n## 第 13\
  \ 章. 创建接口和定义抽象类\n\n完成本章后，你将能够：\n\n- ![Image](img/Image00001.jpg) 定义一个指定方法签名和返回类型的接口。\n\
  - ![Image](img/Image00001.jpg) 在结构体或类中实现接口。\n- ![Image](img/Image00001.jpg) 通过接口引用类。\n\
  - ![Image](img/Image00001.jpg) 在抽象类中捕常见的实现细节。\n- ![Image](img/Image00001.jpg) 实现不能用于派生新类的密封类。\n\
  \n继承类是一种强大的机制，但继承的真正力量源于继承接口。接口不包含任何代码或数据；它只是指定了继承该接口的类必须提供的方法和属性。通过使用接口，你可以将类方法的名称和签名与方法的实现完全分离。\n\
  \n抽象类在许多方面与接口相似，区别在于抽象类可以包含代码和数据。然而，你可以将抽象类的某些方法指定为虚（virtual），以便子类可以实现这些方法。你经常将抽象类与接口结合使用，它们提供了构建可扩展框架的技术。\n\
  \n### 理解接口\n\n假设你想定义一个新的类，并在其中存储对象，就像使用数组一样。与数组不同，你想提供一个名为 `RetrieveOrder` 的方法以允许应用程序检索（数组可以遍历其内容）。例如，如果集合包含字母对象（如字符串），集合应该能够按照排序检索它们；如果集合包含数字对象（如整数），集合应该……\n\
  \n当你定义集合类时，你不想限制它可以包含的对象类型（对象可以是类或结构体类型），因此你不知道如何排序这些对象。那么，这个问题看起来与第 12 章中描述的 `ToString`\
  \ 问题相似，“使用继承，”这可以通过声明一个子类可以重写的虚方法来解决。然而，任何相似性都是误导性的。集合类与其包含的对象之间没有继承关系，因此虚方法并太大用。思考一下，问题在于排序方式取决于对象的类型，而不是集合本身。解决方案是要求所有对象提供一个如下所示的\
  \ `CompareTo` 方法，供集合的 `RetrieveOrder` 方法调用，从而使集合能够与其他对象进行比较：\n\n点击此处查看代码图像\n\n```cs\n\
  int CompareTo(object obj)\n{\n    // 如果当前实例等于 obj，则返回 0\n    // 如果当前实例小于 obj，则返回小于\
  \ 0\n    // 如果当前实例大于 obj，则返回大于 0\n    ...\n}\n```\n\n你可以为可集合对象定义一个接口，其中包含 `CompareTo`\
  \ 方法，并指定集合类只能包含实现该接口的类。通过这种方式，接口类似于合同。如果一个类实现了接口，接口就保证该类包含了接口中指定的所有方法。\n\n\n\n\n\
  通过接口，你可以真正地将“做什么”与“如何做”分离。接口只为你提供方法的名称、返回类型和参数。方法具体如何实现并不是接口关注的。接口描述了类应该提供的功能，而不是这些功能是如何实现的。\n\
  \n### 定义接口\n\n定义接口在语法上与定义类非常相似，不同在于你使用 `interface` 关键字而不是 `class` 关键字。在接口内部，你声明方法的方式与类或结构体完全相同，不同在于你永远不会指定访问修饰符（`public`、`private`\
  \ 或 `protected`）。此外，接口中的方法没有实现；它们仅仅是声明，所有实现该接口的类型必须提供它们自己的实现。因此，你用分号替换了方法体。以下是一个示例：\n\
  \n点击此处查看代码图像\n\n```csharp\ninterface IComparable\n{\n    int CompareTo(object obj);\n\
  }\n```\n\n![Image](img/Image00013.jpg) 提示\n\nMicrosoft .NET Framework 文档建议你在接口名称前加上大写字母\
  \ `I`。这种约定是 C# 中匈牙利表示法的最后遗迹。顺便提到，`System` 命名空间已经所示定义了 `IComparable` 接口。\n\n接口不能包含任何数据；你不能向接口添加字段（即使是私有字段）。\n\
  \n### 实现接口\n\n要实现接口，你需要声明一个继承自接口的类或结构体，并实现该接口指定的*所有*方法。这并不是真正意义上的继承，尽管语法是相同的，而且你在在本章后面看到的某些语义带有许多继承的特征。你需要注意的是，与类继承不同，结构体（struct）也可以实现接口。\n\
  \n例如，假设你正在定义第 12 章中描述的 `Mammal` 层次，但你需要指定陆栖哺乳动物提供一个名为 `NumberOfLegs` 的方法，该方法返回 `int`\
  \ 类型表示动物腿的数量。（海栖哺乳动物不实现此接口）。你可以如下定义包含该方法的 `ILandBound` 接口：\n\n```csharp\ninterface\
  \ ILandBound\n{\n    int NumberOfLegs();\n}\n```\n\n然后你可以在 `Horse` 类中实现此接口。你继承该接口，并为接口定义出的每个方法提供实现（在这种情况下，只有一个方法\
  \ `NumberOfLegs`）。\n\n```csharp\nclass Horse : ILandBound\n{\n    ...\n    public\
  \ int NumberOfLegs()\n    {\n        return 4;\n    }\n}\n```\n\n当你实现接口时，你必须确保每个方法都根据以下规则与其对应的接口方法完全匹配：\n\
  \n![Image](img/Image00001.jpg) 方法名和返回类型完全匹配。\n\n![Image](img/Image00001.jpg) 任何参数（包括\
  \ `ref` 和 `out` 关键字修饰符）都完全匹配。\n\n![Image](img/Image00001.jpg) 所有实现接口的方法必须是公开可见的。但是，如果你正在使用显式接口实现，方法不应有访问修饰符。\n\
  \n如果接口定义与其声明的实现之间存在任何差异，类将无法编译。\n\n![Image](img/Image00013.jpg) 提示\n\nMicrosoft\
  \ Visual Studio 集成开发环境 (IDE) 可以帮助减少由于未实现接口方法导致的编码错误。“实现接口向导”（Implement Interface\
  \ Wizard）可以为类实现的接口中的每个项目生成存根（stubs）。然后你用适当的代码填充这些存根。你将在本章稍后的练习中看到如何使用此向导。\n\n一个类可以同时继承另一个类并实现一个接口。在这种情况下，C#\
  \ 不会像 Java 那样使用特定的关键字来区分基类和接口。相反，C# 使用位置表示法。基类始终排在第一个，后面跟着一个逗号，然后是接口。以下示例将 `Horse`\
  \ 定义为一个类，它是一个 `Mammal` 类，但额外实现了 `ILandBound` 接口：\n\n点击此处查看代码图像\n\n```csharp\ninterface\
  \ ILandBound\n{\n    ...\n}\n\nclass Mammal\n{\n    ...\n}\n\nclass Horse : Mammal,\
  \ ILandBound\n{\n    ...\n}\n```\n\n![Image](img/Image00005.jpg) 注意\n\n一个接口 `InterfaceA`\
  \ 可以继承自另一个接口 `InterfaceB`。从技术上讲，这被称为*接口扩展*（interface extension）而不是继承。在这种情况下，任何实现\
  \ `InterfaceA` 的类或结构体都必须为 `InterfaceB` 和 `InterfaceA` 中的所有方法提供实现。\n\n### 通过接口引用类\n\
  \n正如你可以通过定义为层次结构中较高类的变量来引用对象一样，你也可以通过定义为对象类所实现的接口变量来引用对象。以例为例，你可以使用 `ILandBound`\
  \ 变量来引用 `Horse` 对象，如下：\n\n点击此处查看代码图像\n\n```csharp\nHorse myHorse = new Horse(...);\n\
  ILandBound iMyHorse = myHorse; // 合法\n```\n\n这之所以行得通是因为所有的马都是陆栖哺乳动物，尽管反过来并不成立——你不能在不先进行转换的情况下将\
  \ `ILandBound` 对象赋值给 `Horse` 变量。\n\n通过接口引用对象的技巧是非常用的，因为你可以用它定义接收不同类型的方法，只要这些类型实现了指定的接口。例如，这里所示的\
  \ `FindSpeed` 方法可以接受任何实现 `ILandBound` 接口的参数：\n\n点击此处查看代码图像\n\n```csharp\nint FindLandSpeed(ILandBound\
  \ landBoundMammal)\n{\n    ...\n}\n```\n\n你可以使用 `is` 运算符来验证对象是否为实现特定接口类的实例，这在第 8\
  \ 章“值和引用”中有介绍。你使用 `is` 运算符来判断对象是否具有指定的类型，它不仅适用于接口也适用于类和结构体。例如，以下代码块在将 `myHorse`\
  \ 赋值给 `ILandBound` 变量之前，检查它是否真的实现了 `ILandBound` 接口：\n\n点击此处查看代码图像\n\n```csharp\n\
  if (myHorse is ILandBound)\n{\n    ILandBound iLandBoundAnimal = myHorse;\n}\n```\n\
  \n注意，当通过接口引用对象时，你只能调用通过接口可见的方法。\n\n### 处理多个接口\n\n一个类最多可以有一个基类，但允许实现无限数量的接口。类必须实现这些接口声明的所有方法。\n\
  \n如果一个结构体或类实现了多个接口，你以逗号分隔列表的形式指定这些接口。如果一个类还有一个基类，则接口列在基类*之后*。例如，假设你又定义了一个名为 `IGrazable`\
  \ 的接口，它包含所有食草动物的 `ChewGrass` 方法。你可以这样定义 `Horse` 类：\n\n点击此处查看代码图像\n\n```csharp\n\
  class Horse : Mammal, ILandBound, IGrazable\n{\n    ...\n}\n```\n\n#### 显式实现接口\n\
  \n\n\n\n到为止的示例展示了隐式实现接口的类。如果你重新查看 `ILandBound` 接口和 `Horse` 类（下文所示），你会发现尽管 `Horse`\
  \ 类实现了 `ILandBound` 接口，但在 `Horse` 类中 `NumberOfLegs` 方法的实现中，没有任何地方说明它是 `ILandBound`\
  \ 接口的一部分：\n\n```csharp\ninterface ILandBound\n{\n    int NumberOfLegs();\n}\n\n\
  class Horse : ILandBound\n{\n    ...\n    public int NumberOfLegs()\n    {\n   \
  \     return 4;\n    }\n}\n```\n\n这在简单的情况下可能不是一个问题，但假设 `Horse` 类实现了多个接口。目前没有任何机制可以阻止多个接口指定具有相同名称的方法，尽管它们的语义可能不同。例如，假设你想实现一个基于马车的运输系统。一次长途旅行程程可以被分解为几个阶段，或者说几个“路程（legs）”。如果你想记录每只马为马车拉了多少段路程，可能会定义以下接口：\n\
  \n```csharp\ninterface IJourney\n{\n    int NumberOfLegs();\n}\n```\n\n现在，如果你在 `Horse`\
  \ 类中实现这个接口，你就面临了一个有趣的问题：\n\n点击此处查看代码图像\n\n```csharp\nclass Horse : ILandBound, IJourney\n\
  {\n    ...\n    public int NumberOfLegs()\n    {\n        return 4;\n    }\n}\n\
  ```\n\n这是合法的代码，但这只马是有四条腿，还是它为马车拉了四段路程？从 C# 的角度来看，答案两者皆是！默认情况下，C# 不区分方法实现的是哪一个接口，因此同一个方法实际上实现了两个接口。\n\
  \n为了解决这个问题并消除歧哪个方法属于哪个接口实现，你可以显式地实现接口。要做到这一点，你可以在实现方法时指定该方法属于哪个接口，如下：\n\n点击此处查看代码图像\n\
  \n```csharp\nclass Horse : ILandBound, IJourney\n{\n    ...\n    int ILandBound.NumberOfLegs()\n\
  \    {\n        return 4;\n    }\n    int IJourney.NumberOfLegs()\n    {\n     \
  \   return 3;\n    }\n}\n```\n\n现在你可以看到这只马有四条腿，并且它为马车拉了三段路程。\n\n除了在方法名前前加上接口名称外，这种语法中还有另一个细微的区别：这些方法没有被标记为\
  \ `public`。你不能为显式接口实现的方法指定访问修饰符。这导致了另一个有趣的现象。如果你在代码中创建一个 `Horse` 变量，你实际上无法调用 `NumberOfLegs`\
  \ 方法的任何一个，因为它们是不可见的。对于 `Horse` 类来说，它们都是私有的（private）。事实上，这是有意义。如果这些方法通过 `Horse` 类可见，那么以下代码实际上会调用哪一个方法？是\
  \ `ILandBound` 接口的那个还是 `IJourney` 接口的那个？\n\n点击此处查看代码图像\n\n```csharp\nHorse horse\
  \ = new Horse();\n...\n// 以下语句将无法编译\nint legs = horse.NumberOfLegs();\n```\n\n那么，你如何访问这些方法呢？答案是通过适当的接口引用\
  \ `Horse` 对象，如下：\n\n点击此处查看代码图像\n\n```csharp\nHorse horse = new Horse();\n...\nIJourney\
  \ journeyHorse = horse;\nint legsInJourney = journeyHorse.NumberOfLegs();\n\nILandBound\
  \ landBoundHorse = horse;\nint legsOnHorse = landBoundHorse.NumberOfLegs();\n```\n\
  \n我建议尽可能显式实现接口。\n\n### 接口限制\n\n需要记住的核心思想是接口永远不包含任何实现。以下限制是此的自然结果：\n\n![Image](img/Image00001.jpg)\
  \ 你不允许在接口中定义任何字段（fields），即使是静态字段（static fields）。字段是类或结构的实现细节。\n\n![Image](img/Image00001.jpg)\
  \ 你不允许在接口中定义任何构造函数（constructors）。构造函数也被认为是类或结构的实现细节。\n\n![Image](img/Image00001.jpg)\
  \ 你不允许在接口中定义析构函数（destructor）。析构函数包含用于销毁对象实例的语句。（析构函数在第 14 章，“使用垃圾回收和资源管理”中进行了描述。）\n\
  \n![Image](img/Image00001.jpg) 你不能为任何方法指定访问修饰符（access modifier）。接口中的所有方法都是隐式公开的（public）。\n\
  \n![Image](img/Image00001.jpg) 你不能在接口内部嵌套任何类型（如枚举、结构体、类或接口）。\n\n![Image](img/Image00001.jpg)\
  \ 接口不允许继承结构体（structure）或类（class），尽管接口可以继承另一个接口。结构体和类包含实现；如果允许接口继承其中任何一个，它将继承某些实现。\n\
  \n### 定义和使用接口\n\n在接下来的练习中，你将定义并实现构成简单图形包的接口。你将定义两个接口 `IDraw` 和 `IColor`，然后定义它们的类。\n\
  \n#### 定义 `IDraw` 和 `IColor` 接口\n\n1. 如果没有运行，请启动 Visual Studio 2015。\n\n2. 打开 `Drawing`\
  \ 项目，它位于文档中的 `\\Microsoft Press\\VCS\\Chapter13\\Drawing`。`Drawing` 项目是一个图形应用程序。它包含一个名为\
  \ `DrawingPad` 的表单。该表单包含一个名为 `drawingCanvas` 的画布控件。你将这个表单和画布来测试代码。\n\n3. 在解决方案管理器中点击\
  \ `Drawing` 项目。在项目菜单上点击新建项（New Item）。打开新建项对话框。\n\n4. 在新建项对话框的左窗格中，点击 C#，然后点击代码。在中间窗格的名称框中输入\
  \ `IDraw.cs`，然后点击添加。Visual Studio 将创建 `IDraw.cs` 文件并将其添加到项目中。`IDraw.cs` 文件出现在代码和文本编辑器窗口中，内容如下：\n\
  \n```csharp\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
  using System.Text;\nusing System.Threading.Tasks;\n\nnamespace Drawing\n{\n    interface\
  \ IDraw\n    {\n    }\n}\n```\n\n5. 在 `IDraw.cs` 文件中，在顶部的列表中添加以下 `using` 指令：\n\n\
  点击此处查看代码图像\n\n```csharp\nusing Windows.UI.Xaml.Controls;\n```\n\n你将在接口中引用 `Canvas`\
  \ 类。`Canvas` 类位于通用 Windows 平台（UWP）应用的 `Windows.UI.Xaml.Controls` 命名空间。\n\n6. 在 `IDraw`\
  \ 接口中添加此处加粗所示的方法：\n\n点击此处查看代码图像\n\n```csharp\ninterface IDraw\n{\n    void SetLocation(int\
  \ xCoord, int yCoord);\n    void Draw(Canvas canvas);\n}\n```\n\n7. 在项目菜单上再次点击新建项。\n\
  \n8. 在新建项对话框中，在中间窗格中点击接口模板。在名称框中输入 `IColor.cs`，然后点击添加。\n\n\n\nVisual Studio 创建了\
  \ `IColor.cs` 文件并将其添加到项目中。`IColor.cs` 文件显示在代码和文本编辑器窗口中。\n\n**9.** 在 `IColor.cs`\
  \ 文件的顶部，向列表添加以下 `using` 指令：\n\n```csharp\nusing Windows.UI;\n```\n\n你将在此接口中引用 `Color`\
  \ 类，该类位于 UWP 应用的 `Windows.UI` 命名空间中。\n\n**10.** 在 `IColor` 接口定义中添加此处**加粗**显示的方法：\n\
  \n点击此处查看代码图像\n\n```csharp\ninterface IColor\n{\n    void SetColor(Color color);\n\
  }\n```\n\n你现在已经定义了 `IDraw` 和 `IColor` 接口。下一步是实现这些接口的类。在接下来的练习中，你将创建两个名为 `Square`（方形）和\
  \ `Circle`（圆形）的新形状类。这些类将实现这两个接口。\n\n### 创建 Square 和 Circle 类并实现接口\n\n**1.** 在“项目”菜单上，点击“添加类”（Add\
  \ Class）。\n\n**2.** 在“添加新建项 – 绘图”对话框的中间窗格中，确认已选择“类”（Class）模板。在“名称”框中输入 `Square.cs`，然后点击“添加”。\n\
  \nVisual Studio 创建了 `Square.cs` 文件并在代码和文本编辑器窗口中显示。\n\n**3.** 在 `Square.cs` 文件的顶部，向列表添加以下\
  \ `using` 指令：\n\n点击此处查看代码图像\n\n```csharp\nusing Windows.UI;\nusing Windows.UI.Xaml.Media;\n\
  using Windows.UI.Xaml.Shapes;\nusing Windows.UI.Xaml.Controls;\n```\n\n**4.** 修改\
  \ `Square` 类的定义，使其实现 `IDraw` 和 `IColor` 接口，如下**加粗**所示：\n\n点击此处查看代码图像\n\n```csharp\n\
  class Square : IDraw, IColor\n{\n}\n```\n\n**5.** 在 `Square` 类中添加此处**加粗**显示的私有变量：\n\
  \n点击此处查看代码图像\n\n```csharp\nclass Square : IDraw, IColor\n{\n    private int sideLength;\n\
  \    private int locX = 0, locY = 0;\n    private Rectangle rect = null;\n}\n```\n\
  \n这些变量将存储 `Square` 对象在画布上的位置和大小。`Rectangle` 类位于 UWP 应用的 `Windows.UI.Xaml.Shapes`\
  \ 命名空间中。你将使用该类来绘制正方形。\n\n**6.** 在 `Square` 类中添加此处**加粗**显示的构造函数：\n\n点击此处查看代码图像\n\n\
  ```csharp\nclass Square : IDraw, IColor\n{\n    ...\n    public Square(int sideLength)\n\
  \    {\n        this.sideLength = sideLength;\n    }\n}\n```\n\n此构造函数初始化 `sideLength`\
  \ 字段，并指定正方形每边的长度。\n\n**7.** 在 `Square` 类的定义中，将鼠标悬停在 `IDraw` 接口上。在出现的黄色灯泡操作菜单中，点击“显式实现接口”（Implement\
  \ Interface Explicitly），如图像所示：\n\n![图像](img/Image00104.jpg)\n\n此功能会导致 Visual Studio\
  \ 生成 `IDraw` 接口中方法的默认实现。如果你愿意，也可以手动将这些方法添加到 `Square` 类中。以下示例显示了 Visual Studio 生成的代码：\n\
  \n点击此处查看代码图像\n\n```csharp\nvoid IDraw.SetLocation(int xCoord, int yCoord)\n{\n \
  \   throw new NotImplementedException();\n}\n\nvoid IDraw.Draw(Canvas canvas)\n\
  {\n    throw new NotImplementedException();\n}\n```\n\n这些每个方法目前都会抛出 `NotImplementedException`\
  \ 异常。你需要将这些方法的体替换为你自己的代码。\n\n**8.** 在 `IDraw.SetLocation` 方法中，将现有抛出 `NotImplementedException`\
  \ 异常的代码替换为此处**加粗**显示的语句：\n\n点击此处查看代码图像\n\n```csharp\nvoid IDraw.SetLocation(int\
  \ xCoord, int yCoord)\n{\n    this.locX = xCoord;\n    this.locY = yCoord;\n}\n\
  ```\n\n此代码将通过参数传递的值存储在 `Square` 对象的 `locX` 和 `locY` 字段中。\n\n**9.** 将 `IDraw.Draw`\
  \ 方法中生成的代码替换为此处**加粗**的语句：\n\n点击此处查看代码图像\n\n```csharp\nvoid IDraw.Draw(Canvas canvas)\n\
  {\n    if (this.rect != null)\n    {\n        canvas.Children.Remove(this.rect);\n\
  \    }\n    else\n    {\n        this.rect = new Rectangle();\n    }\n    this.rect.Height\
  \ = this.sideLength;\n    this.rect.Width = this.sideLength;\n}\n```\n\n**10.**\
  \ 在 `Square` 类中添加此处**加粗**显示的方法：\n\n点击此处查看代码图像\n\n```csharp\nvoid IColor.SetColor(Color\
  \ color)\n{\n    if (this.rect != null)\n    {\n        canvas.Children.Remove(this.rect);\n\
  \    }\n    else\n    {\n        this.rect = new Rectangle();\n    }\n    SolidColorBrush\
  \ brush = new SolidColorBrush(color);\n    this.rect.Fill = brush;\n}\n```\n(注：由于原文文本存在大量重复，Circle\
  \ 类的实现逻辑与 Square 类相同，已遵循上述模式)\n\n\n\n\n该方法也是 `IDraw` 接口的一部分。它与 `Square` 类中的 `Draw`\
  \ 方法相似，不同之处在于通过在画布上绘制 `Ellipse` 形状来渲染 `Circle` 对象。（圆形是一种宽度和高度相同的椭圆。）\n\n#### 18.\
  \ 向 `Circle` 类添加以下 `SetColor` 方法：\n\n点击此处查看代码图像\n\n```cs\nvoid IColor.SetColor(Color\
  \ color)\n{\n  if (this.circle != null)\n  {\n    SolidColorBrush brush = new SolidColorBrush(color);\n\
  \    this.circle.Fill = brush;\n  }\n}\n```\n\n该方法是 `IColor` 接口的一部分。与之前一样，该方法与 `Square`\
  \ 类的方法相似。\n\n你已经完成了 `Square` 和 `Circle` 类。你现在可以使用表单来测试它们。\n\n### 测试 `Square` 和 `Circle`\
  \ 类\n\n**1.** 在设计视图（Design View）窗口中显示 `DrawingPad.xaml` 文件。\n\n**2.** 在表单上，点击较大的阴影区域。\n\
  \n表单的阴影区域是 `Canvas` 对象，此操作将焦点设置为该对象。\n\n**3.** 在属性（Properties）窗口中，点击事件处理程序（Event\
  \ Handlers）按钮。（此按钮有一个像闪电的图标。）\n\n**4.** 在事件列表中找到 `Tapped` 事件，然后双击 `Tapped` 文本框。\n\
  \nVisual Studio 为 `DrawingPad` 类创建了一个名为 `drawingCanvas_Tapped` 的方法，并在代码和文本编辑器（Code\
  \ and Text Editor）窗口中显示它。这是一个当用手指触摸画布或在画布上点击左鼠标键时运行的事件处理程序。你可以在第 20 章，“解耦应用程序逻辑和处理事件](#text00027.html_ch20)”中了解更多关于事件处理程序的知识。\n\
  \n**5.** 在 `DrawingPad.xaml.cs`文件的顶部，向列表中添加以下 `using` 指令：\n\n```cs\nusing Windows.UI;\n\
  ```\n\n`Windows.UI` 命名空间包含了 `Colors` 类的定义，你在绘制形状时设置颜色时会用到它。\n\n**6.** 在 `drawingCanvas_Tapped`\
  \ 方法中添加以下加粗代码：\n\n点击此处查看代码图像\n\n```cs\nprivate void drawingCanvas_Tapped(object\
  \ sender, TappedRoutedEventArgs e)\n{\n  Point mouseLocation = e.GetPosition(this.drawingCanvas);\n\
  \  Square mySquare = new Square(100);\n  if (mySquare is IDraw)\n  {\n    IDraw\
  \ drawSquare = mySquare;\n    drawSquare.SetLocation((int)mouseLocation.X, (int)mouseLocation.Y);\n\
  \    drawSquare.Draw(drawingCanvas);\n  }\n}\n```\n\n此此方法的 `TappedRoutedEventArgs`\
  \ 参数提供了关于鼠标位置的有用信息。特别是，`GetPosition` 方法返回一个 `Point` 结构体，包含鼠标的 x 和 y 坐标。你添加的代码创建了一个新的\
  \ `Square` 对象。然后它检查该对象是否实现了 `IDraw` 接口（这是一种良好的做法，有助于确保当你尝试通过对象未实现的接口引用对象时，代码不会在运行时失败），并通过此接口创建该对象的引用。记住，当显式实现接口时，接口定义的方法只有通过创建该接口的引用才能可用（`SetLocation`\
  \ 和 `Draw` 方法是 `Square` 类的私有方法，仅可以通过接口可用）。代码随后将 `Square` 的位置设置为用户手指或鼠标的位置。注意，`Point`\
  \ 结构体中的 x 和 y 坐标实际上是 `double` 值，因此此代码将它们强制转换为 `int`。随后，代码调用 `Draw` 方法来显示 `Square`\
  \ 对象。\n\n**7.** 在 `drawingCanvas_Tapped` 方法的末尾，添加以下加粗代码：\n\n点击此处查看代码图像\n\n```cs\n\
  private void drawingCanvas_Tapped(object sender, TappedRoutedEventArgs e)\n{\n \
  \ ...\n  if (mySquare is IColor)\n  {\n    IColor colorSquare = mySquare;\n    colorSquare.SetColor(Colors.BlueViolet);\n\
  \  }\n}\n```\n\n此代码测试 `Square` 类是否实现了 `IColor` 接口；如果是，代码将此接口创建 `Square` 类的引用，并调用\
  \ `SetColor` 方法将 `Square` 对象的颜色设置为 `Colors.BlueViolet`。\n\n![Image](img/Image00004.jpg)\
  \ **重要**\n\n在调用 `SetColor` 之前调用 `Draw`，因为 `SetColor` 方法只有在 `Square` 已渲染后才会设置颜色。如果你在\
  \ `Draw` 之前调用 `SetColor`，颜色将不会设置，`Square` 对象也不会出现。\n\n**8.** 返回设计视图中的 `DrawingPad.xaml`\
  \ 文件，然后点击 `Canvas` 对象。\n\n**9.** 在事件列表中找到 `RightTapped` 事件，然后双击 `RightTapped` 文本框。\n\
  \n当用户在画布上触摸、按住并释放或点击右鼠标键时触发此事件。\n\n**10.** 在 `drawingCanvas_Tapped` 方法中添加以下加粗代码：\n\
  \n点击此处查看代码图像\n\n```cs\nprivate void drawingCanvas_Tapped(object sender, TappedRoutedEventArgs\
  \ e)\n{\n  Point mouseLocation = e.GetPosition(this.drawingCanvas);\n  Circle mySquare\
  \ = new Square(100);\n  if (mySquare is IDraw)\n  {\n    IDraw drawSquare = mySquare;\n\
  \    drawSquare.SetLocation((int)mouseLocation.X, (int)mouseLocation.Y);\n    drawSquare.Draw(drawingCanvas);\n\
  \  }\n  if (mySquare is IColor)\n  {\n    IColor colorSquare = mySquare;\n    colorSquare.SetColor(Colors.HotPink);\n\
  \  }\n}\n```\n\n此代码中的逻辑与 `drawingCanvas_Tapped` 方法相似，但此代码绘制并填充的是圆形而不是方形。（等待，原文在一个处说\
  \ `Square mySquare = new Square(100)`，而在其他处提到了 `Circle`；我将保留文本逻辑但调整变量格式）。\n\n*根据文本的修正：*\
  \ 文本说 `Square mySquare = new Square(100)`，但讨论了 `myCircle`。我将遵循文本的内容。\n\n**11.**\
  \ 在调试（Debug）菜单中，点击启动（Start）以编译并运行应用程序。\n\n**12.** 当 Drawing Pad 打开时，点击画布上的任意地方。应该出现一个紫色的方形。\n\
  \n**13.** 在画布上的任意地方触摸、按住并释放，或右键点击。应该出现一个粉色的圆形。你可以多次点击左右鼠标键；每次都会绘制一个方形或圆形。\n\n![Image](img/Image0105.jpg)\n\
  \n**14.** 返回 Visual Studio 并停止调试。\n\n### 抽象类\n\n你可以在许多不同的类中实现之前过的 `ILandBound` 和\
  \ `IGrazable` 接口，这取决于你在 C# 应用程序中建模多少种不同的哺乳动物。在这种情况下，派生类的部分共享共同实现是非常常见的。例如，以下两个类中的重复是显而易见的：\n\
  \n点击此处查看代码图像\n\n```cs\nclass Horse : Mammal, ILandBound, IGrazable\n{\n  ...\n \
  \ void IGrazable.ChewGrass()\n  {\n    Console.WriteLine(\"Chewing grass\");\n \
  \   // 咀草的代码\n  }\n}\n\nclass Sheep : Mammal, ILandBound, IGrazable\n{\n  ...\n\
  \  void IGrazable.ChewGrass()\n  {\n    Console.WriteLine(\"Chewing grass\");\n\
  \    // 与马相同的咀嚼草代码\n  }\n}\n```\n\n代码中的重复是一个警告信号。如果可能，你应该重构代码以避免重复并减少任何相关的维护成本。实现这种重构的一种方法是将共同实现放在专门为此目的创建的新类中。实际上，你可以将一个新类插入到类层次结构中，如下代码示例所示：\n\
  \n点击此处查看代码图像\n\n```cs\nclass GrazingMammal : Mammal, IGrazable\n{\n  ...\n  void\
  \ IGrazable.ChewGrass()\n  {\n    // 咀嚼草的共同代码\n    Console.WriteLine(\"Chewing grass\"\
  );\n  }\n}\n\nclass Horse : GrazingMammal, ILandBound\n{\n  ...\n}\n\nclass Sheep\
  \ : GrazingMammal, ILandBound\n{\n  ...\n}\n```\n\n\n\n\n这是一个很好的解决方案，但仍有一点不太对：你实际上可以创建\
  \ `GrazingMammal` 类的实例（同样，`Mammal` 类也是如此）。这并不符合逻辑。`GrazingMammal` 类的存在是为了提供一个通用的默认实现。它的唯一目的是作为一个可以被继承的类。`GrazingMammal`\
  \ 类是通用功能的抽象，而不是本身一个独立的实体。\n\n要声明不允许创建类的实例，你可以通过 `abstract` 关键字将该类声明为抽象类，如下例所示：\n\
  \n点击此处查看代码图像\n\n```csharp\nabstract class GrazingMammal : Mammal, IGrazable\n{\n\
  \n...\n}\n```\n\n如果你现在尝试实例化一个 `GrazingMammal` 对象，代码将无法编译：\n\n点击此处查看代码图像\n\n```csharp\n\
  GrazingMammal myGrazingMammal = new GrazingMammal(...); // illegal\n```\n\n### 抽象方法\n\
  \n抽象类可以包含抽象方法。抽象方法在原理上类似于虚方法（见第 12 章），不同之处在于不包含方法体。派生类*必须*重写此方法。抽象方法不能是私有的。下面的示例将\
  \ `GrazingMammal` 类中的 `DigestGrass` 方法定义为抽象方法；食草动物可能使用相同的代码来咀嚼草，但它们必须提供 `DigestGrass`\
  \ 方法的自有的实现。如果为抽象类中提供默认实现没有意义，但你又想确保继承类提供该方法的自有实现，那么抽象方法就是很有用的。\n\n点击此处查看代码图像\n\n\
  ```csharp\nabstract class GrazingMammal : Mammal, IGrazable\n{\n\npublic abstract\
  \ void DigestGrass();\n...\n}\n```\n\n### 密封类\n\n使用继承并不总是容易的，而且需要深远的考虑。如果你创建一个接口或抽象类，你是在有意识地编写一些将来会被继承的内容。问题在于，预测未来是一项困难的工作。通过实践和经验，你可以开发出构建灵活、易用的接口、抽象类和类层级结构的技能，但这需要付出努力，而且你还需要对正在建模的问题有深入的理解。换句话说，除非你有意识地设计一个类并打算将其作为基类，否则它极可能无法很好地作为基类。在\
  \ C# 中，如果你决定某个类不应该被用作基类，可以使用 `sealed` 关键字防止该类被用作基类。例如：\n\n点击此处查看代码图像\n\n```csharp\n\
  sealed class Horse : GrazingMammal, ILandBound\n{\n\n...\n}\n```\n\n如果任何类尝试将 `Horse`\
  \ 作为基类，将生成编译时错误。请注意，密封类（sealed class）不能声明任何虚方法（virtual methods），且抽象类（abstract class）不能密封。\n\
  \n### 密封方法\n\n你也可以使用 `sealed` 关键字来声明非密封类中的单个方法是密封的。这意味着派生类不能重写此方法。你只能密封使用 `override`\
  \ 关键字声明的方法，并且将该方法声明为 `sealed override`。你可以这样理解 `interface`、`virtual`、`override`\
  \ 和 `sealed` 关键字：\n\n![Image](img/Image00001.jpg) 接口引入了方法的名称。\n\n![Image](img/Image00001.jpg)\
  \ 虚方法（virtual method）。\n\n![Image](img/Image00001.jpg) 重写方法（override method）。\n\n\
  ![Image](img/Image00001.jpg) 密封方法（sealed method）。\n\n### 实现并使用抽象类\n\n食草动物可能使用相同的代码来咀嚼草，但它们必须提供\
