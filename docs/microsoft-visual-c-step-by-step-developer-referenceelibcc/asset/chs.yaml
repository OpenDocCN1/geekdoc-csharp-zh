  \ `before`（之前）的侧。\n\n* * *\n\n你并不限于使用基本数据类型作为数组元素。你还可以创建结构体、枚举和类的数组。例如，你可以像这样创建一个\
  \ `Date` 结构体数组：\n\n```\nDate[] dates;\n```\n\n* * *\n\n![Image](img/Image00013.jpg)\
  \ 提示\n\n给数组变量赋予复数名称通常很有用，例如 `places`（每个元素都是 `Place`）、`people`（每个元素都是 `Person`）或\
  \ `times`（每个元素都是 `Time`）。\n\n* * *\n\n#### 创建数组\n\n数组是项的无序序列。数组中的所有项具有相同的类型，这与结构体或类中的字段不同，字段可以具有不同的类型。数组中的项存储在连续的内存块中，并通过使用索引访问，而结构体或类中的字段是通过名称访问的。\n\
  \n（注：由于原文中存在大量重复内容，此处根据逻辑翻译了后续的差异性部分）\n\n你通过指定元素类型的名称，后跟一对方括号，然后是变量名来声明数组变量。方括号表示该变量是一个数组。例如，要声明一个名为\
  \ `pins` 的 `int` 变量数组（用于存储一组个人识别码），你可以写如下代码：\n\n点击此处查看代码图像\n\n```\nint[] pins; //\
  \ 个人识别码\n```\n\n（此处省略原文中完全重复的段落，直接进入“填充和使用数组”部分的差异翻译）\n\n### 填充和使用数组\n\n当你创建一个数组实例时，数组的所有元素都初始化为取决于类型的默认值。例如，数值默认为\
  \ `0`，对象初始化为 `null`，`DateTime` 值初始化为 `\"01/01/001 00:00:00\"`，字符串初始化为 `null`。你可以修改这种行为并用特定值初始化数组元素。你可以通过在大括号之间提供逗号分隔的值列表来实现。例如，要将\
  \ `pins` 初始化为值为 `9`、`3`、`7` 和 `2` 的 `int` 数组，你写道：\n\n```c\npins = new int[4];\n\
  ```\n\n大括号之间的值不必须是常量；它们可以在运行时计算，如下示例所示，该示例为 `pins` 数组填充了四个随机数：\n\n```csharp\nRandom\
  \ r = new Random();\nint[] pins = new int[4]{ r.Next() % 10, r.Next() % 10, r.Next()\
  \ % 10, r.Next() % 10 };\n```\n\n* * *\n\n![Image](img/Image00005.jpg) 释\n\n`System.Random`\
  \ 类是一个伪随机数生成器。`Next` 方法默认返回 `0` 到 `Int32.MaxValue` 之间的非负随机整数。`Next` 方法经过重载，其他版本允许你指定范围的最小值和最大值。`Random`\
  \ 类的默认构造函数使用随时间的种子值为随机数生成器种子，这减少了类重复随机序列的可能性。使用重载的构造函数，你可以提供自己的种子值。这样，你就可以为测试生成可重复的随机序列。\n\
  \n要创建一个数组，你使用 `new` 关键字后跟元素类型，然后是数组的大小（在方括号内）。数组也会初始化其元素，只有当你创建数组变量时，才在堆上分配内存（取决于类型）。例如：\n\
  \n```csharp\nint[] pins = new int[4];\n```\n\n要创建一个数组 实例，你使用 `new` 关键字后跟元素类型，然后是数组的大小（在方括号内）。数组也会初始化其元素，只有当你创建数组变量时，才在堆上分配内存（取决于类型）。例如：\n\
  \n```csharp\nint[] pins = new int[4];\n```\n\n（注：原文文本存在严重的逻辑重复，翻译时已根据“不要重复输出原文”的原则进行了去重处理。）\n\
  \n\n\n\n\n```csharp\nint[] pins = new int[4]{ 9, 3, 7 }; // 编译错误\n\nint[] pins =\
  \ new int[4]{ 9, 3, 7, 2 }; // 正确\n```\n\n当你以这种方式初始化数组变量时，实际上可以省略 `new` 表达式和数组的大小。在这种情况下，编译器会根据初始化器的数量来计算大小，并生成创建数组的代码，如下例所示：\n\
  \n```csharp\nint[] pins = { 9, 3, 7, 2 };\n```\n\n如果你创建一个结构体（structures）或对象的数组，可以通过调用结构体或类的构造函数来初始化数组中的每个结构体，如下所示：\n\
  \n点击此处查看代码图片\n\n```csharp\nTime[] schedule = { new Time(12,30), new Time(5,30) };\n\
  ```\n\n### 创建隐式类型数组\n\n在声明数组时，元素类型必须与你尝试存储在数组中的元素类型匹配。例如，如果你像前面的示例那样将 `pins` 声明为\
  \ `int` 数组，则你不能在该数组中存储 `double`、`string`、`struct` 或任何不是 `int` 的内容。如果你在声明数组时指定初始化器列表，可以由\
  \ C# 编译器为你推断数组中元素的实际类型，如下：\n\n点击此处查看代码图片\n\n```csharp\nvar names = new[]{\"John\"\
  , \"Diana\", \"James\", \"Francesca\"};\n```\n\n在这个示例中，C# 编译器确定 `names` 变量是一个字符串数组。值得注意的是此声明中的几个语法细节。首先，你省略了类型中的方括号；示例中的\
  \ `names` 变量简单地声明为 `var`，而不是 `var[]`。其次，你必须在初始化列表之前指定 `new` 运算符和方括号。\n\n如果你使用这种语法，必须确保所有初始化器具有相同类型。下一个示例会导致编译错误“未找到隐式类型数组的最优类型”（No\
  \ best type found for implicitly-typed array）：\n\n点击此处查看代码图片\n\n```csharp\nvar bad\
  \ = new[]{\"John\", \"Diana\", 99, 100};\n```\n\n然而，在某些情况下，如果这样做合理，编译器会将元素转换为不同的类型。在接下来的代码中，`numbers`\
  \ 数组是一个 `double` 数组，因为常量 `3.5` 和 `99.999` 都是 `double`，且 C# 编译器可以将整数值 `1` 和 `2` 转换为\
  \ `double` 值：\n\n点击此处查看代码图片\n\n```csharp\nvar numbers = new[]{1, 2, 3.5, 99.999};\n\
  ```\n\n通常，最好避免混合类型，不要寄希望于编译器为你进行转换。\n\n隐式类型数组在你处理匿名类型时最有用，正如第 7 章 和创建和管理类和对象 所述。以下代码创建了一个匿名对象数组，每个对象包含两个指定家庭姓名和年龄的字段：\n\
  \n点击此处查看代码图片\n\n```csharp\nvar names = new[] { new { Name = \"John\", Age = 50 },\n\
  new { Name = \"Diana\", Age = 50 },\nnew { Name = \"James\", Age = 23 },\nnew {\
  \ Name = \"Francesca\", Age = 21 } };\n```\n\n匿名类型中的字段对于数组的每个元素必须是相同的。\n\n### 访问单个数组元素\n\
  \n要访问单个数组元素，你必须提供一个指示你所需元素的索引。数组索引从 0 开始；因此，数组的第一个元素位于索引 0 而不是索引 1。索引值 `1` 访问第二个元素。例如，你可以使用以下代码将\
  \ `pins` 数组的元素 `2`（第三个元素）的内容读取到 `int` 变量中：\n\n```csharp\nint myPin;\nmyPin = pins[2];\n\
  ```\n\n同样，你可以通过为索引元素赋值值来更改数组的内容：\n\n```csharp\nmyPin = 6;\npins[2] = myPin;\n```\n\
  \n所有数组元素的访问都经过边界检查。如果你指定的索引小于 0 或大于或等于数组的长度，编译器将抛出 `IndexOutOfRangeException` 异常，如例所示：\n\
  \n点击此处查看代码图片\n\n```csharp\ntry\n{\n    int[] pins = { 9, 3, 7, 2 };\n    Console.WriteLine(pins[4]);\
  \ // 错误，第 4 个也是最后一个元素位于索引 3\n}\ncatch (IndexOutOfRangeException ex)\n{\n}\n```\n\
  \n### 遍历数组\n\n在 .NET Framework 中，所有数组实际上都是 `System.Array` 类的实例，该类定义了数组的功能。接下来的代码使用\
  \ `for` 循环遍历 `pins` 数组并打印每个元素：\n\n点击此处查看代码图片\n\n```csharp\nint[] pins = { 9, 3,\
  \ 7, 2 };\nfor (int index = 0; index < pins.Length; index++)\n{\n    Console.WriteLine(pins[index]);\n\
  }\n```\n\n`foreach` 语句是遍历数组的首选方式；它直接表达了代码意图，并消除了 `for` 循环的模板代码。然而，在某些情况下，你会发现必须用回\
  \ `for` 语句：\n\n- `foreach` 语句总是遍历整个数组。如果你只想遍历数组的已知部分（例如前半部分）或跳过某些元素（例如每三个元素），使用\
  \ `for` 语句更简单。\n- `foreach` 语句总是从索引 0 遍历到 `Length - 1`。如果你想反向遍历或按其他顺序遍历，使用 `for`\
  \ 语句更简单。\n- 如果循环体需要元素的索引而不仅仅是值，你必须使用 `for` 语句。\n- 如果你需要修改数组元素，你必须使用 `for` 语句。这是因为\
  \ `foreach` 语句的迭代变量是每个元素的只读副本。\n\n**注意**：`Length` 是一个属性而不是方法，你可以在第 7 章和创建和管理类和对象](#text00013.html_ch07)中学习这些属性。\n\
  \n程序员经常忘记数组从 0 开始，且最后一个元素是 `Length - 1`。C# 提供了 `foreach` 语句，通过它你可以担心这些问题。例如，上面的\
  \ `for` 语句重写为等效的 `foreach` 语句：\n\n```csharp\nint[] pins = { 9, 3, 7, 2 };\nforeach\
  \ (int pin in pins)\n{\n    Console.WriteLine(pin);\n}\n```\n\n#### 将数组作为方法的参数和返回值\n\
  \n\n\n\n你可以定义接受数组作为参数的方法，或将其作为返回值返回。\n\n将数组作为参数传递的语法与声明数组的语法相似。例如，下面的代码示例定义了一个名为\
  \ `ProcessData` 的方法，它接受一个整数数组作为参数。该方法的体遍历数组并对每个元素执行某些未指定的处理：\n\n点击此处查看代码图像\n\n```c\n\
  public void ProcessData(int[] data)\n{\n    foreach (int i in data)\n    {\n   \
  \     ...\n    }\n}\n```\n\n需要记住，数组是引用对象，因此如果你在像 `ProcessData` 这样的方法内部修改了作为参数传递的数组的内容，该修改对于对该数组的所有引用都是可见的，包括作为参数传递的原始参数。\n\
  \n要从方法返回数组，你需要指定数组的类型作为返回类型。在方法内部，你创建并填充数组。下面的示例提示用户输入数组的大小，然后输入每个元素的数据。方法创建的数组将作为返回值返回：\n\
  \n点击此处查看代码图像\n\n```csharp\npublic int[] ReadData()\n{\n    Console.WriteLine(\"\
  How many elements?\");\n    string reply = Console.ReadLine();\n    int numElements\
  \ = int.Parse(reply);\n    int[] data = new int[numElements];\n    for (int i =\
  \ 0; i < numElements; i++)\n    {\n        Console.WriteLine($\"Enter data for element\
  \ {i}\");\n        reply = Console.ReadLine();\n        int elementData = int.Parse(reply);\n\
  \        data[i] = elementData;\n    }\n    return data;\n}\n```\n\n你可以像这样调用 `ReadData`\
  \ 方法：\n\n```csharp\nint[] data = ReadData();\n```\n\n***\n\n# 数组参数与 `Main` 方法\n\n\
  你可能已经注意到，应用程序的 `Main` 方法接受一个字符串数组作为参数：\n\n点击此处查看代码图像\n\n```csharp\nstatic void Main(string[]\
  \ args)\n{\n    ...\n}\n```\n\n记住，`Main` 方法在你的程序开始运行时被调用；它是应用程序的入口点。如果你从命令行启动应用程序，可以指定额外的命令行参数。Windows\
  \ 操作系统会将这些参数传递给公共语言运行时 (CLR)，CLR 再将它们作为参数传递给 `Main` 方法。这种机制为你提供了一种简单的方法，允许用户在应用程序启动运行时提供信息，而不是交互式地提示用户。如果你想构建可以从自动化脚本运行的工具，这种方法非常有用。\n\
  \n下面的示例来自一个名为 `MyFileUtil` 的工具应用程序，该程序处理文件。它期望命令行上有一组文件名，并调用 `ProcessFile` 方法（未显示）来处理指定的每个文件：\n\
  \n点击此处查看代码图像\n\n```csharp\nstatic void Main(string[] args)\n{\n    foreach (string\
  \ filename in args)\n    {\n        ProcessFile(filename);\n    }\n}\n```\n\n用户可以这样从命令行运行\
  \ `MyFileUtil` 应用程序：\n\n`MyFileUtil C:\\Temp\\TestData.dat C:\\Users\\John\\Documents\\\
  MyDoc.txt`\n\n每个命令行参数都用空格分隔。由 `MyFileUtil` 应用程序来验证这些参数是否有效。\n\n***\n\n### 复制数组\n\
  \n数组是引用类型（记住数组是 `System.Array` 类的一个实例）。数组变量包含一个指向数组实例的引用。这意味着当你复制一个数组变量时，你实际上得到了两个指向同一个数组实例的引用，如下面的示例所示：\n\
  \n点击此处查看代码图像\n\n```csharp\nint[] pins = { 9, 3, 7, 2 };\nint[] alias = pins; //\
  \ alias 和 pins 指向同一个数组实例\n```\n\n在这个示例中，如果你修改了 `pins[1]` 处的值，该更改通过读取 `alias[1]`\
  \ 也是可见的。\n\n如果你想为数组变量所引用的数组实例（堆上的数据）制作一个副本，你必须做两件事。首先，你创建一个与要复制的数组类型相同且长度相同的新数组实例。其次，你将数据从原始数组逐个元素复制到新数组，如下示例所示：\n\
  \n点击此处查看代码图像\n\n```csharp\nint[] pins = { 9, 3, 7, 2 };\nint[] copy = new int[pins.Length];\n\
  for (int i = 0; i < pins.Length; i++)\n{\n    copy[i] = pins[i];\n}\n```\n\n注意，此代码使用原始数组的\
  \ `Length` 属性来指定新数组的大小。\n\n复制数组实际上是许多应用程序的共同需求——以至于 `System.Array` 类提供了一些实用的方法，可以使用它们来复制数组。例如，`CopyTo`\
  \ 方法将一个数组的内容复制到另一个数组。下面的示例从指定的索引开始将 `pins` 数组复制到 `copy`：\n\n点击此处查看代码图像\n\n```csharp\n\
  int[] pins = { 9, 3, 7, 2 };\nint[] copy = new int[pins.Length];\npins.CopyTo(copy,\
  \ 0);\n```\n\n另一种复制方法是使用静态方法 `Array.Copy`。在调用 `Copy` 之前，必须初始化目标数组：\n\n点击此处查看代码图像\n\
  \n```csharp\nint[] pins = { 9, 3, 7, 2 };\nint[] copy = new int[pins.Length];\n\
  Array.Copy(pins, copy, pins.Length);\n```\n\n确保为 `Copy` 方法提供有效的长度值。如果你提供负值，方法将抛出\
  \ `ArgumentOutOfRangeException`。如果你指定的值大于元素数量，方法将抛出 `ArgumentException`。\n\n还有另一种替代方案是使用实例方法\
  \ `Clone`。你可以调用此方法一次性创建并复制整个数组：\n\n点击此处查看代码图像\n\n```csharp\nint[] pins = { 9, 3,\
  \ 7, 2 };\nint[] copy = (int[])pins.Clone();\n```\n\n`Clone` 方法请参见第 8 章。`Array`\
  \ 类的 `Clone` 方法返回 `object` 而不是 `Array`，这就是为什么在使用时必须将其转换为数组类型。此外，`Clone`、`CopyTo`\
  \ 和 `Copy` 方法都创建数组的*浅拷贝*。如果被复制数组中的元素包含引用，`Clone` 方法仅复制引用而不是所引的对象。复制后，两个数组指向同一组对象。如果你需要创建此类数组的深拷贝，必须在\
  \ `for` 循环中使用适当的代码。\n\n***\n\n### 使用多维数组\n\n到为止所示数组包含一个维度，你可以将它们视为值的列表。你可以创建多个维度的数组。例如，要创建一个二维数组，你需要指定一个需要两个整数索引的数组。下面的代码创建一个包含\
  \ 24 个整数的二维数组 `items`。\n\n```csharp\nint[,] items = new int[4, 6];\n```\n\n要访问数组中的元素，你需要提供两个索引值来指定元素的“单元格”（行和列的交叉点）。下面的代码显示了使用\
  \ `items` 数组的一些示例：\n\n点击此处查看代码图像\n\n```csharp\nitems[2, 3] = 99; // 将单元格 (2,3) 处设置为\
  \ 99\nitems[2, 4] = items[2, 3]; // 将单元格 (2,3) 中的元素复制到单元格 (2,4)\nitems[2, 4]++;\
  \ // 增加单元格 (2,4) 处的整数值\n```\n\n\n\n对于数组指定的维度数量没有限制。下面的代码示例创建并使用了一个名为 `cube` 的数组，它包含三个维度。注意，你必须指定三个索引来访问数组中的每个元素。\n\
  \n点击此处查看代码图像\n\n```c\nint[, ,] cube = new int[5, 5, 5];\n\ncube[1, 2, 1] = 101;\n\
  \ncube[1, 2, 2] = cube[1, 2, 1] * 3;\n```\n\n此时，有必要对创建超过三个维度的数组给出警告。具体来说，数组可能会消耗大量内存。`cube`\
  \ 数组包含 125 个元素（`5 * 5 * 5`）。一个每个维度大小为 5 的四维数组包含 625 个元素。如果你开始创建三个或更多维度的数组，很快就会耗尽内存。因此，在使用多维数组时，你应该始终准备好捕获并处理\
  \ `OutOfMemoryException` 异常。\n\n### 创建交错数组\n\n在 C# 中，普通的多维数组有时被称为 `rectangular`（矩形）数组。每个维度都有规则的形状。例如，在下面的表格化二维\
  \ `items` 数组中，每行都包含一个有 40 个元素的列，总共有 160 个元素：\n\n点击此处查看代码图像\n\n```csharp\nint[,]\
  \ items = new int[4, 40];\n```\n\n如上一节所述，多维数组可能会消耗大量内存。如果应用程序只使用每列中的部分数据，那么为未使用的元素分配内存将是浪费。在这种情况下，你可以使用\
  \ `jagged`（交错）数组，它的列的长度可以不同，如下所示：\n\n点击此处查看代码图像\n\n```csharp\nint[][] items = new\
  \ int[4][];\n\nint[] columnForRow0 = new int[3];\n\nint[] columnForRow1 = new int[10];\n\
  \nint[] columnForRow2 = new int[40];\n\nint[] columnForRow3 = new int[25];\n\nitems[0]\
  \ = columnForRow0;\n\nitems[1] = columnForRow1;\n\nitems[2] = columnForRow2;\n\n\
  items[3] = columnForRow3;\n\n...\n```\n\n在这个示例中，应用程序在第一列只需要 3 个元素，第二列需要 10 个元素，第三列需要\
  \ 40 个元素，最后一列需要 25 个元素。这段代码说明了一个数组的数组——`items` 并不是二维数组，它本身只有一个维度，但该维度中的元素本身也是数组。此外，`items`\
  \ 数组的总大小为 78 个元素，而不是 160 个；对于应用程序不会使用的元素没有分配空间。\n\n值得强调此示例中的某些语法。以下声明指定 `items`\
  \ 是一个 `int` 数组的数组。\n\n```csharp\nint[][] items;\n```\n\n以下语句初始化 `items` 以包含四个元素，每个元素都是一个长度不确定的数组：\n\
  \n```csharp\nitems = new int[4][];\n```\n\n数组 `columnForRow0` 到 `columnForRow3`\
  \ 都是单维 `int` 数组，初始化为持有每列所需的数据量。最后，每个列数组被分配给 `items` 数组中相应的元素，如下：\n\n```csharp\n\
  items[0] = columnForRow0;\n```\n\n回数组是引用对象，因此此语句只是向 `items` 数组的第一个元素添加了 `columnForRow0`\
  \ 的引用；它并没有实际复制任何数据。你可以通过给 `columnForRow0` 中的索引元素赋值，或者通过 `items` 数组引用它来填充该列的数据。以下语句是等价的：\n\
  \n```csharp\ncolumnForRow0[1] = 99;\n\nitems[0][1] = 99;\n```\n\n如果你想创建数组的数组的数组（而不是矩形三维数组等等），你可以进一步扩展这个想法。\n\
