  \ 属性被设置为 `3`，但 `SideLength` 属性保留了默认值 `10.0`。对于 `pentagon` 变量，代码更改了 `SideLength`\
  \ 和 `NumSides` 属性的值。\n\n### 7. 在 `doWork` 方法末尾添加此处所示的**粗体**代码：\n\n点击此处查看代码图像\n\n\
