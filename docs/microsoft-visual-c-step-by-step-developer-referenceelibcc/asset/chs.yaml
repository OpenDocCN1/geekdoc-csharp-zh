  \ 参数：\n\n点击此处查看代码图片\n\n```csharp\npublic void run()\n{\n    double fee = calculateFee(dailyRate\
  \ : 375.0);\n    Console.WriteLine($\"Fee is {fee}\");\n}\n```\n\n**13.** 在“调试”菜单上，点击“不调试启动”以编译运行程序。\n\
