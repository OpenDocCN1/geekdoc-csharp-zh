  \ Web 应用程序都会运行。在解决方案管理器中，右键点击 `AdventureWorksService` 项目，然后点击 `Properties`。\n\n\
  10. 在属性页上，点击左列的 `Web` 选项卡。\n\n11. 在 Web 页面上，点击“Don’t open a page. Wait for a request\
