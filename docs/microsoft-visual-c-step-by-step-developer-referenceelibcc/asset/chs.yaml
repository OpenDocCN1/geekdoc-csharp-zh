  ### 总结\n\n在本章中，你学习了如何使用某些集合类来存储数据。特别是，你学习了如何使用泛型集合。你还学习了如何使用 表达式在集合中搜索项。\n\n\n\n\
  \n\n`GetEnumerator` 方法应返回一个实现了 `System.Collections.IEnumerator` 接口的枚举器对象。该枚举器对象用于步进（枚举）集合中的元素。`IEnumerator`\
  \ 接口指定了以下属性和方法：\n\n```csharp\nobject Current { get; }\nbool MoveNext();\nvoid Reset();\n\
  ```\n\n将枚举器想象成一个指向列表中元素的指针。初始时，指针指向第一个元素*之前*。你调用 `MoveNext` 方法将指针向下移动到列表中的下一个（第一个）项目；如果实际上存在另一个项目，则\
  \ `MoveNext` 方法应返回 `true`，如果没有，则返回 `false`。你使用 `Current` 属性来访问当前指向的项，并使用 `Reset`\
  \ 方法将指针返回到列表第一个项目*之前*。通过使用集合的 `GetEnumerator` 方法创建枚举器，反复调用 `MoveNext` 方法，并使用枚举器获取\
  \ `Current` 属性的值，你可以一次一个项目地在集合的元素中向向移动。这正是 `foreach` 语句所做的。因此，如果你想创建自己的可枚举集合类，必须在你的集合类中实现\
  \ `IEnumerable` 接口，并提供 `IEnumerator` 接口的实现，以便由集合类的 `GetEnumerator` 方法返回。\n\n* *\
  \ *\n\n![Image](img/Image00004.jpg) 重要\n\n从乍上看，很容易混淆 `IEnumerable` 和 `IEnumerator`\
  \ 接口，因为它们的名称非常相似。务必不要将它们搞混。\n\n* * *\n\n如果你观察仔细，你会注意到 `IEnumerator` 接口的 `Current`\
  \ 属性表现出非类型安全的行为，因为它返回的是 `object` 而不是特定类型。然而，你应该高兴地知道，Microsoft .NET Framework 类库还提供了泛型\
  \ `IEnumerator<T>` 接口，它有一个返回 `T` 的 `Current` 属性。同样，还有一个 `IEnumerable<T>` 接口，其中包含一个返回\
  \ `Enumerator<T>` 对象的 `GetEnumerator` 方法。这两个接口都定义在 `System.Collections.Generic`\
  \ 命名空间中，如果你正在 .NET Framework 2.0 或更高版本构建应用程序，在定义可枚举集合时，你应该使用这些泛型接口，而不是非泛型版本。\n\n\
  ### 手动实现枚举器\n\n在接下来的练习中，你将定义一个实现泛型 `IEnumerator<T>` 接口的类，并为第 17 章中演示的二叉树类创建一个枚举器，“介绍泛型”。\n\
  \n第 17 章阐释了遍历二叉树并显示其内容是多么简单。因此，你可能会认为，定义一个按相同顺序检索二叉树中每个元素的枚举器是一件简单的事。遗憾的是，你错了。主要问题在于，在定义枚举器时，你需要记住自己在结构中的位置，以便后续对\
  \ `MoveNext` 方法的调用能够相应更新位置。递归算法（如遍历二叉树时使用的算法）并不易于在方法调用之间维护状态信息。由于这个原因，你将首先将二叉树中的数据预处理为更易处理的数据结构（队列），并实际上枚举这个数据结构。当然，这种花招对于遍历二叉树元素的用户来说是隐藏的！\n\
  \n#### 创建 `TreeEnumerator` 类\n\n**1.** 如果 Microsoft Visual Studio 2015 尚未运行，请启动它。\n\
  \n**2.** 打开 `BinaryTree` 解决方案，它位于你文档文件夹中的 `\\Microsoft Press\\VCSBS\\Chapter 19\\\
  BinaryTree` 文件夹中。该解决方案包含了你在第 17 章中创建的 `BinaryTree` 项目的工作副本。你将向此项目添加一个新类，在其中实现 `BinaryTree`\
  \ 类的枚举器。\n\n**3.** 在解决方案管理器中，点击 `BinaryTree` 项目。在项目菜单上，点击“添加类”，打开“添加新项 – BinaryTree”对话框。在中间面板中，选择“类”模板，在“名称”框中输入\
  \ `TreeEnumerator.cs`，然后点击“添加”。\n\n`TreeEnumerator` 类为 `Tree<TItem>` 对象生成枚举器。为了确保类是类型安全的，你必须提供类型参数并实现\
  \ `IEnumerator<T>` 接口。此外，类型参数必须是类所枚举的 `Tree<TItem>` 对象的有效类型，因此它必须约束为实现 `IComparable<TItem>`\
  \ 接口（`BinaryTree` 类要求树中的项提供一种用于排序的比较方法）。\n\n**4.** 在显示 `TreeEnumerator.cs` 文件的代码和文本编辑器中，修改\
  \ `TreeEnumerator` 类的定义以满足这些要求，如下例中的粗体所示：\n\n点击此处查看代码图像\n\n```csharp\nclass TreeEnumerator<TItem>\
  \ : IEnumerator<TItem> where TItem : IComparable<TItem>\n{\n\n}\n```\n\n**5.** 在\
