  调试器执行以下语句：\n\n```cs\nint nextDigit = amount % 8;\n```\n\n本地窗口中 `nextDigit` 的值变为\
  \ 7。这是 999 除以 8 后的数。\n\n**12.** 点击“逐语句进入”。\n\n调试器执行此语句：\n\n```cs\namount /= 8;\n\
  ```\n\n本地窗口中 `amount` 的值变为 124。\n\n**13.** 点击“逐语句进入”。\n\n调试器执行此语句：\n\n点击此处查看代码图像\n\
  \n```cs\nint digitCode = '0' + nextDigit;\n```\n\n本地窗口中 `digitCode` 的值变为 55。这是字符“7”的字符编码（48\
  \ + 7）。\n\n**14.** 点击“逐语句进入”。\n\n调试器继续执行此语句：\n\n点击此处查看代码图像\n\n```cs\nchar digit\
  \ = Convert.ToChar(digitCode);\n```\n\n本地窗口中 `digit` 的值变为“7”。本地窗口显示 `char` 值时，同时使用了底层数值（在本例中为\
  \ 55）和字符表示（“7”）。\n\n注意在本地窗口中，变量 `current` 的值仍为 \"\"。\n\n**15.** 点击“逐语句进入”。\n\n调试器执行以下语句：\n\
  \n```cs\ncurrent = current + digit;\n```\n\n本地窗口中 `current` 的值变为“7”。\n\n**16.**\
  \ 点击“逐语句进入”。\n\n调试器执行此处显示的语句：\n\n点击此处查看代码图像\n\n```cs\nsteps.Text += current + \"\
  \\n\";\n```\n\n此语句在 `steps` 文本框中显示文本“7”，随后是一个一个换行符，以便后续输出显示在文本框的下一行。（该表单目前隐藏在 Visual\
  \ Studio 之后，所以你看不到它。）光标移动到 `do` 循环结束处的右大括号。\n\n**17.** 点击“逐语句进入”。\n\n黄色箭头移动到 `while`\
  \ 语句，以评估 `do` 循环是否完成。\n\n**18.** 点击“逐语句进入”。\n\n调试器执行此语句：\n\n```cs\nwhile (amount\
  \ != 0);\n```\n\n`amount` 的值为 124，表达式 `124 != 0` 结果为 *true*，因此 `do` 循环执行另一次迭代。\n\
  \n**19.** 点击“逐语句进入”。\n\n黄色箭头跳回 `do` 循环开头。\n\n**20.** 重复点击“逐语句进入”，逐步执行 `do` 循环的后续迭代并观察本地窗口中的变化。\n\
  \n**21.** 在第四次迭代结束时，`amount` 的值为 0，`current` 的值为“7”。黄色箭头位于 `do` 循环结束处的 `while` 条件：\n\
  \n```cs\nwhile (amount != 0);\n```\n\n由于 `amount` 的值现在为 0，表达式 `amount != 0` 结果为\
  \ *false*，`do` 循环应当终止。\n\n**22.** 点击“逐语句进入”。\n\n调试器执行以下语句：\n\n```cs\nwhile (amount\
  \ != 0);\n```\n\n正如预期的，`do` 循环结束，黄色箭头移动到 `showStepsClick` 方法结束处的右大括号。\n\n**23.**\
  \ 在“调试”菜单上，点击“继续”。\n\n表单出现，显示了创建 999 的八进制表示的四个步骤：7、47 和 147。\n\n![Image](img/Image0061.jpg)\n\
  \n**24.** 返回 Visual Studio 2015。在“调试”菜单上，点击“停止调试”。\n\n### 总结\n\n在本章中，你学习了如何使用复合赋值运算符更新数值变量并将一个字符串附加到另一个字符串。你了解了如何使用\
  \ *while*、*for* 和 *do* 语句在布尔条件为 *true* 时重复运行代码。\n\n如果你想继续下一章，请保持 Visual Studio 2015\
  \ 运行并转至第六章，“管理错误和异常](#text00011.html_ch06)。”如果你现在想退出 Visual Studio 2015，在“文件”菜单上点击“退出”。如果出现保存对话框，点击“是”并保存项目。\n\
  \n\n\n要确保一段代码始终按预期运行是非常困难的。失败可能由许多原因引起，其中许多原因是你作为程序员所无法控制的。你编写的任何应用程序都能够检测失败并以优雅的方式处理它们，要么采取适当的纠正措施，或者在无法采取措施的情况下，以尽可能清晰的方式向用户报告失败原因。在第一部分的最后一个章节中，你将学习\
  \ C# 如何使用异常来信号错误的发生，以及如何使用 `try`、`catch` 和 `finally` 语句来捕获并处理这些异常所代表的错误。\n\n在本章结束，你将在\
  \ C# 的所有基本元素方面建立坚实的基础，并在第二部分中在此基础上继续构建。\n\n## 处理错误\n\n坏事有时会发生是生活的常态。轮胎扎破了，电池没电了，螺丝刀永远不在你上次放置的地方，而你应用程序的用户行为也难以预测。在计算机世界里，硬盘会损坏，与你的程序运行同一台计算机上的其他应用程序失控并耗尽所有可用内存，无线网络连接在最尴尬的时刻消失，甚至是近处的闪电等自然现象如果导致停电或网络故障也会产生影响。错误可能在程序运行的任何阶段发生，而且许多错误实际上并不是你应用程序的错，那么你该如何检测它们并尝试恢复它们呢？\n\
  \n多年来，已经进化出了许多机制。像 UNIX 等旧旧系统采用的典型方法涉及让操作系统在每次方法失败时设置一个特殊的全局变量。然后，在每次调用方法后，你检查该全局变量以查看方法是否成功。C#\
  \ 和大多数其他现代面向对象的语言不以这种方式处理错误；这太痛苦了。相反，它们使用 `exceptions`（异常）。如果你想编写健壮的 C# 程序，你需要了解异常。\n\
  \n### 测试代码和捕获异常\n\n错误可能随时发生，而使用传统技术在每个语句周围手动添加错误检测代码是繁琐的、耗时的，且本身容易出错。如果每条语句都需要扭曲的错误处理逻辑来管理每个阶段可能发生的任何错误，你可能会忽略应用程序的主流程。幸运的是，C#\
  \ 通过使用异常和异常处理程序，轻松地将错误处理代码与实现程序主要逻辑的代码分开。要编写感知异常的程序，你需要做两件事：\n\n![Image](img/Image00001.jpg)\
  \ 在 `try` 块中编写你的代码（`try` 是 C# 关键字）。当代码运行时，它会尝试执行 `try` 块中的所有语句，如果没有没有语句产生异常，它们将一个接一个运行到完成。然而，如果发生了错误条件，执行将跳出\
  \ `try` 块并进入另一段旨在捕获和处理异常的代码——`catch` 处理程序。\n\n![Image](img/Image00001.jpg) 在 `try`\
  \ 块之后立即编写一个或多个 `catch` 处理程序（`catch` 是另一个 C# 关键字），以处理任何可能的错误情况。`catch` 处理程序旨在捕获和处理特定类型的异常，你可以在\
  \ `try` 块之后拥有多个 `catch` 处理程序，每个处理程序都设计用于捕获和处理特定的异常。这允许你为 `try` 块中可能出现的错误提供不同的处理程序。如果\
  \ `try` 块内的任何一个语句导致错误，运行时将抛出异常。随后，运行时检查 `try` 块之后的 `catch` 处理程序，并将控制直接转移到第一个匹配的处理程序。\n\
  \n这里是一个 `try` 块的示例，其中包含的代码尝试将用户在表单某些文本框中输入的字符串转换为整数值。代码随后调用一个方法来计算值，并将结果写入另一个文本框。将字符串转换为整数要求该字符串包含一组有效的数字，而不是任意的字符序列。如果字符串包含无效字符，`int.Parse`\
  \ 方法将抛出 `FormatException`，执行将转移到相应的 `catch` 处理程序。当 `catch` 处理程序完成后，程序将继续执行处理程序之后的第一条语句。注意，如果没有与异常对应的处理程序，则该异常被认为为“未处理的异常”（这种情况稍后将进行描述）。\n\
  \n点击此处查看代码图像\n\n```cs\ntry\n{\n    int leftHandSide = int.Parse(lhsOperand.Text);\n\
  \    int rightHandSide = int.Parse(rhsOperand.Text);\n    int answer = doCalculation(leftHandSide,\
  \ rightHandSide);\n    result.Text = answer.ToString();\n}\ncatch (FormatException\
  \ fEx)\n{\n    // Handle the exception\n    ...\n}\n```\n\n`catch` 处理程序使用类似于方法参数的语法来指定要捕获的异常。在前面的示例中，当抛出\
  \ `FormatException` 时，变量 `fEx` 将填充一个包含异常详细信息的的对象。\n\n`FormatException` 类型有许多属性可以检查，以确定异常的的确切原因。这些属性中的许多是所有异常通用的。例如，`Message`\
  \ 属性包含导致异常的错误的文本描述。你可以在处理异常时使用这些信息，也许将详细记录在日志文件中，或向用户显示一条有意义的消息，然后要求用户重试。\n\n###\
  \ 未处理的异常\n\n如果 `try` 块抛出异常且没有对应的 `catch` 处理程序会发生什么？在以前的示例中，`lhsOperand` 文本框可能包含有效整数的字符串表示，但它所代表的整数超出了\
  \ C# 支持的有效整数范围（例如，“2147483648”）。在这种情况下，`int.Parse` 语句将抛出 `OverflowException`，它将不会被\
  \ `FormatException catch` 处理程序捕获。如果发生这种情况且 `try` 块是一个方法的一部分，则该方法将立即退出，执行返回到调用方法。如果调用方法使用了\
  \ `try` 块，运行时将尝试为该 `try` 块查找匹配的 `catch` 处理程序并执行它。如果调用方法没有使用 `try` 块或没有匹配的 `catch`\
  \ 处理程序，则调用方法将立即退出，执行返回到其调用者，并在那里重复该过程。如果最终找到了匹配的 `catch` 处理程序，则处理程序将运行，执行继续捕获方法中\
  \ `catch` 处理程序之后的第一条语句。\n\n![Image](img/Image00004.jpg) **重要**\n\n注意，在捕获异常后，执行在捕获该异常的\
  \ `catch` 块所在的方法继续。如果异常发生在包含处理程序的方法之外，控制*不会*返回到产生异常的方法。\n\n* *\n\n如果在回溯到调用方法列表后，运行时无法找到匹配的\
  \ `catch` 处理程序，程序将由于未处理的异常而终止。\n\n你可以轻松地检查由应用程序生成的异常。如果你在 Microsoft Visual Studio\
  \ 2015 调试模式下运行应用程序（即在调试菜单上选择了“启动调试”来运行应用程序）并且发生了异常，将出现一个类似于下图所示的对话框，应用程序将暂停，帮助你确定异常的原因：\n\
  \n![Image](img/Image00063.jpg)\n\n\n\n应用程序将会在导致异常的语句处停止，并让你进入调试器。你可以检查变量的值、修改变量的值，并使用调试工具栏和各种调试窗口从异常发生点开始逐行执行代码。\n\
  \n### 使用多个 catch 处理器\n\n之前的讨论强调了不同错误如何抛出不同类型的异常来表示不同类型的失败。为了应对这些情况，你可以连续提供多个 `catch`\
  \ 处理器，如下例所示：\n\n点击此处查看代码图像\n\n```csharp\ntry\n{\n    int leftHandSide = int.Parse(lhsOperand.Text);\n\
  \    int rightHandSide = int.Parse(rhsOperand.Text);\n    int answer = doCalculation(leftHandSide,\
  \ rightHandSide);\n    result.Text = answer.ToString();\n}\ncatch (FormatException\
  \ fEx)\n{\n    //...\n}\ncatch (OverflowException oEx)\n{\n    //...\n}\n```\n\n\
  如果 `try` 块中的代码抛出了 `FormatException` 异常，则会执行针对 `FormatException` 异常的 `catch` 块中的语句。如果代码抛出了\
  \ `OverflowException` 异常，则执行针对 `OverflowException` 异常的 `catch` 块。\n\n![Image](img/Image00005.jpg)\
  \ Note\n\n如果 `FormatException catch` 块中的代码产生了 `OverflowException` 异常，它不会导致相邻的 `OverflowException\
  \ catch` 块运行。相反，异常将传播到调用此代码的方法，正如本节稍些时候描述的那样。\n\n### 捕获多个异常\n\nC# 和 Microsoft .NET\
  \ Framework 提供的异常捕获机制非常全面。.NET Framework 定义了许多类型的异常，你编写的任何程序都可能抛出其中的大多数异常。你不太可能为代码可能抛出的每种可能的异常都编写\
  \ `catch` 处理器——请记住，你的应用程序必须能够处理那些在你编写程序时可能没有考虑过的异常！那么，你如何确保程序捕获并处理所有可能的异常呢？\n\n\
  这个问题的答案在于不同异常之间的关系。异常被组织成称为“继承层次结构”（`inheritance hierarchies`）的家族。（你将在第 12 章中的“使用继承”中学习继承内容。）`FormatException`\
  \ 和 `OverflowException` 都属于一个名为 `SystemException` 的家族，其他许多异常也是如此。`SystemException`\
  \ 本身是一个更广泛的简单称为 `Exception` 的家族的成员，它是所有异常的太祖爷爷。如果你捕获了 `Exception`，处理器就会捕获可能发生的每种异常。\n\
  \n![Image](img/Image00005.jpg) Note\n\n`Exception` 家族包含了各种异常，其中许多是供 .NET Framework\
  \ 的不同部分使用的。这些异常中的某些相当晦涩，但理解如何捕获它们仍然是有用的。\n\n接下来的示例展示了如何捕获所有可能的异常：\n\n点击此处查看代码图像\n\
  \n```csharp\ntry\n{\n    int leftHandSide = int.Parse(lhsOperand.Text);\n    int\
  \ rightHandSide = int.Parse(rhsOperand.Text);\n    int answer = doCalculation(leftHandSide,\
  \ rightHandSide);\n    result.Text = answer.ToString();\n}\ncatch (Exception ex)\
  \ // 这是一个通用 catch 处理器\n{\n    //...\n}\n```\n\n![Image](img/Image00005.jpg) Note\n\
  \n如果你想捕获 `Exception`，实际上可以从 `catch` 处理器中省略它的名称，因为它是默认异常：\n\n```csharp\ncatch\n{\n\
  \    // ...\n}\n```\n\n然而，这并不建议这样做。传递给 `catch` 处理器的异常对象可以包含有关异常的有用信息，而在使用这种版本的 `catch`\
  \ 结构时，这些信息并不容易获取。\n\n此时你应该问的最后一个问题是：如果同一个异常匹配 `try` 块末尾的多个 `catch` 处理器会发生什么？如果你在两个不同的处理器中捕获了\
  \ `FormatException` 和 `Exception`，哪一个会运行？（或者两个都会执行吗？）\n\n当异常发生时，运行时将使用它找到的第一个匹配该异常的处理器，其他的将被忽略。这意味着，如果你将\
  \ `Exception` 处理器放在 `FormatException` 处理器之前，那么 `FormatException` 处理器将永远不会运行。因此，你应该在\
  \ `try` 块之后，将更具体的 `catch` 处理器放在通用的 `catch` 处理器上方。如果没有特定的 `catch` 处理器匹配异常，则通用的 `catch`\
  \ 处理器将匹配。\n\n### 异常过滤器\n\n异常过滤器是 C# 的一项新功能，它影响异常与 catch 处理器匹配的方式。异常过滤器允许你指定使用 catch\
  \ 处理器的额外条件。这些条件以带有 `when` 关键字前缀的布尔表达式的形式存在。下面的示例说明了语法：\n\n点击此处查看代码图像\n\n```csharp\n\
  catch (Exception ex) when (ex.GetType() != typeof(System.OutOfMemoryException))\n\
  {\n    // 处理所有之前未捕获的异常，内存溢异常外\n}\n```\n\n此示例捕获了所有异常（`Exception` 类型），但过滤器指定，如果异常的类型是内存溢异常，则应该忽略此处理器。（`GetType`\
  \ 方法返回该类型。）这提供了一种处理所有内存溢异常之外异常的整洁方法。如果发生了内存溢异常，运行时将继续寻找另一个处理器，如果未能找到，则异常将被视为未处理的异常。\n\
  \n在接下来的练习中，你将看到当应用程序抛出未处理的异常时会发生什么，然后你将编写 `try` 块并捕获异常。\n\n观察应用程序报告未处理的异常\n\n1.\
  \ 如果 Visual Studio 2015 没有运行，请启动它。\n2. 打开 MathsOperators 解决方案，它位于文档文件夹中的 Microsoft\
  \ Press\\VCS\\Chapter 6\\MathsOperators 文件夹。\n\n这是第 2 章中“使用变量、运算符和表达式”中的程序版本，它演示了不同的算术运算符。\n\
  \n3. 在调试菜单中，点击无调试启动。\n\n![Image](img/Image00005.jpg) Note\n\n对于此练习，确保你在没有调试的情况下运行应用程序。\n\
  \n表单出现了。现在你将在左侧操作数中输入一些导致异常的文本。此操作将证明当前程序缺乏健壮性。\n\n4. 在左侧操作数中输入 **John**，在右侧操作数中输入\
  \ **2**。点击 + 按钮，然后点击计算。\n\n此输入触发了 Windows 默认异常处理：应用程序直接终止，你返回到了桌面！\n\n现在你已经看到了当发生未处理异常时应用程序的行为，下一步是通过处理无效输入并防止未处理异常的产生来使应用程序更具健壮。\n\
  \n编写 `try/catch` 语句块\n\n1. 返回到 Visual Studio 2015。\n2. 在调试菜单中，点击启动调试。\n3. 当表单出现时，在左侧操作数中输入\
  \ **John**，在右侧操作数中输入 **2**。点击 + 按钮，然后点击计算。\n\n此输入会导致与上一个练习中相同的异常，不同之处你现在正在调试模式下运行，因此\
  \ Visual Studio 会捕获并报告该异常。\n\n\n\n\nVisual Studio 显示你的代码并高亮显示导致异常的语句。它还会显示一个描述异常的对话框，在本例中，异常是“输入字符串不是正确的格式”（Input\
  \ string was not in a correct format.）。\n\n![Image](img/Image00064.jpg)\n\n你可以看到异常是由\
  \ `addValues` 方法内部的 `int.Parse` 调用抛出的。问题是该方法无法将文本“John”解析为有效的数字。\n\n**4.** 在异常对话框中，点击“查看详细”（View\
  \ Detail）。\n\n会打开另一个对话框，你可以在其中查看有关异常的更多信息。如果你展开 `System.FormatException`，就可以看到这些信息：\n\
  \n![Image](img/Image00065.jpg)\n\n* * *\n\n![Image](img/Image00013.jpg)  提示\n\n\
  某些异常是早先提出的其他异常的结果。Visual Studio 报告的异常只是该链中的最后一个异常，但通常是早期的异常突出了问题的真实原因。你可以通过展开“查看详细”对话框中的\
  \ `InnerException` 属性来深入研究这些早期的异常。内部异常可能包含进一步的内部异常，你可以继续向下挖掘，直到找到一个 `InnerException`\
  \ 属性设置为 `null` 的异常（如之前的图像所示）。此时，你已经到达初始异常，而这个异常通常是你需要修正的异常。\n\n* * *\n\n**5.** 在“查看详细”对话框中点击“确定”，然后在\
  \ Visual Studio 的“调试”菜单中点击“停止调试”（Stop Debugging）。\n\n**6.** 在“代码和文本编辑器”窗口中显示文件 `MainPage.xaml.cs`\
  \ 的代码，并找到 `addValues` 方法。\n\n**7.** 在此方法的语句周围添加一个 `try` 块（包括括号），并带有一个 `FormatException`\
  \ 异常的 `catch` 处理程序，如此处加粗所示：\n\n点击此处查看代码图像\n\n```csharp\ntry\n{\n    int lhs = int.Parse(lhsOperand.Text);\n\
  \    int rhs = int.Parse(rhsOperand.Text);\n    int outcome = 0;\n    outcome =\
  \ lhs + rhs;\n    expression.Text = $\"{lhs} + {rhs}\";\n    result.Text = outcome.ToString();\n\
  }\ncatch (FormatException fEx)\n{\n    result.Text = fEx.Message;\n}\n```\n\n如果发生\
  \ `FormatException` 异常，`catch` 处理程序会将异常的 `Message` 属性中持文本显示在表单底部 `result` 文本框中。\n\
  \n**8.** 在“调试”菜单上，点击“开始调试”（Start Debugging）。\n\n**9.** 当表单出现时，在“左操作数”框中输入 **John**，在“右操作数”框中输入\
  \ **2**。点击 + 按钮，然后点击“计算”（Calculate）。\n\n`catch` 处理程序成功捕获了 `FormatException`，消息“输入字符串不是正确的格式”被写入\
  \ Result 文本框。现在应用程序变得更健壮了。\n\n![Image](img/Image00066.jpg)\n\n**10.** 将 John 替换为数字\
  \ **10**。在“右操作数”框中输入 **Sharp**，然后点击“计算”。\n\n`try` 块包围了用于解析两个文本框的语句，因此同一个异常处理程序会处理两个文本框中的用户输入错误。\n\
  \n**11.** 在“右操作数”框中将 Sharp 替换为 **20**，点击 + 按钮，然后点击“计算”。\n\n应用程序现在按预期工作，并在 Result\
  \ 框中显示值为 30。\n\n**12.** 在“左操作数”框中将 10 替换为 **John**，点击 – 减法按钮，然后点击“计算”。\n\nVisual\
  \ Studio 进入调试器并再次报告了 `FormatException` 异常。这一次，错误发生在 `subtractValues` 方法中，该方法没有包含必要的\
  \ `try` `catch` 处理。\n\n**13.** 在“调试”菜单上，点击“停止调试”。\n\n### 异常的传播\n\n在 `addValues`\
  \ 方法中添加 `try`/`catch` 块使该方法变得更健壮，但你需要将相同的异常处理应用到其他方法：`subtractValues`、`multiplyValues`、`divideValues`\
  \ 和 `remainderValues`。这些每个异常处理程序的代码可能会非常相似，导致你在每个方法中编写相同的代码。这些方法中的每一个都是由 `calculateClick`\
  \ 方法在用户点击“计算”按钮时被调用的。因此，为了避免异常处理代码的重复，将其重新定位到 `calculateClick` 方法是有意义的。如果在 `subtractValues`、`multiplyValues`、`divideValues`\
  \ 或 `remainderValues` 方法中发生 `FormatException`，它将传播回 `calculateClick` 方法进行处理，正如本章前面的章节“未处理的异常”所述。\n\
  \n#### 将异常传回调用方法\n\n**1.** 在“代码和文本编辑器”窗口中显示文件 `MainPage.xaml.cs` 的代码，并找到 `addValues`\
  \ 方法。\n\n**2.** 从 `addValues` 方法中移除 `try` 块和 `catch` 处理程序，并恢复其原始状态，如下代码所示：\n\n点击此处查看代码图像\n\
  \n```csharp\nprivate void addValues()\n{\n    int leftHandSide = int.Parse(lhsOperand.Text);\n\
  \    int rightHandSide = int.Parse(rhsOperand.Text);\n    int outcome = 0;\n   \
  \ outcome = lhs + rhs;\n    expression.Text = lhsOperand.Text + \" + \" + rhsOperand.Text;\n\
  \    result.Text = outcome.ToString();\n}\n```\n\n**3.** 找到 `calculateClick` 方法。在此方法中添加此处示例所示的\
  \ `try` 块和 `catch` 处理程序：\n\n```csharp\nprivate void calculateClick(object sender,\
  \ RoutedEventArgs e)\n{\n    try\n    {\n        if ((bool)addition.IsChecked)\n\
  \        {\n            addValues();\n        }\n        else if ((bool)subtraction.IsChecked)\n\
  \        {\n            subtractValues();\n        }\n        else if ((bool)multiplication.IsChecked)\n\
  \        {\n            multiplyValues();\n        }\n        else if ((bool)division.IsChecked)\n\
  \        {\n            divideValues();\n        }\n        else if ((bool)remainder.IsChecked)\n\
  \        {\n            remainderValues();\n        }\n    }\n    catch (FormatException\
  \ fEx)\n    {\n        result.Text = fEx.Message;\n    }\n}\n```\n\n**4.** 在“调试”菜单上，点击“开始调试”。\n\
  \n**5.** 当表单出现时，在“左操作数”框中输入 **John**，在“右操作数”框中输入 **2**。点击 + 按钮，然后点击“计算”。\n\n如之前，`catch`\
  \ 处理程序成功捕获了 `FormatException`，消息“输入字符串不是正确的格式”被写入 Result 文本框。然而，请记住异常实际上是在 `addValues`\
  \ 方法中抛出的，但它是被 `calculateClick` 方法捕获的。\n\n**6.** 点击 – 减法按钮，然后点击“计算”。\n\n这一次 `subtractValues`\
  \ 方法引起异常，但它传播回 `calculateClick` 方法并按以前的方式进行处理。\n\n**7.** 测试乘法、除法和取模按钮，并验证 `FormatException`\
  \ 异常被正确捕获并处理。\n\n**8.** 返回 Visual Studio 并停止调试。\n\n* * *\n\n![Image](img/Image00005.jpg)\
  \  注意\n\n是否在方法中显式捕获异常取决于你构建的应用程序。在某些情况下，尽可能靠近发生的地方捕获异常是合理的。在其他情况下，让异常传回抛出异常程序的方法并在那里处理错误更有用。\n\
  \n* * *\n\n### 使用检查和未检查整数算术\n\n第 2 章讨论了如何在 `int` 和 `double` 等原始数据类型上使用 `+` 和 `*`\
  \ 等二进制算术运算符。它还指示原始数据类型具有固定大小。例如，C# 的 `int` 是 32 位的。由于 `int` 有固定大小，你确切知道它可以容纳的值范围：它是\
  \ –2147483648 到 2147483647。\n\n\n\n\n\n`int` 类型的固定大小带来了一个问题。例如，如果你给一个当前值为 2147483647\
  \ 的 `int` 加上 1，会发生什么？答案取决于应用程序是如何编译的。默认情况下，C# 编译器生成的代码允许计算静默溢出，导致你得到错误的答案。（事实上，该计算会回绕到最大的负整数值，生成的结果为\
  \ –2147483648。）这种行为的原因是性能考虑：整数算术是几乎在每个程序中的常用操作，在每个整数表达式中添加溢出检查的开销可能会导致性能严重下降。在许多情况下，这种风险是可以接受的，因为你知道（或希望！）你的\
  \ `int` 值不会达到其极限。如果你不喜欢这种方法，可以开启溢出检查。\n\n![Image](img/Image00013.jpg) 提示\n\n你可以通过设置项目属性在\
  \ Visual Studio 2015 中开启或关闭溢出检查。在解决方案资源管理器（Solution Explorer）中，点击 `YourProject`（其中\
  \ `YourProject` 是项目的实际名称）。在项目（Project）菜单上，点击 `YourProject` 属性。在项目属性对话框中，点击 `Build`（生成）选项卡。点击页面右下角的\
  \ `Advanced`（高级）按钮。在高级生成设置对话框中，选择或取消勾选 `Check For Arithmetic Overflow/Underflow`（检查算术溢出/下溢）复选框。\n\
  \n无论如何编译应用程序，你都可以使用 `checked` 和 `unchecked` 关键字在认为需要的应用程序部分开启或关闭整数算术溢出检查。这些关键字会覆盖为项目指定的编译器选项。\n\
  \n### 编写 checked 语句\n\n`checked` 语句是一个由 `checked` 关键字引导的代码块。在 `checked` 语句中的所有整数算术，如果整数计算发生溢出，始终会抛出\
  \ `OverflowException`，如下例所示：\n\n```csharp\nint number = int.MaxValue;\nchecked\n\
  {\n    int willThrow = number++;\n    Console.WriteLine(\"this won't reached\");\n\
  }\n```\n\n![Image](img/Image00004.jpg) 重要\n\n只有直接位于 `checked` 块内部的整数算术才会受到溢出检查。例如，如果\
  \ `checked` 语句之一是一个方法调用，则检查不会应用于在方法中运行的代码。\n\n你还可以使用 `unchecked` 关键字创建 `unchecked`\
  \ 语句。`unchecked` 块中的所有整数算术都不会被检查，且永远不会抛出 `OverflowException`。例如：\n\n```csharp\n\
  int number = int.MaxValue;\nunchecked\n{\n    int wontThrow = number++;\n    Console.WriteLine(\"\
  this will reached\");\n}\n```\n\n### 编写 checked 表达式\n\n你也可以使用 `checked` 和 `unchecked`\
  \ 关键字通过在单个括号表达式之前加上 `checked` 或 `unchecked` 关键字来控制整数表达式的溢出检查，如下例所示：\n\n```csharp\n\
  int wontThrow = unchecked(int.MaxValue + 1);\nint willThrow = checked(int.MaxValue\
  \ + 1);\n```\n\n复合运算符（如 `+=`）以及递增（++`）和递减（--`）运算符是算术运算符，可以通过 `checked` 和 `unchecked`\
  \ 关键字进行控制。记住，`x += y` 等于 `x = x + y`。\n\n![Image](img/Image00005.jpg) 重要\n\n你不能使用\
  \ `checked` 和 `unchecked` 关键字来控制浮点（非整数）算术。`checked` 和 `unchecked` 关键字仅适用于使用 `int`\
  \ 和 `long` 等数据类型的整数算术。浮点算术永远不会抛出 `OverflowException` —— 即使除以 0.0 也是。（回想第 2 章，NET\
  \ Framework 有用于无穷大的特殊浮点表示。）\n\n使用 checked 表达式\n\n在下面的练习中，你将看到如何使用 Visual Studio\
  \ 2015 执行检查性算术。\n\n1. 返回 Visual Studio 2015。\n2. 在 Debug（调试）菜单上，点击 Debugging（调试）。你现在将尝试将两个值相乘。\n\
  3. 在左操作数（Left Operand）框中输入 `9876543`。在右操作数（Right Operand）框中输入 `9876543`。点击 Multiplication（乘）按钮，然后点击\
  \ Calculate（计算）。值 `-119559903` 出现在表单的 Result（结果）框中。这是一个负值，是不可能的。这个值是乘法操作的结果，该操作静默溢出了\
  \ `int` 类型的 32 位限制。\n4. 返回 Visual Studio 并停止调试。\n5. 在显示 `MainPage.xaml` 的代码和文本窗口中，找到\
  \ `multiplyValues` 方法，它看起来如下：\n\n```csharp\nprivate void multiplyValues()\n{\n \
  \   int lhs = int.Parse(lhsOperand.Text);\n    int rhs = int.Parse(rhsOperand.Text);\n\
  \    int outcome = 0;\n    outcome = lhs * rhs;\n    expression.Text = $\"{lhs}\
  \ * {rhs}\";\n    result.Text = outcome.ToString();\n}\n```\n\n语句 `outcome = lhs\
  \ * rhs;` 包含了静默溢出的乘法操作。\n6. 编辑此语句，使计算值经过检查，如下所示：\n```csharp\noutcome = checked(lhs\
  \ * rhs);\n```\n\n现在乘法是经过检查的，它将抛出 `OverflowException` 而不是静默返回错误的答案。\n7. 在 Debug\
  \ 菜单上，点击 Debugging。\n8. 在左操作数框中输入 `9876543`。在右操作数框中输入 `9876543`。点击 Multiplication\
  \ 按钮，然后点击 Calculate。Visual Studio 进入调试器并报告乘法导致了 `OverflowException`。你现在需要添加一个处理器来捕获此异常，以便更优雅地处理。\n\
  9. 在 Debug 菜单上，点击停止调试。\n10. 在显示 `MainPage.xaml` 文件的代码和文本窗口中，找到 `calculateClick`\
  \ 方法。\n11. 在该方法的 `FormatException catch` 处理器之后添加以下 `catch` 处理器（加粗所示）：\n\n```csharp\n\
  private void calculateClick(object sender, RoutedEventArgs e)\n{\n    try\n    {\n\
  \        ...\n    }\n    catch (FormatException fEx)\n    {\n        result.Text\
  \ = fEx.Message;\n    }\n    catch (OverflowException oEx)\n    {\n        result.Text\
  \ = oEx.Message;\n    }\n}\n```\n\n此 `catch` 处理器的逻辑与 `FormatException catch` 处理器相同。然而，将它们分开而不是编写通用的\
  \ `Exception catch` 处理器仍然是有价值，因为将来可能会以不同的方式处理这些异常。\n12. 在 Debug 菜单上，点击 Debugging\
  \ 以生成并运行应用程序。\n13. 在左操作数框中输入 `9876543`。在右操作数框中输入 `9876543`。点击 Multiplication 按钮，然后点击\
  \ Calculate。第二个 `catch` 处理器成功捕获了 `OverflowException`，并在 Result 框中显示消息“Arithmetic\
  \ operation resulted in an overflow”。\n14. 返回 Visual Studio 并停止调试。\n\n### 异常处理与\
  \ Visual Studio 调试器\n\n默认情况下，Visual Studio 调试器只停止调试应用程序并报告未处理的异常。有时，调试异常处理程序本身是有用的，在这种情况下，你需要在异常由应用程序抛出但在被捕获之前对其跟踪。你可以轻松地实现这一点。在\
  \ Debug 菜单上，点击 Windows（窗口）然后选择 Exception Settings（异常设置）。Exception Settings 窗口出现在代码和文本窗口下方：\n\
  \n![Image](img/Image00067.jpg)\n\n在 Exception Settings 格中，展开 Common Language Runtime\
  \ Exceptions，向下滚动并选择 `System.OverflowException`：\n\n![Image](img/Image00068.jpg)\n\
  \n\n\n\n\n现在，当发生如 `OverflowException` 等异常时，Visual Studio 将进入调试器，你可以使用调试工具栏上的“单步”按钮进入\
  \ `catch` 处理程序。\n\n### 抛出异常\n\n假设你正在实现一个名为 `monthName` 的方法，该方法接受单个 `int` 参数并返回对应月份的名称。例如，`monthName(1)`\
  \ 返回“January”，`monthName(2)` 返回“February”，依此类推。问题是，如果整数参数小于 1 或大于 12，该方法应该返回什么？最好的答案是，该方法不应该返回任何内容——它应该抛出一个异常。.NET\
  \ Framework 类库包含许多专门为此类情况设计的异常类。在大多数情况下，你会发现这些类中的某一个可以描述你的异常状况。（如果如果没有，你可以轻松地创建自己的异常类，但在这样做之前，你需要更多地了解\
  \ C# 语言。）在这种情况下，现有的 .NET Framework `ArgumentOutOfRangeException` 类恰恰合适。你可以通过 `throw`\
  \ 语句来抛出异常，如下例所示：\n\n点击此处查看代码图像\n\n```csharp\npublic static string monthName(int\
  \ month)\n{\n    switch (month)\n    {\n        case 1 :\n            return \"\
  January\";\n        case 2 :\n            return \"February\";\n        ...\n  \
  \      case 12 :\n            return \"December\";\n        default :\n        \
  \    throw new ArgumentOutOfRangeException(\"Bad month\");\n    }\n}\n```\n\n`throw`\
  \ 语句需要一个异常对象来抛出。该对象包含异常的详细信息，包括任何错误消息。此示例使用表达式创建一个新的 `ArgumentOutOfRangeException`\
  \ 对象。该对象通过构造函数使用字符串填充其 `Message` 属性。构造函数在 第 7 章 “创建和管理类和对象”中有详细介绍。\n\n在接下来的练习中，你将修改\
  \ `MathsOperators` 项目，如果用户尝试在未指定运算符的情况下执行计算，则抛出异常。\n\n![Image](img/Image00005.jpg)\
  \  注意\n这个练习稍显牵强，因为任何良好的应用程序设计都会提供默认运算符，但此应用程序旨在说明一个观点。\n\n### 抛出异常\n\n**1.** 返回\
  \ Visual Studio 2015。\n\n**2.** 在“调试”菜单上，点击“开始调试”。\n\n**3.** 在“左操作数”框中输入 `24`。在“右侧操作数”框中输入\
  \ `36`，然后点击“计算”。\n\n“表达式”和“结果”框中没有任何显示。你没有选择运算符选项这一点并不显而易见。在“结果”框中编写诊断消息将是有用的。\n\
  \n**4.** 返回 Visual Studio 并停止调试。\n\n**5.** 在显示 `MainPage.xaml.cs` 的代码和文本编辑器中，找到并检查\
  \ `calculateClick` 方法，它看起来应该是这样的：\n\n点击此处查看代码图像\n\n```csharp\nprivate int calculateClick(object\
  \ sender, RoutedEventArgs e)\n{\n    try\n    {\n        if ((bool)addition.IsChecked)\n\
  \        {\n            addValues();\n        }\n        else if ((bool)subtraction.IsChecked)\n\
  \        {\n            subtractValues();\n        }\n        else if ((bool)multiplication.IsChecked)\n\
  \        {\n            multiplyValues();\n        }\n        else if ((bool)division.IsChecked)\n\
  \        {\n            divideValues();\n        }\n        else if ((bool)remainder.IsChecked)\n\
  \        {\n            remainderValues();\n        }\n    }\n    catch (FormatException\
  \ fEx)\n    {\n        result.Text = fEx.Message;\n    }\n    catch (OverflowException\
  \ oEx)\n    {\n        result.Text = oEx.Message;\n    }\n}\n```\n\n`addition`、`subtraction`、`multiplication`、`division`\
  \ 和 `remainder` 字段是表单上的按钮。每个按钮都有一个名为 `IsChecked` 的属性，指示用户是否选择了它。`IsChecked` 属性是一个可空布尔值，如果按钮被选中，其值为\
  \ `true`，否则为 `false`。（你将在 第 8 章 “理解值和引用”中学习更多关于可空值的知识。）级联的 `if` 语句逐一检查每个按钮以找到选中了哪一个。（单选按钮是互斥的，因此用户最多只能选择一个单选按钮。）如果未选中任何按钮，则所有的\
  \ `if` 语句都为假，没有任何计算方法会被调用。\n\n你可以尝试通过在 `if-else` 级联中再添加一个 `else` 语句，向表单上的 `result`\
  \ 文本框写入消息来解决此问题，但更好的解决方案是将错误的检测和信号传递与对错误的捕获和处理分离。\n\n**6.** 在 `if-else` 语句列表的末尾添加另一个\
  \ `else` 语句，并如下文加粗所示所示抛出 `InvalidOperationException`：\n\n点击此处查看代码图像\n\n```csharp\n\
  if ((bool)addition.IsChecked)\n{\n    addValues();\n}\n...\nelse if ((bool)remainder.IsChecked)\n\
  {\n    remainderValues();\n}\nelse\n{\n    throw new InvalidOperationException(\"\
  No operator selected\");\n}\n```\n\n**7.** 在“调试”菜单上，点击“开始调试”以并运行应用程序。\n\n**8.**\
  \ 在“左操作数”框中输入 `24`。在“右侧操作数”框中输入 `36`，然后点击“计算”。\n\nVisual Studio 检测到你的应用程序抛出了 `InvalidOperationException`，并打开了异常对话。你的应用程序抛出了异常，但代码尚未捕获它。\n\
  \n**9.** 在“调试”菜单上，点击“调试”。\n\n现在你已经写了 `throw` 语句并验证了它会抛出异常，我们将编写一个 `catch` 处理程序来处理它。\n\
  \n### 捕获异常\n\n**1.** 在显示 `MainPage.xaml.cs` 的代码和文本编辑器中，在两个有的 `catch` 处理程序下方添加如下加粗所示的\
  \ `catch` 处理程序：\n\n点击此处查看代码图像\n\n```csharp\n...\ncatch (FormatException fEx)\n{\n\
  \    result.Text = fEx.Message;\n}\ncatch (OverflowException oEx)\n{\n    result.Text\
  \ = oEx.Message;\n}\ncatch (InvalidOperationException ioEx)\n{\n    result.Text\
  \ = ioEx.Message;\n}\n```\n\n此代码捕获了在未选择运算符时抛出的 `InvalidOperationException`。\n\n\
  **2.** 在“调试”菜单上，点击“开始调试”。\n\n**3.** 在“左操作数”框中输入 `24`。在“右侧操作数”框中输入 `36`，然后点击“计算”。\n\
  \n“No operator selected”消息出现在“结果”框中。\n\n![Image](img/Image00005.jpg)  注意\n如果你进入了\
  \ Visual Studio 调试器，你可能开启了 Visual Studio 在抛出异常时捕获所有语言运行时异常。如果发生这种情况，在“调试”菜单上点击“继续”。在你完成此练习后，记得禁用\
  \ Visual Studio 捕获 CLR 异常！\n\n**4.** 返回 Visual Studio 并停止调试。\n\n现在应用程序现在健壮得多。然而，仍然可能出现若干未捕获的异常并导致应用程序失败。例如，如果你尝试除以\
  \ 0，将会抛出一个未处理的 `DivideByZeroException`。（整数除以 0 会抛出异常，与浮点数除以 0 不同。）解决此问题的方法是在 `calculateClick`\
  \ 方法内部编写数量越来越多的 `catch` 处理程序。另一种解决方案是在 `catch` 列表的末尾添加一个捕获 `Exception` 的通用 `catch`\
  \ 处理程序。这将捕获你可能忘记的、由于极端异常情况而引起的所有意外异常。\n\n\n\n\n\n使用通用捕获器来捕获 `Exception` 异常并不是省略捕获特定异常的借口。你对异常的处理越明确，你的代码就越容易维护，发现任何底层或常见反复出现问题的原因也就越容易。只有在确实是……嗯，非常异常的情况下，才使用\
  \ `Exception` 异常。在接下来的练习中，“除以零”异常属于这一类。然而，既然已经确定这种异常在专业应用程序中是一个可能发生的事件，良好的做法是为应用程序添加一个处理\
  \ `DivideByZeroException` 异常的句柄。\n\n***\n\n### 捕获未处理的异常\n\n**1.** 在显示 `MainPage.xaml.cs`\
  \ 的代码和文本编辑器窗口中，在 `calculateClick` 方法的现有 `catch` 处理器列表末尾添加以下 `catch` 处理器：\n\n点击此处查看代码图片\n\
  \n```csharp\ncatch (Exception ex)\n{\n    result.Text = ex.Message;\n}\n```\n\n\
  此 `catch` 处理器将捕获所有到为止未被处理的异常，无论其具体类型为何。\n\n**2.** 在调试（Debug）菜单上，点击启动调试（Start Debugging）。\n\
  \n现在你将尝试执行已知会导致异常的计算，并确认它们都已正确处理。\n\n**3.** 在左操作数（Left Operand）框中输入 `24`。在右操作数（Right\
  \ Operand）框中输入 `36`，然后点击计算（Calculate）。\n\n确认结果（Result）框中仍然出现“未选择操作符”的诊断消息。此消息是由\
  \ `InvalidOperationException` 处理器生成的。\n\n**4.** 在左操作数框中输入 `John`，点击 `+` 加法按钮，然后点击计算。\n\
  \n确认结果框中出现“输入字符串格式不正确”的诊断消息。此消息是由 `FormatException` 处理器生成的。\n\n**5.** 在左操作数框中输入\
  \ `24`。在右操作数框中输入 `0`。点击 `/` 除法按钮，然后点击计算。\n\n确认结果框中出现“尝试除以零”的诊断消息。此消息是由通用的 `Exception`\
  \ 处理器生成的。\n\n**6.** 尝试其他数值组合，并验证异常情况已得到处理且没有导致应用程序崩溃。完成后，返回 Visual Studio 并停止调试。\n\
  \n### 使用 finally 块\n\n必须记住，当异常被抛出时，它会改变程序通过程序的执行流。这意味着你无法保证某条语句在前一个语句结束时始终运行，因为前一个语句可能会抛出异常。请记住，在这种情况下，在\
  \ `catch` 处理器运行之后，控制流将在包含该处理器的块中的下一条语句恢复，而不是在引发异常的代码之后的后续语句恢复。\n\n看接下来的示例，该示例改编自第\
  \ 5 章，“使用复合赋值和迭代语句](#text00010.html_ch05)”中的代码。很容易假设当 `while` 循环完成后 `reader.Dispose`\
  \ 的调用总是会发生。毕竟，它就在代码里。\n\n点击此处查看代码图片\n\n```csharp\nTextReader reader = ...;\n...\n\
  string line = reader.ReadLine();\nwhile (line != null)\n{\n    ...\n    line = reader.ReadLine();\n\
  }\nreader.Dispose();\n```\n\n有时，某一个特定语句没有运行并没有问题，但在许多情况下这可能是一个大问题。如果该语句释放了在前一个语句中获取的资源，未能执行该语句将导致资源被保留。这个示例就是这种情况：当你打开一个文件进行读取时，此操作操作获取了一个资源（文件句柄），你必须确保调用\
  \ `reader.Dispose` 来释放资源。如果不这样做，早晚你会耗尽文件句柄，并无法打开更多文件。如果你觉得文件句柄微不足道，可以考虑数据库连接。\n\n\
  确保语句（无论是否抛出异常）始终运行的方法是将该语句写在 `finally` 块内部。`finally` 块紧跟在 `try` 块之后，或者 `try` 块之后的最后一个\
  \ `catch` 处理器之后。只要程序进入了与 `finally` 块关联的 `try` 块，`finally` 块始终运行，即使发生了异常。如果异常被抛出并在本地被捕获，异常处理器先执行，然后执行\
  \ `finally` 块。如果异常未在本地捕获（即运行时必须搜索调用方法列表以寻找处理器），则先运行 `finally` 块。在任何情况下，`finally`\
  \ 块始终执行。\n\n解决 `reader.Dispose` 问题的方案如下：\n\n点击此处查看代码图片\n\n```csharp\nTextReader\
  \ reader = ...;\n...\ntry\n{\n    string line = reader.ReadLine();\n    while (line\
  \ != null)\n    {\n        ...\n        line = reader.ReadLine();\n    }\n}\nfinally\n\
  {\n    if (reader != null)\n    {\n        reader.Dispose();\n    }\n}\n```\n\n\
  即使在读取文件时发生异常，`finally` 块也能确保 `reader.Dispose` 语句始终执行。你将在第 14 章，“垃圾收集和资源管理](#text0020.html_ch14)”中看到处理这种情况的其他方法。\n\
  \n### 总结\n\n在本章中，你学习了如何使用 `try` 和 `catch` 结构来捕获和处理异常。你了解如何使用 `checked` 和 `unchecked`\
  \ 关键字来开启或关闭检查。你学习了在代码检测到异常情况时如何抛出异常，并看到了如何使用 `finally` 块确保关键代码始终运行。\n\n如果你想继续后续章节，请保持\
  \ Visual Studio 2015 运行并转向第 7 章。\n\n如果你现在想退出 Visual Studio 2015，在文件菜单上点击退出。如果出现保存对话框，点击“是”。\n\
  \n### 快速参考\n\n第二部分：理解 C# 对象模型\n\n在第一部分中，你学习了如何声明变量、使用运算符创建值、调用方法以及实现方法所需的许多语句。你现在已经有了足够的知识进入下一阶段：将方法和数据组合成你自己的功能结构。第二部分中的章节将教你如何这样做。\n\
  \n在第二部分中，你将学习类和结构，这是构建典型 C# 应用程序的实体和其他项目的两种基本类型。特别，你将看到 C# 如何根据类和结构的定义创建对象和值类型，以及公共语言运行时\
  \ (CLR) 如何管理这些项目的生命周期。你将发现如何使用继承创建类族，并学习如何使用数组聚合项。\n\n第 7 章。创建和管理类与对象\n\n完成本章后，你能够：\n\
  \n- 定义包含一组相关方法和数据项的类。\n- 使用 `public` 和 `private` 关键字控制成员的访问权限。\n- 通过使用 `new` 关键字调用构造函数创建对象。\n\
  - 编写并调用自己的构造函数。\n- 使用 `static` 关键字创建所有类实例共享的方法和数据。\n- 解释如何创建匿名类。\n\n\n\n\n\nWindows\
  \ Runtime 与同 Microsoft .NET Framework 包含了数千个类。你已经使用过其中的许多类，包括 `Console` 和 `Exception`。类为应用程序所操作的实体提供了一种方便的机制。实体可以代表一个特定的项目，例如客户，也可以代表更抽象的东西，例如交易。任何系统的设计过程，重点在于确定对系统所实现的流程至关重要的实体，然后进行分析以查看这些实体需要持有哪些信息以及它们应该执行哪些操作。你将类所持有的信息存储为字段（fields），并使用方法（methods）来实现类可以执行的操作。\n\
  \n### 理解分类\n\n`Class`（类）是 `classification`（分类）一词的根源。当你设计一个类时，你在系统地将信息和行为排列成有意义的实体。这种排列是一种分类行为，是每个人都会做的事情——不仅仅是程序员。例如，所有的汽车都有共同的行为（它们可以转向、停止、加速等）和共同的属性（它们有方向盘、引擎等）。人们使用“汽车”一词来表示共享这些共同行为和属性的对象。只要大家对一个词的含义达成共识，这个系统就能良好运行，你就可以用简洁的形式表达复杂但精确的想法。如果没有分类，很难想象人类如何进行思考或交流。\n\
  \n鉴于分类如此深地植根于我们的思维和交流方式，通过对问题及其解决方案中固有的不同概念进行分类，然后在编程语言中对这些类进行建模来尝试编写程序是有意义的。这正是使用面向对象的编程语言可以做的事情，包括\
  \ Microsoft Visual C#。\n\n### 封装的目的\n\n`Encapsulation`（封装）是定义类时的一个重要原则。其思想是：使用类的程序不需要考虑该类内部实际上是如何工作的；程序只需要创建类的实例并调用该类的方法。只要这些方法执行了它们被设计的功能，程序就不需要知道它们是如何实现的。例如，当你调用\
  \ `Console.WriteLine` 方法时，你不想被 `Console` 类如何在物理上安排数据写入屏幕的所有细节所困扰。类可能需要维护各种内部状态信息以执行它的各种方法。这些额外的状态信息和活动对于该类的程序隐藏的。因此，封装有时被称为\
  \ `information hiding`（信息隐藏）。封装实际上有两个目的：\n\n![Image](img/Image00001.jpg) 将类内部的方法和数据结合起来；换句话说，为了支持分类\n\
  \n![Image](img/Image00001.jpg) 控制方法和数据的可访问性；换句话说，为了控制类的使用\n\n### 定义和使用类\n\n在 C#\
  \ 中，你使用 `class` 关键字来定义一个新类。类的数据和方法出现在类体的一对括号之间。以下是一个名为 `Circle` 的 C# 类，它包含一个方法（计算圆的面积）和一个数据（圆的半径）：\n\
  \n点击此处查看代码图片\n\n```csharp\nclass Circle\n{\n    int radius;\n\n    double Area()\n\
  \    {\n        return Math.PI * radius * radius;\n    }\n}\n```\n\n* * *\n\n![Image](img/Image00005.jpg)\
  \ 注意\n\n`Math` 类包含了用于执行数学计算的方法，以及包含数学常数的字段。`Math.PI` 字段包含值 3.14159265358979，它是圆周率\
  \ pi 的近似值。\n\n* * *\n\n类体包含普通方法（如 `Area`）和字段（如 `radius`）。回想本书早期，类中的变量被称为 `fields`（字段）。第\
  \ 2 章 “使用变量、运算符和表达式”显示了如何声明变量，而第 3 章 “编写方法和应用作用域” 演示了如何编写方法，因此这里几乎没有新语法。\n\n你可以以类似于你已经过的其他类型的方式来使用\
  \ `Circle` 类。你创建一个指定 `Circle` 为其类型的变量，然后用一些有效数据初始化该变量。这里是一个示例：\n\n点击此处查看代码图片\n\n\
  ```csharp\nCircle c; // 创建一个 Circle 变量\nc = new Circle(); // 初始化它\n```\n\n这段代码中一个值得强调点是使用了\
  \ `new` 关键字。之前，当你初始化像 `int` 或 `float` 这样的变量时，你只是简单给它赋了一个值：\n\n```csharp\nint i;\n\
  i = 42;\n```\n\n你不能对类类型的变量执行相同的操作。原因之一是 C# 并没有提供将字面量类值赋值给变量的语法。你不能写像这样的语句：\n\n```csharp\n\
  Circle c;\nc = 42;\n```\n\n毕竟，`Circle` 对应的 42 等于什么？另一个原因涉及运行时分配和管理类类型变量内存的方式——这将在第\
  \ 8 章 “理解值和引用”中进一步讨论。\n\n```csharp\nCircle c;\nc = new Circle();\n```\n\n然而，这并不看起来那么简单，原因将在后文中讨论。\n\
  \n* * *\n\n![Image](img/Image00004.jpg) 重要 不要混淆 `class`（类）和 `object`（对象）。类是类型的定义。对象是运行时创建的类型实例。多个不同的对象可以是同一个类的实例。\n\
  \n* * *\n\n### 控制访问性\n\n令人惊讶的是，`Circle` 类目前没有任何实际用途。默认情况下，当你将方法和数据封装在类内部时，类与外部世界形成了一个边界。类中定义的字段（如\
  \ `radius`）和方法（如 `Area`）可以被类内部的方法使用，但不能被外部使用；它们对于类是私有的。因此，尽管你可以在程序中对象，但无法访问它的 `radius`\
  \ 字段或调用它的 `Area` 方法，这就是为什么该类目前没用！但是，你可以通过 `public` 和 `private` 关键字修改字段或方法的定义，以控制它们是否从外部访问：\n\
  \n![Image](img/Image00001.jpg) 方法或字段如果是私有的，则只能类内部访问。声明方法或字段为私有时，在其声明之前写入 `private`\
  \ 关键字。正如前面提到的，这实际上是默认值，但显式声明字段和方法为私有是良好的做法，以避免任何混淆。\n\n![Image](img/Image00001.jpg)\
  \ 方法或字段如果是公有的，则可以在类内部和外部访问。声明方法或字段为公有时，在其声明之前写入 `public` 关键字。\n\n这里再次是 `Circle`\
  \ 类。这次，`Area` 被定义为公共方法，而 `radius` 被定义为私有字段：\n\n```csharp\nclass Circle\n{\n    private\
  \ int radius;\n\n    public double Area()\n    {\n        return Math.PI * radius\
  \ * radius;\n    }\n}\n```\n\n\n\n\n虽然 `radius` 被声明为私有字段且无法从类外部访问，但在 `Circle` 类内部是可以访问\
  \ `radius` 的。`Area` 方法位于 `Circle` 类内部，因此 `Area` 的方法体可以访问 `radius`。然而，该类的价值仍然有限，因为没有办法来初始化\
  \ `radius` 字段。为了解决这个问题，你可以使用构造函数。\n\n![Image](img/Image00013.jpg) 提示\n\n请记住，在方法中声明的变量默认不会被初始化。然而，类中的字段会自动初始化为\
  \ `0`、`false` 或 `null`，具体取决于它们的类型。尽管如此，提供一种显式的手段来初始化字段仍然是一种良好的编程习惯。\n\n# 命名与可访问性\n\
  \n许多组织都有自己的编码规范，并要求开发者在编写代码时遵循这些规范。这种规范的一部分通常涉及标识符的命名规则。这些规则的目的通常是为了让代码更易维护。以下建议是相当常见的，并且与类成员的可访问性的字段和方法命名约定有关；但是，C#\
  \ 并不强制这些规则：\n\n![Image](img/Image00001.jpg) 公共的标识符应该以大字母开头。例如，`Area` 以 `A` 开头（而不是\
  \ `a`），因为它是公共的。这种系统被称为 `PascalCase` 命名方案（因为它最初是在 Pascal 语言中使用的）。\n\n![Image](img/Image00001.jpg)\
  \ 非公共的标识符（包括局部变量）应该以小写字母开头。例如，`radius` 以 `r` 开头（而不是 `R`），因为它是私有的。这种系统被称为 `camelCase`\
  \ 命名方案。\n\n![Image](img/Image00005.jpg) 备注\n\n某些组织仅对方法使用 `camelCase` 方案，并采用以下划线开头来命名私有字段的约定，例如\
  \ `_radius`。然而，本书中的示例对私有方法和字段使用了 `camelCase` 命名。\n\n该规则只有一个有一个例外：类名应该以大字母开头，且构造函数必须与它们的类名完全匹配；因此，私有构造函数必须以大字母开头。\n\
  \n![Image](img/Image00004.jpg) 重要\n\n不要声明两个名称仅在大小写上不同的公共类成员。如果你这样做，使用其他不区分大小写语言（如\
  \ Microsoft Visual Basic）的开发者可能无法将你的类集成到他们的解决方案中。\n\n## 使用构造函数\n\n当你使用 `new` 关键字创建对象时，运行时需要通过类的定义来构造该对象。运行时必须从操作系统获取一段内存，用类定义的字段填充它，然后调用构造函数来执行任何所需的初始化。\n\
  \n`constructor`（构造函数）是一种特殊方法，它在你创建类的实例时自动运行。它与类名相同，并且可以接受参数，但不能返回值（即使是 `void`也不行）。每个类都必须有一个构造函数。如果你不写一个，编译器会自动为你生成一个默认构造函数。（然而，编译器生成的默认构造函数实际上并没有做任何事情。）你可以非常容易地编写自己的默认构造函数。只需添加一个不返回值的公共方法，并给它一个与类相同的名称即可。下面的示例显示了带有默认构造函数的\
  \ `Circle` 类，该构造函数将 `radius` 字段初始化为 0：\n\n```\nclass Circle\n{\n    private int\
  \ radius;\n\n    public Circle() // 默认构造函数\n    {\n        radius = 0;\n    }\n\n\
  \    public double Area()\n    {\n        return Math.PI * radius * radius;\n  \
  \  }\n}\n```\n\n![Image](img/Image00005.jpg) 备注\n\n在 C# 术语中，`default`（默认）构造函数是不接受任何参数的构造函数。无论是编译器生成的还是由你编写的，它都是默认构造函数。你也可以编写非默认构造函数（即接受参数的构造函数），正如你将在后续章节“重载构造函数”中看到的。。\n\
  \n在这个示例中，构造函数被标记为 `public`。如果省略了此关键字，构造函数将是私有的（就像任何其他方法和字段一样）。如果构造函数是私有的，则它无法在类外部使用，这会阻止你从\
  \ `Circle` 类之外的方法创建 `Circle` 对象。因此，你可能会认为私有构造函数没有那么价值。它们确实有其用处，但超出了当前讨论的范围。\n\n\
  添加了公共构造函数后，你现在可以使用 `Circle` 类并调用它的 `Area` 方法了。注意你如何使用点符号表示法在 `Circle` 对象上调用 `Area`\
  \ 方法：\n\n```\nCircle c;\nc = new Circle();\ndouble areaOfCircle = c.Area();\n```\n\
  \n### 重载构造函数\n\n你几乎已经完成了，但还没有完全。你现在可以声明一个 `Circle` 变量，使用它引用一个新创建的 `Circle` 对象，然后调用它的\
  \ `Area` 方法。然而，还有一个最后一个问题。所有 `Circle` 对象的面积始终为 0，因为默认构造函数将半径设置为 0；`radius` 字段是私有的，在初始化之后没有简单的方法可以更改它的值。构造函数只是一种方法，它和所有方法一样是可以重载的。就像有多个版本的\
  \ `Console.WriteLine` 方法，每个版本接受不同的参数一样，你也可以编写不同版本的构造函数。因此，你可以为 `Circle` 类添加另一个带有参数的构造函数来指定半径，如下：\n\
  \n```\nclass Circle\n{\n    private int radius;\n\n    public Circle() // 默认构造函数\n\
  \    {\n        radius = 0;\n    }\n\n    public Circle(int initialRadius) // 重载构造函数\n\
  \    {\n        radius = initialRadius;\n    }\n\n    public double Area()\n   \
  \ {\n        return Math.PI * radius * radius;\n    }\n}\n```\n\n![Image](img/Image00005.jpg)\
  \ 备注\n\n类中构造函数的顺序并不重要；你可以按照你熟悉的顺序定义构造函数。\n\n然后，你可以在创建新的 `Circle` 对象时使用此构造函数，如下：\n\
  \n```\nCircle c;\nc = new Circle(45);\n```\n\n当你构建应用程序时，编译器根据你指定 `new` 操作符的参数来确定应该调用哪个构造函数。在这个示例中，你传递了一个\
  \ `int`，因此编译器生成调用带有 `int` 参数构造函数的代码。\n\n你应该注意 C# 语言的一个重要特性：如果你为类编写了自己的构造函数，编译器就不会生成默认构造函数。因此，如果你编写了接受一个或多个参数的构造函数，并且还需要一个默认构造函数，你需要自己编写它。\n\
  \n## 部分类\n\n类可以包含许多方法、字段和构造函数，以及后续章节中讨论的其他项目。功能强大的类可能会变得很大。在 C# 中，你可以将类的源代码拆分为单独的文件，以便将大类的定义组织成更容易管理的小部分。此功能被\
  \ Visual Studio 2015 用于通用平台 (UWP) 应用，其中开发者可以编辑的源代码维护在单独的文件中，与 Visual Studio 每当表单布局更改时生成的代码分开来。\n\
  \n\n\n\n当你将一个类拆分到多个文件时，你可以在每个文件中使用 `partial` 关键字来定义类的各个部分。例如，如果 `Circle` 类被拆分在名为\
  \ `circ1.cs`（包含构造函数）和 `circ2.cs`（包含方法和字段）两个文件中，那么 `circ1.cs` 的内容如下：\n\n点击此处查看代码图像\n\
  \n```csharp\npartial class Circle\n{\n    public Circle() //默认构造函数\n    {\n    \
  \    this.radius = 0;\n    }\n\n    public Circle(int initialRadius) // 重载构造函数\n\
  \    {\n        this.radius = initialRadius;\n    }\n}\n```\n\n`circ2.cs` 的内容如下：\n\
  \n点击此处查看代码图像\n\n```csharp\npartial class Circle\n{\n    private int radius;\n  \
  \  public double Area()\n    {\n        return Math.PI * this.radius * this.radius;\n\
  \    }\n}\n```\n\n当你编译一个已拆分为单独文件的类时，你必须将所有文件提供给编译器。\n\n***\n\n在接下来的练习中，你将声明一个模拟二维空间中点的类。该类将包含两个私有字段，用于存储点的\
  \ x 和 y 坐标，并提供初始化这些字段的构造函数。你将使用 `new` 关键字并调用构造函数来创建类的实例。\n\n### 编写构造函数并创建对象\n\n\
  **1.** 如果 Visual Studio 2015 尚未运行，请启动它。\n\n**2.** 打开 `Classes` 项目，它位于你文档文件夹中的 `\\\
  Microsoft Press\\VCSBS\\Chapter 7\\Classes` 文件夹。\n\n**3.** 在解决方案管理器中，双击 `Program.cs`\
  \ 文件，以在代码和文本编辑器窗口中显示它。\n\n**4.** 在 `Program` 类中，找到 `Main` 方法。\n\n`Main` 方法调用了 `doWork`\
  \ 方法，该方法封装在一个 `try` 块中，并在其后跟了一个 `catch` 异常处理程序。通过这个 `try/catch` 块，你可以将通常放在 `Main`\
  \ 方法中的代码写在 `doWork` 方法中，并放心地知道它可以捕获并处理任何异常。`doWork` 方法目前只包含一个 `// TODO:` 注释。\n\n\
  ***\n\n![图像](img/Image00013.jpg) 提示\n\n开发者经常使用 TODO 注释作为提醒，告诉他们他们留了一段代码需要稍后处理。这些注释通常包含对要执行工作的描述，例如\
  \ `// TODO: Implement the doWork method`。Visual Studio 识别这种形式的注释，你可以通过“任务列表”窗口快速定位应用程序中任何地方的注释。要显示此窗口，在“视图”菜单上点击“任务列表”。任务列表窗口默认打开代码和文本编辑器窗口下方。所有的\
  \ TODO 注释都会被列出来。然后你可以双击这些注释中的任何一个，直接跳转到相应的代码，代码将在代码和文本编辑器窗口中显示。\n\n![图像](img/Image00070.jpg)\n\
  \n***\n\n**5.** 在代码和文本编辑器窗口中显示 `Point.cs` 文件。\n\n此文件定义了一个名为 `Point` 的类，你将用它来表示二维空间中点的位置，该位置由一对\
  \ x 和 y 坐标定义。除了另一个 `// TODO:` 注释外，`Point` 类目前是空的。\n\n**6.** 返回 `Program.cs` 文件。在\
  \ `Program` 类中，编辑 `doWork` 方法的主体，并将 `// TODO:` 注释替换为以下语句：\n\n```csharp\nPoint origin\
  \ = new Point();\n```\n\n此语句创建了 `Point` 类的一个新实例并调用了它的默认构造函数。\n\n**7.** 在“生成”菜单上，点击“生成解决方案”。\n\
  \n代码无错误地生成，因为编译器会自动为 `Point` 类生成默认构造函数的代码。然而，你无法看到此构造函数的 C# 代码，因为编译器没有生成任何源代码语言语句。\n\
  \n**8.** 返回到 `Point.cs` 文件中的 `Point` 类。将 `// TODO:` 注释替换为接受两个 `int` 参数（命名为 `x` 和\
  \ `y`）的公共构造函数，并调用 `Console.WriteLine` 方法将这些参数的值显示在控制台上，如下方的代码示例中的**粗体类型**所示：\n\n\
  点击此处查看代码图像\n\n```csharp\nclass Point\n{\n    public Point(int x, int y)\n    {\n\
  \        Console.WriteLine($\"x:{x}, y:{y}\");\n    }\n}\n```\n\n**9.** 在“生成”菜单上，点击“生成解决方案”。\n\
  \n编译器现在报告了一个错误：\n\n点击此处查看代码图像\n\n没有与 'Point.Point(int, int)' 所需的形式参数 'x' 对应的参数。\n\
  \n这条相当冗长的信息的意思是，`doWork` 方法中对默认构造函数的调用现在无效了，因为不再存在默认构造函数了。你为 `Point` 类编写了自己的构造函数，因此编译器不再生成默认构造函数。你现在将通过编写自己的默认构造函数来修复此。\n\
  \n**10.** 编辑 `Point` 类，添加一个公共的默认构造函数，该构造函数调用 `Console.WriteLine` 来写入字符串“Default\
  \ constructor”，如下所示：\n\n点击此处查看代码图像\n\n```csharp\nclass Point\n{\n    public Point()\n\
  \    {\n        Console.WriteLine(\"Default constructor\");\n    }\n\n    public\
