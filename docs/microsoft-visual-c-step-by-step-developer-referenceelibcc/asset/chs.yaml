  \n### 使用算术运算符\n\nC# 支持你童年学过的常规算术运算：用于加法的加号 (`+`)、用于减法的减号 (`–`)、用于乘法的星号 (`*`) 以及用于除法的斜杠\
  \ (`/`)。符号 `+`、`–`、`*` 和 `/` 被称为 `operators`（运算符），因为它们对值进行“操作”以创建新值。在以下示例中，变量 `moneyPaidToConsultant`\
  \ 存储 750（日薪）和 20（顾问受雇的天数）的乘积：\n\n点击此处查看代码图像\n\n```cs\nlong moneyPaidToConsultant;\n\
  moneyPaidToConsultant = 750 * 20;\n```\n\n***\n\n![Image](img/Image00005.jpg) 备注\n\
  \n运算符执行其功能的值被称为 `operands`（操作数）。在表达式 `750 * 20` 中，`*` 是运算符，而 `750` 和 `20` 是操作数。\n\
  \n***\n\n### 运算符与类型\n\n并不是所有的运算符都适用于所有数据类型。可以在值上使用的运算符取决于该值的类型。例如，你可以对 `char`、`int`、`long`、`float`、`double`\
  \ 或 `decimal` 类型的值使用所有算术运算符。然而，除了加法运算符 (`+`) 外，你不能对 `string` 类型的值使用算术运算符，也不能对 `bool`\
  \ 类型的值使用其中任何一个运算符。因此，以下语句是不允许的，因为 `string` 类型不支持减法（从一个字符串中减去另一个是没有意义的）：\n\n点击此处查看代码图像\n\
  \n```cs\n// 编译错误\nConsole.WriteLine(\"Gillingham\" - \"Forest Green Rovers\");\n\
  ```\n\n但是，你可以使用 `+` 运算符来拼接字符串值。你需要小心，因为这可能会导致意外的结果。例如，以下语句向控制台写入了“431”（而不是“44”）：\n\
  \n点击此处查看代码图像\n\n```cs\nConsole.WriteLine(\"43\" + \"1\");\n```\n\n***\n\n![Image](img/Image00013.jpg)\
  \ 提示\n\n.NET Framework 提供了一个名为 `Int32.Parse` 的方法，如果你需要对以字符串形式存储的值进行算术计算，可以使用它将字符串值转换为整数。\n\
  \n***\n\n### 字符串插值\n\nC# 最新版本中的新特性是字符串插值（string interpolation），它使得许多用于拼接字符串的 `+`\
  \ 运算符变得过。\n\n字符串拼接的常见用途是生成包含变量值的字符串值。你在第 1 章 创建图形应用程序的练习中看到了这个示例。在 `okClick` 方法中，你添加了以下行代码：\n\
  \n```cs\nMessageDialog msg = new MessageDialog(\"Hello \" + userName.Text);\n```\n\
  \n字符串插值允许你使用以下语法代替：\n\n```cs\nMessageDialog msg = new MessageDialog($\"Hello {userName.Text}\"\
  );\n```\n\n字符串开头的 `$` 符号表示它是一个插值字符串，`` 和 `}` 字符之间的任何表达式都应该被求值并将结果替换在相应位置。如果没有开头的\
  \ `$` 符号，字符串 `{username.Text}` 将被字面处理。\n\n字符串插值比使用 `+` 运算符更高效。（由于 .NET Framework\
  \ 处理字符串的方式，使用 `+` 运算符进行字符串拼接可能会消耗大量内存。）字符串插值认为更具可读性且不易出错。\n\n你还应该意识到算术运算结果的类型取决于所用操作数的类型。例如，表达式\
  \ `5.0/2.0` 的值为 `2.5`；两个操作数的类型都是 `double`，因此结果的类型也是 `double`。（在 C# 中，带有小数点的字面量始终是\
  \ `double` 而不是 `float`，以保持尽可能性。）然而，表达式 `5/2` 的值为 `2`。在这种情况下，两个操作数的类型都是 `int`，因此结果的类型也是\
  \ `int`。在这样的情况下，C# 总是向零舍入。如果混合操作数的类型，情况会变得复杂一点。例如，表达式 `5/2.0` 一个 `int` 和一个 `double`。C#\
  \ 编译器检测到不匹配并生成代码，在执行操作之前将 `int` 转换为 `double`。\n\n\n\n\n\n表达式框中的文本变为了 `54 % 13`，但再次在结果文本框中出现了值\
  \ `0`。尝试其他数字和操作符的组合；你会发现它们目前都会产生值 `0`。\n\n***\n\n![Image](img/Image00005.jpg) 注意事项\n\
  \n如果你在任一一个操作数框中输入非整数值，应用程序将检测到错误并显示消息“输入字符串不是正确的格式。”你将在第 6 章中的“管理错误和异常”中学习更多关于如何捕获和处理错误与异常。\n\
