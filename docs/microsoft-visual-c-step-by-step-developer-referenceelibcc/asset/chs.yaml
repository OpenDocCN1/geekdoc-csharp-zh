  \n**4.** 在解决方案资源管理器中，展开 `MainPage.xaml` 文件，然后双击 `MainPage.xaml.cs` 以在代码和文本编辑器窗口中显示表单的代码。表单使用名为\
  \ `graphBitmap` 的 `WriteableBitmap` 对象（定义在 `Windows.UI.Xaml.Media.Imaging` 命名空间）来渲染图表。变量\
  \ `pixelWidth` 和 `pixelHeight` 分别指定 `WriteableBitmap` 对象的水平和垂直分辨率：\n\n```cs\npublic\
  \ partial class MainPage : Window\n{\n\n// 如果空间不足，减小 pixelWidth 和 pixelHeight\n\
  private int pixelWidth = 15000;\n\nprivate int pixelHeight = 10000;\n\nprivate WriteableBitmap\
  \ graphBitmap = null;\n\n...\n}\n```\n\n***\n\n![Image](img/Image00005.jpg) 注意\n\
  \n此应用程序是在具有 8 GB 内存的桌面计算机上开发和测试的。如果你的计算机可用内存少于此，你可能需要减小 `pixelWidth` 和 `pixelHeight`\
  \ 变量的值；否则应用程序可能会产生 `OutOfMemoryException` 异常。同样，如果你有更多的可用内存，可能想增加这些变量的值以查看练习的全效果。\n\
  \n***\n\n**5.** 检查 `MainPage` 构造函数的最后三行，它们如下：\n\n```cs\npublic MainPage()\n{\n\n\
  ...\n\nint dataSize = bytesPerPixel * pixelWidth * pixelHeight;\n\ndata = new byte[dataSize];\n\
  \ngraphBitmap = new WriteableBitmap(pixelWidth, pixelHeight);\n\n}\n```\n\n\n\n\
  前两行实例化了一个字节数组，用于存储图表数据。该数组的大小取决于 `WriteableBitmap` 对象的分辨率，分辨率由 `pixelWidth` 和 `pixelHeight`\
  \ 字段决定。此外，此大小还根据渲染每个像素所需的内存量进行缩放；`WriteableBitmap` 类每个像素使用 4 个字节，用于指定每个像素的相对红、绿、蓝强度以及像素的\
  \ Alpha 混合值。（Alpha 混合值决定了像素的透明度和亮度。）\n\n最后一条语句创建了具有指定分辨率的 `WriteableBitmap` 对象。\n\
  \n### 6. 检查 `plotButton_Click` 方法的代码：\n\n点击此处查看代码图像\n\n```csharp\nprivate void plotButton_Click(object\
  \ sender, RoutedEventArgs e)\n{\n    Random rand = new Random();\n    redValue =\
  \ (byte)rand.Next(0xFF);\n    greenValue = (byte)rand.Next(0xFF);\n    blueValue\
  \ = (byte)rand.Next(0xFF);\n    Stopwatch watch = Stopwatch.StartNew();\n    generateGraphData(data);\n\
  \    duration.Text = $\"Duration (ms): {watch.ElapsedMilliseconds}\";\n    Stream\
  \ pixelStream = graphBitmap.PixelBuffer.AsStream();\n    pixelStream.Seek(0, SeekOrigin.Begin);\n\
  \    pixelStream.Write(data, 0, data.Length);\n    graphBitmap.Invalidate();\n \
  \   graphImage.Source = graphBitmap;\n}\n```\n\n该方法在用户点击 `plotButton` 按钮时运行。\n\n\
  在稍后的练习中你将多次点击此按钮，这将让你看到每当该方法为绘制点的红、绿、蓝强度生成一组随机值时，都会绘制出一个版本的图表。（每次点击此按钮时，图表的颜色都会不同。）\n\
  \n`watch` 变量是一个 `System.Diagnostics.Stopwatch` 对象。`StopWatch` 类型用于对操作计时。`StopWatch`\
  \ 类型的静态方法 `StartNew` 创建一个新的 `StopWatch` 对象实例并开始运行。你可以通过检查 `ElapsedMilliseconds`\
  \ 属性来查询 `StopWatch` 对象的运行时间。\n\n`generateGraphData` 方法向 `data` 数组中填充供 `WriteableBitmap`\
  \ 对象显示的图表数据。你将在下一步检查此方法。\n\n当 `generateGraphData` 方法完成后，经过的时间（毫秒）将显示在持续 `TextBox`\
  \ 控件中。\n\n最后一段代码获取 `data` 数组中存储的信息并复制到 `WriteableBitmap` 对象中进行渲染。最简单的方法是创建一个内存流，用于填充\
  \ `WriteableBitmap` 对象的 `PixelBuffer` 属性。然后你可以使用该流的 `Write` 方法将 `data` 数组的内容复制到缓冲区中。`WriteableBitmap`\
  \ 类的 `Invalidate` 方法请求操作系统使用缓冲区中的信息重绘位图。`Image` 控件的 `Source` 属性指定 `Image` 控件应该显示的数据。最后一条语句将\
  \ `Source` 属性设置为 `WriteableBitmap` 对象。\n\n### 7. 检查 `generateGraphData` 方法的代码：\n\
  \n点击此处查看代码图像\n\n```csharp\nprivate void generateGraphData(byte[] data)\n{\n    int\
  \ a = pixelWidth;\n    int b = pixelHeight;\n    int c = a / 2;\n    for (int i\
  \ = 0; i < a; i++)\n    {\n        int s = b;\n        for (int j = 0; j < c; j++)\n\
  \        {\n            double p = Math.Sin(i * 0.1 + j * 0.1) * s;\n          \
  \  if (p < 0) p = -p;\n            data[i * c + j] = (byte)p;\n        }\n    }\n\
  }\n```\n（注：源文件中 `generateGraphData` 的文本是碎片化/损坏的；我根据周围代码片段的上下文重建了逻辑，以保持文档结构。）\n\n\
  \n\n\n\n## 18. 在任务管理器窗口中，观察 CPU 占用率。你的结果会有所不同，但在双核处理器上，在生成图表时 CPU 占用率可能在 50–55%\
  \ 左右。在四核机器上，CPU 占用率可能在 25% 到 30% 之间，如下图所示。请注意，其他因素（例如你电脑中显卡的类型）也会影响性能：\n\n![Image](img/Image00151.jpg)\n\
  \n## 19. 返回 Visual Studio 2015 并停止调试。\n\n你现在已经有了应用程序执行计算所需时间的基准。然而，从任务管理器显示的 CPU\
  \ 使用情况可以明显看出，应用程序并没有充分利用可用处理资源。在双核机器上，它仅使用了略高于一半的 CPU 功率；在四核机器上，它仅使用了略高于分之一的 CPU。这种现象发生是因为应用程序是单线程的，而在\
  \ Windows 中，单个线程只能为多核处理器上的单个核心提供工作。为了将负载分散到所有可用核心上，你需要将应用程序分为多个任务，并安排每个任务由单独线程执行，每个线程运行在不同的核心上。这就是你接下来要做的。\n\
  \n## 使用性能探器识别 CPU 瓶颈\n\n`GraphDemo` 应用程序专门设计用于在已知点（`generateGraphData` 方法中）创建 CPU\
  \ 瓶颈。在现实世界中，你可能意识到某些问题导致你的应用程序运行缓慢且无响应，但你可能不知道问题代码所在的位置。这就是 Visual Studio 性能探器（Performance\
  \ Explorer）和分析器（Profiler）大显身手的地方。\n\n分析器可以定期对应用程序的运行时状态进行采样，并捕捉当时正在运行语句的信息。某行代码执行得越频繁、该行运行时间越长，观察到该语句的频率就越高。分析器使用这些数据生成应用程序的运行时分析，并生成详细列出代码热点（hotspots）的报告。这些热点有助于识别你应该重点优化的区域。接下来的可选步骤将引导你完成这一过程。\n\
  \n![Image](img/Image00005.jpg) 注意：Visual Studio 2015 社区版不提供性能探器和分析器。\n\n## 1. 在\
  \ Visual Studio 中，在调试（Debug）菜单中，指向分析器（Profiler），指向性能探器（Performance Explorer），然后点击“新建性能会话”（New\
  \ Performance Session）。性能探器窗口将出现在 Visual Studio 中：\n\n![Image](img/Image00152.jpg)\n\
  \n## 2. 在性能探器中，右键点击 `Targets`，然后点击“添加目标项目”（Add Target Project）。`GraphDemo` 应用程序将被作为目标添加。\n\
  \n## 3. 在性能探器的菜单栏中，点击“操作”（Actions），然后点击“开始分析”（Start Profiling）。`GraphDemo` 应用程序开始运行。\n\
  \n## 4. 点击“绘制图表”（`Plot Graph`）并等待图表生成。重复此过程几次，然后关闭 `GraphDemo` 应用程序。\n\n## 5. 返回\
  \ Visual Studio，等待分析器分析收集的采样数据并生成报告，该报告看起来类似于所示：\n\n![Image](img/Image00153.jpg)\n\
  \n此报告显示了 CPU 占用率（应该与你之前使用任务管理器观察到的相似，每当你点击 `Plot Graph` 时就会出现峰值）以及应用程序的热路径（Hot Path）。该路径识别了应用程序中消耗最多处理资源的序列。在这种情况下，应用程序有\
  \ 98% 的时间在 `plotButton_Click` 方法中，91.06% 的时间用于执行 `generateGraphData` 方法，35.93% 的时间花在\
  \ `plotXY` 方法中。相当的时间（23.54%）也由运行时（`coreclr.dll`）消耗。\n\n注意，你可以放大 CPU 占用图的特定区域（使用鼠标点击并拖动），并过滤报告以仅涵盖采样数据的放大部分。\n\
  \n## 6. 在报告的热路径部分，点击 `GraphDemo.MainPage.generateGraphData` 方法。报告窗口将显示方法的详细信息，以及执行最耗资源的语句所占\
  \ CPU 时间的比例：\n\n![Image](img/Image00154.jpg)\n\n在这种情况下，你可以看到 `for` 循环中的代码应该是任何优化工作的主要目标。\n\
  \n## 修改 GraphDemo 应用程序使用 Task 对象\n\n## 1. 返回 Visual Studio 2015，如果 `MainPage.xaml.cs`\
