  \ 没有多维数组；相反，你可以完全按照刚才描述的那样创建数组的数组。\n\n***\n\n在接下来的练习中，你将使用数组来实现一个处理扑牌游戏部分的应用程序。应用程序将显示一个表单，其中从一副标准的（52\
