  \n## 第 17 章 介绍泛型\n\n完成本章后，你将能够：\n\n![Image](img/Image00001.jpg) 解释泛型的目的。\n\n![Image](img/Image00001.jpg)\
  \ 使用泛型定义类型安全的类。\n\n![Image](img/Image00001.jpg) 根据指定为类型参数的类型创建泛类的实例。\n\n![Image](img/Image00001.jpg)\
  \ 实现泛型接口。\n\n![Image](img/Image00001.jpg) 定义泛型方法，该方法实现一个与其操作的数据类型无关的算法。\n\n第 8 章，“理解值和引用](#text00014.html_ch08)”，将向你展示如何使用\
  \ `object` 类型来引用任何类的实例。你可以使用 `object` 类型存储任何类型的值，并且在需要向方法传递任何类型的值时，可以使用 `object`\
  \ 类型来定义参数。方法也可以通过指定 `object` 为返回类型来返回任何类型的值。尽管这种做法非常灵活，但它将责任留在了程序员身上，让他们记住实际使用的是什么类型的数据。如果程序员犯了错误，可能会导致运行时错误。在本章中，你将学习泛型，这是一种旨在帮助你防止此类错误的特性。\n\
  \n### `object` 类型存在的问题\n\n为了理解泛型，值得详细查看它们设计用来解决的问题。\n\n假设你需要建模一个先入先出的结构，例如队列。你可以创建一个如下的类：\n\
  \n点击此处查看代码图像\n\n```csharp\nclass Queue\n{\n    private const int DEFAULTQUEUESIZE\
  \ = 100;\n    private int[] data;\n    private int head = 0, tail = 0;\n    private\
  \ int numElements = 0;\n\n    public Queue()\n    {\n        this.data = new int[DEFAULTQUEUESIZE];\n\
  \    }\n\n    public Queue(int size)\n    {\n        if (size > 0)\n        {\n\
  \            this.data = new int[size];\n        }\n        else\n        {\n  \
  \          throw new ArgumentOutOfRangeException(\"size\", \"Must be greater than\
  \ zero\");\n        }\n    }\n\n    public void Enqueue(int item)\n    {\n     \
  \   if (this.numElements == this.data.Length)\n        {\n            throw new\
  \ Exception(\"Queue full\");\n        }\n        this.data[this.head] = item;\n\
  \        this.head++;\n        this.head %= this.data.Length;\n        this.numElements++;\n\
  \    }\n\n    public int Dequeue()\n    {\n        if (this.numElements == 0)\n\
  \        {\n            throw new Exception(\"Queue empty\");\n        }\n     \
  \   int queueItem = this.data[this.tail];\n        this.tail++;\n        this.tail\
  \ %= this.data.Length;\n        this.numElements--;\n        return queueItem;\n\
  \    }\n}\n```\n\n该类使用数组来提供一个用于存储环缓冲区。此数组的大小由构造函数指定。应用程序使用 `Enqueue` 方法向队列添加项，使用\
  \ `Dequeue` 方法从队列中取出项。私有的 `head` 和 `tail` 字段跟踪向数组中插入项以及从数组中检索项的位置。`numElements`\
  \ 字段指示数组中有多少元素。\n\n\n\n\n\n如果你不对返回值进行强制转换，将得到编译错误“无法隐式将类型 'object' 转换为 'Horse'”。这种执行显式强制转换的要求在很大程度上降低了\
  \ `object` 类型所提供的灵活性。此外，很容易编写出如下代码：\n\n点击此处查看代码图像\n\n```cs\nQueue queue = new Queue();\n\
  \nHorse myHorse = new Horse();\n\nqueue.Enqueue(myHorse);\n\n...\n\nCircle myCircle\
  \ = (Circle)queue.Dequeue(); // 运行时错误\n```\n\n尽管这段代码可以通过编译，但它是无效的，并在运行时抛出 `System.InvalidCastException`\
  \ 异常。该错误是由于在出队时尝试将一个 `Horse` 的引用存储在 `Circle` 变量中引起的，而这两种类型是不兼容的。这个错误直到运行时才被检测到，因为编译器没有足够的信息在编译时执行此检查。出队对象的真实类型只有在代码运行时才会变得显而易见。\n\
  \n使用 `object` 方法创建通用类和方法的另一个缺点是，如果运行时需要将 `object` 转换为值类型并反向转换，可能会消耗额外的内存和处理器时间。考虑以下这段处理\
  \ `int` 值值队列的代码：\n\n点击此处查看代码图像\n\n```cs\nQueue queue = new Queue();\n\nint myInt\
  \ = 99;\n\nqueue.Enqueue(myInt); // 将 int 装箱为 object\n\n...\n\nmyInt = (int)queue.Dequeue();\
  \ // 将 object 拆箱为 int\n```\n\n`Queue` 数据类型期望其包含的项是对象，而 `object` 是引用类型。入队一个值类型（如\
  \ `int`）需要对其进行装箱（boxing）以转换为引用类型。同样，出队到 `int` 需要对该项进行拆箱（unboxing）以转换回值类型。（更多细节请参见第\
  \ 8 章 中的“[装箱 (Boxing)””和“[拆箱 (Unboxing)””章节）。虽然装箱和拆箱是透明发生的，但由于它们涉及动态内存分配，因此会增加性能开销。对于每个项目来说，这种开销很小，但当程序创建大量值类型的队列时，这种开销就会累积。\n\
  \n### 泛型解决方案\n\nC# 提供了泛型（generics）来消除强制转换的需求，提高类型安全性，减少所需的装箱次数，并使创建通用类和方法变得更容易。泛型类和方法接受`type\
  \ parameters`，这些参数指定了它们所操作对象的类型。在 C# 中，你通过在角括号中提供类型参数来指示一个类是泛型类，如下：\n\n```cs\nclass\
  \ Queue<T>\n{\n    ...\n}\n```\n\n示例中的 `T` 充当编译时真实类型的占位符。当你编写代码来实例化泛型 `Queue` 时，你提供了了应该替换\
  \ `T` 的类型（`Circle`、`Horse`、`int` 等）。当你在类中定义字段和方法时，使用这个相同的占位符来指示这些项的类型，如下：\n\n```cs\n\
  class Queue<T>\n{\n    ...\n\n    private T[] data; // 数组类型为 'T'，'T' 是类型参数\n\n \
  \   ...\n\n    public Queue()\n    {\n        this.data = new T[DEFAULTQUEUESIZE];\
  \ // 使用 'T' 作为数据类型\n    }\n\n    public Queue(int size)\n    {\n        ...\n  \
  \      this.data = new T[size];\n        ...\n    }\n\n    public void Enqueue(T\
  \ item) // 使用 'T' 作为方法参数的类型\n    {\n        ...\n    }\n\n    public T Dequeue()\
  \ // 使用 'T' 作为返回值的类型\n    {\n        T queueItem = this.data[this.tail]; // 数组中的数据类型为\
  \ 'T'\n        ...\n        return queueItem;\n    }\n}\n```\n\n类型参数 `T` 可以是合法的\
  \ C# 标识符，尽管通常使用单个字符 `T`。当你创建 `Queue` 对象时，它会被你指定的类型所替换。以下示例创建了一个 `int` 类型的 `Queue`\
  \ 和一个 `Horse` 类型的 `Queue`：\n\n```cs\nQueue<int> intQueue = new Queue<int>();\n\n\
  Queue<Horse> horseQueue = new Queue<Horse>();\n```\n\n编译器现在有了足够的信息来执行严格的类型检查，你不再需要进行强制转换。对于\
  \ `intQueue` 队列，方法如下：\n\n```cs\nintQueue.Enqueue(99);\nint value = intQueue.Dequeue();\n\
  ```\n\n对于 `horseQueue` 队列，方法如下：\n\n```cs\nhorseQueue.Enqueue(myHorse);\nHorse myHorse\
  \ = horseQueue.Dequeue();\n```\n\n\n\n\n将此与 `Queue<T>` 类进行比较。每当你使用类型参数使用类（例如 `Queue<int>`\
  \ 或 `Queue<Horse>`）时，你会导致编译器生成一个全新的类，该类恰好具有由泛型类定义的功能。这意味着 `Queue<int>` 与 `Queue<Horse>`\
  \ 是完全不同的类型，但它们恰好具有相同的行为。你可以将泛型类认为是一个定义了模板的类，然后由编译器根据需要生成新的特定类型的类。泛型类的特定类型版本（`Queue<int>`、`Queue<Horse>`\
  \ 等）被称为*构造类型*（constructed types），你应当将它们视为截然不同的类型（尽管它们具有相似的方法和属性集）。\n\n## 泛型与约束\n\
  \n有时，你可能希望确保泛型类使用的类型参数标识一个提供特定方法的类型。例如，如果你正在定义一个 `PrintableCollection` 类，你可能希望存储在类中的所有对象都具有\
  \ `Print` 方法。你可以通过使用*约束*（constraint）来指定此条件。\n\n通过使用约束，你可以将泛型类的类型参数限制为特定接口集合的类型，从而提供这些接口定义的方法。例如，如果\
  \ `IPrintable` 接口定义了 `Print` 方法，你可以这样创建 `PrintableCollection` 类：\n\n点击此处查看代码图像\n\
  \n```sharp\npublic class PrintableCollection<T> where T : IPrintable\n```\n\n当你使用类型参数构建此类时，编译器会检查并确保用于\
  \ `T` 的类型实际上实现了 `IPrintable` 接口；如果没有实现，它将停止编译并报告编译错误。\n\n## 创建泛型类\n\n.NET Framework\
  \ 类库中的 `System.Collections.Generic` 命名空间包含了许多供你使用的泛型类。你也可以定义自己的泛型类，这就是你将在本节中要做的。在在此之前，让我们介绍一些背景理论。\n\
  \n### 二叉树的理论\n\n在接下来的练习中，你将定义并使用一个表示二叉树的类。\n\n*二叉树*（binary tree）是一种用的数据结构，你可以将其用于各种操作，包括快速对数据进行排序和搜索。有很多专门介绍二叉树细节的书，但本书并不是详细介绍这一主题。相反，你将只关注相关的事实。如果你对学习更多知识感兴趣，可以参阅\
  \ Donald E. Knuth 所著《计算机程序设计艺术第 3 卷：排序与搜索，第 2 版》（Addison-Wesley Professional, 1998）。尽管年代久远，但它是排序和搜索算法领域公认的开创性著作。\n\
  \n二叉树是一种递归的（自引用的）数据结构，可以是空的，也可以包含三个元素：一个数据（通常称为*节点*，node）以及两个子树，子树本身也是二叉树。按照习惯，这两个子树分别被称为*左子树*（left\
  \ subtree）和*右子树*（right subtree），因为它们通常被描绘在节点的左侧和右侧。每个左子树或右子树为空或包含一个节点和其他子树。理论上，整个结构可以无限延伸。下面的图像显示了一个小型二叉树的结构。\n\
  \n![Image](img/Image00119.jpg)\n\n当你用二叉树进行数据排序时，它的真正威力就显而易见了。如果你从一个相同类型的无序对象序列开始，可以构建一个有序的二叉树，然后遍历树以按顺序访问每个节点。将项目\
  \ `I` 插入到有序二叉树 `B` 中的算法所示：\n\n点击此处查看代码图像\n\n```\n如果树 B 是空的\n那么\n    构建一个新树 B，将新项目\
  \ I 作为节点，并使左和\n    右子树为空\n否则\n    检查树 B 中当前节点 N 的值\n    如果 N 的值大于新项目 I\n    Then\n\
  \        如果 B 的左子树为空\n        Then\n            构建 B 的新左子树，将项目 I 作为节点，并使左和     \
  \       右子树为空\n        Else\n            将 I 插入到 B 的左子树\n    End If\n    Else\n\
  \        如果 B 的右子树为空\n        Then\n            构建 B 的新右子树，将项目 I 作为节点，并使左和     \
  \       右子树为空\n        Else\n            将 I 插入到 B 的右子树\n        End If\n    End\
  \ If\nEnd If\n```\n\n注意，该算法是递归的，它会根据项目值与树中当前节点的比较结果，调用自己将项目插入到左子树或右子树。\n\n***\n\n\
  ![Image](img/Image00005.jpg) 注意\n\n*大于*（greater than）表达式的定义取决于项目和节点中数据的类型。对于数值数据，“大于”可以是简单的算术比较；对于文本数据，它可以是字符串比较；然而，你必须为其他形式的数据提供它们自己的比较值的方法。你将在后续章节“[使用泛型构建二叉树类”中学习更多内容。\n\
  \n***\n\n如果你从一个空二叉树和一个无序对象序列开始，你可以遍历该无序序列，使用此算法将每个对象插入二叉树，从而得到有序树。下一张图像显示了从整数集合构建树的过程。\n\
  \n![Image](img/Image00120.jpg)\n\n在构建好有序树后，你可以通过依次访问每个节点并打印值来按顺序显示其内容。实现此任务的算法也是递归的：\n\
  \n点击此处查看代码图像\n\n```\n如果左子树不为空\n那么\n    显示左子树的内容\nEnd If\n打印节点的值\n如果右子树不为空\n那么\n\
  \    显示右子树的内容\nEnd If\n```\n\n下面的图像显示了输出树的过程步骤。注意，整数现在按升序排列显示。\n\n![Image](img/Image00121.jpg)\n\
  \n### 使用泛型构建二叉树类\n\n在接下来的练习中，你将使用泛型定义一个能够持有任何类型数据的二叉树类。唯一的限制是数据类型必须提供一种在不同实例之间比较值的方法。\n\
  \n二叉树类是一个在许多不同应用中可能非常有用的类。因此，你将将其实现为一个类库，而不是一个应用程序本身。这样你就可以其他地方使用该类，而无需复制源代码并重新编译。*类库*（class\
  \ library）是一组存储在程序集的编译类（以及其他类型，如结构和委托）。程序集通常是一个带有 .dll 后缀的文件。其他项目和应用程序可以通过添加对其程序集的引用，然后通过使用\
  \ *using* 指令将其命名空间引入作用域，来使用类库中的项。你将在测试二叉树类时执行操作。\n\n***\n\n### System.IComparable\
  \ 和 System.IComparable<T> 接口\n\n向二叉树插入节点的算法要求你将正在插入的节点值与树中已有的节点进行比较。如果你使用数值类型（如\
  \ `int`），可以使用 `<`、`>` 和 `==` 运算符。然而，如果你使用其他类型（例如早期章节中描述的 `Mammal` 或 `Circle`），你如何比较对象呢？\n\
  \n\n\n\n\n如果你需要创建一个类，并要求根据某种自然（或可能不自然）的顺序对值进行比较，那么你应该实现 `IComparable` 接口。该接口包含一个名为\
  \ `CompareTo` 的方法，它接受一个参数，用于指定与当前实例进行比较的对象，并返回一个指示比较结果的整数，如下表所示。\n\n![Image](img/Image00122.jpg)\n\
  \n作为一个示例，考虑在 第 7 章 中描述的 `Circle` 类。让我们在这里再次查看它：\n\n点击此处查看代码图像\n\n```csharp\nclass\
  \ Circle\n{\n    public Circle(int initialRadius)\n    {\n        radius = initialRadius;\n\
  \    }\n\n    public double Area()\n    {\n        return Math.PI * radius * radius;\n\
  \    }\n\n    private double radius;\n}\n```\n\n你可以通过实现 `System.IComparable` 接口并提供\
  \ `CompareTo` 方法来使 `Circle` 类变得“可比较的”。在这个示例中，`CompareTo` 方法根据面积比较 `Circle` 对象。面积较大的圆被认为大于面积较小的圆。\n\
  \n点击此处查看代码图像\n\n```csharp\nclass Circle : System.IComparable\n{\n    ...\n    public\
  \ int CompareTo(object obj)\n    {\n        Circle circObj = (Circle)obj; // 将参数强制转换为其真实类型\n\
  \        if (this.Area() == circObj.Area())\n            return 0;\n        if (this.Area()\
  \ > circObj.Area())\n            return 1;\n        return -1;\n    }\n}\n```\n\n\
  如果你查看 `System.IComparable` 接口，你会发现它的参数被定义为 `object`。然而，这种方法并不是类型安全的。为了理解为什么这样，请考虑如果你尝试向\
  \ `CompareTo` 方法传递一个不是 `Circle` 的对象会发生什么。`System.IComparable` 接口要求使用强制转换来访问 `Area`\
  \ 方法。如果参数不是 `Circle` 而是其他类型的对象，则该强制转换将失败。然而，`System` 命名空间还定义了泛型 `IComparable<T>`\
  \ 接口，它包含以下方法：\n\n```csharp\nint CompareTo(T other);\n```\n\n注意，此方法接受一个类型参数 `T` 而不是\
  \ `object`，因此它比非泛型版本的接口安全得多。下面的代码显示了你如何在 `Circle` 类中实现此接口：\n\n点击此处查看代码图像\n\n```csharp\n\
  class Circle : System.IComparable<Circle>\n{\n    ...\n    public int CompareTo(Circle\
  \ other)\n    {\n        if (this.Area() == other.Area())\n            return 0;\n\
  \        if (this.Area() > other.Area())\n            return 1;\n        return\
  \ -1;\n    }\n}\n```\n\n`CompareTo` 方法的参数必须与接口中指定的类型 `IComparable<Circle>` 匹配。通常情况下，实现\
  \ `System.IComparable<T>` 接口比实现 `System.IComparable` 接口更好。你也可以实现两者，就像 .NET Framework\
  \ 中的许多类型所做的那样。\n\n***\n\n# 创建 `Tree<TItem>` 类\n\n1. 如果 Microsoft Visual Studio 2015\
  \ 尚未运行，请启动它。\n2. 在“文件”菜单上，指向“新建”，然后点击“项目”。\n3. 在“新建项目”对话框中，在左侧的模板面板上点击“Visual C#”。在中间面板中，选择“类库”模板。在“名称”框中，输入\
  \ `BinaryTree`。在“位置”框中，在你的文档文件夹指定 `\\Microsoft Press\\VCSBS\\Chapter 17`，然后点击确定。\n\
  \n***\n\n![Image](img/Image00005.jpg) 注意\n\n使用类库模板，你可以创建被多个应用程序使用的程序集。要在应用程序中使用类库中的类，你必须先将包含类库编译代码的程序集复制到计算机（如果你没有自己创建它），然后添加此程序集的引用。\n\
  \n***\n\n4. 在“解决方案管理器”中，右键点击 `Class1.cs`，点击“重命名”，然后将文件名更改 `Tree.cs`。当提示时，允许 Visual\
  \ Studio 同时更改类名和文件名。\n5. 在“代码和文本编辑器”窗口中，将 `Tree` 类的定义更改为 `Tree<TItem>`，如下代码中的**加粗**所示：\n\
  \n```csharp\npublic class Tree<TItem>\n{\n}\n```\n\n6. 在“代码和文本编辑器”窗口中，修改 `Tree<TItem>`\
  \ 类的定义，指定类型参数 `TItem` 必须表示实现泛型 `IComparable<TItem>` 接口的类型。更改在后续代码示例中已**加粗**显示。\n\
  \n`Tree<TItem>` 类的修改后的定义如下：\n\n点击此处查看代码图像\n\n```csharp\npublic class Tree<TItem>\
  \ where TItem : IComparable<TItem>\n{\n}\n```\n\n7. 为 `Tree<TItem>` 类添加三个公共属性：一个名为\
  \ `NodeData` 的 `TItem` 属性，以及两个 `Tree<TItem>` 属性，如下代码所示：\n\n点击此处查看代码图像\n\n```csharp\n\
  public class Tree<TItem> where TItem : IComparable<TItem>\n{\n    public TItem NodeData\
  \ { get; set; }\n    public Tree<TItem> LeftTree { get; set; }\n    public Tree<TItem>\
  \ RightTree { get; set; }\n}\n```\n\n8. 为 `Tree<TItem>` 类添加一个构造函数，接受一个名为 `nodeValue`\
  \ 的 `TItem` 参数。在构造函数中，将 `NodeData` 属性设置为 `nodeValue`，并将 `LeftTree` 和 `RightTree`\
  \ 属性初始化为 `null`，如下代码中的**加粗**所示：\n\n点击此处查看代码图像\n\n```csharp\npublic class Tree<TItem>\
  \ where TItem : IComparable<TItem>\n{\n    ...\n    public Tree(TItem nodeValue)\n\
  \    {\n        NodeData = nodeValue;\n        LeftTree = null;\n        RightTree\
  \ = null;\n    }\n}\n```\n\n***\n\n![Image](img/Image00005.jpg) 注意\n\n注意构造函数的名称不包含类型参数；它是\
