  \n7. 点击 `NameStyle` 列，按 `Ctrl` 键，然后点击 `PasswordHash` 和 `PasswordSalt` 列。右键点击 `PasswordSalt`\
  \ 列，然后点击 `Delete`。\n\n8. Visual Studio 分析这些列。在“预览数据库更新”对话框中，它会列出如果删除这些列可能会可能的警告和其他和其他问题列表。\n\
  \n![Image](img/Image00223.jpg)\n\n9. 在“预览数据库更新”对话框中，点击 `Update Database`。\n\n10.\
  \ 关闭 SQL Server 对象资源管理器面板，但保持 Visual Studio 2015 开启。\n\n## 创建实体模型\n\n现在你已经在云端创建了\
  \ `AdventureWorks` 数据库，可以使用 Entity Framework 创建一个实体模型，应用程序可以使用该模型来查询和更新此数据库中的信息。如果你以前处理过数据库，你可能熟悉\
  \ `ADO.NET` 等技术，它提供了一个类库，你可以用它连接数据库并运行 SQL 命令。`ADO.NET` 很有用，但它要求你对 SQL 有深入的理解，如果你不小心，它可能会强制你围绕执行\
  \ SQL 命令所需的逻辑来构建代码结构，而不是关注应用程序的业务操作。Entity Framework 提供了一层抽象，减少了你的应用程序对 SQL 的依赖。\n\
  \n本质上，Entity Framework 在关系型数据库和你的应用程序之间实现了一个映射层；它生成一个实体模型，该模型由对象集合组成，应用程序可以像使用其他集合一样使用它们。集合通常对应于数据库中的表，表中的每一行对应集合中的一个项。你通过遍历集合中的项（通常使用语言集成查询\
  \ `LINQ`）来执行查询。在后台，实体模型会将你的查询转换为执行执行的 SQL `SELECT` 命令以获取数据。你可以修改集合中的数据，然后可以安排实体模型生成并执行相应的\
  \ SQL `INSERT`、`UPDATE` 和 `DELETE` 命令，以在数据库中执行相应的操作。简而言之，Entity Framework 是连接数据库并检索和管理数据的极佳工具，不需要你将\
  \ SQL 命令嵌入代码中。\n\n在接下来的练习中，你将为 `AdventureWorks` 数据库中的 `Customer` 表创建一个非常简单的实体模型。你将遵循所谓的“数据库优先”（database-first）实体建模方法。在这种方法中，Entity\
  \ Framework 根据数据库中表的定义生成类。Entity Framework 还提供了“代码优先”（code-first）方法；该策略可以根据你在应用程序中实现的类在数据库中生成一组表。\n\
  \n***\n\n![Image](img/Image00005.jpg) 注意\n\n如果你想了解更多关于代码优先方法创建实体模型的信息，请参阅微软网站上的“Code\
  \ First to an Existing Database”，网址为 http://msdn.microsoft.com/data/jj200620。\n\n\
  ***\n\n## 创建 AdventureWorks 实体模型\n\n1. 在 Visual Studio 中，打开 `Customers` 项目，它位于文档文件夹\
  \ `\\Microsoft Press\\VCSBS\\Chapter 27\\Web Service` 文件夹中。\n\n该项目包含了第 26 章中 `Customers`\
  \ 应用程序的修改版本。`ViewModel` 实现了额外的命令，允许用户导航到客户集合中的第一个或最后一个客户，且命令栏包含调用这些命令的 `First` 和\
  \ `Last` 按钮。此外，删除了 Cortana 搜索功能，以便你能够关注当前的任务。（如果你想添加一个语音激活版本的应用程序，非常欢迎重新添加此功能。）\n\
  \n2. 在解决方案管理器中，右键点击 `Customers` 解决方案（不是 `Customers` 项目），指向 `Add`，然后点击 `New Project`。\n\
  \n3. 在“添加新项目”对话框中，在左侧窗格中点击 `Web` 节点。在中间窗格中，点击 `ASP.NET Web Application` 模板。验证中间窗格上方列表框中指定的版本已设置为\
  \ `.NET Framework 4.6`（如有必要请进行更改）。在 `Name` 框中，输入 `AdventureWorksService`，然后点击 `OK`。\n\
  \n4. 在“New ASP.NET Project – AdventureWorksService”对话框中，在“选择 A A Template”下，点击 `ASP.NET\
  \ 4.6 Templates` 部分中的 `Web API`，然后点击 `Change Authentication`。\n\n5. 在“更改身份验证”对话框中，选择\
  \ `No Authentication`，然后点击 `OK` 返回“New ASP.NET Project”对话框。\n\n***\n\n![Image](img/Image00005.jpg)\
  \ 注意\n\n`ASP.NET Web API` 模板可以生成处理用户登录的代码，但如果你将服务部署到云端，Azure 提供了它自己的可扩展身份和访问管理系统，这比将安全处理嵌入到自己的代码中更为优。Azure\
  \ 安全不在本本书的范围内，但若需更多信息，请参阅 http://azure.microsoft.com/services/active-directory/\
  \ 上的“Azure Active Directory”以及 http://azure.microsoft.com/services/active-directory/\
  \ 上的“Azure Multi-Factor Authentication”。\n\n***\n\n6. 在“New ASP.NET Project”对话框中，确保\
