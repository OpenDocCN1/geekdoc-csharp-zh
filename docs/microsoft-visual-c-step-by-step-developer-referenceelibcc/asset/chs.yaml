  class Complex\n{\n...\n\npublic override bool Equals(Object obj)\n{\n\nif (obj is\
  \ Complex)\n\n{\n\nComplex compare = (Complex)obj;\n\nreturn (this.Real == compare.Real)\
  \ &&\n\n(this.Imaginary == compare.Imaginary);\n\n}\n\nelse\n\n{\n\nreturn false;\n\
  \n}\n\n}\n\n}\n```\n\n\n\n\n\n`Equals` 方法接受一个 `Object` 作为参数。此代码验证了参数的类型实际上是否为 `Complex`\
  \ 对象。如果是，此代码将比较当前实例与传入的参数在 `Real` 和 `Imaginary` 属性上的值。如果它们相同，则方法返回 `true`；否则，返回\
  \ `false`。如果传入的参数不是 `Complex` 对象，则方法返回 `false`。\n\n***\n\n![Image](img/Image00004.jpg)\
  \ 重要提示\n\n很容易像这样编写 `Equals` 方法：\n\n点击此处查看代码图像\n\n```csharp\npublic override bool\
  \ Equals(Object obj)\n{\n  Complex compare = obj as Complex;\n  if (compare != null)\n\
  \  {\n    return (this.Real == compare.Real) &&\n           (this.Imaginary == compare.Imaginary);\n\
  \  }\n  else\n  {\n    return false;\n  }\n}\n```\n\n然而，表达式 `compare != null` 会调用\
  \ `Complex` 类的 `!=` 运算符，该运算符会再次调用 `Equals` 方法，从而导致递归循环。\n\n***\n\n### 5. 重写 `GetHashCode`\
