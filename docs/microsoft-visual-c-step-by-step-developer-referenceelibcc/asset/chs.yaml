  \n1. 在解决方案资源中，右键点击项目，选择“添加”->“新建项”。\n2. 在新建项对话框中，选择“类”，并命名为 `DrawingShape`，然后点击添加。\n\
  3. 在 `DrawingShape.cs` 文件的顶部添加以下 `using` 指令：\n\n```csharp\nusing System.UI;\nusing\
  \ System.UI.Media;\nusing System.UI.Shapes;\nusing System.Windows.Controls;\n```\n\
  \n4. 修改 `DrawingShape` 的定义，将其声明为抽象类，如下：\n\n```csharp\nabstract class DrawingShape\n\
  {\n\n}\n```\n\n5. 在 `DrawingShape` 类中添加以下私有变量：\n\n```csharp\nabstract class DrawingShape\n\
  {\n    protected int size;\n    protected int locX, locY;\n    protected Shape shape\
  \ = null;\n}\n```\n\n`Square` 和 `Circle` 类都使用 `locX` 和 `locY` 字段来指定它们在画布上的位置。`size`\
  \ 字段在两个类中都表示它们它们的大小。\n\n6. 在 `DrawingShape` 类中添加以下构造函数：\n\n```csharp\nabstract class\
  \ DrawingShape\n{\n    ...\n    public DrawingShape(int size)\n    {\n        this.size\
  \ = size;\n    }\n}\n```\n\n这段代码初始化了 `DrawingShape` 对象的 `size` 字段。\n\n7. 在 `DrawingShape`\
  \ 类中添加 `SetLocation` 和 `SetColor` 方法，如下文代码所示：\n\n```csharp\nabstract class DrawingShape\n\
  {\n    ...\n    public void SetLocation(int xCoord, int yCoord)\n    {\n       \
  \ this.locX = xCoord;\n        this.locY = yCoord;\n    }\n\n    public void SetColor(Color\
  \ color)\n    {\n        if (this.shape != null)\n        {\n            SolidColorBrush\
  \ brush = new SolidColorBrush(color);\n            this.shape.Fill = brush;\n  \
  \      }\n    }\n}\n```\n\n这些方法为所有派自 `DrawingShape` 的类提供了实现。注意，它们没有被标记为 `virtual`，且不期望派生类重写它们。此外，`DrawingShape`\
  \ 类没有声明实现 `IDraw` 或 `IColor` 接口（接口实现是 `Square` 和 `Circle` 类特征，而不是这个抽象类），所以这些方法只是简单地声明为\
  \ `public`。\n\n\n\n\n# 9. 为 `DrawingShape` 类添加 `Draw` 方法。\n\n与之前的方法不同，此方法被声明为 `virtual`，预计任何派生类都应该重写它以扩展功能。该方法中的代码会验证\
  \ `shape` 字段不为 `null`，然后将其绘制在画布上。继承此方法的类必须提供自己的代码来实例化 `shape` 对象。（记住，`Square` 类会创建一个\
  \ `Rectangle` 对象，而 `Circle` 类会创建一个 `Ellipse` 对象。）\n\n点击此处查看代码图像\n\n```cs\nabstract\
  \ class DrawingShape\n{\n    ...\n\n    public virtual void Draw(Canvas canvas)\n\
  \    {\n        if (this.shape == null)\n        {\n            throw new InvalidOperationException(\"\
  Shape is null\");\n        }\n\n        this.shape.Height = this.size;\n       \
  \ this.shape.Width = this.size;\n        Canvas.SetTop(this.shape, this.locY);\n\
  \        Canvas.SetLeft(this.shape, this.locX);\n        canvas.Children.Add(this.shape);\n\
  \    }\n}\n```\n\n你现在已经完成了 `DrawingShape` 抽象类。下一步是修改 `Square` 和 `Circle` 类，使其继承自该类，然后从\
  \ `Square` 和 `Circle` 类移除移除代码。\n\n## 修改 `Square` 和 `Circle` 类以继承 `DrawingShape`\
  \ 类\n\n1. 在“代码和文本编辑器”窗口中显示 `Square` 类的代码。\n\n2. 修改 `Square` 类的定义，使其在实现 `IDraw` 和\
  \ `IColor` 接口的同时也继承自 `DrawingShape` 类。\n\n点击此处查看代码图像\n\n```cs\nclass Square : DrawingShape\
  \ , IDraw, IColor\n{\n    ...\n}\n```\n\n注意，你必须在 `Square` 类实现的任何接口之前，先指定它继承的类。\n\
  \n3. 在 `Square` 类中，删除 `sideLength`、`rect`、`locX` 和 `locY` 字段的定义。这些字段不再需要了，因为它们现在由\
  \ `DrawingShape` 类提供。\n\n4. 用以下代码替换现有的构造函数，该代码调用了基类的构造函数：\n\n点击此处查看代码图像\n\n```cs\n\
  class Square : DrawingShape, IDraw, IColor\n{\n    public Square(int sideLength)\n\
  \    : base(sideLength)\n    {\n    }\n    ...\n}\n```\n\n注意，此构造函数的体是空的，因为基类构造函数执行了所有所需的初始化。\n\
  \n5. 从 `Square` 类中移除 `IDraw.SetLocation` 和 `IColor.SetColor` 方法。`DrawingShape` 类提供了这些方法的实现。\n\
  \n6. 修改 `Draw` 方法的定义。使用 `public override` 声明并移除对 `IDraw` 接口的引用。同样，`DrawingShape`\
  \ 类已经提供了该方法的基础功能，但你将用 `Square` 类所需的特定代码对其扩展。\n\n点击此处查看代码图像\n\n```cs\npublic override\
  \ void Draw(Canvas canvas)\n```\n\n7. 用此处所示的代码替换 `Draw` 方法的体：\n\n点击此处查看代码图像\n\n\
  ```cs\npublic override void Draw(Canvas canvas)\n{\n    if (this.shape != null)\n\
  \    {\n        canvas.Children.Add(this.shape);\n    }\n}\nelse\n{\n    this.shape\
  \ = new Rectangle();\n}\n}\n```\n\n8. 对 `Circle` 类重复第 2 到 7 步，但构造函数应该实例化 `Ellipse`\
  \ 且如下所示：\n\n点击此处查看代码图像\n\n```cs\nclass Circle : DrawingShape, IDraw, IColor\n{\n\
  \    public Circle(int diameter)\n    : base(diameter)\n    {\n    }\n\n    public\
  \ override void Draw(Canvas canvas)\n    {\n        if (this.shape != null)\n  \
  \      {\n            canvas.Children.Add(this.shape);\n        }\n    }\n    else\n\
  \    {\n        this.shape = new Ellipse();\n    }\n}\n```\n\n9. 在“调试”菜单上，点击“启动”。\n\
  \n10. 返回 Visual Studio 并停止调试。\n\n## 与 Windows Runtime 的兼容性\n\nCLR 和 WinRT 实现的集成允许\
  \ CLR 透明地使用 WinRT 类型，但它也支持反方向的互操作性：只要这些类型符合 WinRT 的预期，你就可以使用托管代码定义类型并让它们对非托管应用程序可用。第\
  \ 9 章 强调了结构体（struct）在这方面的要求（结构体中的实例方法和静态方法无法通过 WinRT 使用，且不支持私有字段）。\n\n在 Windows\
  \ 10 上，UWP 应用始终通过 WinRT 运行。这意味着如果你使用如 C# 等托管语言构建 UWP 应用，CLR 实际上调用的是 WinRT 而不是 Windows\
  \ API。微软在 CLR 和 WinRT 之间提供了一个映射层，该层可以透明地将对 .NET Framework 的创建对象和调用方法的请求转换为 WinRT\
  \ 中的等效对象请求和方法调用。然而，尽管 CLR 和 WinRT 有大量重叠的功能，但 .NET Framework 4.6 的所有功能在 WinRT 中并没有对应的功能。因此，UWP\
  \ 应用只能访问 .NET Framework 4.6 提供的部分类型和方法（当使用 C# 构建 UWP 应用时，Visual Studio 2015 中的 IntelliSense\
  \ 会自动显示可用功能的受限视图，省略无法通过 WinRT 使用的类型和方法）。\n\n另一方面，WinRT 提供了一系列重要的功能和类型，这些功能在 .NET\
  \ Framework 中没有直接对应项，或者其运行方式与 .NET Framework 中的对应功能显著不同，因此无法轻易转换。WinRT 通过一个映射层向\
  \ CLR 开放这些功能，使其看起来像 .NET Framework 类型和方法，你可以直接从托管代码中调用它们。\n\n\n\n\n\n![Image](img/Image00001.jpg)\
  \ 任何公共字段，以及任何公共方法的参数和返回值，必须是 WinRT 类型，或者是可以被 WinRT 透明地转换为 WinRT 类型的 .NET Framework\
  \ 类型。支持的 .NET Framework 类型示例包括符合规范的值类型（如结构体和枚举）以及与 C# 基础类型（`int`、`long`、`float`、`double`、`string`\
  \ 等）对应的类型。类支持私有字段，可以是 .NET Framework 中提供的任何类型；它们不需要符合 WinRT。\n\n![Image](img/Image00001.jpg)\
  \ 类不能重写除 `ToString` 之外的 `System.Object` 方法，且不能声明保护性构造函数。\n\n![Image](img/Image00001.jpg)\
  \ 定义类的命名空间必须与实现类的程序集名称相同。此外，命名空间名称（因此程序集名称）不能以“Windows”开头。\n\n![Image](img/Image00001.jpg)\
  \ 你无法通过 WinRT 在非托管应用程序中继承托管类型。因此，所有公共类必须是密封的（sealed）。如果你需要实现多态，可以创建一个公共接口，并在必须实现多态的类上实现该接口。\n\
  \n![Image](img/Image00001.jpg) 你可以抛出 UWP 应用可用 .NET Framework 子集中的任何异常类型；你不能创建自定义的异常类。如果你的代码在从非托管应用程序调用时抛出未处理的异常，WinRT\
  \ 会非托管代码中抛出一个等效异常。\n\nWinRT 对本书稍后介绍的 C# 代码特性还有其他要求。这些要求将在描述每个特性时进行着亮显示。\n\n***\n\
