  \n}\n\n}\n```\n\n注意这两个运算符都使用了 `Equals` 方法。`Equals` 方法将类实例与作为参数的实例进行比较。如果它们具有相等的值，则返回\
  \ `true`，否则返回 `false`。\n\n**3.** 在“生成”菜单上，点击“重新生成解决方案（Rebuild Solution）”。\n\n错误列表显示以下警告消息：\n\
