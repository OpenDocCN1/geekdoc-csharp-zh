  \n点击此处查看代码图像\n\nEmployees:\nFred\nBert\nHarry\nJames\n\nCustomers:\nJohn\nSid\n\
  Harry\nDiana\nFrancesca\n\nCustomers who are employees:\nJohn\nHarry\n\n### 使用集合初始化器\n\
  \n前面的章节向你展示了如何使用最适合的方法向集合添加单个元素（`List<T>` 使用 `Add`、`Queue<T>` 使用 `Enqueue`、`Stack<T>`\
  \ 使用 `Push` 等）。你也可以在声明时通过支持数组的语法初始化*某些*集合类型。例如，下面的语句创建并初始化了之前的 `numbers` `List<int>`\
  \ 对象，展示了重复调用 `Add` 方法的替代方案：\n\n```csharp\nList<int> numbers = new List<int>{10,\
  \ 9, 8, 7, 7, 6, 5, 10, 4, 3, 2, 1};\n```\n\n在内部，C# 编译器将此初始化转换为一系列 `Add` 方法调用。因此，你只能对支持\
  \ `Add` 方法的集合使用这种语法。（`Stack<T>` 和 `Queue<T>` 类不支持。）\n\n对于键键对的复杂集合，例如 `Dictionary<TKey,\
  \ TValue>` 类，你可以使用索引表示法为每个键指定值，如下：\n\n```csharp\nDictionary<string, int> ages =\
  \ new Dictionary<string, int>()\n{\n[\"John\"] = 51,\n[\"Diana\"] = 50,\n[\"James\"\
  ] = 23,\n[\"Francesca\"] = 21\n};\n```\n\n如果你愿意，你也可以在初始化列表中将每个键值对指定为匿名类型，如下：\n\n\
  ```csharp\nDictionary<string, int> ages = new Dictionary<string, int>()\n{\n{\"\
  John\", 51},\n{\"Diana\", 50},\n{\"James\", 23},\n{\"Francesca\", 21}\n};\n```\n\
  \n在这种情况下，每个对中的第一个项是键，第二个是值。为了使你的代码尽可能具有读性，我建议在初始化字典类型时，尽可能使用索引表示法。\n\n#### *Find*\
  \ 方法、谓词和 Lambda 表达式\n\n\n\n\n使用面向字典的集合（`Dictionary<TKey, TValue>`、`SortedDictionary<TKey,\
  \ TValue>` 和 `SortedList<TKey, TValue>`），你可以通过指定要搜索的键来快速查找值，并且正如你在前面的示例中所看到的，可以使用数组表示法来访问值。其他支持非键随机访问的集合（例如\
  \ `List<T>` 和 `LinkedList<T>` 类）不支持数组表示法，而是提供 `Find` 方法来定位项目。对于这些类，`Find` 方法的参数是一个谓词，它指定了要使用的搜索准则。谓词的形式是一个方法，它检查集合中的每个项并返回一个指示该项是否匹配的\
  \ `Boolean` 值。在 `Find` 方法的情况下，一旦找到第一个匹配项，就会返回相应的项。请注意，`List<T>` 和 `LinkedList<T>`\
  \ 类还支持其他方法，例如 `FindLast`（它会返回最后一个匹配的对象），而 `List<T>` 类还额外提供了 `FindAll` 方法，该方法返回一个包含所有匹配对象的\
  \ `List<T>` 集合。\n\n指定谓词的最简单方法是使用 `lambda 表达式`（lambda expression）。lambda 表达式是一个返回方法的表达式。这听起来相当奇怪，因为你目前在\
  \ C# 中遇到的大多数表达式实际上返回的是一个值。如果你熟悉如 Haskell 这样的函数式编程语言，你可能对这个概念很熟悉。如果不熟悉，不要担心：lambda\
  \ 表达式并不复杂，在你习惯了这种新语法之后，你会发现它们非常有用。\n\n***\n\n![Image](img/Image00005.jpg) 注意\n\n\
  如果你对了解更多关于使用 Haskell 进行函数式编程感兴趣，请访问 Haskell 编程语言网站：`[`www.haskell.org/haskellwiki/Haskell`](http://www.haskell.org/haskellwiki/Haskell)`。\n\
  \n***\n\n第 3 章，“编写方法和应用作用域”]解释了了一个典型方法由四个元素组成：返回类型、方法名、参数列表和方法体。lambda 表达式包含这些元素中的两个：参数列表和方法体。lambda\
  \ 表达式不定义方法名，且返回类型（如果有）是从 lambda 表达式使用的上下文推断出来的。在 `Find` 方法的情况下，谓词依次处理集合中的每个项；谓词体必须检查该项并根据其是否匹配搜索准则返回\
  \ true 或 false。接下来的示例显示了在 `List<Person>` 集合上的 **`Find`** 方法（已**加粗**显示），其中 `Person`\
  \ 是一个结构体。`Find` 方法返回列表中 `ID` 属性设置为 3 的第一个项：\n\n点击此处查看代码图片\n\n```csharp\nstruct Person\n\
  {\n    public int ID { get; set; }\n    public string Name { get; set; }\n    public\
  \ int Age { get; set; }\n}\n\n// 创建并填充人员列表\nList<Person> personnel = new List<Person>()\n\
  {\n    new Person() { ID = 1, Name = \"John\", Age = 51 },\n    new Person() { ID\
  \ = 2, Name = \"Sid\", Age = 28 },\n    new Person() { ID = 3, Name = \"Fred\",\
  \ Age = 34 },\n    new Person() { ID = 4, Name = \"Paul\", Age = 22 },\n};\n\n//\
  \ 在列表中查找 ID 为 3 的成员\nPerson match = personnel.Find((Person p) => { return p.ID ==\
  \ 3; });\nConsole.WriteLine($\"ID: {match.ID}\\nName: {match.Name}\\nAge: {match.Age}\"\
  );\n```\n\n以下是该代码生成的输出：\nID: 3\nName: Fred\nAge: 34\n\n在调用 `Find` 方法时，参数 `(Person\
  \ p) => { return p.ID == 3; }` 是一个实际执行工作的 lambda 表达式。它具有以下语法项：\n\n![Image](img/Image00001.jpg)\
  \ 括在括号内的参数列表。与普通方法一样，如果你正在定义的方法（如前一个示例所示）不接受参数，你仍然必须提供括号。在 `Find` 方法的情况下，谓词依次获得来自集合的每个项，该项将作为参数传递给\
  \ lambda 表达式。\n\n![Image](img/Image00001.jpg) `=>` 运算符，它指示 C# 编译器这是一个 lambda 表达式。\n\
  \n![Image](img/Image00001.jpg) 方法体。此处显示的示例非常简单，包含一个单一语句，返回一个指示参数中指定的项是否匹配搜索准则的尔值。然而，lambda\
  \ 表达式可以包含多个语句，你可以以你认为最易读的方式对其进行格式化。只需在每个语句后添加分号，就像在普通方法中一样。\n\n***\n\n![Image](img/Image00004.jpg)\
  \ 重要\n\n你已经在 第 3 章 中看到过如何使用 `=>` 运算符来定义表达式体方法（expression-bodied methods）。令人困惑的是，这是\
  \ `=>` 运算符的一种某种重载用法。尽管在概念上有一些相似之处，但表达式体方法和 lambda 表达式在语义上是有区别的。\n\n***\n\n严格来说，lambda\
  \ 表达式的体可以是包含多个语句的方法体，也可以是单个表达式。如果 lambda 表达式体只包含单个表达式，你可以省略大括号和分号（但整个语句仍需要分号）。此外，如果表达式接受单个参数，你可以省略参数的括号。最后，在许多情况下，你可以省略参数的类型，因为编译器可以从调用\
  \ lambda 表达式的文中推断此信息。之前所示的 `Find` 语句的简化形式如下（更容易阅读）：\n\n点击此处查看代码图片\n\n```csharp\n\
  Person match = personnel.Find(p => p.ID == 3);\n```\n\n#### lambda 表达式的形式\n\nlambda\
  \ 表达式是非常强大的构造，随着你深入学习，你会越来越多它们。表达式本身可以有多种细微的形式。lambda 表达式最初是称为 `lambda 演算` 的数学符号的一部分，该符号提供了一种描述函数的表示。（你可以将函数理解为返回值的方法。）尽管\
  \ C# 语言在实现 lambda 表达式时扩展了 lambda 演算的语法和语义，但许多原理仍然适用。以下是 C# 中可用 lambda 表达式的不同形式示例：\n\
  \n点击此处查看代码图片\n\n```csharp\nx => x * x // 返回参数平方的简单表达式。参数 x 的类型从文中推断。\n\nx => { return\
  \ x * x ; } 与前面的表达式语义相同，但使用了 C# 语句块作为体，而不是简单表达式\n\n(int x) => x / 2 // 返回参数除以 2\
  \ 的值的简单表达式。参数 x 的类型显式声明。\n\n() => folder.StopFolding(0) // 调用方法。表达式不接受参数。表达式可能返回也可能不返回。\n\
  \n(x, y) => { x++; return x / y; } // 多个参数；编译器推断参数类型。参数 x 按值传递，因此 ++ 操作的影响是局限于表达式的。\n\
  \n(ref int x, int y) => { x++; return x / y; } // 多个参数；带有显式类型。参数 x 按引用传递，因此 ++ 操作的影响是永久的。\n\
  ```\n\n总而言来说，这里是你应该注意的 lambda 表达式的一些特性：\n\n\n\n\n\n如果 lambda 表达式带有参数，你可以在 `=>` 算符左侧的括号中指定它们。你可以省略参数的类型，`C#`\
  \ 编译器将根据 lambda 表达式的上下文推断出它们的类型。如果你希望 lambda 表达式能够修改局部以外的值，可以通过引用传递参数（通过使用 `ref`\
  \ 关键字），但通常不建议这样做。\n\nLambda 表达式可以返回值，但返回类型必须与相应的委托（delegate）类型相匹配。\n\nLambda 表达式的体可以是一个简单的表达式，也可以是一个由多个语句、方法调用、变量定义和其他代码项组成的\
  \ `C#`code` 块。\n\n在 lambda 表达式方法中定义的变量在方法结束时会离开作用域。\n\nLambda 表达式可以访问并修改 lambda\
  \ 表达式定义时作用范围内的所有外部变量。请务必小心使用这一功能！\n\n# Lambda 表达式和匿名方法\n\nLambda 表达式在 3.0 版本中被引入\
  \ `C#` 语言。`C#` 2.0 版本了匿名方法，它们可以执行类似的任务，但没有 lambda 那么灵活。引入匿名方法主要是为了让你可以在不创建具名方法的情况下定义委托——你只需提供方法体的定义来代替方法名，如下：\n\
  \n点击此处查看代码图像\n\n```csharp\nthis.stopMachinery += delegate { folder.StopFolding(0);\
  \ };\n```\n\n你也可以将匿名方法作为参数传递代替委托，如下：\n\n点击此处查看代码图像\n\n```csharp\ncontrol.Add(delegate\
  \ { folder.StopFolding(0); } );\n```\n\n注意，每当引入匿名方法时，都必须在它前面加上 `delegate` 关键字。此外，任何所需的参数都指定在\
  \ `delegate` 关键字后的括号中，如下例所示：\n\n点击此处查看代码图像\n\n```csharp\ncontrol.Add(delegate(int\
  \ param1, string param2)\n{ /* 使用 param1 和 param2 的代码 */ ... });\n```\n\n相比匿名方法，Lambda\
  \ 表达式提供了更简洁、更自然的语法，并且贯穿于 `C#` 的许多高级特性中，你将在本书的后续章节中看到这些。通常情况下，在代码中你应该使用 lambda 表达式而不是匿名方法。\n\
  \n## 比较数组和集合\n\n以下是数组和集合之间重要区别的摘要：\n\n数组实例具有固定大小，不能增长或缩小。集合可以根据需要动态调整自身的大小。\n\n\
  数组可以有多个维度。集合是线性的。然而，集合中的项本身可以是集合，因此你可以通过“集合的集合”来模拟多维数组。\n\n你通过索引在数组中存储和检索项。并不是所有集合都支持这一概念。例如，要在\
  \ `List<T>` 集合中存储项，你需要使用 `Add` 或 `Insert` 方法，而要检索项，则使用 `Find` 方法。\n\n许多集合类都提供了 `ToArray`\
  \ 方法，该方法会创建一个填充了集合中项的数组。项会被复制到数组中，而不会从集合中移除。此外，这些集合还提供了构造函数，可以直接从数组填充集合。\n\n###\
  \ 使用集合类玩扑牌\n\n在接下来的练习中，你将把第 10 章中开发的扑牌游戏转换为使用集合而不是数组。\n\n#### 使用集合实现扑牌游戏\n\n1. 如果\
