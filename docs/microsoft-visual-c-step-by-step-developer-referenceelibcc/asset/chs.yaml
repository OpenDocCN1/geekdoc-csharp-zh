  \ 在代码和文本编辑器窗口中显示 `MainPage.xaml.cs` 文件并找到 `plotButton_Click` 方法。\n\n3. 向此方法添加以下**加粗**的代码。这些语句生成一个包含每个任务在运行结束后状态的字符串，然后在表单底部的\
  \ `messages` TextBlock 控件中显示此字符串。\n\n点击此处查看代码图像\n\n```csharp\nprivate async void\
  \ plotButton_Click(object sender, RoutedEventArgs e)\n{\n    ...\n    await first;\n\
  \    await second;\n    duration.Text = $\"Duration (ms): {watch.ElapsedMilliseconds}\"\
  ;\n    string message = $\"Status of tasks is {first.Status}, {second.Status}\"\
  ;\n    messages.Text = message;\n    ...\n}\n```\n\n4. 在调试菜单上，点击“开始调试”。\n\n5. 在\
  \ GraphDemo 窗口中，点击“绘图”（Plot Graph）但不要点击“取消”（Cancel）。验证显示的消息报告任务状态为 `RanToCompletion`（两次）。\n\
  \n6. 在 GraphDemo 窗口中，再次点击“绘图”，然后快速点击“取消”。\n\n惊讶的是，出现的消息仍然报告每个任务的状态为 `RanToCompletion`，尽管图表出现了空洞。\n\
  \n![Image](img/Image00158.jpg)\n\n这种行为的发生是因为尽管你通过取消令牌（cancellation token）向每个任务发送了取消请求，但它们正在运行的方法仅仅是返回了。.NET\
  \ Framework 运行时不知道任务是否真的被取消了，或者是否被允许运行完成，它简单地忽略了取消请求。\n\n7. 返回 Visual Studio 并停止调试。\n\
  \n那么，你如何指示任务已被取消而不是允许其运行完成呢？答案在于作为参数传递给任务正在运行方法的 `CancellationToken` 对象。`CancellationToken`\
  \ 类提供了一个名为 `ThrowIfCancellationRequested` 的方法。该方法测试取消令牌的 `IsCancellationRequested`\
  \ 属性；如果其为 `true`，则该方法将抛出 `OperationCanceledException` 异常并中止任务正在运行的方法。\n\n启动线程的应用程序应该准备好捕获并处理此异常，但这导致了另一个问题。如果任务通过抛出异常来终止，它实际上会恢复到\
  \ `Faulted` 状态。即使异常是 `OperationCanceledException` 异常也是如此。只有当任务在不抛出异常的情况下被取消时，它才会进入\
  \ `Canceled` 状态。那么，任务如何抛出 `OperationCanceledException` 而不被视为异常呢？\n\n这一次，答案在于任务本身。为了让任务识别出\
  \ `OperationCanceledException` 是受控方式取消任务的结果，而不是由其他情况引起的异常，它必须知道操作实际上已经被取消。只有当它能够检查取消令牌时，才能做到这一点。你将此令牌作为参数传递给任务运行的方法，但任务实际上并没有检查这些任何一个参数。相反，你在创建并运行任务时指定了取消令牌。下面的代码基于\
  \ GraphDemo 显示了一个示例。注意 `token` 是如何传递给 `generateData` 方法的（如之前），但也作为 `Run` 方法的参数传递的。\n\
  \n点击此处查看代码图像\n\n```csharp\ntokenSource = new CancellationTokenSource();\nCancellationToken\
  \ token = tokenSource.Token;\n...\nTask first = Task.Run(() => generateData(data,\
  \ 0, pixelWidth / 4, token), token);\n```\n\n现在，当任务运行的方法抛出 `OperationCanceledException`\
  \ 异常时，基础设施会检查取消令牌。如果它指示任务已被取消，基础设施会将任务状态设置为 `Canceled`。如果你使用 `await` 操作符等待任务完成，你还需要准备好捕获并处理\
  \ `OperationCanceledException`。这是你将在下一个练习中做的。\n\n### 确认取消并处理 `OperationCanceledException`\
  \ 异常\n\n1. 在 Visual Studio 中，返回显示 `MainPage.xaml.cs` 的代码编辑器。在 `plotButton_Click`\
  \ 方法中，修改创建和运行任务的语句，并将 `CancellationToken` 对象作为 `Run` 方法的第二个参数（同时也作为 `generateData`\
  \ 方法的参数），如下代码中**加粗**部分所示：\n\n点击此处查看代码图像\n\n```csharp\nprivate async void plotButton_Click(object\
  \ sender, RoutedEventArgs e)\n{\n    ...\n    tokenSource = new CancellationTokenSource();\n\
  \    CancellationToken token = tokenSource.Token;\n    ...\n    Task first = Task.Run(()\
  \ => generateData(data, 0, pixelWidth / 4, token), token);\n    Task second = Task.Run(()\
  \ => generateData(data, pixelWidth / 4, pixelWidth / 2, token), token);\n    ...\n\
  }\n```\n\n2. 在创建和运行任务、等待它们完成以及显示耗时的语句周围添加 `try` 块。添加一个处理 `OperationCanceledException`\
  \ 异常的 `catch` 块。在此异常处理程序，将异常对象的 `Message` 属性报告的异常显示在 `duration` TextBlock 控件中。以下代码中的**加粗**部分突亮了你应该做的更改：\n\
  \n点击此处查看代码图像\n\n```csharp\nprivate async void plotButton_Click(object sender, RoutedEventArgs\
  \ e)\n{\n    ...\n    try\n    {\n        await first;\n        await second;\n\
  \        duration.Text = $\"Duration (ms): {watch.ElapsedMilliseconds}\";\n    }\n\
  \    catch (OperationCanceledException oce)\n    {\n        duration.Text = oce.Message;\n\
  \    }\n}\n```\n\n\n\n\n\n```csharp\nstring message = $\"Status of tasks is {first.Status,\
  \ {second.Status}\";\n```\n\n**3.** 在 `generateGraphData` 方法中，注释掉检查 `CancellationToken`\
  \ 对象 `IsCancellationRequested` 属性的 `if` 语句，并添加调用 `ThrowIfCancellationRequested`\
  \ 方法的语句，如下所示加粗所示：\n\n点击此处查看代码图像\n\n```csharp\nprivate void generateGraphData(byte[]\
  \ data, int partitionStart, int partitionEnd, CancellationToken token)\n{\n    ...\n\
  \    for (int x = partitionStart; x < partitionEnd; x++);\n    {\n        ...\n\
  \        for (double i = -p; i < p; i += 3)\n        {\n            //if (token.IsCancellationRequested)\n\
  \            //{\n            // return;\n            //}\n            token.ThrowIfCancellationRequested();\n\
  \            ...\n        }\n    }\n    ...\n}\n```\n\n**4.** 在“调试”（Debug）菜单上，指向“窗口”（Windows），然后点击“异常设置”（Exception\
  \ Settings）。在“异常设置”窗口中，取消勾选“公共语言运行时异常”（Common Language Runtime Exceptions）复框。右键点击“公共语言运行时异常”，然后确保“在用户代码未处理时继续”（Continue\
  \ When Unhandled In User Code）已启用。\n\n![Image](img/Image00159.jpg)\n\n此配置是为了防止 Visual\
  \ Studio 调试器拦截你在调试模式下运行应用程序时生成的 `OperationCanceledException` 异常。\n\n**5.** 在“调试”（Debug）菜单上，点击“启动调试”（Start\
  \ Debugging）。\n\n**6.** 在图形演示（Graph Demo）窗口中，点击“绘图”（Plot Graph），等待图形出现，并验证两个任务的状态都报告为\
  \ `RanToCompletion` 且图表已生成。\n\n**7.** 再次点击“绘图”，然后快速点击“取消”（Cancel）。\n\n如果你足够快，一个或两个任务的状态都应报告为\
