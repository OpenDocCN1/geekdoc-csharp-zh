  \ 文件，然后点击“重命名”（Rename）。将文件名更改为 `CheckoutController.cs` 并按回车。在提示时，允许 Visual Studio\
  \ 将所有对 `Class1` 的引用重命名为 `CheckoutController`。\n\n4. 右键点击 `CheckoutService` 项目中的\
  \ `References` 节点，然后点击“添加引用”（Add Reference）。\n\n5. 在“引用管理器 – CheckoutService”对话框中，在左侧面板格中点击\
