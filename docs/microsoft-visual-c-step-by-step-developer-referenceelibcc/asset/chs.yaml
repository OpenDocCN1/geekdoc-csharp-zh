  \n### 快速参考\n\n![图像](img/Image00047.jpg)![图像](img/Image00048.jpg)\n\n## 第 4 章. 使用决策语句\n\
  \n完成本章后，你将能够：\n\n![图像](img/Image00001.jpg) 声明布尔（Boolean）变量。\n\n![图像](img/Image00001.jpg)\
  \ 使用布尔运算符创建结果为真（true）或假（false）的表达式。\n\n![图像](img/Image00001.jpg) 编写 `if` 语句根据布尔表达式的结果做出决策。\n\
  \n![图像](img/Image00001.jpg) 编写 `switch` 语句做出更复杂的决策。\n\n第 3 章，“编写方法并应用作用域](#text00008.html_ch03)”展示了如何将相关语句分组为方法。它还演示了如何使用参数向方法传递信息，以及如何使用返回语句方法传递信息。将程序划分为一组离散的方法（每个方法设计用于执行特定的任务或计算）是一种必要的设计策略。许多程序需要解决大型且复杂的问题。将程序拆分为方法有助于你理解这些问题，并专注于如何逐部分地解决它们。\n\
  \n第 3 章 中的方法非常简单，每个语句在上一条语句完成后按顺序执行。然而，为了解决许多现实世界的问题，你还需要能够编写选择性地执行不同操作、并根据情况通过方法的不同路径的代码。在本章中，你将学习如何完成这项任务。\n\
  \n## 声明布尔变量\n\n在 C# 编程世界中（与现实世界不同），一切是非黑即白的、对即错的、真即假的。例如，如果你创建一个名为 `x` 的整数变量，给它赋值为\
  \ 99，然后询问 `x` 是否包含值 99，答案显然为真。如果你询问 `x` 是否小于 10，答案显然为假。这些都是布尔表达式（布尔 expressions）的例子。布尔表达式的结果始终为真或假。\n\
  \n* *\n\n![图像](img/Image00005.jpg) 注意这些问题的答案对于所有编程语言并不确定。未赋值的变量没有定义的值，例如你无法说它小于\
  \ 10。C# 编译器通过确保你在检查它之前对其赋值来解决这个问题。\n\n* *\n\n`bool` 变量可以持有两个值之一：`true` 或 `false`。例如，接的语句声明了一个名为\
  \ `areReady` 的 `bool` 变量，为其赋值 `true`，然后将其值写入控制台：\n\n点击此处查看代码图像\n\n```csharp\nbool\
  \ areReady;\nareReady = true;\nConsole.WriteLine(areReady); // 在控制台输出 True\n\n\n\
  ### 使用布尔运算符\n\n布尔运算符是执行结果为真或假的计算运算符。C# 有几种非常有用的布尔运算符，其中最的是非运算符，用感叹号（`!`）表示。!` 运算符反转布尔值，产生该值的反面。在上例中，如果变量\
  \ `areReady` 的值为真，则表达式 `!areReady` 的值为假。\n\n### 理解相等和关系运算符\n\n你经常使用的两个布尔运算符是相等 (`==`)\
  \ 和不相等 (`!=`)）。它们是二元运算符，通过你可以判断相同类型的值是否与另一个值相同，产生布尔结果。下表总结了这些运算符的工作原理，并以名为 `age`\
  \ 的 `int` 变量作为示例。\n\n![图像](img/Image00049.jpg)\n\n不要混淆*相等*运算符 `==` 和*赋值*运算符 `=`。.\
  \ 表达式 `x==y` 比较 `x` 和 `y`，如果值相同则其值为 `true`。表达式 `x=y` 将 `y` 的值赋值给 `x` 并返回 `y` 的值作为其结果。\n\
  \n与 `==` 和 `!=` 密切相关的是关系运算符。你使用这些运算符来发现值是否小于或大于相同类型的值。下表显示了如何使用这些运算符。\n\n![图像](img/Image00050.jpg)\n\
  \n#### 理解条件逻辑运算符\n\n\n\n\n\nC# 还提供了另外两个二元布尔运算符：逻辑与运算符（用 `&&` 符号表示）和逻辑或运算符（用 `||`\
  \ 符号表示）。这些运算符统称为`条件逻辑运算符`。它们的作用是将两个布尔表达式或值合并为一个单一的布尔结果。这些运算符与相等运算符和关系运算符相似之处在于它们所在的表达式的值为真或假，但不同之处在于，它们所操作的值也必须是真或假。\n\
  \n`&&` 运算符的结果当且仅当它所评估的两个布尔表达式均为 `true` 时为 `true`。例如，以下语句当且仅当 `percent` 的值大于或等于 0\
  \ 且 `percent` 的值小于或等于 100 时，将值 `true` 赋值给 `validPercentage`：\n\n点击此处查看代码\n\n```csharp\n\
  bool validPercentage;\n\nvalidPercentage = (percent >= 0) && (percent <= 100);\n\
  ```\n\n![Image](img/Image00013.jpg) 提示\n\n初学者常见的错误是仅命名了一次 `percent` 变量来组合这两个测试，如下：\n\
  \n点击此处查看代码\n\n```csharp\npercent >= 0 && <= 100 // 此语句将无法编译\n```\n\n使用括号有助于避免此类错误，并明确表达式的意图。例如，比较\n\
  \n点击此处查看代码\n\n```csharp\nvalidPercentage = percent >= 0 && percent <= 100\n```\n\
  \n和\n\n点击此处查看代码\n\n```csharp\nvalidPercentage = (percent >= 0) && (percent <= 100)\n\
  ```\n\n这两个表达式返回相同的值，因为 `&&` 运算符的优先级低于 `>=` 和 `<=`。然而，第二个表达式以更具可读性的方式传达了其意图。\n\n\
  `||` 运算符的结果当它评估的布尔表达式中任一个为 `true` 时为 `true`。你使用 `||` 运算符来判断一组布尔表达式中是否任一个为 `true`。例如，以下语句当\
  \ `percent` 的值小于 0 或 `percent` 的值大于 100 时，将值 `true` 赋值给 `invalidPercentage`：\n\n\
  点击此处查看代码\n\n```csharp\nbool invalidPercentage;\n\ninvalidPercentage = (percent <\
  \ 0) || (percent > 100);\n```\n\n### 短路逻辑\n\n`&&` 和 `||` 运算符都表现出一种称为`短路逻辑`的特性。在确定条件逻辑表达式的结果时，有时不需要评估两个操作数。例如，如果\
  \ `&&` 运算符的左侧操作数评估为 `false`，则整个表达式的结果为 `false`，无论右侧操作数的值为何。同样，如果 `||` 运算符的左侧操作数的值评估为\
  \ `true`，则整个表达式的结果为 `true`，无论右侧操作数的值为何。在情况下，`&&` 和 `||` 运算符会跳过对右侧操作数的评估。以下是一些示例：\n\
  \n点击此处查看代码\n\n```csharp\n(percent >= 0) && (percent <= 100)\n```\n\n在该表达式中，如果 `percent`\
  \ 的值小于 0，`&&` 左侧的布尔表达式评估为 `false`。这个值意味着整个表达式的结果必须为 `false`，因此 `&&` 运算符右侧的布尔表达式不会被评估。\n\
  \n点击此处查看代码\n\n```csharp\n(percent < 0) || (percent > 100)\n```\n\n在该表达式中，如果 `percent`\
  \ 的值小于 0，`||` 左侧的布尔表达式评估为 `true`。这个值意味着整个表达式的结果必须为 `true`，因此 `||` 运算符右侧的布尔表达式不会被评估。\n\
  \n如果你仔细设计使用条件逻辑运算符的表达式，可以通过避免不的工作来提高代码性能。将容易评估的简单布尔表达式放在条件逻辑运算符的左侧，并将更复杂的表达式放在右侧。在许多情况下，你会发现程序不需要评估那些更复杂的表达式。\n\
  \n### 总结运算符优先级和结合性\n\n下表总结了你到今为止学习的所有运算符的优先级和结合性。同一类别的运算符具有相同的优先级。表格上方类别的运算符优先级高于下方类别的。\n\
  \n![Image](img/Image00051.jpg)\n\n注意 `&&` 运算符和 `||` 运算符的优先级不同：`&&` 高于 `||`。\n\n\
  ### 使用 `if` 语句进行决策\n\n在方法中，当你想要根据布尔表达式的结果在执行两个不同的语句之间选择时，可以使用 `if` 语句。\n\n#### 理解\
  \ `if` 语句语法\n\n`if` 语句的语法如下：\n\n```csharp\nif (booleanExpression)\n    statement1;\n\
  else\n    statement2\n```\n\n如果 `booleanExpression` 评估为 `true`，则运行 `statement1`；否则运行\
  \ `statement2`。`else` 关键字和随后的 `statement2` 是可选的。如果没有 `else` 子句且 `booleanExpression`\
  \ 为 `false`，执行将继续 `if` 语句之后的代码。此外，注意布尔表达式必须括在括号内；否则代码将无法编译。\n\n例如，这是一个增加代表秒针变量的\
  \ `if` 语句。（目前忽略分钟）。如果 `seconds` 的值为 59，则将其重置为 0；否则将其加 1：\n\n```csharp\nint seconds;\n\
  \nif (seconds == 59)\n    seconds = 0;\nelse\n    seconds++;\n```\n\n#### 只要布尔表达式！\n\
  \n`if` 语句中的表达式必须括在括号内。此外，该表达式必须是一个布尔表达式。在其他一些语言中（特别是 C 和 C++），你可以写一个整数表达式，编译器会静默地将整数值转换为\
  \ `true`（非零）或 `false`（0）。C# 不支持这种行为，如果你编写此类表达式，编译器会报错。\n\n如果你在 `if` 语句中不小心用赋值运算符\
  \ `=` 代替相等测试运算符 `==`，C# 编译器会识别出你的错误并拒绝编译代码，如下例所示：\n\n点击此处查看代码\n\n```csharp\nint\
  \ seconds;\n\nif (seconds = 59) // 编译时错误\n\nif (seconds == 59) // 正常\n```\n\n意外赋值是\
  \ C 和 C++ 程序中另一个常见的 Bug 来源，它们会静默地将赋值的值（59）转换为布尔表达式（任何非零值都被视为真），结果是 *if* 语句之后的代码每次都会被执行。\n\
  \n顺便提一下，你可以使用布尔变量作为 `if` 语句的表达式，尽管它仍然必须括在括号内，如示例所示：\n\n点击此处查看代码\n\n```csharp\nbool\
  \ inWord;\n\nif (inWord == true) // 正常，但并不常用\n\nif (inWord) // 更常见且被认为更好的风格\n```\n\
  \n#### 使用块分组语句\n\n注意之前所示的 `if` 语句语法在 `if (booleanExpression)` 之后指定了一个语句，在 `else`\
  \ 关键字之后也指定了一个语句。有时，你可能希望在布尔表达式为真时执行多个语句。你可以将这些语句分组在一个新方法中然后调用该新方法，但更简单的解决方案是将语句分组在一个*块*（block）中。块简单来说就是一组位于左大括号和右大括号之间的语句。\n\
  \n\n\n\n在下面的示例中，两个将 `seconds` 变量重置为 0 并增加 `minutes` 变量的语句被组合在一个块中，当 `seconds` 的值等于\
  \ 59 时，整个代码块将执行：\n\n```csharp\nint seconds = 0;\n\nint minutes = 0;\n\n...\n\nif\
  \ (seconds == 59)\n{\n    seconds = 0;\n    minutes++;\n}\nelse\n{\n    seconds++;\n\
  }\n```\n\n![Image](img/Image00004.jpg)  重要\n\n如果你省略了大括号，C# 编译器仅会将第一条语句 `seconds\
  \ = 0;` 与 `if` 语句关联。在编译程序时，随后的语句 `minutes++;` 将不会被编译器识别为 `if` 语句的一部分。此外，当编译器遇到 `else`\
  \ 关键字时，它不会将其与之前的 `if` 语句关联；而是会报告语法错误。因此，良好的做法是始终在块中定义 `if` 语句的每个分支的语句，即使该块只包含一条语句。如果你以后想添加额外的代码，这可能会为你节省一些麻烦。\n\
  \n一个块还会开启一个新的作用域。你可以在块内部定义变量，但它们会在块结束时消失。下面的代码片段说明了这一点：\n\n点击此处查看代码\n\n```csharp\n\
  if (...)\n{\n    int myVar = 0;\n    ... // 在这里可以使用 myVar\n} // myVar 在这里消失\nelse\n\
  {\n    // 这里不能使用 myVar\n    ...\n}\n\n// 这里不能使用 myVar\n```\n\n### 级联 if 语句\n\n你可以将\
  \ `if` 语句嵌套在其他 `if` 语句内部。通过这种方式，你可以连接一系列布尔表达式，按顺序一个一个测试，直到其中一个表达式的结果为 `true`。在下面的示例中，如果\
  \ `day` 的值为 0，第一个测试的结果为 `true`，并为 `dayName` 赋值字符串“Sunday”。如果 `day` 的值不 0，第一个测试失败，控制传递到\
  \ `else` 子句，该子句执行第二个 `if` 语句并将 `day` 的值与 1 进行比较。只有当第一个测试为 `false` 时，第二个 `if` 语句\
  \ 才会执行。同样，只有当第一个和第二个测试均为 `false` 时，第三个 `if` 语句才会执行。\n\n```csharp\nif (day == 0)\n\
  {\n    dayName = \"Sunday\";\n}\nelse if (day == 1)\n{\n    dayName = \"Monday\"\
  ;\n}\nelse if (day == 2)\n{\n    dayName = \"Tuesday\";\n}\nelse if (day == 3)\n\
  {\n    dayName = \"Wednesday\";\n}\nelse if (day == 4)\n{\n    dayName = \"Thursday\"\
  ;\n}\nelse if (day == 5)\n{\n    dayName = \"Friday\";\n}\nelse if (day == 6)\n\
  {\n    dayName = \"Saturday\";\n}\nelse\n{\n    dayName = \"unknown\";\n}\n```\n\
  \n在下面的练习中，你将编写一个使用级联 `if` 语句来比较两个日期的方法。\n\n### 编写 if 语句\n\n1. **启动** Microsoft Visual\
