  \ is August 4 2015\nValue of copy is still August 4 2015\n```\n\n前三条消息与之前相同。然而，第四条消息显示\
  \ `weddingAnniversaryCopy` 的值也变成了 August 4 2015。\n\n### 12. 按回车键返回 Visual Studio\
  \ 2015。\n\n***\n\n## 结构体与 Windows Runtime 的兼容性\n\n所有 C# 应用程序都通过 .NET Framework 的公共语言运行时（CLR）执行。CLR\
  \ 负责以虚拟机的形式提供一个安全、执行环境（如果你有 Java 背景，这个概念会很熟悉）。当你编译 C# 应用程序时，编译器会将代码转换为一组公共中间语言（CIL）。这些指令存储在程序集中。当你运行\
  \ C# 应用程序时，CLR 负责将其转换为处理器可以理解并执行的指令。\n\n在 Windows 7 及更早版本中，你还可以编写基于 Win32 API 的非托管应用程序（称为原生代码），Win32\
  \ API 是直接与操作系统的接口。（CLR 也会将 .NET Framework 的许多函数转换为 Win32 调用，这个过程对你的代码是完全透明的。）.NET\
  \ Framework 允许通过一组互操作技术将托管代码集成到非托管应用程序中，反之亦然。详细介绍这些技术的工作原理以及如何使用它们超本书的范围——只需知道这并不总是容易的。\n\
  \n后期的 Windows 版本以 Windows Runtime 的形式提供了另一种策略。\n\n### 总结\n\n在本章中，你学习了创建和使用枚举（enumeration）和结构体（structure）。你了解了结构体与类之间的一些相似之处和不同之处，并学习了如何定义构造函数来初始化结构体的字段。你还学习了如何通过重写\
  \ `ToString` 方法将结构体表示为字符串。\n\n\n\n\n\n![Image](img/Image00001.jpg) 如果你想继续阅读下一章，请保持\
  \ `Visual Studio 2015` 运行并转到第 10 章，“使用数组](#text00016.html_ch10)”。\n\n![Image](img/Image00001.jpg)\
  \ 如果你现在想退出 `Visual Studio 2015`，请在“文件”菜单上点击“退出”。如果你看到一个“保存”对话框，请点击“是”并保存项目。\n\n\
  ### 快速参考\n\n![Image](img/Image00090.jpg)\n\n## 第 10 章. 使用数组\n\n完成本章后，你将能够：\n\n![Image](img/Image00001.jpg)\
  \ 声明数组变量。\n\n![Image](img/Image00001.jpg) 用一组数据项填充数组。\n\n![Image](img/Image00001.jpg)\
  \ 访问数组中持有的数据项。\n\n![Image](img/Image00001.jpg) 遍历数组中的数据项。\n\n你已经看到了如何创建和使用许多不同类型的变量。然而，你目前为止的所有变量示例都有一个共同点——它们存储关于单个项目的信息（一个\
  \ `int`、一个 `float`、一个 `Circle`、一个 `Date` 等）。如果你需要处理一组项该怎么办？解决方案为集合中的每个项创建一个变量，但这会导致许多后续问题：你需要多少个变量？应该如何命名它们？如果你需要对集合中的每个项执行相同的操作（例如对整数集合中的每个变量加\
  \ 1），你将如何避免非常重复的代码？为单独的项使用变量是假设你在编写程序时已经知道需要多少个项。但这种情况发生的频率到底有多高呢？例如，如果你正在编写一个从数据库读取并处理记录的应用程序，数据库中有多少条记录，这个数字变化的概率有多大？\n\
  \n数组提供了一种解决这些问题的机制。\n\n### 声明和创建数组\n\n`array`（数组）是项的无序序列。数组中的所有项具有相同的类型，这与结构体或类中的字段不同，字段可以具有不同的类型。数组中的项存储在连续的内存块中，并通过使用索引访问，而结构体或类中的字段是通过名称访问的。\n\
  \n#### 声明数组变量\n\n你通过指定元素类型的名称，后跟一对方括号，然后是变量名来声明数组变量。方括号表示该变量是一个数组。例如，要声明一个名为 `pins`\
  \ 的 `int` 变量数组（用于存储一组个人识别码），你可以写如下代码：\n\n点击此处查看代码图像\n\n```\nint[] pins; // 个人识别码\n\
  ```\n\n* * *\n\n![Image](img/Image00005.jpg) 释\n\n如果你是 Microsoft Visual Basic 程序员，你应该注意到在声明中使用的是方括号而不是括号。如果你熟悉\
  \ `C` 和 `C++`，也请注意数组的大小不是声明的一部分。此外，方括号必须放置在变量名 `before`（之前）的侧。\n\n* * *\n\n你并不限于使用基本数据类型作为数组元素。你还可以创建结构体、枚举和类的数组。例如，你可以像这样创建一个\
  \ `Date` 结构体数组：\n\n```\nDate[] dates;\n```\n\n* * *\n\n![Image](img/Image00013.jpg)\
  \ 提示\n\n给数组变量赋予复数名称通常很有用，例如 `places`（每个元素都是 `Place`）、`people`（每个元素都是 `Person`）或\
  \ `times`（每个元素都是 `Time`）。\n\n* * *\n\n#### 创建数组\n\n数组是项的无序序列。数组中的所有项具有相同的类型，这与结构体或类中的字段不同，字段可以具有不同的类型。数组中的项存储在连续的内存块中，并通过使用索引访问，而结构体或类中的字段是通过名称访问的。\n\
