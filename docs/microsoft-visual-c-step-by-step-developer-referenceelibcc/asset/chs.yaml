  ***\n\n![Image](img/Image00005.jpg) 注意\n\n接下来的章节 `选择数据`、`过滤数据`、`排序、分组和聚合数据` 以及 `连接数据`\
  \ 展示了使用 `LINQ` 方法查询数据的基本能力和语法。语法有时会变得有点复杂，当你到达 `使用查询操作符` 章节时，你会发现实际上没有必要记住所有语法是如何工作的。然而，你至少看一眼这些章节是有用的，这样你就能充分理解\
  \ `C#` 提供的查询操作符是如何执行它们的任务的。\n\n***\n\n### 选择数据\n\n假设你想显示一个由 `customers` 数组中每个客户的\
  \ FirstName 列表。你可以通过以下代码完成此任务：\n\n点击此处查看代码图像\n\n```csharp\nIEnumerable<string> customerFirstNames\
  \ =\ncustomers.Select(cust => cust.FirstName);\n\nforeach (string name in customerFirstNames)\n\
  {\n    Console.WriteLine(name);\n}\n```\n\n尽管这段代码非常短，但它做了很多工作，并且需要一定程度解释，从使用 `customers`\
  \ 数组的 `Select` 方法开始。\n\n使用 `Select` 方法，你可以从数组中检索特定数据——在这种情况下，只需获取数组中每个项的 `FirstName`\
  \ 字段中的值。它是如何工作的？`Select` 方法的参数实际上是另一个方法，它接收 `customers` 数组中的行，并返回该行中选定的数据。你可以定义自己的自定义方法来执行此任务，但简单的机制是使用\
  \ lambda 表达式来定义匿名方法，如上一个示例所示。在这一点上，你需要理解三三个重要点：\n\n![Image](img/Image00001.jpg)\
  \ 变量 `cust` 是传递给方法的参数。你可以将 `cust` 视为 `customers` 数组中每行的别名。编译器从你对 `customers` 数组上调用\
  \ `Select` 方法这一事实推导出这一点。你可以使用任何合法的 `C#` 标识符代替 `cust`。\n\n![Image](img/Image00001.jpg)\
  \ `Select` 方法此时并没有实际检索数据；它只是返回一个可枚举对象，当你以后遍历它时，该对象将获取由 `Select` 方法标识的数据。我们将在本章稍后部分的\
  \ `LINQ 和延迟求值` 章节中回到这一方面。\n\n![Image](img/Image00001.jpg) `Select` 方法实际上并不是 `Array`\
  \ 类型的方法。它是 `Enumerable` 类的一个扩展方法。`Enumerable` 类位于 `System.Linq` 命名空间中，并提供了一系列静态方法，用于查询实现泛型\
  \ `IEnumerable<T>` 接口的对象。\n\n上一个示例使用 `customers` 数组的 `Select` 方法生成一个名为 `customerFirstNames`\
  \ 的 `IEnumerable<string>` 对象。（它的类型是 `IEnumerable<string>`，因为 `Select` 方法返回一个包含客户\
  \ FirstName 的可枚举集合，这些都是字符串。）`foreach` 语句遍历这个字符串集合，按以下顺序打印每个客户的 FirstName：\n\nKim\n\
  Jeff\nCharlie\nChris\nDave\nAnn\nJohn\nDavid\nGreg\nTim\n\n你现在可以显示每个客户的 FirstName\
  \ 了。你如何获取每个客户的 FirstName 和 LastName？这个任务稍微复杂一些。如果你查看 Microsoft Visual Studio 2015\
  \ 提供的文档中 `System.Linq` 命名空间下的 `Enumerable.Select` 方法定义，你会发现它看起来这样：\n\n点击此处查看代码图像\n\
  \n```csharp\npublic static IEnumerable<TResult> Select<TSource, TResult> (\n   \
  \ this IEnumerable<TSource> source,\n    Func<TSource, TResult> selector\n)\n```\n\
  \n这实际上表达是 `Select` 是一个泛型方法，接受两个名为 `TSource` 和 `TResult` 的类型参数，以及两个名为 `source` 和\
  \ `selector` 的普通参数。`TSource` 是你正在生成可枚举结果集的集合类型（在本例中为 `customer` 对象），而 `TResult`\
  \ 是可枚举结果集中的数据类型（在本例中为 `string` 对象）。记住 `Select` 是一个扩展方法，因此 `source` 参数实际上是对所扩展类型的引用（在示例中，是实现\
  \ `IEnumerable` 接口的 `customer` 对象泛型集合）。`selector` 参数指定了一个标识要检索字段的泛型方法。（记住 `Func`\
  \ 是 .NET Framework 中一种泛型委托类型，你可以用它来封装返回结果的泛型方法。）\n\n\n\n在语法上，`Where` 方法与 `Select`\
  \ 类似。它期望一个参数，该参数定义了一个根据你指定的标准过滤数据的方法。此示例使用了另一个 lambda 表达式。变量 `addr` 是 `addresses`\
  \ 数组中某行的别名，该 lambda 表达式返回所有 `Country` 字段匹配字符串“United States”的行。`Where` 方法返回一个可枚举的行集合，其中包含原始集合中的每个字段。随后，对这些行应用\
  \ `Select` 方法，以从该可枚举集合中仅投影 `CompanyName` 字段，并返回另一个包含 `string` 对象的可枚举集合。（变量 `usComp`\
  \ 是 `Where` 方法返回的可枚举集合中每行类型的别名。）因此，此完整表达式的结果类型为 `IEnumerable<string>`。理解这一系列操作顺序至关重要——首先应用\
  \ `Where` 方法来过滤行，然后应用 `Select` 方法来指定字段。用于迭代此该集合的 `foreach` 语句显示了以下公司：\n\n- Coho\
  \ Winery\n- Trey Research\n\n#### 排序、分组和聚合数据\n\n如果你熟悉 SQL，你就会知道除了简单的投影和过滤之外，它还允许你执行各种关系型操作。例如，你可以指定按特定顺序返回数据，根据一个或多个键字段对返回的行进行分组，并根据每个组中的行计算汇总值。LINQ\
  \ 提供了相同的功能。\n\n要按特定顺序检索数据，可以使用 `OrderBy` 方法。与 `Select` 和 `Where` 方法一样，`OrderBy`\
  \ 期望一个方法作为其参数。该方法识别你想要用于排序数据的表达式。例如，你可以按升序显示 `addresses` 数组中每家公司的名称，如下：\n\n点击此处查看代码图片\n\
  \n```\nIEnumerable<string> companyNames =\n    addresses.OrderBy(addr => addr.CompanyName).Select(comp\
  \ => comp.CompanyName);\n\nforeach (string name in companyNames)\n{\n    Console.WriteLine(name);\n\
  }\n```\n\n这段代码按字母顺序显示 addresses 表中的公司：\n\n- Alpine Ski House\n- Coho Winery\n- Trey\
  \ Research\n- Wide World Importers\n- Wingtip Toys\n\n如果你想按降序枚举数据，可以使用 `OrderByDescending`\
  \ 方法代替。如果你想按多个键值进行排序，可以在 `OrderBy` 或 `OrderByDescending` 之后使用 `ThenBy` 或 `ThenByDescending`\
  \ 方法。\n\n根据一个或多个字段中的共同值对数据进行分组，可以使用 `GroupBy` 方法。下面的示例了如何按国家对 `addresses` 数组中的公司进行分组：\n\
  \n点击此处查看代码图片\n\n```c\nvar companiesGroupedByCountry =\n    addresses.GroupBy(addrs\
  \ => addrs.Country);\n\nforeach (var companiesPerCountry in companiesGroupedByCountry)\n\
  {\n    Console.WriteLine(\n        $\"Country: {companiesPerCountry.Key}\\t{companiesPerCountry.Count()}\
  \ companies\");\n\n    foreach (var companies in companiesPerCountry)\n    {\n \
  \       Console.WriteLine($\"\\t{companies.CompanyName}\");\n    }\n}\n```\n\n此时，你应该识别出这种模式。`GroupBy`\
  \ 方法期望你对数据进行分组。然而，`Select` 方法和 `GroupBy` 方法之间存在一些微妙的区别。感兴趣的主要在于，`GroupBy` 方法返回一个可枚举组集合，每个组都有一个\
  \ `Key` 属性。你可以访问 `Key` 属性来获取共同值，并使用 `Count()` 方法获取每个组中的项目数。\n\n首先应用 `Where` 方法来过滤行，然后应用\
  \ `Select` 方法来指定字段。用于迭代此集合的 `foreach` 语句显示了以下公司：\n\n- Coho Winery\n- Trey Research\n\
  \n\n\n客户的姓和名存储在 `customers` 数组中，但客户所属各公司的国家存储在 `addresses` 数组中。`customers` 数组与 `addresses`\
  \ 数组之间的公共键是公司名称。`Select` 方法指定了 `customers` 数组中感兴趣的字段（`FirstName` 和 `LastName`），以及包含公共键的字段（`CompanyName`）。你使用\
  \ `Join` 方法将 `Select` 方法标识的数据与另一个枚举集合进行连接。`Join` 方法的参数如下：\n\n![Image](img/Image00001.jpg)\
  \ 用于进行连接的枚举集合\n\n![Image](img/Image000011.jpg) 用于从 `Select` 方法标识的数据中识别公共键字段的方法\n\
  \n![Image](img/Image00001.jpg) 用于在所选数据上进行连接的公共键字段的方法\n\n![Image](img/Image00001.jpg)\
  \ 指定 `Join` 方法返回的枚举结果集中所需的列的方法\n\n在例示例中，`Join` 方法将包含 `FirstName`、`LastName` 和 `CompanyName`\
  \ 字段的 `customers` 数组枚举集合与 `addresses` 数组中的行进行连接。当 `customers` 数组中的 `CompanyName`\
  \ 字段值与 `addresses` 数组中的 `CompanyName` 字段值匹配时，这两组数据连接在一起。结果集包含 `customers` 数组的 `FirstName`\
  \ 和 `LastName` 字段以及 `addresses` 数组的 `Country` 字段的行。输出 `companiesAndCustomers` 集合数据的代码显示了以下信息：\n\
  \n点击此处查看图像\n\n```\n{ FirstName = Kim, LastName = Abercrombie, Country = Switzerland\
  \ }\n{ FirstName = Jeff, LastName = Hay, Country = United States }\n{ FirstName\
  \ = Charlie, LastName = Herb, Country = Switzerland }\n{ FirstName = Chris, LastName\
  \ = Preston, Country = United States }\n{ FirstName = Dave, LastName = Barnett,\
  \ Country = United Kingdom }\n{ FirstName = Ann, LastName = Beebe, Country = United\
  \ States }\n{ FirstName = John, LastName = Kane, Country = United Kingdom }\n{ FirstName\
  \ = David, LastName = Simpson, Country = United States }\n{ FirstName = Greg, LastName\
  \ = Chapman, Country = United Kingdom }\n{ FirstName = Tim, LastName = Litton, Country\
  \ = United Kingdom }\n```\n\n* * *\n\n![Image](img/Image00005.jpg) 注意\n\n请记住，内存中的集合与关系型数据库中的表不同，它们包含的数据不受相同数据完整性约束的。在关系型数据库中，假设每个客户都有一个对应的公司，且每个公司都有自己唯一的地址是可以接受的。集合不强制相同级别的数据完整性，这意味着你可以很容易地让一个客户引用一个\
  \ `addresses` 数组中不存在的公司，你甚至可能让同一个公司在 `addresses` 数组中出现多次。在这些情况下，你获得的结果可能是准确但出乎意料的。当你完全理解要连接的数据之间之间的关系时，Join\
  \ 操作的效果最好。\n\n* * *\n\n### 使用查询运算符\n\n前面的章节向你展示了许多使用在 `System.Linq` 命名空间中定义的 `Enumerable`\
  \ 类的扩展方法对内存中数据进行查询的功能。该语法利用了多项高级 C# 语言特性，生成的代码有时可能很难理解和维护。为了减轻你的负担，C# 的设计者在语言中添加了查询运算符，你可以使用更类似于\
  \ SQL 的语法来利用 LINQ 特性。\n\n正如你在本章前面的示例中看到的那样，你可以这样获取每个客户的姓：\n\n点击此处查看图像\n\n```c\n\
  IEnumerable<string> customerFirstNames = customers.Select(cust => cust.FirstName);\n\
  ```\n\n你可以通过 `from` 和 `select` 查询运算符来重新表述此条语句，如下：\n\n点击此处查看图像\n\n```c\nvar customerFirstNames\
  \ = from cust in customers\nselect cust.FirstName;\n```\n\n在编译时，C# 编译器会将此表达式解析为相应的\
  \ `Select` 方法。`from` 运算符为源集合定义了别名，`select` 运算符使用该别名指定要检索的字段。结果是包含客户姓的枚举集合。如果你熟悉\
  \ SQL，请注意 `from` 运算符出现在 `select` 运算符之前。\n\n按照同样的思路，为了获取每个客户的姓和名，你可以使用以下语句。（你可能想参考之前基于\
  \ `Select` 扩展方法的相同语句示例。）\n\n点击此处查看图像\n\n```c\nvar customerNames = from cust in customers\n\
  select new { cust.FirstName, cust.LastName };\n```\n\n你使用 `where` 运算符来过滤数据。以下示例显示了如何从\
  \ `addresses` 数组中返回位于美国的公司名称：\n\n点击此处查看图像\n\n```c\nvar usCompanies = from a in addresses\n\
  where String.Equals(a.Country, \"United States\")\nselect a.CompanyName;\n```\n\n\
  要对数据进行排序，使用 `orderby` 运算符，如下：\n\n点击此处查看图像\n\n```c\nvar companyNames = from a in\
  \ addresses\norderby a.CompanyName\nselect a.CompanyName;\n```\n\n你可以通过以下方式使用 `group`\
  \ 运算符对数据分组：\n\n点击此处查看图像\n\n```c\nvar companiesGroupByCountry = from a in addresses\n\
  group a by a.Country;\n```\n\n注意，与之前的分组数据示例类似，你不需要提供 `select` 运算符，你可以像下面一样遍历结果：\n\
  \n点击此处查看图像\n\n```csharp\nforeach (var companiesPerCountry in companiesGroupByCountry)\n\
  {\n    Console.WriteLine($\"Country: {companiesPerCountry.Key}\\t{companiesPerCountry.Count()}\
  \ companies\");\n    foreach (var companies in companiesPerCountry)\n    {\n   \
  \     Console.WriteLine($\"\\t{companies.CompanyName}\");\n    }\n}\n```\n\n你可以这样对枚举集合调用\
  \ `Count` 等汇总函数：\n\n点击此处查看图像\n\n```csharp\nint numberOfCompanies = (from a in addresses\n\
  select a.CompanyName).Count();\n```\n\n注意你需要对表达式括号。如果你想忽略重复值，使用 `Distinct` 方法：\n\
  \n点击此处查看图像\n\n```csharp\nint numberOfCountries = (from a in addresses\nselect a.Country).Distinct().Count();\n\
  ```\n\n* * *\n\n![Image](img/Image00013.jpg) 提示\n\n在许多情况下，你可能只想统计集合中的行数，而不是集合中所有行的某个字段的值数量。在这种情况下，你可以直接在原始集合上调用\
  \ `Count` 方法，如下：\n\n点击此处查看图像\n\n```csharp\nint numberOfCompanies = addresses.Count();\n\
  ```\n\n* * *\n\n你可以使用 `join` 运算符跨公共键连接两个集合。以下示例显示了跨每个集合的 `CompanyName` 列返回客户和地址的查询，这次使用\
  \ `join` 运算符重新表述。你使用 `on` 子句配合 `equals` 运算符来指定两个集合之间的关系。\n\n* * *\n\nLINQ 目前仅支持等连接（基于等等的连接）。如果你是习惯了\
  \ SQL 的数据库开发者，你可能熟悉基于其他运算符（如 `>` 和 `<`）的连接，但 LINQ 并不提供这些功能。\n\n\n\n\n点击此处查看代码图像\n\
  \n```csharp\nvar countriesAndCustomers = from a in addresses\njoin c in customers\n\
  on a.CompanyName equals c.CompanyName\nselect new { c.FirstName, c.LastName, a.Country\
  \ };\n```\n\n***\n\n![Image](img/Image00005.jpg) 注意\n\n与 SQL 不同，LINQ 表达式中 `on` 子句的表达式的顺序是重要的。你必须将你正在连接的项（引用\
  \ `from` 子句中集合中的数据）放在 `equals` 运算符的左侧，并将你正与之连接的项（引用 `join` 子句中集合中的数据）放在右侧。\n\n***\n\
  \nLINQ 提供了大量其他方法，用于汇总信息以及连接、分组和搜索数据。本节仅涵盖了最常用的功能。例如，LINQ 提供了 `Intersect` 和 `Union`\
  \ 方法，你可以使用它们来执行集合范围的操作。它还提供了 `Any` 和 `All` 等方法，你可以使用它们来判断集合中至少有一个项目或集合中的每个项目是否匹配指定的谓词。你可以使用\
  \ `Take` 和 `Skip` 方法对可枚举集合中的值进行分区。更多信息请参阅 Visual Studio 2015 提供的文档中的 LINQ 部分。\n\n\
  ### 在 `Tree<TItem>` 对象中查询数据\n\n在本章中目前看到的示例展示了如何查询数组中的数据。对于任何实现泛型 `IEnumerable<T>`\
  \ 接口的集合类可以使用相同的技术。在接下来的练习中，你将为公司的员工建模创建一个新类。你将创建一个包含 `Employee` 对象集合的 `BinaryTree`\
  \ 对象，然后使用 LINQ 查询这些信息。你最初将直接调用 LINQ 扩展方法，然后将修改代码使用查询操作符。\n\n#### 使用扩展方法从 `BinaryTree`\
  \ 检索数据\n\n1. 如果 Visual Studio 2015 未运行，请启动它。\n\n2. 打开 `QueryBinaryTree` 解决方案，它位于文档文件夹中的\
  \ `\\Microsoft Press\\VCSBS\\Chapter 21\\QueryBinaryTree` 文件夹。该项目包含 `Program.cs`\
  \ 文件，该文件定义了带有之前练习中过的 `Main` 和 `doWork` 方法的 `Program` 类。\n\n3. 在解决方案资源管理器中，右键点击 `QueryBinaryTree`\
  \ 项目，指向“添加”，然后点击“类”。在“添加新项 - Query BinaryTree”对话框中，在“名称”框中输入 `Employee.cs`，然后点击“添加”。\n\
  \n4. 将以下代码中**粗体**显示的自动属性添加到 `Employee` 类中：\n\n点击此处查看代码图像\n\n```csharp\nclass Employee\n\
  {\n    public string FirstName { get; set; }\n    public string LastName { get;\
  \ set; }\n    public string Department { get; set; }\n    public int Id { get; set;\
  \ }\n}\n```\n\n5. 将后续代码中**粗体**显示的 `ToString` 方法添加到 `Employee` 类中。.NET Framework\
  \ 类型在将对象转换为字符串表示时使用此方法，例如当使用 `Console.WriteLine` 语句显示它时。\n\n点击此处查看代码图像\n\n```csharp\n\
  class Employee\n{\n    ...\n    public override string ToString()\n    {\n     \
  \   return $\"Id: {this.Id}, Name: {this.FirstName} {this.LastName}, Dept: {this.Department}\"\
  ;\n    }\n}\n```\n\n6. 修改 `Employee` 类定义以实现 `IComparable<Employee>` 接口，如下所示：\n\n\
  点击此处查看代码图像\n\n```csharp\nclass Employee : IComparable<Employee>\n{\n}\n```\n\n此步骤是必要的，因为\
  \ `BinaryTree` 类规定其元素必须是“可比较的”。\n\n7. 悬停在类定义中的 `IComparable<Employee>` 上，点击出现的灯泡图标，然后在右键菜单上点击“显式实现接口”。\n\
  \n此操作将生成 `CompareTo` 方法的默认实现。记住，当 `BinaryTree` 类在插入元素时需要比较元素，会调用此方法。\n\n8. 将 `CompareTo`\
  \ 方法的主体替换为下面**粗体**所示的代码。此 `CompareTo` 方法的实现根据 `Id` 字段的值来比较 `Employee` 对象。\n\n点击此处查看代码图像\n\
  \n```csharp\nint IComparable<Employee>.CompareTo(Employee other)\n{\n    if (other\
  \ == null)\n    {\n        return 1;\n    }\n    if (this.Id > other.Id)\n    {\n\
  \        return 1;\n    }\n    if (this.Id < other.Id)\n    {\n        return -1;\n\
  \    }\n    return 0;\n}\n```\n\n***\n\n![Image](img/Image00005.jpg) 注意\n\n有关 `IComparable<T>`\
  \ 接口的描述，请参考第 19 章。\n\n***\n\n9. 在解决方案资源管理器中，右键点击 `QueryBinaryTree` 解决方案，指向“添加”，然后点击“现有项目”。在“添加现有项目”对话框中，转到文档文件夹中的\
  \ `\\Microsoft Press\\VCSBS\\Chapter 21\\QueryBinaryTree` 文件夹，点击 `BinaryTree` 类，然后点击“确定”。\n\
  \n10. 在解决方案资源管理器中，右键点击 `QueryBinaryTree` 项目，指向“添加”，然后点击“现有”。`BinaryTree` 项目包含一个你在第\
  \ 19 章中实现的可枚举 `BinaryTree` 类的副本。\n\n11. 显示 `BinaryTree` 项目的 `Program.cs` 文件，并验证文件顶部的\
  \ `using` 指令包含：`using System.Linq;`\n\n12. 在文件顶部添加 `using` 指令：`using scope BinaryTree;\
  \ Binary`\n\n13. 在 `Program` 类的 `doWork` 方法中，删除原有的代码并注释掉，然后添加语句来构造 `BinaryTree`\
  \ 实例：\n\n点击此处查看代码代码 0text00002.html_pro43300)\n\n```csharp\nstatic void doWork()\n\
  {\n    Tree<Employee> empTree = new Tree<Employee>(\n        new Employee { Id =\
  \ 1, FirstName = \"Kim\", LastName = \"Abercrombie\", Department = \"IT\" });\n\
  \    empTree.Insert(new Employee { Id = 2, FirstName = \"Jeff\", LastName = \"Hay\"\
  , Department = \"Marketing\" });\n    empTree.Insert(new Employee { Id = 4, FirstName\
  \ = \"Charlie\", LastName = \"Herb\", Department = \"IT\" });\n    empTree.Insert(new\
  \ Employee { Id = 6, FirstName = \"Chris\", LastName = \"Preston\", Department =\
  \ \"Sales\" });\n    empTree.Insert(new Employee { Id = 3, FirstName = \"Dave\"\
  , LastName = \"Barnett\", Department = \"Sales\" });\n    empTree.Insert(new Employee\
  \ { Id = 5, FirstName = \"Tim\", LastName = \"Litton\", Department = \"Marketing\"\
