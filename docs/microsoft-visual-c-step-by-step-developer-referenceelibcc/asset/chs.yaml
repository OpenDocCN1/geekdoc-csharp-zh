  ### 6. 返回 Visual Studio 并停止调试。\n\n### 通过 Web 服务插入、更新和删除数据\n\n除了赋予用户查询和显示数据的能力外，许多应用程序还要求允许用户插入、更新和删除信息。ASP.NET\
  \ Web API 通过使用 HTTP PUT、POST 和 DELETE 请求实现了一个支持这些操作的模型。按照约定，PUT 请求修改 Web 服务中的现有资源，而\
  \ POST 请求创建资源的新实例。DELETE 请求删除资源。ASP.NET Web API 模板中挂架程序生成的代码遵循了这些约定。\n\n***\n\n\
  ### REST Web 服务中的幂等性\n\n在 REST Web 服务中，PUT 请求应该是幂等的（idempotent），这意味着如果你多次执行相同的更新，结果始终相同。在\
  \ `AdventureWorksService` 示例中，如果你修改客户并将电话设置为“888-888-8888”，无论你执行此操作多少次，结果都是一样的。这似乎显而易见，但你在设计\
  \ REST Web 服务时应该考虑这一要求。通过这种设计方法，Web 服务在面对并发请求时是健壮的，甚至在发生网络故障也是如此（如果客户端应用丢失与 Web\
  \ 服务的连接，它可以简单重新连接并再次执行相同的请求，而无需担心之前的请求是否成功）。因此，你应该将 REST Web 服务视为存储和检索数据的手段，而不应尝试实现特定的业务操作。\n\
  \n\n\n\n例如，如果你正在构建一个银行系统，你可能想要提供一个 `CreditAccount` 方法，向客户账户的余额中增加金额，并将此方法暴露为 `PUT`\
  \ 操作。然而，每当你调用此操作时，其结果都是对账户进行增量贷记。因此，跟踪操作调用是否成功变得非常必要。如果你的应用程序认为之前的调用失败或超时，它就不能重复调用此操作，因为结果可能会导致同一个账户产生多次重复的贷记。\n\
  \n关于管理云应用程序中数据一致性的更多信息，请参阅 *[`msdn.microsoft.com/library/dn589800.aspx`](https://msdn.microsoft.com/library/dn589800.aspx)*\
  \ 上的“数据一致性原理”（Data Consistency Primer）。\n\n***\n\n在接下来的练习中，你将扩展 Customers 应用程序并添加功能，使用户可以添加新客户并修改现有客户的详情。应用程序将构建相应的\
  \ REST 请求并发送到 `AdventureWorksService` Web 服务。你不需要提供任何删除客户的功能。此限制确保了你拥有所有与 Adventure\
  \ Works 组织进行过业务的客户记录，这可能是审计之目的所需的。此外，即使客户已经很久没有活跃，客户也有可能在未来的某个时刻下订单。\n\n***\n\n\
  ![Image](img/Image00005.jpg) 备注\n\n业务应用程序从不删除数据，而是通过执行更新以某种方式标记数据为“已删除”并阻止其显示的情况正变得越来越普遍。这主要是由于保留完整数据记录的需求，通常是为了满足监管要求。\n\
  \n***\n\n## 在 `ViewModel` 类中实现添加和编辑功能\n\n1. 返回到 Visual Studio。\n2. 在 Customers 项目中，删除\
  \ `ViewModel.cs` 文件以从项目中移除它。允许 Visual Studio 永久删除此文件。\n3. 右键点击 Customers 项目，指向“添加”（Add），然后点击“现有项”（Existing\
  \ Item）。选择 `ViewModel.cs` 文件，该文件位于你文档 文件夹中的 `\\Microsoft Press\\VCSBS\\Chapter 27`\
  \ 文件夹中，然后点击“添加”。\n\n`ViewModel.cs` 文件中的代码变得相当冗长，因此已重新组织为多个区域（regions）以便管理。`ViewModel`\
  \ 类还扩展了以下布尔属性，这些属性指示 `ViewModel` 运行的模式：浏览、添加或编辑。这些属性定义在名为“管理编辑模式的属性”（Properties\
  \ For Managing The Edit Mode）的区域中：\n\n- `IsBrowsing`: 此属性指示 `ViewModel` 是否处于浏览模式。当\
  \ `ViewModel` 处于浏览模式时，`FirstCustomer`、`LastCustomer`、`PreviousCustomer` 和 `NextCustomer`\
  \ 命令被启用，视图可以调用这些命令来浏览数据。\n- `IsAdding`: 此属性指示 `ViewModel` 是否处于添加模式。在此模式下，`FirstCustomer`、`LastCustomer`、`PreviousCustomer`\
  \ 和 `NextCustomer` 命令被禁用。你将定义一个 `AddCustomer` 命令、一个 `SaveChanges` 命令和一个 `DiscardChanges`\
  \ 命令，它们将在模式模式被启用。\n- `IsEditing`: 此属性指示 `ViewModel` 是否处于编辑模式。与添加模式一样，在此模式下，`FirstCustomer`、`LastCustomer`、`PreviousCustomer`\
  \ 和 `NextCustomer` 命令被禁用。你将定义一个 `EditCustomer` 命令，它将在模式模式被启用。`SaveChanges` 命令和 `DiscardChanges`\
  \ 命令也会被启用，但 `AddCustomer` 命令将被禁用。`EditCustomer` 命令在添加模式下被禁用。\n- `IsAddingOrEditing`:\
  \ 此属性指示 `ViewModel` 是否处于添加或编辑模式。你将在本练习中定义方法中使用此属性。\n- `CanBrowse`: 如果 `ViewModel`\
  \ 处于浏览模式且与 Web 服务的连接打开，此属性返回 `true`。构造函数中创建 `FirstCustomer`、`LastCustomer`、`PreviousCustomer`\
  \ 和 `NextCustomer` 命令的代码已更新，使用此属性来确定这些命令应该被启用还是禁用，如下：\n\n点击此处查看代码图像\n\n```csharp\n\
  public ViewModel()\n{\n\n...\n\nthis.NextCustomer = new Command(this.Next,\n\n()\
  \ => { return this.CanBrowse &&\n\nthis.customers != null && !this.IsAtEnd; });\n\
  \nthis.PreviousCustomer = new Command(this.Previous,\n\n() => { return this.CanBrowse\
  \ &&\n\nthis.customers != null && !this.IsAtStart; });\n\nthis.FirstCustomer = new\
  \ Command(this.First,\n\n() => { return this.CanBrowse &&\n\nthis.customers != null\
  \ && !this.IsAtStart; });\n\nthis.LastCustomer = new Command(this.Last,\n\n() =>\
  \ { return this.CanBrowse &&\n\nthis.customers != null && !this.IsAtEnd; });\n\n\
  }\n```\n\n- `CanSaveOrDiscardChanges`: 如果 `ViewModel` 处于添加或编辑模式且与 Web 服务的连接打开，此属性返回\
  \ `true`。\n\n“获取和更新数据的方法”（Methods For Fetching And Updating Data）区域包含以下方法：\n\n-\
  \ `GetDataAsync`: 这是你在本章早些时候创建的相同方法。它连接到 Web 服务并检索每个客户的详情。\n- `ValidateCustomer`:\
  \ 此方法接收一个 `Customer` 对象并检查 `FirstName` 和 `LastName` 属性以确保它们不为空。它还检查 `EmailAddress`\
  \ 和 `Phone` 属性以验证它们是否包含有效格式的信息。如果数据有效，方法返回 `true`，否则返回 `false`。你将在练习稍晚时候创建 `SaveChanges`\
  \ 命令时使用此方法。\n\n***\n\n![Image](img/Image00005.jpg) 备注\n\n验证 `EmailAddress` 和 `Phone`\
  \ 属性的代码通过使用 `System.Text.RegularExpressions` 命名空间中定义的 `Regex` 类执行正则表达式匹配。要使用此类类，你需要在\
  \ `Regex` 对象中定义一个正则表达式，指定数据应匹配的模式，然后调用 `Regex` 对象的 `IsMatch` 方法并传入你需要验证的数据。关于正则表达式和\
  \ `Regex` 类的更多信息，请参阅微软网站上的“正则表达式对象模型”（The Regular Expression Object Model），地址为 *[`msdn.microsoft.com/library/30wb966`](http://msdn.microsoft.com/library/30wb966)*。\n\
  \n***\n\n- `CopyCustomer`: 此方法的目的是创建 `Customer` 对象的浅拷贝。你将在创建 `EditCustomer` 命令时使用它，在客户数据更改之前创建其原始数据的副本。如果用户决定放弃更改，只需从由此方法创建的副本中拷贝回原始数据即可。\n\
  \n4. 在解决方案管理器（Solution Explorer）中，展开 Customers 项目并双击 `ViewModel.cs` 文件以在代码和文本窗口中打开它。\n\
  5. `ViewModel` 类顶部的 `ServerUrl` 字符串变量定义如下：\n\n点击此处查看代码图像\n\n```csharp\nprivate const\
