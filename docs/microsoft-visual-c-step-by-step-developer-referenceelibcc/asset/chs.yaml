  \n### 快速参考\n\n![Image](img/Image00096.jpg)\n\n## 第 12 章.使用继承\n\n完成本章后，你将能够：\n\n\
  ![Image](img/Image00001.jpg) 创建继承基类特征的派生类。\n\n![Image](img/Image00001.jpg) 使用 `new`、`virtual`\
  \ 和 `override` 关键字控制方法的隐藏蔽和重写。\n\n![Image](img/Image00001.jpg) 使用 `protected` 关键字限制继承层次结构中的可访问性。\n\
  \n![Image](img/Image00001.jpg) 定义扩展方法作为使用继承的替代机制。\n\n继承是面向对象编程世界中的一个核心概念。在定义具有许多共同特征且彼此关系密切相关的不同类时，你可以继承作为一种工具来避免重复。也许它们是相同类型的不同类，每个类都有自己的独特特征——例如工厂中的`经理`、`工人`和`所有员工`。如果你正在编写一个模拟工厂的应用程序，你将如何指定经理和工人具有许多相同的特征，但同时也具有不同的特征呢？例如，他们都有员工编号，但经理有不同的责任，执行的任务也与工人不同。\n\
  \n这就是继承证明其有用之处。\n\n### 什么是继承？\n\n如果你询问几位经验丰富的程序员 `inheritance`（继承）一词的含义，你通常会得到不同且矛盾的答案。这种困惑源源于“继承”这个词本身有几个细微不同的含义。如果有人在遗嘱中将某物留给你，被认为是你继承了它。同样，我们说从母亲那里继承了一半基因，从父亲那里继承了一半基因。这个词的这两种用法与编程中的继承几乎没有关系。\n\
  \n编程中的继承完全是为了分类的——它是类与类之间的关系。例如，当你上学校时，你可能学习过哺乳动物，你了解到马和鲸鱼是哺乳动物的例子。每个动物都具有哺乳动物具备的所有属性（呼吸空气、哺乳养幼崽、恒温动物等），但每个动物也有自己的特殊特征（马有蹄子，而鲸鱼有鱼鳍和尾叶）。\n\
  \n你如何在程序中为马和鲸鱼建模？一种方法是创建两个名为 `Horse` 和 `Whale` 的不同类。每个类都可以以自己的方式实现该类型哺乳动物特有的行为，例如\
  \ `Trot`（针对马）或 `Swim`（针对鲸鱼）。但你如何处理马和鲸鱼共有的行为，如 `Breathe` 或 `SuckleYoung`？你可以在两个类中添加这些同名的重复方法，但这种情况会变成维护的噩梦，特别是当你还决定开始建模其他类型的哺乳动物时，如\
  \ `Human` 和 `Aardvark`。\n\n在 C# 中，你可以使用类继承来解决这些问题。马、鲸鱼、人类和土蚁都是哺乳动物类型，因此你可以创建一个名为\
  \ `Mammal` 的类，提供这些类型展示出的共同功能。然后你可以声明 `Horse`、`Whale`、`Human` 和 `Aardvark` 类都继承自\
  \ `Mammal`。这些类随后会自动包含 `Mammal` 类的功能（`Breathe`、`SuckleYoung` 等），但你也可以为每个类增加特定哺乳动物类型特有的功能——`Horse`\
  \ 类的 `Trot` 方法和 `Whale` 类的 `Swim` 方法。如果你需要修改如 `Breathe` 等常用方法的工作方式，你只需要在一个地方进行更改，即\
  \ `Mammal` 类。\n\n### 使用继承\n\n你通过以下语法声明一个类继承自另一个类：\n\n```csharp\nclass DerivedClass\
  \ : BaseClass\n{\n...\n}\n```\n\n派生类继承自基类，基类中的方法成为派生类的一部分。在 C# 中，一个类最多允许派生自一个基类；不允许类继承自两个或多个类。然而，除非\
  \ `DerivedClass` 被声明为 `sealed`（密封的），否则你可以使用相同的语法派生继承自 `DerivedClass` 的其他类。（你将在[第\
  \ 13 章]“创建接口和定义抽象类”中学习密封类。）\n\n```csharp\nclass DerivedSubClass : DerivedClass\n\
  {\n...\n}\n```\n\n继续前面描述的示例，你可以如下定义 `Mammal` 类。`Breathe` 和 `SuckleYoung` 方法是所有哺乳动物共有的。\n\
  \n```csharp\nclass Mammal\n{\n    public void Breathe()\n    {\n        ...\n  \
  \  }\n    public void SuckleYoung()\n    {\n        ...\n    }\n    ...\n}\n```\n\
  \n然后你可以为每种不同的哺乳动物定义类，并根据需要添加更多方法，如下例所示：\n\n```csharp\nclass Horse : Mammal\n{\n\
  \    ...\n    public void Trot()\n    {\n        ...\n    }\n}\n\nclass Whale :\
  \ Mammal\n{\n    ...\n    public void Swim()\n    {\n        ...\n    }\n}\n```\n\
  \n![Image](img/Image00005.jpg) 注意\n\n如果你是 C++ 程序员，你应该注意到你不需要也没有办法显式地指定继承是公的、私有的还是保护的。C#\
  \ 的继承始终是公共的。如果你熟悉 Java，请注意冒号的使用，以及没有 `extends` 关键字。\n\n如果你在应用程序中创建一个 `Horse` 对象，你可以调用\
  \ `Trot`、`Breathe` 和 `SuckleYoung` 方法：\n\n```csharp\nHorse myHorse = new Horse();\n\
  myHorse.Trot();\nmyHorse.Breathe();\nmyHorse.SuckleYoung();\n```\n\n同样，你可以创建一个 `Whale`\
  \ 对象，但这次你可以调用 `Swim`、`Breathe` 和 `SuckleYoung` 方法；`Trot` 是不可用的，因为只只定义在 `Horse` 类中。\n\
  \n![Image](img/Image00004.jpg) 重要提示\n\n继承仅适用于类，不适用于结构体（structs）。你无法用结构体定义自己的继承层次结构，无法定义派自类或其他结构体的结构体。\n\
  \n所有结构体实际上都继承自名为 `System.ValueType` 的抽象类。（第 13 章探讨了抽象类。）这是 Microsoft .NET 框架定义基于栈的值类型的共同行为的一种纯粹实现细节；你不太会在自己的应用程序中直接使用\
  \ `ValueType`。\n\n### 重温 *System.Object* 类\n\n`System.Object` 类是所有类的根类。所有类都隐式派自\
  \ `System.Object`。因此，C# 编译器静默地将 `Mammal` 类重写如下代码（如果你真的想写，可以显式写）：\n\n```csharp\n\
  class Mammal : System.Object\n{\n...\n}\n```\n\n`System.Object` 类中的任何方法都会沿着继承链自动传递给派自\
  \ `Mammal` 的类，如 `Horse` 和 `Whale`。在实际操作中，这意味着你定义的所有类都自动继承 `System.Object` 类的所有特征。这包括诸如\
  \ `ToString` 方法（在第 2 章“处理变量、运算符和表达式”中讨论），该方法用于将对象转换为字符串，通常用于显示。\n\n\n\n\n\n# 派生类与构造函数\n\
  \n除了继承的方法外，派生类自动包含基类中的所有字段。这些字段通常在创建对象时需要进行初始化。你通常在构造函数中执行此类初始化。请记住，所有类都至少有一个构造函数。（如果你不提供，编译器将为你生成一个默认构造函数。）\n\
  \n## 派生类中的基类构造函数\n\n### 初始化与 `base` 关键字\n在派生类的构造函数在初始化过程中调用其基类的构造函数是一个良好的做法，这使得基类构造函数能够执行它所需的任何额外初始化。在为继承类定义构造函数时，你可以指定\
  \ `base` 关键字来调用基类构造函数，例所示：\n\n点击此处查看代码图片\n\n```csharp\nclass Mammal // 基类\n{\n \
  \   public Mammal(string name) // 基类的构造函数\n    {\n        ...\n    }\n    ...\n\
  }\n\nclass Horse : Mammal // 派生类\n{\n    public Horse(string name)\n    : base(name)\
  \ // 调用 Mammal(name)\n    {\n        ...\n    }\n    ...\n}\n```\n\n如果你没有在派生类的构造函数中显式调用基类构造函数，编译器会尝试在执行派生类构造函数代码之前，静默地插入对基类默认构造函数的调用。回到前面的例子，编译器会将此重写：\n\
  \n```csharp\nclass Horse : Mammal\n{\n    public Horse(string name)\n    {\n   \
  \     ...\n    }\n    ...\n}\n```\n\n重写为：\n\n```csharp\nclass Horse : Mammal\n{\n\
  \    public Horse(string name)\n    : base()\n    {\n        ...\n    }\n    ...\n\
  }\n```\n\n如果 `Mammal` 有一个公共的默认构造函数，这种方法就能生效。然而，并不是所有类都有公共的默认构造函数（例如，请记住只有当你没有编写任何非默认构造函数时，编译器才会生成默认构造函数），在这种情况下，忘记调用正确的基类构造函数会导致编译错误。\n\
  \n## 类的赋值\n\n本书中的之前的示例展示了如何使用类类型声明变量，以及如何使用 `new` 关键字创建对象。还有示例说明了 C# 的类型检查规则如何防止你将一种类型的对象赋值给一个声明为不同类型的变量。例如，根据此处所示\
  \ `Mammal`、`Horse` 和 `Whale` 类的定义，后续这些定义的代码是非合法的：\n\n点击此处查看代码图片\n\n```csharp\nclass\
  \ Mammal\n{\n    ...\n}\n\nclass Horse : Mammal\n{\n    ...\n}\n\nclass Whale :\
  \ Mammal\n{\n    ...\n}\n...\n\nHorse myHorse = new Horse(...);\nWhale myWhale =\
  \ myHorse; // 错误 - 类型不同\n```\n\n然而，只要使用的类型是继承层次中更高处的类，就可以从不同类型的变量引用该对象。因此，以下语句是合法的：\n\
  \n点击此处查看代码图片\n\n```csharp\nHorse myHorse = new Horse(...);\nMammal myMammal = myHorse;\
  \ // 合法，Mammal 是 Horse 的基类\n```\n\n如果你从逻辑角度考虑，所有的 `Horse` 都是 `Mammal`，所以你可以安全地将类型为\
  \ `Horse` 的对象赋值给类型为 `Mammal` 的变量。继承层次意味着你可以简单将 `Horse` 视为一种特殊的 `Mammal`；它拥有 `Mammal`\
  \ 拥有的所有，加上你添加到 `Horse` 类中的任何方法和字段定义的少量额外部分。你也可以让 `Mammal` 变量引用一个 `Whale` 对象。然而，有一个重要的限制：当使用\
  \ `Mammal` 变量引用 `Horse` 或 `Whale` 对象时，你只能访问由 `Mammal` 类定义的方法和字段。`Horse` 或 `Whale`\
  \ 类定义的任何额外方法都无法通过 `Mammal` 类可见。\n\n点击此处查看代码图片\n\n```csharp\nHorse myHorse = new\
  \ Horse(...);\nMammal myMammal = myHorse;\nmyMammal.Breathe(); // OK - Breathe 是\
  \ Mammal 类的一部分\nmyMammal.Trot(); // 错误 - Trot 不是 Mammal 类的一部分\n```\n\n***\n\n![Image](img/Image00005.jpg)\
  \ **注意**：前面的讨论解释了为什么你可以将几乎任何内容赋值给 `object` 变量。记住 `object` 是 `System.Object` 的别名，且所有类都直接或间接地继承自\
  \ `System.Object`。\n\n***\n\n请注意，相反的情况是不成立的。你不能无保留地将一个 `Mammal` 对象赋值给 `Horse` 变量：\n\
  \n点击此处查看代码图片\n\n```csharp\nMammal myMammal = new Mammal(...);\nHorse myHorse = myMammal;\
  \ // 错误\n```\n\n这看起来像是一个奇怪的限制，但请记住并不是所有的 `Mammal` 对象都是 `Horse`——有些可能是 `Whale`。\n\
  \n## 定义新方法\n\n计算机编程领域最困难的任务之一是为标识符想独特且有意义的名字。如果你在一个类中定义方法且该类处于继承体系中，迟早你会尝试重用一个已经被使用的名称。\n\
  \n***\n\n![Image](img/Image00005.jpg) **注意**：方法签名指的是方法名称及其参数的数量和类型，但不包括其返回类型。\n\n\
  ***\n\n派生类中的方法会遮蔽（或隐藏）基类中具有相同签名。例如，如果你编译以下代码，编译器会生成警告，通知你 `Horse.Talk` 隐藏了继承的方法\
  \ `Mammal.Talk`：\n\n点击此处查看代码图片\n\n```csharp\nclass Mammal\n{\n    ...\n    public\
  \ void Talk() // 假设哺乳动物都能说话\n    {\n        ...\n    }\n}\n\nclass Horse : Mammal\n\
  {\n    ...\n    public void Talk() // 马说话的方式与其他哺乳动物不同！\n    {\n        ...\n   \
  \ }\n}\n```\n\n尽管你的代码可以编译并运行，但你应该认真对待此警告。如果另一个类派自 `Horse` 并调用 `Talk` 方法，它可能期望调用在\
  \ `Mammal` 类中实现。然而，`Horse` 类中的 `Talk` 方法隐藏了 `Mammal` 类中的 `Talk` 方法，执行的是 `Horse.Talk`\
  \ 方法。大多数情况下，这种巧合充其量混乱的来源，你应该考虑重命名方法以避免冲突。然而，如果你确定想让这两个方法具有相同的签名，从而隐藏 `Mammal.Talk`\
  \ 方法，你可以通过使用 `new` 关键字来消除警告，如下：\n\n```csharp\nclass Mammal\n{\n    ...\n    public\
  \ void Talk()\n    {\n        ...\n    }\n}\n\nclass Horse : Mammal\n{\n    ...\n\
  \    new public void Talk()\n    {\n        ...\n    }\n}\n```\n\n\n\n\n像这样使用 `new`\
  \ 关键字并不能改变这两个方法完全无关的事实，隐藏（hiding）现象仍然会发生。它只是关闭了警告。实际上，`new` 关键字的意思是：“我知道我在做什么，所以停止向我显示这些警告。”\n\
  \n### 声明虚方法方法\n\n有时，你确实想要隐藏基类中某个方法的实现方式。例如，考虑 `System.Object` 中的 `ToString` 方法。`ToString`\
  \ 的目的是是将对象转换为其字符串表示。由于这个方法非常有用，它是 `System.Object` 类的成员，从而自动为所有类提供了一个 `ToString`\
  \ 方法。然而，由 `System.Object` 实现的 `ToString` 版本又是如何知道如何将派生类的实例转换为字符串的呢？派生类可能包含任意数量具有有趣值的字段，而这些值本应是字符串的一部分。答案是，`System.Object`\
  \ 中 `ToString` 的实现实际上有点简单。它所做的只是是将对象转换为一个包含其类型名称的字符串，例如“Mammal（哺乳动物）”或“Horse（马）”。毕竟，这并不好用。那么，为什么要提供一个如此没用的方法呢？第二个问题的答案需要一些仔细的思考。\n\
  \n显然，`ToString` 在概念上是一个很好的主意，所有类都应该提供一个可以将对象转换为字符串以便显示或调试的方法。只有实现方式需要注意。事实上，你不应该调用\
  \ `System.Object` 定义的 `ToString` 方法；它只是一个占位符。相反，你可能会发现，在你定义的每个类中提供你自己的 `ToString`\
  \ 方法版本更有用，这将覆盖 `System.Object` 中的默认实现。`System.Object` 中的版本仅作为安全网，以防某个类没有实现或不需要它特有的\
  \ `ToString` 方法版本。\n\n意图被重写的方法被称为 `virtual`（虚的）方法。你应该清楚重写（`overriding`）方法与隐藏（`hiding`）方法之间的区别。重写方法是为相同方法提供不同实现的机制——这些方法之间都是相关的，因为它们旨在执行相同的任务，但是以特定于类的方式执行。隐藏方法是用一个方法替换另一个方法的手段——这些方法通常无关，并且可能执行完全不同的任务。重写方法是一个实用的编程概念；而隐藏方法通常是一个错误。\n\
  \n你可以通过 `virtual` 关键字将方法标记为虚方法。例如，`System.Object` 类中的 `ToString` 方法定义如下：\n\n点击此处查看代码图片\n\
  \n```cs\nnamespace System\n\n{\n\nclass Object\n{\n\npublic virtual string ToString()\n\
  \n{\n...\n\n}\n\n...\n\n}\n\n...\n\n}\n```\n\n![Image](img/Image00005.jpg) 注意：如果你有\
  \ Java 开发经验，你应该注意 C# 方法默认不是虚的。\n\n### 声明 override 重写方法\n\n如果基类声明某个方法是虚的，则派生类可以使用\
  \ `override` 关键字来声明该方法的另一种实现，如下所示：\n\n点击此处查看代码图片\n\n```cs\nclass Horse : Mammal\n\
  \n{\n\n...\n\npublic override string ToString()\n\n{\n...\n\n}\n\n}\n```\n\n派生类中方法的新实现可以使用\
  \ `base` 关键字调用基类中方法的原始实现，如下所示：\n\n点击此处查看代码图片\n\n```cs\npublic override string ToString()\n\
  \n{\n\nstring temp = base.ToString();\n\n...\n\n}\n```\n\n当使用 `virtual` 和 `override`\
  \ 关键字声明多态方法时（如侧边栏“虚方法与多态”中所讨论的那样），必须遵循一些重要规则：\n\n![Image](img/Image00001.jpg) 虚方法不能是私有的（private）；它的意图是通过继承暴露给其他类。同样，override\
  \ 方法不能是私有的，因为类不能更改它继承的方法的保护级别。然而，override 方法可以有一种特殊形式的私有性，即 `protected access`（受保护访问），你将在下一节中发现这一点。\n\
  \n![Image](img/Image00001.jpg) 虚方法和 override 方法的签名必须相同；它们必须具有相同的名称、参数数量和参数类型。此外，两个方法必须返回相同的类型。\n\
  \n![Image](img/Image00001.jpg) 你只能重写虚方法。如果基类方法不是虚的，而你尝试重写它，将得到一个编译错误。这是合理的；基类设计者应该决定其方法是否可以被重写。\n\
  \n![Image](img/Image00001.jpg) 如果派生类没有使用 `override` 关键字声明该方法，它就没有重写基类方法；而是隐藏了该方法。换句话说，它变成了一个具有相同名称完全不同方法的实现。与之前一样，这将引起警告，你可以像之前描述的那样通过\
  \ `new` 关键字来消除警告。\n\n![Image](img/Image00001.jpg) override 方法是隐式虚的，并且可以在进一步的派生类中再次被重写。但是，你不允许通过\
  \ `virtual` 关键字显式声明 override 方法为虚的。\n\n### 虚方法与多态\n\n使用虚方法，你可以根据运行时调用相同方法的不同版本。考虑之前定义的具有\
  \ `Mammal` 方法的类示例：\n\n点击此处查看代码图片\n\n```cs\nclass Mammal\n\n{\n\n...\n\npublic virtual\
  \ string ToString()\n\n{\n\nreturn \"This is a mammal\";\n}\n\n}\n\nclass Horse\
  \ : Mammal\n\n{\n\n...\n\npublic override string ToString()\n\n{\nreturn \"This\
  \ is a horse\";\n}\n\n}\n\nclass Whale : Mammal\n\n{\n\n...\n\npublic override string\
  \ ToString()\n\n{\nreturn \"This is a whale\";\n}\n\n}\n\nclass Aardvark : Mammal\n\
  \n{\n\n...\n\n}\n```\n\n这里有两点你需要注意：首先，`Horse` 和 `Whale` 类使用了 `override` 关键字的 `ToString`\
  \ 方法；其次，`Aardvark` 类没有 `ToString` 方法。现在观察代码块：\n\n点击此处查看代码图片\n\n```cs\nMammal myMammal;\n\
  \nHorse myHorse = new Horse();\n\nWhale myWhale = new Whale();\n\nAardvark myAardvark\
  \ = new Aardvark();\n\nmyMammal = myHorse;\n\nConsole.WriteLine(myMammal.ToString());\
  \ // Horse\n\nmyMammal = myWhale;\n\nConsole.WriteLine(myMammal.ToString()); //\
  \ Whale\n\nmyMammal = myAardvark;\n\nConsole.WriteLine(myMammal.ToString()); //\
  \ Aardvark\n```\n\n三个不同的 `Console.WriteLine` 语句将输出什么？初看起来，你可能会认为它们都会打印“This is a\
  \ mammal”，因为每个语句都是调用 `myMammal` 变量的 `ToString` 方法。然而，在第一个情况下，你可以看到 `myMammal` 实际上指向一个\
  \ `Horse`。（记住，允许将 `Horse` 赋值给 `Mammal` 变量，因为 `Horse` 类继承自 `Mammal` 类。）由于 `ToString`\
  \ 方法被定义为虚方法，运行时确定应该调用 `Horse.ToString` 方法，因此该语句实际上输出“This is a horse”。相同的逻辑适用于第二个\
  \ `Console.WriteLine` 语句，它输出“This is a whale”。第三条语句对 `Aardvark` 对象调用 `ToString`。然而，`Aardvark`\
  \ 类没有 `ToString` 方法，因此调用了 `Mammal` 类的默认方法，返回“This is a mammal”。\n\n\n\n\n\n这种根据上下文对同一语句调用不同方法的现象被称为\
  \ `polymorphism`（多态），字面意思是“多种形式”。\n\n***\n\n### 理解 `protected` 访问\n\n`public` 和\
  \ `private` 访问关键字创建了访问权限两个极端：类的 `public` 字段和方法所有人都可以访问，而类的 `private` 字段和方法仅对类本身可访问。\n\
  \n当你考虑孤立的类时，这两个极端就足够了。然而，正如所有丰富的面向对象程序员程序员所知，孤立的类无法解决复杂问题。继承是连接类的强大方式，派生类与其基类之间显然存在着特殊且紧密的关系。通常，让基类允许派生类访问其某些成员，同时对不属于继承层次的类隐藏这些成员，是非常有用的。在这种情况下，你可以使用\
  \ `protected` 关键字标记成员。其工作原理如下：\n\n![Image](img/Image00001.jpg) 如果类 `A` 派自另一个类 `B`，它可以访问类\
  \ `B` 的 `protected` 类成员。换句话说，在派生类 `A` 内部，类 `B` 的 `protected` 成员实际上是公开的。\n\n![Image](img/Image00001.jpg)\
  \ 如果类 `A` 没有派自另一个类 `B`，它无法访问类 `B` 的任何 `protected` 成员。因此，在类 `A` 内部，类 `B` 的 `protected`\
  \ 成员实际上是私有的。\n\nC# 赋予程序员完全自由将方法和字段声明为 `protected`。然而，大多数面向对象编程指南建议你尽可能将字段严格保持为私有，仅在绝对必要时才放宽这些限制。`public`\
  \ 字段违反了封装，因为类的所有用户都对字段有直接、无限制的访问。`protected` 字段为类的用户维护了封装，对于这些用户来说，`protected` 字段是不可见的。然而，`protected`\
  \ 字段仍然允许继承基类的其他类破坏封装。\n\n***\n\n![Image](img/Image00005.jpg) 注意\n\n你不仅可以在派生类中访问\
  \ `protected` 基类成员，还可以在派生类的类的类中访问。\n\n***\n\n在接下来的练习中，你将定义一个简单的类层次结构来为不同类型的车辆建模。你将定义一个名为\
  \ `Vehicle` 的基类，以及名为 `Airplane` 和 `Car` 的派生类。你将在 `Vehicle` 类中定义名为 `StartEngine`\
  \ 和 `StopEngine` 的通用方法，并为两个派生类都添加特定于这些类的方法。最后，你将在 `Vehicle` 类中添加一个名为 `Drive` 的虚方法，并在两个派生类中重写该方法的默认实现。\n\
