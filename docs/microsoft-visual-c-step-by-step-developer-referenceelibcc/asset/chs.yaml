  \n![Image](img/Image00001.jpg) 通过编写 `try` `finally` 语句，在已知的时间点以安全的方式释放资源。\n\n![Image](img/Image00001.jpg)\
  \ 通过编写 `using` 语句，在已知的时间点以安全的方式释放资源。\n\n![Image](img/Image00001.jpg) 实现 `IDisposable`\
  \ 接口，以在类中支持异常安全的释放。\n\n你在较早的章节中已经看到如何创建变量和对象，并且你应该理解在创建变量和对象时内存是如何分配的。（如果你忘记了，值类型创建在栈上，而引用类型则从堆上分配内存。）计算机的内存不是无限的，因此当变量或对象不再需要内存时，必须回收内存。值类型在超出作用范围时会被销毁，内存会被回收。这是简单部分。引用类型呢？你通过\
  \ `new` 关键字创建对象，但对象是如何以及何时被销毁的呢？这就是本章的重点。\n\n### 对象的生命与时代\n\n首先，让我们回顾一下创建对象时发生了什么。\n\
  \n你通过使用 `new` 运算符创建对象。接下来的示例创建了 `Square` 类的一个新实例，该类在第 13 章 中讨论过，“创建接口和定义抽象类](#text00019.html_ch13)”。\n\
  \n点击此处查看代码图片\n\n```cs\nint sizeOfSquare = 99;\n\nSquare mySquare = new Square(sizeOfSquare);\
  \ // Square 是引用类型\n```\n\n从你的角度来看，`new` 操作是一个步骤，但在底层，对象的创建实际上是一个两个阶段的过程：\n\n**1.**\
  \ `new` 操作从堆上分配一块 `raw`（原始）内存。你对对象创建的这一阶段没有控制权。\n\n**2.** `new` 操作将该原始内存转换为对象；它必须初始化对象。你可以通过使用构造函数来控制这一阶段。\n\
  \n***\n\n![Image](img/Image00005.jpg) 注意\n\n如果你是 C++ 程序员，你应该注意，在 C# 中，你不能通过重载 `new`\
  \ 操作来控制分配。\n\n***\n\n在你创建对象后，你可以使用点运算符（.）访问其成员。例如，`Square` 类包含一个名为 `Draw` 的方法，你可以调用：\n\
  \n```cs\nmySquare.Draw();\n```\n\n***\n\n![Image](img/Image00005.jpg) 注意\n\n这段代码基于继承自\
  \ `Shape` 且没有实现 `IDraw` 的 `Square` 版本。例如，`Square` 类继承自 `Shape` 没有实现 `IDraw`。更多信息请参阅\
  \ 13。\n\n***\n\n当 `mySquare` 变量超出作用范围时，它不再被引用。此时对象就可以被销毁，它所使用的内存可以被回收。（这可能不会立即发生，正如稍后你看到的。）就像对象创建一样，对象销毁也是两个阶段的过程。\n\
  \n**1.** 通用语言（CLR）必须执行一些清理。你可以通过编写析构函数来控制这一点。\n\n**2.** CLR 必须将属于对象的内存返回给堆。你对此没有控制权。\n\
  \n销毁对象并将内存返回堆的过程被称为垃圾回收。\n\n***\n\n![Image](img/Image00005.jpg) 注意\n\n如果你用 C++ 编程，请记住\
  \ C# 没有 `delete` 运算符。CLR 控制对象的销毁时间。\n\n***\n\n#### 编写析构函数\n\n你可以使用析构函数在对象垃圾回收时执行所需的任何清理工作。CLR\
  \ 会自动清理对象使用的任何托管资源，因此在许多情况下，编写析构函数是不必要的。然而，如果托管资源很大（例如多维数组），通过将对象对该资源的任何引用设置为 `null`\
  \ 来使该资源可以立即释放是有意义的。此外，如果对象直接或间接引用了非托管资源，析构函数可能非常有用。\n\n***\n\n![Image](img/Image00005.jpg)\
  \ 注意\n\n间接非托管资源相当常见。示例包括文件流、网络连接、数据库连接以及由 Windows 管理的其他资源。例如，如果你在方法中打开文件，你可能想添加一个析构函数，在对象销毁时关闭文件。然而，根据类中代码的结构，可能有更好、更及时的方法。（参见本章稍后关于\
  \ `using` 语句的讨论。）\n\n***\n\n析构函数是一种特殊方法，有点像构造函数，但 CLR 在对象引用消失后调用它。编写析构函数的语法是波浪号（~）后跟类名。例如，这里有一个简单的类，它在构造函数中打开文件进行读取，并在析构函数中关闭文件。（注意这只是一个示例，我不建议你总是遵循这种打开和关闭文件的模式。）\n\
  \n点击此处查看代码图片\n\n```cs\nclass FileProcessor\n{\n\n    FileStream file = null;\n}\n\
  ```\n\n\n\n\n```csharp\npublic FileProcessor(string fileName)\n{\n    this.file\
  \ = File.OpenRead(fileName); // open file for reading\n}\n\n~FileProcessor()\n{\n\
  \    this.file.Close(); // close file\n}\n}\n```\n\n析构函数存在一些非常重要的限制：\n\n![Image](img/Image00001.jpg)\
  \ 析构函数仅适用于引用类型；你不能在值类型（如 `struct`）中声明析构函数。\n\n点击此处查看代码图片\n\n```csharp\nstruct MyStruct\n\
  {\n    ~MyStruct() { ... } // 编译错误\n}\n```\n\n![Image](img/Image00001.jpg) 你不能为析构函数指定访问修饰符（如\
  \ `public`）。你永远不会在自己的代码中调用析构函数；这由 CLR 中称为 `garbage collector`（垃圾回收器）的部分为你完成的。\n\n\
  点击此处查看代码图片\n\n```csharp\npublic ~FileProcessor() { ... } // 编译错误\n```\n\n![Image](img/Image00001.jpg)\
  \ 析构函数不能带有任何参数。再次，这是因为你永远不会自己调用析构函数。\n\n点击此处查看代码图片\n\n```csharp\n~FileProcessor(int\
  \ parameter) { ... } // 编译错误\n```\n\n在内部，C# 编译器会自动将析构函数翻译为 `Object.Finalize` 方法的重写。编译器将此析构函数\n\
  \n点击此处查看代码图片\n\n```csharp\nclass FileProcessor\n{\n    ~FileProcessor() { // 你的代码写在这里\
  \ }\n}\n```\n\n转换为如下：\n\n点击此处查看代码图片\n\n```csharp\nclass FileProcessor\n{\n    protected\
  \ override void Finalize()\n    {\n        try { // 你的代码写在这里 }\n        finally\
  \ { base.Finalize(); }\n    }\n}\n```\n\n编译器生成的 `Finalize` 方法在 `try` 块中包含析构函数体，随后是一个调用了基类中\
  \ `Finalize` 方法的 `finally` 块。（`try` 和 `finally` 关键字在第 6 章，“管理错误和异常](#text00011.html_ch06)”中有所描述。）这确保了即使在执行析构函数代码期间发生异常，析构函数始终调用其基类析构函数。\n\
  \n重要一点是，只有编译器可以进行这种翻译。你不能编写自己的方法来重写 `Finalize`，也无法自己调用 `Finalize`。\n\n### 为什么要使用垃圾回收器？\n\
  \n你永远无法通过 C# 代码自己来销毁对象。没有相应的语法可以做到。相反，CLR 会在它自己选择的时间为你完成。此外，请记住，你还可以让多个引用变量指向同一个对象。在下面的代码示例中，变量\
  \ `myFp` 和 `referenceToMyFp` 指向同一个 `FileProcessor` 对象：\n\n点击此处查看代码图片\n\n```csharp\n\
  FileProcessor myFp = new FileProcessor();\nFileProcessor referenceToMyFp = myFp;\n\
  ```\n\n你可以为一个对象创建多少个引用？随你喜欢！但这种缺乏限制会影响对象的生命周期。CLR 必须跟踪所有这些引用。如果变量 `myFp` 消失（超出作用域），其他变量（如\
  \ `referenceToMyFp`）可能仍然存在，此时 `FileProcessor` 对象使用的资源无法被回收（文件不应被关闭）。因此，对象的生命周期不能绑定到特定的引用变量。只有当指向对象的*所有*引用都消失时，对象才能被销毁，其内存才能供重复使用。\n\
  \n你可以看到管理对象的生命周期是复杂的，这就是为什么 C# 的设计者决定防止你的代码承担这等责任。如果销毁对象是你的责任，早晚会发生以下情况之一：\n\n![Image](img/Image00001.jpg)\
  \ 你会忘记销毁对象。这意味着对象的析构函数（如果有的话）将不会运行，不会进行清理工作，内存也不会返回到堆中。你可能会很容易地耗尽内存。\n\n![Image](img/Image00001.jpg)\
  \ 你尝试销毁一个活跃的对象，并可能导致一个或多个变量持有已销毁对象的引用，这被称为 `dangling reference`（悬空引用）。悬空引用指向未使用的内存，或者可能指向现在恰好占用同一块内存的完全不同的对象。无论何种，使用悬空引用的结果最好的情况下是未定义的，最坏的情况下是安全风险。一切将失去控制。\n\
  \n![Image](img/Image00001.jpg) 你会尝试多次销毁同一个对象。这可能是灾难性的也可能不是，取决于析构函数中的代码。\n\n这些在像\
  \ C# 这样的语言中是不可接受的，这种语言将健壮性和安全性置于设计目标的高位。相反，垃圾回收器会为你销毁对象。垃圾回收器提供了以下保证：\n\n![Image](img/Image00001.jpg)\
  \ 每个对象都将被销毁，其析构函数也将会运行。当程序结束时，所有未处理的对象都将被销毁。![Image](img/Image00001.jpg) 每个对象仅在变得不可达时才会被恰好销毁一次——即在运行你应用程序的进程中，没有指向该对象的引用。\n\
  \n这些保证非常有用，它们将你（程序员）从容易出错的家务工作中解放出来。它们让你能够奢侈专注于程序的逻辑并提高生产力。\n\n垃圾回收何时发生？这听起来像是一个奇怪的问题。毕竟，垃圾回收理应发生在对象不再需要时。好吧，确实如此，但并不一定立即发生。垃圾回收可能是一个昂贵的过程，因此\
  \ CLR 仅在需要时（例如，当可用内存开始变低或堆的大小超过了系统定义的阈值时）才会收集垃圾，然后尽可能多地收集。进行几次大型内存扫描比进行许多小规模打扫更高效。\n\
  \n![Image](img/Image00005.jpg) 注意\n\n你可以通过调用 `System` 命名空间下 `GC` 类的静态方法 `Collect`\
  \ 在程序中调用垃圾回收器。然而，除了少数情况外，通常不建议这样做。`GC.Collect` 方法启动垃圾回收器，但该过程是异步运行的——`GC.Collect`\
  \ 方法在垃圾回收完成之前返回，因此你仍然不知道你的对象是否已被销毁。让 CLR 决定何时收集垃圾最佳。\n\n垃圾回收器的一个特性是，你不知道对象销毁的顺序，也不应该依赖于此顺序。最后一点理解可能是最重要的：析构函数在对象被垃圾回收之前不会运行。如果你写了一个析构函数，你知道它会被执行，但你不知道何时执行。因此，你永远不要编写依赖于析构函数按特定顺序或在应用程序特定点运行的代码。\n\
  \n#### 垃圾回收是如何工作的？\n\n垃圾回收器在自己的线程中运行，并仅在某些时间执行——通常当你的应用程序到达方法结束时。当它运行时，应用程序中的其他线程将临时停止，因为垃圾回收器可能需要移动对象并更新对象引用，而它在对象在使用时无法做到这些。\n\
  \n\n\n\n\n垃圾回收器是一个复杂的软件，它具有自我调优功能，并实现了许多优化，试图在保持内存可用性与维持应用程序性能的需求之间取得平衡。垃圾回收器使用的内部算法和结构的细节超出了本书的范围（而且微软在不断改进垃圾回收器执行工作的方式），但从高层来说，垃圾回收器采取的步骤如下：\n\
  \n1. 它构建一个所有可达对象的映射。它通过反复跟随对象内部的引用字段来实现。垃圾回收器非常小心地构建此映射，并确保循环引用不会导致无限递归。任何 `not`\
  \ 在此映射中的对象都被视为不可达的。\n\n2. 它检查任何不可达对象是否具有需要运行的析构函数（此过程称为 `finalization`，即终结化）。任何需要终化的不可达对象都会被放在一个名为\
  \ `freachable queue`（读作“F-reachable”）的特殊队列中。\n\n3. 它通过将 `reachable` 对象向下移动堆，来释放剩余的不可达对象（那些不需要终化的对象），从而消除堆碎片并释放堆顶部的内存。当垃圾回收器移动一个可达对象时，它还会更新对该对象的任何引用。\n\
  \n4. 在此阶段，它允许其他线程恢复执行。\n\n5. 它在自己的线程上运行 `Finalize` 方法，处理需要终化的不可达对象（现在位于 `freachable`\
  \ 队列中）。\n\n## 建议\n\n编写包含析构函数的类会增加代码和垃圾回收过程的复杂性，并使你的程序运行更慢。如果你的程序不包含任何析构函数，垃圾回收器就不需要将不可达对象放入\
  \ `freachable queue` 并对它们进行终化。显然，不做什么比做某事要快。因此，除非真的需要，否则尽量避免使用析构函数——仅将它们用于回收非托管资源。（你可以考虑使用\
  \ `using` 语句，这将在本章稍后部分描述。）\n\n编写析构函数时需要非常小心。特别要注意，如果你的析构函数调用了其他对象，这些对象可能已经被垃圾回收器\
  \ `already` 调用了析构函数。记住，终化的顺序是不保证的。因此，确保析构函数之间互不依赖或重叠——例如，不要让两个析构函数尝试释放同一个资源。\n\n\
  ## 资源管理\n\n有时在析构函数中释放资源是不明智的；某些资源价值太高，不能让它们在那里等待任意长度的时间直到垃圾回收器实际释放它们。内存、数据库连接或文件句柄等稀缺资源需要释放，而且需要尽快释放。在这些情况下，你唯一的选择是自己释放资源。你可以通过创建一个\
  \ `disposal method—`（一个显式释放资源的方法）来实现。如果一个类具有析构方法，你就可以调用它并控制资源释放的时机。\n\n* * *\n\n\
  ![Image](img/Image00005.jpg)  注意\n\n`disposal method` 一术指的是该方法的目的而非其名称。析构方法可以使用任何有效的\
  \ C# 标识符命名。\n\n* * *\n\n## 析构方法\n\n实现析构方法的类示例是 `System.IO` 命名空间中的 `TextReader` 类。`TextReader`\
  \ 类提供了一种关闭字符的机制。`StreamReader` 类（从流中读取）既派自 `TextReader`，又重写了 `Close` 方法。这里是一个读取文本行的示例：\n\
  \n```csharp\nTextReader reader = new StreamReader(filename);\nstring line;\nwhile\
  \ ((line = reader.ReadLine()) != null)\n{\n    Console.WriteLine(line);\n}\n```\n\
  \n`ReadLine` 方法返回下一行文本，如果流中没有剩余内容则返回 `null`。然而，这个示例存在一个问题：如果 `ReadLine` 或 `WriteLine`\
  \ 抛出异常，`Close` 将不会执行。\n\n### 异常安全的释放\n\n确保无论发生异常都能调用释放方法的方法是使用 `finally` 块。这里是使用该技术的先前示例：\n\
  \n```csharp\nTextReader reader = new StreamReader(filename);\ntry\n{\n    string\
  \ line;\n    while ((line = reader.ReadLine()) != null)\n    {\n        Console.WriteLine(line);\n\
  \    }\n}\nfinally\n{\n    reader.Close();\n}\n```\n\n这种 `finally` 块可行，但如果你必须释放多个资源，它会有很多缺点。嵌套的\
  \ `try` 和 `finally` 块很快变得难以维护。在某些情况下，你可能需要修改代码以适应这种习惯创建一个抽象。\n\n`using` 语句的设计是为了解决这些问题。\n\
  \n*using* 语句与 *IDisposable* 接口\n\n`using` 语句为控制资源的生命周期提供了一种整洁的机制。你可以创建一个对象，该对象会在\
  \ `using` 语句结束时被销毁。\n\n* * *\n\n![Image](img/Image0004.jpg)  重要\n\n不要将本节所示的 `using`\
  \ 语句与引入命名空间作用的 `using` 指令混淆。同一个关键字具有两个含义是很遗憾的。\n\n* * *\n\n`using` 语句的语法如下：\n\n\
  ```csharp\nusing ( type variable = initialization )\n{\n    StatementBlock\n}\n\
  ```\n\n这是确保你的代码始终对 `TextReader` 调用 `Close` 的最佳方法：\n\n```csharp\nusing (TextReader\
  \ reader = new StreamReader(filename))\n{\n    string line;\n    while ((line =\
  \ reader.ReadLine()) != null)\n    {\n        Console.WriteLine(line);\n    }\n\
  }\n```\n\n这个 `using` 语句完全等同于以下转换：\n\n```csharp\n{\n    TextReader reader = new StreamReader(filename);\n\
  \    try\n    {\n        string line;\n        while ((line = reader.ReadLine())\
  \ != null)\n        {\n            Console.WriteLine(line);\n        }\n    }\n\
  \    finally\n    {\n        if (reader != null)\n        {\n            ((IDisposable)reader).Dispose();\n\
  \        }\n    }\n}\n```\n\n\n\n\n`using` 语句引入了自己的用于作用域的块。这种安排意味着你在 `using` 语句中声明的变量在嵌套语句结束时自动离开作用域，你不会意外地尝试访问已释放的资源。\n\
  \n***\n\n你在 `using` 语句中声明的变量必须是实现了 `IDisposable` 接口的类型。`IDisposable` 接口位于 `System`\
  \ 命名空间中，仅包含一个名为 `Dispose` 的方法：\n\n```csharp\nnamespace System\n{\n\ninterface IDisposable\n\
  {\nvoid Dispose();\n}\n}\n```\n\n`Dispose` 方法的作用是释放对象使用的任何资源。恰好 `StreamReader` 类实现了\
  \ `IDisposable` 接口，它的 `Dispose` 方法调用 `Close` 来关闭流。你可以使用 `using` 语句作为一种简洁、异常安全且健壮的方式，来确保资源始终被释放。这种方法解决了手动\
  \ `try`finally` 解决方案中存在的所有问题。你现在拥有了一个可以以下操作的解决方案：\n\n![Image](img/Image00001.jpg)\
  \ 如果你需要释放多个资源，它的扩展性很好。\n\n![Image](img/Image00001.jpg) 不会扭曲程序代码的逻辑。\n\n![Image](img/Image00001.jpg)\
  \ 抽象了问题并避免了重复。\n\n![Image](img/Image00001.jpg) 健壮。你无法在 `using` 语句结束后意外引用在该内部声明的变量（在此例中为\
  \ `reader`），因为它不再在作用域内——你会得到编译时错误。\n\n### 从析构函数中调用 `Dispose` 方法\n\n在编写自己的类时，应该编写析构函数，还是实现\
  \ `IDisposable` 接口，以便你的类实例可以由 `using` 语句管理？析构函数的调用*会*发生，但你并不知道何时发生。另一方面，你确切知道何时会调用\
  \ `Dispose` 方法，但你无法确定它是否真的会发生，因为这取决于使用你类的程序员记得编写 `using` 语句。然而，通过从析构函数调用 `Dispose`\
  \ 方法，可以确保 `Dispose` 方法始终运行。这充当了有用的备选。你可能会忘记调用 `Dispose` 方法，但至少你可以确定它会被调用，即使仅是在程序关闭时。你将在章节末尾的练习中详细研究此功能，但这里有一个如何实现\
  \ `IDisposable` 接口的示例：\n\n点击此处查看代码图像\n\n```csharp\nclass Example : IDisposable\n\
  {\n\nprivate Resource scarce; // 需要管理和释放的稀缺资源\n\nprivate bool disposed = false;\
  \ // 用于指示资源\n// 是否已经释放\n\n...\n\n~Example()\n{\n\nthis.Dispose(false);\n}\n\npublic\
  \ virtual void Dispose()\n{\n\nthis.Dispose(true);\nGC.SuppressFinalize(this);\n\
  }\n\nprotected virtual void Dispose(bool disposing)\n{\nif (!this.disposed)\n{\n\
  if (disposing)\n{\n// 在处释放大型托管资源\n...\n}\n// 在处释放未托管资源\n...\nthis.disposed = true;\n\
  }\n}\n}\n\npublic void SomeBehavior() // 示例方法\n{\ncheckIfDisposed();\n...\n}\n\n\
  ...\n\nprivate void checkIfDisposed()\n{\nif (this.disposed)\n{\nthrow new ObjectDisposedException(\"\
  Example: object has been disposed of\");\n}\n}\n}\n```\n\n注意 `Example` 类的以下特征：\n\
  \n![Image](img/Image00001.jpg) 该类实现了 `IDisposable` 接口。\n\n![Image](img/Image00001.jpg)\
  \ 公共 `Dispose` 方法可以由你的应用程序代码随时调用。\n\n![Image](img/Image00001.jpg) 公共 `Dispose` 方法调用了带有布尔参数的受保护且重载的\
  \ `Dispose` 方法版本，并将值 `true` 作为参数传递。此方法实际上执行了资源释放。\n\n![Image](img/Image00001.jpg)\
  \ 析构函数调用了带有布尔参数的受保护且重载的 `Dispose` 方法，并将值 `false` 作为参数传递。析构函数仅在你的对象被终结时由垃圾回收器调用。\n\
  \n![Image](img/Image00001.jpg) 你可以安全多次调用受保护的 `Dispose` 方法。变量 `disposed` 指示该方法是否已经运行，这是一项防止方法在并发调用时尝试多次释放资源的安全特性。（你的应用程序可能会调用\
  \ `Dispose`，但在方法完成之前，你的对象可能会被垃圾回收，并且 CLR 会从析构函数再次运行 `Dispose` 方法。）资源仅在方法首次运行时被释放。\n\
  \n![Image](img/Image00001.jpg) 受保护的 `Dispose` 方法支持释放托管资源（如大型数组）和未托管资源（如文件句柄）。如果\
  \ `disposing` 参数为 `true`，则此方法一定是从公共 `Dispose` 方法调用的。在这种情况下，托管资源和未托管资源都会被释放。如果 `disposing`\
  \ 参数为 `false`，则此方法一定是从析构函数调用的，垃圾回收器正在终结对象。在这种情况下，没有必要（或异常安全）释放托管资源，因为它们将或可能已经被垃圾回收器处理，因此只释放未托管资源。\n\
  \n![Image](img/Image00001.jpg) 公共 `Dispose` 方法调用静态 `GC.SuppressFinalize` 方法。此方法阻止垃圾回收器对该对象调用析构函数，因为对象已经终结。\n\
  \n![Image](img/Image00001.jpg) 类的常规方法（如 `SomeBehavior`）检查对象是否已经丢弃。如果是，它们将抛出异常。\n\
  \n### 实现异常安全的释放\n\n在接下来的练习中，你将研究 `using` 语句如何帮助确保应用程序代码中使用的资源即使发生异常也能及时释放。最初，你将实现一个带有析构函数的简单类，并研究垃圾回收器何时调用该析构函数。\n\
  \n***\n\n![Image](img/Image00005.jpg) 注意\n\n练习中创建的 `Calculator` 类旨在说明垃圾回收的基本原理。该类并未实际消耗任何托管或未托管资源。你通常不会为这样一个简单类创建析构函数或实现\
  \ `IDisposable` 接口。\n\n***\n\n创建一个使用析构函数的简单类\n\n1. 如果尚未运行，启动 Visual Studio 2015。\n\
