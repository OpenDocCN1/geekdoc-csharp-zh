  \ `calculateFee` 版本，像之前一样，该版本与调用最匹配。\n\n按任意键关闭控制窗口并返回 Visual Studio。\n\n**10.**\
  \ 在 `run` 方法中，修改调用 `calculateFee` 的语句，再次所示：\n\n点击此处查看代码图片\n\n```csharp\npublic void\
  \ run()\n{\n    double fee = calculateFee(500.0, 3);\n    Console.WriteLine($\"\
  Fee is {fee}\");\n}\n```\n\n**11.** 在“调试”菜单上，点击“不调试启动”以编译运行程序。\n\n程序显示以下消息：\n\n\
