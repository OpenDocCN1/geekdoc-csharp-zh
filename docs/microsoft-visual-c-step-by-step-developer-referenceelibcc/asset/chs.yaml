  \ `CheckoutDelegate` 的公共委托类型，如下：\n\n点击此处查看代码图像\n\n```csharp\npublic class CheckoutController\n\
  {\n    public delegate void CheckoutDelegate(Order order);\n}\n```\n\n你可以使用此委托类型来引用带有\
  \ `Order` 参数且不返回结果的方法。这恰好符合 `AuditOrder` 和 `ShipOrder` 方法的形状。\n\n8. 在 `CheckoutController`\
  \ 类中添加一个名为 `CheckoutProcessing` 的公共委托，如下：\n\n点击此处查看代码图像\n\n```csharp\npublic class\
  \ CheckoutController\n{\n    public delegate void CheckoutDelegate(Order order);\n\
  \    public CheckoutDelegate CheckoutProcessing;\n}\n```\n\n9. 在 `CheckoutController`\
  \ 类中添加 `requestPayment` 方法，如下：\n\n点击此处查看代码图像\n\n```csharp\nprivate bool requestPayment()\n\
