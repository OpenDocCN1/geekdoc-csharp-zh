  \n正如本节开头所提到的，你无法从 UWP 应用程序直接访问关系型数据库，即使在你使用 Entity Framework 时也是如此。相反，你创建了一个 Web\
  \ 应用程序（这不是 UWP 应用程序），你将在此应用程序中托管创建的实体模型。`Web API` 模板提供了向导和工具，通过你可以快速实现 Web 服务，这就是你在下一个练习中要做的。此\
  \ Web 服务将为 `Customers` UWP 应用程序提供实体模型的远程访问。\n\n7. 在解决方案管理器中，右键点击 `Customers` 解决方案，然后点击\
