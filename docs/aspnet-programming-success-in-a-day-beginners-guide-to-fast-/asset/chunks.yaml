- fmt: "\nAside from system information and the like, there may also be information\
    \ that you wish to keep private. Any of info of this kind should be considered\
    \ “sensitive” information. This may range from passwords and encryption keys to\
    \ notes about your application. If anyone gets to this, then your application\
    \ can be compromised.\n\nIf the app will transmit any sensitive information at\
    \ all between the server and the browser, then consider the use of `SSL` (Secure\
    \ Sockets Layer). The Microsoft knowledge base gives a lot of information on this.\n\
    \nYou can also use a form of protective configuration in order to secure this\
    \ information. Make sure as well not to keep this info in a web page, even in\
    \ any form (such as the server code) that you will not expect people to see.\n\
    \nIn the namespace `System.Security.Cryptography`, strong algorithms for encryption\
    \ are supplied. These can be used to your advantage as well.\n\n## Using Cookies\
    \ Securely\n\nCookies can be very useful in keeping user-specific data available.\
    \ However, because they also get sent to the computer running the browser, they\
    \ can be spoofed or used for other malicious means. Remember to never install\
    \ any critical information on these cookies, such as passwords, even momentarily.\
    \ As a rule of thumb, anything on a cookie that can compromise the app should\
    \ not be in a cookie in the first place. Instead of the info itself, keep a reference\
    \ in the cookie that points to the server location of this data.\n\nRemember as\
    \ well to set expiration dates on cookies. These should be in the shortest time\
    \ practical. If it will not break the app, never use permanent cookies. As an\
    \ added measure, consider adding an encryption to the info in the cookies. Setting\
    \ the `HttpOnly` and `Secure` properties of the cookie to the value “true” can\
    \ also help.\n\n## Guarding Against DDOS\n\nDDOS or Denial of Service is a malicious\
    \ attack that makes your system unavailable for use by other people. This is done\
    \ by overloading your server with requests, therefore keeping it too busy. In\
    \ the worst case, this can crash the application.\n\nYou can use different error\
    \ handling techniques such as `try-catch`. Like mentioned above, you can use a\
    \ `finally` block so you can release the resources when the app fails.\n\nProcess\
    \ throttling may also be configured for use by the `IIS`, preventing the app from\
    \ hogging the CPU time. Size limits of the user input can be tested before they\
    \ are used or stored. Safeguards can also be placed on the queries -- as an example,\
    \ before query results are displayed in the `ASP.NET` Web page, you should first\
    \ be sure that there is not an unreasonable amount of records.\n\nPutting a limit\
    \ on the allowable upload size should also be a part of the app. The following\
    \ syntax can be used (varying the `maxRequestLength` in kilobytes:\n\n```xml\n\
    <configuration>\n  <system.web>\n    <httpRuntime maxRequestLength=\"4096\" />\n\
    \  </system.web>\n</configuration>\n```\n\nThe `RequestLengthDiskThreshold` property\
    \ may also be used to reduce the overhead (in memory) of large forum posts and\
    \ uploads.\n\nAside from the different risks encountered in this chapter, you\
    \ should also be familiar with other app security threats so you can wisely defend\
    \ against them. Remember that secure technology is but a part of the overall solution.\n\
    \nFour of the more common but less defended threats are as follows:\n\n1. **Repudiation**.\
    \ This is a threat that involves entering into a transaction in such a way that\
    \ there is no proof of those truly involved afterwards. This can mean impersonating\
    \ the credentials of an innocent user. To guard against this, you need to have\
    \ stringent authentication in place.\n2. **Elevation of privilege**. This is a\
    \ type of attack that takes advantage of malicious means to get more permission\
    \ that what has been normally assigned. A good example is a user being able to\
    \ secure administrative privileges, therefore giving that user access to all data\
    \ on the server. This can also lend the user control over the server’s capabilities.\
    \ A minimal privilege context is an effective means to battle this type of attack,\
    \ as discussed before.\n3. **Tampering**. This type of attack refers to the deletion\
    \ of a resource without proper authorization. An example is the defacing of a\
    \ webpage, where the user gets into the site and changes the files therein. Script\
    \ exploits are common vehicles of this type of attack. These scripts, as discussed\
    \ above, can enter your app through the use of an input field.\n4. **Information\
    \ Disclosure**. This is simply stealing and/or revealing the information that\
    \ was supposed to be secure and private. A very common example is stealing login\
    \ credentials like passwords, though this can extend to any type of file in the\
    \ entire system. A good way to prevent this from happening is to avoid having\
    \ passwords and other information to store in the first place. Cryptographic techniques\
    \ such as storing hashes help greatly in making sure that the information, even\
    \ if stolen, would be completely useless to the hacker.\n\n## Conclusion\n\nThank\
    \ you again for downloading this book! \n\nI hope this book was able to help you\
    \ to learn the ropes of basic `ASP.NET` programming. \n\nThe next step is to actually\
    \ start programming your `ASP.NET` pages! Remember that this book only tackled\
    \ the beginning. There are several different topics under `ASP.NET`, just like\
    \ in any other programming language. Make sure to study and practice so that you\
    \ will be on your way to making your `ASP.NET` masterpiece!\n\nFinally, if you\
    \ enjoyed this book, please take the time to share your thoughts and post a review\
    \ on Amazon. We do our best to reach out to readers and provide the best value\
    \ we can. Your positive review will help us achieve that. It’d be greatly appreciated!\
    \ \n\nThank you and good luck!\n\n![thank-you](images/00016.jpeg)\n\n# Preview\
    \ Of ‘Android Programming in a Day! The Power Guide for Beginners in Android App\
    \ Programming\n\n### Chapter 1: Preparation\n\nAndroid application development\
    \ is not easy. You must have some decent background in program development. It\
    \ is a plus if you know Visual Basic and Java. And it will definitely be a great\
    \ advantage if you have used `Eclipse` IDE (Integrated Development Environment).\
    \ Also, being familiar with `XML` will help you.\n\nYou will need a couple of\
    \ things before you can start developing.\n\nFirst, you will need a high-end computer.\
    \ It is common that other programming development kits do not need a powerful\
    \ computer to create applications. However, creating programs for Android is a\
    \ bit different. You will need more computing power for you to run emulators,\
    \ which are programs that can allow you to test your programs in your computer.\n\
    \nUsing a weak computer without a decent processor and a good amount of RAM will\
    \ only make it difficult for you to run those emulators. If you were able to run\
    \ it, it will run slowly.\n\nSecond, you will need an Android device. That device\
    \ will be your beta tester. With it, you will know how your program will behave\
    \ in an Android device. When choosing the test device, make sure that it is at\
    \ par with the devices of the market you are targeting for your app. If you are\
    \ targeting tablet users, use a tablet. If you are targeting smartphones, then\
    \ use a smartphone.\n\nThird, you will need the `Android SDK` (Software Development\
    \ Kit) from Google. The SDK is a set of files and programs that can allow you\
    \ to create and compile your program’s code. As of this writing, the latest `Android\
    \ SDK` file size is around 350mb. It will take you 15 – 30 minutes to download\
    \ it. If you uncompressed the `Android SDK` file, it will take up around 450mb\
    \ of your computer’s disk space. The link to the download page is: http://developer.android.com/sdk/index.html\n\
    \nThe SDK can run on Windows XP, Windows 7, Mac OSX 10.8.5 (or higher), and Linux\
    \ distros that can run 32bit applications and has `glibc` (GNU C library) 2.11\
    \ or higher.\n"
  raw: 'Aside from system information and the like, there may also be information
    that you wish to keep private. Any of info of this kind should be considered “sensitive”
    information. This may range from passwords and encryption keys to notes about
    your application. If anyone gets to this, then your application can be compromised.


    If the app will transmit any sensitive information at all between the server and
    the browser, then consider the use of SSL (Secure Sockets Layer). The Microsoft
    knowledge base gives a lot of information on this.


    You can also use a form of protective configuration in order to secure this information.
    Make sure as well not to keep this info in a web page, even in any form (such
    as the server code) that you will not expect people to see.


    In the namespace System.Security.Cryptography, strong algorithms for encryption
    are supplied. These can be used to your advantage as well.


    Using Cookies Securely


    Cookies can be very useful in keeping user-specific data available. However, because
    they also get sent to the computer running the browser, they can be spoofed or
    used for other malicious means. Remember to never install any critical information
    on these cookies, such as passwords, even momentarily. As a rule of thumb, anything
    on a cookie that can compromise the app should not be in a cookie in the first
    place. Instead of the info itself, keep a reference in the cookie that points
    to the server location of this data.


    Remember as well to set expiration dates on cookies. These should be in the shortest
    time practical. If it will not break the app, never use permanent cookies. As
    an added measure, consider adding an encryption to the info in the cookies. Setting
    the HttpOnly and Secure properties of the cookie to the value “true” can also
    help.


    Guarding Against DDOS


    DDOS or Denial of Service is a malicious attack that makes your system unavailable
    for use by other people. This is done by overloading your server with requests,
    therefore keeping it too busy. In the worst case, this can crash the application.


    You can use different error handling techniques such as try-catch. Like mentioned
    above, you can use a “finally” block so you can release the resources when the
    app fails.


    Process throttling may also be configured for use by the IIS, preventing the app
    from hogging the CPU time. Size limits of the user input can be tested before
    they are used or stored. Safeguards can also be placed on the queries -- as an
    example, before query results are displayed in the ASP.NET Web page, you should
    first be sure that there is not an unreasonable amount of records.


    Putting a limit on the allowable upload size should also be a part of the app.
    The following syntax can be used (varying the maxRequestLength in kilobytes:


    <configuration>


    <system.web>


    <httpRuntime maxRequestLength=”4096” />


    </system.web>


    </configuration>


    The RequestLengthDiskThreshold property may also be used to reduce the overhead
    (in memory) of large forum posts and uploads.


    Aside from the different risks encountered in this chapter, you should also be
    familiar with other app security threats so you can wisely defend against them.
    Remember that secure technology is but a part of the overall solution.


    Four of the more common but less defended threats are as follows:


    1.  Repudiation. This is a threat that involves entering into a transaction in
    such a way that there is no proof of those truly involved afterwards. This can
    mean impersonating the credentials of an innocent user. To guard against this,
    you need to have stringent authentication in place.


    2.  Elevation of privilege. This is a type of attack that takes advantage of malicious
    means to get more permission that what has been normally assigned. A good example
    is a user being able to secure administrative privileges, therefore giving that
    user access to all data on the server. This can also lend the user control over
    the server’s capabilities. A minimal privilege context is an effective means to
    battle this type of attack, as discussed before.


    3.  Tampering. This type of attack refers to the deletion of a resource without
    proper authorization. An example is the defacing of a webpage, where the user
    gets into the site and changes the files therein. Script exploits are common vehicles
    of this type of attack. These scripts, as discussed above, can enter your app
    through the use of an input field.


    4. Information Disclosure. This is simply stealing and/or revealing the information
    that was supposed to be secure and private. A very common example is stealing
    login credentials like passwords, though this can extend to any type of file in
    the entire system. A good way to prevent this from happening is to avoid having
    passwords and other information to store in the first place. Cryptographic techniques
    such as storing hashes help greatly in making sure that the information, even
    if stolen, would be completely useless to the hacker.


    Conclusion


    Thank you again for downloading this book! 


    I hope this book was able to help you to learn the ropes of basic ASP.NET programming. 


    The next step is to actually start programming your ASP.NET pages! Remember that
    this book only tackled the beginning. There are several different topics under
    ASP.NET, just like in any other programming language. Make sure to study and practice
    so that you will be on your way to making your ASP.NET masterpiece!


    Finally, if you enjoyed this book, please take the time to share your thoughts
    and post a review on Amazon. We do our best to reach out to readers and provide
    the best value we can. Your positive review will help us achieve that.  It’d be
    greatly appreciated!


    Thank you and good luck!


