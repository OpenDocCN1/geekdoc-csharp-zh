    \ especially since today’s Internet landscape is rife with vulnerabilities waiting\
    \ to be exploited by those with less than noble intentions. A site’s protection\
    \ requires careful plans to be put in place, and a programmer or administrator\
    \ needs to have a clear understanding in the options needed to secure the site.\n\
    \nThe ASP.NET system works hand in hand with Microsoft’s `.NET` framework and\
    \ the `IIS` (Internet Information Services) to help provide web app security.\
    \ This means that the programmer or administrator will also have access to the\
    \ built-in security capabilities of the framework. This includes code access security\
    \ as well as role-based security. The `IIS` can also grant or revoke access based\
    \ on the IP address or host name of a user. Further authorization steps will have\
    \ to be performed through URL authentication of the NTFS file access permission.\n\
    \nIn protecting your application, you need to utilize the two primary functions\
    \ of ASP.NET security -- authentication and authorization.\n\n### Authentication\n\
    \nAuthentication is essentially the verification process undertaken to ensure\
    \ that the user is really who he says he is. The app will obtain credentials,\
    \ including the name, password, or various other forms of identification and will\
    \ perform validation on them against an established authority. Once the credentials\
    \ are found to be valid, the entity (user, computer) that submitted those credentials\
    \ will be considered “authenticated”.\n\nOnce authenticated, the entity will then\
    \ be checked for access rights to a particular resource. In ASP.NET, authentication\
    \ is provided through the use of authentication providers, code modules that will\
    \ have the code necessary to authenticate the credentials of those who made access\
    \ requests.\n\nFirst among these is the `Windows Authentication` provider, which\
    \ will treat the identity supplied by the `IIS` as the user which is authenticated\
    \ in the application. By default, the `IIS` will provide a number of authentication\
    \ methods such as Windows integrated (NTLM) authentication, anonymous authentication,\
    \ Windows integrated (Kerberos) authentication, Digest authentication, Basic (or\
    \ Base64 encoded) authentication, and even authentication that is based on client\
    \ certificates.\n\nOn the other hand, there are forms of authentication providers\
    \ that enable the app owner to authenticate users via the name and password, which\
    \ are submitted through a login form that is created by the programmer. Requests\
    \ that are not authenticated by the previous means will be redirected to this\
    \ login page, where the user submits the information through the form. Once the\
    \ app authenticates the request, the system will issue a key (through a ticket)\
    \ that establishes the identity for the subsequent requests.\n\n### Authorization\n\
    \nOn the other hand, authorization is the process which will limit the access\
    \ granted (or denied) to a specific user, coinciding with his permissions even\
    \ as an authenticated authority.\n\nThere are also two ways to perform authorization.\
    \ First is the File authorization, which is performed using the `FileAuthorizationModule`.\
    \ This will check the `ACL` (access control list) of the handler file (either\
    \ `.aspx` or `.asmx`) to determine whether the user should gain access to that\
    \ file. The `ACL` permissions determine this as well.\n\nThere is also URL authorization,\
    \ which is performed through the `UrlAuthorizationModule`. This maps the users\
    \ and the roles to the different URLs within the ASP.NET applications. This module\
    \ can then be used to selectively allow or deny a person access to any arbitrary\
    \ part of the application, usually directories, for different roles.\n\nThrough\
    \ the URL Authorization feature, an administrator can explicitly allow or block\
    \ a user from getting to specific place in the directory based solely on a predetermined\
    \ role or by assigning this access to the username. The permissions that are established\
    \ for the directory will also be inherited by the subdirectories, unless a separate\
    \ subdirectory configuration will override them.\n\nShow below is the syntax for\
    \ the code in the authorization section:\n\n```xml\n<authorization>\n<[allow|deny]\
    \ users role verbs />\n</authorization>\n```\n\nIn the aforementioned code, the\
