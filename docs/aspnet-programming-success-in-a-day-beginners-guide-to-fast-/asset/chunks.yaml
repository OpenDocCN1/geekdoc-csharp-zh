    Chapter 14: ASP.NET Security


    How Security Works


    After creating your application, you have to make sure that your website is secured.
    This is a common complex issue for Web developers, especially since today’s Internet
    landscape is rife with vulnerabilities waiting to be exploited by those with less
    than noble intentions. A site’s protection requires careful plans to be put in
    place, and a programmer or administrator needs to have a clear understanding in
    the options needed to secure the site.


    The ASP.NET system works hand in hand with Microsoft’s .NET framework and the
    IIS (Internet Information Services) to help provide web app security. This means
    that the programmer or administrator will also have access to the built-in security
    capabilities of the framework. This includes code access security as well as role-based
    security. The IIS can also grant or revoke access based on the IP address or host
    name of a user. Further authorization steps will have to be performed through
    URL authentication of the NTFS file access permission.


    In protecting your application, you need to utilize the two primary functions
    of ASP.NET security -- authentication and authorization.


    Authentication


    Authentication is essentially the verification process undertaken to ensure that
    the user is really who he says he is. The app will obtain credentials, including
    the name, password, or various other forms of identification and will perform
    validation on them against an established authority. Once the credentials are
    found to be valid, the entity (user, computer) that submitted those credentials
    will be considered “authenticated”.


    Once authenticated, the entity will then be checked for access rights to a particular
    resource. In ASP.NET, authentication is provided through the use of authentication
    providers, code modules that will have the code necessary to authenticate the
    credentials of those who made access requests.


    First among these is the Windows Authentication provider, which will treat the
    identity supplied by the IIS as the user which is authenticated in the application.
    By default, the IIS will provide a number of authentication methods such as Windows
    integrated (NTLM) authentication, anonymous authentication, Windows integrated
    (Kerberos) authentication, Digest authentication, Basic (or Base64 encoded) authentication,
    and even authentication that is based on client certificates.


    On the other hand, there are forms of authentication providers that enable the
    app owner to authenticate users via the name and password, which are submitted
    through a login form that is created by the programmer. Requests that are not
    authenticated by the previous means will be redirected to this login page, where
    the user submits the information through the form. Once the app authenticates
    the request, the system will issue a key (through a ticket) that establishes the
    identity for the subsequent requests.


    Authorization


    On the other hand, authorization is the process which will limit the access granted
    (or denied) to a specific user, coinciding with his permissions even as an authenticated
    authority.


    There are also two ways to perform authorization. First is the File authorization,
    which is performed using the FileAuthorizationModule. This will check the ACL
    (access control list) of the handler file (either .aspx or .asmx) to determine
    whether the user should gain access to that file. The ACL permissions determine
    this as well.


    There is also URL authorization, which is performed through the UrlAuthorizationModule.
    This maps the users and the roles to the different URLs within the ASP.NET applications.
    This module can then be used to selectively allow or deny a person access to any
    arbitrary part of the application, usually directories, for different roles.


    Through the URL Authorization feature, an administrator can explicitly allow or
    block a user from getting to specific place in the directory based solely on a
    predetermined role or by assigning this access to the username. The permissions
    that are established for the directory will also be inherited by the subdirectories,
    unless a separate subdirectory configuration will override them.


    Show below is the syntax for the code in the authorization section:


    <authorization>


    <[allow|deny] users role verbs />


    </authorization>


    In the aforementioned code, the allow or deny segment is a must. The programmer
    needs to specify either the roles or users attributes; though it is not required
    to put both of them at once, it can be done. Likewise, the verbs attribute is
    an optional one.


    As is obvious, placing either the allow or deny elements will either grant or
    revoke the access. Each element will support the rest of the attributes. Users
    will target the user accounts or identities. In this case, anonymous users will
    be identified using a question mark. All authenticated users can be specified
    through the use of an asterisk. The roles will serve to identify the RolePrincipal
    object for the specific request that will either be allowed or denied access to
    the resource. Lastly, the verbs will define the HTTP verbs applying to the action.
    This includes “get”, “head”, and “pos”. The default is an asterisk, which specifies
    all the verbs.


    Below is an example code that will grant access to an identity named “Chris”,
    and the members of the Admin role. The code will also deny access to “Erick”,
    (unless this identity is included in the admin group), as well as to all anonymous
    users.


    <authorization>


    <allow users=”Chris”/>


    <allow roles=”Admins” />


    <deny users=”Erick”/>


    <deny users=”?”/>


    </authorization>


    The following code, on the other hand, will show how to allow Erick access to
    the system and deny the same access to everybody else.


    <authorization>


    <allow users=”Erick”/>


    <deny users=”*”/>


    </authorization>


    Multiple entities may be specified for both the roles and users attributes, through
    a comma-separated list. Below is an example:'
