    ![](cover.jpeg)


    # ASP.NET Programming success in a day


    By Sam Key


    Beginners guide to fast, easy and efficient learning of ASP.NET programming


    2nd Edition


    ## Table Of Contents


    - Introduction

    - Chapter 1 - Intro to ASP.NET

    - Chapter 2 - ASP.NET Programming

    - Chapter 3 - Creating a Consistent Layout

    - Chapter 4 - Folders

    - Chapter 5 - Global Pages

    - Chapter 6 - HTML Forms

    - Chapter 7 - Objects

    - Chapter 8 - Working with Text Files

    - Chapter 9 - Displaying Data from Database

    - Chapter 10 - ASP.NET Helpers

    - Chapter 11: ASP.NET Debugging

    - Chapter 12: Monitoring the Health of ASP.NET Applications

    - Chapter 13: Displaying Safe Error Messages

    - Chapter 14: ASP.NET Security

    - Chapter 15: General Security Practices for ASP.NET

    - Conclusion

    - Preview Of ‘Android Programming’

    - Check Out My Other Book


    ## Introduction


    I want to thank you and congratulate you for downloading the book, “ASP.NET Programming
    success in a day: Beginners guide to fast, easy and efficient learning of ASP.NET
    programming ”.


    This book contains proven steps and strategies on how to do basic programming
    using the `ASP.NET` system.


    `ASP.NET` is probably one of the most versatile and yet most often overlooked
    programming languages today. It offers powerful features, flexibility, and a wide
    array of options. With later releases, `ASP.NET` has also begun to significantly
    develop its cross-platform compatibility, bringing it up to the level of its rival
    programming languages. Any serious programmer needs to know at least the basics
    of `ASP.NET` programming in order to utilize its numerous strong suites -- and
    this book will help you do just that.


    Thanks again for downloading this book. I hope you enjoy it!


    ## Chapter 1: Intro to ASP.NET


    ### Debunker ASP.NET Myths


    If you are into programming languages, you would have surely heard of `ASP.NET`,
    Microsoft’s open source Web application framework that works server-side. This
    technology was created to allow programmers to build websites, applications, and
    web services. Compared to other languages, `ASP.NET` is fairly new, first released
    at the start of 2002 with the first version of the company’s `.NET` framework.
    It is the successor to Microsoft’s `ASP` (Active Server Pages), hence the name.


    And if you are into programming languages, you would know that `ASP.NET` is infamous
    within the development community. Just like any other platform, the entire `.NET`
    system has its own share of valid criticisms. However, `.NET` has been famous
    for drawing the ire of more than the usual number of programmers, especially non-users.
    These are the ones who rely on misconceptions, thinking that `ASP.NET` is inferior.
    But most of these are unfounded; just check them out below:


    1. `ASP.NET` is made by Microsoft, so it should be bad. Many people think that
    Microsoft is the big, evil, moneymaking giant of the tech world, and they hate
    `ASP.NET` simply for being a Microsoft product. However, it is curious that Google
    and Apple, two other “evil tech giants” (as many critics call them), have their
    own programming systems each with a veritable religion of followers. This just
    proves that so long as the product works well, it should not matter who creates
    it.


    2. `ASP.NET` is expensive. This is perhaps one consistent negative point when
    `ASP.NET` is reviewed against other programming languages, but those reviews rarely
    put the word “expensive” in context. What may be a tad expensive for home users
    can be extremely cheap if placed in a business environment.


    In truth, one of the largest chunks of money spent when developing in `ASP.NET`
    is in the cost of `Windows` itself (provided you are literally starting from scratch
    and you don’t have `Windows`). In order to stay on top of the game (because alternatives
    such as the `Mono Project` lag in development), you could purchase a new machine
    with an OEM `Windows` install or purchase a license, which could cost you anywhere
    from $99 to $189 (the Ultimate edition).


    After the `Windows` install, everything else needed to develop `ASP.NET` applications
    (or any `.NET` applications in general) can be obtained for free. For beginners,
    Microsoft gives away the `WebMatrix` integrated development environment (with
    built-in web server and database engine). For advanced users, an Express (slightly
    trimmed down) version of `Visual Studio` is free. And for students, the `DreamSpark`
    program makes a lot of MS software available for free.


    Finally, `Windows` hosting has been thought to be much more expensive. This may
    have held true a decade ago, but there are several reasonably-priced hosting services
    today (some starting out at $2 per month).


    3. `ASP.NET` is only for enterprise. The above point being said, many will cry
    that `ASP.NET` is unsuitable for small, personal sites. In fact, one just has
    to look at the framework’s class library to get the feeling. While it’s true that
    some simple things aren’t as simple as they should be in `.NET` and that Microsoft
    as a platform primarily targeted businesses with the `.NET` release, they did
    make a lot of concessions to make the system user-friendly for everyone.


    As a first, let us consider the aforementioned `WebMatrix` for beginners. This
    offers new developers a simple approach to doing `ASP.NET` projects. Aside from
    being very easy to use, it is also created with a simplified `API` to make things
    less complex.


    Also, `ASP.NET` offers more than one development approach. In order to create
    structured programs that can be considered masterpieces of object-oriented design,
    you can use different methods, even through scripting mentalities that thrive
    in `PHP`.


    4. `ASP.NET` is closed. While it is easy to assume that Microsoft made this in
    the same manner that they made any of their other software, it is surprising to
    know that the entire `ASP.NET` system is open source. You can actually step into
    the code in the process of debugging, and you can even build your personal version
    of the entire `.NET` Framework. Even `ASP.NET` releases such as `WebForms` and
    `MVC` have their codes open.


    5. `ASP.NET` is Windows only. Earlier, we discussed that the main cost in running
    `ASP.NET` is in obtaining the `Windows` OS. However, we also mentioned the `Mono
    Project` in the same breath. The `Mono Project` is a cross-platform version of
    the `ASP.NET`, thanks in great part to the openness of the `.NET` Framework. While
    not officially supported, the `Mono Project` has been publicly acknowledged by
    Microsoft. As mentioned previously, however, `Mono` is a few steps behind Microsoft’s
    release. This said, it is still growing in popularity -- it even allows programmers
    to create iOS apps, using the `.NET` Framework an `C#!


    6. `ASP.NET` is not in demand. Many people believe that `ASP.NET` pales in comparison
    to other systems such as `Javascript`, `Perl`, `PHP`, `Ruby`, and about half a
    dozen more. They reason that `ASP.NET` is not in demand. Again, this should be
    put into perspective -- different places have different job markets.


    It is worthwhile to note that most `Windows` software have been developed using
    the `.NET` Framework, giving those versed in `ASP.NET` huge employment opportunities.
    `Mono` also factors into this demand -- with the breadth of OS support the `Mono
    Project` has, one can write any app for any of the biggest operating systems.


    Lastly, consider this: a lot of the most popular websites (including `Amazon`
    and `eBay`) have `ASP.NET` as their development models. `ASP.NET` is something
    big.


    ### Advantages of the ASP.NET Framework


    After debunking the common misconceptions against `ASP.NET`, here are some of
    the most significant advantages the system has.


    1. `ASP.NET` greatly reduces the amount of code that is needed to build larger
    applications.


    2. Built-in `Windows` authentication (as well as per-application configuration)
    allows apps developed using `ASP.NET` to be safe and secure.


    3. Early binding, caching services, native optimization, and just-in-time compilation
    all combine to provide better performance.

