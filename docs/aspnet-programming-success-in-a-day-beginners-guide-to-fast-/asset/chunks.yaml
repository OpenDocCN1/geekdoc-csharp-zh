    ## 引言


    感谢你的下载，祝贺你下载了《ASP.NET 编程一天成功：快速、简单、高效学习 ASP.NET 编程的入门指南》。


    本书包含了关于如何使用 `ASP.NET` 系统进行基础编程的经过验证的步骤和策略。


    `ASP.NET` 可能是当今最通用但也最经常被忽视的编程语言之一。它提供了强大的功能、灵活性以及广泛的选项。随着后续版本的发布，`ASP.NET` 也开始显著提升其跨平台兼容性，使其达到了与其竞争的编程语言相当的水平。任何严肃的程序员都至少需要了解
    `ASP.NET` 编程的基础知识，以便利用它的许多强大特性——而这本书将帮助你实现这一目标。


    再次感谢下载本书。希望你读得愉快！


    ## 第 1 章：ASP.NET 简介


    ### 破除 ASP.NET 的迷思


    如果你对编程语言感兴趣，你一定听过 `ASP.NET`，它是微软的一个用于服务器端的开源 Web 应用程序框架。该技术的创建是为了允许程序员构建网站、应用程序和
    Web 服务。与其他语言相比，`ASP.NET` 相对较新，它于 2002 年随着公司 `.NET` 框架第一个版本的发布发布。它是微软 `ASP`（活动服务器页）的继承者，因此得名如此。


    如果你对编程语言感兴趣，就会知道 `ASP.NET` 在开发社区中臭名昭著。就像任何其他平台一样，整个 `.NET` 系统都有其合理的批评意见。然而，`.NET`
    一直由于引起比比常多的程序员（尤其是非用户）的反感而闻名。这些人是依赖于误解，认为 `ASP.NET` 是低人一等的。但大多数这些观点都是毫无根据的；请看下面的分析：


    1. `ASP.NET` 是微软制作的，所以它应该是坏的。很多人认为微软是科技世界中庞大、邪恶、唯利图是的巨头，他们仅仅因为 `ASP.NET` 是微软的产品而讨厌它。然而，有趣的是，谷歌和苹果这另外两个“邪恶科技巨头”（正如许多批评者所言）也有它们自己的编程系统，每个系统都拥有一批忠实的追随者。这恰证明了只要产品运行良好，由谁创建它并不重要。


    2. `ASP.NET` 很贵。在与其他编程语言对 `ASP.NET` 进行比较时，这可能是唯一一致的负面点，但那些评论很少在语境中讨论“贵”这个词。对于家庭用户来说可能有点贵，但如果放在商业环境中可能极其廉价。


    事实上，在开发 `ASP.NET` 时花费的大头之一是 `Windows` 本身的成本（前提是你确实是从零开始且没有 `Windows` 的）。为了保持领先地位（因为如
    `Mono Project` 等替代方案进展滞后），你可以购买一台安装了 OEM `Windows` 的新机器，或者购买许可证，费用在 99 到 189 美元之间（旗舰版）。


    在安装 `Windows` 之后，开发 `ASP.NET` 应用程序（或任何 `.NET` 应用程序）所需的所有内容都可以免费获得。对于初，微软提供了 `WebMatrix`
    集成开发环境（内置 Web 服务器和数据库引擎）。对于高级用户，Express（稍精简版）的 `Visual Studio` 是免费的。对于学生，`DreamSpark`
    项目让许多微软软件免费可用。


    最后，`Windows` 托管一直被认为要贵得多。这在十年前可能是事实，但现在有几家价格合理的托管服务（有些每月 2 美元起步）。


    3. `ASP.NET` 仅用于企业。在上述观点的基础上，许多人会哀叹 `ASP.NET` 不适合小型个人网站。事实上，你只需要查看框架的类库就能有所感觉。虽然某些简单的事情在
    `.NET` 中并不像应该的那么简单，而且微软作为一个平台在发布 `.NET` 时主要针对企业，但他们确实做了很多妥协，让该系统对所有人都友好。


    首先，让我们考虑上述面向初者的 `WebMatrix`。它为新开发者提供了进行 `ASP.NET` 项目的简单方法。除了非常易用外，它还通过简化的 `API`
    创建，使事情变得不那么复杂。


    此外，`ASP.NET` 提供了多种开发方法。为了创建可以被视为对象设计杰作的结构化程序，你可以使用不同的方法，甚至可以通过在 `PHP` 中盛行的脚本思维。


    4. `ASP.NET` 是封闭的。虽然很容易假设微软是像制作其他任何软件一样制作了它，但令人惊讶的是，整个 `ASP.NET` 系统都是开源的。你可以在调试过程中实际上进入代码，甚至可以构建你个人的版本的整个
    `.NET` 框架。即使 `ASP.NET` 发布的 `WebForms` 和 `MVC` 其代码也是开放的。


    5. `ASP.NET` 仅限 Windows。之前我们讨论过运行 `ASP.NET` 的主要成本是获取 `Windows` 操作系统。然而，我们也同时提到了
    `Mono Project`。`Mono Project` 是 `ASP.NET` 的跨平台版本，这很大程度上归于 `.NET` 框架的开放性。虽然没有官方支持，但
    `Mono Project` 已获得微软的公开承认。正如之前提到的，`Mono` 比微软的发布后了几步。尽管如此，它的人气仍在增长——它甚至允许程序员使用
    `.NET` 框架和 `C#!` 创建 iOS 应用。


    6. `ASP.NET` 没有需求。许多人认为 `ASP.NET` 与 `Javascript`、`Perl`、`PHP`、`Ruby` 以及其他六个系统相比相形见��。他们认为
    `ASP.NET` 没有需求。再次，这应该客观来看——不同的地方有不同的就业市场。


    值得注意的是，大多数 `Windows` 软件都是使用 `.NET` 框架开发的，这为精通 `ASP.NET` 的人提供了巨大的就业机会。`Mono` 也考虑了这种需求——凭借
    `Mono Project` 拥有的广泛操作系统支持，人们可以为任何最大的操作系统编写任何应用程序。


    最后，考虑一下这一点：许多最流行的网站（包括 `Amazon` 和 `eBay`）都使用 `ASP.NET` 作为它们的开发模型。`ASP.NET` 是一个大不起的东西。


    ### ASP.NET 框架的优势


    在破除了针对 `ASP.NET` 的常见误解后，这里是该系统的一些显著优势。


    1. `ASP.NET` 极大地减少了构建大型应用程序所需的代码量。


    2. 内置的 `Windows` 身份验证（以及按应用程序配置）使得使用 `ASP.NET` 开发的应用程序是安全的。


    3. 早期绑定、缓存服务、原生优化和即时编译共同提供了更好的性能。


