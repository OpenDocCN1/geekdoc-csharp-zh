    \ error appears, then a session state variable will be loaded with the message\
    \ details. The application will then display a page which will be able to read\
    \ your `Session` variable, as well as subsequently display your error message.\
    \ These error messages will be those specifically written to not provide exploitable\
    \ items to another user. For local users, a different set of error details can\
    \ be provided. Within your `finally` block, we will release an open resource.\n\
    \n```\nTry\n{\n    sqlConnection1.Open();\n    sqlDataAdapter1.Fill(dsCustomers1);\n\
    }\nCatch (Exception ex)\n{\n    If(Request.IsLocal)\n    { Session[\"CurrentError\"\
    ] = ex.Message}\n    Else\n    { Session[\"CurrentError\"] = “Error processing\
    \ page.;}\n    Server.Transfer(“ApplicationError.aspx”);\n}\nFinally\n{\n    this.sqlConnection1.Close();\n\
    }\n```\n\n## Creating Global Error Handlers\n\nA programmer can also make error\
    \ handlers that can catch all the different unhandled exceptions within page level\
    \ and even at the application level in full.\n\nTo make these global handlers,\
    \ simply make one for your `System.Web.UI.TemplateControl.Error`. Application-wide\
    \ handlers are separately handled within the `Global.asax` data – simply add the\
    \ code to your `System.Web.HttpApplication.Error`. These will be called if unhandled\
    \ exceptions occur within the application or page. Additional information regarding\
    \ the latest error can be obtained from `GetLastError`.\n\nNote that if you already\
    \ have global error handlers, it will take precedence over the error handling\
    \ methods specified within the attribute `defaultRedirect`, in the `customErrors`\
    \ config element.\n\nHere is an example (in code) of how a handler gets information\
    \ regarding the error, places it within the `Session` variable, then calls an\
    \ error-handling option which in turn extracts and displays the information on\
    \ the error.\n\n```c\nprotected void Application_Error(Object sender, EventArgs\
    \ e)\n{\n    Session[\"CurrentError\"] = “Global: “\n    Server.GetLastError().Message;\n\
    \    Server.Transfer(“lasterr.aspx”);\n}\n```\n\n## Chapter 14: ASP.NET Security\n\
    \n### How Security Works\n\nAfter creating your application, you have to make\
