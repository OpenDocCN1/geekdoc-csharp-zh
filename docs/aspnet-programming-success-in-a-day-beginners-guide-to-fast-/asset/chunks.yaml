    Let’s say that you specified the “debug=true” value in `www.yoursite.com/file/web.config`,
    then any application within the “file” folder and in all its subfolders would
    inherit the mentioned setting. So when the application you are looking for is
    located in the `/file/file2` folder, it will inherit the setting in the “file”
    folder. The exception is when one of these applications override the config setting
    through its own `web.config`.


    # Chapter 12: Monitoring the Health of ASP.NET Applications


    Health monitoring is a task that ensures that the application is healthy. Any
    failing systems will be rapidly diagnosed, and significant events that happen
    during the application’s life cycle can be appraised. ASP.NET applications can
    be monitored either individually or across a “Web farm”, and the monitoring can
    be configured not just errors but also events that happen within the app.


    The health monitoring system built into ASP.NET includes event types that work
    by packaging the application’s health status information. There are also provider
    types that serve to process the information about the event. These listen for
    the events and consume the information, usually through logging the info or by
    sending a notification to the administrator. Connecting an event to a provider
    (commonly referred to as “enabling an event”) is done by making the settings in
    the config files. And then, there are the additional types that help in managing
    these events.


    The health monitoring system of ASP.NET is implemented through the classes found
    in the namespace `System.Web.Management`.


    ## Configuring Monitoring


    ASP.NET apps can be configures to use customized or built-in monitoring tools.
    Providers and web events can be added to the app through the `healthMonitoring`
    section of the config file. After accessing this, the programmer can use different
    classes for the processing of the data.


    ## Class Hierarchy: Web Events


    When the event is raised, an associated event class will be raised. Data about
    the event will be collected in the object’s properties, which are in turn processed
    by the event providers.


    These events can contain a myriad of information, such as those coming from audit
    events, configuration errors, application errors, response data, request data,
    application domain, and worker process. Health information contained in the parent
    event class will be inherited by child event classes. The further down in the
    hierarchy of Web event classes an event is, the more specific to the application
    the data is. Derived classes can, for example, expose information like client
    IPs, stack traces, and process and thread information.


    ## Class Hierarchy: Providers


    - The built-in providers can be used to process the Web events. A programmer can
    also inherit from these built in classes to create custom providers. These, however,
    are subject to the following limitations of inheritance:

    - The class `WebEventProvider` can be inherited by apps running under any trust
    level.

    - The class `BufferedWebEventProvider` can be inherited by apps running under
    any trust level.

    - The class `SqlWebEventProvider` can be inherited by apps running under Full
    trust.

    - The other classes cannot be inherited by the apps, no matter the trust level.


    ## Using Built-in Providers and Web Events


    This is the most common strategy in the use of health monitoring tools. The only
    requirement will be to configure the application to use the items you will need.
    There are a few tasks you will have to perform first:


    - Add the web event class you will need to the element `eventMappings` of the
    `healthMonitoring` section of the app’s configuration file.

    - Add to the provider’s element (found in the healthMonitoring section) the provider
    which consumes the event.

    - Add to the rules element an item that defines the association between the provider
    and event.


    In the default settings, the built-in classes can be configured in the `healthMonitoring`
    segment of the root config file. The following default configurations are established
    by the section:


    - Specify in `eventMappings` the web event classes deriving from `WebBaseEvent`.
    This section can be used to assign friendly names to any group of event classes.

    - Include in at least one of the aforementioned defined groups the event classes
    deriving from the `WebBaseEvent`.

    - In the `providers` element, the following event providers are specified: `EventLogWeEventProvider`,
    `SqlWebEventProvider`, and `WmiWebEventProvider`. The programmer can specify other
    built-in providers in the providers element, like `TemplatedMailWebEventProvider`,
    `SimpleMailWebEventProvider`, and `TraceWebEventProvider`.

    - The rules associating the audit failure events and Web error to `EventLogWebEventProvider`
    classes are detailed in the element `rules`. You may enable Web events and providers
    by appending to the rules elements. Any event will be considered enabled if this
    is mapped to any event provider in this element. The provider and `eventMappings`
    elements need to be configured for the event, and unless the two will be connected
    in the rules element, the event will not be enabled.


    The programmer can also detail the parameter values for configured items. These
    examples include parameters limiting the number of occurring events, those specifying
    the interval between different events, or those specifying the SQL and mail providers
    buffering options.


    # Chapter 13: Displaying Safe Error Messages


    When the app displays errors, it must not be in such a manner that vulnerable
    information is given out as this can be used by a malicious attacker to hack or
    jeopardize your system. As an example, if the application attempts to unsuccessfully
    log into a database, the error message must not display the username that is being
    used.


    There are different means to control the error messages shown to the users, and
    this includes the following:


    - Configuring the app to not give out verbose errors to the remote users. These
    “Remote Users” refer to those who request for the app’s pages while not on a computer
    connected directly to the server. These errors can optionally be redirected to
    an app page.

    - Error handling can be included whenever possible, and your own version of error
    messages may also be constructed. In the error handler, the programmer may test
    to check whether this specific user is a local one. If so, the system can react
    accordingly.

    - Global error handlers can be created at the application or page level. This
    catches all the unhanded exceptions, routing them to a more generic page showing
    a customer error message. This way, even when a problem is not anticipated, users
    won’t be seeing any exception page.


    ## Configuring applications to disallow the error messages for the remote users


    Tweaking the web configuration file for the specific application, the following
    modifications can be made to your customErrors:


    - Setting the `mode` to `RemoteOnly`. Remember, this is case-sensitive. The change
    will configure the app to show the detailed errors when the user is local -- specifically,
    if the developer tries to connect to the app.

    - Put up `defaultRedirect` attributes that will be pointing to the app error page.

    - Put an `error` element that will redirect some specific instances to some specific
    pages. As an example, a standard “Page not found” (404) error message can be found
    on the app page.


    The following codes show an example of what the usual `customErrors` block looks
    like in a `Web.config`.


    ```

    <customErrors mode="RemoteOnly" defaultRedirect="AppErrors.aspx">

    <error statusCode="404" redirect="NoSuchPage.aspx"/>

    <error statusCode="403" redirect="NoAccessAllowed.aspx"/>

    </customErrors>

    ```


    ## Including Error Handling


    First, place `try-catch` blocks around statements that could generate an error.
    You may also optionally check with local users having the `IsLocal`, then modify
    the error handling. The value equivalent to the localhost is `127.0.0.1` – this
    means that the web browser is running on the same PC as the server.

    '
