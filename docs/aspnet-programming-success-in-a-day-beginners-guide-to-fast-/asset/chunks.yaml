    # 第 4 章：文件夹


    在 ASP.NET 系统中，存在两种不同类型的文件夹结构：逻辑结构和物理结构。以下是构成典型逻辑文件夹结构的一组文件夹：


    ● `Account`。此文件夹包含所有登录和安全文件。

    ● `App_Data`。它包含所有数据库以及数据文件。

    ● `Images`。此文件夹包含你页面使用的不同图像。

    ● `Scripts`。这些包含不同的浏览器脚本。

    ● `Shared`。此文件夹包含所有公共文件，例如布局和样式文件。


    除了服务器上的逻辑文件夹结构外，你的计算机上也有一个物理位置。这看起来应该很熟悉：


    `C:\YourName\Documents\MyWeb\Sample\Images`


    ## 虚拟名称与物理名称


    区分某个项目的名称是虚拟的还是物理的是重要的——但这很容易，因为它们直接遵循逻辑/物理文件夹的名称。例如，一个示例图像的虚拟名称可能简单为“Images\sample.png”，而其物理对应项则是
    `C:\YourName\Documents\MyWeb\Sample\Images\sample.png`。


    ## 路径与 URL


    我们知道 URL（通用资源定位符）用于从 Web 访问文件和页面。例如 `http://www.yoursite.com/sample/page.aspx`。然而，这对应于服务器计算机上的物理数据，基本上与上一节中的物理名称相同。这被称为“路径”。虚拟路径是作为快捷方式创建的，用以表示这些物理路径的长名称。此虚拟路径就是上述
    URL 中“.com”之后出现的内容：`/sample/page.aspx`。


    在编写 ASP.NET 代码时，你需要根据编码的内容对虚拟路径和物理路径进行引用。


    ASP.NET 提供了三种不同的工具来方便地处理这些文件夹路径，将在下文中讨论：


    ### ~ 运算符


    它指定了编程代码中的虚拟根。使用 `~` 运算符而不是根路径将允许你将页面或站点移动到不同的位置或文件夹，而无需更改代码。以下是一个示例：


    ![](img/00006.jpeg)


    ### Server.MapPath


    此方法将虚拟路径（例如，`/sample.cshtml`）转换为服务器可以理解的物理路径（`C:\YourName\Documents\MyWeb\Sample\sample.cshtml`）。


    当需要打开网站服务器上的文件时，可以使用此方法。需要记住，只有使用完整的物理路径才能访问数据文件。如下所示：


    ![](img/00007.jpeg)


    下一章将更多地讨论读取和写入数据文件。


    ### Href


    本质上，浏览器无法理解我们之前讨论的 `~` 运算符（它仅限于 ASP.NET 使用）。`Href` 方法可以通过将代码行中使用的路径转换为浏览器可以理解的特定路径来弥补这一缺陷。


    `Href` 样式可用于映射到资源的路径，如 CSS 文件和图像文件。你将在 HTML `<img>`、`<link>` 和 `<a>` 元素中频繁使用此方法。示例代码如下：


    ![](img/00008.jpeg)


    # 第 5 章：全局页面


    ## Web 启动之前：_AppStart


    大多数服务器端代码都写在单个网页内部。例如，如果某个页面包含任何输入表单，则该网页通常会包含用于读取数据的服务器代码。


    然而，当程序员在站点根目录下创建一个名为 `_AppStart` 的页面时，启动代码甚至在站点启动之前就可以执行。如果存在这样的页面，当站点中的任何页面被请求时，ASP.NET
    会首先运行它。


    `_AppStart` 的典型用法是用于启动代码以及全局值（如全局名称和计数器）的初始化。


    注意，`_AppStart` 在文件扩展名上应与其他页面相似，例如 `_AppStart.cshtml` 或 `_AppStart.vbhtml`。此外，注意
    `_AppStart` 中的下划线前缀。在任何页面加上下划线意味着包含的文件不能被直接浏览。这是好事，因为 `_AppStart` 文件夹通常包含敏感信息。


    ## 每个页面之前：_PageStart


    与 `_AppStart` 即使在站点启动之前运行一样，你也可以创建在文件夹中任何页面之前运行的代码。对于你站点中的每个文件夹，你都可以添加一个名为 `_PageStart`
    的文件。


    `_PageStart` 的常见用途是为文件夹中的每个页面设置布局页。它也可以用于在页面运行之前检查用户是否登录。


    基本上，当站点及其页面的请求进来时，ASP.NET 将检查 `_AppStart` 是否存在。如果是这种情况且当前请求是第一个请求，则 `_AppStart`
    将运行。


    然后 ASP.NET 将检查 `_PageStart` 文档是否存在。如果存在，它将在页面之前运行。


    # 第 6 章：HTML 表单


    像任何其他编程语言一样，表单是放置单选按钮、复选框、文本框甚至下拉列表的地方。以下是使用 Razor 实现此点的示例。


    ## 显示图像


    你也可以在输入字段中使用 Razor 根据用户输入动态显示图像。


    例如，你想使用 images 文件夹中名为 `sample.png` 的图像。可以使用 HTML <img> 元素显示：


    ```html

    <img src="images/sample.png" alt="Sample" />

    ```


    然而，如果你有三张根据选项显示的图片，可以使用 Razor 代码：


    ![](img/00009.jpeg)


    在此示例中，服务器最初形成名为 `imagePath` 的变量。然后，HTML 指向名为 `Choice` 的输入方法（`<select>` 元素）。这允许程序员选择浏览器友好的名称（例如“Photo
    1”），并在页面提交后传递文件名（例如“sample.png”）。


    代码将通过 `Request["Choice"]` 读取选择。一旦发现值，代码将构造文件路径并存储在 `imagePath` 中。


    在任何图像的 HTML 页面中，都使用 <img> 标签。页面加载后，src 代码将对应于 `imagePath` 的值。


    最后，将 <img> 元素放置在 if 块中，以防止其尝试显示无名图像。


    # 第 7 章：对象


    到为止，你已经使用了一些页面对象方法。最初，你有：


    ![](img/00010.jpeg)


    并且在上一章中，你有这些行：


    ![](img/00011.jpeg)


    本章将让你更好地理解不同的对象代码。


    ## 页面对象方法


    ● `Href`。利用指定的参数创建 URL。

    ● `RenderBody()`。渲染内容页中位于任何命名部分之外（适用于布局页）。

    ● `RenderPage(page)`。在另一个页面内渲染页面的内容。

    ● `RenderSection(section)`。渲染命名部分的内容（适用于布局页）。

    ● `Write(object)`。将对象作为字符串写入（经过 HTML 编码）。

    ● `WriteLiteral`。直接写入对象，而不先通过 HTML 编码。


