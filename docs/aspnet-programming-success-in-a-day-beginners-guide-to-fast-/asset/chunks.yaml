- fmt: '

    First of all, for remote debugging, the remote and local computers should be on
    either a domain or workgroup setup. In order to debug the worker process, the
    programmer must have the permission to perform the action. By default, an ASP.NET
    application will run as the `ASPNET` user. If the worker process is `ASPNET` or
    `NETWORK SERVICE`, then the programmer must have administrative privileges to
    perform the debugging.


    The name of the worker process can change depending on the debugging scenario
    and version of the `IIS`. The user account that the worker process runs under
    can be changed by modifying the `machine.config` file. This is found on the server
    that is running the `IIS`. The best way this is done is to use the `IIS Manager`.
    The worker process can also be changed to run under your own user account, and
    in this case the programmer does not have to be a server administrator to perform
    the needed actions.


    Remember that before changing the worker process so it runs under a different
    account, it will always be a possibility that the ASP.NET worker process may be
    hacked when under the new account. The `NETWORK SERVICE` and `ASPNET` accounts
    can run with the minimal permissions, thereby reducing any possible damage taken
    if the process is hacked. Changing to an account with greater permissions can
    increase the potential damage.


    ## Configuring Web Apps for Debugging


    In order to enable the debugging of ASP.NET Web applications, one must configure
    the application to be able to compile into a “debug build”. This build includes
    the data that the debugger needs so it can step through the lines of code and
    display the variables therein. A web app may be configured to use the debug build
    on the Compilation section of its `Web.config` file. In case you want to debug
    individual pages, then the `debug=true` line can be added to the `@ Page` directive
    of the relevant pages.


    Remember that any application compiled into the debug build may perform a lot
    more slowly in comparison to the retail build. Before the application is deployed
    to the market, make sure that the debug mode is turned off. Debug mode also causes
    more information to be exposed in the stack once an error occurs, which can potentially
    mean a security issue for the product.


    ## Remote and Local Debugging


    A web server that s locally run (such as `IIS`) can allow you to debug applications
    locally running on your computer. These pages can then be viewed in a browser.


    However, when a page cannot be run locally due to the inability to run a Web Server
    (or simply because the app is not locally available), then a remote debug can
    be performed. In order to do this, `Visual Studio`’s remote debugging components
    must be installed on the remote server.


    ## Debugging Permissions


    The process of debugging requires more privileges than simply running the same
    app. In addition to securing configurations in the app for debugging, it is also
    mandatory that there are adequate permissions secured to allow the attaching of
    the debugger to the relevant process. Users will have the permission to debug
    local processes running under their credentials, but another user’s processes
    will not be accessible to them for debugging. Administrators, on the other hand,
    can access and debug any process by any user.


    The same thing goes when you are debugging on a remote server, as you will need
    the admin privileges of the computer where the process runs.


    ## Client-Side Script Debugging


    In addition to the application debugging done on the server side, Visual Debugger
    also lets you debug the client script as long as it is written on JavaScript (EMCAScript)
    or VBScript. This feature can be especially useful when the programmer has Web
    server controls using client-side scripts.


    ## Debugging Deployed Web Apps


    You might need to debug a web application that has already been running on a production
    server. This is possible, but it should be done with caution. Let’s say that you
    have attached the worker process of ASP.NET for debugging, and a breakpoint has
    been hit. This will cause all the managed code in the worker process to halt.
    Halting these managed codes, in turn, can cause a stoppage to all the work for
    all users on the specific server. It is important to understand the impact to
    the production in case you decide to debug on a production server.


    Aside from adding the debugger to the relevant ASP.NET worker process, double
    check that the Visual Debugger is given access to the application’s symbols. The
    source files for the application also need to be located and opened.


    A lot of the ASP.NET applications will reference `DLLs` containing business logic
    or some other useful bits of code. These references automatically copy the `DLLs`
    from the local computer to the `\bin` folder in the virtual directory of the Web
    app. When debugging, remember that the application will be referencing this and
    not the local copy on the computer.


    The methods used for attaching the worker process to the debugger are the same
    as those of other remote processes. When the attachment is successful, not opening
    the correct project will leave you with a dialog box when the application reaches
    a breakpoint. This box will ask for the location of the source files. The filename
    which is specified in this box must be the same filename specified in the debug
    symbols of the server.


    ## Enabling Debugging for ASP.NET Web Applications


    To enable the debugging option, one must enable this both in the Project Properties
    menu and the web configuration file of the application. Note that the commands
    and dialog boxes that you see can differ from those listed in Help documentations,
    depending on the software edition or your current settings. The settings can be
    changed by choosing “Import and Export” in your Tools menu.


    ### Enabling in Project Properties


    1.  Go to Solution Explorer and right-click your project s name. From the options,
    select “Properties”.

    2.  Under the Properties menu, click on the tab marked “Web”.

    3.  Select ASP.NET from the debuggers option.


    ### Enabling using web.config file


    1.  Open `web.config` using any XML parser or web editor. Note that this cannot
    be accessed remotely using your web browser. By default, the Microsoft IIS is
    configured to prevent browsers from directly accessing the `Web.config` file.
    This is for security purposes. Accessing the configuration file through a browser
    will get you an “Access Error 403 (Forbidden)”.

    2.  Since the configuration file is written in XML, it will contain nested sections
    that are marked using tags. Find the element that says `configuration/system.web/compilation`.
    In case this element is non-existent, you will have to manually create it.

    3.  In case the aforementioned element did not have any debug attribute, this
    will also have to be manually added.

    4.  Make sure that once the attribute of the debug is added, its value is changed
    to “true”.


    Here is an example of how the web configuration file would look like:


    ```xml

    <configuration>

    ...

    <system.web>

    <compilation Debug="true"

    ...

    >

    </compilation>

    </system.web>

    </configuration>

    ```


    ## Robust Programming


    The programming language will automatically detect all changes made to the configuration
    files, and these changes will automatically be applied in the settings. Thus,
    the programmer no longer has to reboot the IIS server or the computer for the
    changes to appear.


    Another good aspect of ASP.NET is that it inherits the settings from the config
    files found higher up the URL hierarchy. This is especially useful since a site
    can contain more than one multiple directories and subdirectories stored virtually,
    with each one possibly containing a `web.config` file. However, in case the debug
    was set on any file lower down the hierarchy, the higher debug value will be overridden.

