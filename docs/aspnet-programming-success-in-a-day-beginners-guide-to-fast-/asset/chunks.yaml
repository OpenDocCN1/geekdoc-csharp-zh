    \ to an identity named “Chris”, and the members of the Admin role. The code will\
    \ also deny access to “Erick”, (unless this identity is included in the admin\
    \ group), as well as to all anonymous users.\n\n```xml\n<authorization>\n<allow\
    \ users=\"Chris”/>\n<allow roles=\"Admins” />\n<deny users=\"Erick”/>\n<deny users=\"\
    ?”/>\n</authorization>\n```\n\nThe following code, on the other hand, will show\
