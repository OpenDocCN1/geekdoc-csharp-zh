    # Page Object Properties


    - `IsPost`: This returns true when the method of data transfer utilized by the
    client happens to be a `POST`.

    - `Layout`: This sets or gets the location of the layout page.

    - `Page`: This provides access (property-like) to data that is shared between
    the layout pages and the rest of the pages.

    - `Request`: This procures the `HttpRequest` object and relays it to the existing
    HTTP request.

    - `Server`: This gets the `HttpServerUtility` object, providing methods of webpage
    processing.


    ## Page Object’s Page Property


    The page property of a page object will provide a property-like access towards
    the data being shared between the layout pages and the rest of the content pages.
    The programmer can add his own properties to the existing `Page` property:


    - `Page.Version`

    - `Page.Title`

    - `Page.<insert anything here>`


    This property can be very helpful -- as an example, it allows the programmer to
    create the page title in the content files, for use within in the layout file.
    This is how it appears in a sample “Home.cshtml” page:


    ![](images/00012.jpeg)


    In contrast, here is how it will look in a sample “Layout.cshtml” website:


    ![](images/00013.jpeg)


    # Chapter 8: ASP.NET with Text Files


    There are times when a programmer wants to access data stored within a text file.
    These files (also used to store information) are also commonly referred to as
    “flat files”. The common flat file formats include `.xml`, `.txt`, and comma-delimited
    values (`.csv`).


    ## Displaying Data from the Text File


    The text files usually appear in the `App_Data` folder (hence you need to make
    one if you want to personally try the following examples). Let’s say that you
    have a new document entitled “Authors.txt” and you have the following content:


    ```

    Doyle, Arthur Conan

    Christie, Agatha

    Leblanc, Maurice

    ```


    This example will show how to show data from this text file:


    In this example, `Server.MapPath` is used to find the exact file path of the text.
    Then, `File.ReadAllLines` will open the text document and read all the lines from
    the text into the array. For every `dataItem` in all the `datalines` of these
    arrays, the data will be displayed.


    ## Showing Data from Excel


    Using Microsoft Excel, the programmer can save the spreadsheet as a `.csv` file.
    Once this is done, each row in the spreadsheet will be saved and treated like
    a line of text. Each column will then be separated by a comma, and each row will
    be saved as a line of text.


    The same instruction as mentioned above can read the Excel `.csv` document-- all
    you have to do will be to change the filename to the appropriate one.


    ![](images/00014.jpeg)


    # Chapter 9: Displaying Information from the Database


    Using Web Pages, the programmer will be able to easily show information from a
    database. Programmers are able connect to any existing database, though this database
    can be created from scratch. As shown in the following examples, we will be trying
    to interface with an extant SQL Server Compact database.


    ## Creating a Customers Page


    In your folder, let’s say that a new file is named “Items.cshtml”. You can try
    using the code below as a replacement for what you have now:


    ![](images/00015.jpeg)


    This example uses the `Database.Open(name)` technique, which connects to the database
    in two steps:


    1. It will search the application’s `App_Data` for the database which will match
    what is specified in the `name` parameter, with the exception of the filename
    extension.

    2. If the file is not found, it will look for the connection string within the
    `Web.config` file of the application. (The connection string is that which shows
    information about connecting to the database. This may include a name of any SQL
    database, complete with the username and password, or a file path).


    This two-step method will allow the programmer to test out the application with
    a database, as well as to execute the application on a web host through a connection
    string.


    # Chapter 10: ASP.NET Helpers


    In ASP.NET, the programmer can take advantage of the use of helpers, which are
    components that can easily be accessed through single lines of Razor code. Aside
    from built-in ASP.NET helpers, these can be built in a DIY manner through the
    Razor syntax, after which they are stored as `.cshtml` files.


    Here is a list of some useful helpers:


    - **WebGrid Helper**: This can simplify the display of data, automatically setting
    up HTML tables and supporting different formatting options. In tip of these, it
    can also support paging through data as well as sorting by clicking on the headings.

    - **Chart Helper**: This can display different types of chart images, with different
    formatting options and labels. It can also display data from databases, arrays,
    or files.

    - **WebMail Helper**: This will provide functions for sending messages through
    email, using Simple Mail Transfer Protocol (SMTP).

    - **WebImage Helper**: This helper can provide functionality to manage the images
    in a page. You can also use certain keywords such as watermark, resize, rotate,
    and flip.


    Aside from those mentioned above, the user can also take advantage of third-party
    helpers to simplify multimedia, social networks, and other components including
    security and navigation.


    These helpers can also be easily installed through `WebMatrix`. Simply open the
    Site workspace, click on the Web Pages Administration, log in, and use the search
    field to look for your desired helpers.


    # Chapter 11: ASP.NET Debugging


    Any application created on any platform can contain a myriad of errors even when
    it has already been published. While compilation can reliably weed out a lot of
    the syntax errors, some types of bugs will require the programmer to go through
    a debugging process. This is the method of examining the code while running so
    you can verify.


    The Windows SDK (Software Development Kit) that comes along with ASP.NET contains
    a Visual Debugger that allows the programmer to look at the application as it
    runs. The tool is `DbgCLR.exe` and can be found in the `DuiDebug` folder. This
    debugger is used by attaching it to the process that will be running the pages.


    If you are using Internet Information Services versions 5.0 and 5.1 or ISS 6.0
    that is running in the 5.0 application mode, then the process where the Visual
    Debugger is attached is `Aspnet_wp.exe`, the worker process for ASP.NET. If you
    are running version 6.0 of the ISS in worker process isolation mode, however,
    then you attach the debugger to the `W3wp.exe` or the thread pool process.


    Once a debugger is attached to a specific process, everything that is going on
    within that process can be seen. On top of this, the debugger will also map the
    instructions that are executed in the process into the original code. The Visual
    Debugger has three primary features that help you debug applications:


    - **Breakpoints**: These are the places within the code when the debugger will
    send a signal for the application to stop. This will allow you to view the application’s
    state as of that point, and then step through each line.

    - **Stepping**: “Stepping through each line” of code is simply running the code
    line by line. To help make the experience friendlier, Visual Debugger has some
    iterators that allow the programmer to specify how many times loops will be ran
    before another stop is reached.

    - **Data Viewing**: The debugger also gives different options with regard to the
    tracking and viewing of data while the application still runs. Modifications to
    the data can be made once the app stops in a breakpoint, and the application can
    then be ran again with the modified data.

