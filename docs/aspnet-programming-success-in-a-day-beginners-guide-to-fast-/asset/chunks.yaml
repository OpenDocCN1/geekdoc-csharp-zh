    ```xml

    <allow users="Chris, Erick, contoso\Jam"/>

    ```


    Note that if a domain account name is specified, then the name should have both
    the username and the domain (hence, `contoso\Jam`).


    Below is another example that will allow users to perform HTTP GET for a certain
    resource, but only the name `Chris` will be allowed to perform POST.


    ```xml

    <authorization>

    <allow verbs="GET" users="*"/>

    <allow verbs="POST" users="Kim"/>

    <deny verbs="POST" users="*"/>

    </authorization>

    ```


    There are also rules that apply here. First, the rules contained in the application-level
    configuration files will take precedence over any inherited rules. The system
    will determine which rule will take precedence through the construction of a combined
    list of all the rules for a URL, including the most recent rules (or those nearest
    in the hierarchy) towards the head of this list.


    Also, given a set of combined rules for the app, `ASP.NET` will start at the head
    of the list and will check the rules until it finds the first match. The default
    config of the `ASP.NET` will contain an element `<allow users="*">` which will
    authorize all users, though this is also applied last. If no other rules will
    match, then the request will be allowed. On the other hand, if the match found
    is a “deny” rule, then the request will return the `401` HTTP status code. Of
    course, a matching “allow” element will let the request proceed.


    Within the config file, the `location` element can also be created to specify
    a particular directory or file that will be the object of the settings of the
    `location` element.


    # Chapter 15: General Security Practices for ASP.NET


    There are sometimes when new programmers attempt to secure their apps with elaborate
    measures, but fail to cover the simplest ways malicious attackers can get into
    their system. The following tips will prove not only easy but also effective in
    maintaining the integrity of your `ASP.NET` application.


    1. Aside from backing up often, make sure that the backup devices are physically
    stored in a secure place.

    2. Keep the Web server PC secured as well so that it cannot be accessed in any
    way by unauthorized users.

    3. Use the `NTFS` file system instead of `FAT32`. The Windows file system can
    offer more security than its counterparts.

    4. Secure not just the web server but also all the other computers in your network
    with strong passwords. If possible, use a different password for each one.

    5. Secure your `IIS`.

    6. Close off any unused ports and turn off any services that are not being used.

    7. Use an anti-virus app that offers real-time monitoring of inbound and outbound
    traffic.

    8. Establish and enforce policies forbidding the users from writing down their
    passwords in easy-to-find locations.

    9. Use firewalls. Microsoft offers advice and guidelines on the different types
    of firewalls that should be sued for different systems and applications.

    10. Always install security patches from Microsoft and third-part vendors. Microsoft’s
    site has a list of all the latest security updates and other safety bulletins.

    11. Utilize the event logging features of Windows, and check the logs regularly
    to ensure that suspicious activity can be detected as soon as possible. Any repetitive
    attempts to log onto the system and abnormally high numbers of requests against
    the server should raise a red flag.


    ## Running Applications with Minimal Privileges


    When the apps run, they run within a context of specific privileges on the local
    device and also possibly on the remote computers. In order to run with the least
    possible of these privileges, make sure not to run your app with the administrator
    (system user) identity. Always set permissions (`ACLs`) on the resources required
    for the application using the least permissive settings. As an example, if it
    will not cause your app to malfunction, set all files to read-only.


    Also, keep all the files of the app in a folder located below the root. Never
    allow your users an option to specify the path for the access of any file. This
    technique will help prevent users from getting to the server’s root.


    ## Knowing your Users


    For most apps available online, users can access the site without the need to
    provide credentials. If this is the case, your app accesses the resources it needs
    by running as a predefined user. On Windows `2000` or `XP`, this is defaulted
    to the local `ASPNET` user context (for later versions, it is the `NETWORK SERVICE`)
    on the server PC.


    If your app is in an intranet, restrict the access to authenticated users by configuring
    the app to use the `Windows Integrated Security`. This way, the logon credentials
    of the user can be used to access resources. This is also called impersonation.


    If you will need to gather the credentials from the user, use one of the authentication
    strategies described above.


    ## Guarding Against Malicious Input


    To be safe, assume the general rule that the input you receive from the users
    is never safe. It will be very easy for malicious users to send dangerous information
    from the client facing them to the app itself. To guard against this eventuality,
    make sure to follow the following guidelines:


    1. In the Web Pages, make sure to check for HTML tags by filtering the user input.
    Such tags can contain malicious scripts.

    2. Never display or echo the unfiltered input. Before displaying this, process
    the HTML to turn the scripts into strings for display.

    3. If you want to accept HTML as a user input, make sure to filter it manually.
    This will let you define what part of the input will be accepted. This is better
    than creating a filter that explicitly tried to filter the malicious code, as
    it will be practically impossible to make sure that all eventualities are anticipated
    and taken care of.

    4. Never assume that the information coming from the HTTP request header is safe.
    This is in the `HttpRequest` object. Apply safeguards for cookies, query strings,
    and the like. Beware of any information that the browser will report to the server,
    as this can be spoofed when that can be important to the application.

    5. If at all possible, never store the sensitive information somewhere that can
    be accessed from the browser. This can include cookies and hidden fields. As an
    example, never store passwords in cookies.


    The view state will be stored in an encoded format, in a hidden field. By default,
    this will include a message authentication code or `MAC`, which allows the page
    to determine whether the view state has been tampered with. If a sensitive information
    is stored in the view state, you should encrypt it by setting the `ViewStateEncryptionMode`
    to `true`.


    ## Accessing the Databases Securely


    Usually, the databases have their own level of security. This is an important
    aspect of secure web applications, including the designing of a way for the app
    to securely access the database.


    To ensure this, make sure that the inherent database security is accessible only
    to limited people. The strategy can change according to your application. For
    example, if it will not cause your app to fail, you can use integrated security
    so users who are `Windows`-authenticated` access the database. This is more secure
    than passing the credentials to the database. On the other hand, if the app involves
    allowing users to access it anonymously, then creating a single user with minimal
    permissions and doing queries while connected as this user can help check.


    Also, remember not to create SQL statements through concatenated strings involving
    user input. Create instead a parameterized query and use the aforementioned user
    input to set the parameter values.


    If a username and password must be stored somewhere for use as credentials for
    database login, store them within the `web.config` file. Encrypt this in turn
    with protected configuration.

