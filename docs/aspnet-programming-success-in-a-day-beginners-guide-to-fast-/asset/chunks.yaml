    }\n```\n\n## 第 14 章：ASP.NET 安全\n\n### 安全工作原理\n\n在创建应用程序之后，你必须确保你的网站是安全的。对于 Web\
    \ 开发人员来说这是一个常见的复杂问题，尤其是因为今天的互联网格局充满了漏洞，等待着意图不纯的人去利用。网站的保护需要制定周密的计划，程序员或管理员需要对保护网站所需的选项有清晰的理解。\n\
    \nASP.NET 系统与微软的 `.NET` 框架以及 `IIS`（互联网信息服务）协同工作，帮助提供 Web 安全。这意味着程序员或管理员也可以访问框架内置的安全。这包括代码访问安全以及基于角色的安全。`IIS`\
    \ 还可以根据用户的 IP 地址或主机名授予或撤销访问。进一步的授权步骤必须通过 NTFS 文件访问权限的 URL 验证来实现。\n\n在保护你的应用程序时，你需要利用\
    \ ASP.NET 安全的两个主要功能——验证（Authentication）和授权（Authorization）。\n\n### 验证\n\n验证本质上是执行的一种过程，以确保用户确实是他们所称的。应用程序将获取凭据（包括名称、密码或其他形式的标识），并根据建立的权威对其进行验证。一旦发现凭据有效，提交这些凭据的实体（用户、计算机）将被视为“已验证”。\n\
    \n一旦通过验证，将会检查该实体对特定资源的访问权限。在 ASP.NET 中，验证通过使用身份提供程序来实现，这些代码模块包含必要的代码来验证访问访问请求者的凭据。\n\
    \n其中主要是 `Windows Authentication`（Windows 身份验证）提供程序，它将 `IIS` 提供的身份视为应用程序中已验证的用户。默认情况下，`IIS`\
    \ 将提供多种验证方法，例如 Windows 集成（NTLM）验证、匿名验证、Windows 集成（Kerberos）验证、摘要验证（Digest authentication）、基本（或\
    \ Base64 编码）验证，甚至基于客户端证书的验证。\n\n另一方面，还有某些形式的身份提供程序，允许所有者通过名称和密码验证用户，这些信息是通过程序员创建的登录表单提交的。未通过上述方式验证的请求将重定向到此登录页面，用户在那里通过表单提交信息。一旦应用程序验证了请求，系统将颁发密钥（通过票据），为后续请求建立身份。\n\
    \n### 授权\n\n另一方面，授权是一个限制授予（或拒绝）给特定用户的访问权限的过程，这与其作为已验证权威实体的权限相符。\n\n还有两种执行授权的方法。第一种是文件授权，使用\
    \ `FileAuthorizationModule`（文件授权模块）执行。它将检查处理程序文件（`.aspx` 或 `.asmx`）的 `ACL`（访问控制列表），以确定用户是否应该获得该文件的访问权限。`ACL`\
    \ 权限也决定了这一点。\n\n还有 URL 授权，通过 `UrlAuthorizationModule`（URL 授权模块）执行。它将用户和角色映射到 ASP.NET\
    \ 应用程序中的不同 URL。该模块可以用于根据不同角色选择性允许或拒绝人员访问应用程序的任意部分（通常是目录）。\n\n通过 URL 授权功能，管理员可以根据预定义的角色或通过将此访问分配给用户名，显式允许或阻止用户访问目录中的特定位置。为目录建立的权限将被子目录继承，除非单独的子目录配置覆盖了它们。\n\
    \n除非子目录配置覆盖了权限，否则管理员可以显式允许或阻止用户访问目录中的特定位置。\n\n以下是授权部分代码的语法：\n\n```xml\n<authorization>\n\
    <allow|deny] users role />\n</authorization>\n```\n\n在上述代码中，允许或拒绝部分是必须的。程序员需要指定角色或用户属性；虽然不需要一次性指定两者，但也可以这样做。同样，`verbs`\
    \ 属性是可选的。\n\n显而易见，放置允许或拒绝元素将授予或撤销访问。每个元素都支持其余属性。用户将针对账户或身份。在这种情况下，匿名用户将使用问号进行标识。所有已验证的用户可以通过星号指定。角色将用于识别特定请求的\
    \ `RolePrincipal` 对象，该请求将被允许或拒绝访问资源。最后，动词将定义适用于操作的 HTTP 动词。这包括 `get`、`head` 和\
    \ `pos`。默认是星号，表示所有动词。\n\n下面的示例授予名为“Chris”的身份以及 Admin 角色的成员访问权限。该代码还将拒绝“Erick”（除非该身份包含在管理员组中）以及所有匿名用户的访问。\n\
    \n```xml\n<authorization>\n<allow users=\"Chris”/>\n<allow roles=\"Admins” />\n\
    <deny users=\"Erick”/>\n<deny users=\"?”/>\n</authorization>\n```\n\n另一方面，以下代码展示了如何允许\
    \ Erick 访问系统并向其他人拒绝相同的访问。\n\n```xml\n<authorization>\n<allow users=\"Erick”/>\n\
    <deny users=\"*”/>\n</authorization>\n```\n\n对于角色和用户属性，可以通过逗号分隔的列表指定多个实体。以下是一个示例：\n\
