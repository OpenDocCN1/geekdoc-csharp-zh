    # Page 对象属性


    - `IsPost`: 当客户端使用的数据传输方法恰好为 `POST` 时，此属性返回 true。

    - `Layout`: 用于设置或获取布局页的位置。

    - `Page`: 提供对在布局页和其他页面之间共享的数据的访问（类属性的访问）。

    - `Request`: 获取 `HttpRequest` 对象并将其传递到现有的 HTTP 请求中。

    - `Server`: 获取 `HttpServerUtility` 对象，提供网页处理的方法。


    ## 对象的 Page 属性


    页面对象的 `page` 属性将提供对在布局页与其他内容页面之间共享的数据进行类属性的访问。程序员可以在现有的 `Page` 属性上添加自己的属性：


    - `Page.Version`

    - `Page.Title`

    - `Page.<在此处插入任何内容>`


    此属性可能非常有帮助——例如，它允许程序员在内容文件中创建页面标题，供布局文件使用。以下是它在示例的“Home.cshtml”页面中的显示方式：


    ![](img/00012.jpeg)


    相比之下，这是它在示例的“Layout.cshtml”网站中看起来的样式：


    ![](img/00013.jpeg)


    # 第 8 章：使用文本文件的 ASP.NET


    程序员有时需要访问存储在文本文件中的数据。这些文件（也用于存储信息）通常也被称为“平文件”。常见的平文件格式包括 `.xml`、`.txt` 和逗号分隔值（`.csv`）。


    ## 显示来自文本文件的数据


    文本文件通常出现在 `App_Data` 文件夹中（因此，如果你想亲自尝试以下示例，则需要创建一个）。假设你有一个名为“Authors.txt”的新文档，其内容如下：


    ```

    Doyle, Arthur Conan

    Christie, Agatha

    Leblanc, Maurice

    ```


    此示例将展示如何从此文本文件中显示数据：


    在此示例中，使用 `Server.MapPath` 来查找文本的的确切文件路径。然后，`File.ReadAllLines` 将打开文本并将并将中的所有行读取到数组中。对于这些数组
    `datalines` 中的每个 `dataItem`，将显示该数据。


    ## 显示来自 Excel 的


    使用 Microsoft Excel，程序员可以将电子表格保存为 `.csv` 文件。一旦完成，电子表格中的每一行将被保存并被视为文本行。每列之间将用逗号分隔，每行将被保存为文本行。


    与上述相同的指令可以读取 Excel `.csv` 文档——你只需要将文件名更改为相应的名称。


    ![](img/00014.jpeg)


    # 第 9 章：从数据库显示信息


    使用 Web Pages，程序员将能够轻松地从数据库显示信息。程序员能够连接到任何现有的数据库，尽管该数据库可以从零创建。如下例所示，我们将尝试与现有的 SQL
    Server Compact 数据库建立接口。


    ## 创建客户页面


    在你的文件夹中，假设一个新文件名为“Items.cshtml”。你可以尝试使用下面的代码来替换你现有的代码：


    ![](img/00015.jpeg)


    此示例使用了 `Database.Open(name)` 技术，它通过两个步骤连接到数据库：


    1. 它将在应用程序的 `App_Data` 中搜索与 `name` 参数中指定的内容匹配的数据库（文件扩展名除外）。

    2. 如果未找到文件，它将在应用程序的 `Web.config` 文件中查找连接字符串。（连接字符串是显示连接数据库的信息。这可能包括任何 SQL 数据库的名称，以及完整的用户名和密码，或文件路径）。


    这种两步方法允许程序员使用数据库测试应用程序，还可以通过连接字符串在网络主机上执行运行应用程序。


    # 第 10 章：ASP.NET 辅助工具


    在 ASP.NET 中，程序员可以利用辅助工具（helpers），这些组件可以通过单行 Razor 代码轻松访问。除了内置的 ASP.NET 辅助工具外，还可以通过
    Razor 语法以 DIY 的方式构建它们，然后将它们存储为 `.cshtml` 文件。


    以下是一些实用辅助工具的列表：


    - **WebGrid 助手**: 它可以简化数据显示，自动设置 HTML 表格并支持不同的格式选项。除了这些，它还可以支持对数据进行分页以及通过点击表头进行排序。

    - **Chart 助手**: 它可以显示不同类型的图表图像，具有不同的格式选项和标签。它还可以显示来自数据库、数组或文件的数据。

    - **WebMail 助手**: 它将提供使用简单邮件传输协议（SMTP）通过电子邮件发送消息的功能。

    - **WebImage 助手**: 此辅助工具可以提供管理页面中图像的功能。你还可以使用如水印（watermark）、调整大小（resize）、旋转（rotate）和翻转（flip）等特定关键字。


    除了上述内容外，用户还可以利用第三方辅助工具来简化多媒体、社交网络和其他组件，包括安全和导航。


    这些辅助工具还可以通过 `WebMatrix` 轻松安装。只需打开 Site 工作区，点击 Web Pages 管理（Web Pages Administration），登录，并使用搜索字段查找你所需的辅助工具。


    # 第 11 章：ASP.NET 调试


    在任何平台上创建的任何应用程序即使已经发布，也可能包含无数错误。虽然编译可以可靠地排除许多语法错误，但某些类型的 bug 需要程序员通过调试过程。这是在运行时检查代码以便进行验证的方法。


    随 ASP.NET 一同提供的 Windows SDK（软件开发包）包含一个视觉调试器（Visual Debugger），允许程序员查看应用程序运行的情况。该工具是
    `DbgCLR.exe`，可以在 `DuiDebug` 文件夹中找到。该调试器通过附加到运行页面的进程来使用。


    如果你使用的是 Internet Information Services 5.0 和 5.1 版本，或者以 5.0 应用程序模式运行的 ISS 6.0，那么附加视觉调试器的进程是
    `Aspnet_wp.exe`，即 ASP.NET 的工作进程。然而，如果你在工作进程隔离模式下运行版本 6.0 的 ISS，则将调试器附加到 `W3wp.exe`
    或线程池进程。


    一旦调试器附加到特定进程，该进程中发生的一切切都是可见的。在此基础上，调试器还将进程中执行的指令映射回原始代码。视觉调试器具有三个主要功能来帮助你调试应用程序：


    - **断点（Breakpoints）**: 这些是代码中调试器将发送信号以让应用程序停止的地方。这将允许你查看该点的应用程序状态，然后逐行执行。

    - **单步（Stepping）**: “逐行执行”代码仅仅是逐行运行代码。为了让体验更友好，视觉调试器具有一些迭代器，允许程序员指定在达到另一个停止点之前循环运行次数。

    - **数据查看（Data Viewing）**: 调试器对于在应用程序运行时对数据的跟踪和查看提供了不同的选项。一旦应用程序在断点停止，可以对数据进行修改，然后可以使用修改后的数据再次运行应用程序。


