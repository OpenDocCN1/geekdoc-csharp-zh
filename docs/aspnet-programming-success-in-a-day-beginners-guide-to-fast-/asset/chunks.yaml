    首先，对于远程调试，远程和本地计算机都应该处于域或工作组设置中。为了调试工作进程（worker process），程序员必须拥有执行该操作的权限。默认情况下，ASP.NET
    应用程序将以 `ASPNET` 用户身份运行。如果工作进程是 `ASPNET` 或 `NETWORK SERVICE`，则程序员必须拥有管理员权限才能进行调试。


    工作进程的名称可能会根据调试场景和 `IIS` 的版本而变化。工作进程运行的用户账户可以通过修改 `machine.config` 文件来更改。该文件位于运行
    `IIS` 的服务器上。实现此操作的最佳方法是使用 `IIS Manager`。工作进程也可以更改为在您的用户账户下运行，在这种情况下，程序员不需要是服务器管理员即可执行所需操作。


    请记住，在更改工作进程以便在不同的账户下运行之前，始终存在 ASP.NET 工作进程在新的账户下可能被黑客攻击的可能性。`NETWORK SERVICE`
    和 `ASPNET` 账户可以最小权限运行，从而减少进程被黑客攻击时可能遭受的损害。切换到具有更高权限的账户可能会增加潜在损害。


    ## 为 Web 应用程序配置调试


    为了启用 ASP.NET Web 应用程序的调试，必须配置应用程序能够编译为“调试构建（debug build）”。此构建包含了调试器所需的数据，以便它可以逐行通过代码并显示其中的变量。Web
    可以在其 `Web.config` 文件的编译（Compilation）部分配置为使用调试构建。如果您想调试单个页面，可以在相关页面的 `@ Page` 指令中添加
    `debug=true` 行。


    请记住，任何编译为调试构建的应用程序，其运行速度都可能比零售版本（retail build）慢得多。在将应用程序部署到市场之前，请确保关闭调试模式。调试模式还会在错误发生后导致堆栈中暴露更多信息，这可能意味着产品存在安全问题。


    ## 远程调试与本地调试


    在本地运行的 Web 服务器（如 `IIS`）允许您调试在您的计算机上本地运行的应用程序。这些页面可以在浏览器中查看。


    然而，当页面由于无法运行 Web 服务器（或简单是因为应用程序本地不可）而无法本地运行时，就可以进行远程调试。为了实现这一点，必须在远程服务器上安装 `Visual
    Studio` 的远程调试组件。


    ## 调试权限


    调试过程所需的权限比简单运行相同的应用程序更多。除了为调试保护应用程序中的配置外，还必须确保有足够的权限允许调试器附加（attaching）到相关进程。用户将权限调试以其凭据运行的本地进程，但他们无法访问其他用户的进程进行调试。另一方面，管理员可以访问并调试任何用户的进程。


    当您在远程服务器上进行调试时也是如此，因为您需要运行进程的计算机的管理员权限。


    ## 客户端脚本调试


    除了服务器端进行的应用程序调试外，Visual 调试器还允许您调试客户端脚本，只要它是用 JavaScript (ECMAScript) 或 VBScript
    编写的。当程序员使用带有客户端脚本的 Web 服务器控件时，此功能将特别有用用。


    ## 调试已部署的 Web 应用程序


    您可能需要调试已经在生产服务器上运行的 Web 应用程序。这是可能的，但应该谨慎进行。假设您已附加了 ASP.NET 的工作进程进行调试，并且触发了断点。这将导致工作进程中的所有托管代码停止。停止这些托管代码反过来可能会导致特定服务器上所有用户的工作停止。如果您决定在生产服务器上进行调试，理解其对生产的影响是非常重要的。


    除了将调试器添加到相关的 ASP.NET 工作进程外，请双检查 Visual 调试器是否获得了访问应用程序符号（symbols）的权限。还需要找到并打开应用程序源文件。


    许多 ASP.NET 应用程序会引用包含业务逻辑或其他有用代码的 `DLLs`。这些引用会自动将 `DLLs` 从本地计算机复制到 Web 应用程序虚拟目录下的
    `\bin` 文件夹。调试时，请记住应用程序将引用此副本，而不是计算机上的本地副本。


    将工作进程附加到调试器的方法与其他远程进程的方法相同。当附加成功时，如果没有打开正确的项目，当应用程序到达断点时，您将看到一个对话框。该框将要求提供源文件的位置。在此框中指定的文件名必须与服务器调试符号中指定的文件名相同。


    ## 为 ASP.NET Web 应用程序启用调试


    要启用调试选项，必须在项目属性（Project Properties）菜单和应用程序的 Web 配置文件中同时启用。请注意，您看到的命令和对话框可能与帮助文档中列出的不同，取决于软件版本或您的当前设置。可以通过在工具（Tools）菜单中选择“导入和导出（Import
    and Export）”更改设置。


    ### 在项目属性中启用


    1. 转到解决方案资源管理器（Solution Explorer）并右键点击项目名称。从选项中，选择“属性（Properties）”。

    2. 在属性菜单下，点击标记为“Web”的选项卡。

    3. 从调试器选项中选择 ASP.NET。


    ### 使用 web.config 文件启用


    1. 使用任何 XML 解析器或 Web 编辑打开 `web.config`。注意，无法通过 浏览器远程访问它。默认情况下，Microsoft IIS 的配置是防止浏览器直接访问
    `Web.config` 文件。这是出于安全考虑。通过浏览器访问配置文件将导致产生“访问被禁止 (403 Forbidden)”。

    2. 由于配置文件是用 XML 编写的，它包含使用标记标记的嵌套部分。找到 `configuration/system.web/compilation` 元素。如果该元素不存在，您必须手动创建它。

    3. 如果上述元素没有 debug 属性，则也必须手动添加。

    4. 确保在添加 debug 属性后，将其值更改为“true”。


    以下是 Web 配置文件的样式示例：


    ```xml

    <configuration>

    ...

    <system.web>

    <compilation Debug="true"

    ...

    >

    </compilation>

    </system.web>

    </configuration>

    ```


    ## 健壮编程


    编程语言将自动检测对配置文件的所有更改，这些更改将自动应用到设置中。因此，程序员不再需要重启 IIS 服务器或计算机即可使更改生效。


    ASP.NET 的另一个优点是它会继承来自 URL 层级结构中较高位置的配置文件的设置。这特别有用，因为一个站点可以包含多个虚拟存储的目录和子目录，每个目录都可能包含一个
    `web.config` 文件。然而，如果在层级结构较低的任何文件中设置了 debug，则高层级的 debug 值将被覆盖。


