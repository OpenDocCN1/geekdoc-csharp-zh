  trans: "\n\n除了系统信息等内容，你可能还有一些希望保持私密的信息。任何此类信息都应被视为“敏感”信息。这些信息的范围可能从密码、加密密钥到你应用程序的注释等。如果任何人获取了这些信息，你的应用程序可能会被破坏。\n\
    \n如果应用程序在服务器和浏览器之间传输任何敏感信息，请考虑使用 `SSL`（安全套接层）。微软知识库对此提供了大量相关信息。\n\n你还可以使用某种形式的保护性配置来保护这些信息。确保不要将这些信息存储在网页中，即使是以任何形式（例如服务器代码），只要这些形式是你你不希望让别人看到的。\n\
    \n在 `System.Security.Cryptography` 命名空间中，提供了强力的加密算法。你也可以利用这些算法来优势。\n\n## 安全地使用\
    \ Cookies\n\nCookies 对于保持用户特定数据可用非常有用。然而，因为它们也会发送到运行浏览器的计算机上，它们可能会被伪造或用于其他恶意手段。记住，永远不要在这些\
    \ Cookie 中安装任何关键信息（如密码），即使是暂时的。根据经验法则，Cookie 中任何可能损害应用程序的内容从根本就不应该放在 Cookie 中。与其存储信息本身，不如在\
    \ Cookie 中保留一个指向该数据服务器位置的引用。\n\n同时记住为 Cookie 设置过期日期。这些日期应设在实际可行的最短时间内。如果不会破坏应用程序，请永远不要使用永久性\
    \ Cookie。作为额外措施，考虑对 Cookie 中的信息进行加密。将 Cookie 的 `HttpOnly` 和 `Secure` 属性设置为值“true”也会很有帮助。\n\
    \n## 防御 DDOS\n\nDDOS 或拒绝服务（Denial of Service）是一种恶意攻击，使你的系统无法供他人使用。这是通过请求过载你的服务器来实现的，使其过度繁忙。在坏的情况下，这可能会导致应用程序崩溃。\n\
    \n你可以使用不同的错误处理技术，如 `try-catch`。如上述，你可以使用 `finally` 块，以便在应用程序失败时释放资源。\n\n还可以为 `IIS`\
    \ 配置进程节流（Process throttling），防止程序占用 CPU 时间。在使用或存储用户输入之前，可以对其进行大小限制的测试。还可以对查询设置安全防护措施——例如，在\
    \ `ASP.NET` 网页显示查询结果之前，你应该先确保记录的数量不是不合理的。\n\n对允许的上传大小设置限制也应该是应用程序的一部分。可以使用以下语法（以千字节为单位更改\
    \ `maxRequestLength`）：\n\n```xml\n<configuration>\n  <system.web>\n    <httpRuntime\
    \ maxRequestLength=\"4096\" />\n  </system.web>\n</configuration>\n```\n\n`RequestLengthDiskThreshold`\
    \ 属性也可以用于减少大型论坛帖子和上传的（内存）开销。\n\n除了本章遇到的不同风险外，你还应该熟悉其他应用程序安全威胁，以便能够明智地防御它们。记住，安全技术只是整体解决方案的一部分。\n\
    \n以下是四种较为常见但防御较弱的威胁：\n\n1.  **否认（Repudiation）**。这是一种威胁，涉及以某种方式进行交易，导致事后没有证明真实参与者的证据。这可能意味着冒用无辜用户的凭据。为了防止这种现象，你需要建立严格的身份验证机制。\n\
    2.  **权限提升（Elevation of privilege）**。这是一种利用恶意手段获取比通常分配更多的权限的攻击。一个很好的例子是用户能够获得管理权限，从而让该用户访问服务器上的所有数据。这还可以让用户获得对服务器功能的控制权。如之前讨论，最小权限上下文中（Minimal\
    \ privilege context）是应对此类攻击的有效手段。\n3.  **篡改（Tampering）**。这种攻击指的是在没有适当授权的情况下删除资源。一个例子是网页的篡改，用户进入网站并更改了其中的文件。脚本利用是此类攻击的常见媒介。如上所述，这些脚本可以通过输入字段进入你的应用程序。\n\
    4.  **信息泄露（Information Disclosure）**。这简单来说就是窃取和/或公开本应安全私密的信息。一个非常常见的例子是窃取密码等登录凭据，尽管这可以到整个系统中的任何类型文件。防止这种情况发生的良好方法是从根源上避免存储密码和其他信息。加密技术（如存储哈希值）极大有助于确保信息即使被盗取，对黑客来说也完全无用。\n\
    \n## 结论\n\n再次感谢下载这本书！\n\n我希望这本书帮助你掌握基础 `ASP.NET` 编程的门径。\n\n下一步是实际上开始编写你的 `ASP.NET`\
    \ 页面！记住，这本书只处理了入门阶段。`ASP.NET` 下有许多不同的主题，就像任何其他编程语言一样。确保努力学习和实践，这样你就能通向创作你的 `ASP.NET`\
    \ 杰作之之路！\n\n最后，如果你喜欢这本书，请花时间分享你的想法并在 Amazon 上发表评论。我们尽力接触读者并提供我们能提供的最大价值。你的好评将帮助我们实现目标。不胜感激！\n\
    \n感谢并祝你好运！\n\n![thank-you](img/00016.jpeg)\n\n# 《一天学会 Android 编程！Android 应用程序编程初者的力量指南》预览\n\
    \n### 第一章：准备\n\nAndroid 应用程序开发并非易事。你必须在程序开发方面拥有良好的背景。如果你熟悉 Visual Basic 和 Java，将是一个加分项。如果你使用过\
    \ `Eclipse` IDE（集成开发环境），那绝对将是一个巨大的优势。此外，熟悉 `XML` 将对你有帮助。\n\n在开始开发之前，你需要几样东西。\n\
    \n首先，你需要一台高端计算机。通常，其他程序开发工具包不需要强大的计算机来创建应用程序。然而，为 Android 创建程序略有不同。你需要更多的计算能力来运行模拟器，模拟器是允许你在计算机中测试程序的程序。\n\
    \n使用没有良好处理器和大量内存（RAM）的弱电脑会让运行那些模拟器变得困难。如果你能够运行它，它也会运行非常缓慢。\n\n其次，你需要一个 Android\
    \ 设备。该设备将成为你的 Beta 测试机。通过它，你将知道程序在 Android 设备上的表现如何。在选择测试设备时，确保它与你应用目标市场的设备相当。如果你针对平板电脑用户，请使用平板电脑。如果你针对智能手机用户，请使用智能手机。\n\
    \n第三，你需要 Google 的 `Android SDK`（软件开发工具包）。SDK 是一允许你创建和编译程序代码的文件和程序。截至此时，最新的 `Android\
    \ SDK` 文件大小约为 350MB。下载它需要你 15 到 30 分钟。如果你解压缩 `Android SDK` 文件，它将占用你计算机大约 450MB\
    \ 的磁盘空间。下载页面链接为：http://developer.android.com/sdk/index.html\n\nSDK 可以运行在 Windows\
    \ XP、Windows 7、Mac OSX 10.8.5（更高版本）以及可以运行 32 位应用程序且 `glibc`（GNU C 库）版本为 2.11 或更高的\
    \ Linux 发行版上。\n\n"
