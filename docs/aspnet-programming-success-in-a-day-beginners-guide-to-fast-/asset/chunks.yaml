    # Chapter 4: Folders


    In the ASP.NET system, there are two different types of folder structures: logical
    and physical. Below is a set of folders that make up the typical logical folder
    structure:


    ● `Account`. This folder contains all the logon and security files.

    ● `App_Data`. This contains all the databases, as well as the data files.

    ● `Images`. This folder contains the different images for your page.

    ● `Scripts`. These contain the different browser scripts.

    ● `Shared`. This folder has all the common files, such as the layout and the style
    files.


    Aside from the logical folder structure which is on your server, there is also
    the physical location that is on your computer. This should appear familiar:


    `C:\YourName\Documents\MyWeb\Sample\Images`


    ## Virtual versus Physical Names


    It is important to distinguish whether the name of a certain item is virtual or
    physical -- but it’s very easy since they just follow the names of the logical/physical
    folders. For example, a sample image’s virtual name may simply be “Images\sample.png”,
    while its physical counterpart is `C:\YourName\Documents\MyWeb\Sample\Images\sample.png`.


    ## Paths and URLS


    We know that URLs (Universal Resource Locators) are used to gain access to files
    and pages from the Web. An example is `http://www.yoursite.com/sample/page.aspx`.
    However, this corresponds to physical data on the server computer, which is basically
    just like the physical name in the above section. This is called a “path”. The
    virtual path is made as a shortcut in order to represent the lengthy names of
    these physical paths. This virtual path is what appears after the “.com” in the
    above URL: `/sample/page.aspx`.


    While coding ASP.NET, you will need to make a reference to both the virtual and
    the physical path, depending on the material is being coded.


    ASP.NET provides three different tools for easily working with these folder paths,
    which will be discussed below:


    ### ~ Operator


    This specifies the virtual root within the programming code. Using the `~` operator
    and not the root path will allow you to move the page or site to a different location
    or folder without changing the code. Below is an example:


    ![](images/00006.jpeg)


    ### Server.MapPath


    This method converts the virtual path (let’s say, `/sample.cshtml`) into a physical
    one that can be understood by the server (`C:\YourName\Documents\MyWeb\Sample\sample.cshtml`).


    This method is used when one needs to open the files found on the site’s server.
    It is to be remembered that one can only access data files using a full physical
    path. An example is shown below:


    ![](images/00007.jpeg)


    The next chapter will discuss more about reading and writing data files.


    ### Href


    Inherently, the browser cannot understand the `~` operator we have discussed earlier
    (it is restricted to ASP.NET use only). The `Href` method can remedy this weakness
    by converting a path that has been used in the lines of code to a certain path
    that can be understood by the browser.


    The `Href` style can be used to map out paths to resources such as CSS files and
    image files. You will use this method frequently in HTML `<img>`, `<link>`, and
    `<a>` elements. An example is the code below:


    ![](images/00008.jpeg)


    # Chapter 5: Global Pages


    ## Before the Web Startup: _AppStart


    Most of the server side codes are written inside the individual web pages. As
    an example, if a certain page contains any input form, the web page will usually
    contain server code meant for reading the data.


    However, when the programmer creates a page named `_AppStart` in the site’s root
    directory, the startup code can then be executed even before the site starts.
    If such a page exists, ASP.NET would run it first when any page in the site is
    requested.


    A typical way the `_AppStart` is used is for startup code and the initialization
    of global values such as global names and counters.


    Note that `_AppStart` should be similar in terms of file extension to the rest
    of the pages, such as `_AppStart.cshtml` or `_AppStart.vbhtml`. Also, note the
    underscore prefix in `_AppStart`. Affixing the underscore to any page will mean
    that the files contained cannot be directly browsed. This is good since the `_AppStart`
    folder usually contains sensitive information.


    ## Before Each Page: _PageStart


    In the same way that `_AppStart` runs even before the site starts, you can also
    create code that can run even before any page in the folder. For every folder
    in your site, you can add a file called `_PageStart`.


    The common use of `_PageStart` is setting the layout page for each page in the
    folder. It can also be used to check that a user is logged in before a page is
    ran.


    Basically, when a request for the site and its pages come in, ASP.NET will check
    whether `_AppStart` exists. If this is the case and the current request is the
    first one, `_AppStart` will run.


    Then ASP.NET will check whether the `_PageStart` document exists. If this is the
    case, it runs before the page that was requested. If a call to `RunPage()` inside
    `_PageStart` is included, the programmer can specify where the page will run.


    # Chapter 6: HTML Forms


    Like in any other programming language, the form is that place where the programmer
    can put input controls such as radio buttons, check boxes, text boxes, and even
    drop-down lists. Below is an example of how to do it, using Razor.


    ## Displaying Images


    You can also use Razor in the input field to dynamically display images according
    to the user’s input.


    For example, you would like to use an image named `sample.png` in the image folder.
    The image can be displayed using the HTML <img> element such as:


    ```html

    <img src="images/sample.png" alt="Sample" />

    ```


    However, if you have three pictures that should be displayed according to the
    user’s options, you can use the following Razor code:


    ![](images/00009.jpeg)


    In this example, the server initially forms a variable named `imagePath`. Then,
    the HTML points to an input method (the `<select>` element) called `Choice`. This
    allows the programmer to select a more browser-friendly name (such as “Photo 1”),
    then relays a file name (such as “sample.png”) once the page is submitted.


    The code will then read the choice’s value by `Request["Choice"]`. Once it finds
    there is a value, the code will construct a path to the file and store this variable
    in `imagePath`.


    In any HTML page with an image, an `<img>` tag is used. The `src` code is then
    made to correspond to the value of this `imagePath` once the page loads.


    Finally, the `<img>` element is placed within an `if` block to stop it from attempting
    to display a nameless image.


    # Chapter 7: Objects


    Up until this point, you have used a few Page Object methods being used. Initially,
    you had:


    ![](images/00010.jpeg)


    And just in the last chapter, you had these lines:


    ![](images/00011.jpeg)


    This chapter will give a better understanding of the different object-related
    codes.


    ## Page Object Methods


    ● `Href`. This creates a URL utilizing programmerspecified parameters.

    ● `RenderBody()`. This renders a portion of the content page that is outside any
    of the named sections (applicable within layout pages).

    ● `RenderPage(page)`. This will render a page’s content within a different page.

    ● `RenderSection(section)`. This will render the content of the named section
    (applicable within layout pages).

    ● `Write(object)`. This will write an object as a string (HTML encoded),

    ● `WriteLiteral`. This writes an object directly without first encoding it via
    HTML.

