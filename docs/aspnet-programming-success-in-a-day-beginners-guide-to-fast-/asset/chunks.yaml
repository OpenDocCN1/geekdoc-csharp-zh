    4. The ASP.NET framework has a rich designer and toolbox in the VisualStudio IDE.
    Drag-and-drop server controls, WYSIWYG, automatic deployment, and more are provided
    by this powerful tool.


    5. ASP.NET pages are easy to write and maintain, as the source code and HTML are
    together. The source code is also executed on the server, providing power and
    flexibility.


    6. The ASP.NET runtime manages and closely monitors the processes, so a new process
    can be created in case one process is dead. This keeps the application available
    for handling requests.


    7. Being language independent, it allows programmers to choose the languages that
    best apply to the application. The programmer can also partition the application
    across different programming languages.


    8. There is no need to register components in ASP.NET since configuration is built-in.
    This makes for easier deployment.


    9. The web server implementing ASP.NET closely monitors all pages. Any memory
    leak, infinite loop, or other illegal activity is immediately destroyed, and the
    framework restarts itself for continuity.


    10. In general, ASP.NET can counter large volumes of users without having performance
    problems.


    # Chapter 2: ASP.NET Programming


    Those who are used to programming in Classic ASP (circa 1998) need to be reminded
    that the .NET variant is new generation and is thus not compatible with legacy
    versions. However, the programming style includes elements of the original.


    Pages programmed using ASP.NET, can be distinguished by the extension `.aspx`.
    These are usually written in Visual Basic (with the file extension `.vbhtml`)
    or C# (`.cshtml`), though the user controls can be written in C++, Java, and other
    programming languages.


    When the user’s browser requests an ASP.NET file, the system’s engine reads the
    file and then compiles and executes the scripts found. The results are then returned
    to the user as plain HTML.


    ## Web Pages


    Web Pages is actually the name for one of the three programming models used for
    creating ASP.NET sites and applications (the other two being `MVC` or `Model,
    View, Controller`, and `Web Forms`). It is the simplest programming model for
    ASP.NET pages, allowing for a way to easily combine HTML, CSS, Javascript, and
    other server code. It is built around single web pages so it is easy to understand
    and use, and it also provides full control over the elements of the page.


    `MVC`, on the other hand, is a little more complicated as it is split into three:
    the `model` is the representation of the application core (like the list of records
    in a database), the `view` is the data display (such as the records themselves),
    and the `controller` is the one handling the input. Like `WebForms`, it can fully
    control HTML, CSS, and JavaScript.


    Lastly, there is the `WebForms` which is the oldest programming model in ASP.NET,
    relying on event-driven pages in a combination of server controls, server code,
    and HTML. These forms are compiled and ran on the server, which in turn will generate
    the HTML that will display the web page. Web Forms come with several (hundreds)
    different controls and other components, meant to build user-driven sites with
    access to the data.


    For simplicity, we will be tackling only Web Pages extensively in this book, as
    it represents the simplest and most straightforward way of learning ASP.NET.


    ## ASP.NET Razor


    The Razor is a new, simple markup syntax that was meant for embedding server code
    into the web pages. This setup is similar to Classic ASP. The Razor has the same
    powerful capabilities of the traditional ASP.NET (since it is based on the ASP.NET
    Framework itself), though it is significantly easier to learn and use. It can
    be easy to use for beginners, and can drastically the increase the productivity
    of experts.


    Let us suppose that we have the following HTML code for a webpage:


    ![](images/00001.jpeg)


    This page is a very simple one, and we will try adding a Razor code to it:


    ![](images/00002.jpeg)


    The part with `Date.Time` is the Razor code, which is marked by the “@” sign.
    This particular code induces the page to display the current date and time. This
    is done by having the Razor code retrieve the current time on the server. If you
    want to have other formats, this display can also be customized.


    As we mentioned before, there are two languages we can use with these pages --
    VB and C#. There are different rules when it comes to using Razor on any of these
    languages. Here are the ones for C#:


    - The blocks of Razor code should always be enclosed in `@{...}`.

    - The inline expressions (i.e. Functions and variables) should always start with
    an `@`.

    - Code statements should always end with a semicolon (`;`).

    - The `var` keyword is to be used in declaring the variables.

    - Quotation marks (“ ”) should always enclose strings.

    - Always remember that the code for C# is case-sensitive.

    - Also, remember that the `.cshtml` extension should be appended to the C# file,
    or else it would not work as intended.


    In contrast, here are the main rules for Visual Basic:


    - The blocks of Razor code should always be enclosed by `@Code...End Code`.

    - The inline expressions, like in C#, should start with the `@` sign.

    - The `Dim` keyword is used to declare variables.

    - Quotation marks (“ ”) should always enclose strings.

    - The VB code, unlike C#, is not case sensitive.

    - The extension `.vbhtml` is needed for pages done in VB for them to work properly.


    Web pages created with Razor can essentially be described as HTML web pages with
    two different kinds of content: the pure HTML (which you can immediately recognize)
    and the Razor code which is denoted by the `@` sign.


    As the page is being read by the server, the Razor code will be run first. Then,
    ASP.NET will send the HTML page to the browser. The code that the server will
    execute can do tasks that normally cannot be done in the browser, such as accessing
    the database. The code from the server will be able to create dynamic content
    on the spot, right before sending it to the browser. When the browser sees it,
    it is no different from any other static HTML content.


    Razor codes can also work with objects, which can be based off text boxes, entire
    web pages, filed and database records, or they can be self-defined among many
    other possibilities. There are also objects that have properties describing their
    characteristics.


    Like other programming languages, Razor is also capable of handling “if and else”
    conditions, as well as reading the user input. These help in the creation of dynamic
    web pages.


    # Chapter 3: Creating a Consistent Layout


    Web Pages allow a programmer to create content with a consistent look and feel.
    This means that every site has the same header and footer, and that every page
    has the same style and layout. This can be done very efficiently, since the programmer
    can have reusable content blocks (such as the aforementioned headers and footers)
    in different files. A layout template can also be used to define a consistent
    layout for all pages.


    ## Content Blocks


    Using Web Pages, the programmer can use the `@RenderPage() ` system to import
    the consistent content from separate files. The content block, which is from another
    file, can be imported to anywhere within the page. This can contain text, code,
    and markup just like any other regular webpage.


    This saves you a lot of work since you will not have to write the same content
    in each page. When you change one of the files, the update is carried over to
    all your pages. Below is an example of how this looks in code:


    ![](images/00003.jpeg)


    In this example, the files “header” and “footer” will be reflected in each page
    you make. If these files change, the revised files will then be carried over to
    the pages.


    ## Using a Layout Page


    Another approach, as mentioned a little earlier, is using a layout page. This
    contains only the structure, though it excludes the web page’s content. When a
    layout page is linked to the content itself, then the layout page or template
    will dictate the display.

