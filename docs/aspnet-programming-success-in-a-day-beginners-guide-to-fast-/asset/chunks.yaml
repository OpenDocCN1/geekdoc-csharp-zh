    4. ASP.NET 框架在 VisualStudio IDE 中拥有丰富的设计器和工具箱。这个强大的工具提供了拖放式服务器控件、WYSIWYG（所见即所得）、自动部署等更多功能。


    5. ASP.NET 页面易于编写和维护，因为源代码和 HTML 是写在一起的。源代码同样在服务器上执行，提供了强大的功能和灵活性。


    6. ASP.NET 运行时负责管理并紧密监控进程，因此当某个进程死掉时，可以创建一个新进程。这确保了应用程序始终处于可用状态，以处理请求。


    7. 由于它具有语言无关性，它允许程序员选择最适合应用程序的语言。程序员还可以将应用程序划分到不同的编程语言中。


    8. 在 ASP.NET 中不需要注册组件，因为配置是内置的。这使得部署变得更加容易。


    9. 实现 ASP.NET 的 Web 服务器会密切监控所有页面。任何内存泄漏、无限循环或其他非法活动都会被立即销毁，框架会自动重启以保持连续性。


    10. 总的来说，ASP.NET 可以应对大量用户而不会产生性能问题。


    # 第 2 章：ASP.NET 编程


    习惯于 Classic ASP（约 1998 年）进行编程的人需要被提醒，.NET 版本是新一代的，因此与旧版本不兼容。然而，其编程风格包含了原始的某些元素。


    使用 ASP.NET 编写的页面可以通过 `.aspx` 扩展名来区分。这些页面通常使用 Visual Basic（文件扩展名为 `.vbhtml`）或 C#（`.cshtml`）编写，尽管用户控件可以用
    C++、Java 和其他编程语言编写。


    当用户的浏览器请求一个 ASP.NET 文件时，系统内核引擎会读取该文件，然后编译并执行找到的脚本。结果将以纯 HTML 的形式返回给用户。


    ## Web Pages（网页模型）


    Web Pages 实际上是用于创建 ASP.NET 站点和应用程序的三种编程模型之一（另外两个是 `MVC` 或“模型-视图-控制器”，以及 `Web Forms`）。它是
    ASP.NET 页面最简单的编程模型，允许轻松地结合 HTML、CSS、Javascript 和其他服务器代码。它围绕单个网页构建，因此易于理解和使用，并且对页面元素提供完全的控制。


    另一方面，`MVC` 稍微复杂一些，因为它被分为三个部分：`model`（模型）是应用程序核心的表示（如数据库中的记录列表），`view`（视图）是数据显示（如记录本身），而
    `controller`（控制器）是处理输入的部分。像 `WebForms` 一样，它可以完全控制 HTML、CSS 和 JavaScript。


    最后是 `WebForms`，它是 ASP.NET 中最老的编程模型，依赖于服务器控件、服务器代码和 HTML 结合的事件驱动页面。这些表单在服务器上编译并运行，反过来生成显示网页的
    HTML。Web Forms 带有若干种（数百种）不同的控件和其他组件，用于构建可以访问数据的用户驱动型站点。


    为了简单起见，我们将在书中仅深入探讨 Web Pages，因为它代表了学习 ASP.NET 最简单、最直接的方式。


    ## ASP.NET Razor


    Razor 是一种新的、简单的标记语法，旨在将服务器代码嵌入到网页中。这种设置与 Classic ASP 相似。Razor 具有与传统 ASP.NET 相同的强大功能（因为它基于
    ASP.NET 框架本身），但学习和使用要容易得多。它对初学者来说很容易上手，并极大地提高专家的工作效率。


    假设我们有以下网页的 HTML 代码：


    ![](img/00001.jpeg)


    这是一个非常简单的页面，我们将尝试向其添加 Razor 代码：


    ![](img/00002.jpeg)


    带有 `Date.Time` 的部分是 Razor 代码，由“@”符号标记。这段特定代码导致页面显示当前的日期和时间。这是通过让 Razor 代码在服务器上获取当前时间来实现的。如果你想要其他格式，也可以对此显示进行自定义。


    正如我们之前提到的，这些页面可以使用两种语言——VB 和 C#。在这些的任何一种语言上使用 Razor 时，都有不同的规则。以下是针对 C# 的规则：


    - Razor 代码块应始终包括在 `@{...}` 中。

    - 内联表达式（即函数和变量）应始终以 `@` 开头。

    - 代码语句应始终以分号（`;`）结束。

    - 声明变量时应使用 `var` 关键字。

    - 引号（“ ”）应始终包含字符串。

    - 始终记住 C# 的代码是区分大小写的。

    - 此外，请记住 C# 文件应该附加 `.cshtml` 扩展名，否则它无法按预期工作。


    相比之下，这里是 Visual Basic 的主要规则：


    - Razor 代码块应始终包括在 `@Code...End Code` 中。

    - 内联表达式像 C# 一样应以 `@` 符号开头。

    - 使用 `Dim` 关键字声明变量。

    - 引号（“ ”）应始终包含字符串。

    - VB 代码与 C# 不区分大小写。

    - VB 页面需要 `.vbhtml` 扩展名才能正常工作。


    使用 Razor 创建的网页基本上可以描述为带有两种不同内容的 HTML 网页：纯 HTML（你可以立即识别出来）和由 `@` 符号标记的 Razor 代码。


    当服务器读取页面时，首先运行 Razor 代码。然后，ASP.NET 将 HTML 页面发送给浏览器。服务器执行的代码可以完成浏览器中无法完成的任务，例如访问数据库。服务器代码可以在发送到浏览器之前现场创建动态内容。


    Razor 代码还可以与对象工作，可以基于文本框、整个网页、数据库记录，或者在许多其他可能性中自定义。还有描述其特征的对象。


    与其他编程语言一样，Razor 同样能够处理“if 和 else”条件，以及读取用户输入。这些有助于动态页面的创建。


    # 第 3 章：创建一致的布局


    Web Pages 允许程序员创建具有一致外观的内容。这意味着每个站点都有相同的页头和页脚，每个页面都有相同的样式和布局。这可以非常高效地完成，因为程序员可以在不同的文件中拥有内容块（如上述页头和页脚）。布局模板也可以用于定义所有页面的一致布局。


    ## Content（内容块）


    使用 Web Pages，程序员可以使用 `@RenderPage()` 系统从单独的文件导入一致的内容。内容块来自另一个文件，可以导入到页面的任何位置。它可以包含文本、代码和标记，就像任何其他普通网页一样。


    这节省了大量工作，因为你不需要在每个页面中编写相同的内容。当你更改其中一个文件时，更新将带到你的所有页面。以下是代码形式的示例：


    ![](img/00003.jpeg)


