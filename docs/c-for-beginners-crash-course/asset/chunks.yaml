    \nArea is: 10\nTotal Pain cost is: 500\n\n# 第 13 章 运算符重载与异常处理\n\n## 13.1 运算符重载简介\n\
    \n内置运算符可以在 C# 中被重定义或重载。重载的运算符是带有 `operator` 关键字的函数。其后跟着要定义的运算符符号。重载的运算符具有返回类型和参数列表。\n\
    \n示例：\n\n| ![](img/image00305.jpeg)示例 50: |\n\n```csharp\nusing System;\nnamespace\
    \ operator1{ \n    class Room { \n        private int length; \n        private\
    \ int breadth; \n        public int getArea() { \n            return length *\
    \ breadth; \n        } \n        public void setlen (int len) {\n            length\
    \ = len; \n        } \n        public void setbread(int bread) {\n           \
    \ breadth = bread; \n        } \n        //+ operator is overloaded\n        public\
    \ static Room operator + (Room r, Room s) {\n            Room o = new Room();\
    \ \n            o.length = r.length + s.length; \n            o.breadth = r.bread\
    \ + s.bread; \n            return o; \n        } \n    } \n    class Program {\
    \ \n        public static void Main(string[] args) {\n            Room o1 = new\
    \ Room();\n            Room o2 = new Room();\n            Room o3 = new Room();\
    \ \n            int area = 0; //Room 1 specification \n            o1.setlen(10);\
    \ \n            o1.setbread(5); //Room 2 specification \n            o2.setlen(5);\
    \ \n            o2.setbread(10); //area of room 1\n            area = o1.getArea();\
    \ \n            Console.WriteLine(\"Area of Room 1 is:{0}\",area); //area of room\
    \ 2\n            area = o2.getArea(); \n            Console.WriteLine(\"Area of\
    \ Room 2 is:{0}\",area);\n            o3 = o1 + o2; \n            Console.WriteLine(\"\
    Area of Room 3 is:{0}\",area); \n            Console.Read(); \n        } \n  \
    \  } \n```\n\n当代码被编译并执行时，输出为：\n\nArea-Area of Room 1 is: 50\nArea of Room 2 is:\
    \ 50\nArea of Room 3 is: 100\n\n## 13.2 不同的运算符\n\n在 C# 中可以重载的运算符如下：\n\n| 运算符 |\
    \ 描述 |\n| :--- | :--- |\n| +, -, *, /, % | 二元运算符有两个操作数，可以重载 |\n| !, ~, ++, --\
    \ | 一元运算符有一个操作数，可以重载 |\n| &&, \\|\\| | 条件逻辑运算符（不可重载） |\n| ==, !=, <, >, <=, >=\
    \ | 比较运算符 |\n| =, new, is, typeof | 赋值运算符 |\n| +=, -=, *= /= %= |\n\n## 13.3 异常处理简介\n\
    \n异常是程序执行过程中发生的错误。当操作无法完成时，系统会抛出异常。C# 异常处理基于四个关键字：`try`、`catch`、`finally` 和 `throw`。\n\
    \n语法：\n\n```csharp\ntry\n{\n    // 引起异常的语句\n}\ncatch(ExceptionName e1)\n{\n  \
    \  // 处理代码\n}\ncatch(ExceptionName e2)\n{\n    // 处理代码\n}\ncatch(ExceptionName\
    \ eN)\n{\n    // 处理代码\n}\nfinally\n{\n    // 将执行的语句\n}\n```\n\n## 13.4 C# 中的异常类\n\
    \n有许多直接或间接派自 `System.Exception` 类的异常。派自 `System.Exception` 类的某些类是 `System.ApplicationException`\
    \ 和 `System.SystemException`。\n\n对于拥有自定义异常的用户定义应用程序，异常必须继承自 `ApplicationException`\
    \ 类。\n\n`System.SystemException` 类是所有异常的基类。\n\n| 异常类 | 描述 |\n| :--- | :--- |\n\
    | System.IO.IOException | 处理 I/O 错误 |\n| System.NullReferenceException | 在解引用空对象时生成的错误\
    \ |\n| System.IndexOutOfRangeException | 当方法引用的数组越界时生成的错误 |\n| System.DivideByZeroException\
    \ | 除以零 |\n| System.OutOfMemoryException | 内存分配错误 |\n| System.InvalidCastException\
    \ | 类型转换导致的错误 |\n| System.StackOverflowException | 堆栈溢出导致的错误 |\n\n## 13.5 异常处理\n\
    \nC# 提供了 `try` 和 `catch` 块形式的结构化解决方案。核心程序语句与错误处理语句分开。`finally` 块用于处理错误。\n\n示例：\n\
    \n| ![](img/image00305.jpeg)示例 51: |\n\n"
