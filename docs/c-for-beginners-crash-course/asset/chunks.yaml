    \ in the project gets displayed. Double click the file in the solution explorer\
    \ for opening the file.\n\nThe following figure shows the solution explorer window\
    \ in application.\n\n![](Images/image00315.jpeg)\n\n### Output window\n\nThe messages\
    \ for the status of the features of Visual Studio .NET IDE are provided by the\
    \ output window. The current status of the application is displayed when the user\
    \ compiles it. The number of errors present during compilation is displayed in\
    \ the window. The `View -> Output Window` option is used to open the window.\n\
    \nThe following figure shows the output window in Visual Studio application.\n\
    \n![](Images/image00316.jpeg)\n\n### Error List\n\nThe list of errors present\
    \ in the application is displayed in the error list window. The user can locate\
    \ errors as soon as the code is compiled. Double click the error and the source\
    \ for it is located. Click `View`, `Error List Window` option to open the error\
