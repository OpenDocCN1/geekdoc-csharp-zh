    Chapter 1 Introduction to C#


    ## 1.1 Overview of C#


    C# is an object oriented, type safe high level programming language. It has been
    developed by Microsoft during the development of the .NET framework. C# was developed
    for the Common Language Infrastructure (CLI), this infrastructure was created
    to allow programs from various other high level languages to work together without
    the need to rewrite those programs entirely. The CLI contains a various executable
    programs referred simply as executables and are housed and ran in a system called
    the runtime environment.


    All the programs created in .Net framework execute in an environment that handles
    the runtime requirements. The Common Language Runtime (CLR) provides the virtual
    machine, which helps the programmers not to consider the CPU specifications. The
    class library and CLR make the .NET framework.


    ## 1.2 Programming features of C#


    *   It is simple, advanced, object oriented language


    *   It contains data types and classes common for all the .NET languages


    *   The Common Language Runtime (CLR) is similar to the Java Virtual Machine (JVM)


    *   C# provides support for encapsulation, inheritance, polymorphism, and interfaces


    *   Visual Studio provides support to VC++, Visual Basic, Vbscript, and Jscript


    *   .NET consists of class library and common execution engine


    *   Garbage collection, automatic memory management, interoperability are inbuilt
    in C#


    *   User can develop console, windows and web applications using C#


    ## 1.3 C# Environment


    C# is a part of .NET framework. It is used for creating .NET applications. Using
    .NET framework, user can design, deploy and develop the applications. Robust applications
    can be easily built using the simple programming model.


    ### Components of .NET framework


    The .NET framework diagram containing several components is as shown:


    ![](Images/image00304.jpeg)


    The .NET framework consists of the following components:


    *   Common Language Runtime


    *   .NET framework base class library


    *   Common Language Specification


    *   User and Program interfaces


    Common Language Runtime (CLR)


    The core component of the .NET framework is the CLR. It is an environment where
    the programs are executed. The code in CLR is translated into Intermediate Language
    (IL). This IL code is then used across different platforms.


    The IL code is converted into machine language by the Just in Time (JIT) compiler.
    The complier checks for the type safety. This ensures objects are accessed in
    a compatible way.


    .NET framework class library


    The class library works with any .NET languages like VB.NET, VC# and VC++.NET.
    The library provides classes used in the code for performing different programming
    tasks like data collection, string management, file access and connecting to the
    database.


    Common Language Specification


    CLR contains set of common rules used by all the programming languages in .NET
    framework. They are known Common Language Specification (CLS). CLS helps an object
    to interact with objects or applications of other languages.


    User and Program Interfaces


    .NET framework provides three different types of user interfaces:-


    *   Windows Forms: They are windows based applications.


    *   Web Forms: They are used for creating web based applications.


    *   Console Applications: They are useful for creating console based applications
    which are executed by the command line.


    Chapter 2 Program Structure in C#


    ## 2.1 Introduction to C# Program structure


    C# Program consists of various parts. We shall explore all the components needed
    for a C# program.


    Consider the code demonstrating the C# program.


    | ![](Images/image00305.jpeg)Example 1: |


    | using System;namespace welcomepublic  class WelcomeUser{ static  void Main(  string[]
    args) {        Console.WriteLine("WelcomeUser");        Console.Read(); }} |


    The code consists of several parts. They are as mentioned below:


    ### Namespace declaration


    The namespace consists of collection of classes used in programming. Theusing  keyword
    is used for adding the System namespace. The System class consists of classes
    and methods useful for the user.


    In the above code, namespace welcome is added.


    ### Class


    The class consists of data and method definitions used by the program. The class
    can have one or many methods. Every class must have a Main method, which is the
    first method run in the code. In the above code, WelcomeUser class is declared.


    ### Class Methods


    Methods in a class specify the behavior of the statement. In the above code, WriteLine
    method is used for writing the value in the console. It is defined in the Console
    class inside the  System namespace.


    The Read method of the Console class is used for waiting till the user hits a
    key. Thus prevents the screen from closing too quickly.


    ### Comments


    Comments are text useful for providing additional information about the code.
    The compiler ignores any code that is placed inside a comment block. There are
    two types of comments; one comment is used for single line entries and the other
    for multi line entries.


    For example:


    | ![](Images/image00305.jpeg)Example 2: |


    | using System;namespace comment/*It is a simple codeUsed for writing value to
    the console*/class Demo{ static  void Main() { //It is added inside Main method       
    Console.WriteLine("Demonstration of code"); }} |


    ## 2.2 User Interface elements


    There are various user interface elements present in the Visual Studio application
    that can be used in a project. We shall explore the user interface elements in
    detail.


    ### Start Page


    The Start Page is the initial page that gets displayed when the user opens the
    Microsoft Visual Studio application.


    ![](Images/image00306.jpeg)


    The Visual Studio IDE provides the start page as the default home page. Through
    the start page user can specify the preferences, developer communication using
    the .NET platform, exploring new .NET features.


    In Visual Studio .NET, the Projects tab displays the recent projects and the latest
    modification date. User can use any of the existing projects from the list. Click
    on the New Project button when you need to work for a new project. Click on the
    Open project button when user wants to open the existing project.


    ### Standard Toolbar


    The standard toolbar is used to provide the shortcut menu commands. There are
    several buttons on the toolbar that help user to perform tasks related to opening,
    closing, saving, editing, pasting on the file.


    There are functions related to the tools present in the standard toolbar. They
    are as listed below.


    *   New Project: A new project can be created in the application. The ![](Images/image00307.gif)button
    is used.


    *   Add New Item: A new item is added to the project. The ![](Images/image00308.gif)button
    is used


    *   Save: All the programs created in a particular solution are saved. The ![](Images/image00309.gif)
    button is used


    *   Save All: It saves all the unsaved items in an application. The ![](Images/image00310.gif)
    button is used


    *   Cut: The selected objects are placed on the clipboard using this option. The
    ![](Images/image00311.gif)icon is used


    *   Copy: The copy of the selected item is kept on the clipboard. The ![](Images/image00312.gif)
    icon is used


    *   Paste: It is used to paste the contents in the document. The ![](Images/image00313.gif)
    icon is used


    *   Debugging: The compilation and execution of the project is done. The ![](Images/image00314.gif)
    icon is used.


