    The value 'user' is present\n\n# 第 11 章 封装与多态\n\n## 11.1 封装简介\n\n封装是将数据和函数封装在物理或逻辑包中的过程。它帮助开发者防止访问应用程序的本质细节。它将代码和数据结合在一起。\n\
    \n抽象是指所有信息都存在，但只向用户提供相关信息。\n\n抽象和封装是相关的特性。封装通过提供隐藏非本质细节的方法辅助抽象。使用封装，某些信息是可见的而另一些是隐藏的。\n\
    \n## 11.2 C# 中的访问修饰符\n\n访问修饰符定义了类成员范围。成员用于引用类的函数和变量。程序由一个或多个类组成。类的某些成员需要被其他类访问。\n\
    \n### 访问修饰符类型\n\nC# 支持以下访问修饰符。\n\n* `public`\n* `private`\n* `protected`\n* `internal`\n\
    * `protected internal`\n\n### public 访问修饰符\n\npublic 访问允许类与其他类共享成员变量和函数。声明为 `public`\
    \ 的成员可以从类外部访问。\n\npublic 访问修饰符示例\n\n示例 38: \n\n```csharp\nusing System;\nnamespace\
    \ public1{\n    class User {\n        //成员变量\n        public string name;\n  \
    \      public int age;\n        public void AddValue() {\n            Console.WriteLine(\"\
    Enter the user name:\");\n            name = Console.ReadLine();\n           \
    \ Console.WriteLine(\"Enter the age:\");\n            age = Convert.ToInt32(Console.ReadLine());\n\
    \        }\n        public void Show() {\n            Console.WriteLine(\"User\
    \ name is:{0}\",name);\n            Console.WriteLine(\"Age is:{0}\",age);\n \
    \       }\n    }\n    class Program {\n        static void Main(string[] args)\
    \ {\n            User u = new User();\n            u.AddValue();\n           \
    \ u.Show();\n            Console.Read();\n        }\n    }\n}\n```\n\n当代码被编译并执行时，输出为：\n\
    Enter the user name:\nMark\nEnter the age:\n20\nUser name is:Mark\nAge is: 20\n\
    \n### private 访问修饰符\n\n`private` 访问修饰符允许用户向其他类对象和函数隐藏类的成员变量和函数。`private` 成员从类外部不可见。只有类内部的函数可以访问\
    \ `private` 实体。类的实例无法访问任何私变量或函数，因为它们被声明为类外部。\n\n示例：\n\n示例 39:\n\n```csharp\nusing\
    \ System;\nnamespace private1{\n    class Student {\n        //成员变量\n        private\
    \ string name;\n        private int age;\n        public void AddValue() {\n \
    \           Console.WriteLine(\"Enter the student name:\");\n            name\
    \ = Console.ReadLine();\n            Console.WriteLine(\"Enter the age:\");\n\
    \            age = Convert.ToInt32(Console.ReadLine());\n        }\n        public\
    \ void Show() {\n            Console.WriteLine(\"Student name is:{0}\",name);\n\
    \            Console.WriteLine(\"Age is:{0}\",age);\n        }\n    }\n    class\
    \ Program {\n        static void Main(string[] args) {\n            Student s\
    \ = new Student();\n            s.AddValue();\n            s.Show();\n       \
    \     Console.Read();\n        }\n    }\n}\n```\n\n当代码被编译并执行时，输出为：\nEnter the\
    \ student name:\nHarry\nEnter the age:\n15\nStudent name is:Harry\nAge is: 15\n\
    \n### protected 访问修饰符\n\n`protected` 访问修饰符允许类从其他类对象和函数隐藏成员变量和函数，子类除外。该修饰符在继承实现中非常有用。\n\
    \n示例：\n\n示例 40:\n\n```csharp\nusing System;\nnamespace protected1 {\n    class\
    \ Employee {\n        //成员变量\n        protected string name;\n        public void\
    \ AddValue() {\n            Console.WriteLine(\"Enter the employee name:\");\n\
    \            name = Console.ReadLine();\n        }\n        public void Show()\
