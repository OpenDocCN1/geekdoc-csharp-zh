    \ C# 决策语句\n\n决策的结构如下：\n\n* 语句必须满足至少一个条件\n* 必须至少有两个结束结果\n\n查看下方的图表，我们可以看到决策逻辑的通用表示形式。\n\
    \n![](img/image00320.jpeg)\n\n在上面的图中，箭头代表在系统中执行的语句流流。当语句到达条件逻辑（菱形）时，语句将与条件进行匹配。该条件有两个结果：真（True）或假（False）。\n\
    \n如果语句匹配条件，则它被声明为真，然后运行一组代码（矩形），最后到达末尾。如果语句不匹配条件，则它被声明为假，并直接跳转到结束点。\n\nC# 有多种类型的决策语句。文中对它们进行了详细解释。\n\
    \n## 6.1 If 语句\n\nIf 语句包含一个布尔表达式（真或假）。其后面跟着一个或多个语句。\n\n语法：\n\n```csharp\nif (boolean_expression)\n\
    {\n    //如果布尔表达式为真，则执行语句\n}\n```\n\n如果表达式的值为真，则代码块中的语句将执行。如果表达式的值为假，则执行 if 语句结束后的代码集。\n\
