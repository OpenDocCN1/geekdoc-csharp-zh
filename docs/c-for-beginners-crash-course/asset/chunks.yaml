    \nChapter 3 Syntax, Data Types, and conversion\n\n## 3.1 Different keywords in\
    \ C#\n\nKeywords are special predefined reserved words and are each assigned with\
    \ a unique meaning. These keywords can be organized in into categories useful\
    \ for better understanding. Below is a list of keywords categorized into different\
    \ types.\n\n### 1) Keywords for class, method, field and property\n\n*   `abstract`\n\
    *   `extern`\n*   `internal`\n*   `new`\n*   `const`\n*   `override`\n*   `protected`\n\
    *   `private`\n*   `public`\n*   `sealed`\n*   `readonly`\n*   `static`\n*   `virtual`\n\
    *   `void`\n\n### 2) Keywords for type conversions\n\n*   `explicit`\n*   `implicit`\n\
    *   `as`\n*   `is`\n*   `operator`\n*   `sizeof`\n*   `typeof`\n\n### 3) Keywords\
    \ useful for program flow control\n\n*   `if`\n*   `else`\n*   `for`\n*   `foreach`\n\
    *   `in`\n*   `case`\n*   `break`\n*   `continue`\n*   `return`\n*   `while`\n\
    *   `goto`\n*   `default`\n*   `do`\n*   `switch`\n\n### 4) Keywords used for\
    \ built in types and enumerations\n\n*   `bool`\n*   `char`\n*   `class`\n*  \
    \ `byte`\n*   `decimal`\n*   `enum`\n*   `double`\n*   `float`\n*   `interface`\n\
    *   `long`\n*   `int`\n*   `object`\n*   `sbyte`\n*   `short`\n*   `string`\n\
    *   `uint`\n*   `struct`\n*   `ulong`\n*   `ushort`\n\n### 5) Keywords used for\
    \ exception handling\n\n*   `try`\n*   `catch`\n*   `throw`\n*   `finally`\n*\
    \   `checked`\n*   `unchecked`\n\n### 6) Keywords used as literals, method passing\
    \ parameters\n\n*   `true`\n*   `false`\n*   `null`\n*   `this`\n*   `value`\n\
    *   `out`\n*   `params`\n*   `ref`\n\n### 7) Keywords useful in function pointers,\
    \ object allocation, unmanaged code\n\n*   `delegate`\n*   `event`\n*   `new`\n\
    *   `stackalloc`\n*   `unsafe`\n\n## 3.2 Data Types in C#\n\nData types are used\
    \ to store the data in a specific type. There are several built in data types\
    \ that are used by the programmers for declaring data.\n\nEvery data type has\
    \ a limited set of options it can be, these limited number of options are called\
    \ the data range for the data type. Listed below are the different data types\
    \ present and the data range that they can be:\n\n*   `bool`: Used to represent\
    \ the Boolean value. The values that can be assigned are `true` or `false`.\n\
    *   `byte`: 8 – bit unsigned integer. The range of value for a `byte` data type\
    \ is from `0` to `255`.\n*   `char`: 16 – bit Unicode character. The range of\
    \ values is from `U+0000` to `U+ffff`.\n*   `double`: 64 – bit double precision\
    \ floating point type. The range of values is from `+/-` 5.0 x 10-32.\n*   `decimal`:\
    \ 128 – bit precise floating point. The range of values is from `+/-` 7.9 x 10-28.\n\
    *   `float`: 32 – bit single precision floating point. The range of values is\
    \ from `+/-` 3.4 x 1038.\n*   `int`: 32 – bit signed integer. The range of values\
    \ is from `-2,147,483,648` to `2,147,483,647`.\n*   `long`: 64 – bit signed integer.\
    \ The range of values is from `-9,223,372,036,854,775,808` to `9,223,372,036,854,775,807`.\n\
    *   `sbyte`: 8 – bit signed integer. The range of values is from `-128` to `127`.\n\
    *   `short`: 16 – bit signed integer. The range of values is from `-32,768` to\
