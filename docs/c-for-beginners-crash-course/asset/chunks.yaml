  trans: "\n\n多态是指函数以不同形式存在的能力。“poly”一词意味着“多”，而“morphos”意味着“形式”。\n\n多态有两种类型：\n\n-\
    \ **静态多态**：函数的响应在编译时决定。\n- **动态多态**：函数的响应在运行时决定。\n\n## 11.4 静态多态\n\n静态多态指的是以不同形式存在的实体。C#\
    \ 有两种实现多态的方法。\n\n- 函数重载\n- 运算符重载\n\n### 函数重载\n\n函数重载帮助用户为两个或多个函数使用相似的名称。函数定义必须在参数列表的类型或数量上有所不同。\n\
    \n示例：\n\n| ![](img/image00305.jpeg)示例 43: |\n\n```csharp\nusing system;\nnamespace\
    \ calculate{\n    class calculate {\n        public int Min(int no1, int no2)\
    \ {\n            if(no1 < no2) {\n                return no1;\n            } else\
    \ {\n                return no2;\n            }\n        }\n        public float\
    \ Min(int no1, int no2) {\n            if(no1 < no2) {\n                return\
    \ no1;\n            } else {\n                return no2;\n            }\n   \
    \     }\n    }\n    class Program {\n        static void Main(string[] args) {\n\
    \            Program p = new Program();\n            Console.WriteLine(\"Minimum\
    \ value is:{0}\",p.Min(3,4));\n            Console.WriteLine(\"Minimum value is:{0}\"\
    , p.Min(3.2F,1.2F));\n            Console.ReadLine();\n        }\n    }\n}\n```\n\
    \n当代码编译并执行时，输出为：\n\nMinimum value is: 3\nMinimum value is: 1.2\n\n## 11.5 动态多态\n\
    \nC# 有两种实现动态多态的方法。它们是：\n\n- **抽象类**：它们是特殊的基类类型，包含抽象类成员。派生自抽象类的类成员必须实现抽象函数和属性。\n\
    - **虚函数**：它们并不真实存在。它们似乎存在于某些部分中。\n\n### 抽象类\n\n抽象类提供了类的部分实现。当派生类继承它时，实现就完整了。存在抽象方法通过派生类来实现。\n\
    \n创建抽象类的规则：\n\n- 用户不能在抽象类之外声明抽象方法。\n- 不能创建抽象类的实例。\n- 派生自抽象类的类必须重写类的所有方法。\n- 抽象类不能被声明为密封（sealed）。\n\
    \n示例：\n\n| ![](img/image00305.jpeg)示例 44: |\n\n```csharp\nusing System;\nnamespace\
    \ poly{\n    abstract class Result {\n        public abstract int average();\n\
    \    }\n    class Data: Result {\n        private int sub1;\n        private int\
    \ sub2;\n        public Data(int x, int y) {\n            sub1 = x;\n        \
    \    sub2 = y;\n        }\n        public override int average() {\n         \
    \   Console.WriteLine(\"The average is:\");\n            return (x + y / 2);\n\
    \        }\n    }\n    class Program {\n        static void Main(string[] args)\
    \ {\n            Data d = new Data(30, 70);\n            int a = d.average();\n\
    \            Console.WriteLine(\"Average:{0}\",a);\n            Console.Read();\n\
    \        }\n    }\n}\n```\n\n当代码编译并执行时，输出为：\n\nThe average is:\nAverage: 50\n\n\
    ### 虚函数\n\n如果你需要一个在类中定义并需要派生类实现的函数，则使用虚函数。派生类根据需求修改被继承类的功能。方法的调用是在运行时进行的。\n\n\
    `virtual` 关键字用在函数的返回值之前。\n\n示例：\n\n| ![](img/image00305.jpeg)示例 45: |\n\n```csharp\n\
    using System;\nnamespace virtual1{\n    class Calculate {\n        protected int\
    \ x, y;\n        public Calculate(int l = 0, int m = 0) {\n            x = l;\n\
    \            y = m;\n        }\n        public virtual int operation() {\n   \
