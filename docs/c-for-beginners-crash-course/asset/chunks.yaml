    \   int output;\n        output = no1+no2/2; \n        return output; \n    }\
    \   \n    static void Main(string[] args) {\n        Average a = new Average();\
    \             \n        // calling method Number from object class a \n      \
    \  int value = a.Number(20,30);      \n        Console.WriteLine(\"The result\
    \ is {0}\",value); \n    }\n}\n```\n\nWhen the code is compiled the result is:\n\
    The result is 25\n\n## 8.5 Recursive method call\n\nA method can call itself this\
    \ is known as recursion.\n\nExample:\n\nExample 24:\n```csharp\nusing System;\n\
    namespace recursive{ \n    class recursivecall { \n        public int factorial(int\
    \ no) { \n            int result; \n            if(no == 1) { \n             \
    \   return 1; \n            } else {\n                result = factorial(no-1)*no;\
    \ \n                return result; \n            } \n        } \n        static\
    \ void Main(string[] args) {\n            recursivecall r = new recursivecall();\
    \              \n            Console.WriteLine(\"Factorial of no is {0}\",r.factorial(2));\
    \              \n            Console.WriteLine(\"Factorial of no is {0}\",r.factorial(3));\
    \              \n            Console.Read(); \n        } \n    } \n}\n```\n\n\
    When the code is complied the result will be:\nFactorial of no is 2\nFactorial\
    \ of no is 6\n\n## 8.4 Passing parameters to method\n\nWhen a user calls a method,\
    \ if the method accepts parameters then these will have to be passed through at\
    \ the time the method is called. There are three types of parameters passed to\
    \ the method.\n\n### Value parameter\n\nWith a value parameter, the method creates\
    \ a copy of this passed in parameter as a variable for use inside the method.\
    \ If the value of this variable is changed, it will be only changed in the scope\
    \ of the method itself and not of the original variable that was passed in as\
    \ a parameter to the method.\n\nExample:\n\nExample 25:\n```csharp\nclass Program{\
    \ \n    void Increaseno(int no) {      \n        no++; \n    } \n    public static\
    \ void Main() {\n        Program p = new Program(); \n        int number = 2;\
    \      \n        p.Increaseno(number);      \n        Console.WriteLine(number);\
    \ \n    } \n}\n```\n\nWhen the code is complied the result will be:\n2\n\n###\
    \ Reference Parameter\n\nThe reference parameter is the same as the value parameter\
    \ except that when the parameter is passed to the method, instead of creating\
    \ a copy of the parameter value, it instead directly points to the original stored\
    \ value in memory. Thus, if the value is changed in the scope of the method then\
    \ it will also change the value of the original variable that was passed in as\
    \ a parameter.\n\nThe `ref` keyword is used for declaring the reference parameter.\n\
    \nExample:\n\nExample 26:\n```csharp\nclass Program{ \n    void Increaseno(int\
    \ no) {      \n        no++; \n    } \n    public static void Main() {\n     \
    \   Program p=new Program(); \n        int number = 2;      \n        p.Increaseno(ref\
    \ number);      \n        Console.WriteLine(number); \n    } \n}\n```\n\nWhen\
    \ the code is complied the result will be:\n3\n\n### Output parameter\n\nThe `return`\
    \ statement is used for returning value from the method. Only a single variable\
    \ can be returned using `return` statement. The output parameter provides this\
    \ purpose.\n\nThey are similar to reference parameters, except they transfer data\
    \ out of the method.\n\nExample:\n\nExample 27:\n```csharp\nclass Program{ \n\
    \    void Demo(out int no) {      \n        no=10; \n    } \n    public static\
    \ void Main() {\n        Program p=new Program(); \n        int number;      \n\
    \        p.Demo(out number);      \n        Console.WriteLine(number); \n    }\
    \ \n}\n```\n\nWhen the code is complied the result will be:\n10\n\n## Chapter\
    \ 9 Arrays in C#\n\n### 9.1 Introduction to arrays\n\nAn array is a collection\
    \ of values of similar type. The variables in the array are known as the elements.\
    \ The array are accessed using a single name and an index.\n\nAn array has a rank\
    \ that determines the number of indices associated with every element. The rank\
    \ of the array is also referred as dimensions.\n\n### 9.2 Arrays declaration\n\
    \nAn array is declared before it is used in any program. The following syntax\
    \ is used to declare an array:\n`datatype[] ArrayName;`\n\nThe syntax of an array\
    \ involves components below:\n- `datatype`: Used for specifying the data type\
    \ for elements.\n- `[]`: Specify the size of the array and is referred as rank.\n\
    - `ArrayName`: States the name of the array.\n\n### 9.3 Initializing and adding\
    \ values\n\nThe `new` keyword is used to create an instance of the array. The\
    \ size of the array is specified when it is initialized. The following code snippet\
    \ is used to initialize the array:\n`int[] x;`\n\nThe array can be initialized\
    \ by combining statements and is written as:\n`int[] x = new int[5];`\n\nThe values\
    \ can be assigned to each element of the array using the index number. It is also\
    \ known as subscript. The array can be created and initialized using the following\
    \ code:\n`int[] amount = new int[]{40,60,70,80};`\n\nWhen a user copies the data\
    \ from one array into another, the source and target array refer to the same location.\
    \ The following code snippet shows the copying of one array to another:\n`int[]\
    \ amount = age;`\n\nThe size\n\nTo access an element in an array, you will need\
    \ to use an index. An index is the number that represents the position of elements\
    \ in the array. Indexes always start from zero, so to access the first element\
    \ in an array we would do so in this format:\n`array_name[index]`\n\nIn this case\
    \ the value of `index` will be zero.\n\nExample:\n\nExample 28:\n```csharp\nusing\
    \ System;\nnamespace arraydeclare{ \n    class Arraydemo { \n        static void\
    \ Main(string[] args) { \n            int[] a = new int[5]; \n            int\
    \ x,y; \n            for(int x = 0;x <5;x++) {      \n                a[x]=x +\
    \ 10; \n            } \n            for(y = 0;y < 5;y++) {      \n           \
    \     Console.WriteLine(\"Element [{0}]={1}\",y,a[y]); \n            }      \n\
    \            Console.ReadLine(); \n        } \n    } \n}\n```\n\nWhen the code\
    \ is compiled and executed, the output is:\nElement [0] = 10\nElement [1] = 11\n\
    Element [2] = 12\nElement [3] = 13\nElement [4] = 14\n\n### 9.5 Foreach loop\n\
    \nThis loop is specifically designed to iterate through all elements of an array.\
    \ It is great for retrieving elements of an array efficiently.\n\nSyntax:\n`foreach(type\
    \ identifier in expression) statement – block`\n\nExample:\n\nExample 29:\n```csharp\n\
    using System;\nnamespace arraydeclare{ \n    class Arraydemo { \n        static\
    \ void Main(string[] args) { \n            int[] a = new int[5]; \n          \
    \  for(int x = 0;x < 5;x++) {      \n                a[x] = x + 10; \n       \
    \     } \n            foreach(int y in a) { \n                int x = y - 10;\
    \      \n                Console.WriteLine(\"Element[{0}]\",x,y);      \n    \
    \            x++; \n            }      \n            Console.ReadLine(); \n  \
    \      } \n    } \n}\n```\n\nThe code is compiled and executed, the output is:\n\
    Element [0] = 10\nElement [1] = 11\nElement [2] = 12\nElement [3] = 13\nElement\
    \ [4] = 14\n\n### 9.6 Different C# arrays\n\nThe following are various types of\
