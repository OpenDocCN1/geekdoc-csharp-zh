    of variable is:{0}",var);                var=var+10; } } }} |


    In the preceding code, the variable var is initialized with value 50\. The while
    loop checks for the condition. If the condition is less than 150, the statements
    inside the loop are executed. If false, the control does not enter the while loop.


    ## 7.2 For loop


    A for loop is used to execute a block of statements for a specific number of times.


    Syntax:


    for (initialization; condition; increment/decrement)


    {


                  statement(s);


    }


    Where,


    *   initialization is used to declare and initialize the loop control variables.
    It is executed at the beginning of the loop


    *   condition checks for the expression. If the value is true, the body of the
    loop is executed. If false, the control jumps out from the loop


    *   increment/decrement is used for increasing or decreasing the variable value.


    Flow Diagram


    ![](Images/image00326.jpeg)


    Example of for loop


    | ![](Images/image00305.jpeg)Example 14: |


    | using System;namespace forloop{ class Program { static  void Main(string[] args)
    { int i; for(int i=1;i<=10;i++) {                Console.WriteLine("Value of variable
    is:{0}",i); } } }} |


    In the above code, value for variable i is declared. For loop contains assignment,
    condition, increment. If the condition is true, the value is incremented. The
    statement inside for loop is executed. Once the condition is false, the control
    moves out of the loop. 


    ## 7.3 Do while loop


    The do…while loop construct is similar to the while loop. Both the loops will
    continue until the condition is false. The difference is that the statements in
    a do…while loop are executed at least once, as the statements in the block are
    executed before the condition is checked.


    Syntax:


    do


    {


                  Statements;


    }while(expression);


