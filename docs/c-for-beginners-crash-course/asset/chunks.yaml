    \ does not need a `break` keyword.\n*   The optional `default` case appears at\
    \ the end of the `switch` and acts as a backup in case the expression does not\
    \ match any of the `ConstantExpressions`.\n\n### Flow Diagram\n\n![](Images/image00323.jpeg)\n\
