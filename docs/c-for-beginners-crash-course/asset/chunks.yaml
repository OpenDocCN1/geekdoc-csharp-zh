    {            sum=number1+number2; } public  void Show() {            Console.WriteLine("The
    total is:{0}",sum); }                // Destructor is defined here and is called
    when the class  // goes out of scope. ~Calculate() {            Console.WriteLine("Destructor
    invoked"); } public  static  void Main(string[] args) {            Calculate c1=new
    Calculate();            c1.Addition();            c1.Show(); } }} |


