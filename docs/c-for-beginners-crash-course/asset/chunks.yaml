    *   `new`\n*   `stackalloc`\n*   `unsafe`\n\n## 3.3 C# 中的类型转换\n\n类型转换用于程序员需要将一种数据类型转换为另一种类型的情况。类型转换也称为类型转换。C#\
    \ 中有两种类型转换：隐式类型转换和显式类型转换。\n\n### 隐式类型转换\n\n隐式关键字用于隐式转换。它们不需要任何转换。这些转换包括从小类型到大类型，从派生类到基类。\n\
