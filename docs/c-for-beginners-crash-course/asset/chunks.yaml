  trans: "\n\n```csharp\nusing System;\nnamespace DivNumbers{\n    class Divide {\n\
    \        int output;\n        Divide() {\n            output = 0;\n        }\n\
    \        public void division(int no1, int no2) {\n            try {\n       \
    \         output = no1 / no2;\n            } catch(DivideByZeroException e) {\n\
    \                Console.WriteLine(\"Exception handled:{0}\",e);\n           \
    \ } finally {\n                Console.WriteLine(\"Output is:{0}\",output);\n\
    \            }\n        }\n        public static void Main(string[] args) {\n\
    \            Divide d = new Divide();\n            d.division(5,0);\n        \
    \    Console.Read();\n        }\n    }\n} \n```\n\n当代码被编译并执行时，输出为：\n\nException\
    \ handled: System.DivideByZeroException: Attempted to divide by zero\n\nOutput\
    \ is: 0\n\n## 13.6 用户自定义异常\n\n当用户需要使用自定义代码特殊地处理异常时，可以创建自己的异常类。这些异常被称为用户自定义异常。\n\
    \n用户自定义异常类派自 `ApplicationException` 类。\n\n示例 52：\n\n```csharp\nusing System;\n\
    namespace userdefined{\n    class Average {\n        static void Main(string[]\
    \ args) {\n            Perform p = new Perform();\n            try {\n       \
    \         p.CalAverage();\n            } catch(CountZeroException e) {\n     \
    \           Console.WriteLine(\"CountZeroException: {0}\",e.Message);\n      \
    \      }\n            Console.Read();\n        }\n    }\n    public class CountZeroException:ApplicationException{\n\
    \        public CountZeroException(string message):base(message) {\n        }\n\
    \    }\n    public class Perform{\n        int no1 = 0;\n        int count = 0;\n\
    \        float average;\n        public void CalAverage() {\n            if(count\
    \ == 0) {\n                throw(new CountZeroException(\"Count is zero in calculation\"\
    ));\n            } else {\n                average = no1 / count;\n          \
    \  }\n        }\n    }\n}\n```\n\n当代码被编译并执行时，输出为：\n\nCountZeroException: Count\
    \ is zero in calculation\n\n# 第 14 章 多线程\n\n## 14.1 C# 中的线程\n\n线程定义了一个控制流。`Thread`\
    \ 是操作系统分配线程的 Basic 单元。线程的执行在程序内部是独立的。\n\n单个进程使用一个线程执行。这种进程被称为单线程进程。一次只能执行一个任务。用户必须等待任务完成后才能执行新任务。\n\
    \n为了同时执行多个一个线程，会创建多个线程。创建两个或多个线程的进程被称为多线程。\n\n## 14.2 线程的生命周期\n\n线程的生命周期从创建 `System.Threading.Thread`\
    \ 类的对象开始。一旦任务完成，线程的生命周期立即结束。线程的生命周期中存在多种状态。\n\n*   **未启动状态（Unstarted State）**：当创建\
    \ `Thread` 类的实例时，线程进入未启动状态。\n*   **就绪状态（Ready State）**：在程序调用 `Start()` 方法之前，线程一直处于此状态。\n\
    *   **不可运行状态（Not Runnable State）**：如果满足以下条件，线程处于不可运行状态：\n    1.  **等待（Waiting）**：调用\
    \ `Wait()` 方法使线程等待指定的条件\n    2.  **阻塞（Blocked）**：线程被 I/O 操作阻塞\n    3.  **睡眠（Sleeping）**：调用\
    \ `Sleep()` 方法将线程置于睡眠模式\n*   **死亡状态（Dead State）**：一旦线程完成执行或被中止，它会被置于死亡状态\n\n##\
    \ 14.3 主线程\n\n`System.Threading.Thread` 类用于处理线程工作。主线程在程序开始执行时就会被创建。`Thread` 类用于创建线程。它们被称为子线程。用户可以通过使用\
    \ `Thread` 类的 `CurrentThread` 属性访问主线程。\n\n示例 53：\n\n```csharp\nusing System;\n\
    namespace thread{\n    class MainThread {\n        static void Main(string[] args)\
    \ {\n            Thread t1 = new Thread();\n            t1.Name=\"Thread1\";\n\
    \            Console.WriteLine(\"Thread is:{0}\",t1.Name);\n            Console.Read();\n\
    \        }\n    }\n}\n```\n\n当代码被编译并执行时，输出为：\n\nThread is: Thread1\n\n## 14.4\
    \ Thread 类的属性和方法\n\n属性：\n\n*   `IsAlive`：显示当前线程执行状态的值\n*   `CurrentThread`：获取当前运行的线程\n\
    *   `CurrentContext`：获取线程执行的当前上下文\n*   `ExecutionContext`：`ExecutionContext` 对象包含有关上下文的信息\n\
    *   `Name`：获取或设置线程的名称\n*   `ThreadState`：包含线程状态的值\n*   `Priority`：获取或设置显示线程优先级的值\n\
    \n方法：\n\n*   `public static void BeginAffinity()`：主机根据当前操作系统执行指令。\n*   `public\
    \ void Abort()`：在调用它的线程中抛出 `ThreadAbortException`。\n*   `public void interrupt()`：中断处于\
    \ `Sleep` 状态的线程。\n*   `public static AppDomain GetDomain()`：返回一个唯一标识符。\n*   `public\
    \ static void MemoryBarrier()`：处理器执行当前线程。指令不能重排序。\n*   `public void Start()`：它启动线程。\n\
    *   `public static bool Yield()`：调用线程将执行权让给另一个就绪的线程。\n\n## 14.5 创建和管理线程\n\n线程类创建一个线程。使用\
    \ `Start()` 方法启动子线程执行。\n\n示例 54：\n\n```csharp\nusing System;\nusing System.Threading;\n\
    namespace MultipleThread{\n    class Thread {\n        public static void Child()\
    \ {\n            Console.WriteLine(\"Start child thread\");\n        }\n     \
    \   static void Main(string[] args) {\n            ThreadStart child1 = new ThreadStart(Child);\n\
    \            Console.WriteLine(\"Creating child thread\");\n            Thread\
    \ child2 = new Thread(child1);\n            child2.Start();\n            Console.Read();\n\
    \        }\n    }\n}\n```\n\n当代码被编译并执行时，输出为：\n\nStart child thread\n\n当需要暂停线程一段时间以便另一个线程执行时，使用了\
    \ `Thread.Sleep()` 方法。该方法接受一个表示毫秒的参数。\n\n示例 5：\n\n```csharp\nusing System;\nusing\
    \ System.Threading;\nnamespace Multithread{\n    class Program {\n        public\
    \ static void ChildThread() {\n            Console.WriteLine(\"Start child thread\"\
    );\n            int sleeptime = 4000;\n            Console.WriteLine(\"Thread\
    \ sleeping for {0}\", sleeptime / 1000);\n            Thread.Sleep(sleeptime);\n\
    \            Console.WriteLine(\"Resume child thread\");\n        }\n        public\
    \ static void Main() {\n            ThreadStart t1 = new ThreadStart(ChildThread);\n\
    \            Console.WriteLine(\"child thread created\");\n            Thread\
    \ child1 = new Thread(t1);\n            child1.Start();\n            Console.Read();\n\
    \        }\n    }\n}\n```\n\n当代码被编译并执行时，输出为：\n\nStart child thread\n\nThread sleeping\
    \ for 4 seconds\nResume child thread\nchild thread created\n\n## 14.6 销毁线程\n\n\
    使用 `Thread.Abort()` 方法销毁线程。当线程被销毁时会抛出 `ThreadAbortException`。该异常不会被捕获并发送到 `finally`\
    \ 块。\n\n示例 56：\n\n```csharp\nusing System;\nusing System.Threading;\nnamespace\
    \ ThreadDemo{\n    class Program {\n        public static void ChildThread() {\n\
    \            try {\n                Console.WriteLine(\"Child Thread started\"\
    );\n                for(int j = 0; j <= 10; j ++) {\n                    Thread.Sleep(1000);\n\
    \                    Console.WriteLine(\"Child thread finished\");\n         \
    \       }\n            } catch(ThreadAbortException e) {\n                Console.WriteLine(\"\
    Exception caught\");\n            } finally {\n                Console.WriteLine(\"\
    Exception is not handled\");\n            }\n        }\n        public static\
    \ void Main() {\n            ThreadStart t1 = new ThreadStart(ChildThread);\n\
    \            Console.WriteLine(\"Creating child thread\");\n            Thread\
    \ t2 = new Thread(t1);\n            t1.Start(); //主线程停止\n            Thread.Sleep(2000);\
    \ //子线程中止\n            Console.WriteLine(\"Aborting child thread\");\n       \
    \     t2.Abort();\n            Console.Read();\n        }\n    }\n}\n```\n\n"
