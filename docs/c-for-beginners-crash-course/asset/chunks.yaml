    \n# Chapter 11 Encapsulation and Polymorphism\n\n## 11.1 Introduction to encapsulation\n\
    \nEncapsulation is the process of enclosing data and function within a physical\
    \ or logical package. It helps the developers to prevent the access to the essential\
    \ details of an application. It binds the code and data together.\n\nAbstraction\
    \ states that all the information is present, but only relevant information is\
    \ provided to the user.\n\nAbstraction and encapsulation are related features.\
    \ Encapsulation assists abstraction by providing means of hiding the non-essential\
    \ details. Using encapsulation some information is visible and others are hidden.\n\
    \n## 11.2 Access specifier in C#\n\nAn access specifier defines the scope of a\
    \ class member. The member is used for referring the functions and variables of\
    \ a class. A program consists of one or more classes. Some member of the class\
    \ needs to be accessed by other classes.\n\n### Types of Access Specifier\n\n\
    The following access specifiers are supported by C#.\n\n* `public`\n* `private`\n\
    * `protected`\n* `internal`\n* `protected internal`\n\n### Public Access Specifier\n\
    \nPublic access specifier allows the class to expose the member variables and\
    \ functions with other classes. The member declared as `public` can be accessed\
    \ from outside the class.\n\nExample of public access specifier\n\nExample 38:\
    \ \n\n```csharp\nusing System;\nnamespace public1{\n    class User {\n       \
    \ //member variables\n        public string name;\n        public int age;\n \
    \       public void AddValue() {\n            Console.WriteLine(\"Enter the user\
    \ name:\");\n            name = Console.ReadLine();\n            Console.WriteLine(\"\
    Enter the age:\");\n            age = Convert.ToInt32(Console.ReadLine());\n \
    \       }\n        public void Show() {\n            Console.WriteLine(\"User\
    \ name is:{0}\",name);\n            Console.WriteLine(\"Age is:{0}\",age);\n \
    \       }\n    }\n    class Program {\n        static void Main(string[] args)\
    \ {\n            User u = new User();\n            u.AddValue();\n           \
    \ u.Show();\n            Console.Read();\n        }\n    }\n}\n```\n\nWhen the\
    \ code is compiled and executed, the output is:\nEnter the user name:\nMark\n\
    Enter the age:\n20\nUser name is:Mark\nAge is: 20\n\n### Private Access Specifier\n\
    \nThe `private` access specifier allows the user to hide classes member variables\
    \ and functions from other class objects and functions. The `private` members\
    \ are not visible from outside the class. Only the class functions within the\
    \ class itself can access the `private` entity. Instances of the class cannot\
    \ access any private variables or functions as they are declared as external to\
    \ the class.\n\nExample:\n\nExample 39:\n\n```csharp\nusing System;\nnamespace\
    \ private1{\n    class Student {\n        //member variables\n        private\
    \ string name;\n        private int age;\n        public void AddValue() {\n \
    \           Console.WriteLine(\"Enter the student name:\");\n            name\
    \ = Console.ReadLine();\n            Console.WriteLine(\"Enter the age:\");\n\
    \            age = Convert.ToInt32(Console.ReadLine());\n        }\n        public\
