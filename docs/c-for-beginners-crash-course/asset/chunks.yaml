- fmt: "\nA variable is name assigned to the memory location used by the programs.\
    \ Every variable has a data type associated with it. The data type determines\
    \ the size of the variable’s memory used for storing within the memory.\n\nThe\
    \ data types provided by C# are distinguished as:\n\n1. Integral types: `int`,\
    \ `unit`, `short`, `byte`, `sbyte`, `long`, `ulong`, and `char`\n2. Floating point\
    \ types: `double`, `float`\n3. Decimal types: `decimal`\n4. Boolean type: `true`\
    \ or `false` values\n5. Nullable type: `nullable` data type\n6. Reference type:\
    \ `class`\n\n# Defining Variables\n\nThe syntax for declaring the variables is:\n\
    \n`<data_type> <variable_list>;`\n\nWhere, `data_type` is a valid C# data type.\
    \ It can be `int`, `char`, `float`, `double`, or a user defined type. The `variable_list`\
    \ contains one or more identifiers.\n\n### Examples of variables\n\n```\nint a,b,c;\n\
    char x,y;\nfloat price, totolcost;\ndouble area;\n```\n\n# Initializing Variables\n\
    \nThe variables are initialized using an equal sign and followed by an expression.\
    \ The syntax for initializing variable is:\n\n`variable_name = value;`\n\nThe\
    \ variables can be initialized in the declaration. The general form for initializing\
    \ the variable is:\n\n`<data_type> <variable_name> = value;`\n\nExamples of variable\
    \ initialization are:\n\n```\nint a = 4;\nchar z=’z’;\ndouble y = 12.145;\n```\n\
    \nExample for demonstrating variable types:\n\n| ![](Images/image00305.jpeg)Example\
    \ 5: |\n\n```cs\nusing System;\nnamespace VariableDeclare\nclass Program{\n  \
    \  static void Main(string[] args) {\n        int a;\n        short s;\n     \
    \   double d;\n        /*initializing variables*/\n        a=20;\n        s=5;\n\
    \        d=a+s;\n        Console.WriteLine(\"a={0},b={1},d={2}\",a,s,d);\n   \
    \     Console.Read();\n    }\n}\n```\n\n# Accepting values from user\n\nThe `Console`\
    \ class present in the `System` namespace provides `ReadLine()` function. The\
    \ function is used for accepting input from the user and stored into variable.\n\
    \nExample:\n\n```cs\nint no;\nno=Convert.ToInt32(Console.ReadLine());\n```\n\n\
    The `Convert.ToInt32()` function converts the data entered by the user to integer\
    \ data type. The function accepts the data in string format.\n\n# LValue and RValue\
    \ Expressions\n\nThe two types of expressions in C# are:\n\n* `lvalue`: The expression\
    \ is an `lvalue` appears on the left side of the assignment.\n* `rvalue`: The\
    \ expression is an `rvalue` that appears on the right side but not on the left\
    \ side of the assignment.\n\nThe variables are `lvalues` and hence appear on the\
    \ left side of the assignment. The numeric values are `rvalues` and hence appear\
    \ on the right side.\n\n```cs\nint a=50;\n```\n\n## 4.2 Constants and literals\
    \ in C#\n\nConstant is a class member that represents a fixed value. Constant\
    \ value can be computed at compile time but cannot be modified. Constants are\
    \ declared using the `const` keyword.\n\nSyntax:\n\n`const<data_type> <constant_name>\
    \ = value;`\n\nExample of Constant:\n\n| ![](Images/image00305.jpeg)Example 6:\
    \ |\n\n```cs\nusing System;\nnamespace constc\nclass Program{\n    static void\
    \ Main(string[] args) {\n        const int i=3;\n        int x;\n        Console.WriteLine(\"\
    The value for x is\");\n        x=Convert.ToInt(Console.ReadLine());\n       \
    \ int mult = x*i;\n        Console.WriteLine(\"Value of multiplication is:{0}\"\
