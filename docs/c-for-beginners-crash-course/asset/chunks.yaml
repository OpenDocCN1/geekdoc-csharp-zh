    ## 13.2 Different operators in overloading


    The operators that can be overloaded in C# are as mentioned below:


    | Operators | Description |


    | +, -,*,/,% | Binary operators has two operands and can be overloaded |


    | +,-,!,~,++,-- | Unary operators take one operand and can be overloaded |


    | &&, &#124;&#124; | Conditional logical operators. They cannot be overloaded
    directly |


    | ==, !=, <,>,<=,>= | Comparison operators. They cannot be overloaded |


    | =, . , ?: , new, is, sizeof, typeof | They cannot be overloaded |


    | +=, -=, *=, /=, %= | Assignment operators and cannot be overloaded |


    ## 13.3 Introduction to exception handling


    An exception is an error that occurs during the execution of a program. The exception
    occurs when an operation is not completed normally, thus the system throws an
    error when an exception occurs.


    C #exception handling is based on four keywords: try, catch, finally and throw.


    *   try: Try block checks the block of code for a particular exception when activated.
    One or more catch blocks are present.


    *   catch: The catch keyword is used to catch the exceptions. A program catches
    an exception at a place in the program where user wants to handle the issue.


    *   finally: The finally block is used to execute statements even if the exception
    is thrown or not.


    *   throw: The throw keyword is used to throw an exception.


    Syntax:


    try


    {


         //statements causing exception


    }


    catch( ExceptionName e1 )


    {


         //error handling code


    }


    catch( ExceptionName e2 )


    {


         //error handling code


    }


    catch( ExceptionName eN )


    {


         //error handling code


    }


    finally


    {


          //statements to be executed


    }


    ## 13.4 Exception classes in C#


    There are several exception classes which are directly or indirectly derived from
    the System.Exception class. Some of the classes that are derived from the System.Exception
    class are System.ApplicationException and System.SystemException classes.


    For a user-defined application having its own exception, the exception must be
    inherited from the ApplicationException class.


    The System.SystemException class is the base class for all exceptions.


    | Exception class | Description |


    | System.IO.IOException | It handles the I/O Errors |


    | System.NullReferenceException | Errors generated during the process of dereferencing
    a null object |


    | System.IndexOutOfRangeException | Errors generated when a method refers an array
    element out of bound |


    | System.DivideByZeroException | Errors generated during the process of dividing
    the dividend by zero |


    | System.OutOfMemoryException | Memory allocation to the application errors |


    | System.InvalidCastException | Errors due to type casting |


    | System.StackOverflowException | The errors generated due to stack overflow |


    ## 13.5 Exception handling


    The structured solution in the form of try and catch block is provided by C#.
    The core program statements are divided from the error handling statements. The
    finally block is used to handle errors.


