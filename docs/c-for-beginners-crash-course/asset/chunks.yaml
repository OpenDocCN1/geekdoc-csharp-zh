    Chapter 7 Loops in C#


    Loop structures are used for executing one or more lines again and again. Various
    control structures are provided for complicated execution.


    ![](Images/image00324.jpeg)


    ## 7.1 While loop


    A while loop consists of a conditional expression that must be matched before
    the logical statements inside the while loop can be executed. If a statement matches
    the expression then it will run the code inside the loop and then return back
    to the conditional expression to re-check whether the statement still matches
    the expression. If it matches again then the loop will execute again otherwise
    it will skip the loop completely.


    Let us visit the syntax of a while loop.


    Syntax:


    while (expression)


    {


                  statements;


    }


    Flow Diagram


    ![](Images/image00325.jpeg)


