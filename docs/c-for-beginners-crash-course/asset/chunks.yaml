- fmt: "\n# 14.2 Life cycle of a thread\n# 14.3 Main thread\n# 14.4 Properties and\
    \ methods of the Thread class\n# 14.5 Creating and managing threads\n# 14.6 Destroying\
    \ threads\n# Reference links on C#\n# Conclusion\n\n# Chapter 1 Introduction to\
    \ C#\n\n## 1.1 Overview of C#\n\nC# is an object oriented, type safe high level\
    \ programming language. It has been developed by Microsoft during the development\
    \ of the `.NET` framework. C# was developed for the Common Language Infrastructure\
    \ (`CLI`), this infrastructure was created to allow programs from various other\
    \ high level languages to work together without the need to rewrite those programs\
    \ entirely. The `CLI` contains a various executable programs referred simply as\
    \ executables and are housed and ran in a system called the runtime environment.\n\
    \nAll the programs created in `.Net` framework execute in an environment that\
    \ handles the runtime requirements. The Common Language Runtime (`CLR`) provides\
    \ the virtual machine, which helps the programmers not to consider the CPU specifications.\
    \ The class library and `CLR` make the `.NET` framework.\n\n## 1.2 Programming\
    \ features of C#\n\n- It is simple, advanced, object oriented language\n- It contains\
    \ data types and classes common for all the `.NET` languages\n- The Common Language\
    \ Runtime (`CLR`) is similar to the Java Virtual Machine (`JVM`)\n- C# provides\
    \ support for encapsulation, inheritance, polymorphism, and interfaces\n- Visual\
    \ Studio provides support to `VC++`, Visual Basic, `Vbscript`, and `Jscript`\n\
    - `.NET` consists of class library and common execution engine\n- Garbage collection,\
    \ automatic memory management, interoperability are inbuilt in C#\n- User can\
    \ develop console, windows and web applications using C#\n\n## 1.3 C# Environment\n\
    \nC# is a part of `.NET` framework. It is used for creating `.NET` applications.\
    \ Using `.NET` framework, user can design, deploy and develop the applications.\
    \ Robust applications can be easily built using the simple programming model.\n\
    \n### Components of .NET framework\n\nThe `.NET` framework diagram containing\
    \ several components is as shown:\n\n![](Images/image00304.jpeg)\n\nThe `.NET`\
    \ framework consists of the following components:\n\n- Common Language Runtime\n\
    - `.NET` framework base class library\n- Common Language Specification\n- User\
    \ and Program interfaces\n\n### Common Language Runtime (CLR)\n\nThe core component\
    \ of the `.NET` framework is the `CLR`. It is an environment where the programs\
    \ are executed. The code in `CLR` is translated into Intermediate Language (`IL`).\
    \ This `IL` code is then used across different platforms.\n\nThe `IL` code is\
    \ converted into machine language by the Just in Time (`JIT`) compiler. The complier\
    \ checks for the type safety. This ensures objects are accessed in a compatible\
    \ way.\n\n### .NET framework class library\n\nThe class library works with any\
    \ `.NET` languages like `VB.NET`, `VC#` and `VC++.NET`. The library provides classes\
    \ used in the code for performing different programming tasks like data collection,\
    \ string management, file access and connecting to the database.\n\n### Common\
    \ Language Specification\n\n`CLR` contains set of common rules used by all the\
    \ programming languages in `.NET` framework. They are known Common Language Specification\
    \ (`CLS`). `CLS` helps an object to interact with objects or applications of other\
    \ languages.\n\n### User and Program Interfaces\n\n`.NET` framework provides three\
    \ different types of user interfaces:-\n\n- Windows Forms: They are windows based\
    \ applications.\n- Web Forms: They are used for creating web based applications.\n\
    - Console Applications: They are useful for creating console based applications\
    \ which are executed by the command line.\n\n# Chapter 2 Program Structure in\
    \ C#\n\n## 2.1 Introduction to C# Program structure\n\nC# Program consists of\
    \ various parts. We shall explore all the components needed for a C# program.\n\
    \nConsider the code demonstrating the C# program.\n\n| ![](Images/image00305.jpeg)Example\
    \ 1: |\n```csharp\nusing System;\nnamespace welcome {\n    class WelcomeUser {\n\
    \        static void Main(string[] args) {\n            Console.WriteLine(\"WelcomeUser\"\
    );\n            Console.Read();\n        }\n    }\n}\n``` |\n\nThe code consists\
    \ of several parts. They are as mentioned below:\n\n### Namespace declaration\n\
    \nThe namespace consists of collection of classes used in programming. The `using`\
    \ keyword is used for adding the `System` namespace. The `System` class consists\
    \ of classes and methods useful for the user.\n\nIn the above code, namespace\
    \ `welcome` is added.\n\n### Class\n\nThe class consists of data and method definitions\
    \ used by the program. The class can have one or many methods. Every class must\
    \ have a `Main` method, which is the first method run in the code. In the above\
    \ code, `WelcomeUser` class is declared.\n\n### Class Methods\n\nMethods in a\
    \ class specify the behavior of the statement. In the above code, `WriteLine`\
    \ method is used for writing the value in the console. It is defined in the `Console`\
    \ class inside the `System` namespace.\n\nThe `Read` method of the `Console` class\
    \ is used for waiting till the user hits a key. Thus prevents the screen from\
    \ closing too quickly.\n\n### Comments\n\nComments are text useful for providing\
