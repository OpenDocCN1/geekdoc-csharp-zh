    ## C# destructors


    A destructor is a special function in a class that is used very rarely to usually
    release unmanaged resources before exiting the class. The destructor has several
    limitations on how it can be used:


    *   It cannot be inherited.


    *   It cannot be overloaded.


    *   There can only be one destructor in any given class.


    *   The destructor cannot be directly called by the programmer; it is instead
    called by the Garbage Collector.


    Destructor has the same name as its class and is prefixed with ~ symbol which
    is represented by a tilde.


    Example of Destructors


