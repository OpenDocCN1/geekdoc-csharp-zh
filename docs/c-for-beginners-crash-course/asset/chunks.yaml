    \       public void division(int no1, int no2) {\n            try {\n        \
    \        output = no1 / no2;\n            } catch(DivideByZeroException e) {\n\
    \                Console.WriteLine(\"Exception handled:{0}\",e);\n           \
    \ } finally {\n                Console.WriteLine(\"Output is:{0}\",output);\n\
    \            }\n        }\n        public static void Main(string[] args) {\n\
    \            Divide d = new Divide();\n            d.division(5,0);\n        \
    \    Console.Read();\n        }\n    }\n} \n```\n\nWhen the code is compiled and\
    \ executed, the output is:\n\nException handled: System.DivideByZeroException:\
    \ Attempted to divide by zero\n\nOutput is: 0\n\n## 13.6 User defined exceptions\n\
    \nUsers can create their own exception classes when the situation arises where\
    \ the user needs to handle an exception in a special way using custom code. These\
    \ exceptions are known as user defined exceptions.\n\nThe user defined exceptions\
    \ classes are derived from the `ApplicationException` class.\n\nExample 52:\n\n\
    ```csharp\nusing System;\nnamespace userdefined{\n    class Average {\n      \
    \  static void Main(string[] args) {\n            Perform p = new Perform();\n\
    \            try {\n                p.CalAverage();\n            } catch(CountZeroException\
    \ e) {\n                Console.WriteLine(\"CountZeroException: {0}\",e.Message);\n\
    \            }\n            Console.Read();\n        }\n    }\n    public class\
    \ CountZeroException:ApplicationException{\n        public CountZeroException(string\
    \ message):base(message) {\n        }\n    }\n    public class Perform{\n    \
    \    int no1 = 0;\n        int count = 0;\n        float average;\n        public\
    \ void CalAverage() {\n            if(count == 0) {\n                throw(new\
    \ CountZeroException(\"Count is zero in calculation\"));\n            } else {\n\
    \                average = no1 / count;\n            }\n        }\n    }\n}\n\
    ```\n\nWhen the code is compiled and executed, the output is:\n\nCountZeroException:\
    \ Count is zero in calculation\n\n# Chapter 14 Multithreading\n\n## 14.1 Thread\
    \ in C#\n\nA thread defines a control flow. `Thread` is a basic unit to which\
    \ the operating system allocates a thread. The execution of a thread is independent\
    \ within a program.\n\nA single process is executed using one thread. Such process\
    \ is known as single – threaded process. Only one task can be performed at a time.\
    \ The user has to wait for the task to complete before executing new task.\n\n\
    For executing more than one thread at a time, multiple threads are created. The\
    \ process creating two or more threads is known as multithreading.\n\n## 14.2\
    \ Life cycle of a thread\n\nThe life cycle of a thread starts when the object\
    \ of `System.Threading.Thread` class is created. The life ends as soon as the\
    \ task is completed. There are various states in the life cycle of a thread.\n\
    \n*   **Unstarted State**: When the instance of the `Thread` class is created,\
    \ the thread enters in unstarted state.\n*   **Ready State**: The thread is in\
    \ this state till the program calls the `Start()` method.\n*   **Not Runnable\
    \ State**: A thread is not in the runnable state if:\n    1.  **Waiting**: The\
    \ `Wait()` method is called to make the thread for a specified condition\n   \
    \ 2.  **Blocked**: The thread is blocked by an I/O operation\n    3.  **Sleeping**:\
    \ The `Sleep()` method is called to put the thread in sleeping mode.\n*   **Dead\
    \ State**: Once the thread completes its execution or aborted, it is placed in\
    \ a dead state\n\n## 14.3 Main thread\n\nThe `System.Threading.Thread` class is\
    \ used for working with threads. The main thread is created as soon as program\
    \ starts execution. The `Thread` class is used for creating threads. They are\
    \ known as child threads. The user can access the main thread by using the `CurrentThread`\
    \ property of the `Thread` class.\n\nExample 53:\n\n```csharp\nusing System;\n\
    namespace thread{\n    class MainThread {\n        static void Main(string[] args)\
    \ {\n            Thread t1 = new Thread();\n            t1.Name=\"Thread1\";\n\
    \            Console.WriteLine(\"Thread is:{0}\",t1.Name);\n            Console.Read();\n\
    \        }\n    }\n}\n```\n\nWhen the code is compiled and executed, the output\
    \ is:\n\nThread is: Thread1\n\n## 14.4 Properties and methods of the Thread class\n\
    \nProperties:\n\n*   `IsAlive`: The value showing the execution status of the\
    \ current thread\n*   `CurrentThread`: The current running thread is retrieved\n\
    *   `CurrentContext`: The current context in which the thread is executing is\
    \ retrieved\n*   `ExecutionContext`: The `ExecutionContext` object contains information\
    \ about contexts\n*   `Name`: Gets or sets name of the thread\n*   `ThreadState`:\
    \ The value containing states of the thread\n*   `Priority`: It gets or sets the\
    \ value showing priority of a thread\n\nMethods:\n\n*   `public static void BeginAffinity()`:\
    \ The host is to execute instructions depending on the current operating system.\n\
    *   `public void Abort()`: The `ThreadAbortException` is raised in thread which\
    \ it is invoked.\n*   `public void interrupt()`: The thread present in `Sleep`\
    \ state is interrupted.\n*   `public static AppDomain GetDomain()`: A unique identifier\
    \ is returned.\n*   `public static void MemoryBarrier()`: The processor executes\
    \ the current thread. instructions cannot be reordered.\n*   `public void Start()`:\
    \ It starts the thread.\n*   `public static bool Yield()`: The calling thread\
    \ to yield execution to another thread which is ready to run on the processor\n\
    \n## 14.5 Creating and managing threads\n\nThe extended thread class creates a\
    \ thread. The thread class calls the `Start()` method to start child thread execution.\n\
    \nExample 54:\n\n```csharp\nusing System;\nusing System.Threading;\nnamespace\
    \ MultipleThread{\n    class Thread {\n        public static void Child() {\n\
    \            Console.WriteLine(\"Start child thread\");\n        }\n        static\
    \ void Main(string[] args) {\n            ThreadStart child1 = new ThreadStart(Child);\n\
    \            Console.WriteLine(\"Creating child thread\");\n            Thread\
    \ child2 = new Thread(child1);\n            child2.Start();\n            Console.Read();\n\
    \        }\n    }\n}\n```\n\nWhen the code is compiled and executed, the output\
    \ is:\n\nStart child thread\nCreating child thread\n\nManaging Threads When there\
    \ is a need to pause a thread for a period of time so that another thread can\
    \ execute, the `Thread.Sleep()` method is used. The method takes a single argument\
    \ stating time in milliseconds.\n\nExample 5:\n\n```csharp\nusing System;\nusing\
    \ System.Threading;\nnamespace Multithread{\n    class Program {\n        public\
    \ static void ChildThread() {\n            Console.WriteLine(\"Start child thread\"\
    );\n            int sleeptime = 4000;\n            Console.WriteLine(\"Thread\
    \ sleeping for {0}\", sleeptime / 1000);\n            Thread.Sleep(sleeptime);\n\
    \            Console.WriteLine(\"Resume child thread\");\n        }\n        public\
    \ static void Main() {\n            ThreadStart t1 = new ThreadStart(ChildThread);\n\
    \            Console.WriteLine(\"child thread created\");\n            Thread\
    \ child1 = new Thread(t1);\n            child1.Start();\n            Console.Read();\n\
    \        }\n    }\n}\n```\n\nWhen the code is compiled and executed, the output\
    \ is:\n\nStart child thread\nThread sleeping for 4 seconds\nResume child thread\n\
    child thread created\n\n## 14.6 Destroying threads\n\nThe `Thread.Abort()` method\
    \ is used to destroy the thread. The `ThreadAbortException` is thrown when the\
    \ thread is destroyed. The exception is not caught and is sent to the `finally`\
    \ block.\n\nExample 56:\n\n```csharp\nusing System;\nusing System.Threading;\n\
    namespace ThreadDemo{\n    class Program {\n        public static void ChildThread()\
    \ {\n            try {\n                Console.WriteLine(\"Child Thread started\"\
    );\n                for(int j = 0; j <= 10; j ++) {\n                    Thread.Sleep(1000);\n\
    \                    Console.WriteLine(\"Child thread finished\");\n         \
    \       }\n            } catch(ThreadAbortException e) {\n                Console.WriteLine(\"\
    Exception caught\");\n            } finally {\n                Console.WriteLine(\"\
    Exception is not handled\");\n            }\n        }\n        public static\
    \ void Main() {\n            ThreadStart t1 = new ThreadStart(ChildThread);\n\
    \            Console.WriteLine(\"Creating child thread\");\n            Thread\
    \ t2 = new Thread(t1);\n            t1.Start(); //main thread is stopped\n   \
    \         Thread.Sleep(2000); //child thread aborted\n            Console.WriteLine(\"\
    Aborting child thread\");\n            t2.Abort();\n            Console.Read();\n\
    \        }\n    }\n}\n```\n"
