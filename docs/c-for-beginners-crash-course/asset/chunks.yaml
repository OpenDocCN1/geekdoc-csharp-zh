    \            return x + y;\n        }\n    }\n    class call {\n        public\
    \ void callvalue(Calculate c) {\n            int z;\n            z = c.operation();\n\
    \            Console.WriteLine(\"Result:{0}\",z);\n        }\n    }\n    class\
    \ Program {\n        static void Main(string[] args) {\n            call p = new\
    \ call();\n            Multiplication m = new Multiplication(10,2);\n        \
    \    Addition t = new Addition(15,5);\n            p.callvalue(m);\n         \
    \   p.callvalue(t);\n            Console.Read();\n        }\n    }\n}\n```\n\n\
    当代码编译并执行时，输出为：\n\nMultiplication is:\nResult: 20\nAddition is:\nResult: 20\n\n\
    ## 12 继承与接口\n\n### 12.1 继承引论\n\n继承概念不仅对于 C#，对于大多数语言都是如此。它允许类继承数据和方法。\n\n### 12.2\
    \ 基类与派生类\n\n继承可以用几种方式总结，例如，基类（父类）和派生类（子类）。\n\n- 基类是派自的类。\n- 派生类是继承另一个类的类。\n\n\
    示例：\n\n| ![](img/image00305.jpeg)示例 46: |\n\n```csharp\nusing System;\nnamespace\
    \ inheritance{\n    class Demo {\n        public void side(int s) {\n        \
    \    side = s;\n        }\n        protected int side;\n    }\n    class Area\
    \ : Demo {\n        public int getAreaSquare() {\n            return side * side;\n\
    \        }\n    }\n    class Program {\n        static void Main(string[] args)\
    \ {\n            Area a = new Area();\n            a.side(4);\n            Console.WriteLine(\"\
    Area is: {0}\",a.getAreaSquare());\n            Console.Read();\n        }\n \
    \   }\n}\n```\n\n### 12.3 基类初始化\n\n在创建继承结构时，用户必须先从基类（父类）开始。下面是一个关于如何设置基类以及派生类如何继承它的示例。\n\
    \n| ![](img/image00305.jpeg)示例 47: |\n\n```csharp\nusing System;\nnamespace Base1{\n\
    \    class Square {\n        protected int side;\n        public Square(int s)\
    \ {\n            side = s;\n        }\n        public int CalculateArea() {\n\
    \            return side * side;\n        }\n        public void Show() {\n  \
    \          Console.WriteLine(\"The value of side is:{0}\",side);\n        }\n\
    \    }\n    class Paint : Square {\n        private int amount;\n        public\
    \ Paint(int side):base(side) { }\n        public int Totalamount() {\n       \
