    \ name is: Alex\nSubject is: Maths\nStudent no is: 20\nStudent name is: Adam\n\
    Subject is: Science\n\n## 12.5 C# 中的多继承\n\n多继承是派生类继承自两个不相关类的做法。C# 原生并不支持这种做法，但通过使用接口，我们可以在某种程度上模拟多继承的行为。\n\
    \n以下是使用接口模拟多继承的示例：\n\n| ![](img/image00305.jpeg)示例 49: |\n\n```csharp\nusing System;\n\
