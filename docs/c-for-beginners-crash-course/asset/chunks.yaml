    \ values is from `0` to `18,446,744,073,709,551,615`.\n*   `ushort`: 16 – bit\
    \ unsigned integer. The range of values is from `0` to `65,535`.\n\n## 3.3 Type\
    \ conversion in C#\n\nType conversion is useful when the programmer needs to convert\
    \ from one data type to another. The type conversion is also known as type casting.\
    \ There are two types of type casting in C#. They are implicit type conversion\
    \ and explicit type conversion.\n\n### Implicit type conversion\n\nThe implicit\
    \ keyword is used for implicit conversions. They do not need any casting. These\
    \ conversions include small to large integral type, from derived class to base\
    \ class.\n\n### Explicit type conversion\n\nThe explicit conversions are done\
