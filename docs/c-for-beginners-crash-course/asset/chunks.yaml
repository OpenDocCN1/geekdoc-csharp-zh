    \n示例 22：\n```csharp\nclass Average{ \n    public int Number(int no1, int no2)\
    \ { \n        int output;\n        output = no1+no2/2; \n        return output;\
    \ \n    }\n}\n```\n\n## 8.3 调用方法\n\n一旦定义了方法，用户就可以使用方法名调用该方法。方法名后跟着括号。\n\n示例：\n\
    \n示例 23：\n```csharp\nusing System;\nclass Average{ \n    public int Number(int\
    \ no1, int no2) { \n        int output;\n        output = no1+no2/2; \n      \
    \  return output; \n    }   \n    static void Main(string[] args) {\n        Average\
    \ a = new Average();             \n        // 从对象类 a 调用方法 Number \n        int\
    \ value = a.Number(20,30);      \n        Console.WriteLine(\"The result is {0}\"\
    ,value); \n    }\n}\n```\n\n当代码编译时，结果为：\nThe result is 25\n\n## 8.5 递归方法调用\n\n\
    方法可以调用自己，这被称为递归。\n\n示例：\n\n示例 24：\n```csharp\nusing System;\nnamespace recursive{\
    \ \n    class recursivecall { \n        public int factorial(int no) { \n    \
    \        int result; \n            if(no == 1) { \n                return 1; \n\
    \            } else {\n                result = factorial(no-1)*no; \n       \
    \         return result; \n            } \n        } \n        static void Main(string[]\
    \ args) {\n            recursivecall r = new recursivecall();              \n\
    \            Console.WriteLine(\"Factorial of no is {0}\",r.factorial(2));   \
    \           \n            Console.WriteLine(\"Factorial of no is {0}\",r.factorial(3));\
    \              \n            Console.Read(); \n        } \n    } \n}\n```\n\n\
    当代码编译后，结果将是：\nFactorial of no is 2\nFactorial of no is 6\n\n## 8.4 向方法传递参数\n\n\
    当用户调用方法时，如果该方法接受参数，则在调用方法时必须传递这些参数。传递给方法的参数有三种。\n\n### 值参数\n\n使用值参数时，方法会创建此传入参数的副本作为变量，供方法内部使用。如果该变量的值被更改，它只会在方法自身的作用域内改变，而不会改变作为参数传递给方法的原始变量。\n\
    \n示例：\n\n示例 25：\n```csharp\nclass Program{ \n    void Increaseno(int no) {   \
    \   \n        no++; \n    } \n    public static void Main() {\n        Program\
    \ p = new Program(); \n        int number = 2;      \n        p.Increaseno(number);\
    \      \n        Console.WriteLine(number); \n    } \n}\n```\n\n当代码编译后，结果为：\n\
    2\n\n### 引用参数\n\n引用参数与值参数相同，不同在于当参数传递给方法时，它不是创建参数值的副本，而是直接指向内存中存储的原始值。因此，如果在方法的作用域内更改了值，它也会更改作为参数传递的原始变量的值。\n\
    \n使用 `ref` 关键字声明引用参数。\n\n示例：\n\n示例 26：\n```csharp\nclass Program{ \n    void Increaseno(int\
    \ no) {      \n        no++; \n    } \n    public static void Main() {\n     \
    \   Program p=new Program(); \n        int number = 2;      \n        p.Increaseno(ref\
    \ number);      \n        Console.WriteLine(number); \n    } \n}\n```\n\n当代码编译后，结果为：\n\
    3\n\n### 输出参数\n\n`return` 语句用于从方法返回值。使用 `return` 语句只能返回一个变量。输出参数提供了此目的。\n\n它们与引用参数相似，不同在于它们将数据传输到方法之外。\n\
    \n示例：\n\n示例 27：\n```csharp\nclass Program{ \n    void Demo(out int no) {     \
    \ \n        no=10; \n    } \n    public static void Main() {\n        Program\
    \ p=new Program(); \n        int number;      \n        p.Demo(out number);  \
    \    \n        Console.WriteLine(number); \n    } \n}\n```\n\n当代码编译后，结果为：\n10\n\
    \n## 第 9 章 C# 数组\n\n### 9.1 数组简介\n\n数组是相似类型取值的集合。数组中的变量被称为元素。使用单个名称和索引来访问数组。\n\
    \n数组有一个阶（rank），决定了与每个元素相关索引的数量。数组的阶也被称为维度（dimensions）。\n\n### 9.2 数组声明\n\n数组在任何程序中使用之前必须声明。使用以下语法声明数组：\n\
    `datatype[] ArrayName;`\n\n数组的语法包含以下组件：\n- `datatype`：用于指定元素的数据类型。\n- `[]`：指定数组的大小。\n\
    - `ArrayName`：数组的名称。\n\n### 9.3 数组初始化与赋值\n\n数组在程序中使用之前必须声明。`new` 关键字用于创建数组的实例。数组的阶（rank）决定了与每个元素相关索引的数量。数组的阶也被称为维度（dimensions）。\n\
    \n数组可以在初始化时赋值。使用以下语法初始化数组：\n`datatype[] ArrayName = new datatype[size];`\n\n数组可以在初始化时赋值。使用以下语法初始化数组：\n\
    `datatype[] ArrayName = new datatype[] {value1, value2, ...};`\n\n数组可以在初始化时赋值。使用以下语法初始化数组：\n\
    `datatype[] ArrayName = {value1, value2, ...};`\n\n示例：\n\n示例 28：\n```csharp\n\
    using System;\nnamespace arraydeclare{ \n    class Arraydemo { \n        static\
    \ void Main(string[] args) { \n            int[] a = new int[5]; \n          \
    \  int x,y; \n            for(int x = 0;x < 5;x++) {      \n                a[x]\
    \ = x + 10; \n            } \n            for(y = 0;y < 5;y++) {      \n     \
    \           Console.WriteLine(\"Element [{0}]={1}\",y,a[y]); \n            } \
    \     \n            Console.ReadLine(); \n        } \n    } \n}\n```\n\n要访问数组中的元素需要使用索引。索引总是从\
    \ 0 开始。\n\n访问数组中的元素需要使用如下格式：\n`array_name[index]`\n\n索引表示数组中的位置。\n\n### 9.4 遍历遍历\n\
    \n这种循环专门设计用于遍历数组中的所有元素。它非常适合高效获取元素。\n\n语法：\n`foreach(type identifier in expression)\
    \ statement – block`\n\n示例：\n\n示例 29：\n```csharp\nusing System;\nnamespace arraydeclare{\
    \ \n    class Arraydemo { \n        static void Main(string[] args) { \n     \
    \       int[] a = new int[5]; \n            for(int x = 0;x < 5;x++) {      \n\
    \                a[x] = x + 10; \n            } \n            foreach(int y in\
    \ a) { \n                int x = y - 10;      \n                Console.WriteLine(\"\
    Element[{0}]\",x,y);      \n                x++; \n            }      \n     \
    \       Console.ReadLine(); \n        } \n    } \n}\n```\n\n### 9.6 不同的 C# 数组\n\
    \n以下是用于代码开发的各种 C# 数组类型。\n\n#### 多维数组\n\n多维数组在多个行维度上存储数据。它也被称为矩形数组。用户可以像如下所示声明整数的二维数组：\n\
