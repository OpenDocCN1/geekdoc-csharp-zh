    Student name is:Harry\nAge is: 15\n\n### Protected access specifier\n\nThe `protected`\
    \ access specifier allows the class to hide the member variables and functions\
    \ from other class objects and functions, except from child classes. The specifier\
    \ is useful during the implementation of inheritance.\n\nExample:\n\nExample 40:\n\
    \n```csharp\nusing System;\nnamespace protected1 {\n    class Employee {\n   \
    \     //member variables\n        protected string name;\n        public void\
