  ## 7.2 For 循环\n\n`for` 循环用于按指定次数执行语句块。\n\n#### 语法：\n\n```csharp\nfor (initialization;\
  \ condition; increment/decrement)\n{\n    statements\n}\n```\n\n其中：\n\n*   `initialization`（初始化）用于声明并初始化循环。\n\
  *   `condition`（条件）检查表达式。如果条件为 `true`，则执行循环体。\n*   `increment/decrement`（增/减）用于增加或减少变量的值。\n\
  \n### 流程图\n\n![](img/image00326.jpeg)\n\n### for 循环示例\n\n| ![](img/image00305.jpeg)示例\
  \ 14: |\n\n```csharp\nusing System;\nnamespace forloop{\n    class Program {\n \
  \       static void Main(string[] args) {\n            int i;\n            for(i=1;i<=10;i++)\
  \ {\n                // statements\n            }\n            Console.WriteLine(\"\
  Value of variable is:{0}\",i);\n        }\n    }\n}\n```\n\n在上述代码中，声明了变量 `i`。`for`\
  \ 循环执行指定次数的语句。\n\n## 7.3 Do while 循环\n\n`do...while` 循环结构与 `while` 循环相似。区别在于 `do...while`\
  \ 循环在检查条件之前至少执行一次语句。\n\n#### 语法：\n\n```csharp\ndo\n{\n    statements\n}while(expression);\n\
  ```\n\n### 流程图\n\n![](img/image00327.jpeg)\n\n### do while 循环示例\n\n| ![](img/image00305.jpeg)示例\
  \ 15: |\n\n```csharp\nusing System;\nnamespace dowhile{\n    class Program {\n \
  \       static void Main(string[] args) {\n            int x=1;\n            do\
  \ {\n                Console.WriteLine(\"Value of x is:{0}\",x);\n             \
  \   x=x+1;\n            }while(x<10);\n            Console.ReadLine();\n       \
  \ }\n    }\n}\n```\n\n在上述代码中，变量 `x` 被赋值为 `1`。`do` 循环执行块内的语句。一旦 `while` 条件为 `false`，循环语句将不再执行。\n\
  \n## 7.4 Break 语句\n\n`break` 语句用于退出循环。当遇到此语句时，循环终止，控制恢复到循环后的后续语句。\n\n#### 语法：\n\n\
  ```csharp\nbreak;\n```\n\n### 流程图\n\n![](img/image00328.jpeg)\n\n### break 语句示例\n\
  \n| ![](img/image00305.jpeg)示例 16: |\n\n```csharp\nusing System;\nnamespace break;{\n\
  \    class Program {\n        static void Main(string[] args) {\n            int\
  \ i=11;\n            while(i<15) {\n                Console.WriteLine(\"value of\
  \ i:{0}\",i);\n                i++;\n                if(i>13) { break; }\n     \
  \       }\n            Console.ReadLine();\n        }\n    }\n}\n```\n\n在代码示例中，变量\
  \ `i` 被赋值为 `11`。`while` 循环检查 `i` 的条件。如果条件为 `true`，则执行 `while` 循环语句。`i` 增。\n\n循环检查\
  \ `i` 的值。一旦 `i` 的值大于 `13`，就会执行 `break` 语句，控制移出循环。\n\n## 7.5 Continue 语句\n\n`continue`\
  \ 语句与 `break` 语句相似，但它不是跳出循环，`continue` 强制执行循环的下次迭代，跳过中间的所有代码。\n\n#### 语法：\n\n```csharp\n\
  continue;\n```\n\n### 流程图\n\n![](img/image00329.jpeg)\n\n\n\n\n\n| ![](img/image00305.jpeg)示例\
  \ 17: |\n\n```csharp\nusing System;\nnamespace continue{\n    class Program {\n\
  \        int i=45;\n        do {\n            if(i==50) {\n                i=i+1;\n\
  \                continue;\n            }\n            Console.WriteLine(\"Value\
  \ of i is:{0}\",i);\n            i++;\n        } while(i<60);\n        Console.ReadLine();\n\
  \    }\n}\n```\n\n因此在上面的代码示例中，我们可以看到 `do-while` 循环和 `continue` 的结合使用。我们可以看到，当 `i`\
  \ 进入 `do` 内部的语句时，它的初始值被设置为 45。此时，会检查 `i` 是否等于 50，它并不等于，因此在消息中输出 `i` 的值，并将 `i` 加\
  \ 1。\n\n这个过程会一直持续，直到 `i` 达到 50，此时 `i` 将加 1 并遇到 `continue` 关键字，该关键字将跳过 `do` 部分的剩余代码，直接跳转到\
  \ `while` 条件表达式。\n\n一旦 `i` 达到 61，`while` 条件语句将不再匹配，执行程序将离开循环。\n\n# 第 8 章 C# 中的类与方法\n\
  \n## 8.1 类声明\n\n在 C# 中，类是该语言的主要构建模块。它提供了一组预定义的变量和方法。对象被定义为类的实例，因此类内部的方法决定了在对象上可以执行的操作。\n\
  \n### 类定义\n\n类定义以关键字 `class` 开始，后面跟着实际的类名。类变量和方法都包含在花括号之间；该区域称为类体（class body）。\n\
  \n#### 语法：\n\n```text\n<access specifier>class class_name\n{\n    //member variables\n\
  \    <access specifier> <data type> variable1;\n    <access specifier> <data type>\
  \ variable2;\n    ……\n    <access specifier><data type> variableN;\n\n    //member\
  \ methods\n    <access specifier><return type>method1(parameter_list)\n    {\n \
  \       //method body\n    }\n    <access specifier><return type>method2(parameter_list)\n\
  \    {\n        //method body\n    }\n    ….\n    <access specifier><return type>methodN(parameter_list)\n\
  \    {\n        //method body\n    }\n}\n```\n\n*   `Access specifiers`（访问修符）定义了其他方法和成员与给定类的方法及成员交互的权限。如果没有指定访问修符，默认访问修符为\
  \ `private`。\n*   `date type`（数据类型）指定变量类型，`return type`（返回类型）用于说明方法返回的数据类型，但需要注意的是，方法并不总是需要返回任何内容。\n\
  *   点运算符 (`.`) 用于访问类成员。\n*   点运算符用于连接对象名和成员名名。\n\n### 类的演示示例\n\n| ![](img/image00305.jpeg)示例\
  \ 18: |\n\n```csharp\nusing System;\nnamespace demo{\n    class Calculate {\n  \
  \      public int len;\n        public int bread;\n    }\n    class Program {\n\
  \        static void Main(string[] args) {\n            Calculate c1 = new Calculate();\n\
  \            Calculate c2 = new Calculate();\n            int area = 0;\n      \
  \      int area1 = 0;\n            c1.len = 10;\n            c1.bread = 5;\n   \
  \         area = c1.len*c1.bread;\n            Console.WriteLine(\"area of rectangle1\
  \ is:{0}\",area);\n            area1 = c2.len*c2.bread;\n            Console.WriteLine(\"\
  area of rectangle2 is:{0}\",area1);\n            Console.ReadLine();\n        }\n\
  \    }\n}\n```\n\n编译后，该类的结果将是：\narea of rectangle1:50\narea of rectangle2:150\n\n\
  ## C# 构造函数\n\n构造函数是一种特殊的方法，在类实例创建时自动调用。类的成员在构造函数内部进行初始化。构造函数的名称必须与类相同。\n\n### 构造函数示例\n\
  \n| ![](img/image00305.jpeg)示例 19: |\n\n```csharp\nusing System;\nnamespace construct{\n\
  \    class Calculate {\n        int number1,number2,sum;\n        Calculate() {\n\
  \            number1 = 20;\n            number2 = 40;\n        }\n        void Addition()\
  \ {\n            sum = number1+number2;\n        }\n        void Show() {\n    \
  \        Console.WriteLine(\"The total is:{0}\",sum);\n        }\n        static\
  \ void Main(string[] args) {\n            Calculate c1 = new Calculate();\n    \
  \        c1.Addition();\n            c1.Show();\n        }\n    }\n}\n```\n\n编译后，该类的结果将是：\n\
  The total is:60\n\n在上面的示例中，每当实例化类 `Calculate` 时，构造函数都会为 `number1` 和 `number2` 分配固定值。然而，如果你想让\
  \ `number1` 和 `number2` 的值不同且动态呢？该如何实现？\n\n嗯，这就是参数构造函数（parameterized constructor）概念用用场的地方。基本上这个高级术语的意思是我们可以直接传入参数。本质上，这个术语的意思意味着我们在实例化类时传入参数。让我们来看一个例子：\n\
  \n### 参数构造函数\n\n| ![](img/image00305.jpeg)示例 20: |\n\n```csharp\nusing System;\n\
  namespace construct{\n    class Calculate {\n        int number1,number2,sum;\n\
  \        Calculate(int n1, int n2) {\n            number1 = n1;\n            number2\
  \ = n2;\n        }\n        void Addition() {\n            sum = number1+number2;\n\
  \        }\n        void Show() {\n            Console.WriteLine(\"The total is:{0}\"\
  ,sum);\n        }\n        static void Main(string[] args) {\n            Calculate\
  \ c1 = new Calculate(10, 20);\n            c1.Addition();\n            c1.Show();\n\
  \        }\n    }\n}\n```\n\n编译后，该类的结果是：\nEnter value a\n10\nEnter value b\n20\n\
  The total is:30\n\nC# 析构函数\n\n析构函数是类中的一种特殊函数，通常在退出类之前释放不受管理的资源。它的用法有一定的限制：\n\n*\
  \   它不能被继承。\n*   它不能重载。\n*   任何类中只能有一个析构函数。\n*   析构函数不能由程序员直接调用；而是由垃圾回收器调用。\n\n\
  析构函数与类名相同，并以 `~` 为前缀。\n\n### 析构函数示例\n\n| ![](img/image00305.jpeg)示例 21: |\n\n```csharp\n\
  using System;\nnamespace destruct{\n    class Calculate {\n        int number1,number2,sum;\n\
  \        Calculate() {\n            number1 = 15;\n            number2 = 4;\n  \
  \      }\n        void Addition() {\n            sum = number1+number2;\n      \
  \  }\n        void Show() {\n            Console.WriteLine(\"The total is:{0}\"\
  ,sum);\n        }\n        // 析构函数在这里定义，并在类超出作用域时调用\n        ~Calculate() {\n  \
  \          Console.WriteLine(\"Destructor invoked\");\n        }\n        static\
  \ void Main(string[] args) {\n            Calculate c1 = new Calculate();\n    \
  \        c1.Addition();\n            c1.Show();\n        }\n    }\n}\n```\n\n编译后，该类的结果是：\n\
  The total is:19\nDestructor invoked\n\n## 8.2 定义方法\n\n方法是一组多个程序语句，可以通过调用方法名来执行。使用方法时，用户首先需要定义方法，然后调用该方法。\n\
  \n定义方法意味着声明其结构。使用以下语法来定义方法：\n\n```text\n<Access Specifier> <Return Type> <Method\
  \ Name> ( Parameter List)\n{\n    Method Body\n}\n```\n\n方法的不同元素有：\n\n*   `Access\
  \ specifier`（访问修符）：检查变量或方法可以被访问的范围。\n*   `Return Type`（返回类型）：定义了方法返回值的类型。如果类型设置为\
  \ `void`，则意味着该方法不返回任何内容。\n*   `Method Name`（方法名）：它是一个唯一的标识符且区分大小写。方法名不能与变量名相同。\n\
  \n\n\n\n\n- **参数列表**：方法传递和接收的值。它们写在方法名后的括号中。\n- **方法体**：用于执行实际方法执行的指令集。\n\n示例：\n\
  \n示例 22：\n```csharp\nclass Average{ \n    public int Number(int no1, int no2) {\
  \ \n        int output;\n        output = no1+no2/2; \n        return output; \n\
  \    }\n}\n```\n\n## 8.3 调用方法\n\n一旦定义了方法，用户就可以使用方法名调用该方法。方法名后跟着括号。\n\n示例：\n\n示例\
  \ 23：\n```csharp\nusing System;\nclass Average{ \n    public int Number(int no1,\
  \ int no2) { \n        int output;\n        output = no1+no2/2; \n        return\
  \ output; \n    }   \n    static void Main(string[] args) {\n        Average a =\
  \ new Average();             \n        // 从对象类 a 调用方法 Number \n        int value\
  \ = a.Number(20,30);      \n        Console.WriteLine(\"The result is {0}\",value);\
  \ \n    }\n}\n```\n\n当代码编译时，结果为：\nThe result is 25\n\n## 8.5 递归方法调用\n\n方法可以调用自己，这被称为递归。\n\
  \n示例：\n\n示例 24：\n```csharp\nusing System;\nnamespace recursive{ \n    class recursivecall\
  \ { \n        public int factorial(int no) { \n            int result; \n      \
  \      if(no == 1) { \n                return 1; \n            } else {\n      \
  \          result = factorial(no-1)*no; \n                return result; \n    \
  \        } \n        } \n        static void Main(string[] args) {\n           \
  \ recursivecall r = new recursivecall();              \n            Console.WriteLine(\"\
  Factorial of no is {0}\",r.factorial(2));              \n            Console.WriteLine(\"\
  Factorial of no is {0}\",r.factorial(3));              \n            Console.Read();\
  \ \n        } \n    } \n}\n```\n\n当代码编译后，结果将是：\nFactorial of no is 2\nFactorial\
  \ of no is 6\n\n## 8.4 向方法传递参数\n\n当用户调用方法时，如果该方法接受参数，则在调用方法时必须传递这些参数。传递给方法的参数有三种。\n\
  \n### 值参数\n\n使用值参数时，方法会创建此传入参数的副本作为变量，供方法内部使用。如果该变量的值被更改，它只会在方法自身的作用域内改变，而不会改变作为参数传递给方法的原始变量。\n\
  \n示例：\n\n示例 25：\n```csharp\nclass Program{ \n    void Increaseno(int no) {     \
  \ \n        no++; \n    } \n    public static void Main() {\n        Program p =\
  \ new Program(); \n        int number = 2;      \n        p.Increaseno(number);\
  \      \n        Console.WriteLine(number); \n    } \n}\n```\n\n当代码编译后，结果为：\n2\n\
  \n### 引用参数\n\n引用参数与值参数相同，不同在于当参数传递给方法时，它不是创建参数值的副本，而是直接指向内存中存储的原始值。因此，如果在方法的作用域内更改了值，它也会更改作为参数传递的原始变量的值。\n\
  \n使用 `ref` 关键字声明引用参数。\n\n示例：\n\n示例 26：\n```csharp\nclass Program{ \n    void Increaseno(int\
  \ no) {      \n        no++; \n    } \n    public static void Main() {\n       \
  \ Program p=new Program(); \n        int number = 2;      \n        p.Increaseno(ref\
  \ number);      \n        Console.WriteLine(number); \n    } \n}\n```\n\n当代码编译后，结果为：\n\
  3\n\n### 输出参数\n\n`return` 语句用于从方法返回值。使用 `return` 语句只能返回一个变量。输出参数提供了此目的。\n\n它们与引用参数相似，不同在于它们将数据传输到方法之外。\n\
  \n示例：\n\n示例 27：\n```csharp\nclass Program{ \n    void Demo(out int no) {      \n\
  \        no=10; \n    } \n    public static void Main() {\n        Program p=new\
  \ Program(); \n        int number;      \n        p.Demo(out number);      \n  \
  \      Console.WriteLine(number); \n    } \n}\n```\n\n当代码编译后，结果为：\n10\n\n# 第 9 章\
  \ C# 数组\n\n## 9.1 数组简介\n\n数组是相似类型取值的集合。数组中的变量被称为元素。使用单个名称和索引来访问数组。\n\n数组有一个阶（rank），决定了与每个元素相关索引的数量。数组的阶也被称为维度（dimensions）。\n\
  \n## 9.2 数组声明\n\n数组在任何程序中使用之前必须声明。使用以下语法声明数组：\n`datatype[] ArrayName;`\n\n数组的语法包含以下组件：\n\
  - `datatype`：用于指定元素的数据类型。\n- `[]`：指定数组的大小。\n- `ArrayName`：数组的名称。\n\n## 9.3 数组初始化与赋值\n\
  \n数组在程序中使用之前必须声明。`new` 关键字用于创建数组的实例。数组的阶（rank）决定了与每个元素相关索引的数量。数组的阶也被称为维度（dimensions）。\n\
  \n数组可以在初始化时赋值。使用以下语法初始化数组：\n`datatype[] ArrayName = new datatype[size];`\n\n数组可以在初始化时赋值。使用以下语法初始化数组：\n\
  `datatype[] ArrayName = new datatype[] {value1, value2, ...};`\n\n数组可以在初始化时赋值。使用以下语法初始化数组：\n\
  `datatype[] ArrayName = {value1, value2, ...};`\n\n示例：\n\n示例 28：\n```csharp\nusing\
  \ System;\nnamespace arraydeclare{ \n    class Arraydemo { \n        static void\
  \ Main(string[] args) { \n            int[] a = new int[5]; \n            int x,y;\
  \ \n            for(int x = 0;x < 5;x++) {      \n                a[x] = x + 10;\
  \ \n            } \n            for(y = 0;y < 5;y++) {      \n                Console.WriteLine(\"\
  Element [{0}]={1}\",y,a[y]); \n            }      \n            Console.ReadLine();\
  \ \n        } \n    } \n}\n```\n\n要访问数组中的元素需要使用索引。索引总是从 0 开始。\n\n访问数组中的元素需要使用如下格式：\n\
  `array_name[index]`\n\n索引表示数组中的位置。\n\n### 9.4 遍历遍历\n\n这种循环专门设计用于遍历数组中的所有元素。它非常适合高效获取元素。\n\
  \n语法：\n`foreach(type identifier in expression) statement – block`\n\n示例：\n\n示例 29：\n\
  ```csharp\nusing System;\nnamespace arraydeclare{ \n    class Arraydemo { \n   \
  \     static void Main(string[] args) { \n            int[] a = new int[5]; \n \
  \           for(int x = 0;x < 5;x++) {      \n                a[x] = x + 10; \n\
  \            } \n            foreach(int y in a) { \n                int x = y -\
  \ 10;      \n                Console.WriteLine(\"Element[{0}]\",x,y);      \n  \
  \              x++; \n            }      \n            Console.ReadLine(); \n  \
  \      } \n    } \n}\n```\n\n## 9.6 不同的 C# 数组\n\n以下是用于代码开发的各种 C# 数组类型。\n\n### 多维数组\n\
  \n多维数组在多个行维度上存储数据。它也被称为矩形数组。用户可以像如下所示声明整数的二维数组：\n\n```csharp\nint[,] no;\n```\n\n\
  \n\n\n\n二维数组可以被视为一个表格。它有 `x` 行和 `y` 列。一个二维数组包含 2 行 4 列。\n\n![](img/image00331.jpeg)\n\
  \n## 初始化二维数组\n\n以下数组有 3 行 3 列。\n\n```csharp\nint [ , ] x = int [ 3, 3] = {\n   \
  \ {1, 2, 3},\n    {4, 5, 6},\n    {7, 8, 9}\n};\n```\n\n## 访问多维数组的元素\n\n可以使用下标访问多维数组中的元素。下标是数组的行索引和列索引。\n\
  \n示例：\n\n```csharp\nint output = a [1, 2];\n```\n\n在上述语句中，访问了第二行第三列的元素。\n\n示例：\n\
  \n| ![](img/image00305.jpeg)示例 30: |\n```csharp\nusing System;\nnamespace twodimension{\n\
  \    class multiarray {\n        static void Main(string[] args) {\n           \
  \ int [ , ] x = new int[3,2]{{1,1},{2,2},{3,3}};\n            int a,b;\n       \
  \     for(a = 0;a < 3;a++) {\n                for(b = 0;b < 2;b++) {\n         \
  \           Console.WriteLine(\"x[{0},{1}={2}\",a,b,x[a,b]);\n                }\n\
  \            }\n            Console.ReadLine();\n        }\n    }\n}\n``` |\n代码被编译并执行，输出为：\n\
  `x[0,0] = 1`\n`x[0,1] = 1`\n`x[1,0] = 2`\n`x[1,1] = 2`\n`x[2,0] = 3`\n`x[2,1] =\
  \ 3`\n\n## 锯齿数组 (Jagged Array)\n\n锯齿数组是数组的数组。`int` 锯齿数组声明为：\n`int [ ] [] marks;`\n\
  \n数组可以初始化为：\n`int [ ] [] marks = new int [3] [] { new int [ ] {45,57,78}, new int\
  \ [ ] {60,75,86,45}};`\n\n`marks` 数组包含两个整数数组，`marks[0]` 包含 3 个整数，`marks[1]` 包含 5\
  \ 个整数。\n\n示例：\n\n| ![](img/image00305.jpeg)示例 31: |\n```csharp\nusing System;\n\
  namespace Jaggedarray{\n    class jagged {\n        static void Main(string[] args)\
  \ {\n            int[][] x = new int[][]{new int[][]{0,0},new int[][]{2,2},new int[][]{3,4},new\
  \ int[][]{4,2},new int[][]{1,3}};\n            int a,b;\n            for(a = 0;a\
  \ < 5;a++) {\n                for(b = 0;b < 2;b++) {\n                    Console.WriteLine(\"\
  x[{0},{1}]={2}\",a,b,x[a][b]);\n                }\n            }\n            Console.ReadLine();\n\
  \        }\n    }\n}\n``` |\n代码被编译并执行，输出为：\n`x[0,0] = 0`\n`x[0,1] = 0`\n`x[1,0]\
  \ = 2`\n`x[1,1] = 2`\n`x[2,0] = 3`\n`x[2,1] = 4`\n`x[3,0] = 4`\n`x[3,1] = 2`\n`x[4,0]\
  \ = 1`\n`x[4,1] = 3`\n\n## 参数数组 (Param Arrays)\n\n在声明方法时，作为参数传递的参数数量是不确。此时使用 `params`\
  \ 数组。\n\n示例：\n\n| ![](img/image00305.jpeg)示例 32: |\n```csharp\nusing System;\nnamespace\
  \ ParamArray{\n    class ParamArray {\n        public int AddValues(params int[]\
  \ data) {\n            int total = 0;\n            foreach(int a in data) {\n  \
  \              total += a;\n            }\n            return total;\n        }\n\
  \    }\n    class Test {\n        static void Main(string[] args) {\n          \
  \  ParamArray pa = new ParamArray();\n            int total=pa.AddValues(2,3,4,5);\n\
  \            Console.WriteLine(\"The sum is {0}\",total);\n            Console.Read();\n\
  \        }\n    }\n}\n``` |\n当代码编译并执行时，输出为：\nThe sum is 20\n\n## Array 类 (Array\
  \ Class)\n\n`array` 类是 C# 中所有数组的基类。`System` 命名空间包含了 `array` 类。`array` 类中使用了各种属性和方法。\n\
  \n### Array 类的属性\n- `Length`: 返回数组所有维度上的项总数。\n- `Rank`: 返回数组的秩（维度）。\n- `FixedSize`:\
  \ 一个表示数组是否具有固定大小的值。\n- `IsReadOnly`: 一个表示数组是否为只读的值。\n\n### Array 类的方法\n- `Sort`:\
  \ 对作为参数传递给它的数组进行排序操作。\n- `Clear`: 移除数组中的所有项并将范围设置为 0。\n- `GetLength`: 返回数组在特定维度上的项数。\n\
  - `GetValue`: 数组中指定位置的值。\n- `IndexOf`: 返回某个值在一维数组中首次出现的索引。\n- `Reverse`: 反转数组的序列。\n\
  \n示例：\n\n| ![](img/image00305.jpeg)示例 33: |\n```csharp\nusing System;\nnamespace\
  \ Array{\n    class Array1 {\n        static void Main(string[] args) {\n      \
  \      int[] item = {12,34,23,55,64};\n            int[] value = item;\n       \
  \     Console.Write(\"Original Array:\");\n            foreach(int x in item) {\n\
  \                Console.Write(x+\" \");\n            }\n            Console.WriteLine();\n\
  \            //reverse the array\n            Array.Reverse(value);\n          \
  \  Console.Write(\"Array reversed:\");\n            foreach(int x in value) {\n\
  \                Console.Write(x+\" \");\n            }\n        }\n    }\n}\n```\
  \ |\n代码被编译并执行，输出为：\nOriginal Array: 12 34 23 55 64 \nArray reversed: 64 55 23 34\
  \ 12 \n\n\n\n\n\n返回指定字符串在实例中首次出现的从 0 开始的索引。\n\n* `public string Remove(int startindex)`\n\
  它会删除当前实例中从指定位置开始到最后一个位置的字符。它会返回一个字符串。\n\n* `public char[] ToCharArray()`\n返回一个包含当前字符串对象中所有字符的\
  \ Unicode 字符数组。\n\n* `public string ToLower()`\n返回一个转换为小写形式的字符串副本。\n\n## 10.3 演示字符串功能的示例\n\
  \n### 字符串比较\n\n示例 35: \n\n```csharp\nusing System;\nnamespace string1{\n    class\
