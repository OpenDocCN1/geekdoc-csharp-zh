  \n## 11.1 封装简介\n\n封装是将数据和函数封装在物理或逻辑包中的过程。它帮助开发者防止访问应用程序的本质细节。它将代码和数据结合在一起。\n\n抽象是指所有信息都存在，但只向用户提供相关信息。\n\
  \n抽象和封装是相关的特性。封装通过提供隐藏非本质细节的方法辅助抽象。使用封装，某些信息是可见的而另一些是隐藏的。\n\n## 11.2 C# 中的访问修饰符\n\
  \n访问修饰符定义了类成员范围。成员用于引用类的函数和变量。程序由一个或多个类组成。类的某些成员需要被其他类访问。\n\n### 访问修饰符类型\n\nC# 支持以下访问修饰符。\n\
  \n* `public`\n* `private`\n* `protected`\n* `internal`\n* `protected internal`\n\
  \n### public 访问修饰符\n\npublic 访问允许类与其他类共享成员变量和函数。声明为 `public` 的成员可以从类外部访问。\n\npublic\
  \ 访问修饰符示例\n\n示例 38: \n\n```csharp\nusing System;\nnamespace public1{\n    class\
  \ User {\n        //成员变量\n        public string name;\n        public int age;\n\
  \        public void AddValue() {\n            Console.WriteLine(\"Enter the user\
  \ name:\");\n            name = Console.ReadLine();\n            Console.WriteLine(\"\
  Enter the age:\");\n            age = Convert.ToInt32(Console.ReadLine());\n   \
  \     }\n        public void Show() {\n            Console.WriteLine(\"User name\
  \ is:{0}\",name);\n            Console.WriteLine(\"Age is:{0}\",age);\n        }\n\
  \    }\n    class Program {\n        static void Main(string[] args) {\n       \
  \     User u = new User();\n            u.AddValue();\n            u.Show();\n \
  \           Console.Read();\n        }\n    }\n}\n```\n\n当代码被编译并执行时，输出为：\nEnter\
  \ the user name:\nMark\nEnter the age:\n20\nUser name is:Mark\nAge is: 20\n\n###\
  \ private 访问修饰符\n\n`private` 访问修饰符允许用户向其他类对象和函数隐藏类的成员变量和函数。`private` 成员从类外部不可见。只有类内部的函数可以访问\
  \ `private` 实体。类的实例无法访问任何私变量或函数，因为它们被声明为类外部。\n\n示例：\n\n示例 39:\n\n```csharp\nusing\
  \ System;\nnamespace private1{\n    class Student {\n        //成员变量\n        private\
  \ string name;\n        private int age;\n        public void AddValue() {\n   \
  \         Console.WriteLine(\"Enter the student name:\");\n            name = Console.ReadLine();\n\
  \            Console.WriteLine(\"Enter the age:\");\n            age = Convert.ToInt32(Console.ReadLine());\n\
  \        }\n        public void Show() {\n            Console.WriteLine(\"Student\
  \ name is:{0}\",name);\n            Console.WriteLine(\"Age is:{0}\",age);\n   \
  \     }\n    }\n    class Program {\n        static void Main(string[] args) {\n\
  \            Student s = new Student();\n            s.AddValue();\n           \
  \ s.Show();\n            Console.Read();\n        }\n    }\n}\n```\n\n当代码被编译并执行时，输出为：\n\
  Enter the student name:\nHarry\nEnter the age:\n15\nStudent name is:Harry\nAge is:\
  \ 15\n\n### protected 访问修饰符\n\n`protected` 访问修饰符允许类从其他类对象和函数隐藏成员变量和函数，子类除外。该修饰符在继承实现中非常有用。\n\
  \n示例：\n\n示例 40:\n\n```csharp\nusing System;\nnamespace protected1 {\n    class Employee\
  \ {\n        //成员变量\n        protected string name;\n        public void AddValue()\
  \ {\n            Console.WriteLine(\"Enter the employee name:\");\n            name\
  \ = Console.ReadLine();\n        }\n        public void Show() {\n            Console.WriteLine(\"\
  Employee name is:{0}\",name);\n        }\n    }\n    class Program {\n        static\
  \ void Main(string[] args) {\n            Employee e = new Employee();\n       \
  \     e.AddValue();\n            e.Show();\n            Console.Read();\n      \
  \  }\n    }\n}\n```\n\n当代码被编译并执行时，输出为：\nEnter the employee name:\nAjay\nEmployee\
  \ name is: Ajay### internal 访问修饰符\n\n`internal` 访问修饰符允许类向同一应用程序内的子类或类公开其成员函数和变量。\n\
  \n示例：\n\n示例 41:\n\n```csharp\nusing System;\nnamespace internal1{\n    class Location\
  \ {\n        //成员变量\n        internal string city;\n        public void AddValue()\
  \ {\n            Console.WriteLine(\"Enter the city name:\");\n            city\
  \ = Console.ReadLine();\n        }\n        public void Show() {\n            Console.WriteLine(\"\
  City name is:{0}\",city);\n        }\n    }\n    class Program {\n        static\
  \ void Main(string[] args) {\n            Location l = new Location();\n       \
  \     l.AddValue();\n            l.Show();\n            Console.Read();\n      \
  \  }\n    }\n}\n```\n\n当代码被编译并执行时，输出为：\nEnter the city name:\nLondon\nCity name\
  \ is: London\n\n### protected internal 访问修饰符\n\n`protected internal` 访问修饰符允许类向包含类、子类或同一应用程序内的类公开成员函数和变量。对应用程序外部派生类的访问是允许的。\n\
  \n示例：\n\n示例 42:\n\n```csharp\nusing System;\nnamespace protectedinternal1{\n   \
  \ class number {\n        //成员变量\n        protected internal int no;\n        public\
  \ void AddValue() {\n            Console.WriteLine(\"Enter the number:\");\n   \
  \         no = Convert.ToInt32(Console.ReadLine());\n        }\n        public void\
  \ Show() {\n            Console.WriteLine(\"Number is:{0}\",no);\n        }\n  \
  \  }\n    class Program {\n        static void Main(string[] args) {\n         \
  \   number n = new number();\n            n.AddValue();\n            n.Show();\n\
  \            Console.Read();\n        }\n    }\n}\n```\n\n当代码被编译并执行时，输出为：\nEnter\
  \ the number:\n10\nNumber is: 10\n\n\n\n\n\n多态是指函数以不同形式存在的能力。“poly”一词意味着“多”，而“morphos”意味着“形式”。\n\
  \n多态有两种类型：\n\n- **静态多态**：函数的响应在编译时决定。\n- **动态多态**：函数的响应在运行时决定。\n\n## 11.4 静态多态\n\
  \n静态多态指的是以不同形式存在的实体。C# 有两种实现多态的方法。\n\n- 函数重载\n- 运算符重载\n\n### 函数重载\n\n函数重载帮助用户为两个或多个函数使用相似的名称。函数定义必须在参数列表的类型或数量上有所不同。\n\
  \n示例：\n\n| ![](img/image00305.jpeg)示例 43: |\n\n```csharp\nusing system;\nnamespace\
  \ calculate{\n    class calculate {\n        public int Min(int no1, int no2) {\n\
  \            if(no1 < no2) {\n                return no1;\n            } else {\n\
  \                return no2;\n            }\n        }\n        public float Min(int\
  \ no1, int no2) {\n            if(no1 < no2) {\n                return no1;\n  \
  \          } else {\n                return no2;\n            }\n        }\n   \
  \ }\n    class Program {\n        static void Main(string[] args) {\n          \
  \  Program p = new Program();\n            Console.WriteLine(\"Minimum value is:{0}\"\
  ,p.Min(3,4));\n            Console.WriteLine(\"Minimum value is:{0}\", p.Min(3.2F,1.2F));\n\
  \            Console.ReadLine();\n        }\n    }\n}\n```\n\n当代码编译并执行时，输出为：\n\n\
  Minimum value is: 3\nMinimum value is: 1.2\n\n## 11.5 动态多态\n\nC# 有两种实现动态多态的方法。它们是：\n\
  \n- **抽象类**：它们是特殊的基类类型，包含抽象类成员。派生自抽象类的类成员必须实现抽象函数和属性。\n- **虚函数**：它们并不真实存在。它们似乎存在于某些部分中。\n\
  \n### 抽象类\n\n抽象类提供了类的部分实现。当派生类继承它时，实现就完整了。存在抽象方法通过派生类来实现。\n\n创建抽象类的规则：\n\n- 用户不能在抽象类之外声明抽象方法。\n\
  - 不能创建抽象类的实例。\n- 派生自抽象类的类必须重写类的所有方法。\n- 抽象类不能被声明为密封（sealed）。\n\n示例：\n\n| ![](img/image00305.jpeg)示例\
  \ 44: |\n\n```csharp\nusing System;\nnamespace poly{\n    abstract class Result\
  \ {\n        public abstract int average();\n    }\n    class Data: Result {\n \
  \       private int sub1;\n        private int sub2;\n        public Data(int x,\
  \ int y) {\n            sub1 = x;\n            sub2 = y;\n        }\n        public\
  \ override int average() {\n            Console.WriteLine(\"The average is:\");\n\
  \            return (x + y / 2);\n        }\n    }\n    class Program {\n      \
  \  static void Main(string[] args) {\n            Data d = new Data(30, 70);\n \
  \           int a = d.average();\n            Console.WriteLine(\"Average:{0}\"\
  ,a);\n            Console.Read();\n        }\n    }\n}\n```\n\n当代码编译并执行时，输出为：\n\n\
  The average is:\nAverage: 50\n\n### 虚函数\n\n如果你需要一个在类中定义并需要派生类实现的函数，则使用虚函数。派生类根据需求修改被继承类的功能。方法的调用是在运行时进行的。\n\
  \n`virtual` 关键字用在函数的返回值之前。\n\n示例：\n\n| ![](img/image00305.jpeg)示例 45: |\n\n```csharp\n\
  using System;\nnamespace virtual1{\n    class Calculate {\n        protected int\
  \ x, y;\n        public Calculate(int l = 0, int m = 0) {\n            x = l;\n\
  \            y = m;\n        }\n        public virtual int operation() {\n     \
  \       return 0;\n        }\n    }\n    class Multiplication : Calculate {\n  \
  \      public Multiplication (int l = 0, int m = 0):base(l,m) { }\n        public\
  \ override int operation() {\n            Console.WriteLine(\"Multiplication is:\"\
  );\n            return x * y;\n        }\n    }\n    class Addition : Calculate\
  \ {\n        public Addition (int l = 0, int m = 0):base(l,m) { }\n        public\
  \ override int operation() {\n            Console.WriteLine(\"Addition is:\");\n\
  \            return x + y;\n        }\n    }\n    class call {\n        public void\
  \ callvalue(Calculate c) {\n            int z;\n            z = c.operation();\n\
  \            Console.WriteLine(\"Result:{0}\",z);\n        }\n    }\n    class Program\
  \ {\n        static void Main(string[] args) {\n            call p = new call();\n\
  \            Multiplication m = new Multiplication(10,2);\n            Addition\
  \ t = new Addition(15,5);\n            p.callvalue(m);\n            p.callvalue(t);\n\
  \            Console.Read();\n        }\n    }\n}\n```\n\n当代码编译并执行时，输出为：\n\nMultiplication\
  \ is:\nResult: 20\nAddition is:\nResult: 20\n\n## 12 继承与接口\n\n## 12.1 继承引论\n\n继承概念不仅对于\
  \ C#，对于大多数语言都是如此。它允许类继承数据和方法。\n\n## 12.2 基类与派生类\n\n继承可以用几种方式总结，例如，基类（父类）和派生类（子类）。\n\
  \n- 基类是派自的类。\n- 派生类是继承另一个类的类。\n\n示例：\n\n| ![](img/image00305.jpeg)示例 46: |\n\n```csharp\n\
  using System;\nnamespace inheritance{\n    class Demo {\n        public void side(int\
  \ s) {\n            side = s;\n        }\n        protected int side;\n    }\n \
  \   class Area : Demo {\n        public int getAreaSquare() {\n            return\
  \ side * side;\n        }\n    }\n    class Program {\n        static void Main(string[]\
  \ args) {\n            Area a = new Area();\n            a.side(4);\n          \
  \  Console.WriteLine(\"Area is: {0}\",a.getAreaSquare());\n            Console.Read();\n\
  \        }\n    }\n}\n```\n\n## 12.3 基类初始化\n\n在创建继承结构时，用户必须先从基类（父类）开始。下面是一个关于如何设置基类以及派生类如何继承它的示例。\n\
  \n| ![](img/image00305.jpeg)示例 47: |\n\n```csharp\nusing System;\nnamespace Base1{\n\
  \    class Square {\n        protected int side;\n        public Square(int s) {\n\
  \            side = s;\n        }\n        public int CalculateArea() {\n      \
  \      return side * side;\n        }\n        public void Show() {\n          \
  \  Console.WriteLine(\"The value of side is:{0}\",side);\n        }\n    }\n   \
  \ class Paint : Square {\n        private int amount;\n        public Paint(int\
  \ side):base(side) { }\n        public int Totalamount() {\n            int amount;\n\
  \            amount = CalculateArea() * 50;\n            return amount;\n      \
  \  }\n        public void Show() {\n            base.Show();\n            Console.WriteLine(\"\
  Total amount is:{0}\",Totalamount());\n        }\n    }\n    class Program {\n \
  \       static void Main(string[] args) {\n            Paint p = new Paint(7);\n\
  \            p.Show();\n            Console.Read();\n        }\n    }\n}\n```\n\n\
  \n\n\n\n`side` 的值为: 3\n\n面积为: 9\n\n总额为: 450\n\n## 12.4 C# 中的接口\n\n接口是一种抽象基类，它声明了方法但没有在方法内部声明任何逻辑。本质上，接口可以描述为合同，所有继承该接口的类必须遵循该合同。接口规定了每个派生类必须具备的方法和属性。如果派生类中不存在这些方法，将会发生错误。\n\
  \n### 声明接口\n\n使用 `interface` 关键字声明接口。它们的默认数据类型为 `public`。\n\n#### 接口声明示例\n\n```csharp\n\
  public interface IInterface1\n{\n    void MethodToImplement();\n}\n```\n\n示例：\n\n\
  | ![](img/image00305.jpeg)示例 48: |\n\n```csharp\nusing System;\nnamespace interface1{\
  \ \n    public interface IStudentInfo \n    { \n        //interface members\n  \
  \      void ShowData(); \n    } \n    public class StudentInfo : IStudentInfo \n\
  \    { \n        private int srno; \n        private string name; \n        private\
  \ string subject; \n        public StudentInfo() \n        {\n            srno =\
  \ \"\";\n            name = \"\";\n            subject = \"\"; \n        } \n  \
  \      public StudentInfo(int s, string n, string b) \n        {\n            srno\
  \ = s;\n            name = n;\n            subject = b; \n        } \n        public\
  \ void ShowData() \n        { \n            Console.WriteLine(\"Student no is:{0}\"\
  ,srno); \n            Console.WriteLine(\"Student name is:{0}\",name); \n      \
  \      Console.WriteLine(\"Subject is:{0}\",subject); \n        } \n    } \n   \
  \ class Program { \n        static void Main(string[] args) \n        {\n      \
  \      StudentInfo s = new StudentInfo(10,\"Alex\",\"Maths\");\n            StudentInfo\
  \ s1 = new StudentInfo(20,\"Adam\",\"Science\"); \n            s.ShowData(); \n\
  \            s1.ShowData(); \n            Console.Read(); \n        } \n    } \n\
  }\n```\n\n当代码被编译并执行时，输出为：\n\nStudent no is: 10\nStudent name is: Alex\nSubject is:\
  \ Maths\nStudent no is: 20\nStudent name is: Adam\nSubject is: Science\n\n## 12.5\
  \ C# 中的多继承\n\n多继承是派生类继承自两个不相关类的做法。C# 原生并不支持这种做法，但通过使用接口，我们可以在某种程度上模拟多继承的行为。\n\n\
  以下是使用接口模拟多继承的示例：\n\n| ![](img/image00305.jpeg)示例 49: |\n\n```csharp\nusing System;\n\
  namespace multiple1{ \n    class Area { \n        protected int base; \n       \
  \ protected int height; \n        public void setbase(int b) { \n            base\
  \ = b; \n        } \n        public void setheight(int h) {\n            height\
  \ = h; \n        } \n    } \n    //Base class\n    public interface Paint { \n \
  \       int amount(int area); \n    } \n    //Derived class\n    class Triangle\
  \ : Area,Paint { \n        public int getValue() { \n            return (1/2 * b\
  \ * h ); \n        } \n        public int amount(int area) { \n            return\
  \ area * 50; \n        } \n    } \n    class Program {\n        Triangle t = new\
  \ Triangle(); \n        int area; \n        t.setbase(4); \n        t.setheight(5);\n\
  \        area = t.getValue(); //Display the area \n        Console.WriteLine(\"\
  Area is:{0}\",t.getValue()); \n        Console.WriteLine(\"Total Paint cost is:{0}\"\
  ,t.amount()); \n        Console.Read(); \n    } \n} \n```\n\n当代码被编译并执行时，输出为：\n\n\
  Area is: 10\nTotal Pain cost is: 500\n\n# 第 13 章 运算符重载与异常处理\n\n## 13.1 运算符重载简介\n\
  \n内置运算符可以在 C# 中被重定义或重载。重载的运算符是带有 `operator` 关键字的函数。其后跟着要定义的运算符符号。重载的运算符具有返回类型和参数列表。\n\
  \n示例：\n\n| ![](img/image00305.jpeg)示例 50: |\n\n```csharp\nusing System;\nnamespace\
  \ operator1{ \n    class Room { \n        private int length; \n        private\
  \ int breadth; \n        public int getArea() { \n            return length * breadth;\
  \ \n        } \n        public void setlen (int len) {\n            length = len;\
  \ \n        } \n        public void setbread(int bread) {\n            breadth =\
  \ bread; \n        } \n        //+ operator is overloaded\n        public static\
  \ Room operator + (Room r, Room s) {\n            Room o = new Room(); \n      \
  \      o.length = r.length + s.length; \n            o.breadth = r.bread + s.bread;\
  \ \n            return o; \n        } \n    } \n    class Program { \n        public\
  \ static void Main(string[] args) {\n            Room o1 = new Room();\n       \
  \     Room o2 = new Room();\n            Room o3 = new Room(); \n            int\
  \ area = 0; //Room 1 specification \n            o1.setlen(10); \n            o1.setbread(5);\
  \ //Room 2 specification \n            o2.setlen(5); \n            o2.setbread(10);\
  \ //area of room 1\n            area = o1.getArea(); \n            Console.WriteLine(\"\
  Area of Room 1 is:{0}\",area); //area of room 2\n            area = o2.getArea();\
  \ \n            Console.WriteLine(\"Area of Room 2 is:{0}\",area);\n           \
  \ o3 = o1 + o2; \n            Console.WriteLine(\"Area of Room 3 is:{0}\",area);\
  \ \n            Console.Read(); \n        } \n    } \n```\n\n当代码被编译并执行时，输出为：\n\n\
  Area-Area of Room 1 is: 50\nArea of Room 2 is: 50\nArea of Room 3 is: 100\n\n##\
  \ 13.2 不同的运算符\n\n在 C# 中可以重载的运算符如下：\n\n| 运算符 | 描述 |\n| :--- | :--- |\n| +, -, *,\
  \ /, % | 二元运算符有两个操作数，可以重载 |\n| !, ~, ++, -- | 一元运算符有一个操作数，可以重载 |\n| &&, \\|\\| |\
  \ 条件逻辑运算符（不可重载） |\n| ==, !=, <, >, <=, >= | 比较运算符 |\n| =, new, is, typeof | 赋值运算符\
  \ |\n| +=, -=, *= /= %= |\n\n## 13.3 异常处理简介\n\n异常是程序执行过程中发生的错误。当操作无法完成时，系统会抛出异常。C#\
  \ 异常处理基于四个关键字：`try`、`catch`、`finally` 和 `throw`。\n\n语法：\n\n```csharp\ntry\n{\n \
  \   // 引起异常的语句\n}\ncatch(ExceptionName e1)\n{\n    // 处理代码\n}\ncatch(ExceptionName\
  \ e2)\n{\n    // 处理代码\n}\ncatch(ExceptionName eN)\n{\n    // 处理代码\n}\nfinally\n\
  {\n    // 将执行的语句\n}\n```\n\n## 13.4 C# 中的异常类\n\n有许多直接或间接派自 `System.Exception` 类的异常。派自\
  \ `System.Exception` 类的某些类是 `System.ApplicationException` 和 `System.SystemException`。\n\
  \n对于拥有自定义异常的用户定义应用程序，异常必须继承自 `ApplicationException` 类。\n\n`System.SystemException`\
  \ 类是所有异常的基类。\n\n| 异常类 | 描述 |\n| :--- | :--- |\n| System.IO.IOException | 处理 I/O\
  \ 错误 |\n| System.NullReferenceException | 在解引用空对象时生成的错误 |\n| System.IndexOutOfRangeException\
  \ | 当方法引用的数组越界时生成的错误 |\n| System.DivideByZeroException | 除以零 |\n| System.OutOfMemoryException\
  \ | 内存分配错误 |\n| System.InvalidCastException | 类型转换导致的错误 |\n| System.StackOverflowException\
  \ | 堆栈溢出导致的错误 |\n\n## 13.5 异常处理\n\nC# 提供了 `try` 和 `catch` 块形式的结构化解决方案。核心程序语句与错误处理语句分开。`finally`\
  \ 块用于处理错误。\n\n示例：\n\n| ![](img/image00305.jpeg)示例 51: |\n\n\n\n\n\n```csharp\nusing\
  \ System;\nnamespace DivNumbers{\n    class Divide {\n        int output;\n    \
  \    Divide() {\n            output = 0;\n        }\n        public void division(int\
  \ no1, int no2) {\n            try {\n                output = no1 / no2;\n    \
  \        } catch(DivideByZeroException e) {\n                Console.WriteLine(\"\
  Exception handled:{0}\",e);\n            } finally {\n                Console.WriteLine(\"\
  Output is:{0}\",output);\n            }\n        }\n        public static void Main(string[]\
  \ args) {\n            Divide d = new Divide();\n            d.division(5,0);\n\
  \            Console.Read();\n        }\n    }\n} \n```\n\n当代码被编译并执行时，输出为：\n\nException\
  \ handled: System.DivideByZeroException: Attempted to divide by zero\n\nOutput is:\
  \ 0\n\n## 13.6 用户自定义异常\n\n当用户需要使用自定义代码特殊地处理异常时，可以创建自己的异常类。这些异常被称为用户自定义异常。\n\n用户自定义异常类派自\
  \ `ApplicationException` 类。\n\n示例 52：\n\n```csharp\nusing System;\nnamespace userdefined{\n\
  \    class Average {\n        static void Main(string[] args) {\n            Perform\
  \ p = new Perform();\n            try {\n                p.CalAverage();\n     \
  \       } catch(CountZeroException e) {\n                Console.WriteLine(\"CountZeroException:\
  \ {0}\",e.Message);\n            }\n            Console.Read();\n        }\n   \
  \ }\n    public class CountZeroException:ApplicationException{\n        public CountZeroException(string\
  \ message):base(message) {\n        }\n    }\n    public class Perform{\n      \
  \  int no1 = 0;\n        int count = 0;\n        float average;\n        public\
  \ void CalAverage() {\n            if(count == 0) {\n                throw(new CountZeroException(\"\
  Count is zero in calculation\"));\n            } else {\n                average\
  \ = no1 / count;\n            }\n        }\n    }\n}\n```\n\n当代码被编译并执行时，输出为：\n\n\
  CountZeroException: Count is zero in calculation\n\n# 第 14 章 多线程\n\n## 14.1 C# 中的线程\n\
  \n线程定义了一个控制流。`Thread` 是操作系统分配线程的 Basic 单元。线程的执行在程序内部是独立的。\n\n单个进程使用一个线程执行。这种进程被称为单线程进程。一次只能执行一个任务。用户必须等待任务完成后才能执行新任务。\n\
  \n为了同时执行多个一个线程，会创建多个线程。创建两个或多个线程的进程被称为多线程。\n\n## 14.2 线程的生命周期\n\n线程的生命周期从创建 `System.Threading.Thread`\
  \ 类的对象开始。一旦任务完成，线程的生命周期立即结束。线程的生命周期中存在多种状态。\n\n*   **未启动状态（Unstarted State）**：当创建\
  \ `Thread` 类的实例时，线程进入未启动状态。\n*   **就绪状态（Ready State）**：在程序调用 `Start()` 方法之前，线程一直处于此状态。\n\
  *   **不可运行状态（Not Runnable State）**：如果满足以下条件，线程处于不可运行状态：\n    1.  **等待（Waiting）**：调用\
  \ `Wait()` 方法使线程等待指定的条件\n    2.  **阻塞（Blocked）**：线程被 I/O 操作阻塞\n    3.  **睡眠（Sleeping）**：调用\
  \ `Sleep()` 方法将线程置于睡眠模式\n*   **死亡状态（Dead State）**：一旦线程完成执行或被中止，它会被置于死亡状态\n\n## 14.3\
  \ 主线程\n\n`System.Threading.Thread` 类用于处理线程工作。主线程在程序开始执行时就会被创建。`Thread` 类用于创建线程。它们被称为子线程。用户可以通过使用\
  \ `Thread` 类的 `CurrentThread` 属性访问主线程。\n\n示例 53：\n\n```csharp\nusing System;\nnamespace\
  \ thread{\n    class MainThread {\n        static void Main(string[] args) {\n \
  \           Thread t1 = new Thread();\n            t1.Name=\"Thread1\";\n      \
  \      Console.WriteLine(\"Thread is:{0}\",t1.Name);\n            Console.Read();\n\
  \        }\n    }\n}\n```\n\n当代码被编译并执行时，输出为：\n\nThread is: Thread1\n\n## 14.4 Thread\
  \ 类的属性和方法\n\n属性：\n\n*   `IsAlive`：显示当前线程执行状态的值\n*   `CurrentThread`：获取当前运行的线程\n\
  *   `CurrentContext`：获取线程执行的当前上下文\n*   `ExecutionContext`：`ExecutionContext` 对象包含有关上下文的信息\n\
  *   `Name`：获取或设置线程的名称\n*   `ThreadState`：包含线程状态的值\n*   `Priority`：获取或设置显示线程优先级的值\n\
  \n方法：\n\n*   `public static void BeginAffinity()`：主机根据当前操作系统执行指令。\n*   `public void\
  \ Abort()`：在调用它的线程中抛出 `ThreadAbortException`。\n*   `public void interrupt()`：中断处于\
  \ `Sleep` 状态的线程。\n*   `public static AppDomain GetDomain()`：返回一个唯一标识符。\n*   `public\
  \ static void MemoryBarrier()`：处理器执行当前线程。指令不能重排序。\n*   `public void Start()`：它启动线程。\n\
  *   `public static bool Yield()`：调用线程将执行权让给另一个就绪的线程。\n\n## 14.5 创建和管理线程\n\n线程类创建一个线程。使用\
  \ `Start()` 方法启动子线程执行。\n\n示例 54：\n\n```csharp\nusing System;\nusing System.Threading;\n\
  namespace MultipleThread{\n    class Thread {\n        public static void Child()\
  \ {\n            Console.WriteLine(\"Start child thread\");\n        }\n       \
  \ static void Main(string[] args) {\n            ThreadStart child1 = new ThreadStart(Child);\n\
  \            Console.WriteLine(\"Creating child thread\");\n            Thread child2\
  \ = new Thread(child1);\n            child2.Start();\n            Console.Read();\n\
  \        }\n    }\n}\n```\n\n当代码被编译并执行时，输出为：\n\nStart child thread\n\n当需要暂停线程一段时间以便另一个线程执行时，使用了\
  \ `Thread.Sleep()` 方法。该方法接受一个表示毫秒的参数。\n\n示例 5：\n\n```csharp\nusing System;\nusing\
  \ System.Threading;\nnamespace Multithread{\n    class Program {\n        public\
  \ static void ChildThread() {\n            Console.WriteLine(\"Start child thread\"\
  );\n            int sleeptime = 4000;\n            Console.WriteLine(\"Thread sleeping\
  \ for {0}\", sleeptime / 1000);\n            Thread.Sleep(sleeptime);\n        \
  \    Console.WriteLine(\"Resume child thread\");\n        }\n        public static\
  \ void Main() {\n            ThreadStart t1 = new ThreadStart(ChildThread);\n  \
  \          Console.WriteLine(\"child thread created\");\n            Thread child1\
  \ = new Thread(t1);\n            child1.Start();\n            Console.Read();\n\
  \        }\n    }\n}\n```\n\n当代码被编译并执行时，输出为：\n\nStart child thread\n\nThread sleeping\
  \ for 4 seconds\nResume child thread\nchild thread created\n\n## 14.6 销毁线程\n\n使用\
  \ `Thread.Abort()` 方法销毁线程。当线程被销毁时会抛出 `ThreadAbortException`。该异常不会被捕获并发送到 `finally`\
  \ 块。\n\n示例 56：\n\n```csharp\nusing System;\nusing System.Threading;\nnamespace ThreadDemo{\n\
  \    class Program {\n        public static void ChildThread() {\n            try\
  \ {\n                Console.WriteLine(\"Child Thread started\");\n            \
  \    for(int j = 0; j <= 10; j ++) {\n                    Thread.Sleep(1000);\n\
  \                    Console.WriteLine(\"Child thread finished\");\n           \
  \     }\n            } catch(ThreadAbortException e) {\n                Console.WriteLine(\"\
  Exception caught\");\n            } finally {\n                Console.WriteLine(\"\
  Exception is not handled\");\n            }\n        }\n        public static void\
  \ Main() {\n            ThreadStart t1 = new ThreadStart(ChildThread);\n       \
  \     Console.WriteLine(\"Creating child thread\");\n            Thread t2 = new\
  \ Thread(t1);\n            t1.Start(); //主线程停止\n            Thread.Sleep(2000);\
  \ //子线程中止\n            Console.WriteLine(\"Aborting child thread\");\n         \
  \   t2.Abort();\n            Console.Read();\n        }\n    }\n}\n```\n\n\n\n\n\
  当代码编译并执行时，输出如下：\n\n```\nCreating child thread\nChild Thread started\n0\n1\nAborting\
  \ child thread\nException caught\nException is not handled\n```\n\n# C# 的参考链接\n\n\
