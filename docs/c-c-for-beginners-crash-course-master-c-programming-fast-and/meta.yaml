    User is an adult\");\n            }\n        }\n    }\n}\n```\n\n在上面的代码示例中，指定了条件\
    \ ( age < 18 )。因此，这里的变量 age 必须满足小于 18 的条件才能使条件为 *True*，否则将执行 else 块。\n\n### else\
    \ if else 语句\n\n一个 **if** 语句后面也可以跟一个 **else if else** 结构。可以使用 if else if 语句检查多个条件。\n\
    \n**语法**\n\n```\nif (boolean_expression 1)\n{\n    /*如果布尔表达式 1 为 true，则执行此语句*/\n\
    }\nelse if(boolean_expression 2)\n{\n    /* 如果布尔表达式 2 为 true，则执行此语句*/\n}\nelse\
    \ if(boolean_expression 3)\n{\n    /* 如果布尔表达式 3 为 true，则执行此语句*/\n}\nelse\n{\n\
    \    /* 如果没有条件为 true，则执行此语句*/\n}\n```\n\n### else if else 语句示例\n\n**示例 9：**\n\n\
    ```csharp\nusing System;\nnamespace ifelse\n{\n    class Program\n    {\n    \
    \    static void Main(string[] args)\n        {\n            int x = 30;\n\n \
    \           if(x == 100)\n            {\n                Console.WriteLine(\"\
    The value is 100\");\n            }\n            else if(x == 20)\n          \
    \  {\n                Console.WriteLine(\"The value is 20\");\n            }\n\
    \            else if(x == 10)\n            {\n                Console.WriteLine(\"\
    The value is 10\");\n            }\n            else\n            {\n        \
    \        Console.WriteLine(\"No matching value found\");\n            }\n    \
    \        Console.WriteLine(\"Value of x is:{0}\",x);\n            Console.Read();\n\
    \        }\n    }\n}\n```\n\n在上面的示例中，指定了值 x = 30。如果存在与 x 值匹配的表达式，则执行相应的块。如果没有表达式匹配，则执行\
    \ **else** 块。\n\n## 6.3 嵌套 if 语句\n\n嵌套 **if** 语句在一个 **if** 或 **else if** 语句内部包含另一个\
    \ **if** 或 **else** 语句。\n\n**嵌套 if 语句的语法**\n\n```\nif(boolean_expression1)\n{\n\
    \    /*如果表达式 1 为 true，则执行此语句*/\n    if(boolean_expression2)\n    {\n        /*如果表达式\
    \ 2 为 true，则执行此语句*/\n    }\n}\n```\n\n**嵌套 if 语句示例**\n\n![](img/c133ae999967b1fbceab3bccc1cb1d4f_46_0.png)\n\
    \n在上面的代码中，为 x 和 y 变量赋值。检查 if 语句内部的值。如果相同，则执行内部语句，否则控制流将移出循环。\n\n## 6.4 Switch\
    \ 语句\n\nSwitch 语句有助于高效地对变量进行多个条件评估。每个条件称为一个 *case*，并检查被切换的变量是否匹配 **switch case**。\n\
    \n**语法：**\n\n```\nswitch(Expression)\n{\n        case ConstantExpression1:\n \
    \               statements;\n        break;\n        case ConstantExpression2:\n\
    \                statements;\n        break;\n        ...... \n        case ConstantExpression_n:\n\
    \                statements;\n        break;\n        default:\n             \
    \   statements;\n                break;\n}\n```\n\nswitch 语句中添加的规则如下：\n\n- switch\
    \ 语句中的表达式必须是整数或类类型。\n- 用户可以在 switch 语句中添加任意数量的 case 语句。\n- **ConstantExpression**\
    \ 的数据类型必须与 switch 中的表达式相似。\n- 当表达式与 ConstantExpression 匹配时，该 **case** 内的代码将被执行，并将遇到\
    \ **break** 关键字，这将强制执行退出 **switch 语句**。\n- 每个 case 不需要 **break** 关键字。\n- 可选的 **default**\
    \ case 出现在 switch 的末尾，并作为表达式与任何 **ConstantExpressions** 都不匹配时的备用方案。\n\n**流程图**\n\
    \n![](img/c133ae999967b1fbceab3bccc1cb1d4f_49_0.png)\n\n### switch 语句示例\n\n```csharp\n\
    using System;\nnamespace switchcase\n{\n    class Program\n    {\n        static\
    \ void Main(string[] args)\n        {\n            char grade = 'A';\n       \
    \     switch(grade)\n            {\n                case 'C':\n              \
    \      Console.WriteLine(\"Fair\");\n                    break;\n            \
    \    case 'B':\n                    Console.WriteLine(\"Good\");\n           \
    \         break;\n                case 'A':\n                    Console.WriteLine(\"\
    Excellent\");\n                    break;\n                default:\n        \
    \            Console.WriteLine(\"No matching grade\");\n                    break;\n\
    \            }\n            Console.WriteLine(\"Grade is {0}\",grade);\n     \
    \       Console.ReadLine();\n        }\n    }\n}\n```\n\n在上面的代码中，为 grade 赋值。它与不同的\
    \ switch case 进行匹配。如果值与已声明的 case 之一匹配，则显示相应的消息。如果没有表达式匹配，则执行 *default* case。\n\
    \n## 6.5 嵌套 switch 语句\n\n用户可以切换外部 switch 语句序列的一部分。switch 中的公共值不会冲突。\n\n**语法：**\n\
    \n```\nswitch(c1)\n{\n    case 'A':\n        Console.WriteLine(\"A is the part\
    \ of outer switch\");\n        switch(c2)\n        {\n            case 'A':\n\
    \                Console.WriteLine(\" A is the part of inner switch\");\n    \
    \            break;\n            case 'B':\n                // statements\n  \
    \              break;\n        }\n        break;\n    case 'B':\n        // statements\n\
    \        break;\n}\n```\n\n### 嵌套 switch 语句示例\n\n```csharp\nusing System;\nnamespace\
    \ switchcase\n{\n    class Program\n    {\n        static void Main(string[] args)\n\
    \        {\n            char grade ='A';\n            switch(grade)\n        \
    \    {\n                case 'C':\n                    Console.WriteLine(\"Fair\"\
    );\n                    break;\n                case 'B':\n                  \
    \  Console.WriteLine(\"Good\");\n                    break;\n                case\
    \ 'A':\n                    Console.WriteLine(\"Excellent\");\n              \
    \      break;\n                default:\n                    Console.WriteLine(\"\
    No matching grade\");\n                    break;\n            }\n           \
    \ Console.WriteLine(\"Grade is {0}\", grade);\n            Console.ReadLine();\n\
    \        }\n    }\n}\n```\n\n**示例 12：**\n\n```csharp\nusing System;\nnamespace\
    \ nestedswitch\n{\n    class Program\n    {\n        static void Main(string[]\
    \ args)\n        {\n            int x = 20;\n            int y = 40;\n\n     \
    \       switch(x)\n            {\n                case 20:\n                 \
    \   Console.WriteLine(\"Part of outer switch\");\n                    switch(y)\n\
    \                    {\n                        case 40:\n                   \
    \         Console.WriteLine(\"Part of inner switch\");\n                     \
    \       break;\n                    }\n                    break;\n          \
    \  }\n            Console.WriteLine(\"Value of x is :{0}\", x);\n            Console.WriteLine(\"\
    Value of y is: {0}\", y);\n            Console.Read();\n        }\n    }\n}\n\
    ```\n\n在上面的代码中，为变量 x 和 y 赋值。如果变量 x 的值与表达式匹配，则执行 switch case 内的语句，否则控制流将移出 case\
    \ 结构。\n\n## 第 7 章 C# 中的循环\n\n循环结构用于反复执行一行或多行代码。为复杂的执行提供了各种控制结构。\n\n![](img/c133ae999967b1fbceab3bccc1cb1d4f_54_0.png)\n\
    \n### 7.1 While 循环\n\n**while** 循环包含一个条件表达式，在执行 while 循环内部的逻辑语句之前必须匹配该表达式。如果一条语句匹配该表达式，则它将运行循环内的代码，然后返回到条件表达式以重新检查该语句是否仍与表达式匹配。如果再次匹配，则循环将再次执行，否则将完全跳过循环。\n\
    \n让我们来看一下 while 循环的语法。\n\n**语法：**\n\n```\nwhile (expression)\n{\n    statements;\n\
    }\n```\n\n**流程图**\n\n![](img/c133ae999967b1fbceab3bccc1cb1d4f_55_0.png)\n"
