    - 6.4 Switch statement\n- 6.5 Nested switch statement\n\n### Chapter 7 Loops in\
    \ C#\n- 7.1 While loop\n- 7.2 For loop\n- 7.3 Do while loop\n- 7.4 Break statement\n\
    - 7.5 Continue statement\n\n### Chapter 8 Classes and Methods in C#\n- 8.1 Class\
    \ declaration\n    - C# constructors\n    - C# destructors\n- 8.2 Defining methods\n\
    - 8.3 Calling methods\n- 8.4 Passing parameters to method\n- 8.5 Recursive method\
    \ call\n\n### Chapter 9 Arrays in C#\n- 9.1 Introduction to arrays\n- 9.2 Arrays\
    \ declaration\n- 9.3 Initializing and adding values\n- 9.4 Accessing array elements\n\
    - 9.5 Foreach loop\n- 9.6 Different C# arrays\n\n### Chapter 10 Strings in C#\n\
    - 10.1 Creation of string\n- 10.2 Properties and methods of string class\n- 10.3\
    \ Examples demonstrating the string functionality\n\n### Chapter 11 Encapsulation\
    \ and Polymorphism\n- 11.1 Introduction to encapsulation\n- 11.2 Access specifier\
    \ in C#\n- 11.3 Polymorphism\n- 11.4 Static Polymorphism\n- 11.5 Dynamic Polymorphism\n\
    \n### Chapter 12 Inheritance and Interfaces\n- 12.1 Introduction to Inheritance\n\
    - 12.2 Base and derived classes\n- 12.3 Base class initialization\n- 12.4 Interfaces\
    \ in C#\n- 12.5 Multiple inheritance in C#\n\n### Chapter 13 Operator overloading\
    \ and exception handling\n- 13.1 Introduction to Operator Overloading\n- 13.2\
    \ Different operators in overloading\n- 13.3 Introduction to exception handling\n\
    - 13.4 Exception classes in C#\n- 13.5 Exception handling\n- 13.6 User defined\
    \ exceptions\n\n### Chapter 14 Multithreading\n- 14.1 Thread in C#\n- 14.2 Life\
    \ cycle of a thread\n- 14.3 Main thread\n- 14.4 Properties and methods of the\
    \ Thread class\n- 14.5 Creating and managing threads\n- 14.6 Destroying threads\n\
    \n- Reference links on C#\n- Conclusion\n\n## Chapter 1 Introduction to C#\n\n\
    ### 1.1 Overview of C#\n\nC# is an object oriented, type safe high level programming\
    \ language. It has been developed by Microsoft during the development of the .NET\
    \ framework. C# was developed for the Common Language Infrastructure (CLI), this\
    \ infrastructure was created to allow programs from various other high level languages\
    \ to work together without the need to rewrite those programs entirely. The CLI\
    \ contains a various executable programs referred simply as executables and are\
    \ housed and ran in a system called the runtime environment.\n\nAll the programs\
    \ created in .Net framework execute in an environment that handles the runtime\
    \ requirements. The Common Language Runtime (CLR) provides the virtual machine,\
    \ which helps the programmers not to consider the CPU specifications. The class\
    \ library and CLR make the .NET framework.\n\n### 1.2 Programming features of\
    \ C#\n\n- It is simple, advanced, object oriented language\n- It contains data\
    \ types and classes common for all the .NET languages\n- The Common Language Runtime\
    \ (CLR) is similar to the Java Virtual Machine (JVM)\n- C# provides support for\
    \ encapsulation, inheritance, polymorphism, and interfaces\n- Visual Studio provides\
    \ support to VC++, Visual Basic, Vbscript, and Jscript\n- .NET consists of class\
    \ library and common execution engine\n- Garbage collection, automatic memory\
    \ management, interoperability are inbuilt in C#\n- User can develop console,\
    \ windows and web applications using C#\n\n### 1.3 C# Environment\n\nC# is a part\
    \ of .NET framework. It is used for creating .NET applications. Using .NET framework,\
    \ user can design, deploy and develop the applications. Robust applications can\
    \ be easily built using the simple programming model.\n\n#### Components of .NET\
    \ framework\n\nThe .NET framework diagram containing several components is as\
    \ shown:\n\n![](img/c133ae999967b1fbceab3bccc1cb1d4f_9_0.png)\n\nThe .NET framework\
    \ consists of the following components:\n\n- Common Language Runtime\n- .NET framework\
    \ base class library\n- Common Language Specification\n- User and Program interfaces\n\
    \n#### Common Language Runtime (CLR)\n\nThe core component of the .NET framework\
    \ is the CLR. It is an environment where the programs are executed. The code in\
    \ CLR is translated into Intermediate Language (IL). This IL code is then used\
    \ across different platforms.\n\nThe IL code is converted into machine language\
    \ by the Just in Time (JIT) compiler. The compiler checks for the type safety.\
    \ This ensures objects are accessed in a compatible way."
