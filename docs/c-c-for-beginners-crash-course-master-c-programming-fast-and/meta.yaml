  - "[PAGE 55]\n\n# # 7.1 While loop\n\nA **while** loop consists of a conditional\
    \ expression that must be matched before the logical statements inside the while\
    \ loop can be executed. If a statement matches the expression then it will run\
    \ the code inside the loop and then return back to the conditional expression\
    \ to re-check whether the statement still matches the expression. If it matches\
    \ again then the loop will execute again otherwise it will skip the loop completely.\n\
    \nLet us visit the syntax of a while loop.\n\n**Syntax:**\n\n```\nwhile (expression)\n\
    {\n    statements;\n}\n```\n\n**Flow Diagram**\n\n![](img/c133ae999967b1fbceab3bccc1cb1d4f_55_0.png)"
- md: "## Example of while loop\n\n```csharp\nusing System;\nnamespace whileloop\n\
    {\n    class Program\n    {\n        static void Main(string[] args)\n       \
    \ {\n            int var;\n            var=50;\n            while(var<150)\n \
    \           {\n                Console.WriteLine(\"Value of variable is:{0}\"\
    ,var);\n                var=var+10;\n            }\n        }\n    }\n}\n```\n\
    \nIn the preceding code, the variable var is initialized with value 50. The **while**\
    \ loop checks for the condition. If the condition is less than 150, the statements\
    \ inside the loop are executed. If **false**, the control does not enter the while\
    \ loop.\n\n## 7.2 For loop\n\nA **for** loop is used to execute a block of statements\
    \ for a specific number of times.\n\n**Syntax:**\n\n```csharp\nfor (initialization;\
    \ condition; increment/decrement)\n{\n    statement(s);\n}\n```\n\nWhere,\n\n\
    - **initialization** is used to declare and initialize the loop control variables.\
    \ It is executed at the beginning of the loop\n- **condition** checks for the\
    \ expression. If the value is true, the body of the loop is executed. If false,\
    \ the control jumps out from the loop\n- **increment/decrement** is used for increasing\
    \ or decreasing the variable value.\n\n### Flow Diagram\n\n![](img/c133ae999967b1fbceab3bccc1cb1d4f_58_0.png)\n\
    \n### Example of for loop\n\n```csharp\nusing System;\nnamespace forloop\n{\n\
    \    class Program\n    {\n        static void Main(string[] args)\n        {\n\
    \            int i;\n            for(int i=1;i<=10;i++)\n            {\n     \
    \           Console.WriteLine(\"Value of variable is:{0}\",i);\n            }\n\
    \        }\n    }\n}\n```\n\nIn the above code, value for variable i is declared.\
    \ **For** loop contains assignment, condition, increment. If the condition is\
    \ *true*, the value is incremented. The statement inside for loop is executed.\
    \ Once the condition is *false*, the control moves out of the loop.\n\n## 7.3\
    \ Do while loop\n\nThe **do...while** loop construct is similar to the **while**\
    \ loop. Both the loops will continue until the condition is false. The difference\
    \ is that the statements in a do...while loop are executed at least once, as the\
    \ statements in the block are executed before the condition is checked.\n\n**Syntax:**\n\
    \n```csharp\ndo\n{\n    Statements;\n}while(expression);\n```\n\n### Flow Diagram\n\
    \n![](img/c133ae999967b1fbceab3bccc1cb1d4f_60_0.png)\n\n### Example of do while\
    \ loop\n\n**Example 15:**\n\n```csharp\nusing System;\nnamespace dowhile\n{\n\
    \    class Program\n    {\n        static void Main(string[] args)\n        {\n\
    \            int x=1;\n            do\n            {\n                Console.WriteLine(\"\
    Value of x is:{0}\",x);\n                x=x+1;\n            }while(x<10);\n \
    \           Console.ReadLine();\n        }\n    }\n}\n```\n\nIn the above code,\
    \ the variable x is assigned with value 1. The **do** loop prints the statements\
    \ inside the block. Once the condition in the while loop is false, the statements\
    \ in the do while loop will not be executed.\n\n## 7.4 Break statement\n\nThe\
    \ **break** statement is used to exit from the loop. When this statement is encountered,\
    \ the loop is terminated, the control resumes to the next statement following\
    \ loop.\n\n**Syntax:**\n\n```csharp\nbreak;\n```\n\n### Flow Diagram\n\n![](img/c133ae999967b1fbceab3bccc1cb1d4f_62_0.png)\n\
    \n### Example of break statement\n\n**Example 16:**\n\n```csharp\nusing System;\n\
    namespace breakloop\n{\n    class Program\n    {\n        static void Main(string[]\
    \ args)\n        {\n            int i=11;\n            while(i<15)\n         \
    \   {\n                Console.WriteLine(\"value of i:{0}\",i);\n            \
    \    i++;\n                if(i>13)\n                {\n                    break;\n\
    \                }\n            }\n            Console.ReadLine();\n        }\n\
    \    }\n}\n```\n\nIn the code example, value of variable i is assigned to 11.\
    \ The **while** loop checks for the condition of i. If the condition is *true*,\
    \ the statements in the while loop are executed. The value for i is incremented.\n\
    \nIf the loop checks for value i, once the value of i is greater than 13, the\
    \ **break** statement is executed and the control moves out of the loop.\n\n##\
    \ 7.5 Continue statement\n\nThe continue statement is similar to the break statement,\
    \ but instead of breaking out of the loop the **continue** forces the next iteration\
    \ of the loop to take place, skipping any code in between.\n\n**Syntax:**\n\n\
    ```csharp\ncontinue;\n```\n\n### Flow Chart\n\n![](img/c133ae999967b1fbceab3bccc1cb1d4f_64_0.png)\n\
    \n### Example of Continue statement\n\n**Example 17:**\n\n```csharp\nusing System;\n\
    namespace continue_demo\n{\n    class Program\n    {\n        static void Main(string[]\
    \ args)\n        {\n            int i=45;\n            do\n            {\n   \
    \             if(i==50)\n                {\n                    i=i+1;\n     \
    \               continue;\n                }\n                Console.WriteLine(\"\
    Value of i is:{0}\",i);\n                i++;\n            }\n            while(i<60);\n\
    \            Console.ReadLine();\n        }\n    }\n}\n```\n\nSo in the code example\
    \ above we can see a combination of the **do-while** loop and **continue** in\
    \ action. We can see that i is initially set as a 45 when it enters the statements\
    \ inside the **do**. At this point i checked to see if it matches 50, it doesn’t\
    \ so the value of i is outputted in a message and i is incremented by one.\n\n\
    This process happens until i is 50, at which point i will be incremented by one\
    \ and hit the **continue** keyword which will skip the rest of the code in the\
    \ **do** section and move straight to the **while** conditional expression.\n\n\
    Once i reaches 61 the **while** conditional statement will not match and the execution\
    \ will leave the loop.\n\n## Chapter 8 Classes and Methods in C#\n\n### 8.1 Class\
    \ declaration\n\nIn C# classes are the primary building blocks of the language.\
    \ It provides predefined set of variables and methods. Objects are defined as\
    \ an instance of a class, therefore the methods inside the class determine what\
    \ can be executed on the object.\n\n### Class Definition\n\nA class definition\
    \ starts with keyword **class** followed by the actual class name. The class variables\
    \ and methods are all enclosed in between the curly brackets; this area is also\
    \ called the class body.\n\n**Syntax:**\n\n```csharp\n<access specifier>class\
