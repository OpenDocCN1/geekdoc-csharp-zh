  md: "# 13.5 Exception handling\n\nThe structured solution in the form of **try**\
    \ and **catch** block is provided by C#. The core program statements are divided\
    \ from the error handling statements. The **finally** block is used to handle\
    \ errors.\n\nExample:\n\n```\nExample 51:\n\nusing System;\nnamespace DivNumbers\n\
    {\n    class Divide\n    {\n        int output;\n        Divide()\n        {\n\
    \            output = 0;\n        }\n\n        public void division(int no1, int\
    \ no2)\n        {\n            try\n            {\n                output = no1\
    \ / no2;\n            }\n            catch(DivideByZeroException e)\n        \
    \    {\n                Console.WriteLine(\"Exception handled:{0}\",e);\n    \
    \        }\n            finally\n            {\n                Console.WriteLine(\"\
    Output is:{0}\",output);\n            }\n        }\n\n        public static void\
    \ Main(string[] args)\n        {\n            Divide d = new Divide();\n     \
