    \ Introduction to Inheritance\n\nThe concept of inheritance is fundamental to\
    \ not only C# but also to most other programming languages. It allows the user\
    \ to create classes that *inherit* data members and methods from other classes.\
    \ Inheritance can save the user time by allowing them to create several popular\
    \ and well-used methods in a core class and have other classes inherit that core\
    \ class and all its methods. This stops the user from repeating the same method\
    \ in every class.\n\n### 12.2 Base and derived classes\n\nThe structure of inheritance\
    \ can be summed up in a few ways, for this example we have three classes **A**,\
    \ **B** and **C**. The class **B** is derived from the class **A**. The class\
    \ **C** is derived from class **B**. So what does this mean?\n\nIf we symbolize\
    \ the relationship of these classes then we could show it like this:\n\nClass\
    \ **A** → Class **B** → Class **C**\n\n- Since class **B** is derived from class\
    \ **A**, we say that class **A** is the parent of class **B**. We can also say\
    \ that class **B** is the child of class **A**.\n- Since class **C** is derived\
    \ from class **B**, we say that class **B** is the parent of class **C**. We can\
    \ also say that class **C** is the child of class **B**.\n- Since class **C**\
    \ is derived from class **B**, which in turn is derived from class **A**, we say\
    \ that class **A** is the grandparent of class **C**. We can also say that class\
    \ **C** is the grandchild of class **A**.\n- In this instance since class **A**\
    \ does not inherit from other classes, this class would be called the **base**\
    \ class. Class **B** and class **C** would be declared as derived classes.\n\n\
    In this instance we have used the metaphor of parent and child to represent the\
    \ relationship between the different classes but you will also encounter other\
    \ metaphors such as super class (base class) and sub classes (derived classes)\
    \ that describe the same relations.\n\nThe following is the way we would declare\
    \ these relationships in code:\n\n```csharp\n<access – specifier> class <base_class>\n\
    {\n    .....\n}\nclass <derived_class> : <base_class>\n{\n    .....\n}\n```\n\n\
    **Example 46:**\n\n```csharp\nusing System;\nnamespace inheritance1\n{\n    class\
