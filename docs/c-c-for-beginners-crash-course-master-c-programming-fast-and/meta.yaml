- md: "## Chapter 10 Strings in C#\n\n### 10.1 Creation of string\n\nA string in C#\
    \ is an array of characters. The **string** keyword is used for declaring the\
    \ variable. The keyword is an alias for **System.String** class.\n\n### String\
    \ Object creation\n\nThere are various methods used for string creation. They\
    \ are:\n\n- Retrieving a property or calling a method returning a string\n- Use\
    \ of string class constructor\n- Use of string concatenation operator (+)\n- Calling\
    \ formatted method for converting a value or an object to the string representation\n\
    - Assigning a string literal to the string variable\n\n**Example:**\n\n```csharp\n\
    using System;\nnamespace StringType\n{\n    class Program\n    {\n        static\
    \ void Main(string[] args)\n        {\n            //string literal and concatenation\n\
    \            string name,location;\n            name = \"Harry\";\n          \
    \  location = \"USA\";\n            string value = name + location;\n        \
    \    Console.WriteLine(\"The value is:{0}\",value);\n\n            //string constructor\n\
    \            char[] vowels = {'a','e','i','o','u'};\n            string item =\
    \ new string(vowels);\n            Console.WriteLine(\"The item contains values:{0}\"\
    ,item);\n\n            //formatting method for value conversion\n            DateTime\
    \ dt = new DateTime(2014,12,10,15,34,1);\n            string msg = string.Format(\"\
    Message sent at {0:t} on {0:D}\",dt);\n\n            //method returning value\n\
    \            string[] array = {\"Welcome\",\"User\"};\n            string result\
    \ = String.Join(\"\",array);\n            Console.WriteLine(\"Message is:{0}\"\
    ,result);\n        }\n    }\n}\n```\n\nWhen the code is compiled and executed,\
    \ the output is:\n\nThe value is: Harry USA\nThe item contains values: aeiou\n\
    Message sent at 2.30 PM on Tuesday, June 02, 2015\nMessage is: Welcome User\n\n\
    ### 10.2 Properties and methods of string class\n\n**Properties of string class**\n\
    \n- **Chars:** Gets the **Char** object at specific position in the **String**\
    \ object\n- **Length:** Gets the **number of characters** in the String object\n\
    \n**Methods of string class**\n\n- **public bool Equals(string value)**\n  Checks\
    \ whether the current String object and the specified object have same value\n\
    - **public string Insert(int startIndex, string value)**\n  Returns a new string\
    \ in which the specified one is inserted at a specific index position\n- **public\
    \ string Replace(char oldchar, string newValue)**\n  All the occurrences of a\
    \ specific character in the string object are replaced with Unicode character\
    \ and a new string is returned.\n- **public int LastIndexOf(string value)**\n\
    \  The zero based index position of the last occurrence of the Unicode character\
    \ in the string object is returned\n- **public string Trim()**\n  All leading\
    \ and trailing white space characters from the object are returned.\n- **public\
    \ static Compare(string str1, string str2, bool IgnoreCase)**\n  Compares the\
    \ two strings and an integer value stating the relative position in sort order\n\
    - **public static string Concat(string str1, string str2)**\n  Concatenates the\
    \ two string objects\n- **public string[] Split (char[] separator, int count)**\n\
    \  A string array containing the substrings in the current string object is returned.\
    \ It is delimited by the elements of a specific Unicode character array. The number\
    \ of substrings returned is specified by the int parameter.\n- **public bool Contains(string\
    \ value)**\n  Returns value stating the specified string object occurs in the\
    \ string\n- **public static string Copy(string str)**\n  Creates a new String\
    \ object with the same value as the specified string\n- **public string ToUpper()**\n\
    \  Copy of the string converted into uppercase is returned\n- **public int IndexOf(string\
    \ value)**\n  Returns the zero – based index of the first occurrence of the specified\
    \ string in the instance\n- **public string Remove(int startindex)**\n  It removes\
    \ the characters in the current instance, beginning at the specified position\
    \ and moving to the last one. It returns a string.\n- **public char[] ToCharArray()**\n\
    \  A Unicode character array with all the characters in the current string object\
    \ is returned\n- **public string ToLower()**\n  Copy of the string converted into\
    \ lowercase is returned\n\n## 10.3 Examples demonstrating the string functionality\n\
    \nString Comparison\n\n```csharp\nusing System;\nnamespace string1\n{\n    class\
    \ Program\n    {\n        static void Main(string[] args)\n        {\n       \
    \     string string1 = \"A string named as string1\";\n            string string2\
    \ = \"A string named as string2\";\n            if(String.Compare(string1,string2)\
    \ == 0)\n            {\n                Console.WriteLine(string1+\"and\"+string2+\"\
    equal\");\n            }\n            else\n            {\n                Console.WriteLine(string1+\"\
    and\"+string2+\" not equal\");\n            }\n            Console.Read();\n \
    \       }\n    }\n}\n```\n\nWhen the code is compiled and executed, the output\
    \ is:\n\nA string named as string1 and A string named as string2 are not equal\n\
    \nJoining strings\n\n```csharp\nusing System;\nnamespace string1\n{\n    class\
    \ Program\n    {\n        static void Main(string[] args)\n        {\n       \
    \     string[] str1 = new string[]{\"Set your aims high\",\n            \"Rome\
    \ was not built in a day\",\n            \"Save Time\"};\n            string str\
    \ = String.Join(\"\\n\",str1);\n            Console.WriteLine(str);\n        \
    \    Console.Read();\n        }\n    }\n}\n```\n\nWhen the code is compiled and\
    \ executed, the output is:\n\nSet your aims high\nRome was not built in a day\n\
    Save Time\n\n### String containing value\n\n```csharp\nusing System;\nnamespace\
    \ string1\n{\n    class Program\n    {\n        static void Main(string[] args)\n\
    \        {\n            string str = \"A new user\";\n            if(str.Contains(\"\
    user\"))\n            {\n                Console.WriteLine(\"The value 'user'\
    \ is present\");\n            }\n            Console.Read();\n        }\n    }\n\
    }\n```\n\nWhen the code is compiled and executed, the output is:\n\nThe value\
    \ 'user' is present\n\n## Chapter 11 Encapsulation and Polymorphism\n\n### 11.1\
    \ Introduction to encapsulation\n\n**Encapsulation** is the process of enclosing\
    \ data and function within a physical or logical package. It helps the developers\
    \ to prevent the access to the essential details of an application. It binds the\
    \ code and data together.\n\n**Abstraction** states that all the information is\
    \ present, but only **relevant information** is provided to the user.\n\nAbstraction\
    \ and encapsulation are related features. Encapsulation assists abstraction by\
    \ providing means of hiding the non-essential details. Using encapsulation some\
    \ information is visible and others are hidden.\n\n### 11.2 Access specifier in\
    \ C#\n\nAn access specifier defines the scope of a class member. The member is\
    \ used for referring the functions and variables of a class. A program consists\
    \ of one or more classes. Some member of the class needs to be accessed by other\
    \ classes.\n\n### Types of Access Specifier\n\nThe following access specifiers\
    \ are supported by C#.\n\n- public\n- private\n- protected\n- internal\n- protected\
    \ internal\n\n### Public Access Specifier\n\n**Public** access specifier allows\
    \ the class to expose the member variables and functions with other classes. The\
    \ member declared as public can be accessed from outside the class.\n\n### Example\
    \ of public access specifier\n\n```csharp\nExample 38:\nusing System;\nnamespace\
    \ public1\n{\n    class User\n    {\n        //member variables\n        public\
    \ string name;\n        public int age;\n        public void AddValue()\n    \
    \    {\n            Console.WriteLine(\"Enter the user name:\");\n           \
    \ name = Console.ReadLine();\n            Console.WriteLine(\"Enter the age:\"\
    );\n            age = Convert.ToInt32(Console.ReadLine());\n        }\n      \
    \  public void Show()\n        {\n            Console.WriteLine(\"User name is:{0}\"\
    , name);\n            Console.WriteLine(\"Age is:{0}\", age);\n        }\n   \
    \ }\n    class Program\n    {\n        static void Main(string[] args)\n     \
    \   {\n            User u = new User();\n            u.AddValue();\n         \
    \   u.Show();\n            Console.Read();\n        }\n    }\n}\n```\n\nWhen the\
    \ code is compiled and executed, the output is:\n\n```\nEnter the user name:\n\
    Mark\nEnter the age:\n20\nUser name is: Mark\nAge is: 20\n```\n\n### Private Access\
    \ Specifier\n\nThe **private** access specifier allows the user to hide classes'\
    \ member variables and functions from other class objects and functions. The private\
    \ members are not visible from outside the class. Only the class functions based\
    \ within the class itself can access the private entity. Objects or instances\
    \ of the class cannot access any private variables or functions as they are declared\
    \ as external to the class.\n\n**Example:**\n\n```csharp\nExample 39:\nusing System;\n\
    namespace private1\n{\n    class Student\n    {\n        //member variables\n\
    ```"
  mdcn: "\n## 第10章 C#中的字符串\n\n### 10.1 字符串的创建\n\nC#中的字符串是一个字符数组。**string**关键字用于声明变量。该关键字是**System.String**类的别名。\n\
    \n### 字符串对象的创建\n\n创建字符串有多种方法。它们是：\n\n-   检索属性或调用返回字符串的方法\n-   使用字符串类构造函数\n-  \
    \ 使用字符串连接运算符（+）\n-   调用格式化方法将值或对象转换为字符串表示形式\n-   将字符串字面量赋值给字符串变量\n\n**示例：**\n\n\
    ```csharp\nusing System;\nnamespace StringType\n{\n    class Program\n    {\n\
    \        static void Main(string[] args)\n        {\n            //string literal\
    \ and concatenation\n            string name,location;\n            name = \"\
    Harry\";\n            location = \"USA\";\n            string value = name + location;\n\
    \            Console.WriteLine(\"The value is:{0}\",value);\n\n            //string\
    \ constructor\n            char[] vowels = {'a','e','i','o','u'};\n          \
    \  string item = new string(vowels);\n            Console.WriteLine(\"The item\
    \ contains values:{0}\",item);\n\n            //formatting method for value conversion\n\
    \            DateTime dt = new DateTime(2014,12,10,15,34,1);\n            string\
    \ msg = string.Format(\"Message sent at {0:t} on {0:D}\",dt);\n\n            //method\
    \ returning value\n            string[] array = {\"Welcome\",\"User\"};\n    \
    \        string result = String.Join(\"\",array);\n            Console.WriteLine(\"\
    Message is:{0}\",result);\n        }\n    }\n}\n```\n\n代码编译并执行后，输出为：\n\nThe value\
    \ is: Harry USA\nThe item contains values: aeiou\nMessage sent at 2.30 PM on Tuesday,\
    \ June 02, 2015\nMessage is: Welcome User\n\n### 10.2 字符串类的属性和方法\n\n**字符串类的属性**\n\
    \n-   **Chars：** 获取**String**对象中特定位置的**Char**对象。\n-   **Length：** 获取String对象中的**字符数**。\n\
    \n**字符串类的方法**\n\n-   **public bool Equals(string value)**\n    检查当前String对象和指定对象是否具有相同的值。\n\
    -   **public string Insert(int startIndex, string value)**\n    返回一个新字符串，其中指定的字符串被插入到特定的索引位置。\n\
    -   **public string Replace(char oldchar, string newValue)**\n    字符串对象中特定字符的所有出现都会被替换为Unicode字符，并返回一个新字符串。\n\
    -   **public int LastIndexOf(string value)**\n    返回字符串对象中Unicode字符最后一次出现的从零开始的索引位置。\n\
    -   **public string Trim()**\n    从对象中移除所有前导和尾随空白字符。\n-   **public static Compare(string\
    \ str1, string str2, bool IgnoreCase)**\n    比较两个字符串，并返回一个表示排序顺序中相对位置的整数值。\n-\
    \   **public static string Concat(string str1, string str2)**\n    连接两个字符串对象。\n\
    -   **public string[] Split (char[] separator, int count)**\n    返回一个字符串数组，其中包含当前字符串对象中的子字符串。它由特定Unicode字符数组的元素分隔。返回的子字符串数量由int参数指定。\n\
    -   **public bool Contains(string value)**\n    返回一个值，指示指定的字符串对象是否出现在字符串中。\n-\
    \   **public static string Copy(string str)**\n    创建一个与指定字符串具有相同值的新String对象。\n\
    -   **public string ToUpper()**\n    返回转换为大写的字符串的副本。\n-   **public int IndexOf(string\
    \ value)**\n    返回指定字符串在当前实例中第一次出现的从零开始的索引。\n-   **public string Remove(int startindex)**\n\
    \    从当前实例中的指定位置开始移除字符，直到最后一个字符。返回一个字符串。\n-   **public char[] ToCharArray()**\n\
    \    返回一个包含当前字符串对象中所有字符的Unicode字符数组。\n-   **public string ToLower()**\n    返回转换为小写的字符串的副本。\n\
    \n## 10.3 演示字符串功能的示例\n\n字符串比较\n\n```csharp\nusing System;\nnamespace string1\n\
    {\n    class Program\n    {\n        static void Main(string[] args)\n       \
    \ {\n            string string1 = \"A string named as string1\";\n           \
    \ string string2 = \"A string named as string2\";\n            if(String.Compare(string1,string2)\
