    \ }\n}\n```\n\nIn the code example, the condition ( age < 18 ) is specified. So\
    \ here the variable age must meet the condition less than 18 for the condition\
    \ to be *True*, otherwise the else block is executed.\n\n### The else if else\
    \ statement\n\nAn **if** statement is also followed by an **else if else** construct.\
    \ Many conditions can be checked using if else if statement.\n\n**Syntax**\n\n\
    ```\nif (boolean_expression 1)\n{\n    /*If the Boolean expression 1 is true,\
    \ the statement is executed*/\n}\nelse if(boolean_expression 2)\n{\n    /* If\
    \ the Boolean expression 2 is true, the statement is executed*/\n}\nelse if(boolean_expression\
    \ 3)\n{\n    /* If the Boolean expression 3 is true, the statement is executed*/\n\
    }\nelse\n{\n    /* executes if none of the condition is true*/\n}\n```\n\n###\
    \ Example of else if else statement\n\n**Example 9:**\n\n```csharp\nusing System;\n\
    namespace ifelse\n{\n    class Program\n    {\n        static void Main(string[]\
    \ args)\n        {\n            int x = 30;\n\n            if(x == 100)\n    \
    \        {\n                Console.WriteLine(\"The value is 100\");\n       \
    \     }\n            else if(x == 20)\n            {\n                Console.WriteLine(\"\
    The value is 20\");\n            }\n            else if(x == 10)\n           \
    \ {\n                Console.WriteLine(\"The value is 10\");\n            }\n\
    \            else\n            {\n                Console.WriteLine(\"No matching\
    \ value found\");\n            }\n            Console.WriteLine(\"Value of x is:{0}\"\
    ,x);\n            Console.Read();\n        }\n    }\n}\n```\n\nIn the above example,\
    \ the value x = 30 is specified. If there is an expression that matches the value\
    \ of x, the appropriate block is executed. If none of the expression matches,\
    \ the **else** block is executed.\n\n## 6.3 Nested if statement\n\nThe nested\
    \ **if** statement contains one **if** or **else if** statement inside another\
    \ **if** or **else** statement.\n\n**Syntax for nested if statement**\n\n```\n\
    if(boolean_expression1)\n{\n    /*If the expression 1 is true, statement is executed*/\n\
    \    if(boolean_expression2)\n    {\n        /*If the expression 2 is true, statement\
    \ is executed*/\n    }\n}\n```\n\n**Example for nested if statement**\n\n![](img/c133ae999967b1fbceab3bccc1cb1d4f_46_0.png)\n\
    \nIn the above code, the value for x and y variables is assigned. The value inside\
    \ if statement is checked. If it is same, the inner statements are executed, else\
    \ the control moves out of the loop.\n\n## 6.4 Switch statement\n\nA switch statement\
    \ helps to evaluate a variable for multiple conditions efficiently. Every condition\
    \ is known as a *case* and the variable switched is checked for the **switch case**.\n\
    \n**Syntax:**\n\n```\nswitch(Expression)\n{\n        case ConstantExpression1:\n\
    \                statements;\n        break;\n        case ConstantExpression2:\n\
    \                statements;\n        break;\n        ...... \n        case ConstantExpression_n:\n\
    \                statements;\n        break;\n        default:\n             \
    \   statements;\n                break;\n}\n```\n\nThe rules added in the switch\
    \ statement are:\n\n- Expression in a switch statement must be an integer or of\
    \ a class type.\n- A user can add any number of case statements in a switch statement.\n\
    - The **ConstantExpression** must be of the data type similar to the expression\
    \ in the switch.\n- When the Expression matches the ConstantExpression, the code\
    \ inside that **case** will be executed and will hit the **break** keyword which\
    \ will force the execution out of the **switch statement**.\n- Every case does\
    \ not need a **break** keyword.\n- The optional **default** case appears at the\
    \ end of the switch and acts as a backup in case the expression does not match\
    \ any of the **ConstantExpressions**.\n\n**Flow Diagram**\n\n![](img/c133ae999967b1fbceab3bccc1cb1d4f_49_0.png)\n\
    \n### Example of switch statement\n\n```csharp\nusing System;\nnamespace switchcase\n\
    {\n    class Program\n    {\n        static void Main(string[] args)\n       \
    \ {\n            char grade = 'A';\n            switch(grade)\n            {\n\
    \                case 'C':\n                    Console.WriteLine(\"Fair\");\n\
    \                    break;\n                case 'B':\n                    Console.WriteLine(\"\
    Good\");\n                    break;\n                case 'A':\n            \
    \        Console.WriteLine(\"Excellent\");\n                    break;\n     \
    \           default:\n                    Console.WriteLine(\"No matching grade\"\
    );\n                    break;\n            }\n            Console.WriteLine(\"\
    Grade is {0}\",grade);\n            Console.ReadLine();\n        }\n    }\n}\n\
    ```\n\nIn the above code, the value of grade is assigned. It is matched with the\
    \ different switch cases. If the value matches from among the declared cases,\
    \ the corresponding message is displayed. If none of the expression matches, the\
    \ *default* case is executed.\n\n## 6.5 Nested switch statement\n\nUser can switch\
    \ part of the statement sequence of the outer switch. The common values in the\
    \ switches do not conflict.\n\n**Syntax:**\n\n```\nswitch(c1)\n{\n    case 'A':\n\
