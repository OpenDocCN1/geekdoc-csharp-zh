    \ for better understanding. Below is a list of keywords categorized into different\
    \ types.\n\n#### 1) Keywords for class, method, field and property\n\n- abstract\n\
    - extern\n- internal\n- internal\n- new\n- const\n- override\n- protected\n- private\n\
    - public\n- sealed\n- readonly\n- static\n- virtual\n- void\n\n#### 2) Keywords\
    \ for type conversions\n\n- explicit\n- implicit\n- as\n- is\n- operator\n- sizeof\n\
    - typeof\n\n#### 3) Keywords useful for program flow control\n\n- if\n- else\n\
    - for\n- foreach\n- in\n- case\n- break\n- continue\n- return\n- while\n- goto\n\
    - default\n- do\n- switch\n\n#### 4) Keywords used for built in types and enumerations\n\
    \n- bool\n- char\n- class\n- byte\n- decimal\n- enum\n- double\n- float\n- interface\n\
    - long\n- int\n- object\n- sbyte\n- short\n- string\n- uint\n- struct\n- ulong\n\
    - ushort\n\n#### 5) Keywords used for exception handling\n\n- try\n- catch\n-\
    \ throw\n- finally\n- checked\n- unchecked\n\n#### 6) Keywords used as literals,\
    \ method passing parameters\n\n- true\n- false\n- null\n- this\n- value\n- out\n\
    - params\n- ref\n\n#### 7) Keywords useful in function pointers, object allocation,\
    \ unmanaged code\n\n- delegate\n- event\n- new\n- stackalloc\n- unsafe\n\n###\
    \ 3.2 Data Types in C#\n\nData types are used to store the data in a specific\
    \ type. There are several built in data types that are used by the programmers\
    \ for declaring data.\n\nEvery data type has a limited set of options it can be,\
    \ these limited number of options are called the **data range** for the data type.\
    \ Listed below are the different data types present and the data range that they\
    \ can be:\n\n- **bool:** Used to represent the Boolean value. The values that\
    \ can be assigned are true or false.\n- **byte:** 8-bit unsigned integer. The\
    \ range of value for a byte data type is from 0 to 255.\n- **char:** 16-bit Unicode\
    \ character. The range of values is from U+0000 to U+ffff.\n- **double:** 64-bit\
    \ double precision floating point type. The range of values is from (+/-) 5.0\
    \ x 10^-324 to (+/-) 1.7 x 10^308.\n- **decimal:** 128 bit precise decimal values\
    \ with significant digits. The range of values is from (-7.9 x 10^28 to 7.9 x\
    \ 10^28) / 10^0 to 28.\n- **float:** 32 bit single precision floating point. The\
    \ range of values is from -3.4 x 10^38 to + 3.4 x 10^38.\n- **int:** 32-bit signed\
    \ integer type. It has range of values from -2,147,483,648 to 2,147,483,647.\n\
    - **long:** 64-bit signed integer type. It has range of values from -9,223,372,036,854,775,808\
    \ to 9,223,372,036,854,775,807.\n- **sbyte:** 8-bit signed integer type. It has\
    \ range of values from -128 to 127.\n- **short:** 16-bit signed integer type.\
    \ It has range of values from -32,768 to 32,767.\n- **uint:** 32-bit unsigned\
    \ integer type. It has range of values from 0 to 4,294,967,295.\n- **ulong:**\
    \ 64-bit unsigned integer type. It has range of values from 0 to 18,446,744,073,709,551,615.\n\
    - **ushort:** 16-bit unsigned integer type. It has range of values from 0 to 65,535.\n\
    \n## 3.3 Type conversion in C#\n\nType conversion is useful when the programmer\
    \ needs to convert from one data type to another. The type conversion is also\
    \ known as **type casting**. There are two types of type casting in C#. They are\
    \ **implicit type** conversion and **explicit type** conversion.\n\n### Implicit\
    \ type conversion\n\nThe implicit keyword is used for implicit conversions. They\
    \ do not need any casting operator. These conversions include small to large integral\
    \ type, from derived class to base class.\n\n### Explicit type conversion\n\n\
    The explicit conversions are done explicitly by users through the use of the pre-defined\
    \ functions. In these conversions, a cast operator is needed.\n\n```csharp\nusing\
    \ System;\nnamespace TypeConversion\n{\n    class Conversion\n    {\n        static\
    \ void Main(string[] args)\n        {\n            double d=10.243;\n        \
    \    int i;\n\n            i = (int)d;\n            Console.WriteLine(i);\n  \
    \          Console.Read();\n        }\n    }\n}\n```\n\nC# consists of type conversion\
    \ methods that are useful for users.\n\nThe following list shows the type conversion\
    \ methods.\n\n- **ToByte:** Used for converting a type to byte\n- **ToBoolean:**\
    \ Used for converting Boolean value\n- **ToDateTime:** Used for converting a type\
    \ to the date time type\n- **ToDouble:** Converts a type to double\n- **ToDecimal:**\
    \ Converts the floating point or integer to decimal type\n- **ToInt64:** Converts\
    \ a type to 64 bit integer\n- **ToSingle:** Converts the type to floating point\
    \ number\n- **ToString:** Converts the type to string type\n- **ToUInt64:** Converts\
    \ a type to an unsigned big integer\n\nThe following code snippet shows the conversion\
    \ of value type to Double type.\n\n```csharp\nusing System;\nnamespace type\n\
    {\n    class DoubleConversion\n    {\n        int a=10;\n        float f=30.05f;\n\
    \        bool b=false;\n\n        Console.WriteLine(a.ToDouble());\n        Console.WriteLine(f.ToDouble());\n\
    \        Console.WriteLine(b.ToDouble());\n        Console.Read();\n    }\n}\n\
    ```\n\n## Chapter 4 Variables and Constants\n\n### 4.1 Exploring variables in\
    \ C#\n\nA variable is name assigned to the memory location used by the programs.\
    \ Every variable has a data type associated with it. The data type determines\
    \ the size of the variable's memory used for storing within the memory.\n\nThe\
    \ data types provided by C# are distinguished as:\n\n1. Integral types: int, uint,\
    \ short, byte, sbyte, long, ulong, and char\n2. Floating point types: double,\
    \ float\n3. Decimal types: decimal\n4. Boolean type: true or false values\n5.\
    \ Nullable type: nullable data type\n6. Reference type: class\n\n#### Defining\
    \ Variables\n\nThe syntax for declaring the variables is:\n\n```\n<data_type>\
    \ <variable_list>;\n```\n\nWhere, **data_type** is a valid C# data type. It can\
    \ be int, char, float, double, or a user defined type. The **variable_list** contains\
    \ one or more identifiers.\n\nExamples of variables:\n\n```csharp\nint a,b,c;\n\
    char x,y;\nfloat price, totalcost;\ndouble area;\n```\n\n#### Initializing Variables\n\
    \nThe variables are initialized using an equal sign and followed by an expression.\
    \ The syntax for initializing variable is:\n\n```\nvariable_name = value;\n```\n\
    \nThe variables can be initialized in the declaration. The general form for initializing\
    \ the variable is:\n\n```\n<data_type> <variable_name> = value;\n```\n\nExamples\
    \ of variable initialization are:\n\n```csharp\nint a = 4;\nchar z='z';\ndouble\
    \ y = 12.145;\n```\n\nExample for demonstrating variable types:\n\n**Example 5:**\n\
    \n```csharp\nusing System;\nnamespace VariableDeclare\nclass Program\n{\n    static\
    \ void Main(string[] args)\n    {\n        int a;\n        short s;\n        double\
    \ d;\n\n        /*initializing variables*/\n        a=20;\n        s=5;\n    \
    \    d=a+s;\n        Console.WriteLine(\"a={0},b={1},d={2}\",a,s,d);\n       \
    \ Console.Read();\n    }\n}\n```\n\n#### Accepting values from user\n\nThe **Console**\
    \ class present in the **System** namespace provides **ReadLine()** function.\n\
    \nThe function is used for accepting input from the user and stored into variable.\n\
    \nExample:\n\n```csharp\nint no;\nno=Convert.ToInt32(Console.ReadLine());\n```\n\
    \nThe **Convert.ToInt32()** function converts the data entered by the user to\
    \ integer data type. The function accepts the data in string format.\n\n#### LValue\
    \ and RValue Expressions\n\nThe two types of expressions in C# are:\n\n- **lvalue:**\
    \ The expression is an lvalue appears on the left side of the assignment.\n- **rvalue:**\
    \ The expression is an rvalue that appears on the right side but not on the left\
    \ side of the assignment.\n\nThe variables are lvalues and hence appear on the\
    \ left side of the assignment. The numeric values are rvalues and hence appear\
    \ on the right side.\n\n```csharp\nint a=50;\n```\n\n### 4.2 Constants and literals\
    \ in C#\n\nConstant is a class member that represents a fixed value. Constant\
    \ value can be computed at compile time but cannot be modified. Constants are\
    \ declared using the **const** keyword.\n\nSyntax:\n\n`const <data_type> <constant_name>\
    \ = value;`\n\nExample of Constant:\n\n```csharp\nusing System;\nnamespace constc\n\
    class Program\n{\n    static void Main(string[] args)\n    {\n        const int\
    \ i=3;\n        int x;\n        Console.WriteLine(\"The value for x is\");\n \
    \       x=Convert.ToInt32(Console.ReadLine());\n        int mult = x*i;\n    \
    \    Console.WriteLine(\"Value of multiplication is:{0}\",mult);\n        Console.ReadLine();\n\
    \    }\n}\n```\n\n#### Literals\n\nA literal is a source code representation of\
    \ a value. There are different types of literals in C#.\n\n#### Integer Literals\n\
    \nInteger literal is used to write values of type int, long, uint, and ulong.\
    \ It can be represented as decimal, octal, or hexadecimal constant. The base or\
    \ radix is specified by the prefix. The value 0x or 0X represents the hexadecimal,\
    \ 0 defines octal and..."
  mdcn: "\n## 第 3 章 语法、数据类型与转换\n\n### 3.1 C# 中的不同关键字\n\n关键字是特殊的预定义保留字，每个关键字都被赋予了唯一的含义。为了更好地理解，这些关键字可以被分为不同的类别。以下是按类型分类的关键字列表。\n\
    \n#### 1) 类、方法、字段和属性的关键字\n\n- abstract\n- extern\n- internal\n- internal\n- new\n\
    - const\n- override\n- protected\n- private\n- public\n- sealed\n- readonly\n\
    - static\n- virtual\n- void\n\n#### 2) 类型转换关键字\n\n- explicit\n- implicit\n- as\n\
    - is\n- operator\n- sizeof\n- typeof\n\n#### 3) 程序流程控制实用关键字\n\n- if\n- else\n\
    - for\n- foreach\n- in\n- case\n- break\n- continue\n- return\n- while\n- goto\n\
    - default\n- do\n- switch\n\n#### 4) 用于内置类型和枚举的关键字\n\n- bool\n- char\n- class\n\
    - byte\n- decimal\n- enum\n- double\n- float\n- interface\n- long\n- int\n- object\n\
    - sbyte\n- short\n- string\n- uint\n- struct\n- ulong\n- ushort\n\n#### 5) 用于异常处理的关键字\n\
    \n- try\n- catch\n- throw\n- finally\n- checked\n- unchecked\n\n#### 6) 用作字面量、方法传递参数的关键字\n\
    \n- true\n- false\n- null\n- this\n- value\n- out\n- params\n- ref\n\n#### 7)\
    \ 在函数指针、对象分配、非托管代码中实用的关键字\n\n- delegate\n- event\n- new\n- stackalloc\n- unsafe\n\
    \n### 3.2 C# 中的数据类型\n\n数据类型用于以特定的类型存储数据。程序员可以使用几种内置数据类型来声明数据。\n\n每种数据类型都有一组有限的可选值，这些有限的选项被称为该数据类型的**数据范围（**data\
    \ range**）。下面列出了存在的数据类型及其对应的数据范围：\n\n- **bool：** 用于表示布尔值。可赋的值为 true 或 false。\n\
    - **byte：** 8 位无符号整数。byte 数据类型的取值范围是 0 到 255。\n- **char：** 16 位 Unicode 字符。取值范围是\
    \ U+0000 到 U+ffff。\n- **double：** 64 位双精度浮点类型。取值范围是 (+/-) 5.0 x 10^-324 到 (+/-)\
    \ 1.7 x 10^308。\n- **decimal：** 128 位具有有效数字的精确十进制值。取值范围是 (-7.9 x 10^28 到 7.9 x\
    \ 10^28) / 10^0 到 28。\n- **float：** 32 位单精度浮点数。取值范围是 -3.4 x 10^38 到 + 3.4 x 10^38。\n\
    - **int：** 32 位有符号整数类型。取值范围从 -2,147,483,648 到 2,147,483,647。\n- **long：** 64 位有符号整数类型。取值范围从\
    \ -9,223,372,036,854,775,808 到 9,223,372,036,854,775,807。\n- **sbyte：** 8 位有符号整数类型。取值范围从\
    \ -128 到 127。\n- **short：** 16 位有符号整数类型。取值范围从 -32,768 到 32,767。\n- **uint：** 32\
    \ 位无符号整数类型。取值范围从 0 到 4,294,967,295。\n- **ulong：** 64 位无符号整数类型。取值范围从 0 到 18,446,744,073,709,551,615。\n\
    - **ushort：** 16 位无符号整数类型。取值范围从 0 到 65,535。\n\n## 3.3 C# 中的类型转换\n\n当程序员需要将一种数据类型转换为另一种数据类型时，类型转换非常有用。类型转换也被称为**类型强制转换**（**type\
    \ casting**）。C# 中有两种类型的强制转换：**隐式类型**（**implicit type**）转换和**显式类型**（**explicit\
    \ type**）转换。\n\n### 隐式类型转换\n\n`implicit` 关键字用于隐式转换。它们不需要任何强制转换运算符。这些转换包括从小整数类型到大整数类型，以及从派生类到基类的转换。\n\
    \n### 显式类型转换\n\n显式转换是由用户通过使用预定义函数显式完成的。在这些转换中，需要一个强制转换运算符。\n\n```csharp\nusing\
    \ System;\nnamespace TypeConversion\n{\n    class Conversion\n    {\n        static\
    \ void Main(string[] args)\n        {\n            double d=10.243;\n        \
    \    int i;\n\n            i = (int)d;\n            Console.WriteLine(i);\n  \
    \          Console.Read();\n        }\n    }\n}\n```\n\nC# 包含了一些对用户非常有用的类型转换方法。\n\
    \n以下列表显示了这些类型转换方法：\n\n- **ToByte：** 用于将类型转换为 byte\n- **ToBoolean：** 用于转换为布尔值\n\
    - **ToDateTime：** 用于将类型转换为日期时间类型\n- **ToDouble：** 将类型转换为 double\n- **ToDecimal：**\
    \ 将浮点数或整数转换为 decimal 类型\n- **ToInt64：** 将类型转换为 64 位整数\n- **ToSingle：** 将类型转换为浮点数\n\
    - **ToString：** 将类型转换为字符串类型\n- **ToUInt64：** 将类型转换为无符号大整数\n\n以下代码片段显示了将值类型转换为\
    \ Double 类型的过程。\n\n```csharp\nusing System;\nnamespace type\n{\n    class DoubleConversion\n\
    \    {\n        int a=10;\n        float f=30.05f;\n        bool b=false;\n\n\
    \        Console.WriteLine(a.ToDouble());\n        Console.WriteLine(f.ToDouble());\n\
    \        Console.WriteLine(b.ToDouble());\n        Console.Read();\n    }\n}\n\
    ```\n\n## 第 4 章 变量与常量\n\n### 4.1 探索 C# 中的变量\n\n变量是分配给程序所使用的内存位置的名称。每个变量都有一个与之相关的数据类型。数据类型决定了内存中用于存储该变量的内存大小。\n\
    \nC# 提供的数据类型可分为：\n\n1. 整数类型：int, uint, short, byte, sbyte, long, ulong, 和 char\n\
    2. 浮点类型：double, float\n3. 十进制类型：decimal\n4. 布尔类型：true 或 false 值\n5. 可空类型：nullable\
    \ 数据类型\n6. 引用类型：class\n\n#### 定义变量\n\n声明变量的语法为：\n\n```\n<data_type> <variable_list>;\n\
    ```\n\n其中，**data_type** 是一个有效的 C# 数据类型。它可以是 int, char, float, double 或用户定义类型。**variable_list**\
    \ 包含一个或多个标识符。\n\n变量示例：\n\n```csharp\nint a,b,c;\nchar x,y;\nfloat price, totalcost;\n\
    double area;\n```\n\n#### 初始化变量\n\n变量使用等号初始化，后跟一个表达式。初始化变量的语法为：\n\n```\nvariable_name\
    \ = value;\n```\n\n变量可以在声明时初始化。初始化变量的一般形式为：\n\n```\n<data_type> <variable_name>\
    \ = value;\n```\n\n变量初始化的示例：\n\n```csharp\nint a = 4;\nchar z='z';\ndouble y =\
    \ 12.145;\n```\n\n演示变量类型的示例：\n\n**示例 5：**\n\n```csharp\nusing System;\nnamespace\
    \ VariableDeclare\nclass Program\n{\n    static void Main(string[] args)\n   \
    \ {\n        int a;\n        short s;\n        double d;\n\n        /*initializing\
    \ variables*/\n        a=20;\n        s=5;\n        d=a+s;\n        Console.WriteLine(\"\
    a={0},b={1},d={2}\",a,s,d);\n        Console.Read();\n    }\n}\n```\n\n#### 接收用户输入值\n\
    \n**System** 命名空间中的 **Console** 类提供了 **ReadLine()** 函数。\n\n该函数用于接收用户的输入并将其存储在变量中。\n\
    \n示例：\n\n```csharp\nint no;\nno=Convert.ToInt32(Console.ReadLine());\n```\n\n\
    **Convert.ToInt32()** 函数将用户输入的数据转换为整数数据类型。该函数接收字符串格式的数据。\n\n#### LValue 和 RValue\
    \ 表达式\n\nC# 中的两种表达式类型是：\n\n- **lvalue（左值）：** 出现在赋值语句左侧的表达式。\n- **rvalue（右值）：**\
    \ 出现在赋值语句右侧而非左侧的表达式。\n\n变量是左值，因此出现在赋值语句的左侧。数值是右值，因此出现在右侧。\n\n```csharp\nint a=50;\n\
    ```\n\n### 4.2 C# 中的常量与字面量\n\n常量是表示固定值的类成员。常量值可以在编译时计算，但不能被修改。常量使用 **const** 关键字声明。\n\
    \n语法：\n\n`const <data_type> <constant_name> = value;`\n\n常量示例：\n\n```csharp\n\
    using System;\nnamespace constc\nclass Program\n{\n    static void Main(string[]\
    \ args)\n    {\n        const int i=3;\n        int x;\n        Console.WriteLine(\"\
    The value for x is\");\n        x=Convert.ToInt32(Console.ReadLine());\n     \
    \   int mult = x*i;\n        Console.WriteLine(\"Value of multiplication is:{0}\"\
    ,mult);\n        Console.ReadLine();\n    }\n}\n```\n\n#### 字面量\n\n字面量是值的源代码表示形式。C#\
    \ 中有不同类型的字面量。\n\n#### 整数字面量\n\n整数字面量用于编写 int, long, uint 和 ulong 类型的值。它可以表示为十进制、八进制或十六进制常量。基数或底数由前缀指定。0x\
    \ 或 0X 表示十六进制，0 定义八进制且...\n"
