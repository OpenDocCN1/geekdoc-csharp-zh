    \ i;\n\n            i = int (d);\n            Console.WriteLine(i);\n        \
    \    Console.Read();\n        }\n    }\n}\n```\n\nC# consists of type conversion\
    \ methods that are useful for users.\n\nThe following list shows the type conversion\
    \ methods."
