    \            int x = 20;\n            int y = 40;\n\n            switch(x)\n \
    \           {\n                case 20:\n                    Console.WriteLine(\"\
    Part of outer switch\");\n                    switch(y)\n                    {\n\
    \                        case 40:\n                            Console.WriteLine(\"\
    Part of inner switch\");\n                            break;\n               \
    \     }\n                    break;\n            }\n            Console.WriteLine(\"\
    Value of x is :{0}\", x);\n            Console.WriteLine(\"Value of y is: {0}\"\
    , y);\n            Console.Read();\n        }\n    }\n}\n```\n\nIn the above code,\
    \ the value of variable x and y is assigned. If the value for variable x matches\
    \ the expression, the statements inside the switch case are executed, else the\
    \ control moves out of the case structure.\n\n## Chapter 7 Loops in C#\n\nLoop\
    \ structures are used for executing one or more lines again and again. Various\
    \ control structures are provided for complicated execution.\n\n![](img/c133ae999967b1fbceab3bccc1cb1d4f_54_0.png)\n\
    \n### 7.1 While loop\n\nA **while** loop consists of a conditional expression\
    \ that must be matched before the logical statements inside the while loop can\
    \ be executed. If a statement matches the expression then it will run the code\
    \ inside the loop and then return back to the conditional expression to re-check\
    \ whether the statement still matches the expression. If it matches again then\
    \ the loop will execute again otherwise it will skip the loop completely.\n\n\
    Let us visit the syntax of a while loop.\n\n**Syntax:**\n\n```\nwhile (expression)\n\
    {\n    statements;\n}\n```\n\n**Flow Diagram**\n\n![](img/c133ae999967b1fbceab3bccc1cb1d4f_55_0.png)"
