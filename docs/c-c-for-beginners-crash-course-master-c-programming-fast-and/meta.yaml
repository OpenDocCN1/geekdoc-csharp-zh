    # Chapter 1 Introduction to C#


    # 1.1 Overview of C#


    C# is an object oriented, type safe high level programming language. It has been
    developed by Microsoft during the development of the .NET framework. C# was developed
    for the Common Language Infrastructure (CLI), this infrastructure was created
    to allow programs from various other high level languages to work together without
    the need to rewrite those programs entirely. The CLI contains a various executable
    programs referred simply as executables and are housed and ran in a system called
    the runtime environment.


    All the programs created in .Net framework execute in an environment that handles
    the runtime requirements. The Common Language Runtime (CLR) provides the virtual
    machine, which helps the programmers not to consider the CPU specifications. The
    class library and CLR make the .NET framework.'
  - '[PAGE 8]


    # 1.2 *Programming features of C#*


    +   - It is simple, advanced, object oriented language

    - It contains data types and classes common for all the .NET languages

    - The Common Language Runtime (CLR) is similar to the Java Virtual Machine (JVM)

    - C# provides support for encapsulation, inheritance, polymorphism, and interfaces

    - Visual Studio provides support to VC++, Visual Basic, Vbscript, and Jscript

    - .NET consists of class library and common execution engine

    - Garbage collection, automatic memory management, interoperability are inbuilt
    in C#

    - User can develop console, windows and web applications using C#'
  - '[PAGE 9]


    # # 1.3 C# Environment


    C# is a part of .NET framework. It is used for creating .NET applications. Using
    .NET framework, user can design, deploy and develop the applications. Robust applications
    can be easily built using the simple programming model.


    # ## Components of .NET framework


    The .NET framework diagram containing several components is as shown:


    ![](img/c133ae999967b1fbceab3bccc1cb1d4f_9_0.png)


    The .NET framework consists of the following components:


    +   - Common Language Runtime

    - .NET framework base class library

    - Common Language Specification

    - User and Program interfaces


    # ### Common Language Runtime (CLR)


    The core component of the .NET framework is the CLR. It is an environment where
    the programs are executed. The code in CLR is translated into Intermediate Language
    (IL). This IL code is then used across different platforms.


    The IL code is converted into machine language by the Just in Time (JIT) compiler.
    The complier checks for the type safety. This ensures objects are accessed in
    a compatible way.'
- md: " ## .NET Framework Class Library\n\nThe class library works with any .NET languages\
    \ like VB.NET, VC# and VC++.NET. The library provides classes used in the code\
    \ for performing different programming tasks like data collection, string management,\
    \ file access and connecting to the database.\n\n## Common Language Specification\n\
    \nCLR contains set of common rules used by all the programming languages in .NET\
    \ framework. They are known Common Language Specification (CLS). CLS helps an\
    \ object to interact with objects or applications of other languages.\n\n## User\
    \ and Program Interfaces\n\n.NET framework provides three different types of user\
    \ interfaces:\n\n- **Windows Forms:** They are windows based applications.\n-\
    \ **Web Forms:** They are used for creating web based applications.\n- **Console\
    \ Applications:** They are useful for creating console based applications which\
    \ are executed by the command line.\n\n# Chapter 2 Program Structure in C#\n\n\
    ## 2.1 Introduction to C# Program Structure\n\nC# Program consists of various\
    \ parts. We shall explore all the components needed for a C# program.\n\nConsider\
    \ the code demonstrating the C# program.\n\n```\nExample 1:\n\nusing System;\n\
    namespace welcome\npublic class WelcomeUser\n{\n    static void Main( string[]\
    \ args)\n    {\n        Console.WriteLine(\"WelcomeUser\");\n        Console.Read();\n\
    \    }\n}\n```\n\nThe code consists of several parts. They are as mentioned below:\n\
    \n### Namespace Declaration\n\nThe namespace consists of collection of classes\
    \ used in programming. The **using** keyword is used for adding the System namespace.\
    \ The System class consists of classes and methods useful for the user.\n\nIn\
    \ the above code, namespace **welcome** is added.\n\n### Class\n\nThe class consists\
    \ of data and method definitions used by the program. The class can have one or\
    \ many methods. Every class must have a **Main** method, which is the first method\
    \ run in the code. In the above code, **WelcomeUser** class is declared.\n\n##\
    \ Class Methods\n\nMethods in a class specify the behavior of the statement. In\
    \ the above code, **WriteLine** method is used for writing the value in the console.\
    \ It is defined in the Console class inside the System namespace.\n\nThe **Read**\
    \ method of the Console class is used for waiting till the user hits a key. Thus\
    \ prevents the screen from closing too quickly.\n\n## Comments\n\nComments are\
    \ text useful for providing additional information about the code. The compiler\
    \ ignores any code that is placed inside a comment block. There are two types\
    \ of comments; one comment is used for single line entries and the other for multi\
    \ line entries.\n\nFor example:\n\n```\nusing System;\nnamespace comment\n/*It\
    \ is a simple code\nUsed for writing value to the console\n*/\nclass Demo\n{\n\
    \    static void Main()\n    {\n        //It is added inside Main method\n   \
    \     Console.WriteLine(\"Demonstration of code\");\n    }\n}\n```\n\n## 2.2 User\
    \ Interface Elements\n\nThere are various user interface elements present in the\
    \ Visual Studio application that can be used in a project. We shall explore the\
    \ user interface elements in detail.\n\n## Start Page\n\nThe Start Page is the\
    \ initial page that gets displayed when the user opens the Microsoft Visual Studio\
    \ application.\n\n![](img/c133ae999967b1fbceab3bccc1cb1d4f_13_0.png)\n\nThe Visual\
    \ Studio IDE provides the start page as the default home page. Through the start\
    \ page user can specify the preferences, developer communication using the .NET\
    \ platform, exploring new .NET features.\n\nIn Visual Studio .NET, the Projects\
    \ tab displays the recent projects and the latest modification date. User can\
    \ use any of the existing projects from the list. Click on the New Project button\
    \ when you need to work for a new project. Click on the Open project button when\
    \ user wants to open the existing project.\n\n## Standard Toolbar\n\nThe standard\
    \ toolbar is used to provide the shortcut menu commands. There are several buttons\
    \ on the toolbar that help user to perform tasks related to opening, closing,\
    \ saving, editing, pasting on the file.\n\nThere are functions related to the\
    \ tools present in the standard toolbar. They are as listed below.\n\n- New Project:\
    \ A new project can be created in the application. The ![](icon_new_project.png)\
    \ button is used.\n- Add New Item: A new item is added to the project. The ![](icon_add_item.png)\
    \ button is used.\n- Save: All the programs created in a particular solution are\
    \ saved. The $\\text{save\\_icon}$ button is used.\n- Save All: It saves all the\
    \ unsaved items in an application. The $\\text{save\\_all\\_icon}$ button is used.\n\
    - Cut: The selected objects are placed on the clipboard using this option. The\
    \ $\\text{cut\\_icon}$ icon is used.\n- Copy: The copy of the selected item is\
    \ kept on the clipboard. The $\\text{copy\\_icon}$ icon is used.\n- Paste: It\
    \ is used to paste the contents in the document. The $\\text{paste\\_icon}$ icon\
    \ is used.\n- Debugging: The compilation and execution of the project is done.\
    \ The $\\text{debug\\_icon}$ icon is used.\n\n## Solution Explorer\n\nIn the solution\
    \ explorer window, classes, project and solution name used in the project gets\
    \ displayed. Double click the file in the solution explorer for opening the file.\n\
    \nThe following figure shows the solution explorer window in application.\n\n\
    ![](img/c133ae999967b1fbceab3bccc1cb1d4f_14_0.png)\n\n## Output Window\n\nThe\
    \ messages for the status of the features of Visual Studio .NET IDE are provided\
    \ by the output window. The current status of the application is displayed when\
    \ the user compiles it. The number of errors present during compilation is displayed\
    \ in the window. The **View -> Output Window** option is used to open the window.\n\
    \nThe following figure shows the output window in Visual Studio application.\n\
    \n![](img/c133ae999967b1fbceab3bccc1cb1d4f_15_0.png)\n\n## Error List\n\nThe list\
    \ of errors present in the application is displayed in the error list window.\
    \ The user can locate errors as soon as the code is compiled. Double click the\
    \ error and the source for it is located. Click View, Error List Window option\
    \ to open the error list window.\n\nThe following figure shows the error list\
    \ window.\n\n![](img/c133ae999967b1fbceab3bccc1cb1d4f_15_1.png)\n\n## Class View\
    \ Window\n\nThe class view window is useful in displaying classes, properties\
    \ and methods associated with a file. The tree view structure is used to display\
    \ the items. The code editor window can be viewed by double clicking the item.\n\
    \nThe window contains two buttons, one for sorting the items, other for new folder\
    \ creation. The View, Class View option is used for opening the class view window.\n\
    \n![](img/c133ae999967b1fbceab3bccc1cb1d4f_16_0.png)\n\n## Code Editor\n\nUser\
    \ can enter or edit code in the code editor. User can add code to the editor for\
    \ the class.\n\nThe following window shows the code editor.\n\n```\nusing System.Collections.Generic;\n\
    using System.ComponentModel;\nusing System.Data;\nusing System.Drawing;\nusing\
    \ System.Linq;\nusing System.Text;\nusing System.Windows.Forms;\n\nnamespace WindowsFormsApplication1\n\
    {\n    public partial class Form1 : Form\n    {\n        public Form1()\n    \
    \    {\n            InitializeComponent();\n        }\n    }\n}\n```\n\n## 2.3\
    \ Compiling and Executing C# Program\n\nThere are some steps involved in compiling\
    \ and executing the program as mentioned below:\n\n1. Open Visual Studio application\n\
    2. Click **File**, **New**, **Project** option from the list\n3. Select the Visual\
    \ C# template and select Windows option\n4. Select the console application template\
    \ from the template list\n5. Add a project name and click **OK** button\n6. A\
    \ new project is created in the solution explorer window\n7. Add the needed code\
    \ in the code editor window\n8. Press **F5** or click the **Run** button for project\
    \ execution. User can view the output for the code\n\nThe compiling of the code\
    \ of C# program using the command line of the Visual Studio IDE is possible.\n\
    \n1. Add the code in the text editor and save the file with **.cs** extension\n\
    2. Open the command prompt and navigate to the file\n3. The csc filename.cs and\
    \ compile the code\n4. The command prompt moves to the next line and creates an\
    \ executable file\n5. Add the filename and execute the program"
  mdcn: "\n ## .NET Framework 类库\n\n该类库适用于任何 .NET 语言，如 VB.NET、VC# 和 VC++.NET。该库提供了在代码中用于执行不同编程任务的类，例如数据收集、字符串管理、文件访问以及连接数据库。\n\
    \n## 公共语言规范\n\nCLR 包含一套由 .NET 框架中所有编程语言共同遵守的通用规则。这些规则被称为公共语言规范 (CLS)。CLS 帮助一个对象与其他语言的对象或应用程序进行交互。\n\
    \n## 用户和程序接口\n\n.NET 框架提供了三种不同类型的用户界面：\n\n- **Windows Forms：** 基于窗口的应用程序。\n- **Web\
    \ Forms：** 用于创建基于 Web 的应用程序。\n- **Console Applications：** 用于创建由命令行执行的基于控制台的应用程序。\n\
    \n# 第二章 C# 程序结构\n\n## 2.1 C# 程序结构简介\n\nC# 程序由多个部分组成。我们将探讨 C# 程序所需的所有组件。\n\n请参考以下演示\
    \ C# 程序的代码。\n\n```\nExample 1:\n\nusing System;\nnamespace welcome\npublic class\
    \ WelcomeUser\n{\n    static void Main( string[] args)\n    {\n        Console.WriteLine(\"\
    WelcomeUser\");\n        Console.Read();\n    }\n}\n```\n\n该代码由几个部分组成，具体如下所述：\n\
    \n### 命名空间声明\n\n命名空间由编程中使用的类集合组成。**using** 关键字用于添加 System 命名空间。System 类包含对用户有用的类和方法。\n\
    \n在上述代码中，添加了 **welcome** 命名空间。\n\n### 类\n\n类由程序使用的数据和方法定义组成。一个类可以包含一个或多个方法。每个类必须有一个\
    \ **Main** 方法，它是代码中运行的第一个方法。在上述代码中，声明了 **WelcomeUser** 类。\n\n## 类方法\n\n类中的方法指定了语句的行为。在上述代码中，**WriteLine**\
    \ 方法用于在控制台中写入值。它定义在 System 命名空间的 Console 类中。\n\nConsole 类的 **Read** 方法用于等待用户按下按键。从而防止屏幕关闭过快。\n\
    \n## 注释\n\n注释是用于提供有关代码额外信息的文本。编译器会忽略放置在注释块中的任何代码。注释有两种类型：一种用于单行条目，另一种用于多行条目。\n\
    \n例如：\n\n```\nusing System;\nnamespace comment\n/*It is a simple code\nUsed for\
    \ writing value to the console\n*/\nclass Demo\n{\n    static void Main()\n  \
    \  {\n        //It is added inside Main method\n        Console.WriteLine(\"Demonstration\
    \ of code\");\n    }\n}\n```\n\n## 2.2 用户界面元素\n\nVisual Studio 应用程序中存在各种用户界面元素，可用于项目。我们将详细探讨这些用户界面元素。\n\
    \n## 开始页\n\n开始页是用户打开 Microsoft Visual Studio 应用程序时显示的初始页面。\n\n![](img/c133ae999967b1fbceab3bccc1cb1d4f_13_0.png)\n\
    \nVisual Studio IDE 将开始页作为默认主页。通过开始页，用户可以指定首选项、利用 .NET 平台进行开发者沟通以及探索新的 .NET 特性。\n\
    \n在 Visual Studio .NET 中，“项目”选项卡显示最近的项目及其最新的修改日期。用户可以使用列表中的任何现有项目。当需要创建新项目时，点击“新建项目”按钮。当用户想要打开现有项目时，点击“打开项目”按钮。\n\
    \n## 标准工具栏\n\n标准工具栏用于提供快捷菜单命令。工具栏上有几个按钮，帮助用户执行与打开、关闭、保存、编辑、粘贴文件相关的任务。\n\n标准工具栏中存在与工具相关的函数，列举如下：\n\
    \n- 新建项目：在应用程序中创建一个新项目。使用 ![](icon_new_project.png) 按钮。\n- 添加新项目：向项目中添加一个新项。使用\
    \ ![](icon_add_item.png) 按钮。\n- 保存：保存特定解决方案中创建的所有程序。使用 $\\text{save\\_icon}$ 按钮。\n\
    - 全部保存：保存应用程序中所有未保存的项目。使用 $\\text{save\\_all\\_icon}$ 按钮。\n- 剪切：使用此选项将选定对象放置在剪贴板上。使用\
    \ $\\text{cut\\_icon}$ 图标。\n- 复制：将选定项的副本保存在剪贴板上。使用 $\\text{copy\\_icon}$ 图标。\n\
    - 粘贴：用于将内容粘贴到文档中。使用 $\\text{paste\\_icon}$ 图标。\n- 调试：执行项目的编译和运行。使用 $\\text{debug\\\
    _icon}$ 图标。\n\n## 解决方案资源管理器\n\n在解决方案资源管理器窗口中，会显示项目中使用的类、项目和解决方案名称。双击解决方案资源管理器中的文件即可打开该文件。\n\
    \n下图显示了应用程序中的解决方案资源管理器窗口。\n\n![](img/c133ae999967b1fbceab3bccc1cb1d4f_14_0.png)\n\
    \n## 输出窗口\n\n输出窗口提供关于 Visual Studio .NET IDE 功能状态的消息。当用户编译应用程序时，会显示其当前状态。窗口中会显示编译期间出现的错误数量。使用\
    \ **视图 -> 输出窗口** 选项来打开该窗口。\n\n下图显示了 Visual Studio 应用程序中的输出窗口。\n\n![](img/c133ae999967b1fbceab3bccc1cb1d4f_15_0.png)\n\
    \n## 错误列表\n\n错误列表窗口显示应用程序中存在的错误列表。用户可以在代码编译后立即定位错误。双击错误即可定位其源代码。点击“视图”、“错误列表窗口”选项以打开错误列表窗口。\n\
    \n下图显示了错误列表窗口。\n\n![](img/c133ae999967b1fbceab3bccc1cb1d4f_15_1.png)\n\n## 类视图窗口\n\
    \n类视图窗口用于显示与文件关联的类、属性和方法。使用树状视图结构来显示项目。通过双击项目可以查看代码编辑器窗口。\n\n该窗口包含两个按钮，一个用于对项目进行排序，另一个用于创建新文件夹。使用“视图”、“类视图”选项打开类视图窗口。\n\
    \n![](img/c133ae999967b1fbceab3bccc1cb1d4f_16_0.png)\n\n## 代码编辑器\n\n用户可以在代码编辑器中输入或编辑代码。用户可以为类在编辑器中添加代码。\n\
    \n以下窗口显示了代码编辑器。\n\n```\nusing System.Collections.Generic;\nusing System.ComponentModel;\n\
    using System.Data;\nusing System.Drawing;\nusing System.Linq;\nusing System.Text;\n\
    using System.Windows.Forms;\n\nnamespace WindowsFormsApplication1\n{\n    public\
    \ partial class Form1 : Form\n    {\n        public Form1()\n        {\n     \
    \       InitializeComponent();\n        }\n    }\n}\n```\n\n## 2.3 编译和执行 C# 程序\n\
    \n编译和执行程序涉及以下步骤：\n\n1. 打开 Visual Studio 应用程序\n2. 从列表中点击 **文件** $\\rightarrow$\
    \ **新建** $\\rightarrow$ **项目** 选项\n3. 选择 Visual C# 模板并选择 Windows 选项\n4. 从模板列表中选择控制台应用程序\
    \ (console application) 模板\n5. 添加项目名称并点击 **确定** 按钮\n6. 解决方案资源管理器窗口中创建了一个新项目\n\
    7. 在代码编辑器窗口中添加所需代码\n8. 按 **F5** 或点击 **运行** 按钮执行项目。用户可以查看代码的输出结果\n\n也可以使用 Visual\
    \ Studio IDE 的命令行来编译 C# 程序代码：\n\n1. 在文本编辑器中添加代码，并将文件保存为 **.cs** 扩展名\n2. 打开命令提示符并导航到该文件所在目录\n\
    3. 输入 `csc filename.cs` 并编译代码\n4. 命令提示符移动到下一行并创建一个可执行文件\n5. 输入文件名并执行程序\n"
