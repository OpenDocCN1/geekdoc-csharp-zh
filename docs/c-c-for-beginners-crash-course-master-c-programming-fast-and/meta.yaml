    \ else statement. The **else** statement is executed when the expression value\
    \ is false.\n\n**Syntax:**\n\n```\nif(boolean_expression)\n{\n    /* If the Boolean\
    \ expression is true, this statement is executed */\n}\nelse\n{\n    /* If the\
    \ Boolean expression is false, this statement will be executed */\n}\n```\n\n\
    If the expression has value **true** then the **if block** is executed, otherwise\
