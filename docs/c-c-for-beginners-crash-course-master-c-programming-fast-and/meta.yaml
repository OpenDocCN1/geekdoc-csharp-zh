  md: "# 13.6 User defined exceptions\n\nUsers can create their own exception classes\
    \ when the situation arises where the user needs to handle an exception in a special\
    \ way using custom code. These exceptions are known as user defined exceptions.\n\
    \nThe user defined exceptions classes are derived from the **ApplicationException**\
    \ class.\n\n```\nExample 52:\nusing System;\nnamespace userdefined\n{\n    class\
    \ Average\n    {\n        static void Main(string[] args)\n        {\n       \
    \     Perform p = new Perform();\n            try\n            {\n           \
    \     p.CalAverage();\n            }\n            catch(CountZeroException e)\n\
    \            {\n                Console.WriteLine(\"CountZeroException: {0}\"\
    ,e.Message);\n            }\n            Console.Read();\n        }\n    }\n}\n\
    public class CountZeroException:ApplicationException\n{\n    public CountZeroException(string\
    \ message):base(message)\n    {\n\n    }\n}\npublic class Perform\n{\n    int\
    \ no1 = 0;\n    int count = 0;\n    float average;\n    public void CalAverage()\n\
    \    {\n        if(count == 0)\n        {\n            throw(new CountZeroException(\"\
    Count is zero in calculation\"));\n```"
