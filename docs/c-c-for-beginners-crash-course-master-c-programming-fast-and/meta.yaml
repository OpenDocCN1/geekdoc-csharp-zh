    \      public void Show()\n        {\n            Console.WriteLine(\"The total\
    \ is:{0}\",sum);\n        }\n        public static void Main(string[] args)\n\
    \        {\n            int a,b;\n\n            Console.WriteLine(\"Enter value\
    \ of a\");\n            a = Convert.ToInt32(Console.ReadLine());\n\n         \
    \   Console.WriteLine(\"Enter the value of b\");\n            b = Convert.ToInt32(Console.ReadLine());\n\
    \n            // a and b are passed through to the class constructor\n       \
    \     Calculate c1 = new Calculate(a,b);\n            c1.Addition();\n       \
    \     c1.Show();\n\n            Console.ReadLine();\n        }\n    }\n}\n```\n\
    \n## When compiled the result of the class is:\n\nEnter value of a\n10\nEnter\
    \ value of b\n20\nThe total is: 30\n\n## C# *destructors*\n\nA destructor is a\
    \ special function in a class that is used very rarely to usually release unmanaged\
    \ resources before exiting the class. The destructor has several limitations on\
    \ how it can be used:\n\n- It cannot be inherited.\n- It cannot be overloaded.\n\
    - There can only be one destructor in any given class.\n- The destructor cannot\
    \ be directly called by the programmer; it is instead called by the Garbage Collector.\n\
    \nDestructor has the same name as its class and is prefixed with ~ symbol which\
    \ is represented by a tilde.\n\n## Example of Destructors\n\n```\nusing System;\n\
    namespace destruct\n{\n    class Calculate\n    {\n        int number1,number2,sum;\n\
    \        Calculate()\n        {\n            number1=15;\n            number2=4;\n\
    \        }\n        public void Addition()\n        {\n            sum=number1+number2;\n\
    \        }\n        public void Show()\n        {\n            Console.WriteLine(\"\
    The total is:{0}\",sum);\n        }\n\n        // Destructor is defined here and\
    \ is called when the class\n        // goes out of scope.\n        ~Calculate()\n\
    \        {\n            Console.WriteLine(\"Destructor invoked\");\n        }\n\
    \        public static void Main(string[] args)\n        {\n            Calculate\
    \ c1=new Calculate();\n            c1.Addition();\n            c1.Show();\n  \
    \      }\n    }\n}\n```\n\n**When compiled the result of the class will be:**\n\
    \nThe total is: 19\n\n## 8.2 Defining methods\n\n**Method** is a set of one or\
    \ more program statements, which can be executed by calling the method name. For\
    \ using a method, the user first needs to define a method and then call the method.\n\
    \nDefining a method means declaring the element of its structure. The following\
    \ syntax is used for defining the method.\n\n```\n<Access Specifier> <Return Type>\
    \ <Method Name> ( Parameter List)\n{\n    Method Body\n}\n```\n\nThe different\
    \ elements of a method are:\n\n- **Access specifier:** It checks the extent to\
    \ which the variable or method can be accessed.\n- **Return Type:** This defines\
    \ what the type is for the value returned by the method. If the type is set as\
    \ **void** then this would mean that the method does not return anything.\n- **Method\
    \ Name:** It is a unique identifier and case sensitive. The method name cannot\
    \ be the same as a variable name.\n- **Parameter List:** The values that are passed\
    \ and received by the method. After the method name, they are written in parentheses.\n\
    - **Method Body:** The set of instructions for performing the function of the\
    \ actual method.\n\n**Example:**\n\n![](img/c133ae999967b1fbceab3bccc1cb1d4f_74_0.png)\n\
    \n```\npublic int Number(int no1, int no2)\n{\n    int output;\n    output = no1+no2/2;\n\
    \    return output;\n}\n```\n\n## 8.3 *Calling methods*\n\nOnce the method is\
    \ defined, a user can call the method using the method name. The method name is\
    \ followed by the parentheses.\n\n## **Example:**\n\n```\nExample 23:\nusing System;\n\
    class Average\n{\n    public int Number(int no1, int no2)\n    {\n        int\
    \ output;\n        output = no1+no2/2;\n        return output;\n    }\n    static\
    \ void Main(string[] args)\n    {\n        Average a = new Average();\n      \
    \  // calling method Number from object class a\n        int value = a.Number(20,30);\n\
    \        Console.WriteLine(\"The result is {0}\",value);\n    }\n}\n```\n\n**When\
    \ the code is compiled the result is:**\n\nThe result is 25\n\n## 8.5 Recursive\
    \ method call\n\nA method can call itself this is known as **recursion**.\n\n\
    ```\nExample 24:\nusing System;\nnamespace recursive\n{\n    class recursivecall\n\
    \    {\n        public int factorial(int no)\n        {\n            int result;\n\
    \            if(no == 1)\n            {\n                return 1;\n         \
    \   }\n            else\n            {\n                result = factorial(no-1)*no;\n\
    \                return result;\n            }\n        }\n        static void\
    \ Main(string[] args)\n        {\n            recursivecall r = new recursivecall();\n\
    \            Console.WriteLine(\"Factorial of no is {0}\",r.factorial(2));\n \
    \           Console.WriteLine(\"Factorial of no is {0}\",r.factorial(3));\n  \
    \          Console.Read();\n        }\n    }\n}\n```\n\n**When the code is compiled\
    \ the result will be:**\n\nFactorial of no is 2\nFactorial of no is 6\n\n## 8.4\
    \ Passing parameters to method\n\nWhen a user calls a method, if the method accepts\
    \ parameters then these will have to be passed through at the time the method\
    \ is called. There are three types of parameters passed to the method.\n\n## Value\
    \ parameter\n\nWith a value parameter, the method creates a copy of this passed\
    \ in parameter as a variable for use inside the method. If the value of this variable\
    \ is changed, it will be only changed in the scope of the method itself and not\
    \ of the original variable that was passed in as a parameter to the method.\n\n\
    **Example:**\n\n```\nclass Program\n{\n    void Increaseno(int no)\n    {\n  \
    \      no++;\n    }\n    public static void Main()\n    {\n        Program p =\
    \ new Program();\n        int number = 2;\n        p.Increaseno(number);\n   \
    \     Console.WriteLine(number);\n    }\n}\n```\n\nWhen the code is compiled the\
    \ result will be:\n\n2\n\n## Reference Parameter\n\nThe reference parameter is\
    \ the same as the value parameter except that when the parameter is passed to\
    \ the method, instead of creating a copy of the parameter value, it instead directly\
    \ points to the original stored value in memory. Thus, if the value is changed\
    \ in the scope of the method then it will also change the value of the original\
    \ variable that was passed in as a parameter.\n\nThe **ref** keyword is used for\
    \ declaring the reference parameter.\n\n**Example:**\n\n```\nclass Program\n{\n\
    \    void Increaseno(ref int no)\n    {\n        no++;\n    }\n    public static\
    \ void Main()\n    {\n        Program p=new Program();\n        int number = 2;\n\
    \        p.Increaseno(ref number);\n        Console.WriteLine(number);\n    }\n\
    }\n```\n\nWhen the code is compiled the result will be:\n\n3\n\n## Output parameter\n\
    \nThe return statement is used for returning value from the method. Only a single\
    \ variable can be returned using return statement. The **output parameter** provides\
    \ this purpose.\n\nThey are similar to reference parameters, except they transfer\
    \ data out of the method.\n\n**Example:**\n\n```\nclass Program\n{\n    void Demo(out\
    \ int no)\n    {\n        no=10;\n    }\n    public static void Main()\n    {\n\
    \        Program p=new Program();\n        int number;\n        p.Demo(out number);\n\
    \        Console.WriteLine(number);\n    }\n}\n```\n\nWhen the code is compiled\
    \ the result will be:\n\n10\n\n# Chapter 9 Arrays in C#\n\n## 9.1 Introduction\
    \ to arrays\n\nAn array is a collection of values of similar data type. The variables\
    \ in the array are known as the elements of the array. The array elements are\
    \ accessed using a single name and an index number representing the position of\
    \ the element within the array.\n\nAn array has a rank that determines the number\
    \ of indices associated with every array element. The rank of the array is also\
    \ referred to as the dimensions of the array. The following figure shows the array\
    \ structure in the system.\n\n![](img/c133ae999967b1fbceab3bccc1cb1d4f_82_0.png)"
  mdcn: "\n如何让 number1 和 number2 的值变得不同且动态变化？这该如何实现呢？\n\n这时就要引入 **带参数构造函数** 这个概念了。这个术语的本质是，我们直接向构造函数传入参数，这允许我们在类实例化时传入数值。我们来看一个例子：\n\
    \n## 带参数构造函数示例\n\n```\nusing System;\nnamespace construct\n{\n    class Calculate\n\
    \    {\n        int number1,number2,sum;\n\n        // 参数被添加到这里的构造函数中\n      \
    \  Calculate(int num1,int num2)\n        {\n            // 我们将参数赋值给类变量\n     \
    \       number1 = num1;\n            number2 = num2;\n        }\n        public\
    \ void Addition()\n        {\n            sum=number1+number2;\n        }\n  \
    \      public void Show()\n        {\n            Console.WriteLine(\"The total\
    \ is:{0}\",sum);\n        }\n        public static void Main(string[] args)\n\
    \        {\n            int a,b;\n\n            Console.WriteLine(\"Enter value\
    \ of a\");\n            a = Convert.ToInt32(Console.ReadLine());\n\n         \
    \   Console.WriteLine(\"Enter the value of b\");\n            b = Convert.ToInt32(Console.ReadLine());\n\
    \n            // a 和 b 被传递到类构造函数\n            Calculate c1 = new Calculate(a,b);\n\
    \            c1.Addition();\n            c1.Show();\n\n            Console.ReadLine();\n\
    \        }\n    }\n}\n```\n\n## 编译后，类的输出结果是：\n\nEnter value of a\n10\nEnter value\
    \ of b\n20\nThe total is: 30\n\n## C# *析构函数*\n\n析构函数是类中一个很少使用的特殊函数，通常用于在退出类之前释放非托管资源。析构函数在使用上有几个限制：\n\
    \n-   它不能被继承。\n-   它不能被重载。\n-   任何给定的类中只能有一个析构函数。\n-   析构函数不能被程序员直接调用；它是由垃圾回收器调用的。\n\
    \n析构函数与它的类同名，并以~符号为前缀。\n\n## 析构函数示例\n\n```\nusing System;\nnamespace destruct\n\
    {\n    class Calculate\n    {\n        int number1,number2,sum;\n        Calculate()\n\
    \        {\n            number1=15;\n            number2=4;\n        }\n     \
    \   public void Addition()\n        {\n            sum=number1+number2;\n    \
    \    }\n        public void Show()\n        {\n            Console.WriteLine(\"\
    The total is:{0}\",sum);\n        }\n\n        // 析构函数在此定义，并在类\n        // 离开作用域时被调用。\n\
    \        ~Calculate()\n        {\n            Console.WriteLine(\"Destructor invoked\"\
    );\n        }\n        public static void Main(string[] args)\n        {\n   \
    \         Calculate c1=new Calculate();\n            c1.Addition();\n        \
    \    c1.Show();\n        }\n    }\n}\n```\n\n**编译后，类的输出结果是：**\n\nThe total is:\
    \ 19\n\n## 8.2 定义方法\n\n**方法**是一条或多条程序语句的集合，可以通过调用方法名来执行。要使用一个方法，用户首先需要定义一个方法，然后调用它。\n\
    \n定义一个方法意味着声明其结构的元素。定义方法使用以下语法：\n\n```\n<访问修饰符> <返回类型> <方法名> ( 参数列表)\n{\n    方法体\n\
    }\n```\n\n方法的不同元素是：\n\n-   **访问修饰符：** 它检查变量或方法可被访问的程度。\n-   **返回类型：** 这定义了方法返回值的类型。如果类型设置为\
    \ **void**，则表示该方法不返回任何内容。\n-   **方法名：** 它是一个唯一的标识符，区分大小写。方法名不能与变量名相同。\n-   **参数列表：**\
    \ 传递给方法和由方法接收的值。它们写在方法名后的括号中。\n-   **方法体：** 执行实际方法功能的指令集。\n\n**示例：**\n\n![](img/c133ae999967b1fbceab3bccc1cb1d4f_74_0.png)\n\
    \n```\npublic int Number(int no1, int no2)\n{\n    int output;\n    output = no1+no2/2;\n\
    \    return output;\n}\n```\n\n## 8.3 *调用方法*\n\n方法定义后，用户可以使用方法名调用该方法。方法名后跟括号。\n\
    \n## **示例：**\n\n```\nExample 23:\nusing System;\nclass Average\n{\n    public\
    \ int Number(int no1, int no2)\n    {\n        int output;\n        output = no1+no2/2;\n\
    \        return output;\n    }\n    static void Main(string[] args)\n    {\n \
    \       Average a = new Average();\n        // 从对象类 a 调用方法 Number\n        int\
    \ value = a.Number(20,30);\n        Console.WriteLine(\"The result is {0}\",value);\n\
    \    }\n}\n```\n\n**编译代码后，结果是：**\n\nThe result is 25\n\n## 8.5 递归方法调用\n\n一个方法可以调用它自己，这被称为**递归**。\n\
    \n```\nExample 24:\nusing System;\nnamespace recursive\n{\n    class recursivecall\n\
    \    {\n        public int factorial(int no)\n        {\n            int result;\n\
    \            if(no == 1)\n            {\n                return 1;\n         \
    \   }\n            else\n            {\n                result = factorial(no-1)*no;\n\
    \                return result;\n            }\n        }\n        static void\
    \ Main(string[] args)\n        {\n            recursivecall r = new recursivecall();\n\
    \            Console.WriteLine(\"Factorial of no is {0}\",r.factorial(2));\n \
    \           Console.WriteLine(\"Factorial of no is {0}\",r.factorial(3));\n  \
    \          Console.Read();\n        }\n    }\n}\n```\n\n**编译代码后，结果是：**\n\nFactorial\
    \ of no is 2\nFactorial of no is 6\n\n## 8.4 向方法传递参数\n\n当用户调用一个方法时，如果方法接受参数，那么在调用方法时必须传递这些参数。传递给方法的参数有三种类型。\n\
    \n## 值参数\n\n对于值参数，方法会创建一个传入参数的副本作为变量在方法内部使用。如果这个变量的值被改变，它只会在方法本身的作用域内改变，而不会改变作为参数传入的原始变量的值。\n\
    \n**示例：**\n\n```\nclass Program\n{\n    void Increaseno(int no)\n    {\n     \
    \   no++;\n    }\n    public static void Main()\n    {\n        Program p = new\
    \ Program();\n        int number = 2;\n        p.Increaseno(number);\n       \
    \ Console.WriteLine(number);\n    }\n}\n```\n\n编译代码后，结果是：\n\n2\n\n## 引用参数\n\n\
    引用参数与值参数类似，不同之处在于当参数传递给方法时，它不是创建参数值的副本，而是直接指向内存中的原始存储值。因此，如果在方法的作用域内更改了值，那么作为参数传入的原始变量的值也会随之改变。\n\
    \n使用 **ref** 关键字来声明引用参数。\n\n**示例：**\n\n```\nclass Program\n{\n    void Increaseno(ref\
    \ int no)\n    {\n        no++;\n    }\n    public static void Main()\n    {\n\
    \        Program p=new Program();\n        int number = 2;\n        p.Increaseno(ref\
    \ number);\n        Console.WriteLine(number);\n    }\n}\n```\n\n编译代码后，结果是：\n\n\
    3\n\n## 输出参数\n\nreturn 语句用于从方法返回值。使用 return 语句只能返回一个变量。**输出参数** 提供了这个功能。\n\n它们与引用参数类似，不同之处在于它们将数据从方法中传出。\n\
    \n**示例：**\n\n```\nclass Program\n{\n    void Demo(out int no)\n    {\n       \
    \ no=10;\n    }\n    public static void Main()\n    {\n        Program p=new Program();\n\
    \        int number;\n        p.Demo(out number);\n        Console.WriteLine(number);\n\
    \    }\n}\n```\n\n编译代码后，结果是：\n\n10\n\n# 第9章 C#中的数组\n\n## 9.1 数组简介\n\n数组是相似数据类型值的集合。数组中的变量被称为数组元素。数组元素通过一个单一的名称和一个表示元素在数组中位置的索引号来访问。\n\
    \n数组有一个秩，它决定了每个数组元素关联的索引数。数组的秩也被称为数组的维度。下图显示了系统中的数组结构。\n\n![](img/c133ae999967b1fbceab3bccc1cb1d4f_82_0.png)\n"
