  md: '# **12.1 Introduction to Inheritance**


    The concept of inheritance is fundamental to not only C# but also to most other
    programming languages. It allows the user to create classes that *inherit* data
    members and methods from other classes. Inheritance can save the user time by
    allowing them to create several popular and well-used methods in a core class
    and have other classes inherit that core class and all its methods. This stops
    the user from repeating the same method in every class.'
