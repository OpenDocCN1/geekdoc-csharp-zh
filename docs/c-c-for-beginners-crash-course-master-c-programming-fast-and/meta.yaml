  md: "# 14.6 Destroying threads\n\nThe **Thread.Abort()** method is used to destroy\
    \ the thread. The **ThreadAbortException** is thrown when the thread is destroyed.\
    \ The exception is not caught and is sent to the **finally** block.\n\nExample:\n\
    \n```\nusing System;\nusing System.Threading;\n\nnamespace ThreadDemo\n{\n   \
    \ class Program\n    {\n        public static void ChildThread()\n        {\n\
    \            try\n            {\n                Console.WriteLine(\"Child Thread\
    \ started\");\n                for(int j = 0; j <= 10; j++)\n                {\n\
    \                    Thread.Sleep(1000);\n                    Console.WriteLine(\"\
    Child thread finished\");\n                }\n            }\n            catch(ThreadAbortException\
    \ e)\n            {\n                Console.WriteLine(\"Exception caught\");\n\
    \            }\n            finally\n            {\n                Console.WriteLine(\"\
    Exception is not handled\");\n            }\n        }\n\n        public static\
    \ void Main()\n        {\n            ThreadStart t1 = new ThreadStart(ChildThread);\n\
    \            Console.WriteLine(\"Creating child thread\");\n            Thread\
    \ t2 = new Thread(t1);\n            t1.Start();\n\n            //main thread is\
    \ stopped\n        }\n    }\n}\n```"
