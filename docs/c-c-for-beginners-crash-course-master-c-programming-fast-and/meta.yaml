    equal\");\n            }\n            else\n            {\n                Console.WriteLine(string1+\"\
    and\"+string2+\" not equal\");\n            }\n            Console.Read();\n \
    \       }\n    }\n}\n```\n\n代码编译并执行后，输出为：\n\nA string named as string1 and A string\
    \ named as string2 are not equal\n\n连接字符串\n\n```csharp\nusing System;\nnamespace\
    \ string1\n{\n    class Program\n    {\n        static void Main(string[] args)\n\
    \        {\n            string[] str1 = new string[]{\"Set your aims high\",\n\
