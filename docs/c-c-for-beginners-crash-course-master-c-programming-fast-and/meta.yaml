    - \b - Backspace

    - \f - Form feed

    - \t - Horizontal tab

    - \v - Vertical tab

    - \r - Carriage return


    # String Literals


    There are two string literals types supported by C#: **regular string literals**
    and **verbatim string literals**. Regular string literals contain zero or more
    characters enclosed in double quotes.


    A verbatim string literals contains @ character followed by a double quote character,
    zero or more character. A verbatim string literal can span multiple lines.


