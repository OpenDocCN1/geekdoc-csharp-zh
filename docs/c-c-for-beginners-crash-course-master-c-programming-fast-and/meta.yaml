    \ 14.6 销毁线程\n\n使用 **Thread.Abort()** 方法来销毁线程。当线程被销毁时会抛出 **ThreadAbortException**。该异常不会被捕获，而是被发送到\
    \ **finally** 块。\n\n示例：\n\n```csharp\nusing System;\nusing System.Threading;\n\
    \nnamespace ThreadDemo\n{\n    class Program\n    {\n        public static void\
