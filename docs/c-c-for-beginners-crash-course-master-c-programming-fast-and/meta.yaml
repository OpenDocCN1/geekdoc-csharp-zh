  md: '# # 14.1 Thread in C#


    A thread defines a control flow. Thread is a basic unit to which the operating
    system allocates a thread. The execution of a thread is independent within a program.


    A single process is executed using one thread. Such process is known as single
    – threaded process. Only one task can be performed at a time. The user has to
    wait for the task to complete before executing new task.


    For executing more than one thread at a time, multiple threads are created. The
    process creating two or more threads is known as multithreading.'
  merge: -1
  pgno: 138
- img_proc: true
  md: "# 14.2 Life cycle of a thread\n\nThe life cycle of a thread starts when the\
    \ object of **System.Threading.Thread** class is created. The life ends as soon\
    \ as the task is completed. There are various states in the life cycle of a thread.\n\
    \n+   - **Unstarted State:** When the instance of the **Thread** class is created,\
    \ the thread enters in unstarted state.\n\n- **Ready State:** The thread is in\
    \ this state till the program calls the **Start()** method.\n\n- **Not Runnable\
    \ State:** A thread is not in the runnable state if:\n  1. **Waiting: The Wait()\
    \ method is called to make the thread for a specified condition**\n  2. **Blocked:\
    \ The thread is blocked by an I/O operation**\n  3. **Sleeping: The Sleep() method\
    \ is called to put the thread in sleeping mode.**\n\n- **Dead State:** Once the\
    \ thread completes its execution or aborted, it is placed in a dead state"
  merge: -1
  pgno: 139
- img_proc: true
  md: "# 14.3 Main thread\n\nThe **System.Threading.Thread** class is used for working\
    \ with threads. The main thread is created as soon as program starts execution.\
    \ The **Thread** class is used for creating threads. They are known as child threads.\
    \ The user can access the main thread by using the **CurrentThread** property\
    \ of the Thread class.\n\n# Example:\n\n```\nExample 53:\nusing System;\nnamespace\
    \ thread\n{\n    class MainThread\n    {\n        static void Main(string[] args)\n\
    \        {\n            Thread t1 = new Thread();\n            t1.Name=\"Thread1\"\
    ;\n            Console.WriteLine(\"Thread is:{0}\",t1.Name);\n            Console.Read();\n\
    \        }\n    }\n}\n```\n\nWhen the code is compiled and executed, the output\
    \ is:\n\nThread is: Thread1"
  merge: -1
  pgno: 140
- img_proc: true
  md: '# # 14.4 Properties and methods of the Thread class


    Properties:


    +   - **IsAlive**: The value showing the execution status of the current thread

    - **CurrentThread**: The current running thread is retrieved

    - **CurrentContext**: The current context in which the thread is executing is
    retrieved

    - **ExecutionContext**: The ExecutionContext object contains information about
    different contexts

    - **Name**: Gets or sets name of the thread

    - **ThreadState**: The value containing states of the current thread

    - **Priority**: It gets or sets the value showing the scheduling priority of a
    thread


    Methods:


    +   - `public static void BeginThreadAffinity()`: The host is to about to execute
    instructions depending on the current physical operating system thread.

    - `public void Abort()`: The ThreadAbortException is raised in thread on which
    it is invoked.

    - `public void interrupt()`: The thread present in the WaitSleepJoin state is
    interrupted

    - `public static AppDomain GetDomain()`: A unique domain identifier is returned

    - `public static void MemoryBarrier()`: The processor executes the current thread.
    The instructions cannot be reordered.

    - `public void Start()`: It starts the thread

    - `public static bool Yield()`: The calling thread to yield execution to another
    thread which is ready to run on the processor'
  merge: -1
  pgno: 141
