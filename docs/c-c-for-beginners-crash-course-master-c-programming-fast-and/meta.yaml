    \ be inherited.\n- It cannot be overloaded.\n- There can only be one destructor\
    \ in any given class.\n- The destructor cannot be directly called by the programmer;\
    \ it is instead called by the Garbage Collector.\n\nDestructor has the same name\
    \ as its class and is prefixed with ~ symbol which is represented by a tilde.\n\
    \n# Example of Destructors\n\n```\nusing System;\nnamespace destruct\n{\n    class\
    \ Calculate\n    {\n        int number1,number2,sum;\n        Calculate()\n  \
