    \ a thread for a period of time so that another thread can execute, the **Thread.Sleep()**\
    \ method is used. The method takes a single argument stating time in milliseconds.\n\
    \n**Example 55:**\n\n```csharp\nusing System;\nusing System.Threading;\n\nnamespace\
    \ Multithreaded\n{\n    class Program\n    {\n        public static void ChildThread()\n\
    \        {\n            Console.WriteLine(\"Start child thread\");\n         \
    \   int sleeptime = 4000;\n            Console.WriteLine(\"Thread sleeping for\
    \ {0} seconds\", sleeptime / 1000);\n            Thread.Sleep(sleeptime);\n  \
    \          Console.WriteLine(\"Resume child thread\");\n        }\n\n        public\
    \ static void Main()\n        {\n            ThreadStart t1 = new ThreadStart(ChildThread);\n\
    \            Console.WriteLine(\"child thread created\");\n            Thread\
    \ child1 = new Thread(t1);\n            child1.Start();\n            Console.Read();\n\
    \        }\n    }\n}\n```\n\nWhen the code is compiled and executed, the output\
    \ is:\n\n```\nStart child thread\nThread sleeping for 4 seconds\nResume child\
    \ thread\nchild thread created\n```\n\n## 14.6 Destroying threads\n\nThe **Thread.Abort()**\
    \ method is used to destroy the thread. The **ThreadAbortException** is thrown\
    \ when the thread is destroyed. The exception is not caught and is sent to the\
    \ **finally** block.\n\nExample:\n\n```csharp\nusing System;\nusing System.Threading;\n\
    \nnamespace ThreadDemo\n{\n    class Program\n    {\n        public static void\
    \ ChildThread()\n        {\n            try\n            {\n                Console.WriteLine(\"\
    Child Thread started\");\n                for(int j = 0; j <= 10; j++)\n     \
    \           {\n                    Thread.Sleep(1000);\n                    Console.WriteLine(\"\
    Child thread finished\");\n                }\n            }\n            catch(ThreadAbortException\
    \ e)\n            {\n                Console.WriteLine(\"Exception caught\");\n\
    \            }\n            finally\n            {\n                Console.WriteLine(\"\
    Exception is not handled\");\n            }\n        }\n\n        public static\
    \ void Main()\n        {\n            ThreadStart t1 = new ThreadStart(ChildThread);\n\
    \            Console.WriteLine(\"Creating child thread\");\n            Thread\
    \ t2 = new Thread(t1);\n            t2.Start();\n\n            Thread.Sleep(2000);\n\
    \n            //child thread aborted\n            Console.WriteLine(\"Aborting\
    \ child thread\");\n            t2.Abort();\n            Console.Read();\n   \
    \     }\n    }\n}\n```\n\nWhen the code is compiled and executed, the output is:\n\
