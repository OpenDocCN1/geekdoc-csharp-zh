    # 9.1 Introduction to arrays


    An array is a collection of values of similar data type. The variables in the
    array are known as the elements of the array. The array elements are accessed
    using a single name and an index number representing the position of the element
    within the array.


    An array has a rank that determines the number of indices associated with every
    array element. The rank of the array is also referred to as the dimensions of
    the array. The following figure shows the array structure in the system.


    ![](img/c133ae999967b1fbceab3bccc1cb1d4f_82_0.png)'
- md: "## 9.2 Arrays declaration\n\nAn array is declared before it is used in any\
    \ program. The following syntax is used to declare an array.\n\n```\ndatatype[\
    \ ] ArrayName;\n```\n\nThe syntax of an array involves the components mentioned\
    \ below:\n\n- **datatype:** Used for specifying the data type for elements. It\
    \ will be stored in an array.\n- **[ ]:** Specify the size of the array and is\
    \ referred to as rank.\n- **ArrayName:** States the name of the array.\n\n## 9.3\
    \ Initializing and adding values\n\nThe **new** keyword is used to create an instance\
    \ of the array. The size of array is specified when it is initialized. The following\
    \ code snippet is used to initialize the array.\n\n```\nint [ ] x ;\nx = new int\
    \ [15];\n```\n\nThe array can be initialized by combining the two statements and\
    \ is written as:\n`int [ ] x = new int [15];`\n\n### Assigning values to an array\n\
    \nThe values can be assigned to each element of the array using the **index number**.\
    \ It is also known as subscript of the element. The following code snippet is\
    \ used for assigning the values to an array.\n\n```\nint [ ] amount = new int\
    \ [5];\namount[0] = 50;\n```\n\nThe array can be created and initialized using\
    \ the following code:\n\n```\nint [ ] amount = { 40,60,70,80};\n```\n\nThe size\
    \ of an array can be removed.\n\n```\nint [ ] age = new int[ ] { 21,31,40};\n\
    ```\n\nWhen a user copies the data from one array into another, the source and\
    \ target array refer to same location. The following code snippet shows the copying\
    \ of one array to another.\n\n```\nint [ ] age = new int[ ] { 12,14,15,16};\n\
    int [ ] amount = age;\n```\n\nThe two arrays as **age** and **amount** are created.\
    \ They point to same memory location.\n\n## 9.4 Accessing array elements\n\nTo\
    \ access an element in an array, you will need to use an index. An index is the\
    \ number that represents the position of elements in the array. Indexes always\
    \ start from zero, so to access the first element in an array we would do so in\
    \ this format:\n\n*array_name[index]*\n\n*In this case the value of index will\
    \ be zero.*\n\n**Example:**\n\n```csharp\nusing System;\nnamespace arraydeclare\n\
    {\n    class Arraydemo\n    {\n        static void Main(string[] args)\n     \
    \   {\n            int [] a = new int[5];\n            int x,y;\n\n          \
    \  for(int x = 0;x <5;x++)\n            {\n                a[x]=x + 10;\n    \
    \        }\n            for(y = 0;y < 5;y++)\n            {\n                Console.WriteLine(\"\
    Element [{0}]={1}\",y,a[y]);\n            }\n            Console.ReadLine();\n\
    \        }\n    }\n}\n```\n\n**When the code is compiled and executed, the output\
    \ is:**\n\nElement [0] = 10\nElement [1] = 11\nElement [2] = 12\nElement [3] =\
    \ 13\nElement [4] = 14\n\n## 9.5 Foreach loop\n\nThis loop is specifically designed\
    \ to iterate through all elements of an array. It is great for retrieving elements\
    \ of an array efficiently.\n\n### Syntax:\n\n```\nforeach(type identifier in expression)\n\
    statement - block\n```\n\n### Example:\n\n```csharp\n// Example 29:\nusing System;\n\
    namespace arraydeclare\n{\n\tclass Arraydemo\n\t{\n\t\tstatic void Main(string[]\
    \ args)\n\t\t{\n\t\t\tint [] a = new int[5];\n\t\t\tfor(int x = 0;x < 5;x++)\n\
    \t\t\t{\n\t\t\t\ta[x] = x + 10;\n\t\t\t}\n\t\t\tforeach(int y in a)\n\t\t\t{\n\
    \t\t\t\tint x = y - 10;\n\t\t\t\tConsole.WriteLine(\"Element[{0}]\",x,y);\n\t\t\
    \t\tx++;\n\t\t\t}\n\t\t\tConsole.ReadLine();\n\t\t}\n\t}\n}\n```\n\nThe code is\
    \ compiled and executed, the output is:\n\nElement [0] = 10\nElement [1] = 11\n\
    Element [2] = 12\nElement [3] = 13\nElement [4] = 14\n\n## 9.6 Different C# arrays\n\
    \nThe following are various types of C# arrays that are used for developing code.\n\
    \n### Multi-dimensional arrays\n\nA multi-dimensional array stores data in **more\
    \ than one row dimension**. It is also known as rectangular array. User can declare\
    \ two-dimensional array of integer as:\n\n```\nint [ , ] no;\n```\n\nA two-dimensional\
    \ array can be considered as table. It has x rows and y columns. A two-dimensional\
    \ array contains 2 rows and 4 columns.\n\n| | Column 0 | Column 1 | Column 2 |\
    \ Column 3 |\n|---|---|---|---|---|\n| Row 0 | x[0][0] | x[0][1] | x[0][2] | x[0][3]\
    \ |\n| Row 1 | x[1][0] | x[1][1] | x[1][2] | x[1][3] |\n\n#### Initializing two\
    \ dimensional arrays\n\nThe following array has 3 rows and 3 columns.\n\n```\n\
    int [ , ] x = new int [ 3, 3 ] = {\n    {1, 2, 3},\n    {4, 5, 6},\n    {7, 8,\
    \ 9}\n};\n```\n\n#### Accessing elements of multidimensional array\n\nAn element\
    \ from the multi dimensional array can be accessed using the subscripts. They\
    \ are row and column index of the array.\n\n**Example:**\n\n```\nint output =\
    \ a [1, 2];\n```\n\nIn the above statement, the element from second row and third\
    \ column is accessed.\n\n**Example:**\n\n(Refer to image `c133ae999967b1fbceab3bccc1cb1d4f_89_0.png`)\n\
    \nThe code is compiled and executed, the output is:\n\n```\nx[0,0] = 1\nx[0,1]\
    \ = 1\nx[1,0] = 2\nx[1,1] = 2\nx[2,0] = 3\nx[2,1] = 3\n```\n\n### Jagged Array\n\
    \nA jagged array is an array of arrays. The jagged array of int type is declared\
    \ as:\n\n```\nint [ ] [ ] marks;\n```\n\nAn array can be initialized as:\n\n```\n\
    int [ ] [ ] marks = new int [3] [ ] { new int [ ] {45,57,78}, new int [ ] { 60,\
    \ 75, 86,45,35} };\n```\n\nThe marks array is of two arrays of integers as marks[0]\
    \ with 3 integers and marks[1] with 5 integers.\n\n**Example:**\n\n(Refer to image\
    \ `c133ae999967b1fbceab3bccc1cb1d4f_90_0.png`)\n\n```csharp\nusing System;\nnamespace\
    \ Jaggedarray\n{\n    class jagged\n    {\n        static void Main(string[] args)\n\
    \        {\n            int[][] x = new int[][]{\n                new int[]{0,0},\n\
    \                new int[]{2,2},\n                new int[]{3,4},\n          \
    \      new int[]{4,2},\n                new int[]{1,3}};\n\n            int a,b;\n\
    \n            for(a = 0;a < 5;a++)\n            {\n                for(b = 0;b\
    \ < 2;b++)\n                {\n                    Console.WriteLine(\"x[{0},{1}]={2}\"\
    ,a,b,x[a][b]);\n                }\n            }\n            Console.ReadLine();\n\
    \        }\n    }\n}\n```\n\nThe code is compiled and executed, the output is:\n\
    \n```\nx[0,0] = 0\nx[0,1] = 0\nx[1,0] = 2\nx[1,1] = 2\nx[2,0] = 3\nx[2,1] = 4\n\
    x[3,0] = 4\nx[3,1] = 2\nx[4,0] = 1\nx[4,1] = 3\n```\n\n### Param Arrays\n\nWhen\
    \ a method is declared, the number of arguments to be passed as parameter is not\
    \ decided. The **Param** array is used.\n\n**Example:**\n\n```csharp\n// Example\
    \ 32:\nusing System;\nnamespace ParamArray\n{\n    class ParamArray\n    {\n \
    \       public int AddValues(params int[] data)\n        {\n            int total\
    \ = 0;\n            foreach(int a in data)\n            {\n                total\
    \ += a;\n            }\n            return total;\n        }\n    }\n    class\
    \ Test\n    {\n        static void Main(string[] args)\n        {\n          \
    \  ParamArray pa = new ParamArray();\n            int total = pa.AddValues(2,3,4,5,6);\n\
    \            Console.WriteLine(\"The sum is {0}\", total);\n            Console.Read();\n\
    \        }\n    }\n}\n```\n\n**When the code is compiled and executed, the output\
    \ is:**\n\nThe sum is 20\n\n### Array Class\n\nThe **array** class is the base\
    \ class for all arrays in C#. The **System** namespace contains the array class.\
    \ There are various properties and methods used in the array class.\n\n#### Properties\
    \ of Array class\n\n- **Length:** The total number of items in all dimensions\
    \ of an array are returned.\n- **Rank:** It returns the rank of an array.\n- **IsFixedSize:**\
    \ It is a value indicating an array has fixed size or not.\n- **IsReadOnly:**\
    \ Value stating the array is read only or not.\n\n#### Methods of Array class\n\
    \n- **Sort:** The sort operation on an array passed to it as a parameter.\n- **Clear:**\
    \ It removes all the items in an array and sets range of items to 0.\n- **GetLength:**\
    \ The number of items in an array are returned.\n- **GetValue:** The value of\
    \ the specified item in an array.\n- **IndexOf:** The index of the first occurrence\
    \ of a value in one dimensional array is returned.\n- **Reverse:** It reverses\
    \ the sequence of elements in the array.\n\n**Example:**\n\n```csharp\nusing System;\n\
    namespace Array\n{\n    class Array1\n    {\n        static void Main(string[]\
    \ args)\n        {\n            int[] item = {12,34,23,55,64};\n            int[]\
    \ value = item;\n\n            Console.Write(\"Original Array:\");\n         \
    \   foreach(int x in item)\n            {\n                Console.Write(x+\"\
    \ \");\n            }\n            Console.WriteLine();\n\n            //reverse\
    \ the array\n            Array.Reverse(value);\n            Console.Write(\"Array\
    \ reversed:\");\n\n            foreach(int x in value)\n            {\n      \
    \          Console.Write(x+\" \");\n            }\n            Console.WriteLine();\n\
    \n            //sort the array\n            Array.Sort(item);\n            Console.Write(\"\
    Array sorted:\");\n            Console.Read();\n        }\n    }\n}\n```\n\n**When\
    \ the code is compiled and executed, the output is:**\n\nOriginal Array: 12 34\
    \ 23 55 64\nArray reversed: 64 55 23 34 12\nArray sorted: 12 23 34 55 64"
