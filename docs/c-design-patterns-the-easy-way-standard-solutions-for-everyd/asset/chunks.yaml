    ALERT: Terrorist Nearby Agents in New York


    ALERT: Terrorist Nearby Agents in Cleveland


    ALERT: Terrorist Nearby Agents in Boston


    ALERT: Terrorist Nearby Agents in Miami


    Chapter 4: The Singleton Pattern


    ==== ==== ==== ==== ====


    Think of ideas and things that can only have one existing object.


    Perhaps you’re designing an app and one of the classes should not have multiple
    instances of it at the same time. Just like the only active Pacman in the game;
    or the only  ball in a game of pong; or the only Mario playing at a classic Super
    Mario game.


    And you realize that you don’t want to let bugs, exploits, or any sort of hacks
    exist by giving opportunities to create multiple objects that should really stay
    single.


    There’s a solution to this. It’s called the Singleton pattern.


    With it, you can modify your Class to have only one possible object at a time.
    Or one possible object forever.


    How it essentially works:


    The Singleton pattern is one of the more simple design patterns. However, when
    a situation calls for its design, it will prove to be more than helpful.'
