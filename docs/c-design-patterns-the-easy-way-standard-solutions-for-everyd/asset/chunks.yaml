  trans: "\n我们将接口命名为 `BallMaker`。然后，对于我们拥有的每种类型的球，创建一个扩展 `BallMaker` 的子类。这些子类是实际创建球数据对象的类——但它们每一个都有自己的规范。因此，`BasketBallMaker`\
    \ 子类将制造篮球，而 `FootballMaker` 子类将制造足球。\n\n以下是 UML 图的的样式：\n\n![](img/Image00003.jpg)\n\
    \n该模式的伪代码实现也包含在归档中。如果你需要在另一种语言中实现此模式，伪代码应该可以为你提供帮助。\n\n接下来，我们将使用工厂模式。\n\n# C#-1a:\
    \ 工厂模式（在 C# 中实现）\n\n以下是工厂模式在 C# 中的外观形式：\n\n```csharp\n// Factory 由任何需要使用它的子类实现\n\
    \ninterface Factory {\n    // 输入：你的选择\n    // 输出：你的选择（默认设置为 Void）\n    // 实现此接口的类的构造函数\n\
    \    void createObject();\n}\n\n// SubFactory1:\n// 根据 Factory 接口创建不同的对象\nclass\
    \ SubFactory1 : Factory {\n    // 此方法实现了接口中概述的相同函数\n    void Factory.createObject()\
    \ {\n        // 为此创建器类包含任何独特的区别\n        // 此处的其他代码\n    }\n}\n\n// SubFactory2:\n\
    // 根据 Factory 接口创建不同的对象\nclass SubFactory2 : Factory {\n    // 此方法实现了接口中概述的相同函数\n\
    \    void Factory.createObject() {\n        // 为此创建器类包含任何独特的区别\n        // 此处的其他代码\n\
    \    }\n}\n```\n\n在下一章中，我们将对实现此设计模式进行详细演示。\n\n# C#-1b: 实现工厂模式\n\n使用你选择的 IDE 运行以下代码。在线\
    \ IDE，如 [codechef.com](http://codechef.com) , [rextester.com](http://rextester.com)\
    \ , [ideone.com](http://ideone.com) 或 [codpad.org](http://codpad.org) 都是很好的选择。\n\
    \n现在我们将看到工厂模式的运行。你将通过一个示例亲眼看到如何使用此设计模式，并通过一个你继续完成该示例的工作坊。\n\n## 运动球创建器\n\n想象你必须为一个按需定制的\
    \ Web 应用编写代码。它专门用于创建许多不同类型的运动球。\n\n一个通用的球类如下所示：\n\n```csharp\n// 一个运动球具有：\n//\
    \ - 球的类型\n// - 用于制造它的材料数组\n// - 它的尺寸，以半径（英寸）表示\n// - 任何额外的注释\n// - 制造它的公司品牌\n\
    // - 产品名称\nclass SportsBall {\n    public String type;\n    public String[] materialsUsed;\n\
    \    public float radius;\n    public String comments;\n    public String make;\n\
    \    public String modelName;\n}\n```\n\n然而，正如你所看到的，在为运动球创建数据对象时涉及到太多的细节。因此，如果你必须创建一个（例如）某个特定的篮球，这个过程与创建一个足球要不同得多。它们具有不同的类型、材料和尺寸。它们还可能由不同的品牌制造，并且具有不同的特征。\n\
    \n那么，我们该如何以更简单的方式创建运动球呢？涉及的代码也更少？你猜对了。工厂模式！因此在本教程中，让我们通过设置该设计模式的步骤。然后，你将有机会通过扩展工作来练习你所学的内容。\n\
    \n### 第一步：工厂接口\n\n首先，我们将创建一个所有创建球的工厂类都将实现的 `Interface（接口）。目前，它将只有一个方法：返回运动球的实例。\n\
    \n```csharp\n// BallFactory 接口：\n// 关于如何创建球的接口\ninterface BallFactory {\n    /*\n\
    \    // 输入：无\n    // 输出：一个 Ball 对象\n    // 效果：创建一个运动球；\n    // 实现此接口的类将在制造方面有自己的区别\n\
    \    */\n    SportsBall createBall();\n}\n```\n\n### 第二步：第一个类\n\n接下来，我们创建一个实现我们做的\
    \ `BallFactory` 接口的独特工厂类。目前，它做的只是创建篮球。这些可能是 `SportsBall` 对象的实例，但它们将具有篮球的特征。\n\n\
    ```csharp\n// 篮球制造器：\n// 创建具有不同字段的篮球对象\nclass BasketballMaker : BallFactory {\n\
    \    // (方法实现了接口版本)\n    // 效果：创建一个篮球类的运动球\n    SportsBall BallFactory.createBall()\
    \ {\n        SportsBall b = new SportsBall();\n        b.type = \"Basketball\"\
    ;\n        b.materialsUsed = new String[3];\n        b.materialsUsed[0] = \"rubber\"\
    ;\n        b.materialsUsed[1] = \"fiber\";\n        b.materialsUsed[2] = \"synthetic\
    \ composite\";\n        b.radius = 4.8f;\n        b.make = \"Spalding\";\n   \
    \     b.modelName = \"Series Basketball\";\n        return b;\n    }\n}\n```\n\
    \n### 第三步：设计任何额外的工厂类\n\n之后，我们根据需要创建尽可能多的工厂类。它们都实现 `BallFactory` 接口，并且它们都创建具有不同特征和属性的运动球对象。让我们设计一个创建棒球的工厂类来实现。\n\
    \n```csharp\n// 棒球制造器：\n// 创建具有不同字段的棒球对象\nclass BaseballMaker : BallFactory {\n\
    \    // (方法实现了接口版本)\n    // 效果：创建一个篮球类的运动球（注：原文此处应为棒球）\n    SportsBall BallFactory.createBall()\
    \ {\n        SportsBall b = new SportsBall();\n        b.type = \"Baseball\";\n\
    \        b.materialsUsed = new String[6];\n        b.materialsUsed[0] = \"cork\"\
    ;\n        b.materialsUsed[1] = \"wool\";\n        b.materialsUsed[2] = \"poly/cotton\"\
    ;\n        b.materialsUsed[3] = \"cowhide\";\n        b.materialsUsed[4] = \"\
    yarn\";\n        b.materialsUsed[5] = \"composite rubber\";\n        b.radius\
    \ = 1.45f;\n        b.make = \"Rawlings\";\n        b.modelName = \"MLB Official\
    \ Baseball\";\n        return b;\n    }\n}\n```\n\n### 第四步：运行代码\n\n现在你已经设计了工厂类，是时候运行它们了。在你的\
    \ `Main` 函数（具有 `public-static-void-main` 方法的主类）或你任何想要运行代码的方式中，为你设计的每个工厂类创建一个实例。你将调用这些工厂来为你创建特定的对象。\n\
    \n在我们的示例中，我们创建了篮球和棒球工厂。我们将使用它们分别创建篮球和棒球对象。\n\n```csharp\n// 创建工厂\nBallFactory\
    \ f1 = new BasketballMaker();\nBallFactory f2 = new BaseballMaker();\n\n// 创建一个篮球对象：\n\
    // 使用篮球工厂制造篮球\nSportsBall bb1 = f1.createBall();\n\n// 创建一个棒球对象：\n// 使用棒球工厂制造棒球\n\
    SportsBall bb2 = f2.createBall();\n\n// 测试：\n// 这行应该打印出 \"Basketball\"\nConsole.WriteLine(bb1.type);\n\
    // 这行应该打印出 \"Baseball\"\nConsole.WriteLine(bb2.type);\n```\n\n## C#-工作坊 1:\n\n\
    使用你选择的 IDE 运行以下代码。在线 IDE，如 [codechef.com](http://codechef.com) , [rextester.com](http://rextester.com)\
    \ , [ideone.com](http://ideone.com) 或 [codpad.org](http://codpad.org) 都是很好的选择。\n\
    \n## 足球与排球\n\n现在轮你玩工厂模式了。通过创建两个工厂类来展示你所学的内容。其中一个将创建足球，另一个将创建排球。\n\n"
- fmt: "\nAfterwards, write and run a few lines of code that create instances of each\
    \ factory and at least one ball from each factory.\n\nHere’s some code to help\
    \ you get started:\n\n```java\n// The Soccerball Maker:\n// - creates soccer ball\
    \ objects with distinct fields\nclass SoccerballMaker : BallFactory {\n    //\
    \ (method implements the Interface Version)\n    // EFFECT: Creates a sports ball\
    \ as a Soccerball\n    SportsBall BallFactory.createBall() {\n        SportsBall\
    \ b = new SportsBall();\n        // modify the object fields;\n        // they\
    \ should all resemble what and how a soccer ball is like..\n        return b;\n\
    \    }\n}\n\n// The Volleyball Maker:\n// - creates volleyball objects with distinct\
    \ fields\nclass VolleyballMaker : BallFactory {\n    // (method implements the\
    \ Interface Version)\n    // EFFECT: Creates a sports ball as a volleyball\n \
    \   public SportsBall createBall() {\n        SportsBall b = new SportsBall();\n\
    \        // modify the object fields;\n        // they should all resemble what\
    \ and how a volleyball is like..\n        return b;\n    }\n}\n```\n\n### Advanced\
    \ Coding\nNotice how all the sports balls are still one type of object - sports\
    \ balls. How would you change the code so that each of the factory classes create\
    \ objects of balls they’re supposed to create? For example, how would you have\
    \ the `BasketballMaker` create `Basketball` objects instead of general, modified\
    \ `Sports Balls`? Or a `BaseballMaker` creating `Baseball` objects?\n\n# Chapter\
    \ 2: The Composite Pattern\n\nPicture this scenario: you have to organize your\
    \ data in a hierarchal manner. They seem to somehow resemble ‘files’ and ‘folders’.\
    \ As you and other computer users know, files go into folders and folders can\
    \ go into other folders as well. You also want to do this in a way that doesn’t\
    \ replicate unnecessary code. So what do you need? The Composite Pattern.\n\n\
    ### How it essentially works:\nYou have two distinct classes: a `File` class and\
    \ a `Folder` class. Or `Item` and `Group`. `Clothing` and `Bag`. `Toys` and `Box`.\
    \ Any combination of two classes, in which one of them is a collection composed\
    \ of both types.\n\nHowever, both classes may have way too many similar traits,\
    \ methods, and fields. You realize you may need to write twice the code that you\
    \ would normally do - one for the items and one for the groupings.\n\nThe solution\
    \ here is to have them extend a common superclass or abstract class - a `component`.\
    \ This includes one key distinction; the `Group` class contains a collection of\
    \ this superclass. And because both classes extend a common superclass, the `Group`\
    \ class can have a collection of either items or groups.\n\nFor example, let’s\
