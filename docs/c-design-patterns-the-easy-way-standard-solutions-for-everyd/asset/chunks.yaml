                  -> IgnitionCrystal


                  -> DarkMatterDrive (relies on:)


                                - -> EnergyPreIgniter


                                - -> MatterFusionReactor


    WarpDrive relies on:


                  -> WarpIgniter


                  -> MatterFusionReactor


    From looking at the code, the PositronEngine and WarpDrive classes seem to have
    instances of relevant classes or have some sort of reliance on them.


    Hence, we would need instances for these two classes. The rest would be linked
    to them somehow.


        class Facade {


            // NEW LINES:


            PositronEngine pe = new PositronEngine();


            WarpDrive wd = new WarpDrive();


            // MAJOR PROCEDURES:


            public void startEngine(){


                pe.startEngine();


                // (rest of implementation)


            }


            public void activateWarpDrive(){


                wd.warpTo(new Coordinates(0, 0, 0));


                // (rest of implementation)


            } 


        }


    2) Create a general client class. It should contain an instance of the Facade
    class.


    The generalization for the Client class is quite simple. It’s simply a class with
    a Facade instance within it:


        // Client Class:


        // (rest of software accesses this)


        class Client {


            Facade f = new Facade();


        }


    Hence, to access the system’s functionality, we would only need to access the
    Client Class and its underlying facade:


            Client c = new Client();


            // Starting Engine:


            c.f.startEngine();


            // Activating Warp Drive:


            c.f.activateWarpDrive();


    4) Create subclasses for the general client class whenever necessary.


    You have the option to further develop your client classes by creating specialized
