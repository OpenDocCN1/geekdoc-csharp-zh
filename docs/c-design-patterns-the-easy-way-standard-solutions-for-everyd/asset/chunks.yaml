    \n`setState(input)`：\n`this.currentState = input;`\n\n构造函数：\n`Handler()`: `this.currentState\
    \ = new StateOne()`\n\n`AbstractState` 类具有：\n- 选择的通用字段\n包含的方法：\n- (由你选择)\n输入 且\
