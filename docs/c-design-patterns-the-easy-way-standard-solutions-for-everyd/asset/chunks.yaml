    MMORPG Characters:


    In Massively-Multiplayer Online Role-Playing fantasy games before, playable characters
    often fall into certain character archetypes - i.e., the Healer, the Wizard, the
    Archer, the Armoured Knight, and so on. And as you play the game longer, your
    player characters gradually improve and become stronger.


    In terms of code, a general MMORPG character would be data objects based on some
    Data Class similar to this:


    /*


    // An MMOCharacter can:


    // - perform its main skill


    */


    public class MMOCharacter {


        public void skill(){


            // some code here


        }


    }


    Unfortunately, we have a problem. The fact that these characters gradually improve
    will require these classes to be modified during runtime.


    We can’t keep recreating classes for every variant. Not only is this highly cumbersome;
    we also increase the odds of errors within our code if a variant doesn’t exactly
    behave as intended.


    // (Don’t do this)


    public class MMOCharacterLV5 {


        public void skill(){


            // some code here


        }


    }


    // (Don’t do this)


    public class MMOCharacterLV510{


        public void skill(){


            // some code here


        }


        public void skill2(){


            // some code here


        }


    }


    And we also have some amount of character archetypes to implement as well. It
    appears that we should re-create our class for every archetype available. However,
    this isn’t a wise decision as well. This would be highly cumbersome as well -
    just like our earlier problem. We also increase the odds of running into code
    errors.


    // (Don’t do this)


    public class MMOCharacterKnight {


        public void attack(){


            // some code here


        }


    }


    // (Don’t do this)


    public class MMOCharacterHealer {


        public void heal(){


            // some code here


        }


    }


    The solution to this problem is to apply the Decorator Pattern. Using Polymorphism,
    we can develop our data classes to allow data objects to be modified while the
    game is running.


    To apply our pattern, we do it using the step-by-step procedure we’ve outlined
    earlier.


    1) Create a general abstraction that covers ALL subclasses and variants.


    Let’s recall the abstract form of our Decorator pattern:


    /*


    // DECORATOR IMPLEMENTATION:


    // This abstract form has:


    // - the signature for any common procedures,


    //               algorithms, and traits common to ALL subclasses


    */


    public abstract class DecorativeObject {


                  // IN & OUT: (Your Choice)


                  // (Implementation done by Subclasses)


        public void procedure() {


        }


                  // (include any other common fields


                  // and procedures as you wish)


    }


    This abstraction allows our data classes to progressively change even during runtime.
    Through polymorphism, we can swap our data classes to include additional functionality.


    In our situation. our abstraction can be a generalized MMORPG character with a
    single skill and a few individual fields. However, because we will be using varied
    fields, abstract classes will be more suitable than interfaces. Hence, our abstraction
    will use abstract classes:


    /*


    // DECORATOR IMPLEMENTATION:


    // Character abstraction with:


    // -  a single skill


    // - health points (int)


    // - attack power (int)              */


    public abstract class Character {


                  // IN: - a Target Character


                  // OUT: none


                  // (Implementation done by Subclasses)


                  abstract public void skill(Character target);


                  public int hp;


                  public int atk;


    } 


    2) Create the default subclass. This will directly extend your general abstraction
    from earlier.


    Again, let’s recall the default subclass from our Decorator Pattern:


    public class BaseObject : DecorativeObject {


                  // Common Procedure, implemented as Base Object


                  public void procedure() {


                                        base.procedure();


                                // (Implement this procedure here)


                  }


                  // (include any other fields


                  // and procedures as you wish)


    }


    When a character is newly created, it will be an instance of our default class
    . Hence, it needs to be an extension of our main abstraction.


    class DefaultChar : Character {


                  // Common Procedure, implemented as Base Object


                  override public void skill(Character target) {


            // include any code you want


                  }'
