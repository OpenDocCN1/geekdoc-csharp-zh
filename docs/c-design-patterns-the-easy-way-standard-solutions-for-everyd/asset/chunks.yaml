    \ = currentMode.firePower;\n    double cooldown = currentMode.firingRate;\n  \
    \  double timer = 0;\n    /*\n    // (some other code that:\n    // - deals damage\
    \ to the target\n    // - increments the timer from 0 to the cooldown time\n \
    \   // - if timer reaches the cooldown time,\n    //   weapon can fire at the\
    \ target again\n    */\n}\n```\n\nThe `move()` method also depends on the Transformer\
    \ Mech’s current state. The Mech’s speed will depend on whichever mode it is currently\
    \ set to Within the `TransformerMech` class, replace the empty `move()` method\
    \ with the code below (again, for simplicity’s sake, we can forego the full implementation\
    \ for now):\n\n```java\npublic void move(double degrees, double dist) {\n    int\
    \ speed = currentMode.moveSpeed;\n    /*\n    // some other code that\n    //\
    \ moves this Transformer Mech\n    // in the given direction (degrees)\n    //\
    \ until it reaches the given distance (dist).\n    //\n    // The Transformer\
    \ Mech will move\n    // at its move speed,\n    */\n}\n```\n"
