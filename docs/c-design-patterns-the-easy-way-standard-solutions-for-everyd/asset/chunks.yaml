    C# Introduction


    ========================= ======


    C# (pronounced C-sharp) is a programming language specifically developed for Microsoft
    software development. Much like the major programming languages, a lot of C# code,
    features, and other capabilities is based the C programming language. One of the
    key improvements C# has over C is, perhaps one of the most prominently used and
    important programming paradigms today, object-oriented programming.


    And object-oriented programmers will encounter many repeating challenges during
    software development. What’s important to know is that these challenges have been
    encountered - and solved - before.


    What if you know you have to create some File-Folder relationship within your
    program? What if you have a component in your program that consistently needs
    to update itself based on certain events or changes? What if you and your colleague
    both need to adapt to each other’s older code?


    At some point, you’ll notice the patterns: a certain situation will usually require
    a certain programming solution. These solutions happen to be certain patterns
    in code (no matter the language)  that apply to certain situations you encounter.


    Thus, Design Patterns are created.


    What’s important to know is how to promptly and effortlessly implement these patterns
    - and this book will show you how. Even if you’re just starting out in C# programming,
    you’ll find great use of all the techniques you’ll find here.


    C# Workshops:


    Throughout the book, you’ll encounter workshops that will help you apply the various
    design patterns by putting them to good use. As you do them, think about the situations
    that require them to be used.


    Then, throughout your own coding projects, think carefully about your designs
    and ask yourself which situations would have a certain design pattern come in
    handy.


    We’ve designed this book to be very hands-on - giving you plenty of chances to
    use the material.


    This is surely NOT a spectator’s book. If you would like to apply a new set of
    programming designs, then read on.


    ========================= ======


    C#-00: A Quick Important note about C# code


    A C# File


    Before we get started, be sure to familiarize yourself with the structure of a
    C# class file, shown below between the dashed lines.


    using System;


    using System.Collections.Generic;


    using System.Linq;


    using System.Text.RegularExpressions;


    // ADD MORE LIBRARIES HERE


    namespace ___ {


                  // ADD CLASSES HERE


        public class Program {


            public static void Main(string[] args) {


               // ADD MAIN CODE HERE


            }


        }


    }     


        }


    }


    Chapter 1: The Factory Pattern


    ==== ==== ==== ==== ====


    Are you not sure about which data object to create at a given time?


    When creating a data object, are there a lot of complex aspects to keep in mind?


    Then you need to use the Factory Method.


    How it essentially works:


    Depending on the programming language you use, you create a class interface that
    standardizes the data object creation. However, you would use subclasses (which
    extend or implement your higher “factory” interface) to actually create the data
    objects. The subclasses allow for a whole range of flexibility in creating data
    objects. If your programming language doesn’t have interfaces or abstract classes,
    simply create your ‘factory’ interface as a class, then have subclasses extend
    it.


    For example, consider having to make a wide range of sports ball data objects,
    such as basketballs, soccer balls, footballs, volleyballs, etc.. You wouldn’t
    know what to create at a particular time. So how would you code this? Create an
    interface that outlines object construction for balls.'
