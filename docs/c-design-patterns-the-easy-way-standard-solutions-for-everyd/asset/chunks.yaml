    \ `Facade pattern`。\n\n### 识别主要过程\n\n给定先前的几个类，我们的任务是实现：\n- 启动主引擎\n- 激活曲速驱动器\n\n\
    然后我们选择一种实现 `Facade pattern` 的方法。目前，我们将它应用为一个包含所有内容的单一 `Facade` 包装类。\n\n### 1)\
    \ 创建通用的“Facade”类\n\n我们从创建 `Facade` 包装类开始，如下：\n\n```csharp\nclass Facade {\n}\n\
    ```\n\n该类应该实现之前提到的所有主要过程。\n\n```csharp\nclass Facade {\n    // 新行：\n    // 主要过程：\n\
    \    public void startEngine() {\n        pe.startEngine();\n        // (其余的实现)\n\
    \    }\n    public void activateWarpDrive() {\n        wd.warpTo(new Coordinates(0,\
    \ 0, 0));\n        // (其余的实现)\n    }\n}\n```\n\n### 包含尽可能多的组件实例\n\n这通常是该过程中棘手的部分。我们只需要包含有助于主要过程的关键类的实例。\n\
    \n如果我们仔细观察代码，会发现某些组件依赖于其他组件才能工作。映射出来，它看起来是这样：\n\n- `PositronEngine` 依赖于：\n   \
    \ - `IgnitionCrystal`\n    - `DarkMatterDrive`\n- `DarkMatterDrive` 依赖于：\n   \
    \ - `EnergyPreIgniter`\n    - `MatterFusionReactor`\n- `WarpDrive` 依赖于：\n    -\
    \ `WarpIgniter`\n    - `MatterFusionReactor`\n\n查看代码，我们需要 `PositronEngine` 和 `WarpDrive`\
    \ 的实例。\n\n```csharp\nclass Facade {\n    // 新行：\n    // 主要过程：\n    PositronEngine\
    \ pe = new PositronEngine();\n    WarpDrive wd = new WarpDrive();\n\n    public\
    \ void startEngine() {\n        pe.startEngine();\n        // (其余的实现)\n    }\n\
    \    public void activateWarpDrive() {\n        wd.warpTo(new Coordinates(0, 0,\
    \ 0));\n        // (其余的实现)\n    }\n}\n```\n\n### 2) 创建通用的客户端类\n\n它应该包含 `Facade`\
    \ 类的实例。\n\n客户端类的泛化非常简单。它只是一个包含 `Facade` 实例的类：\n\n```csharp\n// 客户端类：\n// (软件的其他访问部分)\n\
    class Client {\n    Facade f = new Facade();\n}\n```\n\n因此，为了访问系统的功能，我们只需要访问 `Client`\
    \ 及其底层的 facade：\n\n```csharp\nClient c = new Client();\n// 启动引擎：\nc.f.startEngine();\n\
    // 激活曲速驱动器：\nc.f.activateWarpDrive();\n```\n\n### 4) 需要时为通用客户端类创建子类\n\n你可以通过创建专门的子类和其他更多来进一步开发你的客户端类。\n\
    \n// 客户端子类：\n\n"
