    p1tm3.move(132, 0.00045);\n```\n\n接下来，假设第二组收到了曼哈顿一艘敌母舰的坐标。他们被赋予了尽快消灭它的任务。\n\n\
    ```java\nCoordinates enemyMothership = new Coordinates(40.8877895, -73.872194,\
    \ 10000);\n```\n\n为了执行命令，第二组快速向敌母舰飞去。但在之前，其中一台机甲必须变换为飞行模式：\n\n```java\np2tm1.setMode(new\
    \ FlightMode());\np2tm1.move(15.6, 0.00063);\np2tm2.move(15.6, 0.00064);\np2tm2.move(15.6,\
    \ 0.00062);\n```\n\n… 改变它们状态，卸载最强大的武器……\n\n```java\np2tm1.setMode(new BlasterCannonMode());\n\
    p2tm2.setMode(new BlasterCannonMode());\np2tm2.setMode(new BlasterCannonMode());\n\
    ```\n\n… 最后，对敌方威胁火力。\n\n```java\np2tm1.fireMainWeapon(enemyMothership);\np2tm2.fireMainWeapon(enemyMothership);\n\
    p2tm3.fireMainWeapon(enemyMothership);\n```\n\n总结来说，`状态模式（State Pattern）在运行时提供了巨大的活性。当你遇到需要持续可塑数据对象的场景时，请使用`状态模式`。\n\
    \n# 第 8 章：外观模式（Facade Pattern）\n\n==== ==== ==== ==== ====\n\n如果你以前开过车，你就知道操作它是多简单。启动汽车只需要在点火部位转动钥匙（现在是按按钮）。要开得更快，就踩油门。要减速或停止，就踩刹板。方向盘也有明显的功能。\n\
    \n但汽车也是一个非常复杂的系统。启动汽车需要电池提供充足的功率。之后，它需要油箱提供足够的汽油。火花塞也必须保持完好。必须有足够的新机油来驱动汽车发动机活塞和其他部件。还有其他尚未提到的事情——而且这因车而异。如果一切正常，火花塞会点燃气缸，并在发动机中产生足够的能量来推动汽车。\n\
    \n此外，转向、加速和刹车都需要一组组件协同工作。但我们通常不会考虑这一点，因为从驾驶座来看，我们只能看到可见的组件。换句话说，这就是`外观（Facade）`。\n\
    \n## 外观模式如何工作\n\n`外观模式`为子系统中的一组接口提供统一的接口。这个`外观`定义了一个更高层次的接口，使得子系统更容易使用。\n\n回到我们的汽车类比，`外观`就是驾驶员的界面。操作汽车只需要知道如何使用踏板和方向盘。你不需要知道发动机喷射是如何工作的，或者火花塞是如何点花的。\n\
    \n## 创建外观模式\n\n要实现`外观模式`，我们首先识别子系统组件，然后创建一个封装它们的`外观`类。\n\n```java\n// Subsystem\
    \ components\nclass Engine {\n    void start() { System.out.println(\"Engine starting...\"\
    ); }\n    void stop() { System.out.println(\"Engine stopping...\"); }\n}\n\nclass\
    \ FuelSystem {\n    void inject() { System.out.println(\"Injecting fuel...\");\
    \ }\n}\n\n// The Facade class\nclass CarFacade {\n    private Engine engine =\
    \ new Engine();\n    private FuelSystem fuelSystem = new FuelSystem();\n\n   \
    \ public void startCar() {\n        fuelSystem.inject();\n        engine.start();\n\
    \    }\n\n    public void stopCar() {\n        engine.stop();\n    }\n}\n```\n\
    \n"
- fmt: "\nIn this system, we need to coordinate all the components together.\n\nHence,\
    \ here is how the `Facade Pattern` would be implemented in C#. If the `Facade`\
    \ would be implemented as an interface, it would look like so:\n\n```csharp\n\
    /*\n// Facade as an Interface\n// (include all major procedures that utilize\n\
    // components within the environment)\n*/\ninterface Facade{\n    // MAJOR PROCEDURES:\n\
    \    // IN & OUT: (your choice)\n    // EFFECT: (your choice)\n    //        \
    \   - calls methods from all system components\n    void activateA();\n    void\
    \ activateB();\n}\n```\n\n```csharp\n/*\n// Client Classes\n// (Implement all\
    \ procedures defined within\n// the Facade interface)\n*/\nclass Client : Facade\
    \ {\n    ComponentOne c1 = new ComponentOne();\n    ComponentTwo c2 = new ComponentTwo();\n\
    \    ComponentN cN = new ComponentN();\n\n    // Methods from Facade Interface:\n\
    \    void Facade.activateA() {\n        c1.distinctMethodOne();\n    }\n    void\
    \ Facade.activateB() {\n        c2.distinctMethodTwo();\n        cN.distinctMethodN();\n\
    \    }\n}\n```\n\nIn this case, `Client` classes would then implement the interface:\n\
    \n```csharp\n// Client Subclasses:\n// (add whenever necessary)\nclass ClientA\
    \ : Client {\n}\nclass ClientB : Client {\n}\n```\n\nIf the `Facade` would be\
    \ implemented as a large superclass instead, it would look like this:\n\n```csharp\n\
    /*\n// Facade as a major Class\n// - include instances for each component\n//\
    \ in the environment\n// - include all major procedures that utilize\n// components\
    \ within the environment\n*/\nclass Facade{\n    ComponentOne c1 = new ComponentOne();\n\
    \    ComponentTwo c2 = new ComponentTwo();\n    …\n    ComponentN cN = new ComponentN();\
    \ \n\n    // MAJOR PROCEDURES:\n    // IN & OUT: (your choice)\n    // EFFECT:\
    \ (your choice)\n    public void activateA() {\n        c1.distinctMethodOne();\n\
    \    }\n    public void activateB() {\n        c2.distinctMethodTwo();\n     \
    \   cN.distinctMethodN();\n    }\n}\n```\n\nIn this case, `Client` classes would\
    \ have an instance of the `Facade` class:\n\n```csharp\n// Client Class:\n// (rest\
    \ of software accesses)\nclass Client {\n    Facade f = new Facade();\n}\n\n//\
    \ Client Subclasses:\n// (add whenever necessary)\nclass ClientA extends Client{}\n\
    class ClientB extends Client{}\n```\n\n# C#-8b: Applying The Facade Pattern\n\n\
    Use an IDE of your choice for the code below. Online IDE’s, such as [codechef.com](http://codechef.com),\
    \ [rextester.com](http://rextester.com), [ideone.com](http://ideone.com), or [codepad.org](http://codpad.org)\
    \ are a great choice.\n\nIn this chapter, we encounter a scenario which requires\
    \ the `Facade pattern` implementation.\n\n## Galactic Starship with Warp Drive\n\
    \nHere, we have a small chunk of code from a `Galactic Starship` system. Each\
    \ class partly manages the corresponding starship hardware components.\n\n```csharp\n\
    /*\n// GALACTIC STARSHIP GSX2013-A4\n// Components listed:\n// - Positron Engine\n\
    // - Ignition Crystal\n// - Dark Matter Drive\n// - Energy Pre-Igniter\n// - Matter\
    \ Fusion Reactor\n// - Warp Drive\n// - Galactic Navigation\n// - Co-ordinates\n\
    // - Warp Igniter\n*/\nclass PositronEngine {\n    IgnitionCrystal igc = new IgnitionCrystal();\n\
    \    DarkMatterDrive dmd = new DarkMatterDrive();\n    public void startEngine()\
    \ {\n        igc.lightUp();\n        dmd.activate();\n    }\n}\nclass IgnitionCrystal\
    \ {\n    public void lightUp() {\n        // (some implementation here)\n    }\n\
    }\nclass DarkMatterDrive {\n    EnergyPreIgniter epi = new EnergyPreIgniter();\n\
    \    MatterFusionReactor fr = new MatterFusionReactor();\n    public void activate()\
    \ {\n        epi.ignite();\n        fr.fuse();\n    }\n}\nclass EnergyPreIgniter\
    \ {\n    public void ignite(){\n        // (some implementation here)\n    }\n\
    }\nclass MatterFusionReactor {\n    public void fuse() {\n        // (some implementation\
    \ here)\n    }\n}\nclass WarpDrive {\n    WarpIgniter wi = new WarpIgniter();\n\
    \    MatterFusionReactor fr = new MatterFusionReactor();\n    public void warpTo(Coordinates\
    \ c) {\n        wi.activate();\n        fr.fuse();\n        // (warpship to location)\n\
    \    }\n}\n```\n\nNOTE: make sure the line `using System.Collections;` is near\
    \ the top of your code\n\n```csharp\nclass GalacticNavigation {\n    ArrayList\
    \ points = new ArrayList();\n}\nclass Coordinates {\n    int x, y, z;\n    public\
    \ Coordinates(int x, int y, int z) {\n        this.x = x;\n        this.y = y;\n\
    \        this.z = z;\n    }\n}\nclass WarpIgniter {\n    public void activate()\
    \ {\n        // (some implementation here)\n    }\n}\n```\n\nClearly, this is\
    \ still a very complex system though we only have a handful of its components.\
    \ But let’s say we’ve been given the task to coordinate these components for a\
    \ couple of important tasks: starting the main engine and activating the warp\
    \ drive. We clearly have to simplify these tasks under a common handle. Hence,\
    \ we apply the `Facade pattern`.\n\n### Identify the Major Procedures\n\nGiven\
    \ the handful of classes from earlier, our task is to implement the following:\n\
    - starting the main engine\n- activating the warp drive\n\nWe then select an approach\
    \ for implementing the `Facade pattern`. For now we’ll apply it as one encompassing\
    \ `Facade` wrapper class.\n\n### 1) Create the general “Facade” class\n\nWe start\
    \ by creating the `Facade` Wrapper class, as seen below:\n\n```csharp\nclass Facade\
    \ {\n}\n```\n\nThis class should implement ALL the Major Procedures mentioned\
    \ earlier.\n\n```csharp\nclass Facade {\n    // NEW LINES:\n    // MAJOR PROCEDURES:\n\
    \    public void startEngine() {\n        pe.startEngine();\n        // (rest\
    \ of implementation)\n    }\n    public void activateWarpDrive() {\n        wd.warpTo(new\
    \ Coordinates(0, 0, 0));\n        // (rest of implementation)\n    }\n}\n```\n\
    \n### Contain as many component instances as necessary\n\nThis is normally the\
    \ tricky part of the process. We only have to include instances from the key classes\
    \ contributing to the major procedures.\n\nIf we take a close look at the code,\
    \ we realize that some components rely on other components in order to function.\
    \ When mapped out, it would look like so:\n\n- `PositronEngine` relies on:\n \
    \   - `IgnitionCrystal`\n    - `DarkMatterDrive`\n- `DarkMatterDrive` relies on:\n\
    \    - `EnergyPreIgniter`\n    - `MatterFusionReactor`\n- `WarpDrive` relies on:\n\
    \    - `WarpIgniter`\n    - `MatterFusionReactor`\n\nLooking at the code, we need\
    \ instances for `PositronEngine` and `WarpDrive`. \n\n```csharp\nclass Facade\
    \ {\n    // NEW LINES:\n    // MAJOR PROCEDURES:\n    PositronEngine pe = new\
    \ PositronEngine();\n    WarpDrive wd = new WarpDrive();\n\n    public void startEngine()\
    \ {\n        pe.startEngine();\n        // (rest of implementation)\n    }\n \
    \   public void activateWarpDrive() {\n        wd.warpTo(new Coordinates(0, 0,\
    \ 0));\n        // (rest of implementation)\n    }\n}\n```\n\n### 2) Create a\
    \ general client class\n\nIt should contain an instance of the `Facade` class.\n\
    \nThe generalization for the `Client` class is quite simple. It’s simply a class\
    \ with a `Facade` instance within it:\n\n```csharp\n// Client Class:\n// (rest\
    \ of software accesses)\nclass Client {\n    Facade f = new Facade();\n}\n```\n\
    \nHence, to access the system’s functionality, we would only need to access the\
    \ `Client` and its underlying facade:\n\n```csharp\nClient c = new Client();\n\
    // Starting Engine:\nc.f.startEngine();\n// Activating Warp Drive:\nc.f.activateWarpDrive();\n\
    ```\n\n### 4) Create subclasses for the general client class whenever necessary\n\
    \nYou have the option to further develop your client classes by creating specialized\
    \ subclasses and more.\n\n// Client Subclasses:\n"
