        public void ignite(){      


            // (some hardware implementation here)       


        }


    }


    class MatterFusionReactor {


        public void fuse() {


            // (some hardware implementation here)


        }


    }


    class WarpDrive {


        WarpIgniter wi = new WarpIgniter();


        MatterFusionReactor mfr = new MatterFusionReactor();   


        public void warpTo(Coordinates c) {


