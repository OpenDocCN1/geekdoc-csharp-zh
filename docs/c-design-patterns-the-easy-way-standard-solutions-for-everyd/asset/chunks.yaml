    A Transformer Mech’s ability to move and fire its weapon will depend on what state
    it’s in. As a bipedal robot, it can move modestly, but it doesn’t have a main
    weapon. As a tank, it can move faster, have a higher armor rating, and use a standard
    weapon. As an immobile cannon, it will have an extremely powerful weapon at the
    cost of its movement ability. And as an airborne flyer, it can move extremely
    fast in all directions.


    Clearly, this situation will require the State Pattern. So let’s apply it step-by-step.


    1) Identify which class will be the ‘handler’ class. A key part of the functionality
    from this class will depend on its current state.


    The TransformerMech class will be the ‘handler’ class. Thus, we’ll implement it
    in a way that utilizes its ever-changing current state.


    2) Create the State abstraction. Define all common fields and procedures here.


    The abstract form of your various States will include ALL fields and procedures
    that each one of your states share.


    Earlier, we’ve described the various traits that our Transformer Mech will have:
    some main weapon and a movement ability. Our main weapon has a damage output rating
    and a firepower rating.


    Let’s also include some form of armor to mitigate attacks. So overall, our Mech
    will have all of these traits, but their values vary depending on the ‘State’
    our Mech is in.


    Hence, here is what our abstract class can look like:


    abstract class AbstractMode {


        public int firePower;


        public double firingRate;


        public int moveSpeed; 


        public int armor;


    }


    Now we can start developing the different States our Mech can take.


    3) Create all the different State Subclasses. Implement where necessary.


    We’ve described four different states for our Transformer Mech earlier. The first 
    state is a bipedal robot with no main weapons and a relatively slower movement
    speed (it runs to move).


    Hence, the State class will look like this:


    class RobotMode: AbstractMode {


        // CONSTRUCTOR:


        public RobotMode(){


                this.firePower = 0;


                this.firingRate = 0;


                this.moveSpeed = 10;


                this.armor = 10;


        }   


    }


    The next State we’ve described is a tank with a main weapon with reasonably fair
    damage and fire rate, as well as a high armor rating. Its State class will look
    like this:


    class TankMode: AbstractMode {   


        // CONSTRUCTOR:


        public TankMode(){


                this.firePower = 25;


                this.firingRate = 0.75;


                this.moveSpeed = 50;


                this.armor = 50;


        }


    }


    The third State is an immobile cannon. It has a highly powerful yet slow main
    weapon. It also has a moderate armor rating. This is what its State class will
    look like:


    class BlasterCannonMode: AbstractMode {      


        // CONSTRUCTOR:


        public BlasterCannonMode(){


                this.firePower = 180;


                this.firingRate = 5.0;


                this.moveSpeed = 0;


                this.armor = 30;


        }


    }


    And lastly, the Flight State gives the Transformer Mech the ability to fly. Its
    weapon will have a modest firepower rating but with a high rate of fire.


    class FlightMode: AbstractMode {       


        // CONSTRUCTOR:


        public FlightMode(){


                this.firePower = 15;


                this.firingRate = 0.5;


                this.moveSpeed = 105;


                this.armor = 20;       


        }              }


    Now that we’ve implemented our different states, we can now integrate them into
    our Transformer mech in the next step.


    4) Make the Handler include an instance of its current state. Its data type should
    be the Abstract Class. When initialized with a constructor, the Handler should
    have a default state.


    To integrate our various, interchangeable States onto our Transformer Mech, we
    do two things. The first is to include the current State into our Mech class as
    a field. Afterwards, we need to initialize this field somehow. The best way to
    do it is within the Constructor; one of its inputs can be the default state for
    a Transformer Mech.


    class TransformerMech {


        // Coordinates


        Coordinates location;


        // Field for Current State:


        AbstractMode currentMode; // NEW LINE


        void fireMainWeapon(Coordinates target) {} 


       void move(double degrees) {  }


        // NEW LINES: - - - - - -


        // CONSTRUCTOR:


