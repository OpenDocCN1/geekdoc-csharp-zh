- fmt: "\n# Applying The Decorator Pattern\n\nHere, we encounter a scenario which\
    \ requires the Decorator pattern.\n\n## MMORPG Characters\n\nIn Massively Multiplayer\
    \ Online Role-Playing games, playable characters often fall into certain archetypes\
    \ - i.e., the `Healer`, the `Wizard`, the `Armoured Knight`, and so on. As you\
    \ play the game longer, your player characters gradually improve and become stronger.\
    \ In terms of code, a general MMORPG character would be data objects based on\
    \ some Class similar to this:\n\n```java\n/*\n// MMOCharacter can:\n// - perform\
    \ its main skill\n*/\nclass MMOCharacter {\n    public void skill(){\n       \
    \ // some code here\n    }\n}\n```\n\nUnfortunately, we have a problem. The fact\
    \ that these characters gradually improve will require these classes to be modified\
    \ during runtime. can’t keep recreating classes for every variant. Not only is\
    \ this cumbersome; we also increase the odds of errors within our code if a variant\
    \ doesn’t behave as intended.\n\n```java\n// (Don’t do this)\nclass MMOCharacterLV\
    \ {\n    public void skill(){\n        // some code here\n    }\n}\n\n// (Don’t\
    \ do this)\nclass MMOCharacterLV10{\n    public void skill(){\n        // some\
    \ code here\n    }\n    public void skill2(){\n        // some code here\n   \
    \ }\n}\n```\n\nAnd we also have some amount of archetypes to implement as well.\
    \ It appears that we should re-create our class for archetype available. However,\
    \ this isn’t a wise decision as well. This would be highly cumbersome as well\
    \ - like our earlier problem. We also increase the odds of running into code errors.\n\
    \n```java\n// (Don’t do this)\nclass MMOCharacterKnight {\n    public void attack(){\n\
    \        // some code here\n    }\n}\n\n// (Don’t do this)\nclass MMOCharacterHealer\
    \ {\n    public void heal(){\n        // some code here\n    }\n}\n```\n\nThe\
    \ solution to this problem is to apply the Decorator Pattern. Using Polymorphism,\
    \ we can develop our data classes to allow data objects to be modified while the\
    \ game is running. To apply our pattern, we do it using the step-by-step procedure\
    \ we’ve outlined earlier.\n\n### 1) Create a general abstraction that covers ALL\
    \ subclasses and variants.\n\nLet’s recall the abstract form of our Decorator\
    \ pattern:\n\n```java\n/*\n// DECORATOR IMPLEMENTATION:\n// This abstract form\
    \ has:\n// - the signature for any common procedures,\n// - algorithms, and traits\
    \ common to ALL subclasses\n*/\nabstract class DecorativeObject {\n    // IN &\
    \ OUT: (Your Choice)\n    // (Implementation done by Subclasses)\n    public void\
    \ procedure() {\n    }\n    // (include any other common fields)\n}\n```\n\nThis\
    \ allows our data classes to change even during runtime. Through polymorphism,\
    \ we can swap data classes. However, because we will be varied fields, our abstraction\
    \ will use:\n\n```java\n/*\n// DECORATOR IMPLEMENTATION:\n// Character with:\n\
    // - single skill\n// - health (int)\n// - attack (int)\n*/\nabstract class Character\
    \ {\n    // IN: Target\n    // OUT: none\n    abstract void skill(Character target);\n\
    \    int hp;\n    int atk;\n}\n```\n\n### 2) Create the default subclass.\n\n\
    This will directly extend your general abstraction. Again, let’s recall the default\
    \ subclass from our Decorator Pattern:\n\n```java\npublic class BaseObject : DecorativeObject\
    \ {\n    // Common Procedure, implemented as Base Object\n    public void procedure()\
    \ {\n        base.procedure();\n        // (Implement this procedure here)\n \
    \   }\n    // (include any other fields\n    // and procedures as you wish)\n\
    }\n```\n\nWhen a character is newly created, it will be an instance of our default\
    \ class. Hence, it needs to be an extension of our main abstraction.\n\n```java\n\
    class DefaultChar : Character {\n    // Common Procedure, implemented as Base\
    \ Object\n    override public void skill(Character target) {\n        // include\
    \ any code you want\n    }\n}\n```\n\n### Decoration Classes\n\nThe Decorations\
    \ will include any additional modifications you’d like to apply to your decorative\
    \ object. This will use a structure similar to the Composite Pattern.\n\nCreating\
    \ an instance of one will require the previous Decorator as a Constructor input\
    \ (or use the `BaseObject` if there is none). This way, you pretty much daisy-chain\
    \ as many Decorators as you wish on top of a default `BaseObject`.\n\n```java\n\
    public class Decoration : DecorativeObject {\n    // Previously applied Decoration\
    \ Instance added: \n    public DecorativeObject prevDeco;        \n\n    // Common\
    \ Procedure, implemented as Decoration\n    // Includes any extra effects added\
    \ by this Decoration\n    public void procedure() {\n        base.procedure();\n\
    \        // (Implement this procedure here,\n        // Add anything else you’d\
    \ like as well)\n        prevDeco.procedure();\n    }\n    // CONSTRUCTOR:\n \
    \   public Decoration(DecorativeObject d) {\n        this.prevDeco = d;      \n\
    \    }\n    // (include any other fields\n    // and procedures as you wish)\n\
    }\n```\n\nNotice how the `procedure()` method calls the previous Decoration’s\
    \ method as well. This way, once `procedure()` has been called, its true effect\
    \ will be delivered by EVERY Decoration added - plus the effects from the `BaseObject`.\n\
    \nAnd lastly, you can have as many different decoration classes as you wish. They\
    \ all extend the `Decoration` class and may include additional fields and procedures\
    \ of their own.\n\n```java\nclass DecorationOne : Decoration {\n    // Common\
    \ Procedure, implemented as DecorationOne\n    // (also implements procedure()\
    \ as its superclass)\n    public void procedure() {\n        base.procedure();\
    \     \n        // (Implement this procedure here)\n    }\n    // (include any\
    \ other fields\n    // and procedures as you wish)\n    // CONSTRUCTOR:\n    public\
    \ DecorationOne(DecorativeObject d) : base(d) {\n        this.prevDeco = d;\n\
    \    }\n}\n```\n\n```java\nclass DecorationX : Decoration {\n    // Common Procedure,\
    \ implemented as DecorationX\n    // (also implements procedure() as superclass)\n\
    \    public void procedure() {\n        base.procedure();\n        // (Implement\
    \ this procedure here)\n    }\n    // (include any other fields\n    // and procedures\
    \ as you wish)\n    // CONSTRUCTOR:\n    public DecorationX(DecorativeObject d)\
    \ : base(d) {\n        this.prevDeco = d;\n    }\n}\n```\n"
