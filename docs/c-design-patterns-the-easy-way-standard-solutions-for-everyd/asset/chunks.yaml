  trans: "\n\n# 应用装饰器模式\n\n在这里，我们遇到了一个需要装饰器模式的场景。\n\n## MMORPG 角色\n\n在大型在线角色扮演游戏（MMORPG）中，可玩家的角色通常属于某些原型——例如\
    \ `Healer`（治疗师）、`Wizard`（法师）、`Armoured Knight`（装甲骑士）等。随着游戏时间的推移，你的玩家角色会逐渐提升并变得强大。在代码层面，一个通用的\
    \ MMORPG 角色可能是基于类似下面的类的数据对象：\n\n```java\n/*\n// MMOCharacter 可以：\n// - 执行其主技能\n\
    */\nclass MMOCharacter {\n    public void skill(){\n        // 此处有一些代码\n    }\n\
    }\n```\n\n遗憾的是，我们遇到了一个问题。角色逐渐提升的特性意味着我们需要在运行时修改这些类。我们不能为每种变体不断创建新类。这不仅繁琐，如果某个变体的行为不符合预期，我们还会增加代码中出错的概率。\n\
    \n```java\n// (不要这样做)\nclass MMOCharacterLV {\n    public void skill(){\n    \
    \    // 此处有一些代码\n    }\n}\n\n// (不要这样做)\nclass MMOCharacterLV10{\n    public void\
    \ skill(){\n        // 此处有一些代码\n    }\n    public void skill2(){\n        // 此处有一些代码\n\
    \    }\n}\n```\n\n此外，我们还需要实现一定数量的原型。看起来我们应该为每个可原型重建类。然而，这同样一个明智的决定。这也会像我们之前的问题一样非常繁琐。我们还会增加遇到代码错误的概率。\n\
    \n```java\n// (不要这样做)\nclass MMOCharacterKnight {\n    public void attack(){\n\
    \        // 此处有一些代码\n    }\n}\n\n// (不要这样做)\nclass MMOCharacterHealer {\n    public\
    \ void heal(){\n        // 此处有一些代码\n    }\n}\n```\n\n解决这个问题的方案是应用装饰器模式。通过多态，我们可以开发数据类，允许数据对象在游戏运行时被修改。为了应用该模式，我们按照之前概述的步骤逐步进行。\n\
    \n### 1) 创建一个涵盖所有子类和变体的通用抽象。\n\n让我们回想一下装饰器模式的抽象形式：\n\n```java\n/*\n// 装饰器实现：\n\
    // 此抽象形式具有：\n// - 任何通用过程的签名，\n// - 所有子类共有的算法和特性的\n*/\nabstract class DecorativeObject\
    \ {\n    // 输入 & 输出：（由你选择）\n    // (由子类实现)\n    public void procedure() {\n  \
    \  }\n    // (包含任何其他公共字段)\n}\n```\n\n这允许我们的数据类即使在运行时也可以发生变化。通过多态，我们可以交换数据类。但是，由于会有不同的字段，我们的抽象将使用：\n\
    \n```java\n/*\n// 装饰器实现：\n// 具有以下属性的角色：\n// - 单技能\n// - 生命 (int)\n// - 攻击 (int)\n\
    */\nabstract class Character {\n    // 输入：目标\n    // 输出：无\n    abstract void skill(Character\
    \ target);\n    int hp;\n    int atk;\n}\n```\n\n### 2) 创建默认子类。\n\n这将直接扩展你的通用抽象。再次回想一下装饰器模式中的默认子类：\n\
    \n```java\npublic class BaseObject : DecorativeObject {\n    // 通用过程，作为 Base Object\
    \ 实现\n    public void procedure() {\n        base.procedure();\n        // (在此处实现此过程)\n\
    \    }\n    // (根据意愿包含任何其他字段\n    // 和过程)\n}\n```\n\n当角色被新创建时，它将是我们默认类的实例。因此，它需要我们主抽象的扩展。\n\
    \n```java\nclass DefaultChar : Character {\n    // 通用过程，作为 Base Object 实现\n  \
    \  override public void skill(Character target) {\n        // 包含你想要的代码\n    }\n\
    }\n```\n\n### 装饰类\n\n装饰类将包含你想要应用到装饰对象的任何额外修改。这将使用类似于组合模式的结构。\n\n创建其中一个实例需要将上一个装饰器作为构造函数的输入（如果没有，则使用\
    \ `BaseObject`）。这样，你基本上可以在默认的 `BaseObject` 之上链式调用任意数量的装饰器。\n\n```java\npublic\
    \ class Decoration : DecorativeObject {\n    // 添加了之前应用的装饰器实例： \n    public DecorativeObject\
    \ prevDeco;        \n\n    // 通用过程，作为 Decoration 实现\n    // 包括此装饰器添加的任何额外效果\n\
    \    public void procedure() {\n        base.procedure();\n        // (在此处实现此过程，\n\
    \        // 也添加你想要的任何其他内容)\n        prevDeco.procedure();\n    }\n    // 构造函数：\n\
    \    public Decoration(DecorativeObject d) {\n        this.prevDeco = d;     \
    \ \n    }\n    // (根据意愿包含任何其他字段\n    // 和过程)\n}\n```\n\n注意 `procedure()` 方法是如何调用上一个装饰器方法的。这样，一旦调用了\
    \ `procedure()`，其实效果将由每一个添加的装饰器交付——加上来自 `BaseObject` 的效果。\n\n最后，你可以拥有任意数量的不同的装饰类。它们都扩展\
    \ `Decoration` 类，并可能包含自己的额外字段和过程。\n\n```java\nclass DecorationOne : Decoration\
    \ {\n    // 通用过程，作为 DecorationOne 实现\n    // (也作为父类实现 procedure())\n    public\
    \ void procedure() {\n        base.procedure();     \n        // (在此处实现此过程)\n\
    \    }\n    // (根据意愿包含任何其他字段\n    // 和过程)\n    // 构造函数：\n    public DecorationOne(DecorativeObject\
    \ d) : base(d) {\n        this.prevDeco = d;\n    }\n}\n```\n\n```java\nclass\
    \ DecorationX : Decoration {\n    // 通用过程，作为 DecorationX 实现\n    // (也作为父类实现 procedure())\n\
    \    public void procedure() {\n        base.procedure();\n        // (在此处实现此过程)\n\
    \    }\n    // (根据意愿包含任何其他字段\n    // 和过程)\n    // 构造函数：\n    public DecorationX(DecorativeObject\
    \ d) : base(d) {\n        this.prevDeco = d;\n    }\n}\n```\n\n"
- fmt: "\n```java\n// (include any other fields\n// and procedures as you wish)\n\n\
    // CONSTRUCTOR:  \npublic DefaultChar() {\n    this.hp = 12;    \n    this.atk\
    \ = 1;       \n}\n```\n\n### 3) Create the decoration subclass\nLike the default\
    \ subclass, this will also directly extend your general abstraction. This is the\
    \ part that gives the `Decorator Pattern` its gradual upgradability and progression.\n\
    \nFirst, let’s recall the default `Decoration` class from the `Decorator Pattern`\
    \ earlier:\n\n```java\npublic class Decoration : DecorativeObject{\n    // Previously\
    \ applied Decoration Instance added: \n    public DecorativeObject prevDeco; //\
    \ Common Procedure, implemented as Decoration\n    // Includes any extra effects\
    \ added by this Decoration\n    public void procedure() {\n        base.procedure();\n\
    \        // (Implement this procedure here,\n        // Add anything else you’d\
    \ like as well)\n        prevDeco.procedure();\n    }\n    // CONSTRUCTOR:\n \
    \   public Decoration(DecorativeObject d) {\n        this.prevDeco = d;      \n\
    \    } \n    // (include any other fields\n    // and procedures as you wish)\n\
    }\n```\n\nThe `Decoration` class is also an abstraction, which generalizes every\
    \ augmentation and decoration you’ll apply to your object. So let’s apply this\
    \ concept to our situation. We need to create a generalization for every augmentation\
    \ to our characters:\n\n```java\nclass Decoration : Character {\n    // Common\
    \ Procedure, implemented as Decoration\n    override public void skill(Character\
    \ target) {\n        // (Implementation done by Subclasses)\n        // include\
    \ any other code you want\n        prevDeco.skill(target);\n    }\n    // (include\
    \ any other fields\n    // and procedures as you wish)         \n}\n```\n\nThe\
    \ next few steps give key functionality to the `Decorator` class.\n\n### 4) Make\
    \ sure the decoration subclass contains the previous decoration or the default\
    \ class as one of its fields\nWithin your `Decoration` class, create a field that\
    \ uses the abstraction as the data type. It’ll also help if you give the field\
    \ a reasonable, relevant name. In our case, our abstraction is the abstract class\
    \ `Character`:\n\n```java\nclass Decoration : Character {\n    public Character\
    \ prevDeco; // (NEW LINE)\n    // Common Procedure, implemented as Decoration\n\
    \    override public void skill(Character target) {\n        // (Implementation\
    \ done by Subclasses)\n        // include any other code you want\n        prevDeco.skill(target);\n\
    \    }\n    // (include any other fields\n    // and procedures as you wish) \
    \ \n}\n```\n\nTo initialize this new field, it will be handled by the `Constructor`\
    \ for the `Decorator` class. This is done in the next step.\n\n### 5) Make sure\
    \ the constructor for the decoration subclass inputs a Decoration or the Base\
    \ Object\nSet this input as the previous decoration. The input for the custom\
    \ constructor will be the abstraction, just like the field created earlier. In\
    \ our case, the input will be an instance of the `Character` class (which allows\
    \ other decorations or the default class as inputs). Also, we’ll set the field\
    \ we’ve created from the previous step to the input. Overall, the `Decorator`\
    \ class should now look like:\n\n```java\nclass Decoration : Character {\n   \
    \ public Character prevDeco; // (NEW LINE)\n    // Common Procedure, implemented\
    \ as Decoration\n    override public void skill(Character target) {\n        //\
    \ (Implementation done by Subclasses)\n        // include any other code you want\n\
    \        prevDeco.skill(target);\n    }\n    // (include any other fields\n  \
    \  // and procedures as you wish)  \n    // (NEW LINES) : - - - - -  \n    //\
    \ CONSTRUCTOR:\n    public Decoration(Character c) {\n        this.prevDeco =\
    \ c;    \n    }\n    // - - - - - - - - - - - - -\n```\n\n### 6) Create the third-level\
    \ decoration subclasses\nNext is the fun part. These directly extend the `Decoration`\
    \ class you’ve developed in previous steps. We can start implementing the finer\
    \ details outlined by our abstraction. In MMORPG games, a great example of an\
    \ object that would ‘decorate’ characters are weapons. Hence, we can start creating\
    \ weapons and other equipment classes that are recursively attached to a base\
    \ character. We can also implement the `skill()` method to actually do something.\
    \ In our case, let’s have the `skill()` method attack a target. This `Greatsword`\
    \ class is an extension of the `Decoration` class we’ve developed earlier. It\
    \ has all the fields and methods of the `Decoration` Class, plus its own traits.\n\
    \n```java\nclass GreatSword : Decoration {\n    // Weapon damage\n    int damage\
    \ = 3;\n    // CONSTRUCTOR:\n    // (use super() to implement this as its supertype)\n\
    \    public GreatSword(Character c) : base(c){\n    }\n    // Common Procedure,\
    \ implemented as GreatSword\n    // (will be an Attack)\n    override public void\
    \ skill(Character target) {\n        // ATTACK TARGET:\n        target.hp -= damage;\
    \        \n        prevDeco.skill(target);\n    }\n}\n```\n\nWhy not have other\
    \ weapons too? Let’s also design a Fiery Battle Axe. Like the `GreatSword`, it\
    \ also has an attack as its `skill()` method.\n\n```java\nclass FieryBattleAxe\
    \ : Decoration {\n    // Weapon damage\n    int damage = 2;\n    int magicPower\
    \ = 2;\n    // CONSTRUCTOR:\n    // (use super() to implement this as its supertype)\n\
    \    public FieryBattleAxe(Character c) : base(c){\n    }\n    // Common Procedure,\
    \ implemented as FieryBattleAxe\n    // (will be an Attack)\n    override public\
    \ void skill(Character target) {\n        // ATTACK TARGET:\n        target.hp\
    \ -= damage + magicPower;        \n        prevDeco.skill(target);\n    }\n}\n\
    ```\n\nWhile we’re at it, we can also create a `Shield`:\n\n```java\nclass GoldenShield\
    \ : Decoration {\n    int armorBonus = 10;\n    // CONSTRUCTOR:\n    // (use super()\
    \ to implement this as its supertype)\n    public GoldenShield(Character c) :\
    \ base(c){\n    }\n    // Common Procedure, implemented as GoldenShield\n    override\
    \ public void skill(Character target) {\n        target.hp += armorBonus;    \
    \    \n        prevDeco.skill(target);\n    }\n}\n```\n\n## Usage\n\nNow that\
    \ we have our classes in place, here is how the code would look when run.\n\n\
    #### Creating a New Object\nTo create a new character, you’ll set its data type\
    \ as the abstract class but initialize it as the default class.\n\n```java\nCharacter\
    \ me = new DefaultChar();\n```\n\n#### Adding Decorations\nTo add decorations\
    \ to a new character, you’ll simply re-initialize that character as a `Decorator`\
    \ object with that same character as the input.\n\n```java\nme = new GoldenShield(me);\n\
    ```\n\nYou can even add more decorations simultaneously by creating a Decoration\
    \ within a Decoration:\n\n```java\nme = new GreatSword(new GoldenShield(me));\n\
    ```\n\n#### Using Common Procedures\nWhen you make function calls to common procedures,\
    \ ALL attached Decorators, as well as the Default object, will be called as well.\n\
    \nLet’s say the below line has just finished executing:\n\n```java\nme = new GreatSword(new\
    \ FieryBattleAxe(me));\n```\n\nIn the second line below, we call the function\
    \ `skill()`, targeting a character:\n\n```java\nCharacter you = new DefaultChar();\n\
    me.skill(you);\n```\n\nWhat exactly would function `skill()` do in this situation?\
    \ Well, let’s recall the code for `skill()` from one of the Decorator classes:\n\
    \n```java\noverride public void skill(Character target) {\n    // ATTACK TARGET:\n\
    \    target.hp -= damage;\n}\n```\n"
