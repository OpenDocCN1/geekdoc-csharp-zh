    Chapter 3: The Observer Pattern


    ==== ==== ==== ==== ====


    Let’s say you have to design two classes.


    One of those data classes is essentially a data report on the environment around
    you: the weather, time, date, location, etc.


    The other class creates a handful of objects that depend on data from the first
    class. For example, the latter class could make a list of all your friends nearby,
    display weather for the next 24 hours, remind you of certain dates or events,
    and more.


    Essentially, one object consistently needs updates from another object.


    In the simplest words possible, an object needs to ‘observe’ another object.


    This is when you use the Observer Pattern.


    How it essentially works:


    This happens to be one of the most referenced design patterns out there.


    You have two classes: an Observer and a Subject (it’s clear who’s observing who
    here.)


    However, since observing and being a subject are merely ‘behaviours’, we implement
    Observer and Subject Interfaces. This level of abstraction allows classes in your
    code to consistently apply Observer and Subject behaviours. So if you have any
    classes that need either role, you simply have those classes implement their respective
    interfaces.


    All classes that implement the Observer interface have a list of Subject objects
    to watch out for. These classes also need an update method, which is designed
    to update their data based on corresponding updates by subject objects.


    Likewise, all classes that implement the Subject interface have a list of Observer
    objects to notify. Also, those classes need notify method, which notifies its
    list of observers of any changes to its data.


    Overall, here is how the update procedure goes. When an observer makes a change
    to its data, it calls the method notify(), which tells its list of observers about
    those changes. Those observers then call update(), which makes updates to their
    own data based on the changes sent.


    Here is the UML diagram describing the Class/Interface relationships:


    ![](Image00005.jpg)


    There are two different things to think about when implementing the Observer pattern:
    the number of observers and the number of subjects. Thus, we will be implementing
    multi-observer and multi-subject scenarios to show you their dynamics.


