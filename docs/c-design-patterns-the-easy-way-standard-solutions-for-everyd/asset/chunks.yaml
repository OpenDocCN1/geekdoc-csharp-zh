    \n# C#-3b: 实现观察者模式\n\n使用你选择的 IDE 来运行以下代码。在线 IDE，如 [codechef.com](http://codechef.com)\
    \ , [rextester.com](http://rextester.com) , [ideone.com](http://ideone.com) 或\
    \ [codpad.org](http://codpad.org) 都是很好的选择。\n\n在本章中，我们将根据你在编码时可能会遇到的一个合适场景，逐步添加观察者模式（因为在现实中，你真的可能足够优秀，成为一名为政府情报服务的黑客）。\n\
    \n## 猎捕\n\n想象你自己是一个被 FBI 招募的黑客专家。有一个 FBI 试图抓住的恐怖组织。你可以通过某种方式轻易追踪恐怖分子，但问题是几十名探员立即需要那些追踪信息。因此，你需要修改他们的设备软件。\n\
    \n你的第一个行动是创建一个原型模块，当恐怖分子靠近时向设备发出警报。\n\n### 步骤 1：识别观察者和主题\n\n首先，谁或什么是主题？谁或什么是观察者？\n\
    \n没错。恐怖分子将是你需要关注的 `Subject`。因此，你需要用几行代码（一个类）来表示关于恐怖分子的信息。目前，你需要追踪他们的行踪——换句话说，就是他们的位置。\n\
    \n```java\n// 单一恐怖分子拥有：\n// - 一个位置，字符串类型\n// - 一个 Observer 对象列表\nclass Terrorist{\n\
    \    public String location;\n}\n```\n\nFBI 设备将是 `Observers`。到目前为止，我们为设备 OS 内部一个小模块提供了这些代码。该模块在关键通知时推送警报。\n\
    \n```java\n// 一个设备模块拥有：\n// - 一个警报状态（布尔值）\n// - 通知更新（字符串类型）\n// - 一个位置，字符串类型\n\
    // 它可以执行：\n// - 推送警报\n// - 更新警报和通知\nclass Module{\n    public String location;\n\
    \    public boolean alert;\n    public String notifications;\n    // 效果：如果 alert\
    \ 为 true，则打印警报  \n    void sendAlert(){\n        if (alert) {\n            Console.WriteLine(\"\
    ALERT: \" + notifications + \" Agents in \" + this.location);\n        }\n   \
    \ }\n}\n```\n\n### 步骤 2：设置观察者和主题的抽象\n\n在 C# 中，`Observer` 和 `Subject` 的抽象将是接口。因此，我们将对它们进行建模。\n\
    \n```java\n/*\n// 观察类实现 Observer\n// 它可以执行：\n// - 根据主题更新对象\n// 观察类可能需要一个 Subject\
    \ 列表来访问\n//（在 Observer 类中添加）\n*/\ninterface Observer {\n    void update();\n}\n\
    \n/*\n// Subject 类实现 Subject\n// 它可以执行：\n// - 通知观察者\n// - 在其更新列表中添加/删除观察者\n//\
    \ Subject 类还需要一个 Observer 列表来执行更新\n//（在 Subject 类中添加）\n*/\ninterface Subject {\n\
    \    void notifyObservers();\n    void addObs(Observer o);\n    void deleteObs(Observer\
    \ o);\n}\n```\n\n### 步骤 3：修改我们的 Subject 类以作为其中之一\n\n代表 `Terrorist` 的数据对象将作为 `Subject`。因此，它将实现\
    \ `Subject` 接口。然而，你还需要添加并实现 `Subject` 接口包含的方法。\n\n```java\n// 单一恐怖分子拥有：\n// -\
    \ 一个位置，字符串类型\n// - 一个 Observer 对象列表\n// 观察类实现 Subject 接口；\n// 同时也需要实现这些方法。\n//\
    \ 将此字段设为私有——为了防止黑客攻击。\nclass Terrorist : Subject {\n    public String location;\n\
    \    private List<Observer> obs = new List<Observer>();\n    \n    public void\
    \ notifyObservers() {};\n    public void addObs(Observer o) {};\n    public void\
    \ deleteObs(Observer o) {};\n}\n```\n\n对于 `notifyObservers` 方法，它应该遍历观察者列表并更新每一个一个。修改该方法来实现此操作。\n\
    \n```java\n// 来自 Subject 接口\npublic void notifyObservers() {\n    foreach (var\
    \ o in obs) {\n        o.update();\n    }\n}\n```\n\n接下来，我们实现 `addObs()` 和 `deleteObs()`\
    \ 方法。它们的作用是分别从列表中添加和删除 `Observer` 对象。\n\n```java\npublic void addObs(Observer\
    \ o) {\n    obs.Add(o);\n}\npublic void deleteObs(Observer o) {\n    obs.Remove(o);\n\
    }\n```\n\n在更改后，`Terrorist` 类看起来如下：\n\n```java\nclass Terrorist : Subject {\n \
    \   public String location;\n    private List<Observer> obs = new List<Observer>();\n\
