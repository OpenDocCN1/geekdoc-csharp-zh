    … there will be way too many champion teams.


    So what can we do to restrict the code produce only one champion team?


    Convert the Championship class into a Singleton.


    We do this by adding the components to a Singleton class one by one. Other than
    this, everything else about the Championship class remains unchanged.


    Component #1: A private Class Constructor


    Setting the Constructor to private ensures that objects of the class CANNOT be
    created - except from code within the class.


    For a singleton class, a private constructor (along with the other singleton components)
    ensure that the object will be a singleton.


    Below is the modified constructor for Championship, along with its explanatory
    comments. Add this code within the Championship class:


        // Singleton Component #1:


        // - Constructor with private modifier


        // (cannot be accessed from outside the Class)


        private Championship() {};


    Component #2: The single class object


    Your Singleton class will include an exclusive field, which will eventually be
    the only object constructed by your class.


    It will be a private field so it won’t be accessed outside the class.  It will
    also be one of the two singleton components that will be static - they can be
    accessed through the class itself, not its objects.


    By default, the field will be set to null. It will eventually be assigned once
    the third component is called.


    Below is the field for the class object. Add the code below inside the Championship
    class:


        // Singleton Component #2:


        // - a class object as a field


        // - has Static Modifier (can access field from the class itself)


        // - has private Modifier (cannot be accessed from outside the Class)


        private static Championship c = null;


    Component #3: The getObject() method


    The final singleton component for the Championship class will be the getObject()
    method. As one of the two static components, this method is meant to be accessed
    from the Championship class, not one of its objects.


    What it does is retrieve the only Championship object created in your code. If
    it’s not created yet, it will call Component #1 (the Custom Constructor) to create
    one.


    Below is the method. Just add the code  within the Championship class:


    // Singleton Component #3


        // - a getObject() method 


        // INPUT: none


        // OUTPUT: a Championship object


        // EFFECT: returns the Singleton Championship object


        public static Championship getChamp() {


            if (c == null) {


                c = new Championship();


            }


            return c;


        }


    The Singleton Championship Class


    Overall, the Singleton version of the Championship class should remain the same,
    except that you’ve added the three singleton components into it.


    The Main Code, Now with the Singleton Championship


    Now, we’ll run this code within the main() method:


            // Create 8 Teams:


            Team contender1 = new Team("Archers");


            Team contender2 = new Team("Bobcats");


            Team contender3 = new Team("Centurions");


            Team contender4 = new Team("Danger Zone");


            Team contender5 = new Team("Energy");


            Team contender6 = new Team("Flames");


            Team contender7 = new Team("Guards");


            Team contender8 = new Team("Hunters" );


    // Using Singleton: 


            Championship.getChamp().playoffs(contender1,


                       contender2,


                       contender3,


                       contender4,


                       contender5,


                       contender6,


                       contender7,


                       contender8);


    If you run all the code, you should still see something similar to below (team
    names could still be mixed around):


    Hunters Defeats Archers


    Guards Defeats Bobcats


    Flames Defeats Centurions


    Danger Zone Defeats Energy


    Danger Zone Defeats Hunters


    Guards Defeats Flames


    Danger Zone Defeats Guards


    Team Danger Zone WIN THE CHAMPIONSHIP!


    The main difference with the converted Singleton version is that there is now
    absolutely only one Championship team for every time the entire code is run. Making
    multiple calls to playoffs() won’t run multiple playoff runs; it can only be run
    the first time around. Also, there can only be one championship object per code
    run. Therefore there can only be up to one playoff run and one champion team when
    the code is run.


    You can see the benefits to this. For example, if you were writing code for competitive
    sport, you can create such restrictions on your code to make it more difficult
    for hackers to misuse your program. 


