    \ 的子类：\n每个具有：\n-用字段的不同值\n- 任何地方的额外字段\n每个通用方法包含：\n- 父类的所有特征\n- 任何额外效果\n`StateOne`,\
    \ `StateTwo`, `StateN` 是 `AbstractState` 的子类\n\n# 存档 A8：外观模式实现\n\n使用下面的伪代码在你选择的编程语言中实现外观模式。\n\
    \n`子系统`：\n子系统包含：\n- 一组互相互连接的类（组件）\n- 类层次结构和包含关系可能有所不同\n\n`作为包装类的 FACADE`：\n`Facade`\
    \ 类具有：\n- 子系统中任一主要类的实例\n包含的方法：\n利用子系统的所有主要过程\n\n`客户端类`：\n`Client` 类具有：\n- `Facade`\
    \ 类的实例\n\n`作为接口的 FACADE`：\n`Facade` 接口具有：\n- 利用子系统的所有主要过程\n\n`实现 FACADE 的客户端`：\n\
    `Client` 类具有：\n- 子系统中任一主要类的实例\n包含的方法：\n- 与 `Facade` 接口相同，但完全实现\n\n## 学习 C# 的简单方法，第一部分\n\
    \n我们包含了一份学习基础知识的补充指南，帮助你成为一名更好的程序员。为了让你更轻松地理解，我们将它设置得尽可能简单。为了方便运行代码，请选择你喜的 IDE（集成开发环境：你编写和运行代码的地方）。你也可以使用在线\
    \ IDE，例如 `rextester.com`、`ideone.com` 或 `codpad.org`。\n\n### 序言：C# 文件的结构\n\n下面是\
    \ C# 代码文件的主要组件。如果你要开始一个全新的 C# 项目，最好是复制下面的代码并从那里开始。\n\n```csharp\nusing System;\
    \ // A\nusing System.Collections.Generic;\nusing System.Linq;\nusing System.Text.RegularExpressions;\
    \ // 添加更多库\n\nnamespace ___ {\n    // 在此处添加类\n    public class Program { // B)\n\
    \        public static void Main(string[] args) { // C\n            // 在此处添加主程序代码\
    \ // D\n        }\n    } // E\n}\n```\n\n### 解释各个部分：\n\n**A) 导入语句**：这些代码行指示计算机包含库——现有数据、预写代码以及其他地方创建的工具。你也可以从\
    \ C# 文件导入代码。这些最好放在文件的开头。\n**注意**：至少，你需要在 C# 文件中拥有上述四行代码。这些是为了你的代码引入最核心的 C# 库。\n\
    \n**B) 主类**：你的代码文件至少有一个 `Class`。你所有的类中至少一个需要包含 `main()` 方法（见下文）。\n\n**C) `main()`\
    \ 方法**：这被称为入口。计算机将执行 `main()` 方法中的所有代码。在你的 C# 项目的所有类中，你至少需要一个名为 `main()` 的类方法。目前，确保你的\
    \ `main()` 方法具有上方完全相同的行。\n\n**D) `main()` 方法代码**：这是计算机实际执行的代码。\n\n**E) 空格**：在\
    \ C# 文件中，你只能包含导入语句、类、接口或枚举。\n\n#### 1) 数据类型。\n\n**布尔值**：\n这些本质上是开关值。在代码中，布尔值将是\
    \ `true` 或 `false`。\n\n在 C# 中，布尔值只能是小写（即 `true`, `false`）。布尔值不能包含任何大写字母（例如 `TRUE`、`True`）。\n\
    \n示例：\n`true`, `false`\n\n**字符串**：\n\n"
- fmt: "\nThese are sets of keyboard characters - including letters, numbers, and\
    \ other symbols - arranged in some order to make a text phrase. They start and\
    \ end with double quotation marks.\n\nExamples:\n\n\" This is a String. \"\n\n\
    \" This 15 4 &^%$! 5tring t00\\. \"\n\n### Integers\nThey’re exactly as they’re\
    \ defined - whole numbers without any fractions or decimals. Here are some examples:\n\
    \n`12`\n\n`143`\n\n`19999932`\n\n### Floats\nalso called floating-point numbers,\
    \ they represent the opposite of `Integers` - they are numbers beyond the decimal\
    \ point.\n\nIn C#, `floats` have the letter ‘f’ immediately following the number.\n\
    \nExample:\n\n`0.12f`\n\n`.12f`\n\nIn C#, you can also represent decimal numbers\
    \ as the type `Double`. They won’t have the letter ‘f’ in them.\n\nExample:\n\n\
    `0.12`\n\n`.12`\n\n## 2) Variables\n\nRemember in grade school math where you\
    \ used letters such as `X` and `Y` to represent numbers? Textbooks had phrases\
    \ such as `let x = 4` and `let y = 19`. These were called variables.\n\nVariables\
    \ prevalently exist in programming too. But in programming, you can give your\
    \ variables a name. And instead of numbers, variables can be whatever data you\
    \ assign them as. They can be `strings`, `booleans`, `integers`, and more.\n\n\
    Think of variables as one-sentence statements in the form of `(name) is a ____`\
    \ . Use variables to tell the computer certain facts about your code. The concept\
    \ is just as simple as telling me that a fire hydrant is red or the sky is blue.\n\
    \nIn C#, you can create variables in the following syntax:\n\n`(Data Type) (Variable\
    \ Name) = (Initial Value) ;`\n\nExamples:\n\n```csharp\nString a = \"This is a\
    \ String.\";\nint b = 122;\nbool c = true;\nfloat d = 0.1234f;\ndouble e = 0.1234;\n\
    ```\n\nKeep in mind that the data types in C# have to be written in a particular\
    \ way. The next few lines explain how.\n\n- Strings: `String`\n- Integers: `int`\n\
    - Booleans: `boolean`\n- Decimal Numbers as Floats: `float`\n- Decimal Numbers\
    \ as Double: `double`\n\nNOTE: you need to declare data types in the EXACT wording\
    \ as above - same spelling and cases.\n\n## 3) Composite Data\n\nThis concept\
    \ means that a set of individual, lesser data are comprised together to form a\
    \ whole, singular chunk of data. Put in the simplest way possible, if `Variables`\
    \ are sentences, `Composite Data` are entire paragraphs that can be made of sentences.\n\
    \nThe most commonly used composite data concept today are `classes`. A `class`\
    \ can be composed of any amount of variables and functions (we’ll cover functions\
    \ later).\n\nIn C#, you can create classes in the following syntax:\n\n```csharp\n\
    class (Class Name) {\n    // some code\n}\n```\n\nExample:\n\n```csharp\nclass\
    \ House {\n    // insert code here\n}\n```\n\n## 4a) Making Functions\n\nIf `Variables`\
    \ are sentences, `Functions` are merely actions or verbs.\n\nIn essence, functions\
    \ are outlined set of instructions. They are carried out by the computer once\
    \ a line of code calls their names. For example, if a line of code told a computer\
    \ to walk, the computer would follow the instructions to walk (i.e. one step forward,\
    \ lean forward, step with other foot, etc.)\n\nTo create a function in C#, follow\
    \ this syntax:\n\n```csharp\n(data type returned) <Function Name>(<data type1>\
    \ input1, .. <any add’l inputs>) {\n    // write code here\n    // use this next\
    \ line if the function outputs any data:\n    // return (variable name with data\
    \ type, or any data)\n}\n```\n\nHere are some example functions in C#:\n\n```csharp\n\
    // Note how the function’s return data type is a String\n// AND there’s a line\
    \ that returns an actual String\nString functionA(String in1, int in2) {\n   \
    \ return \"OKAY\";\n}\n\n// Note how the function’s return data type is void\n\
    // AND the ‘return’ line doesn’t return any data at all\nvoid functionB(boolean\
    \ in1, float in2 ) {\n    return;\n}\n```\n\nNext, a function will either output\
    \ some data or it won’t.\n\nFor now, it is HIGHLY recommended for you to use comments\
    \ stating whether or not the function outputs anything. When you use the function,\
    \ you can only call the function wherever its data output is expected.\n\nExamples:\n\
    \n```csharp\n// returns an Integer, has no inputs:\nint functionXYZ() {\n    //write\
    \ code here\n    return 12;\n}\n\n// doesn't return data, has 3 inputs:\nvoid\
    \ functionABC(int a, int b, int c) {\n    //write code here\n}\n```\n\n## 4b)\
    \ Using Functions\n\nTo call a function, you just write its name, along with any\
    \ inputs (if it needs them)\n\nIf the function doesn’t output data (or if it outputs\
    \ void), follow this syntax - and make sure it’s in its own line:\n\n`<Function\
    \ Name>( input1, input2, …, inputN);`\n\nIf the function outputs some data, the\
    \ syntax is similar as above. However, make sure the function is in a place where\
    \ the output data type is expected:\n\n`<data type> (variable name) = <Function\
    \ Name>( input1, input2, …, inputN);`\n\nIn other words, the function’s output\
    \ data has to be in a place that ‘makes sense’. For example, if a variable expects\
    \ an integer, the function needs to output an integer.\n\nExamples:\n\n```csharp\n\
    // No Output:\nfunctionABC(2, 4, 5);\n\n// Outputs an Integer:\nint varInteger\
    \ = functionABC(2, 4, 5);\n```\n\n# EASIEST WAY TO LEARN C#, Part 2\n\nTo easily\
    \ run code, select an IDE (Integrated Development Environment: essentially somewhere\
    \ that you write and run code) of your choice. You may also use online IDE’s such\
    \ as [rextester.com](http://rextester.com) , [ideone.com](http://ideone.com)\n\
    \n## 5a: Arrays in C#: Static Array\n\nArrays are a sequenced list of certain\
    \ type. Those can be simple or compound.\n\nTo declare an array, follow this syntax:\n\
    \n`<data type>[] (name)`\n\nTo initialize it, simply do:\n\n`<data type>[] (name)\
    \ = <items>`\n\nExample:\n\n```csharp\nint[] aa = {1,2,3,4,5};\n```\n\nYou can\
    \ also access individual items based on position. `0` is the first item; the array\
    \ size minus one is the last.\n\nExample:\n\n```csharp\naa[0]\naa[9]\n```\n\n\
    ## 5b: The List Class from C#\n\nThe C# Language includes an `List` class that\
    \ helps programmers create flexible arrays.\n\nTo use an `List`, it’s as if you\
    \ were declaring a new variable with the data type:\n\n`List<data type> (name)`\n\
    \nTo initialize the variable, you’ll be using the constructor (NOTE: we’ll go\
    \ over constructors. For now, just create Lists as shown):\n\n`List<data type>\
    \ (name) = new List<data object type>();`\n\nExample:\n\n```csharp\nList<String>\
    \ aa = new List<String>();\n```\n\nOverall, you’ll have two approaches to creating\
    \ arrays. Lists are better suited for Objects (see Object-Oriented Programming\
    \ in the next chapters).\n\n## 5c: Iteration, procedure 1\n\nTo process each item\
    \ in an List, use these lines:\n\n```csharp\nforeach (var <X> in <Y>) {\n    //\
    \ Do something with each List item in <Y>\n    // Using <X>\n}\n```\n\n`<X>` will\
    \ be the data object type the List is holding. `<Y>` is the actual List that the\
    \ iteration will go over.\n\nExample:\n\n```csharp\nList<String> aaa = new List<String>();\n\
    aaa.add(\"Arthur\");\naaa.add(\"Ben\");\naaa.add(\"Charles\");\n\nforeach (var\
    \ xx in aaa) {\n    xx = xx.concat(\" is happy\");\n    Console.WriteLine(xx);\n\
    }\n```\n\nThe above will print out the text below:\n\nArthur is happy\n\nBen is\
    \ happy\n\nCharles is happy\n\n## 5d: Iteration, procedure 2\n"
  raw: 'These are sets of keyboard characters - including letters, numbers, and other
    symbols - arranged in some order to make a text phrase. They start and end with
    double quotation marks.


    Examples:


    " This is a String. "


    " This 15 4 &^%$! 5tring t00\. "


    Integers:


    They’re exactly as they’re defined - whole numbers without any fractions or decimals.
    Here are some examples:


    12


    143


    19999932


    Floats: also called floating-point numbers, they represent the opposite of Integers
    - they are numbers beyond the decimal point.


    In C#, floats have the letter ‘f’ immediately following the number.


    Example:


    0.12f


    .12f


    In C#, you can also represent decimal numbers as the type Double. They won’t have
    the letter ‘f’ in them.


    Example:


    0.12


    .12


    2) Variables


    Remember in grade school math where you used letters such as X and Y to represent
    numbers? Textbooks had phrases such as ‘let x = 4’ and ‘let y = 19’. These were
    called variables.


    Variables prevalently exist in programming too. But in programming, you can give
    your variables a name. And instead of numbers, variables can be whatever data
    you assign them as. They can be strings, booleans, integers, and more.


    Think of variables as one-sentence statements in the form of “(name) is a ____”
    . Use variables to tell the computer certain facts about your code. The concept
    is just as simple as telling me that a fire hydrant is red or the sky is blue.


    In C#, you can create variables in the following syntax:


    (Data Type) (Variable Name) = (Initial Value) ;


    Examples:


            String a = "This is a String.";


            int b = 122;


            bool c = true;


            float d = 0.1234f;


            double e = 0.1234;


    Keep in mind that the data types in C# have to be written in a particular way.
    The next few lines explain how.


    Strings:               String


    Integers:               int


    Booleans:               boolean


    Decimal Numbers as Floats:               float


    Decimal Numbers as Double :               double


    NOTE: you need to declare data types in the EXACT wording as above - same spelling
    and cases.


    3) Composite Data


    This concept means that a set of individual, lesser data are comprised together
    to form a whole, singular chunk of data. Put in the simplest way possible, if
    Variables are sentences, Composite Data are entire paragraphs that can be made
    of sentences.


    The most commonly used composite data concept today are classes. A class can be
    composed of any amount of variables and functions (we’ll cover functions later).


    In C#, you can create classes in the following syntax:


    class (Class Name) {


                  // some code


    }


    Example:


    class House {


                  // insert code here


    }


    4a) Making Functions


    If Variables are sentences, Functions are merely actions or verbs.


    In essence, functions are outlined set of instructions. They are carried out by
    the computer once a line of code calls their names. For example, if a line of
    code told a computer to walk, the computer would follow the instructions to walk
    (i.e. one step forward, lean forward, step with other foot, etc.)


    To create a function in C#, follow this syntax:


    (data type returned) <Function Name>(<data type1> input1, .. <any add’l inputs>) 
    {


    // write code here


    // use this next line if the function outputs any data:


    // return (variable name with data type, or any data)


    }


    Here are some example functions in C#:


    // Note how the function’s return data type is a String


    // AND there’s a line that returns an actual String


           String functionA(String in1, int in2) {


                return "OKAY";


                }


    // Note how the function’s return data type is void


    // AND the ‘return’ line doesn’t return any data at all


    void functionB(boolean in1, float in2 ) {


                return;


                }


    Next, a function will either output some data or it won’t.


    For now, it is HIGHLY recommended for you to use comments stating whether or not
    the function outputs anything. When you use the function, you can only call the
    function wherever its data output is expected.


    Examples:


    // returns an Integer, has no inputs:


    int functionXYZ() {


                  //write code here


                  return 12;


    }


    // doesn''t return data, has 3 inputs:


    void functionABC(int a, int b, int c) {


                  //write code here


    }


    4b) Using Functions


    To call a function, you just write its name, along with any inputs (if it needs
    them)


    If the function doesn’t output data (or if it outputs void), follow this syntax
    - and make sure it’s in its own line:


    <Function Name>( input1, input2, …, inputN);


    If the function outputs some data, the syntax is similar as above. However, make
    sure the function is in a place where the output data type is expected:


    <data type> (variable name)  = <Function Name>( input1, input2, …, inputN);


    In other words, the function’s output data has to be in a place that ‘makes sense’.
    For example, if a variable expects an integer, the function needs to output an
    integer.


    Examples:


    // No Output:


    functionABC(2, 4, 5);


    // Outputs an Integer:


    int varInteger = functionABC(2, 4, 5);


    EASIEST WAY TO LEARN C#, Part 2


    To easily run code, select an IDE (Integrated Development Environment: essentially
    somewhere that you write and run code) of your choice. You may also use online
    IDE’s such as [rextester.com](http://rextester.com) , [ideone.com](http://ideone.com)
    ,  or [codepad.org](http://codepad.org) .


    ========================= ======


    Part 5a: Arrays in C#: Traditional Static Array


    Arrays are a sequenced list of a certain data type. Those data types can be simple
    or compound data. If you need to store lists of data, use Arrays.


    To declare an array, follow this syntax:


    <data type>[] (variable name);


    To initialize it as well, simply do this:


    <data type>[] (variable name) = new <same data type>[ <# of array items> ];


    Example:


    int[] aa = new int[5];


    You can even initialize every single item within the array data


    <data type>[] (variable name) = {<item 1>, <item 2>, … , <item N>, };


    Example:


    int[] aa = {1,2,3,4,5};


    You can also access individual items based on that item’s position within the
    array. 0 is the first item; the array size minus one is the last item. 


    (In programming, the very 1st number is often 0\. Remember this!)


    For example, you would get the first item of an array like so:


    aa[0]


    And you would get the last item of an array like so:


    // an Array with room for 10 items:


    aa[9]


    Just remember: you can only place the code above somewhere where its data type
    is expected:


    int[] zzz = {1,2,3};


    int x = zzz[0];


    Part 5b: The List Class from the C# Library


    The C# Language includes an List class that helps programmers create flexible
    arrays. 


    To use an List, it’s as if you were declaring a new variable with the List data
    type:


    List<data object type> (variable name);


    To initialize the variable, you’ll be using the constructor.


    (NOTE: we’ll go over constructors later. For now, just create Lists as shown below)


    List<data object type> (variable name) = new List<same data object type>();


    Example:


    List<String> aa = new List<String>();


    Overall, you’ll have two approaches to creating arrays. Lists are generally better
    suited for Objects (see Object-Oriented Programming in the next few chapters)


    Part 5c: Iteration, procedure 1


    To process each item in an List, use these lines:


            foreach(var <X> in <Y>) {


               // Do something with each List item in <Y>


                  // Using <X>


            }


    <X> will be the data object type the List is holding. <Y> is the actual List that
    the iteration will go over.


    Example:


            List<String> aaa = new List<String>();


            aaa.add("Arthur");


            aaa.add("Ben");


            aaa.add("Charles");


            foreach (var xx in aaa) {           


                xx = xx.concat(" is happy");       


                Console.WriteLine(xx);


            }


    The above will print out the text below:


    Arthur is happy


    Ben is happy


    Charles is happy


    Part 5d: Iteration, procedure 2'
