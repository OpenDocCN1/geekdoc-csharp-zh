    Chapter 5: The Strategy Pattern


    ==== ==== ==== ==== ====


    Picture this scenario.


    You have three choices for commuting to work everyday: by bike, by public transit,
    or by driving your car.


    However, there are quite a handful of factors that affect your choice. This includes
    the weather outside, whether or not you want to work out, how long are you willing
    to commute, level of vehicle traffic, any construction, car crashes, and more.


    How will you know which choice to pick? And even after choosing your commute method,
    how will your route to and from work be affected?


    Now picture an algorithm to your solution to the above. It would probably involve
    a system of if-statements before picking your commute choice.


    The next day, some or all of the factors could be different and you’d have to
    figure out how you’d like to commute to work and back. You’d run your algorithm
    again. And again for the day after. And so on.


    This looks like a seemingly complex algorithm to figure out. Fortunately, this
    is a situation which requires a choice of algorithm variants.


    This is a scenario fit for the Strategy Pattern.


    How it essentially works:


    the Strategy Pattern takes advantage of class polymorphism in Object-Oriented
    Programming. In other words, you can embed the algorithm variants within a set
    of common classes that can interchange depending on the situation.


    The algorithms are accessed through the abstraction, which can either be abstract
    classes, interfaces, or anything else your programming language allows.


    The abstraction object can be any of the subclasses that extend it. Hence, the
    algorithm variants can be switched around depending on the situation.


    Applying the Strategy Pattern:


    Here is the step-by-step plan for implementing this design pattern:


    1) Figure out when will your process have to change depending on the situation.


    2) Create the abstract form of your strategy algorithm.


    3) Implement the variants for your strategy algorithm in subclasses.


    4) Anything that access your strategy algorithm does it through the abstract form.
    Through Polymorphishm, the best strategy variant is selected and executed depending
    on the situation.


    Overall, here is the UML diagram describing the Strategy Pattern:


    ![](Image00007.jpg)


