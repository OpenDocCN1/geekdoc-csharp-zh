  trans: "\n在这个系统中，我们需要协调所有的组件。\n\n因此，以下是在 C# 中实现 `Facade Pattern`（外观面模式）的方式。如果将 `Facade`\
    \ 实现为接口，它看起来像这样：\n\n```csharp\n/*\n// 接口形式的 Facade\n// (包含所有利用\n// 环境内组件的主要过程)\n\
    */\ninterface Facade{\n    // 主要过程：\n    // 输入与输出：(自定)\n    // 效果：(自定)\n    //\
    \           - 调用所有系统组件的方法\n    void activateA();\n    void activateB();\n}\n```\n\
    \n```csharp\n/*\n// 客户端类\n// (实现 Facade 接口中定义的所有过程)\n*/\nclass Client : Facade\
    \ {\n    ComponentOne c1 = new ComponentOne();\n    ComponentTwo c2 = new ComponentTwo();\n\
    \    ComponentN cN = new ComponentN();\n\n    // 来自 Facade 接口的方法:\n    void Facade.activateA()\
    \ {\n        c1.distinctMethodOne();\n    }\n    void Facade.activateB() {\n \
    \       c2.distinctMethodTwo();\n        cN.distinctMethodN();\n    }\n}\n```\n\
    \n在这种情况下，`Client` 类将实现该接口：\n\n```csharp\n// 客户端子类：\n// (根据需要随时添加)\nclass ClientA\
    \ : Client {\n}\nclass ClientB : Client {\n}\n```\n\n如果将 `Facade` 实现为一个大型超类，它看起来会像这样：\n\
    \n```csharp\n/*\n// 作为主要类的 Facade\n// - 包含环境中每个组件的实例\n// - 包含所有利用\n// 环境内组件的主要过程\n\
    */\nclass Facade{\n    ComponentOne c1 = new ComponentOne();\n    ComponentTwo\
    \ c2 = new ComponentTwo();\n    …\n    ComponentN cN = new ComponentN(); \n\n\
    \    // 主要过程：\n    // 输入与输出：(自定)\n    // 效果：(自定)\n    public void activateA()\
    \ {\n        c1.distinctMethodOne();\n    }\n    public void activateB() {\n \
    \       c2.distinctMethodTwo();\n        cN.distinctMethodN();\n    }\n}\n```\n\
    \n在这种情况下，`Client` 类将拥有 `Facade` 类的实例：\n\n```csharp\n// 客户端类：\n// (软件的其他访问部分)\n\
    class Client {\n    Facade f = new Facade();\n}\n\n// 客户端子类：\n// (根据需要随时添加)\n\
    class ClientA extends Client{}\nclass ClientB extends Client{}\n```\n\n# C#-8b:\
    \ 应用外观面模式\n\n使用你选择的 IDE 运行以下代码。在线 IDE，如 [codechef.com](http://codechef.com)、[rextester.com](http://rextester.com)、[ideone.com](http://ideone.com)\
    \ 或 [codpad.org](http://codpad.org) 都是很好的选择。\n\n在本章中，我们将遇到一个需要实现 `Facade pattern`\
    \ 的场景。\n\n## 带有曲速驱动器的星际飞船\n\n在这里，我们有一段来自 `Galactic Starship`（星际飞船）系统的少量代码。每个类部分管理相应的飞船硬件组件。\n\
    \n```csharp\n/*\n// 星际飞船 GSX2013-A4\n// 列出的组件：\n// - 正电子引擎\n// - 点火晶体\n// - 暗物质驱动器\n\
    // - 能量预点火器\n// - 物质融合反应堆\n// - 曲速驱动器\n// - 星际导航\n// - 坐标\n// - 曲速点火器\n*/\nclass\
    \ PositronEngine {\n    IgnitionCrystal igc = new IgnitionCrystal();\n    DarkMatterDrive\
    \ dmd = new DarkMatterDrive();\n    public void startEngine() {\n        igc.lightUp();\n\
