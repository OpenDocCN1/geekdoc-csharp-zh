    The Decorator Pattern in a Nutshell


    Borrowing a few elements from other Design Patterns, the Decorator pattern is,
    indeed, one of the more complex patterns to implement.


    Just understand its premise; it provides a way to dynamically enhance and augment
    objects during runtime. Because it’s one of the more essential design patterns
    to gaming and any other situations which require evolving data objects, implementing
    this pattern in a sound manner will be a great addition to your repertoire.


    Chapter 7: The State Pattern


    ==== ==== ==== ==== ====


    When creating data classes, all fields, methods, and other traits have distinct
    sets of values. Those values can be initialized when creating data objects. They
    can also be changed whenever necessary.


    But whenever there’s a scenario in which a data object needs to change nearly
    all of its traits, we encounter a problem. There may be too many traits to change 
    one-by-one and there may be one too many errors that could emerge.


    Therefore, the better way to approach this situation is to use class abstractions
    and polymorphism to simultaneously change the data object’s many traits.  If the
    data object consistently changes during runtime, then this approach becomes more
    appealing.


    Essentially, this is the State Pattern in action - a data object that can change
    its traits during runtime, depending on external factors or anything else that
    requires a particular behaviour.


    How it essentially works:


    The data object will include one instance of an interchangeable state. There can
    be as many different interchangeable states as necessary.


    If you change the state, you’ll change the traits and behaviours of the data object.
    You’ll usually do this to accommodate whatever situation your data class is in.


    How the State Pattern differs from the Strategy Pattern:


    Both the State and Strategy patterns implement design variants suitable for different
    scenarios. However, the main difference between them is the situational context.


    The Strategy pattern offers different ways to process an algorithm. Its algorithm
    variants only apply once the procedure is called.


    On the other hand, State pattern objects exist continuously during runtime. A
    change in the environment at any time can prompt a State pattern object to adapt.


    Creating the State Pattern:


    To implement this design pattern, follow these steps:


    1) Identify which class will be the ‘handler’ class. A key part of the functionality
    from this class will depend on its current state.


    2) Create the State abstraction. Define all common fields and procedures here.


    3) Create all the different State Subclasses. Implement where necessary


    4) Make the Handler include an instance of its current state. Its data type should
    be the Abstract Class. When initialized with a constructor, the Handler should
    have a default state.


    5) Develop the state-changing methods within the Handler class. There should be
    a toggling method and a set method.


    6) Apply all other code that utilizes the various States the Handler depends on.


    Overall, here is the UML Diagram for the State Pattern:


    ![](Image00009.jpg)


    The State pattern is perhaps one of the more frequently used design patterns in
    existence. If implemented properly, the State pattern will give your data objects
    a keen sense of adaptability.


    Now we’ll explore the code that the State pattern consists of.


    C#-7a: The State Pattern, in C#


    ==== ==== ==== ==== ====


    Here is how the State Pattern looks like in C#


    First, we start with the Handler Class. This contains a property which can be
    transformed into distinct states - a scenario suitable for the State Pattern.


    /*


    // The Handler Class has:


    // - an instance of a transforming state class


    // Insert any other fields or methods as you wish


    */


    class Handler {


        AbstractState currentState;


                  /*


            // SIMPLE IMPLEMENTATION:


            // (Toggle currentState into the Next State


            //    via IF-ELSE statements)


            // - make sure to cover all states available


            // - re-implement if necessary       


                  */  


    void toggleState() {


            if (currentState is StateOne) {


                currentState = new StateTwo();


            }


            if (currentState is StateTwo) {


                currentState = new StateN();


            }


            if (currentState is StateN) {


                currentState = new StateOne();


            }


        }


        void setState(AbstractState input) {


            this.currentState = input;       


        }


        // CONSTRUCTOR:


        public Handler() {


            this.currentState = new StateOne();


        }


    }


    Next is the State Abstraction. This will be a superclass common to the different
    states that your handler contains.


    class AbstractState {


        String commonField;


        // IN & OUT: (your choice)


        // EFFECT: (your choice)


        public void commonProcedure() {    


             // (add any implementation here)  


        }


        // (add any other fields and methods


        // as you wish)   


    }


    And lastly, we implement the state subclasses. They are implemented uniquely;
    their common fields are distinct and their common procedures can be implemented
    in their own unique ways.


    For our generalized version, we’ll have three different states. When applying
    the State pattern in your code, you may have as many states as you need.


    class StateOne : AbstractState {


        String commonField = "ONE";


        // Subclass implementation of


        // commonProcedure()


        // (contains all traits of superclass version,


        // plus any extra effects by subclasses)


        public void commonProcedure(){


            base.commonProcedure();       


            // (add any extra implementation here)


        }


    }


    class StateTwo : AbstractState {


        String commonField = "TWO";       


        public void commonProcedure(){


            base.commonProcedure();       


            // (add any extra implementation here)


        }   


    }


    class StateN : AbstractState {


        String commonField = "N";   


        public void commonProcedure(){


            base.commonProcedure();


            // (add any extra implementation here)


        }   


    }


