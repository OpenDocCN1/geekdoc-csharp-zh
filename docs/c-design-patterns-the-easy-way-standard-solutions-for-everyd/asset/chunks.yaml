    Chapter 6: The Decorator Pattern


    ==== ==== ==== ==== ====


    When designing classes, all fields and methods seem as if they have to be as-is.
    In other words, when you create instances of your classes, they would ALL have
    the same fields and methods as defined by their class.


    But what if there is a way to add more features to data objects DURING runtime?
    Say, a data object acquires more features over time?


    It’s possible.


    And it’s made possible thanks to the Decorator Pattern.


    How it essentially works:


    The Decorator Pattern has a similar structure to the Composite Pattern; two classes
    sharing the same abstraction, while one of them contains an instance of this abstraction.
    Due to polymorphism, this abstraction can be either one of the two classes.


    There are two main generalized classes to develop: the Default Superclass and
    the Decorator Superclass.


    The Decorator class will have an instance of either the Base Class or previously
    applied Decorator classes. This is in addition to any other fields or methods
    a Decorator class may add.


    For any method common to all classes, the Decorator class will also call the previous
    object’s method, which will call its previous object’s method, and so on, until
    the Default Class object’s method is called too. This creates a recursive pattern
    in which every Decorator, as well as the one Default Class, applies its effect.


    This is how it looks like altogether; a single object from the Default class will
    apply its behaviours differently compared to an object with multiple Decorators
    attached to it.


    Hence, a data object during runtime may have much more different behaviours than
    originally intended.


    This pattern is commonly used in video dame development and any other apps which
    require a high amount of modularity.


    Creating the Decorator Pattern:


    Here is the step-by-step plan for implementing this design pattern:


    1) Create a general abstraction that covers ALL subclasses and variants.


    2) Create the default subclass. This will directly extend your general abstraction
    from earlier.


    3) Create the decoration subclass. Like the default subclass, this will also directly
    extend your general abstraction.


    4) Make sure the decoration subclass contains the previous decoration or the 
    default class as one of its fields (set the variable type as the general abstraction!).
    This, along with the next step, are the key traits that allow multiple decorations
    to be dynamically added to the default class.


    5) Make sure the constructor for the decoration subclass inputs either a Decoration
    or the Base Object (again, set the input type as the general abstraction!) and
    this input is set as the previous decoration.


    6) Create the third-level decoration subclasses. These directly extend the Decoration
    class you’ve developed in previous steps.


    Applying the Decorator Pattern at Runtime:


    1) When creating an instance of the Decorator Pattern, set its data type as the
    abstraction but initialize it as the default subclass:


    abstractclass default = new defaultsubclass();


    2) When adding a Decoration to a default subclass object, use the previous Decoration
    or default object as an input. If you designed the pattern correctly, all the
    decorations should connect to the the default class like a linked list.


    DecoratorOne a = new Decorator(default)


    DecoratorTwo b = new Decorator(a)


    DecoratorTwo c = new Decorator(b)


    Here is the UML Diagram for the Decorator Pattern:


    ![](Image00008.jpg)


    This is perhaps one of the more complex design patterns available. But once mastered,
    this becomes one of the most useful ones in your programming repertoire.


