  trans: "\n\n```\ntarget.hp -= damage + magicPower;             \n\nprevDeco.skill(target);\n\
    \n}\n```\n\n对于每个 `Decorator` 和 `Default Class`，`skill()` 函数都会执行该类的原始代码，然后为下一个对象再次调用\
    \ `skill()`。\n\n并如此循环。这种过程会一直持续，直到所有附加的 `Decorators` 以及 `Default Class` 都被调用了\
    \ `skill()`。\n\n在上述代码中，由于我们在原始默认类上附加了两个 `Decorators`，`skill()` 将为这两个都执行。所有对 `skill()`\
    \ 的函数调用都将具有原始 `target` 作为输入。\n\n```\nCharacter me = new GreatSword(new FieryBattleAxe(me));\n\
    ```\n\n从对象 `me` 调用 Skill：\n\n- 执行 `GreatSword.Skill()`，随后执行自身的\n- 执行 `FieryBattleAxe.Skill()`\n\
    - 执行 `DefaultChar.Skill()`\n\n但如果一个没有附加任何 `Decorator` 对象的 `Default Character`\
    \ 调用了 `skill()` 呢？\n\n```csharp\nCharacter you = new DefaultChar();\n\nyou.skill(me);\n\
    ```\n\n因为没有附加任何 `Decorators`，只有 `Default` 类的 `skill()` 函数会被调用。\n\n# 装饰器模式简述\n\n\
    借用其他设计模式的一些元素，装饰器模式确实是实现起来较为复杂的模式之一。\n\n只需理解它的前提：它提供了一种在运行时动态增强和扩展对象的方法。由于它是游戏以及任何其他需要演进数据对象的场景中核心设计模式之一，以稳健的方式实现这种模式将成为你技术储备中的极佳补充。\n\
    \n# 第 7 章：状态模式\n\n在创建数据类时，所有的字段、方法和其他特征都有一组不同的值集合。这些值可以在创建数据对象时初始化，也可以在需要时随时更改。\n\
    \n但每当出现数据对象需要改变几乎所有特征的场景时，就会遇到问题。特征可能太多了，无法逐个修改，而且可能会出现过错误。\n\n因此，处理这种情况的更好方法是使用类抽象和多态来同时更改数据对象的许多特征。如果数据对象在运行期间持续发生变化，这种方法就会变得更具吸引力。\n\
    \n本质上，这就是状态模式的体现——数据对象可以在运行时根据外部因素或任何需要特定行为的因素来改变其特征。\n\n## 它的基本工作原理：\n\n数据对象将包含一个可交换的状态实例。可以根据需要包含任意数量的不同可交换状态。\n\
    \n如果你更改了状态，就会改变数据对象的特征和行为。你通常这样做是为了适应你的数据类所处的任何情况。\n\n## 状态模式与策略模式的区别：\n\n`State`\
    \ 和 `Strategy` 模式都实现了适用于不同场景的设计变体。然而，它们之间的主要区别在于场景。\n\n`Strategy` 模式提供了处理算法的不同方式。它的算法变体仅在过程调用时生效。\n\
    \n另一方面，`State` 模式对象在运行期间持续存在。环境的任何变化都可以触发 `State` 模式对象进行适应。\n\n## 创建状态模式：\n\n\
    要实现此设计模式，请遵循以下步骤：\n\n1. 识别哪个类将作为 `handler` 类。该类的部分功能取决于其当前状态。\n2. 创建 `State` 抽象。在这里定义所有的公共字段和过程。\n\
    3. 创建所有不同的 `State` 子类。在必要的地方实现。\n4. 让 `Handler` 包含其当前状态的实例。其数据类型应该是 `Abstract\
    \ Class`。当用构造函数初始化时，`Handler` 应该有一个默认状态。\n5. 在 `Handler` 类中开发更改状态的方法。应该有一个切换方法（toggle）和一个设置方法（set）。\n\
    6. 应用所有其他利用 `Handler` 所依赖的各种 `States` 的代码。\n\n总体来说，这里是状态模式的 UML 图：\n\n![](img/Image00009.jpg)\n\
    \n`State` 模式可能是存在的最常用的设计模式之一。如果实现得当，`State` 模式将赋予数据对象敏锐的适应能力。\n\n现在我们将探索状态模式组成的代码。\n\
    \n# C#-7a：C# 中的状态模式\n\n以下是状态模式在 C# 中的样子。\n\n首先，我们从 `Handler` 类开始。它包含一个可以转换为不同状态的属性——这是一个适用于状态模式的场景。\n\
    \n```csharp\n/*\n// Handler 类拥有：\n// - 一个变换状态类的实例\n// 根据你的需要添加任何其他字段或方法\n*/\n\
    class Handler {\n    AbstractState currentState;\n\n    /*\n    // 简单实现：\n   \
    \ // (通过 IF-ELSE 语句将 currentState 切换到下一个状态)\n    // - 确保覆盖所有可用状态\n    // - 必要时重新实现\
    \      \n    */  \n    void toggleState() {\n        if (currentState is StateOne)\
    \ {\n            currentState = new StateTwo();\n        }\n        if (currentState\
    \ is StateTwo) {\n            currentState = new StateN();\n        }\n      \
    \  if (currentState is StateN) {\n            currentState = new StateOne();\n\
    \        }\n    }\n\n    void setState(AbstractState input) {\n        this.currentState\
    \ = input;\n    }\n\n    // 构造函数：\n    Handler() {\n        currentState = new\
    \ StateOne();\n    }\n}\n```\n\n接下来是 `State` 抽象。这将是不同类的超类。\n\n```csharp\nclass\
    \ AbstractState {\n    String commonField;\n    // 输入：（你的选择）\n    // 输出：（你的选择）\n\
    \    public void Procedure() {}\n}\n```\n\n最后，我们实现状态子类。它们的实现是独有的；公共字段是不同的。\n\n\
    ```csharp\nclass StateOne : AbstractState {\n    StateOne() {\n        commonField\
    \ = \"ONE\";\n    }\n    // 子类对\n    // commonProcedure() 的实现\n    // 包含了父类的所有特征，\n\
    \    // 加上任何效果\n    public override void Procedure() {\n        base.Procedure();\n\
    \    }\n}\n\nclass StateTwo : AbstractState {\n    StateTwo() {\n        commonField\
    \ = \"TWO\";\n    }\n    public override void Procedure() {\n        base.Procedure();\n\
    \    }\n}\n\nclass StateN : AbstractState {\n    StateN() {\n        commonField\
    \ = \"N\";\n    }\n    public override void Procedure() {\n        base.Procedure();\n\
    \    }\n}\n```\n\n# C#-7b：应用状态模式\n\n使用你喜欢的 IDE 运行以下代码。在线 IDE，如 `codechef.com`、`rextester.com`、`ideone.com`\
    \ 或 `codpad.org` 都是很好的选择。\n\n在这里，我们将遇到一个需要我们应用状态模式的情况。\n\n变形金刚（Transformers）\n\
    \n假设你正在为一台先进的变形车辆编写代码。\n\n```csharp\n/*\n// 一个变形金刚目前拥有：\n// - 一个位置（坐标形式）\n// 它可以：\n\
    // - 发射主武器\n// - 移动其物理位置\n*/\nclass TransformerMech {\n    // 坐标\n    Coordinates\
    \ location;\n    public void fireMainWeapon(Coordinates target) {} \n    public\
    \ void move(double degrees) {}\n}\n```\n\n你的代码还以数据类的形式包含了 X-Y-Z 坐标：\n\n"
- fmt: "\n```java\n/*\n// Coordinates have:\n// - longitude and latitude;\n// - height,\
    \ as meters above current ground level\n*/\nclass Coordinates {\n    double lat,\
    \ longt, height;\n\n    // CONSTRUCTOR:\n    public Coordinates(double lat, double\
    \ longt, double height){\n        this.lat = lat;\n        this.longt = longt;\n\
    \        this.height = height;\n    }\n}\n```\n\nA Transformer Mech’s ability\
    \ to move and fire its weapon will depend on what state it’s in. As a bipedal\
    \ robot, it can move move modestly, but it doesn’t have a main weapon. As a tank,\
    \ it can move faster, have a higher armor rating, and use a standard weapon. As\
    \ an immobile cannon, it will have an extremely powerful weapon at the cost of\
    \ its movement ability. And as an airborne flyer, it can move extremely fast in\
    \ all directions.\n\nClearly, this situation will require the `State Pattern`.\
    \ So let’s apply it step-by-step.\n\n### 1) Identify which class will be the ‘handler’\
    \ class\nA key part of the functionality from this class will depend on its current\
    \ state.\n\nThe `TransformerMech` class will be the ‘handler’ class. Thus, we’ll\
    \ implement it in a way that utilizes its ever-changing current state.\n\n###\
    \ 2) Create the State abstraction\nDefine all common fields and procedures here.\n\
    \nThe abstract form of your various `States` will include ALL fields and procedures\
    \ that each one of your states share.\n\nEarlier, we’ve described the various\
    \ traits that our Transformer Mech will have: some main weapon and a movement\
    \ ability. Our main weapon has a damage output rating and a firepower rating.\n\
    \nLet’s also include some form of armor to mitigate attacks. So overall, our Mech\
    \ will have all of these traits, but their values vary depending on the ‘State’\
    \ our Mech is in.\n\nHence, here is what our abstract class can look like:\n\n\
    ```java\nabstract class AbstractMode {\n    public int firePower;\n    public\
    \ double firingRate;\n    public int moveSpeed;\n    public int armor;\n}\n```\n\
    \nNow we can start developing the different `States` our Mech can take.\n\n###\
    \ 3) Create all the different State Subclasses\nImplement where necessary.\n\n\
    We’ve described four different states for our Transformer Mech earlier. The first\
    \ state is a bipedal robot with no main weapons and a relatively slower movement\
    \ speed (it runs to move).\n\nHence, the `State` class will look like this:\n\n\
    ```java\nclass RobotMode: AbstractMode {\n    // CONSTRUCTOR:\n    public RobotMode(){\n\
    \        this.firePower = 0;\n        this.firingRate = 0;\n        this.moveSpeed\
    \ = 10;\n        this.armor = 10;\n    }\n}\n```\n\nThe next State we’ve described\
    \ is a tank with a main weapon with reasonably fair damage and fire rate, as well\
    \ as a high armor rating. Its `State` class will look like this:\n\n```java\n\
    class TankMode: AbstractMode {\n    // CONSTRUCTOR:\n    public TankMode(){\n\
    \        this.firePower = 25;\n        this.firingRate = 0.75;\n        this.moveSpeed\
    \ = 50;\n        this.armor = 50;\n    }\n}\n```\n\nThe third State is an immobile\
    \ cannon. It has a highly powerful yet slow main weapon. It also has a moderate\
    \ armor rating. This is what its `State` class will look like:\n\n```java\nclass\
    \ BlasterCannonMode: AbstractMode {\n    // CONSTRUCTOR:\n    public BlasterCannonMode(){\n\
    \        this.firePower = 180;\n        this.firingRate = 5.0;\n        this.moveSpeed\
    \ = 0;\n        this.armor = 30;\n    }\n}\n```\n\nAnd lastly, the Flight State\
    \ gives the Transformer Mech the ability to fly. Its weapon will have a modest\
    \ firepower rating but with a high rate of fire.\n\n```java\nclass FlightMode:\
    \ AbstractMode {\n    // CONSTRUCTOR:\n    public FlightMode(){\n        this.firePower\
    \ = 15;\n        this.firingRate = 0.5;\n        this.moveSpeed = 105;\n     \
    \   this.armor = 20;\n    }\n}\n```\n\nNow that we’ve implemented our different\
    \ states, we can now integrate them into our Transformer mech in the next step.\n\
    \n### 4) Make the Handler include an instance of its current state\nIts data type\
    \ should be the `Abstract` Class. When initialized with a constructor, the Handler\
    \ should have a default state.\n\nTo integrate our various interchangeable `States`\
    \ onto our Transformer Mech, we do two things. The first is to include the current\
    \ `State` into our Mech as a field. Afterwards, we need to initialize this field.\
    \ The best way to do it is within the `Constructor`; one of inputs can be the\
    \ default state for a Transformer Mech.\n\n```java\nclass TransformerMech {\n\
    \    // Coordinates\n    Coordinates location;\n    // Field for Current State:\n\
    \    AbstractMode currentMode;\n    void fireWeapon(Coordinates target) {}\n \
    \   void move(double degrees) { }\n    // CONSTRUCTOR:\n    public TransformerMech(Coordinates\
    \ c, AbstractMode am) {\n        this.location = c;\n        this.currentMode\
    \ = am;\n    }\n}\n```\n\n### 5) Develop the state-changing methods within the\
    \ Handler class\nThere should be a toggling method and a set method.\n\nWe now\
    \ need to create the mechanism to change the Mech’s `States`. The first method\
    \ is a simple setter; it switches the Mech’s `State` to whatever input has been\
    \ given. Just insert this code inside the `TransformerMech` class:\n\n```java\n\
    // IN: a State\n// OUT: none\n// EFFECT: set Mech's State to the input\nvoid setMode(AbstractMode\
    \ s) {\n    this.currentMode = s;\n}\n```\n\nThe next method to create is a `toggle`\
    \ method to change the Mech’s `State` to the next one. This method is optional\
    \ in most cases, but sometimes it will come handy. Again, insert this code inside\
    \ the `TransformerMech` class:\n\n```java\n// IN: none\n// OUT: none\n// EFFECT:\
    \ toggle Mech's state to the next one\npublic void toggleMode() {\n    if (currentMode\
    \ is RobotMode)\n        currentMode = new TankMode();\n    if (currentMode is\
    \ TankMode)\n        currentMode = new BlasterCannonMode();\n    if (currentMode\
    \ is BlasterCannonMode)\n        currentMode = new FlightMode();\n    if (currentMode\
    \ is FlightMode)\n        currentMode = new RobotMode();\n}\n```\n\n### 6) Apply\
    \ all other code that utilizes the various States that the Handler depends on\n\
    Our Transformer Mech has methods that utilize properties from our `State` classes.\
    \ One of the Mech’s methods fires its main weapon at a given target. How this\
    \ procedure is executed depends on the firepower, firing rate, and movement speed\
