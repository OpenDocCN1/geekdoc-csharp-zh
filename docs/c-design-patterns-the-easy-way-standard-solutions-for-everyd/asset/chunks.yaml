    Advanced Coding:


    Notice how all the sports balls are still one type of object - sports balls.


    How would you change the code so that each of the factory classes create objects
    of balls they’re supposed to create? For example, how would you have the BasketballMaker
    create Basketball objects instead of general, modified Sports Balls? Or a BaseballMaker
    creating Baseball objects?


    Chapter 2: The Composite Pattern


    ==== ==== ==== ==== ====


    Picture this scenario: you have to organize your data in a hierarchal manner.
    They seem to somehow resemble ‘files’ and ‘folders’.


    As you and other computer users know, files go into folders and folders can go
    into other folders as well.


    You also want to do this in a way that doesn’t replicate unnecessary code.


    So what do you need?


    The Composite Pattern.


    How it essentially works:


    You have two distinct classes: a File class and a Folder class. Or Item and Group.
    Clothing and Bag. Toys and Box. Any combination of two classes, in which one of
    them is a collection composed of both types.


    However, both classes may have way too many similar traits, methods, and fields.
    You realize you may need to write twice the code that you would normally do -
    one for the items and one for the groupings.


    The solution here is to have them extend a common superclass or abstract class
    - a component. This includes one key distinction; the Group class contains a collection
    of this superclass. And because both classes extend a common superclass, the Group
    class can have a collection of either items or groups.


    For example, let’s say you have two classes: Clothing and Bag. A Bag can contain
    both clothes and other bags. They both share similar characteristics such as name,
    description, etc.. You realize how unproductive it is to write separate code when
    it really should be under the same code (i.e. when getting all the names would
    need calls from both Clothing.getName() and Bag.getName()).


    Therefore, you apply the Composite Pattern. Both Clothing and Bag classes extend
    a new superclass, Item. The Bag class is modified to have a collection of Items
    (which can be either Bags or Clothing).


    Here’s what the UML diagram would look like:


    ![](Image00004.jpg)


    The main thing to remember here are the item/container classes extend a common
    superclass - component. The container class will have a list containing components,
    which can be either files or folders.


    Depending on the language you’re coding with, the superclass may also be an abstract
    class, interface, or any type of abstraction that your programming language comes
    with.


    The Pseudocode implementation for this pattern is also included in the Archive.
    If you need to implement this pattern in another language,  the pseudocode should
    help you.


    Next,  let’s put the Composite Pattern into use.


    C#-2a: The Composite Pattern, in C#


    ==== ==== ==== ==== ====


    Here is how the Composite Pattern looks like in C#:


    /*


    // Component is the superclass which File and Folder classes extend


    // You may define any fields and methods shared by both subclasses


    */


    abstract class Component {


        // insert any amount of fields and methods


        // where necessary


        String someField;


       void someMethod() {};


    }


    // General Item Class (as File):


    // contains all fields and methods defined at Component


    class File: Component {


    }


    // General Group Class (as Folder):


    // contains all fields and methods defined at Component


    // Also has:


    // - a List of Components, which can contain either Items or Groups


    class Folder : Component {


        List<Component> contents = new List<Component>();


    }


    In the next chapter, we’ll do a walkthrough in implementing this design pattern.


    C#-2b: Implementing the Composite Pattern


    Use an IDE of your choice for the code below. Online IDE’s, such as [codechef.com](http://codechef.com)
    , [rextester.com](http://rextester.com) , [ideone.com](http://ideone.com) ,  or
    [codepad.org](http://codepad.org) are a great choice.


    ========================= ======


    In this chapter, we encounter a situation which suggests having the Composite
    Pattern as a viable solution. Then, we’ll be coding the Composite Pattern step-by-step.


    File Manager


    Imagine you are a software engineer at a very popular social media site.


    The next website update will have a really cool feature - enable users to upload
    and organize data files of their choice. And you’re tasked with implementing this
    functionality. You know you have to design the File and Folder classes, but you
    also realize that they share too many traits, such as name, date created, date
    modified, a thumbnail icon, etc.. So you think to yourself, there must be a more
    simple way to implement this.


    The first thing that comes to your mind is to implement the Composite Pattern.
    This is an ideal situation to apply it as well.


    Step 1: The Component Superclass


    First, we’ll create the superclass that the File and Folder classes are based
    on.


    We’re coding in C#, so we have the Abstract Class available.


    For now, let’s add the following fields to the superclass: the name, the date
    created, and the date last modified.


    /*


    // Component is the superclass which File and Folder classes extend


    // It has:


    // - Name, as a String


    // - the Date Created


    // - the Date Last Modified


    // It can:


    // - rename itself


    // - update the Last Modified date


    */


    abstract class Component {


        String name;


        DateTime dateCreated;


        DateTime dateLastModified;   


    }


    Step 2: Customizing the Component Constructor


    Next, we’ll code a modified version of the constructor for the Component. When
    a new component is created, its name will be set and its two date fields will
    be set to the current date.


    The Files and Folders that will later extend this superclass will eventually use
    the same constructor as well.


    abstract class Component {


        public String name;


        public DateTime dateCreated;


        public DateTime dateLastModified;      


            /*


        // INPUT: a String


        // Custom Constructor for the Component Class,


        // Upon creation, the dates created and last modified


        // are set to the current date an object would be created


        */


        public Component(String n) {


            this.name = n;


            this.dateCreated = new DateTime();


            this.dateLastModified = new DateTime();


        }   


    } 


    Here, you see first-hand how shared methods can save a programmer many lines of
    code and prevent more coding mistakes along the way. Any essential fields and
    methods between both the File and Folder classes will be present - programmers
    won’t have the hassle of coding twice as much as needed, as well as having to
    change certain fields and methods twice.  Also, the rest of the system will treat
    data objects from these two classes very similarly.


    Step 3: Creating the File Class


    Now we create the File class.'
