- fmt: "\nThere are three key components to a `Singleton` class. First, the class\
    \ constructor is set in a certain way such that it cannot be used outside the\
    \ class. This ensures the singleton class remains a singleton by removing the\
    \ ability to make instances of it except within its own code.\n\nSecond, the class\
    \ itself will contain the only instance based on it. The singleton class has its\
    \ only object as one of its own fields.\n\nAnd lastly, the third component is\
    \ a method that retrieves the actual single object. This method has to be accessible\
    \ without needing a created class object. In most implementations, it uses the\
    \ First component (the class-code-only constructor) to create the object if it\
    \ doesn’t exist yet.\n\nHere is the UML diagram describing the `Singleton` class:\n\
    \n![](Image00006.jpg)\n\nThe Pseudocode implementation for this pattern is also\
    \ included in the Archive, in case you need to implement this pattern in another\
    \ language.\n\nNext, we’ll be using applying the Singleton pattern in a scenario.\n\
    \n### C#-4a: The Singleton Pattern, in C#\n\nHere is how the Singleton Pattern\
    \ looks like in C#.\n\n```csharp\n/*\n// A Singleton Class has:\n// - A Singleton\
    \ Instance\n// - any other Fields you need\n//\n// it can NOT:\n// - be instantiated\
    \ as normal (as if it were a regular class)\n// (The constructor is set to Private,\
    \ just to be sure)\n//\n// It can:\n// - return the ONLY singleton class instance\n\
    */\nclass Singleton {\n    // Singleton Component #1:\n    // CONSTRUCTOR:\n \
    \   // - set to PRIVATE; cannot be accessed outside the class\n    private Singleton()\
    \ { }\n\n    // Singleton Component #2:\n    // The Only Singleton Object:\n \
    \   // - set to PRIVATE; cannot be accessed outside the class  \n    private static\
    \ Singleton obj = null;\n\n    // Singleton Component #3:\n    // INPUT: (your\
    \ choice)\n    // OUTPUT: A Singleton Object\n    // EFFECT: Returns the ONLY\
    \ singleton object.\n    // Creates one if nonexistent.\n    // - set to STATIC;\
    \ will not require an Object to call this method\n    public static Singleton\
    \ getObject() {\n        if (obj == null) {\n            obj = new Singleton();\n\
    \            // Initialize any other fields here\n        }\n        return obj;\n\
    \    }\n}\n```\n\nTo access your Singleton object, you simply need to call the\
    \ static method `getObject()`. Note that the Singleton Object is expected wherever\
    \ you call the Method.\n\nAssigning the Singleton to Variable `sg`\n`Singleton\
    \ sg = Singleton.getObject();`\n\nAlso note that you can assign the same Singleton\
    \ to multiple variables; they will all refer to the same Singleton.\n\nAssigning\
    \ the Singleton to multiple Variables\n`Singleton sg1 = Singleton.getObject();`\n\
    `Singleton sg2 = Singleton.getObject();`\n`Singleton sg3 = Singleton.getObject();`\n\
    \n### C#-4b: Implementing the Singleton Pattern\n\nUse an IDE of your choice for\
    \ the code below. Online IDE’s, such as [codechef.com](http://codechef.com), [rextester.com](http://rextester.com),\
    \ [ideone.com](http://ideone.com), or [codpad.org](http://codpad.org) are a great\
    \ choice. \n\nIn this chapter, we’ll encounter a situation that will greatly benefit\
    \ from a Singleton Pattern implementation.\n\n#### Championship\n\nThink of any\
    \ sports leagues out there. In a given season, each team within a league has a\
    \ set of games against other teams in the league. At the end of the season, the\
    \ winningest handful of teams of the season qualify for a single-elimination tournament.\n\
    \nOut of those teams in the tournament, only one will be crowned the Champions.\n\
    \nChampions. Only one.\n\nIf you were programming this, you realize your program\
    \ might run into problems if two or more Final Championship teams occur within\
    \ a league in a single season. So a situation that can only have one of a single\
    \ component requires the Singleton Pattern.\n\n#### Step 1: Identify the Classes\
    \ and Procedures in your App\n\nIn this case, we will keep things simple and only\
    \ identify and define two classes for now: a Sports Team…\n\n```csharp\n// A Team\
    \ has:\n// - a Name (String)\n// - any other fields you want\nclass Team {\n \
    \   public String name;\n    // CONSTRUCTOR:\n    // INPUT: a Team Name (String)\n\
    \    public Team(String n) {\n        this.name = n;\n    }\n}\n```\n\n…and the\
    \ Championship.\n\n```csharp\n// A Championship has:\n// - a Championship Team\n\
    //\n// it can:\n// - Run a Playoffs Tournament with 8 Teams\nclass Championship\
    \ {\n    public Team champion;\n    // INPUT: 8 Teams\n    // OUTPUT: none\n \
    \   // EFFECT: The Playoffs:\n    // - match the teams by pair,\n    // - winning\
    \ teams advance to the next matches\n    // - last team becomes the Champion\n\
    \    // NOTE: if championship already has a champion,\n    // playoffs() will\
    \ return without simulating the Playoffs\n    public void playoffs(Team t1, Team\
    \ t2, Team t3, Team t4, Team t5, Team t6, Team t7, Team t8) {\n        // return\
    \ if champion team present\n        if (champion != null) return;\n        Random\
    \ r = new Random();\n        // QUARTER -> SEMIFINALS:\n        Team semi1 = match(t1,\
    \ t8, r.Next());\n        Team semi2 = match(t2, t7, r.Next());\n        Team\
    \ semi3 = match(t3, t6, r.Next());\n        Team semi4 = match(t4, t5, r.Next());\n\
    \        Console.WriteLine(\"\");\n        // SEMIFINALS -> FINALS:\n        Team\
    \ finals1 = match(semi1, semi4, r.Next());\n        Team finals2 = match(semi2,\
    \ semi3, r.Next());\n        Console.WriteLine(\"\");\n        // FINALS -> CHAMPIONSHIP:\n\
    \        Team champ = match(finals1, finals2, r.Next());\n        this.champion\
    \ = champ;\n        Console.WriteLine(\"Team \" + chap.name + \" WIN THE CHAMPIONSHIP!\"\
    );\n    }\n\n    /*\n    // HELPING FUNCTION to playoffs():\n    // INPUT: - Two\
    \ Teams: a & b\n    //         - an integer (to determine winners)\n    // OUTPUT:\
    \ a Team\n    // EFFECT: Match between two teams a & b,\n    // with the winner\
    \ as the Output\n    */\n    private Team match(Team ta, Team tb, int odds) {\n\
    \        if (odds == 0) {\n            Console.WriteLine(ta.name + \" deats \"\
    \ + tb.name);\n            return ta;\n        } else {\n            Console.WriteLine(tb.name\
    \ + \" deats \" + ta.name);\n            return tb;\n        }\n    }\n\n    public\
    \ static void main() {\n        // Create 8 Teams:\n        Team contender1 =\
    \ new Team(\"Archers\");\n        Team contender2 = new Team(\"Bobcats\");\n \
    \       Team contender3 = new Team(\"Centurions\");\n        Team contender4 =\
    \ new Team(\"Danger Zone\");\n        Team contender5 = new Team(\"Energy\");\n\
    \        Team contender6 = new Team(\"Flames\");\n        Team contender7 = new\
    \ Team(\"Guards\");\n        Team contender8 = new Team(\"Hunters\");\n\n    \
    \    // Run the Championship:\n        Championship c = new Championship();\n\
    \        c.playoffs(contender1, contender2, contender3, contender4, contender5,\
    \ contender6, contender7, contender8);\n    }\n}\n```\n\n#### Step 2: Identify\
    \ which class should be a Singleton\n\nBut there’s a Problem. We only want one\
    \ Championship Team and one Playoff every time we run the code. If these few lines\
    \ of code are run in the `main()` method…\n"
  raw: 'There are three key components to a Singleton class. First, the class constructor
    is set in a certain way such that it cannot be used outside the class. This ensures
    the singleton class remains a singleton by removing the ability to make instances
    of it except within its own code.


    Second, the class itself will contain the only instance based on it. The singleton
    class has its only object as one of its own fields.


    And lastly, the third component is a method that retrieves the actual single object.
    This method has to be accessible without needing a created class object. In most
    implementations, it uses the First component (the class-code-only constructor)
    to create the object if it doesn’t exist yet.


    Here is the UML diagram describing the Singleton class:


    ![](Image00006.jpg)


    The Pseudocode implementation for this pattern is also included in the Archive,
    in case you need to implement this pattern in another language.


    Next, we’ll be using applying the Singleton pattern in a scenario.


    C#-4a: The Singleton Pattern, in C#


    ==== ==== ==== ==== ====


    Here is how the Singleton Pattern looks like in C#.


    /*


    // A Singleton Class has:


    // - A Singleton Instance


    // - any other Fields you need


    //


    // it can NOT:


    // - be instantiated as normal (as if it were a regular class)


    // (The constructor is set to Private, just to be sure)


    //


    // It can:


    // - return the ONLY singleton class instance


    */


    class Singleton {


        // Singleton Component #1:


        // CONSTRUCTOR:


        // - set to PRIVATE; cannot be accessed outside the class


        private Singleton() { }


        // Singleton Component #2:


        // The Only Singleton Object:


        // - set to PRIVATE; cannot be accessed outside the class  


        private static Singleton obj = null;


        // Singleton Component #3:


        // INPUT: (your choice)


        // OUTPUT: A Singleton Object


        // EFFECT: Returns the ONLY singleton object.


        // Creates one if nonexistent.


        // - set to STATIC; will not require an Object to call this method


        public static Singleton getObject() {


            if (obj == null) {


                obj = new Singleton();


                // Initialize any other fields here


                }


            return obj;


            }


        }


    To access your Singleton object, you simply need to call the static method getObject().
    Note that the Singleton Object is expected wherever you call the Method.


    // Assigning the Singleton to Variable sg


    Singleton sg = Singleton.getObject();


    Also note that you can assign the same Singleton to multiple variables; they will
    all refer to the same Singleton


    // Assigning the Singleton to multiple Variables


    Singleton sg1 = Singleton.getObject();


    Singleton sg2 = Singleton.getObject();


    Singleton sg3 = Singleton.getObject();


    C#-4b: Implementing the Singleton Pattern


    Use an IDE of your choice for the code below. Online IDE’s, such as [codechef.com](http://codechef.com)
    , [rextester.com](http://rextester.com) , [ideone.com](http://ideone.com) ,  or
    [codepad.org](http://codepad.org) are a great choice.


    ========================= ======


    In this chapter, we’ll encounter a situation that will greatly benefit from a
    Singleton Pattern implementation.


    Championship


    Think of any sports leagues out there. In a given season, each team within a league
    has a set of games against other teams in the league. At the end of the season,
    the winningest   handful of teams of the season qualify for a single-elimination
    tournament.


    Out of those teams in the tournament, only one will be crowned the Champions.


    Champions.


    Only one.


    If you were programming this, you realize your program might run into problems
    if two or more Final Championship teams occur within a league in a single season.


    So a situation that can only have one of a single component requires the Singleton
    Pattern.


    Step 1:  Identify the Classes and Procedures in your App


    In this case, we will keep things simple and only identify and define two classes
    for now: a Sports Team…


    // A Team has:


    // - a Name (String)


    // - any other fields you want


    class Team {


        public String name;


        // CONSTRUCTOR:


        // INPUT: a Team Name (String)


        public Team(String n) {


            this.name = n;


        }


    }


    …and the Championship.


    // A Championship has:


    // - a Championship Team


    //


    // it can:


    // - Run a Playoffs Tournament with 8 Teams


    class Championship {


        public Team champion;


        // INPUT: 8 Teams


        // OUTPUT: none


        // EFFECT: The Playoffs Simulator:


        // - match up the teams pair by pair,


        // - winning teams advance to the next matches


        // - last team becomes the Champion Team


      // NOTE: if a championship already has a champion team,


        // playoffs() will return without simulating the Playoffs


        public void playoffs(Team t1,


                                    Team t2,


                                    Team t3,


                                    Team t4,


                                    Team t5,


                                    Team t6,


                                    Team t7,


                                    Team t8) {


                  // return if champion team already present


                  if (champion != null) return;


            Random r = new Random();


            // QUARTER -> SEMIFINALS:


            Team semi1 = match(t1, t8, r.Next());


            Team semi2 = match(t2, t7, r.Next());


            Team semi3 = match(t3, t6, r.Next());


            Team semi4 = match(t4, t5, r.Next());


            Console.WriteLine("");


            // SEMIFINALS -> FINALS:


            Team finals1 = match(semi1, semi4, r.Next());


            Team finals2 = match(semi2, semi3, r.Next());


            Console.WriteLine("");


            // FINALS -> CHAMPIONSHIP:


            Team champ = match(finals1, finals2, r.Next());


            this.champion = champ;


            Console.WriteLine("Team " + champ.name + " WIN THE CHAMPIONSHIP!");             
    }


           /*


            // HELPING FUNCTION to playoffs():


            // INPUT: - Two Teams: a & b


            //        - an integer (to determine winners)


            // OUTPUT: a Team


            // EFFECT: Match between two teams a & b,


            // with the winner as the Output


            */


            private Team match(Team ta, Team tb, int odds) {          


                if (odds %2 == 0) {


                    Console.WriteLine(ta.name + " Defeats " + tb.name);


                    return ta;               


                }


                else {


                    Console.WriteLine(tb.name + " Defeats " + ta.name);


                    return tb;               


                }           


            }  


        }


    Within the public-static-void main() Method, these following lines create the
    8 Teams then run the Championship afterwards.


            // Create 8 Teams:


            Team contender1 = new Team("Archers");


            Team contender2 = new Team("Bobcats");


            Team contender3 = new Team("Centurions");


            Team contender4 = new Team("Danger Zone");


            Team contender5 = new Team("Energy");


            Team contender6 = new Team("Flames");


            Team contender7 = new Team("Guards");


            Team contender8 = new Team("Hunters" );


            // Run the Championship Playoffs:


            Championship c = new Championship();


            c.playoffs(contender1,


                       contender2,


                       contender3,


                       contender4,


                       contender5,


                       contender6,


                       contender7,


                       contender8);


