  trans: "\n\n随后，编写并运行几行代码，创建每个工厂的实例，并为每个工厂至少创建一个球。\n\n这里是一些可以帮助你起手的代码：\n\n```java\n\
    // 足球制造器：\n// - 创建具有不同字段的足球类对象\nclass SoccerballMaker : BallFactory {\n    //\
    \ (方法实现了接口版本)\n    // 效果：创建一个作为足球的运动球\n    SportsBall BallFactory.createBall()\
    \ {\n        SportsBall b = new SportsBall();\n        // 修改对象字段；\n        //\
    \ 它们应该都像足球的样子和特征一样..\n        return b;\n    }\n}\n\n// 排球球制造器：\n// - 创建具有不同字段的排球类对象\n\
    class VolleyballMaker : BallFactory {\n    // (方法实现了接口版本)\n    // 效果：创建一个作为排球的运动球\n\
    \    public SportsBall createBall() {\n        SportsBall b = new SportsBall();\n\
    \        // 修改对象字段；\n        // 它们应该都像排球的样子和特征一样..\n        return b;\n    }\n\
    }\n```\n\n### 高级编码\n注意所有的运动球仍然是同一种类型的对象——运动球。你将如何修改代码，以便每个工厂类都能创建它们应该创建的球对象？例如，你如何让\
    \ `BasketballMaker` 创建 `Basketball` 对象，而不是通用的、修改过的 `Sports Balls`？或者让 `BaseballMaker`\
    \ 创建 `Baseball` 对象？\n\n# 第 2 章：组合模式\n\n想象这样一个场景：你必须以层次分明的方式组织你的数据。它们在某种程度上类似于“文件”和“文件夹”。正如你和其他计算机用户所知的，文件存放在文件夹中，文件夹也可以放在其他文件夹中。你还希望以一种不产生必要的代码的方式来实现。那么你需要什么呢？组合模式。\n\
    \n### 它的基本工作原理：\n你有两个不同的类：一个 `File` 类和一个 `Folder` 类。或者是 `Item` 和 `Group`。`Clothing`\
    \ 和 `Bag`。`Toys` 和 `Box`。任何两个类的组合，其中其中一个类是由这两种类型组成的集合。\n\n然而，这两个类可能拥有太多相似的特征、方法和字段。你意识到你可能需要编写比通常多一倍的代码——一个用于项目，一个用于分组。\n\
    \n解决方案是让它们继承一个公共的超类或抽象类——`component`（组件）。这包含一个关键区别：`Group` 类包含该超类的集合。因为两个类都继承自同一个公共超类，所以\
    \ `Group` 类可以拥有项目或分组的集合。\n\n例如，假设你有两个类：`Clothing` 和 `Bag`。一个 `Bag` 可以同时包含衣服和其他包。它们共享相似的特征，如名称、描述等。你意识到，编写分开的代码是多么低效，因为它们实际上应该在同一个代码下（例如，当获取所有名称时，需要分别调用\
    \ `Clothing.getName()` 和 `Bag.getName()`）。\n\n因此，你应用了组合模式。`Clothing` 和 `Bag` 类都继承一个新的超类\
    \ `Item`。`Bag` 类被修改为拥有一个 `Items` 集合（可以是 `Bags` 或 `Clothing`）。\n\n这里的 UML 图看起来是这样的：\n\
    ![](img/Image00004.jpg)\n\n这里要记住的主要点是，项目/容器类继承一个公共超类——组件。容器类将有一个包含组件的列表，这些组件可以是文件也可以是文件夹。\n\
    \n取决于你所使用的编程语言，超类也可能是抽象类、接口或你的编程语言自带的任何类型的抽象。该模式的伪代码实现也包含在存档中。如果你需要在另一种语言中实现此模式，伪代码将对你有所帮助。\n\
    \n接下来，让我们把组合模式用起来。\n\n## C#-2a：C# 中的组合模式\n\n以下是组合模式在 C# 中的样子：\n\n```csharp\n/*\n\
    // Component 是 File 和 Folder 类继承的超类\n// 你可以定义任何两个子类共享的字段和方法\n*/\nabstract class\
    \ Component {\n    // 根据需要插入任意数量的字段和方法\n    String someField;\n    void someMethod()\
    \ {};\n}\n\n// 通用项目类（作为 File）：\n// 包含了在 Component 中定义的所有字段和方法\nclass File: Component\
    \ {}\n\n// 通用分组类（作为 Folder）：\n// 包含了在 Component 中定义的所有字段和方法\n// 还有：\n// -一个 Components\
    \ 列表\nclass Folder : Component {\n    List<Component> contents = new List<Component>();\n\
    }\n```\n\n### C#-2b：实现模式\n在下一章中，我们将进行演练。\n\n#### 步骤 1：组件超类\n首先，我们将创建 `File` 和\
    \ `Folder` 类所基于的超类。我们正在使用 C# 编写，所以可以使用抽象类。现在，让我们给超类添加以下字段：名称、创建日期和修改日期。\n\n```csharp\n\
    /*\n// Component 是 File 和 Folder 类继承的超类\n// 它具有：\n// Name，类型为字符串\n// - 创建日期\n\
    // - 修改日期\n// 它可以：\n// 重命名自己\n// - 更新修改日期\n*/\nabstract class Component {\n  \
    \  String name;\n    DateTime dateCreated;\n    DateTime dateModified;\n}\n```\n\
    \n#### 步骤 2：自定义组件构造函数\n接下来，我们将为 `Component` 编写一个修改后的构造函数。当创建一个新组件时，它的名称将被设置，日期字段将设置为当前日期。以后继承此超类的\
    \ File 和 Folder 将最终使用相同的构造函数。\n\n```csharp\nabstract class Component {\n    public\
    \ String name;\n    public DateTime dateCreated;\n    public DateTime dateModified;\n\
    \n    /*\n    // 输入：一个字符串\n    // Component 类的自定义构造函数，\n    // 创建时，创建日期和最后修改日期\n\
    \    //将被设置为创建对象的当前日期\n    */\n    public Component(String n) {\n        this.name\
    \ = n;\n        this.dateCreated = new DateTime();\n        this.dateModified\
    \ = new DateTime();\n    }\n}\n```\n\n在这里，你亲眼看到了共享方法如何为程序员节省大量代码行，并在此过程中防止更多的编码错误。`File`\
    \ 和 `Folder` 类之间的任何基本字段和方法都存在——程序员将不必忍受编写两倍所需代码，也不需要多次更改某些字段和方法。此外，系统的其余部分处理这两个类的数据对象的方式非常相似。\n\
    \n#### 步骤 3：创建 File 类\n现在我们创建 `File` 类。\n\n"
- fmt: "\n## Introduction\nAs stated before, the `File` class will have some common\
    \ fields and methods as the `Folder` class. It even has a very similar constructor\
    \ method.\n\nHowever, the `File` class here will have more distinctive fields.\
    \ It will include some indication of the file’s type (i.e. a spreadsheet, letter\
    \ document, slideshow, picture, video, PDF, etc.). The constructor is further\
    \ modified to include this.\n\n```csharp\n/*\n// General Item Class (a.k.a. File):\n\
    // contains all fields and methods defined at Component\n// Also has:\n// - a\
    \ file type, as a string\n*/\nclass File : Component {\n    public String fileType;\n\
    \n    /*\n    // INPUT: a String\n    // Custom Constructor for the File Class,\n\
    \    // Follows the same procedure as the superclass,\n    // Then sets the file\
    \ type\n    */\n    public File(String n, String f) : base(n) {\n        this.fileType\
    \ = f;\n    }\n}\n```\n\n## Step 3: Creating the Folder Class\n\nCreating the\
    \ `Folder` class will be a very similar procedure as creating the `File` class.\n\
    \nHowever, the difference is that the `Folder` class will have its key field -\
    \ a list of components, which can be either `Files` or `SubFolders`.\n\n```csharp\n\
    // General Group Class (a.k.a. Folder):\n// contains all fields and methods defined\
    \ at Component\n// Also has:\n// - a List of Components, which can contain either\
    \ Items or Groups\nclass Folder : Component {\n    public List<Component> contents\
    \ = new List<Component>();\n    public Folder(String n) : base(n){\n    }\n}\n\
    ```\n\n## Step 4: Running and Testing the Code\n\nNow we’ll test the classes by\
    \ writing a few lines of code. We’ll create a handful of `Files` and `Folders`,\
    \ then organize them in a sort of hierarchy.\n\nRun these lines of code in your\
    \ `Main` class, within the `Public-Static-Void-Main` method (or any other place\
    \ where the following lines of code will run):\n\n```csharp\nFolder top = new\
    \ Folder(\"Top Folder\");\nFile a = new File(\"A\", \"Spreadsheet\");\nFile b\
    \ = new File(\"B\", \"Picture\");\nFolder mid = new Folder(\"Mid Folder\");\n\
    top.contents.Add(a);\ntop.contents.Add(b);\ntop.contents.Add(mid);\nFile c = new\
    \ File(\"C\", \"Video\");\nFile d = new File(\"D\", \"Letter Document\");\nFolder\
    \ bot = new Folder(\"Bottom Folder\");\nmid.contents.Add(c);\nmid.contents.Add(d);\n\
    mid.contents.Add(bot);\nFile e = new File(\"E\", \"PDF\");\nbot.contents.Add(e);\n\
    ```\n\nAfterwards, place these lines of code just after the above. Then, run the\
    \ code:\n\n```csharp\nConsole.WriteLine(top.name);\nforeach (var Component in\
    \ top.contents) {\n    Console.WriteLine(\"    \" + Component.name);\n}\nforeach\
    \ (var Component in mid.contents) {\n    Console.WriteLine(\"      \" + Component.name);\n\
    }\nforeach (var Component in bot.contents) {\n    Console.WriteLine(\"       \
    \ \" + Component.name);\n}\n```\n\nAfter implementing the above steps correctly,\
    \ the output should be like:\n\n```text\nTop Folder\n    A\n    B\n    Mid Folder\n\
    \      C\n      D\n      Bottom Folder\n        E\n```\n\nIf properly implemented,\
    \ we can create a hierarchical system of files, folders, and subfolders. In the\
    \ next chapter, you’ll have a workshop to implement the Composite Pattern on your\
    \ own. Good luck!\n\n## C#-WORKSHOP 2\n\nUse an IDE of your choice for the code\
    \ below. Online IDEs, such as `codechef.com`, `rextester.com`, `ideone.com`, or\
    \ `codepad.org` are great choice.\n\n### MMORPG\n\nYou’re a game developer for\
    \ an online roleplaying game. You’re adding the functionality to store and organize\
    \ in-game items - such as swords, books, potions, food, etc. - into `bags`. And\
    \ yes, you’ll be using the Composite Pattern. Design the classes in a way such\
    \ that you can use bags to store in-game items and even other bags. Remember:\
    \ think of ALL the fields and methods that both items and bags will share, as\
    \ well as the fields and methods unique to each of them.\n\nHere’s the stub for\
    \ the Composite Pattern to get you started. Good luck!\n\n```csharp\nabstract\
    \ class Component {\n    // Insert Fields and Methods here\n}\nclass Item : Component\
    \ {\n    // Item has all Fields and Methods from Component\n    // Insert Unique\
    \ Fields and Methods here\n}\nclass Bag : Component {\n    // Bag has all Fields\
    \ and Methods from Component\n    // Insert Unique Fields and Methods here\n}\n\
    ```\n"
