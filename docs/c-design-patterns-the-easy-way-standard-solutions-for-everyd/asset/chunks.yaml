- fmt: "\nLet’s call it interface `BallMaker`. Then, for each type of ball we have,\
    \ create a subclass extending `BallMaker`. These subclasses are the ones actually\
    \ creating the ball data objects - but each of them has their own specifications.\
    \ So a `BasketBallMaker` subclass would make basketballs and a `FootballMaker`\
    \ subclass would make footballs.\n\nSo here’s what the UML diagram would look\
    \ like:\n\n![](Image00003.jpg)\n\nThe Pseudocode implementation for this pattern\
    \ is also included in the Archive. If you need to implement this pattern in another\
    \ language, the pseudocode should help you.\n\nNext, we’ll be using the Factory\
    \ Pattern.\n\n# C#-1a: The Factory Pattern, in C#\n\nHere is how the Factory Pattern\
    \ looks like in C#:\n\n```csharp\n// Factory is implemented by any subclasses\
    \ that need to use it\n\ninterface Factory {\n    // INPUT: your choice\n    //\
    \ OUTPUT: your choice (set to Void by default)\n    // Constructor for Classes\
    \ that implement this interface\n    void createObject();\n}\n\n// SubFactory1:\n\
    // creates distinct objects based on Factory Interface\nclass SubFactory1 : Factory\
    \ {\n    // This implements the same function outlined in the interface\n    void\
    \ Factory.createObject() {\n        // include ANY unique distinctions for this\
    \ creator class\n        // any other code here\n    }\n}\n\n// SubFactory2:\n\
    // creates distinct objects based on Factory Interface\nclass SubFactory2 : Factory\
    \ {\n    // This implements the same function outlined in the interface\n    void\
    \ Factory.createObject() {\n        // include ANY unique distinctions for this\
    \ creator class\n        // any other code here\n    }\n}\n```\n\nIn the next\
    \ chapter, we’ll do a walkthrough in implementing this design pattern.\n\n# C#-1b:\
    \ Implementing the Factory Pattern\n\nUse an IDE of your choice for the code below.\
    \ Online IDE’s, such as [codechef.com](http://codechef.com) , [rextester.com](http://rextester.com)\
    \ , [ideone.com](http://ideone.com) , or [codepad.org](http://codepad.org) are\
    \ a great choice.\n\nNow we’ll see the factory pattern in action. You’ll see first-hand\
    \ how to use this design pattern through an example, plus a workshop in which\
    \ you continue with the example.\n\n## Sports Ball Creator\n\nImagine that you\
