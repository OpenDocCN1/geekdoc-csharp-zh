    \nIt’ll be much appreciated. Your feedback is crucial to improving our work over\
    \ time.\n\nThank you!\n\n# Chapter 6: The Decorator Pattern\n\nWhen designing\
    \ classes, all fields and methods seem as if they have to be as-is. In other words,\
    \ when you create instances of your classes, they would ALL have the same fields\
    \ and methods as defined by their class.\n\nBut what if there is a way to add\
    \ more features to data objects DURING runtime? Say, a data object acquires more\
    \ features over time?\n\nIt’s possible.\n\nAnd it’s made possible.\n\n## How it\
    \ works:\n\nThe Decorator Pattern has a similar structure to the Composite Pattern.\
