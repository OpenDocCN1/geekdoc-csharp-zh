    Overall, the Decorator class should now look like this:


    class Decoration : Character {


        public Character prevDeco;              // (NEW LINE)


                  // Common Procedure, implemented as Decoration


                  override public void skill(Character target) {


            // (Implementation done by Subclasses)


            // include any other code you want


            prevDeco.skill(target);


                  }


                  // (include any other fields


                  // and procedures as you wish)              


        // (NEW LINES) : - - - - - -             


        // CONSTRUCTOR:


        public Decoration(Character c) {


        this.prevDeco = c;      


        }     


        // - - - - - - - - - - - - - - - -


    } 


    Next is the fun part.


    6) Create the third-level decoration subclasses. These directly extend the Decoration
    class you’ve developed in previous steps.


    We can start implementing the finer details outlined by our abstraction.


    In MMORPG games, a great example of an object that would ‘decorate’ characters
    are weapons. Hence, we can start creating weapons and other equipment classes
    that are recursively attached to a base character.


    We can also implement the method skill() to actually do something.  In our case,
    let’s have the skill() method attack a target.


    This Greatsword class is an extension of the Decoration class we’ve developed
    earlier. It has all the fields and methods of the Decoration Class, plus its own
    unique traits.


    class GreatSword : Decoration {


        // Weapon damage


        int damage = 3;


        // CONSTRUCTOR:


        // (use super() to implement this as its supertype)


        public GreatSword(Character c) : base(c){                        


        }


        // Common Procedure, implemented as GreatSword


        // (will be an Attack)


                  override public void skill(Character target) {


            // ATTACK TARGET:


            target.hp -= damage;               


            prevDeco.skill(target);


                  }


    }


    But why not have other weapons too? Let’s also design a Fiery Battle Axe. Like
    the GreatSword, it also has an attack as its skill() method.


    class FieryBattleAxe : Decoration {


        // Weapon damage


        int damage = 2;


        int magicPower = 2;


        // CONSTRUCTOR:


        // (use super() to implement this as its supertype)


        public FieryBattleAxe(Character c) : base(c){


        }


        // Common Procedure, implemented as FieryBattleAxe


        // (will be an Attack)


                  override public void skill(Character target) {


            // ATTACK TARGET:       


            target.hp -= damage + magicPower;               


            prevDeco.skill(target);


