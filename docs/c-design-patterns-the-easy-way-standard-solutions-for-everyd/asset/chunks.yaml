    The next few steps give key functionality to the Decorator class


    4) Make sure the decoration subclass contains the previous decoration or the 
    default class as one of its fields


    Within your Decoration class, create a field that uses the abstraction as the
    data type. It’ll also help if you give the field a reasonable, relevant name.
    In our case, our abstraction is the abstract class Character:


    class Decoration : Character {


        public Character prevDeco;              // (NEW LINE)


                  // Common Procedure, implemented as Decoration


                  override public void skill(Character target) {


            // (Implementation done by Subclasses)


