    }


    Clearly, this is still a very complex system even though we only have a handful
    of its components.


    But let’s say we’ve been given the task to coordinate these components for a couple
    of important tasks: starting the main engine and activating the warp drive. We
    clearly have to simplify these tasks under a common handle.


    Hence, we apply the Facade pattern.


    Identify the Major Procedures


    Given the handful of classes from earlier, our task is to implement the following
    procedures:


    - starting the main engine


    - activating the warp drive


    We then select an approach for implementing the Facade pattern. For now we’ll
    apply it as one encompassing Facade wrapper class.


    1) Create the general “Facade” class….


    We start by creating the Facade Wrapper class, as seen below:


        class Facade {  


        }


