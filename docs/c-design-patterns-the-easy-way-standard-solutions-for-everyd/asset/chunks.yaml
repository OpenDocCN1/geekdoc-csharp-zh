                  // and procedures as you wish)              


    } 


    To initialize this new field, it will be handled by the Constructor for the Decorator
    class. This is done in the next step.


    5) Make sure the constructor for the decoration subclass inputs either a Decoration
    or the Base Object. Set this input as the previous decoration.


    The input for the custom constructor will be the abstraction, just like the field
    created earlier. In our case, the input will be an instance of the Character class
    (which allows either other decorations or the default class as inputs).


    Also, we’ll set the field that we’ve created from the previous step to the input
