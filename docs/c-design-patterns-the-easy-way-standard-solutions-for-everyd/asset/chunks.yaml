  raw: 'Let’s call it interface ‘BallMaker’. Then, for each type of ball we have,
    create a subclass extending ‘BallMaker’. These subclasses are the ones actually
    creating the ball data objects - but each of them has their own specifications.
    So a BasketBallMaker subclass would make basketballs and a FootballMaker subclass
