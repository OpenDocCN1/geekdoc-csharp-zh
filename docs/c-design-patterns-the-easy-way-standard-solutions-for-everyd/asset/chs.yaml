  \ 2\n* 学习面向对象的最简单方法\n* 感谢！\n\n# C# 简介\n========================= ======\n`C#`（读作\
  \ C-sharp）是一种专门为微软软件开发开发的编程语言。与主要的编程语言一样，许多 `C#` 代码、特性和其他功能都是基于 `C` 编程语言的。`C#` 相比\
  \ `C` 的关键改进可能是当今使用最广泛且最重要的编程范式之一——面向对象编程。\n\n面向对象的程序员程序员在软件开发过程中会遇到许多重复的挑战。重要的是，这些挑战以前已经被遇到过并解决过。\n\
  \n如果你知道自己必须创建某些东西怎么办？重要的是，这些挑战以前已经被遇到过并解决过。\n\n如果你知道自己必须创建某些东西怎么办？重要的是，这些挑战以前已经被遇到过并解决过。\n\
  \n如果你知道自己必须创建某些东西怎么办？重要的是，这些挑战以前已经被遇到过并解决过。\n\n在整本书中，你将发现可以帮助你应用设计的工作坊。\n\n=========================\
  \ ======\nC#-00: 关于 C# 代码的快速重要说明\n一个 C# 文件\n在我们开始之前，请确保熟悉下面虚线之间所示的 C# 类的结构。\n\n\
  ```csharp\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
  using System.Text.RegularExpressions;\n\n// 添加更多库\n\nnamespace ___ {\n    // 在此处添加类\n\
  \    public class Program {\n        public static void Main(string[] args) {\n\
  \            // 在此处添加主代码\n        }\n    }\n}\n```\n\n第 1 章：工厂模式\n==== ==== ====\
  \ ==== ====\n你是否不确定在何时创建何种数据对象？\n\n在创建数据对象时，是否有很多方面需要考虑？\n\n那么你需要使用`工厂方法`。\n\n其基本原理是：\n\
  取决于你所使用的编程语言，创建一个标准的数据对象创建类接口。然而，你将使用子类（扩展或实现你的高级“工厂”接口）来实际创建数据对象。子类为创建数据对象提供了广泛的灵活性。如果你的编程语言没有接口或抽象类，只需将你的“工厂”接口创建为类，然后让子类扩展它即可。\n\
  \n例如，考虑需要制作各种运动球数据对象，如篮球、足球、橄榄球、排球等。你不知道在特定时间应该创建什么。那么你该如何编写代码？创建一个概述球类对象构建的接口。\n\
  \n\n\n\n我们将接口命名为 `BallMaker`。然后，对于我们拥有的每种类型的球，创建一个扩展 `BallMaker` 的子类。这些子类是实际创建球数据对象的类——但它们每一个都有自己的规范。因此，`BasketBallMaker`\
  \ 子类将制造篮球，而 `FootballMaker` 子类将制造足球。\n\n以下是 UML 图的的样式：\n\n![](img/Image00003.jpg)\n\
  \n该模式的伪代码实现也包含在归档中。如果你需要在另一种语言中实现此模式，伪代码应该可以为你提供帮助。\n\n接下来，我们将使用工厂模式。\n\n# C#-1a:\
  \ 工厂模式（在 C# 中实现）\n\n以下是工厂模式在 C# 中的外观形式：\n\n```csharp\n// Factory 由任何需要使用它的子类实现\n\
  \ninterface Factory {\n    // 输入：你的选择\n    // 输出：你的选择（默认设置为 Void）\n    // 实现此接口的类的构造函数\n\
  \    void createObject();\n}\n\n// SubFactory1:\n// 根据 Factory 接口创建不同的对象\nclass\
  \ SubFactory1 : Factory {\n    // 此方法实现了接口中概述的相同函数\n    void Factory.createObject()\
  \ {\n        // 为此创建器类包含任何独特的区别\n        // 此处的其他代码\n    }\n}\n\n// SubFactory2:\n\
  // 根据 Factory 接口创建不同的对象\nclass SubFactory2 : Factory {\n    // 此方法实现了接口中概述的相同函数\n\
  \    void Factory.createObject() {\n        // 为此创建器类包含任何独特的区别\n        // 此处的其他代码\n\
  \    }\n}\n```\n\n在下一章中，我们将对实现此设计模式进行详细演示。\n\n## C#-1b: 实现工厂模式\n\n使用你选择的 IDE 运行以下代码。在线\
  \ IDE，如 [codechef.com](http://codechef.com) , [rextester.com](http://rextester.com)\
  \ , [ideone.com](http://ideone.com) 或 [codpad.org](http://codpad.org) 都是很好的选择。\n\
  \n现在我们将看到工厂模式的运行。你将通过一个示例亲眼看到如何使用此设计模式，并通过一个你继续完成该示例的工作坊。\n\n### 运动球创建器\n\n想象你必须为一个按需定制的\
  \ Web 应用编写代码。它专门用于创建许多不同类型的运动球。\n\n一个通用的球类如下所示：\n\n```csharp\n// 一个运动球具有：\n// -\
  \ 球的类型\n// - 用于制造它的材料数组\n// - 它的尺寸，以半径（英寸）表示\n// - 任何额外的注释\n// - 制造它的公司品牌\n// -\
  \ 产品名称\nclass SportsBall {\n    public String type;\n    public String[] materialsUsed;\n\
  \    public float radius;\n    public String comments;\n    public String make;\n\
  \    public String modelName;\n}\n```\n\n然而，正如你所看到的，在为运动球创建数据对象时涉及到太多的细节。因此，如果你必须创建一个（例如）某个特定的篮球，这个过程与创建一个足球要不同得多。它们具有不同的类型、材料和尺寸。它们还可能由不同的品牌制造，并且具有不同的特征。\n\
  \n那么，我们该如何以更简单的方式创建运动球呢？涉及的代码也更少？你猜对了。工厂模式！因此在本教程中，让我们通过设置该设计模式的步骤。然后，你将有机会通过扩展工作来练习你所学的内容。\n\
  \n### 第一步：工厂接口\n\n首先，我们将创建一个所有创建球的工厂类都将实现的 `Interface（接口）。目前，它将只有一个方法：返回运动球的实例。\n\
  \n```csharp\n// BallFactory 接口：\n// 关于如何创建球的接口\ninterface BallFactory {\n    /*\n\
  \    // 输入：无\n    // 输出：一个 Ball 对象\n    // 效果：创建一个运动球；\n    // 实现此接口的类将在制造方面有自己的区别\n\
  \    */\n    SportsBall createBall();\n}\n```\n\n### 第二步：第一个类\n\n接下来，我们创建一个实现我们做的\
  \ `BallFactory` 接口的独特工厂类。目前，它做的只是创建篮球。这些可能是 `SportsBall` 对象的实例，但它们将具有篮球的特征。\n\n\
  ```csharp\n// 篮球制造器：\n// 创建具有不同字段的篮球对象\nclass BasketballMaker : BallFactory {\n\
  \    // (方法实现了接口版本)\n    // 效果：创建一个篮球类的运动球\n    SportsBall BallFactory.createBall()\
  \ {\n        SportsBall b = new SportsBall();\n        b.type = \"Basketball\";\n\
  \        b.materialsUsed = new String[3];\n        b.materialsUsed[0] = \"rubber\"\
  ;\n        b.materialsUsed[1] = \"fiber\";\n        b.materialsUsed[2] = \"synthetic\
  \ composite\";\n        b.radius = 4.8f;\n        b.make = \"Spalding\";\n     \
  \   b.modelName = \"Series Basketball\";\n        return b;\n    }\n}\n```\n\n###\
  \ 第三步：设计任何额外的工厂类\n\n之后，我们根据需要创建尽可能多的工厂类。它们都实现 `BallFactory` 接口，并且它们都创建具有不同特征和属性的运动球对象。让我们设计一个创建棒球的工厂类来实现。\n\
  \n```csharp\n// 棒球制造器：\n// 创建具有不同字段的棒球对象\nclass BaseballMaker : BallFactory {\n\
  \    // (方法实现了接口版本)\n    // 效果：创建一个篮球类的运动球（注：原文此处应为棒球）\n    SportsBall BallFactory.createBall()\
  \ {\n        SportsBall b = new SportsBall();\n        b.type = \"Baseball\";\n\
  \        b.materialsUsed = new String[6];\n        b.materialsUsed[0] = \"cork\"\
  ;\n        b.materialsUsed[1] = \"wool\";\n        b.materialsUsed[2] = \"poly/cotton\"\
  ;\n        b.materialsUsed[3] = \"cowhide\";\n        b.materialsUsed[4] = \"yarn\"\
  ;\n        b.materialsUsed[5] = \"composite rubber\";\n        b.radius = 1.45f;\n\
  \        b.make = \"Rawlings\";\n        b.modelName = \"MLB Official Baseball\"\
  ;\n        return b;\n    }\n}\n```\n\n### 第四步：运行代码\n\n现在你已经设计了工厂类，是时候运行它们了。在你的\
  \ `Main` 函数（具有 `public-static-void-main` 方法的主类）或你任何想要运行代码的方式中，为你设计的每个工厂类创建一个实例。你将调用这些工厂来为你创建特定的对象。\n\
  \n在我们的示例中，我们创建了篮球和棒球工厂。我们将使用它们分别创建篮球和棒球对象。\n\n```csharp\n// 创建工厂\nBallFactory f1\
  \ = new BasketballMaker();\nBallFactory f2 = new BaseballMaker();\n\n// 创建一个篮球对象：\n\
  // 使用篮球工厂制造篮球\nSportsBall bb1 = f1.createBall();\n\n// 创建一个棒球对象：\n// 使用棒球工厂制造棒球\n\
  SportsBall bb2 = f2.createBall();\n\n// 测试：\n// 这行应该打印出 \"Basketball\"\nConsole.WriteLine(bb1.type);\n\
  // 这行应该打印出 \"Baseball\"\nConsole.WriteLine(bb2.type);\n```\n\n## C#-工作坊 1:\n\n使用你选择的\
  \ IDE 运行以下代码。在线 IDE，如 [codechef.com](http://codechef.com) , [rextester.com](http://rextester.com)\
  \ , [ideone.com](http://ideone.com) 或 [codpad.org](http://codpad.org) 都是很好的选择。\n\
  \n## 足球与排球\n\n现在轮你玩工厂模式了。通过创建两个工厂类来展示你所学的内容。其中一个将创建足球，另一个将创建排球。\n\n\n\n\n\n随后，编写并运行几行代码，创建每个工厂的实例，并为每个工厂至少创建一个球。\n\
  \n这里是一些可以帮助你起手的代码：\n\n```java\n// 足球制造器：\n// - 创建具有不同字段的足球类对象\nclass SoccerballMaker\
  \ : BallFactory {\n    // (方法实现了接口版本)\n    // 效果：创建一个作为足球的运动球\n    SportsBall BallFactory.createBall()\
  \ {\n        SportsBall b = new SportsBall();\n        // 修改对象字段；\n        // 它们应该都像足球的样子和特征一样..\n\
  \        return b;\n    }\n}\n\n// 排球球制造器：\n// - 创建具有不同字段的排球类对象\nclass VolleyballMaker\
  \ : BallFactory {\n    // (方法实现了接口版本)\n    // 效果：创建一个作为排球的运动球\n    public SportsBall\
  \ createBall() {\n        SportsBall b = new SportsBall();\n        // 修改对象字段；\n\
  \        // 它们应该都像排球的样子和特征一样..\n        return b;\n    }\n}\n```\n\n### 高级编码\n注意所有的运动球仍然是同一种类型的对象——运动球。你将如何修改代码，以便每个工厂类都能创建它们应该创建的球对象？例如，你如何让\
  \ `BasketballMaker` 创建 `Basketball` 对象，而不是通用的、修改过的 `Sports Balls`？或者让 `BaseballMaker`\
  \ 创建 `Baseball` 对象？\n\n# 第 2 章：组合模式\n\n想象这样一个场景：你必须以层次分明的方式组织你的数据。它们在某种程度上类似于“文件”和“文件夹”。正如你和其他计算机用户所知的，文件存放在文件夹中，文件夹也可以放在其他文件夹中。你还希望以一种不产生必要的代码的方式来实现。那么你需要什么呢？组合模式。\n\
  \n## 它的基本工作原理：\n你有两个不同的类：一个 `File` 类和一个 `Folder` 类。或者是 `Item` 和 `Group`。`Clothing`\
  \ 和 `Bag`。`Toys` 和 `Box`。任何两个类的组合，其中其中一个类是由这两种类型组成的集合。\n\n然而，这两个类可能拥有太多相似的特征、方法和字段。你意识到你可能需要编写比通常多一倍的代码——一个用于项目，一个用于分组。\n\
  \n解决方案是让它们继承一个公共的超类或抽象类——`component`（组件）。这包含一个关键区别：`Group` 类包含该超类的集合。因为两个类都继承自同一个公共超类，所以\
  \ `Group` 类可以拥有项目或分组的集合。\n\n例如，假设你有两个类：`Clothing` 和 `Bag`。一个 `Bag` 可以同时包含衣服和其他包。它们共享相似的特征，如名称、描述等。你意识到，编写分开的代码是多么低效，因为它们实际上应该在同一个代码下（例如，当获取所有名称时，需要分别调用\
  \ `Clothing.getName()` 和 `Bag.getName()`）。\n\n因此，你应用了组合模式。`Clothing` 和 `Bag` 类都继承一个新的超类\
  \ `Item`。`Bag` 类被修改为拥有一个 `Items` 集合（可以是 `Bags` 或 `Clothing`）。\n\n这里的 UML 图看起来是这样的：\n\
  ![](img/Image00004.jpg)\n\n这里要记住的主要点是，项目/容器类继承一个公共超类——组件。容器类将有一个包含组件的列表，这些组件可以是文件也可以是文件夹。\n\
  \n取决于你所使用的编程语言，超类也可能是抽象类、接口或你的编程语言自带的任何类型的抽象。该模式的伪代码实现也包含在存档中。如果你需要在另一种语言中实现此模式，伪代码将对你有所帮助。\n\
  \n接下来，让我们把组合模式用起来。\n\n## C#-2a：C# 中的组合模式\n\n以下是组合模式在 C# 中的样子：\n\n```csharp\n/*\n\
  // Component 是 File 和 Folder 类继承的超类\n// 你可以定义任何两个子类共享的字段和方法\n*/\nabstract class\
  \ Component {\n    // 根据需要插入任意数量的字段和方法\n    String someField;\n    void someMethod()\
  \ {};\n}\n\n// 通用项目类（作为 File）：\n// 包含了在 Component 中定义的所有字段和方法\nclass File: Component\
  \ {}\n\n// 通用分组类（作为 Folder）：\n// 包含了在 Component 中定义的所有字段和方法\n// 还有：\n// -一个 Components\
  \ 列表\nclass Folder : Component {\n    List<Component> contents = new List<Component>();\n\
  }\n```\n\n## C#-2b：实现模式\n在下一章中，我们将进行演练。\n\n#### 步骤 1：组件超类\n首先，我们将创建 `File` 和 `Folder`\
  \ 类所基于的超类。我们正在使用 C# 编写，所以可以使用抽象类。现在，让我们给超类添加以下字段：名称、创建日期和修改日期。\n\n```csharp\n/*\n\
  // Component 是 File 和 Folder 类继承的超类\n// 它具有：\n// Name，类型为字符串\n// - 创建日期\n// - 修改日期\n\
  // 它可以：\n// 重命名自己\n// - 更新修改日期\n*/\nabstract class Component {\n    String name;\n\
  \    DateTime dateCreated;\n    DateTime dateModified;\n}\n```\n\n#### 步骤 2：自定义组件构造函数\n\
  接下来，我们将为 `Component` 编写一个修改后的构造函数。当创建一个新组件时，它的名称将被设置，日期字段将设置为当前日期。以后继承此超类的 File\
  \ 和 Folder 将最终使用相同的构造函数。\n\n```csharp\nabstract class Component {\n    public String\
  \ name;\n    public DateTime dateCreated;\n    public DateTime dateModified;\n\n\
  \    /*\n    // 输入：一个字符串\n    // Component 类的自定义构造函数，\n    // 创建时，创建日期和最后修改日期\n\
  \    //将被设置为创建对象的当前日期\n    */\n    public Component(String n) {\n        this.name\
  \ = n;\n        this.dateCreated = new DateTime();\n        this.dateModified =\
  \ new DateTime();\n    }\n}\n```\n\n在这里，你亲眼看到了共享方法如何为程序员节省大量代码行，并在此过程中防止更多的编码错误。`File`\
  \ 和 `Folder` 类之间的任何基本字段和方法都存在——程序员将不必忍受编写两倍所需代码，也不需要多次更改某些字段和方法。此外，系统的其余部分处理这两个类的数据对象的方式非常相似。\n\
  \n#### 步骤 3：创建 File 类\n现在我们创建 `File` 类。\n\n\n\n\n\n### 简介\n如前所述，`File` 类将拥有与 `Folder`\
  \ 类相同的字段和方法。它甚至有一个非常相似的构造方法。\n\n然而，这里的 `File` 类将具有更具区分性的字段。它将包含文件类型的指示（例如电子表格、字母文档、幻灯片、图片、视频、PDF\
  \ 等）。构造方法经过进一步修改以包含此内容。\n\n```csharp\n/*\n// 通用项目类（即 File）：\n// 包含在 Component 中定义的所有字段和方法\n\
