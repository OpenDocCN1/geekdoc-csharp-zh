  \    t.addObs(m5);      \n    // Create all locations\n    String[] locs = new String[10];\n\
  \    locs[0] = \"Los Angeles\";\n    locs[1] = \"Chicago\";\n    locs[2] = \"New\
  \ York\";\n    locs[3] = \"Seattle\";\n    locs[4] = \"Cleveland\";\n    locs[5]\
  \ = \"Boston\";\n    locs[6] = \"San Francisco\";\n    locs[7] = \"Miami\";\n  \
  \  locs[8] = \"St. Louis\";\n    locs[9] = \"Dallas\";    \n    // Part 3: Set Observers\
  \ to their locations\n    m1.location = locs[1];\n    m2.location = locs[4];\n \
  \   m3.location = locs[5];\n    m4.location = locs[9];\n    m5.location = locs[5];\n\
  \    // As the Terrorist relocates all over the US,\n    // it will notify all Device\
  \ Modules of its location.\n    // Modules will trigger when a Terrorist is nearby.\n\
  \    for(int i = 0; i < 10; i++) {\n        t1.location = locs[i];\n        t1.notifyObservers();\n\
  \    }\n```\n\n\n\n\n\n`Singleton` 类包含三个关键组件。首先，类的构造函数被设置为某种特定方式，使其无法在类外部使用。这确保了通过移除在类代码之外创建实例的能力，使单例类保持为单例。\n\
  \n其次，类本身将包含一个基于该类的唯一实例。单例类将它的唯一对象作为其自身的字段之一。\n\n最后，第三个组件是获取实际唯一对象的方法。该方法必须在不需要创建类对象的情况下即可访问。在大多数实现中，它会使用第一个组件（仅限类代码的构造函数）在对象尚不存在时创建该对象。\n\
  \n以下是描述 `Singleton` 类的 UML 图：\n\n![](img/Image00006.jpg)\n\n存档中还包含了该模式的伪代码实现，以备你需要在用另一种语言实现此模式。\n\
  \n接下，我们将在一个场景中应用单例模式。\n\n## C#-4a：C# 中的单例模式\n\n以下是单例模式在 C# 中的外观。\n\n```csharp\n\
  /*\n// 一个单例类拥有：\n// - 一个单例实例 (Singleton Instance)\n// - 你需要的任何其他字段 (Fields)\n//\n\
  // 它不能：\n// - 像普通类一样被实例化（就像它是普通类一样）\n// （构造函数设置为私有 Private，以确保万无一失）\n//\n// 它可以：\n\
  // - 返回唯一的类实例\n*/\nclass Singleton {\n    // 单例组件 #1:\n    // 构造函数 (CONSTRUCTOR):\n\
  \    // - 设置为私有 PRIVATE；无法在类外部访问\n    private Singleton() { }\n\n    // 单例组件 #2:\n\
  \    // 唯一的单例对象 (The Only Singleton Object):\n    // - 设置为私有 PRIVATE；无法在类外部访问\n\
  \    private static Singleton obj = null;\n\n    // 单例组件 #3:\n    // 输入 (INPUT)：(你的选择)\n\
  \    // 输出 (OUTPUT)：一个单例对象\n    // 效果 (EFFECT)：返回唯一的单例对象。\n    // 如果不存在则创建一个。\n\
  \    // - 设置为静态 STATIC；调用此方法不需要对象\n    public static Singleton getObject() {\n \
  \       if (obj == null) {\n            obj = new Singleton();\n            // 在此处初始化任何其他字段\n\
  \        }\n        return obj;\n    }\n}\n```\n\n要访问你的单例对象，只需调用静态方法 `getObject()`。注意，在任何调用该方法的地方，都期望得到单例对象。\n\
  \n将单例赋值给变量 `sg`\n`Singleton sg = Singleton.getObject();`\n\n另外注意，你可以将同一个单例赋值给多个变量；它们将指向同一个单例。\n\
  \n将单例赋值给多个变量\n`Singleton sg1 = Singleton.getObject();`\n`Singleton sg2 = Singleton.getObject();`\n\
  `Singleton sg3 = Singleton.getObject();`\n\n## C#-4b：实现单例模式\n\n使用你选择的 IDE 运行下面的代码。在线\
  \ IDE 如 [codechef.com](http://codechef.com)、[rextester.com](http://rextester.com)、[ideone.com](http://ideone.com)\
  \ 或 [codpad.org](http://codpad.org) 都是很好的选择。\n\n在本章中，我们将遇到一个非常适合单例模式实现的情况。\n\n###\
  \ 锦标赛 (Championship)\n\n想一下任何体育联赛。在一个特定的赛季内，联赛中的每个球队都会与联赛内的其他球队进行一系列比赛。赛季结束时，该赛季表现最好的几支球队将获得单淘汰赛的资格。\n\
  \n在参加比赛的这些球队中，只有一支球队会夺得冠军。\n\n冠军。只有一个。\n\n如果你在编写这个程序，你会意识到，如果一个联赛在同一个赛季内出现了两个或多个决赛冠军球队，你的程序可能会遇到问题。因此，一个只能有一个特定组件的情况需要使用单例模式。\n\
  \n#### 第 1 步：识别 App 中的类和过程\n\n在这种情况下，我们将保持简单，目前只识别并定义两个类：一个运动队队（Sports Team）……\n\
  \n```csharp\n// 一个球队（Team）拥有：\n// - 一个名称 (String)\n// - 你想要的任何其他字段\nclass Team {\n\
  \    public String name;\n    // 构造函数 (CONSTRUCTOR):\n    // 输入：球队名称 (String)\n\
  \    public Team(String n) {\n        this.name = n;\n    }\n}\n```\n\n……以及锦标赛（Championship）。\n\
  \n```csharp\n// 一个锦标赛（Championship）拥有：\n// - 一支冠军球队 (Championship Team)\n//\n//\
  \ 它可以：\n// - 运行 8 支球队的季后赛\nclass Championship {\n    public Team champion;\n   \
  \ // 输入：8 支球队\n    // 输出：无\n    // 效果：季后赛：\n    // - 对球队进行配对\n    // - 获胜的球队晋级下一轮比赛\n\
  \    // - 最后剩下的球队成为冠军\n    // 注意：如果锦标赛已经有了冠军，\n    // playoffs() 将在不模拟季后赛的情况下返回\n\
  \    public void playoffs(Team t1, Team t2, Team t3, Team t4, Team t5, Team t6,\
  \ Team t7, Team t8) {\n        // 如果存在冠军球队则返回\n        if (champion != null) return;\n\
  \        Random r = new Random();\n        // 八分之一决赛 -> 半决赛:\n        Team semi1\
  \ = match(t1, t8, r.Next());\n        Team semi2 = match(t2, t7, r.Next());\n  \
  \      Team semi3 = match(t3, t6, r.Next());\n        Team semi4 = match(t4, t5,\
  \ r.Next());\n        Console.WriteLine(\"\");\n        // 半决赛 -> 决赛:\n        Team\
  \ finals1 = match(semi1, semi4, r.Next());\n        Team finals2 = match(semi2,\
  \ semi3, r.Next());\n        Console.WriteLine(\"\");\n        // 决赛 -> 锦标赛:\n \
  \       Team champ = match(finals1, finals2, r.Next());\n        this.champion =\
  \ champ;\n        Console.WriteLine(\"Team \" + chap.name + \" WIN THE CHAMPIONSHIP!\"\
  );\n    }\n\n    /*\n    // playoffs() 的辅助函数：\n    // 输入： - 两支球队：a & b\n    // \
  \        - 一个整数（用于决定胜负）\n    // 输出：一支球队\n    // 效果：两支球队 a & b 之间的比赛，\n    // 以获胜者作为输出\n\
  \    */\n    private Team match(Team ta, Team tb, int odds) {\n        if (odds\
  \ == 0) {\n            Console.WriteLine(ta.name + \" deats \" + tb.name);\n   \
  \         return ta;\n        } else {\n            Console.WriteLine(tb.name +\
  \ \" deats \" + ta.name);\n            return tb;\n        }\n    }\n\n    public\
  \ static void main() {\n        // 创建 8 支球队：\n        Team contender1 = new Team(\"\
  Archers\");\n        Team contender2 = new Team(\"Bobcats\");\n        Team contender3\
  \ = new Team(\"Centurions\");\n        Team contender4 = new Team(\"Danger Zone\"\
  );\n        Team contender5 = new Team(\"Energy\");\n        Team contender6 = new\
  \ Team(\"Flames\");\n        Team contender7 = new Team(\"Guards\");\n        Team\
  \ contender8 = new Team(\"Hunters\");\n\n        // 运行锦标赛：\n        Championship\
  \ c = new Championship();\n        c.playoffs(contender1, contender2, contender3,\
  \ contender4, contender5, contender6, contender7, contender8);\n    }\n}\n```\n\n\
  #### 第 2 步：识别哪个类应该是单例\n\n但有一个问题。我们希望每次运行代码时，只想要有一个冠军球队和一次季后赛。如果这几行代码在 `main()` 方法中运行……\n\
  \n\n\n\n\n```csharp\nChampionship[] cc = {new Championship(), new Championship(),\
  \ new Championship(), new Championship(),};\n\nforeach (Championship x in cc) {\n\
  \    x.playoffs(contender1, contender2, contender3, contender4, contender5, contender6,\
  \ contender7, contender8);\n    Console.WriteLine(\"\");               \n}\n```\n\
  `...` 将会有太多的冠军队伍。\n\n那么，我们可以做什么来限制代码只产生一个冠军队伍呢？\n\n将 `Championship` 类转换为单例（`Singleton`）模式。\n\
  \n我们通过通过向 `Singleton` 类中逐一添加组件来实现此点。除此之外，`Championship` 类的其他所有内容保持不变。\n\n### 组件\
  \ #1：私有类构造函数\n\n将 `Constructor` 设置为 `private` 可以确保该类的对象**无法**被创建 - 除非通过类内部的代码创建。\n\
  \n对于单例类，私有的 `constructor`（连同其他单例组件）确保了该对象将是一个 `singleton`。\n\n以下是经过修改后的 `Championship`\
  \ 构造函数及其解释性注释。请将此代码添加到 `Championship` 类内部：\n\n```csharp\n// Singleton Component\
  \ #1:\n// - 私有修饰符的构造函数\n// (无法从类外部访问)\nprivate Championship() {};\n```\n\n### 组件\
  \ #2：唯一的类对象你的你的 `Singleton` 类将包含一个专属字段，该字段将最终是由你的类构造唯一对象。\n\n它是一个 `private` 字段，因此不会在类外部被访问。它也是两个\
  \ `static` 单例组件之一 - 它们可以通过类本身进行访问，而不是通过它的对象。\n\n默认情况下，该字段将设置为 `null`。在当第三个组件被调用时，它最终会被赋值。\n\
  \n以下是类对象的字段。请将以下代码添加到 `Championship` 类内部：\n\n```csharp\n// Singleton Component #2:\n\
  // - 作为字段的类对象\n// - 有 Static 修饰符（可以从类本身访问字段）\n// - 有 private 修饰符（无法从类外部访问）\nprivate\
  \ static Championship c = null;\n```\n\n### 组件 #3：`getObject()` 方法\n\n`Championship`\
  \ 类的最后一个单例组件是 `getObject()` 方法。作为两个 `static` 组件之一，该方法旨在从 `Championship` 类访问，而不是从它的某个对象。\n\
  \n它的作用是获取代码中创建的唯一 `Championship` 对象。如果它尚未创建，它将调用 `Component #1`（自定义构造函数）来创建一个。\n\
  \n以下是该方法。只需将代码添加到 `Championship` 类内部：\n\n```csharp\n// Singleton Component #3\n\
  // - 一个 getObject() 方法 \n// 输入：无\n// 输出：一个 Championship 对象\n// 效果：返回单例 Championship\
  \ 对象\npublic static Championship getChamp() {\n    if (c == null) {\n        c =\
  \ new Championship();\n    }\n    return c;\n}\n```\n\n### 单例 Championship 类\n\n\
  总的来说，`Championship` 类的单例版本应该保持不变，只是你向其中添加了三个单例组件。\n\n### 主代码，现在使用了单例 Championship\n\
  \n现在，我们将在 `main()` 方法中运行这段代码：\n\n```csharp\n// 创建 8 支队伍：\nTeam contender1 = new\
  \ Team(\"Archers\");\nTeam contender2 = new Team(\"Bobcats\");\nTeam contender3\
  \ = new Team(\"Centurions\");\nTeam contender4 = new Team(\"Danger Zone\");\nTeam\
  \ contender5 = new Team(\"Energy\");\nTeam contender6 = new Team(\"Flames\");\n\
  Team contender7 = new Team(\"Guards\");\nTeam contender8 = new Team(\"Hunters\"\
  );\n\n// 使用单例：\nChampionship.getChamp().playoffs(contender1, contender2, contender3,\
  \ contender4, contender5, contender6, contender7, contender8);\n```\n\n\n\n\n\n\
  # C#-5b: 应用策略模式（简单版）\n\n使用你选择的 IDE 来运行以下代码。在线 IDE 比如 [codechef.com](http://codechef.com)、[rextester.com](http://rextester.com)、[ideone.com](http://ideone.com)\
  \ 或 [codpad.org](http://codpad.org) 都是很好的选择。\n\n在本章中，我们将有机会针对特定场景应用策略模式。让我们来玩剪刀石头布。为了获胜，我们始终要在石头、布和剪刀之间做出正确的选择。\n\
  \n游戏实例通常基于一个类，设计如下：\n\n```csharp\n// 一个剪刀石头布游戏：\n// - 石头、布、剪刀的 String 值\n// 它可以：\n\
  // - 从三个选项中随机生成一个字符串\n// - 检查玩家是否胜利\nclass RPSGame {\n    String[] RPSVals = {\"\
  Rock\", \"Paper\", \"Scissors\"};\n\n    /*\n    // INPUT: 无\n    // OUTPUT: 一个字符串\n\
  \    // EFFECT: 随机返回石头、布或剪刀\n    */\n    public String RPSGet() {\n        Random\
  \ rn = new Random();\n        int i = rn.Next(1, 4);\n        return RPSVals[i];\n\
  \    }\n\n    /*\n    // INPUT: 2 个字符串\n    // OUTPUT: 一个布尔值\n    // EFFECT: 如果第一个字符串胜过第二个字符串则返回\
  \ true，\n    // 否则返回 false\n    */\n    public bool checkWin(String s1, String s2)\
  \ {\n        if (s1 == s2) return false;\n        bool c1 = (s1 == \"Paper\") &&\
  \ (s2 == \"Rock\");\n        bool c2 = (s1 == \"Scissors\") && (s2 == \"Paper\"\
  );\n        bool c3 = (s1 == \"Rock\") && (s2 == \"Scissors\");\n        return\
  \ c1 || c2 || c3;\n    }\n}\n```\n\n接下来，是进入 `Main()` 方法执行的代码：\n\n```csharp\nRPSGame\
  \ r = new RPSGame();\nString aiPick = r.RPSGet();\n// 为变量 myPick 输入 \"Paper\"、\"\
  Scissors\" 或 \"Rock\"\n// （通常情况下，玩家会输入一个值）\n// 现在默认选择为 Paper\nString myPick = \"\
  Paper\";\nConsole.WriteLine(\"AI Pick: \" + aiPick);\nConsole.WriteLine(\"My Pick:\
  \ \" + myPick);\nConsole.WriteLine(myPick + \" v.s. \" + aiPick);\nif (r.checkWin(myPick,\
  \ aiPick)) Console.WriteLine(\"YOU WIN!\");\n```\n\n运行时，整段代码模拟了一局剪刀石头布游戏。你必须在石头、布或剪刀之间做出选择。之后，程序将为你的对手生成一个选择，然后检查你是否获胜。\n\
  \n幸运的是，你可以修改这段代码使其**始终**选择获胜选项。这样你就会获胜。这需要一个在当前情况下给出最佳结果的程序。这就需要策略模式了。\n\n## 应用策略模式\n\
  \n回想之前提到的实现策略模式的逐步阶段计划：\n\n### 1) 确定你的流程何时需要根据情况发生变化。在我们的剪刀石头布代码中，我们希望代码能够根据人类玩家的选择始终选择最佳选项。这一事件在玩家做出选择时就会发生。因此，代码将始终选择击败玩家的选项。\n\
  \n- 玩家选石头 -> 代码选布\n- 玩家选布 -> 代码选剪刀\n- 玩家选剪刀 -> 代码选石头\n\n### 2) 创建你策略算法的抽象形式\n\n\
  回想 `AbstractStrategy` 类的接口。在 Java 中，可以使用接口来实现这种抽象：\n\n```java\n// 抽象策略实现：\n// 包含：\n\
  // - 抽象算法的签名\ninterface AbstractStrategy {\n    // 输入: (你的选择)\n    // 输出: (你的选择)\n\
  \    // (效果取决于子类级别)\n    void Algorithm();\n}\n```\n\n根据先前的代码，我们可以创建剪刀石头布策略算法的抽象版本。该算法可以以\
  \ `String` 的形式返回一个供选择的。\n\n```java\n// 抽象策略实现：\ninterface RPSStrategy {\n    //\
  \ 输入: 无\n    // 输出: 一个字符串（三个选择之一）\n    // (效果取决于子类级别)\n    String Algorithm();\n\
  }\n```\n\n### 3) 在子类中实现你策略算法的变体。\n\n这里是上一章节中的策略变体子类：\n\n```java\nclass Strategy1\
  \ : AbstractStrategy{\n    // 抽象算法，作为 Strategy1:\n    void AbstractStrategy.Algorithm()\
  \ {\n        // 根据这个 Strategy1 类唯一地实现此算法\n    }\n}\n```\n\n我们为石头、布和剪刀分别创建一个类。每个类在其\
  \ `Algorithm` 实现中都有不同的输出。我们首先从石头开始：\n\n**石头的子类实现：**\n```csharp\nclass Rock : RPSStrategy\
  \ {\n    // 抽象算法，作为 Rock:\n    void RPSStrategy.Algorithm() {\n        // (此处可以是任何代码)\n\
  \        return \"Rock\";\n    }\n}\n```\n\n之后，我们继续实现其他选项：\n\n**布的子类实现：**\n```csharp\n\
  class Paper : RPSStrategy {\n    // 抽象算法，作为 Rock:\n    void RPSStrategy.Algorithm()\
  \ {\n        // (此处可以是任何代码)\n        return \"Paper\";\n    }\n}\n```\n\n**剪刀的子类实现：**\n\
  ```csharp\nclass Scissors : RPSStrategy{\n    // 抽象算法，作为 Rock:\n    void RPSStrategy.Algorithm()\
  \ {\n        // (此处可以是任何代码)\n        return \"Scissors\";\n    }\n}\n```\n\n###\
  \ 4) 任何访问你策略算法的操作都通过抽象形式进行\n\n这里是 `main()` 中的原始剪刀石头布代码：\n\n```csharp\nRPSGame r\
  \ = new RPSGame();\nString aiPick = r.RPSGet();\n// 为变量 myPick 输入 \"Paper\"、\"Scissors\"\
  \ 或 \"Rock\"\n// （通常情况下，玩家会输入一个值）\n// 现在默认选择为 Paper\nString myPick = \"Paper\";\n\
  Console.WriteLine(\"AI Pick: \" + aiPick);\nConsole.WriteLine(\"My Pick: \" + myPick);\n\
  Console.WriteLine(myPick + \" v.s. \" + aiPick);\nif (r.checkWin(myPick, aiPick))\
  \ Console.WriteLine(\"YOU WIN!\");\n```\n\n现在我们可以使用策略模式简单实现来实现修改代码，使其**始终**选择获胜选项。变量\
  \ `myPick` 将是获胜的选择。首先，我们将升级 `main()` 内部的代码，在初始化变量 `myPick` 之后添加我们策略类的实例：\n\n```csharp\n\
  RPSGame r = new RPSGame();\nString aiPick = r.RPSGet();\nString myPick = \"\";\n\
  // - - - - - - - - -\n```\n\n\n\n\n\n```cs\n// (Initialize the Pattern to any pick\
  \ you want;\n// it might be replaced anyway)\nRPSStrategy stratPattern = new Rock();\n\
  // - - - - - - - - - -\n```\n\n通过多态（Polymorphism），可以根据情况选择最佳策略变体。\n\n接下来，我们添加修改策略模式以产生胜利选择的代码。这些代码位于我们添加策略模式实例之后的行：\n\
  \n```cs\n// - - - - - - - - - -\n// (Initialize the Pattern to any pick you want;\n\
  // it might be replaced anyway)\nRPSStrategy stratPattern = new Rock();\nif (aiPick\
  \ == \"Rock\") {\n    stratPattern = new Paper();\n}\nif (aiPick == \"Paper\") {\n\
  \    stratPattern = new Scissors();\n}\nif (aiPick == \"Scissors\") {\n    stratPattern\
  \ = new Rock();\n}\n// - - - - - - - - - -\n```\n\n最后，变量 `myPick` 将是策略模式中的获胜选择。对\
  \ `stratPattern` 调用 `Algorithm()`，无论在三个 `if` 语句之后它呈现了何种形式，都将返回一个胜利选择。\n\n```cs\n\
  // - - - - - - - - - - -\n// (Initialize the Pattern to any pick you want;\n// it\
  \ might be replaced anyway)\nRPSStrategy stratPattern = new Rock();\nif (aiPick\
  \ == \"Rock\") {\n    stratPattern = new Paper();\n}\nif (aiPick == \"Paper\") {\n\
  \    stratPattern = new Scissors();\n}\nif (aiPick == \"Scissors\") {\n    stratPattern\
  \ = new Rock();\n}\n// NEW LINE:\nmyPick = stratPattern.Algorithm();\n// - - - -\
  \ - - - - - -\n```\n\n这里是新修改后的原始代码。在运行剩余代码后，你应该总是赢的。\n\n```cs\nConsole.WriteLine(\"\
  AI Pick: \" + aiPick);\nConsole.WriteLine(\"My Pick: \" + myPick); \nConsole.WriteLine(myPick\
  \ + \" v.s. \" + aiPick);\nif (r.checkWin(myPick, aiPick)) Console.WriteLine(\"\
  YOU WIN!\");\n```\n\n就是这样。这就是应用策略模式的过程。\n\n***\n\n嘿，让我们先放下内容。坐下来休息一下，消化你目前读到的所有信息。如果你还没有跟上代码进度，甚至还没有开始，请随意现在开始。\n\
