  }\n\n…\n\nclass StrategyN, extension of AbstractStrategy{\n}\n```\n\n\n\n\n# 抽象算法，作为\
  \ StrategyN：\n\n```\nAlgorithm() {\n    ( 在此处唯一实现此算法 )\n}\n```\n\n# 存档 A6：装饰器模式实现\n\
  \n使用下面的伪代码在你选择的编程语言中实现装饰器模式。\n\n## 装饰器实现：\n\n此抽象形式具有：\n- 任何通用过程的签名，\n- 所有子类共有的算法和特征\n\
  \n```text\nabstract class DecorativeObject {\n    输入 且 输出: (由你选择)\n    (由子类实现)\n\
  \    procedure()\n    (任何其他通用字段和过程)\n}\n\nclass BaseObject, extension of DecorativeObject\
  \ {\n    通用过程，作为 Base Object 实现:\n    procedure() {\n        (在此处实现此过程)\n    }\n\
  \    (任何其他通用字段和过程)\n}\n\nclass Decoration, extension of DecorativeObject{\n    添加之前应用的装饰器实例：\
  \ \n    - DecorativeObject prevDeco;           \n    ( 作为 Decoration 实现的通用过程\n \
  \     包括此装饰器添加的任何额外效果 )\n    procedure() {\n        (在此处实现此过程，\n        同时也添加你想要的任何内容)\n\
  \        prevDeco’s procedure()\n    }\n    构造函数:\n    Decoration(DecorativeObject\
  \ d) {\n        this.prevDeco = d;      \n    } \n    (任何其他通用字段和过程)\n}\n\nclass\
  \ DecorationOne, extension of Decoration{\n    ( 作为 DecorationOne 实现通用过程 )\n   \
  \ (也作为父类实现 procedure() )\n    procedure() {\n        Superclass’s procedure();\n\
  \        (在此处实现此过程)\n    }\n    (任何其他通用字段和过程)\n    (与父类 Decoration 相同的构造函数) \n}\n\
  \nclass DecorationX, extension of Decoration{\n    ( 作为 DecorationX 实现通用过程 )\n \
  \   (也作为父类实现 procedure() )\n    procedure() {\n        Superclass’s procedure();\n\
  \        (在此处实现此过程)\n    }\n    (任何其他通用字段和过程)\n    (与父类 Decoration 相同的构造函数) \n}\n\
  ```\n\n# 存档 A7：状态模式实现\n\n使用下面的伪代码在你选择的编程语言中实现状态模式。\n\n`Handler` 类具有：\n- 当前状态：一个转换状态类的实例\n\
