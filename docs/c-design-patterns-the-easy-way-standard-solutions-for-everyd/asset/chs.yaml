  \    }\n}\n\n// 下一个是主题对，包括类和接口。\n// 所有主题类都实现 Subject 抽象\n// 它能：\n// - 通知\n// - 移除观察者\n\
  // 主题也需要一个 Subjects 列表\nclass Subject {\n    // 它：\n    // - update\n    // - update\n\
  \n    public delete)(    )\n}\n```\n\n# 存档 A4：单例模式实现\n\n使用下方的伪代码在你任选择的编程语言中实现单例模式。\n\
  \n```java\n// 单例具有：\n// - 一个单例实例\n// - 你需要的任何字段\n\n// 它不能：\n// 像正常一样实例化\n// （构造函数被设置为私有）\n\
  \n// 它能：\n// 返回唯一的单例实例\n// 如果不存在则创建一个。\n// - 设置为静态；调用此方法不需要对象。\nclass Singleton\
  \ {\n    // 单例对象：\n    // - 默认置为 null\n    private static object = null\n\n    public\
  \ static synchronized getObject() {\n        if (object == null) {\n           \
  \ object = new Singleton()\n            // 在此处初始化任何字段\n        }\n        return\
  \ object\n    }\n}\n```\n\n# 存档 A5：策略模式实现\n\n使用下方的伪代码在你任选择的编程语言中实现策略模式。\n\n```java\n\
  // 抽象策略实现：\n// 它具有：\n// - 抽象算法的签名\nAbstractStrategy {\n    IN: (自选)\n    OUT: (自选)\n\
