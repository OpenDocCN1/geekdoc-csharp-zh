    14.  Containing class is the class that the object was defined.


    15.  Derived class is any class that inherits another


    16.  Containing Assembly is anywhere inside the current .exe or .dll file


    17.  Outside Assembly is any other area that exists


    This means you can control the access to variables. But what if a variable is
    marked as private, what if it needs to be accessed externally? You used “getters”
    and “setters”, methods that are specifically designed to retrieve and alter variables.
    These are a wonderful practise to keep code safe and secure, so let’s alter our
    shape class to make it more secure.


    Before we could do this:


    Shape s = Shape(10,10);


    s.length = -1;


    This is undesirable as it invalid information, you cannot have a negative length,
    this is where a setter comes into use, the function can contain code to validate
    (check) the value that is attempting to be placed in the length variable, something
    like this:


    void setLength(double  value)


