    \ This is done like so:\n\n FILE* ptr;\n\nOpening a file\n\nIf this file already\
    \ exists you can open it and read it’s contents, this would be done by using:\n\
    \nptr = fopen(char* filename, char* mode)\n\nWhere:\n\n      filename = to the\
