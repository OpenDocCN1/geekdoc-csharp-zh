    \ 和 `puts()`\n9. 大小与其最大的变量相同\n7. 传递给函数的变量\n8. 参数列表末尾的省略号\n9. 用点符号 `.` 定义的成员运算符\n\
    10. `size_t` 大小\n\n## 第 4 章答案\n\n1. 需要 `strcpy()`。\n2. 内部定义和外部定义。\n3. 用于赋予变量和自定义名称。\n\
