  trans: "\n\n```cpp\nint main()\n{\n    // 4 个参数\n    Add(4, 1, 2, 3, 4);\n\n   \
    \ // 10 个参数\n    Add(10, 6, 9, 5, 11, 22, 1, 3, 56, 90, 63);\n}\n```\n\n输出\n>\
    \ 总和为: 10\n> 总和为: 266\n\n变量列表过程的每个部分都有标记，此函数会相加它接收到的所有参数。这提供了一种非常动态的方式，可以创建一个处理几乎无限参数列表的函数。\n\
    \n### 练习\n\n创建一个函数，将所有给定的参数并返回一个值，然后打印该值。注意：需要此 `#include`：\n\n```cpp\n#include\
    \ <cstdarg>\n```\n\n### 答案\n\n类似于如下：\n\n```cpp\n#include \"stdafx.h\"\n#include\
    \ <cstdarg>\n#include <iostream>\n\nusing namespace std;\n\nint Multi(int numberOfVariables,\
    \ ...)\n{\n    va_list arg;\n    va_start(arg, numberOfVariables);\n    int total\
    \ = 1;\n    for (int i = 0; i < numberOfVariables; i++)\n    {\n        // 获取下一个变量\n\
    \        total *= va_arg(arg, int);\n    }\n    va_end(arg);\n    return total;\n\
    }\n\nint main()\n{\n    cout << \"总和为: \" << Multi(3, 56, 90, 63) << endl;\n}\n\
    ```\n\n## 命名空间 (Namespaces)\n\n命名空间用于防止同名的变量和函数混淆，例如，`Run()` 函数适用于许多情况，因此需要一种方法来区分不同的\
    \ `Run()` 函数，这就是可以使用命名空间的地方。\n\n它们的定义如下，括号中的所有函数和变量都是该命名空间的一部分：\n\n```cpp\nnamespace\
    \ NamespaceName\n{\n}\n```\n\n下面的示例展示了如何使用它们：\n\n定义了两个具有相同函数名的命名空间如下：\n\n```cpp\n\
    namespace Proccesing\n{\n    void Run()\n    {\n        cout << \"Processing!\"\
    \ << endl;\n    }\n}\n\nnamespace Initialisation\n{\n    void Run()\n    {\n \
    \       cout << \"Initialisation started!\" << endl;\n    }\n}\n```\n\n这为程序员提供了机会，通过像这样指定命名空间来选择执行哪一个\
    \ `Run()`：\n\n`Proccesing::Run();`\n\n和\n\n`Initialisation::Run();`\n\n并让它们一起运行：\n\
    \n```cpp\nint main()\n{\n    Initialisation::Run();\n    Proccesing::Run();\n\
    }\n```\n\n输出\n> Initialisation started!\n> Processing!\n\n因此，命名空间提供了一种整洁划分代码的方法，并通过提供一种几乎可以标记代码块的方法提高了可读性。\n\
    \n## 章节末测试\n\n* 建议使用 `struct` 的推荐情况是什么？\n* ``enum` 是什么词的缩写？\n*   如何确定 `union`\
    \ 的大小？\n*   关于 `union` 的一个关键因素是什么？\n* 什么是变长函数 (Variadic function)？\n*   `va_list`\
    \ 包含什么内容？\n* 为什么需要在变长函数中指定参数数量？\n* 为什么需要运行 `va_end()`？\n* 命名空间的基础作用是什么？\n* 在调用命名空间内部的函数时使用什么语法，假设你正在命名空间\
    \ `Math` 内调用函数 `Add()`？\n\n### 答案\n\n* 用于简单的旧数据 (POD)。\n* 举举类型 (Enumerated type)。\n\
    * 它是其最大成员变量的大小\n* 所有成员变量共享相同的内存位置，因此一次只能有一个变量持有值\n* 一个具有可能无限数量参数的函数\n* 给函数的变量列表\n\
    * 无法判断 `va_list` 的大小，因此你需要指定传递的参数数量\n* 它在使用后执行对变量列表的清理工作\n* 以有意义的方式划分并标记变量及函数。\n\
    * `Math::Add()`\n\n# 第 5 章：高级特性\n\n## 文件输入输出 (File I/O)\n\n你最终会遇到一种编程情况，需要数据在程序运行和不运行之间存在，这就是文件保存用用场。\n\
    \n文件保存通过使用 `fstream` 库中的函数实现，包含方式如下：\n\n```cpp\n#include <fstream>\n```\n\n你还需要我们之前见过的“iostream”用于\
    \ `cout` 和 `cin`\n\n```cpp\n#include <iostream>\n```\n\n在保存和读取到文件时使用了三个主要对象：\n\
    \n* `ofstream`: 处理输出流，用于创建文件并将数据写入文件\n* `ifstream`: 它是 `ofstream` 的相反，用于从文件中读取数据\n\
    * `fstream`: 这是一个具有 `ofstream` 和 `ifstream` 特征的函数。\n\n### 打开文件\n\n为了打开文件，我们需要使用作为所有主对象的成员函数\
    \ `open()`，它的工作原理如下：\n\n```cpp\nfstream f;\nf.open(\"file.txt\", ios::in);\n```\n\
    \n其中：\n* “file.txt” 是文件名\n* `ios::in` 是打开文件方式的标志，下表解释了所有选项。\n\n| 名字 | 描述 |\n|\
    \ :--- | :--- |\n| `ios::app` | 以追加模式打开文件，所有输入将添加到文件末尾 |\n| `ios::ate` | 打开文件并将读/写控制移动到文件末尾\
    \ |\n| `ios::in` | 以读取模式打开文件 |\n| `ios::out` | 以写入模式打开文件 |\n| `ios::trunc` | 以写入模式打开文件，如果文件存在则将其截断\
    \ |\n| `ios::in` | 以输入模式打开文件 |\n\n### 关闭文件\n\n为了关闭文件，我们需要调用 `close()` 函数：\n\n\
    ```cpp\nf.close();\n```\n\n### 写入文件\n\n写入文件通过插入运算符 `<<` 实现：\n\n```cpp\nf << \"\
    写入数据!\" << endl;\n```\n\n### 从文件读取\n\n读取数据通过提取运算符 `>>` 实现：\n\n```cpp\nf >> data;\n\
    ```\n\n### 工作示例\n\n下面是一个包含读取和写入的工作示例：\n\n```cpp\n#include \"stdafx.h\"\n#include\
    \ <iostream>\n#include <fstream>\n\nusing namespace std;\n\nint main()\n{\n  \
    \  // 打开文件进行写入\n    fstream write;\n    write.open(\"file.txt\", ios::out);\n\
    \    // 将数据写入文件\n    write << \"Example Data\" << endl;\n    write << \"More example\
    \ data\" << endl;\n    write.close();\n\n    // 打开文件进行读取\n    fstream read;\n\
    \    read.open(\"file.txt\", ios::in);\n    // 读取数据\n    char data[100];\n   \
    \ while (!read.eof())\n    {\n        read >> data;\n        cout << data << endl;\n\
    \    }\n    read.close();\n}\n```\n\n如你所见，每个读取命令在遇到空格或换行时停止（如上所述），在这种情况下它增加了读取部分的复杂性。我们修复此问题的方法是是使用\
    \ `getline()`，调整上面的示例来读取整行，高亮显示如下：\n\n```cpp\n#include \"stdafx.h\"\n#include\
    \ <iostream>\n#include <fstream>\n#include <string>\n\nusing namespace std;\n\n\
    int main()\n{\n    // 打开文件进行写入\n    fstream write;\n    write.open(\"file.txt\"\
    , ios::out);\n    // 将数据写入文件\n    write << \"Example Data\" << endl;\n    write\
    \ << \"More example data\" << endl;\n    write.close();\n\n    // 打开文件进行读取\n \
    \   fstream read;\n    read.open(\"file.txt\", ios::in);\n    // 读取数据\n    string\
    \ data;\n    while (!read.eof())\n    {\n        getline(read, data);\n      \
    \  if(!data.empty())\n            cout << data << endl;\n    }\n    read.close();\n\
    }\n```\n\n"
- fmt: "\nThe `<string>` library has been included as to access the `getline()` method,\
    \ this method uses the “read” stream as the first parameter and the second parameter\
    \ being the place for the data to be stored. As you can tell “data” has also been\
    \ adapted to a string, this just allows a cleaner way of reading in because we\
    \ don’t need to specify length.\n\n## Recursion\n\nA recursive function is a function\
    \ that contains within its definition a call to itself, this therefore creates\
    \ a loop and if you’re not a carful an infinite one.\n\nRecursion can be very\
    \ useful as it creates iteration with a small code base, below is a recursive\
    \ example:\n\n```cpp\nvoid Recursive(int count)\n{\n    if (!(count <= 0))\n \
    \   {\n        //Prints current value of count\n        cout << count << endl;\n\
    \        //Makes recursive call\n        Recursive(count - 1);\n    }\n}\n```\n\
    \nAll this function does is count down from the initial value that’s it’s its\
    \ called with, so:\n\n```cpp\nRecursive(5);\n```\n\nWill output:\n>5\n>4\n>3\n\
