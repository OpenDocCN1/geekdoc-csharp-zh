    \ i++)\n{\n    // 循环代码\n}\n```\n\nfor 循环将执行两次，但你不能像操作普通变量那样改变它的值，在程序的整个生命周期内它是常量，除非使用\
    \ `#undef`，那会取消设置的值。\n\n`#undef` 通常用于覆盖内置指令，在那种情况下你会取消一个值然后设置一个你选择的值。\n\n### #ifdef\
    \ 和 #if\n\n`#ifdef` 和 `#ifndef` 在宏已定义时分别返回真或假，它们最常见的用途是检查 `-DDEBUG` 标志是否已定义。\n\
    \n```c\n#include <stdio.h>\n\n#ifdef DEBUG\n    printf(\"Debug mode on\");\n#endif\n\
    ```\n"
- fmt: "\nThis can be done either implicitly or explicitly. Implicit is when the complier\
    \ automatically converts the variable and explicitly is when you use the casting\
    \ operator. It is however very good practice to specify a cast wherever it is\
    \ necessary.\n\n## Memory management\n\nC allows programmers to dynamically manage\
    \ memory. This functionality is provided by:\n\n```c\n#include <stdlib.h>\n```\n\
    \nMemory management requires the use of a few functions:\n\n* `void *calloc(int\
    \ num, int size);`\n    * This function allocates an array (size specified by\
    \ `num`) and the size of each allocated specified by `size`\n* `void free(void\
    \ *address);`\n    * This function releases memory, the location is specified\
    \ by `address`.\n* `void *malloc(int num);`\n    * This function works like `calloc`\
    \ but leaves the locations uninitialized.\n* `void *realloc(void *address, int\
    \ newsize)`\n    * This function re-allocates memory to the size specified in\
    \ `newsize`\n\nBelow is an example of using `malloc` or `calloc` to allocate memory\
    \ for a string:\n\n```c\n#include <stdio.h>\n#include <stdlib.h>\n\n#define WORD_SIZE\
    \ 20\n\nint main()\n{\n    char* word;\n    //Allocates memory\n    word = malloc(WORD_SIZE\
    \ * sizeof(char));\n    //or\n    word = calloc(WORD_SIZE, sizeof(char));\n  \
    \  //Copies values over\n    strcpy(word, \"Hello nice to meet you!\");\n    //Printing\n\
    \    printf(\"The string is: \\\"%s\\\"\", word);\n    //Deletes memory\n    free(word);\n\
    }\n```\n\nThis can be used to do quite complex things, like take in a user input\
    \ and store it in an array exactly the size for that string:\n\n```c\n#include\
    \ <stdio.h>\n#include <stdlib.h>\n\n#define WORD_SIZE 20\n\nchar* getInput()\n\
    {\n    //Will be deleted\n    char temp[50];\n    //User input\n    printf(\"\
    Please enter your first name: \");\n    scanf(\"%s\", temp);\n    puts(\"\");\n\
    \n    //strlen() finds lenght of a string\n    int len = strlen(temp);\n    //Dynamic\
    \ allocation of memory\n    char* perfectSizeWord;\n    //Allocates memory!\n\
    \    perfectSizeWord = calloc(len, sizeof(char));\n\n    //This command would\
    \ not work, it takes the memory location of temp and just copies it so when\n\
    \    //this function goes out of scope so does perfectSizeWord\n    ///perfectSizeWord\
    \ = temp\n    //Copies the values properly\n    for (int i = 0; i < len; i++)\n\
    \    {\n        perfectSizeWord[i] = temp[i];\n    }\n    //Size comparason\n\
    \    printf(\"Size of temp var:%d\\n\", sizeof(temp));\n    printf(\"Size of new\
    \ perfect var:%d\\n\", sizeof(perfectSizeWord));\n    return perfectSizeWord;\n\
    }\n\nint main()\n{\n    //Gets returned variables\n    char* word = getInput();\n\
    \    //Prints\n    printf(\"The word is:%s\\n\", word);\n    //Delets memory\n\
    \    free(word);\n}\n```\n\nThe program above is large, take your time and look\
    \ through. Try and implement it and understand how it works.\n\n## Exercise\n\n\
    Use error handling techniques above to handle the error for allocating memory\
    \ with `malloc` or `calloc`. To simulate a an error just make `word = NULL;` after\
    \ the dynamic memory allocation.\n\nUse this program frame below to help:\n\n\
    ```c\n#include <stdio.h>\n#include <errno.h>\n\nint main()\n{\n    char* word;\n\
    \    //Allocates memory\n    word = malloc(20 * sizeof(char));\n    //ERROR SIMULATE\n\
    \    word = NULL;\n    //------------------PUT ERROR CODE HERE------------------------\n\
    \    //Deletes memory\n    free(word);\n}\n```\n\n### Solution\n\nVery simply\
    \ all that needs including is:\n\n```c\n#include <stdio.h>\n#include <errno.h>\n\
    \nint main()\n{\n    char* word;\n    //Allocates memory\n    word = malloc(20\
    \ * sizeof(char));\n    //ERROR SIMULATE\n    word = NULL;\n    if (word == NULL)\n\
    \    {\n        fprintf(stderr, \"Error: Unable to allocate the memory!\");\n\
    \    }\n    //Deletes memory\n    free(word);\n}\n```\n\n## Exercises chapter\
    \ 5\n\n1. How do you tell the compiler to use other files and libraries?\n2. What\
    \ file extension does a header file use?\n3. What is `#define` used for?\n4. What\
    \ `#include` is required for error handling?\n5. What is contained in the global\
    \ variable `errno`?\n6. What does `strerror()` return?\n7. What file stream is\
    \ required to print out an error?\n8. Typecasting; what is it used for?\n9. What\
    \ is the different between `calloc` and `malloc`?\n10. What normally will a function\
    \ that encounters an error return?\n\n## Answers Chapter 2\n\n1. Float or Double\n\
    2. True (1) and False (0)\n3. A statement designed to check if a condition is\
    \ true or false\n4. Declaration, Conditional and Iteration.\n5. Skips a full iteration\n\
    6. Yes it is, and by using `void`\n7. Theoretically unlimited\n8. `Printf` uses\
    \ formatting id’s, `puts` does not using id’s and automatically adds `\\n` the\
    \ end of the string\n9. Integer value\n10. `int arrayLength = sizeof(lotsOfNumbers)\
    \ / sizeof(lotsOfNumbers[0]);`\n\n## Answers chapter 3\n\n1. A memory location\
    \ for a certain type.\n2. The dereferencing operator (`*`).\n3. It will move 4bytes\
    \ along the next memory location.\n4. Only once.\n5. The variable is stored in\
    \ much faster to access register.\n6. `fprintf()` and `puts()`.\n7. Opens the\
    \ file for both reading and writing and chops the size down to zero if it exists\
    \ and creates it if does not.\n8. If the pointer is not `NULL`.\n9. Is called\
    \ the reference operator and is used to access or return the raw memory.\n10.\
    \ The size of the array as `size_t`.\n\n## Answers chapter 4\n\n1. `strcpy()`\
    \ is needed.\n2. Internally and externally defined.\n3. Used to give variables\
    \ and user defined names.\n4. Enumerated type.\n5. Only variable in `unions` can\
    \ hold a value at one time.\n6. A `union` is as big as its biggest variable.\n\
    7. The list of variables passed into a function.\n8. An ellipsis at the end of\
    \ the parameter list.\n9. The member operator denoted by a full stop (`.`).\n\
    10. An array stores the same type, a structure of any type.\n\n## Answers chapter\
    \ 5\n\n1. Using the `#include` directive\n2. A header file uses “.h”\n3. `#define`\
    \ is used to create global definitions of constant values\n4. `#include <errno.h>`\n\
    5. The last error code that will be stored there.\n6. The textual representation\
    \ of the error code in `errno`\n7. The file stream is “stderr”\n8. Used to change\
    \ one variable into another\n9. When `calloc` allocates memory it initialises,\
    \ `malloc` does not\n10. `NULL` or -1\n\n# C Step-By-Step Guide To C Programming\
    \ For Beginners\n\n© 2017 by Robert Anderson - All rights reserved. If you would\
