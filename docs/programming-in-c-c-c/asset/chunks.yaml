    \n*   Where can a function or variable marked as private be accessed?\n\n*   What\
    \ is role of the constructor?\n\n*   What should the .cpp file contain?\n\nAnswers\n\
    \n*   Header (.h) and C++ file (.cpp).\n\n*   The symbol “~” I used to show a\
    \ destructor.\n\n*   Just definitions of functions and variables.\n\n*   It can\
    \ only be accessed outside the definition class by a class that inherits it.\n\
    \n*   To have a single base definition but lots of different implementations.\n\
    \n*   Override is used to change a virtual method\n\n*   With a normal function\
    \ definition that is equal to zero.\n\n*   Only in the class where it was defined.\n\
    \n*   Is a special function without a return type that is called when an instance\
    \ of a class is created.\n\n*   Implication of functions and variables defined\
    \ in the header file.\n\n# Chapter 4: Improved Techniques\n\n## Structures\n\n\
    Structs originate from C, and come from the world of pre-class programming. However,\
    \ they’re still useful and can be use in places where classes are deemed as overkill.\n\
    \nA good example of using a structure being used can be for record keeping, for\
    \ example you needed to keep track of football players in a team you would need\
    \ to store:\n\n*   Name\n\n*   Kit Number\n\n*   Wage\n\n*   Strongest foot\n\n\
    *   Etc\n\nIf there is no need to add functionality onto this information a structure\
    \ is perfect for this situation. A structure storing this information is defined\
    \ like this:\n\nstruct  FootballPlayer\n\n{\n\nstring Name;\n\nint KitNumber;\n\
    \ndouble Wage;\n\nstring StrongestFoot;\n\n};\n\nThis structure contains all the\
    \ values that are relevant, this will provide a relevant container for similar\
    \ information.\n\nA new instance of the structure is defined like so:\n\nFootballPlayer\
    \ player1;\n\nplayer1.Name =  \"Messi\";\n\nplayer1.KitNumber = 10;\n\nplayer1.Wage\
    \ = 1000000;\n\nplayer1.StrongestFoot =  \"Both\";\n\nThis code will create a\
    \ FootballPlayer and assign values to all its member variables.\n\nReal world\
    \ usage of structures tend to be “simple” usage where they need to just store\
    \ trivial data like the example above, when there needs to be functionality and\
    \ encapsulation use a class. This is known a POD (Plain Old Data) encapsulation.\n\
    \nNote: The default access for structure variables is public while classes default\
    \ to private.\n\n## Enums\n\nEnums is short for Enumerated Type as has the role\
    \ of a boolean but with unlimited user defined types, this can be used a flags\
    \ for a situation like “HOME_SCREEN” or “SETTING_SCREEN”.\n\nAn enum is defined\
    \ like so:\n\nenum  CurrentScreen\n\n{\n\nHOME,\n\nSETTINGS,\n\nCONTACTS,\n\n\
    CALCULATOR\n\n};\n\nWith each word in the brackets being a state the enum can\
    \ be set as. A enum instance is created like so:\n\nint main()\n\n{\n\nCurrentScreen\
    \ phone1;\n\nphone1 = HOME;\n\n}\n\nThis code above makes a new enum and assigns\
    \ it as “HOME”. You can now use the enum to check what states it is, the example\
    \ below will use a switch-case:\n\n#include  \"stdafx.h\"\n\n#include  <iostream>\n\
    \nusing  namespace std;\n\nenum  CurrentScreen\n\n{\n\nHOME,\n\nSETTINGS,\n\n\
    CONTACTS,\n\nCALCULATOR\n\n};\n\nint main()\n\n{\n\nCurrentScreen phone1;\n\n\
    //Change me\n\nphone1 = HOME;\n\nswitch (phone1)\n\n{\n\ncase  HOME:\n\ncout <<\
    \  \"You're on the home page\"  << endl;\n\nbreak;\n\ncase  SETTINGS:\n\ncout\
    \ <<  \"You're on the settings page\"  << endl;\n\nbreak;\n\ncase  CONTACTS:\n\
    \ncout <<  \"You're on the contacts page\"  << endl;\n\nbreak;\n\ncase  CALCULATOR:\n\
    \ncout <<  \"You're on the calculator page\"  << endl;\n\nbreak;\n\ndefault:\n\
    \nbreak;\n\n}\n\n}\n\nOutput\n\n>You’re on the home page\n\nThis code shows you\
    \ can use conditional structures along with an enum to easily create a nice branched\
    \ structure. Mess around with the commented “Change me” enum definition and see\
    \ how the output changes.\n\n## Unions\n\nUnions are a data structures designed\
    \ to provide efficient memory usages, they can contain as many member variables\
    \ as it needs however it can only store data for a single variable at a time.\
    \ So the entire structure only takes up memory for the biggest member variable.\n\
    \nThese have to be used with caution because setting value of another member variable\
    \ will remove data stored in another, so it is incredibly easy to lose important\
    \ data.\n\nA union is defined like so:\n\nunion  Example\n\n{\n\nint i;\n\nint\
    \ x;\n\nint y;\n\n};\n\nAnd an instance and value is created like so:\n\nExample\
    \ e;\n\ne.i = 4;\n\nTo show how the size of the union works the program below\
    \ works it through:\n\n#include  \"stdafx.h\"\n\n#include  <iostream>\n\nusing\
    \  namespace std;\n\nunion  Example\n\n{\n\nint i;\n\nint x;\n\nint y;\n\n};\n\
    \nint main()\n\n{\n\nExample e;\n\ne.i = 4;\n\ncout <<  \"Your int size is: \"\
    \  <<  sizeof(int) <<  \" bytes\"  << endl;\n\ncout <<  \"The union has 3 variables\
    \ that should be a total of:  \"  <<  sizeof(int) * 3 <<  \" bytes\"<< endl;\n\
    \ncout <<  \"However, the union is \"  <<  sizeof(e) <<  \" bytes\"  << endl;\n\
    \n}\n\nDepending on your CPU architecture your output will be:\n\nOuput\n\n>Your\
    \ int size is: 4 bytes\n\n>The union has 3 variables that should be a total of: \
    \ 12 bytes\n\n>However, the union is 4 bytes\n\nAs you can tell the union is only\
    \ the size of a single integer, these structures can be used to efficiently use\
    \ memory is there’re situations where variables are idle and only one is needed.\n\
    \nBelow is code that shows what happens to all the values when one is changed:\n\
    \n#include  \"stdafx.h\"\n\n#include  <iostream>\n\nusing  namespace std;\n\n\
    union  Example\n\n{\n\nint i;\n\nint x;\n\nint y;\n\n};\n\nvoid Print_Union(Example\
    \  e)\n\n{\n\ncout <<  \"i: \"  <<  e.i << endl;\n\ncout <<  \"x: \"  <<  e.x\
    \ << endl;\n\ncout <<\"y: \"  <<  e.y << endl;\n\n}\n\nint main()\n\n{\n\nExample\
    \ e;\n\ncout <<  \"1\"  << endl;\n\ne.i = 4;\n\nPrint_Union(e);\n\ncout <<  \"\
    2\"  << endl;\n\ne.y = 3;\n\nPrint_Union(e);\n\ncout <<  \"3\"  << endl;\n\ne.x\
    \ = 1;\n\nPrint_Union(e);\n\n}\n\nOuput\n\n> 1\n\n> i: 4\n\n> x: 4\n\n> y: 4\n\
    \n> 2\n\n> i: 3\n\n> x: 3\n\n> y: 3\n\n> 3\n\n> i: 1\n\n> x: 1\n\n> y: 1\n\nAs\
    \ you can tell when you change one value, they all equal the same value, this\
    \ is because all values share the same memory location and therefore when one\
    \ changes they all change.\n\n## Variable argument lists\n\nVariable argument\
    \ lists allow for the possibly of endless parameters. Before we have come across\
    \ functions with a static set amount of parameters (variables you can pass into\
    \ a method) like:\n\nint Add(int i, int y)\n\n{\n\n}\n\nHas two parameters integer\
    \ “i” and integer “y”.\n\nThis is known as a Variadic Function or a function with\
    \ unlimited arity (parameter number, so “Add” above has an arity of 2)\n\nThe\
    \ variables are stored in a variable known as the va_list this works as any other\
    \ variable but it just holds the list of variables passed. A variadic function\
    \ is defined like so:\n\nvoid Add(int  numberOfVariables, ...)\n\n{\n\n}\n\nWhere\
    \ “numberOfVariables” is the number of extra parameters passed, note this does\
    \ not include this variable. This is required because the va_list does not know\
    \ the total number of variables and does not keep track of where it is in the\
    \ list.\n\nUsing the va_ist requires the use of a few functions:\n\n*   va_start(va_list,\
    \ numberOfVariables)\n\n    *   Grabs the variables passed in and assigns the\
    \ number specified by the second parameter to the first parameter\n\n*   va_arg(va_list,\
    \ type)\n\n    *   Grabs the next variable from the specified list in the first\
    \ parameter and creates a variable specified by “type”\n\n*   va_end(va_list)\n\
    \n    *   Tidies up the list specified\n\nWe can now use these functions to create\
    \ a working variadic function:\n\n#include  \"stdafx.h\"\n\n#include  <cstdarg>\n\
    \n#include  <iostream>\n\nusing  namespace std;\n\nvoid Add(int  numberOfVariables,\
    \ ...)\n\n{\n\n//The variable list\n\nva_list arg;\n\n//Grabs the list\n\nva_start(arg,\
    \ numberOfVariables);\n\nint total = 0;\n\nfor (int i = 0; i < numberOfVariables;\
    \ i++)\n\n{\n\n//Grabs the next variable\n\ntotal += va_arg(arg, int);\n\n}\n\n\
    //Clean up\n\nva_end(arg);\n\ncout <<  \"Total is: \"  << total << endl;\n\n}"
