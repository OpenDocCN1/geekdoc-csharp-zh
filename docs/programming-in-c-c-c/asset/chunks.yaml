    \n# Chapter 1\n# Setup and Introduction\n## History of C#\nC# first appeared in\
    \ 2000 when it was announced by Microsoft, C# is a Microsoft owned language stemming\
    \ from the C family. It was designed by a team run by Anders Hejlsberg. Initially\
    \ it proposed the language would be called “Cool” standing for “C-Like Object\
    \ Orientated Language” with Microsoft finally deciding to call it C#. The hash\
    \ symbol is used but pronounced as ‘sharp’, this was chosen on purpose because\
    \ of the lack of sharp. Below is a timeline of C# and what features were added:\n\
    \n- Jan 2002: C# 1.0 (Object Oriented Programming)\n- Nov 2005: C# 2.0 (Generics,\
    \ Nullable types, Iterators, Partial classes)\n- Nov 2007: C# 3.0 (Anonymous types,\
    \ Expression trees, Extension methods)\n- April 2010: C# 4.0 (Dynamic, Optional\
    \ arguments)\n- Aug 2012: C# 5.0 (Asynchronous Programming, Threaded)\n- July\
    \ 2015: C# 6.0 (String interpolation, Exception filters, Attributes)\n\n## Why\
    \ C#?\nC# has many advantages over similar languages like Java and Python:\n-\
    \ It is incredibly type safe.\n- It has full control over memory.\n- It provides\
    \ a rich framework.\n\n## Running C# on Windows\nThere has recently been release\
    \ of Visual Studio for Mac, but it does not have all features. To work with C#,\
    \ you will need to download Visual Studio from Microsoft. Please run the installer\
    \ and install.\n\n1. Open Visual Studio.\n2. Click File and select \"New Project\"\
    .\n3. Select ConsoleApplication and give it a name.\n4. Click \"Ok\".\n\n# Chapter\
    \ 2\n# Classes and Objectated Programming\n## Basic classes\nClasses are used\
    \ to store variable and functionality relevant to an object, for example there\
    \ can be a class created for `Book`, it would have information such as number\
    \ of pages, genre and cover colour and functionality like `loan` or `return`.\
    \ This is where the whole useful and real world nature comes from with classes,\
    \ and the word object in the OOP.\n\nBefore we go into how to create a class there\
    \ are accessor keywords that need to be understood:\n1. `private`: Cannot be accessed\
    \ outside the scope of the class.\n2. `public`: Can be accessed anywhere.\n3.\
    \ `protected`: Can be accessed from inherited classes.\n\nYou define a class like\
    \ so:\n\n```csharp\nclass Book\n{\n}\n```\n\nWith all its variables and functions\
    \ defined within the brackets, a fleshed-out version is below:\n\n```csharp\n\
    class Book\n{\n public Book(int numberOfPages, int currentPage, string colour,\
    \ string name)\n    {\n    _numberOfPages = numberOfPages;\n    _currentPage =\
    \ currentPage;\n    _colour = colour;\n    _name = name;\n    }\n\n private  int\
    \ _numberOfPages;\n\n private  int _currentPage;\n\n private  string _colour;\n\
    \n private  string _name;\n\n    public  string changeMe;\n\n public  int returnCurrentPage()\n\
    \    {\n return _currentPage;\n    }\n}\n```\n"
