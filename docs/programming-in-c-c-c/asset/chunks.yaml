    ## Header files


    A header file is a list of function, variable and macro definitions that can be
    included and used in different files. A header file is specified by the .h filename
    extensions. They are included in other files by using the #include (pre-processor
    directives) and the name of the file (“header.h”). There are custom header files
    that programmers can create and also built in header files that come with the
    compiler, much like “stdio.h” that we have seen in the previous section.


    To create a header file all you need to do is create a file with the .h file extension,
    this can be done in something as simple as notepad, this header file can now be
    included with another file to link and use the features of the header file.


    Below is an example:


    header.h


    int x = 10;


    int Function()


    {


    return x;


    }


    Can he included and used like so:


    #include  <stdio.h>


    #include  "header.h"


    int main()


    {


    printf("%d", Function());


    }


    Output


    >10


    This allows programmers to make modules that can be reused between projects.


    A possible use of headers is below:


    int add(int  num1, int  num2)


    {


    return  num1 + num2;


    }


    int sub(int  num1, int  num2)


    {


    return  num1 - num2;


    }


    int div(int  num1, int  num2)


    {


    return  num1 / num2;


    }


    int mul(int  num1, int  num2)


    {


    return  num1 * num2;


    }


    Once again, the calculator example returns, a header could be a list of functions
    like this that could then be included to allow the use of these functions.


    ## Pre-Processor Directives


    Pre-processing are used to give the compiler a type of command, you come across
    a command quite a few times already is the ‘#include’ directive that tells the
    compiler to include a certain header file.


    Below is a list of the processor directives, we will go through how they all work:


    | Directive | Description |


    | #define | Used to define a macro |


    | #include | Inserts a particular header from another file. |


    | #undef | Removes the effect of #define |


    | #ifdef | Returns true if this macro is defined. |


    | #ifndef | Returns true if this macro is not defined. |


    | #if | Tests if a compile time condition is true. |


    | #else | The alternative for #if. |


    | #elif | #else and #if in one statement. |


    | #endif | Ends pre-processor conditional. |


    #define and #undef


    These commands are used when global values are used to increase readability, for
    example:


    #define  LOOP_NUMBER 2;


    Could be defined and used like so:


    for (int i = 0; i < LOOP_NUMBER; i++)


    {


    //Loop code


    }


    And the for loop will loop twice, but you cannot change the value like you would
    with a normal variable, it’s constant through the life of the program unless #undef
    is used that will undefine the value set.


    #undef is normally used to overwrite build in directives where you would undefine
    a value and then set a value of your choosing. 


    #ifdef and #if


    #ifdef and #ifndef will return true and false respectively if a macro is defined,
    this most common use for this is checking if the -DDEBUG flag has been set and
    running code in DUBUG mode that has no use in the finished program. It’s used
    like this:


    #include  <stdio.h>


    int main()


    {


    #ifdef DEBUG


    puts("DEBUG!");


    #endif


    }


    This code will only run if the code is flagged as debug mode. This can be very
    useful for a programmer.


    #if, #else and #elif work exactly the same as if statements but are used to check
    the macro with arithmetic expressions rather that checking for its existence.


    ## Error Handling


    Error handling is a very important section, because a programmer needs to make
    sure his program is prepared to deal with expected and unexpected errors. C does
    not provide direct support for error handling but allows access to some low level
    functions. Most functions will return -1 or NULL if there is an error and set
    the errno error code, errno is a global variable that holds the last returned
    error code.


    You will need to include the <errno.h> header file to use these error handling
    functions.


    #include  <errno.h>


    There are a few functions that allow you to use an understand error codes.


    perror()


    Function displays the string you pass and attaches to the end the textual representation
    of the error code stored in errno.


    strerror()


    Returns the pointer to the textual representation of the errno value. This can
    be used to save the error feedback.


    stderr file stream


    stderr is used to output an error to the console.


    Usage is below:


    #include  <stdio.h>


    #include  <errno.h>


    extern  int  errno;


    int main() {


    FILE * file;


    int errnum;


    //Looks for file


    file = fopen("youWillNotFindMe.txt", "rb");


    //If the file returned an error


    if (file == NULL)


    {


    //Grabs error code


    errnum = errno;


    //Prints error code


    fprintf(stderr, "Value of errno: %d\n", errno);


    //Returns string provided + : and Error code message


    perror("Error printed by perror");


    //Grabs the error text


    char* errorMsg[] = { strerror() };


    printf("Error msg test print: %s", *errorMsg);


    }


    else


    {


    fclose(file);


    }


    return 0;


    }


    Above is usage of some of the error handling examples. Go over and understand
    it error handling is very important.


    Below is another example of preventing the classic divide by zero error:


    #include  <stdio.h>


    #include  <errno.h>


    extern  int  errno;


    int divide(int  x, int  y)


    {


    if (y == 0)


    {


    //Prints error


    fprintf(stderr, "Diving by zero error..!");


    //Returns error code


    return -1;


    }


    else


    {


    //If valid returns even


    return  x / y;


    }


    }


    int main()


    {


    int returnCode = divide(0, 2);


    }


    ## Type casting


    Variables has defined types, but there are situations where you’ll need to convert
    from one type to another. Very commonly would be the conversion between integer
    to a float or double


    The general format is like so:


    (type)varToCast


    This can be used like so:


    int main()


    {


    int integer = 3;


    float decimal = 1.5f;


    int result = (int)decimal + integer;


    printf("%d\n", result);


    }


    Output


    > 4


    What happens is any decimal values are truncated (removed) and the remainder is
    added to the integer value.


    You can also upgrade a value, this example shows when a integer is upgraded to
    a float:


    int main()


    {


    int integer = 3;


    float decimal = 1.5;


    //Explicit casting


    float result = decimal + (float)integer;


    printf("%f\n", result);


    //Implicit casting


    float result = decimal + integer;


    printf("%f\n", result);


