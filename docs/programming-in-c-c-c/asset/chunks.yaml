    {


    return area;


    }


    double getLength()


    {


    return length;


    }


    double getWidth()


    {


    return width;


    }


    }


    As you can see all the variables have been marked as Private and getters have
    been added, this is the way classes should be structure.


    ## Polymorphism


    The word polymorphism means having many forms and polymorphism in the context
    of OOP means having one method that can have many roles.


    We can use the example of the class shape and overload a method that determines
    the area if for example we wanted to make a Triangle class, this is the shape
    class but with a virtual getArea() method:


    class  Shape


    {


    protected:


    double length;


    double width;


    double area;


    public:


    Shape(double  l, double  w)


    {


    length = l;


    width = w;


    }


    ~Shape()


    {


    }


    virtual  double getArea()


    {


    return length * width;


    }


    };


    Virtual methods give the option be overridden an changed by a class that inherits
    it, it is also an optional change.


    class  Triangle : public  Shape


    {


    public:


    Triangle(double  l, double  w) : Shape(l, w)


    {


    }


    double getArea() override


    {


    return 0.5 * (length * width);


    }


    };


    Above is the implementation of the Triangle class, highlighted is the “override”
    keyword used to change the functionality of the virtual function.


    int main()


    {


    Shape s = Shape(10, 10);


    cout <<  "The shapes area is: "  << s.getArea() << endl;


    Triangle t = Triangle(10, 10);


    cout <<  "The triangles area is: "  << t.getArea() << endl;


    }


    Ouput


    >The shapes area is: 100


    >The shapes area is: 50


    As you can see from the example above each getArea() function is implemented differently
    and returns a different result.


    This polymorphic design still gives the ease of creating lots of new data types
    without the need for repeating code but with a level of customising involved.


    Exercise


    Add a new class called Circle, it will need a different constrictor that only
    takes height and the getArea method needs overloading.


    Solution


    class  Circle : public  Shape


    {


    public:


    Circle(double  h) : Shape(h, 0)


    {


    }


    double getArea() override


    {


    return 3.14 * ((length / 2) * (length / 2));


    }


    };


    As you can see a constructor is provided that only includes the height and the
    getArea() returns an relatively imprecise area for the circle.


    Polymorphism if done correctly can give an extremely clean and readable code base
    with methods and classes adapting behaviour where necessary.


    ## Interfaces


    An interface describes the behaviour of capabilities of C++ class without committing
    to implementation. Interfaces are implemented using abstract classes, and are
    just the plan for the class.


    Abstracts classes are made by adding a pure virtual functions to a class, a pure
    virtual function is a function with no body and is specified by placing a “=0”
    next to the function like so:


    virtual  double getVar() = 0;


    This means the role the function is just to be inherited and adapted. Failing
    to override a pure virtual function in an inherited class results in an error,
    so It’s considered a strict blueprint to design classes.


    An error seen from not implementing a pure virtual function:


    ![](Images/image00630.jpeg)


     Below is an example involving animals:


    #include  "stdafx.h"


    #include  <iostream>


    using  namespace std;


    class  Animal


    {


    public:


    //Pure virtual function


    virtual  void MakeSound() = 0;


    };


    class  Dog : public  Animal


    {


    public:


    void MakeSound()


    {


    cout <<  "Bark!"  << endl;


    }


    };


    class  Cat : public  Animal


    {


    public:


    void MakeSound()


    {


    cout <<  "Meow!"  << endl;


    }


    };


    class  Lion : public  Animal


    {


    public:


    void MakeSound()


    {


    cout <<  "Raw!"  << endl;


    }


    };


    int main()


    {


    Dog d;


    d.MakeSound();


    Cat c;


    c.MakeSound();


    Lion l;


    l.MakeSound();


    }


    Output


    >Bark!


    >Meow!


    >Raw!


    As you can tell it’s a very rudimental pointless example, however it’s supposed
    to show how a base class can hold basic information and class that inherits it
    is supposed to add information on top, in this example the program states that
    anything that inherits animals needs to have a sound, this can be adapted upon
    to make complex designs for classes and easily fill in relevant implementation.


    Another example below will use the classic shape example and have a base class
    called “Shape” that will have an abstract function “getArea()” that will need
    implementing for each shape:


    #include  "stdafx.h"


    #include  <iostream>


    using  namespace std;


    class  Shape


    {


    public:


    //Pure virtual function


    virtual  int Area() = 0;


    Shape(double  h, double  w)


    {


    heigth = h;


    width = w;


    }


    protected:


    double heigth;


    double width;


    };


    class  Circle : public  Shape


    {


    public:


    Circle(double  h, double  w) : Shape(h, w) {}


    int Area()


    {


    return 3.14 * ((heigth / 2) * (heigth / 2));


    }


    };


    class  Rectangle : public  Shape


    {


    public:


    Rectangle(double  h, double  w) : Shape(h, w) {}


    int Area()


    {


    return heigth * width;


    }


    };


    int main()


    {


    Rectangle r = Rectangle(10, 20);


    cout << r.Area() << endl;


    Circle c = Circle(5, 5);


    cout << c.Area() << endl;


    }


    Another simple example, but take your time and get used to it, abstract class
    architecture allows easy addition of new function and classes even if the design
    has been made due to the easy blueprint-esk design.


