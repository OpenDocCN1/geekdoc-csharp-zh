    \        Namespace1.SameName s2 = new Namespace1.SameName();\n        s2.Function();\n\
    \        Console.ReadKey();\n    }\n}\n}\n\nnamespace Namespace1\n{\n    class\
    \ SameName\n    {\n        public void Function()\n        {\n            Console.WriteLine(\"\
    Namespace1!\");\n        }\n    }\n}\n```\n\nOutput\n> Main!\n> Namespace1!\n\n\
    Note how there are two classes with a class with the “SameName” and how you specify\
    \ which one with the `Namespace` and the member operator.\n\nNamespaces in other\
    \ files or this file can be automatically specified by the `using` keyword, you\
    \ may have noticed the: `using System;` That has appeared on the top of some code\
