    \n# Chapter 1: Introduction and Installation\n\n## History of C++\n\nC++ is a\
    \ general purpose programming language. It’s aim as a programming language is\
    \ to offer a platform to create efficient and bare-boned applications. C++ was\
    \ released in 1983, and first started on in 1979 by Bjarne Stroustrup where it\
    \ was known as “C with classes” where it was later in 1983 renamed to be C++.\n\
    \nThe language is still maintained with updates every few years, where it is still\
    \ one of the most popular languages in the world.\n\n## Running C++ on Windows"
