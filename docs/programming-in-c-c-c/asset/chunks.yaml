    \ Hide This\n\nConsole.WriteLine(\"Print!\");\n\n#endregion\n\nOutput\n\n>Print!\n\
    \nWhen collapsed it will look like this\n\n![](Images/image00623.jpeg)\n\n## Exception\
    \ Handling\n\nAn exception is ‘thrown’ when an error occurs, it is a response\
    \ a situation the program cannot continue from. Exceptions can be handled though\
    \ and your program doesn’t have to always explode, there’re 4 keywords; try, catch,\
    \ finality and throw:\n\n*   try – This is used to surround the code you would\
    \ like to monitor for an exception, if an exception is found it transfers control\
    \ to the catch section\n\n*   catch – This is where the program will end up if\
    \ an exception is thrown within an accompanying try section.\n\n*   finally –\
    \ This can accompany a try/catch but will run always regardless of an exception\
    \ being thrown, a good example is when opening a file to read, it always needs\
    \ closing\n\n*   throw – This is used to manually throw an exception with your\
    \ own custom text.\n\nBelow is an example of using a try/catch:\n\nusing System;\n\
    \nnamespace ConsoleApplication1\n\n{\n\n class  Program\n\n    {\n\n static  void\
    \ Main(string[] args)\n\n        {\n\n try\n\n            {\n\n //Diving by zero\
    \ error!\n\n int zero = 0;\n\n int i = 1 / zero;\n\n            }\n\n catch  (Exception\
    \ e)\n\n            {\n\n Console.WriteLine(e.Message);\n\n            }\n\n Console.ReadKey();\n\
    \n        }\n\n    }\n\n}\n\nOutput\n\n> Attempted to divide by zero.\n\nNote:\
    \ The highlighted are signifies the parameter for the exception, the exception\
    \ text can be obtained like below with the “.Message” property. But as you can\
    \ see the program has printed out the error message, but not thrown a compilation\
    \ error, the code within the try has not been completed, but has switched to the\
    \ catch area.\n\nHere is another example but this time a try/catch/finally is\
    \ being used, this program opens a file (assume it exists) and the finally statement\
    \ is there to 100% make sure the file is closed even if an exception is thrown.\n\
    \nusing System;\n\nusing System.IO;\n\nnamespace ConsoleApplication1\n\n{\n\n\
    \ class  Program\n\n    {\n\n static  void Main(string[] args)\n\n        {\n\n\
    \ StreamReader sr = null;\n\n try\n\n            {\n\nsr = new  StreamReader(\"\
    file.txt\");\n\n //Used to simulate an example\n\n throw  new  Exception(\"Error\
    \ reading file!\");\n\n            }\n\n catch (Exception e)\n\n            {\n\
    \n Console.WriteLine(e.Message);\n\n            }\n\n finally\n\n            {\n\
    \n //Closes the file\n\n if (sr != null)\n\n                {\n\n                   \
    \ sr.Close();\n\n                }\n\n            }\n\n Console.ReadKey();\n\n\
            }\n\n    }\n\n}\n\nNote the use of the “throw new Exception(….” this is\
    \ used to throw your own custom exceptions, this can be used in situations where\
    \ you need to be informed of a critical error in your program.\n\n## End of chapter\
    \ Quiz\n\n*   Which key characteristics does an operator overloading function\
    \ need?\n\n*   What is the role of a regular expression?\n\n*   What is the namespace\
    \ used for regular expresions?\n\n*   What does putting ‘@’ before a string achieve?\n\
    \n*   How does C#’s directives differ from C or C++?\n\n*   When will a finally\
    \ statement run?\n\n*   What is the keyword ‘throw’ used for?\n\n*   What is the\
    \ role of #region and #endregion?\n\n*   In regular expressions what does “^”\
    \ signify?\n\n*   In regular expressions, what would this mean [abfe]+\n\n## Answers\n\
    \n*   Public and static.\n\n*   Used to match patterns to strings.\n\n*   System.Text.RegularExpressions.\n\
    \n*   It tells the complier to take the string literally and ignore backslash\
    \ identifiers.\n\n*   There is no support for macros.\n\n*   Always, even if an\
    \ exception has been thrown.\n\n*   It is used to create your own custom exceptions.\n\
    \n*   They’re used for formatting and improved readability.\n\n*   Signifies the\
    \ start of the word.\n\n*   Any number of characters in a row that are a,b,f and\
    \ e would be a match\n\n# Chapter 5\n\n# Program formatting\n\n## Attribute\n\n\
    An attribute is a tag used to convey information to the compiler about behaviours\
    \ of elements of the program, an attribute is specified by a pair of square brackets\
    \ ([]) and are placed above the element they are providing information about.\n\
    \nThe .NET framework provides two types of attribute:\n\n11.  Predefined\n\n12.\
    \  Custom built\n\nPredefined\n\nThere are three pre-defined attribute types:\n\
    \n*   AttributeUsage\n\n*   Conditional\n\n*   Obsolete\n\nAttribute Usage\n\n\
    Attribute usage describes how a custom attribute can be used and where it can\
    \ be applied, the syntax is below:\n\n[AttributeUsage(validOn, AllowMultiple,\
    \ Inherited)]\n\nWhere:\n\n*   validOn specifies where the attribute can be set,\
    \ it uses the enum “AttributeTargets” that can consist of:\n\n    *   AttributeTargets.Class\n\
    \n    *   AttributeTargets.Constructor\n\n    *   AttributeTargets.Field"
