  raw: 'There’re a few things to note, the lack of iteration loops, recursion in its
    essence causes looping. The second thing to not if the if statement labelled ‘stopping
    condition’, if recursive set-ups don’t have conditions that stop them looping
    they will loop forever, so this is a crucial element for using recursion effectively.
    If you don’t fully understand yet, don’t worry we will go into more detail later
    in the advanced section of the tutorial. 


    ## Arrays


    Arrays have been mentioned previously, it is a data structure that holds a set
    number of variables next to each other in memory. The array will be given a type,
    for example ‘int’. Arrays are used to quickly define lots of variables and keep
    relevant variables together. An array is defined below:


    A static size, with the size in the square brackets:


    int lotsOfNumber[20];


    Or you can define values at the definition, Note: a size does not need to be defined
    because it’s automatically determined by the number of values you specify:


    int lotsOfNumbers[] = {1,3,4};


    *   Arrays start at 0, so the first index has an identifying value of 0, the second
    is 1 and so on. This means when accessing values, you need to remember it is always
    one less than the number of values it contains


    You can access an index like so:


    int var = lotsOfNumbers[0];


    This will grab the first index of the array and place it in ‘var’.


    Arrays are very useful to access the tightly related data very quickly, you can
    use a for-loop to loop through the indexes and use them according. An example
    is below:


    int lotsOfNumbers[] = { 1, 3, 4, 10};


    for (int x = 0; x < 4; x++)


    {


    printf("%d\n", lotsOfNumbers[x]);


    }


    Output:


    > 1


    > 3


    > 4


    > 10


    In C you cannot get the length directly and need to work it out, this can be done
    simply using the sizeof() keyword, this returns the size of the elements in the
    brackets, so for example on a 64bit machine a int should be represented using
    4bytes so sizeof will return 4\. The length of an array can be worked out as so:


    int arrayLength = sizeof(lotsOfNumbers) / sizeof(lotsOfNumbers[0]);


    This takes the entire size of the array, and divides it by the first element and
    the division gives how many indices the array holds.


    Multi-dimensional arrays


    You can also define a second dimension in the array or even a third, this gives
    more flexibility when working with arrays. For example, a 2D array could be used
    to store coordinates or positions of a grid. A 2D array is defined as so:


    int arrayOfNumbers[][2] = { {1,1}, {1,1}};


    You access an element by putting the values in the square brackets for the x and
    y coordinate


    int element = arrayOfNumbers[X][Y]


    The obvious difference is that the second dimension needs a value, this cannot
    be automatically resolved when creating an array and that the initialization requires
    nested curly brackets. Below is the 3D example:


    int arrayOfNumbers[][][2] = {{{1,1},{1,1}},{{1,1},{1,1}}};


    But at this stage it is starting to lose readability and it’s much better practise
    to lay it out like so:


    int arrayOfNumbers[][][2] =


    {


    {{1,1},{1,1}},


    {{1,1},{1,1}}


    };


    Passing Arrays in functions


    As we saw when we learned about functions above, passing variables in as parameters
    can be very useful and so can passing in lots of variables stored as an array.
    However, we learnt above how to determine the size of an array above but this
    does not work with an array passed as a parameter, so we must pass in a variable
    that represents the number of elements that array is holding. There is a special
    variable type used to hold count variables, it’s called size_t and it is an unsigned
    integer value (Meaning it cannot become negative) used to hold values for a count.


    An example of an array being passed as a parameter is below:


    void Print_SingleDimenArray(size_t  length, int  ageArray[])


    {


    //Length is used to dynamically determine the for loop length


    for (int i = 0; i < length; i++)


    {


    printf("%d\n",ageArray[i]);


    }


    }


    int main()


    {


    //An array of ages


    int ages[] = { 32, 11, 12, 1, 8, 5, 10 };


    //Size is determined as shown previously


    size_t ageLen = sizeof(ages) / sizeof(ages[0]);


    //Method call


    Print_SingleDimenArray(ageLen, ages);


    }


    Output


    >32


    >11


    >12


    >1


    >8


    >5


    >10


    The array has been passed and used to print values. The length of the array is
    crucial to the program as it allows the for loop to work for arrays of varying
    length.


    *   Any changes to an array in any method will change the array variable in the
    calling method. This is what was mentioned earlier as passing by reference, the
    whole array isn’t copied and passed by reference with a little trickery occurring.


    Extra – Advanced


    This isn’t crucial to understanding but I’m going to explain why determining the
    size of an array after it’s passed as a parameter will not give the correct result.


    When an array is passed as a parameter the first element’s memory position address
    is passed (This is a pointer, promise we will touch on these later) and when you
    use sizeof to grab the size of the ‘array’ you are just getting the size of the
    first element returned.


    ## User input


    Sometimes it is necessary to get an input from the user, in the form of a choice
    or name etc. There are a few ways of doing this but the most straight forward
    method is the scanf() and printf() functions.


    Before we go into how they work we first need to learn the basic type identifiers
    for scanf() and printf(): (This is not a comprehensive list)


    | Formatting ID | Valid Input | Type needed for argument |


    | %c | Single characters, reads the characters and so on so on | char |


    | %f | Float values, | float |


    | %d | Decimal integer | int |


    | %o | Octal | int |


    | %u | Unsigned decimal integer (Does not have a sign and is just a positive int)
    | int |


    | %x | Hexadecimal | int |


    | %s | String of characters and will continue reading until a whitespace is found
    | char[] |


    scanf() works by grabbing user input and placing in a variable:


    char name[20];


    scanf("%s", name);


    And an example of grabbing an integer value:


    int userInputInt;


    scanf("%d", &userInputInt);


    Note: The use of the “&” for userInputInt. This is saying that it’s an exact reference
    to the memory location of userInputInt and the value read in from the user is
    placed into that integer variable by adding it to that memory location.


    printf is used to display information to the console for debugging and user interfaces.
    printf also uses the same formatting ID’s as scanf and these formatting ID’s are
    used as placeholders, the example below shows printing a string and integer respectively:


    Integer


    int number = 10;


    printf("%d", number);


    String


    char word[] = "Lemon";


    printf("%s", word);


    These formatting ID work as place holders and printf can take multiple parameters
    depending on the number of formatting ID present in the print string. For example:


    int number = 10;


    char word[] = "Lemon";


    printf("A fruit is: %s and here is a number: %d", word, number);


    Each formatting ID is replaced in order by the parameters, in this case “%s” is
    replaced by word and “%d” is replaced by number. This can work with as many number
    of formatting ID’s as is needed.


    fputs()


    fputs() is the much simpler alternative when you just want to print a string of
    characters to the console. fputs() does not use the formatting IDs that printf()
    uses so it doesn’t need to check for formatting and is slightly quicker. It also
    automatically puts a ‘\n’ onto the end of the printed line.


    ## Quiz chapter 2


    This section is designed to keep you on your toes about the previous content,
    there will be 10 questions that you can answer to test your knowledge, below in
    the neighbouring section will be the answers.


    1.  Name one data type that is used to hold decimal numbers?


    2.  What two values can a boolean hold?


    3.  What is a condition statement?


    4.  Name the three sections that make up the for loop


    5.  What does the continue keyword achieve?'
