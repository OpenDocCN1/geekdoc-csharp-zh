  trans: "\n这可以通过隐式或显式的方式完成。隐式是指编译器自动转换变量，而显式是指你使用类型转换运算符。然而，在任何必要的地方指定类型转换是一个非常好的习惯。\n\
    \n## 内存管理\n\nC 语言允许程序员动态管理内存。此功能通过以下内容提供：\n\n```c\n#include <stdlib.h>\n```\n\n\
    内存管理需要使用几个函数：\n\n* `void *calloc(int num, int size);`\n    * 该函数分配一个数组（大小由 `num`\
    \ 指定），且每个分配单元的大小由 `size` 指定。\n* `void free(void *address);`\n    * 该函数释放内存，其位置由\
    \ `address` 指定。\n* `void *malloc(int num);`\n    * 该函数的工作原理与 `calloc` 相似，但留下的位置未经过初始化。\n\
    * `void *realloc(void *address, int newsize)`\n    * 该函数将内存重新分配为 `newsize` 中指定的大小。\n\
    \n下面是一个使用 `malloc` 或 `calloc` 为字符串分配内存的示例：\n\n```c\n#include <stdio.h>\n#include\
    \ <stdlib.h>\n\n#define WORD_SIZE 20\n\nint main()\n{\n    char* word;\n    //\
    \ 分配内存\n    word = malloc(WORD_SIZE * sizeof(char));\n    //或\n    word = calloc(WORD_SIZE,\
    \ sizeof(char));\n    // 拷贝值\n    strcpy(word, \"Hello nice to meet you!\");\n\
    \    // 打印\n    printf(\"The string is: \\\"%s\\\"\", word);\n    // 删除内存\n  \
    \  free(word);\n}\n```\n\n这可以用于执行相当复杂的操作，例如获取用户输入并将其存储在与字符串大小完全匹配的数组中：\n\n```c\n\
    #include <stdio.h>\n#include <stdlib.h>\n\n#define WORD_SIZE 20\n\nchar* getInput()\n\
    {\n    //将被删除\n    char temp[50];\n    // 用户输入\n    printf(\"Please enter your\
    \ first name: \");\n    scanf(\"%s\", temp);\n    puts(\"\");\n\n    //strlen()\
    \ 查找字符串的长度\n    int len = strlen(temp);\n    // 内存动态分配\n    char* perfectSizeWord;\n\
    \    // 分配内存！\n    perfectSizeWord = calloc(len, sizeof(char));\n\n    // 这条命令不起作用，它获取了\
    \ temp 的内存位置并直接拷贝，所以当\n    // 该函数超出范围时，perfectSizeWord 也会随之销\n    ///perfectSizeWord\
    \ = temp\n    // 正确拷贝值\n    for (int i = 0; i < len; i++)\n    {\n        perfectSizeWord[i]\
    \ = temp[i];\n    }\n    // 大小比较\n    printf(\"Size of temp var:%d\\n\", sizeof(temp));\n\
    \    printf(\"Size of new perfect var:%d\\n\", sizeof(perfectSizeWord));\n   \
    \ return perfectSizeWord;\n}\n\nint main()\n{\n    // 获取返回变量\n    char* word =\
    \ getInput();\n    // 打印\n    printf(\"The word is:%s\\n\", word);\n    // 删除内存\n\
    \    free(word);\n}\n```\n\n上面的程序很大，请花些时间仔细阅读。尝试实现它并理解它的工作原理。\n\n## 练习\n\n使用上述错误处理技术来处理使用\
    \ `malloc` 或 `calloc` 分配内存时的错误。为了模拟错误，只需在动态内存分配后设置 `word = NULL;`。\n\n使用下面的程序框架来帮助：\n\
    \n```c\n#include <stdio.h>\n#include <errno.h>\n\nint main()\n{\n    char* word;\n\
    \    // 分配内存\n    word = malloc(20 * sizeof(char));\n    // 模拟错误\n    word = NULL;\n\
    \    //------------------在此处输入错误代码------------------------\n    // 删除内存\n    free(word);\n\
    }\n```\n\n### 答案\n\n非常简单，只需要包含：\n\n```c\n#include <stdio.h>\n#include <errno.h>\n\
    \nint main()\n{\n    char* word;\n    // 分配内存\n    word = malloc(20 * sizeof(char));\n\
    \    // 模拟错误\n    word = NULL;\n    if (word == NULL)\n    {\n        fprintf(stderr,\
    \ \"Error: Unable to allocate the memory!\");\n    }\n    // 删除内存\n    free(word);\n\
    }\n```\n\n## 第 5 章练习\n\n1. 如何告诉编译器使用其他文件和库？\n2. 头文件使用什么文件扩展名？\n3. `#define` 是用来用的？\n\
    4. 错误处理需要包含什么 `#include`？\n5. 全局变量 `errno` 中包含什么？\n6. `strerror()` 返回什么？\n7. 打印错误需要哪种文件流？\n\
    8. 类型转换；它是用来做什么的？\n9. `calloc` 和 `malloc` 有什么区别？\n10. 遇到错误的函数通常会返回什么？\n\n## 第\
    \ 2 章答案\n\n1. 浮点型 (Float) 或双精度型 (Double)\n2. 真 (1) 和 假 (0)\n3. 用于检查条件为真为假的语句\n\
    4. 声明、条件和迭代。\n5. 跳过完整迭代\n6. 是的，并且通过使用 `void`\n7. 理论上无限的\n8. `Printf` 使用格式化 ID，`puts`\
    \ 不使用 ID 并自动在字符串末尾添加 `\\n`\n9. `calloc` 分配内存时会初始化，`malloc` 不会\n10. 整数值\n\n## 第\
