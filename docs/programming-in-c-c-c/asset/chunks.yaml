  trans: "\n\n# 答案 (117)\n\n# 第 3 章 (119)\n## 高级类结构 (119)\n### 多态 (119)\n### 接口 (125)\n\
    ### 练习 (127)\n### 命名空间 (127)\n### 章末测验 (131)\n### 答案 (131)\n\n# 第 4 章 (132)\n\
    ## 中级功能 (132)\n### 运算符重载 (132)\n### 练习 (133)\n### 正则表达式 (135)\n### 预处理器指令 (140)\n\
    ### 异常处理 (143)\n### 章末测验 (146)\n### 答案 (146)\n\n# 第 5 章 (147)\n## 程序格式化 (147)\n\
    ### 属性 (147)\n### 反射 (152)\n### 元数据 (152)\n### 索引器 (154)\n### 练习 (158)\n### 集合\
    \ (159)\n### 泛型 (161)\n### 章末测验 (166)\n### 答案 (166)\n\n# 第 6 章 (167)\n## 进程与功能\
    \ (167)\n### 委托 (167)\n### 匿名方法 (171)\n### 事件 (173)\n### 多线程 (175)\n### LINQ (182)\n\
    ### 练习 (184)\n### 章末测验 (186)\n### 答案 (186)\n\n# 第 1 章\n# 安装与简介\n## C# 历史\nC# 首次于\
    \ 2000 年由微软发布，C# 是微软拥有的一种语言，源自 C 语言族。它由 Anders Hejlsberg 领导的团队设计。最初他们提议将语言命名为“Cool”，代表“类\
    \ C 对象对象语言”（C-Like Object Orientated Language），但微软最终决定命名为 C#。使用了井号符号，但读作“sharp”，这是特意选择的，因为当时缺少“sharp”这个字母。以下是\
    \ C# 的时间线以及新增的功能：\n\n- 2002 年 1 月：C# 1.0（面向对象编程）\n- 2005 年 11 月：C# 2.0（泛型、可空类型、迭代器、部分类）\n\
    - 2007 年 11 月：C# 3.0（匿名类型、表达式树、扩展方法）\n- 2010 年 4 月：C# 4.0（动态、可选参数）\n- 2012 年 8\
    \ 月：C# 5.0（异步编程、线程）\n- 2015 年 7 月：C# 6.0（字符串插值、异常过滤器、特性）\n\n## 为什么选择 C#？\nC# 与\
    \ Java 和 Python 等类似语言相比有许多优势：\n- 它极其类型安全。\n- 它对内存有完全控制权。\n- 它提供了丰富的框架。\n\n## 在\
    \ Windows 上运行 C#\n最近发布了 Mac 版 Visual Studio，但它并不具备所有功能。要使用 C#，你需要从微软下载 Visual\
    \ Studio。请运行安装程序并安装。\n\n1. 打开 Visual Studio。\n2. 点击“文件”并选择“新建项目”。\n3. 选择“控制应用程序”（ConsoleApplication）并命名。\n\
    4. 点击“确定”。\n\n# 第 2 章\n# 类与面向对象编程\n## 基本类\n类用于存储与对象相关的变量和功能，例如，可以为 `Book` 创建一个类，它将包含页数、体裁和封面颜色等信息，以及\
    \ `loan`（借出）或 `return`（归还）等功能。这就是类的实用性和真实世界的来源，也是 OOP 中“对象”一词的含义。\n\n在介绍如何创建类之前，需要理解一些访问关键字：\n\
    1. `private`：不能在类的范围之外访问。\n2. `public`：可以在任何地方访问。\n3. `protected`：可以从派生类访问。\n\n\
    你可以这样定义一个类：\n\n```csharp\nclass Book\n{\n}\n```\n\n在括号内定义所有变量和函数后，下面是一个完整的版本：\n\
    \n```csharp\nclass Book\n{\n public Book(int numberOfPages, int currentPage, string\
    \ colour, string name)\n    {\n    _numberOfPages = numberOfPages;\n    _currentPage\
    \ = currentPage;\n    _colour = colour;\n    _name = name;\n    }\n\n private\
    \  int _numberOfPages;\n\n private  int _currentPage;\n\n private  string _colour;\n\
    \n private  string _name;\n\n    public  string changeMe;\n\n public  int returnCurrentPage()\n\
    \    {\n return _currentPage;\n    }\n}\n```\n\n"
- fmt: "\nThere are a few things to note. The function in the box is known as a Constructor\
    \ (Explained in this chapter), it is called when creating a new object. This `class`\
    \ contains all the member variables and member functions, they are both accessed\
    \ by using the member operator (`.`). In this case all the variables are marked\
    \ as `private` meaning they cannot be accessed from outside the class, this is\
    \ where getters and setters (Accessor methods) come into use, the function `returnCurrentPage`\
    \ is a getter and allows access to the `currentPage` value, this is the recommended\
    \ way of dealing with variable access, it allows a platform for the programmer\
    \ to control access to variables.\n\nAn object is created below, with some of\
    \ its functions and variables being accessed:\n\n```csharp\nclass Program\n{\n\
    \    static void Main(string[] args)\n    {\n        Book book1 = new Book(200,\
    \ 32, \"Red\", \"Harry Potter\");\n        book1.changeMe = \"Test\";\n      \
    \  Console.WriteLine(book1.changeMe);\n        int currentPage = book1.returnCurrentPage();\n\
    \        Console.WriteLine(currentPage);\n    }\n}\n```\n\nOutput\n>Test\n>32\n\
    \n## Recap\n1. Classes provide an intuitive way to store data on real world objects.\n\
    2. They allow functionality to be built up around the data.\n3. Are used as a\
    \ cookie-cutter way of making lots of containers for data.\n4. Accessor methods\
    \ allow access to private variables.\n    1. Getters return the variables value.\n\
    \    2. Setters allow to program to change the value.\n\n## Properties\nAs mentioned\
    \ in the previous chapter were Accessor methods, properties allow an easily readable\
    \ solution to accessing member variables in a tiny compact syntax. Properties\
    \ also contain the variable definition. They are defined like so:\n\n```csharp\n\
    public int currentPage\n{\n    get\n    {\n        return currentPage;\n    }\n\
    \    set\n    {\n        currentPage = value;\n    }\n}\n```\n\nAnd called like\
    \ this:\n\n```csharp\nBook book1 = new Book();\nbook1.currentPage = 2; // 2 is\
    \ ‘value’ in the set\nConsole.WriteLine(book1.currentPage);\n```\n\nThis performs\
    \ exactly the same role as the accessors in the previous chapter but with a much\
    \ more concise syntax, for comparison:\n\n```csharp\nprivate int _currentPage;\n\
    public int returnCurrentPage()\n{\n    return _currentPage;\n}\n```\n\nIs equal\
    \ to:\n\n```csharp\npublic int currentPage { get; }\n```\n\nAs you can see it’s\
    \ a much smaller set of code. A more advanced use of the setter could be to validate\
    \ the input. For example, you can’t have a current page that is larger than the\
    \ total number of pages. This code could look like this:\n\n```csharp\nclass Book\n\
    {\n    int totalPages = 500;\n    public int currentPage\n    {\n        get\n\
    \        {\n            return currentPage;\n        }\n        set\n        {\n\
    \            // Validation check\n            if (value < totalPages)\n      \
    \      {\n                currentPage = value;\n            }\n            else\
    \ if(value == totalPages)\n            {\n                Console.WriteLine(\"\
    You've finished the book!\");\n            }\n            else\n            {\n\
    \                // Error message\n                Console.WriteLine(\"Invalid\
    \ current page!\");\n            }\n        }\n    }\n}\n```\n\nThis gives the\
    \ programmer the ability to write code that accounts for many possibilities.\n\
    \n## Static\nAs mentioned in previous chapters member functions allow classes\
    \ to hold functionality that is somehow related to the data contained within,\
    \ this allows classes to be almost self-contained programs this along with member\
    \ variables gives classes their functionality.\n\nMember functions and variables\
    \ can be defined as `static`, meaning the object is ‘always there’. This is used\
    \ when behaviour will not change between all instances of the class and it means\
    \ that the behaviour or variable is shared between them all.\n\nNote: `static`\
    \ functions can only access `static` variables.\n\n```csharp\nusing System;\n\
    namespace ConsoleApplication1\n{\n    class Program\n    {\n        static void\
    \ Main(string[] args)\n        {\n            Example e = new Example();\n   \
    \         e.Instance(); // Error\n            Example.Instance(); // Error\n \
    \           Example.Static(); // Error\n        }\n    }\n    class Example\n\
    \    {\n        public void Instance()\n        {\n            Console.WriteLine(\"\
    Instance!\");\n        }\n        static void Static()\n        {\n          \
    \  Console.WriteLine(\"Static!\");\n        }\n    }\n}\n```\n\nThe example above\
    \ shows how the different types of functions are accessed. Below is an example\
    \ of static within a ‘real-world’ example:\n\n```csharp\nusing System;\nnamespace\
    \ ConsoleApplication1\n{\n    class Program\n    {\n        static void Main(string[]\
    \ args)\n        {\n            int i = Person.WorkAge(new DateTime(1990, 10,\
    \ 15));\n            Console.WriteLine(i);\n        }\n    }\n    class Person\n\
    \    {\n        public Person(string _name, int _age)\n        {\n           \
    \ name = _name;\n            age = _age;\n        }\n        public string name\
    \ { get; }\n        public int age { get; }\n        public static int WorkAge(DateTime\
    \ birthday)\n        {\n            // Time since\n            TimeSpan difference\
    \ = DateTime.Now - birthday;\n            double years = difference.TotalDays\
    \ / 365;\n            return (int)years;\n        }\n    }\n}\n```\n\nThis program\
    \ uses a `static` method to work out the age of somebody using their birthday,\
    \ this allows the method to hold relevant functions without a separate one being\
    \ created per instance.\n\n## Constructors and Destructors\nWhen creating an instance\
    \ of a class a constructor is used, the language provides a default constructor,\
    \ but a custom constructor can be created, you may have the functions without\
    \ a return type and with exactly the same name as the class, to continue with\
    \ our person example:\n\n```csharp\nclass Person\n{\n    public Person()\n   \
    \ {\n        Console.WriteLine(\"Person created\");\n    }\n}\n```\n\nThis is\
    \ a custom constructor that just prints when a `Person` is made. Normally constructors\
    \ are used to pass in data to member variables when an instance of the class is\
    \ created. You can also have as many constructors as you like, however they all\
    \ need varying types and number of parameters (this is known as a function signature)\
    \ so with the example above I could not define another constructor with no parameters,\
    \ this is known as overloading.\n\nFor example:\n\n```csharp\nnamespace ConsoleApplication1\n\
    {\n    class Program\n    {\n        static void Main(string[] args)\n       \
    \ {\n            Person p1 = new Person(\"John\", 32);\n            Person p2\
    \ = new Person(\"James\", 50, \"Train Driver\");\n        }\n    }\n    class\
    \ Person\n    {\n        public Person(string _name, int _age)\n        {\n  \
    \          name = _name;\n            age = _age;\n            job = \"N/A\";\n\
    \        }\n        public Person(string _name, int _age, string _job)\n     \
    \   {\n            name = _name;\n            age = _age;\n            job = _job;\n\
    \        }\n        public string name { get; }\n        public int age { get;\
    \ }\n        public string job { get; }\n    }\n}\n```\n\nThe highlighted sections\
    \ show the use of the overloading, the compiler automatically detects which constructor\
    \ to use depending on the types in the parameter list.\n\nJust like the constructor\
    \ there is a destructor that performs the opposite role of the constructor that\
    \ instead of dealing with creation code the destructor deals with clean-up code.\
    \ A destructor is created like so:\n\n```csharp\nclass Person\n{\n    ~Person()\n\
    \    {\n        Console.WriteLine(\"Person deleted!\");\n    }\n}\n```\n\nThis\
    \ method cannot be called manually but is managed by the internal Garbage Collector\
    \ that is a built-in part of the compiler designed for automatic memory management.\
    \ This can be demonstrated like this, if a method is called that creates an instance\
    \ to `Person` and then the program goes out of scope for the main method the garbage\
    \ collector will be called to clean up the memory\n\n```csharp\nusing System;\n\
    namespace ConsoleApplication1\n{\n    class Program\n    {\n        static void\
    \ Main(string[] args)\n        {\n            Function();\n        }\n       \
    \ static void Function()\n        {\n            Person p1 = new Person();\n \
    \       }\n    }\n    class Person\n    {\n        ~Person()\n        {\n    \
    \        Console.WriteLine(\"Person deleted!\");\n            Console.ReadKey();\n\
    \        }\n    }\n}\n```\n\nOutput\n>Person deleted!\n\n## Exercise\n"
