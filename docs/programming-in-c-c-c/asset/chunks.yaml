    //Switch-Case\n\nswitch (expression)\n{\n//Case statement\n\ncase constant-expression:\n\
    \nbreak; //Break isn't needed\n\n//Any number of case statements\n\n// |\n\n//\
    \ |\n\n//\\ /\n\n// .\ndefault:\n\nbreak;\n\n}\n```\n\nThe switch starts off with\
