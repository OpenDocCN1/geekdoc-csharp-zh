    # Chapter 3: Class Structure and OOP


    Classes are the building blocks of a program, they allow easy way of creating
    places that represent data. A class in C++ has two files, the header file (.h)
    and the implementation file (.cpp).


    A header file looks like this when empty:


    ```cpp

    class Example

    {

    public:

    Example();

    ~Example();

    };

    ```


    The public section defines how methods can be accessed, don’t worry too much about
    this as this will be explained in the Encapsulation section. And `Example()` and
    `~Example()` functions are the Constructor and Destructor respectively, and the
    constructor runs when the class is created, and the destructor runs when the class
    is destroyed, this can either be done manually by calling the method or the compiler
    will do this.


    The .cpp file then looks like this:


    ```cpp

    #include "Example.h"


    Example::Example()

    {

    }


    Example::~Example()

    {

    }

    ```


    Each of these are references to the classes. You can implement functions or variables
    that are not defined in the header file, however this is considered a bad practice.


    So for example lets used a fleshed out version of a class to show how it can be
    used:


    ```cpp

    class Shape

    {

    public:

    Shape(double  len, double  wid);

    ~Shape();

    double getArea();


    private:

    double length;

    double width;

    double area;

    };

    ```


    ```cpp

    #include "Shape.h"

    #include <iostream>


    using namespace std;


    Shape::Shape(double  len, double  wid)

    {

    length = len;

    width = wid;

    area = length * width;

    cout <<  "Shape made!"  << endl;

    }


    Shape::~Shape()

    {

    }


    double  Shape::getArea()

    {

    return area;

    }

    ```


    And an instance of shape can be made like so:


    ```cpp

    Shape s = Shape(10, 10);

    ```


    Note: the header file needs including at the top:


    ```cpp

    #include "Shape.h"

    ```


    This gives the programmer a really easy way to create lots of containers for useful
    data.


