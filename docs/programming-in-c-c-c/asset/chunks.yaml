    \ 0: i is equal to: 1\n\n>Thread 0: i is equal to: 2\n\n>Thread 0: i is equal\
    \ to: 3\n\n>Thread 0: i is equal to: 4\n\n>Thread 2: i is equal to: 0\n\n>Thread\
    \ 2: i is equal to: 1\n\n>Thread 2: i is equal to: 2\n\n>Thread 2: i is equal\
    \ to: 3\n\n>Thread 2: i is equal to: 4\n\n>Thread 1: i is equal to: 0\n\n>Thread\
    \ 1: i is equal to: 1\n\n>Thread 1: i is equal to: 2\n\n>Thread 1: i is equal\
    \ to: 3\n\n>Thread 1: i is equal to: 4\n\n>Thread 3: i is equal to: 0\n\n>Thread\
    \ 3: i is equal to: 1\n\n>Thread 3: i is equal to: 2\n\n>Thread 3: i is equal\
    \ to: 3\n\n>Thread 3: i is equal to: 4\n\n>Thread 4: i is equal to: 0\n\n>Thread\
    \ 4: i is equal to: 1\n\n>Thread 4: i is equal to: 2\n\n>Thread 4: i is equal\
    \ to: 3\n\n>Thread 4: i is equal to: 4\n\nAs you can see each iteration loop is\
    \ coming through in order, i.e. from 0 – 4, may also be able to see that the threads\
    \ are not necessarily in order, the lock works on a first come first serve basic\
    \ and once a thread touches it, it becomes locked until the object is released.\
    \ Please also not the use of an object alongside the lock, this is used as a flag\
    \ for if the lock is available or locked.\n\nThis lock system is very useful when\
    \ it comes to dealing with files, if two threads were to try and read or write\
    \ to a file at the same time there will be errors or lines would not appear in\
    \ order. Below is an example demoing this:\n\nusing System;\n\nusing System.IO;\n\
    \nusing System.Threading;\n\nnamespace ConsoleApplication1\n\n{\n\n class  Program\n\
    \n    {\n\n public  static  void WriteToFile()\n\n        {\n\n //Error here!\n\
    \n StreamWriter sw = new  StreamWriter(\"file.txt\");\n\n for (int i = 0; i <\
    \ 5; i++)\n\n            {\n\n                sw.WriteLine($\"Test {i}\");\n\n\
                }\n\n            sw.Close();\n\n        }\n\n static  void Main()\n\
    \n        {\n\n for (int i = 0; i < 5; i++)\n\n            {\n\n //Creates a thread\n\
    \n Thread s = new  Thread(WriteToFile);\n\n //Assigns the thread a name\n\ns.Name\
    \ = $\"Thread {i}\";\n\n                s.Start();\n\n            }\n\n Console.ReadKey();\n\
    \n        }\n\n    }\n\n}\n\nThis will crash and throw a System.IO.IOException\
    \ as two or more threads will try and open the file to write to it at the same\
    \ time. This is a real-world usage for the lock structure as adding a lock will\
    \ solve this, below is the lock being introduced, this will solve the issue:\n\
    \nusing System;\n\nusing System.IO;\n\nusing System.Threading;\n\nnamespace ConsoleApplication1\n\
    \n{\n\n class  Program\n\n    {\n\n static  object padLock = new  object();\n\n\
    \ public  static  void WriteToFile()\n\n        {\n\n lock (padLock)\n\n           \
    \ {\n\n StreamWriter sw = new  StreamWriter(\"file.txt\");\n\n for (int i = 0;\
    \ i < 5; i++)\n\n                {\n\n                    sw.WriteLine($\"Test\
    \ {i}\");\n\n                }\n\n                sw.Close();\n\n Console.WriteLine(\"\
    File written to!\");\n\n            }\n\n        }\n\n static  void Main()\n\n\
            {\n\n for (int i = 0; i < 5; i++)\n\n            {\n\n //Creates a thread\n\
    \n Thread s = new  Thread(WriteToFile);\n\n //Assigns the thread a name\n\ns.Name\
    \ = $\"Thread {i}\";\n\n                s.Start();\n\n            }\n\n Console.ReadKey();\n\
    \n        }\n\n    }\n\n}\n\nThis code will now not crash, but it really cannot\
    \ be considered multithreaded, it used multiple threads but effectively acts as\
    \ a single threaded application, the lock statement should only be used when it’s\
    \ entirely necessary. Copy this code over and have a play with it and get familiar\
    \ with how this code works.\n\n## LINQ\n\nLINQ stands for Language Integrated \
    \ Query and solves the problems with querying data and allows a tight readable\
    \ compact syntax for returning queries from data.\n\nWe’ll only be covering the\
    \ LINQ queries for internal objects, but LINQ can be used to query data represented\
    \ in many different  ways. The diverse ways are:\n\n*   LINQ to objects\n\n* \
    \  LINQ to XML\n\n*   LINQ to datasets\n\n*   LINQ to SQL (DLINQ)\n\n*   LINQ\
    \ to entities\n\nThere are two types of syntax for LINQ:\n\n*   Lambda (Method)\
    \ Syntax:\n\nvar longWords = words.Where(w => w.Length > 10);\n\n*   Query (Compression)\
    \ Syntax"
