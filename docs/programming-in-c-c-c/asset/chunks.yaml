    {\n    public override void SayHello()\n    {\n        Console.WriteLine(\"Hola!\"\
    );\n    }\n}\nclass French : Human\n{\n    public override void SayHello()\n \
    \   {\n        Console.WriteLine(\"Bonjour!\");\n    }\n}\nclass Program\n{\n\
    \    static void Main(string[] args)\n    {\n        American a = new American();\n\
