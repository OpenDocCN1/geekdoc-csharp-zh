    \n### Switch-Case\n\nSwitch cases 用于测试变量是否与常量表达式相等，而不需要多个 `if` 语句。这种结构的一个用处是检查用户输入的字符串。以下是\
    \ switch case 的基本结构：\n\n```cpp\n// Switch-Case\n\nswitch (expression)\n\n{\n\n\
    // Case 语句\n\ncase constant-expression:\n\nbreak; // 不需要 Break\n\n// 任意数量的 case\
    \ 语句\n\n// |\n\n// |\n\n//\\ /\n\n// .\ndefault:\n\nbreak;\n\n}\n```\n\nswitch\
    \ 从一个“表达式”开始，这是要与“常量表达式”比较的变量，这些常量是变量的字面值，例如‘1’或‘Z’。Break 是可选的，但如果没有它们，代码将“向下流动”到其他语句。下面是一个使用\
    \ switch-case 语句的示例，用户输入一个字符，如果 `char` 是 `N` 或 `Y`，分别输出“No”和“Yes”，但有一个适用于所有情况的默认\
    \ case，这需要放在最后。\n\n```cpp\nchar character;\n\n// 读取用户输入（稍后会详细解释）\nscanf(\"%s\"\
    , &character);\n\n// Switch-Case\n\nswitch (character)\n\n{\n\ncase  'N':\n\n\
    printf(\"NO\\n\");\n\nbreak;\n\ncase  'Y':\n\nprintf(\"YES\\n\");\n\nbreak;\n\n\
    default:\n\nprintf(\"Do not understand!\\n\");\n\nbreak;\n\n}\n```\n\n如果没有 `break`\
    \ 语句，将会发生“向下流动”，下面是一个与上面类似但没有 `break` 语句的示例，输出如下：\n\n```cpp\nchar character;\n\
    \n// 读取用户输入（稍后会详细解释）\nchar character;\n\ncin >> character;\n\n// Switch-Case\n\
    \nswitch (character)\n\n{\n\ncase  'N':\n\nprintf(\"NO\\n\");\n\ncase  'Y':\n\n\
    printf(\"YES\\n\");\n\ndefault:\n\nprintf(\"Do not understand!\\n\");\n\n}\n```\n\
    \n如果输入是‘N’，输出将是：\n\n>NO\n>YES\n>Do not understand!\n\n这是因为当一个 case 语句触发时，它会继续向下执行直到找到\
    \ `break` 语句停止运行 case 主体。\n\n## 迭代\n\n迭代意味着循环，循环让程序能够快速执行许多相似的操作，迭代有两种类型：`for`\
    \ 循环和 `while` 循环/`do-while` 循环。\n\n### For Loop\n\n`for` 循环被赋予一个结束值并循环到该值为止，同时跟踪计数器：\n\
    \n```cpp\nfor (int x = 0; x < 10; x++)\n\n{\n    cout << \"Loop\" << endl;\n}\n\
    ```\n\n### While Loop\n\n`while` 循环允许只要某个条件保持真就一直执行代码。\n\n```cpp\nwhile (condition)\n\
    \n{\n    // 只要条件为真，代码就会运行\n}\n```\n\n### Do-While Loop\n\n`do-while` 循环确保在检查条件之前至少执行一次代码块。\n\
    \n```cpp\ndo\n\n{\n    // 代码至少执行一次\n} while (condition);\n```\n"
