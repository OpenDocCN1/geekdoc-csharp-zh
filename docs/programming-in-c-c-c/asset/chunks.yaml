    ```\n\n**Protected** 仅允许类及其派生类访问成员。\n\n```csharp\nclass MyClass\n{\n    protected\
    \ int value;\n}\n```\n\n**Private** 仅允许类内部访问成员。\n\n```csharp\nclass MyClass\n\
    {\n    private int value;\n}\n```\n\n**Internal** 允许在同一个程序集中的代码访问成员。\n\n```csharp\n\
    class MyClass\n{\n    internal int value;\n}\n```\n\n**Protected internal** 允许在同一个程序集内或派生类中访问成员。\n\
