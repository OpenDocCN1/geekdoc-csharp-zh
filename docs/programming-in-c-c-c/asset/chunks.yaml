    \ set; }\n}\n\n//创建一个 2D 矩形\nclass Rectangle : Shape\n{\n    public Rectangle(int\
    \ w, int h)\n    {\n        height = h;\n        width = w;\n    }\n    public\
    \ override int Volume()\n    {\n        return height * width;\n    }\n}\n\n//创建一个\
    \ 3D 圆柱体\nclass Cylinder : Shape\n{\n    public Cylinder(int w, int h)\n    {\n\
    \        height = h;\n        width = w;\n    }\n    public override int Volume()\n\
    \    {\n        //(π * (width / 2)³) * height\n        return (int)(Math.PI *\
    \ Math.Pow(width / 2, 3)) * height;\n    }\n}\n\nclass Program\n{\n    static\
    \ void Main(string[] args)\n    {\n        Rectangle rec = new Rectangle(10, 10);\n\
    \        Console.WriteLine(rec.Volume());\n        Cylinder cylin = new Cylinder(10,\
    \ 10);\n        Console.WriteLine(cylin.Volume());\n        Console.ReadKey();\n\
    \    }\n}\n```\n\n在此处需要注意几点：矩形包围的区域是抽象类的定义，其中定义了一个抽象的 `Volume()` 方法，该方法在其他方法中被采用并重载。注意使用的\
    \ `override` 关键字，它用于创建 `Volume()` 的自定义定义，每个类都有一个 `Volume` 的自定义设计，该设计在 `Main` 方法中被调用。抽象类要求继承它的方法必须创建一个重载版本。这意味着抽象类被设计为对方法的形状和布局有非常严格的规划。\n\
    \n还有另一种类型的动态重载，它被称为 `Virtual`（虚拟），这与抽象非常相似，但是一个可选版本，其中基类中的定义可以可选地被重写，下面是一个示例：\n\
    \n```csharp\nusing System;\n\nnamespace ConsoleApplication1\n{\nclass Human\n\
    {\n    public virtual void SayHello()\n    {\n        Console.WriteLine(\"Hello!\"\
    );\n    }\n}\nclass American : Human\n{\n    // 不需要重写，因为 SayHello 是有效的\n}\nclass\
    \ Columbian : Human\n{\n    public override void SayHello()\n    {\n        Console.WriteLine(\"\
    Hola!\");\n    }\n}\nclass French : Human\n{\n    public override void SayHello()\n\
    \    {\n        Console.WriteLine(\"Bonjour!\");\n    }\n}\nclass Program\n{\n\
    \    static void Main(string[] args)\n    {\n        American a = new American();\n\
    \        a.SayHello();\n        Columbian c = new Columbian();\n        c.SayHello();\n\
    \        French f = new French();\n        f.SayHello();\n        Console.ReadKey();\n\
    \    }\n}\n}\n```\n\n如你所见，每个类都继承自 `Human` 类，某些类重写了虚拟类，但像 `American` 类这样的类不需要重写它，这提供了需要时更改类的选项。\n\
    \n## 接口 (Interfaces)\n\n接口是非常结构化的，它们是每个继承方法必须遵循的蓝图，就像合同一样。接口非常像抽象类，但抽象类应该被继承和可能扩展，而接口应该被实现。接口允许函数定义与实现分离，并提高可读性和设计。\n\
    \n接口的定义如下，每个要创建的方法或属性都放在一种……中，接口不能包含实现。\n\n```csharp\ninterface ITransaction\n\
    {\n    //方法\n    void Process();\n}\n```\n\n下面是一个使用接口处理车辆（Vehicles）的示例：\n\n```csharp\n\
    interface IVehicle\n{\n    string Colour { get; }\n    string EngineType { get;\
    \ }\n    int NumberOfWheels { get; }\n    int Gas { get; }\n    void StartEngine();\n\
    \    void StopEngine();\n}\nclass Car : IVehicle\n{\n    string Colour { get;\
    \ }\n    string EngineType { get; }\n    int NumberOfWheels { get; } = 4;\n  \
    \  int Gas { get; }\n    public void StartEngine()\n    {\n        Console.WriteLine(\"\
    Started Engine!\");\n    }\n    public void StopEngine()\n    {\n        Console.WriteLine(\"\
    Stopped Engine!\");\n    }\n    public Car(string colour, string engineType, int\
    \ gas)\n    {\n        Colour = colour;\n        EngineType = engineType;\n  \
    \      Gas = gas;\n    }\n}\n```\n\n如你所见，`Car` 必须实现 `IVehicle` 接口中定义的所有项目，这在创建新类时提供了一种“即插即用”的效果，因为设计和布局被严格执行了。\n\
    \n## 练习 (Exercise)\n\n使用之前的示例，使用 `IVehicle` 实现一个名为 `Bike` 的新类，感受接口是如何工作的。\n\n\
    ### 答案 (Solution)\n\n实现的类应该像这样：\n\n```csharp\nclass Bike : IVehicle\n{\n    string\
    \ Colour { get; }\n    string EngineType { get; }\n    int NumberOfWheels { get;\
    \ } = 2;\n    int Gas { get; }\n    public void StartEngine()\n    {\n       \
    \ Console.WriteLine(\"Started Engine!\");\n    }\n    public void StopEngine()\n\
    \    {\n        Console.WriteLine(\"Stopped Engine!\");\n    }\n    public Bike(string\
    \ colour, string engineType, int gas)\n    {\n        Colour = colour;\n     \
    \   EngineType = engineType;\n        Gas = gas;\n    }\n}\n```\n\n## 命名空间 (Namespaces)\n\
    \n命名空间用于分离定义，它使得在一个命名空间中定义的名称不会与另一个命名空间冲突。\n\n命名空间的定义如下：\n\n```csharp\nnamespace\
    \ Namespace1\n{\n}\n```\n\n要调用另一个命名空间的函数，你可以使用成员运算符（.`），其方法如下：`Namespace1.Class\
    \ c = new Namespace1.Class();`。注意：命名空间不能直接包含函数或变量定义。\n\n下面使用另一个命名空间的示例：\n\n```csharp\n\
    using System;\n\nnamespace ConsoleApplication1\n{\nclass Program\n{\n    class\
    \ SameName\n    {\n        public void Function()\n        {\n            Console.WriteLine(\"\
    Main!\");\n        }\n    }\n    static void Main(string[] args)\n    {\n    \
    \    SameName s1 = new SameName();\n        s1.Function();\n        Namespace1.SameName\
    \ s2 = new Namespace1.SameName();\n        s2.Function();\n        Console.ReadKey();\n\
    \    }\n}\n}\n\nnamespace Namespace1\n{\n    class SameName\n    {\n        public\
    \ void Function()\n        {\n            Console.WriteLine(\"Namespace1!\");\n\
    \        }\n    }\n}\n```\n\n输出\n> Main!\n> Namespace1!\n\n注意有两个名为“SameName”的类，以及你如何通过命名空间来指定哪一个。\n\
    \n其他文件或此文件的命名空间可以通过 `using` 关键字自动指定，你可能注意到代码顶部出现了 `using System;`，这基本上是告诉程序使用“System”命名空间来处理\
    \ `Console.WriteLine(\"\");` 和 `Console.ReadKey()` 等项。\n\n如果没有 `using` 语句，去掉前面的命名空间限定符：\n\
    \n```csharp\nusing System;\n\nnamespace ConsoleApplication1\n{\nclass Program\n\
    {\n    class SameName\n    {\n        public void Function()\n        {\n    \
    \        Console.WriteLine(\"Main!\");\n        }\n    }\n    static void Main(string[]\
    \ args)\n    {\n        Namespace1.Class c = new Namespace1.Class();\n       \
    \ c.Function();\n        Console.ReadKey();\n    }\n}\n}\n\nnamespace Namespace1\n\
    {\n    class SameName\n    {\n        public void Function()\n        {\n    \
    \        Console.WriteLine(\"Namespace1!\");\n        }\n    }\n}\n```\n\n使用 `using`\
    \ 语句：\n\n```csharp\nusing System;\nusing Namespace1;\n\nnamespace ConsoleApplication1\n\
    {\nclass Program\n{\n    static void Main(string[] args)\n    {\n        Class\
    \ c = new Class();\n        c.Function();\n        Console.ReadKey();\n    }\n\
    }\n}\n```\n\n注意 `Class` 引用现在变得更短且更易读了。\n\n## 章末测试\n\n*   实现多态的两种主要方式是什么？\n*  \
    \ 当一个合同或函数有多个版本时，称之什么？\n*   将类定义为 `sealed`（密封）可以实现什么？\n*   你不能对抽象类做什么？\n*   在实现抽象或虚拟方法时使用哪个关键字？\n\
    *   命名空间用于什么目的？\n\n"
- fmt: "\n* Can you create an abstract method that isn’t housed in an abstract class?\n\
    * What is the main difference between an `Interface` and an abstract class?\n\
    * What operator is used when accessing the items of a namespace?\n* How can you\
    \ tell the complier to include another namespace automatically?\n\n## Answers\n\
    \n* Static and Dynamic polymorphism.\n* Overloading.\n* Means the class cannot\
    \ be inherited.\n* Directly create an instance of it.\n* Overload.\n* To separate\
    \ names of classes and methods.\n* No, all abstract methods need to be in an abstract\
    \ class.\n* Interfaces do not allow implementation to be added and are a blueprint\
    \ to design new classes.\n* The member operator (full stop).\n* By adding a `using`\
    \ statement at the top of the program.\n\n# Chapter 4\n\n# Intermediate functionality\n\
    \n## Operator overloading\n\nC# has support for altering the functionality of\
    \ many of the built-in operators, such as `+` or the member operator `.` we have\
    \ come across previously. Operator overloaders are special functions that include\
    \ the keyword `operator` followed by the operator sign, exactly like any other\
    \ function overloaded operators have a return type and parameter list.\n\nIn this\
    \ example, we’re going to create a class called `Grade` and overload the plus\
    \ operator. An operator overloader is defined like so:\n\n```csharp\npublic static\
    \ Grade operator+(Grade a, Grade b)\n{\n\n}\n```\n\nNote: The `operator` function\
    \ needs to be static and public.\n\nThe example below implements this overloaded\
    \ operator:\n\n```csharp\nusing System;\n\nnamespace ConsoleApplication1\n{\n\
    \    class Program\n    {\n        static void Main(string[] args)\n        {\n\
    \            Grade a = new Grade(30);\n            a.Print();\n            Grade\
    \ b = new Grade(40);\n            b.Print();\n            Grade c = a + b;\n \
    \           c.Print();\n            Console.ReadKey();\n        }\n    }\n   \
    \ class Grade\n    {\n        int mark;\n        public Grade(int m)\n       \
    \ {\n            mark = m;\n        }\n        public void Print()\n        {\n\
    \            Console.WriteLine($\"The mark is: {mark}\", mark);\n        }\n \
    \       public static Grade operator+(Grade a, Grade b)\n        {\n         \
    \   Grade c = new Grade(0);\n            c.mark = a.mark + b.mark;\n         \
    \   return c;\n        }\n    }\n}\n```\n\nOutput\n> The mark is: 30\n> The mark\
    \ is: 40\n> The mark is: 70\n\nThe operator in this instance just takes the mark\
    \ of each grade instance and pluses the result. This is a very basic example and\
    \ operator overloading can be incredibly useful.\n\n## Exercise\n\nSo for example\
    \ if we wanted to compare two grades at the moment if we added:\n\n```csharp\n\
    if (a == b)\n{\n    Console.WriteLine(\"Equal grades!\");\n}\n```\n\nAnd set both\
    \ grades mark to exactly the same, let’s say 30. It should print out “Equal grades”\n\
    \nOverload the `==` operator to compare both marks and see if they’re equal.\n\
    \nNote:\n* The operator overload function should return a `bool`.\n* The `!=`\
    \ Operator also needs to be implemented alongside (This will just do the complete\
    \ opposite)\n\n## Solution\n\nThe entire program should look like the example,\
    \ the new additions are surrounded by the box.\n\n```csharp\nusing System;\n\n\
    namespace ConsoleApplication1\n{\n    class Program\n    {\n        static void\
    \ Main(string[] args)\n        {\n            Grade a = new Grade(30);\n     \
    \       a.Print();\n            Grade b = new Grade(30);\n            b.Print();\n\
    \            //Test\n            if (a == b)\n            {\n                Console.WriteLine(\"\
    Equal grades!\");\n            }\n            Console.ReadKey();\n        }\n\
    \    }\n    class Grade\n    {\n        int mark;\n        public Grade(int m)\n\
    \        {\n            mark = m;\n        }\n        public void Print()\n  \
    \      {\n            Console.WriteLine($\"The mark is: {mark}\", mark);\n   \
    \     }\n        public static Grade operator+(Grade a, Grade b)\n        {\n\
    \            Grade c = new Grade(0);\n            c.mark = a.mark + b.mark;\n\
    \            return c;\n        }\n        public static bool operator==(Grade\
    \ a, Grade b)\n        {\n            return a.mark == b.mark;\n        }\n  \
    \      public static bool operator!=(Grade a, Grade b)\n        {\n          \
    \  return a.mark != b.mark;\n        }\n    }\n}\n```\n\nOutput\n> The mark is:\
    \ 30\n> The mark is: 30\n> Equal grades!\n\n## Regular expressions\n\nRegular\
    \ expressions are a way of matching patterns in inputted text, the `.NET` framework\
    \ has built in regular expression support. This will be an overview of how to\
    \ use expressions, there are a lot of combinations to learn and doing some research\
    \ after this chapter.\n\nEach regular expression needs to be constructed, below\
    \ is a list of each character, operator and function that allows you to create\
    \ a regular expression:\n\n### Anchors & Extras\n\n| Character | Description |\n\
    | :--- | :--- |\n| `^` | Is reference to the start of the word |\n| `$` | Refers\
    \ to the end of a string |\n| `\\w` | Refers to a word consisting of a-z, A-Z,\
    \ 0-9 and underscore |\n| `+` | Refers to 0 or more occurrences |\n| `\\|` | Used\
    \ to specify ‘or’ |\n| `[nnn]` | Used to specify a character class to check with,\
    \ i.e. `[abcd]` will only return matches on abc and |\n\nSo for example the regex:\
    \ `^\\w+$` Looks intimidating I know, but it simply matches any word it is given,\
    \ using `System.Text.RegularExpression` we can match a pattern. The code below\
    \ demonstrates it:\n\ncsharp\nusing System;\nusing System.Text.RegularExpressions;\n\
    \nnamespace ConsoleApplication1\n{\n    class Program\n    {\n        static void\
    \ Main(string[] args)\n        {\n            while (true)\n            {\n  \
    \              //Change expression here!\n                string regExpression\
    \ = @\"^\\w+$\";\n                Console.WriteLine(\"Please input text\");\n\
    \                string input = Console.ReadLine();\n                if (Regex.IsMatch(input,\
    \ regExpression))\n                {\n                    Console.WriteLine($\"\
    {input} is a match!\", input);\n                }\n                else\n    \
    \            {\n                    Console.WriteLine(\"No match!\");\n      \
    \          }\n                Console.WriteLine();\n            }\n        }\n\
    \    }\n}\n```\n\nCopy over this program to a Visual Studio project and run it,\
    \ try different inputs out. Anything that includes just A-Z, a-z, 0-9 and an underscore\
    \ will match, but spaces and punctuation for example will not return a match.\n\
    \nNote the use of the `@` sign, this is put before a string that want its value\
    \ to be taken literally, i.e. turning off backslash to specify special characters.\n\
    \nAnother more complex example is: `^([\\w]+\\.[\\w]+)$`\n\nThe sections in the\
    \ square brackets specifies the character set, so in this case it’s saying any\
    \ word with (A-Z, a-z, 0-9 and ‘_’) is valid, then it goes onto `\\.` which checks\
    \ for a fullstop, and the `[\\w]+` is repeated again after the stop, so this regex\
    \ looks for a pattern of a word separated by a full stop. Add this expression\
    \ to the program used in the previous example and try it out.\n\nThis can now\
    \ be adapted to this complex regex used for identifying email addresses, each\
    \ section will be explained:\n\n`^((([\\w]+\\.[\\w]+))|([\\w]+))\\@([\\w]+\\.)+([A-Za-z]{1,2}\\\
    .([A-Za-z]{1,2})|([A-Za-z]{1,3}))$`\n\nThe regex will now identify email addresses.\n\
    \n* `(([\\w]+\\.[\\w]+)|[\\w]+))`\n    * Is equal to any number of standard characters\
    \ split between with a `.` followed by any number of standard characters\n   \
    \ * OR (`|`)\n    * Any number of standard characters\n* `\\@([\\w]+\\.)+`\n \
    \   * `\\@` will match just an `@` sign\n    * Followed by any number of characters\n\
    \    * Followed by a full stop\n    * `+` means any number of the items in brackets\n\
    * `([A-Za-z]{1,2}\\.([A-Za-z]{1,2})|([A-Za-z]{1,3}))`\n    * `[A-Za-z]` specifies\
    \ that a word made up of just upper and lower-case letters, the `{1,2}` specifies\
    \ the length of the word, a minimum of 1 and a max of 2 characters\n    * `\\\
    .` separated by a `.`\n    * Another `[A-Za-z]{1,2}`\n    * OR (`|`)\n    * `[A-Za-z]{1,3}`\
    \ – Same as `[A-Za-z]{1,2}` but with a larger maximum length\n\n### Character\
    \ Escapes\n\nIn regular expression, the backslash `\\` signify that the character\
    \ or group of character following it are special or to be taken literally:\n\n\
    | Character | Description | Unicode Number (hex) |\n| :--- | :--- | :--- |\n|\
    \ `\\t` | Will match a tab character | 0009 |\n| `\\r` | Will match a carriage\
    \ return (Note this is not the same as a newline `\\n`) | 000D |\n| `\\f` | Matches\
    \ a form feed (Better known as a page break | 000C |\n| `\\n` | Matches a new\
    \ line | 000A |\n"
