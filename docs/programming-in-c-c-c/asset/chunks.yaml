    # Chapter 1\n\n# Setup and Introduction\n\n## History of C#\n\nC# first appeared\
    \ in 2000 when it was announced by Microsoft, C# is a Microsoft owned language\
    \ stemming from the C family. It was designed by a team run by Anders Hejlsberg.\
    \ Initially it proposed the language would be called “Cool” standing for “C-Like\
    \ Object Orientated Language” with Microsoft finally deciding to call it C#. The\
    \ hash symbol is used but pronounced as ‘sharp’, this was chosen on purpose because\
    \ of the lack of sharp symbol on many of the keyboards at the time. The sharp\
    \ symbol also resembles four plus symbols in a 2x2 grid, strongly implying that\
    \ C# is a later increment of its brother language C++.\n\nBelow is a timeline\
    \ of the C# language and what inclusions each increment added or improved (All\
    \ features will be explained later in the tutorial):\n\nJan 2002\n\nC# 1.0\n\n\
    -Type safe programming language\n\n-Modern\n\n-OOP (Object Orientated Programming)\n\
    \nNov 2005\n\nC# 2005\n\n-Generics\n\n-Partial classes\n\n-Anonymous types\n\n\
    -Iterators\n\n-Nullable types\n\n-Static classes\n\nNov 2007\n\nC# 2007\n\n-Improvements\
    \ of previous additions\n\n-Extensions methods\n\n-Expression trees\n\n-Partial\
    \ methods\n\nApril 2010\n\nC# 4.0\n\n-Dynamic binding\n\n-Naming and optional\
    \ arguments\n\nAug 2012\n\nC# 5.0\n\n-Asynchronous Programming\n\nA huge addition\
    \ allowing programmers to create multithreaded applications\n\n-Caller info attributes\n\
    \nJuly 2015\n\nC# 6.0 (Version in this tutorial)\n\n-Exception filters\n\n-String\
    \ interpolation\n\n-Static type members into namespaces\n\n-Complier as a service\n\
    \n## Why C#?\n\nC# has many advantages over other similar languages like Java\
    \ and Python.\n\n*   C# is incredibly type safe meaning when a variable is created\
    \ a type must be defined, that means another type cannot be housed in this variable.\n\
    \n*   C# has full control over memory leaks that are a big worry for many C++\
    \ programmers.\n\n*   C# also provides a rich library of features that’s allows\
    \ implementing extra features easy and straightforward\n\n*   Any system with\
    \ the .NET framework will run this application. However, the framework is mainly\
    \ supported on Windows, meaning Linux and Mac support is thin or entirely non-existent.\n\
    \n## Running C# on Windows\n\nRunning C# in my opinion is the best way and pretty\
    \ much only way to code and work with C#, it a Microsoft created language and\
    \ they have done everything they can to make it easy to work with on a Windows\
    \ machine, even if it means ignoring other platforms entirely.\n\nMac Users:\n\
    \nThere has recently been a release of Visual Studio for Mac, but it is rudimental\
    \ and does not have the features that Windows Visual Studio has, it is therefore\
    \ heavily advised to work with C# on a Windows machine. But, there are ways to\
    \ have a Windows OS to run on a Mac, look up “Virtual Box” by Oracle, it is a\
    \ program that allows you to run a virtual Windows machine.\n\nTo work with C#,\
    \ you will need to download Visual Studio, it can be downloaded directly from\
    \ Microsoft. Please run the installer and install Visual Studio.\n\nWhen you have\
    \ a fully working instillation you should be greeted with this screen:\n\n![](Images/image00620.jpeg)\n\
    \nClick File and then select “New Project”\n\n![](Images/image00621.jpeg)\n\n\
    You’ll be presented with the screen below, select ConsoleApplication and give\
    \ it a name below:\n\n![](Images/image00622.jpeg)\n\nClick “Ok”. You’ll then be\
    \ presented with some code where you’ll be ready to program.\n\n# Chapter 2\n\n\
    # Classes and Object Orientated Programming\n\n## Basic classes\n\nClasses are\
    \ used to store variable and functionality relevant to an object, for example\
    \ there can be a class created for a ‘Book’, it would have information such as\
    \ number of pages, genre and cover colour and functionality like ‘loan book’ or\
    \ ‘return book’. This is where the whole useful and real world related nature\
    \ comes from with classes, and the word object in the OOP.\n\nBefore we go into\
    \ how to create a class there are accessor keywords that need to be understood:\n\
    \n11.  private Cannot be accessed outside the scope of the class\n\n12.  public\
    \ Can be accessed anywhere\n\n13.  protected Can be accessed from inherited classes\n\
    \nYou define a class like so:\n\nclass  Book\n\n{\n\n}\n\nWith all its variables\
    \ and functions defined within the brackets, a fleshed-out version is below:\n\
    \nclass  Book\n\n{\n\n public Book(int numberOfPages, int currentPage, string\
    \ colour, string name)\n\n        {\n\n            _numberOfPages = numberOfPages;\n\
    \n            _currentPage = currentPage;\n\n            _colour = colour;\n\n\
                _name = name;\n\n        }\n\n private  int _numberOfPages;\n\n private\
    \  int _currentPage;\n\n private  string _colour;\n\n private  string _name;\n\
    \n        public  string changeMe;\n\n public  int returnCurrentPage()\n\n       \
    \ {\n\n return _currentPage;\n\n        }\n\n}"
