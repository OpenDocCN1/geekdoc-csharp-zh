  trans: "\n6. 有效函数可以不返回返回值吗？如果是，使用的是什么数据类型？\n\n7. 函数可以有多少个参数？\n\n8. `printf` 和 `puts`\
    \ 之间有什么区别？\n\n9. 对于格式符“%d”，哪种类型是有效的输入？\n\n10. 你会使用什么代码来查找数组可以容多少个值？\n\n# 第 3 章\n\
    \n# 进阶基础\n\n## 指针\n\n之前提到过指针，它们是变量的内存地址，这就像是一个人的家庭地址。这些地址可以作为参数传递，并允许实现前面提到的引用传递的效果。\n\
    \n下面的程序将显示变量的地址：\n\n```c\n#include <stdio.h>\n\nint main()\n{\nint var;\nprintf(\"\
    The address is: %x\\n\", &var);\nreturn 0;\n}\n```\n\n输出\n\n> The address is:\
    \ 10ffa2c\n\n注意：几乎每次运行程序时这个值都会不同。\n\n注意高亮显示的语句，`&`（取地址运算符）用于返回变量的内存位置，并允许某些语句访问该位置的数据。使用\
    \ `%x` 是因为内存位置是十六进制的。\n\n要创建一个指针，我们使用解引用运算符（`*`），这会创建一个用于存储内存地址的指针变量。下面的程序创建了一个指针，并使用取地址运算符（`&`）将另一个普通变量的地址存储在新创建的指针中。解引用运算符（`*`）也用于访问或修改内存位置中的实际数据。\n\
    \n*   解引用运算符（`*`）用于创建指针，在更改实际值时也会使用\n*   取地址运算符（`&`）用于获取指针的内存位置\n\n```c\n// 普通变量\n\
    int var = 10;\n\n// 指针\nint* pointer;\n\n// 存储 var 的内存位置\npointer = &var;\n\n\
    // 指针现在等同于 'var'，所以\n// 可以发生这样的操作\n*pointer = 20;\n\nprintf(\"Var's value is now:\
    \ %d\", var);\n```\n\n输出\n\n>Var's value is now: 20\n\n### NULL 指针\n\n当你创建一个指针时，它最初并没有被赋予任何目标，这是危险的，因为指针在创建时会引用随机内存，更改该内存位置的数据可能会导致程序崩溃。为了防止这种情况，我们在创建指针时会将其赋值为\
    \ `NULL`，如下：\n\n```c\nint* pointer = NULL;\n```\n\n这意味着指针的地址为‘0’，这是一个用于标识空指针的保留内存位置。可以通过\
    \ `if` 语句检查空指针：\n\n```c\nif (pointer){}\n```\n\n如果指针不为空，则该语句执行成功。\n\n### 使用指针\n\
    \n现在指针的一些真实世界用途是将它们作为参数传递，并有效地通过引用传递。下面的示例将展示这种效果：\n\n```c\nvoid Change_Value(int*\
    \ reference)\n{\n// 修改内存位置中的值\n*reference = 20;\n}\n\nint main()\n{\n// 创建指向变量的指针\n\
    int var = 10;\nint* pointer = &var;\nprintf(\"The value before call: %d\\n\",\
    \ var);\n// 调用方法\nChange_Value(pointer);\n\n// 打印新值\nprintf(\"The value after\
    \ call: %d\\n\", var);\nreturn 0;\n}\n```\n\n输出\n\n>The value before call: 10\n\
    >The value after call: 20\n\n这传递的是变量的内存位置而非值，这意味着你拥有一个可以进行更改的位置。\n\n注意参数是 `int*`，这是指针类型，所以指向\
    \ `char` 的指针示例将是 `char*`。\n\n### 指针运算\n\n有时将指针移动到另一个内存位置可能是很有用的，这就是指针运算大用用场。如果我们执行例如\
    \ `ptr++` 且 `ptr` 是整数指针，那么它现在将移动 4 字节（`int` 的大小），再次运行则会再移动 4 字节，以此此类推。这意味着指针（如果指向有效的数组结构）可以像数组一样工作。下面是一个示例：\n\
    \n```c\nint arrayInt[] = { 10, 20, 30 };\nsize_t arrayInt_Size = 3;\n// 将指向数组的第一个索引\n\
    int* ptr = &arrayInt;\nfor (int i = 0; i < arrayInt_Size; i++)\n{\n// 记住，*ptr\
    \ 获取内存位置中的值\nprintf(\"Value of arrayInt[%d] = %d\\n\", i, *ptr);\nptr++;\n}\n\
    ```\n\n输出\n\n>Value of arrayInt[0] = 10\n>Value of arrayInt[1] = 20\n>Value of\
    \ arrayInt[2] = 30\n\n这显示指向数组第一个地址的指针可以沿着数组的地址增加（记住数组的每个值都存储在相邻的内存位置中）。\n\n你可以相反操作，递减指针，即让指针的值减少。\n\
    \n还可以使用关系运算符如 `==`、`<` 和 `>` 来比较指针。常用的用途是检查两个指针是否指向同一个位置：\n\n```c\nint value;\n\
    // 为 ptr1 和 prt2 分配相同的值\nint* ptr1 = &value;\nint* ptr2 = &value;\n// 为 ptr3 分配另一个值\n\
    int* ptr3 = NULL;\nif (ptr1 == ptr2)\n{\n    printf(\"pointers point to the same\
    \ location\\n\");\n}\nif (ptr1 != ptr3)\n{\n    printf(\"pointers do not point\
    \ to the same location\\n\");\n}\n```\n"
- fmt: "\nThe area highlighted section is the static definition and will only run\
    \ once.\n\n## Register variables\n\n`register` is used to define a variable that\
    \ is to be store in register memory opposed to regular memory, the benefit register\
    \ memory has is it is much much quicker to access however there is only space\
    \ for a few variables.\n\nDefining a register variable is done like so:\n\n```c\n\
    register int value;\n```\n\n## External variable\n\nWe touched on this before\
    \ but a global variable is a variable not defined in a scope and therefore can\
    \ be used anywhere. An external variable Is a variable defined in a separate location\
    \ like another file and the `extern` keyword is used to signify that the variable\
    \ is in another file. You would include another file as reference by placing this\
    \ at the top of your file:\n\n```c\n#include  \"FileName.c\"\n```\n\nThis is to\
    \ tell the program to reference this file as well. Note the files need to be in\
    \ the same location.\n\n### Program 1 [File_2.c]\n\n```c\n#include <stdio.h>\n\
    #include \"C_TUT.c\"\n\nint main()\n{\n    extern int globalValue;\n    printf(\"\
    The global variable is: %d\", globalValue);\n}\n```\n\n### Program 2 (It is small)\
    \ [C_TUT.c]\n\n```c\n#include <stdio.h>\n\nint globalValue = 1032;\n```\n\nThe\
    \ Output of running `File_2.c`:\n\n>The global variable is: 1032\n\nThis shows\
    \ that the `globalValue` is referenced from `C_TUT.c` and used in another file\
    \ by using the `extern` keyword.\n\n## File I/O\n\nThere will be cases where you’ll\
    \ need to retain data past the duration of the program's life time, this is where\
    \ saving a loading to file comes into use. There are two types of main files used:\n\
    \n- Text Files\n- Binary files\n\nTo start you will need to create a pointer of\
    \ type `FILE` tile will allow communication between file and program. This is\
    \ done like so:\n\n```c\nFILE* ptr;\n```\n\n### Opening a file\n\nIf this file\
    \ already exists you can open it and read it’s contents, this would be done by\
    \ using:\n\n```c\nptr = fopen(char* filename, char* mode)\n```\n\nWhere:\n- `filename`\
    \ = to the filename of the file to open\n- `mode` = this is the mode to open the\
    \ file in, the comprehensive list is below\n\n| Mode | Description |\n| :--- |\
    \ :--- |\n| r | Opens the file for reading |\n| w | Opens the file for writing,\
    \ if the file does not exist a new file is created. The program will begin writing\
    \ content from the start of the file. |\n| a | Appending mode, if the file does\
    \ not exist it is created. Any changes to an existing file will be added onto\
    \ the end. |\n| r+ | Opens the file for reading and writing |\n| w+ | Opens the\
    \ text file for both reading and writing. It first truncates (chops) the file\
    \ length to zero if it exists, if it doesn’t create a new file |\n| a+ | Once\
    \ again opens the file for reading a writing. If the file does not exist a new\
    \ one is created. Reading starts at the very start but writing is only appended\
    \ onto the end of the file. |\n\n### Closing a file\n\nThis one is nice and simple,\
    \ just need to run:\n\n```c\nfclose(ptr);\n```\n\n### Writing to a file\n\nThere\
    \ are two different ways of writing to a file `fprintf()` and `fputs()` (Like\
    \ the console printing commands `printf()` and `puts()`). The only difference\
    \ really is that `fprintf()` allows you to use the formatting ID like `%s` and\
    \ `fputs()` does not. This means `fputs()` does not need to check for formatting\
    \ and just prints out the exact string making it faster. `fputs()` also automatically\
    \ adds a newline character (`\\n`) to the character string it is given, much like\
    \ `puts()`. The example below shows to open, write-to and close a file:\n\n```c\n\
    #include <stdio.h>\n\nint main()\n{\n    //Creates the file pointer\n    FILE*\
    \ ptr;\n    //Opens the file\n    ptr = fopen(\"C:/C_IO/example.txt\", \"w+\"\
    );\n    //Writes to the file\n    fprintf(ptr, \"fprint()\\n\");\n    fputs(\"\
    fputs()\\n\", ptr);\n    //Closes file\n    fclose(ptr);\n}\n```\n\nIt creates\
    \ a file in the `C_IO` directory directly on the C: drive (make this before running\
    \ the program). It uses the `w+` mode so every time the program is run the data\
    \ in file is overridden.\n\nYou can also save values only using `fprintf` like\
    \ so:\n\n```c\nfprintf(ptr, \"%d\\n\", value);\n```\n\n* Opening a file `fopen()`\n\
    * Writing to a file\n    * `fprintf()`\n    * `fputs()`\n* Closing a file `fclose()`\n\
    \n## Exercise\n\n- Write a program to save the output of an `add` function save\
    \ it to the `C_IO` on the C (Or your main drive) you made earlier and call it\
    \ “addSave.txt”, use 10 and 25 and your values.\n\n### Solution\n\nSomething like\
    \ this, doesn’t have to be exact there are always different ways of doing things.\n\
    \n```c\n#include <stdio.h>\n\nint add(int num1, int num2)\n{\n    return num1\
    \ + num2;\n}\n\nint main()\n{\n    //Grabs the value to save\n    int saveValue\
