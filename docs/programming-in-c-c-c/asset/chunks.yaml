  trans: "\n高亮区域部分是静态定义，只会运行一次。\n\n## 寄存器变量\n\n`register` 用于定义一个存储在寄存器内存而非普通内存中的变量，寄存器内存的优点是访问速度要快得多，但空间只能容纳几个变量。\n\
    \n定义寄存器变量的方式如下：\n\n```c\nregister int value;\n```\n\n## 外部变量\n\n我们之前提到过这一点，但全局变量是一个没有在任何作用域内定义的变量，因此可以在任何地方使用。外部变量是指定义在单独位置（如另一个文件）的变量，使用\
    \ `extern` 关键字表示该变量在另一个文件中。你可以通过在文件顶部放置此内容来包含另一个引用文件：\n\n```c\n#include  \"FileName.c\"\
    \n```\n\n这是为了告诉程序也引用该文件。注意，文件需要位于同一个位置。\n\n### 程序 1 [File_2.c]\n\n```c\n#include\
    \ <stdio.h>\n#include \"C_TUT.c\"\n\nint main()\n{\n    extern int globalValue;\n\
    \    printf(\"The global variable is: %d\", globalValue);\n}\n```\n\n### 程序 2\
    \ (很小) [C_TUT.c]\n\n```c\n#include <stdio.h>\n\nint globalValue = 1032;\n```\n\
    \n运行 `File_2.c` 的输出：\n\n>The global variable is: 1032\n\n这显示 `globalValue` 是从\
    \ `C_TUT.c` 用的，并通过使用 `extern` 关键字在另一个文件中使用。\n\n## 文件 I/O\n\n在某些情况下，你需要在程序运行结束后保留数据，这就是保存和加载到文件大有用场的地方。主要使用了两种类型的文件：\n\
    \n- 文本文件\n- 二进制文件\n\n开始之前，你需要创建一个 `FILE` 类型的指针，这类型允许文件与程序之间的通信。操作方式如下：\n\n```c\n\
    FILE* ptr;\n```\n\n### 打开文件\n\n如果该文件已存在，你可以打开它并读取其内容，将通过以下方式实现：\n\n```c\nptr =\
    \ fopen(char* filename, char* mode)\n```\n\n其中：\n- `filename` = 要打开的文件名\n- `mode`\
    \ = 打开文件的模式，完整列表如下所示\n\n| Mode | 描述 |\n| :--- | :--- |\n| r | 以读模式打开文件 |\n| w\
    \ | 以写模式打开文件，如果文件不存在则创建一个新文件。程序将从文件开头开始写入内容。 |\n| a | 追加模式，如果文件不存在则创建它。对现有文件的任何更改都将追加到末尾。\
    \ |\n| r+ | 以读写模式打开文件 |\n| w+ | 以读写模式打开文本文件。如果文件存在，它会首先将其长度截断为零；如果不存在则创建一个新文件。\
    \ |\n| a+ | 再次以读写模式打开文件。如果文件不存在则创建一个新文件。读取从最开始开始，但写入只追加到文件的末尾。 |\n\n### 关闭文件\n\
    \n这个非常简单，只需要运行：\n\n```c\nfclose(ptr);\n```\n\n### 写入文件\n\n向文件写入有两种不同方法：`fprintf()`\
    \ 和 `fputs()`（类似于控制台打印命令 `printf()` 和 `puts()`）。真正的区别在于 `fprintf()` 允许你使用诸如 `%s`\
    \ 这样的格式标识符，而 `fputs()` 不行。这意味着 `fputs()` 不需要检查格式，直接打印精确字符串，因此速度更快。`fputs()` 还会向给定的字符字符串自动添加换行符（`\\\
    n`），就像 `puts()` 一样。下面的示例展示了打开、写入并关闭文件：\n\n```c\n#include <stdio.h>\n\nint main()\n\
    {\n    //创建文件指针\n    FILE* ptr;\n    //打开文件\n    ptr = fopen(\"C:/C_IO/example.txt\"\
    , \"w+\");\n    //写入文件\n    fprintf(ptr, \"fprint()\\n\");\n    fputs(\"fputs()\\\
    n\", ptr);\n    //关闭文件\n    fclose(ptr);\n}\n```\n\n它会直接在 C 盘的 `C_IO` 目录下创建一个文件（在运行程序之前创建它）。它使用\
    \ `w+` 模式，因此每次运行程序时文件中的数据都会被覆盖。\n\n你也可以使用 `fprintf` 保存值，如下：\n\n```c\nfprintf(ptr,\
    \ \"%d\\n\", value);\n```\n\n* 打开文件 `fopen()`\n* 写入文件\n    * `fprintf()`\n   \
    \ * `fputs()`\n* 关闭文件 `fclose()`\n\n## 练习\n\n- 编写一个程序，将 `add` 函数的输出保存到你之前创建的 C\
    \ 盘（或你的主硬盘）的 `C_IO` 中，并命名为“addSave.txt”，使用 10、25 和你的值。\n\n### 答案\n\n类似这样，不需要完全相同，处理方法总是有不同的。\n\
    \n```c\n#include <stdio.h>\n\nint add(int num1, int num2)\n{\n    return num1\
    \ + num2;\n}\n\nint main()\n{\n    //获取要保存的值\n    int saveValue = add(10, 25);\n\
    \    //创建文件指针\n    FILE* ptr;\n    //打开文件\n    ptr = fopen(\"C:/C_IO/addSave.txt\"\
