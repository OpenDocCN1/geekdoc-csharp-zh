  trans: "\n创建一个存储 `Pets` 数据的类，该类需要动物的 `Name`（名称）、`Age`（年龄）和 `Type`（类型）。还需要一个构造函数（Constructor）、一个析构函数（Destructor）以及一个打印宠物所有数据的成员函数。\n\
    \n通过以下方式进行测试：一只名为 `Jose` 的 1 岁狗，一只名为 `Besse` 的 5 岁猫以及一只名为 `James` 的 10 岁鹦鹉。\n\n\
    ## 解决方案\n\n类似于所示：\n\n```csharp\nusing System;\n\nnamespace ConsoleApplication1\n\
    {\n class  Program\n    {\nstatic  void Main(string[] args)\n        {\nPet p1\
    \ = new  Pet(\"Jose\", 1, \"Dog\");\n             p1.Print();\n\n Pet p2 = new\
    \  Pet(\"Besse\", 5, \"Cat\");\n             p2.Print();\n\n Pet p3 = new  Pet(\"\
    James\", 10, \"Parrot\");\n             p3.Print();\n Console.ReadKey();\n   \
    \     }\n    }\n class  Pet\n    {\n public Pet(string _name, int _age, string\
    \ _type)\n        {\n             name = _name;\n             age = _age;\n  \
    \           type = _type;\n        }\nstring name { get; }\nint age { get; }\n\
    string type { get; }\n public  void Print()\n        {\n//{name} is string interpolation\n\
    \ Console.WriteLine($\"Name: {name}\",name);\n Console.WriteLine($\"Age: {age}\"\
    ,age);\n Console.WriteLine($\"Type: {type}\",type);\n Console.WriteLine();\n \
    \       }\n    }\n}\n```\n\n## 继承\n\n继承是一种语言功能，允许类获取另一个类的特征，继承的实现如下：\n\n```csharp\n\
    class  Dog : Animal\n{\n}\n```\n\n这意味着任何标记为“Public”（公共）或“Protected”（保护，保护将在下一章解释）的函数或变量`Dog`\
    \ 将拥有其自己的版本或访问权限，这允许快速创建新类型的类，而无需重复函数和变量的定义。\n\n下面的示例展示了如何使用：\n\n```csharp\nusing\
    \ System;\n\nnamespace ConsoleApplication1\n{\n class  Program\n    {\nstatic\
    \  void Main(string[] args)\n        {\nDog d1 = new  Dog(\"Rocko\", 3, \"Blue\
    \ One\", \"Red\");\n d1.PrintName();\n        }\n    }\n class  Animal\n    {\n\
    \ public Animal(string _name, int _age)\n        {\n             name = _name;\n\
    \             age = _age;\n        }\n public  string name;\n public  int age;\n\
    \ public  void PrintName()\n        {\n Console.WriteLine(name);\n        }\n\
    \    }\n class  Dog : Animal\n    {\n public Dog(string _name, int _age, string\
    \ favBone, string kColour) : base(_name, _age)\n        {\n             FavouriteBone\
    \ = favBone;\n             kColour = KennelColour;\n        }\n private  string\
    \ FavouriteBone;\n private  string KennelColour;\n    }\n}\n```\n\n有几点需要说明，第一个是示例展示了函数是如何被继承的，`Dog`\
    \ 没有 `PrintName()` 的定义，但因为它继承了 `Animal`，所以它拥有自己的定义。\n\n另外一点是 `base(_name, _age)`，这是调用基构造的方法，在这种情况下，它调用了上面的\
    \ `Animal` 构造函数。\n\n## 封装\n\n封装是将一个或多个项目封装在物理或逻辑包中的过程，在面向对象编程（OOP）的语文中，它是如何管理对成员变量的访问。\n\
    \n我们之前见过其中的三种，但本节将详细介绍以下部分：\n\n1. Public（公共）\n2. Protected（保护）\n3. Private（私有）\n\
    4. Internal（内部）\n5. Protected internal（保护内部）\n\n**Public** 仅仅允许完全访问成员对象。例如：\n\n\
    ```csharp\nclass MyClass\n{\n    public int value;\n}\n```\n\n**Protected** 仅允许类及其派生类访问成员。\n\
    \n```csharp\nclass MyClass\n{\n    protected int value;\n}\n```\n\n**Private**\
    \ 仅允许类内部访问成员。\n\n```csharp\nclass MyClass\n{\n    private int value;\n}\n```\n\
    \n**Internal** 允许在同一个程序集中的代码访问成员。\n\n```csharp\nclass MyClass\n{\n    internal\
    \ int value;\n}\n```\n\n**Protected internal** 允许在同一个程序集内或派生类中访问成员。\n\n```csharp\n\
    class MyClass\n{\n    protected internal int value;\n}\n```\n\n**Public** 仅仅允许完全访问成员对象。例如：\n\
