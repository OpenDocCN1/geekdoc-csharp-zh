    ## Interfaces\n\nInterfaces are very structured, they are a blue print that every\
    \ inherited method must follow, much like a contract. An interface is much like\
    \ an abstract class, but how an abstract class should be inherited and possibly\
    \ extended an interface should just be implemented. Interfaces allow the separation\
    \ of function definitions from implementation and improves readability and design.\n\
    \nA interface is defined like so, each method or property that is to be created\
    \ is put in a kind of, an interface cannot contain implementation.\n\n```csharp\n\
    interface ITransaction\n{\n    //Methods\n    void Process();\n}\n```\n\nBelow\
    \ is an example of using an Interface with Vehicles:\n\n```csharp\ninterface IVehicle\n\
    {\n    string Colour { get; }\n    string EngineType { get; }\n    int NumberOfWheels\
    \ { get; }\n    int Gas { get; }\n    void StartEngine();\n    void StopEngine();\n\
    }\nclass Car : IVehicle\n{\n    string Colour { get; }\n    string EngineType\
    \ { get; }\n    int NumberOfWheels { get; } = 4;\n    int Gas { get; }\n    public\
    \ void StartEngine()\n    {\n        Console.WriteLine(\"Started Engine!\");\n\
    \    }\n    public void StopEngine()\n    {\n        Console.WriteLine(\"Stopped\
    \ Engine!\");\n    }\n    public Car(string colour, string engineType, int gas)\n\
    \    {\n        Colour = colour;\n        EngineType = engineType;\n        Gas\
    \ = gas;\n    }\n}\n```\n\nAs you can see, `Car` has to implement all the items\
    \ defined in `IVehicle` interface, this gives a kind of “plug and play” effect\
    \ when creating new classes because the design and layout is strictly enforced.\n\
    \n## Exercise\n\nUsing the previous example implement a new Class called `Bike`\
