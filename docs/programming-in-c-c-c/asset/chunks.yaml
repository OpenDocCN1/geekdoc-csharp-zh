    \ `NULL`。\n9. 用于访问原始内存。\n10. 相同类型的数组\n\n## 第 5 章答案\n\n1. 使用 `#include` 指令\n2.\
    \ 头文件使用 “.h”\n3. `#define` 用于创建常量值的全局定义\n4. `#include <errno.h>`\n5. 存储在那里的最后一个错误代码\n\
