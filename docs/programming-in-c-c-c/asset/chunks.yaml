  trans: "\n\n`Clang` 是由 Apple 构建的编译器，处理将代码翻译成机器码（1 和 0）的所有方面。\n\n打开你的记事本，使用以下代码编写你的\
    \ C 代码：\n\n```c\n#import <stdio.h>\n\nint main()\n{\n    printf(\"Hello, World!\\\
    n\");\n    return 0;\n}\n```\n\n将此代码保存为 `.c` 扩展名。\n\n在保存 `.c` 文件的文件夹中打开终端，输入：\n\
    \n`make <filename>.c`\n\n其中 `filename` 是你刚刚保存的文件名。运行代码只需像如下所示执行：\n\n`./<filename>.c`\n\
    \n## 在线运行 C\n\n我最喜欢的在线 IDE 之一是 [`www.codechef.com/ide`](https://www.codechef.com/ide)，它提供了一个整洁的地方来编写代码。\n\
    \n![](img/image00618.jpeg)\n\n## 前提条件\n\n在整个教程中，你会看到散落在各的代码片段。有几点需要解释，以便你从本教程中受益：\n\
    \n### 注释\n\n代码中的注释由 `//` 符号和绿色表示，计算机会忽略这些，而注释是保持计算机代码可读且易于维护的重要部分。初学者往往倾向于丢弃注释并在以后后悔，不要成为那样的程序员。\n\
    \n### 基础结构\n\nC 程序还有一个必备的基础结构，结构如下：\n\n```c\n#include <stdio.h>\n\nint main()\n\
    {\n    // 代码写在这里\n}\n```\n\n这是让你的 C 程序运行起来的结构，不用担心，我们将学习它们所有的含义。\n\n# 第 2 章\n\n\
    #构建模块\n\n## 变量与类型\n\n程序的基础是数据，以数字和字符的形式存在。这些数据的存储、处理和输出提供了功能。变量持有这些数据，可以将其想象成用于存储单个物品的盒子。\n\
    \nC 是一种强类型语言，每个变量都必须有一个定义的类型。类型是一个标识符关键字，定义了变量可以包含的内容。我们将遇到的第一个类型是整数，它可以存储实数（不带小数的数字），整数定义如下：\n\
    \n```c\nint integerName = 3;\n```\n\n- `int` 是定义的类型关键字，我们稍后会学习不同的可能性。\n- `integerName`\
    \ 是变量的 ID，你可以称它为任何名字，这用于允许变量具有有意义的名字。变量可以定义为 `int pineapple = 3;`，但让它们相关是一个良好的习惯。然而，有几个例外，因为变量不能是单个数字（例如\
    \ ‘4’）或不能包含特殊字符（`!\"£$%^&*` 等）。\n- `= 3;` 是赋值部分，将值 `3` 放入整数盒子中供以后使用。它也以分号结尾，分号用于表示一行的结束。\n\
    \n现在这个变量可以在程序的有效区域使用，如下：\n\n```c\nint newInteger = integerName\n```\n\n之前定义的 `integerName`\
    \ 的值 (3) 现在将被放入 `newInteger` 变量中，它们现在都具有值 3。`integerName` 的值不会改变，因为它只是被复制并放置在\
    \ `newInteger` 中。\n\n### 字符串 (String)\n\n字符串是另一个关重要的变量，这种变量类型用于存储一系列字符，例如“batman”这个单词，该单词由存储在\
    \ `String` 变量中的字符组成。它是字符数组（数组稍后会详细介绍），但实际上，它是单词的单个字符在内存中相邻存储的。`\\n` 是代表换行的特殊字符。\n\
    \n```c\nchar word[] = \"dog\\n\";\n```\n\n// 它可以像这样使用并打印：\n\n```c\nprintf(word);\n\
    ```\n\n### 布尔值 (Boolean)\n\n布尔值用作表达式，它们的值只能为真 (1) 或假 (0)。\n\n### 浮点数/双精度 (Float/Double)\n\
    \n浮点变量用于小数。\n\n### 空 (Void)\n\n`void` 表示一个不返回值的函数。\n\n## 算术运算\n\n| 符号 | 用法 |\n\
    | :--- | :--- |\n| `+` | `int result = 1 + 2;` |\n| `-` | `int result = 1 - 2;`\
    \ |\n| `/` | `int result = 1 / 2;` |\n| `*` | `int result = 1 * 2;` |\n| `%` |\
    \ `int remain = 4 % 2;` |\n\n## 条件判断\n\n将值与其他值进行比较是条件语句的基础，下面是比较列表：\n\n| 名称 |\
    \ 符号 | 详情 |\n| :--- | :--- | :--- |\n| 大于 | `>` | 如果左侧大于右侧则返回真 |\n| 大于等于 | `>=`\
    \ | 如果左侧大于或等于右侧则返回真 |\n| 小于 | `<` | 如果左侧小于右侧则返回真 |\n| 小于等于 | `<=` | 如果左侧小于或等于右侧则返回真\
    \ |\n| 等于 | `==` | 使用双等号比较两者是否相等 |\n| 不等于 | `!=` | 如果两个值不相等则返回真 |\n\n## If 语句\n\
    \n在某些情况下，你需要在某个条件成立时发生某些操作，这就是 `If` 语句的作用。\n\n```c\nif (Condition)\n{\n    //\
    \ 如果条件为真，则在这里运行代码\n}\n```\n\n一个真实世界的示例：\n\n```c\nint compare = 10;\n\nif (compare\
    \ > 5)\n{\n    //printf() 将打印括号内的字符串\n    printf(\"Code here will run!\");\n}\n\
    ```\n\n输出：\n> Code here will run!\n\n## Else 语句\n\n`Else` 是可选的，但它们可以添加到 if 语句的末尾，并且仅在\
    \ if 语句条件为假时运行。\n\n```c\nif (Condition)\n{\n    // 如果条件为真，则在这里运行代码\n}\nelse\n\
    {\n    // 如果条件为假，则在这里运行代码\n}\n```\n\nElse 语句也可以变成 else/if 语句，即连接载一个新的 if 语句，看起来像这样：\n\
    \n```c\nif (Condition1)\n{\n    // 如果 Condition1 为真，则在这里运行代码\n}\nelse if(Condition2)\n\
    {\n```\n\n"
- fmt: "\n```c\n //Code will run here if Condition1 is False and Condition2 is True\n\
    \n}\n\n//If neither are true no code will run\n```\n\nYou can also chain another\
    \ `else` statement onto an `else` statement effectively creating an infinite chain.\
    \ If any conditions along the chain are true, the ones below are not checked,\
    \ I’ll demonstrate this below:\n\n```c\nint main()\n{\n_Bool false = 0;\n_Bool\
    \ true = 1;\n\nif (false)\n{\nprintf(\"Condition 1\");\n}\nelse  if (true) //This\
    \ condition is true!\n{\nprintf(\"Condition 2\");\n}\nelse  if (true) //Ignored,\
    \ due to previous else statement being true\n{\nprintf(\"Condition 3\");\n}\n\
    else  if (true) //Also ignored due to condition 2 being true\n{\nprintf(\"Condition\
    \ 4\");\n}\n}\n```\n\n### Output\n\n> Condition 2\n\nAfter the body of condition\
    \ 2 is hit and the `printf` statement is executed, the program does not go onto\
    \ to check the other `else` statements.\n\n### Exercise\n\nCreate a program that\
    \ prints out if a value is bigger or smaller than another, use this skeleton below\
    \ program to get you started.\n\nSo in this case it should print “Value 1 is larger”\
    \ (Note: Use `printf()` for printing)\n\n```c\n#include  <stdio.h>\n\nint main()\n\
    {\n//Values you change\nint value1 = 10;\nint value2 = 5;\n//PUT CODE HERE\n}\n\
    ```\n\n### Solution\n\nThis solution could be something like this:\n\n```c\n#include\
    \  <stdio.h>\n\nint main()\n{\n//Values you change\nint value1 = 10;\nint value2\
    \ = 10;\n\nif (value1 == value2)\n{\nprintf(\"Values are equal!\");\n}\nelse \
    \ if (value1 > value2)\n{\nprintf(\"Value 1 is bigger!\");\n}\nelse\n{\nprintf(\"\
    Value 2 is bigger!\");\n}\n}\n```\n\nJust change the values of `value1` and `value2`\
    \ before you run the program to test it.\n\n### Using multiple conditions\n\n\
    You can use more than one condition in a single statement, there’re two ways of\
    \ doing this AND signified by `&&` and OR signified by `||` (Double vertical bar).\n\
    \nAND checks if both conditions are true before triggering the body of the statement\n\
    \n```c\nif (Condition1 && Condition2)\n{\n //Code will run here if Condition1\
    \ AND Condition2 are True\n}\n```\n\nOR checks if one of the conditions are true\
    \ before triggering the body of the statement\n\n```c\nif (Condition1 || Condition2)\n\
    {\n //Code will run here if Condition1 OR Condition2 are True (Works if both are\
    \ true)\n}\n```\n\n### Recap\n\n- `if` statement Deals with conditional statements,\
    \ code within it’s body will run if the condition is true.\n- `else` statementUsed\
    \ as an extension to an `if` statement that is only checked if the `if` statement\
    \ is false.\n- `&&`Used to string two conditions together and will only return\
    \ true if both are true.\n- `||` (Double Bar)Used to string two conditions together\
    \ and will only return true if one of the conditions are true.\n\n### Switch-Case\n\
    \nSwitch cases are used to test a variable for equality with a constant expression\
    \ without the need for multiple `if`-statements. One use for this structure is\
    \ check users input string. Below is the basic structure of the switch case:\n\
    \n```c\n//Switch-Case\nswitch (expression)\n{\n//Case statement\ncase constant-expression:\n\
    break; //Break't needed\n//Any number of case statements\ndefault:\nbreak;\n}\n\
    ```\n\nThe switch starts off with `expression`, this is the variable that is compared\
    \ to the `constant-expressions`, these constants are the literal values of the\
    \ variable such as `1` or `Z`. Breaks are optional but without them the code will\
    \ ‘flow-down’. There is an example using a switch-case statement, the user inputs\
    \ a `character` if it is `N` or `Y`, ‘No’ and ‘Yes’ respectively but a `default`\
    \ case applies for all situations.\n\n```c\nchar character;\n//Reads in user input\
    \ (Explained in detail later)\nscanf(\"%s\", &character);\n//Switch-Case\nswitch\
    \ (character)\n{\ncase 'N':\nprintf(\"NO\\n\");\nbreak;\ncase 'Y':\nprintf(\"\
    YES\\n\");\nbreak;\ndefault:\nprintf(\"Do not understand!\\n\");\nbreak;\n}\n\
    ```\n\nIf there is no `break` statement a ‘flow-down’ will occur, below is an\
    \ example just like:\n\n```c\nchar character;\n//Reads in user input (Explained\
    \ in detail later)\nscanf(\"%s\", &character);\n//Switch-Case\nswitch (character)\n\
    {\ncase 'N':\nprintf(\"NO\\n\");\ncase 'Y':\nprintf(\"YES\\n\");\ndefault:\nprintf(\"\
    Do not understand!\\n\");\n}\n```\n\nIf ‘N’ is the user input the Output will\
    \ be:\n> NO\n> YES\n> Do not understand!\n\nThis is because one case statement\
    \ is triggered it will continue until a `break` statement is found to stop running.\n\
    \n## Iteration\n\nIteration means looping, and looping quickly gives programs\
    \ the ability to perform lots of similar operations very quickly, there’re two\
    \ types of iteration: `for loops` and `while loops`.\n\n### For Loop\n\nThe `for`\
    \ loop is given an end value and loops up until that value, while keeping track\
    \ of what loop number it’s currently on, here is an example below:\n\n```c\nfor(int\
    \ x = 0; x > 10; x++)\n{\nprintf(\"Looped!\");\n}\n```\n\nEach part of the `for`-loop\
    \ has a role:\n- **Red**: This is the Declaration section to define the loop counter,\
    \ this defines the start point of the counter.\n- **Green**: This section is called\
    \ the Conditional and it contains a conditional statement that is checked at the\
    \ end of the loop to see if the `if`-statement should continue looping, so in\
    \ this case the loop should continue if `x > 10`, if this condition becomes false\
    \ the loop will not continue.\n- **Blue**: The statement is the Increment section\
    \ where the loop counter is incremented (increased in value), the `x++` is shorthand\
    \ for `x + 1`. This can also be `x--`, if there was a case requiring the counter\
    \ to decrease.\n\n- Declaration section defines the loop counter.\n- Conditional\
    \ section continues the loop if true.\n- Increment section is where the loop counter\
    \ is incremented\n\n### Conditional Loops\n\nConditional loops work like the `for`\
    \ loop but don’t have a loop counter and will only loop while a condition is True.\
    \ This means you can create an infinite loop, like so:\n\n```c\nwhile (TrueCondition)\n\
    {\nprintf(\"This will not stop looping\");\n}\n```\n\n**Note**: An infinite loop\
    \ is normally constructed using a naked `for`-loop:\n\n```c\nfor(;;)\n{\nprintf(\"\
    This also never stop looping\");\n}\n```\n\nThis loop will never end and your\
    \ program will get stuck within the loop. The example below shows if the condition\
    \ is false the program will never reach the code within the brackets:\n\n```c\n\
    while (FalseCondition)\n{\nprintf(\"This code will never run\");\n}\n```\n\nTo\
    \ use this loop effectively you can use it with a conditional statement (like\
    \ the `if` statement) or you can use it with a `bool` variable, examples are below:\n\
    \n```c\nint count = 0;\nwhile (count > 10)\n{\nprintf(\"loop\");\n//Remember this,\
    \ it’s the same as \"count + 1;\"\ncount++;\n}\n```\n\nAs it says above you can\
    \ also use a `while` loop directly with a Boolean variable:\n\n```c\nint count\
    \ = 0;\n_Bool keepLooping = 1; //Bool is true (1) is true\nwhile (keepLooping)\n\
    {\nprintf(\"loop\\n\");\n//Remember this, it’s the same as \"count + 1;\"\ncount++;\n\
    if(count == 3)\n{\nkeepLooping = 0; //keepLooping is now false, and the loop will\
    \ stop\n}\n}\n```\n\nThis is very similar to how a `for` loop operates, but it\
    \ is important to understand the different uses for a `while` loop.\n\n**Note**:\
    \ The section in the brackets of the `while` loop is checking if that condition\
    \ is true, you can also write it like so:\n\n`while(!stopLooping) {}`\n\nThis\
    \ is effectively saying, keep looping while `stopLooping` is “not true”, the `!`\
    \ symbol means “not”.\n"
