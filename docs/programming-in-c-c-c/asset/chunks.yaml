    \    {\n        public void Function()\n        {\n            Console.WriteLine(\"\
    Namespace1!\");\n        }\n    }\n}\n```\n\nWith the using statement:\n\n```csharp\n\
    using System;\nusing Namespace1;\n\nnamespace ConsoleApplication1\n{\nclass Program\n\
