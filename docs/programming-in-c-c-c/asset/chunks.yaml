    \ statement without a recursive definition, i.e. when x = 1 the function just\
    \ returns 1, this means the stack can unwind and find an answer. There is a flow\
    \ diagram below:\n\n![](Images/image00619.jpeg)\n\n## Exercises chapter 3\n\n\
