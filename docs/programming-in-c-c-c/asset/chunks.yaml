    \ It is not, the destructor cannot be manually called.\n7. The garbage collector.\n\
    8. In the same assembly, i.e. in the same `.exe` file or `.dll`.\n9. An instance\
    \ of a class.\n10. Overloading a class\n\n# Chapter 3: Advanced Class structures\n\
    \n## Polymorphism\n\nThe word polymorphism means having many forms, in the context\
    \ of OOP is often described as “one interface, many functions”. There are two\
    \ types of polymorphic design, static and dynamic.\n\n### Static Polymorphism\n\
    \nStatic polymorphism means the response to a function is determined at compile\
    \ time (i.e. before the program is run), this process is called ‘Early binding’\
    \ and this can be done in one of two ways:\n\n1. Function overloading\n2. Operator\
    \ overloading\n\n### Function overloading\n\nIn function overloading you can have\
    \ the same definition of a function in the same scope, this is exactly the same\
    \ to constructor overloading. So, for example, this class definition would be\
    \ valid:\n\n```csharp\nusing System;\n\nnamespace ConsoleApplication1\n{\n class\
    \  Program\n    {\nstatic  void Main(string[] args)\n        {\nInterface i =\
    \ new  Interface(); //Printing integer\n i.Print(1); //Printing float\n i.Print(2.0f);\
    \ //Printing double\n i.Print(4d); //Printing long\n i.Print(4L);\n        }\n\
    \    }\n class  Interface\n    {\nstring printStr = \"Print!\";\n public  void\
    \ Print(int i)\n        {\n Console.WriteLine(i);\n        }\n public  void Print(double\
    \ i)\n        {\n Console.WriteLine(i);\n        }\n public  void Print(float\
    \ i)\n        {\n Console.WriteLine(i);\n        }\n public  void Print(long i)\n\
    \        {\n Console.WriteLine(i);\n        }\n    }\n}\n```\n\nAs you can tell\
    \ there are 4 definitions of `Print()` but all with different parameters.\n\n\
    ### Dynamic overloading\n\nC# allows the creation of an abstract class; an abstract\
    \ class can act as a template or a design for other classes to inherit and adapt\
    \ for the circumstance they are designed for. Derived classes then can take abstract\
    \ functions and adapt their behaviour, however they’re some rules about abstract\
    \ classes:\n\n1. You cannot directly create an instance of an abstract class.\n\
    2. You cannot declare an abstract method that is not housed in an abstract class.\n\
    3. There is also a keyword known as `sealed` and sealed classes cannot be inherited,\
    \ abstract methods therefore cannot be defined as sealed.\n\nBelow is an example\
    \ that demonstrates the use of an abstract class:\n\n```csharp\nusing System;\n\
    \nnamespace ConsoleApplication1\n{\n abstract  class  Shape\n    {\npublic  abstract\
    \  int Volume();\n```\n"
