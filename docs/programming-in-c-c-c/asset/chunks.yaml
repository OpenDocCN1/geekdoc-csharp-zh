  trans: "\n\n- `AttributeTargets.Method`\n- `AttributeTargets.Property`\n- `AllowMultiple`\
    \ 明是否可以创建并应用多个版本的属性。\n- `Inherited` 规定当其他类继承该属性所属的类时，该属性是否会被继承。\n\n这在之后被用于创建自定义属性。\n\
    \n## Conditional\n\n这些条件性属性用于标记依赖于某些预处理指令的方法，在本例中，我们将使用一个调试示例：\n\n```csharp\n\
    using System;\nusing System.Diagnostics;\n\nnamespace ConsoleApplication1\n{\n\
    \    class Program\n    {\n        public static void Main()\n        {\n    \
    \        Debugging();\n            Console.ReadKey();\n        }\n\n        [Conditional(\"\
    DEBUG\")]\n        static void Debugging()\n        {\n            Console.WriteLine(\"\
    This is example debugging code:\");\n            Console.WriteLine(\"Number of\
    \ loops: \" + 1);\n            Console.WriteLine(\"Values found: \" + 102);\n\
    \        }\n    }\n}\n```\n\n只有当程序设置为调试模式（debug mode）时，才会打印示例输出，这为抽象代码和必要的输出提供了一种非常整洁的方式。`DEBUG`\
    \ 标志已内置在 Visual Studio 中，因此当程序切换到发布模式（release mode）时，调试模式将为 false，代码将不会执行。\n\n\
    也可以通过自定义预处理指令来实现：\n\n```csharp\n#define CUSTOM\nusing System;\nusing System.Diagnostics;\n\
    \nnamespace ConsoleApplication1\n{\n    class Program\n    {\n        public static\
    \ void Main()\n        {\n            Custom_Method();\n            Console.ReadKey();\n\
    \        }\n\n        [Conditional(\"CUSTOM\")]\n        static void Custom_Method()\n\
    \        {\n            Console.WriteLine(\"Custom output!\");\n        }\n  \
    \  }\n}\n```\n\n## Obsolete\n\n这用于遗留和兼容性考虑。例如，如果你有一个类使用了 `SaveFile()` 函数，但后来进行了更新且该函数变得过时，就会创建一个名为\
    \ `Save()` 的新函数，因为现在该函数保存其他项目。`SaveFile()` 将标记为废弃，这样使用这些函数的其他程序就不会出现兼容性问题。\n\n\
    示例展示了 `obsolete` 的用法：\n\n```csharp\nusing System;\nnamespace ConsoleApplication1\n\
    {\n    class Program\n    {\n        public static void Main()\n        {\n  \
    \          Output old = new Output();\n            old.PrintData();\n        \
    \    Output newV = new Output();\n            newV.Print();\n            Console.ReadKey();\n\
    \        }\n    }\n\n    class Output\n    {\n        string example = \"Example\"\
    ;\n        [Obsolete(\"Deprecated! Use Print() instead\", false)]\n        public\
    \ void PrintData()\n        {\n            Console.WriteLine(example);\n     \
    \   }\n        public void Print()\n        {\n            Console.WriteLine(example);\n\
    \        }\n    }\n}\n```\n\n输出:\nExample\nExample\n\n你可以看到两者都可以工作，但 `old.PrintData()`\
    \ 会显示一个警告，看起来如下：(image0024.jpeg)\n注意：这是因为使用了 `false` 参数，这意味着仅显示警告；如果为 `true`，则会创建一个错误并不允许程序编译。它将像这样出现在错误列表中：(image0025.jpeg)\n\
    \n## Custom Attributes\n\n框架允许创建自定义属性，可以存储程序员认为相关的任何信息，这与定义类非常相似，但该类需要继承 `System.Attribute`\
    \ 类，并在上方定义 `AttributeUsage`。下面是一个基础示例，该仅创建一个描述的示例属性：\n\n```csharp\n[AttributeUsage(AttributeTargets.Class,\
    \ AllowMultiple = true, Inherited = true)]\nclass Description : Attribute\n{\n\
    \    public string Text { get; }\n    public Description(string text)\n    {\n\
    \        Text = text;\n    }\n}\n```\n\n你可以看到，这与创建类非常相似，区别在于对 `Attribute` 的继承以及\
    \ `AttributeUsage` 属性。可以这样使用：\n\n```csharp\n[Description(\"Main method!\")]\n\
    [Description(\"AllowMultiple = true, so you can have multiple Descriptions\")]\n\
    class Program\n{\n    public static void Main()\n    {\n    }\n}\n```\n\n这些信息可以通过反射（reflection）过程获取并使用，将在下一节中探讨。\n\
    \n## Reflection\n\n对象的反射用于在运行时获取信息，`System.Reflection` 提供了这些功能的访问。反射可以用于：\n\n\
    - 查看属性信息\n- 允许对方法和属性进行后期绑定\n- 允许在运行时创建类型\n\n## Metadata\n\n元数据是关于数据的数据，在这种情况下，它是关于属性的数据。开始时你需要像这样创建一个\
    \ `info` 实例：\n\n`MemberInfo info = typeof(AttributeTest);`\n\n现在可以使用它来检查信息。下面的示例打印了附加的属性。记住在顶部包含：`using\
    \ System.Reflection;`。对于示例，我们将使用之前定义的 `Description` 属性：\n\n```csharp\nusing System;\n\
    using System.Reflection;\n\nnamespace ConsoleApplication1\n{\n    class Program\n\
    \    {\n        static void Main()\n        {\n            AttributeTest t = new\
    \ AttributeTest();\n            t.PrintAttributes();\n            Console.ReadKey();\n\
    \        }\n    }\n\n    [Description(\"Description 1!\")]\n    [Description(\"\
    Description 2!\")]\n    class AttributeTest\n    {\n        MemberInfo info =\
    \ typeof(AttributeTest);\n        public void PrintAttributes()\n        {\n \
    \           // 返回属性数组\n            object[] attributes = info.GetCustomAttributes(true);\n\
    \            // 属性\n            foreach (Description attr in attributes)\n   \
    \         {\n                Console.WriteLine(attr.Text);\n            }\n  \
    \      }\n    }\n\n    [AttributeUsage(AttributeTargets.Class, AllowMultiple =\
    \ true, Inherited = true)]\n    class Description : Attribute\n    {\n       \
    \ public string Text { get; }\n        public Description(string text)\n     \
    \   {\n            Text = text;\n        }\n    }\n}\n```\n\n输出:\nDescription\
    \ 1!\nDescription 2!\n\n你可以看到程序打印了附加的属性文本。`info.GetCustomAttributes(true);` 返回属性列表，然后在随后的\
    \ `foreach` 循环中打印。\n\n## Indexers\n\n索引器允许自定义类像数组一样被索引，每个成员通过 `[]` 操作符访问。索引器的定义如下：\n\
    \n```csharp\ntype index\n{\n    get; // 返回值\n    set; // 设置值\n}\n```\n\n你可以像数组语法一样调用它。在本示例中，它将目录搜索，索引器接收一个名称：\n\
    \n```csharp\nusing System;\nusing System.Collections.Generic;\n\nnamespace ConsoleApplication1\n\
    {\n    class Program\n    {\n        static void Main()\n        {\n         \
    \   Inventory main_floor = new Inventory();\n            // 添加项目\n           \
    \ main_floor.AddItem(new Item(\"PS\", 49.50));\n            main_floor.AddItem(new\
    \ Item(\"RX480\", 200.50));\n            // 使用索引器获取价格\n            Console.WriteLine(\"\
    Price: \" + main_floor[\"RX480\"]);\n            Console.ReadKey();\n        }\n\
    \    }\n\n    class Inventory\n    {\n        List<Item> Items = new List<Item>();\n\
    \        public void AddItem(Item item)\n        {\n            Items.Add(item);\n\
    \        }\n\n        public double this[string index]\n        {\n          \
    \  get\n            {\n                foreach (Item item in Items)\n        \
    \        {\n                    if (item.Name == index)\n                    {\n\
    \                        return item.Price;\n                    }\n         \
    \       }\n                // 用于表示没有项目\n                return -1;\n         \
    \   }\n            set\n            {\n                // 你也可以用它设置值，就像在属性中设置值一样\n\
    \            }\n        }\n    }\n\n    // 保存项目的简单类\n    class Item\n    {\n \
    \       public Item(string name, double price)\n        {\n            Name =\
    \ name;\n            Price = price;\n        }\n        public string Name { get;\
    \ }\n        public double Price { get; }\n    }\n}\n```\n"
- fmt: "\nBoth the highlighted areas signify where the indexer is defined and used.\
    \ The program just keeps track of items and the indexer is used to take a string\
    \ to find the price.\n\n## Exercise\n\nAdd an overloaded version of the indexer\
    \ (This can be done) that takes the price as the index and returns the name. For\
    \ simplicity purposes don’t worry about two items having the same price, just\
    \ assume all items have different prices.\n\n## Solution\n\nYour `Inventory` class\
    \ should look like this: (The new indexer is highlighted)\n\n```csharp\nclass\
    \ Inventory\n{\n    List<Item> Items = new List<Item>();\n\n    public void AddItem(Item\
    \ item)\n    {\n        Items.Add(item);\n    }\n\n    public double this[string\
    \ index]\n    {\n        get\n        {\n            foreach (Item item in Items)\n\
    \            {\n                if (item.Name == index)\n                {\n \
    \                   return item.Price;\n                }\n            }\n   \
    \         return -1;\n        }\n    }\n\n    public string this[double index]\n\
    \    {\n        get\n        {\n            foreach (Item item in Items)\n   \
    \         {\n                if (item.Price == index)\n                {\n   \
    \                 return item.Name;\n                }\n            }\n      \
    \      return null;\n        }\n    }\n}\n```\n\n## Collections\n\nCollection\
    \ classes are specialized built in classes used for data storage and retrieval.\
    \ Some of these classes have members that are defined as `object`, `object` is\
    \ the base class for all data types in C#. This was the method of storing any\
    \ data type before the concept of generic classes was implemented.\n\nBelow is\
    \ a list and explanation of the main collections:\n\n### List<T>\n\n`List` is\
    \ the upgrade more modern version of `ArrayList`, it is a dynamically sized list\
    \ that is used to store different values of the same type, it can be extended\
    \ and reduced (where it resizes automatically). The `List` class is a generic\
    \ class (Learned about in the next chapter) but what it means in this case is\
    \ it can hold anything, even other lists (This is how you can make a 2D list).\n\
    \nA list is defined like so:\n`List<type> list = new List<type>();`\n\nWhere for\
    \ example a list of integers is defined like so:\n`List<int> list = new List<int>();`\n\
    \nValues can be added to the list by using the `.Add()` function and can be removed\
    \ by using `.Remove()`.\n\nYou can obtain the length of the `List<>` or how many\
    \ items it houses by accessing the `.Count` property.\n\n### Hashtable\n\nNote:\
    \ This is depreciated and should not be used, you should use a `Dictionary<>`,\
    \ but it’s important you know how this collection works.\n\nA hashtable is table\
    \ (as the name suggests) that stores key-value pairs, these pairs are determined\
    \ by a hash function. A hash function takes an input of any length and returns\
    \ a value of fixed length, this process can also no be undone. So in the hashtables\
    \ case, a keypair that is to be added is hashed, now this hash will be equal to\
    \ a position in the table. The key pair will then be stored in that location.\n\
    \nNote: the key specified must be unique.\n\nOne of the biggest positivises of\
    \ a hashtable is how quick it is to access or check if the table contains an item,\
    \ this is because in most lineal structures like an array or list you need to\
    \ incrementally search through a list to exhaustively check if there is an item,\
    \ but in this case of a hashtable if a search target hashed to find where it would\
    \ go and there is no value in that location, it’s not there.\n\n### Dictionary<TKey,\
    \ TValue>\n\nMust like this `List<T>`, the `Dictionary` is a generic data type\
    \ that is based off the `Hashtable` mentioned previously is uses a key value to\
    \ save data.\n\nA dictionary is defined like so:\n`Dictionary<KeyType, ValueType>\
    \ dictionary = new Dictionary<KeyType, ValueType>();`\n\nWhere `KeyType` and `ValueType`\
    \ both define the data type that will be used to store each member. Adding to\
    \ the dictionary can be done like so:\n`dictionary.Add(1, \"Value\");`\n\nAnd\
    \ you can obtain a value by searching for a key: `Console.WriteLine(dictionary[key]);`\n\
    \nAnd the values can be incremented through `foreach` value, the type that hold\
    \ both values are called `KeyValuePair<TKey, TValue>`. It’s done like so:\n```csharp\n\
    foreach (KeyValuePair<int,string> item in dictionary)\n{\n    Console.WriteLine(item.Key);\n\
    \    Console.WriteLine(item.Value);\n}\n```\n\n### Stack\n\nThis is known First-in-Last-out\
    \ (FILO) data structure where when a value is placed in its `pushed` and when\
    \ a value is taken (Can only from the top of the stack).\n\nA stack is defined\
    \ like so:\n`Stack s = new Stack();`\n\nValues are added buy pushing: `s.Push(2);`\
    \ And taken by popping. Note the use of integer cast, this is because items are\
    \ stored as objects: `int value = (int)s.Pop();`\n\n### Queue\n\nA `Queue` is\
    \ very similar to a stack but is First-in First-out (FIFO) structure. Items are\
    \ added and taken away using `Enqueue()` and `Dequeue()` respectively.\n\nA queue\
    \ is defined like so:\n`Queue q = new Queue();`\n\nAnd adding removing from a\
    \ queue is done like so:\n`q.Enqueue(1);//Take from the queueint i = (int)q.Dequeue();`\n\
    \n## Generics\n\nGenerics is a huge feature of C# that allows the programmer to\
    \ create a single definition of a class that takes any data type, even custom-made\
    \ classes. The usage of the generic type is denoted by `T`, this stems from its\
    \ origins of being called “Templating” in C++. For example `List<>` we have come\
    \ previously is a generic class.\n\nYou can create a generic class like so:\n\
    ```csharp\nclass Generic<T>\n{}\n```\n\nNotice the uses of `<>`, these are used\
    \ to create generic data type, these do not need to be define as `T` and can be\
    \ multiple definitions:\n```csharp\nclass Generic<Example, AnotherExample>\n{}\n\
    ```\n\nThe above example is valid, but it’s advised for readability to start the\
    \ definition with a `T`. Below is an example how to use the generic types:\n```csharp\n\
    class Generic<TEx>\n{\n    public TEx value;\n    public Generic(TEx _value)\n\
    \    {\n        value = _value;\n    }\n    public void Print()\n    {\n     \
    \   Console.WriteLine($\"Data is: {value}\", value);\n    }\n}\n```\n\nThis class\
    \ definition can be used with any defined data type:\n`Generic<string> gStr =\
    \ new Generic<string>(\"Hello\"); gStr.Print();`\n`Generic<int> gInt = new Generic<int>(2);\
    \ gInt.Print();`\n\nAs you can tell from the code above you define the type to\
    \ use by definition it in the `<>`. In the example below it will show it working\
    \ with a user type:\n`Generic<myClass> gMyClass = new Generic<myClass>(new myClass());\
    \ gMyClass.Print();`\nWith an output of `Data is: ConsoleApplication1.myClass`.\n\
    \nAs you can tell generics allow a very dynamic way of definition a class that\
    \ allows almost infinite amount of data types. Below is an actual functionally\
    \ program that is used to swap two data types:\n\n```csharp\nusing System;\n\n\
    namespace ConsoleApplication1\n{\n    class Program\n    {\n        static void\
    \ Main()\n        {\n            int a = 10;\n            int b = 42;\n      \
    \      Console.WriteLine($\"a is before swap: {a}\", a);\n            Console.WriteLine($\"\
    b is before swap: {b}\", b);\n            Swap<int> swap = new Swap<int>(ref a,\
    \ ref b);\n            Console.WriteLine($\"a is after swap: {a}\", a);\n    \
    \        Console.WriteLine($\"b is after swap: {b}\", b);\n            Console.ReadKey();\n\
    \        }\n    }\n\n    public class Swap<T>\n    {\n        public Swap(ref\
    \ T Left, ref T Right)\n        {\n            T temp;\n            temp = Left;\n\
    \            Left = Right;\n            Right = temp;\n        }\n    }\n}\n```\n\
    \nAnother example could be to create a generic array, note the use of indexers\
    \ to make accessing and changing values easier:\n\n```csharp\nusing System;\n\n\
    namespace ConsoleApplication1\n{\n    class Program\n    {\n        static void\
    \ Main()\n        {\n            Array<int> intArray = new Array<int>(1);\n  \
    \          intArray[0] = 1;\n            Array<string> strArray = new Array<string>(1);\n\
    \            strArray[0] = \"Hello\";\n            Console.WriteLine(intArray[0]);\n\
    \            Console.WriteLine(strArray[0]);\n            Console.ReadKey();\n\
    \        }\n    }\n\n    public class Array<T>\n    {\n        T[] array;\n  \
    \      public Array(int size)\n        {\n            array = new T[size];\n \
    \       }\n        //Indexer used to access and change values\n        public\
    \ T this[int index]\n        {\n            get { return array[index]; }\n   \
    \         set { array[index] = value; }\n        }\n    }\n}\n```\n"
