    \n# 第 1 章\n\n# 介绍与安装\n\n## C 语言的历史\n\nC 是一种通用计算机编程语言，于 1972 年首次作为概念出现。C 的首席开发者是\
    \ Dennis Ritchie。C 的起源与 Unix 操作系统的创建密切相关。\n\n在本教程中，我们将从 C 的最基础知识一直介绍到中间水平。本教程旨在吸引首次学习编程语言的读者。\n\
    \n## 在 Windows 上运行 C\n\n在 Windows 上运行 C 可以使用 Visual Studio 2015 完成。可以直接从微软下载 Visual\
    \ Studio，在安装过程中需要选择 `C++` 作为语言。菜单应该看起来如下：\n\n![](img/image00610.jpeg)\n\n选择 `Visual\
    \ C++` 后完全安装程序。\n\n你应该启动 Visual Studio 并进入 `FILE -> New Project`，你会看到一个这样的窗口：\n\
    \n![](img/image00611.jpeg)\n\n选择 `Win32 Console Application` 并点击“Ok”。\n\n现在会出现几个菜单，请按照高亮部分操作。（高亮的复选框需要取消勾）：\n\
    \n![](img/image00612.jpeg) ![](img/image00613.jpeg)\n\n当程序模板加载时，你应该注意到你并没有被提供\
    \ C 环境，而是 C++ 环境，你需要将其转换为 C：\n\n进入 `Solution explorer`，它将打开 `Solution Explorer`\
    \ 菜单\n\n![](img/image00614.jpeg) ![](img/image00615.jpeg)\n\n右键点击 `.cpp` 文件并点击“Properties”\n\
    \n![](img/image00616.jpeg)\n\n会出现一个菜单，展开 `C/C++` 菜单，进入“Advanced”，在下拉菜单中选择 `Compile\
    \ as C Code (/TC)`\n\n![](img/image00617.jpeg)\n\n代码现在准备好运行了！想要编译代码的读者点击顶部的绿色箭头来运行你的控制应用程序。\n\
    \n## 在 Linux 上运行 C\n\n在 Linux 上开发基础代码相对简单，首先你需要 `gcc` 编译器，如果你还没有安装，运行：\n\n```\n\
    apt-get install gcc-5\n```\n\n下一个阶段是创建你的程序，打开一个文本编辑器（在本例中为 Leafpad），使用这个基础程序进行测试：\n\
    \n```c\n#import <stdio.h>\n\nint main()\n{\n    printf(\"Hello, World!\\n\");\n\
    \    return 0;\n}\n```\n\n将此文件保存为 `.c` 扩展名。\n\n要编译并使用程序，你将如下使用 `gcc`：\n\n```bash\n\
    gcc -o <OutputProgramName> <C_FileName>\n```\n\n其中：\n\n`<OutputProgramName>` 是你的可执行文件名\n\
    `<C_FileName>` 是你的 C 文件名\n\n要运行程序，只需输入可执行文件名并在后跟 `./`：\n\n```bash\n./<OutputProgramName>\n\
    ```\n\n## 在 Mac 上运行 C\n\n在 Mac 上运行 C 相对简单，打开终端并运行\n\n```bash\nclang --version\n\
    ```\n\n"
- fmt: "\n`Clang` is a compiler built by Apple and deals with all the aspects of translating\
    \ code into machine code (1’s and 0’s).\n\nStart your notepad, write down your\
    \ C code use this to start:\n\n```c\n#import <stdio.h>\n\nint main()\n{\n    printf(\"\
    Hello, World!\\n\");\n    return 0;\n}\n```\n\nSave this code with the `.c` extension.\n\
    \nOpen up a terminal in the folder where you saved your `.c` file, and type:\n\
    \n`make <filename>.c`\n\nWhere `filename` is the name of the file you just saved.\
    \ To run the code just run it like so:\n\n`./<filename>.c`\n\n## Running C online\n\
    \nOne of my favourite online IDE is [https://www.codechef.com/ide](https://www.codechef.com/ide)\
    \ it provides a clear clean place to produce code.\n\n![](Images/image00618.jpeg)\n\
    \n## Prerequisites\n\nThroughout this tutorial you will see code snippets dotted\
    \ around. There’s a few points that need explaining so you can get the most out\
    \ of this tutorial:\n\n### Comments\n\nComments in code are signified by a `//`\
    \ and the green colour, these are ignored by the computer and commenting is an\
    \ important part of keeping computer code readable and easy to maintain. Starting\
    \ coders tend to discard commenting and regret it later, don’t be that programmer.\n\
    \n### Basic structure\n\nThere is also a required basic structure of a C programme,\
    \ the structure is below:\n\n```c\n#include <stdio.h>\n\nint main()\n{\n    //Code\
    \ goes here\n}\n```\n\nThis is the structure to make your C programs run, don’t\
    \ worry we’ll learn what it all means.\n\n# Chapter 2\n\n# Building Blocks\n\n\
    ## Variables and Types\n\nThe basis of a program is data, in the form of numbers\
