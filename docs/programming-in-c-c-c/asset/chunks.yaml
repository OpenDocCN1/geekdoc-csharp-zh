    \ 5 [90](#part0000.xhtml___RefHeading__13905_2034502580)\n\n# Chapter 1\n\n# Introduction\
    \ and Installation\n\n## History of C\n\nC is a general-purposed computer programming\
    \ language that first appeared as a concept in 1972. The lead developer of C was\
    \ Dennis Ritchie. The origin of C is closely related to the creation of the Unix\
    \ OS.\n\nIn this tutorial, we will go through the very basics of C right up to\
    \ the intermediate level. The tutorials is designed to appeal to the first-time\
    \ learners of a programming language.\n\n## Running C on Windows\n\nRunning C\
    \ on Windows can be done with Visual Studio 2015. Visual Studio can be downloaded\
    \ directly from Microsoft, through the installation process `C++` needs to be\
    \ selected as language. The menu should look like this:\n\n![](Images/image00610.jpeg)\n\
    \nAfter you select `Visual C++` fully install the program.\n\nYou should loads\
    \ Visual Studio up and go to `FILE -> New Project`, you’ll be met by a Window\
    \ like so:\n\n![](Images/image00611.jpeg)\n\nSelect `Win32 Console Application`\
    \ and click “Ok”\n\nA few menus will now appear, follow them through with the\
    \ highlighted sections. (The highlighted tix-boxes need to be unchecked):\n\n\
    ![](Images/image00612.jpeg) ![](Images/image00613.jpeg)\n\nWhen the program template\
    \ loads up you should notice you have not been provided with a C environment but\
    \ a C++ one, you need to convert it to C:\n\nGo to the `Solution explorer` and\
    \ it will open the `Solution Explorer` Menu\n\n![](Images/image00614.jpeg) ![](Images/image00615.jpeg)\n\
    \nRight click on the `.cpp` file and click “Properties”\n\n![](Images/image00616.jpeg)\n\
    \nA menu will appear, expand the `C/C++` menu, go to “Advanced”, select from the\
    \ drop down menu `Compile as C Code (/TC)`\n\n![](Images/image00617.jpeg)\n\n\
    The code is now ready to run! When the code you want to compile reader click the\
    \ green arrow on the top menu to run your console application.\n\n## Running C\
    \ on Linux\n\nDeveloping basic code on Linux is relatively easy first you’ll need\
    \ the `gcc` compiler, if you don’t have it installed run:\n\n```\napt-get install\
    \ gcc-5\n```\n\nThe next stage is to create your program, open up a text pad program\
    \ (Leafpad in this case) use this basic program for testing purposes:\n\n```c\n\
    #import <stdio.h>\n\nint main()\n{\n    printf(\"Hello, World!\\n\");\n    return\
    \ 0;\n}\n```\n\nSave this file with the `.c` extension.\n\nTo compile and use\
    \ the program you’ll use `gcc` like so:\n\n```bash\ngcc -o <OutputProgramName>\
    \ <C_FileName>\n```\n\nWhere:\n\n`<OutputProgramName>` is the name of the executable\
    \ you want\n`<C_FileName>` is the name of your C file\n\nTo run the program just\
    \ type the executables name followed by `./`:\n\n```bash\n./<OutputProgramName>\n\
    ```\n\n## Running C on Mac\n\nRunning C on a Mac is relatively easy, open up the\
    \ terminal and run\n\n```bash\nclang --version\n```\n"
