    9. 什么括号表示泛型类？\n10. 使用哪个变量来保存字典（dictionary）的键和值？\n\n## 答案\n\n1. 预定义的和自定义的。\n2.\
    \ 在旧的弃用方法上，由于兼容性原因无法移除但需要逐步淘汰的方法。\n3. `System.Attribute`。\n4. 关于数据的数据。\n5. 查看函数或属性的底层数据。\n\
