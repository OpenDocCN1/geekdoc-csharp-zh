    \ for items like `Console.WriteLine(\"\");` and `Console.ReadKey();`.\n\nWithout\
    \ the using statement, chop off the preceding namespace specifier:\n\n```csharp\n\
    using System;\n\nnamespace ConsoleApplication1\n{\nclass Program\n{\n    class\
