  trans: "\n\n在基于 Windows 的计算机上运行 C++ 的最佳方法之一是 Visual Studio，你可以直接从微软下载，最新版本为 Visual\
    \ Studio 2017。\n\n下载并运行安装程序，在安装程序过程中你会遇到这个菜单，请确保选了 C++。\n\n![](img/image00626.jpeg)\n\
    \n完成安装并加载 Visual Studio。\n\n要创建一个项目，你需要选择 `FILE`（文件） -> `NEW PROJECT`（新建项目），如下：\n\
    \n![](img/image00627.jpeg)\n\n你会看到这个窗口：\n\n![](img/image00628.jpeg)\n\n按照菜单操作，你就可以准备好运行代码了\n\
    \n## 在 Mac 和 Linux 上运行 C++\n\n在基于 UNIX 的环境中运行 C++ 可以通过 `clang` 或 `gcc` 实现，你可以像这样在操作系统的终端窗口中使用它：\n\
    \n```bash\ngcc main.cpp -o main.out\n```\n\n现在可以像这样运行文件了：\n\n```bash\n./main.out\n\
    ```\n\n你可以在任何喜欢的记事本编辑器中创建一个 `.cpp` 文件。\n\n## 在线运行 C++\n\n在线编译 C++ 的简单方法是使用“TutorialPoints”C++\
    \ Online，如下所示：\n\n[`www.tutorialspoint.com/compile_cpp11_online.php`](https://www.tutorialspoint.com/compile_cpp11_online.php)\n\
    \n它看起来应该是这样：\n\n![](img/image00629.jpeg)\n\n## 前提条件\n\n在开始基础知识之前，需要解释几点：\n\n首先是基础程序设计：\n\
    \n```cpp\n#include \"stdafx.h\"\nusing namespace std;\n\nint main()\n{\n    return\
    \ 0;\n}\n```\n\n上面的程序是提供的基础设计，代码位于 `main()` 部分的大括号内，每个方面都将在后面的章节中描述。\n\n你还会遇到以\
    \ `//` 开头的行，这些是注释，它们的唯一目的是为代码添加描述性标签并解释代码，它们通过独特的绿色定义：\n\n```cpp\n//Comment\n\
    ```\n\n下一点是程序的输出，在接下来的章节示例中，你将遇到类似下面的行：\n\n```cpp\ncout << \"Print\" << endl;\n\
    ```\n\n这目前只是将数据打印到屏幕上，它的部分将在后面的章节中解释。\n\n# 第 2 章：基础\n\n## 变量与类型\n\n程序的基础是数据，以数字和字符的形式存在。这些数据的存储、处理和输出提供了功能。变量持有这些数据，将其看作一个用于存储单个物品的盒子。\n\
    \nC++ 是一种强类型语言，每个变量都必须有一个定义的类型。类型是一个标识符关键字，定义了变量可以包含的内容。我们遇到的第一个类型是整数（integer），它可以包含实数（不带小数的数字），整数的定义如下：\n\
    \n```cpp\nint value = 6;\n```\n\n- `int` 是定义的类型关键字，我们稍后会学习不同可能性的区别。\n- `value`\
    \ 是变量的 ID（标识符），你可以称它为任何名字，这用于允许变量具有有意义的名字，变量可以定义为 `int pineapple = 3;`，但让它们与之相关是一个良好的习惯。不过，这里有几个例外，因为变量不能是单个数字（例如\
    \ ‘4’）或不能包含特殊字符（`!”£$%^&*`）等。\n- `= 6;` 是赋值部分，将值 6 放在整数盒子中以供以后使用。它也以分号结尾，这用于表示一行的结束。\n\
    \n该变量现在可以用于程序的有效区域，如下所示：\n\n```cpp\nint anotherValue = value;\n```\n\n之前定义的 `value`\
    \ 的值现在将被放置在 `anotherValue` 变量中，它们现在的值都为 3。`value` 的值不会改变，因为它只是复制并放置在 `anotherValue`\
    \ 中。\n\n### 字符串 (String)\n\n`String` 是另一个关键的变量，这种变量类型用于存储一系列字符，例如可以是“batman”这个词，该单词由存储在\
    \ `String` 变量中的字符组成。它是字符数组（稍后将详细介绍数组），但实际上它是单词的单个字符在内存中相邻存储的。`\\n` 是一个代表换行的特殊字符。\n\
    \n```cpp\n#include \"stdafx.h\"\n#include <string>\nusing namespace std;\n\nint\
    \ main()\n{\n    //String 类\n    string wordStr = \"\";\n    //字符数组\n    char\
    \ wordCharArray[] = \"\";\n    return 0;\n}\n```\n\n如你从上面所示，有两种保存字符串的方法，第一种是使用“封装器”（wrapper），它是一种隐藏功能并在其上添加额外功能，这使得移动字符串变得更容易（我们稍后会讨论传递变量），第二种是使用\
    \ char 数组，`string` 是存储字符串变量的推荐方法。\n\n注意使用：\n\n```cpp\n#include <string>\n```\n\
    \n这告诉程序你想在程序中使用 `string` 封装器。\n\n### 布尔值 (Boolean)\n\n布尔值用作表达式，它们的值只能是真（true）或假（false），用于表示某些状态或标记某些事件，它们还可以持有条件表达式的结果（稍后将详细介绍条件表达式）。这些将使逻辑成立。在接下来的示例中，你会遇到类似这样的行：\n\
    \n```cpp\nbool flag = true;\n```\n\n### 浮点数 (Float/Double)\n\n浮点数用于表示小数，它们的值可以是真或假（此处原文可能有误，应指数值），用于表示某些状态。\n\
    \n```cpp\nfloat value = 3.5;\n```\n\n### 空 (Void)\n\n空类型表示函数没有返回值。在某些情况下我们稍后会看到它的用法。\n\
    \n### 注意的关键字/术语\n\n- `const` – 该关键字使变量只读，意味着初始化后其值不能更改。使用方式如下：\n\n```cpp\nconst\
    \ float pi = 3.14;\n```\n\n- **全局变量** – 该术语定义在函数之外。例如，`friendCount` 是全局的：\n\n\
    ```cpp\nint friendCount = 0; // 全局\n\nint main()\n{\n    // 非全局\n    int currentMonth\
    \ = 5;\n    return 0;\n}\n```\n\n这意味着全局变量可以在任何地方使用，如果使用不当可能是危险的。与 `const` 关键字结合使用，意味着函数只能引用该值。\n\
    \n### 总结 (Recap)\n\n- `int`：持有实整数\n- `float / double`：持有小数\n- `void`：表示没有类型\n\
    - `boolean`（布尔值）：持有真或假\n- `string`：构成单词或句子的字符数组\n- `global`（全局）：可以在任何地方访问\n- `const`：意味着变量初始化后其值不能更改\n\
    \n## 条件语句 (Conditionals)\n\n### If 语句\n\n在某些情况下，你需要在满足特定条件时执行某些事情，这就是 If 语句的作用，也是条件语句介入的地方。\n\
    \n```cpp\nif (Condition)\n{\n    // 如果条件为真，则执行此处代码\n}\n// 如果条件为假，则跳转到此处\n```\n\
    \n示例：\n\n```cpp\n#include \"stdafx.h\"\n#include <iostream>\nusing namespace std;\n\
    \nint main()\n{\n    int numberOfBooks = 10;\n    if (numberOfBooks > 0)\n   \
    \ {\n        cout << \"You have a book!\" << endl;\n    }\n}\n```\n\n输出：\n\n>\
    \ You have a book!\n\n这些允许程序员控制程序的流程，并在可能性真实时选择发生的情况，我们稍后会看到更多示例。\n\n### Else\
    \ 语句\n\nElse 是可选的，但这些可以被添加到 if 语句的末尾，并且仅在 if 语句条件为假时运行。\n\n```cpp\nif (Condition)\n\
    {\n    // 如果条件为真，则执行此处代码\n}\nelse\n{\n    // 如果条件为假，则执行此处代码\n}\n```\n\nElse 语句也可以变成\
    \ else/if 语句，即挂载一个新的 if 语句，看起来像这样：\n\n```cpp\nif (Condition1)\n{\n    // 如果 Condition1\
    \ 为真，则执行此处代码\n}\nelse if (Condition2)\n{\n```\n"
