  trans: "\n\n```cs\nvar longWords = from w in words where w.Length > 10 select w;\n\
    ```\n\n我们只深入介绍查询语法，因为我认为它是最易用的，但你也可以随时查看其他查询方式进行额外研究。\n\n## 查询语法 (Query Syntax)\n\
    \n查询语法只是一个类似于 SQL 的表示形式，其中 `SELECT`、`FROM` 和 `WHERE` 以略有不同的表示形式呈现。要使用 LINQ 查询，你需要包含\
    \ `System.linq`。下面使用 LINQ 在字符串中搜索长度小于 5 个字母的值的示例：\n\n```csharp\nusing System;\n\
    \nusing System.Linq;\n\nnamespace ConsoleApplication1\n{\n\n class Program\n \
    \   {\n        static void Main()\n        {\n            string[] words = {\"\
    test\",\"verylongword\", \"sw\", \"one\"};\n            var shortWords = from\
    \ word in words\n            where word.Length < 5\n            select word;\n\
    \            foreach (var word in shortWords)\n            {\n               \
    \ Console.WriteLine(word);\n            }\n            Console.ReadKey();\n  \
    \      }\n    }\n}\n```\n\n### 输出\n>test\n>sw\n>one\n\nLINQ 语句已高亮，并将拆解如下：\n\n\
    `from word in words`\n这定义了范围以及范围的来源，这实际上是在说字符串数组 `words` 中的每一个单词。\n\n`where word.Length\
    \ < 5`\n使用范围值 `word`，获取一个属性并与一个值进行比较，这是一个条件，如果值匹配为“真（true）”，则将其添加到输出中。\n\n`select\
    \ word;`\n如果上一个条件为真，这就是要取的值。例如，你可以通过在查询末尾返回所有长度小于 5 的单词的长度：\n`select word.Length;`\n\
    \n## 练习\n\n在下方的骨架程序中，添加一个 LINQ 语句来搜索数值数组 `numbers` 以寻找偶数。然后使用 `foreach` 循环打印结果。\n\
    \n### 代码\n\n```csharp\nusing System;\n\nusing System.Linq;\n\nnamespace ConsoleApplication1\n\
    {\n\n class Program\n    {\n        static void Main()\n        {\n          \
    \  int[] numbers = {1, 4, 99, 34, 23, 12, 3, 2, 909, 1000, 13, 1, 2};\n      \
    \      //在此处添加代码\n            Console.ReadKey();            \n        }\n    }\n\
    }\n```\n\n### 答案\n\n```csharp\nusing System;\n\nusing System.Linq;\n\nnamespace\
    \ ConsoleApplication1\n{\n\n class Program\n    {\n        static void Main()\n\
    \        {\n            int[] numbers = {1,4,99, 34, 23, 12, 3, 2, 909, 1000,\
    \ 13, 1, 2};\n            var evenNumbers = from value in numbers\n          \
    \  where value % 2 == 0\n            select value;\n            foreach (var value\
    \ in evenNumbers)\n            {\n                Console.WriteLine(value);\n\
    \            }\n            Console.ReadKey();            \n        }\n    }\n\
    }\n```\n\n输出也应为：\n>4\n>34\n>12\n>2\n>1000\n>2\n\n所以，记住 LINQ 为查询数据提供了一种非常紧凑控制的语法，它也可以用于在数据库上运行\
    \ SQL 命令以查询表中的数据，这对程序员来说是极其强大的。\n\n## 章节测验\n\n1. 委托（delegates）允许程序员做什么？\n2. 多播（multicasting）允许你对委托做什么？\n\
    3. 什么是匿名方法？\n4. 事件处理器（event handler）附加在什么上？\n5. 什么是线程（thread）？\n6. 防止两个线程使用同一代码块的结构是什么？\n\
    7. LINQ 代表什么？\n8. LINQ 允许你做什么？\n9. LINQ 有哪两种类型的语法？\n10. 在什么情况下，多线程现在会有帮助？\n\n\
    ## 答案\n\n1. 保存函数的引用，这允许程序员将函数调用作为参数传递。\n2. 你可以将多个函数调用合并到一个委托中。\n3. 一个没有函数定义的函数，只是一个带有函数体定义的委托。\n\
    4. 当事件被触发时触发的委托。\n5. 单个独立的执行过程。\n6. 锁（Lock）。\n7. 语言集成查询（Language Integrated Query）。\n\
    8. LINQ 允许你快速查询数据获取结果，例如如果你只需要长度为 5 个字符的单词。\n9. 查询语法（Query syntax）和 Lambda 语法。\n\
    10. 当问题是微不足道的，即一个简单的问题时。\n\n"
- fmt: "\nOne of the best ways to run C++ on a Windows based computer is Visual Studio,\
    \ this can be downloaded directly from Microsoft with the most recent version\
    \ being Visual Studio 2017.\n\nDownload and run the installer, throughout the\
    \ installer you’ll be met with this menu, make sure C++ is selected.\n\n![](Images/image00626.jpeg)\n\
    \nComplete the install and load up Visual Studio.\n\nTo create a project you need\
    \ to then select `FILE` -> `NEW PROJECT` like so:\n\n![](Images/image00627.jpeg)\n\
    \nYou’ll then be met with this window:\n\n![](Images/image00628.jpeg)\n\nFollow\
    \ the menus through and you’ll be ready to run the code.\n\n## Running C++ on\
    \ Mac and Linux\n\nRunning on C++ on UNIX based environments can be achieved by\
    \ the use of `clang` or `gcc`, you can use it like so in the OS’s terminal window:\n\
    \n```bash\ngcc main.cpp -o main.out\n```\n\nThe file can now be run like:\n\n\
    ```bash\n./main.out\n```\n\nYou can create a `.cpp` file in a notepad editor of\
    \ your choice.\n\n## Running C++ Online\n\nA easy way to compile C++ online is\
    \ by using “TutorialPoints” C++ Online, like is below:\n\n[https://www.tutorialspoint.com/compile_cpp11_online.php](https://www.tutorialspoint.com/compile_cpp11_online.php)\n\
    \nAnd should look something like this:\n\n![](Images/image00629.jpeg)\n\n## Prerequisite\n\
    \nA few things need to be explained before starting is basics:\n\nThe first is\
    \ the basic program design:\n\n```cpp\n#include \"stdafx.h\"\nusing namespace\
    \ std;\n\nint main()\n{\n    return 0;\n}\n```\n\nThe program above is the basic\
    \ design provided, the code goes in the curly brackets of the `main()` section\
    \ and each aspect will be described in the later sections.\n\nYou’ll also come\
    \ across lines that start with `//`, these are comments and their only purpose\
    \ is to add descriptions to label and explain code, they are defined by a distinctive\
    \ green colour:\n\n```cpp\n//Comment\n```\n\nThe next thing is output from a program,\
    \ in examples in upcoming chapters you will come across lines like:\n\n```cpp\n\
    cout << \"Print\" << endl;\n```\n\nThis for the time being is simply printing\
    \ out data to the screen, the sections of it will be explained in later sections.\n\
    \n# Chapter 2: Basics\n\n## Variables and types\n\nThe basis of a program is data,\
    \ in the form of numbers and characters. The storing, manipulation and output\
    \ of this data gives functionality. Variables hold this data, think of it as a\
    \ box used to store a single item.\n\nC++ is a heavily typed language where each\
    \ variable must have a defined type. A type is an identifying keyword that defines\
    \ what the variable can hold. The first type we will come across is the integer,\
    \ this can hold real numbers (numbers without a decimal place), an integer is\
    \ defined below:\n\n```cpp\nint value = 6;\n```\n\n- `int` is the defined type\
    \ keyword, we will learn about the difference possibilities later.\n- `value`\
    \ is the ID for the variable, this can be anything you want to call it, this is\
    \ used to allow a variable to have a meaningful name, the variable could be defined\
    \ as `int pineapple = 3;`, but it’s good practise to make them relevant. However,\
    \ there are a few exception to this as a variable cannot be a single digit i.e.\
    \ ‘4’ or cannot contain special characters (`!”£$%^&*`) etc.\n- `= 6;` Is the\
    \ assignment section, where the values of 3 is placed in the integer box for use\
    \ later. This also ends with a semi colon, this is used to signify the end of\
    \ a line.\n\nThis variable can now be used in valid areas of the program, like\
    \ so:\n\n```cpp\nint anotherValue = value;\n```\n\nThe value of `value` defined\
    \ earlier will now be placed in the `anotherValue` variable and they will now\
    \ both have the value of 3. The value of `value` doesn’t change as it is just\
    \ being copied and placed into `anotherValue`.\n\n### String\n\nThe `String` is\
    \ another crucial variable, this variable type is used to store a series of characters,\
    \ an example could be the word “batman”, the word is composed of characters that\
    \ are stored in the `String` variable. It’s an array of characters (More on arrays\
    \ later), but effectively it’s the single characters of the word stored next to\
    \ each other in memory. The `\\n` is a special character that stands for a newline.\n\
    \n```cpp\n#include \"stdafx.h\"\n#include <string>\nusing namespace std;\n\nint\
    \ main()\n{\n    //String class\n    string wordStr = \"\";\n    //Character array\n\
    \    char wordCharArray[] = \"\";\n    return 0;\n}\n```\n\nAs you can see above\
    \ there are two ways to save a string, the first way is by using a ‘wrapper’ that\
    \ is something that hides functionality and adds extra on top, this makes it easier\
    \ to move around a string (we’ll talk about passing around variables later) and\
    \ the second way is to use a char array, `string` is the recommended way to store\
    \ a string variables.\n\nNote the use of:\n\n```cpp\n#include <string>\n```\n\n\
    This informs the program you want to use the `string` wrapper in the program.\n\
    \n### Boolean\n\nBooleans are used as expressions, their values can only be true\
    \ or false and are used to signify certain states or flag certain events, they\
    \ can also hold the result for a conditional expression (More on conditional expressions\
    \ later). These will make more sense when we go thought conditional statements.\n\
    \n```cpp\nbool True = true;\nbool False = false;\n```\n\n### Float/Double\n\n\
    Floating point variables are decimal values created with float point precision\
    \ math, the technical elements of how this works are outside the scope of this\
    \ tutorial but can easily be explained through resources on the internet, just\
    \ search “floating point precision”. Floats allows for a higher level of accuracy\
    \ of a value by providing decimal precision. You can specify a `float` value by\
    \ putting an `f` and the end of the value.\n\n```cpp\nfloat decimalValue = 3.0f;\n\
    ```\n\n### Void\n\nThis data type is special and is used to specify no value is\
    \ available. This sounds counter intuitive, but we’ll see where this is used later.\n\
    \n### Notable keywords/terms\n\n- `const` – This keyword turns the variable read-only,\
    \ meaning it’s value cannot be changed after it is initialised. The keyword is\
    \ used like so:\n\n```cpp\nconst float pi = 3.14f;\n```\n\n- **Global variable**\
    \ – This is a term describing a variable definition outside the main function.\
    \ For example, the `int friendCount` is a global variable and the `int currentMonth`\
    \ is not. Note the positions they’re defined:\n\n```cpp\n//Global\nint friendCount\
    \ = 0;\n\nint main()\n{\n    //Not Global\n    int currentMonth = 5;\n    return\
    \ 0;\n}\n```\n\nThis means the global variable can be used in any location in\
    \ the program and can be dangerous if not used correctly. One correct way it use\
    \ it in conjunction with the `const` keyword above, this means functions can only\
    \ reference the value and not change it.\n\n### Recap\n\n- `int`: Holds real numbers\n\
    - `float / double`: Hold decimal numbers\n- `void`: Specifies there is not type\n\
    - `boolean`: Holds either true or false\n- `string`: An array of characters making\
    \ up a word or sentence\n- `global`: A that can be accessed anywhere\n- `const`:\
    \ Means after a variable has been initialised its value cannot be changed\n\n\
    ## Conditionals\n\n### If statement\n\nThere are situations where you need something\
    \ to happen if a certain condition is the case, this is the role of the If statement\
    \ and where conditional statements come into the mix.\n\n```cpp\nif (Condition)\n\
    {\n    //Code will run here if Condition is true\n}\n//Code will jump here if\
    \ Condition is false\n```\n\nIn use:\n\n```cpp\n#include \"stdafx.h\"\n#include\
    \ <iostream>\nusing namespace std;\n\nint main()\n{\n    int numberOfBooks = 10;\n\
    \    if (numberOfBooks > 0)\n    {\n        cout << \"You have a book!\" << endl;\n\
    \    }\n}\n```\n\nOutput:\n\n> You have a book!\n\nThese allow a programmer to\
    \ control the flow of the program and choose situations to happen when a possibility\
    \ is true, we’ll go onto more examples later.\n\n### Else Statement\n\nElse’s\
    \ are optional but these can be added to the end of an if-statement and will only\
    \ run if the if-statement condition is false\n\n```cpp\nif (Condition)\n{\n  \
    \  //Code will run here if Condition is True\n}\nelse\n{\n    //Code will run\
    \ here if Condition is False\n}\n```\n\nElse statements can also become an else/if\
    \ statement where a new if statement is attached, this look like this:\n\n```cpp\n\
    if (Condition1)\n{\n    //Code will run here if Condition1 is True\n}\nif else(Condition2)\n\
    {\n```\n"
