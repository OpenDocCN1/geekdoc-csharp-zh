    \        Console.WriteLine(\"Started Engine!\");\n    }\n    public void StopEngine()\n\
    \    {\n        Console.WriteLine(\"Stopped Engine!\");\n    }\n    public Bike(string\
    \ colour, string engineType, int gas)\n    {\n        Colour = colour;\n     \
    \   EngineType = engineType;\n        Gas = gas;\n    }\n}\n```\n\n## Namespaces\n\
    \nNamespaces are used to separate definitions, it makes so names defined in one\
    \ namespace do not clash with another.\n\nA namespace is defined like so:\n\n\
    ```csharp\nnamespace Namespace1\n{\n}\n```\n\nAnd to call another namespace’s\
    \ function you use the member operator (`.`), this is done like this: `Namespace1.Class\
    \ c = new Namespace1.Class();`. Note: Namespaces cannot directly contain functions\
    \ or variable definitions.\n\nBelow is an example of using another namespace:\n\
    \n```csharp\nusing System;\n\nnamespace ConsoleApplication1\n{\nclass Program\n\
