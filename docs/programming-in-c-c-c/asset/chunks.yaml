    ### Nested structures


    Structures can also hold other structures, they can either be: internally defined
    or externally defined.


    #### Internal definition


    This is where you define a structures definition inside another’s structures variable
    definition. If we use the person example and turn the first and last name into
    a structure.


    ```c

    struct Person

    {

    int age;

    char favoriteColour[10];

    struct Name

    {

    char firstName[15];

    char lastName[15];

    } name;

    };

    ```


    Where the first name is access like so:


    `p1.name.firstName;`


    #### External definition


    This is like the same but the definition is not within another a structure:


    ```c

    struct Name

    {

    char firstName[15];

    char lastName[15];

    };


    struct Person

    {

    int age;

    char favoriteColour[10];

    struct Name name;

    };

    ```


    Where first and last name are accessed exactly the same as the internal definition.


    - Internal definition means you cannot recreate the structure in other locations
    but can use it internally

    - External definition means you can use it internally and in other locations


    This gives a much more modular and readable code.


