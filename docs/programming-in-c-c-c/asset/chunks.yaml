    ### 在函数中传递数组


    正如我们在上面学习函数时所看到的，将变量作为参数传递是非常有用的，传递许多存储在数组中的变量也是如此。然而，我们在上面已经学会了如何确定数组的大小，但这对于作为参数传递的数组不起作用的，因此我们必须传递一个代表该数组所包含元素数量的变量。有一种特殊的变量类型用于存储计数变量，它被称为
    `size_t`，它是一个无符号整数值（意味着它不会变成负数），用于存储计数值。


    下面是作为参数传递的示例：


    ```cpp

    void Print_SingleDimenArray(size_t  length, int  ageArray[])

