- fmt: "\n* What symbol comes before the destructor definition?\n* What role should\
    \ a header file take?\n* What does protected mean for a variable that is being\
    \ inherited?\n* What is the role of polymorphism?\n* What keyword is used to change\
    \ a virtual method?\n* How do you signify a pure virtual function?\n* Where can\
    \ a function or variable marked as private be accessed?\n* What is role of the\
    \ constructor?\n* What should the `.cpp` file contain?\n\n### Answers\n\n* Header\
    \ (`.h`) and C++ file (`.cpp`).\n* The symbol `~` I used to show a destructor.\n\
    * Just definitions of functions and variables.\n* It can only be accessed outside\
    \ the definition class by a class that inherits it.\n* To have a single base definition\
    \ but lots of different implementations.\n* `Override` is used to change a virtual\
    \ method.\n* With a normal function definition that is equal to `0`.\n* Only in\
    \ the class where it was defined.\n* Is a special function without a return type\
    \ that is called when an instance of a class is created.\n* Implication of functions\
    \ and variables defined in the header file.\n\n# Chapter 4: Improved Techniques\n\
    \n## Structures\n\nStructs originate from C, and come from the world of pre-class\
    \ programming. However, they’re still useful and can be use in places where classes\
    \ are deemed as overkill.\n\nA good example of using a structure being used can\
    \ be for record keeping, for example you needed to keep track of football players\
    \ in a team you would need to store:\n\n* Name\n* Kit Number\n* Wage\n* Strongest\
    \ foot\n* Etc\n\nIf there is no need to add functionality onto this information\
    \ a structure is perfect for this situation. A structure storing this information\
    \ is defined like this:\n\n```cpp\nstruct FootballPlayer\n{\n    string Name;\n\
    \    int KitNumber;\n    double Wage;\n    string StrongestFoot;\n};\n```\n\n\
    This structure contains all the values that are relevant, this will provide a\
    \ relevant container for similar information.\n\nA new instance of the structure\
    \ is defined like so:\n\n```cpp\nFootballPlayer player1;\nplayer1.Name = \"Messi\"\
    ;\nplayer1.KitNumber = 10;\nplayer1.Wage = 1000000;\nplayer1.StrongestFoot = \"\
    Both\";\n```\n\nThis code will create a `FootballPlayer` and assign values to\
    \ all its member variables.\n\nReal world usage of structures tend to be “simple”\
    \ usage where they need to just store trivial data like the example above, when\
    \ there needs to be functionality and encapsulation use a class. This is known\
    \ a POD (Plain Old Data) encapsulation.\n\nNote: The default access for structure\
    \ variables is public while classes default to private.\n\n## Enums\n\nEnums is\
    \ short for Enumerated Type as has the role of a boolean but with unlimited user\
    \ defined types, this can be used a flags for a situation like “HOME_SCREEN” or\
    \ “SETTING_SCREEN”.\n\nAn enum is defined like so:\n\n```cpp\nenum CurrentScreen\n\
    {\n    HOME,\n    SETTINGS,\n    CONTACTS,\n    CALCULATOR\n};\n```\n\nWith each\
    \ word in the brackets being a state the enum can be set as. A enum instance is\
    \ created like so:\n\n```cpp\nint main()\n{\n    CurrentScreen phone1;\n    phone1\
    \ = HOME;\n}\n```\n\nThis code above makes a new enum and assigns it as “HOME”.\
    \ You can now use the enum to check what states it is, the example below will\
    \ use a switch-case:\n\n```cpp\n#include \"stdafx.h\"\n#include <iostream>\n\n\
    using namespace std;\n\nenum CurrentScreen\n{\n    HOME,\n    SETTINGS,\n    CONTACTS,\n\
    \    CALCULATOR\n};\n\nint main()\n{\n    CurrentScreen phone1;\n    //Change\
    \ me\n    phone1 = HOME;\n\n    switch (phone1)\n    {\n        case HOME:\n \
    \           cout << \"You're on the home page\" << endl;\n            break;\n\
    \        case SETTINGS:\n            cout << \"You're on the settings page\" <<\
    \ endl;\n            break;\n        case CONTACTS:\n            cout << \"You're\
    \ on the contacts page\" << endl;\n            break;\n        case CALCULATOR:\n\
    \            cout << \"You're on the calculator page\" << endl;\n            break;\n\
    \        default:\n            break;\n    }\n}\n```\n\n### Output\n\n>You’re\
    \ on the home page\n\nThis code shows you can use conditional structures along\
    \ with an enum to easily create a nice branched structure. Mess around with the\
    \ commented “Change me” enum definition and see how the output changes.\n\n##\
    \ Unions\n\nUnions are a data structures designed to provide efficient memory\
    \ usages, they can contain as many member variables as it needs however it can\
    \ only store data for a single variable at a time. So the entire structure only\
    \ takes up memory for the biggest member variable.\n\nThese have to be used with\
    \ caution because setting value of another member variable will remove data stored\
    \ in another, so it is incredibly easy to lose important data.\n\nA union is defined\
    \ like so:\n\n```cpp\nunion Example\n{\n    int i;\n    int x;\n    int y;\n};\n\
    ```\n\n(Note: The provided text for Unions contained highly repetitive and garbled\
    \ sentences; I have cleaned the core technical logic based on the definition of\
    \ unions provided.)\n\n## Variable argument lists\n\nVariable argument lists allow\
    \ for the possibly endless parameters. Before we have come across functions with\
    \ a static amount of parameters (variables you can pass) like:\n\n```cpp\nint\
    \ Add(int i, int y)\n```\n\nHas two parameters integer `i` and `y`.\n\nThis is\
    \ known as a Variadic Function or a function with unlimited arity (so `Add` above\
    \ has an arity of 2).\n\nThe variables are stored in a variable known as the `va_list`\
    \ it just holds the list of variables passed. A variadic function is defined like\
    \ so:\n\n```cpp\nvoid Add(int numberOfVariables, ...)\n```\n\nWhere `numberOfVariables`\
    \ is the number of extra parameters passed, note this does not include this variable.\
    \ This is required because the `va_list` does not know the total number of variables\
    \ and does not keep track of where it is in the list.\n\nUsing the `vaist` requires\
    \ the use of a few functions:\n\n* `va_start(va_list, numberOfVariables)`: Grabs\
    \ the variables passed in and assigns the number specified by the second parameter\
    \ to the first parameter.\n* `va_arg(va_list, type)`: Grabs the next variable\
    \ from the specified list in the first parameter and creates a variable specified\
    \ by `type`.\n* `va_end(va_list)`: Ties up the list specified.\n\nWe can now use\
    \ these functions to create a working variadic function:\n\n```cpp\n#include \"\
    stdafx.h\"\n#include <cstdarg>\n#include <iostream>\n\nusing namespace std;\n\n\
    void Add(int numberOfVariables, ...)\n{\n    //The variable list\n    va_list\
    \ arg;\n    //Grabs the list\n    va_start(arg, numberOfVariables);\n\n    int\
    \ total = 0;\n    for (int i = 0; i < numberOfVariables; i++)\n    {\n       \
    \ //Grabs the next variable\n        total += va_arg(arg, int);\n    }\n\n   \
    \ //Clean up\n    va_end(arg);\n\n    cout << \"Total is: \" << total << endl;\n\
    }\n```\n"
  raw: "*   What symbol comes before the destructor definition?\n\n*   What role should\
    \ a header file take?\n\n*   What does protected mean for a variable that is being\
    \ inherited?\n\n*   What is the role of polymorphism?\n\n*   What keyword is used\
