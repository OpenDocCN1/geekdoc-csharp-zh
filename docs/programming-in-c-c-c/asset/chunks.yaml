    ### Passing Arrays in functions


    As we saw when we learned about functions above, passing variables in as parameters
    can be very useful and so can passing in lots of variables stored as an array.
    However, we learnt above how to determine the size of an array above but this
    does not work with an array passed as a parameter, so we must pass in a variable
    that represents the number of elements that array is holding. There is a special
    variable type used to hold count variables, it’s called `size_t` and it is an
    unsigned integer value (Meaning it cannot become negative) used to hold values
    for a count.


    An example of an array being passed as a parameter is below:


    ```cpp

    void Print_SingleDimenArray(size_t  length, int  ageArray[])

    {

    //Length is used to dynamically determine the for loop length

    for (int i = 0; i < length; i++)

    {

    printf("%d\n",ageArray[i]);

    }

    }


    int main()

    {

    //An array of ages

    int ages[] = { 32, 11, 12, 1, 8, 5, 10 };

    //Size is determined as shown previously

    size_t ageLen = sizeof(ages) / sizeof(ages[0]);

    //Method call

    Print_SingleDimenArray(ageLen, ages);

    }

    ```


