    {\n class  Program\n    {\nstatic  void Main(string[] args)\n        {\nDog d1\
    \ = new  Dog(\"Rocko\", 3, \"Blue One\", \"Red\");\n d1.PrintName();\n       \
    \ }\n    }\n class  Animal\n    {\n public Animal(string _name, int _age)\n  \
