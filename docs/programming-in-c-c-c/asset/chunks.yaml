    10. `KeyValuePair<TKey, TValue>`\n\n# 第 6 章\n\n# 进程与功能\n\n## 委托 (Delegates)\n\n\
    如果你以前遇到过 `C` 或 `C++` 中的函数指针，那么委托（`Delegates`）与它们非常相似。因此，委托是一个持有指向函数引用的引用类型变量。\n\
    \n委托的一个真实世界应用是将其用于函数的动态回调（call back），将委托作为参数传递并动态调用该函数。\n\n例如，下面的定义可以引用任何具有两个\
    \ `int` 参数、返回整数且标记为私有（private）的方法。\n\n```csharp\npublic delegate int ExampleDeligate(int\
    \ a, int b);\n```\n\n然后你将使用 `new` 关键字创建该委托的实例：\n\n```csharp\nusing System;\n\n\
    namespace ConsoleApplication1\n{\n    class Program\n    {\n        public delegate\
    \ int ExampleDeligate(int a, int b);\n        static void Main()\n        {\n\
    \            ExampleDeligate addDel = new ExampleDeligate(AddTwoNumbers);\n  \
    \      }\n        public static int AddTwoNumbers(int a, int b)\n        {\n \
    \           return a + b;\n        }\n    }\n}\n```\n\n你可以看到，委托已初始化，且括号内是它将引用的函数名。\n\
    \n使用委托就像对待任何其他函数一样对待它：\n\n```csharp\naddDel(1, 2);\n```\n\n这提供了一种非常动态且实用的将函数作为参数传递的方法。下面是一个使用它作为计算器的示例：\n\
    \n```csharp\nusing System;\n\nnamespace ConsoleApplication1\n{\n    class Program\n\
    \    {\n        public delegate float Calculation(float a, float b);\n       \
    \ static void Main()\n        {\n            // 你所做的就是通过名称传递函数\n            Calculater(10,\
    \ 20, Add);\n            Calculater(5, 267, Sub);\n            Calculater(14,\
    \ 2, Mul);\n            Calculater(10, 10, Div);\n            Console.ReadKey();\n\
    \        }\n        public static void Calculater(float a, float b, Calculation\
    \ cal)\n        {\n            // 动态方法调用\n            float value = cal(a, b);\n\
    \            Console.WriteLine($\"New value is: {value}\", value);\n        }\n\
    \        // 基础函数\n        public static float Add(float a, float b)\n        {\n\
    \            return a + b;\n        }\n        public static float Sub(float a,\
    \ float b)\n        {\n            return a - b;\n        }\n        public static\
    \ float Mul(float a, float b)\n        {\n            return a * b;\n        }\n\
    \        public static float Div(float a, float b)\n        {\n            return\
    \ a / b;\n        }\n    }\n}\n```\n\n输出：\nNew value is: 30\nNew value is: -2\n\
    New value is: 28\nNew value is: 1\n\n高亮区域显示了你如何将委托作为参数传入，你所做的是将函数传递到委托的位置，这提供了一种极易用的代码复用方法。\n\
    \n### 多路委托 (Multicasting)\n\n委托还允许将函数调用级联在一起，如下：\n\n```csharp\nCalculation DEL\
    \ = new Calculation(Add);\nDEL += new Calculation(Sub);\nDEL += new Calculation(Mul);\n\
    DEL += new Calculation(Div);\n```\n\n这意味着所有的方法将在一个链中被调用，例如，假设参数是 10 和 20，答案将等于最后一个添加的方法，在这种情况下（10/20\
    \ = 0.5），在这个示例中，它运行了所有方法，但它们之间互不影响，所以不会改变答案，因此在选择要将哪个方法添加到委托时需要仔细考虑。\n\n但下面的示例在没有返回值的情况下：\n\
    \n```csharp\nusing System;\n\nnamespace ConsoleApplication1\n{\n    class Program\n\
    \    {\n        public delegate void Print();\n        static void Main()\n  \
    \      {\n            Print call = new Print(PrintHello);\n            call +=\
    \ new Print(Today);\n            call += new Print(Car);\n            // 方法调用\n\
    \            call();\n            Console.ReadKey();\n        }\n        public\
    \ static void PrintHello()\n        {\n            Console.WriteLine(\"Hello\"\
    );\n        }\n        public static void Today()\n        {\n            Console.WriteLine(\"\
    Today\");\n        }\n        public static void PrintCar()\n        {\n     \
    \       Console.WriteLine(\"Car\");\n        }\n    }\n}\n```\n\n这显示了你可以将多个函数调用组合到一个委托中，它可以作为参数传递并在另一个函数中使用。\n\
    \n## 匿名方法 (Anonymous Methods)\n\n之前我们提到委托用于引用与委托签名相同的方法。\n\n匿名方法提供了一种将代码块作为委托传递的技术。它们是没有名称的方法，所以它们只是方法体。你不需要定义方法的返回类型，它是从方法体中的返回语句中自动推断出来的。\n\
    \n匿名方法实际上是没有引用实际方法的委托，它是为了委托而创建的，回到我们的计算器示例，它看起来像这样：\n\n```csharp\nusing System;\n\
    \nnamespace ConsoleApplication1\n{\n    // 委托\n    public delegate int Calculation(int\
    \ a, int b);\n    class Program\n    {\n        Calculation add = delegate (int\
    \ a, int b)\n        {\n            return a + b;\n        };\n        Calculation\
    \ sub = delegate (int a, int b)\n        {\n            return a - b;\n      \
    \  };\n        Calculation mul = delegate (int a, int b)\n        {\n        \
    \    return a * b;\n        };\n        Calculation div = delegate (int a, int\
    \ b)\n        {\n            return a / b;\n        };\n        static void Main()\n\
    \        {\n            Program p = new Program();\n            p.add(10, 20);\n\
    \            p.div(2, 10);\n            Console.WriteLine();\n        }\n    }\n\
    }\n```\n\n其中每个命令都定义为匿名方法，并像普通函数一样调用。匿名方法减少了创建委托的编码开销，因为在创建委托实例之前定义另一个方法，这似乎是浪费。所以当创建方法的开销很大时，应该使用匿名方法。\n\
    \n## 事件 (Events)\n\n事件是用户操作，如按键、点击、鼠标移动等。这允许执行依赖于事件触发的代码，这被称为事件驱动编程。\n\n委托通常与事件一起使用，事件通过委托与事件处理器（触发检测）相关。事件使用发布者-订阅者模型：\n\
    \n*   发布者是包含事件的类，正如其名，用于发布事件。\n*   订阅者类是接受事件的类。发布者类中的委托调用订阅者类的方法。\n\n### 声明事件\
    \ (Declaring Event)\n\n要在类内部声明事件，你首先需要定义一个委托类型并将其附加到处理器上。下面的代码演示了这一点：\n\n```csharp\n\
    using System;\n\nnamespace ConsoleApplication1\n{\n    public delegate string\
    \ DelExample(string str);\n    class EventExample\n    {\n```\n\n"
