    Function Parameters


    Sometimes it might be useful to pass data into a program, there are two types
    of parameter passing, by reference and by value. Passing by reference is what
    it sounds like, it passes a direct reference to a variable not a copy, so any
    changes to that passed variable effect it back in the calling function. Passing
    by value is the passing of a copy of that variable, so any changes to that variable
    do not effect that passed variable.


    16.  Passing by reference means changes to the parameter effects the passed variable


    17.  Passing by value means changes to parameter does not affect the passed variable


    Passing by value


    void Add(int  num1, int  num2)


    {


    //Adds values together


    int newValue = num1 + num2;


    //Prints result


    printf("The result is: %d", newValue);


    }


    int main()


    {


    //Method call


    Add(10, 4);


    return 0;


    }


    Output:


    > The result is: 14


    Below is another example but this time a string is used a parameter:


    void PrintStr(char  word[])


    {


    cout <<  word  << endl;


    }


    The method call looks like this:


    PrintStr("Flying Squirrel");


    This is an incredibly useful feature that allows us to make general purpose code
    and change its function output by what is put in as a parameter.


    Passing by reference


    Passing by reference is done with the use of pointers (Will be further explained
    later) but a pointer is a memory address, so any changes done affect the variable
    being passed in. A reference parameter is shown by the “&” and is done like so:


    void Change(int& ParaValue)


    {


    ParaValue = 20;


    }


    int main()


    {


    int value = 10;


    Change(value);


    cout << value << endl;


    return 0;


    }


    Output


    >20


    As you can see the change method alters the value of the integer ‘value’ and effects
    the value back in the main method.


    Returning values


    Returning allows us to return data from a method, this lets us do computation
    within a function and get the function to automatically return the result. Let’s
    take the one of the previous examples and adapt it so it returns the result instead
    of printing it:


    int Add(int  num1, int  num2)


    {


    //Adds values together


    int newValue = num1 + num2;


    //Returned keyword


    return newValue;


    }


    int main()


    {


    //Method call


    int storeResult = Add(10, 4);


    return 0;


    }


    The areas that changed have been highlighted. When a value is to be returned,
    the “return” keyword is used, after this line has run it returns to the line where
    the method was called so any code under the return will not run.


    The returned result is then stored in ‘storeResult’ to be used later. Returning
    can happen with any variable type. I’ll show you an example below that checks
    if the number is an even value (Using the modulus operator talked about above
    that finds the remainder of a division):


     bool EvenNumber(int  value)


    {


    if (value % 2 == 0)


    {


    //Return true


    return 1;


    }


    return 0;


    }


    int main()


    {


