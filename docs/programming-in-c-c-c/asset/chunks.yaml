  trans: "\n有几点需要注意，缺乏迭代循环，递归在本质上导致了循环。第二点是要注意标记为“停止条件”的 `if` 语句，如果递归设置没有停止其循环的条件，它们将无限循环，因此这是有效使用递归的关键元素。如果你还没有完全理解，不要担心，我们稍后将在教程的高级部分进行更详细的介绍。\
    \ \n\n## 数组 (Arrays)\n\n之前提到过数组，它是一种在内存中紧挨着存储一组固定数量变量的数据结构。数组会被赋予一个类型，例如 `int`。数组被用于快速定义大量变量并将相关变量放在一起。数组的定义如下：\n\
    \n一个静态大小，在方括号中指定大小：\n\n```c\nint lotsOfNumber[20];\n```\n\n或者你也可以在定义时赋值，注意：不需要定义大小，因为它是根据你指定的数值自动确定的：\n\
    \n```c\nint lotsOfNumbers[] = {1,3,4};\n```\n\n*   数组从 0 开始，所以第一个索引的标识值为 0，第二个是\
    \ 1，依此类推。这意味着在访问值时，你需要记住它总是比包含的数值少 1\n\n你可以像这样访问索引：\n\n```c\nint var = lotsOfNumbers[0];\n\
    ```\n\n这将抓取数组的第一个索引并将其放入 `var` 中。\n\n数组非常有助于快速访问紧密相关的数据，你可以使用 `for` 循环遍历索引并根据需要使用它们。示例如下：\n\
    \n```c\nint lotsOfNumbers[] = { 1, 3, 4, 10};\n\nfor (int x = 0; x < 4; x++)\n\
    {\n    printf(\"%d\\n\", lotsOfNumbers[x]);\n}\n```\n\n输出：\n> 1\n> 3\n> 4\n> 10\n\
    \n在 C 语言中，你无法直接获取长度需要手动计算，这可以通过简单地使用 `sizeof()` 关键字来实现，它返回方括号内元素的大小，例如在 64 位机器上，`int`\
    \ 应该用 4 字节表示，因此 `sizeof` 将返回 4。数组的长度可以这样计算：\n\n```c\nint arrayLength = sizeof(lotsOfNumbers)\
    \ / sizeof(lotsOfNumbers[0]);\n```\n\n这获取了数组的整个大小，并除以第一个元素的大小，除法的结果就是数组拥有的索引数量。\n\
    \n### 多维数组 (Multi-dimensional arrays)\n\n你也可以在数组中定义第二个维度，甚至是第三个维度，这在处理数组时提供了更大的灵活性。例如，二维数组可以用于存储网格的坐标或位置。二维数组的定义如下：\n\
    \n```c\nint arrayOfNumbers[][2] = { {1,1}, {1,1}};\n```\n\n你通过在方括号中放入 x 和 y 坐标的值来访问元素：\n\
    \n```c\nint element = arrayOfNumbers[X][Y]\n```\n\n显而易见的区别是第二个维度需要一个值，这在创建数组时无法自动解析，且初始化需要嵌套的大括号。下面是三\
    \ D 数组的示例：\n\n```c\nint arrayOfNumbers[][][2] = {{{1,1},{1,1}},{{1,1},{1,1}}};\n\
    ```\n\n但在这一阶段，它开始失去可读性，更好的做法是将其排列成如下：\n\n```c\nint arrayOfNumbers[][][2] =\n{\n\
    \    {{1,1},{1,1}},\n    {{1,1},{1,1}}\n};\n```\n\n### 在函数中传递数组 (Passing Arrays\
    \ in functions)\n\n正如我们在上面学习函数时所看到的，将变量作为参数传递是非常有用的，传递存储在数组中的大量变量也是如此。然而，我们在上面学学了如何确定数组的大小，但这对于作为参数传递的数组不起作用，因此我们必须传递一个代表该数组所含元素数量的变量。有一种特殊的变量类型用于存储计数变量，它被称为\
    \ `size_t`，它是一个无符号整数值（意味着它不会变成负数），用于存储计数值。\n\n下面是作为参数传递数组的示例：\n\n```c\nvoid Print_SingleDimenArray(size_t\
    \ length, int ageArray[])\n{\n    // Length 用于动态确定 for 循环的长度\n    for (int i =\
    \ 0; i < length; i++)\n    {\n        printf(\"%d\\n\",ageArray[i]);\n    }\n\
    }\n\nint main()\n{\n    // 一个年龄数组\n    int ages[] = { 32, 11, 12, 1, 8, 5, 10\
    \ };\n    // 大小如之前所示确定\n    size_t ageLen = sizeof(ages) / sizeof(ages[0]);\n\
    \    // 方法调用\n    Print_SingleDimenArray(ageLen, ages);\n}\n```\n\n输出：\n> 32\n\
    > 11\n> 12\n> 1\n> 8\n> 5\n> 10\n\n数组已被传递并用于打印值。数组的长度对程序至关重要，因为它允许 `for` 循环适用于不同长度的数组。\n\
    \n*   在任何方法中对数组的任何更改都会改变调用方法中的数组变量。这就是之前提到的引用传递，整个数组并没有被复制，而是通过引用传递的。\n\n### 进阶\
    \ (Advanced)\n\n有些事情需要注意，递归在本质上导致了循环。如果递归设置没有停止其循环的条件，它们将无限循环，因此这是有效使用递归的关键元素。\n\
    \n### 用户输入 (User input)\n\n有时需要从用户那里获取输入，在我们进入它们如何工作之前，我们首先需要学习 `scanf()` 和 `printf()`\
    \ 的格式标识符：\n\n| 格式标识符 | 有效输入 | 所需类型 |\n|---|---|---|\n| %c | 单个字符 | char |\n| %f\
    \ | 浮点值 | float |\n| %d | 十进制整数 | int |\n| %o | 八进制 | int |\n| %u | 无符号整数（仅正数）\
    \ | int |\n| %x | 十进制 | int |\n| %s | 字符串（读取到空白） | char[] |\n\n`scanf()` 通过抓取输入并放入变量来工作：\n\
    \n```c\nchar name[20];\nscanf(\"%s\", name);\n```\n\n以及获取整数的示例：\n\n```c\nint userInputInt;\n\
    scanf(\"%d\", &userInputInt);\n```\n\n注意：对 `userInputInt` 使用 `&` 表示它是内存位置的引用，读入的值被放入该变量。\n\
    \n`printf` 用于向控制台显示信息，用于调试和用户界面。`printf` 使用与 `scanf()` 相同的格式标识符：\n\n```c\nint\
    \ number = 10;\nprintf(\"%d\", number);\n\nchar word[] = \"Lemon\";\nprintf(\"\
    %s\", word);\n```\n\n这些格式标识符作为占位符工作，`printf` 可以根据打印字符串中存在的格式标识符数量接受多个参数。例如：\n\n\
    ```c\nint number = 10;\nchar word[] = \"Lemon\";\nprintf(\"一个水果是: %s，这里有一个数字:\
    \ %d\", word, number);\n```\n\n每个格式标识符按顺序被参数替换；这里 `%s` 被 `word` 替换，`%d` 被 `number`\
    \ 替换。这可以适用于任意数量的格式标识符。\n\n`fputs()`\n\n当你只想向控制台打印字符串时，`fputs()` 是一个简单简单的替代方案。`fputs()`\
    \ 不使用 `printf()` 使用的格式标识符，因此它不需要检查格式，速度更快。它还会在打印行的末尾自动加上 `\\n`。\n\n## 第二章测试 (Quiz\
    \ chapter 2)\n\n本部分旨在让你对之前的内容保持警觉，会有 10 个问题你可以回答以测试你的知识，答案在下面的相邻章节中。\n\n1. 列举一种用于存储小数的数据类型？\n\
    2. 布尔值可以持有哪两个值？\n3. 什么是条件语句？\n4. 组成 `for` 循环的三个部分。\n5. `continue` 关键字实现了什么？\n"
