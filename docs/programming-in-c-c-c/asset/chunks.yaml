  trans: "\n\n* 析构函数定义之前是什么符号？\n* 头文件应该承担什么角色？\n* 对于被继承的变量，`protected` 意味着什么？\n* 多态的作用是什么？\n\
    * 使用哪个关键字来更改虚方法？\n* 如何表示纯虚函数？\n* 标记为 `private` 的函数或变量可以在哪里被访问？\n* 构造函数的作用是什么？\n\
    * `.cpp` 文件应该包含什么内容？\n\n### 答案\n\n* 头文件 (`.h`) 和 C++ 文件 (`.cpp`)。\n* 我使用符号 `~`\
    \ 来表示析构函数。\n* 仅包含函数和变量的定义。\n* 只能由继承它的类在定义类之外访问。\n* 为了拥有单一基类定义但有许多不同的实现。\n* 使用\
    \ `Override` 来更改虚方法。\n* 使用一个等于 `0` 的普通函数定义。\n* 仅在定义它的类内部可以访问。\n* 是一种没有返回类型的特殊函数，在类实例创建时被调用。\n\
    * 在头文件中定义函数和变量的影响。\n\n# 第 4 章：改进技巧\n\n## 结构体 (Structures)\n\n结构体源于 C 语言，来自类编程时代。然而，它们仍然有用，并且可以在认为类过于大材小用的地方使用。\n\
    \n使用结构体的一个良好例子是用于记录，例如，如果你需要跟踪球队中的足球运动员，你需要存储：\n\n* 姓名 (Name)\n* 球衣号码 (Kit Number)\n\
    * 薪水 (Wage)\n* 擅长的脚 (Strongest foot)\n* 等\n\n如果不需要向这些信息添加功能，那么结构体非常适合这种情况。一个存储这些信息的结构体定义如下：\n\
    \n```cpp\nstruct FootballPlayer\n{\n    string Name;\n    int KitNumber;\n   \
    \ double Wage;\n    string StrongestFoot;\n};\n```\n\n该结构体包含了所有相关值，这为同类信息提供了一个相关的容器。\n\
    \n结构体的新实例定义方式如下：\n\n```cpp\nFootballPlayer player1;\nplayer1.Name = \"Messi\"\
    ;\nplayer1.KitNumber = 10;\nplayer1.Wage = 1000000;\nplayer1.StrongestFoot = \"\
    Both\";\n```\n\n这段代码将创建一个 `FootballPlayer` 对象并为它的所有成员变量赋值。\n\n结构体的实际世界用法往往是“简单”的使用，即它们只需要存储像上面这样的简单数据；当需要功能和封装时，请使用类。这被称为\
    \ POD（纯旧数据）封装。\n\n注意：结构体变量的默认访问权限是 `public`，而类默认是 `private`。\n\n## 枚举 (Enums)\n\
    \nEnum 是 Enumerated Type（枚举类型）的缩写，它具有布尔值的作用，但具有无限的用户定义类型，它可以用于像“HOME_SCREEN”或“SETTING_SCREEN”情况的标志。\n\
    \n枚举的定义如下：\n\n```cpp\nenum CurrentScreen\n{\n    HOME,\n    SETTINGS,\n    CONTACTS,\n\
    \    CALCULATOR\n};\n```\n\n括号中的每个单词都是枚举可以设置的状态。枚举实例的创建方式如下：\n\n```cpp\nint main()\n\
    {\n    CurrentScreen phone1;\n    phone1 = HOME;\n}\n```\n\n上面的代码创建了一个枚举并将其赋值为“HOME”。你现在可以使用枚举来检查它处于什么种状态，下面的示例将使用\
    \ `switch-case`：\n\n```cpp\n#include \"stdafx.h\"\n#include <iostream>\n\nusing\
    \ namespace std;\n\nenum CurrentScreen\n{\n    HOME,\n    SETTINGS,\n    CONTACTS,\n\
    \    CALCULATOR\n};\n\nint main()\n{\n    CurrentScreen phone1;\n    //Change\
    \ me\n    phone1 = HOME;\n\n    switch (phone1)\n    {\n        case HOME:\n \
    \           cout << \"You're on the home page\" << endl;\n            break;\n\
    \        case SETTINGS:\n            cout << \"You're on the settings page\" <<\
    \ endl;\n            break;\n        case CONTACTS:\n            cout << \"You're\
    \ on the contacts page\" << endl;\n            break;\n        case CALCULATOR:\n\
    \            cout << \"You're on the calculator page\" << endl;\n            break;\n\
    \        default:\n            break;\n    }\n}\n```\n\n### 输出\n\n>You’re on the\
    \ home page\n\n这段代码向你展示了如何结合条件结构和枚举轻松创建一个良好的分支结构。尝试修改注释掉的“Change me”枚举定义，看看输出是如何变化的。\n\
    \n## 联合体 (Unions)\n\n联合体是旨在提供高效内存使用的的数据结构，它们可以包含所需的任意成员变量，但一次只能存储一个变量的数据。因此，整个结构只占用最大成员变量的内存。\n\
    \n这些联合体必须谨慎使用，因为设置另一个成员变量的值将移除存储在另一个变量中的数据，因此非常容易丢失重要数据。\n\n联合体的定义如下：\n\n```cpp\n\
    union Example\n{\n    int i;\n    int x;\n    int y;\n};\n```\n\n（注：原文关于联合体的文本包含高度重复且混乱的句子；我已根据提供的联合体定义清理了核心技术逻辑。）\n\
    \n## 可变参数列表 (Variable argument lists)\n\n可变参数列表允许可能的无限参数。在此之前遇到遇到具有静态数量参数（你可以传递的变量）的函数，例如：\n\
    \n```cpp\nint Add(int i, int y)\n```\n\n有两个参数整数 `i` 和 `y`。\n\n这被称为变变函数（Variadic\
    \ Function）或具有无限变数的函数（因此上面的 `Add` 变数为 2）。\n\n变量被存储在一个名为 `va_list` 的变量中，它只持有所传递的变量列表。变变函数的定义如下：\n\
    \n```cpp\nvoid Add(int numberOfVariables, ...)\n```\n\n其中 `numberOfVariables`\
    \ 是传递的额外参数的数量，注意这不包括该变量本身。这是必要的，因为 `va_list` 并不知道变量的总数，也不会跟踪它在列表中的位置。\n\n使用 `va_list`\
    \ 需要使用几个函数：\n\n* `va_start(va_list, numberOfVariables)`：获取传入的变量，并将第二个参数指定的数字分配给第一个参数。\n\
    * `va_arg(va_list, type)`：从第一个参数指定的列表中获取下一个变量，并创建一个由 `type` 指定的变量。\n* `va_end(va_list)`：结束指定的列表。\n\
    \n我们现在可以使用这些函数来创建一个可以运行的变变参数函数：\n\n```cpp\n#include \"stdafx.h\"\n#include <cstdarg>\n\
    #include <iostream>\n\nusing namespace std;\n\nvoid Add(int numberOfVariables,\
    \ ...)\n{\n    //The variable list\n    va_list arg;\n    //Grabs the list\n \
    \   va_start(arg, numberOfVariables);\n\n    int total = 0;\n    for (int i =\
    \ 0; i < numberOfVariables; i++)\n    {\n        //Grabs the next variable\n \
    \       total += va_arg(arg, int);\n    }\n\n    //Clean up\n    va_end(arg);\n\
    \n    cout << \"Total is: \" << total << endl;\n}\n```\n\n"
- fmt: "\n```cpp\nint main()\n{\n    // 4 Arguments\n    Add(4, 1, 2, 3, 4);\n\n \
    \   // 10 Arguments\n    Add(10, 6, 9, 5, 11, 22, 1, 3, 56, 90, 63);\n}\n```\n\
    \nOutput\n> Total is: 10\n> Total is: 266\n\nEach section of the variable list\
    \ process is labelled, this function adds all parameters it’s given. This gives\
    \ a very dynamic way to create one function that can handle an almost infinite\
    \ list of parameters.\n\n### Exercise\n\nCreate a function that multiplies all\
    \ the parameters given and returns a value, print out that value. Note: this `#include`\
    \ is required:\n\n```cpp\n#include <cstdarg>\n```\n\n### Solution\n\nSomething\
    \ like this:\n\n```cpp\n#include \"stdafx.h\"\n#include <cstdarg>\n#include <iostream>\n\
    \nusing namespace std;\n\nint Multi(int numberOfVariables, ...)\n{\n    va_list\
    \ arg;\n    va_start(arg, numberOfVariables);\n    int total = 1;\n    for (int\
    \ i = 0; i < numberOfVariables; i++)\n    {\n        // Grabs the next variable\n\
    \        total *= va_arg(arg, int);\n    }\n    va_end(arg);\n    return total;\n\
    }\n\nint main()\n{\n    cout << \"The total is: \" << Multi(3, 56, 90, 63) <<\
    \ endl;\n}\n```\n\n## Namespaces\n\nNamespaces are used to prevent variables and\
    \ functions with the same name getting mixed up, for example the function `Run()`\
    \ can be applicable in many situations so there needs to be a way to distinguish\
    \ between different `Run()` functions, this is where namespaces can be used.\n\
    \nThey are defined like so with all functions and variables in the curly brackets\
    \ being part of that namespace:\n\n```cpp\nnamespace NamespaceName\n{\n}\n```\n\
    \nThe example below shows how they are used:\n\nTwo namespaces are defined like\
    \ so with the same function name:\n\n```cpp\nnamespace Proccesing\n{\n    void\
    \ Run()\n    {\n        cout << \"Processing!\" << endl;\n    }\n}\n\nnamespace\
    \ Initialisation\n{\n    void Run()\n    {\n        cout << \"Initialisation started!\"\
    \ << endl;\n    }\n}\n```\n\nThis gives the programmer the opportunity to pick\
    \ which `Run()` they can execute by just specifying the namespace like so:\n\n\
    `Proccesing::Run();`\n\nand\n\n`Initialisation::Run();`\n\nand with them both\
    \ run together:\n\n```cpp\nint main()\n{\n    Initialisation::Run();\n    Proccesing::Run();\n\
    }\n```\n\nOutput\n> Initialisation started!\n> Processing!\n\nNamespaces therefore\
    \ gives a way to neatly segment code, and improves readability by providing a\
    \ way to almost label blocks of code.\n\n## End of chapter Quiz\n\n* What is the\
    \ recommended situation you should use a `struct`?\n* What is `enum` short for?\n\
    * How the size of a `union` dictated?\n* What is a key factor about a `union`?\n\
    * What is a Variadic function?\n* What does a `va_list` hold?\n* Why do you need\
    \ to specified the number of parameters in a variable function?\n* Why does `va_end()`\
    \ need to be run?\n* What is the base role of a namespace?\n* What syntax is used\
    \ when calling a function inside a namespace, say you’re calling the function\
    \ `Add()` inside the namespace `Math`?\n\n### Answers\n\n* For plain old data\
    \ (POD).\n* Enumerated type.\n* It’s the size of its largest member variable\n\
    * All the member variables share the same memory location so only on variable\
    \ can hold a value at once\n* A function with a possibly unlimited number of parameters\n\
    * A list of passed in variables to a function\n* There is no way to tell the size\
    \ of a `va_list`, so you need to specify the number of passed parameters\n* It\
    \ performs the clean-up of the variable list when it has been used\n* To segment\
    \ and label variables and functions in a meaningful way.\n* `Math::Add()`\n\n\
    # Chapter 5: Advanced Features\n\n## File I/O\n\nYou will eventually come across\
    \ a programming situation where you need data to exist between the program running\
    \ and not running, this is where file saving comes into use.\n\nFile saving is\
    \ achieved by using functions in the `fstream` library, that is included like\
    \ this:\n\n```cpp\n#include <fstream>\n```\n\nYou also need “iostream” that we’ve\
    \ come across before for `cout` and `cin`\n\n```cpp\n#include <iostream>\n```\n\
    \nThere are three main objects that are used when saving and reading to file:\n\
    \n* `ofstream`: This deals with the output stream, and is used to create and write\
    \ data to a file\n* `ifstream`: This is the opposite of `ofstream` and is used\
    \ to read data from files\n* `fstream`: This is a function that has the characteristic\
    \ of both `ofstream` and `ifstream`.\n\n### Opening a file\n\nTo open a file we\
    \ need to use the `open()` function that is a member of all the main objects,\
    \ it works like so:\n\n```cpp\nfstream f;\nf.open(\"file.txt\", ios::in);\n```\n\
    \nWhere:\n* “file.txt” Is the filename\n* `ios::in` is the flag for how the file\
    \ is to be open, below is a table explaining all the options.\n\n| Name | Description\
    \ |\n| :--- | :--- |\n| `ios::app` | Opens the file in append mode, all input\
    \ is to be added to the end of the file |\n| `ios::ate` | Opens a file for input\
    \ into a file, and moves the read/write control to the end of the file |\n| `ios::in`\
    \ | Opens the file for reading |\n| `ios::out` | Opens the file for writing |\n\
    | `ios::trunc` | Opens the file for writing, truncating the file if it already\
    \ exists |\n\n### Closing a file\n\nTo close a file we need to call the `close()`\
    \ function:\n\n```cpp\nf.close();\n```\n\n### Writing to a file\n\nWriting to\
    \ a file is achieved by the insertion operator `<<`:\n\n```cpp\nf << \"Writing\
    \ data!\" << endl;\n```\n\n### Reading from a file\n\nReading data is achieved\
    \ using the extraction operator `>>`:\n\n```cpp\nf >> data;\n```\n\n### Working\
    \ example\n\nBelow is a working example with reading and writing:\n\n```cpp\n\
    #include \"stdafx.h\"\n#include <iostream>\n#include <fstream>\n\nusing namespace\
    \ std;\n\nint main()\n{\n    // Opens a file for writing\n    fstream write;\n\
    \    write.open(\"file.txt\", ios::out);\n    // Writes data to file\n    write\
    \ << \"Example Data\" << endl;\n    write << \"More example data\" << endl;\n\
    \    write.close();\n\n    // Opens a file for reading\n    fstream read;\n  \
    \  read.open(\"file.txt\", ios::in);\n    // Reading data\n    char data[100];\n\
    \    while (!read.eof())\n    {\n        read >> data;\n        cout << data <<\
    \ endl;\n    }\n    read.close();\n}\n```\n\nAs you can tell, each read command\
    \ is stopping when it reaches a space or a newline (as mentioned above), in this\
    \ case it just complicates the read section. One way we can fix this is by using\
    \ `getline()`, We’ll adapt the above example to read whole lines, changes highlighted:\n\
    \n```cpp\n#include \"stdafx.h\"\n#include <iostream>\n#include <fstream>\n#include\
    \ <string>\n\nusing namespace std;\n\nint main()\n{\n    // Opens a file for writing\n\
    \    fstream write;\n    write.open(\"file.txt\", ios::out);\n    // Writes data\
    \ to file\n    write << \"Example Data\" << endl;\n    write << \"More example\
    \ data\" << endl;\n    write.close();\n\n    // Opens a file for reading\n   \
    \ fstream read;\n    read.open(\"file.txt\", ios::in);\n    // Reading data\n\
    \    string data;\n    while (!read.eof())\n    {\n        getline(read, data);\n\
    \        if(!data.empty())\n            cout << data << endl;\n    }\n    read.close();\n\
    }\n```\n\nOutput\n> Example Data\n> More example data\n"
