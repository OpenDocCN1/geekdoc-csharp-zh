  trans: "\n\n有几点需要注意。框中的函数被称为构造函数（Constructor，在本章中进行解释），它在创建新对象时被调用。此 `class` 包含了所有的成员变量和成员函数，它们都通过使用成员运算符（`.`）来访问。在这种情况下，所有变量都被标记为\
    \ `private`（私有的），这意味着它们不能从类的外部访问，这就是 getter 和 setter（访问器方法）派用场的地方。函数 `returnCurrentPage`\
    \ 是一个 getter，允许访问 `currentPage` 的值，这是处理变量访问的推荐方式，它为程序员提供了一个控制变量访问的平台。\n\n下面创建了一个对象并访问了它的部分函数和变量：\n\
    \n```csharp\nclass Program\n{\n    static void Main(string[] args)\n    {\n  \
    \      Book book1 = new Book(200, 32, \"Red\", \"Harry Potter\");\n        book1.changeMe\
    \ = \"Test\";\n        Console.WriteLine(book1.changeMe);\n        int currentPage\
    \ = book1.returnCurrentPage();\n        Console.WriteLine(currentPage);\n    }\n\
    }\n```\n\n输出\n>Test\n>32\n\n## 复习\n1. 类提供了一种在真实世界对象上存储数据的直观方式。\n2. 它们允许围绕数据构建功能。\n\
    3. 被用作一种模板，用于创建大量的数据容器。\n4. 访问器方法允许访问私有变量。\n    1. Getter 返回变量的值。\n    2. Setter\
    \ 允许程序更改值。\n\n## 属性 (Properties)\n如上一章提到的访问器方法，属性（properties）允许使用一种简单易读且紧凑的语法来访问成员变量。属性还包含了变量定义。它们的定义方式如下：\n\
    \n```csharp\npublic int currentPage\n{\n    get\n    {\n        return currentPage;\n\
    \    }\n    set\n    {\n        currentPage = value;\n    }\n}\n```\n\n调用方式如下：\n\
    \n```csharp\nBook book1 = new Book();\nbook1.currentPage = 2; // 2 是 set 中的 ‘value’\n\
    Console.WriteLine(book1.currentPage);\n```\n\n这执行的作用与上一章中的访问器完全相同，但语法要简洁得多，对比下所示：\n\
    \n```csharp\nprivate int _currentPage;\npublic int returnCurrentPage()\n{\n  \
    \  return _currentPage;\n}\n```\n\n等同于：\n\n```csharp\npublic int currentPage {\
    \ get; }\n```\n\n如你所见，代码量要小得多。setter 的更高级用法是对输入进行验证。例如，当前页不能大于总页数。代码看起来可能是这样：\n\
    \n```csharp\nclass Book\n{\n    int totalPages = 500;\n    public int currentPage\n\
    \    {\n        get\n        {\n            return currentPage;\n        }\n \
    \       set\n        {\n            // 验证检查\n            if (value < totalPages)\n\
    \            {\n                currentPage = value;\n            }\n        \
    \    else if(value == totalPages)\n            {\n                Console.WriteLine(\"\
    你已经完成了这本书!\");\n            }\n            else\n            {\n             \
    \   // 错误消息\n                Console.WriteLine(\"无效的当前页!\");\n            }\n\
    \        }\n    }\n}\n```\n\n赋予了程序员编写考虑到多种可能性代码的能力。\n\n## 静态 (Static)\n如前面的章节所述，成员函数允许类持有与内部数据有某种关联的功能，这使得类几乎可以成为自包含的程序，这与成员变量一起赋予了类功能。\n\
    \n成员函数和变量可以被定义为 `static`（静态的），意味着对象“始终存在”。这用于行为在类的所有实例之间不会改变的情况，意味着该行为或变量在所有实例之间共享的。\n\
    \n注意：`static` 函数只能访问 `static` 变量。\n\n```csharp\nusing System;\nnamespace ConsoleApplication1\n\
    {\n    class Program\n    {\n        static void Main(string[] args)\n       \
    \ {\n            Example e = new Example();\n            e.Instance(); // 错误\n\
    \            Example.Instance(); // 错误\n            Example.Static(); // 错误\n\
    \        }\n    }\n    class Example\n    {\n        public void Instance()\n\
    \        {\n            Console.WriteLine(\"Instance!\");\n        }\n       \
    \ static void Static()\n        {\n            Console.WriteLine(\"Static!\");\n\
    \        }\n    }\n}\n```\n\n上面的示例展示了如何访问不同类型的函数。下面是一个静态在“真实世界”示例中的例子：\n\n```csharp\n\
    using System;\nnamespace ConsoleApplication1\n{\n    class Program\n    {\n  \
    \      static void Main(string[] args)\n        {\n            int i = Person.WorkAge(new\
    \ DateTime(1990, 10, 15));\n            Console.WriteLine(i);\n        }\n   \
    \ }\n    class Person\n    {\n        public Person(string _name, int _age)\n\
    \        {\n            name = _name;\n            age = _age;\n        }\n  \
    \      public string name { get; }\n        public int age { get; }\n        public\
    \ static int WorkAge(DateTime birthday)\n        {\n            // 时间差值\n    \
    \        TimeSpan difference = DateTime.Now - birthday;\n            double years\
    \ = difference.TotalDays / 365;\n            return (int)years;\n        }\n \
    \   }\n}\n```\n\n此程序使用 `static` 方法根据生日计算某人的年龄，这允许方法持有相关函数，而无需单独的（函数）。\n\n## 构造函数与析构函数\
    \ (Constructors and Destructors)\n在创建类的实例时会使用构造函数，语言提供了默认构造函数，但也可以创建自定义构造函数，你可以定义没有返回类型且与类名相同的函数，例如：\n\
    \n```csharp\nclass Person\n{\n    public Person()\n    {\n        Console.WriteLine(\"\
    Person created\");\n    }\n}\n```\n\n构造函数用于在创建实例时向成员变量传递数据。你可以定义任意多个构造函数，但它们需要不同的参数和数量，这被称为重载（overloading）。\n\
    \n例如：\n\n```csharp\nnamespace ConsoleApplication1\n{\n    class Program\n    {\n\
    \        static void Main(string[] args)\n        {\n            Person p1 = new\
    \ Person(\"John\", 32);\n            Person p2 = new Person(\"James\", 50, \"\
    Train Driver\");\n        }\n    }\n    class Person\n    {\n        public Person(string\
    \ _name, int _age)\n        {\n            name = _name;\n            age = _age;\n\
    \            job = \"N/A\";\n        }\n        public Person(string _name, int\
    \ _age, string _job)\n        {\n            name = _name;\n            age =\
    \ _age;\n            job = _job;\n        }\n        public string name { get;\
    \ }\n        public int age { get; }\n        public string job { get; }\n   \
    \ }\n}\n```\n\n高亮部分显示了重载的使用，编译器根据参数列表中的类型自动检测使用哪个构造函数。\n\n就像构造函数一样，还有一个析构函数执行与构造函数相反的作用，析构函数不是处理创建代码而是处理清理代码。析构函数的创建方式如下：\n\
    \n```csharp\nclass Person\n{\n    ~Person()\n    {\n        Console.WriteLine(\"\
    Person deleted!\");\n    }\n}\n```\n\n此方法无法手动调用，而是由内部垃圾回收器管理的，它是编译器内置的一部分，用于自动内存管理。可以这样演示：如果调用了一个创建\
    \ `Person` 实例的方法，然后程序离开了主方法的作用范围，垃圾回收器将被调用以清理内存。\n\n```csharp\nusing System;\n\
    namespace ConsoleApplication1\n{\n    class Program\n    {\n        static void\
    \ Main(string[] args)\n        {\n            Function();\n        }\n       \
    \ static void Function()\n        {\n            Person p1 = new Person();\n \
    \       }\n    }\n    class Person\n    {\n        ~Person()\n        {\n    \
    \        Console.WriteLine(\"Person deleted!\");\n            Console.ReadKey();\n\
    \        }\n    }\n}\n```\n\n输出\n>Person deleted!\n\n## 练习\n\n"
- fmt: "\nCreate a class that holds data for `Pets`, the class will need a `Name`,\
    \ `Age` and `Type` of animal. There also will need to be a `Constructor`, `Destructor`\
    \ and a member function that prints all the data for the pet.\n\nTest it by having\
    \ a dog called `Jose` that is 1 year old, A cat called `Besse` that is 5 and a\
    \ parrot called `James` that is 10.\n\n## Solution\n\nSomething like this:\n\n\
    ```csharp\nusing System;\n\nnamespace ConsoleApplication1\n{\n class  Program\n\
    \    {\nstatic  void Main(string[] args)\n        {\nPet p1 = new  Pet(\"Jose\"\
    , 1, \"Dog\");\n             p1.Print();\n\n Pet p2 = new  Pet(\"Besse\", 5, \"\
    Cat\");\n             p2.Print();\n\n Pet p3 = new  Pet(\"James\", 10, \"Parrot\"\
    );\n             p3.Print();\n Console.ReadKey();\n        }\n    }\n class  Pet\n\
    \    {\n public Pet(string _name, int _age, string _type)\n        {\n       \
    \      name = _name;\n             age = _age;\n             type = _type;\n \
    \       }\nstring name { get; }\nint age { get; }\nstring type { get; }\n public\
    \  void Print()\n        {\n//{name} is string interpolation\n Console.WriteLine($\"\
    Name: {name}\",name);\n Console.WriteLine($\"Age: {age}\",age);\n Console.WriteLine($\"\
    Type: {type}\",type);\n Console.WriteLine();\n        }\n    }\n}\n```\n\n## Inheritance\n\
    \nInheritance is a language function that allows classes to take on characteristics\
    \ of another, inheritance is done like so:\n\n```csharp\nclass  Dog : Animal\n\
    {\n}\n```\n\nThis means that any function or variable marked as “Public” or “Protected”\
    \ (Protected is explained in the next chapter) `Dog` will have its own version\
    \ of or access to, this allows quick creation of new types of classes without\
