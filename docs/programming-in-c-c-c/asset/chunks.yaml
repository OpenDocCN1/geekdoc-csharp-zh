    \ complete\");\n\n#endif\n\n Console.WriteLine(\"End!\");\n\n Console.ReadKey();\n\
    \n        }\n\n    }\n\n}\n\nThe example below shows a very basic almost pointless\
    \ program but it’s supposed to demonstrate how #defined can be like toggles, copy\
    \ over and run the program and compare what the program is like when you add or\
    \ remove the #define at the top.\n\n#if uses the normal conditionals as an actual\
    \ if statement, the list is below:\n\n*   ==\n\n*   || (OR)\n\n*   &&\n\n*   !=\n\
    \n#region\n\nregion offers no purpose to a program when executing but makes it\
