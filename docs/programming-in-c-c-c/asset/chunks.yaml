    {\n    EventExample ex = new EventExample();\n    //Calls the event handler\n\
    \    Console.WriteLine(ex.MyEvent(\"User1\"));\n    Console.ReadKey();\n}\n}\n\
    }\n```\n\n# Multithreading\n\nA thread is a single process of execution, multithreading\
    \ is the ability to run lots of small processes concurrently (At the same time),\
    \ this stops programs from wasting CPU cycles waiting and can make programs much\
    \ more efficient.\n\nHowever, introducing multithreading into problems that are\
    \ trivial or cannot be run concurrently can add an unnecessary overhead and can\
    \ reduce the efficiency of a program.\n\nSo far we have written programs that\
    \ execute in a single thread and the computer executes them just from start to\
    \ finish in one straight line.\n\n### Threads\n\nThe tools required to create\
    \ and work with threads resides in the `System.Threading` class. One of the simplest\
    \ functions is being able to grab the current thread, this is done like so:\n\n\
    ```csharp\nThread t = Thread.CurrentThread;\n```\n\n### Creating Threads\n\nYou\
    \ can create a thread like so:\n\n```csharp\nThread s = new Thread(DoLotsOfWork);\n\
    ```\n\nWith the function the thread will executing being contained in the brackets.\
    \ The example below shows how this concurrent behaviour can work:\n\n```csharp\n\
    using System;\nusing System.Threading;\n\nnamespace ConsoleApplication1\n{\n \
    \   class Program\n    {\n        public static void DoLotsOfWork()\n        {\n\
    \            for (int i = 0; i < 5; i++)\n            {\n                Thread\
    \ t = Thread.CurrentThread;\n                Console.WriteLine($\"{t.Name}: i\
    \ is equal to: {i}\");\n            }\n        }\n        static void Main()\n\
    \        {\n            for (int i = 0; i < 5; i++)\n            {\n         \
    \       //Creates a thread\n                Thread s = new Thread(DoLotsOfWork);\n\
    \                //Assigns the thread a name\n                s.Name = $\"Thread\
    \ {i}\";\n                s.Start();\n            }\n            Console.ReadKey();\n\
    \        }\n    }\n}\n```\n\n#### Output\n\n>Thread 2: i is equal to: 0\n>Thread\
    \ 2: i is equal to: 1\n>Thread 2: i is equal to: 2\n>Thread 2: i is equal to:\
    \ 3\n>Thread 2: i is equal to: 4\n>Thread 0: i is equal to: 0\n>Thread 1: i is\
    \ equal to: 0\n>Thread 0: i is equal to: 1\n>Thread 1: i is equal to: 1\n>Thread\
    \ 1: i is equal to: 2\n>Thread 1: i is equal to: 3\n>Thread 1: i is equal to:\
    \ 4\n>Thread 0: i is equal to: 2\n>Thread 0: i is equal to: 3\n>Thread 0: i is\
    \ equal to: 4\n>Thread 3: i is equal to: 0\n>Thread 3: i is equal to: 1\n>Thread\
    \ 3: i is equal to: 2\n>Thread 3: i is equal to: 3\n>Thread 3: i is equal to:\
    \ 4\n>Thread 4: i is equal to: 0\n>Thread 4: i is equal to: 1\n>Thread 4: i is\
    \ equal to: 2\n>Thread 4: i is equal to: 3\n>Thread 4: i is equal to: 4\n\nNote:\
    \ this may come through in a different order for you.\n\nThis example above creates\
    \ 5 threads that prints out 5 iterations of a for loop, as you can see it doesn’t\
    \ all come through in order, this is because it’s occurring concurrently and each\
    \ of these threads are working independently.\n\nThis lack of order can be a problem\
    \ in some circumstances, this is where the `lock` keyword comes into its own,\
    \ it’s used to surround code that is deemed crucial and code that cannot have\
    \ multiple threads using it at the same time, we’ll adapt the example from before\
    \ to include the lock:\n\n```csharp\nusing System;\nusing System.Threading;\n\n\
    namespace ConsoleApplication1\n{\n    class Program\n    {\n        static object\
    \ padLock = new object();\n        public static void DoLotsOfWork()\n       \
    \ {\n            lock (padLock)\n            {\n                for (int i = 0;\
    \ i < 5; i++)\n                {\n                    Thread t = Thread.CurrentThread;\n\
    \                    Console.WriteLine($\"{t.Name}: i is equal to: {i}\");\n \
    \               }\n            }\n        }\n        static void Main()\n    \
    \    {\n            for (int i = 0; i < 5; i++)\n            {\n             \
    \   //Creates a thread\n                Thread s = new Thread(DoLotsOfWork);\n\
    \                //Assigns the thread a name\n                s.Name = $\"Thread\
    \ {i}\";\n                s.Start();\n            }\n            Console.ReadKey();\n\
    \        }\n    }\n}\n```\n\n#### Output\n>Thread 0: i is equal to: 0\n>Thread\
    \ 0: i is equal to: 1\n>Thread 0: i is equal to: 2\n>Thread 0: i is equal to:\
    \ 3\n>Thread 0: i is equal to: 4\n>Thread 2: i is equal to: 0\n>Thread 2: i is\
    \ equal to: 1\n>Thread 2: i is equal to: 2\n>Thread 2: i is equal to: 3\n>Thread\
    \ 2: i is equal to: 4\n>Thread 1: i is equal to: 0\n>Thread 1: i is equal to:\
    \ 1\n>Thread 1: i is equal to: 2\n>Thread 1: i is equal to: 3\n>Thread 1: i is\
    \ equal to: 4\n>Thread 3: i is equal to: 0\n>Thread 3: i is equal to: 1\n>Thread\
    \ 3: i is equal to: 2\n>Thread 3: i is equal to: 3\n>Thread 3: i is equal to:\
    \ 4\n>Thread 4: i is equal to: 0\n>Thread 4: i is equal to: 1\n>Thread 4: i is\
    \ equal to: 2\n>Thread 4: i is equal to: 3\n>Thread 4: i is equal to: 4\n\nAs\
    \ you can see each loop is coming through in order, i.e. from 0 – 4, may also\
    \ be able to see that the threads are not necessarily in order, the lock works\
    \ on a first come serve basic and once a thread touches it, it becomes locked\
    \ until the object is released. Please also not the use of an object alongside\
    \ the lock, this is used as a flag for if the lock is available or locked.\n\n\
    This lock system is very useful when it comes to dealing with files, if two threads\
    \ were to try and write to a file at the same time there will be errors or lines\
    \ would not appear in order. Below is an example demoing this:\n\n```csharp\n\
    using System;\nusing System.IO;\nusing System.Threading;\n\nnamespace ConsoleApplication1\n\
    {\n    class Program\n    {\n        public static void WriteToFile()\n      \
    \  {\n            //Error here!\n            StreamWriter sw = new StreamWriter(\"\
    file.txt\");\n            for (int i = 0; i < 5; i++)\n            {\n       \
    \         sw.WriteLine($\"Test {i}\");\n            }\n            sw.Close();\n\
    \        }\n        static void Main()\n        {\n            for (int i = 0;\
    \ i < 5; i++)\n            {\n                //Creates a thread\n           \
    \     Thread s = new Thread(WriteToFile);\n                //Assigns the thread\
    \ a name\n                s.Name = $\"Thread {i}\";\n                s.Start();\n\
    \            }\n            Console.ReadKey();\n        }\n    }\n}\n```\n\nThis\
    \ will crash and throw a `System.IO.IOException` as two or more threads will try\
    \ and open the file to write to it at the same time. This is a real-world usage\
    \ for the lock structure as adding a lock will solve this, below is the lock being\
    \ introduced, this will solve the issue:\n\n```csharp\nusing System;\nusing System.IO;\n\
    using System.Threading;\n\nnamespace ConsoleApplication1\n{\n    class Program\n\
    \    {\n        static object padLock = new object();\n        public static void\
    \ WriteToFile()\n        {\n            lock (padLock)\n            {\n      \
    \          StreamWriter sw = new StreamWriter(\"file.txt\");\n               \
    \ for (int i = 0; i < 5; i++)\n                {\n                    sw.WriteLine($\"\
    Test {i}\");\n                }\n                sw.Close();\n               \
    \ Console.WriteLine(\"File written!\");\n            }\n        }\n        static\
    \ void Main()\n        {\n            for (int i = 0; i < 5; i++)\n          \
    \  {\n                //Creates a thread\n                Thread s = new Thread(WriteToFile);\n\
    \                //Assigns the thread a name\n                s.Name = $\"Thread\
    \ {i}\";\n                s.Start();\n            }\n            Console.ReadKey();\n\
    \        }\n    }\n}\n```\n"
