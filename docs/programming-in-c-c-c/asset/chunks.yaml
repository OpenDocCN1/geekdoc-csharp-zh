    \n# Chapter 5: Advanced Features\n\n## File I/O\n\nYou will eventually come across\
    \ a programming situation where you need data to exist between the program running\
    \ and not running, this is where file saving comes into use.\n\nFile saving is\
    \ achieved by using functions in the fstream library, that is included like this:\n\
    \n#include  <fstream>\n\nYou also need “iostream” that we’ve come across before\
    \ for “cout” and “cin”\n\n#include  <iostream>\n\nThere are three main objects\
    \ that are used when saving and reading to file:\n\n*   ofstream\n\n    *   This\
    \ deals with the output stream, and is used to create and write data to a file\n\
    \n*   ifstream\n\n    *   This is the opposite of ofstream and is used to read\
    \ data from files\n\n*   fstream\n\n    *   This is a function that has the characteristic\
    \ of both ofstream and ifstream.\n\nOpening a file\n\nTo open a file we need to\
    \ use the “open()” function that is a member of all the main objects, it works\
    \ like so:\n\nfstream f;\n\nf.open(\"file.txt\", ios::in);\n\nWhere:\n\n*   “file.txt”\
    \ Is the filename\n\n*   “ios::in” is the flag for how the file is to be open,\
    \ below is a table explaining all the options.\n\n| Name | Description |\n\n|\
    \ ios::app | Opens the file in append mode, all input is to be added to the end\
    \ of the file |\n\n| ios::ate | Opens a file for input into a file, and moves\
    \ the read/write control to the end of the file |\n\n| ios::in | Opens a file\
    \ for reading |\n\n| ios::out | Opens a file for writing |\n\n| Ios::trunc | If\
    \ the file exists, the data inside is deleted (truncated) |\n\nYou can also have\
    \ two of these modes by ORing them together, this can be useful if you want to\
    \ open the file to write to it and you want to get rid of already existing data:\n\
    \nf.open(\"file.txt\", ios::out || ios::trunc);\n\nClosing a file\n\nClosing a\
    \ file is as simple as you’d image. To achieve this all you need to call is the\
    \ “close()” function:\n\nf.close();\n\nThis flushes the stream and releases all\
    \ the allocated memory to the file.\n\nWriting to a file\n\nWriting to a file\
    \ is achieved by the use of the use of the insertion operator (<<), this has been\
    \ met before in the case of “cout” and all that need to be done is data needs\
    \ to be streams to a fsteam or ofstream instead of cout.\n\nThis is done like\
    \ so:\n\nf <<  \"Writing data!\"  << endl;\n\nReading data\n\nReading data is\
    \ the same as writing data, just flipped. You use the stream extraction operator\
    \ (>>) much like we’ve done before with cin but instead use it with fstream or\
    \ ifstream.\n\nIt’s also done like so:\n\nchar data[100];\n\nf >> data;\n\nNote:\
    \ Reading like this will read all data up until a space or newline\n\nWorking\
    \ example\n\nAbove is all you need to know to read a write to a file, below is\
    \ working code example with reading and writing:\n\n#include  \"stdafx.h\"\n\n\
    #include  <iostream>\n\n#include  <fstream>\n\nusing  namespace std;\n\nint main()\n\
    \n{\n\n//Opens a file for writing\n\nfstream write;\n\nwrite.open(\"file.txt\"\
    , ios::out);\n\n//Writes data to file\n\nwrite <<  \"Example Data\"  << endl;\n\
    \nwrite <<  \"More example data\"  << endl;\n\nwrite.close();\n\n//Opens a file\
