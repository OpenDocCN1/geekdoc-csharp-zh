  trans: "\n\n| Token | 说明 | 注意 |\n| :--- | :--- | :--- |\n| `\\e` | 匹配转义字符 | `001B`\
    \ |\n| `\\nnn` | 使用八进制表示指定字符（`nnn` 被替换为数值） | 每个字母都有其对应的八进制表示 |\n| `\\x nn` | 使用十六进制表示指定字符（`nn`\
    \ 再次由两个数字组成） | 每个字母都有其对应的十六进制表示 |\n| `\\unnnn` | 使用十六进制表示显示 Unicode 字符，每个 ‘n’\
    \ 都是数值 | 每个 Unicode 字母都有其对应的十六进制表示 |\n| `\\W` | 匹配任何非字符单词 | |\n| `\\s` | 匹配任何空白字符\
    \ | |\n| `\\S` | 匹配任何非空白字符 | |\n| `\\d` | 匹配任何数字值 | |\n| `\\D` | 匹配数字以外的任何字符 |\
    \ |\n\n## 预处理器指令\n\n预处理器指令设计用于发送给编译器的消息，在任何编译之前进行处理。它们以哈希符号（`#`）标记，并且由于它们不是语句，因此不需要行尾语句（`;`）。\n\
    \nC# 预处理器指令与 C++ 或 C 中的指令没有区别，且它们不能用于宏定义。\n\n| 指令 | 解释 |\n| :--- | :--- |\n| `#define`\
    \ | 创建一个符号 |\n| `#undef` | 用于取消符号定义 |\n| `#if` | 用于根据条件测试符号 |\n| `#else` | 与 `#if`\
    \ 配合使用 |\n| `#elif` | 在同一语句中表示“否则如果”（else if if） |\n| `#endif` | 用于标记 `#if` 语句的结束\
    \ |\n| `#line` | 修改编译器的行号，可选功能是更改文件和警告的输出文件名 |\n| `#region` | 用于格式化整理 |\n| `#endregion`\
    \ | 显示区域的结束 |\n\n上面是一个相当详尽的表格，包含了所有的主要指令。下面是一些实用指令的示例：\n\n### `#define` & `#undef`\
    \ & `if`\n\n下面的示例显示了 `#define` 语句是否可以与 `#if` 语句一起使用：\n\n```csharp\n#define VALUE\n\
    \nusing System;\n\nnamespace ConsoleApplication1\n{\n    class Program\n    {\n\
    \        static void Main(string[] args)\n        {\n#if (VALUE)\n           \
    \ Console.WriteLine(\"Defined\");\n#else\n            Console.WriteLine(\"Not\
    \ Defined\");\n#endif\n            Console.ReadKey();\n        }\n    }\n}\n```\n\
    \n输出\n> `Defined`\n\n如你所见，这可以轻松切换代码，最常见的示例是用于调试代码或详细模式：\n\n```csharp\n#define\
    \ VERBOSE\n\nusing System;\n\nnamespace ConsoleApplication1\n{\n    class Program\n\
    \    {\n        static void Main(string[] args)\n        {\n            Console.WriteLine(\"\
    Start!\");\n            int a = 1 + 3;\n#if (VERBOSE)\n            Console.WriteLine(\"\
    Addition complete\");\n#endif\n            int b = 1 - 4;\n#if (VERBOSE)\n   \
    \         Console.WriteLine(\"Subtraction complete\");\n#endif\n            int\
    \ c = 1 * 3;\n#if (VERBOSE)\n            Console.WriteLine(\"Multiplication complete\"\
    );\n#endif\n            int d = 1 / 3;\n#if (VERBOSE)\n            Console.WriteLine(\"\
    Division complete\");\n#endif\n            Console.WriteLine(\"End!\");\n    \
    \        Console.ReadKey();\n        }\n    }\n}\n```\n\n下面的示例展示了一个非常基础且几乎没有意义的程序，但它的目的是演示\
    \ `#defined` 如何像开关一样工作。复制并运行程序，比较在顶部添加或删除 `#define` 时程序的运行情况。\n\n`#if` 使用普通的条件判断作为实际的\
    \ `if` 语句，列表如下：\n\n* `==`\n* `||` (或)\n* `&&`\n* `!=`\n\n### `#region`\n\n`region`\
    \ 在程序执行时对程序没有作用，但它可以更容易地折叠和隐藏代码区域，其用法如下所示：\n\n```csharp\n#region Hide This\nConsole.WriteLine(\"\
    Print!\");\n#endregion\n```\n\n输出\n> `Print!`\n\n折叠后它看起来像这样\n![](img/image00623.jpeg)\n\
    \n## 异常处理\n\n当发生错误时，会“抛出”异常，它是程序无法继续运行的情况的响应。异常可以被处理，你的程序并不总是会崩溃，有四个关键字；`try`、`catch`、`finally`\
    \ 和 `throw`：\n\n* `try` – 用于包裹你想要监控异常的代码，如果发现异常，它会将控制权转移到 `catch` 部分。\n* `catch`\
    \ – 如果在相应的 `try` 块中抛出异常，程序将进入这里。\n* `finally` – 可以与 `try/catch` 配合使用，但无论是否抛出异常它都会运行。一个很好的例子是打开文件读取时，它始终需要关闭。\n\
    * `throw` – 用于手动抛出带有你自己自定义文本的异常。\n\n下面是使用 `try/catch` 的示例：\n\n```csharp\nusing\
    \ System;\n\nnamespace ConsoleApplication1\n{\n    class Program\n    {\n    \
    \    static void Main(string[] args)\n        {\n            try\n           \
    \ {\n                // 除以零错误\n                int zero = 0;\n               \
    \ int i = 1 / zero;\n            }\n            catch (Exception e)\n        \
    \    {\n                Console.WriteLine(e.Message);\n            }\n       \
    \     Console.ReadKey();\n        }\n    }\n}\n```\n\n输出\n> `Attempted to divide\
    \ by zero.`\n\n注意：`try/catch` 用于处理异常，`finally` 无论是否抛出异常都会运行。\n\n"
- fmt: "\n- `AttributeTargets.Method`\n- `AttributeTargets.Property`\n- `AllowMultiple`\
    \ specifies whether more than one version of the attribute can be created and\
    \ applied.\n- `Inherited` specifies whether the attribute is inherited when other\
    \ classes inherit the attribute the class is connected to.\n\nThis is used later\
    \ to make custom attributes.\n\n## Conditional\n\nThese conditional attributes\
    \ are used to mark a method that depends on a certain pre-processor directive,\
    \ in this example we will use a debugging example:\n\n```csharp\nusing System;\n\
    using System.Diagnostics;\n\nnamespace ConsoleApplication1\n{\n    class Program\n\
    \    {\n        public static void Main()\n        {\n            Debugging();\n\
    \            Console.ReadKey();\n        }\n\n        [Conditional(\"DEBUG\")]\n\
    \        static void Debugging()\n        {\n            Console.WriteLine(\"\
    This is example debugging code:\");\n            Console.WriteLine(\"Number of\
    \ loops: \" + 1);\n            Console.WriteLine(\"Values found: \" + 102);\n\
    \        }\n    }\n}\n```\n\nThis will only print out the example output if the\
    \ program is set in debug mode, this gives a very nice clean way of abstracting\
    \ code and unnecessary output. The `DEBUG` flag is automatically built into Visual\
    \ Studio, so when the program is switched to release mode the debug mode will\
    \ be false and the code will not run.\n\nThis can also be done with custom pre-processor\
    \ directives like so:\n\n```csharp\n#define CUSTOM\nusing System;\nusing System.Diagnostics;\n\
    \nnamespace ConsoleApplication1\n{\n    class Program\n    {\n        public static\
    \ void Main()\n        {\n            Custom_Method();\n            Console.ReadKey();\n\
    \        }\n\n        [Conditional(\"CUSTOM\")]\n        static void Custom_Method()\n\
    \        {\n            Console.WriteLine(\"Custom output!\");\n        }\n  \
    \  }\n}\n```\n\n## Obsolete\n\nThis is used for legacy and compatibility reasons,\
    \ if for example you has a class that used a function `SaveFile()` but was later\
    \ updated and this function became obsolete a new function was created called\
    \ `Save()` because now this function saved other items, `SaveFile()` would be\
    \ marked as obsolete so other programs that use these functions would not have\
    \ problems with compatibility.\n\nThe example shows `obsolete` being used:\n\n\
    ```csharp\nusing System;\nnamespace ConsoleApplication1\n{\n    class Program\n\
    \    {\n        public static void Main()\n        {\n            Output old =\
    \ new Output();\n            old.PrintData();\n            Output newV = new Output();\n\
    \            newV.Print();\n            Console.ReadKey();\n        }\n    }\n\
    \n    class Output\n    {\n        string example = \"Example\";\n        [Obsolete(\"\
    Deprecated! Use Print() instead\", false)]\n        public void PrintData()\n\
    \        {\n            Console.WriteLine(example);\n        }\n        public\
    \ void Print()\n        {\n            Console.WriteLine(example);\n        }\n\
    \    }\n}\n```\n\nOutput:\nExample\nExample\n\nAs you can see both work, however\
    \ `old.PrintData()` will show a warning, it looks like this: (image0024.jpeg)\n\
    Note: This is because the `false` parameter was used, this means just a warning\
    \ is presented, if this is true an error is created and won’t allow the program\
    \ to compile. This will appear in the error list like this: (image0025.jpeg)\n\
    \n## Custom Attributes\n\nThe framework allows custom created attributes that\
    \ can store any information the programmer deems relevant, this is very similar\
    \ to defining a class, however the class needs to inherit the `System.Attribute`\
    \ class, with `AttributeUsage` defined above. A basic example is below, the example\
    \ attribute that just creates a description:\n\n```csharp\n[AttributeUsage(AttributeTargets.Class,\
    \ AllowMultiple = true, Inherited = true)]\nclass Description : Attribute\n{\n\
    \    public string Text { get; }\n    public Description(string text)\n    {\n\
    \        Text = text;\n    }\n}\n```\n\nAs you can see this is very similar to\
    \ creating a class, apart from the inheritance of `Attribute` and the `AttributeUsage`\
    \ attribute. This can be used like so:\n\n```csharp\n[Description(\"Main method!\"\
    )]\n[Description(\"AllowMultiple = true, so you can have multiple Descriptions\"\
    )]\nclass Program\n{\n    public static void Main()\n    {\n    }\n}\n```\n\n\
    This information can be obtained and used by the process of reflection, this will\
    \ be explored in the next section.\n\n## Reflection\n\nReflection of objects is\
    \ used for obtaining information at runtime, `System.Reflection` gives access\
    \ to these features. Reflection can be used to:\n\n- View information about attributes\n\
    - It allows late binding to methods and properties\n- It allows creation of types\
    \ at runtime\n\n## Metadata\n\nMetadata is data about data, and in this case it\
    \ is data about attributes. To start you need to create an instance of `info`\
    \ like so:\n\n`MemberInfo info = typeof(AttributeTest);`\n\nThis can now be used\
    \ to check information. The example below prints the attributes attached. Remember\
    \ to include this at the top: `using System.Reflection;`. For the example, we\
    \ are going to use the `Description` Attribute from earlier:\n\n```csharp\nusing\
    \ System;\nusing System.Reflection;\n\nnamespace ConsoleApplication1\n{\n    class\
    \ Program\n    {\n        static void Main()\n        {\n            AttributeTest\
    \ t = new AttributeTest();\n            t.PrintAttributes();\n            Console.ReadKey();\n\
    \        }\n    }\n\n    [Description(\"Description 1!\")]\n    [Description(\"\
    Description 2!\")]\n    class AttributeTest\n    {\n        MemberInfo info =\
    \ typeof(AttributeTest);\n        public void PrintAttributes()\n        {\n \
    \           // Returns an array of attributes\n            object[] attributes\
    \ = info.GetCustomAttributes(true);\n            // Prints attributes\n      \
    \      foreach (Description attr in attributes)\n            {\n             \
    \   Console.WriteLine(attr.Text);\n            }\n        }\n    }\n\n    [AttributeUsage(AttributeTargets.Class,\
    \ AllowMultiple = true, Inherited = true)]\n    class Description : Attribute\n\
    \    {\n        public string Text { get; }\n        public Description(string\
    \ text)\n        {\n            Text = text;\n        }\n    }\n}\n```\n\nOutput:\n\
    Description 1!\nDescription 2!\n\nAs you can see the program has printed out the\
    \ description text from the attributes attached to it. The line: `…info.GetCustomAttributes(true);`\
    \ returns the list of attributes and the attributes are then printed in the following\
    \ `foreach` loop.\n\n## Indexers\n\nIndexers allow custom classes to be indexed\
    \ much like an array, each member is accessed with the `[]` operator. The indexer\
    \ is defined like:\n\n```csharp\ntype index\n{\n    get; // returns values\n \
    \   set; // sets values\n}\n```\n\nWhere you would call it like this with the\
    \ array syntax. For this example it will be a catalogue search, the indexer will\
    \ take a name:\n\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
    \nnamespace ConsoleApplication1\n{\n    class Program\n    {\n        static void\
    \ Main()\n        {\n            Inventory main_floor = new Inventory();\n   \
    \         // Adds Items\n            main_floor.AddItem(new Item(\"PS\", 49.50));\n\
    \            main_floor.AddItem(new Item(\"RX480\", 200.50));\n            //\
    \ Uses indexer to grab price\n            Console.WriteLine(\"Price: \" + main_floor[\"\
    RX480\"]);\n            Console.ReadKey();\n        }\n    }\n\n    class Inventory\n\
    \    {\n        List<Item> Items = new List<Item>();\n        public void AddItem(Item\
    \ item)\n        {\n            Items.Add(item);\n        }\n\n        public\
    \ double this[string index]\n        {\n            get\n            {\n     \
    \           foreach (Item item in Items)\n                {\n                \
    \    if (item.Name == index)\n                    {\n                        return\
    \ item.Price;\n                    }\n                }\n                // Used\
    \ to signify that there is not item\n                return -1;\n            }\n\
    \            set\n            {\n                // You can also use this to set\
    \ a value like setting a value in an attribute\n            }\n        }\n   \
    \ }\n\n    // Simple class to hold item\n    class Item\n    {\n        public\
    \ Item(string name, double price)\n        {\n            Name = name;\n     \
    \       Price = price;\n        }\n        public string Name { get; }\n     \
    \   public double Price { get; }\n    }\n}\n```\n"
