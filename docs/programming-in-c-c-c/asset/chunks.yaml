  trans: "\n\n`new` 运算符允许为数据类型手动分配内存，见下例：\n\n```cpp\ndouble* p = new double;\n```\n\
    \n如你所见，`new` 关键字会分配内存并返回指向该内存的指针。在上面的示例中，它是一个指向 `double` 的指针，这是手动分配的内存，编译器不会手动释放该数据；如果不对其进行手动纠正，可能会出现所谓的内存泄漏，导致内存被不必要地占用。\n\
    \n这时 `delete` 运算符派上用场了，它是 `new` 关键字的反相反，将释放变量的内存。\n\n让我们实际运用这些运算符吧：\n\n```cpp\n\
    #include \"stdafx.h\"\n#include <iostream>\n\nusing namespace std;\n\nint main()\n\
    {\n    // 创建指针\n    double* p = NULL;\n\n    // 此处检查内存是否已分配\n    // 它只是为了确保 \"\
    p\" 指向某些位置\n    if (!(p = new double))\n    {\n        cout << \"ERROR: Memory\
    \ problems\" << endl; // 只有在出现问题时才会打印\n    }\n\n    // 修改值等\n    *p = 100;\n \
    \   cout << \"P is: \" << *p << endl;\n\n    // 释放内存\n    delete p;\n}\n```\n\n\
    如你所见，对 `p` 的内存分配进行了检查，这是一种推荐的做法，因为它可以监控任何内存问题。如果你只是像这样写：\n\n```cpp\ndouble* p;\n\
    p = new double;\n```\n\n如果第二行失败，`p` 可能会指向任何内存位置，并在更改 `p` 的值时导致程序崩溃。\n\n### 数组的动态内存\n\
    \n就像对变量操作一样，你也可以对数组进行以下操作：\n\n1. 使用 `new[]` 分配一块内存\n2. 使用 `delete[]` 释放多块内存\n\n\
    例如，如果我们想创建一个指向 5 个对象的指针数组：\n\n```cpp\n#include \"stdafx.h\"\n#include <iostream>\n\
    \nusing namespace std;\n\nclass MyClass\n{\npublic:\n    MyClass()\n    {\n  \
    \      cout << \"Made!\" << endl;\n    }\n    ~MyClass()\n    {\n        cout\
    \ << \"Deleted!\" << endl;\n    }\n};\n\nint main()\n{\n    // 创建\n    MyClass*\
    \ classes = new MyClass[5];\n    // 释放\n    delete[] classes;\n}\n```\n\n**输出**\n\
    \n>Made!\n>Made!\n>Made!\n>Made!\n>Made!\n>Deleted!\n>Deleted!\n>Deleted!\n>Deleted!\n\
    >Deleted!\n\n如你所见，`main()` 中的第一行创建了 5 个 `MyClasses`，构造函数执行并打印“Made!”，接下来的代码释放内存，析构函数执行并打印“Deleted!”，这可以用极少的代码创建大量的指针。\n\
    \n### 指针算术\n\n你可以给指针加上一个值以移动到下一个内存位置。假设我们有一个整数型指针，在 64 位系统上 `int` 应该是 4 字节。所以：\n\
    \n```cpp\nint* p = new int;\np = p + 1;\n```\n\n上面的代码将移动到下一个 4 字节。通过 `+1` 表示移动到下一个变量大小的间隔，例如，如果我们有一个\
    \ 8 字节的 `long long`，加 1 就会移动 8 字节。你也可以反相反方向减去 1，它们的效果完全相同，只是方向相反。\n\n下面的示例演示了这一点：\n\
    \n```cpp\n#include \"stdafx.h\"\n#include <iostream>\n\nusing namespace std;\n\
    \nint main()\n{\n    // 大小检查\n    cout << \"int is: \" << sizeof(int) << \" bytes\"\
    \ << endl;\n\n    // 创建内存\n    int* next = new int[10];\n    for (int i = 0; i\
    \ < 10; i++)\n    {\n        // 移动 4 字节\n        cout << next + i << endl;\n \
    \   }\n\n    // 释放内存\n    delete[] next;\n}\n```\n\n**输出**\n\n>int is: 4 bytes\n\
    >00DDDB50\n>00DDDB54\n>00DDDB58\n>00DDDB5C\n>00DDDB60\n>00DDDB64\n>00DDDB68\n\
    >00DDDB6C\n>00DDDB70\n>00DDDB74\n\n如你所见，内存被分配了，且指针每次移动 1 位。从输出可以看出，十六进制地址之间相差\
    \ 4，因为内存地址是相邻的。\n\n## 章节结束测试\n\n* `ios::app` 标志代表什么？\n* 为什么关闭文件很重要？\n* 使用哪个运算符向文件写入数据？\n\
    * `.eof()` 意味着什么？\n* 每一个递归函数都需要什么？\n* `#ifdef` 是什么意思？\n* `##` 运算符实现了什么功能？\n* 什么时候应该使用\
    \ `delete []`？\n* `new` 运算符返回什么？\n* 在整数指针上加 1 会发生什么？\n\n### 答案\n\n* 它将以追加模式打开文件。\n\
    * 它释放与文件关联的资源。\n* 插入运算符 (`<<`)。\n* 是一个在到达文件末尾时返回 true 的方法。\n* 一个防止无限循环的停止条件。\n\
    * 如果别名未定义，则将包含其封装的代码。\n* 它连接并替换两个值。\n* 当你想删除一个块用户分配的内存时。\n* 指向新创建的内存位置的指针。\n*\
    \ 如果整数是 4 字节，它将移动 4 字节。\n\n"
