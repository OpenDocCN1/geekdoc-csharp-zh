    \n# Processes and functionality\n\n## Delegates\n\nDelegates` are very similar\
    \ to function pointers in `C` or `C++` if you have come across this concept before.\
    \ So, delegates are a reference type variable that holds references to a function.\n\
    \nA real-world use for delegates is using them for dynamic calls back to a function,\
    \ the delegate is passed as a parameter and the function is dynamically called.\n\
    \nSo for example the definition below can be used to reference any method that\
    \ has two `int` parameters, it returns an integer and is marked as private.\n\n\
    ```csharp\npublic delegate int ExampleDeligate(int a, int b);\n```\n\nYou then\
    \ would create an instance of this delegate by using the `new` keyword like so:\n\
    \n```csharp\nusing System;\n\nnamespace ConsoleApplication1\n{\n    class Program\n\
    \    {\n        public delegate int ExampleDeligate(int a, int b);\n        static\
    \ void Main()\n        {\n            ExampleDeligate addDel = new ExampleDeligate(AddTwoNumbers);\n\
    \        }\n        public static int AddTwoNumbers(int a, int b)\n        {\n\
    \            return a + b;\n        }\n    }\n}\n```\n\nAs you can see the delegate\
    \ is initialised and in the brackets is the name of function it will reference.\n\
    \nTo use the delegate just treat it as it like any other function:\n\n```csharp\n\
    addDel(1, 2);\n```\n\nThis gives a nice dynamic, useable way to pass functions\
    \ as parameters. Below is an example using this to act as a calculator;\n\n```csharp\n\
    using System;\n\nnamespace ConsoleApplication1\n{\n    class Program\n    {\n\
    \        public delegate float Calculation(float a, float b);\n        static\
    \ void Main()\n        {\n            //All you have to do is pass in the function\
    \ by name\n            Calculater(10, 20, Add);\n            Calculater(5, 267,\
    \ Sub);\n            Calculater(14, 2, Mul);\n            Calculater(10, 10, Div);\n\
    \            Console.ReadKey();\n        }\n        public static void Calculater(float\
    \ a, float b, Calculation cal)\n        {\n            //Dynamic method call\n\
    \            float value = cal(a, b);\n            Console.WriteLine($\"New value\
    \ is: {value}\", value);\n        }\n        //Basic functions\n        public\
    \ static float Add(float a, float b)\n        {\n            return a + b;\n \
    \       }\n        public static float Sub(float a, float b)\n        {\n    \
    \        return a - b;\n        }\n        public static float Mul(float a, float\
    \ b)\n        {\n            return a * b;\n        }\n        public static float\
    \ Div(float a, float b)\n        {\n            return a / b;\n        }\n   \
    \ }\n}\n```\n\nOutput:\nNew value is: 30\nNew value is: -2\nNew value is: 28\n\
    New value is: 1\n\nThe highlighted area shows how you can pass in a delegate as\
    \ a parameter, and all you do is pass the function in the delegates position,\
    \ this gives a wonderfully easy way to reuse code.\n\n### Multicasting\n\nDelegates\
    \ also allow the concatenation of function calls onto each other, like this:\n\
    \n```csharp\nCalculation DEL = new Calculation(Add);\nDEL += new Calculation(Sub);\n\
    DEL += new Calculation(Mul);\nDEL += new Calculation(Div);\n```\n\nThis means\
    \ all the method will be called in one chain, so for example say the parameters\
    \ are 10 and 20 the answer would be equal to the last method added, in this case\
    \ (10/20 = 0.5), in this example it runs over the method but they don’t affect\
    \ each so it’t change the answer, so careful consideration needed when choosing\
    \ what method to add to a delegate.\n\nBut the example below when not returning\
    \ values:\n\n```csharp\nusing System;\n\nnamespace ConsoleApplication1\n{\n  \
    \  class Program\n    {\n        public delegate void Print();\n        static\
    \ void Main()\n        {\n            Print call = new Print(PrintHello);\n  \
    \          call += new Print(Today);\n            call += new Print(Car);\n  \
    \          //Method call\n            call();\n            Console.ReadKey();\n\
    \        }\n        public static void PrintHello()\n        {\n            Console.WriteLine(\"\
    Hello\");\n        }\n        public static void PrintToday()\n        {\n   \
    \         Console.WriteLine(\"Today\");\n        }\n        public static void\
    \ PrintCar()\n        {\n            Console.WriteLine(\"Car\");\n        }\n\
    \    }\n}\n```\n\nThis shows you can string multiple function calls into one delegate\
    \ call, this can also be passed as a parameter and used in another function.\n\
    \n## Anonymous Methods\n\nPreviously we mentioned delegates are used to reference\
    \ any methods with the same signature as the delegate.\n\nAnonymous methods provide\
    \ a technique to pass a code block as a delegate parameter. They’re methods without\
    \ a name, so they’re just the body. You do not need to define the return type\
    \ of the method, it’s inferred (automatically determined) from the return statement\
    \ in the methods body.\n\nThey are effectively delegates that aren’t referencing\
    \ an actual method, it’s being created just for the delegate, so going back to\
    \ our calculator example it would look like this:\n\n```csharp\nusing System;\n\
    \nnamespace ConsoleApplication1\n{\n    //Delegate\n    public delegate int Calculation(int\
    \ a, int b);\n    class Program\n    {\n        Calculation add = delegate (int\
    \ a, int b)\n        {\n            return a + b;\n        };\n        Calculation\
    \ sub = delegate (int a, int b)\n        {\n            return a - b;\n      \
    \  };\n        Calculation mul = delegate (int a, int b)\n        {\n        \
    \    return a * b;\n        };\n        Calculation div = delegate (int a, int\
    \ b)\n        {\n            return a / b;\n        };\n        static void Main()\n\
    \        {\n            Program p = new Program();\n            p.add(10, 20);\n\
    \            p.div(2, 10);\n            Console.WriteLine();\n        }\n    }\n\
    }\n```\n\nWhere each command is defined as an anon method, and just called like\
    \ a regular function. The use of anonymous methods reduces the coding overhead\
    \ of creating delegates because another method does not need defining prior to\
    \ creating a delegate instance, which seems wasteful. So anonymous methods should\
    \ be used when the overhead of creating a method seems.\n\n## Events\n\nEvents\
    \ are user actions such as key pressed, clicks, mouse movements etc. This allows\
    \ programs or code to execute that is dependent on an event triggering, this is\
    \ known as event-driven programming.\n\nDelegates are often used with events,\
    \ events are associated with the event handler (trigger detection) by using the\
    \ delegate. Events use the publisher-subscriber model:\n\n*   A publisher is a\
    \ class that contains the event, this is as the name suggests used to publish\
    \ the event.\n*   The subscriber class is a class that accepts the event. The\
    \ delegate in the publisher class invokes the method of the subscriber class.\n\
