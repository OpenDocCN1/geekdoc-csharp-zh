    \        FavouriteBone = favBone;\n             kColour = KennelColour;\n    \
    \    }\n private  string FavouriteBone;\n private  string KennelColour;\n    }\n\
    }\n```\n\nThere are a few points to mention, the first is the example showing\
    \ how functions are inherited, `Dog` does not have a definition for `PrintName()`\
    \ but because it inherits `Animal` it has its own definition.\n\nThe other point\
    \ it is the `base(_name, _age)`, this is how you call the base constructor, in\
    \ this case it’s calling the `Animal` constructor above.\n\n## Encapsulation\n\
    \nEncapsulating is the process of enclosing one or more items within a physical\
    \ or logical package and in the context of OOP is how access to member variables\
    \ is managed.\n\nWe’ve seen three of these before but this section will go into\
    \ more detail about the sections below:\n\n1. Public\n2. Protected\n3. Private\n\
    4. Internal\n5. Protected internal\n\n**Public** simply allows full access to\
    \ member objects. For example:\n\n```csharp\nclass  Program\n{\nstatic  void Main(string[]\
    \ args)\n    {\nPublic p = new  Public(); //value can be accessed and changed\n\
    \ p.value = 3;\n    }\n}\nclass  Public\n{\n int value;\n}\n```\n\n**Private**\
    \ Is the complete opposite of public where internal calls to a variable are allowed,\
    \ this means if we want to change variable we need to accessor function:\n\n```csharp\n\
    class  Program\n{\nstatic  void Main(string[] args)\n    {\nPrivate p = new  Private();\
    \ //Error here!\n p.value = 3;\n    }\n}\nclass  Private\n{\n private int value;\n\
    }\n```\n\n**Protected** is a little different, protected involves when a class\
    \ inherits functions and variable from another (mentioned previously).\n\n**Internal**\
    \ allows a class to exposed both member functions and variables to the current\
    \ assembly, essentially this is just functions contained within the application\
    \ (`exe` or `.dll`).\n\n**Protected internal** is very like internal with a few\
    \ differences, it does inheritance much like protected.\n\nNote: You may be thinking\
    \ what an access modifier isn’t? Well, If that is (and it’s completely valid),\
    \ it will default to private.\n\n## End of chapter\n\n1. What does OOP stand for?\n\
