  \n\n\n\n\n* 你可以创建一个不包含在抽象类中的抽象方法吗？\n* `Interface`（接口）和抽象类之间的主要区别是什么是什么？\n* 访问命名空间（namespace）中的项时使用什么运算符？\n\
  * 如何告诉编译器自动包含另一个命名空间？\n\n## 回答\n\n* 静态和动态多态。\n* 负载载。\n* 意味着该类无法被继承。\n* 直接创建它的实例。\n\
  * 重载。\n* 为了区分类和方法的名称名称。\n* 不，所有的抽象方法都必须在抽象类中。\n* 接口不允许添加实现代码，它们是设计新类的蓝图。\n* 成员运算符（点号\
  \ `.`）。\n* 通过在程序顶部添加 `using` 语句。\n\n# 第 4 章\n\n## 节点功能\n\n## 运算符重载\n\nC# 支持更改许多内置运算符的功能，例如\
  \ `+` 或我们之前遇到过的成员运算符 `.`。运算符重载器是特殊的函数，它们包含 `operator` 关键字，后跟运算符符号，就像任何其他重载运算符的函数一样，它们有返回类型和参数列表。\n\
  \n在这个示例中，我们将创建一个名为 `Grade` 的类并重载加法运算符。运算符重载器的定义方式如下：\n\n```csharp\npublic static\
  \ Grade operator+(Grade a, Grade b)\n{\n\n}\n```\n\n注意：`operator` 函数需要是静态的（static）且公共的（public）。\n\
  \n下面的示例实现了此被重载运算符：\n\n```csharp\nusing System;\n\nnamespace ConsoleApplication1\n\
  {\n    class Program\n    {\n        static void Main(string[] args)\n        {\n\
  \            Grade a = new Grade(30);\n            a.Print();\n            Grade\
  \ b = new Grade(40);\n            b.Print();\n            Grade c = a + b;\n   \
  \         c.Print();\n            Console.ReadKey();\n        }\n    }\n    class\
  \ Grade\n    {\n        int mark;\n        public Grade(int m)\n        {\n    \
  \        mark = m;\n        }\n        public void Print()\n        {\n        \
  \    Console.WriteLine($\"The mark is: {mark}\", mark);\n        }\n        public\
  \ static Grade operator+(Grade a, Grade b)\n        {\n            Grade c = new\
  \ Grade(0);\n            c.mark = a.mark + b.mark;\n            return c;\n    \
  \    }\n    }\n}\n```\n\n输出\n> The mark is: 30\n> The mark is: 40\n> The mark is:\
  \ 70\n\n此实例中的运算符只是获取每个成绩实例的分数并将结果相加。这是一个非常基础的示例，运算符重载可以非常有用。\n\n### 练习\n\n所以例如，如果我们现在想比较两个分数，如果我们添加：\n\
  \n```csharp\nif (a == b)\n{\n    Console.WriteLine(\"Equal grades!\");\n}\n```\n\
  \n并将两个分数的标记设置为完全相同，假设为 30。它应该打印出“Equal grades”。\n\n重载 `==` 运算符来比较两个分数并判断它们是否相等。\n\
  \n注意：\n* 运算符重载函数应该返回一个 `bool`。\n* `!=` 运算符也需要同时实现（这只需执行完全相反的操作）。\n\n## 解决方案\n\n\
  整个程序看起来应该示例一样，新添加的内容被包含在框中。\n\n```csharp\nusing System;\n\nnamespace ConsoleApplication1\n\
  {\n    class Program\n    {\n        static void Main(string[] args)\n        {\n\
  \            Grade a = new Grade(30);\n            a.Print();\n            Grade\
  \ b = new Grade(30);\n            b.Print();\n            //Test\n            if\
  \ (a == b)\n            {\n                Console.WriteLine(\"Equal grades!\");\n\
  \            }\n            Console.ReadKey();\n        }\n    }\n    class Grade\n\
  \    {\n        int mark;\n        public Grade(int m)\n        {\n            mark\
  \ = m;\n        }\n        public void Print()\n        {\n            Console.WriteLine($\"\
  The mark is: {mark}\", mark);\n        }\n        public static Grade operator+(Grade\
  \ a, Grade b)\n        {\n            Grade c = new Grade(0);\n            c.mark\
  \ = a.mark + b.mark;\n            return c;\n        }\n        public static bool\
  \ operator==(Grade a, Grade b)\n        {\n            return a.mark == b.mark;\n\
  \        }\n        public static bool operator!=(Grade a, Grade b)\n        {\n\
  \            return a.mark != b.mark;\n        }\n    }\n}\n```\n\n输出\n> The mark\
  \ is: 30\n> The mark is: 30\n> Equal grades!\n\n## 正则表达式\n\n正则表达式是匹配输入文本中模式的一种方法，`.NET`\
  \ 框架内置了正则表达式的支持。这将是关于如何使用表达式的概述，有很多组合需要学习，在本章之后进行一些研究。\n\n每个正则表达式都需要构建，下面是允许你创建正则表达式的每个字符、运算符和函数列表：\n\
  \n### 锚点与额外字符\n\n| 字符 | 描述 |\n| :--- | :--- |\n| `^` | 指向单词开头的引用 |\n| `$` | 指向字符串的结尾\
  \ |\n| `\\w` | 指由 a-z, A-Z, 0-9 和下划线组成的单词 |\n| `+` | 指 0 次或多次出现 |\n| `\\|` | 用于指定“或”\
  \ |\n| `[nnn]` | 用于指定字符集 |\n\n（注：由于原文从此处开始出现了大量重复和乱码的示例文本，已根据高级工程师逻辑进行了结构性处理，确保核心技术内容翻译准确。）\n\
  \n\n\n\n\n| Token | 说明 | 注意 |\n| :--- | :--- | :--- |\n| `\\e` | 匹配转义字符 | `001B`\
  \ |\n| `\\nnn` | 使用八进制表示指定字符（`nnn` 被替换为数值） | 每个字母都有其对应的八进制表示 |\n| `\\x nn` | 使用十六进制表示指定字符（`nn`\
  \ 再次由两个数字组成） | 每个字母都有其对应的十六进制表示 |\n| `\\unnnn` | 使用十六进制表示显示 Unicode 字符，每个 ‘n’ 都是数值\
  \ | 每个 Unicode 字母都有其对应的十六进制表示 |\n| `\\W` | 匹配任何非字符单词 | |\n| `\\s` | 匹配任何空白字符 | |\n\
  | `\\S` | 匹配任何非空白字符 | |\n| `\\d` | 匹配任何数字值 | |\n| `\\D` | 匹配数字以外的任何字符 | |\n\n##\
  \ 预处理器指令\n\n预处理器指令设计用于发送给编译器的消息，在任何编译之前进行处理。它们以哈希符号（`#`）标记，并且由于它们不是语句，因此不需要行尾语句（`;`）。\n\
  \nC# 预处理器指令与 C++ 或 C 中的指令没有区别，且它们不能用于宏定义。\n\n| 指令 | 解释 |\n| :--- | :--- |\n| `#define`\
  \ | 创建一个符号 |\n| `#undef` | 用于取消符号定义 |\n| `#if` | 用于根据条件测试符号 |\n| `#else` | 与 `#if`\
  \ 配合使用 |\n| `#elif` | 在同一语句中表示“否则如果”（else if if） |\n| `#endif` | 用于标记 `#if` 语句的结束\
  \ |\n| `#line` | 修改编译器的行号，可选功能是更改文件和警告的输出文件名 |\n| `#region` | 用于格式化整理 |\n| `#endregion`\
  \ | 显示区域的结束 |\n\n上面是一个相当详尽的表格，包含了所有的主要指令。下面是一些实用指令的示例：\n\n### `#define` & `#undef`\
  \ & `if`\n\n下面的示例显示了 `#define` 语句是否可以与 `#if` 语句一起使用：\n\n```csharp\n#define VALUE\n\
  \nusing System;\n\nnamespace ConsoleApplication1\n{\n    class Program\n    {\n\
  \        static void Main(string[] args)\n        {\n#if (VALUE)\n            Console.WriteLine(\"\
  Defined\");\n#else\n            Console.WriteLine(\"Not Defined\");\n#endif\n  \
  \          Console.ReadKey();\n        }\n    }\n}\n```\n\n输出\n> `Defined`\n\n如你所见，这可以轻松切换代码，最常见的示例是用于调试代码或详细模式：\n\
  \n```csharp\n#define VERBOSE\n\nusing System;\n\nnamespace ConsoleApplication1\n\
  {\n    class Program\n    {\n        static void Main(string[] args)\n        {\n\
  \            Console.WriteLine(\"Start!\");\n            int a = 1 + 3;\n#if (VERBOSE)\n\
  \            Console.WriteLine(\"Addition complete\");\n#endif\n            int\
  \ b = 1 - 4;\n#if (VERBOSE)\n            Console.WriteLine(\"Subtraction complete\"\
  );\n#endif\n            int c = 1 * 3;\n#if (VERBOSE)\n            Console.WriteLine(\"\
  Multiplication complete\");\n#endif\n            int d = 1 / 3;\n#if (VERBOSE)\n\
  \            Console.WriteLine(\"Division complete\");\n#endif\n            Console.WriteLine(\"\
  End!\");\n            Console.ReadKey();\n        }\n    }\n}\n```\n\n下面的示例展示了一个非常基础且几乎没有意义的程序，但它的目的是演示\
  \ `#defined` 如何像开关一样工作。复制并运行程序，比较在顶部添加或删除 `#define` 时程序的运行情况。\n\n`#if` 使用普通的条件判断作为实际的\
  \ `if` 语句，列表如下：\n\n* `==`\n* `||` (或)\n* `&&`\n* `!=`\n\n### `#region`\n\n`region`\
  \ 在程序执行时对程序没有作用，但它可以更容易地折叠和隐藏代码区域，其用法如下所示：\n\n```csharp\n#region Hide This\nConsole.WriteLine(\"\
  Print!\");\n#endregion\n```\n\n输出\n> `Print!`\n\n折叠后它看起来像这样\n![](img/image00623.jpeg)\n\
  \n## 异常处理\n\n当发生错误时，会“抛出”异常，它是程序无法继续运行的情况的响应。异常可以被处理，你的程序并不总是会崩溃，有四个关键字；`try`、`catch`、`finally`\
  \ 和 `throw`：\n\n* `try` – 用于包裹你想要监控异常的代码，如果发现异常，它会将控制权转移到 `catch` 部分。\n* `catch`\
  \ – 如果在相应的 `try` 块中抛出异常，程序将进入这里。\n* `finally` – 可以与 `try/catch` 配合使用，但无论是否抛出异常它都会运行。一个很好的例子是打开文件读取时，它始终需要关闭。\n\
  * `throw` – 用于手动抛出带有你自己自定义文本的异常。\n\n下面是使用 `try/catch` 的示例：\n\n```csharp\nusing System;\n\
  \nnamespace ConsoleApplication1\n{\n    class Program\n    {\n        static void\
  \ Main(string[] args)\n        {\n            try\n            {\n             \
  \   // 除以零错误\n                int zero = 0;\n                int i = 1 / zero;\n\
  \            }\n            catch (Exception e)\n            {\n               \
  \ Console.WriteLine(e.Message);\n            }\n            Console.ReadKey();\n\
  \        }\n    }\n}\n```\n\n输出\n> `Attempted to divide by zero.`\n\n注意：`try/catch`\
  \ 用于处理异常，`finally` 无论是否抛出异常都会运行。\n\n\n\n\n\n- `AttributeTargets.Method`\n- `AttributeTargets.Property`\n\
  - `AllowMultiple` 明是否可以创建并应用多个版本的属性。\n- `Inherited` 规定当其他类继承该属性所属的类时，该属性是否会被继承。\n\
  \n这在之后被用于创建自定义属性。\n\n## Conditional\n\n这些条件性属性用于标记依赖于某些预处理指令的方法，在本例中，我们将使用一个调试示例：\n\
  \n```csharp\nusing System;\nusing System.Diagnostics;\n\nnamespace ConsoleApplication1\n\
  {\n    class Program\n    {\n        public static void Main()\n        {\n    \
  \        Debugging();\n            Console.ReadKey();\n        }\n\n        [Conditional(\"\
  DEBUG\")]\n        static void Debugging()\n        {\n            Console.WriteLine(\"\
  This is example debugging code:\");\n            Console.WriteLine(\"Number of loops:\
  \ \" + 1);\n            Console.WriteLine(\"Values found: \" + 102);\n        }\n\
  \    }\n}\n```\n\n只有当程序设置为调试模式（debug mode）时，才会打印示例输出，这为抽象代码和必要的输出提供了一种非常整洁的方式。`DEBUG`\
  \ 标志已内置在 Visual Studio 中，因此当程序切换到发布模式（release mode）时，调试模式将为 false，代码将不会执行。\n\n也可以通过自定义预处理指令来实现：\n\
  \n```csharp\n#define CUSTOM\nusing System;\nusing System.Diagnostics;\n\nnamespace\
  \ ConsoleApplication1\n{\n    class Program\n    {\n        public static void Main()\n\
  \        {\n            Custom_Method();\n            Console.ReadKey();\n     \
  \   }\n\n        [Conditional(\"CUSTOM\")]\n        static void Custom_Method()\n\
  \        {\n            Console.WriteLine(\"Custom output!\");\n        }\n    }\n\
  }\n```\n\n## Obsolete\n\n这用于遗留和兼容性考虑。例如，如果你有一个类使用了 `SaveFile()` 函数，但后来进行了更新且该函数变得过时，就会创建一个名为\
  \ `Save()` 的新函数，因为现在该函数保存其他项目。`SaveFile()` 将标记为废弃，这样使用这些函数的其他程序就不会出现兼容性问题。\n\n示例展示了\
  \ `obsolete` 的用法：\n\n```csharp\nusing System;\nnamespace ConsoleApplication1\n{\n\
  \    class Program\n    {\n        public static void Main()\n        {\n      \
  \      Output old = new Output();\n            old.PrintData();\n            Output\
  \ newV = new Output();\n            newV.Print();\n            Console.ReadKey();\n\
  \        }\n    }\n\n    class Output\n    {\n        string example = \"Example\"\
  ;\n        [Obsolete(\"Deprecated! Use Print() instead\", false)]\n        public\
  \ void PrintData()\n        {\n            Console.WriteLine(example);\n       \
  \ }\n        public void Print()\n        {\n            Console.WriteLine(example);\n\
  \        }\n    }\n}\n```\n\n输出:\nExample\nExample\n\n你可以看到两者都可以工作，但 `old.PrintData()`\
  \ 会显示一个警告，看起来如下：(image0024.jpeg)\n注意：这是因为使用了 `false` 参数，这意味着仅显示警告；如果为 `true`，则会创建一个错误并不允许程序编译。它将像这样出现在错误列表中：(image0025.jpeg)\n\
  \n## Custom Attributes\n\n框架允许创建自定义属性，可以存储程序员认为相关的任何信息，这与定义类非常相似，但该类需要继承 `System.Attribute`\
  \ 类，并在上方定义 `AttributeUsage`。下面是一个基础示例，该仅创建一个描述的示例属性：\n\n```csharp\n[AttributeUsage(AttributeTargets.Class,\
  \ AllowMultiple = true, Inherited = true)]\nclass Description : Attribute\n{\n \
  \   public string Text { get; }\n    public Description(string text)\n    {\n  \
  \      Text = text;\n    }\n}\n```\n\n你可以看到，这与创建类非常相似，区别在于对 `Attribute` 的继承以及 `AttributeUsage`\
  \ 属性。可以这样使用：\n\n```csharp\n[Description(\"Main method!\")]\n[Description(\"AllowMultiple\
  \ = true, so you can have multiple Descriptions\")]\nclass Program\n{\n    public\
  \ static void Main()\n    {\n    }\n}\n```\n\n这些信息可以通过反射（reflection）过程获取并使用，将在下一节中探讨。\n\
  \n## Reflection\n\n对象的反射用于在运行时获取信息，`System.Reflection` 提供了这些功能的访问。反射可以用于：\n\n- 查看属性信息\n\
  - 允许对方法和属性进行后期绑定\n- 允许在运行时创建类型\n\n## Metadata\n\n元数据是关于数据的数据，在这种情况下，它是关于属性的数据。开始时你需要像这样创建一个\
  \ `info` 实例：\n\n`MemberInfo info = typeof(AttributeTest);`\n\n现在可以使用它来检查信息。下面的示例打印了附加的属性。记住在顶部包含：`using\
  \ System.Reflection;`。对于示例，我们将使用之前定义的 `Description` 属性：\n\n```csharp\nusing System;\n\
  using System.Reflection;\n\nnamespace ConsoleApplication1\n{\n    class Program\n\
  \    {\n        static void Main()\n        {\n            AttributeTest t = new\
  \ AttributeTest();\n            t.PrintAttributes();\n            Console.ReadKey();\n\
  \        }\n    }\n\n    [Description(\"Description 1!\")]\n    [Description(\"\
  Description 2!\")]\n    class AttributeTest\n    {\n        MemberInfo info = typeof(AttributeTest);\n\
  \        public void PrintAttributes()\n        {\n            // 返回属性数组\n     \
  \       object[] attributes = info.GetCustomAttributes(true);\n            // 属性\n\
  \            foreach (Description attr in attributes)\n            {\n         \
  \       Console.WriteLine(attr.Text);\n            }\n        }\n    }\n\n    [AttributeUsage(AttributeTargets.Class,\
  \ AllowMultiple = true, Inherited = true)]\n    class Description : Attribute\n\
  \    {\n        public string Text { get; }\n        public Description(string text)\n\
  \        {\n            Text = text;\n        }\n    }\n}\n```\n\n输出:\nDescription\
  \ 1!\nDescription 2!\n\n你可以看到程序打印了附加的属性文本。`info.GetCustomAttributes(true);` 返回属性列表，然后在随后的\
  \ `foreach` 循环中打印。\n\n## Indexers\n\n索引器允许自定义类像数组一样被索引，每个成员通过 `[]` 操作符访问。索引器的定义如下：\n\
  \n```csharp\ntype index\n{\n    get; // 返回值\n    set; // 设置值\n}\n```\n\n你可以像数组语法一样调用它。在本示例中，它将目录搜索，索引器接收一个名称：\n\
  \n```csharp\nusing System;\nusing System.Collections.Generic;\n\nnamespace ConsoleApplication1\n\
  {\n    class Program\n    {\n        static void Main()\n        {\n           \
  \ Inventory main_floor = new Inventory();\n            // 添加项目\n            main_floor.AddItem(new\
  \ Item(\"PS\", 49.50));\n            main_floor.AddItem(new Item(\"RX480\", 200.50));\n\
  \            // 使用索引器获取价格\n            Console.WriteLine(\"Price: \" + main_floor[\"\
  RX480\"]);\n            Console.ReadKey();\n        }\n    }\n\n    class Inventory\n\
  \    {\n        List<Item> Items = new List<Item>();\n        public void AddItem(Item\
  \ item)\n        {\n            Items.Add(item);\n        }\n\n        public double\
  \ this[string index]\n        {\n            get\n            {\n              \
  \  foreach (Item item in Items)\n                {\n                    if (item.Name\
  \ == index)\n                    {\n                        return item.Price;\n\
  \                    }\n                }\n                // 用于表示没有项目\n       \
  \         return -1;\n            }\n            set\n            {\n          \
  \      // 你也可以用它设置值，就像在属性中设置值一样\n            }\n        }\n    }\n\n    // 保存项目的简单类\n\
  \    class Item\n    {\n        public Item(string name, double price)\n       \
  \ {\n            Name = name;\n            Price = price;\n        }\n        public\
  \ string Name { get; }\n        public double Price { get; }\n    }\n}\n```\n\n\n\
  \n\n两个高亮区域都表示了索引器的定义和使用位置。程序仅跟踪项目，索引器被用于接收字符串以查找价格。\n\n### 练习\n\n添加一个重载的索引器版本（可以实现），用价格作为索引并返回名称。为了简单起见，无需担心两个项目具有相同的价格，只需假设所有项目的价格都不同。\n\
  \n## 解决方案\n\n你的 `Inventory` 类应该像这样（新的索引器已高亮）：\n\n```csharp\nclass Inventory\n{\n\
  \    List<Item> Items = new List<Item>();\n\n    public void AddItem(Item item)\n\
  \    {\n        Items.Add(item);\n    }\n\n    public double this[string index]\n\
  \    {\n        get\n        {\n            foreach (Item item in Items)\n     \
  \       {\n                if (item.Name == index)\n                {\n        \
  \            return item.Price;\n                }\n            }\n            return\
  \ -1;\n        }\n    }\n\n    public string this[double index]\n    {\n       \
  \ get\n        {\n            foreach (Item item in Items)\n            {\n    \
  \            if (item.Price == index)\n                {\n                    return\
  \ item.Name;\n                }\n            }\n            return null;\n     \
  \   }\n    }\n}\n```\n\n## 集合\n\n集合类是专门用于数据存储和检索的特化内置类。这些类中的某些类成员被定义为 `object`，`object`\
  \ 是 C# 中所有数据类型的基类。在泛型类引入之前，这是存储任何数据类型的方法。\n\n以下是主要集合的列表和解释：\n\n### List<T>\n\n`List`\
  \ 是 `ArrayList` 升级后的更现代版本，它是一个动态大小的列表，用于存储相同类型的不同值，它可以扩展和缩小（它会自动调整大小）。`List` 类是一个泛型类（在下一节中学习），但在这种情况下，它的意思是它可以包含任何内容，甚至是其他列表（通过这种方式你可以创建一个二维列表）。\n\
  \n列表的定义方式如下所示所示：\n`List<type> list = new List<type>();`\n\n例如，一个整数列表的定义如下：\n`List<int>\
  \ list = new List<int>();`\n\n可以使用 `.Add()` 函数向列表添加值，并使用 `.Remove()` 移除。\n\n你可以通过访问\
  \ `.Count` 属性来获取 `List<>` 的长度或它包含了多少项目。\n\n### Hashtable\n\n注意：此方法已过时且不应使用，你应该使用\
  \ `Dictionary<>`，但了解这个集合的工作原理是非常重要的。\n\n哈希表（hashtable）顾如其名是一种存储键值对的表，这些值对由哈希函数决定。哈希函数接收任意长度的输入并返回一个固定长度的值，这个过程也是不可逆的。因此在哈希表的情况下，要添加的键值对会被哈希处理，现在这个哈希值将等于表中的一个位置。然后键值对将存储在该位置。\n\
  \n注意：指定的键必须是唯一的。\n\n哈希表最大的优点之一是访问或检查表是否包含某个项的速度非常快，这是因为在数组或列表等大多数线性结构中，你需要增量地搜索列表以详尽地检查是否存在某个项，但在哈希表的情况下，如果搜索目标通过哈希找到了它应该去的位置，且该位置没有值，那么它就不存在。\n\
  \n### Dictionary<TKey, TValue>\n\n与这个 `List<T>` 类似，`Dictionary` 是基于之前提到的 `Hashtable`\
  \ 的泛型数据类型，它使用键值来保存数据。\n\n字典的定义如下所示：\n`Dictionary<KeyType, ValueType> dictionary\
  \ = new Dictionary<KeyType, ValueType>();`\n\n其中 `KeyType` 和 `ValueType` 都定义了用于存储每个成员的数据类型。向字典添加内容可以像如下所示：\n\
  `dictionary.Add(1, \"Value\");`\n\n你可以通过搜索键来获取值：`Console.WriteLine(dictionary[key]);`\n\
  \n可以通过 `foreach` 遍历来增加值，持有这两个值的的类型被称为 `KeyValuePair<TKey, TValue>`。实现方式如下所示：\n```csharp\n\
  foreach (KeyValuePair<int,string> item in dictionary)\n{\n    Console.WriteLine(item.Key);\n\
  \    Console.WriteLine(item.Value);\n}\n```\n\n### Stack\n\n这被称为“后进先出”（FILO）数据结构，当一个值被放入时是\
  \ `pushed`，当一个值被取出时（只能从栈顶取出）。\n\n栈的定义如下所示：\n`Stack s = new Stack();`\n\n通过推入（push）添加值：`s.Push(2);`并通过弹出（pop）取出。注意整数强制转换的使用，这是因为项被存储为对象：`int\
  \ value = (int)s.Pop();`\n\n### Queue\n\n`Queue`（队列）与栈非常相似，但它是“先入先出”（FIFO）结构。项分别使用\
  \ `Enqueue()` 和 `Dequeue()` 添加和移除。\n\n队列的定义如下所示：\n`Queue q = new Queue();`\n\n在队列中添加和移除的操作如下所示：\n\
  `q.Enqueue(1);//从队列中取出\nint i = (int)q.Dequeue();`\n\n## 泛型\n\n泛型（Generics）是 C#\
  \ 的一个强大特性，允许程序员创建一个可以接受任何数据类型（甚至是自定义类）的单一定义。泛型类型的使用用 `T` 表示，这源于它在 C++ 中被称为“模板化”（Templating）。例如我们之前提到过的\
  \ `List<>` 就是一个泛型类。\n\n你可以这样创建一个泛型类：\n```csharp\nclass Generic<T>\n{}\n```\n\n注意\
  \ `<>` 的使用，这些被用于创建泛型数据类型，它们不需要定义为 `T` 且可以有多个定义：\n```csharp\nclass Generic<Example,\
  \ AnotherExample>\n{}\n```\n\n上面的示例是有效的，但为了可读性，建议用 `T` 开始定义。以下是如何使用泛型类型的示例：\n```csharp\n\
  class Generic<TEx>\n{\n    public TEx value;\n    public Generic(TEx _value)\n \
  \   {\n        value = _value;\n    }\n    public void Print()\n    {\n        Console.WriteLine($\"\
  Data is: {value}\", value);\n    }\n}\n```\n\n此类定义可以与任何定义的数据类型一起使用：\n`Generic<string>\
  \ gStr = new Generic<string>(\"Hello\"); gStr.Print();`\n`Generic<int> gInt = new\
  \ Generic<int>(2); gInt.Print();`\n\n你可以从上面的代码通过 `<>` 定义使用类型。在下面的示例中将展示与用户类型工作：\n\
  `Generic<myClass> gMyClass = new Generic<myClass>(new myClass()); gMyClass.Print();`\n\
  输出为 `Data is: myClass`。\n\n你可以看出泛型允许以非常动态的方式定义类，并允许几乎无限数量的数据类型。下面是一个用于交换两个数据类型的实际程序：\n\
  \n```csharp\nusing System;\n\nnamespace ConsoleApplication1\n{\n    class Program\n\
  \    {\n        static void Main()\n        {\n            int a = 10;\n       \
  \     int b = 42;\n            Console.WriteLine($\"a is before swap: {a}\", a);\n\
  \            Console.WriteLine($\"b is before swap: {b}\", b);\n            Swap<int>\
  \ swap = new Swap<int>(ref a, ref b);\n            Console.WriteLine($\"a is after\
  \ swap: {a}\", a);\n            Console.WriteLine($\"b is after swap: {b}\", b);\n\
  \            Console.ReadKey();\n        }\n    }\n\n    public class Swap<T>\n\
  \    {\n        public Swap(ref T Left, ref T Right)\n        {\n            T temp;\n\
  \            temp = Left;\n            Left = Right;\n            Right = temp;\n\
  \        }\n    }\n}\n```\n\n另一个示例可以是创建一个泛型数组，注意使用索引器更容易访问和更改值：\n\n```csharp\nusing\
  \ System;\n\nnamespace ConsoleApplication1\n{\n    class Program\n    {\n      \
  \  static void Main()\n        {\n            Array<int> intArray = new Array<int>(1);\n\
  \            intArray[0] = 1;\n            Array<string> strArray = new Array<string>(1);\n\
  \            strArray[0] = \"Hello\";\n            Console.WriteLine(intArray[0]);\n\
  \            Console.WriteLine(strArray[0]);\n            Console.ReadKey();\n \
  \       }\n    }\n\n    public class Array<T>\n    {\n        T[] array;\n     \
  \   public Array(int size)\n        {\n            array = new T[size];\n      \
  \  }\n        //用于访问和更改值的索引器\n        public T this[int index]\n        {\n    \
  \        get { return array[index]; }\n            set { array[index] = value; }\n\
  \        }\n    }\n}\n```\n\n\n\n\n\n```csharp\npublic T this[int index]\n{\n  \
  \  get\n    {\n        return array[index];\n    }\n    set\n    {\n        array[index]\
  \ = value;\n    }\n}\n```\n\n在内部定义一个数组虽然有一点“作弊”，但你明白其意思。该数组被定义为泛型数组，这允许在之后定义类型。\n\
