  \ (182)\n### 练习 (184)\n### 章末测验 (186)\n### 答案 (186)\n\n# 第 1 章\n## 安装与简介\n## C#\
  \ 历史\nC# 首次于 2000 年由微软发布，C# 是微软拥有的一种语言，源自 C 语言族。它由 Anders Hejlsberg 领导的团队设计。最初他们提议将语言命名为“Cool”，代表“类\
  \ C 对象对象语言”（C-Like Object Orientated Language），但微软最终决定命名为 C#。使用了井号符号，但读作“sharp”，这是特意选择的，因为当时缺少“sharp”这个字母。以下是\
  \ C# 的时间线以及新增的功能：\n\n- 2002 年 1 月：C# 1.0（面向对象编程）\n- 2005 年 11 月：C# 2.0（泛型、可空类型、迭代器、部分类）\n\
  - 2007 年 11 月：C# 3.0（匿名类型、表达式树、扩展方法）\n- 2010 年 4 月：C# 4.0（动态、可选参数）\n- 2012 年 8 月：C#\
  \ 5.0（异步编程、线程）\n- 2015 年 7 月：C# 6.0（字符串插值、异常过滤器、特性）\n\n## 为什么选择 C#？\nC# 与 Java 和\
  \ Python 等类似语言相比有许多优势：\n- 它极其类型安全。\n- 它对内存有完全控制权。\n- 它提供了丰富的框架。\n\n## 在 Windows\
  \ 上运行 C#\n最近发布了 Mac 版 Visual Studio，但它并不具备所有功能。要使用 C#，你需要从微软下载 Visual Studio。请运行安装程序并安装。\n\
  \n1. 打开 Visual Studio。\n2. 点击“文件”并选择“新建项目”。\n3. 选择“控制应用程序”（ConsoleApplication）并命名。\n\
  4. 点击“确定”。\n\n# 第 2 章\n## 类与面向对象编程\n## 基本类\n类用于存储与对象相关的变量和功能，例如，可以为 `Book` 创建一个类，它将包含页数、体裁和封面颜色等信息，以及\
  \ `loan`（借出）或 `return`（归还）等功能。这就是类的实用性和真实世界的来源，也是 OOP 中“对象”一词的含义。\n\n在介绍如何创建类之前，需要理解一些访问关键字：\n\
  1. `private`：不能在类的范围之外访问。\n2. `public`：可以在任何地方访问。\n3. `protected`：可以从派生类访问。\n\n\
  你可以这样定义一个类：\n\n```csharp\nclass Book\n{\n}\n```\n\n在括号内定义所有变量和函数后，下面是一个完整的版本：\n\n\
  ```csharp\nclass Book\n{\n public Book(int numberOfPages, int currentPage, string\
  \ colour, string name)\n    {\n    _numberOfPages = numberOfPages;\n    _currentPage\
  \ = currentPage;\n    _colour = colour;\n    _name = name;\n    }\n\n private  int\
  \ _numberOfPages;\n\n private  int _currentPage;\n\n private  string _colour;\n\n\
  \ private  string _name;\n\n    public  string changeMe;\n\n public  int returnCurrentPage()\n\
  \    {\n return _currentPage;\n    }\n}\n```\n\n\n\n\n\n有几点需要注意。框中的函数被称为构造函数（Constructor，在本章中进行解释），它在创建新对象时被调用。此\
  \ `class` 包含了所有的成员变量和成员函数，它们都通过使用成员运算符（`.`）来访问。在这种情况下，所有变量都被标记为 `private`（私有的），这意味着它们不能从类的外部访问，这就是\
  \ getter 和 setter（访问器方法）派用场的地方。函数 `returnCurrentPage` 是一个 getter，允许访问 `currentPage`\
  \ 的值，这是处理变量访问的推荐方式，它为程序员提供了一个控制变量访问的平台。\n\n下面创建了一个对象并访问了它的部分函数和变量：\n\n```csharp\n\
  class Program\n{\n    static void Main(string[] args)\n    {\n        Book book1\
  \ = new Book(200, 32, \"Red\", \"Harry Potter\");\n        book1.changeMe = \"Test\"\
  ;\n        Console.WriteLine(book1.changeMe);\n        int currentPage = book1.returnCurrentPage();\n\
  \        Console.WriteLine(currentPage);\n    }\n}\n```\n\n输出\n>Test\n>32\n\n##\
  \ 复习\n1. 类提供了一种在真实世界对象上存储数据的直观方式。\n2. 它们允许围绕数据构建功能。\n3. 被用作一种模板，用于创建大量的数据容器。\n4.\
  \ 访问器方法允许访问私有变量。\n    1. Getter 返回变量的值。\n    2. Setter 允许程序更改值。\n\n## 属性 (Properties)\n\
  如上一章提到的访问器方法，属性（properties）允许使用一种简单易读且紧凑的语法来访问成员变量。属性还包含了变量定义。它们的定义方式如下：\n\n```csharp\n\
  public int currentPage\n{\n    get\n    {\n        return currentPage;\n    }\n\
  \    set\n    {\n        currentPage = value;\n    }\n}\n```\n\n调用方式如下：\n\n```csharp\n\
  Book book1 = new Book();\nbook1.currentPage = 2; // 2 是 set 中的 ‘value’\nConsole.WriteLine(book1.currentPage);\n\
  ```\n\n这执行的作用与上一章中的访问器完全相同，但语法要简洁得多，对比下所示：\n\n```csharp\nprivate int _currentPage;\n\
  public int returnCurrentPage()\n{\n    return _currentPage;\n}\n```\n\n等同于：\n\n\
  ```csharp\npublic int currentPage { get; }\n```\n\n如你所见，代码量要小得多。setter 的更高级用法是对输入进行验证。例如，当前页不能大于总页数。代码看起来可能是这样：\n\
  \n```csharp\nclass Book\n{\n    int totalPages = 500;\n    public int currentPage\n\
  \    {\n        get\n        {\n            return currentPage;\n        }\n   \
  \     set\n        {\n            // 验证检查\n            if (value < totalPages)\n\
  \            {\n                currentPage = value;\n            }\n          \
  \  else if(value == totalPages)\n            {\n                Console.WriteLine(\"\
  你已经完成了这本书!\");\n            }\n            else\n            {\n               \
  \ // 错误消息\n                Console.WriteLine(\"无效的当前页!\");\n            }\n    \
  \    }\n    }\n}\n```\n\n赋予了程序员编写考虑到多种可能性代码的能力。\n\n## 静态 (Static)\n如前面的章节所述，成员函数允许类持有与内部数据有某种关联的功能，这使得类几乎可以成为自包含的程序，这与成员变量一起赋予了类功能。\n\
  \n成员函数和变量可以被定义为 `static`（静态的），意味着对象“始终存在”。这用于行为在类的所有实例之间不会改变的情况，意味着该行为或变量在所有实例之间共享的。\n\
  \n注意：`static` 函数只能访问 `static` 变量。\n\n```csharp\nusing System;\nnamespace ConsoleApplication1\n\
  {\n    class Program\n    {\n        static void Main(string[] args)\n        {\n\
  \            Example e = new Example();\n            e.Instance(); // 错误\n     \
  \       Example.Instance(); // 错误\n            Example.Static(); // 错误\n       \
  \ }\n    }\n    class Example\n    {\n        public void Instance()\n        {\n\
  \            Console.WriteLine(\"Instance!\");\n        }\n        static void Static()\n\
  \        {\n            Console.WriteLine(\"Static!\");\n        }\n    }\n}\n```\n\
  \n上面的示例展示了如何访问不同类型的函数。下面是一个静态在“真实世界”示例中的例子：\n\n```csharp\nusing System;\nnamespace\
  \ ConsoleApplication1\n{\n    class Program\n    {\n        static void Main(string[]\
  \ args)\n        {\n            int i = Person.WorkAge(new DateTime(1990, 10, 15));\n\
  \            Console.WriteLine(i);\n        }\n    }\n    class Person\n    {\n\
  \        public Person(string _name, int _age)\n        {\n            name = _name;\n\
  \            age = _age;\n        }\n        public string name { get; }\n     \
  \   public int age { get; }\n        public static int WorkAge(DateTime birthday)\n\
  \        {\n            // 时间差值\n            TimeSpan difference = DateTime.Now\
  \ - birthday;\n            double years = difference.TotalDays / 365;\n        \
  \    return (int)years;\n        }\n    }\n}\n```\n\n此程序使用 `static` 方法根据生日计算某人的年龄，这允许方法持有相关函数，而无需单独的（函数）。\n\
  \n## 构造函数与析构函数 (Constructors and Destructors)\n在创建类的实例时会使用构造函数，语言提供了默认构造函数，但也可以创建自定义构造函数，你可以定义没有返回类型且与类名相同的函数，例如：\n\
  \n```csharp\nclass Person\n{\n    public Person()\n    {\n        Console.WriteLine(\"\
  Person created\");\n    }\n}\n```\n\n构造函数用于在创建实例时向成员变量传递数据。你可以定义任意多个构造函数，但它们需要不同的参数和数量，这被称为重载（overloading）。\n\
  \n例如：\n\n```csharp\nnamespace ConsoleApplication1\n{\n    class Program\n    {\n\
  \        static void Main(string[] args)\n        {\n            Person p1 = new\
  \ Person(\"John\", 32);\n            Person p2 = new Person(\"James\", 50, \"Train\
  \ Driver\");\n        }\n    }\n    class Person\n    {\n        public Person(string\
  \ _name, int _age)\n        {\n            name = _name;\n            age = _age;\n\
  \            job = \"N/A\";\n        }\n        public Person(string _name, int\
  \ _age, string _job)\n        {\n            name = _name;\n            age = _age;\n\
  \            job = _job;\n        }\n        public string name { get; }\n     \
  \   public int age { get; }\n        public string job { get; }\n    }\n}\n```\n\
  \n高亮部分显示了重载的使用，编译器根据参数列表中的类型自动检测使用哪个构造函数。\n\n就像构造函数一样，还有一个析构函数执行与构造函数相反的作用，析构函数不是处理创建代码而是处理清理代码。析构函数的创建方式如下：\n\
  \n```csharp\nclass Person\n{\n    ~Person()\n    {\n        Console.WriteLine(\"\
  Person deleted!\");\n    }\n}\n```\n\n此方法无法手动调用，而是由内部垃圾回收器管理的，它是编译器内置的一部分，用于自动内存管理。可以这样演示：如果调用了一个创建\
  \ `Person` 实例的方法，然后程序离开了主方法的作用范围，垃圾回收器将被调用以清理内存。\n\n```csharp\nusing System;\nnamespace\
  \ ConsoleApplication1\n{\n    class Program\n    {\n        static void Main(string[]\
  \ args)\n        {\n            Function();\n        }\n        static void Function()\n\
  \        {\n            Person p1 = new Person();\n        }\n    }\n    class Person\n\
  \    {\n        ~Person()\n        {\n            Console.WriteLine(\"Person deleted!\"\
  );\n            Console.ReadKey();\n        }\n    }\n}\n```\n\n输出\n>Person deleted!\n\
  \n### 练习\n\n\n\n\n创建一个存储 `Pets` 数据的类，该类需要动物的 `Name`（名称）、`Age`（年龄）和 `Type`（类型）。还需要一个构造函数（Constructor）、一个析构函数（Destructor）以及一个打印宠物所有数据的成员函数。\n\
  \n通过以下方式进行测试：一只名为 `Jose` 的 1 岁狗，一只名为 `Besse` 的 5 岁猫以及一只名为 `James` 的 10 岁鹦鹉。\n\n\
  ## 解决方案\n\n类似于所示：\n\n```csharp\nusing System;\n\nnamespace ConsoleApplication1\n\
  {\n class  Program\n    {\nstatic  void Main(string[] args)\n        {\nPet p1 =\
  \ new  Pet(\"Jose\", 1, \"Dog\");\n             p1.Print();\n\n Pet p2 = new  Pet(\"\
  Besse\", 5, \"Cat\");\n             p2.Print();\n\n Pet p3 = new  Pet(\"James\"\
  , 10, \"Parrot\");\n             p3.Print();\n Console.ReadKey();\n        }\n \
  \   }\n class  Pet\n    {\n public Pet(string _name, int _age, string _type)\n \
  \       {\n             name = _name;\n             age = _age;\n             type\
  \ = _type;\n        }\nstring name { get; }\nint age { get; }\nstring type { get;\
  \ }\n public  void Print()\n        {\n//{name} is string interpolation\n Console.WriteLine($\"\
  Name: {name}\",name);\n Console.WriteLine($\"Age: {age}\",age);\n Console.WriteLine($\"\
  Type: {type}\",type);\n Console.WriteLine();\n        }\n    }\n}\n```\n\n## 继承\n\
  \n继承是一种语言功能，允许类获取另一个类的特征，继承的实现如下：\n\n```csharp\nclass  Dog : Animal\n{\n}\n```\n\
  \n这意味着任何标记为“Public”（公共）或“Protected”（保护，保护将在下一章解释）的函数或变量`Dog` 将拥有其自己的版本或访问权限，这允许快速创建新类型的类，而无需重复函数和变量的定义。\n\
  \n下面的示例展示了如何使用：\n\n```csharp\nusing System;\n\nnamespace ConsoleApplication1\n{\n\
  \ class  Program\n    {\nstatic  void Main(string[] args)\n        {\nDog d1 = new\
  \  Dog(\"Rocko\", 3, \"Blue One\", \"Red\");\n d1.PrintName();\n        }\n    }\n\
  \ class  Animal\n    {\n public Animal(string _name, int _age)\n        {\n    \
  \         name = _name;\n             age = _age;\n        }\n public  string name;\n\
  \ public  int age;\n public  void PrintName()\n        {\n Console.WriteLine(name);\n\
  \        }\n    }\n class  Dog : Animal\n    {\n public Dog(string _name, int _age,\
  \ string favBone, string kColour) : base(_name, _age)\n        {\n             FavouriteBone\
  \ = favBone;\n             kColour = KennelColour;\n        }\n private  string\
  \ FavouriteBone;\n private  string KennelColour;\n    }\n}\n```\n\n有几点需要说明，第一个是示例展示了函数是如何被继承的，`Dog`\
  \ 没有 `PrintName()` 的定义，但因为它继承了 `Animal`，所以它拥有自己的定义。\n\n另外一点是 `base(_name, _age)`，这是调用基构造的方法，在这种情况下，它调用了上面的\
  \ `Animal` 构造函数。\n\n## 封装\n\n封装是将一个或多个项目封装在物理或逻辑包中的过程，在面向对象编程（OOP）的语文中，它是如何管理对成员变量的访问。\n\
  \n我们之前见过其中的三种，但本节将详细介绍以下部分：\n\n1. Public（公共）\n2. Protected（保护）\n3. Private（私有）\n\
  4. Internal（内部）\n5. Protected internal（保护内部）\n\n**Public** 仅仅允许完全访问成员对象。例如：\n\n\
  ```csharp\nclass MyClass\n{\n    public int value;\n}\n```\n\n**Protected** 仅允许类及其派生类访问成员。\n\
  \n```csharp\nclass MyClass\n{\n    protected int value;\n}\n```\n\n**Private** 仅允许类内部访问成员。\n\
  \n```csharp\nclass MyClass\n{\n    private int value;\n}\n```\n\n**Internal** 允许在同一个程序集中的代码访问成员。\n\
  \n```csharp\nclass MyClass\n{\n    internal int value;\n}\n```\n\n**Protected internal**\
  \ 允许在同一个程序集内或派生类中访问成员。\n\n```csharp\nclass MyClass\n{\n    protected internal int\
  \ value;\n}\n```\n\n**Public** 仅仅允许完全访问成员对象。例如：\n\n```csharp\nclass MyClass\n{\n\
