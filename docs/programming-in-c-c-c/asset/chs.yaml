  * 关闭文件 `fclose()`\n\n## 递归\n\n高亮部分是静态定义，只会运行一次。\n\n## 寄存器变量\n\n`register` 用于定义一个存储在寄存器内存而非普通内存中的变量，寄存器内存的优点是访问速度要快得多，但空间只能容纳几个变量。\n\
