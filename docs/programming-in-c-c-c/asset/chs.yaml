  , \"w+\");\n    //写入文件\n    fprintf(ptr, \"fprint()\\n\");\n    fputs(\"fputs()\\\
  n\", ptr);\n    //关闭文件\n    fclose(ptr);\n}\n```\n\n它会直接在 C 盘的 `C_IO` 目录下创建一个文件（在运行程序之前创建它）。它使用\
