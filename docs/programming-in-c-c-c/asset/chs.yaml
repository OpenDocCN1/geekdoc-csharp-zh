  9. `&` 什么？它做了什么？\n10. 当你传递数组作为参数时还需要什么？\n\n# 第 4 章 自定义结构体\n\n编程语言的可定制特性允许它们承担任何角色，程序员可以操作用于存储和处理数据的结构体。\n\
  \n## 结构体\n\n我们遇到的第一个用户定义对象是`结构体`，它允许自定义存储数据，定义方式如下：\n\n```c\nstruct 结构名\n{\n   \
  \ //语句\n};\n```\n\n其中 `语句` 是结构体持有的变量。结构体允许以意义的方式存储数据，它类似于数组，区别在于数组存储许多相同类型的变量，而结构体允许存储多种类型，甚至是其他结构体。\n\
  \n真实的示例如下：\n\n```c\nstruct Person\n{\n    int age;\n    char firstName[15];\n  \
  \  char lastName[15];\n    char favoriteColour[10];\n};\n```\n\n该结构体设计用于存储人的信息，可以这样创建一个新人：\n\
  \n```c\nstruct Person p1;\n```\n\n这就像定义一个新变量，下面的示例显示两个新创建的人包含独立且相互的值：\n\n```c\n\
  #include <stdio.h>\n\nstruct Person\n{\n    int age;\n    char firstName[15];\n\
  \    char lastName[15];\n    char favoriteColour[10];\n};\n\nvoid PrintPerson(struct\
  \ Person p)\n{\n    printf(\"名：%s\\n\", p.firstName);\n    printf(\"姓：%s\\n\", p.lastName);\n\
  \    printf(\"喜好颜色：%s\\n\", p.favoriteColour);\n    printf(\"年龄：%d\\n\", p.age);\n\
  \    puts(\"\");\n}\n\nint main()\n{\n    //人 1\n    struct Person p1;\n    p1.age\
  \ = 10;\n    strcpy(p1.firstName,\"John\");\n    strcpy(p1.lastName, \"Doe\");\n\
  }\n```\n\n\n\n```c\nstrcpy(p1.favoriteColour, \"Red\");\n\nPrintPerson(p1);\n\n\
  //Person 2\n\nstruct Person p2;\n\np2.age = 25;\n\nstrcpy(p2.firstName, \"Lucy\"\
  );\n\nstrcpy(p2.lastName, \"Brown\");\n\nstrcpy(p2.favoriteColour, \"Yellow\");\n\
  \nPrintPerson(p2);\n\n}\n```\n\n输出:\n>First Name:         John\n>Last Name:    \
  \      Doe\n>Favourite colour: Red\n>Age:               10\n>First Name:       \
  \  Lucy\n>Last Name:          Brown\n>Favourite colour: Yellow\n>Age:          \
  \     25\n\n将字符串值复制到结构体变量中需要使用 `strcpy()`。这段代码显示，每当创建一个新的 `Person` 时，都会创建一组与该 `Person`\
  \ 对应的新变量。这提供了一种非常简单的“模具化”方式，可以快速创建许多有意义的变量。还要注意如何访问每个变量，它是通过句号（访问运算符）：\n\n`personName.Variable`\n\
  \n`p1.age = 10;`\n\n### 嵌套结构\n\n结构体还可以包含其他结构体，它们可以是：内部定义的或外部定义的。\n\n#### 内部定义\n\n\
  这是在另一个结构体变量定义内部定义结构体定义。假设我们使用 person 的例子，将姓和名转换为结构体。\n\n```c\nstruct Person\n{\n\
  int age;\nchar favoriteColour[10];\nstruct Name\n{\nchar firstName[15];\nchar lastName[15];\n\
  } name;\n};\n```\n\n其中姓的访问方式如下：\n\n`p1.name.firstName;`\n\n#### 外部定义\n\n这与上述相同，但定义并不在另一个结构体内部：\n\
  \n```c\nstruct Name\n{\nchar firstName[15];\nchar lastName[15];\n};\n\nstruct Person\n\
  {\nint age;\nchar favoriteColour[10];\nstruct Name name;\n};\n```\n\n其中姓名的访问方式与内部定义完全相同。\n\
  \n- 内部定义意味着你不能在其他位置重新创建该结构，但可以在内部使用\n- 外部定义意味着你可以在内部以及其他位置使用它\n\n这使得代码更具模块化且可读性。\n\
  \n### TypeDef\n\nTypedef 是提供的一个关键字，允许你自定义内置和用户定义变量及结构体的名称。我在下面展示了一个示例：\n\n`typedef\
  \ int INTEGER;`\n\n这是获取数据类型 `int` 并赋予它另一个身份作为 `INTEGER`，现在 `INTEGER` 的定义方式与正常一样：\n\
  \n`INTEGER value = 10;`\n\n#### 真实世界示例\n\n这种方法实用的真实世界例子是整数值不同情况下的向后兼容。你可以这样定义 `int`：\n\
  \n`typedef int int32;`\n\n像使用 `int` 一样正常使用 `int32`，在需要更大的 `int` 值的机器上，你可以将定义更改为：\n\
  \n`typedef long int32;`\n\n代码只需少量维护即可继续工作。\n\n## 枚举 (Enums)\n\nEnum 代表枚举类型。`enum`\
  \ 是一种用户类型，允许创建包含自定义值的自定义数据类型。示例所示：\n\n```c\nenum Condition\n{\nWorking,\nNotWorking,\n\
  Finished,\nUnknown\n};\n```\n\n这定义了一个名为 `Condition` 的枚举，其中每种可能的类型都被定义为可能的状态。你可以这样创建和使用枚举：\n\
  \n```c\n#include <stdio.h>\n\nenum Condition\n{\nWorking,\nNotWorking,\nFinished,\n\
  Unknown\n};\n\nint main()\n{\n//创建\nenum Condition programCondition;\n//赋值\nprogramCondition\
  \ = Working;\n//比较\nif (programCondition == Working)\n{\nputs(\"All is good!\");\n\
  }\n}\n```\n\n此程序展示了你如何创建一个枚举、如何给它赋值，以及如何比较它的值。\n\n枚举最常用的用法是类似于布尔值，但带有额外的上下文信息和功能。它提高了可读性，并相比于布尔值的二元性添加了额外的状态。枚举非常适合跟踪具有限制且定义良好的值的数据，例如当前月份或星期几。\n\
  \n### 练习\n\n创建一个处理星期几的枚举，并打印出分配的任何一天（提示：switch-case 语句对于检查当前日期非常有用）。\n\n### 答案\n\
  \n如下：\n\n```c\n#include <stdio.h>\n\nenum WeekDay\n{\nMonday,\nTuesday,\nWednesday,\n\
  Thursday,\nFriday\n};\n\nenum Condition currentDay;\n\nint main()\n{\ncurrentDay\
  \ = Friday;\nswitch (currentDay)\n{\ncase Monday:\nputs(\"It's Monday!\");\ncase\
  \ Tuesday:\nputs(\"It's Tuesday!\");\nbreak;\ncase Wednesday:\nputs(\"It's Wednesday!\"\
  );\nbreak;\ncase Thursday:\nputs(\"It's Thursday!\");\nbreak;\ncase Friday:\nputs(\"\
  It's Friday!\");\nbreak;\n}\n}\n```\n\n### 并体 (Unions)\n\n并体是一种特殊的数据类型，允许在相同位置存放不同类型。它一次只存储一个值。你可以这样定义并体：\n\
  \n```c\nunion Name\n{\nint i;\nint y;\nchar word[20];\n};\n```\n\n看到改变一个值会影响其他变量，如果使用不当，这就是并体的缺点。\n\
  \n```c\nunion Name u;\nu.i = 10;\nprintf(\"%d\", u.y); // 这将出乎意料\nstrcpy(u.word,\
  \ \"Hello\");u.y = 25;\n```\n\n### 可变参数列表\n\n你可能会遇到一个需要多个参数的问题，这就是变参数的用处，它允许传递动态数量的变量。\n\
  \n注意：\n\n这需要包含一个新的头文件：\n\n`#include <stdarg.h>`\n\n使用变参数时添加此项。你设计的方法如下：\n\n`void\
  \ function(int noOfVariables, ...)`\n\n其中总是有一个变量定义变量的数量，后面跟着变量。额外的变量被赋值给名为 `va_list`\
  \ 的类型，这些列表通过以下函数进行操作：\n\n`va_start(va_list valist, int numberOfVariables);`\n\n\
  `va_start` 实际上将额外的变量放入 `va_list` 中。\n\n`va_arg(valist, type);`\n\n`va_arg` 获取下一个变量并返回，它不知道当前的整数是最后一个，所以程序设置需要确保不会溢出。\n\
  \n`va_end(valist);`\n\n`va_end` 仅清理 `va_list` 的内存。\n\n下面是一个寻找最大值的示例：\n\n```c\n```c>\n\
  #include <stdarg.h>\n\nint max(int n, ...)\n{\nint largest = 0;\n// 创建并分配\nva_list\
  \ valist;\nva_start(valist, n);\n// 遍历变量列表\nfor (int i = 0; i < n; i++)\n{\n// 获取下一个参数\n\
  int nextVar = va_arg(valist, int);\n// 比较值的大小 || 第一个值被赋值为最大值\nif (nextVar > largest\
  \ || i == 0)\n{\nlargest = nextVar;\n}\n}\n// 释放内存\nva_end(valist);\n\nreturn largest;\n\
  }\n\nint main() {\nprintf(\"Largest: %d\\n\", max(6, -2,3,4,5,66,10));\nprintf(\"\
  Largest: %d\\n\", max(3, 7, 2, 1));\n}\n```\n```\n\n\n\n}\n\n输出\n\n> 最大值: 66\n\n\
  > 最大值: 7\n\n此程序展示了变量列表的动态特性是很有用的。\n\n### 练习\n\n创建一个使用变量列表的程序，返回提供的 `int` 变量的平均值（所有数字之和除以个数）。\n\
  \n创建一个名为 `average` 的方法并返回一个 `float`，这将是变量函数。别忘记包含：\n\n```c\n#include <stdarg.h>\n\
  ```\n\n## 解决方案\n\n类似下面的的代码：\n\n```c\n#include <stdio.h>\n#include <stdarg.h>\n\n\
  double average(int n, ...)\n{\n    double total = 0.0;\n    // 创建变量列表\n    va_list\
  \ vaList;\n    va_start(vaList, n);\n    // 获取每个变量\n    for (int i = 0; i < n; i++)\n\
  \    {\n        // 等同于：\"total = total + va_arg(vaList, int);\"\n        total +=\
  \ va_arg(vaList, int);\n    }\n    // 清理！\n    va_end(vaList);\n    double avg =\
  \ total / n;\n    return avg;\n}\n\nint main()\n{\n    //%f 用于 float 类型\n    printf(\"\
  Average: %f\\n\", average(4, 1,2,77,4534));\n}\n```\n\n这与上面的最大值示例非常相似，它包含了 `va_start`、`va_arg`\
  \ 和 `va_end`。\n\n## 第 4 章练习\n\n1. 需要什么函数来将字符串复制到合适的变量中？\n2. 结构体可以哪两种嵌套方式？\n3. 关键字\
