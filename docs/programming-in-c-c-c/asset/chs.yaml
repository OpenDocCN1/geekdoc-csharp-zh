  \ |\n| a | 追加模式，如果文件不存在则创建它。对现有文件的任何更改都将追加到末尾。 |\n| r+ | 以读写模式打开文件 |\n| w+ | 以读写模式打开文本文件。如果文件存在，它会首先将其长度截断为零；如果不存在则创建一个新文件\
  \ |\n| a+ | 再次以读写模式打开文件。如果文件不存在则创建一个新文件。读取从最开始开始，但写入只追加到文件的末尾。 |\n\n### 关闭文件\n\n\
