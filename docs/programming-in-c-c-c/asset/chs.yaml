  \n# 第 5 章\n\n## 高级特性\n\n## 头文件\n\n头文件是函数、变量和宏定义的列表，可以在不同的文件中包含并使用。头文件通过 `.h` 文件扩展名指定。它们通过使用\
  \ `#include`（预处理器指令）和文件名（如 `header.h`）被包含在其他文件中。有程序员可以创建的自定义头文件，也有编译器自带的内置头文件，就像我们在上一节中看到的\
  \ `stdio.h`。\n\n要创建一个头文件，你只需要创建一个扩展名为 `.h` 的文件，这可以在记事本等简单的工具中完成，该头文件现在可以包含另一个文件中，以链接并使用该头文件的功能。\n\
  \n下面是一个示例：\n\n```c\nheader.h\nint x = 10;\n\nint Function()\n{\n    return x;\n\
  }\n```\n\n可以这样包含并使用：\n\n```c\n#include <stdio.h>\n#include \"header.h\"\n\nint main()\n\
  {\n    printf(\"%d\", Function());\n}\n```\n\n输出\n\n>10\n\n这允许程序员创建可以在项目之间复用的模块。\n\
  \n头文件的一种可能用途如下：\n\n```c\nint add(int num1, int num2)\n{\n    return num1 + num2;\n\
  }\n\nint sub(int num1, int num2)\n{\n    return num1 - num2;\n}\n\nint div(int num1,\
  \ int num2)\n{\n    return num1 / num2;\n}\n\nint mul(int num1, int num2)\n{\n \
  \   return num1 * num2;\n}\n```\n\n再次回到了计算器示例，头文件可以是像这样的函数列表，然后可以被包含以允许使用这些函数。\n\
  \n## 预处理器指令\n\n预处理用于给编译器提供一种命令，你已经遇到过几次命令，比如 `#include` 指令，它告诉编译器包含特定的头文件。\n\n下面是处理器指令列表，我们将介绍它们是如何运作的：\n\
  \n| 指令 |or |\n| :--- | :--- |\n| `#define` | 用于定义宏 |\n| `#include` | 从另一个文件中插入特定的头文件。\
  \ |\n| `#undef` | 移除 `#define` 的作用 |\n| `#ifdef` | 如果此宏已定义则返回真。 |\n| `#ifndef` |\
  \ 如果此宏未定义则返回真。 |\n| `#if` | 测试编译时条件是否为真。 |\n| `#else` | `#if` 的备选。 |\n| `#elif`\
  \ | 一个语句中的 `#else` 和 `#if`。 |\n| `#endif` | 结束预处理器条件判断。 |\n\n### #define 和 #undef\n\
  \n这些命令用于在全局全局值时增加可读性，例如：\n\n```c\n#define LOOP_NUMBER 2;\n```\n\n可以这样定义和使用：\n\n\
  ```c\nfor (int i = 0; i < LOOP_NUMBER; i++)\n{\n    // 循环代码\n}\n```\n\nfor 循环将执行两次，但你不能像操作普通变量那样改变它的值，在程序的整个生命周期内它是常量，除非使用\
  \ `#undef`，那会取消设置的值。\n\n`#undef` 通常用于覆盖内置指令，在那种情况下你会取消一个值然后设置一个你选择的值。\n\n### #ifdef\
  \ 和 #if\n\n`#ifdef` 和 `#ifndef` 在宏已定义时分别返回真或假，它们最常见的用途是检查 `-DDEBUG` 标志是否已定义。\n\n\
  ```c\n#include <stdio.h>\n\n#ifdef DEBUG\n    printf(\"Debug mode on\");\n#endif\n\
  ```\n\n\n\n这可以通过隐式或显式的方式完成。隐式是指编译器自动转换变量，而显式是指你使用类型转换运算符。然而，在任何必要的地方指定类型转换是一个非常好的习惯。\n\
  \n## 内存管理\n\nC 语言允许程序员动态管理内存。此功能通过以下内容提供：\n\n```c\n#include <stdlib.h>\n```\n\n\
  内存管理需要使用几个函数：\n\n* `void *calloc(int num, int size);`\n    * 该函数分配一个数组（大小由 `num`\
  \ 指定），且每个分配单元的大小由 `size` 指定。\n* `void free(void *address);`\n    * 该函数释放内存，其位置由\
  \ `address` 指定。\n* `void *malloc(int num);`\n    * 该函数的工作原理与 `calloc` 相似，但留下的位置未经过初始化。\n\
  * `void *realloc(void *address, int newsize)`\n    * 该函数将内存重新分配为 `newsize` 中指定的大小。\n\
  \n下面是一个使用 `malloc` 或 `calloc` 为字符串分配内存的示例：\n\n```c\n#include <stdio.h>\n#include\
  \ <stdlib.h>\n\n#define WORD_SIZE 20\n\nint main()\n{\n    char* word;\n    // 分配内存\n\
  \    word = malloc(WORD_SIZE * sizeof(char));\n    //或\n    word = calloc(WORD_SIZE,\
  \ sizeof(char));\n    // 拷贝值\n    strcpy(word, \"Hello nice to meet you!\");\n \
  \   // 打印\n    printf(\"The string is: \\\"%s\\\"\", word);\n    // 删除内存\n    free(word);\n\
  }\n```\n\n这可以用于执行相当复杂的操作，例如获取用户输入并将其存储在与字符串大小完全匹配的数组中：\n\n```c\n#include <stdio.h>\n\
  #include <stdlib.h>\n\n#define WORD_SIZE 20\n\nchar* getInput()\n{\n    //将被删除\n\
  \    char temp[50];\n    // 用户输入\n    printf(\"Please enter your first name: \"\
  );\n    scanf(\"%s\", temp);\n    puts(\"\");\n\n    //strlen() 查找字符串的长度\n    int\
  \ len = strlen(temp);\n    // 内存动态分配\n    char* perfectSizeWord;\n    // 分配内存！\n\
  \    perfectSizeWord = calloc(len, sizeof(char));\n\n    // 这条命令不起作用，它获取了 temp 的内存位置并直接拷贝，所以当\n\
  \    // 该函数超出范围时，perfectSizeWord 也会随之销\n    ///perfectSizeWord = temp\n    // 正确拷贝值\n\
  \    for (int i = 0; i < len; i++)\n    {\n        perfectSizeWord[i] = temp[i];\n\
  \    }\n    // 大小比较\n    printf(\"Size of temp var:%d\\n\", sizeof(temp));\n   \
  \ printf(\"Size of new perfect var:%d\\n\", sizeof(perfectSizeWord));\n    return\
  \ perfectSizeWord;\n}\n\nint main()\n{\n    // 获取返回变量\n    char* word = getInput();\n\
  \    // 打印\n    printf(\"The word is:%s\\n\", word);\n    // 删除内存\n    free(word);\n\
  }\n```\n\n上面的程序很大，请花些时间仔细阅读。尝试实现它并理解它的工作原理。\n\n### 练习\n\n使用上述错误处理技术来处理使用 `malloc`\
  \ 或 `calloc` 分配内存时的错误。为了模拟错误，只需在动态内存分配后设置 `word = NULL;`。\n\n使用下面的程序框架来帮助：\n\n```c\n\
  #include <stdio.h>\n#include <errno.h>\n\nint main()\n{\n    char* word;\n    //\
  \ 分配内存\n    word = malloc(20 * sizeof(char));\n    // 模拟错误\n    word = NULL;\n \
  \   //------------------在此处输入错误代码------------------------\n    // 删除内存\n    free(word);\n\
  }\n```\n\n### 答案\n\n非常简单，只需要包含：\n\n```c\n#include <stdio.h>\n#include <errno.h>\n\
  \nint main()\n{\n    char* word;\n    // 分配内存\n    word = malloc(20 * sizeof(char));\n\
  \    // 模拟错误\n    word = NULL;\n    if (word == NULL)\n    {\n        fprintf(stderr,\
  \ \"Error: Unable to allocate the memory!\");\n    }\n    // 删除内存\n    free(word);\n\
  }\n```\n\n## 第 5 章练习\n\n1. 如何告诉编译器使用其他文件和库？\n2. 头文件使用什么文件扩展名？\n3. `#define` 是用来用的？\n\
  4. 错误处理需要包含什么 `#include`？\n5. 全局变量 `errno` 中包含什么？\n6. `strerror()` 返回什么？\n7. 打印错误需要哪种文件流？\n\
  8. 类型转换；它是用来做什么的？\n9. `calloc` 和 `malloc` 有什么区别？\n10. 遇到错误的函数通常会返回什么？\n\n## 第 2\
  \ 章答案\n\n1. 浮点型 (Float) 或双精度型 (Double)\n2. 真 (1) 和 假 (0)\n3. 用于检查条件为真为假的语句\n4. 声明、条件和迭代。\n\
  5. 跳过完整迭代\n6. 是的，并且通过使用 `void`\n7. 理论上无限的\n8. `Printf` 使用格式化 ID，`puts` 不使用 ID 并自动在字符串末尾添加\
  \ `\\n`\n9. `calloc` 分配内存时会初始化，`malloc` 不会\n10. 整数值\n\n## 第 3 章答案\n\n1. 特定类型的内存位置\n\
  2. 解引用运算符 `*`\n3. 写入到下一个位置\n4. 仅一次\n5. 访问更快\n6. `fprintf()` 和 `puts()`\n9. 大小与其最大的变量相同\n\
  7. 传递给函数的变量\n8. 参数列表末尾的省略号\n9. 用点符号 `.` 定义的成员运算符\n10. `size_t` 大小\n\n## 第 4 章答案\n\
  \n1. 需要 `strcpy()`。\n2. 内部定义和外部定义。\n3. 用于赋予变量和自定义名称。\n4. 枚举类型。\n5. `unions` 一次只能持有一个值。\n\
  6. `union` 的大小与其最大的变量相同。\n7. 传递给函数的列表。\n8. 如果指针不是 `NULL`。\n9. 用于访问原始内存。\n10. 相同类型的数组\n\
  \n## 第 5 章答案\n\n1. 使用 `#include` 指令\n2. 头文件使用 “.h”\n3. `#define` 用于创建常量值的全局定义\n\
  4. `#include <errno.h>`\n5. 存储在那里的最后一个错误代码\n6. `errno` 中错误代码的内容表示\n7. 文件流是 “stderr”\n\
  8. 用于将一个变量转换为另一种\n9. `calloc` 分配内存时会初始化，`malloc` 不会\n10. `NULL` 或 -1\n\n# C 语言编程初学者一步步指南\n\
