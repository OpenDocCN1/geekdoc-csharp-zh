    # 第 5 章：使用图片、轮播和按钮


    Microsoft Bot Framework 允许向用户发送多媒体。本节将介绍如何使用图片、轮播和按钮。


    根据使用的通道不同，图片、音频、视频或文件可以显示：


    ![](img/0000.jpeg)


    然而，当你使用[卡片](https://docs.botframework.com/en-us/csharp/builder/sdkreference/attachments.html)
    时，将提供强大的功能。注意：上面的图片显示了 Skype 中的机器人。![](img/0001.jpeg)


    有四种卡片类型：


    | 卡片类型 | 描述 |

    | :--- | :--- |

    | Hero Card | 大图文字 |

    | Thumbnail Card | 小图文字 |

    | Receipt Card | 发票或收据 |

    | Sign-In Card | 用户登录表单 |


    ## Hero Card


    | Title | 卡片标题 |

    | Text | 显示在卡片上的文本 |

    | Subtitle | 标题链接 |

    | Images | 实际上只有一张图片 |

    | Buttons | 一个或多个按钮（在 Skype 中，卡片上只会显示 5 个按钮。如果你有更多按钮，将会创建。） |

    | Tap | 用户点击卡片时触发的操作（这在某些 Skype 客户端中不起，因此对于 Skype，请为 Subtitle 使用超链接。） |


    ![](img/0004.jpeg)


    在本节中，我们将介绍 Hero Card。


    Hero Card 和 Thumbnail Card 的区别仅在于图片的大小。


    每个由以下属性组成：


    ![](img/0005.jpeg)


    为了演示实现 Hero Card，我们将从上一节的代码开始。


    注意：首先，你必须使用管理 NuGet 包将 `Microsoft.Bot.Builder` 更新到最新稳定版本后再继续。


    此外，我们将进行一些小更改，例如将猜数字范围从 1 到 10 改为 1 到 5，以便在 Skype 中显示效果良好，因为 Skype 在单个卡片上只显示 5
    个按钮。


    在 Visual Studio 中打开项目。


    ![image](img/0006.jpeg)


    创建一个新文件夹并命名为 `Images`。


    将 `NumberGuesserOpeningCard.png` 文件（你可以从 AiHelpWebsite.com 的[下载页面](http://aihelpwebsite.com/Downloads)
    获取代码）添加到 `Images` 文件夹中。

