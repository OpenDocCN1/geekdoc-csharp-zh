    You can create bots that interact with your users naturally wherever they are,
    including Facebook, text, Skype, Office 365 email, and other popular services.


    ![image](images/00004.jpeg)


    The Microsoft Bot Framework contains the following components:


    *   `Bot Framework Developer Portal` – A service that connects your Bot to communication
    channels such as Facebook, Skype, and email.

    *   `Bot Builder SDK` – A C# and Node.js library that provides a powerful framework
    for constructing bots that can handle freeform and guided interactions.

    *   `Bot Directory` – A directory of Bots that you can connect to.


    The `Bot Framework Developer Portal` helps you connect your Bot to communication
    channels. You can write a Bot and expose the Microsoft Bot Framework-compatible
    API on the Internet. The `Bot Framework Developer Portal` will forward messages
    to users, and will send the user messages back to your Bot.


    The `Bot Builder SDK` is an open source SDK hosted on GitHub (`https://github.com/Microsoft/BotBuilder-Samples`)
    that provides everything you need to build dialogs. Bot developers at Microsoft
    created this library to encapsulate functionality required for conversational
    bots.


    The `Bot Directory` (located at `https://bots.botframework.com/`) features Bots
    that you can communicate with channels exposed through the Bot Connector.


