  raw: 'Run the application and enter some sample data.


    ![image](images/00311.jpeg)


    When you select the Application Insights menu in Visual Studio and select Explore
    Telemetry Trends…


    ![](images/00312.jpeg)


    …you can then select Inspect your custom events.


    ![image](images/00313.jpeg)


    Click the Analyze Telemetry button to process the latest data. You will see where
    the Properties and Metrics have been tracked.


    Note: It will take a few minutes for your custom events to show.


    You can double-click on a trend to drill into the data.


    ![image](images/00314.jpeg)


    This will take you to the search screen where you can filter further and view
    the details of each individual event.


    ## Application Insights Portal


    ![image](images/00315.jpeg)


    You can access the Application Insights Portal on the Microsoft Azure site by
    selecting it from the menu in Visual Studio.


    ![image](images/00316.jpeg)


    It is there you can see and change your Pricing tier.


    You can also obtain your Instrumentation Key.


    ## Monitoring A Published Application


    ![image](images/00317.jpeg)


    You can monitor your published Bot.


    Publish your Bot. (See Chapter 2 for directions on this.) After your Bot is published
    on the https://dev.botframework.com/ site, select My bots.


    ![](images/00318.jpeg)


    Edit the Bot configuration.


    ![](images/00319.jpeg)


    Enter the Instrumentation Key (from the Microsoft Azure site) and click Save changes.


    This will enable additional properties and metrics to track.


    ![image](images/00320.jpeg)


    Return to the Application Insights resource on the Microsoft Azure site.


    You can now monitor your published application and create custom charts using
    default tracking data and your custom properties and metrics.


    # Chapter 10: Creating a Skype Bot


    The sample code for this chapter can be obtained at the link “Creating a Skype
    Bot Using The Microsoft Bot Framework” at http://AiHelpWebsite.com/Downloads


    ![](images/00321.jpeg)


    You can easily create a Skype Bot and deploy it to Skype.


    ![](images/00282.jpeg)


    To demonstrate this, we will start with the Bot created in Chapter Six.


    Note: If you have not previously deployed your Bot, skip down to the section labeled
    “Register Skype”.


    ## Publishing The Bot


    ![image](images/00322.jpeg)


    The first step is to connect the AiNumberGuesserBot to the Microsoft Bot Framework
    Developer Portal.


    To do this, we need to publish it in a publically accessible location. This can
    be any server; however, publishing to Azure is recommended because publishing
    to it has built-in support in Visual Studio.


    ![image](images/00323.jpeg)


    First, go to https://azure.microsoft.com and create an account and a subscription
    (if you don’t already have one).


    ![image](images/00324.jpeg)


    Next, open the AiNumberGuesserBot project in Visual Studio and right-click on
    the Project node (not the Solution node), and select Publish.


    ![image](images/00325.jpeg)


    Select Microsoft Azure App Service.


    ![image](images/00326.jpeg)


    Sign into your Azure account and then click the New button.


    ![image](images/00327.jpeg)


    Ensure the type is Web App.


    Enter a unique Web App name, select your subscription, select or create a service
    plan and resource group and click the Create button.


    ![image](images/00328.jpeg)


    After the web app has been created, click the Publish button.


    ![image](images/00329.jpeg)


    The web app will open in the web browser.


    Note the web address as you will need it in a later step.


    ## Registering The Bot With The Bot Connector


    ![image](images/00330.jpeg)


    Go to the Microsoft Bot Framework portal at http://dev.botframework.com and sign
    in with your [Microsoft Account](https://www.microsoft.com/en-us/account).


    ![image](images/00331.jpeg)


    Select Register a bot.


    ![image](images/00332.jpeg)


    Fill in all of the fields.


    ![image](images/00333.jpeg)


    Note: The end point web address is what you saw when the web browser opened in
    the previous step.


    However, you have to add /api/messages  to the end of the address and use https://
    rather than http://.


    ![image](images/00334.jpeg)


    At one point in the form, you will see a link you will click to go to


    https://apps.dev.microsoft.com


    It is there that you will get an Application ID and a password.


    ![image](images/00335.jpeg)


    Make a note of them because you will need to use them to update the web.config
    file in the Visual Studio project later.


    ![image](images/00336.jpeg)


    Click the Register button.


    ![image](images/00337.jpeg)


    The Bot registration will be created.


    When you return to the http://dev.botframework.com page, you will see the Microsoft
    App ID from the https://apps.dev.microsoft.com site has been entered into your
    Bot’s configuration.


    ![image](images/00338.jpeg)


    Copy the Bot ID (Bot handle) and MicrosoftAppId and MicrosoftAppPassword from
    http://dev.botframework.com and [https://apps.dev.microsoft.com](https://apps.dev.microsoft.com/)
    to the web.config of the Bot in Visual Studio.


    Note: If you forgot to note the MicrosoftAppPassword in the earlier step, you
    can click the Generate New Password button at [https://apps.dev.microsoft.com](https://apps.dev.microsoft.com/)
    to create another one.


    ![image](images/00339.jpeg)


    In Visual Studio, Publish the Bot again.


    You are doing this because the Bot Connector will pass the Bot ID and MicrosoftAppId
    and MicrosoftAppPassword when it communicates with it.


    ![image](images/00340.jpeg)


    Return to the Bot configuration page at http://dev.botframework.com.


    You can now click the Test button on that page to test the connection to your
    Bot.


    ![image](images/00341.jpeg)


    You can now [configure channels](http://docs.botframework.com/connector/getstarted/#configuring-channels)
    to your Bot.


    When you have configured channels, if you desire, you can click the Publish button
    to submit your bot to the Bot Directory.


    Even if you do not publish it to the Bot Directory, you can still call it from
    your own applications and through any channels you configure.


    ## Configure Skype


    ![image](images/00342.jpeg)


    To add the Bot to Skype, click the Add to Skype button on the Bot configuration
    page at http://dev.botframework.com.


    ![](images/00343.jpeg)


    You will be directed to a Skype configuration page for the Bot.


    Click the button to Add to Contacts.


    ![image](images/00344.jpeg)


    Click Allow in the popup box.


    ![image](images/00345.jpeg)


    Skype will open, and you can select the Bot from your contacts and converse with
    it.


    # Chapter 11: Creating A Facebook Messenger Bot


    The sample code for this chapter can be obtained at the link “Creating A Facebook
    Bot Using Microsoft Bot Framework” at http://AiHelpWebsite.com/Downloads


    ![image](images/00346.jpeg)


    You can easily create a Bot and deploy it on Facebook.


    ![image](images/00002.jpeg)


    To demonstrate this, we will start with the Bot created in Chapter Two.


    ## Set-Up Facebook


    ![image](images/00347.jpeg)


    The first step is to log into your Facebook.com account (or create one).


    ![image](images/00348.jpeg)


    Select Create Page.


    ![image](images/00349.jpeg)


    Select a template, fill in the required information, and click Get Started.


    ![image](images/00350.jpeg)


    To get the Facebook Page ID, which you will need later, click on the About tab.


    ![image](images/00351.jpeg)


    Locate the Facebook Page ID.


    ## Create A Facebook Developer Account


    ![image](images/00352.jpeg)


    Go to https://developers.facebook.com/docs/apps/register and click the button
    to create a Facebook  Developer Account.


    ![image](images/00353.jpeg)


    Click the slider to Yes to accept the policies and click Register.


    ## Create A Facebook App


    ![image](images/00354.jpeg)


    Next, go to https://developers.facebook.com/ and log in again if needed.


    ![image](images/00355.jpeg)


    Select Add a New App.


    ![image](images/00356.jpeg)


    Select basic setup.


    ![image](images/00357.jpeg)


    Fill in the information and click Create App ID.


    ![image](images/00358.jpeg)


    Make a note of the App ID as you will need it in a later step.'
