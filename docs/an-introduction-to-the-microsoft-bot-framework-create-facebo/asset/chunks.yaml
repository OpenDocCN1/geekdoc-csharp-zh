    In the Server Explorer in Visual Studio, right-click on the database and select
    `Open in SQL Server Object Explorer`.


    Note: If you don’t have this option, install the latest SQL Server Data Tools
    (SSDT) from `https://msdn.microsoft.com/library/mt204009.aspx`.


    ![image](images/00202.jpeg)


    This will open the SQL Server Object Explorer.


    Right-click on the `Tables` node under the database and select `Add New Table`.


    ![](images/00203.jpeg)


    Use the following script to create the required table and click the `Update` button:


    ![](images/00204.gif)


    ![image](images/00205.jpeg)


    When the `Preview Database Updates` box shows, click `Update Database`.


    Note: You can also use the [Cloud Explorer for Visual Studio 2015 extension](https://visualstudiogallery.msdn.microsoft.com/84e83a7c-9606-4f9f-83dd-0f6182f13add)
    to manage your Azure databases inside Visual Studio.


    # Chapter 7: Implementing Language Understanding Intelligent Service (LUIS)


    The sample code for this chapter can be obtained at the link “Implementing Language
    Understanding Intelligent Service (LUIS) In Microsoft Bot Framework” at `http://AiHelpWebsite.com/Downloads`.


    ![](images/00206.jpeg)


    Using Language Understanding Intelligent Service (LUIS) in your Microsoft Bot
    Framework application allows you to create chat bots that are easier for your
    end-users to interact with.


    ![image](images/00207.jpeg)


    For this example, we will start with the code created in the previous chapter.


    This chapter covers how to create a number guessing game and storing and displaying
    the high scores. In the previous chapter, the user is required to type in the
    exact words `High Scores`, and they could only see the high scores for the past
    day.


    ![image](images/00208.jpeg)


    In this chapter, we will alter the code to allow the user to see the high scores
    for the past week, the past month, or the past days they specify (up to 30 days).


    Most importantly, we will allow the user to type their request using normal language
    and then detect the intent of the user and the important related entities (such
    as the number of days).


    We will do this by creating an application using the Language Understanding Intelligent
    Service (LUIS) and then interfacing that application with our existing Bot.


    ## Create The LUIS Application


    ![image](images/00209.jpeg)


    The first step is to go to `https://www.luis.ai/` and create an account on the
    Language Understanding Intelligent Service (LUIS) site and log in.


    ![image](images/00210.jpeg)


    Create a New Application.


    ![image14](images/00211.jpeg)


    We will call it `HighScores`, and after filling out the other fields, we click
    `Add App`.


    ![image](images/00212.jpeg)


    Now we need to create `Entities`. These are elements we will need to identify
    and gather, so our Bot can perform operations based on their value. In our example,
    we want to create two Entities:


    *   `PeriodOfTime` – Detect if the user entered a word describing the amount of
    days (but not the actual days), for example, `week` or `month`.

    *   `Days` – Detect if the user entered the actual days such as `3` or `three`.


    ![image](images/00213.jpeg)


    Click the plus button next to the `Entities` label (on the left-hand side of the
    editor) to open a box that will allow you to add each Entity (one at a time).


    ![image](images/00214.jpeg)


    When you’re done, the Entities will be displayed.


    ![image](images/00215.jpeg)


    Next, we will add an `Intent`.


    Note: The “None” Intent, to be triggered when an utterance by the user does not
    match a programmed intent, will be automatically created)


    Click the plus button next to the `Intents` label.


    ![image](images/00216.jpeg)


    Enter `HighScores` for the Intent name.


    Enter `Show me the high scores for the past week` for an example of a command
    that triggers this intent. (This is also known as a sample utterance.)


    Click `Save`.


    ![image](images/00217.jpeg)


    The utterance will now display in the `New utterances` tab.


    We want this utterance to trigger the `HighScores` Intent, so select it from the
    dropdown.


    ![image](images/00218.jpeg)


    We also want to detect the associated Entity.


    Click on the word `week`, it will then be highlighted, and a popup box will appear.


    Select `PeriodOfTime`.


    ![image](images/00219.jpeg)


    Finally, click `Submit`.


    ![image](images/00220.jpeg)


    Continue to enter and label additional utterances.


    Note: Remember to label any Entities that indicate a number as `Days`.


    ![image](images/00221.jpeg)


    Continue to train the service.


    You will notice that eventually it will start detecting the Entities on its own.


    However, many times you will still have to correct it.


    Enter and correct at least ten different utterances.


    ![image](images/00222.jpeg)


    Click the `Train` button in the bottom left-hand corner of the interface to train
    the model.


    ![image](images/00223.jpeg)


    Next, click the `Publish` button.


    ![image](images/00224.jpeg)


    Finally, click the `Publish` button.


    ![image](images/00225.jpeg)


    The published end-point will be displayed. Make note of the `App ID` and `Subscription
    Key`. You will need these later to be used in the Bot.


    Note: For a production application, you will obtain your [subscription key](https://azure.microsoft.com/en-us/cognitive-services/language-understanding-service/)
    from Azure. This is how the code knows what LUIS application to connect to.


    Note: Starting in 2016, `App ID` will no longer be used. We will only use `Subscription
    Key` to connect to LUIS application.


    ## Update The Bot Application


    ![image](images/00226.jpeg)


    Open the project from the previous chapter in Visual Studio.


    Add a new file called `LUISDialog.cs`, using the following code:


    ```csharp

