    # Dialog Prompts


    A `PromptDialog` is essentially a `Dialog` factory for creating simple prompts.
    It allows you to ask the User for a response and indicate what code will run when
    the response is given. A `PromptDialog` spawns a sub-dialog that has its own private
    state. This sub-dialog is suspended by the Microsoft Bot Framework service while
    it waits for a response. When it gets a response, it resumes at the point in the
    code it was at when it was suspended.


    This is the primary means of controlling program flow within a `Dialog` class.


    A `PromptDialog` can be one of the following types:


    * Prompt for an attachment

    * Prompt for one of a set of choices

    * Ask a yes/no question

    * Prompt for a long

    * Prompt for a double

    * Prompt for a string


    We will enhance our application to implement a `PromptDialog` that asks a yes/no
    question.


    First, add the following code to the `MessageReceivedAsync` method:


    ![](images/00093.gif)


    This code will simply keep looping and counting the guessing attempts if the user
    does not guess the random number.


    If the user does guess the number, the code in the `else` block will be called.


    Right now, the code is not complete. We need to add a `PromptDialog` under the
    line `// Put PromptDialog here`.


    ![image](images/00094.jpeg)


    Type `PromptDialog` and press the period (`.`) key. The autocomplete options will
    show and we will see the option to implement the various types of `PromptDialogs`.


    Choose the `Confirm` option.


    ![image](images/00095.jpeg)


    We can look in the official documentation at https://docs.botframework.com/en-us/csharp/builder/sdkreference/
    and see the method signature requires us to pass the current context, indicate
    the method to be called when we get a response (resume handler), provide a message
    to show the user (`prompt`), and provide a message to display if the response
    type is not correct (`retry`). The other parameters are optional.


    The following shows the complete code for our implementation:


    ![](images/00096.gif)


    We now need to implement the resume handler method to handle the response (`PlayAgainAsync`).


    ![image](images/00097.jpeg)


    To implement it, hover the mouse over `PlayAgainAsync`, wait a few seconds, and
    the interface option window will appear.


    Click the black arrow next to the light bulb and select Generate method `NumberGuesserDialog.PlayAgainAsync`.


    ![image](images/00098.jpeg)


    The method will be created.


    ![image](images/00099.jpeg)


    Add `async` to the method signature.


    Alter the method, so the complete code is as follows:


    ![](images/00100.jpeg)


    Hit `F5` to run the program and connect to it, using the Bot Framework Emulator…


    ![image](images/00101.jpeg)


    When we guess the correct number, the `PromptDialog` will appear. When we provide
