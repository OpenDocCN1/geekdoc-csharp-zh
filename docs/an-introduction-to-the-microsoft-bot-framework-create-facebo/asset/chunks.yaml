    \ and metrics to track.\n\n![image](images/00320.jpeg)\n\nReturn to the Application\
    \ Insights resource on the Microsoft Azure site.\n\nYou can now monitor your published\
    \ application and create custom charts using default tracking data and your custom\
    \ properties and metrics.\n\n# Chapter 10: Creating a Skype Bot\n\nThe sample\
    \ code for this chapter can be obtained at the link “Creating a Skype Bot Using\
    \ The Microsoft Bot Framework” at `http://AiHelpWebsite.com/Downloads`\n\n![image](images/00321.jpeg)\n\
    \nYou can easily create a Skype Bot and deploy it to Skype.\n\n![image](images/00282.jpeg)\n\
    \nTo demonstrate this, we will start with the Bot created in Chapter Six.\n\n\
    Note: If you have not previously deployed your Bot, skip down to the section labeled\
    \ “Register Skype”.\n\n## Publishing The Bot\n\n![image](images/00322.jpeg)\n\n\
    The first step is to connect the `AiNumberGuesserBot` to the Microsoft Bot Framework\
    \ Developer Portal.\n\nTo do this, we need to publish it in a publically accessible\
    \ location. This can be any server; however, publishing to Azure is recommended\
    \ because publishing to it has built-in support in Visual Studio.\n\n![image](images/00323.jpeg)\n\
    \nFirst, go to `https://azure.microsoft.com` and create an account and a subscription\
    \ (if you don’t already have one).\n\n![image](images/00324.jpeg)\n\nNext, open\
    \ the `AiNumberGuesserBot` project in Visual Studio and right-click on the `Project`\
    \ node (not the `Solution` node), and select `Publish`.\n\n![image](images/00325.jpeg)\n\
    \nSelect `Microsoft Azure App Service`.\n\n![image](images/00326.jpeg)\n\nSign\
    \ into your Azure account and then click the `New` button.\n\n![image](images/00327.jpeg)\n\
    \nEnsure the type is `Web App`.\n\nEnter a unique `Web App` name, select your\
    \ subscription, select or create a service plan and resource group and click the\
    \ `Create` button.\n\n![image](images/00328.jpeg)\n\nAfter the web app has been\
    \ created, click the `Publish` button.\n\n![image](images/00329.jpeg)\n\nThe web\
    \ app will open in the web browser.\n\nNote the web address as you will need it\
    \ in a later step.\n\n## Registering The Bot With The Bot Connector\n\n![image](images/00330.jpeg)\n\
    \nGo to the Microsoft Bot Framework portal at `http://dev.botframework.com` and\
    \ sign in with your [Microsoft Account](https://www.microsoft.com/en-us/account).\n\
    \n![image](images/00331.jpeg)\n\nSelect `Register a bot`.\n\n![image](images/00332.jpeg)\n\
    \nFill in all of the fields.\n\n![image](images/00333.jpeg)\n\nNote: The end point\
    \ web address is what you saw when the web browser opened in the previous step.\n\
    \nHowever, you have to add `/api/messages` to the end of the address and use `https://`\
    \ rather than `http://`.\n\n![image](images/00334.jpeg)\n\nAt one point in the\
    \ form, you will see a link you will click to go to\n\n`https://apps.dev.microsoft.com`\n\
    \nIt is there that you will get an `Application ID` and a `password`.\n\n![image](images/00335.jpeg)\n\
    \nMake a note of them because you will need to use them to update the `web.config`\
    \ file in the Visual Studio project later.\n\n![image](images/00336.jpeg)\n\n\
    Click the `Register` button.\n\n![image](images/00337.jpeg)\n\nThe Bot registration\
    \ will be created.\n\nWhen you return to the `http://dev.botframework.com` page,\
    \ you will see the Microsoft App ID from the `https://apps.dev.microsoft.com`\
    \ site has been entered into your Bot’s configuration.\n\n![image](images/00338.jpeg)\n\
    \nCopy the Microsoft App ID from the `https://apps.dev.microsoft.com` site has\
