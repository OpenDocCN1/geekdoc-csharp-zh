  trans: "\n运行应用程序并输入一些示例数据。\n\n![image](img/00311.jpeg)\n\n在 Visual Studio 中选择 `Application\
    \ Insights` 菜单并选择 `Explore Telemetry Trends…`\n\n![](img/00312.jpeg)\n\n…你就可以选择\
    \ `Inspect your custom events`。\n\n![image](img/00313.jpeg)\n\n点击 `Analyze Telemetry`\
    \ 按钮处理最新数据。你将看到 `Properties` 和 `Metrics` 在何处被跟踪。\n\n注意：你的自定义事件需要几分钟才会显示。\n\n你可以双击某个趋势以钻取数据。\n\
    \n![image](img/00314.jpeg)\n\n这将带你进入搜索界面，你可以在那里进行进一步的过滤并查看每个单独事件的详情。\n\n## Application\
    \ Insights 门户\n\n![image](img/00315.jpeg)\n\n你可以通过从 Visual Studio 菜单中选择来访问 Microsoft\
    \ Azure 网站上的 Application Insights 门户。\n\n![!image](img/00316.jpeg)\n\n你可以在那里查看并更改你的定价层级（Pricing\
    \ tier）。\n\n你还可以获取你的 `Instrumentation Key`。\n\n## 监控已发布的应用程序\n\n![image](img/00317.jpeg)\n\
    \n你可以监控已发布的机器人（Bot）。\n\n发布你的机器人。（方向参见第 2 章。）当你的机器人发布在 `https://dev.botframework.com/`\
    \ 网站后，选择 `My bots`。\n\n![](img/00318.jpeg)\n\n编辑机器人配置。\n\n![image](img/00319.jpeg)\n\
    \n输入 `Instrumentation Key`（来自 Microsoft Azure 网站）并点击 `Save changes`。\n\n这将启用额外的属性和指标以供跟踪。\n\
    \n![image](img/00320.jpeg)\n\n返回 Microsoft Azure 网站上的 Application Insights 资源。\n\
    \n你现在可以监控已发布的应用程序，并使用默认跟踪数据以及你的自定义属性和指标创建自定义图表。\n\n# 第 10 章：创建 Skype 机器人\n\n本章的示例代码可以通过\
    \ `http://AiHelpWebsite.com/Downloads` 处的“Creating a Skype Bot Using The Microsoft\
    \ Bot Framework”链接获取。\n\n![image](img/00321.jpeg)\n\n你可以轻松创建一个 Skype 机器人并将其部署到\
    \ Skype。\n\n![image](img/00282.jpeg)\n\n为了演示这一点，我们将从第 6 章创建的机器人开始。\n\n注意：如果你之前还没有部署机器人，请跳到标记为“Register\
    \ Skype”的章节。\n\n## 发布机器人\n\n![image](img/00322.jpeg)\n\n第一步是将 `AiNumberGuesserBot`\
    \ 连接到 Microsoft Bot Framework 开发者门户。\n\n要做到这一点，我们需要将其发布在公共可访问的位置。这可以是任何服务器；但是，建议发布到\
    \ Azure，因为 Visual Studio 对发布到 Azure 有内置的支持。\n\n![image](img/00323.jpeg)\n\n首先，访问\
    \ `https://azure.microsoft.com` 并创建一个账户和订阅（如果你你还没有的话）。\n\n![image](img/00324.jpeg)\n\
    \n接下来，在 Visual Studio 中打开 `AiNumberGuesserBot` 项目，右键点击 `Project` 节点（不是 `Solution`\
    \ 节点），并选择 `Publish`。\n\n![image](img/00325.jpeg)\n\n选择 `Microsoft Azure App Service`。\n\
    \n![image](img/00326.jpeg)\n\n登录你的 Azure 账户，然后点击 `New` 按钮。\n\n![image](img/00327.jpeg)\n\
    \n确保类型为 `Web App`。\n\n输入唯一的 `Web App` 名称，选择你的订阅，选择或创建服务计划和资源组，并点击 `Create` 按钮。\n\
    \n![image](img/00328.jpeg)\n\n在创建 Web 应用后，点击 `Publish` 按钮。\n\n![image](img/00329.jpeg)\n\
    \nWeb 应用将在浏览器中打开。\n\n记下该地址，因为你将在后的步骤中需要它。\n\n## 在 Bot Connector 中注册机器人 \n\n![image](img/00330.jpeg)\n\
    \n访问 `http://dev.botframework.com`  Microsoft Bot Framework 门户并使用你的 [Microsoft\
    \ Account](https://www.microsoft.com/en-us/account) 登录。\n\n![image](img/00331.jpeg)\n\
    \n选择 `Register a bot`。\n\n![image](img/00332.jpeg)\n\n填写所有字段。\n\n![image](img/00333.jpeg)\n\
    \n注意：端点 web 地址就是你在上一步浏览器打开时看到的地址。\n\n然而，你必须在地址末尾添加 `/api/messages` 并使用 `https://`\
    \ 而不是 `http://`。\n\n![image](img/00334.jpeg)\n\n在表单的某处，你会看到一个链接，点击它可以跳转到\n\n`https://apps.dev.microsoft.com`\n\
    \n你可以在那里获取一个 `Application ID` 和一个 `password`。\n\n![image](img/00335.jpeg)\n\n\
    记下它们，因为你以后将需要它们来更新 Visual Studio 项目中的 `web.config` 文件。\n\n![image](img/00336.jpeg)\n\
    \n点击 `Register` 按钮。\n\n![image](img/00337.jpeg)\n\n将创建机器人注册。\n\n当你返回 `http://dev.botframework.com`\
    \ 时，你会看到机器人注册已创建。\n"
