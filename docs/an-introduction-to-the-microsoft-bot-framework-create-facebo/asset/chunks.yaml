- fmt: "\nUsing [FormFlow](https://docs.botframework.com/en-us/csharp/builder/sdkreference/forms.html)\
    \ with the [Microsoft Bot Framework](https://dev.botframework.com/) allows you\
    \ to quickly create a guided conversation to gather information from a user with\
    \ the least amount of code. While it is less flexible than using Dialogs (Dialogs\
    \ are covered in the next chapter), it can be combined with Dialogs to increase\
    \ its functionality.\n\n## A Walk Through\n\n![](images/00039.jpeg)\n\nWhen a\
    \ user begins a conversation with the Bot, it introduces itself and asks the user’s\
    \ name.\n\n![](images/00040.jpeg)\n\nThe Bot proceeds to ask questions and gather\
    \ the responses.\n\n![](images/00041.jpeg)\n\nA feature of `FormFlow` is that\
    \ the user can type help at any time to obtain assistance with any question or\
    \ the `FormFlow` itself.\n\nAs a developer, you get this functionality without\
    \ the need to write any additional code.\n\n![](images/00042.jpeg)\n\nThe `FormFlow`\
    \ continues until the form is complete.\n\n## Creating The Project\n\n![image](images/00043.jpeg)\n\
    \nOpen Visual Studio.\n\n![image](images/00044.jpeg)\n\nCreate a new Project.\n\
    \n![image](images/00045.jpeg)\n\nSelect the Bot Application template and name\
    \ the project `HelloFormFlowBot`.\n\n![image](images/00046.jpeg)\n\nThe project\
    \ will be created.\n\n![image](images/00047.jpeg)\n\nRight-click on the project.\
    \ Select Add and then New Item.\n\nWe will now create the class that will contain\
    \ the logic for our `FormFlow`.\n\n![image](images/00048.jpeg)\n\nAdd a new C#\
    \ class called `ProfileForm.cs`.\n\nReplace all the code with the following code:\n\
    \n![](images/00049.jpeg)\n\nThis code indicates the fields we will gather with\
    \ our `FormFlow`.\n\nNotice that the class, as well as the `Gender` `enum` that\
    \ it consumes, is marked `[Serializable]`.\n\nThe Microsoft Bot Framework requires\
    \ that the classes must be serializable, so the Bot can be stateless.\n\nSave\
    \ the file.\n\n![image](images/00050.jpeg)\n\nOpen the `MessagesController.cs`\
    \ file.\n\nAdd the following using statements at the top of the file (to support\
    \ the `FormFlow` code):\n\n![](images/00051.gif) \n\nAdd the following `MakeRootDialog`\
    \ method to the `MessagesController` class to call the `BuildForm` method in the\
    \ `ProfileForm` class we created earlier:\n\n![](images/00052.jpeg)\n\nFinally,\
    \ alter the `Post` method in the `MessagesController` class to the following:\n\
    \n![](images/00053.jpeg)\n\nSave the file.\n\n## Test The Application\n\n![image](images/00054.jpeg)\n\
    \nHit F5 to run the application.\n\n![image](images/00055.jpeg)\n\nThe web browser\
    \ will open.\n\nNote the port number and the web address.\n\n![](image](images/00056.jpeg)\n\
    \nOpen and run the Microsoft Bot Framework Emulator.\n\nWhen the emulator starts,\
    \ connect to the Bot by setting the address to the one indicted in the web browser;\
    \ however, add `/api/messages` to the end.\n\n![image](images/00057.jpeg)\n\n\
    Ensure that the Bot URL is connecting to the correct address.\n\n![image](images/00058.jpeg)\n\
    \nType a message and click the send key (or press Enter).\n\n![image](images/00059.jpeg)\n\
    \nYou can now converse with the Bot and fill out the `FormFlow`.\n\n## Saving\
    \ The Data\n\nCurrently the application does not save the responses from the user.\
    \ In fact, after you fill the `FormFlow` out, it will simply ask you to fill it\
    \ out again.\n\nWe can use the [Bot State Service](https://docs.botframework.com/en-us/csharp/builder/sdkreference/stateapi.html)\
    \ to save and retrieve the values.\n\nAlter the `BuildForm` method in the `ProfileForm.cs`\
    \ file to the following to save the values entered into the form:\n\n![](images/00060.gif)\n\
    \nWe are not only storing the values provided by the user, but we are also setting\
    \ a flag (`ProfileComplete`), so we don’t ask the user to fill out the form again.\n\
    \nFinally, alter the `Post` method in the `MessagesController` class to the following:\n\
    \n![](images/00061.jpeg)\n\n![](images/00062.jpeg)\n\nNow the application will\
    \ only ask the user to fill in the form one time and display the values received\
    \ using the Bot State Service.\n\nThe values will be persisted by the Microsoft\
    \ Bot Framework keyed to that user in that conversation.\n\nIn our example, we\
    \ used `PrivateConversationData`, but the Bot State Service exposes the following\
    \ methods, each with a different scope:\n\n| Method | Scoped | Description |\n\
    | :--- | :--- | :--- |\n| `SetUserData()` | User | Remembering context object\
    \ with a user |\n| `SetConversationData()` | Conversation | Remembering context\
    \ object with a conversation |\n| `SetPrivateConversationData()` | User & Conversation\
    \ | Remembering context object with a person in a conversation |\n\n# Chapter\
    \ 4: Using Dialogs\n\nThe sample code for this chapter can be obtained at the\
    \ link “Introduction To Using Dialogs With The Microsoft Bot Framework” at http://AiHelpWebsite.com/Downloads\n\
    \n![image](images/00063.jpeg)\n\nUsing Dialogs with the Microsoft Bot Framework\
    \ allows you to model a conversation with a user. While they are more flexible\
    \ than using a FormFlow (covered in the preceding chapter), Dialogs require more\
    \ code.\n\nA `Dialog` is a class that implements the `IDialog` interface. Dialogs\
    \ can be composed with other dialogs to maximize reuse.\n\nA `Dialog` has a context\
    \ that contains a stack of dialogs active in a conversation and will maintain\
    \ the state of the conversation. A `Dialog` sends messages to a user and is suspended\
    \ when it is waiting for a response from a user.\n\nA `Dialog` uses a state stored\
    \ in its context to resume a conversation. This state is stored in the state service\
    \ provided by the Microsoft Bot Framework service.\n\n## Walk Through\n\n![image](images/00064.jpeg)\n\
    \nThe conversation starts when the User types in a message.\n\nThe Bot responds\
    \ with a greeting and the directions of the game, which is to guess a number from\
    \ 1 to 10 (chosen at random).\n\n![image](images/00065.jpeg)\n\nThe User guesses\
    \ a number, and the Bot informs the User if they are correct or not.\n\n![image](images/00066.jpeg)\n\
    \nWhen the User guesses the number correctly, they are offered a chance to play\
    \ the game again.\n\nIf the User chooses not to play the game again, the Bot tells\
    \ them goodbye.\n\n## Creating The Application\n\n![image](images/00067.jpeg)\n\
    \nOpen Visual Studio.\n\n![image](images/00068.jpeg)\n\nCreate a new Project.\n\
    \n![image](images/00069.jpeg)\n\nSelect the Bot Application template and name\
    \ the project `AiNumberGuesserBot`.\n\n![image](images/00070.jpeg)\n\nThe project\
    \ will be created.\n\n![image](images/00071.jpeg)\n\nRight-click on the project.\
    \ Select Add and then New Item.\n\nWe will now create the class that will contain\
    \ the logic for the Dialog.\n\n![image](images/00072.jpeg)\n\nAdd a new C# class\
    \ called `NumberGuesserDialog.cs`.\n\nReplace all the code with the following\
    \ code:\n\n![](images/00073.gif) \n\nA `Dialog` is a class that inherits from\
    \ `IDialog`.\n\nNote that we must decorate this class as `[Serializable]`.\n\n\
    ![image](images/00074.jpeg)\n\nThis requires you to implement a `StartAsync` method.\n\
    \nTo implement this, hover the mouse over `IDialog<object>`, wait a few seconds,\
    \ and the interface option window will appear.\n\n![image](images/00075.jpeg)\n\
    \nClick the black arrow next to the light bulb and Implement interface.\n\n![image](images/00076.jpeg)\
    \ \n\nThe `StartAsync` method will be created.\n\nThis will be called when the\
    \ Dialog is first instantiated.\n\n![image](images/00077.jpeg)\n\nWe want the\
    \ code to run asynchronously, so add `async` to the method signature.\n\nNow,\
    \ change the code inside the method, so the complete method is coded as follows:\n\
    \n![](images/00078.gif)\n\nThe last line in the method is `context.Wait`. This\
    \ suspends the current `Dialog` until the user has sent a message to the Bot.\n\
    \nThe `Wait` method takes a method as a parameter (in this case `MessageReceivedAsync`)\
    \ to be called to resume the conversation when the response has been received.\n\
    \n![image](images/00079.jpeg)\n\nTo implement it, hover the mouse over `MessageReceivedAsync`,\
    \ wait a few seconds, and the interface option window will appear.\n\nClick the\
    \ black arrow next to the light bulb and select Generate method `NumberGuesserDialog.MessageReceivedAsync`.\n\
    \n![image](images/00080.jpeg)\n\nThe `MessageReceivedAsync` method will be created.\n"
