  trans: "\n然而，如果我们输入任何会触发 `HighScores LUIS Intent` 的内容，我们将收到一个错误，因为尚未实现处理此内容的代码。\n\
    \n![image](img/00240.jpeg)\n\n打开 `LUISDialogClass.cs` 文件找到找到代码：\n\n![](img/00241.gif)\n\
    \n将其替换为：\n\n![](img/00242.jpeg) \n\n此代码将设置用户请求高分时包含的天数。它首先尝试检测是否通过了某段时间（在 `PeriodOfTime`\
    \ 实体中）。如果是的话，代码会将已知的时间段转换为天数。\n\n如果通过了具体的天数（在 `Days` 实体中），代码将尝试将天数转换为数字。如果无法转换，它将假设天数是以单词（而非数字）的形式传递的。如果是如此，它会将该值传递给\
    \ `ParseEnglish` 方法，该方法会将单词转换为数字。\n\n注意：你可以从 `http://stackoverflow.com/questions/11278081/convert-words-string-to-int`\
    \ 获取 `ParseEnglish` 方法。\n\n然后，将天数（以及当前上下文）传递给 `ShowHighScores` 方法。\n\n最后一步，输入以下代码将\
    \ `ShowHighScores` 方法实现到 `LUISDialogClass` 中：\n\n![](img/00243.jpeg)\n\n# 第 8\
    \ 章：使用 Direct Line API 调用 Microsoft Bot Framework\n\n本章的示例代码可以通过 `http://AiHelpWebsite.com/Downloads`\
    \ 处的“使用 Direct Line API 调用 Microsoft Bot Framework”链接获取。\n\n![image](img/00244.jpeg)\n\
    \n你可能需要从自定义应用程序、服务或网站直接调用你的 Microsoft Bot Framework Bot。Microsoft Bot Connector\
    \ Direct Line REST API 允许你执行此操作。此外，它还允许你在应用程序中身份验证用户，并以该用户的身份与 Bot 进行安全通信。\n\n\
    ![image](img/00245.jpeg)\n\nDirect Line API 暴露了一个 REST API，允许你与已注册到 [Microsoft\
    \ Bot Connector Service](https://docs.botframework.com/en-us/csharp/builder/sdkreference/connector.html)\
    \ 的单个 Bot 进行通信。\n\n该 API 旨在供希望从自己的客户端应用程序（如移动应用、服务，甚至是 [HoloLens](https://www.microsoft.com/microsoft-hololens/en-us)）与\
    \ Bot 通信的开发者使用。\n\n![image](img/00246.jpeg)\n\n使用该 API 的步骤是：\n\n1. 在 Bot Framework\
    \ 门户注册你的 Bot\n2. 配置 Direct Line 连接器\n3. 使用从 Bot Framework 门户获取的凭据进行基于 REST 的调用以与\
    \ Bot 通信\n\n   在我们的示例中，我们将使用 `Microsoft.Bot.Connector.DirectLine` Nuget 包来帮助我们调用。\n\
    \n![image](img/00247.jpeg)\n\n注意：输出的渲染将由调用 Direct Line API 的自定义应用程序开发人员负责。\n\n\
    图像、卡片和按钮等媒体需要自定义代码以适用于特定应用程序的方式进行渲染。\n\n![image](img/00248.jpeg)\n\n我们将构建的示例应用程序将创建一个自定义客户端，允许用户创建账户、登录并与上一章中创建的\
    \ Bot 进行安全通信。\n\n## 配置 Direct Line 连接器\n\n![image](img/00249.jpeg)\n\n我们想要为 Bot\
    \ 配置 Direct Line 连接器。\n\n访问 `https://dev.botframework.com/`，登录并选择 My Bots。\n\n\
    打开已部署到 Microsoft Bot Framework 门户的 Bot。\n\n![image](img/00250.jpeg)\n\n第一步是记录你给\
    \ Bot 分配的句柄（handle）。创建 Web 应用程序时将需要它。\n\n![image](img/00251.jpeg)\n\n在 Add another\
    \ channel（添加其他通道）下，点击 Direct Line 旁的 Add 按钮。\n\n![](img/00252.jpeg)\n\n当配置 Direct\
    \ Line 界面界面，点击 Generate Direct Line secret（生成 Direct Line 密钥）按钮。\n\n![](img/00253.jpeg)\n\
    \n复制 Secret 代码。创建 Web 应用程序时将需要它。\n\n点击 I’m done configuring Direct Line（我已完成 Direct\
    \ Line 配置）按钮。\n\n屏幕将关闭。\n\n## 创建 Web 应用程序\n\n![image](img/00254.jpeg)\n\n打开 Visual\
    \ Studio。\n\n![image](img/00255.jpeg)\n\n在 Visual Studio 工具栏中，选择 File（文件）、然后 New（新建）、然后是\
    \ Project（项目）。\n\n![image](img/00256.jpeg)\n\n选择 Web，然后是 ASP.NET Web Application\
    \ (.Net Framework)。\n\nName 输入 `DirectLineBot`。\n\n勾选 Create directory for solution（创建解决方案目录）框。\n\
    \n按 OK。\n\n![image](img/00257.jpeg)\n\n当应用程序配置框出现时，选择 MVC 模板。\n\n确保 Authentication（身份验证）选择了\
    \ Individual User Accounts（个人用户账户）。如果不是，点击 Change Authentication（更改身份验证）进行更改。\n\
    \n按 OK。\n\n![image](img/00258.jpeg)\n\n应用程序将被创建。\n\n我们需要添加 `Microsoft.Bot.Connector.DirectLine`\
    \ NuGet 包以便我们轻松与 DirectLine API 通信。\n\n![image](img/00259.jpeg)\n\n在 Solution\
    \ Explorer（解决方案资源管理器）中，右键点击 `DirectLineBot` 项目节点。\n\n"
