    # Chapter 4: Using Dialogs


    The sample code for this chapter can be obtained at the link “Introduction To
    Using Dialogs With The Microsoft Bot Framework” at http://AiHelpWebsite.com/Downloads


    ![image](images/00063.jpeg)


    Using Dialogs with the Microsoft Bot Framework allows you to model a conversation
    with a user. While they are more flexible than using a FormFlow (covered in the
    preceding chapter), Dialogs require more code.


    A Dialog is a class that implements the IDialog interface. Dialogs can be composed
    with other dialogs to maximize reuse.


    A Dialog has a context that contains a stack of dialogs active in a conversation
    and will maintain the state of the conversation. A Dialog sends messages to a
    user and is suspended when it is waiting for a response from a user.


    A Dialog uses a state stored in its context to resume a conversation. This state
    is stored in the state service provided by the Microsoft Bot Framework service.


    ## Walk Through


    ![image](images/00064.jpeg)


    The conversation starts when the User types in a message.


    The Bot responds with a greeting and the directions of the game, which is to guess
    a number from 1 to 10 (chosen at random).


    ![image](images/00065.jpeg)


    The User guesses a number, and the Bot informs the User if they are correct or
    not.


    ![image](images/00066.jpeg)


    When the User guesses the number correctly, they are offered a chance to play
    the game again.


    If the User chooses not to play the game again, the Bot tells them goodbye.


    ## Creating The Application


    ![image](images/00067.jpeg)


    Open Visual Studio.


    ![image](images/00068.jpeg)


    Create a new Project.


    ![image](images/00069.jpeg)


    Select the Bot Application template and name the project AiNumberGuesserBot.


    ![image](images/00070.jpeg)


    The project will be created.


    ![image](images/00071.jpeg)


    Right-click on the project. Select Add and then New Item.


    We will now create the class that will contain the logic for the Dialog.


    ![image](images/00072.jpeg)


    Add a new C# class called NumberGuesserDialog.cs.


    Replace all the code with the following code:


    ![](images/00073.gif) 


    A Dialog is a class that inherits from IDialog.


    Note that we must decorate this class as [Serializable].


    ![image](images/00074.jpeg)


    This requires you to implement a StartAsync method.


    To implement this, hover the mouse over IDialog<object>, wait a few seconds, and
    the interface option window will appear.


    ![image](images/00075.jpeg)


    Click the black arrow next to the light bulb and select Implement interface.


    ![image](images/00076.jpeg) 


    The StartAsync method will be created.


    This will be called when the Dialog is first instantiated.


    ![image](images/00077.jpeg)


    We want the code to run asynchronously, so add async to the method signature.


    Now, change the code inside the method, so the complete method is coded as follows:


    ![](images/00078.gif)


    The last line in the method is context.Wait. This suspends the current Dialog
    until the user has sent a message to the Bot.


    The Wait method takes a method as a parameter (in this case MessageReceivedAsync)
    to be called to resume the conversation when the response has been received.


    ![image](images/00079.jpeg)


    To implement it, hover the mouse over MessageReceivedAsync, wait a few seconds,
    and the interface option window will appear.


    Click the black arrow next to the light bulb and select Generate method ‘NumberGuesserDialog.MessageReceivedAsync.


    ![image](images/00080.jpeg)


    The MessageReceivedAsync method will be created.'
