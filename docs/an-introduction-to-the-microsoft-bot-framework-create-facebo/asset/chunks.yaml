    ```


    This code will pass text entered into the Bot to the LUIS application.


    We decorate each method with `LuisIntent` decoration, setting the name of the
    Intent (for example, `[LuisIntent("HighScores")]`) to indicate which method should
    be triggered.


    Note: The code is not complete at this point. We will complete the code in later
