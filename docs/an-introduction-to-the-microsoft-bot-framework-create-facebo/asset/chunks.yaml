    ![](images/00242.jpeg) \n\nThis code will set the number of days the user is asking\
    \ the high scores to include. It first tries to detect if a period of time was\
    \ passed (in the PeriodOfTime entity). If it has been, the code converts a known\
    \ period of time to a number of days.\n\nIf a number of days was passed (in the\
    \ Days entity), the code tries to convert the days into a number. If it cannot,\
    \ it assumes the number of days was passed as a word not a number. If this is\
    \ the case, it passes the value to the ParseEnglish method that converts the word\
    \ to a number.\n\nNote: You can get the ParseEnglish method from http://stackoverflow.com/questions/11278081/convert-words-string-to-int\n\
    \nThe number of days (and the current context) is then passed to the ShowHighScores\
    \ method.\n\nAs the final step, enter the following code to implement the ShowHighScores\
    \ method into the LUISDialogClass:\n\n![](images/00243.jpeg)\n\n# Chapter 8: Calling\
    \ The Microsoft Bot Framework Using The Direct Line API\n\nThe sample code for\
    \ this chapter can be obtained at the link “Calling The Microsoft Bot Framework\
    \ Using The Direct Line API” at http://AiHelpWebsite.com/Downloads\n\n![image](images/00244.jpeg)\n\
    \nYou may need to call your Microsoft Bot Framework Bot directly from a custom\
    \ application, a service, or a website. The Microsoft Bot Connector Direct Line\
    \ REST API allows you to do this. In addition, it allows you to authenticate a\
    \ user in your application and securely communicate with the Bot as that user.\n\
    \n![image](images/00245.jpeg)\n\nThe Direct Line API exposes a REST API that allows\
    \ you to communicate with a single Bot that has been registered with the [Microsoft\
    \ Bot Connector Service](https://docs.botframework.com/en-us/csharp/builder/sdkreference/connector.html).\n\
    \nThis API is intended for developers who want to communicate with their Bot from\
    \ their own client applications, such as mobile apps, a service, or even a [HoloLens](https://www.microsoft.com/microsoft-hololens/en-us).\n\
    \n![image](images/00246.jpeg)\n\nThe procedure for working with the API is:\n\n\
    1.  Register your Bot with the Bot Framework Developer Portal\n\n2.  Configure\
    \ the Direct Line Connector\n\n3.  Use the credentials obtained from the Bot Framework\
    \ Developer Portal to make REST based calls to communicate with the Bot\n\n  \
    \  In our example, we will use the Microsoft.Bot.Connector.DirectLine  Nuget package\
    \ to help us make the calls.\n\n![image](images/00247.jpeg)\n\nNote: The rendering\
    \ of the output will be the responsibility of the developer of the custom application\
    \ that is calling the Direct Line API.\n\nMedia such an images, cards, and buttons\
    \ will require custom code to render in a manner that is appropriate for the particular\
    \ application.\n\n![image](images/00248.jpeg)\n\nThe example application we will\
    \ build will create a custom client that will allow a user to create an account,\
    \ sign-in, and securely communicate with the Bot that was created in the previous\
    \ chapter.\n\n## Configuring The Direct Line Connector\n\n![image](images/00249.jpeg)\n\
    \nWe want to configure the Direct Line connector for our Bot.\n\nGo to https://dev.botframework.com/,\
    \ log in, and select My Bots.\n\nOpen a Bot that has been deployed to the Microsoft\
    \ Bot Framework Developer Portal.\n\n![image](images/00250.jpeg)\n\nThe first\
    \ step is to make a note of the Bot handle you gave your Bot. You will need this\
    \ later when you create the Web Application.\n\n![image](images/00251.jpeg)\n\n\
    Under Add another channel, click the Add button next to Direct Line.\n\n![](images/00252.jpeg)\n\
    \nWhen the Configure  Direct Line screen appears, click the Generate  Direct Line\
    \ secret button.\n\n![](images/00253.jpeg)\n\nCopy the Secret code. You will need\
    \ this later when you create the Web Application.\n\nClick I’m done configuring\
    \ Direct Line button.\n\nThe screen will close.\n\n## Create The Web Application\n\
    \n![image](images/00254.jpeg)\n\nOpen Visual Studio.\n\n![image](images/00255.jpeg)\n\
    \nFrom the toolbar in Visual Studio, select File, then New, and then Project.\n\
    \n![image](images/00256.jpeg)\n\nSelect Web and then ASP.NET Web Application (.Net\
    \ Framework).\n\nEnter DirectLineBot for the Name.\n\nSelect the Create directory\
    \ for solution box.\n\nPress OK.\n\n![image](images/00257.jpeg)\n\nWhen the application\
    \ configuration box appears, select the MVC template.\n\nEnsure that Individual\
    \ User Accounts is selected for Authentication. If not, click the Change Authentication\
    \ button and change it.\n\nPress OK.\n\n![image](images/00258.jpeg)\n\nThe application\
    \ will be created.\n\nWe need to add the Microsoft.Bot.Connector.DirectLine  NuGet\
    \  Package that will allow us to easily communicate with the DirectLine API.\n\
    \n![image](images/00259.jpeg)\n\nIn the Solution Explorer, right-click on the\
    \ DirectLineBot project node (not the Solution node), and select Manage NuGet\
    \ Packages.\n\n![image](images/00260.jpeg)\n\nWhen the NuGet Package configuration\
    \ window appears, click the Browse button.\n\nEnter Microsoft.Bot.Connector.DirectLine\
    \ in the search box to conduct the search.\n\nWhen the Microsoft.Bot.Connector.DirectLine\
    \ package shows up, click on it, so its properties appear in the window on the\
    \ right.\n\nClick the Install button to install the package.\n\n![](images/00261.jpeg)\n\
    \nClick OK when the Preview window shows.\n\n![](images/00262.jpeg)\n\nClick the\
    \ I Accept button when the License Acceptance window appears.\n\n![image](images/00263.jpeg)\n\
    \nThe Microsoft.Bot.Connector.DirectLine assembly will be installed.\n\n![image](images/00264.jpeg)\n\
    \nHit F5 to debug and run the application.\n\nThe application will open in the\
    \ web browser.\n\n![image](images/00265.jpeg)\n\nYou will see the default web\
    \ application created by the MVC template.\n\nWe can click the Register button\
    \ to create a new account.\n\nWe can also click the Log in button to log in using\
    \ a registered account.\n\n## Complete The Web Application\n\n![image](images/00266.jpeg)\n\
    \nWe will update the home page to show the chat box and the Bot response only\
    \ if the user has created an account and logged in.\n\nStop debugging the application\
    \ and open the Index.cshtml file in the Views/Home folder.\n\nReplace all of the\
    \ code with the following code:\n\n![](images/00267.gif)\n\n![image](images/00268.jpeg)\n\
    \nOpen the HomeController.cs file in the Controllers folder, and replace all the\
    \ code with the following code:\n\n![](images/00269.jpeg)\n\nAt this point the\
    \ code is not complete; however, it sets up the basic framework.\n\nReplace **\
    \ INSERT YOUR SECRET CODE HERE ** and ** INSERT YOUR BOTID HERE ** with the values\
    \ from you own published Bot.\n\nWhen a logged in user loads the page or submits\
    \ text to the Bot, the TalkToTheBot method is called.\n\nTo implement it, add\
    \ the following method to the HomeController class:\n\n![](images/00270.jpeg)\n\
    \nThe TalkToTheBot method calls the ReadBotMessagesAsync method to read the response\
    \ from the Bot.\n\nTo implement it, add the following method to the HomeController\
    \ class:\n\n![](images/00271.jpeg)\n\nWhen there is an image that is returned\
    \ by the Bot, the ReadBotMessagesAsync method calls the RenderImageHTML method.\n\
    \nTo implement it, add the following method to the HomeController class:\n\n![](images/00272.gif)\n\
    \n## Run The Application\n\n![image](images/00273.jpeg)\n\nHit F5 to run the application.\n\
    \nThe application will open in the web browser. Initially, we are not logged in,\
    \ so we will be unable to communicate with the Bot.\n\n![image](images/00274.jpeg)\n\
    \nClick the Register button to create an account.\n\n![image](images/00275.jpeg)\n\
    \nFill in the required information and click the Register button.\n\n![image](images/00276.jpeg)\n\
    \nAfter you have created an account, you can click the Log in button to log in\
    \ (if you are not already logged in).\n\n![image](images/00277.jpeg)"
