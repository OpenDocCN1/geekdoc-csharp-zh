    # Chapter 9: Using Application Insights To Monitor Your Bot


    The sample code for this chapter can be obtained at the link “Using Application
    Insights With Microsoft Bot Framework” at `http://AiHelpWebsite.com/Downloads`


    ![](images/00281.jpeg)


    With `Application Insights`, you can insert a few lines of code in your Bot to
    find out what your users are doing.


    When you install `Application Insights`, you are installing a small instrumentation
    package in your application. Next, you set up an `Application Insights` resource
    in the Microsoft Azure portal.


    The instrumentation you install monitors your app and sends telemetry data to
    the Microsoft Azure portal. The Microsoft Azure portal shows statistical charts
    and has powerful search tools to help you monitor your application and diagnose
    any problems.


    ![](images/00282.jpeg)


    To demonstrate this, we will start with the Bot created in Chapter Six.


    ![image](images/00283.jpeg)


    This will require using Microsoft Azure. If you do not have a Microsoft Azure
    account, go to `https://azure.microsoft.com` and create an account and a subscription.


    ## Enable Application Insights


    ![image](images/00284.jpeg)


    Open the `AiNumberGuesserBot` project in Visual Studio.


    In the Solution Explorer, right-click on the Project (not the Solution), and select
    `Add Application Insights Telemetry`.


    ![image](images/00285.jpeg)


    First, you will be required to log into your Microsoft Azure Account.


    After doing so, you will be presented with a form to create an `Application Insights`
    resource (by choosing the `New resource` option in the `Send telemetry to` dropdown)
    or connect to an existing `Application Insights` resource (by selecting it in
    the `Send telemetry to` dropdown).


    After selecting the configuration options, click the `Add` button to proceed.


    ![image](images/00286.jpeg)


    `Application Insights` assemblies will be added to the project.


    ![image](images/00287.jpeg)


    If you get an error, most likely you have components that need to be updated.


    ![image](images/00288.jpeg)


    In the Solution Explorer in Visual Studio, right-click on the Project (not the
    Solution), and select `Manage NuGet Packages`.


    ![image](images/00289.jpeg)


    Select `Updates`, select the components that the error message indicates need
    to be updated, and click the `Update` button.


    ![image](images/00290.jpeg)


    When the `Review Changes` box shows, click the `OK` button.


    Next, right-click on the Project and select `Add Application Insights Telemetry`
    again to re-start the process.


    The `Application Insights` components should now install successfully.


    ## Debug The Application


    ![image](images/00291.jpeg)


    Before you try to debug, clear any `MicrosoftAppId` and `MicrosoftAppPassword`
    settings there may be in the `Web.config` file and then save the file.


    This is required, so you can easily debug locally.


    Remember to replace any settings if you need to re-publish the application.


    ![image](images/00292.jpeg)


    Hit `F5` to run the project.


    ![image](images/00293.jpeg)


    The application will open in the web browser.


    Note the web address, as you will need it in the next step.


    ## Using The Bot Emulator


    ![](image](images/00294.jpeg)


    Open and run the Microsoft Bot Framework Emulator.


    When the emulator starts, connect to the Bot by setting the address to the one
    indicted in the web browser; however, add `/api/messages` to the end.


    ![](image](images/00295.jpeg)


    In the Bot Emulator, enter `Hello` in the text box and click the send key (or
    press enter).


    You will see the response in the Chat window and the JSON contents of the response
    in the JSON window.


    ![image](images/00296.jpeg)


    You should see a window pop up that provides links to the telemetry data.


    ![image](images/00297.jpeg)


    You can also access the data by clicking on the links in the `ApplicationInsight.config`
    section in the Solution Explorer of Visual Studio while the application is running.


    ![image](images/00298.jpeg)


    Also, you can right-click on the Project and select `Application Insights` to
    show the menu that will provide all the options.


    ![image](images/00299.jpeg)


    Selecting `Search Live Telemetry` or `Search Debug Session Telemetry` will open
    a window in Visual Studio that will display telemetry data.


    Note: See Learn more about Application Insights tools in Visual Studio at `https://azure.microsoft.com/en-us/documentation/articles/app-insights-visual-studio/`
    for more information on using these windows.


    ![image](images/00300.jpeg)


    For full Telemetry Readiness, ensure all the green dots are checked. If any aren’t,
    click on them.


    ![image](images/00301.jpeg)


    It will stop debugging to add components.


    ![image](images/00302.jpeg)


    You will be able to click a button to add or configure.


    ![image](images/00303.jpeg)


    The components will be added.


    ![image](images/00304.jpeg)


    ## Custom


    One of the most powerful features of Application Insights is being able to use
    it to track your own custom telemetry.


    We will now demonstrate using it to track when a game is started, completed, what
    number needed to guess, and how many attempts required.


    In the `AiNumberGuesserBot` project, open `GuesserDialog.cs` and add the following
    statements:


    ![image](images/00305.jpeg)


    Next, add the following line to class:


    ![image](images/00306.jpeg)


    Finally, add the following lines to `StartAsync` method:


    ![image](images/00307.jpeg)


    This will track a game being started and the number user to guess.


    ![image](images/00308.jpeg)


    Also, add the following code to track game completed:


    ![image](images/00309.jpeg)


    ## Application Insights API


    There are a number of API calls we can use to track custom events as the following
    table illustrates:


    | Method | Used for |

    | :--- | :--- |

    | `TrackPageView` | Pages, screens, blades, or forms |

    | `TrackEvent` | User actions and other events. Used to track user behavior or
    monitor performance. |

    | `TrackMetric` | Performance measurements such as queue lengths not related to
    specific events |

    | `TrackException` | Log exceptions for diagnosis. Trace where they occur in relation
    to other events and examine stack traces. |

    | `TrackRequest` | Log the frequency and duration of server requests for performance
    analysis. |

    | `TrackTrace` | Diagnostic log messages. You can also capture 3rd-party logs
    |

    | `TrackDependency` | Log the duration and frequency of calls to external components
    on which your app depends. |


    You can [attach properties and metrics](https://azure.microsoft.com/en-us/documentation/articles/app-insights-api-custom-events-metrics/#properties)
    to most of these telemetry calls.


    ![image](images/00310.jpeg)

