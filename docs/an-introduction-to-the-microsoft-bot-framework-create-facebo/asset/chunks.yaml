    ## Custom Telemetry


    ![image](images/00305.jpeg)


    One of the most powerful features of Application Insights is being able to use
    it to track your own custom telemetry.


    We will now demonstrate using it to track when a game is started, completed, what
    number a user needed to guess, and how many attempts they required.


    In the AiNumberGuesserBot project, open the NumberGuesserDialog.cs file and add
    the following using statements:


    ![](images/00306.gif)


    Next, add the following line to the class:


    ![](images/00307.gif)


    Finally, add the following lines to the StartAsync method:


    ![](images/00308.gif)


    This will track a game being started and the number the user needs to guess.


    Also, add the following code to track the game completed:


    ![](images/00309.gif)


    There are a number of API calls we can use to track custom events as the following
    table illustrates:


    ## Application Insights API summary


    From: https://azure.microsoft.com/en-us/documentation/articles/app-insights-api-custom-events-metrics/


    | Method | Used for |


    | [TrackPageView](https://azure.microsoft.com/en-us/documentation/articles/app-insights-api-custom-events-metrics/#page-views)
    | Pages, screens, blades, or forms |


    | [TrackEvent](https://azure.microsoft.com/en-us/documentation/articles/app-insights-api-custom-events-metrics/#track-event)
    | User actions and other events. Used to track user behavior or to monitor performance.
    |


    | [TrackMetric](https://azure.microsoft.com/en-us/documentation/articles/app-insights-api-custom-events-metrics/#track-metric)
    | Performance measurements such as queue lengths not related to specific events
    |


    | [TrackException](https://azure.microsoft.com/en-us/documentation/articles/app-insights-api-custom-events-metrics/#track-exception)
    | Log exceptions for diagnosis. Trace where they occur in relation to other events
    and examine stack traces. |


    | [TrackRequest](https://azure.microsoft.com/en-us/documentation/articles/app-insights-api-custom-events-metrics/#track-request)
    | Log the frequency and duration of server requests for performance analysis.
    |


    | [TrackTrace](https://azure.microsoft.com/en-us/documentation/articles/app-insights-api-custom-events-metrics/#track-trace)
    | Diagnostic log messages. You can also capture 3rd-party logs. |


    | [TrackDependency](https://azure.microsoft.com/en-us/documentation/articles/app-insights-api-custom-events-metrics/#track-dependency)
    | Log the duration and frequency of calls to external components on which your
    app depends. |


    You can [attach properties and metrics](https://azure.microsoft.com/en-us/documentation/articles/app-insights-api-custom-events-metrics/#properties)
    to most of these telemetry calls.


