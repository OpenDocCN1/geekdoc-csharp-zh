    # Chapter 1: Understanding the


    Microsoft Bot Framework


    This book covers using Visual Studio 2015 to create Chatbots using the Microsoft
    Bot Framework. The purpose of this book is to demonstrate, provide examples of,
    and to explain important concepts of the technology.


    ## What Is the Microsoft Bot Framework?


    ![image](images/00002.jpeg)


    The [Microsoft Bot Framework](https://dev.botframework.com/) allows you to easily
    create Bots.


    ![image](images/00003.jpeg)

