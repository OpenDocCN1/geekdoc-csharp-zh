  trans: "\n接下来，在 `HandleSystemMessage` 方法中找到 `else if (message.Type == ActivityTypes.ContactRelationUpdate)`\
    \ 区域。\n\n当 Bot 被添加到用户的联系列表时，会触发此方法。\n\n将该区域中的所有代码替换为以下代码：\n\n![](img/00109.jpeg) \n\
    \n![image](img/00110.jpeg)\n\n保存文件并按 `F5` 运行应用程序。\n\n![image](img/00111.jpeg)\n\
    \n使用 Microsoft Bot Framework Emulator 打开并运行 Bot。\n\n![image](img/00112.jpeg)\n\
    \n在模拟器中，调用 `Contact Relation Update-add` 事件。\n\n![image](img/00113.jpeg)\n\n将显示\
    \ Hero Card（英雄卡片）。\n\n点击卡片将带您访问 `AiHelpWebsite.com` 网站。\n\n## Carousel（轮播图）\n\n\
    ![image](img/00114.jpeg)\n\n轮播图水平显示多个卡片（`Hero Cards` 或 `Thumbnail Cards`）。\n\n\
    `List`（多个卡片的默认布局）垂直显示卡片。\n\n上面的图片显示了两个 `Hero Cards` 轮播图在 Skype 客户端中的外观。\n\n![image](img/00115.jpeg)\n\
    \n要实现此功能，首先将 `AiLogo_smallSquare.png` 文件（您可以在 `AiHelpWebsite.com` 的[下载页面](http://aihelpwebsite.com/Downloads)获取代码）添加到\
    \ `Images` 文件夹中。\n\n接下来，将以下代码添加到 `HandleSystemMessage` 方法中（`var connector = new\
    \ ConnectorClient(new Uri(message.ServiceUrl));` 行上方）：\n\n![](img/00116.gif)\n\
    \n保存文件，运行应用程序，并在模拟器中连接到它。\n\n在模拟器中，调用 `Contact Relation Update-add` 事件。\n\n![](img/00117.jpeg)\n\
    \n将显示第一张卡片，但您现在会看到一个滑块。\n\n将其向右滑动。\n\n![](img/00118.jpeg)\n\n随后您将看到第二个 `Hero Card`。\n\
    \n在 Skype 中，`Subtitle` 属性将显示为超链接并可以点击。\n\n## 对话中的富卡片附件 (Rich Card Attachments\
    \ In Dialogs)\n\n在 Dialogs 中实现富卡片附件面临着额外的挑战。\n\n主要的最大的挑战是，在 `Dialog` 类内部，您无法访问应用程序的基\
    \ URL 来确定图像的位置。\n\n我们可以通过使用 Bot State Service 来解决这个问题。\n\n打开 `MessagesController.cs`\
    \ 文件：\n\n![image](img/00119.jpeg) \n\n在 `Post` 方法顶部添加以下代码：\n\n![](img/00120.jpeg) \n\
    \n这将使用 [Bot State Service](https://docs.botframework.com/en-us/csharp/builder/sdkreference/stateapi.html)\
    \ 存储 `CurrentBaseURL` 和 `Recipient`，以便稍后可以在 `Dialog` 类中检索这些值。\n\n![image](img/00121.jpeg)\n\
    \n打开 `NumberGuesserDialog.cs` 文件。\n\n在 `namespace` 上方添加以下代码：\n\n![](img/00122.gif)\
    \ \n\n在类顶部添加此内容：\n\n![](img/00123.gif)\n\n这将提供一个全局变量，它将在调用之间自动被[序列化并持久化](https://docs.botframework.com/en-us/csharp/builder/sdkreference/dialogs.html#echoBot)以存储\
    \ `Base URL`。\n\n在 `MessageReceivedAsync` 方法顶部添加以下代码：\n\n![](img/00124.gif)\n\n\
    这将检索存储在 `MessagesController` 类 Bot State Service 中的 `CurrentBaseURL` 值，并将其存储在全局变量\
    \ `strBaseURL` 中。\n\n向类添加以下 `Utility` 方法。此方法将创建 5 个 `CardAction` 按钮，这些按钮将附加到 `Hero\
    \ Card` 上（我们将在后续步骤中创建）：\n\n![](img/00125.gif)\n\n按钮的类型被设置为 `[imBack](https://docs.botframework.com/en-us/csharp/builder/sdkreference/attachments.html#cardaction)，这将使按钮（`CardAction`）简单将值（在此情况下为按钮编号）发送回\
    \ Bot。\n\n## 在 Dialog 类中创建 Hero Card\n\n![image](img/00126.jpeg)\n\n我们现在将在 `Dialog`\
    \ 类中显示一个带有 5 个按钮的 Hero Card。\n\n首先，将 `NumberGuesserCard.png` 文件（您可以在 `AiHelpWebsite.com`\
    \ 的[下载页面](http://aihelpwebsite.com/Downloads)获取代码）添加到 `Images` 文件夹中。\n\n接下来，在\
    \ `MessageReceivedAsync` 方法中找到以下代码：\n\n![](img/00127.jpeg) \n\n将其替换为以下代码：\n\n\
    ![](img/00128.gif)\n\n保存文件，按 `F5` 运行项目，并在模拟器中连接到它。\n\n![](img/00129.jpeg)\n\n\
    Bot 现在将显示一张图片和按钮。\n\n我们可以点击其中一个按钮或输入一个数字来玩游戏。\n\n下面的图片显示了它在 Skype 中的外观：\n\n![image](img/00130.jpeg)\n\
    \n## 创建可复用的 Hero Card\n\n如果有几个地方需要显示带按钮的 Hero Card，我们将想要创建一个可复用的 Hero Card。\n\n\
    此 Hero Card 将不包含图片，只有按钮。\n\n首先，在 `Dialog` 类中添加以下实用方法：\n\n"
- fmt: "\n# Select Entity Framework 6.x.\n\nClick Next.\n\n![image](images/00156.jpeg)\n\
    \nExpand the tree to reveal the `UserLog` table and click the checkbox next to\
    \ it.\n\nAccept the other default values.\n\nClick Finish.\n\n![image](images/00157.jpeg)\n\
    \nThe `BotData.edmx` an Entity Data Model will be created.\n\nYou can close the\
    \ `BotData.edmx` for now.\n\n## Log To The Database\n\nWe will now create code\
    \ that will log (most of) the messages to and from the Bot to the database.\n\n\
    First, create a file called `Utility.cs` and use the following code:\n\n![](images/00158.jpeg)\n\
    \nThis creates a utility method to allow us to trim any text we store in the database.\
    \ This ensures that no message is too long to be stored in the database. This\
    \ would cause an error.\n\n![image](images/00159.jpeg)\n\nNext, find the following\
    \ code in `MessagesController.cs`:\n\n![](images/00160.gif)\n\nReplace it with:\n\
    \n![](images/00161.gif)\n\nThis code logs the messages being sent from the user\
    \ to the Bot.\n\n## Log Messages In The Dialog Class\n\n![image](images/00162.jpeg)\n\
    \nThe [Dialog](https://docs.botframework.com/en-us/csharp/builder/sdkreference/dialogs.html)\
    \ class creates a response to the user.\n\nFind all code in the `NumberGuessserDialog.cs`\
    \ file (there will be multiple places) that send a text response to the user,\
    \ which contain these lines:\n\n![](images/00163.gif)\n\nAdd the following code\
    \ above the existing lines of code (again, there will be multiple places you will\
    \ do this):\n\n![](images/00164.gif)\n\nWhen we have a `PromptDialog`, we don’t\
    \ have a [reply Activity](https://docs.botframework.com/en-us/csharp/builder/sdkreference/routing.html#replytoactivity).\
    \ In this case, we need to make one, so we have the values we need to log to the\
    \ database.\n\nFind the following code in the `Dialog` class:\n\n![](images/00165.gif)\n\
    \nAdd the following code above the existing lines of code:\n\n![](images/00166.gif)\n\
    \nNote: The `CongratulationsStringPrompt` is set by the existing code to indicate\
    \ that the user has won the game.\n\n## Test The Database Logging Code\n\n![image](images/00167.jpeg)\n\
    \nHit F5 to run the application.\n\n![image](images/00168.jpeg)\n\nThe web browser\
    \ will open.\n\nNote the port number and the web address.\n\n![image](images/00169.jpeg)\n\
    \nOpen and run the Microsoft Bot Framework Emulator.\n\nWhen the emulator starts,\
    \ connect to the Bot by setting the address to the one indicted in the web browser;\
    \ however, add `/api/messages` to the end.\n\n![image](images/00170.jpeg)\n\n\
    Ensure that the Bot URL is connecting to the correct address.\n\n![image](images/00171.jpeg)\n\
    \nEnter Helloand click the send button to start a conversation with the Bot.\n\
    \n![](images/00172.jpeg)\n\nPlay the game with the Bot.\n\nClose the web browser\
    \ to stop the application and return to Visual Studio.\n\n## View The Data\n\n\
    ![image](images/00173.jpeg)\n\nWe will now view the data that was logged to the\
    \ database.\n\nIn the Solution Explorer in Visual Studio, right-click on `BotData.mdf`\
    \ and select Open.\n\n![image](images/00174.jpeg)\n\nThis will open the Server\
    \ Explorer.\n\nRight-click on the `UserLog` table and select Show Table Data.\n\
    \n![image](images/00175.jpeg)\n\nThe logged data will be displayed.\n\n## Logging\
    \ High Scores\n\n![image](images/00176.jpeg)\n\nWe will now add code to log and\
    \ display High Scores.\n\nWe have to alter the database first to store the number\
    \ of turns required to win and the name of the winner.\n\nIn the Server Explorer,\
    \ right-click on the `UserLog` table and select Open Table Definition.\n\nNote:\
    \ If you don’t have this option, install the latest SQL Server Data Tools (SSDT)\
    \ from https://msdn.microsoft.com/library/mt204009.aspx\n\n![](images/00177.jpeg)\n\
    \nAdd the following fields:\n\n* `CountOfTurnsToWin` [int]\n* `WinnerUserName`\
    \ [nvarchar(150)]\n\nClick the Update button.\n\n![](images/00178.jpeg)\n\nWhen\
    \ the Preview Database Updates box shows, click Update Database.\n\n![image](images/00179.jpeg)\n\
    \nThe Data Tools Operations window will indicate when the update is complete.\n\
    \n## Update ADO.NET Entity Data Model\n\n![image](images/00180.jpeg)\n\nWe have\
    \ to update the ADO.NET Entity Data Model to have programmatic access to the newly\
    \ added fields.\n\nIn the Solution Explorer, click on `BotData.edmx` to open it\
    \ in the designer.\n\nIn the designer, right-click on the `UserLog` table and\
    \ select Update Model from Database.\n\n![](images/00181.jpeg)\n\nWhen the Update\
    \ Wizard shows, select the Refresh tab and then select the `UserLog` table. Click\
    \ Finish.\n\n## Alter Code To Log High Scores\n\n![image](images/00182.jpeg)\n\
    \nWe will now alter the code in the Dialog class to log the winning user and the\
    \ number of turns they required to win.\n\nIn the `NumberGuesserDialog.cs` file,\
    \ locate the following code:\n\n![](images/00183.gif)\n\nAdd the following lines\
    \ of code below the code above:\n\n![](images/00184.gif)\n\n## Display The High\
    \ Scores\n\n![image](images/00185.jpeg)\n\nWe will now add code to display the\
    \ High Scores whenever the user types High Scores.\n\nOpen the `MessagesController.cs`\
    \ file and add the following method to the class:\n\n![](images/00186.jpeg) \n\
    \nWe will now add the code that will call the `ShowHighScores` method we just\
    \ added.\n\nIn the `MessagesController.cs` file, locate the following code:\n\n\
    ![](images/00187.gif) \n\nReplace it with the following code:\n\n![](images/00188.jpeg)\
    \ \n\nFinally, to let the user know they can type High Scores to see the high\
    \ scores, find the following code in the Dialog class:\n\n![](images/00189.gif)\n\
    \nChange it to:\n\n![](images/00190.jpeg)\n\n## Test The Code\n\n![](images/00191.jpeg)\n\
    \nNow when we type High Scores, we can see the high scores for the past.\n\n![image](images/00192.jpeg)\n\
    \nThe image above shows what the high scores look like when the Bot is published.\n\
    \n## Publishing A Bot Framework Application That Uses a Database\n\n![image](images/00193.jpeg)\n\
    \nTo publish the Bot, we can follow the directions in Chapter 2: Create a Hello\
    \ World!. However, this chapter does not cover publishing a Bot that uses a database.\n\
    \n![image](images/00194.jpeg)\n\nIf you do not have a Azure account, go to https://azure.com\
    \ and create an account and a subscription.\n\n![image](images/00195.jpeg)\n\n\
    Log into the Azure [web portal](https://portal.azure.com/) and select SQL databases.\n\
    \n![image](images/00196.jpeg)\n\nAdd a new database.\n\n![](images/00197.jpeg)\n\
    \nFill in the form to create a database.\n\nNote: If you do not already have a\
    \ server to put the database on, you will be prompted to create one. At that time,\
    \ you will create a user name and password. This is the user name and password\
    \ you will use in the connection string to connect to the database when you use\
    \ the deployment wizard in Visual Studio.\n\n![image](images/00198.jpeg)\n\nAfter\
    \ you create the database, you can view the ADO.NET(SQL authentication) connection\
    \ string for the database in the Overview section.\n\nNote: The connection string\
    \ will not have the username and password. You will use the username and password\
    \ of the Azure server that contains the database.\n\n![image](images/2000.jpeg)\n\
    \nOn the Settings tab:\n\n1.  Select Exclude files from the App_Data folder.\n\
    \    This will prevent the `BotData.mdf` database file from being published to\
    \ Azure. You are doing this because the .mdf file cannot be used on Azure.\n\n\
    2.  Enter the connection string to the database (running on Azure) in `BotDataEntities`.\n\
    \    You can get the ADO.NET(SQL authentication) connection string for the database\
    \ in the Overview section for the database in the Azure portal. Use the “…” button\
    \ to help you connect to the database and construct the connection string.\n\n\
    3.  Check Use this connection string at runtime.\n    This will update the `web.config`\
    \ of the published application, so the published application will connect to the\
    \ database on Azure.\n\n4.  Click the Publish button.\n\n![image](images/00201.jpeg)\n"
