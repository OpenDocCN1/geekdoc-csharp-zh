  \ 在 Visual Studio 内部管理你的 Azure 数据库。\n\n# 第 7 章：实现语言理解智能服务 (LUIS)\n\n本章的示例代码可以通过链接“Implementing\
  \ Language Understanding Intelligent Service (LUIS) In Microsoft Bot Framework”在\
  \ `http://AiHelpWebsite.com/Downloads` 获取。\n\n![](img/00206.jpeg)\n\n在你的 Microsoft\
  \ Bot Framework 应用程序中使用语言理解智能服务 (LUIS)，可以让你创建让终端用户更容易交互的聊天机器人。\n\n![image](img/00207.jpeg)\n\
  \n在本例中，我们将从上一章创建的代码开始。\n\n本章将介绍如何创建一个猜数字游戏并存储和显示高分。在上章中，用户被要求输入精确的单词 `High Scores`，并且他们只能看到昨天的高分。\n\
  \n![image](img/00208.jpeg)\n\n在本章中，我们将修改代码，允许用户查看过去一周、上个月或他们指定的天数（最多 30 天）的高分。\n\
  \n最重要的是，我们将允许用户使用自然语言输入请求，然后检测用户的意图和重要的相关实体（例如天数）。\n\n我们将通过使用语言理解智能服务 (LUIS) 创建一个应用程序，然后该程序与我们现有的\
  \ Bot 接口。\n\n## 创建 LUIS 应用程序\n\n![image](img/00209.jpeg)\n\n第一步是访问 `https://www.luis.ai/`\
  \ 在语言理解智能服务 (LUIS) 网站创建一个账户并登录。\n\n![image](img/00210.jpeg)\n\n创建一个新应用程序 (New Application)。\n\
