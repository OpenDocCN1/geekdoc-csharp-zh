  替换为代码：\n\n![](img/00085.jpeg)\n\n这告诉机器人将任何消息定向到 `NumberGuesserDialog` 类。\n\n最后，在代码文件的顶部添加以下\
  \ `using` 语句：\n\n![](img/00086.gif)\n\n## 测试应用程序\n\n![image](img/00087.jpeg)\n\n\
  按 `F5` 运行应用程序。\n\n![image](img/00088.jpeg)\n\n浏览器将打开。请注意端口号和网页地址。\n\n![image](img/00089.jpeg)\n\
  \n打开并运行 Microsoft Bot Framework Emulator。\n\n当模拟器启动时，通过将地址设置为浏览器中指定的地址来连接机器人；但要在地址末尾添加\
  \ `/api/messages`。\n\n![image](img/00090.jpeg)\n\n确保 Bot URL 连接到正确的地址。\n\n![image](img/00091.jpeg)\n\
  \n输入消息并点击发送键（或按 `Enter`）。\n\n![](img/00092.jpeg)\n\n机器人将做出响应。\n\n到此为止机器人只会做这些事情；然而，此示例展示了创建和使用\
  \ `Dialog` 类的最小代码。\n\n## Dialog 提示 (Prompts)\n\n`PromptDialog` 本质上是一个用于创建简单提示的 `Dialog`\
  \ 工厂。它允许你询问用户响应，并指示在给出响应时运行哪些代码。`PromptDialog` 会产生一个具有自身私有状态的子对话。在等待响应时，Microsoft\
  \ Bot Framework 服务会挂起该子对话。当它收到响应时，它将从被挂起时代码所在位点处继续执行。\n\n这是在 `Dialog` 类内部控制程序流的主要手段。\n\
  \n`PromptDialog` 可以是以下类型之一：\n\n* 用于附件的提示\n* 用于一组选择之一的提示\n* 询问是/否问题\n* 用于长文本的提示\n\
  * 用于双精度浮数的提示\n* 用于字符串的提示\n\n我们将增强应用程序，以实现一个询问是/否问题的 `PromptDialog`。\n\n首先，在 `MessageReceivedAsync`\
  \ 方法中添加以下代码：\n\n![](img/00093.gif)\n\n如果用户没有猜中随机数，此代码将一直循环并计数猜测尝试。\n\n如果用户猜中了数字，则将调用\
  \ `else` 块中的代码。\n\n现在，代码还不完整。我们需要在 `// Put PromptDialog here` 行下添加一个 `PromptDialog`。\n\
