- "# Microsoft Bot Framework 入门指南：使用 Microsoft Visual Studio 和 C# 创建 Facebook 和 Skype\
  \ 聊天机器人（本书涵盖了 Microsoft Bot Framework 预览版）\n\n\n\n![](img/00385.jpeg)\n\n![C:\\\
  Users\\Michael\\AppData\\Local\\Microsoft\\Windows\\INetCacheContent.Word\\An Introduction\
  \ to the Microsoft Bot Framework Cover.jpg](img/00001.jpeg)\n\n\n\n\n\n\n\n\n\n\n\
  \n\n\n\n\n\n\n\n# 第 1 章：理解\n\nMicrosoft Bot Framework\n\n本书涵盖了如何使用 Visual Studio\
  \ 2015 使用 Microsoft Bot Framework 创建聊天机器人。本书的目的是演示、提供示例并解释该技术的重要概念。\n\n## 什么是 Microsoft\
  \ Bot Framework?\n\n![](img/00002.jpeg)\n\n[Microsoft Bot Framework](https://dev.botframework.com/)\
  \ 允许你轻松地创建机器人。\n\n\n\n\n你可以在用户所在的任何地方创建与他们自然交互的机器人，包括 Facebook、短信、Skype、Office 365\
  \ 电子邮件和其他流行服务。\n\n![image](img/00004.jpeg)\n\nMicrosoft Bot Framework 包含以下组件：\n\n\
  *   `Bot Framework Developer Portal`（开发者门户）– 一个将你的 `Bot` 连接到 Facebook、Skype 和电子邮件等通信通道的服务。\n\
  *   `Bot Builder SDK` – 一个 C# 和 Node.js 库，为构建可以处理自由格式和引导式交互的机器人提供了强大的框架。\n*   `Bot\
  \ Directory`（机器人目录）– 一个你可以连接的机器人目录。\n\n`Bot Framework Developer Portal` 帮助你将 `Bot`\
  \ 连接到通信通道。你可以编写一个 `Bot` 并在互联网上暴露与 Microsoft Bot Framework 兼容的 API。`Bot Framework\
  \ Developer Portal` 将消息转发给用户，并将用户的消息发回给你的 `Bot`。\n\n`Bot Builder SDK` 是一个托管在 GitHub\
  \ (`https://github.com/Microsoft/BotBuilder-Samples`) 上的开源 SDK，它提供了构建对话所需的所有内容。微软的机器人开发者创建了此库以封装对话式机器人所需的功能。\n\
  \n`Bot Directory`（位于 `https://bots.botframework.com/`）提供了你可以通过 `Bot Connector` 暴露的通道与其通信的机器人。\n\
  \n# 第 2 章：创建一个 Hello World! 机器人\n\n本章的示例代码可以通过 `http://AiHelpWebsite.com/Downloads`\
  \ 链接“Creating a Hello World! Bot Using The Microsoft Bot Framework”获取。\n\n本章目的是演示如何开始使用\
  \ Microsoft Bot Framework、如何创建一个简单的 `Bot` 以及如何将其发布到 Microsoft Bot Framework Developer\
  \ Portal。\n\n## 创建 Hello World! 机器人\n\n![image](img/00005.jpeg)\n\n从 `http://aka.ms/bf-bc-vstemplate`\
  \ 下载 `Visual Studio 2015` 模板。\n\n将 `.zip` 文件保存到 Windows 电脑的模板目录，路径为：`%USERPROFILE%\\\
  Documents\\Visual Studio 2015\\Templates\\ProjectTemplates\\Visual C#`。\n\n这将创建一个可以在\
  \ `Visual Studio` 中用于创建 `Bot` 项目的模板。\n\n![image](img/00006.jpeg)\n\n打开 `Visual Studio`。\n\
  \n![image](img/00007.jpeg)\n\n创建一个新的 `Project`。\n\n![image](img/00008.jpeg)\n\n\
  选择 `Bot Application` 模板并将项目命名为 `HelloWorldBot`。\n\n![image](img/00009.jpeg)\n\n\
  打开 `Controllers` 文件夹下的 `MessagesController.cs` 文件。\n\n将 `Post` 方法更改为如下：\n\n```\n\
  ![](img/00010.jpeg)\n```\n\n![image](img/00011.jpeg)\n\n按下 `F5` 运行项目。\n\n![image](img/00012.jpeg)\n\
  \n注意该 Web 地址。你将在下一步中需要它。\n\n## 使用 Bot Emulator\n\n![image](img/00013.jpeg)\n\n从\
  \ `https://aka.ms/bf-bc-emulator` 下载、安装并运行 `Bot Framework Emulator`。\n\n当模拟器启动时，将地址设置为浏览器中指定的地址来连接到\
  \ `Bot`。但是，要在末尾添加 `/api/messages`。\n\n![image](img/00014.jpeg)\n\n在 `Bot Emulator`\
  \ 中在文本框内输入 `Hello` 并点击发送键（或按回车）。\n\n你将在 `Chat` 窗口看到响应，并在 `JSON` 窗口看到响应的 `JSON` 内容。\n\
  \n## 保存用户数据\n\n任何对话的一个重要部分是记住用户之前说过的话。\n\n我们可以使用 `GetPrivateConversationData` 和\
  \ `SetPrivateConversationData` 来此。\n\n为了演示如何处理这些，请在 `Controllers` 文件夹下的 `MessagesController.cs`\
  \ 文件顶部添加以下内容：\n\n```\n![](img/00015.gif)\n```\n\n接下来，将 `MessagesController.cs` 文件中的\
  \ `Post` 方法更改为如下：\n\n```\n![](img/00016.jpeg)\n```\n\n```\n![](img/00017.jpeg)\n\
  ```\n\n最后，将 `MessagesController.cs` 文件中 `HandleSystemMessethod` 中的以下部分更改为如下：\n\n\
  ```\n![](img/00018.jpeg)\n```\n\n![image](img/00019.jpeg)\n\n现在当我们与 `Bot` 聊天时，它可以记住我们的名字。\n\
  \n```\n![image](img/00020.jpeg)\n```\n\n如果我们告诉它 `Delete User Data…`\n\n```\n![image](img/00021.jpeg)\n\
  ```\n\n它将尊重我们的意愿。\n\n## 发布机器人\n\n要通过 Skype 和 Facebook Messenger 等通道连接你的 `Bot`，你需要在\
  \ Microsoft Bot Framework Developer Portal 上配置它。为了做到这一点，你首先需要将其发布在一个公共访问的位置。\n\n\
  可以是任何服务器；但建议`发布到 Azure`，因为 `Visual Studio` 内置了对其发布的支持。\n\n首先，访问 [`azure.microsoft.com`](https://azure.microsoft.com/)，如果你还没有账户，请创建一个账户和订阅。\n\
  \n![image](img/00022.jpeg)\n\n接下来，在 `Visual Studio` 中`右键点击` `Project` 节点（而不是 `Solution`\
  \ 节点）并选择 `Publish`。\n\n（此处由于原文存在大量重复和碎片化的描述，已根据指令要求提取核心逻辑进行翻译）\n\n选择 `Azure Web\
  \ Apps`。\n\n![image](img/00025.jpeg)\n\n选择你的 `subscription`。\n\n然后点击 `Create` 按钮。\n\
  \n![image](img/00026.jpeg)\n\n输入唯一的 `Web App name`。\n\n选择你的 `resource group`。\n\n\
  选择一个 `service plan`。\n\n![image](img/00027.jpeg)\n\n`web app` 创建后，点击 `Publish` 按钮。\n\
  \n![image](img/00028.jpeg)\n\nWeb 应用 将在浏览器中打开。\n\n注意 `web app address`。\n\n![image](img/00029.jpeg)\n\
  \n注意：端点地址是你上一步看到的。但是，记住在地址末尾添加 `/api/messages` 并使用 `https://` 而不是 `http://`。\n\n\
  ![image](img/00030.jpeg)\n\n在过程中，你会被提示在 [`www.botframework.com/`](https://www.botframework.com/)\
  \ `Register a bot`。\n\n![image](img/00031.jpeg)\n\n填写所有字段。\n\n登录你的 `Microsoft Account`。\n\
  \n![image](img/00032.jpeg)\n\n获取 `Application ID` 和 `password`。\n\n记住它们，因为你需要在 `Visual\
  \ Studio` 中更新 `web.config` 文件。\n\n![image](img/00033.jpeg)\n\n注意：如果你在上一步中忘记记录 `MicrosoftAppPassword`，可以点击\
  \ `Generate New Password` 按钮创建一个新的。\n\n![image](img/00034.jpeg)\n\n再次发布 `Bot`。\n\
  \n你这样做是因为 `Bot Framework` 在与其通信时会传递 `Bot ID`、`MicrosoftAppId` 和 `MicrosoftAppPassword`。\n\
  \n![image](img/00035.jpeg)\n\n现在你可以使用 `Bot Framework Developer Portal` 网页测试你的 `Bot`\
  \ 了。\n\n![image](img/00036.jpeg)\n\n如果你愿意，可以点击 `Publish` 将你的 `Bot` 提交到 `Bot Directory`。\n\
  \n你也可以为你的 `Bot` [配置通道](http://docs.botframework.com/connector/getstarted/#configuring-channels)。即使你没有将\
  \ `Bot` 发布到 `Bot Directory`，你仍然可以从自己的应用程序以及你配置的任何通道调用它。\n\n注意：第 10 章和第 11 章介绍了如何使用\
  \ Bot Framework Developer Portal 配置 Skype 和 Facebook Messenger 通道，将你的机器人部署到这些网络上。\n\
  \n# 第 3 章：使用 FormFlow\n\n本章的示例代码可以通过 `http://AiHelpWebsite.com/Downloads` 链接“Introduction\
  \ To FormFlow With The Microsoft Bot Framework”获取。\n\n![](img/00038.jpeg)\n\n\n\n\
  \n使用 [FormFlow](https://docs.botframework.com/en-us/csharp/builder/sdkreference/forms.html)\
  \ 配合 [Microsoft Bot Framework](https://dev.botframework.com/) 可以让你用最少的代码快速创建一个引导式对话，从用户那里收集信息。虽然它的灵活性不如使用\
  \ Dialogs（Dialogs 将在节介绍），但它可以与 Dialogs 结合以增加其功能。\n\n## 流程演示\n\n![](img/00039.jpeg)\n\
  \n当用户与机器人开始对话时，它会介绍自己并询问用户的姓名。\n\n![](img/00040.jpeg)\n\n机器人将继续提问并收集回答。\n\n![](img/00041.jpeg)\n\
  \n`FormFlow` 的一个特性是用户可以随时输入 `help` 来获取任何问题或 `FormFlow` 本身的帮助。\n\n作为开发者，你无需编写任何额外代码即可获得此功能。\n\
  \n![](img/00042.jpeg)\n\n`FormFlow` 将持续运行直到表单完成。\n\n## 创建项目\n\n![image](img/00043.jpeg)\n\
  \n打开 Visual Studio。\n\n![image](img/00044.jpeg)\n\n创建一个新项目。\n\n![image](img/00045.jpeg)\n\
  \n选择 Bot Application 模板并将项目命名为 `HelloFormFlowBot`。\n\n![image](img/00046.jpeg)\n\
  \n项目将被创建。\n\n![image](img/00047.jpeg)\n\n右键点击项目。选择“添加”，然后选择“新建项”。\n\n我们现在将创建一个包含\
  \ `FormFlow` 逻辑的类。\n\n![image](img/00048.jpeg)\n\n添加名为 `ProfileForm.cs` 的新 C# 类。\n\
  \n将所有代码替换为以下代码：\n\n![](img/00049.jpeg)\n\n这段代码指示了我们将通过 `FormFlow` 收集的字段。\n\n注意，该类以及它所使用的\
  \ `Gender` `enum`（枚举）都被标记为 `[Serializable]`。\n\nMicrosoft Bot Framework 要求类必须是可序列化的，这样机器人就可以保持无状态。\n\
  \n保存文件。\n\n![image](img/00050.jpeg)\n\n打开 `MessagesController.cs` 文件。\n\n在文件顶部添加以下\
