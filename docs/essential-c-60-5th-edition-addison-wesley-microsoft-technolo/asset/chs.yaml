  \ `FileStream` 和 `StreamWriter`，以免它们在等待垃圾回收器运行期间一直保持打开状态。列表 5.13 不包含任何错误处理，因此如果抛出异常，则\
  \ `Close()` 方法都不会被调用。\n\n加载过程类似（参见列表 5.14）。\n\n**列表 5.14：从文件检索数据**\n\n点击此处查看代码图像\n\
  \n```csharp\nclass Employee\n{\n    // ...\n}\n```\n\n```csharp\n// IO 命名空间\nusing\
