  \ 1.5 显示了相应的输出。\n\n**列表 15：使用字符串插值格式化**\n\n点击此处查看代码图片\n\n```csharp\nclass HeyYou\n\
  {\n  static void Main()\n  {\n    string firstName;\n    string lastName;\n    System.Console.WriteLine(\"\
