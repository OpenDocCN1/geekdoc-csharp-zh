  \ 查看错误列表。\n## 思维导图\n每章的引言都包含一个**思维导图**，它作为概述，提供了每章内容的快速参考。这是一个示例（摘自第 5 章）。\n![图像](img/xxix_fig01)\n\
  每个章节的主题出现在思维导图的中心。高层主题从核心展开。思维导图允许你从高层到细节进行吸收。\n## 有用的笔记\n根据你的经验水平，特殊的代码块和标签将帮助你阅读本文。\n\
  - **初级主题 (Beginner Topics)** 针对初级程序员提供定义或解释。\n- **注释 (Callout notes)** 突出关键原则，让读者意识到其重要性。\n\
  - **页边开始和结束标签 (Page-edge begin and end tabs)** 表示特定于 C#；如果该材料跨页，则显示版本号。\n## 本书结构\n\
  从高层次来说，软件工程是关于管理复杂的，为了这一点，我组织了 *Essential C# 6.0*。第 1 到第 4 章介绍了结构化编程，让你能够立即编写简单的代码。第\
  \ 5 到第 9 章介绍了 C# 的面向对象结构。初级读者在阅读书中其余高级主题之前，应该专注于充分理解这一部分。第 11 到第 13 章引入了额外的简化性结构，处理了几乎所有现代程序需要的模式。这引出了使用反射和特性的动态编程，这些在随后的章节中被广泛用于。本书以关于通用语言体系结构\
  \ (CLI) 的章节结束，该章节描述了 C# 运行的平台背景。该章节之所以放在最后，因为它不是 C# 特有的，并且与书中其他部分的语法和编程风格不同。然而，该章节适合任何时间阅读，可能最适合在完第\
  \ 1 章之后。\n以下是每个章节的描述（在列表中，**粗斜体**显示的章节编号表示包含 C# 3.0–5.0 的内容）。\n- ***第 1 章](#ch01.html_ch01)****——介绍\
  \ C#：*在介绍 C# HelloWorld 程序后，本章将对其进行剖析。这应该让读者熟悉 C# 程序的的外和感觉，并提供如何编译和调试自己程序的详细信息。第\
  \ 1 章还涉及了 C# 的中间语言。\n\n\n## 第 2 章：数据类型\n\n为了利用计算机的迭代能力，你需要了解如何在程序中包含循环和条件逻辑。本章还涵盖了\
  \ C# 运算符、数据转换和预处理器指令。\n## 第 4 章：方法与参数\n\n在类的基本构建块的基础上，本章将这些构造组合形成功能完全的类型。类通过定义对象的模板构成了面向对象技术的核心。\n\
  ## 第 6 章：继承\n\n本章演示了如何使用接口来定义类之间“可版本化的”交互契约。C# 包含了显式和隐式接口成员实现，实现了大多数其他语言都不支持的额外封装层。\n\
  ## 第 8 章：值类型\n\n本章讨论了更高级的类型定义。它解释了如何实现运算符（如 `+` 和强制转换），并描述了如何将多个类封装到单个库中。此外，本章演示了命名空间的定义以及\
  \ XML 注释的使用，并讨论了如何为垃圾收集设计类。\n## 第 10 章：异常处理\n\n泛型可能是 C# 1.0 缺失的核心功能。本章完全涵盖了这一 2.0\
  \ 特性。此外，C# 4.0 添加了对协变和逆变的支持——这些将在本章泛型的语文中进行介绍。\n## 第 12 章：委托与 Lambda 表达式\n\n封装的委托被称为“事件”，它们是公共语言运行时（Common\
  \ Language Runtime）的核心构造。另一个 C# 2.0 特性——匿名方法也在此处介绍。\n## 第 14 章：带有标准查询运算符的集合接口\n\n\
  仅使用标准查询运算符会导致一些很长的语句。然而，查询表达式提供了一种与 SQL 密切匹配的替代语法，正如本章所描述的。\n## 第 16 章：构建自定义集合\n\
  \n面向对象编程形成了 20 世纪 80 年代后期范式转移的基础。同样，属性促进了声明式编程和嵌入元数据。本章研究属性并讨论了如何通过反射检索它们。它还涵盖了通过基类库（Base\
  \ Class Library）中的序列化框架进行文件输入输出。C# 4.0 为语言添加了一个新关键字 `dynamic`。它移除了所有运行时的类型检查，这显著扩展了\
  \ C# 能够实现的功能。\n## 第 18 章：多线程\n\n在上一章的基础上，第 19 章演示了一些内置的线程模式支持，这些支持可以简化多线程代码的显式控制。\n\
  ## 第 20 章：平台互操作性与不安全代码\n\n从根本上说，C# 是设计在底层公共语言基础设施之上的最有效编程语言的语法。本章深入探讨了 C# 程序与底层运行时及其规范的关系。\n\
  ## 附录 A：下载和安装 C# 编译器与 CLI 平台\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
  \n\n\n\n\n\nclass HelloWorld\n    static void Main()\n        System.Console.WriteLine(\"\
  Hello. My name is Inigo Montoya.\");\n}\n\n\n\n\n\n\n\n\n\n\n\n\n\ncsc.exe HelloWorld.cs\n\
  Copyright (C) Microsoft Corporation. All rights reserved.\n\n\n\n\nHelloWorld.exe\n\
  ```\n由 C# 编译器创建的程序 `HelloWorld.exe` 是一个**程序集（assembly）**。开发者并不是创建一个可以独立执行的整个程序，而是创建一个可以被另一个更大的程序引用的代码库。库（或类库）使用\
  \ `.dll` 文件扩展名，代表动态链接库（DLL）。库也是一个程序集。换句话说，无论是程序还是库，成功的 C# 编译输出都是一个程序集。\n`开始 2.0`\n\
