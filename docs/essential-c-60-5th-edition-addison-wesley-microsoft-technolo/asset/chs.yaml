  TABLE 19.4: *并发集合*\nTABLE 21.1: *常见的编译器*\nTABLE 21.2: *常见的缩写词*\n## 前言\n你可能认为 Eric\
  \ 是写博客的，但那并不是我认识他的方式。2005 年 LINQ（语言集成查询）发布时，我刚加入微软，那是 C# 和 .NET 的大日子，尽管当时现场还挺安静的。作为社区的新人，我想我可能在会议上第一次见到了许多人，并在之后与他们建立了深厚的关系。但说实话，我不记得具体细节，我只记得\
  \ Mark。原因如下：当我问他是否喜欢这些新事物时，他并没有盲目跟风，而是非常客观：“我不知道，还没决定。”他想要吸收并理解整个包，在此之前他不会让任何人告诉他怎么想。\n\
  因此，我得到的不是快速的肯定，而是了一次坦诚且全面的对话——关于细节、后果以及对这项技术的疑虑。这种情况一直如此：Mark 对我们这些语言设计者来说是非常宝贵的社区成员，因为他非常聪明，坚持理解核心问题，并且对实际应用有非凡的洞察。但最重要的是，他为人直率，从不畏惧真相。\n\
  Eric 当然是我在 C# 团队工作七年的同事。他在那里的时间比我长得多，我记得关于他的第一件事是他正在向团队解释如何理顺一堆乱码。更具体地说，当时的 C# 编译器代码库需要一些切的架构调整，添加功能非常困难——这正是\
  \ LINQ 所需要的。尽管问题如此复杂，而且我对于团队和代码库来说还是新人，但我立刻听懂了他在说什么。\n\n\n\n\n\n\n\n\n\n\n\n\n*\
  \ 对于已经熟悉 `C#` 的读者，它提供了对一些更复杂编程范式的见解，并对语言最新版本 `C#` 6.0 和 `.NET Framework` 4.6 中引入的特性进行了深入介绍。\n\
  \n\n\n\n* **结构化程序程序员：** 就像通过第 2 章 学习 `C#` 是最好一样。\n* **C# 专业人士：** 对于那些已经精通 `C#` 的人，本书为不常遇到的语法提供了方便的参考。\n\
  \n\n\n\n\n\n\n\n\n\n\n- **必须 (DO)** 确保对象在哈希表中的期间其哈希值永远不会改变。\n- **必须 (DO)** 确保哈希算法在任何可能的对象状态下都是健壮的。\n\
  ***\n这些指南是区分“了解语法的程序员”与“专家”的关键，专家能够根据具体情况识别出编写最有效的代码。这样的专家不仅能让代码通过，而且在遵循最佳实践的同时完成，从而最大限地减少\
  \ Bug 并在未来的很长时间内便于维护。编码指南强调了读者希望确保纳入自己的开发工作中的一些核心原则。\n## 代码示例\n本文大部分内容的代码片段可以在任何通用语言体系结构\
