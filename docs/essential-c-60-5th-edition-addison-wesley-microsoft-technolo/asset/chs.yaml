  \ `WriteLine()` 语句被拆分到了多行。\n\n## 初学者主题：什么是空白字符？\n\n**空白字符**是一个或多个连续的格式字符的组合，例如制表符、空格和换行符。消除单词之间所有的空白字符显然具有重要意义，在引号字符串内包含空白字符也是如此。\n\
  \n### 空白字符\n\n分号使得 C# 编译器能够忽略代码中的空白字符。除了少数例外外，C# 允许开发者在整个代码中插入空白字符而不改变其语义含义。在列表\
  \ 1.5 和列表 1.6 中，在语句内部或语句之间插入换行符并不重要，这样做对编译器创建的可的可执行文件没有影响。\n\n程序员经常使用空白字符对代码进行缩进以提高可读性。考虑列表\
  \ 1.7 和列表 1.8 所示的 `HelloWorld` 的两种变体。\n\n### 列表 1.7：无缩进格式化\n\n点击此处查看代码图像\n\n```\n\
  class HelloWorld\n{\nstatic void Main()\n{\nSystem.Console.WriteLine(\"Hello Inigo\
  \ Montoya\");\n}\n}\n```\n\n### 列表 1.8：移除空白字符\n\n点击此处查看代码图像\n\n```\nclass HelloWorld{static\
  \ void Main()\n{System.Console.WriteLine(\"Hello Inigo Montoya\");}}\n```\n\n尽管这两个示例看起来与原始程序显著不同，但\
  \ C# 编译器认为它们是相同的。\n\n## 初学者主题：使用空白字符格式化代码\n\n使用空白字符对代码进行缩进对于提高可读性非常重要。当你开始编写代码时，需要遵循既定的编码标准和规范，以增强代码的可读性。\n\
  \n本书使用的规范是将大括号放在单独的一行，并对大括号对之间包含的代码进行缩进。如果在第一对大括号内部出现另一对大括号，则第二组大括号内的所有代码也都要缩进。\n\
  \n这并不是统一的 C# 标准，而是一种风格偏好。\n\n## 变量操作\n\n现在你已经接触了最基本的 C# 程序，是时候声明局部变量了。一旦声明了变量，你就可以给它赋值，用新值替换该值，并将其用于计算、输出等等中。然而，你不能更改变量的数据类型。在列表\
  \ 1.9 中，`string max` 是一个变量声明。\n\n### 列表 1.9：声明和赋值变量\n\n![图像](img/01lis09.jpg)\n\n\
  ## 初学者主题：局部变量\n\n**变量**是一个指向可以随时间改变值的名称。*局部*表示程序员在方法内部**声明**了该变量。\n\n声明变量就是定义它，你通过以下方式定义它：\n\
  \n1. 指定变量将包含的数据类型\n2. 为它分配一个标识符（名称）\n\n### 数据类型\n\n列表 1.9 声明了一个数据类型为 `string` 的变量。本章使用的其他常用数据类型还有\
  \ `int` 和 `char`。\n\n- `int` 是 C# 中对 32 位大小整数类型的称呼。\n- `char` 用于字符类型。它是 16 位，足以容纳（非代理）Unicode\
  \ 字符。\n\n下一章将更详细地查看这些以及其他常用数据类型。\n\n## 初学者主题：什么是数据类型？\n\n变量声明所指定的数据类型被称为**数据类型**（或对象类型）。数据类型，或简单称为**类型**，是对具有相似特征和行为的事物的分类。例如，*动物*是一种类型。它分类了所有具有动物特征（多细胞、具有运动能力等）的事物（猴子、野猪和鸭嘴兽）。同样，在编程语言中，类型是对若干具有相似性质的项的定义。\n\
  \n### 声明变量\n\n在列表 1.9 中，`string max` 是一个类型为 `string` 的变量声明。可以通过指定一次数据类型并用逗号分隔每个标识符，在同一语句内声明多个变量。列表\
  \ 1.10 演示了这样的声明。\n\n### 列表 1.10：在语句内声明两个变量\n\n```\nstring message1, message2;\n\
  ```\n\n由于多变量声明允许只提供一次数据类型，所有变量将具有相同的类型。在 C# 中，变量名可以以字母或下划线（`_`）开头，随后可以是任意数量的字母、数字和下划线。但根据命名规范，局部名称使用驼峰命名法。\n\
  \n### 指南\n\n**应当**对局部名称使用驼峰命名法。\n\n声明变量后必须对其赋值。这样做的方法是使用 `=` 运算符，也称为简单赋值运算符。列表 1.11\
  \ 演示了如何使用赋值运算符为 `miracleMax` 和 `valerie` 指定指定的字符串值。\n\n### 列表 1.11：更改变量的值\n\n点击此处查看代码图像\n\
  \n```\nclass StormingTheCastle\n{\n  static void Main()\n  {\n    string valerie;\n\
  \    string miracleMax = \"Have fun storming the castle!\";\n    valerie = \"Think\
  \ it will work?\";\n    Console.WriteLine(miracleMax);\n    Console.WriteLine(valerie);\n\
  \    max = \"It would take a miracle.\";\n  }\n}\n```\n\n从列表中可以观察到，可以在变量声明的同时赋值（如\
  \ `miracleMax`），也可以在随后的单独语句中赋值（如变量 `valerie`）。赋值的值必须始终在右侧。\n\n运行编译后的 `StormingTheCastle.exe`\
  \ 程序产生如输出 1.3 所示。\n\n**输出 1.3**\n\n>StormingTheCastle.exe\n\nHave fun storming the\
  \ castle!\n\nThink it will work?\n\nIt would take a miracle.\n\nC# 要求在读取局部变量之前，编译器确定其已赋值。此外，赋值返回一个值。因此，C#\
  \ 允许在同一语句中进行两次赋值，如列表 1.12 所示。\n\n### 列表 1.12：返回可再次赋值值的赋值\n\n点击此处查看代码图像\n\n\n\n\n\
  \n```csharp\nclass StormingTheCastle\n{\n  static void Main()\n  {\n    // ...\n\
  \    string requirements, miracleMax;\n    requirements = miracleMax = \"It would\
  \ take a miracle.\";\n    // ...\n  }\n}\n```\n\n### 使用变量\n\n赋值的结果自然是，你随后可以使用变量标识符来引用该值。因此，当你在\
  \ `System.Console.WriteLine(miracleMax)` 语句中使用变量 `miracleMax` 时，程序会在控制台上显示 `miracleMax`\
  \ 的值，即 `Have fun storming the castle!`。通过更改 `miracleMax` 的值并执行相同的 `System.Console.WriteLine(miracleMax)`\
  \ 语句，将显示新的 `miracleMax` 值——“`It would take a miracle.`”。\n\n### 进阶主题：字符串是不可变的\n\n\
  所有类型为`string`的数据（无论是字符串字面量还是其他）都是不可变的（或不可修改的）。例如，无法将字符串“Come As You Are”更改为“Come\
  \ As You Age”。这种更改需要你重新分配变量以指向内存中的新位置，而不是修改变量原始指向的数据。\n\n### 控制台输入与输出\n\n本章已经多次使用\
  \ `System.Console.WriteLine` 向命令控制台输出文本。除了能够输出数据外，程序还需要能够接受用户输入的数据。\n\n### 从控制台获取输入\n\
  \n检索控制台输入文本的一种方法是使用 `System.Console.ReadLine()`。该方法会停止程序执行，以便用户输入字符。当用户按下 Enter\
  \ 键产生换行时，程序继续。`System.Console.ReadLine()` 方法的输出（也称为返回值）是输入的文本字符串。请参考列表 1.13 和输出\
  \ 1.4 中显示的相应输出。\n\n**列表 1.13：使用 System.Console.ReadLine()**\n\n点击此处查看代码图片\n\n```csharp\n\
  class HeyYou\n{\n  static void Main()\n  {\n    string firstName;\n    string lastName;\n\
  \    System.Console.WriteLine(\"Hey you!\");\n    System.Console.Write(\"Enter your\
  \ first name: \");\n    firstName = System.Console.ReadLine();\n    System.Console.Write(\"\
  Enter your last name: \");\n    lastName = System.Console.ReadLine();\n  }\n}\n\
  ```\n\n**输出 1.4**\n```\nHeyYou.exe\nHey you!\nEnter your first name: Inigo\nEnter\
  \ your last name: Montoya\n```\n\n在每个提示之后，此程序使用 `System.Console.ReadLine()` 方法来检索用户输入的文本并将其赋值给相应的变量。当第二个\
  \ `System.Console.ReadLine()` 赋值完成时，`firstName` 指向值 `Inigo`，`lastName` 指向值 `Montoya`。\n\
  \n### 进阶主题：System.Console.Read()\n\n除了 `System.Console.ReadLine()` 方法，还有一个 `System.Console.Read()`\
  \ 方法。然而，`System.Console.Read()` 方法返回的数据类型是对应于所读字符值的整数，如果没有更多可用字符，则返回 `-1`。要获取实际字符，需要先将整数转换为字符，如列表\
  \ 1.14 所示。\n\n**列表 1.14：使用 System.Console.Read()**\n\n点击此处查看代码图片\n\n```csharp\n\
  int readValue;\nchar character;\nreadValue = System.Console.Read();\ncharacter =\
  \ (char) readValue;\nSystem.Console.Write(character);\n```\n\n`System.Console.Read()`\
  \ 方法在用户按下 Enter 键之前不会返回输入；即使用户在按下 Enter 键之前输入了多个字符，也不会开始处理字符。\n\n**开始 2.0**\n在 C#\
  \ 2.0 及更高版本中，你可以使用 `System.Console.ReadKey()`，与 `System.Console.Read()` 相，它在单个按键后就会返回输入。它允许开发者拦截按键并执行操作，如按键验证、将字符限制为数字）。\n\
  **结束 2.0**\n\n### 向控制台输出\n\n在列表 1.13 中，你使用 `System.Console.Write()` 方法而非 `System.Console.WriteLine()`\
  \ 来提示用户输入姓名和姓氏。`System.Console.Write()` 方法在显示文本后不会放置换行符，而是留在当前行。这样，用户输入的任何文本都将与提示处于在同一行。列表\
  \ 13 的输出演示了 `System.Console.Write()` 的效果。\n\n**开始 6.0**\n下一步是将使用 `System.Console.ReadLine()`\
