  \ Windows  .NET Core）。要执行生成的二进制文件，你需要使用一个在 CLR 中启动程序的程序；它通过执行 `dnx.exe` 激活。\n\n\
  有关使用 .NET Core 安装和执行的完整说明，请参见 [`itl.tc/GettingStartedWithDNX`](http://itl.tc/GettingStartedWithDNX)。\n\
  \n注意，OS X 和 Linux 上的 Core 项目旨在编写高性能服务器端代码，而不是编写图形用户界面应用程序；Core .NET 不包含 GUI 库包。要在非\
