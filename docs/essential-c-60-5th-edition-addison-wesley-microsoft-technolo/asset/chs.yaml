  ` 位置的地址赋值，因此 `text` 从未被设置为预期的值。\n\n### 访问引用类型类型的成员\n\n解引用指针会产生一个与指针底层类型相同的变量。然后你可以按照通常的方式使用成员访问运算符“点”（.)来访问底层类型的成员。然而，运算符优先级的规则要求\
