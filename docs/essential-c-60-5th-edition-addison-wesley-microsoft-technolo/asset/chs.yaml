  \ C# 中，一个文件可以包含两个类，而且从 C# 2.0 开始，通过名为“部分类”（partial class）的特性，一个类可以跨越多个文件。\n* *\n\
  `结束 2.0`\n## C# 语法基础\n一旦你成功编译并运行 `HelloWorld` 程序，你就准备好开始剖析代码以学习它的各个部分。首先，考虑 C# 关键字以及开发者选择的标识符。\n\
  * *\n## 初学者主题：关键字\n为了让编译器能够解释代码，C# 中的某些单词具有特殊的状态和含义。这些词被称为**关键字（keywords）**，它们提供了编译器用于解释程序员编写的表达式的具体语法。在\
  \ `HelloWorld` 程序中，`class`、`static` 和 `void` 就是关键字的示例。\n编译器使用关键字来识别代码的结构和组织。因为编译器在解释这些词时具有高优先级，C#\
  \ 要求开发者仅将关键字放置在某些位置。当程序员违反这些规则时，编译器将发出错误。\n* *\n## C# 关键字\n表 1.1 显示了 C# 关键字。\n![图像](img/01tab01.jpg)![图像](img/01tab01a.jpg)\n\
