  \ remainder 2\n\n在高亮的赋值语句中，除法和余数操作在赋值之前执行。运算符的执行顺序由它们的**优先级**和**结合性**决定。目前为止使用的运算符的优先级如下：\n\
  \n1. `*`、`/` 和 `%` 具有最高优先级。\n2. `+` 和 `-` 优先级较低。\n3. `=` 是这六个运算符中优先级最低的。\n\n因此，你可以假设该语句的行为符合预期，除法和余数运算符在赋值之前执行。\n\
  \n如果你忘记为这些二元运算符之一的结果赋值，将收到如输出 3.2 所示的编译错误。\n\n**输出 3.2**\n\n* * *\n\n## 优先级、结合性与求值\n\
  \n当一个表达式包含多个运算符时，编译器必须确定求值的顺序。这通过**优先级**和**结合性**来处理。\n\n**优先级**决定了当存在不同级别的运算符时，哪个运算符先执行。例如，`*`、`/`\
  \ 和 `%` 的优先级高于 `+` 和 `-`。\n\n**结合性**决定了当具有相同优先级的运算符一起出现时的求值顺序。在 C# 中，大多数二元运算符是从左到右的，而赋值运算符是从右到左的。\n\
  \n例如，在表达式 `x+y*z` 中，乘法在加法之前执行，结果为 `x+(y*z)`。在表达式 `x-y-z` 中，因为减法运算符具有相同的优先级，它们从左到右求值，结果为\
  \ `(x-y)-z`。\n\n使用括号使代码更易读通常是一种良好的做法，即使在技术上没有必要。这在处理复杂表达式或运算符优先级对读者可能模糊时尤为如此。例如，在摄氏度到华氏度的转换中，`(c*9.0/5.0)+32`\
  \ 比 `c*9.0/5.0+32` 更易读。\n\n* * *\n\n### 指南\n\n**应该**使用括号使代码更具可读性，特别是当运算符优先级对读者来说并不明确时。\n\
  \n\n\n\n\n```javascript\n\"The original Tacoma Bridge in Washington\\nwas \"\n \
  \ + \"brought down by a \"\n  + windSpeed + \" mile/hour wind.\");\n}\n}\n```\n\n\
  输出 3.3 显示了列表 3.4 的结果。\n\n**输出 3.3**\n\n点击此处查看代码图像\n\n华盛顿州的原始塔科马大桥被每小时 42 英里的风暴摧毁了。\n\
  \n由于不同文化中的语言句式结构各不相同，开发者在处理可能需要本地化的字符串时，应小心不要使用加法运算符。同样，虽然我们可以使用 C# 6.0 的字符串插值在字符串中嵌入表达式，但对其他语言的本地化仍然需要将字符串移动到资源文件中，这会导致字符串插值失效。因此，你应该慎用使用加法运算符，在可能需要本地化时优先使用复合格式化（composite\
  \ formatting）。\n\n### 指南\n\n在可能进行本地化时，**应****使用复合格式化而非使用加法运算符来连接字符串。\n\n### 在算术操作中使用字符\n\
