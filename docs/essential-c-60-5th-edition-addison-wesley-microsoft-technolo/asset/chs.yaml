  # 16. 构建集合\n\n## 16.1 引言\n\n如第 14 章所示，查询运算符适用于所有实现 `IEnumerable<T>` 的集合。然而，这些运算符并没有让所有集合都同样适用于所有任务；仍然需要不同类型的集合。某些集合更适合通过键进行搜索，而另一些则更适合通过位置访问项。某些集合像队列：先进入的元素是先取出的。另一些像栈：先进入的元素是最后出的。还有一些集合完全没有顺序。\n\
  \n.NET Framework 提供了大量的集合类型，适用于许多需要集合的场景。本章介绍了其中一些集合类型以及它们实现的接口。它还描述了如何创建支持标准功能（如索引）的自定义集合。此外，它还探索了如何使用\
  \ `yield return` 来创建实现 `IEnumerable<` 的类。这一 C# 2.0 特性极大地简化了可以使用 `foreach` 语句枚举的集合的实现。\n\
  \n## 16.2 更多集合接口\n\n我们已经看到集合如何实现 `IEnumerable<T>`，这是允许对集合元素进行迭代的主要接口。还存在许多额外的接口被更复杂的集合所实现。图\
  \ 16.1 显示了集合类实现的接口层级结构。\n\n这些接口为执行常见任务提供了标准方式，例如迭代、索引和计数集合中的元素。本节将检查这些接口（至少是所有泛型接口），从图\
  \ 16.1 的底部开始向上移动。\n\n#### IList<T> 与 IDictionary<TKey, TValue>\n\n\n\n\n英文字典可以被看作是定义的集合。通过查找与其相关的“键”（即正在被定义的单词），可以快速访问某个特定的定义。字典集合类（Dictionary\
  \ collection class）同样是一个值的集合，其中每个值都可以通过使用其相关的唯一键来快速访问。然而，请注意，语言字典通常按键的字母顺序存储定义；字典类可能会选择这样做，但通常不会这样做。除非文档专门说明其是有序的，否则字典集合最好被看作是键和关联值对的*无序列表*。同样地，人们通常不会认为要查找“字典中的第六个定义”；字典类通常只按键提供索引，而不按位置提供索引。\n\
  \n相比之下，列表（List）按照特定的顺序存储值，并通过其位置访问它们。在某种意义上，列表只是字典的特例，其中“键”始终是一个整数，且“键集”始终是一个从零开始的连续非负整数集。尽管如此，这种差异足够大，值得用一种完全不同的类型来表示它。\n\
  \n因此，在选择集合类来解决某些数据存储或检索问题时，首先要查找的两个接口是 `IList<T>` 和 `IDictionary<TKey, TValue>`。这些接口指示了集合类型是侧重于在给定位置索引时检索值，还是侧重于给定关联键时检索值。\n\
  \n这两个接口都要求实现它们的类必须提供一个索引器（indexer）。在 `IList<T>` 情况下，索引器的操作数对应于所检索元素的位置：该索引器接收一个整数，并允许您访问列表中的第\
  \ *n* 个元素。在 `IDictionary<TKey, TValue>` 接口情况下，索引器的操作数对应于与值关联的键，并允许您访问该值。\n\n###\
  \ ICollection<T>\n\n`IList<T>` 和 `IDictionary<TKey, TValue>` 都实现了 `ICollection<T>`。没有实现\
  \ `IList<T>` 实现 `IDictionary<TKey, TValue>` 的集合很可能实现了 `ICollection<T>`（尽管不一定，因为集合也可以实现要求较低的\
  \ `IEnumerable` 或 `IEnumerable<T>`）。`ICollection<T>` 派生自 `IEnumerable<T>` 并包含两个成员：`Count`\
  \ 和 `CopyTo()`。\n\n- `Count` 属性返回集合中的元素总数。起初，这似乎就足够使用 `for` 循环遍历集合中的每个元素，但实际上，集合还需要支持按索引进行检索，而\
  \ `ICollection<T>` 接口并不包含这一点（尽管 `IList<T>` 包含了）。\n\n- `CopyTo()` 方法提供了将集合转换为数组的能力。该方法包含一个\
  \ `index` 参数，因此您可以指定在目标数组中插入元素的位置。要使用该方法，您必须初始化目标数组以具有足够的容量，从 `index` 开始以容纳 `ICollection<T>`\
  \ 中的所有元素。\n\n#### 主要集合类\n\n存在五类关键集合类，它们在数据插入、存储和检索方式方面各不相同。每个泛型类都位于 `System.Collections.Generic`\
  \ 命名空间，而它们的非泛型等价类位于 `System.Collections` 命名空间中。\n\n#### 列表集合：List<T>\n\n`List<T>`\
  \ 类具有与数组类似的属性。关键区别在于这些类会随着元素数量的增加自动扩展。（相比之下，数组的大小是固定的。）此外，列表可以通过显式调用 `TrimToSize()`\
  \ 或 `Capacity` 来收缩（参见图 16.2）。\n\n![Image](img/16fig02.jpg)\n\n**图 16.2：List<> 类图**\n\
  \n这些类被归类为列表集合，其区别功能是每个元素都可以被单独访问。由于每个元素都可以通过索引单独访问，这些类被归类为列表集合，其区别功能是每个元素都可以被单独访问。因此，可以像数组一样通过索引访问元素。示例\
  \ 16.1 显示了如何使用。\n\n**示例 16.1：使用 List<T>**\n\n此处查看代码\n\n* * *\n\n此处查看代码\n\n**输出 16.1**\n\
  \n\n\n当一个数据类型有多种可能的排序方式，且没有明显的的最佳方式时，通常使用 `IComparer<T>` 接口。例如，你可能有一个 `Contact`\
  \ 对象的集合，有时你希望按照名称、位置、生日、地理区域或任何其他可能的方式对其进行排序。与其选择一种排序策略并让 `Contact` 类实现 `IComparable<Contact>`，不如创建几个实现\
  \ `IComparer<Contact>` 的不同类可能更为明智。列表 16.2 显示了 `LastName` 和 `FirstName` 比较的示例实现。\n\
  \n### 列表 16.2：实现 IComparer<T>\n\n点击此处查看代码图像\n\n```csharp\nclass Contact\n{\n  public\
  \ string FirstName { get; private set; }\n  public string LastName { get; private\
  \ set; }\n  public Contact(string firstName, string lastName)\n  {\n    this.FirstName\
  \ = firstName;\n    this.LastName = lastName;\n  }\n}\n\n```\n\n```csharp\nusing\
  \ System;\nusing System.Collections.Generic;\n\nclass NameComparison : IComparer<Contact>\n\
  {\n  public int Compare(Contact x, Contact y)\n  {\n      if (Object.ReferenceEquals(x,\
  \ y))\n          return 0;\n      if (x == null)\n          return 1;\n      if\
  \ (y == null)\n          return -1;\n      int result = StringCompare(x.LastName,\
  \ y.LastName);\n      if (result == 0)\n          result = StringCompare(x.FirstName,\
  \ y.FirstName);\n      return result;\n  }\n  private static int StringCompare(string\
  \ x, string y)\n  {\n      if (Object.ReferenceEquals(x, y))\n          return 0;\n\
  \      if (x == null)\n          return 1;\n      if (y == null)\n          return\
  \ -1;\n      return x.CompareTo(y);\n  }\n}\n```\n\n要按姓后按名排序 `List<Contact>`，你可以调用\
  \ `contactList.Sort(new NameComparer())`。\n\n### 全序 (Total Ordering)\n\n在实现 `IComparable<T>`\
  \ 或 `IComparer<T>` 时，你必须产生全序。你的 `CompareTo` 实现必须为任何可能的项目对提供一个完全一致的排序。这种排序需要具备若干个基本特征。例如，每个元素都被要求认为与自己相等。如果元素\
  \ `X` 被认为等于元素 `Y`，且元素 `Y` 被认为等于元素 `Z`，那么这三个元素 `X`、`Y` 和 `Z` 必须被认为相等。如果元素 `X` 被认为大于\
  \ `Y`，则 `Y` 必须认为小于 `X`。而且不能出现“传递性悖论”，也就是说你不能出现 `X` 大于 `Y`、`Y` 大于 `Z` 且 `Z` 大于 `X`。如果你未能提供全序，排序算法的操作将是定义；它可能会产生混乱的排序、可能会崩溃、可能会进入无限循环等。\n\
  \n注意，例如列表 16.2 中的比较器是如何确保全序的，即使参数是空引用也是。例如，说“如果任一个元素为空，则返回零”是不合法的，因为这样两个非空对象可能等于空，但不彼此相等。\n\
  \n### 指南\n\n**务必**确保自定义比较逻辑产生一致的“全序”。\n\n### 搜索 List<T>\n\n若要在 `List<T>` 中搜索特定元素，你将使用\
  \ `Contains()`、`IndexOf()`、`LastIndexOf()` 和 `BinarySearch()` 方法。前三个方法从第一个元素（对于\
  \ `LastIndexOf()` 则从最后一个元素）开始遍历数组，并检查每个元素，直到找到所需的元素为止。这些算法的执行时间与命中发生前所搜索的元素数量成正比。（注意，集合类并不要求集合内的所有元素都是唯一的。如果集合中有两个或多个元素相同，`IndexOf()`\
  \ 返回第一个索引，而 `LastIndexOf()` 返回最后一个索引。）\n\n`BinarySearch()` 使用了快得多的搜索算法，但要求元素必须是排序的。`BinarySearch()`\
  \ 方法的一个有用特性是，如果未找到元素，则返回一个负整数。该值的按位取反（`~`）是比所寻元素更大的元素的索引，如果没有更大的值，则返回元素计数。这为在列表中插入新值以维持排序提供了一种方便的方法。列表\
  \ 16.3 提供了一个示例。\n\n### 列表 16.3：使用 BinarySearch() 的按位取反\n\n点击此处查看代码图像\n\n```csharp\n\
  using System;\nusing System.Collections.Generic;\n\nclass Program\n{\n  static void\
  \ Main()\n  {\n    List<string> list = new List<string>();\n    int search;\n  \
  \  list.Add(\"public\");\n    list.Add(\"protected\");\n    list.Add(\"private\"\
  );\n    list.Sort();\n    search = list.BinarySearch(\"protected\");\n    if (search\
  \ < 0)\n    {\n      list.Insert(~search);\n    }\n  }\n}\n```\n\n\n\n向字典中插入元素的一种方法是使用\
  \ `Add()` 方法，同时传递键和值，如列表 16.5 所示。\n\n### 列表 16.5：向 Dictionary<TKey, TValue> 添加项\n\
  \n点击此处查看代码图片\n\n* * *\n\n```csharp\nusing System;\n\nusing System.Collections.Generic;\n\
  class Program\n{\n  static void Main()\n  {\n      // C# 6.0 (pre-C# 6.0 使用 {\"\
  Error\", ConsoleColor.Red})\n      var colorMap = new Dictionary<string, ConsoleColor>\n\
  \          {\n              [\"Error\"] = ConsoleColor.Red,\n              [\"Warning\"\
  ] = ConsoleColor.Yellow,\n              [\"Information\"] = ConsoleColor.Green\n\
  \          };\n      colorMap.Add(\"Verbose\", ConsoleColor.White);            \
  \ \n      // ...\n  }\n}\n```\n\n* *\n\n在用 C# 6.0 字典初始化器初始化字典后（参见第 14 章中的“集合初始化器”部分），列表\
  \ 16.5 会为键 `\"Verbose\"` 插入字符串 `一个白色的 ConsoleColor`。如果已经添加了具有相同键的元素，则会抛出异常。\n\n\
  添加元素的另一种方法是使用索引器，如列表 16.6 所示。\n\n### 列表 16.6：使用索引运算符向 Dictionary<TKey, TValue> 中插入项\n\
  \n点击此处查看代码图片\n\n* * *\n\n```csharp\nusing System;\n\nusing System.Collections.Generic;\n\
  class Program\n{\n  static void Main()\n  {\n      // C# 6.0 (pre-C# 6.0 使用 {\"\
  Error\", ConsoleColor.Red})\n      var colorMap = new Dictionary<string, ConsoleColor>\n\
  \          {\n              [\"Error\"] = ConsoleColor.Red,\n              [\"Warning\"\
  ] = ConsoleColor.Yellow,\n              [\"Information\"] = ConsoleColor.Green\n\
  \          };\n      colorMap[\"Verbose\"] = ConsoleColor.White;             \n\
  \      colorMap[\"Error\"] = ConsoleColor.Cyan;                                \
  \ \n      // ...\n  }\n}\n```\n\n* *\n\n在列表 16.6 中观察到的第一点是索引运算符不需要整数。相反，索引操作数的类型由第一个类型参数（`string`）指定，而通过索引器设置或检索的值的类型由第二个类型参数（`ConsoleColor`）指定。\n\
  \n在列表 16.6 中注意的第二点是使用了两次相同的键（`\"Error\"`）。在第一次赋值中，没有字典值对应于给定的键。当发生这种情况时，字典集合类会使用提供的键插入新值。在第二次赋值中，已经存在具有指定键的元素。它没有插入额外的元素，而是将\
  \ `\"Error\"` 键先前的 `ConsoleColor` 值替换为 `ConsoleColor.Cyan`。\n\n尝试从不存在键的字典中读取值会抛出\
  \ `KeyNotFoundException`。`ContainsKey()` 方法允许你在访问其值之前检查特定键是否被使用，从而避免异常。\n\n`Dictionary<TKey,\
  \ TValue>` 被实现为“哈希表”；这种数据结构无论字典中存储了多少值，在通过键进行搜索时都能提供快速访问。相比之下，检查集合中是否存在特定值是一个耗时的操作，类似于搜索未排序的列表。要此此，你使用\
  \ `ContainsValue()` 方法，它会按顺序遍历集合中的每个元素。\n\n你使用 `Remove()` 方法删除字典元素，传递的是键而不是元素值。\n\
  \n由于向字典添加值时键和值都是必需的，因此枚举字典元素的 `foreach` 循环变量必须是 `KeyValuePair<TKey, TValue>`。`KeyValuePair<TKey,\
  \ TValue>`。列表 16.7 展示了一个演示使用 `foreach` 循环枚举字典中键和值的代码片段。输出出现在输出 16.3 中。\n\n### 列表\
  \ 16.7：使用 foreach 遍历 Dictionary<TKey, TValue>\n\n点击此处查看代码图片\n\n* * *\n\n```csharp\n\
  using System;\n\nusing System.Collections.Generic;\nclass Program\n{\n  static void\
  \ Main()\n  {\n    // C# 6.0 (pre-C# 6.0 使用 {\"Error\", ConsoleColor.Red})\n   \
  \ Dictionary<string, ConsoleColor> colorMap =\n    new Dictionary<string, ConsoleColor>\n\
  \    {\n        [\"Error\"] = ConsoleColor.Red,\n        [\"Warning\"] = ConsoleColor.Yellow,\n\
  \        [\"Information\"] = ConsoleColor.Green,\n        [\"Verbose\"] = ConsoleColor.White\n\
  \    };\n    Print(colorMap);\n  }\n  private static void Print(IEnumerable<KeyValuePair<string,\
  \ ConsoleColor>> items)\n  {\n    foreach (KeyValuePair<string, ConsoleColor> item\
  \ in items)\n    {\n      Console.ForegroundColor = item.Value;\n      Console.WriteLine(item.Key);\n\
  \    }\n  }\n}\n```\n\n### 输出 16.3\nError\nWarning\nInformation\nVerbose\n\n\n\n\
  \n```csharp\nclass ContactEquality : IEqualityComparer<Contact>\n{\n  public bool\
  \ Equals(Contact x, Contact y)\n  {\n      if (Object.ReferenceEquals(x, y))\n \
  \         return true;\n      if (x == null || y == null)\n          return false;\n\
  \      return x.LastName == y.LastName &&\n          x.FirstName == y.FirstName;\n\
  \  }\n  public int GetHashCode(Contact x)\n  {\n      if (Object.ReferenceEquals(x,\
  \ null))\n          return 0;\n      int h1 = x.FirstName == null ? 0 : x.FirstName.GetHashCode();\n\
  \      int h2 = x.LastName == null ? 0 : x.LastName.GetHashCode();\n      return\
  \ h1 * 23 + h2;\n  }\n}\n```\n\n***\n\n要创建一个使用此相等性比较器的字典，你可以使用构造函数 `new Dictionary<Contact,\
  \ string>(new ContactEquality)`。\n\n***\n\n## 初学者主题：相等性比较的要求\n\n正如第 9 章“良好良好的类型”中所讨论的样，相等性和哈希值算法有几条重要的规则。在集合的上下文中，遵循这些规则至关重要。正如正确对列表排序需要自定义排序比较来提供全序一样，哈希表也需要自定义相等性比较满足某些保证。最重要的要求是，如果\
  \ `Equals()` 对两个对象返回 `true`，则 `GetHashCode()` 必须为这两个对象返回相同的值。请注意，反过来并不成立：两个不相等的项可能具有相同的哈希值。（事实上，必须有两个不相等的项具有相同的哈希值，因为只有\
  \ 2³² 种可能的哈希值，而不相等的对象多于此数量！）\n\n第二个重要的要求是，对同一项调用两次 `GetHashCode()` 在该项处于哈希表的时间内，必须产生相同的结果。然而，请注意，两个“看起来相等”的对象并不要求在程序的两次独立运行中给出相同的哈希值。例如，今天给给定的联系人分配一个哈希值，两周后当你再次运行程序时，为“同一个”联系人分配不同的哈希值，这是完全合法的。不要将哈希值持久化到数据库中，并期望它们在程序的不同运行中保持稳定。\n\
  \n理想情况下，`GetHashCode()` 的结果应该是“随机”的。也就是说，输入的微小变化应该导致输出的大变化，并且结果应该大致均匀地分布在所有可能的整数值上。然而，设计一种极快且产生分布良好输出的哈希算法是很困难的；尝试找到一个良好的平衡点。\n\
  \n最后，`GetHashCode()` 和 `Equals()` 不得抛出异常。注意列表 16.8 中的代码是如何小心地避免引用空引用的例如。\n\n总结一下，这里是关键原则：\n\
  \n- 相等的对象必须具有相同的哈希值。\n- 对象的哈希值在实例的生存周期内不应改变（至少在它处于哈希表期间）。\n- 哈希算法应该快速产生分布良好的哈希值。\n\
  - 哈希算法应该避免在所有可能的对象状态下抛出异常。\n\n***\n\n## 排序集合：SortedDictionary<TKey, TValue> 和 SortedList<T>\n\
  \n排序集合类（参见图 16.4）按键存储 `SortedDictionary<TKey, TValue>` 的元素，按值存储 `SortedList<T>`\
  \ 的元素。如果我们认为列表 16.7 中的代码改为使用 `SortedDictionary<string, string>` 代替 `Dictionary<string,\
  \ string>`，则程序的输出如输出 16.4 所示。\n\n**输出 16.4**\n错误\n信息\n详细\n警告\n\n![Image](img/16fig04.jpg)\n\
  \n**图 16.4：SortedList<> 和 SortedDictionary<> 类图**\n\n注意元素是按键排序的，而不是按值排序。\n\n因为排序集合必须为了维护元素的排序顺序而做额外工作，因此插入和删除通常比在无序字典中插入和删除值慢。\n\
  \n因为排序集合必须按照特定顺序存储项，因此既可以通过键也可以通过索引访问值。若要在排序列表中通过其索引访问键或值，请使用 `Keys` 和 `Values`\
  \ 属性。它们分别返回 `IList<TKey>` 和 `IList<TValue>` 实例；结果集合可以像其他列表一样被索引。\n\n## 栈集合：Stack<T>\n\
  \n第 11 章讨论了栈集合类（参见图 16.5）。栈集合类设计为“后进先出”（LIFO）集合。两个关键方法是 `Push()` 和 `Pop()`。\n\n\
  - `Push()` 将元素插入集合中。元素不需要唯一。\n- `Pop()` 按照添加元素的相反顺序移除元素。\n\n![Image](img/16fig05.jpg)\n\
  \n**图 16.5：Stack<T> 类图**\n\n要在不修改栈的情况下访问栈上的元素，使用 `Peek()` 和 `Contains()` 方法。`Peek()`\
  \ 方法返回顶部的元素。使用 `Contains()` 方法判断栈中是否存在某个元素。\n\n## 队列集合：Queue<T>\n\n队列类（如图 16.6）与栈类相同，但它们遵循“先入先”（FIFO）顺序。`Pop()`\
  \ 和 `Push()` 对应的是 `Dequeue()` 和 `Enqueue()` 方法。队列像一根管道：通过 `Enqueue()` 方法从一端放入对象，通过\
  \ `Dequeue()` 方法从另一端取出对象。与栈类相同，元素不需要唯一，队列类根据需要自动增大大小。如果你知道队列将在一段时间内保持不变，可以使用 `TrimToSize()`\
  \ 方法提示它回收空间。\n\n![Image](img/16fig06.jpg)\n\n**图 16.6：Queue<T> 类图**\n\n## 链表：LinkedList<T>\n\
  \n`System.Collections.Generic` 还支持一种可以正向和反向遍历的链表集合。图 16.7 显示了类图。（没有对应的非泛型类型。）\n\n\
  ![Image](img/16fig07.jpg)\n\n**图 16.7：LinkedList<T> 和 LinkedListNode<T> 类图**\n\n\
  ### 提供索引器\n\n数组、字典和列表提供的索引器作为根据键或索引获取或设置集合成员的方便方法。正如我们所看到的，使用索引器只需在集合名称后方方括号内放入索引（或索引）。可以定义自己的索引器；16.9\
  \ 显示了一个使用 `Pair<T>` 的示例。\n\n**列表 16.9：定义索引器**\n\n点击此处查看代码图像\n\n```csharp\ninterface\
  \ IPair<T>\n{\n  T First { get; }\n  T Second { get; }\n  T this[PairItem index]\
  \ { get; }\n}\n```\n\n***\n\n```csharp\npublic enum PairItem\n{\n  First,\n  Second\n\
  }\n\npublic struct Pair<T> : IPair<T>\n{\n  public Pair(T first, T second)\n  {\n\
  \    First = first;\n    Second = second;\n  }\n  public T First { get; } // C#\
  \ 6.0 读读自动属性\n```\n\n\n\n\n\n```csharp\n  public T Second { get; } // C# 6.0 Getter-only\
  \ Autoproperty\n\n  public T this[PairItem index]\n  { own      get\n      {\n \
  \       switch (index)\n        {\n          case PairItem.First:\n            \
  \  return First;\n          case PairItem.Second:\n              return Second;\n\
  \          default :\n              throw new NotImplementedException(\n       \
  \           string.Format(\n                  \"The enum {0} has not been implemented\"\
  ,\n                  index.ToString()));\n        }\n      }\n  }\n}\n```\n\n索引器的声明方式与属性的声明非常相似，不同之处在于不再使用属性名称，而是使用关键字\
  \ `this` 后跟方括号中的参数列表。其体体也类似于属性，包含 `get` 和 `set` 块。如列表 16.9 所示，参数不需要是 `int`。事实上，索引可以接受多个参数并可以进行重载。此示例使用\
  \ `enum` 来降低调用者提供不存在的项索引的概率。\n\nC# 编译器从索引运算符创建的 CIL 代码是一个带有参数的特殊属性，名为 `Item`。在 C#\
  \ 中无法显式地创建接受参数的属性，因此 `Item` 属性在这方面是唯一的。任何带有标识符 `Item` 的额外成员，即使其签名完全不同，也会与编译器创建的成员冲突，因此将不被允许。\n\
  \n### 高级主题：使用 IndexName 分配索引器名称\n\n如前所述，索引的 CIL 属性名称默认为 `Item`。然而，通过 `IndexerName`\
  \ 特性，你可以指定不同的名称。例如，列表 16.10 将名称更改为 `\"Entry\"`。\n\n#### 16.10: 更改索引器的默认名称\n\n点击此处查看图像\n\
  \n```csharp\n[System.Runtime.CompilerServices.IndexerName(\"Entry\")]\npublic T\
  \ this[params PairItem[] branches]\n{\n// ...\n}\n```\n\n这对于该索引的 C# 调用者没有影响，但它为不支持直接索引器的语言指定了名称。该属性仅仅是告诉编译器使用不同名称作为索引器的指令；该属性实际上并未发射到元数据中，因此无法通过反射访问。\n\
  \n### 高级主题：定义带有变参数的索引运算符\n\n索引运算符也可以接受变参数列表。例如，列表 16.11 为 `BinaryTree<T>` 定义了索引运算符，该内容在第\
  \ 17 章中进行了讨论（并在下一节中再次出现）。\n\n#### 16.1: 定义带有变参数的索引运算符\n\n点击此处查看图像\n\n```csharp\n\
  using System;\npublic class BinaryTree<T>\n{\n// ...\n  public BinaryTree<T> this[params\
  \ PairItem[] branches]\n  {\n    get\n    {\n      BinaryTree<T> currentNode = this;\n\
  \      // 允许使用空数组或 null\n      // 来引用根节点。\n      int totalLevels = branches?.Length\
  \ ?? 0;\n      int currentLevel = 0;\n      while (currentLevel < totalLevels)\n\
  \      {\n        System.Diagnostics.Debug.Assert(branches != null,\n          $\"\
  { nameof(branches) } != null\");\n        currentNode = currentNode.SubItems[\n\
  \          branches[currentLevel]];\n        if (currentNode == null)\n        {\n\
  \          // 此位置的二叉树为空。\n          throw new IndexOutOfRangeException();\n    \
  \    }\n        currentLevel++;\n      }\n      return currentNode;\n    }\n  }\n\
  }\n```\n\n\n\n\n\n枚举模式（enumeration pattern）的问题在于手动实现可能非常麻烦，因为它必须维护描述集合中当前位置所需的所有状态。对于列表集合类型的类，这种内部状态可能是简单的：当前位置的索引就足够了。相比之下，对于需要递归遍历的数据结构（例如二叉树），其状态可能非常复杂。为了缓解实现此模式带来的挑战，C#\
  \ 2.0 引入了一种结构，使得类可以更容易地规定 `foreach` 循环如何迭代其内容。\n\n### 定义迭代器\n\n迭代器（Iterators）是实现类的方法的一种，它们是更复杂的枚举器模式的语法快捷方式。当\
  \ C# 编译器遇到迭代器时，它将其内容展开为实现枚举器模式的 CIL 代码。因此，实现迭代器没有运行时依赖。由于 C# 编译器通过生成 CIL 代码来处理实现，使用迭代器在运行时性能上并没有实际的收益。然而，与手动实现枚举器模式相比，选择迭代器可以显著提高程序员的生产力。为了理解这种改进，我们首先考虑在代码中如何定义迭代器。\n\
  \n### 迭代器语法\n\n迭代器提供了迭代器接口的简写实现，该接口是 `IEnumerable<T>` 和 `IEnumerator<T>` 接口的组合。列表\
  \ 16.12 通过创建一个 `GetEnumerator()` 方法为泛型 `BinaryTree<T>` 类型声明迭代器。接下来，你将为迭代器接口添加支持。\n\
  \n**列表 16.12：迭代器接口模式**\n\n点击此处查看代码图像\n\n***\n\n```assembly\nusing System;\n\nusing\
  \ System.Collections.Generic;\n\npublic class BinaryTree<T>:\n    IEnumerable<T>\n\
  {\n    public BinaryTree ( T value)\n    {\n        Value = value;\n    }\n    #region\
  \ IEnumerable<T>\n\n    public IEnumerator<T> GetEnumerator()\n    {\n        //...\n\
  \    }\n\n    #endregion IEnumerable<T>\n\n    public T Value { get; }  // C# 6.0\
  \ 只读自动属性\n    public Pair<BinaryTree<T>> SubItems { get; set; }\n}\n\npublic struct\
  \ Pair<T>\n{\n    public Pair(T first, T second) : this()\n    {\n        First\
  \ = first;\n        Second = second;\n    }\n    public T First { get; }  // C#\
  \ 6.0 只读自动属性\n    public T Second { get; } // C# 6.0 只读自动属性\n}\n```\n\n***\n\n如列表\
  \ 16.12 所示，我们需要为 `GetEnumerator()` 方法提供一个实现。\n\n### 从迭代器中产出值\n\n迭代器类似于函数，但它们不是返回单个值，而是*产出*（yield）一个值序列，一次返回一个。在\
  \ `BinaryTree<T>` 的情况下，迭代器产出为 `T` 提供的类型参数类型的值序列。如果使用了非泛型的 `IEnumerator` 版本，产出的值将是\
  \ `object` 类型。\n\n要正确实现迭代器模式，你需要维护一些内部状态，以跟踪在枚举集合时的位置。在 `BinaryTree<T>` 案例中，你跟踪树中哪些元素已经被枚举，哪些仍待处理。迭代器会被编译器转换为一个“状态机”，该状态机跟踪当前位置并知道如何“移动自身”到下一个位置。\n\
  \n`yield return` 语句在迭代器每次遇到它时都会产出一个值；控制权立即返回给请求该项目的调用者。当调用者请求下一个项目时，代码将立即从上一次执行的\
  \ `yield return` 语句之后开始执行。在列表 16.13 中，你顺序返回 C# 内置数据类型关键字。\n\n**列表 16.13：顺序产出某些 C#\
  \ 关键字**\n\n点击此处查看代码图像\n\n***\n\n```assembly\nusing System;\n\nusing System.Collections.Generic;\n\
  \npublic class CSharpBuiltInTypes: IEnumerable<string>\n{\n    public IEnumerator<string>\
  \ GetEnumerator()\n    {\n        yield return \"object\";\n        yield return\
  \ \"byte\";\n        yield return \"uint\";\n        yield return \"ulong\";\n \
  \       yield return \"float\";\n        yield return \"char\";\n        yield return\
  \ \"bool\";\n        yield return \"ushort\";\n        yield return \"decimal\"\
  ;\n        yield return \"int\";\n        yield return \"sbyte\";\n        yield\
  \ return \"short\";\n        yield return \"long\";\n        yield return \"double\"\
  ;\n        yield return \"char\";\n        yield return \"void\";\n        yield\
  \ return \"string\";\n        yield return \"uint\";\n        yield return \"ulong\"\
  ;\n        yield return \"float\";\n        yield return \"char\";\n        yield\
  \ return \"bool\";\n        yield return \"ushort\";\n        yield return \"decimal\"\
  ;\n        yield return \"int\";\n        yield return \"sbyte\";\n        yield\
  \ return \"short\";\n        yield return \"long\";\n        yield return \"double\"\
  ;\n        yield return \"char\";\n        yield return \"void\";\n        yield\
  \ return \"string\";\n    }\n}\n\npublic class Program\n{\n    static void Main()\n\
  \    {\n        var keywords = new CSharpBuiltInTypes();\n        foreach (string\
  \ keyword in keywords)\n        {\n            Console.WriteLine(keyword);\n   \
  \     }\n    }\n}\n```\n\n### 迭代器与状态\n\n当 `foreach` 语句被首次调用时，会创建一个迭代器对象，并将其状态初始化为特殊的“开始”状态，表示尚未执行代码。只要调用处的\
  \ `foreach` 语句继续，迭代器就会保持其状态。每当循环请求一个值时，控制权就会进入迭代器并从上次停止的地方继续。当调用处的 `foreach` 语句终止时，迭代器的状态不再被保存。再次调用\
  \ `GetEnumerator()` 总是安全的；必要时将创建“新的”枚举器对象。\n\n图 16.8 显示了发生过程序列图。记住 `MoveNext()`\
  \ 方法出现在 `IEnumerator<T>` 接口上。\n\n![图像](img/16fig08.jpg)\n\n**图 16.8：带有 yield return\
  \ 的序列图**\n\n\n\n\n\n# 列表 16.14: 使用 yield 实现 BinaryTree<T>\n\n点击此处查看代码图像\n\n***\n\
  \n```csharp\npublic struct Pair<T>: IPair<T>,\n    IEnumerable<T>\n{\n  public Pair(T\
  \ first, T second) : this()\n  {\n    First = first;\n    Second = second;\n  }\n\
  \  public T First { get; }  // C# 6.0 只读自动属性\n  public T Second { get; } // C# 6.0\
  \ 只读自动属性\n  #region IEnumerable<T>\n  public IEnumerator<T> GetEnumerator()\n  {\n\
  \    yield return First;\n    yield return Second;\n  }\n  #endregion IEnumerable<T>\n\
  \  #region IEnumerable Members\n  System.Collections.IEnumerator\n  System.Collections.IEnumerable.GetEnumerator()\n\
  \  {\n    return GetEnumerator();\n  }\n  #endregion\n}\n```\n\n在 `列表 16.14`(#ch16.html_ch16lis14)\
  \ 中，对 `Pair<T>` 数据类型的迭代循环两次：首先通过 `yield return First`，然后通过 `yield return Second`。每当遇到\
  \ `GetEnumerator()` 内的 `yield return` 语句时，状态会被保存，执行流似乎“跳出” `GetEnumerator()` 方法并进入循环体。当第二次迭代开始时，`GetEnumerator()`\
  \ 再次执行并遇到 `yield return Second` 语句。\n\n`System.Collections.Generic.IEnumerable<T>`\
  \ 继承自 `System.Collections.IEnumerable`。因此，在实现 `IEnumerable<T>` 时，也有必要实现 `IEnumerable`。在\
  \ `列表 16.14`(#ch16.html_ch16lis14) 中，你显式地这样做，其实现仅涉及调用 `IEnumerable<T>` 的 `GetEnumerator()`。这种从\
  \ `IEnumerable.GetEnumerator()` 到 `IEnumerable<T>.GetEnumerator()` 的调用由于 `IEnumerable<T>`\
  \ 和 `IEnumerable` 之间的类型兼容性（通过继承实现）将始终是有效的。由于两个 `GetEnumerator()` 的签名相同（返回类型不区分签名），因此其中一个或两个实现必须是显式的。鉴于\
  \ `IEnumerable<T>` 版本提供的额外类型安全，你显式地实现了 `IEnumerable` 的实现。\n\n`列表 16.15`(#ch16.html_ch16lis15)\
  \ 使用了 `Pair<T>.GetEnumerator()` 方法并在连续的两行中显示了 `\"Inigo\"` 和 `\"Montoya\"`。\n\n#\
  \ 列表 16.15: 通过 foreach 使用 Pair<T>.GetEnumerator()\n\n点击此处查看代码图像\n\n***\n\n```csharp\n\
  var fullname = new Pair<string>(\"Inigo\", \"Montoya\");\n\nforeach (string name\
  \ in fullname)\n{\n  Console.WriteLine(name);\n}\n```\n\n注意，`foreach` 循环内部对 `GetEnumerator()`\
  \ 的调用是隐式的。\n\n## 在循环中放置 yield return\n\n没有必要硬编码每个 `yield return` 语句，就像你在 `CSharpPrimitiveTypes`\
  \ 和 `Pair<T>` 中做的那样。通过使用 `yield return` 语句，你可以从循环结构内部返回值。`列表 16.16`(#ch16.html_ch16lis16)\
  \ 使用了 `foreach` 循环。每当 `GetEnumerator()` 的 `foreach` 执行时，它都会返回下一个值。\n\n### 列表 16.6:\
  \ 在循环中放置 yield 语句\n\n点击此处查看代码图像\n\n***\n\n```csharp\nclass BinaryTree<T>: IEnumerable<T>\n\
  {\n  // ...\n  #region IEnumerable<T>\n  public IEnumerator<T> GetEnumerator()\n\
  \  {\n    // 返回此节点上的项。\n    yield return Value;\n    // 遍历每个元素。\n    foreach (BinaryTree<T>\
  \ tree in SubItems)\n    {\n      if (tree != null)\n      {\n        // 由于配对中的每个元素都是树，\n\
  \        // 遍历树并 yield 每个元素。\n        foreach (T item in tree)\n        {\n    \
  \      yield return item;\n        }\n      }\n    }\n  }\n  #endregion IEnumerable<T>\n\
  \  #region IEnumerable Members\n  System.Collections.IEnumerator\n  System.Collections.IEnumerable.GetEnumerator()\n\
  \  {\n    return GetEnumerator();\n  }\n  #endregion\n}\n```\n\n在 `列表 16.16`(#ch16.html_ch16lis16)\
  \ 中，第一次迭代返回二叉树中的根元素。在第二次迭代期间，你遍历了子元素对。如果子元素对包含非空值，你将进入该子节点并 yield 它的元素。注意 `foreach\
  \ (T item in tree)` 是对子节点的递归调用。\n\n正如在 `CSharpInTypes` 和 `Pair<T>` 中观察到的样，你现在可以使用\
  \ `foreach` 循环遍历 `BinaryTree<T>`。`列表 16.17`(#ch16.html_ch16lis17) 演示了这一过程，`输出 16.6`(#ch16.html_ch16out06)\
  \ 显示了结果。\n\n# 列表 16.17: 与 BinaryTree<string> 使用 foreach\n\n点击此处查看代码图像\n\n***\n\n\
  ```csharp\n// JFK\nvar jfkFamilyTree = new BinaryTree<string>(\n  \"John Fitzgerald\
  \ Kennedy\");\njfkFamilyTree.SubItems = new Pair<BinaryTree<string>>(\n  new BinaryTree<string>(\"\
  Joseph Patrick Kennedy\"),\n  new BinaryTree<string>(\"Rose Elizabeth Fitzgerald\"\
  ));\n// 祖父母（父系）\njfkFamilyTree.SubItems.First.SubItems =\n  new Pair<BinaryTree<string>>(\n\
  \  new BinaryTree<string>(\"Patrick Joseph Kennedy\"),\n  new BinaryTree<string>(\"\
  Mary Augusta Hickey\"));\n// 祖父母（母系）\njfkFamilyTree.SubItems.Second.SubItems =\n\
  \  new Pair<BinaryTree<string>>(\n  new BinaryTree<string>(\"John Francis Fitzgerald\"\
  ),\n  new BinaryTree<string>(\"Mary Josephine Hannon\"));\nforeach (string name\
  \ in jfkFamilyTree)\n{\n  Console.WriteLine(name);\n}\n```\n\n***\n\n**输出 16.6**\n\
  \nJohn Fitzgerald Kennedy\nJoseph Patrick Kennedy\nPatrick Joseph Kennedy\nMary\
  \ Augusta Hickey\nRose Elizabeth Fitzgerald\nJohn Francis Fitzgerald\nMary Josephine\
  \ Hannon\n\n***\n\n## 高级主题：递归迭代器的危险性\n\n\n\n\n\nListing 16.16 中的代码在遍历二叉树时会创建新的“嵌套”迭代器。结果是当值由某个节点产生时，该值先由该节点的迭代器产生，然后由其父节点的迭代器产生，再由其父父节点的迭代器产生，以此此类推，直到最终由根节点的迭代器产生给原始循环。深度为\
  \ `n` 级的值实际上必须通过 `n` 个迭代器的链向上传递其值。如果二叉树相对较浅，这通常不是问题；然而，不平衡的二叉树可能非常深，因此递归迭代的开销很大。\n\
  \n### 指南\n\n在遍历潜在深度的数据结构时，**请考虑**使用非递归算法。\n\n### 初学者主题：struct 对比 class\n\n将 `Pair<T>`\
  \ 定义为 `struct` 而不是 `class` 的一个有趣的副作用是：`SubItems.First` 和 `SubItems.Second` 无法直接赋值，即使设置器是公共的。如果你将设置器修改为公共，以下代码将产生编译错误，指示\
  \ `SubItems` 无法修改，“因为它们不是变量”：\n\n点击此处查看代码图片\n\n```cs\njfkFamilyTree.SubItems.First\
  \ = new BinaryTree<string>(\"Joseph Patrick Kennedy\");\n```\n\n问题在于 `SubItems`\
  \ 是一个类型为 `Pair<T>`（`struct`）的属性。因此，当属性返回值时，会创建 `SubItems` 的副本，而在副本上赋值 `First` 然后该副本在语句结束时立即丢失，将具有误导性。幸运的是，C#\
  \ 编译器阻止了这种错误。\n\n为了解决这个问题，不要为 `First` 赋值（参见 Listing 16.17 中的方法），使用 `class` 代替 `struct`\
  \ 来定义 `Pair<T>`，不要创建 `SubItems` 属性而是使用字段，或者在 `BinaryTree<T>` 中提供直接访问 `SubItems`\
  \ 成员的属性。\n\n### 取消后续迭代：yield break\n\n有时你可能想要取消后续迭代。你可以通过包含一个 `if` 语句来实现，使得代码中的后续语句不再执行。然而，你也可以使用\
  \ `yield break` 来使 `MoveNext()` 返回 `false`，并将控制权立即返回给调用者并结束循环。Listing 16.18 展示了此类方法的示例。\n\
  \n**列表 16.18：通过 yield break 逃离迭代**\n\n点击此处查看代码图片\n\n```cs\npublic System.Collections.Generic.IEnumerable<T>\
  \ GetNotNullEnumerator()\n{\n  if((First == null) || (Second == null))\n  {\n  \
  \  yield break;\n  }\n  yield return Second;\n  yield return First;\n}\n```\n\n\
  如果 `Pair<T>` 类中的任一元素为 `null`，该方法将取消迭代。\n\n`yield break` 语句类似于在确定没有工作要做时，在函数顶部放置\
  \ `return` 语句。它是一种退出后续迭代的方法，而无需将剩余代码封装在 `if` 块中。因此，它允许多次退出。请谨慎使用，因为对代码的随意阅读可能会忽略早退情况。\n\
  \n### 高级主题：迭代器的工作原理\n\n当 C# 编译器遇到迭代器时，它会将代码展开为用于枚举器模式的适当 CIL。在生成的代码中，C# 编译器首先会创建一个嵌套类来实现实现\
  \ `IEnumerator<T>` 接口，以及它的 `Current` 属性和 `MoveNext()` 方法。`Current` 属性返回一个类型与迭代器的返回类型对应的类型。Listing\
  \ 16.4 中的 `Pair<T>` 包含一个返回 `T` 类型的迭代器。C# 编译器检查迭代器内部的代码，并在 `MoveNext` 方法和 `Current`\
  \ 属性中创建必要的代码以模拟其行为。对于 `Pair<T>` 迭代器，C# 编译器生成大致等效的代码（参见 Listing 16.19）。\n\n**列表 16.19：编译器生成的\
  \ C# 迭代器的 C# 等效代码**\n\n点击此处查看代码图片\n\n```cs\nusing System;\nusing System.Collections.Generic;\n\
  public class Pair<T> : IP<T>, IEnumerable<T>\n{\n  // ...\n  // 迭代器被编译器展开为以下代码\n\
  \  public virtual IEnumerator<T> GetEnumerator()\n  {\n    __Enumerator<T> result\
  \ = new __Enumerator(0);\n    result._Pair = this;\n    return result;\n  }\n  public\
  \ virtual System.Collections.IEnumerator System.Collections.IEnumerable.GetEnumerator()\n\
  \  {\n    return GetEnumerator();\n  }\n  private sealed class __Enumerator<T> :\
  \ IEnumerator<T>\n  {\n    public __Enumerator(int itemCount)\n    {\n      _ItemCount\
  \ = itemCount;\n    }\n    Pair<T> _Pair;\n    T _Current;\n    int _ItemCount;\n\
  \    public object Current\n    {\n      get\n      {\n        return _Current;\n\
  \      }\n    }\n    public bool MoveNext()\n    {\n      switch (_ItemCount)\n\
  \      {\n        case 0:\n          _Current = _Pair.First;\n          _ItemCount++;\n\
  \          return true;\n        case 1:\n          _Current = _Pair.Second;\n \
  \         _ItemCount++;\n          return true;\n        default:\n          return\
  \ false;\n      }\n    }\n    public T Current => _Current; // 为了清晰起见\n    public\
  \ void Dispose() {}\n  }\n}\n```\n\n由于编译器获取 `yield return` 语句并对应于手动编写的类，C# 中的迭代器具有与这些类相同的性能特性。虽然性能没有提升，但程序员生产力的提高是巨大的。\n\
  \n### 高级主题：上下文关键字\n\n许多 C# 关键字是“保留”的，除非前面有 `@` 符号，否则不能作为标识符。`yield` 关键字是一个上下文关键字，而不是保留关键字；声明一个名为\
  \ `yield` 的局部变量是合法的。事实上，在 1.0 版本之后添加到 C# 的所有关键字都是上下文关键字；这有助于在升级现有程序到新语言版本时防止意外破坏。\n\
  \n如果 C# 设计者选择使用 `yield value;` 作为迭代器的语法而不是 `yield return value;`，就会引入一种可能的歧义：`yield(1+2);`\
  \ 现在可能是产生一个值，也可能是将该值作为参数传递给名为 `yield` 的方法。\n\n由于以前不允许标识符 `yield` 紧跟在 `return` 或\
  \ `break` 之前，C# 编译器知道这种 `yield` 的用法是关键字而不是标识符。\n\n### 在单个类中创建多个迭代器\n\n之前的迭代器示例实现了\
  \ `IEnumerable<T>.GetEnumerator()`——`foreach` 隐式寻找的方法。有时你可能需要不同的迭代序列，例如反向迭代、过滤结果或对除默认之外的项目进行迭代。你可以通过将它们封装在返回\
  \ `IEnumerable<T>` 或 `IEnumerable` 的属性或方法中在类中声明额外的迭代器。例如，如果你想反向遍历 `Pair<T>` 的元素，可以提供\
  \ `GetReverseEnumerator()` 方法，如 Listing 16.20 所示。\n\n**列表 16.20：在返回 IEnumerable<T>\
  \ 的方法中使用 yield return**\n\n点击此处查看代码图片\n\n```cs\npublic IEnumerable<T> GetReverseEnumerator()\n\
  {\n  yield return Second;\n  yield return First;\n}\n```\n\n\n\n\n```csharp\n  \
  \      yield return Second;\n\n        yield return First;\n\n    }\n\n...\n}\n\n\
  public void Main()\n{\n    var game = new Pair<string>(\"Redskins\", \"Eagles\"\
  );\n    foreach (string name in game.GetReverseEnumerator())\n    {\n        Console.WriteLine(name);\n\
  \    }\n}\n```\n\n请注意你返回的是 `IEnumerable<T>`，而不是 `IEnumerator<T>`。这与 `IEnumerable<T>.GetEnumerator()`\
  \ 不同，后者返回 `IEnumerator<T>`。`Main()` 中的代码演示了如何使用 `foreach` 循环调用 `GetReverseEnumerator()`。\n\
  \n### yield 语句的要求\n\n你只能在返回 `IEnumerator<T>` 或 `IEnumerable<T>` 类型（或其非泛型等效类型）的成员中使用\
  \ `yield return` 语句。包含 `yield return` 语句的成员体不能有简单的 `return`。如果成员使用了 `yield return`\
  \ 语句，C# 编译器会生成必要的代码来维护迭代器的状态。相比之下，如果成员使用 `return` 语句而不是 `yield return`，则程序员需要负责维护自己的状态机，并返回一个迭代器接口的实例。此外，正如具有返回类型的方法中的所有代码路径必须包含带值的\
  \ `return` 语句（假设它们没有抛出异常）一样，迭代器中的所有代码路径如果要返回任何数据，就必须包含 `yield return` 语句。\n\n如果违反以下对\
  \ `yield` 语句的额外限制，将会导致编译器错误：\n\n- `yield` 语句只能出现在方法、用户定义的操作符、或者索引器或属性的 `get` 访问器内部。该成员不能接受任何\
  \ `ref` 或 `out` 参数。\n- `yield` 语句不能出现在匿名方法或 lambda 表达式的任何位置（参见第 12 章）。\n- `yield`\
  \ 语句不能出现在 `try` 语句的 `catch` 和 `finally` 中。此外，只有在没有 `catch` 块的情况下，`yield` 语句才能出现在\
  \ `try` 块中。\n\n### 总结\n\nC# 2.0 中的泛型集合类和接口优于其非泛型对应项；通过避免装箱开销并在编译时强制执行类型安全，它们的执行速度更快且更安全。除非必须维护与旧\
  \ C# 1.0 代码的兼容性，否则你应该认为整个 `System.Collections` 命名空间都是过时的。换句话说，不必一定要回去删除所有已使用该命名空间的代码。相反，对于任何新代码应使用\
  \ `System.Collections.Generics`，并随着时间的推移考虑将现有代码迁移到相应的泛型集合（其中包含了处理对象集合的接口和类）。\n\n\
  `System.Collections.Generic` 命名空间的引入并不是 C# 2.0 为集合带来的唯一变化。另一个重要的新增内容是迭代器。迭代器涉及一个全新的上下文关键字\
  \ `yield`，C# 使用它来生成底层的 CIL 代码，以实现 `foreach` 循环使用的迭代器模式。\n\n在下一章中，我们将探索反射，这个主题在之前简要提到过，但几乎没有解释。反射允许人们在运行时检查\
  \ CIL 代码中类型的结构。\n\n`2.0 章节结束`\n\n# 17. 反射、属性与动态编程\n\n属性是向程序集插入额外元数据的一种手段，并将元数据与类、方法或属性等编程结构关联。本章将调查框架内置属性的细节，并描述如何定义自定义属性。为了利用自定义属性，必须识别出它们。这是通过反射来实现的。本章从反射开始，包括你如何使用它根据编译时通过名称（或元数据）对成员的调用，在执行时进行动态绑定。这在代码生成器等工具中经常执行。此外，当调用目标未知时，会在执行时使用反射。\n\
  \n![Image](img/0683fig01.jpg)\n\n本章以讨论动态编程结束，这是 C# 4.0 添加的一个功能，极大地简化了对动态数据以及需要执行时而非编译时绑定的数据处理。\n\
  \n### 反射\n\n使用反射可以实现以下操作：\n\n- 访问程序集内类型的元数据。这包括诸如全类型名、成员名称以及装饰该结构的任何属性等构造。\n- 使用元数据在运行时动态调用类型的成员，而不是使用编译定义的绑定。\n\
  \n`Reflection`（反射）检查程序集内元数据的过程。传统上，当代码编译为机器语言时，关于代码的所有元数据（如类型和方法名）都会被丢弃。相比之下，当 C#\
  \ 编译为 CIL 时，它保留了关于代码的大部分元数据。此外，使用反射可以枚举程序集内的所有类型，并搜索符合特定准的类型。你通过 `System.Type` 实例访问类型的元数据，该对象包含了枚举类型实例成员的方法。\n\
  \n反射机制使得许多其他无法获得的新范式成为可能。例如，反射允许你枚举程序集内的所有类型及其成员，并在过程中为文档创建存根（stubs）。然后你可以将从反射获取的元数据与\
  \ XML 注释（使用 `/doc`）结合起来以创建 API 文档。同样，程序员使用反射生成代码，将业务对象持久化（序列化）到数据库中。它也可以用于显示对象集合的列表控件。给定集合，列表控件可以使用反射来迭代对象的所有属性，为每个属性在列表中定义一列。此外，通过调用每个对象上的每个属性，列表控件可以使用对象中包含的数据填充每行和每列，即使对象的数据类型在编译时是未知的。\n\
  \n`XmlSerializer`、`ValueType` 和 `DataBinder` 是框架中几个在部分实现中使用反射的类。\n\n#### 使用 System.Type\
  \ 访问元数据\n\n读取类型元数据的关键是获取一个代表目标类型实例的 `System.Type` 实例。`System.Type` 提供了所有获取类型信息的方法。你可以用它来回答如下问题：\n\
  \n- 类型的名称是什么 (`Type.Name`)？\n- 该类型是公共的吗 (`Type.IsPublic`)？\n- 类型的基类型是什么 (`Type.BaseType`)？\n\
  - 该类型是否支持任何接口 (`Type.GetInterfaces()`)？\n- 该类型定义在哪个程序集中 (`Type.Assembly`)？\n- 类型的属性、方法、字段等是什么（`Type.GetProperties()`、`Type.GetMethods()`、`Type.GetFields()`\
  \ 等）？\n- 哪些属性装饰了该类型 (`Type.GetCustomAttributes()`)？\n\n还有许多许多此类成员，但它们都提供关于特定类型的信息。关键是获取类型\
  \ `Type` 对象的引用，其两种主要方法是通过 `object.GetType()` 和 `typeof()`。\n\n注意，`GetMethods()`\
  \ 调用不返回扩展方法。这些方法仅作为实现类型的静态成员可用。\n\n##### GetType()\n\n\n\n\n\n`object` 包含一个 `GetType()`\
  \ 成员，因此所有类型都包含此函数。你调用 `GetType()` 来获取与原始对象对应的 `System.Type` 实例。列表 17.1 使用来自 `DateTime`\
  \ 的 `Type` 实例演示了这一过程。输出 17.1 显示了结果。\n\n### 列表 17.1：使用 Type.GetProperties() 获取对象的公共属性\n\
  \n点击此处查看代码图片\n\n```csharp\nDateTime dateTime = new DateTime();\n\nType type = dateTime.GetType();\n\
  \nforeach (\n    System.Reflection.PropertyInfo property in\n        type.GetProperties())\n\
  {\n    Console.WriteLine(property.Name);\n}\n```\n\n**输出 17.1**\nDate\nDay\nDayOfWeek\n\
  DayOfYear\nHour\nKind\nMillisecond\nMinute\nMonth\nNow\nUtcNow\nSecond\nTicks\n\
  TimeOfDay\nToday\nYear\n\n调用 `GetType()` 之后，你遍历从 `Type.GetProperties()` 返回的每个 `System.Reflection.PropertyInfo`\
  \ 实例并显示属性名称。调用 `GetType()` 的关键在于你必须有一个对象实例。然而，有时并没有可用的实例。例如，静态类无法实例化，因此没有办法调用 `GetType()`。\n\
  \n### typeof()\n\n获取 `Type` 对象的另一种方法是使用 `typeof` 表达式。`typeof` 在编译时绑定到特定的 `Type`\
  \ 实例，并直接将类型作为参数。。列表 17.2 演示了 `typeof` 在 `Enum.Parse()` 中的用法。\n\n### 列表 17.2：使用 typeof()\
  \ 创建 System.Type 实例\n\n点击此处查看代码图片\n\n```csharp\nusing System.Diagnostics;\n// ...\n\
  \    ThreadPriorityLevel priority;\n    priority = (ThreadPriorityLevel)Enum.Parse(\n\
  \            typeof(ThreadPriorityLevel), \"Idle\");\n// ...\n```\n\n在此列表中，`Enum.Parse()`\
  \ 接收一个标识枚举的 `Type` 对象，然后将字符串转换为特定的枚举值。在这种情况下，它将 `\"Idle\"` 转换为 `System.Diagnostics.ThreadPriorityLevel.Idle`。\n\
  \n同样的列表 7.3](#ch07.html_ch07lis03) 在 `CompareTo(object obj)` 方法内部使用了 `typeof` 表达式，以验证参数\
  \ `obj` 的类型确实是预期的：\n\n点击此处查看代码图片\n\n```csharp\nif(obj.GetType() != typeof(Contact))\
  \ { ... }\n```\n\n`typeof` 表达式在编译时解析，因此类型比较——例如比较调用 `GetType()` 返回的类型——可以判断一个对象是否属于特定类型。\n\
  \n### 成员调用\n\n反射的可能性不仅止于获取元数据。下一步是获取元数据并动态调用它所引用的成员。考虑定义一个类来表示应用程序的命令行的情况。像这样的 `CommandLineInfo`\
  \ 类，其困难之处在于如何用启动应用程序的实际命令行数据填充该类。然而，使用反射，你可以将命令行选项映射到属性名称，然后在运行时动态设置这些属性。列表 17.3\
  \ 演示了这一过程。\n\n### 列表 17.3：动态调用成员\n\n点击此处查看代码图片\n\n```csharp\nusing System;\nusing\
  \ System.Diagnostics;\npublic partial class Program\n{\n    public static void Main(string[]\
  \ args)\n    {\n        string errorMessage;\n        CommandLineInfo commandLine\
  \ = new CommandLineInfo();\n        if (!CommandLineHandler.TryParse(\n        \
  \    args, commandLine, out errorMessage))\n        {\n            Console.WriteLine(errorMessage);\n\
  \            DisplayHelp();\n        }\n        if (commandLine.Help)\n        {\n\
  \            DisplayHelp();\n        }\n        else\n        {\n            if\
  \ (commandLine.Priority !=\n                ProcessClass.Normal)\n            {\n\
  \                // Change 优先级\n            }\n        }\n        // ...\n    private\
  \ static void DisplayHelp()\n    {\n        // 显示命令行帮助。\n        Console.WriteLine(\n\
  \            \"Compress.exe /:< file name > \\n\"\n            + \"/ Priority:RealTime\
  \ | High | \"\n            + \"AboveNormal | Normal | Idle\");\n    }\n}\n\nusing\
  \ System;\nusing System.Diagnostics;\npublic partial class Program\n{\n    private\
  \ class CommandLineInfo\n    {\n        public bool Help { get; set; }\n       \
  \ public string Out { get; set; }\n        public ProcessClass Priority { get; set;\
  \ }\n        = ProcessClass.Normal;\n    }\n}\n\nusing System;\nusing System.Diagnostics;\n\
  using System.Reflection;\npublic class CommandLineHandler\n{\n    public static\
  \ void Parse(string[] args, object commandLine)\n    {\n        string errorMessage;\n\
  \        if (!TryParse(args, commandLine, out errorMessage))\n        {\n      \
  \      throw new ApplicationException(errorMessage);\n        }\n    }\n    public\
  \ static bool TryParse(string[] args, object commandLine,\n        out string errorMessage)\n\
  \    {\n        bool success = false;\n        errorMessage = null;\n        foreach\
  \ (string arg in args)\n        {\n            string option;\n            if (arg[0]\
  \ == '/' || arg[0] == '-')\n            {\n                string[] optionParts\
  \ = arg.Split(\n                    new char[] { ':' }, 2);\n                //\
  \ 移除斜线或横杠\n                option = optionParts[0].Remove(0, 1);\n             \
  \   PropertyInfo property =\n                    commandLine.GetType().GetProperty(option,\n\
  \                        BindingFlags.IgnoreCase |\n                        BindingFlags.Instance\
  \ |\n                        BindingFlags.Public);\n                if (property\
  \ != null)\n                {\n                    if (property.PropertyType ==\
  \ typeof(bool))\n                    {\n                        // 处理索引器的最后的参数\n\
  \                        property.SetValue(\n                            commandLine,\
  \ true, null);\n                        success = true;\n                    }\n\
  \                    else if (property.PropertyType == typeof(string))\n       \
  \             {\n                        property.SetValue(\n                  \
  \          commandLine, optionParts[1], null);\n                        success\
  \ = true;\n                    }\n                    else if (property.PropertyType.IsEnum)\n\
  \                    {\n                        try\n                        {\n\
  \                            property.SetValue(\n                              \
  \  commandLine,\n                                Enum.Parse(\n                 \
  \                   typeof(property.PropertyType),\n                           \
  \         optionParts[1]),\n                                null);\n           \
  \                 success = true;\n                        }\n                 \
  \       catch (ArgumentException)\n                        {\n                 \
  \           success = false;\n                        }\n                    }\n\
  \                }\n            }\n        }\n        return success;\n    }\n}\n\
  ```\n\n\n\n\n\n```csharp\nerrorMessage =\nerrorMessage =\n$@\"The option '{optionParts[1]}'\
  \ is invalid for '{option}'\";\n}\nelse\n{\n    success = false;\n    errorMessage\
  \ =\n        $@\"Data type '{property.PropertyType.ToString()}' on {commandLine.GetType().ToString()}\
  \ is not supported.\";\n}\nelse\n{\n    success = false;\n    errorMessage = $\"\
  Option '{option}' is not supported.\";\n}\nreturn success;\n```\n\n虽然 列表 17.3 很长，但代码相对简单。`Main()`\
  \ 首先实例化了一个 `CommandLineInfo` 类。该类型被专门定义，用于包含该程序的命令行数据。每个属性都对应程序的一个命令行选项，该命令行显示形式所示在输出\
  \ 17.2 中。\n\n**输出 17.2**\n\n点击此处查看图像\n\n`Compress.exe /Out:<file name> /Help`\n\
  `Priority:RealTime|AboveNormal|Normal|BelowNormal|Idle`\n\n`CommandLineInfo` 对象被传递给\
  \ `CommandLineHandler` 的 `TryParse()` 方法。该方法首先开始枚举每个选项并分离出名称（例如，`Help` 或 `Out`）。一旦确定了名称，代码就会对\
  \ `CommandLineInfo` 对象进行反射，寻找具有相同名称的实例。如果找到了属性，则通过调用 `SetValue()` 分配该属性并指定数据。（对于参数，此调用接收要设置的对象、新值以及一个额外的\
  \ `index` 参数，除非该属性是索引器，否则该参数为 `null`。）此列表处理了三种类型：`Boolean`、`string` 和 `enum`。在枚举的情况下，你解析选项值并将文本的等价的等效值赋值给该属性。假设\
  \ `TryParse()` 调用成功，该方法将退出，并使用来自命令行的数据初始化 `CommandLineInfo` 对象。有趣的是，尽管 `CommandLineInfo`\
  \ 是 `Program` 内部的一个私有类，但 `CommandLineHandler` 在对其进行反射时没有问题，甚至可以调用它的成员。换句话说，只要建立了适当的代码访问权限（CAS；参见第\
  \ 21 章），反射就能绕过访问性规则。例如，如果 `Out` 是私有的，`TryParse()` 方法仍然可以为其分配值。正因如此，可以将 `CommandLineHandler`\
  \ 移动到单独的程序并在多个程序之间共享，每个程序都有自己的 `CommandLineInfo` 类。\n\n在这个特定的示例中，你使用 `PropertyInfo.SetValue()`\
  \ 调用了 `CommandLineInfo` 上的一个成员。惊讶的是，`PropertyInfo` 也包含一个 `GetValue()` 方法用于从属性中检索数据。然而，对于方法，有一个带有\
  \ `Invoke()` 成员的 `MethodInfo` 类。`MethodInfo` 和 `PropertyInfo` 都派自 `MemberInfo`（尽管是间接的），如图\
  \ 17.1\n\n### MemberInfo 派生类\n\n在这种情况下，设置 CAS 权限允许私有成员调用，是因为程序是从本地计算机运行的。默认情况下，本地安装的程序属于信任区域并具有适当的权限。从远程位置运行的程序将需要显式授予此类权限。\n\
  \n## 2.0 开始：泛型类型的反射\n\nCLR 2.0 版本中泛型类型的引入使得额外的反射功能成为必要。对泛型的运行时反射确定类或方法是否包含泛型类型以及它可能包含的任何类型参数或参数。\n\
  \n### 确定类型参数的类型\n\n正如你可以对非泛型类型使用 `typeof` 操作符来获取实例一样，你也可以对泛型类型使用 `typeof` 操作符来获取泛型参数，如列表\
  \ 17.4 所示，用于 `Add` 方法。\n\n**列表 17.4：声明 Stack<T> 类**\n\n```csharp\npublic class Stack<T>\n\
  {\n    // ...\n    public void Add(T i)\n    {\n        // ...\n        Type t =\
  \ typeof(T);\n        // ...\n    }\n}\n```\n\n一旦 `TryParse()` 调用成功，该方法将退出，并使用来自命令行的数据初始化\
  \ `CommandLineInfo` 对象。\n\n### 确定类或方法是否支持泛型\n\n在 CLR 2.0 版本中，引入了一些额外的反射方法来确定给定的类型是否支持泛型。泛型参数是泛型类实例化时提供的类型。你可以通过查询\
  \ `Type.ContainsGenericParameters` 属性确定类或方法是否包含泛型参数，如列表 17.5 所示。\n\n**列表 17.5：泛型的反射**\n\
  \n点击此处查看代码图像\n\n```csharp\nusing System;\npublic class Program\n{\n    static void\
  \ Main()\n    {\n        Type type;\n        type = typeof(Nullable<>);\n      \
  \  Console.WriteLine(type.ContainsGenericParameters);\n        Console.WriteLine(type.IsGenericType);\n\
  \        type = typeof(Nullable<DateTime>);\n        Console.WriteLine(type.ContainsGenericParameters);\n\
  \        Console.WriteLine(type.IsGenericType);\n    }\n}\n```\n\n输出 17.3 显示了结果。\n\
  \n### 获取泛型类的类型参数\n\n你可以通过调用 `GetGenericArguments()` 方法从泛型类获取泛型参数列表。结果是 `Type` 实例的数组，其顺序对应它们被声明为泛型类类型参数的顺序。列表\
  \ 17.6 对泛型类型进行反射并获取每个类型参数；输出 17.4 显示了结果。\n\n**列表 17.6：使用泛型使用反射**\n\n```csharp\n\
  using System;\nusing System.Collections.Generic;\npublic partial class Program\n\
  {\n    public static void Main()\n    {\n        Stack<int> s = new Stack<int>();\n\
  \        Type t = s.GetType();\n        foreach(Type type in t.GetGenericArguments())\n\
  \        {\n            Console.WriteLine(\"Type parameter: \" + type.FullName);\n\
  \        }\n    }\n}\n```\n\n\n\n\n\n此上下文关键字在 C# 6.0 中引入，它可以产生一个常量字符串，包含作为指定参数的任何程序元素的未限定名称。在这种情况下，`textDigit`\
  \ 是该方法的一个参数，因此 `nameof(textDigit)` 返回“textDigit”。（由于此操作在编译时完成，因此 `nameof` 在技术上并不属于反射。我们将其包含在此处是因为它最终会接收有关程序集及其结构的数据。）\n\
  \n人们可能会问，使用 `nameof(textDigit)` 相比于直接使用 `\"textDigit\"` 有什么优势（特别是考虑到某些程序员来说，后者似乎甚至更容易用）。其优势有两点：\n\
  \n- C# 编译器可以确保传递 `nameof` 操作符的参数确实是一个有效的程序元素。这有助于在程序元素名称更改时防止错误，有助于防止拼写错误等。\n- IDE\
  \ 工具对 `nameof` 操作符的支持远比对字面量字符串更好。例如，“查找所有引用”工具可以找到 `nameof` 表达式中提到的程序元素，但无法找到字面量字符串中的。自动重命名重构工作也做得更好，等等。\n\
  \n在之前提供的代码段中，`nameof(textDigit)` 生成了参数的名称。然而，`nameof` 操作符适用于任何程序元素。例如，列表 17.7 使用\
  \ `nameof` 将属性名称传递给 `INotifyPropertyChanged.PropertyChanged`。\n\n#### 列表 17.7: 动态调用成员\n\
  \n点击此处查看代码图像\n\n* * *\n\n```csharp\nusing System.ComponentModel;\n\npublic class\
  \ Person : INotifyPropertyChanged\n{\n    public event PropertyChangedEventHandler\
  \ PropertyChanged;\n\n    public Person(string name)\n    {\n        Name = name;\n\
  \    }\n\n    private string _Name;\n    public string Name\n    {\n        get\
  \ { return _Name; }\n        set\n        {\n            if (_Name != value)\n \
  \           {\n                _Name = value;\n                // 使用 C# 6.0 条件空引用引用。\n\
  \                PropertyChanged?.Invoke(\n                    this,\n         \
  \           new PropertyChangedEventArgs(nameof(Name)));\n            }\n      \
  \  }\n    }\n    // ...\n}\n```\n\n* * *\n\n注意，无论是仅提供未限定的“Name”（因为在作用域内），还是使用完全（或部分）限定名称如\
  \ `Person.Name`，结果都只有最后的标识符（点分隔名称中的最后一个元素）。\n\n你仍然可以使用 C# 5.0 的 `CallerMemberName`\
  \ 参数属性来获取属性名称；请参阅 [`itl.tc/CallerMemberName`](http://itl.tc/CallerMemberName) 获取示例。\n\
  \n`结束 6.0`\n\n### 特性 (Attributes)\n\n在深入研究如何编写属性细节之前，我们应该考虑一个展示其效用的用例。在列表 17.3 中的\
  \ `CommandLineHandler` 示例中，你根据匹配属性名称的命令行选项动态设置类的属性。然而，当命令行选项是一个无效的属性名称时，这种方法是不够的。例如，无法支持\
  \ `/?`。此外，这种机制没有提供识别哪些选项是必须的、哪些是可选的的方法。\n\n与其依赖选项名称与属性名称之间的精确匹配，属性提供了一种识别被装饰构造的额外元数据的方法——在这种情况下，即被属性装饰的选项。通过属性，你可以将属性装饰为\
  \ `Required` 并提供 `/?` 选项别名。换句话说，属性是将额外数据与属性（或其他构造）关联的手段。\n\n属性出现在被其装饰构造之前的方括号内。例如，你可以修改\
  \ `CommandLineInfo` 类以包含属性，如列表 17.8 所示。\n\n#### 列表 17.8: 使用属性装饰属性\n\n点击此处查看代码图像\n\
  \n* * *\n\n```csharp\nclass CommandLineInfo\n{\n  [CommandLineSwitchAlias(\"?\"\
  )]\n  public bool Help { get; set; }\n  [CommandLineSwitchRequired]\n  public string\
  \ Out { get; set; }\n  public System.Diagnostics.ProcessPriorityClass Priority\n\
  \      { get; set; } = System.Diagnostics.ProcessPriorityClass.Normal;\n}\n```\n\
  \n* * *\n\n在列表 17.8 中，`Help` 和 `Out` 属性被装饰了属性。这些属性的目的是允许 `Help` 使用 `/?`，并指示 `Out`\
  \ 是必须的。组合属性有两种方法。首先，你可以在同一个括号内用逗号分隔属性。或者，你可以将每个属性放在它自己的括号内。列表 17.9 提供了示例。\n\n####\
  \ 列表 17.9: 使用多个属性装饰属性\n\n点击此处查看代码图像\n\n* * *\n\n```csharp\n[CommandLineSwitchRequired,\
  \ CommandLineAlias(\"FileName\")]\npublic string Out { get; set; }\n```\n\n* * *\n\
  \n```csharp\n[CommandLineSwitchRequired]\n[CommandLineAlias(\"FileName\")]\npublic\
  \ string Out { get; set; }\n```\n\n* * *\n\n除了装饰属性外，开发者还可以使用属性来装饰类、接口、结构体、枚举、委托、事件、方法、构造函数、字段、参数、返回值、程序集和模块。对于大多数情况，应用属性涉及与列表\
  \ 17.9 相同的方括号语法。然而，这种语法不适用于返回值、程序集和模块。\n\n程序集属性用于添加有关程序集的元数据。例如，Visual Studio 的项目向导会生成一个包含许多程序集属性的\
  \ `AssemblyInfo.cs` 文件。列表 17.10 是此类文件的示例。\n\n#### 列表 17.10: AssemblyInfo.cs 中的程序集属性\n\
  \n点击此处查看代码图像\n\n* * *\n\n```csharp\nusing System.Reflection;\nusing System.Runtime.CompilerServices;\n\
  using System.Runtime.InteropServices;\n// 程序集的常规信息通过以下属性集\n// 控制。更改这些属性值以修改\n//\
  \ 与程序集关联的信息。\n[assembly: AssemblyTitle(\"CompressionLibrary\")]\n[assembly: AssemblyDescription(\"\
  \")]\n[assembly: AssemblyConfiguration(\"\")]\n[assembly: AssemblyCompany(\"IntelliTect\"\
  )]\n[assembly: AssemblyProduct(\"Compression Library\")]\n[assembly: AssemblyCopyright(\"\
  Copyright© IntelliTect 2006-2015\")]\n[assembly: AssemblyTrademark(\"\")]\n[assembly:\
  \ AssemblyCulture(\"\")]\n// 设置 ComVisible 为 false 会使程序集中的类型\n// 对 COM 组件可见。如果你需要从\
  \ COM 访问\n// 程序集中的类型，请将该类型上的 \n// 属性设置为 true。\n[assembly: ComVisible(false)]\n//\
  \ 以下 GUID 用于项目暴露到 COM\n// 时的类型库 ID。\n[assembly: Guid(\"417a9609-24ae-4323-b1d6-cef0f87a42c3\"\
  )]\n// 程序集的版本信息由以下四个值组成：\n//\n// 主版本\n// 小版本\n// 构建号\n// 修订号\n// \n// 你可以指定所有值，也可以通过使用\
  \ '*'\n// 设置默认的修订号和构建号，如下所示：\n// [assembly: AssemblyVersion(\"1.0.*\")]\n[assembly:\
  \ AssemblyVersion(\"1.0.0.0\")]\n[assembly: AssemblyFileVersion(\"1.0.0.0\")]\n\
  ```\n\n\n\n\n`assembly` 属性定义了公司、产品和程序集版本号等信息。与 `assembly` 类似，将属性用法标识为 `module` 需要在其前面加上前缀\
  \ `module:`。`assembly` 和 `module` 属性的限制是，它们必须出现在 `using` 指令之后、任何命名空间或类声明之前。列表 17.10\
  \ 中的属性是由 Visual Studio 项目向导生成的，并且应该包含在所有项目中，以标记生成的二进制文件中有关可执行文件或 DLL 内容的信息。\n\n\
  返回属性（如列表 17.11 所示所示）出现在方法声明之前，但使用了相同的语法结构。\n\n**列表 17.11：指定返回属性**\n\n点击此此处查看代码图片\n\
  \n```csharp\n[return: Description(\n    \"如果对象处于有效状态，则返回 true.\")]\npublic bool\
  \ IsValid()\n{\n    // ...\n    return true;\n}\n```\n\n除了 `assembly:` 和 `return:`，C#\
  \ 还允许对 `module:`、`class:` 和 `method:` 进行显式目标标识，分别对应于修饰模块、类和方法的属性。然而，如前所示，`class:`\
  \ 和 `method:` 是可选的。\n\n使用属性的便利性之一是语言考虑了属性的命名规范，该规范要求 `Attribute` 出现在名称的末尾。然而，在前面的列表中的所有属性用法中，并没有出现这种后缀，尽管使用的每个属性都遵循该命名规范。这是虽然在应用属性时允许使用全名（`DescriptionAttribute`、`AssemblyVersionAttribute`\
  \ 等），但 C# 将该后缀设为可选。通常情况下，在应用属性时不会出现这种后缀；它只在定义属性或内联使用属性时（例如 `typeof(DescriptionAttribute)`）才会出现。\n\
  \n### 准南\n\n- **必须**对带有公共类型的程序集应用 `AssemblyVersionAttribute`。\n- **考虑**应用 `AssemblyFileVersionAttribute`\
  \ 和 `AssemblyCopyrightAttribute` 以提供有关程序集的额外信息。\n- **必须**应用以下信息程序集属性：`System.Reflection.AssemblyTitleAttribute`、`System.Reflection.AssemblyCompanyAttribute`、`System.Reflection.AssemblyProductAttribute`、`System.Reflection.AssemblyDescriptionAttribute`、`System.Reflection.AssemblyFileVersionAttribute`\
  \ 和 `System.Reflection.AssemblyCopyrightAttribute`。\n\n### 自定义属性\n\n定义自定义属性是相对简单的。属性是对象；因此，要定义属性，你需要定义一个类。将普通类转换为属性的特征是它派自\
  \ `System.Attribute`。因此，你可以创建一个 `CommandLineSwitchRequiredAttribute` 类，如列表 17.12\
  \ 所示。\n\n**列表 17.12：定义自定义属性**\n\n点击此此处查看代码图片\n\n```csharp\npublic class CommandLineSwitchRequiredAttribute\
  \ : Attribute\n{\n}\n```\n\n有了这个简单的定义，你现在可以像列表 17.8 所示那样使用该属性。到目前，还没有代码响应该属性；因此，包含该属性的\
  \ `Out` 属性对命令行解析没有影响。\n\n### 南\n\n- **必须**为自定义属性类以“Attribute”后缀命名。\n\n### 查找属性\n\
  \n除了为反射类型成员提供属性外，`Type` 还包含了获取修饰该类型的 `Attribute` 的方法。同样，所有反射类型（例如 `PropertyInfo`\
  \ 和 `MethodInfo`）都包含用于获取修饰类型的属性列表的成员。列表 17.13 定义了一个方法，用于返回命令行缺失的必需开关列表。\n\n**列表\
  \ 17.13：检索自定义属性**\n\n点击此此处查看代码图片\n\n```csharp\nusing System;\nusing System.Collections.Specialized;\n\
  using System.Reflection;\n\npublic class CommandLineSwitchRequiredAttribute : Attribute\n\
  {\n    public static string[] GetMissingRequiredOptions(object commandLine)\n  \
  \  {\n        List<string> missingOptions = new List<string>();\n        PropertyInfo[]\
  \ properties = commandLine.GetType().GetProperties();\n        foreach (PropertyInfo\
  \ property in properties)\n        {\n            Attribute[] attributes = (Attribute[])property.GetCustomAttributes(typeof(CommandLineRequiredAttribute),\
  \ false);\n            if (attributes.Length > 0 && property.GetValue(commandLine,\
  \ null) == null)\n            {\n                missingOptions.Add(property.Name);\n\
  \            }\n        }\n        return missingOptions.ToArray();\n    }\n}\n\
  ```\n\n检查属性的代码非常简单。给定的一个 `PropertyInfo` 对象（通过反射获取），你调用 `GetCustomAttributes()` 并指定要查找的属性，然后指定是否检查任何重载方法。（或者，你可以调用不带属性类型的\
  \ `GetCustomAttributes()` 方法来返回所有属性。）虽然可以直接在 `Handler` 的代码中放置查找 `CommandLineRequiredAttribute`\
  \ 属性的代码，但将代码放置在 `CommandLineRequiredAttribute` 类中具有更好的封装性。这通常是自定义属性的模式。将查找属性的代码放在属性类的静态方法中，还有什么更好的位置呢？\n\
  \n### 初始化属性\n\n对 `GetCustomAttributes()` 的调用返回一个对象数组，可以可以强制转换为 `Attribute` 数组。在我们的示例中，由于示例中的属性没有任何实例成员，它提供的唯一元数据是它是否出现。然而，属性也可以封装数据。列表\
  \ 17.14 定义了一个 `CommandLineAliasAttribute`——这是一个提供命令行选项的自定义属性。例如，你可以为 `/Help` 或 `/?`\
  \ 写提供命令行支持。同样，`/S` 可以作为 `/Subfolders` 的别名，指示命令遍历所有子目录。为了支持此功能，你需要为属性提供一个构造函数。具体来说，对于别名，你需要一个接受字符串参数的构造函数。（同样，如果你想允许多个别名，你需要定义一个具有\
  \ `params string` 数组作为参数的属性。）\n\n**列表 17.14：提供属性构造函数**\n\n点击此此处查看代码图片\n\n```csharp\n\
  public class CommandLineAliasAttribute : Attribute\n{\n    public CommandLineAliasAttribute(string\
  \ alias)\n    {\n        Alias = alias;\n    }\n    public string Alias { get; private\
  \ set; }\n}\n\nclass CommandLineInfo\n{\n    [CommandLineSwitchAlias(\"?\")]\n \
  \   public bool Help { get; set; }\n    // ...\n}\n```\n\n\n\n\n\n`PropertyInfo.GetCustomAttributes()`\
  \ 返回的对象将使用指定的构造函数参数进行初始化，如 列表 17.15 所示。\n\n### 列表 17.15：检索特定属性并检查其初始化\n\n点击此处查看代码图片\n\
  \n```csharp\nPropertyInfo property =\n    typeof(CommandLineInfo).GetProperty(\"\
  Help\");\n\nCommandLineSwitchAliasAttribute attribute =\n    (CommandLineSwitchAliasAttribute)\n\
  \        property.GetCustomAttributes(\n            typeof(CommandLineSwitchAliasAttribute),\
  \ false)[0];\nif(attribute.Alias == \"?\")\n{\n  Console.WriteLine(\"Help(?)\");};\n\
  ```\n\n此外，如 列表 17.16 和 列表 17.17 所示，你可以在 `CommandLineAliasAttribute` 的 `GetSwitches()`\
  \ 方法中使用类似的代码。该方法返回一个包含所有开关的字典集合（包括来自属性名的开关），并将每个名称与命令行对象上对应的属性关联。\n\n### 列表 17.16：检索自定义属性实例\n\
  \n点击此处查看代码图片\n\n```csharp\nusing System;\nusing System.Reflection;\nusing System.Collections.Generic;\n\
  \npublic class CommandLineSwitchAliasAttribute : Attribute\n{\n  public CommandLineSwitchAliasAttribute(string\
  \ alias)\n  {\n      Alias = alias;\n  }\n  public string Alias { get; set; }\n\
  \  public static Dictionary<string, PropertyInfo> GetSwitches(\n      object commandLine)\n\
  \  {\n      PropertyInfo[] properties = null;\n      Dictionary<string, PropertyInfo>\
  \ options =\n          new Dictionary<string, PropertyInfo>();\n      properties\
  \ = commandLine.GetType().GetProperties(\n          BindingFlags.Public | BindingFlags.NonPublic\
  \ |\n          BindingFlags.Instance);\n      foreach (PropertyInfo property in\
  \ properties)\n      {\n          options.Add(property.Name.ToLower(), property);\n\
  \          foreach (CommandLineSwitchAliasAttribute attribute in           \n  \
  \            property.GetCustomAttributes(                           \n        \
  \      typeof(CommandLineSwitchAliasAttribute), false))          \n          {\n\
  \              options.Add(attribute.Alias.ToLower(), property);\n          }\n\
  \      }\n      return options;\n  }\n}\n```\n\n### 列表 17.17：更新 CommandLineHandler.TryParse()\
  \ 以处理别名\n\n点击此处查看代码图片\n\n```csharp\nusing System;\nusing System.Reflection;\nusing\
  \ System.Collections.Generic;\n\npublic class CommandLineHandler\n{\n  // ...\n\
  \  public static bool TryParse(\n      string[] args, object commandLine,\n    \
  \  out string errorMessage)\n  {\n      bool success = false;\n      errorMessage\
  \ = null;\n      Dictionary<string, PropertyInfo> options =\n          CommandLineAliasAttribute.GetSwitches(\n\
  \          commandLine);\n      foreach (string arg in args)\n      {\n        \
  \  PropertyInfo property;\n          string option;\n          if (arg[0] == '/'\
  \ || arg[0] == '-')\n          {\n              string[] optionParts = arg.Split(\n\
  \              new char[] { ':' }, 2);\n              option = optionParts[0].Remove(0,\
  \ 1).ToLower();\n              if (options.TryGetValue(option, out property))\n\
  \              {\n                  success = SetOption(\n                     \
  \ commandLine, property,\n                      optionParts, ref errorMessage);\n\
  \              }\n              else\n              {\n                  success\
  \ = false;\n                  errorMessage =\n                      $\"Option '{\
  \ option }' is not supported.\";\n              }\n          }\n      }\n      return\
  \ success;\n  }\n  private static bool SetOption(\n      object commandLine, PropertyInfo\
  \ property,\n      string[] optionParts, ref string errorMessage)\n  {\n      bool\
  \ success;\n      if (property.PropertyType == typeof(bool))\n      {\n        \
  \  // Last parameters for handling indexers.\n          property.SetValue(\n   \
  \           commandLine, true, null);\n          success = true;\n      }\n    \
  \  else\n      {\n          if ((optionParts.Length < 2)\n          || optionParts[1]\
  \ == \"\"\n          || optionParts[1] == \":\")\n          {\n              //\
  \ No setting was provided for the switch.\n              success = false;\n    \
  \          errorMessage = string.Format(\n                  \"You must specify the\
  \ value for the {0} option.\",\n                  property.Name);\n          }\n\
  \          else if (property.PropertyType == typeof(string))\n          {\n    \
  \          property.SetValue(\n                  commandLine, optionParts[1], null);\n\
  \              success = true;\n          }\n          else if (property.PropertyType.IsEnum)\n\
  \          {\n              success = TryParseEnumSwitch(\n                  commandLine,\
  \ optionParts,\n                  property, ref errorMessage);\n          }\n  \
  \        else\n          {\n              success = false;\n              errorMessage\
  \ = string.Format(\n                  \"Data type '{0}' on {1} is not supported.\"\
  ,\n                  property.PropertyType.ToString(),\n                  commandLine.GetType().ToString());\n\
  \          }\n      }\n  }\n}\n```\n\n### 指南\n\n**应当**为具有必需值的属性提供 get 只读属性（带有私有设置器）。\n\
  \n**应当**提供构造函数参数以初始化具有必需属性的属性。每个参数的名称应与相应的属性相同（尽管大小写不同）。\n\n**避免**通过提供构造函数参数来初始化属性属性。\n\
  \n#### System.AttributeUsage\n\n大多数属性都用于装饰特定的结构。例如，允许 `CommandLineOptionAttribute`\
  \ 装饰类或程序集是没有意义的。为了避免不当使用属性，可以使用 `AttributeUsage` 进行装饰。列表 17.18（针对 `CommandLineOptionAttribute`）演示了如何这样做。\n\
  \n### 列表 17.18：限制属性装饰的结构\n\n点击此处查看代码图片\n\n```csharp\n[AttributeUsage(AttributeTargets.Property)]\n\
  public class CommandLineSwitchAliasAttribute : Attribute\n{\n  // ...\n}\n```\n\n\
  如果不当使用属性，如 列表 17.19 所示，它会导致编译错误，如 输出 17.5 所示。\n\n### 列表 17.19：AttributeUsage 限制属性的位置\n\
  \n点击此处查看代码图片\n\n```csharp\n// 错误：属性的使用被限制在属性\n[CommandLineSwitchAlias(\"?\")]\n\
  class CommandLineInfo\n{\n}\n```\n\n#### 输出 17.5\n\n点击此处查看代码图片\n\n```\n...Program+CommandLineInfo.cs(24,17):\
  \ error CS0592: Attribute\n'CommandLineSwitchAlias' 不在此声明类型上有效。它仅对 'property, indexer'\
  \ 声明有效。\n```\n\n`AttributeUsageAttribute` 的构造函数接收一个 `AttributeTargets` 。该枚举提供了运行时允许属性装饰的所有可能目标列表。例如，如果你还允许\
  \ `CommandLineSwitchAliasAttribute` 装饰字段，你将更新 `AttributeUsageAttribute` 类，如 列表 17.20\
  \ 所示。\n\n### 列表 17.20：使用 AttributeUsageAttribute 限制属性的使用\n\n点击此处查看代码图片\n\n```csharp\n\
  // 将属性限制在属性和方法\n```\n\n\n\n\n\n```csharp\n[AttributeUsage(AttributeTargets.Field\
  \ | AttributeTargets.Property)]\npublic class CommandLineSwitchAliasAttribute :\
  \ Attribute\n{\n  // ...\n}\n```\n\n### 指南\n\n**应当**在自定义属性上应用 `AttributeUsageAttribute`\
  \ 类。\n\n---\n\n## 命名参数\n\n除了限制属性可以装饰的内容外，`AttributeUsageAttribute` 还提供了一种机制，允许在单个构造体上重复使用相同的属性。该语法出现在列表\
  \ 17.21 中。\n\n**列表 17.21：使用命名参数**\n\n点击此处查看代码图片\n\n```csharp\n[AttributeUsage(AttributeTargets.Property,\
  \ AllowMultiple=true)]\npublic class CommandLineSwitchAliasAttribute : Attribute\n\
  {\n  // ...\n}\n```\n\n这种语法与之前讨论的构造函数初始化语法不同。`AllowMultiple` 参数是一个`命名参数`，类似于用于可选方法参数的命名参数语法（在\
  \ C# 4.0 中引入）。命名参数提供了一种机制，可以在属性构造函数调用中设置特定的公共属性和字段，即使构造函数本身没有包含相应的参数。命名属性是可选的指定，但它们提供了一种在不提供相应构造函数参数的情况下为属性设置额外实例数据的方法。在这种情况下，`AttributeUsageAttribute`包含一个名为\
  \ `AllowMultiple`的公共成员。因此，当使用该属性时，可以使用命名参数赋值来设置此成员。分配命名参数必须发生在构造函数的最后部分，位于任何显式声明的构造函数参数之后。\n\
  \n命名参数允许分配属性数据，而无需为每种可能的属性指定与未组合提供构造函数。鉴于属性的许多属性可能是可选的，这在许多情况下是一种非常有用的结构。\n\n---\n\
  \n## 初学者主题：FlagsAttribute\n\n第 8 章引入了枚举，并包含一个涵盖 `FlagsAttribute` 的高级主题。此框架定义的属性针对表示标志类型值的枚举。这里的初学者主题也讨论了\
  \ `FlagsAttribute`，从列表 17.22 所示的示例代码开始。\n\n**列表 17.22：使用 FlagsAttribute**\n\n点击此处查看代码图片\n\
  \n```csharp\n// FileAttributes 定义在 System.IO 中。\n[Flags]  //用 FlagsAttribute 装饰枚举。\n\
  public enum FileAttributes\n{\n  ReadOnly =    1<<0,   // 000000000000001\n  Hidden\
  \ =   1<<1,   // 000000000000010\n  // ...\n}\n```\n\n```csharp\nusing System;\n\
  using System.Diagnostics;\nusing System.IO;\n\nclass Program\n{\n  public static\
  \ void Main()\n  {\n      // ...\n      string fileName = @\"enumtest.txt\";\n \
  \     FileInfo file = new FileInfo(fileName);\n      file.Attributes = FileAttributes.Hidden\
  \ |\n          FileAttributes.ReadOnly;\n      Console.WriteLine(\"\\\"{0}\\\" outputs\
  \ as \\\"{1}\\\"\",\n          file.Attributes.ToString().Replace(\",\", \" |\"\
  ),\n          file.Attributes);\n      FileAttributes attributes =\n          (FileAttributes)Enum.Parse(typeof(FileAttributes),\n\
  \          file.Attributes.ToString());\n      Console.WriteLine(attributes);\n\
  \  }\n}\n```\n\n输出 17.6\n\n`Hidden | ReadOnly`\n\n\n\n\n\nC# 编译器在编译期间会注意到被调用方法上的属性，并在假设预处理器标识符存在的情况下，会消除任何对该方法的调用。然而，`ConditionalAttribute`\
  \ 不会影响目标方法本身编译后的 CIL 代码（除了添加属性元数据之外）。相反，它通过在编译期间移除调用来影响**调用点**。这进一步将 `ConditionalAttribute`\
  \ 在跨程序集调用时的行为与 `#if`/`#endif` 区分开来。由于被标记的方法仍然会被编译并包含在目标程序集中，因此是否调用某个方法的判断不是基于调用者程序集中的预处理器标识符，而是基于调用者的程序集。换句话说，如果你创建一个定义了\
  \ `CONDITION_B` 的第二个程序集，那么从第二个程序集对 `Program.MethodB()` 的任何调用都将执行。这在许多跟踪和测试场景中是一个有用特性。事实上，对\
  \ `System.Diagnostics.Trace` 和 `System.Diagnostics.Debug` 的调用在 `TRACE` 和 `DEBUG`\
  \ 预处理器标识符使用 `ConditionalAttribute` 时使用了这一特性。\n\n由于方法不会在预处理器标识符未定义时执行，因此 `ConditionalAttribute`\
  \ 可能无法用于包含 `out` 参数或指定 `void` 以外返回类型的方法。这样做会导致编译时错误。这是合理的，因为被标记方法内的代码可能一个都未执行，因此无法确定向调用者返回什么。类似地，属性不能用\
  \ `ConditionalAttribute` 进行修饰。`ConditionalAttribute` 的 `AttributeUsage`（参见本章前面的标题为`System.AttributeUsageAttribute`”的节）为\
  \ `AttributeTargets.Class`（从 .NET Framework 2.0 开始）和 `AttributeTargets.Method`，这允许该属性用于方法或类。然而，类层上的用法是特殊的，因为\
  \ `ConditionalAttribute` 仅允许在派自 `System.Attribute` 的类上使用。\n\n当 `ConditionalAttribute`\
  \ 修饰自定义属性时（这是从 .NET Framework 2.0 开始的一项功能），只有当条件字符串在调用程序集中定义时，才能通过反射获取后者的该属性。如果没有这样的条件字符串，查找自定义属性的反射将无法找到它。\n\
  \n### System.ObsoleteAttribute\n\n如前所述，预定义属性会影响编译器和/或运行时的行为。`ObsoleteAttribute`\
  \ 提供了影响编译器行为的属性另一个示例。它的目的是帮助代码的版本控制，提供一种方法向调用者指示特定成员或类型不再是当前版本。列表 17.24 是 `ObsoleteAttribute`\
  \ 用法的示例。如输出 17.8 所示，任何编译调用标记有 `ObsoleteAttribute` 成员代码的调用者都会导致编译时警告，可选的错误。\n\n**列表\
  \ 17.24: 使用 ObsoleteAttribute**\n\n点击此处查看代码图像\n\n```csharp\nclass Program\n{\n \
  \ public static void Main()\n  {\n      ObsoleteMethod();\n  }\n  [Obsolete]\n \
  \ public static void ObsoleteMethod()\n  {\n  }\n}\n```\n\n**输出 17.8**\n\n点击此处查看代码图像\n\
  \n```\nc:\\SampleCode\\ObsoleteAttributeTest.cs(24,17): warning CS0612:\nProgram.ObsoleteMethod()'\
  \ is obsolete\n```\n\n在这种情况下，`ObsoleteAttribute` 仅显示一个警告。然而，该属性上还有两个额外的构造函数。其中一个\
  \ `ObsoleteAttribute(string message)` 将额外的消息参数附加到编译器的弃用消息中。此消息的最佳实践是提供关于用什么替换弃用代码的指导建议。第二个构造函数是一个\
  \ `bool error` 参数，它强制将警告记录为错误。\n\n`ObsoleteAttribute` 允许第三方通知开发者已弃用的 API。警告（而非错误）允许原始\
  \ API 继续继续工作，直到开发者能够更新调用代码为止。\n\n### 与序列化相关的属性\n\n通过使用预定义属性，框架支持将对象序列化到流中的能力，以便稍后将它们反序列化回对象。这提供了一种在关闭应用程序之前轻松地将文档类型对象保存到磁盘的方法。之后，可以反序列化文档，以便用户继续对其处理。\n\
  \n尽管对象可能相对复杂，并包含指向许多其他需要序列化的对象的链接，序列化框架仍然用。要使一个对象可序列化，唯一的要求是它必须包含一个 `System.SerializableAttribute`。有了该属性，格式化类会反射可序列化对象并将其复制到流中（参见列表\
  \ 17.25）。\n\n**列表 17.25: 使用 System.SerializableAttribute 保存文档**\n\n点击此处查看代码图像\n\n\
  ```csharp\nusing System;\nusing System.IO;\nusing System.Runtime.Serialization.Formatters.Binary;\n\
  \nclass Program\n{\n  public static void Main()\n  {\n      Stream stream;\n   \
  \   Document documentBefore = new Document();\n      documentBefore.Title = \"A\
  \ cacophony of ramblings from mypourri of notes\";\n      Document documentAfter;\n\
  \      using (stream = File.Open(documentBefore.Title + \".bin\", FileMode.Create))\n\
  \      {\n        BinaryFormatter formatter = new BinaryFormatter();\n        formatter.Serialize(stream,\
  \ documentBefore);\n      }\n      using (stream = File.Open(documentBefore.Title\
  \ + \".bin\", FileMode.Open))\n      {\n        BinaryFormatter formatter = new\
  \ BinaryFormatter();\n        documentAfter = (Document)formatter.Deserialize(stream);\n\
  \      }\n      Console.WriteLine(documentAfter.Title);\n  }\n}\n\n// 可序列化类使用 SerializableAttribute。\n\
  [Serializable]\nclass Document\n{\n  public string Title = null;\n  public string\
  \ Data = null;\n  [NonSerialized]\n  public long _WindowHandle = 0;\n  class Image\n\
  \  {\n  }\n  [NonSerialized]\n  private Image Picture = new Image();\n}\n```\n\n\
  输出 17.9 显示了列表 17.25 的结果。\n\n**输出 17.9**\n\n点击此处查看代码图像\n\nA cacophony of ramblings\
  \ from mypourri of notes\n\n\n\n\n\n不可序列化的字段应该用 `System.NonSerializable` 属性进行装饰，这会告诉序列化框架忽略它们。出于用例原因而不应持久化的字段，也应该出现相同的属性。密码和\
  \ Windows 句柄是不应该序列化的字段的好例子：Windows 句柄是因为它们每次重新创建窗口时都会变化，而密码是因为序列化到流中的数据没有加密，可以被轻易访问。请考虑图\
  \ 17.2 中序列化文档的记事本视图。\n\n![Image](img/17fig02.jpg)\n\n**图 17.2：BinaryFormatter 不加密数据**\n\
  \n代码列表 17.25 设置了 `Title` 字段，生成的 `*.BIN` 文件包含明文文本。\n\n## 提供自定义序列化\n\n添加加密的一种方法是提供自定义序列化。忽略加密和解密的复杂性，这要求在使用\
  \ `SerializableAttribute` 的基础上，还需要实现 `ISerializable` 接口。该接口只需要实现 `GetObjectData()`\
  \ 方法。然而，这对于序列化是够的。为了同样支持反序列化，必须提供一个接受类型 `System.Runtime.Serialization.SerializationInfo`\
  \ 和 `System.Runtime.Serialization.StreamingContext` 参数的构造函数（参见代码列表 17.26）。\n\n**代码列表\
  \ 17.26：实现 System.Runtime.Serialization.ISerializable**\n\n点击此处查看代码图像\n\n***\n\n\
  ```csharp\nusing System;\n\nusing System.Runtime.Serialization;\n\n[Serializable]\n\
  class EncryptableDocument :\n    ISerializable\n{\n  public EncryptableDocument(){\
  \ }\n\n  enum Field\n  {\n      Title,\n      Data\n  }\n  public string Title;\n\
  \  public string Data;\n\n  public static string Encrypt(string data)\n  {\n   \
  \   string encryptedData = data;\n      // Key-based encryption ...\n      return\
  \ encryptedData;\n  }\n\n  public static string Decrypt(string encryptedData)\n\
  \  {\n      string data = encryptedData;\n    // Key-based decryption...\n     \
  \ return data;\n  }\n\n#region ISerializable Members\n\n      public void GetObjectData(\n\
  \      SerializationInfo info, StreamingContext context)\n  {\n      info.AddValue(\n\
  \          Field.Title.ToString(), Title);\n      info.AddValue(\n          Field.Data.ToString(),\
  \ Encrypt(Data));\n  }\n  public EncryptableDocument(\n      SerializationInfo info,\
  \ StreamingContext context)\n  {\n      Title = info.GetString(\n          Field.Title.ToString());\n\
  \      Data = Decrypt(info.GetString(\n          Field.Data.ToString()));\n  }\n\
  #endregion\n}\n```\n\n***\n\n本质上，`System.Runtime.Serialization.SerializationInfo`\
  \ 对象是一个名称/值对集合。当序列化时，`GetObject()` 实现调用 `AddValue()`。要反转这一过程，你调用一个 `Get*()` 成员。在这种情况下，分别在序列化和反序列化之前进行加密和解密。\n\
  \n## 序列化的版本控制\n\n另一个值得的序列化点是：版本控制。文档对象可以使用程序集的一个版本进行序列化，并使用较新的版本进行反序列化；反之也可能发生。然而，如果程序员没有足够的注意，在这个过程中很容易引入版本不兼容性，有时甚至是出乎意料的。考虑表\
  \ 17.1 所示的场景。\n\n![Image](img/17tab01.jpg)![Image](img/17tab01a.jpg)\n\n**表 17.1：反序列化新版本抛出异常**\n\
  \n令人惊讶的是，尽管你只是添加了一个新字段，反序列化原始文件也会抛出 `System.Runtime.Serialization.SerializationException`。这是因为格式化器在流中寻找与新字段对应的数据。无法找到此类数据就会抛出异常。\n\
  \n`开始 2.0`\n\n为了避免这个问题，使用 .Net Framework 2.0。\n\n\n\n\n\n反射的一个关键特性是能够根据执行时对成员名称或其他特性（如属性）的识别，在特定类型上动态地查找并调用成员（参见\
  \ 列表 17.3）。然而，C# 4.0 引入的动态对象（dynamic objects）提供了一种更简单的通过反射调用成员的方法，前提是编译时已知该成员的签名。重申一下，这一限制意味着在编译时我们需要知道成员名称以及签名（参数的数量以及指定的参数在类型上是否与签名兼容）。列表\
  \ 17.30（附带 输出 17.10）提供了一个示例。\n\n### 列表 17.30：使用“反射”进行动态编程\n\n点击此处查看代码图像\n\n* * *\n\
  \n```csharp\nusing System;\n\n// ...\n\ndynamic data =\n  \"Hello!  My name is Inigo\
  \ Montoya\";\n\nConsole.WriteLine(data);\n\ndata = (double)data.Length;\n\ndata\
  \ = data * 3.5 + 28.6;\n\nif(data == 2.4 + 112 + 26.2)\n{\n  Console.WriteLine(\n\
  \      $\"{ data } makes for a long triathlon.\");\n}\nelse\n{\n  data.NonExistentMethodCallStillCompiles();\n\
  }\n\n// ...\n```\n\n* * *\n\n### 输出 17.10\n\n点击此处查看代码图像\n\n```\nHello!  My name\
  \ is Inigo Montoya\n\n140.6 makes for a long triathlon.\n```\n\n在这个示例中，没有显式代码来确定对象类型、查找特定的\
  \ `MemberInfo` 实例并调用它。相反，`data` 被声明为 `dynamic` 类型，并直接对其调用方法。在编译时，不会检查指定的成员是否可用，甚至不会检查\
  \ `dynamic` 对象的底层类型是哪个。因此，只要语法有效，在编译时可以进行任何调用。在编译时，是否存在真正对应的成员并不重要。\n\n然而，类型安全并没有被完全放弃。对于标准的\
  \ CLR 类型（如列表 17.30 中使用的类型），通常在编译时用于非 `dynamic` 类型的相同类型检查器会在执行时用于 `dynamic` 类型调用。因此，在执行时，如果没有此类成员，该调用将导致\
  \ `Microsoft.CSharp.RuntimeBinder.RuntimeBinderException`。\n\n请注意，这种能力并没有本章前面描述的反射那么灵活，尽管\
  \ API 无疑更简单。使用动态对象的关键区别在于，需要在编译时识别签名，而不是在运行时确定成员名称等信息（正如我们在解析命令行参数时所的那样）。\n\n####\
  \ dynamic 的原理和行为\n\n列表 17.30 和相关文字揭示了 `dynamic` 数据类型的若干特征。\n\n- `dynamic` 是一个指示编译器生成代码的指令。\n\
  \n`dynamic` 涉及一种拦截机制，当运行时遇到动态调用时，它可以将请求编译为 CIL，然后调用新编译的调用。（更多细节请参阅本章节后面后题为“揭秘 `dynamic`”的高级主题。）\n\
  \n当类型赋值给 `dynamic` 时，其作用原理是在概念上“封装”原始类型，以便不发生编译时验证。此外，当在运行时调用成员时，“封装器”会拦截调用并进行适当的分发（或拒绝）。在\
  \ `dynamic` 对象上调用 `GetType()` 会揭示动态实例的底层类型——它不会返回 `dynamic` 作为类型。\n\n- 任何转换为 object\
  \ 的类型都会转换为 `dynamic`。\n\n在列表 17.29 中，我们成功地将值类型（`double`）和引用类型（`string`）转换为 `dynamic`。事实上，所有类型都可以成功转换为\
  \ `dynamic` 对象。从任何引用类型到 `dynamic` 都有隐式转换。同样，从值类型到 `dynamic` 也有隐式转换（装箱转换）。此外，从 `dynamic`\
  \ 到 `dynamic` 也有隐式转换。这可能是显而易见的，但对于 `dynamic` 来说，这个过程比简单的从一个位置拷贝“指针”（地址）到另一个位置要复杂。\n\
  \n- 从 `dynamic` 到替代类型的成功转换取决于底层类型是否支持。\n\n从 `dynamic` 对象到标准 CLR 类型的转换是显式强制转换（例如，`(double)data.Length`）。不意外，如果目标类型是值类型，则需要拆箱转换。如果底层类型支持转换为目标类型，从\
  \ `dynamic` 的转换也将成功。\n\n- `dynamic` 类型的底层类型可以从一次赋值变为下一次。\n\n与隐式类型变量（`var`）不同，后者不能重新赋值为不同的类型，`dynamic`\
  \ 在执行底层类型代码之前包含一种编译拦截机制。\n\n- 不会验证底层类型上是否存在指定的签名——但实际上它会验证。\n\n正如方法 `person.NonExistentMethodCallStillCompiles()`\
  \ 所示，编译器不会对 `dynamic` 上的操作进行验证。这一步完全留给代码执行时。此外，即使代码没有执行（如 `person.NonExistentMethodCallStillCompiles()`），也不会发生验证和绑定。\n\
  \n- 任何 `dynamic` 成员调用的结果都是编译时类型 `dynamic`。\n\n对 `dynamic` 对象的任何成员调用都将返回 `dynamic`\
  \ 对象。因此，如 `data.ToString()` 之类的调用返回的是 `dynamic` 对象而不是底层的 `string` 类型。然而，在执行时，当在\
  \ `dynamic` 对象上调用 `GetType()` 时，返回的是运行时类型的对象。\n\n- 如果指定的成员在运行时不存在，运行时将抛出 `Microsoft.CSharp.RuntimeBinder.RuntimeBinderException`\
  \ 异常。\n\n如果在运行时尝试调用成员，运行时将验证成员调用是否真实有效（例如在反射的情况下，签名在类型上是否兼容）。如果方法签名不兼容，运行时将抛出 `Microsoft.CSharp.RuntimeBinder.RuntimeBinderException`。\n\
  \n- 使用反射的 dynamic 不支持扩展方法。\n\n就像使用 `System.Type` 进行反射一样，使用 `dynamic` 进行反射不支持扩展方法。扩展方法的调用在实现类型上仍然可用（例如\
  \ `System.Linq.Enumerable`），但无法直接在扩展类型上调用。\n\n- 核心，`dynamic` 是一个 `System.Object`。\n\
  \n由于任何对象都可以成功转换为 `dynamic`，并且 `dynamic` 可以被显式转换为不同的对象类型，`dynamic` 的行为就像 `System.Object`。与\
  \ `System.Object` 一样，它在默认值上甚至返回 `null`（`default(dynamic)`），表明它是一个引用类型。`dynamic`\
  \ 与 `System.Object` 区分的特殊动态行为只出现在编译时。\n\n\n\n\nCIL 反汇编器显示，在 CIL 内部，`dynamic` 类型实际上是\
  \ `System.Object`。事实上，在没有任何调用的情况下，`dynamic` 类型的声明与 `System.Object` 无异。然而，在调用成员时，差异变得明显起来。为了调用该成员，编译器声明了一个类型为\
  \ `System.Runtime.CompilerServices.CallSite<T>` 的变量。`T` 根据成员签名而变化，但像调用 `ToString()`\
  \ 这样简单的操作需要实例化 `CallSite<Func<CallSite, object, string>>` 类型，并调用一个带有参数 `CallSite\
  \ site`、`object dynamicTarget` 和 `string result` 的方法。`site` 是调用点本身，`dynamicTarget`\
  \ 是调用方法所在的 `object`，而 `result` 是来自 `ToString()` 方法调用的底层返回值。与其直接实例化 `CallSite<Func<CallSite\
  \ _site, object dynamicTarget, string result>>`，不如使用 `Create()` 工厂方法来实例化它（`Create()`\
  \ 接收一个类型为 `Microsoft.CSharp.RuntimeBinder.CSharpConvertBinder` 的参数）。给定 `CallSite<T>`\
  \ 的实例，最后一步涉及调用 `CallSite<T>.Target()` 以执行实际的成员。\n\n在执行时的底层，框架使用反射来查找成员并验证签名是否匹配。接下来，运行时构建一个表达式树，表示由调用点定义的动态表达式。一旦表达式树编译完成，我们就有了与编译器在调用不是动态时生成的代码相似的\
  \ CIL 方法体。这段 CIL 代码随后缓存在调用点中，并使用委托调用（invoke）进行调用。由于 CIL 现在已缓存在调用点，下次调用就不需要再次经历所有的反射和编译开销。\n\
  \n***\n\n### 为什么使用动态绑定？\n\n除了反射，我们还可以定义动态调用的自定义类型。例如，你可能考虑使用动态调用来获取 XML 元素的值。与其使用列表\
  \ 17.31 中的强类型语法，不如使用动态调用调用 `person.FirstName` 和 `person.LastName`。\n\n**列表 17.31：不使用\
  \ dynamic 的 XML 元素运行时绑定**\n\n点击此处查看代码图像\n\n```assembly\nusing System;\n\nusing System.Xml.Linq;\n\
  \n// ...\n\nXElement person = XElement.Parse(\n    @\"<Person>\n      <FirstName>Inigo</FirstName>\n\
  \      <LastName>Montoya</LastName>\n</Person>\");\n\nConsole.WriteLine(\"{0} {1}\"\
  ,\n  person.Descendants(\"FirstName\").FirstOrDefault().Value,\n  person.Descendants(\"\
  LastName\").FirstOrDefault().Value);\n// ...\n```\n\n虽然列表 17.31 中的代码并不复杂，但将其与列表\
  \ 17.32 对比——这是一个使用动态类型对象的替代方法。\n\n**列表 17.32：使用 dynamic 的 XML 元素运行时绑定**\n\n点击此处查看代码图像\n\
  \n```csharp\nusing System;\n\n// ...\n\ndynamic person = DynamicXml.Parse(\n  @\"\
  <Person>\n      <FirstName>Inigo</FirstName>\n      <LastName>Montoya</LastName>\n\
  \  </Person>\");\n\n  Console.WriteLine(\n      $\"{ person.FirstName } { person.LastName\
  \ }\");\n// ...\n```\n\n优势显而易见，但这就意味着动态编程优于静态编译吗？\n\n### 静态编译与动态编程\n\n在列表 17.32\
  \ 中，我们拥有与列表 17.31 相同的功能，尽管有一个非常重要的区别：列表 17.31 完全是静态类型的。因此，在编译时，所有类型及其成员签名都通过这种方法进行验证。方法名必须匹配，并且会检查所有参数的兼容性。这是\
  \ C# 的一个关键特性，也是我们在全书中强调的重点。\n\n相比之下，列表 17.32 几乎没有静态类型代码；变量 `person` 而是 `dynamic`。因此，在编译时无法验证\
  \ `person` 是否拥有 `FirstName` 或 `LastName` 属性（或任何其他成员）。此外，在 IDE 中编写代码时，没有 IntelliSense\
  \ 可以识别 `person` 上的任何成员。\n\n类型的丧失似乎会导致功能大幅减少。那么，为什么 C# 中甚至会有这种可能性呢——事实上，这种功能是在 C#\
  \ 4.0 中引入的？\n\n为了理解这个表面上的悖论，让我们重新检查列表 17.32。注意获取 \"FirstName\" 的调用。\n\n***\n\n###\
  \ 实现动态对象\n\n定义自定义动态类型的关键是实现 `System.Dynamic.IDynamicMetaObjectProvider` 接口。然而，与其从零实现该接口，优选的方法是从\
  \ `System.Dynamic.DynamicObject` 派生出来。它为许多成员提供了默认实现，并允许你覆盖不符合要求的成员。列表 17.33 显示了完整的实现。\n\
  \n\n\n\n\n```csharp\npublic class DynamicXml : DynamicObject\n{\n  private XElement\
  \ Element { get; set; }\n\n  public DynamicXml(System.Xml.Linq.XElement element)\n\
  \  {\n      Element = element;\n  }\n\n  public static DynamicXml Parse(string text)\n\
  \  {\n      return new DynamicXml(XElement.Parse(text));\n  }\n\n  public override\
  \ bool TryGetMember(\n      GetMemberBinder binder, out object result)\n  {\n  \
  \    bool success = false;\n      result = null;\n      XElement firstDescendant\
  \ =\n          Element.Descendants(binder.Name).FirstOrDefault();\n      if (firstDescendant\
  \ != null)\n      {\n          if (firstDescendant.Descendants().Count() > 0)\n\
  \          {\n              result = new DynamicXml(firstDescendant);\n        \
  \  }\n          else\n          {\n              result = firstDescendant.Value;\n\
  \          }\n          success = true;\n      }\n      return success;\n  }\n\n\
  \  public override bool TrySetMember(\n      SetMemberBinder binder, object value)\n\
  \  {\n      bool success = false;\n      XElement firstDescendant =\n          Element.Descendants(binder.Name).FirstOrDefault();\n\
  \      if (firstDescendant != null)\n      {\n          if (value.GetType() == typeof(XElement))\n\
  \          {\n              firstDescendant.ReplaceWith(value);\n          }\n \
  \         else\n          {\n              firstDescendant.Value = value.ToString();\n\
  \          }\n          success = true;\n      }\n      return success;\n  }\n}\n\
  ```\n\n此用用例的关键动态实现方法是 `TryGetMember()` 和 `TrySetMember()`（假设你也想分配元素）。只需这两种方法的实现即可支持对动态获取和设置器属性的调用。此外，这些实现是非常直观的。首先，它们检查包含的\
  \ `XElement`，寻找名称与 `binder.Name`（即被调用成员的名称）相同的元素。如果存在对应的 XML 元素，则获取（或设置）该值。如果元素存在，则返回\
  \ `true`，否则返回 `false`。返回 `false` 将立即导致运行时在动态成员调用的调用处抛出 `Microsoft.CSharp.RuntimeBinder.RuntimeBinderException`。\n\
  \n如果需要更多的动态调用，`System.Dynamic.DynamicObject` 支持额外的虚拟方法。列表 17.34 输出了所有可重写成员的列表。\n\
  \n**列表 17.34：System.Dynamic.DynamicObject 可重写成员**\n\n点击此处查看代码图像\n\n```csharp\nusing\
  \ System.Dynamic;\npublic class DynamicObject : IDynamicMetaObjectProvider\n{\n\
  \  protected DynamicObject();\n  public virtual IEnumerable<string> GetDynamicNames();\n\
  \  public virtual DynamicMetaObject GetMetaObject(Expression parameter);\n  public\
  \ virtual bool TryBinaryOperation(BinaryOperationBinder binder, object arg, out\
  \ object result);\n  public virtual bool TryConvert(ConvertBinder binder, out object\
  \ result);\n  public virtual bool TryCreateInstance(CreateInstanceBinder binder,\
  \ object[] args, out object result);\n  public virtual bool TryDeleteIndex(DeleteIndexBinder\
  \ binder, object[] indexes);\n  public virtual bool TryDeleteMember(DeleteMemberBinder\
  \ binder);\n  public virtual bool TryGetIndex(GetIndexBinder binder, object[] indexes,\
  \ out object result);\n  public virtual bool TryGetMember(GetMemberBinder binder,\
  \ out object result);\n  public virtual bool TryInvoke(InvokeBinder binder, object[]\
  \ args, out object result);\n  public virtual bool TryInvokeMember(InvokeMemberBinder,\
  \ object[] args, out object result);\n  public virtual bool TrySetIndex(SetIndexBinder\
  \ binder, object[] indexes, object value);\n  public virtual bool TrySetMember(SetMemberBinder\
  \ binder, object value);\n  public virtual bool TryUnaryOperation(UnaryOperationBinder\
  \ binder, out object result);\n}\n```\n\n如 列表 17.34 所示，对于所有内容都有成员实现——从类型转换和各种操作到索引调用。此外，还有一个方法用于检索所有可能的成员名称：`GetDynamicNames()`。\n\
  \n### 4.0 节总结\n\n本章讨论了如何使用反射来读取编译到 CIL 中的元数据。通过反射，可以提供一种晚绑定，其中调用的代码是在运行时定义的，而不是编译时定义的。虽然反射对于部署动态系统是完全可行的，但它的执行速度比静态链接（编译时）定义的代码要慢得多。这往往使得它在性能可能不那么关键的开发工具中更加流行和有用。\n\
  \n反射还允许以属性的形式检索装饰在各种构造体上的额外元数据。通常，使用反射来查找自定义属性。你可以定义自己的自定义属性，将你选择的额外元数据插入到 CIL 中。在运行时，你可以检索这些元数据并在编程逻辑中使用它们。\n\
  \n许多程序员将属性视为“面向切面编程”概念的前身，在那种编程中，你通过属性等构造体来添加功能，而不是在需要的地方手动实现功能。在 C# 中看到真正的切面（如果有的话）还需要一段时间时间；然而，属性为该方向提供了一个清晰的垫脚石，且不会对语言的稳定性产生重大风险。\n\
  \n最后，本章包含了 C# 4.0 引入的一个特性——使用新类型 `dynamic` 进行动态编程。这部分内容讨论了尽管在 API 是强类型时优选静态绑定，但在处理动态数据时具有局限性。\n\
  \n下一章将介绍多线程，其中属性被用于同步。\n\n## 18. 多线程\n\n过去十年的两个趋势对软件开发领域产生了巨大影响。首先，计算成本的持续下降不再由时钟速度和晶体密度的增加驱动，如图\
  \ 18.1![Image](img/18fig01.jpg)\n\n**图 18.1：随时间变化的时钟速度**\n\n（图由 Herb Sutter 编译。经许可使用。原文见\
  \ [gotw.ca](http://www.gotw.ca））\n\n其次，计算现在涉及巨大的延迟。简单来说，延迟是获取所需结果所需。延迟有两个主要原因。**处理器绑定延迟**发生在计算任务复杂时；如果一次计算需要执行\
  \ 120 亿次算术运算，而可用处理能力仅为每秒 60 亿次，那么在请求和获取结果之间至少会产生 2 秒的处理器绑定延迟。相比之下，**I/O 绑定延迟**是指从外部源（如磁盘驱动器、Web\
  \ 服务器等）获取数据所需的延迟。任何需要从物理位置距离客户端较远的 Web 服务器获取数据的计算都会产生等于数百万个处理器周期的延迟。\n\n\n\n\n\n\
  这两个趋势的结合为现代软件开发人员带来了巨大的挑战。鉴于机器的计算能力比以往任何时候都强大，我们该如何有效利用这些力量来快速向用户交付结果，同时又不损害用户体验呢？我们该如何避免创建出在触发高延迟操作时卡死的、令人沮丧的用户界面？此外，我们该如何将\
  \ CPU 密集型工作分配到多个处理器上，以减少计算所需的时间？\n\n保持用户界面响应且 CPU 利用率高的软件工程标准技术是编写 `multithreaded`（多线程）程序，以“并行”的方式执行多次计算。不幸的是，多线程逻辑以难以正确著称；接下来的两个章节中，我们将探索导致多线程困难的原因，并学习如何使用更高级的抽象和新语言特性来减轻这一负担。\n\
  \n我们将讨论的高级抽象主要包括：首先是随 .NET 4.0 发布的并行扩展库的两个主要组件[#ch18]——`Task Parallel Library (TPL)`\
  \ 和 `Parallel LINQ (PLINQ)`；其次是 `Task-based Asynchronous Pattern (TAP)` 及其在 C# 5.0\
  \ 中相应的语言支持。尽管我们强烈鼓励你使用这些高级抽象，但在本章中，我们也涵盖了 .NET 运行时之前版本的某些低级线程 API。C# 5.0 之前的其他多线程模式可以在\
  \ [`IntelliTect.com/EssentialCSharp`](http://IntelliTect.com/EssentialCSharp) 下载，连同\
  \ *Essential C# 3.0* 的章节。因此，如果你想完全理解没有后期功能的多线程编程资源，你仍然可以访问这些材料。\n\n[#ch18]. 这些库可以通过下载适用于\
  \ .NET 3.5 的 Reactive Extensions 库来现在 .NET 3.5 中可用，但这并不受到官方支持。\n\n我们将从几个初学者主题开始本章，以防你对多线程还不熟悉。然后，我们将简要讨论不使用并行扩展库的“传统”线程操作，以确保你对线程操作有基本的理解；下一章将详细介绍该主题。随后，我们在本章的大部分内容按顺序涵盖\
  \ `TPL`、`TAP` 和 `PLINQ`。\n\n## 多线程基础\n\n***\n\n#### 初学者主题：多线程术语\n\n与多线程相关的有很多令人困惑的术语，所以让我们定义几个术语。\n\
  \n`CPU`（中央处理单元）或 `core`（核心）[#ch18]是实际执行给定程序的硬件单元。每台机器至少有一个 CPU，尽管今天多 CPU 机器已很常见。许多现代\
  \ CPU 支持 `simultaneous multithreading`（Intel 将其商标化为 `Hyper-Threading`），这种模式下单个 CPU\
  \ 可以表现为多个“虚拟”CPU。\n\n[#ch18]。 从技术上讲，我们应该说“CPU”始终指的是物理芯片，而“core”可能指物理或虚拟 CPU。这种区别对于本书的用途并不重要，因此我们将交替使用这些术语。\n\
  \n`process`（进程）是给定程序正在执行的实例；操作系统的根本目的是管理进程。每个进程包含一个或多个线程。进程由 `System.Diagnostics`\
  \ 命名空间中的 `Process` 类的实例表示。\n\n在语句和表达式层面的 C# 编程从根本上说是在描述 `flow of control`（控制流），到目前为止我们做了一个隐含假设，即给定程序只有一个“控制点”。你可以将控制点想象成光标，它在启动程序时从\
  \ `Main` 方法进入程序文本，然后随着各种条件、循环、方法调用等的执行在程序中移动。`thread`（线程）就是这个控制点。线程由 `System.Threading.Thread`\
  \ 类的实例表示，操作 `Thread` 的 API 位于相同的 `System.Threading` 命名空间中。\n\n`single-threaded`（单线程）程序是指进程中只有一个线程的程序。`multithreaded`（多线程）程序是指进程中有两个或多个线程的程序。\n\
  \n如果一段代码在多线程程序中使用时表现正常，则称该代码是 `thread safe`（线程安全的）。一段代码的 `threading model`（线程模型）是该代码为了保证线程安全而对其调用者提出的的一系列要求。（例如，许多类的线程模型定义为“静态方法可以从任何线程调用，但实例方法只能从分配实例的线程调用”。）\n\
  \n`task`（任务）是一个潜在的高延迟工作单元，它会产生一个结果值或期望的副作用。任务和线程的区别如下：任务代表一个需要执行的作业，而线程代表执行该作业的工作人员。任务仅对其副作用有用，并由\
  \ `Task` 类的实例表示。用于生成给定类型值的任务由 `Task<T>` 类表示，它派生自非泛型的 `Task` 类型。这些可以在 `System.Threading.Tasks`\
  \ 命名空间中找到。\n\n`thread pool`（线程池）是线程的集合，以及如何将工作分配给这些线程的逻辑。当你的程序有任务要执行时，它可以从池中委托一个工作线程，分配该线程执行任务，并在工作完成后将其释放。\n\
  \n***\n\n***\n\n#### 初学者主题：多线程的原理与方法\n\n多线程有两个主要场景：实现多任务处理和处理延迟。\n\n用户认为同时运行几十个进程并不觉得奇怪。他们可能在打开演示文稿和电子表格进行编辑的同时，还在浏览网络文档、听音乐、接收即时消息和邮件到达通知，并看着角落的小钟。这些每个进程都必须继续执行工作，尽管它们并不是需要处理的唯一任务。这种多任务处理通常在进程级别实现，但在某些情况下，你希望在单个进程内进行这种多任务处理。\n\
  \n然而，就本书而言，我们主要将多线程视为处理延迟的技术。例如，为了在导入大文件的同时允许用户点击“取消”，开发者会创建一个额外的线程来执行导入。通过在不同的线程上执行导入，用户就可以请求取消，而不是在导入完成之前冻结用户界面。\n\
  \n如果有足够的核心可以让每个线程分配到一个核心，那么每个线程本质上都拥有自己的小机器。然而，通常情况下，线程比核心多。即使是今天常见的多核机器也只有几个核心，而每个进程可能运行几十个线程。\n\
  \n为了弥补大量线程与少数核心之间的差异，操作系统通过 `time slicing`（时间分片）模拟多个线程的并发运行。操作系统从一个线程切换到另一个线程的速度快到以至于线程似乎是同时执行的。处理器在执行特定线程之前切换到另一个线程的时间被称为\
  \ `time slice`（时间片）或 `quantum`（量子）。更改给定核心中正在执行的线程的行为被称为 `context switch`（上下文切换）。\n\
  \n\n\n\n这种效果类似于光纤电话线，其中光纤线路代表处理器，而每个对话代表一个线程。一条（单模态）光纤电话线一次只能发送一个信号，但许多人可以在线路上同时对话。光纤通道的速度足够快，可以快速地在不同对话之间切换，使得每次对话看起来都是不中断的。同样，多线程进程中的每个线程似乎都在与其他线程一起连续运行。\n\
  \n如果两个操作通过真正的多核并行或使用时间分片的模拟并行以“并行”的方式运行，则它们被称为 `concurrent`（并发）。要实现这种并发，你以 `asynchronously`（异步地）的方式调用它，使得被调用操作的执行和完成都与调用它的控制流分离。因此，当异步分发的工作与当前控制流并行执行时，就会发生并发。`Parallel\
  \ programming`（并行编程）是将单个问题拆分为部分，并借此`asynchronously`启动每个部分的进程，以便所有部分都能被并发处理。\n\n\
  ## 初学者主题：性能考量\n\n对于处理 I/O 密集型操作的线程，操作系统基本上可以忽略它，直到 I/O 子系统可用结果；从 I/O 密集型线程切换到处理器密集型线程会产生更有效的处理器利用率，因为\
  \ CPU 在等待 I/O 操作完成时不会空闲。\n\n然而，上下文切换不是免费的；必须将 CPU 的当前内部状态保存到内存中，并加载与新线程相关的状态。如果线程过多，切换开销可能会开始显著影响性能。增加线程可能会进一步降低性能，以至于处理器花费在不同线程之间切换的时间比它完成每个线程工作的时间还要多。\n\
  \n即使我们忽略上下文切换的成本，时间分片本身也可能对性能产生巨大影响。例如，假设你有两个处理器密集型的高延迟任务，每个任务都在计算两个包含 10 亿数字的列表的平均值。假设处理器每秒可以执行\
  \ 10 亿次操作。如果这两个任务各关联一个线程，且两个线程各有一个自己的核心，显然我们可以在 1 秒内获得两个结果。\n\n但是，如果我们只有一个两个线程共享的单处理器处理器，时间分片将在一个线程上执行几十万次操作，然后切换到另一个线程，再切换回来，以此此类推。每个任务将总共消耗\
  \ 1 秒的处理器时间，因此两个结果将在 2 秒后可用，导致平均完成时间为 2 秒。（再次，我们忽略了上下文切换的成本。）\n\n如果我们将这两个任务分配给单个线程，让它执行第一个任务，并在第一个任务完成后才启动第二个任务，那么第一个任务的结果将在\
  \ 1 秒内获得，后续任务的结果将在 1 秒后获得，导致平均时间为 1.5 秒（任务在 1 秒或 2 秒内完成，因此平均完成时间为 1.5 秒）。\n\n###\
  \ 指南\n\n- **不要**陷入认为线程越多代码运行得越快的常见错误中。\n- **务必**在尝试通过多线程加速处理器密集型问题时，仔细地测量性能。\n\n\
  ## 初学者主题：线程问题\n\n我们已经多次提到编写多线程程序是复杂且困难的，但我们还没有说明原因。简而言之，问题在于，许多对单线程程序有效的合理假设在多线程程序中被违反了。这些问题包括缺乏原子性、竞态条件、复杂的内存模型和死锁。\n\
  \n### 大多数操作不是原子的\n\n原子操作是指总是被观察到要么未开始，要么已经完成的操作。它的状态在外部永远不可见为“进行中”。例如，考虑以下代码片段：\n\
  \n点击查看代码图像\n\n```sharp\nif (bankAccounts.Checking.Balance >= 1000.00m)\n{\n  bankAccounts.Checking.Balance\
  \ -= 1000.00m;\n  bankAccounts.Savings.Balance += 1000.00m;\n}\n```\n\n这种操作——检查可用资金，然后根据条件扣除一个账户并增加另一个账户——需要是原子的。换句话说，为了使其正确执行，我们必须确保不存在操作被观察到部分完成的时刻。例如，假设有两个线程在上述代码中并发运行。可能两个线程都验证账户中有足够的资金，然后两个线程都执行资金转账，即使账户中的资金仅够执行一次转账。事实上，情况要糟糕得多：这段代码片段中*没有任何*操作是原子的！即使是像复合加/减法或读取和写入\
  \ decimal 类型的属性的操作，在 C# 中也是非原子操作。因此，在多线程场景下，它们都可以被观察为“部分完成”——仅被部分递增或减少。由于由于部分完成的非原子操作导致的状态不一致是一个更广泛问题的特例，称为竞态条件（race\
  \ condition）。\n\n### 竞态条件引起的不确定性\n\n正如我们之前讨论的，并发通常通过时间分片模拟。在没有特殊控制流结构的情况下（我们将在下一章详细讨论），操作系统可以在它选择的任何时间在两个线程之间切换上下文。因此，当两个线程访问同一个对象时，哪个线程“赢得竞赛”并先运行是不可预测的。例如，如果之前的代码片段中有两个线程运行，可能一个线程可能会赢得竞赛，在第二个线程获得运行机会之前一直运行到末尾。也可能上下文切换发生在第一个线程执行余额检查之后，然后第二个线程可能会赢得竞赛，先到达末尾。\n\
  \n\n\n竞态条件（race conditions）的存在本身就足够糟糕，即两个控制点可能会以不可预测且不一致的速度“竞速”一段代码，但情况会变得更糟。考虑运行在两个不同处理器上的两个线程，但它们正在访问某个对象的相同字段。现代处理器并不是在你每次使用变量时都真正访问主内存。相反，它们会在处理器上特殊的“缓存”内存中创建一个本地副本；这些缓存会定期与主内存进行同步。这意味着，在两个不同处理器上读写同一位置的两个线程，实际上可能无法观察彼此对该内存的更新，或者观察到不一致的结果。本质上，我们在这里遇到的是一种取决于处理器何时选择同步缓存的竞态条件。\n\
  \n## 锁会导致死锁\n\n显然，必须存在某些机制将非原子操作转换为原子性操作，指示操作系统调度线程以避免竞态，并确保在必要时同步处理器缓存。在 C# 程序中，解决所有这些问题的主要机制是\
  \ `lock` 语句。该语句允许开发者将一段代码标识为“关键”代码，同一时间只能有一个线程进入该区域；如果有多个线程尝试进入关键区域，操作系统将挂起除一个之外的所有线程。操作系统还确保在遇到锁时恰当地同步处理器缓存。\n\
  \n然而，锁也会引入自身的问题。最注意的是，如果线程之间获取锁的顺序发生变化，可能会发生`deadlock`（死锁），导致线程冻结，每个线程都在等待对方释放锁。\n\
  \n例如：\n\n![Image](img/0740fig01.jpg)\n\n在此处，每个线程在继续之前都在等待另一个线程，因此每个线程都被阻塞了，导致该代码执行的整体死锁。\n\
  \n我们将在第 19 章中详细讨论各种锁技术。\n\n### 指南\n\n- **不要**无根据地假设在普通代码中是原子的任何操作在多线程代码中也是原子的。\n\
  - **不要**假设所有线程都会以一致的顺序观察对共享内存操作的所有侧效应。\n- **务必**确保并发持有多个锁的代码始终以相同的顺序获取它们。\n- **避免**所有的“竞态条件”——即程序行为取决于操作系统如何选择调度线程的情况。\n\
  \n## 使用 System.Threading\n\nParallel Extensions 库极其有用，因为它允许你操作更层级的抽象——任务（task），而不是直接处理线程。然而，你可能需要处理在\
  \ TPL 和 PLINQ 出现之前（.NET 4.0 之前）编写的代码，或者你可能遇到了它们无法直接解决的编程问题。在本节中，我们将简要介绍用于直接操作线程的一些基础底层\
  \ API。\n\n### 使用 System.Threading.Thread 进行异步操作\n\n操作系统实现了线程并提供了各种未托管 API 来创建和管理这些线程。CLR\
  \ 封装了这些未托管线程，并通过 `System.Threading.Thread` 类在托管代码中暴露它们，该类的实例代表程序中的一个“控制点”。正如前面提到的，你可以将线程想象成一个“工人”，它独立地执行构成你程序的指令。\n\
  \n列表 18.1 提供了一个示例。这个独立的控制点由一个并发运行的 `Thread` 实例表示。线程在启动时需要知道运行哪些代码，因此它的构造函数接收一个指向要执行代码的委托。在这种情况下，我们将方法组\
  \ `DoWork` 转换为适当的委托类型 `ThreadStart`。然后我们通过调用 `Start()` 启动线程运行。在新线程运行期间，主线程尝试向控制台打印\
  \ 10,000 个连字符。我们通过调用 `Join()` 指示主线程等待工作线程完成工作。结果显示在输出 18.1。\n\n**列表 18.1：使用 System.Threading.Thread\
  \ 启动方法**\n\n点击此处查看代码图像\n\n```assembly\nusing System;\nusing System.Threading;\n\n\
  public class RunningASeparateThread\n{\n  public const int Repetitions = 1000;\n\
  \n  public static void Main()\n  {\n    ThreadStart threadStart = DoWork;\n    Thread\
  \ thread = new Thread(threadStart);\n    thread.Start();\n    for(int count = 0;\
  \ count < Repetitions; count++)\n    {\n      Console.Write('-');\n    }\n    thread.Join();\n\
  \  }\n\n  public static void DoWork()\n  {\n    for(int count = 0; count < Repetitions;\
  \ count++)\n    {\n      Console.Write('+');\n    }\n  }\n}\n```\n\n**输出 18.1**\n\
  \n点击此处查看代码图像\n\n------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------------\n\
  \n如你所见，线程似乎在轮替执行，每个线程在上下文切换之前都会打印几百个字符。这两个循环正在“并行”运行，而不是由第一个循环在第二个循环开始之前运行完毕（如果委托是同步执行的，情况将会是那样）。\n\
  \n\n\n\n要让代码在不同线程的上下运行，你需要一个类型为 `ThreadStart` 或 `ParameterizedThreadStart` 的委托来标识要执行的代码。（后者允许传递一个\
  \ `object` 类型的单个参数；两者都位于 `System.Threading` 命名空间中。）给定一个使用线程启动委托构造函数创建的 `Thread`\
  \ 实例，你可以通过调用 `thread.Start()` 来启动执行该线程。（列表 18.1 显式地创建了一个 `ThreadStart` 类型的变量，以便在源代码中显示该委托类型。方法组\
  \ `DoWork` 也可以直接传递给线程构造函数。）调用 `Thread.Start()` 会告诉操作系统开始并发执行新线程；主线程的控制权会在调用调用后立即返回，并执行\
  \ `Main()` 方法中的 `for` 循环。现在这些线程是独立的，在调用 `Join()` 之前，它们彼此都不会等待对方。\n\n## 线程管理\n\n\
  线程包含了许多用于管理其执行的方法和属性。这里是一些基本方法：\n\n• 正如我们在列表 18.1 中看到的，你可以使用 `Join()` 让一个线程等待另一个线程。这告诉操作系统挂起当前线程的执行，直到另一个线程终止。`Join()`\
  \ 方法经过重载，可以接收 `int` 或 `TimeSpan`，以支持在继续执行之前等待线程完成的最长时间。\n\n• 默认情况下，新线程是“前台”线程；当所有前台线程完成后，操作系统将终止该进程。你可以通过将\
  \ `IsBackground` 属性设置为 `true` 来将线程标记为“后台”线程。这样，即使后台线程仍在运行，操作系统也会允许终止进程。然而，确保所有线程没有被强制中止，而是在进程退出前整洁退出仍然是一个良好习惯；更多细节请参阅本章稍后关于线程中止的章节。\n\
  \n• 每个线程都有一个关联的优先级，你可以通过将 `Priority` 属性设置为新的 `ThreadPriority` 枚举值来更改它。可能的值有 `Lowest`、`BelowNormal`、`Normal`、`AboveNormal`\
  \ 和 `Highest`。操作系统倾向于为高优先线程调度时间片。小心；如果你设置了错误的优先级，可能会导致“饥饿”情况，即一个高优先级线程阻止许多低优先级线程运行。\n\
  \n• 如果你只是想知道线程是否仍然“存活”或已完成所有工作，可以使用布尔属性 `IsAlive`。通过 `ThreadState` 属性可以获取更详尽的线程状态信息。`ThreadState`\
  \ 枚举值为 `Aborted`、`AbortRequested`、`Background`、`Running`、`Stopped`、`StopRequested`、`Suspended`、`SuspendRequested`、`Unstarted`\
  \ 和 `WaitSleepJoin`。这些是标志；某些值可以组合使用。\n\n有两种常用且经常被滥用的线程控制方法值得在单独的章节中讨论：`Sleep()`\
  \ 和 `Abort()`。\n\n## 不要向生产代码中让线程睡眠\n\n静态方法 `Thread.Sleep()` 使当前线程进入睡眠状态，本质上是告诉操作系统在给定时间通过之前，不要为该线程调度任何时间片。参数——无论是毫秒数或\
  \ `TimeSpan`——指定了操作系统在继续执行之前将等待多久。在等待期间，操作系统当然会为可能使用它的其他线程调度时间片。这听起来像是一个明智的做法，但它是“代码气味”，表明程序的设计可能可以更好。\n\
  \n让线程睡眠也是一种坏做法，因为这意味着睡眠的线程显然对运行代码的尝试是不响应的。如果你让 Windows 应用程序的主线程进入睡眠，该线程将不再处理来自用户界面的消息，因此看起来像是挂起了。\n\
  \n更通俗地说，让线程睡眠是一种坏做法，因为分配线程这样昂贵的资源的要点就是为了从中获得工作。你不会付钱让员工去睡觉，所以不要付出分配昂贵线程的代价，只为了让它睡眠数百万或十亿个周期。\n\
  \n尽管如此，`Thread.Sleep()` 也有一些合理的用途。首先，带有零延迟的让线程睡眠会告诉操作系统：“如果有其他可以使用它的线程，当前线程正在礼貌地放弃它剩余的时间量子。”\
  \ 随后，该礼貌的线程将会被正常调度，没有任何进一步的延迟。其次，`Thread.Sleep()` 常用于测试代码，以模拟正在处理某些高延迟操作的线程，而无需实际消耗处理器进行某些无意义的算术。生产代码中的其他用途应仔细审查，以确保没有更好的方法来实现所需的效果。\n\
  \n在 C# 5 的基于任务的异步编程中，你可以对 `Task.Delay()` 方法的结果使用 `await` 操作符，以引入不阻塞当前线程的异步延迟。更多细节请参阅第\
  \ 19 章中的“计时器”节。\n\n### 指南\n\n 避免在生产代码中调用 `Thread.Sleep()`。\n\n## 不要从生产代码中中止线程\n\n\
  `Thread` 对象有一个 `Abort()` 方法，执行时会尝试销毁线程。它通过导致运行时在线程中抛出 `ThreadAbortException` 来实现；此异常可以被捕获，但即使被捕获并忽略，它也会自动重新抛出，以确保线程确实被销毁。有很多理由尝试中止线程是一个非常糟糕的主意。以下是其中一些：（我们将在列表\
  \ 18.2 中给出此类示例。）\n\n\n\n\n-   该方法仅承诺 `try` 中止线程；并不保证一定能成功。例如，如果线程的控制点当前位于 `finally`\
  \ 块内部（因为此时可能正在运行关键清理代码，不应被中断）或处于未托管代码中（因为这样做可能会损坏 CLR 本身），运行时将不会尝试抛出 `ThreadAbortException`。相反，CLR\
  \ 会推迟异常的抛出，直到控制离开 `finally` 块或返回托管代码。但无法保证这是否会发生。被中止的线程在 `finally` 块内部可能包含一个无限循环。（讽刺的是，线程内部包含无限循环这一事实，可能正是你起初尝试终止它的原因。）\n\
  \n-   被中止的线程可能正处于受 `lock` 语句保护的关键代码中。（详情请参阅第 19 章）。与 `finally` 块不同，`lock` 不会阻止异常。关键代码将在执行一半时被异常中断，`lock`\
  \ 对象将自动释放，允许其他等待 `lock` 对象的代码进入临界区域，并观察执行一半的代码状态。锁的意义在于防止这种情况发生，因此中止线程可能会导致看似线程安全的代码变成危险的错误代码。\n\
  \n-   CLR 保证如果线程被中止，其内部数据结构永远不会损坏，但 BCL 并不提供这一保证。如果在错误的时间点抛出异常，中止线程可能会导致你的任何数据结构或\
  \ BCL 的数据结构处于任意糟糕的状态。运行在其他线程上或被中止线程的 `finally` 块中的代码可以看到这种损坏状态，并导致崩溃或行为异常。\n\n简而言之，除非是万不得已，否则你永远不应该中止线程；理想情况下，你应该只在大型紧急关机（即整个\
  \ AppDomain 或整个进程正在销毁）的一部分时中止线程。幸运的是，基于任务的异步使用了一种更稳健、更安全的协作取消模式来终止结果不再需要的“线程”，这将在下一个主要章节“\
  \ 异步任务”中进行讨论。\n\n* * *\n\n### 指南\n\n**避免**在生产代码中中止线程；这样做会导致不可预测的结果，并可能使程序不稳定。\n\n\
  * * *\n\n### 线程池\n\n正如我们之前讨论过的，在入门主题“性能考虑”中，线程过多会对性能产生负面影响。线程是昂贵的资源，线程上下文切换不是免费的，通过时间分片模拟并行来运行两个任务可能比一个接一个运行它们要慢得多。\n\
  \n为了缓解这些问题，BCL 提供了线程池。你不需要直接分配线程，而是告诉线程池你想要执行的工作。工作完成后，线程不会终止并销毁，而是返回到池中，从而在有更多工作到来时节省了分配新线程的成本。列表\
  \ 18.2 显示了如何执行与列表 18.1 相同的操作，但这次使用了池化线程。\n\n**列表 18.2：使用 ThreadPool 代替实例化线程**\n\n\
  点击此处查看代码图像\n\n```csharp\nusing System;\n\nusing System.Threading;\n\npublic class\
  \ Program\n{\n  public const int Repetitions = 1000;\n\n  public static void Main()\n\
  \  {\n      ThreadPool.QueueUserWorkItem(DoWork, '+');                \n      for(int\
  \ count = 0; count < Repetitions; count++)\n      {\n          Console.Write('-');\n\
  \      }\n      // 等待直到线程完成。\n      // 这仅用于说明目的；不要在\n      // 生产代码中使用 Thread.Sleep\
  \ 进行同步。\n      Thread.Sleep(1000);                                             \
  \ \n  }\n  public static void DoWork(object state)\n  {\n      for(int count = 0;\
  \ count < Repetitions; count++)\n      {\n          Console.Write(state);\n    \
  \  }\n  }\n}\n```\n\n* * *\n\n列表 18.2 的输出与输出 18.1 类似——即句号和连字符的交织。如果我们有许多不同的任务需要异步执行，这种池化技术将在单处理器和多处理器计算机上提供更高效的执行。这种效率是通过反复重用线程实现的，而不是为每个异步调用重新构建它们。\n\
  \n遗憾的是，线程池的使用并非没有缺陷：在使用线程池时，仍需考虑性能和同步问题。\n\n为了有效利用处理器，线程池假设你调度到线程池上的所有工作都能按时完成，这样线程就可以返回到线程池并被另一个任务重用。线程池还假设所有工作的持续时间都较短（即消耗毫秒或几秒的处理器时间，而不是小时或几天）。通过做出这种假设，它可以确保每个处理器都在全力处理某项任务，而不是像性能入门主题中描述的那样低效地对多个任务进行时间分片。线程池试图通过确保线程创建被“节流”来防止过度的时间分片，从而确保没有处理器被过多的线程“过度订阅”。当然，这意味着消耗掉池内的所有线程可能会推迟队列中任务的执行。如果池中的所有线程都被长时间运行的任务或\
  \ I/O 密集型任务占用，那么队列的任务将被延迟。\n\n与你可以直接操作的 `Thread` 和 `Task` 对象不同，线程池不提供用于执行特定任务的线程的引用。这防止了调用线程与工作线程进行同步或对其进行控制。在列表\
  \ 18.2 中，我们使用了之前不建议的“简陋同步”；这在生产代码中是一个坏主意，因为我们实际上不知道工作将花费多久。\n\n简而言之，线程池很好地完成了它的工作，但这项工作并不包括提供处理长时间运行或需要与主线程或相互之间同步任务的服务。我们真正需要做的是构建一个高层次抽象，将线程和线程池作为实现细节；该抽象是由任务并行库（TPL）实现的，它是本章后续的大部分内容的主题。\n\
  \n关于 .NET 4 之前常用的管理工作线程的更多详细信息，请参阅 IntelliTect.com 的 *Essential C# 3.0* 多线程章节。\n\
  \n* * *\n\n**使用**线程池为处理器密集型任务分配处理器时间。\n\n**避免**将池工作线程分配给 I/O 密集型或长时间运行的任务；请使用 TPL。\n\
  \n`开始于 4.0`\n\n## 异步任务\n\n多线程编程包含以下复杂性：\n\n**1.** *监控异步操作状态以完成*：这包括确定异步操作何时完成，最好不是通过轮询线程状态或阻塞等待来完成。\n\
  \n**2.** *线程池*：这避免了启动和销毁线程的巨大成本。此外，线程池避免了创建过多线程导致系统在切换线程上花费的时间超过运行任务的时间。\n\n\n\n\
  \n\n### 3. 避免死锁：这涉及到在尝试保护数据免受两个线程同时访问的同时，防止死锁的发生。\n\n### 4. 提供跨操作的原子性并同步数据访问：在组操作周围添加同步机制，可以确保操作作为单个单元执行，并确保它们被另一个线程恰地中断。通过锁定机制，确保两个不同的线程不会同时访问数据。\n\
  \n此外，每当方法运行时间很长时，可能都需要多线程编程——也就是说，异步调用该长时间运行的方法。随着开发者编写越来越多的多线程代码，一组处理这些场景的常见场景和编程模式也应运而生。\n\
  \nC# 5.0 通过利用 `.NET` 4.0 中的 `TPL` 并使用 C# 语言的新构造结构来支持它，增强了其中一种模式——`TAP` 的可编程性。本节及后续章节将深入探讨\
  \ `TPL` 本身的细节，然后是带有 `async`/`await` 上文关键字的 `TPL`，它们简化了 `TAP` 编程。在第 19 章的后半部分，我们将考虑其他一些重要的多线程模式，如果无法\
  \ `TPL` 和 C# 5.0，或者你正在针对基于 TPL 的 API 进行编程，熟悉这些模式至关重要。\n\n#### 从线程到任务\n\n创建线程是一个相对昂贵的操作，每个线程都会消耗大量的虚拟内存（默认为\
  \ 1 兆字节）。在本章前面的部分我们看到，使用线程池在需要时分配线程、将异步工作分配给线程、运行到完成，然后重用该线程处理后续的异步工作，比在工作完成后销毁线程稍后创建新线程可能更具效率。\n\
  \n在 `.NET Framework` 4 中，而不是在每次启动异步工作时创建一个操作系统线程，`TPL` 会创建一个 `Task` 并告诉 `task scheduler`（任务调度器）有异步工作需要执行。任务调度器可能会使用许多不同的策略来实现此目的，但默认情况下，它会从线程池请求一个工作线程。正如我们已经看到的，线程池可能决定稍后运行任务（在某些当前正在执行的任务完成后）更有效，或者可能决定将任务的工作线程调度到特定的处理器上。线程池决定创建一个全新的线程还是重用一个之前执行完毕的现有线程更有效。\n\
  \n通过将异步工作的概念抽象为 `Task` 对象，`TPL` 提供了一个表示异步工作的对象，并提供了一个与该工作交互的面向对象的 API。此外，通过提供一个表示工作单元的对象，`TPL`\
  \ 允许通过将小任务组合成大任务来程序化地构建工作流，正如我们将看到的那样。\n\n任务是一个封装了异步执行的工作的对象。这听起来很熟悉：`delegate`（委托）也是一个表示代码的对象。任务和委托之间的区别在于，委托是**同步的**的，而任务是**异步的**。执行一个委托（例如一个\
  \ `Action`）会立即将当前线程的控制权转移到委托的代码；在委托完成之前，控制权不会返回给调用者。相比之下，启动任务几乎立即就会将控制权返回给调用者，无论任务必须执行多少工作。任务以异步方式执行，通常在另一个线程上执行（尽管正如我们在本章稍后部分将看到的，使用仅有的一个线程异步执行任务是可能的，甚至是有益的）。任务本质上是将委托从同步执行模式转变为异步执行模式。\n\
  \n#### 引入异步任务\n\n你知道委托在当前线程上执行完毕，是因为调用者在委托完成之前什么都做不了。但是，你如何知道任务何时完成，以及如果有结果，你又如何获取结果呢？考虑将同步委托转换为异步任务的示例。我们将执行与列表\
  \ 18.1 中对线程以及在列表 18.2 中对线程池所做的事情，但这次使用的是任务：工作线程将向控制台写入点，而主线程将写入连字符。\n\n启动任务从线程池获取一个新线程，创建第二个“控制点”，并在该线程上执行委托。主线程上的控制点在调用启动任务（`Task.Run()`）后继续正常运行。列表\
  \ 18.3 的输出与输出 18.1 几乎完全相同。\n\n**列表 18.3：调用异步任务**\n\n点击此处查看代码图像\n\n```csharp\nusing\
  \ System;\nusing System.Threading.Tasks;\n\npublic class Program\n{\n  public static\
  \ void Main()\n  {\n    const int Repetitions = 10000;\n    // 对于 .NET 4 之前的 TPL\
  \ \n    // 使用 Task.Factory.StartNew<string>()\n    Task task = Task.Run(() =>\n\
  \    {\n      for (int count = 0; count < Repetitions; count++)\n      {\n     \
  \   Console.Write('-');\n      }\n    });\n    for (int count = 0; count < Repetitions;\
  \ count++)\n    {\n      Console.Write('+');\n    }\n    // 等待任务完成\n    task.Wait();\n\
  \  }\n}\n```\n\n要在新线程中运行的代码定义传递给 `Task.Run()` 方法的委托中（在本例中类型为 `Action`）。此委托（以 lambda\
  \ 表达式的形式）向控制台打印横线。启动任务后的循环几乎相同，区别在于它显示的是加号。\n\n注意，在调用 `Task.Run()` 后，传递的 `Action`\
  \ 立即开始执行。这种任务被称为“热的”（hot），意味着它已经被触发开始——与“冷色的”（cold）任务相反，后者在异步工作开始之前需要显式启动。\n\n虽然可以通过\
  \ `Task` 构造函数在“冷色”状态下实例化 `Task`，但通常这只适用于返回已在运行的（“热的”）`Task` 的 API 内部实现细节，该任务是通过调用\
  \ `Task.Start()` 触发的。\n\n注意，在调用 `Run()` 之后，“热的”任务的确切状态是不确定的。该状态由操作系统以及它选择是立即运行任务的工作线程还是推迟到有更多可用资源时来决定。事实上，当调用者线程上的代码再次获得执行机会时，热任务可能已经完成了。调用\
  \ `Wait()` 会强制主线程等待所有分配给任务的工作完成执行。这比比我们在列表 18.1 中所做的，对工作线程调用 `Join()`。\n\n在这种情况下，我们只有一个任务，但也可能许多任务在异步运行。在某些情况下，拥有一组任务是常见的，你希望等待所有任务都完成，或者等待其中任何一个任务完成，然后再继续当前线程的执行。`Task.WaitAll()`\
  \ 和 `Task.WaitAny()` 方法正是为此设计的。\n\n\n\n\n\n到目前为止，我们已经看到了任务如何获取一个 `Action` 并异步运行它。但如果在任务中执行的工作返回一个结果呢？我们可以使用\
  \ `Task<T>` 类型来异步运行 `Func<T>`。当同步执行委托时，我们知道在结果可用之前控制权不会返回。当异步执行 `Task<T>` 时，我们可以从一个线程对它进行轮询以检查它是否完成，并在完成后获取结果。3\
  \ 代码列表 18.4 演示了如何在控制台应用程序中这样做。请注意，此示例使用了 `PiCalculator.Calculate()` 方法，我们将在“在并行中执行循环迭代”节中进一步深入探讨它。\n\
  \n3。使用这种轮询技术时要格外小心。像我们这里这样从委托创建任务时，该任务将被调度在线程池的工作线程上运行。结果是当前线程将一直循环，直到工作线程上的工作完成。这种技术虽然可行，但可能会消耗不必要的\
  \ CPU 资源。如果你不是将任务调度在工作线程上运行，而是将其调度在未来在当前线程执行，那么这种轮询技术就是危险的。由于当前线程正在循环中轮询任务，它将无限循环，因为在当前线程退出循环之前任务将无法完成。\n\
  \n**列表 18.4: 轮询 Task<T>**\n\n点击此处查看代码图像\n\n* * *\n\n```c\nusing System;\n\nusing\
  \ System.Threading.Tasks;\n\npublic class Program\n{\n  public static void Main()\n\
  \  {\n      // 对于 .NET 4.5 之前的 TPL，\n      // 使用 Task.Factory.StartNew<string>()\n\
  \      Task<string> task =\n          Task.Run<string>(\n              () => PiCalculator.Calculate(100));\n\
  \      foreach(\n          char busySymbol in Utility.BusySymbols())\n      {\n\
  \          if(task.IsCompleted)\n          {\n              Console.Write('\\b');\n\
  \              break;\n          }\n          Console.Write(busySymbol);\n     \
  \ }\n      Console.WriteLine();\n      Console.WriteLine(task.Result);\n      System.Diagnostics.Trace.Assert(\n\
  \          task.IsCompleted);\n  }\n}\n```\n\n* * *\n\n```csharp\npublic class PiCalculator\n\
  {\n  public static string Calculate(int digits = 100)\n  {\n      // ...\n  }\n\
  }\n```\n\n* * *\n\n```csharp\npublic class Utility\n{\n  public static IEnumerable<char>\
  \ BusySymbols()\n  {\n      string busySymbols = @\"-\\|/-\\|/\";\n      int next\
  \ = 0;\n      while(true)\n      {\n          yield return busySymbols[next];\n\
  \          next = (next + 1) % busySymbols.Length;\n          yield return '\\b';\n\
  \      }\n  }\n}\n```\n\n* * *\n\n此列表显示任务的数据类型为 `Task<string>`。泛泛类型包含一个 `Result`\
  \ 属性，可以通过该属性检索 `Task<string>` 执行的 `Func<string>` 所返回的值。\n\n注意代码列表 18.4 并没有调用 `Wait()`。\n\
  \n除了 `IsCompleted`，还有其他几个值得注意的属性：\n\n- 当任务完成时，`IsCompleted` 属性被设置为 `true`。`TaskStatus`\
  \ 有多个值：`Created`、`WaitingForActivation`、`Running`、`WaitingToCompletion`、`RanCompletion`、`Canceled`\
  \ 或 `Faulted`。\n- `Result` 属性包含任务的结果。\n- `Exception` 属性在任务故障时包含异常。\n\n\n\n\n\n```csharp\n\
  using System;\nusing System.Threading.Tasks;\n\npublic class Program\n{\n    public\
  \ static void Main()\n    {\n        Console.WriteLine(\"Before\");\n        //\
  \ Use Task.Factory.StartNew<string>() for\n        // TPL prior to .NET 4.5\n  \
  \      Task taskA =\n            Task.Run( () =>\n                Console.WriteLine(\"\
  Starting...\"))\n            .ContinueWith(antecedent =>\n                Console.WriteLine(\"\
  Continuing A...\"));\n        Task taskB = taskA.ContinueWith( antecedent =>\n \
  \           Console.WriteLine(\"Continuing B...\"));\n        Task taskC = taskA.ContinueWith(\
  \ antecedent =>\n            Console.WriteLine(\"Continuing C...\"));\n        Task.WaitAll(taskB,\
  \ taskC);\n        Console.WriteLine(\"Finished!\");\n    }\n}\n```\n\n**输出 18.2**\n\
  ```\nBefore\nStarting...\nContinuing A...\nContinuing C...\nContinuing B...\nFinished!\n\
  ```\n\n`ContinueWith()` 方法允许将两个任务“链式”在一起，使得当前置任务——`antecedent task`（前置任务）完成时，第二个任务——`continuation\
  \ task`（延续任务）会自动异步启动。例如，在代码列表 18.5 中，`Console.WriteLine(\"Starting...\")` 是前置任务的主体，而\
  \ `Console.WriteLine(\"Continuing A...\")` 是它的延续任务主体。延续任务接受一个 `Task` 作为其参数（`antecedent`），从而允许延续任务的代码访问前置任务的完成状态。当前置任务完成时，延续任务会自动启动，异步执行第二个委托程序，并将刚刚完成的前置任务作为参数传递给该委托程序。此外，由于\
  \ `ContinueWith()` 方法也返回一个 `Task`，因此该 `Task` 可以用作另一个 `Task` 的前置任务，依此类推，形成一个长度可以任意的\
  \ `Task` 延续链。\n\n如果你对同一个前置任务调用了两次 `ContinueWith()`（如代码列表 18.5 所示，用 `taskB` 和 `taskC`\
  \ 代表 `taskA` 的延续任务），则该前置任务（`taskA`）有两个延续任务，且当前置任务完成时，两个延续任务都将异步执行。注意，来自单一前置任务的延续任务的执行顺序在编译时是不确定的。输出\
  \ 18.2 恰好显示 `taskC` 在 `taskB` 之前执行，但在程序的第二次执行中，顺序可能会反过来。然而，`taskA` 始终会在 `taskB`\
  \ 和 `taskC` 之前执行，因为后者是 `taskA` 的延续任务，因此无法在 `taskA` 完成之前启动。同样，`Console.WriteLine(\"\
  Starting...\")` 委托总会在 `taskA`（`Console.WriteLine(\"Continuing A...\")`）之前执行完毕，因为后者是前者的延续任务。此外，“Finished!”始终最后出现，因为调用了\
  \ `Task.WaitAll(taskB, taskC)`，它会阻塞控制流，直到 `taskB` 和 `taskC` 都完成才会继续执行。\n\n`ContinueWith()`\
  \ 有许多不同的重载形式，其中某些重载接受一个 `TaskContinuationOptions` 值来微调延续链的行为。这些值是标志位，因此可以使用逻辑或运算符（`|`）进行组合。一些可能的标志值的简要描述出现在表\
  \ 18.1 中；更多详情请参见在线 MSDN 文档^(5)。\n\n5. MSDN.NET Framework Developer Center, [`msdn.microsoft.com/en-us/library/system.threading.tasks.taskcontinuationoptions(v=vs.110).aspx`](http://msdn.microsoft.com/en-us/library/system.threading.tasks.taskcontinuationoptions(v=vs.110).aspx)。\n\
  \n![Image](img/18tab01.jpg)![Image](img/18tab01a.jpg)![Image](img/18tab01b.jpg)\n\
  \n**表 18.1：可用 TaskContinuationOptions 枚举列表**\n\n带有星号（*）的项目表示延续任务在什么条件下会被执行；因此，它们对于创建表现像前置任务行为的事件处理程序的延续任务特别有用。代码列表\
  \ 18.6 演示了如何为前置任务赋予多个延续任务，这些任务的执行取决于前置任务完成的方式。\n\n### 代码列表 18.6：使用 ContinueWith()\
  \ 注册任务行为通知\n点击此处查看图像\n\n```csharp\nusing System;\nusing System.Threading.Tasks;\n\
  using System.Diagnostics;\nusing Wesley.CSharp.Shared;\npublic class Program\n{\n\
  \    public static void Main()\n    {\n        // Use Task.Factory.StartNew<string>()\
  \ for\n        // TPL prior to .NET 4.5\n        Task<string> task =\n         \
  \   Task.Run<string>(\n                () => Calculator.Calculate(10));\n      \
  \  Task faultedTask = task.ContinueWith(\n            (antecedentTask) =>\n    \
  \        {\n                Trace.Assert(antecedentTask.IsFaulted);\n          \
  \      Console.WriteLine(\n                    \"Task State: Faulted\");\n     \
  \       },\n            TaskContinuationOptions.OnlyOnFaulted);\n        Task canceledTask\
  \ = task.ContinueWith(\n            (antecedentTask) =>\n            {\n       \
  \         Trace.Assert(antecedentTask.IsCanceled);\n                Console.WriteLine(\n\
  \                    \"Task State: Canceled\");\n            },\n            TaskContinuationOptions.OnlyOnCanceled);\n\
  \        Task completedTask = task.ContinueWith(\n            (antecedentTask) =>\n\
  \            {\n                Trace.Assert(antecedentTask.IsCompleted);\n    \
  \            Console.WriteLine(\n                    \"Task State: Completed\");\n\
  \            },  TaskContinuationOptions.OnlyRanCompletion);\n        completedTask.Wait();\n\
  \    }\n}\n```\n\n在此列表中，我们实际上为前置任务的“事件”注册了“监听器”，这样当任务正常或异常完成时，特定的“监听”任务就会开始执行。这是一个强大的功能，特别是当原始任务是一个“发后即忘”任务时——即我们启动它、挂载延续任务，然后不再引用它的任务。\n\
  \n在代码列表 18.6 中，注意最后的 `Wait()` 调用是针对 `completedTask` 的，而不是 `task`——即通过 `Task.Run()`\
  \ 创建的原始前置任务。虽然每个委托的 `antecedentTask` 都是父任务（前置任务）`task` 的引用，但在委托监听器外部，我们可以有效地放弃对原始\
  \ `task` 的引用。随后我们可以完全依赖异步执行的延续任务，而无需任何检查原始 `task` 状态的代码。\n\n在这种情况下，我们调用了 `completedTask.Wait()`，以确保主线程在完成输出出现之前退出程序（参见输出\
  \ 18.3）。\n\n**输出 18.3**\n```\nTask State: Completed.\n```\n\n\n\n\n\n一种不那么刻意的方法可能是调用\
  \ `Task.WaitAny(completedTask, canceledTask, faultedTask)`，这将抛出一个 `AggregateException`，然后需要对其进行处理。\n\
  \n## 带有 AggregateException 的 Task 上的未处理异常处理\n\n在同步调用方法时，我们可以将其封装在带有 `catch` 句的 `try`\
  \ 块中，以告诉编译器当发生异常时我们想要执行哪部分代码。然而，这对于异步调用无效。我们不能简单地在对 `Start()` 的调用包裹一个 `try` 块来捕获异常，因为调用会立即返回，控制权将离开\
  \ `try` 块，并且可能在工作线程上发生异常很久之前就已经离开了。一种解决方案是将任务委托的主体封装在 `try/catch` 块中。在工作线程上抛出并被捕获的异常将不会产生问题，因为\
  \ `try` 块在工作线程上正常工作。然而，对于未处理异常（即工作线程未捕获的异常），情况并非如此。\n\n通常情况下（从 CLR 2.0(6) 版本开始），任何线程上的未处理异常都会被视为致命的，触发\
  \ Windows 错误报告对话并导致应用程序异常终止。所有线程上的所有异常必须被捕获，如果未捕获，则不允许应用程序继续运行。（有关处理未处理异常的某些高级技术，请参阅即将推出的高级主题“处理\
  \ `Thread` 上的未处理异常”。）幸运的是，对于在异步运行的任务中的未处理异常，情况并非如此。相反，任务调度器会在委托周围插入一个“全捕获”异常处理器，这样如果任务抛出了其他未处理的异常，全捕获处理器将捕获它并在任务中记录异常的细节，从而避免触发\
  \ CLR 自动终止进程。\n\n6。在 CLR 1.0 版本中，工作线程上的未处理异常会终止线程但不会终止应用程序。结果是，有错误的程序可能会导致所有工作线程都死亡，但主线程将继续运行，尽管程序已不再执行任何工作。这对于用户来说是一个令人困惑的局面；向用户信号应用程序处于不良好状态并在其造成更多伤害之前将其终止会是更好的选择。\n\
  \n正如我们在列表 18.6 中看到的，处理故障任务的一种技术是显式创建一个延续任务作为该任务的“故障处理器”；当任务调度器检测到前置任务抛出了未处理异常时，它会自动调度延续任务。然而，如果没有此类处理器，并且在故障任务上执行\
  \ `Wait()`（或尝试获取 `Result`），则将抛出 `AggregateException`（参见列表 18.7 和输出 18.4）。\n\n###\
  \ 列表 18.7：处理 Task 的未处理异常\n\n点击此处查看代码图像\n\n* * *\n\n```csharp\nusing System;\n\n\
  using System.Threading.Tasks;\n\npublic class Program\n{\n\n  public static void\
  \ Main()\n  {\n      // 对于 .NET 4.5 之前的 TPL\n      // 使用 Task.Factory.StartNew<string>()\n\
  \      Task task = Task.Run(() =>\n      {\n          throw new InvalidOperationException();\n\
  \      });\n\n      try\n      {\n          task.Wait();\n      }\n      catch(AggregateException\
  \ exception)\n      {\n          exception.Handle(eachException =>\n          {\n\
  \              Console.WriteLine(\n                  $\"ERROR: { eachException.Message\
  \ }\");\n              return true;\n          });\n      }\n  }\n}\n```\n\n* *\
  \ *\n\n### 输出 18.4\n\n点击此处查看代码图像\n\nERROR: Operation is not valid due to\n\n聚合异常（Aggregate\
  \ exception）之所以被称为聚合是因为它可以包含许多异常。例如，假设并行执行十个任务，其中五个抛出了异常。为了在 `catch` 块中报告所有异常，框架使用了\
  \ `AggregateException`。此外，由于在编译时未知任务是否会抛出更多异常，故障任务始终会抛出 `AggregateException`。列表\
  \ 18.7 和输出 18.4 演示了这一点。尽管在工作线程上抛出的异常是 `InvalidOperationException`，但在主线程上捕获的异常类型是\
  \ `AggregateException`。此外，如所预期，捕获异常需要一个 `AggregateException` `catch` 块。`AggregateException`\
  \ 内部的异常可以通过 `InnerExceptions` 属性获取。你可以遍历此属性以检查每个异常。或者，如列表 18.7 所示，你可以使用 `Handle()`\
  \ 方法并指定 `AggregateException` 内部的异常。需要考虑 `Handle()` 方法的一个特性是它是一个谓词。对于 `Handle()`\
  \ 处理的任何异常，该谓词应该返回 `true`。如果任何异常返回 `false`，则 `Handle()` 方法将抛出一个包含此类异常的新 `AggregateException`。你\
  \ 也可以通过查看 `Exception` 属性来观察故障任务的状态。列表 18.8 通过等待完成来演示了这种方法，这是一种奇怪的做法，因为大多数情况下它根本不会被调度。提供此代码仅用于说明。\n\
  \n### 列表 18.8：使用 ContinueWith 观察 Task 未处理异常\n\n点击此处查看代码图像\n\n* * *\n\n```csharp\n\
  using System;\nusing System.Diagnostics;\nusing System.Threading.Tasks;\n\npublic\
  \ class Program\n{\n  public static void Main()\n  {\n    bool parentTaskFaulted\
  \ = false;\n    Task task = new Task(() =>\n    {\n        throw new InvalidOperationException();\n\
  \    });\n\n    Task continuationTask = task.ContinueWith(\n      (antecedentTask)\
  \ =>\n      {\n          parentTaskFaulted = antecedentTask.IsFaulted;\n      },\
  \ TaskContinuationOptions.OnlyOnFaulted);\n\n    task.Start();\n    continuationTask.Wait();\n\
  \    Trace.Assert(parentTaskFaulted);\n    Trace.Assert(task.IsFaulted);\n    task.Exception.Handle(eachException\
  \ =>\n    {\n        Console.WriteLine(\n            $\"ERROR: { eachException.Message\
  \ }\");\n        return true;\n    });\n  }\n}\n```\n\n* * *\n\n注意，要检索原始任务上的未处理异常，我们使用了\
  \ `Exception` 属性。输出结果与输出 18.4 完全一致。\n\n\n\n\n\n如果任务内部发生的异常完全没有被观察到——也就是说，(1) 它没有在任务内部被捕获；(2)\
  \ 永远没有通过 `Wait()`、`Result` 或访问 `Exception` 属性等方式观察到任务的完成；并且 (3) 故障的 `ContinueWith()`\
  \ 也未被观察——那么该异常可能完全没有被处理，导致整个进程范围内的未处理异常。在 .NET 4.0 中，此类发生故障的任务将由终结器线程（finalizer\
  \ thread）重新抛出，并可能导致进程崩溃。相比之下，在 .NET 4.5 中，崩溃行为已被抑制（尽管根据需要，可以配置 CLR 这种崩溃行为）。\n\n\
  在何种情况下，你都可以通过 `TaskScheduler.UnobservedTaskException` 事件为未处理的任务异常注册注册。\n\n***\n\n\
  # 高级主题：处理线程上的未处理异常\n\n正如我们之前讨论的，默认情况下，任何线程上的未处理异常都会导致应用程序关闭。未处理的异常是致命且意料之外的错误，该异常的发生可能是因为关键数据结构已损坏。因此，你无法知道程序可能在做什么，所以最安全的做法是立即关闭整个程序。\n\
  \n理想情况下，没有任何程序会在任何线程上抛出未处理的异常；抛出此类异常的程序存在 bug，最佳行动是在软件交付给客户之前找到并修复 bug。然而，当发生未处理异常时，与其尽快关闭应用程序，但保存任何工作数据和/或记录异常以便错误报告和未来的调试通常是理想的。这需要一种机制来注册未处理异常的通知。\n\
  \n每个 `AppDomain` 都提供这种机制，为了观察 `AppDomain` 中发生的未处理异常，你必须向 `UnhandledException` 事件添加处理程序。`UnhandledException`\
  \ 事件会在应用程序域内所有线程（无论是主线程还是工作线程）上发生所有未处理异常时触发。请注意，此机制的目的是通知；它并不允许应用程序从未处理异常中恢复并继续执行。事件处理程序运行后，应用程序将显示\
  \ Windows 错误报告对话框，然后应用程序将退出。（对于控制台应用程序，异常细节也将出现在控制台上。）\n\n在列表 18.9 中，我们展示了如何创建一个抛出异常的第二个线程，该异常随后由应用程序域的未处理异常处理程序处理。为了演示目的，为了线程时序问题不会产生影响，我们使用\
  \ `Thread.Sleep` 插入了一些人工延迟。输出 18.5 显示了结果。\n\n**列表 18.9：注册未处理异常**\n\n点击此处查看代码图像\n\
  \n***\n\n```csharp\nusing System;\n\nusing System.Diagnostics;\n\nusing System.Threading;\n\
  \npublic class Program\n{\n  public static Stopwatch clock = new Stopwatch();\n\n\
  \  public static void Main()\n  {\n    try\n    {\n      clock.Start();\n      //\
  \ 注册一个回调以接收             \n      // 任何未处理异常的通知。                              \n \
  \     AppDomain.CurrentDomain.UnhandledException +=             \n      (s, e) =>\
  \                              \n        {                              \n     \
  \     Message(\"Event handler starting\");   \n          Delay(4000);  \n      \
  \  };  \n      Thread thread = new Thread(() =>\n      {\n        Message(\"Throwing\
  \ exception.\");\n        throw new Exception();\n      });\n      thread.Start();\n\
  \      Delay(2000);\n    }\n    finally\n    {\n      Message(\"Finally block running.\"\
  );\n    }\n  }\n  static void Delay(int i)\n  {\n    Message($\"Sleeping for {i}\
  \ ms\");\n    Thread.Sleep(i);\n    Message(\"Awake\");\n  }\n  static void Message(string\
  \ text)\n  {\n    Console.WriteLine(\"{0}:{1:0000}:{2}\",\n      Thread.CurrentThread.ManagedThreadId,\n\
  \      clock.ElapsedMilliseconds, text);\n  }\n}\n```\n\n***\n\n**输出 18.5**\n\n\
  点击此处查看代码图像\n\n3:0047:Throwing exception.\n3:0052:Unhandled exception handler starting.\n\
  3:0055:Sleeping for 4000 ms\n1:0058:Sleeping for 2000 ms\n1:2059:Awake\n1:2060:Finally\
  \ block running.\n3:4059:Awake\nUnhandled Exception: System.Exception: Exception\
  \ of type 'System.Exception' was thrown.\n\n如你从输出 18.5 中所示，新线程被分配了线程 ID 3，主线程被分配了线程\
  \ ID 1。操作系统调度线程 3 运行一段时间；它抛出一个未处理异常，事件处理程序被调用，然后它进入睡眠。不久后，操作系统意识到线程 1 可以调度，但它的代码立即让它进入睡眠。线程\
  \ 1 首先唤醒并运行 `finally` 块，2 秒后线程 3 唤醒，未处理的异常最终导致进程崩溃。\n\n这一系列事件——事件处理程序的执行以及在执行完成后进程的崩溃——是典型的，但不是保证的。一旦你的程序中出现未处理异常，所有可控的因素都失效了；程序现在处于未知且可能极不稳定的状态，因此其行为是不可预测的。在这种情况下，如你所见，CLR\
  \ 允许主线程继续运行并执行 `finally` 块，尽管它知道在控制到达 `finally` 块之前，另一个线程正在 `AppDomain` 的未处理异常事件处理程序中。\n\
  \n为了强调这一事实，尝试修改延迟，使主线程睡眠的时间比事件处理程序长。在这种情况下，`finally` 块将永远不会执行！在线程 1 唤醒之前，进程会被未处理异常破坏。根据抛出异常的线程是否由线程池创建，也可以得到不同的结果。因此，最佳实践是避免所有可能的未处理异常，无论它们发生在工作线程还是主线程上。\n\
  \n这与任务有什么关系？当你想要关闭系统时，是否有未完成的任务在系统中挂起？我们将在下一节讨论任务取消。\n\n***\n\n### 指南\n\n- **避免**\
  \ 编写在任何线程上产生未处理异常的程序。\n- **考虑** 注册未处理异常处理程序，用于调试、日志记录和紧急关闭。\n- **应当** 取消未完成的任务，而不是让它们在应用程序关闭期间继续运行。\n\
  \n***\n\n\n\n\n\n```csharp\nCancellationTokenSource cancellationTokenSource = new\
  \ CancellationTokenSource();\n\n// 在 .NET 4.5 之前的 TPL 使用 Task.Factory.StartNew<string>()\n\
  Task task = Task.Run(\n    () => WritePi(cancellationTokenSource.Token),\n    cancellationTokenSource.Token);\n\
  \n// 等待用户输入\nConsole.ReadLine();\n\ncancellationTokenSource.Cancel();\n\nConsole.WriteLine(stars);\n\
  \ntask.Wait();\n\nConsole.WriteLine();\n\n\nprivate static void WritePi(\n    CancellationToken\
  \ cancellationToken)\n{\n    const int batchSize = 1;\n    string piSection = string.Empty;\n\
  \    int i = 0;\n    while(!cancellationToken.IsCancellationRequested || i == int.MaxValue)\n\
  \    {\n        piSection = PiCalculator.Calculate(\n            batchSize, (i++)\
  \ * batchSize);\n        Console.Write(piSection);\n    }\n}\n```\n\n**输出 18.6**\n\
  \n点击此处查看代码图像\n\n按回车退出。\n\n3.141592653589793238462643383279502884197169399375105820974944592307816402862089982803482534211067982140865132830664793344609550522312535940812848117450\n\
  \n启动任务后，`Console.ReadLine()` 阻塞了主线程。与此同时，任务继续执行，计算圆周率的下一个数字并将其打印。一旦用户按下回车键，执行将将遇到\
  \ `CancellationTokenSource.Cancel()` 调用。在 列表 18.10 中，我们将 `task.Cancel()` 调用与 `task.Wait()`\
  \ 调用分离开，并打印出一行星号。这一步的目的是为了说明在取消令牌被观察到之前，可能会发生额外的迭代——因此在 输出 18.6 的星号后面多了一个 `2`。这个\
  \ `2` 的出现是因为 `CancellationTokenSource.Cancel()` 并不会粗暴地停止任务的执行。任务会一直运行，直到它检查令牌，并在发现令牌所有者请求取消时，才会礼貌地关闭。\n\
  \n`Cancel()` 调用实际上设置了所有从 `CancellationTokenSource.Token` 复制而来的取消令牌上的 `IsCancellationRequested`\
  \ 属性。有几点需要注意：\n\n- 给异步任务的是 `CancellationToken` 而不是 `CancellationTokenSource`。`CancellationToken`\
  \ 允许对取消请求进行轮询；`CancellationTokenSource` 提供令牌并在其取消时对其发出信号（参见 图 18.2）。通过传递 `CancellationToken`\
  \ 而不是 `CancellationTokenSource`，我们不需要担心 `CancellationTokenSource` 上的线程同步问题，因为后者对原始线程仍然可访问。\n\
  \n![Image](img/18fig02)\n\n**图 18.2：CancellationTokenSource 和 CancellationToken\
  \ 类**\n\n- `CancellationToken` 是一个结构体，因此它是按值复制的。`CancellationTokenSource.Token`\
  \ 返回的值产生令牌的副本。由于此原因，`CancellationToken` 是线程安全的——它仅在 `WritePi()` 方法内部可用。为了监控 `IsCancellationRequested`\
  \ 属性，`CancellationToken` 的副本（从 `CancellationTokenSource.Token` 获取）被传递给任务。在 列表 18.9\
  \ 中，我们偶尔检查 `CancellationToken` 参数上的 `IsCancellationRequested` 属性；在这种情况下，我们在每个数字计算后进行检查。如果\
  \ `IsCancellationRequested` 返回 `true`，则 `while` 循环退出。与线程中止（它会在基本上随机的时间点抛出异常）不同，我们使用正常的控制流退出循环。我们通过频繁轮询来确保代码对取消请求的响应性。\n\
  \n关于 `CancellationToken` 的另一个点是重载的 `Register()` 方法。通过此方法，你可以注册一个操作，该操作会在令牌被取消时被调用。换句话说，调用\
  \ `Register()` 方法相当于订阅了相应 `CancellationTokenSource` 的 `Cancel()` 监听器。\n\n鉴于在完成之前取消是该程序的预期行为，列表\
  \ 18.9 中的代码并没有抛出 `System.Threading.Tasks.TaskCanceledException`。结果是，`task.Status`\
  \ 将返回 `TaskStatus.RanToCompletion`——没有关于任务工作实际上已取消的任何指示。在这个示例中，不需要这样的指示；但是 TPL 确实包含了执行此功能。如果取消调用在某些方面具有破坏性——例如阻止了有效结果的返回——抛出\
  \ `TaskCanceledException`（继承自 `System.OperationCanceledException`）将是 TPL 报告该错误的模式。与其显式地抛出异常，`CancellationToken`\
  \ 包含一个 `ThrowIfCancellationRequested()` 方法来更更容易报告异常，假设有一个 `CancellationToken` 实例。\n\
  \n如果你尝试在抛出 `TaskCanceledException` 的任务上调用 `Wait()`（或获取 `Result`），其行为与任务抛出任何其他异常相同：调用将抛出\
  \ `AggregateException`。该异常意味着后续执行状态可能是不完整的。与成功完成的任务不同，已取消的任务可能执行了部分工作——该任务的执行状态是不可信的。\n\
  \n此示例演示了长时间运行的处理器绑定操作（无限计算圆周率）如何监控取消请求并在发生时做出响应。然而，在某些情况下，取消可以在目标任务内部没有显式编码的情况下发生。例如，本章后面讨论的\
  \ `Parallel` 类默认就提供了这种行为。\n\n\n\n\n正如我们之前在 Listing 18.2 的注释中所讨论的，线程池假设工作项是处理器密集型且生命周期较短的；它做出这些假设是为了有效限制创建线程的数量。这防止了昂贵的线程资源的过度分配，以及处理器的过度复用（后者会导致过度的上下文切换和时间片划分）。\n\
  \n但如果开发者知道某个任务将长时间运行，因此会长时间占用底层线程资源怎么办？在这种情况下，开发者可以通知调度器该任务不太可能短期内完成工作。这有两个效果：首先，它向调度器提示，也许应该专门为此任务创建一个专用线程，而不是尝试从线程池中获取线程。其次，它提示调度器，现在可能是允许调度的任务数量超过处理任务的处理器数量的好时机。这将导致更多的时间片划分，这是一件好事。我们不希望一个长运行任务独占整个处理器，并阻止短运行任务使用它。短运行任务将利用其时间片完成大部分工作，而长运行任务可能不会注意到由于与其他任务共享处理器而造成的相对轻微延迟。要实现这一点，在调用\
  \ `StartNew()` 时请使用 `TaskCreationOptions.LongRunning` ，如 Listing 18.12 所示。（`Task.Run()`\
  \ 不支持 `TaskCreationOptions` 参数）。\n\n#### 列表 18.12: 协作执行长运行任务\n\n点击此处查看代码图像\n\n```csharp\n\
  using System.Threading.Tasks;\n\n// ...\n\nTask task = Task.Factory.StartNew(\n\
  \    () =>\n        WritePi(cancellationTokenSource.Token),\n        TaskCreationOptions.LongRunning);\n\
  // ...\n```\n\n### 指南\n\n**必须**告知任务工厂新创建的任务可能是长运行的，以便其对其进行妥善管理。\n\n**必须**谨慎使用 `TaskCreationOptions.LongRunning`。\n\
  \n#### 任务是可释放的\n\n请注意 `Task` 也支持 `IDisposable`。这是必要的，因为 `Task` 在等待其完成时可能会分配一个 `WaitHandle`；由于\
  \ `WaitHandle` 支持 `IDisposable`，根据最佳实践，`Task` 也支持 `IDisposable`。然而，读者会注意到，之前的代码示例没有包含\
  \ `Dispose()` 调用，也没有通过 `using` 语句隐式地依赖此类调用。列表而是依赖于程序退出时自动对 `WaitHandle` 终析函数的调用。\n\
  \n这种方法导致了两个显著结果：首先，句柄存活时间更长，因此消耗了比更多的资源。其次，垃圾回收器的效率略低，因为已终结的对象会存活到下一代。然而，在 `Task`\
  \ 这种情况下，除非正在终结极大量的任务，否则这些担忧都是无关紧要的。因此，尽管从技术上讲所有代码都应该释放任务，但除非性能指标要求且操作简单，否则你不需要费心这样做——也就是说，如果你确定\
  \ `Task` s 已经完成且没有其他代码正在使用它们。\n\n## 基于任务的异步模式 (TAP)\n\n正如我们目前为止看到的，与线程相比，任务为处理异步工作提供了更好的抽象。任务会自动被调度到正确数量的线程中，大任务可以通过链联小任务来组合，就像大型程序可以由多个小方法组成一样。\n\
  \n然而，任务也有一些缺点。任务的主要困难在于它们让你的程序逻辑变得“反过来”。为了说明这一点，我们首先考虑一个阻塞在 I/O 密集型高延迟操作（网络请求）上的同步方法。接下来，我们将其与\
  \ C# 5.0 之前的异步版本以及基于任务的异步模式 (TAP) 进行比较。最后，我们使用 C# 5.0（及更高版本）以及 `async`/`await` 上文关键字修改相同的示例。\n\
  \n#### 同步调用高延迟操作\n\n在 Listing 18.13 中，代码使用 `WebRequest` 下载网页并显示其大小。如果操作失败，则会抛出异常。\n\
  \n#### 列表 18.13: 同步网络请求\n\n点击此处查看代码图像\n\n```csharp\nusing System;\nusing System.IO;\n\
  using System.Net;\nusing System.Linq;\n\npublic class Program\n{\n    public static\
  \ void Main(string[] args)\n    {\n        string url = \"http://www.IntelliTect.com\"\
  ;\n        if(args.Length > 0)\n        {\n            url = args[0];\n        }\n\
  \        try\n        {\n            Console.Write(url);\n            WebRequest\
  \ webRequest = WebRequest.Create(url);\n            WebResponse response = WebRequest.GetResponse();\n\
  \            Console.Write(\".....\");\n            using(StreamReader reader =\
  \ new StreamReader(response.GetResponseStream()))\n            {\n             \
  \   string text = reader.ReadToEnd();\n                Console.WriteLine(FormatBytes(text.Length));\n\
  \            }\n        }\n        catch(WebException)\n        {\n            //\
  \ ...\n        }\n        catch(IOException)\n        {\n            // ...\n  \
  \      }\n        catch(NotSupportedException)\n        {\n            // ...\n\
  \        }\n    }\n    static public string FormatBytes(long bytes)\n    {\n   \
  \     string[] magnitudes = new string[] { \"GB\", \"MB\", \"KB\", \"Bytes\" };\n\
  \        long max = (long)Math.Pow(1024, magnitudes.Length);\n        return string.Format(\"\
  {1:##} {0}\",\n            magnitudes.FirstOrDefault(\n                magnitude\
  \ => bytes > (max /= 1024)) ?? \"0 Bytes\",\n            (decimal)bytes / max);\n\
  \    }\n}\n```\n\nListing 18.13 中的逻辑相对直接——使用常用的 C# 惯用法 try/catch 块和 `return` 语句来描述控制流。给定\
  \ `WebRequest`，此代码调用 `GetResponse()` 下载页面。为了获取流访问，它调用 `GetResponseStream()` 并结果赋值给\
  \ `StreamReader`。最后，它通过 `ReadToEnd()` 读取流以确定大小，然后将其打印到屏幕上。\n\n这种方法的问题在于调用线程被阻塞直到\
  \ I/O 操作完成；这在异步操作执行时浪费了本可以执行有用工作的线程。由于这个原因，我们我们无法执行其他指示进度的代码。\n\n#### 使用 TPL 异步调用高延迟操作\n\
  \n为了解决这个问题，Listing 18.14 采用了类似的方法，但使用了基于 TPL 的异步处理。\n\n#### 列表 18.14: 异步请求\n\n点击此处查看代码图像\n\
  \n```csharp\nusing System;\nusing System.IO;\nusing System.Net;\nusing System.Linq;\n\
  using System.Threading.Tasks;\nusing System.Runtime.Exception;\n\npublic class Program\n\
  {\n    public static void Main(string[] args)\n    {\n        string url = \"http://www.IntelliTect.com\"\
  ;\n        if(args.Length > 0)\n        {\n            url = args[0];\n        }\n\
  \        Console.Write(url);\n        Task task = WriteWebRequestSizeAsync(url);\n\
  \        try\n        {\n            while(!task.Wait(100))\n            {\n   \
  \             Console.Write(\".\");\n            }\n        }\n        catch(AggregateException\
  \ exception)\n        {\n            exception = exception.Flatten();\n        \
  \    try\n            {\n                exception.Handle(innerException =>\n  \
  \              {\n                    // 重新抛出而不是对\n                    // 类型使用 if\
  \ 判断。\n                });\n            }\n        }\n    }\n\n    private static\
  \ async Task WriteWebRequestSizeAsync(string url)\n    {\n        // 实现细节...\n \
  \   }\n}\n```\n\n\n\n\n```csharp\nExceptionDispatchInfo.Capture(\n    exception.InnerException)\n\
  .Throw();\nreturn true;\n});\n}\ncatch(WebException)\n{\n    // ...\n}\ncatch(IOException\
  \ )\n{\n    // ...\n}\ncatch(NotSupportedException )\n{\n    // ...\n}\n}\n}\n\n\
  private static Task WriteWebRequestSizeAsync(\n    string url)\n{\n    StreamReader\
  \ reader = null;\n    WebRequest webRequest = WebRequest.Create(url);\n    Task\
  \ task = webRequest.GetResponseAsync()\n    .ContinueWith(antecedent =>\n    {\n\
  \        WebResponse response = antecedent.Result;\n        reader = new StreamReader(response.GetResponseStream());\n\
  \        return reader.ReadToEndAsync();\n    })\n    .Unwrap()\n    .ContinueWith(antecedent\
  \ =>\n    {\n        if(reader != null) reader.Dispose();\n        string text =\
  \ antecedent.Result;\n        Console.WriteLine(FormatBytes(text.Length));\n   \
  \ });\n    return task;\n}\n// ...\n```\n\n与示例 18.13 不同，当示例 18.14 执行时，它会在页面下载期间向控制台打印点。结果是，它并不是简单地向控制台打印四个点（“...”），而是示例\
  \ 18.14 能够在下载文件、从流中读取文件以及确定其大小所需的时间内，持续打印点。\n\n遗憾的是，这种异步性是以复杂性为代价的。代码中穿插着与 TPL 相关的代码，中断了执行流。异步版本的代码并不是简单地在调用\
  \ `WebRequest.GetResponseAsync()` 之后执行获取 `StreamReader` 并调用 `ReadToEndAsync()` 的步骤，而是需要\
  \ `ContinueWith()` 语句。第一个 `ContinueWith()` 语句确定了在 `WebRequest.GetResponseAsync()`\
  \ 之后执行的内容。注意第一个 `ContinueWith()` 表达式中的 `return` 语句返回了 `StreamReader.ReadToEndAsync()`，它又返回了另一个\
  \ `Task`。\n\n因此，如果没有 `Unwrap()` 调用，第二个 `ContinueWith()` 语句中的 `antecedent` 将是一个 `Task<Task<string>>`，这本身就说明了复杂性。结果是我们需要调用两次\
  \ `Result`——一次直接作用于 `antecedent`，第二次作用于返回的 `Task<string>.Result` 属性 `antecedent.Result`，后者会阻塞后续的执行，直到\
  \ `ReadToEnd()` 操作完成。为了避免 `Task<Task<TResult>>` 结构，我们在调用 `ContinueWith()` 之前先调用了\
  \ `Unwrap()`，从而剥离外层的 `Task` 并妥善地处理任何错误或取消请求。\n\n然而，复杂性并不仅止于 `Task` 和 `ContinueWith()`：异常处理为复杂性增加了一个完全不同的维度。正如前面提到的，TPL\
  \ 通常会抛出 `AggregateException` 异常，因为异步操作可能会遇到多个异常。但是，由于我们是在 `ContinueWith()` 块内部调用\
  \ `Result` 属性，在工作线程内部我们也可能抛出 `AggregateException`。\n\n正如你早早在本章前面的部分学到的，有多种方法来处理这些异常：\n\
  \n1. 我们可以为所有返回任务的 `*Async` 方法以及每个 `ContinueWith()` 方法调用添加后续任务。然而，这样做将阻止我们使用流式 API（即\
  \ `ContinueWith()` 语句一个接一个链式）。此外，这将迫使我们将错误处理逻辑深度嵌入控制流中，而不是简单地依赖异常处理。\n\n2. 我们可以将每个委托体封装在\
  \ `try/catch` 块中，以确保任务中没有异常未被处理。遗憾的是，这种方法也不理想。首先，某些异常（例如在调用 `antecedent.Result`\
  \ 时触发的异常）会抛出 `AggregateException`，我们需要从中解包 `InnerException`(s) 以单独处理它们。在解包后，我们要么重新抛出它们以捕获特定类型，要么在任何其他\
  \ catch 块之外单独条件检查异常类型（即使是针对相同类型的 catch 块）。其次，每个委托体都需要自己独立的 `try/catch` 处理器，即使其中一些是相同的。\n\
  \n3. 我们可以忽略 `WebRequestSizeAsync()` 内部的所有异常处理，而是完全依赖包裹 `Main` 的 catch 块。由于我们知道异常将是\
  \ `AggregateException`，我们可以使用 `ExceptionDispatchInfo` 对象来处理异常，以免丢失堆栈跟踪。这些异常随后会被预期的处理器捕获并进行相应的处理。但请注意，在处理\
  \ `AggregateException` 的 `InnerException` 之前，我们首先调用了 `AggregateException.Flatten()`。这一步解决了\
  \ `AggregateException` 包装内部异常的问题，并确保了所有包含的 `AggregateException` 都被移除。\n\n\n\n\n\
  幸运的是，事实证明编写一个可以为你执行这些复杂代码转换的计算机程序并不困难。C# 语言的设计者已经预到了这种需求会出现，因此他们在 C# 5.0 编译器中添加了这种功能。从\
  \ C# 5.0 开始，你可以使用基于任务的异步模式（TAP）更轻松地将之前提供的同步程序重写为异步程序；然后 C# 编译器会完成将你的方法转换为一系列任务延续（task\
  \ continuations）的繁琐工作。列表 18.15 了如何将列表 18.13 重写为异步方法，而无需像列表 18.14 那样进行重大的结构变化。\n\n\
  ### 列表 18.15：使用基于任务的异步模式进行网络请求\n\n点击此处查看代码图像\n\n```csharp\nusing System;\nusing\
  \ System.IO;\nusing System.Net;\nusing System.Linq;\nusing System.Threading.Tasks;\n\
  \npublic class Program\n{\n    private static async Task WriteWebRequestSizeAsync(string\
  \ url)\n    {\n        try\n        {\n            WebRequest webRequest =\n   \
  \             WebRequest.Create(url);\n            WebResponse response =\n    \
  \            await webRequest.GetResponseAsync();\n            using(StreamReader\
  \ reader =\n                new StreamReader(\n                    response.GetResponseStream()))\n\
  \            {\n                string text =\n                    await reader.ReadToEndAsync();\n\
  \                Console.WriteLine(\n                    FormatBytes(text.Length));\n\
  \            }\n        }\n        catch(WebException)\n        {\n            //\
  \ ...\n        }\n        catch(IOException )\n        {\n            // ...\n \
  \       }\n        catch(NotSupportedException )\n        {\n            // ...\n\
  \        }\n    }\n\n    public static void Main(string[] args)\n    {\n       \
  \ string url = \"http://www.IntelliTect.com\";\n        if(args.Length > 0)\n  \
  \      {\n            url = args[0];\n        }\n        Console.Write(url);\n \
  \       Task task = WriteWebRequestSizeAsync(url);                     \n      \
  \  while(!task.Wait(100))\n        {\n            Console.Write(\".\");\n      \
  \  }\n    }\n}\n```\n\n注意列表 18.13 和列表 18.15 之间的细微差异。首先，我们将网络请求的主体重构为一个新方法（`WriteWebRequestSizeAsync()`），并在方法声明中添加了新关键字\
  \ `async`。带有此关键字修饰的方法必须返回 `Task`、`Task<T>` 或 `void`。在这种情况下，由于主体没有返回任何数据，但我们仍然希望具有向调用者返回信息的能力，因此\
  \ `WriteWebRequestSizeAsync()` 返回 `Task`。注意方法名的后缀是 `Async`；这并不是必须的，但以这种方式标记异步方法是惯例。最后，在每个与同步方法等价的地方，我们在调用异步版本之前插入了新关键字\
  \ `await`。\n\n注意在列表 18.13 和列表 18.15 之间没有其他变化。异步方法版本仍然返回与之前相同的数据类型——尽管它们实际上都返回了 `Task<T>`。这并不是通过某种隐式转换实现的。`GetResponseAsync()`\
  \ 的声明如下：\n\n```csharp\npublic virtual Task<WebResponse> GetResponseAsync() { ...\
  \ }\n```\n\n在调用处，我们将返回值赋值给 `WebResponse`：\n\n```csharp\nWebResponse response = await\
  \ webRequest.GetResponseAsync()\n```\n\n`async` 关键字起着关键作用，它向编译器信号，应该将表达式重写为状态机，表示在列表\
  \ 18.14 中看到的所有控制流。此外，注意列表 18.15 中相比列表 18.14 引入的 try/catch 逻辑改进。在列表 18.15 中，不需要捕获\
  \ `AggregateException`。`catch` 句继续捕获预期的精确异常类型，不需要对内部异常进行解包。相反，编译器的重写确保了任务中的 `AggregateException`（及其内部集合）只有在你\
  \ `await` 任务时才会按预期方式运行，此时重写会从集合中提取第一个异常并将其抛出。目标是让异步代码尽可能看起来像同步代码。\n\n为了更好地理解控制流，表\
  \ 18.2 在单独的列中显示了每个任务以及在每个任务上发生的执行操作。\n\n![Image](img/18tab02.jpg)\n\n### 表 18.2：每个任务内部的控制流\n\
  \n表格有助于消除几个重要的误区：\n\n-   **误区 #1：使用 async 关键字修饰的方法在调用时会自动在工作线程上执行。** 这完全不是真的；该方法会在调用线程上正常执行，如果实现没有等待任何可等待的任务，它将同步执行。启动异步工作是由实现负责的。仅仅使用\
  \ `async` 关键字并不会改变方法的执行位置。对于调用者来说，调用 `async` 方法没有任何异常之处；它被类型为返回 `Task`，正常调用并返回其类型对象。\n\
  -   **误区 #2：await 关键字会导致当前线程阻塞直到等待的任务完成。** 这也完全不是真的。如果你想当前线程阻塞直到任务完成，请调用 `Wait()`\
  \ 方法，正如我们之前描述的那样。事实上，`Main` 线程在等待任务完成时反复这样做。然而，`while(!task.Wait(100))` 调用与其他任务并发执行的——而不是同步执行。`await`\
  \ 关键字评估其随后的表达式（通常为 `Task` 或 `Task<T>`），向结果任务添加延续，然后*立即*返回控制权给调用者。任务的创建启动了异步工作；`await`\
  \ 关键字意味着开发者希望调用者在处理异步工作时在此线程继续执行。工作完成后，执行将在 `await` 表达式之后恢复。\n\n事实上，`async` 关键字存在的两个主要原因。首先，它让代码阅读者非常清楚后续方法将被编译器自动重写。其次，它通知编译器方法中\
  \ `await` 关键字的使用被视为异步控制流，而不是普通的标识符。\n\n#### 异步 Lambda 表达式\n\n正如转换为委托的 Lambda 表达式可以作为声明普通方法的简洁语法一样，C#\
  \ 5.0（及更高版本）也允许包含 `await` 表达式的 Lambda 表达式转换为委托。要这样做，只需在 Lambda 表达式前面加上 `async` 关键字即可。在列表\
  \ 18.16 中，我们将来自列表 18.15 的 `GetResourceAsync()` 方法从 `async` 方法重写为 `async` Lambda\
  \ 表达式。\n\n**列表 18.16：作为 Lambda 表达式的异步客户端-服务器交互**\n\n\n\n\n\n点击此处查看代码\n\n```csharp\n\
  using System;\nusing System.IO;\nusing System.Net;\nusing System.Linq;\nusing System.Threading.Tasks;\n\
  \npublic class Program\n{\n  public static void Main(string[] args)\n  {\n     \
  \ string url = \"http://www.IntelliTect.com\";\n      if(args.Length > 0)\n    \
  \  {\n          url = args[0];\n      }\n      Console.Write(url);\n      Func<string,\
  \ Task> writeWebRequestSizeAsync =\n          async (string webRequestUrl) =>\n\
  \          {\n              // 为了便于说明，省略了// 错误处理。\n              WebRequest webRequest\
  \ =\n                  WebRequest.Create(url);\n              WebResponse response\
  \ =\n                  await webRequest.GetResponseAsync();\n              using(StreamReader\
  \ reader =\n                  new StreamReader(\n                      response.GetResponseStream()))\n\
  \              {\n                  string text =\n                      (await\
  \ reader.ReadToEndAsync());\n                  Console.WriteLine(\n            \
  \          FormatBytes(text.Length));\n              }\n          };\n      Task\
  \ task = writeWebRequestSizeAsync(url);               \n      while (!task.Wait(100))\n\
  \      {\n          Console.Write(\".\");\n      }\n  }\n  // ...\n}\n```\n\n请注意，`async`\
  \ lambda 表达式具有与具名 `async` 方法完全相同的限制：\n\n-   `async` lambda 表达式必须转换为一个返回类型为 `void`、`Task`\
  \ 或 `Task<T>` 的委托。\n-   lambda 表达式会被重写，使得 `return` 语句变为指示由 lambda 表达式返回的任务已使用给定结果完成的信号。\n\
  -   lambda 表达式内部的执行将同步进行，直到在对未完成的可等待对象上执行了第一个 `await` 为止。\n-   `await` 之后的所有指令将在调用的异步方法返回时作为延续执行（或者如果可等待对象已完成，则将直接同步执行，而不是作为延续执行）。\n\
  -   `async` lambda 表达式可以使用 `await` 调用（未在列表 18.16 中显示）。\n\n## 高级主题：实现自定义异步方法\n\n\
  通过 `await` 关键字依赖其他方法（这些方法反过来又依赖异步方法）来实现异步方法是相对容易的。然而，在调用层次结构的某个点，有必要编写一个返回 `Task`\
  \ 的“叶子”方法。例如，考虑一个用于运行命令行程序的异步方法，其最终目标是可以访问该输出。此类方法的声明如下：点击此处查看代码``static Task<Process>\
  \ RunAsync(string filename)`\n\n最简单的实现方法当然是依赖 `Task.Run()` 并调用 `System.Diagnostics.Process`\
  \ 的 `Start()` 和 `WaitForExit()` 方法。但是，当被调用的进程拥有自己的一个或多个线程时，在当前进程中创建一个额外的线程是没有必要的。为了实现\
  \ `RunAsync()` 方法并在被调用进程完成后返回到调用者的同步上下文，我们可以依赖 `TaskCompletionSource<T>` 对象，如列表\
  \ 18.7 所示。\n\n### 列表 18.17：实现一个异步方法\n\n点击此处查看代码\n\n```csharp\nusing System.Diagnostics;\n\
  using System.Threading;\nusing System.Threading.Tasks;\n\nclass Program\n{\n  static\
  \ Task<Process> RunAsync(\n    string fileName,\n    string arguments = null,\n\
  \    CancellationToken cancellationToken =\n      default(CancellationToken))\n\
  \  {\n    TaskCompletionSource<Process> taskCS =\n      new TaskCompletionSource<Process>();\n\
  \    Process process = new Process()\n    {\n      StartInfo = new ProcessStartInfo(fileName)\n\
  \      {\n        UseShellExecute = false,\n        Arguments = arguments\n    \
  \  },\n      RaisingEvents = true\n    };\n    process.Exited += (sender, localEventArgs)\
  \ =>\n    {\n      taskCS.SetResult(process);\n    };\n    cancellationToken\n \
  \     .ThrowIfCancellationRequested();\n    process.Start();\n    cancellationToken.Register(()\
  \ =>\n    {\n      process.CloseMainWindow();\n    });\n    return taskCS.Task;\n\
  \  }\n  // ...\n}\n```\n\n暂时忽略这些高亮部分，关注在进程完成时使用事件的模式。`async` 方法依赖与 TAP 相同的取消机制——即\
  \ `System.Threading.CancellationToken`。列表 18.17 高亮了支持取消所需的代码。在此示例中，我们允许在进程启动之前取消，并尝试关闭应用程序窗口（如果有的话）。更激进的方法是调用\
  \ `Process.Kill()`，但这可能会对正在执行的程序产生问题。请注意，我们在进程启动后才注册取消事件，这避免了在进程触发取消前可能发生的竞态条件。\n\
  \n最后一个需要考虑的功能是进度更新。列表 18.18 是具有此类更新的 `RunAsync()` 完整版本。\n\n\n\n\n\n```csharp\nprogress.Report(\n\
  \    new ProcessProgressEventArgs(\n        localEventArgs.Data,\n        objectState));\n\
  };\n}\n\nif(cancellationToken.IsCancellationRequested)\n{\n    cancellationToken\n\
  \        .ThrowIfCancellationRequested();\n}\n\nprocess.Start();\nif(progress !=\
  \ null)\n{\n    process.BeginOutputReadLine();\n}\n\ncancellationToken.Register(()\
  \ =>\n{\n    process.Close();\n    cancellationToken\n        .ThrowIfCancellationRequested();\n\
  });\nreturn task;\n}\n// ...\n\nclass ProcessProgressEventArgs\n{\n// ...\n}\n\n\
  ### 进阶主题：等待非 Task<T> 类型的值\n\n通常情况下，跟在 `await` 关键字后面的表达式是 `Task` 类型或 `Task<T>` 类型。在目前为止的\
  \ `await` 示例中，跟在关键字后面的表达式都返回了 `Task<T>`。从语法角度来看，操作 `Task` 类型的 `await` 本质上等同于返回 `void`\
  \ 的表达式。事实上，由于编译器甚至不知道任务是否有结果，更不用说它是什么类型了，因此此类表达式的分类方式与调用返回 `void` 的方法相同；即，它只能在语句中使用。`Listing\
  \ 18.19` 显示了一些作为语句使用的 `await` 表达式。\n\n#### 列表 18.19：await 表达式可以是一个语句\n\n```csharp\n\
  async Task<int> DoStuffAsync()\n{\n    await DoSomethingAsync();\n    await DoElseAsync();\n\
  \    return await GetIntegerAsync() + 1;\n}\n```\n\n在这里，我们假设前两个方法返回的是 `Task` 而不是\
  \ `Task<T>`。由于这两个任务没有关联的结果，等待它们不会产生值；因此该表达式必须以语句的形式出现。第三个任务假设是 `Task<int>` 类型，它的值可以用于\
  \ `DoStuffAsync()` 返回的任务的计算中。\n\n“进阶主题”以“通常（Generally）”一词开头——这是一种有刻意的引入。事实上，关于 `await`\
  \ 所需的返回类型的精确规则比单纯的 `Task` 或 `Task<T>` 更通用。相反，它要求该类型支持 `GetAwaiter`。该方法会产生一个具有编译器重写逻辑所需的某些属性和方法的对象。这使得系统可以由第三方扩展。然而，如果你想设计自己的非基于\
  \ Task 的异步机制，使用其他类型来表示异步工作，你可以这样做并仍然使用 `await` 语法。这种通过根据特定签名查找特定方法来允许第三方扩展的技术也用于其他\
  \ C# 特性：LINQ 寻找诸如 `Select()` 和 `Where()` 等方法来实现通过 `select` 和 `where` 关键字，而 `foreach`\
  \ 循环不需要集合实现 `IEnumerable`，只需要它具有适当的 `GetEnumerator()` 方法。请注意，无论方法内部等待的是什么类型，都不可能让\
  \ `async` 方法返回 `void`、`Task` 或 `Task<T>` 以外的内容。\n\n要准确理解 `async` 方法中到底发生了什么可能是困难的，但比试图弄清楚在\
  \ lambda 中使用显式延续编写的异步代码在做什么要容易得多。需要记住的关键点如下：\n\n- 当控制到达 `await` 关键字时，跟在它后面的表达式会产生一个任务。控制随后返回给调用者，以便其在任务异步执行完成时可以继续执行工作。从技术上讲，它是进阶主题“等待非\
  \ Task<T>”中描述的可等待类型。\n- 在任务完成一段时间后，控制在 `await` 之后的点恢复。如果等待的任务产生了结果，则获取该结果。如果发生故障（fault），则抛出异常。\n\
  - `async` 方法中的 `return` 语句会导致与方法调用关联的任务变为完成；如果 `return` 语句有值，则返回的值将成为任务的结果。\n\n\
  #### 任务调度器与同步上下文\n\n在本章偶尔提到了任务调度器及其在决定如何高效将工作分配给线程方面的作用。在程序中，任务调度器是 `System.Threading.Tasks.TaskScheduler`\
  \ 的实例。该类默认使用线程池来适当调度任务，决定如何安全且高效地执行它们——何时重用它们、销毁它们或创建额外的任务。\n\n通过从 `TaskScheduler`\
  \ 类派生新类型，可以创建自己的任务调度器，对如何调度任务做出不同的选择。你可以使用静态方法 `FromCurrentSynchronizationContext()`\
  \ 获取一个将任务调度到当前线程（或更准确地说，到与当前线程关联的`同步上下文`）而不是其他工作线程的 `TaskScheduler`。示例请参阅 *Multithreading\
  \ Patterns Prior to C# 5.0* 中的 `Listing C.8`，地址位于 `IntelliTect.com/EssentialCSharp`。\n\
  \n任务执行以及随后执行的延续任务的 `同步上下文` 是重要的，因为等待的任务会咨询同步上下文（假设存在），以便任务能够高效且安全地执行。`Listing 18.20`（连同\
  \ `Output 18.7`）与 `Listing 18.5` 类似，但它在显示消息时还打印了线程 ID。\n\n#### 列表 18.20：调用 Task.ContinueWith()\n\
  \n```csharp\nusing System;\nusing System.Threading;\nusing System.Threading.Tasks;\n\
  \npublic class Program\n{\n    public static void Main()\n    {\n        DisplayStatus(\"\
  Before\");\n        Task taskA =\n            Task.Run(() =>\n                DisplayStatus(\"\
  Starting...\"))\n            .ContinueWith(antecedent =>\n                DisplayStatus(\"\
  Continuing A...\"));\n\n        Task taskB = taskA.ContinueWith(antecedent =>\n\
  \            DisplayStatus(\"Continuing B...\"));\n\n        Task taskC = taskA.ContinueWith(antecedent\
  \ =>\n            DisplayStatus(\"Continuing C...\"));\n\n        Task.WaitAll(taskB,\
  \ taskC);\n        DisplayStatus(\"Finished!\");\n    }\n\n    private static void\
  \ DisplayStatus(string message)\n    {\n        string text = string.Format(\n \
  \           $@\"{ Thread.CurrentThread.ManagedThreadId}: { message }\");\n     \
  \   Console.WriteLine(text);\n    }\n}\n```\n\n**输出 18.7**\n\n1: Before\n3: Starting...\n\
  4: Continuing A...\n3: Continuing C...\n4: Continuing B...\n1: Finished!\n\n\n\n\
  \n\n此输出值得注意的是，线程 ID 有时会变化，而在其他时候会重复。在此类简单的控制台应用程序中，同步上下文（可以通过 `SynchronizationContext.Current`\
  \ 访问）为空空——默认的同步上下文会导致线程池处理线程分配。这解释了为什么线程 ID 在任务之间会发生变化：线程池有时认为使用新线程更有效，而有时则认为重用现有线程是最佳行动方案。\n\
  \n幸运的是，对于那些同步上下文至关重要的应用程序类型，同步上下文会自动设置。例如，如果创建任务的代码运行在由 ASP.NET 创建的线程中，则该线程将关联一个类型为\
  \ `AspNetSynchronizationContext` 的同步上下文。相比之下，如果你的代码运行在 Windows UI 应用程序（WPF 或 Windows\
  \ Forms）创建的线程中，则该线程将关联一个 `DispatcherSynchronizationContext` 实例。（对于控制台应用程序，默认没有同步上下文。）由于\
  \ TPL 会咨询同步上下文，而同步上下文会根据执行情况而异，因此 TPL 能够调度在既高效又安全的上下文中执行后续任务。\n\n若要修改代码以利用同步上下文，你必须\
  \ (1) 设置同步上下文，并且 (2) 使用 `async`/`await` 以便咨询同步上下文。\n\n[11]。有关如何设置线程同步上下文以及如何使用任务调度器将任务调度到该线程的简单示例，请参阅\
  \ *C# 5.0 之前的多线程模式* 中的 [Listing C.8]，该书可在 `IntelliTect.com/EssentialCSharp` 获取。\n\
  \n可以定义自定义同步上下文，并与现有的同步上下文协作以提高某些特定场景下的性能。然而，描述如何这样做超出了本文的范围。\n\n## Windows UI 中使用\
  \ async/await\n\n同步特别重要的一个地方是 UI 和 Web 编程上下文。例如，在 Windows UI 中，消息泵处理如鼠标点击和移动事件之类的消息。此外，UI\
  \ 是单线程的，因此与任何 UI 组件（例如文本框）的交互必须始终从单 UI 线程发生。`async`/`await` 模式的密钥优势之一是它利用同步上下文来确保后续工作——即\
  \ `await` 语句之后的工作——将始终在调用 `await` 语句的同一个同步任务上执行。这种方法具有重要价值，因为它消除了显式切换回 UI 线程来更新控件的需求。\n\
  \n为了更好地理解这一优势，请考虑 WPF 中按钮点击的 UI 事件示例，如 [Listing 18.21] 所示。\n\n### 列表 18.21: WPF\
  \ 中的同步高延迟调用\n\n[点击此处查看代码图片]\n\n```sharp\nusing System;\n\nprivate void PingButton_Click(\n\
  \  object sender, RoutedEventArgs e)\n{\n  StatusLabel.Content = \"Pinging...\"\
  ;\n  UpdateLayout();\n  Ping ping = new Ping();\n  PingReply pingReply =\n     \
  \ ping.Send(\"www.IntelliTect.com\");\n  StatusLabel.Text = pingReply.Status.ToString();\n\
  }\n```\n\n考虑到 `StatusLabel` 是一个 WPF `System.Windows.Controls.TextBlock` 控件，并且我们在\
  \ `PingButton_Click()` 事件订阅器中更新了两次 `Content` 属性，一个合理的假设是：第一个“Pinging...”将一直显示，直到\
  \ `Ping.Send()` 返回，然后标签将用 `Send()` 回复的状态进行更新。正如熟悉 Windows UI 框架的人士所知，这实际上并非发生的情况。相反，消息被发送到\
  \ Windows 消息泵中用“Pinging...”更新内容，但由于 UI 线程正在执行 `PingButton_Click()` 方法，Windows 消息泵没有被处理。等到\
  \ UI 线程空闲查看 Windows 消息泵时，第二个 `Text` 属性更新请求已经入队，用户能够观察到的唯一消息是最终状态。\n\n要使用 TAP 修复这个问题，我们更改了\
  \ [Listing 18.22] 中高亮显示的代码。\n\n### 列表 18.22: 使用 await 在 WPF 中的同步高延迟调用\n\n[点击此处查看代码图片]\n\
  \n```csharp\nusing System;\n\nasync private void PingButton_Click(\n  object sender,\
  \ RoutedEventArgs e)\n{\n  StatusLabel.Content = \"Pinging...\";\n  UpdateLayout();\n\
  \  Ping ping = new Ping();\n  PingReply pingReply =\n      await ping.SendPingAsync(\"\
  www.IntelliTect.com\");             \n  StatusLabel.Text = pingReply.Status.ToString();\n\
  }\n```\n\n这一更改提供了两个优势。首先，ping 调用的异步性质释放了调用线程返回 Windows 消息泵调用者的同步上下文，并处理对 `StatusLabel.Content`\
  \ 的更新，以便“Pinging...”出现在用户面前。其次，当等待 `ping.SendTaskAsync()` 完成时，它将始终在与调用者相同的同步上下执行。此外，由于同步上下文专门适用于\
  \ Windows UI，它是单线程的，因此返回将始终回到同一个线程——UI 线程。换句话说，TPL 并没有立即执行后续任务，而是咨询了同步上下文，后者转而向消息泵发送了一个关于后续工作的消息。接下来，由于\
  \ UI 线程监控消息泵，在拾取后续工作消息后，它会调用 `await` 之后的代码。（结果是后续代码的调用是在处理消息泵的调用者所在的线程上执行的。）\n\n\
  TAP 语言模式中内置了一个关键的代码可读性特性。注意 [Listing 18.22] 中对 `pingReply.Status` 的调用自然出现在 `await`\
  \ 之后，清晰地表明了它将在该行之后立即执行。然而，从头开始编写将更难以理解。\n\n## 操作符\n\n在单个方法中放置 `await` 的次数没有限制。事实上，这些语句可以连续地一个一个放置，遵循自然的流。请考虑\
  \ [18.23] 中的示例。\n\n### 18.23: 迭代 await\n\n[点击此处查看图片]\n\n```csharp\nasync void PingButton_Click(object\
  \ sender, RoutedEventArgs e)\n{\n  List<string> urls = new List<string>() {\n  \
  \  \"www.spokane.org\",\n    \"www.partners.org\",\n    \"www.assist.org\",\n  \
  \  \"www.world.org\"\n  };\n  IPStatus status;\n  Func<string, Task<IPStatus>> func\
  \ = async (localUrl) => {\n    Ping ping = new Ping();\n    PingReply pingReply\
  \ = await ping.SendPingAsync(localUrl);\n    return pingReply.Status;\n  };\n  StatusLabel.Content\
  \ = \"Pinging...\";\n  foreach (string url in urls)\n  {\n    status = await func(url);\n\
  \  }\n  StatusLabel.Text = status.ToString();\n}\n```\n\n\n\n\n\n```csharp\n$@\"\
  { url }: { status.ToString() } ({ Thread.CurrentThread.ManagedThreadId })\";\n```\n\
  \n无论 `await` 语句是在迭代内部还是作为单独条目出现，它们都会串行执行，一个接一个，并严格按照它们从调用线程调用的顺序执行。底层实现是将它们组合成语义等价于\
  \ `Task.ContinueWith()` 的结构，不同的是所有 `await` 操作符之间的代码都将在调用者的同步上下文中执行。\n\nUI 对 TAP（基于的任务并行模式）的支持是导致\
  \ TAP 诞生的关键场景之一。第二个场景发生在服务器端，当客户端请求从数据库查询整张表的数据时。由于查询数据可能非常耗时，应该创建一个新线程，而不是从分配的有限线程池中消耗一个。这种方法的问题是，查询数据库的工作完全在另一台机器上执行。鉴于线程通常不处于活跃状态，没有理由阻塞整个线程。\n\
  \n总结来说，TAP 的创建是为了解决这些关键问题：\n\n- 需要允许长时间运行的活动发生，而不阻塞 UI 线程。\n- 考虑到线程所做的只是等待活动完成，那么为非\
  \ CPU 密集型工作创建新线程（或 `Task`）是相对昂贵的。\n- 当活动完成时（无论是通过新线程还是通过回调），通常需要将线程同步上下文切换回启动活动的原始调用者。\n\
  - TAP 提供了一种新模式，同时适用于 CPU 密集型和非 CPU 密集型的异步调用——这种模式是所有 .NET 语言都显式支持的。\n\n### 在并行中执行循环迭代\n\
  \n考虑以下 `for` 循环语句和相关代码（参见 列表 18.24 以及相应的输出，输出 18.8）。该列表调用了一个方法来计算圆周率小数展开的部分，其中参数是位数和起始数字。实际计算过程与讨论无关。这种计算的有趣之处在于它是**极其易于并行化的（`embarrassingly\
  \ parallelizable`）**；也就是说，将一个大任务（例如，计算 100 万位圆周率小数）拆分成任意数量的可以并行运行的小任务，其简单程度简直得令人难以置信。这类计算是通过添加并行性来加速最容易的类型。\n\
  \n**列表 18.24：使用 For 循环同步分计算圆周率**\n\n点击此处查看代码图像\n\n```csharp\nusing System;\nusing\
  \ AddisonWesley.Michaelis.EssentialCSharp.Shared;\nclass Program\n{\n  const int\
  \ TotalDigits = 100;\n  const int BatchSize = 10;\n\n  static void Main()\n  {\n\
  \      string pi = null;\n      const int iterations = TotalDigits / BatchSize;\n\
  \      for(int i = 0; i < iterations; i++)\n      {\n          pi += PiCalculator.Calculate(\n\
  \              BatchSize, i * BatchSize);\n      }\n      Console.WriteLine(pi);\n\
  \  }\n}\n```\n\n```csharp\nusing System;\nclass PiCalculator\n{\n  public static\
  \ string Calculate(\n      int digits, int startingAt)\n  {\n    // ...\n  }\n \
  \ // ...\n}\n```\n\n**输出 18.8**\n点击此处查看代码图像\n3.\n\
  \n`for` 循环同步且按顺序地执行每次迭代。然而，由于圆周率计算将其拆分成了独立的部分，只要结果按照正确的顺序追加，就没有必要按顺序计算这些部分。设想一下，如果你能让此循环的所有迭代并发运行会发生什么：每个处理器都可以获取单次迭代，并与其他处理器执行的其他迭代并行执行。\n\
  \n\n\n\n当执行的计算可以很容易拆分为许多相互独立的、处理器密集型的计算，且这些计算可以在任何线程上按任何顺序执行时，请使用并行循环。\n\nTPL 还提供了\
  \ `foreach` 语句的类似并行版本，如 列表 18.26 所示。\n\n**列表 18.26：foreach 循环的并行执行**\n\n点击此处查看代码图片\n\
  \n```csharp\nusing System;\nusing System.Collections.Generic;\nusing System.IO;\n\
  using System.Threading.Tasks;\n\nclass Program\n{\n  // ...\n  static void EncryptFiles(\n\
  \      string directoryPath, string searchPattern)\n  {\n    IEnumerable<string>\
  \ files = Directory.EnumerateFiles(\n          directoryPath, searchPattern,\n \
  \         SearchOption.AllDirectories);\n    Parallel.ForEach(files, (fileName)\
  \ =>\n    {\n      Encrypt(fileName);\n    });\n  }\n  // ...\n}\n```\n\n在此示例中，我们调用了一个加密\
  \ `files` 集合中每个文件的方法。它是并行执行的，由 TPL 决定效率最高的线程数量并执行。\n\n### 高级主题：TPL 如何调优自身性能\n\n\
  TPL 内部的默认调度器目标是线程池，这产生了多种启发式策略，尝试确保在任何时刻都有适数量线程在执行。它使用的两种启发式策略是**爬山算法（hill climbing）**和**工作窃取（work\
  \ stealing）**。\n\n爬山算法涉及创建线程来运行任务，然后监控这些任务的性能，以通过实验性方法确定增加更多线程开始导致性能下降的点。一旦达到该点，线程数量就可以减少到产生最佳性能的数量。\n\
  \nTPL 将等待执行的“顶层”任务与任何特定线程关联。然而，如果运行在线程上的任务本身创建了另一个任务，则新创建的任务将自动与该线程关联。当新的“子”任务最终被调度执行时，它通常运行在创建它的任务的同一个线程上。工作窃取算法会识别出待处理工作量异常多或异常稀少的线程；关联任务过少的线程有时会从等待运行的任务过多的线程中“窃取”尚未执行的任务。\n\
  \n这些算法的关键特征是它们允许 TPL 动态调优自身性能，以缓解处理器过度调度和调度不足的问题，并在可用处理器之间平衡工作负载。\n\nTPL 通常能很好地调优自身性能，但您可以通过提供有关最佳行动方案的提示来帮助它做得更好。指定在本节之前章节“长时间运行的任务”中描述的\
  \ TPL `TaskCreationOptions.LongRunning` 选项就是此类提示的示例。您还可以显式地告诉任务调度器您认为多少个线程最适合处理并行循环；更多细节请参阅标题为“并行循环选项”的高级主题。\n\
  \n### 初学者主题：使用 AggregateException 处理并行循环异常\n\n我们已经知道 TPL 会在 `AggregateException`\
  \ 中捕获并保存与任务相关的异常，因为给定的任务可能会从其子任务中获取多个异常。并行执行循环的情况也是如此：每次迭代都可能产生异常，因此需要将这些异常汇总到一个聚合异常中。考虑\
  \ 列表 18.27 中的示例及其在 输出 18.9 中的输出。\n\n**列表 18.27：并行迭代的未处理异常处理**\n\n点击此处查看代码图片\n\n\
  ```csharp\nusing System;\nusing System.Collections.Generic;\nusing System.IO;\n\
  using System.Threading;\nusing System.Threading.Tasks;\n\nclass Program\n{\n  //\
  \ ...\n  static void EncryptFiles(\n      string directoryPath, string searchPattern)\n\
  \  {\n    IEnumerable<string> files = Directory.EnumerateFiles(\n      directoryPath,\
  \ searchPattern,\n      SearchOption.AllDirectories);\n    try\n    {\n      Parallel.ForEach(files,\
  \ (fileName) =>\n      {\n        Encrypt(fileName);\n      });\n    }\n    catch(AggregateException\
  \ exception)\n    {\n      Console.WriteLine(\"ERROR: {0}\", exception.GetType().Name);\n\
  \      foreach(Exception item in exception.InnerExceptions)\n      {\n        Console.WriteLine(\"\
  {0} - {1}\", item.GetType().Name, item.Message);\n      }\n    }\n  }\n  // ...\n\
  }\n```\n\n**输出 18.9**\n\n点击此处查看代码图片\nERROR: AggregateException:\nUnauthorizedAccessException\
  \ - Attempted to perform an unauthorized operation.\nUnauthorizedAccessException\
  \ - Attempted to perform an unauthorized operation.\nUnauthorizedAccessException\
  \ - Attempted to perform an unauthorized operation.\n\n输出 18.9 显示，在执行 `Parallel.ForEach<T>(...)`\
  \ 循环时发生了三个异常。然而，在代码中只有一个类型为 `System.AggregateException` 的 catch 块。`UnauthorizedAccessException`\
  \ 是从 `AggregateException` 的 `InnerExceptions` 属性获取的。对于 `Parallel.ForEach<T>()` 循环，每次迭代都可能抛出异常，因此方法抛出的\
  \ `System.AggregateException` 将其每个异常都包含在其 `InnerExceptions` 属性中。\n\n#### 取消并行循环\n\
  \n与在阻塞完成前需要显式调用的任务不同，并行循环并行执行迭代，但本身不会在整个并行循环完成后才返回。因此，取消并行循环通常涉及从执行并行循环的线程以外调用取消请求。在\
  \ 列表 18.28 中，我们使用 `Task.Run()` 调用 `Parallel.ForEach<T>()`。通过这种方式，查询不仅并行执行，而且异步执行，允许代码提示用户“按回车键退出”。\n\
  \n**列表 18.28：取消并行循环**\n\n点击此处查看代码图片\n\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
  using System.IO;\nusing System.Threading;\nusing System.Threading.Tasks;\n\npublic\
  \ class Program\n{\n  // ...\n  static void EncryptFiles(\n    string directoryPath,\
  \ string searchPattern)\n  {\n    string stars = \"*\".PadRight(Console.WindowWidth-1,\
  \ '*');\n    IEnumerable<string> files = Directory.GetFiles(\n      directoryPath,\
  \ searchPattern,\n      SearchOption.AllDirectories);\n    CancellationTokenSource\
  \ cts = new CancellationTokenSource();\n    ParallelOptions parallelOptions = new\
  \ ParallelOptions\n    { CancellationToken = cts.Token };\n    cts.Token.Register(()\
  \ => Console.WriteLine(\"Cancelling...\"));\n    Console.WriteLine(\"Push ENTER\
  \ to exit.\");\n    // 对于 .NET 4.5 之前的 TPL\n    // 使用 Task.Factory.StartNew<string>()\n\
  \    Task task = Task.Run(() =>\n    {\n      try\n```\n\n\n\n\n```csharp\nParallel.ForEach(\n\
  \    files, parallelOptions,\n    (fileName, loopState) =>\n    {\n        Encrypt(fileName);\n\
  \    });\n}\ncatch(OperationCanceledException){}\n});\n// 等待用户输入\nConsole.Read();\n\
  \n// 取消查询\ncts.Cancel();\n\nConsole.Write(stars);\ntask.Wait();\n\n}\n}\n```\n\n\
  * * *\n\n并行循环使用了与任务（tasks）相同的取消令牌模式。从 `CancellationTokenSource` 获取的令牌通过调用具有 `ParallelOptions`\
  \ 类型参数的 `ForEach()` 方法重载，来与并行循环关联。该对象包含了取消令牌。\n\n请注意，如果你取消了并行循环操作，程序将通过检查 `IsCancellationRequested`\
  \ 属性来防止任何尚未开始的迭代启动。正在执行的迭代将运行到各自的终止点。此外，即使在所有迭代完成后调用 `Cancel()`，仍然会触发注册的取消事件（通过\
  \ `cts.Token.Register()` 挂载）。\n\n`ForEach()` 方法能够确认循环已取消的唯一手段是通过抛出 `OperationCanceledException`。鉴于此示例中的取消是预料之中的，该异常被捕获并忽略，允许应用程序显示“Canceling...”，随后在退出前打印一行星号。\n\
  \n* * *\n\n### 高级主题：并行循环选项\n\n虽然通常没有必要，但通过 `Parallel.For()` 和 `Parallel.ForEach<T>()`\
  \ 循环重载中的 `ParallelOptions` 参数，可以控制最大并行度（即同时调度运行的线程数）。在某些特定情况下，开发者可能对特定算法或情况有更多了解，使得更改最大并行度是有意义的。这些情况包括：\n\
  \n*   你希望禁用并行化以使调试或分析更更容易的场景。将最大并行度设置为 1 可以确保循环迭代不会并发运行。\n*   你预先知道并行度将受到外部因素（如硬件限制）的限制的场景。例如，如果你的并行操作涉及使用多个\
  \ USB 端口，那么创建比可用端口数量更多的线程可能是没有意义的。\n*   运行时间非常长的循环迭代场景（例如，几分钟或几小时）。线程池无法区分长时间的迭代和阻塞操作，因此可能会引入许多新线程，而这些线程都会被\
  \ `for` 循环消耗。这可能导致线程随时间推移而递增，最终导致进程中产生大量的线程。\n\n以此类推。要控制最大并行度，请使用 `ParallelOptions`\
  \ 对象上的 `MaxDegreeOfParallelism` 属性。\n\n你还可以使用 `ParallelOptions` 对象的 `TaskScheduler`\
  \ 属性来指定自定义的任务调度器，用于调度与每次迭代相关的任务。例如，你可能有一个异步事件处理程序来响应用户点击“下一步”按钮。如果用户多次点击该按钮，你可能希望使用自定义任务调度器来优先考虑最近创建的任务，而不是优先考虑等待最长的任务。任务调度器提供了指定任务如何调度的方法。\n\
  \n### 高级主题：中断循环\n\n与标准的 `for` 循环一样，`Parallel.For()` 支持“中断”（breaking）的概念。在 `Parallel.For()`\
  \ 的上下文中，你可以使用传递给委托的 `ParallelLoopState` 对象来指示停止后续迭代。\n\n与标准的 `for` 循环一样，`Parallel.ForEach()`\
  \ 支持“中断”（breaking）的概念。在 `Parallel.ForEach()` 的语文中，你可以使用传递给委托的 `ParallelLoopState`\
  \ 对象来指示停止后续迭代。\n\n`ParallelOptions` 对象具有 `CancellationToken` 属性，允许你从外部取消循环。`Parallel.For()`\
  \ 和 `Parallel.ForEach()` 返回的 `ParallelLoopResult` 包含有用信息：\n\n*   `IsCompleted`:\
  \ 一个布尔值，指示所有迭代是否已成功完成。\n*   `LowestIteration`: 一个 `long?` 类型，标识执行了 break 的最低迭代索引，如果没有发生\
  \ break，则为 `null`。\n\n\n\n\n\n如列表 18.30 所示，启用并行支持的更改非常小！它所使用的只是 .NET Framework 4.0\
  \ 引入的标准查询运算符 `AsParallel()`，该运算符可以在静态类 `System.Linq.ParallelEnumerable` 中找到。这个简单的扩展方法告诉运行时它可以并行执行该查询。结果是，在具有多个可用\
  \ CPU 的机器上，执行查询的总时间可以显著缩短。\n\n`System.Linq.ParallelEnumerable` 包含了 `System.Linq.Enumerable`\
  \ 中可用查询运算符的超集，所有常用的查询运算符都可能获得性能提升，包括排序、过滤 (`Where()`）、投影 (`Select()`）、连接、分组和聚合。列表\
  \ 18.31 显示了如何进行并行排序。\n\n### 列表 18.31：使用查询运算符的并行 LINQ\n\n点击此处查看代码图像\n\n```csharp\n\
  // ...\n    OrderedParallelQuery<string> parallelGroups =\n        data.AsParallel().OrderBy(item\
  \ => item);\n    // 显示的项目总数\n    // 匹配原始计数\n    System.Diagnostics.Trace.Assert(\n\
  \        data.Count == parallelGroups.Sum(\n            item => item.Count()));\n\
  // ...\n```\n\n如列表 18.31 所示，调用并行版本只需调用 `AsParallel()` 扩展方法。注意并行查询运算符返回的类型为 `ParallelQuery<T>`\
  \ 或 `OrderedParallelQuery<T>`；它们都通知编译器继续使用标准查询的并行版本。\n\n由于查询表达式只是列表 18.30 和 18.31\
  \ 中方法调用的形式糖，你可以同样轻松地在表达式形式中使用 `AsParallel()`。列表 18.32 显示了使用查询表达式并行执行分组操作的示例。\n\n\
  ### 列表 18.32：使用查询表达式的并行 LINQ\n\n点击此处查看代码图像\n\n```csharp\n// ...\n    ParallelQuery<IGrouping<char,\
  \ string>> parallelGroups;\n    parallelGroups =\n        from text in data.AsParallel()\n\
  \        orderby text\n        group text by text[0];\n    // 显示的项目总数\n    // 匹配原始计数\n\
  \    System.Diagnostics.Trace.Assert(\n        data.Count == parallelGroups.Sum(\n\
  \            item => item.Count()));\n// ...\n```\n\n正如你在之前的示例所示，将查询或循环转换为并行执行是非常简单的。但有一个注意事项：正如我们在第\
  \ 19 章中深入讨论，，防止多个线程同时访问并修改相同的内存。这样做会导致竞争条件。\n\n正如在本章早期所示，`Parallel.For()` 和 `Parallel.ForEach<T>()`\
  \ 方法会收集并行期间发生的所有异常，然后抛出一个包含所有原始异常的聚合异常。PLINQ 操作也不一样。也就是说，它们同样可能返回多个异常：当并行在每个元素上运行查询逻辑时，每个元素上执行的代码可以独立地抛出异常。出乎意料的是，PLINQ\
  \ 处理这种情况的方式与并行循环和 TPL 完全相同：并行查询期间抛出的异常可以通过 `AggregateException` 的 `InnerExceptions`\
  \ 属性访问。因此，使用异常类型 `System.AggregateException` 的 try/catch 块封装 PLINQ 查询将成功处理每次迭代中未处理的异常。\n\
  \n#### 取消 PLINQ 查询\n\n正如预期的，PLINQ 查询也支持取消模式。列表 18.33（带有输出 18.10 中使用的相同解决方案。\n\n\
  ### 列表 18.33：取消 PLINQ 查询\n\n点击此处查看代码图像\n\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
  using System.Linq;\nusing System.Threading;\nusing System.Threading.Tasks;\npublic\
  \ class Program\n{\n    public static List<string> ParallelEncrypt(List<string>\
  \ data, CancellationToken cancellation)\n    {\n        return data.AsParallel().WithCancellation(cancellationToken).Select(item\
  \ => Encrypt(item)).ToList();\n    }\n    public static void Main()\n    {\n   \
  \     ConsoleColor originalColor = Console.ForegroundColor;\n        List<string>\
  \ data = Utility.GetData(1000).ToList();\n        CancellationTokenSource cts =\
  \ new CancellationTokenSource();\n        Console.WriteLine(\"按键退出.\");\n      \
  \  // 在 .NET 4.5 之前使用 Task.Factory.StartNew<string>()\n        Task task = Task.Run(()\
  \ =>\n        {\n            data = ParallelEncrypt(data, cts.Token);\n        },\
  \ cts.Token);\n        // 等待用户输入\n        Console.Read();\n        if (!task.Completed)\n\
  \        {\n            cts.Cancel();\n            try { task.Wait(); }\n      \
  \      catch (AggregateException exception)\n            {\n                Console.ForegroundColor\
  \ = Console.Red;\n                TaskCanceledException taskCanceledException =\n\
  \                    (TaskCanceledException)exception.Flatten()\n              \
  \      .InnerExceptions\n                    .FirstOrDefault(\n                \
  \        innerException =>\n                            innerException.GetType()\
  \ ==\n                            typeof(TaskCanceledException));\n            \
  \    if(taskCanceledException != null){\n                    Console.WriteLine($@\"\
  取消: {\n                    taskCanceledException.Message }\");\n               \
  \ }\n                else\n                {\n                    // ...\n     \
  \           }\n            }\n        }\n        else\n        {\n            task.Wait();\n\
  \            Console.ForegroundColor = Console.Green;\n            Console.Write(\"\
  执行成功\");\n        }\n        Console.ForegroundColor = originalColor;\n    }\n}\n\
  ```\n\n\n\n\n\n如前所述，取消 PLINQ 查询将抛出异常而不是返回完整结果。处理可能取消的 PLINQ 查询的一种常用技术是将查询封装在 `try`\
  \ 块中，并捕获 `OperationCanceledException`。另一种常用技术（如 列表 18.33 所示）是将 `CancellationToken`\
  \ 同时传递给 `ParallelEncrypt()` 和作为 `Run()` 的第二个参数。这将导致 `task.Wait()` 抛出一个 `AggregateException`，其\
  \ `InnerException` 属性将设置为 `TaskCanceledException`。随后可以像捕获任何其他并行操作抛出的异常一样，捕获该聚合异常。\n\
  \n### 总结\n\n在本章中，我们首先检查了多线程程序的基本部分：`Thread` 类（它代表程序中独立的“控制点”）以及 `ThreadPool`（它鼓励鼓励在多个\
  \ CPU 上对线程进行高效的分配和调度）。然而，这些 API 是低级实体，难以直接操作。从 4.0 版本开始，.NET Framework 提供了并行扩展库（Parallel\
  \ Extensions），其中包含了任务并行库（TPL）和并行 LINQ（PLINQ）。这两者都提供了新的 API，用于创建和调度由 `Task` 对象表示的工作单元、使用\
  \ `Parallel.For()` 和 `Parallel.ForEach()` 并行执行循环，以及通过 `AsParallel()` 将 LINQ 查询并行化。\n\
  \n我们还讨论了 C# 5.0 如何通过 `Task` 对象让复杂工作流的编程变得简单得多，因为它会自动重写你的程序来管理延续“接线”，这些接线将小任务组合成大任务。\n\
  \n在本章的开头，我们简要概述了开发者在编写多线程程序时经常面临的一些困难问题：原子性问题、死锁以及其他为多线程程序引入不确定性和不良行为的“竞态条件”。避免这些问题的标准方法是仔细编写代码，使用“锁”（locks）来同步对共享资源的访问；这是下一章的主题。\n\
  \n`结束 4.0`\n\n## 19. 线程同步\n\n在第 18 章中，我们讨论了使用任务并行库（TPL）和并行 LINQ（PLINQ）进行多线程编程的细节。然而，我们特意避开了一个主题：线程同步，它在避免死锁的同时防止竞态条件。线程同步是本章的主题。\n\
  \n![Image](img/0815fig01.jpg)\n\n我们从一个没有对共享数据进行线程同步的多线程示例开始——这导致了竞态条件，从而丢失了数据完整性。该讨论作为我们需要线程同步的引言。随后将是对实现该操作的各种机制和最佳实践的介绍。\n\
  \n本书的早期版本包含一个关于附加多线程模式的重要章节，以及另一个关于各种计时器回调机制的章节。然而，随着 async/await 模式的引入，除非你正在使用\
  \ C# 5.0/.NET 4.5 之前的框架进行编程，否则这些方法基本上已经被它们取代了。不过，C# 5.0 之前的材料仍可以从本书的网站获取——[`www.IntelliTect.com/EssentialCSharp`](http://www.IntelliTect.com/EssentialCSharp)。\n\
  \n本章整个章节使用了 TPL，因此示例无法在 .NET Framework 4 之前的框架上编译。但是，除非明确标识为 .NET Framework 4 API，否则\
  \ .NET Framework 4 限制的唯一由于是使用了 `System.Threading.Tasks.Task` 类来执行异步操作。修改代码实例化 `System.Threading.Thread`\
  \ 并使用 `Thread.Join()` 等待线程执行，将允许绝大多数示例在较早的框架上编译。\n\n尽管如此，本章中用于启动任务的特定 API 是 .NET\
  \ 4.5 特有的 `System.Threading.Tasks.Task.Run()`。正如我们在第 18 章中讨论的，该方法优于 `System.Threading.Tasks.Task.Factory.StartNew()`，因为它更简单且足以应对大多数场景。受限于\
  \ .NET 4 的读者可以将 `Task.Run()` 替换为 `Task.Factory.StartNew()` 而无需进行任何额外修改。（由于此原因，当仅使用此种方法时，本章并不会特意显式地将此类代码标记为\
  \ .NET 4.5 特有代码。）\n\n此外，微软发布了 .NET 响应式扩展（Rx），这是一个独立的下载包，它在 .NET 3.5 框架中增加了对 TPL\
  \ 和 PLINQ 的支持。^(1) 该框架还包含了本章引入的并发和同步类型。出于如此，依赖于 `Task` 或引入 C# 4.0 同步类的代码列表，实际上可以通过\
  \ Rx 回溯到 .NET 3.5 框架的功能以及对 `System.Threading.dll` 程序集的引用在 .NET 3.5 中。响应式扩展还包括利用委托使用\
  \ LINQ 的功能。完整库现在可以通过开源地址 [`github.com/Reactive-Extensions/Rx.NET`](https://github.com/Reactive-Extensions/Rx.NET)\
  \ 获取。\n\n1。查看 [`bit.ly/Rx3point5`](http://bit.ly/Rx3point5)\n\n总结来说，本章中的大多数示例只需要微调即可在\
  \ .NET 4.5 之前的版本中运行，方法是使用 `Task.Factory.StartNew()` 或依赖 `Thread`。\n\n### 为什么要同步？\n\
  \n启动新线程是一个相对简单的编程任务。然而，多线程编程的困难之处在于识别哪些数据可以被同时访问。程序必须同步此类数据以防止同时访问。考虑列表 19.1。\n\n\
  **列表 19.1: 未同步状态**\n\n点击此处查看代码\n\n* * *\n\n```\nusing System;\n\nusing System.Threading.Tasks;\n\
  \npublic class Program\n{\n    const int _Total = int.MaxValue;\n    static long\
  \ _Count = 0;\n\n    public static void Main()\n    {\n        // .NET 4 使用 Task.Factory.StartNew\
  \ \n        Task task = Task.Run(()=>Decrement());\n        // 增\n        for (int\
  \ i = 0; i < _Total; i++)\n        {\n            _Count++;\n        }\n       \
  \ task.Wait();\n        Console.WriteLine(\"Count = {0}\", _Count);\n    }\n\n \
  \   static void Decrement()\n    {\n        // 减\n        for (int i = 0; i < _Total;\
  \ i++)\n        {\n            _Count--;\n        }\n    }\n}\n```\n\n* * *\n\n\
  列表 19.1 的一种可能结果出现在输出 19.1。\n\n**输出 19.1**\n\nCount = 113449949\n\n列表 19.1 中重要的点是输出不是\
  \ `0`。如果是直接（顺序）调用 `Decrement()`，输出将是如此。然而，当异步调用 `Decrement()` 时，会发生竞态条件，因为 `_Count++`\
  \ 和 `_Count--` 的内部步骤交织在一起。（正如我们在第 18 章中名为“多线程术语”的入门主题中讨论过的，C# 中的单条语句可能涉及多个步骤。）考虑表\
  \ 19.1 中的示例执行。\n\n![Image](img/19tab01.jpg)\n\n**表 19.1: 示例伪代码执行**\n\n\n\n\n\n表\
  \ 19.1 显示了指令从一列转移到另一列时呈现的并行执行（或线程上下文切换）。某特定行执行完成后，`_Count` 的值出现在最后一列。在本次示例执行中，`_Count++`\
  \ 执行了两次，`_Count--` 发生了一次。然而，结果的 `_Count` 值为 `0` 而不是 `1`。将结果写回 `_Count` 本质上会抹除自同一线程读取\
  \ `_Count` 之后发生的所有 `_Count` 值变化。\n\n代码列表 19.1 中的问题是竞态条件，即多个线程同时访问相同的数据元素。正如此示例执行所示，允许多个线程访问相同的数据元素可能会破坏数据完整性，即使在单处理器计算机上也是如此。为了解决这一潜在问题，需要对数据进行同步处理。为了供多个线程同时访问而进行同步的代码或数据是`线程安全`的。\n\
  \n关于变量读取和写入的原子性，有一个重要点需要注意。运行时保证大小小于或等于原生（指针大小）整数的类型不会被部分读取或写入。因此，在 64 位操作系统上，对\
  \ `long`（64 位）的读和写是原子的。然而，对 `decimal` 等 128 位变量的读和写可能不是原子的。因此，更改 `decimal` 变量的写操作可能会在仅复制\
  \ 32 位后被中断，导致读取到错误的值，这被称为`撕裂读取`（torn read）。\n\n* *\n\n## 初学者主题：多线程与局部变量\n\n注意，没有必要同步局部变量。局部变量被加载到栈中，每个线程都有自己的逻辑堆栈。因此，每个局部变量在每个方法调用时都有自己的实例。默认情况下，局部变量不会在方法调用之间共享；同样，它们也不会在多个线程之间共享。\n\
  \n然而，这并不意味着局部变量完全没有并发问题——毕竟，代码很容易将局部变量暴露给多个线程^(2)。例如，在迭代之间共享局部变量的并行 `for` 循环会将变量暴露在并发访问和竞态条件之下（参见\
  \ 代码列表 19.2）。\n\n2。虽然在 C# 级别它是局部的，但在 IL 级别它是字段——而字段可以从多个线程访问。\n\n### 代码列表 19.2：未同步的局部变量\n\
  \n点击此处查看代码图片\n\n* *\n\n```csharp\nusing System;\n\nusing System.Threading.Tasks;\n\
  \npublic class Program\n{\n  public static void Main()\n  {\n      int x = 0;\n\
  \      Parallel.For(0, int.MaxValue, i =>\n          {\n              x++;\n   \
  \           x--;\n          });\n      Console.WriteLine(\"Count = {0}\", x);\n\
  \  }\n}\n```\n\n* *\n\n在这个示例中，`x`（一个局部变量）在并行 `for` 循环内部被访问，因此多个线程将同时修改它，创建一个与 代码列表\
  \ 19.1 非常相似的竞态条件。尽管 `x` 增加和减少的次数相同，但输出结果不太可能产生值 `0`。\n\n* *\n\n## 开始 5.0\n\n* *\n\
  \n## 初学者主题：无 await 的 Task 返回\n\n在 代码列表 19.1 中，尽管 `Task.Run(()=>Decrement())` 返回一个\
  \ `Task`，但并没有使用 `await` 运算符。其原因是 `await` 仅允许在带有 `async` 标记的方法中使用，而 `Main()` 不支持使用\
  \ `async`。在 `Main()` 之外重构代码可以使其轻松利用 `await`/`async` 模式，如 代码列表 19.3 所示。\n\n### 代码列表\
  \ 19.3：未同步的局部变量\n\n点击此处查看代码图片\n\n* *\n\n```csharp\nusing System;\n\nusing System.Threading.Tasks;\n\
  \npublic class Program\n{\n    const int _Total = int.MaxValue;\n    static long\
  \ _Count = 0;\n\n  public static async void CountAsync()\n  {\n      // Use Task.Factory.StartNew\
  \ for .NET 4.0\n      Task task = Task.Run(()=>Decrement());\n      // Increment\n\
  \      for(int i = 0; i < _Total; i++)\n      {\n          _Count++;\n      }\n\
  \      await task;\n      Console.WriteLine($\"Count = {_Count}\");\n  }\n}\n```\n\
  \n* *\n\n* *\n\n## 结束 5.0\n\n### 同步\n\n为了同步多个线程使其无法同时执行特定的代码段，可以使用 `monitor` 在第一个线程退出该区域之前阻止第二个线程进入受保护区域。monitor\
  \ 功能是 `System.Threading.Monitor` 类的一部分，受保护区域的开始和结束通过调用 `Monitor.Enter()` 和 `Monitor.Exit()`\
  \ 来标记。代码列表 19.4 展示了显式使用 `Monitor` 类。如列表所示，将 `Monitor.Enter()` 和 `Monitor.Exit()`\
  \ 调用之间的所有代码放在 `try/finally` 块中是非常重要的。如果没有此块，受保护区域可能会发生异常并导致 `Monitor.Exit()` 永远不会执行，从而无限阻塞其他线程。\n\
  \n#### 4.0 代码列表 19.4：使用 Monitor 同步\n\n点击此处查看图片\n\n* *\n\n```csharp\nusing System;\n\
  \nusing System.Threading;\nusing System.Threading.Tasks;\n\npublic class Program\n\
  {\n    readonly static object _Sync = new object();\n    const int _Total = int.MaxValue;\n\
  \    static long _Count = 0;\n\n    public static void Main()\n    {\n      // Use\
  \ Task.Factory.StartNew for .NET 4.0\n      Task task = Task.Run(()=>Decrement());\n\
  \      // Increment\n      for(int i = 0; i < _Total; i++)\n      {\n          bool\
  \ lockTaken = false;\n          try\n          {\n              Monitor.Enter(_Sync,\
  \ ref lockTaken);\n              _Count++;\n          }\n          finally\n   \
  \       {\n              if (lockTaken)\n              {\n                  Monitor.Exit(_Sync);\n\
  \              }\n          }\n      }\n      task.Wait();\n      Console.WriteLine($\"\
  Count = {_Count}\");\n    }\n\n    static void Decrement()\n    {\n      for(int\
  \ i = 0; i < _Total; i++)\n      {\n          bool lockTaken = false;\n        \
  \  try\n          {\n              Monitor.Enter(_Sync, ref lockTaken);\n      \
  \        _Count--;\n          }\n          finally\n          {\n              if(lockTaken)\n\
  \              {\n                  Monitor.Exit(_Sync);\n              }\n    \
  \      }\n      }\n    }\n}\n```\n\n\n\n\nListing 19.4 的结果显示在 输出 19.2 中。\n\n**输出\
  \ 19.2**\n\nCount = 0\n\n注意对 `Monitor.Enter()` 和 `Monitor.Exit()` 的调用通过共享作为参数传递的实例引用（在本例中为\
  \ `_Sync`）相关联。带有 `lockTaken` 参数的 `Monitor.Enter()` 重载方法直到 .NET 4.0 才被添加到框架中。在此之前，没有这种\
  \ `lockTaken` 参数，因此无法可靠地捕获发生在 `Monitor.Enter()` 和 `try` 块之间的异常。在发布版代码中，将 `try` 块紧跟在\
  \ `Monitor.Enter()` 调用之后是可靠的，因为 JIT 防止了任何此类异步异常的溜入。然而，除了紧跟在 `Monitor.Enter()` 之后的是\
  \ `try` 块之外，任何可能存在于其间的代码（包括编译器在调试代码中可能注入的任何指令）都可能阻止 JIT 可靠地返回到 `try` 块执行。因此，如果确实发生了异常，会导致锁泄漏（锁保持已获取状态），而不是执行\
  \ `finally` 块并释放锁——这可能在另一个线程尝试获取锁时导致死锁。总之，在 .NET 4.0 之前的框架版本中，您应该始终在 `Monitor.Enter()`\
  \ 之后跟上 `try/finally {Monitor.Exit(_Sync)}` 块。\n\n`Monitor` 还支持 `Pulse()` 方法，允许线程进入“就绪队列”，表示它是下一个执行的线程。这是同步生产者-消费者模式的常用手段，以确保在没有“生产”之前不会发生任何“消费”。拥有监视器的生产者线程（通过调用\
  \ `Monitor.Enter()`）调用 `Monitor.Pulse()`向消费者线程（该线程可能已经调用了 `Monitor.Enter()`）发出信号，指示项目可以消费，它应该“准备就绪”。对于单个\
  \ `Pulse()` 调用，只有一个线程（在此例中为消费者线程）可以进入就绪队列。当生产者线程调用 `Monitor.Exit()` 时，消费者线程获取锁（`Monitor.Enter()`\
  \ 完成）并进入临界区域开始“消费”项目。一旦消费者处理了等待中的项目，它就会调用 `Exit()`，从而允许生产者（当前阻塞在 `Monitor.Enter()`\
  \ 处）再次生产。在示例中，一次时间只有一个线程可以进入就绪队列，确保了没有“生产”就不会有“消费”，反之亦然。\n\n### 使用 lock 关键字\n\n\
  由于在多线程代码中频繁需要使用 `Monitor` 进行同步，而且由于 `try/finally` 块很容易被忘记，C# 提供了一个特殊的关键字来处理这种锁定同步模式。代码列表\
  \ 19.5\n\n```csharp\nusing System;\nusing System.Threading;\nusing System.Threading.Tasks;\n\
  \npublic class Program\n{\n    readonly static object _Sync = new object();\n\n\
  \    const int _Total = int.MaxValue;\n    static long _Count = 0;\n\n    public\
  \ static void Main()\n    {\n        // 使用 Task.Factory.StartNew 用于 .NET 4.0\n \
  \       Task task = Task.Run(()=>Decrement());\n\n        // 递增\n        for(int\
  \ i = 0; i < _Total; i++)\n        {\n            lock(_Sync)\n            {\n \
  \               _Count++;\n            }\n        }\n\n        task.Wait();\n  \
  \      Console.WriteLine($\"Count = {_Count}\");\n    }\n\n    static void Decrement()\n\
  \    {\n        for(int i = 0; i < _Total; i++)\n        {\n            lock(_Sync)\n\
  \            {\n                _Count--;\n            }\n        }\n    }\n}\n\
  ```\n\n**输出 19.3**\n\nCount = 0\n\n通过锁定访问 `_Count` 的代码段（使用 `lock` 或 `Monitor`），你使得\
  \ `Main()` 和 `Decrement()` 方法线程安全的，这意味着它们可以安全地从多个线程同时调用。（在 C# 4.0 之前，概念相同，但编译器生成的代码依赖于不带\
  \ `lockTaken` 的 `Monitor.Enter()` 方法，且调用的 `Monitor.Enter()` 生成在 `try` 块之前。）\n\n\
  同步的代价是性能降低。例如，列表 19.5](#ch19.html_ch19lis05)的执行时间比列表 19.1 长一个数量级，这证明了与增加和减少计数的执行相比，`lock`\
  \ 的执行相对缓慢。\n\n即使 `lock` 与其同步的工作相比显得微不足道，程序员也应该避免无目的同步，以避免死锁的可能性，并避免在本可以并行执行代码的多处理器计算机上进行不必要的同步。对象设计的通用最佳实践是同步*可变静态*状态，而不是任何实例数据。（没有必要同步从不改变的内容。）允许多个线程访问特定对象的程序员必须在某种程度上提供同步。\n\
  \n### 选择 lock 对象\n\n无论是使用 `lock` 关键字还是显式使用 `Monitor` 类，让程序员仔细选择 `lock` 对象都是至关重要的。\n\
  \n在之前的示例中，同步变量 `_Sync` 被声明为私有且只读。将其声明为只读是为了确保在调用 `Monitor.Enter()` 和 `Monitor.Exit()`\
  \ 之间值不会改变。这允许进入和退出同步块之间的关联。\n\n同样，代码将 `_Sync` 声明为私有，以便类外的同步块无法同步同一个实例。\n\n如果数据是公共的，同步对象可以是公共的，以便其他类可以使用同一个实例进行同步。然而，这增加了避免死锁的难度。幸运的是，这种模式的需求很少。对于公共数据，更好的做法是将同步完全留存在类之外，允许调用代码使用自己的同步对象来锁。\n\
  \n同步对象不能是值类型。如果在值类型上使用 `lock` 关键字，编译器将报告错误。（在显式访问 `System.Threading.Monitor` 类[而不是通过\
  \ `lock`]的情况下，编译时不会出现此类错误。相反，代码会在调用 `Monitor.Exit()` 时抛出异常，指示没有对应的 `Monitor.Enter()`\
  \ 调用。）问题在于，使用值类型时，运行时会创建值的副本，将其放在堆中（发生装箱），并将装箱后的值传递给 `Monitor.Enter()`。同样，`Monitor.Exit()`\
  \ 接收原始变量的装箱副本。结果是 `Monitor.Enter()` 和 `Monitor.Exit()` 接收到了不同的同步对象实例，因此这两个调用之间没有关联。\n\
  \n\n\n\n一种常见的模式是针对类中的实例数据锁定 `this` 关键字，并针对通过 `typeof(type)` 获取的类型实例（例如 `typeof(MyType)`）对静态数据进行锁定。这种模式在使用\
  \ `this` 时为与特定对象实例相关的所有状态提供同步目标，在使用 `typeof(type)` 时为该类型的所有静态数据提供同步目标。问题在于，`this`（或\
  \ `typeof(type)`）指向的同步目标可能会参与另一个不相关的代码块创建的完全不同的同步块的同步目标。换句话说，虽然只有实例内部的代码可以使用 `this`\
  \ 关键字进行阻塞，但创建该实例的调用者可以将该实例传递给同步锁。\n\n结果是，两个同步完全不同数据集的两个不同同步块可能会互相阻塞。尽管这种情况可能并不，但共享相同的同步目标可能会产生意外之外的性能影响，在极端情况下甚至可能导致死锁。与其在\
  \ `this` 甚至 `typeof(type)` 上锁定，不如定义一个私有的、只读字段，除了访问该字段的类之外，没有人会对其进行锁定。\n\n另一种需要避免的锁类型是\
  \ `string`，这是由于字符串池（string interning）导致的。如果同一个 `string` 常量出现在多个位置，那么所有位置都可能引用同一个实例，从而导致锁的范围远超预期。\n\
  \n总结来说，你应该使用类型为 `object` 的每个同步上下文实例作为锁的目标对象。\n\n***\n\n### 指南\n\n- **避免**在 `this`、`typeof()`\
  \ 或 `string` 上锁定。\n- **应当**为同步目标声明一个独立的、类型为 `object` 的只读同步变量。\n\n***\n\n***\n\n\
  ### 进阶主题：避免使用 MethodImplAttribute 进行同步\n\n.NET 1.0 引入的同步机制之一是 `MethodImplAttribute`。该属性通常并结合\
  \ `MethodImplOptions.Synchronized` 方法使用，将方法标记为同步，以便在同一时间只有一个线程可以执行该方法。为了实现这一点，即时编译器（JIT）本质上将该方法处理为类似于被\
  \ `lock(this)` 包围的形式，或者对于静态方法，则在类型上锁定。这种实现意味着，实际上，该方法以及同一类中所有装饰有相同属性和枚举参数的其他方法都是同步的——而不是每个方法相对于自身进行同步。换句话说，如果同一个类中有两个或多个装饰了该属性的方法，那么同一时间只有一个方法可以执行，而正在执行的方法将阻塞其他线程对自身或对类中任何其他具有相同装饰的方法的调用。此外，由于同步是针对\
  \ `this`（甚至更糟，是针对类型）的，它遭受了前一节讨论过的 `lock(this)`（对于静态方法则更糟）的相同缺陷。因此，完全避免使用该属性是一种最佳实践。\n\
  \n***\n\n### 指南\n\n- **避免**使用 `MethodImplAttribute` 进行同步。\n\n***\n\n***\n\n### 将字段声明为\
  \ volatile\n\n在偶尔，编译器或 CPU 可能会以这种方式优化代码，导致指令的执行顺序与编写顺序不完全一致，或者某些指令被优化掉。当代码在单线程上执行时，这些优化是无害的。然而，在多线程环境下，此类优化可能会产生意外的后果，因为优化可能会更改字段的读/写操作相对于另一个线程访问同一字段的执行顺序。\n\
  \n稳定这种行为的一种方法是使用 `volatile` 关键字声明字段。该关键字强制对 `volatile` 字段的所有读取和写入操作必须在代码确定的确切位置发生，而不是在优化产生的其他位置发生。`volatile`\
  \ 修饰符标识该字段容易受到硬件、操作系统或另一个线程的修改。因此，数据是“易变的（volatile）”，该关键字指示编译器和运行时更精确地处理它。（详情请参阅\
  \ [`bit.ly/CSharpReorderingOptimizations`](http://bit.ly/CSharpReorderingOptimizations)。）\n\
  \n通常情况下，使用 `volatile` 修饰符非常罕见，且充满了复杂性，很可能导致错误的用法。除非你绝对确定 `volatile` 的用法，否则使用 `lock`\
  \ 优于使用 `volatile` 修饰符。\n\n### 使用 System.Threading.Interlocked 类\n\n到目前描述的互斥模式为处理进程内（应用程序域）同步提供了最少工具集。然而，使用\
  \ `System.Threading.Monitor` 进行同步是一项昂贵的操作，而处理器直接支持的替代方案针对特定的同步模式。\n\n`Listing 19.6`\
  \ 只要前一个值为 `null`，就会将 `_Data` 设置为新值。正如方法名所示，这种模式是比较/交换（compare/exchange）模式。与其手动在行为等效的比较和交换代码周围加锁，不如使用\
  \ `Interlocked.CompareExchange()` 方法提供了一个同步操作的内置方法，它对值（`null`）执行相同的检查，如果该值等于第二个参数，则更新第一个参数。`Table\
  \ 19.2` 显示了 `Interlocked` 支持的其他同步方法。\n\n**列表 19.6：使用 System.Threading.Interlocked\
  \ 进行同步**\n\n点击此处查看代码图像\n\n***\n\n```csharp\npublic class SynchronizationUsingInterlocked\n\
  {\n    private static object _Data;\n\n    // 如果未分配，则初始化数据。\n    static void Initialize(object\
  \ newValue)\n    {\n        // 如果 _Data 为空，则将其设置为 newValue。\n        Interlocked.CompareExchange(ref\
  \ _Data, newValue, null);\n    }\n    // ...\n}\n```\n\n***\n\n`开始 2.0`\n\n![图像](img/19tab02.jpg)\n\
  \n**表格 19.2：Interlocked 的同步相关方法**\n\n`结束 2.0`\n\n这些方法中的大部分都具有额外数据类型（如 `long`）的重载。`Table\
  \ 19.2` 提供了通用签名。\n\n注意，你可以使用 `Increment()` 和 `Decrement()` 来替代 `Listing 19.6` 中的\
  \ `++` 和 `--` 运算符，这将产生更好的性能。还要注意，如果另一个线程使用非互锁方法访问 `location`，则两次访问将不会被同步。\n\n###\
  \ 多线程环境下的事件通知\n\n开发者经常忽略同步的一个领域是触发事件。发布事件的不安全线程代码与 `Listing 19.7` 类似。\n\n**列表 19.7：触发事件通知**\n\
  \n点击此处查看代码图像\n\n***\n\n```csharp\n// 非线程安全\nif(OnTemperatureChanged != null)\n{\n\
  \    // 调用订阅者\n    OnTemperatureChanged(this, new TemperatureEventArgs(value));\n\
  }\n```\n\n***\n\n只要此方法与事件订阅者之间没有竞态条件，此代码就是有效的。然而，该代码不是原子的，因此多个线程可能会引入竞态条件。可能在检查\
  \ `OnTemperatureChanged` 是否为 `null` 与实际触发事件之间，`OnTemperatureChanged` 被设置为 `null`，从而抛出\
  \ `NullReferenceException`。换句话说，如果多个线程可能同时访问委托，则有必要对委托的赋值和触发进行同步。\n\nC# 6.0 对这种困境的解决方案是轻而易见的。只需要使用空条件运算符即可：\n\
  \n点击此处查看代码图像\n\n\n\n\n\n```csharp\nOnTemperature?.Invoke(\n    this, new TemperatureEventArgs(\
  \ value ));\n```\n\n空条件运算符被专门设计为原子性操作，因此这种对委托的调用实际上是原子的。显然，关键在于要记住使用空条件运算符。\n\n\
  尽管这需要更多的代码，但在 C# 6.0 之前，实现线程安全的委托调用也并不特别困难。这种方法之所以有效，是因为添加和移除监听器的运算符是线程安全的且静态的（运算符重载是通过静态方法完成的）。要修正列表\
  \ 19.7 并使其变为线程安全，请赋值一个副本，检查该副本是否为 `null` 并触发该副本（参见列表 19.8）。\n\n**列表 19.8: 线程安全的事件通知**\n\
  \n点击此处查看代码图像\n\n* * *\n\n```csharp\n// ...\n\nTemperatureChangedHandler localOnChange\
  \ =\n    OnTemperatureChanged;\n\nif(localOnChanged != null)\n{\n  // 调用订阅者\n  localOnChanged(\n\
  \      this, new TemperatureEventArgs(value));\n}\n\n// ...\n```\n\n* * *\n\n考虑到委托是一种引用类型，赋值一个局部变量然后使用该局部变量触发就足以使空检查变为线程安全，这可能令人感到惊讶。由于\
  \ `localOnChange` 指向的位置与 `OnTemperatureChange` 指向的位置相同，你可能会认为 `OnTemperatureChange`\
  \ 的任何更改也会反映在 `localOnChange` 中。\n\n然而，事实并非如此：任何对 `OnTemperatureChange += <listener>`\
  \ 的调用都不会向 `OnTemperatureChange` 添加新的委托，而是为其分配一个全新的多播委托，而不会对 `localOnChange` 也指向的原多播委托产生任何影响。这使得代码是线程安全的，因为只有一个线程会访问\
  \ `localOnChange` 实例，而且如果添加或删除了监听器，`OnTemperatureChange` 将是一个全新的实例。\n\n## 同步设计最佳实践\n\
  \n随着多线程编程复杂性的增加，也出现了一些处理这些复杂性的最佳实践。\n\n### 避免死锁\n\n同步机制的引入也带来了死锁的潜在风险。当两个或多个线程等待对方释放同步锁时，就会发生死锁。例如，假设线程\
  \ 1 请求 `_Sync1` 的锁，然后稍后在释放 `_Sync1` 锁之前请求 `_Sync2` 的锁。同时，线程 2 请求 `_Sync2` 的锁，随后在释放\
  \ `_Sync2` 锁之前请求 `_Sync1` 的锁。这为死锁铺平了道路。如果线程 1 和线程 2 在获取第二个锁之前都成功获取了它们的初始锁（分别为 `_Sync1`\
  \ 和 `_Sync2`），死锁就会真正发生。\n\n要 true 死锁发生，必须满足四个基本条件：\n\n1. **互斥性**：一个线程（`ThreadA`）独占某个资源，导致其他任何线程（`ThreadB`）无法获取相同的资源。\n\
  2. **持有并等待**：一个拥有互斥资源的线程（`ThreadA`）正在等待另一个线程（`ThreadB`）持有的资源。\n3. **不可剥夺性**：线程（`ThreadA`）持有的资源不能被强制移除（`ThreadA`\
  \ 需要释放其自身的锁定的资源）。\n4. **循环等待条件**：两个或多个线程形成一个环形链，它们在相同的两个或多个资源上锁定，并且每个线程都在等待链中下一个线程持有的资源。\n\
  \n移除这些条件中的任何一个都可以防止死锁。\n\n可能导致死锁的场景是两个或多个线程请求相同两个或多个同步目标（资源）的独占所有权，并且以不同的顺序请求锁。当开发者细心确保多次锁的获取始终以相同的顺序发生时，就可以避免这种情况。死锁的另一个原因是锁不可重入的。当来自一个线程的锁可以阻塞该线程本身——也就是说，当它重新请求同一个锁时——该锁就是不可重入的。例如，如果\
  \ `ThreadA` 获取了锁，然后重新请求同一个锁，但由于该锁已被拥有（由它自己）而被阻塞，则该锁是不可重入的，额外的请求会导致死锁。因此，不可重入的锁只可能发生在单个线程。\n\
  \n`lock` 关键字生成的代码（使用底层的 `Monitor` 类）是重入的。然而，正如我们在“更多同步类型”部分中将看到的，某些锁类型并不是重入的。\n\n\
  ### 何时提供同步\n\n正如我们之前讨论的，所有静态数据都应该是线程安全的。因此，同步需要包围可变的静态数据。通常情况下，程序员应该声明私有静态变量，然后提供公共方法来修改这些数据。如果存在多线程访问，此类方法应该在内部处理同步。\n\
  \n相比之下，实例状态预计不应包含同步。同步可能会显著降低性能并增加锁竞争或死锁的概率。除了显式为多线程访问设计的类外，预计在多个线程之间共享对象的程序员应该自己处理对所共享数据的同步处理。\n\
  \n### 避免不必要的加锁\n\n在不损害数据完整性的前提下，程序员应尽可能避免不必要的同步。例如，你应该在线程之间使用不可变类型，这样就不需要同步了（这种方法在\
  \ F# 等函数式编程语言中已被证明极具价值）。同样，你应该避免在线程安全的操作上加锁，例如小于原生（指针大小）整数的简单值读写操作，因为此类操作是自动原子的。\n\
  \n* * *\n\n### 指南\n\n- **不要**以不同的顺序请求相同两个或多个同步目标的独占所有权。\n- **务必**确保持有多个锁的代码以相同的顺序获取锁。\n\
  - **务必**将可变静态数据封装在公共 API 中。\n- **避免**对简单的读写进行同步。\n\n* * *\n\n#### 更多同步类型\n\n除了 `System.Threading.Monitor`\
  \ 和 `System.Threading.Interlocked` 之外，还有更多同步技术。\n\n##### 使用 System.Threading.Mutex\n\
  \n2.0\n\n`System.Threading.Mutex` 在概念上与 `System.Threading.Monitor` 类（没有 `Pulse()`\
  \ 方法）相似，但 `lock` 关键字 own 它，且 `Mutex` 可以命名以支持跨进程同步。使用 `Mutex` 类可以同步访问文件或其他跨进程资源。由于\
  \ `Mutex` 是跨进程资源，.NET 2.0 增加了支持，允许通过 `System.Security.AccessControl.MutexSecurity`\
  \ 对象设置访问控制。`Mutex` 的一种用途是限制应用程序使其无法多次运行，如列表 19.9 所示。\n\n2.0\n\n**列表 19.9: 创建单实例应用程序**\n\
  \n点击此处查看代码图像\n\n* * *\n\n```csharp\nusing System;\nusing System.Threading;\nusing\
  \ System.Reflection;\npublic class Program\n{\n  public static void Main()\n  {\n\
  \    // 表明是否为第一个应用程序实例。\n    bool firstApplicationInstance;\n    // 从全程序集名称获取互斥量名称。\n\
  \    string mutexName =\n        Assembly.GetEntryAssembly().FullName;\n    using(Mutex\
  \ mutex = new Mutex(false, mutexName,\n        out firstApplicationInstance))\n\
  \    {\n      if(!firstApplicationInstance)\n      {\n        Console.WriteLine(\n\
  ```\n\n\n\n\n\n```csharp\n            \"This application is already running.\");\n\
  }\nelse\n{\n    Console.WriteLine(\"ENTER to shut down\");\n    Console.ReadLine();\n\
  }\n}\n}\n}\n}\n```\n\n运行应用程序第一个实例的结果显示在输出 19.4 中。\n\n**输出 19.4**\nENTER to shut\
  \ down\n\n当第一个实例仍在运行时，运行应用程序第二个实例的结果显示在输出 19.5 中。\n\n**输出 19.5**\n点击此处查看代码图像\n\n\
  此应用程序已经在运行。\n\n在这种情况下，应用程序在机器上只能运行一次，即使是由不同的用户启动的。要将实例限制为每个用户一次，请在 `Assembly.GetEntryAssembly().FullName`\
  \ 前加上 `System.Environment.UserDomainName` 和 `System.Environment.UserName` 的组合。\n\
  \n`Mutex` 继承自 `System.Threading.WaitHandle`，因此它包含了 `WaitAll()`、`WaitAny()` 和 `SignalAndWait()`\
  \ 方法。这些方法允许它自动获取多个锁——这是 `Monitor` 不支持的。\n\n### WaitHandle\n\n`Mutex` 的基类是 `System.Threading.WaitHandle`。这是一个由\
  \ `Mutex`、`EventWaitHandle` 和 `Semaphore` 同步类使用的基础同步类。`WaitHandle` 上的关键方法是 `WaitOne()`\
  \ 方法。这些方法会阻塞执行，直到 `WaitHandle` 实例被信号或被设置。`WaitOne()` 方法包含几个重载，允许无限等待：`void WaitOne()`，毫秒计时的等待；`bool\
  \ WaitOne(int milliseconds)`；以及 `bool WaitOne(TimeSpan timeout)`，基于 `TimeSpan` 的等待。返回布尔值的版本每\
  \ `WaitHandle` 在超时之前被发出信号时，都将返回 `true` 值。\n\n除了 `WaitHandle` 实例方法外，还有两个关键的静态成员：`WaitAll()`\
  \ 和 `WaitAny()`。与它们的实例对应方法一样，这些静态成员也支持超时。此外，它们接收数组形式的 `WaitHandle` 集合，以便它们能够响应来自集合内部的信号。\n\
  \n注意 `WaitHandle` 包含一个实现了 `IDisposable` 的句柄（类型为 `SafeWaitHandle`）。因此，需要确保在 `WaitHandle`\
  \ 不再需要时将其释放（dispose）。\n\n#### 开始 4.0\n\n### 重置事件：ManualResetEvent 和 ManualResetEventSlim\n\
  \n控制线程中特定指令相对于另一个线程指令执行时间的不确定性的一种方法是使用重置事件（reset events）。尽管使用了 *events*（事件）一词，但重置事件与\
  \ C# 的委托和事件没有关系。相反，重置事件是一种强制代码等待另一个线程的执行，直到该线程发出信号的方法。它们对于测试多线程代码特别有用，因为在验证结果之前，可以等待某个特定的状态。\n\
  \n重置事件的类型有 `System.Threading.ManualResetEvent` 和 .NET Framework 4 添加的轻量级版本 `System.Threading.ManualResetEventSlim`。（在接下来的高级主题中讨论，还有第三种类型\
  \ `System.Threading.AutoResetEvent`，但程序员应该避免使用它，转而使用前两者之一——参见高级主题“优先使用 `ManualResetEvent`\
  \ 和信号量而非 `AutoResetEvent`”。）重置事件上的关键方法是 `Set()` 和 `Wait()`（在 `ManualResetEvent`\
  \ 上称为 `WaitOne()`）。调用 `Wait()` 方法将导致线程阻塞，直到另一个线程调用 `Set()`，或者等待期超时。列表 19.10 演示了这种工作原理，输出\
  \ 19.6 显示了结果。\n\n**列表 19.10: 等待 ManualResetEventSlim**\n\n点击此处查看代码图像\n\n* * *\n\n\
  ```csharp\nusing System;\n\nusing System.Threading;\nusing System.Threading.Tasks;\n\
  \npublic class Program\n{\n  static ManualResetEventSlim MainSignaledResetEvent;\n\
  \  static ManualResetEventSlim DoWorkSignaledResetEvent;\n\n  public static void\
  \ DoWork()\n  {\n    Console.WriteLine(\"DoWork() started....\");\n    DoWorkSignaledResetEvent.Set();\n\
  \    MainSignaledResetEvent.Wait();\n    Console.WriteLine(\"DoWork() ending....\"\
  );\n  }\n\n  public static void Main()\n  {\n    using(MainSignaledResetEvent =\
  \ new ManualResetEventSlim())\n    using (DoWorkSignaledResetEvent = new ManualResetEventSlim())\n\
  \    {\n      Console.WriteLine(\"Application started....\");\n      Console.WriteLine(\"\
  Starting task....\");\n      // 对于 .NET 4.0 使用 Task.Factory.StartNew。\n      Task\
  \ task = Task.Run(()=>DoWork());\n      // 阻塞直到 DoWork() 开始。\n      DoWorkSignaledResetEvent.Wait();\n\
  \      Console.WriteLine(\"Waiting while thread executes...\");\n      MainSignaledResetEvent.Set();\n\
  \      task.Wait();\n      Console.WriteLine(\"Thread completed\");\n      Console.WriteLine(\"\
  Application shutting down.\");\n    }\n  }\n}\n```\n\n* * *\n\n**输出 19.6**\n点击此处查看代码图像\n\
  \nApplication started....\nStarting thread....\nDoWork() started....\nWaiting while\
  \ thread executes...\nDoWork() ending....\nThread completed\nApplication shutting\
  \ down\n\n列表 19.10 通过实例化并启动一个新的 `Task` 开始。下一页的表 19.3 显示了执行路径，其中每列代表一个线程。在代码出现在同一行的情况下，不确定哪侧先执行。\n\
  \n图像](graphics/19tab03.jpg)\n\n**表 19.3: ManualResetEvent 同步执行路径**\n\n尽管并不完全相同，但\
  \ `System.Threading.Monitor` 的 `Wait()` 和 `Pulse()` 方法在某些情况下提供了与重置事件类似的功能。\n\n\n\
  \n\n\n第三种重置事件是 `System.Threading.AutoResetEvent`，它与 `ManualResetEvent` 一样，允许一个线程（通过调用\
  \ `Set()`）通知另一个线程该第一个线程已到达代码中的某个位置。区别在于，`AutoResetEvent` 只会解除一个线程的 `Wait()` 调用：在第一个线程通过自动重置门控后，它会回到锁定状态。使用自动重置事件时，很容易错误地编写出生产者线程迭代次数多于消费者线程的代码。因此，通常优于使用\
  \ `Monitor` 的 `Wait()`/`Pulse()` 模式或使用信号量（如果参与特定块的线程少于 `n`）。\n\n与 `AutoResetEvent`\
  \ 相，`ManualResetEvent` 在显式调用 `Reset()` 之前不会返回到未信号状态。\n\n## Semaphore/SemaphoreSlim\
  \ 和 CountdownEvent\n\n`Semaphore` 和 `SemaphoreSlim` 的性能差异与 `ManualResetEvent` 和\
  \ `ManualResetEventSlim` 相同。与 `ManualResetEvent`/ManualResetEventSlim` 提供一个处于开启或关闭状态锁（类似于大门）不同，信号量仅限制允许\
  \ `N` 次调用同时进入关键区域。信号量本质上维护了一个资源池的计数。当此计数达到零时，它会阻塞对池的进一步访问，直到其中一个资源被返回并供队列中的下一个被阻塞请求使用。\n\
  \n`CountdownEvent` 非常类似于信号量，但它实现相反的同步。也就是说，它不是保护对已耗尽资源池的进一步访问，`CountdownEvent` 仅在计数归零时才允许访问。例如，考虑一个下载大量股票报价的并行操作。只有当所有报价都下载完成后，特定的搜索算法才能执行。`CountdownEvent`\
  \ 可用于同步搜索算法：在每个股票下载完成时递减计数，并在计数归零后释放搜索以开始。\n\n**开始 5.0**\n\n注意，`SemaphoreSlim` 和\
  \ `CountdownEvent` 是在 .NET Framework 4 中引入的。在 .NET 4.5 中，前者包含一个 `SemaphoreSlim.WaitAsync()`\
  \ 方法，以便在等待进入信号量时可以使用 TAP（任务并行异步模式）。\n\n**结束 5.0**\n\n## 并发集合类 (Concurrent Collection\
  \ Classes)\n\n另一系列随 .NET Framework 4 引入的类是并发集合类。这些类专门设计了内置同步代码，以便它们支持多个线程的并发访问，而无需担心竞态条件。并发集合类的列表出现在表\
  \ 19.4 中。\n\n![Image](img/19tab04.jpg)\n\n**表 19.4：并发集合类**\n\n由并发集合启用的一种常见模式是支持生产者和消费者的安全访问。实现\
  \ `IProducerConsumerCollection<T>` 的类（在表 19.4 中用 `*` 标识）是专门为提供此类支持而设计的。这允许一个或多个类在向集合中泵入数据的同时，另一组类从中读取并移除数据。数据添加和移除的顺序由实现\
  \ `IProducerConsumerCollection<T>` 接口的各个集合类决定。\n\n虽然它没有内置在 .NET Framework 中，但提供了一个额外的不可变集合库，命名为\
  \ `System.Collections.Immutable`。不可变集合的优势是它可以在线程之间自由传递，而无需担心死锁或中间状态更新。由于不可变集合无法被修改，因此不会发生中间更新；从而此类集合自动是线程安全的（因此不需要锁定访问）。更多信息请参阅\
  \ [`bit.ly/SystemCollectionsImmutable`](http://bit.ly/SystemCollectionsImmutable)。\n\
  \n### 线程本地存储 (Thread Local Storage)\n\n在某些情况下，使用同步锁会导致不可接受的性能和可扩展性限制。在其他实例，为特定数据元素提供同步可能过于复杂，特别是当它是原始代码之后添加的时。\n\
  \n同步的另一种替代方案是隔离，而实现隔离的一种方法是**线程本地存储**。通过线程本地存储，每个线程都有自己专用的变量实例。因此，不需要同步，因为对只发生在单个线程上下文中的数据进行同步没有意义。线程本地存储实现的两个示例是\
  \ `ThreadLocal<T>` 和 `ThreadStaticAttribute`。\n\n### ThreadLocal<T>\n\n在 .NET Framework\
  \ 4 中使用线程本地存储涉及声明一个类型为 `ThreadLocal<T>` 的字段（在编译器闭包的情况下为变量）。结果是每个线程拥有该字段的不同实例，如列表\
  \ 19.11 和输出 19.7 所示。注意，即使字段是静态的，也存在不同的实例。\n\n**列表 19.11：使用 ThreadLocal<T> 进行线程本地存储**\n\
  \n点击查看代码图像\n\n```\nusing System;\n\nusing System.Threading;\n\npublic class Program\n\
  {\n  static ThreadLocal<double> _Count = new ThreadLocal<double>(() => 0.01134);\n\
  \n  public static double Count\n  {\n      get { return _Count.Value; }\n      set\
  \ { _Count.Value = value; }\n  }\n\n  public static void Main()\n  {\n      Thread\
  \ thread = new Thread(Decrement);\n      thread.Start();\n\n      for (double i\
  \ = 0; i < short.MaxValue; i++)\n      {\n          Count++;\n      }\n      thread.Join();\
  \ // 注意：此处原文漏了 Join，按逻辑补充\n  }\n\n  static void Decrement()\n  {\n      Count;\n\
  \      for (double i = 0; i < short.MaxValue; i++)\n      {\n          Count--;\n\
  \      }\n      Console.WriteLine(\"Decrement Count = {0}\", Count);\n  }\n}\n```\n\
  *(注：原文示例代码中 Main 方法最后似乎漏了 thread.Join()，此处根据要求不翻译代码，仅保持结构)*\n\n**输出 19.7**\nDecrement\
  \ Count = -32767.0134\nMain Count = 32767.0134\n\n如输出 19.7 所示，执行 `Main()` 线程的 `Count`\
  \ 值不会被执行 `Decrement()` 的线程减少。对于 `Main()` 线程，初始值为 `0.01134`，最终值为 `32767.0134`。`Count`\
  \ 基于类型 `ThreadLocal<T>` 的静态字段。\n\n### 使用 ThreadAttribute 的线程存储\n\n在静态字段上装饰 `ThreadAttribute`（如列表\
  \ 19.12 所示）是指定静态变量为每个线程一个实例的另一种方法。该技术相对于 `ThreadLocal<T>` 有一些权衡，但它具有在 .NET Framework\
  \ 4 之前的优势。（此外，由于 `ThreadLocal<T>` 基于 `ThreadStatic`，它会消耗更内存并提供轻微的性能优势。）\n\n**列表\
  \ 19.12：使用 ThreadAttribute**\n\n```\nusing System;\nusing System.Threading;\n\n\
  public class Program\n{\n  [ThreadStatic]\n  static double _Count = 0.01134;\n\n\
  \  public static double Count\n  {\n      get { return Program._Count; }\n     \
  \ set { Program._Count = value; }\n  }\n\n  public static void Main()\n  {\n   \
  \   Thread thread = new Thread(Decrement);\n      thread.Start();\n\n      for (int\
  \ i = 0; i < short.MaxValue; i++)\n      {\n          Count++;\n      }\n      thread.Join();\n\
  \      Console.WriteLine(\"Main Count = {0}\", Count);\n  }\n\n  static void Decrement()\n\
  \  {\n      Count;\n      for (int i = 0; i < short.MaxValue; i++)\n      {\n  \
  \        Count--;\n      }\n      Console.WriteLine(\"Decrement Count = {0}\", Count);\n\
  \  }\n}\n```\n\n\n\n\n\n```csharp\nfor(int i = 0; i < short.MaxValue; i++)\n{\n\
  \    Count--;\n}\nConsole.WriteLine(\"Decrement Count = {0}\", Count);\n}\n}\n```\n\
  \n* *\n\n列表 19.12 的结果的结果出现在输出 19.8 中。\n\n**输出 19.8**\n\nDecrement Count = -32767\n\
  Main Count = 32767.01134\n\n如列表 19.11 所示，执行 `Main()` 的线程所对应的 `Count` 值永远不会被执行 `Decrement()`\
  \ 的线程递减。对于 `Main()` 线程，初始值为负数 `_Total`，最终值为 `0`。换句话说，通过 `ThreadStaticAttribute`，每个线程的\
  \ `Count` 值都是该线程特有的，且无法跨线程访问。\n\n请注意，与列表 19.11 不同，显示的“Decrement Count”值没有任何小数，这表明它从未被初始化为\
  \ `0.01134`。虽然 `_Count` 的值在声明期间被赋值——在本例中为 `private double _Count = 0.01134`——但只有运行静态构造函数的线程所关联的线程静态实例会被初始化。在列表\
  \ 19.12 中，只有执行 `Main()` 的线程其线程本地存储变量会被初始化为 `0.01134`。`Decrement()` 递减的 `_Count`\
  \ 值始终会被初始化为 `0`（由于 `_Count` 是 `double` 类型为`default(double)`）。同样，如果构造函数初始化了线程本地存储字段，只有调用该线程的构造函数会初始化线程本地存储实例。因此，在每个线程初始调用的方法中初始化线程本地存储字段是一种良好的做法。然而，这并不总是合理的，特别是涉及\
  \ `async` 时，不同的计算部分可能会在不同的线程上运行，导致每个部分的线程本地存储值出现意想不到的差异。\n\n使用线程本地存储的决策需要某种程度的成本效益分析。例如，考虑对数据库连接使用线程本地存储。根据数据库管理系统的不同，数据库连接相对昂，因此为每个线程创建一个连接可能很高。同样，锁定连接以使所有数据库调用同步会显著降低可扩展性的上限。每种模式都有其成本和收益，最佳选择在很大程度上取决于具体的实现。\n\
  \n使用线程本地存储的另一个原因是让其他方法可以使用常用的上下文信息，而无需显式地通过参数传递数据。例如，如果调用栈中的多个方法都需要用户安全信息，你可以使用线程本地存储字段而不是参数来传递数据。这保持了\
  \ API 的整洁，同时仍以线程安全的方式为方法提供信息。这种方法要求你确保线程本地数据始终被设置——这一步在 `Task` 或其他线程池线程上尤为重要，因为底层线程是被重用的。\n\
  \n`开始 5.0`\n\n### 定时器\n\n有时必要延迟代码执行一段时间，或者在特定时间后注册通知。例如在特定周期内刷新屏幕，而不是在数据频繁变化时立即刷新。实现定时器的一种方法是利用\
  \ C# 5.0 的 `async/await` 模式以及 .NET 4.5 添加的 `Task.Delay()` 方法。如我们在第 18 章中所提到的，TAP\
  \ 的一个关键特性是，在异步调用后执行的代码将在支持的线程上下文中继续，从而避免任何 UI 跨线程问题。列表 19.13 提供了一个如何使用 `Task.Delay()`\
  \ 方法的示例。\n\n**列表 19.13：使用 Task.Delay() 作为定时器**\n\n点击此处查看代码图像\n\n* *\n\n```csharp\n\
  using System;\nusing System.Threading.Tasks;\n\npublic class Pomodoro\n{\n  // ...\n\
  \  private static async Task TickAsync(\n      System.Threading.CancellationToken\
  \ token)\n  {\n      for(int minute = 0; minute < 25; minute++)\n      {\n     \
  \     DisplayMinuteTicker(minute);\n          for(int second = 0; second < 60; second++)\n\
  \          {\n              await Task.Delay(1000);\n          }\n      }\n  }\n\
  }\n```\n\n\n\n\n\n下一章将研究另一种复杂的 `.NET` 技术：使用 `P/Invoke` 将调用出 `.NET` 并进入非托管代码。此外，它还引入了名为\
  \ `unsafe code`（不安全代码）的概念，C# 使用它直接访问内存指针，就像非托管代码那样（例如 `C++`）。\n\n# 20. 平台互操作性与不安全代码\n\
  \nC# 具有强大的能力，特别是与 `.NET` 库配合使用时。然而，有时你确实需要跳 C# 提供的所有安全性，回到内存地址和指针的世界。C# 通过四种方式支持这种操作。第一种选项是通过平台程序调用（`P/Invoke`）调用非托管\
  \ DLL 暴露的 API。第二种方法是通过 `unsafe code`，它允许访问内存指针和地址。第三种方法——虽然特定于 Windows 8 或更高版本——是通过\
  \ Windows Runtime (`WinRT`) API，它正在露了越来越多的操作系统功能，并使它们在 C# 5.0 或更高版本中直接可用。最后一种方法（本文未涉及）是通过\
  \ COM 互操作性。\n\n![Image](img/0849fig01.jpg)\n\n本章大部分内容讨论了与非托管代码的互操作性以及 `unsafe code`\
  \ 的使用。这些讨论以一个判断计算机是否为虚拟计算机的小程序结束。该代码要求你执行以下操作：\n\n1. 调用操作系统 DLL 并请求分配部分内存用于执行指令。\n\
  2. 将一些汇编指令写入分配的区域。\n3. 将一个地址位置注入到汇编指令中。\n4. 执行该汇编代码。\n\n除了这里涵盖的 `P/Invoke` 和 `unsafe`\
  \ 结构外，完整的代码列表展示了 C# 的完整威力，以及非托管代码的能力仍然可以通过 C# 和托管代码进行访问。我们通过简要讨论 `WinRT` 来结束本章，以便开发者在使用它之前了解其的一些显著特征。\n\
  \n## 平台程序调用 (Platform Invoke)\n\n无论开发者是尝试调用现有非托管代码库、访问操作系统未通过任何托管 API 暴露的非托管代码，还是试图通过避免类型检查和垃圾收集的运行时开销为特定算法实现最大性能，在某个时刻必须对非托管代码进行调用。CLI\
  \ 通过 `P/Invoke` 提供了这种能力。通过 `P/Invoke`，你可以调用非托管 DLL 导出的函数。\n\n在本节中调用的所有 API 都是 Windows\
  \ API。虽然相同的 API 在其他平台上不可用，但开发者仍然可以使用 `P/Invoke` 调用其平台的原生 API，或调用他们自己的 DLL。指南和语法是相同的。\n\
  \n### 声明外部函数\n\n一旦确定了目标函数，`P/Invoke` 的下一步是在托管代码中声明该函数。就像所有属于某个类的普通方法一样，你需要在类的上下文中声明目标\
  \ API，但要使用 `extern` 修饰符。列表 20.1 演示了如何这样做。\n\n**列表 20.1: 声明一个外部方法**\n\n点击此处查看代码图像\n\
  \n```c\nusing System;\n\nusing System.Runtime.InteropServices;\n\nclass VirtualMemoryManager\n\
  {\n  [DllImport(\"kernel32.dll\", EntryPoint=\"GetCurrentProcess\")]\n  internal\
  \ static extern IntPtr GetCurrentProcessHandle();\n}\n```\n\n在这种情况下，类名为 `VirtualMemoryManager`，因为因为它将包含与内存管理相关的函数。（此特定函数可以直接从\
  \ `System.Diagnostics.Processor` 类获取，因此无需在实际代码中声明它。）注意，该方法返回 `IntPtr`；该类型将在下一节中解释。\n\
  \n`extern` 方法从不包含任何方法体，并且（几乎）总是静态的。代替方法体，伴随方法声明的 `DllImport` 属性指向实现部分。至少，该属性需要定义函数的\
  \ DLL 名称。运行时根据方法名推断函数名，尽管你可以使用 `EntryPoint` 命名参数覆盖此默认值以提供函数名。（`.NET` 平台将自动尝试调用 Unicode\
  \ [`...W`] 或 ASCII [`...A`] API 版本。）\n\n在这种情况下，外部函数 `GetCurrentProcess()` 获取当前进程的伪句柄（pseudohandle），你将在虚拟内存分配调用中使用它。以下是非托管声明：\n\
  \n```c\nHANDLE GetCurrentProcess();\n```\n\n### 参数数据类型\n\n假设开发者已确定了目标 DLL 和导出函数，最困难的步骤是识别或创建与外部函数中的非托管类型对应的托管数据类型。列表\
  \ 20.2 显示了一个更复杂的 API。\n\n声明 Win32 API 的一个特别有用的资源是 [www.pinvoke.net](http://www.pinvoke.net)。它为许多\
  \ API 提供了一个很好的起点，帮助你避免从零开始编写外部 API 调用时可能出现的一些微妙问题。\n\n**列表 20.2: VirtualAllocEx()\
  \ API**\n\n点击此处查看代码图像\n\n```c\nLPVOID VirtualAllocEx(\n  HANDLE hProcess,    //\
  \ 进程的句柄。\n  LPVOID lpAddress,   // 指定起始地址的指针\n  SIZE_T dwSize,      // 要分配区域的大小，单位为字节。\n\
  \  DWORD flAllocationType,// 内存分配类型。\n  DWORD flProtect);   // 内存保护类型。\n```\n\n\
  `VirtualAllocEx()` 分配操作系统专门指定的用于执行或数据的虚拟内存。要调用它，你需要在托管代码为每个数据类型提供相应的定义；虽然在 Win32\
  \ 编程中很常见，但 `HANDLE`、`LPVOID`、`SIZE_T` 和 `DWORD` 在 CLI 托管代码中并未定义。因此，C# 中对 `VirtualAllocEx()`\
  \ 的声明如列表 20.3 所示。\n\n**列表 20.3: 在 C# 中声明 VirtualAllocEx() API**\n\n```csharp\n[DllImport(\"\
  kernel32.dll\")]\ninternal static extern IntPtr GetCurrentProcess();\n\n[DllImport(\"\
  kernel32.dll\", SetLastError = true)]\nprivate static extern IntPtr VirtualAllocEx(\n\
  \  IntPtr hProcess,\n  IntPtr lpAddress,\n  IntPtr dwSize,\n  AllocationType flAllocationType,\n\
  \  uint flProtect);\n```\n\n\n\n\n托管代码的一个显著特征是，像 `int` 的原始数据类型的大小不会根据处理器的不同而改变。无论处理器是\
  \ 16 位、32 位还是 64 位，`int` 始终是 32 位。然而，在非托管代码中，内存指针会根据处理器而变化。因此，不需要简单地将 `HANDLE` 和\
  \ `LPVOID` 等类型映射到 `int`，而是需要映射到 `System.IntPtr`，其大小将根据处理器的内存布局而变化。此示例还使用了 `AllocationType`\
  \ 枚举，我们将在本章稍后的“使用包装器简化 API 调用”部分中讨论它。\n\n关于列表 20.3 值得注意的一个有趣点是 `IntPtr` 不仅用于指针；也就是说，它也用于数量等其他情况。`IntPtr`\
  \ 并不意味着“存储在整数中的指针”；它还意味着“与指针相同的整数”。`IntPtr` 不一定包含一个指针，只需要包含一个与指针大小的内容即可。有很多东西的大小与指针相同，但它们本身并不是指针。\n\
  \n### 使用 ref 代替指针\n\n非托管代码经常使用指针作为引用传递参数。在这些情况下，P/Invoke 并不要求你将数据类型映射到托管代码中的指针。相反，你将相应的参数映射到\
  \ `ref`（或 `out`，取决于参数是 `in`/`out` 还是仅为 `out`）。在列表 20.4 中，`lpflOldProtect` 的数据类型为\
  \ `PDWORD`，它是一个示例，返回“指向接收指定页区域第一页的先前访问保护的变量的指针”。^(2)\n\n2. MSDN 文档。\n\n**列表 20.4：使用\
  \ ref 和 out 代替指针**\n\n点击此处查看代码图像\n\n***\n\n```cpp\nclass VirtualMemoryManager\n\
  {\n  // ...\n  [DllImport(\"kernel32.dll\", SetLastError = true)]\n  static extern\
  \ bool VirtualProtectEx(\n      IntPtr hProcess, IntPtr lpAddress,\n      IntPtr\
  \ dwSize, uint flNewProtect,\n      ref uint lpflOldProtect);\n}\n```\n\n***\n\n\
  尽管 `lpflOldProtect` 被记录为 `[out]`（尽管签名并未强制要求），但描述随后提到了该参数必须指向一个有效变量而不是 `NULL`。这种不一致性虽然令人困惑，但很常见。指导方是对于\
  \ P/Invoke 类型参数应使用 `ref` 而不是 `out`，因为调用者始终可以忽略通过 `ref` 传递的数据，但反之操作并不一定能成功。\n\n其他参数与\
  \ `VirtualAllocEx()` 几乎相同，区别在于 `lpAddress` 是从 `VirtualAllocEx()` 返回的地址。此外，`flNewProtect`\
  \ 指定了精确的内存保护类型：页执行、页只读等。\n\n### 使用 StructLayoutAttribute 进行顺序布局\n\n某些 API 涉及没有对应托管类型的类型。调用这些类型需要在托管代码中重新声明该类型。例如，你可以在托管代码中声明非托管的\
  \ `COLORREF` 结构体（参见列表 20.5）。\n\n**列表 20.5：从非托管结构体声明类型**\n\n点击此处查看代码图像\n\n***\n\n\
  ```csharp\n[StructLayout(LayoutKind.Sequential)]\nstruct ColorRef\n{\n  public byte\
  \ Red;\n  public byte Green;\n  public byte Blue;\n  // 关闭关于未访问 Unused 的警告。\n  #pragma\
  \ warning disable 414\n  private byte Unused;\n  #pragma warning restore 414\n \
  \ public ColorRef(byte red, byte green, byte blue)\n  {\n      Blue = blue;\n  \
  \    Green = green;\n      Red = red;\n      Unused = 0;\n  }\n}\n```\n\n***\n\n\
  各种 Microsoft Windows 颜色 API 使用 `COLORREF` 来表示 RGB 颜色（即红色、绿色和蓝色级别）。\n\n此声明的关键是 `StructLayoutAttribute`。默认情况下，托管代码可以优化类型的内存布局，因此布局从一个字段到另一个字段可能顺序的。为了强制使用顺序布局，以便类型能够直接映射并从托管代码到非托管代码进行逐位拷贝（blitted），反之亦然，你需要添加带有\
  \ `LayoutKind.Sequential` 枚举值的 `StructLayoutAttribute`。（这在向文件流读写数据时且可能期望顺序布局时也有用。）\n\
  \n由于非托管 (C++) 的 `struct` 定义不映射到 C# 定义，因此没有从非托管结构体到托管结构体的直接映射。相反，开发者应该遵循通常的 C# 指南，判断该类型应该像值类型还是引用类型，以及大小是否小（约小于\
  \ 16 字节）。\n\n### 错误处理\n\nWin32 API 编程的一个不便方面是 API 经常以不一致的方式报告错误。例如，某些 API 返回值（`0`、`1`、`false`\
  \ 等）来指示错误，而另一些则设置一个 `out` 参数。此外，错误的细节需要调用 `GetLastError()` API 和 `FormatMessage()`\
  \ 来检索。总之，非托管代码中的错误通过异常发生。幸运的是，P/Invoke 设计者提供了一种错误处理机制。要启用它，如果 `DllImport` 属性的 `SetLastError`\
  \ 参数为 `true`，就可以实例化一个紧随 P/Invoke 调用后初始化的 `System.ComponentModel.Win32Exception()`（参见列表\
  \ 20.6）。\n\n**列表 20.6：Win32 错误处理**\n\n点击此处查看代码图像\n\n***\n\n```csharp\nclass VirtualMemoryManager\n\
  {\n  [DllImport(\"kernel32.dll\", SetLastError = true)]\n  private static extern\
  \ IntPtr VirtualAlloc(\n      IntPtr hProcess,\n      IntPtr lpAddress,\n      IntPtr\
  \ dwSize,\n      AllocationType flAllocation,\n      uint flProtect);\n  // ...\n\
  \  [DllImport(\"kernel32.dll\", SetLastError = true)]\n  static extern bool VirtualProtectEx(\n\
  \      IntPtr hProcess, IntPtr lpAddress,\n      IntPtr dwSize, uint flNewProtect,\n\
  \      ref uint lpflOldProtect);\n  [Flags]\n  private enum AllocationType : uint\n\
  \  {\n    // ...\n  }\n  [Flags]\n  private enum ProtectionOptions\n  {\n    //\
  \ ...\n  }\n  [Flags]\n  private enum MemoryFreeType\n  {\n    // ...\n  }\n  public\
  \ static IntPtr AllocExecutionBlock(int size, IntPtr hProcess)\n  {\n    IntPtr\
  \ codeBytesPtr;\n    codeBytesPtr = VirtualAllocEx(\n      hProcess, IntPtr.Zero,\n\
  \      (IntPtr)size,\n      AllocationType.Reserve | AllocationType.Commit,\n  \
  \    (uint)ProtectionOptions.PageExecuteReadWrite);\n    if (codeBytesPtr == IntPtr.Zero)\n\
  \    {\n      throw new System.ComponentModel.Win32Exception();\n    }\n    uint\
  \ lpflOldProtect = 0;\n    if (!VirtualProtectEx(\n      hProcess, codeBytesPtr,\n\
  \      (IntPtr)size,\n      (uint)ProtectionOptions.PageExecuteReadWrite,\n    \
  \  ref lpflOldProtect))\n    {\n      throw new System.ComponentModel.Win32Exception();\n\
  \    }\n    return codeBytesPtr;\n  }\n  public static IntPtr AllocExecutionBlock(int\
  \ size)\n  {\n    return AllocExecutionBlock(size, GetCurrentProcessHandle());\n\
  \  }\n}\n```\n\n***\n\n此代码允许开发者提供每个 API 使用的自定义错误检查，同时以标准方式报告错误。\n\n\n\n\n\n列表 20.1\
  \ 和 列表 20.3 将 P/Invoke 方法声明为内部（internal）或私有（private）。除了简单的 API 外，将方法封装在公共包装器以减少\
  \ P/Invoke API 调用的复杂性是一个良好的准则，这可以增加 API 的易用性并向面向对象的类型结构迈进。列表 20.6 中的 `AllocExecutionBlock()`\
  \ 为这种方法提供了一个很好的示例。\n\n### 指南\n\n**应该**为非托管方法创建公共的托管包装器，并使用托管代码的约定，例如结构化异常处理。\n\n\
  ### 使用 SafeHandle\n\n通常情况下，P/Invoke 涉及某些资源（例如窗口句柄），代码在使用后需要清理这些资源。与其要求开发者记住这一步骤是必要的并且每次都手动编写代码，不如提供一个实现了\
  \ `IDisposable` 和析构函数的类是有是有帮助的。例如，在 列表 20.7 中，`VirtualAllocEx()` 和 `VirtualProtectEx()`\
  \ 返回的地址需要后续调用 `VirtualFreeEx()`。为了为此过程提供内置支持，你定义了一个派生自 `System.Runtime.InteropServices.SafeHandle`\
  \ 的 `VirtualMemoryPtr` 类。\n\n**列表 20.7：使用 SafeHandle 的托管资源**\n\n点击此处查看代码图像\n\n```csharp\n\
  public class VirtualMemoryPtr :\n  System.Runtime.InteropServices.SafeHandle\n{\n\
  \  public VirtualMemoryPtr(int memorySize) :\n      base(IntPtr.Zero, true)\n  {\n\
  \      ProcessHandle =\n          VirtualMemoryManager.GetCurrentProcessHandle();\n\
  \      MemorySize = (IntPtr)memorySize;\n      AllocatedPointer =\n          VirtualMemoryManager.AllocExecutionBlock(\n\
  \          memorySize, ProcessHandle);\n      Disposed = false;\n  }\n  public readonly\
  \ IntPtr AllocatedPointer;\n  readonly IntPtr ProcessHandle;\n  readonly IntPtr\
  \ MemorySize;\n  bool Disposed;\n  public static implicit operator IntPtr(\n   \
  \   VirtualMemoryPtr virtualMemoryPointer)\n  {\n      return virtualMemoryPointer.AllocatedPointer;\n\
  \  }\n  // SafeHandle 抽象成员\n  public override bool IsInvalid\n  {\n      get\n \
  \     {\n          return Disposed;\n      }\n  }\n  // SafeHandle 抽象成员\n  protected\
  \ override bool ReleaseHandle()\n  {\n      if (!Disposed)\n      {\n          Disposed\
  \ = true;\n          GC.SuppressFinalize(this);\n          VirtualMemoryManager.VirtualFreeEx(ProcessHandle,\n\
  \              AllocatedPointer, MemorySize);\n      }\n      return true;\n  }\n\
  }\n```\n\n`System.Runtime.InteropServices.SafeHandle` 包含了抽象成员 `IsInvalid` 和 `ReleaseHandle()`。你将清理代码放在后者；前者则指示此代码是否已经执行。\n\
  \n通过 `VirtualMemoryPtr`，你可以只需通过实例化该类型并指定所需的内存分配来分配内存。\n\n### 调用外部函数\n\n一旦声明了 P/Invoke\
  \ 函数，你就可以像调用任何其他类成员一样调用它们。然而，关键在于导入的 DLL 必须在路径中（包括可执行文件目录），这样才能成功加载。列表 20.6 和 列表\
  \ 20.7 提供了这种方法的演示。然而，它们依赖于某些常量。\n\n由于 `flAllocationType` 和 `flProtect` 是标志，因此为每个标志提供常量或枚举是一个良好的做法。与其期望调用者定义这些常量或枚举，不如封装建议你将它们作为\
  \ API 声明的一部分提供，如 列表 20.8 所示。\n\n**列表 20.8：共同封装 API**\n\n点击此处查看代码图像\n\n```csharp\n\
  class VirtualMemoryManager\n{\n  // ...\n  /// <summary>\n  /// 内存分配的类型。此参数必须\n\
  \  /// 包含以下值之一。\n  /// </summary>\n  [Flags]\n  private enum AllocationType : uint\n\
  \  {\n      /// <summary>\n      /// 为指定的预留内存页在内存或磁盘\n      /// 分页文件中分配物理存储。该函数将\n\
  \      /// 初始化为零。\n      /// </summary>\n      Commit = 0x1000,\n      /// <summary>\n\
  \      /// 预留进程虚拟地址空间的一个范围，\n      /// 而不在内存或磁盘分页文件中\n      /// 分配任何物理存储。\n    \
  \  /// </summary>\n      Reserve = 0x2000,\n      /// <summary>\n      /// 表示由 lpAddress\
  \ 和 dwSize 指定的内存范围中的\n      /// 数据不再被关注。这些页不应读取或写入\n      /// 分页文件。然而，内存块稍后将被使用，\n\
  \      /// 因此不应取消提交（decommitted）。\n      /// 值不能与任何其他值一起使用。\n      /// </summary>\n\
  \      Reset = 0x8000,\n      /// <summary>\n      /// 分配具有读写访问权限的物理内存。\n      ///\
  \ 此值仅用于 Windows 扩展\n      /// (AWE)。\n      /// </summary>\n      Physical = 0x4000,\n\
  \      /// <summary>\n      /// 在最高地址分配内存。\n      /// </summary>\n      TopDown\
  \ = 0x10000,\n  }\n  /// <summary>\n  /// 要分配页的内存保护选项。\n  /// </summary>\n  [Flags]\n\
  \  private enum ProtectionOptions : uint\n  {\n      /// <summary>\n      /// 为已提交区域启用执行访问。\n\
  \      /// 尝试写入该区域将导致访问冲突。\n      /// </summary>\n      Execute = 0x10,\n      ///\
  \ <summary>\n      /// 为已提交区域启用执行和读取访问。\n      /// 尝试写入该区域将导致访问冲突。\n      /// </summary>\n\
  \      PageExecuteRead = 0x20,\n      /// <summary>\n      /// 为已提交区域启用执行、读取和写入访问。\n\
  \      /// </summary>\n      PageExecuteWrite = 0x40,\n      // ...\n  }\n  ///\
  \ <summary>\n  /// 释放操作类型。\n  /// </summary>\n  [Flags]\n  private enum MemoryFreeType\
  \ : uint\n  {\n      /// <summary>\n      /// 取消指定的提交页。\n      /// 操作后，页将处于预留状态。\n\
  \      /// </summary>\n      Decommit = 0x4000,\n      /// <summary>\n      ///\
  \ 释放指定的页。\n      /// 操作后，页将处于空状态。\n      /// </summary>\n      Release = 0x8000\n\
  \  }\n  // ...\n}\n```\n\n枚举的优势在于它们将各种值组合在一起。此外，它们可以将范围限制在这些这些值之外。\n\n### 使用包装器简化\
  \ API 调用\n\n无论是错误处理、结构体还是常量值，有效 API 开发者的目标之一是提供一个封装 Win32 API 的简化托管 API。例如，列表 20.9\
  \ 重载了 `VirtualFreeEx()`，提供了简化的公共版本。\n\n**列表 20.9：封装底层 API**\n\n点击此处查看代码图像\n\n```csharp\n\
  class VirtualMemoryManager\n{\n  // ...\n  [DllImport(\"kernel32.dll\", SetLastError\
  \ = true)]\n  static extern bool VirtualFreeEx(\n      IntPtr hProcess, IntPtr lpAddress,\n\
  \      IntPtr dwSize, IntPtr dwFreeType);\n  public static bool VirtualFreeEx(\n\
  \      IntPtr hProcess, IntPtr lpAddress,\n      IntPtr dwSize)\n  {\n      bool\
  \ result = VirtualFreeEx(\n          hProcess, lpAddress, dwSize,\n          (IntPtr)MemoryFreeType.Decommit);\n\
  \      if (!result)\n      {\n          throw new System.ComponentModel.Win32Exception();\n\
  \      }\n      return result;\n  }\n  public static bool VirtualFreeEx(\n     \
  \ IntPtr lpAddress, IntPtr dwSize)\n  {\n      return VirtualFreeEx(\n  }\n}\n```\n\
  \n\n\n\n```cs\nGetCurrentProcessHandle(), lpAddress, dwSize);\n\n}\n\n[DllImport(\"\
  kernel32\", SetLastError = true)]\nstatic extern IntPtr VirtualAllocEx(\n    IntPtr\
  \ hProcess,\n    IntPtr lpAddress,\n    IntPtr dwSize,\n    AllocationType flAllocationType,\n\
  \    uint flProtect);\n\n// ...\n}\n```\n\n***\n\n### 函数指针映射到委托\n\n与 P/Invoke 相关的最后一个关键点是，未托管代码中的函数指针会映射到托管代码中的委托。例如，在设置\
  \ Microsoft Windows 计时器时，你需要提供一个函数指针，以便计时器在期后调用该指针进行回调。具体来说，你将传递一个与回调签名匹配的委托实例。\n\
  \n### 指南\n\n鉴于 P/Invoke 的特殊性，有几条指南可以帮助编写此类代码。\n\n***\n\n### 指南\n\n- **不要**不必要地复制已经执行未托管\
  \ API 功能的现有托管类。\n- **应当**将 `extern` 方法声明为私有（private）或内部（internal）。\n- **应当**提供公共的封装方法（wrapper\
  \ methods），并使用托管约定，例如结构化异常处理、使用枚举（enums）处理特殊值等。\n- **应当**通过为不必要的参数选择默认值来简化封装方法。\n\
  - **应当**使用 `SetLastErrorAttribute` 将使用 `SetLastError` 错误代码的 API 转换为抛出 `Win32Exception`\
  \ 的方法。\n- **应当**扩展 `SafeHandle` 或实现 `IDisposable` 并创建终结器（finalizer），以确保未托管资源可以被有效清理。\n\
  - 当未托管 API 需要函数指针时，**应当**使用与目标签名匹配的委托类型。\n- **应当**尽可能使用 `ref` 参数而不是指针类型。\n\n***\n\
  \n## 指针与地址\n\n有时，开发者可能希望直接访问和操作内存以及指向内存位置的指针。这对于某些操作系统交互以及某些对时间极其敏感的算法来说是必要的。为了支持这种能力，C#\
  \ 要求使用 `unsafe`（不安全）代码结构。\n\n#### 不安全代码\n\nC# 的伟大特性之一是它是强类型的，并且在整个运行时执行期间都支持类型检查。这一特性特别有益的一点是，可以绕过这种支持并直接操作内存和地址。当你处理内存映射设备等内容，或者如果你想实现对时间敏感的算法时，就会这样做。关键是将部分代码标记为\
  \ `unsafe`。\n\n不安全代码是一个显式的代码块和编译选项，如列表 20.10 所示。`unsafe` 修饰符对生成的 CIL 代码本身没有影响，它只是告诉编译器允许在\
  \ `unsafe` 块内进行指针和地址的操作。此外，`unsafe` 并不意味着“未托管”（unmanaged）。\n\n**列表 20.10：为不安全代码指定方法**\n\
  \n点击此处查看代码图像\n\n***\n\n```cs\nclass Program\n{\n    unsafe static int Main(string[]\
  \ args)\n    {\n        // ...\n    }\n}\n```\n\n***\n\n你可以将 `unsafe` 作为修饰符用于类型或类型内的特定成员。\n\
  \n此外，C# 还允许将 `unsafe` 作为语句，标记代码块以允许不安全代码（参见列表 20.11）。\n\n**列表 20.11：为不安全代码指定代码块**\n\
  \n点击此处查看代码图像\n\n***\n\n```cs\nclass Program\n{\n    static int Main(string[] args)\n\
  \    {\n        unsafe\n        {\n            // ...\n        }\n    }\n}\n```\n\
  \n***\n\n`unsafe` 块中的代码可以包含指针等不安全结构。\n\n***\n\n### 注意事项\n\n有必要显式告知编译器支持不安全代码。\n\n\
  ***\n\n从命令行开始，通知编译器支持不安全代码需要使用 `/unsafe` 选项。例如，要编译前面的代码，你需要使用输出 20.1 所示的命令。\n\n\
  **输出 20.1**\n\n```\ncsc.exe /unsafe Program.cs\n```\n\n在 Visual Studio 中，你可以通过勾选项目属性窗口中“生成”（Build）选项卡下的“允许不安全代码”（Allow\
  \ Unsafe Code）复选框来激活此功能。\n\n使用 `/unsafe` 选项是必要的，因为不安全代码开启了缓冲区溢出及类似结果的可能性，这些结果可能会暴露安全漏洞。`/unsafe`\
  \ 选项允许你直接操作内存并执行未托管的指令。因此，要求使用 `/unsafe` 使得潜在暴露的选择变得显式。\n\n#### 指针声明\n\n现在你已经将代码标记为不安全，是时候考虑如何编写不安全代码了。考虑以下示例：\n\
  \n```cs\nbyte* pData;\n```\n\n\n\n\n\n问题在于，在托管环境中，数据可能会移动，从而导致地址失效。错误信息为“你只能获取固定语句初始化器内部的[某个]未固定表达式的地址”。在这种情况下，所引用的字节出现在数组中，而数组是一种引用类型（可移动类型）。引用类型出现在堆上，并受垃圾回收或重定位的影响。当引用一个可移动类型上的值类型字段时，也会发生类似的问题：\n\
  \n```csharp\nint* a = &\"message\".Length;\n```\n\n无论何种，为某些数据分配地址都需要满足以下条件：\n\n\
  * 数据必须被归类为变量。\n* 数据必须是非托管类型。\n* 该变量需要被归类为固定的（fixed），而不是可移动的。\n\n如果数据是非托管变量类型但未被固定，请使用\
  \ `fixed` 语句来固定可移动变量。\n\n### 固定数据\n\n要获取可移动数据项的地址，必须对数据进行固定或钉（pin），如列表 20.13 所示。\n\
  \n**列表 20.13：fixed 语句**\n\n点击此处查看代码图像\n\n* * *\n\n```csharp\nbyte[] bytes = new\
  \ byte[24];\n\nfixed (byte* pData = &bytes[0])  // 允许 pData = bytes\n{\n  // ...\n\
  }\n```\n\n* * *\n\n在 `fixed` 语句的代码块内，分配的数据将不会移动。在这个示例中，`bytes` 将保持在相同的地址，至少直到 `fixed`\
  \ 语句结束。\n\n`fixed` 语句要求在其作用域内声明指针变量。这避免了在 `fixed` 语句外部访问变量（此时数据不再被固定）。然而，作为程序员，你有责任确保不会将指针分配给另一个超出\
  \ `fixed` 语句作用范围的变量——例如可能在 API 调用中。不安全代码被称为“不安全”是有原因的；你必须确保安全地使用指针，而不是依赖运行时替你执行安全检查。同样，使用\
  \ `ref` 或 `out` 参数对于不会在方法调用之外存活的数据将产生问题。\n\n由于字符串是一种无效的引用类型，定义字符串的指针似乎是无效的。但是，与\
  \ C++ 一样，字符串内部是指向字符数组第一个字符的指针，可以使用 `char*` 声明指向字符的指针。因此，C# 允许声明类型为 `char*` 的指针并在\
  \ `fixed` 语句将其分配给字符串。`fixed` 语句防止指针生命周期内字符串的移动。同样，在有 `fixed` 语句的情况下，允许任何支持隐式转换为另一种类型指针的可移动类型。\n\
  \n你可以将 `&bytes[0]` 这种冗长的赋值替换为简短的 `bytes`，如列表 20.14 所示。\n\n**列表 20.14：无地址或数组索引器的\
  \ fixed 语句**\n\n* * *\n\n```csharp\nbyte[] bytes = new byte[24];\n\nfixed (byte*\
  \ pData = bytes)\n{\n  // ...\n}\n```\n\n* * *\n\n根据执行的频率和所需时间，`fixed` 语句具有导致堆碎片的潜力，因为垃圾回收器无法压缩固定的对象。为了减少这个问题，最佳实践是在执行早期钉住数据块，并且钉住较少的大块而不是许多小块。遗憾的是，这种偏好必须与“尽可能在尽可能短的时间钉住尽可能少”的做法相结合，以减少在数据被钉住期间发生集合的概率。在某种程度上，.NET\
  \ 2.0 通过包含一些额外的碎片感知代码减少了这个问题。\n\n你可能需要在某一个方法体中就地固定一个对象，并使其保持固定状态直到调用另一个方法；这通过 `fixed`\
  \ 语句是无法做到的。如果你处于这种不幸的境地，可以使用 `GCHandle` 对象上的方法无限期固定一个对象。然而，只有在绝对必要时才应该这样做；长时间固定对象会导致垃圾回收器无法高效压缩内存的概率大大增加。\n\
  \n### 在栈上分配\n\n你应该在数组上使用 `fixed` 语句以防止垃圾回收器移动数据。然而，另一种方案是在调用栈上分配数组。栈分配的数据不受垃圾回收或伴随其而来的终结器模式的影响。与引用类型类似，要求是\
  \ `stackalloc` 数据必须是非托管类型的数组。例如，与其在堆上分配字节数组，不如将其置于调用堆栈上，如列表 20.15 所示。\n\n**列表 20.15：在调用栈上分配数据**\n\
  \n* * *\n\n```csharp\nbyte* bytes = stackalloc byte[42];\n```\n\n* * *\n\n由于数据类型是非托管类型的数组，运行时可以为数组分配固定大小的缓冲区，并在指针超出范围后恢复该缓冲区。具体而言，它分配了\
  \ `sizeof(T) * E`，其中 `E` 是数组大小，`T` 是引用类型。考虑到仅在非托管类型数组上使用 `stackalloc` 的要求，运行时通过简单的回溯将缓冲区恢复到系统，从而消除了迭代的复杂性。\n\
  \n#### 解引用指针\n\n访问存储在变量中的数据需要间接运算符。在不安全代码中使用这种原理可以实现修改“不可变”字符串的反常，如列表 20.16 所示。\n\
  \n**列表 20.16：修改不可变字符串**\n\n点击此处查看代码图像\n\n* * *\n\n```csharp\nstring text = \"S5280ft\"\
  ;\nConsole.Write(\"{0} = \", text);\n\nunsafe // 需要 /unsafe 选项\n{\n  fixed (char*\
  \ pText = text)\n  {\n    char* p = pText;\n    *++p = 'm';\n    *++p = 'i';\n \
  \   *++p = 'l';\n    *++p = 'e';\n    *++p = ' ';\n    *++p = ' ';\n  }\n}\n\nConsole.WriteLine(text);\n\
  ```\n\n* * *\n\n列表 20.16 的结果出现在输出 20.2 中。\n\n**输出 20.2**\n\nS5280ft = Smile\n\n\n\
  \n\n\n解引用运算符的一个限制是无法对 `void*` 进行解引用。`void*` 数据类型表示指向未知类型的指针。由于该数据类型是未知的，因此无法通过解引用来产生一个变量。相反，要访问\
  \ `void*` 所引的数据，你必须将其转换为任何其他指针类型，然后对该类型进行解引用。\n\n你可以通过使用索引运算符而不是间接运算符（参见列表 20.17），来实现与列表\
  \ 20.16 中实现的相同的行为。\n\n**列表（LISTING） 20.17：在不安全代码中使用索引运算符修改不可变字符串**\n\n点击此处查看代码图像\n\
  \n* * *\n\n```csharp\nstring text;\n\ntext = \"S5280ft\";\n\nConsole.Write(\"{0}\
  \ = \", text);\n\nunsafe  // 需要 /unsafe 选项。\n{\n  fixed (char* pText = text)\n \
  \ {\n      pText[1] = 'm';\n      pText[2] = 'i';\n      pText[3] = 'l';\n     \
  \ pText[4] = 'e';\n      pText[5] = ' ';\n      pText[6] = ' ';\n  }\n}\nConsole.WriteLine(text);\n\
  ```\n\n* * *\n\n列表 20.17 的结果显示在输出 20.3 中。\n\n**输出（OUTPUT） 20.3**\n\nS5280ft = Smile\n\
  \n像列表 20.16 和列表 20.17 中的那些修改会导致意外的行为。例如，如果在`Console.WriteLine()` 语句之后重新将 `text`\
  \ 赋值为`\"S5280ft\"` 然后再次显示 `text`，输出仍将是 `Smile`，因为两个相等的字符串字面量的地址被优化为一个由两个变量引用的同一个字符串字面量。尽管在列表\
  \ 20.16 中的不安全代码之后有显式的赋值\n\n`text = \"S5280ft\";`\n\n但字符串赋值的内部是对已修改的 `\"S5280ft\"\
  ` 位置的地址赋值，因此 `text` 从未被设置为预期的值。\n\n### 访问引用类型类型的成员\n\n解引用指针会产生一个与指针底层类型相同的变量。然后你可以按照通常的方式使用成员访问运算符“点”（.)来访问底层类型的成员。然而，运算符优先级的规则要求\
  \ `*x.y` 意味着 `*(x.y)`，这可能不是你想要的。如果 `x` 是一个指针，正确的代码是 `(*x).y`，这是一种令人不悦的语法。为了方便访问解引用指针的成员，C#\
  \ 提了一个特殊的成员访问运算符：`x->y` 是 `(*x).y` 的简写，如列表 20.18 所示。\n\n**列表（LISTING） 20.18：直接访问引用类型的成员**\n\
  \n点击此处查看代码图像\n\n* * *\n\n```csharp\nunsafe\n{\n  Angle angle = new Angle(30, 18,\
  \ 0);\n  Angle* pAngle = &angle;\n  System.Console.WriteLine(\"{0}° {1}' {2}\\\"\
  \",\n      pAngle->Hours, pAngle->Minutes, pAngle->Seconds);\n}\n```\n\n* * *\n\n\
  列表 20.18 的结果显示在输出 20.4 中。\n\n**输出（OUTPUT） 20.4**\n\n30° 18' 0\n\n### 通过委托执行不安全代码\n\
  \n正如本章开头承诺的那样，我们将以一个完整的工作示例结束，这可能是你在 C# 中能做的最“不安全”的事情：获取一个内存块的指针，用机器码字节填充它，创建一个指向新代码的委托，并执行它。这段特定的汇编代码判断执行代码的机器是虚拟机还是真实机器。如果是虚拟机，它将输出“Inside\
  \ Matrix!”。列表 20.19 显示了如何这样做。\n\n* * *\n\n初学者主题：什么是虚拟机？\n\n**虚拟计算机**（或虚拟机），也称为**客机计算机**，是通过运行在宿主机操作系统上的软件并与宿主机硬件交互来实现虚拟化或模拟的。例如，虚拟计算机软件（如\
  \ VMware Workstation 和 Microsoft Hyper-V）可以安装在运行最新版本 Windows 的计算机上。一旦安装了软件，用户就可以在软件内部配置客机、启动并安装操作系统，就像它是一台真实的计算机而不是通过软件虚拟化的计算机一样。\n\
  \n* * *\n\n**列表（LISTING） 20.19：为不安全代码设计一个块**\n\n点击此处查看代码图像\n\n* * *\n\n```csharp\n\
  using System.Runtime.InteropServices;\n\nclass Program\n{\n  static int Main(string[]\
  \ args)\n  {\n    // redpill\n    byte[] redpill = {\n      0x0f, 0x01, 0x0d, //\
  \ asm SIDT instruction\n      0x00, 0x00, 0x00, 0x00, // placeholder for address\n\
