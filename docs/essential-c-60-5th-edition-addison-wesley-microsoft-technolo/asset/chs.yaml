  \ 5.23 和 5.24 中相同。\n\n## 构造函数\n\n现在你已经向类添加了字段并可以存储数据，你需要考虑这些数据的有效性。正如你在 Listing\
  \ 5.3 中所示，可以使用 `new` 运算符实例化对象。然而，结果是可能会创建一个数据无效的对象。正如你在 Listing 5.3 中所示（抱歉，此处原文似乎有重复，我将重新生成准确的翻译）：\n\
  \n（注：由于提供的原文文本在“Constructors”部分出现了明显的段落重复，我已根据逻辑进行了去重处理，确保翻译流畅。）\n\n现在你已经向类添加了字段并可以存储数据，你需要考虑这些数据的有效性。正如你在\
  \ Listing 5.3 中所示，可以使用 `new` 运算符实例化对象。然而，结果是可能会创建一个数据无效的对象。在特定的示例中，实例化员工后，你拥有一个姓名未初始化的\
  \ `Employee` 对象。如果你没有进行初始化，将会收到编译警告。\n\n## 构造函数\n\n为了解决这个问题，你需要在创建对象时提供指定所需数据的方法。你可以像\
  \ Listing 5.25 中演示的那样使用构造函数来实现。\n\n**列表 5.25：定义构造函数**\n\n点击此处查看代码图片\n\n```csharp\n\
  class Employee\n{\n  // Employee 构造函数\n  public Employee(string firstName, string\
  \ lastName)\n  {\n    FirstName = firstName;\n    LastName = lastName;\n  }\n\n\
  \  public string FirstName { get; set; }\n  public string LastName { get; set; }\n\
  \  public string Salary { get; set; } = \"Not Enough\";\n\n  // ...\n}\n```\n\n\
  如所示，定义构造函数需要创建一个没有返回类型的方法，方法名称与类名相同。\n\n构造函数是运行时用于初始化对象实例的方法。在这种情况下，构造函数将名字和姓作为参数，允许程序员在实例化\
  \ `Employee` 对象时指定这些名称。Listing 5.26 是调用构造函数的示例。\n\n```cpp\nclass Program\n{\n  static\
  \ void Main()\n  {\n    Employee employee;\n    employee = new Employee(\"Inigo\"\
  , \"Montoya\");\n    employee.Salary = \"Too Little\";\n    System.Console.WriteLine(\n\
  \      \"{0} {1}: {2}\",\n      employee.FirstName,\n      employee.LastName,\n\
  \      employee.Salary);\n  }\n  // ...\n}\n```\n\n注意 `new` 运算符返回了被实例化对象的类型（即使在构造函数的声明或实现中没有显式指定返回类型或返回语句）。此外，你删除了名字和姓的初始化代码，因为该初始化是在构造函数内部进行的。示例中，你没有在构造函数内部初始化\
  \ `Salary`，因此赋值薪资的代码仍然存在。\n\n\n\n\n\n开发者在同时使用声明时赋值和构造函数内部赋值时应格外小心。构造函数内部的赋值发生在字段声明时进行的任何赋值之后（例如列表\
  \ 5.5 中的 `string Salary = \"Not enough\"`）。因此，构造函数内部的赋值将覆盖在声明时赋值的任何值。这种细微之处可能会导致粗浅读者对代码产生误解，他们会假设实例化后的值是在字段声明中赋值的。因此，值得考虑一种编码风格，避免在同一个类中混合使用声明赋值和构造函数赋值。\n\
  \n## 高级主题：new 运算符的实现细节\n\n在内部，`new` 运算符与构造函数之间的交互如下：`new` 运算符从内存管理器中获取“空闲”内存，然后调用指定的构造函数，并将空内存的引用作为隐式\
  \ `this` 参数传递给构造函数。接下来，执行构造函数链的剩余部分，在构造函数之间传递引用。没有任何构造函数具有返回类型；在行为上，它们都返回 `void`。当构造函数链执行完毕后，`new`\
  \ 运算符返回内存引用，此时该引用指向已初始化形式的内存。\n\n## 默认构造函数\n\n当你显式添加一个构造函数时，你将无法在 `Main()` 内部不指定姓氏的情况下实例化\
  \ `Employee`。因此，列表 5.27 所示的代码将无法编译。\n\n### 列表 5.27：默认构造函数不再可用\n\n点击此处查看代码\n\n```csharp\n\
  class Program\n{\n  static void Main()\n  {\n      Employee employee;\n      //\
  \ 错误：没有重载，因为方法 'Employee'                                     \n      // 接收 '0'\
  \ 个参数。                                                              \n      employee\
  \ = new Employee();                                                            \
  \                                                                              \
  \                                                                              \
  \                                                                              \
  \                                                \n      // ...\n  }\n}\n```\n\n\
  如果没有显式定义的构造函数，C# 编译器会在编译期间添加一个。此构造函数不接受任何参数，因此根据定义它是默认构造函数。一旦你向类添加了显式构造函数，C# 编译器就不再提供默认构造函数。因此，在定义了\
  \ `Employee(string firstName, string lastName)` 后，编译器不会再添加默认构造函数 `Employee()`。你可以手动添加此类构造函数，但你将再次允许在不指定员工名称的情况下构造\
  \ `Employee`。\n\n没有必要依赖编译器定义的默认构造函数。程序员也可以显式定义默认构造函数——也许是一个某些字段初始化为特定值的构造函数。定义默认构造函数只需声明一个不带参数的构造函数。\n\
  \n## 对象初始化器\n\n`开始 3.0`\n\n从 C# 3.0 开始，C# 语言团队增加了功能，允许使用对象初始化器初始化对象的可访问字段和属性。对象初始化器由一组在创建对象的构造函数调用之后的大括号括的成员初始化器组成。每个成员初始化器都是将可访问字段或属性名赋值给一个值（参见列表\
  \ 5.28）。\n\n### 列表 5.28：调用对象初始化器\n\n点击此处查看代码\n\n```csharp\nclass Program\n{\n  static\
  \ void Main()\n  {\n      Employee employee1 = new Employee(\"Inigo\", \"Montoya\"\
  )\n            { Title = \"Computer Nerd\", Salary = \"Not enough\"};\n      //\
  \ ...\n  }\n}\n```\n\n注意，即使在使用对象初始化器时，相同的构造函数规则仍然适用。事实上，生成的 CIL 与在紧随构造函数调用之后的的独立语句中赋值字段或属性的结果完全相同。C#\
  \ 中成员初始化器的顺序提供了在构造函数调用后续的语句中进行属性和字段赋值的序列。\n\n通常情况下，C# 中成员初始化器的顺序提供了在构造函数调用后续的语句中进行属性和字段赋值的序列。\n\
  \n### 指南\n\n为所有属性、构造函数提供合理的默认值。例如，不要导致代码效率低效。\n\n## 高级主题：集合初始化器\n\n通过使用与对象初始化器类似的语法，C#\
  \ 3.0 引入了集合初始化器。具体而言，集合初始化器允许对集合内的项进行赋值。例如，列表 5.29 所示。\n\n### 列表 5.29：调用初始化器\n\n\
  点击此处查看代码\n\n```csharp\nclass Program\n{\n  static void Main()\n  {\n      List<Employee>\
  \ employees = new List<Employee>()\n        {\n          new Employee(\"Inigo\"\
  , \"Montoya\"),\n          new Employee(\"Kevin\", \"Bost\")\n        };\n     \
  \ // ...\n  }\n}\n```\n\n在分配新集合后，编译器生成的代码通过 `Add()` 方法实例化每个项。\n\n`结束 3.0`\n\n##\
  \ 高级主题：终结器\n\n构造函数定义了类实例化过程中发生了什么。为了定义对象销毁时发生了什么，C# 提供了终结器。与 C++ 中的析构函数不同，终结器不会在对象超出范围后立即运行。相反，终结器在对象确定为“不可到达”后的某个时间执行。具体而言，垃圾回收循环期间识别带有终结器的对象，而不是立即释放这些对象，而是将它们添加到终结队列。一个单独的线程遍历终结队列中的每个对象，并在从队列中移除并供垃圾回收器使用之前调用对象的终结器。第\
  \ 9 章 深入讨论了这一过程以及资源清理。\n\n## 构造函数重载\n\n构造函数可以重载——只要参数的数量或类型不同，你就可以有多个构造函数。例如，列表\
  \ 5.30 所示，你可以提供一个带有员工 ID 以及名次和姓氏的构造函数，甚至只需要员工 ID 的构造函数。\n\n### 列表 5.30：重载构造函数\n\n\
  点击此处查看代码\n\n```csharp\nclass Employee\n{\n  public Employee(string firstName, string\
  \ lastName)\n  {\n      FirstName = firstName;\n      LastName = lastName;\n  }\n\
  \  public Employee()\n}\n```\n\n\n\n\n\n```csharp\nint id, string firstName, string\
  \ lastName )\n\n{\n    Id = id;\n    FirstName = firstName;\n    LastName = lastName;\n\
  }\n\npublic Employee(int id)\n{\n    Id = id;\n    // Look up employee name...\n\
  \    // ...\npublic int Id { get; set; }\npublic string FirstName { get; set; }\n\
  public string LastName { get; set; }\npublic string Salary { get; set; } = \"Not\
  \ Enough\";\n// ...```\n\n这种方法允许 `Program.Main()` 能够通过仅传递员工信息或同时传递姓名和 ID 来实例化员工。在创建新员工时，您将使用同时包含姓名和\
  \ ID 的构造函数；而当从文件或数据库加载员工时，您将使用仅包含 ID 的构造函数。\n\n与方法重载一样，使用多个构造函数是为了支持使用少量参数的简单场景以及带有额外参数的复杂场景。可以考虑使用可选参数来代替重载，这样“默认”属性的默认值就可以在\
  \ API 中可见。例如，`Person(string firstName, string lastName, int? age = null)` 构造函数签名说明了，如果未指定\
  \ `Person` 的 `Age`，它将默认为 `null`。\n\n### 指南\n\n- **应当** 在构造函数参数仅用于设置属性时，对对构造函数参数（`camelCase`）和属性（`PascalCase`）使用相同的名称。\n\
  - **应当** 提供构造函数可选参数以及便利构造函数重载，以用良好的默认值初始化属性。\n- **应当** 允许以任何顺序设置属性，即使这会导致暂时的无效状态。\n\
  \n### 构造函数链：使用 this 调用另一个构造函数\n\n注意在代码列表 5.30 中，`Employee`对象的初始化代码现在重复出现在多个处，因此必须在多个处进行维护。虽然代码量很小，但有方法通过从一个构造函数调用另一个构造函数——**构造函数链**——并使用**构造函数初始化器**来消除重复。构造函数初始化器会在执行当前构造函数的实现之前确定要调用哪个构造函数（参见代码列表\
  \ 5.31）。\n\n**列表 5.31：从一个构造函数调用另一个构造函数**\n\n点击此处查看代码图像\n\n```csharp\nclass Employee\n\
  {\n  public Employee(string firstName, string lastName)\n  {\n    FirstName = firstName;\n\
  \    LastName = lastName;\n  }\n  public Employee(int id, string firstName, string\
  \ lastName )\n    : this(firstName, lastName)\n  {\n    Id = id;\n  }\n  public\
  \ Employee(int id)\n  {\n    Id = id;\n    // Look up employee...\n    // ...\n\
  \    // NOTE: 成员构造函数不能内联调用\n    // this(id, lastName);\n  }\n  public int Id { get;\
  \ private set; }\n  public string FirstName { get; set; }\n  public string LastName\
  \ { get; set; }\n  public string Salary { get; set; } = \"Not Enough\";\n// ...\n\
  }\n```\n\n要在同一个类中（针对同一个对象实例）从一个构造函数调用另一个构造函数，C# 使用冒号跟随 `this` 关键字以及调用者声明中的参数列表。在这种情况下，接收所有参数的构造函数调用接收两个参数的构造函数。通常，这种调用模式是反相反的——即参数最少的构造函数调用参数最多的构造函数，并为未的参数传递默认值。\n\
  \n### 初学者主题：集中初始化\n\n注意在代码列表 5.31 的 `Employee(int id)` 构造函数实现中，您无法调用 `this(firstName,\
  \ LastName)`，因为该构造函数不存在这些参数。为了启用所有初始化都通过一个方法完成的模式，必须创建一个单独的方法，如代码列表 5.32 所示。\n\n\
  **列表 5.32：提供初始化方法**\n\n点击此处查看代码图像\n\n```csharp\nclass Employee\n{\n  public Employee(string\
  \ firstName, string lastName)\n  {\n    int id;\n    // Generate an employee ID...\n\
  \    // ...\n    Initialize(id, firstName, lastName);\n  }\n  public Employee(int\
  \ id, string firstName, string lastName )\n  {\n    Initialize(id, firstName, lastName);\n\
  \  }\n  public Employee(int id)\n  {\n    string firstName;\n    string lastName;\n\
  \    Id = id;\n    // Look up employee data\n    // ...\n    Initialize(id, firstName,\
  \ lastName);\n  }\n  private void Initialize(int id, string firstName, string lastName)\n\
  \  {\n    Id = id;\n    FirstName = firstName;\n    LastName = lastName;\n  }\n\
  \  // ...\n}\n```\n\n在这种情况下，该方法名为 `Initialize()`，它同时接收姓名和员工 ID。注意，您仍然可以从一个构造函数调用另一个构造函数，如代码列表\
  \ 5.31 所示。\n\n### 开始 C# 3.0\n\n#### 高级主题：匿名类型\n\nC# 3.0 引入了对匿名类型的支持。这些数据类型是由编译器“即时”生成的，而不是通过显式的类定义生成的。代码列表\
  \ 5.33 展示了这样的声明。\n\n**列表 5.33：带有匿名类型的隐含局部变量**\n\n点击此处查看代码图像\n\n```csharp\nusing\
  \ System;\nclass Program\n{\n  static void Main()\n  {\n    var patent1 = new\n\
  \    {\n      Title = \"Bicals\",\n      YearOfPublication = \"784\"\n    };\n \
  \   var patent2 = new\n    {\n      Title = \"Phonograph\",\n    };\n  }\n}\n```\n\
  \n\n\n\n\n```csharp\nYearOfPublication = \"1877\"\n};\n\nvar patent3 = new {\n \
  \   patent1.Title,\n    Year = patent1.YearOfPublication\n};\nSystem.Console.WriteLine(\"\
  {0} ({1})\",\n    patent1.Title, patent1.YearOfPublication);\nSystem.Console.WriteLine(\"\
  {0} ({1})\",\n    patent2.Title, patent1.YearOfPublication);\nSystem.Console.WriteLine();\n\
  System.Console.WriteLine(patent1);\nSystem.Console.WriteLine(patent2);\nSystem.Console.WriteLine();\n\
  System.Console.WriteLine(patent3);\n```\n\n对应的输出在输出 5.8 中。\n\n**输出 5.8**\n```\n\
  Patent (1784)\nPatent (1877)\n{ Title = Patent, YearOfPublication = 1784 }\n```\n\
  \n`Listing 5.33` 展示了将匿名类型赋值给隐式类型变量（`var`）。当编译器遇到遇到匿名类型时，它会生成一个类，其属性与匿名类型中的命名值和数据类型相对应。尽管\
  \ C# 中没有该生成类型的可用名称，但它仍然是静态类型的。例如，在 `Listing 5.33` 中，`patent1.Title` 和 `patent2.YearOfPublication`\
  \ 在 `Console.WriteLine()` 语句中调用。任何调用不存在成员的尝试都将导致编译错误。即使是 Visual Studio 等 IDE 中的\
  \ IntelliSense 也可以在匿名类型上工作。\n\n在 `Listing 5.33` 中，匿名类型的成员名称通过将值赋值给名称来显式识别（参见 `patent1`\
  \ 和 `patent2` 赋值中的 `Title` 和 `YearOfPublication`）。然而，如果赋值的值是一个属性或字段，若未指定，则名称将默认为该字段或属性的名称。例如，`patent3`\
  \ 使用属性名 \"Title\" 而不是隐式名称定义。如 `Output 5.8` 所示，结果属性名由编译器确定，以匹配获取值时的属性。\n\n尽管编译器允许像如\
  \ `Listing 5.33` 所示的匿名类型声明，但你通常应该避免这类声明，甚至避免使用与 `var` 相关的隐式类型 world，除非你正在处理关联不同类型数据的\
  \ lambda 表达式和查询表达式，或者你正在投影数据以便对于特定类型数据更少。在频繁查询集合中存储的数据导致显式类型声明变得负担之前，最好像本章概述的那样显式声明类型。\n\
  \n## 结束 3.0 静态成员\n\n第 1 章中的 `HelloWorld` 示例简要提到了 `static` 关键字。本节完整地定义了 `static`\
  \ 关键字。\n\n让我们考虑一个示例。假设每个员工的 `Id` 值需要是唯一的。实现这一点的一种方法是存储一个计数器来跟踪每个员工 ID。然而，如果该值存储为实例字段，则每当实例化对象时，都会创建一个新的\
  \ `NextId` 字段，导致 `Employee` 对象的每个实例都会为该字段消耗内存。最大的问题是，每当实例化 `Employee` 对象时，之前实例化的所有\
  \ `Employee` 对象的 `NextId` 值都需要更新为下一个 ID 值。在这种情况下，你需要一个所有 `Employee` 对象实例都共享的单一字段。\n\
  \n### 语言对比：C++/Visual Basic——全局变量和函数\n\n与之前的许多语言不同，C# 没有全局变量或全局函数。C# 中的所有字段和方法都出现在类的上下文中。C#\
  \ 领域内全局字段或函数的等效物是静态字段或函数。全局变量/函数与 C# 静态字段/方法之间没有功能上的区别，静态字段/方法可以包含访问修饰符（例如 `private`），这可以限制访问并提供更好的封装性。\n\
  \n### 静态字段\n\n要定义跨多个实例可用的数据，你使用 `static` 关键字，如 `Listing 5.34` 所示。\n\n**列表 5.34：声明静态字段**\n\
  \n```csharp\nclass Employee\n{\n    public Employee(string firstName, string lastName)\n\
  \    {\n        FirstName = firstName;\n        LastName = lastName;\n        Id\
  \ = NextId;\n        NextId++;\n    }\n    // ...\n    public static int NextId;\n\
  \    public int Id { get; set; }\n    public string FirstName { get; set; }\n  \
  \  public string LastName { get; set; }\n    public string Salary { get; set; }\
  \ = \"Not Enough\";\n    // ...\n}\n```\n\n在这个示例中，`NextId` 字段包含了 `static` 修饰符，因此被称为为静态字段。与\
  \ `Id` 不同，`NextId` 的单一位置被所有 `Employee` 实例共享。在 `Employee` 构造函数内部，我们在增加 `Id` 之前立即将新\
  \ `Employee` 对象的 `Id` 赋值为 `NextId` 的值。当创建另一个 `Employee` 类时，`NextId` 将增加，新的 `Employee`\
  \ 对象的 `Id` 字段将持有不同的值。就像实例字段（非静态字段）可以在声明时初始化一样，静态字段也可以这样做，如 `Listing 5.35` 所示。\n\n\
  **列表 5.35：在声明时赋值字段**\n\n```csharp\nclass Employee\n{\n    // ...\n    public static\
  \ int NextId = 42;\n    // ...\n}\n```\n\n与实例字段不同，如果未为静态字段提供初始化，则静态字段将自动分配其默认值（`0`、`null`、`false`\
  \ 等）——等同于 `default(T)`，其中 `T` 是类型的名称。因此，即使在 C# 代码中从未显式赋值，也可以访问该静态字段。\n\n非静态字段或实例字段为它们所属的每个对象提供新的存储位置。相比之下，静态字段不属于实例，而是属于类本身。因此，你通过类名从类外部访问静态字段。考虑\
  \ `Listing 5.36` 所示的新 `Program` 类（使用 `Listing 5.34` 中的 `Employee` 类）。\n\n**列表 5.36：访问静态字段**\n\
  \n```csharp\nusing System;\nclass Program\n{\n    static void Main()\n    {\n  \
  \      Employee.NextId = 1000000;\n        Employee employee1 = new Employee(\"\
  Inigo\", \"Montoya\");\n        Employee employee2 = new Employee(\"Princess\",\
  \ \"Buttercup\");\n        Console.WriteLine(\n            \"{0} {1} ({2})\",\n\
  \            employee1.FirstName,\n            employee1.LastName,\n           \
  \ employee1.Id);\n    }\n}\n```\n\n\n\n\n\n```csharp\n\"{0} {1} ({2})\",\nemployee2.FirstName,\n\
  employee2.LastName,\nemployee2.Id);\nConsole.WriteLine(\n    $\"NextId = { Employee.NextId\
  \ }\");\n}\n\n// ...\n}\n```\n\n输出 5.9 显示了列表 5.36 的结果。\n\n**输出 5.9**\n\nInigo Montoya\
  \ (1000000)\n\nPrincess Buttercup (1000001)\n\nNextId = 1000002\n\n要设置和检索 `NextId`\
  \ 静态字段的初始值，你需要使用类名 `Employee`，而不是该类型的实例引用。唯一可以省略类名的地方是类内部（或派生类内部）。换句话说，`Employee(...)`\
  \ 构造函数不需要使用 `Employee.NextId`，因为代码出现在 `Employee` 类本身的上下文中，因此该语文中已经得到了理解。变量的作用域是程序可以使用其未限定名称引用该变量的文本；静态字段的作用域是类（以及任何派生类）的文本。\n\
  \n尽管你引用静态字段的方式与引用实例字段略有不同，但在同一个类中无法定义同名的静态字段和实例字段。误引用错误字段的可能性很高，因此 C# 设计者决定防止此类代码的出现。因此，名称重叠会在声明空间内引入冲突。\n\
  \n## 初学者主题：数据可以同时与类和对象关联\n\n类和对象都可以拥有关联的数据，模具以及从它们创建的小组件也是如此。\n\n例如，模具可以拥有对应于其创建的小组件数量、下一个组件的序列号、注入到模具中的塑料当前颜色，以及它每小时生产的小组件数量。同样，组件有自己的序列号、颜色，可能还有创建时的日期和时间。虽然组件的颜色对应于组件创建时模具中塑料的颜色，但它显然不包含对应当前模具中塑料颜色的数据，或下一个要生产的组件序列号。\n\
  \n在设计对象时，程序员应该注意恰当地声明字段和方法（是静态的还是实例的）。通常情况下，你应该将不访问任何实例数据的方法声明为静态方法，将访问实例数据的方法（在未将实例作为参数传递的情况下）声明为实例方法。静态字段存储对应类的数据，例如新实例的默认值或已创建实例的数量。实例字段存储与对象关联的数据。\n\
  \n### 静态方法\n\n与静态字段一样，你直接通过类名访问静态方法——例如通过 `Console.ReadLine()`。此外，不需要实例即可访问该方法。\n\
  \n列表 5.37 提供了另一个关于声明和调用静态方法的示例。\n\n**列表 5.37：在 DirectoryInfo 上定义静态方法**\n\n点击此处查看代码图像\n\
  \n```csharp\npublic static class DirectoryInfoExtension\n{\n    public static void\
  \ CopyTo(\n        DirectoryInfo sourceDirectory, string target,\n        SearchOption\
  \ option, string searchPattern)\n    {\n        if (target[target.Length - 1] !=\
  \ Path.DirectoryChar)\n        {\n            target += Path.DirectoryChar;\n  \
  \      }\n        if (!Directory.Exists(target))\n        {\n            Directory.CreateDirectory(target);\n\
  \        }\n        for (int i = 0; i < searchPattern.Length; i++) // 注意：原文中的逻辑似乎是特定的\n\
  \        {\n            foreach (string file in\n                Directory.GetFiles(sourceDirectory.FullName,\
  \ searchPattern))\n            {\n                File.Copy(file,\n            \
  \    target + Path.GetFileName(file), true);\n            }\n        }\n       \
  \ // 拷贝子目录（递归地）\n        if (option == SearchOption.AllDirectories)\n        {\n\
  \            foreach(string element in\n                Directory.GetDirectories(\n\
  \                sourceDirectory.FullName))\n            {\n                Copy(element,\n\
  \                target + Path.GetFileName(element),\n                searchPattern);\n\
  \            }\n        }\n    }\n}\n\n// ...\nDirectoryInfo directory = new DirectoryInfo(\"\
  .\\\\Source\");\ndirectory.MoveTo(\".\\\\Root\");\nDirectoryInfoExtension.CopyTo(\n\
  \    directory, \".\\\\Target\",\n    SearchOption.AllDirectories, \"*\");\n// ...\n\
  ```\n\n\n\n\n\n如果 `NextId` 的赋值同时发生在静态构造函数和声明中，那么当初始化结束时其值将是不而易见的。C# 编译器会生成 CIL，其中声明处的赋值会被移动到静态构造函数中的第一条语句。因此，`NextId`\
  \ 将包含由 `randomGenerator.Next(101, 999)` 返回的值，而不是在 `NextId` 声明期间赋值的值。因此，静态构造函数中的赋值将优先于作为字段声明一部分赋值，这与实例字段的情况一致。请注意，不支持定义静态析构器。\n\
  \n务必不要在静态构造函数中抛出异常，因为会导致该类型在应用程序的剩余生命周期内无法使用。\n\n从技术上讲，应用程序域（application domain）的生命周期是\
  \ CLR 对操作系统的虚拟等同。\n\n## 高级主题：在声明期间优先使用静态初始化\n\n静态构造函数在访问类的任何成员（无论是静态字段、另一个静态成员还是实例构造函数）之前执行。为了支持这种做法，编译器会在所有类型的静态成员和构造函数中注入一个检查，以确保静态构造函数首先运行。\n\
  \n如果没有静态构造函数，编译器会将所有静态成员初始化为它们的默认值，并避免添加静态构造函数检查。结果是，静态赋值初始化会在访问任何静态字段之前调用，但并不一定在调用所有静态方法或任何实例构造函数之前。如果静态成员的初始化开销很大，并且在访问静态字段之前不需要，那么这可能会提供性能改进。由于由于原因，你应该考虑内联初始化静态字段，而不是使用静态构造函数，或者在声明时对其进行初始化。\n\
  \n### 指南\n\n**考虑**内联初始化静态字段，而不是显式地使用静态构造函数或声明赋值值。\n\n### 静态属性\n\n`Begin 2.0`\n\n\
  你也可以将属性声明为静态。例如，Listing 5.39 将下一个 ID 的数据封装在一个属性中。\n\n**列表 5.39：声明静态属性**\n\n点击此处查看代码图像\n\
  \n```csharp\nclass Employee\n{\n  // ...\n\n  public static int NextId\n  {\n  \
  \    get\n      {\n        return _NextId;\n      }\n      private set\n      {\n\
  \        _NextId = value;\n      }\n  }\n  public static int _NextId = 42;\n  //\
  \ ...\n}\n```\n\n使用静态属性几乎比公共静态字段更好，因为公共静态字段可以从任何地方调用，而静态属性至少提供某种程度的封装性。\n\n`Begin\
  \ 6.0`\n\n在 C# 6.0 中，整个 `NextId` 的实现——包括一个不可访问的备用字段——可以简化为带有初始化器的自动实现属性：\n\n点击此处查看代码图像\n\
  \n```csharp\npublic static int NextId { get; private set; } = 42;\n```\n\n`End 6.0`\n\
  \n### 静态类\n\n某些类不包含任何实例字段。例如，考虑 `Math` 类，它具有对应于数学操作 `Max()` 和 `Min()` 的函数，如 Listing\
  \ 5.40 所示。\n\n**列表 5.40：声明静态类**\n\n点击此处查看代码图像\n\n```csharp\n// 静态类在 C# 2.0 中引入\n\
  public static class SimpleMath\n{\n  // params 允许参数数量发生变化。\n  public static int\
  \ Max(params int[] numbers)\n  {\n    // 检查 numbers 中至少有一个项。\n    if(numbers.Length\
  \ == 0)\n    {\n      throw new ArgumentException(\"numbers cannot be empty\", \"\
  numbers\");\n    }\n    int result;\n    result = numbers[0];\n    foreach (int\
  \ number in numbers)\n    {\n      if(number > result)\n      {\n        result\
  \ = number;\n      }\n    }\n    return result;\n  }\n  // params 允许参数数量发生变化。\n\
  \  public static int Min(params int[] numbers)\n  {\n    // 检查 numbers 中至少有一个项。\n\
  \    if(numbers.Length == 0)\n    {\n      throw new ArgumentException(\"numbers\
  \ cannot be empty\", \"numbers\");\n    }\n    int result;\n    result = numbers[0];\n\
  \    foreach (int number in numbers)\n    {\n      if(number < result)\n      {\n\
  \        result = number;\n      }\n    }\n    return result;\n  }\n}\n\npublic\
  \ class Program\n{\n  public static void Main(string[] args)\n  {\n    int[] numbers\
  \ = new int[args.Length];\n    for (int count = 0; count < args.Length; count++)\n\
  \    {\n      numbers[count] = args[count].Length;\n    }\n    Console.WriteLine(\n\
  \      $\"Longest argument length = {SimpleMath.Max(numbers)}\");\n    Console.WriteLine(\n\
  \      $\"Shortest argument length = {SimpleMath.Min(numbers)}\");\n  }\n}\n```\n\
  \n`End 2.0`\n\n该类不包含任何实例字段（或方法），因此创建这样的类是没有意义的。因此，该类被标记为 `static` 关键字。类上的 `static`\
  \ 关键字提供了两个功能：首先，它防止程序员编写实例化 `SimpleMath` 类的代码；其次，它防止在类内部声明任何实例字段或方法。由于类无法被实例化，实例成员将变得意义。之前列表中的\
  \ `Program` 类是静态类的另一个良好候选，因为它也只包含静态成员。\n\n静态类的另一个区别特征是 C# 编译器会在 CIL 中自动将其标记为 `abstract`\
  \ 和 `sealed`。这该类指定为**不可扩展的；**换句话说，没有类可以从此类派生，甚至无法实例化它。\n\n`Begin 6.0`\n\n`Begin\
  \ 3.0`\n\n在前一章中，我们看到 `using static` 指令可以用于 `SimpleMath` 这样的静态类。例如，在 Listing 5.40\
  \ 顶部添加 `using static SimpleMath;` 声明将允许你在不带 `SimpleMath` 前缀的情况下调用 `Max`：\n\n点击此处查看代码图像\n\
  \n```csharp\nConsole.WriteLine(\n  $\"Longest argument length = {Max(numbers)}\"\
  );\n```\n\n`End 6.0`\n\n## 扩展方法\n\n考虑 `System.IO.DirectoryInfo` 类，它用于操作文件系统目录。该类支持列出文件和子目录（`DirectoryInfo.GetFiles()`）的功能，以及移动目录的能力（`DirectoryInfo.Move()`）。它不直接支持的一个特性是复制功能。如果你需要这样的方法，你必须手动实现它，如之前在\
  \ Listing 5.37 中所示。\n\n\n\n\n\n`DirectoryInfoExtension.Copy()` 方法是一个标准的静态方法声明。然而，请注意调用此\
  \ `Copy()` 方法与调用 `DirectoryInfo.Move()` 方法不同。这非常遗憾。理想情况下，我们希望为 `DirectoryInfo` 添加一个方法，这样在给定一个实例时，我们就可以像实例方法一样调用\
  \ `Copy()`——`directory.Copy()`。\n\nC# 3.0 通过**扩展方法**（extension methods）模拟了在不同类上创建实例方法的过程。要实现这一点，我们仅需更改静态方法的签名，使第一个参数（即我们正在扩展的数据类型）以\
  \ `this` 关键字为前缀（参见列表 5.41）。\n\n### 列表 5.41：DirectoryInfo 的静态 Copy 方法\n\n点击此处查看代码图像\n\
  \n```csharp\npublic static class DirectoryInfoExtension\n{\n  public static void\
  \ CopyTo(\n      this DirectoryInfo sourceDirectory, string target,\n      SearchOption\
  \ option, string searchPattern)\n  {\n      // ...\n  }\n}\n```\n\n```csharp\n//\
  \ ...\nDirectoryInfo directory = new DirectoryInfo(\".\\\\Source\");\ndirectory.CopyTo(\"\
  .\\\\Target\", SearchOption.AllDirectories, \"*\");\n// ...\n```\n\n通过对 C# 3.0 的这一简单改进，现在可以为任何类添加“实例方法”，包括不在同一程序集中的类。然而，生成的\
  \ CIL 代码与编译器在将扩展方法作为普通静态方法调用时所创建的代码是完全相同的。\n\n扩展方法的要求如下：\n\n- 第一个参数对应于方法所扩展或在其上操作的类型。\n\
  - 要指定扩展方法，请在被扩展的类型前加上 `this` 修饰符。\n- 要作为扩展方法访问该方法，请通过 `using` 指令导入扩展类型的命名空间（或将扩展类放置在与调用代码相同的命名空间中）。\n\
  \n如果扩展方法的签名与扩展类型上已有的签名匹配（例如，如果 `DirectoryInfo` 上已经存在 `CopyTo()`），则除非作为普通静态方法调用，否则扩展方法将永远被调用。\n\
  \n请注意，通过继承来特化类型（在第 6 章中进行了详细介绍）优于使用扩展方法。扩展方法没有提供整洁的版本机制，因为在扩展类型上添加匹配的签名将优先于扩展方法，且不会发出更改警告。对于你无法控制源代码的扩展类来说，这种行为的细微之处会更加明显。另一个微不足道的一点是，虽然开发环境\
  \ IDE 支持扩展方法的智能提示（IntelliSense），但仅通过调用代码并不能一眼看出某个方法是扩展方法。\n\n通常情况下，你应该谨慎使用扩展方法。例如，不要在\
  \ `object` 类型上定义它们。第 6 章 讨论了如何结合接口使用扩展方法。\n\n### 指南\n\n**避免**轻率地定义扩展方法，特别是对于你不拥有的类型。\n\
  \n`C# 3.0 `\n\n### 封装数据\n\n除了在本章早期介绍的属性和访问修饰符外，还有其他几种封装类内数据的特殊方法。例如，还有两种字段修饰符。第一个是\
  \ `const` 修饰符，你在声明局部变量时已经遇到过它。第二个是字段被定义为只读的能力。\n\n#### const\n\n与 `const` 值一样，`const`\
  \ 字段包含一个编译时确定的值，该值在运行时无法更改。像 pi 这样的值是常量字段声明的良好候选。列表 5.42 显示了声明 `const` 字段的示例。\n\n\
  ### 列表 5.42：声明常量字段\n\n点击此处查看代码图像\n\n```csharp\nclass ConvertUnits\n{\n  public const\
  \ float CentimetersPerInch = 2.54F;\n  public const int CupsPerGallon = 16;\n  //\
  \ ...\n}\n```\n\n常量字段自动是静态的，因为每个对象实例不需要新的字段实例。显式将常量字段声明为 `static` 将导致编译错误。此外，常量字段通常只为具有字面量值的类型（例如\
  \ `string`、`int` 和 `double`）声明。如 `Program` 或 `System.Guid` 等类型不能用于常量字段。\n\n`public`\
  \ 常量表达式中所使用的值类型在时间上是永久的，这一点非常重要。像 pi、阿伏伽德罗数和地球周都是很好的例子。然而，可能随时间变化的值则不是。构建号、人口数和汇率都是常量的糟糕选择。\n\
  \n### 指南\n\n- **要**使用常量字段处理永远不会改变的值。\n- **不要**使用常量字段处理会随时间变化的值。\n\n#### 高级主题：公共常量应该是永久值\n\
  \n公共可访问的常量应该是永久的，因为更改常量的值并不一定会在使用它的程序集中生效。如果一个程序集引用了另一个程序集中的常量，常量的值将直接编译到引用的程序集中。因此，如果被引用程序集中的值被更改但引用的程序集没有重新编译，引用的程序集将使用原始值。可能随时间变化的值应指定为\
  \ `readonly`。\n\n#### readonly\n\n与 `const` 不同，`readonly` 修饰符仅用于字段（不用于局部变量）。它声明字段值只允许从构造函数或初始化器进行修改。列表\
  \ 5.43 展示了如何声明只读字段。\n\n### 列表 5.43：将字段声明为 readonly\n\n点击此处查看代码图像\n\n```csharp\n\
  class Employee\n{\n  public Employee(int id)\n  {\n    _Id = id;\n  }\n  // ...\n\
  \  public readonly int _Id;\n\n  public int Id\n  {\n    get { return _Id; }\n \
  \ }\n\n  // 错误：只读字段不能被赋值（构造函数或变量初始化器除外）\n  // public void SetId(int id) =>\n  //\
  \ _Id = id;\n\n  // ...\n}\n```\n\n与常量字段不同，用 `readonly` 修饰的字段可以在不同实例之间变化。事实上，只读字段的值可以在构造函数内更改。此外，只读字段可以是实例字段，也可以是静态字段。另一个关键区别是，你可以在执行运行时给只读字段赋值，而不仅仅是在编译时赋值。鉴于只读字段必须在构造函数或初始化器中设置，此类字段是编译器要求从相应属性之外访问的唯一情况。除了这一个例外，你应该避免在包装属性的任何地方之外访问字段。\n\
  \n`readonly` 修饰的字段相对于 `const` 字段的另一个重要特性是，只读字段不受具有字面量类型的限制。例如，可以声明一个 `readonly System.Guid`\
  \ 实例字段：\n\n点击此处查看代码图像\n\n```csharp\npublic static readonly Guid ComIUnknownGuid\
  \ =\n    new Guid(\"00000000-0000-0000-C000-000000000046\");\n```\n\n然而，使用常量无法实现这一点，因为没有\
  \ Guid 的 C# 字面量表示。\n\n\n\n\n\n根据“不应从包装属性的外部访问字段”的指南，在 C# 6.0 世界中编程的开发者会发现，几乎不需要使用\
  \ `readonly` 修饰符。相反，最好是使用只读自动实现属性，正如本章早些讨论的那样。\n\n请参考列表 5.44 以查看另一个只读示例。\n\n**列表\
  \ 5.44：声明一个只读自动实现属性**\n\n点击此处此处查看代码图像\n\n* * *\n\n```csharp\nclass TicTacToeBoard\n\
  {\n   // 将两个玩家的移动都设为 false（空白）。\n   //     |   |   |\n   // ---+---+---\n   // \
  \    |   |   |\n   // ---+---+---\n   //     |   |   |\n  public bool[,,] Cells\
  \ { get; } = new bool[2, 3, 3];\n\n   // 错误：属性 Cells 不能赋值，\n   // 因为它是只读的\n   public\
  \ void SetCells(bool[,,] value) =>\n            Cells = new bool[2, 3, 3];\n\n \
  \  // ...\n}\n```\n\n* * *\n\n无论是使用 C# 6.0 的只读自动实现属性还是字段的 `readonly` 修饰符，提供数组引用的不可变性都是非常有用的防御性编码技术。它确保了数组实例保持不变，同时允许数组内的元素发生变化。如果没有只读约束，很容易错误地将新数组分配给成员，从而丢弃现有的数组，而不是更新单个数组元素。换句话说，对数组使用只读方法并冻结数组的内容。相反，它冻结的是数组实例（因此是数组的元素个数），因为无法将值重新分配给新实例。数组的元素仍然是可写的。\n\
  \n* * *\n\n### 指南\n\n- **应该**在 C# 6.0（或更高版本）中，优先考虑使用只读自动实现属性，而不是定义只读字段。\n- **应该**在\
  \ C# 6.0 之前，对于预定义的对象实例使用 `public static readonly` 修饰的字段。\n- 如果需要版本 API 兼容性，**避免**将\
  \ C# 6.0 之前的公共 `readonly` 修饰字段更改为 C# 6.0（或更高版本）中的只读自动实现属性。\n\n* * *\n\n`结束 6.0`\n\
  \n## 嵌套类\n\n除了在类内部定义方法和字段外，可以在类内部定义另一个类。此类类被称为**嵌套类**。当一个类在包含它的类的语境之外几乎没有意义时，你就使用嵌套类。\n\
  \n考虑一个处理程序命令行选项的类。此类类通常每个程序都是独有的，因此没有理由让包含 `Main()` 的类的外部能够访问 `CommandLine` 类。列表\
  \ 5.45\n\n* * *\n\n```csharp\n// CommandLine 嵌套在 Program 内部\nclass Program\n{\n\
  \   // 定义一个处理命令行的嵌套类。\n   private class CommandLine\n   {\n      public CommandLine(string[]\
  \ arguments)\n      {\n         for(int argumentCounter=0; argumentCounter<arguments.Length;\
  \ argumentCounter++)\n         {\n            switch (argumentCounter)\n       \
  \     {\n               case 0:\n                  Action = arguments[0].ToLower();\n\
  \                  break;\n               case 1:\n                  Id = arguments[1];\n\
  \                  break;\n               case 2:\n                  FirstName =\
  \ arguments[2];\n                  break;\n               case 3:\n            \
  \      LastName = arguments[3];\n                  break;\n            }\n     \
  \    }\n      }\n   }\n   public string Action;\n   public string Id;\n   public\
  \ string FirstName;\n   public string LastName;\n}\n\nstatic void Main(string[]\
  \ args)\n{\n   CommandLine commandLine = new CommandLine(args);\n   switch (commandLine.Action)\n\
  \   {\n      case \"new\":\n         Console.WriteLine(\"Creating new employee\"\
  );\n         break;\n      case \"update\":\n         Console.WriteLine(\"Updating\
  \ existing employee\");\n         break;\n      case \"delete\":\n         Console.WriteLine(\"\
  Removing existing employee\");\n         break;\n      default:\n         Console.WriteLine(\"\
  Unknown command\");\n         break;\n   }\n}\n```\n\n* * *\n\n此示例中的嵌套类是 `Program.CommandLine`。与所有类成员一样，`private`\
  \ 定义了该类预期的访问权限。\n\n嵌套类内部的 `this` 成员指的是嵌套类的实例，而不是包含类。嵌套类访问包含类的一种方法是显式传递包含类的实例，例如通过构造函数或方法参数。\n\
  \n嵌套类的另一个有趣特性是，它们可以访问包含类上的任何成员，包括私有成员。反之则不然：包含类是不可能访问嵌套类的私有成员的。\n\n嵌套类很罕见。如果嵌套类可能在包含它的类型之外被引用，则不应该定义它们。此外，对\
  \ `public` 嵌套类要保持怀疑态度；它们可能意味着代码质量较差，可能会令人困惑且难以发现。\n\n* * *\n\n### 指南\n\n- **避免**公开的嵌套类型。例外是该类型的声明不太可能，或者属于某种高级定制场景。\n\
  \n* * *\n\n### 语言对比：Java——内部类\n\nJava 不仅包含嵌套类的概念，还有内部类（inner class）的概念。内部类对应于与包含类实例关联的对象，而不仅仅是语法上的关系。在\
  \ C# 中，你可以通过在外部类中包含一个嵌套类型的实例字段来实现相同的结构。\n\n\n\n\n\n点击此处查看代码图像\n\n* * *\n\n```cs\n\
  // File: Program1.cs\n\npartial class Program\n{\n\n}\n```\n\n* * *\n\n```cs\n//\
  \ File: Program2.cs\n\npartial class Program\n\n{\n\n}\n```\n\n* * *\n\n在这种情况下，`Program`\
  \ 的每个部分都被放置在单独的文件，如注释所示。\n\n除了与代码生成器配合使用，部分类（partial classes）的另一个常见用途是将任何嵌套类放置在它们自己的文件中。这符合将每个类定义放置在单独文件中的编码规范。例如，列表\
  \ 5.47 将 `Program.CommandLine` 类置于与核心 `Program` 成员不同的文件中。\n\n**列表 5.47：在单独的部分部分类中定义嵌套类**\n\
  \n点击此处查看代码图像\n\n* * *\n\n```cs\n// File: Program.cs\n\npartial class Program\n{\n\
  \  static void Main(string[] args)\n  {\n    CommandLine commandLine = new CommandLine(args);\n\
  \    switch (commandLine.Action)\n    {\n      // ...\n    }\n  }\n}\n```\n\n* *\
  \ *\n\n```cs\n// File: Program+CommandLine.cs\n\npartial class Program\n{\n  //\
  \ 为处理命令行定义一个嵌套类。\n  private class CommandLine\n  {\n    // ...\n  }\n}\n```\n\n\
  * * *\n\n部分类不允许用于扩展已编译的类或其他程序集中的类。它们仅仅是在同一个程序集内的多个文件中拆分类实现的一种手段。\n\n`结束 2.0`\n\n\
  ### 部分方法\n\n`开始 3.0`\n\n从 C# 3.0 开始，语言设计人员增加了部分方法（partial methods）的概念，扩展了 C# 2.0\
  \ 的部分类概念。部分方法只允许在部分类内部，与部分类一样，其主要目的是适应代码生成。\n\n考虑有一个代码生成工具，它根据数据库中的 `Person` 表为\
  \ `Person` 类生成 `Person.Designer.cs` 文件。该工具检查表并为表的每一列创建属性。然而，问题在于，该工具通常无法生成任何可能所需的验证逻辑，因为这些逻辑是基于未嵌入数据库表定义的业务规则的。为了克服这一困难，`Person`\
  \ 类的开发者需要添加验证逻辑。直接修改 `Person.Designer.cs` 是不可取的，因为如果该文件被重新生成（例如为了适应数据库中的额外列），更改将会丢失。相反，需要将\
  \ `Person` 的代码结构分离出来，使得生成的代码出现在一个文件中，而自定义代码（带有业务规则）被放在一个单独的文件中，不受任何重新生成的影响。正如我们在上一节中看到的，部分类非常适合将一个类拆分到多个文件的任务，但它们并不总是足够的。在许多情况下，我们还需要**部分方法**。\n\
  \n部分方法允许声明一个方法而不需要提供实现。然而，当包含可选的实现时，它可以位于其中一个同类的部分类定义中，可能在单独的文件中。列表 5.48 显示了 `Person`\
  \ 类的部分方法声明和实现。\n\n**列表 5.48：在单独的部分部分类中定义嵌套类**\n\n点击此处查看代码图像\n\n* * *\n\n```cs\n\
  // File: Person.Designer.cs\n\npublic partial class Person\n{\n  #region Extensibility\
  \ Method Definitions\n  partial void OnLastNameChanging(string value);         \
  \                 \n  partial void OnFirstNameChanging(string value);          \
  \                \n  #endregion\n  // ...\n  public System.Guid PersonId\n  {\n\
  \    // ...\n  }\n  private System.Guid _PersonId;\n  // ...\n  public string LastName\n\
  \  {\n    get\n    {\n      return _LastName;\n    }\n    set\n    {\n      if ((_LastName\
  \ != value))\n      {\n        OnLastNameChanging(value);                      \
  \               \n      }\n      _LastName = value;\n    }\n  }\n  private string\
  \ _LastName;\n  // ...\n  public string FirstName\n  {\n    get\n    {\n      return\
  \ _FirstName;\n    }\n    set\n    {\n      if ((_FirstName != value))\n      {\n\
  \        OnFirstNameChanging(value);\n      }\n      _FirstName = value;\n    }\n\
  \  }\n  private string _FirstName;\n}\n```\n\n\n\n\n继承形成了一种“是一种”的关系。派生类型总是隐式地属于基类类型。就像硬盘是存储设备的一种一样，任何其他派生自存储设备类型的类型也是存储设备的一种。请注意，反过来并不一定成立：存储设备并不一定是硬盘。\n\
  \n***\n\n### 注意事项\n代码中的继承用于定义两个类之间“是一种”的关系，其中派生类是基类的特化版本。\n\n***\n\n* * *\n\n***\n\
  \n### 派生\n人们通常想要扩展给定的类型以添加功能，例如行为和数据。继承的目的正是为了这一点。给定一个 `Person` 类，你创建了一个 `Employee`\
  \ 类，该类额外包含了 `EmployeeId` 和 `Department` 属性。反向方法也可以适用。例如，给定个人数字助理设备（PDA）中的一个 `Contact`\
  \ 类，你可能决定添加日历支持。为了实现这一目标，你创建了一个 `Appointment` 类。然而，你并没有重新定义两个类共有的方法和属性，而是选择对 `Contact`\
  \ 类进行`refactor`。具体来说，你可以将 `Contact` 上的公共方法和属性移动到一个名为 `PdaItem` 的基类中，`Contact` 和\
  \ `Appointment` 都派生自该基类，如图 6.1 所示。\n\n![Image](img/06fig01.jpg)\n\n**图 6.1：重构为基类**\n\
  \n此例中的共同项目有 `Created`、`LastUpdated`、`Name`、`ObjectKey` 等。通过派生，基类 `PdaItem` 上定义的方法可以所有派生自\
  \ `PdaItem` 的类访问。\n\n在声明派生类时，在类标识符后跟随冒号，然后是基类，如列表 6.1 所示。\n\n**列表 6.1：从一个类派生出另一个类**\n\
  \n点击此处查看代码图像\n\n***\n\n```csharp\npublic class PdaItem\n{\n  public string Name\
  \ { get; set; }\n  public DateTime LastUpdated { get; set; }\n}\n```\n\n***\n\n\
  ```csharp\n// 将 Contact 类定义为继承 PdaItem 类\npublic class Contact : PdaItem\n{\n  public\
  \ string Address { get; set; }\n  public string Phone { get; set; }\n}\n```\n\n\
  ***\n\n列表 6.2 展示了如何访问 `Contact` 中定义的属性。\n\n**列表 6.2：使用继承的方法**\n\n点击此处查看代码图像\n\n\
  ***\n\n```csharp\npublic class Program\n{\n  public static void Main()\n  {\n  \
  \    Contact contact = new Contact();\n      contact.Name = \"Inigo Montoya\";\n\
  \      // ...\n  }\n}\n```\n\n***\n\n尽管 `Contact` 并不直接拥有名为 `Name` 的属性，但 `Contact`\
  \ 的所有实例仍然可以访问来自 `PdaItem` 的 `Name` 属性，并像它是 `Contact` 的一部分那样使用它。此外，任何派生自 `Contact`\
  \ 的额外类也将继承 `PdaItem` 的成员，或者 `PdaItem` 派生自的任何类的成员。继承链没有实际限制，每个派生类都拥有其基类继承链中的所有成员（参见列表\
  \ 6.3）。换句话说，虽然 `Customer` 没有直接派生自 `PdaItem`，但它仍然继承 `PdaItem` 的成员。\n\n***\n\n###\
  \ 注意事项\n通过继承，基类的每个成员也会出现在派生类的链中。\n\n***\n\n**列表 6.3：类相互派生以形成继承链**\n\n点击此处查看代码图像\n\
  \n***\n\n```csharp\npublic class PdaItem : object\n{\n  // ...\n}\n\npublic class\
  \ Appointment : PdaItem\n{\n  // ...\n}\n\npublic class Contact : PdaItem\n{\n \
  \ // ...\n}\n\npublic class Customer : Contact\n{\n  // ...\n}\n```\n\n***\n\n在列表\
  \ 6.3 中，显式显示 `PdaItem` 派生自 `object`。\n\n***\n\n### 基类与派生类型之间的强制类型转换\n在列表 6.3 中，显式显示\
  \ `PdaItem` 派生自 `object`。\n\n***\n\n### 注意事项\n除非指定替代类，否则所有类都派生自 `object`。如列表 6.4\
  \ 所示，只要目标类型派生自源类型，C# 编译器就允许这种转换。\n\n***\n\n### 列表 6.4：使用基类型\n点击此处查看代码图像\n\n```csharp\n\
  public class Program\n{\n  public static void Main()\n  {\n      Contact contact\
  \ = new Contact();\n      contact.Name = \"Inigo Montoya\";\n      // ...\n  }\n\
  }\n```\n\n\n\n\n类型之间的转换不仅限于单个继承链中的类型。在无关的类型之间进行转换也是可能的，例如从 `Address` 转换为 `string`，反之亦然。关键在于在两个类型之间提供了转换操作符。C#\
  \ 允许类型包含显式或隐式转换操作符。如果操作可能失败（例如从 `long` 强制转换为 `int`），开发者应该选择定义一个显式转换操作符。这会提醒执行转换的开发者，只有在确定转换会成功时才进行转换，否则则要做好在转换失败时捕获异常的准备。当转换是有损失的时，也应该使用显式转换而非隐式转换。例如，从\
  \ `float` 转换为 `int` 会截断小数部分，而返回强制转换（从 `int` 回到 `float`）无法恢复这些部分。\n\n列表 6.5 显示了隐式转换操作符签名的示例。\n\
  \n**列表 6.5：定义转换运算符**\n\n点击此处查看代码图像\n\n* * *\n\n```cs\nclass GPSCoordinates\n{\n\
  \  // ...\n\n  public static implicit operator UTMCoordinates(\n      GPSCoordinates\
  \ coordinates)\n  {\n      // ...\n  }\n}\n```\n\n* * *\n\n在这种情况下，你有一个从 `GPSCoordinates`\
  \ 到 `UTMCoordinates` 的隐式转换。可以编写类似的转换来反转这一过程。注意，可以通过将 `implicit` 替换为 `explicit` 来编写显式转换。\n\
  \n* * *\n\n### private 访问修饰符\n\n基类的所有成员（构造函数和析构函数除外都被派生类继承。然而，仅仅因为一个成员被继承，并不意味着它可以是可以的。例如，在列表\
  \ 6.6 中，`private` 字段 `_Name` 在 `Contact` 中是不可用的，因为私有成员仅在声明它们的类型内部代码位置可访问。\n\n**列表\
  \ 6.6：私有成员被继承但不可访问**\n\n点击此处查看代码图像\n\n* * *\n\n```cs\npublic class PdaItem\n{\n\
  \  private string _Name;\n  // ...\n}\n\npublic class Contact : PdaItem\n{\n  //\
  \ ...\n}\n\npublic class Program\n{\n  public static void Main()\n  {\n      Contact\
  \ contact = new Contact();\n      // ERROR:  'PdaItem. _Name' is inaccessible  \
  \           \n      // due to its protection level                             \
  \ \n      // contact._Name = \"Inigo Montoya\";                          \n  }\n\
  }\n```\n\n* * *\n\n作为尊重封装原则的一部分，派生类无法访问声明为 `private` 的成员。这迫使基类开发者显式地选择派生类是否获得对某个成员的访问权限。在这种情况下，基类定义了一个\
  \ API，其中 `_Name` 只能通过 `Name` 属性进行更改。这样，如果添加了验证逻辑，派生类将自动获得验证益处，因为它从一开始就无法直接访问 `_Name`。1。特殊情况是派生类同时也是基类的嵌套类除外。\n\
  \n* * *\n\n**注意**\n派生类无法访问基类中声明为 `private` 的成员。\n\n* * *\n\n### protected 访问修饰符\n\
  \n然而，封装的粒度比 de `public` 或 `private` 更精细。可以在基类中定义只有派生类才能访问的成员。例如，考虑列表 6.7 所示的 `ObjectKey`\
  \ 属性。\n\n**列表 6.7：protected 成员仅可从派生类访问**\n\n点击此处查看代码图像\n\n* * *\n\n```cs\npublic\
  \ class Program\n{\n  public static void Main()\n  {\n      Contact contact = new\
  \ Contact();\n      contact.Name = \"Inigo Montoya\";\n      // ERROR:  'PdaItem.ObjectKey'\
  \ is inaccessible     \n      // due to its protection level  \n      // contact.ObjectKey\
  \ = Guid.NewGuid();          \n  }\n}\n\npublic class PdaItem\n{\n  protected Guid\
  \ ObjectKey { get; set; }\n  // ...\n}\n\npublic class Contact : PdaItem\n{\n  void\
  \ Save()\n  {\n    // 使用 ObjectKey.dat 实例化 FileStream\n    // 作为文件名。\n    FileStream\
  \ stream = System.IO.File.OpenWrite(ObjectKey + \".dat\");\n  }\n\n  void Load(PdaItem\
  \ pdaItem)\n  {\n    // ERROR:  'pdaItem.ObjectKey' is inaccessible     \n    //\
  \ due to its protection level  \n    // pdaItem.ObjectKey = ...;          \n   \
  \ Contact contact = pdaItem as Contact;\n    if(contact != null)\n    {\n      contact.ObjectKey\
  \ = ...;\n    }\n    // ...\n  }\n}\n```\n\n* * *\n\n`ObjectKey` 使用 `protected`\
  \ 访问修饰符定义。结果是，它在 `PdaItem` 外部只有通过派自 `PdaItem` 的类才能访问。`Contact` 派自 `PdaItem`，因此 `Contact`\
  \ 的所有成员都可以访问 `ObjectKey`。相比之下，`Program` 没有派自 `PdaItem`，因此在 `Program` 内部使用 `ObjectKey`\
  \ 属性会导致编译错误。\n\n* * *\n\n**注意**\n派生类无法访问基类中声明为 `private` 的成员。\n\n\n\n\n\n对于少数需要多继承类结构的稀有情况，一种解决方案是使用`aggregation`（聚合）而不是让一个类继承自另一个类，即由一个类包含另一个类的实例。图\
  \ 6.2 显示了这种类结构的示例。当关联关系定义了包含对象的核心部分时，就会发生聚合。对于多继承，这涉及选择一个类作为主基类（`PdaItem`），并从其派生出一个新类（`Contact`）。第二个所需的基类（`Person`）作为字段添加到派生类（`Contact`）中。接下来，字段（`Person`）上的非私有成员在派生类（`Contact`）上被重新定义，然后将调用委托给字段（`Person`）。由于方法被重新声明，会发生一些代码重复；但这种重复是极少数的，因为真实的方法体仅在聚合类（`Person`）中实现。\n\
  \n![Image](img/06fig02.jpg)\n\n**图 6.2：使用聚合模拟多继承**\n\n在图 6.2 中，`Contact`包含一个名为`InternalPerson`的私有属性，它被绘制为指向`Person`类的关联。`Contact`还包含`FirstName`和`LastName`属性，但没有相应的字段。相反，`FirstName`和`LastName`属性简单地将它们的调用分别委托给`InternalPerson.FirstName`和`InternalPerson.LastName`。列表\
  \ 6.8 显示了结果代码。\n\n**列表 6.8：使用聚合绕过单继承**\n\n点击此处查看代码图像\n\n```csharp\npublic class\
  \ PdaItem\n{\n  // ...\n}\n\npublic class Person\n{\n  // ...\n}\n\npublic class\
  \ Contact : PdaItem\n{\n  private Person InternalPerson { get; set; }\n\n  public\
  \ string FirstName\n  {\n      get { return InternalPerson.FirstName; }\n      set\
  \ { InternalPerson.FirstName = value; }\n  }\n\n  public string LastName\n  {\n\
  \      get { return InternalPerson.LastName; }\n      set { InternalPerson.LastName\
  \ = value; }\n  }\n  // ...\n}\n```\n\n除了委托带来的复杂性外，另一个缺点是，任何添加到字段类（`Person`）中的方法都需要手动添加到派生类（`Contact`）中；否则，`Contact`将不会暴露新增的功能。\n\
  \n### 密封类 (Sealed Classes)\n\n正确设计一个他人可以通过派生扩展的类是一项复杂的任务，需要通过示例进行测试以验证派生能够成功工作。列表\
  \ 6.9 显示了如何将类标记为`sealed`（密封）来避免意外的派生场景和问题。\n\n**列表 6.9：使用密封类防止派生**\n\n点击此处查看代码图像\n\
  \n```csharp\npublic sealed class CommandLineParser\n{\n  // ...\n}\n\n// ERROR:\
  \ Sealed classes cannot be derived from\nsealed class DerivedCommandLineParser :\
  \ CommandLineParser\n{\n  // ...\n}\n```\n\n密封类包含`sealed`修饰符，结果是它们不能被派生。`string`类型是一个使用`sealed`修饰符来防止派生的类型示例。\n\
  \n### 重写基类 (Overriding the Base Class)\n\n基类的所有成员都在派生类中继承，构造函数和析构函数除外。然而，有时基类对某个成员没有最优实现。例如考虑`PdaItem`上的`Name`属性。当它被`Appointment`类继承时，该实现可能是可以的。但对于`Contact`类，`Name`属性应该返回组合后的`FirstName`和`LastName`。同样，当给`Name`赋值时，它应该被拆分到`FirstName`和`LastName`。换句话说，基类的属性声明对于派生类是合适的，但实现并不总是有效的。需要一种机制在派生类中使用自定义实现来重写基类的实现。\n\
  \n#### virtual 修饰符\n\nC#支持对实例方法和属性进行重写，但不支持字段或任何静态成员进行重写。这要求在基类和派生类中都需要显式操作。基类必须将其允许重写的每个成员标记为`virtual`。如果`public`或`protected`成员不包含`virtual`修饰符，子类将无法重写它们。\n\
  \n#### 语言对比：Java——默认虚方法\n\n默认情况下，Java 中的方法是虚的（virtual），如果倾向于非虚行为，则必须显式地将其密封（sealed）。相比之下，C#默认是非虚的。列表\
  \ 6.10 显示了属性重写的示例。\n\n**列表 6.10：重写属性**\n\n点击此处查看代码图像\n\n```csharp\npublic class\
  \ PdaItem\n{\n  public virtual string Name { get; set; }\n  // ...\n}\n\npublic\
  \ class Contact : PdaItem\n{\n  public override string Name\n  {\n      get\n  \
  \    {\n          return $\"{ FirstName } { LastName}\";\n      }\n      set\n \
  \     {\n          string[] names = value.Split(' ');\n          // Error handling\
  \ not shown.\n          FirstName = names[0];\n          LastName = names[1];\n\
  \      }\n  }\n  public string FirstName { get; set; }\n  public string LastName\
  \ { get; set; }\n  // ...\n}\n```\n\n\n\n\n在创建类时，程序员在选择是否允许重写方法时应格外小心，因为他们无法控制派生类中的实现。虚方法不应包含关键代码，因为如果派生类重写了这些方法，这些方法可能永远不会被调用。此外，将一个方法从虚方法转换为非虚可能会破坏重写了该方法的派生类。你应该避免这种破坏代码的更改，特别是对于打算供第三方使用的程序集。\n\
  \n列表 6.12 包含一个虚方法 `Run()` 方法。如果 `Controller` 程序员在调用 `Run()` 时，期望关键的 `Start()` 和\
  \ `Stop()` 方法会被调用，他将会遇到问题。\n\n**列表 6.12：粗率地依赖虚方法的实现**\n\n点击此处查看代码图像\n\n```csharp\n\
  public class Controller\n{\n  public void Start()\n  {\n      // Critical code\n\
  \  }\n  public virtual void Run()\n  {\n      Start();\n      Stop();\n  }\n  public\
  \ void Stop()\n  {\n      // Critical code\n  }\n}\n```\n\n在重写 `Run()` 时，开发者可能不会调用关键的\
  \ `Start()` 和 `Stop()` 方法。为了强制执行 `Start()`/`Stop()` 预期，`Controller` 程序员应该像 列表 6.13\
  \ 所示定义该类。\n\n**列表 6.13：强制执行所需的 Run() 语义**\n\n点击此处查看代码图像\n\n```csharp\npublic class\
  \ Controller\n{\n    public void Start()\n    {\n        // Critical code\n    }\n\
  \    private void Run()\n    {\n        Start();\n        InternalRun();\n     \
  \   Stop();\n    }\n    protected virtual void InternalRun()\n    {\n        //\
  \ Default implementation\n    }\n    public void Stop()\n    {\n        // Critical\
  \ code\n    }\n}\n```\n\n通过这个新列表，一方面，`Controller` 程序员防止了用户误调用 `InternalRun()`，因为它是保护的。另一方面，将\
  \ `Run()` 声明为 `public` 确保了 `Start()` 和 `Stop()` 被恰当调用。用户仍然可能通过在派生类内部重写保护的 `InternalRun()`\
  \ 成员来修改 `Controller` 执行的默认实现。\n\n虚方法仅提供默认实现——即派生类可以完全重写的实现。然而，由于继承设计的复杂性，考虑（并最好实现）一种需要虚方法定义而非默认将成员声明为\
  \ `virtual` 的特定场景是至关重要的。\n\n最后，只有实例成员可以是 `virtual` 的。CLR 使用在实例化时指定的具体类型来决定在何处分发\
  \ `virtual` 方法调用，因此 `static virtual` 方法是没有意义的，编译器也禁止了它们。\n\n## 语言对比：C++—在构造期间分发方法调用\n\
  \n在 C++ 中，在构造期间期间调用的方法不会分发虚方法。相反，在构造期间，类型与基类型关联而非派生类类型关联，且虚方法会调用基类实现。相比之下，C# 将虚方法调用分发到最派生的类型。这与调用最派生虚成员的原则保持一致，即使派生类的构造函数尚未执行完毕。无论如何，在\
  \ C# 中应该避免这种情况。\n\n## new 修饰符\n\n当重写方法没有使用 `override` 时，编译器会发出一个类似于 输出 6.2 或 输出\
  \ 6.3 所示的警告。\n\n**输出 6.2**\n\n点击此处查看代码图像\n\n```\nwarning CS0114: '<derived method\
  \ name>' hides inherited member\n'<base method name>'. To make the current member\
  \ override that\nimplementation, add the override keyword. Otherwise add the new\n\
  keyword.\n```\n\n**输出 6.3**\n\n点击此处查看代码图像\n\n```\nwarning CS0108: The keyword new\
  \ is required on '<derived property\nname>' because it hides inherited member '<base\
  \ property name>'\n```\n\n显而许多解决方案是添加 `override` 修饰符（假设基成员是虚的）。然而，正如警告所示，`new` 修饰符也是一种选择。考虑下一页\
  \ 表格 6.1 所示的场景——这是一个被称为**脆弱基类** (**brittle base class**) 问题的更通用问题的具体示例。\n\n**表格\
  \ 6.1：为什么用 new 修饰符？**\n\n由于 `Person.Name` 不是 `virtual` 的，程序员 A 会期望 `Display()` 使用\
  \ `Person` 的实现，即使传递了 `Person` 的派生类型 `Contact`。然而，程序员 B 会期望在变量数据类型为 `Contact` 的所有情况下都使用\
  \ `Contact.Name`。（程序员 B 的代码中没有使用 `Person.Name` 的地方，因为 `Person.Name` 起初是不存在的。）为了在添加\
  \ `Person.Name` 的同时不破坏任何一个程序员的行为，你不能假设其意图是 `virtual` 的。此外，由于 C# 要求重写成员必须显式使用 `override`\
  \ 修饰符，必须假设某种其他语义，而不是允许在基类中添加成员导致派生类无法编译。\n\n（注：此处提供的原文似乎出现了部分乱序或重复，已根据逻辑关系进行了重新组组翻译，以确保通顺并符合文档工程师标准。）\n\
  \n（注：原文后半部分存在明显的段落错乱和重复，翻译时已根据逻辑进行了整理，确保语义连贯。）\n\n\n\n\n- `SubDerivedClass`: `SubDerivedClass.DisplayName()`\
  \ 是重写基类虚成员的最派生成员。`SuperSubDerivedClass.DisplayName()` 因为其 `new` 修饰符而被隐藏了。\n- `SubDerivedClass`:\
  \ `DerivedClass.DisplayName()` 是虚的，而 `SubDerivedClass.DisplayName()` 是重写它的最派生成员。与之前一样，`SuperSubDerivedClass.DisplayName()`\
  \ 因为其 `new` 修饰符而被隐藏。\n- `BaseClass`: `BaseClass.DisplayName()` 没有重新声明任何基类成员且它不是虚的；因此，它是被直接调用的。\n\
  \n在 CIL（公共中间语言）中，`new` 修饰符对生成的语句没有影响。然而，一个“new”方法会导致在方法上生成 `newslot` 元数据属性。从 C#\
  \ 的角度来看，它的唯一作用是消除本情况下会出现的编译器警告。\n\n### sealed 修饰符\n\n正如你可以使用类上的 `sealed` 修饰符来防止继承一样，虚成员也可以被标记为\
  \ `sealed`（请参见列表 6.15）。这种方法防止了子类重写在继承链中较高处最初声明为 `virtual` 的基类成员。这种情况发生在子类 `B` 重写了基类\
  \ `A` 的成员，然后需要防止在子类 `B` 之下进行进一步的重写。\n\n**列表 6.15: 密封成员**\n\n点击此处查看代码图片\n\n* * *\n\
  \n```class\nclass A\n{\n  public virtual void Method()\n  {\n  }\n}\n\nclass B :\
  \ A\n{\n  public override sealed void Method()\n  {\n  }\n}\n\nclass C : B\n{\n\
  \  // ERROR:  无法重写密封成员\n  // public override void Method()\n  // {\n  // }\n}\n\
  ```\n\n* * *\n\n在这个示例中，在类 `B` 的 `Method()` 声明中使用 `sealed` 修饰符防止了类 `C` 重写 `Method()`。\n\
  \n通常情况下，将类标记为 `sealed` 很少这样做，应该只保留给那些有充分理由支持这种限制的情况。事实上，保持类型不密封状态变得越来越具有吸引力，因为为了支持\
  \ mock（测试替体）对象的创建以代替真实实现，单元测试已变得非常重要。密封类可能正当的一种场景是：密封单个成员的成本超过了保持类不密封状态带来的益处。然而，对单个成员进行更具针对性的密封——可能是因为基类实现中为了正确行为存在依赖关系——可能是更优的。\n\
  \n### base 成员\n\n在选择重写成员时，开发者通常想要调用基类上的成员（参见列表 6.16）。\n\n**列表 6.16: 访问基类成员**\n\n\
  点击此处查看代码图片\n\n* * *\n\n```csharp\nusing static System.Environment;\npublic class\
  \ Address\n{\n  public string StreetAddress;\n  public string City;\n  public string\
  \ State;\n  public string Zip;\n  public override string ToString()\n  {\n    return\
  \ $\"{StreetAddress + NewLine}{City }, { State } { Zip}\";\n}\n```\n\n```csharp\n\
  public class InternationalAddress : Address\n{\n  public string Country;\n  public\
  \ override string ToString()\n  {\n    return base.ToString() + NewLine + Country;\n\
  \  }\n}\n```\n\n* * *\n\n在列表 6.16 中，`InternationalAddress` 继承自 `Address` 并实现了 `ToString()`。要调用父类的实现实现，你使用\
  \ `base` 关键字。该语法与 `this` 几乎相同，包括支持将 `base` 作为构造函数的一部分（稍后讨论）。理论上，在 `Address.ToString()`\
  \ 中，你需要 `override`，因为 `ToString()` 也是 `object` 的成员。任何带有 `override` 装饰的成员都会被自动指定为虚，因此其他类可以进一步特化该实现。\n\
  \n任何带有 `override` 装饰的方法都自动是虚的。基类方法只有在它是虚的情况下才可以被重写，因此重写的方法也是虚的。\n\n* * *\n\n## 构造函数\n\
  \n在实例化派生类时，运行时首先调用基类的构造函数，以确保不会跳过基类的初始化。然而，如果基类上没有可访问（私有的）默认构造函数，则无法构造基类；反之，C# 编译器会报告错误。为了避免由于缺少可访问的默认构造函数引起的错误，程序员需要在派生类头部指定运行哪个基类构造函数（参见列表\
  \ 6.17）。\n\n**列表 6.17: 指定要调用的基类构造函数**\n\n点击此处查看代码图片\n\n* * *\n\n```csharp\npublic\
  \ class PdaItem\n{\n  public PdaItem(string name)\n  {\n    Name = name;\n  }\n\
  \  // ...\n}\n```\n\n* * *\n\n```csharp\npublic class Contact : PdaItem\n{\n  public\
  \ Contact(string name) : base(name)\n  {\n    Name = name;\n  }\n  public string\
  \ Name { get; set; }\n  // ...\n}\n```\n\n* * *\n\n通过在代码中识别基类构造函数，你让运行时在调用派生类构造函数之前知道要调用哪个基类构造函数。\n\
  \n### 抽象类\n\n到目前为止的许多继承示例都定义了一个名为 `PdaItem` 的类，它定义了 `Contact`、`Appointment` 等共有的方法和属性，这些等是派生自\
  \ `PdaItem` 的类型对象。然而，`PdaItem` 本身并不打算被实例化。一个 `PdaItem` 实例本身没有意义；它只有在被用作基类时才有意义——在派生自它的数据类型集中共享默认方法实现。这些特征表明\
  \ `PdaItem` 需要是一个**抽象**（abstract）类而不是**具体**（concrete）类。抽象类专为派生而设计。除了实例化派生自它的类的上下文中，无法实例化抽象类。不是抽象的且可以可以直接实例化的类是具体类。\n\
  \n* * *\n\n#### 话题：抽象类\n\n**抽象类**代表抽象实体。它们的**抽象成员**定义了派生自抽象实体的对象应该包含的内容，但它们不包含实现。通常，抽象类中的许多功能是未实现的。然而，在一个类成功派生自抽象类之前，它需要为其抽象基类中的抽象方法提供实现。\n\
  \n* * *\n\n要定义抽象类，C# 要求在类定义中使用 `abstract` 修饰符，如列表 6.18 所示。\n\n**列表 6.18: 定义抽象类**\n\
  \n点击此处查看代码图片\n\n* * *\n\n```csharp\n// 定义一个抽象类\npublic abstract class PdaItem\n\
  {\n  public PdaItem(string name)\n  {\n    Name = name;\n  }\n  // ...\n  public\
  \ virtual string Name { get; set; }\n}\n```\n\n* * *\n\n```csharp\npublic class\
  \ Program\n{\n  public static void Main()\n  {\n    PdaItem item;\n    // ERROR:\
  \ 无法创建抽象类的实例\n    // item = new PdaItem(\"Inigo Montoya\");\n  }\n}\n```\n\n* *\
  \ *\n\n\n\n\n\n```csharp\npublic abstract class PdaItem\n{\n  public PdaItem(string\
  \ name)\n  {\n    Name = name;\n  }\n  public virtual string Name { get; set; }\n\
  \  public abstract string GetSummary();\n}\n```\n\n***\n\n```csharp\nusing static\
  \ System.Environment;\npublic class Contact : PdaItem\n{\n    public override string\
  \ Name\n    {\n        get\n        {\n            return $\"{ FirstName } { LastName\
  \ }\";\n        }\n        set\n        {\n            string[] names = value.Split('\
  \ ');\n            // Error handling not shown.\n            FirstName = names[0];\n\
  \            LastName = names[1];\n        }\n    }\n    public string FirstName\
  \ { get; set; }\n    public string LastName { get; set; }\n    public string Address\
  \ { get; set; }\n  public override string GetSummary()\n  {\n      return @\"FirstName:\
  \ { FirstName + NewLine }\"\n      + $\"LastName: { LastName + NewLine }\"\n   \
  \   + $\"Address: { Address + NewLine }\";\n  }\n  // ...\n}\n\npublic class Appointment\
  \ : PdaItem\n{\n  public Appointment(string name) :\n    base(name)\n  {\n    Name\
  \ = name;\n  }\n  public DateTime StartDateTime { get; set; }\n  public DateTime\
  \ EndDateTime { get; set; }\n  public string Location { get; set; }\n  // ...\n\
  \  public override string GetSummary()\n  {\n      return $\"Subject: { Name + NewLine\
  \ }\"\n      + $\"Start: { StartDateTime + NewLine }\"\n      + $\"End: { EndDateTime\
  \ + NewLine }\"\n      + $\"Location: { Location }\";\n  }\n}\n```\n\nListing 6.19\
  \ 将 `GetSummary()` 成员定义为 `abstract`（抽象），因此它不包含任何实现。代码随后在 `Contact` 中重写了该成员并提供了实现。由于抽象成员应该被重写，因此此类成员自动是虚拟（virtual），且不能显式声明。此外，抽象成员不能是私有的（private），因为派生类将无法看到它们。开发设计良好的对象层次结构出奇地困难。因此，在编写抽象类型时，你应该确保实现至少一个（最好是多个）派生自该抽象类型的具体类型。\n\
  \n注意：抽象成员必须被重写，因此它们自动是虚拟的，且不能显式声明。\n\n### 语言对异：C++ 纯虚函数\n\nC++ 允许使用 `=0` 定义抽象函数。这些函数在\
  \ C++ 中被称为纯虚函数。然而，与 C# 不同，C++ 并不要求类本身具有任何特殊声明。与 C# 的 `abstract` 类修饰符不同，当类包含虚拟函数时，C++\
  \ 不需要额外的类声明。如果你在 `Contact` 中没有提供 `GetSummary()` 实现，编译器将报告错误。\n\n注意：通过声明抽象成员，抽象类表示：若要在具体类和抽象基类（即\
  \ `PdaItem`）之间建立“是一个（is a）”的关系，则必须实现抽象类无法提供适当实现的抽象成员。\n\n### 初学者主题：多态性\n\n当同一个成员的实现实现在两个或多个类之间发生变化时，该场景演示了一个关键的面向对象设计原则：**多态性**（polymorphism）。“Poly”\
  \ 意味着“多”，“morph” 意味着“形式”，因此多态性指的是同一个签名有多个实现。此外，由于同一个签名在单个类中不能被多次使用，因此成员签名的每个实现都发生在不同的类中。多态性背后的思想是：对象本身最清楚如何执行特定操作。此外，通过强制执行调用这些操作的方式，多态性是一种在利用共性的同时鼓励代码复用的技术。鉴于多种类型的文档，每个文档类型类都最清楚如何为其对应的文档类型执行\
  \ `Print()` 方法。因此，与其定义一个包含 `switch` 语句并带有打印每种文档类型特殊逻辑的单一打印方法，不如使用多态性调用与要打印的特定文档类型对应的\
  \ `Print()` 方法。例如，在文字处理文档类上调用 `Print()` 的行为将根据文字处理的特性进行，而在图形文档类上调用相同的方法则将产生特定于图形的打印行为。然而，考虑到文档类型，打印文档时唯一需要做的就是调用\
  \ `Print()`，无论其类型如何。\n\n将自定义的打印实现从 `switch` 语句中移出来具有许多维护优势。首先，实现在每个文档类型类的语文中，而不是在一个与其遥远的地方；这符合封装原则。其次，添加新的文档类型不需要修改\
  \ `switch` 语句。相反，新文档类型类只需要实现 `Print()` 签名即可。\n\n抽象成员旨在作为启用多态性的一种方法。基类指定方法的签名，而派生类提供实现（参见\
  \ Listing 6.20）。\n\n**代码列表 6.20：使用多态性列出 PdaItems**\n\n点击此处查看代码图像\n\n```csharp\n\
  public class Program\n{\n  public static void Main()\n  {\n    PdaItem[] pda = new\
  \ PdaItem[3];\n    Contact contact = new Contact(\"Sherlock Holmes\");\n    contact.Address\
  \ = \"221B Baker Street, London, England\";\n    pda[0] = contact;\n    Appointment\
  \ appointment =\n      new Appointment(\"Soccer tournament\");\n    appointment.StartDateTime\
  \ = new DateTime(2008, 7, 18);\n    appointment.EndDateTime = new DateTime(2008,\
  \ 7, 19);\n    appointment.Location = \"Estádio da Machava\";\n    pda[1] = appointment;\n\
  \    contact = new Contact(\"Hercule Poirot\");\n    contact.Address = \"Apt 56B,\
  \ Whitehaven Mansions, Sandhurst Sq, London\";\n    pda[2] = contact;\n    List(pda);\n\
  \  }\n\n  public static void List(PdaItem[] items)\n  {\n    foreach (PdaItem item\
  \ in items)\n    {\n      Console.WriteLine(\"________\");\n      Console.WriteLine(item.GetSummary());\n\
  \    }\n  }\n}\n```\n\nListing 6.20 的结果出现在 Output 6.5 中。\n\n**输出 6.5**\n\n点击此处查看代码图像\n\
  \n________\nFirstName: Sherlock\nLastName: Holmes\nAddress: 221B Baker Street, London,\
  \ England\n________\nSubject: Soccer tournament\nStart: 7/18/2008 12:00:00\nEnd:\
  \ 7/19/2008 12:00:00\nLocation: Estádio da Machava\n________\nFirstName: Hercule\n\
  LastName: Poirot\nAddress: Apt 56B, Whitehaven Mansions, Sandhurst Sq, London\n\n\
  通过这种方式，你可以在基类上调用方法，但实现是特定于派生类的。Output 6.5 显示 `List()` 方法能够成功显示 `Contact` 和 `Address`，并以自定义的方式显示它们。抽象方法的调用实际上调用了特定的覆盖方法。\n\
  \n### 所有类都派自 System.Object\n\n对于任何类（无论是自定义类还是系统内置类），Table 6.2 所示的方法都将被定义。\n\n![图像](img/06tab02.jpg)\n\
  \n\n\n\n# 表格 6.2：System.Object 的成员\n\n表 6.2 中列出的所有方法都通过继承出现在所有对象上；所有类（无论是直接还是通过继承链）都派自\
  \ `object`。甚至字面量也包含这些方法，使得代码看起来有些奇特，例如：\n\n点击此处查看代码图像\n\n```\nConsole.WriteLine(\
  \ 42.ToString() );\n```\n\n即使是没有任何显式派自 `object` 的类定义，实际上也会派自 `object`。因此，列表 6.21\
  \ 中对 `PdaItem` 的两个声明会导致相同的 CIL。\n\n### 列表 6.21：未显式指定派生时隐含的 System.Object 派生\n\n\
  ```c\npublic class PdaItem\n{\n  // ...\n}\n\npublic class PdaItem : object\n{\n\
  \  // ...\n}\n```\n\n当 `object` 的默认实现不足时，程序员可以重写三个虚方法中的一个或多个。第 9 章描述了实现此操作细节。\n\n\
  ### 使用 is 运算符验证底层类型\n\n由于 C# 允许沿继承链向下转型，因此有时在尝试转换之前确定底层类型是有意义的。此外，对于未实现多态的特定类型特定操作，检查类型可能是必须的。为了确定底层类型，C#\
  \ 提供了 `is` 运算符（参见列表 6.22）。\n\n### 列表 6.22：使用 is 运算符确定底层类型\n\n点击此处查看代码图像\n\n```csharp\n\
  public static void Save(object data)\n{\n  if (data is string)\n  {\n      data\
  \ = Encrypt((string) data);\n  }\n  // ...\n}\n```\n\n列表 6.22 在底层类型为 `string` 时对数据进行加密。这与加密任何可以成功转换为\
  \ `string` 的数据类型显著不同，因为许多类型支持转换为 `string`，但它们的底层类型并不是 `string`。\n\n尽管这种能力很重要，但在使用\
  \ `is` 运算符之前，你应该考虑与多态相关的问题。多态支持将行为扩展到其他数据类型，而无需修改定义该行为的实现。例如，派自一个公共基类型，并将该类型作为 `Save()`\
  \ 方法的参数，可以避免显式检查 `string` 的需要，并允许其他数据类型通过派自同一个基类型来在保存操作期间支持加密。\n\n### 使用 as 运算符进行转换\n\
  \n`is` 运算符的优势在于它能够验证数据项是否为特定类型。`as` 运算符更进一步：它尝试转换为特定的数据类型，如果源类型在本质上（在继承链中）不是目标类型，则分配\
  \ `null`。这种策略具有重要意义，因为避免了由转型可能产生的异常。列表 6.23 演示了 `as` 运算符的使用。\n\n### 列表 6.23：使用 as\
  \ 运算符进行数据转换\n\n点击此处查看代码图像\n\n```csharp\nobject Print(IDocument document)\n{\n  if(thing\
  \ != null)\n  {\n      // Print document...\n  }\n  else\n  {\n  }\n}\n\nstatic\
  \ void Main()\n{\n  object data;\n  // ...\n  Print(data as Document);\n}\n```\n\
  \n通过使用 `as` 运算符，如果转换无效，你可以避免额外的额外的 try/catch 处理代码，因为 `as` 运算符提供了一种在转型失败时不抛出异常的尝试转型方法。\n\
  \n`is` 运算符相对于 `as` 运算符的优势是，后者无法成功确定底层类型。`as` 运算符可能会隐式地向上或向下继承链进行转型，也可以跨越到支持转型运算符的类型。与\
  \ `as` 运算符不同，`is` 运算符可以确定底层类型。\n\n### 总结\n\n本章讨论了如何通过派生类并添加额外的方法和属性来特化类。这些内容涵盖了对控制封装级别的\
  \ `private` 和 `protected` 访问修饰符的讨论。\n\n本章还研究了重写基类实现的细节，以及通过使用 `new` 修饰符隐藏它。为了控制重写，C#\
  \ 提供了 `virtual` 修饰符，它向派生类开发者标识哪些成员是打算用于派生的。为了防止任何派生，可以在类上使用 `sealed` 修饰符。同样，在成员上放置\
  \ `sealed` 修饰符可以防止子类的进一步重写。\n\n本章最后简要讨论了所有类型如何派自 `object`。第 9 章 进一步讨论了这种派生，查看了 `object`\
  \ 如何包含三个具有特定重载规则和指南的虚方法。在到达那里，你需要考虑另一种基于面向对象编程的编程范式：接口。这是第 7 章的主题。\n\n## 7. 接口\n\
  \n多态不仅可以通过继承（如前一节所述），还可以通过接口实现。与抽象类不同，接口不能包含任何实现。然而，与抽象类一样，接口定义了一组调用者可以依赖其已实现的成员。\n\
  \n通过实现接口，类型定义了它的能力。接口实现关系是一种“能够做”的关系：该类型可以完成接口要求实现类型完成的工作。接口定义了实现接口的类型与使用接口的代码之间的约定。实现接口的类型必须声明与实现接口中声明的方法相同的方法。本章讨论了接口的实现和使用。\n\
  \n![图像](img/0325fig01.jpg)\n\n### 接口\n\n学者课题：为什么需要接口？\n\n接口非常有用，因为——与抽象类不同——它们实现了实现细节与服务的完全分离。对于一个真实世界的例子，考虑作为电源插座的“接口”。电如何到达插座是一个实现细节：它可能由化学能、核能或太阳能产生；发电机可能在隔壁房间也可能在远处；以此此类推。插座提供了一个“合同”：它同意在特定频率提供特定的电压，作为回报，它要求使用该接口的电器提供兼容的插头。电器不需要关心任何电到达插座的实现细节；它只需要担心自己提供了一个兼容的插头即可。\n\
  \n考虑以下示例：存在大量的压缩压缩格式（`.zip`, `.7-zip`, `.cab`, `.lha`, `.tar`, `.tar.gz`, `.tar.bz2`,\
  \ `.bh`, `.rar`, `.arj`, `.arc`, `.ace`, `.zoo`, `.gz`, `.bzip2`, `.xxe`, `.mime`,\
  \ `.uue` 和 `.yenc`，仅列举几个）。如果你为每个压缩格式创建一个类，你可能会为每个压缩实现得到不同的方法签名，并且无法在它们之间应用标准的调用约定。所需的方法可以在基类中声明为抽象的。然而，派自一个公共基类用尽了类的一个且仅有的继承机会。不太可能有可以放在基类中的、适用于各种压缩实现的公共代码，从而排除了拥有基类实现的潜在优势。关键点在于，基类允许你共享实现以及成员签名，而接口则允许你在不共享实现的情况下共享成员签名。\n\
  \n\n\n\n与其共享一个公共基类，不如每个压缩类都实现一个通用接口。接口定义了类支持以与期望该接口的其他类进行交互的契约。如果所有类都实现了 `IFileCompression`\
  \ 接口及其 `Compress()` 和 `Uncompress()` 方法，那么在任何特定压缩类上调用算法的代码仅需将其转换为 `IFileCompression`\
  \ 接口并调用其成员即可。结果结果实现了多态性，因为每个压缩类都具有相同的方法签名，但对该签名有不同的具体实现。\n\n列表 7.1 所示的 `IFileCompression`\
  \ 接口是接口实现的一个示例。按照惯——一种强大到通用的惯例——接口名称使用 PascalCase 命名，并带有大写字母“I”前缀。\n\n### 列表 7.1：定义接口\n\
  \n点击此处查看代码图片\n\n```csharp\ninterface IFileCompression\n{\n  void Compress(string\
  \ targetFileName, string[] fileList);\n  void Uncompress(\n      string compressedFileName,\
  \ string expandDirectoryName);\n}\n```\n\n`IFileCompression` 定义了类型必须实现的方法，以便与其他压缩相关类相同的方式被使用。接口的威力在于，它们允许调用者在不修改调用代码的情况下在不同实现之间切换。\n\
  \n接口的一个关键特征是它没有实现，也没有数据。接口中的方法声明在头部之后使用单个分号，而不是大括号。字段（数据）不能出现在接口声明中。当接口要求派生类具有某些数据时，它声明一个属性而不是字段。由于属性本身作为接口声明的一部分不包含任何实现，因此它不引用备份字段。\n\
  \n接口声明的成员描述了在实现类型上必须可的成员。非公有成员的目的是使这些成员对其他代码不可。因此，C# 不允许对接口成员使用访问修饰符；相反，它会自动将它们定义为公有（public）。\n\
  \n### 指南\n\n- **务必**使用 PascalCase 命名法命名接口，并带有“I”前缀。\n\n### 通过接口实现多态\n\n考虑另一个示例，如列表\
  \ 7.2 所示：`IListable` 定义了类为了让 `ConsoleListControl` 类显示它而需要支持的成员。因此，任何实现 `IListable`\
  \ 的类都可以使用 `ConsoleListControl` 来显示自己。`IListable` 接口要求一个只读属性 `ColumnValues`。\n\n\
