  列表 14.12 还提供了一组示例数据。输出 14.2 显示了运行此代码的结果。\n\n**输出 14.2**\n\n点击此处查看代码图像\n\n双光焦点眼镜\
  \ (1784)\n留声机 (1877)\n电影放映机 (1888)\n电报 (1837)\n飞行器 (1903)\n蒸汽机车 (1815)\n滴液沉积装置 (1989)\n\
  无背文胸 (1914)\n本杰明·富兰林（宾夕法尼亚州，费城）\n）\n奥维尔·莱特（北卡罗来纳州，基蒂霍克）\n威尔伯·莱特（北卡罗来纳州，基蒂霍克）\n塞缪尔·摩尔斯（纽约州，纽约）\n\
  乔治·史蒂芬森（诺西森伯兰郡，威尔拉姆）\n约翰·迈克尔斯（伊利诺伊州，芝加哥）\n玛丽·菲尔普斯·雅各布（纽约州，纽约）\n\n### 使用 Where()\
  \ 进行过滤\n\n为了从集合中过滤数据，我们需要提供一个返回 `true` 或 `false` 的过滤方法，以指示特定元素是否应该被包含。一个接受参数并返回布尔值的委托表达式称为\
  \ `predicate`（谓词），集合的 `Where()` 方法依赖于谓词来识别标准，如列表 14.13 所示。（从技术上讲，`Where()` 方法的结果是一个`monad`（单单子），它封装了使用给定谓词对给定序列进行过滤的操作。）结果显示在输出\
  \ 14.3 中。\n\n**列表 14.13：使用 System.Linq.Enumerable.Where() 进行过滤**\n\n点击此处查看代码图像\n\
  \n```csharp\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
  \nclass Program\n{\n    static void Main()\n    {\n        IEnumerable<Patent> patents\
  \ = PatentData.Patents;\n        patents = patents.Where(patent => patent.YearOfPublication.StartsWith(\"\
  18\"));\n        Print(patents);\n    }\n    // ...\n}\n```\n\n**输出 14.3**\n\n留声机\
  \ (1877)\n电影放映机 (1888)\n电报 (1837)\n蒸汽机车 (1815)\n\n注意，代码将 `Where()` 用的输出赋值回 `IEnumerable<T>`。换句话说，`IEnumerable<T>.Where()`\
  \ 的输出是一个新的 `IEnumerable<T>` 集合。在列表 14.13 中，它是 `IEnumerable<Patent>`。\n\n不明显的是，`Where()`\
  \ 表达式的参数在赋值时并不一定已经执行。对于许多标准操作符都是如此。例如，在 `Where()` 的情况下，表达式被传递给集合并被“保存”但未执行。相反，表达式的执行仅在需要开始迭代项目时才会发生。`foreach`\
  \ 循环，例如 `Print()` 中的循环（在列表 14.12 中），将触发对集合中每个项目进行表达式评估。至少在概念上，`Where()` 方法应该被理解为指定关于集合中出现内容的查询手段，而不是通过迭代产生具有更少项目的新集合所涉及实际工作。\n\
  \n### 使用 Select() 进行投影\n\n由于 `IEnumerable<T>.Where()` 方法的输出是一个新的 `IEnumerable<T>`\
  \ 集合，因此可以在同一个集合上再次调用标准查询操作符。例如，我们不仅过滤原始集合中的数据，还可以对数据进行转换（参见列表 14.14）。\n\n**列表 14.14：使用\
  \ System.Linq.Enumerable.Select() 进行投影**\n\n点击此处查看代码图像\n\n```csharp\nusing System;\n\
  using System.Collections.Generic;\nusing System.Linq;\n\nclass Program\n{\n    static\
  \ void Main()\n    {\n        IEnumerable<Patent> patents = PatentData.Patents;\n\
  \        patents = patents.Where(patent => patent.YearOfPublication.StartsWith(\"\
  18\"));\n        Print(patents);\n    }\n    // ...\n}\n```\n\n在列表 14.14 中，我们创建了一个\
  \ `IEnumerable<string>` 集合。在这种情况下，恰好添加 `Select()` 调用并没有改变输出——这仅仅是因为 `Print()` 的\
  \ `Console.WriteLine()` 调用已经使用了 `ToString()`。显然，从原始集合的 `Patent` 类型到 `items` 集合的\
  \ `string` 类型确实发生了转换。\n\n考虑列表 14.15 中使用 `System.IO.FileInfo` 的示例。\n\n**列表 14.15：使用\
  \ System.Linq.Enumerable.Select() 和 new**\n\n点击此处查看代码图像\n\n```csharp\n// ...\nIEnumerable<string>\
  \ fileList = Directory.Files(rootDirectory, searchPattern);\nIEnumerable<FileInfo>\
  \ files = fileList.Select(file => new FileInfo(file));\n// ...\n```\n`fileList`\
  \ 是 `IEnumerable<string>` 类型。然而，通过 `Select` 提供的投影，我们可以将集合中的每个项目转换为 `System.IO.FileInfo`\
  \ 对象。\n\n最后，利用匿名类型，我们可以创建一个集合 `IEnumerable<T>`,其中 `T` 是匿名类型（参见列表 14.16 和输出 14.4）。\n\
  \n**列表 14.16：投影到匿名类型**\n\n点击此处查看代码图像\n\n```csharp\n// ...\nIEnumerable<string> fileList\
  \ = Directory.EnumerateFiles(rootDirectory, searchPattern);\nvar items = fileList.Select(file\
  \ =>\n{\n    FileInfo info = new FileInfo(file);\n    return new\n    {\n      \
  \  FileName = info.Name,\n        Size = info.Length\n    };\n});\n// ...\n```\n\
  \n**输出 14.4**\n\n```csharp\n// ...\n```\n\n\n\n\n\n匿名类型的输出会自动在与匿名类型关联的生成的 `ToString()`\
  \ 方法中显示属性名称及其值。\n\n使用 `Select()` 方法进行投影是非常强大的。我们已经看到了如何使用 `Where()` 标准查询操作符对集合进行垂直过滤（减少集合中项目的数量）。现在，通过\
  \ `Select()` 标准查询操作符，我们还可以对集合进行水平收缩（减少列的数）或完全转换数据。通过将 `Where()` 和 `Select()` 结合使用，提供了一种从原始集合中仅提取当前算法所需部分的方法。仅这两种方法就提供了一个强大的集合操作\
  \ API，而如果不使用它们，实现相同功能将产生多得多且可读性更差的代码。\n\n`开始 4.0`\n\n## 高级主题：并行运行 LINQ 查询\n\n随着拥有多个处理器以及这些处理器内部具有多个核心的计算机变得普及，轻松利用额外处理能力的能力变得更加重要。为了做到这一点，程序需要修改以支持多线程，以便工作可以在计算机内部不同的\
  \ CPU 上同时进行。插列表 14.17 演示了使用并行 LINQ (PLINQ) 实现此点的一种方法。\n\n**插列表 14.17：并行执行 LINQ 查询**\n\
  \n点击此处查看代码图像\n\n```csharp\n// ...\n\n  IEnumerable<string> fileList = Directory.EnumerageFiles(\n\
  \      rootDirectory, searchPattern);\n\n  var items = fileList.AsParallel().Select(\n\
  \      file =>\n      {\n          FileInfo fileInfo = new FileInfo(file);\n   \
  \       return new\n          {\n              FileName = fileInfo.Name,\n     \
  \         Size = fileInfo.Length\n          };\n      });\n// ...\n```\n\n如 插列表\
  \ 14.17 所示，启用并行支持的代码更改是极小的。它所使用的只是 .NET Framework 4 引入的标准查询操作符 `AsParallel()`，它位于静态类\
  \ `System.Linq.ParallelEnumerable`。然而，通过使用这个简单的扩展方法，运行时开始并行执行 `fileList` 集合中的项目并并行返回结果对象。在这种情况下，每个并行操作并不特别开销（尽管相对于其他正在进行的执行而言如此），但请考虑加密或压缩等\
  \ CPU 密集型操作。在多个 CPU 上并行运行查询可以将执行时间减少到对应于 CPU 数量 倍。\n\n需要注意的一个重要提示（这也是 `AsParallel()`\
  \ 作为一个高级主题而非出现在正文的原因）是，并行执行可能会引入竞态条件，导致一个线程上的操作可能与另一个线程上的操作交织，从而导致数据损坏。为了避免这个问题，需要对具有多个线程共享访问的数据使用同步机制，以强制在必要时操作是原子性的。然而，同步本身可能会引入死锁并冻结执行，进一步增加了有效并行编程的复杂性。\n\
  \n关于此以及其他多线程主题的更多细节请参见第 18 章 和第 19 章。\n\n`结束 4.0`\n\n## 使用 Count() 计算元素\n\n在项目集合上经常执行的另一个查询是获取计数。为了支持这种类型的查询，LINQ\
  \ 包含了 `Count()` 扩展方法。\n\n插列表 14.18 演示了 `Count()` 被重载，可以简单地计算所有元素（无参数），或接受一个谓词来只计算由谓词表达式标识的项目。\n\
  \n**插列表 14.18：使用 Count() 计算项目**\n\n点击此处查看代码图像\n\n```csharp\nusing System;\n\nusing\
  \ System.Collections.Generic;\nusing System.Linq;\nclass Program\n{\n  static void\
  \ Main()\n  {\n      IEnumerable<Patent> patents = PatentData.Patents;\n      Console.WriteLine($\"\
  Patent Count: {patents.Count() }\");\n      Console.WriteLine($\"Patent Count in\
  \ 1800s: {\n      patents.Count(patent => patent.YearOfPublication.StartsWith(\"\
  18\"))}\");\n  }\n  // ...\n```\n\n尽管 `Count()` 语句看起来非常简单，但 `IEnumerable<T>` 并没有改变，因此执行的代码会遍历集合中的所有项目。每当集合上直接可用\
  \ `Count` 属性时，优选使用该属性而不是 LINQ 的 `Count()` 方法（这是一个细微的差别）。幸运的是，`ICollection<T>` 包含了\
  \ `Count` 属性，因此对支持 `ICollection<T>` 的集合调用 `Count()` 方法的代码将转换集合并直接调用 `Count`。然而，如果不支持\
  \ `ICollection<T>`，`Enumerable.Count()` 将继续枚举集合中的所有项目，而不是调用内置的 `Count` 机制。如果检查计目的目的是为了查看它是否大于零（`patents.Count()\
  \ > 0`），更优的方法是使用 `Any()` 操作符（`patents.Any()`）。`Any()` 尝试遍历集合中的一个项目以返回真结果，而不是遍历整个序列。\n\
  \n### 指南\n\n-   在检查项目是否大于零时，**请**使用 `System.Linq.Any()` 而不是调用 `patents.Count()`。\n\
  -   **请**使用集合的 `Count` 属性（如果可用），而不是调用 `System.Count()` 方法。\n\n## 延迟执行\n\n使用 LINQ\
  \ 时最重要的概念之一是延迟执行。请考虑插列表 14.19 中的代码以及输出 14.5 中的输出。\n\n**插列表 14.19：使用 System.Linq.Where()\
  \ 过滤**\n\n点击此处查看代码图像\n\n```csharp\nusing System;\n\nusing System.Collections.Generic;\n\
  using System.Linq;\n// ...\n  IEnumerable<Patent> patents = PatentData.Patents;\n\
  \  bool result;\n  patents = patents.Where(\n      patent =>\n      {\n        \
  \  if (result = patent.YearOfPublication.StartsWith(\"18\"))\n          {\n    \
  \          // 谓词中的这种副作用是为了\n              // 演示原则，但通常应该避免。\n              Console.WriteLine(\"\
  \\t\" + patent);\n          }\n          return result;\n      });\n  Console.WriteLine(\"\
  1\\. 1900 年之前的专利有:\");\n  foreach (Patent patent in patents)\n  {\n  }\n  Console.WriteLine();\n\
  \  Console.WriteLine(\n      \"2\\. 1900 年之前的第二个列表：\");\n  Console.WriteLine(\n\
  \      @\"  There are {\n      patents.Count() } patents to 1900.\");\n  Console.WriteLine();\n\
  \  Console.WriteLine(\n      \"3\\. 1900 年之前的第三个列表：\");\n  patents = patents.ToArray();\n\
  \  Console.Write(\"  There are \");\n  Console.WriteLine(\n      $\"{ patents.Count()\
  \ } patents to 1900.\");\n// ...\n```\n\n**输出 14.5**\n\n点击此处查看代码图像\n\n1\\. 1900\
  \ 年之前的专利有：\n  Phonograph (1877)\n  Kinetoscope (1888)\n  Electrical Telegraph (1837)\n\
  \  Steam Locomotive (1815)\n\n2\\. 1900 年之前的第二个列表：\n  Phonograph (1877)\n  Kinetoscope\
  \ (1888)\n  Electrical Telegraph (1837)\n  Steam Locomotive (1815)\n  There are\
  \ 4 patents to 1900.\n\n3\\. 1900 年之前的第三个列表：\n  Phonograph (1877)\n  Kinetoscope\
  \ (1888)\n  Electrical Telegraph (1837)\n  Steam Locomotive (1815)\n  There are\
  \ 4 patents to 1900.\n\n\n\n\n\n# 蒸汽机 (1815)\n\n1900 年之前有 4 项专利。\n\n注意 `Console.WriteLine(\"\
  1\\. Patents prior...)` 在 lambda 表达式之前执行。这是一个非常需要注意的特征，因为对于那些不知道其重要性的人来说，这一点显而易见。通常情况下，谓词应该只做一件事——评估条件——并且不应该有任何副作用（即使像示例这样打印到控制台）。\n\
  \n为了理解正在发生什么，请记住 lambda 表达式是委托——方法的引用——它们是可以传递的。在 LINQ 和标准查询操作的上下文中，每个 lambda 表达式都构成了待执行查询的一部分。\n\
  \n在声明时，lambda 表达式不会执行。事实上，只有在调用 lambda 表达式时，其内部的代码才会开始执行。图 14.2 显示了操作序列。\n\n![Image](img/14fig02.jpg)\n\
  \n**图 14.2：调用 Lambda 表达式的操作序列**\n\n如图 14.2 所示，列表 14.17 中的三次调用触发了 lambda 表达式，而且每次都是相当隐式的。如果\
  \ lambda 表达式开销很大（例如调用数据库），那么尽量减少 lambda 表达式的执行就很重要。\n\n首先，执行是在 `foreach` 循环内部触发的。正如我们在章早期描述的，`foreach`\
  \ 循环分解为 `MoveNext()` 调用，每次调用会导致原始集合中的每个项执行 lambda 表达式。在迭代期间，运行时会对每个项调用 lambda 表达式，以确定该项是否满足谓词。\n\
  \n其次，对 `Enumerable` 的 `Count()`（函数）的调用再次为每个项触发 lambda 表达式。同样，这是一个非常微妙的行为，因为 `Count`（属性）在未用标准查询操作查询过的集合上非常常见。\n\
  \n第三，对 `ToArray()`（或 `ToList()`、`ToDictionary()` 或 `ToLookup()`）的调用会为每个项触发 lambda\
  \ 表达式。然而，使用这些“To”方法之一转换集合是非常有用的。这样做会返回一个已经执行了标准查询操作的集合。在列表 14.17 中，转换为数组意味着当在最后的\
  \ `Console.WriteLine()` 中调用 `Length` 时，`patents` 指向的底层对象实际上是一个数组（它显然实现了 `IEnumerable<T>`）；相应，调用的是\
  \ `System.Array` 的 `Length` 实现，而不是 `System.Linq.Enumerable` 的实现。因此，在转换为“To”方法返回的集合类型之一后，通常处理该集合是安全的（直到再次调用另一个标准查询操作为止）。但是，请注意，这将整个结果集加载到内存中（在此步骤之前，它可能由数据库或文件支持）。此外，“To”方法将获取底层数据的快照，因此在重新查询“To”方法的结果时，将不会返回新的结果。\n\
  \n***\n\n### 注意事项\n\n为了避免这种重复执行，你必须缓存执行的查询所检索的数据。要这样做，你可以使用“To”方法的集合方法之一将数据分配给本地集合。在调用“To”方法的赋值期间，查询显然会执行。然而，在之后之后迭代已分配的集合将不再涉及查询表达式。通常情况下，如果你想要内存集合快照的行为，最佳实践是将查询表达式分配给缓存集合，以避免不必要的迭代。\n\
  \n***\n\n我们强烈鼓励读者查看图 14.2 中的序列图以及相应的代码，并意识到标准查询操作的延迟执行可能会导致标准查询操作极其微妙的触发；因此，开发者应该谨慎并力避免意外调用。查询对象代表查询本身，而不是结果。当你向查询请求结果时，整个查询会执行（甚至再次执行），因为查询对象不知道结果是否与之前的执行相同（如果有）。\n\
  \n## 使用 OrderBy() 和 ThenBy() 进行排序\n\n集合的另一个常见操作是对进行排序。这涉及调用 `System.Linq.Enumerable`\
  \ 的 `OrderBy()`，如列表 14.20 和输出 14.6 所示。\n\n**列表 14.20：使用 System.Linq.Enumerable.OrderBy()/ThenBy()\
  \ 排序**\n\n点击查看代码图像\n\n***\n\n```csharp\nusing System;\n\nusing System.Collections.Generic;\n\
  \nusing System.Linq;\n\n// ...\n\n      IEnumerable<Patent> items;\n\n      Patent[]\
  \ patents = PatentData.Patents;\n\n      items = patents.OrderBy(\n          patent\
  \ => patent.YearOfPublication).ThenBy(\n          patent => patent.Title);\n   \
  \   Print(items);\n\n      Console.WriteLine();\n\n      items = patents.OrderByDescending(\n\
  \          patent => patent.YearOfPublication).ThenByDescending(\n          patent\
  \ => patent.Title);\n      Print(items);\n// ...\n```\n\n***\n\n**输出 14.6**\n\n\
  点击查看代码图像\n\n双光眼镜 (1784)\n\n蒸汽机 (1815)\n\n电报 (1837)\n\n留声机 (1877)\n\n电影放仪 (1888)\n\
  \n飞行器 (1903)\n\n无背胸罩 (1914)\n\n滴液沉积 (1989)\n\n滴液沉积 (1989)\n\n无背胸罩 (1914)\n\n飞行器\
  \ (1903)\n\n电影放仪 (1888)\n\n留声机 (1877)\n\n电报 (1837)\n\n蒸汽机 (1815)\n\n双光眼镜 (1784)\n\
  \n`OrderBy()` 调用接受一个 lambda 表达式，该表达式标识了用于排序的键。在列表 14.20 中，初始排序使用专利发表的年份。\n\n然而，注意\
  \ `OrderBy()` 调用仅接受一个参数，即使用 `keySelector` 进行排序。要对第二列进行排序，需要使用不同的方法：`ThenBy()`。同样，代码使用\
  \ `ThenBy()` 进行任何额外的排序。\n\n`OrderBy()` 返回 `IOrderedEnumerable<T>` 接口，而不是 `IEnumerable<T>`。此外，`IOrderedEnumerable<T>`\
  \ 派自 `IEnumerable<T>`，因此所有的查询操作（包括 `OrderBy()`）在 `OrderBy()` 上可用。然而，反复调用 `OrderBy()`\
  \ 会消除之前调的工作，导致最终结果按最后一个 `OrderBy()` 调用中的 `keySelector` 排序。由于这个原因，你应该小心不要在之前的 `OrderBy()`\
  \ 调用上再次调用 `OrderBy()`。\n\n相反，你应该使用 `ThenBy()` 来指定额外的标准。虽然 `ThenBy()` 是一个扩展方法，但它不是\
  \ `IEnumerable<T>` 的扩展，而是 `IOrderedEnumerable<T>` 的扩展。该方法同样定义在 `System.Linq.Extensions.Enumerable`\
  \ 中，声明如下：\n\n点击查看代码图像\n\n```csharp\n  public static IOrderedEnumerable<TSource>\n\
  \    ThenBy<TSource, TKey>(\n      this IOrderedEnumerable<TSource> source,\n  \
  \    Func<TSource, TKey> keySelector)\n```\n\n总结来说，首先使用 `OrderBy()`，跟跟零或多次 `ThenBy()`\
  \ 调用以提供额外的排序“列”。`OrderByDescending()` 和 `ThenByDescending()` 提供相同的功能，只是改为降序。混合使用升序和降序方法没有问题，但如果需要进一步排序，请使用\
  \ `ThenBy()` 调用（无论是升序还是降序）。\n\n\n\n\n\n关于排序，还有两点重要的说明。首先，只有在你开始访问集合中的成员时，实际排序才会发生，此时整个查询才会被处理。除非你拥有所有待排序的项目，否则无法进行排序，因为你无法确定是否拥有第一个项目。排序被推迟到开始访问成员之后，是由于我们在在本章早些时候描述的延迟执行。其次，对数据排序的后续后续调用（例如先调用\
  \ `OrderBy()`，然后是 `ThenBy()`，然后是 `ThenByDescending()`）确实涉及对早期排序调用中 `keySelector`\
  \ lambda 表达式的额外调用。换句话说，当你遍历集合时，`OrderBy()` 会调用其对应的 `keySelector` lambda 表达式。此外，随后的\
  \ `ThenBy()` 将再次调用 `OrderBy()` 的 `keySelector`。\n\n### 指南\n\n**不要**在之前的 `OrderBy()`\
  \ 方法调用之后再次调用 `OrderBy()`。使用 `ThenBy()` 根据多个值对项目进行排序。\n\n## 初学者主题：连接操作\n\n考虑两个对象集合，如图\
  \ 14.3 中的维恩图所示。图中的左圆包含所有发明者，右圆包含所有专利。交集包含发明者和专利，对于每种发明者与专利匹配的情况，都会形成一条线。如图所示，每个发明者可能拥有多个专利，而每个专利可以拥有一个或多个发明者。每个专利都有一个发明者，但在某些情况下，发明者还没有专利。\n\
  \n![Image](img/14fig03.jpg)\n\n**图 14.3：发明者和专利集合的维恩图**\n\n将交集中的发明者与专利匹配是**内连接（inner\
  \ join）**。结果是一个发明者/专利对的集合，其中每一对都存在专利和发明。**左外连接（left outer join）**包含左圆中的所有项目，无论它们是否有相应的专利。在这个特定的示例中，**右外连接（right\
  \ outer join）**与内连接相同，因为没有没有发明者的专利。此外，左与右的指定是任意的，因此左连接和外连接之间实际上没有区别。然而，**全外连接（full\
  \ outer join）**将包含来自两个外边的记录；执行全外连接的情况相对罕见。\n\n发明者与专利关系中的另一个重要特征是它是**多对多（many-to-many）**关系。每个单独的专利可以有一个或多个发明者（例如，由奥尔维和威尔伯·莱特发明的飞行器）。此外，每个发明者可以拥有一个或多个专利（例如，本杰明·富兰林发明的双焦点眼镜和留声机）。另一种常见关系是一对多（one-to-many）**关系。例如，一个公司部门可能有许多员工。然而，每个员工一次只能属于一个部门。（但是，正如一对多关系的常见情况，引入时间因素可以将其转换为一对多关系。特定的员工可能会从一个部门移动到另一个部门，随着时间的推移，她可能与多个部门相关，形成另一个多对多关系。）\n\
  \n列表 14.21\n\n```csharp\npublic class Department\n{\n    public long Id { get; set;\
  \ }\n    public string Name { get; set; }\n    public override string ToString()\n\
  \    {\n        return Name;\n    }\n}\n```\n\n```csharp\npublic class Employee\n\
  {\n    public int Id { get; set; }\n    public string Name { get; set; }\n    public\
  \ string Title { get; set; }\n    public int DepartmentId { get; set; }\n    public\
  \ override string ToString()\n    {\n        return $\"{Name} ({ Title })\";\n \
  \   }\n}\n```\n\n```csharp\nstatic class CorporateData\n{\n    public static readonly\
  \ Department[] Departments =\n    new Department[]\n    {\n        new Department(){\
  \ { Name=\"Corporate\", Id=0 },\n        new Department() { Name=\"Finance\", Id=1\
  \ },\n        new Department() { Name=\"Engineering\", Id=2 },\n        new Department()\
  \ { Name=\"Information Technology\", Id=3 },\n        new Department() { Name=\"\
  Philanthropy\", Id=4 },\n        new Department() { Name=\"Marketing\", Id=5 },\n\
  \    };\n    public static readonly Employee[] Employees = Employee[]\n    {\n \
  \       new Employee(){ Name=\"Mark Michaelis\", Title=\"Chief Computer Nerd\",\
  \ DepartmentId = 0 },\n        new Employee() { Name=\"Michael Stokesbary\", Title=\"\
  Senior Computer Wizard\", DepartmentId=2 },\n        new Employee() { Name=\"Brian\
  \ Jones\", Title=\"Enterprise Integration Guru\", DepartmentId=2 },\n        new\
  \ Employee() { Name=\"Shane Kercheval\", Title=\"Chief Financial Officer\", DepartmentId=1\
  \ },\n        new Employee() { Name=\"Pat Dever\", Title=\"Enterprise Architect\"\
  , DepartmentId = 3 },\n        new Employee() { Name=\"Kevin Bost\", Title=\"Programmer\
  \ Extraordinaire\", DepartmentId = 2 },\n        new Employee() { Name=\"Thomas\
  \ Heavey\", Title=\"Software Architect\", DepartmentId = 2 },\n        new Employee(){\
  \ Name=\"Eric Edmonds\", Title=\"Philanthropy Coordinator\", DepartmentId = 4}\n\
  \    };\n}\n```\n\n```csharp\nclass Program\n{\n    static void Main()\n    {\n\
  \        IEnumerable<Department> departments = CorporateData.Departments;\n    \
  \    Print(departments);\n        Console.WriteLine();\n        IEnumerable<Employee>\
  \ employees = CorporateData.Employees;\n        Print(employees);\n    }\n    private\
  \ static void Print<T>(IEnumerable<T> items)\n    {\n        foreach (T item in\
  \ items)\n        {\n            Console.WriteLine(item);\n        }\n    }\n}\n\
  ```\n\n#### 使用 Join() 执行内连接\n\n在客户端的对象世界中，对象之间的关系通常已经设置好了。例如，文件与它们所在的目录之间的关系分别通过\
  \ `DirectoryInfo.GetFiles()` 方法和 `FileInfo.Directory` 方法预先建立。然而然而每当从非对象存储器中加载数据时，情况通常并非如此。相反，需要将数据连接起来，以便能够以符合数据逻辑的方式从一种类型的对象导航到下一种类型。\n\
  \n\n\n\n\n考虑员工和公司部门的例子。在列表 14.22 中，我们将每个员工与其所属部门连接，然后列出每个员工及其对应的部门。由于每个员工只属于一个（且恰好是一个）部门，列表中的项目总数等于员工的总数——每个员工只出现一次（每个员工被称为``normalized`的）。输出\
  \ 14.8 显示了结果。\n\n### 列表 14.22：使用 System.Linq.Enumerable.Join() 进行内连接\n\n点击此处查看代码图像\n\
  \n```csharp\nusing System;\n\nusing System.Linq;\n\n// ...\n\n    Department[] departments\
  \ = CorporateData.Departments;\n\n    Employee[] employees = CorporateData.Employees;\n\
  \    var items = employees.Join(\n        departments,\n        employee => employee.DepartmentId,\n\
  \        department => department.Id,\n        (employee, department) => new\n \
  \       {\n            employee.Id,\n            employee.Name,\n            employee.Title,\n\
  \            Department = department\n        });\n    foreach (var item in items)\n\
  \    {\n        Console.WriteLine($\"{ item.Name } ({ item.Title })\");\n      \
  \  Console.WriteLine(\"\\t\" + item.Department);\n    }\n// ...\n```\n\n### 输出 14.8\n\
  \n点击此处查看代码图像\n\nMark Michaelis (Chief Computer Nerd)\n    Corporate\nMichael Stokesbary\
  \ (Senior Computer Wizard)\n    Engineering\nBrian Jones (Enterprise Integration\
  \ Guru)\n    Engineering\nShane Kercheval (Chief Financial Officer)\n    Finance\n\
  Pat Dever (Enterprise Architect)\n    Information Technology\nKevin Bost (Programmer\
  \ Extraordinaire)\n    Engineering\nThomas Heavey (Software Architect)\n    Engineering\n\
  Eric Edmonds (Philanthropy Coordinator)\n    Philanthropy\n\n`Join()` 的第一个参数名称为\
  \ `inner`。它指定了 `employees` 连接到的集合 `departments`。接下来的两个参数是 lambda 表达式，指定了两个集合如何连接。`employee\
  \ => employee.DepartmentId`（参数名为 `outerKeySelector`）标识了每个员工的键将是 `DepartmentId`。下一个\
  \ lambda 表达式（`department => department.Id`）指定 `Department` 的 `Id` 属性作为键——也就是说，对于每个员工，连接一个\
  \ `employee.DepartmentId` 等于 `department.Id` 的部门。最后一个参数是匿名类型，它是所选的结果项。在这种情况下，它是一个包含\
  \ `Employee` 的 `Id`、`Name`、`Title` 以及一个带有连接的 `department` 对象的 `Department` 属性的类。\n\
  \n注意输出中 `Engineering` 出现了多次——对应 `CorporateData` 中的每个员工。在这种情况下，`Join()` 调用在所有部门和所有员工之间产生了\
  \ `Cartesian product`（笛卡尔积），使得在两个集合中都存在记录且指定的部门 ID 相同的情况下，就会创建一个新记录。这种类型的连接是 `inner\
  \ join`（内连接）。\n\n数据也可以反过来进行连接，使 `department` 连接到每个员工，以便列出每个部门到员工的匹配。注意输出包含的记录比部门的数量多：每个部门都有多个员工，输出是每个匹配项的记录。正如我们之前看到的，Engineering\
  \ 部门出现了多次，每个员工出现一次。\n\n列表 14.23 中的代码（产生输出 14.9）与列表 14.22 中的类似，但对象 `Department` 和\
  \ `Employee` 的顺序反过了。`Join()` 的第一个参数是 `employees`，指示 `departments` 连接的对象。接下来的两个参数是\
  \ lambda 表达式，指定了两个集合如何连接：用于 `departments` 的 `department => department.Id` 和用于 `employees`\
  \ 的 `employee => employee.DepartmentId`。和一样，只要 `department.Id` 等于 `employee.EmployeeId`，就会发生连接。最后的匿名类型参数指定了一个具有\
  \ `int Id`、`string Name` 和 `Employee Employee` 属性的类。\n\n### 列表 14.23：使用 System.Linq.Enumerable.Join()\
  \ 的另一个内连接\n\n点击此处查看代码图像\n\n```csharp\nusing System;\n\nusing System.Linq;\n\n//\
  \ ...\n\n    Department[] departments = CorporateData.Departments;\n    Employee[]\
  \ employees = CorporateData.Employees;\n    var items = departments.Join(\n    \
  \    employees,\n        department => department.Id,\n        employee => employee.DepartmentId,\n\
  \        (department, employee) => new\n        {\n            department.Id,\n\
  \            department.Name,\n            Employee = employee\n        });\n  \
  \  foreach (var item in items)\n    {\n        Console.WriteLine(item.Name);\n \
  \       Console.WriteLine(\"\\t\" + item.Employee);\n    }\n// ...\n```\n\n### 输出\
  \ 14.9\n\n点击此处查看代码图像\n\nCorporate\n    Mark Michaelis (Chief Computer Nerd)\nFinance\n\
  \    Shane Kercheval (Chief Financial Officer)\nEngineering\n    Michael Stokesbary\
  \ (Senior Computer Wizard)\nEngineering\n    Brian Jones (Enterprise Integration\
  \ Guru)\nEngineering\n    Kevin Bost (Programmer Extraordinaire)\nInformation Technology\n\
  \    Thomas Heavey (Software Architect)\nPhilanthropy\n    Pat Dever (Enterprise\
  \ Architect)\nPhilanthropy\n    Eric Edmonds (Philanthropy Coordinator)\n\n####\
  \ 使用 GroupBy() 分组结果\n\n除了排序和连接集合之外，你经常可能想对对象的特征进行分组。对于员工数据，你可能想按部门、职位等对员工进行分组。列表\
  \ 14.24 展示了如何使用 `GroupBy()` 查询运算符来实现（请查看输出 14.10）。\n\n### 列表 14.24：使用 System.Linq.Enumerable.GroupBy()\
  \ 将项目分组\n\n点击此处查看代码图像\n\n```csharp\nusing System;\n\nusing System.Linq;\n\n// ...\n\
  \n    IEnumerable<Employee> employees = CorporateData.Employees;\n    IEnumerable<IGrouping<int,\
  \ Employee>> groupedEmployees =\n        employees.GroupBy((employee) => employee.DepartmentId);\n\
  \    foreach (IGrouping<int, Employee> employeeGroup in groupedEmployees)\n    {\n\
  \        Console.WriteLine();\n        foreach (Employee employee in employeeGroup)\n\
  \        {\n            Console.WriteLine(\"\\t\" + employee);\n        }\n    \
  \    Console.WriteLine(\"\\tCount: \" + employeeGroup.Count());\n    }\n// ...\n\
  ```\n\n### 输出 14.10\n\n点击此处查看代码图像\n\nMark Michaelis (Chief Computer Nerd)\n    Count:\
  \ 1\nMichael Stokesbary (Senior Computer Wizard)\nBrian Jones (Enterprise Integration\
  \ Guru)\nKevin Bost (Programmer Extraordinaire)\nThomas Heavey (Software Architect)\n\
  \    Count: 4\nShane Kercheval (Chief Financial Officer)\n    Count: 1\nPat Dever\
  \ (Enterprise Architect)\n    Count: 1\nEric Edmonds (Philanthropy Coordinator)\n\
  \    Count: 1\n\n注意 `GroupBy()` 调用输出的项类型为 `IGrouping<TKey, TElement>`，它具有查询分组依据的键属性（`employee.DepartmentId`）。然而，它没有组内项的属性。相反，`IGrouping<TKey,\
  \ TElement>` 派自 `IEnumerable<T>`，允许使用 `foreach` 语句枚举组内的项，或者将数据聚合为诸如项数计数（`employeeGroup.Count()`）。\n\
  \n\n\n\n\n代码 14.22 和 代码 14.23 几乎完全相同。通过更改匿名类型的定义，任何一个 `Join()` 调用都可以产生相同的输出。在尝试创建员工列表时，代码\
  \ 14.22 提供了正确的结果。`department` 最终成为每个代表已连接员工的匿名类型的属性。然而，代码 14.23 并不是最优的。鉴于对集合的支持，部门更优的表示方式应该是包含一个员工集合，而不是为每个“部门-员工”关系创建一个单个匿名类型记录。代码\
  \ 14.25 演示了这一点；输出 14.11 显示了首选的输出。\n\n### 代码 14.25：使用 System.Linq.Enumerable.GroupJoin()\
  \ 创建子集合\n\n点击此处查看代码图像\n\n```csharp\nusing System;\n\nusing System.Linq;\n\n// ...\n\
  \n    Department[] departments = CorporateData.Departments;\n\n    Employee[] employees\
  \ = CorporateData.Employees;\n    var items = departments.GroupJoin(\n        employees,\n\
  \        department => department.Id,\n        employee => employee.DepartmentId,\n\
  \        (department, departmentEmployees) => new\n        {\n            department.Id,\n\
  \            department.Name,\n            Employees = departmentEmployees\n   \
  \     });\n    foreach (var item in items)\n    {\n        Console.WriteLine(item.Name);\n\
  \        foreach (Employee employee in item.Employees)\n        {\n            Console.WriteLine(\"\
  \\t\" + employee);\n        }\n    }\n// ...\n```\n\n### 输出 14.11\n\n点击此处查看代码图像\n\
  \nCorporate\n    Mark Michaelis (首席电脑宅宅)\nFinance\n    Shane Kercheval (首席财务官)\n\
  Engineering\n    Michael Stokesbary (高级电脑魔法师)\n    Brian Jones (企业集成大师)\n    Kevin\
  \ Bost (卓越的程序员)\n    Thomas Heavey (软件架构师)\nInformation Technology\n    Pat Dever\
  \ (企业架构师)\nPhilanthropy\n    Eric Edmonds (慈善协调员)\n\n为了获得首选结果，我们使用 `System.Linq.Enumerable`\
  \ 的 `GroupJoin()` 方法。其参数与 代码 14.22 中的相同，但最后选择的匿名类型外。在 代码 14.22 中，lambda 表达式的类型为\
  \ `Func<Department, IEnumerable<Employee>, TResult>`，其中 `TResult` 是选定的匿名类型。注意，我们使用第二个类型参数（`IEnumerable<Employee>`）将每个部门的员工集合投影到结果部门匿名类型上。\n\
  \n（熟悉 SQL 的读者会注意到，与 `Join()` 不同，`GroupJoin()` 没有对应的 SQL 等效写法，因为 SQL 返回的数据是基于记录的，而不是层次结构的。）\n\
  \n### 高级主题：使用 GroupJoin() 实现外连接\n\n早早的内连接是等值连接，因为它们基于对键的评估。如果两个中都存在对象，则记录将出现在结果集合中。然而，在有时，如果相应的对象不存在，创建一个记录也是有意义的。例如，与其因为营销部门没有任何员工而从最终部门列表中删除它，不如将其包含在内并带上一个空员工列表。为了实现这一点，我们通过结合\
  \ `GroupJoin()` 和 `SelectMany()` 配合 `DefaultEmpty()` 来执行左外连接。这在 代码 14.26 和 输出 14.12\
  \ 中得到了演示。\n\n#### 代码 14.26：使用 SelectMany() 实现外连接 GroupJoin() \n\n点击此处查看代码图像\n\n\
  ```csharp\nusing System;\nusing System.Linq;\n// ...\n\n    Department[] departments\
  \ = CorporateData.Departments;\n    Employee[] employees = CorporateData.Employees;\n\
  \    var items = departments.GroupJoin(\n        employees,\n        department\
  \ => department.Id,\n        employee => employee.DepartmentId,\n        (department,\
  \ departmentEmployees) => new\n        {\n            department.Id,\n         \
  \   department.Name,\n            Employees = departmentEmployees\n        }).SelectMany(\n\
  \            departmentRecord => departmentRecord.Employees.DefaultEmpty(),\n  \
  \          (departmentRecord, employee) => new\n            {\n            departmentRecord.Id,\n\
  \            departmentRecord.Name,\n            Employees = departmentRecord.Employees\n\
  \        }).Distinct();\n    foreach (var item in items)\n    {\n        Console.WriteLine(item.Name);\n\
  \        foreach (Employee employee in item.Employees)\n        {\n            Console.WriteLine(\"\
  \\t\" + employee);\n        }\n    }\n// ...\n```\n\n### 输出 14.12\n\n点击此处查看代码图像\n\
  \nCorporate\n    Mark Michaelis (首席电脑宅宅)\nFinance\n    Shane Kercheval (首席财务官)\n\
  Engineering\n    Michael Stokesbary (高级电脑魔法师)\n    Brian Jones (企业大师)\n    Kevin\
  \ Bost (卓越的程序员)\n    Thomas Heavey (软件架构师)\nInformation Technology\n    Pat Dever\
  \ (企业架构师)\nPhilanthropy\n    Eric Edmonds (慈善协调员)\n\n#### CallingMany()\n\n有时，你可能会拥有集合的集合。代码\
  \ 14.27 提供了这种情况的示例。`teams` 数组包含两个团队，每个团队都有一个字符串数组。\n\n#### 代码 14.27：CallingMany()\n\
