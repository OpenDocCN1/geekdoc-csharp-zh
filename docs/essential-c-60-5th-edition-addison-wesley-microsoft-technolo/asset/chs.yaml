  ## 语句和语句分隔符\n\n`Main` 方法包含单条语句 `System.Console.WriteLine()`，它用于向控制台写入文本。C# 通常使用分号表示`语句`的结束，语句由代码将执行的一个或多个操作组成。声明变量、控制程序流和调用方法是语句的典型用途。\n\
