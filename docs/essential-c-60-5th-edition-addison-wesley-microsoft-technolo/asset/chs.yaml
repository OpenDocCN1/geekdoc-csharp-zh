  \ `long` 比 `double` 或 `object` 都更具体。\n\nC# 规范包含了 `byte`、`ushort`、`uint`、`ulong`\
  \ 和其他数值类型之间隐式转换的附加规则。尽管如此，使用强制类型转换来使目标方法更易识别。\n\n## 使用异常进行基础错误处理\n\n本节研究了如何通过名为**异常处理**的机制处理错误报告。\n\
  \n通过异常处理，方法可以将有关错误的信息传递给调用方法，而无需使用返回值或显式提供任何参数来实现。Listing 4.20 对来自 第 1 章 的 `HeyYou`\
  \ 程序进行了细微修改。它不再请求用户的姓氏，而是提示用户的年龄。\n\n**列表 4.20：将字符串转换为 `int`**\n\n点击此处查看代码图像\n\n\
  ***\n\n```csharp\nusing System;\n\nclass ExceptionHandling\n{\n  static void Main()\n\
  \  {\n      string firstName;\n      string ageText;\n      int age;\n      Console.WriteLine(\"\
  Hey you!\");\n      Console.Write(\"Enter your name: \");\n      firstName = Console.ReadLine();\n\
  \      Console.Write(\"Enter your age: \");\n      ageText = Console.ReadLine();\n\
  \      age = int.Parse(ageText);\n      Console.WriteLine($\"Hi {firstName}! You\
  \ are {age*12} months.\");\n  }\n}\n```\n*注：列表的输入文本具有高度重复性，我已根据提供的逻辑将其清理为功能性表示。*\n\
  \n\n\n\n```\nat System.Number.ParseInt32(String s, NumberStyles style, NumberFormatInfo\
  \ info)\nat ExceptionHandling.Main()\n```\n显然，这种错误并没有特别帮助。要修复这个问题，有必要提供一种处理错误的机制，也许是向用户报告一个更有意义的错误消息。\n\
  \n这个过程被称为`catching an exception`（捕获异常）。语法在列表 4.21 中给出，输出显示在输出 4.13 中。\n\n### 列表\
  \ 4.21: 捕获异常\n\n点击此处查看代码图像\n\n* * *\n\n```c\nusing System;\n\nclass ExceptionHandling\n\
  {\n  static int Main()\n  {\n      string firstName;\n      string ageText;\n  \
  \    int age;\n      int result = 0;\n      Console.Write(\"Enter your first name:\
  \ \");\n      firstName = Console.ReadLine();\n      Console.Write(\"Enter your\
  \ age: \");\n      ageText = Console.ReadLine();\n      try\n      {\n         \
  \ age = int.Parse(ageText);\n          Console.WriteLine(\n              $\"Hi {\
  \ firstName }! You are { age*12 } months old.\");\n      }\n      catch (FormatException\
  \ )\n      {\n          Console.WriteLine(\n              $\"The age entered, {\
  \ ageText }, is not valid.\");\n          result = 1;\n      }\n      catch(Exception\
  \ exception)\n      {\n          Console.WriteLine(\n              $\"Unexpected\
  \ error:  { exception.Message }\");\n          result = 1;\n      }\n      finally\n\
  \      {\n          Console.WriteLine($\"Goodbye { firstName }\");\n      }\n  \
  \    return result;\n  }\n}\n```\n\n* * *\n\n### 输出 4.13\n\n点击此处查看代码图像\n\n```\n\
  Enter your first name: Inigo\nEnter your age: forty-two\nThe age entered, forty-two,\
  \ is not valid.\nGoodbye Inigo\n```\n\n首先，将可能抛出异常的代码（`age = int.Parse()`）包裹在 `try\
  \ block` 中。该块以 `try` 关键字开始。它告诉编译器，开发者已经意识到块中的代码可能会抛出异常，而且如果真的抛出了异常，其中一个 `catch blocks`\
  \ 将尝试处理该异常。\n\n一个或多个 `catch blocks`（或 `finally block`）必须紧跟在在 `try block` 之后。`catch`\
  \ 块的头部（参见本章后面题为“通用 `catch`”的高级主题）可选地允许你指定异常的数据类型，只要数据类型与异常类型匹配，`catch` 块就会执行。然而，如果没有适当的\
  \ `catch` 块，异常将向下传递并保持未处理状态，就像没有进行异常处理一样。结果控制流出现在下一页的图 4.1 中。\n\n![图像](img/04fig01.jpg)\n\
  \n### 图 4.1: 异常处理程序流\n\n例如，假设用户在上一个示例中为年龄输入了“forty-two”。在这种情况下，`int.Parse()` 将抛出一个类型为\
  \ `System.FormatException` 的异常，控制将跳转到一组 `catch` 块（`System.FormatException` 表示字符串的格式不符合解析的格式）。由于第一个\
  \ `catch` 块与 `int.Parse()` 抛出的异常类型匹配，因此该块内部的代码将执行。如果 `try` 块中的语句抛出了不同的异常，则会执行第二个\
  \ `catch blocks` 块，因为所有异常都是 `System.Exception` 类型。\n\n如果没有 `System.FormatException`\
  \ `catch` 块，尽管 `int.Parse` 抛出了 `System.FormatException`，`System.Exception` `catch`\
  \ 块也会执行。这是因为 `System.FormatException` 也是 `System.Exception` 类型（`System.FormatException`\
  \ 是泛型异常 `System.Exception` 的一个更具体的实现）。\n\n你处理异常的顺序非常重要。`catch` 块必须按照从具体到不具体的顺序出现。`System.Exception`\
  \ 数据类型是最具体的，因此它最后出现。`System.FormatException` 优先出现是因为它是列表 4.21 所处理的最具体的异常。\n\n无论控制是正常离开\
  \ `try block` 还是因为 `try block` 中的代码抛出异常而离开，`finally block` 中的代码都会在控制离开 `try` 保护区域后执行。`finally\
  \ block` 的目的是提供一个位置，用于放置无论 `try/catch` 块如何退出（无论是否有异常）都会执行的代码。`finally` 块对于无论是否抛出异常清理资源都有用。事实上，可以存在一个带有\
  \ `finally block` 但没有 `catch block` 的 `try block`。无论 `try block` 是否抛出异常，或者无论是否编写了处理异常的\
  \ `catch block`，`finally block` 块都会执行。列表 4.22 演示了 `try/finally` 块，输出 4.14 显示了结果。\n\
  \n### 列表 4.22: 没有 Catch 块的 Finally Block\n\n点击此处查看代码图像\n\n* * *\n\n```c\nusing System;\n\
  \nclass ExceptionHandling\n{\n  static int Main()\n  {\n      string firstName;\n\
  \      string ageText;\n      int age;\n      int result = 0;\n      Console.Write(\"\
  Enter your first name: \");\n      firstName = Console.ReadLine();\n      Console.Write(\"\
  Enter your age: \");\n      ageText = Console.ReadLine();\n      try\n      {\n\
  \          age = int.Parse(ageText);\n          Console.WriteLine(\n           \
  \   $\"Hi { firstName }! You are { age*12 } months old.\");\n      }\n      finally\n\
  \      {\n          Console.WriteLine($\"Goodbye { firstName }\");\n      }\n  \
  \    return result;\n  }\n}\n```\n\n* * *\n\n### 输出 4.14\n\n点击此处查看代码图像\n\n```\n\
  Enter your first name: Inigo\nEnter your age: forty-two\nUnhandled Exception: System.FormatException:\
  \ Input string was not in a correct format.\n  at System.Number.StringToNumber(String\
  \ str, NumberStyles options, NumberBuffer& number, NumberFormatInfo info, Boolean\
  \ parseDecimal)\n  at System.Number.ParseInt32(String s, NumberStyles style, NumberFormatInfo\
  \ info)\n  at ExceptionHandling.Main()\nGoodbye Inigo\n```\n\n留心的读者会注意到这里有一个有趣的现象：运行时首先报告了未处理的异常，然后运行了\
  \ `finally` 块。这种异常行为如何解释？\n\n首先，这种行为是合法的，因为当异常未处理时，运行时的行为是由实现定义的；任何行为都是合法的！运行时选择这种特定的行为是因为它在选择运行\
  \ `finally` 块之前就已经知道异常将未被处理；运行时已经检查了调用栈上所有的激活帧，并确定没有一个帧与匹配该异常的 `catch` 块相关联。\n\n\
  \n\n\n从 C# 2.0 开始，所有作为异常出的对象都派生自 `System.Exception`。（从其他语言抛出的未派生自 `System.Exception`\
  \ 的对象会被一个派生自该类的对象自动“包装”。）因此，它们可以被 `catch(System.Exception exception)` 块处理。然而，最好包含一个针对最派生类型的特定\
  \ catch 块（例如 `System.FormatException`），因为这样可以获取有关异常的最详细信息，并以不那么通用的方式进行处理。这样做，使用最派生类型的\
  \ `catch` 语句能够特异地处理异常类型，访问与抛出的异常相关的数据，并避免用于判断发生了什么异常类型的条件逻辑。\n\n这就是为什么 C# 强制规定 catch\
  \ 块必须从最派生到最派生的顺序出现。例如，捕获 `System.Exception` 的 `catch` 语句不能出现在捕获 `System.FormatException`\
  \ 的语句之前，因为 `System.FormatException` 派生自 `System.Exception`。\n\n***\n\n方法可能会抛出许多异常类型。表\
  \ 4.2 列出了框架内一些较常见的异常。\n\n![Image](img/04tab02.jpg)![Image](img/04tab02a.jpg)\n\n\
  **表 4.2：常见异常类型**\n\n***\n\n### 高级主题：通用 catch\n\n可以指定一个不参数的 catch 块，如列表 4.23 所示。\n\
  \n**列表 4.23：通用 catch 块**\n\n点击此处查看代码图像\n\n***\n\n...\n\n```csharp\ntry\n{\n    age\
  \ = int.Parse(ageText);\n    System.Console.WriteLine(\n        $\"Hi { firstName\
  \ }  You are { age*12 } months old.\");\n}\ncatch (System.FormatException exception)\n\
  {\n    System.Console.WriteLine(\n        $\"The age entered { ageText }, is not\
  \ valid.\");\n    result = 1;\n}\ncatch(System.Exception exception)\n{\n    System.Console.WriteLine(\n\
  \        $\"Unexpected error: { exception.Message }\");\n    result = 1;\n}\ncatch\n\
  {\n    System.Console.WriteLine(\"Unexpected error!\");\n    result = 1;\n}\nfinally\n\
  {\n    System.Console.WriteLine($\"Goodbye { firstName }\");\n}\n```\n\n...\n\n\
  ***\n\n没有数据类型的 catch 块被称为**通用 catch 块**，它等同于指定一个接受 `object` 数据类型的 catch 块——例如，`catch(object\
  \ exception){}`。由于所有类最终都派生自 `object`，因此没有数据类型的 catch 块必须最后出现。\n\n通用 catch 块很少使用，因为没有办法捕获任何关于异常的信息。此外，C#\
  \ 不支持抛出 `object` 类型的异常。（只有用 C++ 等语言编写的库允许任何类型的异常。）\n\n#### 开始 2.0\n\n从 C# 2.0 开始的行为与早期的\
  \ C# 行为略有不同。在 C# 2.0 中，如果语言允许抛出非 `System.Exception` 异常，则抛出的异常对象将被包装在 `System.Runtime.CompilerServices.RuntimeWrappedException`\
  \ 中，该异常确实派生自 `System.Exception`。因此，所有异常无论是否派生自 `System.Exception`，都会传播到 C# 程序集中，就像它们派生自\
  \ `System.Exception` 一样。\n\n结果是，`System.Exception` catch 块将捕获所有之前的块未捕获的异常，而跟在 `System.Exception`\
  \ catch 块之后的通用 catch 块将永远不会被调用。因此，在 C# 2.0 或更高版本中，在 System.Exception catch 块之后跟会导致编译器警告，指示通用\
  \ catch 块将不会执行。\n\n#### 结束 2.0\n\n***\n\n### 指南\n\n- **避免**使用通用 catch 块，并将其替换为对\
  \ `System.Exception` 的捕获。\n- **避免**捕获不知道相应操作的异常。让异常保持未处理状态比错误地处理它更好。\n- **避免**在重新抛出异常之前捕获并记录异常。相反，让异常逃逸，直到它可以被恰善处理为止。\n\
  \n***\n\n***\n\n#### 使用 throw 语句报告错误\n\nC# 允许开发者从代码中抛出异常，如列表 4.24 所示。\n\n**列表 4.24：抛出异常**\n\
  \n![Image](img/04tab02.jpg)\n\n**输出 4.15**\n\n点击此处查看代码图像\n\n如列表 4.24 中的箭头所示，抛出异常会导致执行从抛出异常的地方跳转到与该异常兼容的第一个\
  \ catch 块。\n\n要抛出异常，需要一个异常实例。列表 4.24 使用 `new` 关键字后跟异常类型创建实例。大多数异常类型允许在抛出异常时生成消息。\n\
  \n有时 catch 块会捕获异常但无法处理或无法完全处理它。在这种情况下，catch 块可以使用 `throw` 语句重新抛出异常而无需指定任何内容，如列表\
  \ 4.25 所示。\n\n```csharp\ntry\n{\n    // ... 代码 ...\n}\ncatch(Exception exception)\n\
  {\n    System.Console.WriteLine(\n        $\"Rethrowing unexpected error: {\n  \
  \          exception.Message }\");\n    throw;\n}\n```\n\n...\n\n\n\n\n开发者应努力避免为预期的情况或正常的控制流抛出异常。例如，开发者不应预期用户在指定年龄时会输入有效的文本。因此，开发者不应该依赖异常来验证用户输入的数据，而应该在尝试转换之前提供一种检查数据的方法。（更好情况下，他们应该从源上防止用户输入无效数据。）异常专门设计用于追踪异常的、意料之外且可能是致命的情况。将它们用于非预期之外的用途（如预期情况）将导致你的代码难以阅读、理解和维护。\n\
  \n总来说，开发者应该预料用户会执行意料之外的操作，因此他们应该编写防御性代码来处理“愚蠢用户的技巧”。\n\n此外，与大多数语言一样，C#` 在抛出异常时会产生轻微的性能损耗——花费的时间是微秒级，而大多数操作只需要纳秒。这种延迟在人类感知的时间范围内通常是察觉不到的——除非异常未被处理。例如，当执行\
  \ ` 4.20` 且用户输入了无效年龄时，异常未被处理，运行时在搜索环境以查看是否有调试器可以加载时，会有明显的延迟。幸运的是，程序关闭时的性能缓慢通常不是需要担心的因素。\n\
  \n### 指南\n\n**不要**使用异常来处理正常的、预期的情况；将异常用于异常的、意外之外的情况。\n\n`Begin 2.0`\n\n### 高级主题：使用\
  \ TryParse() 进行数值转换\n\n`Parse()` 方法的问题之一是，确定转换是否成功的唯一方法是尝试强制转换并在失败时捕获异常。由于抛出异常是一个相对昂贵的操作，最好在不使用异常处理的情况下尝试转换。在\
  \ C# 的第一个版本中，唯一支持这种行为的数据类型是名为 `double.TryParse()` 的 `double` 方法。然而，CLI 在 2.0 版本中为所有数值原始类型添加了这个方法。它要求使用\
  \ `out` 关键字，因为 `TryParse()` 函数返回的是 `bool` 而不是转换后的值。`4.26` 是演示使用 `int.TryParse()`\
  \ 进行转换的代码片段。\n\n**列表 4.26：使用 int.TryParse() 进行转换**\n\n[点击此处查看代码图像]\n\n```c\nif (int.TryParse(ageText,\
  \ out age))\n{\n    Console.WriteLine(\n        $\"Hi { firstName }!  \"\n     \
  \   + $\"You are { age*12 } months old.\");\n}\nelse\n{\n    Console.WriteLine(\n\
  \        $\"The age entered, { ageText }, is not valid.\");\n}\n```\n\n在 .NET Framework\
  \ 4 中，枚举类型也添加了 `TryParse()` 方法。通过 `TryParse()` 方法，不再需要仅仅为了处理字符串到数值的转换而包含 try/catch\
  \ 块。\n\n`End 2.0`\n\n### 总结\n\n本章讨论了声明和调用方法的细节，包括使用 `out` 和 `ref` 关键字传递变量而不是其值。除了方法声明，本章还引入了异常处理。\n\
  \n方法是编写可读代码的关键基础结构。你不应该编写包含大量语句的大方法，而应该使用方法在代码中创建“段落”，这些段落的长度大约为 10 条语句更少。将大函数拆分为较小部分是重构代码使其更具可读性和可维护的方法之一。\n\
  \n下一章将考虑类结构，并描述它如何将方法（行为）和字段（数据）封装到单个单元中。\n\n# 5. 类\n\n你在第 1 章中简要看了如何声明一个名为 `HelloWorld`\
  \ 的新类。在第 2 章中，你学习了 C# 包含的原始类型。既然你现在也学习了控制流和如何声明方法，是时候讨论定义自己的类型了。这是任何 C# 程序的核心结构；对类以及从类中创建的对象的支持使得\
  \ C# 成为一种面向对象的语言。\n\n![图像](img/0217fig01.jpg)\n\n本章介绍了使用 C# 进行面向对象编程的基础。一个重点是如何定义类，类是对象本身的模板。\n\
  \n之前章节中结构化编程的所有结构在面向对象编程中仍然适用。然而，通过将这些结构封装在类中，你可以创建更大、更有组织且更易维护的程序。从基于控制流的结构化程序向面向对象程序的转变彻底彻底改变了编程，因为它提供了额外的组织层级。结果是小型程序在某种程度上得到了简化。更重要的是，创建更大的程序变得更容易了，因为程序内部的代码结构组织得更好。\n\
  \n面向对象编程的优势之一是，你可以不必从头创建新程序，而是从之前的工作组合现有对象的集合，用新功能扩展类，添加更多类，从而提供新功能。\n\n不熟悉面向对象编程的读者应该阅读“初学者主题”区块以入门。初学者主题之外的正文侧重于使用\
  \ C# 进行面向对象编程，假设读者已经熟悉面向对象概念。\n\n本章深入探讨了 C# 如何通过支持类、属性和访问修饰符等结构来支持封装；我们在上一章中涵盖了方法。下一章将在此基础之上，引入了面向对象编程所实现的继承和多态。\n\
  \n### 初学者主题：面向对象编程\n\n今天成功编程的关键在于能够为大型应用程序复杂需求的实现提供组织和结构。面向对象编程是实现这一目标的关键方法之一，以至于面向对象的程序员很难想象回到结构化编程，除非是极微不足道的程序。\n\
  \n面向对象编程中最基础的结构是类。一组类构成了对现实世界概念的编程抽象、模型或模板。例如，`OpticalStorageMedia` 类可能有一个 `Eject()`\
  \ 方法，导致磁盘从播放器中弹出。`OpticalStorageMedia` 类是现实世界 CD 或 DVD 播放对象的编程抽象。\n\n类体现了面向对象编程的三大主要特征：封装、继承和多态。\n\
  \n#### 封装\n\n封装允许你隐藏细节。在需要时仍然可以访问细节，但通过智能地封装细节，大型程序变得更容易理解，数据受到保护防止意外修改，并且代码变得更于维护，因为代码更改的影响被限制在封装范围内。方法是封装的示例。虽然可以从方法中提取代码并直接嵌入到调用者的代码中，但将代码重构为方法提供了封装的好处。\n\
  \n## 继承\n\n\n\n\n考虑以下示例：DVD 驱动器是一种光介质设备。它具有特定的存储容量，并具有存储数字电影的能力。CD 驱动器也是一种光介质设备，但它具有不同的特性。CD\
  \ 的复制保护与 DVD 的复制保护不同，存储容量也不同。CD 驱动器和 DVD 驱动器都与硬盘、USB 驱动器和软盘（还记得它们吗？）不同。它们都属于存储设备范畴，但每种设备都有特殊的特性，即使对于基本功能（例如支持的文件系统以及介质实例是只读还是读写）也是如此。\n\
  \n面向对象编程中的继承允许你在这些相似但不同的项建立“是一种”（is a kind of）的关系。可以说，DVD 驱动器“是一种”存储介质，CD 驱动器“是一种”存储介质，因此，它们都具有存储容量。我们也可以合理地说，它们与“光存储介质”都具有“是一种”的关系，而光存储介质反过来“是一种”存储介质。\n\
  \n如果你为提到的每种存储设备定义相应的类，你就定义了一个 `class hierarchy`（类层次结构），它是一系列“是一种”的关系。所有存储设备派生的基类可以是\
  \ `StorageMedia` 类。因此，代表 CD 驱动器、DVD 驱动器、硬盘、USB 驱动器和软盘的类都派生自 `StorageMedia` 类。然而，CD\
  \ 和 DVD 驱动器的类不需要直接派生自 `StorageMedia`。相反，它们可以派生自中间类 `OpticalStorageMedia`。你可以使用类似于统一建模语言（UML）的类图图形化地查看类层次结构，如图\
  \ 5.1 所示。\n\n![Image](img/05fig01.jpg)\n\n**图 5.1：类层次结构**\n\n继承关系涉及至少两个类，其中一个类是另一个类的更具体的类型；在图\
  \ ch05.html_ch05fig01)中，`HardDrive` 是 `StorageMedia` 更具体的类型。虽然专门的类型 `HardDrive`\
  \ 是 `StorageMedia` 的一种，但反过来却不然——也就是说，`StorageMedia` 的实例并不一定是 `HardDrive`。如[图 5.1\
  \ 所示，继承可以涉及两个以上的类。\n\n更专门的类型被称为 `derived type`（派生类型）或 `subtype`（子类型）。更通用的类型被称为 `base\
  \ type`（基类型）或 `super type`（超类型）。基类型通常称为“父”类型，其派生类型称为“子”类型。虽然这种用法常见，但可能会引起混义：毕竟，孩子不是父母的一种！在书中，我们将坚持使用“派生类型”和“基类型”。\n\
  \n`derive`（派生）或 `inherit`（继承）另一种类型是对该类型进行 `specialize`（专门化），这意味着自定义基类型使其更适用于特定目的。基类型可能包含所有派生类型共有的实现细节。\n\
  \n继承的关键特征是所有派生类型都继承基类的成员。通常，可以修改基类成员的实现，但无论如何，派生类型除了基类的成员外，还包含了派生类型显式包含的任何成员。\n\n\
  派生类型允许你将类组织成连贯的层次结构，其中派生类型比其基类型具有更高的特殊性。\n\n## 多态\n\n**Polymorphism**（多态）由 `poly`（意为多）和\
  \ `morph`（意为形式）组成。在对象的语境下，多态意味着单个方法或类型可以有许多实现形式。\n\n假设你有一个媒体播放器，可以播放 CD 音乐光盘也可以播放包含\
  \ MP3 的 DVD。然而，`Play()` 方法的具体实现将取决于介质类型。在代表音乐 CD 的对象上或代表音乐 DVD 的对象上调用 `Play()`，在在这两种情况下都会播放音乐，因为每个对象的类型都理解播放的复杂之处。媒体播放器所知的只是共同的基类型\
  \ `OpticalStorageMedia` 以及它定义了 `Play()` 方法这一事实。多态性的原则是，一个类型可以处理方法实现的具体细节，因为该方法出现在多个派生类型中，而每个派生类型都共享一个共同的基类型（或接口），该接口也包含相同的方法签名。\n\
  \n***\n\n## 类的声明与实例化\n\n定义类首先需要指定关键字 `class`，随后是标识符，如列表 5.1 所示。\n\n**列表 5.1：定义类**\n\
  \n```\nclass Employee\n{\n\n}\n```\n\n***\n\n所有属于类的代码都将出现在类声明后的大括号之间。虽然不是强制要求，但通常你会将每个类放在它自己的文件中。这使得更容易找到定义特定类的代码，因为惯例是使用类名命名文件。\n\
  \n***\n\n### 指南\n\n- **不要**在单个源文件中放置多个类。\n- **务必**使用其所包含的公共类型名称来命名源文件。\n\n***\n\n\
  一旦你定义了一个新类，你就可以像它是内置于框架中一样使用该类。换句话说，你可以声明该类型的变量，或定义一个接受新类类型作为参数的方法。列表 5.2 演示了此类声明。\n\
  \n**列表 5.2：声明类型变量**\n\n```\nclass Program\n{\n    static void Main()\n    {\n  \
  \      Employee employee1 = new Employee();\n        // ...\n\n        Employee\
  \ employee2;\n        employee2 = new Employee();\n        // ...\n    }\n\n   \
  \ static void IncreaseSalary(Employee employee)\n    {\n        // ...\n    }\n\
  }\n```\n\n***\n\n### 初学者主题：对象与类\n\n在日常对话中，*class*和*object*这两个术语交替出现。然而，对象和类有不同的含义。`class`\
  \ 是对象外观的模板。因此，`object` 是类的实例。类就像是组件的模具。从类创建对象的过程被称为 **instantiation**（实例化）。\n\n\
  现在你已经定义了一个新类，是时候实例化对象了。模仿先驱，C# 使用 `new` 关键字来实例化对象（参见列表 5.3](#ch05.html_ch05lis03)）。\n\
  \n**列表 5.3：实例化类**\n\n```\nclass Program\n{\n    static void Main()\n    {\n    \
  \    Employee employee1 = new Employee();\n        // ...\n\n        Employee employee2;\n\
  \        employee2 = new Employee();\n        // ...\n\n        IncreaseSalary(employee1);\n\
  \    }\n}\n```\n\n***\n\n***\n\n\n\n\n在这个简单的示例中，`Employee` 没有关联任何显式的数据或方法，这使得该对象基本上无用武处。下一节将重点讨论如何向对象中添加数据。\n\
  \n## 初学者主题：封装部分 1：对象通过方法对数据分组\n\n如果你收到一叠员工名字的索引片、一叠姓氏的索引片以及一叠工资的索引片，除非你知道这些卡片在每叠中的排列顺序是一致的，否则这些卡片几乎没有价值。即便如此，处理这些数据也会很困难，因为确定一个人的全名需要搜索两叠卡片。糟糕糟糕，如果你掉了其中一叠卡片，将无法将名字、姓氏和工资重新关联。相反，你需要一个员工卡片堆，所有数据都分组在一张卡片上。通过这种方法，名字、姓氏和工资将被封装在一起。\n\
  \n在面向对象编程的语境之外，`encapsulate`（封装）一组项目意味着是将这些项目封装在一个胶囊内。同样，面向对象编程将方法和数据共同封装在一个对象中。这为所有类\
  \ `members`（成员，类内部的数据和方法）提供了分组，使得它们不再需要逐个处理。对象不再将名字、姓氏和工资作为三个独立的参数传递给方法，而是允许调用传递一个对员工对象的引用。一旦调用的方法接收到对象引用，它就可以向对象发送消息（例如，它可以调用\
  \ `AdjustSalary()` 等方法）来执行特定操作。\n\n## 语言对比：C++—delete 运算符\n\nC# 程序员应该将 `new` 运算符视为实例化对象的调用，而不是分配内存的调用。分配在堆上的对象和分配在栈上的对象都支持\
  \ `new` 运算符，这强调了这一点：`new` 与内存分配如何发生以及是否需要释放无关。\n\n因此，C# 不需要 C++ 中的 `delete` 运算符。内存的分配和释放是由运行时管理的细节，允许开发者更多地关注领域逻辑。然而，尽管内存由运行时管理，但运行时并不管理其他资源，如数据库连接、网络端口等。与\
  \ C++ 不同，C# 不支持 `implicit deterministic resource cleanup`（隐式确定性资源清理，即在代码中编译定义的范围内发生隐式对象析构）。幸运的是，C#\
  \ 通过 `using` 语句支持 `explicit deterministic resource cleanup`（显式确定性资源清理），并使用终结器支持\
  \ `implicit nondeterministic resource cleanup`（隐式非确定性资源清理）。\n\n## 实例字段 (Instance\
  \ Fields)\n\n面向对象设计的关键方面之一是对数据分组以提供结构。本节讨论了如何向 `Employee` 类添加数据。类内部存储数据的变量通用面向对象术语是\
  \ `member variable`（成员变量）。这个术语在 C# 中很容易理解，但更标准且规范使用的术语是 `field`（字段），它是与包含类型关联的命名存储单元。`Instance\
  \ fields`（实例字段）是在类级别声明的用于存储与对象关联数据的变量。因此，`association`（关联）是字段类型与包含字段之间的关系。\n\n###\
  \ 声明实例字段\n\n在 Listing 5.4 中，`Employee` 类已被修改包含三个字段：`FirstName`、`LastName` 和 `Salary`。\n\
  \n**列表 5.4：声明字段**\n\n点击此处查看代码图像\n\n```csharp\nclass Employee\n{\n  public string\
  \ FirstName;\n  public string LastName;\n  public string Salary;\n}\n```\n\n添加这些字段后，就可以为每个\
  \ `Employee` 实例存储一些基础数据。在这种情况下，我们在字段前加上了 `public` 访问修饰符。在字段上使用 `public` 表示字段内的数据可以从\
  \ `Employee` 类以外的类访问（参见本章后面的“Access Modifiers”节）。\n\n与局部变量声明一样，字段声明包含了字段所引用的数据类型。此外，可以在声明时为字段分配初始值，如\
  \ Listing 5.5 中的 `Salary` 字段所示。\n\n**列表 5.5：在声明时设置字段的初始值**\n\n点击此处查看代码图像\n\n```csharp\n\
  class Employee\n{\n  public string FirstName;\n  public string LastName;\n  public\
  \ string Salary = \"Not enough\";\n}\n```\n\n我们将字段的命名和编码指南延迟到本章晚些部分，即在引入 C# 属性之后。只需说明，Listing\
  \ 5.5 并没有遵循通用约定。\n\n### 访问实例字段\n\n你可以设置和检索字段中的数据。然而，字段不包含 `static` 修饰符这一事实表明它是一个实例字段。你只能通过包含类的实例（一个对象）访问实例字段。你不能直接从类访问它（不创建实例的情况下）。Listing\
  \ 5.6 显示了 `Program` 类及其对 `Employee` 类使用的最新视图，而 Output 5.1 显示了结果。\n\n**列表 5.6：访问字段**\n\
  \n点击此处查看代码图像\n\n```csharp\nclass Program\n{\n  static void Main()\n  {\n    Employee\
  \ employee1 = new Employee();\n    Employee employee2 = new Employee();\n    employee1.FirstName\
  \ = \"Inigo\";\n    employee1.LastName = \"Montoya\";\n    employee1.Salary = \"\
  Too Little\";\n    IncreaseSalary(employee1);\n    Console.WriteLine(\"{0} {1}:\
  \ {2}\",\n      employee1.FirstName,\n      employee1.LastName,\n      employee1.Salary);\n\
  \    // ...\n  }\n\n  static void IncreaseSalary(Employee employee)\n  {\n    employee.Salary\
  \ = \"Enough to survive\";\n  }\n}\n```\n\n**输出 5.1**\n\nInigo Montoya: Enough to\
  \ survive\n\n\n\n\n\n```csharp\npublic string LastName;\n\npublic string Salary;\n\
  \npublic string GetName()\n{\n    return $\"{ FirstName } { LastName }\";\n}\n```\n\
  \n与你在第 4 章中学习到的内容相比，这个方法并没有特别之处，除非现在 `GetName()` 方法访问的是对象上的字段，而不仅仅是局部变量。此外，该方法的声明没有标记为\
  \ `static`。正如你在本章稍后部分将看到的，静态方法无法直接访问类中的实例字段。相反，必须获取类的实例才能调用任何实例成员（无论是方法还是字段）。\n\n\
  鉴于添加了 `GetName()` 方法，你可以更新 `Program.Main()` 来使用该方法，如列表 5.8 和输出 5.2 所示。\n\n**代码列表\
  \ 5.8：从包含类的外部访问字段**\n\n点击此处查看代码图片\n\n```csharp\nclass Program\n{\n    static void\
  \ Main()\n    {\n        Employee employee1 = new Employee();\n        Employee\
  \ employee2;\n        employee2 = new Employee();\n        employee1.FirstName =\
  \ \"Inigo\";\n        employee1.LastName = \"Montoya\";\n        employee1.Salary\
  \ = \"Too Little\";\n        IncreaseSalary(employee1);\n        Console.WriteLine($\"\
  { employee1.GetName()}: { employee1.Salary }\");\n        // ...\n    }\n    //\
  \ ...\n}\n```\n\n**输出 5.2**\n\n点击此处查看代码图片\n\nInigo Montoya: Enough to survive on\n\
  \n### 使用 this 关键字\n\n你可以从属于该类的实例成员内部获取该类的引用。在 C# 中，为了显式表示访问的字段或方法是包含类的实例成员，你需要使用\
  \ `this` 关键字。在调用任何实例成员时，`this` 的使用是隐式的，它返回对象本身的实例。\n\n例如，考虑列表 5.9 所示的 `SetName()`\
  \ 方法。\n\n**代码列表 5.9：使用 this 显式标识字段所有者**\n\n点击此处查看代码图片\n\n```csharp\nclass Employee\n\
  {\n    public string FirstName;\n    public string LastName;\n    public string\
  \ Salary;\n    public string GetName()\n    {\n        return $\"{ FirstName } {\
  \ LastName }\";\n    }\n    public void SetName(string newFirstName, string newLastName)\n\
  \    {\n        this.FirstName = newFirstName;\n        this.LastName = newLastName;\n\
  \    }\n}\n```\n\n此示例使用 `this` 关键字来指示字段 `FirstName` 和 `LastName` 是类的实例成员。\n\n尽管\
  \ `this` 关键字可以作为任何所有类局部成员引用的前缀，但通常原则是在没有额外价值时不让代码变得混乱。因此，除非需要，否则应避免使用 `this` 关键字。列表\
  \ 5.12（本章稍后出现）是少数存在此类需求的情况的一个示例。然而，列表 5.9 和 5.10 并不是好的例子。在列表 5.9 中，完全可以去掉 `this`\
  \ 而不改变代码的含义。在列表 5.10 接下来介绍）中，通过更改字段的命名约定，我们可以避免局部变量和字段之间的任何歧义。\n\n### 初学者主题：依赖编码风格来避免歧义\n\
  \n在 `SetName()` 方法中，你不需要使用 `this` 关键字，因为 `FirstName` 显然不同于 `newFirstName`。但假设你没有将参数命名为“newFirstName”，而是命名为“FirstName”（使用\
  \ PascalCase 命名法），如列表 5.10 所示。\n\n**代码列表 5.10：使用 this 避免歧义**\n\n点击此处查看代码图片\n\n```csharp\n\
  class Employee\n{\n    public string FirstName;\n    public string LastName;\n \
  \   public string Salary;\n    public string GetName()\n    {\n        return $\"\
