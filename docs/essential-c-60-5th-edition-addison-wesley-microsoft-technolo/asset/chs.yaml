  - async\n- await\n- by\n- descending\n- dynamic\n- equals\n- from\n- get\n- global\n\
  - group\n\n`group` 子句产生一个生成 `IGrouping<TKey, TElement>` 对象集合的查询——就像 `GroupBy()`\
  \ 标准查询运算符所做（参见第 14 章）。后续查询中的 `select` 子句使用匿名类型有效地将 `IGrouping<TKey, TElement>.Key`\
  \ 重命名为 `IsContextualKeyword`，并将子集合属性命名为 `Items`。通过此更改，嵌套的 `foreach` 循环使用 `wordGroup.Items`\
  \ 而不是直接使用 `wordGroup`，如列表 15.10 所示。匿名类型可以添加的另一个潜在属性是子集合中项的计数。此功能已经可以通过 `wordGroup.Items.Count()`\
  \ 实现，因此直接在匿名类型中添加它的用处尚存疑虑。\n\n### 使用 into 延续查询\n\n正如我们在列表 15.11 中所所示的你可以将一个现有的查询作为第二个查询的输入。然而，当你想要将一个查询的结果作为另一个查询的输入时，并没有必要编写一个完全新的查询表达式。你可以使用上下文关键字\
  \ `into` 通过**查询延续子句**来扩展任何查询。查询延续仅仅是创建两个查询并将第一个作为第二个的输入的语法糖。由 `into` 子句引入的范围变量（列表\
  \ 15.11 中的 `groups`）成为查询剩余部分的范围变量；任何之前的范围变量在逻辑上都是较早查询的一部分，不能在查询延续中使用。列表 15.12 展示了如何重写列表\
  \ 15.11 的代码，以使用查询延续而不是两个查询。\n\n**列表 15.12：不使用查询延续进行选择**\n\n```csharp\nusing System;\n\
  using System.Collections.Generic;\nusing System.Linq;\n\n// ...\n\nprivate static\
  \ void GroupKeywords()\n{\n    var selection =\n        from word in Keywords\n\
  \        group word by word.Contains('*')\n        into groups\n        select new\n\
  \        {\n            IsContextualKeyword = groups.Key,\n            Items = groups\n\
  \        };\n    // ...\n}\n// ...\n```\n\n### 使用多个 from 子句“平坦化”序列的序列\n\n通常我们希望将序列序列“平坦化”为单个序列。例如，客户序列的每个成员都可能有一个关联的订单序列，或者目录序列的每个成员都可能有一个关联的文件序列。`SelectMany`\
  \ 序列运算符（在第 14 章中讨论）将子序列拼接在一起；要使用查询表达式语法实现相同的操作，可以使用多个 `from` 子句，如列表 15.13 所示。\n\n\
  **列表 15.13：多选择**\n\n```csharp\nvar selection =\n    from word in Keywords\n    from\
  \ character in word\n    select character;\n```\n\n前面的查询将产生字符序列 `a`, `b`, `s`, `t`,\
  \ `r`, `a`, `c`, `t`, `a`, `d`, d, `*`, `a, l`, i, a, ....\n\n多个 `from` 子句也可用于生成**笛卡尔积**——多个序列之间所有可能的组合的集合——如列表\
  \ 15.14 所示。\n\n**列表 15.14：笛卡尔积**\n\n```csharp\nvar numbers = new[] { 1, 2, 3 };\n\
  var product =\n    from word in Keywords\n    from number in numbers\n    select\
  \ new {word, number};\n```\n\n这将产生一个元对序列（(`abstract`, `1`), (`abstract`, `2`), (`abstract`,\
  \ `3`), (`as`, `1`), (`as`, `2`), ....\n\n### 主题：去重成员\n\n通常，我们希望从集合中返回去重（即唯一）项，丢弃任何重复项。查询表达式没有去重成员的显式语法，但该功能可以通过查询运算符\
  \ `Distinct()` 实现，该运算符是在第 14 章中引入的。要把查询运算符应用于查询表达式，必须将表达式括括起来，以便编译器不会认为对 `Distinct()`\
  \ 的调用是 `select` 子句的一部分。列表 15.15 给出了一个示例；输出 15.8 显示了结果。\n\n**列表 15.15：从查询表达式获取去重成员**\n\
  \n```csharp\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
  \npublic static void ListMemberNames()\n{\n    IEnumerable<string> enumerableMethodNames\
  \ = (\n        from method in typeof(Enumerable).GetMembers(\n            System.Reflection.BindingFlags.Static\
  \ |\n            System.Reflection.BindingFlags.Public)\n    );\n}\n```\n\n\n\n\n\
  \n```csharp\norderby method.Name\nselect method.Name).Distinct();\nforeach(string\
  \ method in enumerableMethodNames)\n{\n    Console.Write($\"{ method }, \");\n}\n\
  // ...\n```\n\n* *\n\n**输出 15.8**\n\n点击此处查看代码图像\n\nAggregate, All, Any, AsEnumerable,\
  \ Average, Cast, Concat, Contains, Count, DefaultIfEmpty, Distinct, ElementAt, ElementAtOrDefault,\
  \ Empty, Except, First, FirstOrDefault, GroupBy, GroupJoin, Intersect, Join, Last,\
  \ LastOrDefault, LongCount, Max, Min, OfType, OrderBy, OrderByDescending, Range,\
  \ Repeat, Reverse, Select, SelectMany, SequenceEqual, Single, SingleOrDefault, Skip,\
