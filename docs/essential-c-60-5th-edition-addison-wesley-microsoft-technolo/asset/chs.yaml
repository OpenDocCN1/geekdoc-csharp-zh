  - class\n- const\n- continue\n- decimal\n- default\n- delegate\n- do\n- double\n\
  - else\n- enum\n- event\n- extern\n- false\n- finally\n- fixed\n- float\n- for\n\
  - foreach\n- goto\n- if\n- implicit\n- in\n- int\n- interface\n- internal\n- is\n\
  - lock\n- long\n- namespace\n- new\n- null\n- operator\n- out\n- object\n- params\n\
  - private\n- protected\n- public\n- readonly\n- ref\n- return\n- sbyte\n- sealed\n\
  - short\n- sizeof\n- stackalloc\n- static\n- string\n- struct\n- switch\n- this\n\
  - throw\n- true\n- try\n- typeof\n- uint\n- ulong\n- unsafe\n- ushort\n- using\n\
