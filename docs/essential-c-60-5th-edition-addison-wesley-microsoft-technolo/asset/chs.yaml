  Reverse: 9, 7, 5, 3, 1, 8, 6, 4, 2, 0\nAverage: 4.5\nSum: 45\nMax: 9\nMin: 0\n\n\
  注意，表 14.1 和 14.2 中列出的每个方法都描述了该方法并提供了示例。`System.Linq.Enumerable` 中包含了一组聚合函数，这些函数用于枚举集合并计算结果。`Count`\
  \ 是本章已展示的一个聚合函数示例。\n\n**表 14.1：更简单的查询操作符**\n![图像](img/14tab01.jpg)\n\n**表 14.2：System.Linq.Enumerable\
  \ 上的聚合函数**\n![图像](img/14tab02.jpg)\n\n### 高级主题：针对 IQueryable<T> 的查询扩展\n\n与 `IEnumerable<T>`\
  \ 几乎完全相同的接口是 `IQueryable<T>`。由于 `IQueryable<T>` 派生自 `IEnumerable<T>`，它拥有 `IEnumerable<T>`\
  \ 的所有成员，但只有直接声明的成员（例如 `GetEnumerator()`）。扩展方法不会被继承，因此 `IQueryable<T>` 并不具备任何 `Enumerable`\
  \ 扩展方法。然而，它有一个类似的扩展类，称为 `System.Linq.Queryable`，它为 `IQueryable<T>` 添加了几乎与 `Enumerable`\
  \ 为 `IEnumerable<T>` 添加相同的方法。因此，它提供了一个非常相似的编程接口。\n\n`IQueryable<T>` 的独特之处在于它允许自定义\
  \ LINQ 提供程序。LINQ 提供程序将表达式细分为其各个组成部分。一旦分好，表达式就可以翻译成另一种语言、为了远程执行进行序列化、注入异步执行模式等。从本质上，LINQ\
  \ 提供程序允许对标准集合 API 进行拦截机制，并通过这种看似无尽的功能，可以注入有关查询和集合的行为。\n\n例如，LINQ 提供程序允许将查询表达式从 C#\
  \ 翻译为 SQL，然后在远程数据库上执行。这样，C# 程序员就可以留在主要的面向对象语言中，并将 SQL 翻译交给底层 LINQ 提供程序。通过这种表达式，编程语言能够跨越面向对象的世界与关系型数据库之间的差异。\n\
  \n对于 `IQueryable<T>` 情况，对延迟执行的警惕更为重要。想象一个从数据库返回数据的 LINQ 提供程序。与其说根据选择标准从数据库检索数据，不如说\
  \ Lambda 表达式提供了 `Queryable<T>` 的实现，可能包含连接字符串等上下文信息，但不包含数据本身。数据检索直到调用 `GetEnumerator()`\
  \ 甚至 `MoveNext()` 时才会发生。然而，`GetEnumerator()` 调用通常是隐式的，在使用 `foreach` 遍历集合或调用 `Count<T>()`\
  \ 或 `Cast<T>()` 等 `Enumerable` 方法时。显然，这种情况需要开发者警惕延迟执行可能涉及的任何开销操作的重复调用。例如，如果调用 `GetEnumerator()`\
  \ 涉及到跨网络的分布式调用，那么避免无意中多次调用迭代 `Count()` 或 `foreach` 是明智的。\n\n### 总结\n\n在介绍了匿名类型、隐式变量和集合初始化器后，本章描述了\
  \ `foreach` 循环的工作原理，并解释了执行该循环所需的接口。此外，开发者经常过滤集合以减少项的数量，并投影集合以使项采取不同的形式。为了这一目标，本章详细讨论了如何使用标准查询操作符（即\
  \ `System.Linq.Enumerable` 类上的常用集合 API）来进行集合操纵。\n\n\n\n\n在标准查询操作符的介绍中，我们详细介绍了延迟执行的原理，并强调了开发者应该小心避免通过枚举集合内容的细微调用，在无意中重新执行表达式。标准查询操作符的延迟执行以及由此导致的隐式执行是代码效率的一个重要影响因素，特别是当查询执行开销较大时。程序员应该将查询对象视为查询对象，而不是结果，并且即使查询已经执行过，也要期望它会被完全执行。查询对象并不知道结果将与之前执行时的结果相同。\n\
  \n列表 14.26 出现在“高级主题”章节中，是因为连续调用多个标准查询操作符具有复杂性。虽然对类似的执行逻辑的需求可能很常见，但并没有必要直接依赖标准查询操作符。C#\
  \ `3.0` 包含了查询表达式，这是一种类似于 SQL 的语法，用于操作集合，这种方式通常更易于编写代码和阅读，正如我们在下一章中展示的那样。\n\n# 15\
  \ 使用查询表达式的 LINQ\n\n第 14 章 的结束展示了一个使用标准查询操作符进行 `GroupJoin()`、`SelectMany()` 和 `Distinct()`\
  \ 的查询，此外还创建两个匿名类型。结果是一个跨越多行的语句，比通常仅使用 C# 早期版本特征编写的语句要复杂且难以理解得多。处理丰富数据集的现代程序通常需要此类复杂的查询；因此，如果语言能让它们变得更易读，那就太好了。像\
  \ SQL 这样特定域的查询语言使得阅读和理解查询变得容易得多，但它们缺乏 C# 语言的完整威力。这就是为什么 C# 语言设计者在 C# `3.0` 中增加了**查询表达式**语法。通过查询表达式，许多标准查询操作符表达式被转换为更具读性的代码，就像\
  \ SQL 一样。\n\n![Image](img/0621fig01.jpg)\n\n在本章中，我们将引入查询表达式并使用它们表达上一章中的许多查询。\n\n\
  ## 引入查询表达式\n\n开发者最频繁执行的两个操作是**过滤**集合以消除不需要的项，以及**投影**集合以便项采取不同的形式。例如，给定一个文件集合，我们可以过滤它以创建一个仅包含\
  \ `.cs` 扩展文件的新集合，或者只包含大于 100 万字节的文件。我们还可以投影文件集合，创建一个包含文件所在目录路径及相应目录大小的新集合。查询表达式为这两种常见操作提供了直观的语法。列表\
  \ 15.1 展示了一个过滤字符串集合的查询表达式；输出 15.1 显示了结果。\n\n**列表 15.1: 简单查询表达式**\n\n点击此处查看代码图像\n\
  \n* * *\n\n```csharp\nusing System;\n\nusing System.Collections.Generic;\nusing\
  \ System.Linq;\n\n// ...\n\nstatic string[] Keywords = {\n    \"abstract\", \"add*\"\
  , \"alias*\", \"as\", \"ascending*\",\n    \"async*\", \"await*\", \"base\",\"bool\"\
  , \"break\",\n    \"by*\", \"byte\", \"case\", \"catch\", \"char\", \"checked\"\
  ,\n    \"class\", \"const\", \"continue\", \"decimal\", \"default\",\n    \"delegate\"\
  , \"descending*\", \"do\", \"double\",\n    \"dynamic*\", \"else\", \"enum\", \"\
  event\", \"equals*\",\n    \"explicit\", \"extern\", \"false\", \"finally\", \"\
  fixed\",\n    \"from*\", \"float\", \"for\", \"foreach\", \"get*\", \"global*\"\
  ,\n    \"group*\", \"goto\", \"if\", \"implicit\", \"in\", \"int\",\n    \"into*\"\
  , \"interface\", \"internal\", \"is\", \"lock\", \"long\",\n    \"join*\", \"let*\"\
  , \"nameof*\", \"namespace\", \"new\", \"null\",\n    \"object\", \"on*\", \"operator\"\
  , \"orderby*\", \"out\",\n    \"override\", \"params\", \"partial*\", \"private\"\
  , \"protected\",\n    \"public\", \"readonly\", \"ref\", \"remove*\", \"return\"\
  , \"sbyte\",\n    \"sealed\", \"select*\", \"set*\", \"short\", \"sizeof\",\n  \
  \  \"stackalloc\", \"static\", \"string\", \"struct\", \"switch\",\n    \"this\"\
  , \"throw\", \"true\", \"try\", \"typeof\", \"uint\", \"ulong\",\n    \"unsafe\"\
  , \"ushort\", \"using\", \"value*\", \"var*\", \"virtual\",\n    \"unchecked\",\
  \ \"void\", \"volatile\", \"while*\"\n};\n\nprivate static void ShowContextual()\n\
  {\n    IEnumerable<string> selection =\n        from word in Keywords\n        where\
  \ word.Contains(\" \")\n        select word;\n\n    foreach (string keyword in selection)\n\
  \    {\n        Console.Write(keyword + \" \");\n    }\n}\n```\n\n\n\n最后，C# 查询表达式的顺序确保了“where”（范围）变量的作用域规则大部分与局部变量的作用域规则保持一致。例如，在使用范围（range）变量之前，必须先由某个子句（通常是\
  \ `from` 子句）声明，这就像局部变量在使用之前必须先进行声明一样。\n\n## 投影 (Projection)\n\n查询表达式的结果是一个类型为 `IEnumerable<T>`\
  \ 或 `IQueryable<T>` 的集合。实际类型 `T` 是从 `select` 或 `group by` 子句推断出来的。例如，在列表 15.1 中，编译器知道\
  \ `Keywords` 的类型是 `string[]`，它可以转换为 `IEnumerable<string>`，并推断出 `word` 的类型为 `string`。查询以\
  \ `select word` 结束，这意味着查询表达式的结果必须是字符串集合，因此查询表达式的类型是 `IEnumerable<string>`。\n\n在实际操作中，查询表达式的结果几乎总是\
  \ `IEnumerable<T>` 或其派生类型。虽然这有些不反常，但创建一个返回其他类型的查询方法实现是合法的；语言并没有*要求*查询表达式的结果必须转换为\
  \ `IEnumerable<T>`。\n\n在这种情况下，查询的“输入”和“输出”都是字符串集合。然而，如果 `select` 子句中的表达式是完全不同的类型，那么“输出”类型可能与“输入”类型不同。考虑列表\
  \ 15.2 中的查询表达式及其对应的输出 15.2。\n\n**列表 15.2：使用查询表达式进行投影**\n\n点击此处查看代码图像\n\n```assembly\n\
  using System;\n\nusing System.Collections.Generic;\nusing System.Linq;\nusing System.IO;\n\
  \n// ...\n\n  static void List1(string rootDirectory, string searchPattern)\n  {\n\
  \      IEnumerable<string> fileNames = Directory.GetFiles(rootDirectory, searchPattern);\n\
  \      IEnumerable<FileInfo> fileInfos =\n          from fileName in fileNames\n\
  \          select new FileInfo(fileName);\n      foreach (FileInfo fileInfo in fileInfos)\n\
  \      {\n          Console.WriteLine(\n              $@\".{ fileInfo.Name } ({\n\
  \                  fileInfo.LastWriteTime })\");\n      }\n  }\n// ...\n```\n\n\
  **输出 15.2**\n\n点击此处查看代码图像\n\nAccount.cs (11/22/2011 11:56:11 AM)\nBill.cs (8/10/2011\
  \ 9:33:55 PM)\nContact.cs (8/19/2011 11:40:30 PM)\nCustomer.cs (11/17/2011 2:02:52\
  \ AM)\nEmployee.cs (8/17/2011 1:33:22 AM)\nPerson.cs (10/22/2011 10:00:03 PM)\n\
  ```\n\n此查询表达式的结果是一个 `IEnumerable<FileInfo>`，而不是由 `Directory.GetFiles()` 返回的 `IEnumerable<string>`\
  \ 数据类型。查询表达式的 `select` 子句可以地投影出一个与 `from` 子句表达式收集到的数据不同的数据类型。\n\n在这个示例中，选择 `FileInfo`\
  \ 类型是因为它包含了输出所需的两个相关字段：文件名和最后写入时间。如果你需要其他 `FileInfo` 对象中未捕获的信息，可能就没有这样方便的类型了。匿名类型提供了一种方便且简洁的方法来投影你所需的确切数据，而无需查找或创建显式类型。（事实上，这种场景是向语言中添加匿名类型的关键动力。）列表\
  \ 15.3 提供了与列表 15.2 类似的输出，但是通过匿名类型而不是 `FileInfo` 实现的。\n\n**列表 15.3：查询表达式中的匿名类型**\n\
  \n点击此处查看代码图像\n\n```assembly\nusing System;\n\nusing System.Collections.Generic;\n\
  using System.Linq;\nusing System.IO;\n\n// ...\n\n  static void List2(string rootDirectory,\
  \ string searchPattern)\n  {\n      var fileNames = Directory.EnumerateFiles(rootDirectory,\
  \ searchPattern);\n      var fileResults =\n          from fileName in fileNames\n\
  \          select new\n          {\n              Name = fileName,\n           \
  \   LastWriteTime = File.GetWriteTime(fileName)\n          };\n      foreach (var\
  \ fileResult in fileResults)\n      {\n          Console.WriteLine(\n          \
  \    $@\"{ fileResult.Name } ({\n                  fileResult.LastWriteTime })\"\
  );\n      }\n  }\n// ...\n```\n\n在这个示例中，查询仅投影了文件名及其最后写入时间。在处理像 `FileInfo` 这样的小型对象时，像列表\
  \ 15.3 这样的投影区别不大。然而，当数据量巨大且检索数据（例如通过互联网从另一台计算机检索）成本高昂时，过滤掉集合中每个项目相关数据量的“水平”投影是极其强大的。与其在查询执行时检索所有数据，不如使用匿名类型来这种仅将所需数据存储并检索到集合中的能力。\n\
  \n想象例如，有一个拥有 30 列或更多表的大型数据库。如果没有匿名类型，开发者将被迫使用包含不需要信息的对象，或者定义仅用于存储特定数据的小型类。相反，匿名类型允许由编译器定义类型——这些类型包含当前场景需要的数据。其他场景可以对所需的属性进行不同的投影。\n\
  \n## 初学者主题：查询表达式的延迟执行\n\n使用查询表达式表示法的查询表现出延迟执行，正如第 14 章中的查询一样。再次考虑列表 15.1 中将查询对象赋值给变量\
  \ `selection` 的操作。查询的创建和变量赋值并没有执行查询；它们只是构建了一个表示查询的对象。`word.Contains(\"*\")` 方法在创建查询对象时并未调用。相反，查询表达式保存了筛选条件，将在遍历由变量\
  \ `selection` 的集合时使用。\n\n为了证明这一点，请考虑列表 15.4 及其对应的输出（输出 15.3）。\n\n**列表 15.4：延迟执行与查询表达式（示例\
  \ 1）**\n\n点击此处查看代码图像\n\n```assembly\nusing System;\n\nusing System.Collections.Generic;\n\
  using System.Linq;\n\n// ...\n\n  private static void ShowContextual2()\n  {\n \
  \     IEnumerable<string> selection = from word in Keywords\n          where IsKeyword(word)\n\
  \          select word;\n      Console.WriteLine(\"Query created.\");\n      foreach\
  \ (string keyword in selection)\n      {\n          // 这里没有输出空格。\n          Console.Write(keyword);\n\
  \      }\n  }\n\n  // 将控制台输出的副作用包含\n  // 在谓词中以演示延迟执行；\n```\n\n\n\n\n```csharp\n\
  // 在生产代码中，带有副作用的谓词\n// 是不良好的做法。\n\nprivate static bool IsKeyword(string word)\n\
  {\n    if (word.Contains('*'))\n    {\n        Console.Write(\" \");\n        return\
  \ true;\n    }\n    else\n    {\n        return false;\n    }\n}\n// ...\n```\n\n\
  ### 输出 15.3\n\n点击此处查看图像\n\n查询已创建。\n\n`add*` `alias*` `ascending*` `async*` `await*`\
  \ `by*` `descending*` `dynamic*` `equals*` `from*` `get*` `global*` `group*` `into*`\
  \ `join*` `let*` `nameof*` `on*` `orderby*` `partial*` `remove*` `select*` `set*`\
  \ `value*` `var*` `where*` `yield*`\n\n在 列表 15.4 中，`foreach` 循环内部没有输出空格。当执行谓词 `IsKeyword()`\
  \ 时，打印空格的副作用是在查询被**迭代**时发生的——而不是在查询创建时发生。因此，尽管 `selection` 是一个集合（毕竟它的类型是 `IEnumerable<T>`），但在赋值的时刻，`from`\
  \ 子句之后的所有内容都构成了选择标准。只有当我们开始迭代 `selection` 时，这些标准才会被应用。\n\n现在考虑第二个示例（请参见 列表 15.5\
  \ 和 输出 15.4）。\n\n#### 列表 15.5：延迟执行与查询表达式（示例 2）\n\n点击此处查看代码图像\n\n```csharp\nusing\
  \ System;\nusing System.Collections.Generic;\nusing System.Linq;\n// ...\n\nprivate\
  \ static void CountContextualKeywords()\n{\n    int delegateInvocations = 0;\n \
  \   Func<string, string> func =\n        text=>\n        {\n            delegateInvocations++;\n\
  \            return text;\n        };\n    IEnumerable<string> selection =\n   \
  \     from keyword in Keywords\n        where keyword.Contains('*')\n        select\
  \ func(keyword);\n    Console.WriteLine(\n        $\"1\\. delegateInvocations={\
  \ delegateInvocations }\");\n    // 执行计数应该为每个选定的项目\n    // 调用一次 func。\n    Console.WriteLine(\n\
  \        $\"2\\. Contextual keyword count={ selection.Count() }\");\n    Console.WriteLine(\n\
  \        $\"3\\. delegateInvocations={ delegateInvocations }\");\n    // 执行计数应该为每个选定的项目\n\
  \    // 调用一次 func。\n    Console.WriteLine(\n        $\"4\\. Contextual keyword count={\
  \ selection.Count() }\");\n    Console.WriteLine(\n        $\"5\\. delegateInvocations={\
  \ delegateInvocations }\");\n    // 缓存该值，以便未来的计数不会触发\n    // 查询的再次调用。\n    List<string>\
  \ selectionCache = selection.ToList();\n    Console.WriteLine(\n        $\"6\\.\
  \ delegateInvocations={ delegateInvocations }\");\n    // 从缓存集合中获取计数。\n    Console.WriteLine(\n\
  \        $\"7\\. selectionCache count={ selectionCache.Count() }\");\n    Console.WriteLine(\n\
  \        $\"8\\. delegateInvocations={ delegateInvocations }\");\n}\n// ...\n```\n\
  \n#### 输出 15.4\n\n1. delegateInvocations=0\n2. Contextual keyword count=27\n3. delegateInvocations=27\n\
  4. Contextual keyword count=27\n5. delegateInvocations=54\n6. selectionCache count=27\n\
  7. delegateInvocations=81\n\n列表 15.5 使用了一个 lambda 来计算方法被调用的次数，而不是定义一个单独的方法。输出中有三点非常值得注意。首先，注意在给\
  \ `selection` 赋值后，`Invocations` 保持为 0。在赋值给 `selection` 时，并没有对 `Keywords` 进行迭代。如果\
  \ `Keywords` 是一个属性，则属性调用将会运行——换句话说，`from` 子句在赋值时执行。然而，在代码迭代 `selection` 内部的值之前，投影、过滤或任何\
  \ `from` 子句之后的内容都不会执行。这就像在赋值时，将 `selection` 称为“查询”更为合适。然而，一旦我们调用了 `Count()`，使用 `selection`\
  \ 或 `items` 这样的术语表示容器或集合就很合适了，因为我们开始计算集合中的项目了。换句话说，`selection` 具有双重作用：保存查询以及作为从中检索数据的容器。\n\
  \n另一个需要注意的重要特征是，调用两次 `Count()` 会导致 `func` 再次对每个项目进行调用。由于 `selection` 既像查询又像集合，请求计数需要通过通过迭代\
  \ `selection` 所引用的 `IEnumerable<string>` 集合来重新执行查询并计算项目。C# 编译器并不知道有人修改了数组中的字符串导致计数不同，因此每次都必须进行计数，以确保答案是正确且最新的。同样，对\
  \ `selection` 进行 `foreach` 循环也会触发对每个项目再次调用 `func`。\n\n### 进阶主题：延迟执行\n\n延迟执行通过**委托**和**表达式树**来实现。委托提供了创建并操作稍后调用的方法的能力。表达式树同样提供了创建并操作稍后可以检查的信息的能力。在\
  \ 列表 15.5 中，`where` 子句的谓词表达式和 `select` 子句的投影被编译器转换为 lambda，然后这些 lambda 被转换为委托。只有当查询结果被迭代时，查询对象才会执行这些委托。\n\
  \n#### 过滤\n\n在 列表 15.1 中，我们使用 `where` 子句过滤掉了保留关键字，但不是上下文关键字。这个 `where` 子句“垂直地”过滤集合——如果你将集合视为项目的垂直列表，`where`\
  \ 子句会使该垂直列表变短。过滤标准通过谓词表示——一个返回 `bool` 的 lambda 表达式，例如 `word.Contains()`（如列表 15.1\
  \ 所示）或 `File.GetLastWriteTime(file) < DateTime.Now.AddMonths(-1)`。后者显示在 列表 15.6\
  \ 中，其输出出现在 输出 15.5 中。\n\n#### 列表 15.6：使用 where 的查询表达式\n\n点击此处查看代码图像\n\n```csharp\n\
  using System;\nusing System.Collections.Generic;\nusing System.Linq;\nusing System.IO;\n\
  // ...\n\nstatic void FindMonthOldFiles(\n    string rootDirectory, string searchPattern)\n\
  {\n    IEnumerable<FileInfo> files =\n        from fileName in Directory.EnumerateFiles(\n\
  \            rootDirectory, searchPattern)\n        where File.GetLastWriteTime(fileName)\
  \ < DateTime.Now.AddMonths(-1)\n        select new FileInfo(fileName);\n    foreach\
  \ (FileInfo file in files)\n    {\n        // 作为简化，假设当前目录是\n        // rootDirectory\
  \ 的子目录\n        string relativePath = file.FullName.Substring(\n            Environment.CurrentDirectory.Length);\n\
  \        Console.WriteLine(\n            $\".{ relativePath } ({ file.LastWriteTime\
  \ })\");\n    }\n}\n// ...\n```\n\n\n\n\n`.\\TestData\\Person.cs` (10/22/2011 10:00:03\
  \ PM)\n\n### 排序\n\n要使用查询表达式对项目进行排序，可以使用 `orderby` 子句，如列表 15.7 所示。\n\n**列表 15.7：使用\
  \ orderby 子句通过查询表达式进行排序**\n\n点击此处查看代码图片\n\n* * *\n\n```csharp\nusing System;\n\n\
  using System.Collections.Generic;\nusing System.Linq;\nusing System.IO;\n\n// ...\n\
  \n  static void ListByFileSize1(\n      string rootDirectory, string searchPattern)\n\
  \  {\n      IEnumerable<string> fileNames =\n          from fileName in Directory.EnumerateFiles(\n\
  \              rootDirectory, searchPattern)\n          orderby (new FileInfo(fileName)).Length\
  \ descending,\n              fileName\n          select fileName;\n      foreach\
  \ (string fileName in fileNames)\n      {\n          Console.WriteLine(fileName);\n\
  \      }\n  }\n// ...\n```\n\n* * *\n\n列表 15.7 使用 `orderby` 子句对 `Directory.GetFiles()`\
  \ 返回的文件首先按文件大小降序排序，然后按文件名升序排序。多个排序标准之间用逗号分隔，例如首先按大小对项目排序，如果大小相同，则按文件名排序。`ascending`\
  \ 和 `descending` 是指示排序方向的上下文关键字。指定顺序为升序或降序是可选的；如果省略了方向（在此处 `filename` 上即如此这），默认为\
  \ `ascending`。\n\n### let 子句\n\n列表 15.8 包含一个与列表 15.7 中的查询非常相似的查询，区别在于 `IEnumerable<T>`\
  \ 的类型参数是 `FileInfo`。注意此查询存在一个问题：我们必须冗余地创建两次 `FileInfo` 对象，分别在 `orderby` 子句和 `select`\
  \ 子句中。\n\n**列表 15.8：投影 FileInfo 集合并按文件大小排序**\n\n点击此处查看代码图片\n\n* * *\n\n```csharp\n\
  using System;\n\nusing System.Collections.Generic;\nusing System.Linq;\nusing System.IO;\n\
  \n// ...\n\n  static void ListByFileSize2(\n      string rootDirectory, string searchPattern)\n\
  \  {\n      IEnumerable<FileInfo> files =\n          from fileName in Directory.EnumerateFiles(\n\
  \              rootDirectory, searchPattern)\n          orderby new FileInfo(fileName).Length,\
  \ fileName\n          select new FileInfo(fileName);\n      foreach (FileInfo file\
  \ in files)\n      {\n          //  作为简化，假设当前目录\n          //  是 rootDirectory 的子目录\n\
  \          string relativePath = file.FullName.Substring(\n              Environment.CurrentDirectory.Length);\n\
  \          Console.WriteLine($\"{relativePath} ({file.Length})\");\n      }\n  }\n\
  // ...\n```\n\n* * *\n\n遗憾的是，尽管最终结果是正确的，但列表 15.8 最终为源中的每个项目实例化了两次 `FileInfo` 对象，这似乎是浪费且不必要的。为了避免这种不必要的且昂贵的开销，你可以使用\
  \ `let` 子句，如列表 15.9 所示。\n\n**列表 15.9：在查询表达式中排序结果**\n\n点击此处查看代码图片\n\n* * *\n\n```csharp\n\
  \  // ...\n  IEnumerable<FileInfo> files =\n      from fileName in Directory.EnumerateFiles(\n\
  \          rootDirectory, searchPattern)\n      let file = new FileInfo(fileName)\n\
  \      orderby file.Length, fileName\n      select file;\n  // ...\n```\n\n* * *\n\
  \n`let` 子句引入了一个新的范围变量，该变量可以存储在查询表达式剩余部分一直使用的表达式值。你可以根据需要添加任意数量 `let` 子句；只需在第一个 `from`\
  \ 子句之后、最后的 `select`/`group by` 子句之前，将每个 `let` 子句添加到查询中即可。\n\n### 分组\n\n一种常见的数据处理场景是相关项目的分组。在\
  \ SQL 中，这通常涉及对项目聚合以产生摘要、总和或其他聚合值。然而，LINQ 的表达能力明显更强。LINQ 表达式允许将单个项目分组为一系列子集合，然后这些组可以与被查询集合中的项目相关联。例如，列表\
  \ 15.10 和输出 15.6 演示了如何将上下文关键字和普通关键字分组在一起。\n\n**列表 15.10：对查询结果分组**\n\n点击此处查看代码图片\n\
  \n* * *\n\n```csharp\nusing System;\n\nusing System.Collections.Generic;\nusing\
  \ System.Linq;\n\n// ...\n\n  private static void GroupKeywords1()\n  {\n      IEnumerable<IGrouping<bool,\
  \ string>> selection =\n          from word in Keywords\n          group word by\
  \ word.Contains('*');\n      foreach (IGrouping<bool, string> wordGroup\n      {\n\
  \          foreach (string keyword in wordGroup)\n          {\n              Console.WriteLine((wordGroup.Key\
  \ ? \"Contextual Keywords\" : \"Keywords\") + keyword);\n          }\n      }\n\
  \  }\n// ...\n```\n\n* * *\n\n**输出 15.6**\n\n点击此处查看代码图片\n\n关键字:\nabstract as bool\
  \ break byte case checked char\nconst default delegate double else event\nexplicit\
  \ false finally float for foreach goto\nimplicit in int interface is lock long new\
  \ null\noperator override object params protected public\nreadonly ref return sbyte\
  \ sealed short stackalloc static\nstring struct switch this try true typeof uint\
  \ ulong unsafe\nushort using unchecked void volatile\n\n上下文关键字:\nadd alias async\
  \ by descending dynamic equals\nget global group into let nameof on orderby partial\
  \ remove\nselect value where yield\n\n\n\n\n\n```csharp\nIEnumerable<IGrouping<bool,\
  \ string>> keywordGroups =\n    from word in Keywords\n    group word by word.Contains('*');\n\
  \nvar selection =\n    from groups in keywordGroups\n    select new\n    {\n   \
  \     IsContextualKeyword = groups.Key,\n        Items = groups\n    };\n\nforeach\
  \ (var wordGroup in selection)\n{\n    Console.WriteLine(Environment.NewLine + \"\
  {0}:\",\n        wordGroup.IsContextualKeyword ? \"Contextual Keywords\" : \"Keywords\"\
  );\n    foreach (var keyword in wordGroup.Items)\n    {\n        Console.Write(\"\
  \ \" + keyword.Replace(\"*\", null));\n    }\n}\n// ...\n```\n\n**输出 15.7**\n\n\
