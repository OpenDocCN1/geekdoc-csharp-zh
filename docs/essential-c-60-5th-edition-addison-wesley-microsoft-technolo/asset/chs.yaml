  \ 反汇编完成 ***********************\n\n* * *\n\n列表的开头是清单程序信息。它不仅包含了反汇编模块（`HelloWorld.exe`）的全名，还包含了它依赖的所有模块和程序集，以及它们的版本信息。\n\
  \n也许从这种反汇编列表中你可以获得的最有趣的一点是，它非常容易理解。\n\n### 总结\n\n列表的开头是清单程序信息。它不仅包含了反汇编模块（`HelloWorld.exe`）的全名，还包含了它依赖的所有模块和程序集，以及它们的版本信息。\n\
  \n也许从这种反汇编列表中你可以获得的最有趣的一点是，它非常容易理解。\n\n### 数据类型\n\n列表的开头是清单程序信息。它不仅包含了反汇编模块（`HelloWorld.exe`）的全名，还包含了它依赖的所有模块和程序集，以及它们的版本信息。\n\
  \n\n\n\n浮点数具有不同程度的精度，二进制浮点类型仅在分母为 2 的幂次分式时才能精确地表示数字。如果你将一个浮点变量的值设置为 `0.1`，它很容易被表示为\
  \ `0.0999999999999999` 或 `0.10000000000000001` 或其他非常接近 `0.1` 的数字。同样，将变量设置为诸如阿伏加德常数\
  \ `6.02 × 10²³` 这样的大数，可能会导致大约 `10⁸` 的表示误差，而这只是该数字的一个非常微小的比例。浮点数的准确性与其所表示的数值的大小成正比。浮点数精确到特定的某些有效数字，而不是一个固定的值（如\
  \ `±0.01`）。\n\nC# 支持表 2.2 列出的两种二进制浮点数类型。\n\n![Image](img/02tab02.jpg)\n\n**表 2.2：浮点数类型**\n\
  \n二进制数以十进制（十进制）数字的形式出现，以便人类阅读。位（二进制数字）的数量转换为 15 位十进制数字，余数贡献第十六位十进制，如表 2.2 所示。具体而言，在\
  \ `1.7 × 10³⁰⁷` 之间且小于 `1 × 10³⁰⁸` 的数字只有 15 位有效数字。然而，从 `1 × 10³⁰⁸` 到 `1.7 × 10³⁰⁸`\
  \ 的数字将具有 16 位有效数字。`decimal` 类型也有类似的有效数字范围。\n\n### Decimal 类型\n\nC# 还提供了一种具有 128\
  \ 位精度的十进制浮点类型（参见表 2.3）。该类型适用于财务计算。\n\n![Image](img/02tab03.jpg)\n\n**表 2.3：decimal\
  \ 类型**\n\n与二进制浮点数不同，`decimal` 类型对其范围内的所有十进制数字保持精确的准确性。因此，使用 `decimal` 类型，值 `0.1`\
  \ 就是的 `0.1`。然而，虽然 `decimal` 类型的精度比浮点类型高，但它的范围较小。因此，从浮点类型到 `decimal` 类型的转换可能会导致溢出错误。此外，使用\
  \ `decimal` 的计算要稍慢（通常是察觉的）。\n\n***\n\n### 高级主题：剖析浮点类型\n\n`decimal` 类型范围和精度限制内的十进制数字是精确表示的。相比之下，许多十进制数字的二进制浮点表示会引入舍入误差。就像\
  \ ⅓ 无法在任何有限的十进制数字中精确表示一样，![Image](img/11by10.jpg) 也无法在任何有限的二进制位中精确表示。在这两种情况下，我们都会得到某种舍入误差。\n\
  \n`decimal` 由 `±N * 10`^k 表示，其中满足以下条件：\n\n* `N`（尾数）是一个正的 96 位整数。\n* `k`（指数）由 `-28\
  \ <= k <= 0` 给出。\n\n相比之下，二进制浮点数是任何 `±N * 2`^(`k`)`，其中满足以下条件：\n\n* `N` 是正的 24 位（对于\
  \ `float`）或 53 位（对于 `double`）整数。\n* `k` 是整数，对于 `float` 范围从 `-149` 到 `+104`，对于 `double`\
  \ 则从 `-1074` 到 `+970`。\n\n***\n\n### 字面量\n\n**字面值**是源代码中常量值的表示。例如，如果你想让 `System.Console.WriteLine()`\
  \ 输出整数值 `42` 和 `double` 值 `1.618034`，可以使用列表 2.1 所示的代码。\n\n**列表 2.1：指定字面值**\n\n点击此处查看代码图像\n\
  \n***\n\n```\nSystem.Console.WriteLine(42);\nSystem.Console.WriteLine(1.618034);\n\
  ```\n\n***\n\n输出 2.1 显示了列表 2.1 的的结果。\n\n**输出 2.1**\n\n42\n\n1.618034\n\n***\n\n\
  ### 初学者主题：硬编码值时要小心\n\n将值直接置于源代码中的做法被称为**硬编码**（hardcoding），因为更改这些值需要重新编译代码。开发者必须仔细考虑在代码中硬编码值与从外部源（如配置文件）检索值之间进行选择，以便在不重新编译的情况下修改这些值。\n\
  \n***\n\n默认情况下，当你指定一个带有小数点的字面量数字时，编译器将其解释为 `double` 类型。相反，没有小数点的字面值默认为 `int`。\n\n\
  \n\n通常你处理的是以 10 为进制表示的数字，这意味着数字中的每个数字有 10 个符号（0–9）。如果数字以十六进制法显示，则它使用 16 进制数字显示，这意味着使用了\
  \ 16 个符号：0–9、A–F（也可以使用小写）。因此，`0x000A` 对应十进制 10，`0x002A` 对应十进制 42，即 `2 × 16 + 10`。实际数值是相同的。从十六进制转换为十进制或反之都不会改变数字本身，只是改变数字的表示形式。\n\
  \n每个十六进制位四位，因此一个字节可以表示两个十六进制位。\n\n***\n\n在目前所有关于字面数值的讨论中，我们只涵盖了十进制类型的值。C# 也支持指定十六进制值。要指定十六进制值，请在值前面加上\
  \ `0x`，然后使用任何十六进制数字，如列表 2.5 所示。\n\n**列表 2.5：十六进制字面量值**\n\n点击此处查看代码图片\n\n***\n\n\
  ```cs\n// 使用十六进制字面量显示值 42。\nSystem.Console.WriteLine(0x002A);\n```\n\n***\n\n输出\
  \ 2.5 显示了列表 2.5 的结果。\n\n**输出 2.5**\n42\n\n注意，此代码仍然显示的是 `42`，而不是 `0x002A`。\n\n***\n\
  \n## 高级主题：将数字格式化为十六进制\n\n要以十六进制格式显示数值，则需要使用 `x` 或 `X` 数值格式指定符。大小写决定了十六进制字母是以小写还是大写出现。列表\
  \ 2.6 显示了如何做的示例。\n\n**列表 2.6：十六进制格式指定符示例**\n\n点击此处查看代码图片\n\n```cs\n// 显示 \"0x2A\"\
  \nSystem.Console.WriteLine($\"0x{42:X}\");\n```\n\n***\n\n输出 2.6 显示了结果。\n\n**输出\
  \ 2.6**\n0x2A\n\n注意，数值字面量（`42`）可以是十进制或十六进制形式。结果是相同的。此外，为了实现十六进制格式化，我们依赖格式指定符——它通过冒号与字符串插值表达式隔开。\n\
  \n***\n\n***\n\n## 高级主题：往返格式化\n\n默认情况下，`System.Console.WriteLine(1.618033988749895);`\
  \ 显示 `1.61803398874989`，丢失了最后一位。为了更准确地识别 double 值的字符串表示，可以使用格式化字符串和往返格式指定符 `R`（或\
  \ `r`）进行转换。例如，`string.Format(\"{0:R}\", 1.618033988749895)` 将返回结果 `1.6180339887498949`。\n\
  \n往返格式指定符返回一个字符串，如果将其转换回数值，结果将始终是原始值。列表 2.7 显示，如果不使用往返格式指定符，这些数字是不相等的。\n\n**列表 2.7：使用\
  \ R 格式指定符格式化**\n\n点击此处查看代码图片\n\n```cs\n// ...\nconst double number = 1.618033988749895;\n\
  double result;\nstring text;\n\ntext = $\"{number}\";\nresult = double.Parse(text);\n\
  System.Console.WriteLine($\"{result == number}: result == number\");\n\ntext = string.Format(\"\
  {0:R}\", number);\nresult = double.Parse(text);\nSystem.Console.WriteLine($\"{result\
  \ == number}: result == number\");\n// ...\n```\n\n***\n\n输出 2.7 显示了结果输出。\n\n**输出\
  \ 2.7**\nFalse: result == number\nTrue: result == number\n\n当第一次赋值 `text` 时，没有使用往返格式指定符；因此，`double.Parse(text)`\
  \ 返回的值与原始的 `number` 值不同。相反，当使用往返格式指定符时，`double.Parse(text)` 返回原始值。\n\n对于那些不熟悉基于\
  \ C 语言中 `==` 语法的读者，如果 `result` 等于 `number`，则 `result == number` 返回 `true`，而 `result\
  \ != number` 则相反。赋值运算符和相等运算符将在下一章中讨论。\n\n***\n\n### 基础类型\n\n到目前为止讨论的基础类型是数值类型。C#\
  \ 还包含了一些额外类型：`bool`、`char` 和 `string`。\n\n### 布尔类型\n\n另一个 C# 原生类型是 `bool`，它表示 `true`\
  \ 或 `false`。`bool` 的 BCL 名称为 `System.Boolean`。为了不区分大小写地比较两个字符串，调用 `Compare()` 方法并传递\
  \ `true`（参见列表 2.8）。\n\n**列表 2.8：字符串的不区分大小写比较**\n\n点击此处查看代码图片\n\n```cs\nstring option;\n\
  int comparison = string.Compare(option, \"Help\");\n```\n\n在这种情况下，将结果赋值给 `comparison`。\n\
  \n####字符类型\n\n`char` 表示 16 位字符。该类型的大小与 16 位无符号整数（`ushort`）相同，表示 0 到 65535 之间的值。\n\
  \n***。\n\n***\n\nUnicode 是表示大多数人类语言字符的国际标准。它为计算机系统提供了构建本地化应用程序的功能，即显示相应语言和文化的应用程序。\n\
  \n***\n\n***\n\n### 高级主题：16 位无法表示所有 Unicode 字符\n\n遗憾的是，并不是所有的 Unicode 字符都可以由单个 16\
  \ 位 `char` 表示。随着 设计者随着随着的语言增加，人们意识到这个假设是错误的。因此，某些（很少使用的）Unicode 字符是由两个 `char` 值的“代理对”组成的。\n\
  \n***\n\n要构造 `char` 字面量，将字符放在单引号内，例如 `'A'`。允许的字符包含整个键盘字符范围，包括字母、数字和特殊符号。\n\n某些字符不能直接放在源代码中，而是需要特殊处理。这些字符以反斜杠（`\\\
  `）开头，后跟着一个特殊字符代码。反斜杠和特殊字符代码组合成转义序列。例如，`\\n` 表示换行，`\\t` 表示制表符。由于反斜杠表示转义序列的开始，它不再识别简单的反斜杠；相反你需要使用\
  \ `\\\\` 来表示单个反斜杠。\n\n列表 2.9` 输出一个单引号，因为 `\\'` 表示的字符对应于单引号。\n\n**列表 2.9：使用转义序列显示单引号**\n\
  \n[点击此处查看代码图片\n\n```cs\nclass SingleQuote\n{\n  static void Main()\n  {\n    System.Console.WriteLine('\\\
  '');\n  }\n}\n```\n\n\n\n\n你可以使用 Unicode 编码表示任何字符。为此，请在 Unicode 值之前加上前缀 `\\u`。你用十六进制表示表示\
  \ Unicode 字符。例如，字母 `A` 的十六进制值为 `0x41`。列表 2.10 使用 Unicode 字符来显示一个笑脸 (`:)`)，而输出 2.8\
  \ 显示了结果。\n\n### 列表 2.10：使用 Unicode 编码显示笑脸\n\n点击此处查看代码图像\n\n* * *\n\n```\nSystem.Console.Write('\\\
  u003A');\nSystem.Console.WriteLine('\\u0029');\n```\n\n* * *\n\n### 输出 2.8\n\n:)\n\
  \n## 字符串\n\n零或多个字符的有限序列被称为**字符串**。C# 中的字符串类型为 `string`，其 BCL 名称为 `System.String`。字符串类型包含一些特殊特性，这些对于熟悉其他编程语言的开发者来说可能是出乎意料的。除了第\
  \ 1 章中讨论的字符串字面量格式外，字符串还包括逐字字符串前缀字符 `@`、带有 `$` 前缀的字符串插以及字符串是不可变的特性。\n\n### 字面量\n\n\
  你可以通过将文本放在双引号（`\"`）中向代码输入字面字符串，正如你在 `HelloWorld` 程序中看到的那样。字符串由字符组成，因此字符串内嵌入字符转义序列。\n\
  \n例如，在列表 2.11 中，显示了两行文本。然而，代码列表并没有使用 `System.Console.WriteLine()`，而是使用了带有换行符 `\\\
  n` 的 `System.Console.Write()`。输出 2.9 显示了结果。\n\n### 列表 2.11：使用 \n 字符插入换行\n\n点击此处查看代码图像\n\
  \n* * *\n\n```csharp\nclass DuelOfWits\n{\n    static void Main()\n    {\n     \
  \   System.Console.Write(\n            \"\\\"Truly, you have a dizzying intellect.\\\
  \"\");\n        System.Console.Write(\"\\n\\\"Wait 'til I get going!\\\"\\n\");\n\
  \    }\n}\n```\n\n* * *\n\n### 输出 2.9\n\n点击此处查看代码图像\n\n\"Truly, you have a dizzying\
  \ intellect.\"\n\"Wait 'til I get going!\"\n\n双引号的转义序列将打印出的双引号与定义字符串开始和结束的双引号区分开。\n\
  \n在 C# 中，你可以在字符串前使用 `@` 符号表示反斜杠不被解释为转义序列的开头。生成的**逐字字符串字面量**不会重新解释反斜杠字符。使用 `@` 字符串语法时，空白字符也被逐字对待。例如，列表\
  \ 2.12 中的三角形在控制台中中的显示与输入完全一致，包括反斜杠、换行和缩进。输出 2.10 显示了结果。\n\n### 列表 2.12：使用逐字字符串字面量显示三角形\n\
  \n点击此处查看代码图像\n\n* * *\n\n```csharp\nclass Triangle\n{\n    static void Main()\n\
  \    {\n        System.Console.Write(@\"begin\n               /\\\n            \
  \  /  \\\n             /    \\\n              /      \\\n            /________\n\
  end\");\n    }\n}\n```\n\n* * *\n\n### 输出 2.10\n\nbegin\n               /\\\n  \
  \            /  \\\n             /    \\\n              /      \\\n            /________\n\
  end\n\n如果没有 `@` 字符，此代码将无法编译。\n\n\n\n\n到目前为止，我们使用的静态方法调用总是涉及命名空间前缀，后跟类型名称。例如，调用 `System.Console.WriteLine`\
  \ 时，尽管调用的方法是 `WriteLine()` 且在该文中没有其他同名方法，但仍需要在方法名前加上命名空间（`System`）并后跟类型名称（`Console`）。有时，你可能希望使用快捷方式来避免这种显式写法；若要这样做，你可以利用\
  \ C# 6.0 的 `using static` 指令，如示例 2.13 所示。\n\n### 示例 2.13：using static 指令\n\n点击此处查看代码图像\n\
  \n***\n\n`using static` 指令允许你省略命名空间。\n\n```csharp\n// using 指令允许你省略命名空间\nusing static\
  \ System.Console;\n\nclass HeyYou\n{\n  static void Main()\n  {\n    string firstName;\n\
  \    string lastName;\n    WriteLine(\"Hey you!\");\n    Write(\"Enter your first\
  \ name: \");\n    firstName = ReadLine();\n    Write(\"Enter your last name: \"\
  );\n    lastName = ReadLine();\n    WriteLine($\"Your full name is {firstName} {lastName}.\"\
  );\n  }\n}\n```\n\n***\n\n`using static` 指令需要出现在文件的顶部。(1) 每当我们使用 `System.Console`\
  \ 类时，就不需要再次使用“System.Console”前缀了。相反，我们可以直接编写方法名。关于 `using static` 指令一个需要注意的重要点是，它仅对静态方法和属性有效，而不适用于实例成员。\n\
  \n1。或者位于命名空间声明的顶部。\n\n另一个类似的指令 `using` 指令允许消除命名空间前缀——例如“System.”。与 `using static`\
  \ 指令不同，`using` 指令在它所在的整个文件（或命名空间）内普遍适用（而不仅仅是静态成员）。通过 `using` 指令，你可以（可选地）消除所有对命名空间的引用，无论是在实例化期间、静态方法调用期间，还是在使用\
  \ C# 6.0 中的 `nameof` 操作符时。\n\n***\n\n## 6.0 \n\n### 字符串格式化\n\n无论你是使用 `string.Format()`\
  \ 还是 C# 6.0 的字符串插值功能来构建复杂的格式化字符串，都有套丰富且复杂的格式模式可用于数字、日期、时间、长时间等。例如，如果 `price` 是一个\
  \ `decimal` 变量，那么 `string.Format(\"{0,20:C2}\", price)` 或等价的 `$\"{price,20:C2}\"\
  ` 都会使用默认货币规则将小数值转换为字符串，保留小数点后两位，并在宽度为 20 个字符的字符串中右对齐。空间有限，无法详细讨论所有可能的格式化字符串；请参阅\
  \ MSDN 文档中的 `string.Format()` 以获取完整列表。\n\n### 换行\n\n在编写新行时，换行的精确字符取决于你执行代码的操作系统。在\
  \ Microsoft 平台上，换行是回车符（`\\r`）和换行符（`\\n`）的组合，而 UNIX 使用单个换行符。克服平台间差异的一种方法是直接使用 `System.Console.WriteLine()`\
  \ 输出一个空行。另一种方法是使用 `System.Environment.NewLine`，这在你不向控制台输出且需要在多个平台上实现换行时至关重要。换句话说，`System.Console.WriteLine(\"\
  Hello World\")` 和 `System.Console.Write($\"Hello World{Environment.NewLine}\")`\
  \ 是等价的。\n\n***\n\n高级主题：C# 属性\n\n在下节中提到的 `Length` 成员实际上并不是方法，这一点从其调用后没有括号可以看出。`Length`\
  \ 是 `string` 的一个属性，C# 语法允许像访问成员变量（在 C# 中称为字段）一样访问它。换句话说，属性具有名为设置器（setter）和访问器（getter）的特殊行为，但访问该行为的语法是字段形式。有关属性的更多细节，请参阅第\
  \ 5 章。\n\n***\n\n### 字符串长度\n\n要确定字符串的长度，你使用一个名为 `Length` 的字符串成员。这个特定的成员被称为只读属性。因此，它不能被设置，调用它也不需要任何参数。示例\
  \ 2.14 演示了如何使用 `Length` 属性，输出 2.11 显示了结果。\n\n### 示例 2.14：使用 string 的 Length 成员\n\
  \n点击此处查看代码图像\n\n```csharp\nclass PalindromeLength\n{\n  static void Main()\n  {\n\
  \    string palindrome;\n    System.Console.Write(\"Enter a palindrome: \");\n \
  \   palindrome = System.Console.ReadLine();\n    System.Console.WriteLine($\"The\
  \ palindrome \\\"{palindrome}\\\" is\" + $\" {palindrome.Length} characters.\");\n\
  \  }\n}\n```\n\n**输出 2.11**\n\n点击此处查看代码图像\n\nEnter a palindrome: Never odd or even\n\
  The palindrome \"Never odd or even\" is 17 characters\n\n### 字符串是不可变的\n\n`string`\
  \ 类型的一个关键特性是它是不可变的。字符串变量可以分配一个全新的值，但没有机制可以修改 `string` 的内容。因此，无法将 `string` 转换为全大写字母。创建一个由旧字符串大写版本组成的新字符串是非常容易的，但在此过程中旧字符串并没有被修改。请参考示例\
  \ 2.15](#ch02.html_ch02lis15)。\n\n### 示例 2.15：错误；string 是不可变的\n\n点击此处查看代码图像\n\n\
  ```csharp\nclass Uppercase\n{\n  static void Main()\n  {\n    string text;\n   \
  \ System.Console.Write(\"Enter text: \");\n    text = System.Console.ReadLine();\n\
  \    // 未如预期：未将文本转换为大写写\n    text.ToUpper();\n    System.Console.WriteLine(text);\n\
  \  }\n}\n```\n\n输出 2.12 显示了示例 2.15 的结果。\n\n**输出 2.12**\n\n点击此处查看代码图像\n\nEnter text:\
  \ This is a test of the emergency broadcast system.\nThis is a test of the emergency\
  \ broadcast system.\n\n乍一看，`text.ToUpper()` 似乎应该将 `text` 内部的字符转换为大写。然而，字符串是不可变的，因此\
  \ `text.ToUpper()` 不会进行任何修改。相反，`text.ToUpper()` 返回一个新字符串，需要将其保存到变量或直接传递给 `System.Console.WriteLine()`。\n\
  \n\n\n\n\n点击此处查看代码图像\n\n* * *\n\n```csharp\nclass Uppercase\n{\n  static void Main()\n\
  \  {\n      string text, uppercase;\n      System.Console.Write(\"Enter text: \"\
  );\n      text = System.Console.ReadLine();\n      // 返回一个大写的新字符串\n      uppercase\
  \ = text.ToUpper();\n      System.Console.WriteLine(uppercase);\n  }\n}\n```\n\n\
  * * *\n\n**输出 2.13**\n\n点击此处查看代码图像\n\nEnter text: This is a test of the emergency\
  \ broadcast system.\n\nTHIS IS A TEST OF THE EMERGENCY BROADCAST SYSTEM.\n\n如果忽略了字符串的不可变性，其他字符串方法也可能发生与\
  \ 列表 2.15 所示类似的错误。\n\n要实际更改 `text` 的值，请将 `ToUpper()` 的值赋值回 `text`，如如下代码所示：\n\n```csharp\n\
  text = text.ToUpper();\n```\n\n### System.Text.StringBuilder\n\n如果需要大量的字符串修改（例如在多个步骤中构建一个长字符串），您应该使用\
  \ `System.Text.StringBuilder` 数据类型而不是 `string`。`StringBuilder` 类型包含了 `Append()`、`AppendFormat()`、`Insert()`、`Remove()`\
  \ 和 `Replace()` 等方法，其中某些方法在 `string` 中也可用。然而，关键区别在于，对于 `StringBuilder`，这些方法会修改 `StringBuilder`\
  \ 本身的数据，而不仅仅是返回一个新字符串。\n\n## null 和 void\n\n与类型相关的两个额外关键字是 `null` 和 `void`。用 `null`\
  \ 关键字标识的 `null` 值表示变量不引用任何有效对象。`void` 用于表示类型的缺失或任何值的缺失。\n\n### null\n\n`null` 也可以用作一种字符串“字面量”类型。`null`\
  \ 表示变量被设置为为空。引用类型、指针类型和可空值类型可以赋值 `null` 值。书中到为止涵盖的唯一引用类型是 `string`；第 5 章 详细介绍了创建类（类是引用类型）的主题。目前，只需说明引用类型变量包含一个指向内存中位置的引用，该位置与变量的值不同。将变量设置为\
  \ `null` 的代码显式地将引用指向“无有效值”。事实上，甚至可以检查引用是否指向空内容。列表 2.17 演示了为 `string` 变量分配 `null`。\n\
  \n**列表 2.17：为字符串赋值 `null`**\n\n点击此处查看代码图像\n\n* * *\n\n```csharp\nstatic void Main()\n\
  {\n    string faxNumber;\n    // ...\n    // 清空 faxNumber 的值。\n    faxNumber = null;\n\
  \    // ...\n}\n```\n\n* * *\n\n给引用类型赋值 `null` 值并不等同于完全不赋值。换句话说，赋值了 `null` 的变量仍然被设置了，而没有赋值的变量未被设置，因此如果在使用赋值之前使用它，通常会导致编译错误。\n\
  \n给 `string` 变量赋值 `null` 值与赋值空字符串 `\"\"` 明显不同。使用 `null` 表示变量没有值，而 `\"\"` 表示存在一个值——即空字符串。这种区别可能非常有用。例如，编程逻辑可以将\
  \ `null` 的 `faxNumber` 解释为传真号未知，而 `\"\"` 的 `faxNumber` 值可能表示没有传真号。\n\n### void “类型”\n\
  \n有时 C# 语法要求指定数据类型，但实际上没有传递任何数据。例如，如果不需要方法有返回值，C# 允许您将 `void` 指定为数据类型。`HelloWorld`\
  \ 程序中 `Main` 的声明就是一个示例。将 `void` 作为返回类型表示该方法不返回任何数据，并告诉编译器不要期望获得值。`void` 本身并不是一种数据类型，而是表示没有数据返回的指示。\n\
  \n* * *\n\n### 语言对比：C++\n\n在 C++ 和 C# 中，`void` 都有两个含义：其一作为方法不返回任何数据的标记，另一个是表示指向未知类型存储位置的指针。在\
  \ C++ 程序中，看到如 `void**` 类的指针类型非常常见。C# 也可以使用相同的语法表示指向未知类型存储位置的指针，但这种用法在 C# 中相对少见，通常只在编写与不受托管代码库交互的程序时遇到。\n\
  \n* * *\n\n* * *\n\n### 语言对比：Visual Basic——返回 void 类似于定义一个子程序\n\nC# 中返回 `void` 的\
  \ Visual Basic 等对应方案是定义一个子程序（`Sub`/End Sub）而不是返回值的函数。\n\n* * *\n\n`开始 3.0`\n\n*\
  \ * *\n\n### 高级主题：隐式类型局部变量\n\nC# 3.0 增加了一个上下文关键字 `var`，用于声明隐式类型局部变量。只要代码在声明时用表达式初始化变量，C#\
  \ 3.0 及更高版本就允许隐式而非显式指定类型，如 列表 2.18 所示。\n\n**列表 2.18：处理字符串**\n\n点击此处查看代码图像\n\n* *\
  \ *\n\n```csharp\nclass Uppercase\n{\n  static void Main()\n  {\n      string text,\
  \ uppercase;\n      System.Console.Write(\"Enter text: \");\n      text = System.Console.ReadLine();\n\
  \      // 返回一个大写的新字符串\n      uppercase = text.ToUpper();\n      System.Console.WriteLine(uppercase);\n\
  \  }\n}\n```\n\n* * *\n\n此列表与 列表 2.16 有两处不同。首先，声明没有使用显式类型 `string`，列表 2.18 使用了 `var`。生成的\
  \ CIL 与显式使用 `string` 相同。然而，`var` 通知编译器从初始化表达式中确定类型。\n\n其次，变量 `text` 和 `uppercase`\
  \ 在声明时初始化。这样做会导致编译错误。在数据类型已知的情况下使用 `var` 而不是显式类型是允许的——例如在声明时使用 `string`。\n\n对 `var`\
  \ 的支持是在 C# 3.0 中引入的以便可以使用匿名类型。匿名类型是在方法内部“现场”声明的数据类型，而不是通过显式的类定义，如 列表 2.19 所示。（有关匿名类型的更多细节，请参见\
  \ 第 14 章）。\n\n**列表 2.19：带有匿名类型的隐式变量**\n\n点击此处查看代码图像\n\n* * *\n\n```csharp\nclass\
  \ Program\n{\n  static void Main()\n  {\n    var patent1 = new { Title = \"Bifocals\"\
  , YearOfPublication = \"1784\" };\n    var patent2 = new { Title = \"Phonograph\"\
  , YearOfPublication = \"1877\" };\n    System.Console.WriteLine($\"{patent1.Title}\
  \ ({patent1.YearOfPublication})\");\n    System.Console.WriteLine($\"{patent2.Title}\
  \ ({patent2.YearOfPublication})\");\n  }\n}\n```\n\n* * *\n\n对应的输出显示在 输出 2.14。\n\
  \n**输出 2.14**\n\nBifocals (1784)\n\nPhonograph (1877)\n\n\n\n\n\nListing 2.19 展示了将匿名类型赋值给隐式类型（`var`）局部变量。这种操作结合\
  \ C# 3.0 对数据类型合并（关联）支持或将特定类型的大小缩小到更少的数据元素的支持，提供了关键功能。\n\n`End 3.0`\n\n## 类型分类\n\n\
  所有类型都属于两类之一：`值类型`（value types）和`引用类型`（reference types）。每类中类型之间的差异源于它们复制的方式：值类型数据总是通过值复制，而引用类型数据总是通过引用复制的。\n\
  \n### 值类型\n\n除 `string` 之外，书中目前为止介绍的所有预定义类型都是值类型。值类型的变量直接包含该值。换句话说，变量指向存储该值的相同内存位置。由于此，当给不同的变量分配相同的值时，会在原始变量的值处创建一个副本并复制到新变量的位置。相同值类型的第二个变量不能与第一个变量引用同一个内存位置。因此，更改第一个变量的值不会影响第二个变量的值。图\
  \ 2.1 展示了这一点。在图中，`number1` 指向包含值 `42` 的特定内存位置。将 `number1` 赋值给 `number2` 后，两个变量都包含值\
  \ `42`。然而，修改任何一个变量的值都不会影响另一个。\n\n![Image](img/02fig01.jpg)\n\n**图 2.1：值类型直接包含数据**\n\
  \n同样，将值类型传递给如 `Console.WriteLine()` 等方法也会导致内存复制，方法内部对参数的任何更改都不会影响调用函数中的原始值。由于值类型需要内存复制，因此它们通常应该被定义为消耗少量的内存；值类型的大小几乎应该总是小于\
  \ 16 字节。\n\n### 引用类型\n\n相比之下，引用类型的值是对包含数据的存储位置的引用。引用类型存储数据所在处的引用，而不是像值类型那样直接存储数据。因此，为了访问数据，运行时将从变量中读取内存位置，然后“跳转”到包含数据的内存位置。引用类型所指向的数据的内存区域被称为`堆`（heap）（参见\
  \ 图 2.2）。\n\n![Image](img/02fig02.jpg)\n\n**图 2.2：引用类型指向堆**\n\n引用类型不需要值类型那样对数据的内存复制，这使得复制引用类型比复制大型值类型高效得多。将一个引用类型变量的值赋值给另一个引用类型变量时，只复制引用，而不复制所引的数据。在实践中，引用的大小始终等于处理器的“原生大小”：32\
  \ 位处理器会复制 32 位引用，64 位处理器会复制 64 位引用，以此此类推。显然，将很小的引用复制到大块数据比复制整个数据块（如值类型那样）要快得多。\n\
  \n由于引用类型复制的是数据的引用，两个不同的变量可以引用相同的数据。如果两个变量引用同一个对象，通过一个变量更改对象的字段将导致在通过另一个变量访问该字段时产生该效果。这在赋值和方法调用时都是如此。因此，方法可以影响引用类型的数据，并且当控制返回给调用者时可以观察到该变化。由于由于原因，在选择定义引用类型还是值类型时，一个关键因素是该对象在逻辑上是像一个固定大小的不可变值（因此可能是值类型），还是逻辑上是一个可以被引用的可变实体（因此很可能是引用类型）。\n\
  \n除了 `string` 和任何如 `Program` 的自定义类外，目前讨论的所有类型都是值类型。然而，大多数类型都是引用类型。虽然可以定义自定义值类型，但与自定义引用类型的数量相比，这样做相对罕见。\n\
  \n`Begin 2.0`\n\n### 可空修饰符\n\n值类型通常不能赋值 `null`，因为根据定义，它们不能包含引用（包括对“无”的引用）。然而，这带来了一个问题，因为我们经常希望表示“缺失”的值。例如在指定计数时，如果计数未知，你输入什么？一种可能的解决方案是指定一个“魔术值”，例如\
  \ `-1` 或 `int.MaxValue`，但这些都是有效的整数。相反，理想的做法是给值类型分配 `null`，因为它不是有效的整数。\n\n要声明可以存储\
  \ `null` 的值类型变量，你需要使用可空修饰符 `?`。这一功能是 C# 2.0 引入的，出现在 Listing 2.20 中。\n\n**LISTING\
  \ 2.20：使用可空修饰符**\n\n```csharp\nstatic void Main()\n{\n  int? count = null;\n  do\n\
  \  {\n      // ...\n  }\n  while(count == null);\n}\n```\n\n在数据库编程中，为值类型分配 `null`\
  \ 特别有吸引。值类型列经常允许 `null`。检索此类列并将其赋值给相应的字段，除非字段可以包含 `null`，否则就会有问题。幸运的是，可空修饰符的设计是为了处理这种场景的。\n\
  \n`End 2.0`\n\n### 数据类型之间的转换\n\n考虑到各种实现中预定义的数千种类型以及代码可以定义的无限数量类型，类型在合理的情况下支持从一种类型转换为另一种类型是非常重要的。导致转换的最常见操作是强制类型转换。\n\
  \n考虑两个数值类型之间的转换：从 `long` 转换为 `int`。`long` 类型可以包含高达 9,223,372,036,854,775,808 的值；然而，`int`\
  \ 的最大仅为 2,147,483,647。因此，这种转换可能会导致数据丢失——例如，如果 `long` 变量包含的值大于 `int` 的最大值。任何可能导致数量级丢失或因转换失败而抛出异常的转换都需要显式转换。相反，无论操作数类型如何都不会丢失数量级且不会抛出异常的转换操作是隐式转换。\n\
  \n### 显式转换\n\n在 C# 中，你使用强制转换运算符进行转换。通过在括号内指定你想将变量转换到的类型，你承认了如果发生显式转换，可能会出现精度和数据的丢失，或者可能会产生异常。Listing\
  \ 2.21 中的代码将 `long` 转换为 `int` 并显式告诉系统尝试该操作。\n\n**LISTING 2.21：显式转换示例**\n\n![Image](img/02lis21.jpg)\n\
  \n通过强制转换运算符，程序员本质上是在向编译器说：“相信我，我知道我在做什么。我知道该值可以放入目标类型中。”做出这种选择会导致编译器允许该转换。然而，对于显式转换，如果数据没有转换成功，在执行时仍有可能发生错误（以异常的形式出现）。因此，程序员有责任确保数据成功转换，否则在转换失败时提供必要的错误处理代码。\n\
  \n\n\n\n\nC# 提供了特殊的关键字来标记代码块，以指示当目标数据类型太小而无法容纳所赋值的数据时应该发生什么。默认情况下，如果目标数据类型无法包含所赋值的数据，数据将在赋值期间被截断。示例请参阅\
  \ 列表 2.22。\n\n### 列表 2.22：整数值溢出\n\n点击此处查看代码图像\n\n```csharp\nclass Program\n{\n \
  \ static void Main()\n  {\n      // int.MaxValue 等于 2147483647\n      int n = int.MaxValue;\n\
  \      n = n + 1 ;\n      System.Console.WriteLine(n);\n  }\n}\n```\n\n输出 2.15 显示了结果。\n\
  \n**输出 2.15**\n-2147483648\n\n列表 2.22 向控制台写入了值 `-2147483648`。然而，将代码放在 `checked`\
  \ 块中，或者在运行编译器时使用 `checked` 选项会导致运行时抛出类型为 `System.OverflowException` 的异常。`checked`\
  \ 块的语法使用 `checked` 关键字，如 列表 2.23 所示。\n\n### 列表 2.23：Checked 块示例\n\n点击此处查看代码图像\n\n\
  ```csharp\nclass Program\n{\n  static void Main()\n  {\n      checked\n      {\n\
  \          // int.MaxValue 等于 2147483647\n          int n = int.MaxValue;\n    \
  \      n = n + 1 ;\n          System.Console.WriteLine(n);\n      }\n  }\n}\n```\n\
  \n输出 2.16 显示了结果。\n\n**输出 2.16**\n点击此处查看代码图像\n```\nUnhandled Exception: System.OverflowException:\
  \ Arithmetic operation resulted in an overflow at Program.Main() in ...Program.cs:line\
  \ 12\n```\n\n结果是，如果在 `checked` 块内在运行时发生了溢出赋值，则会抛出异常。C# 编译器提供了一个命令行选项，可以将默认的 checked\
  \ 行为从 unchecked 更改为 checked。C# 还支持 `unchecked` 块，它在块内的赋值中发生数据溢出而不是抛出异常（参阅 列表 2.24）。\n\
  \n### 列表 2.24：Unchecked 块示例\n\n点击此处查看代码图像\n\n```csharp\nusing System;\n\nclass Program\n\
  {\n  static void Main()\n  {\n      unchecked\n      {\n          // int.MaxValue\
  \ 等于 2147483647\n          int n = int.MaxValue;\n          n = n + 1 ;\n      \
  \    System.Console.WriteLine(n);\n      }\n  }\n}\n```\n\n输出 2.17 显示了结果。\n\n**输出\
  \ 2.17**\n-2147483648\n\n即使在编译期间开启了 `checked` 选项，上述代码中的 `unchecked` 关键字也会阻止运行时抛出异常。你不能仅仅通过使用强制转换符显式指定转换来将任何类型转换为其他类型。编译器仍然会检查该操作是否有效。例如，你不能将\
  \ `long` 转换为 `bool`。没有定义此类转换，因此编译器不允许这种强制类型转换。\n\n### 语言对比：将数字转换为布尔值\n发现从数值类型到布尔类型没有有效的强制转换可能会令人感到惊讶，因为这在其他语言中很常见。C#\
  \ 中不存在这种转换的原因是为了避免任何歧义，例如 -1 对应于 `true` 还是 `false`。更重要的是，正如你将在下一章中看到的，这种约束减少了使用赋值运算符代替等值运算符的机会（避免在意图是\
  \ `if(x==42)` 时误用 `if(x=42)`）。\n\n### 隐式转换\n在其他情况下，例如从 `int` 类型到 `long` 类型，没有精度的损失，类型的值也没有发生根本变化。在这些情况下，代码只需要指定赋值运算符；转换是隐式的。换句话说，编译器能够确定这种转换将正常工作。列表\
  \ 2.25 中的代码通过简单使用赋值运算符从 `int` 转换为 `long`。\n\n**列表 2.25：不使用强制转换符进行隐式转换**\n```csharp\n\
  int intNumber = 31416;\nlong longNumber = intNumber;\n```\n\n即使不需要显式的强制转换符（因为允许隐式转换），仍然可以包含强制转换符（参阅\
  \ 列表 2.26）。\n\n**列表 2.26：使用强制转换符进行隐式转换**\n```csharp\nint intNumber = 31416;\nlong\
  \ longNumber = (long)intNumber;\n```\n\n#### 在不使用强制转换进行类型转换\n在其他情况下，由于没有从字符串到数值类型的有效强制转换，因此需要使用\
  \ `Parse()` 方法。每个数值类型都包含一个 `Parse()` 函数，可以将字符串转换为相应的数值类型。列表 2.27 展示了这种调用。\n\n**列表\
  \ 2.27：使用 int.Parse() 将字符串转换为数值类型**\n点击此处查看代码图像\n```csharp\nstring text = \"9.1E-3\"\
  ;\nfloat kgMass = float.Parse(text);\n```\n\n另一种用于将一种类型转换为另一种类型是 `System.Convert`，其示例出现在\
  \ 列表 2.28 中。\n\n**列表 2.28：使用 System.Convert 进行类型转换**\n点击此处查看代码图像\n```csharp\nstring\
  \ middleCText = \"26.62\";\ndouble middleC = System.Convert.ToDouble(middleCText);\n\
  bool boolean = System.Convert.ToBoolean(middleC);\n```\n\n此外，所有类型都支持 `ToString()`\
  \ 方法，可以用于提供类型的字符串表示。列表 2.29 展示了如何使用该方法。\n\n**列表 2.29：使用 ToString() 转换为字符串**\n点击此处查看代码图像\n\
  ```csharp\nbool boolean = true;\nstring text = boolean.ToString();\n// 显示 \"True\"\
  \nSystem.Console.WriteLine(text);\n```\n结果是：\nTrue\n\n对于大多数类型，`ToString()` 方法将返回类型的名称而不是字符串表示。只有当类型显式实现了\
  \ `ToString()` 时，它才会返回字符串表示。最后要说明的一点是可以编写自定义方法，并且类中存在许多此类方法。\n\n### 高级主题：TryParse()\n\
  从 C# 2.0 开始，所有数值类型都包含一个静态 `TryParse()` 方法。该方法与 `Parse()` 方法非常相似，不同之处在于如果转换失败，`TryParse()`\
  \ 返回 `false`，而不是抛出异常，如 列表 2.30 所示。\n\n**列表 2.30：使用 TryParse() 代替无效异常**\n点击此处查看代码图像\n\
  ```csharp\ndouble number;\nstring input;\nSystem.Console.Write(\"输入一个数字： \");\n\
  input = System.Console.ReadLine();\nif (double.TryParse(input, out number))\n{\n\
  \    // 转换正确，现在使用 number\n    // ...\n}\n```\n\n\n\n\n```csharp\nelse\n{\n    System.Console.WriteLine(\"\
  The text entered was not a valid number.\");\n}\n```\n\n输出 2.19 显示了列表 2.30 的结果。\n\
  \n**输出 2.19**\n\n点击此处查看代码图像\n\n输入数字：forty-two\n\n输入的文本不是有效的数字。\n\n代码从输入 `string`\
  \ 解析出的结果通过 `out` 参数返回——在这种情况下，该参数为 `number`。\n\n`Parse()` 和 `TryParse()` 之间的关键区别在于\
  \ `TryParse()` 在失败时不会抛出异常。通常情况下，从 `string` 到数值类型的转换取决于用户输入的文本。在这些情况下，预计用户会输入无法成功解析的无效数据。通过使用\
  \ `TryParse()`而不是 `Parse()`，你可以避免在预期情况下抛出异常。（在这种情况下，预期情况是用户会输入无效数据，而我们试图避免在预期场景下抛出异常。）\n\
  \n`结束 2.0`\n\n## 数组\n\n变量声明的一个第 1 章”，只需熟悉它们的实例化和赋值即可。表 2.7![Image](img/02tab07a.jpg)\n\
  \n**表 2.7 数组重点**\n\n此外，章节的最后部分“常见数组错误”对某些数组的特殊进行了回顾。\n\n### 声明数组\n\n在 C# 中，你使用方括号声明数组。首先，你指定数组的元素类型，后面跟着左、右方括号；然后输入变量名。列表\
  \ 2.31\n\n```csharp\nstring[] languages = { \"C#\", \"COBOL\", \"Java\", \"C++\"\
  , \"Visual Basic\", \"Pascal\", \"Fortran\", \"Lisp\", \"J#\" };\n```\n\n声明后的赋值语法需要\
  \ `new` 关键字。[列表 2.34](#ch02.html_ch02lis34）显示了声明后的赋值。\n\n**列表 2.34：声明后的赋值**\n\n\
  ```csharp\nstring[] languages;\nlanguages = new string[] {\"C#\", \"COBOL\", \"\
  Java\", \"C++\", \"Visual Basic\", \"Pascal\", \"Fortran\", \"Lisp\", \"J#\"};\n\
  ```\n\n从 C# 3.0 开始，只要能够从数组初始化器推断出元素类型，在 `new` 之后指定数组类型是可选的。[列表 2.35](#ch02.html_ch02lis35）显示了在声明期间使用\
  \ `new` 关键字。\n\n**列表 2.35：声明时使用 `new` 赋值数组**\n\n```csharp\nstring[] languages =\
  \ new[] { \"C#\", \"COBOL\", \"Java\", \"C++\", \"Visual Basic\", \"Pascal\", \"\
  Fortran\", \"Lisp\", \"J#\" };\n```\n\n\n\n\n\n初始化语句中的数组大小与花括号内包含的元素数量匹配。此外，可以分配一个数组但不指定数组的初始值，如\
  \ 列表 2.37 所示。\n\n**列表 2.37：不使用字面量值赋值**\n\n点击此处查看代码图像\n\n```cpp\nstring[] languages\
  \ = new string[9];\n```\n\n分配数组但不初始化初始值仍会初始化每个元素。运行时会将元素初始化为它们的默认值，如下所示：\n\n• 引用类型（如\
  \ `string`）初始化为 `null`。\n• 数值类型初始化为 0。\n• `bool` 初始化为 `false`。\n• `char` 初始化为 `\\\
  0`。\n\n非原始值类型通过将它们的每个字段初始化为相应的默认值来递归地初始化。因此，在使用数组之前，没有逐个为数组的每个元素赋值。\n\n`Begin 2.0`\n\
  \n### 注意\n\n在 C# 2.0 中，可以使用 `default()` 运算符来生成数据类型的默认值。`default()` 接收数据类型作为参数。例如，`default(int)`\
  \ 生成 `0`，`default(bool)` 生成 `false`。\n\n`End 2.0`\n\n由于数组大小未包含在变量声明中，因此可以在运行时指定大小。例如，列表\
  \ 2.38 根据 `Console.ReadLine()` 调用中指定的尺寸创建一个数组。\n\n**列表 2.38：在运行时定义数组大小**\n\n点击此处查看代码图像\n\
  \n```cpp\nstring[] groceryList;\n\nSystem.Console.Write(\"How many items on the\
  \ list? \");\n\nint size = int.Parse(System.Console.ReadLine());\n\ngroceryList\
  \ = new string[size];\n\n// ...\n```\n\nC# 初始化多维数组的方式类似。用逗号分隔每个维数的大小。列表 2.39 初始化了一个没有任何步步的井井棋盘。\n\
  \n**列表 2.39：声明二维数组**\n\n```cpp\nint[,] cells = int[3,3];\n```\n\n使用特定位置来初始化井井棋盘可以像\
  \ 列表 2.40 所示。\n\n**列表 2.40：初始化整数二维数组**\n\n```cpp\nint[,] cells = {\n    {1, 0, 2},\n\
  \    {1, 2, 0},\n    {1, 2, 1}\n};\n```\n\n初始化遵循这种模式：存在一个包含三个 `int[]` 类型元素的数组，且每个元素都具有相同的大小；在本例中，大小为\
  \ 3。请注意，每个 `int[]` 元素的大小必须完全相同。因此，列表 2.41 所示的声明是无效的。\n\n**列表 2.41：尺寸不一致导致错误的多维数组**\n\
  \n点击此处查看代码图像\n\n```cpp\n// ERROR: 每个维度的大小必须保持一致。\nint[,] cells = {\n    {1, 0, 2,\
  \ 0},\n    {1, 2, 0},\n    {1, 2}\n    {1}\n};\n```\n\n表示井井棋盘不需要每个位置都使用整数。另一种方案是为每个玩家准备一个独立的虚拟看板，每个棋盘包含一个\
  \ `bool`，用于指示玩家选择了哪些位置。列表 2.42 对应于一个三维棋盘。\n\n**列表 2.42：初始化三维数组**\n\n点击此处查看代码图像\n\
  \n```cpp\nbool[,,] cells;\ncells = new bool[2,3,3]\n  {\n    // 玩家 1 移动\n    {true,\
  \ false, false},\n    {true, false, false},\n    {true, false, true}\n  },\n  //\
  \ 玩家 2 移动\n  {false, false, true},\n  {false, true, false},\n    {false, true, true}\n\
  \  };\n```\n\n在本例中，棋盘已初始化，并且每个维数的大小都被显式标识。除了作为 `new` 表达式的一部分标识大小外，还提供了数组的字面值。类型\
  \ `bool[,,]` 的字面值被拆分为两个大小为 3 × 3 的 `bool[,]` 数组。每个二维数组由三个大小为 3 的 `bool` 数组组成。\n\n\
  如前提到的，多维数组中的每个维度必须具有一致的大小。然而，也可以定义交错数组（jagged array），即数组的数组。交错数组的语法与多维数组略有不同；此外，交错数组不需要尺寸一致。因此，可以像\
  \ 列表 2.43 所示初始化交错数组。\n\n**列表 2.43：初始化交错数组**\n\n```cpp\nint[][] cells = {\n    new\
  \ int[]{1, 0, 2, 0},\n    new int[]{1, 2, 0},\n    new int[]{1, 2},\n    new int[]{1}\n\
  };\n```\n\n交错数组不使用逗号来识别新维度。相反，交错数组定义了一个数组的数组。在 列表 2.43 中，`[]` 放在数据类型 `int[]` 之后，从而声明了一个\
  \ `int[]` 类型的数组。\n\n注意，交错数组的每个内部数组都需要一个数组实例（或 `null`）。在本例中，你使用 `new` 来实例化交错数组的内部元素。省略实例化将导致编译错误。\n\
  \n### 使用数组\n\n你使用方括号符号（称为数组访问器）来访问数组中的特定项。要从数组中检索第一个项，将索引指定为零。在 列表 2.44 中，通过指定索引为\
  \ 0，获取了 `languages` 数组中的第一个项。\n\n**列表 2.44：声明并访问数组**\n\n点击此处查看代码图像\n\n```cpp\nstring[]\
  \ languages = new string[9]{\n    \"C#\", \"COBOL\", \"Java\",\n    \"C++\", \"\
  Visual Basic\", \"Pascal\",\n    \"Fortran\", \"Lisp\", \"J#\"};\n// 获取第 5 个项 (Java)\n\
  string language = languages[4];\n```\n\n方括号符号也用于存储数据到数组。列表 2.45 交换了 `\"C++\"` 和\
  \ `\"Java\"` 的顺序。\n\n**列表 2.45：交换位置数据**\n\n点击此处查看代码图像\n\n```cpp\nstring[] languages\
  \ = new string[9]{\n    \"C#\", \"COBOL\", \"Java\",\n    \"C++\", \"Visual Basic\"\
  , \"Pascal\",\n    \"Fortran\", \"Lisp\", \"J#\"};\n// 将 \"C++\" 保存到变量 language\n\
  string language = languages[3];\n// 将 \"Java\" 赋值给 C++ 位置\nlanguages[3] = languages[2];\n\
  // 将 language 赋值给 \"Java\" 位置\nlanguages[2] = language;\n```\n\n对于多维数组，如 列表 2.46\
  \ 所示，使用每个维度的索引来标识元素。\n\n**列表 2.46：初始化整数二维数组**\n\n点击此处查看代码图像\n\n```cpp\nint[,] cells\
  \ = {\n    {1, 0, 2},\n    {0, 2, 0},\n    {1, 2, 1}\n};\n// 将胜利的井井棋移动设置为玩家 1。\n\
  cells[1,0] = 1;\n```\n\n交错数组元素的赋值略有不同，因为它与交错数组的声明一致。第一个元素是数组数组中的数组；第二个索引指定所选数组元素中的项（参见\
  \ 列表 2.47）。\n\n**列表 2.47：声明交错数组**\n\n```cpp\nint[][] cells = {\n    new int[]{1,\
  \ 0, 2},\n    new int[]{0, 2, 0},\n    new int[]{1, 2, 1}\n};\ncells[1][0] = 1;\n\
  ```\n\n### 长度\n\n你可以获取数组的长度，如 列表 2.48 所示。\n\n**列表 2.48：检索数组长度**\n\n\n\n\n\n点击此处查看代码图像\n\
  \n```csharp\nConsole.WriteLine(\n    $\"There are { languages.Length } languages\
  \ in the array.\");\n```\n\n数组具有固定的长度；它们被绑定，使得在不重新创建数组的情况下无法更改长度。此外，越界数组的 `bounds`（或长度）会导致运行时报告错误。当你尝试使用一个数组中不存在任何元素的索引来访问（无论是检索还是赋值）数组时，就会发生这种错误。当你将数组长度作为访问数组的索引时，经常会发生此类错误，如\
  \ 列表 2.49 所示。\n\n### 列表 2.49：访问数组边界外元素，抛出异常\n\n点击此处查看代码图像\n\n```csharp\nstring languages\
  \ = new string[9];\n\n...\n\n// 运行时错误：索引越界——最后一个元素\n// 应该是 8\nlanguages[4] = languages[9];\n\
  ```\n\n#### 注意\n`Length` 成员返回数组中的项数，而不是最高索引。变量 `languages` 的 `Length` 成员为 `9`，但变量\
  \ `languages` 变量的最高索引是 `8`，因为这是从起始位置计算的。\n\n使用 `Length` 代替硬编码数组大小是一个良好的习惯。例如，要将\
  \ `Length` 作为索引，必须减去 1 以避免越界错误（参见 列表 2.50）。\n\n### 列表 2.50：在数组索引中使用 Length - 1\n\
  \n点击此处查看代码图像\n\n```csharp\nstring languages = new string[9];\n\n...\n\nlanguages[4]\
  \ = languages[languages.Length - 1];\n```\n\n为了避免越界访问数组，请使用长度检查来验证数组长度是否大于 0，并在访问数组的最后一个项时，使用\
  \ `Length – 1` 代替硬编码值（参见 列表 2.50）。\n\n`Length` 返回数组中元素的总数。因此，如果你有一个大小为 2 × 3 × 3\
  \ 的多维数组 `bool cells[,,]`，`Length` 将返回元素的总数 18。\n\n对于交错数组（jagged array），`Length`\
  \ 返回第一个数组中的元素数量。由于交错数组是数组的数组，`Length` 只评估外部包含数组并返回其元素计数，无论内部数组中包含什么。\n\n#### 语言对比：C++——缓冲区溢出错误\n\
  未托管的 C++ 并不总是检查你是否越过了数组边界。这不仅难以调试，而且犯这种错误还可能导致被称为 `buffer overrun` 的潜在安全错误。与此相反，公共语言运行时（CLR）保护所有\
  \ C#（以及托管 C++）代码免于越界边界，从根本上消除了托管代码中出现缓冲区溢出问题的可能性。\n\n#### 更多数组方法\n数组包含了操作数组内元素的额外方法——例如，`Sort()`、`BinarySearch()`、`Reverse()`\
  \ 和 `Clear()`（参见 列表 2.51）。\n\n### 列表 2.51：额外的数组方法\n\n点击此处查看代码图像\n\n```csharp\nclass\
  \ ProgrammingLanguages\n{\n    static void Main()\n    {\n        string[] languages\
  \ = new string[]{\n            \"C#\", \"COBOL\", \"Java\",\n            \"C++\"\
  , \"Visual Basic\", \"Pascal\",\n            \"Fortran\", \"Lisp\", \"J#\"};\n \
  \       System.Array.Sort(languages);\n\n        string searchString = \"COBOL\"\
  ;\n        int index = System.Array.BinarySearch(languages, searchString);\n\n \
  \       System.Console.WriteLine($\"The wave of the future, { searchString }, is\
  \ at index { index }.\");\n        System.Console.WriteLine();\n        System.Console.WriteLine($\"\
  {\"First Element\",-20}\\t{\"Last Element\",-20}\");\n        System.Console.WriteLine($\"\
  {\"-------------\",-20}\\t{\"------------\",-20}\");\n        System.Console.WriteLine($\"\
  {languages[0],-20}\\t{languages.Length-1],-20}\");\n        System.Array.Reverse(languages);\n\
  \        System.Console.WriteLine($\"{languages[0],-20}\\t{languages.Length-1],-20}\"\
  );\n        // 注意，这不会从数组中删除所有项。\n        // 反而是将每个项设置为该类型的默认值。\n        System.Array.Clear(languages,\
  \ 0, languages.Length);\n        System.Console.WriteLine($\"{languages[0],-20}\\\
  t{languages.Length-1],-20}\");\n        System.Console.WriteLine($\"After clearing,\
  \ the array size is: { languages.Length }\");\n    }\n}\n```\n\n列表 2.51 的结果显示在 输出\
  \ 2.20 中。\n\n### 输出 2.20\n\n点击此处查看代码图像\n\n```\nThe wave of the future, COBOL, is\
  \ at index 2.\nFirst Element        Last Element\n-------------        ------------\n\
  C#                  Visual Basic\nAfter clearing, the array size is: 9\n```\n\n\n\
  \n\n\n默认情况下，将一个数组变量赋值给另一个只会复制数组的引用，而不是数组的单个元素。要创建数组的完整副本，请使用数组的 `Clone()` 方法。`Clone()`\
  \ 方法将返回数组的副本；更改此新数组的任何成员都不会影响原始数组的成员。\n\n### 字符串作为数组\n\n`string` 类型的变量可以像字符数组一样被访问。例如，要检索名为\
  \ `palindrome` 的字符串的第四个字符，可以调用 `palindrome[3]`。但请注意，由于字符串是不可变的，无法为字符串内的特定字符赋值。因此，C#\
  \ 不允许 `palindrome[3]='a'`（在 `palindrome` 声明为 `string` 的情况下）。列表 2.53 使用数组访问器来判断命令行上的参数是否为选项，选项以连字符作为第一个字符来标识。\n\
  \n**列表 2.53: 查找命令行选项**\n\n点击此处查看代码图片\n\n```\nstring[] args;\n\n...\n\nif(args[0][0]\
  \ == '-')\n{\n    //This parameter is an option\n}\n```\n\n此段使用了 `if` 语句，该语句在第 3\
  \ 章中介绍。此外，它展示了一个有趣的示例，因为你使用数组访问器来检索字符串数组 `args` 中的第一个元素。第一个数组访问器之后是第二个，它用于检索字符串的第一个字符。因此，该代码等同于列表\
  \ 2.54 所示的内容。\n\n**列表 2.54: 查找命令行选项（简化版）**\n\n点击此处查看代码图片\n\n```go\nstring[] args;\n\
  \n...\n\nstring arg = args[0];\n\nif(arg[0] == '-')\n{\n    //This parameter is\
  \ an option\n}\n```\n\n不仅可以使用数组访问器单独访问字符串字符，还可以使用字符串的 `ToCharArray()` 方法将整个字符串作为字符数组检索。使用这种方法，你可以用\
  \ `System.Array.Reverse()` 方法反转字符串，如列表 2.55 所示，该方法用于判断字符串是否为回文。\n\n**列表 2.55: 反转字符串**\n\
  \n点击此处查看代码图片\n\n```cs\nclass Palindrome\n{\n  static void Main()\n  {\n      string\
  \ reverse, palindrome;\n      char[] temp;\n      System.Console.Write(\"Enter a\
  \ palindrome: \");\n      palindrome = System.Console.ReadLine();\n      // 移除空格并转换为小写\n\
  \      reverse = palindrome.Replace(\" \", \"\");\n      reverse = reverse.ToLower();\n\
  \      // 转换为数组\n      temp = reverse.ToCharArray();\n      // 反转数组\n      System.Array.Reverse(temp);\n\
  \      // 将数组转换回字符串并\n      // 检查反转后的字符串是否相同\n      if(reverse == new string(temp))\n\
  \      {\n          System.Console.WriteLine($\"{palindrome} is a palindrome.\"\
  );\n      }\n      else\n      {\n          System.Console.WriteLine($\"{palindrome}\
  \ is NOT a palindrome.\");\n      }\n  }\n}\n```\n\n列表 2.55 的结果出现在输出 2.22。\n\n**输出\
  \ 2.22**\n\n点击此处查看代码图片\n\n此示例使用了 `new` 关键字；这次是从反转后的字符数组创建了一个新字符串。\n\n### 常见的数组错误\n\
  \n本节介绍了三种类型的数组：单维数组、多维数组和交错数组（jagged arrays）。若干规则和特性规定了数组的声明和使用。表 2.8 指出了一些常见错误并有助于巩固这些规则。尝试先回顾“Mistake（错误）”列中的代码（不要看“Error\
  \ Description”和“Corrected Code”列），以此验证你对数组及其语法的理解。\n\n**表 2.8: 常见数组错误**\n\n### 总结\n\
  \n即使对于经验丰富的程序员来说，C# 也引入了几个新结构。例如，作为数据类型章节的一部分，本章涵盖了 `decimal` 类型，它可以用于执行财务计算而不会产生浮点异常。此外，本章还介绍了布尔类型\
  \ `bool` 不会隐式地与整数类型相互转换，从而防止了误用赋值运算符。C# 的其他与其许多前身版本不同的特征还包括 `@` 字面量字符串限定符（它强制字符串忽略转义字符）以及\
  \ `string` 数据类型的不可变性。\n\nC# 允许通过隐式转换和显式转换（即需要强制转换操作的转换）将表达式转换为给定类型。在第 9 章中，你将学习如何在自定义类型上定义自定义运算符。\n\
  \n本章以 C# 数组语法的介绍以及操作数组的各种手段结束结束。对于许多开发者来说，这种语法初看起来可能非常费畏，因此本节包含了一个与数组编码相关的常见错误列表。下一章将介绍表达式和控制流语句。本章最后几次出现的\
  \ `if` 语句也得到了讨论。\n\n## 3. 运算符与控制流\n\n在本章中，你将学习运算符、控制流语句和 C# 预处理器。**运算符**为执行适用于计算内操作数的不同计算或操作提供了语法。**控制流语句**为程序内部的条件逻辑或多次循环一段代码提供了手段。在介绍了\
  \ `if` 控制流语句后，本章探讨了布尔表达式的概念，这些表达式嵌入在许多控制流语句中。书中还提到了整数无法（即使是显式地）转换为 `bool` 以及这种限制的优处。本章以对\
  \ C# 预处理器的讨论结束。\n\n### 运算符\n\n现在你已经接触了预定义数据类型（参见第 2 章），你可以开始学习如何将这些数据类型与运算符结合起来进行计算。例如，你可以对声明的变量进行计算。\n\
  \n### 初学者主题：运算符\n\n**运算符**用于对称为**操作数**的值（或变量）执行数学或逻辑操作，以产生一个称为**结果**的新值。例如，在列表 3.1\
  \ 中，减法运算符 `-` 用于减去两个操作数（数字 `4` 和 `2`）。减法的结果存储在变量 `difference` 中。\n\n**列表 3.1: 简单的运算符示例**\n\
  \n```cs\nint difference = 4 – 2;\n```\n\n运算符通常分为三类：一元、二元和三元，分别对应操作数的个数（分别为一个、两个和三个）。本节涵盖了一些基础的一元和二元运算符。三元运算符将在章稍后的部分介绍。\n\
  \n#### 加和减一元运算符 (+, -)\n\n有时你可能想要改变数值的正符号。在这种情况下，一元减运算符 (`-`) 就派上用场了。例如，列表 3.2 将美国总债务改为负值，以表示这是一笔待付金额。\n\
