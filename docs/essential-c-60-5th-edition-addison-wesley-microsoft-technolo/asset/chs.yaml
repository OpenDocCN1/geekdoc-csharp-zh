  \ (Wait, I've reached the end of the prompt. Let me provide the translation of the\
  \ actual text provided.)\n\nThe user is asking me to act as a senior document engineer\
  \ and translator.\n\n**Prompt (English):** Assume you are a senior document engineer\
  \ and translator. Please refer to the following notes to understand the format of\
  \ Markdown documents, then refer to the example to translate the given English text\
  \ into Chinese.\n\n## 注意事项 (Notes)\n- 粗体（**bold**）和斜体（*itatic*）需要翻译内容并保留符号。 (Bold\
  \ (**bold**) and italics (*itatic*) require the content to be translated and the\
  \ symbols to be retained.)\n- 内联代码（`code`）和代码块不需要翻译。 (Inline code (`code`) and code\
  \ blocks do not need to be translated.)\n- 链接（link）需要翻译其内容，但保留网址。 (列表，表格，引用块保留格式，翻译内容\n\
  - 原文可能有多行，不要漏掉任何一行，并注意一定不要重复输出原文！！！\n- 输出应包含在“[content]...[/content]”中。 (The output\
  \ should be included in \"[content]...\n\n\n\n从消费者的角度来看，WinRT 事件并没有什么不同。在 C# 程序中，你可以像像往常一样使用\
  \ `+=` 和 `-=` 来为 WinRT 对象添加或删除事件处理程序；C# 编译器会在生成代码时确保使用了恰当的 WinRT 机制。然而，WinRT 在自定义事件访问器方面使用的机制与传统的\
  \ C# 程序略有不同，这反过来也影响了你在 C# 中为 WinRT 类型编写自定义事件访问器的方式。\n\n在普通的 C# 事件中，当你从一个事件中删除委托时，该委托是作为\
  \ `remove` 访问器的隐藏 `value` 参数传递的。`add` 或 `remove` 访问器都不返回任何值。而带有自定义访问器的 WinRT 事件使用了一种略有不同的机制：当你向事件添加委托时，`add`\
  \ 访问器会返回一个“令牌（token）”。若要从事件中删除该委托，你需要将令牌——而不是委托——传递给 `remove` 访问器。如果你想为 WinRT 事件编写自定义访问器，必须遵循\
  \ WinRT 事件模式。\n\n幸运的是，WinRT 库提供了一个特殊的辅助类，可以为你跟踪令牌及其对应的委托。该模式如示例 20.20 所示的代码所示。\n\
  \n### 示例 20.20：WinRT 事件模式\n\n点击此处查看代码图片\n\n```cs\nusing System;\n\nclass WinRTEvent\n\
  {\n  EventRegistrationTokenTable<EventHandler> table = null;\n\n  public event EventHandler\
  \ MyEvent\n  {\n    add\n    {\n      return EventRegistrationTokenTable<EventHandler>\n\
  \        .GetOrCreateEventRegistrationTokenTable(ref table)\n        .AddEventHandler(value);\n\
  \    }\n    remove\n    {\n      return EventRegistrationTokenTable<EventHandler>\n\
  \        .GetOrCreateEventRegistrationTokenTable(ref table)\n        .RemoveEventHandler(value);\n\
  \    }\n  }\n\n  void OnMyEvent()\n  {\n    EventHandler handler =\n      EventRegistrationTokenTable<EventHandler>\n\
  \        .GetOrCreateEventRegistrationTokenTable(ref table)\n        .InvocationList;\n\
  \      if (handler != null)\n        handler(this, new EventArgs());\n  }\n}\n```\n\
  \n如你所见，每当向事件添加、从事件删除或调用处理程序时，如果不存在表，就会创建一个表。（每个事件应该有一个表变量。）该表管理着从添加器返回的令牌与表中的多路委托之间的关系。只需将\
  \ `EventHandler` 类型替换为适用于你事件的委托类型，并在 `add` 和 `remove` 访问器中添加任何你代码即可。\n\n### 自动垫接的接口（Shimmed\
  \ Interfaces）\n\nWinRT 调用与普通 .NET 调用代码之间的另一个区别是，某些频繁使用的接口在 WinRT 中的名称和成员略有不同。C#\
  \ 编译器和 .NET 运行时了解这些差异，并在后台自动生成代码，将一个接口“垫接（shim）”到另一个接口，以尽可能地减少对开发者的影响。两个最著名的例子是：`IEnumerable<T>`（在\
  \ WinRT 中被称为 `IIterable<T>`）以及 `IDisposable`（在 WinRT 中被称为 `ICloseable`）。\n\n由于这些接口是自动垫接的，你可以在任何需要\
  \ `IDisposable` 的上下文（例如 `using` 语句）中使用返回 `ICloseable` 的方法。同样，序列和集合无论使用 C# 标准接口还是\
  \ WinRT 版本，其行为都是相同的。\n\n### 基于任务的异步操作\n\nWinRT API 不使用 `Task<T>` 来表示异步工作。（请参见第 18\
  \ 章 关于如何使用 `Task<T>` 和 C# 5 的 `await` 运算符的详细说明。）相反，它们使用 `IAsyncAction<T>` 接口。该类型具有许多与\
  \ `Task<T>` 相同的特征，例如它支持取消机制、进度报告机制等。\n\nC# 5 的 `await` 运算符对 `IAsyncAction<T>` 类型的操作数与对\
  \ `Task<T>`一样有效。然而，带有 `async` 关键字装饰且包含 `await` 运算符的 C# 5 方法必须返回 `Task` 或 `Task<T>`，或者返回\
  \ `void`；`async` 方法返回 `IAsyncAction<T>` 是不法的。要将 `IAsyncAction<T>` 转换为等效的 `Task<T>`，只需对其调用\
  \ `AsTask()` 方法。\n\n与 WinRT 的大多数其他问题本质上都是 API 更改，详细讨论它们超出了本书的范围。然而，重要的是，在 WinRT\
  \ 中，以前 .NET 4.5 及早期版本提供的所有高延迟同步方法都已删除，只留下了对应的 `Async` 异步版本。\n\n### 总结\n\n正如本书所示，C#\
  \ 提供了强大的功能、灵活性、一致性和极佳的结构。本章强调了 C# 程序执行底层机器码操作的能力。\n\n在我们结束本书之前，第 21 章 简描述了底层执行平台，并将焦点从\
  \ C# 语言转移到 C# 程序执行的更广泛平台。\n\n## 21. 通用语言基础设施\n\nC# 程序员在语法之外遇到的首要内容之一是 C# 程序执行的上下文。本章讨论了\
  \ C# 处理内存分配和释放、类型检查、与其他语言的互操作性、跨平台执行以及对编程元数据支持的基础原理。换句话说，本章研究了 C# 所信赖的通用语言基础设施（CLI）。它涵盖了在运行时管理\
  \ C# 的执行引擎，并考虑了 C# 如何融入更广泛的语言集合中。\n\n![图像](img/0877fig01.jpg)\n\n## 定义通用语言基础设施\n\
  \nC# 编译器不是生成处理器可以直接解释的指令，而是生成一种中间语言的指令，即**通用中间语言（Common Intermediate Language, CIL）**。随后会发生第二次编译步骤（通常在执行时），将\
  \ CIL 转换为处理器可以理解的**机器码**。然而，转换为机器码对于代码执行仍然是不够的。C# 程序还需要在代理（agent）的上下文中执行。负责管理 C#\
  \ 程序执行的代理是**虚拟执行系统（Virtual Execution System, VES）**，通常通称为运行时（runtime）。（注意，此处的运行时不是指时间，如执行时间；相反，运行时——虚拟执行系统——是负责管理\
  \ C# 程序执行的代理。）运行时负责加载和运行程序，并在程序执行时提供额外的服务（安全、垃圾回收等）。\n\nCIL 和运行时的规范包含在一个名为**通用语言基础设施（Common\
  \ Language Infrastructure, CLI）**的国际标准中。CLI 是 C# 程序执行上下文以及它如何与其他程序和库无缝交互的关键规范，即使这些程序和库是用其他语言编写的。注意，CLI\
  \ 并不规定标准的实现方式，而是规定了 CLI 平台在符合标准后应该如何行为。这为 CLI 实现者提供了在必要时进行创新的灵活性，同时提供了足够的结构，使得由一个平台创建的程序可以在不同的\
  \ CLI 实现上执行，甚至在不同的操作系统上执行。\n\n### 注意\n\n注意 CIL 和 CLI 这两个缩写的相似性以及它们所代表的含义。现在区分它们有助于你以后避免混淆。\n\
  \n\n\n\n\nCLI 标准包含了以下内容的规范：\n\n- 虚拟执行系统 (Virtual Execution System)\n- 通用中间语言 (Common\
  \ Intermediate Language)\n- 通用类型系统 (Common Type System)\n- 通用语言规范 (Common Language\
  \ Specification)\n- 元数据 (Metadata)\n- 框架\n\n本章扩展了你对 C# 的认知，包含了 CLI，这对于 C# 程序如何运行以及与程序和操作系统交互至关重要。\n\
  \n## CLI 实现\n\n有几种常用的 CLI 实现，以及一些现在具有历史意义的实现。每个 CLI 实现都包含一个 C# 编译器和一组框架类库；每个实现支持的\
  \ C# 版本以及库中具体的类集合都存在很大差异。下一页的表 21.1 描述了这些实现。\n\n![Image](img/21tab01.jpg)![Image](img/21tab01a.jpg)\n\
  \n**表 21.1：主要 C# 编译器**\n\n## C# 编译为机器码\n\n第 1 章中的 `HelloWorld` 程序列表显然是 C# 代码，并且你使用\
  \ C# 编译器对其进行了编译以执行。然而，处理器仍然无法直接解释编译后的 C# 代码。需要额外的编译步骤将 C# 编译结果转换为机器码。此外，执行过程还需要一个代理（agent）的参与，它为\
  \ C# 程序增加了更多服务——这些服务是不需要显式编写代码的。\n\n所有计算机语言都为编程定义了语法和语义。由于 C 和 C++ 等语言编译为机器码，这些语言的平台是底层操作系统和机器指令集，无论是\
  \ Microsoft Windows、Linux、UNIX 还是其他。相反，对于 C# 等语言，底层平台是运行时（或 `VES`）。\n\n`CIL` 是 C#\
  \ 编译器编译后产生的。它被称为“通用中间语言”，是因为需要额外的步骤将 `CIL` 转换为处理器可以理解的内容。下一页的图 21.1 显示了这一过程。\n\n\
  ![Image](img/21fig01.jpg)\n\n**图 21.1：将 C# 编译为机器码**\n\n换句话说，C# 编译需要两个步骤：\n\n1. 由\
  \ C# 编译器将 C# 转换为 `CIL`\n2. 将 `CIL` 转换为处理器可以执行的指令\n\n运行时能够理解 `CIL` 语句并将其编译为机器码。通常，运行时内部的**组件**执行这种从\
  \ `CIL` 到机器码的编译。该组件是**即时编译（JIT）编译器**，并且在程序安装或执行时会发生**即时编译（jitting）**。大多数 CLI 实现有利于在执行时对\
  \ `CIL` 进行编译，但 CLI 并没有规定编译何时需要发生。事实上，CLI 甚至允许对 `CIL` 进行解释而非编译，类似于许多脚本语言的工作方式。此外，.NET\
  \ 包含一个名为 `NGEN` 的工具，它可以在实际运行程序之前将其编译为机器码。这种预执行时的编译需要在程序将执行的计算机上进行，因为它会评估机器特性（处理器、内存等），这作为其生成更高效代码努力的一部分。在安装时（或执行之前执行前的任何时候）使用\
  \ `NGEN` 的优势是，你可以减少启动时对 Jitter 运行的需要，从而缩短启动时间。\n\n截至 Visual Studio 2015，C# 编译器还支持“.NET\
  \ 原生”编译，在创建部署的应用程序版本时，将 C# 代码编译为原生机器码，就像使用 `NGEN` 工具一样。Windows 通用应用程序使用了此功能。\n\n\
  ## 运行时\n\n即使在运行时将 `CIL` 代码转换为机器码并开始执行，它继续保持对执行的控制。在运行时等代理上下文中执行的代码是**托管代码（managed\
  \ code）**，而在运行时控制下执行的过程是**托管执行（managed execution）**。对执行的控制转移给了数据；这使其成为**托管数据**，因为数据的内存由运行时自动分配和释放。\n\
  \n有些不一致的是，*Common Language Runtime*（通用语言运行时）术语在技术上并不是 CLI 的通用术语。相反，`CLR` 是微软针对 .NET\
  \ 平台的特定运行时实现。无论如何，`CLR` 被随意用作*运行时*的通用术语，而技术上准确的术语 *Virtual Execution System*（虚拟执行系统）在\
  \ CLI 规范之外很少使用。\n\n由于有代理控制程序执行，可以向程序中注入额外的服务，即使程序员没有显式地为它们编写代码。因此，托管代码提供了允许这些这些服务的的信息。除了其他项目外，托管代码允许定位类型成员的元数据、异常处理、访问安全信息以及遍历栈的能力。本节的其余部分描述了通过运行时和托管执行提供的某些额外服务。CLI\
  \ 并没有显式要求所有这些服务，但已建立的 CLI 平台每个服务都有实现。\n\n### 垃圾回收\n\n**垃圾回收（Garbage collection）**根据程序需求自动释放内存的过程。对于没有自动化系统来执行此类清理的语言来说，这代表了一个重大的编程问题。没有垃圾回收器，程序员必须记住始终释放他们所做的任何内存分配。忘记这样做，或者对同一内存分配重复执行操作，会导致程序出现内存泄漏或损坏——这在\
  \ Web 服务器等长时间运行的程序中会进一步加剧。由于运行时内置对垃圾回收的支持，针对运行时执行的程序员可以专注于添加程序功能，而不是内存管理的“水水工作”。\n\
  \n* *\n\n### 语言对比：C++——确定性析构\n\n垃圾回收器如何工作的具体机制并不是 CLI 规范的一部分；因此，每个实现可以采取略有不同的方法。（事实上，垃圾回收是\
  \ CLI 未显式要求的项之一。）C++ 程序员可能需要熟悉的一个关键概念是：垃圾回收对象并不一定是**确定性的**（即在定义的、编译时已的位置）回收的。事实上，对象可以在最后一次访问到程序关闭之间的任何时间被垃圾回收。这包括在离开作用域之前回收，或在对象实例可以被代码访问很久之后。\n\
  \n* *\n\n垃圾回收器仅负责处理内存管理；也就是说，它不提供管理内存之外资源的自动化系统。因此，如果需要显式操作来释放内存以外的资源，使用该资源的程序员应该利用特殊的兼容\
  \ CLI 的编程模式，以有助于这些资源的清理（参见第 9 章）。\n\n#### .NET 上的垃圾回收\n\n大多数 CLI 实现使用分代的、压缩的、基于标记-清除的算法来回收内存。它是“分代的”的，因为生存时间短的对象将比那些在垃圾回收扫描中因仍在使用的对象更早地清理。这符合内存分配的一般模式：存在时间越久的对象将继续优于最近实例化的对象。\n\
  \n\n\n\n此外，.NET 垃圾回收器使用了标记-清除（mark-and-sweep）算法。在每次垃圾回收执行期间，它会标记待释放的对象，并将剩余的对象压缩在一起，以确保它们之间没有“脏”空间。通过使用压缩来填充由释放的对象留下的空间，通常会导致新对象的实例化更快（比非托管代码所实现的更快），因为不需要搜索内存来为新分配查找空间。这还减少了分页的机会，因为更多对象被位于同一个页面中，从而也提升了性能。\n\
  \n垃圾回收器会考虑机器上的资源以及执行时对这些资源的需求。例如，如果计算机内存仍有很大一部分未被开发，则垃圾回收器不太可能运行也不会花费时间来清理这些资源。这是非基于垃圾回收的平台和语言很少采取的优化措施。\n\
  \n### 类型安全\n\n运行时提供的核心优势之一是检查类型之间的转换，这被称为类型检查。通过类型检查，运行时可以防止程序员无意中引入无效的强制类型转换，这些转换可能会导致缓冲区溢出漏洞。此类漏洞是入侵计算机系统的常见手段之一，而让运行时自动防止这些漏洞的产生是一项巨大的收益。运行时提供的类型检查确保了以下点：\n\
  \n1. 假设你不是那种寻找此类漏洞的不法之徒。\n\n- 变量本身以及变量所引用的数据都是类型，且变量的类型与其所引用的数据类型兼容。\n- 可以对某个类型进行局部分析（而无需分析使用该类型的所有代码），以确定执行该类型的成员需要哪些权限。\n\
  - 每个类型都有一组在编译时定义的方法及其包含的数据。运行时强制执行关于哪些类可以访问这些方法和数据的规则。例如，标记为“私有”（private）的方法仅可由所属类型访问。\n\
  \n***\n\n高级主题：绕过封装和访问修饰符\n\n在权限适当的情况下，可以通过名为反射（reflection）的机制绕过封装和访问修饰符。反射提供了后期绑定，通过支持浏览类型的成员、在对象的元数据中查找特定构造体的名称，并调用类型的成员。\n\
  \n***\n\n### 代码访问安全\n\n运行时可以在程序执行时进行安全检查，根据权限允许或禁止特定类型的操作。执行特定函数的权限不仅限于对运行程序的用户进行身份验证。运行时还会根据创建程序的人以及其是否为受信任的提供者来控制执行。同样，你可能需要注意代码访问安全（CAS）还会根据代码的位置应用安全策略——默认情况下，安装在本地机器上的代码比来自局域网（LAN）的代码更受信任，而局域网代码又比互联网代码更受信任。权限可以进行调整，使得部分信任的提供者可以读写磁盘上控制位置的文件，但被阻止访问其未获得权限的其他位置（例如电子邮件程序中的电子邮件地址）。提供者的识别由提供者在编译代码时嵌入程序中的证书处理。\n\
  \n### 平台移植性\n\n运行时的一个理论特性是，它为 C# 代码及其生成的程序提供了平台移植的可能——即能够在多个操作系统上运行，并在不同的 CLI 实现上执行。在这种语境下，移植性并不限于源代码（即认为需要重新编译）。相反，为一个平台编译的单个\
  \ CLI 模块应该在任何兼容 CLI 的平台上运行，而无需重新编译。这种移植性的出现是因为迁移代码的工作位于运行时实现手中，而不是应用程序开发人员手中。\n\n\
  限制当然是，没有使用任何特定平台的 API。由于这一限制，许多开发者放弃了 CLI 中性代码，转而访问底层平台功能，而不是从头开始编写。\n\n从历史上来说，编写一个可以在多个平台使用的\
  \ C# 代码库是非常困难的，因为每个平台上的框架类库都拥有不同的类（或这些类中不同的方法）。如果你希望编写一次核心应用程序逻辑并确保它可以在任何 .NET 的现代实现中运行，最简单的方法是创建一个可迁移类库（Portable\
  \ Class Library）项目（自 2012 年起在 Visual Studio 中作为项目类型可用）。Visual Studio 将确保库中的任何代码只能引用你所选择的\
  \ Windows Desktop、Silverlight、Windows Phone、iOS、Android 以及其他平台类库共有的类和方法。或者，NET Core\
  \ 提供了跨平台支持——这是 ASP.NET 5 构建的基础的长期战略方向。\n\n要创建一个可以在 Windows 桌面、移动和控制台平台运行的完整图形化应用程序，请在\
  \ Visual Studio 2015 中选择一种“通用应用程序”（Universal Application）项目类型。\n\n### 性能\n\n许多习惯编写非托管代码的程序员会正确指出，无论程序多简单，托管环境都会给应用带来开销。权衡在于：托管代码中更高的开发效率和更少的\
  \ Bug 与运行时性能之间的取舍。这种二元对立在编程从汇编语言转向 C 等高级语言时，以及从结构化编程转向面向对象开发时也曾出现过。在大多数情况下，开发效率胜出，特别是当硬件速度的提升和价格的下降超过应用的需求时。在架构设计上花费的时间，比低级开发平台的复杂性更有可能产生巨大的性能增益。在缓冲区溢出导致安全漏洞频发的背景下，托管执行变得更具吸引力。\n\
  \n毫无疑问，某些开发场景（例如设备驱动程序）可能尚未适合托管执行。然而，随着托管执行能力和复杂性的提高，许多此类性能考虑可能会消失。届时，非托管执行将留给那些被认为需要精确控制或绕过运行时的开发场景。\n\
  \n1. 事实上，微软已经表示，托管开发将成为未来 Windows 平台编写应用程序的主要手段，即使是那些与操作系统集成的应用程序。\n\n\n\n\n\n此外，运行时引入了几个因素，这些因素有助于获得比原生编译更高的性能。例如，由于到机器码的转换是在目标机器上进行的，生成的编译代码与该机器的处理器和内存布局匹配，从而获得了非\
  \ JIT 语言通常无法利用的性能提升。此外，运行时能够响应执行条件，而直接编译到机器码的很少考虑到这些条件。例如，如果装箱（box）的内存大于所需的内存，非托管语言仍然会在代码中确定的、在编译时定义的执行点释放其内存。相比之下，JIT\
  \ 编译语言仅在内存不足或程序关机时才需要释放内存。尽管 JIT 编译会为执行过程增加一个编译步骤，但 JIT 编译器插入的代码效率可能会导致产生与直接编译为机器码的程序相当的性能。归结底，CLI\
  \ 程序并不一定比非 CLI 程序快，但它们的性能具有竞争力。\n\n### 应用程序域 (Application Domains)\n\n通过在程序和操作系统之间引入一个层，可以实现被称为`应用程序域\
  \ (app domains)`的虚拟进程或应用程序。应用程序域的行为类似于操作系统的进程，因为它在其他应用程序域之间提供了一个级别的隔离。例如，一个应用程序域有自己的虚拟内存分配，应用程序域之间的通信需要分布式通信范式，就像两个操作系统进程之间的通信一样。同样，静态数据不会在应用程序域之间共享，因此静态构造函数会在每个应用程序域中运行；假设每个应用程序域只有一个线程，那么就不需要同步静态数据了，因为每个应用程序都有该数据的自己的实例。此外，每个应用程序域都有自己的线程，就像操作系统进程一样，线程不能跨越应用程序域的边界。\n\
  \n应用程序域的意义在于，进程被认为是相对昂贵的。通过应用程序域，你可以在单个进程中运行多个应用程序域，从而避免这种额外费用。例如，你可以使用单个进程来托管一系列网站，但通过将它们放在各自的应用程序域中来将网站相互隔离。总而言之，应用程序域代表了操作系统进程和线程之间一个层上的虚拟进程。\n\
  \n### 程序集 (Assemblies)、程序清单 (Manifests) 和模块 (Modules)\n\nCLI 包含了源语言编译器输出 CIL 的规范，这通常是一个程序集。除了\
  \ CIL 指令本身，程序集还包含一个由以下组件组成的`程序清单（manifest）`：\n\n• 程序集定义和导入的类型\n• 关于程序集本身的版本信息\n\
  • 程序集依赖的附加文件\n• 程序集的安全权限\n\n程序清单本质上是程序集的头，提供了关于程序集由什么组成的所有信息，以及唯一标识它的信息。\n\n程序集可以是类库，也可以是执行文件本身，一个程序集可以引用其他程序集（而这些程序集又引用更多程序集），从而建立一个由许多组件组成的应用程序，而不是作为一个大型的单体程序存在。这是现代编程平台理所当然的一个重要特性，因为它显著提高了了可维护性，并允许单个组件在多个程序之间共享。\n\
  \n除了程序清单外，程序集还包含一个或多个模块中的 `IL` 代码。通常，程序集和程序清单被合并到一个文件中，如第 1 章 中的 `HelloWorld.exe`\
  \ 所示。然而，可以将模块放在单独的文件中，然后使用程序集链接器（`al.exe`）创建一个包含引用每个模块的清单的程序集文件^(3)。这种方法不仅提供了将程序分解为组件的另一种方法，还允许使用多种源语言开发一个程序集。\n\
  \n3。这部分是因为主要的 CLI IDE 之一的 Visual Studio .NET 缺乏处理由多个模块组成的程序集的功能。Visual Studio .NET\
  \ 的当前实现没有构建多模块程序集的集成工具，而且当它们使用此类程序集时，IntelliSense 无法完全运行。\n\n通常情况下，`module（模块）`和`assembly（程序集）`这两个术语是可以互换的。然而，在讨论兼容\
  \ CLI 的程序或库时，`assembly（程序集）`一更为常用。图 21.2 展示了各种组件术语。\n\n![Image](img/21fig02.jpg)\n\
  \n**图 21.2：程序集及其引用的模块和文件**\n\n注意，程序集和模块也可以引用本地化到特定语言的资源文件。虽然罕见，但两个不同的程序集可以引用同一个模块或文件。\n\
  \n尽管程序集可以包含多个模块和文件，但整个文件组只有一个版本号，该号位于程序集清单中。因此，应用程序中最小的可版本化组件是程序集，即使该程序集是由多个文件组成的。如果你更改了任何引用的文件——即使是为了发布补丁——而不更新程序集清单，你将违反清单以及整个程序集的完整性。因此，程序集构成了组件或部署单元的逻辑结构。\n\
  \n> 注意：程序集——而不是而不是组成它的单个模块——构成了可以进行版本控制和安装的最小单元。\n\n尽管一个程序集（逻辑结构）可能由多个模块组成，但大多数程序集只包含一个。此外，微软提供了一个\
  \ `ILMerge.exe` 工具，用于将多个模块及其清单合并到单个文件程序集中。\n\n由于程序清单包含了对程序集依赖的所有文件的引用，因此可以使用清单来确定程序集的依赖关系。此外，在执行时，运行时只需要检查清单来确定它需要哪些文件。只有分发多个应用程序共享库的工具供应商（例如微软）才需要在部署时注册这些文件。这使得部署变得简单得多。通常，基于\
  \ CLI 的应用程序部署被称为 `xcopy deployment`，这源于 Windows 的 `xcopy` 命令，该命令简单地将文件复制到选定的目标。\n\
  \n### 语言对比：COM DLL 注册\n\n与微软过去的 COM 文件不同，CLI 程序集很少需要任何类型的注册。相反，可以通过将组成程序的所有文件复制到特定目录，然后执行程序来部署应用程序。\n\
  \n### 通用中间语言 (Common Intermediate Language)\n\n\n\n\n\n与其通用语言基础设施（Common Language\
  \ Infrastructure）相相，`CIL` 和 `CLI` 的另一个重要特性是支持在同一个应用程序内进行多种语言交互（而不是源代码在多个操作系统之间的可移植性）。因此，`CIL`\
  \ 不仅是 `C#` 的中间语言，也是许多其他语言的中间语言，包括 Visual Basic .NET、类 Java 语言 `J#`、Smalltalk 的某些指令、`C++`\
  \ 以及其他语言（编写时已有 20 多种，包括 COBOL 和 FORTRAN 的版本）。编译为 `CIL` 的语言称为`源语言`，每种语言都有一个自定义的编译器，将源语言转换为\
  \ `CIL`。一旦编译为 `CIL`，源语言就不重要了。这一强大功能允许来自不同组织的不同开发小组开发库，而无必担心特定小组的语言选择。因此，`CIL` 实现了编程语言的互操作性以及平台的可移植性。\n\
  \n***\n\n### Note\n`CLI` 的一个强大特性是它对多种语言的支持。这使得可以使用多种语言创建程序，并允许使用不同语言的代码访问用另一种语言编写的库。\n\
  \n***\n\n### 通用类型系统 (CTS)\n无论使用什么编程语言，生成的程序在内部都基于数据类型运行；因此，`CLI` 包含了通用类型系统 (`CTS`)。`CTS`\
  \ 定义了类型在内存中的结构和布局方式，以及围绕类型的概念和行为。它包含了类型操作指令，以及关于存储在类型内部的数据的信息。`CTS` 标准适用于类型在语言外部边界的呈现方式和行为，因为\
  \ `CTS` 的目的是实现语言之间的互操作性。在执行时，强制执行由 `CTS` 建立的约是运行时的责任。\n\n在 `CTS` 内部，类型被分为两类。\n\n\
  - **值（Values）** 是用于表示基本类型（如整数和字符）的位模式，以及结构形式的更复杂数据。每个值类型都对应一个独立的类型标记，该标记并不存储在位本身中。独立的类型标记指向类型定义，该定义提供了值中每个位位的含义以及该值所支持的操作。\n\
  - **对象（Objects）** 内部包含对象的类型标记。（这有助于实现类型检查。）对象具有标识，使得每个实例都是唯一的。此外，对象具有槽位，可以存储其他类型（可以是值或对象引用）。与值不同，更改槽位的内容不会改变对象的标识。\n\
  \n这两类类型直接对应到 `C#` 语法，该语法提供了声明每种类型的方法。\n\n## 通用语言规范 (CLS)\n由于 `CTS` 提供的语言集成优势通常大于实现它的成本，大多数源语言都支持\
  \ `CTS`。然而，还有一个 CTS 语言合规性的子集，称为`通用语言规范 (CLS)`，其重点是库的实现。`CLS` 是为库开发者设计的，并为他们提供了编写库的标准，这些库可以被大多数源语言访问，无论使用该库的源语言是否符合\
  \ `CTS` 标准。它被称为通用语言规范，是因为它旨在鼓励 `CLI` 语言提供一种创建互操作库的方法，或提供可以从其他语言访问的库。\n\n例如，虽然语言提供对无符号整数的支持是完全合理的，但此类类型并未包含在\
  \ `CLS` 之中。因此，实现类库的开发者不应在外部暴露无符号整数，因为这样做会导致库对于不支持无符号整数的符合 `CTS` 的源语言变得难以访问。理想情况下，任何要从多种语言访问的库都应该符合\
  \ `CLS`。请注意，`CLS` 不关注未向程序集外部暴露的类型。\n\n另外注意，当你创建一个不符合 `CLS` 的 API 时，编译器可能会发出警告。要实现这一点，你可以使用程序集属性\
  \ `System.CLSCompliant` 并将参数值指定为 `true`。\n\n### 基础类库 (BCL)\n除了提供可以执行 `CIL` 代码的平台外，`CLI`\
  \ 还定义了一组程序可能采用的核心类库集，称为`基础类库 (BCL)`。这些库提供了基础类型和 API，允许程序以一致的方式与运行时和底层操作系统交互。`BCL`\
  \ 包含了对集合、简单文件访问、某些安全性、基本数据类型（包括 `string` 等）、流等内容的支持。\n\n同样，一个名为`框架类库 (FCL)` 的微软特有库还包含了对富客户端用户界面、Web\
  \ 用户界面、数据库访问、分布式通信等内容的支持。\n\n### 元数据 (Metadata)\n除了执行指令外，`CIL` 代码还包含关于程序中包含的类型和文件的`元数据`。元数据包括以下项：\n\
  \n- 程序或类库中每个类型的描述\n- 包含程序本身数据以及其所依赖库的清单信息\n- 嵌入在代码中的自定义属性，提供了有关属性所修饰结构的附加信息\n\n\
  元数据并不是 `CIL` 一个草率的、非本质的附加物。相反，它代表了 `CLI` 实现的核心组件。它提供了关于类型的表示信息和行为信息，并包含了关于哪个程序集包含特定类型定义的位置信息。它在保存从编译器产生的数据并使其执行时让调试器和运行时访问这些数据方面起着关键作用。这些数据不仅在\
  \ `CIL` 代码可用，在机器代码执行期间也是可以访问的，以便运行时继续进行任何必要的类型检查。\n\n元数据为运行时提供了一种处理原生代码和托管代码混合执行的机制。此外，它增加了代码和执行的健壮性，因为它平滑了从一个库版本到下一个迁移，将编译时绑定替换为加载时实现。\n\
  \n关于库及其依赖项的所有头部信息都位于元数据的某部分，称为清单（manifest）。因此，元数据的清单部分允许开发者确定模块的依赖项，包括关于依赖项特定版本的信息以及创建模块的签名。在执行时，运行时使用清单来确定加载哪些依赖库、判断库或主程序是否被篡改以及程序集是否缺失。\n\
  \n元数据还包含可能修饰代码的`自定义属性`。属性提供了关于 `CIL` 指令的附加元数据，程序可以在执行期间访问这些数据。\n\n元数据通过一种反射（reflection）机制在执行时可用。通过反射，可以在执行时查找类型或其成员，然后调用该成员或判断构造是否被装饰了特定属性。这提供了`晚绑定`（late\
  \ binding），即系统在执行时确定执行哪些代码，而不是在编译时。反射甚至可以用于生成文档，通过遍历元数据并将其复制到某种帮助文档中（参见第 17 章）。\n\
  \n### 总结\n\n\n\n\n\n本章描述了许多术语和缩写，它们对于理解 C# 程序运行的上下文至关重要。大量的三字母缩写可能会让人产生困惑。表 21.2\
  \ 提供了 CLI 部分术语和缩写的总结列表。\n\n![Image](img/21tab02.jpg)![Image](img/21tab02a.jpg)\n\
  \n**表 21.2：常见的 C# 相关缩写**\n\n# 下载并安装 C# 编译器和 CLI 平台\n\n要编译并运行 C# 程序，需要安装一个版本的编译器和\
  \ CLI 平台。\n\n## Windows 版 .NET\n\n主要的 CLI 平台是 Microsoft .NET，它是 Microsoft Windows\
  \ 上开发的首选平台。\n\n• 如果需要一个包含 IntelliSense 和项目文件支持的 IDE，请安装版本的 Visual Studio IDE。Visual\
  \ Studio 2015 的“社区版”是免费的，它包含了制作服务器应用程序、富客户端应用程序和跨平台移动应用程序所需的所有内容。该版本以及 Visual Studio\
  \ 其他版本可以在 [`visualstudio.com`](http://visualstudio.com) 获取。\n\n• Microsoft 提供免费的可重新分发包，其中包含了从\
  \ 2.0 版本开始的所有 .NET 版本的 .NET Framework 和编译器二进制文件。这些包可以在 [`www.microsoft.com/net`](http://www.microsoft.com/net)\
  \ 的下载区域获取。本书编写时，最新的发布版本是 .NET 4.6。\n\n### Visual Studio 编译\n\n2015 年，Microsoft 免费提供了\
  \ Visual Studio 2015 社区版^(1)。该公司 IDE 的完整版本，为 .NET 软件开发提供了高级平台。使用 Visual Studio 开发的主要优势之一是能够创建和打开整个文件项目，甚至可以将此类项目组合成解决方案（solutions）。\n\
  \n1。Visual Studio Express 在 2015 年之前是免费提供的，它也足够编译书中的所有示例（依赖 C# 6.0 特性的示例除外）。\n\n\
  相关的源代码^(2)包含一个解决方案文件 `EssentialCSharp.sln`，可以使用 Visual Studio 2015 打开、编译（构建）并运行。打开解决方案文件后，使用\
  \ `Build->Build Solution` 菜单编译代码。\n\n2。本书提供的源代码（以及与 C# 早期版本相关的某些章节）可以在 [IntelliTect.com/EssentialCSharp](http://IntelliTect.com/EssentialCSharp)\
  \ 下载。你也可以从 [`itl.tc/EssentialCSharpSCC`](http://itl.tc/EssentialCSharpSCC) 下载代码。\n\
  \n在执行源代码之前，你需要通过选择相关章节的项目作为启动项目来选择要执行哪个项目。例如，要执行第 1 章中的示例，你将右键点击 `Chapter01` 项目并选择\
  \ `Set As Startup Project`（设为启动项目）。如果未选择正确的章节，当你在执行时指定代码编号时，将产生一个异常，错误消息为（“Error,\
  \ could not run the Listing....”）。\n\n一旦选择了正确的项目，你可以从 `Debug->Start Without Debugging`\
  \ 菜单运行项目。或者，如果你想调试项目，可以使用 `Debug->Start Debugging`。运行后，程序将提示你想要执行的代码编号（例如 18.33）。如前所述，你只能输入设置为启动项目的项目中的代码。\n\
  \n许多示例都有对应的单元测试。要执行特定测试，请打开测试项目并导航到与要执行的示例对应的测试。从那里，右键点击测试方法并选择 `Run Tests (Ctrl+R,\
  \ T)` 或 `Debug Tests (Ctrl+R, Ctrl+T)`。\n\n### 为命令行编译设置编译器路径\n\n对于命令行编译，无论你是在使用\
  \ Visual Studio 还是仅使用运行时，都必须设置 `PATH` 环境变量以包含 C# 编译器 `CSC.EXE`。如果你的电脑上安装了 Visual\
  \ Studio，请从 Windows “开始”菜单中选择 Visual Studio 部分的 `Developer Command Prompt`（开发命令提示符）快捷方式打开命令提示符。此命令提示符会将\
  \ `CSC.EXE` 放入路径，以便从任何目录执行。\n\n如果没有安装 Visual Studio，“开始”菜单中不会出现特殊的编译器命令提示符。相反，你需要显式地引用编译器的完整路径或将其添加到路径中。编译器位于\
  \ `%Windir%\\Microsoft.NET\\Framework\\<version>`，其中 `<version>` 是 .NET Framework\
  \ 的版本（通常为 v4.0.30319，它包含了自 .NET 4.0 以来所有版本的编译器工具）， `%Windir%` 是指向 Windows 目录位置的环境变量。要将此位置添加到路径，请使用\
  \ `Set PATH=%PATH%;%Windir%\\Microsoft.NET\\Framework\\<version>`，再次替换 `<version>`\
  \ 的值。输出 A.1 提供了一个示例。\n\n**输出 A.1**\n\n单击查看图像\n\n```\nSet PATH=%PATH%;%Windir%\\\
  Microsoft.NET\\Framework\\v4.0.30319\n```\n\n## OS X 和 Linux 版 .NET\n\n自发布以来，除了\
  \ Windows 之外，一直存在跨平台的 CLI 版本允许在操作系统上运行 .NET。在本书期间，主要的平台是 .NET Core 项目和 Mono。这两者都是在\
  \ OS X 和 Linux 上开发的开源实现。\n\n### .NET Core\n\nMicrosoft 为 OS X 和 Linux 提供了 .NET Core\
  \ 版本的 .NET Framework 开源版本（除 Windows 外）；本书编写时，它处于预览发布阶段，主要由 ASP.NET 驱动。源代码和二进制下载可以在\
