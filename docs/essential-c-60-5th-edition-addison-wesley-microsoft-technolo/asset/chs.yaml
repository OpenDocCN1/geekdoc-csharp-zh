  \ `char` 类型取值的解释并不是基于其内部存储的字符，而是基于其底层值。例如，数字 `3` 由 Unicode 值 `0x33`（十六进制）表示，在十 10\
  \ 位中为 `51`。数字 `4` 由 Unicode 值 `0x34` 表示，在十 10 位中为 `52`。在列表 3.5 中将 `3` 和 `4` 相加，得到十六进制值\
  \ `0x67`，在十 10 位中为 `103`，这正是字母 `g` 的 Unicode 值。\n\n**列表 3.5：对 char 数据类型使用加法运算符**\n\
