  \ 日</date>\n        </member>\n    </members>\n</doc>\n```\n\n* *\n\n生成的文件仅包含了将元素关联回相应\
  \ C# 声明所需的元数据量。这一点很重要，因为通常情况下，需要将 XML 输出与生成的程序集结合使用以产生任何意义的文档。幸运的是，诸如免费的 GhostDoc^5\
  \ 和开源项目 NDoc^6 等工具可以生成文档。\n\n5。访问 [http://submain.com/] 了解更多关于 GhostDoc 的信息。\n\n\
  6。访问 [http://ndoc.sourceforge.net] 了解更多关于 NDoc 的信息。\n\n* *\n\n### 指南\n\n**要在公共 API\
  \ 提供比单独 API 签名更多上下文时提供 XML 注释。这包括成员说明、参数说明以及调用 API 的示例。\n\n* *\n\n### 垃圾回收\n\n垃圾回收显然是运行时的核心功能。其目的是恢复不再被引用的对象所消耗的内存。\n\
  \n### 高级主题：NET 中的垃圾回收\n\n关于垃圾回收器的许多细节与特定的 CLI 相关，因此可能会有所不同。本节讨论 .NET 的实现，因为它是最常见的。\n\
  \n在 .NET 中，垃圾回收器使用标记-压缩（mark-and-compact）算法。在迭代开始时，它识别所有根引用。根引用是任何来自静态变量、CPU 寄存器以及局部变量或参数实例（以及后文描述的可达对象）。给定此列表，垃圾回收器能够遍历每个根引用识别的树，并递归地确定根引用指向的所有对象。通过这种方式，垃圾回收器创建了一个可达对象图。\n\
  \n垃圾回收器并不是枚举所有不可达的对象，而是通过将所有可达对象压缩在一起来执行垃圾回收，从而覆盖任何被消耗的内存。\n\n定位和移动所有可达对象需要系统在垃圾回收器运行时保持一致的状态。为了实现这一点，进程中的所有托管线程在垃圾回收期间都会停止。显然，这种行为会导致应用程序出现短暂暂停，除非需要特别大的垃圾回收周期，否则这些暂停通常是不显著的。为了减少垃圾回收周期在不合适时间发生的概率，`System.GC`\
  \ 对象包含一个 `Collect()` 方法，可以在关键执行代码之前调用它。这不会阻止垃圾回收器的运行，但在没有剧烈内存使用的情况下，它确实降低了运行概率。\n\
  \n.NET 垃圾回收行为的一个可能令人意外的方面是，并不是所有的垃圾在迭代中都会清理。对对象寿命的研究表明，新创建的对象比长期存在的对象更容易垃圾回收。利用这种行为，NET\
  \ 垃圾回收器是分代的，尝试比清理长期对象更频繁地清理短命对象。具体来说，对象被组织为三代。每当对象生存一次垃圾回收周期时，它就会移动到下一代，直到进入第二代（从零开始计数）。然后，垃圾回收器对第\
  \ 0 代对象的运行频率高于对第 2 代对象的频率。\n\n\n\n\n\n为止为止讨论的所有引用都是 `strong references`（强引用），因为它们维护了对象的可访问性，并防止垃圾回收器清理对象对象的内存。然而，框架也支持弱引用（weak\
  \ references）的概念。弱引用不会阻止对象的垃圾回收，但它们确实保持了引用，因此如果垃圾回收器没有清理对象，它就可以被重用。\n\n弱引用是为那些创建成本高昂但保留成本也更高的对象设计的。例如，考虑从数据库加载并显示给用户的大型对象列表。加载此列表的可能是昂贵的，一旦用户关闭该列表，它就应该可以被垃圾回收。然而，如果用户多次请求该列表，则将始终需要进行第二次昂贵的加载调用。通过弱引用，可以使用代码检查列表是否尚未被清理，如果尚未清理，则可以重新引用同一个列表。通过这种方式，弱引用充当对象的内存缓存。缓存中的对象可以被快速检索，但如果垃圾回收器已经了这些对象的内存，则需要重新创建它们。\n\
  \n一旦某个对象（或对象集合）被认为具有潜在弱引用考虑的价值，它就需要被分配给 `System.WeakReference`（参见 Listing 9.19）。\n\
  \n#### LISTING 9.19: 使用弱引用\n\n点击此处查看代码图像\n\n```csharp\n // ...\n\n private WeakReference\
  \ Data;\n\n public FileStream GetData()\n {\n     FileStream data = (FileStream)Data.Target;\n\
  \     if (data != null)\n     {\n         return data;\n     }\n     else\n    \
  \ {\n         // Load data\n         // ...\n         // Create a weak reference\n\
  \         // to data for use later. \n         Data.Target = data;\n     }\n   \
  \  return data;\n }\n // ...\n```\n\n鉴于分配了 `WeakReference` (`Data`)，你可以通过查看弱引用是否被设置为\
  \ `null` 来检查垃圾回收。这样做时的关键是首先将弱引用分配给强引用（`FileStream data = Data`），以避免在检查 `null` 和访问数据之间，垃圾回收器运行并清理了弱引用。强引用显然防止了垃圾回收器清理对象，因此必须先赋值（而不是检查\
  \ `Target` 是否为 `null`）。\n\n## 资源清理\n\n垃圾回收是运行时环境的一项核心责任。尽管如此，重要的是意识到垃圾回收过程围绕代码的内存利用展开。它并不涉及文件句柄、数据库连接、端口或其他有限资源的清理。\n\
  \n终结器（Finalizers）允许开发者编写清理类资源的代码。与使用 `new` 运算符调用的构造函数不同，终结器不能在代码中显式调用。没有等于 `delete`\
  \ 运算符的 `new` 等价。相反，垃圾回收器负责对实例调用终结器。因此，开发者无法在编译时确定终结器何时执行。他们只知道终结器将在对象最后一次使用之后和应用程序关闭之间的某个时间运行（如果进程异常终止实例，终结器可能不会执行；例如，计算机关机或强制终止进程等事件将阻止终结器的运行）。）\n\
  \n注意：你无法在编译时确定终结器何时执行。\n\n终结器的声明语法与 C# 的前身——即 C++ 的语法是完全相同的。如 Listing 9.20 所示，终结器在类名之前带有波浪号前缀。\n\
  \n#### LISTING 9.20: 定义终结器\n\n点击此处查看代码图像\n\n```csharp\nusing System.IO;\n\nclass\
  \ TemporaryFile\n{\n  public TemporaryFile(string fileName)\n  {\n    File = new\
  \ FileInfo(fileName);\n    Stream = new FileStream(\n      File.FullName, FileMode.OpenOrCreate,\n\
  \      FileAccess.ReadWrite);\n  }\n  public TemporaryFile()\n    : this(Path.GetTempFileName())\
  \ { }\n\n  // Finalizer\n  ~TemporaryFile()\n  {\n    Close();\n  }\n\n  public\
  \ FileStream Stream { get; }\n  public FileInfo File { get; }\n  public void Close()\n\
  \  {\n    Stream?.Close();\n    File?.Delete();\n  }\n}\n```\n\n终结器不允许传递任何参数，因此它们不能被重载。此外，终结器不能被显式调用——也就是说，只有垃圾回收器可以调用终结器。因此，终结器访问修饰符是没有意义的，因此它们不受支持。基类中的终结器将作为对象终结调用的一部分自动调用。\n\
  \n注意：终结器不能被显式调用；只有垃圾回收器可以调用终结器。\n\n由于垃圾回收器处理所有的内存管理，终结器并不负责释放内存。相反，它们负责释放数据库连接和文件句柄等资源——这些资源需要一种垃圾回收器不知道的显式操作。\n\
  \n终结器在自己的线程上执行，这使得它们的执行更不确定性。这种不确定性使得终结器内部未处理的异常（在调试器之外）难以诊断，因为导致异常的情况并不清楚。从用户的角度来看，未处理的异常将相对随机地抛出，且几乎忽略用户正在执行的任何操作。由于由于原因，你应该小心避免在终结器内部产生异常。相反，你应该使用防御编程技术，例如检查空（参见\
  \ Listing 9.20）。\n\n#### 使用 语句实现确定性终结\n\n终结器本身的问题在于，它们不支持**确定性终结**（即知道终结器何时运行的能力）。相反，终结器起着重要的备份机制作用，当使用类的开发者忽略了显式调用所需的清理代码时，清理资源。\n\
  \n例如，考虑 `TemporaryFile`，它不仅包含一个终结器，还包含一个 `Close()` 方法。该类使用文件资源，可能会消耗大量的磁盘空间。使用 `TemporaryFile`\
  \ 的开发者可以显式调用 `Close()` 来恢复磁盘空间。即使开发者未能显式调用 `Close()`，终结器也会处理该调用。在这种情况下，终结器的运行时间会比显式调用要晚——但它最终会被调用。\n\
  \n\n\n\n由于确定性终化的重要性，基类库包含一个用于该模式的特定接口，C# 将该模式集成到了语言中。`IDisposable` 接口通过一个名为 `Dispose()`\
  \ 的单一方法定义了模式的细节，开发者在资源类上调用该方法来“销毁”已消耗的资源。列表 9.21 演示了 `IDisposable` 接口以及调用它的示例代码。\n\
  \n#### 列表 9.21：使用 IDisposable 进行资源清理\n\n点击此处查看代码图像\n\n* * *\n\n```c\nusing System;\n\
  \nusing System.IO;\n\nclass Program\n{\n  // ...\n\n  static void Search()\n  {\n\
  \      TemporaryFileStream fileStream =\n          new TemporaryFileStream();\n\
  \      // Use temporary file stream;\n      // ...\n\n      fileStream.Dispose();\
  \                            \n      // ...\n  }\n}\n\nclass TemporaryFileStream\
  \ : IDisposable\n{\n  public TemporaryFileStream(string fileName)\n  {\n      File\
  \ = new FileInfo(fileName);\n      Stream = new FileStream(\n          File.FullName,\
  \ FileMode.OpenOrCreate,\n          FileAccess.ReadWrite);\n  }\n  public TemporaryFileStream()\n\
  \      : this(Path.GetTempFileName()) { }\n\n  ~TemporaryFileStream()\n  {\n   \
  \   Dispose(false);                              \n  }\n\n  public FileStream Stream\
  \ { get; }\n  public FileInfo File { get; }\n  public void Close()\n  {\n      Dispose();\n\
  \  }\n\n  #region IDisposable Members\n\n  public void Dispose()               \
  \             \n  { \n      Dispose(true);                              \n     \
  \ // Turn off calling the finalizer              \n      System.GC.SuppressFinalize(this);\
  \            \n  }  \n  #endregion\n\n  public void Dispose(bool disposing)\n  {\n\
  \      // not dispose of an owned object (one with finalizer) called by member,\n\
  \      // as the owned objects method (or has been) called by finalization queue\
  \ already\n      if (disposing)\n      {\n          Stream?.Close();           \
  \               \n      }\n      File?.Delete();                              \n\
  \  }\n}\n```\n\n* * *\n\n从 `Search()` 可以看出，在实例化 `TemporaryFileStream` 后有一个对 `Dispose()`\
  \ 的显式调用。然而，如果在实例化 `TemporaryFileStream` 到调用 `Dispose()` 之间发生异常，资源将不会被清理。为了避免这个问题，C#\
  \ 提供了 `using` 语句，而不是要求程序员实现 `try/finally` 块。`using` 语句是 `try/finally` 块的快捷方式，它确保即使在执行资源期间发生异常，也会调用\
  \ `Dispose()`。关键考虑因素是所有变量必须是相同类型。\n\n#### 垃圾回收、终化和 IDisposable\n\n在 9.21 中有几个值得注意的点。首先，`IDisposable.Dispose()`\
  \ 方法包含一个对 `System.GC.SuppressFinalize()` 的重要调用。其目的是将 `TemporaryFileStream` 类从终化（f-reachable）队列中移除。这之所以可行，是因为调用了\
  \ `Dispose()` 而不是等待终结器。在对象的终化方法被调用之前，运行时无法对带有终结器的对象进行垃圾回收。然而，垃圾回收本身并不调用终化方法。相反，指向终化对象的引用被添加到\
  \ f-reachable 队列中，并根据执行上下文在认为合适的时间由额外的线程进行处理。讽刺的是，这种方法延迟了托管资源的垃圾回收——而这恰是这些资源最应该尽早清理的时候。延迟的原因是\
  \ f-reachable 队列是一个“引用”列表；因此，在它们的终化方法被调用且对象引用从 f-reachable 队列中移除之前，这些对象不会被视为垃圾。\n\
  \n* *\n\n##### 注意\n\n没有被显式销毁的带有终结器的对象会导致对象生命周期延长。即使在所有显式引用都超出作用域后，f-reachable 队列仍会有引用，使对象保持存活直到\
  \ f-reachable 队列处理完成。\n\n\n\n\n\n第三，析化器不再调用 `Close()`，而是调用带有参数 `false` 的 `Dispose(bool\
  \ disposing)`。结果是，即使文件被删除，`Stream` 也不器被关闭（释放）。有关关闭 `Stream` 的判断条件确保了：如果从析化器调用了 `Dispose(bool\
  \ disposing)`，`Stream` 实例本身也会被放入队列等待析化处理（或者取决于顺序，它可能已经运行）。因此，在执行析化器时，不应清理由托管资源拥有的对象，因为此操作将由析化队列负责。\n\
  \n第四，在同时创建 `Close()` 类型和 `Dispose()` 方法时，你应该保持谨慎。仅从 API 无法看出 `Close()` 调用了 `Dispose()`，因此开发者将会困惑是否需要显式地调用\
  \ `Close()` 和 `Dispose()`。\n\n## 语言对比：C++——确定性析构\n\n尽管析化器与 C++ 中的析构函数相似，但它们的执行时间无法在编译时确定这一事实使得它们有本质区别。垃圾收集会在对象最后一次使用一段时间后、但在程序关闭之前调用\
  \ C# 析化器；而 C++ 析构函数在对象（而非指针）超出作用域时自动被调用。\n\n虽然运行垃圾回收是一个相对昂贵的过程，但垃圾回收足够智能，可以延迟到进程利用率降低时再运行，这一事实使其比确定性析构具有优势，因为确定性析构会在编译时定义的位置运行，即使处理器正处于高需求状态。\n\
  \n## 指南原则\n\n- **必须 (DO)** 仅对拥有稀缺或昂贵资源的对象实现析化器方法，尽管析化会延迟垃圾收集。\n- **必须 (DO)** 实现\
  \ `IDisposable` 以为带有析化器的类支持确定性析化。\n- **必须 (DO)** 在实现 `IDisposable` 的类上实现析化器方法，以防未显式调用\
  \ `Dispose()`。\n- **必须 (DO)** 重构析化方法以调用与 `IDisposable` 相同的代码，可能只需调用 `Dispose()`\
  \ 方法即可。\n- **不要 (DO NOT)** 在析化器方法中抛出异常。\n- **必须 (DO)** 从 `Dispose()` 中调用 `System.GC.SuppressFinalize()`，以避免对对象重复清理资源并延迟其垃圾收集。\n\
  - **必须 (DO)** 确保 `Dispose()` 是幂等的（应该可以多次调用 `Dispose()`）。\n- **必须 (DO)** 保持 `Dispose()`\
  \ 简单，专注于析化所需的资源清理。\n- **避免 (AVOID)** 对拥有析化器的被拥有的对象调用 `Dispose()`。相反，请依赖析化队列来清理该实例。\n\
  - **避免 (AVOID)** 在析化期间引用其他未正在被析化的对象。\n- **必须 (DO)** 在重写 `Dispose()` 时调用基类的的 `Dispose()`\
  \ 方法。\n- **考虑 (CONSIDER)** 确保对象在调用 `Dispose()` 后变得不可用。在对象被释放后，除 `Dispose()` 以外的方法（这些方法可能被多次调用）应该抛出\
  \ `ObjectDisposedException`。\n- **必须 (DO)** 在拥有可释放字段（或属性）的类型上实现 `IDisposable` 并释放这些实例。\n\
  \n## 高级主题：从构造函数传播异常\n\n即使异常从构造函数传播出来，对象仍然会被实例化，尽管 `new` 运算符没有返回新实例。如果该类型定义了析化器，则该方法将在对象变为可垃圾回收时运行（这为确保析化方法可以在部分构造的对象上运行提供了额外动力）。另外请注意，如果构造函数过早共享了它的\
  \ `this` 引用，即使构造函数抛出异常，它仍然是可访问的。不要让这种场景发生。\n\n## 高级主题：复活对象\n\n当对象的析化方法被调用时，该对象的所有引用都消失了，垃圾收集之前的最后一步就是运行析化代码。尽管如此，仍然可能无意中将析化对象的引用重新添加回根引用图中在这种情况下，被重新引用的对象将不再不可访问；反之，它将无法准备好垃圾回收。然而，如果对象的析化方法已经运行，除非显式标记为待析化（使用\
  \ `GC.ReRegisterFinalize()` 方法），否则它不会再次运行。\n\n显然，以这种方式复活对象是奇特的行为，你通常应该避免这样做。析化代码应该是简单的，并且专注于清理它所引用的资源。\n\
  \n## 懒性初始化\n\n在前面的小节中，我们讨论了如何使用 `using` 语句确定地释放一个对象，以及在没有使用确定性方法时析化队列将如何释放资源。\n\n\
  一个相关的模式被称为懒性初始化或懒加载。使用懒性初始化，你可以在需要时创建（或获取）对象，而不是预先创建——当这些对象从未被使用时，后者可能是特别麻烦的情况。考虑\
  \ 列表 9.23 中的 `FileStream` 属性。\n\n**列表 9.23：属性的懒加载**\n\n点击此处查看代码图像\n\n```csharp\n\
  using System.IO;\n\nclass DataCache\n{\n    // ...\n    public TemporaryFileStream\
  \ FileStream =>\n        InternalFileStream ?? (InternalFileStream = new TemporaryFileStream());\n\
  }\n```\n\n在 `FileStream` 表达式体属性中，我们在返回其值之前检查 `InternalFileStream` 是否不空。如果 `InternalFileStream`\
  \ 为 `null`，我们首先实例化 `TemporaryFileStream` 并将其赋值给 `InternalFileStream`，然后返回新实例。因此，`TemporaryFileStream`\
  \ 只在调用访问器时才创建。如果访问器从未被调用，`TemporaryFileStream` 就不会被实例化，从而节省了实例化可能产生的时间。显然，如果实例化是忽略不微或不可避免的（推迟并不理想），在声明或构造函数中简单地赋值是合理的。\n\
  \n4.0\n\n## 高级主题：使用泛型和 Lambda 表达式进行懒加载\n\n从 .NET Framework 4.0 开始，CLR 添加了一个新类来辅助懒性初始化：`System.Lazy<T>`。列表\
  \ 9.24 展示了如何使用它。\n\n**列表 9.24：使用 System.Lazy<T> 加载属性**\n\n点击此处查看代码图像\n\n```csharp\n\
  using System.IO;\n\nclass DataCache\n{\n    // ...\n    public TemporaryFileStream\
  \ FileStream => InternalFileStream.Value;\n\n    private Lazy<TemporaryFileStream>\
  \ InternalFileStream { get; }\n        = new Lazy<TemporaryFileStream>(() => new\
  \ TemporaryFileStream());\n    // ...\n}\n```\n\n`System.Lazy<T>` 类接受一个类型参数（`T`），用于标识\
  \ `System.Lazy<T>` 的 `Value` 属性返回的类型。与其将一个完全构造的 `FileStream` 赋值给 `_FileStream` 字段，不如赋值一个\
  \ `Lazy<FileStream>` 实例（轻量级调用），从而延迟 `FileStream` 本身的实例化，直到访问 `Value` 属性（以及 `FileStream`\
  \ 属性）。\n\n如果在类型参数（泛型）之外还使用委托，你甚至可以提供一个函数以便在访问 `Value` 属性时初始化对象。列表 9.24 展示了将委托（在这种情况下为\
  \ Lambda 表达式）传递给构造函数的用法。\n\n\n\n\n\n请注意，lambda 表达式 `() => new TemporaryFileStream(FileStreamName)`\
  \ 本身在调用 `Value` 之前不会执行。相反，该 lambda 表达式提供了一种传递后续发生操作指令的方法；在没有显式请求之前，它不会实际执行这些指令。\n\
  \n一个明显的问题是，何时应该使用 `System.Lazy<T>` 而不是列表 9.23 中概述的方法。它们的差异微乎其微：事实上，列表 9.23 实际上更简单。也就是说，在不涉及多个线程（即不会发生实例化竞态条件）的情况下，它是简单的。在列表\
  \ 9.23 中，在实例化之前可能会发生多次空检查，导致创建多个实例。相比之下，`System.Lazy<T>` 提供了一种线程安全的机制，确保创建且仅创建一个对象。\n\
  \n***\n\n`结束 4.0`\n\n### 总结\n\n本章快速回顾了许多与构建健壮类库相关的主题。所有主题都涉及内部开发，但它们对于构建健壮的类来说更为重要。最终，这里的重点是形成更健壮、更具编程性的\
  \ API。在健壮性范畴，我们可以包括命名空间和垃圾收集。这两个主题也属于可编程性范畴，还有重写 `object` 的虚成员、运算符重载以及用于文档的 XML\
  \ 注释。\n\n异常处理大量使用继承，通过定义异常层次结构并强制自定义异常以符合该层次结构。此外，C# 编译器使用继承来验证 catch 块的顺序。在下一章中，你将看到为什么继承是异常处理的核心部分。\n\
  \n## 10. 异常处理\n\n第 4 章讨论了使用 `try/catch/finally` 块进行标准异常处理。在该章中，catch 块始终捕获 `System.Exception`\
  \ 类型的异常。本章定义了异常处理的一些额外细节——特别是关于其他异常类型的细节、定义自定义异常，以及处理每种类型的多个 catch 块。本章还详细讨论了异常，因为它们依赖于继承。\n\
  \n![Image](img/0433fig01.jpg)\n\n### 多种异常类型\n\n列表 10.1 抛出了 `System.ArgumentException`，而不是第\
  \ 4 章所示的 `System.Exception` 类型。C# 允许代码抛出任何派生（可能间接）自 `System.Exception` 的类型。\n\n\
  要抛出异常，只需在异常实例前加上关键字 `throw` 即可。使用的异常类型显然是最好描述导致异常的错误情况的类型。\n\n例如，考虑列表 10.1 中的 `TextNumberParser.Parse()`\
  \ 方法。\n\n`开始 6.0`\n\n**列表 10.1: 抛出异常**\n\n点击此处查看代码图像\n\n***\n\n```csharp\npublic\
  \ sealed class TextNumberParser\n{\n  public static int Parse(string textDigit)\n\
  \  {\n    string[] digitTexts =\n        { \"zero\", \"one\", \"two\", \"three\"\
  , \"four\",\n            \"five\", \"six\", \"seven\", \"eight\", \"nine\" };\n\
  \    int result = Array.IndexOf(\n        digitTexts, textDigit.ToLower());\n  \
  \  if (result < 0)\n    {\n      // 利用 C# 6.0 的 nameof 运算符。\n      throw new ArgumentException(\n\
  \          \"The argument did not represent a digit\",\n          nameof(textDigit));\n\
  \    }\n    // ... (其余实现部分)\n    return result;\n  }\n}\n```\n\n***\n\n与其抛出 `System.Exception`，抛出\
  \ `ArgumentException` 更合适，因为它指示了发生了什么问题。两个类似的异常是 `ArgumentNullException` 和 `ArgumentOutOfRangeException`。当值为\
  \ null 时，通常会抛出 `ArgumentNullException`。程序员不应该触发 `NullReferenceException`，而应该检查参数是否为\
  \ `null`，然后抛出 `ArgumentNullException`。\n\n参数异常类型（包括 `ArgumentException`、`ArgumentNullException`\
  \ 和 `ArgumentOutOfRangeException`）的一个重要特性是，每个类型都有一个允许指定名称的构造函数参数。在 C# 6.0 之前，这意味着需要硬编码一个魔术字符串（例如\
  \ \"textDigit\"）来识别参数名。幸运的是，C# 6.0 提供了一个新运算符 `nameof`，它可以获取参数名标识符并在编译时生成参数名。这种方法的优处是，现在\
  \ IDE 可以使用重构工具（如自动重命名）来更改所有的标识符。此外，如果参数名称发生变化（在使用重构工具的情况下），如果传递给 `nameof` 的标识符不再存在，编译器将生成错误。从以后，对于\
  \ C# 6.0（或更高版本），通用指南是始终使用 `nameof` 运算符作为参数异常的参数名。\n\n其他其他几个异常仅用于运行时，并派生（有时间接）自 `System.SystemException`。它们包括\
  \ `System.StackOverflowException`、`System.OutOfMemoryException`、`System.Runtime.InteropServices.COMException`、`System.ExecutionEngineException`\
  \ 和 `System.Runtime.InteropServices.SEHException`。不要抛出这些类型的异常。同样，你应该避免抛出 `System.Exception`\
  \ 或 `System.ApplicationException`，因为这些异常太通用了，无法为问题的原因或解决方案提供太多指示。相反，请抛出符合场景的最派生异常。显然，开发者应该避免创建可能导致系统故障的\
  \ API。然而，如果执行代码达到了某种状态，导致继续执行是不安全或不可恢复的，它应该调用 `System.Environment.FailFast()`。这将在向\
  \ Windows 应用程序日志写入消息后立即终止进程，如果用户选择，甚至会将消息作为 Windows 错误报告的一部分。\n\n***\n\n### 指南\n\
  \n**如果**向成员传递了错误的参数，**请**抛出 `ArgumentException` 或其子类型之一。如果适用，请优先使用最派生的异常类型（例如 `ArgumentNullException`）。\n\
  \n**在**抛出 `ArgumentException` 或其子类时，**请**设置 `ParamName` 属性。\n\n对于传递到接收此类参数的 `ArgumentException`、`ArgumentOutOfRangeException`\
  \ 和 `ArgumentNullException` 等参数异常类型，**请**使用 `nameof` 处理传递的 `paramName` 参数。\n\n\n\
  \n\n\n`不要` 抛出 `NullReferenceException`。相反，当值意外为 null 时，请抛出 `ArgumentNullException`。\n\
  \n`不要` 抛出 `System.SystemException` 或派自它的异常类型。\n\n`不要` 抛出 `System.Exception` 或 `System.ApplicationException`。\n\
  \n如果程序遇到不适合继续执行的场景，`考虑`通过调用 `System.Environment.FailFast()` 终止进程。\n\n`结束 6.0`\n\n\
  ### 捕获异常\n\n抛出特定异常类型允许捕获者使用异常类型本身来识别问题。换句话说，没有必要捕获异常并使用 `switch` 语句根据异常消息来确定采取什么行动。相反，C#\
  \ 允许使用多个 catch 块，每个块都针对特定的异常类型，如 列表 10.2 所示。\n\n**列表 10.2: 捕获不同异常类型**\n\n点击此处查看代码图片\n\
  \n```csharp\nusing System;\n\npublic sealed class Program\n{\n  public static void\
  \ Main(string[] args)\n  {\n      try\n      {\n          // ...\n          throw\
  \ new InvalidOperationException(\n              \"Arbitrary exception\");\n    \
  \      // ...\n      }\n      catch(Win32Exception exception)\n          when(exception.ErrorCode\
  \ == 42)\n      {\n          // Handle Win32Exception where\n          // ErrorCode\
  \ is 42.\n      }\n      catch (NullReferenceException exception)\n      {\n   \
  \       // Handle NullReferenceException\n      }\n      catch (ArgumentException\
  \ exception)\n      {\n          // Handle ArgumentException\n      }\n      catch\
  \ (InvalidOperationException exception)\n      {\n          bool exceptionHandled=false;\n\
  \          // Handle InvalidOperationException\n          // ...\n          if(!exceptionHandled)\n\
  \          {\n              throw;\n          }\n      }\n      catch (SystemException)\n\
  \      {\n          // Handle SystemException\n      }\n      catch (Exception exception)\n\
  \      {\n          // Handle Exception\n      }\n      finally\n      {\n     \
  \     // Handle any cleanup code here as it runs\n          // regardless of whether\
  \ there is an exception\n      }\n  }\n}\n```\n\n列表 10.2 包含了五个 catch 块，每个块处理不同类型的异常。当发生异常时，执行将跳转到与异常类型最匹配的\
  \ catch 块。匹配的紧密程度由继承链决定。例如，尽管抛出的异常类型为 `System.Exception`，但由于 `InvalidOperationException`\
  \ 最终派生自 `System.Exception`，因此发生了这种关系。由于 `InvalidOperationException` 最匹配，`catch(InvalidOperationException...)`\
  \ 将捕获该异常，而不是 `catch(Exception...)` 块。\n\n从 C# 6.0 开始，catch 块可用一个额外的条件表达式。C# 6.0\
  \ 不再仅限于 catch 块仅根据异常类型进行匹配，而是增加了对条件子句的支持。`when` 子句允许你提供一个布尔值；只有当条件为真时，catch 块才会处理该异常。在\
  \ 列表 10.2 中，这是一个等号运算符。尽管如此，例如，你可以通过方法调用来验证条件。当然，你也可以简单地将条件检查放在 catch 体内部的 `if` 块中。然而，这样做会导致\
  \ catch 块在检查条件之前就成为该异常的处理器。在条件不满足的情况下，编写允许另一个 catch 块处理该异常的代码是困难的。但是，通过 `exception`，现在可以在不需要重新捕获和重新抛出异常的情况下检查程序状态（包括异常）。\n\
  \n请谨慎地使用条件子句；如果条件表达式本身抛出异常，则该新异常将被忽略，且条件被视为假（`false`）。由于此原因，你应该避免在异常表达式中抛出异常。catch\
  \ 块必须按照从具体到最通用的顺序出现，以避免编译错误。例如，将 `catch(Exception...)` 块移动到任何其他异常之前将导致编译错误，因为之前的所有异常在某处都派生自\
  \ `System.Exception`。正如 `catch (SystemException)` 所示，catch 块不需要命名参数。事实上，即使没有类型参数，最后的最后的\
  \ catch 也是允许的，正如你将在下一节中看到的那样。\n\n#### 重新抛出已有的异常\n\n在 `InvalidOperationException`\
  \ catch 块中，出现了一个 `throw` 语句，且没有指定要抛出的异常（`throw` 独立存在），尽管 catch 块中出现了一个可以重新抛出的异常实例（`exception`）。抛出特定异常将更新所有堆栈信息以匹配新位置。结果是所有指示异常原始发生调用处的堆栈信息将丢失，使得诊断问题变得困难得多。由于此原因，只要发生在\
  \ catch 块内部，C# 就支持没有显式异常引用的 `throw` 语句。这样，代码可以检查异常以判断是否可以完全处理它，如果没有则重新抛出异常（即使没有指定），就像它从未被捕获过，且不替换任何堆栈信息。\n\
  \n`开始 5.0`\n\n### 高级主题：在不替换堆栈信息的情况下抛现有异常\n\n在 C# 5.0 中，增加了一种机制，允许抛出之前抛出的异常，而不丢失原始异常中的堆栈跟踪信息。这允许你重新抛出异常，例如，即使在\
  \ catch 块外部，因此无需使用 `throw;`。虽然这样做相当罕见，但在某些情况下，异常会被包装或保存，直到程序执行到 catch 块外部。例如，多线程代码可能会用\
  \ `AggregateException` 包装异常。.NET Framework 4.5 提供了 `System.Runtime.ExceptionServices.ExceptionDispatchInfo`\
  \ 类，专门通过其静态 `Capture()` 方法和实例 `Throw()` 方法来处理这种场景。列表 10.3 展示了在不重置堆栈跟踪信息或不使用空 throw\
  \ 语句的情况下重新抛出异常。\n\n**列表 10.3: 使用 ExceptionDispatchInfo 重新抛出异常**\n\n点击此处查看代码图片\n\n\
  ```csharp\nusing System\nusing System.Runtime.ExceptionServices;\nusing System.Threading.Tasks;\n\
  \nTask task = WriteWebRequestSizeAsync(url);\ntry\n{\n  while (!task.Wait(100))\n\
  \  {\n      Console.Write(\".\");\n  }\n}\ncatch(AggregateException exception)\n\
  {\n  exception = exception.Flatten();\n  ExceptionDispatchInfo.Capture(\n      exception.InnerException).Throw();\n\
  }\n```\n\n使用 `ExceptionDispatchInfo.Throw()` 方法时，编译器不像处理普通 throw 语句那样将其视为返回语句。例如，如果方法签名返回一个值，但带有\
  \ `ExceptionDispatchInfo.Throw()` 的代码路径没有返回值，编译器将发出一个指示未返回值的错误。因此，在偶尔，开发者可能被迫在 `ExceptionDispatchInfo.Throw()`\
  \ 之后跟一个返回语句，尽管该语句在运行时永远不会执行——相反，异常会被抛出。\n\n\n\n\n\nC# 没有等于 Java 异常规格符（exception\
  \ specifiers）。通过异常规格符，Java 编译器能够验证函数内部（或函数调用层次结构）抛出的所有可能异常要么被捕获，要么被声明为可能重新抛出。C#\
  \ 团队考虑过这一选项，并得出结论：它所带来的维护负担与其预期的收益并不值。因此，没有必要在整个特定的调用栈中维护所有可能异常的列表，但要轻松确定可能的异常也是不可行的。（事实证明，这对于\
  \ Java 来说同样不可能。调用虚方法或使用延迟绑定（如反射）使得在编译时无法完全解析出一个方法可能抛出哪些异常。）\n\n***\n\n`Begin 2.0`\n\
  \n### 通用 catch 块 (General Catch Block)\n\nC# 要求代码抛出的任何对象必须派生自 `System.Exception`。然而，这一要求并非所有语言通用的。例如，C/C++\
  \ 允许抛出任何对象类型，包括不派生自 `System.Exception` 的托管异常。从 C# 2.0 开始，所有异常（无论是否派自 `System.Exception`）都将作为派自\
  \ `System.Exception` 的异常传播到 C# 程序集中。结果是，`System.Exception` catch 块将捕获之前代码块未捕获的所有异常。\n\
  \nC# 还支持**通用 catch 块** (`catch{ }`)，其行为与 `catch(System.Exception exception)` 块完全相同，不同在于没有类型或变量名。此外，通用\
  \ catch 块必须出现在 catch 块列表的最后。由于通用 catch 块与 `catch(System.Exception exception)` 块相同且必须在最后出现，如果在同一个\
  \ try/catch 语句中同时存在两者，编译器会发出警告，因为通用 catch 块将永远不会被调用（更多关于通用 catch 块的信息，请参见高级主题“C#\
  \ 1.0 中的通用 catch 块”）。\n\n***\n\n### 高级主题：C# 1.0 中的通用 catch 块\n\n在 C# 1.0 中，如果方法调用（位于未用\
  \ C# 编写的程序集中）抛出了一个非 `System.Exception` 派生的异常，该异常将不会被 `catch(System.Exception)` 块捕获。例如，如果另一种语言抛出了\
  \ `string`，则异常可能处于未处理状态。为了避免这种情况，C# 包含了一个不接受参数的 catch 块。这种 catch 块被称为通用 catch 块，列表\
  \ 10.4 就包含了一个。\n\n**列表 10.4：捕获任何异常**\n\n点击此处查看代码图像\n\n***\n\n```csharp\nusing System\n\
  \npublic sealed class Program\n{\n  public static void Main()\n  {\n      try\n\
  \      {\n          // ...\n          throw new InvalidOperationException (\n  \
  \            \"Arbitrary exception\");\n          // ...\n      }\n      catch (NullReferenceException\
  \ exception)\n      {\n          // Handle NullReferenceException\n      }\n   \
  \   catch (ArgumentException exception)\n      {\n          // Handle ArgumentException\n\
  \      }\n      catch (InvalidOperationException exception)\n      {\n         \
  \ // Handle ApplicationException\n      }\n      catch (SystemException exception)\n\
  \      {\n          // Handle SystemException\n      }\n      catch (Exception exception)\n\
  \      {\n          // Handle Exception\n      }\n      catch\n      {\n       \
  \   // Any unhandled exception\n      }\n  }\n}\n```\n\n\n\n\n通常，程序员往往倾向于在调用栈中尽可能早的位置记录异常或向用户报告异常。然而，这些位置很少能够完全处理异常；相反，它们通常会诉诸重新抛出异常。在调用栈的深处，此类\
  \ `catch` 块不应记录异常或将其报告给用户。如果异常被记录并重新抛出，调用栈中更高处的调用者可能会这样做，从而导致异常的重复日志条目。糟糕糟糕，对于特定类型的应用程序，向用户显示异常可能并不合适。（例如，在\
  \ Windows 应用程序中使用 `System.Console.WriteLine()` 用户是永远无法看到的，而在无人值守的命令行进程中显示对话框可能会被忽略并导致应用程序冻结。）与日志和异常相关的用户界面应该留到调用栈中较高位置的地方使用。\n\
  \n- 在 `catch` 块内部，应使用 `throw;` 而不是 `throw <exception object>`。\n\n在 `catch` 块内部重新抛出异常是可能的。例如，`catch(ArgumentNullException\
  \ exception)` 的实现可能包含对 `throw exception` 的调用。然而，像这样重新抛出异常会将堆栈跟踪重置为重新抛出调用的位置，而不是重用原始抛出点的位置。因此，除非你重新抛出的是不同类型的异常，或者故意隐藏了原始调用堆栈，否则请使用\
  \ `throw;` 以允许相同的异常传播到调用栈上方。\n\n`Begin 6.0`\n\n- 避免在异常条件中抛出异常。\n\n在提供异常条件时，避免编写会抛出异常的代码。这样做会导致条件失效，且异常的发生将被忽略。由于此原因，请考虑将复杂的条件检查放在单独的方法中，并将其封装在\
  \ `try/catch` 块中，以显式处理该异常。\n\n- 避免可能随时间变化的异常条件。\n\n如果异常条件评估了诸如异常消息等可能随本地化或消息更改而发生条件，那么预期的异常条件将无法被捕获，从而意外地改变业务逻辑。由于此原因，请确保异常条件在长时间范围内是有效的。\n\
  \n`End 6.0`\n\n- 重新抛出不同异常时要小心。\n\n在 `catch` 块内部重新抛出不同的异常不仅会重置抛出点，还会隐藏原始异常。为了保留原始异常，请设置新异常的\
  \ `InnerException` 属性，通常可以通过构造函数赋值。重新抛出不同的异常应保留用于以下情况：\n\n**1. 更改异常类型可以阐明问题。**\n\
  \n例如，在调用 `Logon(User user)` 时，当用户列表文件无法访问时，重新抛出不同类型的异常可能比传播 `System.IO.IOException`\
  \ 更合适。\n\n**2. 私有数据是原始异常的一部分。**\n\n在上述场景中，如果文件路径包含在原始的 `System.IO.IOException` 中从而暴露了系统的私有安全信息，则应该对异常进行封装。当然，这假设\
  \ `InnerException` 没有被设置为原始异常。（有趣的是，CLR v1 的一个非常早的版本 [甚至是预 alpha 版本] 曾有一个内容类似于“安全异常：您没有权限确定\
  \ `c:\\temp\\foo.txt` 的路径”的异常。）\n\n**3. 异常类型过于具体，导致调用者无法妥善处理。**\n\n例如，与其抛出一个特定于数据库系统的异常，不如使用更通用的异常，以避免在调用栈较高处使用特定于数据库的代码。\n\
  \n* * *\n\n### 指南\n\n**避免**在调用栈的较低位置进行异常报告或记录。\n\n**不要**过度捕获（over-catch）。除非明确理解如何在栈较低处通过程序方式处理这些错误，否则应允许异常传播到调用栈上方。\n\
  \n当你理解在特定上下文中为何抛出异常并且能够以程序方式响应失败时，**考虑**捕获特定的异常。\n\n**避免**捕获 `System.Exception`\
  \ 或 `System.SystemException`，但在顶层异常处理程序除外，这些程序会在重新抛出异常之前执行最后的清理操作。\n\n**要**在 `catch`\
  \ 块内部使用 `throw` 而不是 `throw <exception object>`。\n\n**要**在重新抛出不同异常时要小心。\n\n**不要**抛出\
  \ `NullRefernceException`，当值意外为 null 时，优先使用 `ArgumentNullException`。\n\n**避免**在异常条件中抛出异常。\n\
  \n**避免**可能随时间变化的异常条件。\n\n* * *\n\n### 定义自定义异常\n\n一旦抛出异常成为最佳行动方案，使用框架异常通常是更好的选择，因为它们是经过完善且广为人知的。例如，与其抛出自定义的无效参数异常，不如是使用\
  \ `System.ArgumentException` 类型。然而，如果使用特定 API 的开发者会采取特殊行动——例如，异常处理逻辑将变化以处理自定义异常类型——那么定义自定义异常就是恰当。例如，如果映射\
  \ API 接收到的邮政编码无效的地址，与其抛出 `System.ArgumentException`，可能抛出一个自定义的 `InvalidAddressException`\
  \ 更好。关键在于调用者是否可能编写一个带有特殊处理的特定 `InvalidAddressException` `catch` 块，而不是一个通用的 `System.ArgumentException`\
  \ `catch` 块。\n\n定义自定义异常仅涉及派生自 `System.Exception` 或其他异常类型。列表 10.5 提供了一个示例。\n\n**列表\
  \ 10.5：创建自定义异常**\n\n点击此处查看代码图像\n\n* * *\n\n```cpp\nclass DatabaseException : System.Exception\n\
  {\n  public DatabaseException(System.Data.SqlClient.SQLException exception)\n  {\n\
  \    InnerException = exception;\n    // ...\n  }\n\n  public DatabaseException(System.Data.OracleClient.OracleException\
  \ exception)\n  {\n    InnerException = exception;\n    // ...\n  }\n\n  public\
  \ DatabaseException()\n  {\n    // ...\n  }\n\n  public DatabaseException(string\
  \ message)\n  {\n    // ...\n  }\n\n  public DatabaseException(string message, Exception\
  \ innerException)\n  {\n    InnerException = innerException;\n    // ...\n  }\n\
  }\n```\n\n* * *\n\n此自定义异常可能是为了封装特定的数据库异常。由于 Oracle 和 SQL Server（例如）对类似错误抛出不同的异常，应用程序可以定义一种自定义异常，将特定的数据库异常标准化为应用程序可以标准方式处理的通用异常封装。这样，无论应用程序使用\
  \ Oracle 还是 SQL Server 后端数据库，都可以在栈上方使用相同的捕获块来处理该错误。\n\n自定义异常的唯一要求是它派生自 `System.Exception`\
  \ 或其子类。然而，对于自定义异常还有几项良好的实践：\n\n- 所有异常都应该使用“Exception”后缀。这样，从名称就可以很容易确定其目的。\n\n-\
  \ 通常，所有异常都应该包含带有无参数、字符串参数以及由字符串和内部异常组成的参数 set 的构造函数。此外，由于异常通常在抛出的同一语句中构造，因此任何额外的异常数据也应允许作为构造函数的一部分。（创建所有这些构造函数的明显例外是某些数据是必需，且构造函数绕过了这些要求。）\n\
  \n\n\n\n\n- 继承链应保持相对浅层（层级少于五层）。\n\n- 当重新抛出一个与捕获的不同的异常时，内部异常（inner exception）具有重要作用。例如，如果数据库调用抛出了\
  \ `System.Data.SqlClient.SqlException`，但在数据访问层中将其捕获并重新作为 `DatabaseException` 抛出，那么接收\
  \ `SqlException`（或内部异常）的 `DatabaseException` 构造函数会将原始的 `SqlException` 保存在 `InnerException`\
  \ 属性中。这样，当需要有关原始异常的更多详细信息时，开发者可以从 `InnerException` 属性检索异常（例如 `exception.InnerException`）。\n\
  \n### 指南\n\n- **不要**在异常的处理方式与现有 CLR 异常无异的情况下创建新的异常类型。相反，请抛出现有的框架异常。\n- **要**创建一个新的异常类型来通信唯一的程序错误，该错误无法通过现有的\
  \ CLR 异常进行通信，并且可以以任何其他现有 CLR 异常类型不同的方式进行程序处理。\n- **要**为所有自定义异常类型提供无参数构造函数。还要提供接收消息和内部异常的构造函数。\n\
  - **要**使异常类名以“Exception”后缀结尾。\n- **要**使异常在运行时可序列化。\n- **考虑**提供异常属性，以便通过程序化访问与异常相关的额外信息。\n\
  - **避免**深层异常层次结构。\n\n## 高级主题：可序列化异常\n\n**可序列化对象**是运行时可以持久化到流中（例如文件流）并然后从流中重新实例化的对象。在异常的情况下，这种行为对于某些分布式通信技术可能是必要的。为了支持序列化，异常声明应该包含\
  \ `System.SerializableAttribute` 特性或实现 `ISerializable` 接口。此外，它们包含包含接收 `System.Runtime.Serialization.SerializationInfo`\
  \ 和 `System.Runtime.Serialization.StreamingContext` 的构造函数。列表 10.6 显示了使用 `System.SerializableAttribute`\
  \ 的示例。\n\n### 列表 10.6：定义可序列化异常\n\n点击此处查看代码图像\n\n```csharp\n// 通过特性支持序列化\n\n[Serializable]\n\
  class DatabaseException : System.Exception\n{\n  // ...\n  // 用于异常的反序列化\n  public\
  \ DatabaseException(\n      SerializationInfo serializationInfo,\n      StreamingContext\
  \ context)\n  {\n      //...\n  }\n}\n```\n\n上述的 `DatabaseException` 示例演示了使异常可序列化所需的特性和构造函数要求。\n\
  \n### 重新抛出封装的异常\n\n有时，在栈的较低层级抛出的异常在较高层级捕获时将不再具有意义。例如，考虑由于服务器上磁盘空间不足而发生的 `System.IO.IOException`。捕获此类异常的客户端并不一定能理解为何会有\
  \ I/O 活动的上下文。同样，考虑一个地理坐标请求 API，它抛出了一个 `System.UnauthorizedAccessException`（该异常与所调用的\
  \ API 完全无关）。在第二个示例中，调用者对于 API 调用与安全之间的关系没有上下文或理解。从调用 API 的代码的角度来看，这些异常带的困惑多于对诊断的帮助。与其将此类异常暴露给客户端，不如先捕获异常然后抛出一个不同的异常，例如\
  \ `InvalidOperationException`（甚至可能是自定义异常），以此来通信系统处于无效状态。在这些情况下，请确保设置封装异常的 `InnerException`\
  \ 属性（通常通过构造函数调用，如 `new InvalidOperationException(String, Exception)`），以便让接近被调用框架的人员可以使用用于诊断目的的额外上下文。\n\
  \n在考虑是否封装并重新抛出异常时，需要记住的一个重要细节是：原始的堆栈跟踪（它提供了异常抛出位置的上下文）将被封装异常抛出位置的新堆栈跟踪所取代（假设没有使用\
  \ `ExceptionDispatchInfo`）。幸运的是，当原始异常被嵌入封装异常中时，原始堆栈跟踪仍然可用。\n\n归结底，异常的预期接收者是编写调用你\
  \ API 代码的程序员——他们可能是错误调用的。因此，你应该为他们提供尽可能多的信息，指示程序员犯了什么错误，以及（可能更）如何修复它。异常类型是通信机制中的关键部分。因此，你必须仔细选择该类型。\n\
  \n### 指南\n\n- 如果低层异常在高级层操作的上下文中没有意义，请**考虑**将从低层抛出的特定异常封装在更合适的异常中。\n- **要**在封装异常时指定内部异常。\n\
  - **要**将开发者作为异常的受众，在可能的情况下识别问题以及解决问题的机制。\n- **要**在重新抛出相同异常时使用空抛出 语句（`throw;`），而不是将异常作为参数传递给\
  \ `throw`。\n\n## 初学者主题：检查和未检查转换\n\n正如我们在第 2 章。\n\n### 列表 10.7：整数值溢出\n\n点击此处查看代码图像\n\
  \n```csharp\nusing System;\n\npublic class Program\n{\n  public static void Main()\n\
  \  {\n      // int.MaxValue 等于 2147483647\n      int n = int.MaxValue;\n      n\
  \ = n + 1 ;\n      System.Console.WriteLine(n);\n  }\n}\n```\n\n列表 10.7 的结果出现在输出\
  \ 10.1 中。\n\n**输出 10.1**\n-2147483648\n\n列表 10.7 中的代码向控制台写入 `-2147483648`。然而，将代码放在\
  \ `checked` 块中或在运行编译器时使用 `checked` 将导致运行时抛出类型为 `OverflowException` 的异常。`checked`\
  \ 块的语法使用 `checked` 关键字，如列表 10.8](#ch10.html_ch10lis08）所示。\n\n### 列表 10.8：checked\
  \ 块\n\n点击此处查看代码图像\n\n```csharp\nusing System;\n\npublic class Program\n{\n  public\
  \ static void Main()\n  {\n      checked\n      {\n        // int.MaxValue 等于 2147483647\n\
  \        int n = int.MaxValue;\n        n = n + 1 ;\n        System.Console.WriteLine(n);\n\
  \      }\n  }\n}\n```\n\n如果计算仅涉及常量，则计算将默认进行检查。列表 10.8 的结果出现在输出 10.2 中。\n\n**输出 10.2**\n\
  点击此处查看代码图像\n\n\n\n\n\n未处理的异常：`System.OverflowException: Arithmetic operation resulted\
  \ in an overflow. at `Program.Main()` in `...Program.cs:line 12`\n\n此外，取决于 Windows\
  \ 版本以及是否安装了调试器，可能会弹出一个对话框，提示用户向微软发送错误消息、检查解决方案或调试应用程序。此外，位置位置信息（`Program.cs:line\
  \ X`）仅会在调试编译中出现——即使用 Microsoft `csc.exe` 编译器的 `/Debug` 选项进行的编译。结果是，如果在检查块内在运行时发生了溢出赋值，则会抛出异常。\n\
  \nC# 编译器提供了一个命令行选项，可以将默认的检查行为从 `unchecked` 更改为 `checked`。C# 还支持 `unchecked` 块，它会在块内的赋值时截断数据而不是抛出异常（参见列表\
  \ 10.9）。\n\n#### 列表 10.9：未检查块示例\n\n点击此处查看代码图像\n\n```sharp\nusing System;\n\npublic\
  \ class Program\n{\n  public static void Main()\n  {\n    unchecked\n    {\n   \
  \   // int.MaxValue equals 2147483647\n      int n = int.MaxValue;\n      n = n\
  \ + 1 ;\n      System.Console.WriteLine(n);\n    }\n  }\n}\n```\n\n列表 10.8 的运行出现在输出\
  \ 10.3 中。\n\n**输出 10.3**\n-2147483648\n\n即使在编译期间开启了 checked 选项，列表 10.8 中代码的 `unchecked`\
  \ 关键字也会防止运行时在执行期间抛出异常。\n\n对于不允许使用语句的情况，可以使用等等的 checked 和 unchecked 表达式。例如，字段初始化器可以由表达式组成，而不是语句：\n\
  \n点击此处查看代码图像\n\n```csharp\nint _Number = unchecked(int.MaxValue + 1);\n```\n\n###\
  \ 总结\n\n抛出异常会导致显著的性能影响。单个异常会导致加载和处理大量的运行时栈信息——这些数据在其他情况下是不会加载的——处理它们需要大量的时间。如第 4\
  \ 章所示，你应该只使用异常来处理异常情况；API 应该提供检查是否会抛出异常的机制，而不是强制调用特定的 API 来确定是否会抛出异常。\n\n下一章介绍泛型——这是\
  \ C# 2.0 的特性，它显著增强了用 C# 1.0 编写的代码。事实上，它基本上废弃了对 `System.Collections` 命名空间的使用，该命名空间以前几乎用于每个项目。\n\
  \n## 11. 泛型\n\n`2.0 开始`\n\n随着你的项目变得复杂，你需要更好的方法来重用和自定义现有软件。为了方便代码重用，特别是算法的重用，C# 包含了一个名为\
  \ `generics`（泛型）的特性。正如方法之所以强大是因为它可以接受参数一样，接受类型参数的和方法具有多得的功能。\n\n泛型在词法上类似于 Java 中的泛型和\
  \ C++ 中的模板。在所有三种语言中，这些特性都允许实现一次算法和模式，而不需要为算法所操作的每种类型单独的实现。然而，C# 泛型在实现细节以及对其语言类型系统的影响上与\
  \ Java 泛型和 C++ 模板都非常不同。泛型是在 2.0 版本中添加到运行时和 C# 中的。\n\n![图像](img/01.jpg)\n\n### 没有泛型的\
  \ C#\n\n我们通过检查一个不使用泛型的类开始讨论泛型。该类 `System.Collections.Stack` 表示一个对象的集合，其中最后添加到集合的项是第一个从集合中检索的项（后进先出）。`Push()`\
  \ 和 `Pop()` 是 `Stack` 类的两个主要方法，分别将项目添加到栈中并从栈中移除。栈上的方法声明出现在列表 1.1 中。\n\n**列表 1.1：System.Collections.Stack\
  \ 签名**\n\n```csharp\npublic class Stack\n{\n  public virtual object Pop() { ...\
  \ }\n  public virtual void Push(object obj) { ... }\n  // ...\n}\n```\n\n程序频繁使用栈集合来方便撤销操作。例如，列表\
  \ 1.2 使用 `System.Collections.Stack` 类在一个模拟写字板游戏的程序中进行撤销操作。\n\n**列表 1.2：在类似于写字板的程序中支持撤销**\n\
  \n```csharp\nusing System;\nusing System.Collections;\n\nclass Program\n{\n  //\
  \ ...\n  public void Sketch()\n  {\n    Stack path = new Stack();\n    Cell currentPosition;\n\
  \    ConsoleKey key; // 在 C# 2.0 中添加\n    do\n    {\n      // 根据用户输入的\n      //\
  \ 箭头键指示的方向绘图\n      key = Move();\n      switch (key.Key)\n      {\n        case\
  \ ConsoleKey.Z:\n          // 撤销之前的 Move\n          if (path.Count >= 1)\n     \
  \     {\n            currentPosition = (Cell)path.Pop();\n            Console.SetCursorPosition(currentPosition.X,\
  \ currentPosition.Y);\n            Undo();\n          }\n          break;\n    \
  \    case ConsoleKey.DownArrow:\n        case ConsoleKey.UpArrow:\n        case\
  \ ConsoleKey.LeftArrow:\n        case ConsoleKey.RightArrow:\n          // 保存当前状态\n\
  \          path.Push(currentPosition);\n          break;\n        default:\n   \
  \       break;\n      }\n    } while (key.Key != ConsoleKey.X); // 使用 X 退出\n  }\n\
  }\n\npublic struct Cell\n{\n  // 在 C# 6.0 之前使用只读字段\n  public int X { get; }\n  public\
  \ int Y { get; }\n  public Cell(int x, int y)\n  {\n    X = x;\n    Y = y;\n  }\n\
  }\n```\n\n\n\n此外，当使用 `Pop()` 方法从栈中检索数据时，你必须将返回值强制转换为 `Cell`。但如果 `Pop()` 方法返回的值类型不是\
  \ `Cell`，则会抛出异常。通过使用强制转换将类型检查推迟到运行时，你会使程序变得脆弱。在不使用泛型的情况下，创建可以处理多种数据类型的类，其根本问题在于它们必须与通用基类（或接口）配合，通常是\
  \ `object`。\n\n在使用了 `object` 的类中使用值类型（如结构体 `struct` 或整数）会加剧这个问题。例如，如果你将一个值类型传递给\
  \ `Stack.Push()` 方法，运行时会自动对其进行装箱（boxing）。同样，当你检索值类型时，你需要显式地对数据进行拆箱（unboxing），并将从\
  \ `Pop()` 方法获得的 `object` 引用强制转换为值类型。将引用类型强制转换为基类或接口对性能的影响微乎其微，但值类型的装箱操作会引入更多的开销，因为必须分配内存、复制值，并在稍后对该内存进行垃圾回收。\n\
  \nC# 是一门鼓励“类型安全”的语言：该语言的设计使得许多类型错误（例如，将整数赋值给 `string` 类型的变量）可以在编译时被捕获。根本问题是，栈类并没有像\
  \ C# 程序预期的那样具有类型安全性。要更改栈类以强制执行类型安全，将栈的内容限制为特定数据类型（不使用泛型类型），你必须创建一个专门的栈类，如列表 11.3\
  \ 所示。\n\n### 列表 11.3：定义专门的栈类\n\n点击此处查看代码图像\n\n```csharp\npublic class CellStack\n\
  {\n  public virtual Cell Pop();\n  public virtual void Push(Cell cell);\n  // ...\n\
  }\n```\n\n由于 `CellStack` 只能存储类型为 `Cell` 对象，这种解决方案需要对栈方法进行自定义实现，这并不理想。实现一个类型安全的整数栈将需要另一个自定义实现；每个实现看起来都与另一个实现惊地相似。这会有大量的重复、冗余代码。\n\
  \n### 初学者课题：另一个示例：可空值类型\n\n第 2 章 介绍了在声明值类型变量时使用可空修饰符 `?` 来声明可以包含 `null` 变量的能力。C#\
  \ 直到 2.0 版本才开始支持此功能，因为正确的实现需要泛型。在泛型引入之前，程序员面临基本上两种选择。\n\n第一种选择为每个需要处理 null 值的值类型声明一个可空数据类型，如列表\
  \ 11.4 所示。\n\n### 列表 11.4：声明存储 null 的各种值类型版本\n\n点击此处查看代码图像\n\n```csharp\nstruct\
  \ NullableInt\n{\n    /// <summary>\n    /// 当 HasValue 返回 true 时提供该值。\n    ///\
  \ </summary>\n    public int Value{ get; private set; }\n    /// <summary>\n   \
  \ /// 表示是否有值，或者该\n    /// 值是否为 \"null\"。\n    /// </summary>\n    public bool HasValue{\
  \ get; private set; }\n    // ...\n }\n\nstruct NullableGuid\n {\n    /// <summary>\n\
  \    /// 当 HasValue 返回 true 时提供该值。\n    /// </summary>\n    public Guid Value{ get;\
  \ private set; }\n    /// <summary>\n    /// 表示是否有值，或者该\n    /// 值是否为 \"null\"。\n\
  \    /// </summary>\n    public bool HasValue{ get; private set; }\n    ...\n }\n\
  ...\n```\n\n列表 11.4 显示了 `NullableInt` 和 `NullableGuid` 的可能实现。如果程序需要额外的可空值类型，你将不得不创建另一个结构体，并修改其属性以使用所需的值类型。实现上的任何改进（例如，添加从底层类型到可空类型的用户定义隐式转换）都要求修改所有的可空类型声明。\n\
  \n在不使用泛型的情况下实现可空类型的另一种策略是创建一个具有类型为 `object` 的 `Value` 属性的单一类型，如列表 11.5 所示。\n\n###\
  \ 列表 11.5：声明一个包含 object 类型 Value 属性的空空类型\n\n点击此处查看代码图像\n\n```csharp\nstruct Nullable\n\
  {\n    /// <summary>\n    /// 当 HasValue 返回 true 时提供该值。\n    /// </summary>\n  \
  \  public object Value{ get; private set; }\n    /// <summary>\n    /// 表示是否有值，或者该\n\
  \    /// 值是否为 \"null\"。\n    /// </summary>\n    public bool HasValue{ get; private\
  \ set; }\n    ...\n}\n```\n\n尽管这种方案只需要对可空类型进行实现，但运行时在设置 `Value` 属性时会对值类型进行装箱。此外，从\
  \ `Value` 属性中检索底层值需要进行强制转换，而该转换可能是无效的。这两种方案都不特别有吸引力。为了消除这个问题，C# 2.0 在 C# 中引入了泛型。（事实上，可空类型实际上是实现为泛型\
  \ `Nullable<T>` 的。）\n\n### 引入泛型类型\n\n泛型提供了一种可以特化处理特定类型的数据结构。泛型定义了参数化类型，使得每个特定泛型变量具有相同的算法，但数据类型和方法签名可以根据类型参数发生变化。为了降低开发者的学习曲线，C#\
  \ 选择了类似于 C++ 的语法。在 C# 中，泛型类和结构使用角括号在类型声明中声明泛型参数，在使用时指定泛型参数。\n\n#### 使用泛型类\n\n列表\
  \ 1.6 显示了如何指定泛型类使用的实际类型。通过在对象创建和声明语句中使用角符号指定 `Cell` 来指示 `path` 变量为“Cell 栈”。换句话说，当使用泛型声明变量（在本例中为\
  \ `path`）时，C# 要求开发者识别泛型类型使用的实际类型。列表 1.6 使用新的泛型 `Stack` 类说明了这一过程。\n\n### 列表 11.6：使用泛型类实现撤销\n\
  \n点击此处查看代码图像\n\n```csharp\nusing System;\nusing System.Collections.Generic;\n\n\
  class Program\n{\n  // ...\n  public void Sketch()\n  {\n    Stack<Cell> path; \
  \     // 泛型变量声明\n    path = new Stack<Cell>();  // 泛型对象实例化\n    Cell currentPosition;\n\
  \    ConsoleInfo key;\n    do\n    {\n      // 根据用户输入的箭头键\n      // 指定的方向进行移动。\n\
  \      key = Move();\n      switch (key.Key)\n      {\n        case ConsoleKey.Z:\n\
  \          // 撤销上一次移动。\n          if (path.Count >= 1)\n          {\n          \
  \  // 不需要强制转换。\n            currentPosition = path.Pop();\n            Console.SetCursorPosition(currentPosition.X,\
  \ currentPosition.Y);\n            Undo();\n          }\n          break;\n\n  \
  \      case ConsoleKey.DownArrow:\n```\n\n\n\n\n```csharp\ncase ConsoleKey.UpArrow:\n\
  case ConsoleKey.LeftArrow:\ncase ConsoleKey.RightArrow:\n    // SaveState()\n  \
  \  currentPosition = new Cell(\n        Console.CursorLeft, Console.CursorTop);\n\
  \    // Only type Cell allowed in call to Push(). \n    path.Push(currentPosition);\n\
  \    break;\ndefault:\n    Console.Beep();  // Added in C# 2.0\n    break;\n} while\
  \ (key.Key != ConsoleKey.X);  // Use X to quit.\n\n}\n}\n```\n\n* *\n\n列表 11.6 的结果出现在输出\
  \ 11.2 中。\n\n**输出 11.2**\n\n![Image](img/op11fig02.jpg)\n\n在列表 11.6 所示的 `path` 声明中，你声明了一个变量并用\
  \ `System.Collections.Generic.Stack<Cell>` 类的新实例对其初始化。你使用尖括号指定了栈元素的数据类型为 `Cell`。因此，添加到\
  \ `path` 中并从从中检索的每个对象都是 `Cell` 类型。反过来，你不再需要对 `path.Pop()` 的返回值进行强制转换，也不需要确保 `Push()`\
  \ 方法中仅添加 `Cell` 类型的对象。\n\n### 定义一个简单的泛型类\n\n泛型允许你编写算法和模式，并为不同的数据类型复用代码。列表 11.7 创建了一个泛型\
  \ `Stack<T>` 类，该类与列表 11.6 代码中使用的 `System.Collections.Generic.Stack<T>` 类类似。你在类名后的尖括号内指定了一个**类型参数**（在本例中为\
  \ `T`）。泛型 `Stack<T>` 可以提供单个类型参数，该参数会在类中所有 `T` 出现的地方被“替换”。因此，该栈可以存储任何指定类型的项，而无需重复代码或将项转换为\
  \ `object` 类型。类型参数 `T` 是一个必须提供类型参数的占位符。在列表 11.7 中，你可以看到类型参数将用于内部 `Items` 数组、`Push()`\
  \ 方法参数的类型以及 `Pop()` 方法的返回值。\n\n**列表 11.7：声明泛型类，Stack<T>**\n\n点击此处查看代码图像\n\n* *\n\
  \n```csharp\npublic class Stack<T>\n{\n    // Use read-only field prior to C# 6.0\n\
  \    private T[] InternalItems { get; }\n    public void Push(T data)\n    {\n \
  \       ...\n    }\n    public T Pop()\n    {\n        ...\n    }\n}\n```\n\n* *\n\
  \n### 泛型的优势\n\n使用泛型类相比非泛型版本（例如之前使用的 `System.Collections.Generic.Stack<T>` 类而非原始的\
  \ `System.Collections.Stack` 类型）有几个优势。\n\n1. **泛型增强了类型安全性**，防止参数化类成员之外显式意图之外的数据类型出现。在列表\
  \ 11.7 中，使用 `Stack<Cell>` 时将参数化栈类限制为 `Cell` 数据类型。（例如，语句 `path.Push(\"garbage\")`\
  \ 会产生编译错误，指示 `System.Collections.Generic.Stack<T>.Push(T)` 没有可以处理字符串的重载方法，因为字符串无法转换为\
  \ `Cell`。）\n\n2. **编译时类型检查** 减少了运行时出现 `InvalidCastException` 类型错误的概率。\n\n3. **在泛型类成员中使用值类型**\
  \ 不再会导致装箱（boxing）。\n\n4. **泛型通过避免装箱和拆箱减少了代码膨胀**。\n\n5. **性能得到提高**，因为不需要进行强制转换。\n\
  \n6. **泛型通过避免装箱减少了内存消耗**。\n\n7. **由于有了 IntelliSense，代码变得更具可读性**。\n\n8. **泛型的核心提供了编写代码模式并复用这些模式的能力**。\n\
  \n#### 类型参数命名\n\n就像为方法命名一样，在命名类型参数时也应该尽可能具有描述性。只有当描述不会增加任何价值时，你才不需要使用描述性名称。例如，在\
  \ `Stack<T>` 中使用 `T` 是合适的。\n\n* *\n\n- **应当**为类型参数选择有意义的名称并以 T 为前缀。\n- **考虑**在名称中指示约束。\n\
  \n* *\n\n#### 泛型接口和结构体\n\nC# 支持在语言范围内使用泛型，包括接口和结构体。语法与类使用的相同。要声明带有类型参数的接口，将类型参数放在接口名称随后的尖括号中，如列表\
  \ 11.8 中 `IPair<T>` 的示例所示。\n\n**列表 11.8：声明泛型接口**\n\n```csharp\ninterface IPair<T>\n\
  {\n    T First { get; set; }\n    T Second { get; set; }\n}\n```\n\n* *\n\n此接口表示同类对象的对，例如点的坐标、人的遗传父母或二叉树的节点。对中包含的类型对于两个项都是相同的。\n\
  \n要实现该接口，你使用与非泛型类相同的语法。请注意，一个泛型类型的类型参数是另一个泛型类型的类型参数是合法的也是常见的，如列表 11.9 所示。接口的类型参数是类所声明的类型参数。此外，此示例使用了结构体而非类，证明了\
  \ C# 支持自定义泛型值类型。\n\n**列表 11.9：实现泛型接口**\n\n```csharp\npublic struct Pair<T>: IPair<T>\n\
  {\n    public T First { get; set; }\n    public T Second { get; set; }\n}\n```\n\
  \n* *\n\n泛型接口的支持对于集合类尤为重要，泛型在其中最为常见。在泛型之前，开发者依赖 `System.Collections` 命名空间中的系列接口。与实现类一样，这些接口仅与\
  \ `object` 类型工作，因此，接口强制所有对这些集合类的访问和返回都需要进行强制转换。通过使用类型安全的泛型接口，你可以避免强制转换操作。\n\n\n\n\
  \n\n同一个泛型接口的两种不同构造被视为不同的类型。因此，“同一个”泛型接口可以被类或结构体实现多次。请考虑列表 11.10 中的示例。\n\n**列表 11.10：在单类类中重复实现接口**\n\
  \n点击此此处查看代码图片\n\n* * *\n\n```csharp\npublic interface IContainer<T>\n{\n    ICollection<T>\
  \ Items  { get; set; }\n    {\n        get;\n        set;\n    }\n}\n\npublic class\
  \ Person: IContainer<Address>,\n    IContainer<Phone>, IContainer<Email>\n{\n  \
  \  ICollection<Address> IContainer<Address>.Items\n    {\n        get{...}\n   \
  \     set{...}\n    }\n    ICollection<Phone> IContainer<Phone>.Items\n    {\n \
  \       get{...}\n        set{...}\n    }\n    ICollection<Email> IContainer<Email>.Items\n\
  \    {\n        get{...}\n        set{...}\n    }\n}\n```\n\n* * *\n\n在这个示例中，`Items`\
  \ 属性通过使用不同类型参数的显式接口实现出现了多次。如果没有泛型，这将是不可能的；相反，编译器将只允许一个显式的 `IContainer.Items` 属性。\n\
  \n然而，这种实现“同一个”接口的多个版本的技术被许多人认为是一种“代码异味（bad code smell）”，因为它可能引起混义（特别是当接口允许协变或逆变转换时）。此外，此处的\
  \ `Person` 类似乎可能设计得不当；人们通常不会认为某个人仅仅是“一个可以提供一组电子邮件地址的实体”。当你动想要让一个类实现同一个接口的三个版本时，请考虑改为让它实现三个属性是否更好——例如，`EmailAddresses`、`PhoneNumbers`\
  \ 和 `MailingAddresses`——每个属性都返回泛型接口的相应构造。\n\n* * *\n\n### 指南\n\n**避免**在一种类型中实现同一个泛型接口的多个构造。\n\
  \n* * *\n\n### 定义构造函数和终结器\n\n可能令人惊讶的是，泛型类或结构体的构造函数（以及终结器）并不需要类型参数；换句话说，它们不需要 `Pair<T>(){...}`。在列表\
  \ 11.11 中的对示例中，构造函数使用 `public Pair(T first, T second)` 声明。\n\n**列表 11.11：声明泛型类型的构造函数**\n\
  \n点击此此处查看代码图片\n\n* * *\n\n```csharp\npublic struct Pair<T>: IPair<T>\n{\n    public\
  \ Pair(T first, T second)\n    {\n        First = first;\n        Second = second;\n\
  \    }\n    public T First { get; set; }\n    public T Second { get; set; }\n}\n\
  ```\n\n* * *\n\n### 指定默认值\n\n列表 11.1 包含一个接收 `First` 和 `Second` 初始值的构造函数，并将它们赋值给\
  \ `_First` 和 `_Second`。由于 `Pair<T>` 是一个结构体，你提供的任何构造函数都必须初始化所有字段。然而，这产生了一个问题。考虑一个\
  \ `Pair<T>` 的构造函数，在实例化时只初始化对的半部分。\n\n如列表 11.12 所示，定义这样的构造函数会导致编译时错误，因为字段 `_Second`\
  \ 在构造函数结束时仍未初始化。为 `_Second` 提供初始化会带来一个问题，因为你不知道 `T` 的数据类型。如果它是引用类型，`null` 是有效的，但如果\
  \ `T` 是不可可空值类型，这种方法将不起行。\n\n**列表 11.12：未初始化所有字段，导致编译时错误**\n\n点击此此处查看代码图片\n\n* *\
  \ *\n\n```csharp\npublic struct Pair<T>: IPair<T>\n{\n    // 错误：字段 'Pair<T>._second'\
  \ 必须在控制权离开构造函数之前完全赋值\n    // public Pair(T first)\n    // {\n    //     First =\
  \ first;\n    // }\n    // ...\n}\n```\n\n* * *\n\n为了处理这种场景，C# 提供了 `default` 运算符，该运算符在第\
  \ 8 章中首次讨论。在第 8 章中，我们展示了如何使用 `default(int)` 指定 `int` 的默认值。对于 `_Second` 所要求的 `T`\
  \ 情况，你可以如列表 11.13 所示使用 `default(T)`。\n\n**列表 11.13：使用 default 运算符初始化字段**\n\n* *\
  \ *\n\n```csharp\npublic struct Pair<T>: IPair<T>\n{\n    public Pair(T first)\n\
  \    {\n        First = first;\n        Second = default(T);\n    }\n    // ...\n\
  }\n```\n\n* * *\n\n`default` 运算符可以为任何类型提供默认值。\n\n### 多类型参数\n\n泛型类型可以声明任意数量的类型参数。`Pair<T>`\
  \ 示例包含一个类型参数。为了支持二元对（例如键/值对），你可以创建一个声明两个参数的类型，如列表 11.14 所示。\n\n**列表 11.14：带有多个参数的泛型**\n\
  \n点击此此处查看代码图片\n\n* * *\n\n```csharp\ninterface IPair<TFirst, TSecond>\n{\n    TFirst\
  \ First { get; set; }\n    TSecond Second { get; set; }\n}\n\npublic struct Pair<TFirst,\
  \ TSecond>: IPair<TFirst, TSecond>\n{\n    public Pair(TFirst first, TSecond second)\n\
  \    {\n        First = first;\n        Second = second;\n    }\n    public TFirst\
  \ First { get; set; }\n    public TSecond Second { get; set; }\n}\n```\n\n* * *\n\
  \n当你使用 `Pair<TFirst, TSecond>` 类时，在声明的括号内提供多个类型。列表 11.15 阐述了这种方法。\n\n**列表 11.15：使用多个参数的类型**\n\
  \n点击此此处查看代码图片\n\n* * *\n\n```csharp\nPair<int, string> historicalEvent = new Pair<int,\
  \ string>(1914, \"Shackleton leaves for South Pole\");\nConsole.WriteLine(\"{0}:\
  \ {1}\", historicalEvent.First, historicalEvent.Second);\n```\n\n* * *\n\n类型参数的数量——即元（arity）将该类与其他类区分开来。因此，可以在同一个命名空间内定义\
  \ `Pair<T>` 和 `Pair<TFirst, TSecond>`。此外，由于它们语义密切，仅元不同的泛型应该放在同一个 C# 文件中。\n\n* *\
  \ *\n\n### 指南\n\n将仅参数数量不同的泛型类放在同一个文件中。\n\n* * *\n\n### C# 4.0\n\n#### 丰富的元（Arity）\n\
  \n在 C# 4.0 中，CLR 团队定义了九种新的泛型类型，统称为 `Tuple`。与 `Pair<...>` 一样，由于元的变化（每个类具有不同数量的类型参数），可以使用相同的名称，如列表\
  \ 11.16 所示。\n\n**列表 11.16：利用元重载类型定义**\n\n点击此此处查看代码图片\n\n* * *\n\n```csharp\npublic\
  \ class Tuple { ... }\npublic class Tuple<T1>:\n    IStructuralEquatable, IStructuralComparable,\
  \ IComparable {...}\npublic class Tuple<T1, T2>: ... {...}\npublic class Tuple<T1,\
  \ T2, T3>: ... {...}\npublic class Tuple<T1, T2, T3, T4>: ... {...}\npublic class\
  \ Tuple<T1, T2, T3, T4, T5>: ... {...}\npublic class Tuple<T1, T2, T3, T4, T5, T6>:\
  \ ... {...}\npublic class Tuple<T1, T2, T3, T4, T5, T6, T7>: ... {...}\n```\n\n\n\
  \n\n\n```java\npublic class Tuple<T1, T2, T3, T4, T5, T6, T7, TRest>: ... {...}\n\
  ```\n\n`Tuple<...>` 类集的设计目的与 `Pair<T>` 和 `Pair<TFirst, TSecond>` 类相同，不同之处在于它们可以同时处理七个类型参数。事实上，使用列表\
  \ 11.16 中所示的最后一个 `Tuple`，`TRest` 可以用来存储另一个 `Tuple`，从而使元组的元素数量在实践上是无限制的。\n\n元组类族中另一个有趣的成员是非泛型的\
  \ `Tuple` 类。该类拥有八个静态“工厂”方法，用于用于实例化各种泛型元组类型。虽然每个泛型类型都可以直接使用其构造函数进行实例化，但 `Tuple` 类型的工厂方法允许对类型参数进行类型推断。列表\
  \ 11.17 展示了这种差异。\n\n**列表 11.17：使用 Tuple 的 Create() 工厂方法**\n\n点击此处查看代码图像\n\n```cs\n\
  Tuple<string, Contact> keyValuePair;\n\nkeyValuePair =\n  Tuple.Create(\"555-55-5555\"\
  , new Contact(\"Inigo Montoya\"));\n\nkeyValuePair =\n  new Tuple<string, Contact>(\"\
  555-55-5555\", new Contact(\"Inigo Montoya\"));\n```\n\n显然，当 `Tuple` 变得很大时，如果没有\
  \ `Create()` 工厂方法，指定类型参数的数量将非常繁琐。\n\n正如你可能从框架库声明了八种不同的泛型元组类型这一事实推出的出的，CLR 类型系统中不支持“变变”泛型类型。方法可以使用“参数数组”来接收任意数量的参数，但泛型类型没有相应的技术；每个泛型类型必须具有特定的元数（arity）。\n\
  \n`End 4.0`\n\n### 嵌套泛型类型\n\n包含泛型类型上的类型参数将自动“级联”到任何嵌套类型。例如，如果包含类型声明了类型参数 `T`，那么所有嵌套类型也将是泛型的，并且类型参数\
  \ `T` 也可以在嵌套类型上可用。如果嵌套类型包含了名为 `T` 的自己的类型参数，这将隐藏包含类型中的类型参数，嵌套类型中对 `T` 的任何引用将指向嵌套的\
  \ `T` 类型参数。幸运的是，在嵌套类型内重用相同的类型参数名称会导致编译器警告，以防止意外重叠（参见列表 11.18）。\n\n**列表 11.18：嵌套泛型类型**\n\
  \n点击此处查看代码图像\n\n```cs\nclass Container<T, U>\n{\n  // 嵌套类继承类型参数。\n  // 重用类型参数名称会导致\n\
  \  // 警告。\n  class Nested<U>\n  {\n      void Method(T param0, U param1)\n     \
  \ {\n      }\n  }\n}\n```\n\n包含类型的类型参数在嵌套类型中的访问方式，与包含类型的成员从嵌套类型中访问的方式相同。该规则仅仅是：类型参数在声明它的类型体内的任何地方都是可用的。\n\
  \n### 指南\n\n**避免**使用嵌套类型中同名的类型参数来隐藏（shadowing）外部类型的类型参数。\n\n### 约束\n\n泛型支持在类型参数上定义约束的能力。这些约束确保作为类型参数提供的类型符合各种规则。例如，考虑列表\
  \ 11.19 所示的 `BinaryTree<T>` 类。\n\n**列表 11.19：声明一个没有约束的 BinaryTree<T> 类**\n\n点击此处查看代码图像\n\
  \n```cs\npublic class BinaryTree<T>\n{\n    public BinaryTree (T item)\n    {\n\
  \      Item = item;\n    }\n    public T Item { get; set; }\n    public Pair<BinaryTree<T>>\
  \ SubItems { get; set; }\n}\n```\n\n（顺带提一下，`BinaryTree<T>` 在内部使用了 `Pair<T>`，这是可能的因为\
  \ `Pair<T>` 仅仅是另一种类型。）\n\n假设你希望树在 `Pair<T>` 的值被赋值给 `SubItems` 属性时对其值进行排序。为了实现排序，`SubItems`\
  \ 的设置访问器使用了提供的键的 `CompareTo()` 方法，如列表 11.20 所示。\n\n**列表 11.20：需要类型参数来支持接口**\n\n\
  点击此处查看代码图像\n\n```cs\nclass BinaryTree<T>\n{\n  public T Item { get; set; }\n  public\
  \ Pair<BinaryTree<T>> SubItems\n  {\n    get{ return _SubItems; }\n    set\n   \
  \ {\n      IComparable<T> first; // 错误：无法转换类型...\n      first = (IComparable<T>)value.First;\
  \ // 强制类型转换\n      if (first.CompareTo(value.Second) < 0)\n      {\n        // first\
  \ 小于 second。\n      }\n      else\n      {\n        // first 与 second 相等或 second\
  \ 小于 first。\n      }\n      _SubItems = value;\n    }\n  }\n  private Pair<BinaryTree<T>>\
  \ _SubItems;\n}\n```\n\n\n\n\n\n为了避免此类异常，并在类型参数未实现该接口时生成编译时错误，C# 允许你为泛型类型中声明的每个类型参数提供可选的\
  \ `constraints` 列表。约束声明了泛型类型对每个类型参数所提供的类型参数所需的特征。你使用 `where` 关键字声明约束，其后跟一个“参数-要求”对，其中参数必须是泛型类型中声明的参数之一，而要求描述了类型参数必须转换的类或接口、是否存在默认构造函数，或者对引用类型/值类型的限制。\n\
  \n## 接口约束\n\n为了确保二叉树的节点顺序正确，你可以使用 `BinaryTree` 类中的 `CompareTo()` 方法。为了最有效地实现这一点，你应该对类型参数\
  \ `T` 施加约束。也就是说，你需要让类型参数 `T` 实现 `IComparable<T>` 接口。声明此约束的语法出现在列表 11.22 中。\n\n**列表\
  \ 11.22: 声明接口约束**\n\n点击此处查看代码图像\n\n***\n\n```csharp\npublic class BinaryTree<T>\n\
  \    where T: System.IComparable<T>\n    {\n    public T Item { get; set; }\n  \
  \  public Pair<BinaryTree<T>> SubItems\n    {\n        get{ return _SubItems; }\n\
  \        set\n        {\n            IComparable<T> first;\n            // 注意，现在可以消除强制转换了。\n\
  \            first = value.First.Item;\n            if (first.CompareTo(value.Second.Item)\
  \ < 0)\n            {\n                // first 小于 second。\n                ...\n\
  \            }\n            else\n            {\n                // second 小于等于\
  \ first。\n                ...\n            }\n            _SubItems = value;\n \
  \       }\n    }\n    private Pair<BinaryTree<T>> _SubItems;\n}\n```\n\n***\n\n\
  在列表 11.22 中添加了接口约束后，编译器确保你每次使用 `BinaryTree<T>` 类时，指定的类型参数都实现了 `IComparable<T>` 接口的相应构造。此外，你不再需要在调用\
  \ `CompareTo()` 方法之前显式将变量强制转换为 `IComparable<T>` 接口。访问使用显式接口实现的成员时甚至不再需要强制转换，而在其他上下文中，如果不进行强制转换将隐藏该成员。在对类型为泛型类型参数的值上调用方法时，编译器会检查该方法是否匹配声明为约束的任何接口上的任何方法。\n\
  \n如果你尝试使用 `System.Text.StringBuilder` 作为类型参数创建 `BinaryTree<T>` 变量，你将收到编译错误，因为 `StringBuilder`\
  \ 没有实现 `IComparable<StringBuilder>`。该错误与输出 11.3 中所示所示。\n\n**输出 11.3**\n\n点击此处查看代码图像\n\
  \n```\nerror CS0311: 类型 'System.Text.StringBuilder' 不能作为类型参数\n'T' 用于泛型类型或方法 'BinaryTree<T>'。从\
  \ 'System.Text.StringBuilder' 到\n'System.IComparable<System.Text.StringBuilder>'\
  \ 之间没有隐式引用转换。\n```\n\n要为约束指定接口，你需要声明一个`接口类型约束`。这种约束甚至规避了为了调用显式接口成员实现而进行的强制转换。\n\n\
  ## 类类型约束\n\n有时你可能希望限制类型参数可以转换为特定的类类型。你使用`类类型约束`来实现，如列表 11.23 所示。\n\n**列表 11.23:\
  \ 声明类约束**\n\n点击此处查看代码图像\n\n***\n\n```csharp\npublic class EntityDictionary<TKey,\
  \ TValue>\n    where TValue : EntityBase\n{\n}\n```\n\n***\n\n在列表 11.23 中，`EntityDictionary<TKey,\
  \ TValue>` 要求类型参数 `TValue` 隐式转换为 `EntityBase`。类类型约束的语法与接口约束相同，但类类型约束必须出现在接口约束之前。然而，与接口约束不同，不允许多个基类约束。\n\
  \n某些“特殊”类型不能作为类类型约束。请参见本章节后续的高级主题“约束限制”。\n\n## struct/class 约束\n\n另一个有用的泛型约束是能够限制类型参数为非可空值类型或任何引用类型。相反，C#\
  \ 提供了同样适用于引用类型的特殊语法。与其指定 `T` 必须派生的类，你只需使用 `struct` 或 `class` 关键字，如列表 11.24 所示。\n\
  \n**列表 11.24: 将类型参数指定为值类型**\n\n点击此处查看代码图像\n\n***\n\n```csharp\npublic struct Nullable<T>\
  \ :\n    IFormattable, IComparable,\n    IComparable<Nullable<T>>, INullable\n \
  \   where T : struct\n{\n    // ...\n}\n```\n\n***\n\n注意，`class`约束——有点误解的是——并没有将类型参数限制为类类型；而是将其限制为引用类型。为带有\
  \ `class` 约束的类型参数提供的类型参数可以是任何类、接口、委托或数组类型。\n\n`struct` 约束有一个特殊特性：可空值类型不满足该约束。为什么？可空值类型被实现为泛型类型\
  \ `Nullable<T>`，而该类型本身对 T 应用了 `struct` 约束。如果可空值类型满足该约束，那么就可以定义毫无意义的类型 `Nullable<Nullable<int>>`。双重可空整数困惑到毫无意义的地步。（正如预期的，简写语法\
  \ `int??` 也不被允许。）\n\n\n\n\n\n对于任何给定的类型参数，你可以指定任意数量的接口类型约束，但不能超过一个类类型约束（就像一个类可以实现任意数量的接口，但只能自自另一个类）。每个新约束都可以在泛型类型参数和冒号之后，以逗号分隔的列表形式声明。如果有多个类型参数，每个类型参数之前都必须跟有\
  \ `where` 关键字。在列表 11.25 中，泛型类 `EntityDictionary` 声明了两个类型参数：`TKey` 和 `TValue`。`TKey`\
  \ 类型参数有两个接口类型约束，而 `TValue` 类型参数有一个类类型约束。\n\n### 列表 11.25：指定多个约束\n\n点击此处查看代码图像\n\n\
  ```csharp\npublic class EntityDictionary<TKey, TValue>\n    : Dictionary<TKey, TValue>\n\
  \    where TKey : IComparable<TKey>, IFormattable\n    where TValue : EntityBase\n\
  {\n  ...\n}\n```\n\n在这种情况下，`TKey` 本身有多个约束，而 `TValue` 有一个额外的约束。当为一个类型参数指定多个约束时，假设它们是“与”（AND）关系。如果提供类型\
  \ `C` 作为 `TKey` 的类型参数，例如 `C` 必须实现 `IComparable<C>` 和 `IFormattable`。\n\n注意每个 `where`\
  \ 子句之间没有逗号。\n\n#### 构造函数约束\n\n在某些情况下，在泛型类内部创建类型参数类型的实例是有必要的。例如，在列表 11.26 中，`EntityDictionary<TKey,\
  \ TValue>` 类的 `MakeValue()` 方法必须创建一个与类型参数 `TValue` 对应的类型参数的实例。\n\n### 列表 11.26：要求默认构造函数约束\n\
  \n点击此处查看代码图像\n\n```csharp\npublic class EntityBase<TKey>\n{\n    public TKey Key\
  \ { get; set; }\n}\n\npublic class EntityDictionary<TKey, TValue> :\n    Dictionary<TKey,\
  \ TValue>\n    where TKey: IComparable<TKey>, IFormattable\n    where TValue : EntityBase<TKey>,\
  \ new()               \n{\n    // ...\n    public TValue MakeValue(TKey key)\n \
  \   {\n        TValue newEntity = new TValue();\n        newEntity.Key = key;\n\
  \        Add(newEntity.Key, newEntity);\n        return newEntity;\n    }\n    //\
  \ ...\n}\n```\n\n由于并不是所有对象都保证具有公共默认构造函数，编译器不允许你对未约束的类型参数调用默认构造函数。为了覆盖此编译器限制，可以在指定所有其他约束之后添加文本\
  \ `new()`。这是一个构造函数约束，它要求受约束类型参数对应的类型参数必须具有公共默认构造函数。目前只有默认构造函数约束。你不能指定一个确保所提供的类型参数提供带形式参数的构造函数的约束。\n\
  \n#### 约束继承\n\n泛型类型参数及其约束都不会被派生类继承，因为泛型类型参数不是成员。（记住，类继承是派生类拥有基类所有成员的属性。）创建继承自其他泛型类型的新泛型类型是一种常见做法。在这种情况下，由于派生泛型类型的类型参数变成了泛型基类的类型参数，因此类型参数必须具有与基类上相等（或更强）的约束。困惑吗？考虑列表\
  \ 11.27。\n\n### 列表 11.27：显式指定继承的约束\n\n点击此处查看代码图像\n\n```csharp\nclass EntityBase<T>\
  \ where T : IComparable<T>\n{\n  // ...\n}\n```\n\n```csharp\n// 错误：\n// 类型 'U'\
  \ 必须转换为\n// 'System.IComparable<U>' 才能作为泛型类型或方法\n// 中的参数 'T'。\n// class Entity<U>\
  \ : EntityBase<U>\n// {\n//     ...\n// }\n```\n\n在列表 11.27 中，`EntityBase<T>` 要求\
  \ `T` 实现 `IComparable<T>`。如果 `Entity<U>` 继承自 `EntityBase<U>`，那么 `U` 必须实现 `IComparable<U>`。\n\
  \n### 列表 11.28：禁止重复继承的约束\n\n点击此处查看代码图像\n\n```csharp\nclass EntityBase\n{\n  public\
  \ virtual void Method<T>(T t)\n  where T : IComparable<T>\n  {\n  }\n}\n\nclass\
  \ Order : EntityBase\n{\n  public override void Method<T>(T t)\n  // 重写时可能不允许重复约束\n\
  \  {\n    // ...\n  }\n}\n```\n\n在泛型类的情况下，派生类上的类型参数不能通过添加更多约束来进一步约束。额外的约束可能会破坏多态性，因此它们是不允许的。\n\
  \n#### 高级主题：约束的局限性\n\n约束被适当地限制以避免产生无意义的代码。例如，你不能将类类型约束与 `struct` 约束结合。此外，你不能指定约束来将继承限制为特殊类型，如\
  \ `object`、数组、`System.ValueType`、`System.Enum` (`enum`)、`System.Delegate` 或 `System.MulticastDelegate`。\n\
  \n在某些情况下，约束限制可能是更理想的，但目前仍不支持。以下子节提供了一些不允许的约束的其他示例。\n\n##### 不允许使用运算符约束\n\n你不能将类型参数约束为实现了特定方法或运算符的类型，除非通过接口类型约束（针对方法）或类类型约束（针对方法和运算符）。由于此，列表\
  \ 11.29 中的泛型方法 `Add()` 无法工作。\n\n### 列表 11.29：约束表达式无法要求运算符\n\n点击此处查看代码图像\n\n```csharp\n\
  public abstract class MathEx<T>\n{\n    public static T Add(T first, T second)\n\
  \    {\n        // 错误：运算符 '+' 无法应用于\n        // 类型为 'T' 和 'T' 的操作数。\n        //\
  \ return first + second;\n    }\n}\n```\n\n\n\n\n\n更广泛地说，没有办法可以限制类型具有静态方法。\n\n###\
  \ 不支持或（OR）条件\n\n如果你为类型参数提供多个接口或类约束，编译器始终假设这些约束之间是“与”（AND）关系。例如，`where T : IComparable<T>,\
  \ IFormattable` 要求类型必须同时支持 `IComparable<T>` 和 `IFormattable`。没有方法可以指定约束之间的“或”（OR）关系。因此，不支持列表\
  \ 11.30 中的等效写法。\n\n**列表 11.30：不允许使用或 关系组合约束**\n\n点击此处查看代码图像\n\n```csharp\npublic\
  \ class BinaryTree<T>\n    // 错误：不支持 OR。\n    // where T: System.IComparable<T>\
  \ || System.IFormattable\n{\n    ...\n}\n```\n\n支持此功能将阻止编译器在编译时确定要调用哪种方法。\n\n###\
  \ 委托类型和枚举的约束无效\n\n委托类型、数组类型和枚举类型不能作为类类型约束，因为它们在本质上都是“密封”类型。（如果你不熟悉委托类型，请参见第 12 章）。它们的基类型——`System.Delegate`、`System.MultiCastDelegate`、`System.Array`\
  \ 和 `System.Enum` 也不能作为约束。例如，当编译器遇到列表 11.31 中的类声明时，会生成错误。\n\n**列表 11.31：继承约束不能为\
  \ System.Delegate 类型**\n\n点击此处查看代码图像\n\n```csharp\n// 错误：约束不能为特殊类 'System.Delegate'\n\
  public class Publisher<T>\n    where T : System.Delegate\n{\n    public event T\
  \ Event;\n    public void Publish()\n    {\n        if (Event != null)\n       \
  \ {\n            Event(this, new EventArgs());\n        }\n    }\n}\n```\n\n所有的委托类型都被视为不能指定为类型参数的特殊类。这样做将阻止对\
  \ `Event()` 调用进行编译时验证，因为使用 `System.Delegate` 和 `System.MulticastDelegate` 数据类型时，事件触发的签名是未知的。同样的限制也适用于任何枚举类型。\n\
  \n### 构造函数约束仅允许默认构造函数\n\n列表 11.26 包含一个构造函数约束，强制为 `TValue` 提供的类型参数必须提供公共无参构造函数。没有约束可以强制类型参数提供接受其他形式参数的构造函数。例如，你可能想约束\
  \ `TValue`，使得为其提供的类型参数必须提供一个接受为 `TKey` 提供的类型参数的构造函数，这是可能的。列表 11.32 演示了无效代码。\n\n\
  **列表 11.32：构造函数约束只能指定默认构造函数**\n\n点击此处查看代码图像\n\n```csharp\n    public TValue New(TKey\
  \ key)\n    {\n        // 错误：'TValue'：在创建变量类型的实例时 无法提供参数。\n        TValue newEntity\
  \ = null;\n        // newEntity = new TValue(key);\n        Add(newEntity.Key, newEntity);\n\
  \        return newEntity;\n    }\n```\n\n规避此限制的一种方法是提供一个包含实例化类型方法的工厂接口。实现该接口的工厂负责实例化实体，而不是由\
  \ `Dictionary` 本身（参见列表 1.33）。\n\n**列表 1.33：使用工厂接口代替构造函数约束**\n\n点击此处查看代码图像\n\n```csharp\n\
  public class EntityBase<Key>\n{\n    public EntityBase(Key key)\n    {\n       \
  \ Key = key;\n    }\n    public Key Key { get; set; }\n}\n\npublic class EntityDictionary<Key,\
  \ Value, Factory> : Dictionary<Key, Value>\nwhere Key : IComparable<Key>, IFormattable\n\
  where Value : EntityBase<Key>\nwhere Factory : IEntityFactory<Key, Value>, new()\n\
  {\n    ...\n    public Value New(Key key)\n    {\n        Factory factory = new\
  \ Factory();\n        Value newEntity = factory.CreateNew(key);\n        Add(newEntity.Key,\
  \ newEntity);\n        return newEntity;\n    }\n    ...\n}\n\npublic interface\
  \ IEntityFactory<Key, Value>\n{\n    Value CreateNew(Key key);\n}\n```\n\n### 泛型方法\n\
  \n之前你已经看到，当类型是泛型时，为类型添加方法是很容易的；例如你在目前为止看到的泛型示例中做过这一点。泛型方法使用类型参数，就像泛型类型一样。如果在类型中声明，你以与类型的方式指定类型参数：在方法名后紧跟类型参数，如列表\
  \ 11.35 中的 `MathEx.Max<T>` 和 `MathEx.Min<T>`。\n\n**列表 11.35：定义泛型方法**\n\n点击此处查看代码图像\n\
  \n```csharp\npublic static MathEx\n{\n    public static T Max<T>(T first, params\
  \ T[] values)\n    where T : IComparable<T>\n    {\n        T maximum = first;\n\
  \        foreach (T item in values)\n        {\n            if (item.CompareTo(maximum)\
  \ > 0)\n            {\n                maximum = item;\n            }\n        }\n\
  \        return maximum;\n    }\n\n    public static T Min<T>(T first, params T[]\
  \ values)\n    where T : IComparable<T>\n    {\n        T minimum = first;\n   \
  \     foreach (T item in values)\n        {\n            if (item.CompareTo(minimum)\
  \ < 0)\n            {\n                minimum = item;\n            }\n        }\n\
  \        return minimum;\n    }\n}\n```\n\n在这个示例中，方法是静态的，尽管 C# 并不要求这样做。\n\n\n\n\n\
  \n泛型方法与泛型类型一样，可以包含多个类型参数。元数（arity，即类型参数的数量）是方法签名的另一个额外区分特征。也就是说，只要方法类型参数的元数不同，拥有两个名称和形式参数类型完全相同的方法是合法的。\n\
  \n#### 泛型方法类型推断\n\n就像在使用泛型类型时在类型名称之后提供类型参数一样，方法类型参数也位于方法类型名称之后提供。调用 `Min<T>` 和 `Max<T>`\
  \ 方法时使用的的代码如列表 11.36 所示。\n\n**列表 11.36：显式指定类型参数**\n\n点击此处查看代码图像\n\n```\nConsole.WriteLine(\n\
  \    MathEx.Max<int>(7, 490));\n\nConsole.WriteLine(\n    MathEx.Min<string>(\"\
  R.O.U.S.\", \"Fireswamp\"));\n```\n\n列表 11.36 的输出出现在输出 11.4 中。\n\n**输出 11.4**\n\n\
  490\n\nFireswamp\n\n并不意外，类型参数 `int` 和 `string` 泛型方法调用中使用的实际类型。然而，指定类型参数是冗余的，因为编译器可以从传递给方法的形式参数推断类型参数。显然，列表\
  \ 11.36 中`Max`的调用者想要类型参数为 `int`，因为两个方法的类型都是 `int`。为了避免冗余，在编译器能够逻辑推断出你意图类型参数的所有情况下，你可以在调用中排除类型参数。这种被称为`方法类型推断`的实践示例出现在列表\
  \ 11.37 中。输出出现在输出 11.5 中。\n\n**列表 11.37：从参数推断类型参数**\n\n点击此处查看代码图像\n\n```\nConsole.WriteLine(\n\
  \    MathEx.Max(7, 490)); // 无类型参数！\n\nConsole.WriteLine(\n    MathEx.Min(\"R.O.U.S'\"\
  , \"Fireswamp\"));\n```\n\n**输出 11.5**\n\n490\n\nFireswamp\n\n为了使方法类型推断成功，参数的类型必须与泛型方法的形式参数“匹配”，以便能够推断出所需的类型参数。一个值得考虑的问题是当产生矛盾的推断时会发生什么。例如，当你使用\
  \ `MathEx.Max(7.0, 490)` 调用 `Max<T>` 方法时，编译器可以从第一个参数推导出类型参数应该是 `double`，从第二个参数推断出类型参数是\
  \ `int`，这是一个矛盾。在 C# 2.0 中，这将产生错误。更高级的分析会注意到这种矛盾是可以解决的，因为每个 `int` 都可以转换为 `double`，所以\
  \ `double` 是类型参数的最佳选择。C# 3.0 和 C# 4.0 均对方法类型推断算法进行了改进，允许编译器进行这些更高级的分析。\n\n在方法类型推断仍然不够复杂以推导出类型参数的情况下，你可以通过两种方式之一解决错误：在参数上插入强制转换以向编译器明确推断中应该使用的参数类型，或者放弃类型推断并显式包含类型参数。\n\
  \n请注意，方法类型推断算法在进行推断时，仅考虑参数、参数类型以及泛型方法的形式参数类型。在实践中可能用于分析的其他因素——例如泛型方法的返回类型、方法返回值被赋值的变量类型，或方法泛型类型参数的约束——完全没有被方法类型推断算法考虑。\n\
  \n#### 指定约束\n\n泛型方法的类型参数的约束方式与泛型类型的类型参数约束方式完全相同。例如，你可以限制方法的类型参数以实现某个接口或可转换为类类型。约束指定在参数列表和方法体之间，如列表\
  \ 11.38 所示。\n\n```cs\npublic class ConsoleTreeControl\n{\n    // 泛型方法 Show<T>\n\
  \    public static void Show<T>(BinaryTree<T> tree, int indent)\n        where T\
  \ : IComparable<T>\n}\n```\n*(注：提供的原始文本在代码块部分包含大量的伪影/编码错误，已根据描述的上下文清理以反映标准的 C# 语法)。*\n\
  \n\n\n\n\n泛型初学者经常，经常被问的一个问题是：为什么 `List<string>` 类型的表达式不能赋值给 `List<object>` 类型的变量——如果\
  \ `string` 可以转换为 `object` 类型，那么字符串列表理应也与对象列表同样兼容。但从泛指来说，这既不是类型安全的，也不是合法的。如果你使用同一个泛型类声明了两个具有不同类型参数的变量，即使是从更具体的类型赋值给更通用的类型，这些变量之间也不是类型兼容的——换句话说，它们不是`协变的`（covariant）。\n\
  \n`Covariant`（协变）是范畴论中的一个术语，但其核心思想非常直观：假设两个类型 `X` 和 `Y` 具有某种特殊关系——即类型 `X` 的每一个值都可以转换为类型\
  \ `Y`。如果类型 `I<X>` 和 `I<Y>` 总是也具有这种特殊关系，我们就说“`I<T>` 在 `T` 上是协变的”。在处理仅有一个类型参数的简单泛型时，可以很容易理解这个类型参数，我们简单地说“`I<T>`\
  \ 是协变的”。从 `I<X>` 到 `I<Y>` 的转换被称为`协变转换`。\n\n例如，泛型类 `Pair<Contact>` 和 `Pair<PdaItem>`\
  \ 的实例即使类型参数本身是兼容的，它们也不是类型兼容的。换句话说，编译器阻止了从 `Pair<Contact>` 到 `Pair<PdaItem>` 的转换（隐式或显式），尽管\
  \ `Contact` 自 `PdaItem`。同样，将 `Pair<Contact>` 转换为接口类型 `IPair<PdaItem>` 也会失败。请参见列表\
  \ 11.40 示例。\n\n**列表 11.40：不同类型参数的泛型之间的转换**\n\n点击此处查看代码图片\n\n* * *\n\n```\n// ...\n\
  \n// Error: Cannot convert type ...\n\nPair<PdaItem> pair = (Pair<PdaItem>) new\
  \ Pair<Contact>();\n\nIPair<PdaItem> duple = (IPair<PdaItem>) new Pair<Contact>();\n\
  ```\n\n* * *\n\n但为什么这是不法的呢？为什么 `List<T>` 和 `Pair<T>` 不是协变的？列表 11.41 显示了如果 C# 语言允许无限制的泛型协变会发生什么。\n\
  \n**列表 11.41：防止协变维持同质性**\n\n点击此处查看代码图片\n\n* * *\n\n```\n//...\n\nContact contact1\
  \ = new Contact(\"Princess Buttercup\"),\n\nContact contact2 = new Contact(\"Inigo\
  \ Montoya\");\n\nPair<Contact> contacts = new Pair<Contact>(contact1, contact2);\n\
  \n// 这将产生错误：Cannot convert type ...                     \n\n// 但假设它可以。         \
  \                     \n\n// IPair<PdaItem> pdaPair = (IPair<PdaItem>) contacts;\
  \                  \n\n// 这是完全合法的，但不是类型安全的。\n\n// pdaPair.First = new Address(\"\
  123 Sesame Street\");                    \n\n...\n```\n\n* * *\n\n`IPair<PdaItem>`\
  \ 可以包含一个地址，但该对象实际上是一个 `Pair<Contact>`，它只能包含联系人，而不能包含地址。如果允许无限制的泛型协变，类型安全性将完全被破坏。\n\
  \n现在也应该清楚为什么字符串列表不能用作对象列表使用。你不能将整数插入到字符串列表中，但你可以将整数插入到对象列表中；因此，将字符串列表强制转换为对象列表必须是非合法的，这是一个编译器可以强制执行的错误。\n\
  \n`Begin 4.0`\n\n#### 在 C# 4.0 中使用 out 类型参数修饰符启用协变\n\n你可能已经注意到，前面描述的两个作为无限制协变后果的问题，其产生都是因为泛型对和泛型列表允许对其内容进行写入。假设我们通过使一个只读的\
  \ `IReadOnlyPair<T>` 接口来消除这种可能性，该接口仅将 `T` 暴露为从接口“输出”（即作为方法的返回类型或只读属性的类型），而永远不“进入”接口（即不作为形式参数或可写属性类型）。如果我们对\
  \ `T` 限制在一个“仅输出”的接口上，那么上述描述的协变问题就不会发生（参见列表 11.42）。\n\n**列表 11.42：潜在可能的协变**\n\n点击此处查看代码图片\n\
  \n* * *\n\n```\ninterface IReadOnlyPair<T>\n{\n  T First { get; }\n  T Second {\
  \ get; }\n}\n```\n\n* * *\n\n```\ninterface IPair<T>\n{\n  T First { get; set; }\n\
  \  T Second { get; set; }\n}\n```\n\n* * *\n\n```\npublic struct Pair<T> : IPair<T>,\
  \ IReadOnlyPair<T>\n{\n  // ...\n}\n\nclass Program\n{\n  static void Main()\n \
  \ {\n      // Error: Only 在没有 out\n      // 类型参数修饰符的情况下理论上是可能的\n      Pair<Contact>\
  \ contacts =                                           \n             new Pair<Contact>(\
  \                                 \n             new Contact(\"Princess Buttercupt\"\
  ),                           \n             new Contact(\"Inigo Montoya\") );\n\n\
  \      IReadOnlyPair<PdaItem> pair = contacts;                          \n\n   \
  \   IReadOnlyPair<Contact> pdaItem1 = pair.First;                      \n\n    \
  \  IReadOnlyPair<Contact> pdaItem2 = pair.Second;                     \n  }\n}\n\
  ```\n\n* * *\n\n`IPair<PdaItem>` 可以包含一个地址，但该对象实际上是一个 `Pair<Contact>`，它只能包含联系人，而不能包含地址。如果允许无限制的泛型协变，类型安全性将完全被破坏。\n\
  \n现在也应该清楚为什么字符串列表不能用作对象列表使用。你不能将整数插入到字符串列表中，但你可以将整数插入到对象列表中；因此，将字符串列表强制转换为对象列表必须是非合法的，这是一个编译器可以强制执行的错误。\n\
  \n`Begin 4.0`\n\n#### 在 C# 4.0 中使用 out 类型参数修饰符启用协变\n\n你可能已经注意到，前面描述的两个作为无限制协变后果的问题，其产生都是因为泛型对和泛型列表允许对其内容进行写入。假设我们通过使一个只读的\
  \ `IReadOnlyPair<T>` 接口来消除这种可能性，该接口仅将 `T` 暴露为从接口“输出”（即作为方法的返回类型或只读属性的类型），而永远不“进入”接口（即不作为形式参数或可写属性类型）。如果我们对\
  \ `T` 限制在一个“仅输出”的接口上，那么上述描述的协变问题就不会发生（参见列表 11.42）。\n\n对 `IReadOnlyPair<T>` 接口上的类型参数使用\
  \ `out` 修饰符将导致编译器验证 `T` 确实仅用于“输出”（方法返回类型和只读属性返回类型），而不用于形式参数或属性设置器。从那时起，编译器将允许涉及该接口的任何协变转换。对列表\
  \ 11.42 中的代码进行此修改后，它将成功编译并执行。\n\n协变转换施加了许多重要的限制：\n\n- 只有泛型接口和泛型委托（在第 12 章中描述）可以是协变的。类和结构体永远不是协变的。\n\
  \n- “源”和“目标”泛型类型的可变类型参数必须是引用类型，而不是值类型。例如，`IReadOnlyPair<string>` 可以协变地转换为 `IReadOnlyPair<object>`，因为\
  \ `string` 和 `IReadOnlyPair<object>` 都是引用类型。`IReadOnlyPair<int>` 不能转换为 `IReadOnlyPair<object>`，因为\
  \ `int` 不是引用类型。\n\n- 接口或委托必须声明为支持协变，并且编译器能够验证已标记的类型参数实际上仅用在“输出”位置。\n\n\n\n\n“反向”的协变性称为`逆变`（contravariance）。再次假设两个类型\
  \ `X` 和 `Y` 存在关系，使得类型 `X` 的每个值都可以转换为类型 `Y`。如果类型 `I<X>` 和 `I<Y>` 始终具有这种相同的“反向”特殊关系——即类型\
  \ `I<Y>` 的每个值都可以转换为类型 `I<X>`——我们就说“`I<T>` 在 `T` 上是逆变的”。\n\n大多数人发现，逆变比协变难理解得多。逆变的经典例子是比较器（comparer）。假设你有一个派生类型\
  \ `Apple`（苹果）和一个基类型 `Fruit`（水果）。显然，它们之间具有这种特殊关系：类型 `Apple` 的每个值都可以转换为 `Fruit`。\n\
  \n现在，假设你有一个接口 `ICompareThings<T>`，它有一个方法 `bool FirstIsBetter(T t1, T t2)`，该方法接收两个\
  \ `T` 并返回一个 `bool`，表示第一个是否比第二个好。\n\n当我们提供类型参数时会发生什么？`ICompareThings<Apple>` 拥有一个接收两个\
  \ `Apple` 并比较它们的方法。`ICompareThings<Fruit>` 拥有一个接收两个 `Fruit` 并比较它们的方法。但由于每个 `Apple`\
  \ 都是 `Fruit`，显然类型 `ICompareThings<Fruit>` 的值可以安全地用于任何需要 `ICompareThings<Apple>`\
  \ 的地方。转换的“方向”被“反转”了；因此称为“逆变”（contra-variance）。\n\n意不意料的是，协变接口限制的对立面对于确保安全的逆变是必要的。一个在一个类型参数上是逆变的接口必须将该类型参数仅用于“输入”位置，例如形式参数（或只写属性的类型，这种属性极罕见）。你可以通过使用\
  \ `in` 修饰符声明类型参数来将接口标记为逆变，如列表 11.44 所示。\n\n**列表 11.44：使用 in 类型参数修饰符逆变**\n\n点击此此处查看代码图像\n\
  \n* * *\n\n```cs\nclass Fruit {}\n\nclass Apple : Fruit {}\n\nclass Orange : Fruit\
  \ {}\n```\n\n* * *\n\n```cs\ninterface ICompareThings<in T>\n{\n  bool FirstIsBetter(T\
  \ t1, T t2);\n}\n```\n\n* * *\n\n```cs\nclass Program\n{\n  class FruitComparer\
  \ : ICompareThings<Fruit>\n  { ... }\n  static void Main()\n  {\n    // 在 C# 4.0\
  \ 中允许\n    ICompareThings<Fruit> fc = new FruitComparer();\n    Apple apple1 = new\
  \ Apple();\n    Apple apple2 = new Apple();\n    Orange orange = new Orange();\n\
  \    // 水果比较器可以比较苹果和橙子：\n    bool b1 = fc.FirstIsBetter(apple1, orange);\n    //\
  \ 或者比较苹果和苹果：\n    bool b2 = fc.FirstIsBetter(apple1, apple2);\n    // 这是合法的，因为接口是\n\
  \    // 逆变的。\n    ICompareThings<Apple> ac = fc;\n    // 这实际上是一个水果比较器，所以它\n    //\
  \ 仍然可以比较苹果。\n    bool b3 = ac.FirstIsBetter(apple1, apple2);\n  }\n}\n```\n\n* *\
  \ *\n\n类似于协变支持，逆变使用了一个类型参数修饰符：`in`，它出现在接口的类型声明中。这指示编译器检查 `T` 永远不会出现在属性的读取器或作为方法的返回类型，从而为该接口启用逆变转换。\n\
  \n逆变转换具有与之前描述的协变转换所有类似的限制：它们仅对泛型接口和委托类型有效，变化的参数必须是引用类型，并且编译器必须能够验证该接口是安全的。\n\n一个接口可以在一个类型参数上是协变的，而在另一个类型参数上是逆变的，但在实践中这种情况很少发生，除了委托。例如，`Func<A1,\
  \ A2, ..., R>` 委托族在返回类型 `R` 上是协变的，在所有参数类型上都是逆变的。\n\n最后，注意编译器会在整个源代码中检查协变和逆变类型修饰符的有效性。考虑列表\
  \ 11.45 中的 `IPairInitializer<in T>` 接口。\n\n**列表 11.45：变性编译器**\n\n点击此此处查看代码图像\n\n\
  * * *\n\n```cs\n// 错误：无效的变性；类型参数 'T' 不是\n// 协变有效的\ninterface IPairInitializer<in\
  \ T>\n{\n  void Initialize(IPair<T> pair);\n}\n```\n\n* * *\n\n```cs\n// 假设上面的代码是合法的，看看发生了\n\
  // 什么问题：\nclass FruitPairInitializer : IPairInitializer<Fruit>\n{\n  // 让我们用一个苹果和一个橙子\n\
  \  // 初始化我们的水果对：\n  public void Initialize(IPair<Fruit> pair)\n  {\n    pair.First\
  \ = new Orange();\n    pair.Second = new Apple();\n  }\n}\n```\n\n* * *\n\n```cs\n\
  // ... 之后 ...\nvar f = new FruitPairInitializer();\n// 如果逆变是合法的，这就是合法的：\nIPairInitializer<Apple>\
  \ a = f;\n// 现在我们向苹果对中写入一个橙子：\na.Initialize(new Pair<Apple>());\n```\n\n* * *\n\n\
  普通观察者可能会认为，由于 `IPair<T>` 仅作为“输入”形式参数使用，`IPairInitializer` 上的 `in` 修饰符是有效的。然而，`IPair<T>`\
  \ 接口无法安全变变，因此不能用可变类型来构造。正如你所见，这将是不安全的，反之编译器从根本上不允许 `IPairInitializer` 被声明为逆变。\n\n\
  #### 数组的不安全协变支持\n\n到为止，我们把协变和逆变描述为泛型类型的属性。在所有非泛型类型中，数组最像泛型；也就是说，就像我们认为泛型“T 的列表”或泛型“T\
  \ 的对”一样，我们可以把“T 的数组”看作同样的模式。由于数组显然支持读取和写入，根据你对协变和逆变的了解，你可能会认为数组既不是安全的逆变的，也不是安全的协变的。也就是说，你可能认为数组只有在不被写入时才是安全的协变的，只有在不被读取时才是安全的逆变的——尽管这些限制都不现实。\n\
  \n遗憾的是，C# 直接支持数组协变，尽管这样做是不安全的。例如，`Fruit[] fruits = new Apple[10];` 在 C# 中是完全合法的。如果你接着包含表达式\
  \ `fruits[0] = new Orange();`，运行时将以异常的形式发出类型安全违规。不能总是将 `Orange` 赋值给 `Fruit` 数组是非常令人不安的，但这不仅适用于\
  \ C#，也适用于所有使用运行时实现的数组语言。\n\n尽量避免使用不安全的数组协变。每个数组都可以转换为只读（因此是安全的协变的）接口 `IEnumerable<T>`；也就是说，`IEnumerable<Fruit>\
  \ fruits = new Apple[10]` 是既安全又合法的，因为如果你只有只读接口，就无法在数组中插入 `Orange`。\n\n\n\n\n鉴于前面的章节中对对象在\
  \ CLI 类型系统中泛用性的讨论，得知泛型也是对象这并不令人意外。事实上，泛型类上的类型参数变成了元数据，运行时在需要时使用这些元数据来构建相应的类。因此，泛型支持继承、多态和封装。通过泛型，你可以定义方法、属性、字段、类、接口和委托。\n\
  \n为了实现这一点，泛型需要底层运行时的支持。反之，将泛型引入 C# 语言既是编译器的特性也是平台的特性。例如，为了避免装箱（boxing），基于值的类型参数的泛型实现与带有引用类型参数的泛型实现是不同的。\n\
  \n* * *\n\n## 高级主题：泛型的 CIL 表示\n\n当一个泛型类被编译时，它与非泛型类没有显著区别。编译的结果仅仅是元数据和 CIL。CIL 经过参数化，以接受代码某处用户提供的类型。例如，假设你有一个如列表\
  \ 11.46 所示声明的简单 `Stack<T>` 类。\n\n**列表 11.46：Stack<T> 声明**\n\n点击此处查看代码图片\n\n* * *\n\
  \n```sharp\npublic class Stack<T> where T : IComparable\n{\n    T[] items;\n   \
  \ // 类的其余部分\n}\n```\n\n* * *\n\n当你编译该类时，生成的 CIL 是参数化的，看起来类似于列表 11.47。\n\n**列表 11.47：Stack<T>\
  \ 的 CIL 代码**\n\n点击此处查看代码图片\n\n* * *\n\n```il\n.class private auto ansi beforefieldinit\n\
  \    Stack'1<([mscorlib]System.IComparable)T>\n    extends [mscorlib]System.Object\n\
  {\n  ...\n}\n```\n\n* * *\n\n第一个值得注意的项是第二行中出现在 `Stack` 之后的 `'1`。这个数字是“元数”（arity）。它声明了泛型类为类型参数所需的类型参数数量。像\
  \ `EntityDictionary<TKey, TValue>` 这样的声明其元数就是 2。\n\n生成的 CIL 第二行显示了施加在类上的约束。`T` 类型参数被装饰了一个带有\
  \ `IComparable` 约束的接口声明。\n\n如果你继续查看 CIL，你会发现该项类型为 `T` 的数组声明被修改为包含一个使用“感叹号表示法”（exclamation\
  \ point notation）的类型参数，这是支持泛型的 CIL 版本中的特性。感叹号表示为该类指定的指定的第一个类型参数的存在，如列表 11.48 所示。\n\
  \n**列表 11.48：支持泛型的“感叹号表示法”CIL**\n\n点击此处查看代码图片\n\n* * *\n\n```il\n.class public auto\
  \ ansi beforefieldinit\n    'Stack'1'<([mscorlib]System.IComparable) T>\n    extends\
  \ [mscorlib]System.Object\n{\n    .field private !0[ ] items\n    ...\n}\n```\n\n\
  * * *\n\n除了类头中包含元数和类型参数，以及代码中使用感叹号表示的类型参数外，泛型类生成的 CIL 与非泛型类生成的 CIL 之间几乎没有区别。\n\n\
  * * *\n\n## 高级主题：基于值类型的泛型实例化\n\n当泛型类型首次使用值类型作为类型参数构造时，运行时会创建一个专门的泛型类型，并将提供的类型参数相应地放置在\
  \ CIL 中。因此，运行时会为每个新的参数值类型创建新的专门化泛型类型。\n\n例如，假设某些代码声明了一个由整数组成的 `Stack<int>`，如列表 11.49\
  \ 所示。\n\n**列表 11.49：Stack<int> 定义**\n\n* * *\n\n```sharp\nStack<int> stack;\n```\n\
  \n* * *\n\n当第一次使用这种类型 `Stack<int>` 时，运行时会生成 `Stack` 类的专门版本，用类型参数 `int` 替换其类型参数。从那时起，每当代码使用\
  \ `Stack<int>` 时，运行时都会复用已生成的专门化 `Stack<int>` 类。在列表 11.50 中，你声明了两个 `Stack<int>` 实例，它们都使用运行时已经为\
  \ `Stack<int>` 生成的代码。\n\n**列表 11.50：声明类型为 Stack<T> 的变量**\n\n点击此处查看代码图片\n\n* * *\n\
  \n```sharp\nStack<int> stackOne = new Stack<int>();\nStack<int> stackTwo = new Stack<int>();\n\
  ```\n\n* * *\n\n如果稍后创建了另一个具有不同值类型的 `Stack`（例如 `long`），运行时将生成另一个版本。专门化类型类的优点是性能更好，因为代码“原生”地规避了转换和装箱。\n\
  \n* * *\n\n## 高级主题：基于引用类型的泛型实例化\n\n泛型处理引用类型时的工作略有不同。当泛型类型首次使用引用类型构造时，运行时会创建一个用 `object`\
  \ 引用替换类型参数的专门泛型类型，而不是基于该类型的专门版本。\n\n例如，假设你有两个引用类型：`Customer` 类和 `Order` 类。接下来，你创建一个\
  \ `Customer` 类型的 `EntityDictionary`：\n\n点击此处查看代码图片\n\n```sharp\nEntityDictionary<Guid,\
  \ Customer> customers;\n```\n\n在访问此类之前，运行时会生成 `EntityDictionary` 的专门版本，该版本不再存储 `Customer`，而是存储\
  \ `object` 引用。假设下一行代码创建一个 `Order` 类型的 `EntityDictionary`：\n\n点击此处查看代码图片\n\n```sharp\n\
  EntityDictionary<Guid, Order> orders = new EntityDictionary<Guid, Order>();\n```\n\
  \n与值类型不同，不会为使用 `Order` 类型的 `EntityDictionary` 创建新的专门化类。相反，会实例化使用 `object` 引用的 `EntityDictionary`\
  \ 版本，并将 `orders` 变量指向它。\n\n为了仍然获得类型安全的优势，对于替换类型参数的每个对象引用，都会为 `Order` 类型专门分配内存区域，并将指针设置为该内存引用。\n\
  \n假设你随后遇到如下代码来实例化一个 `Customer` 类型的 `EntityDictionary`：\n\n点击此处查看代码图片\n\n```sharp\n\
  customers = new EntityDictionary<Guid, Customer>();\n```\n\n与之前使用 `Order` 类型创建的\
  \ `EntityDictionary` 类一样，会实例化另一个专门的 `EntityDictionary` 实例（基于 `object` 引用的版本），并将其包含的指针设置为专门指向\
  \ `Customer` 类型。这种泛型实现通过将编译器为引用类型泛型类生成的专门类数量减少到一，极大地减少了代码膨胀。\n\n* * *\n\n## 语言对比：Java—泛型\n\
  \n\n\n\nJava 中泛型的实现完全是在编译器中完成的，而不是在 Java 虚拟机中。Sun  公司采用这种方法是为了确保不会因为使用了泛型而需要分发更新后的\
  \ Java 虚拟机。\n\nJava 的实现使用了与 C++ 模板（templates）和 C# 泛型类似的语法，包括类型参数和约束。然而，由于它没有对值类型和引用类型进行区别对待，未经修改的\
  \ Java 虚拟机不支持值类型的泛型。因此，Java 泛型在执行效率上的提升并不像 C# 那样显著。事实上，每当 Java 编译器需要返回数据时，它会从指定的约束（如果已声明）或基础\
  \ `Object` 类型（如果未声明）注入自动向下转换。此外，Java 编译器在编译时生成一个单一的专用类型，然后使用它来实例化任何构造的类型。最后，由于 Java\
  \ 虚拟机原生不支持泛型，在执行运行时无法确定泛型实例的类型参数，且反射的其他用法也受到严重限制。\n\n***\n\n### 总结\n\nC# 2.0 引入了泛型类型和方法，这从根本上改变了\
  \ C# 开发者的编码风格。在程序员在 C# 1.0 代码中使用 `object` 的几乎所有情况下，泛型都是 C# 2.0 中更好的选择。在现代 C# 程序中，使用\
  \ `object`（特别是在任何集合类型的背景下）应该考虑使用泛型解决问题是否会更好。消除类型转换带来的类型安全性提升、消除装箱（boxing）性能开销以及减少重复代码，都是重大的改进。\n\
  \n第 16 章 查看了最常用的泛型命名空间之一 `System.Collections.Generic`。正如其名，该命名空间几乎由泛型类型组成。它提供了清晰的示例，说明了最初使用对象的某些类型是如何转换为使用泛型的。然而，在处理这些主题之前，我们将研究表达式（expressions），它为\
  \ C# 3.0（及更高版本）处理集合提供了重大的改进。\n\n` 2.00\n\n## 12. 委托和 Lambda 表达式\n\n之前的章节详细讨论了如何创建类来封装数据以及数据的操作。随着你创建越来越多的类，你将看到它们之间关系中的常见模式。一种常见模式是将对象传递给方法，仅仅是为了让该方法反过来调用该对象上的方法。例如，如果你向一个方法传递一个\
  \ `IComparer<int>` 的引用，那么被调用的方法很可能会自己调用你提供的对象上的 `Compare()` 方法。在这种情况下，接口仅仅是传递一个可以调用的单个方法引用的方式。每当你想要传递方法时都必须定义一个新接口，这似乎是没必要的。在本章中，我们描述了如何创建和使用一种称为\
  \ `delegate`（委托）的特殊类，它允许你像处理任何其他数据一样处理方法引用。然后我们展示了如何使用 `lambda expressions`（Lambda\
  \ 表达式）快速、方便地创建自定义委托。\n\nLambda 表达式在 C# 3.0 中添加到语言中；之前的版本 C# 2.0 支持一种不那么优雅的自定义委托创建语法，称为“匿名方法”（anonymous\
  \ methods）。C# 2.0 之后的每一个版本为了向后兼容都支持匿名方法，但在新代码中，它们应该被弃用，转而使用 Lambda 表达式。本章包含了“高级主题”（Advanced\
  \ Topic）版块，描述了如果你需要处理遗留的 C# 2.0 代码该如何使用匿名方法；如果你只处理较新的代码，可以很大程度上忽略这些部分。\n\n我们通过对表达式树（expression\
  \ trees）的讨论结束本章，表达式树允许你在运行时使用编译器对 Lambda 表达式的分析。\n\n![Image](img/0506fig01.jpg)\n\
  \n### 介绍委托\n\n资深的 C 和 C++ 程序员长期以来一直使用“函数指针”作为将一个方法的引用作为参数传递给另一个方法的机制。C# 通过使用 `delegates`（委托）实现了类似的功能。委托允许你捕方法的引用并像处理任何其他对象一样传递它，并像调用任何其他方法一样调用捕获的方法。让我们考虑一个示例来说说明这种技术可能有用之处。\n\
  \n#### 定义场景\n\n虽然效率不高，但最简单的排序算法之一是冒泡排序。列表 12.1 显示了 `BubbleSort()` 方法。\n\n**代码列表\
  \ 12.1：BubbleSort() 方法**\n\n点击此处查看代码图像\n\n***\n\n```c\nstatic class SimpleSort1\n\
  {\n  public static void BubbleSort(int[] items)\n  {\n      int i;\n      int j;\n\
  \      int temp;\n      if(items==null)\n      {\n        return;\n      }\n   \
  \   for (i = items.Length - 1; i >= 0; i--)\n      {\n        for (j = 1; j <= i;\
  \ j++)\n        {\n            if (items[j - 1] > items[j])\n            {\n   \
  \           temp = items[j - 1];\n              items[j - 1] = items[j];\n     \
  \         items[j] = temp;\n            }\n        }\n      }\n  // ...\n}\n```\n\
  \n该方法将按升序对整数数组排序。\n\n假设你需要对 列表 12.1 中的整数按升序或降序进行排序。你可以复制代码并将大于运算符替换为小于运算符，但仅仅为了更改一个运算符就复制几十行代码，这似乎不是一个好主意。作为一种不冗余的替代方案，你可以传入一个额外的参数来指示如何执行排序，如\
  \ 列表 12.2 方法，升序或降序**\n\n点击此处查看图像\n\n***\n\n```csharp\nclass SimpleSort2\n{\n  public\
  \ enum SortType\n  {\n    Ascending,\n    Descending\n  }\n  public static void\
  \ BubbleSort(int[] items, SortType sortOrder)\n  {\n    int i;\n    int j;\n   \
  \ int temp;\n    if(items==null)\n    {\n      return;\n    }\n    for (i = items.Length\
  \ - 1; i >= 0; i--)\n    {\n      for (j = 1; j <= i; j++)\n      {\n          bool\
  \ swap = false;\n          switch (sortOrder)\n          {\n            case SortType.Ascending\
  \ :\n              swap = items[j - 1] > items[j];\n              break;\n     \
  \       case SortType.Descending :\n              swap = items[j - 1] < items[j];\n\
  \              break;\n          }\n          if (swap)\n          {\n         \
  \   temp = items[j - 1];\n            items[j - 1] = items[j];\n            items[j]\
  \ = temp;\n          }\n      }\n    }\n  }\n}\n```\n\n然而，这段代码只处理了可能的排序顺序中的两种。如果你想按字典顺序对它们（即\
  \ 1, 10, 11, 12, 2, 20, ...），或者通过其他标准对其进行排序，很快 `SortType` 值的数量和对应的 switch case 就会变得繁琐。\n\
  \n#### 委托数据类型\n\n为了增加上述代码列表的灵活性并减少代码重复，你可以将比较方法作为 `BubbleSort()` 方法的参数。要将方法作为参数传递，需要一种数据类型来表示该方法；这种数据类型被称为委托，因为它“委托”了对对象所指代方法的调用。列表\
  \ 12.3 包含了对 `BubbleSort()` 方法的修改，其接收一个委托参数。在这种情况下，委托数据类型是 `ComparisonHandler`。\n\
  \n**代码列表 12.3：带委托参数的 BubbleSort()**\n\n\n\n\n\n点击此处查看代码图像\n\n```csharp\nclass DelegateSample\n\
  {\n  // ...\n  public static void BubbleSort(int[] items, ComparisonHandler comparisonMethod)\n\
  \  {\n      int i;\n      int j;\n      int temp;\n      if(comparisonMethod ==\
  \ null)\n      {\n          throw new ArgumentNullException(\"comparisonMethod\"\
  );\n      }\n      if(items==null)\n      {\n        return;\n      }\n      for\
  \ (i = items.Length - 1; i >= 0; i--)\n      {\n          for (j = 1; j <= i; j++)\n\
  \          {\n              if (comparisonMethod(items[j - 1], items[j]))\n    \
  \          {\n                  temp = items[j - 1];\n                  items[j\
  \ - 1] = items[j];\n                  items[j] = temp;\n              }\n      \
  \    }\n      }\n  }\n  // ...\n}\n```\n\n委托类型 `ComparisonHandler` 表示一个比较两个整数的方法。在\
  \ `BubbleSort()` 方法中，你随后使用 `ComparisonHandler` 的实例（通过参数 `comparisonMethod` 指定）来确定哪个整数较大。由于\
  \ `comparisonMethod` 代表一个方法，因此调用该方法的语法与调用任何其他方法相同。在这种情况下，`ComparisonHandler` 委托接受两个整数参数，并返回一个布尔值，指示第一个整数是否大于第二个整数。\n\
  \n注意，`ComparisonHandler` 委托是强类型的，用于表示一个返回 `bool` 且恰好接受两个整数参数的方法。与任何其他方法调用一样，对委托的调用也是强类型的，如果参数的数据类型与参数的类型不兼容，C#\
  \ 编译器将报告错误。\n\n### 声明委托类型\n\n你刚刚看到了如何定义一个使用委托的方法，并学习了如何通过将将委托变量视为方法来简单地调用该委托。然而，你还没有学习如何声明一个委托类型。要声明委托类型，你使用\
  \ `delegate` 关键字，并在其后跟一个看起来像方法声明的内容。该方法的签名就是委托可以引用的方法的签名，而委托类型的名称出现在方法声明中方法名出现的位置。列表\
  \ 12.4 显示了如何声明 `ComparisonHandler` 委托以需要两个整数并返回一个布尔值。\n\n**列表 12.4: 声明委托类型**\n\n\
  点击此处查看代码图像\n\n```csharp\npublic delegate bool ComparisonHandler (\n  int first,\
  \ int second);\n```\n\n类可以嵌套在其他类中，委托也可以嵌套在类中。如果委托声明出现在另一个类内部，则委托类型将是一个嵌套类型，如列表 12.5\
  \ 所示。\n\n**列表 12.5: 声明嵌套委托类型**\n\n点击此处查看代码图像\n\n```csharp\nclass DelegateSample\n\
  {\n  public delegate bool ComparisonHandler (\n    int first, int second);\n}\n\
  ```\n\n在这种情况下，数据类型将是 `DelegateSample.ComparisonHandler`，因为它被定义为 `DelegateSample`\
  \ 内部的嵌套类型。\n\n### 实例化委托\n\n在用委托实现 `BubbleSort()` 方法的最后一步中，你将学习如何调用该方法并传递委托实例——具体是一个\
  \ `ComparisonHandler` 类型的实例。要实例化委托，你需要一个带有参数和返回类型的方法，其必须与委托类型本身的签名匹配。在 `ComparisonHandler`\
  \ 的情况下，该方法接受两个整数并返回一个 `bool`。方法的名称不需要与委托的名称匹配，但方法的签名其余部分必须与委托签名兼容。列表 12.6 显示了与委托类型兼容的大于方法的代码。\n\
  \n**列表 12.6: 声明与 ComparisonHandler 兼容的方法**\n\n点击此处查看代码图像\n\n```csharp\npublic delegate\
  \ bool ComparisonHandler (\n  int first, int second);\nclass DelegateSample\n{\n\
  \  public static void BubbleSort(\n    int[] items, ComparisonHandler comparisonMethod)\n\
  \  {\n    // ...\n  }\n  public static bool GreaterThan(int first, int second)\n\
  \  {\n    return first > second;\n  }\n  // ...\n}\n```\n\n定义此方法后，你可以调用 `BubbleSort()`\
  \ 并提供要被委托捕的方法名称作为参数，如列表 12.7 所示。\n\n**列表 12.7: 使用方法名作为参数**\n\n点击此处查看代码图像\n\n```csharp\n\
  public delegate bool ComparisonHandler (\n  int first, int second);\nclass DelegateSample\n\
  {\n  public static void BubbleSort(\n    int[] items, ComparisonHandler comparisonMethod)\n\
  \  {\n    // ...\n  }\n  public static bool GreaterThan(int first, int second)\n\
  \  {\n    return first > second;\n  }\n  static void Main()\n  {\n      int i;\n\
  \      int[] items = new int[5];\n      for (i = 0; i < items.Length; i++)\n   \
  \   {\n          Console.Write(\"Enter an integer: \");\n          items[i] = int.Parse(Console.ReadLine());\n\
  \      }\n      BubbleSort(items, GreaterThan);\n      for (int i = 0; i < items.Length;\
  \ i++)\n      {\n          Console.WriteLine(items[i]);\n      }\n  }\n}\n```\n\n\
  注意，`ComparisonHandler` 委托是一个引用类型，但你不一定使用 `new` 来实例化它。从方法组（即命名方法的表达式）到委托类型的转换在 C#\
  \ 2.0 及更高版本中会自动创建委托对象。\n\n### 级主题：C# 1.0 中的委托实例化\n\n在列表 12.7 中，通过将所需方法的名称 `GreaterThan`\
  \ 作为参数传递给 `BubbleSort()` 调用来实例化委托。C# 的第一个版本要求实例化委托，使用列表 12.8 所示的更冗长的语法。\n\n**列表\
  \ 12.8: 在 C# 1.0 中传递委托作为参数**\n\n点击此处查看代码图像\n\n```csharp\nBubbleSort(items, new ComparisonHandler(GreaterThan));\n\
  ```\n\n后续版本支持两种语法；在本书的剩余部分我们将只显示现代、简洁的语法。\n\n### 高级主题：委托内部原理\n\n委托实际上是一种特殊的类。虽然\
  \ C# 标准没有具体指定类的层次结构，但委托必须直接或间接地继承自 `System.Delegate`。实际上，在 .NET 中，委托类型始终继承自 `System.MulticastDelegate`，后者又继承自\
  \ `System.Delegate`，如图 12.1 所示。\n\n![Image](img/12fig01.jpg)\n\n**图 12.1: 委托类型对象模型**\n\
  \n第一个属性的类型是 `System.Reflection.MethodInfo`，我们在第 17 章](#ch17.html_ch17)中讨论过。除了 `MethodInfo`，委托还需要包含要调用方法的对象实例。这就是第二个属性\
  \ `Target` 的目的。对于静态方法，`Target` 对应类型本身。`MulticastDelegate` 类的作用是下一个章节的主题。\n\n\n\n\
  \n\n请注意，所有委托（delegate）都是不可变的；也就是说，一旦创建了委托，就无法更改它。如果你有一个包含委托引用的变量，并想让它引用不同的方法，你必须创建一个新的委托并将其赋值给该变量。\n\
  \n尽管所有委托数据类型都间接继承自 `System.Delegate`，但 C# 编译器不允许你声明直接或间接继承自 `System.Delegate` 或\
  \ `System.MulticastDelegate` 的类。因此，列表 12.9 中所示的代码是无效。\n\n### 列表 12.9：System.Delegate\
  \ 不能显式作为基类\n\n点击此处查看代码图像\n\n```c\n// ERROR: 'ComparisonHandler' cannot\n// inherit\
  \ from special class 'System.Delegate'\n\npublic class ComparisonHandler: System.Delegate\n\
  {\n  // ...\n}\n```\n\n传递委托来指定排序顺序是一种比本章开头描述的方法要灵活得多的策略。通过传递委托，你只需要在比较部分添加一个将整数转换为字符串的备用委托，即可将排序顺序更改为字母顺序。列表\
  \ 12.10 显示了一个演示字母排序的完整列表，输出 12.1 显示了结果。\n\n### 列表 12.10：使用不同的 ComparisonHandler\
  \ 兼容方法\n\n点击此处查看代码图像\n\n```csharp\nusing System;\n\nclass DelegateSample\n{\n  public\
  \ delegate bool ComparisonHandler(int first, int second);\n\n  public static void\
  \ BubbleSort(\n      int[] items, ComparisonHandler comparisonMethod)\n  {\n   \
  \   int i;\n      int j;\n      int temp;\n      for (i = items.Length - 1; i >=\
  \ 0; i--)\n      {\n          for (j = 1; j <= i; j++)\n          {\n          \
  \    if (comparisonMethod(items[j - 1], items[j]))\n              {\n          \
  \        temp = items[j - 1];\n                  items[j - 1] = items[j];\n    \
  \              items[j] = temp;\n              }\n          }\n      }\n  }\n  public\
  \ static bool GreaterThan(int first, int second)\n  {\n      return first > second;\n\
  \  }\n  public static bool AlphabeticalGreaterThan(\n      int first, int second)\n\
  \  {\n      int comparison;\n      comparison = first.ToString().CompareTo(\n  \
  \    second.ToString());\n      return comparison > 0;\n  }\n\n  static void Main(string[]\
  \ args)\n  {\n      int i;\n      int[] items = new int[5];\n      for (i=0; i<items.Length;\
  \ i++)\n      {\n          Console.Write(\"Enter an integer: \");\n          items[i]\
  \ = int.Parse(Console.ReadLine());\n      }\n      BubbleSort(items, AlphabeticalGreaterThan);\n\
  \      for (i = 0; i < items.Length; i++)\n      {\n          Console.WriteLine(items[i]);\n\
  \      }\n  }\n}\n```\n\n**输出 12.1**\nEnter an integer: 1\nEnter an integer: 12\n\
  Enter an integer: 13\nEnter an integer: 5\nEnter an integer: 4\n1\n12\n13\n4\n5\n\
  \n字母顺序与数字顺序不同。尽管如此，请注意与本章开头使用的过程相比，添加这种额外的排序机制是多么简单。创建字母排序顺序的唯一更改是添加了 `AlphabeticalGreaterThan`\
  \ 方法，然后将该方法传递给 `BubbleSort()` 调用。\n\n## 开始 3.0\n\n### Lambda 表达式 (Lambda Expressions)\n\
  \n在列表 12.7 和 12.10 中，我们看到可以将 `GreaterThan` 和 `AlphabeticalGreaterThan` 表达式转换为与命名方法的参数类型和返回类型兼容的委托类型。你可能已经注意到\
  \ `GreaterThan` 方法的声明（即声明这是一个公共、静态、返回 `bool` 且具有两个名为 `first` 和 `second` 的 `int`\
  \ 类型参数的代码）远大于方法体，方法体只是简单地比较它的两个参数并返回结果。遗憾的是，仅仅为了让这样一个简单的方法能够转换为委托类型，竟然需要这么多“仪式”。\n\
  \n为了解决这个问题，C# 2.0 引入了更紧凑的创建委托的语法，而 C# 3.0 引入了若干比 C# 2.0 语法更紧凑的语法。C# 2.0 特称为`匿名方法`(anonymous\
  \ methods)，而 C# 3.0 特性称为`lambda 表达式`(lambda expressions)。在泛指这种语法时，我们将它们统称为`匿名函数`(anonymous\
  \ functions)。这两种语法仍然都是法的，但对于新代码，lambda 表达式语法优于匿名方法。在本书中，我们通常会使用 lambda 表达式语法，除非是在专门描述\
  \ C# 2.0 匿名方法时。Lambda 表达式本身分为两种类型：`语句 lambda`(statement lambdas) 和`表达式 lambda`(expression\
  \ lambdas)。图 2.2 显示了这些术语之间的关系。\n\n#### 图 2.2：匿名术语\n\nLambda 表达式的目的是当需要从简单方法创建委托时，消除声明整个新成员的麻烦。存在多种不同形式的\
  \ lambda 表达式。例如，语句 lambda 由一个形式参数列表、一个 lambda 运算符 `=>` 以及一个代码块组成。列表 2.1 显示的功能与列表\
  \ 2.7 中的 `BubbleSort` 调用等效，只是列表 2.1 使用语句 lambda 来表示比较，而不是创建一个 `GreaterThan` 方法。正如你看到的，`GreaterThan`\
  \ 方法中的许多信息都包含语句 lambda 中；形式参数声明和块是相同的，但缺少方法名称及其修饰符。\n\n### 列表 2.1：使用 Lambda 创建委托\n\
  \n```csharp\n// ...\nBubbleSort(items,\n  (int first, int second) =>\n  {\n    \
  \  return first < second;\n  }\n);\n// ...\n```\n\n在阅读包含 lambda 运算符的代码时，会将 lambda\
  \ 运算符替换为 *go/goes to*。例如，在列表 12.11 中，你会把第二个 `BubbleSort()` 参数读作“整数 `first` 和 `second`\
  \ go 到返回 `first` 小于 `second` 的结果”。\n\n\n\n\n\n正如读者将观察到的，列表 12.11 中的语法与列表 12.7 中的几乎相同，区别在于比较方法现在是在转换为委托类型的地方在词法上找到，而不是在其他地方找到并通过名称查找。该方法缺少了名称，这解释了为什么此类方法被称为“匿名函数”。返回类型缺失了，但编译器可以看到该\
  \ lambda 表达式正在转换为一个签名要求返回类型 `bool` 的委托。编译器会验证语句 lambda 块中每个 `return` 语句的表达式在返回 `bool`\
  \ 的方法中是否是合法的。它缺少了 `public` 修饰符；鉴于该方法不再是包含类的可访问成员，因此没有必要描述其访问访问性。同样，`static` 修饰符也不再需要了。方法周围的“仪式感”已经大大减少。\n\
  \n然而，这种语法仍然冗余地冗长。我们从委托类型推断出 lambda 表达式必须返回 `bool`；同样我们也可以推断出两个参数都必须是 `int` 类型，如列表\
  \ 12.12 所示。\n\n**列表 12.12：在语句 lambda 中省略参数类型**\n\n点击此处查看代码图像\n\n* * *\n\n```\n//\
  \ ...\n\nBubbleSort(items,\n           (first, second) =>\n           {\n      \
  \         return first < second;\n           }\n);\n// ...\n```\n\n* * *\n\n通常情况下，如果编译器可以从\
  \ lambda 表达式转换到的委托中推断出类型，则所有 lambda 表达式中显式声明参数类型都是可选的。但在指定类型可以使代码更具读性的情况下，C# 允许你这样做。在无法推断的情况下，C#\
  \ 语言要求必须显式说明 lambda 参数类型。如果显式指定了一个 lambda 参数类型，那么所有参数都必须显式指定，并且它们必须与委托参数类型完全匹配。\n\
  \n* * *\n\n### 指南\n\n当类型对读者来说显而易见或者它们是无关紧要的细节时，**考虑**从 lambda 形式参数列表中省略类型。\n\n*\
  \ * *\n\n另一种减少语法的方法是如列表 12.13 所示：一个恰好有一个参数且其类型可推断的 lambda 表达式可以省略参数列表周围的括号。如果有零个或多个参数，或者如果单个参数经过了显式类型，则\
  \ lambda 必须在参数列表周围带有括号。\n\n**列表 12.13：带有单个输入入语句 lambda**\n\n点击此处查看代码图像\n\n* * *\n\
  \n```csharp\nusing System.Collections.Generic;\nusing System.Diagnostics;\nusing\
  \ System.Linq;\n\n// ...\nIEnumerable<Process> processes = Process.GetProcesses().Where(\n\
  \  process => { return process.WorkingSet64 > 1000000000; });\n// ...\n```\n\n*\
  \ * *\n\n在列表 12.13 中，`Where()` 方法返回物理利用率大于 10 亿的进程。对比列表 12.14，后者是无参数的。空参数列表需要括号。注意，在列表\
  \ 12.14 中，语句 lambda 的主体包含多个语句。虽然语句 lambda 可以包含任意数量的语句，但语句 lambda 通常使用两个或三个语句。（泛型\
  \ `Func` 委托的使用将在本章节后面的“通用委托：`System.Func` 和 `System.Action`”部分描述。）\n\n**列表 12.14：无参数语句\
  \ lambda**\n\n点击此处查看代码图像\n\n* * *\n\n```csharp\nusing System;\n\n// ...\nFunc<string>\
  \ getUserInput =\n  () =>\n  {\n      string input;\n      do\n      {\n       \
  \   input = Console.ReadLine();\n      }\n      while(input.Trim().Length == 0);\n\
  \      return input;\n  };\n```\n\n* * *\n\n#### 表达式 lambda\n\n语句 lambda 语法已经比相应的方法声明简洁得多；正如我们所见，它不需要声明方法名称、访问性或参数类型。尽管如此，通过使用表达式\
  \ lambda 可以更加简洁。在列表 12.12、12.13 和 12.14 中，我们看到了由单个返回语句组成的语句 lambda。如果我们消除了这些“仪式感”呢？此类\
  \ lambda 块中唯一相关的信息是返回的表达式。表达式 lambda 只包含该返回表达式，没有任何语句块。列表 12.15 与列表 12.11 相同，只是使用的是表达式\
  \ lambda 而不是语句 lambda。\n\n**列表 12.15：使用表达式 lambda 委托**\n\n点击此处查看代码图像\n\n* * *\n\n\
  ```csharp\n// ...\nBubbleSort(items, (first, second) => first < second );\n// ...\n\
  ```\n\n* * *\n\n通常，你读取表达式 lambda 中的 lambda 运算符 `=>` 的方式与语句 lambda 相同：*变为*或*进入。当\
  \ lambda 用于返回 `bool` 时（如我们的 `BubbleSort()` 示例所示），lambda 被称为谓词。在这种情况下，通常将 lambda\
  \ 运算符读作*使得*或*其中*。你可能会将列表 12.15 中的 lambda 读作“`first` 和 `second`，使得 `first` 小于 `second`。”\n\
  \n与 `null` 字面量一样，匿名函数没有关联任何类型；而是由它转换类型决定。也就是说，我们看到的 lambda 表达式本质不是 `ComparisonHandler`\
  \ 类型，但它们与该类型兼容并可以转换。因此，你不能对匿名方法使用 `typeof()` 运算符（参见第 17 章），只有在将匿名方法转换为特定类型后才能调用\
  \ `GetType()`。\n\n表 12.1 提供了额外的 lambda 表达式特征。\n\n![Image](img/12tab01.jpg)![Image](img/12tab01a.jpg)\n\
  \n**表 12.1：lambda 表达式说明与示例**\n\n`3.0 结束`\n\n`2.0 开始`\n\n### 匿名方法\n\nC# 2.0 不支持 lambda\
  \ 表达式。相反，C# 2.0 使用一种名为匿名方法的语法。匿名方法类似于语句 lambda，但缺少许多使 lambda 如此紧凑的特性。匿名方法必须显式指定每个参数类型，并且有一个语句块。匿名方法不是在参数列表和代码块之间使用\
  \ lambda 运算符 `=>`，而是在参数列表之前放置关键字 `delegate`，强调匿名方法必须转换为委托类型。列表 12.16 展示了将列表 12.7](#ch12.html_ch12lis07)、12.12\
  \ 和 12.15 中的代码重写为使用匿名方法。\n\n**列表 12.16：在 C# 2.0 中传递匿名方法**\n\n点击此处查看代码图像\n\n\n\n\n\
  ```csharp\ndelegate(int first, int second)\n{\n    return first < second;\n);\n\
  ```\n\n* *\n\n遗憾的是，在 C# 3.0 及更高版本中，定义匿名函数有两种非常相似的方法。\n\n* *\n\n### 指南\n\n在新代码中，**避免**使用匿名方法语法；优先使用更紧凑的\
  \ lambda 表达式语法。\n\n* *\n\n然而，匿名方法支持一个 lambda 表达式不支持的小功能：在某些情况下，匿名方法可以完全省略其参数列表。\n\
  \n* *\n\n### 高级主题：无参数匿名方法\n\n与 lambda 表达式不同，只要匿名方法体没有使用任何参数，且委托类型仅要求“值”参数（即它不需要将参数标记为\
  \ `out` 或 `ref`），匿名方法就可以完全省略参数列表。例如，匿名方法表达式 `delegate { return Console.ReadLine()\
  \ != \"\"; }` 可以转换为任何返回 `bool` 类型的委托类型，无论该委托需要多少参数。此功能并不经常使用，但你在阅读遗留代码时可能会遇到它。\n\
  \n* *\n\n`End 2.0`\n\n* *\n\n### 高级主题：为什么是“Lambda”表达式？\n\n匿名方法之所以被称为“匿名方法”是显而易见的：它们看起来非常像方法声明，但没有关联的声明名称。但“lambda\
  \ 表达式”中的“lambda”是从哪里来的呢？\n\nlambda 表达式的想法源于逻辑学家阿隆佐·丘（Alonzo Church）的工作，他在 20 世纪\
  \ 30 代发明了一种研究函数的技巧称为“lambda 演算”。在 Church 的记法中，一个接受参数 `x` 并产生表达式 `y` 的函数表示为在整个表达式前加一个小小的希腊字母\
  \ lambda，并用点将参数与值隔开。C# 的 lambda 表达式 `x=>y` 在 Church 的记法中记为 `λx.y`。由于在 C# 程序中使用希腊字母极不方便，而且点号在\
  \ C# 中已经有许多含义，C# 的设计者选择使用“粗箭头”符号而非原始符号。“lambda 表达式”这一名称表明匿名函数思想的理论基础是 lambda 演算，尽管文本中并没有出现\
  \ lambda 字母。\n\n* *\n\n`Begin 3.0`\n\n`Begin 4.0`\n\n### 通用委托：System.Func 和 System.Action\n\
  \n为了减少定义自定义委托类型的需要，.NET 3.5 运行时库（对应于 C# 3.0）包含了一组通用委托，其中大多数是泛型的。`System.Func` 委托族用于引用返回值的方法；`System.Action`\
  \ 委托族用于引用返回 `void` 的方法。这些委托的签名如列表 12.17 所示（尽管 `in`/`out` 类型修饰符直到 C# 4.0 才被添加，稍后会讨论）。\n\
  \n**列表 12.17：Func 和 Action 委托声明**\n\n点击此处查看代码图像\n\n\n\n\n\n许多人发现委托的逆变（contravariance）令人困惑；只需记住，一个可以作用于每个对象的操作可以被用作作用于任何字符串的操作。但反之则不然：一个只能作用于字符串的操作无法作用于每个对象。同样，`Func`\
  \ 族委托中的每个类型在返回类型上都是协变的（covariant），这正如 `TResult` 上的 `out` 类型参数修饰符所示所示。因此，可以将类型为 `Func<string>`\
  \ 的委托引用赋值给类型为 `Func<object>` 的变量。\n\n列表 12.18 显示了委托协变和逆变的示例。\n\n#### 列表 12.18：在委托中使用变变性\n\
  \n点击此此处查看代码图像\n\n```csharp\n// 逆变\nAction<object> broadAction =\n  (object data)\
  \ =>\n  {\n      Console.WriteLine(data);\n  };\nAction<string> narrowAction = broadAction;\n\
  \n// 协变\nFunc<string> narrowFunction =\n  () =>Console.ReadLine();\nFunc<object>\
  \ broadFunction = narrowFunction;\n\n// 逆变与协变结合\nFunc<object, string> func1 =\n\
  \  (object data) => data.ToString();\nFunc<string, object> func2 = func1;\n```\n\
  \n列表的最后部分将两个变变性概念结合在一个示例中，展示了当同时涉及 `in` 和 `out` 类型参数时，它们是如何同时发生的。\n\n允许对泛型委托类型进行引用转换是\
  \ C# 4.0 添加协变和逆变转换的关键动机场景。（另一个是支持 `IEnumerable<out T>` 的协变。）\n\n`结束 4.0`\n\n## 高级主题：Lambda\
  \ 表达式和匿名方法的内部原理\n\nLambda 表达式（以及匿名方法）本质上并不是“内置”在 CLR 中的。相反，当编译器遇到匿名函数时，它会将其翻译为特殊的隐藏类、字段和方法，以实现所需的语义。C#\
  \ 编译器会为该模式生成实现代码，因此开发人员不需要自己编写这些代码。当给出 列表 12.11、12.12、12.15 或 12.16 中的代码时，C# 编译器会生成与\
  \ 列表 12.19 所示代码相似的 CIL 代码。\n\n### 列表 12.19：编译器为 Lambda 表达式生成的 CIL 的 C# 等效代码\n\n\
  点击此此处查看代码图像\n\n```csharp\nclass DelegateSample\n{\n  // ...\n  static void Main(string[]\
  \ args)\n  {\n      int i;\n      int[] items = new int[5];\n      for (i=0; i<items.Length;\
  \ i++)\n      {\n          Console.Write(\"Enter an integer:\");\n          items[i]\
  \ = int.Parse(Console.ReadLine());\n      }\n      BubbleSort(items, DelegateSample.__AnonymousMethod_00000000);\n\
  \      for (i = 0; i < items.Length; i++)\n      {\n          Console.WriteLine(items[i]);\n\
  \      }\n  }\n  private static bool __AnonymousMethod_00000000(int first, int second)\n\
  \  {\n      return first < second;\n  }\n}\n```\n\n在这个示例中，编译器将匿名函数转换为一个单独声明的方法，然后该方法被实例化并作为参数传递。出乎意的是，编译器生成的代码看起来与\
  \ 列表 2.7 中的原始代码非常相似，而匿名函数语法的初衷正是为了简化这种代码。然而，如果涉及到“外部变量”，编译器的转换可能会比简单地将匿名函数重写为静态方法要复杂得多。\n\
  \n#### 外部变量\n\n在 Lambda 表达式外部声明的局部变量（包括包含方法的参数）被称为该 Lambda 的**外部变量**（outer variables）。（`this`\
  \ 引用虽然不是变量，但也被视为外部变量。）当 Lambda 主体使用外部变量时，该变量被 true Lambda **捕获**（captured）（或者等效地，被**闭包**（closed\
  \ over））。在 列表 12.20 中，我们使用一个外部变量来计算 `BubbleSort()` 执行了多少次比较。输出 12.2 显示了该列表的结果。\n\
  \n### 列表 12.20：在 Lambda 表达式中使用外部变量\n\n点击此此处查看代码图像\n\n```csharp\nclass DelegateSample\n\
  {\n  // ...\n  static void Main(string[] args)\n  {\n      int i;\n      int[] items\
  \ = new int[5];\n      int comparisonCount=0;\n      for (i=0; i<items.Length; i++)\n\
  \      {\n          Console.Write(\"Enter an integer:\");\n          items[i] =\
  \ int.Parse(Console.ReadLine());\n      }\n      BubbleSort(items, (int first, int\
  \ second) =>\n      {\n          comparisonCount++;\n          return first < second;\n\
  \      });\n      for (i = 0; i < items.Length; i++)\n      {\n          Console.WriteLine(items[i]);\n\
  \      }\n      Console.WriteLine(\"Items were {0} times.\", comparisonCount);\n\
  \  }\n}\n```\n\n**输出 12.2**\nEnter an integer:5\nEnter an integer:1\nEnter an integer:4\n\
  Enter an integer:2\nEnter an integer:3\n5\n4\n3\n2\n1\nItems were compared 10 times.\n\
  \n注意 `comparisonCount` 出现在 Lambda 外部，并在内部递增。在调用 `BubbleSort()` 方法后，`comparisonCount`\
  \ 被打印到控制台。\n\n通常局部变量的生命周期与其作用域相绑定；当离开作用域时，与变量相关的存储位置就不再有效。但从外部变量创建的委托的生命周期可能比局部变量长或短，且委托在每次调用时都必须安全地访问外部变量。因此，捕获变量的生命周期被延长了；它保证寿命至少与捕获它的委托对象一样长。（它可能比这还要长——编译器确保外部变量生命周期延长的一种实现细节。）\n\
  \nC# 编译器负责生成 CIL 代码，在匿名方法和声明它的方法之间共享 `comparisonCount`。\n\n## 高级主题：外部变量的 CIL 实现\n\
  \nC# 编译器为捕获外部变量的匿名函数生成的 CIL 代码比不捕获任何内容的匿名函数代码要复杂得多。列表 12.21 显示了用于 列表 12.20 代码中外部变量的\
  \ CIL 的 C# 等效代码。\n\n```csharp\nclass DelegateSample\n{\n  // ...\n  private sealed\
  \ class __LocalsClass_00000001\n  {\n    public int comparisonCount;\n    public\
  \ bool __AnonymousMethod_00000000(int first, int second)\n    {\n      return first\
  \ < second;\n    }\n  }\n}\n```\n\n\n\n\n\n```cs\n{\n    comparisonCount++;\n  \
  \  return first < second;\n}\n\n}\n\n// ...\n\nstatic void Main(string[] args)\n\
  {\n    int i;\n    __LocalsDisplayClass_00000001 locals = new __LocalsDisplayClass_00000001();\n\
  \    locals.comparisonCount=0;\n    int[] items = new int[5];\n    for (i=0; i<items.Length;\
  \ i++)\n    {\n        Console.Write(\"Enter an integer:\");\n        items[i] =\
  \ int.Parse(Console.ReadLine());\n    }\n    BubbleSort(items, locals.__AnonymousMethod_00000000);\n\
  \    for (i = 0; i < items.Length; i++)\n    {\n        Console.WriteLine(items[i]);\n\
  \    }\n    Console.WriteLine(\"Items were compared {0} times.\", locals.comparisonCount);\n\
  }\n```\n\n注意，捕获的局部变量从未被“传递”到任何地方，也从未被“复制”到任何地方。相反，被捕获的局部变量（`comparisonCount`）是一个单一变量，编译器通过将其实现为实例字段而非局部变量，扩展了它的生命周期。该局部变量的所有用法都被重写为对该字段的使用。生成的类\
  \ `__LocalsDisplayClass` 是一个闭包——一种数据结构（C# 中的类），它包含一个表达式以及评估该表达式所需的变量（C# 中的公共字段）。\n\
  \n### 结束 3.0\n\n### 开始 5.0\n\n#### 进阶主题：意外捕获循环变量\n\n你认为`Listing 12.22` 的输出应该是什么？\n\
  \n##### 列表 12.22：C# 5.0 中捕获循环变量\n\n点击此处查看代码图像\n\n```cs\nclass CaptureLoop\n{\n \
  \   static void Main()\n    {\n        var items = new string[] { \"Moe\", \"Larry\"\
  , \"Curly\" };\n        var actions = new List<Action>();\n        foreach (string\
  \ item in items)\n        {\n            actions.Add( => { Console.WriteLine(item);\
  \ } );\n        }\n        foreach (Action action in actions)\n        {\n     \
  \       action();\n        }\n    }\n}\n```\n\n大多数人期望输出将如 `Output 12.3` 所示，在 C#\
  \ 5.0 中确实如此。然而，在之前的 C# 版本中，输出如 `Output 12.4` 所示。\n\n**输出 12.3：** C# 5.0 输出\nMoe\n\
  Larry\nCurly\n\n**输出 12.4：** C# 4.0 输出\nCurly\nCurly\nCurly\n\nLambda 表达式捕获变量并始终使用该变量的最新值；它不会捕获并保留委托创建时变量所处的值。这通常是你想要的——毕竟，在\
  \ `Listing 12.20` 中捕获 `comparisonCount` 的全部就是为了确保在递增时使用它的最新值。循环变量也不例外；当你捕获一个循环变量时，每个委托都捕获同一个循环变量。当循环变量改变时，每个捕获了该变量的委托都能看到这一变化。因此，C#\
  \ 4.0 的行为是合理的，但几乎不是代码作者想要的。\n\n在 C# 5.0 中，C# 语言发生了变化，现在 `foreach` 循环的循环变量在每次迭代时都被视为一个“新”的变量；因此，每个委托的创建捕获的是不同的变量，而不是所有迭代共享同一个变量。然而，这一变化并没有应用于\
  \ `for` 循环：如果你使用 `for` 循环编写类似的代码，在 `for` 语句头部声明的任何循环变量在被捕获时将被视为单一的外部变量。如果你需要编写在\
  \ C# 5.0 和之前的 C# 版本中运行相同的代码，请使用 `Listing 12.23` 所示的模式。\n\n##### 列表 12.23：C# 5.0\
  \ 之前的循环变量捕获变通方案\n\n点击此处查看代码图像\n\n```cs\nclass DoNotCaptureLoop\n{\n    static void\
  \ Main()\n    {\n        var items = new string[] { \"Moe\", \"Larry\", \"Curly\"\
  \ };\n        var actions = new List<Action>();\n        foreach (string item in\
  \ items)\n        {\n            actions.Add( => { Console.WriteLine(item); } );\n\
  \        }\n        foreach (Action action in actions)\n        {\n            action();\n\
  \        }\n    }\n}\n```\n\n\n\n\n\n这种场景是向语言中添加表达式树（expression trees）的动机。Lambda\
  \ 表达式转换为表达式树后，会变成表示描述 Lambda 表达式的数据的对象，而不是实现匿名函数的编译代码。由于表达式树代表的是数据而非编译代码，因此可以在执行时分析\
  \ Lambda，并利用这些信息构建一个在数据库上执行的查询（例如）。`Where()` 方法接收到的表达式树可能会转换为 SQL 查询语句并传递给数据库，如列表\
  \ 12.24 所示。\n\n**列表 12.24：将表达式树转换为 SQL `where` 子句**\n\n![Image](img/12lis24.jpg)\n\
  \n传递给 `Where()` 用的表达式树说明 Lambda 参数包含以下元素：\n\n*   对 `Person` 对象的 `Name` 属性的读取\n*\
  \   对名为 `ToUpper()` 的 `string` 方法的调用\n*   一个常量值`\"INIGO MONTOYA\"`\n*   一个相等运算符\
  \ `==`\n\n`Where()` 方法通过检查数据并构建 SQL 查询字符串，将这些数据转换为 SQL `where` 子句。然而，SQL 只是可能性之一；你可以构建一个表达式树评估器，将表达式转换为任何查询语言。\n\
  \n### 表达式树是对象图\n\n在执行时，转换为表达式树的 Lambda 变成一个包含来自 `System.Linq.Expressions` 命名空间对象的对象图。图中的“根”对象代表\
  \ Lambda 本身。该对象引用了代表参数、返回类型和主体表达式的对象，如图 12.3 所示。对象图包含了编译器关于 Lambda 推断出的所有信息。这些信息随后可以在执行时用于创建查询。另一种方法是根\
  \ Lambda 表达式有一个方法 `Compile`，它可以“即时”生成 CIL（公共中间语言）并创建一个实现所描述 Lambda 的委托。\n\n![Image](img/12fig03.jpg)\n\
  \n**图 12.3：Lambda 表达式树类型**\n\n图 12.4 显示了 Lambda 主体中一元和二元表达式在对象图中对应的类型。\n\n![Image](img/12fig04.jpg)\n\
  \n**图 12.4：一元和二元表达式树类型**\n\n`UnaryExpression` 表示类似于 `–count` 的表达式。它拥有一个类型为 `Expression`\
  \ 的单个子节点 `Operand`。`BinaryExpression` 拥有两个子表达式 `Left` 和 `Right`。这两种类型都有一个 `NodeType`\
  \ 属性，用于标识特定的运算符，并且都继承自基类 `Expression`。还有大约 30 种表达式类型，如 `NewExpression`、`ParameterExpression`、`MethodCallExpression`\
  \ 和 `LoopExpression`，用于表示（几乎）C# 和 Visual Basic 中每种可能的表达式。\n\n### 委托与表达式树\n\nLambda\
  \ 表达式的有效性在编译时会通过完全的语义分析进行验证，无论它是被转换为委托还是表达式树。转换为委托的 Lambda 会导致编译器将 Lambda 作为一个方法发出，并在执行时生成创建该该方法委托的代码。转换为表达式树的\
  \ Lambda 则导致编译器在执行时生成创建 `LambdaExpression` 实例的代码。但当使用语言集成查询（LINQ）API 时，编译器如何知道是应该生成委托在本地执行查询，还是生成表达式树以便将查询信息发送到远程数据库服务器呢？\n\
  \n用于构建 LINQ 查询的方法（如 `Where()`）是扩展方法。扩展 `IEnumerable<T>` 接口的方法版本接收委托参数；扩展 `IQueryable<T>`\
  \ 接口的方法则接收表达式树参数。因此，编译器可以根据被查询集合的类型，来决定是从作为参数提供的 Lambda 创建委托还是表达式树。\n\n例如，考虑以下代码中的\
  \ `Where()` 方法：\n\n点击此处查看代码图像\n\n```csharp\npersons.Where( person => person.Name.ToUpper()\
  \ == \"INIGO MONTOYA\");\n```\n\n在 `System.Linq.Enumerable` 类中声明的扩展方法签名是：\n\n点击此处查看代码图像\n\
  \n```csharp\npublic IEnumerable<TSource> Where<TSource>(\n    this IEnumerable<TSource>\
  \ collection,\n    Func<TSource, bool> predicate);\n```\n\n在 `System.Linq.Queryable`\
  \ 类中声明的扩展方法签名是：\n\n点击此处查看代码图像\n\n```csharp\npublic IQueryable<TSource> Where<TSource>(\n\
  \    this IQueryable<TSource> collection,\n    Expression<Func<TSource, bool>> predicate);\n\
  ```\n\n编译器根据 `persons` 的编译时类型决定使用哪种扩展方法；如果它是类型可转换为 `IQueryable<Person>` 的类型，则选择\
  \ `System.Linq.Queryable` 中的方法。它将 Lambda 转换为表达式树。在执行时，`persons` 所引的对象接收表达式树数据，并可能使用这些数据构建\
  \ SQL 查询，随后在请求查询结果时将查询传递给数据库。调用 `Where` 的结果是一个对象，当要求获取查询结果时，它会将查询发送到数据库并产生结果。如果\
  \ `persons` 无法隐含转换为 `IQueryable<Person>` 但可以隐含转换为 `IEnumerable<Person>`，则选择 `System.Linq.Enumerable`\
  \ 方法，并将 Lambda 转换为委托。\n\n### 检查表达式树\n\n正如我们看到的，将 Lambda 表达式转换为 `Expression<TDelegate>`\
  \ 创建的是表达式树而非委托。在本章之前，我们已经见过如何将如 `(x,y)=>x>y` 的 Lambda 转换为类型如 `Func<int, int, bool>`\
  \ 的委托。要将同一个 Lambda 转换为表达式树，我们只需将其转换为 `Expression<Func<int, int, bool>>`，如 12.25\
  \ 所示。我们可以检查该对象并显示其结构，以及复杂表达式树的结构。注意，将表达式树实例传递给 `ToString()` 会表达式树转换为描述字符串；表达式树对象重写了\
  \ `ToString()`，因此可以在调试时一眼看出表达式树的内容。\n\n**列表 12.25：检查表达式树**\n\n点击此处查看代码图像\n\n```csharp\n\
  using System;\nusing System.Expressions;\n\npublic class Program\n{\n    public\
  \ static void Main()\n    {\n        Expression<Func<int, int, bool>> expression;\n\
  \        expression = (x, y) => x > y;\n        Console.WriteLine(\"-------------\
  \ {0} -------------\", expression);\n        PrintNode(expression.Body, 0);\n  \
  \      Console.WriteLine();\n        Console.WriteLine();\n        expression =\
  \ (x, y) => x * y > x + y;\n        Console.WriteLine(\"------------- {0} -------------\"\
  , expression);\n        PrintNode(expression.Body, 0);\n    }\n    public static\
  \ void PrintNode(Expression expression, int indent)\n    {\n        if (expression\
  \ is BinaryExpression)\n            PrintNode(expression as BinaryExpression, indent);\n\
  \        else\n            PrintSingle(expression, indent);\n    }\n    private\
  \ static void PrintNode(BinaryExpression expression, int indent)\n    {\n      \
  \  PrintNode(expression.Left, indent + 1);\n        PrintSingle(expression, indent);\n\
  \        PrintNode(expression.Right, indent + 1);\n    }\n}\n```\n\n\n\n\n```csharp\n\
  private static void PrintSingle(\n    Expression expression, int indent)\n{\n  \
  \  Console.WriteLine(\"{0,\" + indent * 5 + \"}{1}\",\n        \"\", NodeToString(expression));\n\
  }\nprivate static string NodeToString(Expression expression)\n{\n    switch (expression.NodeType)\n\
  \    {\n        case ExpressionType.Multiply:\n            return \"*\";\n     \
  \   case ExpressionType.Add:\n            return \"+\";\n        case ExpressionType.Divide:\n\
  \            return \"/\";\n        case ExpressionType.Subtract:\n            return\
  \ \"-\";\n        case ExpressionType.GreaterThan:\n            return \">\";\n\
  \        case ExpressionType.LessThan:\n            return \"<\";\n        default:\n\
  \            return expression.ToString() +\n                \" (\" + expression.NodeType.ToString()\
  \ + \")\";\n    }\n}\n```\n\n在 输出 12.5 中，我们看到 `Main()` 中的 `Console.WriteLine()`\
  \ 语句以文本形式输出了表达式树体。\n\n**输出 12.5**\n\n点击此处查看代码图像\n\n------------- (x, y) => (x >\
  \ y) -------------\n\n      x (Parameter)\n>\n\n      y (Parameter)\n\n-------------\
  \ (x, y) => ((x * y) > (x + y)) -------------\n\n          x (Parameter)\n     \
  \     *\n          y (Parameter)\n>\n          x (Parameter)\n          +\n    \
  \      y (Parameter)\n\n需要注意的一点是表达式树是数据的集合，通过遍历数据，可以将数据转换为另一种格式；在这种情况下，我们将表达式树转换为描述性字符串，但也可以将其转换为另一种查询语言的表达式。\n\
  \n通过递归，`PrintNode()` 函数演示了表达式树中的节点本身就是包含零或多个子表达式树的树。代表 lambda 的“根”树指的是作为 lambda\
  \ 体的具有其 `Body` 属性的表达式。每个表达式树节点都包含一个枚举类型 `ExpressionType` 的 `NodeType` 属性，描述它是什么类型的表达式。存在许多类型的表达式：`BinaryExpression`、`ConditionalExpression`、`LambdaExpression`、`MethodCallExpression`、`ParameterExpression`\
  \ 和 `ConstantExpression` 都是示例。每种类型都派自 `Expression`。\n\n注意，尽管表达式树库现在包含了用于表示 C# 和\
  \ Visual Basic 大多数语句的对象，但这两种语言都不支持将语句 lambda 转换为表达式树。只有表达式 lambda 可以转换为表达式树。\n\n\
  ### 总结\n\n本章从讨论委托及其作为方法引用的用途开始。这一强大的概念允许你在编写指令时，将一组指令传递，以便在不同的位置调用，而不是立即执行。\n\n\
  lambda 表达式的概念是一种取代了（但没有消除）C# 2.0 匿名方法的语法。这些构造允许程序人员直接将一组指令赋值给变量，而无需定义显式方法。这种构造结构为在\
  \ LINQ API 内部进行动态编程提供了显著的灵活性。\n\n本章结束于对表达式树概念的讨论，并考虑了它们如何编译成代表 lambda 语义分析的对象，而不是委托本身。这一重要特性支持如\
  \ Entity Framework 和 LIN 等库——即那些解释表达式树并在 CIL 以外的上下文中使用它的库。\n\n`lambda 表达式` 包含了 `语句\
  \ lambda` 和 `表达式 lambda`。换句话说，语句 lambda 和表达式 lambda 都是 lambda 表达式的类型。\n\n本章提到但未详述的是多播委托。下一章将详细研究多播委托，并解释它们如何通过事件实现发布-订阅模式。\n\
  \n## 13. 事件\n\n开始 2.0\n\n在上一章中，你学习了如何使用委托的实例引用方法，并通过委托调用该方法。委托是被称为“发布-订阅”的较大模式的构建块。使用委托实现发布-订阅模式是本章的重点。本章中描述的所有内容都可以仅使用委托完成。然而，本章强调的事件构造提供了额外的封装，使得发布-订阅模式更容易实现且更不容易出错。\n\
  \n在上一章中，所有委托都引用单个方法。更广泛地说，单个委托值可以引用整个要按顺序调用的方法集合；这种委托被称为 `多播委托`（multicast delegate）。它的应用实现了这种场景：将单个事件（例如对象状态的变化）的通知发布给多个订阅者。\n\
  \n![图像](img/0543fig01.jpg)\n\n尽管事件在 C# 1.0 中就已经存在，但 C# 2.0 中泛型的引入显著地改变了编码规范，因为使用泛型委托类型意味着不再需要为每个可能的签名声明委托。出于这个原因，本章假设最低版本为\
  \ C# 2.0。仍生活在 C# 1.0 世界的读者也可以使用事件，但他们必须声明自己的委托类型（如 第 12 章 中讨论的）。\n\n### 使用多播委托编写观察者模式\n\
  \n考虑一个温度控制，加热器和冷却器连接到同一个温度器上。为了让单元恰地开启和关闭，你必须通知单元温度的变化。一个温度器将温度变化发布给多个订阅者——加热单元和冷却单元。下一节将研究代码\
  \ (1)。在例示例中，我们使用 *thermostat*（温度器）一词，因为人们通常在加热冷却系统的背景下考虑它。从技术上讲，*thermometer*（温度）更为合适。\n\
  \n#### 定义订阅者方法\n\n首先定义 `Heater` 和 `Cooler` 对象（参见列表 13.1](#ch13.html_ch13lis01)）。\n\
  \n**列表 13.1：加热器和冷却器的事件实现**\n\n点击此处查看代码图像\n\n```csharp\nclass Cooler\n{\n  public\
  \ Cooler(float temperature)\n  {\n    Temperature = temperature;\n  }\n  public\
  \ float Temperature { get; set; }\n  public void OnTemperatureChanged(float newTemperature)\n\
  \  {\n    if (newTemperature > Temperature)\n    {\n      Console.WriteLine(\"Cooler:\
  \ On\");\n    }\n    else\n    {\n      Console.WriteLine(\"Cooler: Off\");\n  \
  \  }\n  }\n}\nclass Heater\n{\n  public Heater(float temperature)\n  {\n    Temperature\
  \ = temperature;\n  }\n  public float Temperature { get; set; }\n  public void OnTemperatureChanged(float\
  \ newTemperature)\n  {\n    if (newTemperature < Temperature)\n    {\n      Console.WriteLine(\"\
  Heater: On\");\n    }\n    else\n    {\n      Console.WriteLine(\"Heater: Off\"\
  );\n    }\n  }\n}\n```\n\n\n\n\n这两个类在本质上是相同的，唯一的区别在于温度比较部分。（事实上，如果你在 `OnTemperatureChanged`\
  \ 方法中使用一个指向比较方法的委托，你就可以省略其中一个类。）每个类都存储了单元应该开启的温度。此外，两个类都提供了一个 `OnTemperatureChanged()`\
  \ 方法。调用 `OnTemperatureChanged()` 方法是向 `Heater`（加热器）和 `Cooler`（冷却器）类指示温度变化的手段。该方法的实现使用\
  \ `newTemperature` 与存储的触发温度进行比较，以决定是否启动设备。\n\n`OnTemperatureChanged()` 方法是订阅者方法。它们的参数和返回类型必须与\
  \ `Thermostat` 类中的委托匹配，我们将在接下来讨论该委托。\n\n## 定义发布者\n\n`Thermostat` 类负责向 `heater` 和\
  \ `cooler` 对象实例报告温度变化。`Thermostat` 类的代码出现在列表 13.2 中。\n\n**列表 13.2：定义事件发布者 Thermostat**\n\
  \n点击此处查看代码图像\n\n```sharp\npublic class Thermostat\n{\n  // 定义事件发布者\n  public Action<float>\
  \ OnTemperatureChange { get; set; }\n\n  public float CurrentTemperature { get;\
  \ set; }\n}\n```\n\n`Thermostat` 包含一个名为 `OnTemperatureChange` 的属性，其类型为 `Action<float>`\
  \ 委托。`OnTemperatureChange` 存储了一个订阅者列表。注意，只需要一个委托字段即可存储所有订阅者。也就是说，`Cooler` 和 `Heater`\
  \ 类将从这个单一发布者接收温度变化的通知。\n\n`Thermostat` 的最后一个成员是 `CurrentTemperature` 属性。该属性设置并检索\
  \ `Thermostat` 类报告的当前温度值。\n\n## 连接发布者和订阅者\n\n最后，我们将所有部分组合在 `Main()` 方法中。列表 13.3\
  \ 显示了 `Main()` 可能的样子。\n\n**列表 13.3：连接发布者和订阅者**\n\n点击此处查看代码图像\n\n```sharp\nclass\
  \ Program\n{\n  public static void Main()\n  {\n      Thermostat thermostat = new\
  \ Thermostat();\n      Heater heater = new Heater(60);\n      Cooler cooler = new\
  \ Cooler(80);\n      string temperature;\n      thermostat.OnTemperatureChange +=\
  \ heater.OnTemperatureChanged;\n      thermostat.OnTemperatureChange += cooler.OnTemperatureChanged;\n\
  \      Console.Write(\"Enter temperature: \");\n      temperature = Console.ReadLine();\n\
  \      thermostat.CurrentTemperature = int.Parse(temperature);\n  }\n}\n```\n\n\
  该列表中的代码通过使用 `+=` 运算符直接赋值，将两个订阅者（`heater.OnTemperatureChanged` 和 `cooler.OnTemperatureChanged`）注册到\
  \ `OnTemperatureChange` 委托。\n\n通过将用户输入的温度值作为输入，你可以设置 `thermostat` 的 `CurrentTemperature`。然而，你还没有编写任何代码将温度变化事件发布给订阅者。\n\
  \n## 调用委托\n\n每当 `Thermostat` 类上的 `CurrentTemperature` 属性发生变化时，你都希望调用委托来通知订阅者（`heater`\
  \ 和 `cooler`）温度的变化。为了实现这一目标，你必须修改 `CurrentTemperature` 属性以保存新值并向每个订阅者发布通知。代码修改出现在列表\
  \ 13.4 中。\n\n**列表 13.4：在不检查空的情况下调用委托**\n\n点击此处查看代码图像\n\n```sharp\npublic class Thermostat\n\
  {\n  ...\n  public float CurrentTemperature\n  {\n    get { return _CurrentTemperature;\
  \ }\n    set\n    {\n      if (value != CurrentTemperature)\n      {\n         \
  \ _CurrentTemperature = value;\n          // 未完成：检查空\n          // 调用订阅者\n     \
  \     OnTemperatureChange(value);\n      }\n    }\n  }\n  private float _CurrentTemperature;\n\
  }\n```\n\n现在，`CurrentTemperature` 的赋值包含了一些特殊逻辑，用于通知订阅者 `CurrentTemperature` 的变化。通知所有订阅者的调用仅仅是单一\
  \ C# 语句 `OnTemperatureChange(value)`。这句单一语句将温度变化发布给 `cooler` 和 `heater` 对象。在这里，你从实践中看到使用单次调用通知多个订阅者的能力，正是委托被专门称为多路委托（multicast\
  \ delegates）的原因。\n\n### 检查空\n\n事件发布代码中的一个重要部分缺失于列表 13.4。如果没有订阅者注册接收通知，`OnTemperatureChange`\
  \ 将为 `null`，执行 `OnTemperatureChange(value)` 语句将抛出 `NullReferenceException`。为了避免这种情况，在触发事件之前有必要检查\
  \ `null`。列表 13.5 演示了如何使用 C# 6.0 的空条件运算符在调用 `Invoke()` 之前进行操作。\n\n**列表 13.5：调用委托**\n\
  \n点击此处查看代码图像\n\n```sharp\npublic class Thermostat\n{\n  ...\n  public float CurrentTemperature\n\
  \  {\n    get { return _CurrentTemperature; }\n    set\n    {\n      if (value !=\
  \ CurrentTemperature)\n      {\n          _CurrentTemperature = value;\n       \
  \   // 如果有订阅者，\n          // 通知它们温度的变化\n          // 通过调用订阅者\n          OnTemperatureChange?.Invoke(value);\
  \ // C# 6.0\n      }\n    }\n  }\n  private float _CurrentTemperature;\n}\n```\n\
  \n注意空条件运算符后的 `Invoke()` 方法调用。虽然可以使用点运算符调用该方法，但意义不大，因为它等同于在列表 13.4 中直接调用委托 `OnTemperatureChange(value)`。条件运算符内在的重要优势是特殊逻辑，确保在检查\
  \ `null` 之后，订阅者不会取消订阅导致委托再次变为 `null`。\n\n遗憾的是，在 C# 6.0 之前不存在这种可中断的空检查逻辑。因此，在早期的\
  \ C# 版本中，实现冗长得多，如列表 13.6 所示。\n\n**列表 13.6：C# 6.0 之前的空检查调用委托**\n\n点击此处查看代码图像\n\n\
  ```sharp\nclass Thermostat\n{\n  ...\n  public float CurrentTemperature\n  {\n \
  \   get{return _CurrentTemperature;}\n    set\n    {\n      if (value != CurrentTemperature)\n\
  \      {\n          _CurrentTemperature = value;\n          // 如果有订阅者，\n       \
  \   // 通知它们温度的变化\n          // 通过这些订阅者\n          Action<float> localOnChange =\
  \ OnTemperatureChange;\n          if(localOnChange != null)\n          {\n     \
  \         // 调用订阅者\n              localOnChange(value);\n          }\n      }\n\
  \    }\n  }\n}\n```\n\n\n\n\n```csharp\nprivate float _CurrentTemperature;\n}\n\
  ```\n\n这段代码并没有直接检查 `null`，而是先将 `OnTemperatureChange` 赋值给第二个委托变量 `localOnChange`。这一简单的修改确保了如果在在检查\
  \ `null` 和发送通知之间，（通过另一个线程）移除了所有 `OnTemperatureChange` 订阅者，你也不会抛出 `NullReferenceException`。\n\
  \n在本书的剩余部分中，所有的示例都将依赖 C# 6.0 的空条件运算符来调用委托。\n\n### 指南\n\n-   **务必**在调用委托之前，检查其值是否为\
  \ `null`。\n-   从 C# 6.0 开始，在调用 `Invoke()` 之前**务必**使用空条件运算符。\n\n## 进阶主题：委托的 -= 运算符返回新实例\n\
  \n鉴于委托是引用类型，通过赋值局部变量并使用该局部变量就足以使 `null` 检查线程安全，这可能有些令人惊讶。由于 `localOnChange` 指向的位置与\
  \ `OnTemperatureChange` 相同，你可能认为 `OnTemperatureChange` 的任何变化也会反映在 `localOnChange`\
  \ 中。\n\n事实并非如此，因为实际上，任何对 `OnTemperatureChange -= <listener>` 的调用都不会简单地从 `OnTemperatureChange`\
  \ 中移除一个委托使其比以前少一个。相反，这种调用将分配一个全新的多路委托，而对 `localOnChange` 所指向的原始多路委托产生任何影响。\n\n##\
  \ 进阶主题：线程安全的委托调用\n\n如果可以在不同的线程上向委托添加和移除订阅者，那么（如前所述）在检查 `null` 之前将委托引用到局部变量中是明智的。虽然这种方法防止了调用空委托，但它并不能避免所有的竞争条件。例如，一个线程可以进行复制，然后另一个线程将委托重置为\
  \ `null`，接着原始线程可以调用委托的上一个值，从而通知一个不再订阅者列表中的订阅者。多线程程序中的订阅者应该确保其代码在这种情况下仍然保持健壮；始终可能存在“过时”订阅者被调。\n\
  \n## 委托运算符\n\n为了在 `Thermostat` 示例中合并两个订阅者，你使用了 `+=` 运算符。该运算符获取第一个委托并将第二个委托添加到链中。现在，在第一个委托的方法返回后，将调用第二个委托。要从委托链中移除委托，请使用\
  \ `-=` 运算符，如列表 13.7 所示。\n\n**列表 13.7：使用 += 和 -= 委托运算符**\n\n点击此处查看代码\n\n```csharp\n\
  // ...\n\nThermostat thermostat = new Thermostat();\n\nHeater heater = new Heater(60);\n\
  \nCooler cooler = new Cooler(80);\n\nAction<float> delegate1;\n\nAction<float> delegate2;\n\
  \nAction<float> delegate3;\n\ndelegate1 = heater.OnTemperatureChanged;\n\ndelegate2\
  \ = cooler.OnTemperatureChanged;\n\nConsole.WriteLine(\"Invoke both delegates:\"\
  );\n\ndelegate3 = delegate1;\ndelegate3 += delegate2;\n\ndelegate3(90);\n\nConsole.WriteLine(\"\
  Invoke only delegate2\");\n\ndelegate3 -= delegate1;\n\ndelegate3(30);\n\n// ...\n\
  ```\n\n列表 13.7 的结果的结果出现在输出 13.1 中。\n\n**输出 13.1**\n\nInvoke both delegates:\n\n\
  Heater: Off\n\nCooler: On\n\nInvoke only delegate2\n\nCooler: Off\n\n此外，你也可以使用 `+`\
  \ 和 `–` 运算符来合并委托，如列表 13.8 所示。\n\n**列表 13.8：使用 + 和 - 委托运算符**\n\n点击此处查看代码\n\n```csharp\n\
  // ...\n\nThermostat thermostat = new Thermostat();\n\nHeater heater = new Heater(60);\n\
  \nCooler cooler = new Cooler(80);\n\nAction<float> delegate1;\n\nAction<float> delegate2;\n\
  \nAction<float> delegate3;\n\n// 注意：对于 C# 1.0 语法，使用 new Action (cooler.OnTemperatureChanged)\n\
  \ndelegate1 = heater.OnTemperatureChanged;\n\ndelegate2 = cooler.OnTemperatureChanged;\n\
  \nConsole.WriteLine(\"Combine delegates using + operator:\");\n\ndelegate3 = delegate1\
  \ + delegate2;\n\nConsole.WriteLine(\"Combine delegates using - operator:\");\n\n\
  delegate3 -= delegate1;\n\n// ...\n```\n\n\n\n\n\n当你向多路委托（multicast delegate）添加一个方法时，`MulticastDelegate`\
  \ 类会创建一个委托类型的新实例，将所添加方法的对象引用和方法引用存储在该新的实例中，并将新的委托实例作为下一个项添加到委托实例列表中。实际上，`MulticastDelegate`\
  \ 类维护了一个 `Delegate` 对象的链形表。从概念上讲，你可以将恒温器示例表示为对面页面图 13.2 所示的样式（该图被标记为此高级主题的延续）。\n\
  \n![Image](img/13fig02.jpg)\n\n**图 13.2：链在一起的多路委托**\n\n当调用多路委托时，链表中的每个委托实例按顺序被调用。通常情况下，委托按照它们被添加的顺序进行调用，但\
  \ CLI 规范并没有规定这种行为。此外，它是可以被重写的。因此，程序员不应该依赖于调用顺序。\n\n***\n\n### 错误处理\n\n`Begin 3.0``\n\
  \n错误处理使得顺序通知的感知至关重要。如果一个订阅者抛出异常，链中后续的订阅者将无法接收通知。例如，考虑如果你更改 `Heater` 的 `OnTemperatureChanged()`\
  \ 方法使其抛出异常会发生什么，如列表 13.9 所示。\n\n**列表 13.9：抛出异常的 OnTemperatureChanged()**\n\n点击此处查看代码图像\n\
  \n***\n\n```csharp\nclass Program\n{\n  public static void Main()\n  {\n      Thermostat\
  \ thermostat = new Thermostat();\n      Heater heater = new Heater(60);\n      Cooler\
  \ cooler = new Cooler(80);\n      string temperature;\n      thermostat.OnTemperatureChange\
  \ +=\n          heater.OnTemperatureChanged;\n      // 使用 C# 3.0。如果使用 C# 2.0，请更改匿名方法\n\
  \      thermostat.OnTemperatureChange +=\n              (newTemperature) =>\n  \
  \            {\n              throw new InvalidOperationException();\n         \
  \ };\n      thermostat.OnTemperatureChange +=\n          cooler.OnTemperatureChanged;\n\
  \      Console.Write(\"Enter temperature: \");\n      temperature = Console.ReadLine();\n\
  \      thermostat.CurrentTemperature = int.Parse(temperature);\n  }\n}\n```\n\n\
  ***\n\n图 13.3 显示了一个更新后的序列图。尽管 `cooler` 和 `heater` 订阅了消息，但 lambda 表达式终止了链并阻止了 `cooler`\
  \ 对象接收。\n\n![Image](img/13fig02.jpg)\n\n**图 13.3：带异常的委托调用序列图**\n\n`End 3.0` 为了避免无论之前的订阅者行为如何所有订阅者都能接收通知的问题，你必须遍历订阅者列表并逐个调用它们。列表\
  \ 13.10 显示了`CurrentTemperature`属性的更新。结果出现在输出 13.2 中。\n\n**列表 13.10：来自订阅者的处理**\n\
  点击此处查看代码图像\n\n```csharp\npublic class Thermostat\n{\n  // 定义发布者\n  Action<float>\
  \ OnTemperatureChange;\n  float CurrentTemperature\n  {\n    get { return _CurrentTemperature;\
  \ }\n    set\n    {\n      if (value != CurrentTemperature)\n      {\n        _CurrentTemperature\
  \ = value;\n        Action<float> onTemperatureChange = OnTemperatureChange;\n \
  \       if (onTemperatureChange != null)\n        {\n          List<Exception> exceptionCollection\
  \ = new List<Exception>();\n          foreach (Action<float> handler in onTemperatureChange.GetInvocationList())\n\
  \          {\n            try\n            {\n              handler(value);\n  \
  \          }\n            catch (Exception exception)\n            {\n         \
  \     exceptionCollection.Add(exception);\n            }\n          }\n        \
  \  if (exceptionCollection.Count > 0)\n          {\n            throw new AggregateException(\"\
  订阅者抛出了异常\", exceptionCollection);\n          }\n        }\n      }\n    }\n  }\n\
  \  private float _CurrentTemperature;\n}\n```\n\n#### 方法返回值和引用传递\n\n在另一种情况下，遍历委托调用列表比直接激活通知更有用。这种情况场景涉及不返回\
  \ `void` 或具有 `ref` 或 `out` 参数的委托。\n\n\n\n\n如果你将 `OnTemperatureChange` 改为返回一个枚举值，用指示设备是否是因为温度变化而开启，那么新委托的类型将是\
  \ `Func<float, Status>`，其中 `Status` 是一个包含 `On` 和 `Off` 元素的枚举。所有订阅者方法都必须使用与委托相同的签名，因此每个方法都必须返回一个状态值。此外，由于\
  \ `OnTemperatureChange` 可能对应于一个委托链，因此必须遵循你用于错误处理时使用的相同模式。换句话说，你必须使用 `GetInvocationList()`\
  \ 方法遍历每个委托调用列表，以获取每个单独的返回值。同样，使用 `ref` 和 `out` 参数的委托类型需要特殊考虑。然而，尽管在特殊情况下可以使用这种方法，但准则是尽可能通过返回\
  \ `void` 来完全避免这种场景。\n\n## 事件 (Events)\n\n你在本章中为止所使用的委托存在两个关键问题。为了克服这些问题，C# 使用了 `event`\
  \ 关键字。在本节中，你将看到为什么要使用事件以及它们是如何工作的。\n\n### 为什么使用事件？\n\n本章和上一章已经涵盖了关于委托如何工作所需的所有知识。遗憾的是，委托结构中的脆弱性可能会无意中允许程序员引入\
  \ bug。这些问题涉及封装，而无论是订阅还是发布事件都无法对其充分控制。\n\n### 封装订阅 (Encapsulating the Subscription)\n\
  \n如之前所示，可以使用赋值运算符将一个委托赋值给另一个。遗憾的是，这种能力引入了常见的 bug 来源。考虑 列表 13.11。\n\n**列表 13.11：使用赋值运算符\
  \ = 而不是 +=**\n\n点击此处查看代码图像\n\n```cs\nclass Program\n{\n  public static void Main()\n\
  \  {\n      Thermostat thermostat = new Thermostat();\n      Heater heater = new\
  \ Heater(60);\n      Cooler cooler = new Cooler(80);\n      string temperature;\n\
  \      // 注意：如果 C# 1.0\n      // 使用 new Action (cooler.OnTemperatureChanged)\n \
  \     thermostat.OnTemperatureChange =\n          heater.OnTemperatureChanged;\n\
  \      // 错误：赋值运算符覆盖了\n      // 之前的赋值。\n      thermostat.OnTemperatureChange = \
  \                         \n          cooler.OnTemperatureChanged;             \
  \             \n      Console.Write(\"Enter temperature: \");\n      temperature\
  \ = Console.ReadLine();\n      thermostat.CurrentTemperature = int.Parse(temperature);\n\
  \  }\n}\n```\n\n列表 13.11 与 列表 13.7 几乎相同，区别在于你没有使用 `+=` 运算符，而是使用了简单的赋值运算符。结果是当代码将\
  \ `cooler.OnTemperatureChanged` 赋值给 `OnTemperatureChange` 时，`heater.OnTemperatureChanged`\
  \ 被清除，因为分配了一个全新的链来替换之前的链。在实际上想要使用 `+=` 赋值时误用赋值运算符的可能性非常高，以至于如果在包含类之外的对象不支持赋值运算符会更好。`event`\
  \ 关键字提供了这种额外的封装，使你不会无意中取消其他订阅者。\n\n### 封装发布 (Encapsulating the Publication)\n\n\
  委托和事件之间的第二个重要区别是，事件确保了只有包含类可以触发事件通知。考虑 列表 13.12。\n\n**列表 13.12：在事件容器外部触发事件**\n\n\
  点击此处查看代码图像\n\n```cs\nclass Program\n{\n  public static void Main()\n  {\n      Thermostat\
  \ thermostat = new Thermostat();\n      Heater heater = new Heater(60);\n      Cooler\
  \ cooler = new Cooler(80);\n      string temperature;\n      // 注意：如果 C# 1.0 时。\n\
  \      thermostat.OnTemperatureChange +=\n          heater.OnTemperatureChanged;\n\
  \      thermostat.OnTemperatureChange +=\n          cooler.OnTemperatureChanged;\n\
  \      thermostat.OnTemperatureChange(2);\n  }\n}\n```\n\n在 列表 13.12 中，`Program`\
  \ 能够调用 `OnTemperatureChange` 委托，即使 `thermostat` 上的 `CurrentTemperature` 没有变化。因此，`Program`\
  \ 向所有 `thermostat` 订阅者触发了温度已变化的通知，尽管 `thermostat` 的温度并没有变化。在此之前，委托的问题是封装不足。`Thermostat`\
  \ 应该防止任何其他类调用 `OnTemperatureChange` 委托。\n\n#### 事件 (Declaring an Event)\n\nC# 提供了\
  \ `event` 关键字来处理这两个问题。虽然 `event` 类似于字段修饰符，但它定义了一个新类型的成员（参见 列表 13.13）。\n\n**列表 13.13：在事件编码模式下使用\
  \ event 关键字**\n\n点击此处查看代码图像\n\n```cs\nclass Thermostat\n{\n  public class TemperatureArgs:\
  \ System.EventArgs\n  {\n    public TemperatureArgs( float newTemperature )\n  \
  \  {\n      NewTemperature = newTemperature;\n    }\n    public float NewTemperature\
  \ { get; set; }\n  }\n\n  // 定义事件\n  public event EventHandler<TemperatureArgs>\
  \ OnTemperatureChange;\n\n  public float CurrentTemperature\n  {\n    get { return\
  \ _CurrentTemperature; }\n    set\n    {\n      _CurrentTemperature = value;\n \
  \     OnTemperatureChange?.Invoke(this, new TemperatureArgs(value));\n    }\n  }\n\
  \n  private float _CurrentTemperature;\n}\n```\n\n\n\n\n普通委托（plain delegates）的另一个潜在陷阱是，在调用委托之前，很容易忘记检查其是否为\
  \ `null`（理想情况下在 C# 6.0 代码中使用空条件运算符）。这种遗漏可能会导致意之外的 `NullReferenceException`。幸运的是，`event`\
  \ 关键字提供的封装允许在声明期间（或构造函数内部）提供另一种可能性，如 代码列表 13.13 所示。请注意，在声明事件时，我们分配了 `delegate {\
  \ }` —— 这是一个表示包含零个监听者的空委托。通过分配这个空委托，我们可以在不检查是否有任何监听者的情况下触发事件。（这种行为类似于给变量分配一个元素个数为\
  \ 0 的数组。这样做允许了在不预先检查变量是否为 `null` 的情况下调用数组成员。）当然，如果委托有任何被重新赋值为 `null` 的可能，那么仍然需要进行检查。但是，由于\
  \ `event` 关键字限制赋值只能在类内部发生，因此委托的任何重新赋值都只能发生在类内部。假设永远不会分配 `null`，那么当代码调用委托时，就不需要再次检查\
  \ `null` 了。\n\n### 编码规范\n\n要获得所需的功能，你只需要将原始委托变量声明更改为字段，并添加 `event` 关键字。通过这两处更改，你提供了必要的封装，而所有其他功能保持不变。然而，在\
  \ 代码列表 13.13 的代码中，委托声明发生了额外变化。为了遵循标准的 C# 编码规范，你应该将 `Action<float>` 替换为新的委托类型：`EventHandler<TemperatureArgs>`，这是一个\
  \ CLR 类型，其声明在 代码列表 13.14 中显示（.NET Framework 2.0 新引入）。\n\n**代码列表 13.14：声明泛型委托类型**\n\
  \n点击此处查看代码图片\n\n* * *\n\n```c\npublic delegate void EventHandler<TEventArgs>(object\
  \ sender, TEventArgs e)\n    where TEventArgs : EventArgs;\n```\n\n* * *\n\n结果是，`Action<TEventArgs>`\
  \ 委托类型中的单一温度参数被两个新参数取代了——一个用于发送者，第二个用于事件数据。这种变化并不是 C# 编译器强制执行的，但对于为事件设计的委托，传递这两个类型的两个参数是常规范。\n\
  \n第一个参数 `sender` 包含了调用委托的类实例。如果同一个订阅者方法注册了多个事件，这会尤为有帮助——例如，如果 `heater.OnTemperatureChanged`\
  \ 事件订阅了两个不同的 `Thermostat` 实例。在这种情况下，任何 `Thermostat` 实例都可以触发对 `heater.OnTemperatureChanged`\
  \ 的调用。要确定是哪一个 `Thermostat` 实例触发了事件，你可以在 `Heater.OnTemperatureChanged()` 内部使用 `sender`\
  \ 参数。如果事件是静态的，则此选项将不可用，因此为 `sender` 参数值传递 `null`。\n\n第二个参数 `TEventArgs e` 被指定为类型\
  \ `Thermostat.TemperatureArgs`。关于 `TemperatureArgs` 的重要部分（至少从编码规范的角度来看）是它派生自 `System.EventArgs`。（事实上，在\
  \ .NET Framework 4.5 之前，框架通过泛型约束强制要求派生自 `System.EventArgs`。）`System.EventArgs` 上唯一显著的属性是\
  \ `Empty`，它用于表示没有事件数据。然而，当你从 `System.EventArgs` 派生 `TemperatureArgs` 时，你添加了一个额外的属性\
  \ `NewTemperature`，作为将温度从温控器传递给订阅者的手段。\n\n总结事件的编码规范：第一个参数 `sender` 的类型为 `object`，包含调用委托的对象的引用，如果事件是静态的则为\
  \ `null`。第二个参数的类型为 `System.EventArgs` 或派生自 `System.EventArgs` 的类型，但包含了关于事件的额外数据。你完全像以前一样调用委托，只是多了额外的参数。代码列表\
  \ 13.15 显示了一个示例。\n\n**代码列表 13.15：触发事件通知**\n\n点击此处查看代码图片\n\n* * *\n\n```csharp\n\
  public class Thermostat\n{\n  ...\n  public float CurrentTemperature\n  {\n    get{return\
  \ _CurrentTemperature;}\n    set\n    {\n      if (value != CurrentTemperature)\n\
  \      {\n        _CurrentTemperature = value;\n        // 如果有任何订阅者，\n        //\
  \ 通知它们温度的变化\n      }\n    }\n  }\n}\n```\n\n要确定是哪一个 `Thermostat` 实例触发了事件，你可以在 `Heater.OnTemperatureChanged()`\
  \ 内部使用 `sender` 参数。如果事件是静态的，此选项将不可用，因此为 `sender` 参数值传递 `null`。\n\n第二个参数 `TEventArgs\
  \ e` 被指定为类型 `Thermostat.TemperatureArgs`。关于 `TemperatureArgs` 的重要部分（至少从编码规范的角度来看）是它派生自\
  \ `System.EventArgs`。（事实上，在 .NET Framework 4.5 之前，框架通过泛型约束强制要求派生自 `System.EventArgs`。）`System.EventArgs`\
  \ 上唯一显著的属性是 `Empty`，它用于表示没有事件数据。然而，当你从 `System.EventArgs` 派生 `TemperatureArgs` 时，你添加了一个额外的属性\
  \ `NewTemperature`，作为将温度从温控器传递给订阅者的手段。\n\n总结事件的编码规范：第一个参数 `sender` 的类型为 `object`，包含调用委托的对象的引用，如果事件是静态的则为\
  \ `null`。第二个参数的类型为 `System.EventArgs` 或派生自 `System.EventArgs` 的类型，但包含了关于事件的额外数据。你完全像以前一样调用委托，只是多了额外的参数。\n\
  \n* * *\n\n`sender` 包含了调用委托的类实例。\n\n### 泛型与委托\n\n前面的章节讨论了定义事件的规范是使用类型 `EventHandler<TEventArgs>`。理论上，可以使用任何委托类型，但按照规范，第一个参数\
  \ `sender` 类型为 `object`，第二个参数 `e` 应该是派生自 `System.EventArgs` 的类型。C# 1.0 中委托比较麻烦的一个方面是，当参数发生变化时，你需要声明一个新的委托类型。每次创建派自\
  \ `System.EventArgs`（一种常见的情况）都需要声明使用新 `EventArgs` 类型的委托类型。例如，要在 代码列表 13.15 中的事件通知中使用\
  \ `TemperatureArgs`，则需要声明以 `TemperatureArgs` 为参数的委托类型 `TemperatureChangeHandler`（参见\
  \ 代码列表 13.16）。\n\n**代码列表 13.16：使用自定义委托类型**\n\n点击此处查看代码图片\n\n* * *\n\n```csharp\n\
  public class Thermostat\n{\n  public class TemperatureArgs: System.EventArgs\n \
  \ {\n    public TemperatureArgs( float newTemperature )\n    {\n      NewTemperature\
  \ = newTemperature;\n    }\n    public float NewTemperature\n    {\n      get {\
  \ return _NewTemperature; }\n      set { _NewTemperature = value; }\n    }\n  }\n\
  \  private float _NewTemperature;\n}\n\npublic delegate void TemperatureChangeHandler(object\
  \ sender, TemperatureArgs newTemperature);\n```\n\n* * *\n\n### 规范\n\n- **应当**在调用委托之前检查其值是否为\
  \ `null`。\n- **不要**为非静态事件的 `sender` 传递 `null`，但对于静态事件**应当**传递 `null`。\n- **应当**为事件使用\
  \ `EventHandler<TEventArgs>`。\n- **应当**使用 `System.EventArgs` 或派生自 `System.EventArgs`\
  \ 的类型。\n- **考虑**使用 `System.EventArgs` 的子类，除非你绝对确定事件永远不需要携带数据。\n\n\n\n\n\n```csharp\n\
  public event TemperatureChangeHandler OnTemperatureChange;\n\npublic float CurrentTemperature\n\
  {\n    ...\n}\n\nprivate float _CurrentTemperature;\n}\n```\n\n* * *\n\n虽然通常情况下\
  \ `EventHandler<TEventArgs>` 优于创建如 `TemperatureChangeHandler` 的自定义委托类型，但后者具有一个优势。具体来说，如果使用自定义类型，参数名称可以针对特定事件进行定义。例如，在列表\
  \ 13.16 中，当调用委托来引发事件时，第二个参数名称将显示为 `newTemperature`，而不是简单的 `e`。\n\n另一个可能使用自定义委托类型的原因是关乎在\
  \ C# 2.0 之前定义的 CLR API 部分。鉴于这些部分代表了框架中常见类型中相当大的比例，因此在处理来自 CLR API 的事件时，遇到特定的委托类型而非泛型形式并不罕见。无论如何，在\
  \ C# 2.0 及更高版本中中使用事件的大多数情况下，没有必要声明自定义的委托数据类型。\n\n### 指南\n\n**应该**使用 `System.EventHandler<T>`\
  \ 而不是手动为事件处理程序创建新的委托类型，除非自定义类型的参数名称提供了显著说明。\n\n* * *\n\n## 高级主题：事件内部机制\n\n事件限制了外部类只能通过\
  \ `+=` 运算符向发布者添加订阅方法，然后使用 `-=` 运算符取消订阅。此外，它们还限制了包含类以外的其他类调用事件。为了实现这一点，C# 编译器获取带有\
  \ `event` 关键字修饰的公共委托变量，并将该委托声明为私有。此外，它还添加了几个方法和两个特殊的事件块。本质上，`event` 关键字是 C# 用于生成适当封装逻辑的快捷方式。请考虑列表\
  \ 13.17 中所示事件声明中的示例。\n\n**列表 13.17：声明 OnTemperatureChange 事件**\n\n点击此处查看代码图像\n\n\
  ```csharp\npublic class Thermostat\n{\n  public event EventHandler<TemperatureArgs>\
  \ OnTemperatureChange;\n  ...\n}\n```\n\n当 C# 编译器遇到 `event` 关键字时，它生成的 CIL 代码等同于列表\
  \ 13.18 中所示的 C# 代码。\n\n**列表 13.18：编译器生成的事件 CIL 代码的 C# 概念等价物**\n\n点击此处查看代码图像\n\n\
  ```csharp\npublic class Thermostat\n{\n  // ...\n  // 声明委托字段以保存订阅者列表。\n  private\
  \ EventHandler<TemperatureArgs> _OnTemperatureChange;\n  public void add_OnTemperatureChange(EventHandler<TemperatureArgs>\
  \ handler)\n  {\n    System.Delegate.Combine(_OnTemperatureChange, handler);\n \
  \ }\n  public void remove_OnTemperatureChange(EventHandler<TemperatureArgs> handler)\n\
  \  {\n    System.Delegate.Remove(_OnTemperatureChange, handler);\n  }\n  public\
  \ event EventHandler<TemperatureArgs> OnTemperatureChange\n  {\n    add\n    {\n\
  \      add_OnTemperatureChange(value);\n    }\n    remove\n    {\n      remove_OnTemperatureChange(value);\n\
  \    }\n  }\n}\n```\n\n换句话说，列表 13.17 中所示的代码是（概念上的）编译器用于触发列表 13.18 中代码展开的 C# 简写。（需要“概念上”这一限定符是因为为了说明起见，消除了一些关于线程同步的细节。）\n\
  \nC# 编译器首先获取原始事件定义，并在范围内定义一个私有委托变量。结果是，委托对任何外部类都是不可用的——即使对于派自它的类也是如此。\n\n接下来，C#\
  \ 编译器定义了两个方法 `add_OnTemperatureChange()` 和 `remove_OnTemperatureChange()`，其中 `OnTemperatureChange`\
  \ 后缀取自事件的原始名称。这些方法分别负责 `+=` 和 `-=` 赋值运算符。如列表 13.18 所示，这些方法是使用在本节之前讨论的静态 `System.Delegate.Combine()`\
  \ 和 `System.Delegate.Remove()` 方法实现的。传递给这些方法的第一个参数是私有的 `EventHandler<TemperatureArgs>`\
  \ 委托实例 `OnTemperatureChange`。\n\n从 `event` 关键字生成的代码中最奇特的部分是最后一段。该语法与属性的 getter 和\
  \ setter 方法非常相似，只是方法被命名为 `add` 和 `remove`。`add` 块通过将调用传递给 `add_OnTemperatureChange()`\
  \ 来处理事件上的 `+=` 运算符。同样，`remove` 块运算符通过将调用传递给 `remove_OnTemperatureChange` 来处理 `-=`\
  \ 运算符。\n\n仔细注意此代码与为属性生成的代码之间的相似之处。读者会回想起 C# 中属性的实现是创建 `get_<propertyname>` 和 `set_<propertyname>`，然后将对\
  \ `get` 和 `set` 块的调用传递给这些方法。显然，在这种情况下，事件语法非常相似。\n\n关于生成的 CIL 代码的另一个重要特征是 `event`\
  \ 关键字的 CIL 等效物保留在 CIL 中。换句话说，事件是 CIL 代码显式识别的内容；它不仅仅是 C# 的构造。通过在 CIL 代码中保留等效 `event`\
  \ 关键字，所有语言和编辑器都能提供特殊功能，因为它们可以将事件识别为特殊的类。\n\n## 自定义事件实现\n\n你可以自定义编译器生成的 `+=` 和 `-=`\
  \ 代码。例如，更改 `OnTemperatureChange` 委托的作用范围，使其变为保护的而不是私有的。当然，这将允许派自 `Thermostat` 的类直接访问委托，而不是受到与外部类相同的限制。为了实现这种行为，C#\
  \ 允许使用与列表 13.16 所示相同的语法。换句话说，C# 允许你定义自定义的 `add` 和 `remove` 块，为事件封装的每个方面提供独特的实现。列表\
  \ 13.19 提供了一个示例。\n\n**列表 13.19：自定义 add 和 remove 处理程序**\n\n点击此处查看代码图像\n\n```csharp\n\
  public class Thermostat\n{\n  public class TemperatureArgs: System.EventArgs\n \
  \ {\n    ...\n  }\n  // 定义事件发布者\n}\n```\n\n\n\n\n\n```csharp\npublic event EventHandler<TemperatureArgs>\
  \ OnTemperatureChange\n{\n    add\n    {\n        System.Delegate.Combine(value,\
  \ _OnTemperatureChange);\n    }\n    remove\n    {\n        System.Delegate.Remove(_OnTemperatureChange,\
  \ value);\n    }\n}\n\nprotected EventHandler<TemperatureArgs> _OnTemperatureChange;\n\
  public float CurrentTemperature;\nprivate float _CurrentTemperature;\n```\n\n在这种情况下，存储每个订阅者的委托\
  \ `_OnTemperatureChange` 被更改为 `protected`（保护）。此外，`add` 块的实现反转了委托的顺序，使得最后一个被添加到链中的委托是第一个接收到通知的委托。\n\
  \n### 总结\n既然我们已经描述了事件，但值得一提的是，通常情况下，只有方法引用时是建议在事件上下文之外处理委托的唯一情况。换句话说，考虑到事件的额外功能以及必要时自定义实现的能力，最佳实践始终是使用事件来实现观察者模式。在能够不参考示例代码就从零编写事件之前，可能需要一些练习。然而，事件是后续章节异步、多线程编码的关键基础。\n\
  \n## 14. 带有标准运算符的集合接口\n\nC# 3.0 中添加的最重要特性位于集合领域。扩展方法和 Lambda 表达式为处理集合提供了更优的 API。事实上，在本书的早期版本中，集合章节紧随泛型章节之后，并在委托章节之前。然而，Lambda\
  \ 表达式对集合 API 的影响是巨大的，以至于在不先涵盖（Lambda 表达式的基础）的情况下，已不再可能涵盖集合。现在你已经从上一章中掌握了 Lambda\
  \ 表达式的坚实基础，我们可以深入探讨集合的细节——这是一个跨越三个章节的话题。\n\n首先，本章介绍了匿名类型和集合初始化器——这些我们在“高级”章节中简要介绍过的话题。接下来，本章涵盖了各种集合接口，并探索了它们之间的相互关系。集合接口部分包含了在\
  \ C# 3.0 中添加的 `IEnumerable<T>` 扩展方法，这些方法用于实现标准运算符。集合相关的类和接口分为两类：支持泛型的和不支持泛型的。本章主要讨论泛型集合接口。只有当你编写需要与旧版本运行时进行交互操作的组件时，才应该使用不支持泛型的集合类。这是因为非泛型形式中可用的所有内容都有强类型的泛型替代品。事实上，在\
  \ WinRT 中，非泛型集合已经被移除。\n\n### 匿名类型和隐式局部变量\n\nC# 3.0 显著改进了对处理项目集合的支持。令人惊讶的是，为了支持这种高级\
  \ API，仅进行了不到九项语言增强。然而，这些增强对于 C# 3.0 何何成为语言如此奇妙的改进至关重要。其中两种增强是匿名类型和隐式局部变量。\n\n####\
  \ 匿名类型\n\n匿名类型是由编译器声明的数据类型，而不是通过第 5 章中的显式类定义定义的。与匿名函数一样，当编译器看到匿名类型时，它会完成创建该类的工作，然后让你像显式声明过的那样使用它。列表\
  \ 14.1 显示了这样的声明。\n\n**列表 14.1：带有匿名类型的隐式局部变量**\n\n```csharp\nusing System;\n\nclass\
  \ Program\n{\n    static void Main()\n    {\n        var patent1 = new\n       \
  \ {\n            Title = \"Bifocals\",\n            YearOfPublication = \"1784\"\
  \n        };\n        var patent2 = new\n        {\n            Title = \"Phonograph\"\
  ,\n            YearOfPublication = \"1877\"\n        };\n        var patent3 = new\n\
  \        {\n            Title = patent1.Title, // 重命名为属性命名\n            Year = patent1.YearOfPublication\n\
  \        };\n\n        Console.WriteLine($\"{patent1.Title} ({patent1.YearOfPublication})\"\
  );\n        Console.WriteLine($\"{patent2.Title} ({patent2.YearOfPublication})\"\
  );\n        Console.WriteLine();\n        Console.WriteLine(patent1);\n        Console.WriteLine(patent2);\n\
  \        Console.WriteLine();\n        Console.WriteLine(patent3);\n    }\n}\n```\n\
  \n对应的输出在输出 14.1 中。\n\n**输出 14.1**\n\n```\nBifocals (1784)\nPhonograph (1877)\n{\
  \ Title = Bifocals, YearOfPublication = 1784 }\n{ Title = Phonograph, YearOfPublication\
  \ = 1877 }\n{ Title = Bifocals, Year = 1784 }\n```\n\n匿名类型纯粹是 C# 的特性，而不是运行时中的一种新类型。当编译器遇到匿名类型语法时，它会生成一个\
  \ CIL 类，其属性与匿名类型声明中的命名值和数据类型相对应。\n\n\n\n\n因为匿名类型根据定义没有名称，因此无法将局部变量显式地声明为匿名类型。相反，局部变量的类型被替换为\
  \ `var`。然而，这绝不意味着隐式类型变量是无类型的。相反，它们被完整地类型化为其所赋值的值的数据类型。如果给隐式类型变量赋值一个匿名类型，则该局部变量声明的底层\
  \ CIL 代码将是编译器生成的类型。同样，如果给隐式类型变量赋值一个 `string`，则它在底层 CIL 中的数据类型将是 `string`。事实上，对于赋值值不是匿名类型（例如\
  \ `string`）的隐式类型变量，它们与声明为类型 `string` 的变量相比，其最终生成的 CIL 代码是没有区别的。如果声明语句是 `string text\
  \ = \"This is a test of the...\"`，则生成的 CIL 代码将与隐式类型声明 `var text = \"This is a test\
  \ of the...\"` 相同。编译器从所赋值的表达式中确定隐式类型变量的数据类型。在带有初始化器的显式类型局部变量（例如 `string s = \"hello\"\
  ;`）中，编译器首先根据左侧的声明类型确定 `s` 的类型，然后分析右侧并验证右侧表达式是否可以赋值给该类型。在隐式类型局部变量中，这个过程在某种程度上是反向的。首先分析右侧以确定其类型，然后逻辑上将“var”替换为该类型。\n\
  \n尽管 C# 没有为匿名类型命名，但它仍然是强类型的。例如，该类型的属性是完全可用的。在列表 14.1 中，`patent1.Title` 和 `patent2.YearOfPublication`\
  \ 在 `Console.WriteLine` 语句中被调用。任何调用不存在成员的尝试都会导致编译器错误。即使是 Visual Studio 等 IDE 中的\
  \ IntelliSense 也能在匿名类型上工作。\n\n你应该谨慎地使用隐式类型变量声明。显然，对于匿名类型，无法指定数据类型，并且必须使用 `var`。然而，对于数据类型不是匿名类型的情况，使用显式数据类型通常更优。与通常情况一样，你应该专注于提高代码语义的可读性，同时利用编译器来验证生成的变量是否是你预期的类型。要通过隐式类型局部变量实现这一点，仅当赋值给隐式类型变量的类型完全而易见时才使用它们。例如，在\
  \ `var items = new Dictionary<string, List<Account>>();` 中，生成的代码更简洁、易读。相比之下，当类型不明显时（例如赋值一个方法的返回值时），开发者应该倾向于使用显式变量类型声明，如下：\n\
  \n点击此处查看代码图像\n\n```\nDictionary<string, List<Account>> dictionary = GetAccounts();\n\
  ```\n\n* * *\n\n### Note\n\n隐式类型变量通常应该留给匿名类型声明，而不是在编译时已知数据类型的情况下随意使用，除非赋值给变量的类型完全而易见。\n\
  \n* * *\n\n* * *\n\n### 语言对比：C++/Visual Basic/JavaScript—void*, Variant 和 var\n\n\
  隐式类型变量并不等同于 C++ 中的 `void*`、Visual Basic 中的 `Variant` 或 JavaScript 中的 `var`。在这些情况下，变量声明的限制性都不大，因为变量可以被赋值为任何类型，就像你在\
  \ C# 中声明一个类型为 `object` 的变量一样。相比之下，`var` 是由编译器确定类型的；一旦在声明时确定，类型可能无法更改，且类型检查和成员调用会在编译时进行验证。\n\
  \n* * *\n\n#### 关于匿名类型和隐式局部变量的信息\n\n在列表 14.1 中，匿名类型的成员名称通过为 `patent1` 和 `patent2`\
  \ 赋值值来显式识别（例如 `Title = \"Phonograph\"`）。然而，如果赋值的值是属性或字段调用，则名称可能默认为该字段或属性的名称，而不是显式指定值。例如，`patent3`\
  \ 使用一个名为“Title”的属性定义，而不是赋值给显式名称。如输出 14.1 所示，生成的属性名由编译器确定，与获取值来源的属性匹配。\n\n`patent1`\
  \ 和 `patent2` 具有相同的属性名和相同的数据类型。因此，C# 编译器为这两个匿名声明仅生成一种数据类型。然而，`patent3` 强制编译器创建第二个匿名类型，因为专利年份的属性名与\
  \ `patent1` 和 `patent2` 中的不同。此外，如果交换了 `patent1` 和 `patent2` 之间的属性顺序，这两个匿名类型也将不具有类型兼容性。句话说，两个匿名类型在同一程序集内类型兼容的要求是：属性名、数据类型和属性顺序必须匹配。如果满足这些标准，即使它们出现在不同的方法或类中，这些类型也是兼容的。列表\
  \ 14.2 演示了这些类型不兼容的情况。\n\n**列表 14.2：匿名类型的类型安全与不可变性**\n\n点击此处查看代码图像\n\n* * *\n\n```\n\
  class Program\n\n{\n    static void Main()\n    {\n        var patent1 =\n     \
  \       new\n            {\n                Title = \"Bifocals\",\n            \
  \    YearOfPublication = \"1784\"\n            };\n\n        var patent2 =\n   \
  \         new\n            {\n                Title = \"Phonograph\",\n        \
  \        YearOfPublication = \"1877\"\n            };\n\n        var patent3 =\n\
  \            new\n            {\n                Title = \"Phonograph\",\n     \
  \           YearOfPublication = \"1877\"\n            };\n\n        patent1 = patent2;\n\
  \        patent1 = patent3;\n        patent1.Title = \"Swiss Cheese\";\n    }\n\
  }\n```\n\n\n\n\n尽管 C# 允许如 列表 14.1 所示的匿名类型，但通常不建议你以这种方式定义它们。匿名类型提供了关键的功能，通过 C# 3.0\
  \ 对投影的支持（例如集合的连接/关联），正如我们将在本章节稍后部分讨论的那样。然而，通常情况下，你应该将匿名类型的定义保留在需要它们的情况下，例如从多个类型中聚合数据。\n\
  \n## 高级主题：匿名类型的生成\n\n尽管 `Console.WriteLine()` 的实现是调用 `ToString()`，但请注意 列表 14.1 中\
  \ `Console.WriteLine()` 的输出并不是默认的 `ToString()`（默认 `ToString()` 会写出完全限定的数据类型名称）。相反，输出是一组\
  \ `PropertyName = value` 对列表，匿名类型上的每个属性对应一个对。这是因为编译器在匿名类型的代码生成中重写了 `ToString()`，以便按所示方式格式化\
  \ `ToString()` 输出。同样，生成的类型还包含对 `Equals()` 和 `GetHashCode()` 的重写实现。\n\n`ToString()`\
  \ 本身的实现是导致属性顺序变化引起生成新数据类型的重要原因。如果将两个独立的匿名类型（可能在完全不同的类型甚至命名空间中）合并，然后更改属性的顺序，那么其中一个实现中属性顺序的变化将对另一个实现的\
  \ `ToString()` 结果产生显著且可能不可接受的影响。此外，在执行期间，可以对类型进行反射并检查类型上的成员——甚至可以动态地调用这些成员之一（在运行时决定调用哪一个成员）。两个看似相同的类型中，成员顺序的差异可能会触发意料之外的的结果。为了避免这个问题，C#\
  \ 的设计者们决定生成两个不同的类型。\n\n## 集合初始化器\n\nC# 3.0 版本中添加的另一个特性是集合初始化器。集合初始化器允许程序员在实例化时以类似于数组声明的方式构造一个具有初始成员\
  \ set 的集合。在集合初始化器可用之前，必须在实例化集合后显式地将元素添加到集合中——使用诸如 `System.Collections.Generic.ICollection<T>`\
  \ 的 `Add()` 方法。通过集合初始化，`Add()` 调用是由 C# 编译器生成的，而不是由开发者显式编码的。列表 14.3 展示了如何使用集合初始化器初始化集合。\n\
  \n**列表 14.3: 集合初始化**\n\n点击此处查看代码图像\n\n```csharp\nusing System;\n\nusing System.Collections.Generic;\n\
  class Program\n{\n  static void Main()\n  {\n      List<string> sevenWorldBlunders;\n\
  \      sevenWorldBlunders = new List<string>()\n      {\n          // 引用甘地的名言\n\
  \          \"Wealth without work\",\n          \"Pleasure without conscience\",\n\
  \          \"Knowledge without character\",\n          \"Commerce without morality\"\
  ,\n          \"Science without humanity\",\n          \"Worship without sacrifice\"\
  ,\n          \"Politics without principle\"\n      };\n      Print(sevenWorldBlunders);\n\
  \  }\n\n  private static void Print<T>(IEnumerable<T> items)\n  {\n      foreach\
  \ (T item in items)\n      {\n          Console.WriteLine(item);\n      }\n  }\n\
  }\n```\n\n这种语法不仅与数组初始化相似，而且与在构造函数后带有大括号的对象初始化器相似。如果构造函数中没有传递参数，则数据类型后面的括号是可选的（就像对象初始化器一样）。\n\
  \n### 开始 6.0\n\n集合初始化器要成功编译，需要一些基本要求。理想情况下，应用集合初始化器的集合类型应该是某种实现了 `System.Collections.Generic.ICollection<T>`\
  \ 的类型。这确保了集合包含一个编译器生成的代码可以调用的 `Add()` 方法。然而，也存在一个宽松的要求，它仅要求存在一个或多个 `Add()` 方法，这些方法作为扩展方法（C#\
  \ 6.0）或作为实现 `IEnumerable<T>` 的类型的实例方法存在——即使该集合没有实现 `ICollection<T>`。`Add()` 方法需要接受与集合初始化器中指定的值兼容的参数。对于字典，集合初始化器稍微复杂一些，因为字典中的每个元素都需要键和值。这种语法在\
  \ 列表 14.4 中所示。\n\n**列表 14.4: 初始化类型数组**\n\n点击此处查看代码图像\n\n```csharp\nusing System;\n\
  using System.Collections.Generic;\n#if !PRESHARP6\n// C# 6.0 或后续\nDictionary<string,\
  \ Color> colorMap = new Dictionary<string, Color>\n{\n    [\"Error\"] = Color.Red,\n\
  \    [\"Warning\"] = Color.Yellow,\n    [\"Information\"] = Color.Green,\n    [\"\
  Verbose\"] = Color.White\n};\n#else\n// C# 6.0 之前\nDictionary<string, Color> colorMap\
  \ = new Dictionary<string, Color>\n{\n    { \"Error\", Color.Red },\n    { \"Warning\"\
  , Color.Yellow },\n    { \"Information\", Color.Green },\n    { \"Verbose\", Color.White\
  \ }\n};\n#endif\n```\n\n此列表实际上包含了两个不同的初始化版本。第一个演示了 C# 6.0 引入的新语法，通过允许赋值运算符来表达哪个值关联到键。第二种语法（在\
  \ C# 6.0 或后续仍然有效）使用大括号将名称和值配对。\n\n### 结束 6.0\n\n对于不支持 `ICollection<T>` 的集合允许初始化器是非常重要的，原因有两个。首先，大多数集合（实现\
  \ `IEnumerable<T>` 的类型）都没有实现 `ICollection<T>`，这显著减少了集合初始化器的用处。其次，匹配方法名和签名允许初始化到集合中的具有更大的多样性。例如，初始化器现在可以支持\
  \ `new DataStore(){ a, {b, c}}`，只要存在与参数 `a` 兼容的 `Add()` 方法和一个与 `b, c` 兼容的 `Add()`\
  \ 方法。\n\n注意，你不能为匿名类型拥有集合初始化器，因为集合初始化器需要调用构造函数，而构造函数无法命名。解决方法是定义一个如 `static List<T>\
  \ CreateList<T>(T t) { return new List<T>(); }` 的方法。方法类型推断允许类型参数隐含，因此这种解决方法成功允许创建匿名类型的集合。\n\
  \n初始化匿名类型的另一种方法是使用数组初始化。由于无法在构造函数中指定数据类型，数组初始化语法允许使用 `new[]` 进行匿名数组初始化（参见 列表 14.5）。\n\
  \n**列表 14.5: 初始化类型数组**\n\n点击此处查看代码图像\n\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
  using System.Linq;\nclass Program\n{\n  static void Main()\n  {\n      var worldCup2006Finalists\
  \ = new[]\n      {\n          new\n          {\n              TeamName = \"France\"\
  ,\n              Players = new string[]\n          }\n      };\n  }\n}\n```\n\n\n\
  \n\n\n```csharp\n{\n    {\n        \"Fabien Barthez\", \"Gregory Coupet\",\n   \
  \     \"Mickael Landreau\", \"Eric Abidal\",\n        // ...\n    }\n},\nnew\n{\n\
  \    TeamName = \"Italy\",\n    Players = new string[]\n    {\n        \"Gianluigi\
  \ Buffon\", \"Angelo Peruzzi\",\n        \"Marco Amelia\", \"Cristian Zaccardo\"\
  ,\n        // ...\n    }\n}\n};\n\nPrint(worldCup2006Finalists);\n\n}\n\nprivate\
  \ static void Print<T>(IEnumerable<T> items)\n{\n    foreach (T item in items)\n\
  \    {\n        Console.WriteLine(item);\n    }\n}\n```\n\n* * * 结果变量是匿名类型 `items`\
  \ 的数组，由于它是数组，因此必须是同质的。\n\n`End 3.0`\n\n### 使类成为集合的要素：IEnumerable<T>\n\n根据定义，`.NET`\
  \ 中的集合是指至少实现了 `IEnumerable<T>`（或非泛型类型 `IEnumerable`）的类。这个接口至关重要，因为实现 `IEnumerable<T>`\
  \ 的方法是支持迭代集合的最小需求。\n\n`Chapter 3` 展示了如何使用 `foreach` 语句来遍历元素数组。这种语法非常简单，并且避免了必须知道元素数量的复杂性。然而，运行时并不直接支持\
  \ `foreach` 语句。相反，C# 编译器会按照本节所述对代码进行转换。\n\n#### 用于数组的 foreach\n\n`Listing 14.6`\
  \ 展示了一个简单的 `foreach` 循环，它遍历一个整数数组，并将每个整数打印到控制台。\n\n**列表 14.6：用于数组的 foreach**\n\n\
  [点击此处查看代码图像]\n\n* * *\n\n```csharp\nint[] array = new int[]{1, 2, 3, 4, 5, 6};\n\
  \nforeach (int item in array)\n{\n    Console.WriteLine(item);\n}\n```\n\n* * *\
  \ 从这段代码中，C# 编译器创建了 `for` 循环的 CIL 等效实现，如 `Listing 14.7` 所示。\n\n**列表 14.7：用于数组的 foreach\
  \ 的编译后实现**\n\n[点击此处查看代码图像]\n\n* * *\n\n```csharp\nint[] tempArray;\nint[] array\
  \ = new int[]{1, 2, 3, 4, 5, 6};\n\ntempArray = array;\n\nfor (int counter = 0;\
  \ (counter < tempArray.Length); counter++)\n{\n  int item = tempArray[counter];\n\
  \  Console.WriteLine(item);\n}\n```\n\n* * * 在此示例中，注意 `foreach` 依赖于对 `Length` 属性和索引运算符（`[]`）的支持。通过\
  \ `Length` 属性，C# 编译器可以使用 `for` 语句遍历每个元素。\n\n#### 用于 IEnumerable<T> 的 foreach\n\n\
  尽管 `Listing 14.7` 显示的代码在长度固定且支持索引运算符的数组上运行良好，但并不是所有类型的集合都有知的元素数量。此外，包括 `Stack<T>`、`Queue<T>`\
  \ 和 `Dictionary<key, value>` 在内的许多集合类不支持通过索引检索元素。因此，需要更通用的集合迭代方法。迭代器模式提供了这种能力。假设你可以确定第一个、下一个和最后一个元素，那么知道计数和支持元素检索就是多余的。`System.Collections.Generic.IEnumerator<T>`\
  \ 和非泛型的 `System.Collections.IEnumerator` 接口（见 `Listing 14.9`）设计用于启用迭代模式来遍历集合，而不是\
  \ `Listing 14.7` 所示的长度-索引模式。它们关系的类图出现在 `Figure 14.1`。\n\n**图 14.1：IEnumerator<T>\
  \ 和接口的类图**\n\n`IEnumerator<T>` 继承自 `IEnumerator`，包含三个成员。第一个是 `MoveNext()`。使用该方法你可以从一个元素移动到下一个，同时检测何时枚举完所有项目。第二个成员是名为\
  \ `Current` 的只读属性，返回当前处理的元素。`Current` 在 `IEnumerator<T>` 中被重载。通过集合类上的这两个成员，可以仅使用\
  \ `while` 循环遍历集合，如 `Listing 14.8` 所示。`Reset()` 方法通常抛出 `NotImplementedException`，因此永远不应该被调用。如果你需要重新枚举，只需创建一个新的枚举器即可。\n\
  \n**列表 14.8：使用 while 遍历集合**\n\n[点击此处查看代码图像]\n\n* * *\n\n```csharp\nSystem.Collections.Generic.Stack<int>\
  \ stack = new System.Collections.Generic.Stack<int>();\nint number;\n// ...\n//\
  \ 此代码是概念性的，不是实际代码。\nwhile (stack.MoveNext())\n{\n  number = stack.Current;\n  Console.WriteLine(number);\n\
  }\n```\n\n* * * 在 `Listing 14.8` 中，`MoveNext()` 在移动到末尾时返回 `false`。这取代了在循环时计算元素的需求。`Listing\
  \ 14.8` 使用 `System.Collections.Generic.Stack<T>` 作为集合类型。存在许多其他集合类型；这只是一个例子。`Stack<T>`\
  \ 的关键特征是它设计为“后进先出”（LIFO）集合。注意类型参数 `T` 标识集合中所有元素的类型。泛型集合的关键特征是收集集合中的特定类型对象。程序员在添加、删除或访问集合项时必须知道集合的数据类型。之前的示例展示了\
  \ C# 编译器的概要，但它实际上并不是那样编译的，因为它省略了两个重要的细节：交织和错误处理。\n\n##### 状态共享\n\n`Listing 14.8`\
  \ 这种实现的问题在于，如果两个这样的循环交织在一起（一个 `foreach` 在另一个内部，且都使用同一个集合），集合必须维护一个当前元素的状态指示器，以便在调用\
  \ `MoveNext()` 时确定下一个元素。在这种情况下，一个交织的循环会影响另一个。对于多个线程执行的循环也是如此。\n\n为了解决这个问题，集合类不直接支持\
  \ `IEnumerator<T>` 和 `IEnumerator` 接口。如 `Figure 14.1` 所示，有一个第二个接口 `IEnumerable<T>`，其唯一的方法是\
  \ `GetEnumerator()`。该方法的目的是返回一个支持 `IEnumerator<T>` 的对象。状态由集合类维护，另一个类（通常是嵌套类，以便它可以访问集合的内部结构）将支持\
  \ `IEnumerator<T>` 接口并保留迭代循环的状态。枚举器就像序列中的“光标”或“书签”。你可以拥有多个书签，并在移动其中每一个时独立于其他来遍历集合。使用这种模式，`foreach`\
  \ 循环的 C# 等效代码将看起来像 `Listing 14.9` 所示的代码。\n\n**列表 14.9：迭代期间维护状态的独立枚举器**\n\n[点击此处查看代码图像]\n\
  \n* * *\n\n```csharp\nSystem.Collections.Generic.Stack<int> stack = new System.Collections.Generic.Stack<int>();\n\
  int number;\nSystem.Collections.Generic.Stack<int>.Enumerator enumerator;\n// ...\n\
  // 如果显式实现了 IEnumerable<T>，\n// 则需要进行强制转换。\n// ((IEnumerable<int>)stack.GetEnumerator();\n\
  enumerator = stack.GetEnumerator();\nwhile (enumerator.MoveNext())\n{\n  number\
  \ = enumerator.Current;\n  Console.WriteLine(number);\n}\n```\n\n* * *\n\n\n\n\n\
  \n# 高级主题：迭代后的清理工作\n\n由于实现 `IEnumerator<T>` 接口的类维护状态，有时你需要在退出循环后清理状态（因为所有迭代已完成，或者抛出了异常）。为了实现这一点，`IEnumerator<T>`\
  \ 接口继承自 `IDisposable`。实现 `IEnumerator` 的枚举器并不一定实现 `IDisposable`，但如果它们实现了，则也会调用 `Dispose()`。这使得程序能够在\
  \ `foreach` 循环退出后调用 `Dispose()`。因此，C# 等价的最终 CIL 代码看起来所示 列表 14.10。\n\n## 列表 14.10：集合上\
  \ foreach 的编译结果\n\n点击此处查看代码图像\n\n```csharp\nSystem.Collections.Generic.Stack<int>\
  \ stack =  new System.Collections.Generic.Stack<int>();\nSystem.Collections.Generic.Stack<int>.Enumerator\
  \ enumerator;\nIDisposable disposable;\nenumerator = stack.GetEnumerator();\ntry\n\
  {\n  int number;\n  while (enumerator.MoveNext())\n  {\n      number = enumerator.Current;\n\
  \      Console.WriteLine(number);\n  }\n}\nfinally\n{\n  // 用于 IEnumerator<T> 的显式类型转换\n\
  \  disposable = (IDisposable) enumerator;\n  disposable.Dispose();\n  // 除非编译时已知\
  \ IDisposable 支持\n  // 否则 IEnumerator 将使用 as 运算符\n  // disposable = (enumerator\
  \ as IDisposable);\n  // if (disposable != null)\n  // {\n  //      disposable.Dispose();\n\
  \  // }\n}\n```\n\n注意，由于 `IEnumerator<T>` 支持 `IDisposable` 接口，`using`语句可以将列表 14.10\
  \ 中的代码简化为列表 14.11 所示。\n\n## 列表 14.11：使用 using 进行错误处理和资源清理\n\n点击此处查看代码图像\n\n```csharp\n\
  System.Collections.Generic.Stack<int> stack =  new System.Collections.Generic.Stack<int>();\n\
  int number;\nusing(  System.Collections.Generic.Stack<int>.Enumerator        enumerator\
  \ = stack.GetEnumerator())             \n{\n  while (enumerator.MoveNext())\n  {\n\
  \    number = enumerator.Current;\n    Console.WriteLine(number);\n  }\n}\n```\n\
  \n然而，请记住 CIL 不直接支持 `using` 关键字。因此，列表 14.10 中的代码实际上是 `foreach` CIL 代码更准确的 C# 表示。\n\
  \n# 高级主题：没有 IEnumerable 的 foreach\n\nC# 并不要求在使用 `foreach` 遍历数据类型时实现 `IEnumerable`/`IEnumerable<T>`。相反，编译器使用了一种名为“鸭子类型”（duck\
  \ typing）的概念；它寻找一个返回具有 `Current` 属性和 `MoveNext()` 方法类型的 `GetEnumerator()` 方法。鸭子类型涉及通过名称搜索，而不是依赖接口或对方法的显式调用。（“鸭子类型”这一名称源于一个奇特的想法：要被视为一只鸭子，该对象只需实现\
  \ `Quack()` 方法即可；而不需要实现 `IDuck` 接口。）如果鸭子类型未能找到枚举模式的合适实现，编译器会检查集合是否实现了相应的接口。\n\n\
  ## 在 foreach 迭代期间不要修改集合\n\n第 3 章显示编译器防止对 `foreach` 变量（`number`）进行赋值。如列表 14.10 所示，对\
  \ `number` 的赋值不会改变集合元素本身的更改，因此 C# 编译器完全阻止了此类赋值。\n\n此外，在 `foreach` 循环执行期间，通常集合内的元素计数或项目本身都无法被修改。例如，如果你在\
  \ `foreach` 循环内部调用了 `stack.Push(42)`，那么 `iterator` 应该忽略还是包含对 `stack` 的更改将变得歧义——也就是说，`iterator`\
  \ 应该遍历新添加的项，还是忽略它并假设与实例化时处于相同状态。\n\n由于这种歧义，如果在 `foreach` 循环内修改了集合，访问枚举器时通常会抛出 `System.InvalidOperationException`\
  \ 类型的异常，报告集合在枚举器实例化后被修改。\n\n## 标准查询运算符\n\n`开始 3.0`\n\n除了 `System.Object` 上的方法，任何实现\
  \ `IEnumerable<T>` 的类型只需要实现另一个方法，即 `GetEnumerator()`。然而，这样做为所有实现 `IEnumerable<T>`\
  \ 的类型提供了 50 多个方法（不包括任何重载），而且这在不需要显式实现 `GetEnumerator()` 方法以外的情况下实现的。额外的功能通过 C# 3.0\
  \ 的扩展方法提供，并存在 `System.Linq.Enumerable` 类中。因此，只需包含 `System.Linq` 声明式引用即可使这些方法可用。`IEnumerable<T>`\
  \ 上的每个方法都是标准运算符；它为其所操作的集合提供了查询能力。在接下来的章节中，我们将检查一些最突出的查询运算符。许多运算符依赖于 `Inventor` 和\
  \ `Patent` 类，它们都定义在列表 14.12。\n\n## 列表 14.12：用于标准运算符的示例类\n\n点击此处查看代码图像\n\n```csharp\n\
