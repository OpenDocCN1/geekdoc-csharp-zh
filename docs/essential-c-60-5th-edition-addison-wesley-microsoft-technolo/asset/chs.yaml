  \ 和 `SelectMany()` 之间的区别在于 `Select()` 会返回两个项，每个项对应原始集合中的一个项。`Select()` 可能会对原始类型投影转换，但项的数量不会改变。例如，`teams.Select(team\
  \ => team.Players)` 将返回一个 `IEnumerable<string[]>`。\n\n相比之下，`SelectMany()` 会遍历 Lambda\
  \ 表达式识别的每个项（之前由 `Select()` 选出的数组），并将每个项提取到一个新的集合，该集合包含了子集合中所有项的并集。`SelectMany()`\
  \ 不再产生两个玩家数组，而是合并每个选中的数组并生成一个包含所有项的单一集合。\n\n### 更多标准查询操作符\n\n列表 14.28 显示了使用由 `Enumerable`\
  \ 启用的一些简单 API 代码；输出 14.13 显示了结果。\n\n**列表 14.28：更多 System.Linq.Enumerable 方法调用**\n\
  \n点击此处查看代码图像\n\n```sharp\nusing System;\n\nusing System.Collections.Generic;\nusing\
