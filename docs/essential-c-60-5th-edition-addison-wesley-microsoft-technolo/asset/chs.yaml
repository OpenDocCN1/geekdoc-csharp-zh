  \ 的文件，则将创建一个新文件；如果文件已存在，则将会被覆盖。接下来，你创建一个 `StreamWriter` 类。`StreamWriter` 类负责将文本写入\
  \ `FileStream`。你使用 `WriteLine()` 方法写入数据，就像向控制台写入一样。\n\n**列表 5.13：将数据持久化到文件**\n\n\
  点击此处查看代码图像\n\n```csharp\nusing System;\n// IO 命名空间\nusing System.IO;\n\nclass DataStorage\n\
