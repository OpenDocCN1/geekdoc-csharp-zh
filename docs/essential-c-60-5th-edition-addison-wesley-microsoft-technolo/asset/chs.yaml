  ```\n\n输出 3.5 显示了列表 3.6 的结果。\n\n**输出 3.5**\n\n3\n\n### 特殊的浮点特性\n\n二进制浮点类型 `float`\
  \ 和 `double` 具有一些特殊特性，例如它们处理精度的方式。本节将介绍一些具体的示例，以及一些独特的浮点类型特性。\n\n一个 `float` 具有七位小数的精度，可以存储值\
  \ 1,234,567 和值 0.1234567。然而，如果你将这两个 `float` 相加，结果将被四舍入为 1234567，因为精确结果所需的精度超过了 `float`\
  \ 能够存储的七位有效数字。舍入到七位引入的误差与计算出的值相比可能会变得很大，特别是在重复计算时。（另参见本节稍后的高级主题“浮浮点类型中的意外不等式”。）\n\
  \n在内部，二进制浮点类型实际上存储的是二进制分数，而不是十进制分数。因此，简单的赋值（例如 `double number = 140.6F`）可能会出现“表征误差”导致的不准确。140.6\
  \ 的精确值是分数 703/5，但该分数的分母不是 2 的幂，因此无法用二进制浮点数精确表示。实际表示的值是分母为 2 的幂且能放入 `float` 的 16\
  \ 位中的最接近分数。\n\n由于 `double` 能够存储比 `float` 更准确的数值，C# 编译器实际上会将此表达式求值为 `double number\
  \ = 140.600006103516`，因为 `140.600006103516` 是 `float` 类型中最接近 140.6 的分数。当该分数被表示为\
  \ `double` 时，它略大于 140.6。\n\n### 指南\n\n在需要精确度时，**避免**使用二进制浮点类型进行相等性判断。\n\n#### 浮点类型中的意外不等式\n\
  \n由于浮点类型会被舍入，使用相等性判断可能会产生困惑。列表 3.7。\n\n```javascript\n\"The original Tacoma Bridge\
  \ in Washington\\nwas \"\n  + \"brought down by a \"\n  + windSpeed + \" mile/hour\
  \ wind.\");\n}\n}\n```\n\n点击此处查看代码图像\n\n```javascript\nfloat number1 = 0.1F;\nfloat\
  \ number2 = 0.2F;\nif (number1 + number2 == 0.3F)\nConsole.WriteLine(\"number1 +\
  \ number2 is 0.3\");\nelse\nConsole.WriteLine(\"number1 + number2 is not 0.3\");\n\
  ```\n\n\n\n\n\n# 列表 3.8：将浮点数除以零，并显示 NaN\n\n```cpp\nfloat n=0f;\n\n// 显示: NaN\n\n\
  System.Console.WriteLine(n / 0);\n```\n\n### 输出 3.7\nNaN\n\n在数学中，某些数学运算是未定义的，包括零除以其本身。在\
  \ C# 中，将 `float` 类型的 0 除以 0 的结果将得到一个特殊的“非数字”（Not a Number）值；所有尝试打印此类数字输出的尝试都将导致\
  \ `NaN`。同样，使用 `System.Math.Sqrt(-1)` 对负数开平方根将导致 `NaN`。\n\n浮点数也可能溢出其界限。例如，`float`\
  \ 类型的上限约为 `3.4 × 10³⁸`。如果该数字溢出了该界限，结果将存储为“正无穷”，打印该数字的输出将为 `Infinity`。同样，`float`\
  \ 类型的下限为 –3.4 × 10³⁸`，计算低于该界限的值将导致“负无穷”，它将由字符串 `-Infinity` 表示。列表 3.9 分别产生正无穷和负无穷，输出\
  \ 3.8 显示了结果。\n\n# 列表 3.9：溢出 float 的范围\n点击此处查看代码图像\n\n```cpp\n// 显示: -Infinity\n\n\
  System.Console.WriteLine(-1f / 0);\n\n// 显示: Infinity\n\nSystem.Console.WriteLine(3.402823E+38f\
  \ * 2f);\n```\n\n### 输出 3.8\n-Infinity\nInfinity\n\n进一步检查浮点数可以发现，它可以包含非常接近零的值，而实际上并不包含零。如果该值超过了\
  \ `float` 或 `double` 类型的下限阈值，根据数字是负是正，该数字的值可以表示为“负零”或“正零”，并在输出中表示为 `-0` 或 `0`。\n\
  \n## 复合赋值运算符 (+=, -=, *=, /=, %)\n\n第 1 章 讨论了简单的赋值运算符，它将运算符右侧的值赋给左侧的变量。复合赋值运算符将常见的二元运算符计算与赋值运算符结合。例如，考虑列表\
  \ 3.10。\n\n### 列表 3.10：常见的递加计算\n```cpp\nint x = 123;\n\nx = x + 2;\n```\n\n在这次赋值中，你首先计算\
  \ `x + 2` 的值，然后将计算出的值赋回 `x`。由于这种操作执行频率频繁，因此存在一种赋值运算符来用一个运算符处理计算和赋值。`+=` 运算符根据运算符右侧的值对运算符左侧的变量进行递增，如列表\
  \ 3.11 所示。\n\n### 列表 3.11：使用 += 运算符\n```cpp\nint x = 123;\n\nx += 2;\n```\n\n因此，这段代码等同于列表\
  \ 3.10。\n\n存在许多其他“复合赋值”运算符来提供类似的功能。你也可以将赋值运算符与减法、乘法、除法和取模运算符一起（如列表 3.12 所示）。\n\n\
  ### 列表 3.12：其他赋值运算符示例\n```cpp\nx -= 2;\n\nx /= 2;\n\nx *= 2;\n\nx %= 2;\n```\n\n\
  ## 递减运算符 (++, --)\n\nC# 包含了特殊的单元运算符用于对计数器进行递减。递增运算符 `++` 每次使用时会将变量加一。换句话说，列表 3.13\
  \ 所示的所有代码行都是等价的。\n\n### 列表 3.13：递增运算符\n```cpp\nspaceCount = spaceCount + 1;\n\n\
  spaceCount += 1;\n\nspaceCount++;\n```\n\n同样，你可以使用递减运算符 `--` 将变量减一。因此，列表 3.14 所示的所有代码行也是等价的。\n\
  \n### 列表 3.14：递减运算符\n```cpp\nlines = lines - 1;\n\nlines -= 1;\n\nlines--;\n```\n\
  \n### 初学者主题：循环中的递减示例\n\n递增和递减运算符在循环中特别常见，例如在本章后面描述的 `while` 循环。例如，列表 3.15 使用递减运算符反向遍历字母表中的每个字母。\n\
  \n### 列表 3.15：降序显示每个字符的 Unicode 值\n点击此处查看代码图像\n\n```cpp\nchar current;\nint unicodeValue;\n\
  // 设置 current 的初始值。\ncurrent = 'z';\ndo\n{\n// 获取 current 的 Unicode 值。\n    unicodeValue\
  \ = (int)current;\n    System.Console.Write($\"{current}={unicodeValue}\\t\");\n\
  \    current--;\n} while(current >= 'a');\n```\n\n输出 3.9 显示了列表 3.15 的结果。递增和递减运算符用于控制\
  \ `char` 类型操作的次数。\n\n\n\n\n在本示例中，递增运算符出现在操作数之前，因此表达式的结果是增加后赋值给变量的值。如果 `count` 为\
  \ `123`，`++count` 将将 `124` 赋值给 `count` 并产生结果 `124`。相比之下，后置递增运算符 `count++` 将 `124`\
  \ 赋值给 `count`，并产生 `count` 在增加之前所持的值：`123`。无论运算符是后置还是前置，变量 `count` 都会在产生值之前递增；唯一的区别在于产生的值不同。前置和后置行为的区别在列表\
  \ 3.18 中所示。结果输出如输出 3.12 中所示。\n\n**列表 3.18：比较前置和后置递增运算符**\n\n点击此处查看代码图像\n\n* * *\n\
  \n```\nclass IncrementExample\n{\n    static void Main()\n    {\n        int x =\
  \ 123;\n        // 显示 123, 124, 125.\n        System.Console.WriteLine($\"{x++},\
  \ {x++}, {x}\");\n        // x 现在包含值 125.\n        // 显示 126, 127, 127.\n      \
  \  System.Console.WriteLine($\"{++x}, {++x}, {x}\");\n        // x 现在包含值 127.\n\
  \    }\n}\n```\n\n* * *\n\n**输出 3.12**\n\n123, 124, 125\n\n126, 127, 127\n\n如列表\
  \ 3.18 所示，递增和递减运算符相对于操作数的出现位置会影响表达式产生的结果。前置运算符的结果是变量在增加或减小之前的值。后置运算符的结果是变量在增加或减小之后的值。在语句中间嵌入这些运算符时要务必小心。如果不确定会发生什么，请独立使用这些运算符，将它们放在自己的语句中。这样代码更具读性，且不会误解意图。\n\
  \n* * *\n\n### 语言对比：C++——实现定义的行为\n\n之前我们讨论了 C++ 中表达式中的操作数可以以任何顺序评估，而在 C# 中，它们始终从左到右评估。同样，在\
  \ C++ 中，实现可能会合法按任何顺序执行递增和递减的副作用。例如，在 C++ 中，形式为 `M(x++, x++)` 的调用（其中 `x` 初始化为 `1`）可以根据编译器的任意调用\
  \ `M(1,2)` 或 `M(2,1)`。相比之下，C# 将始终调用 `M(1,2)`，因为 C# 提供了两个保证：(1) 用的参数始终从左到右计算，(2)\
  \ 将增加后的值赋值给变量的操作在表达式值使用之前完成。C++ 则不提供这些保证。\n\n* * *\n\n* * *\n\n### 指南\n\n**避免**\
  \ 混用递增和递减运算符。\n\n**在** 在 C、C++ 和 C# 之间迁移使用递增和递减运算符的代码时要**小心**；C 和 C++ 的实现不需要遵循与\
  \ C# 相同的规则。\n\n* * *\n\n* * *\n\n### 高级主题：线程安全的递增和递减\n\n尽管递增和递减运算符简洁，但这些运算符并不是原子的。在运算符执行期间可能会发生线程切换，并导致竞态条件。你可以使用\
  \ `lock` 语句来防止竞态条件。然而，对于简单的递增和递减，开销较小的替代方案是使用 `System.Threading.Interlocked` 类中线程安全的\
  \ `Increment()` 和 `Decrement()` 方法。这些方法依赖处理器函数来执行快速的线程安全加减。详见第 19 章。\n\n#### 常量表达式和常量局部变量\n\
  \n上一章讨论了字面量，即直接嵌入代码中的值。可以使用运算符在**常量表达式**中组合多个字面量。根据定义，常量表达式是指 C# 编译器可以在编译时评估（而不是在程序运行时评估）的表达式，因为它完全常量操作数组成。常量表达式可以用于初始化常量局部变量，这允许你为常量值命名（类似于局部变量允许你为存储位置命名）。例如，计算一天的秒数可以是一个常量表达式，然后在其他表达式通过名称引用。\n\
  \n列表 3.19 中的 `const` 关键字声明常量局部变量。由于常量局部变量从定义上是**变量**的相反——“常量”意味着“不能改变”——任何修改它的尝试都会导致编译错误。\n\
  \n* * *\n\n### 指南\n\n**不要** 对任何可能变化的值使用常量。\n\n* * *\n\n注意列表 3.19 中的表达式 `secondsPerWeek`\
  \ 是常量，因为所有操作数都是常量。\n\n**列表 3.19：声明常量**\n\n### 引入流程控制\n\n本章稍后部分提供了一种简单的方法查看代码（列表\
