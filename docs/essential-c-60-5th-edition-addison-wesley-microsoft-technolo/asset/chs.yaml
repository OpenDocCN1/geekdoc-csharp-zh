  \ 显示了结果。\n\n**输出 5.4**\n\n点击此处查看代码图像\n\n姓名已更改为 'Inigo Montoya'\nInigo Montoya:\n\
  \n保存过程的反向过程出现在列表 5.14 中。\n\n\n\n考虑一个包含 `Password` 字段的 `Employee` 类。应该能够调用 `Employee`\
  \ 对象并使用 `Logon()` 方法来验证密码。相反，不应该允许从类外部访问 `Employee` 对象的 `Password` 字段。\n\n要将 `Password`\
  \ 字段定义为隐藏且在包含类外部不可访问，你需要使用访问修饰符 `private` 关键字代替 `public`（参见列表 5.15）。结果是，例如在 `Program`\
  \ 类内部无法访问 `Password` 字段。\n\n### 列表 5.15：使用 private 访问修饰符\n\n点击此处查看代码图像\n\n* * *\n\
  \n```csharp\nclass Employee\n{\n  public string FirstName;\n  public string LastName;\n\
  \  public string Salary;\n  private string Password;\n  private bool IsAuthenticated;\n\
  \n  public bool Logon(string password)\n  {\n    if(Password == password)\n    {\n\
  \      IsAuthenticated = true;\n    }\n    return IsAuthenticated;\n  }\n\n  public\
  \ bool GetAuthenticated()\n  {\n    return IsAuthenticated;\n  }\n\n  // ...\n}\n\
  \n* * *\n\nclass Program\n{\n  static void Main()\n  {\n    Employee employee =\
  \ new Employee();\n    employee.FirstName = \"Inigo\";\n    employee.LastName =\
  \ \"Montoya\";\n    // ...\n    // Password 是私有的，所以不能\n    // 从类外部访问。\n    Console.WriteLine(\"\
  Password = {0}\", employee.Password);\n  }\n  // ...\n}\n```\n\n* *\n\n虽然在列表 5.15\
  \ 中没有显示此选项，但也可以使用 `private` 访问修饰符来修饰方法。如果未对类成员上放置访问修饰符，则声明默认为 `private`。换句话说，成员默认是私有的，程序员需要显式地指定某个成员应为\
  \ `public`。\n\n## 属性\n\n前一节访问修饰符演示了如何使用 `private` 关键字来封装密码，防止从类外部访问。然而，这种类型的封装通常太严格了。例如，你可能需要定义一些外部类只能读取的字段，但你可以在内部更改其值。或者，也许你想要允许向类中写入某些数据，但你需要能够对数据所所的更改进行验证。在另一种场景中，你可能需要动态地构建数据。传统上，语言通过将字段标记为私有并提供用于访问和修改数据的\
  \ getter 和 setter 方法来实现这些示例中的功能。列表 5.16 中的代码将 `FirstName` 和 `LastName` 均更改为私有字段。为每个字段提供的公共\
  \ getter 和 setter 方法允许它们的值值被访问和更改。\n\n### 列表 5.16：声明 getter 和 setter 方法\n\n点击此处查看代码图像\n\
  \n* * *\n\n```csharp\nclass Employee\n{\n  private string FirstName;\n  // FirstName\
  \ getter\n  public string GetFirstName()\n  {\n    return FirstName;\n  }\n  //\
  \ FirstName setter\n  public void SetFirstName(string newFirstName)\n  {\n    if(newFirstName\
  \ != null && newFirstName != \"\")\n    {\n      FirstName = newFirstName;\n   \
  \ }\n  }\n  private string LastName;\n  // LastName getter\n  public string GetLastName()\n\
  \  {\n    return LastName;\n  }\n  // LastName setter\n  public void SetLastName(string\
  \ newLastName)\n  {\n    if(newLastName != null && newLastName != \"\")\n    {\n\
  \      LastName = newLastName;\n    }\n  }\n  // ...\n}\n```\n\n* * *\n\n遗憾的是，这种更改影响了\
  \ `Employee` 类的编程性。你不再可以使用赋值操作符来设置类内部的数据，也无法在不调用方法的情况下访问数据。\n\n#### 声明属性\n\n考虑到这种模式的频繁出现，C#\
  \ 设计者为其提供了显式的语法。这种语法被称为**属性**（参见列表 5.17 和输出 5.5）。\n\n### 列表 5.17：定义属性\n\n点击此处查看代码图像\n\
  \n* * *\n\n```csharp\nclass Program\n{\n  static void Main()\n  {\n    Employee\
  \ employee = new Employee();\n    // 调用 FirstName 属性的 setter。\n    employee.FirstName\
  \ = \"Inigo\";\n    // 调用 FirstName 属性的 getter。\n    System.Console.WriteLine(employee.FirstName);\n\
  \  }\n}\n```\n\n* * *\n\n```csharp\nclass Employee\n{\n  // FirstName 属性\n  public\
  \ string FirstName\n  {\n    get\n    {\n      return _FirstName;\n    }\n    set\n\
  \    {\n      _FirstName = value;\n    }\n  }\n  private string _FirstName;\n\n\
  \  // LastName 属性\n  public string LastName\n  {\n    get\n    {\n      return _LastName;\n\
  \    }\n    set\n    {\n      _LastName = value;\n    }\n  }\n  private string _LastName;\n\
  }\n```\n\n\n\n在 Listing 5.17 中首先需要注意的不是属性代码本身，而是`Program` 类中的代码。虽然你不再拥有具有 `FirstName`\
  \ 和 `LastName` 标识符的字段，但通过查看 `Program` 类是无法看出这一点的。访问员工名和姓的 API 完全没有变化。仍然可以使用简单的赋值运算符为名称的各个部分进行赋值，例如（`employee.FirstName\
  \ = \"Inigo\"`）。\n\n关键特性是，属性提供了一个在程序上看起来像字段的 API。实际上，并不存在这样的字段。属性声明看起来与字段声明完全相同，但紧随其后的是大括号，用于放置属性的实现。属性实现由两个可选部分组成。`get`\
  \ 部分定义了属性的读取访问器部分。它直接对应于 Listing 5.16 中定义的 `GetFirstName()` 和 `GetLastName()` 函数。要访问\
  \ `FirstName` 属性，你调用 `employee.FirstName`。同样，设置器（实现中的 `set` 部分）允许字段赋值的调用语法：\n\n\
  ```\nemployee.FirstName = \"Inigo\";\n```\n\n属性定义语法使用了三个上下文关键字。你使用 `get` 和 `set`\
  \ 关键字分别识别属性的检索部分或赋值部分。此外，设置器使用 `value` 关键字来引用赋值操作的右侧。因此，当 `Program.Main()` 调用 `employee.FirstName\
  \ = \"Inigo\"` 时，`value` 在设置器内部被设置为 `\"Inigo\"`，并可用于给 `_FirstName` 赋值。Listing 5.17\
  \ 中的属性实现是最常用的。当调用 getter（例如在 `Console.WriteLine(employee.FirstName)` 中），将从字段（`_FirstName`）获取值并写入控制台。\n\
  \n`Begin 3.0`\n\n#### 自动实现属性\n\n在 C# 3.0 中，属性语法包含简写版本。由于由 `get` 和 `set` 访问器赋值并检索的单个后台字段的属性是非常简单且常见的（参见\
  \ `FirstName` 和 `LastName` 的实现），C# 3.0（及更高版本）编译器允许在没有任何访问器实现或后台字段声明的情况下声明属性。Listing\
  \ 5.18 展示了 `Title` 和 `Manager` 属性的语法，而 Output 5.6 显示了结果。\n\n**LISTING 5.18: 自动实现属性**\n\
  \n点击此处查看代码图像\n\n* * *\n\n```cs\nclass Program\n{\n  static void Main()\n  {\n  \
  \    Employee employee1 =\n          new Employee();\n      Employee employee2 =\n\
  \          new Employee();\n      // 调用 FirstName 属性的设置器。\n      employee1.FirstName\
  \ = \"Inigo\";\n      // 调用 FirstName 属性的 getter。\n      System.Console.WriteLine(employee1.FirstName);\n\
  \      // 为自动实现的属性赋值\n      employee2.Title = \"Computer Nerd\";\n      employee1.Manager\
  \ = employee2;\n      // 打印 employee1 经理的标题。\n      System.Console.WriteLine(employee1.Manager.Title);\n\
  \  }\n}\n\nclass Employee\n{\n  // FirstName 属性\n  public string FirstName\n  {\n\
  \      get\n      {\n          return _FirstName;\n      }\n      set\n      {\n\
  \          _FirstName = value;\n      }\n  }\n  private string _FirstName;\n  //\
  \ LastName 属性\n  public string LastName\n  {\n      get\n      {\n          return\
  \ _LastName;\n      }\n      set\n      {\n          _LastName = value;\n      }\n\
  \  }\n  private string _LastName;\n  public string Title { get; set; }\n  public\
  \ Employee Manager { get; set; }\n}\n```\n\n\n\n\n-   **避免**使用 `camelCase` 命名字段。\n\
  -   **应该**在该做法增加价值时，优先考虑使用“Is”、“Can”或“Has”作为布尔属性的前缀。\n-   **不要**声明为公共或受保护的实例字段。（相反，应通过属性来暴露它们。）\n\
  -   **应该**使用 `PascalCase` 命名属性。\n-   **应该**优先使用自动实现的属性而不是字段。\n-   **应该**在没有额外实现逻辑的情况下，优先使用自动实现的属性而不是完全展开属性。\n\
  \n## 使用带有验证的属性\n\n请注意列表 5.19，`Employee` 的 `Initialize()` 方法使用属性而不是字段进行赋值。虽然这不是强制要求的，但结果是属性\
  \ set 访问器中的任何验证都将在类内部和类外部被调用。例如，如果更改 `LastName` 属性，使其在赋值给 `_LastName` 之前检查 `value`\
  \ 是否为 `null` 或空字符串，会发生什么呢？\n\n**列表 5.19：提供属性验证**\n\n点击此处查看代码图像\n\n```csharp\nclass\
  \ Employee\n{\n  // ...\n\n  public void Initialize(string newFirstName, string\
  \ newLastName)\n  {\n    // 在 Employee 类内部也使用属性。\n    FirstName = newFirstName;\n\
  \    LastName = newLastName;\n  }\n\n  // LastName 属性\n  public string LastName\n\
  \  {\n    get\n    {\n      return _LastName;\n    }\n    set\n    {\n      // 验证\
  \ LastName 赋值\n      if(value == null)\n      {\n        // 报告错误\n        // 在 C#\
  \ 6.0 中将 \"value\" 替换为 nameof(value)\n        throw new ArgumentNullException(\"\
  value\");\n      }\n      else\n      {\n        // 删除姓周围的任何空格。\n        value =\
  \ value.Trim();\n        if(value == \"\")\n        {\n          // 报告错误\n     \
  \     // 在 C# 6.0 中将 \"value\" 替换为 nameof(value)\n          throw new ArgumentException(\"\
  LastName cannot be blank.\", \"value\");\n        }\n        _LastName = value;\n\
  \      }\n    }\n  }\n\n  private string _LastName;\n  // ...\n}\n```\n\n通过这种新的实现，如果\
  \ `LastName` 被赋予了无效值（无论是来自同一类的其他成员，还是通过 `Program.Main()` 内部直接对 `LastName` 赋值），代码都会抛出异常。通过提供类似字段的\
  \ API 来拦截赋值并验证参数，是属性的优势之一。仅在属性内部访问属性后备字段是一个良好的做法。换句话说，您应该始终使用属性，而不是直接调用字段。在许多情况下，这一原则即使对于与属性在同一类中的代码也适用。如果你遵循这种做法，当你添加验证代码时，整个类都会立即从中受益。正如章节稍后描述的，这种情况的一个例外是字段被标记为只读时，因为此时值只能在构造函数中设置。在\
  \ C# 6.0 中，你可以直接为只读属性赋值，从而完全消除了对只读字段的需求。\n\n虽然罕见，但在设置器内部赋值 `value` 是可能的，如列表 5.19\
  \ 所示。在这种情况下，对 `value.Trim()` 的调用会移除新姓周围的任何空格。\n\n### 指南\n\n-   **避免**在属性外部访问属性的后备字段，即使是在包含它的类内部。\n\
  -   **应该**在调用 `ArgumentException()` 或 `ArgumentNullException()` 构造函数时，使用“value”作为\
  \ `paramName` 参数（“value”是属性设置器上参数的隐含名称）。\n\n## 6.0\n\n### 高级主题：nameof 操作符\n\n如果在属性验证期间你确定新值的赋值无效，则有必要抛出异常——通常类型为\
  \ `ArgumentException()` 或 `ArgumentNullException()`。这两种异常都接受一个类型为 `string` 的参数 `paramName`，用于标识无效参数的名称。在列表\
  \ 5.19 中，我们将 `\"value\"` 作为该参数的参数，但 C# 6.0 通过 `nameof` 操作符提供了改进。`nameof` 操作符接收一个标识符（例如变量\
  \ `value`），并返回该该名称的字符串表示——在本例中为 `\"value\"`。\n\n使用 `nameof` 操作符的优势在于，如果标识符名称发生变化，重构工具将自动将参数更改为\
  \ `nameof`。如果没有使用重构工具，代码将无法编译，迫使开发者手动更改参数。在属性验证器的情况下，“参数”始终是 `value` 且无法更改，因此利用\
  \ `nameof` 操作符的优势可能消失了。尽管如此，请考虑在所有 `paramName` 参数的情况下都继续使用 `nameof` 操作符。\n\n###\
  \ 只读和只写属性\n\n通过移除属性的 getter 或 setter，你可以更改属性的访问权限。同样，仅提供 getter 会使属性变为只读；任何赋值尝试都将导致错误。\n\
  \n```csharp\nclass Program\n{\n  static void Main()\n  {\n    Employee employee1\
  \ = new Employee();\n    employee1.Initialize(4);\n    // 错误：'Id' 不能赋值\n    employee1.Id\
  \ = \"9\"; \n  }\n}\n\nclass Employee\n{\n  public void Initialize(int id)\n  {\n\
  \    // 因为 Id 没有 setter，所以使用字段\n    _Id = id.ToString();\n  }\n\n  private string\
  \ _Id;\n\n  public string Id\n  {\n    get\n    {\n      return _Id;\n    }\n  \
  \  // 未提供 setter。\n  }\n}\n```\n\n\n\n\n\n```csharp\nprivate string _Id;\n\n}\n\
  ```\n\n* * *\n\n\n\n\n\n在设置器（setter）上使用 `private`，该属性对于 `Employee` 类以外的类显示为只读。在\
  \ `Employee` 内部，该属性显示为可读/写，因此你可以在构造函数内部为其赋值。在获取器（getter）或设置器上指定访问修饰符时，请确保访问修饰符比属性本身的访问修饰符更严格。例如，将属性声明为\
  \ `private` 而将设置器声明为 `public` 将导致编译错误。\n\n### 指南\n\n- **应该**在所有属性的获取器和设置器实现上应用适当的访问性修饰符。\n\
  - **不要**提供仅设置的属性，或者设置器访问范围比获取器更宽的属性。\n\n# 结束 2.0\n\n## 属性和方法调用不能作为 ref 或 out 参数值\n\
  \nC# 允许像使用字段一样使用属性，但将其作为 `ref` 或 `out` 参数值传递时例外。`ref` 和 `out` 参数值在内部是通过向目标方法传递内存地址来实现的。然而，由于属性可以是没有后台字段的虚拟字段，或者可能是只读或只写的，因此无法传递底层存储的地址。结果，你不能将属性作为\
  \ `ref` 或 `out` 参数值传递。方法调用也是如此。相反，当代码需要将属性或方法调用作为 `ref` 或 `out` 参数值传递时，必须先将值拷贝到变量中，然后传递该变量。方法调用完成后，代码必须将变量赋值回属性。\n\
  \n# 高级主题：属性内部实现\n\nListing 5.23 显示获取器和设置器在 CIL 中被暴露为 `get_FirstName()` 和 `set_FirstName()`。\n\
  \n**列表 5.23：属性生成的 CIL 代码结果**\n\n点击此处查看代码图片\n\n```cpp\n// ...\n\n.field private string\
  \ _FirstName\n\n.method public hidebysig specialname instance string\n        get_FirstName()\
  \ cil managed\n{\n  // Code size      12 (0xc)\n  .maxstack  1\n  .locals init (string\
  \ V_0)\n  IL_0000:  nop\n  IL_0001:  ldarg.0\n  IL_0002:  ldfld      string Employee::_FirstName\n\
  \  IL_0007:  stloc.0\n  IL_0008:  br.s      IL_000a\n  IL_000a:  ldloc.0\n  IL_000b:\
  \  ret\n} // end of method Employee::get_FirstName\n\n.method public hidebysig specialname\
  \ instance void\n        set_FirstName(string 'value') cil managed\n{\n  // Code\
  \ size      9 (0x9)\n  .maxstack  8\n  IL_0000:  nop\n  IL_0001:  ldarg.0\n  IL_0002:\
  \  ldarg.1\n  IL_0003:  stfld      string Employee::_FirstName\n  IL_0008:  ret\n\
  } // end of method Employee::set_FirstName\n\n.property instance string FirstName()\n\
  {\n  .get instance string Employee::get_FirstName()\n  .set instance void Employee::set_FirstName(string)\n\
  } // end of property Employee::FirstName\n// ...\n```\n\n与其作为普通方法的形式同样重要的事实是，属性也是\
  \ CIL 中的一种显式结构。如 Listing 5.24 所示，获取器和设置器是由 CIL 属性调用的，而属性是 CIL 代码中的显式结构。正因如此，语言和编译器并不限于始终根据命名约定来解释属性。相反，CIL\
  \ 属性为编译器和代码编辑器提供了提供特殊语法的手段。\n\n**列表 5.24：属性是 CIL 中的一种显式结构**\n\n点击此处查看代码图片\n\n```cpp\n\
  \  .property instance string FirstName()\n  {\n    .get instance string Program::get_FirstName()\n\
  \    .set instance void Program::set_FirstName(string)\n  } // end of property Program::FirstName\n\
  ```\n\n注意 Listing 5.23 中作为属性属性的获取器和设置器包含了 `specialname` 修饰符。该修饰符被 Visual Studio\
  \ 等 IDE 用作从 IntelliSense 中隐藏这些成员的标记。自动实现的属性与你显式定义后台字段的属性几乎完全相同。C# 编译器取代手动定义的字段，生成一个名为\
  \ `<PropertyName>BackingField` 的字段。此生成的字段包含一个属性（参见 第 17 章），称为 `System.CompilerServices.CompilerAttribute`。获取器和设置器都装饰了相同的属性，因为它们也是生成的——其实现方式与\
  \ 5.23 和 5.24 中相同。\n\n## 构造函数\n\n现在你已经向类添加了字段并可以存储数据，你需要考虑这些数据的有效性。正如你在 Listing\
