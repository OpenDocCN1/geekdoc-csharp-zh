  Hey you!\nEnter your first name: Inigo\nEnter your last name: Montoya\nYour full\
  \ name is Inigo Montoya.\n```\n\n与其写出“Your full name is”后跟另一个用于 `firstName` 的 `Write`\
  \ 语句、用于空格的第三个 `Write` 语句，最后是用于 `lastName` 的 `WriteLine` 语句，列表 15 使用 C# 6.0 的插值输出整个输出。通过字符串插值，编译器将字符串内部的大括号解释为可以嵌入代码（表达式）的区域，并将其转换为字符串。与其单独执行大量代码并在最后组合字符串，字符串插值允许你一步到位完成此操作。这使得代码更容易理解。\n\
  \n**结束 6.0**\n在 C# 6.0 之前，C# 使用了另一种方法：复合格式化。在复合格式化中，代码首先提供一个格式字符串来定义输出格式——参见列表 1.16。\n\
  \n**列表 16：使用 System.Console.WriteLine() 的复合格式化**\n\n点击此处查看代码图片\n\n```csharp\nclass\
  \ HeyYou\n{\n  static void Main()\n  {\n    string firstName;\n    string lastName;\n\
  \    System.Console.WriteLine(\"Hey you!\");\n    System.Console.Write(\"Enter your\
  \ first name: \");\n    firstName = System.Console.ReadLine();\n    System.Console.Write(\"\
  Enter your last name: \");\n    lastName = System.Console.ReadLine();\n    System.Console.WriteLine(\"\
  Your full name is {0} {1}.\", firstName, lastName);\n  }\n}\n```\n\n\n\n\n\n注意，格式字符串中的占位符并不按顺序出现。例如，列表\
  \ 1.17 交换了索引占位符的顺序并添加了一个逗号，这改变了名称的显示方式（请参见 输出 1.6）。\n\n**列表 1.17：交换索引占位符和相应的变量**\n\
  \n点击此处查看代码图像\n\n* * *\n* * *\n\n```csharp\nSystem.Console.WriteLine(\"Your full\
  \ name is {1}, {0}\",\n  firstName, lastName);\n```\n\n* * *\n* * *\n\n**输出 1.6**\n\
  \n嘿，你！\n\n输入你的名：Inigo\n\n输入你的姓：Montoya\n\n你的全名是 Montoya, Inigo\n\n除了占位符在格式字符串中不必连续出现外，还可以在格式字符串中多次使用同一个占位符。此外，可以省略某些占位符。然而，不存在没有对应参数的占位符。\n\
  \n由于 C# 6.0 风格的字符串插值几乎比替代的复合字符串方法更容易理解，在本书的剩余部分，我们将默认使用字符串插值。\n\n### 注释\n\n在本节中，我们通过添加注释修改了列表\
  \ 1.15 中的程序。这在任何方面都不会改变程序的执行；相反，在代码中提供注释可以使代码在不直观的区域变得更易理解。列表 1.18 显示了新代码，输出 1.7](#ch01.html_ch01out07)\
  \ 显示了相应的输出。\n\n**列表 1.18：为你的代码添加注释**\n\n![图像](img/01lis18.jpg)\n\n**输出 1.7**\n\n\
  嘿，你！\n\n输入你的名：Inigo\n\n输入你的姓：Montoya\n\n你的全名是 Inigo Montoya。\n\n尽管插入了注释，编译和执行新程序产生的输出与之前相同。\n\
  \n程序员使用注释来描述和解释他们编写的代码，特别是在语法本身难以理解，或者某个特定算法的实现令人意外的情况下。由于注释仅对查看代码的程序员有用，编译器会忽略注释并生成汇编代码，其中没有任何注释作为原始源代码一部分的痕迹。\n\
  \n表 1.2 显示了四种不同的 C# 注释类型。列表 1.18 中的程序包含了其中两种。\n\n`Begin 2.0`\n\n![图像](img/01tab02.jpg)\n\
  \n**表 1.2：C# 注释类型**\n\n`End 2.0`\n\n关于 XML 注释的更全面讨论出现在第 9 章，在那里我们将进一步讨论各种 XML 标签。\n\
  \n在编程历史上曾有一段时间，大量的注释意味着一个律严谨且经验丰富的程序员。现在已不再如此。相反，没有注释也易读的代码比需要注释来解释其作用的代码更有价值。如果开发者发现有必要注释来澄清特定代码块的作用，他们应该倾向于重写更清晰的代码，而不是对其进行注释。编写仅仅重复代码清晰显示内容的注释只会弄乱代码，降低其可读性，并增加由于代码更改而注释未同步更新导致注释过时的概率。\n\
  \n* * *\n\n### 指南\n\n**不要**使用注释，除非它们描述了对于编写代码的开发者以外的人来说并不明显的内容。\n\n**应该**倾向于编写更清晰的代码，而不是通过注释来解释复杂的算法。\n\
  \n* * *\n* * *\n\n### 初学者主题：扩展标记语言\n\n可扩展标记语言 (XML) 是一种简单灵活的文本格式，经常用于 Web 应用程序以及应用程序之间的数据交换。XML\
  \ 是可扩展的，因为 XML 文档中包含了描述数据的信息，被称为**元数据**。以下是一个 XML 文件示例。\n\n点击此处查看代码图像\n\n```xml\n\
  <?xml version=\"1.0\" encoding=\"utf-8\" ?>\n\n<body>\n  <book title=\"Essential\
  \ C# 6.0\">\n    <chapters>\n      <chapter title=\"Introducing C#\"/>\n      <chapter\
  \ title=\"Operators and Control Flow\"/>\n      ...\n    </chapters>\n  </book>\n\
  </body>\n```\n\n文件以指示 XML 文件版本和字符编码的头部开头。之后出现一个主“book”（书籍）元素。元素以尖括号中的单词开始，例如 `<body>`。要结束一个元素，在尖括号中放置相同的单词并在单词前添加一个正斜杠，如\
  \ `</body>`。除了元素外，XML 还支持属性。`title=\"Essential C# 6.0\"` 是 XML 属性的一个示例。注意，描述数据（“Essential\
  \ C# 6.0”、“Operators and Control Flow”）的元数据（书名、章节等）包含在 XML 文件中。这会导致文件相当臃肿，但它的优势是数据包含了有助于解释数据的描述。\n\
  \n* * *\n\n### 应用程序接口\n\n在如 `System.Console` 等数据类型上找到的所有方法（或更泛泛地说，成员）构成了 `System.Console`\
  \ 的应用程序接口 (API)。这种 API 定义了软件程序如何与组件交互。API 不仅存在于单个数据类型中，泛泛地说，一组数据类型的组合被认为创建了集合的 API。在\
  \ .NET 中，例如程序中的所有类型（及其内部成员）被认为构成了程序的 API。同样，给定一组程序（如 .NET 框架中的程序），这些程序集合形成了一个更大的\
  \ API。通常，这组更大的 API 框架（framework）——因此有了 .NET 框架这一术语。泛泛地说，API 包含了针对一组组件编程的接口和协议。事实上，在\
  \ .NET 中，协议本身就是 .NET 程序执行的规则。\n\n### 托管执行与通用语言体系\n\n处理器无法直接解释程序。程序主要由一种被称为通用中间语言\
  \ (CIL) 或简称 IL 的语言组成 (7）。C# 编译器将 C# 源代码转换为这种中间语言。通常在执行时还需要一个额外步骤，将 CIL 代码转换为处理器可以理解的机器码。这涉及\
  \ C# 程序执行中的一个重要元素：虚拟执行系统 (VES)。VES 也被通称为运行时，它根据需要编译 CIL 代码（这一过程被称为即时编译或 jitting）。在运行时等代理的上下文中执行的代码被称为托管代码，而在运行时的控制下执行的过程被称为托管执行。代码之所以是“托管”的，是因为运行时通过管理内存分配、安全和即时编译等方面控制了程序的大部分行为。不需要运行时执行的代码被称为原生代码（或非托管代码）。\n\
  \n7。CIL 的第三种术语是 Microsoft IL (MSIL)。本书使用 *CIL* 术语，因为它是 CLI 标准采用的术语。\n\n\n\n\n\n\
  Miller, J., and S. Ragsdale. 2004. *The Common Language Infrastructure Annotated\
  \ Standard.* Boston: Addison-Wesley.\n\n- `VES` 或运行时（runtime）\n- `CIL`\n- 一种支持语言互操作的类型系统，称为通用类型系统（`Common\
  \ Type System`, `CTS`）\n- 关于编写可从 CLI 兼容语言访问的库的指南（这些库在通用语言规范 [`CLS`] 中可用）\n- 启用由\
  \ `CLI` 识别的许多项服务的元数据（包括程序集的布局或文件格式的规范）\n- 一个通用的编程框架，基类库（`Base Class Library`, `BCL`），所有语言的开发者都可以利用它\n\
  \n### 注意事项\n`runtime` 一词可以指执行时间（execution time），也可以指虚拟执行系统（Virtual Execution System）。为了帮助澄清意图，本书使用\
  \ `execution time` 一词来表示程序正在运行的时间，而在讨论负责管理 `C#` 程序执行期间的代理时，使用 `runtime` 一词。\n\n\
  在 `CLI` 实现的上下文中运行可以支持许多程序员不需要直接编写代码的服务和功能，包括以下内容：\n\n- `语言互操作性`：不同源语言之间的互操作。这是因为语言编译器将每种源语言翻译为相同的中间语言（`CIL`）。\n\
  - `类型安全`：检查类型之间的转换，确保只会在兼容类型之间发生转换。这有助于防止缓冲区溢出，这是安全漏洞的主要原因。\n- `代码访问安全`：证明程序集开发者的代码具有在计算机上执行的权限。\n\
  - `垃圾回收`：自动释放由 `runtime` 之前分配的内存的管理。\n- `平台移植性`：支持在各种操作系统上可能运行相同的程序集。一个明显的限制是不使用任何依赖于平台的库；因此，与\
  \ `Java` 一样，可能存在需要解决的某些平台特定特性。\n- `BCL`：为开发者提供了可以依赖的大量代码基础（在所有 `CLI` 实现中），这样他们就不需要自己开发代码了。\n\
  \n### 注意事项\n本节简要概述了 `CLI`，以便你熟悉 `C#` 程序运行的上下文语境。它还对本书中出现的一些术语进行了总结。`第 21 章`专门讨论了\
  \ `CLI` 主题及其与 `C#` 开发者的相关性。虽然该章节出现在书最后，但它不依赖于之前的任何章节，所以如果你想更熟悉 `CLI`，可以随时跳转到该章节。\n\
  \n`开始 3.0`\n\n### C# 和 .NET 版本控制\n微软对 `.NET Framework` 和相应的 `C#` 语言版本分配了不一致的版本号，因为不同的团队有不同的版本控制机制。这意味着如果你使用\
  \ `C# 5.0` 编译器编译，它默认将针对“`.NET Framework` 版本 4.6”进行编译（例如）。`表 1.3` 是 `C#` 和 `.NET`\
  \ 发布的简要概述。\n\n![Image](img/01tab03.jpg)\n\n**表 1.3：C# 和 .NET 版本**\n\n只要编译器版本与代码所需的版本对应，本文中的大部分代码都可以在微软以外的平台上运行。虽然对每个\
  \ `C#` 平台提供完整细节对某些读者有所帮助，但也会分散学习 `C#` 的注意力，因此本文正文限制在关于微软平台 `.NET` 的相关信息上。做出这一选择仅仅是因为微软拥有压倒性的实现。此外，迁移到其他平台是非常容易的。\n\
  \n`结束 3.0`\n\n也许与 `C# 6.0` 一起添加的最重要的框架特性是支持跨平台编译。换句话说，`.NET Framework` 不仅可以在 Windows\
  \ 上运行，微软还为 `.NET Core` 提供了一个（名为“CoreFX”）的实现，该实可以在 Linux 和 OS X 上运行。虽然 `.NET Core`\
  \ 的功能集并不等同于完整的 `.NET Framework`，但它包含了足够的功能，使得整个（`ASP.NET`）网站可以托管 Windows 及其 Internet\
  \ 信息服务器（IIS）之外的操作系统上。这意味着可以使用相同的代码库编译并执行运行在跨平台上的应用程序。`.NET Core` 包含了一切内容，从 `.NET\
  \ 编译器平台`（`Roslyn`，它本身在 Linux 和 OS X 上执行）到 `.NET Core` 运行时，以及如 .NET 版本管理器（`DNVM`）和\
  \ .NET 执行环境（`DNX`）之类的工具。\n\n### 通用中间语言和 ILDASM\n如上一节所述，`C#` 编译器将 `C#` 代码转换为 `CIL`\
  \ 代码而不是机器代码。处理器可以直接理解机器代码，但 `CIL` 代码在处理器执行之前需要经过转换。给定一个程序集（无论是 `DLL` 或可执行文件），可以使用\
  \ `CIL` 反汇器工具查看 `CIL` 代码，将程序集解构为其 `CIL` 表示。（`CIL` 反汇器通常以其微软特定的文件名 `ILDASM` 称为，代表\
  \ IL 反汇器。）该程序将反汇编一个程序或其类库，显示由 `C#` 编译器生成的 `CIL`。\n\n用于 `CIL` 反汇器的准确命令取决于使用哪种 `CLI`\
  \ 实现。你可以如 `输出 1.8` 所示，从命令行执行 `.NET CIL` 反汇器。\n\n**输出 1.8**\n\n```\nildasm /text\
  \ HelloWorld.exe\n```\n\n`/text` 部分用于让输出显示在控制台而不是新窗口中。执行这些命令产生的输出流是 `HelloWorld.exe`\
  \ 中包含的 `CIL` 代码。注意，`CIL` 代码比机器代码更容易理解。对于许多开发者来说，这可能会引发担忧，因为可以在不显式分发源代码的情况下对程序进行反编译并理解算法。\n\
  \n对于任何程序，无论基于 `CLI` 与否，防止反汇的唯一可靠方法是完全不允许访问编译后的程序（例如仅在网站上托管程序而不是发给用户）。然而，如果只需要降低源代码可见性，可以使用混淆器。这些混淆器打开\
  \ `IL` 代码并对其转换，使其变得难以理解。这防止了普通开发者访问代码，并创建了难以且费力反编译为理解代码的代码集。除非程序需要高度算法安全性，否则这些混淆器通常足够了。\n\
