  在列表 3.25 和列表 3.26 中，`pi` 的值由 `System.Math` 类中的常量 `PI` 表示。与其硬编码一个值（例如对 `pi` 和欧拉常数（e）等常量使用\
  \ 3.14），代码应该使用 `System.Math.PI` 和 `System.Math.E`。\n\n### 指南\n\n**避免**省略大括号，是最简单的单行\
  \ `if` 语句。\n\n### 代码块、作用域和声明空间\n\n代码块通常被称为“作用域”（scopes），但这两个术语并不完全可以互换。命名实体的**作用域**是源代码中的某个区域，在该区域内，可以使用其未限定名称引用该实体。例如，局部变量的作用域正是包含它的代码块文本，这解释了为什么通常将代码块称为“作用域”。\n\
  \n作用域经常与声明空间（declaration spaces）混淆。**声明空间**是命名实体的逻辑容器，在容器内两个实体不能具有相同的名称。代码块不仅定义了一个作用域，还定义了一个局部变量声明空间。在同一个声明空间内，出现两个同名的局部变量声明是非合法的。同样，在同一个类中，无法声明两个签名均为\
  \ `Main()` 的方法。（这一规则对于方法来说稍微放宽：只要两个方法的签名不同，它们在同一个声明空间内可以具有相同的名称。一个方法的签名包括它的名称以及参数的数量和类型。）在代码块内部，可以通过名称提到局部变量，且它必须是该块中以该名称声明的唯一实体。在声明块之外，无法通过其名称引用局部变量；该局部变量在块之外被称为“超出了作用域”。\n\
  \n总而言之，作用域用于确定一个名称指代哪个实体；而声明空间决定了两个用相同名称声明的实体何时会发生冲突。在列表 3.27 中，在嵌入 `if` 语句的块语句内部声明局部变量\
  \ `message` 会将其作用域限制仅限该块语句；当该名称在方法稍后使用时，该局部变量就“超出了作用域”。为了避免错误，你必须在块之外声明变量。\n\n**列表\
  \ 3.27：作用域外不可访问的变量**\n\n点击此处查看代码图像\n\n```cs\nclass Program\n{\n  static void Main(string[]\
  \ args)\n   {\n      int playerCount;\n      System.Console.Write(\n          \"\
  Enter the number of players (1 or 2):\");\n      playerCount = int.Parse(System.Console.ReadLine());\n\
  \      if (playerCount != 1 && playerCount != 2)\n      {\n        string message\
  \ = \"You entered an invalid number of players.\";\n      }\n      else\n      {\n\
  \        // ...\n        // Error: message 不在作用域内。\n        System.Console.WriteLine(message);\n\
  \      }\n}\n```\n\n输出 3.15 显示了列表 3.27 的运行结果\n\n**输出 3.15**\n\n点击此处查看代码图像\n\n```\n\
  ...\nProgram.cs(18,26): error CS0103: The name 'message' does not exist in the current\
  \ context\n```\n\n局部变量名称必须唯一的声明空间包含了在该块内文本上被包含的所有子块文本。C# 编译器防止直接声明在方法块内（或作为参数）的局部变量名在子代码块内被重用。在列表\
  \ 3.27 中，由于 `args` 和 `playerCount` 是在方法块内声明的，因此它们不能在子代码块内再次声明。`message` 在其声明所在的块范围内是有效的，即从其声明的块到该块结束，包括\
  \ `if` 语句的两个子块内。同样，`playerCount` 在包含其声明的块范围内都是有效的。\n\n### 语言对比：C++——局部变量的作用域\n\n\
  在 C++ 中，在块中声明的局部变量从声明点到该块结束都是作用域内的。因此，在声明之前引用该局部变量将失败，因为它不在作用域内。在 C# 中，规则略有不同：局部变量在其声明的整个块内都是作用域内的，但在声明之前引用它是非法的。也就是说，尝试查找该局部变量将成功，但随后会被视为错误。这只是\
  \ C# 许多试图防止 C++ 程序中常见错误的规则之一。\n\n### 布尔表达式\n\n`if` 语句的括号条件是一个**布尔表达式**。在列表 3.28\
  \ 中，条件被高亮显示。\n\n**列表 3.28：布尔表达式**\n\n点击此处查看代码图像\n\n```cs\nif (input < 9)\n{\n  //\
  \ 输入小于 9。\n  System.Console.WriteLine(\n      $\"Tic-tac-toe has more than { input\
  \ }\" +\n      \" maximum turns.\");\n}\n// ...\n```\n\n布尔表达式出现在许多控制流语句中。它们的关键特征是始终求值为\
  \ `true` 或 `false`。为了让 `input < 9` 允许作为布尔表达式，它必须产生 `bool`。例如，编译器不允许 `x = 42`，因为该表达式赋值了\
  \ `x` 并返回所赋值的值，而不是检查变量的值是否为 `42`。\n\n### 语言对比：C++——误用 = 代替 ==\n\nC# 消除了在 C 和 C++\
  \ 中常见的编码错误。在 C++ 中，列表 3.29 是允许的。\n\n**列表 3.29：C++ 允许 C# 不允许赋值作为条件**\n\n点击此处查看代码图像\n\
  \n```cs\nif (input = 9)   // 在 C++ 中允许，在 C# 中不允许。\n  System.Console.WriteLine(\n\
  \      \"Correct, tic-tac-toe has a maximum of 9 turns.\");\n```\n\n\n\n虽然乍看这段代码似乎是在检查\
  \ `input` 是否等于 `9`，但第 1 章已经指出 `=` 代表的是赋值运算符，而不是相等性检查。赋值运算符的返回值是赋值给变量的值——在本例中为 `9`。然而，`9`\
  \ 是一个 `int` 类型，因此它不被视为布尔表达式，且 C# 编译器不允许这样做。C 和 C++ 语言将非零整数视为 `true`，将零整数视为 `false`。相比之下，C#\
  \ 要求条件实际上必须是布尔类型；不允许使用整数。\n\n***\n\n### 关系运算符和相等运算符\n\n`关系和相等性` 运算符用于判断一个值是否大于、小于或等于另一个值。表\
  \ 3.2 列出了所有的关系运算符和相等运算符。它们都是二元运算符。\n\n![Image](img/03tab02.jpg)\n\n**表 3.2: 关系和相等运算符**\n\
  \nC# 的相等性语法使用 `==`，与许多其他编程语言一样。例如，要确定 `input` 是否等于 `9`，你使用 `input == 9`。相等运算符使用两个等号来区别于赋值运算符\
  \ `=`。感叹号在 C# 中表示“非”（NOT），因此要测试不相等，你使用不相等运算符 `!=`。\n\n关系运算符和相等运算符始终产生一个 `bool` 值，如列表\
  \ 3.30 所示。\n\n**列表 3.30: 将关系运算符的结果赋值给 bool 变量**\n\n***\n\n```\nbool result = 70\
  \ > 7;\n```\n\n***\n\n在井井棋程序中（参见附录 B），你使用相等运算符来判断用户是否已退出。列表 3.31 的布尔表达式包含一个 `||`\
  \ 逻辑运算符，下一节将详细讨论该运算符。\n\n**列表 3.31: 在布尔表达式中使用相等运算符**\n\n点击此处查看代码图片\n\n***\n\n```\n\
  if (input == \"\" || input == \"quit\")\n{\n  System.Console.WriteLine($\"Player\
  \ {currentPlayer} quit!!\");\n  break;\n}\n```\n\n***\n\n### 逻辑布尔运算符\n\n`逻辑运算符`\
  \ 具有布尔操作数并产生布尔结果。逻辑运算符允许你组合多个布尔表达式形成更复杂的布尔表达式。逻辑运算符有 `|`、`||`、`&`、`&&` 和 `^`，分别对应或（OR）、与（AND）和异或（exclusive\
  \ OR）。`|` 和 `&` 版本的或与与逻辑很少用于布尔逻辑，原因将在本节中讨论。\n\n#### 或逻辑运算符 (||)\n\n在列表 3.31 中，如果用户输入\
  \ `quit` 或在不输入值的情况下按回车，假设她想退出程序。为了给用户提供两种退出方式，你可以使用逻辑或运算符 `||`。`||` 运算符评估布尔表达式，如果任一个操作数为\
  \ `true`，则结果为 `true` 值（参见列表 3.32）。\n\n**列表 3.32: 使用或逻辑运算符**\n\n点击此处查看代码图片\n\n***\n\
  \n```\nif ((hourOfTheDay > 23) || (hourOfTheDay < 0))\n  System.Console.WriteLine(\"\
  The time you entered is invalid.\");\n```\n\n没有必要评估或表达式的两边，因为如果任一个操作数为 `true`，无论另一个操作数的值如何，结果确定为\
  \ `true`。与 C# 中的所有运算符一样，左操作数会在右操作数之前被评估，因此如果表达式的左部分评估为 `true`，则右部分将被忽略。在列表 3.32\
  \ 的示例中，如果 `hourOfTheDay` 的值为 `33`，那么 `(hourOfTheDay > 23)` 将评估为 `true`，或运算符将忽略表达式的后半部分，对其进行**短路处理（short-circuiting）**。短路处理也发生在逻辑与运算符上。（注意，这里没有括号也是必要的；逻辑运算符的优先级高于关系运算符。然而，对于初学者读者来说，为子表达式加上括号会更清晰。）\n\
  \n#### 与逻辑运算符 (&&)\n\n逻辑与运算符 `&&` 只有在两个操作数都评估为 `true` 时才会评估为 `true`。如果任一个操作数为 `false`，结果将为\
  \ `false`。列表 3.33 会在给定的变量同时大于 10 且小于 24 时写入一条消息。与或运算符类似，与运算符不会总是评估表达式的右侧。如果左操作数被确定为\
  \ `false`，无论右操作数的值如何，整体结果都为 `false`，因此运行时会跳过对右操作数的评估。\n\n**列表 3.33: 使用与逻辑运算符**\n\
  \n```\nif (hourOfTheDay > 10 && hourOfTheDay < 24)\n  System.Console.WriteLine(\"\
  message\");\n```\n\n#### 异或运算符 (^)\n\n脱号符号 `^` 是“异或”（XOR）运算符。当应用于两个操作数时，如果恰好有一个为\
  \ `true`，则异或运算符返回 `true`，如表 3.3 所示。\n\n#### 逻辑否定运算符 (!)\n\n逻辑否定，或“非”（NOT），`!` 反转一个\
  \ `bool` 值。列表 3.34 展示了它的工作原理。\n\n**列表 3.34: 使用否定运算符**\n\n```\nbool valid = false;\n\
  bool result = !valid;\n```\n\n#### 条件运算符 (?:)\n\n在需要使用 `if`-else` 语句选择两个值的情况下，可以使用**条件运算符**。条件运算符同时使用问号和冒号；通用格式如下：\n\
  \n`condition ? consequence : alternative`\n\n条件运算符三元运算符，因为它有三个操作数：`condition`、`consequence`\
  \ 和 `alternative`。（由于它是 C# 中唯一的三元运算符，通常被称为“三元运算符”，但通过其名称引用比通过操作数数量更清晰。）与逻辑运算符一样，条件运算符使用形式的短路。如果条件评估为\
  \ `true`，条件运算符只评估 `consequence`。如果条件评估为 `false`，则只评估 `alternative`。运算符的结果是评估后的表达式。\n\
  \n列表 3.35 阐释了条件运算符的使用。该程序的完整列表出现在附录 B。\n\n**列表 3.35: 条件运算符**\n\n```csharp\nclass\
  \ TicTacToe\n{\n  static void Main()\n  {\n    // 最初将 currentPlayer 设置为玩家 1\n  \
  \  int currentPlayer = 1;\n    // ...\n    for (int turn = 1; turn <= 10; turn++)\n\
  \    {\n      // ...\n      // 切换玩家\n      currentPlayer = (currentPlayer == 2)\
  \ ? 1 : 2;\n    }\n  }\n}\n```\n\n\n\n\n该程序切换当前玩家。为了做到这一点，它会检查当前值是否为 `2`。这是条件表达式的“条件”部分。如果条件的结果为\
  \ `true`，则条件运算符的结果为“结果”值 `1`。否则，它的结果为“备选”值 `2`。与 `if` 语句不同，条件运算符的结果必须被赋值（或作为参数传递）；它不能单独作为一个完整的语句出现。\n\
  \n***\n\n### 指南\n\n**考虑**使用 `if`/`else` 语句而不是过于复杂的条件表达式。\n\n***\n\n### 一致性\n\nC#\
  \ 语言要求条件运算符中的结果表达式和备选表达式的类型必须一致，并且在不检查表达式周围上下文的情况下确定该一致类型。例如，`f ? \"abc\" : 123`\
  \ 不是一个合法的条件表达式，因为结果值和备选值一个是字符串一个是数字，两者都无法相互转换。即使你写了 `object result = f ? \"abc\"\
  \ : 123;`，C# 编译器也会标记此表达式为非法，因为与两个表达式都一致的类型（即 `object`）是在条件表达式之外找到的。\n\n## 开始 2.0\n\
  \n## 空合并运算符 (??)\n\n`空合并运算符` 是一种表达“如果此值为空，则使用此另一个值”的简洁方式。它的形式如下：\n\n`expression1\
  \ ?? expression2`\n\n空合并运算符也使用了某种形式的短路逻辑。如果 `expression1` 不为空，则它的值就是操作的结果，并且不会评估另一个表达式。如果\
  \ `expression1` 确实为空，则 `expression2` 的值就是运算符的结果。与条件运算符不同，空合并运算符是一个二元运算符。\n\n列表 3.36\
  \ 展示了空合并运算符的使用。\n\n**列表 3.36: 空合并运算符**\n\n点击此处查看代码图片\n\n***\n\n```\nstring fileName\
  \ = GetFileName();\n\n// ...\n\nstring fullName = fileName ?? \"default.txt\";\n\
  \n// ...\n```\n\n***\n\n在此列表中，我们使用空合并运算符在 `fileName` 为空时将 `fullName` 设置为 `\"default.txt\"\
  `。如果 `fileName` 不为空，则直接将 `fileName` 的值赋给 `fullName`。\n\n空合并运算符可以很好地“链式”。例如，形式如 `x\
  \ ?? y ?? z` 的表达式在 `x` 不为空时结果为 `x`；否则，如果 `y` 不为空，则结果为 `y`；否则，结果为 `z`。也就是说，它从左到右处理并选取第一个非空表达式，或者在所有之前的表达式都为空时使用最后一个表达式。\n\
  \n空合并运算符是在 C# 2.0 版本中引入的，同时引入了可空值类型。该运算符同时适用于可空值类型和引用类型的两个操作数。\n\n`结束 2.0`\n\n##\
  \ 开始 6.0\n\n#### 空条件运算符 (?.)\n\n每当你对一个空值调用方法时，运行时将抛出 `System.NullReferenceException`，这几乎总是表明编程逻辑存在错误。考虑到这种模式的出现频率（即在调用成员之前检查是否为空），C#\
  \ 6.0 引入了 `?.` 运算符，即空条件运算符：\n\n**列表 3.37: 空条件运算符**\n\n点击此处查看代码图片\n\n***\n\n```\n\
  class Program\n{\n  static void Main(string[] args)\n  {\n      if (args?.Length\
  \ == 0)\n      {\n          System.Console.WriteLine(\n              \"ERROR: File\
  \ missing. \"\n              + \"Use:\\n\\tfind.exe file:<filename>\");\n      }\n\
  \      else\n      {\n          if (args[0]?.ToLower().StartsWith(\"file:\")??false)\n\
  \          {\n              string fileName = args[0]?.Remove(0, 5);\n         \
  \     // ...\n          }\n      }\n  }\n}\n```\n\n***\n\n空条件运算符通过在操作数为空时短路来防止 `NullReferenceException`。与嵌套的空检查相比，这允许代码更加简洁。\n\
  \n***\n\n高级主题：结合委托利用空条件运算符\n\n\n\n\n\n空条件操作符本身就是一个非常强大的特性。然而，将它与委托调用结合使用，解决了自 C#\
  \ 1.0 以来一直存在的 C# 痛点。注意下一页顶部附近的代码，`PropertyChange` 事件处理程序在检查检查值是否为空并最终触发事件之前，被赋值给了一个本地副本（`propertyChanged`）。这是调用事件的最线程安全的方法，且不会在检查空值和触发事件之间存在发生事件取消订阅的风险。遗憾的是，这种方法并不直观，且代码经常忽略遵循这种模式——导致抛出不一致的\
  \ `NullReferenceExceptions`。幸运的是，随着 C# 6.0 引入了空条件操作符，这个问题已经得到了解决。\n\n在 C# 6.0 中，对委托值的检查变为：\n\
  \n点击此处查看代码图像\n\n```csharp\nPropertyChangedEventHandler propertyChanged =\n  PropertyChanged;\n\
  \nif (propertyChanged != null)\n{\n  propertyChanged(this,\n      new PropertyChangedEventArgs(nameof(Name)));\n\
  }\n```\n\n变为简单的：\n\n点击此处查看代码图像\n\n```csharp\nPropertyChanged?.Invoke(propertyChanged(\n\
  \  this, new PropertyChangedEventArgs(nameof(Name)));\n```\n\n由于事件仅仅是一个委托，因此通过空条件操作符和\
  \ `Invoke()` 调用委托的模式总是可能的。\n\n***\n\n` 6.0 结束`\n\n### 位运算符 (<<, >>, |, &, ^, ~)\n\
  \n几乎所有编程语言中通用的另一组额外操作符是用于处理其二进制格式下值的操作符集：位运算符。\n\n***\n\n#### 初学者主题：位与字节\n\n计算机中的所有值都用\
  \ 1 和 0 的二进制位格式表示，称为**二进制位**（**bits**）。位以八位一组的形式组合，称为**字节**（**bytes**）。在一个字节中，每个连续的位对应于\
  \ 2 的某个幂次值，从右侧的 2⁰ 开始到左侧的 2⁷，如图 图 3.1 所示。\n\n![Image](img/03fig01.jpg)\n\n**图 3.1：相应的占位符值**\n\
  \n在许多场景中，特别是在处理底层或系统服务时，信息是以二进制数据的形式检索的。为了操作这些设备和服务，你需要对二进制数据进行操纵。\n\n在 图 3.2 中，每个框对应于所示的\
  \ 2 的幂值。字节（8 位数）的值是所有设置为 1 的八位所对应的 2 的幂之和。\n\n![Image](img/03fig02.jpg)\n\n**图 3.2：计算无符号字节的值**\n\
  \n上述二进制转换对于有符号数来说显著不同。有符号数（`long`、`short`、`int`）使用“补码”符号表示。这种做法确保了在向正数加上负数时，加法能够继续有效，就像两个都是正数操作数一样。使用这种表示法，负数的行为与正数不同。负数通过最左侧位置的\
  \ 1 来识别。如果最左侧位置包含 1，则加上包含 0 的位置而不是包含 1 的位置。每个位置对应于 2 的负幂值。此外，从结果中还有必要减去 1。这在 图 3.3\
  \ 中所示。\n\n![Image](img/03fig03.jpg)\n\n**图 3.3：计算有符号字节的值**\n\n因此，`1111 1111 1111\
  \ 1111` 对应于 –1，而 `1111 1111 1111 1001` 的值为 –7。二进制表示 `1000 0000 0000 0000` 对应 16\
  \ 位整数可以包含的最小负值。\n\n***\n\n#### 移位运算符 (<<, >>, <<=, >>=)\n\n有时你想将数字的二进制值向右或向左移动。在执行左移时，数字二进制表示中的所有位都会根据移位运算符右侧操作数指定的位数向左移动。然后使用\
  \ 0 来回填二进制数右侧的位置。右移运算符在相反方向上执行几乎相同的操作。然而，如果该数字是有符号类型的负值，则用于回填二进制数左侧的值是 1 而不是 0。移位运算符是\
  \ `>>` 和 `<<`，分别称为右移运算符和左移运算符。此外，还有组合移位和赋值运算符 `<<=` 和 `>>=`。\n\n考虑以下示例。假设你有一个 `int`\
  \ 类型的值 `-7`，其二进制表示为 `1111 1111 1111 1111 1111 1111 1111 1001`。在 列表 3.39 中，你将数字 –7\
  \ 的二进制表示右移两个位置。\n\n**列表 3.39：使用右移运算符**\n\n点击此处查看代码图像\n\n***\n\n```csharp\nint x;\n\
  \nx = -7; // 11111111 11111111 11111111 11111001\nx = x >> 2; // 11111111 11111111\
  \ 11111111 11111110\n\nConsole.WriteLine(x); // 输出为 -2\n```\n\n点击此处查看代码图像\n\n由于事件仅仅是一个委托，因此通过空条件操作符和\
  \ `Invoke()` 调用委托的模式总是可能的。\n\n***\n\n```csharp\nPropertyChangedEventHandler propertyChanged\
  \ =\n  PropertyChanged;\n\nif (propertyChanged != null)\n{\n  propertyChanged(this,\n\
  \      new PropertyChangedEventArgs(nameof(Name)));\n}\n```\n\n``` 11111111 11111111\
  \ 11111111 11111001\n11111111 11111111 11111111 11111110\n11111111 11111111 11111111\
  \ 11111111\n11111111 11111111 11111111 11111111\n11111111 11111111 11111111 11111111\n\
  11111111 11111111 11111111 11111111\n11111111 11111111 11111111 11111111\n11111111\
  \ 11111111 11111111 11111111\n```\n\n译文：在 列表 3.39 中，你将数字 –7 的二进制表示右移两个位置。\n\n[/content]\
