  \ {0}\", numbers.Average());\n      Print(\"Sum: {0}\", numbers.Sum());\n      Print(\"\
  Max: {0}\", numbers.Max());\n      Print(\"Min: {0}\", numbers.Min());\n  }\n  private\
  \ static void Print<T>(\n          string format, IEnumerable<T> items) =>\n   \
  \ Console.WriteLine(format, string.Join(\n      \", \", items.Select(x => x.ToString())));\n\
