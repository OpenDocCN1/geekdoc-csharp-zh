  \ `short` 等其他数值类型上使用它会将操作数转换为相应的这些类型之一。\n\n## 算术二元运算符 (+, -, *, /, %)\n\n二元运算符需要两个操作数。C#\
  \ 对二元运算符使用中缀表示：运算符出现在左右操作数之间。除了赋值之外，每个二元运算符的结果都必须以某种方式使用——例如，作为另一个表达式（如赋值）的操作数。\n\
  \n* * *\n\n### 语言对比：C++—仅运算符语句\n\n与之前提到的规则不同，C++ 允许单个二元表达式形成整个语句（例如 `4+5`）并编译。在\
  \ C# 中，仅允许赋值、调用、增、减和对象创建表达式作为整个语句。\n\n* * *\n\n列表 3.3 中的减法示例说明了二元运算符的使用——更具体地说是算术二元运算符。操作数出现在算术运算符的侧边，然后赋值计算的值。其他算术二元运算符包括加法（`+`）、除法（`/`）、乘法（`*`）和余数（`%`——有时称为模运算符）。\n\
  \n### 列表 3.3：使用二元运算符\n\n点击此处查看代码图像\n\n* * *\n\n```csharp\nclass Division\n{\n  static\
  \ void Main()\n  {\n      int numerator;\n      int denominator;\n      int quotient;\n\
  \      int remainder;\n\n      System.Console.Write(\"Enter the numerator: \");\n\
  \      numerator = int.Parse(System.Console.ReadLine());\n      System.Console.Write(\"\
  Enter the denominator: \");\n      denominator = int.Parse(System.Console.ReadLine());\n\
  \      quotient = numerator / denominator;\n      remainder = numerator % denominator;\n\
  \n      System.Console.WriteLine(\n          $\"{numerator} / {denominator} = {quotient}\
  \ with remainder {remainder}\");\n  }\n}\n```\n\n* * *\n\n输出 3.1 显示了列表 3.3 的结果。\n\
