    ## WITH EXAMPLE PROJECT


    ### 1. FC01 READ COIL STATUS


    ![C:\Users\HOANGL~1\AppData\Local\Temp\SNAGHTML81874a.PNG](images/00003.jpeg)


    #### Function 01 (01hex) Read Coils


    Reads the ON/OFF status of discrete coils in the slave.


    #### Request

    The request message specifies the starting coil and quantity of coils to be read.

    Example of a request to read 10...22 (Coil 11 to 23) from slave device address
    4:


    | Field Name | RTU (hex) |

    | :--- | :--- |

    | Header | None |

    | Slave Address | 04 |

    | Function | 01 |

    | Starting Address Hi | 00 |

    | Starting Address Lo | 0A |

    | Quantity of Coils Hi | 00 |

    | Quantity of Coils Lo | 0D |

    | Error Check Lo | DD |

    | Error Check Hi | 98 |

    | Trailer | None |

    | Total Bytes | 8 |


    #### Response

    The coil status response message is packed as one coil per bit of the data field.
    Status is indicated as: 1 is the value ON, and 0 is the value OFF. The LSB of
    the first data byte contains the coil addressed in the request. The other coils
    follow toward the high-order end of this byte and from low order to high order
    in subsequent bytes. If the returned coil quantity is not a multiple of eight,
    the remaining bits in the final data byte will be padded with zeroes (toward the
    high-order end of the byte). The byte count field specifies the quantity of complete
    bytes of data.


    Example of a response to the request:


    | Field Name | RTU (hex) |

    | :--- | :--- |

    | Header | None |

    | Slave Address | 04 |

    | Function | 01 |

    | Byte Count | 02 |

    | Data (Coils 7...10) | 87 |

    | Data (Coils 27...20) | 02 |

    | Error Check Lo | 97 |

    | Error Check Hi | CD |

    | Trailer | None |

    | Total Bytes | 7 |


    ### 2. FC02 READ INPUT STATUS


    ![C:\Users\HOANGL~1\AppData\Local\Temp\SNAGHTML8e32a6.PNG](images/00004.jpeg)


    #### Function 02(02hex) Read Discrete Inputs


    Reads the ON/OFF status of discrete inputs in the slave.


    #### Request

    The request message specifies the starting input and quantity of inputs to be
    read.

    Example of a request to read 10...22 (input 10011 to 10023) from slave device
    address 4:


    | Field Name | RTU (hex) |

    | :--- | :--- |

    | Header | None |

    | Slave Address | 04 |

    | Function | 02 |

    | Starting Address Hi | 00 |

    | Starting Address Lo | 0A |

    | Quantity of inputs Hi | 00 |

    | Quantity of inputs Lo | 0D |

    | Error Check Lo | 99 |

    | Error Check Hi | 98 |

    | Trailer | None |

    | Total Bytes | 8 |


    #### Response

    The input status response message is packed as one input per bit of the data field.
    Status is indicated as: 1 is the value ON, and 0 is the value OFF. The LSB of
    the first data byte contains the input addressed in the request. The other inputs
    follow toward the high-order end of this byte and from low order to high order
    in subsequent bytes. If the returned input quantity is not a multiple of eight,
    the remaining bits in the final data byte will be padded with zeroes (toward the
    high-order end of the byte). The byte count field specifies the quantity of complete
    bytes of data.


    Example of a response to the request:


    | Field Name | RTU (hex) |

    | :--- | :--- |

    | Header | None |

    | Slave Address | 04 |

    | Function | 02 |

    | Byte Count | 02 |

    | Data (Inputs 17...10) | 53 |

    | Data (Inputs 27...20) | 1E |

    | Error Check Lo | 99 |

    | Error Check Hi | 40 |

    | Trailer | None |

    | Total Bytes | 7 |


    ### 3. FC03 READ HOLDING REGISTERS


    ![C:\Users\HOANGL~1\AppData\Local\Temp\SNAGHTMLb048f.PNG](images/00005.jpeg)


    #### Function 03 (03hex) Read Holding Registers


    Read the binary contents of holding registers in the slave.


    #### Request

    The request message specifies the starting register and quantity of registers.

    Example of a request to read 0...1 (register 4001 to 4002) from slave device 1:


    | Field Name | RTU (hex) |

    | :--- | :--- |

    | Header | None |

    | Slave Address | 01 |

    | Function | 03 |

    | Starting Address Hi | 00 |

    | Starting Address Lo | 00 |

    | Quantity of Registers Hi | 00 |

    | Quantity of Registers Lo | 02 |

    | Error Check Lo | C4 |

    | Error Check Hi | 0B |

    | Trailer | None |

    | Total Bytes | 8 |


    #### Response

    The register data in the response message are packed as two bytes per register,
    with the binary contents right justified each byte. For each register the first
    byte contains the high-order bits, and the second contains the low-order bits.


    Example of a response to the request:


    | Field Name | RTU (hex) |

    | :--- | :--- |

    | Header | None |

    | Slave Address | 01 |

    | Function | 03 |

    | Byte Count | 04 |

    | Data Hi | 04 |

    | Data Lo | B0 |

    | Data Hi | 07 |

    | Data Lo | BF |

    | Error Check Lo | B9 |

    | Error Check Hi | 64 |

    | Trailer | None |

    | Total Bytes | 9 |


