    正常响应返回从站地址、功能码、起始地址和线圈数量。以下是上述请求的响应。


    | 字段名称 | TCP (hex) |

    | :--- | :--- |

    | 事务标识符高位 | 00 |

    | 事务标识符低位 | 0F |

    | 协议标识符高位 | 00 |

    | 协议标识符低位 | 00 |

    | 消息长度高位 | 00 |

    | 消息长度低位(后跟 6 字节) | 06 |

    | 单元标识符 | 01 |

    | 功能码 | 0F |

    | 起始高位 | 00 |

    | 起始低位 | 13 |

    | 线圈数量高位 | 00 |

    | 线圈数量低位 | 10 |

    | 总字节数 | 15 |


