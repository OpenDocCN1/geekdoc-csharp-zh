    | 功能码 | 05 |

    | 起始高位 | 00 |

    | 起始低位 | 00 |

    | 写入数据高位 (FF 开启线圈，=00 关闭线圈 (回显)) | FF |

    | 写入数据低位 | 00 |

    | 总字节数 | 12 |


