    ### 2. FC02 读取输入状态


    ![C:\Users\HOANGL~1\AppData\Local\Temp\SNAGHTML8e32a6.PNG](img/00004.jpeg)


    #### 功能 02 (02hex) 读取离量


    读取从站中的离散输入状态。


    #### 请求

    请求消息指定了要读取的起始输入和数量。

    从从站地址 4 读取 10...22（输入 11 到 23）的请求示例：


    | 字段名称 | RTU (十六进制) |

    | :--- | :--- |

    | 头部 | 无 |

    | 从站地址 | 04 |

    | 功能 | 02 |

    | 起始地址高 | 00 |

    | 起始地址低 | 0A |

    | 输入数量高 | 00 |

    | 输入数量低 | 0D |

    | 校验低 | 99 |

    | 校验高 | 98 |

    | 尾部 | 无 |

    | 总字节数 | 8 |


    #### 响应

    输入状态响应消息数据字段中的每个位封装为一个输入。状态表示为：1 为开启，0 为关闭。第一个数据字节的低位包含请求中的输入。其他输入从该字节的高位向后续字节字节。如果返回的输入数量不是
    8 的倍数，最后一个数据字节的剩余位将补零（向高位）。字节计数字段指定数据的完整字节数。


    请求的响应示例：


    | 字段名称 | RTU (十六进制) |

    | :--- | :--- |

    | 头部 | 无 |

    | 从站地址 | 04 |

    | 功能 | 02 |

    | 字节计数 | 02 |

    | 数据 (输入 17...10) | 53 |

    | 数据 (输入 27...20) | 1E |

    | 校验低 | 99 |

    | 校验高 | 40 |

    | 尾部 | 无 |

    | 总字节数 | 7 |


