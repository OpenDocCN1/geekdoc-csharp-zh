    # 第一部分：MODBUS TCP


    ### 1. FC01 读取线圈状态

    ![](img/00003.jpeg)


    功能 `01` (`01hex`) 读取线圈（Read Coils）用于读取从站中离散线圈的开启/关闭状态。


    #### 请求

    请求消息指定了要读取的起始线圈和线圈数量。

    从从站设备地址 `4` 读取 `10...22`（线圈 `11` 到 `23`）的请求示例：


    | 字段名称 | TCP/IP (十六进制) |

    | :--- | :--- |

    | 事务标识符高位 | `00` |

    | 事务标识符低位 | `01` |

    | 协议标识符高位 | `00` |

    | 协议标识符低位 | `00` |

    | 消息长度高位 | `00` |

    | 消息长度低位(后接 6 字节) | `06` |

    | 单元标识符 | `04` |

    | 功能码 | `01` |

    | 起始地址高位 | `00` |

    | 起始地址低位 | `0A` |

    | 线圈数量高位 | `00` |

    | 线圈数量低位 | `0D` |

    | 总字节数 | `12` |


    #### 响应

    线圈状态响应消息封装为数据字段中的每位一个线圈。状态指示为：`1` 表示值开启 (ON)，`0` 表示值关闭 (OFF)。第一个数据字节的 `LSB`（最低位）包含请求中指定的线圈。其他线圈向该字节的高位延伸，并在随后的字节中从低位到高位排列。如果返回的线圈数量不是
    8 的倍数，最后一个数据字节中的剩余位将用零填充（向字节的高位填充）。字节计数字段指定了数据完整字节的数量。


    该请求的响应示例：


    | 字段名称 | RTU (十六进制) |

    | :--- | :--- |

    | 事务标识符高位 | `00` |

    | 事务标识符低位 | `01` |

    | 协议标识符高位 | `00` |

    | 协议标识符低位 | `00` |

    | 消息长度高位 | `00` |

    | 消息长度低位(后接 5 字节) | `05` |

    | 单元标识符 | `04` |

    | 功能码 | `01` |

    | 字节计数 | `02` |

    | 数据 (线圈 `7...10`) | |

    | 数据 (线圈 `27...20`) | |

    | 总字节数 | `11` |


    ### 2. FC02 读取输入状态

    ![](img/00004.jpeg)


    功能 `02` (`02hex`) 读取离散输入（Read Discrete Inputs）用于读取从站中离散输入的开启/关闭状态。


    #### 请求

    请求消息指定了要读取的起始输入和输入数量。

    从从站设备地址 `4` 读取 `10...22`（输入 `10011` 到 `10023`）的请求示例：


    | 字段名称 | RTU (十六进制) |

    | :--- | :--- |

    | 事务标识符高位 | `00` |

    | 事务标识符低位 | `02` |

    | 协议标识符高位 | `00` |

    | 协议标识符低位 | `00` |

    | 消息长度高位 | `00` |

    | 消息长度低位(后接 6 字节) | `06` |

    | 单元标识符 | `04` |

    | 功能码 | `02` |

    | 起始地址高位 | `00` |

    | 起始地址低位 | `0A` |

    | 线圈数量高位 | `00` |

    | 线圈数量低位 | `0D` |

    | 总字节数 | `12` |


    #### 响应

    输入状态响应消息封装为数据字段中的每位一个输入。状态指示为：`1` 是值开启 (ON)，`0` 是值关闭 (OFF)。第一个数据字节的 `LSB` 包含请求中的输入。其他输入向该字节的高位延伸，并在随后的字节中从低位到高位排列。如果返回的输入数量不是
    8 的倍数，最后一个数据字节中的剩余位将用零填充（向字节的高位填充）。字节计数字段指定了数据完整字节的数量。


    该请求的响应示例：


    | 字段名称 | RTU (十六进制) |

    | :--- | :--- |

    | 事务标识符高位 | `00` |

    | 事务标识符低位 | `01` |

    | 协议标识符高位 | `00` |

    | 协议标识符低位 | `00` |

    | 消息长度高位 | `00` |

    | 消息长度低位(后接 5 字节) | `05` |

    | 单元标识符 | `04` |

    | 功能码 | `02` |

    | 字节计数 | `02` |

    | 数据 (输入 `17...10`) | `53` |

    | 数据 (输入 `27...20`) | `1E` |

    | 总字节数 | `11` |


    ### 3. FC03 读取保持器寄存器

    ![](img/00005.jpeg)


    功能 `03` (`03hex`) 读取保持器寄存器（Read Holding Registers）用于读取从站中保持器寄存器的二进制内容。


    #### 请求

    请求消息指定了要读取的起始寄存器和寄存器数量。

    从设备地址 `1` 读取 `0...1`（寄存器 `4001` 到 `4002`）的请求示例：


    | 字段名称 | TCP (十六进制) |

    | :--- | :--- |

    | 事务标识符高位 | `00` |

    | 事务标识符低位 | `03` |

    | 协议标识符高位 | `00` |

    | 协议标识符低位 | `00` |

    | 消息长度高位 | `00` |

    | 消息长度低位(后接 6 字节) | `06` |

    | 单元标识符 | `01` |

    | 功能码 | `03` |

    | 起始地址高位 | `00` |

    | 起始地址低位 | `00` |

    | 寄存器数量高位 | `00` |

    | 寄存器数量低位 | `02` |

    | 总字节数 | `12` |


    #### 响应

