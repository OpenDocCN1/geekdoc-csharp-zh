    | 消息长度低位(后跟 6 字节) | 06 |

    | 单元标识符 | 01 |

    | 功能码 | 05 |

    | 起始高位 | 00 |

    | 起始低位 | 00 |

    | 写入数据高位 | FF |

    | 写入数据低位 | 00 |

    | 总字节数 | 12 |


    ### 响应


    正常响应是请求的回显，在线圈状态写入后返回。


    请求的响应示例：


    | 字段名称 | TCP (hex) |

    | :--- | :--- |

    | 事务标识符高位 | 00 |

    | 事务标识符低位 | 05 |

