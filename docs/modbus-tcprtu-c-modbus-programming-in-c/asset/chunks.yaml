    ![C:\Users\HOANGL~1\AppData\Local\Temp\SNAGHTMLc5d74.PNG](images/00006.jpeg)


    #### Function 04 (04hex) Read Input Registers


    Read the binary contents of input registers in the slave.


    #### Request

    The request message specifies the starting register and quantity of registers.

    Example of a request to read 0...1 (register 30001 to 30002) from slave device
    1:


    | Field Name | RTU (hex) |

    | :--- | :--- |

    | Header | None |

    | Slave Address | 01 |

    | Function | 04 |

    | Starting Address Hi | 00 |

    | Starting Address Lo | 00 |

    | Quantity of Registers Hi | 00 |

    | Quantity of Registers Lo | 02 |

    | Error Check Lo | 71 |

    | Error Check Hi | CB |

    | Trailer | None |

    | Total Bytes | 8 |


    #### Response

    The register data in the response message are packed as two bytes per register,
    with the binary contents right justified each byte. For each register the first
    byte contains the high-order bits, and the second contains the low-order bits.


    Example of a response to the request:


    | Field Name | RTU (hex) |

    | :--- | :--- |

    | Header | None |

    | Slave Address | 01 |

    | Function | 04 |

    | Byte Count | 04 |

    | Data Hi | 07 |

    | Data Lo | C9 |

    | Data Hi | 07 |

    | Data Lo | DD |

    | Error Check Lo | E8 |

    | Error Check Hi | A7 |

    | Trailer | None |

    | Total Bytes | 9 |


    ### 5. FC05 WRITE SINGLE COIL


    ![images/00007.jpeg)


    #### Function 05 (05hex) Write Single Coil


    Writes a single coil to either ON or OFF.


    #### Request

    The request message specifies the coil reference to be written. Coils are addressed
    starting at zero-coil 1 is addressed as 0.

    The requested ON / OFF state is specified by a constant in the request data field.
    A value of `FF 00` hex requests the coil to be ON. A value of `00 00` requests
    it to be OFF. All other values are illegal and will not affect the coil.


    Here is an example of a request to write coil 0 ON in slave device 1:


    | Field Name | RTU (hex) |

    | :--- | :--- |

    | Header | None |

    | Slave Address | 01 |

    | Function | 05 |

    | Coil Address Hi | 00 |

    | Coil Address Lo | 00 |

    | Write Data Hi | FF |

    | Write Data Lo | 00 |

    | Error Check Lo | 8C |

    | Error Check Hi | 3A |

    | Trailer | None |

    | Total Bytes | 8 |


    #### Response

    The normal response is an echo of the request, returned after the coil state has
    been written.


    Example of a response to the request:


    | Field Name | RTU (hex) |

    | :--- | :--- |

    | Header | None |

    | Slave Address | 01 |

    | Function | 05 |

    | Coil Address Hi | 00 |

    | Coil Address Lo | 00 |

    | Write Data Hi | FF |

    | Write Data Lo | 00 |

    | Error Check Lo | 8C |

    | Error Check Hi | 3A |

    | Trailer | None |

    | Total Bytes | 8 |


    ### 6. FC06 WRITE SINGLE REGISTER


    ![C:\Users\HOANGL~1\AppData\Local\Temp\SNAGHTML6a190d.PNG](images/00008.jpeg)


    #### Function 06 (06hex) Write Single Register


    Writes a value into a single holding register.


