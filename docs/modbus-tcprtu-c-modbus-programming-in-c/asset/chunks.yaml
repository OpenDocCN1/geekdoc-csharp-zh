    ## 示例项目


    ### 1. FC01 读取线圈状态


    ![C:\Users\HOANGL~1\AppData\Local\Temp\SNAGHTML1874a.PNG](img/00003.jpeg)


    #### 功能 01 (01hex) 读取线圈


    读取从站中的离散线圈状态。


    #### 请求

    请求消息指定了要读取的起始线圈和数量。

    从从站地址 4 读取 0...22（线圈 1 到 23）的请求示例：


    | 字段名称 | RTU (十六进制) |

    | :--- | :--- |

    | 头部 | 无 |

    | 从站地址 | 04 |

    | 功能 | 01 |

    | 起始地址高 | 00 |

    | 起始地址低 | 0A |

    | 线圈数量高 | 00 |

    | 线圈数量低 | 0D |

    | 校验低 | DD |

    | 校验高 | 98 |

    | 尾部 | 无 |

    | 总字节数 | 8 |


    #### 响应

    线圈状态响应消息数据字段中的每个位封装为一个线圈。状态表示为：1 为开启，0 为关闭。第一个数据字节的低位包含请求中的线圈。其他线圈从该字节的高位向后续字节字节。如果返回的线圈数量不是
    8 的倍数，最后一个数据字节的剩余位将补零（向高位）。字节计数字段指定数据的完整字节数。


    请求的响应示例：


    | 字段名称 | RTU (十六进制) |

