    \ when attempting to access an element that does not exist in a collection.\n\
    7. `RuntimeException`: A general exception type for runtime errors that do not\
    \ fit into more specific categories.\n\n### The `try`-catch` Block\nIn Scala,\
    \ you can handle exceptions using the `try`-catch` block, which allows you to\
    \ specify code that might throw an exception and provide a block of code to handle\
    \ the exception if it occurs. Here's the basic syntax:\n\n```scala\ntry {\n  //\
