    # # Chapter 4: Functions in Scala: Defining and Using


    In the previous chapters, we''ve covered essential Scala concepts like variables
    and data types. Now, it''s time to dive deeper into one of the most fundamental
    building blocks of any programming language: functions. In this chapter, we''ll
    explore how to define, use, and leverage the power of functions in Scala.


    ## Functions: The Building Blocks of Scala


    A function is a self-contained block of code that performs a specific task. Functions
    are the workhorses of programming, allowing you to encapsulate logic, reuse code,
    and make your programs more modular and readable. In Scala, functions are first-class
    citizens, meaning they can be assigned to variables, passed as arguments, and
    returned as results. This flexibility enables powerful and expressive programming.


    ### Defining a Function


    In Scala, you define a function using the `def` keyword, followed by the function
    name, a list of parameters enclosed in parentheses, a colon (`:`), and the return
    type. Here''s a basic function that adds two integers:


    ```scala


    def add(x: Int, y: Int): Int = {


    x + y


    }


    ```


    In this example:


    - `add` is the function name.


    - `(x: Int, y: Int)` defines two parameters, `x` and `y`, both of type `Int`.


    - `: Int` specifies the return type of the function, which is also `Int`.


    - `{ x + y }` contains the function''s body, where `x + y` is the expression that
    calculates the sum of `x` and `y`.


    ### Calling a Function


    Once you''ve defined a function, you can call it by using its name followed by
    parentheses containing the arguments. Here''s how you call the `add` function:


    ```scala


    val result: Int = add(5, 3)


    ```


    In this example, we pass `5` and `3` as arguments to the `add` function, and it
    returns `8`, which is then assigned to the `result` variable.


    ### Function Without Parameters


    A function can also have no parameters. For example, here''s a function that generates
    a random number:


    ```scala


    import scala.util.Random


    def getRandomNumber(): Int = {


    Random.nextInt(100)


    }


    ```


    In this case, `getRandomNumber` takes no arguments and returns a random integer
    between 0 (inclusive) and 100 (exclusive).


    ### Function with Default Parameters


    Scala allows you to define functions with default parameter values. Default parameters
    provide flexibility by allowing callers to omit certain arguments, using the default
    value instead. Here''s an example:


    ```scala


    def greet(name: String = "Guest"): String = {


    s"Hello, $name!"


    }


    ```


    In this function, `name` is a parameter with a default value of `"Guest"`. If
    you call `greet()` without providing an argument, it will use the default value
    and return `"Hello, Guest!"`. However, you can still provide a custom `name` when
    calling the function: `greet("Alice")` would return `"Hello, Alice!"`.


    ### Function with Named Arguments


    Scala allows you to specify function arguments by name when calling a function.
    This feature provides clarity, especially when a function has multiple parameters.
    For instance:


    ```scala


    def printName(firstName: String, lastName: String): Unit = {


    println(s"First Name: $firstName, Last Name: $lastName")


    }


    printName(lastName = "Smith", firstName = "John")


    ```


    By using named arguments, you can provide the arguments in any order, making the
    code more readable.


    ### Function with Variable Number of Arguments


    Sometimes, you may want a function to accept a variable number of arguments. Scala
    allows you to do this using the `*` operator with a parameter. These arguments
    are treated as a sequence within the function. Here''s an example of a function
    that calculates the sum of multiple numbers:


    ```scala


    def sum(numbers: Int*): Int = {


    numbers.sum


    }


    val total: Int = sum(1, 2, 3, 4, 5)


    ```


    In this code, `numbers: Int*` indicates that `numbers` can accept a variable number
    of integers. The `sum` function then uses the `sum` method provided by the `Seq`
    data type to calculate the total sum.


    ### Anonymous Functions (Lambdas)


    Scala supports anonymous functions, often referred to as lambdas or function literals.
    These are functions without a defined name, created on-the-fly. Anonymous functions
    are concise and are commonly used in scenarios like passing functions as arguments
    to higher-order functions. Here''s an example:


    ```scala


    val add: (Int, Int) => Int = (x, y) => x + y


    ```


    In this code, we define an anonymous function that takes two integers (`x` and
    `y`) as parameters and returns their sum. The type of `add` is specified as `(Int,
    Int) => Int`, indicating a function that takes two `Int` parameters and returns
    an `Int`.


    ### Higher-Order Functions


    Higher-order functions are functions that take other functions as parameters or
    return functions as results. They enable powerful abstractions and are a key feature
    of functional programming. In Scala, higher-order functions are commonly used
    for operations like mapping, filtering, and reducing collections.


    #### `map` Function


    The `map` function applies a given function to each element of a collection and
    returns a new collection with


    the results. Here''s an example using `map` to double each element in a list:


    ```scala


    val numbers: List[Int] = List(1, 2, 3, 4, 5)


    val doubledNumbers: List[Int] = numbers.map(x => x * 2)


    ```


    In this code, the anonymous function `(x => x * 2)` is passed to `map`, doubling
    each element in the `numbers` list.


    #### `filter` Function


    The `filter` function selects elements from a collection that satisfy a given
    condition. It returns a new collection containing the filtered elements. Here''s
    an example using `filter` to select even numbers from a list:'
