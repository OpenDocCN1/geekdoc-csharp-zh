    \ 案例类 (Case Classes)\n\nScala 提供了一种特殊的类类型，称为案例类（case class）。案例类主要用于数据建模，且定义简洁。它们带有等性比较、模式匹配和不可变性等内置功能。\n\
    \n这里是一个案例类的示例：\n\n```scala\ncase class Point(x: Int, y: Int)\n\nval p1 = Point(1,\
    \ 2)\nval p2 = Point(1, 2)\n\nprintln(p1 == p2) // 输出: true (自动等性比较)\n```\n\n\
    在这段代码中，我们定义了一个带有两个字段 `x` 和 `y` 的 `Point` 案例类。我们创建了两个 `Point` 实例并使用 `==` 运算符比较它们的相等性。案例类会自动生成\
    \ `equals` 方法来比较其字段的值。\n\n案例类通常用于表示结构化数据，例如坐标、用户配置或配置设置。\n\n## 单例对象 (Singleton\
    \ Objects)\n\n在 Scala 中，你可以定义单例对象，它们是类的唯一实例。单例对象通常用于管理配置设置、创建工具函数或作为应用程序的入口等任务。\n\
    \n这里是一个单例对象的示例：\n\n```scala\nobject Logger {\n  def log(message: String): Unit\
    \ = println(s\"Log: $message\")\n}\n\nLogger.log(\"This is a log message\")\n\
    ```\n\n在这段代码中，我们定义了一个名为 `Logger` 的带有 `log` 方法的单例对象。我们可以直接在 `Logger` 对象上调用 `log`\
    \ 方法，无需创建它的实例。单例对象在首次被访问时延迟初始化并且是线程安全的。\n\n## 伴生对象 (Companion Objects)\n\n在 Scala\
    \ 中，每个类都可以有一个同名的伴生对象。伴生对象通常用于定义工厂方法与其他类的静态成员。它们提供了一种封装类级功能的方便方法。\n\n这里是一个伴生对象的示例：\n\
    \n```scala\nclass Circle(radius: Double) {\n  def area: Double = Circle.PI * radius\
