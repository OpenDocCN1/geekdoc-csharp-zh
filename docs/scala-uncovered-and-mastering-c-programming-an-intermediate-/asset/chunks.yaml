    \ 中的泛型\n\n泛型（也称为参数泛型）允许你编写可以在多种类型上运行的代码同时保持类型安全。Scala 的泛型既有表现力又简洁，是构建复用代码的功能。\n\
    \n### 泛型简介\n\nScala 中的泛型使用类型参数表示。类型参数是在泛泛类或方法时定义的占位符。这允许你创建处理不同类型的类和函数。\n\n####\
    \ 泛型类\n\n让我们来看一个存储不同值的 `Box` 类示例：\n\n```scala\nclass BoxT {\n  def getValue: T\
    \ = value\n}\n```\n\n在这个示例中，`T` 是一个类型参数，代表 `Box` 类存储值的类型。你可以为不同的类型创建 `Box` 的实例：\n\
    \n```scala\nval intBox = new Box(42)\nval stringBox = new Box(\"Scala\")\n```\n\
    \n类型参数 `T` 会根据提供的值进行推断。\n\n#### 泛型方法\n\nScala 还允许在非泛型类中定义泛型方法。这里有一个处理各种类型的泛型方法\
    \ `printValue` 的示例：\n\n```scala\nclass Printer {\n  def printValueT: Unit = println(value)\n\
    }\n\nval printer = new Printer\nprinter.printValue(42)\nprinter.printValue(\"\
    Scala\")\n```\n\n在这种情况下，类型参数 `T` 定义在方法级别，每次调用 `printValue` 时都可以代表不同的类型。\n\n###\
    \ 泛型的变性 (Variance)\n\n泛型的变性指的是参数化类型之间的子类型关系与其组件类型之间的子类型关系。Scala 支持三种变性：`+`（协变）、`-`（逆变）和不加注解（不变）。\n\
    \n#### 协变类型 (+)\n\n"
- fmt: "\nA covariant type parameter is one where subtyping relationships are preserved.\
    \ If `A` is a subtype of `B`, then `Box[A]` is considered a subtype of `Box[B]`.\
    \ This is indicated by using the `+` annotation.\n\n```scala\nclass Box[+T](value:\
    \ T)\n\nval intBox: Box[Int] = new Box(42)\n\nval numberBox: Box[Number] = intBox\n\
    ```\n\nIn this example, because `Box` is covariant, you can assign a `Box[Int]`\
    \ to a `Box[Number]`, as `Int` is a subtype of `Number`.\n\n### Contravariant\
    \ Types (-)\n\nA contravariant type parameter is one where subtyping relationships\
    \ are reversed. If `A` is a subtype of `B`, then `Box[B]` is considered a subtype\
    \ of `Box[A]`. This is indicated by using the `-` annotation.\n\n```scala\nclass\
    \ Box[-T](value: T)\n\nval numberBox: Box[Number] = new Box(42.0)\n\nval intBox:\
    \ Box[Int] = numberBox\n```\n\nIn this example, because `Box` is contravariant,\
    \ you can assign a `Box[Number]` to a `Box[Int]`, as `Number` is a supertype of\
    \ `Int`.\n\n### Invariant Types\n\nAn invariant type parameter is one where there\
    \ is no subtyping relationship between parameterized types. In other words, `Box[A]`\
    \ is neither a subtype nor a supertype of `Box[B]` if `A` and `B` are different\
    \ types.\n\n```scala\nclass Box[T](value: T)\n\nval intBox: Box[Int] = new Box(42)\n\
    \nval stringBox: Box[String] = intBox // Error: Type mismatch\n```\n\nIn this\
    \ example, `intBox` and `stringBox` cannot be assigned to each other because `Box`\
    \ is invariant.\n\n### Bounds in Generics\n\nBounds in generics allow you to restrict\
    \ the types that can be used as type parameters. There are two types of bounds:\
    \ upper bounds and lower bounds.\n\n#### Upper Bounds\n\nAn upper bound restricts\
    \ the type parameter to be a subtype of a specific type. You specify an upper\
    \ bound using the `<:` operator. For example:\n\n```scala\nclass Box[T <: Number](value:\
    \ T)\n```\n\nIn this case, `T` can be any subtype of `Number`. You can create\
    \ instances of `Box` for `Int`, `Double`, and other subtypes of `Number`.\n\n\
    #### Lower Bounds\n\nA lower bound restricts the type parameter to be a supertype\
    \ of a specific type. You specify a lower bound using the `>:` operator. For example:\n\
    \n```scala\nclass Box[T >: Int](value: T)\n```\n\nIn this case, `T` can be any\
    \ supertype of `Int`. You can create instances of `Box` for `Number`, `Any`, and\
    \ supertypes of `Int`.\n\n### Type Erasure\n\nScala uses type erasure at runtime\
    \ to maintain compatibility with Java's JVM. This means that generic type information\
    \ is not available at runtime. For example, you cannot distinguish between `Box[Int]`\
    \ and `Box[String]` instances at runtime. Type erasure has implications for pattern\
    \ matching, reflection, and other runtime operations.\n\n## Traits in Scala\n\n\
    Traits are a fundamental building block in Scala's object-oriented programming\
    \ model. They allow you to define a reusable set of fields and methods that can\
    \ be mixed into classes. Traits enable code reuse and composition, promoting modularity\
    \ and maintainability.\n\n### Defining Traits\n\nA trait is defined using the\
    \ `trait` keyword, followed by its name and a body that contains fields, methods,\
    \ and abstract members. Traits can extend other traits, providing a way to create\
    \ complex compositions of behavior.\n\n```scala\ntrait Animal {\n  def speak():\
    \ Unit\n}\n\ntrait Mammal extends Animal {\n  def giveBirth(): Unit\n}\n\ntrait\
    \ Bird extends Animal {\n  def layEggs(): Unit\n}\n```\n\nIn this example, we\
    \ define three traits: `Animal`, `Mammal`, and `Bird`. `Mammal` and `Bird` both\
    \ extend the `Animal` trait.\n\n### Mixing Traits into Classes\n\nTo use a trait\
    \ in a class, you mix it in using the `with` keyword during class definition.\
    \ A class can mix in multiple traits, allowing it to inherit behavior from each\
    \ trait.\n\n```scala\nclass Dog extends Mammal {\n  def speak(): Unit = println(\"\
    Woof!\")\n  def giveBirth(): Unit = println(\"Giving birth to puppies.\")\n}\n\
    \nclass Sparrow extends Bird {\n  def speak(): Unit = println(\"Chirp!\")\n  def\
    \ layEggs(): Unit = println(\"Laying eggs in a nest.\")\n}\n```\n\nIn this example,\
    \ we create `Dog` and `Sparrow` classes that mix in the `Mammal` and `Bird` traits,\
    \ respectively. Each class provides its implementation of the `speak`, `giveBirth`,\
    \ and `layEggs` methods.\n\n### Trait Linearization\n\nScala uses a linearization\
    \ algorithm to determine the method resolution order when a class mixes in multiple\
    \ traits with overlapping method signatures. The linearization ensures that method\
    \ calls are resolved in a predictable and consistent way.\n\nConsider the following\
    \ example:\n\n```scala\ntrait A { def speak(): Unit = println(\"Trait A\") }\n\
    trait B extends A { override def speak(): Unit = println(\"Trait B\") }\ntrait\
    \ C extends A { override def speak(): Unit = println(\"Trait C\") }\nclass D extends\
    \ B with C\n```\n\nIn this case, the linearization order for class `D` is `D ->\
    \ B -> C -> A`, so calling `speak()` on an instance of `D` will print \"Trait\
    \ B\" because `B` is the first trait in the linearization chain that provides\
    \ an implementation for `speak`.\n\n### Trait Composition\n\nTrait composition\
    \ allows you to combine multiple traits into a new trait or class. You can use\
    \ the `with` keyword to mix traits together.\n\n```scala\ntrait Swimmer {\n  def\
    \ swim(): Unit = println(\"Swimming\")\n}\n\ntrait Flyer {\n  def fly(): Unit\
    \ = println(\"Flying\")\n}\n\nclass Duck extends Animal with Swimmer with Flyer\
    \ {\n  def speak(): Unit = println(\"Quack!\")\n  def giveBirth(): Unit = println(\"\
    Laying eggs and hatching ducklings.\")\n}\n```\n\nIn this example, we define two\
    \ traits, `Swimmer` and `Flyer`, and then create `Duck` class that mixes in both\
    \ in addition to the `Animal` trait. The `Duck` class has access to the methods\
    \ provided by all traits.\n\n### Abstract Members in Traits\n\nTraits can declare\
    \ abstract members, which are fields or methods without an implementation. Classes\
    \ that mix in a trait with abstract members must provide concrete implementations\
    \ for those members.\n\n```scala\ntrait Shape {\n  def area(): Double // Abstract\
    \ method\n}\n\nclass Circle(radius: Double) extends Shape {\n  def area(): Double\
    \ = math.Pi * radius * radius\n}\n\nclass Rectangle(width: Double, height: Double)\
    \ extends Shape {\n  def area(): Double = width * height\n}\n```\n\nIn this example,\
    \ the `Shape` trait declares an abstract method `area()`, and both the `Circle`\
    \ and `Rectangle` classes provide concrete implementations for it.\n\n### Traits\
    \ vs. Abstract Classes\n\nScala supports both traits and abstract classes as means\
    \ of defining reusable behavior. While traits are similar to abstract classes\
    \ in some aspects, they have key differences:\n\n- **Multiple Inheritance**: A\
    \ class can mix in multiple traits, but it can only extend one abstract class.\n\
    - **Mixins**: Traits are particularly suitable for mixing in small, reusable units\
    \ of behavior.\n- **Constructor Parameters**: Abstract classes can have constructor\
    \ parameters, while traits cannot.\n- **Method Implementation**: Traits can declare\
    \ and implement methods, while abstract classes can have abstract methods.\n\n\
    The choice between using a trait or an abstract class depends on your design goals\
    \ and the specific requirements of your code.\n\n## Self Types and Dependency\
    \ Injection\n\nScala allows you to specify a self type for a trait, indicating\
    \ that any class that mixes in the trait must also be a subclass of the specified\
    \ type. Self types enable a form of dependency injection where you can ensure\
    \ that classes that use a trait also provide specific dependencies.\n\n```scala\n\
    trait Logger {\n  this: Animal => // Self type\n  def log(message: String): Unit\
    \ = println(s\"${this.getClass.getSimpleName}: $message\")\n}\n\nclass Cat extends\
    \ Animal with Logger {\n  def speak(): Unit = println(\"Meow!\")\n  def giveBirth():\
    \ Unit = println(\"Giving birth to kittens.\")\n}\n\nclass LoggerOnly {\n  def\
    \ log(message: String): Unit = println(s\"LoggerOnly: $message\")\n}\n```\n"
  raw: 'A covariant type parameter is one where subtyping relationships are preserved.
    If `A` is a subtype of `B`, then `Box[A]` is considered a subtype of `Box[B]`.
    This is indicated by using the `+` annotation.


    ```scala


    class Box[+T](value: T)


    val intBox: Box[Int] = new Box(42)


    val numberBox: Box[Number] = intBox


    ```


    In this example, because `Box` is covariant, you can assign a `Box[Int]` to a
    `Box[Number]`, as `Int` is a subtype of `Number`.


    #### Contravariant Types (-)


    A contravariant type parameter is one where subtyping relationships are reversed.
    If `A` is a subtype of `B`, then `Box[B]` is considered a subtype of `Box[A]`.
    This is indicated by using the `-` annotation.


    ```scala


    class Box[-T](value: T)


    val numberBox: Box[Number] = new Box(42.0)


    val intBox: Box[Int] = numberBox


    ```


    In this example, because `Box` is contravariant, you can assign a `Box[Number]`
    to a `Box[Int]`, as `Number` is a supertype of `Int`.


    #### Invariant Types


    An invariant type parameter is one where there is no subtyping relationship between
    parameterized types. In other words, `Box[A]` is neither a subtype nor a supertype
    of `Box[B]` if `A` and `B` are different types.


    ```scala


    class Box[T](value: T)


    val intBox: Box[Int] = new Box(42)


    val stringBox: Box[String] = intBox // Error: Type mismatch


    ```


    In this example, `intBox` and `stringBox` cannot be assigned to each other because
    `Box` is invariant.


    ### Bounds in Generics


    Bounds in generics allow you to restrict the types that can be used as type parameters.
    There are two types of bounds: upper bounds and lower bounds.


    #### Upper Bounds


    An upper bound restricts the type parameter to be a subtype of a specific type.
    You specify an upper bound using the `<:` operator. For example:


    ```scala


    class Box[T <: Number](value: T)


    ```


    In this case, `T` can be any subtype of `Number`. You can create instances of
    `Box` for `Int`, `Double`, and other subtypes of `Number`.


    #### Lower Bounds


    A lower bound restricts the type parameter to be a supertype of a specific type.
    You specify a lower bound using the `>:` operator. For example:


    ```scala


    class Box[T >: Int](value: T)


    ```


    In this case, `T` can be any supertype of `Int`. You can create instances of `Box`
    for `Number`, `Any`, and other supertypes of `Int`.


    ### Type Erasure


    Scala uses type erasure at runtime to maintain compatibility with Java''s JVM.
    This means that generic type information is not available at runtime. For example,
    you cannot distinguish between `Box[Int]` and `Box[String]` instances at runtime.
    Type erasure has implications for pattern matching, reflection, and other runtime
    operations.


    ## Traits in Scala


    Traits are a fundamental building block in Scala''s object-oriented programming
    model. They allow you to define a reusable set of fields and methods that can
    be mixed into classes. Traits enable code reuse and composition, promoting modularity
    and maintainability.


    ### Defining Traits


    A trait is defined using the `trait` keyword, followed by its name and a body
    that contains fields, methods, and abstract members. Traits can extend other traits,
    providing a way to create complex compositions of behavior.


    ```scala


    trait Animal {


    def speak(): Unit


    }


    trait Mammal extends Animal {


    def giveBirth(): Unit


    }


    trait Bird extends Animal {


    def layEggs(): Unit


    }


    ```


    In this example, we define three traits: `Animal`, `Mammal`, and `Bird`. `Mammal`
    and `Bird` both extend the `Animal` trait.


    ### Mixing Traits into Classes


    To use a trait in a class, you mix it in using the `with` keyword during class
    definition. A class can mix in multiple traits, allowing it to inherit behavior
    from each trait.


    ```scala


    class Dog extends Mammal {


    def speak(): Unit = println("Woof!")


    def giveBirth(): Unit = println("Giving birth to puppies.")


    }


    class Sparrow extends Bird {


    def speak(): Unit = println("Chirp!")


    def layEggs(): Unit = println("Laying eggs in a nest.")


    }


    ```


    In this example, we create `Dog` and `Sparrow` classes that mix in the `Mammal`
    and `Bird` traits, respectively. Each class provides its implementation of the
    `speak`, `giveBirth`, and `layEggs` methods.


    ### Trait Linearization


    Scala uses a linearization algorithm to determine the method resolution order
    when a class mixes in multiple traits with overlapping method signatures. The
    linearization ensures that method calls are resolved in a predictable and consistent
    way.


    Consider the following example:


    ```scala


    trait A { def speak(): Unit = println("Trait A") }


    trait B extends A { override def speak(): Unit = println("Trait B") }


    trait C extends A { override def speak(): Unit = println("Trait C") }


    class D extends B with C


    ```


    In this case, the linearization order for class `D` is `D -> B -> C -> A`, so
    calling `speak()` on an instance of `D` will print "Trait B" because `B` is the
    first trait in the linearization chain that provides an implementation for `speak`.


    ### Trait Composition


    Trait composition allows you to combine multiple traits into a new trait or class.
    You can use the `with` keyword to mix traits together when defining a new trait
    or class.


    ```scala


    trait Swimmer {


    def swim(): Unit = println("Swimming")


    }


    trait Flyer {


    def fly(): Unit = println("Flying")


    }


    class Duck extends Animal with Swimmer with Flyer {


    def speak(): Unit = println("Quack!")


    def giveBirth(): Unit = println("Laying eggs and hatching ducklings.")


    }


    ```


    In this example, we define two traits, `Swimmer` and `Flyer`, and then create
    a `Duck` class that mixes in both `Swimmer` and `Flyer` traits in addition to
    the `Animal` trait. The `Duck` class has access to the methods provided by all
    three traits.


    ### Abstract Members in Traits


    Traits can declare abstract members, which are fields or methods without an implementation.
    Classes that mix in a trait with abstract members must provide concrete implementations
    for those members.


    ```scala


    trait Shape {


    def area(): Double // Abstract method


    }


    class Circle(radius: Double) extends Shape {


    def area(): Double = math.Pi * radius * radius


    }


    class Rectangle(width: Double, height: Double) extends Shape {


    def area(): Double = width * height


    }


    ```


    In this example, the `Shape` trait declares an abstract method `area()`, and both
    the `Circle` and `Rectangle` classes provide concrete implementations for it.


    ### Traits vs. Abstract Classes


    Scala supports both traits and abstract classes as means of defining reusable
    behavior. While traits are similar to abstract classes in some aspects, they have
    key differences:


    - **Multiple Inheritance:** A class can mix in multiple traits, but it can only
    extend one abstract class.


    - **Mixins:** Traits are particularly suitable for mixing in small, reusable units
    of behavior.


    - **Constructor Parameters:** Abstract classes can have constructor parameters,
    while traits cannot.


    - **Method Implementation:** Traits can declare and implement methods, while abstract
    classes can have abstract methods (without implementation).


    The choice between using a trait or an abstract class depends on your design goals
    and the specific requirements of your code.


    ## Self Types and Dependency Injection


    Scala allows you to specify a self type for a trait, indicating that any class
    that mixes in the trait must also be a subclass of the specified type. Self types
    enable a form of dependency injection where you can ensure that classes that use
    a trait also provide specific dependencies.


    ```scala


    trait Logger {


    this: Animal => // Self type


    def log(message: String): Unit = println(s"${this.getClass.getSimpleName}: $message")


    }


    class Cat extends Animal with Logger {


    def speak(): Unit = println("Meow!")


    def giveBirth(): Unit = println("Giving birth to kittens.")


    }


    class LoggerOnly {


    def log(message: String): Unit = println(s"LoggerOnly: $message")


    }


    ```'
