    # **Chapter 7: Working with Classes and Objects**


    Welcome to the world of classes and objects in action! In this chapter, we''ll
    dive deeper into the practical aspects of working with classes and objects in
    C#. We''ll explore creating objects, initializing properties, constructors, instance
    methods, and fields. By the end of this chapter, you''ll have a solid understanding
    of how to harness the power of classes and objects to build dynamic and feature-rich
    programs.


    ## Creating Objects


    At the heart of object-oriented programming lies the concept of objects—instances
    of classes. Creating an object involves instantiating a class to make use of its
    properties and methods.


    ```csharp


    class Car


    {


    public string Make;


    public string Model;


    public int Year;


    }


    Car myCar = new Car();


    myCar.Make = "Toyota";


    myCar.Model = "Corolla";


    myCar.Year = 2022;


    ```


    Here, we define a `Car` class with properties `Make`, `Model`, and `Year`. We
    then create an instance of the `Car` class named `myCar` and set its properties.


    ## Constructors: Initializing Objects


    Constructors are special methods within a class that are used to initialize objects
    when they are created. They allow you to set the initial state of an object.


    ```csharp


    class Student


    {


    public string Name;


    public int Age;


    public Student(string name, int age)


    {


    Name = name;


    Age = age;


    }


    }


    Student alice = new Student("Alice", 20);


    Student bob = new Student("Bob", 22);


    ```


    In this example, the `Student` class has a constructor that takes `name` and `age`
    parameters. When we create instances of the class, we provide values to the constructor
    to set the initial state.


    ## Instance Methods: Adding Behavior


    Methods within a class define the behaviors associated with objects of that class.
    These methods can perform actions and manipulate the object''s data.


    ```csharp


    class Rectangle


    {


    public double Width;


    public double Height;


    public double CalculateArea()


    {


    return Width * Height;


    }


    }


    Rectangle myRectangle = new Rectangle();


    myRectangle.Width = 5;


    myRectangle.Height = 3;


    double area = myRectangle.CalculateArea(); // Returns 15


    ```


    Here, the `Rectangle` class has a method `CalculateArea` that computes the area
    of the rectangle based on its width and height.


    ## Fields: Storing Data


    Fields are variables defined within a class to store data that belongs to objects
    of that class. Fields encapsulate the data associated with an object.


    ```csharp


    class Employee


    {


    public string Name;


    private double Salary;


    public void SetSalary(double amount)


    {


    if (amount >= 0)


    {


    Salary = amount;


    }


    }


    public double GetSalary()


    {


    return Salary;


    }


    }


    Employee john = new Employee();


    john.Name = "John Doe";


    john.SetSalary(50000);


    double johnSalary = john.GetSalary(); // Returns 50000


    ```


    In this example, the `Employee` class has a private field `Salary` that stores
    the salary of an employee. The methods `SetSalary` and `GetSalary` allow controlled
    access to this field.


    ## Access Modifiers: Controlling Access


    Access modifiers determine the level of visibility and accessibility of class
    members (fields, methods, properties, etc.). C# provides several access modifiers:
    `public`, `private`, `protected`, and `internal`.


    - `public`: Members are accessible from anywhere.


    - `private`: Members are accessible only within the defining class.


    - `protected`: Members are accessible within the defining class and derived classes.


    - `internal`: Members are accessible within the same assembly (project).


    ## Chaining Constructors


    In some cases, you might want to have multiple constructors for a class. You can
    achieve this by chaining constructors using the `this` keyword.


    ```csharp


    class Book


    {


    public string Title;


    public string Author;


    public int Year;


    public Book(string title, string author) : this(title, author, 2022)


    {


    }


    public Book(string title, string author, int year)


    {


    Title = title;


    Author = author;


    Year = year;


    }


    }


    ```


    In this example, the `Book` class has two constructors—one with two parameters
    and another with three parameters. The constructor with two parameters calls the
    constructor with three parameters using `this`.


    ## Conclusion


    In this chapter, we delved into the practical aspects of working with classes
    and objects in C#. We explored how to create objects, initialize properties using
    constructors, define instance methods for behaviors, and use fields to store data.


    We also discussed the importance of access modifiers in controlling the visibility
    of class members and how to chain constructors to provide different ways of object
    initialization.


    As you continue your journey in C# programming, remember that classes and objects
    are at the heart of building dynamic and modular applications. Embrace the power
    of object-oriented programming to create code that''s organized, reusable, and
    adaptable. So, go ahead and create your own classes, design your objects, and
    let your code come to life!


    # **Chapter 8: Inheritance and Polymorphism**


    Welcome to the world of inheritance and polymorphism, where the power of object-oriented
    programming truly shines. In this chapter, we''ll explore how inheritance allows
    you to build class hierarchies and how polymorphism enables dynamic and flexible
    code. By understanding these concepts, you''ll be able to create more versatile
    and extensible programs in C#.


    ## Inheritance: Building Hierarchies


    Inheritance is a fundamental concept in object-oriented programming that allows
    you to create a new class based on an existing class. The new class inherits the
    properties and methods of the existing class, allowing for code reuse and organization.


    ### Base Class and Derived Class


    Inheritance involves two types of classes: the base class (also known as the parent
    class) and the derived class (also known as the child class). The derived class
    inherits the members of the base class and can also add its own members.


    ```csharp


    class Animal


    {


    public void Eat()


    {


    Console.WriteLine("The animal is eating.");


    }


    }


    class Dog : Animal


    {


    public void Bark()


    {


    Console.WriteLine("Woof woof!");


    }


    }


    ```


    Here, `Animal` is the base class with an `Eat` method, and `Dog` is the derived
    class inheriting the `Eat` method and adding a `Bark` method.


    ### Accessing Base Class Members


    Derived classes can access the members of the base class using the `base` keyword.


    ```csharp


    class Child


    {


    public void Speak()


    {


    Console.WriteLine("I am a child.");


    }


    }


    class Teenager : Child


    {


    public new void Speak()


    {


    base.Speak(); // Calling base class method


    Console.WriteLine("I am a teenager.");


    }


    }


    ```


    In this example, the `Speak` method in the `Teenager` class calls the base class
    `Speak` method using `base.Speak()` before adding its own message.


    ## Polymorphism: One Interface, Many Implementations


    Polymorphism is the ability of different classes to be treated as instances of
    the same class through a common interface. It allows for more flexible and dynamic
    code.


    ### Method Overriding


    Polymorphism is often achieved through method overriding, where a derived class
    provides its own implementation of a method defined in the base class.'
