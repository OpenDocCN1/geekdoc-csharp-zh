    \n当你继续你的 C# 编程之旅时，请记住，面向对象编程（OOP）是一种强大的范式，它可以增强代码的组织性、重用性和可维护性。拥抱 OOP 的原则，让它们引导你创建优雅且模块化的软件解决方案。所以，尽管去用类和对象来建模你的世界吧，让面向对象编程的魔法转化你的代码吧！\n\
    \n# 第 7 章：类与对象\n\n欢迎来到类和对象的实战世界！在本章中，我们将深入探讨在 C# 中处理类和对象的实际方面。我们将探索对象的创建、属性初始化、构造函数、实例方法和字段。在本章结束时，你将实实地理解如何利用类和对象的威力来构建动态且功能丰富的程序。\n\
    \n## 创建对象\n\n面向对象编程的核心是对象的概念——类的实例。创建对象涉及实例化一个类以利用其属性和方法。\n\n```csharp\nclass\
    \ Car\n{\n    public string Make;\n    public string Model;\n    public int Year;\n\
    }\n\nCar myCar = new Car();\nmyCar.Make = \"Toyota\";\nmyCar.Model = \"Corolla\"\
    ;\nmyCar.Year = 2022;\n```\n\n在这里，我们定义了一个具有 `Make`、`Model` 和 `Year` 属性的 `Car`\
    \ 类。然后我们创建一个名为 `myCar` 的 `Car` 类实例并设置了它的属性。\n\n## 构造函数：初始化对象\n\n构造函数是类中的特殊方法，用于在创建对象时对其初始化。它们允许你设置对象的初始状态。\n\
    \n```csharp\nclass Student\n{\n    public string Name;\n    public int Age;\n\
    \    public Student(string name, int age)\n    {\n        Name = name;\n     \
    \   Age = age;\n    }\n}\n\nStudent alice = new Student(\"Alice\", 20);\nStudent\
    \ bob = new Student(\"Bob\", 22);\n```\n\n在这个示例中，`Student` 类有一个接收 `name` 和 `age`\
    \ 参数的构造函数。当我们创建该类的实例时，我们为构造函数提供值以设置初始状态。\n\n## 实例方法：添加行为\n\n类中的方法定义了与该类对象相关的行为。这些方法可以执行操作并处理对象的数据。\n\
    \n```csharp\nclass Rectangle\n{\n    public double Width;\n    public double Height;\n\
    \    public double CalculateArea()\n    {\n        return Width * Height;\n  \
    \  }\n}\n\nRectangle myRectangle = new Rectangle();\nmyRectangle.Width = 5;\n\
    myRectangle.Height = 3;\ndouble area = myRectangle.CalculateArea(); // 返回 15\n\
    ```\n\n在这里，`Rectangle` 类有一个方法 `CalculateArea`，它根据宽度和高度计算矩形的面积。\n\n## 字段：存储数据\n\
    \n字段是定义在类中的变量，用于存储属于类对象的数据。字段封装了与对象关联的数据。\n\n```csharp\nclass Employee\n{\n  \
    \  public string Name;\n    private double Salary;\n    public void SetSalary(double\
    \ amount)\n    {\n        if (amount >= 0)\n        {\n            Salary = amount;\n\
    \        }\n    }\n    public double GetSalary()\n    {\n        return Salary;\n\
    \    }\n}\n\nEmployee john = new Employee();\njohn.Name = \"John Doe\";\njohn.SetSalary(50000);\n\
    double johnSalary = john.GetSalary(); // 返回 50000\n```\n\n在这个示例中，`Employee` 类有一个私有字段\
    \ `Salary`，用于存储员工的工资。`SetSalary` 和 `GetSalary` 方法允许对该字段进行受控访问。\n\n## 访问修饰符：控制访问\n\
    \n访问修饰符决定了类成员（字段、方法、属性等）的可见性和访问权限。C# 提供了几种访问修饰符：`public`、`private`、`protected`\
    \ 和 `internal`。\n\n- `public`：成员随处可访问。\n- `private`：成员仅定义类内可见。\n- `protected`：定义类及其派生类可以访问。\n\
    - `internal`：成员可以在同一个程序集（项目）中访问。\n\n## 构造函数链\n\n在某些情况下，你可能希望一个类拥有多个构造函数。你可以通过使用\
    \ `this` 关键字链式调用构造函数来实现此目标。\n\n```csharp\nclass Book\n{\n    public string Title;\n\
    \    public string Author;\n    public int Year;\n    public Book(string title,\
    \ string author) : this(title, author, 2022)\n    {\n    }\n    public Book(string\
    \ title, string author, int year)\n    {\n        Title = title;\n        Author\
    \ = author;\n        Year = year;\n    }\n}\n```\n\n在这个示例中，`Book` 类有两个构造函数——一个有两个参数，另一个有三个参数。两个参数的构造函数使用\
    \ `this` 调用了三个参数的构造函数。\n\n## 总结\n\n在本章中，我们深入了在 C# 中处理类和对象的实践。我们探索了如何创建对象、使用构造函数初始化属性、为行为定义实例方法以及使用字段存储数据。\n\
    \n我们还讨论了访问修饰符在控制类成员可见性方面的重要性，以及如何链式构造函数以提供不同的对象初始化方式。\n\n当你继续你的 C# 编程之旅时，请记住类和对象是构建动态和模块化应用程序的核心。拥抱面向对象编程的力量来创建组织良好、可重用且易维护的代码。所以，尽管去用类和对象来建模你的世界吧！\n\
    \n# 第 8 章：继承与多态\n\n欢迎来到继承与多态的世界，这里面向对象编程的力量大放异彩。在本章中，我们将探索继承如何允许你构建类层次结构，以及多态如何实现动态灵活的代码。通过理解这些概念，你将能够创建更具通用性的扩展程序。\n\
    \n## 继承：构建层次结构\n\n继承是面向对象编程中的一个基本概念，允许你基于现有类创建新类。新类继承现有类的属性和方法，从而实现代码的重用。\n\n\
    ### 基类与派生类\n\n继承涉及两种类：基类（也称为父类）和派生类（也称为子类）。派生类继承基类的成员，也可以添加自己的成员。\n\n```csharp\n\
    class Animal\n{\n    public void Eat()\n    {\n        Console.WriteLine(\"动物正在吃东西。\"\
    );\n    }\n}\n\nclass Dog : Animal\n{\n    public void Bark()\n    {\n       \
    \ Console.WriteLine(\"汪汪!\");\n    }\n}\n```\n\n在这里，`Animal` 是具有 `Eat` 方法的基类，而\
    \ `Dog` 是继承了 `Eat` 方法并添加 `Bark` 方法的派生类。\n\n### 访问基类成员\n\n派生类可以使用 `base` 关键字访问基类的成员。\n\
    \n```csharp\nclass Child\n{\n    public void Speak()\n    {\n        Console.WriteLine(\"\
    我是一个孩子。\");\n    }\n}\n\nclass Teenager : Child\n{\n    public new void Speak()\n\
    \    {\n        base.Speak(); // 调用基类方法\n        Console.WriteLine(\"我是一个青少年。\"\
    );\n    }\n}\n```\n\n在这个示例中，`Teenager` 类中的 `Speak` 方法在添加自己的消息之前，通过 `base.Speak()`\
    \ 调用基类方法。\n\n## 多态：一种接口，多种实现\n\n多态允许不同的类通过通用接口被视为同一类的实例的能力。它允许代码更加灵活和动态。\n\n###\
    \ 方法重写\n\n多态通常通过方法重写来实现，即派生类为基类中定义的方法提供自己的实现。\n"
- fmt: "\n```csharp\nclass Shape\n{\n    public virtual void Draw()\n    {\n     \
    \   Console.WriteLine(\"Drawing a shape.\");\n    }\n}\n\nclass Circle : Shape\n\
    {\n    public override void Draw()\n    {\n        Console.WriteLine(\"Drawing\
    \ a circle.\");\n    }\n}\n\nclass Square : Shape\n{\n    public override void\
    \ Draw()\n    {\n        Console.WriteLine(\"Drawing a square.\");\n    }\n}\n\
    ```\n\nIn this example, the `Shape` class has a virtual `Draw` method, and both\
    \ the `Circle` and `Square` classes override this method with their own implementations.\n\
    \n### Polymorphic Behavior\n\nPolymorphism allows you to treat derived class objects\
    \ as instances of their base class. This is particularly useful when working with\
    \ collections of objects.\n\n```csharp\nList<Shape> shapes = new List<Shape>();\n\
    shapes.Add(new Circle());\nshapes.Add(new Square());\n\nforeach (Shape shape in\
    \ shapes)\n{\n    shape.Draw(); // Calls the appropriate Draw method based on\
    \ the object type\n}\n```\n\nIn this example, a list of `Shape` objects contains\
    \ instances of both `Circle` and `Square`. The `Draw` method is called on each\
    \ object, and polymorphism ensures that the appropriate method is invoked based\
    \ on the object's actual type.\n\n### Abstract Classes and Interfaces\n\n### Abstract\
    \ Classes\n\nAn abstract class is a class that cannot be instantiated and serves\
    \ as a blueprint for other classes. It may contain abstract methods (methods without\
