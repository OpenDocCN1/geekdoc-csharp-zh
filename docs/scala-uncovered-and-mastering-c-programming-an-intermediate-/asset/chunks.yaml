  trans: "\n\n想象你被要求打印五次“Hello, World!”。与其手动编写五行相同的代码，不如使用循环来自动化重复任务。\n\n### `for`\
    \ 循环\n\n`for` 循环是按特定次数重复代码块的常用方法。\n\n```csharp\nfor (int i = 0; i < 5; i++)\n\
    {\n    Console.WriteLine(\"Hello, World!\");\n}\n```\n\n在这个示例中，循环将执行五次 `Console.WriteLine`\
    \ 语句，每次执行都会增加 `i` 的值。\n\n### `while` 循环\n\n`while` 循环只要指定的条件保持为 `true`，就会就会继续执行代码块。\n\
    \n```csharp\nint countdown = 10;\nwhile (countdown > 0)\n{\n    Console.WriteLine(\"\
    Countdown: \" + countdown);\n    countdown--;\n}\n```\n\n这段代码将显示从 10 到 1 的倒计时。\n\
    \n### `do while` 循环\n\n与 `while` 循环类似，`do while` 循环同样在条件保持为 `true` 时重复执行代码块。关键区别在于，条件是在代码块执行后检查的，从而确保代码至少运行一次。\n\
    \n```csharp\nint count = 0;\ndo\n{\n    Console.WriteLine(\"Count: \" + count);\n\
    \    count++;\n} while (count < 5);\n```\n\n此循环将显示从 0 到 4 的数字。\n\n## 组合控制结构\n\n\
    你可以结合条件语句和循环来创建更复杂、多通用的程序。\n\n```csharp\nfor (int i = 1; i <= 100; i++)\n{\n \
    \   if (i % 3 == 0 && i % 5 == 0)\n    {\n        Console.WriteLine(\"FizzBuzz\"\
    );\n    }\n    else if (i % 3 == 0)\n    {\n        Console.WriteLine(\"Fizz\"\
    );\n    }\n    else if (i % 5 == 0)\n    {\n        Console.WriteLine(\"Buzz\"\
    );\n    }\n    else\n    {\n        Console.WriteLine(i);\n    }\n}\n```\n\n在这个示例中，我们使用循环遍历从\
    \ 1 到 100 的数字。根据数字是否能被 3、5 或两者整除，我们显示“Fizz”、“Buzz”、“FizzBuzz”或数字本身。\n\n## 结论\n\
    \n在本章中，我们深入探讨了 C# 中控制流和决策的世界。我们探索了如 `if`、`else` 和 `else if` 等条件语句，它们允许我们的程序根据条件做出决策。我们还揭示了\
    \ `for`、`while` 和 `do while` 等循环结构的力量，使我们能够自动化重复任务并对数据进行迭代。\n\n通过结合这些控制结构，你可以创建对不同场景做出动态响应的复杂程序。当你继续\
    \ C# 编程之旅时，请记住掌握控制流对于构建高效、灵活且健壮的应用程序至关重要。因此，拥抱决策和循环的力量，让你的代码活起来！\n\n# 第 4 章：循环与迭代\n\
    \n欢迎来到循环与迭代的世界在这里，我们解锁了在 C# 程序中重复操作和高效处理数据的能力。循环是本质工具，允许我们节省时间、减少冗余并优雅地处理重复任务。在本章中，我们将探索不同类型的循环，学习如何控制它们的行为，并发现迭代在现代编程中起着至关重要的作用。\n\
    \n## 循环的力量\n\n想象你是一位老师，有一份学生名单，你需要给他们的作业打分。与其手动批改每份作业，不如使用循环来自动化这一过程。循环允许我们多次执行某项任务，而无需反复编写相同的代码。\n\
    \n### `for` 循环\n\n`for` 循环是一种多功能且常用的迭代结构。它允许你指定执行代码块的次数。\n\n```csharp\nfor (int\
    \ i = 1; i <= 5; i++)\n{\n    Console.WriteLine(\"Iteration: \" + i);\n}\n```\n\
    \n在这个示例中，循环将执行五次，每次执行都会增加 `i` 的值。\n\n### 控制循环行为\n\n循环可以进行自定义以适应各种场景。你可以通过调整初始化、条件和迭代表达式来控制循环行为。\n\
    \n```csharp\nfor (int i = 10; i >= 0; i -= 2)\n{\n    Console.WriteLine(\"Countdown:\
    \ \" + i);\n}\n```\n\n在这里，循环将通过在每次迭代中减去 2 从 10 计数到 0。\n\n## `while` 循环\n\n`while`\
    \ 循环只要指定的条件保持为 `true`，就会重复执行代码块。\n\n```csharp\nint number = 1;\nwhile (number\
    \ <= 5)\n{\n    Console.WriteLine(\"Number: \" + number);\n    number++;\n}\n\
    ```\n\n此循环将显示从 1 到 5 的数字。\n\n### `do while` 循环\n\n`do while` 循环与 `while` 循环类似，但它保证无论初始值如何，代码块至少执行一次。\n\
    \n```csharp\nint count = 0;\ndo\n{\n    Console.WriteLine(\"Count: \" + count);\n\
    \    count++;\n} while (count < 5);\n```\n\n在这里，循环将显示从 0 到 4 的数字。\n\n## 循环控制语句\n\
    \n### `break` 语句\n\n`break` 语句允许你提前退出循环，即使循环条件尚未满足。\n\n```csharp\nfor (int i =\
    \ 1; i <= 10; i++)\n{\n    if (i == 6)\n    {\n        break;\n    }\n    Console.WriteLine(i);\n\
    }\n```\n\n在这个示例中，当 `i` 达到 6 时循环将停止。\n\n### `continue` 语句\n\n`continue` 语句允许你跳过当前迭代并继续下一次迭代。\n\
    \n```csharp\nfor (int i = 1; i <= 5; i++)\n{\n    if (i == 3)\n    {\n       \
    \ continue;\n    }\n    Console.WriteLine(i);\n}\n```\n\n在这里，循环将跳过 `i` 为 3 的迭代。\n\
    \n## 嵌套循环\n\n循环可以相互嵌套以实现复杂的模式。\n\n```csharp\nfor (int i = 1; i <= 3; i++)\n{\n\
    \    for (int j = 1; j <= 3; j++)\n    {\n        Console.WriteLine(\"i: \" +\
    \ i + \", j: \" + j);\n    }\n}\n```\n\n在这个示例中，内层循环为每个 `i` 值运行三次，共迭代九次。\n\n##\
    \ 无限循环\n\n在编写循环时要小心避免出现无限循环，即条件永远不会变为 `false`。这可能导致程序卡死或崩溃。\n\n```csharp\nwhile\
    \ (true)\n{\n    Console.WriteLine(\"这是一个无限循环!\");\n}\n```\n\n要退出无限循环，你可以使用 `break`\
    \ 语句或包含一个会变为 `false` 的条件。\n\n## 结论\n\n在本章中，我们深入探讨了 C# 中循环与迭代的世界。我们探索了循环在自动化重复任务和处理各种场景方面的力量。我们研究了\
    \ `for`、`while` 和 `do while` 循环，每种循环都提供了控制重复的独特方式。\n\n"
- fmt: "\n```csharp\n// Function definition\nint Add(int a, int b)\n{\n    int sum\
    \ = a + b;\n    return sum;\n}\n\n// Function call\nint result = Add(5, 3);\n\
    Console.WriteLine(\"Result: \" + result); // Output: Result: 8\n```\n\nIn this\
    \ example, we defined a function `Add` that takes two integer parameters `a` and\
    \ `b`. It calculates the sum of the parameters and returns the result.\n\n## Parameters\
    \ and Return Values\n\n### Parameters\nParameters are values that you pass to\
    \ a function when you call it. They provide input to the function, allowing it\
    \ to perform actions based on that input.\n\n```csharp\nstring Greet(string name)\n\
    {\n    return \"Hello, \" + name + \"!\";\n}\n\nstring message = Greet(\"Alice\"\
    );\nConsole.WriteLine(message); // Output: Hello, Alice!\n```\n\nHere, the `Greet`\
    \ function takes a string parameter `name` and returns a greeting message.\n\n\
    ### Return Values\nFunctions can also return values, which provide output from\
    \ the function back to the caller.\n\n```csharp\nint Square(int number)\n{\n \
    \   return number * number;\n}\n\nint result = Square(4);\nConsole.WriteLine(\"\
    Square: \" + result); // Output: Square: 16\n```\n\nIn this example, the `Square`\
    \ function returns the square of the input number.\n\n## Method Overloading\n\
    C# allows you to define multiple functions with the same name but different parameter\
    \ lists. This is known as method overloading.\n\n```csharp\nint Add(int a, int\
    \ b)\n{\n    return a + b;\n}\n\ndouble Add(double a, double b)\n{\n    return\
    \ a + b;\n}\n\nint intResult = Add(3, 5);\ndouble doubleResult = Add(2.5, 3.7);\n\
