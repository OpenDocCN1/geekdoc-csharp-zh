    ### 尽备匹配（Exhaustive Matching）


    在 Scala 中，编译器鼓励进行尽备匹配，这意味着覆盖输入值所有可能的情况。如果你忘记了某种情况，编译器将生成警告。例如，如果我们忘记在 `calculateArea`
