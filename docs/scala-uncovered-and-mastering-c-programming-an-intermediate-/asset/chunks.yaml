    \  }\n}\n```\n\nIn this example, the `divide` function checks if the divisor `b`\
    \ is zero and throws an `IllegalArgumentException`.\n\n### Creating Custom Exceptions\n\
    You can define custom exception classes by extending the `Exception` class or\
    \ one of its subclasses. Custom exceptions allow you to encapsulate application-specific\
    \ error conditions.\n\n```scala\nclass MyCustomException(message: String) extends\
    \ Exception(message)\n\ndef process(input: String): Unit = {\n  if (input.isEmpty)\
    \ {\n    throw new MyCustomException(\"Input is empty\")\n  } else {\n    // Process\
    \ the input\n  }\n}\n```\n\nHere, we define a custom exception `MyCustomException`\
    \ and use it to signal an error condition in the `process` function.\n\n### Handling\
    \ Exceptions and Returning Values\nIn Scala, you can use the `Try` class from\
    \ the `scala.util` package to handle exceptions and return a result or an error.\
