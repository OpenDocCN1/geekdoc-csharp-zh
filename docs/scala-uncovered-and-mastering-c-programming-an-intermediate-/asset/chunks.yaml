    A variable declared with `val` is immutable, meaning its value cannot be changed
    once assigned. Immutable variables are a fundamental concept in functional programming
    and offer several benefits:


    1. **Safety**: Since the value of a `val` cannot change, you can be confident
    that it won''t be modified accidentally, reducing the risk of bugs.

    2. **Concurrent Programming**: Immutable variables are especially useful in multi-threaded
    and concurrent environments, as they eliminate the need for locks and synchronization.

    3. **Functional Programming**: Immutable variables align with functional programming
    principles, making your code more predictable and easier to reason about.


    Here''s an example of using `val` to declare an immutable variable:


    ```scala

    val pi: Double = 3.14159

    ```


    In this example, we declare a `val` named `pi` and assign it the value of π (approximately
    3.14159). Attempting to change the value of `pi` elsewhere in the code would result
    in a compilation error.


    ## `var`: Mutable Variables


    In contrast to `val`, a variable declared with `var` is mutable, allowing its
    value to be reassigned. While mutable variables offer flexibility, they also come
    with some trade-offs:


    1. **Flexibility**: Mutable variables are suitable for situations where you need
    to update the stored data over time, such as when tracking the progress of a loop
    or maintaining state in an application.

    2. **Complexity**: Mutable variables can introduce complexity and make it harder
    to reason about your code, potentially leading to bugs if not used carefully.


    Here''s an example of using `var` to declare a mutable variable:


    ```scala

    var counter: Int = 0

    counter = counter + 1 // This is allowed

    ```


    In this code snippet, we declare a `var` named `counter` and initially set it
    to 0. Later in the code, we increment its value by 1, which is permissible because
    `counter` is mutable.


    ## Scala Data Types


    Scala provides a rich set of data types, allowing you to represent various kinds
    of information in your programs. These data types can be categorized into two
    main groups: primitive data types and reference data types.


    ### Primitive Data Types


    Scala offers a set of primitive data types that directly map to the low-level
    data representations supported by the JVM. These primitive types are efficient
    in terms of memory usage and performance.


    #### 1. Integers


    - `Byte`: A signed 8-bit integer, ranging from -128 to 127.

    - `Short`: A signed 16-bit integer, with values from -32,768 to 32,767.

    - `Int`: A signed 32-bit integer, capable of representing a wide range of values.

    - `Long`: A signed 64-bit integer, suitable for large integer values.


    Here''s an example of declaring and using integer variables:


    ```scala

    val age: Int = 30

    val population: Long = 7_800_000_000L // You can use underscores for readability

    ```


    #### 2. Floating-Point Numbers


    - `Float`: A 32-bit floating-point number, suitable for approximations and single-precision
    calculations.

    - `Double`: A 64-bit double-precision floating-point number, offering higher precision
    for numerical operations.


    Here''s an example of declaring and using floating-point variables:


    ```scala

    val pi: Double = 3.14159

    val temperature: Float = 98.6f // Note the ''f'' suffix to specify a float literal

    ```


    #### 3. Characters and Booleans


    - `Char`: A 16-bit Unicode character, representing single characters like ''A''
    or ''€''.

    - `Boolean`: A data type with two possible values: `true` and `false`.


    Example usage of character and boolean variables:


    ```scala

    val grade: Char = ''A''

    val isRaining: Boolean = false

    ```


    ### Reference Data Types


    Reference data types in Scala are more complex and are typically used to represent
    structured data or custom types created by developers.


    #### 1. Strings


    Strings in Scala are sequences of characters and are represented using the `String`
    class. Scala provides extensive support for working with strings, including string
    interpolation, concatenation, and manipulation.


    ```scala

    val greeting: String = "Hello, Scala!"

    val name: String = "Alice"

    // String interpolation

    val message: String = s"$greeting My name is $name."

    ```


    #### 2. Arrays


    Arrays in Scala are mutable, fixed-size collections of elements of the same data
    type. To create an array, you specify the data type of its elements, the number
    of elements, and initialize the array with values.


    ```scala

    val numbers: Array[Int] = Array(1, 2, 3, 4, 5)

    numbers(0) = 10 // Modifying an element

    val firstNumber: Int = numbers(0)

    ```


    #### 3. Tuples


    Tuples are ordered collections of elements, and they can contain elements of different
    data types. Tuples are immutable, and you can access their elements by position.


    ```scala

    val person: (String, Int) = ("Alice", 30)

    val name: String = person._1 // Accessing the first element

    val age: Int = person._2 // Accessing the second element

    ```


    #### 4. Lists


    Lists in Scala are ordered collections of elements of the same data type, similar
    to arrays. However, lists are immutable, which means you cannot change their contents
    after creation.


    ```scala

    val colors: List[String] = List("Red", "Green", "Blue")

    val firstColor: String = colors.head // Accessing the first

    val remainingColors: List[String] = colors.tail // Getting the remaining

    ```


    #### 5. Maps


    Maps are collections of key-value pairs, where each key is associated with a value.
    Maps are commonly used for data retrieval and storage.


    ```scala

    val scores: Map[String, Int] = Map("Alice" -> 95, "Bob" -> 88, "Carol" -> 92)

    val aliceScore: Int = scores("Alice") // Accessing a value

    val danScore: Option[Int] = scores.get("Dan") // Handling the absence

    ```


    ### Type Inference


    In Scala, the compiler is often able to infer the data type of a variable based
    on the assigned value. This feature, known as type inference, reduces the need
    for explicit declarations and makes the more concise and readable.


    ```scala

    val temperature = 98.6 // Compiler infers Double

    val greeting = "Hello, Scala!" // Compiler infers String

    ```


    Type inference works well for simple cases, but you can always provide explicit
    type annotations when needed.


    ## Type Safety and Type Casting


    Scala is a statically typed language, which means that variable types are checked
    at compile time. This type safety provides several advantages:


    - **Early Error Detection**: Type checking at compile time catches type-related
    errors before your program runs, reducing the risk of runtime crashes.

    - **Optimized Code**: The compiler can generate more efficient code when it knows
    the exact data types.


    However, there are situations where you need to convert or cast data from one
    type to another. Scala provides mechanisms for type casting, ensuring that type
    conversions are safe and explicit.


    ### Implicit Type Conversion


    Scala allows implicit type conversions in certain cases when it can safely convert
    one data type to another without data loss. For example, converting an `Int` to
    a `Double` is a safe operation.


    ```scala

    val intNumber: Int = 42

    val doubleNumber: Double = intNumber // Implicit conversion from Int to Double

    ```


    ### Explicit Type Casting


    In situations where an implicit conversion is not possible, you can explicitly
    cast a value from one type to another using the `asInstanceOf` method. However,
    explicit type casting should be used sparingly and with caution, as it may result
    in runtime errors if the conversion is not valid.


    ```scala

    val pi: Double = 3.14159

    val piAsInt: Int = pi.asInstanceOf[Int] // Explicitly cast Double to Int

    ```


    ### Type Checking


    To ensure type safety when casting, Scala provides the `isInstanceOf` method to
    check the type of a value at runtime. This can be useful when you need to confirm
    that a cast is valid before performing it.

