  trans: "\n\n协变类型参数是指子类型关系被保留的类型。如果 `A` 是 `B` 的子类型，那么 `Box[A]` 就被视为 `Box[B]` 的子类型。这通过使用\
    \ `+` 注解来表示。\n\n```scala\nclass Box+T\n\nval intBox: Box[Int] = new Box(42)\n\n\
    val numberBox: Box[Number] = intBox\n```\n\n在这个示例中，由于 `Box` 是协变的，你可以将 `Box[Int]`\
    \ 赋值给 `Box[Number]`，因为 `Int` 是 `Number` 的子类型。\n\n### 逆变类型 (-)\n\n逆变类型参数是指子类型关系被反转的类型。如果\
    \ `A` 是 `B` 的子类型，那么 `Box[B]` 被视为 `Box[A]` 的子类型。这通过使用 `-` 注解来表示。\n\n```scala\n\
    class Box-T\n\nval numberBox: Box[Number] = new Box(42.0)\n\nval intBox: Box[Int]\
    \ = numberBox\n```\n\n在这个示例中，由于 `Box` 是逆变的，你可以将 `Box[Number]` 赋值给 `Box[Int]`，因为\
    \ `Number` 是 `Int` 的父类型。\n\n### 不变类型\n\n不变类型参数是指参数化类型之间没有子类型关系。换句话说，如果 `A` 和 `B`\
    \ 是不同的类型，那么 `Box[A]` 既不是 `Box[B]` 的子类型，也不是父类型。\n\n```scala\nclass BoxT\n\nval\
    \ intBox: Box[Int] = new Box(42)\n\nval stringBox: Box[String] = intBox // Error：类型不匹配\n\
    ```\n\n在这个示例中，`intBox` 和 `stringBox` 无法互相赋值，因为 `Box` 是不变的。\n\n### 泛型中的边界 (Bounds)\n\
    \n泛型中的边界允许你限制可以用作类型参数的类型。边界有两种：上界和界。\n\n#### 上界 (Upper Bounds)\n\n上界将类型参数限制为特定类型的子类型。你使用\
    \ `<:` 运算符来指定上界。例如：\n\n```scala\nclass BoxT <: Number\n```\n\n在这种情况下，`T` 可以是 `Number`\
    \ 的任何子类型。你可以为 `Int`、`Double` 以及其他 `Number` 的子类型创建 `Box` 的实例。\n\n#### 下界 (Lower\
    \ Bounds)\n\n下界将类型参数限制为特定类型的父类型。你使用 `>:` 运算符来指定下界。例如：\n\n```scala\nclass BoxT\
    \ >: Int\n```\n\n在这种情况下，`T` 可以是 `Int` 的任何父类型。你可以为 `Number`、`Any` 以及 `Int` 的父类型创建\
    \ `Box` 的实例。\n\n### 类型擦除 (Type Erasure)\n\nScala 在运行时使用类型擦除来与 Java 的 JVM 兼容。这意味着泛型类型信息在运行时是不可用的。例如，你无法在运行时区分\
    \ `Box[Int]` 和 `Box[String]` 实例。类型擦除对模式匹配、反射和其他运行时操作有影响。\n\n## Scala 中的 Traits\
    \ (特征)\n\nTraits 是 Scala 面对象编程模型中的基础构建块。它们允许你定义一组可重用的字段和方法，这些内容可以混入（mix into）类中。Traits\
    \ 实现了代码重用和组合，促进了模块化和可维护性。\n\n### 定义 Traits\n\nTrait 使用 `trait` 关键字定义，后跟其名称以及一个包含字段、方法和抽象成员的体。Traits\
    \ 可以扩展其他 traits，提供了一种创建复杂行为组合的方法。\n\n```scala\ntrait Animal {\n  def speak():\
    \ Unit\n}\n\ntrait Mammal extends Animal {\n  def giveBirth(): Unit\n}\n\ntrait\
    \ Bird extends Animal {\n  def layEggs(): Unit\n}\n```\n\n在这个示例中，我们定义了三个 trait：`Animal`、`Mammal`\
    \ 和 `Bird`。`Mammal` 和 `Bird` 都扩展了 `Animal` trait。\n\n### 将 Traits 混入类中\n\n要在类中使用\
    \ trait，可以在类定义期间使用 `with` 关键字将其混入。一个类可以混入多个 trait，允许它从每个 trait 继承行为。\n\n```scala\n\
    class Dog extends Mammal {\n  def speak(): Unit = println(\"Woof!\")\n  def giveBirth():\
    \ Unit = println(\"Giving birth to puppies.\")\n}\n\nclass Sparrow extends Bird\
    \ {\n  def speak(): Unit = println(\"Chirp!\")\n  def layEggs(): Unit = println(\"\
    Laying eggs in a nest.\")\n}\n```\n\n在这个示例中，我们创建了 `Dog` 和 `Sparrow` 类，它们分别混入了\
    \ `Mammal` 和 `Bird` trait。每个类都为其 `speak`、`giveBirth` 和 `layEggs` 方法提供了实现。\n\n\
    ### Trait 线性化 (Linearization)\n\nScala 使用线性化算法来确定当类混入多个具有冲突方法签名的 trait 时的方法解析顺序。线性化确保了方法调用以一种可预测且一致的方式进行解析。\n\
    \n考虑以下示例：\n\n```scala\ntrait A { def speak(): Unit = println(\"Trait A\") }\n\
    trait B extends A { override def speak(): Unit = println(\"Trait B\") }\ntrait\
    \ C extends A { override def speak(): Unit = println(\"Trait C\") }\nclass D extends\
    \ B with C\n```\n\n在这种情况下，类 `D` 的线性化顺序为 `D -> B -> C -> A`，因此在 `D` 的实例上调用 `speak()`\
    \ 将打印 \"Trait B\"，因为 `B` 是线性化链中第一个为 `speak` 提供实现的的 trait。\n\n### Trait 组合 (Composition)\n\
    \nTrait 组合允许你将多个 trait 组合一个新的 trait 或类。你可以使用 `with` 关键字将 traits 组合在一起。\n\n```scala\n\
    trait Swimmer {\n  def swim(): Unit = println(\"Swimming\")\n}\n\ntrait Flyer\
    \ {\n  def fly(): Unit = println(\"Flying\")\n}\n\nclass Duck extends Animal with\
    \ Swimmer with Flyer {\n  def speak(): Unit = println(\"Quack!\")\n  def giveBirth():\
    \ Unit = println(\"Laying eggs and hatching ducklings.\")\n}\n```\n\n在这个示例中，我们定义了两个\
    \ trait：`Swimmer` 和 `Flyer`，然后创建了 `Duck` 类，它除了 `Animal` trait 之外还混入了两者。`Duck`\
    \ 类访问所有 trait 提供的方法。\n\n### Traits 中的抽象成员 (Abstract Members)\n\nTraits 可以声明抽象成员，即没有实现的字段或方法。混入带有抽象成员\
    \ trait 的类必须为这些成员提供具体的实现。\n\n```scala\ntrait Shape {\n  def area(): Double //\
    \ 抽象方法\n}\n\nclass Circle(radius: Double) extends Shape {\n  def area(): Double\
    \ = math.Pi * radius * radius\n}\n\nclass Rectangle(width: Double, height: Double)\
    \ extends Shape {\n  def area(): Double = width * height\n}\n```\n\n在这个示例中，`Shape`\
    \ trait 声明了一个抽象方法 `area()`，`Circle` 和 `Rectangle` 类都为其提供了具体的实现。\n\n### Traits\
    \ 与抽象类 (Abstract Classes)\n\nScala 支持使用 traits 和抽象类来定义可重用的行为。虽然 traits 在某些方面与抽象类相似，但它们有关键区别：\n\
    \n- **多继承**：一个类可以混入多个 traits，但只能扩展一个抽象类。\n- **混入 (Mixins)**：Traits 特别适用于混入小的可重用单元。\n\
    - **构造参数**：抽象类可以构造参数，而 traits 不能。\n- **方法实现**：Traits 可以声明并实现方法，而抽象类也可以抽象方法。\n\n\
    使用 trait 还是抽象类取决于你的设计目标和代码的具体需求。\n\n### 自类型与依赖注入\n\nScala 允许为 trait 指定自类型，这意味着混入该\
    \ trait 的任何类必须是指定类型的子类。自类型实现了一种依赖注入的形式，你可以确保使用 trait 的类也提供了特定的依赖。\n\n```scala\n\
    trait Logger {\n  this: Animal => // 自类型\n  def log(message: String): Unit = println(s\"\
    ${this.getClass.getSimpleName}: $message\")\n}\n\nclass Cat extends Animal with\
    \ Logger {\n  def speak(): Unit = println(\"Meow!\")\n  def giveBirth(): Unit\
    \ = println(\"Giving birth to kittens.\")\n}\n\nclass LoggerOnly {\n  def log(message:\
    \ String): Unit = println(s\"LoggerOnly: $message\")\n}\n```\n\n"
