    \    int result = numbers[5]; // This will cause an IndexOutOfRangeException\n\
    }\ncatch (IndexOutOfRangeException ex)\n{\n    Console.WriteLine(\"Index out of\
    \ range: \" + ex.Message);\n}\ncatch (Exception ex)\n{\n    Console.WriteLine(\"\
    General error: \" + ex.Message);\n}\n```\n\nIn this example, the first `catch`\
    \ block handles the `IndexOutOfRangeException`, and the second `catch` block handles\
    \ any other exceptions.\n\n### The `finally` Block\n\nThe `finally` block is used\
    \ to specify code that should be executed regardless of whether an exception occurred\
