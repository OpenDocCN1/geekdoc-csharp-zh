    \n# 第 12 章：委托、事件和 Lambda 表达式\n\n欢迎 C# 委托、事件和 Lambda 表达式的世界！在本章中，我们将探索能够让你创建更具活性且响应更快的程序的强大工具。我们将深入研究委托（允许你将方法视为对象）、事件（促进组件之间的通信）以及能够实现简洁且表达性代码的\
    \ Lambda 表达式。通过掌握这些概念，你将提升编程技能，并设计出更加模块化、交互化且优雅的应用程序。\n\n## 委托：C# 中的函数指针\n\n委托是\
    \ C# 中的基本概念，允许你将方法视为一等对象。它们提供了一种封装并将方法作为参数传递的方法，实现了动态和模块化编程。\n\n### 定义和使用委托\n\n\
    委托是一种表示具有特定签名方法的引用类型。它提供了一种通过委托实例间接调用方法的方法。\n\n```csharp\nusing System;\n\ndelegate\
    \ int Calculator(int a, int b);\n\nclass Program\n{\n    static int Add(int x,\
    \ int y)\n    {\n        return x + y;\n    }\n\n    static int Multiply(int x,\
    \ int y)\n    {\n        return x * y;\n    }\n\n    static void Main()\n    {\n\
    \        Calculator calc = Add;\n        int result = calc(5, 3);\n        Console.WriteLine(\"\
    Addition result: \" + result);\n\n        calc = Multiply;\n        result = calc(5,\
    \ 3);\n        Console.WriteLine(\"Multiplication result: \" + result);\n    }\n\
    }\n```\n\n在这个示例中，`Calculator` 委托代表了具有两个 `int` 参数并返回 `int` 结果的方法。我们将 `Add` 和 `Multiply`\
    \ 赋值给委托实例并动态调用它们。\n\n### 多路委托\n\n多路委托是可以持有多个方法的委托。当调用时，所有方法将按照添加的顺序执行。\n\n```csharp\n\
    using System;\n\ndelegate void Logger(string message);\n\nclass Program\n{\n \
    \   static void LogToFile(string message)\n    {\n        Console.WriteLine(\"\
    Logging to file: \" + message);\n    }\n\n    static void LogToConsole(string\
    \ message)\n    {\n        Console.WriteLine(\"Logging to console: \" + message);\n\
    \    }\n\n    static void Main()\n    {\n        Logger log = LogToFile;\n   \
    \     log += LogToConsole;\n        log(\"Hello, delegates!\");\n        log -=\
    \ LogToConsole;\n        log(\"Console removed.\");\n    }\n}\n```\n\n在这里，我们定义了多路委托\
    \ `Logger`，它可以持有 `LogToFile` 和 `LogToConsole` 方法，并触发它们。\n\n## 事件：启用组件通信\n\n事件是程序不同组件之间通信的机制。它们允许对象在特定操作发生时订阅并接收通知。\n\
    \n### 定义和使用事件\n\n事件是一种使用方式受到限制的委托。它只能在定义的类内部调用，但可以在类外部订阅。\n\n```csharp\nusing\
    \ System;\n\nclass Publisher\n{\n    public event Action<string> NewMessage;\n\
    \n    public void PublishMessage(string message)\n    {\n        NewMessage?.Invoke(message);\n\
    \    }\n}\n\nclass Subscriber\n{\n    public void OnNewMessage(string message)\n\
    \    {\n        Console.WriteLine(\"Received message: \" + message);\n    }\n\
    }\n\nclass Program\n{\n    static void Main()\n    {\n        Publisher publisher\
    \ = new Publisher();\n        Subscriber subscriber = new Subscriber();\n\n  \
    \      publisher.NewMessage += subscriber.OnNewMessage;\n        publisher.PublishMessage(\"\
    Hello, events!\");\n\n        publisher.NewMessage -= subscriber.OnNewMessage;\n\
    \    }\n}\n```\n\n在这个示例中，我们在 `Publisher` 类中定义了事件 `NewMessage` 并使用 `Subscriber`\
    \ 类进行订阅。当调用 `PublishMessage` 方法时，事件会被触发。\n\n## Lambda 表达式：简洁的匿名函数\n\nLambda 表达式提供了在\
    \ C# 中定义匿名函数的简洁方式。当你需要将一段短代码作为方法或委托的参数时，它们特别有用。\n\n### 在委托中使用 Lambda 表达式\n\nLambda\
    \ 表达式可以用于定义与委托匹配的内联方法。\n\n```csharp\nusing System;\n\ndelegate int Operation(int\
    \ a, int b);\n\nclass Program\n{\n    static void Main()\n    {\n        Operation\
    \ add = (x, y) => x + y;\n        Operation multiply = (x, y) => x * y;\n\n  \
    \      Console.WriteLine(\"Addition: \" + add(5, 3));\n        Console.WriteLine(\"\
    Multiplication: \" + multiply(5, 3));\n    }\n}\n```\n\n"
