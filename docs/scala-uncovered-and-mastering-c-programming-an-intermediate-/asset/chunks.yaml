    ### Traits and Mixins


    Traits are a powerful feature in Scala that allow you to define reusable components
    with fields and methods that can be mixed into classes. Traits provide a way to
    achieve multiple inheritance, allowing a class to inherit from multiple traits.


    Here''s an example of a trait and mixin:


    ```scala


    trait Logger {


    def log(message: String): Unit = println(s"Log: $message")


    }


    class UserService(name: String) extends Logger {


    def greet(): Unit = {


    log(s"Hello, $name!")


    // Other user-related logic


    }


    }


    val user = new UserService("Alice")


    user.greet() // Output: "Log: Hello, Alice!"


    ```


    In this code, we define a `Logger` trait with a `log` method. The `UserService`
    class extends `Logger`, allowing it to use the `log` method within the `greet`
    method. Traits enable code reuse and maintainability by encapsulating common functionality.


    ## Case Classes


    Scala provides a special type of class known as a case class. Case classes are
    primarily used for modeling data and are concise to define. They come with built-in
    features like equality comparison, pattern matching, and immutability.


    Here''s an example of a case class:


    ```scala


    case class Point(x: Int, y: Int)


    val p1 = Point(1, 2)


    val p2 = Point(1, 2)


    println(p1 == p2) // Output: true (automatic equality comparison)


    ```


    In this code, we define a `Point` case class with two fields, `x` and `y`. We
    create two instances of `Point` and compare


    them for equality using the `==` operator. Case classes automatically generate
    an `equals` method that compares the values of their fields.


    Case classes are often used to represent structured data, such as coordinates,
    user profiles, or configuration settings.


    ## Singleton Objects


    In Scala, you can define singleton objects, which are unique instances of a class.
    Singleton objects are commonly used for tasks like managing configuration settings,
    creating utility functions, or serving as entry points to an application.


    Here''s an example of a singleton object:


    ```scala


    object Logger {


    def log(message: String): Unit = println(s"Log: $message")


    }


    Logger.log("This is a log message")


    ```


    In this code, we define a singleton object named `Logger` with a `log` method.
    We can call the `log` method directly on the `Logger` object without creating
    instances of it. Singleton objects are initialized lazily when they are first
    accessed and are thread-safe.


    ## Companion Objects


    In Scala, each class can have a companion object with the same name. Companion
    objects are often used to define factory methods and other static members associated
    with a class. They provide a convenient way to encapsulate class-level functionality.


    Here''s an example of a companion object:


    ```scala


    class Circle(radius: Double) {


    def area: Double = Circle.PI * radius * radius


    }


    object Circle {


    val PI: Double = 3.14159


    def apply(radius: Double): Circle = new Circle(radius)


    }


    val circle = Circle(5.0)


    println(s"Area: ${circle.area}")


    ```


    In this code, we define a `Circle` class with a companion object also named `Circle`.
    The companion object contains a `PI` constant and an `apply` method that serves
    as a factory for creating `Circle` instances. This allows us to create a `Circle`
    object directly by calling `Circle(5.0)`.


