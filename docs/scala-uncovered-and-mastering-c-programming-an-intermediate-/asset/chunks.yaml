    \n# 第 4 章：Scala 中的函数：定义与使用\n\n在之前的章节中，我们涵盖了变量和数据类型等 Scala 核心概念。现在，是时候深入研究任何语言中最基础的构建块之一了：函数。在本章中，我们将探索如何在\
    \ Scala 中定义、使用和利用函数的威力。\n\n## 函数：构建块\n\n函数是一个执行特定任务的自包含代码块。函数是编程中的工作骨干，允许你封装逻辑、重用代码，并使你的程序模块化且具有可读性。在\
    \ Scala 中，函数是一等公民，这意味着它们可以被赋值给变量、作为参数传递并作为结果返回。\n\n### 定义函数\n\n在 Scala 中，你使用 `def`\
    \ 关键字定义函数，后面跟着函数名、括号括出的参数列表、冒号（`:`）和返回类型。\n\n```scala\ndef add(x: Int, y: Int):\
    \ Int = {\n  x + y\n}\n```\n\n在这个示例中：\n- `add` 是函数名。\n- `(x: Int, y: Int)` 定义了两个参数\
    \ `x` 和 `y`类型均为 `Int`。\n- `: Int` 指定了函数的返回类型。\n- `{ x + y }` 包含了函数体，其中 `x + y`\
    \ 是计算 `x` 和 `y` 之和的表达式。\n\n### 调用函数\n\n一旦定义了函数，你可以通过函数名后跟包含参数的括号来调用它。\n\n```scala\n\
    val result: Int = add(5, 3)\n```\n\n在这个示例中，我们将 `5` 和 `3` 作为参数传递给 `add` 函数，它返回\
    \ `8`，然后该结果被赋值给变量 `result`。\n\n### 无参数函数\n\n函数也可以没有参数。\n\n```scala\nimport scala.util.Random\n\
    def getRandomNumber(): Int = {\n  Random.nextInt(100)\n}\n```\n\n在这种情况下，`getRandomNumber`\
    \ 不接受任何参数，并返回一个 0（包含）到 100（不包含）之间的随机整数。\n\n### 带默认参数的函数\n\nScala 允许你定义带有默认值的函数。默认参数通过允许调用者省略某些参数并使用默认值，提供了灵活性。\n\
    \n```scala\ndef greet(name: String = \"Guest\"): String = {\n  s\"Hello, $name!\"\
    \n}\n```\n\n在该函数中，`name` 是一个默认值为 `\"Guest\"` 的参数。如果你不带任何参数调用 `greet()`，它将使用默认值并返回\
    \ `\"Hello, Guest!\"`。但是，你可以在调用函数时仍提供自定义的 `name`：`greet(\"Alice\")` 将返回 `\"Hello,\
    \ Alice!\"`。\n\n### 带命名参数的函数\n\nScala 允许在调用函数时通过名称指定参数。这一功能提供了清晰度，特别是当函数有多个参数时。\n\
    \n```scala\ndef printName(firstName: String, lastName: String): Unit = {\n  println(s\"\
    First Name: $firstName, Last Name: $lastName\")\n}\nprintName(lastName = \"Smith\"\
    , firstName = \"John\")\n```\n\n通过使用命名参数，你可以以任何顺序提供参数，使代码更具可读性。\n\n### 可变参数函数\n\
    \n有时，你可能希望函数接受可变数量的参数。Scala 允许你通过参数配合 `*` 运算符来实现。这些参数被视为一个序列。\n\n```scala\ndef\
    \ sum(numbers: Int*): Int = {\n  numbers.sum\n}\nval total: Int = sum(1, 2, 3,\
    \ 4, 5)\n```\n\n在上述代码中，`numbers: Int*` 表示 `numbers` 可以接受可数量的整数。`sum` 函数随后使用 `Seq`\
    \ 类型提供的 `sum` 方法计算总和。\n\n### 匿名函数（Lambda）\n\nScala 支持匿名函数，通常被称为 Lambda 或函数字面量。这些是没有定义名称的、即时创建的函数。匿名函数非常简洁，常用于将函数作为参数传递给高阶函数的场景。\n\
    \n```scala\nval add: (Int, Int) => Int = (x, y) => x + y\n```\n\n在该代码中，我们定义了一个匿名函数，它接收两个整数（`x`\
    \ 和 `y`）作为参数并返回它们的和。`add` 的类型指定为 `(Int, Int) => Int`，表示接收两个 `Int` 参数并返回 `Int`\
    \ 的函数。\n\n### 高阶函数\n\n高阶函数是指接受其他函数作为参数或返回函数的。它们提供了强大的抽象，是函数式编程的关键特性。在 Scala 中，高阶函数通常用于映射、过滤和归约集合。\n\
    \n#### `map` 函数\n\n`map` 函数将给函数应用于集合的每个元素，并返回一个包含结果的新集合。\n\n```scala\nval numbers:\
    \ List[Int] = List(1, 2, 3, 4, 5)\nval doubledNumbers: List[Int] = numbers.map(x\
    \ => x * 2)\n```\n\n在该代码中，匿名函数 `(x => x * 2)` 被传递给 `map`，使 `numbers` 列表中的每个元素翻倍。\n\
    \n#### `filter` 函数\n\n`filter` 函数从集合中选择给定条件的元素。它返回一个包含过滤后元素的新集合。这里有一个使用 `filter`\
    \ 从列表中筛选偶数的示例：\n\n"
