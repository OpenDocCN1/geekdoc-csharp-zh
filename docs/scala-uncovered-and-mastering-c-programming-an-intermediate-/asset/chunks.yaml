    In this code, the anonymous function `(x => x % 2 == 0)` is passed to `filter`,
    selecting only the even numbers from `numbers`.


    #### `reduce` Function


    The `reduce` function combines elements of a collection into a single result by
    applying a binary operation. It starts with an initial value and progressively
    combines elements. Here''s an example using `reduce` to find the sum of elements
    in a list:


    ```scala


    val numbers: List[Int] = List(1, 2, 3, 4, 5)


    val sum: Int = numbers.reduce((x, y) => x + y)


    ```


    In this code, the anonymous function `(x, y) => x + y` is used to progressively
    sum the elements in `numbers`.


    ### Tail Recursion


    Scala supports tail recursion, a powerful technique that optimizes recursive functions,
    avoiding stack overflow errors. To optimize a recursive function for tail recursion,
    you need to use the `@tailrec` annotation and ensure that the recursive call is
    the last operation in the function. Here''s an example of a tail-recursive factorial
    function:


    ```scala


    import scala.annotation.tailrec


    @tailrec


    def factorial(n: Int, acc: BigInt = 1): BigInt = {


    if (n <= 1) acc


    else factorial(n - 1, n * acc)


    }


    val result: BigInt = factorial(10000)


    ```


    In this code, the `@tailrec` annotation ensures that the `factorial` function
    is optimized for tail recursion. It calculates the factorial of a number without
    causing a stack overflow error, even for large values like `10000`.


    ## Closures and Lexical Scope


    In Scala, functions are closures, meaning they can access and capture variables
    from their surrounding lexical scope. This behavior is crucial for creating flexible
    and reusable functions. Here''s an example:


    ```scala


    def multiplier(factor: Int): Int => Int = {


    (x: Int) => x * factor


    }


    val timesTwo: Int => Int = multiplier(2)


    val timesThree: Int => Int = multiplier(3)


    val result1: Int = timesTwo(5) // Result: 10


    val result2: Int = timesThree(5) // Result: 15


    ```


    In this code, the `multiplier` function returns another function that multiplies
    its input by a factor. The returned functions (`timesTwo` and `timesThree`) capture
    the `factor` variable from their enclosing scope, creating closures.


    ## Conclusion


    In this chapter, we''ve explored the world of functions in Scala. You''ve learned
    how to define functions, pass arguments, and return values. We''ve covered various
    aspects of functions, including default parameters, named arguments, and variable-argument
    functions. You''ve also discovered anonymous functions and their role in creating
    concise, expressive code.


    Additionally, we delved into higher-order functions, which allow you to manipulate
    collections and perform complex operations efficiently. You''ve seen how functions
