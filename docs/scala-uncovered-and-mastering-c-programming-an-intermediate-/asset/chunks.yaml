    ## Working with Case Classes


    Case classes are a fundamental part of pattern matching in Scala. They simplify
    data modeling and pattern matching by providing a concise way to define classes
    with constructors, fields, equality checks, and more.


    ### Defining Case Classes


    To define a case class, you use the `case class` keyword followed by the class
    name and its constructor parameters. Here''s an example of defining a `Person`
    case class:


    ```scala


    case class Person(name: String, age: Int)


    ```


    This single line of code defines a class `Person` with two fields: `name` and
    `age`. It also automatically generates methods for equality, toString, and hash
    code, which are essential for pattern matching.


    ### Creating Instances


    Creating instances of case classes is straightforward. You can create them just
    like regular classes, without needing the `new` keyword:


    ```scala


    val person = Person("Alice", 30)


    ```


    This creates a `Person` instance with the given values for `name` and `age`.


    ### Accessing Fields


    To access the fields of a case class, you can use the dot notation:


    ```scala


    println(person.name) //


    Output: "Alice"


    println(person.age) // Output: 30


    ```


    Case class fields are automatically defined as read-only properties.


    ### Equality


    Case classes automatically implement structural equality, meaning two instances
    are considered equal if their fields are the same:


    ```scala


    val person1 = Person("Alice", 30)


    val person2 = Person("Alice", 30)


    println(person1 == person2) // Output: true


    ```


    In this example, `person1` and `person2` are considered equal because their `name`
    and `age` fields match.


    ### Copying Instances


    Case classes provide a convenient `copy` method for creating a new instance with
    modified values:


    ```scala


    val updatedPerson = person.copy(age = 31)


    ```


    Here, we create a new `Person` instance with the same `name` as the original but
    with an updated `age`.


    ### Pattern Matching with Case Classes


    Case classes are ideal for pattern matching because they allow you to destructure
    data easily. Here''s an example of pattern matching with a `Person` case class:


    ```scala


    def greet(person: Person): String = person match {


    case Person("Alice", _) => "Hello, Alice!"


    case Person(name, age) if age < 18 => s"Hi, $name! You are underage."


    case Person(name, _) => s"Hello, $name!"


    }


    val alice = Person("Alice", 30)


    val bob = Person("Bob", 15)


    println(greet(alice)) // Output: "Hello, Alice!"


    println(greet(bob)) // Output: "Hi, Bob! You are underage."


    ```


    In this code, we define a `greet` function that pattern matches against `Person`
    instances and provides different greetings based on their attributes.


    ### Case Classes for Algebraic Data Types


    Case classes are often used to represent algebraic data types (ADTs) in Scala.
    ADTs model data with a finite number of constructors. For example, you can define
    an ADT to represent different shapes:


    ```scala


    sealed trait Shape


    case class Circle(radius: Double) extends Shape


    case class Rectangle(width: Double, height: Double) extends Shape


    ```


    In this example, we define a sealed trait `Shape` and two case classes, `Circle`
    and `Rectangle`, that extend it. This modeling approach ensures that we handle
    all possible cases when pattern matching against `Shape` instances.


    ### Sealed Traits


    Using sealed traits with case classes is a recommended practice when defining
    ADTs. A sealed trait or sealed abstract class restricts the set of subclasses
    to those defined in the same source file. This restriction ensures that the compiler
    can check for exhaustive pattern matching, which is valuable for robust code.


    ### Pattern Matching with ADTs


    Pattern matching with ADTs allows you to handle different cases of data with precision.
    Here''s an example:


    ```scala


    def area(shape: Shape): Double = shape match {


    case Circle(radius) if radius > 0 => math.Pi * radius * radius


    case Rectangle(width, height) if width > 0 && height > 0 => width * height


    case _ => 0.0


    }


    val circle = Circle(5.0)


    val rectangle = Rectangle(4.0, 3.0)


    println(s"Circle area: ${area(circle)}")


    println(s"Rectangle area: ${area(rectangle)}")


    ```


    In this code, the `area` function takes a `Shape` and pattern matches against
    it, handling each case (circle or rectangle) separately.


    ## Exhaustive Pattern Matching


    Exhaustive pattern matching is a best practice in Scala to ensure that all possible
    cases are handled. When pattern matching against sealed traits or case classes,
    the compiler can help you identify missing cases. If you forget to handle a case,
    the compiler will generate a warning or error.


