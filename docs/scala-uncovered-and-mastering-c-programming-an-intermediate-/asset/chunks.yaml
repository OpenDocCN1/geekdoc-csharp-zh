    # # Chapter 7: Collections in Scala: Lists, Maps, and Sets


    Collections are a fundamental part of any programming language, and Scala provides
    a rich set of collection classes to work with different types of data. In this
    chapter, we will explore three core collection types in Scala: Lists, Maps, and
    Sets. These collections are versatile and widely used in Scala applications for
    storing, processing, and manipulating data.


    ## Lists in Scala


    A List in Scala is an ordered collection of elements of the same type. Lists are
    immutable, meaning their elements cannot be changed after creation. You can think
    of a List as a linked list where each element is a node that points to the next
    element in the list. Let''s explore Lists and their common operations.


    ### Creating Lists


    You can create a List in Scala using the `List` keyword and providing the elements
    enclosed in parentheses:


    ```scala


    val numbers: List[Int] = List(1, 2, 3, 4, 5)


    val fruits: List[String] = List("Apple", "Banana", "Cherry")


    ```


    In these examples, we create a List of integers and a List of strings.


    ### Accessing Elements


    You can access elements of a List by their index. In Scala, List indices start
    at 0 for the first element. Here''s how you can access elements:


    ```scala


    val firstNumber = numbers(0) // Accessing the first element (1)


    val secondFruit = fruits(1) // Accessing the second element ("Banana")


    ```


    ### List Operations


    #### Adding Elements


    Lists are immutable, so you cannot add or remove elements directly. Instead, you
    can create a new List with the desired elements. Here''s an example of adding
    elements to a List:


    ```scala


    val newNumbers = numbers :+ 6 // Appending an element (List(1, 2, 3, 4, 5, 6))


    val moreFruits = fruits ++ List("Grapes", "Kiwi") // Appending multiple elements
    (List("Apple", "Banana", "Cherry", "Grapes", "Kiwi"))


    ```


    #### Removing Elements


    Similarly, you can''t remove elements from a List, but you can create a new List
    without the elements you want to exclude. Here''s an example:


    ```scala


    val filteredNumbers = numbers.filter(_ != 3) // Removing element 3 (List(1, 2,
    4, 5))


    val removedFruit = fruits.filter(_ != "Cherry") // Removing "Cherry" (List("Apple",
    "Banana"))


    ```


    #### Updating Elements


    Since Lists are immutable, you cannot update elements in place. Instead, you create
    a new List with the updated elements:


    ```scala


    val updatedNumbers = numbers.updated(2, 10) // Updating element at index 2 to
    10 (List(1, 2, 10, 4, 5))


    ```


    #### List Operations


    Lists support various operations, such as mapping, folding, and more. Here are
    some common List operations:


    ```scala


    val doubledNumbers = numbers.map(_ * 2) // Doubling each element (List(2, 4, 6,
    8, 10))


    val sum = numbers.reduce(_ + _) // Summing all elements (15)


    val hasEvenNumber = numbers.exists(_ % 2 == 0) // Checking if there''s an even
    number (true)


    ```


    ### List Patterns


    Pattern matching can be used to destructure Lists and perform different actions
    based on their structure:


    ```scala


    val myList = List(1, 2, 3)


    myList match {


    case Nil => println("The list is empty")


    case head :: tail => println(s"The first element is $head, and the rest are $tail")


    }


    ```


    In this example, we match the List against two patterns: an empty List (`Nil`)
    and a List with at least one element (`head :: tail`). Pattern matching is a powerful
    way to work with Lists and extract information from them.


    ## Maps in Scala


    A Map in Scala is a collection of key-value pairs, where each key is associated
    with a value. Maps are also immutable, and you can perform various operations
    like adding, updating, and removing key-value pairs. Let''s dive into Maps and
    their common operations.


    ### Creating Maps


    You can create a Map in Scala using the `Map` keyword and specifying key-value
    pairs within parentheses:


    ```scala


    val studentScores: Map[String, Int] = Map("Alice" -> 95, "Bob" -> 88, "Charlie"
    -> 92)


    val fruitsPrice: Map[String, Double] = Map("Apple" -> 1.0, "Banana" -> 0.6, "Cherry"
    -> 2.5)


    ```


    In these examples, we create a Map of student names and their scores, and a Map
    of fruit names and their prices.


    ### Accessing Values


    You can access values in a Map by specifying the key:


    ```scala


    val aliceScore = studentScores("Alice") // Accessing Alice''s score (95)


    val cherryPrice = fruitsPrice("Cherry") // Accessing the price of cherries (2.5)


    ```


    ### Map Operations


    #### Adding and Updating


    To add or update key-value pairs in a Map, you create a new Map with the desired
    changes:


    ```scala


    val updatedScores = studentScores + ("David" -> 87) // Adding a new student (Map("Alice"
    -> 95, "Bob" -> 88, "Charlie" -> 92, "David" -> 87))


    val updatedPrices = fruitsPrice.updated("Banana", 0.7) // Updating the price of
    bananas (Map("Apple" -> 1.0, "Banana" -> 0.7, "Cherry" -> 2.5))


    ```


    #### Removing


    To remove a key-value pair from a Map, you create a new Map without that key:


    ```scala


    val withoutBob = studentScores - "Bob" // Removing Bob''s score (Map("Alice" ->
    95, "Charlie" -> 92))


    val withoutCherry = fruitsPrice - "Cherry" // Removing cherries'' price (Map("Apple"
    -> 1.0, "Banana" -> 0.6))


    ```


    #### Map Patterns


    Pattern matching can be used to destructure Maps and extract key-value pairs:


    ```scala


    val myMap = Map("Alice" -> 30, "Bob" -> 25, "Charlie" -> 35)


    myMap match {


    case emptyMap if emptyMap.isEmpty => println("The map is empty")


    case nonEmptyMap => println(s"The map contains ${nonEmptyMap.size} key-value pairs")


    }


    ```


    In this example, we match the Map against two patterns: an empty Map (`emptyMap
    if emptyMap


    .isEmpty`) and a non-empty Map (`nonEmptyMap`). Pattern matching is useful for
    handling Maps of different sizes and extracting data from them.


    ## Sets in Scala


    A Set in Scala is an unordered collection of unique elements. Sets are also immutable,
    and you can perform various operations like adding, removing, and checking for
    the existence of elements. Let''s explore Sets and their common operations.


