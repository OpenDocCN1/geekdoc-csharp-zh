    \ Scala!\n\nOpen your `Main.scala` file and modify it as follows:\n\n```scala\n\
    package YourPackage\n\nobject Main {\n  def main(args: Array[String]): Unit =\
    \ {\n    // Define a string variable\n    val greeting = \"Hello, Scala!\"\n \
    \   // Print the greeting\n    println(greeting)\n  }\n}\n```\n\nIn this modified\
    \ code, we've introduced a new concept: variables. The `val` keyword is used to\
