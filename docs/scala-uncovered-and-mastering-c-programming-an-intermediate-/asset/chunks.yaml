    ### Type Inference


    In Scala, the compiler is often able to infer the data type of a variable based
    on the assigned value. This feature, known as type inference, reduces the need
    for explicit type declarations and makes the


    code more concise and readable.


    ```scala


    val temperature = 98.6 // Compiler infers Double


    val greeting = "Hello, Scala!" // Compiler infers String


    ```


    Type inference works well for simple cases, but you can always provide explicit
    type annotations when needed for clarity or when the compiler requires them.


    ## Type Safety and Type Casting


    Scala is a statically typed language, which means that variable types are checked
    at compile time. This type safety provides several advantages:


    - **Early Error Detection**: Type checking at compile time catches type-related
    errors before your program runs, reducing the risk of runtime crashes.


    - **Optimized Code**: The compiler can generate more efficient code when it knows
    the exact data types involved.


    However, there are situations where you need to convert or cast data from one
    type to another. Scala provides mechanisms for type casting, ensuring that type
    conversions are safe and explicit.


    ### Implicit Type Conversion


    Scala allows implicit type conversions in certain cases when it can safely convert
    one data type to another without data loss. For example, converting an `Int` to
    a `Double` is a safe operation.


    ```scala


    val intNumber: Int = 42


    val doubleNumber: Double = intNumber // Implicit conversion from Int to Double


    ```


    ### Explicit Type Casting


    In situations where an implicit conversion is not possible, you can explicitly
    cast a value from one type to another using the `asInstanceOf` method. However,
    explicit type casting should be used sparingly and with caution, as it may result
    in runtime errors if the conversion is not valid.


    ```scala


    val pi: Double = 3.14159


    val piAsInt: Int = pi.asInstanceOf[Int] // Explicitly cast Double to Int


    ```


    ### Type Checking


    To ensure type safety when casting, Scala provides the `isInstanceOf` method to
    check the type of a value at runtime. This can be useful when you need to confirm
    that a cast is valid before performing it.'
