    # **Chapter 10: File Handling and I/O Operations**


    Welcome to the world of file handling and input/output (I/O) operations in C#!
    In this chapter, we''ll delve into the fascinating realm of reading from and writing
    to files, a fundamental skill for managing data in many applications. By mastering
    file handling and I/O, you''ll gain the ability to interact with files, store
    and retrieve information, and create more dynamic and data-driven programs.


    ## Reading from Files


    Reading from files involves extracting data from files stored on your computer.
    This is particularly useful when you need to load configuration settings, user
    data, or any other form of persistent information.


    ### Reading Text Files


    To read data from a text file, you can use the `StreamReader` class. This class
    provides methods to read text from files character by character or line by line.


    ```csharp


    using System;


    using System.IO;


    class Program


    {


    static void Main()


    {


    string filePath = "data.txt"; // Path to the text file


    using (StreamReader reader = new StreamReader(filePath))


    {


    string line;


    while ((line = reader.ReadLine()) != null)


    {


    Console.WriteLine(line);


    }


    }


    }


    }


    ```


    In this example, the `StreamReader` reads each line from the file and prints it
    to the console.


    ## Writing to Files


    Writing to files involves storing data in files on your computer. This is useful
    for saving user-generated content, logs, or any form of output from your program.


    ### Writing Text Files


    To write data to a text file, you can use the `StreamWriter` class. This class
    provides methods to write text to files.


    ```csharp


    using System;


    using System.IO;


    class Program


    {


    static void Main()


    {


    string filePath = "output.txt"; // Path to the output file


    using (StreamWriter writer = new StreamWriter(filePath))


    {


    writer.WriteLine("Hello, world!");


    writer.WriteLine("This is a sample text file.");


    }


    }


    }


    ```


    In this example, the `StreamWriter` writes two lines of text to the file.


    ## Binary File I/O


    Binary file I/O involves reading and writing data in binary format rather than
    plain text. This is suitable for storing structured data, images, audio, and other
    types of binary information.


    ### Reading Binary Files


    To read from binary files, you can use the `BinaryReader` class. This class provides
    methods to read various types of binary data.


    ```csharp


    using System;


    using System.IO;


    class Program


    {


    static void Main()


    {


    string filePath = "data.dat"; // Path to the binary file


    using (BinaryReader reader = new BinaryReader(File.Open(filePath, FileMode.Open)))


    {


    int intValue = reader.ReadInt32();


    double doubleValue = reader.ReadDouble();


    string stringValue = reader.ReadString();


    Console.WriteLine("Int value: " + intValue);


    Console.WriteLine("Double value: " + doubleValue);


    Console.WriteLine("String value: " + stringValue);


    }


    }


    }


    ```


    In this example, the `BinaryReader` reads an integer, a double, and a string from
    the binary file.


    ### Writing Binary Files


    To write to binary files, you can use the `BinaryWriter` class. This class provides
    methods to write various types of binary data.


    ```csharp


    using System;


    using System.IO;


    class Program


    {


    static void Main()


    {


    string filePath = "output.dat"; // Path to the binary output file


    using (BinaryWriter writer = new BinaryWriter(File.Open(filePath, FileMode.Create)))


    {


    int intValue = 42;


    double doubleValue = 3.14;


    string stringValue = "Binary data";


    writer.Write(intValue);


    writer.Write(doubleValue);


    writer.Write(stringValue);


    }


    }


    }


    ```


    In this example, the `BinaryWriter` writes an integer, a double, and a string
    to the binary file.


    ## Exception Handling in File I/O


    File I/O operations can encounter exceptions, such as file not found, permission
    issues, or disk errors. It''s important to handle these exceptions to ensure the
    stability of your program.


    ```csharp


    try


    {


    using (StreamReader reader = new StreamReader("nonexistent.txt"))


    {


    string line = reader.ReadLine();


    }


    }


    catch (FileNotFoundException ex)


    {


    Console.WriteLine("File not found: " + ex.Message);


    }


    catch (IOException ex)


    {


    Console.WriteLine("An I/O error occurred: " + ex.Message);


    }


    ```


    In this example, we handle `FileNotFoundException` and `IOException` exceptions
    that might occur during file reading.


    ## Conclusion


    In this chapter, we''ve explored the essential skills of file handling and I/O
    operations in C#. We learned how to read and write text files using the `StreamReader`
    and `StreamWriter` classes, and we delved into binary file I/O using the `BinaryReader`
    and `BinaryWriter` classes.


    Remember that file handling is crucial for managing data in many applications.
    Whether you''re storing user preferences, logging events, or processing large
    datasets, the ability to interact with files is a powerful tool in your programming
    toolkit. Embrace the world of file I/O, practice proper exception handling, and
    create applications that can store and retrieve information effectively. So, harness
    the power of file handling and I/O operations, and let your programs interact
    seamlessly with the digital world around you!


    # **Chapter 11: Working with Collections and Generics**


    Welcome to the realm of collections and generics in C#! In this chapter, we''ll
    explore how to effectively manage groups of data using various collection types
    and how to create versatile and type-safe code using generics. By mastering these
    concepts, you''ll be able to manipulate and organize data in your programs with
    ease and create more robust and flexible code.


    ## Collections: Managing Groups of Data


    Collections are data structures that allow you to store and manipulate groups
    of related data items. They provide a powerful way to manage, search, and manipulate
    data efficiently.


    ### Lists: Dynamic Arrays


    A `List` is a dynamic array that can grow or shrink as needed. It provides methods
    for adding, removing, and accessing elements.


    ```csharp


    using System;


    using System.Collections.Generic;


    class Program


    {


    static void Main()


    {


    List<int> numbers = new List<int>();


    numbers.Add(5);


    numbers.Add(10);


    numbers.Add(15);


    foreach (int number in numbers)


    {


    Console.WriteLine(number);


    }


    }


    }


    ```


    In this example, we create a `List` of integers and add three numbers to it. The
    `foreach` loop then iterates through the list and prints each number.


    ### Dictionaries: Key-Value Pairs


    A `Dictionary` is a collection that stores key-value pairs. It allows you to quickly
    retrieve values based on their associated keys.


    ```csharp


    using System;


    using System.Collections.Generic;


    class Program


    {


    static void Main()


    {


    Dictionary<string, int> ages = new Dictionary<string, int>();


    ages["Alice"] = 25;


    ages["Bob"] = 30;


    ages["Charlie"] = 28;


    Console.WriteLine("Alice''s age: " + ages["Alice"]);


    }


    }


    ```


    Here, we create a `Dictionary` that maps names to ages. We retrieve and print
    Alice''s age using her name as the key.


    ### Queues and Stacks: First-In-First-Out and Last-In-First-Out


    `Queue` and `Stack` are specialized collections that implement the first-in-first-out
    (FIFO) and last-in-first-out (LIFO) data structures, respectively.


    ```csharp


    using System;


    using System.Collections.Generic;


    class Program


    {


    static void Main()


    {


    Queue<string> queue = new Queue<string>();


    queue.Enqueue("First");


    queue.Enqueue("Second");


    queue.Enqueue("Third");


    while (queue.Count > 0)


    {


    string item = queue.Dequeue();


    Console.WriteLine(item);


    }


    }


    }


    ```'
