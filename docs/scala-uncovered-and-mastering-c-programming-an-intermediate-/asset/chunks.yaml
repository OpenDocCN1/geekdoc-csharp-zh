    # # Chapter 13: Scala''s Type System: Generics and Traits


    Scala''s type system is a powerful and flexible tool for expressing complex relationships
    between types and ensuring the correctness and safety of your code. In this chapter,
    we will delve into two essential aspects of Scala''s type system: Generics and
    Traits.


    ## Generics in Scala


    Generics, also known as parametric polymorphism, allow you to write code that
    can operate on a variety of data types while maintaining type safety. Scala''s
    generics are both expressive and concise, making them a valuable feature for building
    reusable and flexible code.


    ### Introduction to Generics


    Generics in Scala are represented using type parameters. A type parameter is a
    placeholder for a type that is defined when the generic class or method is used.
    This enables you to create classes and functions that can work with different
    types without sacrificing type safety.


    #### Generic Classes


    Let''s start with an example of a generic class, `Box`, that can hold values of
    different types:


    ```scala


    class Box[T](value: T) {


    def getValue: T = value


    }


    ```


    In this example, `T` is a type parameter that represents the type of the value
    stored in the `Box` class. You can create instances of `Box` for different types:


    ```scala


    val intBox = new Box(42)


    val stringBox = new Box("Scala")


    ```


    The type parameter `T` is inferred based on the provided values.


    #### Generic Methods


    Scala also allows you to define generic methods within non-generic classes. Here''s
    an example of a generic method, `printValue`, that works with various types:


    ```scala


    class Printer {


    def printValue[T](value: T): Unit = println(value)


    }


    val printer = new Printer


    printer.printValue(42)


    printer.printValue("Scala")


    ```


    In this case, the type parameter `T` is defined at the method level and can represent
    different types for each call to `printValue`.


    ### Variance in Generics


    Variance in generics refers to how subtyping relationships between parameterized
    types relate to the subtyping relationships between their component types. Scala
    supports three variance annotations: `+` (covariant), `-` (contravariant), and
    no annotation (invariant).


