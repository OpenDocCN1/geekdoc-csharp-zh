    ### Matching Lists


    ```scala

    val list = List(1, 2, 3)


    list match {

    case List(1, 2, 3) => println("Found a list with elements 1, 2, and 3")

    case List(1, _*) => println("Found a list that starts with 1")

    case _ => println("No match")

    }

    ```


    Here, we''re matching a list against patterns. The first case checks if the list
    is `[1, 2, 3]`, the second case checks if it starts with `1` (and any number of
    other elements), and the last case is a fallback.


    ### Pattern Matching with Case Classes


    One of the most powerful uses of pattern matching is with case classes. Case classes
    are designed for pattern matching and make it easy to destructure data into its
    constituent parts. Consider a case class representing a geometric point:


    ```scala

    case class Point(x: Int, y: Int)


    val point = Point(3, 4)


    point match {

    case Point(0, 0) => println("It''s the origin")

    case Point(x, 0) => println(s"It''s on the x-axis at $x")

    case Point(0, y) => println(s"It''s on the y-axis at $y")

    case Point(x, y) => println(s"It''s at ($x, $y)")

    }

    ```


    In this example, we''re matching a `Point` case class against different patterns.
    Each case extracts and uses the `x` and `y` components of the `Point` instance.
    Case classes simplify pattern matching by providing a convenient way to access
    structured data.


    ### Pattern Matching in Functions


    Pattern matching can also be used within functions to define different behaviors
    based on input patterns. Consider a function that calculates the area of various
    geometric shapes:


    ```scala

    def calculateArea(shape: Any): Double = shape match {

    case Point(_, _) => 0.0

    case Circle(radius) if radius > 0 => math.Pi * radius * radius

    case Rectangle(width, height) if width > 0 && height > 0 => width * height

    case _ => throw new IllegalArgumentException("Invalid shape")

    }


    val circle = Circle(5.0)

    val rectangle = Rectangle(4.0, 3.0)


    println(s"Circle area: ${calculateArea(circle)}")

    println(s"Rectangle area: ${calculateArea(rectangle)}")

    ```


    Here, we define a `calculateArea` function that accepts various shapes as input.
    The function uses pattern matching to handle each shape differently. This approach
    allows for concise and readable code, making it easy to extend the function to
    handle new shapes.


    ### Exhaustive Matching


    In Scala, the compiler encourages exhaustive matching, which means covering all
    possible cases for the input value. If you forget a case, the compiler will generate
    a warning. For instance, if we forget to handle the case of a `Circle` with a
    non-positive radius in the `calculateArea` function, the compiler will issue a
    warning.


    ### Pattern Guards


    Pattern guards allow you to apply additional conditions to cases, making the matching
    more precise. For example:


    ```scala

    val number = 42


    number match {

    case even if even % 2 == 0 => println(s"It''s even: $even")

    case odd if odd % 2 != 0 => println(s"It''s odd: $odd")

    case _ => println("It''s something else")

    }

    ```


    Here, we use guards to ensure that the number is even or odd before printing the
    message.


    ## Working with Case Classes


    Case classes are a fundamental part of pattern matching in Scala. They simplify
    data modeling and pattern matching by providing a concise way to define classes
    with constructors, fields, equality checks, and more.


    ### Defining Case Classes


    To define a case class, you use the `case class` keyword followed by the class
    name and its constructor parameters. Here''s an example of defining a `Person`
    case class:


    ```scala

    case class Person(name: String, age: Int)

    ```


    This single line of code defines a class `Person` with two fields: `name` and
    `age`. It also automatically generates methods for equality, `toString()`, and
    hash code, which are essential for pattern matching.


    ### Creating Instances


    Creating instances of case classes is straightforward. You can create them just
    like regular classes, without needing the `new` keyword:


    ```scala

    val person = Person("Alice", 30)

    ```


    This creates a `Person` instance with the given values for `name` and `age`.


    ### Accessing Fields


    To access the fields of a case class, you can use the dot notation:


    ```scala

    println(person.name) // Output: "Alice"

    println(person.age) // Output: 30

    ```


    Case class fields are automatically defined as read-only properties.


    ### Equality


    Case classes automatically implement structural equality, meaning two instances
    are considered equal if their fields are the same:


    ```scala

    val person1 = Person("Alice", 30)

    val person2 = Person("Alice", 30)


    println(person1 == person2) // Output: true

    ```


    In this example, `person1` and `person2` are considered equal because their `name`
    and `age` fields match.


    ### Copying Instances


    Case classes provide a convenient `copy` method for creating a new instance with
    modified fields:


    ```scala

    val updatedPerson = person.copy(age = 31)

    ```

