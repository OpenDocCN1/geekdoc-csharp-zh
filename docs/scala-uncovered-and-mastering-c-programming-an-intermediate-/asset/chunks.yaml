    \ in a separate thread provided by the implicit execution context `global`.\n\n\
    ### Executing Code When a `Future` Completes\n\nOnce you have a `Future`, you\
    \ can specify code to run when the `Future` completes using the `onComplete` method.\
    \ This method takes a callback function that handles the result or failure of\
    \ the `Future`.\n\n```scala\nfutureResult.onComplete {\n  case scala.util.Success(result)\
