    \ In Scala, errors and exceptions are represented as objects of types derived\
    \ from the `Throwable` class.\n\n### Common Types of Exceptions\n1. `NullPointerException`:\
    \ Thrown when attempting to access a member or invoke a method on a `null` object\
    \ reference.\n2. `IllegalArgumentException`: Thrown when an illegal argument is\
    \ passed to a method.\n3. `IllegalStateException`: Thrown when the state of an\
