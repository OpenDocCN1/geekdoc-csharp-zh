    \n  }.toList\n  val className = T.tpe.typeSymbol.name\n  c.Expr(q\"\"\"${className.toString}(${fields.mkString(\"\
    , \")})\"\"\")\n}\ncase class Person(name: String, age: Int)\nval toStringCode\
    \ = caseClassToString[Person]\nprintln(toStringCode) // \"Person(name: name, age:\
    \ age)\"\n```\n\n在这个示例中，`caseClassToString` 宏通过检查字段生成 `toString` 方法。\n\n### 7.\
    \ Scalaz 和 Cats：函数式库\n\n[Scalaz](https://github.com/scalaz/scalaz) 和 [Cats](https://typelevel.org/cats/)\
    \ 是 Scala 的函数式库，提供了处理函数式编程概念的抽象。这些库提供了大量的类型类、数据类型和函数式抽象。\n\n这些库的一个常见用例是处理 `monads`、`applicative\
    \ functors` 和其他函数构造。它们还提供了一套完整的类型类，如 `Functor`、`Applicative`、`Monad` 等。\n\n使用\
    \ Cats 的 `Either` 类型处理错误的示例：\n\n```scala\nimport cats.data._\n// 定义自定义错误类型\nsealed\
    \ trait MyError\ncase class ValidationError(message: String) extends MyError\n\
    case class DatabaseError(message: String) extends MyError\n\n// 创建 Either 实例\n\
    val result: EitherT[Option, MyError, Int] = EitherT.rightTOption, MyError\n\n\
    // Map 和 flatMap 操作\nval doubledResult: EitherT[Option, MyError, Int] = result.map(_\
    \ * 2)\n\n// 处理错误\nval errorResult: EitherT[Option, MyError, Int] = EitherT.leftTOption,\
    \ MyError)\n\n// 对 EitherT 进行模式匹配\nval message = errorResult.fold(\n  _.toString,\n\
    \  _.toString\n)\n```\n\n在这个示例中，我们使用 Cats 的 `EitherT` 来处理可能是成功（右侧）或错误（左侧）的值。\n\
    \n"
- fmt: "\n# 8. Shapeless for Generic Programming\n\n[Shapeless](https://github.com/milessabin/shapeless)\
    \ is a powerful library for generic programming in Scala. It allows you to write\
    \ generic functions and manipulate data structures with a high degree of flexibility.\n\
    \nOne common use case for Shapeless is `automatic type class derivation`. It can\
    \ automatically derive type class instances for your custom data types:\n\n```scala\n\
    import shapeless._\ncase class Person(name: String, age: Int)\n\n// Derive a Generic\
    \ instance for Person\nval personGen = Generic[Person]\n\n// Encode a case class\
    \ into a generic representation (HList)\nval personHList: String :: Int :: HNil\
    \ = personGen.to(Person(\"Alice\", 30))\n\n// Decode a generic representation\
    \ (HList) back into a case class\nval alice: Person = personGen.from(personHList)\n\
    ```\n\nIn this example, Shapeless's `Generic` allows you to convert between a\
    \ case class and a generic representation (an `HList` in this case) without writing\
    \ boilerplate code.\n\n# Conclusion\n\nCongratulations! You've completed \"Scala\
