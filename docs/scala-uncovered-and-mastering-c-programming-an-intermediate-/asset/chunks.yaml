    \n## Generics: Type-Safe Reusability\n\nGenerics allow you to create classes,\
    \ methods, and interfaces that work with different data types while maintaining\
    \ type safety. They provide a way to create reusable code that adapts to different\
    \ data requirements.\n\n### Creating Generic Classes\n\nA generic class is a class\
    \ that can work with different types. For example, a `List<T>` class can hold\
    \ elements of any type `T`.\n\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
    \nclass Program\n{\n    static void Main()\n    {\n        List<int> intList =\
    \ new List<int>();\n        intList.Add(5);\n        intList.Add(10);\n\n    \
    \    List<string> stringList = new List<string>();\n        stringList.Add(\"\
    Hello\");\n        stringList.Add(\"World\");\n\n        foreach (int number in\
    \ intList)\n        {\n            Console.WriteLine(number);\n        }\n   \
    \     foreach (string str in stringList)\n        {\n            Console.WriteLine(str);\n\
    \        }\n    }\n}\n```\n\nIn this example, we demonstrate the use of the generic\
    \ `List<T>` class for both integers and strings.\n\n### Creating Generic Methods\n\
    \nGeneric methods allow you to create methods that can work with different types\
    \ without rewriting code.\n\n```csharp\nusing System;\n\nclass Program\n{\n  \
    \  static void Swap<T>(ref T a, ref T b)\n    {\n        T temp = a;\n       \
    \ a = b;\n        b = temp;\n    }\n\n    static void Main()\n    {\n        int\
    \ x = 5, y = 10;\n        Console.WriteLine(\"Before: x = \" + x + \", y = \"\
    \ + y);\n        Swap(ref x, ref y);\n        Console.WriteLine(\"After: x = \"\
    \ + x + \", y = \" + y);\n    }\n}\n```\n\nHere, the `Swap` method is generic,\
    \ allowing us to swap values of different types.\n\n## Constraints in Generics\n\
    \nYou can apply constraints to generic parameters to limit the types that can\
    \ be used. Common constraints include `where T : class` (reference type), `where\
    \ T : struct` (value type), and `where T : new()` (parameterless constructor).\n\
    \n```csharp\nusing System;\n\nclass Program\n{\n    static T FindMax<T>(T[] array)\
    \ where T : IComparable\n    {\n        T max = array[0];\n        foreach (T\
    \ item in array)\n        {\n            if (item.CompareTo(max) > 0)\n      \
    \      {\n                max = item;\n            }\n        }\n        return\
    \ max;\n    }\n\n    static void Main()\n    {\n        int[] numbers = { 5, 10,\
    \ 3, 8, 2 };\n        int maxNumber = FindMax(numbers);\n        Console.WriteLine(\"\
    Maximum number: \" + maxNumber);\n\n        string[] words = { \"apple\", \"banana\"\
    , \"cherry\" };\n        string maxWord = FindMax(words);\n        Console.WriteLine(\"\
    Maximum word: \" + maxWord);\n    }\n}\n```\n\nIn this example, the `FindMax`\
    \ method uses the `where T : IComparable` constraint to ensure that the generic\
    \ parameter `T` implements the `IComparable<T>` interface, allowing comparisons.\n\
    \n## Conclusion\n\nIn this chapter, we've explored the world of collections and\
    \ generics in C#. We've learned how collections allow us to manage data efficiently\
    \ using various data structures, including lists, dictionaries, and stacks. We've\
    \ also delved into the power of generics, which enable us to write reusable and\
    \ type-safe code that can work with different types. By mastering collections\
    \ and generics, you'll be equipped with essential skills to manipulate data and\
    \ create maintainable code. Whether you're building data-driven applications or\
    \ creating reusable components, these concepts will play a vital role in your\
    \ programming journey. So, embrace the power of collections and generics, and\
    \ let your code flourish with flexibility, reusability, and efficiency!\n\n# Chapter\
    \ 12: Delegates, Events, and Lambdas\n\nWelcome to the world of delegates, events,\
    \ and lambdas in C#! In this chapter, we'll explore powerful tools that enable\
    \ you to create more flexible and responsive programs. We'll dive into delegates,\
    \ which allow you to treat methods as objects, events that facilitate communication\
    \ between components, and lambdas that enable concise and expressive code. By\
    \ mastering these concepts, you'll elevate your programming skills and design\
    \ applications more modular, interactive, and elegant.\n\n## Delegates: Function\
    \ Pointers in C#\n\nDelegates are a fundamental concept in C# that allow you to\
    \ treat methods as first-class objects. They provide a way to encapsulate and\
    \ pass methods as parameters, enabling dynamic and modular programming.\n\n###\
    \ Defining and Using Delegates\n\nA delegate is a type that represents a reference\
    \ to a method with a specific signature. It provides a way to invoke methods indirectly\
    \ through the delegate instance.\n\n```csharp\nusing System;\n\ndelegate int Calculator(int\
    \ a, int b);\n\nclass Program\n{\n    static int Add(int x, int y)\n    {\n  \
    \      return x + y;\n    }\n\n    static int Multiply(int x, int y)\n    {\n\
    \        return x * y;\n    }\n\n    static void Main()\n    {\n        Calculator\
    \ calc = Add;\n        int result = calc(5, 3);\n        Console.WriteLine(\"\
    Addition result: \" + result);\n\n        calc = Multiply;\n        result = calc(5,\
    \ 3);\n        Console.WriteLine(\"Multiplication result: \" + result);\n    }\n\
    }\n```\n\nIn this example, we define a delegate `Calculator` that represents methods\
    \ with two `int` parameters and an `int` return type. We then assign methods `Add`\
    \ and `Multiply` to the delegate instance and invoke them dynamically.\n\n###\
    \ Multicast Delegates\n\nA multicast delegate is a delegate that can hold references\
    \ to multiple methods. When invoked, all the methods are called in the order they\
    \ were added.\n\n```csharp\nusing System;\n\ndelegate void Logger(string message);\n\
    \nclass Program\n{\n    static void LogToFile(string message)\n    {\n       \
    \ Console.WriteLine(\"Logging to file: \" + message);\n    }\n\n    static void\
    \ LogToConsole(string message)\n    {\n        Console.WriteLine(\"Logging to\
    \ console: \" + message);\n    }\n\n    static void Main()\n    {\n        Logger\
    \ log = LogToFile;\n        log += LogToConsole;\n        log(\"Hello, delegates!\"\
    );\n        log -= LogToConsole;\n        log(\"Console logger removed.\");\n\
    \    }\n}\n```\n\nHere, we define a multicast delegate `Logger` that can hold\
    \ references to methods `LogToFile` and `LogToConsole`. We add both methods to\
    \ the delegate instance and observe their execution when the delegate is invoked.\n\
    \n## Events: Enabling Component Communication\n\nEvents are a mechanism for communication\
    \ between different components in a program. They allow objects to subscribe to\
    \ and receive notifications when certain actions occur.\n\n### Defining and Using\
    \ Events\n\nAn event is a delegate with restrictions on how it can be used. It\
    \ can only be invoked within the class where it is defined and can be subscribed\
    \ to from outside the class.\n\n```csharp\nusing System;\n\nclass Publisher\n\
    {\n    public event Action<string> NewMessage;\n\n    public void PublishMessage(string\
    \ message)\n    {\n        NewMessage?.Invoke(message);\n    }\n}\n\nclass Subscriber\n\
    {\n    public void OnNewMessage(string message)\n    {\n        Console.WriteLine(\"\
    Received message: \" + message);\n    }\n}\n\nclass Program\n{\n    static void\
    \ Main()\n    {\n        Publisher publisher = new Publisher();\n        Subscriber\
    \ subscriber = new Subscriber();\n\n        publisher.NewMessage += subscriber.OnNewMessage;\n\
    \        publisher.PublishMessage(\"Hello, events!\");\n\n        publisher.NewMessage\
    \ -= subscriber.OnNewMessage;\n    }\n}\n```\n\nIn this example, we define an\
    \ event `NewMessage` in the `Publisher` class and subscribe to it using the `Subscriber`\
    \ class. When the `PublishMessage` method is called, the event is invoked, and\
    \ the `OnNewMessage` method in the subscriber is executed.\n\n## Lambdas: Concise\
    \ Anonymous Functions\n\nLambdas provide a concise way to define anonymous functions\
    \ in C#. They are particularly useful when you need to provide a short piece of\
    \ code as an argument to a method or delegate.\n\n### Using Lambdas with Delegates\n\
    \nLambdas can be used to define inline methods that match the signature of a delegate.\n\
