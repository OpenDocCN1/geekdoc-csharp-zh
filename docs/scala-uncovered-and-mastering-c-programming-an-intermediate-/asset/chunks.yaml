    \n```scala\ntry {\n  // Code that might throw an exception\n} catch {\n  case\
    \ ex: ExceptionType1 => // Handle Exception1\n  case ex: ExceptionType2 => //\
    \ Handle Exception2\n}\n```\n\n### The `finally` Block\nIn addition to `try` and\
    \ `catch` blocks, you can use the `finally` block to specify code that will always\
    \ execute, whether an exception is thrown or not. This is useful for performing\
    \ cleanup or resource management tasks.\n\n```scala\ntry {\n  // Code that might\
    \ throw an exception\n} catch {\n  case ex: ExceptionType => // Handle the exception\n\
    } finally {\n  // Code always executes\n}\n```\n\n### Throwing Exceptions\nYou\
    \ can explicitly throw exceptions using the `throw` keyword. This allows you to\
