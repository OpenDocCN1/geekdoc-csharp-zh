  \ `runat` 属性。如果没有在标记中设置该值，你就无法在代码后台对其进行任何操作。\n\n2. 文本框中的文本可以通过简单访问 `Text` 属性来获取。理解选中的复选框项则不同，因为列表包含一个或多个项，每个项都可能选中。你需要遍历列表并确定哪些项的\
