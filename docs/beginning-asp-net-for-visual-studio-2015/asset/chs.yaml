  \ 表 19.1 转换项目\n\n# 引言\n\n**据 2015 年 6 月估计**，全球 45% 的人口已经访问了互联网。这意味着有超过 30 亿用户，而且数量每天在增长。这是一个庞大的连接市场，可以覆盖你决定提供的任何内容，无论是简单的网页还是复杂的\
  \ 应用程序。\n\n有很多方法可以提供简单的网页。但当你尝试构建 应用程序时，方法要少得多。这些 应用程序技术之一就是微软的 ASP.NET。\n\nASP.NET\
  \ 是一个用于构建健壮且高性能应用程序的框架。你可以将其想象为汽车的结构支撑。你可以在此添加两种不同的外观设计：Web Forms 和 MVC。\n\nVisual\
  \ Studio 2015 是创建和维护 ASP.NET 应用程序的主要工具。它可以帮助你轻松处理应用程序的各个方面，从外观到部署，一个不遗漏。此外，由于微软致力于支持\
  \ ASP.NET 开发者，它提供一个功能完整的免费版本！\n\n\n\n\n本书旨在为想要构建健壮、高性能且可扩展的 Web 应用程序的人设计。尽管开发工具在\
  \ Microsoft Windows 上运行，但你可以自由地将应用程序部署到几乎任何当前的操作系统；因此，即使是没有 Microsoft 服务器的组织，现在也有能力运行\
  \ `ASP.NET` Web 应用程序。\n\n如果你是软件开发的新手，跟随本书学习应该没有问题，因为本书的结构设计充分考虑了你的需求。对于那些有经验的开发者但对\
  \ Web 开发不熟悉的读者，也会发现许多不同的兴趣和应用领域，特别是如果 `C#` 不是你目前使用的编程语言的话。\n\n最后，丰富的 `ASP.NET` 开发者也能发现许多感兴趣的话题，特别是如果你的经验主要与\
  \ `Web Forms` 或 `MVC` 相关，但两者未兼顾。本书将让你获得这两种方法的经验，并演示如何将这两种方法集成到一个应用程序中。\n\n## 本书内容\n\
  \n本书将教你如何构建一个功能完整的 Web 应用程序。你将有机会使用 `ASP.NET MVC` 和 `ASP.NET Web Forms` 方法构建一个完整的网站，从而让你对整个\
  \ `ASP.NET` 功能集建立理解并能够熟练运用。每一章都带你在开发过程中更进一步：\n\n*   **第 1 章：ASP.NET 6.0 入门**——你将了解\
  \ `ASP.NET` 作为一个通用框架，特别是通过 `Web Forms` 和 `MVC`。你还将下载并安装 `Visual Studio 2015`。\n\
  *   **第 2 章：构建初始 ASP.NET 应用程序**——在本章中，你将创建初始项目，包括配置以支持 `Web Forms` 和 `MVC`。\n* \
  \  **第 3 章：设计你的网页**——本章介绍 `HTML` 和 `CSS`，以便你构建美观且易懂的网站。\n*   **第 4 章：使用 C# 和 VB.NET\
  \ 编程**——`ASP.NET` 是一个开发框架，你可以从中使用不同的编程语言，包括 `C#` 和 `VB.NET`。本章提供了这些语言的使用介绍。\n* \
  \  **第 5 章：ASP.NET Web Form 服务器控件**——`ASP.NET Web Forms` 提供了许多不同形式的内置功能作为服务器控件。这些控件允许你用极少的代码创建复杂且功能丰富的网站。本章涵盖了最常用的控件。\n\
  *   **第 6 章：ASP.NET MVC 辅助类和扩展**——`ASP.NET Web Forms` 使用服务器控件提供功能，而 `ASP.NET MVC`\
  \ 通过使用辅助类和扩展提供了不同的支持。本章描述了这种不同的支持。\n*   **第 7 章：创建外观一致的网站**——你将学习 `ASP.NET` 如何让你使用主页（Master\
  \ Pages）和布局页（Layout Pages）在整个 Web 应用程序中创建一致的外观。\n*   **第 8 章：导航**——在本章中，你将学习创建菜单和其他导航结构的不同方法。还将查看在\
