  \ HTML 元素变为 HTML 控件。这使得值和一些其他属性可以在代码后台中使用。\n\n### 第 6 章\n\n\n\n\n\n# 1. `TextboxFor`\
  \ 辅助方法专门将模型上的属性绑定到 HTML 元素上。这种绑定通过 Lambda 表达式实现，该表达式帮助系统识别应该使用模型上的哪个属性进行绑定。`Textbox`\
  \ 元素通常接收字符串名称，而不是直接的模型绑定。传递给辅助方法的名称就是它所创建的 HTML 元素的名称。然而，只要传递给辅助方法的名称与你希望将其关联的属性名称相同，模型绑定器就可以解释哪个属性应该获取返回的值。\n\
  \n2. Razor 视图引擎识别“它应该处理的代码”与“需要直接传递到 HTML 的文本”之间区别的首要方法，是通过使用 `@` 字符和花括号 `{}`}`。如果\
  \ `C#`（或 `VB`）代码位于 `@` 字符之后或包含在一组括号内，视图引擎就知道要运行该代码。\n\n视图引擎足够智能能够识别你何时开始编写 HTML\
  \ 元素，因此它会切换回文本读取模式。然而，如果你想让它回到代码处理模式，你需要再次以 `@` 字符作为前缀；因此，你可以在其他带有 `@` 标记的构造体中使用\
  \ `@ code`。\n\n3. 不，视图并不总是必须与 action 的名称匹配。如果你返回一个 `View()`，它期望的是一对一的对应；但是，你也有能力添加要返回的视图名称。这使你能够从控制器\
  \ action 返回任何视图，只要你恰当地定义了返回的视图方法。\n\n4. 模型绑定器能够通过点表示法来确定嵌套对象的属性。例如，假设你有如下所示的对象结构：\n\
  \n```\npublic class Parent\n{\n    public Child Child { get; set; }\n}\npublic class\
  \ Child\n{\n    public GrandChild GrandChild { get; set; }\n}\npublic class GrandChild\n\
  {\n    public string SomeProperty { get; set; }\n}\n```\n\n只要确保 textbox 元素的名称为 `Child.GrandChild.SomeProperty`，且传递给视图的模型是\
  \ parent，textbox 就能设置孙对象的属性。\n\n# 第 7 章\n\n1. 控制器和网页是传统的 OO 类，因此即使它们已经继承了其他类，只要该中间类扩展了页面已经继承的类，添加一个中间类也是容易的。然而，视图是另一种方法；它们没有类定义，也没有任何能让你创建继承方案的机制。它们相反是被处理的值。\n\
  \n2. 在 `ViewStart` 文件中使用 `Layout` 命令的优势在于，你不需要在视图和布局之间建立硬链接。如果你没有 `ViewStart` 并且将布局指向另一个文件，你必须进入每个页面来进行更改。`ViewStart`\
  \ 允许你指定主布局页面并默认进行分配。\n\n# 第 8 章\n\n1. 它们最终将到达 `http://www.servername.com/Admin/~/default`，在那里它们很可能会得到\
  \ 404 错误（页面未找到）。如果锚点标签被赋予额外的属性 `runat='server'`，那么系统将要把 `~` 替换为应用程序根目录。然而，在没有 `runat='server'`\
  \ 的情况下，HTML 元素会变成 HTML 控件，因此系统不会对代码进行任何额外的解释。\n\n2. 寻找响应 `http://www.servername.com/results`\
  \ 请求的代码有两种主要方法。第一种是检查项目，查看是否存在一个名为“results”的文件夹。如果有，那么该目录下的默认文件很有可能响应该请求。这意味着它是由\
  \ ASP.NET Web Forms 页面提供的。如果这没有提供结果，下一步将查看 `Controllers` 目录，确定是否存在用于处理此 URL 请求的控制器，最可能是\
  \ `ResultsController`。如果该控制器存在，则查看 actions 以找到一个为基础 URL 提供 get 请求的项。如果你无法在那里找到任何内容，则需要检查\
  \ `RouteConfig.cs` 文件，以评估它是否包含一个处理此路径的硬编码路由。如果是，请遵循此路由建议找到适当的处理程序。\n\n3. 实施友好型 URL（Friendly\
  \ URLs）有几个原因。首先，它让地址变得更容易记忆，因为用户不需要在 URL 中包含扩展名。这使得用于广告的 URL 更加有效。另一个原因是它让其他 URL\
  \ 更具可预测性和可猜性。这让用户有信心可以在你的网站上找到信息。最后一个大原因是搜索引擎优化（SEO），得到了更好的支持，因为友好型 URL 允许消除查询字符串转而使用\
  \ URL 变量，将 `http://www.servername.com/product.aspx?id=8` 转换为 `http://www.servername.com/product/8`\
  \ 甚至 `http://www.servername.com/product/Product_Name`。\n\n# 第 9 章\n\n1. `MigrationHistory`\
  \ 表记录了在该数据库中每次运行 `update database` 命令的情况。它存储了开发者创建的迁移名称、分配给迁移的上下文，以及所用模型（s）的信息。如果你查看该表，可以确定前两项，但模型信息是以二进制格式存储的，并非用于在\
  \ Entity Framework 上下之外允许反向迁移。\n\n2. 特性路由（Attribute routing）允许开发者直接在 action 上定义\
  \ action 响应的 URL，而不是使用标准模板。模板方法的主要问题之一是，应用程序中似乎总有一个路由是无法通过模板方法管理的。开发者必须在 `RouteConfig`\
  \ 文件中硬编码路由，或者以其他方式操作 action 的命名和调用，以确保可以通过基于模板的“一刀切”方法进行管理。\n\n3. 使用 `using` 语句可以确保创建的对象（在本例中为\
  \ `DbContext`）在完成后被释放。这样做确保了 .NET 垃圾回收在下次运行时能够从内存中提取此项。否则，此项可能会在内存中留存很久，会对内存使用产生更长期的影响，可能会影响用户体验。\n\
  \n# 第 10 章\n\n1. 如果你创建一个新项，该项可能不会显示在列表页面，特别是如果你最近访问过列表页面。这是因为缓存被设置为 20 分钟，所以访问列表页面、创建或编辑项，然后立即返回列表页面，可能会导致列表本身被缓存；因此，在之前的缓存过期之前，不会重新调用列表。\n\
  \n2. 如果你不想通过使用 `ViewBag` 向视图传递信息，那么最佳方法是创建一个 `ViewModel`，在本例中，它是一个具有两个属性的类：爱好列表和当前作为模型使用的\
  \ `UserDemographics` 项。\n\n\n\n\n3. 有多个原因导致你可能想要使用更直接的方法访问数据库，包括响应时间和性能问题、复杂的查询、与其他使用数据库访问的应用程序集成，以及保持应用程序之间行为一致的需要。\n\
  \n## 第 11 章\n\n1. 是的，你可以使用用户控件（user control）来解决相同的问题。虽然你无法获得 `DisplayFor` 或 `EditorFor`\
  \ 的自动转换，但没关系，因为 ASP.NET Web Forms 世界中并不支持这两个概念。相反，你会创建一个用户控件，该控件包含一个你想要显示的模型对象参数。后置代码（code-behind）可以接收该对象并执行必要的工作，无论是简单地显示该项目还是对该项目执行业务逻辑。虽然控件的实例化稍微有些笨拙，但你可以创建一个与\
  \ MVC 模板非常的用户控件。\n\n2. 当你调用的 action 位于同一个控制器时，在 `Html.Action` 方法调用中不需要包含控制器名称。如果\
  \ action 位于不同的控制器，则你需要确保包含了适当的控制器名称。\n\n3. 在标记中使用属性（attributes）时，重要的是记住一切实际上都是一个字符串，因此将一个整数放入定义为字符串的属性中不会引起任何问题；该属性将用整数的字符串版本填充。反过来则会有问题。当你将字符串值放入非字符串属性时，你必须确保该字符串值可以解析为相应的类型。如果你没有正确这样做（例如将值\
  \ “two” 放入整数字段中），你将收到多个警告。首先，标记页上将显示一个验证错误。其次，当你尝试运行应用程序时，你将得到一个异常页面，因为系统无法完成必要的转换。\n\
  \n## 第 12 章\n\n1. 请求验证（Request validation）已根据控制器上的属性被开启，因此允许任何 HTML 通过该过程的唯一方法是在模型级别上开启它。然而，如果你检查该模型，你会发现\
  \ `Description` 属性具有允许 HTML 的适当属性。因此， Title 中的任何 HTML 都会导致抛出异常，而 Description 中的任何\
  \ HTML 将被允许通过请求过程。\n\n2. 验证控件添加到页面顺序不会影响实际验证的任何内容。\n\n3. 是的，完全可以设置一种模型永远无法通过的场景。即使排除了诸如在应该使用“大于”时使用了“小于”这种显而易见的错误，设置这类情况也很容易，特别是当使用比较一个控制器与另一个控制器值的验证方法时。如果你遵循了确保始终有一个有效且完整的消息的建议，那么你应该能够理解并管理那些你因验证而陷入困境的场景。\n\
  \n## 第 13 章\n\n1. 只要你同时添加了相同的 `<div>` 标签和脚本，就不需要做任何不同的操作。无论你使用什么类型的 ASP.NET 创建页面，只要所有正确的元素都在页面内，它就能工作。\n\
  \n2. 在 Web Form 应用程序中使用 AJAX jQuery 库可以通过多种方式实现。也许简单的方法是包含 JavaScript 库的脚本引用，就像你在示例中所做的那样。你可以手动向触发更改的元素（通常是锚点链接）添加属性。示例所示：\n\
  \n```\n<a  data-ajax=\"true\"\n    data-ajax-method=\"GET\"\n    data-ajax-mode=\"\
  replace\"\n    data-ajax-update=\"#thelementToReplace\"\n    href=\"/URL TO CALL\"\
  >Displayed Text</a\n\n```\n\n预期是你有一个 URL，该 URL 将返回适合在属性所标识的元素中显示的 HTML。\n\n3. 使用定时器刷新内容有几个潜在问题。其中之一是可能会不必要的使用带宽和处理资源。只要页面打开，浏览器就会继续进行这些调用。用户可能去过页面，看了几分钟，然后在不关闭浏览器的情况下决定做其他事情。即使用户不在了，页面也会继续进行调用。可能经历的另一个问题可能是由于瞬时网络中断或服务器问题；用户将不会获得预期的页面部分内容，而是尝试处理一个错误。\n\
  \n## 第 14 章\n\n1. 此更改应该只作用于这些特定元素，因此你应该做的第一件事是为每个元素添加一个 `id`，以便你的 jQuery 代码可以选择正确的项目。添加\
  \ `id` 后，你可以设置 `<p>` 元素的 `hover` 函数来更改 `<h1>` 元素的 css 颜色值。所有代码显示在此：\n\n```\n<h1\
  \ id=\"colorchange\">Title</h1>\n<p id=\"hoverover\">Content</p>\n$(document).ready(function\
  \ () {\n    $(\"#hoverover\").hover(\n        function () {\n            $(\"#colorchange\"\
  ).css('color', 'yellow');\n        }, function () {\n            $(\"#colorchange\"\
  ).css('color', 'green');\n        });\n});\n```\n\n2. ling（打包）允许你将相同类型的多个文件（如 CSS\
  \ 或 JavaScript）合并成单个文件进行下载。当你想要将多个脚本发送到客户端，但浏览器只对某个域支持有限数量的连接时，打包变得非常重要。当页面渲染时，每次对服务器的调用可能会排队。这些项目可以包括图像、CSS\
  \ 文件、JavaScript 文件以及可以从服务器下载的任何其他项目。\n\n    打包项的大小也很。将多个大文件放入一个包中可能会减慢加载速度，因为用户是通过单个通道获取大文件，而不是同时下载两个较小文件。\n\
  \n    最后，脚本的更改量很重要。脚本的任何更改都会导致新的包下载到客户端。因此，如果你在某个脚本上做了大量工作，你可能想将其移出包并单独保留；否则，浏览器会将包含多个文件的包视为新的。\n\
  \n3. `Ajax.Helper` 类有四个不同的事件可以添加到 JavaScript 函数中：`OnBegin` 允许你在调用准备就绪但在调用服务器之前知道它；`OnComplete`\
  \ 在调用服务器完成后但在页面更新之前调用；`OnFailure` 处理任何错误情况；`OnSuccess` 在页面更新后调用。这些每一个项都允许你将 JavaScript\
  \ 函数添加到工作流中。\n\n\n\n\n1. 你有几种不同的方法来收集此类信息。一种方法是直接询问用户偏好什么颜色。虽然这种方法并不复杂，但通常能获得相对准确的信息。另一种更微妙的方法是跟踪用户在购物访问期间查看的各种颜色，可能还会跟踪搜索词，以防这些搜索词中也经常包含颜色。\n\
  \n2. 你可以利用这类信息做很多不同的事情。例如，你可以用某种颜色为显示给该用户的页面背景着色。另一种简单的个性化方法是自动显示用户偏好的颜色，这样用户无需亲自进行选择。\n\
  \n# 第 17 章\n\n1. 当你有多个 `catch` 语句时，框架会按照从到下的顺序根据 `catch` 参数对异常进行评估。由于采取了这种方法，你必须确保最通用的异常位于列表的底部。在这种情况下，没有任何异常会进入第二个\
  \ `catch` 块，因为它们都会被第一个通用的 `catch` 块捕获。\n\n2. 你可以使用追踪（tracing）或日志（logging）来提供有关应用程序内部发生任何情况的信息。这包括添加追踪和/或日志代码的能力，这些代码将提供每个方法所耗时间的信息。一种方法是使用如下代码：\n\
  \n```\npublic ActionResult Details(string id)\n{\n    DateTime enterDate = DateTime.Now;\n\
  \    // 执行大量可能耗费长时间的工作\n    string message = string.Format(\n            \"Details\
  \ methods took {0} milliseconds\",\n            (DateTime.Now - enterDate).Milliseconds);\n\
  \    System.Diagnostics.Trace.TraceInformation(message);\n    return View();\n}\n\
  ```\n\n# 第 18 章\n\n1. 更改集（changeset）是一次提交的完整更改 set。它之所以重要，因为它识别了更改的文件，以便在需要时对这些更改进行隔离和回滚。\n\
  \n2. 检出（checkout）描述了用户何时通知系统（通过有意操作或编辑文件）他将对特定文件进行更改。检出可以是锁定或非锁定的。当文件被锁定时，系统将不允许另一个用户检出该文件。检出很重要，因为如果文件没有被检出，用户将不允许提交更改。\n\
  \n3. TFS 具有允许用户查看文件历史的功能。此外，如果需要，用户可以并排显示这些不同的历史版本，以便比较每个版本中的特定更改。\n\n# 第 19 章\n\
