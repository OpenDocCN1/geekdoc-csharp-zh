  \n### 使用 jQuery 选择项目\n\n最后一章简要解释了 jQuery 选择，或者使用 jQuery 根据该元素的一个或多个特征来查找一个或多个 DOM\
  \ 元素。正如上一章所示，`jQuery` 中最常用的选择方法是使用与 `CSS selectors` 支持的相同的选择器模式和方法。然而，某些选择器之间存在细微差异，而且\
  \ jQuery 中还提供了其他更灵活的选择器供使用。表 14.3 列出了 jQuery 中可用的某些元素选择方法。\n\n| 属性 | 描述 |\n| :---\
  \ | :--- |\n| 属性包含前缀选择器 | 选择具有指定属性的元素，其值等于提供的字符串或以该字符串开头并跟一个连字符（-）。`<input name=‘the-news’>\
