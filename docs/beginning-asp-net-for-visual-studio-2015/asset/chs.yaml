  \ 修改 DOM\n\n第二类工具方法是那些扫描整个文档主体的方法。这些方法可以检查一个元素是否包含另一个元素，或者在任何元素的任何属性上设置任何值。其中大多数操作也可以通过选择器完成，然后在此与元素属性进行交互，但工具方法为你提供了解决问题的另一种方法。\n\
  \n### 使用 jQuery 修改外观\n\n第二类工具方法是那些扫描整个文档主体的方法。这些方法可以检查一个元素是否包含另一个元素，或者在任何元素的任何属性上设置任何值。其中大多数操作也可以通过选择器完成，然后在此与元素属性进行交互，但工具方法为你提供了解决问题的另一种方法。\n\
  \n| 方法 | 描述 |\n| :--- | :--- |\n| `addClass` | 为匹配集合中的每个元素添加指定的类（类）。$( ‘p’ ).addClass(\
  \ ‘myClass yourClass’ );` |\n| `css` | 获取匹配集合中第一个元素的样式属性值，或为每个元素设置一个或多个 CSS 属性。`var\
  \ color = $( ‘p’ ).css( ‘background-color’ );` |\n| `hasClass` | 确定匹配元素是否分配了指定的类。`$(\
  \ ‘p’ ).hasClass( ‘myClass’ );` |\n| `height` | 获取匹配集合中第一个元素的高度，或设置每个匹配元素的高度。它返回一个以像素为单位的值，但不带单位，例如\
  \ 400 而不是 400px。 |\n| `position` | 获取匹配集合中第一个元素相对于偏移父元素的当前坐标。你不能设置这些值，只能根据需要获取。这些元素必须是可见的，且结果不考虑边框、外边距或内边距。`var\
  \ selectedElement = $( ‘p:last’ );` `var position = selectedElement.position();`\
  \ `$( ‘p:first’ ).val = position.left + position.top;` |\n| `removeClass` | 从匹配集合中的每个元素移除单个类、多个类或所有类。$(\
  \ ‘p’ ).removeClass( ‘myClass yourClass’ )` |\n| `toggleClass` | 根据类的存在为匹配集合中的每个元素添加或移除一个或多个类。如果类存在，则移除；如果类不存在，则添加。$(\
  \ ‘p’ ).toggleClass( ‘myClass’ );` |\n| `width` | 获取匹配集合中第一个元素的当前宽度，或设置每个匹配元素的宽度。它返回一个以像素为单位的值，但不带单位，例如\
  \ 400 而不是 400px。$( ‘p’ ).width( ) = 100;` |\n\n**表 14.4** jQuery 中的 CSS 方法\n\n\n\
  \n\n在选择 DOM 元素之后，还有其他方法可以改变它们的外观。如所示，更改分配的样式是改变显示的一种方法。然而，样式的更改通常是静态的。你还可以使用 JavaScript（即\
  \ jQuery）来为 DOM 元素提供简单的动画或其他视觉效果。表 14.5 描述了 jQuery 中提供的各种动画和其他效果方法。\n\n| 方法 | 描述\
  \ |\n| :--- | :--- |\n| `animate` | 对一组 CSS 属性执行自定义动画。其典型用法是使用方法签名 `animate( properties,\
  \ options )`。<input id=‘someelement’>` `<input id=‘anotherelement’>` |\n\n```javascript\n\
  $( ‘#someelement’ ).click(function() {\n  $( ‘#anotherelement’ ).animate({\n   \
  \ left: ‘+=50’ // 每次点击时都向左移动\n  }, 5000, function() {\n    // 动画完成后执行某些操作\n  });\n\
  });\n``` |\n| `delay` | 设置计时器以延迟执行队列中后续的项。此值通常与其他动画项链式调用。<input id=‘someelement’>`\
  \ `<input id=‘anotherelement’>` |\n\n```javascript\n$( ‘#someelement’ ).click(function()\
  \ {\n  $( ‘#anotherelement’ ).slideUp(300).delay(800).fadeIn(400);\n});\n``` |\n\
  | `fadeIn` | 通过将匹配元素渐变为不透明来显示它们。该函数接受以毫秒为单位的持续（默认为 400），或两个字符串值“slow”或“fast”；分别对应\
  \ 600 和 500 毫秒。<input id=‘someelement’>` `<input id=‘anotherelement’ hidden>` |\n\
  \n```javascript\n$( ‘#someelement’ ).click(function() {\n  $( ‘#anotherelement’\
  \ ).fadeIn(‘slow’);\n});\n``` |\n| `fadeOut` | 通过将匹配元素渐变为透明来隐藏它们。该函数接受以毫秒为单位的持续（默认为\
  \ 400），或两个字符串值“slow”或“fast”；分别对应 600 和 500 毫秒。<input id=‘someelement’>` `<input\
  \ id=‘anotherelement’ hidden>` |\n\n```javascript\n$( ‘#someelement’ ).click(function()\
  \ {\n  $( ‘#anotherelement’ ).fadeOut (‘slow’);\n});\n``` |\n| `fadeToggle` | 通过动画元素的透明度来显示或隐藏匹配元素。该函数接受以毫秒为单位的持续（默认为\
  \ 400），或两个字符串值“slow”或“fast”；分别对应 600 和 500 毫秒。<input id=‘someelement’>` `<input\
  \ id=\"anotherelement\" hidden>` |\n\n```javascript\n$( ‘#someelement’ ).click(function()\
  \ {\n  $( ‘#anotherelement’ ).fadeToggle (‘slow’);\n});\n``` |\n| `hide` | 隐藏匹配元素。不涉及任何动画，也没有可以传递给该方法的参数。<input\
  \ id=‘someelement’>` `<input id=‘anotherelement’>` |\n\n```javascript\n$( ‘#someelement’\
  \ ).click(function() {\n  $( ‘#anotherelement’ ).hide();\n});\n``` |\n| `show` |\
  \ 显示匹配元素。不涉及任何动画，也没有可以传递给该方法的参数。<input id=‘someelement’>` `<input id=‘anotherelement’\
  \ hidden>` |\n\n```javascript\n$( ‘#someelement’ ).click(function() {\n  $( ‘#anotherelement’\
  \ ).show();\n});\n``` |\n| `slideDown` | 以滑动动作显示匹配元素。该方法动画匹配元素的高度。这会导致页面的下部分向下滑动，为显出的元素留出空间。该函数接受以毫秒为单位的持续（默认为\
  \ 400），或两个字符串值“slow”或“fast”；分别对应 600 和 500 毫秒。<input id=\"someelement\">` `<input\
  \ id=‘anotherelement’ hidden>` |\n\n```javascript\n$( ‘#someelement’ ).click(function()\
  \ {\n  $( ‘#anotherelement’ ).slideDown(1000);\n});\n``` |\n| `slideToggle` | 以滑动动作显示或隐藏匹配元素。该方法动画匹配元素的高度，如果元素隐藏则就像调用了\
  \ `slideDown`，如果元素可见则就像调用了 `slideUp`。该函数接受以毫秒为单位的持续（默认为 400），或两个字符串值“slow”或“fast”；分别对应\
  \ 600 和 500 毫秒。<input id=‘someelement’>` `<input id=‘anotherelement’ hidden>` |\n\
  \n```javascript\n$( ‘#someelement’ ).click(function() {\n  $( ‘#anotherelement’\
  \ ).slideToggle(1000);\n});\n``` |\n| `slideUp` | 以滑动动作隐藏匹配元素。该方法动画匹配元素的高度。当元素被隐藏时，页面的下部分向上滑动。该函数接受以毫秒为单位的持续（默认为\
  \ 400），或两个字符串值“slow”或“fast”；分别对应 600 和 500 毫秒。<input id=‘someelement’>` `<input\
  \ id=‘anotherelement’>` |\n\n```javascript\n$( ‘#someelement’ ).click(function()\
  \ {\n  $( ‘#anotherelement’ ).slideUp(1000);\n});\n``` |\n| `toggle` | 通过动画元素的透明度来显示或隐藏匹配元素。该方法可以被认为如果元素隐藏则运行\
  \ `show` 方法，如果元素可见则运行 `hide` 方法。<input id=‘someelement’>` `<input id=‘anotherelement’\
  \ hidden>` |\n\n```javascript\n$( ‘#someelement’ ).click(function() {\n  $( ‘#anotherelement’\
  \ ).toggle();\n});\n``` |\n\n### 动画和其他\n\n动画允许你移动屏幕区域以吸引用户的注意力。例如使用动画滑出旧内容并滑入新内容，告知用户发生了变化。表\
  \ 14.5 描述了 jQuery 中提供的各种动画和其他效果方法。\n\n### 处理事件\n\nJavaScript 中有很多不同的事件可以交互。当你意识到需要某个事件时（无论是按钮点击还是计时器过期），你需要一个事件处理器，以及在该事件采取的操作。当你完成事件处理程序的创建并将该事件与操作关联后，你就创建了监控并响应特定事件的方法。\n\
  \n如表 14.6 所示，有很多根据需要交互的不同事件。你可能不需要与每个事件交互，但如果需要，你就有这种能力。处理的事件数量没有限制；对事件附加的处理器数量也没有限制。\n\
  \n|| 事件 | 描述 |\n| :--- | :--- |\n| `change` | 为 `change` JavaScript 事件绑定事件处理器，或向元素触发该事件。<input\
  \ id=‘someelement’ type=‘text’>` `<input id=‘anotherelement’>` |\n\n```javascript\n\
  $( ‘#someelement’ ).change(function() {\n  $( ‘#anotherelement’ ).toggle();\n});\n\
  ``` |\n| `click` | 为 `click` JavaScript 事件绑定事件处理器，或向元素触发该事件。<input id=‘someelement’>`\
  \ `<input id=‘anotherelement’>` |\n\n```javascript\n$( ‘#someelement’ ).click(function()\
  \ {\n  $( ‘#anotherelement’ ).toggle();\n});\n``` |\n| `dblclick` | 为 `dblclick`\
  \ JavaScript 事件绑定事件处理器，或向元素触发该事件。该事件仅在发生以下精确系列事件后才会触发：鼠标指针在元素内部按下按钮；鼠标指针在元素内部释放按钮；在系统相关的时间窗口内，鼠标指针在元素内部再次按下按钮；鼠标指针在元素内部释放按钮。<input\
  \ id=‘someelement’>` `<input id=‘anotherelement’>` |\n\n\n\n\n```javascript\n$('#someelement').dblclick(function()\
  \ {\n  $('#anotherelement').toggle();\n});\n```\n\n| 方法 | 说明与示例 |\n| :--- | :---\
  \ |\n| `focus` | 将事件处理程序绑定到 `focus` JavaScript 事件上，或者在元素上触发该事件。获得焦点的元素通常会被浏览器以某种方式突出显示——例如在元素周围显示一个虚线。焦点用于确定哪个元素是第一个接收键盘相关事件的元素。`<input\
  \ id='someelement'>` `<input id='anotherelement'>` \\n```javascript\n$('#someelement').focus(function()\
  \ {\n  $('#anotherelement').toggle();\n});\n``` |\n| `hover` | 为匹配的元素绑定两个处理器，当鼠标指针进入和离开元素时执行它们。`hover`\
  \ 方法为 `mouseenter` 和 `mouseleave` 事件绑定了处理器。你可以使用它在鼠标停留在元素内期间对该元素应用行为。`<input id='someelement'>`\
  \ `<input id='anotherelement'>` \\n```javascript\n$('#someelement').hover(function()\
  \ {\n  $('#anotherelement').show();\n}, function() {\n  $('#anotherelement').hide();\n\
  });\n``` |\n| `keypress` | 将事件处理程序绑定到 `keypress` JavaScript 事件上，或者在元素上触发该事件。当浏览器记录到非修饰键或非打印键（如\
  \ Shift、Esc 和 Delete）的键盘输入时，会将 `keypress` 事件发送给元素。<input id='someelement'>` `<input\
  \ id='anotherelement'>` \\n```javascript\n$('#someelement').keypress(function()\
  \ {\n  $('#anotherelement').toggle();\n});\n``` |\n| `mousedown` | 将事件处理程序绑定到 `mousedown`\
  \ JavaScript 事件上，或者在元素上触发该事件。当鼠标指针位于元素上并按下鼠标时，会将此事件发送给元素。<input id='someelement'>`\
  \ `<input id='anotherelement'>` \\n```javascript\n$('#someelement').mousedown(function()\
  \ {\n  $('#anotherelement').toggle();\n});\n``` |\n| `mouseenter` | 绑定一个在鼠标进入元素时触发的事件处理器，或者在元素上触发该处理器。此\
  \ JavaScript 事件是 Internet Explorer 特有的；但由于该事件的通用性，jQuery 模拟了它，以便无论什么浏览器都可以使用。<input\
  \ id='someelement'>` `<input id='anotherelement'>` \\n```javascript\n$('#someelement').mouseenter(function()\
  \ {\n  $('#anotherelement').toggle();\n});\n``` |\n| `mouseleave` | 绑定一个在鼠标离开元素时触发的事件处理器，或者在元素上触发该处理器。此\
  \ JavaScript 事件是 Internet Explorer 特有的，但由于该事件的通用性，jQuery 模拟了它，以便无论什么浏览器都可以使用。<input\
  \ id='someelement'>` `<input id='anotherelement'>` \\n```javascript\n$('#someelement').mouseenter(function()\
  \ {\n  $('#anotherelement').toggle();\n});\n``` |\n| `mousemove` | 将事件处理程序绑定到 `mousemove`\
  \ JavaScript 事件上，或者在元素上触发该事件。当鼠标指针在元素内部移动时，会将此事件发送给元素。<input id='someelement'>`\
  \ `<input id='anotherelement'>` \\n```javascript\n$('#someelement').mousemove(function()\
  \ {\n  var msg = 'Handler for .mousemove() called at ';\n  msg += event.pageX +\
  \ ', ' + event.pageY;\n  $('#anotherelement').append('<div>' + msg + '</div>');\n\
  });\n``` |\n| `mouseout` | 将事件处理程序绑定到 `mouseout` JavaScript 事件上，或者在元素上触发该事件。当鼠标指针离开元素时，会将此事件发送给元素。<input\
  \ id='someelement'>` `<input id='anotherelement'>` \\n```javascript\n$('#someelement').mouseout(function()\
  \ {\n  $('#anotherelement').toggle();\n});\n``` |\n| `mouseover` | 将事件处理程序绑定到 `mouseover`\
  \ JavaScript 事件上，或者在元素上触发该事件。当鼠标指针进入元素时，会将此事件发送给元素。<input id='someelement'>` `<input\
  \ id='anotherelement'>` \\n```javascript\n$('#someelement').mouseover(function()\
  \ {\n  $('#anotherelement').toggle();\n});\n``` |\n| `mouseup` | 将事件处理程序绑定到 `mouseup`\
  \ JavaScript 事件上，或者在元素上触发该事件。当鼠标指针位于元素上并释放鼠标按钮时，会将此事件发送给元素。<input id='someelement'>`\
  \ `<input id='anotherelement'>` \\n```javascript\n$('#someelement').mouseup(function()\
  \ {\n  $('#anotherelement').toggle();\n});\n``` |\n| `ready` | 此事件在 DOM 完全加载后执行。它在\
  \ DOM 加载后触发，但它不会等待所有脚本和图像下载，因此在使用大型脚本和 `ready` 之间可能会发生冲突。`$(document).ready(handler\
  \ )` `$(function() { })` |\n| `submit` | 将事件处理程序绑定到 `submit` JavaScript 事件上，或者在元素上触发该事件。当用户尝试提交表单时，此事件发送给元素，可以通过调用\
  \ `preventDefault` 方法进行处理。`<form id='thisForm' action='somePage.aspx'>` `<input\
  \ id='someelement'>` `<input id='anotherelement'>` \\n```html\n</form>\n``` \\n```javascript\n\
  $('#thisForm').submit(function(event) {\n  $('#anotherelement').toggle();\n  event.preventDefault();\n\
  });\n``` |\n\n##  JavaScript 事件\n\n你不仅可以使用 JavaScript 和 jQuery 将事件处理程序分配给事件以便在需要时调用它，还可以使用\
  \ jQuery 在元素上调用事件，从而允许你以编程的方式执行操作，而不是编写一组代码用于交互，而另一组代码用于支持系统。\n\n`ready` 方法非常重要，因为它是如何将代码和用户界面连接起来的。这种方法的预期是，代码和显示之间的任何关联都只在代码中发生，这意味着每当你关心\
  \ DOM 的状态变化时，你都需要在代码中映射关系。\n\n在这个练习中，你将整合各种选择器、事件和显示更改，为你的示例应用程序添加交互性。\n\n使用 jQuery\
  \ 管理复杂的样式是一个重要的考虑。在 jQuery 中这样做的主要原因之一是它允许你调试 jQuery 处理过程，而你无法在 CSS 中这样做。\n\n##\
  \ 调试 jQuery\n\njQuery 的调试与你目前为止所过的任何调试都有些不同。它的不同之处在于纯粹的客户端调试，而你之前所过的所有调试都是服务器端的。即使你是在视图中进行调试，你仍然是在调试在服务器上执行的处理。当你调试\
  \ jQuery 时，你是在客户端、在浏览器中进行调试。\n\n\n\n\n客户端调试有两种不同的方法：一种是使用 Visual Studio 中的调试工具，另一种种是使用浏览器自带的调试工具。在接下来的“尝试一下”中，你将练习这两种用于\
  \ `JavaScript` 和 `jQuery` 代码的调试技术。\n\n在处理任何编程语言时，调试都是至关重要的，尤其是当你刚开始学习它时。这在处理 `jQuery`\
  \ 和 `JavaScript` 时尤为如此，仅仅因为它们与大多数其他语言都不同。这种差异可能会导致你犯一些简单的错误，例如选择器不正确（在应该使用点号时却使用了井号），或者没有正确设置函数导致它们永远不会运行。调试将帮助你收集有关可能可能出的错误的信息。\n\
  \n## 关于 jQuery 的实用技巧\n\n对于习惯于 `C#` 或 `VB.NET` 环境的开发者来说，在 `jQuery` 中可能是一次有趣的体验。方法上的差异可能会令他们惊讶，特别是缺乏类型安全的变量，以及处理选择器结果而不是处理已知的具名变量。以下是一些可以帮助你在自己的应用程序中使用\
  \ `jQuery` 时的简短贴士：\n\n* 练习你的 `jQuery`，特别是你将来将用到的内容。获取正确的选择器，特别是在更复杂的场景下，可能需要一些时间才能准确——特别是因为许多差异仅在于一个字符。\n\
  * 不要害怕在调试客户端代码时使用多种方法来帮助自己。在本地运行时，你通常可以使用调试器，但在其他时候你可能必须使用其他方法。\n* 将 [jQuery.org](http://jQuery.org)\
  \ 网站作为理解如何使用 `jQuery` 的资源。它包含了关于各种函数的完整文档，以及多个源代码示例。\n* 寻找其他的 `jQuery` 学习工具。它在互联网上已经非常流行，许多不同的网站提供了关于在\
  \ Web 应用程序中实现 `jQuery` 的有趣实用信息。\n\n## 总结\n\n`jQuery` 已悄无声地成为最常用的客户端框架。它是一个开源框架，对\
  \ `JavaScript` 或 `ECMAScript` 提供了抽象，而后者存在于所有的客户端 Web 浏览器（无论是桌面还是移动设备）。由于 `jQuery`\
  \ 是 `JavaScript` 的抽象，它像 `JavaScript` 文件一样被“链接”到网页，因此你不需要进行任何复杂的操作即可使其在你的应用程序中运行，只需要一个简单的标签。\n\
  \n在 `jQuery` 中进行链接非常简单，你为支持应用程序而编写的任何自定义脚本的链接也是如此。然而，浏览器对单个服务器支持的连接数有一个限制，因此添加多个图像和脚本文件实际上会降低页面加载速度，因为打开和关闭连接是一项开销较大的操作。`ASP.NET`\
  \ 提供了一种帮助你的功能：捆包（Bundles）。\n\n`Bundles` 是一种内置功能，用于将不同的 `JavaScript` 文件合并成单个文件。这允许你创建多个脚本来支持你正在做的任何工作——即使这意味着为每个需要执行的复杂函数创建一个不同的脚本。通过使用打包（bundling），你可以创建这些文件的列表。然后，在启动时，将使用一个包含列表中所有文件内容的单个文件。\n\
  \n这些文件包含了执行所有工作的代码，即 `jQuery` 代码本身。使用 `jQuery` 有两种主要方法。第一种是使用 `jQuery` 工具函数。这些函数允许你跳离\
  \ `DOM`，并采用在 `DOM` 本身上执行工作的方法。这些工具还提供了其他特殊支持，例如枚举。\n\n虽然工具方法允许你从外部对 `DOM` 进行操作，但另一种方法允许你从\
  \ `DOM` 内部（即从 HTML 元素内部）进行操作。这两种方法之间的区别很微妙；使用工具方法时，你进入 HTML 并更改值，而选择器方法允许你选择 HTML\
  \ 中的一个元素，将其分配为变量，然后更改其值之一。它强制执行了对项目的选择以及在所选项目上执行工作的操作。\n\n一旦该项目被选中，你可以对该项目进行许多不同的操作。你可以更改值、样式、样式的一部分——几乎任何与元素内数据和元素外观相关的内容。你可以添加新元素，移动或删除现有元素。所有这些都可以通过\
  \ `jQuery` 实现。\n\n### 练习题\n\n1. **1.** 创建必要的 `jQuery` 和 HTML 更改，以便当鼠标移动到此特定 `<p>`\
  \ 元素的内容上时，仅更改此特定 `<h1>` 元素的颜色：\n    1. `<h1>Title</h1>`\n    2. `<p>Content</p>`\
  \ \n2. **2.** 当你开始考虑为你的 Web 应用程序添加捆包（bundling）时，你需要考虑哪些因素？\n3. **3.** 在 `ASP.NET\
  \ MVC` 视图中使用 `Ajax.Helpers` 时，如何添加特殊的 `jQuery` 代码？\n\n## 你在这一章中学到的知识\n\n| $ | `$`\
  \ 并不是对象本身的直接引用，而是一个工厂方法，当它与选择器配合使用时，返回一个或多个符合选择器所述标准的 HTML 元素。 |\n| $. | `$` 方法代表\
  \ `jQuery` 工具方法。它通过提供枚举逻辑以及类型检查等其他工具项提供了 `jQuery` 支持。 |\n| Bundles | 捆包（Bundling）是\
  \ `ASP.NET` 中的一项功能，可以轻松地将多个文件合并或打包到一个文件中。你可以创建 `CSS`、`JavaScript`和其他包。文件越少意味着 HTTP\
  \ 请求越少，这可以提高首次页面加载性能。在创建包时，良好的规范是在包名中包含“bundle”作为前缀。这可以防止可能的路由冲突。 |\n| ECMAScript\
  \ | 脚本语言规范。最为人知的实现是 `JavaScript`，它用于浏览器内部发生的脚本编写。 |\n| jQuery debugging | Visual\
  \ Studio 允许你对 `JavaScript` 进行调试，体验与调试服务器端代码非常相似。你可以设置断点、单步执行代码处理，并根据需要检查变量和其他项的值。你也有在\
  \ Web 浏览器中进行调试的能力，独立于 Visual Studio。这使得即使在你没有脚本的本地副本时（例如链接到托管在其他网站上的脚本时），也能进行调试。\
  \ |\n| jQuery NuGet Package | 此包将所有必要的且最新版本的 `jQuery` 脚本复制到你的脚本目录。如果你使用捆包将脚本添加到应用程序中，你可以确保你的代码正在使用最新安装的\
  \ `jQuery` 版本，而无需在复制新版本脚本之外进行任何更改。 |\n| Open Source | 一种开发模型，促进最终产品（通常是软件）的通用访问和重新发布。开源软件的关键方面是源代码文件是供消费和修改的。\
  \ |\n| Unobtrusive | 非侵入式是一种在网页中使用 `JavaScript` 的通用方法。其关键特性是支持功能与用户界面的分离。`jQuery`\
  \ 支持非侵入式方法，因为它允许你将所有的事件链接或更改与实际 HTML 分离开。这反过来让你能够保持 HTML 元素完全没有功能，除了提供定义性特征（如名称）以便让\
  \ `jQuery` 脚本找到该元素之外。 |\n\n\n\n\n\n* 在 ASP.NET 应用程序中实现安全\n* 安全与数据库\n* 如何保护你的 Web\
  \ 应用程序\n* 在安全性中添加角色\n* 使用用户信息\n\n## 本章代码下载：\n\n本章涉及的 wrox.com 代码下载位于“Download Code”（下载代码）选项卡中，地址为\
  \ `www.wrox.com/go/beginningaspnetforvisualstudio`。代码位于第 15 章下载中，并根据整个章节中的名称进行了单独命名。\n\
  \n似乎似乎每周都能看到关于在线应用程序数据泄露的新闻文章。虽然你的应用程序并不像那些存储信用卡号或银行信息的大型在线公司那样具有同样安全需求，但你仍然需要实施某种的安全措施来保护用户的隐私信息。此外，由于你将用户视为独立的个体，而不仅仅是访问者，你需要一种方法让他们唯一地识别自己的身份。这就是\
  \ ASP.NET 安全性的职责。\n\n有时，你不仅关心用户是谁，还关心该用户在你的应用程序中可以做什么。你可以在示例应用程序中看到这一点——你创建了一个地方，让特殊类型的用户可以添加项目并管理其他信息。在知道用户是谁之后，确定某些用户可以做什么，是另一个由\
  \ ASP.NET 安全性管理的领域。\n\n到目前为止，你已经分离了一些功能，以便你可以方便地控制谁可以做什么，在某些情况下甚至添加了一些关于用户的未使用的信息。在本章中，你将结合这些考虑并在你的示例应用程序中实现安全性，这是向使其成为一个可用系统迈出的最后步骤之一。\n\
  \n## 介绍安全性\n\n安全性是确保只有特定人员才能执行某些操作的概念。例如，考虑银行的保安，他根据执行操作的人员允许银行内部发生许多不同的事情。如果保安看到银行经理进入金库，他可能不会多看一眼。相反，如果有人戴着小丑面具进入金库，保安很可能会采取某种行动。\n\
  \n你的应用程序通常会采取相同的方法。它识别用户是谁，然后评估该用户想要做什么。在之前的示例中，保安可以识别出银行经理，并理解他被允许进入金库。如果，如果保安识别进入金库的人是银行外咖啡车的主，那么这可能会引起更强烈的反应，即使保安认出了那个人。这是因为虽然这个人可能被认出来，但他试图执行的行为可能是不符合预期或不被允许的。\n\
  \n由于你的应用程序采取了与银行保安相同的步骤，因此会对用户进行几项评估。第一项评估是确定“你是谁？”第二项评估是让该用户“证明你是谁”。第三项评估是根据用户的身份确定其在应用程序中可以做什么。\n\
  \n### 身份：你是谁？\n\n银行示例中安全性的整个概念是确保只有适当的人才能执行某项操作。如果你将该目标应用于你的应用程序，那么你必须做的第一件事就是将与你的应用程序交互的人识别为一个已标识的用户。这建立了你的应用程序与人之间的联系。你几乎肯定已经在其他网站上做过这件事，通常是进入该网站的某个页面并“注册”。这提供了访问者（即你）与网站之间的初始介绍。\n\
  \n你的应用程序需要做同样的事情。如果你想了解用户是谁，你就必须提供一种方法让他们进行自我介绍，一种让他们在你的网站注册的方法。这种注册决定了他们与你网站的关系。\n\
  \n### 身份验证：用户如何证明他们的身份？\n\n在访问者被介绍给你的网站之后，你就了解他们是谁以及他们是什么。然而，在某个时刻，用户会离开你的网站，希望以后再次回来。如果你在他们下次访问时仍然关心这些用户是谁，并结合他们之前的介绍，你需要一种方法让他们证明他们是之前注册的同一个人。如果由于他们在银行，这很容易做到：你只需要向他们索要照片的身份证，并将姓名和照片与持证件的人以及你的记录进行比对。如果所有信息看起来都是正确的，你就让他们继续进行交易。\n\
  \n由于让访问者证明他们确实是某个用户很重要，因此你必须为他们提供一种通过你的 Web 应用程序证明这种关系的方法。通常，这是通过在介绍（或网站注册）期间配置用户名和密码来实现。信息的组合越复杂，提供相同信息的人是该已标识用户的概率就越大。验证访问者确实如他们所说的那样被称为身份验证（Authentication）——用户验证其或她的身份。\n\
  \n### 授权：你被允许做什么？\n\n在某些情况下，不同用户可以执行的操作并不区别。如果是这样，你只需要简单的识别即可。然而，你的示例应用程序必须对用户可以做什么做出某些判断。这种判断被称为授权（Authorization）。这就是为什么银行保安会对咖啡车主进入银行金库产生怀疑。尽管保安已经识别（或验证）了咖啡车主，但那个人并没有被授权进入银行金库。\n\
  \n你的应用程序需要做出同样的判断。这个经过身份验证的用户是否被允许执行一组特定的操作（主要是你到为止一直放在示例应用程序中 `Admin` 文件夹中的操作）？如果他们被授权执行这些操作，系统就会让他们继续。如果他们被允许执行这些操作，系统就会阻止他们。\n\
  \n确定授权常用的方法是为用户分配特定角色，然后确定该角色是否被允许执行某操作。根据需要，不同角色具有不同级别的授权。用户可以没有角色或拥有多个角色，取决于如何确保应用程序正确安全。你将在本章稍后部分介绍角色。\n\
  \n### 使用 ASP.NET 登录\n\n最新版本的 ASP.NET Web Forms 和 MVC 在身份和安全管理方式方面做了一些重大更改。Web Forms\
  \ 和 MVC 过去采用不同的方法，但现在已已更改，现在两种方法都使用相同的底层系统。这很重要，这意味着用户可以登录 Web Forms 登录页面，同时对 MVC\
  \ 路由和视图使用该相同的身份验证。这在以前是不可能的。\n\n在使用 ASP.NET 骨架创建的项目时，初始配置和管理都在 `App_Start` 目录下的\
  \ `Startup.Auth.cs` 文件中完成。该页面如图 15.1 所示。\n\n![带有代码行的 Startup_Auth 页面截图](img/c15f001.jpg)\n\
  \n**图 15.1** Startup_Auth 页面\n\n此方法的前三行显示了 ASP.NET 登录管理过程的一些特性：\n\n```\napp.CreatePerOwinContext(ApplicationDbContext.Create);\n\
  app.CreatePerOwinContext<ApplicationUserManager>(\n    ApplicationUserManager.Create);\n\
  app.CreatePerOwinContext<ApplicationSignInManager>(\n    ApplicationSignInManager.Create);\n\
  ```\n\n\n\n\n\n在这里，正在创建并将三个项添加到到 `Owin` 上下文中。可以将 `Owin` 上下文想象为管理运行应用程序的内存空间，因此将项加载到\
  \ `Owin` 上下文中意味着你正在准备好该项以便进行访问——在本例中，是为了支持身份验证过程。\n\n上下文中添加了三个不同的项：`ApplicationDbContext`、`ApplicationUserManager`\
  \ 和 `ApplicationSigninManager`。这些类中的每一个都负责身份验证过程的一部分。`ApplicationDbContext` 是与数据库的连接。这特别有趣，因为它展示了如何使用\
  \ `Entity Framework` 的代码优先（Code First）方法在数据库中存储身份验证所需的信息，就像你数据库应用程序的其他部分一样。\n\n\
  第二个被调用 `Create` 方法并添加到 `Owin` 上下的类是 `ApplicationUserManager`。该类处理用户的创建和管理。它包含许多不同的有用方法，包括但不限于\
  \ `Create`、`Find`、`ChangePassword`、`Update` 和 `VerifyPassword`——这些方法在处理用户时都是必要的。`ApplicationUserManager`\
  \ 使用 `ApplicationDbContext` 访问数据库以处理用户信息。\n\n最后添加到 `Owin` 上下文的项是 `ApplicationSigninManager`。正如你可能从名称中推断的那样，此对象处理签名或登录过程。它没有许多不同的方法和属性；它的主要功能是评估传入的信息。你将使用的方法签名在此处：\n\
  \n```\npublic SignInStatus PasswordSignIn(string userName, string password,\n  \
  \  bool isPersistent, bool shouldLockout);\n```\n\n如你所示，有四个不同的值传递给评估方法。前两个是用户输入的用户名和密码。第三个值\
  \ `isPersistent` 告诉框架发送给用户的响应是否会设置一个记录所输入用户名的 cookie。上一个值 `shouldLockout` 告诉框架，如果系统中存在匹配的用户名但密码错误，它是否应该锁定该账户。\n\
  \n此方法返回的项是一个 `SignInStatus` 枚举。表 15.1 描述了不同的枚举值。\n\n| Value | 描述 |\n| :--- | :---\
  \ |\n| Success | 传入的用户名和密码与存储的用户信息相匹配。用户已通过身份验证。 |\n| LockedOut | 与传入的用户名匹配的账户已被锁定。该账户可能之前已被锁定，也可能因为此调用的结果导致锁定，即\
  \ `shouldLockout` 值为 true。如果账户被锁定，则用户在规定时间内无法登录。 |\n| RequiresVerification | 与传入的用户名匹配的账户需要验证。这是基于在\
  \ `ApplicationUserManager` 上设置的配置值。用户已被识别但未通过身份验证。在用户通过验证之前，他们将无法登录应用程序。 |\n| Failure\
  \ | 当系统无法登录用户时会返回此值。这可能是因为用户名与账户不匹配，或者密码与匹配传入用户名的账户的预期值不符。框架不区分这二者，因为告知潜在的黑客输入的用户名是正确的并不是良好的做法，这为试图侵入系统的人提供了便利。\
  \ |\n\n**表 15.1** SignInStatus 值\n\n你可能在想，当你只从登录中获得一个枚举值返回时，一切是如何管理的。这一切都由 Identity\
  \ 框架对你隐藏了，但框架处理了所有事情。它通过设置身份验证 cookie 来实现。该 cookie 的设置也在 `Startup_Auth` 文件中完成。处理此配置的区域所示：\n\
  \n```c\n // 允许应用程序使用 cookie\n    // 来存储已登录用户的信息\n    // 并使用 cookie 临时存储\n    //\
  \ 使用第三方登录提供程序登录的用户信息\n    // 配置签名 cookie\n    app.UseCookieAuthentication(new CookieAuthenticationOptions\n\
  \    {\n        AuthenticationType = DefaultAuthenticationTypes.ApplicationCookie,\n\
  \        LoginPath = new PathString(\"/Account/Login\"),\n        Provider = new\
  \ CookieAuthenticationProvider\n        {\n            OnValidateIdentity = SecurityStampValidator\n\
  \                .OnValidateIdentity<ApplicationUserManager, ApplicationUser>\n\
  \                ( validateInterval: TimeSpan.FromMinutes(30),\n               \
  \   regenerateIdentity: (manager, user) =>\n                      user.GenerateUserIdentityAsync(manager))\n\
  \        }\n    });\n```\n\n系统使用 cookie 允许浏览器在服务器和客户端之间来回基于令牌的信息，这样用户就不需要在每次调用时重新输入登录凭据。当框架处理成功的登录尝试时，下一步是向\
  \ `Response` 对象添加 cookie。此此 cookie 在随后的每次调用中都是可用的。\n\nASP.NET Identity 框架还支持第三方托管登录。开箱即用的体验支持来自\
  \ Google、Twitter、Microsoft 和 Facebook 的登录。在这些情况下，你可以在应用程序和身份验证提供者之间建立关系。然后用户使用他们熟悉且信任的凭据登录提供者，提供者会发送一个\
  \ Identity 框架知道自己可以信任的令牌给用户。Identity 框架理解由于你在应用程序和提供者之间建立的关系，该令牌是有效的。一旦你在提供者的网站上设置了这种关系，他们就会提供你在此侧开发这种信任关系所需的信息（例如\
  \ client id 和 client secret）。下面的示例显示了如何设置其中之一：\n\n```csharp\napp.UseMicrosoftAuthentication(\n\
  \    clientId: \"\",\n    clientSecret: \"\");\n```\n\n\n\n\n\n在本次“尝试一下”中，你将设置示例应用程序，使用户能够在网站上进行注册和登录。\n\
  \n在为应用程序配置好使用 `Identity` 框架之后，下一步是开始利用“了解用户是谁”这一优势。\n\n## 在应用程序中处理用户\n\n了解用户是谁是非常棒的，但前提是你已经写好了代码来利用这些用户信息。你目前可以访问的主要信息如下：\n\
  \n*   用户名 (Username)\n*   电子邮件地址\n*   电话号码\n*   唯一标识符或 `Id`\n\n正如前面提到的，一旦用户登录你的应用程序，就会创建一个身份验证\
  \ Cookie（authentication cookie），并在后续用于识别和验证用户。在框架验证令牌令牌后，它能够为该用户创建一个真实的身份。一旦框架获取了这些信息，就可以将其存储起来，以便通过应用程序进行访问。\n\
  \n获取用户信息有两种方法，你所采用的方法取决于发起调用的对象；从视图（View）或控制器（Controller）调用需要一种方法，而在另一个类中（即使是 Web\
  \ Form 的代码后代码 code-behind）获取用户信息，则需要另一种方法。\n\n从控制器内部访问用户信息非常简单，因为所有控制器都继承自的基控制器类有一个\
  \ `User` 属性。该属性的类型为 `System.Security.IPrincipal`，这是 Windows 中安全性的默认类型。如果你在开发桌面应用程序，在查找登录用户时，它也将是一个\
  \ `IPrincipal`。\n\n请注意，这对于尝试获取你可以使用的 `ApplicationUser` 来说对你没有帮助，因为 `User` 属性无法转换为你可以使用的类型。相反，你必须使用\
  \ `Principal` 的 `Identity` 属性上的一个方法来获取用户的 `Id`，然后使用它来获取 `ApplicationUser`，如下所示：\n\
  \n```\nstring userId = User.Identity.GetUserId();\nApplicationUserManager aum =\
  \ HttpContext.GetOwinContext()\n        .GetUserManager<ApplicationUserManager>();\n\
  ApplicationUser appUser = aum.FindById(userId);\n```\n\n一旦你从 `ApplicationUserManager`\
  \ 获取了 `ApplicationUser`，就可以按照需要访问其属性了。在下一个“尝试一下”中，你将开始在应用程序中使用 `ApplicationUser`\
  \ 信息。\n\n此时，你已经为应用程序添加了身份验证功能，即确认某人确实是其所言的人。你还通过使用 `Authorize` 特性添加了一点授权功能，以确保只有在用户登录时才能调用特定方法，因为该单一操作是启动到目前为止定义的所有身份验证的起点。\n\
  \n然而，你还没有识别用户是否通过身份验证之外的任何信息的能力。这就是为什么管理页面还没有发生任何更改。管理对这些页面的访问不仅需要简单的身份验证检查，还需要一种方法来确定用户是否有权查看这些特定页面。这就是“角色”（Roles）大显用场的地方。\n\
  \n## \n\n确定授权的传统方法是通过使用角色。角色提供了一种定义一组职责的方式，就像列出了该角色内人员可以执行的任务列表一样。从安全的角度来看，角色可以用于锁定某些操作，例如“只有具有此特定角色的用户”才能执行该操作。通常，角色根据用户可以执行的工作类型进行界定，然后根据需要为用户分配一个或多个角色，以定义他们的实际职责。在我们之前关于银行的示例中，安保人员之所以能够识别出某人，是因为他们所扮演的角色——即经理的角色。\n\
  \n在 ASP.NET Identity 框架中，`ApplicationUser` 上有一个角色集合。角色是 Identity 框架上下文中的一个独立项目，这意味着它们拥有自己的数据库表\
  \ `AspNetRoles`，以及另一个将用户连接到一个或多个角色的表 `AspNetUserRoles`。这种连接表是必要的，因为一个角色可能被分配给多个人，一个人也可能拥有多个角色。\n\
  \n使用角色提供了更细粒度的授权级别，因为你在对职责进行分组时可以根据需要尽可能具体。在示例应用程序中，你只需要一个角色，用于确保进入 Admin 区域的用户既已登录，又有权执行该操作，但很容易想象出在某些情况下，职责分组可能会导致许多不同的、更细粒的角色。\n\
  \n创建一个带有身份验证的项目不会创建任何角色管理界面。任何角色的创建和配置都必须通过编码或直接输入数据库来完成。然而，创建角色实际上不需要做任何特殊操作；默认角色只有两个属性：`Id`\
  \ 和 `Name`。\n\n## 配置你的应用程序与角色工作\n\n创建和链接角色是简单的任务，因此一旦在数据库中链接，将角色获取到 `User` 对象就可以容易且自动地完成。然而，让应用程序理解角色稍有不同，并且在\
  \ ASP.NET Web Forms 和 ASP.NET MVC 应用程序之间存在差异。你已经看到 MVC 如何使用特性来确保用户通过了身份验证，这是很合理的，因为\
  \ MVC 中发生的一切都是针对代码的。Web Forms 的不同之处在于，那里一切都是基于文件的。因此，使用特性的方法实现起来更容易。\n\n相反，在处理 ASP.NET\
  \ Web Forms 应用程序时，你可以在配置文件中管理授权。除了你访问一个来管理连接字符串之外，关于配置文件的讨论并不多；然而，配置文件可以管理比数据库连接信息多得的内容。你可以在应用程序中拥有多个配置文件，可以将它们放在嵌套目录中。按照惯例，目录中的代码会首先查找该目录下的配置文件。如果在该目录未找到，代码将向上查找一级（仍在仍在运行应用程序的上下文中），直到找到并引用配置文件为止。\n\
  \n配置文件非常重要，因为它们为 ASP.NET Web Forms 页面的授权处理提供了一种简单的方法。这里显示了这种工作方式的简略版本：\n\n```xml\n\
  <?xml version=\"1.0\"?>\n<configuration>\n    <system.web>\n      <authorization>\n\
  \        <allow roles=\"Role1, Role2\"/>\n        <deny users=\"*\"/>\n      </authorization>\n\
  \    </system.web>\n</configuration>\n```\n\n将此代码放在任何带有 Web Forms 文件的目录中，都可以确保应用程序被锁定，仅允许分配了\
  \ Role1 或 Role2 的用户访问。在用户未登录，或者已登录但没有适当角色并尝试访问此目录中的页面的情况下，框架会将用户重定向到登录页面。如果用户可以登录并拥有适当的角色，则他们将被允许访问该目录中的任何页面。\n\
  \n前面的方法可以限制目录中每个页面的访问，但你也可以通过配置限制特定页面的访问。回创建脚架项目时的示例，在包含所有脚架用户交互的 Account 目录中。用于此更改的\
  \ `web.config` 文件所示：\n\n```xml\n<?xml version=\"1.0\"?>\n<configuration>\n  <location\
  \ path=\"Manage.aspx\">\n    <system.web>\n      <authorization>\n        <deny\
  \ users=\"?\"/>\n      </authorization>\n    </system.web>\n  </location>\n</configuration>\n\
  ```\n\n\n\n\n在这种情况下，配置指定任何已登录的用户都可以访问 `Manage.aspx` 文件，当你查看 `Account` 目录的内容并评估每个页面预期的功能时，这样做是合理的。唯一预期与身份验证用户交互的页面是\
  \ `Manage.aspx`，它维护了登录信息——这些信息仅对经过身份验证的用户有效。\n\n许多简单的授权需求可以通过明智地使用 Web Forms 的 `web.config`\
  \ 授权，以及在 MVC 中使用 `Authorize` 特性来管理。然而，有时你可能需要判断用户是否已获得授权或是否属于某个角色。\n\n### 通过程序方式检查角色\n\
  \n你不能总是在页面级别对处理身份验证和授权的不同考虑因素做出决定。也许你只是只想向已登录的用户显示页面的某个部分；或者如果用户具有特定角色，页面本身对授权的要求可能与某个特定部分不同。因此，处理此部分将需要一种不同的方式来管理该判断。这就是程序化检查角色大用用场。\n\
  \n在代码中检查角色和登录状态的优势在于，MVC 和 Web Forms 中的方法通常相似，如下所示：\n\n#### 在控制器或视图中\n\n```\nUser.IsInRole(\"\
  Admin\")\n```\n\n#### 在其他任何地方\n\n```\nHttpContext.Current.User.IsInRole(\"Admin\"\
  );\n```\n\n这两个方法都返回一个简单的 `Boolean` 值，指示用户是否已分配了输入的角色。如果用户未经过身份验证，或者用户已通过验证但没有该角色，此方法将返回\
  \ false。\n\n在下一个“尝试尝试试”中，你将为示例应用程序添加了身份验证和授权。由于 `Identity` 框架基于 ASP.NET，而不是基于上述两种框架技术之一，因此你能够在评估和处理用户及其凭据时使用相同的方法。\n\
  \n## 实用安全提示\n\n在你的应用程序中处理安全问题时，以下条目是你需要记住的几点。\n\n* 尽管你直到书的末尾才接触安全问题，但实际上你应该从应用程序开发过程初期就开始考虑安全性。你希望在开始时确定需要什么种身份验证和授权需求，因为这可能会影响开发过程的许多不同方面。\n\
  \n* 确定角色可以是添加安全性过程中复杂的步骤之一。一个常见的错误是简单地使用职位作为角色。这意味着某项功能可能需要支持许多角色，而将功能跟踪到角色列表将变得非常棘手。相反，应该采用一种方法，让角色定义一组共同的工作要求。这可能意味着一个用户将拥有多个角色，但更改用户的角色分配比更改代码以向控制器添加新的职位类型类型角色要容易得多。这一点尤为真实，因为你需要构建一个\
  \ UI 来管理用户-角色分配，因此管理更多角色会变得简单得多，同时仍保持很高的灵活性。\n\n* 最安全的方法是采用白名单方法，这意味着默认拒绝用户的所有操作，除非另有指定。权限根据需要进行分配。这比采取相反的方法（即开始允许用户做任何事情，然后根据需要保护功能）要让你的应用程序更安全。\n\
  \n* 安全性的重要性怎么强调都不过。显然，安全泄露的影响取决于你正在做什么；但每当你做出添加身份验证的决定时，任何泄露都会破坏用户对你公司和应用程序的信任。\n\
  \n## 总结\n\n为你的 ASP.NET Web 应用程序添加安全性并没有想象中那么可怕。`Identity` 框架经过了重新设计，对开发者非常友好。你可以从一开始看到这一点，即框架如何使用\
  \ `Entity Framework Code First` 来管理数据库访问。这与你应用程序访问数据库的方式完美契合。这意味着你已经为管理自己的数据库所做的一切工作，都可以扩展到管理安全系统的数据库部分。\n\
  \n与 `Identity` 框架工作最复杂的方面是它如何被实例化到 `Owin` 上文中，以及你可能需要如何从 `Owin` 上文中提取各种对象，以便使用它们与系统进行交互。然而，通过处理\
  \ `Owin` 上文，你可以访问所有不同的安全方面，从根据用户在系统中输入的用户名和密码验证用户身份，到评估用户以确定他们是否具有访问特定页面或执行页面内操作所需的角色。\n\
  \n配置身份验证的使用取决于你正在使用的框架。如果你正在配置 ASP.NET Web Forms 页面，你可以通过配置文件来维护安全预期，在配置文件中定义这些预期——无论是针对目录中的所有文件还是针对单个文件。如果你在\
  \ MVC 中工作，你无法使用 `web.config` 文件进行安全配置，因为 MVC 使用了不同的、不基于文件系统的方法。相反，你在操作和/或控制器上放置授权特性。这些特性定义了授权预期。\n\
  \n由于 `Identity` 框架是一种 ASP.NET 方法，无论你使用哪种框架，在代码中处理该框架几乎是相同的。这意味着无论你是在处理 MVC 还是 Web\
  \ Forms，方法是相同的，获取信息的方式也是相同的。\n\n### 练习\n\n1. 每当应用程序启动时，哪两个文件负责设置密码最小长度等配置项？\n\n\
  2. 身份验证（authentication）和授权（authorization）之间的区别是什么？\n\n## 本章学了什么\n\n| 术语 | 描述 |\n\
  | :--- | :--- |\n| `ApplicationDbContext` | 在项目创建同时创建的类。它作为 `Identity` 框架中所有表格的数据库上下文文件。它与你在应用程序中使用的\
  \ `DbContext` 完全相当。 |\n| `ApplicationSigninManager` | 处理登录管理。 |\n| `ApplicationUser`\
  \ | 在脚手架过程中创建的用户类。它充当对用户的定义。 |\n| `ApplicationUserManager` | 执行许多用户管理任务的类。 |\n|\
  \ Authentication | 验证用户确实是他们所称身份的过程。至少，它要求用户提供用户名和密码，这些必须与创建账户时提供的信息完全一致。 |\n| Authorization\
  \ | 判断用户是否被允许或授权执行某操作的过程。授权可以在任何级别管理。在 ASP.NET 框架中，它通常通过分配给用户的角色来管理。 |\n| authorization\
  \ attribute | MVC 特性，允许定义身份验证和授权要求。该特性可以应用于控制器或操作级别。 |\n| authorization element\
  \ | 在 `web.config` 文件中配置 Web Forms 授权时使用的组件。 |\n\n\n\n\n\n| 语 | 说明 |\n| :--- | :---\
  \ |\n| 哈希 (Hash) | 一种接收值并创建到另一个值的单向转换的过程。哈希的妙之处在于它无法还原原始值，且没有其他值通过哈希后能与第一个值的哈希值匹配。因此，它是匹配密码的理想选择，且系统无需知道密码的具体内容。\
  \ |\n| 身份框架 (Identity framework) | 一个用于管理身份验证和授权的 .NET 系统。它提供了一个定义用户并存储该用户以及任何关联角色的机制。\
  \ |\n| `IdentityResult` | 身份操作（如登录）的结果。它包含一个 `Succeeded` 属性，允许你判断登录是否成功；以及一个 `Errors`\
  \ 属性，它提供了一个描述所遇问题的字符串列表。 |\n| `IsInRole` | Identity 上的一个方法。你可以传入角色名称并获取一个布尔值，表示已登录用户是否分配了该角色。\
  \ |\n| `OwinContext` | 用于存储安全信息的容器。它在应用程序启动时初始化；如果你需要各种 Identity 组件，通常从 `OwinContext`\
  \ 获取它们。 |\n| `PasswordValidator` | 用于在用户注册或更改密码时验证密码的类。它允许你设置最小长度和要求的字符类型。 |\n|\
  \ 角色 (Role) | 用于描述用户与其可以执行的操作类型之间关系的项。应用程序代码设计用于为一组功能验证角色，并为用户分配一个或多个角色，以决定他们在应用程序中可以做什么。\
  \ |\n| 盐值 (Salt) | 添加到哈希中的值。在 Identity 中它用于进一步混淆密码的哈希值。 |\n| `SignInStatus` | 尝试登录后返回的枚举。它描述了结果，例如成功或失败。\
  \ |\n\n# 第 16 章：网站个性化\n\n**你将在本章中学习到：**\n* 向 ASP.NET Identity 中添加个人信息\n* 管理你的安全数据库\n\
  * 网站个性化的不同方法\n* 如何在你的网站中实现个性化\n\n## 本章代码下载\n\n本章的 [wrox.com](http://wrox.com) 代码下载可以在\
  \ [www.wrox.com/go/beginningaspnetforvisualstudio](http://www.wrox.com/go/beginningaspnetforvisualstudio)\
  \ 的“Download Code”选项卡中找到。代码位于第 16 章](#c16.xhtml) 下载中，并根据整个章节中的名称单独命名。\n\n在你的网站中实现安全机制意味着你现在拥有了识别用户的能力。一旦你能做到这一点，就可以开始收集有关他们的信息——从姓名、地址到出生日期，再到喜好颜色——任何可以让他们在你的网站上的体验更加友好、令人难忘且独特的信息。用户感到越受欢迎，他们在使用你的应用程序时就会感到越舒服，他们再次回来的可能性也越大。\n\
  \n一旦你识别了用户，你还可以监控关于他们的其他方面，包括他们访问了哪些页面、访问频率、最可能点击哪些项目以及其他有趣的信息。通过这类数据，你可以开展有针对性的营销活动，或者记住用户并将他们直接带到指定的特定页面——这些益处在你没有识别用户的能力或没有该用户信息时是无法实现的。\n\
  \n这些信息中的任何内容都可以被考虑并用于个性化，而个性化简单来说就是让你的应用程序识别用户，并根据你关于该用户的信息采取特定操作的概念。它可以简单到只显示他们的名字，也可以复杂到专门为他们构建整个一个偏好目录。\n\
  \n## 理解配置文件 (Profile)\n\n以前版本的 ASP.NET 拥有一个完整的配置文件管理器，这是一个附加在登录管理器上的特殊 ASP.NET 组件；虽然它很灵活（因为你可以向它添加任何类型的数据），但它也很复杂，因为它将信息与用户分离开来。然而，尽管存储机制是复杂的，但管理器向你隐藏了大部分内容，并使其使用变得几乎是透明的。\n\
  \n采取这种方法的主要原因是之前的用户管理版本不够灵活。该设计非常僵化，以至于框架始终理解各种身份表中的每一行（这些表非常像示例应用程序中创建的默认表），因为这是在\
  \ `Entity Framework` 完全整合到框架之前。对这些表的任何更改都可能导致系统崩溃。\n\n现在 ASP.NET Identity 通用使用了\
  \ `Entity Framework`，特别是使用了 `Code First`，因此你所使用的个性化方法更易于管理；它直接与用户集成在一起，而不是保持分离并通过单独的管理器进行访问。在下一节中，你将学习为默认用户添加个性化支持信息的必要步骤。\n\
  \n### 创建配置文件\n\n要向默认的 ASP.NET Identity 设置中添加配置信息，需要几个步骤。第一步是确定你想收集哪些额外信息。这些信息可以是简单类型（如用于姓名的字符串），也可以是复杂类型（如地址）。第二，在你确定了想要添加的额外信息后，必须考虑你将如何访问这些信息。最后一步是实现数据更改并更新数据库。\n\
  \n确定额外信息通常是该过程中最简单的部分。如果你需要复杂类型，你可能需要考虑如何构建它们，但确定额外信息及其特定类型并没有什么新奇之处。\n\n你还应该花一些时间考虑你将如何访问这些信息；思考你正在添加哪些额外信息，以及你想要如何结合用户和用户信息。推荐的方法是为安全信息使用不同的数据库上下文（以便具有不同的访问权限）。这样做可以让你能够识别两者之间的交互，反过来决定了如何定义个性化信息。\n\
  \n最后，在确定将额外信息放入安全数据库最合适之后，你把信息添加到模型并更新数据库。所有这些步骤都是下一个“尝试”（Try It Out）的一部分。\n\n###\
  \ 使用配置文件\n\n现在你已经将想要捕捉的任何个性化信息添加到应用程序的模型和数据库中，下一步要做的任务是实际使用这些信息。在下一个“尝试”中，你将在应用程序中进行必要的更改，以捕捉并使用所有这些信息。\n\
  \n\n\n\n添加个性化信息并将其显示，与你捕获和使用的任何其他数据无异。它之所以特殊，是因为这些数据本身并不一定符合任何业务目的；其存在的全部目的是在用户与你的应用程序之间建立一种更良好、更舒适的关系，希望他们能在程序上花费更多时间，甚至将其视为你的应用程序旨在解决的任何问题的首选解决方案。在示例应用程序中，你希望用户在每次需要工具时首先考虑你的借用图书馆——甚至在他们考虑去五金商店购买新工具之前。你在此处采取的步骤将逐步增加这种情况发生的概率，因为用户会觉得你理解他们以及他们的需求；你通过在应用程序中实现个性化，证明了你个人非常了解他们。\n\
  \n## 实用个性化贴士\n\n以下列表包含了一些在实现个性化时需要记住的提示：\n\n- 你无法在登录后立即访问存储在身份验证 cookie 中的用户信息。系统会自动将信息加载到响应\
  \ cookie 中，但默认的用户管理工具期望从请求 cookie 中读取数据，因此在该用户下次访问网站之前，你将无法访问该用户。这就是为什么成功登录会将用户重定向到不同的页面；在该这一点，用户被重定向到的页面可以访问用户信息。\n\
  \n- 当你考虑信息应该存储在 `Identity` 数据库还是你自己的应用程序数据库中时，关键考虑因素是你要保存的信息描述的是你的用户，还是用户与你网站之间的交互。如果信息是专门针对并关于用户的，那么它就是与用户一起的个性化数据。如果信息不是专门关于和描述用户，那么这些信息可能应该存储在应用程序的数据库上下文中。\n\
  \n- 尽量让你的个性化数据尽可能扁平化。换句话说，避免任何创建大量数据库表并存储大量信息的方法——这可能不是你想附加到用户身上的东西。记住，由于目标是个性化，你可能会在用户已登录的每个请求中访问该用户。因此，你希望通过尽可能减少所管理的表数量来确保具有极高的性能。\n\
  \n## 总结\n\n个性化是指系统（如你的 Web 应用程序）能够识别用户并根据其需求提供特定信息。系统可以通过收集有关个人的信息来提供个性化，无论是通过直接提问，还是通过追踪他们在网站上的移动。尽管这听起来可能有些毛骨悚然，但它是预测用户想要和需要的关键部分，以便你的应用程序能够更好地支持他们，并在用户无需采取任何特殊操作的情况下为他们提供信息。个性化被用于所有主要的电子商务网站，它们分析访问者的习惯以决定向他们展示什么，其目标是提高销售额。\n\
  \n在当前的 `ASP.NET` 世界中，实现个性化并不是难事。由于 `Identity` 框架使用 `Entity Framework Code First`\
  \ 来管理安全数据库的创建，这变得简单了。使用 `EF Code First` 允许你自定义存储用户信息的数据表。通过这种程度的自定义，你可以在用户账户上添加任何数量、任何类型的属性——从简单的\
  \ `C#` 类型到复杂的对象。\n\n## 练习题\n\n1. **1.** 你的电子商务网站销售女装。如果你想了解用户偏好的色调，你会收集什么信息？\n\n\
  2. **2.** 你可以对刚刚收集的信息做什么？\n\n## 你在在本章中学到的内容\n\n| 术语 | 描述 |\n| :--- | :--- |\n| Automatic\
  \ Migration (自动迁移) | `Entity Framework Code First` 在单步中执行数据库迁移的能力，而不是要求你先创建迁移然后更新数据库。如果你发现自己很少（或从不）自定义迁移文件，那么使用自动迁移可能是值得的。每当你需要通过更改数据库类型或添加索引或其他数据库特有项（你无法在模型中使用属性定义的这些项）来自定义迁移脚本时，你就需要使用手动迁移。自动迁移由\
  \ Migration 目录中 `Configuration` 类中的一个值管理。 |\n| `-configuration` | 在添加迁移或更新数据库时使用一个新关键字。当应用程序包含多个数据库上下文时，它是必要的。\
  \ |\n| `Configuration.cs` | 当你为应用程序的多个数据库上下文中启用迁移时创建的类。它包含了定义 Migration Directory（迁移\
  \ 目录）的所有配置信息，例如是否使用自动迁移等。它还包含 `Seed` 方法，通过该方法，你可以定义每次对数据库上下文进行部署时都会创建的数据。 |\n| Migration\
  \ Directory (迁移目录) | 包含 `Configuration.cs` 类和针对数据库上下文的所有迁移脚本的目录。它是在你在包管理器控制台中运行\
  \ `enable-migration` 命令时创建的，并且要求你在命令中将目录名称作为参数传递进去。 |\n| Personalization (个性化) |\
  \ 识别用户并根据这种识别向他们提供特殊信息的概念。它可以简单到在网站中使用他们的名字，也可以复杂到追踪他们的偏好，并在向他们显示内容时始终使用这些偏好。 |\n\
  \n# 第 17 章\n\n### 异常处理、调试与跟踪\n\n**你将在本章中学到：**\n\n- 不同类型的异常\n- 如何处理异常\n- 调试你的应用程序\n\
  - 如何使用页面检查器 (Page Inspector)\n- 在 `ASP.NET` 中使用标准跟踪\n- 日志\n\n## 本章代码下载：\n\n本章的 wrox.com\
  \ 代码下载可以在 [`www.wiley.com/go/beginningaspnetforvisualstudio`](http://www.wiley.com/go/beginningaspnetforvisualstudio)\
  \ 的“Download Code”选项卡中找到。代码位于 `chapter 17` 下载中，并根据全书中的名称单独命名。\n\n遗憾的是，你作为开发者花费的时间越长，你遇到的错误种类就越多，因为错误是开发过程中的常见部分。然而，随着你的应用程序的演进，寻找并解决这些错误的负担就落在了你身上，因为它们证明了你的软件或你正在处理的数据存在某种问题。\n\
  \n在整本书中你已经接触过一些异常，但你的软件可能会遇到其他不会抛出异常类型的问题。由于缺乏异常，这些问题可能很难追踪；相反，你必须跟踪代码并检查数据发生了什么，而不是通过分析异常来获取这些信息。这个过程可能非常复杂，特别是在较大的应用程序中，因为请求在接收和返回响应之间可能会流经许多不同的类和对象。\n\
  \n在本章中，你将学习观察应用程序的不同方法，以便理解不同类型问题的原因。本章还涵盖了调试，并介绍了 Visual Studio 中的其他工具，这些工具能够让你近距离地接触应用程序的处理过程。\n\
  \n\n\n\n由于你的应用程序在 Visual Studio 之外运行（例如将其放入生产环境后），你还将学习在应用程序不以调试模式运行的情况下捕获信息的各种方法。这些方法可能无法让你立即理解问题，但它们为你提供了一种评估问题的方法，以便你仍然尝试修复它们。\n\
  \n## 错误处理\n\n在许多方面，错误处理既是一个过程，也是一组特定技术的集合。当你第一次编写应用程序代码时，几乎不可能一次性把所有事情都做对，因为可能会出现很多问题。你可能会写错变量名、将方法调用放在错误的位置、在应用程序运行时遇到坏数据，甚至遇到一些你完全无法控制的事情，例如数据库服务器在应用程序运行期间宕机。你需要预测此类故障并设计你的应用程序来处理它们。\n\
  \n管理错误的过程被称为调试（debugging）。Visual Studio 包含了一组丰富的工具来帮助你调试应用程序。这些工具从代码编译期间的检查，到在应用程序运行时监控其运行并在过程中检查不同变量的值。本章稍后将对调试进行更详细的讨论。\n\
  \n### 不同类型的错误\n\n在应用程序开发过程中，你可能会遇到三种不同类型的错误：\n\n*   **语法错误：** 当代码本身错误（由于拼写错误或缺少语言符号）时引起的错误。这类错误会抛出编译错误，你将无法运行应用程序。\n\
  *   **逻辑错误：** 导致结果错误的错误。这些可能是简单的在应该相加一个值时减去一个值，或者在计算时使用了错误的值，或者是代码本身有错误的各种可能性。应用程序仍然可以编译并很可能运行，但它不会返回你可能寻找的结果。\n\
  *   **运行时错误：** 在运行期间导致应用程序崩溃或抛出异常的错误。有时逻辑错误可能会表现为运行时错误，但不总是如此。\n\n上述每个错误都将在接下来的章节中详细解释。\n\
  \n### 语法错误\n\n语法错误也称为 `compile-time errors`（编译错误），是你编写的代码不正确时引起的。在处理示例应用程序时，如果你漏掉了一行代码或写错了变量名，可能已经遇到过这些错误。这些错误通常在编译期间捕获——甚至更早，因为\
  \ Visual Studio 理解编译规则，并在你每次按下按键时重新评估你正在编写的代码区域。这种重新评估使得 IntelliSense 自动完成下拉列表能够填充内容。然而，如图\
  \ 17.1 所示，它还将所有当前的语法错误填充到错误列表窗格中，并在每次按下按键后重新填充此视图。\n\n![错误列表 - RentMyWrox 窗格，上方有代码并列出了\
  \ 2 个错误。](img/c17f001.jpg)\n\n**图 17.1**](#c17.xhtml_c17-fig-anc-0001) Visual Studio\
  \ 中的错误列表\n\n图 17.1 中显示的错误列表列出了跨整个应用程序发现的所有语法错误。如你所见，在第 74 行（光标所在的行）发现了两个不同的错误；第一个错误表示缺少分号（`;`），而第二个错误表示已输入的按键不是一个值。一旦完成输入且\
  \ Visual Studio 识别出你正尝试执行的操作，第二个错误将会消失，而第一个错误将在你于代码行末尾输入分号字符后消失。\n\n此列表中存在的任何错误都会阻止应用程序编译，因此，在尝试运行应用程序之前，快速查看“错误列表”以检查是否有未解决的错误应该成为你的本能。然而，应用程序中可能存在重新评估尚未捕获的错误。应用程序越大，系统其他部分的语法错误在尝试编译应用程序之后才显示的概率就越大。\n\
  \n“错误列表”中列出的项目容易找到和修复。列表不仅显示了文件名和行号，双击错误所在的行还会直接带你进入该文件中的该行，描述解释了问题的本质。\n\n### 逻辑错误\n\
  \n语法错误会阻止你的应用程序编译，更不用说运行了，而逻辑错误要微妙得多。它们不会引起编译问题，甚至可能不会抛出运行时异常；相反，你只是无法得到预期的输出。这些到目前为止是最常见的错误，因为当它们发生时没有自动通知；它们依赖于某事或某人意识到该行为是不符合预期的。\n\
  \n考虑以下从示例应用程序中提取并稍作修改的代码段：\n\n#### 赋值错误错误\n\n```\nusing (RentMyWroxContext context\
  \ = new RentMyWroxContext())\n{\n    var item = context.Items.FirstOrDefault(x =>\
  \ x.Id == itemId);\n    tbAcquiredDate.Text = item.DateAcquired.ToShortDateString();\n\
  \    tbCost.Text = item.Cost.ToString();\n    tbDescription.Text = item.Name;\n\
  \    tbItemNumber.Text = item.ItemNumber;\n    tbName.Text = item.Description;\n\
  }\n```\n\n#### 比较错误\n\n```\nusing (RentMyWroxContext context = new RentMyWroxContext())\n\
  {\n    Notification note = context.Notifications\n    .Where(x => x.DisplayStartDate\
  \ >= DateTime.Now\n        && x.DisplayEndDate <= DateTime.Now)\n    .FirstOrDefault();\n\
  \    return PartialView(\"_Notification\", note);\n}\n```\n\n每个代码段都包含一个或多个逻辑错误，这些错误可以正常编译，但会影响应用程序的正常运行。你能仅通过检查代码找到它们吗？\n\
  \n第一个代码段中的错误在寻找问题时是显眼的，但如果你不预期会有问题，很容易漏掉你将项的 `Name` 属性值赋值了一个名为 `tbDescription` 的对象，并将项的\
  \ `Description` 属性值赋值了一个名为 `tbName` 的对象。识别这种错误变得更加困难，因为它实际上可能是正确的；可能 `TextBox` 控件命名不当，或者“描述”和“名称”这些术语在不同的上下文中含义不同。\n\
  \n第二个代码段中的错误要微妙得多，因此更难追踪。此代码段试图实现的需求是显示当前激活的通知；今天的日期落在通知的 `DisplayStartDate` 和 `DisplayEndDate`\
  \ 属性之间。问题就出在此处。代码段仅当 `DisplayStartDate` 大于等于当前 DateTime 且 `DisplayEndDate` 小于当前\
  \ DateTime 时才返回通知。因此，返回的只有 `DisplayEndDate` 在之前的项或配置错误的项。`DisplayStartDate` 和 `DisplayEndDate`\
  \ 的比较运算符反反了。\n\n在本章的稍后部分，你将查看 Visual Studio 为跟踪这些错误所提供的支持。\n\n### 运行时错误\n\n\n\n\n\
  在应用程序实际运行之前无法看到的错误就是运行时错误（runtime error）。显然，因为应用程序正在运行，这种错误并不是语法错误，而是意味着应用程序中的某些内容执行了应用程序无法处理的意外操作。运行时错误令人头的问题之一是它们可能偶尔发生，特别是当它们与日志错误相关时。\n\
  \n考虑以下情况（同样取自示例应用程序并进行了修改）：\n\n```sharp\nprotected void SaveItem_Clicked(object\
  \ sender, EventArgs e)\n{\n    if (IsValid)\n    {\n        Item item;\n       \
  \ using (RentMyWroxContext context = new RentMyWroxContext())\n        {\n     \
  \       item = new Item();\n            UpdateItem(item);\n            context.Items.Add(item);\n\
  \            context.SaveChanges();\n        }\n        Response.Redirect(\"~/admin/ItemList\"\
  );\n    }\n}\nprivate void UpdateItem(Item item)\n{\n    item.Description = tbName.Text;\n\
  \    item.Name = tbDescription.Text;\n}\npublic class Item\n{\n    [Key]\n    public\
  \ int Id { get; set; }\n    [MaxLength(50)]\n    public string Name { get; set;\
  \ }\n    [MaxLength(250)]\n    public string Description { get; set; }\n}\n```\n\
  \n这与你之前看到的逻辑错误非常相似，但在此情况下，你正在构建将要保存到数据库的对象。这意味着这是一个逻辑错误，尽管它有时会引起运行时异常。如果你查看该项目的数据属性，会发现\
  \ `Name` 属性的最大长度为 50 个字符，而 `Description` 属性的最大长度为 250 个字符。\n\n这些 `MaxLength` 属性就是导致问题的原因。你正确地构建了客户端验证，使得两个属性在返回服务器之前都会通过验证，因此很容易认为一切都会正常工作。事实上上，当你运行一些简单测试时，它似乎运行良好——没有异常。然而，当用户第一次在\
  \ `tbDescription` 文本框中输入超过 50 个字符的值时，就会抛出一个运行时错误，因为该大值被错误地赋值给了 `Name` 属性，导致在执行上下文的\
  \ `SaveChanges` 方法时验证未通过。此错误会导致抛出一个异常。\n\n解析错误（parser error）是另一种不会抛出异常的运行时错误。相反，它抛出的错误可以在浏览器中看到，而不是自动在调试器中显示。图\
  \ 17.2 显示了这些解析错误之一。\n\n![浏览器窗口中 ASP.NET Web Forms 解析错误的“/”应用程序服务器错误消息的截图。](img/c17f002.jpg)\n\
  \n图 17.2 ASP.NET Web Forms 解析错误\n\n当运行“非代码”元素时，可能会发生解析错误。对于 ASP.NET Web Forms，这很可能意味着标记页面中的控件配置不正确，如图所示。对于\
  \ ASP.NET Web Forms 标记页面，即使是那些认为会产生语法错误的项目也能成功编译，但在运行期间会抛出错误。图 17.3 显示了例子：服务器控件的名称拼写错误，但应用程序仍然编译并运行，直到到达该页面。注意，Visual\
  \ Studio 知道语法存在问题，因为标记页面上的拼写错误的控件名称下有波浪线，表示存在问题。\n\n![ASP.NET Web Forms 服务器错误的截图，拼写错误的控件名称下方有绿色波浪线，右侧显示源错误。](img/c17f003.jpg)\n\
  \n图 17.3 带有 VS 的 ASP.NET Web Forms 服务器错误\n\n不幸的是，在处理 ASP.NET MVC 视图时你也会遇到类似的情况，如图\
  \ 17.4\n\n图 17.4 此 MVC 视图有语法错误但可以编译。\n\n该名称不是一个有效属性，Visual Studio 通过属性名称下的波浪线指示了这一点。然而，它成功编译了。\n\
  \nASP.NET Web Forms 和 ASP.NET MVC 的主要区别在于，这个问题在 MVC 中会抛出一个可以在 Visual Studio 中检查的运行时异常，而不是在\
  \ Web Forms 中抛出服务器错误。如所示运行此视图会导致在图 17.5 中所示的异常。\n\n![RentMyWrox(调试) 项目窗口截图，带有弹出窗口显示“HttpException\
  \ 未由用户代码处理”。](img/c17f005.jpg)\n\n图 17.5 由 MVC 视图语法错误引起的运行时错误\n\n运行时错误的一个关键输出是异常（exception）。在下一节中，你将学习如何捕获和处理。\n\
  \n### 捕获与处理异常\n\n运行时错误的输出之一是异常。NET 中有很多异常，它们都继承自 `Exception` 类。你已经在一些地方看到过异常，但除了这些之外还没有对其进行深入讨论。简而言之，异常是运行期间发生的错误。使用异常的优点是程序不会因为发生而终止，而是抛出一个异常。这使得你能够通过分析异常来了解错误情况。\n\
  \n当 .NET 抛出异常时，它是特定的类型并且以 `Exception` 结尾。这些异常是对象，如果你正确捕获它们，就可以像处理其他对象一样与它们交互。\n\n\
  如果你浏览关于异常的不同网络文章，你会发现术语与处理普通对象不同。异常会被“抛出”，而在适当的情况下会被“捕获”。在很多情况下这些动词是准确的。考虑应用程序如何运行。简单来说，它执行第一行代码，然后执行下一行。以这种方式处理直到代码的最后一行，此时应用程序结束。之间可能会发生许多方法调用和操作，但通常程序是这样流动的。然而，当遇到错误时，应用程序停止正在的工作，识别并将错误封装在异常中，然后将其抛出当前的方法。\n\
  \n这种操作会通过应用程序的每一层（或可能发生错误的每个方法），直到到达有异常处理程序的地方，在那里异常被捕获。如果没有异常处理程序，应用程序将停止运行。\n\n\
  \n\n\n`try` 关键字定义了包装器；或者说是准备好捕获异常的代码块。发生在此代码块内部的异常将重定向到由 `catch` 关键字定义的代码块。发生在 `try`\
  \ 块之外的异常将沿着调用堆栈向上传播，直到它被捕获或在运行时出现，从而导致应用程序崩溃。\n\n`try` 关键字定义了将对异常进行管理的代码块。`catch`\
  \ 关键字定义了当 `try` 块内受管理的代码抛出异常时将运行的代码块。通常，在此区域执行的工作会评估异常，以确定执行是否可以继续还是应该停止，并采取某些行动来公布错误的发生。\n\
  \n你可以在不带参数的情况下使用 `catch` 关键字：\n\n```csharp\ntry\n{\n    // some work\n}\ncatch\n\
  {\n    // some other work\n}\n```\n\n然而，如果你在不带参数的情况下使用 `catch` 块，你永远无法对异常进行任何操作，因此你想要使用这种方法的情况非常有限。\n\
  \n你也可以为单个 `try` 块使用多个 `catch` 块，每个块捕获不同类型的异常：\n\n```csharp\ntry\n{\n    // some\
  \ work\n}\ncatch(ArgumentNullException ex)\n{\n    // some other work\n}\ncatch(Exception\
  \ ex)\n{\n    // some other work\n}\n```\n\n如果你像这样链链你的 `catch` 块，那么顺序是非常重要的。框架会评估第一个\
  \ `catch` 块的参数，以查看抛出的异常是否匹配。如果不匹配，它将进入第二个 `catch` 块并再次尝试，遍历整个 `catch` 块链，直到找到匹配的项为止。如果没有匹配，异常将继续向调用堆栈上传递。这就是为什么当你看到多个\
  \ `catch` 块时，你可能会看到最后一个是一个非常通用的类型，例如 `Exception`，它是每个异常的基类，因此它会捕获所有到达该点的异常。\n\n\
  一旦你捕获了异常，就必须确定你的应用程序将做什么。首先，你需要评估抛出的异常的类型。[表 17.1](#c17.xhtml_c17-tbl-0001）描述了你在处理\
  \ ASP.NET 时会遇到的最常见异常。\n\n| `Exception` | `Description` |\n| :--- | :--- |\n| `AmbiguousMatchException`\
  \ | 当绑定到成员导致有多个成员匹配绑定标准时抛出。这在 ASP.NET MVC 中很常见，当两个不同的操作可以响应单个请求时。由于系统无法确定哪一个是正确的值，它会抛出此异常。开发者极少故意抛出此异常。\
  \ |\n| `ArgumentNullException` | 当将空引用传递给不接受其作为有效参数的方法时抛出。当开发者编写了接受复杂类型参数的方法且无法处理空对象时，通常会抛出此异常。\
  \ |\n| `ArgumentOutOfRangeException` | 当参数的值超出了被调用方法定义的允许值范围时抛出。这与 `ArgumentNullException`\
  \ 的不同在于后者是对象是空的。 |\n| `DBConcurrencyException` | 当在尝试更新数据库中已被另一个用户修改的行时发生冲突时抛出。这通常在使用\
  \ `DataAdapter` 访问数据库时被看到。 |\n| `FileNotFoundException` | 当尝试访问不存在的文件时抛出。这通常由框架抛出。\
  \ |\n| `HttpRequestValidationException` | 当收到来自客户端的潜在恶意输入时抛出。当 `Request` 验证失败时，可能会抛出此异常。\
  \ |\n| `IndexOutOfRangeException` | 当尝试使用边界之外的索引访问数组元素时抛出。这在处理数组时很常见。 |\n| `InvalidCastException`\
  \ | 当将一种类型的实例转换为另一种类型不受支持时抛出。此异常通常由框架抛出。 |\n| `KeyNotFoundException` | 当指定的用于访问元素的键与集合中的任何键都不匹配时抛出。这在使用\
  \ `Dictionary` 时发生。 |\n| `NoNullAllowedException` | 当你尝试向 `AllowNull` 设置为 `false`\
  \ 的列插入空值时抛出。开发者极少抛出此异常。 |\n| `NullReferenceException` | 最常见的异常之一，当你尝试访问值为认为的类型上的成员时抛出。这通常反映了开发者的错误。\
  \ |\n| `OutOfMemoryException` | 当没有足够的内存继续执行程序的执行时抛出。此异常代表了灾难性的故障。 |\n| `StackOverflowException`\
  \ | 当执行堆栈由于包含过多的嵌套方法调用而溢出时抛出。这通常在使用递归时调用。 |\n\n\n\n\n\n当你遇到无法处理的异常时，请让这些异常继续沿堆栈向上传递。在本章的稍后部分，你将学习如何配置应用程序来处理这些未处理的异常，这种处理方式让你（作为开发者）能够收集有关问题的信息，同时在用户尝试的操作失败时，仍能为用户提供一致的体验。\n\
  \n虽然到为止我一直强调的是框架抛出的错误，但重要的是，作为开发者，你有时会在自己的代码中创建并抛出异常。这方面的例子是：你创建了一个方法，它接受一个对象作为其属性之一。当该对象为\
  \ `null` 时，你还能执行需要的工作吗？如果不能，你会怎么办？你会如何处理它？在许多情况下，你会像这里这样抛出一个异常：\n\n```csharp\npublic\
  \ void AlphabetizeList(List<ApplicationUser> list)\n{\n    if (list == null)\n \
  \   {\n        throw new ArgumentNullException(\"list\");\n    }\n    list  = list.OrderBy(x=>x.LastName)\n\
  \                .ThenBy(y=>y.LastName).ThenBy(z=>z.MiddleInitial);\n}\n```\n\n\
  通过抛出异常，你是在告诉调用代码传递的参数是有问题的。进行检查也确保了你的方法不会尝试对 `null` 对象执行任何操作，因为那样将会导致框架抛出 `NullReferenceException`。你可能会奇怪，为什么不直接让框架去执行操作呢；但如果你这样做，就会让调用该方法的开发者判断发生了什么时变得更加复杂。相反，你返回了一个\
  \ `ArgumentNullException`，其中包含了关于导致问题的参数的信息。这使得非常容易确定问题是什么以及补救该问题所需的步骤。\n\n到为止，你已经了解了如何捕获异常以及如何抛出异常。有时你需要同时执行这两者：捕获异常，对其进行处理，然后重新抛出该异常，以便它可以继续沿调用堆栈传递。以下是处理此类情况的正确方法：\n\
  \n```csharp\ntry\n{\n    // some work\n}\ncatch(Exception ex)\n{\n    // 在你的日志系统中记录该异常\n\
  \    throw;\n}\n```\n\n这与之前你的方法抛出异常的代码片段不同，因为在那个点，你使用了 `throw` 关键字以及你将要抛出的异常对象。在这种情况下，你只使用了关键字本身而没有带上异常对象，但因为该关键字位于\
  \ `catch` 块中，它可以确定其上下文。请确保你不要这样做：\n\n```csharp\ntry\n{\n    // some work\n}\ncatch(Exception\
  \ ex)\n{\n    // 在你的日志系统中记录该异常\n    throw ex;\n}\n```\n\n这种方法将断开异常与其起源者之间的联系，使异常看起来是从这个方法抛出的，而不是从实际抛出它的方法。发送异常的\
  \ `throw` 变成了所有者，无论是你自己创建的异常，还是从其他地方传递过来的。\n\n很容易产生异常是坏的，因此你不应该编写抛出异常的代码。然而，异常让你能够将问题反馈给调用代码；你抛出异常是因为它给了你错误或损坏的信息。如果不通过抛出异常告诉调用代码，问题将无法理解。理想情况下，你的代码将异常抛给调用代码，然后对其进行修复，以便它可以开始正确地调用你的代码。良好的异常策略有助于确保质量。\n\
  \n当你得到一个异常时，你的责任是修复调用代码以使异常消失。如果你是从前面的示例中调用 `AlphabetizeList` 方法并收到了 `ArgumentNullException`，那么你就知道必须修复你的代码，不要传递一个\
  \ `null` 列表。因此，你可能需要将代码从如下：\n\n```csharp\ntry\n{\n    using (ApplicationDbContext\
  \ context = new ApplicationDbContext())\n    {\n        var userList = context.ApplicationUsers;\n\
  \        AlphabetizeList(userList);\n        return View(userList);\n    }\n}\n\
  catch(Exception ex)\n{\n    // 在你的日志系统中记录该异常\n    throw;\n}\n```\n\n改为：\n\n```csharp\n\
  try\n{\n    using (ApplicationDbContext context = new ApplicationDbContext())\n\
  \    {\n        var userList = context.ApplicationUsers.Where(x=>x.State == state);\n\
  \        if (userList != null)\n        {\n            AlphabetizeList(userList);\n\
  \        }\n        return View(userList);\n    }\n}\ncatch(Exception ex)\n{\n \
  \   // 在你的日志系统中记录该异常\n    throw;\n}\n```\n\n这确保了你没有使用错误的项目调用该方法。你可以开始看到可能存在此类方法的调用链。也许调用\
  \ `AlphabetizeList` 消息的方法是由其他传递过滤标准的代码调用的，而该代码能够带入 `null` 对象调用 `AlphabetizeList`\
  \ 方法的唯一方法就是调用方法发送了导致列表为 `null` 的信息，例如发送了列表中没有任何项目匹配的过滤标准。在这种情况下，你可能希望如下设置代码，并在输入数据导致不当状态时抛出异常：\n\
  \n```csharp\ntry\n{\n    using (ApplicationDbContext context = new ApplicationDbContext())\n\
  \    {\n        var userList = context.ApplicationUsers.Where(x=>x.State == state);\n\
  \        if (userList != null)\n        {\n            throw new ArgumentException(\"\
  state returns null list\",\n               state);\n        }\n        AlphabetizeList(userList);\n\
  \        return View(userList);\n    }\n}\ncatch(Exception ex)\n{\n    // 在你的日志系统中记录该异常\n\
  \    throw;\n}\n```\n\n遗憾的是，这意味着关于何时应该抛出异常并没有硬性的规定。相反，这是一个一步步为进的评估过程。需要记住的关键点是，你的代码需要向调用代码报告它可能存在的任何问题，特别是在与调用代码提供的信息进行交互时。\n\
  \n一旦你捕获了异常，你需要理解它来自哪里以及是什么导致了它，以便你能够修复问题。记住，虽然异常并不是坏事，但并不意味着你希望它们悬留在你的应用程序中。理想情况下，你的应用程序发布后将永远不会抛出单个异常，即使你写的每个方法都至少有一行\
  \ `throw new Exception`，因为你编写代码的方式已经让这些异常根本不会发生了。\n\n.NET 中的每个异常都继承自 `Exception`\
  \ 类，这意味着它有一组通用属性，可以提供有关异常性质的信息。这些通用属性列在表 17.2 中。\n\n| 属性 |  |\n| :--- | :--- |\n\
  | `Data` | 该属性是一个字典，包含一组键值对，这些键值对为异常提供了额外的自定义信息。`Data`属性的有趣之处在于，当它沿调用堆栈向上传递时，你可以继续为其添加信息。`catch\
  \ (Exception e) {` `e.Data.Add(‘RequestedState’, state);` `throw;` `}` |\n| `HelpLink`\
  \ | `HelpLink`属性旨在包含指向异常信息的链接。从该链接获得的信息通常描述了导致异常抛出的条件，并可能描述如何识别和修复该问题。 |\n\n\n\n\
  \n\n| `InnerException` | 导致当前异常的 `Exception` 实例。当异常 X 是由于之前的异常 Y 直接导致而被抛出时，X 的 `InnerException`\
  \ 属性应包含对 Y 的引用。你可以创建一个新的异常来捕获早期的异常。处理第二个异常的代码可以使用来自较早异常的额外信息来更恰当地处理错误。假设有一个函数可以读取文件并格式化该文件的数据。在此例中，当代码尝试读取文件时，会抛出一个\
  \ `IOException`。该函数捕获了 `IOException` 并抛出一个 `FileNotFoundException`。`IOException`\
  \ 可以保存在 `FileNotFoundException` 的 `InnerException` 属性中，使得捕获 `FileNotFoundException`\
  \ 的代码能够检查初始错误的原因。 |\n| `Message` | 描述当前异常的字符串值。错误信息针对处理异常的开发者。`Message` 属性的文本应完全描述错误，并在可能的情况下还描述如何纠正它。顶层异常处理器可能会将消息显示给终端用户，因此你应该确保它语法上是正确的，并且消息的每个句子都以句号结束。\
  \ |\n| `Source` | 引起错误的应用程序或对象的名称。如果没有显式设置 `Source` 属性，则返回异常源所在的程序集名称。 |\n| `StackTrace`\
  \ | 调用栈上即时帧的字符串表示。此列表提供了一种跟踪调用栈到发生异常的方法所在行号的方法。它提供了从抛出异常的最底部区域到定义调用该代码的方法的顶层的详细信息。这是确定错误发生确切位置最有用的属性。请记住，如果你再次抛出异常（这是你不应该做的），那么\
  \ `StackTrace` 属性将被重置，你将从该点开始丢失之前的 `StackTrace`。 |\n| `TargetSite` | 抛出当前异常的方法。如果抛出此异常的方法可用且堆栈跟踪不是空引用，则\
  \ `TargetSite` 从堆栈跟踪中获取该方法。如果堆栈跟踪是空引用，`TargetSite` 也会返回一个空引用。 |\n\n**表 17.2** [#c17.xhtml_c17-tbl-anc-0002]\
  \ Exception 类上的属性\n\n你将用到的最重要的属性是异常类型本身（`ArgumentNullException`、`NullReferenceException`）、`Message`\
  \ 和 `StackTrace`。这些属性让你了解问题的类型以及发生的位置。你将在本章后面的部分学习更多关于分析异常的细节。\n\n根据让异常通过调用栈流动的建议，你可能在想它们何时（或是否）最终会被捕获。再次，答案取决于具体情况。如果抛出了异常，会发生两种情况之一：你捕获了异常并尝试恢复；第二种是你无法恢复并且必须决定行动方案。在某些情况下，你可以解析错误以给用户提供一些有用的信息，但对于其他意外错误，你无法这样做。此外，在某个时间点，你必须决定通用的错误处理方法是否是最好的。\n\
  \n下一节将演示 ASP.NET 如何帮助你显示错误，并在异常发生时全局管理它们，而不会向用户发出警告，即使应用程序刚刚发生了错误。\n\n### 全局错误处理和自定义错误页面\n\
  \n你已经见过“死亡黄屏”的实例，这是当 ASP.NET 遇到错误时显示的默认屏幕。对于用户来说，这不是最友好的屏幕。然而，ASP.NET 通过其对自定义错误面的支持提供了一种防止用户进入该屏幕的方法。\n\
  \n自定义错误页面是你创建的页面，用于替代标准错误屏幕显示给用户。通常，此页面的样式与应用程序的其他部分一致，并向用户提供一条令人安心的消息。你可以在 `web.config`\
  \ 文件中向 `system.web` 节点添加新元素来启用自定义错误页面：\n\n```xml\n<customErrors mode=\"On\" defaultRedirect=\"\
  ~/Errors/Error500.aspx\"\n             redirectMode=\"ResponseRewrite\">\n    <error\
  \ statusCode=\"404\" redirect=\"~/Errors/Error404.aspx\"/>\n    <error statusCode=\"\
  500\" redirect=\"~/Errors/Error500.aspx\"/>\n</customErrors>\n```\n\n通过添加此 `customErrors`\
  \ 元素，你启用了自定义错误页面。你可以通过 `mode` 属性开启或关闭它，`on` 表示将使用自定义错误页面，`off` 表示相反。你还可以使用 `RemoteOnly`，这意味着自定义错误页面将只返回给从不同机器调用服务器的用户。此设置允许你在调试时看到错误信息，而当任何人从不同的机器调用时，显示自定义错误页面。`customErrors`\
  \ 元素中的其他主要属性是 `defaultRedirect`（如果为异常没有特定的错误页面，则提供默认重定向页面）和 `redirectMode`（它有两个选项）：\n\
  \n* `ResponseRedirect:` 指定重定向到浏览器的 URL 必须与原始 Web 请求 URL 不同。\n* `ResponseRewrite:`\
  \ 指定重定向到浏览器的 URL 必须是原始 Web 请求 URL。\n\n配置的其他部分是 `customErrors` 元素内的 `error` 节点。这些节点提供了特定\
  \ HTTP 状态码（如 404）与网页之间的映射。你可以根据需要创建尽可能详细的映射，如果需要，每个状态码可以创建一个；任何未显式映射的项目都将发送到 `defaultRedirect`\
  \ 值。\n\n然而，重要的是，这种行为并没有捕获任何导致重定向到自定义页面的异常信息（与 404 未找到页面错误不同）。但是，ASP.NET 提供了一种机制，通过支持全局错误处理器来捕获有关这些异常的信息。\n\
  \n此全局错误处理器是位于应用程序根目录下的 `global.asax` 页面的一部分。\n\n```csharp\nvoid Application_Error(object\
  \ sender, EventArgs e)\n{\n}\n```\n\n当异常被抛出且未被处理时，它最终到达 `Application_Error` 事件处理器。在此时，你可以根据需要对它进行处理，以便你始终知道发生了异常。\n\
  \n### 控制器中的错误处理\n\n你刚刚处理的自定义错误页面和全局错误处理无论框架如何都有效。它们是 ASP.NET Web Forms 早期形式的一部分，并已进化到支持\
  \ MVC。ASP.NET MVC 有它特定的方式来管理发生在控制器内部或其调用的代码内部的异常。这种 MVC 方法使用了一个可以应用于操作、控制器和应用程序级别的属性：`HandleError`\
  \ 属性。\n\n在应用 `HandleError` 属性时，你可以选择设置表 17.3 所示的不同属性。\n\n| **属性** | **描述** |\n|\
  \ :--- | :--- |\n| `ExceptionType` | 定义应应用于该属性的异常类型。如果未设置该值，则该属性默认设置为处理基类 `Exception`。\
  \ |\n\n\n\n\n\n| `Master` | 定义用于显示异常信息的主视图 |\n| `View` | 定义用于显示异常的页面视图 |\n\n###\
  \ `Table 17.3` HandleError 属性\n\n在控制器上添加 `HandleError` 属性的写法如下所示：\n\n```c\n[HandleError(ExceptionType=typeof(NullReferenceException),\n\
  \        View=\"NullReferenceView\")]\n[HandleError(View = \"ExceptionView\")]\n\
  public class ItemController : Controller\n```\n\n上面的代码段定义了两个负责显示错误消息的不同视图。这些错误视图应该位于\
  \ `Views\\Shared` 目录中，并且看起来与其他所有视图相似，不同之处在于没有匹配的控制器，因为在这种情况下错误框架充当了控制器的角色；这就是为什么\
  \ `HandleError` 属性也允许你设置 `Master` 页面属性。\n\n你已经了解了如何向控制器添加该属性，但你也可以添加该属性以覆盖整个应用程序。这需要多一些工作，因为你必须在应用程序的核心进行几处更改。首先，你需要添加一个新类，将\
  \ `HandleError` 属性作为过滤器添加。该类显示如下：\n\n```csharp\npublic class FilterConfig\n{\n \
  \   public static void RegisterGlobalFilters(GlobalFilterCollection filters)\n \
  \   {\n        filters.Add(new HandleErrorAttribute());\n    }\n}\n```\n\n一旦你创建了管理过滤器注册的类（MVC\
  \ 属性也称为过滤器），你就将其接入应用程序中。你可以在 `Global.asax` 类中通过向 `Application_Start` 方法添加一行代码（下文所示）来实现：\n\
  \n```csharp\nvoid Application_Start(object sender, EventArgs e)\n{\n    // 应用程序启动时运行的代码\n\
  \    AreaRegistration.RegisterAllAreas();\n    FilterConfig.RegisterGlobalFilters(GlobalConfiguration.Configuration);\n\
  \    RouteConfig.RegisterRoutes(RouteTable.Routes);\n    BundleConfig.RegisterBundles(BundleTable.Bundles);\n\
  }\n```\n\n在使用 `HandleError` 属性时，你应该注意一些局限性。首先，错误不会被记录在任何地方，因为没有代码在处理该异常。其次，在控制器之外引发的异常（例如视图内部）不会被处理。第三，404\
  \ 错误不会被处理，因此如果你希望处理“页面未找到”错误，仍然需要使用上一节介绍的 `customErrors` 方法。\n\nMVC 方法提供的开箱支持比 `customErrors`\
  \ 方法少少，但它提供了可定制性。ASP.NET Web Forms 采用的方法是尽力提供用户所需的所有内容，它更倾向于功能性而非可定制性。ASP.NET MVC\
  \ 则选择了另一条道路。在 MVC 中，你可以替换或扩展 `HandleError` 属性。因此，你可以编写代码来解决某些局限性，例如与异常进行交互。\n\n\
  你已经学习了创建和捕获异常的几种不同方法。下一节将描述如何管理与这些异常的交互，以及你的代码在运行时通用情况，因为在理解如何修复问题之前，你可能需要多次运行以观察问题的实际发生。\n\
  \n## 调试基础\n\n调试是在代码中查找问题并修复它们的过程。这些问题可能由许多不同的原因引起，确定根源有时是一项挑战。很多时候，你必须跟踪程序的执行过程，观察数据发生的变化，以便确定真正导致错误的因素是什么。\n\
  \n幸运的是，Visual Studio 提供了许多不同的工具，旨在让你深入了解应用程序的执行流。你已经看到了如何使用断点来停止应用程序的运行，从而让你访问系统中各种对象的状态。你可以在任何地方添加断点，并评估几乎任何类型对象的状态。你可以停在程序的某一点，然后逐行通过，观察信息在每一行中的变化。\n\
  \n### 调试工具支持\n\n在 Visual Studio 中，有许多不同的方法可以查看应用程序中各种对象的值。你不仅可以看到这些值，还有多种方法在应用程序执行时在代码中移动。你要做的第一件事是检查移动应用程序执行过程的各种方式。\n\
  \n#### 在调试代码中移动\n\n在移动代码之前，你必须考虑如何进入代码。你始终可以选择在不进行调试的情况下运行应用程序（`Ctrl+F5`），但如果你打算在调试模式下运行，有几种不同的启动方式。一种是你到目前为止使用的方式，使用\
  \ `F5` 或“开始（Start）”。这允许你在调试模式下运行。调试模式允许你添加断点，在处理过程的任何一点停止代码；当抛出任何未处理的异常时，它将直接带你到达那里。\n\
  \n一旦通过断点停止执行流，你就可以重新启动代码执行。你可以使用 `F5` 重新启动应用程序，允许程序执行到遇到下一个断点。你也可以选择 `F11` 重新启动应用程序并跳转到正在执行的下一行代码。这种从一行到下一行执行代码的过程被称为“单步执行（stepping\
  \ through）”。[`Table 17.4`](#c17.xhtml_c17-tbl-0004）描述了其他几种组合键，可以帮助你在程序执行暂停后进行移动。\n\
  \n| **按键** | **描述** |\n| :--- | :--- |\n| `F5` | 在调试模式下启动应用程序。如果执行已停止，`F5` 将允许执行直到遇到下一个断点或完成。\
  \ |\n| `F11` | 在调试模式下启动应用程序。如果执行已停止（例如在断点处），则 `F11` 将重新启动执行并跳转到下一行代码，然后再次像遇到断点一样停下。如果你在方法调用上选择\
  \ `F11`，将进入方法，可以在那里继续单步执行。 |\n| `F10` | 在调试模式下启动应用程序。当执行已停止时，`F10` 将重新启动执行并跳转到下一行代码，然后再次像遇到断点一样停下。`F10`\
  \ 与 `F11` 的区别在于，如果你在方法调用上选择它，执行流不会进入方法，而是继续到方法调用之后的行。它不允许你跟踪方法内部。 |\n| `Shift+F11`\
  \ | 此组合键允许你完成当前代码块内的执行。它通常在你使用 `F11` 进入方法并确定不需要继续执行该方法内部的处理时使用。使用此组合键可以移动到进入该代码块的调用之后的行。\
  \ |\n| `Shift+F5` | 停止调试并关闭浏览器窗口 |\n| `Ctrl+Shift+F5` | 此组合键停止调试、关闭浏览器窗口并重启调试。 |\n\
  | `F9` | 切换断点的开启和关闭。如果你在调试模式下进行此操作，只能在执行停止时进行。这意味着你是在到达断点时关闭它，或者在单步进入某行代码后开启它。你也可以在应用程序未运行时执行此操作，切换焦点所在代码行的断点。\
  \ |\n| `Ctrl+Shift+F9` | 删除所有断点。你需要确认要执行此操作。你可以像使用 `F9` 一样执行删除，无论是在应用程序运行且执行停止时，还是仅仅在\
  \ IDE 中时。 |\n\n\n\n\n\n你可以通过表 17.4 所示的按键，或通过调试工具栏上的按钮（参见图 17.11）来管理代码执行运行。\n\n![调试工具栏截图，箭头指向图标：暂停、停止、重启、单步进入、逐出和逐过程。](img/c17f011.jpg)\n\
  \n**图 17.11**](#c17.xhtml_c17-fig-anc-0011) 调试工具栏\n\n在调试模式下，你的 Visual Studio 工具栏中应该显示调试工具栏。如果没有显示，你可以右键点击现有的菜单项并确保勾选了\
  \ `Debug`（调试），如图 17.12 所示。\n\n![勾选了 Debug 的下拉菜单截图。](img/c17f012.jpg)\n\n**图 17.12**](#c17.xhtml_c17-fig-anc-0012)\
  \ 调试工具栏\n\n理解在调试模式下如何移动代码是理解应用程序运行情况的第一步。下一步是访问信息以便进行分析。你已经看到当执行停止时，可以将鼠标悬停在对象上，然后深入查看该对象及其分配的值。这种方法很有效，但可能会有些麻烦，特别是当你想要比较不同对象中的值时。幸运的是，Visual\
  \ Studio 提供了多种形式的支持来帮助获取所需的信息。\n\n## 调试窗口\n\nVisual Studio 有多个用于支持调试的窗口。第一组与监控代码中不同变量的值有关。接下来的部分将介绍这些。\n\
  \n### 监视窗口 (Watch Windows)\n\n最重要且灵活的调试窗口是监视窗口。监视窗口允许你输入一个或多个变量并监控变量的值。你可以在执行停止时选择\
  \ `Debug` ![arrow](img/arrow.jpg) `Windows` ![arrow](img/arrow.jpg) `Watch` 来打开监视窗口。注意，有多个监视窗口，如图\
  \ 17.13 所示。\n\n![调试窗口截图，选了 Watch 1,2,3 和 4。](img/c17f013.jpg)\n\n**图 17.13**](#c17.xhtml_c17-fig-anc-0013)\
  \ 监视窗口\n\n监视窗口是一个带有三个列标题的简单网格：Name（名称）、Value（值）和 Type（类型）。使用监视窗口非常简单：双击网格，在 Name\
  \ 列中输入你想要监视的变量名称，`Value` 和 `Type` 列将填充相应的内容。随着程序执行的继续，你可以在监视窗口中观察值的变化。图 17.14 显示了在运行示例应用程序默认页面时使用的监视窗口。\n\
  \n![示例应用程序默认页面下方的监视窗口截图，带有代码行。](img/c17f014.jpg)\n\n**图 17.14**](#c17.xhtml_c17-fig-anc-0014)\
  \ 工作中的监视窗口\n\n图中正在观察三个不同的值：`ViewBag.PageSize`、`ViewBag.PageNumber` 和 `items.Count()`。你可以看到执行停在第\
  \ 28 行，且 Name 部分列出的每个项目都有显示对应的值。你还可以在窗口中进行计算，因此该列的内容会经过计算并显示值：\n\n```\nitems.Count()\
  \ * ViewBag.PageSize\n```\n\n虽然你可以在监视窗口中进行一些计算，但并不能进行所有操作。诸如 LINQ 语句不会运行，某些不同的转换方法也不行。然而，大多数其他计算都可以执行并显示其结果。\n\
  \n### 自动窗口 (Autos Window)\n\n另一个支持调试的窗口是自动窗口。它位于与监视窗口相同的菜单区域，并提供一些相同的功能。自动窗口的显示方式与监视窗口相同，也是一个三列的网格。主要的区别在于，监视窗口要求你输入想要监视的变量，而自动窗口直接显示所有活跃的变量（参见图\
  \ 17.15）。\n\n![示例应用程序默认页面下方的自动窗口截图，带有代码行。](img/c17f015.jpg)\n\n**图 17.15**](#c17.xhtml_c17-fig-anc-0015)\
  \ 工作中的自动窗口\n\n在这里，你可以看到 `ViewBag`、名为 `items` 的变量以及名为 `this` 的变量。`ViewBag` 和 `items`\
  \ 与你在监视窗口中看到的相同，但“`this`”的值是不同的。图 17.16 显示了该变量完全展开后的状态。\n\n![自动窗口中展开的此变量截图，下方有一个列表。](img/c17f016.jpg)\n\
  \n**图 17.16**](#c17.xhtml_c17-fig-anc-0016) 自动窗口中展开的 this 变量\n\n这里的 `this` 关键字是正在处理的类的同义词。你可以查看控制器的任何属性，例如\
  \ `User` 和 `HttpContext`。\n\n简而言之，监视窗口允许你选择想要监视的变量，而自动窗口提供了当前暂停处可用的所有值。\n\n### 局部窗口\
  \ (Locals Window)\n\n局部窗口类似于自动窗口，其显示的项目是自动确定的。然而，变量的作用范围不同，它只显示在当前点作用范围内的变量，如图 17.17\
  \ 所示。\n\n![示例应用程序默认页面下方的局部窗口截图，带有代码行。](img/c17f017.jpg)\n\n**图 17.17**](#c17.xhtml_c17-fig-anc-0017)\
  \ 工作中的局部窗口\n\n局部窗口显示传入方法的变量。`ViewBag` 不是局部的（定义在当前方法内），因此你没有看到它。但你仍然可以获取 `ViewBag`\
  \ 内部的值，因为它们包含在 `this` 中，自动自动窗口包含了这些值。\n\n## 其他窗口\n\n除了变量监控窗口外，还有其他窗口可以帮助你的调试需求。\n\
  \n### 断点窗口 (Breakpoint Window)\n\n断点窗口显示你在整个应用程序中设置的所有断点，如图 17.18 所示。\n\n![示例应用程序默认页面下方的断点窗口截图，带有代码行。](img/c17f018.jpg)\n\
  \n**图 17.18**](#c17.xhtml_c17-fig-anc-0018) 工作中的断点窗口\n\n它包含了页面和行信息，以及为断点设置的任何条件，该断点在当前执行阶段命中的次数。\n\
  \n你已经看到如何设置普通断点，但也可以添加条件。条件是一个规则（或一组规则），决定断点何时停止程序的执行。默认行为是每次命中断点时都停止，但使用条件你可以指定何时中断，例如仅当变量值超过某个设定值时。你可以通过右键点击断点并选择\
  \ `Conditions` 为断点添加条件。你也可以从断点窗口右键点击断点来添加条件。条件选择窗口如图 17.19 所示。\n\n![代码行下方条件选择窗口截图。Conditions\
  \ 复选框已勾选，断点设置为 recentItems.Count > 2。](img/c17f019.jpg)\n\n**图 17.19**](#c17.xhtml_c17-fig-anc-0019)\
  \ 选择条件的窗口\n\n\n\n\n在此案例中，为断点设置了条件 `recentItems.Count > 2`。如图所示，`recentItems` 是来自数据库查询的结果集，因此显示的条件确保了只有当返回的列表中包含超过两个项目时，执行程序才会中断。\n\
  \n### 调用堆栈窗口 (Call Stack Window)\n\n断点（Breakpoint）窗口让你查看设置了停止应用程序执行的地方，而调用堆栈窗口则让你查看暂停处代码代码的调用堆栈。当你在应用程序中移动时，只需双击调用堆栈列表中的基准项，即可轻松地返回父级调用方法，如图图\
  \ 17.20 所示。\n\n![调用堆栈窗口截图，代码行下方有一个列表。](img/c17f020.jpg)\n\n图 17.20 使用调用堆栈窗口\n\n\
  ### 立即窗口 (Immediate Window)\n\n调试过程中另一个非常有用的窗口是立即窗口。立即窗口与在本节中看到的其他窗口不同之处在于，它不仅仅显示调试时可用变量的信息；它还允许你执行代码。图\
  \ 17.21 显示了两种不同的方法——在第一种情况下运行了一个方法，在第二种情况下显示了当前变量的详细信息。\n\n![立即窗口截图，代码行下方有一个列表。](img/c17f021.jpg)\n\
  \n图 17.21 使用立即窗口\n\n在立即窗口中工作的关键是 `?` 字符，它告诉系统输出结果。立即窗口的第一行是 `? Details(3)`，其中 `?`\
  \ 告诉窗口将结果输出到自身。然后窗口会运行控制器的 `Details` 方法，并传入值 `3`。该方法的结果显示在行行下方。\n\n`?` 的下一个实例是 `?\
  \ userId`，其中窗口会输出名为 `userId` 的变量值。你也可以对这些值进行操作，例如使用下面的命令，它将向立即窗口返回 `false`：\n\n\
  ```\n? userId == Guid.Empty\n```\n\n你可以在立即窗口中做更多事情。有关关于其功能的更多信息，请访问 [`msdn.microsoft.com/en-us/library/f177hahy.aspx`](https://msdn.microsoft.com/en-us/library/f177hahy.aspx)。\n\
  \n### 调试客户端脚本\n\n你已经花了一些时间调试服务器端代码，以便理解在服务器上处理以创建发送到用户浏览器的 HTML 和其他内容。然而，你目前看到的这些调试功能似乎在内容发送到客户端后就结束了。幸运的是，你可以使用刚刚用过的许多相同工具，对在客户端运行的\
  \ JavaScript 进行额外的调试。\n\n这意味着你可以在 JavaScript 中添加断点。如果你使用的是内联 JavaScript，只需通过在该页面上你想调试的\
  \ JavaScript 代码行上放置断点即可。如果你想调试你编写的 JavaScript 代码（例如 `MainPageManagement.js` 中的方法），你可以像在\
  \ C# 代码中那样直接添加断点。在接下来的“尝试一下”活动中，你将获得一些导致错误的代码，并走查找和解决问题的过程。\n\n在编写代码时使用调试是无价的。遗憾的是，当脱离你的\
  \ Visual Studio 调试器独立运行代码时，它不提供任何支持。在下一节中，你将学习如何在无论环境如何的情况下捕获运行应用程序中的错误信息。\n\n##\
  \ 追踪你的 ASP.NET 页面\n\n追踪（Tracing）是获取有关应用程序运行输出信息的能力，它是内置在 ASP.NET 中的，并为理解应用程序运行时的行为提供了大量支持。此外，由于它是内置在\
  \ ASP.NET 中的，因此不需要任何特殊编码即可访问这些信息。当你启用追踪时，可以确保系统捕获每个请求完整处理过程的信息。追踪详情中显示的默认项目如表 17.5\
  \ 所示。\n\n| 追踪部分 | 描述 |\n| :--- | :--- |\n| 请求详情 (Request Details) | 显示有关当前请求和响应的基本信息。此部分显示的有趣信息包括请求时间、请求类型（如\
  \ `GET` 或 `POST`）以及返回的状态码。 |\n| 跟踪信息 (Trace Information) | 显示页面级事件的流。如果你创建了自定义跟踪消息（下一节），这些消息也会在这里显示。\
  \ |\n| 控制树 (Control Tree) | 显示在页面中创建 ASP.NET 服务器控件的信息。此部分仅由 ASP.NET Web Forms 页面和控件填充。\
  \ |\n| 会话状态 (Session State) | 显示存储在会话状态中的值（如果有）。 |\n| 应用程序状态 (Application State)\
  \ | 存储在应用程序状态中的值（如果有）。应用程序状态是 ASP.NET 应用程序中所有类可用的数据存储。应用程序状态存储在服务器内存中，比在数据库中存储和检索信息更快。与特定单个用户会话的状态状态不同，应用程序状态适用于所有用户。\
  \ |\n| 请求 Cookie (Request Cookies) | 显示从浏览器发送到服务器的 Cookie。 |\n| 响应 Cookie (Response\
  \ Cookies) | 显示从服务器返回给客户端的 Cookie。 |\n| 头部 (Headers) | 显示请求和响应标头的键值对，提供有关消息体或请求资源的信息。\
  \ |\n| 表单 (Form) | 显示 `POST` 操作期间提交的表单元素值（控件值）。 |\n| 查询字符串 (Querystring) | 传递在 URL\
  \ 中的值。在 URL 中，查询字符串与路径信息通过问号 (`?`) 隔开；多个查询字符串元素通过和符号 (`&`) 隔开。查询字符串键值对通过等号 (`=`)\
  \ 隔开。 |\n| 服务器变量 (Server Variables) | 显示服务器相关的环境变量和请求标头信息的集合。这包括请求的 URL、来源信息、本地目录等。\
  \ |\n\n表 17.5 追踪输出中的可用部分\n\n\n\n\n| 属性 | 描述 |\n| :--- | :--- |\n| `PageOutput` |\
  \ 当 `PageOutput` 为 `true` 时，追踪信息将放在发送到浏览器的每个页面底部。追踪信息也可以从追踪查看器（trace viewer）获取。当此值为\
  \ `false` 时，追踪信息仅可用追踪查看器。 |\n| `RequestLimit` | 指定在服务器上存储的追踪请求数量的值。默认值为 10。 |\n\
  | `TraceMode` | 追踪信息的显示顺序。设置为默认值 `SortByTime`，则按信息处理的顺序进行排序。设置为 `SortByCategory`，则按用户定义的类别的字母字母顺序进行排序。\
  \ |\n| `LocalOnly` | 使追踪查看器仅在从宿主 Web 服务器上的浏览器调用时可用。默认值为 `true`。 |\n| `MostRecent`\
  \ | 指定是否将最近的追踪信息作为追踪输出显示。当超过 `RequestLimit` 限制时，详细信息将被丢弃。如果此值设置为 `false`，则最新的数据将被丢弃。\
  \ |\n\n**表 17.6**](#c17.xhtml_c17-tbl-anc-0006) 追踪配置属性\n\n你可以在启用追踪后变为可用的地址 `Trace.axd`\
  \ 查看此追踪信息。图 17.30 显示了初始页面。\n\n![在 https://localhost:1072/Trace.axd 页面中列出对此应用程序请求的应用程序追踪截图。](img/c17f030.jpg)\n\
  \n**图 17.30**](#c17.xhtml_c17-fig-anc-0030) 追踪列表页面\n\n这向你显示了已追踪的请求列表。列表会在每次服务器重启时进行刷新，因此无法访问以前运行的追踪。该列表仅显示请求列表，但可以通过页面右侧的链接访问追踪详细信息。点击这些链接之一即可获取追踪详细信息，如图\
  \ 17.31 所示。\n\n![在 https://localhost:1072/Trace.axd?id=6 页面中带有请求详情的应用程序追踪截图。](img/c17f031.jpg)\n\
  \n**图 17.31**](#c17.xhtml_c17-fig-anc-0031) 追踪详情页面\n\n为你的应用程序添加追踪允许你收集其在使用过程中的行为信息。然而，虽然默认信息可以提供一些有趣的信息，但添加自定义信息会让追踪更加有效。\n\
  \n### 在追踪中添加你自己的信息\n\n每个使用 ASP.NET 的应用程序都有不同的需求，这意味着每个应用程序都有可能重要的不同项目。这就是为什么你具有向追踪中添加信息的能力。\n\
  \n向追踪中添加自定义信息需要两个步骤：添加额外的配置，以及添加支持追踪的额外代码，因为虽然你不需要添加额外的代码来支持默认追踪，但确实需要添加调用来告诉追踪引擎你想向追踪中添加哪些自定义信息，以及何时应该发生追踪。\n\
  \n添加配置需要向 `system.diagnostics` 元素再添加一个配置值。在 `web.config` 文件的 `system.diagnostics`\
  \ 元素中，你需要配置一个监听器：\n\n```\n<trace>\n  <listeners>\n    <add name=\"WebPageTraceListener\"\
  \n          type=\"System.Web.WebPageTraceListener, System.Web,\n          Version=2.0.3600.0,\
  \ Culture=neutral,\n          PublicKeyToken=b03f5f7f11d50a3a\"/>\n  </listeners>\n\
  </trace>\n```\n\n一旦添加了监听器，你就必须添加代码将额外信息添加到追踪中。主要方法是使用 `System.Diagnostics.Trace`\
  \ 类。这些方法在表 17.7 中。\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `TraceError` | 向追踪写入一条信息性消息。如果使用此方法，消息将以红色显示。\
  \ |\n| `TraceInformation` | 向追踪写入一条信息性消息 |\n| `TraceWarning` | 向追踪写入一条信息性消息。如果使用此方法，消息将以红色显示。\
  \ |\n| `Write` | 向追踪写入一条信息性消息 |\n| `WriteIf` | 如果满足特定条件，则向追踪写入一条信息性消息 |\n| `WriteLine`\
  \ | 向追踪写入一条信息性消息 |\n\n**表 17.7**](#c17.xhtml_c17-tbl-anc-0007) 追踪方法\n\n在下一个“尝试一试”活动中，将在应用程序中启用追踪，并进行一些更改以包含自定义追踪信息。\n\
  \n### 追踪与性能\n\n正如你所猜的，追踪会产生一些性能开销，因为服务器必须执行额外工作来保存这些信息。因此，在生产环境中运行时，一直开启追踪可能并不总是对你有利。通常，由于追踪是由配置管理的，你可以根据需要开启或关闭它。\n\
  \n在存在独立环境（如开发、测试和生产环境）的情况下，追踪通常在开发和测试环境中开启，因为这些环境的设计是为了出现问题——主要是为了确保你的应用程序到达生产环境时没有遗留问题！\n\
  \n## 日志记录 (Logging)\n\n追踪是获取应用程序运行情况信息的极佳工具。然而，它有一些缺陷，因为它只保留有限数量的请求；更糟糕的是，列表仅在运行期间保留。幸运的是，有一种简单的方法可以扩展此功能：日志记录。\n\
  \n在最简单的定义中，日志记录是维护关于或来自应用程序的数据。这些数据与运行应用程序所需的信息不同，因为它通常包含应用程序内部的数据。\n\n.NET 没有内置用于创建日志的设施，但有很多第三方工具可用。在本节中，你将使用其中一种第三方工具，一个名为\
  \ nLog 的开源工具。\n\n`nLog` 提供了许多功能，但你现在仅使用其文本日志功能。有关完整功能的更多信息，请访问 [`www.nlog-project.org`](http://www.nlog-project.org)。\n\
  \n### 下载、安装和配置记录器\n\n通过使用 NuGet 包，向应用程序添加日志变得简单，它可以集成额外功能。你要集成的日志系统 nLog 是一个单一库文件，NuGet\
  \ 会自动在你的应用程序中可用。在下一个“尝试一试”中，你将在应用程序中安装、配置并实现日志记录。\n\n日志记录允许你维护应用程序的记录。这通过将错误信息放在可以用来确定原因的地方，支持了你的错误管理策略。如果你的应用程序存在缺陷，日志记录允许你确定缺陷发生的位置以及数据状态。这反过来让你能够解决问题，因为应用程序中的每个问题都可能导致用户满意度下降，并可能导致收入损失。\n\
  \n## 总结\n\n编写软件并不是一种完美的艺术。作为开发者，你可能会花费大量时间追踪软件中的问题，无论那是你写的还是别人写的。你会遇到三种类型的错误；语法错误、运行时错误和逻辑错误。语法错误最容易确定，因为它们会阻止应用程序编译，并且编译过程会提供有关问题的信息。\n\
  \n\n\n\n运行时错误会导致 .NET 框架抛出异常。异常是检测到错误的通知。然而，它并不会自动导致你的代码崩溃，而是提供了一个机会，让你通过使用 `try`、`catch`\
  \ 和 `finally` 关键字与问题进行交互。`try` 关键字包裹了可能抛出异常的代码，而 `catch` 则是一个或多个允许你处理异常的代码块。\n\n\
  异常通常会向你提供关于所发生问题的信息。最后一种错误要微妙得多，即逻辑错误。这种错误意味着你编写的代码可以运行，但它的运行结果并没有按照你预期的那样。这些错误最难发现。不过，Visual\
  \ Studio 提供了多个工具和窗口，允许你访问并观察流经你应用程序的数据。通过这些窗口和调试器，你能够监控应用程序中的所有数据，以理解问题源于何处。\n\n\
  所有这一切都有助于你在开发周期内管理问题；但是，如果应用程序没有在调试器中运行，这些工具对你的帮助就不大了。还有两个额外的工具可以支持这些工作：追踪（Tracing）和日志（Logging）。\n\
  \n追踪是一个过程，你可以让你的 Web 服务器记住最近若干次请求中所发生的处理信息。这些处理信息将通过 Web 页面可用，以便你检查在该请求期间发生了什么。如果你或其它用户在测试你的应用程序时遇到问题，你只需要根据他们所访问的应用程序部分和错误发生的时间查找追踪即可。\n\
  \n日志与追踪非常相似，区别在于你必须添加代码将信息写入日志记录器。日志记录器还支持将信息写入物理文件，以便你在任何时候进行审查，无论服务器是否已重启；而 Web\
  \ 服务器如果重启，追踪将会丢失其信息。\n\n### 练习题\n\n1. **1.** 下述代码段有什么问题？\n\n```\ntry\n{\n    //\
  \ call the database for information\n}\ncatch(Exception ex)\n{\n    // handle the\
  \ exception\n}\ncatch (ArgumentNullException ex)\n{\n    // handle the exception\n\
  }\n```\n\n2. **2.** 你可以使用追踪或日志来了解你应用程序的性能吗？\n\n## 本章你学到的知识\n\n| 术语 |  |\n| :---\
  \ | :--- |\n| 调用堆栈 (Call Stack) | 运行代码元素的列表。当每个方法调用另一个方法时，该新方法会被添加到调用堆栈。调用堆栈的主要责任是将执行代码返回到定义的位置，但它也能让你了解调试过程中的代码执行流。\
  \ |\n| 自定义错误页面 (Custom Error Pages) | 自定义错误页面允许你创建符合你网站视觉风格和感受的页面，在本例中用于向用户显示错误。你可以根据需要将页面做得具体或通用，以最符合你的需求。\
  \ |\n| 调试 (Debugging) | 运行你的代码执行过程并确定其是否提供了预期结果的过程。 |\n| 调试窗口 (Debugging Windows)\
  \ | Visual Studio 提供的各种窗口，用于支持你的调试工作。它们的设计旨在让你访问执行代码中使用的各种变量和值。 |\n| 异常 (Exception)\
  \ | 一种特殊的 .NET 对象，包含有关已发生错误的信息，包括错误类型和发生位置。它可以被捕获并处理，也可以让它在沿堆栈向上时暴露在应用程序中，直到被捕获或应用程序停止工作。\
  \ |\n| 全局错误处理 (Global Error Handling) | 一种错误处理方法，在应用程序的单点进行处理。这允许在单处使用标准方法。然而，它也可能导致上下文丢失，因为实际的调用点可能不再为人知。\
  \ |\n| HandleError 特性 (HandleError Attribute) | 一种特定的 ASP.NET MVC 全局错误处理方法。你可以在\
  \ Action 级别、控制器级别或整个应用程序级别为特定的异常分配特定的方法和处理器。 |\n| 日志 (Logging) | 将有关应用程序处理的信息写入中央存储（如数据库或文本文件）的过程。\
  \ |\n| 逻辑错误 (Logic Error) | 当代码编译并运行，但没有得到预期结果时发生。它的复杂程度可以从简单的错误（例如使用 `>` 而不是 `>=`）到非常复杂，取决于预期结果。\
  \ |\n| 运行时错误 (Runtime Error) | 当代码编译并运行，但在某处抛出了可以停止应用程序执行的异常时发生。 |\n| 堆栈跟踪 (Stacktrace)\
  \ |附加在抛出异常上的调用堆栈。它显示了抛出异常的方法当时的调用堆栈。 |\n| 追踪 (Tracing) | 维护关于应用程序内活动的运行列表的过程。它与日志的区别在于，它是\
  \ ASP.NET 内置的，并且捕获日志通常无法访问的内部处理。 |\n| 语法错误 (Syntax Error) | 代码不正确导致无法编译的错误。 |\n\n\
  # 第 18 章\n\n## 使用版本控制\n\n### 本章你将学到：\n\n* 什么是版本控制以及你为什么应该使用它\n* 使用 Team Foundation\
  \ Services 作为你的源代码仓库工具\n* 如何提交（check in）和检出（check out）代码\n* 合并和分支你的源代码\n\n### 本章代码下载：\n\
  \n本章所涉及的 [wrox.com](http://wrox.com) 代码下载可以在 [www.wiley.com/go/beginningaspnetforvisualstudio](http://www.wiley.com/go/beginningaspnetforvisualstudio)\
  \ 的“Download Code”选项卡找到。代码位于第 18 章下载中，并根据章节中的名称单独命名。\n\n版本控制的命名非常贴切，因为它是一个控制构成你应用程序的源代码的过程。版本控制不是关于你应该如何命名文件或目录，而是关于你如何对代码进行备份和版本管理。这种过程被称为*开发运维*（或\
  \ *DevOps*），围绕它有一整门学科，但本章仅涉及这些在创建和维护应用程序过程中直接影响开发者的方面。\n\n如果你是要构建一个业务应用程序，而不是像这里这样构建一个学习应用程序，你将会从一开始就计划使用版本控制，特别是当有多个开发人员参与项目时。\n\
  \n## 介绍 Team Foundation Services\n\nTeam Foundation Services (TFS) 是微软的版本控制产品。它可以作为服务器产品用于本地部署，也可以作为名为\
  \ Visual Studio Online 的云端版本可用。这两个版本的应用程序都可用于跨多个用户管理多个项目。TFS 是一个完整的应用程序生命周期管理（ALM）系统，因为它可以管理需求、任务和缺陷的跟踪，并处理许多帮助团队成员相互交互的其他功能。该系统非常强大，但你将使用的这套功能中的版本控制。TFS\
  \ 的其他方面比你需要的要丰富得多，需要另一本书才能描述！\n\n\n\n\n\n\n源代码控制的主要功能之一是它充当了源代码的版本管理系统。你可以将其认为是备份应用程序所有源代码文件的一种方式。更重要的是，它让你能够访问文件的每一个版本。正如你可能已经注意到的，每当你编译并运行\
  \ Web 应用程序时，`Visual Studio` 都会自动保存你可能更改过的任何文件。这意味着每当你构建代码时，你之前的工作都会被覆盖。一旦发生这种情况，除非你手动将其复制到其他地方，否则你将无法获得代码之前的版本。\n\
  \n源代码控制最显而易见的原因是，只要你采取了让系统记录这些更改的操作，就可以访问源代码之前的版本。然而，版本控制并不是使用源码控制系统的唯一理由。想象一下在团队中工作。当你的某位同事正在修复应用程序某个部分的缺陷，而你正在处理另一个区域时，你会很快发现源码控制的另一个理由：允许不同用户之间共享代码。也许你也可以通过共享网络文件夹实现相同的操作，但这并没有提供版本管理功能。\n\
  \n`TFS` 这样的系统提供了几种不同的优势。首先正如我们所讨论的，它是你代码的代码库或版本控制系统。其次是为你的代码标记标签的能力，为特定的版本命名一个有意义的名字——例如，类似“Production\
  \ 1.0 – Release”的名字，而不是使用系统模糊的默认版本名（类似于“0.9.754”）。第三个强大的优势是分支（branching），它描述了源码控制系统创建代码完整副本的能力，让你能够并行对两个版本进行工作。\n\
  \n分支，尤其在企业环境中，非常重要。考虑一个已经开发并发布的应用程序。通常，今后对该应用程序需要完成两种类型的工作：对发布版本进行维护和错误修复，以及更大、更重大的更改（例如新功能）。分支允许你同时处理这两种类型的工作。包含发布版本的代码分支可以进行支持必要的更改的工作，但不会受到正在较大的更改集上进行的工作的影响。\n\
  \n这使得并行工作成为可能——对应用程序进行小范围增量修复（例如版本 `1.1`），以及更大、更长期的更改（可能被称为版本 `2.0`）。只要将较较小的增量修复合并回包含较大更改的分支，版本\
  \ `2.0` 分支将包含对应用程序的两组更改，而版本 `1.1` 分支仅包含短期更改，并且完全不受在版本 `2.0` 分支上并行进行的工作的影响。你将在本章稍后读到更多关于分支和合并的内容。\n\
  \n### 设置 Visual Studio Online 账户\n\n你将使用 `Visual Studio Online` 作为你的源代码仓库。它提供免费版本，每个账户支持多五个用户。注册需要一个\
  \ `Microsoft Live account`。如果你没有 `Microsoft Live account`，可以在 [`www.live.com`](http://www.live.com)\
  \ 注册一个。\n\n如果你已经有一个 `Microsoft Live account`，或者在创建一个之后，请登录 [`www.visualstudio.com`](http://www.visualstudio.com)\
  \ 上的 `Visual Studio Online`。登录时，你会收到一个通知，告知“你不是任何账户的所有者”，如 图 18.1 所示。\n\n![账户对话框截图，所有者标签页下显示文本“看起来你不是任何账户的所有者”。下方是现在创建免费账户的链接。](img/c18f001.jpg)\n\
  \n**图 18.1**](#c18.xhtml_c18-fig-anc-0001 Visual Studio Online 初始登录消息\n\n点击“现在创建免费账户”链接将打开如\
  \ 图 18.2 所示的创建 Visual Studio Online 对话框。在这里，你需要确定并输入你想要用于访问在线账户的 URL。该 URL 将在稍后你配置\
  \ `Visual Studio` 访问你的仓库时使用。你选择的 URL 可能已经被其他用户占用。在这种情况下，请选择另一个名称，直到找到一个未被使用的名称为止。\n\
  \n![创建 Visual Studio Online 账户的截图，带有创建账户按钮。](img/c18f002.jpg)\n\n**图 18.2**](#c18.xhtml_c18-fig-anc-0002)\
  \ 创建 Visual Studio Online 账户\n\n创建账户后会打开一个页面，你可以在其中创建你的第一个项目，如 图 18.3 所示。将你的项目认为是你将用于存储文件的第一个目录。你选择的项目名称应该让用户对该项目中包含的内容有一个大致的了解。虽然这在你的个人工作中可能不那么关键，但在处理专业项目时非常重要，因为其他开发者和团队成员应该能够快速找到他们所需的文件以完成工作。选择有意义的项目名称是一个值得采用的良好实践。\n\
  \n![创建你的第一个项目的对话框截图，底部有选项和“创建项目”按钮。Name 处填写了 SampleApplication，版本控制选项勾选了 Team Foundation\
  \ Version Control。](img/c18f003.jpg)\n\n**图 18.3**](#c18.xhtml_c18-fig-anc-0003)\
  \ 在 Visual Online 中创建项目\n\n此对话框中的其他选项包括你想使用的版本控制类型和流程模板。有两个版本控制选项：`Team Foundation\
  \ Version Control` 和 `Git`。前者是一种集中式架构，所有文件都保存在 Azure 服务器上。后者是更分布式的，版本管理在你机器上，包含所有文件的副本。对于本次练习，请选择\
  \ `Team Foundation Version Control`。\n\n流程模板允许你配置开发期间想要使用的项目管理流程。`TFS` 提供了管理整个软件开发生命周期的能力。它可以通过其创建和管理用户故事（定义业务系统必须提供的功能的方式）的能力来管理系统可能的所有需求。`TFS`\
  \ 还支持任务的创建和分配；完成这些软件需求所需的实际工作，并跟踪在质量保证和测试过程中发现的任何缺陷，以及提供显示过程中任何时候项目状态的报告。`TFS` 支持多种类型的项目管理流程；每个流程都有一个你可以选择的流程模板。由于你不会使用上述任何功能，因此在这里选择什么并不重要。\n\
  \n点击“创建项目”按钮。当你看到确认屏幕时，你已经成功设置了你的 `Visual Studio Online TFS` 仓库。下一步是让你的本地 `Visual\
  \ Studio` 连接到仓库。每当你安装新的 `Visual Studio`，或者每当你使用的 `TFS` 服务器发生变化时，你都需要执行此练习。\n\n###\
  \ 代码签入与签出\n\n\n\n\n在服务器与本地之间传输源代码副本是通过“提交（checking in）”过程实现的，该过程将代码从你的机器复制到服务器；“获取（getting）”将文件从服务器复制到你的本地机器；“检出（checking\
  \ out）”则是通知服务器你将修改一个或多个文件的过程。虽然从工作流的角度来看，作为独立开发人员时检出并不是必要的，但在团队协作时它非常有用，因为可以让你的同事知道你正在更改哪些文件。这很重要，因为它可以帮助识别潜在的冲突，即你的更改可能会影响同事的更改。`Visual\
  \ Studio` 也是通过此确定它需要跟踪哪些文件以进行提交。\n\n一旦你完成了版本控制服务器与本地机器之间的链接，你将处于一种状态：你仍有一些文件没有复制到服务器上（那些带有绿色加号的文件）。要进行首次提交，请转到\
  \ `Team Explorer` 中的 `Pending Changes`（待处理更改）视图（参见图 18.13）。\n\n![Team Explorer 截图\
  \ - Pending Charges 窗口，在 Check In 选项下有多个章节。](img/c18f013.jpg)\n\n图 18.13 提交前的待处理更改\n\
  \n如你所示，此视图包含几个章节。第一个章节 `Comment`（注释）允许你对与这些更改文件合并的更改提供有用信息。即使你是项目中唯一的开发人员，这也很重要，因为你以后可能需要这些信息。也许你作为此次提交的一部分所做的更改影响了另一组功能。有一个实用的注释可以让你在有需要时轻松地找到这组被称为\
  \ `changeset`（更改集）的更改。`changeset` 是一组应该被视为不可分割整体的更改（即原子包）；它是存储库中两个连续版本之间的差异列表。\n\
  \n`Related Work Items`（相关工作项）部分对你在这里进行的操作没有实际影响。它是将提交链接到任务、用户故事或缺陷的方法。\n\n最后两个章节是\
  \ `Included Changes`（包含的更改）和 `Excluded Changes`（排除的更改）（未在图 18.13 中显示）。它们代表了项目本地副本中所有从\
  \ `TFS` 系统检出的文件。这些是系统识别为已更改的文件。`Included` 和 `Excluded` 章节中文件之间的区别在于，给定文件是否会成为本次提交的一部分。你并不总是想要提交每个已更改的文件，例如包含本地数据库连接字符串的配置文件，因此在\
  \ `Included` 和 `Excluded` 更改之间移动文件可以让你对每个文件进行控制。\n\n当你准备好提交更改时，点击 `Check In` 按钮。你将得到一个确认对话框，询问你是否希望继续提交过程。点击\
  \ `Yes` 开始文件复制过程。上传完成后，你将收到一条确认消息，显示 `changeset` 已成功提交，并且你的 `Team Explorer` 窗口中的\
  \ `Included Files` 章节将为空。\n\n### 撤销更改\n\n在版本控制系统中工作工作时，你可能会遇到需要使用特殊版本控制功能来解决的问题。一个例子是当你正在对应用程序的一组更改进行操作，但进行到了你只想重新开始的程度。`TFS`\
  \ 和 `Visual Studio` 提供了撤销更改的能力。这意味着你可以选择一个或多个文件，并将它们恢复到你之前从服务器下载的版本。它不会将该文件的最新版本复制到你的本地目录，而是找到编辑之前检出的文件特定版本。这是一种回到“以前的样子”的简单方法。然而，为了使这种方法最有用，一旦你认为代码是正确的并按预期运行，你就必须定期进行提交。\n\
  \n对更改执行撤销非常简单。在 `Team Explorer` – `Pending Changes` 窗口中，选择你想要撤销的文件或文件，并点击右键显示如图\
  \ 18.14 所示的上下文菜单。\n\n![Team Explorer 截图 - Pending Charges 窗口，带有弹出菜单。Undo 选项位于菜单底部。](img/c18f014.jpg)\n\
  \n图 18.14 Team Explorer 上下文菜单\n\n弹出菜单底部的选项是 `Undo`。选择此选项将打开图 18.15 所示的确认窗口。\n\n\
  ![带有底部 Undo Changes 和 Cancel 按钮的 Undo Pending Changes 对话框截图。](img/c18f015.jpg)\n\
  \n图 18.15 Undo Pending Changes 确认\n\n点击 `Undo Changes` 按钮弹出另一个确认对话框（参见图 18.16）。`Visual\
  \ Studio` 想要非常非常确定你想要撤销更改，因为没有办法可以撤销此操作；它不会保留你文件的多个版本。\n\n![带有底部 Yes, Yes to All,\
  \ No to All 和 Cancel 按钮的 Confirm Checkout 对话框截图。](img/c18f016.jpg)\n\n图 18.16 撤销更改前的最终对话框\n\
  \n请注意，一旦你撤销了更改，`TFS` 就不再有这些更改的记录，因此请确保你想执行此操作。完成撤销过程后，你将拥有更改前的相同文件版本。\n\n### 搁存集\
  \ (Shelvesets)\n\n虽然对一组更改运行 `Undo` 会完全恢复你对应用程序所的工作，但 `TFS` 提供了一种存储更改而不覆盖当前代码版本的方法。被称为\
  \ `shelveset`（搁存集），你可以将这种独立集合视为未提交到基线而是放在单独“柜子”中的更改。这让你能够利用版本控制系统的备份功能而不影响应用程序。另一个优点是其他开发人员可以找到并下载该搁存集。这让你可以在不覆盖所有人代码的情况下与其他同事共享代码。当两个开发人员处理可能影响代码库的大功能时，这非常有用。\n\
  \n创建搁存集与提交更改相似。在 `Pending Changes` 对话框顶部有一个 `Shelve` 链接，如图 18.17 所示。选择此链接将展开一个面板，可以在其中为搁存集命名。\n\
  \n![Team Explorer 截图 - Pending Changes 窗口，选择了 Shelve 链接。文本框中的临时文本 Enter a ShelveSet\
  \ name <Required> 以及勾选的 Preserve pending changes locally 复选框](img/c18f017.jpg)\n\
  \n图 18.17 创建搁存集\n\n你还可以选择是否希望“保留本地待处理更改（Preserve pending changes locally）”。如果你勾选此选择框，本地工作区不会发生。取消勾选此框会将\
  \ `Included Changes` 文件作为搁存集保存到服务器，然后对这些文件执行 `undo`。在之前描述的示例中，即你对一组更改工作了一段时间并决定重新开始，这将是一个安全保存更改的完美方法，以便在你再次前进时可能需要参考它们。\n\
  \n#### 从服务器获取特定版本\n\n\n\n\n有时你可能需要获取源代码的以前版本。也许你为了某项更改花费了几个小时的无用功（（钻了牛角尖），而现在只想重新开始。然而，在那个期间你进行了一些提交（check-ins），因此撤销更改将无法得到你想要的结果。相反，你可以回到代码的某个版本——也许是上周的最后一次提交。你可以通过获取代码特定版本来实现这一点。\n\
  \n实现此点的一种方法是通过 `Solution Explorer`（解决方案管理器）。右键点击解决方案将弹出一个右键菜单，其中包含 `Source Control`（源代码控制）选项。选择此菜单项将显示如图\
  \ 18.18 所示的右键菜单。\n\n![解决方案管理器中源代码上下文菜单的截图。](img/c18f018.jpg)\n\n`图 18.18` 位于解决方案管理器的源代码菜单\n\
  \n从此子菜单中，你可以选择 `Get Specific Version`（获取特定版本）。这将显示如图 18.19 所示的 `Get`（获取）对话框。\n\n\
  ![Get 对话框的截图，在 Type of Version 部分下有一个下拉选项菜单。Get 和 Cancel 按钮位于底部。](img/c18f019.jpg)\n\
  \n`图 18.19` 用于检索特定版本的 Get 对话框\n\n这将让你能够确定想要在本地开发工作区中回到哪一个版本。你可以回到特定的更改集（changeset）、日期或特定的标签（label）。选择合适的选项并继续该过程。完成后，你将下载到不同版本的源代码。\n\
  \n在还原到以前版本之前，请撤销任何可能已待处理的更改。否则，`Visual Studio` 可能会识别从服务器下载的文件与本地机器当前文件之间的冲突。系统将尝试合并更改，但可能无法做到。如果发生这种情况，你将得到一个与图\
  \ 18.20 所示相似的对话框。\n\n![Resolve Conflicts 窗口的截图，文本为 Path Filter Applied - 2 Total\
  \ Conflicts。下方有 Take Server Version 和 Keep Local Version 选项。](img/c18f020.jpg)\n\
  \n`图 18.20` 发现冲突\n\n你可以根据需要选择采用服务器版本或保留你的本地版本。在其他情况下，你可能会被要求合并更改。这通常发生在 `Visual\
  \ Studio` 无法确定如何进行合并时，并且需要人工干预来确定一个或多个文件应该包含什么内容。\n\n如果你有一个保存的搁架（shelveset），过程将略有不同。图\
  \ 18.21 显示了你需要如何通过菜单结构进行操作。\n\n![RentMyWrox - Microsoft Visual Studio 项目窗口的截图。在\
  \ File 菜单中选择了 Source Control，并选择了 Find 选项。](img/c18f021.jpg)\n\n`图 18.21` 查找搁架\n\
  \n选择 `Find Shelvesets` 将列出你已提交的搁架列表。点击其中一个显示其内容，如图 18.22 所示。\n\n![ShelveSet 详情窗口的截图，显示了\
  \ Restore work items、提交注释并勾选了 Preserve Shelveset on the Server 选项。Unshelve 和 Cancel\
  \ 按钮位于下方。](img/c18f022.jpg)\n\n`图 18.22` 撤销搁架\n\n通过选择恢复工作项并点击 `Unshelve` 按钮，`Changes\
  \ to Unshelve` 部分的文件将复制回你的本地工作区。\n\n### 在解决方案管理器中查看更改的项目\n\n你可以随时通过进入 `Team Explorer`（团队资源管理器）窗口中的\
  \ `Pending Changes`（待处理更改）来获取更改文件列表。你可以在 `Solution Explorer` 中获取每个文件状态的概览。图 18.23\
  \ 显示了一个示例。以下列表描述了各种图标的含义。注意，书中的图像不会显示颜色，但描述包含了颜色引用，以便在你自己的电脑上操作时提供帮助：\n\n![Solutions\
  \ Explorer 中列出的三个文件图标的截图：About.aspx、AboutUs.aspx 和 Bundle.config 文件。](img/c18f023.jpg)\n\
  \n`图 18.23` 在解决方案管理器中可视化文件状态\n\n*   `About.aspx` 文件旁边有一个红色勾选。这表示该文件已从 `TFS` 签出（checked\
  \ out），要么是因为你编辑了文件，要么是你手动签出了该文件。\n*   `AboutUs.aspx` 文件旁边有一个绿色加号，表示该文件已添加到本地源代码控制中，但尚未提交到服务器。\n\
  *   最后，`Bundle.config` 文件旁边有一个蓝色锁图标。\n\n### 查看历史并对比\n\n当你执行日常工作时，可能需要查看哪些发生了更改。在\
  \ `Solution Explorer` 中选择一个文件并右键点击。选择 `Source Control > View History`。这将打开一个显示列表的窗口，如图\
  \ 18.24 所示。\n\n![显示项目的窗口。](img/c18f024.jpg)\n\n`图 18.24` 文件的历史\n\n要查看任意版本之间的更改，只需突出两个版本，右键点击并选择\
  \ `Compare`。这将弹出一个与图 18.25 所示的屏幕。\n\n![History - About.aspx 文件和 Diff- About.aspx\
  \ 文件的截图，文件中的行代码分别用红色高亮。底部图例说明红色为删除，绿色为添加。](img/c18f025.jpg)\n\n`图 18.25`对比文件\n\n\
  这显示了一个简单的对比界面。两个版本的文件并排显示。红色高亮的文本已被删除，而绿色高亮的文本已添加。屏幕右侧的区域提供了更改位置的高级视图。这是一个简单的文件，但更大、更复杂的页面可能包含许多需要审查的红色绿色区域。\n\
  \n### 标记\n\n标记是为代码版本赋予其实用名称的能力。它不会更改你机器或服务器上的源代码版本，但会赋予它一个易于人类阅读的名称。可以在 `Source\
  \ Control Explorer` 中通过右键点击要标记的目录并选择 `Advanced > Apply Label` 来创建并应用标签。这将弹出与图 18.26\
  \ 所示的 `New Label` 对话框。\n\n![New Label 对话框的截图，Name 填充为 Production Release 1.1，Comment\
  \ 和 Path 已填充，且 Version 已设置。Create 和 Cancel 按钮位于底部。](img/c18f026.jpg)\n\n`图 18.26`\
  \ 创建并应用标签\n\n创建标签后，你可以通过该标签引用此特定版本的代码。每当你寻找特定版本时，你始终具有通过标签进行搜索的能力。通常，每当达到里程碑事件（如发布）时，都会添加标签。\n\
  \n### 与团队交互\n\n\n\n\n在任何专业开发者生涯中，团队协作都是不可避免的。与一群聪明人共同开发大型应用固然有益，但也会带来一系列潜在问题——比如多位开发者可能意外覆盖彼此的工作成果。`TFS`\
  \ 会尽力协助规避这类情况发生，不过你还可以采取其他措施确保不给团队造成负面影响：\n\n1.  在签入更改前始终获取最新版本代码、完成编译并验证应用程序运行正常。\n\
  2.  如果需要将服务器上的新版本与你修改过的文件合并，务必不要破坏他人的改动。\n3.  除非已与团队提前约定好条件（如临时中断提交），否则只签入可通过编译并能够运行的代码。\n\
  4.  保证你的签入注释准确且简洁明了。其他人可能需要查阅这些注释以理解变更内容及其对自身工作的影响。\n5.  若要进行重大修改请锁定文件权限防止他人在此期间错误地阻断你的工作；需注意必须严格控制锁定时长以免有人像度假归来后发现团队成员因离职前的误操作陷入混乱。\n\
