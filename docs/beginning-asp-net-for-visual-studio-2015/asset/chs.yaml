  \ `<p>` 或其类被设置为“intro”的元素。\n\n2. 要拉伸元素的“框框”，你会使用 `padding` 属性。`padding` 属性扩展了元素的可见框体，而\
  \ `margin` 属性将可见框体与相邻元素推开。例如，如果你设置了一个包含某些文本的元素的背景颜色，`padding` 将把背景颜色延伸到文本之外，扩大颜色区域。使用\
  \ `margin` 将移动颜色框体而不改变其大小。\n\n3. 为了让网页内容访问外部样式表中所包含的样式，你需要在网页和外部样式表之间建立链接。该链接通过放置在网页头部的\
