  \ | `FileBytes` — 控件指定的文件的字节数组 `FileContent` — 获取指向要上传文件的 `Stream` 对象 `FileName`\
  \ — 客户端上要上传的文件名 `HasFile` — 确定控件是否包含文件 `HasFiles` — 确定控件是否包含多个文件 `OpenFile` — 获取用于打开文件的流\
  \ |\n| `HyperLink` | `ImageHeight` — 使用图像时设置图像的高度 `ImageUrl` — 使用图像时设置图像的 URL `ImageWidth`\
  \ — 使用图像时设置图像的宽度 `NavigateUrl` — 点击时链接的 URL |\n| `Image` | `AlternateText` — 设置显示的备用文本\
  \ `GenerateEmptyAlternateText` — 指明是否为空字符串生成备用文本 `ImageUrl` — 提供在控件中显示的图像路径 |\n\
  | `TextBox` | `MaxLength` — 允许的最大字符数 `TextMode` — 控件的行为模式，例如多行、密码等 `TextChanged`\
