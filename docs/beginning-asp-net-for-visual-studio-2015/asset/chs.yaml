  \n# 第 19 章：部署你的网站\n\n## 总结\n本章尝试将整本书的信息浓缩为一些实用的观点和建议，帮助你维护 ASP.NET 应用程序的备份和版本控制。你已经使用了\
  \ `Visual Studio Online`（`Team Foundation Services` (`TFS`) 的一个版本）作为源代码库。\n\n`Visual\
  \ Studio Online` 和 `TFS` 是完整的应用程序生命周期管理解决方案，因为它们提供的功能不仅限于源码库。`TFS` 还支持需求、任务和缺陷的收集与捕获，并且还拥有强大的报告基础设施，可以支持许多不同的项目管理方法论。\n\
  \n在仅处理源码库功能时，你可以执行代码提交（check in）、获取代码（get）和检出代码（check out）。将代码从本地目录复制到服务器即为提交。一组更改的文件被组合在一个\
  \ `changeset`（更改集）中，然后该 `changeset` 被合并到服务器。合并后，整个目录将获得一个新的版本号，该版本代表了特定时间点每个文件的状态。每次提交都会在服务器上创建一个新版本。\n\
  \n获取代码是从服务器复制文件的过程。最常见的行为是 `Get Latest`（获取最新版本），即你向本地系统复制自上次执行 `Get` 以来所有更改过的文件，但你也可以根据需要获取文件的特定版本。\n\
  \n检出（Checking out）是通知服务器你将对某个文件进行更改的方法。默认情况下，每当你做出更改时，`Visual Studio` 都会检出该文件。这很重要，因为这些检出的文件是\
  \ `Visual Studio` 跟踪用于提交的文件。你无法提交未检出的文件。你可以通过几种不同的方式检出文件。第一种方法是在服务器上标记该文件，让其他开发者知道你可能正在进行更改。第二种方法实际上锁定了文件，使其他开发者无法对该文件提交更改。锁定文件时需要小心，因为这可能会影响尝试工作的其他开发者。\n\
  \n团队工作比单独工作需要更多的纪律。你必须负责确保你的更改不会覆盖或破坏其他开发者所做的更改。你还必须尽力确保应用程序处于可工作且功能正常的状态。\n\n源码控制是开发的关键部分。即使是单兵的开发者也会发现它非常有用，特别是系统的版本控制部分，因为它提供了比简单备份更多的功能。对于任何以开发者身份专业工作的人，理解源码控制的工作原理以及如何与系统交互也是至关重要的。\n\
  \n### 练习\n1. 什么是 `changeset`？它为什么在源码控制中很重要？\n2. 在执行 `checkout`（检出）期间发生了什么？\n3. `TFS`\
  \ 提供了什么功能让开发者确定是谁可能更改了文件？\n\n## 本章你学到了什么\n\n| 术语 |  |\n| :--- | :--- |\n| 分支 (Branching)\
  \ | 在版本控制下复制对象（如源代码文件或目录树），以便修改操作可以在两个版本中并行进行。| |\n| 提交 (Check in) | 将更改的文件放入源码控制并创建源代码的新版本的过程。\
  \ |\n| 检出 (Check out) | 通知源码控制系统某个文件正在被处理的过程。 |\n| 标记 (Labeling) | 为软件版本命名的过程。标记允许根据需要保留并访问完整版本。\
  \ |\n| 合并 (Merging) | 同步两个不同分支的过程。将一个分支中的更改合并到另一个分支，以确保编辑在两个分支中都可用。 |\n| 仓库 (Repository)\
  \ | 源码控制项的在线集合。 |\n| 更改集 (Changeset) | 组成单次提交的文件组。 |\n| TFS | Team Foundation Server，本章中使用的微软源码控制版本。\
  \ |\n| 工作空间 (Workspace) | 本地机器上包含已检出的源码控制文件的区域。 |\n\n## 你在这一章将学到：\n* 如何为你的应用程序做好部署准备工作\n\
  * 使用存储在配置文件中的值\n* 管理多个环境设置\n* `Windows Azure`、`Web Apps` 和 `Azure SQL` 简介\n* 发布你的应用程序\n\
  * 验证部署的重要性\n\n## 本章代码下载：\n本章的 `wrox.com` 代码下载可以在 `Download Code` 选项卡中的 `www.wrox.com/go/beginningaspnetforvisualstudio`\
  \ 找到。代码位于 `chapter 19` 下载中，并根据章节中的名称进行单独命名。\n\n最终，希望你的应用程序能达到其他人也想使用它的程度。做到这一点简单的方法是将其部署到另一个服务器，让其他人可以自己查看。此外，在某个时刻，你将需要应用程序部署到生产环境，以便它可以与公众交互——完成它设计初衷的任务。\n\
  \n从本地开发机移动到远程服务器是一大步。这意味着你必须确保应用程序能够处理多个环境，这些多个环境通常需要不同的配置，包括 `SQL Server` 连接字符串，因此你必须将这些不同的值作为部署策略的一部分进行管理。\n\
  \n这整个过程的一部分是确保你有一个可以部署的远程系统。一旦该系统配置得当，你的应用程序就可以被部署或发布。\n\n## 准备你的网站以进行部署\n构建应用程序的工作是困难的，但将其部署到不同的系统并不一定是最简单的部分。当你同一台机器上构建并运行应用程序时，情况通常比移动到不同机器时要好得多。许多问题可能会出现并导致应用程序在部署后无法运行。这些问题可能源于不同的原因，例如安装的软件不同导致服务器缺少依赖，或者因为运行应用程序没有权限而无法写入文件。\n\
  \n本节涵盖了你必须处理的所有细节，以确保你的应用程序准备好在不同机器上运行并连接到不同环境中的机器。你还将学习如何通过移除硬编码设置来增加应用程序的灵活性，当业务发生变化时，这些设置可能需要更改，将其转换为配置项。\n\
  \n### 避免硬编码设置\n硬编码设置是在代码中定义的、在应用程序生命周期内可能会发生更改的值。不幸的是，由于该值是在代码中定义的，你必须部署应用程序的新版本来更改该值。你在示例应用程序中包含了这样一个示例，如下所示，其中营业时间是硬编码的：\n\
  \n\n\n\n\n```sharp\npublic ActionResult Index()\n{\n    StoreOpen results = new\
  \ StoreOpen();\n    DateTime now = DateTime.Now;\n    if (now.DayOfWeek == DayOfWeek.Sunday\n\
  \            || (now.DayOfWeek == DayOfWeek.Saturday\n                    && now.TimeOfDay\
  \ > new TimeSpan(18,0,0)))\n    {\n        results.IsStoreOpenNow = false;\n   \
  \     results.Message = \"We open Monday at 9:00 am\";\n    }\n    else if (now.TimeOfDay\
  \ >= new TimeSpan(9,0,0)\n            && now.TimeOfDay <= new TimeSpan(18,0,0))\n\
  \    {\n        results.IsStoreOpenNow = true;\n        TimeSpan difference = new\
  \ TimeSpan(18,0,0) - now.TimeOfDay;\n        results.Message = string.Format(\n\
  \                 \"We close in {0} hours and {1} minutes\",\n                 \
  \ difference.Hours, difference.Minutes);\n    }\n    else if (now.TimeOfDay <= new\
  \ TimeSpan(9,0,0))\n    {\n        results.IsStoreOpenNow = false;\n        results.Message\
  \ = \"We will open at 9:00 am\";\n    }\n    else\n    {\n        results.IsStoreOpenNow\
  \ = false;\n        results.Message = \"We will open tomorrow at 9:00 am\";\n  \
  \  }\n    return Json(results, JsonRequestBehavior.AllowGet);\n}\n```\n\n幸运的是，ASP.NET\
  \ 有一种方法通过使用 `Web.config` 文件来管理这些内容。你已经在 `Web.config` 文件中进行了一些工作，例如管理数据库连接字符串以及向文件中添加其他配置设置。`Web.config`\
  \ 文件还可以维护你可以在应用程序内部使用的信息。\n\n### Web.config 文件\n\n在整个项目中，你已经多次进出 `Web.config` 文件。你没有花费太多时间的区域之一是\
  \ `appSettings` 元素。`appSettings` 元素是 `configuration` 元素的子元素，后者是文件中的基础元素。`appSettings`\
  \ 元素提供了对一组信息的程序化访问，如下所示的代码段，其中值被赋予了唯一的键：\n\n```xml\n<appSettings>\n    <add key=\"\
  OpenTime\" value=\"9\"/>\n</appSettings>\n```\n\n你有几种不同的方法可以访问这些信息：通过代码以及一种被称为表达式语法（expression\
  \ syntax）的方法。\n\n### 表达式语法\n\n表达式语法允许你将控件属性直接绑定到配置文件中的值。当你处理 ASP.NET Web Forms 服务器控件工作时，你使用以下格式从\
  \ `Web.config` 文件中绑定值：\n\n```xml\n<%$ AppSettings:KeyName %>\n```\n\n这意味着，例如，如果你想添加一个显示某些简短法律术语的页脚控件，你首先需要使用以下代码将信息添加到你的\
  \ `Web.config` 文件中：\n\n```xml\n<add key=\"FooterDisclaimer\"\n        value=\"Copyright\
  \ RentMyWrox, 2015, All Rights Reserved\"/>\n```\n\n然后你可以在控件中引用此值：\n\n```xml\n<asp:TextBox\
  \ ID=\"Disclaimer\" runat=\"server\"\n        Text=\"<%$AppSettings:FooterDisclaimer\
  \ %>\"/>\n```\n\n在处理 ASP.NET Web Forms 工作时，在将值添加到 `Web.config` 文件之后，你也可以直接将控件链接到配置值。你可以在创建包含配置值的服务器控件时，通过使用表达式编辑器（Expression\
  \ Editor）来实现这一点。\n\n要打开表达式编辑器对话框，选择你想要添加配置值的服务器控件并转到 `Properties`（属性）窗口。寻找名为 `Data`\
  \ 的主要部分。它应该包含一个 `Expressions` 子部分，如图 19.1 所示。\n\n![属性窗口的截图，Data 部分已展开，下方是 Expressions\
  \ 子部分。](img/c19f001.jpg)\n\n图 19.1 属性窗口\n\n如果你没有看到 Expressions 部分，你可能需要确保你已拆分视图（Split）或设计视图（Design）模式下选择了该控件；在\
  \ Source（源代码）窗口中选择控件时，它并不总是可用的。一旦 Expressions 部分可用，你就可以点击右侧的省略号按钮打开表达式对话框（参见图 19.2）。\n\
  \n![Unnamed3 表达式对话框的截图，在 Bindable Properties（可绑定属性）窗格下选中了 Text。](img/c19f002.jpg)\n\
  \n图 19.2 表达式对话框\n\n在 Bindable Properties 窗格中选择 Text 并在 Expressions Type 下拉菜单中选择\
  \ AppSettings（如图 19.3 所示），将弹出一个包含所有已添加到 `appSettings` 中的键的下拉列表。\n\n![Unnamed3 表达式对话框的截图，在\
  \ Expressions Type 下拉菜单中选中了 AppSettings。](img/c19f003.jpg)\n\n图 19.3 表达式对话框中的 AppSettings\n\
  \n选择这些值中的一个将填充该属性，如早前的示例所示。\n\n### WebConfigurationManager 类\n\n表达式编辑器只有在你已将值添加到\
  \ `Web.config` 文件时才起作用。你可以在创建包含配置值的服务器控件时，通过使用表达式编辑器来实现这一点。\n\n使用此类非常简单，可以在此处使用：\n\
  \n```csharp\nWebConfigurationManager.AppSettings.Get(\"TestValue\")\n```\n\n此方法调用返回字符串，因此如果信息实际上是不同的类型，则你需要根据需要对其进行强制转换或转换。\n\
  \n\n\n\n\nSQL Database 服务基本上是您托管在云端的 SQL Server 实例。与本地 SQL Server 相比，基于 Azure 的系统具有更高的性能和可靠性因子；而且像\
  \ App Services 一样，你可以根据需要扩展或缩小资源。\n\nMicrosoft Azure 提供了 30 天免费试用，你将在部署时使用该试用版。请注意使用\
  \ Microsoft Azure 的一些注意事项：\n\n*   根据当地或国际协议，并非所有地区和国家都能访问 Azure 服务。\n*   注册 Azure\
  \ 时需要你输入信用卡号。在 30 天期结束后，除非你授权他们，否则他们不会收取费用，但如果不提供信用卡号，你将无法设置账户。\n\n如果你无法访问或注册 Azure\
  \ 服务，请随时跳过下一步，直接发布你的网站。在执行发布步骤时，系统还会提供基于文件的说明。\n\n现在，你已经有了一个可以部署应用程序的新系统，下一步将引导你完成发布过程。\n\
  \n## 发布你的网站\n\n你通过将信息放入配置文件中，已经设置了应用程序支持多个环境。你还设置了要发布网站的目标系统。下一步是发布网站，这将在下面的“尝试”（Try\
  \ It Out）中进行演示。\n\n使用 Visual Studio 中的发布过程部署应用程序非常简单，即使是第一次需要确保一切都配置正确时也是如此。此后，发布变得更加简单，只需点击几次鼠标，因为所有信息已经收集完毕。\n\
  \n你可能已经注意到发布过程中的某个特定部分不对：连接到数据库。你有一个新的数据库，但你还没有采取任何操作将这些特定配置添加到已部署的应用程序中。Visual\
  \ Studio 在发布过程中提供了此功能支持，被称为 `Web.config transformations`（转换）。\n\n### 介绍 Web.config\
  \ 转换\n\n你可能没有注意到 `Web.config` 文件的一个点，就是它旁边有一个箭头，表示它可以展开。这样做会显示有另外两个可用文件：`Web.Debug.config`\
  \ 和 `Web.Release.config`（参见图 19.28）。\n\n![Web.config 标签页展开后多个配置文件的截图。](img/c19f028.jpg)\n\
  \n图 19.28 多个配置文件\n\n这些额外文件非常重要，因为它们是管理特定环境特定信息的文件。在这种情况下，当前定义了两个：Release 和 Debug。当你本地运行运行时，你运行在\
  \ Debug 模式下，因此你会使用该文件版本中的设置。当你将应用程序发布到服务器时，你是以 Release 模式发布的，这意味着 Release 版本的配置将被复制到服务器上。\n\
  \n你可以做的不仅仅是简单地更改不同环境的值，因为配置文件在部署时会通过一个名为 `transformation`（转换）的过程。`Web.config` 文件会应用\
  \ `Web.Release.config` 文件，就像模板一样，此模板应用的结果将被复制到服务器上。这种转换可以完成许多事情。它可以管理 `appSettings`\
  \ 和 `connectionString` 元素中不同配置项的值的更改，还可以更改整个配置文件不同元素中的其他属性。\n\n如果你将应用程序发布到本地目录，就可以看到此处的示例。你一直在处理的\
  \ `Web.config` 文件包含以下元素：\n\n```\n<compilation debug=\"true\" targetFramework=\"\
  4.5\"/>\n```\n\n但是，如果你查看部署到你本地目录的 `Web.config` 文件，你会发现该元素变为了：\n\n```\n<compilation\
  \ targetFramework=\"4.5\"/>\n```\n\n这意味着该特定元素被转换了。\n\n转换规则配置在不同版本的 `Web.config`\
  \ 文件中。在此例中，如果你查看 `Web.Release.config` 文件，你将看到以下代码（为了简洁已删除了注释）：\n\n```xml\n<configuration\
  \ xmlns:xdt=\"http://schemas.microsoft.com/XML-Document-Transform\">\n  <system.web>\n\
  \    <compilation xdt:Transform=\"RemoveAttributes(debug)\"/>\n  </system.web>\n\
  </configuration>\n```\n\n与基础 `Web.config` 相比，此页面中发生了两件事。第一个是 `xmlns:xdt=''`，它将 `xdt`\
  \ 前缀定义为转换属性。如果你没有这个部分，你将无法在包含的元素中使用使用的 `xdt:Transform` 属性，因为配置系统将显示错误。\n\n此 `xdt:Transform`\
  \ 属性定义了规则。在这里，转换将在 `compilation` 元素上运行，因为该元素是包含此转换属性的。在这种特定情况下，默认设置的转换名为 `RemoveAttributes`，并包含了\
  \ `debug`，即要删除的属性名称。`.Release.config` 文件中的这一行代码确保了 `Web.config` 文件在发布过程中被更改了。\n\n\
  表 19.1 描述了转换过程中提供的其他选项。\n\n| 名称 |  |\n| :--- | :--- |\n| `Locator = Condition(XPath\
  \ expression)` | 指定一个附加到当前元素 XPath 表达式的 XPath 表达式。匹配组合 XPath 表达式的元素将被选中。 |\n| `Locator\
  \ = Match(attribute names)` | 选择具有指定属性值的元素。如果指定了多个属性名称，则选择匹配所有属性的元素。 |\n| `Transform=\"\
  Replace\"` | 使用转换文件中元素替换所选元素。如果选择了多个元素，则替换第一个元素。 |\n| `Transform=\"Insert\"` | 将转换文件中定义的元素作为所选元素的兄弟节点添加。新元素将添加到集合的末尾。\
  \ |\n| `Transform='Remove'` | 移除所选元素。如果选择了多个元素，则移除第一个。 |\n| `Transform='RemoveAttributes(comma-delimited\
  \ list of one more attribute names)'` | 从所选元素中删除指定的属性 |\n| `Transform=\"SetAttributes(comma-delimited\
  \ list of one more attribute names)\"` | 为所选元素设置指定的属性。`Replace` 转换属性替换整个元素，包括其所有属性。相比之下，`SetAttributes`\
  \ 属性允许你在保持元素不变的情况下更改属性。如果你未指定要更改的属性，则元素中存在的所有属性都将被更改。 |\n\n表 19.1 转换项\n\n\n\n\n\n\
  ```xml\n<?xml version=\"1.0\"?>\n<configuration xmlns:xdt=\"http://schemas.microsoft.com/XML-Document-Transform\"\
  >\n  <system.web xdt:Transform=\"Replace\">\n    <customErrors defaultRedirect=\"\
  \ ~/Errors/Error500.aspx \" mode=\"RemoteOnly\">\n      <error statusCode=\"500\"\
  \ redirect=\"~/Errors/Error500.aspx\"/>\n    </customErrors>\n  </system.web>\n\
  </configuration>\n```\n\n这意味着你目前在 `system.web` 节点中拥有的所有内容，例如你的跟踪设置和其他自定义 `customError`\
  \ 页面（例如 `Error404.aspx`），将不会包含在 Release 版本的转换配置文件中。因此，在设置转换规则时必须小心，因为你很容易以一种转换配置文件的方式导致你的应用程序崩溃。\n\
  \n虽然配置文件的 Release 和 Debug 版本会被自动包含，但现在由于你已经创建了发布配置文件（publish profiles），你实际上对转换有了更好的控制，因为你可以为这些配置文件中的每一个设置转换，而不是依赖默认类型来管理这些内容。在许多情况下，你会有不同的系统都在以\
  \ Release 模式运行，例如你的测试系统和生产系统。每个系统都可能有不同的值，需要与其他环境进行不同的配置，无论那些其他环境是 Debug 版本还是 Release\
  \ 版本。\n\n在接下来的“尝试一下”（Try It Out）中，你为应用程序添加了 `Web.config` 转换。\n\n你现在已经配置了应用程序，配置值将根据发布配置文件进行设置。\n\
  \n## 将数据移动到远程服务器\n\n运行应用程序时，你可能注意到的第一件事就是它看起来是空的，如图 19.36 所示。\n\n![在已部署但空的浏览器中渲染\
  \ https://RentMyWroxdemo.azurewebsites.net/ 页面的渲染 HTML 截图。](img/c19f036.jpg)\n\n\
  [图 19.36]](#c19.xhtml_c19-fig-anc-0036) 已部署但空的 Web 服务器\n\n将数据导入数据库有两种不同的方法。第一种是从你的开发数据库复制信息到在线数据库。第二种方法是直接将所有信息添加到在线应用程序中。在接下来的“尝试一下”活动中，你从本地数据库将部分信息复制到\
  \ Azure 数据库。\n\n现在你已经完成了应用程序和数据的复制，很容易认为你已经完成了部署。然而，在部署时你还有一件事必须做，那就是确保应用程序按预期工作。\n\
  \n## 对你的应用程序进行烟雾测试\n\n“烟雾测试”（smoke test）一词源于测试新电子硬件的过程，即当你插入新板卡并打开电源时。如果你看到板卡冒烟，就不需要再做任何测试了；你知道它失败了。遗憾的是，虽然仍然被称为烟雾测试，但在部署失败后，你的应用程序永远不会冒烟。相反，你必须实际进行一些测试以确保你的应用程序按要求运行。\n\
  \n在每次部署后进行这项测试是非常重要的。部署过程中可能会出现很多问题——文件没有正确复制、配置转换没有提供预期的结果、数据库迁移失败，或者更糟糕，应用程序虽然在本地运行，但在服务器上就是无法运行。\n\
  \n确保应用程序在服务器上正确运行的唯一方法是在部署后对其测试。这意味着浏览应用程序并尝试所有主要功能。这通常是一个非常快速的过程——即使是企业级应用程序也可以在几小时内完成烟雾测试。像示例应用程序这样的程序只需要几分钟即可完成烟雾测试。接下来的“尝试一下”将演示一次烟雾测试。\n\
  \n恭喜，你已经完成了网站的部署！\n\n## 展望未来\n\n现在你已经学习了一个入门 ASP.NET 应用程序，你可能好奇了解更多在本项目期间只能简要介绍的各种主题。幸运的是，Wrox\
  \ 有一套完整的书籍，可以更详细地介绍 Web 的这些方面。以下是几本：\n\n* *Beginning Visual C# 2015 Programming*\
