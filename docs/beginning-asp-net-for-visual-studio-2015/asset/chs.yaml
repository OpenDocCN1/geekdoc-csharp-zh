  ### 封面图片\n©amaze646/Shutterstock\n\n# 致谢\n\n`向你，读者致敬`，感谢你决定学习新知识。在从事软件开发时，你会发现自己几乎每天都在学习新事物；这就是这项工作的本质，也是让这项实践变得如此卓有成就感的特质之一。\n\
  \n将 `MVC` 和 `Web Forms` 结合到同一个项目中是简单的：这是新版 `Visual Studio` 的功能之一。然而，将它们都结合在一本入门书中被证明是困难的；要以逻辑的方式提供关于每种方法的足够信息，意味着\
  \ `ASP.NET`、`MVC` 和 `Web Forms` 这两种方法都没有被完全覆盖。虽然没有完全覆盖，但我认为它们的深度已经足够，让你能够根据需要迈出下一步，深入研究其中一种或两种两种技术方法。\n\
  \n我还想借此机会感谢 Ami Frank Sullivan 和 Luann Rouff，他们承担了这项令人讨厌的工作，帮助我将那些痛苦的文字转化为通俗易懂；我从未见过这么多礼貌的方式来表达“这是胡言乱语！”。非常感谢技术评审员\
  \ David Luke，他花费了大量精力来验证各种步骤和代码段，并确保我不偏离正轨。\n\n最后，如果没有我的妻子 Jeanine 的支持，这一切都是不可能实现的，她允许我把太多的空闲时间花在这个项目上。\n\
