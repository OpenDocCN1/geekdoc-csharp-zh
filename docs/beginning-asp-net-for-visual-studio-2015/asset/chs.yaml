  \n\n\n\n由于这些控件的许多功能非常相似，你可能在疑问何时该使用标准控件（standard control）而不是 HTML 控件。使用标准控件会带来一些开销；如果你不需要这些额外功能（例如事件处理），那么使用\
  \ HTML 控件可能会更合理。如果你渲染的 HTML 至关重要，那么与标准控件相比，使用 HTML 控件可以对服务器输出的 HTML 拥有更多控制权。\n\n\
  然而，如果这些点对你的应用程序都不至关重要，你就应该使用标准控件。并不是所有的标准控件都是 HTML 控件的封装，因此对所有内容都使用标准控件可以使用法更加一致，而且对性能的影响微乎其微，只有在包含大量控件的页面中才会被察觉。\n\
  \n### 数据控件\n\n数据控件是那些旨在帮助网页上输入、访问和显示数据的控件。图 5.10 显示了可用的不同数据控件。\n\n![工具箱 Data 选项展开后显示控件列表的截图](img/c05f010.jpg)\n\
  \n图 5.10 工具箱中的数据控件列表\n\n对图中列出的控件进行检查表明，有三大类控件。第一类控件是数据源控件，它们的名称中都包含 `DataSource`，可以帮助你从各种供应商（包括\
  \ SQL Server 和 XML 文件）获取数据。下一组控件是数据显示控件，如图表、网格和列表，它们因为名称中通常包含 `View` 和 `List` 而易于识别；最后一组控件是数据输入表单管理控件，这是使用这些控件的另一种方式，它们的名称中包含\
  \ `View`。第 13 章 和 第 14 章 将详细介绍 ASP.NET Web Forms 中可用的各种数据控件，以及你如何使用它们来显示来自数据库的信息；本文未涵盖这些内容。\n\
  \n### 验证控件\n\n当你开发一个需要请求用户信息的网站时，你需要确保这些信息确实是你所预期的。例如，如果你在询问电子邮件地址，你希望确保它是有效的。同样，如果你需要一个整数作为订单数量，在尝试对该值进行任何操作之前，你希望确保它确实是一个整数。这就是验证控件发挥作用的地方。它们允许你检查其他控件的值，以确保其内容符合预期的数据格式。图\
  \ 5.11 显示了验证控件列表。\n\n![工具箱 Validation 选项展开后显示控件列表的截图](img/c05f011.jpg)\n\n图 5.11\n\
  \n从列表中可以看到，某些控件可以验证必填字段是否已输入、控件内输入的值是否在指定范围内，或者一个控件中的值是否与另一个控件的值相同，以及其他几种控件。这些控件的巧妙之处之一是验证会在客户端和服务器端同时进行。如果出现问题，在信息发送到服务器之前就会通知用户。\n\
  \n你将在 第 10 章中学习一些验证器示例，因此本章不会花时间介绍这些控件。\n\n### 导航控件\n\n在浏览网站时，你可以注意到许多常见功能。其中之一是带你进入网站不同区域的菜单系统。这些不同区域的典型名称包括“关于我们”、“支持”和“首页”。这些通常是页面顶部或侧边可点击的单词（或链接）。许多网站可能还有站点地图（Site\
  \ Map），这是一个提供整个网站视觉化表示的页面，使用户能够深入查看内容。\n\n这些许多功能都由导航控件支持。这些控件所示在 图 5.12 中，旨在你构建网站的导航结构时为你提供支持。\n\
  \n![工具箱 Navigation 选项展开后显示控件列表的截图](img/c05f012.jpg)\n\n图 5.12\n\n第 8 章“导航”更深入地介绍了这些控件。\n\
  \n### 登录控件\n\n安全是互联网的一个关键方面，因此任何在线开展业务的网站，特别是那些收集姓名、电话号码和电子邮件地址等隐私信息的网站，或接受信用卡或其他在线支付形式的网站，必须确保它们尽可能安全。虽然没有办法可以确保网站完全安全，但遵循最佳实践可以帮助你构建尽可能安全的网站。使用\
  \ ASP.NET Web Forms 登录控件可以帮助你遵循这些最佳实践。\n\n登录控件是种支持用户注册和身份验证的控件，并允许你根据当前用户是否登录来显示特殊内容。图\
  \ 5.13 显示了这些控件的列表。\n\n![工具箱 Login 选项展开后显示控件列表的截图](img/c05f013.jpg)\n\n图 5.13\n\n\
  第 15 章和 第 16 章涵盖了安全和个性化。\n\n### AJAX 扩展\n\nAJAX（或异步 JavaScript 和 XML）是一种架构方法，Web\
  \ 可以向服务器发送数据并从服务器检索数据，而不会干扰现有页面的显示和行为。这些调用在后台发生，因此与传统的 Web Form 提交不同，它们不会阻止用户在浏览器中进行任何工作。AJAX\
  \ 可以需要更新网页的部分或整个网页，这些扩展有助于在 ASP.NET Web 页面中使用 AJAX。这些控件所示在 图 5.14。\n\n![工具箱 AJAX\
  \ 选项展开后显示控件列表的截图](img/c05f014.jpg)\n\n图 5.14\n\n### 其他控件集\n\n工具箱中还列出了其他控件集，本文未进一步介绍。这些控件集是动态数据（Dynamic\
  \ Data）、报告（Reporting）和部件（Web Parts），所示所示 图 5.15。\n\n![工具箱 Dynamic Data、Reporting\
  \ 和 Web Parts 选项展开后显示控件列表的截图](img/c05f015.jpg)\n\n图 5.15\n\n数据控件集作为脚手架，帮助你快速构建针对数据库的数据驱动型网站，并可选地允许你在无需手动构建任何页面的情况下完成此工作。你不会在示例应用程序中使用数据控件。\n\
  \n报告控件是一个报告查看器。它显示报告（ASP.NET 网站中的另一种文件类型），报告可以提供表格、摘要和图形数据分析。创建报告控件所示在 图 5.16。\n\
  \n![添加新建项对话框截图，Reporting 下高亮了 Report Wizard 和 Visual C#](img/c05f016.jpg)\n\n图 5.16\n\
  \n虽然你不会作为示例应用程序的一部分处理报告（以及报告控件），但你应该意识到它是 ASP.NET Web Forms 包含的一项强大技术。报告是作为独立实体的，然后使用报告控件在网页中显示报告的结果。\n\
  \n\n\n\n最后一组可用控件是 ASP.NET Web Parts（Web 部）。Web Parts 允许终端用户直接从浏览器修改网页的内容、外观和行为。当用户修改页面和控件时，可以保存这些设置，以便在未来的浏览器会话中保留用户的个人偏好。这使得开发者能够创建一个完全由用户自定义的站点，用户可以重新排列网站的部分，并添加或删除内容区域。\n\
  \n## ASP.NET 状态引擎\n\n回想 ASP.NET 如何帮助开发者在应用程序中维护状态（State）。状态非常重要，因为它允许你在服务器端确定对页面提交（posts）之间的差异。考虑这种情况：你有一个数据输入页面，其中包含一些标签、文本框和一个提交按钮。你有两次使用这个页面：一次你想创建一个新项目时，另一次你想编辑现有项目时。新项目的管理非常简单；它只需要进行验证并将其持久化到数据库中。然而，当正在编辑对象时，你可能根据更改的内容有不同的考量，因此系统需要理解该字段何时发生了变化。\n\
  \n有两种方法可以判断字段是否发生了变化：调用数据库获取该项目并将其与提交的字段进行对比；或者使用某种状态来帮助你做出此判断。记住，服务器不能仅仅“记住”这些信息；HTTP\
  \ 是一个无状态协议，根据定义它不具备这种能力。相反，ASP.NET 提供了一种将状态信息作为 `ViewState` 的一部分来绕过限制的方法。几乎每个服务器控件都能维护其状态。\n\
  \n## 状态引擎如何工作\n\n简而言之，状态引擎执行以下操作：\n\n*   按键名存储每个控件的值。这看起来会像 `ViewState[\"controlname\"\
  ] = controlvalue`。\n*   通过将当前值与存储的值进行比较，跟踪 `ViewState` 值的初始状态的变化。\n*   将保存的数据进行序列化和反序列化（将对象转换为字符串及反之），并存入客户端的隐藏表单字段中。这允许对非字符串项目（如自定义类型/对象）也进行管理。\n\
  *   在回回传（postback）到服务器时自动恢复 `ViewState` 数据。\n*   自动确保用户输入的信息在适当的控件中重新显示，而不一定是 `ViewState`\
  \ 数据。\n\n以下活动通过提供一些背景示例演示了这一切的含义。\n\n你刚刚完成了一项帮助你理解视图状态（view state）如何工作的活动。接下来的“尝试一下”（Try\
  \ It Out）将帮助你构建示例应用程序所需的屏幕之一。\n\n创建和使用 ASP.NET 服务器控件既快速又简单。你可以轻松地向页面添加一系列控件，在后置代码（code-behind）中对它们进行连接，并在几分钟内验证它们是否正常工作。\n\
  \n## 总结\n\nASP.NET Web Form 服务器控件为 Web 开发人员提供了一套稳健的功能支持。这些控件对许多基于 Web 的用户界面常见部分提供了完全控制，从简单的文本块到用于从\
  \ Web Form 内部数据的文本框。其他控件可以提供用于选择选择日历、文件上传功能和下拉列表选择等；每个控件都满足你在构建网站期间可能产生的需求。\n\n\
  使用服务器控件有两个部分：将它们放入标记（markup）中，以便它们作为返回和渲染的 HTML 的一部分写入客户端；以及在填充后的控件返回到服务器后，在后置代码中处理结果。在后置代码中处理结果需要你首先通过\
  \ `Id` 访问控件，然后访问你尝试访问的属性。\n\n你不仅可以访问控件中的值，还可以让服务器对传入的数据进行分析，将其与之前的版本进行比较。这一切都由状态管理引擎控制。状态管理系统使用\
  \ `ViewState` 来维护控件的上一个值——基本上是数据的旧副本，可以与新提交的版本进行比较，以理解发生了什么变化。\n\n### 练习\n\n1. \
  \ 是否每个属性都可以在后置代码中设置，还是某些必须在标记中设置？\n2.  为了理解 `CheckBoxList` 中的选定项目与 `TextBox` 中的文本，你需要如何操作？\n\
  3.  在 HTML 元素上添加 `runat=\"server\"` 属性会改变什么？\n4.  什么是视图状态（view state）？\n\n## 本章学到的知识\n\
  \n| 术语 |  |\n| :--- | :--- |\n| `CssClass` | 控件上的属性。使用时，输入的值将放入外层 HTML 元素的类属性中。\
  \ |\n| 调试 (Debugging) | Visual Studio 的功能，允许在代码运行时对其进行跟踪。你可以设置断点，让程序在运行时停止，并查看属性和其他项的值。\
  \ |\n| `EnableViewState` | 标准控件属性，决定控件内容在运行时是否存储在 `ViewState` 中。未启用视图状态的项目可能会丢失数据或丢失事件调用。\
  \ |\n| HTML 控件 | 通过在标记中的 HTML 元素上添加 `runat=\"server\"` 属性创建。这允许你在后置代码中访问各种值和属性。\
  \ |\n| 标记 (Markup) | 描述 .aspx 页面的术 |\n| `OnClick` | 按钮上的事件。要在代码中利用该事件，你必须将其连接到事件处理程序。该事件处理程序必须具有\
  \ `object` 和 `EventArgs` 方法签名。 |\n| 回传 (Postback) | 描述页面提交给自己。这是最常见的 Web Forms 方法之一，因为文件下载到客户端，用户可以在那里进行更改，然后将文件传回服务器进行处理。这种传回就是回传。后置代码中的\
  \ `Page` 对象有一个 `IsPostback` 属性，用于确定何时通过回传传入。 |\n| 标准控件 (Standard Controls) | 最常用的控件。这些控件包括文本框、单选按钮、复选框和标签——制作交互网站所需的大部分。\
  \ |\n| `ViewState` | 使 ASP.NET 管理状态。它是 HTML 表单中的一个隐藏字段，包含所有启用视图状态的信息的哈希版本，并发送到客户端。这些信息的副本会在往返时发送，以便服务器能够理解用户填写的当前数据版本和之前的版本。\
  \ |\n\n\n\n\n你已经学习了 ASP.NET Web Forms 如何通过一种方法（即服务器控件）来工作，其结果被渲染成 `HTML`，以供客户端机器上的浏览器使用。例如，开发者可以在标记中添加一个服务器控件，并知道浏览器中将显示一个文本框。然而，除非使用具有辅助限制功能的\
  \ HTML 控件，否则输出的 `HTML` 完整结构并不在开发者的控制之下。\n\n在 ASP.NET MVC 中，这个过程会有所不同。在 MVC 世界中，并没有所谓的服务器控件。相反，它有一种“在\
  \ UI 中内部”编写代码的方法，这让开发者能够对发送到客户端的输出具有完全的控制权。然而，正如你所料的，“更多的控制”意味着你可能需要编写更多的代码。在某些情况下，你可能拥有脚手架（scaffolding）或自动创建的代码（类似于你启动的项目），只需通过点击几个按钮即可提供创建、编辑、查看和列表功能。在其他情况下，你必须亲自进行编码。\n\
  \nMVC 提供支持的方式之一是在应用程序的特定支持各种语言结构，这部分在 ASP.NET Web Forms 中被称为“标记”，但在 MVC 中简单地被称为“视图（view）”。本章介绍了这种新的语言结构\
  \ `Razor`，并描述了你可以用于创建自定义 UI 的各种方法，而不是通过服务器控件来创建它们。本章还涵盖了如何将来自 UI 的信息返回服务器并在那里进行处理以执行工作。整个过程提供了构建网站的\
  \ MVC 方法的概述，到本章结束时，你应该开始理解这些方法方法之间的一些基本区别。\n\n## 为什么 MVC 的控件比 Web Forms 少\n\n之前已经提到过多次，MVC\
  \ 的控件没有 Web Forms 那么多。例如，在 ASP.NET MVC 世界中，不存在 `<asp:TextBox />` 这种概念。主要原因是由于这两种不同的\
  \ ASP.NET 技术采用了不同的方法。在 Web Forms 中，标记和后置代码（code-behind）是交织在一起的；它们始终在一起。它们的名称甚至也是在一起的——例如，`SomePage.aspx`\
  \ 和 `SomePage.aspx.cs`（或 `.vb`），并且解决方案管理器（Solution Explorer）将它们一起显示。这种紧密性体现在，服务器控件的\
  \ `Id` 属性可以在后置代码可用，因为服务器控件是一个实例化对象，所有属性都可供检查或使用。它们是一个单一的、绑定的实例。\n\n在 ASP.NET MVC\
  \ 中并非如此。每个部分与其他都是相互独立的。创建 `HTML` 的视图与控制器完全分离，并且它对它们一无所知。这种分离解释了为什么缺乏服务器控件。服务器控件的设计初是为了帮助\
  \ `HTML` 的创建以及管理从客户端返回的内容。在 MVC 中，那种方法违背了关注点分离（separation of concerns）的概念。视图只负责创建用户界面。控制器只负责从视图接收信息并向视图提供信息，而模型（models）只负责执行业务逻辑。ASP.NET\
  \ MVC 默认分离了所有这些职责，而 ASP.NET Web Forms 只部分分离了它们。\n\n尽管如此，仍然有一些方法可以使构建 ASP.NET MVC\
  \ 站点变得更快速，并为开发者和设计师提供一些帮助。这些方法与你在本章之前所接触的完全不同。\n\n## 不同的方法\n\n虽然 ASP.NET Web Forms\
  \ 在标记和后置代码之间使内容变得可用，但 ASP.NET MVC 采取了不同的方法。它不是使用控件来管理信息的传递，而是使用“模型（model）”的概念。模型代表了数据的底层逻辑结构。同样重要的是，要理解模型对控制器或视图一无所知。该模型在控制器中填充，然后传递到视图中。然后视图负责将这些属性值分配给返回给客户端的\
  \ `HTML` 中包含的适当的用户界面项。图 6.1 展示了这一流程。\n\n![模型传递给视图的工作流图，包含模型、视图、控制器和客户端浏览器。](img/c06f001.jpg)\n\
  \n图 6.1 模型传递给视图的工作流\n\n为了检查代码看起来是什么样的，首先查看这些部分是如何组合的（稍后你将亲自把它们组合）：\n\n### `Model`\n\
  \n```\npublic class DemoModel\n{\n    public string Property1 { get; set; }\n  \
  \  public string Property2 { get; set; }\n    public string Property3 { get; set;\
  \ }\n}\n```\n\n第一个代码段定义了你正在显示的模型。该模型被创意地命名为 `DemoModel`，具有三个属性：`Property1`、`Property2`\
  \ 和 `Property3`。这些属性中的每一个都是字符串。现在你已经定义了要显示的模型，请看如何显示它：\n\n### `View`\n\n```\n@model\
  \ RentMyWrox.Models.DemoModel\n<html>\n<body>\n    <div>\n        <h4>Demo Model</h4>\n\
  \        <div>\n            @Html.DisplayFor(model => model.Property1)\n       \
  \ </div>\n        <div>\n            @Html.DisplayFor(model => model.Property2)\n\
  \        </div>\n        <div>\n            @Html.DisplayFor(model => model.Property3)\n\
  \        </div>\n    </div>\n</body>\n</html>\n```\n\n前面的代码段使用 Razor 语法输出信息。它有一个小标题和三行，每行都列出了属性的值。`@`\
  \ 为服务器提供信号，后续项将作为代码处理。现在你已经有了显示对象的代码，你需要实际创建该对象并确保视图已获得信息。这在以下代码中得到了：\n\n### `Controller`\n\
  \n```\n// GET: DemoModel/Details/5\npublic ActionResult Details(int id)\n{\n   \
  \ DemoModel dm = new DemoModel {\n        Property1 = id.ToString(),\n        Property2\
  \ = string.Format(\"Property2 {0}\", id),\n        Property3 = string.Format(\"\
  Property3 {0}\", id)\n    };\n    return View(\"DemoModelView\", dm);\n}\n```\n\n\
  前面的控制器操作创建了一个新的 `DemoModel` 对象，给它了一些值，然后返回填充了值的视图。图 6.2 显示了它在浏览器中的样子。\n\n![浏览器中渲染的\
  \ MVC 视图中简单模型的截图](img/c06f002.jpg)\n\n在这个过程中最后要检查的内容是用于显示的 `HTML`：\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<body>\n    <div>\n        <h4>Demo Model</h4>\n      \
  \  <div>\n            5\n        </div>\n        <div>\n            Property2 5\n\
  \        </div>\n        <div>\n            Property3 5\n        </div>\n    </div>\n\
  </body>\n</html>\n```\n\n正如你所看到的，这段代码比 ASP.NET Web Form 过程中创建的 `HTML` 要整洁得多。当你要求系统显示一个属性时，这就是系统所做的所有工作。没有创建额外的\
  \ `HTML` 元素；它只是输出了该值。\n\n\n\n\n这与 ASP.NET Web Forms 的方法有很大不同。你现在将熟悉这三元结构的各个部分。首先是模型（model）。在这种情况下，它带有三个属性的简单类；没有任何特殊之处。在现实场景中，这个模型要复杂得多，但过程是相同的。\n\
  \n接下来是视图（view）。视图大部分是 HTML，与发送到并在浏览器中渲染的 HTML 源码非常相似，区别在于两类型的代码行。第一行代码是：\n\n```html\n\
  @model RentMyWrox.Models.DemoModel \n```\n\n这是页面的第一行，用于定义视图将工作模型。在这种情况下，模型位于 `RentMyWrox.Models`\
  \ 命名空间中，类型为 `DemoModel` 的对象。`@` 符号表示解析将通过 Razor 完成。第二类代码如下所示：\n\n```html\n@Html.DisplayFor(model\
  \ => model.Property1)\n```\n\n上一行告诉 Razor 视图引擎在页面上显示模型中的 `Property1` 属性。\n\n###\
  \ Razor\n\nRazor 语法是一种用于在网页中嵌入服务器端代码的简单编程语法。在运行 Razor 语法的网页中，有两种内容：客户端内容和服务器代码。客户端内容是你在网页中熟悉的那些：HTML\
  \ 标记（元素）、如 CSS 等样式信息、可能某些客户端脚本（如 JavaScript）以及纯文本。\n\nRazor 语法是一种在视图中添加决策、循环和其他代码处理方式的语法方法。它回溯到了\
  \ .NET Framework 出现之前的原始 Active Server Pages (ASP) 方法。Classic ASP 在单个页面中混合了代码和 UI，这些代码在服务器上运行以创建发送到客户端浏览器的\
  \ HTML。Razor 支持相同的方法——允许 UI 逻辑根据视图正在处理的数据做出某些决策。\n\n为了利用 Razor 支持而编写的代码是基于 C#（或\
  \ VB）的。由于 Web Form 服务器控件看起来更像 HTML，但在视图中使用 Razor 就像在 UI 中编写 C#（或 VB）代码，因此你只需要用你选择的语言进行编写，而不需要额外了解特殊的服务器控件属性。\n\
  \n使用 Razor 语言时请注意以下几点：\n\n- **使用 @ 字符向页面中添加代码。** 使用此特殊字符告诉解析器，接的一组命令应该被视为代码而非 HTML\
  \ 元素。你在示例中看到了两次用法，第一次是你声明模型类型时，第二次是你告诉解析器写出特定属性的值时。\n- **你可以用大括号包含代码块。** `并不是所有代码都可以写在同一行，所以你可以使用括号来包含代码块。这看起来像以下两种方法之一：`\n\
  \n```csharp\n@{var someValue = model.Property1;}\n@{\n    var someOtherValue = model.Property2;\n\
  \    someOtherValue += \" \" + model.Property2;\n}\n```\n\n- **在块内部，你用分号结束每个代码语句。**\
  \ 就像你在 C# 中编写应用程序代码一样，你必须在每行代码结束处加上分号表示该特定指令行的结束。\n- **你可以使用变量来存储值。** Razor 允许你在视图代码中创建并使用变量。这些变量的实例化、访问和使用方式与在传统代码中相同。\n\
  - **你用双引号包含字面量字符串。** 编写 Razor 语法与普通 C# 代码相似性的另一个证明是，字符串在视图中的声明方式与在代码内部工作时一样。\n-\
  \ **你可以编写进行决策的代码。** 你的所有决策不必在别处做出；相反，你可以在视图内部进行分析，使用与 Web Forms 后置代码相同的结构来确定某些信息。\n\
  - **你可以混合代码和 HTML 代码。** 解析器能够理解两者之间的区别，因为代码以 `@` 代码和大括号为前缀，而 HTML 代码由元素大括号“<>”定义。\n\
  \n上述所有点都应该很熟悉；它们基本上说明，你在处理 C#（或 VB）代码时遵循的所有规则在处理 Razor 语法时也适用；唯一的例外是使用 `@` 字符来标识下一个命令是基于代码而非\
  \ HTML 标记。\n\n现在来看另一个在 Razor 中使用 C# 代码的示例。在这种情况下，你写出了从 0 到 5 的数字列表：\n\n```html\n\
  <!DOCTYPE html>\n<html>\n<body>\n    @{\n        for(int i=0; i <= 5; i++)\n   \
  \     {\n            <div>@i</div>\n            <div>i</div>\n        }\n    }\n\
  </body>\n</html>\n```\n\n这段代码段演示了你如何混合代码和标记，且 Razor 引擎足够智能，它可以识别出哪些是代码、哪些是标记，并确保创建并将正确的\
  \ HTML 发送到客户端。\n\n在例示例中，循环被包含在一个用 `@` 字符标记的代码块中。这让 Razor 视图引擎知道处理发生在块内，这就是为什么包含\
  \ `for` 循环的行代码本身不需要标记。然而，一旦通过添加 HTML 元素更改了上下文，就必须使用 `@` 字符，这就是使用变量 `i` 的原因。\n\n\n\
  \n\n\n| `DisplayFor()` | 此扩展方法允许你创建一个表达式，用于描述模型上显示哪个值。该表达式是一个 lambda 表达式，并为视图引擎提供方向。示例：`Html.DisplayFor(x\
  \ => x.Property1)` |\n| `DisplayForModel()` | 此扩展方法允许你使用模板来显示信息，前提是你已经构建了管理显示的自定义模板。当你想要在不同的视图中复用同一个对象的显示时，这非常有用。第\
  \ 9 章将更详细地介绍模板。示例：`Html.DisplayForModel(\"templateName\")` |\n\n## 表 6.1 显示扩展方法\n\
  \n如你所见，一些强大的功能是视图定义的一部分。它们允许你使用 HTML 元素和 C#（或 VB）代码组合来构建 UI。需要注意的是，尽管这部分被称为“视图（view）”，但所有的处理仍在服务器上进行；也就是说，所有处理在页面发送到客户端之前就已经完成了。你在视图中运行这段代码基于传递给它的信息（通常是模型）。在下一节中，你将查看负责创建模型并将其传递给视图的框架部分：控制器（controller）。\n\
  \n### 控制器 (Controller)\n\nMVC 框架中的控制器命名非常恰当，因为它负责管理调用哪些视图以及带有什么信息（或模型）。控制器起着连接模型与视图的作用，并能够确定使用哪个模型和视图，因为它也是处理\
  \ HTTP 请求的功能所在。\n\n你可能记得之前关于 HTTP 的讨论，客户端和服务器之间的通信是基于请求-响应模型的，客户端请求特定的 URL 并带有特定的动词（`GET`、`PUT`、`POST`\
  \ 或 `DELETE`）。服务器接收请求，可能执行一些工作，然后对预期的信息做出响应。在 ASP.NET MVC 应用中，控制器就是接收请求并决定显示什么信息的实体。\n\
  \nWeb 应用程序参与了许多不同的控制器，每个控制器可能有多个方法，或操作（actions）。控制器负责处理唯一 URL 和 HTTP 动词组合对应的功能，特别是上面列出的四个主要动词。这意味着，在可能需要使用所有动词的情况下，会有一个控制器方法（或操作）来处理\
  \ `GET` 请求，另一个处理 `PUT` 请求，一个处理 `POST` 请求，另一个处理 `DELETE` 请求。列表 6.1 显示了对于之前创建的 `DemoModel`\
  \ 对象这种情况看起来是怎样的。\n\n该列表包含了单个控制器 `DemoModelController` 中的所有方法。每个方法上方都有一个注释，描述了它所作用的动词以及它响应的\
  \ URL。因此，第 2 行的 `Index` 方法响应对 [`websitedomain/DemoModel`](http://websitedomain/DemoModel)\
  \ 的 `GET` 请求，第 5 行的 `Details` 方法响应对 [`websitedomain/DemoModel/Details/Id`](http://websitedomain/DemoModel/Details/Id)\
  \ 的 `GET` 请求，其中 `Id` 是一个整数。\n\n#### 路由 (Routing)\n\n检查列表 6.1 的内容可能会引发一些问题，例如：控制器如何知道响应如\
  \ [`websitedomain/DemoModel`](http://websitedomain/DemoModel) 所示的路径部分的 URL？服务器又是知道调用该特定控制器上的该方法的？服务器能够根据路由配置来确定要采取的操作，如图\
  \ 6.5](#c06.xhtml_c06-fig-0005) 所示。\n\n![代码页截图，其中高亮了代码 Routes.MapRoute，并且右侧选择了 App_Start\
  \ 目录下的 RouteConfig.cs 文件。](img/c06f005.jpg)\n\n## 图 6.5 App_Start 目录下的 `RouteConfig.cs`\
  \ 文件\n\n作为项目模板一部分创建的 `App_Start` 文件夹包含几个文件。你在这里关注的是 `RouteConfig.cs` 文件。该文件创建了服务器根据请求的\
  \ URL 确定调用控制器中哪个方法的映射。它可以创建非常具体的路由，也可以使用如图所示所示。\n\n对路由进行进一步检查是有必要的。以下片段显示了描述需要调用的类和方法的路由：\n\
  \n```\nroutes.MapRoute(\n    name: \"Default\",\n    url: \"{controller}/{action}/{id}\"\
  ,\n    defaults: new { action = \"Index\", id = UrlParameter.Optional }\n);\n```\n\
  \n理解发生什么在于包含 `url:` 的行。它将路由模板设置为 `Controller/Action/Id`。因此，当请求包含 `DemoModel` 作为路径部分的\
  \ URL 时，系统会寻找支持此对象的控制器。它通过将请求的字符串值“DemoModel”与单词“Controller”结合的约定理解这一点，因此任何包含 `DemoModel`\
  \ 作为路径部分的传入请求都预期由一个名为 `DemoModelController` 的类处理。\n\n路由的 action 部分是控制器上将被调用的方法。因此，[`websitedomain/DemoModel/Details/`](http://websitedomain/DemoModel/Details/)\
  \ 调用 `DemoModelController` 中的 `Details` 方法。前一个片段中的 `defaults:` 行显示了如何处理缺失值。它告诉系统，如果\
  \ URL 中没有包含操作，则使用默认值。\n\n路由的最后部分是 `Id`。默认部分使其成为可选，因此它可能包含也可能包含在请求中。此项变为参数，因此 [`websitedomain/DemoModel/Details/5`](http://websitedomain/DemoModel/Details/5)\
  \ 等同于传递 `5` 作为参数，如列表第 18 行所示。\n\n查看你正在处理的路由，你认为对 [`websitedomain/DemoModel/Details`](http://websitedomain/DemoModel/Details)\
  \ 的请求会发生什么？你预计它会调用 `DemoModelController` 上的 `Details` 方法；但该方法需要一个整数参数，而你没有提供。你认为会发生什么？如果你猜系统会爆炸，到处都是烟雾，那么你猜得相当接近，如图\
  \ 6.6](#c06.xhtml_c06-fig-0006) 所示。\n\n![浏览器中显示当 URL 不包含 Id 错误消息 Server Error in\
  \ '/' Application。URL 指定为 http://localhost:1072/DemoModel/Details/.](img/c06f006.jpg)\n\
  \n## 图 6.6 URL 不包含 Id 错误\n\n在这种情况下，你会得到一个错误，因为系统试图为 `Details` 方法提供空值参数，而整数不能为空。如果你认为此\
  \ URL 可能在没有值的情况下被调用，并且你想处理它，可以将路由更改为如下：\n\n```\nroutes.MapRoute(\n    name: \"Default\"\
  ,\n    url: \"{controller}/{action}/{id}\",\n    defaults: new { action = \"Index\"\
  , id = 0 }\n);\n```\n\n通过上述更改，系统现在调用 `Details` 方法；如果 URL 中未包含 `Id`，它将使用默认值 `0` 调用\
  \ `Details` 方法。\n\n\n\n\n当你处理参数时，`url:` 中的变量名与参数的变量名匹配至关重要。如果它们完全不同，例如在定义 `Route`\
  \ 时使用了 `url: “{controller}/{action}/{itemId}”`，默认值将无法设置，并重复之前在图 6.6 中显示的错误。最好的方法始终确保你在映射路由时使用的变量名与定义方法签名时使用的名称相同；这样查看路由配置时，就能看到易于关联到传入各种操作的参数的标识符。\n\
  \n## HTTP 动词和属性\n\n你已经学习了服务器如何确定在请求 URL 时做什么；但像下面这样的示例呢？其中 `Create` 方法存在重载，而重载（当方法具有相同名称和返回类型但接受不同参数集时）期望接收一个对象而不是简单的整数？\n\
  \n```28\\. // GET: DemoModel/Create\n29\\. public ActionResult Create()\n30\\. {\n\
  31\\.     return View(); // 此视图是需要填写的表单\n32\\. }\n33.\n34\\. // POST: DemoModel/Create\n\
  35\\. [HttpPost]\n36\\. public ActionResult Create(DemoModel model)\n37\\. {\n38\\\
  .     // 执行一些创建工作\n39\\.     return View(); // 用于确认已创建新项的视图\n40\\. }\n1```\n\n第\
  \ 35 行的项 `[HttpPost]` 展示了这种差异。该属性告诉系统，如果向 [`websitedomain/DemoModel/Create`](http://websitedomain/DemoModel/Create)\
  \ 发送 `POST` HTTP 请求，则应该调用被标记的方法，并且表单内容应该映射到 `DemoModel` 对象并作为参数传递给方法。对于每个 HTTP 动词（包括\
  \ `GET`），都有对应的属性。然而，由于 `GET` 是默认操作，你在代码 6 中没有看到该属性。\n\n另一个你没有看到 `HttpGet` 属性的原因是，该属性还限制了操作可以工作的动词；因此，带有\
  \ `[HttpPost]` 属性的方法只响应 `POST` 请求，而其他 `Create` 方法能够响应任何 HTTP 动词，例如 `DELETE` 调用（到\
  \ [`websitedomain/DemoModel/Create`](http://websitedomain/DemoModel/Create)）。如果该方法被标记为\
  \ `[HttpGet]`，则 `DELETE` 调用将导致错误，而不是被视为 `GET`。\n\n## 表单构建 (Form-Building)\n\n本章简要介绍了模型、视图和控制器，以及\
  \ URL 如何指向控制器上的特定方法。尚未讨论的是构建表单，以及当 `POST` 发送到服务器时，服务器如何理解来自表单的值并创建相应的模型。在本节中，你将学习这些内容。\n\
  \n### 表单扩展 (Form Extensions)\n\n上一节展示了如何在视图中显示数据的示例。创建表单字段要复杂一些，因为你希望系统能够理解发送回服务器的表单信息。通过使用紧密绑定的类型安全方法，你可以帮助服务器理解表单上的\
  \ HTML 元素与模型之间的关系。这是通过使用 `#Html.InputType` 实现。表 6.2 提供了这些不同输入类型的列表，以及它们如何使用的示例和\
  \ HTML。\n\n| 扩展项 | 描述和示例 |\n| :--- | :--- |\n| TextArea | 创建一个包含多行文本的文本区域控件：`@Html.TextAreaFor(m=>m.Address\
  \ , 5, 15, new{}))` HTML：`<textarea cols=\"15” id=\"Address” name=\" Address ” rows=\"\
  5\">Address</textarea>` |\n| TextBox | 创建一个传统的文本框：`@Html.TextBoxFor(m=>m.Name)`\
  \ HTML：`<input id=\"Name\" name=\"Name\" type=\"text\" value=\"Name\" />` |\n| CheckBox\
  \ | 创建一个复选框：`@Html.CheckBoxFor(m=>m.IsEnabled)` HTML：`<input id=\"IsEnabled\" name=\"\
  IsEnabled\" type=\"checkbox\" value=\"true\" />` |\n| Dropdown List | 用于创建一个用户只能选择一个值的下拉框：`@Html.DropDownListFor(m\
  \ => m.Gender, new SelectList(new [] {“Male”, “Female”}))` HTML：`<select id=\"Gender”\
  \ name=\"Gender\"><option>Male</option><option>Female</option></select>` |\n| HiddenField\
  \ | 创建创建一个存储但在 UI 上不可见的字段：`@Html.HiddenFor(m=>UserId)` HTML：`<input id=\"UserId\"\
  \ name=\"UserId\" type=\"hidden\" value=\"UserId\"/>` |\n| Password | 创建一个密码字段，用户输入的内容会被遮蔽：`@Html.PasswordFor(m=>Password)`\
  \ HTML：`<input id=\"Password\" name=\"Password\" type=\"password\"/>` |\n| RadioButton\
  \ | 创建一个单选器按钮：`@Html.RadioButtonFor(m=>IsApproved, “Value”)` HTML：`<input checked=\"\
  checked\" id=\"IsApproved\" name=\"IsApproved\" type=\"radio\" value=\"Value\"/>`\
  \ |\n| Multiple-select | 创建一个可以从中选择多个值的列表：`@Html.ListBoxFor(m => m.Pets, new MultiSelectList(new\
  \ [] {“Cat”, “Dog”}))` HTML：`<select id=\"Pets” multiple=\"multiple” name=\"Pets\"\
  ><option>Cat</option><option>Dog</option></select>` |\n\n**表 6.2 类型安全扩展**\n\n这种方法与\
  \ Web Forms 服务器控件之间的差异可能看起来微不足道；你仍然让系统来编写 HTML。然而，缺失的主要点是在代码中引用控件的能力，因为控制器并不知道那个特定元素。在\
  \ Web Forms 示例中，代码后台知道控件的所有信息；它可以访问其名称、更改样式或对其进行各种工作。老诚地说，ASP.NET Web Forms 的强大之处在于它确实拥有所有这些知识，这使得信息共享变得简单。在\
  \ ASP.NET MVC 中，控制器对实际创建的项一无所知；它不知道这些信息是如何创建的。它只知道信息已经提交了。\n\n创建允许捕获数据的输入 HTML 元素还有其他方法。当表\
  \ 6.2](#c06.xhtml_c06-tbl-0002) 列出的方法通过 Lambda 表达式绑定到模型字段时，你始终可以使用字符串创建项，而不是表达式；通过这种覆盖，元素将使用你输入的字符串进行命名。只要输入名称和模型属性名称相同，你仍然可以在提交时享用于绑定模型的便利。\n\
  \n### Editor 和 EditorFor\n\n你已经学习了开发者可以选择用于捕获数据的 HTML 元素类型。你现在也可以允许 Razor 引擎决定如何渲染输入元素。有一组特殊的\
  \ `HtmlHelpers` 对象可以完成此工作。这些辅助方法 `Editor` 和 `EditorFor` 会检查属性的数据类型，以确定应该创建什么类型的输入元素：\n\
  \n```\n@Html.EditorFor(model => model.Property1);\n```\n\n\n\n由于系统通过查看属性的数据类型来确定显示内容，因此它通常会创建一个文本框或复选框，因为传统的文本框可以输入任何内容——而没有比复选框更能更好地表示布尔值了。根据你目前为止所学到的知识，使用\
  \ `EditorFor` 似乎在失去对创建并发送到客户端的 HTML 的控制权上退后了一步，但将 `EditorFor` 作为创建表单字段的默认方式还有额外的好处。\n\
  \n`EditorFor` 的核心功能之一是它能够与模型属性上的特性协同工作。本书尚未介绍类属性上的特性，但当你开始为了与数据库交互而构建模型时，你将学习到它们的优势。那时，你将查看各种可用的特性，其中一种就允许你在类属性本身上定义应该创建什么类型的元素。\n\
  \n在属性上使用此特性可以让你在用于该属性的所有编辑器表示中，更改元素的显示方式，而无需在每个页面上手动更改元素类型。添加此特性非常简单：\n\n```\n[DataType(DataType.MultilineText)]\n\
  public string Property2 { get; set; }\n```\n\n这会将显示方式从传统的文本框变为具有多行的 `textarea` 元素。如果你请求较大量的数据，例如产品描述或客户评论，这种方法就是合理的。\n\
  \n### 模型绑定\n\n如果你曾经查看过从 HTML 表单接收到的信息，你就会发现这些信息并不是以一种结构良好的复杂类型形式提供的。相反，整个内容是一组键值对，其中控件的\
  \ `Id` 是键，而为该特定控件输入或选择的值就是该键值对中的值。你始终可以以这种方式来处理信息；例如，以下代码段是完全有效的：\n\n```\n[HttpPost]\n\
  public ActionResult ActionWithFormCollection(FormCollection formCollection)\n{\n\
  \    var property1 = formCollection[\"Property1\"];\n    var property2 = formCollection[\"\
  Property2\"];\n    return View();\n}\n```\n\n当使用模型没有意义时，这种方法可能有用，例如当操作程序接收来自第三方的信息时。当你可以从表单的键值列表中获取所需的信息时，创建一个模型仅用于支持这个方法可能大大小小用了。只有当该模型是你领域中的一个对象，且你可能在其他地方使用它，或者它符合某些业务逻辑时，使用模型才有意义。\n\
  \n正如你在构建示例应用程序时将看到的，当系统在为你执行绑定时，它会尝试按照以下顺序映射对象的属性：\n\n1. 表单字段\n2. `JSON`（JavaScript\
  \ 对象表示法）请求体中的属性值，但仅当请求为 AJAX 请求时\n3. 路由数据\n4. 查询字符串参数\n5. 提交的文件\n\n这种顺序意味着它查找用于绑定到模型上属性的信息的第一个地方是表单字段。因此，如果在该值集合中找到了该属性，解析器就会评估类型，如果类型可以正确转换（记住所有字段被服务器接收时都是\
  \ `string` 类型），那么它就会转换并分配该值。\n\n如果解析器无法在表单字段中找到该值，那么如果请求是 AJAX 请求，它将将检查 JSON 请求体。你将在关于\
  \ AJAX 请求的章节中学习更多内容，第 13 章。如果从那里也找不到该值，它将将视路由数据，查看其中是否包含它正在寻找的内容。然后它将遍历查询字符串值，查看是否在那里找到了该信息。如果没有，它会快速查看上传的文件，看它们是否匹配。如果找不到该属性，解析器就会耸耸肩，赋予该属性默认值，并继续处理下一个属性。\n\
  \n对于像 `DemoModel` 这样有一组简单类型的对象，模型绑定是非常直接的。你可能会好奇这在复杂类型上将如何工作，对于复杂类型，属性不是整数或其他简单类型，而是另一个对象。考虑以下结构：\n\
  \n```\npublic class ComplexModel\n{\n    public int MyId { get; set; }\n    public\
  \ DemoModel DemoModel { get; set; }\n}\npublic class DemoModel\n{\n    public string\
  \ Property1 { get; set; }\n    public string Property2 { get; set; }\n    public\
  \ string Property3 { get; set; }\n}\n```\n\n其中新对象 `ComplexModel` 包含一个 `DemoModel`\
  \ 对象的属性。在这种情况下，你的输入名称必须以不同的方式设置。如果你考虑解析引擎，当它尝试寻找可以分配给 `DemoModel` 的值时，你认为它将如何做？它会寻找名称为\
  \ `DemoModel` 的输入字段。然而，你如何能创建一个接收 `DemoModel` 所有属性的文本框呢？答案是你不能，你也不需要。\n\n尽管解析引擎没有识别出名为\
  \ `Property1` 的输入字段需要分配给 `DemoModel` 属性的 `Property1` 属性，但它理解名为 `DemoModel.Property1`\
  \ 的输入字段将这样做，因为它识别了 `DemoModel` 名称，并且点表示法表示点右侧的项目是该特定对象的属性。\n\n这种点表示法关系可以根据需要无限深下去。具有四到五层深的对象图是非常常见的；只要点表示法正确，解析引擎就能跟踪这些值并正确地分配它们。\n\
  \n集合的工作方式与你在代码中访问它们的方式相同，所以这是合理的。按照所示更改对象定义，以查看这意味着什么：\n\n```\npublic class ComplexModel\n\
  {\n    public int MyId { get; set; }\n    public List<DemoModel> DemoModels { get;\
  \ set; }\n}\n```\n\n正如你所看到的，`DemoModel` 被更改为了 `DemoModel` 列表。然而，如果你认为列表可以通过索引表示法访问，那么点表示法在这里同样适用。这意味着名称为\
  \ `DemoModels[0].Property1` 的输入被映射到集合中第一个项的 `Property1` 属性。\n\n\n\n\n# 引言\n\n本章介绍了如何使用\
  \ ASP.NET MVC 在客户端和服务器之间进行通信。你已经学习了如何使用 HTML 助手器创建视图并显示动态信息，特别是 `HTML.DisplayFor`。这些\
  \ HTML 助手器还支持创建客户端的 HTML 元素，用于捕获信息并返回给服务器。\n\n两种类型的 HTML 助手器可以创建数据输入元素：通用的特定的。通用的\
  \ `Html.EditorFor` 会查看它正在显示的属性，并确定捕获信息的最佳方式。它还能查看属性并通过模型上的属性影响设计。这些属性在文中已简要介绍，但当你开始为数据库管理模型添加属性时，你将学到关于它们的更多知识。另一种可用于创建\
  \ HTML 输入元素的 HTML 助手器是特定元素的助手器，例如 `Html.TextboxFor` 或 `Html.CheckboxFor`，它们会创建一个与属性名称相同的\
  \ HTML 元素。\n\n视图最强大的方面之一是它通过支持 Razor 在视图内部运行代码。Razor 允许你将代码和 HTML 标记混合，因此你可以编写代码来执行诸如遍历列表并写入内容或执行计算等操作。Razor\
  \ 也是让 HTML 助手器运行的原因。使属性名称与元素名称匹配是非常重要的，因为有助于模型绑定过程。当提交表单时，服务器会检查正在提交的信息；如果匹配的方法（由于路由规则与\
  \ URL 匹配）包含一个对象作为输入参数，它将尝试将各种传入的数据点映射到该对象上的属性上。这使得开发者可以在控制器中使用类型安全的对象，而无需通过解析一系列键值对并基于它们进行工作。\n\
  \n尽管你还没有在控制器中做过多少工作，但对象、控制器、控制器操作（action）或方法与视图之间的协调现在应该更易理解了。许多 ASP.NET MVC 是由约定驱动的，这种协调是该约定的一部分，因为来自\
  \ URL 的对象名称会匹配到一个控制器，该控制器的名称是在对象名称后加上“Controller”而成的，例如 `ObjectNameController`。操作名称通常也是\
  \ URL 字符串的一部分，因此系统能够确定需要在哪个控制器上运行哪个操作或方法）来处理请求。\n\n## 练习题\n\n1. **1.** 使用 `@Html.TextboxFor`\
  \ 和 `@Html.Textbox` 之间的区别是什么？\n2. **2.** Razor 视图引擎如何理解它应该运行的代码与不应更改或影响的仅作为透传的文本之间的区别？\n\
  3. **3.** 约定在 ASP.NET MVC 中起着重要作用。视图名称必须始终与操作名称匹配吗？\n4. **4.** 模型绑定器知道如何绑定嵌套类型或作为其他对象的属性的对象吗？\n\
  \n## 你在本章中学了什么\n\n| 术语 | 描述 |\n| :--- | :--- |\n| Controller Action (控制器操作) | 控制器上响应特定\
  \ URL 的方法。URL 格式通常类似于 `ObjectName/Action`，其中 `ObjectName` 指向将要使用的控制器，`Action` 提供在该控制器上调用的方法（或操作）的名称。\
  \ |\n| Display/DisplayFor | 将模型值的内容绑定到 Web 页面上 HTML 元素的 HTML 助手器。这些元素不是输入元素，而是用于显示模型信息。\
  \ |\n| Editor/EditorFor | 这些助手器允许系统根据绑定的对象和属性创建适当 HTML 输入元素。`EditorFor` 还查看模型上各种属性的能力，以确定如何控制显示。\
  \ |\n| Lambda Expressions (Lambda 表达式) | 基本上采用识别属性方法的内联函数。因此，`x => x.Property1`\
  \ 定义为“对于给定的每个 x（对象的变量名），返回属性 Property1 的值。” |\n| Model Binding (模型绑定) | 解析提交到服务器的各种值，以识别哪些值与\
  \ `Action` 方法参数列表中命名的对象的属性名称匹配的过程。 |\n| Razor | 视图引擎的名称，处理在视图中运行 C#（或 VB）代码的能力。整个\
  \ .NET 栈都可以根据需要用于视图内部。Razor 视图引擎通过使用 `@` 字符来理解它应该运行的代码与它应该忽略的文本之间的区别，`` 标识应该运行的代码。\
  \ |\n| Routing (路由) | 从 URL 确定哪个控制器和操作负责处理请求的过程。`RouteConfig` 文件包含路由定义，其中传统的默认路由可能是示例应用程序所需的唯一路由。\
  \ |\n| Type-Safe Extensions (类型安全扩展) | 这些 HTML 助手器使用 Lambda 表达式来定义模型与特定元素之间的关系。\
  \ |\n| Verb Attributes (动词属性) | 用于控制器操作，以限制访问该控制器的动词类型。没有属性的操作可以通过任何动词访问。具有此类属性之一（例如\
  \ `[HttpPost]`）的操作只接受带有特定动词的请求。 |\n\n## 第 7 章：创建外观一致的网站\n\n### 你将在本章中学到：\n\n* 如何为你的\
  \ Web Forms 页面创建和使用 ASP.NET 主页\n* 如何创建和使用 ASP.NET MVC 布局页\n* 如何在 ASP.NET MVC 中创建和使用\
  \ Razor 区域\n* 如何创建和集成 Web Forms 内容页面\n* 如何创建和集成 MVC 内容页面\n* 如何创建基础页面\n\n### 本章代码下载：\n\
  \n本章的 [wrox.com](http://wrox.com) 代码下载可以在“Download Code”选项卡中的 `www.wrox.com/go/beginningaspnetforvisualstudio`\
  \ 找到。代码位于第 07 章下载中，并根据章节中的名称单独命名。\n\n你一直在为示例应用程序做一些零散的工作，在这里添加一些信息，那里也添加一些。在本章中，你开始将所有内容整合在一起并统一网站的外观和感受。你通过创建一个简单的、统一的外观，然后确保所有页面都遵循这种外观。\n\
  \n## 使用主页实现一致的页面布局\n\n当你查看互联网上的大多数网站时（例如 [`www.wrox.com`](http://www.wrox.com)），你可以看到它们倾向于具有一致的外观和感受。例如，每个页面顶部可能有一个菜单、左侧菜单，甚至底部还有一个页脚菜单；而且所有这些区域在每个页面上看起来都是样的。\n\
  \n\n\n\n\n你可以轻松地重复所有代码以在每个页面实现这一功能，但这不是处理它的最佳方法。更改将变成一场管理噩梦，因为你必须在网站的每一个页面上同步更改。显然，更好的办法是通过某种方式在同一处存储所有的共享设计元素，这样你只需要在某处进行更改，即可将其复制到整个网站。幸运的是，`ASP.NET`\
  \ 提供了一个维护所有信息的单一位置：`Web Forms` 中的主页（master page）和 `MVC` 中的布局页（layout page）。\n\n\
  简而言之，主页是一种特殊的 `ASP.NET Web Forms` 页面，它定义了所有内容页面通用的标记，以及可以根据每个内容页面进行自定义定制的区域。如果说主页是模板，那么内容页面就是绑定到主页的\
  \ `ASP.NET` 页面，因为它使用模板作为其主要设计模板。每当主页的布局或格式发生变化时，所有内容页的输出都会随之立即更新，这使得应用全局外观的变化变得像更新和部署单个文件（主页）一样简单。\n\
  \n布局页在 `ASP.NET MVC` 中提供的功能与主页在 `ASP.NET Web Forms` 中提供的功能相同：保持整个应用程序中 UI 元素和主题的一致性。回想第\
  \ 6 章，`Razor` 布局引入了两个新概念：\n\n*   **Web 主体（Web body）**——用于在特定位置渲染引用视图的内容\n*   **Web\
  \ 页面区域（Web page sections）**——用于在布局中声明多个区域，这些区域随后由引用视图定义\n\n通过各种脚手架框架创建新文件时，这两种方法都得到了支持。脚手架框架负责根据模板创建一个文件或一组文件。当你添加文件（或者项目）时，你实际上是在选择一个脚手架模板。添加的内容是脚手架框架根据该模板创建的结果。它们也可以被重构到现有的页面中。你将学习这两种方法：创建使用模板的新页面，以及将现有内容转换为使用集中化模板的方法。\n\
  \n这两种方法虽然在实现上有所不同，但都提供了相同的功能。请看图 7.1。\n\n![模板内网页的示意图。左侧区域、头部区域和页脚区域为浅蓝色，页面内容为深蓝色。](img/c07f001.jpg)\n\
  \n**图 7.1** 模板内的网页\n\n图 7.1 中的浅色区域通常来自模板页，而深色区域来自内容页。`Web Forms` 和 `MVC` 都支持这种方法。下一节将描述它是如何运作的。\n\
  \n### 在 ASP.NET Web Forms 中创建和使用主页\n\n当 `ASP.NET` 1.0 版本于 2002 年初发布时，它不支持主页的概念。部分功能由服务器端包含（server-side\
  \ includes）处理，即 Web 服务器向响应流写入 `HTML` 页面时会遇到一个标记，指示在该处插入另一个文件的内容。只要不需要插入的页面也是动态的，这种方法就能运行。这些插入的页面不能动态的，因为它们没有通过与标准请求相同的处理管道，因此包含文件中的任何代码都不会运行。通常，服务器只允许包含如\
  \ `.html` 或 `.txt` 等扩展的文件。此外，由于这些都是在渲染后处理的，因此无法将最终页面作为一个完整的实体来处理；“添加”的部分在 IDE 中不可见，因此这变成了一种“让我们运行看看它长什么样”的尝试。\n\
  \n`ASP.NET 2.0` 通过引入主页改变了这一点。这些独立的模板页可以包含代码，并可以像内容页一样被执行。主页是一种不同的页面类型；你可能在创建其他新页面时看到过它们作为一个选项。它们通常具有\
  \ `.master` 扩展名。主页看起来与你之前过的其他 `HTML` 页面非常相似，但它们有几个新部分。列表 7.1 显示了新主页包含的 `HTML`。\n\
  \n如果你在浏览器中查看此页面，它将是一个完全空白的页面。空白的主页看起来与其他任何 `HTML` 页面一样，但有两个新增项：`ContentPlaceHolder`\
  \ 服务器控件。你可以判断这些是服务器控件，因为它们遵循传统的 `asp:control` 命名规范并包含 `runat=\"server\"` 属性。然而，此控件与其他控件的不同之处在于，它并不完全控制作为控件一部分的所有内容。相反，它充当内容与主页之间的链接；控件内部的区域由内容页填充。\n\
  \n注意，此默认页面有两个区域：一个在 `HTML` 的 `head` 中，另一个在 `body` 的表单内。`body` 中的内容部分非常直观，因为那是可见内容所在的地方，但头部有一个内容区域的原因可能没那么明显。然而，当你考虑到头部区域中包含的信息类型时，情况就变得清晰了。你可以放置仅在此特定内容页面使用的\
  \ `JavaScript` 文件或样式表的链接；或者提供你认为重要的任何其他页面元数据。你可能只在某些页面上使用此部分，但提供该部分提供了大量的功能支持。通常只有两个区域，但你可以根据需要包含任意数量的区域。图\
  \ 7.2 显示了这种方法可能的外观。\n\n![具有多个内容区域的主页示意图。左侧区域、头部区域和页脚区域为浅蓝色；主内容、左侧相关内容和特殊内容为深蓝色。](img/c07f002.jpg)\n\
  \n在这种情况下，头部将有一个内容区域，一个定义“左侧相关内容”的内容区域（可以包含与页面内容类似的其他链接），一个主内容的内容区域，以及另一个页脚最右侧区域的内容区域。这种方法看起来类似于列表\
  \ 7.2。注意显示在何处插入真实内容的 `HTML` 注释。\n\n每个 `asp:ContentPlaceHolder` 控件都倾向于让内容页面提供可以插入到该区域的内容。这些内容完全可能是空的，但系统期望内容页面为每个占位符都有相应的区域。在创建连接到主页的新内容页面时（如你在接下来的“试一试”中所做的那样），脚手架会为主页中的每个占位符创建一个内容部分。然而，从内容页面中删除这些内容部分不会产生错误；只是这些占位符区域将没有内容被插入。\n\
  \n\n\n\n母页的另一个强大功能是支持嵌套。考虑一下示例应用程序的站点设计。该站点有两个主要且不同的区域：一个供普通用户查看和结账物品，另一个供管理员管理可结账的物品。由于用户和管理员的目标不同，这每个区域都可能有不同的菜单结构，但你仍然希望大多数其他结构、视觉效果和感受保持不变。实现此点的一种方法是在母页中确定显示哪种菜单，即采用此处所示伪代码的方法：\n\
  \n```\nif user is administrator\n      show administrator menu\nelse\n      show\
  \ regular menu\n```\n\n另一种方法是通过创建一个主母页来抽象化决策，该主母页包含你希望在每个页面上重复的区域，然后创建另一组母页，其中包含你想要显示的各种菜单。这种拆分方式在图\
  \ 7.3 中显示。\n\n![嵌套母页的示意图，其中页眉区域和页脚区域为浅蓝色；页面内容为深蓝色；特定菜单和左侧区域为黑色。](img/c07f003.jpg)\n\
  \n`图 7.3`中的深色区域显示了将在嵌套内容页管理的内容。实现此功能的代码所示：\n\n字体 父母页\n\n```\n<%@ Master Language=\"\
  C#\" AutoEventWireup=\"true\" CodeBehind=\"DemoMaster.master.cs\"\n      Inherits=\"\
  RentMyWrox.Demonstrations.DemoMaster\" %>\n<!DOCTYPE html>\n<html xmlns=\"http://www.w3.org/1999/xhtml\"\
  >\n<head runat=\"server\">\n    <title/>\n    <asp:ContentPlaceHolder ID=\"head\"\
  \ runat=\"server\">\n    </asp:ContentPlaceHolder>\n</head>\n<body>\n    <form id=\"\
  form1\" runat=\"server\">\n    <header>\n        <!-- Header Area, logos,  etc.\
  \ -->\n        <asp:ContentPlaceHolder ID=\"Header\" runat=\"server\">\n       \
  \ </asp:ContentPlaceHolder>\n    </header>\n    <div id=\"leftpane\">\n        <asp:ContentPlaceHolder\
  \ ID=\"LeftContent\" runat=\"server\">\n        </asp:ContentPlaceHolder>\n    </div>\n\
  \    <div>\n        <asp:ContentPlaceHolder ID=\"MainContent\" runat=\"server\"\
  >\n        </asp:ContentPlaceHolder>\n    </div>\n    <footer>\n        <!-- footer\
  \ content here -->\n    </footer>\n    </form>\n</body>\n</html>\n```\n\n### 嵌套母页\n\
  \n```\n<%@ Master Language=\"C#\" MasterPageFile=\"DemoMaster.master\"\n       \
  \ AutoEventWireup=\"true\" CodeFile=\"NestedMaster.master.cs\"\n        Inherits=\"\
  RentMyWrox.Demonstrations.NestedMaster\" %>\n<asp:Content ID=\"Content0\" ContentPlaceHolderID=\"\
  head\" Runat=\"Server\">\n      <asp:ContentPlaceHolder ID=\"HeadContent\" runat=\"\
  server\">\n      </asp:ContentPlaceHolder>\n</asp:Content>\n<asp:Content ID=\"Content1\"\
  \ ContentPlaceHolderID=\" Header \" Runat=\"Server\">\n     <!-- specific menu here\
  \ -->\n</asp:Content>\n<asp:Content ID=\"Content2\" ContentPlaceHolderID=\"LeftContent\"\
  \ Runat=\"Server\">\n     <!-- left-area sub-menu here -->\n</asp:Content>\n<asp:Content\
  \ ID=\"Content3\" ContentPlaceHolderID=\"MainContent\" Runat=\"Server\">\n    <asp:ContentPlaceHolder\
  \ ID=\"PrimaryContent\" runat=\"server\">\n        </asp:ContentPlaceHolder>\n</asp:Content>\n\
  ```\n\n主母页中没有任何不同之处；它并不知道将将填充其内容区域，因此它只是提供必要的内容占位符。嵌套母页才是它变得有趣的地方。注意声明部分中的区别。嵌套母页有一个额外的属性\
  \ `MasterPageFile`，它建立了当前页面与它将链接的母页之间的连接。在本章的稍后部分创建内容页时，你也会使用相同的方法。\n\n在这里你还被介绍了一个新的服务器控件\
  \ `<asp:Content />`。正如你可能猜想的那样，此标签将此页面上的内容链接到显示该信息的模板区域。本章稍后部分的内容章节将详细描述这种关系，因此我们在这里不会在此花更多时间研究，只需说明这是内容如何关联到\
  \ `<asp:ContentPlaceHolder />` 服务器控件的。图 7.4 展示了完整的关系。\n\n![嵌套母页中关系的图，箭头指向三个项目之间的左侧；内容页内容、嵌套母页内容和父母页](img/c07f004.jpg)\n\
  \n[`图 7.4`](#c07.xhtml_c07-fig-anc-0004）嵌套母页\n\n正如你可以在母页中拥有多个占位符一样，你也可以拥有多层母页。唯一的考虑是，内容页只能引用其所引母页中的占位符，不能引用栈中更高处母页的占位符。\n\
  \n### 在 ASP.NET Forms 中创建内容页\n\n现在你已经知道了如何创建母页，本节描述了如何让你的内容与母页一起显示。你在列表 7.1 中对母页的初步观察有两个\
  \ `<asp:ContentPlaceHolder />` 控件。列表 7.3 包含使用该母页的内容页。\n\n此页面有两个需要理解的新部分。第一个是定义中的\
  \ `MasterPageFile` 引用。它建立了此页面与母页之间的链接。每个要使用母页的页面都必须具有此属性，并且需要填充内容。\n\n另请注意，内容控件之外没有内容；母页内显示的唯一内容是内容控件内部。事实上，任何内容（包括多余的内容）都会导致错误。有时启动项目时没有母页，或者意外创建了\
  \ Web Form 页面，导致内容页与母页之间没有链接。在这些情况下，你将需要通过在定义中添加 `MasterPage` 引用并添加 `Content` 控件，将你的非模板页面转换为使用母页内容占位符的页面。你可能还需要更改文件分配的母页，如下一个活动所示。\n\
  \n虽然系统在内容控件之外有任何内容时会抛出错误，但正如前面提到的，如果并不是占位符控件都有匹配的内容控件，则不会报错。服务器只是会将这些内容控件替换为空值。\n\
  \n### 在 ASP.NET MVC 中创建布局\n\nASP.NET Web Forms 母页允许你创建一个影响任何链接到该母页页面的模板，让你能够将内容插入母页提供的每个区域中。ASP.NET\
  \ MVC 的布局（Layout）有点不同，因为母页依赖服务器控件来指示内容位置和内容标识，而 MVC 没有服务器控件。页面与布局之间的关系是通过建立后进行匹配的。\n\
  \n\n\nASP.NET MVC 采取了不同的方法。其区别在于，任何类型的视图都可以作为布局（layout）；你不一定需要使用特殊类型的文件。让一个布局文件成为布局文件的事实是另一个文件将其指定为布局，并且该布局文件定义了内容应该显示的位置。列表\
  \ 7.4 显示了此空布局文件可能的内容如下。\n\n如你所见，在这个布局页面中，没有任何地方将其与其他布局页面区分开来，除了尚未显示的 Razor 语法命令：`RenderBody`\
  \ 命令。ASP.NET MVC 的 `RenderBody` 命令的作用与 ASP.NET Web Form 主页中的内容占位符非常相似，它指定了另一个文件的内容应该渲染在何处。\n\
  \n默认布局文件和默认主页（master page）之间存在区别，主页通常创建时包含两个不同的占位符区域，一个在 HTML 的 `head` 中，另一个在 `body`\
  \ 中；相反，布局页面仅通过一个 `@RenderBody` 命令生成。然而，你可以通过使用 `@RenderSection` 命令添加额外的可以插入内容的区域。这允许你创建一个与主正文分离的区域的主页，如列表\
  \ 7.5 所示。\n\n你可以根据需要添加任意多个此类不同区域，就像你在 Web Forms 中使用内容占位符控件所做的那样。在接下来的尝试练习中，你将创建一个\
  \ MVC 布局页面。\n\n### 在 ASP.NET MVC 中创建内容视图\n\n拥有布局页面只是过程的一部分；还需要一个在布局页面显示之前引用它的内容页面。ASP.NET\
  \ MVC 内容页面仍然是视图（views）；事实上，使用内容页的视图与不使用内容页的视图之间的唯一区别通常是是否存在包含的 HTML 元素（例如 `<head>`\
  \ 或 `<body>`），因为这些元素通常被认为是布局页面的一部分。这意味着，虽然 ASP.NET Web Form 内容页有指向主页中内容占位符的链接，但在\
  \ ASP.NET MVC 中这并不总是必要的。MVC 的默认行为是视图的完整内容由 `RenderBody` 命令输出，如图 7.13 位于 Layout Page\
  \ 框的中心，并连接到右侧较小的 Content Page 框。”](images/c07f013.jpg)\n\n**图 7.13** 内容页面与 Render\
  \ 命令之间的关系\n\n内容页面到布局页面的链接也非常简单，有两种方法：将每个页面分配给单个布局页面，或将内容页面分配给特定的布局页面。\n\n对于链接每个页的第一种方法，回想\
  \ Web Forms 方法，在创建内容页面期间，你有能力选择将其分配的主页。在创建 MVC 视图时，你具有类似的能力。在图 7.14\n\n**图 7.14**\
  \ 添加视图对话框\n\n“使用布局页面”选项通常默认勾选，你可以打开文件选择器并选择布局页面。然而，感兴趣的是下面这一行（如果在 Razor `_viewstart`\
  \ 文件中设置则留空）。`_viewstart` 文件是 MVC 中解析的任何完整视图都会被读取的文件。如果你在项目的解决方案资源管理器中查看，你会发现 `Views`\
  \ 目录下创建了一个默认的 `ViewStart.cshtml` 文件。从此目录及其子目录提供的每个视图都将通过此文件。通常，`ViewStart` 文件的内容相对简单：\n\
  \n```\n@{\n    Layout = \"~/Views/Shared/_SomeLayoutFile.cshtml\";\n}\n```\n\n此行表示，对于所有在文件内部未指定的文件，视图都应该使用\
  \ `Shared` 目录下的 `SomeLayoutFile`。列表 7.6 显示了在 ASP.NET MVC 中创建视图时的三种不同的基础输出。\n\n如你所见，使用布局和不使用布局的主要区别在于生成的\
  \ HTML 标签以及布局本身被引用的方式。如果布局为 `null`，你就知道该页面不是内容页面，因此它需要包含所有的 HTML 元素，包括 `<html>`、`<title>`\
  \ 和 `<body>`；如果完全缺少布局，那么你就知道用于布局的页面是 `ViewStart` 文件中设置的页面，该页面已经包含了 `<html>`、`<title>`\
  \ 和 `<body>` 元素。否则，你就知道使用的布局页面是文件中定义的那个。\n\n一旦内容页面和布局页面之间建立了连接，内容页面的整个内容将渲染到布局页面\
  \ `RenderBody` 命令的位置。然而，你可能在使用 `RenderSection` 命令以及该内容是如何填充的。为为 `RenderSection`\
  \ 命令提供内容与 ASP.NET Web Forms 使用的方法类似，你必须识别将要添加的内容，但不是使用服务器控件，而是使用 Razor 语法，如下所示：\n\
  \n```\n@section SpecialNotes {\n   <div class=\"primary\">\n        这里有特殊注释。\n \
  \   </div>\n}\n```\n\n要创建内容区域，使用 `@` 字符后关键字 `section`。然后提供区域的名称和指示代码块范围的大括号。这些括号内的所有内容将替换\
  \ `@RenderSection` 命令。由于括号使其成为完全独立的代码块，它可以放在内容页的任何位置。然而，你通常会在页面的顶部或底部看到它，因为它对页面的其他部分干扰较小。你可以根据需要拥有任意多个区域；只需提供所有所需的区域即可。\n\
  \n此外，请记住可能有许多不同的布局页面。考虑你的示例网站如何为 Admin 目录下的文件使用主页，为 MVC 文件使用另一个模板，以及内容是如何不同的。如果该网站完全是\
  \ MVC 或 Web Forms，由于应用程序区域的不同，你仍然需要多个布局文件。\n\n接下来的尝试练习将引导你完成 ASP.NET MVC 内容页面从一个布局页面转换为另一个布局页面的。\n\
  \n### 使用集中基类页面\n\n当你处理 ASP.NET Web Form 页面的后台代码时，你可能在没有思考的情况下注意到这一点：\n\n```\npublic\
  \ partial class ManageItem : System.Web.UI.Page\n```\n\n你可能从第 4 章 回想起，先前的代码片段告诉你\
  \ `ManageItem` 类继承了 `System.Web.UI.Page` 类，因此 `System.Web.UI.Page` 类的所有公共属性和方法在\
  \ `ManageItem` 类中都是可。这里的继承使得你能够轻松访问所有的 Web Form 自定义逻辑和事件处理程序。\n\n你也可以对 ASP.NET MVC\
  \ 控制器执行相同的操作，因为你可能注意到控制器的定义方式非常相似，只是它们继承自 `Controller` 而不是 `System.Web.UI.Page`：\n\
  \n```public class UserDemographicsController : Controller\n```\n\n\n\n你可以利用这种继承关系并将其进一步抽象一个层。这允许你创建一个不同的页面，其中包含的代码将自动适用于多个页面。这种方法可能有处的典型示例包括数据库配置和访问管理、日志记录、国际化（以多种语言和文化显示应用程序的能力），或其他你可能在每个页面上都需要的相同代码的场景。图\
  \ 7.16 为你直观展示了这种外观。包含两个部分，一个没有基类，另一个添加了基类。\n\n![包含两个部分的代码截图：默认控制器和带有自定义基类的控制器。](img/c07f016.jpg)\n\
  \n`图 7.16` 添加基类\n\n你将将为你的 ASP.NET Web Form 页面创建一个基类。这个基类将帮助在渲染的 HTML 页面中设置元数据标签（meta\
  \ tags）。你可能认为这样做是多余的，因为我们在 HTML 头部区域有一个内容占位符（content placeholder），但你会发现使用基类来处理它们会变得简单得多。\n\
  \n如果你不使用基页面，你就必须确保包含头文件 `ContentControl`，然后使用 HTML`<meta>` 元素构建元数据标签。接下来的“尝试一下”将向你展示一个更快、更简单的流程。\n\
  \n## 总结\n\n保持一致的视觉效果和感受是网站品牌的一个重要部分，ASP.NET 提供了支持来满足这一需求。在 ASP.NET Web Forms 中，这种支持是主页面（master\
  \ pages），而在 MVC 中，它被称为布局（layout）。它们都实现了非常相似的需求；然而，由于特定框架的差异，它们的实现方式是不同的。\n\n在主页面中，通过使用\
  \ `ContentPlaceholder` 服务器控件定义了将从其他地方填充内容的页面部分。对于主页面中的每个占位符控件，内容页面中可能有一个关联的内容控件。例如，如果主页面有三个占位符控件，那么内容页面最多可以有三个内容控件，每个控件都链接到主页面中的特定占位符。通过这种方法，内容页面中内容元素之间包含的所有内容基本上替换了占位符控件。\n\
  \nMVC 采用了不同的方法。内容页面变成了布局页面中 `@RenderBody` 命令的完全替换，而不是仅仅用一个控件的内容替换模板内指定区域的内容。唯一的例外是\
  \ `@RenderSection` 方法，它获取内容页面的子集进行替换——即封装在特殊定义的一组括号内的页面部分。\n\n虽然每个框架内模板的实现方式不同，但它们的目标是相同的：为\
  \ Web 应用程序提供一致的视觉效果和感受。ASP.NET Web Forms 特别地为你提供了更多机会来确保应用程序的一致性。你创建了一个基类，它将帮助你轻松地配置所有页面上的元数据，这是一个很容易被忽略的任务。然而，现在每当你创建一个不包含此类信息的页面时，你将收到一个异常，作为你添加该数据的提醒。添加基类利用了标准的面向对象继承，提供了贯穿整个应用程序的功能。\n\
  \n### 练习题\n\n1. **1.** 为什么在视图（views）上使用基类不像在 Web Form 网页页面或 MVC 控制器上使用基类那样简单？\n\
  2. **2.** 在 `ViewStart` 页面中使用 `Layout` 命令的优势是什么？\n\n## 你在本章中学到的内容\n\n| 术语 | 说明 |\n\
  | :--- | :--- |\n| 基类 (Base Class) | 包含在多个页面中可能用的共享功能的类。ASP.NET Web Form 页面可以拥有基类，即插入到继承树中的类。ASP.NET\
  \ MVC 控制器页面也可以拥有基类。 |\n| `@RenderBody` | 视图引擎用于确定何时需要写入内容的 Razor 语法命令。该命令放置在布局页面中，使用时，内容页面的所有输出将用于替换此命令。\
  \ |\n| `@RenderSection` | Razor 中的另一个命令。`RenderBody` 是将整组输出掉到区域作为替换，而 `RenderSection`\
  \ 仅查找内容页面中的任何命名部分并使用该界定的输出。它是布局页面的一部分。 |\n| `@Section` | Razor 关键字，用于定义在 `@RenderSection`\
  \ 命令中显示的具名内容区域。该部分（section）是内容页面的一部分。 |\n| `Content` 控件 | `asp:Content` 控件用于 ASP.NET\
  \ Web Forms 内容页面。它定义了将在主页面 `ContentPlaceHolder` 控件中显示的内容。通过在 `Content` 控件上存在 `ContentPlaceHolderId`，`Content`\
  \ 控件引用 `placeholder` 控件。 |\n| `ContentPlaceHolder` 控件 | `asp:ContentPlaceHolder`\
  \ 控件用于主页面，指示来自内容页面提供的内容将放置在哪里。它不了解将检索的内容，只知道可能有一些。如果内容页面未提供内容，则不会发生错误。 |\n| 模板 (Template)\
  \ | ASP.NET Web Form 主页面和 ASP.NET MVC 布局页面都提供了网站外观的模板化功能，使得许多设计可以位于一个页面中，以便在某处所做的更改可以影响所有页面。\
  \ |\n\n## 第 8 章：导航\n\n### 你在本章将学到：\n\n* 如何在 ASP.NET Web Forms 和 MVC 中创建导航方案\n* 将绝对\
  \ URL 和相对 URL 整合到你的工作流中\n* 深入了解 ASP.NET MVC 的工作原理\n* 如何通过代码将用户发送到不同的页面\n\n\n\n\n\
  \n导航结构的目标是使用户能够轻松、直观地在不同页面之间移动。当你查看标准网站的菜单结构时，你看到的实际上只是移动到该网站特定部分的方法。其他部分可以是任何内容，从静态的“关于我们”页面到允许用户购买汽车的电子商务产品页面。每一个页面都代表一个单一资源——客户端浏览器发送的一个特定请求，Web\
  \ 服务器接收该请求，对其进行某些分析，然后决定如何响应，以便让特定资源满足该请求。\n\n从一个位置移动到另一个位置的主要方法是通过 HTML 锚点标签 `<a\
  \ href=\"Login.aspx\">Login to the Site</a>`。这会导致向 `href` 属性中的 URL 发送 HTTP 请求。你所遇到的几乎每种形式的导航结构都是基于这一个\
  \ HTML 元素。\n\n正如你可能猜的那样，因为有一个 HTML 元素来完成这项工作，因此也有一组基于 ASP.NET Web Forms 的功能，可以帮助你通过服务器控件来构建锚点标签。在这种情况下，就是\
  \ `asp:HyperLink` 服务器控件。尽管可能有一个唯一的服务器控件，但其输出是标准的 HTML 锚点标签。\n\n### 理解绝对 URL 和相对\
  \ URL\n\nHTML 锚点元素在引导用户进入你网站的其他页面方面做了大量工作。然而，你有几种不同的方法可以定义此资源的地址。需要记住，HTTP 请求是向特定的资源地址发出的。该地址被称为\
  \ URL，或统一资源定位符。\n\nURL 有两种不同类型：绝对的和相对的。绝对 URL 包含资源的完整地址，这意味着找到该资源时不需要关于包含导航结构的网站的知识。以下示例是一个绝对\
  \ URL。注意它是如何包含协议和完整服务器地址的：\n\n```html\n<a href=\"http://www.rentmywrox.com/account/login\"\
  >Login</a>\n```\n\n资源所在的位置是不疑问的。然而，使用绝对 URL 可能会出现问题。例如，在你的示例应用程序，使用这种方法意味着你无法链接到工作解决方案中的任何页面，因为链接将与已部署的站点关联，而不是你的本地工作站点。虽然使用绝对\
  \ URL 链接到当前应用程序内的页面并不总是理想的，但在链接到不同域名的页面（例如外部网站）时是必须的。\n\n另一方面，相对 URL 使用了一种更像通往所需页面的方向指示的方法来定义定位符。这些指示是基于显示链接的页面。以下代码是相对\
  \ URL 的示例：\n\n```html\n<a href=\"../Admin/ManageItem\">Login</a>\n```\n\n如你所见，地址中没有服务器名称，相反，有一些点和斜杠。每个双点代表在目录结构中向上移动一级；它们充当到达你所需资源的指示。由于这是一组指示，前一个示例中的\
  \ URL 告诉浏览器先在文件结构中向上移动一级，然后进入 admin 目录并查找名为 `ManageItem` 的页面。在 图 8.1 中，此 URL 适用于\
  \ Admin 目录中高亮的 `ManageItem` 页面。\n\n![解决方案资源器的截图，下方列出了文件和文件夹。Admin 目录下的 ManageItem.aspx\
  \ 被高亮显示。](img/c08f001.jpg)\n\n**图 8.1**](#c08.xhtml_c08-fig-anc-0001) 相对 URL\n\n\
  正如在早之前的章节中提到的，你还可以使用波浪号字符 (˜) 来构建 URL。采用这种方法会将前面的示例更改为如下：\n\n```html\n<a href=\"\
  ~/account/login\" runat=\"server\">Login</a>\n```\n\n这是一个重要的区别，因为使用“点”方法，每当任何页面移动时，都必须更新链接——包括包含链接的页面以及与其链接的页面。使用波浪号方法告诉系统转到应用程序根目录并从那里开始，因此持有链接的页面位置的任何更改都不会影响系统确定从哪里找到资源的能力。然而，你可能注意到你必须包含\
  \ `runat` 属性以确保服务器处理 HTML 控件。这是因为使用波浪号字符需要服务器端处理；根目录的值将替换波浪号，因此你获得了一种更灵活的方法。\n\n\
  尽管波浪号需要服务器参与，但还有另一种方法可以允许系统请求基于服务器根目录的 URL。这种方法看起来如下所示：\n\n```html\n<a href=\"/account/login\"\
  >Login</a>\n```\n\n区别是细微的，但通过在 URL 前加上正斜杠字符 (`/`)，你是在告诉系统从服务器根目录开始并沿着目录树向下查找。\n\n\
  在 URL 前加上斜杠字符 (`/`) 只有在你确定你正在处理的应用程序永远不会作为虚拟应用程序部署时，应该这样做。\n\n### 理解默认文档\n\n你是否想过输入诸如\
  \ [`www.wrox.com`](http://www.wrox.com) 的简单 URL 如何将你带到内容页面？这是因为服务器被分配了一个特定的文件，位于处理目录调用（包括根目录）的方向，这意味着该页的内容被定义为默认文档。\n\
  \n默认文档的指定是 IIS 配置的一部分，并且适用于 ASP.NET Web Forms，因为预期有一个文件来处理不包含文档的调用。传统上定义了多个默认文档，但最常见的文件是\
  \ `Default.aspx`。当向 [`domain.com`](http://domain.com)/ 发请求时，返回根目录下的 `Default.aspx`\
  \ 文件。\n\n当请求目录而不是目录内的内容时，服务器使用默认文档；因此，根目录下的 `Default.aspx` 文件处理默认调用。由于这种内置功能，建议你在尝试链接到它时不声明\
  \ URL 的默认部分；相反，仅引用目录名称并允许服务器提供默认文件。\n\n\n\n\n\n当你创建一个 ASP.NET 项目时，它会包含一组默认配置，其中默认路由。这些默认信息是\
  \ `App_Start\\RouteConfig.cs` 文件的一部分（参见图 8.3）。\n\n![带有代码的初始 RouteConfig.cs 文件的截图](img/c08f003.jpg)\n\
  \n图 8.3 初始 `RouteConfig.cs` 文件\n\n此时，你只关注该文件的一个部分，即包含 `FriendlyUrlSettings` 的第一部分。添加\
  \ `FriendlyUrlSettings` 允许你在调用 ASP.NET Web Forms 时无需使用 `.aspx` 扩展名。这意味着你可以通过调用 `ManageItem`\
  \ 来创建一个访问名为 `ManageItem.aspx` 文件的链接，而不需要在 URL 中包含扩展名。\n\n`FriendlyUrlSettings` 不仅允许使用带扩展名的文件名，还允许向\
  \ URL 中添加其他信息。这是友好 URL（friendly URLs）的另一个功能，即解析完整的 URL 值并将其信息拆分，以便在页面的后代码（code-behind）中使用。因此，`ManageItem\\\
  36` 是系统可以理解的，并允许访问 URL 中的值。然而，这并不是自动发生的；你需要做一些工作来访问这些信息。例如，假设你想用户访问 URL [`www.servername.com/SomePage/2/20/2015`](http://www.servername.com/SomePage/2/20/2015)，其中该工作将由名为\
  \ `SomePage.aspx` 的页面处理。如果附加到 URL 的值代表日期，你将像这里所示访问它们：\n\n```\nprotected void Page_Load(object\
  \ sender, EventArgs e)\n{\n    List<string> segments = Request.GetFriendlyUrlSegments();\n\
  \    int month = int.Parse(segments[0]);\n    int day = int.Parse(segments[1]);\n\
  \    int year = int.Parse(segments[2]);\n}\n```\n\n使用 `FriendlyUrls` 允许你为 ASP.NET\
  \ MVC 和 Web Forms 两种方法在 URL 方面构建一致的用户体验。在引入 `FriendlyUrls` 之前，你必须采用更传统的查询字符串方法，例如\n\
  \n```\nhttp://www.servername.com/SomePage.aspx?SearchDate=2-20-2015 \n```\n\n查看这两个\
  \ URL 之间的区别，你可以看到对于像网络搜索引擎爬虫这样的程序，理解一个包含数据作为地址部分的特定资源是容易得多，而不是像查询字符串那样，仅仅在 URL 末尾附加一些额外信息的资源的\
  \ URL。\n\n还有其他管理友好 URL 解析结果的 URL 段的方法，但它们包含在后续章节中使用的其他服务器控件中。\n\n## 使用 ASP.NET Web\
  \ Forms 导航控件\n\nASP.NET Web Forms 提供的不仅是锚点标签，用于构建网站的导航功能。三种不同的服务器控件可以帮助你：`TreeView`、`Menu`\
  \ 和 `SiteMapPath` 控件。这些控件都提供了一种管理 Web 应用程序链接和导航的方法。`TreeView` 和 `Menu` 控件创建一个供用户点击的链接列表，而\
  \ `SiteMapPath` 控件提供了一种“面包屑导航”方法来查看自己在站点上下文中的位置。图 8.4 显示了这两个链接管理控件默认是如何渲染的。\n\n\
  ![浏览器窗口中渲染的 HTML 截图，带有两个链接管理控件：默认的 Tree View 和 Menu。(images/c08f004.jpg)\n\n图 8.4\
  \ `TreeView` 和 `Menu` 控件的默认显示\n\n这两个控件渲染相同内容的方式略有不同。`TreeView` 使用展开器来打开或关闭任何包含的子菜单内容，而\
  \ `Menu` 控件使用“弹出式”方法，提供一个鼠标悬停的区域，导致子菜单展开并可见。\n\n正如你可能注意到的，两个控件都输出相同的导航结构。该结构定义在一种特殊的文件中，站点地图（sitemap）。在\
  \ ASP.NET Web Forms 中，sitemap 是一个特殊的 XML 文件，包含了应用程序使用的结构定义。列表 8.1 显示了 `Web.sitemap`\
  \ 文件的内容，用于创建在图 8.4 中显示的项目。\n\n文件中的每个节点都是 `siteMapNode`，可能包含也可能不包含其他 `siteMapNodes`。当一个节点包含其他节点时，它会创建一个控件能够解释的父子关系。`Menu`\
  \ 控件默认使用向右的箭头，而 `TreeView` 控件使用 +/– 约定来访问子节点。\n\n`siteMapNode` 包含三个属性：`url`、`title`\
  \ 和 `description`。`url` 是你想要打开的页面，`title` 是将显示为链接可点击部分的文本，而 `description` 成为鼠标悬停在链接上时显示的提示框。\n\
  \n获取 `web.sitemap` 的 `SiteMapDataSource` 尚未讨论。这是一个作为数据的服务器控件。列表 8.2 显示了整个页面标记。\n\
  \n现在菜单数据已经配置，下一个任务是添加使用数据的内容。这就是 `Menu` 控件大显用场的地方。\n\n### 使用 Menu 控件\n\nASP.NET\
  \ Web `Menu` 控件将站点地图文件解析为一系列 HTML 元素，让用户导航应用程序。作为一个典型的服务器控件，你可以管理它的各种属性，如表 8.1 所示。\n\
  \n| 属性 | 描述 |\n| :--- | :--- |\n| `CssClass` | 为处理期间输出的 HTML 元素分配类名 |\n| `DataSourceId`\
  \ | 管理 `Menu` 控件与管理站点地图文件的 `SiteMapDataSource` 控件之间的关系 |\n| `DisappearAfter` | 控制鼠标离开后动态菜单可见的时间。值为毫秒，默认值为\
  \ 500，即 0.5 秒。 |\n| `IncludeStyleBlock` | 指定 ASP.NET 是否渲染用于样式的层叠样式表（CSS）定义块。你可以通过将属性设置为\
  \ true、运行页面并在浏览器中查看页面来获取 `Menu` 控件生成的默认 CSS 块。然后你可以查看页面源代码并将 CSS 块复制到页面标记或单独的文件中。\
  \ |\n| `MaximumDisplayLevels` | 指定为提供的动态子菜单层数。例如 `3` 意味着只有嵌套深度三层的值将被渲染。超过三层的项目不会作为此菜单的一部分显示。\
  \ |\n| `Orientation` | 提供菜单写入的方向，水平或垂直 |\n| `RenderingMode` | 指定 `Menu` 控件渲染 HTML\
  \ 表格元素和内联样式，还是列表项元素和层叠样式表（CSS）样式 |\n| `StaticDisplayLevels` | 定义由 `Menu` 控件输出的非动态层数\
  \ |\n| `Target` | 指定打开请求页的目标窗口 |\n\n\n\n\n\n# 表 8.1 菜单控件属性\n\n下一步是利用这些信息在示例应用程序中添加一个菜单控件，如下文的“尝试一下”所示。\n\
  \n图 8.11 中的内容包含一个有趣的项，你在为 `Menu` 控件添加样式时会用到它。为用户控件样式有两种主要方法，而 `Menu` 控件同时支持这两种方法。第一种是“老派”方法，即直接在控件上添加样式。这就是为什么你在\
  \ `Menu` 控件中可以看到如 `BackColor` 和 `BorderColor` 等属性；这些属性允许你在控件级别对渲染后控件的外观和感受进行完全控制。\n\
  \n第二种方法（你你为止使用的方法）是通过使用 CSS。在接下来的“尝试一下”中，你将为菜单结构添加一些样式。\n\nASP.NET Web Forms 的导航由传统的\
  \ Web Forms 服务器控件方法支持，在这种情况下是 `Menu` 控件。`Menu` 控件读取 XML 文件，然后将适当的 HTML 渲染到页面。你可能会问，为什么要采用这种方法而不是手动构建菜单呢？这种方法提供的主要优势之一是可以动态更改菜单结构。由于文件在每次创建菜单时都会被读取，你可以在无需更改任何代码的情况下更改网站的完整导航方案。当你从用户那里获得反馈时，这可能特别有用。这种灵活性允许你持续监控用户体验并更改网站，而无需维护任何源代码。\n\
  \n使用 ASP.NET MVC 方法构建导航结构时，你没有这种能力，因为它需要手动构建这些菜单链接。我们接下来将介绍这一点。\n\n## 在 ASP.NET\
  \ MVC 中导航\n\nASP.NET Web Forms 中的导航非常容易理解：请求一个 URL，如果存在一个同名的独立物理页面，则调用该页面，进行处理，并将处理结果返回给客户端。解释请求是直观的。然而，ASP.NET\
  \ MVC 则所不同，因为确定应该调用哪些代码涉及到一个完全不同的过程。没有物理页面来响应请求。相反，在系统确定了要调用哪个方法后，会调用一个简单的方法。\n\n\
  确定要调用哪个方法的工作被称为 ASP.NET MVC *路由*（routing）。路由是一种模式匹配系统，负责将传入的浏览器请求映射到指定的 MVC 控制器操作（方法）。当\
  \ ASP.NET MVC 启动时，应用程序会在框架的路由表中注册一个或多个 URL 模式。这些模式告诉路由引擎如何处理匹配这些模式的请求。当路由引擎在运行时接收请求时，它尝试将请求的\
  \ URL 与与其注册的 URL 模式进行匹配，并根据模式匹配返回响应，如图 8.13 所示。\n\n![从请求的 URL 到返回的页面以及 404 错误的路由过程流程图。](img/c08f013.jpg)\n\
  \n**图 8.13** 路由过程\n\n### 路由 (Routing)\n\nASP.NET MVC 路由负责确定为给定的 URL 执行哪个控制器方法。路由是映射到处理器（即控制器上的一个操作）的\
  \ URL 模式。路由由以下属性组成：\n\n*   **路由名称 (Route name)：** 路由名称用作特定路由的引用。每个路由必须具有唯一的名称。通常，此名称仅在定义路由时需要，但如果需要，它也提供了在代码中访问特定路由的能力。\n\
  *   **URL 模式 (URL pattern)：** URL 模式包含字面值（例如已知字符串值）和变量占位符（称为 URL 参数）。这些字面量和占位符是由斜杠（`/`）字符分隔的\
  \ URL 段。\n*   **默认值 (Defaults)：** 每当你定义一个带有变量占位符的路由时，你都有机会为该参数分配默认值。你可以为每个占位符分配默认值，也可以完全不分配——取决于你构建路由时所采取的方法。\n\
  *   **约束 (Constraints)：** 约束 set 是一组应用于 URL 模式的规则，用于更精确地定义该模式可能匹配的 URL。\n\n构建 URL\
  \ 结构的每种不同方法都需要相应的路由定义。通过 Visual Studio 骨架创建的 ASP.NET 应用程序还包含默认路由。\n\n### 默认配置和路由\n\
  \n当你创建一个 ASP.NET MVC 项目时，它会包含一组路由配置，包括一个默认路由。这些默认信息是 `App_Start\\RouteConfig.cs`\
  \ 文件的一部分，如图 8.14 所示。\n\n![带有代码的初始 RouteConfig.cs 文件页面截图。](img/c08f014.jpg)\n\n**图\
  \ 8.14** 初始 RouteConfig.cs 文件\n\n所示，默认的 ASP.NET 项目添加了一个使用以下约定定义 URL 模式的通用路由：\n\n\
  ```\nurl: \"{controller}/{action}/{id}\"\n```\n\n使用上述模板，`http://www.servername.com/DemoModel/Details/57`\
  \ 的 URL 将导致应用程序尝试寻找名为 `DemoModelController` 且具有名为 `Details` 操作的控制器。\n\n一旦路由引擎找到了正确的控制器，它下一步尝试的是查找与\
  \ URL 部分匹配的操作。当引擎找到操作时，它会分析参数列表，以确定 URL 与参数之间是否存在匹配。然而，你必须小心如何设置它。考虑以下代码：\n\n```csharp\n\
  public ActionResult Details(int id)\n{\n    return View();\n}\npublic ActionResult\
  \ Details(string id)\n{\n    return View();\n}\n```\n\n这看起来是非常直观的，因为人们可能认为 `http://www.servername.com/DemoModel/Details/57`\
  \ 会进入第一个方法，而 `http://www.servername.com/DemoModel/Details/Orange` 会进入第二个方法。然而，你将得到图\
  \ 8.15 所示的错误。\n\n![“/”应用程序歧义操作异常的错误截图。](img/c08f015.jpg)\n\n**图 8.15** 歧义操作异常\n\n\
  此错误表明路由解析并不像看起来那么简单。预期是 URL 可以被解析为特定控制器上的单个操作。这意味着你必须确保避免传统 C# 开发中可以进行的方法重载。因此，如果你希望能够向方法传递整数或字符串，那么你必须对方法进行一些更改，通过创建一个新的操作来处理其中一种情况（例如\
  \ `DetailsByName(string name)` 操作），或者创建一个单个方法并在方法内部执行工作，如下例所示：\n\n\n\n\n\n```csharp\n\
  public ActionResult Details(string id)\n{\n    int idInt;\n    if (int.TryParse(id,\
  \ out idInt))\n    {\n        // 如果 id 是可以根据 Id 从数据库提取产品的整数，则执行操作\n    }\n    else\n\
  \    {\n        // 当 id 不是整数时执行操作，例如通过名称获取产品\n    }\n    return View();\n}\n```\n\
  \n在这种情况下，最佳方法是始终创建一个特定的 action 来专门处理不同的情况。如下例所示，拥有一组 action 对于开发者和系统来说都更容易，以便在查看路由解析时能够成功理解预期是什么：\n\
  \n```csharp\npublic ActionResult Details(int id_id)\n{\n    // 根据 Id 从数据库提取产品的的操作\n\
  \    return View();\n}\npublic ActionResult DetailsByName(string id)\n{\n    //\
  \ 根据 Name 从数据库提取产品的操作\n    return View();\n}\n```\n\n第一种方法将被 [`www.servername.com/DemoModel/Details/57`](http://www.servername.com/DemoModel/Details/57)\
  \ 调用，而第二种方法将被 [`www.servername.com/DemoModel/DetailsByName/Orange`](http://www.servername.com/DemoModel/DetailsByName/Orange)\
  \ 调用。这两种方法都将被默认路由覆盖，因此不需要额外的路由配置。\n\n然而，默认路由并不一定满足所有需求。想象一种情况：你可能希望用户能够获取比单个参数值更具体的详细信息——例如查看\
  \ DemoModel 并想查看关于某个橙子的详情。你想要使用的 URL 是 [`www.servername.com/DemoModel/SomeAction/8/orange`](http://www.servername.com/DemoModel/SomeAction/8/orange)。默认路由不匹配此项；事实上，如果你将此项添加到任何已运行的链接中，你会发现系统会尝试解析\
  \ URL，但它找不到匹配项，你将收到 404 - File Not Found（找不到文件）错误。\n\n你需要做的是在 `RouteConfig.cs` 文件创建一个新的路由，然后将新的\
  \ action 添加到控制器中，如下代码所示。这确保了 [`www.servername.com/DemoModel/SomeAction/8/orange`](http://www.servername.com/DemoModel/SomeAction/8/orange)\
  \ 的 URL 能够找到相应的 action，并且参数被成功设置。\n\n```csharp\nroutes.MapRoute(\n        name:\
  \ \"twoParam\",\n        url: \"{controller}/{action}/{id}/{name}\",\n        defaults:\
  \ new { action = \"Index\"},\n        constraints: new { id = @\"\\d+\" }\n    );\n\
  public ActionResult DetailsWithName(int id, string name)\n{\n    return View();\n\
  }\n```\n\n构建路由和 action 有两种不同的方法。在第一种方法中，路由的配置允许通过不同的 URL 调用同一个方法。在第二种方法中，较少考虑重用，因此创建了更多的\
  \ action 来处理每种情况。建议始终采用第二种方法；它可能需要你创建更多的 action，但每个 action 都会针对给定标准更加具体。这使得应用程序更容易理解，因为更容易预测哪个\
  \ action 处理每个请求。\n\n在 ASP.NET MVC 中尝试构建导航体系时，理解 URL 与响应请求的 action 之间的关系非常重要。现在你对路由如何工作已经有了更深入的理解，下一节将解释如何在没有\
  \ ASP.NET Web Forms 服务器控件的情况下创建导航结构。\n\n### 创建导航结构\n\n正如你之前看到的，导航结构的主要组件是 `<a>`\
  \ HTML 锚点标签。这是 ASP.NET Web Forms `Menu` 控件创建的所有内容，因此在处理 ASP.NET MVC 应用程序时，你只需要创建这些。由于没有服务器控件的概念来帮助，你必须手动创建所有结构，尽管有\
  \ HTML 辅助方法的支持。\n\n幸运的是，你已经了解输出内容应该是什么样子了，因为你已经在 Admin 部分创建过 HTML。这意味着你只需要创建相同的结构，就可以实现一个与网站\
  \ Web Forms 区域外观和感受完全相同的用户界面。\n\n当你开始进行这些操作时，你会发现可以使用一些辅助方法（helpers）：\n\n*   `@Html.ActionLink`\
  \ 方法写出一个完整的锚点标签。\n*   `@Url.Action` 方法创建一个 URL，而不是完整的锚点标签。\n\n以下是各者的示例：\n\n```html\n\
  @Html.ActionLink(\"textLink\", \"actionName\", \"controllerName\")\n<a href=\"@Url.Action(\"\
  actionName\",\"controllerName\")\">textLink</a>\n```\n\n这二者都被渲染为相同的 HTML：\n\n```html\n\
  <a href=\"/controllerName/actionName\">textLink</a>\n```\n\n这意味着，当你在创建 ASP.NET MVC\
  \ 导航结构时，是你自己创建 `<a>` 链接，而不是让服务器控件来完成。然而，你不需要手动编写所有内容，因为你可以使用辅助方法，正如下一个“试一试”示例中所示。\n\
  \n### 程序化重定向\n\n程序化重定向是 ASP.NET Web 应用程序中非常有用且常见的操作。最常用的用途之一是提交表单以在数据库中创建某种新项目。当使用\
  \ ASP.NET Web Forms 时，包含表单的页面会回传（post back）自身，并在那里对信息进行验证和持久。传统的场景会将用户发送到一个列表，他们可以在那里查看刚刚添加的项目。\n\
  \nASP.NET Web Forms 支持两种将用户重定向到不同页面的方法：客户端重定向和服务器重定向。使用客户端重定向时，服务器向客户端发送特殊响应，浏览器将其解释为获取新页面的请求。使用服务端重定向时，服务器在一个资源处接受请求，然后程序化地使用另一个资源来处理它。\n\
  \n### 程序化将客户端重定向到不同页面\n\n你可以使用两个不同的命令来管理客户端浏览器发生的重定向：`Response.Redirect` 和 `Response.RedirectPermanent`。它们的作用略有不同：`Redirect`\
  \ 向浏览器返回 `302` 状态码，而 `RedirectPermanent` 命令向浏览器发送 `301` 代码。\n\n使用这两个命令中的任何一个都非常简单：\n\
  \n```csharp\nResponse.Redirect(\"~/SomeFile.aspx\");\nResponse.RedirectPermanent(\"\
  ~/SomeFile\")\n```\n\n一旦系统遇到 `Redirect` 或 `RedirectPermanent` 命令，它会立即向客户端浏览器返回状态码。这意味着该命令之后的任何代码都不会被调用。此流程如图\
  \ 图 8.17 所示。\n\n![带有 Response.Redirect 和 Response.RedirectPermanent 的客户端重定向流程图。流程用箭头标记：Create.aspx、Browser\
  \ 和 List.aspx。](img/c08f017.jpg)\n\n**图 8.17** 客户端重定向流程\n\n\n\n\n\n这些客户端重定向通常仅用于\
  \ ASP.NET Web Forms，而非 MVC。虽然 MVC 支持该技术，但由于具备从控制器返回任何视图的能力，通常意味着不需要执行这一步。你将在“服务器端重定向”（Server-Side\
  \ Redirects）章节中学习更多内容。\n\n在接下来的活动中，你将添加一个新页面，该页面将用户重定向到另一个页面。\n\n客户端重定向允许开发者告诉客户端从不同的地址请求不同的资源。这意味着当客户端收到重定向请求时，会产生一次额外的请求-响应过程。因此，由于第二次调用会产生性能开销。ASP.NET\
  \ Web Forms 也支持服务器端重定向。此外，ASP.NET MVC 支持服务器端处理，允许开发者根据需要返回各种视图，这从根本上消除了对任何客户端重定向的需求。\n\
  \n### 服务器端重定向\n\n服务器端重定向（或传输）与客户端重定向的不同之处在于，请求是针对特定资源发出的。服务器并不是对该资源做出响应，而是运行重定向命令，并根据传输指定的来自备用资源的内容进行响应。\n\
  \n执行这种传输有两种不同的方式：`Server.Transfer` 和 `Server.TransferRequest`。`Transfer` 方法会终止当前页面的执行，并使用指定的页面\
  \ URL 路径开始新页面的执行。`TransferRequest` 方法的区别在于，它使用指定的 HTTP 方法和标头对指定的 URL 进行异步执行。这意味着，使用\
  \ `Transfer` 方法需要一个可以调用的物理页面（Web Form），而 `TransferRequest` 则不需要。相反，`TransferRequest`\
  \ 执行的是一次完整的调用，因此它可以将控制权转移给 MVC 页面。在使用 `Server.Transfer` 时有两个可能的参数：\n\n* 第一个是用于处理请求的资源\
  \ URL。\n* 第二个是可选参数，指定表单主体是否应随新调用一起进行传输。\n\n代码如下：\n\n```\nServer.Transfer(\"/Admin/ItemList\"\
  , true);\n```\n\n这行代码告诉服务器停止处理当前请求，转而处理 `‘Admin/ItemList’` 页面。第二个参数告诉系统包含提交给初始资源的任何表单内容。在许多情况下，你不需要发送这些信息，但在某些情况下可能会很有用。由于所有工作都由服务器处理，因此在移动信息时不会花费额外时间；因此，取决于你是否需要这些信息。如果不需要，就不要包含。第二个参数是可选的。如果不包含，则默认行为是在传输期间传输查询字符串和表单信息。\n\
  \n第二种方法 `TransferRequest` 看起来非常相似，不同之处它可以有更多的参数：\n\n```c\npublic void TransferRequest(\n\
  \    string path,\n    bool preserveForm,\n    string method,\n    NameValueCollection\
  \ headers\n)\nServer.TransferRequest(\"/DemoModel/Details/3\", true, \"GET\", null);\n\
  ```\n\n你可以仅使用第一个参数进行传输，也可以在需要时使用第一、二参数，就像使用 `Transfer` 方法一样。然而，在许多情况下，你可能想指定请求使用的\
  \ HTTP 动词，这需要你同时发送一组请求头。在前例中，使用 `null` 是因为你不需要添加任何额外的头。\n\n在接下来的“尝试一下”（Try It Out）中，你将同时使用两种传输方法，以熟悉它们在请求处理过程中各自的作用。\n\
  \n虽然服务器传输和客户端传输都能让你提供不同的资源来管理请求处理，但它们采取的方法不同。客户端方法会向浏览器发送重定向请求。这意味着会产生额外的客户端请求-响应周期，并且会在浏览器地址栏中向用户显示新\
  \ URL。服务器端传输消除了额外的请求-响应周期，并且不会替换浏览器地址栏中的 URL。上一个活动演示了这种方法如何让你显示由另一个页面创建的项目详情，同时仍显示\
  \ WeeklySpecial 的地址。\n\n你选择哪种方法取决于你的需求。通常，这取决于你是否想要公开这次传输。如果你这样做（例如当页面实际上已经移动时），那么你想要使用\
  \ `Response.Redirect`，甚至可能是 `Response.RedirectPermanent`，以便被替换的页面最终被移除。如果你只是想做类似示例应用程序中\
  \ WeeklySpecial 所做的事，那么 `Server.TransferRequest` 是是一种管理重定向的更合适的方法。与其他任何选择一样，它最终取决于你希望最终用户获得什么样的体验。\n\
  \n最后一种重定向类型是 MVC 中的服务器端重定向概念。如之前提到的，这是一个非常不同的概念，因为从一个页面重定向到另一个页面的想法并不相同，因为 ASP.NET\
  \ MVC 中没有页面。图 8.22 显示了如果你使用一种在创建项时 UI 将用户返回到列表页的过程，这两种方法之间的区别。\n\n![Server.Transfer\
  \ 和 ASP.NET MVC 在服务器传输中页面流程的图示。流程由从和指向 Create.aspx、List.aspx 的箭头标记，分别对应 Server.Transfer\
  \ 中的和 ASP.NET MVC 中的 Create Action、Index Action 以及包含 List 的 View。](img/c08f022.jpg)\n\
  \n图 8.22 页面流的服务器传输\n\nASP.NET Web Forms 和 MVC 中重定向的主要区别在于，控制器仅决定返回哪个视图，因此不存在传输的概念。\n\
  \n### 导航的实用技巧\n\n导航既是网站中最容易构建的部分，也是设计中最困难的部分，因为它要求你预判所有用户可能需要的内容——对于一个不断增长的网站更是如此。在构建结构（struct\
  \ 此处应为结构）时，请记住以下提示：\n\n* 分类至关重要。随着 Web 应用程序提供的信息和功能不断增加，以用户理解的方式对其进行组织将变得越来越重要。\n\
  * 限制菜单深度。多层菜单会导致困惑，并难以做出正确选择。当你确实有一组深层次的关系时，不要一次性显示所有内容。相反，当用户选择特定路径时，再显示额外的层级。\n\
  * 你了解你的业务。大多数用户并不了解。不要根据你的业务部门来构建导航结构，除非这些差异对访问者来说显而易见。相反，你的结构应该符合用户访问网站的原因，而不是你的数据模型。\n\
  \n\n\n\n\n为您的网站创建一个清晰、直观的导航方案至关重要，因为它能帮助用户访问网站的不同区域。导航结构的关键是 HTML 锚点标签 `<a>`。该标签是从一个页面移动到另一个面的主要方式，因此每当你考虑导航时，实际上是在考虑如何构建您的锚点标签。\n\
  \n锚点标签的一个重要部分是所请求资源的地址，或 URL。这些 URL 有两种类型：相对 URL 和绝对 URL。绝对 URL 通过完整的互联网地址指向目标资源。相反，相对\
  \ URL 指向包含在您应用程序内部的资源。通常，当引用网站外部的 URL 或无论应用程序运行在何处都保持不变的 URL 时，会使用绝对 URL。\n\nASP.NET\
  \ Web Forms 中有三个主要的菜单支持控件：`Menu` 控件和 `TreeView` 控件，它们都可以创建完整的导航结构；而 `SiteMapPath`\
  \ 控件则显示面包导航。本章涵盖了 `Menu` 控件，但使用 `TreeView` 控件的方法非常相似。当你在 MVC 中工作时，你无法享受到使用服务器控件，因此你必须自己构建导航结构，但你有几个辅助工具：一个可以为你创建锚点标签，另一个可以根据各种参数构建\
  \ URL。\n\n导航结构允许用户在您的应用程序中移动。您还有通过程序化的方式在站点中移动的能力。主要有两种方法。第一种是您的应用程序向客户端发送代码，由客户端请求新资源，即\
  \ `Response.Redirect`。第二种是服务器处理传输；对一个资源发出请求，服务器将该请求传输到创建响应的不同资源，即 `Server.Transfer`\
  \ 和 `Server.TransferRequest`。\n\n这两种程序化方法都是基于 ASP.NET Web Forms 的，MVC 不使用相同的页面间传输方法。相反，控制器处理请求并决定返回给用户的视图。这里没有传输，仅仅是视图的选择，因为与\
  \ Web Forms 不同，URL 引用的是代码而不是文件系统中的物理页面。\n\n### 练习题\n\n1. 用户位于 `http://www.servername.com/admin/list.aspx`\
  \ 页面上，并且您有如下链接：`<a href=\"~/default.aspx\">Home</a>`。如果他们点击该链接，他们会到达哪里？\n\n2. 如果你是某个项目的新新开发者，收到了一份关于\
  \ `http://www.servername.com/results/` 页面的错误报告，你会去哪里查找导致该特定缺陷的代码？\n\n3. 为什么要实现友好\
  \ URL（Friendly URLs）？它们为 ASP.NET Web Forms 开发带来了什么优势？\n\n## 本章所学知识\n\n| 术语/概念 |\
  \  |\n| :--- | :--- |\n| 绝对 URL (Absolute URL) | 包含所请求资源完整描述的 URL。这意味着它不仅引用了站点内的位置，还通过域名和服务器名称引用了\
  \ Web 上的位置。 |\n| 客户端重定向 (Client-Side Redirection) | 服务器向客户端发送重定向消息的重定向。这些消息的状态为\
  \ 302 或 301，后者表示永久移动，前者表示临时移动。 |\n| 默认文档 (Default Document) | ASP.NET Web Forms\
  \ 概念，服务器管理员可以在未请求特定页面时，为目录分配一个处理请求的特定页面。这就是系统如何知道例如对 `http://servername.com` 的请求使用\
  \ `Default.aspx` 页面中的代码进行响应的原因；它是默认文档。默认文档可以在整个站点分配，也可以为站点内的每个目录设置。 |\n| 友好 URL\
  \ (Friendly URLs) | 友好 URL 是 ASP.NET Web Forms 的增强功能，使系统能够理解不包含文件扩展名的 .aspx 页面的请求。它还提供了内置功能，从\
  \ URL 中解析信息以便在后置代码中访问。这允许用查询字符串变量替换 URL 变量。 |\n| HTML.ActionLink | 用于 ASP.NET MVC\
  \ 的 HTML 助手，它接受一组参数（如控制器和操作）来构建一个完整的锚点标签。 |\n| 菜单控件 (Menu Control) | ASP.NET Web\
  \ Forms 服务器控件，用于构建完整的菜单。它具有内置的动态菜单功能，可以从父菜单项创建飞出子菜单。它采用 XML 文件作为引用源；该文件包含创建视觉元素所需的所有菜单信息。\
  \ |\n| 相对 URL (Relative URL) | 通过处理服务器和域名之后的所有内容为请求资源提供方向。这意味着它只能指向同一服务器应用程序内的项目。\
  \ |\n| 路由 (Routing) | 一种概念，ASP.NET MVC 应用程序为传入的 URL 构建解释方案。这允许系统根据请求的 URL 确定需要调用哪个控制器，以及使用控制器中的哪个操作来创建响应对象（通常是视图）。\
  \ |\n| 服务器端重定向 (Server-Side Redirection) | 通过运行另一组代码来响应特定请求的能力。通常，请求由处理响应创建的资源接收。但在服务器传输中，请求由一个资源接收，该资源随后将请求转发到提供响应的不同资源。\
  \ |\n| 树形视图控件 (TreeView Control) | ASP.NET Web Forms 服务器控件，用于构建完整的菜单。它具有内置的动态菜单功能，允许打开和关闭子菜单。它采用\
  \ XML 文件作为引用源；该文件包含创建视觉元素所需的所有菜单信息。 |\n| URI | 统一资源标识符，对 URL 的完整描述。URI 包含一个可能在程序化中有用的额外元数据的\
  \ URL。 |\n| URL.Action | 用于构建 URL 的 ASP.NET 助手。通常，该助手用于构建 `anchor` 元素的 `href` 内容，但也用于创建可见的\
  \ URL。它接受一系列参数（通常至少包括控制器和操作）来构建 URL。 |\n| 虚拟应用程序 (Virtual Application) | 一种概念，IIS\
  \ 网站可以在子目录中运行许多不同的应用程序。始终有一个默认应用程序，但可以根据需要设置多个不同的虚拟应用程序。它们通常通过如 `http://www.servername.com/virtualapplicationname/`\
  \ 这样的 URL 进行引用。 |\n\n\n\n\n\n很少有网站在使用 `ASP.NET` 提供的动态能力的同时，却不需要某种方式来存储访问信息或访问期间所采取的数据。这些数据可以简单到记录访问者在浏览网站时点击的页面，也可以复杂到记录包含数千种各种小部件的数百万美元订单。\n\
  \n你有多种方法可以持久化这些数据。\n\n* 你可以将其存储在本地文件系统中，并作为一个具有特殊分隔符的文件。\n* 另一种、也是最常用的存储信息的方法是存储数据库系统中。数据库系统是一种应用程序，其存在的主要理由是管理数据的创建、编辑、删除和检索。有许多类型的数据库系统，从非常简单到极其复杂。本章将介绍\
  \ `Microsoft` 旗舰数据管理应用程序 `Microsoft SQL Server` 的免费版本。\n\n在作为介绍部分安装了该产品后，你将学习应用程序的几个部分，尽管你不会在数据库本身上花费大量时间。我们的方法是尽可能地抽象数据库，因此在安装和介绍之后，你几乎不需要返回数据库系统。\n\
  \n本章的大部分内容致力于与数据库通信。在简要介绍 `Entity Framework`（`Microsoft` 将对象转换为数据库表的方法）后，你将直接进入现在可以持久化的数据的使用。除了处理特定数据的服务器控件工作外，你还将看到\
  \ `MVC` 如何使用各种方法来弥补其控件的缺失。\n\n## 使用 SQL Server Express\n\n`Microsoft` 的 SQL Server\
  \ 产品是世界上最流行的数据库系统之一。`SQL Server` 是一个关系型数据库管理系统 (`RDBMS`)，这意味着它将信息拆分为相关的实体或表。在某种程度上，它与\
  \ 第 4 章 中讨论的对象建模非常相似，这些表每个都包含关于该实体的不同信息，并将其作为列中的一种类型存储。表中的每一项（或行）通常具有某种列（或属性），能够唯一地标识该行。因为有了这个唯一标识符，一个表中的实体可以与另一个表中的实体相关联。这就是名称中“关系”的含义，它是\
  \ `RDBMS` 的主要特征之一。\n\n`RDBMS` 的另一个主要特征是数据从外部系统访问的方式——通过使用自定义语言，即结构化查询语言 (`SQL`)。`SQL`\
  \ 有一个 ANSI 标准定义，但所有主要的 `RDBMS` 供应商都对该语言有自己的解释，这通常是因为他们提供了特殊的竞争特性。`Microsoft` 自己的\
  \ `SQL` 版本称为 Transact-SQL (`T-SQL`)，它提供了各种扩展，如字符串处理、日期处理和数学计算——这些功能都不是标准 `SQL` 定义的一部分。\n\
  \n在本书的其余部分中，你将使用 `SQL Server Express`，它是 `SQL Server` 的免费版本。`Express` 版本在任何影响你此处使用的方面都没有功能限制；相反，它限制了最大内存使用、数据库大小以及它可以使用的\
  \ CPU 核心数。\n\n### 安装\n\n数据库服务器并不是典型的软件。从设计上讲，它必须准备好响应多个应用程序的调用，无论是来自同一机器还是通过网络。它必须可靠、高效，并能够快速处理大量数据。所有这些要求意味着安装数据库并不像安装\
  \ `Visual Studio` 等其他应用程序那样简单。\n\n安装 `SQL Server Express` 有更多步骤，你机器的当前状态可能会影响安装的进行。如果你有一台带有所有最新补丁和设置的全新机器，那么你可能没有任何问题地进行安装。如果没有，你可能在整个过程中需要执行一些额外的步骤。安装程序很好地解释了你需要做什么来解决任何问题，接下来的“尝试一下”（Try\
  \ it Out）指令包括在安装之前运行系统验证步骤，以便当你到达那里时安装可以成功运行。\n\n安装 `SQL Server` 应用程序、服务和工具让你能够开始从你的\
  \ `RentMyWrox` 应用程序持久化数据。然而，在此之前，你将查看作为 `SQL Server` 安装一部分安装的主应用程序工具：`SQL Server\
  \ Management Studio`。\n\n### SQL Server Management Studio\n\n安装后，你应该有一个图标来启动 `SQL\
  \ Server Management Studio` 应用程序，它提供了访问所有主要数据库的功能，包括创建、编辑和删除数据库项。它还提供了访问和评估各种数据库内数据的工具。\n\
  \n为了使用 `SQL Server Management Studio`，你首先需要连接到 `SQL Server`。这是因为 `SQL Server` 是一个服务应用程序，除非另有配置，否则通常在操作系统运行期间一直运行，但它缺少自己的用户界面；了解\
  \ `SQL Server` 在你的机器上运行的唯一方法是检查活动服务列表。这就是为什么 Management Studio 如此重要；它是你与 `SQL Server`\
  \ 交互的界面。\n\n`SQL Server Management Studio` 的核心功能是“对象资源管理器”，它允许用户浏览、选择并对服务器内的任何对象进行操作。\n\
  \n在接下来的“尝试一下”中，你将使用 `SQL Server Management Studio` 创建数据库和一些表，然后管理这些表中的某些数据。这个过程让你看到所有概念是如何结合在一起的、为什么\
  \ `SQL Server` 被称为关系型数据库，以及这能带来的优势。\n\n现在你已经能够使用 `SQL Server Management Studio`\
  \ 创建数据库和表，下一节将数据的维护和访问移动到 `Visual Studio` 中，这样你就能在主要的开发工具中评估应用程序与数据库的交互。此后，你可以使用\
  \ `SQL Server Management Studio` 访问你的数据库。\n\n### 在 Visual Studio 中连接\n\n\n\n\n\n\
  ASP.NET 使用 `Entity Framework` 来访问数据库。`Entity Framework` 是一组支持开发数据面向型软件应用程序的技术。开发者通常在实现两个截然不同的目标之间挣扎：即对他们正在解决的业务问题进行实体、关系和逻辑建模，以及与用于存储和检索数据的数据引擎进行工作。这些数据可能跨越多个存储系统，每个系统都有自己的协议；即使是那些与单个存储系统（如\
  \ `SQL Server`）工作的应用程序，必须在存储系统的需求与编写高效且可维护的应用代码的需求之间取得平衡。\n\n`Entity Framework`\
  \ 的核心特性在于，它允许开发者根据应用程序需要来处理数据，而无需担心数据库表、列和数据类型。由于 `Entity Framework` 可以管理所有这些内容，它让开发者在处理数据时能够在更高的抽象层次上工作，并使他们能够比其他数据库访问方法所需的代码来创建和维护数据面向型应用程序。\n\
  \n当 `Entity Framework` 首次可用时，它仅仅是将你的数据库转换为一组代码中可用的对象的方法。从那以后，它演进为支持多种访问数据库的方法。两种主要方法是\
  \ `data first`（数据优先）和 `code first`（代码优先），这指的是先处理什么：数据库设计还是代码设计。\n\n### Data First\n\
  \n在 `data first` 方法中，代码是根据数据库中的表创建的。这种方法在转换现有的系统时特别常见，因为数据库已经创建好了。使用这种方法，你通过将工具指向数据库，并让它在你选择的表和其他服务器对象上运行，从而从已经创建的数据库表中创建类文件。\n\
  \n现有的表和关系集合越大，使用 `data first` 方法可以节省的时间就越多。然而，当你为新的应用程序进行开发，而你没有一组可以与之交互的已创建数据库时，你可以使用\
  \ `code first` 方法。\n\n### Code First\n\n在 `code first` 方法中，你根据应用程序需要创建业务模型，然后由 `Entity\
  \ Framework` 从这些模型创建数据库表。由于你正在构建一个全新的应用程序，你将采用这种方法，特别是因为这使你能够集中精力处理 `ASP.NET` 部分，而不是花费更多精力去遍历数据库。\n\
  \n与连接 `SQL Server Manager` 一样，第一步是确保你可以到达新服务器并进行身份验证。这允许你的应用程序连接到服务器。然而，在完成此配置后，处理过程将与你所习惯的不同，在于你绝对不希望应用程序在每次访问数据库时都显示登录界面。相反，你必须获取你的登录信息（例如服务器名、用户、密码，可能还有默认数据库），将其放入服务器能够理解的格式中；然后将这些信息存放在应用程序能够理解的位置。这种格式被称为\
  \ `connection string`（连接字符串），你将此连接字符串存储在配置文件 `web.config` 中。\n\n连接字符串是一组包含连接数据库所需的所有信息的格式。下面的片段显示了一个典型的连接字符串：\n\
  \n```\ndata source=ASP-NET\\SQLEXPRESS;initial catalog=RentMyWrox;integrated security=True;\n\
  MultipleActiveResultSets=True;App=EntityFramework\n```\n\n你可能已经从上一个活动中识别了这些值中的。Table\
  \ 9.4 描述了连接字符串中最常见的部分。\n\n| Section | Description |\n| :--- | :--- |\n| Data source\
  \ | 应用程序将连接的服务器名称 |\n| Initial catalog | 你将连接的数据库名称 |\n| Integrated security | 一个布尔值，决定身份验证是否将使用\
  \ Windows 身份验证方法。如果是（如你的情况所示），则应为 true。 |\n| MultipleActiveResultSets | 一个布尔字段，定义是否可以同时运行多个查询\
  \ |\n| App | 指定由哪个框架管理连接。在前面的案例中，这是 `Entity Framework`。 |\n| uid | 当你不使用 Windows\
  \ 身份验证（integrated security=False）时，创建任何身份验证请求时都需要包含用户名。 |\n| Password | 当你不使用 Windows\
  \ 身份验证（integrated security=False）时，创建任何身份验证请求时都需要包含密码密码。 |\n\nTable 9.4 连接字符串的部分\n\
  \n查看之前显示的连接字符串，你可以看到数据库服务器名称为 `ASP-NET\\SQLEXPRESS`，默认连接的数据库是 `RentMyWrox`，使用了 Windows\
  \ 身份验证，需要多个结果集，并且使用 `Entity Framework` 来管理访问。\n\n应用程序访问此连接字符串是因为它可以通过配置文件访问它。该配置文件在处理\
  \ `ASP.NET` 应用程序时被称为 `Web.Config`，它包含许多不同的项目，其中包含一组用于启用应用程序获取动态数据的连接字符串。\n\n从历史上讲，创建连接字符串是一项手动任务，在此过程中很容易出错，导致难以调试的意外结果。现在，处理\
  \ `Entity Framework` 项目时可用的新脚架（scaffolds）现在为你完成了构建这些字符串大部分的工作——你只需要更新 `data source`\
  \ 和 `initial catalog`。\n\n将应用程序连接到数据库的最后一个剩余任务是构建数据库上下文。连接字符串允许应用程序理解它正在连接到什么，而上下文处理所有的通信。\n\
  \n上下文是应用程序使用连接字符串的部分，因此它也是框架管理数据库交互的部分。上下文基本上定义了应用程序模型与数据库对象（如表）之间的关系。在下一个活动中，你把上下文类添加到项目中。\n\
  \n创建初始数据库连接、添加上下文并创建初始模型让你看到 `Entity Framework` 的代码优先方法如何为你隐藏许多数据库工作。然而，它要求你仔细查看模型内部的关系；否则你可能无法获得预期的结果。多对关系就是一个很好的例子。随着你在在本章中继续构建模型，你将看到更多此类。\n\
  \n### 从数据库选择数据\n\n上一个活动中有一个新结构，在控制器中使用了 `OrderBy` 方法。早些，在第 4 章中，你被介绍了一些处理集合时使用的点操作符，例如\
  \ `Add` 或 `AddRange`。还有其他支持与集合交互的运算符。Table 9.5 列出了与集合中包含的信息交互时一些最常用的运算符列表。\n\n|\
  \ Operator | Description |\n| :--- | :--- |\n\n\n\n\n\n| `Find` | 接收一个与 `Key` 属性类型相同的值。如果\
  \ Entity Framework 可以找到包含该 `Key` 的项，则返回该项。如果表中不存在该项，则将抛出异常。该方法永远不会返回多个项。`List.Find(5);`\
  \ |\n| `First` | 返回匹配一组准标准的第一个项。如果没有项，则操作符将抛出异常。使用此方法最简单的方法是通过使用 Lambda 表达式。该方法永远不会返回多个项。`List.First(x=>x.FirstName=\"\
  Arnold\");` |\n| `FirstOrDefault` | 行为与 `First` 操作符类似，但 `FirstOrDefault` 方法在未找到值时返回\
  \ `null`，而不是抛出异常。因此，建议优先使用 `FirstOrDefault` 而不是 `First`，并处理潜在的空结果，而不是让应用程序抛出异常。`List.FirstOrDefault(x=>x.FirstName=\"\
  Arnold\");` |\n| `Where` | 允许为列表添加过滤器。配置方式与 `First` 和 `FirstOrDefault` 方法类似，均使用\
  \ Lambda 表达式，但它不是选择符合标准的第一个项，而是返回所有符合标准的项。如果没有符合标准的项，该方法将返回一个不包含任何元素的实例化列表。根据定义，无论符合标准的项数量有多少，你始终会得到一个列表。`List.Where(x=>x.FirstName=\"\
  Arnold\");` |\n| `OrderBy` | 按升序排序结果集。它可以在其他方法之前或之后使用，同样使用 Lambda 表达式。由于 `OrderBy`\
  \ 可以与其他方法链联，你可以看到根据项链联的顺序可能会产生不同的结果。其他方法支持 `and` 和 `or` 概念，但隐含预期是 `OrderBy` 只包含一个字段，即要排序的主字段。`List.OrderBy(x=>x.FirstName);`\
  \ |\n| `OrderByDescending` | 行为与 `OrderBy` 方法类似，但根据 Lambda 表达式中的字段进行降序排序，而不是升序。\
  \ |\n| `ThenBy` | 允许你将多个排序链在一起。它必须紧跟在 `OrderBy` 之后，并对 Lambda 表达式识别出的项添加额外的升序排序。`List.OrderBy(x=>x.FirstName).ThenBy(x=>x.LastName);`\
  \ |\n| `ThenByDescending` | 与 `ThenBy` 类似，`ThenByDescending` 方法在 `OrderBy` 或 `OrderByAscending`\
  \ 之后添加额外的排序。与 `ThenBy` 一样，你可以链联多个语句，使用其他字段添加有序排序。 |\n| `Take` | 允许你从较大的集合中提取子集。方法的参数是一个整数，定义了方法将提取多少项。该方法返回的项永远不会超过参数，但如果记录数少于参数值，返回的更少。`List.Where(x=>x.FirstName=\"\
  Arnold\").Take(10);` |\n\n## 表 9.5 数据选择与排序\n\n在使用点操作符时，结果可能存在很多重叠，因为 `List.First(x=>x.Id\
  \ == 3)` 产生的结果与 `List.Find(3)` 或 `List.Where(x=>x.Id == 3).First()` 完全相同。方法赋值的顺序也可能很重要；如果列表中有超过\
  \ 10 个项，`List.OrderBy(x=>x.FirstName).Take(10)` 返回的结果集可能与 `List.Take(10).OrderBy(x=>x.FirstName)`\
  \ 不同，因为一种方法是先排序再取 10 行，而另一种方法是先取前 10 行（未排序）然后对输出进行排序。\n\n许多新开发者在处理数据库时会带有些畏惧。然而，没有理由这样做；虽然后台确实有一个数据库，但它不会影响你处理数据的操作，因为处理数据库与处理你手动创建的集合之间没有任何区别。上下文（context）向你隐藏了这一切；你只需处理数据列表，让上下文来处理与系统所有的实际交互即可。\n\
  \n## Web Forms 中的数据控制\n\n现在你已经创建了数据库上下文并设置了第一个模型，下一步是开始集成数据库，并尝试创建、编辑、显示和删除数据的不同方法，因为管理这些内容有很多方法。其中某些方法可能涉及专门设计用于与实时数据交互的服务器控件，而其他方法可能涉及手动设计表单并处理所有交互。在本节中，你将学习几种管理数据库交互的\
  \ Web Form 服务器控件。\n\n### 详情视图 (Details View)\n\n`DetailsView` 是一种服务器控件，旨在创建数据输入表的大量手动工作。在第\
  \ 5 章中，你使用标签和文本框为项目构建了数据输入表。在本章中，你将查看在专门设计支持与数据库交互的服务器控件中使用模型绑定（model binding）。\n\
  \n模型绑定允许你将 HTTP 请求数据映射并绑定到你定义的模型上。模型绑定让你能够轻松地处理表单数据，因为请求数据（POST/GET）会自动传输到你指定的数据模型中。ASP.NET\
  \ 在后台为你执行了这些工作。\n\n各种数据控件之间有一些共同的属性。第一个是定义将显示的内容，通常作为列或字段。此定义让你对将显示的属性、这些属性的标签以及显示顺序进行某些控制。表\
  \ 9.6 显示了主要的字段定义。\n\n| 字段类型 | 描述 |\n| :--- | :--- |\n| `BoundField` | 显示绑定对象的某个属性值。\
  \ |\n| `ButtonField` | 显示定义的命令按钮。通常用于添加或删除按钮。 |\n| `CheckBoxField` | 显示绑定项的复选框。通常用于显示布尔类型的属性。\
  \ |\n| `CommandField` | 显示预定义的命令按钮，例如选择、编辑或删除操作。 |\n| `HyperlinkField` | 以链接的形式显示属性值。这种方法还允许你将第二个字段绑定到\
  \ URL。 |\n| `ImageField` | 在控件中显示图像。 |\n| `TemplateField` | 为每个绑定项显示用户定义的内容。这允许你创建自定义列和字段。\
  \ |\n\n各种数据控件的第二个共同点是将特定操作绑定到后台代码（code-behind）中的事件处理程序。这是必要的，因为虽然服务器控件在构建 UI 的某些方面相当智能，但它理解应该将某些关键部分留给开发者；在这种情况下是与数据库的交互，主要是因为它不想假设在\
  \ UI 中处理的对象实际上持久化到数据库中的相同对象。它可能是一个包含来自多个模型的信息的视图模型，而不是单个模型的所有字段。表 9.7 显示了这些不同的方法。\n\
  \n| 方法 | 描述 |\n| :--- | :--- |\n| `SelectMethod` | 允许控件访问一个方法，该方法可以传入一个键值并返回一个正在处理的对象实例。\
  \ |\n| `InsertMethod` | 允许控件绑定到特定方法，该方法将处理在数据库中创建新项。 |\n| `DeleteMethod` | 允许控件绑定到特定方法，该方法将处理从数据库中删除项。\
  \ |\n\n\n\n\n\n| `UpdateMethod` | 允许控件绑定到一个方法，该方法在控件更新数据库中的项时被使用 |\n\n**表 9.7**\
  \ (#c09.xhtml_c09-tbl-anc-0007) 数据绑定方法\n\n在这两个不同的属性集之间，你可以定义模型中的属性显示在哪里，以及如何处理数据库交互。在接下来的活动中，所有概念都将结合使用，用于管理一个将向你的数据库输入数据的控件。\n\
  \n`DetailsView` 展示了某些 ASP.NET 服务器控件如何一次处理列表中的一个项。还有其他控件可以帮助 ASP.NET Web Form 开发人员在处理数据集时工作。其中一种控件就是\
  \ `GridView`，我们将在介绍介绍。\n\n### Web Form GridView\n\n`GridView` 用于以表格格式显示系列数据的值。每列代表一个字段，每行代表一条记录，就像操作电子表格应用程序一样。`GridView`\
  \ 的某些内置功能包括：\n\n* 排序\n* 更新和删除\n* 分页\n* 行选择\n\n`GridView` 支持与 `DetailsView` 提供的各种列选项，如表\
  \ 9.5 所示，你创建定义的方式与使用 `DetailsView` 时类似。在接下来的活动中，你将向示例应用程序添加一个 `GridView`，以帮助管理你将提供的项目。\n\
  \n正如你刚刚看到的，将 `GridView` 引入你的应用程序并配置为能够展示、编辑和删除信息，只要你愿意在数据访问和控件输出方面做出一些折协，这就并不痛苦。在我们的情况下，这是一个管理页面，因此你将较少关注演示，而专注于功能上。\n\
  \n然而，在处理 ASP.NET MVC 时，不存在同样的疑虑，因为没有服务器控件来帮助你构建应用程序。在下一节中，你将查看这些方法有何不同。\n\n## MVC\
  \ 中的数据显示\n\nASP.NET MVC 中管理数据显示的方法与 Web Forms 中使用的方法不同。它不是提供一个可以让你完成许多不同工作的服务器控件，而是使用脚手架（scaffolding）来帮助你完成页面的部分。然后你可以重新排列内容，完全按照你想要在完成表单中显示的方式——这就是你现在采用的方法。\n\
  \n### MVC 中的列表显示\n\n在 MVC 中列出项目采取了不同的方法，依赖于 HTML 和你所选择的编程语言（`C#` 或 VB）的组合，赋予你管理内容的能力。这让你能够为每一行定制你想要的外观，而不会使用控件进行管理带来的任何潜在限制，并且只需使用代码来重复编写行即可。在接下来的活动中，你将创建访问者可以租用的项目列表。\n\
  \n在之前的活动中，你创建了一个显示信息自定义视图的列表，这比使用 Web Forms 的 `GridView` 服务器控件确实需要投入更多的开发工作。然而，由于可以在视图中运行代码，你对对信息及其显示方式具有完全的控制权。因此，虽然工作确实更多，但自定义程度也高得多。\n\
  \n### 详情视图\n\n现在你已经知道如何在 MVC 中创建列表，本节将简要介绍如何管理详情视图，因为你已经在第 6 章中创建了 MVC 表单。然而，在此时，你将把你创建的表单链接到数据库。\n\
  \n如果你还记得第 6 章，你通过默认脚手架、选择要使用的模板和模型，为 `UserDemographics` 模型创建了一个编辑视图。这些各种模板脚手架方法在处理\
  \ ASP.NET MVC 时都是可用的；但经验丰富的开发者倾向于避免这些模板，因为他们通常会删除大部分内容并手动重新创建。在接下来的活动中，你将构建完全描述产品的单个产品页面。\n\
  \n虽然在 ASP.NET MVC 中创建详情页可能需要更多工作，但它通过允许代码和标记混合的 Razor 语法来弥补了这一点。这让你可以将视图逻辑放入系统中，以便轻松做出决策并按需要显示内容。\n\
  \n## 总结\n\n本章引入了许多新信息，包括新的软件应用程序、新的 Visual Studio 窗口、新的 Web Forms 服务器控件以及新的 .NET\
  \ 概念。作为此的一部分，你开始将应用程序的不同部分连接起来，你现在有了在数据库中持久化信息的能力。\n\n在 Web 应用程序中使用数据库是重要的，对于这个\
  \ Web 应用程序来说更是至关重要的。你安装了 Microsoft SQL Server Express（这是微软旗舰数据库系统 SQL Server 的免费且功能完的版本），在开发过程中作为你的本地数据库。\n\
  \n你通过三种不同的方式访问数据库：SQL Server Management Studio（外部程序）以及两个新的 Visual Studio 窗口：SQL\
  \ Server Object Explorer（SQL Server 对象管理器）和 Server Explorer（服务器资源管理器）。这些工具中的每一个都能让你查看数据库中的信息，并确保你预期的存在的信息已成功地持久化并显示出来。\n\
  \n尽管开发者可以使用各种工具来访问数据库中的信息，但此项目采用了 Entity Framework 代码优先方法，这允许你编写应用程序所需的各种类文件。这种通信是通过在\
  \ `DbContext` 文件中添加每个你想要持久化的模型类的虚成员 `DbSets` 来管理的。那些 `DbSets` 然后可以在上下文文件中变为可用，并可以像典型的列表一样被访问，使用所有相同的相同的操作符和\
  \ Lambda 表达式。\n\n第一次运行上下文时，它将创建所有支持已添加到上下文的模型的表。然而，在此之后，对模型的任何更改都需要你运行数据库迁移（migration）。这些在\
  \ NuGet 包管理器控制台中运行的迁移要求开发者命名迁移并运行更新。这允许根据当前状态将每组增量更改应用于数据库，而该状态是在创建第一组表时创建的数据库表中跟踪的。\n\
  \n\n\n\nASP.NET MVC 支持页面与数据库之间交互的方式与 Web Forms 不同。控制器通过与 `DbContext` 交互来管理所有与数据库的交互。它可以根据选择多个项目或单个项目，并将这些信息作为模型（model）传递给视图（view）。视图可以使用代码和标记的组合来构建返回给用户的最终\
  \ HTML。在使用 MVC 方法时，你不需要担心确保控件配置正确，相反，你可以专注于确保显示效果符合你的预期。与模型属性进行交互的能力允许在视图中进行大量的决策，以支持对视图输出的这种定制化处理。\n\
  \n在后续的章节中，你将看到更多与数据库的交互；这只是对管理这种交互可能性的介绍。正如后续章节所示，管理这种交互的方法略有不同，但所有内容都基于本章涵盖的内容。\n\
  \n### 练习题\n\n1.  **1.** 根据你对代码优先迁移（在 `Entity Framework` 中）的了解，你认为 `__MigrationHistory`\
  \ 表中包含了哪些信息？\n2.  **2.** 属性路由（attribute routing）允许你实现哪些模板方法（template approach）无法实现？\n\
  3.  **3.** 为什么与数据库交互的代码示例中包含下面这一行？它提供了什么好处？\n\n    ```\n    using (RentMyWroxContext\
  \ context = new RentMyWroxContext())\n    ```\n\n## 本章学习收获\n\n| 术语 | 说明 |\n| :---\
  \ | :--- |\n| `add-migration` | `add-migration` 命令在 NuGet 包控制台中运行，它让 `Entity Framework`\
  \ 创建一个新的迁移包——基本上是添加到 `Migrations` 文件夹中的新脚本，根据代码中模型的更改来管理数据库更改。运行 `add-migration`\
  \ 命令时，必须传递迁移包的名称。名称应尽可能唯一，以确保与历史迁移产生混淆。 |\n| Code First (代码优先) | 代码优先是一种 `Entity\
  \ Framework` 方法，其中开发者编写代码而不是直接与数据库交互。`Entity Framework` 然后根据代码类中构建的关系来构建数据库表。 |\n\
  | Connection String (连接字符串) | 连接字符串存储在 `web.config` 文件中，包含了所有描述如何登录数据库的必要信息，以便应用程序能够成功与数据交互。\
  \ |\n| Data First (数据优先) | 数据优先是一种 `Entity Framework` 方法，其中开发者首先创建数据库结构，然后依赖 `Entity\
  \ Framework` 创建应用程序中使用的模型。 |\n| `DbContext` | `DbContext` 是应用程序与数据库之间通信的“大脑”。应用程序创建一个继承自\
  \ `DbContext` 类的上下文类，并在该继承类中添加所有需要保留的项目。一旦用适当类型 `DbSet` 将项目添加到上下文，上下文允许开发者像操作数据库表一样与这些属性交互，从而允许直接到数据库的集合操作。\
  \ |\n| `DetailsView` | 一种 ASP.NET Web Forms 服务器控件，用于查看和维护单个项目。 |\n| `Entity Framework`\
  \ | 一组 .NET 功能，用于抽象化与数据库的通信。它充当对象-关系型数据库映射（ORM）系统，并在后台处理大量从数据库字段到对象属性的映射工作。它还支持数据库交互的许多其他方面，包括数据库迁移和验证。\
  \ |\n| `GridView` | `GridView` 是一种 ASP.NET Web Forms 服务器控件，用于在网格中管理信息列表的显示，类似于电子表格的呈现。然而，它提供了更多功能，通过结合\
  \ `SQLDataSource` 提供了直接从数据库更新和删除信息的内置支持。 |\n| RDBMS | RDBMS 代表关系型数据库管理系统，指的是一种持久化方法，将相似实体分组到单个表中。这些实体与其他实体之间的任何连接都通过关系来定义。\
  \ |\n| Server Explorer (服务器资源管理器) | 一个 Visual Studio 窗口，允许开发者访问不同的项目，包括 Windows\
  \ Server 和 SQL Servers。在处理 Web Form 标记页面时，它支持许多拖放功能。 |\n| SQL | SQL 代表结构化查询语言，用于直接与数据库进行通信。`Entity\
  \ Framework` 抽象了开发者与 SQL 交互的需求，但使用 `GridView` 和 `SQLDataSource` 会向开发者暴露一些 的 SQL，因为它们被用于定义控件与数据库之间的关系。\
  \ |\n| `SQLDataSource` | 一种 ASP.NET Web Forms 服务器控件，充当数据控件和数据库之间的中介。它允许你通过使用映射到\
  \ SQL 语句中占位符的参数来定义受影响的字段。 |\n| SQL Server Express | Microsoft SQL Server 的免费版本，用于开发和学习环境。它是处理来自\
  \ `Entity Framework` 和 `SQLDataSources` 所有持久化数据的 RDBMS。 |\n| SQL Server Management\
  \ Studio (SQL Server 管理工具) | SQL Server 的用户界面。它允许你视觉化地创建、修改和删除数据库对象，包括数据库以及存储在数据库中的任何特定数据。\
  \ |\n| SQL Server Object Explorer (SQL Server 对象资源管理器) | 一个 Visual Studio 窗口，旨在帮助你直接与\
  \ SQL Server 实例交互。 |\n| `update-database` | 该命令在 NuGet 包管理器控制窗口中运行时，会比较数据库版本与代码版本。如果存在任何差异，它将运行来自\
  \ `Migrations` 目录的必要迁移脚本。 |\n\n# 第 10 章：数据处理——高级主题\n\n**你将在本章中学习到：**\n\n*   在应用程序中集成分页和排序\n\
  *   插入和更新数据的不同方法\n*   非 Entity Framework 的数据库访问方法\n*   Web 应用程序中的缓存\n*   Web 应用程序中使用数据的实用建议\n\
  \n## 本章代码下载：\n\n本章的 `wrox.com` 代码下载可以在 `www.wrox.com/go/beginningaspnetforvisualstudio`\
  \ 的 Download Code 标签页找到。代码位于 `chapter10` 下载包，并根据章节中的名称进行单独命名。 |\n\n\n\n上一章介绍了如何使用\
  \ Entity Framework 的代码优先（code first）模式以及将实际数据库隐藏在代码之后。在本章中，你将有机会进一步窥探幕后世界，并与数据库进行更紧密的工作，以便更好地利用数据库服务器提供的一些强大功能。\n\
  \n正如了解如何与数据库交互是一项实用的技能一样，了解何时不该与数据库交互同样重要。缓存（Caching）提供了一个决策机会，决定哪些信息应该直接从数据库交付给用户，或者从缓存（数据已检索一次并在内存中存储了一段时间）中交付。这意味着缓存命中（cache\
  \ hits）性能更高，因为除非过了特定的时间，否则无需调用 Web 服务器和/或数据库。\n\n## 排序与分页\n\n每当你处理一个包含十几个或更多项目的列表时，都应该始终考虑几点。第一是排序，将列表中的项目按特定顺序排列。这对于所有包含几个以上项目的列表都非常重要，因为为显示的信息提供了即时上下文，使用户能够轻松理解。考虑一下你在上一章中创建的项目列表。由于它没有排序，用户无法快速识别出他们想要的内容。这意味着他们被迫检查每一个项目以看是否是他们正在寻找的。然而，对列表进行字母排序允许用户跳过列表以找到他们想要的内容；例如，如果用户正在找一把耙子（rake），跳转到以“R”开头的项目是轻易的事。显然，如果没有明显的排序，寻找项目要困难得多。\n\
  \n你不仅应该在每个列表上有一个预定义的排序，还应该考虑为用户提供控制项目排序方式的能力是否有意义。用户控制的最常见领域之一是降序排序（或字母反序）的能力。使用同样的例子，如果用户正在搜索耙子，提供一个可点击的按钮将很有用，使用户在他们关心的项目之前，只需滚动查看\
  \ R 之前的八个左右的字母（如果是反序的话），从而节省他们的时间并让他们的用户体验更加良好。\n\n同样的规则也适用于分页。一个包含 80 个项目的列表处理起来可能令人令畏，但四个包含\
  \ 20 个项目的列表要直观得多。它还能让每个数据库调用返回更少的信息，因此在网络上传输的信息更少，客户端浏览器需要解释的信息也更少。如果用户有根据自己的需求进行排序的能力，那么添加分页可以帮助他们更快地找到信息。\n\
  \nWeb Form 服务端控件和 MVC 方法在处理分页和排序方面有所不同。许多 Web Form 控件允许直接在控件中执行排序和分页。\n\n### Web\
  \ Form 服务端控件中的排序与分页\n\n本节首先检查了 `GridView` 中的排序。当你将控件拖入标记时，在那之后你真的不需要做任何其他事情，它就能正常工作了。设置分页几乎同样简单，因为控件中有属性可以为你处理此功能的管理。表\
  \ 10.1  列出并描述了这些属性。\n\n| 属性 | 描述 |\n| :--- | :--- |\n| `AllowCustomPaging` | 通常情况下，每当\
  \ `GridView` 控件移动到不同页面时，数据源中的每一行都会被读取。当数据源中的项目总数很大时，这会消耗大量资源。自定义分页允许你从数据源中仅读取单页所需的项目。使用\
  \ `AllowCustomPaging` 意味着你需要处理 `PageIndexChanging` 事件。处理 `PageIndexChanging` 事件将给你当前页的信息和预期的页数，你可以在那里限制从数据库引入的数据量，而不是遍历每一个项目。\
  \ |\n| `AllowPaging` | 这是一个布尔值，告诉控件开启分页。启用分页后，所有其他分页属性都变得可用。 |\n| `AllowSorting`\
  \ | 这是一个布尔值，让控件知道可以使用排序。当启用排序时，除非在列中被关闭，否则所有列都是可排序的。与分页结合使用时，这种方法确保排序在回传（postbacks）之间保持，这样当你执行排序时，你是正确地对每个页面进行排序。\
  \ |\n| `EnableSortingAndPagingCallbacks` | 当此属性设置为 true 时，会在客户端调用服务来执行排序和分页操作，从而消除了回传到服务器的需求。\
  \ |\n| `PagerSettings-FirstPageText` | 当 `Mode` 属性设置为 `NextPreviousFirstLast` 或\
  \ `NumericFirstLast` 值时，使用 `FirstPageText` 属性指定显示第一页按钮的文本。 |\n| `PagerSettings-LastPageText`\
  \ | 当 `Mode` 属性设置为 `NextPreviousFirstLast` 或 `NumericFirstLast` 值时，使用 `LastPageText`\
  \ 属性指定显示最后一页按钮的文本。 |\n| `PagerSettings-Mode` | `GridView` 分页内置了四种不同的模式，每种模式为分页结构设置了不同的显示：NextPrevious：上一页和下一页按钮；NextPreviousFirstLast：上一页、下一页、第一页和最后一页按钮；Numeric：直接访问页面的数字链接按钮；NumericFirstLast：数字链接以及第一页链接和最后一页链接按钮\
  \ |\n| `PagerSettings-PageButtonCount` | 当 `Mode` 属性设置为 `Numeric` 或 `NumericFirstLast`\
  \ 时，管理在分页器中显示的页面按钮数量。默认值为 10。 |\n| `PagerSettings-Position` | 决定分页的位置。有三个选项：`Top`、`Bottom`\
  \ 和 `TopAndBottom`。`TopAndBottom` 在可见列表的上下重复分页。 |\n| `PagerSettings-Visible` | 指定分页链接是否可见且可用\
  \ |\n| `PageSize` | 指定每页显示的项目数量。 |\n\n表 10.1 GridView 分页与排序属性 |\n\n查看 表 10.1 中的项目，显示了排序和分页所需配置量之间的差异。这是因为\
  \ `GridView` 内部排序的标准行为非常直观。启用排序后，表头变成一个可点击的链接，根据该列进行排序。第一次点击按升序排序，再次点击则按该列降序排序结果。\n\
  \n一个重要的考虑因素是，排序不仅跨屏幕上显示的项目，还跨整个结果集，每次排序都会返回到列表的第一页。此外，如果你简单地在 `GridView` 中开启排序，那么所有可见列都是可排序的。这对于你的应用程序可能过度了，因此在绑定列/字段时，你也有禁用特定列排序的能力。绑定字段上没有“EnableSorting”之类的属性，但有一个\
  \ `SortExpression` 属性。\n\n通常，`SortExpression` 设置如下\n\n```\n<asp:BoundField DataField=\"\
  Name\" HeaderText=\"Name\" SortExpression=\"Name\"/>\n```\n\n其中 `SortExpression`\
  \ 定义了 `GridView` 将排序的数据源字段名。通过完全删除该属性，你可以将该列从可排序列表中移除。\n\n\n\n\n在接下来的活动中，你将为上一章节中创建的项管理列表添加分页和排序功能。\n\
  \n既然你已经了了 [ASP.NET](http://ASP.NET) Web Forms `GridView` 控件中引入了排序和分页，现在你需要在 MVC\
  \ 视图中的列表也添加排序和分页功能。\n\n### MVC 列表中的排序和分页\n\n虽然 ASP.NET Web Form 服务端控件已经替你处理了大部分排序和分页工作，但在\
  \ ASP.NET 中，你通常需要自己管理所有这些工作。通常，你需要在渲染时向视图提供信息，以便它知道如何构建分页链接，然后在提交时将这些信息提供回给控制器，以便控制器知道如何构建下一页。\n\
  \n你通常在客户端需要的项目包括以下内容：\n\n* 当前页码\n* 每页项目数\n* 列表中的项目总数\n* 排序方法（如果有）\n\n你通常在服务器端需要的项目如下：\n\
  \n* 预期的页码\n* 每页项目数\n* 排序方法（如果有）\n\n通过这些项目中的每一个项，你将能够向用户显示他们相对于完整列表的位置。这种通信是 ASP.NET\
  \ 服务器控件处理的内容之一。控件还负责处理你必须手动处理的信息。下一个“尝试一下”（Try It Out）将演示你需要在客户端和服务器端添加的处理，以管理分页和排序。\n\
  \n虽然为 ASP.NET MVC 列表添加分页和排序比使用 ASP.NET Web Forms 列表服务端控件需要更多的代码，但这通常不是一个复杂的需求。你往往对输出以及分页和排序的交互方式拥有更多的控制权。\n\
  \n### 更新和/或插入数据\n\n现在你通过分页和排序的练习更深入地理解了如何操作列表，是时候花更多时间研究使用 Entity Framework 进行更新和插入数据了。第\
  \ 9 章 简要提到了在数据库中持久化数据。在本节中，你将学习更多关于此的内容以及更新应用程序尚未更新的其他部分。\n\n使用 Entity Framework\
  \ 保存新数据简单，只需将新项添加到 `DbContext` 集合并运行 `DbContext.SaveChanges()` 方法即可；只要被保存的对象中设置了所有必要的属性，保存尝试就会成功。\n\
  \n然而，编辑项目并不一定以相同的方式工作。你无法将其添加到集合中，因为它已经存在于数据库中了；相反，你需要编辑现有的项目。在过去，这需要你手动将请求（包括查询字符串和表单体）中的所有字段映射到模型中相应的属性。现在不再是编程的黑暗时代了，ASP.NET\
  \ 有一个在上一章中提到过的绝妙方法，名为 `TryUpdateModel`。\n\n`TryUpdateModel` 及其紧密兄弟 `UpdateModel`\
  \ 都能将输入的值映射到同名的属性上。使用这些方法的通用方法是实例化你所需的类型对象（例如 `Item` 或 `UserDemographics`），然后将该对象传递给该方法。系统将遍历对象上的所有属性，并尝试在附加到请求的数据中寻找匹配的值。如果有匹配项，系统将尝试设置该属性。`UpdateModel`\
  \ 和 `TryUpdateModel` 的区别在于，如果 `UpdateModel` 方法遇到绑定错误（例如尝试将“红色”设置为十进制类型的价格），它将抛出异常；而\
  \ `TryUpdateModel` 方法简单地跳过该绑定，让该属性值保持为初始值。\n\n在 ASP.NET Web Forms 中，全范围内使用 `TryUpdateModel`\
  \ 方法存在一点问题。这是因为 `TryUpdateModel` 设计用于在数据绑的服务端控件内部。如果你正在为服务端控件编写支持方法，那么你将无问题地完成工作。\n\
  \n\n\n\n\n| `SqlQuery` | 创建一个返回给定类型元素的 SQL 查询。返回的类型可以是任何属性与查询返回的列名相匹配的类型，也可以是简单的原始类型（如\
  \ `int` 或 `string`），因为该类型并不非得实体类型。即使返回的对象类型是实体类型，此查询的结果也永远不会被上下文（context）跟踪。对任何用户输入进行参数化以防止\
  \ SQL 注入攻击至关重要。你可以在 SQL 查询字符串中包含参数占位符，然后将参数值作为额外的参数提供。 |\n\n表 10.3 DbContext.Database\
  \ 上的可用方法\n\n通过 `DbContext.Database` 属性与数据库进行交互的关键在于，知道你是否期望通过交互获取数据。如果你除了期望成功/失败通知外不期望任何其他内容，那么你应该使用\
  \ `ExecuteSqlCommand` 方法。相反，当你想要返回数据时，你必须使用 `Execute` 方法。\n\n无论你使用 `ExecuteSqlCommand`\
  \ 还是 `ExecuteSql` 方案，你都需要确保正在使用参数。这两种方法的方法签名都包含一个用于运行 SQL 命令的字符串和一个用于参数的数组。使用其中一种方法的形式如下：\n\
  \n``````\nvar results = context.Database.ExecuteSql(\"select * from table where\
  \ name=@name\",\n                              new SqlParameter(\"@name\", nameToLookFor));\n\
  ```\n\n其中你正在搜索的值已经参数化。当你不需要传递任何值时，就不需要使用参数；然而，你应该养成对任何直接进入数据库或针对数据库的信息进行参数化的习惯，即使是用户未输入的信息也是如此。防患于未然！\n\
  \n### 使用 SQL 查询和存储过程\n\n当你使用 `ExecuteSql` 或 `ExecuteSqlCommand` 时，你可以运行某些指定的 SQL\
  \ 或存储过程。存储过程可以被视为存储在服务器上的 SQL 集合，而不是在每次请求查询时都传递给服务器。存储过程的性能可能比代码中生成的 SQL 略高。此外，将查询保持为存储过程可以允许你独立于应用程序来更改存储过程，从而让你在无需重新部署应用程序的情况下具有实现不同行为的能力。\n\
  \n在运行 SQL 查询或存储过程时，过程以及大部分语言语法都是相同的；唯一的区别是你提供给方法的文本。在接下来的活动中，你将同时处理 SQL 查询和存储过程。\n\
  \n虽然以高效的方式访问数据有助于确保应用程序的性能，但想象一下，如果系统不需要频繁地访问数据，你的应用程序性能将会提高多少。那是下一节的主题。\n\n## 缓存\n\
  \n缓存是一种有助于提高你的 Web 应用程序性能和可靠性的开发策略。实现这一点的某些方法包括：\n\n* 它减少了通过网络传输的数据量。\n* 它减少了对数据库的调用次数。\n\
  * 它减少了返回项目所需的运行代码量。\n\n缓存的主要特征是，一旦检索到项目（无论是通过互联网还是从数据库），这些结果就会被“保存”在某个本地，并在下次请求该项目时返回。这意味着首次获取信息而采取的操作不需要再次运行。\n\
  \n取决于实现的位置和方式，缓存会为应用程序增加一些复杂性。最强大的缓存方法通常需要最复杂的配置和支持，但它们在响应和可靠性方面为你的应用程序提供了最大收益。可靠性至关重要，因为应用程序中任何缓存其他区域信息的区域都必须确保其从缓存中恢复这些信息的能力至少与获取原始副本的方法一样可靠。实施一个会对系统性能产生负面影响的缓存系统是不可接受的权衡——那完全违背了缓存的初衷。\n\
  \n### ASP.NET 应用程序中缓存数据的不同方法\n\n向 ASP.NET 应用程序添加缓存的第一种方法是通过数据缓存。数据缓存是在你的应用程序和数据访问层之间添加一个新的缓存层。这个新层负责在当数据被确定为可缓存时管理数据库之外的一些数据。Entity\
  \ Framework 为长时间运行的应用程序提供了缓存支持，但在典型的 Web 应用程序中不支持缓存，而且添加数据缓存层超出了项目的范围。\n\n缓存的下一级是在用户和浏览器级别存储页面内容。在这种情况下，浏览器存储内容的本地副本，并由服务器设置过期时间。这些过期时间可以从几秒、几分钟到几天不等，通常取决于被缓存的数据类型。例如，用户的购物车将是一个不适合缓存的信息。相反，“关于我们”页面可能是缓存的理想选择，仅仅因为其内容并不频繁更改。\n\
  \n缓存的最后一个级也在浏览器内部。这种缓存方法称为应用程序缓存 API (AppCache)，是一项 HTML 5 规范，允许开发者访问本地浏览器缓存。它与输出缓存的不同在于，AppCache\
  \ 设计用于存储可能被多次访问的数据。AppCache 允许开发者将此信息本地存储在客户端机器上，而不是多次从服务器发送到客户端。它不用于存储整个页面，而是用于存储连接的整个生命周期或单个页面的生命周期。本项目将不再进一步讨论\
  \ AppCache。\n\nWeb Forms 和 MVC 处理缓存的方式不同，就像它们处理其他所有事情一样。使用 Web Forms 时，通过在页面定义下方添加一个新的配置项来定义输出配置：\n\
  \n``````\n<%@ OutputCache Duration=\"1200\" Location=\"ServerAndClient\" %>\n```\n\
  \n在此中，页面将缓存 1200 秒，即 20 分钟。第二个属性指定了缓存发生的位置。表 10.4 定义了你可以配置缓存的不同位置。\n\n| Location\
  \ | 描述 |\n| :--- | :--- |\n| Any | 输出缓存可以位于浏览器客户端（请求源处）、参与请求的代理服务器（或任何服务器）或处理请求的服务器上。\
  \ |\n| Client | 输出缓存位于请求源处的浏览器客户端。 |\n| Downstream | 输出缓存可以存储在除源服务器以外的任何 HTTP 1.1\
  \ 缓存设备中。包括代理服务器和发出请求的客户端。 |\n| None | 对请求页面禁用输出缓存。 |\n| Server | 输出缓存位于处理请求的 Web\
  \ 服务器上。 |\n| ServerAndClient | 输出缓存仅可以存储在源服务器或请求客户端。代理服务器不允许缓存响应。 |\n\n[缓存位置]\n\n\
  \n\n\n在处理 ASP.NET MVC 输出缓存时，你可以采用类似的方法。然而，它不像你刚才在 Web Forms 中看到的那样处于页面级别，操作（action）的输出会被缓存预定义一段时间。在操作上配置缓存使用的是该方法上的特性程序（attribution），如下所示：\n\
  \n```\n[OutputCache(Duration = 1200, Location = OutputCacheLocation.ServerAndClient)]\n\
  public ActionResult Details(int id)\n```\n\n上述特性程序将缓存设置为相同的 20 分钟，并使用 `ServerAndClient`\
  \ 设置对项目进行缓存。使用此设置，检查 Internet Explorer 浏览器缓存将显示 20 分钟的缓存期，如图 10.19 中突出显示的项目所示。\n\
  \n![缓存项目录截图，http:/localhost:1072/Item/Details/1 被选中，显示两个单元格中的值为 2015/7/12 8:39 AM\
  \ 和 2015/7/12 8:19 AM。](img/c10f019.jpg)\n\n图 10.19 缓存项目录\n\n如图所示，在过期之前对该特定页面的任何请求将不再需要调用服务器，而是将从本地缓存返回页面。\n\
  \n在下一个活动中，你将在应用程序的几个区域实现缓存，然后验证缓存是否实际生效。\n\n从表面上看，你可能想对网站中执行的每项操作都配置缓存。然而，这并不总是最佳决策。你已经看到了缓存的许多益处，但也存在一些复杂性和问题，这些可能会在某些情况下导致缓存出现问题。\n\
  \n### 数据缓存的常见陷阱\n\n如果缓存能解决网站可能遇到的的所有性能问题，那么它本会在第 1 章中被重点强调了。尽管它可以帮助增强对速度的感知，但这样做存在获取旧数据、错误数据的风险。很清楚的是，过期时间越长，对服务器的调用就越少。然而，你可能可以猜这对于内容经常变化的页面意味着什么：更改在缓存过期之前才会被捕获，而不是在页面更改时捕获。这导致了所谓的过时数据（stale\
  \ data）。\n\n使用缓存时最常见的问题是确保缓存期足够长以产生影响，同时足够短以避免向用户显示错误信息。对于这没有固定的数字；它完全取决于该特定页面的内容。例如，考虑示例应用程序以及典型用户会看到的内容。\n\
  \n用户可能访问的第一个页面是默认页面，即主页。检查此页面的内容发现，可用产品列表可能会频繁变化，可能在每次结账或退货时都会发生变化，而且无法预见这种情况何时会发生。\n\
  \n在这种情况下，过时数据意味着什么？如果数据过时，会有两个潜在问题：第一，可用项目未列出；第二，列出的项目可能已不再可用。这两个选项任何一个都不是理想的，因为缺少项目意味着别人无法结账，从而影响收入。如果某个项目不再可用但仍列在其中，任何选择该项目的用户在尝试将其添加到购物车但随后发现它实际上不可用时，将会有负面体验。\n\
  \n关于缓存，最后一点需要考虑的点是，你在服务器输出上定义的缓存设置并不是强制性的；相反，它们应该被视为强建议。用户始终可以设置他们的本地客户端以遵循他们确定的缓存规则，而这些规则可能与你预期的不同。对于可能位于服务器和客户端之间的系统（如代理服务器）也是如此。虽然你可能对缓存做出建议，中间系统可能会做出自己的缓存决策。这意味着你不能总是保证关于何时以及缓存哪些项的行为。当你开启了缓存时，你无法总是保证行为。\n\
  \n在什么情况下关闭缓存是一个好选择？当你考虑一个典型的电子商务应用程序时，关闭缓存通常适用于开启的项目。\n\n## 总结\n\n在与 Entity Framework\
  \ 工作时保存数据是一个直接的过程，因为 Entity Framework 为你做了大部分工作。复杂过程的是 HTTP 协议以及信息从客户端传输到服务器的方式，因为将此信息链接到模型是复杂的。\n\
  \n有几种方法可以将信息链接到 Entity Framework。第一种是通过使用 Model 方法将 UI 控件映射到相应的模型，MVC 允许通过使用签名定义的模型进一步简化这一点，无需调用代码。\n\
  \n第二种方案是更手动的方法，开发者手动将输入值链接到 Entity Framework 对象的属性。这在处理你无法控制表单本身的旧版第三方集成时非常常见，你只需要将值链接到你的对象。\n\
  \n虽然通过 Entity Framework 操作数据库表已经尽可能简化，但在某些情况下你仍然需要与数据库进行交互。然而，这由 EF 提供，因为你可以运行自定义\
  \ SQL、存储过程或对数据库所需的任何其他操作。当你从数据库选择数据时，你甚至可以选择结果绑定到你创建的自定义类型（类），从而允许直接处理你定义的代码，而无需处理任何特定的类型。\n\
  \n本章还描述了向项目添加缓存的各种方法。缓存允许你控制调用服务器的频率，而不是从本地缓存调用。\n\n### 练习题\n\n1. 根据你在完成尝试活动后目前的设置，你认为在\
  \ `ItemList` 页面添加缓存后的默认行为会是什么？当你添加项目时会发生什么？\n2. 如果不使用 `ViewBag` 或任何 `ViewBag` 类型的方法（例如\
  \ `ViewData` 等），将爱好列表传递给视图还有哪些选项？\n3. 使用更直接的数据库访问方法（例如使用 `ExecuteQuery` 而不是传统的 EF\
  \ 方法）的理由有哪些？\n\n## 本章你学到的知识\n\n| 缓存 | 存储查询或请求的结果。后续对该信息的请求将检索存储的结果，而不是从源获取。缓存最常见于客户端和服务器之间，通过将页面结果缓存在客户端设备上来实现。\
  \ |\n\n\n\n\n\n| Term 语 | 说明 |\n| :--- | :--- |\n| `ExecuteSqlCommand` | 直接在数据库上执行\
  \ SQL。使用 `ExecuteSqlCommand` 时，假设你并不需要获取数据，因为该方法不会返回结果集。 |\n| 分页 | 将大型数据列表拆分为较小的页面，然后为用户提供在这些不同页面之间移动的能力。\
  \ |\n| 数据库参数 | 一种向直接数据库的调用传递信息的形式。它们允许系统避免 SQL 注入攻击并确保类型兼容性。 |\n| 查询字符串到参数的映射 |\
  \ 查询字符串到参数映射是 ASP.NET MVC 的一项功能，如果查询字符串中使用的文本与方法签名中定义的变量名称相同，则会将查询字符串的值映射到操作方法签名中的值上。\
  \ |\n| 排序 | 将列表结果按特定顺序排列。用户通常可以通过选择要排序的字段、排序顺序（升序或降序）或同时选择字段和顺序，对排序如何管理进行某种程度的控制。如果同时使用了分页功能，则该顺序将跨页面保持。\
  \ |\n| SQL 注入 | SQL 注入是一种攻击形式，用户通过恶意填写 Web 输入表单，试图恶意影响你的数据库结构或数据；如果对传入的字符串处理不当，将允许访问数据库。处理这些输入值的最常用方法是使用数据库参数。Entity\
  \ Framework 为你做了很多此类保护工作，因此当你自己构建 SQL 时，这种风险最高。 |\n| `SqlQuery` | 对数据库的直接调用，可能会返回某些数据。对\
  \ `SqlQuery` 的重写允许你提供一个模型，EF 将尝试用查询结果填充该模型。如果数据库调用返回的字段名与属性名匹配，则映射将成功。 |\n| 过期数据\
  \ | 由于缓存过期时间过长产生的数据，它向用户返回错误的数据。 |\n| `TryUpdateModel` | 使用模型绑定时使用的方法，将自动从各种请求源（包括表单值、查询字符串值和附加文件）填充对象的值。如果存在类型不匹配，该方法将简单地不设置该属性。\
  \ |\n| `UpdateModel` | 类似于 `TryUpdateModel` 的方法，但它不是简单地忽略无法转换为所需类型所呈现的数据，而是会抛出一个异常。\
  \ |\n\n# 第 11 章：用户控件和部分视图\n\n## 你将在本章中学习到：\n\n* 什么是 ASP.NET Web Forms 用户控件，以及如何在网站中使用它\n\
  * 创建为多个页面提供通用功能的用户控件\n* 创建 ASP.NET MVC 部分视图并在你的 Web 应用程序中使用\n* 处理返回部分视图的控制器\n* 用户控件和部分视图之间的区别\n\
  * 创建 ASP.NET MVC 模板\n\n## 本章代码下载：\n\n本章的 wrox.com 代码下载位于“下载下载代码（Download Code）”选项卡中的\
  \ `[www.wrox.com/go/beginningaspnetforvisualstudio](http://www.wrox.com/go/beginningaspnetforvisualstudio)`。代码位于第\
  \ 11 章 下载中，并根据章节中的名称进行单独命名。\n\n在第 4 章“C# 和 VB.NET 编程”中，我们讨论了在多个区域复用相同代码，而不是多次重写代码。这不仅在进行代码设计时非常有用，在进行页面设计时同样有用。你已经看到了通过使用主页（Master\
  \ Pages）和布局页（Layout Pages）来提供复用；现在你将学习其他在 Web 应用程序中提供可复用部分的方法。\n\n这的一个典型例子可能是登录窗口。虽然你可能在每个页面上都想要相同的功能，但你可能希望该功能根据访问者当前的位置出现在页面的不同位置。由于他们可能处于页面的不同部分，因此无法将此功能放入主页或布局页，因为那种方法假设功能在每个页面上的位置都是相同的。相反，你可以创建一个\
  \ ASP.NET Web Forms 用户控件或 ASP.NET MVC 部分视图，并将该新项放置在你需要的任何地方。\n\n用户控件或部分视图充当了功能的通用容器。它像完整页面一样结合了\
  \ UI 和处理，但它被渲染为一组 HTML 元素，可以放置在页面的任何地方。你已经见过提供此类功能的内建服务器控件。在本章中，你将学习如何通过创建自己的用户控件和部分视图，为\
  \ Web Forms 和 MVC 方法提供相同的支持集。\n\n### 用户控件简介\n\n你已经知道，服务器控件是 ASP.NET Web Forms 将一组功能封装成易于使用的代码\
  \ set 的手段。这些封装的功能包括渲染为 HTML 的 UI 元素以及处理代码。这些服务器控件的可用性极大地增强了效率，因为它们允许开发人员通过配置和简单的代码来执行某些复杂任务，而无需自己完成工作。\n\
  \n然而，服务器控件并没有提供你支持 Web 应用程序可能需要的所有功能集，特别是当你想要使用特定的业务规则时。这就是用户控件发挥用场的地方。这些是开发者创建的控件，可以像标准服务器控件一样在你的应用程序中使用。唯一的区别是你开发该控件，而不是由框架或第三方提供控件；它是特定于你的应用程序的。\n\
  \n用户控件提供了与普通 Web Form 页面相同的功能或支持。这意味着当你开发用户控件时，可以执行以下操作：\n\n* 创建 HTML 标记。\n* 使用后置代码（Code-behind）和完整的页面周期。\n\
  * 消耗传统的 ASP.NET 控件以及其他用户控件。\n\n主要的区别之一是，由于 ASP.NET Web Forms 页面使用 `.aspx` 扩展，而 ASP.NET\
  \ 用户控件使用 `.ascx` 扩展。此外，文件的定义也不同。页面定义如下：\n\n```asp\n@Page Title=\"\" Language=\"\
  C#\"\n    CodeBehind=\"Default.aspx.cs\"\n    AutoEventup=\"true\"\n    Inherits=\"\
  RentMyWrox.Admin.Default\"\n```\n\n而控件定义如下：\n\n```````asp\n@Control Language=\"\
  C#\"\n    CodeBehind=\"NewsControl.ascx.cs\"\n    AutoEventup=\"true\"\n    Inherits=\"\
  RentMyWrox.Admin.NewsControl\"\n```````\n\n最后一个区别可能也是最重要的区别，用户控件不能作为请求资源直接从客户端调用。用户控件只有在创建于\
  \ `.aspx` 页面或创建于 `.aspx` 页面的其他用户控件时才存在。\n\n#### 创建用户控件\n\n创建用户控件与在 ASP.NET 应用程序中创建其他内容相似，因为它使用了“新建项”对话框。在下一个活动中，你将创建一个为用户提供特殊通知的用户控件。\n\
  \n#### 添加用户控件\n\n一旦了用户控件，下一步是将其添加到站点页面中。与任何默认服务器控件一样，你可以根据需要将用户控件添加到主页或内容页中。\n\n\
  将用户控件添加到页面有两个步骤：第一是在页面中注册控件，第二是将控件放入页面。在注册步骤中，你正在为计划在页面使用的控件建立链接。注册看起来如下片段所示，并通常位于标记页的顶部、`Page`\
  \ 定义下方。\n\n\n\n\n\n```xml\n<%@ Register Src=\"ControlName.ascx\" TagName=\"ControlName\"\
  \ TagPrefix=\"rmw\" %>\n```\n\n元素标签的布局遵循 `Page` 的定义，因为它以 `<%@` 字符组合开头。相反，属性则有所不同，并定义在表\
  \ 11.2 中。\n\n| 属性 | 说明 |\n| :--- | :--- |\n| `Src` | 你将在页面中使用的控件的 URL。通常，你会使用波浪号（tilde）方法来定义地址，因此它通常看起来像\
  \ `Src=\"˜/PathToControl/ControlName.ascx\".`。 |\n| `TagName` | 你在标记中引用控件时想要使用的值。就像你定义了带有\
  \ `Id` 的 `ContentPlaceholders` 然后在内容页面中引用该 `Id` 一样，`TagName` 定义了你将用于关联控件的值。通常，此值与控件名称相同，但也可以是任何值。\
  \ |\n| `TagPrefix` | 一个用户定义的值，其使用方式与定义标准服务器控件时使用的 `asp:` 前缀相同。系统将默认使用 `uc` 后跟一个页面中已定义的控件数量计数器。然而，在之前的代码中，它被定义为\
  \ `rmw`。如果你在同一页面上使用多个用户控件，使用相同的 `TagPrefix` 会更方便，这样所有自定义控件都会在 IntelliSense 中一起显示。\
  \ | [表 11.2 用户控件注册的属性**\n\n一旦你向页面注册了用户控件，下一步是在页面上实现该控件。下面的代码段显示了如何进行操作：\n\n```\n\
  <rmw:ControlName runat=\"server\"/>\n```\n\n如你所见，在页面中使用用户控件的语法与服务器控件非常相似。与 ASP.NET\
  \ Web Forms 中的几乎所有内容一样，还有另一种方法是通过 Visual Studio 中的设计窗口（Design window）来注册和使用用户控件。接下来的活动将演示如何这样做。\n\
  \n你刚刚成功向内容页面添加了一个用户控件。如果你查看发生变化的页面，你会发现向多个页面添加相同的控件会产生大量的重复性代码，因为你在每个页面上都添加了 `Register`\
  \ 命令。这意味着相同的代码被写了多次。通常，优秀的开发者会尽可能避免这种情况。你将在下一节中看到如何做到这一点。\n\n#### 用户控件的站点级注册 (Siteide\
  \ Registration)\n\n复制代码通常不是一个好主意，因此与其在使用的每个页面中注册用户控件，ASP.NET 允许你一次在 `Web.config`\
  \ 文件中注册它。默认的 `Web.config` 文件如图 11.10 所示。\n\n![默认代码行的 Web.config 文件截图](img/c11f010.jpg)\n\
  图 11.10 默认 Web.Config 文件\n\n为控件添加站点级注册需要在 `Pages` 元素的 `Controls` 节点中添加新节点，如图 11.10\
  \ 第 36 行所示。要添加的节点与 `register` 命令非常相似，如下：\n\n```xml\n<add tagPrefix=\"rmw\" tagName=\"\
  Banner\" src=\"~/Controls/Banner.ascx\"/>\n```\n\n如你所见，所有属性都与 `Register` 命令相同。接下来的活动将引导你完成这些更改。用户控件的一个有趣特性是它们如何影响包含在其中的各种服务器控件的\
  \ `ID`。\n\n#### 管理任何控件的 ID\n\n当你用户控件内部处理服务器控件时，你会发现 ASP.NET 运行时会对你设置的值进行一些灵活处理。考虑一个传统的\
  \ `Label` 服务器控件。下面的代码段显示了在内容页面中创建标签的代码以及创建的 HTML：\n\n##### 标记页面\n```\n<asp:Content\
  \ ID=\"Content2\" ContentHolderID=\"MainContent\" runat=\"server\">\n    <asp:Label\
  \ runat=\"server\" ID=\"DefaultLabel\" Text=\"I am a label\"/>\n</asp:Content>\n\
  ```\n渲染后的 HTML\n```html\n<span id=\"MainContent_DefaultLabel\">I am a label</span>\n\
  ```\n\n如你所见，ASP.NET 通过使用整个嵌套控件链来创建 `ID`，从而更改你渲染 HTML 的 `id`，确保每个控件的 `ID` 在输出的 HTML\
  \ 中被引用。因此，包含在 `ID` 为 `MainContent` 的 `Content` 控件中的 `ID` 为 `DefaultLabel` 的标签，将根据这些控件的嵌套关系输出一个\
  \ `id` 为 `MainContent_DefaultLabel` 的 HTML `<span>` 元素。\n\n考虑以下情况。你的用户控件包含一个标准的服务器控件，你可能想要访问其\
  \ `ID`，可能是为了样式设置。各种代码段如下：\n\n##### 标记页面\n```\n<asp:Content ID=\"Content2\" ContentHolderID=\"\
  MainContent\" runat=\"server\">\n    <rmw:ServerControl ID=\"BaseId\" runat=\"server\"\
  />\n</asp:Content>\n```\n##### 控件内容\n```\n<asp:Label runat=\"server\" ID=\"UserControl\"\
  \ Text=\"I am a control\"/>\n```\n##### 渲染后的 HTML\n```html\n<span id=\"MainContent_BaseId_UserControl\"\
  >I am a control</span>\n```\n\n你可以想象的，这种方法使得在客户端查找项目变得困难，特别是当它嵌套在其他控件中，因为其 `id`\
  \ 将基于所有控件之间的关系。当在使用 Web Forms 时，这个问题变得严重，足以为所有控件（服务器和用户）默认添加一个属性：`ClientIdMode`。`ClientIdMode`\
  \ 允许开发者定义基于 ASP.NET 的客户端 `IDs` 将如何生成。可用值见表 11.3 。\n\n| 名称 | 说明 |\n| :--- | :---\
  \ |\n| `AutoId` | 创建一个由层级结构中所有控件拼接而成的客户端 `id`。这种方法的输出与先前的示例相同。这也是 ASP.NET 3.5 之前所有版本的值。\
  \ |\n| `Static` | 使用此 `ClientIdMode` 意味着控件的客户端 id 将没有拼接。因此，你分配给控件的任何 `ID` 都将被赋予渲染元素。然而，它没有验证\
  \ `ID` 是否唯一，尽管这是 HTML 的要求。你需要在构建标记时自行管理此。 |\n| `Predictable` | 此模式通常用于数据绑定控件，你希望输出集中的每个项目都具有你可以预测的\
  \ `Id`。对于可能在列表每行中显示用户控件的情况非常有用。使用 `Predictable` 和 `ClientIDRowSuffix` 属性允许你定义输出元素的\
  \ `Id` 以包含某些已知值，例如列表中项的 `Id`。如果你在存在多个实例的区域（如列表）中不使用此模式，则输出将与 `AutoId` 相同。 |\n| `Inherit`\
  \ | 此值将控件的 `ClientIdMode` 设置为其托管项目的 `ClientIdMode`——无论它是另一个控件（用户控件或服务器控件）还是页面。这实际上是所有控件的默认值，而\
  \ `Predictable` 是所有页面的默认模式。 |\n\n表 11.3 ClientIdMode 值\n\n此时，示例应用程序中任何地方都不需要 `ClientIdMode`。你之后将看到这些不同的模式在客户端和服务器端都是有用的。\n\
  \n### 为你的用户控件添加逻辑\n\n\n\n\n\n你已经创建了一个执行特定功能的用户控件（user control）。然而，通过这种设计，如果你想让该控件能够执行略有不同的功能，你就必须创建另一个控件来执行该略有不同的操作。与其创建一个新的用户控件，在同一个控件中提供额外的功能难道不是更好吗？在本节中，你将学习如何实现这一点。\n\
  \n你可能记得，默认的 `Web Form` 服务器控件能够将属性作为控件实例化的一部分。你也可以为你的用户控件添加相同类型的支持；也就是说，你可以向你的控件添加属性（这些属性在控件创建时将作为属性变得可用），然后根据这些额外值在你的代码中做出决策。这使得你能够按照如下方式实例化你的控件：\n\
  \n```xml\n<rmw:SomeKindOfListControl runat=\"server\" SortOrder=\"Descending\" ID=\"\
  MyUserControl\"\n         MaxNumberDisplayed=\"3\"/>\n```\n\n这段代码不仅实例化了控件，还设置了一些属性。你需要在控件中对的更改是极小的。要支持前面描述的控件，可能需要如下的方法：\n\
  \n```csharp\npublic enum Sortorder\n{\n    Ascending,\n    Descending,\n    None\n\
  }\npublic partial class SomeKindOfListControl : System.Web.UI.UserControl\n{\n \
  \   public int MaxNumberDisplayed { get; set; }\n    public Sortorder SortOrder\
  \ { get; set; }\n    protected void Page_Load(object sender, EventArgs e)\n    {\n\
  \    }\n} \n```\n\n如前面的代码所示，有两个公共属性的与上一个示例中的属性匹配。在页面创建和控件实例化期间，这些值将由属性设置。由于这是在控件实例化期间，因此这些值在\
  \ `Page_Load` 事件处理程序期间是可用的。\n\n这段代码示例中一个有趣的部分是使用了 `enum`（枚举）。如你所记得，`enum` 允许你定义一组可用的值——在这种情况下，是三种不同的排序顺序。在此例中使用\
  \ `enum` 能够让用户控件对输入的不同类型的值具有某些控制能力，如图图 11.14 所示。\n\n![代码行的截图，IntelliSense 在下拉菜单中显示枚举值\
  \ Ascending、Descending 和 None。](img/c11f014.jpg)\n\n图 11.14 在 IntelliSense 中显示的枚举值\n\
  \n除了具有让 IntelliSense 理解枚举的能力外，由于你正在使用类型安全的语言（`C#` 或 `VB.NET`），还存在对类型的强制执行。`MaxNumberDisplayed`\
  \ 期望一个整数值。如果你尝试输入不同的值（例如字符串），你将得到一个验证警告，如图图 11.15 所示。尝试使用错误的类型运行应用程序会导致错误，如图图 11.16\
  \ 所示。\n\n![代码行中验证警告的截图，文本为 Validation (ASP.NET): 此属性允许的值不包括 'three'。](img/c11f015.jpg)\n\
  \n图 11.15 使用错误类型时的验证\n\n![在用户控件中使用错误类型时，“/'”应用程序消息中的服务器错误截图。](img/c11f016.jpg)\n\
  \n图 11.16 在用户控件中使用错误类型时的错误\n\n通过向用户控件添加公共属性，你可以自定义它的输出。然而，你需要确保编写应用程序代码，以便在包含未设置的属性时也能成功运行，例如通过使用默认值。接下来的“尝试一下”（Try\
  \ It Out）将为你提供向用户控件添加逻辑的实践经验，并演示了确保你的控件无论调用页面中输入了什么属性都能正常工作的几种方法。\n\n现在你已经给用户控件添加了一些逻辑，请考虑一个略有不同的场景。你在标记代码中添加了属性来设置用户控件中的各种值。你也可以在代码中程序地设置这些值，因为用户控件在后台代码（code-behind）中的访问与标准服务器控件一样简单。假设你设置了如下控件：\n\
  \n```xml\n<rmw:SomeKindOfListControl runat=\"server\" SortOrder=\"Descending\" ID=\"\
  MyUserControl\"\n         MaxNumberDisplayed=\"3\"/>\n```\n\n你可以像这里所示在后台代码中访问此控件，并在后台代码中根据需要更改这些值：\n\
  \n```csharp\nprotected void Page_Load(object sender, EventArgs e)\n{\n    MyUserControl.MaxNumberDisplayed\
  \ = 5;\n    MyUserControl.SortOrder = Sortorder.Ascending;\n} \n```\n\n因为你在后台代码中拥有完全的控制权，有时你可能根本不想在控件定义中设置值，而是对于特定页面，始终在代码中设置它们。这让你能够根据页面内正在发生的逻辑提供灵活性；例如，你使用的属性值可能取决于页面中信息的类型或用户采取的操作。\n\
  \n在控件中不设置属性是直接的，但实现可能会影响你用户控件的设计。由于在控件实例化期间通过属性设置值，这可能会影响用户控件的设计方式。生命周期为确保属性值被设置提供了一些保护，因为它在运行控件的事件处理程序之前会运行宿页面的事件处理程序。这意味着过程看起来如图图\
  \ 11.18 所示。因此，你可以在宿页面的 `Page_Load` 方法中设置值，并在控件的 `Page_Load` 方法中访问这些值。然而，如果你在宿页面的\
  \ `Page_PreRender` 事件处理程序（它在 `Page_Load` 事件处理程序之后）中设置这些值，却期望在控件的 `Page_Load` 方法中访问这些值，你将得到意外的结果，因为这些属性尚未设置。这可以通过在调用\
  \ `Page_Load` 之前不在执行执行任何工作来缓解。\n\n![托管页面和托管控件的生命周期图。Page Load 和 PreRender 之间有标记。](img/c11f018.jpg)\n\
  \n图 11.18 页面和托管控件的生命周期\n\n另一个潜在问题是你之前在讨论服务器控件时遇到的问题：在代码中设置但在 `ViewState` 中维护的值。这取决于你的需求，可能是也可能不是；但如果保留\
  \ `ViewState` 是必要的，这是可以实现且相当简单的。以下代码显示了两种方法，一种在提交时会丢失值，另一种则在 `ViewState` 中保留值：\n\
  \n#### 不维护 ViewState\n\n```csharp\npublic int MaxNumberDisplayed { get; set; } \n\
  ```\n\n#### 维护 ViewState\n\n```csharp\npublic int MaxNumberDisplayed\n{\n    get\
  \ { return (int)ViewState[\"MaxNumberDisplayed\"]; }\n    set { ViewState[\"MaxNumberDisplayed\"\
  ] = value; }\n}\n```\n\n通过第二种方法，你通过实际上将 `ViewState` 作为变量访问器和设置器的底层字段，来手动操作 `ViewState`\
  \ 中的信息。你可以对控件中的所有属性这样做，也可以仅对那些对于在回回之间记住值重要的属性这样做。\n\n\n\n\n\nASP.NET Web Forms 站点页面之间的功能共享可以通过创建用户控件来管理所需的需求。在创建用户控件时，请确保其专注于完成某一项任务。添加属性可以让你对控件中正在执行的工作进行某些控制，但不要过度，也不要尝试在单个控件中执行过多互不相关的事情。与一个执行多个不同动作的单个控件相比，拥有多个定义良好的控件会更好。一旦你发现需要开始添加\
  \ `if/then` 语句来确定控件将执行的工作，你就应该考虑添加一个额外的控件而不是继续扩展。\n\n## 使用部分视图 (Partial Views)\n\
  \n虽然 ASP.NET Web Forms 支持通过用户控件实现功能的复用，但 ASP.NET MVC 并没有用户控件的概念。它通过使用部分视图来实现相同的功能。与\
  \ Web Forms 用户控件一样，部分视图可以只包含一个视图（可能在视图中包含一些 Razor 处理），也可以通过调用控制器和 `action` 从另一个视图内部调用该部分视图，从而利用业务处理能力和固有的关注点分离。\n\
  \n部分视图与普通视图非常相似，区别在于它被期望放置在另一个页面上，因此它看起来更像是一个设计用于使用布局页的视图，因为除非你使用脚手架（scaffolding）根据特定模型构建它，否则默认不会生成任何代码。由于部分视图旨在共享视图，它遵循了一些与布局文件相同的规则，即视图文件位于\
  \ `Views` 目录下的 `Shared` 文件夹中，且视图传统上以下划线开头，如 `_ViewName`。`Shared` 文件夹是 MVC 系统默认查找引用的视图的地方；虽然下划线\
  \ `_` 不是强制要求的，但它是标准约定。\n\n### 添加部分视图\n\n一旦创建了部分视图，你需要做的下一步是将其添加到宿主视图（hosting view）中。这里是最简单的方法：\n\
  \n```html\n<<div>\n  @Html.Partial(\"_PartialViewName\")\n</div>\n```\n\n这种方法使用了\
  \ HTML 辅助方法，它将部分视图处理为字符串，然后将该字符串插入宿主视图中。你也可以将字符串捕获到变量中，并在需要时对其进行处理。另一种方法是在创建部分视图时直接将其解析到响应流中。这种方法使用\
  \ `HTML.RenderPartial` 扩展方法，它允许你操作部分视图的输出。由于 `RenderPartial` 方法不写入字符串，它的性能比 `Partial`\
  \ 方法更高。\n\n`Partial` 和 `RenderPartial` 方法提供了四组不同的参数集，每种组合都允许你向部分视图传递不同的信息集。表 11.4\
  \ 描述了这些不同的签名。\n\n| 签名 | 描述 |\n| :--- | :--- |\n| string | 字符串表示部分视图名称。注意，名称中不会添加任何目录结构或其他内容，因为系统假设部分视图位于\
  \ `Views\\Shared` 目录。 |\n| string, object | 字符串是你想要渲染的部分视图。对象是传递到部分视图的模型。如果你没有定义传递到部分视图的具体模型，则系统将传递与宿主视图收到的相同的模型。\
  \ |\n| string, `ViewDataDictionary` | 字符串是你想要渲染的部分视图。`ViewDataDictionary` 代表你希望部分视图访问的\
  \ `viewData`。你可以使用 `ViewData[\"SomeKeyName\"]` 等构造结构来访问 viewData。 |\n| string, object,\
  \ `ViewDataDictionary` | 字符串是你想要渲染的部分视图。对象是传递到部分视图的模型。`ViewDataDictionary` 代表你希望部分视图访问的\
  \ `viewData`。 |\n\n**表 11.4**](#c11.xhtml_c11-tbl-anc-0004) 部分视图的方法签名\n\n当你渲染部分视图时，你对传递给视图的信息具有控制权。当你没有指定模型或\
  \ `viewData` 时，宿主视图的模型和/或 `viewData` 将提供给部分视图。采用这种方法时，你必须记住宿主视图必须向部分视图提供所有数据。这意味着没有关联的控制器提供信息，因此你必须从调用视图来完成。接下来的“尝试一下”（Try\
  \ It Out）练习将带你完成添加部分视图的过程。\n\n正如最后一个活动所示，当使用 `HTML.Partial` 方法时，你必须从宿主视图为该视图提供所有数据。然而，某些时候你可能不希望将此计算添加到所有返回包含该部分视图的视图中。相反，你可能希望部分视图能够进行自己的处理。幸运的是，你也拥有这种能力。\n\
  \n### 管理部分视图的控制器\n\n对于 ASP.NET Web Forms 用户控件，你拥有与 Web Forms 页面提供的相同默认功能：标记和后置代码（code-behind）。在最后一个活动中，你看到了\
  \ MVC 如何为你提供创建部分视图并直接调用视图的能力。然而，你刚刚经历的实现不允许等同于后置代码的功能，或者在视图本身之外进行业务处理的能力——这种能力将非常有用。\n\
  \n虽然 `Partial` 和 `PartialRender` 命令直接将部分视图添加到页面内的区域，但还有另一种方法是调用控制器操作，然后由该操作返回部分视图进行渲染。这种方法允许你使用控制器的完整处理能力来创建一个提供给部分视图的具体模型。\n\
  \n\n\n\n这里唯一的变化是你返回的是一个 `PartialView` 而不是 `View`，并且返回一个命名的视图。在这种情况下，命名的视图是有用的，因为它让处理器更容易找到要使用的正确部分视图。默认情况下仍然是使用名称与操作（action）名称匹配的视图，但在这种情况下这可能会引起困惑，因为很容易想象出可能存在多个“详情（detail）”部分视图的情况。\n\
  \n调用适当的控制器操作获取部分视图与通过 `Partial` 和 `RenderPartial` 方法实例化部分视图没有太大区别。你不是调用这些 HTML 扩展方法，而是调用另一组方法，`Action`\
  \ 和 `RenderAction`，如下所示：\n\n```html\n<div>\n     @Html.Action(\"News\",\"List\"\
  )\n</</div>\n<div>\n     @Html.RenderAction(\"News\",\"List\")\n</div>\n```\n\n\
  这两个方法之间的区别与 `Partial` 方法之间的区别相同；`Action` 方法返回一个字符串，你可以根据需要将其捕获到变量中，而 `RenderAction`\
  \ 则直接将输出渲染到响应流中。传递给方法的参数指示了控制器名称和操作名称，该操作提供了插入到宿主视图中的部分视图。\n\n正确配置控制器和操作非常重要，以确保操作返回的是一个\
  \ `PartialView` 而不是 `View`。如果有多个不同的项目尝试控制响应流，系统将会报错。使用 `PartialView` 可确保操作知道它将参与到另一个操作创建的响应流中，因此它不会尝试直接与响应交互。\n\
  \n在接下来的“尝试”（Try It Out）中，你将创建一个通过控制器访问的部分视图，然后根据需要将其添加到多个页面中。\n\n## 模板 (Templates)\n\
  \nASP.NET Web Form 用户控件和 MVC 部分视图支持许多相同的需求，包括创建 UI 和业务逻辑部分，这些部分可以从标准页面或视图（主页和布局模板）内部重用和消费。MVC\
  \ 提供了另一种创建重用代码的方法：模板。当你在第 6 章 中使用 `EditorFor` 或 `DisplayFor` 等方法时，你已经使用过内置模板。这些方法获取你正在使用的属性，并为该类型提供默认模板。MVC\
  \ 赋予你创建和定义自定义模板的能力，使你能够使用相同的方法并基于自定义模板渲染自定义类型。\n\n为自定义类型创建编辑器模板和显示模板与你之前创建部分视图的操作非常相似；事实上，它们是遵循严格定义的路径和命名规范的部分视图。规范的第一部分规定，自定义模板必须存储在\
  \ MVC 应用程序的相应文件夹中：响应 `DisplayFor` 的模板需要放在 `Views/Shared/DisplayTemplates` 目录，而响应\
  \ `EditorFor` 方法的模板需要放在 `Views/Shared/EditorTemplates` 目录。命名规范规定文件名称必须与模板将要使用的类型名称匹配，例如\
  \ `DateTime` 或 `Address`。\n\n在下一个“尝试”中，你将有机会看到这些模板是如何工作的，以及它们是如何与传统的部分视图进行进行实例化的。\n\
  \n## 总结 (Summary)\n\n用户控件和部分视图允许你构建重用组件来管理与客户端的交互。两者的目的是为了实现特定的功能子集，每个控件都负责收集所有必要信息并将其显示给用户。这对于\
  \ ASP.NET Web Form 用户控件尤为如此，因为它们始终有后置代码（code-behind）支持整个页面生命周期，就像传统的 Web Form 一样。\n\
  \n示例所示，MVC 部分视图提供了更多的灵活性。它可以用于显示从视图通过 `Html.Partial` 方法传递到视图的项目；或者通过 `Html.Action`\
  \ 方法，后者并没有调用部分视图，而是调用控制器上的一个操作来返回部分视图。由于控制器的参与，你有能力在后台执行业务逻辑以创建传递给视图的模型。因此，同一个 MVC\
  \ 部分视图可以从视图调用并传递模型，也可以从操作返回一个带有模型的视图。由于两者之间解耦的性质，视图从何处获取模型并不重要——只要它有模型即可。\n\n在使用用户控件之前，需要先对它们进行注册，这可以在页面级或应用程序级完成。一旦注册，你就可以像使用任何其他服务器控件一样将它们拖到标记页面上。当你在使用部分视图时，没有必要注册它们；只需确定你想如何引用视图（部分视图还是操作），系统就会接管后续工作。\n\
  \n你可以通过将部分视图指定为模板来更进一步。模板仅仅是放在一个特殊文件夹中的部分视图。通过其位于 `Views` 目录下 `Shared` 目录的 `EditorTemplate`\
  \ 或 `DisplayTemplate` 目录中，系统知道使用它处理相应的模型类型。\n\nMVC 还允许你使用属性标记（property attribution）来定义类型特定特定实现与模板之间的关系。这允许你创建多个模板，然后根据模型属性本身来在需要时确定使用哪个模板。\n\
  \n用户控件和部分视图允许你提取页面输出的特定部分并分离到不同的对象，这些对象可以从其他页面调用。如果某个功能只在一个页面上使用，那么将其拆分为用户控件或部分视图可能没有意义；但如果该功能已经在其他页面上复制或其他可能会复制，你应该始终将其提取到自己的控件或部分视图中。这样你就可以按需要重用它。\n\
  \n### 练习 (Exercises)\n\n1. **1.** ASP.NET MVC 模板以特定格式显示模型。在 ASP.NET Web Forms 程序中可以实现相同的操作？\n\
  2. **2.** 当你想获取一个在服务器上处理的部分视图时，什么时候不需要向 `Html.Action` 方法传递控制器？\n3. **3.** 当你处理 ASP.NET\
  \ 用户控件时，如果你有一个字符串属性并通过特性传递一个整数会发生什么？如果属性是整数而你传递一个字符串又会发生什么？\n\n\n\n\n\n| Editor\
  \ Template | 一种 MVC 局部视图（partial view），用于显示特定类型。为了让局部视图充当显示模板，它需要位于 `Views\\Shared`\
  \ 目录下的 `EditorTemplates` 目录。 |\n| Inherit ClientIdMode | 此值将控件的 `ClientIdMode` 设置为其宿主项目的\
  \ `ClientIdMode`，无论该宿主是另一个控件（用户控件或服务器控件）还是一个页面。这实际上是所有控件的默认值，而 `Predictable` 是所有页面的默认模式。\
  \ |\n| Partial | 此 `HTML` 扩展方法用于引用引用应该显示的局部视图。它通常带有视图名称和局部视图所需的模型参数进行调用。采用这种方法会产生一个字符串值，该值可以直接写入标记中，也可以赋值给变量并进行后续处理。\
  \ |\n| Predictable ClientIdMode | 此模式通常用于数据绑定控件，在这些控件中，你希望输出集的每一项都具有一个你可以预测的 ID。当你在列表项的每一行中都显示一个用户控件时，这种情况下非常有用。使用\
  \ `Predictable` 和 `ClientIDRowSuffix` 属性允许你定义输出元素的 `Id`，包含某些已知值，例如列表中项的 `Id`。如果你在列表等存在多个实例区域未使用此模式，则输出将与\
  \ `AutoId` 相同。 |\n| `Register` | 用于构建指向 Web Form 用户控件链接的命令。作为 `Register` 的一部分，你设置了在页面中用于识别和实例化用户控件的\
  \ `TagName` 和 `TagPrefix`。 |\n| `RenderAction` | 这与 `Action` 扩展方法相同，但它不返回字符串。相反，它将输出直接写入响应流。如果你不期望使用\
  \ action 调用的输出，请采取此操作，因为它通过消除该开销来提高性能。 |\n| `RenderPartial` | 这与 `Partial` 扩展方法相同，但它不返回字符串。相反，它将输出直接写入响应流。如果你不期望使用局部视图调用的输出，请采取此操作，因为它通过消除该开销来提高性能。\
  \ |\n| Server Caching | 节点缓存可以在 action 上进行配置，其输出将在服务器上保留特定时长。这对于那些输出很少更改的 action\
  \ 来说特别有用。 |\n| Sitewide Registration | Web Forms 用户控件的站点级注册使用 `Web.config` 文件的单次注册取代了逐页的\
  \ `Register` 注册过程。与普通的 `Register` 一样，站点级注册要求你识别用于实例化控件的 `TagName` 和 `TagPrefix`。\
  \ |\n| Static ClientIdMode | 使用此模式意味着控件的客户端 ID 内部不会进行拼接。因此，分配给控件的任何 ID 都将赋予渲染元素。然而，尽管\
  \ HTML 要求 ID 是唯一的，但这里并没有验证该 ID 是否唯一。你必须在构建标记时自己管理这种唯一性。 |\n| `TagName` | 此值在注册 ASP.NET\
  \ Web Forms 用户控件时设置。该值与 `TagPrefix` 一起，用于定义标记中引用的控件与被引用的特定控件之间的关系。对于每个注册的控件，此值必须是唯一的。\
  \ |\n| `TagPrefix` | 此值在注册 ASP.NET 用户控件时设置，用于帮助定义放置在页面上的项与将在页面上使用的用户控件之间的关系。 |\n\
  \n# 第 12 章：验证用户输入\n\n**你将在本章中学习到：**\n\n* 客户端和服务器端输入数据验证的区别\n* 修改你的模型类以帮助支持验证\n*\
  \ 使用验证控件在 ASP.NET Web Form 页面中验证输入\n* 在 ASP.NET MVC 视图和控制器中强制验证\n* 与返回局部视图的控制器配合\n\
  * 实现验证的一些技巧\n\n## 本章代码下载：\n\nwrox.com 为本章提供的代码可以在“Download Code”选项卡中的 `www.wrox.com/go/beginningaspnetforvisualstudio`\
  \ 找到。代码位于第 12 章](#c12.xhtml) 下载中，并根据章节中的名称进行单独命名。\n\n有一句古话，“垃圾进，垃圾出”（garbage in,\
  \ garbage out, GIGO）。其含义显而易见：当你允许坏数据（垃圾）进入你的应用程序时，从那时起就会出现问题，因为你的应用程序将返回给你垃圾。确保你的应用程序不包含垃圾数据的最佳方法是尽可能对所有输入信息进行验证，以确保它们符合某些已知标准，例如确保电话号码包含所有数字、确保电子邮件地址格式正确或确保数量为整数；对于各种由用户输入的信息，你能够且也应该对这些数据的呈现方式定义一些预期。\n\
  \nMVC 和 Web Forms 都提供了支持，帮助让你的应用程序尽可能不产生垃圾。在本章中，你将检查一些常见的验证需求，并在 MVC 和 Web Forms\
  \ 中对它们进行操作。\n\n## 从用户处收集数据\n\n从网站访问者处收集信息是你取得成功的关键。由于这些信息对你的业务非常重要，你必须帮助确保其有效性和正确性。显然，你不能总是确保输入数据的正确性；如果\
  \ George Smith 将他的名字输入为 Janet Jones，你无法判断这一点。然而，你可以确保用户输入了名和姓，并且它们是真实的姓名——例如，不包含数字或符号。\n\
  \n当你进行验证时，你希望对接收到的每条数据检查以下几点：\n\n* **必填字段 (Required fields)**：为了让系统运行，用户必须提供某些值。特定的属性是其中之一吗？\n\
  * **数据类型 (Data type)**：任何输入的数据必须是特定类型。数量框中的值至少需要是数字，最可能是一个整数。\n* **数据大小 (Data size)**：就像你可能需要数据符合特定类型一样，你可能还需要数据符合某些尺寸范围。最常见的是最大尺寸或长度。这是因为关系型数据库表中的每一列都是按字符数定义的。尝试插入大于该值的项将导致数据丢失或引发异常。\n\
  * **格式验证 (Format validation)**：代表某些数据（例如电子邮件地址）需要遵循某种标准模板：`name@server.domain`。电话号码有自己的规则，信用卡号有自己的规则，以此此类推。\n\
  * **范围验证 (Range validation)**：某些数据必须落在合理的范围内。例如，输入 1756 年 1 月 1 日作为出生日期应该引起某些警觉。\n\
  * **比较验证 (Comparison validation)**：有时一个字段中的输入意味着另一个字段中的一组值。例如，选择性别为女性意味着称为 Ms. 而不是\
  \ Mr.。另一个例子是比较日期范围中的两个值，以确保“起始值”小于“结束值”。\n* **其他 (Others)**：可能还需要自定义验证——那些超出了已列出的其他验证方法范围的验证。这些完全取决于你的应用程序需求。\n\
  \n\n\n\n理想情况下，所有验证都应该在客户端进行，这样如果用户输入了无效数据，表单就无法提交。这让用户在信息不完整或错误时获得更实时的更新。然而，作为一个负责任的开发者，你不能依赖客户端完成所有的验证，因为用户可能关闭了该功能。因此，你必须确保通过网络传输到服务器的信息也是正确的，所以服务器端验证也是一个需求。事实上，如果你必须在客户端或服务器端这两种验证方法之间进行选择，你应该始终选择服务器端，因为你希望对被验证的信息拥有完全的控制权。\n\
  \n当你回顾之前所有的考虑因素时，理想的表单验证形式是可以在服务器和客户端都使用的形式。另一个实用的功能是尽可能靠近模型来定义需求，理想情况下甚至直接在模型本身上定义。这意味着当你查看类文件时，能够直接在那里理解数据预期值。\n\
  \n在探索验证的旅程中，请记住这一切。正如你可能已经猜到的，MVC 和 Web Forms 管理验证需求的方式各不相同。\n\n## 在 Web Forms 中验证用户输入\n\
  \n有一组特殊的服务器控件设计用于执行验证。书中之前简要提到过，这些是名副其实的验证服务器控件，它们在 Visual Studio 工具箱中可用，如图 12.1\
  \ 所示。\n\n![Visual Studio 工具箱的验证选项展开及控件列表的截图](img/c12f001.jpg)\n\n**图 12.1**](#c12.xhtml_c12-fig-anc-0001)\
  \ Visual Studio 工具箱中的验证控件\n\n这些 ASP.NET Web Form 验证控件每一个都支持一个或多个必要的验证项。表 12.1 详细描述了每一个一个。\n\
  \n| 控件 | 描述 |\n| :--- | :--- |\n| `CompareValidator` | 使用 `CompareValidator` 控件将用户在输入控件（如\
  \ `TextBox` 控件）中输入的值与另一个输入控件中输入的值或常量值进行比较。如果输入控件的值符合 `Operator`、`ValueToCompare`\
  \ 和/或 `ControlToCompare` 属性指定的标准，则 `CompareValidator` 控件通过验证。你还可以使用 `CompareValidator`\
  \ 控件来指示输入控件中输入的值是否可以转换为 `Type` 属性指定的数据类型。与上一节中的验证需求列表相比，此控件填补了“数据类型”和“比较”的需求。 |\n\
  | `CustomValidator` | `CustomValidator` 控件对控件应用用户定义的验证函数。使用此控件时，开发者首先创建 JavaScript\
  \ 功能以确保输入到控件中的值是正确的。此控件允许你执行任何需要的验证，只要你能够想出如何编写 JavaScript 来支持它。然而，JavaScript 部分仅是客户端验证。你还需要编写服务器端逻辑来在服务器上进行验证。这两种方法的结合确保了完整的验证。与验证需求列表相比，此控件可以满足任何类型的需求，因为它是完全自定义的。\
  \ |\n| `RangeValidator` | `RangeValidator` 控件测试输入控件的值是否在指定的范围内。你提供一个最小值、一个最大值以及以及被比较项的类型。\
  \ |\n| `RegularExpressionValidator` | `RegularExpressionValidator` 控件检查输入控件的值是否符合正则表达式定义的模式。这种类型的验证允许你检查可预测的字符序列，例如电子邮件地址、电话号码和邮政编码中的字符。此控件提供格式验证，还可以用于提供最小和最大长度验证。\
  \ |\n| `RequiredFieldValidator` | 使用此控件使输入控件成为必填字段。如果输入控件在失去焦点时其值没有从 `InitialValue`\
  \ 属性改变，则通过验证失败。此控件支持必填字段的验证，这可能是最常见的场景；它只验证是否存在数据，而不是关于该数据的任何信息。 |\n| `ValidationSummary`\
  \ | `ValidationSummary` 控件用于在页面显示发生的所有验证错误。通常位于表单顶部，它显示验证结果以及一个引导用户跳转到验证失败字段的链接。\
  \ |\n\n**表 12.1**](#c12.xhtml_c12-tbl-anc-0001) 验证服务器控件\n\n由于每个控件通常执行一项特定的验证，因此你有能力将多个验证控件链接到输入字段，从而执行多个不同的验证。例如，如果出生日期既是必填的，且预期在一组值之间，你可以将\
  \ `RequiredFieldValidator` 和 `RangeValidator` 都挂载到同一个输入项上，如下：\n\n```\n<div class=\"\
  dataentry\">\n    <asp:Label runat=\"server\" Text=\"Date of Birth\" AssociatedControlID=\"\
  tbDOB\"/>\n    <asp:TextBox runat=\"server\" ID=\"tbDOB\"/>\n    <asp:RequiredFieldValidator\
  \ ID=\"tbDOB_Req\" ControlToValidate=\"tbDOB\"\n            runat=\"server\" Display=\"\
  Dynamic\"\n            ErrorMessage=\"Please enter a Date of Birth\"/>\n    <asp:RangeValidator\
  \ ID=\"tvDOB_Range\" ControlToValidate=\"tbDOB\" runat=\"server\"\n            Display=\"\
  Dynamic\" ErrorMessage=\"Please enter a valid Date\"\n            Type=\"Date\"\
  \ MinimumValue=\"1/1/1915\" MaximumValue=\"12/31/2010\"/>\n</div>\n```\n\n上述代码包含了四个不同的服务器控件：\n\
  \n*   一个 `Label` 控件\n*   一个 `TextBox` 控件\n*   一个 `RequiredFieldValidator`\n*   一个\
  \ `RangeValidator`\n\n所有控件的共同点是验证器和标签都与 `TextBox` 控件关联。`Label` 控件和 `TextBox` 控件都不是新的，但这是你第一次看到验证器的用法。\n\
  \n许多验证器共享一些公共属性。表 12.2 列出了这些公共属性以及其他属性。\n\n| 属性 | 描述 |\n| :--- | :--- |\n| `ControlToCompare`\
  \ | 与被验证的输入控件比较的输入控件。此属性仅对 `CompareValidator` 有效。 |\n| `ControlToValidate` | 此属性适用于所有验证控件。`ControlToValidate`\
  \ 属性定义正在验证的输入控件。未设置此值的验证器不会执行任何验证。 |\n| `Display` | 另一个公共属性，`Display` 属性定义了显示方式。有三个选项：Dynamic、None\
  \ 和 Static。当 `Display` 设置为 `Static` 时，显示的消息所占据的空间始终被留出，无论其实际上是否可见。在前面的示例中，如果两个 `Display`\
  \ 属性都设置为 `Static`，那么在文本和第二个错误消息之间将有一个空间（假设是 RangeValidator 失败了）。由于它们是动态的，第一个错误消息占据的空间不会被预留，第二个控件的错误消息可以像第一个验证控件不存在一样进行显示。选择\
  \ `None` 意味着错误消息永远不会内联显示，而是只在 `ValidationSummary` 控件中显示。`Static` 是默认值。 |\n| `EnableClientScript`\
  \ | 此属性适用于所有验证控件。使用 `EnableClientScript` 属性来指定是否启用了客户端验证。服务器端验证始终开启状态，但根据需要可以关闭客户端验证。默认值为\
  \ `true`。 |\n\n\n\n\n\n| `ErrorMessage` | 此属性适用于所有验证控件，它定义了当验证器确定输入框中的内容未通过验证时，显示在\
  \ `ValidationSummary` 控件中的的消息。如果未设置 `Text` 属性，它将以内联方式显示。 |\n| `MaximumValue` | 此属性适用于\
  \ `RangeValidator`，用于设置用于比较的数值范围的上限。 |\n| `MinimumValue` | 此属性适用于 `RangeValidator`，用于设置用于比较的数值范围的下限。\
  \ |\n| `Operator` | 此属性适用于 `CompareValidator`，`Operator` 属性定义了要执行的比较类型。选项如下：Equal（相等）：对被验证输入控件的值与另一个控件或常量值进行等性比较。NotEqual（不相等）：对被验证输入控件的值与另一个控件或常量值进行不等性比较。这等同于\
  \ `!=`。GreaterThan（大于）：对被验证输入控件的值与另一个控件或常量值进行大于比较。这等同于 `>`。GreaterThanEqual（大于等于）：对被验证输入控件的值与另一个控件或常量值进行大于等于比较。这等同于\
  \ `>=`（注：原文此处为 `!=` 笔误）。LessThan（小于）：对被验证输入控件的值与另一个控件或常量值进行小于比较。这等同于 `<`。LessThanEqual（小于等于）：对被验证输入控件的值与另一个控件或常量值进行小于等于比较。这等同于\
  \ `<=`。DataTypeCheck（数据类型检查）：对被验证输入控件中输入的值与 `Type` 属性指定的数据类型进行数据类型比较。如果值无法转换为指定的数据类型，验证将失败。\
  \ |\n| `Text` | 这是一个常用属性，分配给 `Text` 的值将在验证失败时以内联方式显示。 |\n| `Type` | 在进行比较之前，将要比较的值转换的数据类型。选项有\
  \ String（字符串）、Integer（整数）、Double（双精度浮）、Date（日期）和 Currency（货币）。`Type` 属性适用于 `RangeValidator`\
  \ 和 `CompareValidator`。默认值为 String。 |\n| `ValidationExpression` | 用于验证字段模式的正则表达式。\
  \ |\n| `ValidationGroup` | 这是一个所有验证器上均可用的特殊属性。它的特殊之处在于它也适用于其他控件，例如按钮和其他支持提交到服务器的控件。`ValidationGroup`\
  \ 允许你将验证器和各种回传机制分组，以便在回传到服务器时只运行部分验证。这使得你能够让页面的不同部分执行不同的操作，而无需担心某一个区域的操作会导致另一个区域触发验证。\
  \ |\n\n#### 表 12.2](#c12.xhtml_c12-tbl-anc-0002) 验证器属性\n\n在接下来的“尝试一下”中，你将开始组合各种控件来验证数据输入表单的输入。\n\
  \n如你所见，ASP.NET 服务器控件提供了一种简单高效的工作方式，这次是通过在一种或多个输入控件上提供验证服务来实现。作为额外奖励，这种验证既通过使用 JavaScript\
  \ 在客户端发生，也会在正常页面处理期间在服务器端发生。虽然只演示了两个验证控件，但大多数其他控件的工作方式大体相同。\n\n### 理解请求验证 (Request\
  \ Validation)\n\nASP.NET Web Form 页面上发生的另一种验证类型（你可能还没有见过）是请求验证，它默认始终是开启的。请求验证是 ASP.NET\
  \ 的一项功能，它会检查 HTTP 请求以确定其是否包含潜在危险的内容。在这种背景下，潜在危险的内容是指请求体、标头、查询字符串或 Cookie 中的任何 HTML\
  \ 标记或 JavaScript 代码。ASP.NET 执行此检查是因为 URL 查询字符串、Cookie 或提交的表单值中的标记或代码可能是出于恶意而添加的。\n\
  \n例如，如果你的网站有一个用户可以在其中输入评论的表单，恶意用户可以在 `<script>` 元素中输入 JavaScript 代码。当你向其他用户显示评论页面时，浏览器会执行该\
  \ JavaScript 代码，就像该代码是由你的网站生成一样。请求验证有助于防止此类攻击。如果 ASP.NET 检测到请求中的任何标记或代码，它将抛出“检测到潜在危险值”错误并停止页面处理，如图\
  \ 12.7 所示。\n\n!['/' 应用程序服务器错误的截图，在请求验证期间抛出的消息。](img/c12f007.jpg)\n\n#### 图 12.7](#c12.xhtml_c12-fig-anc-0007)\
  \ 在请求验证期间抛出的错误\n\n你只需在刚才操作的表单页面中输入一些 HTML 元素，就可以亲眼看到这种情况发生。\n\n如前所述，这种验证默认开启，但你可以根据需要将其关闭，例如当预计用户将输入可能包含\
  \ HTML 或 JavaScript 元素的信息时。你可以通过在 `Page` 指令中添加 `ValidateRequest=\"False\"` 来控制设置。这将关闭该页面的请求验证。\n\
  \n有时，你可能不想关闭整个页面的请求验证，而是只对页面上的组控件执行验证。这在允许捕获 HTML 的情况下很常见，例如可以输入 `Item` 类描述的屏幕。在这种情况下，你可以通过使用\
  \ `ValidateRequestMode` 属性在控件级别启用或禁用检查：\n\n```asp\n<asp:TextBox ValidateRequestMode=\"\
  Enabled\" runat=\"server\" ID=\"tbDescription\"/>\n```\n\n使用上述代码，放在 `tbDescription`\
  \ 中的内容将始终经过请求验证，即使在页面级别已关闭。\n\n## 在 MVC 中验证用户输入\n\n你可能已经注意到，在 ASP.NET Web Forms\
  \ 中，你的验证预期作为 UI 构建的一部分定义的。这意味着任何接收相同类型信息的页面都必须独立实现这种验证。因此，更改验证要求需要在多个页面中进行修改。ASP.NET\
  \ MVC 采用了更集中的方法，将验证控制权放在它真正所属的地方：模型本身。\n\n#### 模型特性 (Model Attribution)\n\n将验证放在模型本身是一个逻辑上的下一步，因为应用程序中没有地方比这里更理解值的有效性。将这些验证规则放在模型上还可以让验证成为数据库管理过程的一部分，通过将某些模型验证规则（例如字段的最大长度或字段是否必填）应用于数据库级别。最后，在模型级别进行验证可以确保不符合规则的数据不会被持久化。在使用\
  \ ASP.NET Web Form 验证控件时，并没有这种级别的安全性——那些控件只确保随请求发送的值是有效的，但无法确保持久化的数据是有效的。验证控件仅用于提交验证。然而，你也可以向从\
  \ Web Forms 使用的模型添加特性，并仍然利用内置的验证功能。\n\n\n\n\n\n| 属性 | 描述 |\n| :--- | :--- |\n| `CreditCard`\
  \ | 确保属性的值符合已知的 `CreditCard` 号模板 `csharp\n[CreditCard(ErrorMessage = \"{0} is not\
  \ a valid credit card number\")]\n``` |\n| `DataType` | 使用 `DataType` 属性来指定属性数据类型之外的预期数据类型。以下是支持的类型值：<br>-\
  \ `CreditCard`: 代表信用卡<br>- `Currency`: 代表货币值<br>- `Custom`: 代表自定义数据类型<br>- `Date`:\
  \ 代表日期值<br>- `DateTime`: 代表一个时间点，表示为日期和时间<br>- `Duration`: 代表对象存在的持续时间<br>- `EmailAddress`:\
  \ 代表电子邮件地址<br>- `Html`: 代表 HTML 文件<br>- `ImageUrl`: 代表图像的 URL<br>- `MultilineText`:\
  \ 代表多行文本<br>- `Password`: 代表密码值<br>- `PhoneNumber`: 代表电话号码值<br>- `PostalCode`: 代表邮政编码<br>-\
  \ `Text`: 代表显示的文本<br>- `Time`: 代表时间值<br>- `Upload`: 代表文件上传数据类型<br>- `Url`: 代表 URL\
  \ 值 `csharp\n[DataType(DataType.Date)]\n``` |\n| `Display` | `Display` 属性并不是真正的验证属性，而是当该属性被引用时在\
  \ UI 中显示的值。此字段将影响在视图中使用的 `@Html.LabelFor` 值，并在显示属性名称时也用于 `ErrorMessages`。`csharp\n\
  [Display(Name=\"Marital status\")]\n``` |\n| `EmailAddress` | 确保属性的值符合已知的电话号码模板\
  \ `csharp\n[EmailAddress(ErrorMessage = \"{0} is not a valid email address\")]\n\
  ``` |\n| `FileExtensions` | 确保属性的值以 `Extensions` 属性中列出的适当值结尾。请注意你不需要添加“.”；验证框架会为你完成这一点。你可以将过滤后的扩展名字符串作为\
  \ `ErrorMessage` 的部分。`csharp\n[FileExtensions(Extensions = \"jpg,jpeg\", ErrorMessage\
  \ = \"{0} is not a valid extension - {1}\")]\n``` |\n| `MaxLength` | 确保属性的值不超过属性中定义的字符数。此属性将成为数据库定义的一部分，因为表中的列将设置为与此值相同的宽度。`ErrorMessage`\
  \ 允许你添加设置的最大长度值。`csharp\n[MinLength(5, ErrorMessage=\"{0} needs to be at least {1}\
  \ character\")]\n``` |\n| `MinLength` | 确保属性值的字符数不少于属性定义的数量。`ErrorMessage` 允许你添加设置的最小长度值。`csharp\n\
  [MinLength(5, ErrorMessage=\"{0} needs to be at least {1} character\")]\n``` |\n\
  | `Phone` | 确保属性的值符合已知的电话号码模板 `csharp\n[Phone(ErrorMessage = \"{0} is not a valid\
  \ phone number\")]\n``` |\n| `Range` | 确保属性的值在已知的范围内。使用此验证器时，你首先定义数据类型，然后定义从最低到最高范围的字符串版本。当你创建显示给用户的\
  \ `ErrorMessage`（或作为异常的一部分抛出）时，它使用 `string.Format` 标记：`{0}` = 字段的显示名称，`{1}` = 范围下限，`{2}`\
  \ = 范围上限。`csharp\n[Range(typeof(DateTime), \"1/1/1900\", \"12/31/2020\", ErrorMessage\
  \ = \"{0} must be between {1} and {2}\")]\n``` |\n| `RegularExpression` | 允许你使用\
  \ `RegularExpression` 来验证正在存储的数据 `csharp\nRegularExpression(@\"^[a-zA-Z''-'\\s]{1,40}$\"\
  , ErrorMessage = \"Characters are not allowed.\")\n``` |\n| `Required` | 将字段定义为必填。这意味着必须向属性中输入某个值。在使用代码优先（code\
  \ first）方法时，`Required` 属性还会与数据库交互，因为它确保构建的表将映射列定义为不支持空。`csharp\n[Required(ErrorMessage\
  \ = \"Please tell us how many in your home\")]\n``` |\n| `StringLength` | 此属性可用于设置字符串属性的最小和最大长度。`StringLength`\
  \ 与 `MinValue/MaxValue` 的主要区别在于 `StringLength` 允许你同时设置最大和最小值，且它只能用于类型为字符串的属性。`csharp\n\
  [StringLength(15, MinimumLength = 2, ErrorMessage = \"{0} must be between {2} and\
  \ {1} characters\")]\n``` |\n| `Url` | 确保属性的值符合 URL 格式 `csharp\n[Url(ErrorMessage\
  \ = \"{0} is not a valid URL\")]\n``` |\n\n**表 12.3** 用于验证的数据属性\n\n在接下来的活动中，你将更新数据模型以使用数据程序标记和验证。\n\
  \n一旦你在服务器端添加了数据验证规则，你就需要将这些规则挂载到 UI 上，以便你也能支持客户端验证。\n\n### 客户端验证\n\n服务器端验证是任何持久化数据并对数据有效性有要求的应用程序中必不可少的一部分。然而，正如在本章稍早提到的，配合客户端验证可以提供更好的整体用户体验，因为当验证失败时，用户可以获得更及时的反馈，而无需往返服务器。\n\
  \n当你向 ASP.NET Web 表单中添加客户端验证时，你只是为该字段设置了规则。\n\n\n\n\n\n与 ASP.NET Web Forms 类似，MVC\
  \ 允许你执行请求验证。请求验证是在当表单字段提交到 MVC 应用时，检查该字段是否包含 HTML 元素或其他潜在的脚本项。事实上，除非你决定关闭它，否则每次提交都会发生请求验证，因为请求验证默认是开启的。\n\
  \n在 ASP.NET Web Forms 中，你控制整个页面的请求验证。由于 MVC 并没有真正的“页面”概念，你通过一个可以使用在控制器或单个操作（action）上的属性来控制设置，如下所示：\n\
  \n```c\n[ValidateInput(false)]\n[HttpPost]\npublic ActionResult Create(UserDemographics\
  \ obj)\n```\n\n在前面的代码段中，你可以看到决定是否对输入进行验证的属性 `ValidateInput`。当你⠀没有手动设置该属性时，系统会将每个请求视为已标记为\
  \ `ValidateInput(true)` 的请求。要关闭请求验证，只需将该属性设置为 `false` 即可。\n\n当属性设置为 `false` 时，操作将不会对传送到服务器的任何进行验证。在某些情况下，这是可以接受的，但如果你有一个包含多个字段的大表单，你可能不希望每个字段都开放以接收\
  \ HTML（当关闭控制器验证时的默认设置）。\n\nASP.NET MVC 的开发者意识到了这一需求，并添加了一种特殊的属性，你可以将其放在模型类上，即 `System.Web.Mvc.AllowHtml`。当在典型的模型属性上使用时，代码可能如下所示：\n\
  \n```c\n[AllowHtml]\n[Display(Name=\"Description\")]\n[Required(ErrorMessage = \"\
  Please enter a Description\")]\n[StringLength(150, MinimumLength = 2)]\npublic string\
  \ Description { get; set; }\n```\n\n通过仅对你预期会出现 HTML 的属性进行标记，你可以保持输入验证——仅允许在特定属性上使用\
  \ HTML，而不是跨越整个请求。\n\n## 验证提示\n\n以下列表提供了关于验证数据的实用提示：\n\n* 始终验证所有用户输入。每当你在互联网上拥有公共网站时，你就失去了控制其用户的能力。为了防止恶意用户向你的系统输入虚假或恶意数据，请务必使用\
  \ ASP.NET 验证控件始终验证用户的输入。\n* 从客户端传入的所有数据都应该经过某种类型的验证；很容易意外输入无效数据，例如使用大写字母“O”代替数字\
  \ 0，或使用字母“l”代替数字 1。\n* 始终在你的验证控件中提供有用的错误信息。可以将错误消息分配给 `ErrorMessage` 属性并留空 `Text`，或者使用\
  \ `ValidationSummary` 控件显示错误消息列表。你提供给用户关于问题的细节越详细，他们解决问题就越容易。\n* 只要可能，直接指向用户正在处理的问题数据，而不是尝试通过文本描述它。最常用的方法是将验证消息直接放在正在被验证的输入框旁边。\n\
  * 如果你必须在客户端验证或服务器端验证之间做出选择，请始终选择服务器端验证。客户端验证可以被恶意用户破坏。\n\n## 总结\n\n验证是确保用户提供的信息符合特定标准的过程。在验证数据时，方法可能会取决于你在何处执行验证以及你将如何检查数据。\n\
  \n你在何处执行验证是非常直观易懂，因为对于这一点你只有两个选择：服务器和客户端。你永远不应认为在服务器上进行验证是可选的，因为只有在那里，你才能确保验证已应用到要持久化的信息上；客户端验证可以被关闭或绕过。客户端验证提供了更好的用户体验，并可以消除到服务器的不必要的往返，但服务器端验证负责在持久化之前立即检查数据。\n\
  \n当你考虑验证时，你不仅需要确保系统免受坏数据的影响，还需要确保在用户需要修复数据时提供适当的反馈。这种返回给用户的消息在客户端验证中通常效果最好，因为他们可以对问题获得即时响应。\n\
  \n由于同时需要客户端和服务器验证，ASP.NET Web Form 控件提供了这两者。它们允许你定义验证规则，用于检查输入值，然后提供浏览器在提交前用于验证信息的\
  \ JavaScript，以及可以进行检查以确保值有效的服务器端代码。有多种验证控件可用，每个控件都支持验证与其关联的特定字段中输入数据的不同方法。\n\nMVC\
  \ 中的验证是不同的，但你可以根据在模型上创建的规则在双方执行验证。视图有一个助手，它可以利用模型中的规则并以这种方式配置输入元素，使得 jQuery 库在提交表单时自动执行验证。当数据返回服务器时，可以对请求运行相同的验证，以确保在利用这些信息之前它是有效的。\n\
  \nWeb Forms 和 MVC 都提供了在客户端和服务器端对数据验证的支持。它们采用的方法不同，但它们都解决了同一个需求，帮助你确保向系统中添加尽可能的数据。\n\
  \n### 练习题\n\n1. **1.** 当用户仅在与以下代码链接的视图的 Title 字段中输入 HTML 代码时，服务器预期的行为是什么？如果只将 HTML\
  \ 代码放在 Description 字段中会发生什么？\n\n```csharp\n[ValidateInput(true)]\npublic class TestController\
  \ : Controller\n{\n    [HttpPost]\n    public ActionResult Create(MyModel model)\n\
  \    {\n        return View();\n    }\n    public ActionResult Create()\n    {\n\
  \        return View();\n    }\n}\npublic class MyModel\n{\n    [Required]\n   \
  \ [StringLength(50)]\n    public string Title { get; set; }\n    [Required]\n  \
  \  [AllowHtml]\n    [StringLength(5000)]\n    public string Description { get; set;\
  \ }\n}\n```\n\n2. **2.** 假设你正在使用 ASP.NET Web Forms 页面并将 `RangeValidator` 放在 `RequiredValidator`\
  \ 之上，它们都验证同一个控件。如果你交换验证控件的顺序，行为会有什么区别？\n\n3. **3.** 是否可以以某种方式对模型进行验证，使得该模型永远无法有效？\n\
  \n## 本章学习内容\n\n| 客户端验证 | 客户端验证是确保用户输入的信息符合定义模板的过程。它之所以被称为客户端，是因为所有检查都在浏览器中完成，在表单提交到服务器之前。如果验证失败，表单信息永远不会提交到服务器；相反，会向用户显示验证错误的消息。\
  \ |\n| 比较验证 | 当执行比较验证时，你在将一个字段的值与另一个值进行比较。另一个值可以是另一个字段、常量值或某种计算结果。主要的考虑是将元素的值与另一个值进行比较。\
  \ |\n| 数据长度验证 | 确定输入长度（或字符数量）是否适当的过程。这种类型的验证通常只对字符串执行。它由一个最小长度（默认为 0）和一个最大长度组成。\
  \ |\n\n\n\n\n\n| 数据类型验证 | 对提交元素中的值进行判断，确定该值是否可以转换或解析为定义的类型。 |\n| :--- | :--- |\n\
  | `ModelState` | 一个包含关于模型状态信息的结构（令人惊讶的是确实如此）。在运行 `ValidateModel` 方法后，`IsValid` 属性提供有关所有验证规则是否已成功通过的信息。\
  \ |\n| `Page.IsValid` | 这是 ASP.NET Web Forms 中的一种代码后台检查，用于判断页面内容是否成功通过了在各种验证控件中定义的所有验证规则。它是对信息有效性的服务器端验证。\
  \ |\n| 范围验证 | 确定元素的值是否在特定的两个值之间。通常用于数值类型和日期。在范围验证中，第一次检查是确认该值是否可以解析为相应的类型，第二次检查确认它是否在为范围设置的最小值和最大值之间。\
  \ |\n| 正则表达式验证 | 将元素的值与正则表达式进行比较。如果该值符合正则表达式建立的模板，则验证成功。 |\n\n| 请求验证 | 这一过程用于确定客户端提交的数据是否包含某些格式，这些格式在直接显示给其他用户时可能会产生某些风险（例如用于下载病毒的\
  \ JavaScript 等）。请求验证通常默认启用，这意味着包含类似 HTML 标签的信息将不会允许在服务器上处理。 |\n| 必填字段 | 确保元素具有值。具有值通常被定义为设置为默认值以外的值，例如，字符串默认为\
  \ NULL，因此任何值（即使是空字符串）在此目的上都会被视为一个值。 |\n| 服务器端验证 | 这是最重要的验证，因为它是服务器对数据的最终检查，确保系统从用户那里接收的数据符合所有必要要求。\
  \ |\n| 非侵入式验证 (Unobtrusive Validation)| 非侵入式验证是用于 ASP.NET MVC 的 jQuery 验证方法。它允许开发者在输入元素上使用预定义的（由\
  \ JavaScript 库定义）自定义属性，为验证子系统提供验证信息。这些属性中的值有助于子系统确定需要检查哪些规则，并向用户提供有关过程状态的反馈。 |\n\
  | `ValidateModel` | 控制器上的一个方法，根据模型中的数据注解对模型进行验证。通常与 `ModelState` 配合使用，后者包含了关于模型的各种信息，包括验证是否成功。\
  \ |\n\n# 第 13 章：ASP.NET AJAX\n\n## 你将在本章中学习到：\n* AJAX 如何与 ASP.NET 框架结合\n* 利用 Web\
  \ Forms 控件进行 AJAX 调用\n* 使用 Web Forms 控件向用户显示状态\n* 创建 REST Web 服务以支持 AJAX\n* 使用 jQuery\
  \ 在 MVC 中支持 AJAX\n\n## 本章代码下载：\n本章的 [wrox.com](http://wrox.com) 代码下载可以在 [www.wrox.com/go/beginningaspnetforvisualstudio](http://www.wrox.com/go/beginningaspnetforvisualstudio)\
  \ 的“Download Code”选项卡中找到。代码位于第 13 章下载中，并根据章节中的名称单独命名。\n\n当你谈论 Web 开发并听到 AJAX 术语时，它很少是指希腊神话中的英雄。相反，它指的是一种在\
  \ 2005 年和 2006 年开始流行的 Web 通信方法：异步 JavaScript 和 XML。AJAX 的主要目的是允许用户浏览器与服务器之间进行通信，而无需进行全页面刷新。\n\
  \n这种通信并不在 HTTP 协议之外，而是使用 HTTP 在网页的不同区域内通信较小的信息，而不是使用默认的“整个页面”方法。这正变得越来越常见，因为它提供了一种更像桌面应用程序的体验，因为页面上的信息根据某些条件（时间、用户操作等）进行刷新，而无需通过整个页面的获取，而后者会防止用户在请求处理期间无法在浏览器中进行工作。\n\
  \nAJAX 已经发生了巨大的演变，但主要的变化与 JavaScript 用的管理方式以及传输信息的格式化有关。在接下来的几个章节中，你将一直处理这些新变化，你将使用\
  \ jQuery 处理 JavaScript，并使用 JavaScript 对象表示（JSON）定义数据传输的格式，而不是 XML。换句话说，你并没有真正在做\
  \ AJAX；相反，你是在做类似于 JQJN（带有 JSON 的 jQuery，但由于这听起来不顺口，我们将尊重传统继续称其为 AJAX）。\n\n## 引入\
  \ AJAX 概念\nAJAX 的核心点是支持异步通信。你目前为止所使用的传统网页方法是同步的，因为一旦向服务器发送了请求，浏览器倾向于停止正在执行的操作并等待服务器响应下一组内容。在同步方法下，一旦你点击提交按钮，你就只能坐在那里等待响应。\n\
  \n等待响应是无法避免的。Web 程序的意义在于物理上分离的客户端与服务器之间的通信——它们几乎都在不同的网络上，甚至可能在不同的大陆。然而，可以控制的是等待服务器响应期间停止其他工作。这就是异步通信发挥作用的地方。显然，如果\
  \ {更异步的通信方法，那么用户就可以避免等待服务器响应，而可以在与服务器进行后台通信的同时继续在客户端工作。承认的是，这提供了一个更复杂的通信模型，如图 13.1\
  \ 所示，但它为用户提供了更流畅、更积极的体验。\n\n![经典同步模型和 AJAX 异步模型的图。从浏览器到服务器的通信在两种模型中都用箭头标记。](img/c13f001.jpg)\n\
  \n图 13.1 经典和异步模型\n\n图 13.1 展示了两种模型之间的某些差异。它们确实有一些共同部分，例如页面切换，即整个页面被另一个页面替换。然而，还有额外的通信从网页通过\
  \ jQuery 到服务器，然后服务器响应 jQuery 调用，最后由 jQuery 获取响应并更新 UI。这代表了这种通信的异步部分——发送到服务器的请求使用户户在后台进行处理时能够继续工作。\n\
  \n\n\n\n第三种响应类型（也是 AJAX 的第二种方法）向页面返回单个对象，这就像你将模型传递给 MVC 视图一样，然后 JavaScript 获取该模型并将其解析为包含每个值的\
  \ HTML 元素。这种方法常见于股票走势图等功能，在这些功能中，包含所有显示信息的对象会根据需要被下载，旧值会被简单地替换为新值。在调用期间，HTML 元素不会被替换；相反，由\
  \ JavaScript 功能替换元素内部的值。\n\n在进行 AJAX 开发工作时，较复杂的因素之一是调试该过程并确保从服务器回回的信息是正确的。到目前为止，你所进行的所有调试都是在服务器端代码中，或者可能是在查看服务器返回的\
  \ HTML 源代码；然而，异步通信引入了一套完全不同的复杂性，因为服务器返回的信息片段不会出现在上述任何一种方法中。你将在接下来的几个章节中更详细地看到其中的一些复杂性以及如何修复它们。\n\
  \n### F12 开发者工具\n\n你可能没有意识到，但大多数现代 Web 浏览器都包含了一套开发工具，你可以使用这些工具来理解和调试发送到浏览器的 HTML。Google\
  \ Chrome 的开发者工具如图 13.2 所示。\n\n![应用程序运行界面和右侧 Google Chrome 开发者工具的截图。](img/c13f002.jpg)\n\
  \n图 13.2 Google Chrome 开发者工具\n\n带有 Google Chrome 的这些工具允许你查看 HTML 元素，查看样式是如何应用的，并允许你进行临时更改以查看它们如何影响你的网站布局。它们还提供了获取有用信息的能力，例如总下载大小、下载时间以及许多其他信息，帮助你更好地理解网站的\
  \ HTML 输出以及浏览器将如何解释这些信息。\n\nMozilla Firefox 有它自己的版本的开发者工具，如图 13.3 所示。它们的外观有所不同，但大部分基础信息是相同的，因为无论你使用哪种浏览器来解析和查看内容，你对网页所感兴趣的信息都是相同的。\n\
  \n![应用程序运行界面和右侧下拉菜单中 Mozilla Firefox 开发者工具的截图。](img/c13f003.jpg)\n\n图 13.3 Mozilla\
  \ Firefox 开发者工具\n\n在接下来的几个章节中，你将利用第三套开发工具：Internet Explorer 的 F12 开发者工具。它们被巧妙地称为\
  \ F12 工具，因为你可以使用 F12 功能键来访问它们。如果你的键盘上没有功能键，可以使用 Internet Explorer 的“工具”菜单。这些工具也适用于微软的\
  \ Windows 10 Edge 浏览器（Windows 10 中 Internet Explorer 的替代品）。接下来的“尝试一下”将引导你如何使用示例应用程序使用\
  \ F12 工具。\n\n现在你已经能够评估在客户端和服务器之间传输的数据，可以开始将 AJAX 添加到你的应用程序中了。\n\n### 在 Web Forms\
  \ 中使用 ASP.NET AJAX\n\n判断网站和页面是否没有使用 AJAX 最明显的方法是观察新页面加载时的闪烁或闪动。AJAX 允许你通过只刷新页面的部分来避免这种情况。在\
  \ ASP.NET Web Forms 中实现 AJAX 需要一些新的服务器控件。AJAX 控制列表如图 13.12 所示。\n\n![列出下方选项的 AJAX\
  \ 扩展菜单截图。](img/c13f012.jpg)\n\n图 13.12 Visual Studio 中可用的 AJAX 控件\n\n#### 初始 AJAX\
  \ 体验\n\n这些 AJAX 特有控件中最重要的是 `UpdatePanel`。`UpdatePanel` 用于定义通过 AJAX 更新的页面部分，控件中包含的项目即为刷新的区域。虽然\
  \ `UpdatePanel` 可能是最重要的控件，但如果无法访问页面上的 `ScriptManager` 控件，它无法工作。\n\n你可以在页面上放置任意数量的\
  \ `UpdatePanel` 控件，每个控件包含你希望进行异步处理的屏幕区域。通常，会有要显示的信息和更新内容的方法，例如按钮或设置为在更改时自动回传的下拉列表。无论页面上有多少个\
  \ `UpdatePanel`，你只需要一个 `ScriptManager` 控件，因为它设计用于持有同一页面中所有面板的脚本。\n\n唯一不需要在与 `UpdatePanel`\
  \ 同一页面上的 `ScriptManager` 的情况，是你在引用的主页（master page）中有一个 `ScriptManager`。然而，虽然在这种情况下你不需要确保在该特定页面上包含\
  \ `ScriptManager`，但你需要一个 `ScriptManagerProxy` 控件，以便本地的 `UpdatePanels` 能够连接到托管页面中的\
  \ `ScriptManager`。图 13.13 显示了所有控件之间的链接。\n\n![带有箭头的同页面 UpdatePanel 与 ScriptManager\
  \ 关系图。](img/c13f013.jpg)\n\n图 13.13 UpdatePanel 与 ScriptManager 关系\n\n为止所有的讨论都是关于在页面使用\
  \ `UpdatePanel`。你并不限于将其放在页面或主页上；`UpdatePanel` 也可以添加到用户控件中。在下一个“尝试一下”中，你将更新你在第 11\
  \ 章中构建的控件，以便通过分页在同一控件中查看其他通知，而无需回传整个页面。\n\n`UpdatePanel` 的默认用法应该增强网站的可用性（通过 AJAX\
  \ 的实现）。这种体验可以进一步增强。\n\n#### 增强 AJAX 体验\n\n到目前为止通过控件的体验已经增加了可用性。你还可以添加另外两个 AJAX 服务器控件来进一步增加可用性。这些控件\
  \ `UpdateProgress` 和 `Timer` 各自采取不同的方法来帮助增强使用 Web 应用程序时的体验。\n\n`UpdateProgress`\
  \ 控件是一种向用户传递信息的通信工具；它提供了在页面执行某些工作时通知用户的能力。在你刚刚过的示例中，很难发现对这种控件的需求，因为一切发生得很快，而且工作简单且都位于同一台机器上。然而，在那些处理可能需要几秒钟的情况下，让用户知道正在发生某些非常重要。如果他们点击了按钮页面停在那里，许多用户会再次点击按钮。可能会在服务器上产生问题，例如对用户的信用卡重复收取两次订单。\n\
  \n另一个控件 `Timer` 允许你消除通过用户交互触发更新的需求。相反，你设置一个值，使得模板按照配置自动更新，而不是需要用户输入。这允许你添加诸如自动滚动列表或定期更换图像的功能。\n\
  \n在下一个活动中，你将把这两个控件添加到你之前正在操作的 `UpdatePanel` 中。\n\n### 在 MVC 中使用 AJAX\n\n\n\n\n\n\
  当你考虑将 AJAX 引入应用程序时，ASP.NET Web Forms 和 ASP.NET MVC 之间不同的实现方法模式依然存在。Web Forms 围绕各种服务器控件的使用来实现支持。而\
  \ MVC 则通过使用设计用于支持 AJAXset 的 HTML 助手采取了不同的方法。\n\n在这些工具中，最重要的且你在这里将使用的是 `@Ajax.ActionLink`\
  \ 助手。该助手用于创建一个链接，点击该链接时会调用控制器、获取部分视图（partial view），然后将部分视图返回的内容放入页面上的特定区域。虽然这看起来很复杂，但操作起来其实很简单。你首先需要在页面上放置一个元素，作为新内容引用的参考。你可以将其类比为\
  \ Web Forms 中的 `UpdatePanel`，但它仅仅是一个 HTML 元素（通常是 `<div>` 或 `<span>`），你可以对它进行唯一标识，如下例所示：\n\
  \n```\n<div id=\"elementtobeupdated\">content to be replaced</</div>\n```\n\n一旦你知道了内容将去向哪里，就可以构建\
  \ `Ajax.ActionLink`。此 `ActionLink` 有许多种不同的方法签名，每种签名都需要不同的信息集。方法签名中的各个项目列在 表 13.2\
  \ 中。\n\n| `Variable` | 描述 |\n| :--- | :--- |\n| `Action` | `Action` 是点击项目时要调用的方法。为了使其正常工作，此操作需要返回一个部分视图。\
  \ |\n| `AjaxOptions` | `AjaxOptions` 对象用于设置执行操作时预期发生的情况。可用属性包括：：HttpMethod：指示在发起\
  \ AJAX 请求时使用的 HTTP 方法（`GET` 或 `POST`）。Confirm：用于在确认对话框中向用户显示消息。如果用户选择 OK，则进行对服务器的调用。OnBegin：定义在请求开始时调用的\
  \ JavaScript 函数名称。OnComplete：指定请求完成后调用的 JavaScript 函数名称。OnSuccess：指定请求成功时调用的 JavaScript\
  \ 函数名称。OnFailure：指定如果请求失败时调用的 JavaScript 函数名称。LoadingElementId：在进行 AJAX 请求期间，你可以向终端用户显示进度消息或动画。给此属性赋值的值标识页面上的一个元素。此\
  \ AJAX 助手仅显示和隐藏该元素。UpdateTargetId：指定特定 DOM 元素的 ID。该特定元素将由操作方法返回的 HTML 填充。InsertionMode：定义调用完成后新内容如何在屏幕上使用。可能值为\
  \ `InsertAfter`、`InsertBefore` 和 `Replace`。 |\n| `Controller` | 包含响应请求的操作控制器名称。你不需要包含字符串中的“Controller”部分。如果未提供控制器，则引用的操作位于创建当前视图的控制器上。\
  \ |\n| `Route Values` | 路由值是添加到路由中以便在操作内部使用的项目。根据你的设置和需求，这些项目将是 URL 值或查询字符串值（query\
  \ string values）。 |\n| `Text to Display` | 此项目项目是应该显示的文本——即出现在屏幕上的文字，点击这些文字会触发对操作的调用。\
  \ |\n\n表 13.2 填充 Ajax.ActionLink 的潜在项目\n\n因此，添加一个内容将被替换的区域以及更新该替换区域的页面部分，看起来如下代码所示：\n\
  \n```\n<div id=\"elementtobeupdated\">content to be replaced</</div>\n@AJAX.ActionLink(\"\
  Click Me\",\n                \"Details\",\n                \"ClickMe\",\n      \
  \          new { @Model.Id },\n                new AJAXOptions\n               \
  \ {\n                    UpdateTargetId = \"elementtobeupdated\",\n            \
  \        InsertionMode = InsertionMode.Replace,\n                    HttpMethod\
  \ = \"GET\"\n                }) \n```\n\n`<div>` 元素包含了将被替换的内容。这两个引用（与之交互的元素以及对内容的处理方式，在本例中为替换）都设置在\
  \ `AJAXOption` 类中。\n\n如果你将此 `ActionLink` 与你之前处理过的 `Html.ActionLink` 进行比较，你会发现区别在于这个\
  \ `AJAXOption` 类；所有其他参数都与你构建简单的 `ActionLink` 时可能使用的参数相同。\n\n在整个过程中进行的所有其他工作也是你以前做过的工作；你只是将所有这些工作封装到了基于\
  \ AJAX 的功能中。你将在下一个“尝试一下”（Try It Out）中看到这些。\n\n在本章你处理过的两个实例中，你都在往返发送 HTML 内容，并用新信息替换预先存在的内容。在处理\
  \ AJAX 工作时，除了发送 HTML 之外还有其他方法。在下一节中，你将检查这些其他方法之一。\n\n## 在 AJAX 网站中使用 Web 服务\n\n\
  通过 AJAX 发送 HTML 内容是一种简单的方法，对客户端和服务器的工作要求都极小。然而，传回客户端的信息存在冗余。在上一次活动中，你创建了一个 AJAX\
  \ 调用，返回了一个简略的信息集，再次所示：\n\n```\n<span># in Cart: 2</span><span class=\"moveLeft\"\
  >Value: $50.00</span>\n```\n\n\n\n\n从技术上讲，Web 服务通常被定义为两台计算机之间通过网络进行通信的方法。然而，这意味着你到目前为止所做的一切工作都是基于\
  \ Web 服务的，因为你正在构建的是一个允许一台计算机（客户端）与另一台计算机（服务器）通信的系统。这就是为什么我们使用一个更具体的定义，即 Web 服务是两台计算机之间通信对象信息的方法。这个对象不是\
  \ HTML，而是对象的序列化版本。\n\n在当前的 `.NET` 环境中，有三种创建 Web 服务的不同方法：`Windows Communication Foundation\
  \ (WCF)`、`ASP.NET Web API` 和 `ASP.NET MVC`。这些方法在工作原理以及在开发项目中的典型用途上各不相同。\n\n### WCF\n\
  `WCF` 是一个支持不同计算机之间通信的完整框架。它提供了庞大的功能集，并支持许多不同的协议，包括 `HTTP` 以外的协议。它是微软 `.NET Framework`\
  \ 中支持通信的企业级领域。正如你所猜到的，`WCF` 包含许多不同的功能，在某些情况下，使用 `WCF` 是任务关键的。而我们的情况并不属于此类之一。\n\n\
  ### ASP.NET Web API\n在 `.NET` 中创建 Web 服务的另一种方法是使用 `ASP.NET Web API`。`Web API` 是一个更精简的\
  \ Web 服务管理系统；它仅支持创建 `REST` 服务，而 `WCF` 支持创建许多不同的服务。使用 `Web API` 允许开发者构建与你在处理 `ASP.NET\
  \ MVC` 时创建的 URL 非常的 URL。\n\n### ASP.NET MVC\n提到 `ASP.NET MVC`，你也可以通过控制器的操作（actions）在\
  \ `MVC` 中创建 Web 服务。你可以通过更改返回值将 `MVC` 操作转换为 Web 服务。到目前为止，你处理的大多数操作都返回了某种类型的视图（完整或部分）。然而，你可以同样轻松地从\
  \ `View` 返回序列化对象而不是 HTML，如下所示：\n\n```javascript\npublic ActionResult Details(int\
  \ id)\n{\n    using (RentMyWroxContext context =\\ new RentMyWroxContext())\n  \
  \  {\n        Item item =\\ context.Items.FirstOrDefault(x =\\> x.Id =\\=\\ id);\n\
  \        return Json(item, JsonRequestBehavior.AllowGet);\n    }\n}\n```\n\n这段代码片段应该很熟悉；唯一的区别是，该方法不是返回\
  \ `View(item)`，而是返回一个将对象转换为 `JSON` 方法的结果。此外，获取此对象的 URL 将是 `\\Item\\Details\\5`，用于获取\
  \ `Id` 为 5 的 `Item`。\n\n`Web API` 也使用控制器和操作过程并带有路由，就像 `MVC` 一样。然而，命名过程是不同的，因为 URL\
  \ 和`HTTP` 方法是完全集成的，使得你在 `MVC` URL 中常见的中间描述符被省略了。因此，在 `Web API` 应用中，你使用的默认 URL 是\
  \ `\\Item\\5`，因为对该 URL 执行 `GET` 意味着你想查看该项目。对该 URL 执行 `PUT` 或 `POST` 则将是创建或更新 `Item`\
  \ 对象。\n\n`Web API` 能够避免这种中间描述符，因为它不需要担心创建 HTML。如果你查看 `MVC`，你会发现这个中间描述符通常更多是关于你将默认（通过约定）使用的视图，而不是关于其他任何东西；因此，`\\\
  Item\\Details\\5` 调用默认会期望调用一个名为 `Details` 的 Action，并返回一个也名为 `Details` 的视图。`Web API`\
  \ 不需要担心这些，因此它采取了不同的方法。\n\n以下代码段显示了一个完整的控制器，它涵盖了一个对象的所有可用方法，在本例中，这是一个 `Item`：\n\n\
  ```csharp\npublic class ItemsController : ApiController\n{\n    // GET api/items\n\
  \    public IEnumerable<Item> Get()\n    {\n        using (RentMyWroxContext context\
  \ =\\ new RentMyWroxContext())\n        {\n            return context.Items.OrderBy(x\
  \ =\\> x.Name);\n        }\n    }\n    // GET api/items/5\n    public Item Get(int\
  \ id)\n    {\n        using (RentMyWroxContext context =\\ new RentMyWroxContext())\n\
  \        {\n            return context.Items.FirstOrDefault(x =\\> x.Id =\\=\\ id);\n\
  \        }\n    }\n    // POST api/item\n    public void Post(Item item)\n    {\n\
  \        using (RentMyWroxContext context =\\ new RentMyWroxContext())\n       \
  \ {\n            var savedItem =\\ context.Items.Add(item);\n            context.SaveChanges();\n\
  \        }\n    }\n    // PUT api/items/5\n    public void Put(int id, [FormValues]\
  \ values)\n    {\n        using (RentMyWroxContext context =\\ new RentMyWroxContext())\n\
  \        {\n            var item =\\ context.Items.FirstOrDefault(x =\\> x.Id =\\\
  =\\ id);\n            TryUpdateModel(item);\n            context.SaveChanges();\n\
  \        }\n    }\n    // DELETE api/items/5\n    public void Delete(int id)\n \
  \   {\n        using (RentMyWroxContext context =\\ new RentMyWroxContext())\n \
  \       {\n            var item =\\ context.Items.FirstOrDefault(x =\\> x.Id =\\\
  =\\ id);\n            if (item !=\\ null)\n            {\n                context.Items.Remove(item);\n\
  \                context.SaveChanges();\n            }\n        }\n    }\n}\n```\n\
  \n`Web API` 的一个让你脱颖看到的默认功能是其命名与`HTTP` 方法直接对应。如果你查看注释，你可以看到每个方法如何直接对应：\n\n*   获取对象列表。\n\
  *   查看特定对象。\n*   创建一个新对象。\n*   更新现有对象。\n*   删除对象。\n\n`ASP.NET MVC` 和 `ASP.NET Web\
  \ API` 的另一个区别是，使用 `Web API` 管理过程提供了开箱即用的活性。因为 `Web API` 专门提供序列化对象而构建，它为你处理了序列化过程。此对象可以通过多种格式返回，最常见的是\
  \ `JSON` 和 `XML`。在 `ASP.NET MVC` 中构建这些时，你定义返回的项目格式。这意味着如果你想支持 `JSON` 和 `XML` 格式，以便不同的请求者获取他们偏好的格式，你必须为两者编写代码。而在\
  \ `Web API` 中执行相同操作时，你不需要担心转换为相应的格式；`Web API` 会根据请求头为你处理；你只需要担心返回正确的对象。\n\n## AJAX\
  \ 中的 jQuery\n创建 Web 服务允许你将信息下载到客户端应用程序。然而，此时这些信息仅仅是表示对象的字符串。使用这些项目来影响 UI 是 jQuery\
  \ 发挥作用的地方。下一章将对可用功能进行深入介绍。本节仅涵盖支持基于对象的 AJAX 调用所需的部分。\n\n在 AJAX 中使用 jQuery 时，特别有一部分是必要的，那就是发起服务器调用的代码。用于执行期望返回\
  \ `JSON` 的 `GET` 请求的 jQuery 方法是 `getJSON` 方法，如下所示：\n\n```javascript\n$.getJSON(\"\
  url to call\")\n```\n\n\n\n\n区分 jQuery 最重要的特征之一是 `$`。这并不是指如果你精通 jQuery 就能赚到所有的钱；它类似于一个命名空间，用于定义紧随其后的操作是作为\
  \ jQuery 库的一部分。\n\n`$` 可能会让人产生困惑。在上一个示例中，它主要用作命名空间表示 jQuery。然而，它也被用于识别选择器（selection），例如：\n\
  \n```\n$(\"#someDOMelement\").html(\"some content\");\n```\n\n在这个示例中，`$()` 表示一种识别\
  \ DOM 中某些内容的方法，在这种情况下，它是指 `id` 为“someDOMelement” 的元素。选择器的作用与 CSS 中的选择器一样，因此在这种情况下，你可以判断出你正在尝试匹配的是一个\
  \ `id`，因为选择标识符中包含了“#”符号。\n\n区分这些用法的唯一方法是：`$` 是紧跟在一个组包含选择器的括号后面，还是紧跟在一个句号后面。当它紧跟句号时，你就知道\
  \ `$` 指的是一个核心方法，在本例中是 `getJSON`。之前的用法中不清楚的是如何处理调用返回的数据。\n\n`getJSON` 方法有几个不同的回调函数，你可以使用它们来管理调用的结果。完整定义所示：\n\
  \n```\n$.getJSON(\"url to call\")\n    .done(function (data) {})\n    .failure()\n\
  \    .always();\n```\n\n这些都利用了 jQuery 的 Promise 框架（在下一章中详细介绍），你实际上可以根据需要将许多个不同的回调链在一起——无论是同一个回调的多个实例（如\
  \ `done`），还是根据你需要的每个回调各一个。\n\n`done` 回调定义了你想要在调用返回的 JSON 对象上执行的工作。这项工作可以在匿名函数中完成，也可以在定义良好的函数完成。`failure`\
  \ 回调旨在允许客户端管理请求中的问题。例如，如果服务器返回服务器错误，则会处理 `failure` 回调，而不是 `done` 回调。`always` 回调会在每次请求完成时被调用，无论它是成功并进入了\
  \ `done` 回调，还是失败并进入了 `failure` 回调。\n\n在接下来的活动中，你将创建 jQuery 代码，既调用服务器又操作 DOM 中的项。这意味着你将看到这两种使用\
  \ `$` 前缀的方法。\n\n手动编写 AJAX 调用确实比使用 Web Forms 服务器控件或 MVC AJAX 助手要工作得多，但在 ASP.NET 中使用\
  \ jQuery 库使得在 JavaScript 中编写 AJAX 代码变得非常简单。显然，有更复杂的方法执行 AJAX 交互，例如对传入 action 的填充对象执行\
  \ `POST` 操作，但那些更多是程度上的差异，而不是工作量的显著增加；jQuery 让你的工作变得简单，就像你之前使用的其他助手一样。\n\n## 实用的\
  \ AJAX 技巧\n\n以下技巧将帮助你在网站中充分利用 AJAX 的用处：\n\n*   `UpdatePanels` 看起来可能是你想要随处添加的功能，但请仅在需要时使用，不要作为默认方法。仍然有许多与服务器的通信，因此在数据输入页面上使用多个\
  \ `UpdatePanels` 可能会出现问题，因为每个表单元素都会被提交多次。这意味着当你编写后台代码（code-behind）时，必须确保不要以这种方式引用这些属性，导致多次提交产生问题（例如通过将不完整的信息保存到数据库）。\n\
  *   当你使用 `UpdatePanel` 时，也应该使用 `UpdateProgress` 控件。这有助于你的用户理解屏幕上正在发生变化。当变化是由用户请求引起时，这一点尤为重要。因为页面没有回传到服务器，所以很难判断按钮点击是否触发了某些操作，因为所有处理都在后台进行，并且不会自动显示在\
  \ UI 中。这就是 `UpdateProgress` 控件提供帮助的地方；它们为变化提供了视觉提示。\n*   在 MVC 应用程序中处理 AJAX 时，使用\
  \ AJAX 助手可以节省时间。这些助手演示了支持 AJAX 的非入侵 JavaScript（Unobtrusive JavaScript）库的使用。虽然本章描述了如何使用\
  \ JavaScript 和 jQuery 编写 AJAX 交互，但你完全可以向元素上添加相应的属性并包含非入侵 JavaScript 库来获得 AJAX 体验。\n\
  *   当你考虑从服务器获取异步信息的方法时，你有两个真实的选择。第一个是下载 HTML 片段并将其放置在 UI 的不同区域。这是内置 AJAX 支持都使用的解决方案。然而，你的特定需求可能会引导你离开这种方法，转而采用更合理的方案：一次下载元素然后更新元素内部的值。这两种方法都是同样有效的；你需要在构建第二种方法的额外努力与克服第一种方法的局限性之间进行权衡。\n\
  \n## 总结\n\nASP.NET 对 AJAX 的支持使得在应用程序中实现 AJAX 变得容易得多。无论是在 Web Forms 还是 MVC 中实现 AJAX\
  \ 方法，都有内置功能使你的实现过程更加清晰简单。使用 jQuery 和 JavaScript 自定义 AJAX 过程的能力使得开发过程更加统一和易于维护。\n\
  \n在 Web Forms 中使用 AJAX 需要几个不同的服务器控件。最重要的控件是 `UpdatePanel`，它包含了在 AJAX 调用期间将替换的内容。如果没有\
  \ `ScriptManager` 服务器控件，`UpdatePanel` 是无法使用的。`ScriptManager` 用于管理下载到客户端的 JavaScript\
  \ 文件，以支持客户端的 AJAX 调用。\n\n如果你在 ASP.NET MVC 中工作并需要使用 AJAX，那么你可能会利用 AJAX 助手，这些助手负责格式化\
  \ HTML，以便非入侵 JavaScript 库能够正常工作。该助手允许你确定哪些 HTML 元素将受调用结果的影响。通常这种方法用于显示部分视图（partial\
  \ view）。\n\n### 练习\n\n1. 如果你想在 ASP.NET Web Forms 页面上实现上活动中营业时间的功能，你需要做哪些改变？\n2.\
  \ 如果你想在 ASP.NET Web Form 页面中实现非入侵 JavaScript 库，你需要采取哪些步骤？\n3. 为网页添加计时器时（调用结果更新页面的一部分），会有哪些挑战？\n\
  \n## 本章所学\n\n| AJAX | AJAX 代表异步 JavaScript 和 XML，指的是一种设计，即当需要从服务器获取信息时，浏览器并不总是替换整个页面。相反，浏览器以用户可以继续工作的方式替换页面的一部分。\
  \ |\n\n| AJAX.ActionLink | ASP.NET MVC 中的一种助手方法，用于构建元素以便利用非入侵 JavaScript 库。该方法帮助开发者轻松地实现替换\
  \ HTML 内容的 AJAX 方法。 |\n\n\n\n\n\n| `AJAXOptions` | 一个用于管理 `AJAX.ActionLink` 中 AJAX\
  \ 部分所有配置的类。类中的属性与用于非阻塞 AJAX（Unobtrusive AJAX）的元素输出之间存在直接对应关系。 |\n| `AsyncPostBackTrigger`\
  \ | `UpdatePanel` 的一个设置，通过它可以将客户端操作链接到 `UpdatePanel`，并将该操作定义为触发异步回传（postback）的操作。\
  \ |\n| `ContentTemplate` | `UpdatePanel` 实际上并不持有要更新的内容。它包含一个 `ContentTemplate`，该属性包含了实际要更新的实际元素。\
  \ |\n| `Deserialization` | 将字符串值转换回其所代表的对象的过程。 |\n| `F12 Developer Tools` | 随 Microsoft\
  \ Internet Explorer 附的工具包。它为开发者提供了许多支持，包括 CSS 和样式支持、请求和响应信息及详细信息（包括头部和正文），以及服务器响应速度。\
  \ |\n| `getJSON` | `jQuery` 中的一个实用方法，用于处理对 Web 服务的 `GET` 调用。根据定义，从服务器返回的响应预期为 JSON\
  \ 格式。 |\n| `Json method` | ASP.NET MVC 控制器上的可用方法。它接收一个对象并将其序列化，同时将序列化对象返回给客户端。 |\n\
  | `Mozilla Firefox Developer Tools` | 与 Internet Explorer 带的 F12 开发者工具一样，Mozilla\
  \ Firefox 开发者工具适用于每个 Mozilla Firefox 安装。它们提供了与 F12 工具相似的大部分支持。 |\n| `PostBackTrigger`\
  \ | 它链接到 `UpdatePanel`，但它不是引起部分页面回调，而是引起全页面回传，就像完全没有使用 AJAX 一样。 |\n| `ScriptManager`\
  \ | 在 ASP.NET Web Forms 中使用 AJAX 的必要部分。每当存在 `UpdatePanel` 时都是必需的，它持有指向支持 JavaScript\
  \ 文件的链接。 |\n| `ScriptManagerProxy` | 允许你将 `ScriptManager` 放在主页（master page）上，然后处理内容页面上的\
  \ `UpdatePanel` 到主页上 `ScriptManager` 的链接。 |\n| `Serialization` | 将对象转换为字符串表示。这是为了让你能够通过互联网传输该对象是必要的。\
  \ |\n| `Single-Page Application` | 单页应用是一种构建网站的方法，用户下载初始页面以及管理用户与服务器之间所有交互所需的所有\
  \ JavaScript 文件。没有全页面请求；所有更新都通过 AJAX 完成。 |\n| `Unobtrusive AJAX` | 一个 JavaScript\
  \ 和 jQuery 库，允许通过受影响元素上的属性（attribution）来管理 AJAX 请求。它消除了在使用 AJAX 时通常必须执行许多自定义脚本。\
  \ |\n| `UpdatePanel` | 一种 ASP.NET Web Forms 服务器控件，用于定义一组特定的内容，可以通过 AJAX 调用进行替换。要替换的内容存储在\
  \ `ContentTemplate` 中。 |\n| `UpdateProgress` | 此服务器控件在处理 AJAX 调用时提供用户反馈。当用户点击按钮并预期会发生某些事情时，这尤为重要。如果效果是全页面获取，用户会知道正在发生什么，因为新页面正在下载；但由于是异步请求，`updateProgress`\
  \ 控件提供了这些信息。 |\n| `Web Service` | 一种服务器处理请求并将信息发送回客户端的方法。从技术上讲，Web 服务只是允许两台计算机通过网络通信的一种，但我们修改了定义，表示在网络上传输对象。\
  \ |\n\n# 第 14 章：jQuery\n\n## 你将在本章中学到：\n* jQuery 的历史以及为什么它如此重要\n* jQuery 中提供的功能\n\
  * 使用 jQuery 在你的页面中工作\n* jQuery 框架的深层集成\n\n## 本章代码下载：\n[wrox.com](http://wrox.com)\
  \ 为本章提供的代码可以在 [www.wrox.com/go/beginningaspnetforvisualstudio](http://www.wrox.com/go/beginningaspnetforvisualstudio)\
  \ 的“Download Code”选项卡中找到。代码位于 chapter 14 下载中，并根据全章中的名称进行单独命名。\n\n在书的早些部分，你专注于应用程序中并非特定于\
  \ `jQuery` 的其他领域，但你零星地遇到过关于它的提到。已经有一些使用 `jQuery` 支持客户端验证的示例，以及支持 AJAX 调用并在页面上显示结果的示例。应用程序中还引入了\
  \ `jQuery UI` 控件，以便你可以调用日期选择器。这应该让你对 `jQuery` 如何最终交织在网站的客户端各个部分有一个了解。本章将阐为什么 `jQuery`\
  \ 在现代 Web 开发中如此流行，并提供了更多对 `jQuery` 库中可用功能的接触。\n\n## jQuery 简介\n`jQuery` 是一个 JavaScript\
  \ 库，据最好估计，现在互联网上每三个网站中就有两个在使用。它被称为 JavaScript 库是因为它完全是用 JavaScript 编写的。这使得 `jQuery`\
  \ 可以像核心 JavaScript 方法一样用在 JavaScript 方法内部；它只是在 JavaScript 中提供的另一组额外的对象和方法，就像 Entity\
  \ Framework 为 `.NET` 增加了一套独立的功能一样。为了理解 `jQuery` 的历史，你需要了解 JavaScript 的演变。\n\n###\
  \ 早期 JavaScript\nJavaScript 现在是版本 6（ 2015 年 6 月发布），它首次包含在 1995 年底发布的 Netscape Navigator\
  \ 2 中。到 1996 年，微软开始在 Internet Explorer 中引入 JavaScript，从 IE 3 开始。此时，这两种实现方式都是不同的，这使得跨浏览器提供动态体验变得困难。这种差异导致了那些令人生厌的“最佳在\
  \ Internet Explorer 查看”或“最佳在 Netscape 查看”等短语。\n\n尽管语言本身在 1997 年由 Ecma International（国际标准组织）发布了基于\
  \ JavaScript 的 ECMAScript 时实现了标准化，但这并不意味着脚本在不同浏览器中的工作方式是相同的。单单一个 JavaScript 方法是毫无意义的；它只有在与用户进行某种交互时才变得有用。这是另一个大问题——每家主要的浏览器公司都构建了它们对\
  \ `DOM` 的扩展，而这些扩展正是 JavaScript 必须交互的对象，因此定义 `DOM` 的不同方法意味着交互代码也不同。这些 `DOM` 定义并不是\
  \ Ecma 标准的一部分；它们是在 W3C 的另一项标准化努力中定义的。HTML 5 作为 HTML 的最新版本，已经过更新以更好地定义 `DOM` 及其交互点，它标志着对\
  \ DOM 元素提供标准化的最佳尝试，以便 JavaScript 标准无论使用何种浏览器，都能以一致的方式识别并与 `DOM` 元素交互。\n\n\n\n\n\n\
  处理代码与显示代码的混合是导致 ASP.NET 诞生并取代经典 ASP 的相同问题。尽管 ASP.NET Web Forms 这种方法比经典 ASP 要整洁得多，但它仍然存在一组与处理和显示链接相关的问题，这最终导致了\
  \ ASP.NET MVC 的开发。JavaScript 也存在相同的问题。为了让 JavaScript 变得高效，它必须绑定到 HTML 元素上，以便元素的事件能够触发一组\
  \ JavaScript 代码。这意味着 JavaScript 的实现不仅需要理解 DOM，DOM 也必须理解 JavaScript 方法。\n\n## jQuery\
  \ 的角色\n\n`jQuery` 发布于 2006 年，是一个为了解决上述所有三个问题而引入的库。虽然 `jQuery` 的核心是一个 DOM 操作库，但它还通过在单个位置通过单个步骤完成事件分配和事件回调定义，提供了一种完全全新的管理事件和处理事件的方式。这意味着使用\
  \ `jQuery` 库可以让你轻松地使用 JavaScript 为 DOM 上的任何元素添加事件处理程序，而不是在整个页面中添加 HTML 事件属性来调用 JavaScript\
  \ 函数。这完全消除了对循环引用的需求，而是允许显示代码忽略处理代码。\n\n`jQuery` 的另一个优势是它与 JavaScript 相比所提供的抽象级别。开发者在客户端编写的大部分代码都与选择屏幕区域并对该区域进行操作有关。`jQuery`\
  \ 提供了一种执行相同操作的方法，同时让开发者在大部分工作中避免使用 JavaScript——例如，使用一行 `jQuery` 命令就可以取代 15 行 JavaScript。这意味着开发者并不一定需要成为\
  \ JavaScript 专家才能成为高效的 UI 开发者；理解 `jQuery` 中的几个不同命令就能让他们完成大部分工作。\n\n关于在浏览器中使用 JavaScript\
  \ 提到的最后一个问题涉及跨浏览器兼容性问题。`jQuery` 认识到来自主流浏览器的各种 JavaScript 引擎可能有所不同，因此作为前述抽象的一部分，`jQuery`\
  \ 库在构建接口时会处理所有这些不兼容性。这意味着由 `jQuery` 提供的功能在不同浏览器之间是标准化的，而原生的 JavaScript 代码则无法做到这一点。\n\
  \n`jQuery` 核心库支持许多功能：\n\n* DOM 元素选择\n* DOM 元素操作\n* AJAX\n* 事件\n* 动画及其他特效\n* 异步处理（独立于\
  \ AJAX）\n* 数据解析，特别是 `JSON` 解析\n* 额外的插件、可扩展性\n\n其中一些额外的插件已经成长为自身的重要库。一些较重要的库列在表 14.1\
  \ 中。\n\n| 模块 | 描述 |\n| :--- | :--- |\n| jQuery UI | 一组用户界面组件。这些组件包括用户交互、特效、主题和控件。`jQuery`\
  \ 控件的一个示例是你在第 11 章中添加的日期选择器。 |\n| jQuery Mobile | 移动设备访问互联网的增长导致了对基于 HTML5 的 UI\
  \ 系统的需求，这种系统既要极小（向移动设备传输数据成本很高），又要灵活——特别是在确定可视空间和脚本支持方面。 |\n| QUnit | 一个 JavaScript\
  \ 单元测试框架。虽然它不是基于 `jQuery` 本身的，但被 `jQuery`、`jQuery UI` 和 `jQuery Mobile` 项目用于。`QUnit`\
  \ 能够测试任何 JavaScript 代码，而不只是 `jQuery`。它也可以用于测试自身。 |\n| jQuery Validation | 该框架支持客户端验证。它让标准验证变得轻而易举，同时提供了许多自定义选项。它包含了多种验证方法，用于对不同类型的数据进行验证，包括电子邮件地址或\
  \ URL，以及编写自定义验证方法的能力。 |\n| Globalize | 只要有互联网连接，世界上任何地方的访问都可以访问互联网内容。这使得全球化和国际化变得越来越重要，因为企业希望为那些不通网站原生语言的人提供访问和通信。\
  \ |\n| jQuery Mouse Wheel Plugin | 这是一个非常专门的库，但它解决了一个惊人复杂的问题：与客户端的特殊硬件进行交互，这些硬件在\
  \ JavaScript 出现时甚至未被想象，但很快就变成了标准硬件。 |\n\n**表 14.1** 额外的 jQuery 模块\n\n由于 `jQuery`\
  \ 是开源的，你也看到了其他利用其所提供的功能的实现。例如，微软提供了安装（作为包的形式）`jQuery` 框架的许多不同部分，以及对其进行的一些自定义，这些自定义现在已置入到项目生成的输出中，例如\
  \ Web Forms AJAX 和验证。微软在这些情况下使用的脚本也使用了 `jQuery` 框架的部分。\n\n每个不同的 `jQuery` 库都可以在你的\
  \ ASP.NET 应用程序（无论是 Web Forms 还是 MVC）中使用。在应用程序中包含这些项目取决于你将使用的库、其使用位置以及关于其使用的其他考虑。然而，与这些库交互的机制在所有\
  \ `jQuery` 库中都是相同的，即使是标准库也是如此。\n\n## 引入 jQuery 库\n\n一旦你确定满足应用程序中一组业务要求的最佳方式是通过使用\
  \ `jQuery`，你就必须确定想要哪些 `jQuery` 部分以及你如何让它们在应用程序中可用。由于你是在 Visual Studio 中工作，添加第三方库的默认方法是通过使用\
  \ `NuGet` 包，事实上，你已经通过这种方法添加了几个 `jQuery` 包。在图 14.1 中打勾选的项目是你已经安装的 `jQuery` 项目。\n\n\
  ![NuGet 包管理器截图，解决方案 'RentMyWrox' 右侧有已安装 jQuery 包的勾选。](img/c14f001.jpg)\n\n**图 14.1**\
  \ 已安装的 jQuery 包\n\n\n\n\n\n`onchange` 属性是发生混淆的地方——代码在 HTML 元素内部调用 JavaScript 函数，从而将这两个项永久性地绑定在了一起。非侵入式的解决方案是在代码中执行绑定，这样\
  \ `HTML\\ DOM` 内容就不再引用 JavaScript；相反，所有的引用都从 JavaScript 指向 `DOM` 元素。这种非侵入的方法允许任何\
  \ JavaScript 的更改（例如更改函数名称）都限制在 JavaScript 内部发生，而无需更改任何 HTML。\n\n这种方法的这种改变意味着绑定将以如下方式进行：\n\
  \n### HTML\n```\n<input type=\"text\" name=\"date\" id=\"date\"/>\n```\n\n### JavaScript\n\
  ```javascript\nwindow.onload = function() {\n    document.getElementById('date').onchange\
  \ = validateDate;\n};\n```\n\n简而言之，你需要的所有默认 `jQuery` 程序包已经挂载到你的解决方案中了。因此，你真正需要关注的是确保\
  \ `jQuery` 库文件可以下载到客户端机器，并确保它们可以在你的 UI 代码中使用。有几种不同的方法可以确保网页知道要下载脚本：要么直接在页面上添加引用，要么使用包（bundles）将多个脚本分组并在单个引用中使用。\n\
  \n第一种方法是直接在你的页面上添加引用。这是你在为日期选择器添加初始 `jQuery UI` 脚本时采用的方法。这段代码是一个 `HTML` 脚本元素，你在其中设置\
  \ `src` 属性来下载脚本文件，如下：\n\n```html\n<script src=\"/Scripts/jquery-2.0.3.min.js\" type=\"\
  text/javascript\"/>\n```\n\n这种简单的方法确保了必要的脚本被下载。如果你需要其他脚本，只需添加另一个引用链接即可。在页面的 `head`\
  \ 元素中执行此操作可以确保它对后续所有的 `JavaScript` 和 `jQuery` 代码都可用。如果你使用主页面或布局页面，则可以将这些引用添加到模板页面中，以便让它们对所有内容页面都可用。这可能会导致浏览器下载在访问期间不会使用的文件，但由于浏览器会在本地缓存这些文件，用户只会在初始下载额外文件时产生一次开销；对于访问的剩余时间以及可能的任何随后的访问，该文件将不需要再次下载。\n\
  \n然而，这种方法也存在几个问题。第一个是版本管理。前面的代码段引用了 `jQuery` 库的 `2.0.3` 版本。这意味着当 `2.0.4` 版本发布且你想在网站中引用它时，你必须手动更改代码。理想情况下，你希望有一种解决方案，让浏览器获取脚本文件而无需担心版本。你可以通过更改默认文件名来手动实现，但这会导致\
  \ `NuGet` 升级时出现各种混乱，因为它预期的文件现在不再存在了。\n\n另一个问题是可能被下载的独立文件数量。随着你向网站添加不同的库来支持各种功能部分，你将不断添加脚本引用。当你开始编写自己的\
  \ `JavaScript` 库并将它们包含在不同的文件中以支持你的自定义业务需求时，列表会变得更长。结果是下载了大量文件，其中许多文件最终可能无用用处。\n\n\
  你还必须非常小心函数命名规范，因为浏览器运行的脚本越多，发生冲突的可能性就越大。因此，虽然通常情况下下载一个未使用的库的开销是可以接受的，但如果同时下载许多被引用在一起的未使用的库，可能是不可接受的。\n\
  \n幸运的是，`ASP.NET` 有一种解决这些问题的方法：为脚本下载添加一个抽象层。这种抽象层允许你通过通配符或其他替换值来定义抽象层引用的文件。通过这种方式，你可以设置抽象层忽略\
  \ `jQuery` 文件的版本号（例如），并简单下载目录中该文件的任何版本。这种抽象还允许你将脚本作为一个组添加，如果你有几个具有依赖关系的脚本，你可以确保所有这些文件与它们可能依赖的文件一起下载。这些作为\
  \ `ASP.NET` 框架一部分的抽象被称为包（bundles）。\n\n### 包（Bundles）\n\n包提供了将不同文件分组在一起的支持。这些文件可以是\
  \ `JavaScript` 或 `CSS`，创建包的结果是能够将不同的文件合并成单个文件，以便于引用。此外，现代浏览器限制了对同一域的支持的并发连接数。因此，减少下载的文件数量可以使可用连接减少与服务器的连接和断开次数，转而将这些时间花在下载较大的文件上。这通常会导致下载文件的总时间缩短。打包的一个额外副作用是，它逐渐减少了在所有可用脚本中查找\
  \ JavaScript 函数的时间，因为所需的函数包含在同一个文件或同一内存区域的概率要大得多。显然，这不会为你节省几秒的响应时间，但每一毫秒都有帮助！\n\n\
  你可以在 `App_Start\\BundleConfig.cs` 文件中添加打包。你添加的 `NuGet` 包中展示了如何构建打包的良好示例：\n\n```csharp\n\
  // 顺序对于这些文件的运行非常重要，\n// 它们有显式的依赖关系\nbundles.Add(new ScriptBundle(\"~/bundles/MsAjaxJs\"\
  ).Include(\n        \"~/Scripts/WebForms/MsAjax/MicrosoftAjax.js\",\n        \"\
  ~/Scripts/WebForms/MsAjax/MicrosoftAjaxApplicationServices.js\",\n        \"~/Scripts/WebForms/MsAjax/MicrosoftAjaxTimer.js\"\
  ,\n        \"~/Scripts/WebForms/MsAjax/MicrosoftAjaxWebForms.js\"));\n```\n\n前面的代码创建一个名为\
  \ `MsAjaxJs` 的包，似乎位于 `bundles` 目录下。然而，实际上并没有 `bundles` 目录；相反，框架将其读取为特殊的路由调用，并返回一个包含所有包含文件的单个文件。你不需要执行任何特殊操作来引用该包，正常的脚本引用即可生效：\n\
  \n```html\n<script src=\"/bundles/MsAjaxJs\" type=\"text/javascript\"/>\n```\n\n\
  当你在 `ASP.NET` 视图中工作时，你还有通过脚本助手添加引用的额外能力：\n\n```razor\n@Scripts.Render(\"~/bundles/MsAjaxJs\"\
  )\n```\n\n这是一个快捷方式，因为此命令的输出是之前列出的脚本引用标签。\n\n在下一个“尝试一下”中，你将调整已经添加的某些脚本，并确保它们正确地打包和调用。\n\
  \n将脚本引入你的页面后，它们就可以在浏览器中使用。在下一节中，你将学习更多关于使用 `jQuery` 和 `JavaScript` 定制用户体验的细节——换句话说，构建更多可以添加到新包中的脚本！\n\
  \n\n\n\njQuery 是一个 JavaScript 对象，你可以通过 `$` 函数来引用它。`$` 并不是对对象本身的直接引用（就像你在 `C#` 中使用\
  \ `new` 创建类时熟悉的那样），而是一个**工厂方法**。`工厂方法`是一种软件设计方法或模式，通过这种方式，你可以在不指定所创建对象的具体类的情况下创建一个对象。这意味着你不需要自己创建对象的副本，而是调用工厂类上的方法，由该方法为你创建对象。这样一来，你的代码就不需要理解如何构建某个项目，而是调用某些知道对象应该如何构建的代码。这种方法抽象了实际的\
  \ `jQuery` 对象，并能够通过单个字符对其进行引用。在构建 jQuery 选择器时，你已经使用过 `$` 函数。\n\n你使用的另一种方法是 `$.`\
  \ 方法，或者说工具函数。这些项并不直接作用于 jQuery 对象，而是提供其他支持功能。在第 13 章中，你使用了 `$.getJSON` 方法向服务器发起调用并获取一个\
  \ JSON 对象。这两种使用 jQuery 特性的方法都是 jQuery 核心（jQuery Core）的一部分。\n\n### jQuery Core\n\n\
  jQuery Core 是 jQuery 功能的传统集合。它是所有其他库和插件构建的基础。要让 jQuery 在你的应用程序中运行，有几个要求。首先，你需要确保在引用任何利用\
  \ jQuery 的方法之前，已经引用了 jQuery 代码。如果没有按照正确的顺序提供脚本，将导致 JavaScript 错误，因为代码尝试利用一个尚未被实例化的对象。\n\
  \n其次，你需要确保所有的脚本只在 DOM 加载完成后运行。除非另有说明，否则浏览器会在解析下载的文档时一旦遇到 JavaScript 就会立即运行它。如果你不让脚本等待\
  \ DOM 加载后再运行，那么你就可能面临在脚本执行时 DOM 对象尚未加载的风险。结果是，最坏的情况下，你会得到一个 JavaScript 错误；最好的情况下，你期望的行为将不会发生，因为当\
  \ DOM 完成加载过程时，它不会被重新执行。\n\n你已经在之前的章节中使用过确保 DOM 已完成加载的检查，所以这对你并不完全陌生。添加一个确保 DOM 已加载的检查看起来如下所示：\n\
  \n```javascript\n$(document).ready(function() {\n    // 当文档就绪时要执行的工作\n});\n```\n\
  \n你也可以使用以下快捷方式来执行相同的操作：\n\n```javascript\n$(function() {\n    // 当文档就绪时要执行的工作\n\
  });\n```\n\n在这种情况下，你将获得相同的结果，但你不需要定义你想要等待的 DOM 元素，而是将你想要运行的函数作为参数。jQuery 随后就会分配该函数，就像你直接使用\
  \ `ready` 方法一样。\n\njQuery 还具有队列工作的能力。这让你能够根据需要轻松地创建许多不同的 `ready` 方法，每当浏览器遇到一个方法时，它会将函数回调添加到该元素的队列中。当元素的状态发生变化时（例如当文档加载时），浏览器会遍历该更改的回调队列，直到所有预期的操作都完成。这使得你作为开发者可以维护更小、更离散的功能集，而无需维护一个巨大的单体函数（如果不支持队列结构，你将不得不那样做）。\n\
  \n在深入学习如何使用 jQuery 选择和更改 DOM 元素之前，你应该先学习 jQuery 对象内部提供的一些各种工具方法，这些方法设计用于为操作提供支持。\n\
  \n### 使用 jQuery 工具方法\n\n这些 jQuery 工具方法中的某些可以替代选择器方法执行，你将得到相同的结果。其他方法通过提供帮助类来提供真正的工具功能，这些帮助类允许开发者为客户端构建健壮的功能集。\n\
  \n还有许多其他不同的工具函数，如表 14.2 所示。这些方法中的每一个都通过抽象你为了执行这些常见任务而编写的 JavaScript 代码，提供了一组实用功能。\n\
  \n| 方法 | 说明 |\n| :--- | :--- |\n| `contains` | 确定一个 DOM 元素是否是另一个 DOM 元素的后代。如果被包含元素在容器元素内部（无论嵌套多深），则返回\
  \ true。仅支持元素节点；如果第二个参数是文本或注释节点，函数将始终返回 false。`$.contains( container, contained )`\
  \ |\n| `data` | 允许你向 DOM 元素附加任何类型的数据。使用选择器方法也可以实现相同的功能，但如果你不一定有选择器信息，`data` 方法仍然让你能够访问\
  \ DOM 元素。`$.data( element, key, value )` |\n| `each` | 一个通用的迭代器函数，允许你遍历数组或类数组对象中的不同元素，并在迭代时对每个项执行操作。`$.each(\
  \ object, callback )` |\n| `extend` | 将两个或多个对象合并为一个对象。遍历目标对象的属性，并用源属性的值替换目标的值。如果目标没有该属性，则将其添加到对象中。`deep`变量是一个布尔值，表示替换应该是递归的还是简单的。`$.extend(\
  \ [deep], target [, object1 ] [, objectN ] )` |\n| `inArray` | 确定一个值是否在数组中，如果包含则返回索引，如果数组不包含该值则返回\
  \ -1。`$.inArray( value, array [, fromIndex ] )` |\n| `is` | 有许多不同的 `is` 函数用于判断给定变量的类型。这是必要的，因为\
  \ JavaScript 是动态类型的，这意味着同一个变量可以连续包含许多类型的值。因此，如果你需要针对该类型执行特定操作，首先需要确认它是否合适。`is` 函数包括：`$.isArray(value)`,\
