  \ P2P 和 Wrox 书籍的常见问题。要阅读 FAQ，请点击任何 P2P 页面上的 `FAQ` 链接。\n\n# 第 1 章：入门 ASP.NET 6.0\n\
  \n### 您将在本章中学习到：\n* ASP.NET 的简要历史以及它为何同时支持 Web Forms 和 MVC\n* 关于 Web Forms 和 MVC\
  \ 两个框架介绍\n* 如何安装和使用 Visual Studio 2015\n* 本书将贯穿始终使用的示例应用程序\n\n### 本章代码下载：\n\n本章的\
  \ [wrox.com](http://wrox.com) 代码下载可在 [www.wrox.com/go/beginningaspnetforvisualstudio](http://www.wrox.com/go/beginningaspnetforvisualstudio)\
  \ 的 `Download Code` 标签页找到。代码位于第 01 章下载中，并根据本章中的名称进行单独命名。\n\n互联网已成为全球数百万生活中至关重要的一部分。互联网的使用增长自\
  \ 20 世纪 90 年代以来一直在加速，随着技术和接入变得更加便宜，这种增长将会持续。互联网已成为购物、休闲、学习和交流的首选来源。它既帮助了业务的建立，也让变革者能够向世界传播他们的信息。\n\
  \n这种增长意味着对构建和维护下一代应用程序的人才将产生长期需求。随着越来越多的业务通过网络应用程序完成，学习这些应用程序是一项明智的职业选择。\n\n## ASP.NET\
  \ 简介\n\n互联网最初是一组封闭的私人网络，用于在跨研究机构之间共享信息。该系统的主要用户是这些实验室的科学家。然而，随着这种信息共享方法的实用性和灵活性变得显而易见，兴趣呈指数级增长。越来越多的机构参与其中，导致了支持更多类型信息的标准的协议的演进。随着商业实体的加入，初始网络迅速扩张。很快，互联网服务供应商出现了，让普通人也能访问和共享蓬勃发展的的内容。在互联网早期，大多数内容是静态创建和存储的。每个\
  \ `HTTP request` 针对特定的页面或存储的内容，响应只需提供该内容。早期应用程序框架改变了这种模型，允许根据请求发送的某些标准动态生成内容。这使得从数据库和其他来源构建内容成为可能。ASP.NET\
  \ 是这些早期应用程序框架之一，`.NET Framework` 的第一个版本于 2002 年发布。\n\n\n\n\n\n2008 年，微软引入了一个新的框架，支持一种不同的内容创建和导航方法：ASP.NET\
  \ MVC。MVC 代表模型-视图-控制器（Model View Controller），指的是一种软件设计模式，该模式在用户界面和处理代码之间提供了更完全的分离。原始的框架被称为\
  \ Web Forms。即使互联网内容创建技术不断演进，互联网的运行方式仍然保持着出人意料的稳定。信息从服务器到客户端的移动遵循一个非常简单的协议，该协议自互联网诞生以来几乎没有发生过变化。\n\
  \n## 超文本传输协议 (HTTP)\n\n超文本传输协议（`HTTP`）是作为互联网通信基础的应用层协议。它定义了客户端与服务器之间的交互方式，遵循“请求-响应”模型：即客户端机器请求（或询问）特定资源，而服务器则根据情况响应（或发送关于该信息的回复）。\n\
  \n这种请求可以非常简单，从“给我看这张图片”到非常复杂的内容，例如你银行账户之间的转账。图 1.1 显示了该请求的结果——无论是显示第一次简单请求的图片，还是显示第二个更复杂请求的银行转账收据。\n\
  \n![请求响应模型图，带有箭头指向从用户到服务器的请求以及从服务器到用户的响应，中间有一个云。 ](img/c01f001.jpg)\n\n图 1.1 请求响应\n\
  \n`HTTP` 协议还定义了请求和响应的格式。它包含了方法（也称为动词），这些方法描述了对被请求的项目应该执行什么类型的操作。这些动词在 ASP.NET Web\
  \ Forms 中并不经常使用，但在 ASP.NET MVC 中特别重要，因为 MVC 使用这些方法来识别对请求对象正在执行的操作。主要的动词列在表 1.1 中。\n\
  \n| 名称 | 说明 |\n| :--- | :--- |\n| GET | `GET` 是对资源的请求。它应该检索该资源，而不产生由于该操作引起的任何其他影响。你应该能够多次\
  \ `GET` 一个资源。 |\n| POST | `POST` 表示请求中包含了应该创建资源新版本的信息。根据定义，任何发布的项目都应该创建一个新版本，因此多次传递相同的信息将导致创建该对象的多个实例。\
  \ |\n| PUT | `PUT` 表示请求中包含的信息应该更改已存在的项目。该定义还允许在预期的要更改的项目尚未创建时，由服务器创建一个新项目。这与 `POST`\
  \ 动词不同，因为只有在请求包含新信息时，才会创建新项目。 |\n| DELETE | `DELETE` 动词表示应该删除指定的资源。这意味着一旦删除，对该资源进行\
  \ `GET` 或 `PUT` 将失败。 |\n\n表 1.1 最常用的 HTTP 动词\n\n一个 `HTTP` 请求包含以下内容：\n\n*   请求行。例如，`GET/images/RockMyWroxLogo.png\
  \ HTTP/1.1` 从服务器请求一个名为 `/images/RockMyWroxLogo.png` 的资源。\n*   请求头字段，例如 `Accept-Language:\
  \ en`\n*   一个空行\n*   可选的消息体；当使用 `POST` 或 `PUT` 动词时，创建对象所需的信息通常放在此消息体中。\n\n一个 `HTTP`\
  \ 响应包含这些项目：\n\n*   状态行，包括状态码和原因消息（例如，`HTTP/1.1 200 OK`，表示请求成功）\n*   响应头字段，例如 `Content-Type:\
  \ text/html`\n*   一个空行\n*   可选的消息体\n\n以下示例显示了一个典型的响应：\n\n```\nHTTP/1.1 200 OK\n\
  Date: Thur, 21 May 2015 22:38:34 GMT\nServer: Apache/1.3.3.7 (Unix) (Red-Hat/Linux)\n\
  Last-Modified: Wed, 08 Jan 2015 23:11:55 GMT\nETag: \"xxxxxxxxxxxxxxxxx\"\nContent-Type:\
  \ text/html; charset=UTF-8\nContent-Length: 131\nAccept-Ranges: bytes\nConnection:\
  \ close\n<!DOCTYPE html>\n<html\n  <head>\n    <title>I'm a useful title to this\
  \ page</title>\n  </head>\n  <body>\n    <p>I'm some interesting content that people\
  \ can't wait to consume.</p>\n  </body>\n</html>\n```\n\n状态码（例如上述示例中的 `200 OK`）提供了有关请求的细节。最常见的状态码类型是\
  \ `4XX` 和 `5XX` get。`4XX` 代码用于客户端错误，其中最常见的是 `404`，表示请求的资源不存在。`5XX` 代码用于服务器错误，其中最常见的是\
  \ `500`，即内部服务器错误。任何从事大量 Web 开发的人都会很快习惯令人人生畏的 `500` 错误。\n\n之所以需要这些动词是因为根据定义，`HTTP`\
  \ 是无状态协议。这就是为什么请求不会标识之前的请求；相反，每个请求被预期是独立的。\n\n这种通信大部分在后台进行，并由浏览器和服务器处理。当你继续开发 ASP.NET\
  \ 知识和技能时，会发现研究请求或响应中的不同值是非常重要的。你可能需要设置请求或响应头以确保某些上下文信息（如授权令牌或客户端首选语言）被正确设置。\n\n\
  ### Microsoft 信息服务\n\nMicrosoft 信息服务 (`IIS`) 是 Windows 自带的一个应用程序，用于支持 `HTTP`。它包含在所有版本的\
  \ Windows 中，但默认不安装。当你开发 ASP.NET 应用程序（无论是 Web Forms 或 MVC）时，处理并返回给客户端的工作是由 `IIS`\
  \ 完成的。\n\n### HTML5\n\n虽然 `HTTP` 是客户端与服务器之间的通信过程，但 `HTML` 是互联网的核心标记语言。`HTML`（超文本标记语言）用于\
  \ Web 内容的结构化和展示，是 `W3C`（万维网联盟）的标准。`HTML 5` 于 2014 年 10 月定，是该标准的最新版本。之前的版本 `HTML\
  \ 4` 于 1997 年标准化。\n\n你可以想象，在 `HTML 4` 和 `HTML 5` 之间的 17 年里，Web 经历了巨大的演变。虽然这种演变为用户带来了一些优势，但也为网站开发者带来了一些问题。主要问题之一是网络浏览器公司试图通过提供一组特定的浏览器增强功能来区分自己的产品，特别是与多媒体相关的功能。这使得开发交互式网站变得困难。\n\
  \n`HTML 5` 的设计旨在解决由这种碎片化引起的问题。改进包括：\n\n*   对多媒体的其他支持，包括布局、视频和音频标签\n*   支持额外的图形格式\n\
  *   添加了辅助功能属性，帮助不同残障的用户访问网页内容\n*   脚本 API 的显著改进，允许 `HTML` 元素与 JavaScript 交互（你将在第\
  \ 14 章、`jQuery` 中学习更多信息）\n\n#### HTML 标记\n\n\n\n\n\nHTML 文档是人类可读的文档，使用 HTML 元素为信息提供结构。这种结构用于为正在显示的信息提供上下文。网络浏览器会考虑上下文和内容，并据此显示信息。这些元素可以被嵌套，这意味着一个元素可以完全包含在另一个元素内部，使得整个页面基本上是一组嵌套元素的集合，如下所示：\n\
  \n```html\n<!DOCTYPE html>\n<html>\n  <head>\n    <title>I'm a useful title to this\
  \ page</title>\n  </head>\n  <body>\n    <p>I'm some interesting content that people\
  \ can't wait to consume.</p>\n  </body>\n</html>\n```\n\n元素的每一层都起到了对相关内容进行分组的作用。当浏览器解析每个元素时，它会评估该元素在逻辑结构中应该处于什么位置。这种结构使得浏览器能够根据内容与结构内其他元素的邻近程度和关系来关联内容。在前面的示例中，`title`\
  \ 元素是 `head` 元素的子元素。\n\n同样注意开启标签和结束标签的预期。这符合元素可以包含在其他元素中的概念。只有那些不能包含其他元素的才不需要关闭。开启标签是在元素\
  \ `html` 周围的一组角括号 `<>`，而结束标签是在相同的 `element` 名称周围的一组角括号 `</>`，但前面有一个斜杠 `/html`。这使得浏览器能够恰当地识别每个部分。某些浏览器可能支持某些未正确关闭的标签，但这种行为是不一致的，因此应注意关闭所有元素。唯一不符合此标准的条目是\
  \ `<!DOCTYPE html>` 声明。相反，它标识了后续内容应如何定义。在这种情况下，内容被定义为 `html`，因此浏览器知道内容应该被作为 HTML\
  \ 5 进行解析。\n\nHTML 5 中可用的一些实用元素列在表 1.2 中。这并不是完整的列表！访问 W3C 网站获取 HTML 元素的完整列表及其使用的完整描述：[`www.w3.org/TR/html5/index.html`](http://www.w3.org/TR/html5/index.html)。\n\
  \n| 元素名称 | 描述 |\n| :--- | :--- |\n| html | 将内容识别为 HTML 代码。 |\n| head | 将内容定义为页面的头部部分。这是一个高层部分，包含了浏览器用于控制内容显示的信息。\
  \ |\n| title | 头部部分中的一个项目，此元素包含通常在浏览器标题栏中显示的内容。 |\n| body | 将内容定义为页面的主体部分。该部分包含在浏览器窗口内显示的内容。\
  \ |\n| a | 锚点标签，充当其他内容的导航链接。它可以将用户重定向到同一页面的另一个位置，或重定向到完全不同的页面。 |\n| img | 此标签将图像放置在页面上。它是少数没有关闭标签的元素之一。\
  \ |\n| form | `form` 标签将包含的内容识别为一组将作为一个块一起提交的信息。它通常用于将信息从用户传输到服务器。 |\n| input |\
  \ 此元素在表单中扮演着许多角色。取决于类型（稍后会有更多详细介绍！）它可能是一个文本框、单选按钮，甚至是按钮。 |\n| span | 一种内联界定内容的方法。这让你能够对句子中的一个或多个单词赋予特殊格式，而不影响这些单词的间距。\
  \ |\n| div | 像 `span` 标签一样，此标签充当内容的容器。然而，它是一个块元素，不同之处在于内容之前之后都有换行。 |\n| audio |\
  \ HTML 5 特性，允许你将音频文件嵌入页面中。支持的音频文件类型可能根据浏览器而异。 |\n| video | HTML 5 特性，将视频文件嵌入页面中，以便浏览器内联播放内容。\
  \ |\n| section | HTML 5 新增功能，将一组内容识别为整体。将其视为书中的章节，或单个网页的各个区域（如引言和新闻）。 |\n| article\
  \ | 另一个 HTML 5 新增功能，定义了一个比 `section` 元素更完整、更自包含的内容集。 |\n| p | 段落元素，将内容分成相关的、易于管理的块。\
  \ |\n| header | 为另一个元素（通常是最近的元素）提供介绍性内容。这可能包括 body，这意味着内容是整个页面的头部。 |\n| h1, h2,\
  \ h3 | 允许将内容指定为标题文本的元素。数字越小，在层次结构中的位置越高。`h1` 元素类似于书名，`h2` 可以是章节标题，`h3` 可以是节标题，以此类推。\
  \ |\n| ul | 允许创建无序符号列表。 |\n| ol | 允许创建有序（通常是编号的）列表。 |\n| li | 列表项元素告诉浏览器该内容是应该包含在列表项目之一。\
  \ |\n\n**表 1.2**](#c01.xhtml_c01-tbl-anc-0002) 常用 HTML 元素\n\n#### HTML 中的属性\n\n\
  属性是放置在起始元素角括号内的额外信息。此属性提供了详细信息，以便浏览器在渲染或与元素交互时知道如何操作。一个示例是锚点元素，它提供了指向其他内容的链接：\n\n\
  ```html\n<a href='http://www.w3.com'>这里!</a>\n```\n\n`href` 是一个属性，告诉浏览器在点击“这里!”后去哪里。\n\
  \n所有元素都支持某种属性，无论是隐含的（如锚点标签中的 `href` 属性），还是可选的（如 `name`、`style` 或 `class`），这些可用于控制元素的标识和外观。\n\
  \n#### HTML 示例\n\n列表 1.1 中的代码是一个 HTML 页面，包含了表 1.2 中的几乎所有元素。\n\nInternet Explorer\
  \ 渲染此 HTML 内容如图 1.2 所示。所有其他 HTML 5 浏览器也将以非常相似的方式渲染。\n\n![Internet Explorer 渲染 HTML\
  \ 内容截图。渲染内容的部分用箭头标记：h1, img, h2, p, ol 和 li, div, ul 和 li, input type = “text”,\
  \ span, 以及 input type = “submit”。](img/c01f002.jpg)\n\n**图 1.2**](#c01.xhtml_c01-fig-002)\
  \ 在浏览器中渲染的 HTML\n\n### ASP.NET Web Forms\n\nASP.NET Web Forms 自其最初发布以来就是 .NET 基础设施的一部分。Web\
  \ Forms 通常采用基于页的方法，每个可能被请求的网页都是一个唯一的实体。在开发期间，文件系统中由两个物理页面组成每个可见页面：`.aspx` 代码（包含可见的标记）以及`.aspx.cs`\
  \ 或 `aspx.vb`（包含执行实际处理的代码，例如创建初始内容或响应按钮点击）。这两个页面共同提供了发送到浏览器进行查看所需的 HTML 代码和标记。\n\
  \n\n\n\n\nASP.NET Web Forms 的主要优势在于，与请求/响应方法以及发送到客户端的 HTML 创建相比，它提供了一个层次的抽象。对 HTML\
  \ 的详细了解并不像对 `C#` 或 Visual Basic 的详细了解那样关键。该框架本身通过为你生成 HTML 隐藏了大量的生成工作。\n\n客户端与服务器之间通信的主要模型是一种称为\
  \ `postback`（回传）的方法，通过这种方式，页面在浏览器中渲染，用户执行某些操作，然后该页面使用相同的资源名称发送回服务器。这使得每个页面都能负责页面内容的创建，并在需要时响应页面内容的变化。\n\
  \n### ViewState\n\n这种对页面内容变化的响应通过使用 `ViewState` 得到了增强。由于 HTTP 是一个无状态协议，任何需要状态的内容都需要通过更具自定义的方式进行管理。`ViewState`\
  \ 正 ASP.NET Web Forms 采用自定义方式并在浏览器和服务器之间传输状态信息的方法。`ViewState` 是页面内的一个隐藏字段 `<input\
  \ type=\"hidden\" name=“_VIEWSTATE” value=“blah blah”>`。该实体的值包含了人类无法读取的哈希信息。幸运的是，ASP.NET\
  \ 能够解析这些信息，并理解页面上各种项目的之前的版本。\n\n理解 view state 是非常重要的，因为它在 ASP.NET Web Forms 的工作方式中起着重要作用。假设你正在处理一个具有多次\
  \ postback 的页面。也许其中一次 postback 更改了标签（label）的值。如果标签在第一次渲染时有一个默认值，那么在每次新的 postback\
  \ 中对该控件的初始化都会将该值重置为默认值。然而，系统随后会分析视图状态并确定此特定标签具有应该显示的不同值。系统现在识别出它处于不同的状态，并将覆盖默认设置，将标签设置为更新的、已更改的文本版本。\n\
  \n这是在多次 postback 之间持久更改的一种强大方法。然而，变化并需要跟踪的项越多，view state 信息集就越大，这可能会导致问题。这些信息是双向传递的，从服务器到客户端，然后再传回服务器。在某些情况下，作为\
  \ view state 的部分传输的信息量可能会减慢下载/上传时间，特别是在网络速度或带宽限制的情况下。\n\n默认情况下，每个控件上都启用了 `ViewState`。但是，作为开发者，你可以根据需要覆盖这些设置，例如当你知道自己不需要知道控件之前的状态时。你也可以通过程序使用视图状态。想象一个既具有排序功能又有分页功能的大数据列表。如果你要在分页之前进行排序，那么排序标准就需要存储在某个地方，以便供下一次\
  \ postback 使用。view state 是存储这些信息的地方之一。\n\n### ASP.NET Web Forms 事件和页面生命周期\n\nWeb\
  \ Forms 的优势之一是它允许开发者挂载到页面生命周期中的各种事件。ASP.NET 生命周期允许开发者在 HTML 创建阶段的各个时间点与信息进行交互。作为该流程的一部分，开发者还可以使用事件处理程序来响应可能在客户端发生的事件，包括点击按钮或在下拉列表中选择项目。对于那些来自传统事件驱动开发方法（如\
  \ Windows Forms）的开发者来说，这种方法将非常容易上手。虽然生命周期过程为开发者提供了很大的权力，但也增加了应用程序的复杂性——相同的代码取决于它在生命周期中被调用的时间点，可能会导致不同的结果。\n\
  \n生命周期中的步骤如表 1.3 所示。此时表中的某些项目对你来说可能没有任何意义，但随着我们不断创建交互式网站的过程，你将开始看到这一切是如何结合在一起的。\n\
  \n| 阶段 |  |\n| :--- | :--- |\n| Request | 此阶段发生在页面调用过程开始之前。系统在此阶段确定是否需要进行运行时编译、是否可以返回缓存输出，或是否需要运行编译后的页面。从\
  \ ASP.NET 页面内部无法挂钩到此阶段。 |\n| Start | 页面开始对 HTTP 请求进行一些处理。初始化了一些基础变量，例如 `Request`、`Response`\
  \ 和 `UICulture`。页面还会判断其是否为 postback。 |\n| Initialization | 在此阶段，页面上的控件被初始化并分配了它们唯一的\
  \ ID。根据情况应用主页（Master pages）和主题（themes）。此时 postback 数据不可用，view state 中的信息尚未应用。 |\n\
  | Load | 如果请求是 postback，则根据从 view state 恢复的信息加载控件信息。 |\n| Postback event handling\
  \ | 如果请求是 postback，所有各种控件将根据需要触发它们的事件处理程序。验证在此时也会发生。 |\n| Rendering | 在渲染阶段开始之前，将根据配置保存页面和所有控件的\
  \ `ViewState`。此时，页面输出被添加到响应中，以便信息可以开始流向客户端。 |\n| Unload | 这发生在内容创建并发送到客户端之后。对象从内存中卸载并进行清理工作。\
  \ |\n\n**表 1.3**](#c01.xhtml_c01-tbl-anc-0003) ASP.NET 页面生命周期阶段\n\n生命周期步骤通过一组生命周期事件暴露。开发者可以根据需要与生命周期事件进行交互。在开发过程中你将学习更多关于这种交互。这些事件列在表\
  \ 1.4 中。\n\n| 事件 | 描述和用途 |\n| :--- | :--- |\n| Preinit | 在启动阶段之后、初始化阶段之前触发。通常用于创建或重新动态控件、动态设置主页或主题（后文将介绍）。此阶段的信息尚未被\
  \ ViewState 信息替换。 |\n| Init | 在所有控件初始化后触发。通常用于初始化控件属性。这些初始化不会影响 view state。 |\n\
  | InitComplete | 在 `Init` 和 `InitComplete` 之间只发生一件事，即启用控件视图状态。在此事件及之后的更改将影响 view\
  \ state，因此在 postback 时可用。 |\n| PreLoad | 在页面管理自身及所有控件的视图状态信息之后触发。postback 数据也会在此处理。\
  \ |\n| Load | 调用页面中的 `OnLoad` 方法，然后它会递归地调用每个控件上的相同方法。 |控件 事件，例如按钮的 `Click` 或文本框的\
  \ `TextChanged`。 |\n| LoadComplete | 在所有事件处理之后触发此事件。在此执行任何操作通常都需要所有控件都已加载并完成。 |\n\
  | PreRender | 在所有控件加载后，`Page` 对象开始其预渲染阶段。这是你可以对内容或页面进行任何更改的最后一点。 |\n| PreRenderComplete\
  \ | 在每个数据绑定控件都绑定后触发。这在单个控件级别发生。 |\n\n\n\n\n\n| 事件 | 说明 |\n| :--- | :--- |\n| SaveStateComplete\
  \ | 在页面和所有控件的视图状态保存后触发。在此之后对页面或控件的任何更改都会影响渲染，但这些更改在下次回传（postback）时不会被检索。 |\n| Render\
  \ | 这不是一个事件。相反，在过程的此阶段，`Page` 对象调用每个控件的此方法。所有 ASP.NET Web 服务器控件都有一个 `Render` 方法，用于将控件的标记输出并发送到浏览器。\
  \ |\n| Unload | 用于执行特殊的清理活动，例如关闭文件或数据库连接、记录日志等。 |\n\n## 表 1.4 ASP.NET 页面的生命周期事件\n\
  \n你在示例应用程序中要做的工作仅利用了这些事件中的几个。然而，了解这些事件可能会发生可以让你了解 ASP.NET Web Forms 在底层是如何运作的。Web\
  \ Forms 允许你根据需要，在页面级别和控件级别接入这些每一个事件。虽然你可能会遇到不需要加载事件（Load）和控件事件（Control Events）部分之外任何内容的整个应用程序项目，但\
  \ Web Forms 为你提供了根据需要执行这些操作的能力。\n\n一些强大的控件具有自己的一组事件，你将在开始编写示例应用程序时学习这些内容。\n\n###\
  \ 控件库\n\nASP.NET Web Forms 的益处之一是一组强大的内置服务器控件，这些控件可以提高开发者的开发速度并增强快速应用开发（RAD）。使用这些控件将开发过程转变为更多关于配置而非开发的过程，提供了开箱即用的体验，这可能会满足许多需要最常见默认行为的开发者的需求。此外，由于这种方法的成熟，还有大量的第三方控件可用，并且在\
  \ Visual Studio 内部拥有丰富且强大的支持。\n\n这些 ASP.NET 服务器控件是开发者放置在 ASP.NET Web 页面上的项。它们在页面被请求时运行，其主要责任是创建并渲染标记到浏览器。许多此类服务器控件与熟悉的\
  \ HTML 元素（如按钮和文本框）相似。其他服务器控件允许更复杂的行为，例如管理日历格式显示数据的日历控件，以及你可以用来连接到数据源并显示数据的其他控件：\n\
  \n有四种主要的控件：\n\n*   HTML 服务器控件\n*   Web 服务器控件\n*   验证控件\n*   用户控件\n\n#### HTML 服务器控件\n\
  \nHTML 服务器控件通常是传统 HTML 元素的封装器。这些封装器允许开发者在代码中设置值并使用事件，例如文本框控件在文本显示值发生更改时触发事件。在处理应用程序的\
  \ Web Forms 部分时，你将处理许多不同的 HTML 服务器控件。\n\n#### Web 服务器控件\n\nWeb 服务器控件的作用不仅仅是 HTML\
  \ 元素的封装器。它倾向于包含更多功能，并且比 HTML 服务器控件更抽象，因为它执行的操作更多。日历控件是 Web 服务器控件的一个很好的例子；它通过提供一个按钮，使用户访问网格状的日历以选择合适的日期，从而增强了\
  \ UI 功能。日历控件还提供了其他功能，如限制可选日期的范围、格式化显示的日期，以及按月或按年切换日历。\n\n#### 验证控件\n\n第三种控件是验证控件。该控件确保输入其他控件的值符合某些标准或是有效的。例如，预期只捕获金额的文本框应该只接受数字，可能还可以接受逗号（,）和点（.）。它还应该确保如果输入的值包含小数点，则小数点右侧不能多于两个数字。验证器在客户端和服务器端都提供这种支持。这确保了数据在发送到服务器之前是正确的，并确保数据在到达服务器时是正确的。\n\
  \n#### 用户控件\n\n最后一种控件是用户控件。这是由你自己构建的控件。如果一组功能需要在多个页面上可用，那么你很可能应该将此功能创建为用户控件。这使得同一个控件可以在多个地方被复用，而不是将代码本身复制到多个页面中。\n\
  \n这些控件可以为你做很多非常用的事情，但它们是有代价的。通过使用这些控件，你可能会失去对生成的 HTML 的某些控制，这可能导致输出臃肿或 HTML 不完全符合设计者的需求。\n\
  \n### ASP.NET MVC\n\n在此，你学习了 ASP.NET Web Forms 是一种基于页面的 Web 应用设计方法。ASP.NET MVC 是一种不同的架构方法，强调关注点的分离。Web\
  \ Forms 通常由两个部分组成：标记和代码背后（code-behind），而 MVC 将关注分为分为部分：模型（model）、视图（view）和控制器（controller）。模型是正在显示的数据，视图是数据如何显示给用户，而控制器是确保将适当的模型呈现给正确视图的中间环节。图\
  \ 1.3 说明了不同部分之间的交互。\n\n![模型-视图-控制器 (MVC) 设计图。模型、视图、控制器和客户端之间的关系用箭头和中间的云朵标记。](img/c01f003.jpg)\n\
  \n图 1.3 模型-视图-控制器 (MVC) 设计\n\nASP.NET Web Forms 和 MVC 之间的关键区别是 MVC 向客户端呈现的是视图而不是页面。这不仅仅是语义上的，它表明了方法的差异。Web\
  \ Forms 采用文件系统方法呈现内容；而 MVC 采用的方法是基于你尝试对特定对象执行的“操作类型”，如图 1.4。\n\n![ASP.NET Web Forms\
  \ 和 ASP.NET MVC 方法的图，流程图中使用向下箭头标记。](img/c01f004.jpg)\n\n图 1.4 MVC 与 Web Forms 之间的不同方法\n\
  \nMVC 模式成功的关键原因在于它在很大程度上帮助开发者创建可以分离各个（输入逻辑、业务逻辑和 UI 逻辑）的应用程序，同时在这些元素之间保持相对松的耦合。松耦合系统是指每个组件对其他组件了解很少或完全不了解系统。这允许你在不干扰其他组件的情况下更改组件之一。在\
  \ MVC 应用程序中，视图只显示信息；控制器处理并响应用户输入和交互。例如，控制器处理查询字符串值，并将这些值传递给模型，模型随后可能会使用这些值查询数据库。由于这种分离，你可以完全重新设计\
  \ UI 而完全不影响控制器或模型。由于松耦合，相互依赖关系要严密得多。它还允许不同的人在应用程序开发中承担不同的角色，通过将 HTML 的创建与创建要显示的数据服务器分离来实现。\n\
  \n\n\n\n\nMVC 模式规定了每种类型的逻辑在应用程序中的位置。UI 特有的逻辑属于视图（View）。输入逻辑（或处理来自客户端请求的逻辑）属于控制器（Controller）。业务逻辑则属于模型（Model）层。这种分离有助于你在构建应用程序时管理复杂性，因为它允许你一次只关注实现的一个某一个方面。\n\
  \n## 可测试性\n\n使用 MVC 方法时，一个重要的考虑因素是它所提供的极价值的可测试性提升。单元测试是可重复运行的项目，用于验证特定功能的子集。这在现代开发中非常重要，因为这些单元测试允许开发者对现有代码进行重构或更改。开发者通过运行已经创建的单元测试，可以确定更改是否导致了任何负面副作用。`ASP.NET\
  \ Web Forms` 应用程序之所以难以进行单元测试，原因与它作为一种 RAD（快速应用开发）方法之所以运行良好的原因恰恰相同：内置控件的力量和页面生命周期。它们特定于所属的页面，因此由于与页面上其他项的依赖关系，尝试测试离散的功能单元变得复杂得多。\n\
  \n`ASP.NET MVC` 的方法和分离意味着控制器和模型可以被完全测试。这确保了能够更好地评估、理解和验证应用程序的行为。在构建非常简单的应用程序时，这可能并不重要，但在大型企业级应用程序中，它变得至关重要。它提供业务的功能可能是必不可少的，并且将在很长的生命周期内被管理、维护、微调和更改；代码越复杂，一个区域的更改影响其他区域的风险就越大。在系列更改后运行单元测试可以确保之前创建的功能继续按预期工作。在新功能上构建单元测试可以验证代码运行情况符合预期，并为未来的更改提供保障。\n\
  \n在构建示例 Web 应用程序的过程中，你不会专门构建单元测试。然而，现有的源代码包含一个单元测试项目，并且在你完成开发过程中将创建一些测试，特别是对于那些使用\
  \ `ASP.NET MVC` 的区域。\n\n## 对输出的完全控制\n\n`ASP.NET MVC` 不像 `ASP.NET Web Forms` 那样依赖控件，因此它没有产生臃肿\
  \ HTML 输出的风险。相反，开发者创建他们想要发送给客户端的特定 HTML。这允许完全访问 HTML 元素中的所有属性，而不仅仅是 `ASP.NET Web\
  \ Form` 服务器端控件允许的属性。它还让输出更具可预测性且易于理解。完全控制渲染的 HTML 的另一个优势是让包含 JavaScript 变得更容易。控件创建的\
  \ JavaScript 与开发者创建的 JavaScript 之间不存在冲突可能；由于开发者控制页面上渲染的所有内容，使用可能被生成的 HTML 占用的元素名称和其他属性变得更加简单。\n\
  \n当然，这种额外的灵活性是有代价的：开发者需要花费更多时间来构建 HTML，而不是像使用 Web Form 控件那样可能需要的。它还要求开发者对 HTML 和客户端代码（如\
  \ JavaScript）具备比使用 `Web Forms` 时更多的知识。\n\n## Web Forms 和 MVC 的相似之处\n\n需要的是，`Web\
  \ Forms` 和 `MVC` 并不是对立的方法，而是具有固有不同优劣的不同方法。它们各自解决不同的问题，并且互不互斥。开发者可以在 `Web Forms`\
  \ 中创建单元测试；这只是需要更多工作，并要求开发者在框架默认不提供任何抽象的地方添加抽象。就像几乎任何其他开发问题一样，存在多个潜在的解决方案和方法。设计良好的应用程序无论采用何种方法都会取得成功。\n\
  \n从根本上说，由于 `Web Forms` 和 `MVC` 都是为了解决同一个基础需求——创建提供给客户端用户的 HTML 内容，因此两者之间有很多相似之处。架构合理的应用程序在很大程度上是相同的，特别是在后端处理方面。无论采用何种方法，访问数据库、Web\
  \ 服务或文件系统对象都是相同的。这就是为什么许多开发者可以精通这两种方法。\n\n## 选择最佳方法\n\n如前所述，这些框架中的每一个都有自己的优缺点。你需要根据这些考虑因素评估你的需求，并确定哪一个对你的项目最重要。这意味着没有标准答案；某些项目通过\
  \ `Web Forms` 实现效果最好，而另一些项目可能采用 `MVC` 方法会更合适。\n\n在确定合适的开发方法时，还有其他考虑因素，包括执行此工作的开发者的背景和经验，以及有多少信息是在多个页面上以相同的方式展示的。\n\
  \n幸运的是，随着 `Visual Studio 2015` 和 `ASP.NET 5.0` 的出现，你再也不需要做二选一的选择。通过少量的调整，你可以创建一个根据需要使用这两种方法的项目，让你能够根据具体情况决定使用哪种方法，而不是按整个站点来决定。这种这种针对具体情况的方法被用于示例应用程序，该应用程序同时使用了\
  \ `ASP.NET Web Forms` 和 `ASP.NET MVC` 来解决所呈现的各种业务问题。\n\n## 使用 Visual Studio 2015\n\
  \n微软的 `Visual Studio` 是创建 `ASP.NET` 站点和应用程序的主要集成开发环境 (IDE)。最新版本是 `Microsoft Visual\
  \ Studio 2015`，它包含了许多增强。还有 `C#` 的新版本 `6.0` 和 `VB.NET` 的新版本 `14`。`ASP.NET 5` 也是一个重要的发布，因为它现在可以在安装了\
  \ `Mono` 的 `OS X` 和 `Linux` 上运行。\n\n`Mono` 是一个旨在让开发者轻松创建跨平台的软件平台。它是微软 `.NET Framework`\
  \ 的开源实现，可以在非 Windows 操作系统上运行。这是一个巨大的改变；因为直到现在，每个 `ASP.NET` 应用程序（无论是 `Web Form` 还是\
  \ `MVC`）都需要部署在 Microsoft Windows 服务器上运行。\n\n### 版本\n\nWeb 开发者有多个版本的 `Visual Studio`\
  \ 可供选择：\n\n- `Visual Studio Community Edition`：Visual Studio 的免费版本，旨在帮助爱好者、学生和其他非专业软件开发者构建微软的应用程序。\n\
  - `Visual Studio Web Developer Express`：另一个免费的 `Visual Studio` 版本，仅支持 `ASP.NET`\
  \ 应用程序的开发。\n- `Visual Studio Professional Edition`：用于创建 Web、桌面、服务器、云和手机解决方案的完整 IDE。\n\
  - `Visual Studio Test Professional Edition`：包含了 `Professional Edition` 的所有功能，并具有管理测试计划和创建虚拟实验室的能力。\n\
  - `Visual Studio Premium Edition`：包含了 `Professional Editions` 的所有功能，并增加了与分析代码以及单元测试和其他高级功能相关的架构师级功能。\n\
  - `Visual Studio Ultimate Edition`：Visual Studio 的最完整的版本，包含了开发、分析和软件测试所需的所有内容。\n\
  \n示例应用程序将使用 `Community Edition`，因为它提供了完整的 `Visual Studio` 体验。\n\n\n\n\n\n# 下载与安装\n\
  \n下载和安装 Visual Studio 非常简单。接下来的“尝试一下”（Try It Out）将带你完成相关的各个步骤，从下载正确的版本、选择合适的选项到完成安装。\n\
  \n## 示例应用程序\n\n学习如何完成任务（例如构建互联网应用程序）最好的方法就是直接动手。基于此，我们将在学习 `ASP.NET` 的每个功能区域的过程中，不断构建一个真实的应用程序。我们将开发一个名为\
  \ `RentMyWrox` 的应用程序，它作为一个借用图书馆。\n\n由于此应用同时支持 `ASP.NET Web Forms` 和 `ASP.NET MVC`，为了在两个框架中都展示关键功能，将会涉及一些代码或工作量上的重复。对于某些功能，你可以在两个不同的页面中实现；而对于另一些功能，你必须以两种方式复制相同的功能，基本上就是用一个版本替换另一个。\n\
  \n该应用程序的需求如下：\n\n* 网站所有者（管理员）可以创建可可供租赁或借用的物品列表。\n* 物品包含图片和文本。\n* 用户可以在线上创建并注册账户，以便安全地访问应用程序。\n\
  * 用户可以登录并选择一个或多个他们想要出的物品。\n* 物品列表可以进行过滤。\n* 用户可以通过某种结账流程完成预订。\n\n这些需求将让你有机会学习网站外观和感受的设计、在数据库中获取和保存信息，以及如何同时使用\
  \ `ASP.NET Web Forms` 和 `MVC` 方法处理用户账户的创建和身份验证。\n\n## 总结\n\n多年来，微软提供了许多不同的 Web 应用程序框架。在引入\
  \ `.NET Framework` 之前有一种方法提供了将 `HTML5` 标记与业务处理相结合的能力。这种方法现在被称为“经典 ASP”（Classic ASP），它在当时是具有创新性的，让开发者能够快速且相对容易地构建复杂的业务应用程序。\n\
  \n`ASP.NET` 随了这些足迹，为开发者提供了一个可以平衡所有开发工作的框架。当 `ASP.NET` 引入时，仅支持一种开发框架：`ASP.NET Web\
  \ Forms`。该框架采用了基于页面的方法，将特定的页面和将要调用的资源名称绑定在一起。每个资源页面有两个物理页面：一个页面包含返回给客户端的 `HTML`\
  \ 标记，另一个页面则提供所有的处理逻辑。这实现了 Classic ASP 未能解决的关注点分离。\n\n然而，在几年之后，微软发布了另一个框架：`ASP.NET\
  \ MVC`。这种方法允许更深层次的关注点分离，大大增强了自动化方式测试业务处理的能力。这非常重要，因为极大地提高了对代码正确性的信心。\n\n所有这些框架的设计目的都是完成一件事：从服务器向客户端提供\
  \ `HTML`。`HTML` 是互联网的语言——它包含了你在网站上看到的所有内容的布局和标记。创建这些 `HTML` 是首要任务。显然，后台正在进行其他处理，但返回给请求客户端的这些工作的任何表示都将是\
  \ `HTML`。\n\n## 练习题\n\n1. **1.** `HTML` 和 `HTTP` 之间的区别是什么？\n2. **2.** 在使用 `ASP.NET\
  \ Web Forms` 时，为什么 `ViewState` 特别重要？\n3. **3.** `ASP.NET MVC` 的三个不同架构组件是什么？\n4.\
  \ **4.** 什么是 Microsoft Visual Studio？我们在本书中用它来做什么？\n\n## 本章你学到的知识\n\n| 属性 | 描述 |\n\
  | --- | --- |\n| 属性 (Attributes) | 你可以放在 `HTML` 元素中的额外信息，它可能会改变该元素与浏览器或用户交互的方式。\
  \ |\n| 元素 (Elements) | `HTML` 的一个部分，定义了一组内容。元素定义了内容，因为内容周围有一个起始标记 `<p>` 和一个结束标记\
  \ `</p>`。 |\n| HTML | 超文本标记语言，在互联网上标识内容的方式，以便浏览器知道如何处理和显示信息。 |\n| HTTP | 超文本传输协议，处理请求/响应行为的定义，该行为将信息从客户端传递到服务器并返回。\
  \ |\n| IDE | 集成开发环境环境，一组工具和辅助工具的集合，帮助开发者构建程序和应用程序。 |\n| MVC | 一种架构模式，将网站的职责分为三个不同的组件：模型（Models）、视图（Views）和控制器（Controllers）。每个部分负责构建用户界面的部分过程工作。\
  \ |\n| Web Forms | 一种基于页面的构建 Web 应用程序的方法，因此每组功能都是自己的一个页面，负责自身的渲染和业务逻辑。 |\n\n# 第\
  \ 2 章：构建初始 ASP.NET 应用程序\n\n**你将在本章中学习到：**\n\n* Visual Studio 中网站项目和 Web 应用程序项目之间的区别\n\
  * Visual Studio 中可用的项目类型以及它们对示例应用程序的意义\n* 如何在 Visual Studio 中创建新的 `ASP.NET` 站点\n\
  * `ASP.NET Web Forms` 和 `MVC` 中的文件类型和目录结构\n* `ASP.NET Web Forms` 和 `MVC` 之间的区别\n\
  \n## 本章代码下载：\n\n本章的 [wrox.com](http://wrox.com) 代码下载位于“下载代码”（Download Code）选项卡中的\
  \ [www.wrox.com/go/beginningaspnetforvisualstudio](http://www.wrox.com/go/beginningaspnetforvisualstudio)。代码位于第\
  \ 02 章下载中，并根据整个章节中的进行单独命名。\n\n现在你已经安装了 Visual Studio 并了解了示例应用程序的需求，是时候开始构建了。如果你使用\
  \ `ASP.NET Web Forms` 或 `ASP.NET MVC`，Visual Studio 会让创建应用程序外壳（初始目录结构和常用文件）变得非常简单。\n\
  \n\n\n\n\n在 Visual Studio 中，网站项目与 Web 项目的处理方式不同。图 2.1 显示了它们创建方式的何不同。\n\n![启动页截图，选中了“文件”并显示有“新建”选项。在“新建”中可以找到项目...、网站...团队项目...等选项。](img/c02f001.jpg)\n\
  \n图 2.1 创建项目或网站\n\n然而，正如你将在后续章节中看到的，这两种方法之间的区别远不止创建方式的那么简单。\n\n## 基于网站的项目方法\n\n\
  网站项目是一种管理和部署网站的轻量级、非企业级的方法。标记文件（`.aspx`）被复制到服务器并在请求期间被调用。后置代码文件（code-behind files）在服务器上编译，并在首次调用服务器时被保存为临时的\
  \ `.dll` 文件。这种在程序执行期间（即运行时）进行编译，而不是在程序运行之前完成编译的过程被称为“即时编译”（just-in-time compilation）。项目中不包含项目文件。相反，每个文件和目录都被视为单独处理。\n\
  \n正如你可以想象的，这使得操作网站变得非常简单。服务器上不需要运行任何特殊的安装；你只需要将整个文件夹复制到运行 Microsoft Internet Information\
  \ Services (IIS) 的机器上即可启动网站。在网站中添加或删除文件就像从目录中删除它们一样简单，尽管一旦它们从服务器上删除将无法访问，因此必须对指向该页面的任何链接也进行编辑！\n\
  \n然而，这种方法的高度灵活性也带来了一些局限性。对本项目影响最大的限制是你无法创建 ASP.NET MVC 应用程序，因为 MVC 应用程序需要全编译。你只能创建\
  \ ASP.NET Web Forms 以及其他不需要全编译的项目。图 2.2 显示了在菜单中选择“新建”![arrow](img/arrow.jpg) “网站”后出现的“新建网站”对话框。\n\
  \n![新建网站对话框截图，包含 .NET Framework 4.5 下的选项。](img/c02f002.jpg)\n\n图 2.2 创建新网站时的选项\n\
  \n虽然创建网站时有很多不同的选项，但请注意这些选项并不包含 MVC 应用程序。\n\n## Web 项目\n\n与网站相比，Web 应用程序是创建应用程序的一种完全不同的方法。Web\
  \ 应用程序将项目视为真正的应用程序，而不是简单的文件分组。这意味着你可能想对网站执行的任何操作（例如添加图像文件或其他支持项）都应该使用 IDE 完成。你还必须在部署之前编译应用程序。虽然这在部署阶段需要花费更多工作，但它也让你能够避免将源代码部署到服务器上。此外，它还能加快应用程序的响应时间，因为用户不需要在内容创建之前等待即时编译的发生。\n\
  \n由于 ASP.NET 网站不允许创建 ASP.NET MVC 站点，而这是主要要求之一，因此你需要使用 Web 项目作为构建应用程序的方法。\n\n## 创建新站点\n\
  \n创建示例应用程序的第一步是在 Visual Studio 中创建一个适当的项目。通过选择`文件`![arrow](img/arrow.jpg) `新建项目`，你将看到如图\
  \ 2.3 所示的“新建项目”对话框。\n\n![新建项目对话框截图，在“模板”选项卡下选中了“Web”，并高亮了“ASP.NET Web 应用程序”选项。名称、位置、解决方案名称选项已填写，确定和取消按钮位于底部。(images/c02f003.jpg)\n\
  \n图 2.3 在 Visual Studio 中创建新项目\n\n选择 ASP.NET Web 应用程序项目类型，为其指定你所需的名称，并选择你存储项目文件的首选位置。默认情况下，Visual\
  \ Studio 配置为将文件保存到“我的文档”下的目录中。你还可以选择在应用程序中使用的 .NET Framework 版本。你填写好的屏幕看起来应该像图 2.3\
  \ 所示。一旦你选择了 ASP.NET Web 应用程序项目并点击“确定”按钮，你将看到如图 2.4 所示的对话框，其中显示了你可以从中选择的可用模板。这告诉\
  \ IDE 你想要创建什么种类型的 ASP.NET 项目。\n\n![新建 ASP.NET 项目对话框截图，在“选择模板”选项卡下高亮了“Web Forms”及其下方的选项。确定和取消按钮位于底部。(images/c02f004.jpg)\n\
  \n图 2.4 选择合适的 ASP.NET 模板\n\n选择这些模板之一将为该特定模板创建适当的文件结构和最常用的文件。这些可用模板中的每一个都将在后续章节中详细介绍。\n\
  \n## 创建项目时\n\n“新建项目”窗口还有其他几个部分是你需要的，因为它们会影响项目的创建方式。模板部分位于窗口的左上角。窗口的右上角包含应用程序将“支持的身份验证类型选择。窗口的左下部分包含“文件夹和核心引用”以及单元测试，而窗口的右下角允许你在需要时将项目部署到\
  \ Microsoft Azure。\n\n### 身份验证选项\n\n对于构建的每一个应用程序，身份验证都是一个考虑因素，这就是为什么它出现在项目创建窗口中。正如你可能所知，身份验证是评估应用程序用户是否如其所称的的过程。如果你的应用程序需要识别用户为特定个人，则需要身份验证。验证一个人是否如其所称的的常用方法是使用用户名和密码。用户名识别用户，而密码确认该个人是否如其所称。\n\
  \n项目模板内置支持四种不同的身份验证设置，如图 2.5 所示：\n\n*   无身份验证\n*   组织账户\n*   用户账户\n*   Windows 身份验证\n\
  \n![更改身份验证对话框截图，有四个选项并选中了“用户账户”。确定和取消按钮位于底部。(images/c02f005.jpg)\n\n图 2.5 新项目的身份验证选项\n\
  \n无身份验证非常简单；这意味着应用程序默认不进行任何身份验证。这可以用于对个人用户并不重要的网站——例如信息性网站或不支持在线订单的产品网站，或者身份验证处理方式与内置默认方法不同的网站。\n\
  \n“组织账户”身份验证选项意味着你正在使用第三方系统来处理身份验证。这些第三方系统通常是本地 Active Directory、云端 Active Directory（如\
  \ Microsoft Azure Active Directory）或 Office 365。如果其他方法遵循某些身份验证标准，也支持这些方法。\n\n\n\n\
  \n\nWindows 身份验证（Windows Authentication）是仅由 Microsoft Internet Explorer 支持的一种功能。在这种授权方法中，浏览器包含一个特殊的用户令牌（token），服务器可以使用它来确定和识别请求的用户。这消除了任何用户名/密码的请求。然而，它要求用户已经登录到活动目录（Active\
  \ Directory）域，并且这些信息对浏览器是可见的这与之前提到的组织账户（Organization Accounts）方法不同，因为那种方法需要用户输入用户名和密码，然后在网络上进行验证，而这种方法仅是发送一个标识符以及关于用户已通过验证的确认。\n\
  \n个人用户账户（Individual User Accounts）是默认身份验证设置，适用于那些需要确定用户身份且不想使用活动目录或 Windows 身份验证方法的情况。使用此方法时，你可以使用\
  \ `SQL Server` 数据库来管理用户，也可以使用其他方法，例如让其他系统（如 Windows Live 或 Facebook）处理用户的身份验证。你将在你的项目中使用此设置。\n\
  \n## 文件夹、核心引用文件和单元测试\n\n新建 ASP.NET 项目窗口的左下部分提供了两种不同的配置设置。第一种是在创建新项目时想要添加的文件夹和核心引用。选项包括\
  \ Web Forms、MVC 和 Web API。根据你选择的模板，默认勾选的项目会有所不同；因此，如果你选择了 ASP.NET MVC 模板，MVC 复选框将被默认勾选。此部分如图图\
  \ 2.6\n\nFigure 2.6 添加目录和单元测试\n\n添加额外的文件夹和核心引用文件仅仅是执行添加；它会创建文件夹结构和任何默认文件，但不会更改从模板创建应用程序的任何内容。例如，如果你使用\
  \ Web Forms 项目但选择添加 MVC 文件夹，所有的 MVC 文件夹都会为你创建，但它们没有任何内容。\n\n该象限中的另一个选项指定了你想要创建一个单元测试（Unit\
  \ Test）项目。单元测试通常是一种以可复制、自动的方式测试最小功能单元的方法——一种确保特定方法或函数按预期工作的检查。单元测试是创建可重新运行测试的过程，以验证特定功能的子集。单元测试项目是一个\
  \ Visual Studio 项目，用于管理单元测试的创建、维护和运行。它允许开发者针对应用程序运行之前创建的单元测试，以确保更改没有对应用程序的其他部分产生负面影响。\n\
  \n如果你正在创建一个真正的业务应用程序，那么创建一个单元测试项目是至关重要的。单元测试通过让你提供的代码按预期运行来为你提供保证，因为它允许你向应用程序的部分提供已知的数据集，然后将应用程序的实际结果与之前确定的预期的结果进行比较。这使你能够识别出应用程序某部分可能需要的更改是否破坏应用程序的其他部分。\n\
  \n## 在 Microsoft Azure 中托管你的项目\n\nMicrosoft Azure 允许你将网站部署到云端，而不是直接部署到你控制的服务器上。在这种情况下，它是一个云计算平台，通过\
  \ Microsoft 管理的数据中心的全球网络来构建、部署和管理应用程序。Azure 允许使用许多不同的语言、工具和框架构建应用程序，之后可以将它们部署到云端。\n\
  \n作为项目创建过程的一部分，你可以指定是否将向 Azure 部署你的应用程序，并配置如何管理部署。由于我们不会将示例应用程序部署到 Azure，你可以留空此复选框，无需担心输入任何配置信息。\n\
  \n### 空模板 (Empty Template)\n\n空模板创建的本质就是空模板，与创建示例应用程序的其他模板相比，它基本上是一个空目录。它添加了一些基础支持文件，以及你在左下象限“添加文件夹和核心引用（Add\
  \ folders and core references for）”部分选择的项目。当你选择空模板时，没有任何“添加文件夹”的选项被默认勾选。\n\n不选择这些任何一个选项的结果很快就会显而易见。图\
  \ 2.7 显示了空模板如何创建一个没有文件夹且只有一个文件（即配置文件 `Web.config`）的项目。\n\n![解决方案管理器对话框的截图，高亮了示例应用程序选项卡，Web.config\
  \ 选项位于最后。](img/c02f007.jpg)\n\nFigure 2.7 使用空模板创建项目\n\n这是一个空模板，因为没有创建任何内容。尝试在浏览器中查看输出将导致错误，因为没有内容可以显示给用户。\n\
  \n### Web Forms 模板 (Web Forms Template)\n\nWeb Forms 模板创建一个带有几个示例文件的网站项目，以便你为项目提供一个初始起点。通过此模板添加的一些功能包括用户注册和登录应用程序的能力。这些是\
  \ Web 应用程序较复杂的部分之一，但模板在创建时这些功能已经开箱即用。如图图 2.9 所示，此运行的应用程序包含了关于使用 ASP.NET 的信息，并包含首页（Home）、关于（About）和联系我们（Contact）页面。\n\
  \n![新建的默认 Web Forms 项目的截图，带有 ASP.NET 文字和“了解更多”按钮。标签包括应用程序名称、首页、关于、联系、注册和登录。](img/c02f009.jpg)\n\
  \nFigure 2.9 运行新建的默认 Web Forms 项目\n\n菜单项列出的页面都作为启动页面创建，以便让你了解这类应用程序是如何构建的，特别是在使用涉及复杂的身份验证时。\n\
  \n### MVC 模板 (MVC Template)\n\nMVC 模板采用了与 Web Forms 模板类似的方法，创建一个小型功能集，包括用户创建账户并登录应用程序的功能。它包含与\
  \ Web Forms 模板相同的首页、关于页面，以及一个占符的空联系我们页面。运行时应用程序的外观甚至完全相同，但目录和文件结构完全不同。我们将在本章稍些之后讨论更多具体的差异。然而，当运行此模板的输出时，你看到的应用程序与图\
  \ 2.9 所示的程序无异。\n\n### Web API 模板 (Web API Template)\n\nWeb API 是一种基于 ASP.NET MVC\
  \ 的开发 RESTful Web 服务的方法；它最初被称为 ASP.NET MVC Web API。它遵循的约定和构建方式对于 ASP.NET MVC 开发者来说将非常熟悉。一旦你完成了示例应用程序，你还将理解如何编写\
  \ Web API 应用程序。\n\n\n\n\nWeb 服务在互联网中变得越来越重要，因为它们允许两台机器进行在线通信。它遵循 HTTP 方法，即其中一台机器通过定义良好的定位符（或\
  \ URL）向另一台机器请求资源。用户的浏览器最可能会请求并获取一个 HTML 文件，而 Web 服务则返回信息。向网站查询某个产品的信息可能会返回一个格式良好的\
  \ HTML 文件，其中包含图片，可能还包含关于该产品的其他辅助信息（如评分）。然而，Web 服务将向你返回关于该产品的任何数据，格式化为 XML 或 json\
  \ 文件。这两种格式类型将在第 13 章“ASP.NET AJAX”中进行更详细的介绍。\n\nRESTful Web 服务是指那些遵循表述状态转换（REST）架构风格并在\
  \ Web 上提供信息的 Web 服务。这种风格高度代表了前面提到的 HTTP 过程——包括 HTTP 动词。示例应用程序中服务的使用将在第 13 章中介绍。\n\
  \n尽管 REST 服务的概念意味着没有支持它们的 HTML 文件，但此模板确实创建了两个页面：首页和 API 帮助页面。API 帮助页面是你的 Web 服务将理解和处理的信息类型文档的开端。图\
  \ 2.10 显示了默认的 API 帮助页面。\n\n![Web API 项目窗口中的 API 帮助页面截图，Account 下有一个条目列表，所有条目的 Description\
  \ 文本均为“无可用文档”。](img/c02f010.jpg)\n\n**图 2.10** Web API 项目中的 API 帮助页面\n\n虽然不会作为示例应用程序的一部分直接处理\
  \ Web API 项目，但该项目与你之后在构建示例应用程序时使用服务进行的某些工作有许多相似之处。\n\n### 单页应用模板 (Single Page Application\
  \ Template)\n\n与标准的 MVC 和 Web Forms 方法不同，单页应用模板构建 Web 应用程序采取了不同的方法。它不是拥有不同的视图和/或\
  \ Web 页面，而是单一 Web 页面，旨在提供类似于桌面应用程序的更流畅的用户体验。这意味着只需下载一次 HTML 和 JavaScript 文件，然后应用程序在该单一页面中运行，获取信息并重新显示数据或屏幕部分，必要时甚至会显示整个视觉屏幕。\n\
  \n单页方法意味着大部分工作要么在客户端完成（从服务器获取数据并通过客户端模板进行解析），要么在服务器端完成（向客户端返回完整的 HTML 格式片段，并根据需要替换已加载页面的各个部分）。关键区别在于不再再次从服务器调用整个页面，只调用页面的部分。这消除了几个传统问题：Web\
  \ 浏览器中页面被新下载的页面在内存中完全替换时产生的闪烁问题、等待整个页面在服务器之间往返传输的明显等待感，以及所有数据双向移动的必要性（从而降低了对带宽的需求并提供了更高的性能）。\n\
  \n这种方法利用了 AJAX（异步 JavaScript 和 XML）方法，使用客户端代码调用 Web 服务获取信息。第 13 章涵盖了在 Web 应用程序中使用\
  \ AJAX 的。创建单页应用是该方法的扩展。在大多数情况下，单页应用将与 RESTful 服务配合以获取需要显示的数据。\n\n### Azure 移动服务模板\
  \ (Azure Mobile Service Template)\n\n此项目模板专门用于为 Microsoft Azure Mobile Services\
  \ 创建基于 Web API 的后端。Azure 有许多不同方面，其中一个就是他们的移动服务产品，它允许开发者托管 .NET 或 node.js（服务器端 JavaScript）后端，为移动消费者提供数据。尽管移动开发是一个快速增长的开发领域，但示例应用并没有使用此模板。\n\
  \n## 在应用程序中处理文件 (Working with Files in Your Application)\n\n就像在 Microsoft Windows\
  \ 计算机上进行所有其他工作一样，你所做的一切工作归取决于单个文件以及在 Web 应用程序整体结构中所扮演的角色。由于我们采用 Web 应用程序方法而不是网站方法来构建\
  \ ASP.NET 应用程序，示例项目使用的每个文件要么被编译成单个 `.dll` 文件，要么作为单独的文件复制到网站。\n\n任何与服务器端工作有关的内容都会编译到\
  \ `.dll` 文件中。任何要发送到客户端的内容（如图像、JavaScript 或 CSS 文件）将保持原样并复制到服务器上的输出文件夹。这使得在需要时可以发生设计和客户端功能的更改，而无需进行完整的网站部署。\n\
  \n由于 Web Forms 和 MVC 各有不同的实现模式，因此每种都有不同的文件类型，并存储在不同的文件夹结构中。\n\n### ASP.NET MVC 应用程序的文件类型\
  \ (File Types of an ASP.NET MVC Application)\n\nASP.NET MVC 应用程序是 MVC 模式（模型、视图、控制器）的实现。这意味着项目中将三种不同类型的文件来支持这种方法——一种支持视图（View），一种支持模型（Model），一种支持控制器（Controller）。它还包含用于各种其他用途（如配置和客户端支持）的支持文件。\n\
  \n基本 MVC 应用的主要文件类型如表 2.1 所示。\n\n| **文件类型** | **文件扩展名(s)** | **描述** |\n| :--- | :---\
  \ | :--- |\n| 视图文件 (View file) | `.vbhtml` `.cshtml` | 用于创建视图的 HTML 输出 |\n| JavaScript\
  \ 文件 | `.js` | 浏览器用于管理客户端执行的 JavaScript 文件 |\n| 代码文件 (Code file) | `.vb.cs` | 编译执行并运行的内容；模型和控制器都以代码文件存储在项目中\
  \ |\n| 样式表 (Style sheet) | `.css` | 为浏览器提供设置网页外观的指令 |\n| 配置文件 (Configuration file)\
  \ | `.config` | 应用程序使用的配置信息，如稍后显示的数据库连接字符串 |\n| 应用事件文件 (Application event file)|\
  \ `.asax` | IIS Web 服务器处理应用程序和会话级事件，例如创建路由 |\n| Web 文件 (Web file) | `.html` | 静态\
  \ Web 文件，不进行任何服务器端处理，但向浏览器呈现 HTML |\n\n注：由于你提供的原文在表格处截中断，后半部分未翻译。如果需要翻译剩余部分，请提供完整的文本。\n\
  \n\n\n其余的文件具有其特定的内部设计，因为它们在 Web 应用程序的构建和运行中起着特定的角色。这种特殊性意味着大多数文件都是作为单独的文件复制到服务器的，以便根据需要直接下载到用户的浏览器中。\n\
  \n### ASP.NET MVC 应用程序的文件系统结构\n\n在创建 ASP.NET 应用程序时，会为 MVC 和 ASP.NET 应用程序创建一些文件夹。这些文件夹列在表\
  \ 2.2 中。\n\n| 文件夹 | 描述 |\n| :--- | :--- |\n| App_Data | 用于数据存储的文件夹。它通常包含 Web 应用程序可能使用的任何\
  \ SQL Server `.mdf` 文件。这将在第 10 章“处理数据——高级主题”中进行更详细介绍。 |\n| App_Start | `App_Start`\
  \ 文件夹包含应用程序使用的许多配置文件。你将在整本书中学习更多关于这些文件的知识，因为它们与文件合并、身份验证以及 URL 构建或路由等行为相关。 |\n|\
  \ Content | `Content` 目录用于存放发送到客户端的项。默认情况下，作为初始应用程序一部分创建的级联样式表 (`CSS`) 存储在那里。 |\n\
  | Fonts | `Fonts` 目录包含默认应用程序中使用的一些字形。通常你可能不会使用此类字体，但你确实拥有这种能力。 |\n| Models | `Models`\
  \ 文件夹用于存放作为模板过程一部分创建的模型。作为项目创建过程的一部分添加的模型都与身份验证相关。 |\n| Scripts | `Scripts` 文件夹用于存储发送到客户端浏览器的\
  \ JavaScript 文件，以执行客户端处理。 |\n\n表 2.2 ASP.NET 通用文件夹\n\n当你从模板创建 ASP.NET MVC 时，图 2.11\
  \ 所示的文件夹也会作为过程的一部分被创建。\n\n![解决方案资源管理器中安装的 ASP.NET MVC 文件夹截图，其中高亮了“MVC 模板”选项以及下方的文件夹。](img/c02f011.jpg)\n\
  \n图 2.11 带有 ASP.NET MVC 的安装文件夹\n\n作为 MVC 模板一部分添加的额外文件夹用于视图（views）和控制器（controllers）。你已经简单查看了视图和控制器是如何融入框架的，现在你将首次查看这些内容在模板应用程序中是如何结合的。图\
  \ 2.12 显示了展开的 Controllers 和 Views 文件夹。你应该能看到之间的一些相似之处，主要在于不同的控制器文件都有对应的视图子文件夹，该文件夹的命名与控制器文件相同，但末尾没有“controller”字样。这是一个\
  \ `views` 文件夹而不是单个文件（如 `Controller` 那样），因为每个 `views` 文件夹包含多个文件。\n\n![在 MVC 模板下，ASP.NET\
  \ MVC 应用程序解决方案资源管理器中展开的 Controllers 和 Views 文件夹的截图。](img/c02f012.jpg)\n\n图 2.12\
  \ Controllers 和 Views 文件夹下的详细信息\n\n如果你查看 `Account` 子文件夹中的文件名，你将能够识别出一种模式，即每个文件代表用户管理的一个方面，从\
  \ `Register.cshtml` 显示的注册，到 `Login.cshtml` 显示的登录，再到处理忘记密码的 `ForgotPassword.cshtml`，到重置密码并确认密码已重置的\
  \ `ResetPassword.cshtml` 和 `ResetPasswordConfirmation.cshtml`。\n\n到为止涵盖的所有文件夹在从\
  \ ASP.NET MVC 模板添加项目时都是默认创建的。当你查看 ASP.NET Web Forms 结构时，你会发现它与表 2.2 中列出的目录相匹配。这初可能看起来令人惊讶，但使用\
  \ Web Forms 构建 Web 应用程序的方法是不同的，因为模板和处理文件是在在一起的，不像 MVC 应用程序中它们被分离到不同的目录中。\n\n###\
  \ ASP.NET Web Forms 应用程序的文件类型\n\nASP.NET MVC 和 Web Form 项目之间存在一些共同的文件类型。表 2.3 提供了\
  \ ASP.NET Web Forms 项目中常见文件类型的列表。\n\n| 文件类型 | 文件扩展名 | 描述 |\n| :--- | :--- | :---\
  \ |\n| Web Form 页面 | `.aspx` | 用户查看的单个页面。 |\n| Web 用户控件 | `.ascx` | 一组充当 UI 单部分的文件；用户控件是一组可重用的应用程序部分。\
  \ |\n| 后代码 (Code-behind) | `.aspx.cs/.vb` 或 `ascx.cd/.vb` | 包含处理代码的页面；`.aspx` 和\
  \ `.ascx` 文件包含标记，其对应的 `.cs` 或 `.vb` 文件包含管理处理的代码。 |\n| 主页 (Master page) | `.master`\
  \ | 允许创建一个用于多个页面的模板，例如导航结构。 |\n| 样式表 | `.css` | 赋予你样式和设计应用程序的能力。 |\n| HTML 文件 |\
  \ `.html` | 应用程序内的 HTML 页面。 |\n| 配置 | `.config` | 应用程序执行其他工作所需的信息。 |\n| 地图 (SiteMap)\
  \ | `.sitemap` | 应用程序文件的 XML 列表。 |\n| JavaScript 文件 | `.js` | 可以在客户端计算机运行的 JavaScript；这与\
  \ MVC 应用程序中的 JavaScript 文件相同。 |\n| 皮肤文件 (Skin) | `.skin` | 为应用程序中可能使用的某些 ASP.NET\
  \ 控件存储设计信息。 |\n\n表 2.3 ASP.NET Web Forms 应用程序的文件类型\n\n唯一相同的文件类型是配置文件 `.config` 以及发送到客户端的文件\
  \ `.html`、`.js` 和 `.css` 文件。配置文件（正如你在使用“空模板”创建项目时查看的结构所示）是默认包含的，并包含在每个 ASP.NET 应用程序中。这是因为\
  \ Web 服务器（IIS）使用配置文件来确定它需要如何管理 Web 应用程序。\n\n\n\n\n当你查看之前的代码列表时，你可能会发现它们的相似之处比差异更令你震惊。是的，每个文件的内容看起来有些不同，但最终你为每种方法都得到了两个示例：一个包含标记，另一个包含处理代码。因此，从概念上讲，这些方法非常相似。两种方法之间的主要区别不在于文件是如何构建的，而在于它们是如何组装的。\n\
  \nASP.NET Web Forms 在标记文件与相应的处理文件之间建立了非常紧固的链接。通过观察它们就可以看出它们是相关的；Visual Studio 甚至在解决方案资源管理器中将它们显示在一起。ASP.NET\
  \ MVC 则不同。文件之间没有自动的一一对应关系。相反，如图 2.13 所示，一个 Controller 文件对应多个 View 文件。在这种情况下，有 12\
  \ 个独立的 View 文件都关联到单个文件 `AccountController` 上。\n\n![ASP.NET MVC 中 Controllers 和 Views\
  \ 文件夹展开后的截图，其中 Views 选项下的 Account 文件夹已展开，显示了 12 个文件。](img/c02f013.jpg)\n\n图 2.13\
  \ ASP.NET MVC 应用中 View 文件与 Controller 文件之间的关系\n\n我们尚未涵盖的是模型（Model），即 MVC 架构模式中的“M”部分。这是因为不是一个新概念。虽然\
  \ MVC 模式将模型称为一个独立的实体，但一个架构良好的 Web Forms 应用体现了相同的概念。这通过为 ASP.NET MVC 模板应用程序和 ASP.NET\
  \ Web Forms 模板应用程序都创建了 `Model` 目录得到了证明。\n\n回看一个 Controller 文件对应多个 View 文件的情况，这显示了两种方法之间的主要区别。虽然图\
  \ 2.13 显示 ASP.NET MVC 中的 13 个文件是账户管理过程的一部分（即 12 个 View 文件和 1 个 Controller 文件），但当你在\
  \ ASP.NET Web Forms 中查看相同的功能集时，你会看到不同的结果，如图 2.14 所示。\n\n![解决方案资源管理器中解决方案 'WebFormsTemplate'\
  \ 标签的截图。在 Accounts 文件夹下列出了 15 个文件。](img/c02f014.jpg)\n\n图 2.14 Web Forms 中的账户管理功能\n\
  \n在这种情况下，你会在解决方案资源管理器中看到至少 15 个文件文件。此外，由于每个文件实际上都是 `.aspx` 和 `.aspx.cs` 文件的组合，目录中有\
  \ 30 个文件来管理与 MVC 系统中 13 个文件所支持的相同过程。这证明了两者之间的主要区别——处理逻辑与视图之间的完全分离。是的，ASP.NET Web\
  \ Forms 提供了一些分离，但总是预期存在一个链接的处理文件。MVC 采取了更加灵活且分离得更好的方法。\n\n## 创建示例应用程序\n\n到目前为止，你已经学习了创建新应用程序时可用的各种模板，但还没有学习如何启动该应用程序。你已知的是：\n\
  \n*   你希望在同一个应用程序中支持 ASP.NET MVC 和 ASP.NET Web Forms。\n*   ASP.NET Web Forms 的目录列表是\
  \ ASP.NET MVC 模板创建目录的子集。\n*   ASP.NET Web Forms 没有通过创建独立文件夹的约定。\n\n考虑到这些不同点，使用 ASP.NET\
  \ MVC 模板创建示例应用程序似乎是最合理的，因为它提供了你所需的一切内容。继续使用 MVC 模板创建应用程序的初始外壳。你还应该勾选 Web Forms 额外目录复选框。此更改不会添加任何额外的文件夹或文件，但它确实为\
  \ ASP.NET MVC 和 Web Forms 添加了必要的引用。接下来的“尝试一下”（Try It Out）将引导你完成创建项目的步骤。\n\n## 总结\n\
  \nVisual Studio 和 ASP.NET 提供了构建 ASP.NET 应用程序的两种方法。第一种是通过使用网站（web site）。网站方法允许你创建一个易于管理和部署的应用程序。在站点部署期间，它的处理方式不同，因为文件只需要复制到服务器上，然后由服务器根据需要编译后台文件。这使得部署过程变得非常简单。遗憾的是，这种方法仅适用于\
  \ ASP.NET Web Form 。你不能将 MVC 应用程序创建为网站。\n\nWeb 应用程序（web application）采用了更传统的基于应用程序的方法，因为它要求应用程序在复制到服务器之前先进行编译。当你想要创建\
  \ ASP.NET Web 应用程序项目时，Visual Studio 中提供的大量模板表明了 Web 开发在微软开发社区中是多么受欢迎。\n\n对于示例应用程序，重要的两个模板是\
  \ ASP.NET MVC 和 ASP.NET Web Forms 模板。两者都创建了一个看起来和工作起来完全相同的初始应用程序，尽管它们的构建方式完全不同。Web\
  \ Form 文件是成对出现的，包含一个标记文件和一个处理文件，而 MVC 文件则带有 Views 和 Controllers 文件。\n\n### 练习\n\n\
  1.  Visual Studio 中有两种创建 Web 应用程序的方法。它们分别是什么，它们的主要区别是什么？\n2.  什么是项目模板？\n3.  与 ASP.NET\
  \ Web Forms 项目相比，ASP.NET MVC 项目中创建了几个额外的文件夹。这些文件夹是什么，起什么作用？\n\n## 本章所学\n\n| 类别 |\
  \ 内容 |\n| :--- | :--- |\n| 代码文件类型 | 在 ASP.NET MVC 创建过程中具有 `.vb` 或 `.cs` 扩展名的文件是代码文件。这些文件是\
  \ `Controller` 文件或 `Model` 文件；你可以根据它们所在的文件夹过滤器来判断。 |\n| MVC 模板 | MVC 项目模板用于创建 ASP.NET\
  \ MVC 项目。根据创建过程中的选择，模板可能会创建一些基础页面并将身份验证集成到项目中。 |\n| 项目类型 | 项目类型是 Visual Studio 定义的创建项目时将生成的输出类型。这种输出决定了项目在编译后的样子，例如\
  \ Web 应用程序、桌面应用程序、Web 服务或其他许多类型。 |\n| 视图文件类型 | ASP.NET MVC 应用程序中视图的文件扩展名为 `.vbhtml`\
  \ 和 `.cshtml`。这些文件包含了最终发送给客户端的 HTML。 |\n| Web 应用程序 | Web 应用程序项目是在互联网上访问的项目。代码文件被编译并部署到服务器上，由微软信息服务\
  \ (IIS) 接收服务器请求并创建 HTML 内容来响应用户。 |\n| Web Form 模板 | 用于创建 ASP.NET Web Forms 应用程序的项目模板。根据创建过程中的选择，模板可能会创建一些基础页面并将身份验证集成到项目中。\
  \ |\n| 网站 | 网站项目是一种创建一组可以复制到 Web 服务器以提供 Internet 内容的文件的方法。源代码被复制到服务器，由 IIS 在调用方法之前对其进行编译。\
  \ |\n\n\n\n\n\n本章对应的 [wrox.com](http://wrox.com) 代码下载可以在 [www.wrox.com/go/beginningaspnetforvisualstudio](http://www.wrox.com/go/beginningaspnetforvisualstudio)\
  \ 的“Download Code”选项卡中找到。代码位于第 03 章下载中，并根据章节中的名称进行单独命名。\n\n在许多方面，现代网站无论其目的如何，都非常相似。它们往往具有功能性、响应式且具有吸引力。一个外观良好的网站对于吸引和留住访问者，与网站的功能性同样重要。极少数的网站可以在减少设计元素的同时保持有效性。然而，所有网站——无论内容、设计方法和业务需求如何——都会向用户提供相同的信息，用户会下载一个或多个\
  \ HTML 文档、一些样式信息，可能还有图像甚至是视频。\n\n本章涵盖了网站所有这些方面是如何结合在一起的，特别是 HTML 和样式信息（又被称为 CSS）。你不会成为设计专家，但你将熟悉\
  \ CSS，并学习如何利用 Visual Studio 工具让处理 CSS 变得更容易。你还将制定示例应用程序的整体设计，并回顾用于构建样式字典的可用策略。\n\
  \n## HTML 和 CSS\n\n第 1 章 讨论了 HTML 并解释了它是如何作为默认默认语言，旨在为内容提供上下文——特别是作为最新版本的 HTML5。早版本的\
  \ HTML 支持某些特定的样式元素，这些元素允许对屏幕上的呈现进行某些控制。例如，有一个名为 `font` 的元素用于控制元素内包含的文本的尺寸、颜色和字体：\n\
  \n```\n<font color=\"purple\" face=\"verdana\" size=\"4\">\n    I am large purple\
  \ text\n</font>\n```\n\n虽然这类标签让你具备了某些控制页面外观和视觉效果的能力，但它们有一个主要的局限性特征：它们都嵌入在 HTML 中，且不灵活。例如，假设你想将所有“大号紫色文本”改为“中号橙色文本”。你必须手动编辑每个使用该文本的页面，更改每一个实例。这意味着即使是设计上微小的变化也可能是耗时且危险的，因为每个页面可能都需要一些更改。这就是\
  \ CSS 诞生的原因；它提供了一种更健壮、更强大的设计管理方法。\n\n### 为什么要同时使用 HTML 和 CSS？\n\nHTML 是标记语言，这正是它最擅长的领域。HTML\
  \ 在帮助你识别、划分和标记内容方面做得很好，但对于控制内容的外观作用很小。你可以通过 图 3.1 亲自证实这一点，该图显示了列表 3.1 所示传统 HTML\
  \ 的浏览器渲染效果。\n\n![浏览器窗口中未应用任何 CSS 样式渲染的 HTML 截图，文本为“ASP.NET from Wrox”、输入电子邮件注册的选项以及保存电子邮件按钮。\
  \ ](img/c03f001.jpg)\n\n**图 3.1** 无任何 CSS 样式的 HTML\n\n如你在图中所示，内容上几乎没有应用任何样式。选择了一些默认字体，不同层级的标题提供了不同的字体大小，但所有内容都显示为纯白色背景上的纯黑色字体。\n\
  \nCSS 让你能够对内容的呈现实施得更好的控制。只需添加 21 行 CSS 代码（包括空格），就会产生截然不同的效果，尽管你会在 图 3.2 中看不到完整效果，因为它没有显示你添加的颜色。实现此效果的\
  \ CSS 代码如列表 3.2 所示，添加在 `<body>` 标签下方。\n\n![浏览器窗口中带有颜色的 HTML 渲染截图，背景为金色，并带有一些绿色选项。](img/c03f002.jpg)\n\
  \n**图 3.2** 添加了一些简单样式的 HTML\n\n诚然，此页面可能还不够吸引力，但它有效地演示了少量的 CSS 如何更改页面的外观，以及这种样式与旧的\
  \ HTML 样式方法的区别。\n\n你将在本章稍后部分详细详细介绍这一点，但列表 3.2 中的样式代码做了两件事：第一，它设置了页面上每个 `<body>`、`<header>`、`<ul>`\
  \ 和 `<ol>` 元素的默认外观。第二，它设置了名为“button”的特定样式外观。考虑这为你之前提到的 `<font>` 元素提供的控制级别。你不需要找到并更改每一个受影响的元素，而是可以更改一个实例，让它影响（或级联到）所有适用元素。CSS\
  \ 提供了一种优雅的方式来抽象网站外观和视觉效果的控制。\n\n结合 HTML 和 CSS 允许你将内容与其显示分离。就像 Web Forms 和 ASP.NET\
  \ MVC 在显示信息和创建信息方面都提供了某些关注点分离一样，CSS 和 HTML 允许将页面上内容的定义和显示分离；它基本上在 UI 内部本身提供了额外的关注点分离。换句话说，HTML\
  \ 告诉浏览器应该显示*什么*，而 CSS 定义了它应该*如何*显示。\n\n### CSS 简介\n\n如果你将 CSS 看作一门独立的语言，你会发现它相对容易学习；每个概念本身都非常直观且清晰。然而，变得复杂的是语言元素之间如何相互作用，以及如何使用特定方法来解决问题。\n\
  \n我们将从让你为网站添加一些样式开始。在接下来的练习中，你将为网站添加新页面，然后为该页面添加内容和样式。在此过程中，你将学习你操作的不同方面。\n\n##\
  \ 更多 CSS\n\n你刚刚看到了样式如何影响 HTML 代码的外观和视觉效果。在本节中，你将检查样式的各个并学习每个部分的含义，包括它如何定义应该应用于什么类型的内容，以及应该应用什么样的样式。选择器定义了被样式化的元素与应用样式之间的关系。\n\
  \n#### 选择器\n\n首先考虑你之前添加的样式之一：\n\n```\nh1 {\n    color: red;\n    font-size: 26px;\n\
  }\n```\n\n整个前面的片段被称为规则（rule）。`h1` 是规则的选择器，因为它定义了规则应该应用于什么。这是浏览器确定哪些元素应该向该元素的内容分配样式的方式。你可以在规则中包含多个选择器。规则中可以包含的选择器数量没有有效限制。如后续片段所示修改规则创建了一个此规则将应用于这些项组：\n\
  \n```\nh1, h2 {\n    color: red;\n    font-size: 26px;\n}\n```\n\n因此，在多个选择器之间添加逗号意味着浏览器将选择器组解释为“或”。在前面的例子中，如果浏览器正在创建的元素是“h1”元素或“h2”元素，它将应用此规则。\n\
  \n你也可以用空格分隔选择器，如下所示：\n\n```\nh1 .special {\n    color: black;\n    font-size: 16px;\n\
  }\n```\n\n\n\n\n\n正如你可能猜到的那样，这暗示了这两种选择器之间的关系与使用逗号有所不同。逗号表示选择器之间的“或”（OR）关系，而空格则表示“和”（AND）关系。这意味着这些规则仅应用于那些同时满足列表中所有选择器的元素。此外，使用空格表示这些选择器具有继承关系——因此，`h1\
  \ .special` 意味着样式将应用于类名为 `.special` 的元素内部的内容，且该元素本身也包含在一个 `h1` 元素之中。这个概念可能会让人困惑，但在本章后面的部分将提供更多详细信息。使用空格连接在一起以表示“和”关系的选择器数量是没有限制的。\n\
  \n你也可以同时使用这两种方法，如下所示：\n\n```\nh1, h2 .special {\n    color: black;\n    font-size:\
  \ 16px;\n}\n```\n\n前面的代码段将导致浏览器将规则应用于匹配 `h1` 选择器的元素，或者应用于同时满足 `h2` 和 `.special`\
  \ 选择器的元素。\n\n### 类型选择器 (Type Selector)\n\n如前所示，上一个示例中使用的规则应用于页面上所有的 `h1` HTML 元素，并且将应用于页面上此种类型的每一个元素。这种选择器被称为`类型选择器`（type\
  \ selector），因为它专门适用于 HTML 元素。此外，由于 HTML 元素是不区分大小写的，因此类型选择器也不不区分大小写。\n\n如果你将一个类型选择器与另一个选择器分组，浏览器会将该样式应用于所有同时匹配其他选择器（s）的该类型元素。\n\
  \n### 类选择器 (Class Selector)\n\n在前面的示例中，你有一个以点开头的选择器——`.special`。这种选择器是`类选择器`（class\
  \ selector），它与类型选择器的区别在于，它应用于每一个标记有该类的元素，无论该元素的类型为何。\n\n接下来的规则集将使被选中的元素变为红色：\n\n\
  ```\n.special {\n    color: red;\n}\n```\n\n浏览器能够确定合适的样式，因为 HTML 样式的 `class` 属性被设置为与规则集选择器相同的值。接下来的示例的第一行将句子的某部分变为红色：\n\
  \n```\nI am not red text <span class='special'>but I am</span>.\n<h1>I am not a\
  \ red header</h1>\n<h1 class='special'>But I am a red header</h1>\n```\n\n前面代码段的第二部分显示了类选择器如何独立于元素类型，因为第一部分的\
  \ span 和第二部分的 header 均匹配该规则，因此内容在浏览器中将以红色文本的形式显示。\n\n类选择器与类型选择器的不同点还在于它是区分大小写的：你在规则中作为选择器输入的文本必须与元素的类值完全匹配。\n\
  \n### ID 选择器 (Id Selector)\n\n类型选择器引用的是 HTML 元素，而类选择器链接到 HTML 元素中的 `class` 属性，那么\
  \ id 选择器引用的是 HTML 元素的 `id` 属性。Id 选择器使用哈希符号（#`）创建：\n\n```\n#mainArticle {\n    color:\
  \ red;\n}\n```\n\n与类选择器一样，id 选择器也是区分大小写的；你必须在规则集和元素的 `id` 属性中具有相同的值，浏览器才会应用该样式。\n\
  \n### 通用选择器 (Universal Selector)\n\n到为止描述的所有选择器都应用于 HTML 元素的特定方面。类型选择器引用 HTML 元素名称；类选择器是对\
  \ `class` 属性中值的引用；而 id 选择器是对元素 `id` 属性中值的引用。如下例所示，通用选择器适用于页面上的每一个元素，无论其类型、类或 id：\n\
  \n```\n* {\n    color: red;\n}\n```\n\n通用选择器是一个简单的星号：`*`。通用选择器不需要任何指定文本，因为它适用于页面上的每一个元素。\n\
  \n### 关于分组选择器的更多信息\n\n本章之前讨论了如何使用空格或逗号为规则集对选择器分组。使用逗号的作用等于“或”逻辑，因此匹配任何一个选择器的任何元素都将应用该样式。使用空格意味着该元素必须匹配包含的所有选择器。本节将更深入地探讨其工作原理，以及它将如何影响选择结果。\n\
  \n检查以下规则：\n\n```\np .special {\n    color: blue;\n    font-size: 50px;\n}\n```\n\
  \n在这里，两个选择器之间缺少逗号，意味着一个元素既必须位于 `<p>` 元素内部，又必须包含于一个 `class` 属性设置为 `special` 的元素之中。然而，这种方法是通过继承管理的，而不是通过一个类型为\
  \ `<p>` 且带有 `special` 类的元素。由于空格意味着继承，以下代码的解释方式将不同：\n\n```\n<p class=\"special\"\
  >Hey, I am not styled.</p>\n<p>But, <span class=\"special\">I am</span> because\
  \ I am inherited.</p>\n```\n\n相反，当应用 `p .special` 规则时，它的看起来类似于图 3.7。\n\n![浏览器中渲染的\
  \ HTML 截图，带有 CSS 中的继承效果，且文本 \"I am\" 是蓝色的，字体比其他文本大。](img/c03f007.jpg)\n\n图 3.7 CSS\
  \ 中的继承**\n\n正如你所见，空格的存在表示继承。在此处，你可能想知道是否有一种方法可以做到这一点。\n\n省略空格会发生什么？如果多个选择器一起显示而没有空格，浏览器将寻找在同一个元素内同时两个条件的元素。因此，为了样式\
  \ `.special` `<p>` 元素，将需要使用如下选择器的规则：\n\n```\np.special {\n    color: purple;\n \
  \   font-size: 45px;\n}\n```\n\n此规则将应用于每一个类型为 `<p>` 且具有 `special` 类的元素。你可以根据需要链接多个选择器，只要每种类型的选择器不超过一个。这意味着像\
  \ `p.special.extraspecial` 这样的选择器不应使用，因为它暗示该元素被分配了多个类。使用 `p.special#extraspecial`\
  \ 的规则更有意义，因为它寻找所有类型为 `<p>`、具有 `special` 类且 `id` 属性设置为 `extraspecial` 的 HTML 元素。\n\
  \n#### 属性 (Properties)\n\n你已经了解了规则集如何选择应应用样式的元素，因此本节更详细地描述了可以使用样式信息本身做什么。表 3.1 描述了\
  \ CSS 属性。\n\n| 属性 | 描述 |\n| :--- | :--- |\n| `background` | 该属性设置元素的背景信息。由于这是一个父属性，你可以在同一行内放置背景的所有不同值。例如：`background:\
  \ black url(\"smiley.gif\") no-repeat fixed center;` |\n| `background-color` | 仅设置背景颜色。背景的其他部分可以单独设置，包括图像、位置、重复模式、起源和尺寸。例如：`background-color:\
  \ rgb(255,0,255);` |\n| `border` | 在元素周围创建框。像背景一样，border 是一个父属性，允许你在单个命令中设置许多不同的子属性。例如：`Border:\
  \ 5px solid red;` |\n\n\n\n\n\n| border-bottom | “-bottom”表示这是一个设置边框底部的子属性。其他选项包括\
  \ left（左）、right（右）和 top（上）；你甚至可以使用 bottom-color 为每个侧设置不同的颜色。设置 border-bottom 的示例：`border-bottom:\
  \ thick dotted #ff0000;` |\n| display | 定义 HTML 元素的框类型。display 有多个可用值，其中最常见的如下：Block\
  \ (块级): 将元素作为块级元素显示，例如 `<p>` 元素。Inline (内联): 默认值，将元素作为内联元素显示；例如 `<span>` 的默认行为。Inline-block:\
  \ 块的内部被格式化为块级框，而整个元素本身被格式化为内联级框。None: 元素将完全不显示。对布局没有影响；且不保留空间。 |\n| font | 设置应用于元素内容的字体。例如：`font:\
  \ italic bold 12px/30px Georgia, serif;` |\n| height | 定义赋予元素内容的高度。它设置元素内边距（padding）、边框（border）和外边距（margin）内部区域的高度。例如：`height:\
  \ 100px;` |\n| left | 当元素进行绝对定位（稍后会详细介绍）时，`left`属性将元素的左边缘设置为容器元素左边缘的右侧。否则，`left`属性将元素的左边缘设置为其正常位置的左侧。例如：`left:\
  \ 5px;` |\n| margin | 设置元素周围的外边距。下文更多。 |\n| padding | 设置元素周围的内边距。下文更多。 |\n| position\
  \ | 指定元素使用的定位类型：static (静态): 默认值；元素按照在文档流中出现的顺序渲染。absolute (绝对):元素相对于第一个定位的（非静态）祖先元素进行定位。fixed\
  \ (固定):元素相对于浏览器窗口进行定位。relative (相对):元素相对于其正常位置进行定位。例如，`left: 25px` 将元素元素其正常位置向左移动\
  \ 25 像素。 |\n| text-align | 指定元素内文本的水平对齐方式。例如：`text-align: center;` |\n| text-decoration\
  \ | none: 定义元素为普通文本。这是默认值。underline: 定义带有下划线的文本。overline: 定义文本上方的线条。line-through:\
  \ 定义带有删除线的文本 |\n| visibility | 决定元素是否可见；如果不可见，浏览器会为其预留空间 |\n\n### 表 3.1 (#c03.xhtml_c03-tbl-anc-0001)\
  \ CSS 属性\n\n前一个表格中的几项需要结合来看。这些是 padding（内边距）、border（边框）和 margin（外边距）属性，它们共同作用以管理元素内部内容的布局。\n\
  \n图 3.8 显示了所有部分是如何工作的。深色部分是元素，而周围的每一层展示了其他项目。padding 是紧邻元素的区域。如果一个项目同时具有内边距和边框，那么内边距定义了元素边缘与边框之间的距离。如果你添加了\
  \ margin，你就是定义了边框与周围元素之间的距离。换句话说，padding 扩展了元素的外部边界，而 margin 定义了元素外部边界与相邻元素之间的空间。\n\
  \n![四个嵌套面积递减的矩形示意图，从最外到最内分别标记为 Padding、Border、Margin 和 Element。](img/c03f008.jpg)\n\
  \n### 图 3.8 (#c03.xhtml_c03-fig-anc-0008) 内边距、边框和外边距\n\n为了理解这在 HTML 中是如何实现的，请考虑以下包含样式代码和\
  \ HTML 的片段：\n\n```css\n<style type=\"text/css\">\n    .innerelement {\n        border:\
  \ 5px solid black;\n        background-color: yellow;\n        width: 200px;\n \
  \       padding: 50px;\n        margin: 100px;\n    }\n    .outerelement {\n   \
  \     border: 5px solid red;\n        background-color: green;\n        width: 200px;\n\
  \    }\n</style>\n<div class=\"outerelement\">\n    <div class=\"innerelement\"\
  >\n        content\n    </div>\n</div>\n```\n\n此片段在浏览器中的显示将如 图 3.9 所示，但请记住，黑白图像并不能真实演示你在屏幕上应该看到的颜色，它将以彩色显示。\n\
  \n![渲染的 HTML 示意图，带有 padding、margin 和宽度。箭头标记了 innerelement 的 margin、padding、width\
  \ 以及 outerelement 的 width。](img/c03f009.jpg)\n\n### 图 3.9 (#c03.xhtml_c03-fig-anc-0009)\
  \ 带有内边距、外边距和宽度的渲染 HTML\n\n图 3.9 阐述了关于样式的的一些有趣点。“content”和第一行之间的紧邻空间是 padding。该第一行与左侧、顶部和底部之间的空间是\
  \ margin。注意 margin 和 padding 如何影响元素的宽度。虽然两个元素（`innerelement` 和 `outerelement`）具有相同的宽度，由于\
  \ padding 的存在，内部元素明显更宽。padding 扩展了元素内容的宽度，而 margin 反而将其扩展到元素之外。\n\n图 3.9 还展示了样式的另一个方面——某些属性的绝对性。尽管内部元素嵌套在外部元素内部，外部元素的宽度仍为\
  \ 200px。内部元素的总宽度为 510 像素，这是通过结合 200px 宽度、50px 左内边距、50px 右内边距、5px 左边框、5px 右边框、100px\
  \ 左外边距和 100px 右外边距得出的。\n\n#### 样式优先级\n\n你已经看到一些说明样式如何相互影响的示例。这是一个重要的概念，因为嵌套和相邻元素的样式相互作用并影响其他元素的显示。这意味着当元素显示不预期时，可能是由于相邻、包含或被元素的样式。因此，对优先级的基础理解可以避免一些样式上的困扰。\n\
  \n典型的优先级考虑了多个因素。其中一个因素是样式的来源。样式有三个主要的来源：\n\n- **Author (作者)**：网站作者提供的样式，例如你创建的样式。\n\
  - **User (用户)**：用户创建的样式，而默认样式是浏览器内置的。\n- **Default (默认)**：浏览器内置的样式，在没有其他样式时作为样式使用。这可能根据浏览器而不同。\n\
  \n当浏览器确定如何渲染内容时，初始特殊性按以下规则计算：\n\n1. 找到所有同时适用于元素和正在解析的显示属性的样式赋值。\n2. 按照来源和权重进行排序。之前讨论过来源，而权重指的是声明的重要性。权重的计算遵循相同的顺序（作者、然后是用户、最后是默认），但它还考虑了一些可以添加到样式中的特殊标签。\n\
  3. 浏览器随后计算特异性。\n\n\n\n\n4.  如果上述所有规则中任何两条规则都相等，则后声明的规则具有优先级。这意味着嵌入在 HTML 中的 CSS\
  \ 始终遵循任何声明的页面样式（如目前为止包含在 `<head>` 元素中的样式），而这优于外部样式表（你将在本章稍后部分要的操作）。\n\n第三步计算特异性（specificity）比看起来要复杂。在最简单的层面，ID（id）比类（class）优先级更高，而类又比元素（element）优先级更高。然而，事实并非如此简单。查看以下代码段：\n\
  \n```\ndiv p.special {color: red;}\n#superspecial p {color: purple}\n<div id=\"\
  superspecial\">\n <p class=\"special\">Content</p>\n</div>\n```\n\n你认为内容会是什么颜色？当你查看第一种样式时，你会发现它是针对\
  \ `<div>` 元素内部的带有 `special` 类的段落元素。这很好地描述了 HTML 代码，不是吗？第二种样式似乎也匹配 HTML 代码，因为它选择了包含\
  \ ID 为 `superspecial` 的元素内的段落元素。内容是红色的还是紫色的？你可能会对答案感到惊讶：内容将是紫色的。\n\n这可能看起来违背直觉，因为第一种样式仅仅结合了元素匹配和类匹配，而且正确类型元素内的嵌套看起来非常直观。然而，由于第二种样式是根据父元素的\
  \ ID 匹配的，它击胜了第一种样式。\n\n如果你从第二行中删除 `p`，你认为会发生什么？包含元素中 ID 的特异性仍然覆盖第一种样式吗？在这种情况下，你会发现内容将以红色显示。发生这种情况是因为在删除段落引用后，第一种样式中对精确元素的识别比第二种样式具有更高的特异性。然而，如果完全删除第一种样式，内容将再次由于宿主元素的继承而以紫色显示。\n\
  \n理解优先级需要通过实践来掌握。理解优先级计算最简单的方法是查看输出。Visual Studio 允许你同时查看设计和输出；不要犹豫利用这一点来查看你的样式与\
  \ HTML 之间的完整交互。\n\n## 样式表 (The Style Sheet)\n\n你已经完成了样式的第一次工作，但随着开发的进行，这将不是你样式化应用程序的方法。虽然这种方法比使用\
  \ HTML 样式高效得多（因为你可以将所有样式放在页面上的一个位置，并允许它们在该页面的任何地方使用），但也意味着如果你想让不同的页面具有相同的样式，你就必须将样式复制到每个页面中。因此，如果你想更改这些样式，就必须遍历每个页面并更新它们。虽然这绝对比需要修饰页面上的每个元素要好，但仍然容易出错。\n\
  \n这就是级联样式表（Cascading Style Sheets）中“表（sheet）”发挥作用的地方。你可以将所有样式放入单个页面中，然后将该包含样式的页面链接到每个将使用它的页面。这意味着你网站中的所有页面（如果设置正确）都将能够使用同一组样式。有了这种功能，更改整个网站的样式变得非常简单，因为你只需要处理一个文件，而不是每个页面上的一个区域。\n\
  \n### 为你的页面添加 CSS\n\n你已经学习了如何使用 `<style>` 元素为页面添加 CSS 样式，以及该元素如何定义元素内部的内容为样式定义。接要学习的是如何添加一个包含样式的独立文件，然后让你的内容页面使用这些样式进行显示。\n\
  \n将你的页面链接到 CSS 样式表非常简单。假设你有一个名为 `styles.css` 的样式表，你可以在 HTML 页的 `<head>` 部分添加以下行：\n\
  \n```\n<link href=\"#styles.css\" rel=\"Stylesheet\" type=\"text/css\" media=\"\
  screen\"/>\n```\n\n`<link>` 元素告诉浏览器在属性中标识的信息应该链接到页面。`href` 属性告诉浏览器应该链接哪个外部文件，这至关重要，因为使用\
  \ `<link>` 元素意味着附加了外部引用。`rel` 属性通过定义其关系为文件提供上下文。在这种情况下，外部文件是一个样式表。该属性的其他值包括 `help`、`icon`、`author`、`license`\
  \ 以及许多其他关系。\n\n`type` 属性用于定义文件包含的内容类型。你需要的最后一个属性是 `media`。该属性定义了查看文档的媒体类型。其他媒体类型包括\
  \ `mobile` 和 `print`。\n\n### 创建嵌入和内联样式表\n\n样式表有三种：\n\n*   外部 (External)\n*   嵌入的\
  \ (Embedded)\n*   内联的 (Inline)\n\n你对前两种已经熟悉了。你刚刚完成了将一个嵌入样式表（将样式放在页面的 `<head>` 部分）转换为外部样式表。最后一种尚未涵盖的是内联样式。内联样式是与显示元素最近的样式，因为它实际上是元素本身的一部分。\n\
  \n所有支持内容的 HTML 元素都有一个 `style` 属性，允许你添加样式。使用此属性，你可以将任何 CSS 属性直接添加到元素中。这是一个示例：\n\n\
  ```\n<div style=\"color:blue;margin:30px;\">This is an inline style.</div>\n```\n\
  \n赋值规则与外部或嵌入样式相同；每个样式都有一个属性名和一个值，用冒号分隔，分号表示该属性声明的结束。你可以在 `style` 属性中添加任意数量的 CSS\
  \ 属性。\n\n这种方法的维护比原始 HTML 元素困难，但你可能会遇到需要对元素进行最终覆盖的情况，这是实现该目标的唯一方法。\n\n如果你记得之前学的优先级规则，样式距离渲染元素越近，优先级越高。这意味着元素\
  \ `style` 属性中的任何内容将自动应用，覆盖继承链中更高处设置的任何属性。\n\n## 应用样式\n\n到目前为止，你通过手动创建和应用样式来理解它们是如何工作的。然而，Visual\
  \ Studio 的设计目的是为了加速开发，因此提供了许多内置工具来帮助你样式化应用程序。你到目前为止所做的所有工作都在源窗口中进行，之后你在设计窗口中查看渲染输出。现在你将开始在设计窗口中进行工作，学习如何利用\
  \ Visual Studio 对 CSS 样式表的支持来构建样式。\n\n## 管理样式\n\n你获得了许多关于创建和维护样式的信息，但对于可重用且利用继承等\
  \ CSS 能力的策略较少。你现在将学习这些。\n\n在开始考虑样式这样细粒度的问题之前，你必须考虑网站的整体设计。首先，确定示例应用程序的整体外观和感受。这让你在开始添加内容时了解如何构建你的样式。\n\
  \n示例应用程序是一个图书馆，它有一系列相对的需求，这些需求在第 1 章 中讨论过。需要以下页面视图：\n\n\n\n\n*   所有可借阅物品的默认视图。你将此设置为默认主页，即任何人访问网站时看到的第一个页面。\n\
  *   管理员用于添加新物品的特殊视图。这需要包含一个物品列表，用户可以从该列表中选择某一个物品进行编辑，也可以添加新物品。\n*   一个注册页面。\n* \
  \  结账页面，显示用户确定想要从图书馆借阅的物品。\n\n其他要求还包括你在构建和设计网站时需要管理的实现细节。第一个关注区域将是主页。你知道需要一个可借阅物品的列表。当你考虑主页的需求以及支持登录和注册的要求时，你知道在该页面上包含的不仅仅是一个物品列表。这些考虑可能会导致主页的简化视图，其外观看起来类似于图\
  \ 3.21 所示。\n\n![示例应用程序主页图，包含五个不同区域：顶部的 Logo 区域、菜单区域、信息文本区域、下方的物品列表区域，以及嵌入在信息文本区域中的登录区域。](img/c03f021.jpg)\n\
  \n图 3.21 示例应用程序主页简单设计\n\n你将构建此页面的五个不同区域：\n\n*   Logo 区域，你将在此处进行网站品牌设计\n*   菜单区域，允许访问者进入网站的不同区域。\n\
  *   登录区域，它是特殊的，因为它包含了允许用户登录应用程序所需的字段——在这种情况下，是电子邮件地址和密码。\n*   信息文本区域。由于此页面将是所有网站访问者的默认页面，你需要向新用户提供有关服务的信息以及如何操作的说明，无论是通过注册还是登录网站。\n\
  *   产品区域，这是唯一直接属于要求的区域：可借阅的产品列表。该列表将由多张图片和文本组成，因此需要进一步的讨论。图 3.22 显示了你将用于显示物品的简单设计![简单的产品物品列表图，包含三个产品的图片、产品名称区域和产品文本区域。](img/c03f022.jpg)\n\
  \n图 3.22 产品列表简单设计\n\n产品区域中的每个物品都包含以下元素：\n\n*   标题\n*   描述性文本\n*   一张或多张物品图片，以及用户查看每张图片的能力\n\
  \n你现在将这些整合在一起，并查看创建样式表会产生什么潜在影响。图 3.23 说明了当你制定形成样式方法时，这些区域是如何相互作用的。\n\n![主页初始样式方法的图，箭头指向菜单文本样式、输入框样式和输入按钮样式。](img/c03f023.jpg)\n\
  \n图 3.23 主页初始样式方法\n\n每个高级项目现在都进一步细分，并确定了每个初始样式。下一个要考虑的问题是是否存在任何复用。例如，你是否希望为信息文本使用与产品文本相同的视觉文本显示？你是否希望输入标签（用户界面将有如“电子邮件地址”和“密码”之类的标签）与产品文本相同，但与信息文本不同？这些都是你在制定设计时需要考虑的因素。\n\
  \n对于此设计，将做出以下排版假设：\n\n1.  所有标题将使用相同的字体，无论它是信息标题还是产品标题。然而，不同类型的标题大小会有不同。\n2.  正文将使用相同的字体，无论是信息还是产品文本，但此字体将与标题字体不同。这两项的字体大小也将相同。\n\
  3.  输入标签字体将与正文不同，但大小保持不变。\n\n在这些规则的基础上，你将在下面的“尝试一下”（Try It Out）中创建应用程序主页的初始框架。\n\
  \n## 总结\n\n当 HTML 出现时，管理网站的外观和感觉是复杂的，因为样式是由另一个 HTML 元素提供的。该系统的主要问题之一是对应对设计的任何更改都需要传播到每个元素中。这使得更新和更改难以管理。随着越来越多的人访问互联网并开始访问网站，用户体验变得越来越重要。这导致了级联样式表（CSS）的发展，这种技术允许将设计信息与内容分离，从而能够两者进行单独维护。它包含了选择器的概念，这是一种基于易理解的关系指定可以应用于多个内容部分的单一规则集的方法。\n\
  \nCSS 的关键是样式，或者一组应用于 HTML 元素的视觉和交互规则。\n\nVisual Studio 提供了多种不同的方式来帮助你构建、应用和管理样式，特别是当你在设计模式下工作时，它可以提供关于更改的即时反馈，并为可视化内容提供多种选项。\n\
  \n\n\n\n\n| 术语 | 说明 |\n| :--- | :--- |\n| **样式优先级 (Precedence in Styles)** | 浏览器在确定应将哪些样式应用于\
  \ HTML 元素时采用的方法。标识越具体，该样式的优先级越高。优先级适用于属性级别，因此不同的属性可能会有不同的优先级。 |\n| **嵌入式样式 (Embedded\
  \ Styles)** | 定义在 HTML 页面头部的样式，而不是通过链接的样式表定义的样式。 |\n| **内联样式 (Inline Styles)** |\
  \ 直接放在 HTML 元素上的样式。这些样式不需要选择器，因为它们仅适用于与选择器中名称匹配的元素类型。 |\n| **设计模式 (Design Mode)**\
  \ | Visual Studio 中的一个窗口，像在浏览器中一样显示工作页面。它允许用户执行各种设计任务，包括创建和分配样式以及移动内容。 |\n| **源代码模式\
  \ (Source Mode)** | Visual Studio 中的一个窗口，显示构成页面的 HTML 代码。它不显示任何设计内容，而是允许设计人员直接对基础代码进行工作。\
  \ |\n| **分屏模式 (Split Mode)** | Visual Studio 中的一种模式，同时打开设计模式和源代码模式。在一个窗口中进行的更改会反映在另一个窗口中。\
  \ |\n\n# 第 4 章：C# 和 VB.NET 编程\n\n## 你将在本章中学习：\n* 理解数据类型和变量\n* 如何使用集合和数组处理信息列表\n\
  * 代码流、分支和循环\n* 如何分离代码以便于理解和维护\n* 面向对象编程简介\n\n### 本章代码下载：\n本章的 wrox.com 代码下载可以在 [www.wrox.com/go/beginningaspnetforvisualstudio](http://www.wrox.com/go/beginningaspnetforvisualstudio)\
  \ 的“Download Code（下载代码）”选项卡中找到。代码位于第 04 章下载中，并根据整个章节中的名称进行单独命名。\n\n现在，你已经花了一些时间在网站的设计部分，现在是考虑如何处理编程部分了，让你的\
  \ Web 应用程序能够执行一些改变颜色之外的操作。编写 Web 应用程序有许多不同的方面。本章将为你以后构建示例应用程序时，开始深入研究 ASP.NET 的不同部分提供所需的基础。本章涵盖的结构和方法对于你未来可能从事的每一个\
  \ `C#` 或 `VB` 应用程序都非常有用。\n\n## 编程简介\n每个应用程序都可以定义为一种完成任务的方法。你的应用程序可能会播放音乐、处理公司的客户注册、帮助用户选择油漆房屋的颜色，或任何其他事情。当你考虑应用程序可以执行的所有事情时，可能看起来有些无从从，但将应用程序分解为它的组成部分可以帮助你意识到，无论最终用途如何，所有应用程序都有共同点。\n\
  \n这些共同点中的一些与系统如何解释信息和做出决策有关。因为每个应用程序都遵循某种过程，所以必须做出其中一个或多个决策。然而，在你的系统做出决策之前，它需要一些可以依据的东西，即包含可以作为应用程序决策标准的信息。你做出决策的这些东西被称为`数据类型`和`变量`。\n\
  \n### 数据类型和变量\n数据类型提供了一种识别和分组应用程序需要理解的各种信息（或数据）的方法。`.NET` 设计师经历了定义这些可用基础类型的练习，因为这些类型决定了定义不同类型数据的规则、它们如何相互作用、如何在内存中存储，以及在应用程序中可以对它们做什么。它们被认为是基础类型，是因为它们不能进一步拆分；它们是最低单位。变量是值的容器。考虑一个值，例如一个带有半径的圆。你可以将\
  \ `radius` 视为一个已知将具有数值值（或数据类型）的变量。\n\n#### 定义变量\n类型在 `C#` 和 `VB` 中的重要性不言而喻；两者都被认为是类型安全的语言，这意味着对象的类型在编译时必须已知（有少数例外），否则应用程序将无法编译，更不用运行了。你通过声明或定义变量来告诉编译器它将处理的数据类型。将变量想象作你数据的容器。你希望为变量起一个在程序语境中具有意义的名称，并在整个程序中一致使用该名称。\n\
  \n在接下来的示例中，你声明了一个变量来存储 `byte`（一种定义值为 0 到 255 之间的整数的数据类型）以及一个 `string`（一种持有文本的数据类型）：\n\
  \n##### C#\n```cs\n// 声明我们代表特定项目库存数量的变量\nbyte quantityInStock;\n// 声明我们代表物品名称的字符串\n\
  string itemName;\n```\n\n##### VB\n```vb\n' 声明我们代表特定项目库存数量的变量\nDim quantityInStock\
  \ As Byte\n' 声明我们代表物品名称的字符串\nDim itemName As String\n```\n\n此示例展示了两种语言在创建变量和分配类型之间的不同方法。在\
  \ `C#` 中，你通过说明其类型和名称来声明变量。在 `VB` 中，你必须用关键字 `Dim` 开始声明，随后是变量名，然后是 `As`，最后是数据类型。注意\
  \ `C#` 代码要求你使用分号（`;`）指示命令结束。`VB` 没有此要求。\n\n此外，示例中的变量名称让你对它们包含什么类型的信息有一个了解。你可以很容易地给这些变量起无意义的名称，如\
  \ \"a\" 或 \"zz\"，但这将剥夺它们的上下文；一眼变量并理解其包含的内容对于保持代码的可维护性很重要。\n\n示例中的其他行是注释。代码代码行并不是应用程序的一部分，而是允许开发者插入备注或其他信息。我们将在本章后面详细介绍注释。\n\
  \n你可以将前面的方法更进一步，并实际上为变量赋值。因此，你不仅创建了一个特定类型的变量，还给它赋了一个值，如下例所示：\n\n##### C#\n```cs\n\
  // 声明我们带有初始值的变量\nbyte quantityInStock = 5;\n// 声明我们带有初始值的字符串\nstring itemName =\
  \ \"Electric Nail Gun\";\n```\n\n##### VB\n```vb\n' 声明我们带有初始值的变量\nDim quantityInStock\
  \ As Byte = 5\n' 声明我们带有初始值的字符串\nDim itemName As String = \"Electric Nail Gun\"\n\
  ```\n\n虽然此示例显示声明和赋值在同一行，但并不是强制要求的。可以将它们拆分成几行，如下：\n\n##### C#\n```cs\n// 声明我们带有初始值的变量\n\
  byte quantityInStock;\n// 声明我们带有初始值的字符串\nstring itemName;\n// 在这里我们做了很多工作来理清所有信息\n\
  quantityInStock = 5;\nitemName = \"Electric Nail Gun\";\n```\n\n##### VB\n```vb\n\
  ' 声明我们带有初始值的变量\nDim quantityInStock As Byte\n' 声明我们带有初始值的字符串\nDim itemName As String\n\
  ' 在这里我们做了很多工作来理清所有信息\nquantityInStock = 5\nitemName = \"Electric Nail Gun\"\n```\n\
  \n\n\n\n\n```]\n\n注意变量的名称如何帮助你理解它包含什么信息；这允许你根据需要从实际赋值之外声明变量。随着示例应用程序的进行，你将看到这种做法是多么常见。\n\
  \n表 4.1 包含了 .NET 中最常见数据类型的简要列表。这只是一个极小的子集；仅 .NET Framework 本就有数千种可用数据类型，更不用说你创建的任何自定义类型。\n\
  \n| C# 数据类型 | VB 数据类型 | 描述 |\n| :--- | :--- | :--- |\n| `byte` | `Byte` | 字节用于存储\
  \ 0 到 255 之间的小型正整数。未设置值时默认值为 0。 |\n| `short` | `Short` | 16 位存储，存储于 –32,768 到 32,767\
  \ 之间的整数。默认值为 0。 |\n| `int` | `Integer` | 32 位存储，存储于 –2,147,483,648 到 2,147,483,647\
  \ 之间的整数。默认值为 0。 |\n| `long` | `Long` | 64 位存储，存储于 –9,223,372,036,854,808 到 9,223,372,036,854,807\
  \ 之间的整数。默认值为 0。 |\n| `float` | `Single` | 存储 –3.4028235E+38 到 3.4028235E+38 之间的大数字。这些数字可能包含小数，float\
  \ 默认值为 0.0。设置 float 时，应使用指示符 float `x = 2.3f`；否则编译器会将该数字解释为 double。 |\n| `double`\
  \ | `Double` | 存储 64 位浮点值的类型，其近似范围在 ±5.0 × 10³²⁴ 到 ±1.7 × 10³⁰⁸ 之间，精度为 15–16 位。默认值为\
  \ 0。 |\n| `decimal` | `Decimal` | 小进制是一种 128 位数据类型。与浮点类型相比，decimal 类型具有更高的精度（28–29\
  \ 位）和更小的范围，这使其适用于财务和货币计算。 |\n| `bool` | `Boolean` | 用于存储简单的布尔值；true 或 false（VB 中为\
  \ True 或 False） |\n| `Datetime` | `Date` | 存储日期和时间值。默认值为 1/1/0001 12:00 a.m.。 |\n\
  | `char` | `Char` | 存储单个字符或 16 位 Unicode 表示。Unicode 字符用于表示世界上大多数书写语言。默认值为 null（VB\
  \ 中为 Nothing）。 |\n| `string` | `String` | 表示零个或多个 Unicode 字符序列。字符串是不可变的——在对象创建后，无法更改字符串对象的内容。默认值为\
  \ null（VB 中为 Nothing）。 |\n| `object` | `Object` | 所有类型（预定义和用户定义、引用类型和值类型）都直接或间接继承自\
  \ object（VB 中为 Object）。你可以将任何类型的值赋值给 object 类型变量。默认值为 null（VB 中为 Nothing）。 |\n\n\
  表 4.1 C# 和 VB.NET 中提供的可用数据类型。\n\n表 4.1 中的类型代表了一些系统类型或属于 .NET Framework 的类型。然而，你的应用程序中需要的所有内容并不都能放入可用类型中。你可能需要创建自己的自定义类型。自定义类型将在本章稍后部分介绍，但现在你只需要知道，它们提供了灵活性，可以创建任何帮助解决业务问题所需的数据容器。\n\
  \n## 运算符\n\n运算符提供了对项目（通常是变量）执行操作的能力。运算符有四种主要类型：\n\n* 算术\n* 字符串连接\n* 比较\n* 逻辑\n\n\
  本节涵盖了算术运算符和连接运算符。你将在本章稍后在讨论决策方法时学习比较运算符和逻辑运算符。\n\n### 算术运算符\n\n算术运算符是会对数字类型执行操作或计算的运算符，例如加法、减法、乘法和除法。表\
  \ 4.2 描述了这些运算符。\n\n| C# | VB | 定义 |\n| :--- | :--- | :--- |\n| `+` | `+` | 将一个值加另一个值\
  \ |\n| `–` | `–` | 从一个值中减去另一个 |\n| `*` | `*` | 两个值相乘 |\n| `/` | `/` | 将一个值除以另一个\
  \ |\n| n/a | `\\` | 将一个值除以另一个，始终返回四舍入后的整数 |\n| `Math.Pow(x,y)` | `^` | 将一个值升高另一个值的幂\
  \ |\n| `%` | `Mod` | 将一个值除以另一个，返回余数 |\n\n表 4.2 算术运算符。\n\n以下是使用运算符的示例：\n\n### C#\n\
  \n```\nint currentCount = 5;\nint availableStock = currentCount + 1;    // availableStock\
  \ = 6\nint availableStock = currentCount - 2;\n```\n\n### 字符串连接运算符\n\n算术运算符用于组合数值数据，而连接运算符用于组合字符串。这些运算符与算术运算符的区别在于没有乘除的概念。相反，它们只是字符串的组合。\n\
  \n连接运算符在 C# 中为 `+`，在 VB 中为 `&`。用法如下：\n\n#### C#\n\n```\nstring itemName = \"Electric\
  \ Gun\";\nstring itemColor = \"blue\";\nstring sentence = \"We have a \" + itemColor\
  \ + \" \" + itemName;\n```\n\n#### VB\n```vb\nDim itemName As String = \"Electric\
  \ Gun\"\nDim itemColor as String = \"blue\"\nDim sentence as String = \"We have\
  \ a \" & itemColor & \" \" & itemName\n\n通过连接多个变量创建一个完整的句子。注意，如果你在两个值之间需要空格，必须手动包含；否则系统会将第二个字符串直接附加到第一个后面。在\
  \ VB 中，连接运算符与算术运算符不同，但在 C# 中它们是相同的。\n\n## 数据类型的转换和强制转换\n\n有时你需要将一种数据类型转换为另一种。常见的场景之一是将值转换为字符串。这种转换是为了显示，因为通常网页上显示的唯一类型是字符串。当你看到显示“有\
  \ 5 把电钉枪”的页面时，你知道你在上一个示例中创建的字节类型变量已转换为字符串以便显示。\n\n### 转换类型\n\n将任何类型转换为字符串都非常简单——事实上，如果你在所有变量上都附加\
  \ `.ToString()`，你会发现它是可行的，因为这是每个类型内置的功能。这意味着以下代码可以工作：\n\n#### C#\n\n```csharp\n\
  // 声明变量并初始值\nbyte quantityInStock = 5;\n// 声明字符串初始值\nstring itemName = \"Electric\
  \ Nail Gun\";\n// 在这里正在进行大量工作，以确定所有信息\nstring sentence = \"There are \" + quantityInStock.ToString()\
  \ + \" \" + itemName;\n```\n\n\n\n\n\n```\n' 声明一个表示特定物品库存数量变量\nDim quantityInStock\
  \ As Byte = 5\n' 声明一个表示物品名称的字符串\nDim itemName As String = \"Electric Nail Gun\"\n\
  // 在这里正在进行大量工作，以便我们确定所有的信息\nDim sentence as String = \"There are \" & quantityInStock.ToString()\
  \ & itemName\n```\n\n如前面提到的，还有一些内置的自动转换。`+` 和 `&` 运算符（在各自的语言中）都起着将不同的字符串组合或相加单个字符串的作用，因此你可以创建出组合后的句子。然而，如果你使用以下方法，你的努力仍然会成功，因为在混合类型上使用这些运算符等同于将所有非字符串类型转换为字符串并组合它们：\n\
  \n##### `C#`\n\n```cs\n…\nstring sentence = \"There are \" + quantityInStock + itemName;\n\
  ```\n\n##### `VB`\n\n```vb\n…\nDim sentence as String = \"There are \" & quantityInStock\
  \ & itemName\n```\n\n当然，由于拼接是绝对的，`quantityInStock` 的字符串转换版本和 `itemName` 将直接紧挨在一起，中间没有空格分隔。\n\
  \n执行不同类型的转换需要不同的方法。这就是 `Convert` 类变得实用的地方；它将一种类型的数据转换为另一种类型的数据。它支持许多不同的转换，并且调用简单，如下所示：\n\
  \n##### `C#`\n\n```cs\nDateTime orderDate = Convert.ToDateTime(\"01/14/2015\");\n\
  ```\n\n##### `VB`\n\n```vb\nDim orderDate as DateTime = Convert.ToDateTime(\"01/14/2015\"\
  )\n```\n\n`Convert` 类支持许多不同的转换。前面的示例显示了从字符串值到 `DateTime` 的转换，但还有更多用法。表 4.3 描述了在转换\
  \ double 类型（VB 中为 `Double`）时可用的所有选项。\n\n| 调用 | 定义 |\n| :--- | :--- |\n| `ToDouble(Boolean)`\
  \ | 将指定的布尔值转换为等效的双精度浮点数 |\n| `ToDouble(Byte)` | 将指定的 8 位无符号整数的值转换为等效的双精度浮点数 |\n\
  | `ToDouble(Char)` | 调用此方法始终抛出 `InvalidCastException`，这意味着转换将失败。你将在第 17 章学习更多关于异常的知识\
  \ |\n| `ToDouble(DateTime)` | 调用此方法始终抛出 `InvalidCastException`。 |\n| `ToDouble(Decimal)`\
  \ | 将指定的数值转换为等效的双精度浮点数 |\n| `ToDouble(Double)` | 返回指定的双精度浮点数；不执行实际转换 |\n| `ToDouble(Int16)`\
  \ | 将指定的 16 位符号整数的值转换为等效的双精度浮点数 |\n| `ToDouble(Int32)` | 将指定的 32 位符号整数的值转换为等效的双精度浮点数\
  \ |\n| `ToDouble(Int64)` | 将指定的 64 位符号整数的值转换为等效的双精度浮点数 |\n| `ToDouble(Object)` |\
  \ 将指定对象的值转换为双精度浮点数 |\n| `ToDouble(SByte)` | 将指定的 8 位符号整数的值转换为等效的双精度浮点数 |\n| `ToDouble(Single)`\
  \ | 将指定的单精度浮点数的值转换为等效的双精度浮点数 |\n| `ToDouble(String)` | 将数字字符串表示转换为等效的双精度浮点数 |\n\
  | `ToDouble(UInt16)` | 将指定的 16 位无符号整数的值转换为等效的双精度浮点数 |\n| `ToDouble(UInt32)` | 将指定的\
  \ 32 位无符号整数的值转换为等效的双精度浮点数 |\n| `ToDouble(UInt64)` | 将指定的 64 位符号整数的值转换为等效的双精度浮点数\
  \ |\n\n**表 4.3**](#c04.xhtml_c04-tbl-anc-0003) `Convert.ToDouble()` 示例\n\n如你所见，有很多可以转换为\
  \ double 的不同类型；其中只有两种会自动失败。其他某些也可能失败，例如从字符串或对象，这取决于数据的实际内容。转换像“165.32”这样的字符串可以成功转换，而“I\
  \ am not a number-like string”则不能成功转换。\n\n我们讨论的第一种转换方法是 `ToString()`，它可以将任何类型的类型转换为字符串。你也可以尝试使用\
  \ `Parse` 方法将字符串转换为任何其他类型。以下示例显示了如何使用 `Parse` 方法。\n\n##### `C#`\n\n```cs\nDateTime\
  \ orderDate = DateTime.Parse(\"01/14/2015\");\n```\n\n##### `VB`\n\n```vb\nDim orderDate\
  \ as DateTime = DateTime.Parse(\"01/14/2015\")\n```\n\n当使用 `Parse` 方法时，对字符串使用 `Convert`\
  \ 方法的相同规则也适用；字符串值必须是被解析类型的表示。.NET 中的每种类型都有默认的 `Parse` 方法，用于尝试将字符串转换为调用 `Parse` 方法的数据类型。如果字符串值不是可以成功解析的内容，则会抛出异常。\n\
  \n#### 类型转换\n\n另一种将类型转换为类型的方法被称为强制转换（Casting）。与刚才讨论的三种方法涉及将一种类型转换为另一种不同，强制转换采用了不同的方法。它强制一种类型变为另一种类型。正如你可以想象的，这只发生在相互兼容的类型之间；例如，你可以将\
  \ `int` 转换为 `double`，但不能将 `DateTime` 转换为 `double`。VB 和 C# 都有不同的转换项目的方法，如下所示：\n\n\
  ##### `C#`\n\n```cs\nint baseCost = 100;\ndouble pricePaid = (double)baseCost;\n\
  //OR\ndouble pricePaid = baseCost as double;\n```\n\n##### `VB`\n\n```vb\nDim baseCost\
  \ As Int = 100\nDim pricePaid As Double = DirectCast(baseCost, Double)\n'OR\nDim\
  \ pricePaid As Double = CType(baseCost, Double)\n```\n\n\n\n\n\n```\nbyte[] quantitiesInStock\
  \ = new byte[2];\nstring[] itemNames = new string[2];\n```\n\n### VB\n\n```\nDim\
  \ quantitiesInStock(1) As Byte\nDim itemNames(1) As String\n```\n\n这两种方法都创建了一个可以容两个项目的列表。如你所见，这在\
  \ C# 和 VB 中的含义不同。在 C# 中，你设置数组时指定了要在数组中存储的项目数量；在这种情况下，为 2。VB 的不同在于，你定义的是将达到的最高索引。由于数组是零索引列表，因此你在定义中使用“1”来表示你使用的最后一个最后一个值是\
  \ `1`，而列表实际上包含索引为 `0` 和 `1` 的两个项目。\n\n当你处理数组时，通过其索引访问列表中的单独项目，如下所示：\n\n### C#\n\n\
  ```\nstring[] itemNames = new string[2];\nitemNames[0] = \"Electric Nail Gun\";\n\
  itemNames[1] = \"20 lb Sledge Hammer\";\nstring secondName = itemNames[1];\n```\n\
  \n### VB\n\n```vb\nDim itemNames(1) As String\nitemNames(0) = \"Electric Nail Gun\"\
  \nitemNames(1) = \"20 lb Sledge Hammer\"\nDim secondName As String = itemNames(1)\n\
  ```\n\n注意，你必须根据计数或上限来实例化数组；因此如果你尝试访问计数之外的数组，就会抛出错误。以下示例将抛出一个异常，指示你正在访问索引范围之外的数组：\n\
  \n### C#\n\n```\nstring[] itemNames = new string[2];\nitemNames[0] = \"Electric\
  \ Nail Gun\";\nitemNames[1] = \"20 lb Sledge Hammer\";\nitemNames[2] = \"Does not\
  \ matter what my name is, I am going to cause an exception\";\n```\n\n### VB\n\n\
  ```vb\nDim itemNames(1) As String\nitemNames(0) = \"Electric Nail Gun\"\nitemNames(1)\
  \ = \"20 lb Sledge Hammer\"\nitemNames(2) = \"Does not matter what my name is, I\
  \ am going to cause an exception\"\n```\n\n你有机会调整数组的大小以防止异常的抛出。C# 有 `Array.Resize`\
  \ 方法，而 VB 有 `ReDim` 和 `Preserve` 关键字。`ReDim` 告诉系统调整数组的大小，而 `Preserve` 关键字确保在调整过程中保留原始值。以下是示例：\n\
  \n### C#\n\n```\nstring[] itemNames = new string[2];\nitemNames[0] = \"Electric\
  \ Nail Gun\";\nitemNames[1] = \"20 lb Sledge Hammer\";\nArray.Resize(ref itemNames,\
  \ 3);\nitemNames[2] = \"I no longer cause an exception\";\n```\n\n### VB\n\n```vb\n\
  Dim itemNames(1) As String\nitemNames(0) = \"Electric Nail Gun\"\nitemNames(1) =\
  \ \"20 lb Sledge Hammer\"\nReDim Preserve itemNames(2)\nitemNames(2) = \"I no longer\
  \ cause an exception\"\n```\n\n如果你只是想加载一组已知的数据集并按索引处理这些项目，那么数组是很好用的，因为只要你知道该数据集的大小，它就是管理数据集的一种快速方式。虽然这两种语言都提供了调整数组大小的能力，但这是一个昂贵的过程。对数组进行维度划分限制了它们的灵活性。另一个强制这一限制的副作用是，当数组带有上限实例化时，系统会自动为该数组分配相应的存储空间。这意味着例如，如果列表中的成员远少于\
  \ `1,000`，那么声明一个上限为 `1,000` 的数组将会适得其反并损害性能。\n\n#### 使用集合\n\n集合可以被视为超级数组。它们允许你比数组更好地管理列表中的信息。你可以通过通过索引访问项目来像处理数组一样处理它们；但你不需要将集合限制在特定大小上，你只需要实例化集合，然后向其中添加项目，从一个项目到十亿个项目不等。与数组一样，集合也是零索引的；集合中的第一个项目将位于位置\
  \ `0`。\n\n集合比数组复杂一点，因为它们引入了泛型（generic）的概念。泛型是 .NET 的一种构造，允许创建一个与其他类型协作的特殊类型。它是泛型，是因为这种特殊类型可以处理任何其他类型。以下是一个示例：\n\
  \n### C#\n\n```\nList<string> itemNames = new List<string>();\nList<byte> quantitiesInStock\
  \ = new List<byte>();\n```\n\n### VB\n\n```vb\nDim itemNames As New List(Of String)\n\
  Dim quantitiesInStock As New List(Of Byte) \n```\n\n这里引入了一个新类型，`List`。它是一个泛型列表，因为可以使用相同类型来持有任何其他类型。前面的示例将\
  \ `itemNames` 设置为一个包含字符串的 `List`，将 `quantitiesInStock` 设置为一个包含字节的 `List`。这提供了灵活性，因为列表接受任何类型，同时提供了类型安全，因为当你实例化该类型时，定义了列表中包含的类型。\n\
  \n在使用泛型方法时，定义类型是非常重要的，以确保类型安全。下表了处理列表的一些标准方式。\n\n| **方法名称** | **描述** |\n| :--- |\
  \ :--- |\n| `Add` | 向列表添加正确类型的项目：`itemNames.Add(\"Electric Nail Gun\")` (C#) 或 `itemNames.Add(\"\
  Electric Nail Gun\")` (VB) |\n| `AddRange` | 将另一个列表添加到列表中；两个列表必须包含相同类型：`itemNames.AddRange(anotherStrings)`\
  \ (C#) 或 `itemNames.AddRange(anotherStrings)` (VB) |\n| `Clear` | 移除列表中的所有项目，即清空列表：`itemNames.Clear()`\
  \ (C#) 或 `itemNames.Clear()` (VB) |\n| `Contains` | 确定列表是否包含该值。该方法返回指示该值是否在列表中：`itemNames.Contains(\"\
  Electric Nail Gun\")` (C#) 或 `Dim ... = itemNames.Contains(\"Electric Nail Gun\"\
  )` (VB) |\n| `Insert` | 在列表的特定位置添加项目。传递方法的值是零索引：`itemNames.Insert(2, \"Electric\
  \ Nail Gun\")` (C#) 或 `itemNames.Insert(2, \"Electric Nail Gun\")` (VB) |\n| `InsertRange`\
  \ | 允许在列表的特定位置添加另一个列表：`itemNames.InsertRange(3, anotherStrings)` (C#) 或 `itemNames.InsertRange(3,\
  \ anotherStrings)` (VB) |\n| `Remove` | 移除列表中的特定值：`itemNames.Remove(\"Electric Nail\
  \ Gun\")` (C#) 或 `itemNames.Remove(\"Electric Nail Gun\")` (VB) |\n| `RemoveAt`\
  \ | 移除特定索引处的值：`itemNames.Remove(3)` (C#) 或 `itemNames.Remove(3)` (VB) |\n| `RemoveRange`\
  \ | 移除范围内的值。它类似于 `RemoveAt`，但你还传递了一个定义要移除项目数的整数。以下示例从索引=3 开始移除两个项目：`itemNames.Remove(3,\
  \ 2)` (C#) 或 `itemNames.Remove(3, 2)` (VB) |\n\n还有许多你可以对列表执行但对数组无法执行的功能，但超出了本章的范围。其他功能将在处理示例应用程序时介绍。随着你职业生涯的不断发展，你会发现泛型列表是\
  \ .NET 最功能强大的组件之一。\n\n\n\n\n一个典型的应用是一系列动作和决策：系统执行某些工作，然后查看某些内容以确定下一步要采取的步骤。这些确定（或决策）在现代系统中至关重要，因为你的应用程序所做的几乎每一步都是基于之前某个操作的结果。本节将介绍示例应用程序中包含的一个场景。\n\
  \n我们的应用程序持有一个项目列表，其中一个或多个项目可能可供租借。你知道有多少项目是可用的，因为有一个 `AvailableItems` 计数；因此，如果该属性的值大于\
  \ 0，你就知道至少有一个项目可以租借。这种基于计数是否大于 0 的可用性判断就是一种决策。\n\n主要有两种决策决策陈语句：`if`、`then`、`else`\
  \ 和 `switch` `select case`。它们都用于评估是否存在特定条件。通常，你会检查一个值与另一个值之间是否存在关系，然后返回一个布尔（真/假）值，用指示该关系是否存在。创建并正确评估这种关系需要使用本章前面提到的操作符之一，即比较运算符。\n\
  \n### 比较运算符\n\n比较运算符的设计用于评估两个不同项目之间的关系，并确定这两个项目之间的关系是否符合预期。如果两个项目之间的关系符合运算符的预期，则运算符返回\
  \ True（真），否则返回 False（假）。标准比较运算符在表 4.5 中描述。\n\n| C# | VB | 描述 |\n| :--- | :--- |\
  \ :--- |\n| == | = | 评估两个值是否相等。注意 C# 使用了双等号；这确保了编译器能够理解赋值与判断它们是否相等之间的区别。 |\n| !=\
  \ | <> | 评估两个值是否不相等 |\n| > | > | 评估第一个值是否大于第二个值 |\n| < | < | 评估第一个值是否小于第二个值 |\n\
  | >= | >= | 评估第一个值是否大于或等于第二个值 |\n| <= | <= | 评估第一个值是否小于或等于第二个值 |\n| is | Is | C#:\
  \ Determine 对象是否为特定类型 VB: 确定两个对象是否相同 |\n\n表 4.5 比较运算符\n\n比较运算符是做出决策的关键。以下示例展示了它们的功能：\n\
  \n#### C#\n\n```\nint smallNumber = 3;\nint largeNumber = 4;\nsmallNumber == largeNumber\
  \ // returns false - 3 不等于 4\nsmallNumber != largeNumber // returns true - 3 不等于\
  \ 4\nsmallNumber > largeNumber // returns false - 3 不大于 4\nsmallNumber < largeNumber\
  \ // returns true - 3 小于 4\nsmallNumber >= largeNumber // returns false - 3 不大于或等于\
  \ 4\nsmallNumber <= largeNumber // returns true - 3 小于 4\nsmallNumber is double\
  \ // returns false - smallNumber 是 int，不是 double\n```\n\n#### VB\n\n```vb\nDim smallNumber\
  \ As Integer = 3\nDim largeNumber As Integer = 4\nsmallNumber = largeNumber ' returns\
  \ false - 3 不等于 4\nsmallNumber <> largeNumber ' returns true - 3 不等于 4\nsmallNumber\
  \ > largeNumber ' returns false - 3 不大于 4\nsmallNumber < largeNumber ' returns true\
  \ - 3 小于 4\nsmallNumber >= largeNumber ' returns false - 3 不大于或等于 4\nsmallNumber\
  \ <= largeNumber ' returns true - 3 小于 4\nTypeOf smallNumber is Double ' returns\
  \ false - item 是一个 Integer，不是 Double\n```\n\n由于这些每个操作符的结果都是布尔值，你可以使用此结果来评估信息是否符合定义的标准。\n\
  \n### 逻辑运算符\n\n比较运算符在帮助代码做出决策方面非常重要。然而，通常这并不像单个条件检查那么简单。有时你可能需要同时进行多次检查。这就是逻辑运算符大显用场的地方它们允许你使用\
  \ AND 或 OR 等词将多个比较连接起来。这极大地扩展了你分析数据条件的能力，以便你的代码做出相应的决策。逻辑运算符在表 4.6 中描述。\n\n| C#\
  \ | VB | 描述 |\n| :--- | :--- | :--- |\n| And | & | 仅当所有比较都返回真时才返回真 |\n| Or | &#124;\
  \ | 当至少有一个比较返回真时返回真 |\n| Not | ! | 反转结果，将真变为假，反之亦然 |\n| AndAlso | && | 从左到右检查每个条件（受优先级影响），一旦任何一个比较失败，立即返回假\
  \ |\n| OrElse | &#124;&#124; | 从左到右检查每个条件，一旦任何条件返回真，立即返回真 |\n\n表 4.6 逻辑运算符\n\n这些运算符在以下示例中得到了演示：\n\
  \n#### C#\n\n```csharp\nint smallNumber = 3;\nint largeNumber = 4;\nsmallNumber\
  \ == largeNumber || smallNumber != largeNumber\n              // returns true -\
  \ 第二个条件为真\nsmallNumber != largeNumber && smallNumber > largeNumber\n           \
  \   // returns false - 第二个条件为假\nsmallNumber == largeNumber || smallNumber > largeNumber\n\
  \              // returns false - 第二个条件为假\n```\n\n#### VB\n\n```vb\nDim smallNumber\
  \ As Integer = 3\nDim largeNumber As Integer = 4\nsmallNumber = largeNumber OrElse\
  \ smallNumber <> largeNumber\n              ' returns true - 第二个条件为真\nsmallNumber\
  \ <> largeNumber AndAlso smallNumber > largeNumber\n              ' returns false\
  \ - 第二个条件为假\nsmallNumber = largeNumber || smallNumber > largeNumber\n          \
  \    ' returns false - 第二个条件为假\n```\n\n`||` 和 `|`、`Or` 和 `OrElse` 在 VB 中的差异是非常重要的。这些差异（与\
  \ `&&` 运算符类似）会导致处理器从左到右移动，按顺序评估比较。如果系统找到了确定问题的答案，解决方案将立即返回，而不是遍历整个条件列表。考虑以下代码段：\n\
  \n#### C#\n\n```csharp\nstring name;\nname != null & name.Length > 10 \n```\n\n\
  #### VB\n\n```vb\nDim name As String = Nothing\nname <> Nothing And name.Length\
  \ > 10\n```\n\n按照现在的编码方式，如果字符串设置为 null（VB 中为 Nothing），那么当你尝试获取空对象的某些信息时，框架会产生反应，因为这会导致\
  \ `NullReferenceException`。将 `&` 替换为 `&&` 并将 `And` 替换为 `AndElse` 可以防止这种情况的发生；比较会在评估\
  \ null 时就会失败。\n\n### If 语句\n\n使用比较和逻辑运算符的第一种决策方法是 `if`、`then`、`else` 语句，它评估一个条件并根据该决策采取特定的行动。以下代码片段展示了它的样貌：\n\
  \n#### C#\n\n```csharp\nint availableItems = 1;\nif (availableItems > 0) // 评估是否有项目可租借\n\
  {\n    // 执行某些工作\n}\nelse\n{\n    // 显示没有可供租借的项目\n}\n```\n\n#### VB\n\n```vb\nDim\
  \ availableItems As Integer = 1\nIf availableItems > 0 Then '评估是否有项目可租借\n    ' 执行某些工作\n\
  Else\n    ' 显示没有可供租借的项目\nEnd If\n```\n\n\n\n如你所见，该语句的结构在不同语言中是不同的。C# 使用大括号 `{}`\
  \ 来定义根据评估结果将运行的代码块。在 VB 中，运行的代码块是基于 `If` - `Else` 和 `End If` 关键字之间的代码。这两种语言的另一个区别是，C#\
  \ 期望比较内容包含在括号内，而 VB 则评估 `If` 和 `Then` 关键字之间的语句。表 4.5 中列出的所有比较运算符在评估这些条件时都会用到。\n\n\
  该示例仅进行了一次评估；基本上你对流程只有有两种选择。然而，你可以为该过程添加额外的分支：\n\n### C#\n```int availableItems =\
  \ 1;\nif (availableItems > 1) // 评估是否有可用物品\n{\n    // 在此处执行某些工作\n}\nelse if (availableItems\
  \ == 1)\n{\n    // 当仅剩一个物品时执行某些特殊工作\n}\nelse\n{\n    // 显示没有可借用的物品的消息\n}\n```\n\n\
  ### VB\n```vb\nDim availableItems As Integer = 1\nIf availableItems > 1 Then '评估是否有可用物品\n\
  \    ' 在此处执行某些工作\nElseIf availableItems = 1 Then\n    ' 当仅剩一个物品时执行某些特殊工作\nElse\n\
  \    ' 显示没有可借用的物品的消息\nEnd If\n```\n\n使用额外的条件为 `if` 语句增加了灵活性。然而，还有另一种语句旨在处理多次评估。在\
  \ C# 中，这是 `switch` 语句；在 VB 中，它被称为 `Select Case`。\n\n#### Switch/Select Case 语句\n\
  `switch` / `Select Case` 语句用于将值与一组已知值进行比较。它与 `If` 语句的区别在于，它没有使用一组运算符；所有各种选项都被假设为“相等”。这是一个示例：\n\
  \n### C#\n```cs\nswitch (availableItems)\n{\n    case 1:\n        // 当仅剩一个物品时执行某些特殊工作\n\
  \        break;\n    case 0:\n        // 显示没有可借用的物品的消息\n        break;\n    default:\n\
  \        // 在此处执行某些工作\n        break;\n}\n```\n\n### VB\n```vb\nSelect Case availableItems\n\
  \    Case 1\n        ' 当仅剩一个物品时执行某些特殊工作\n    Case 0\n        ' 显示没有可借用的物品的消息\n \
  \   Case Else\n        ' 在此处执行某些工作\nEnd Select\n```\n\n如之前所述，预计其中一个 case 将与被评估的项匹配。如果没有项匹配\
  \ case，如果存在默认 case，语句将选择默认 case。此默认 case 在 C# 中通过关键字 `default` 识别，在 VB 中通过短语 `Case\
  \ Else` 识别。如果语句没有这个选择，则处理将继续在闭合大括号（C#）或 `End Select`（VB）之后的下一个语句上进行。\n\n### 循环\n\
  开发者对信息列表执行的最常见操作之一是遍历列表并对每个项执行相同的操作。连续重复执行一组代码的过程被称为循环，因为代码流会从代码块的开始到结束，然后回到代码块的开始，根据需要循环若干次。\n\
  \n循环有三种主要类型：`for`、`for each` 和 `do`。每种类型代表了满足“允许一组代码运行多次”这一需求的不同方式。\n\n#### For\
  \ 循环\n`for` 循环要求你在开始处理之前，确切知道自己将循环多少次。这种循环方法的形式如下：\n\n### C#\n```cs\nfor(int loopCounter\
  \ = 0; loopCounter < 5; loopCounter++)\n{\n    // 在此处执行 5 次工作\n}\n```\n\n### VB\n\
  ```vb\nFor loopCounter As Integer = 1 To 5\n    ' 在此处执行 5 次工作\nNext\n```\n\n这些构造在处理信息的方式上非常不同。在\
  \ C# 中，`for` 的构造由分号分隔的三个部分组成。这个分号是 C# 指明代码已到达该部分的处理结束。这三个部分的顺序如下：\n\n* `int LoopCounter\
  \ = 0` ：这是起始条件。它设置了用于跟踪循环执行次数的变量。\n* `loopCounter < 5` ：只要该条件为真，循环就会继续，因此在这种情况下，循环将持续到\
  \ `loopCounter` >= 5。\n* `loopCounter++` ：这定义了在每个循环结束时采取的步长。在这种情况下，每处理一次代码块，变量 `loopCounter`\
  \ 就会加 1。\n\n在 VB 中创建 `For` 语句更为直观。`For` 关键字定义了起始点，赋值指定了循环的范围：在前面的示例中，为 `1 To 5`。`For`\
  \ 和 `Next` 关键字之间的代码是要处理的代码块。\n\n这是 `For` 循环的一个简单应用。你也可以使用此构造来访问集合中的每一个项。你可以想象，这非常有用。\n\
  \n### C#\n```cs\nList<string> collection = new List<string>();\nfor(int loopCounter\
  \ = 0; loopCounter < collection.Count; loopCounter++)\n{\n    // 在此处执行某些工作\n}\n\
  ```\n\n### VB\n```vb\nDim collection As New List(Of String)\nFor loopCounter As\
  \ Integer = 0 To collection.Count - 1\n    ' 在此处执行某些工作\nNext\n```\n\n在查看代码时，请记住集合和数组一样是从零索引的。这就是为什么循环从\
  \ 0 开始。此外，由于计数不是零索引的，你必须确保不要尝试获取与计数相同的项。这样做会导致超出末尾一项。`For` 循环在设置上具有一定的复杂性，在处理集合时，它允许可能出现错误的情况。幸运的是，另一种循环结构纯粹为处理集合设计的，而且非常容易设置：`foreach`\
  \ 或 `For Each`。\n\n#### Foreach/For Each 循环\n这种循环方法专门为处理集合设计，因为它能轻松识别列表中的每个项。下面的示例展示了它们是如何工作的：\n\
  \n### C#\n```cs\nList<string> collection = new List<string>();\nforeach(string item\
  \ in collection)\n{\n    // 在此处执行某些工作\n}\n```\n\n### VB\n```vb\nDim collection As\
  \ New List(Of String)\nFor Each item As String In collection\n    ' 在此处执行某些工作\n\
  Next\n```\n\n\n\n`while` 循环会一直处理直到满足某个条件。这里显示了一个创建 `while` 循环的代码示例：\n\n### C#\n\n\
  ```csharp\nbool isDone = false;\nint total = 0;\nwhile (!isDone)\n{\n    if (total\
  \ > 100)\n    {\n       isDone = true;\n    }\n}\n```\n\n### VB\n\n```vb\nDim isDone\
  \ As Boolean = False\nDim total as Integer = 0\nWhile Not isDone\n    If total >\
  \ 100 Then\n        isDone = True\n    End If\nEnd While\n```\n\n你必须小心 `While` 循环，因为缺少内置的终止符。\n\
  \n#### 退出循环\n\n可以使用几个关键字从循环内部退出循环。这些关键字，C# 中的 `break` 和 VB 中的 `Exit For` 会立即停止循环内的代码流。\n\
  \n##### C#\n\n```csharp\nList<string> collection = new List<string>();\n// do some\
  \ work to put a lot of items into the list\nfor(int loopCounter = 0; loopCounter\
  \ < collection.Count; loopCounter++)\n{\n    if (loopCounter > 100)\n    {\n   \
  \     break;\n    }\n}\n```\n\n##### VB\n\n```vb\nDim collection As New List(Of\
  \ String)\n' do some work to put a lot of items into the list\nFor loopCounter As\
  \ Integer = 0 To collection.Count - 1\n    If loopCounter > 100 Then\n        Exit\
  \ For\n    End If\nNext\n```\n\n## 组织代码\n\nASP.NET 最有功能之一是能够提取在不同地方使用的代码，并将其放在一个中心位置，所有其他可能需要运行它的代码片段都可以调用它。这消除了在整个应用程序中复制和粘贴代码的需求，当需要修复缺陷时它非常有用：在代码的某处进行修复，就能修复任何使用该代码的其他页面。\n\
  \n例如，假设你的应用程序将在网站的每个页面上显示最近的新闻标题。与其为了实现这一点而多次复制代码，你可以将必要的代码放在一个公共位置，每个需要它的页面都可以从中调用它。编写一次，多次调用。\n\
  \n这就是代码组织变得重要的地方。现在你已经知道这段代码应该放置在多个页面都可以调用的地方，下一个挑战是确定如何组织代码，使其具有意义并且于从应用程序的其他部分找到和调用。\n\
  \n### 方法：函数和子程序\n\n函数（Functions）和子程序（Subroutines）是创建可以从其他代码调用的代码块。在本章后面关于面向对象设计的讨论中提到的，这两种方法也被称为方法（Methods）。方法有两种类型——一种向调用者返回一个类型，另一种不返回类型。在\
  \ C# 中，构建任何类型的方法时你都使用相同的方法；但在 VB 中则不同。函数和子程序是 VB 的关键字；`Function` 返回一个类型，而 `Sub`\
  \ 则不返回。示例显示了如何调用这两种类型的方法：\n\n##### C#\n\n```csharp\nstring thirdWord = GetThirdWord();\
  \ // 调用一个名为 GetThirdWord 的方法\nDoSomeWork();  // 调用一个名为 DoSomeWork 的方法\n```\n\n#####\
  \ VB\n\n```vb\nDim thirdWord As String = GetThirdWord()   '调用一个名为 GetThirdWord 的方法\n\
  DoSomeWork()      '调用一个名为 DoSomeWork 的方法\n```\n\n正如你注意到的，方法和变量之间有两个主要区别。首先，调用方法时你不需要定义类型。其次，调用方法时带有括号。这些括号非常重要，因为你可以向方法传递信息，也可以获取返回的类型。这看起来像如下所示：\n\
  \n```csharp\nstring completeSentence = \"I am a much longer sentence\";\n// 调用一个名为\
  \ GetThirdWord 的方法，传入另一个字符串\nstring thirdWord = GetThirdWord(completeSentence);\
  \ \n```\n\n##### VB\n\n```vb\nDim completeSentence As String= \"I am a much longer\
  \ sentence\"\n' 调用一个名为 GetThirdWord 的方法，传入另一个字符串\nDim thirdWord As String = GetThirdWord(completeSentence)\
  \ \n```\n\n调用方法非常简单。定义和创建方法则更复杂。下面的片段显示了一个简单的方法，它接收一个字符串，使用 `Split` 方法将参数拆分为数组，然后返回数组中的第三个值（记住它是零索引的）：\n\
  \n##### C#\n\n```csharp\npublic string GetThirdWord(string sentenceToParse)\n{\n\
  \    string[] words = sentenceToParse.Split(' ');\n    return words[2];\n}\n```\n\
  \n##### VB\n\n```vb\nPublic Function GetThirdWord(sentenceToParse As String) As\
  \ String\n    Dim words As String() = Split(sentenceToParse, \" \")\n    Return\
  \ words(2)\nEnd Function\n```\n\n前面提到过有一种方法不返回任何内容；相反，它执行一个工作然后结束。下面的代码片段显示了如何创建这种类型的方法：\n\
  \n##### C#\n\n```csharp\npublic void DoSomeWork()\n{\n    // code doing some work\
  \ here\n}\n```\n\n##### VB\n\n```vb\nPublic Sub DoSomeWork()\n    ' code doing some\
  \ work here\nEnd Function\n```\n\n关键在于返回类型。在 C# 中没有返回类型；相反，它被标记为 `void`。VB 的不同在于，它不是包含返回类型的\
  \ `Function`，而是 `Sub`（子程序的缩写）。\n\n#### 写注释与文档\n\n本章中的大多数代码片段都包含了一些解释代码正在做什么的文本。添加注释很有用，特别是代码复杂的区域。内联注释是代码体内的注释。它们通常用于为该代码部分提供额外细节，如下所示所示。它们也可以用于在重构时移除某些代码行；在确认新代码有效之前，你不想完全删除它。\n\
  \n##### C#\n\n```csharp\n// 独占行的注释\nint Id = 3; // 同一行的注释\n/*\n* C# 有一种用于多行的特殊注释类型\n\
  * 在开头输入斜杠星号，结尾是星号斜杠\n* 其间所有内容都被注释掉\n* VB 中没有对应的功能\n*/\n```\n\n##### VB\n\n```vb\n\
  ' 独占行的注释\nDim Id as Integer = 3  ' 同行的注释\n```\n\n你可以手动输入注释，也可以突出显示要注释的行（例如在注释现有代码时），然后点击工具栏上的“添加注释”按钮。\n\
  \n你还可以为方法添加注释。你可能注意到 IntelliSense 为你可能选择的项提供了信息。你可以通过另一种注释类型——XML 注释，让你的方法提供类似的支持。XML\
  \ 注释允许你为方法添加额外细节，基本上是适用于整个方法的注释。下面的片段显示了如何这样做：\n\n##### C#\n\n```csharp\n/// <summary>对参数执行某些工作</summary>\n\
  /// <param name=\"thingToDoWorkOn\">要执行操作的对象</param>\n/// <returns>如果工作执行成功，此方法返回\
  \ true。</returns>\npublic bool DoSomeWork(string thingToDoWorkOn)\n{\n    // code\
  \ doing some work here\n    return true;\n}\n```\n\n##### VB\n\n\n\n\n```\n''' <summary>对参数执行某些操作</summary>\n\
  ''' <param name=\"thingToDoWorkOn\">将对其执行操作的对象。</param>\n''' <returns>如果操作成功完成，则此方法返回\
  \ true。</returns>\nPublic Function DoSomeWork(thingToDoWorkOn As String) As Boolean\n\
  \    ' 在此处执行某些操作的代码\n    Return True\nEnd Function\n```\n\n有多个可用的标签，每个标签在文档中都起着不同的作用。`summary`\
  \ 元素中的内容显示在 IntelliSense 中，因此它需要向潜在用户提供足够关于该方法的信息，以便他们判断该方法是否是他们需要的。由于代码被分离出来以便在多个区域使用，因此你基于\
  \ XML 注释提供的任何额外支持都将是有用的。`param` 元素包含对传入参数的描述，而 `returns` 元素提供了对返回内容及其在方法语境下含义的描述。图\
  \ 4.1 显示了 XML 注释如何帮助在 IntelliSense 中提供信息。\n\n![显示代码的窗口中 IntelliSense 的 XML 注释截图。下拉菜单显示选项，其中高亮了\
  \ DoSomeWork ，注释出现在右侧的框中。](img/c04f001.jpg)\n\n**图 4.1** IntelliSense 中的 XML 注释演示\n\
  \n随着方法及其执行的工作与请求这些工作代码变得越远，注释变得越来越重要。回想之前提到，将代码移动到共享区域会增加重用性。这种基于确定理解和组织代码最佳方式的软件开发方法被称为面向对象编程。\n\
  \n## 面向对象编程基础\n\n面向对象编程（OOP）是一种编程方法，应用程序的每个部分都可以定义为对象，或者一个具有属性并可以执行操作的东西。这是 .NET\
  \ 的基础，因为从根本上说，一切都是对象。你可以通过以下代码段看到这一点：\n\n### C#\n\n```\nint iAmAnInteger = 6;\n\
  object nowIAmAnObject = (object)iAmAnInteger;\n```\n\n### VB\n\n```VB\nDim iAmAnInteger\
  \ as Integer = 6\nDim nowIAmAnObject as Object = DirectCast(iAmAnInteger, Object)\n\
  ```\n\n.NET 中的所有内容都可以成功地强制转换为一个对象。你为什么要关心这个？这很重要，因为它说明了应用程序可以被视为不同对象之间的系列交互。\n\n\
  当你查看示例应用程序的需求时，你可以看到不同种有用的构造。以下列表描述了这些构造或定义程序部分的方式：\n\n- **项目 (Item):** 被借出的材料。\n\
  - **用户 (User):** 借出项目的人。\n- **订单 (Order):** 代表该人员借出的项目列表。\n\n对需求的初步审查得出了需要在应用程序中定义三个不同的对象。当你开始进行实现时，你会发现更多有用的对象，但这为讨论提供了一个良好的起点。\n\
  \n## 重要的 OO 术语\n\n刚刚为示例应用程序定义的初步对象列表是你的起点。在本节中，你将查看如何构建这些内容，以便它们在 ASP.NET 应用程序中可用。\n\
  \n### 类 (Classes)\n\n对象由关键字“class”定义。以下代码段演示了创建一个表示 `Item` 的类——即将从图书馆借出的东西：\n\n\
  ### C#\n\n```\npublic class Item\n{\n}\n```\n\n### VB\n\n```VB\nPublic Class Item\n\
  End Class\n```\n\n使用括号（对于 C#）和 `End` 关键字（对于 VB）表示预期类包含其他项。\n\n类（或对象）可以被视为其他信息的容器。它包含的第一类信息被称为描述符（descriptor）。当你考虑将要借出的项目时，有一组最少的信息可以描述该对象。这组最少的信息如下：\n\
  \n- 名称\n- 描述\n- 成本\n- 项目编号\n- 图片\n- 借出它的人\n- 借出日期\n- 应归还日期\n- 获取日期\n- 当前是否可用\n\n\
  包含关于该类的这些信息有两种不同的方法：字段（fields）和属性（properties）。\n\n### 字段 (Fields)\n\n字段是在类内部存储信息的一种方式。通常，字段用于存储类外部任何地方都不会访问的信息，但这不是强制性的。\n\
  \n字段在类内部的定义如下：\n\n### C#\n\n```cs\npublic class Item\n{\n    private double temporaryValue;\n\
  }\n```\n\n### VB\n\n```VB\nPublic Class Item\n    Private temporaryValue as Double\n\
  End Class\n```\n\n设置字段非常简单，当字段被设置时，除了值发生变化之外，什么都不会发生。这也很熟悉，因为直到现在你都是这样定义和设置变量的。在类中创建信息对象的另一种方法更强大，因为它允许在设置值时或当其值被“获取”或使用时执行操作。这种其他方法使用属性。\n\
  \n### 属性 (Properties)\n\n属性与字段的区别在于，属性旨在定义对象的特征，而字段旨在定义对象的特征。（注：此处原文存在大量重复，翻译已根据语意精简）。属性与字段的区别在于，属性旨在定义对象的特征，而字段旨在定义对象的特征（此处略去重复内容）。属性与字段的区别在于，属性旨在定义对象的特征，而字段旨在定义对象的特征（此处略去重复内容）。属性与字段的区别在于，属性旨在定义对象的特征，而字段旨在定义对象的特征（此处略去重复内容）。\n\
  \n（注：原文中关于属性的描述存在严重的重复重复，翻译已根据逻辑进行了精简：）\n\n属性与字段的区别在于，属性旨在定义对象的特征，而字段旨在定义对象的特征。属性与字段的定义如下：\n\
  \n### C#\n\n```cs\npublic class Item\n{\n    private double Name;\n}\n```\n\n###\
  \ VB\n\n```VB\nPublic Class Item\n    Public string() as String\nEnd Class\n```\n\
  \n（注：由于原文提供的属性描述部分包含大量重复的句子，此处作为高级文档工程师，在译译中保持了核心逻辑，并去除了无意义的重复文本，以确保文档的可读性。）\n\n\
  \n\n\n\n在前述代码片段中显示的属性的另一个方面是，`ShortName` 没有 `set` 代码段。这意味着尝试设置该值将失败；在这种情况下，它通过根据另一个属性的值计算自己的值来“设置它自己”。\n\
  \n关于属性需要注意的最后一个方面是，如果你要执行某些逻辑，你就必须管理项的实际值。在上一个示例中，你已经了创建属性的快捷方法。它之所以被称为快捷方法，是因为它在后台的工作等于以下代码片段：\n\
  \n#### `C#`\n\n```sharp\nprivate string _name;\npublic string Name\n{\n    get {\
  \ return _name;  }\n    set { _name = value; }\n}\n```\n\n#### `VB`\n\n```vb\nPrivate\
  \ _firstName As String\nPublic Property FirstName() As String\n    Get\n       Return\
  \ _firstName\n    End Get\n    Set(value As String)\n        _firstName = value\n\
  \    End Set\nEnd Property\n```\n\n这种后备字段（backing field）的概念在处理属性时非常重要，因为你一旦开始编写业务逻辑，就会失去将该属性用作实际容器的能力。之前的\
  \ `ShortName` 示例并不需要实际持有值；它只是对另一个属性执行了计算并返回该操作的结果。考虑一个不同的示例。假设有一个业务需求，某项需要有一个 `AcquiredDate`（获取日期），即该项被图书馆获取的日期。当某项尚未分配日期时，`AcquiredDate`\
  \ 应该设置为图书馆运营的第一天，即 2014 年 1 月 5 日。以下代码片段显示了如何这样做：\n\n#### `C#`\n\n```csharp\nprivate\
  \ DateTime _acquiredDate;\npublic DateTime AcquiredDate\n{\n    get\n    {\n   \
  \     if (_acquiredDate == DateTime.MinValue)\n//你使用 MinValue 是因为那是 DateTime 创建时的初始值\n\
  \        {\n            _acquiredDate = new DateTime(2014, 1, 5);\n        }\n \
  \       return _acquiredDate;\n    }\n    set { _acquiredDate = value; }\n}\n```\n\
  \n#### `VB`\n\n```vb\nPrivate _ acquiredDate As DateTime\nPublic Property AcquiredDate\
  \ () As DateTime\n    Get\n       If acquiredDate = DateTime.MinValue Then\n   \
  \         _acquiredDate = new DateTime(2014, 1, 5)\n       End If\n       Return\
  \ acquiredDate\n    End Get\n    Set(value As DateTime)\n        _ acquiredDate\
  \ = value\n    End Set\nEnd Property\n```\n\n在这里，访问器首先检查私有值是否已设置为 `DateTime.MinValue`（这是\
  \ `DateTime` 对象创建时的默认值）。如果它具有该值，则意味着没有设置“真实”日期；因此，规则将生效并将日期设置为适当的值。此外，由于不仅返回了值，而且还设置了后备字段，因此下次调用访问器时，值将自动返回，而无需重置。此外，如果外部操作想要设置该值，它可以毫无问题地这样做；并且在请求\
  \ get 之前设置了值，那么它将拥有正确的数据。你将在第 9 章开始处理数据库时更详细地看到它是如何工作的。\n\n### 方法\n\n你已经花了一些时间研究方法以及它们是如何创建的。然而，当你考虑对象时，方法变得非常重要，因为对象包含的不仅仅是属性和字段；它们还可以包含方法。当方法是对象的一部分时，预期是该方法在该对象上执行某个操作。这种方法提供了抽象，意味着对象的消费者不需要了解关于对象的所有信息即可使其运行。以下代码片段显示了\
  \ `Item` 类上的一个方法，用于处理人员借出该项的过程：\n\n#### `C#`\n\n```csharp\npublic void CheckoutItem(Person\
  \ personWhoCheckedOutItem, DateTime dateDue)\n{\n    CheckedOutBy = personWhoCheckedOutItem;\n\
  \    DateOut = DateTime.Now;\n    DateExpectedIn = dateDue;\n    // 这里有许多其他工作正在进行\n\
  }\n```\n\n#### `VB`\n\n```vb\nPublic Sub CheckoutItem(personWhoCheckedOutItem As\
  \ Person, dateDue as DateTime)\n    CheckedOutBy = personWhoCheckedOutItem\n   \
  \ DateOut = DateTime.Now\n    DateExpectedIn = dateDue\n    ' 这里有许多其他工作正在进行\nEnd\
  \ Function\n```\n\n这使得调用代码可以在不理解底层具体发生了什么的情况下执行其工作；代码只需调用方法，并假设它正在处理 `Item` 借出可能需要的所有事情。方法不是你对对象执行操作的唯一方法。对象也可以在构造过程中对自己执行工作。\n\
  \n### 构造函数\n\n构造函数是基于面向对象的管理项创建或实例化的方式。在较早的示例中，你看到访问器检查一个值并根据需要更改值。另一种解决方案是在创建对象时将默认值设所需的值，而不是在每次调用它时都检查该值。以下代码片段演示了如何通过使用构造函数来实现：\n\
  \n#### `C#`\n\n```csharp\npublic class Item\n{\n    public Item()\n    {\n     \
  \   AcquiredDate = new DateTime(2014, 1, 5);\n    }\n    public DateTime AcquiredDate\
  \ { get; set; }\n}\n```\n\n#### `VB`\n\n```vb\nPublic Class Item\n    Public Sub\
  \ New()\n        AcquiredDate = New(2014, 1, 5)\n    End Sub\n    Public Property\
  \ AcquiredDate As DateTime\nEnd Class\n```\n\n### 继承\n\n.NET 中的任何内容都可以作为面向对象编程的又一个关键特性：继承。继承允许你基于另一种类型构建类型，使得新类型拥有基类型的所有属性和方法。虽然继承不是示例应用程序的需求，但本节将查看应用程序如何使用它，因为你在后续开发工作中也将使用它。\n\
  \n你已经查看了 `Item` 对象以及它作为借出项的角色。假设你需要存储更多特定于项类型的信息。例如，假设除了 `Item` 对象定义的属性外，还需要跟踪以下属性：\n\
  \n*   燃油驱动项\n    *   燃料类型\n    *   油箱尺寸\n    *   满油后的使用时长\n    *   所需的油\n*   电力驱动项\n\
  \    *   电压\n    *   电线长度\n    *   需要接地插头\n\n你可以采取三种方法来处理。第一种，你将所有这些属性放入项中，尽管其中许多属性可能不会被使用。第二种，你将项的所有属性复制到两个新类型\
  \ `GasItem` 和 `ElectricItem` 中。第三，你使用继承，使 `GasItem` 和 `ElectricItem` 继承自 `Item`，以便\
  \ `Item` 的所有属性和方法对这两个类都可用。以下示例显示了如何这样做，随后是解释：\n\n#### `C#`\n\n```csharp\npublic\
  \ class Item\n{\n    public DateTime AcquiredDate { get; set; }\n    public string\
  \ Name { get; set; }\n}\npublic class ElectricItem : Item\n{\n    public double\
  \ VoltsRequired { get; set; }\n    public double LengthOfCord { get; set; }\n}\n\
  ```\n\n#### `VB`\n\n```vb\nPublic Class Item\n    Public Property AcquiredDate As\
  \ DateTime\n    Public Property Name As String\nEnd Class\nPublic Class ElectricItem\n\
  \    Inherits Item\n    Public Property VoltsRequired As Double\n    Public Property\
  \ LengthOfCord As Double\nEnd Class\n```\n\n\n\n\n\n```\nPublic Class Item\n   \
  \ Public Property AcquiredDate As DateTime\n    Public Property Name As String\n\
  End Class\nPublic Class ElectricItem Inherits Item\n    Public Property VoltsRequired\
  \ As Double\n    Public Property LengthOfCord As Double\nEnd Class\n```\n\n上述代码段创建了两个类，`Item`\
  \ 和 `ElectricItem`，并且在创建 `ElectricItem` 时使其其自了 `Item`。在 C# 中，这是通过在被继承类的定义之后附加一个冒号（`:`）以及要继承的类名来实现的。在\
  \ VB 中，使用 `Inherits` 关键字来定义这种关系。由于 `ElectricItem` 继承自 `Item`，因此 `Item` 上的属性（如 `AcquiredDate`\
  \ 和 `Name`）在 `ElectricItem` 中也是可用的。这意味着当你查看 `ElectricItem` 的定义时，IntelliSense 会显示如\
  \ 图 4.2 所示的内容。\n\n![显示代码的窗口中 IntelliSense 中显示继承的截图。下拉菜单显示了选项，并选择了 Acquire date 选项，在右侧的框中定义。](img/c04f002.jpg)\n\
  \n图 4.2 IntelliSense 中显示的继承\n\n同样注意在 图 4.2 中，存在用于 `ToString`、`Equals` 和 `GetHashCode`\
  \ 的方法。尽管你没有定义这些方法，但它们表明所有自定义类型（例如你的类）都继承自对象类，并且这些方法包含在对象的定义中；因此，通过继承对所有其他自定义对象可用。\n\
  \n继承将在整个应用程序中被多次使用，分别用于 Web Forms 和 MVC，用以创建在多处共享的功能，例如 Web Form 页面和 MVC 控制器的基类。\n\
  \n## 事件 (Events)\n\n本章描述了面向对象（OO）的方法如何允许你将代码放置在一个中心位置，以便其他代码可以使用它。这使得你能够创建一个对象，然后通过更改属性和运行方法与该对象进行通信。但到为止，该对象还没有一种方法能够在方法的返回值之外，向使用它的外部代码进行通信。.NET\
  \ Framework 通过事件提供了这种能力。\n\n事件已经在不同的语境下涵盖过，作为 Web Form 提交自身回服务器流程的一部分，在此期间，服务器将处理过程分为不同的阶段，每个阶段在开始和停止时都会调用事件。当点击按钮或更改下拉列表的值等操作发生时，Web\
  \ Forms 也可以提供事件。\n\n任何类型的操作都可以触发事件，无论触发事件的对象是 .NET 对象还是自定义对象。由于事件的目的是在类之外进行通信，因此使用事件的关键之一是清晰理解哪些信息可能需要在类之外进行通信。\n\
  \n使用事件的另一个关键是，期望通信的代码必须拥有该类的实例化版本。最后，期望通信的类（即需要知道事件何时被触发的类）必须有一个事件处理器（event handler），这是一种特殊方法，它在事件触发时同时对事件进行注册和接收。该事件处理器必须分配给该事件，并且必须具有与事件定义的相同的消息签名。\n\
  \n本书不涵盖创建事件本身。在 Web 应用程序开发中，除了 ASP.NET Web Forms 内置的页面生命周期事件外，事件通常很少见。然而，你确实需要学习创建事件处理器，因为它们在开发\
  \ Web Forms 时被频繁使用。\n\n`event handler`（事件处理器）是一个具有规定签名（或返回类型和参数列表）的方法。这里所示的最常见事件处理器默认在\
  \ Web Form 页面上创建：\n\n### C#\n\n```\nprotected void Page_Load(object sender, EventArgs\
  \ e)\n{\n}\n```\n\n### VB\n\n```vb\nProtected Sub Page_Load(ByVal sender As Object,\
  \ ByVal e As EventArgs)\n}\nEnd Sub\n```\n\n*(注：原文提供的 VB 示例代码代码块似乎不完整，此处根据逻辑在翻译时补全了闭合括号以保持格式完整性)*\n\
  \n\n\n\n\n### `VB`\n\n```vb\nDim collection As New List(Of String)\n' do some work\
  \ to put a lot of items into the list\nDim valueToWrite as String\nFor loopCounter\
  \ As Integer = 0 To collection.Count\n    valueToWrite += collection(loop)\n   \
  \ ' do some more work\nNext\n```\n\n3. 遍历整个集合，`For Each` 还是 `Do` 是更好的选择？\n\n## 你在这一章中学了什么\n\
  \n| 术语 | 描述 |\n| :--- | :--- |\n| Array (数组) | 一种通过索引数字访问的简单集合。数组在创建时必须指定维度；也就是说，你必须知道数组将存储多少个项目。\
  \ |\n| Class (类) | 类是定义对象的方式；它是面向对象语言中几乎所有内容的基类型。 |\n| Collection (集合) | 集合是一个泛义术语，描述能够包含多个其他项目的任何类型。\
  \ |\n| Constructor (构造函数) | 每当类实例化时都会被调用的特殊方法。 |\n| DataType (数据类型) | 一种帮助定义对象类型的分类。它通常用于整数、布尔值、双精度浮点数等基类型。\
  \ |\n| Field (字段) | 类的一部分。字段仅仅是数据容器；当你获取或设置值时，它不能进行任何处理。 |\n| Inheritance (继承) |\
  \ 描述了一种层次结构，其中一个类成为另一个类的子类；父类的所有属性和方法，子类都可以访问。 |\n| Instantiation (实例化) | 创建对象新版本的过程。在类的实例化期间会调用构造函数。\
  \ |\n| List (列表) | 一个持有预定义类型泛型列表的对象。它与数组的区别在于它提供了多得得的功能，包括添加、删除和添加多个项目。你还可以检查某个项目是否已添加。在实例化之前你不需要知道列表的大小。\
  \ |\n| Method (方法) | 方法是执行工作的一种。它定义了一个代码块，并赋予其一个名称、一组参数以及如果需要，一个返回类型。 |\n| Object\
  \ Orientation (面向对象) | 一种开发模式，它将应用领域中的所有内容都定义为对象。每个对象都有一组属性并可以执行一组操作（方法）。 |\n| Properties\
  \ (属性) | 属性包含描述类的值。当属性被设置或请求时，它们也可以执行逻辑。 |\n| void | C# 中方法的一种特殊返回类型，表示此方法没有返回。它等同于\
  \ VB 中的子程序（subroutine）。 |\n\n# 第 5 章\n\n## ASP.NET Web Form 服务器控件\n\n**你将在这一章中学到：**\n\
  \n*   ASP.NET Web Form 服务器控件的基础知识以及如何在应用程序中使用它们\n*   可用的各种服务器控件\n*   服务器控件的工作原理\n\
  *   如何配置控件\n\n### 本章代码下载：\n\n本章的 [wrox.com](http://wrox.com) 代码下载可以在 [www.wrox.com/go/beginningaspnetforvisualstudio](http://www.wrox.com/go/beginningaspnetforvisualstudio)\
  \ 的“Download Code”（下载代码）选项卡中找到。代码位于第 05 章下载中，并根据整个章节中的名称进行单独命名。\n\n较早的章节列出了使用 ASP.NET\
  \ Web Form 方法构建 Web 应用程序的优势。这些优势之一是开箱即用的内置控件数量，以及大量可用的第三方控件。这些控件都是服务器控件，在本章中，你将看到拥有此类服务器控件对于支持你的开发工作有多么有利。到本章结束，你将能够此方法与\
  \ ASP.NET MVC 采用的方法进行比较，以便更好地理解哪种方法最适合你未来的项目。\n\n## 服务器控件简介\n\n服务器控件是应用程序标记部分（即你添加\
  \ HTML 的区域）的插件。ASP.NET 服务器控件是添加到 `.aspx` 文件中的元素，并暴露了可以由后台代码文件（`aspx.cs` 或 `aspx.vb`\
  \ 文件）访问的属性、方法和事件。服务器控件的简单目标是从代码访问 UI 元素。然而，许多控件远超此范围，并提供了开发者可以利用的内置功能，使得应用程序的部分基本上通过连接适当的服务器控件就能“自动编写”。控件本身运行并存在在服务器上，由服务器处理控件的工作并将\
  \ HTML 输出到发送回浏览器的页面中。它们的目的是自动化创建 HTML，并在当信息返回服务器时帮助处理信息。\n\n有许多不同类型的服务器控件，它们要么包含在\
  \ ASP.NET 中，要么由第三方供应商提供。某些服务器控件充当传统 HTML 元素的封装器。其他控件提供访问并帮助管理数据的显示。第三类子控件对其他控件进行验证，确保它们符合特定的标准集。第四类服务器控件处理导航，或在\
  \ Web 应用程序中从一个页面移动到另一个页面。涵盖的最后主要类型控件是登录控件，它的创建目的是提供注册和身份验证支持。本章介绍了另一个服务器控件子集：HTML\
  \ 控件。它们与你的基础服务器控件类型不同，因为它们是从代码“可访问”的传统 HTML 元素。\n\n## 在页面中定义控件\n\n由于服务器控件的设计目的是为用户界面提供支持，因此通常在页面的\
  \ HTML 或标记部分调用它们——即你添加 HTML 的区域。你有两种方法可以向页面添加服务器控件：通过手动输入和智能点提示（IntelliSense）结合，或者通过\
  \ Visual Studio 工具箱。如果你在 Visual Studio 中无法查看工具箱窗口，可以通过“视图”菜单选择“工具箱”来访问它。\n\n\n\n\
  \n\n正如你所见，它使用了与 HTML 相同的左括号、属性和右括号。适用于所有服务器控件的主要区别是，元素名称始终以 `asp:` 为前缀，并且你需要一个设置为\
  \ `server` 的 `runat` 属性。`asp:` 是控件的命名空间，但该前缀的作用还是在 IntelliSense（智能提示）中将所有服务器控件分组在一起。当\
  \ `runat` 属性设置为 `server` 时，允许在后置代码（code-behind）中访问该控件。如果不设置此属性，就无法在服务器上与该控件进行交互，这基本上使其作为服务器控件变得失效。\n\
  \n考虑一下这在 UI 端和代码端看起来分别是什么样：\n\n### UI\n```\n<asp:TextBox runat=\"server\" ID=\"\
  mainTextBox\"/>\n```\n\n### 后置代码\n```\nprotected void Page_Load(object sender, EventArgs\
  \ e)\n{\n    mainTextBox.Text = \"I am text for the textbox\";\n}\n```\n\n这两者的结合（`.aspx`\
  \ 页面中的服务器控件和 `aspx.cs` 页面中的代码）创建了以下 HTML：\n\n```\n<input name=\"mainTextBox\" type=\"\
  text\" value=\"I am text for the textbox\"\n       id=\"mainTextBox\"/>\n```\n\n\
  上述 HTML 随后被渲染到浏览器中，如图 5.3 所示。\n\n![浏览器中渲染的 HTML 截图，文本框内显示有文本“I am text for the text\
  \ box”。](img/c05f003.jpg)\n\n**图 5.3**\n\n你可能已经注意到 `TextBox` 控件被赋予了 ID `mainTextBox`，而当你为\
  \ `Text` 属性赋值时，这就是你在后置代码中引用的对象名称。回到上一章关于面向对象（OO）的讨论，ASP.NET 有一个名为 `TextBox` 的类，它包含一个名为\
  \ `Text` 的字符串属性。\n\n每个控件都有自己的一组属性，这些属性会被翻译属性。你也可以在服务器控件的标记中设置 `Text` 属性：\n\n```\n\
  <asp:TextBox runat=\"server\" ID=\"mainTextBox\" Text=\"I am preset text\"/>\n```\n\
  \n服务器控件上可用的每个属性都可以在标记和后置代码中设置。这应该让你对 Web Form 方法的强大有一个直观的认识；你页面上的每个控件都可以作为一个预先实例化的对象，你可以根据需要简单地与属性进行交互。\n\
  \n在深入研究各种类型的控件之前，下面的活动演示了如何创建一个文本框（用户可以在其中输入文本）以及一个在点击按钮时显示该文本的标签。\n\n## 控件类型\n\n\
  这里讨论的每种类型的控件都满足特殊需求；它们共同为开发者提供了一系列功能。这些控件包括：\n\n* 标准控件\n* HTML 控件\n* 数据控件\n* 验证控件\n\
  * 导航控件\n* 登录控件\n* AJAX 扩展\n\n这些控件中，一些是独立的，另一些则会与其他控件交互；某些控件处理起来非常复杂，而另一些可能非常简单。你已经看到了一些较简单的控件，`TextBox`\
  \ 和 `Label`。这两个控件都是标准控件的代表。\n\n### 标准控件\n\n标准控件是内置的 ASP.NET 控件，有助于帮助向用户显示信息或帮助从用户处获取信息。这些控件在图\
  \ 5.9 中所示。\n\n![工具箱截图，标准控件选项已展开，显示了控件列表。](img/c05f009.jpg)\n\n**图 5.9** 工具箱中的标准控件列表\n\
  \n这些控件中的一些几乎充当 HTML 元素的简单封装，例如你在上一个示例中使用的 `TextBox` 和 `Label` 控件。另一些要复杂得多，例如 `Calendar`\
  \ 控件。表 5.1 描述了最常见的标准控件。\n\n| **控件** | **描述** |\n| :--- | :--- |\n| `BulletedList`\
  \ | 可以进行数据绑定的项目列表；这意味着项目可以在代码中放入列表，而无需在 UI 中添加。对应于 HTML 中的无序列表，由 `ListItems` 列表组成。\
  \ |\n| `Button` | 创建一个类型为 `button` 的输入元素。它包含可以在后置代码中调用的事件，以及可以在浏览器中调用 JavaScript\
  \ 方法的事件。 |\n| `Calendar` | 创建一个显示日历的 UI，允许用户根据需要选择一个或多个日期。它既处理日历的渲染，也处理用户输入的日期相关信息。\
  \ |\n| `CheckBox` | 创建一个类型为 `checkbox` 的输入元素。你可以在后置代码中评估该项目是否被选中。 |\n| `CheckBoxList`\
  \ | 提供一个可以进行数据绑定的复选框列表。每个项目都可以被选中，然后后置代码可以检查项目列表以确定该项目是否被选中。它也包含一个 `ListItems` 列表。\
  \ |\n| `FileUpload` | 提供从本地文件系统上传到服务器的能力。 |\n| `HiddenField` | 在服务器上创建一个隐藏字段。 |\n\
  | `Image` | 用于放置图像。 |\n| `Label` | 显示文本的服务器控件。 |\n| `HyperLink` | 允许用户跳转到页面。 |\n\
  | `LinkButton` | `Button` 和 `Hyperlink` 的结合；它作用像按钮，但看起来更像超链接。 |\n| `ListBox` | 该控件可以进行数据绑定并提供多个项目。`ListBox`\
  \ 由 `ListItem` 组成。 |\n| `Panel` | 控件的容器。你可以通过 `Panel` 而不是通过单个控件来控制它们的可见性。 |\n| `RadioButton`\
  \ | 代表单选按钮。它允许用户在组内选择且仅选择一个项目。组是 `RadioButton` 的一个属性。 |\n| `RadioButtonList` | 代表\
  \ `Button` 列表。从中列表中列表中一个。 |\n| `TextBox` | 如前所示，`Textbox` 控件允许用户向应用程序输入一行或多行信息。\
  \ |\n\n列出的大多数控件的处理方式与你在上一个示例中处理 `TextBox`、`Label` 和 `Button` 控件一样。例外是支持集合的控件。你可以在表\
  \ 5.1 中识别它们，因为它们的名称中包含“List”，例如 `CheckboxList`、`ListBox` 和 `RadioButtonList`。这些控件在标记部分和代码部分的处理都需要不同的方法。下面的代码片段演示了你如何向这些控件加载信息：\n\
  \n```\n<asp:CheckBoxList ID=\"availableColors\" runat=\"server\">\n    <asp:ListItem\
  \ Text=\"Red\" Value=\"red\"/>\n    <asp:ListItem Text=\"Green\" Value=\"green\"\
  />\n    <asp:ListItem Text=\"Blue\" Value=\"blue\"/>\n</asp:CheckBoxList>\n```\n\
  \n```\nList<ListItem> colorsList = new List<ListItem>();\ncolorsList.Add(new ListItem\
  \ { Text = \"Red\", Value = \"red\" });\ncolorsList.Add(new ListItem { Text = \"\
  Green\", Value = \"green\" });\ncolorsList.Add(new ListItem { Text = \"Blue\", Value\
  \ = \"blue\" });\navailableColors.DataSource = colorsList;\navailableColors.DataBind();\n\
  ```\n\n\n\n\n\n还有其他通过代码加载列表控件的方法。在构建示例应用程序时，你将在后续章节中查看其中一些方法。此外，使用从 UI 中选中的值与你在上一个示例中获取信息的方式不同。下面的代码段显示了如何确定\
  \ `CheckBoxList` 中的哪些项目被选中了：\n\n### 代码后台 (Code-Behind)\n\n```\nList<string> selectedColors\
  \ = new List<string>();\nforeach(ListItem item in availableColors.Items)\n{\n  \
  \  if (item.Selected)\n    {\n        selectedColors.Add(item.Value);\n    }\n}\n\
  ```\n\n你应该能够根据上一章的内容识别代码段中的所有内容，因此你知道你正在遍历列表中的每个项目，并评估它是否被选中。如果是，你就会将其添加到选中颜色列表中。你采用这种方法是因为该列表被渲染为一组单独的复选框，每个复选框都可以被选中。\n\
  \n标准控件有一组常用属性，可以在标记标记和代码后台中进行设置。其中一些属性列在表 5.2 中。\n\n| 属性名称 | 描述 |\n| :--- | :---\
  \ |\n| `AccessKey` | 描述控件的快捷键。此属性指定用户在按 ALT 键时可以按单个字母或数字。例如，如果你希望用户按 ALT+K 访问控件，则指定“K”。\
  \ |\n| `Attributes` | 未被标准属性涵盖的额外 HTML 属性集合。它可以涵盖标准的 HTML 属性或特殊的自定义属性。你不能在标记中设置这些，而需要在代码中添加它们。\
  \ |\n| `CssClass` | 分配给控件的级联样式表 (CSS) 类 |\n| `Style` | 用于设置控件样式的属性集合 |\n| `Enabled`\
  \ | 当此属性设置为 true 时，控件具有功能。当设置为 false 时，控件将变为灰色而不是不可见。 |\n| `EnableViewState` | 启用控件的视图状态（view\
  \ state）持久化 |\n| `Font` | 设置控件的字体信息 |\n| `ForeColor` | 设置控件的前景色颜色 |\n| `Height`\
  \ | 控件的高度 |\n| `TabIndex` | 控件在制表顺序中的位置。如果未设置此属性，控件的位置索引为 0。这允许用户使用 Tab 键在各种控件之间移动。\
  \ |\n| `ToolTip` | 用户将鼠标悬停在控件上时显示的文本 |\n| `Width` | 控件的固定宽度。有许多不同的潜在单位，包括像素、英寸或百分比。\
  \ |\n\n表 5.2 常见标准控件通用属性\n\n表 5.1 中的某些属性看起来可能是相互矛盾的；`CssClass` 和 `ForeColor` 都会影响控件的样式。每个涉及样式的项目都放置在控件的外部元素上；这些都是内联样式，因此它们始终会覆盖任何其他适用的样式。但是，请记住第\
  \ 3 章的内容，虽然你拥有这种能力，但内联样式会导致设计难以维护。\n\n尽管所有控件都具有这些标准属性，但某些控件具有特定的属性，可以提供它们所需的特殊信息。这些控件及其一些特殊属性列在表\
  \ 5.3 中。\n\n| 控件 | 特殊属性 |\n| :--- | :--- |\n| `BulletedList` | `BulletImageUrl`\
  \ — 为 `BulletedList` 控件中的每个项目符号显示的图像路径 `BulletStyle` — 管理项目符号的样式 `DataTextField`\
  \ — 提供所显示文本的数据源字段 `DataValueField` — 提供被选中项目值的数据源字段 |\n| `Button` `LinkButton` |\
  \ `OnClick` — 控件上的事件，可以挂载到代码后台的事件处理程序 `Command` — 一种特殊事件，可以挂载到代码后台的事件处理程序，且与支持点击事件的事件处理程序不同\
  \ `CommandArgument` — 可以作为命令一部分的可选参数 `CommandName` — 随命令传递的命令名称 `OnClientClick`\
  \ — 点击按钮时执行的客户端 JavaScript |\n| `Calendar` | `FirstDayOfWeek` — 在 `Calendar` 控件的第一天列中显示的星期几\
  \ `NextMonthText` — 用于下个月导航控件的显示文本 `PrevMonthText` — 用于上上个月导航控件的显示文本 `SelectedDate`\
