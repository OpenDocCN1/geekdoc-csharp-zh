  * *Beginning JavaScript, 5th Edition* (ISBN: 978-1-118-90333-9)\n* *Web Development\
  \ with jQuery* (ISBN: 978-1-118-86607-8)\n* *Professional Visual Studio 2015* (ISBN:\
  \ 978-1-119-06805-1)\n* *Beginning HTML and CSS* (ISBN: 978-1-118-34018-9)\n\n当然，书籍不是你开发\
  \ ASP.NET Web 应用程序的唯一信息来源。以下是一些你可能感兴趣的在线资源：\n\n* [`p2p.wrox.com`](http://p2p.wrox.com):\
  \ Wrox 的公共讨论论坛，你可以在那里咨询所有与编程相关的问题。这本书在该网站上有它自己的链接。你可以就书的内容提出特定问题，我会尽力回答。\n* [`www.asp.net`](http://www.asp.net):\
  \ 微软 ASP.NET 社区网站。该网站提供下载、支持、文档和其他资源。\n* [`msdn.microsoft.com/asp.net`](http://msdn.microsoft.com/asp.net):\
  \ ASP.NET 的官方主页，包含文档、示例应用程序和其他资源。\n\n## 总结\n\n在构建应用程序后，最后要做的一件事是让它可用。当你的应用程序是 Web\
  \ 应用程序时，“使其可用”意味着你将其部署到一个可以访问的位置，以便他人发现并与之交互。\n\n在从本地机器部署应用程序时，必须处理许多不同的事情。其中一个任务是处理连接字符串，它们会因为环境而不同，因为你不再连接到同一个数据库服务器。另一个任务是确保不要以\
  \ Debug 模式部署；你现在不是开发状态了！\n\n### 练习\n\n\n\n\n\n1. 你已经通过一个过程将信息从你的开发环境复制到你的远程应用程序。你是否可以使用相同的方法将数据从服务器复制回你的本地系统？\n\
  \n2. 从服务器拷贝数据的原因是什么？\n\n3. 你没有做的更改之一是在远程服务器上开启跟踪（tracing）。转换文件中需要哪些代码，才能确保任何访问适当\
  \ `trace.axd` 页面的用户都能使用以下代码，无论该用户是从何处发起请求的？\n\n```\n<trace mostRecent=\"true\" enabled=\"\
  true\" requestLimit=\"1000\"\n        pageOutput=\"false\" localOnly=\"true\" />\n\
  ```\n\n## 本章中你学到了什么\n\n| 特性 | 说明 |\n| :--- | :--- |\n| Azure SQL Database | Azure\
  \ 产品体系的一部分，是一种关系型服务数据库。 |\n| Azure Web Apps | Azure App Service 中的 Web Apps 为托管应用程序提供了一个可扩展、可靠且易于使用的环境。\
  \ |\n| 表达式绑定 (Expression Binding) | 允许你将控件属性绑定到不同资源的技术，例如定义在 `Web.config` 中的应用程序设置。\
  \ |\n| Microsoft Azure | 一系列不同云服务的集合，包括分析、计算、数据库、移动、网络、存储和网页。 |\n| 冒烟测试 (Smoke Test)\
  \ | 对应用程序进行快速评估以确保其按预期运行的过程。它应该在任何部署之后始终运行。 |\n| 发布配置文件 (Publishing Profile) | 允许你保存部署应用程序过程中捕的配置信息。\
  \ |\n| 转换 (Transformations) | ASP.NET 的内置功能，用于管理配置文件的维护。你可以在配置中添加、删除或更改信息。 |\n|\
  \ `WebConfigurationManager` | 提供访问存储在配置文件中数据的类。 |\n\n# 练习答案\n\n### 第 1 章\n\n1. HTML\
  \ 和 HTTP 的区别在于，HTML 是一种用于定义在互联网上传输的内容的标记语言，而 HTTP 是管理在互联网上传输 HTML 的传输协议。\n\n2. `ViewState`\
  \ 是 ASP.NET Web Forms 管理状态的方式，尽管 HTTP 在定义上是无状态的。这很重要，因为它使你的网站能够判断内容何时发生，并允许应用程序支持许多内置事件。\n\
  \n3. 构成 ASP.NET MVC 的三个架构组件是模型（Models）、视图（Views）和控制器（Controllers）。视图是用户在浏览器中看到的内容。模型代表在视图中显示的数据。控制器是管理两者之间交互的部分——它处理获取模型并将其供视图使用。\n\
  \n4. Microsoft Visual Studio 是创建 ASP.NET 站点和应用程序的主要集成开发环境 (IDE)。我们在整本书中使用此产品，因为它是\
  \ Microsoft Windows 软件开发的行业标准。\n\n### 第 2 章\n\n1. 构建 Web 应用程序的两种方法是网站（Web Site）和\
  \ Web 应用程序（Web Application）。网站不预编译源代码，而是将源代码部署到服务器上。当应用程序启动时，会有 JIT 编译。Web 应用程序被编译后复制到服务器上运行。Web\
  \ Forms 可以采用这两种方法，但 MVC 应用程序仅适用于 Web 应用程序。\n\n2. 项目模板是 Visual Studio 创建针对特定需求项目的方式。Visual\
  \ Studio 包含许多项目模板，但我们最关的两个是 ASP.NET Web Forms 和 ASP.NET MVC。\n\n3. 与 Web Form 项目相比，ASP.NET\
  \ MVC 中创建了两个额外的文件夹：视图（View）文件夹和控制器（Controller）文件夹。它们在 Web Form 项目中没有创建，因为 Web Form\
  \ 项目没有体现控制器或视图的概念。\n\n### 第 3 章\n\n1. `.intro p` 将匹配那些完全包含在任何类名为 `intro` 的元素中的 `<p>`\
