    \     if (std::cin.fail()) {\n            // 输入失败；抛出异常\n            throw std::runtime_error(\"\
    Invalid input: not an integer.\");\n        }\n        // 使用输入的整数（在此情况下，只是打印它）\n\
    \        std::cout << \"You entered: \" << num << std::endl;\n    } catch (const\
    \ std::exception& e) {\n        // 处理类型为 std::exception（或其派生类）的异常\n        std::cerr\
    \ << \"Exception caught: \" << e.what() << std::endl;\n    }\n    return 0;\n\
    }\n```\n\n在这个程序中：\n\n1. 我们使用 `try` 块来封装可能抛出异常的代码。\n2. 我们尝试使用 `std::cin` 从用户处读取一个整数。如果输入失败（例如，用户输入了非整数值），`std::cin.fail()`\
    \ 返回 `true`。\n3. 在输入失败的情况下，我们抛出一个带有描述性错误消息的 `std::runtime_error` 异常。\n4. 在 `catch`\
    \ 块中捕获类型为 `std::exception`（或其派生类）的异常，并使用 `e.what()` 打印错误消息，它提供了异常的描述。\n\n## C++\
    \ 中的 `finally` 概念\n\nC++ 没有像其他编程语言那样内置的 `finally` 块（例如 `Java` 或 `C#`）。在这些语言中，`finally`\
    \ 块包含无论是否抛出异常都会运行的代码。在 C++ 中，资源管理和清理通常以不同的方式处理，通常使用 RAII（资源获取初始化）原则。\n\nRAII 将将资源的生命周期（如内存分配或文件打开）与\
    \ C++ 对象的生命周期绑定。当对象离开范围时，它的析构函数会被调用，确保资源被正确释放。这种技术有助于防止资源泄漏，并确保在存在异常的情况下也能清理。\n\
    \n这里有一个文件处理的 RAII 简化示例：\n\n```cpp\n#include <iostream>\n#include <fstream>\n#include\
    \ <stdexcept>\n\nclass FileGuard {\npublic:\n    FileGuard(const std::string&\
    \ filename) : file(filename) {\n        if (!file.is_open()) {\n            throw\
