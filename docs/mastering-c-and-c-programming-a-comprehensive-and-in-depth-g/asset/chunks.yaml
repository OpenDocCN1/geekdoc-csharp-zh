    \ pointer `ptrToNumber` to the `modifyValue` function, which then changes the\
    \ value pointed to by the pointer.\n\n## References\n\n### What is a Reference?\n\
    \nA reference is an alias or alternative name for an existing variable. Unlike\
    \ a pointer, which stores a memory address, a reference directly refers to the\
    \ variable it aliases. References are often used to create more readable and intuitive\
    \ code.\n\nHere's how you declare a reference in C++:\n\n```cpp\ndata_type& reference_name\
    \ = existing_variable;\n```\n\n- `data_type`: Specifies the data type of the variable.\n\
    - `reference_name`: The name you choose for the reference.\n- `existing_variable`:\
    \ The variable you want to alias with the reference.\n\n### Initializing References\n\
    \nReferences must be initialized when they are declared, and they cannot be changed\
    \ to refer to a different variable after initialization. This makes references\
    \ safer and more predictable than pointers.\n\n```cpp\nint number = 42;      //\
    \ Declare and initialize an integer variable\nint& refToNumber = number; // Declare\
    \ and initialize a reference to 'number'\n```\n\nIn this code, `refToNumber` is\
    \ a reference that directly refers to the `number` variable.\n\n### Using References\n\
    \nReferences can be used just like the variables they alias. When you modify a\
