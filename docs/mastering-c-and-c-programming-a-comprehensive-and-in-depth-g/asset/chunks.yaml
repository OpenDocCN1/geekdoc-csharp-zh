    ```\n\n在此代码中，我们使用 `*ptrToNumber` 解引用指针并获取存储在 `number` 变量中的值。\n\n### 空指针\n\n指针还可以有一个特殊的值，称为“空指针”。空指针不指向任何有效的内存位置，通常用于指示指针没有引用任何内容。在\
