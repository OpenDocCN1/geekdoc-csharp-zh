    The `Car` class inherits from `Vehicle` and provides its own implementation of
    the `Start` method.


    ### Interfaces


    An interface is a contract that defines a set of methods that a class must implement.
    Unlike abstract classes, a class can implement multiple interfaces.


    ```csharp


    interface IPlayable


    {


    void Play();


    }


    class MusicPlayer : IPlayable


    {


    public void Play()


    {


    Console.WriteLine("Playing music.");


    }


