- fmt: "\nIn the world of programming, control structures are your tools for dictating\
    \ the flow of your code. They allow you to make decisions, repeat actions, and\
    \ execute code conditionally. In this chapter, we'll explore C++ control structures,\
    \ including `if` statements, loops, and more, to help you gain full control over\
    \ your programs.\n\n## Conditional Statements with `if`\n\nThe `if` statement\
    \ is one of the most fundamental control structures in C++. It allows you to execute\
    \ a block of code conditionally, based on the evaluation of a specified condition.\
    \ Here's the basic syntax of an `if` statement:\n\n```cpp\nif (condition) {\n\
    \    // Code to execute if 'condition' is true\n}\n```\n\nLet's break down how\
    \ `if` statements work with an example:\n\n```cpp\n#include <iostream>\n\nint\
    \ main() {\n  int x = 10;\n  if (x > 5) {\n    std::cout << \"x is greater than\
    \ 5.\" << std::endl;\n  }\n  return 0;\n}\n```\n\nIn this example, we declare\
    \ a variable `x` with the value `10`. The `if` statement checks if `x` is greater\
    \ than `5`. If the condition (`x > 5`) is true, the code inside the curly braces\
    \ is executed, and \"x is greater than 5.\" is printed to the console.\n\n###\
    \ The `else` Clause\n\nYou can extend the `if` statement with an `else` clause\
    \ to specify what code to execute when the condition is false. Here's the syntax:\n\
    \n```cpp\nif (condition) {\n    // Code to execute if 'condition' is true\n} else\
    \ {\n    // Code to execute if 'condition' is false\n}\n```\n\nHere's an example:\n\
    \n```cpp\n#include <iostream>\n\nint main() {\n  int x = 3;\n  if (x > 5) {\n\
    \    std::cout << \"x is greater than 5.\" << std::endl;\n  } else {\n    std::cout\
    \ << \"x is not greater than 5.\" << std::endl;\n  }\n  return 0;\n}\n```\n\n\
    In this case, because `x` is not greater than `5`, the code inside the `else`\
    \ block is executed, and \"x is not greater than 5.\" is printed.\n\n### The `else\
    \ if` Clause\n\nYou can further refine your conditional logic by using the `else\
    \ if` clause to test multiple conditions sequentially. Here's the syntax:\n\n\
    ```cpp\nif (condition1) {\n    // Code to execute if 'condition1' is true\n} else\
    \ if (condition2) {\n    // Code to execute if 'condition1' is false and 'condition2'\
    \ is true\n} else {\n    // Code to execute if neither 'condition1' nor 'condition2'\
    \ is true\n}\n```\n\nLet's see an example:\n\n```cpp\n#include <iostream>\n\n\
    int main() {\n  int x = 10;\n  if (x > 15) {\n    std::cout << \"x is greater\
    \ than 15.\" << std::endl;\n  } else if (x > 10) {\n    std::cout << \"x is greater\
    \ than 10 but not 15.\" << std::endl;\n  } else {\n    std::cout << \"x is not\
    \ greater than 10.\" << std::endl;\n  }\n  return 0;\n}\n```\n\nIn this example,\
    \ the `if` statement checks the conditions in the specified order. Since `x` is\
    \ not greater than `15`, it moves to the next condition, which evaluates to true.\
    \ Therefore, \"x is greater than 10 but not 15.\" is printed.\n\n### Nested `if`\
    \ Statements\n\nYou can also nest `if` statements within one another to create\
    \ more complex conditional logic. Each `if` statement is evaluated independently\
    \ based on its condition. Here's an example of nested `if` statements:\n\n```cpp\n\
    #include <iostream>\n\nint main() {\n  int x = 10;\n  int y = 5;\n  if (x > 5)\
    \ {\n    std::cout << \"x is greater than 5.\" << std::endl;\n    if (y > 3) {\n\
    \      std::cout << \"y is greater than 3.\" << std::endl;\n    }\n  }\n  return\
    \ 0;\n}\n```\n\nIn this example, the outer `if` statement checks if `x` is greater\
    \ than `5`. If this condition is true, it enters the inner `if` statement and\
    \ checks if `y` is greater than `3`. Both conditions are true, so both messages\
    \ are printed to the console.\n\n### Short-Circuit Evaluation\n\nC++ uses short-circuit\
    \ evaluation when evaluating logical expressions within `if` statements. This\
    \ means that as soon as the result of a logical expression is determined, further\
    \ evaluation is halted if not necessary. For example:\n\n```cpp\nif (x > 5 &&\
    \ y > 10) {\n    // Code\n}\n```\n\nIn this case, if `x` is not greater than `5`,\
    \ the `&&` operator doesn't bother evaluating the second part of the condition\
    \ (`y > 10`) because the entire expression can't be true if the first part is\
    \ false.\n\n### The Ternary Operator in `if` Statements\n\nYou can use the ternary\
    \ operator within `if` statements to make concise conditional assignments. Here's\
    \ an example:\n\n```cpp\n#include <iostream>\n\nint main() {\n  int age = 18;\n\
    \  std::string status = (age >= 18) ? \"Adult\" : \"Minor\";\n  std::cout << \"\
    You are a \" << status << \".\" << std::endl;\n  return 0;\n}\n```\n\nIn this\
    \ example, `(age >= 18) ? \"Adult\" : \"Minor\"` checks if `age` is greater than\
    \ or equal to `18`.\n\n## Looping with `while`\n\nLoops are essential for executing\
    \ code repeatedly. One of the simplest looping structures in C++ is the `while`\
    \ loop. It repeats code as long as a specified condition is true. Here's the syntax:\n\
    \n```cpp\nwhile (condition) {\n    // Code\n}\n```\n\nLet's see an example:\n\n\
    ```cpp\n#include <iostream>\n\nint main() {\n  int count = 0;\n  while (count\
    \ < 5) {\n    std::cout << \"Count: \" << count << std::endl;\n    count++;\n\
    \  }\n  return 0;\n}\n```\n\nIn this example, we declare `count` and use `while`\
    \ to increment it.\n\n### Infinite Loops\n\nBe cautious when using `while` loops,\
    \ as they can lead to infinite loops. An infinite loop is a loop whose condition\
    \ is always true. Here's an example:\n\n```cpp\nwhile (true) {\n    // This is\
    \ an infinite loop\n}\n```\n\nTo avoid infinite loops, make sure your condition\
    \ eventually becomes false.\n\n### The `do-while` Loop\n\nAnother looping construct\
    \ in C++ is the `do-while` loop. It's similar to the `while` loop but it executes\
    \ its block at least once before checking the condition. Here's the syntax:\n\n\
    ```cpp\ndo {\n    // Code at least once\n} while (condition);\n```\n\nLet's see\
    \ an example:\n\n```cpp\n#include <iostream>\n\nint main() {\n  int count = 0;\n\
    \  do {\n    std::cout << \"Count: \" << count << std::endl;\n    count++;\n \
    \ } while (count < 5);\n  return 0;\n}\n```\n\nIn this example, the code inside\
    \ the `do` block is executed first, and then the condition `count < 5` is checked.\
    \ If the condition is true, the loop continues; otherwise, it terminates.\n\n\
    ### Controlling Loops with `break` and `continue`\n\nYou can use the `break` statement\
    \ to exit a loop prematurely. When a `break` statement is encountered within a\
    \ loop, the loop immediately terminates, and the program continues with the next\
    \ statement after the loop. Here's an example:\n\n```cpp\n#include <iostream>\n\
    \nint main() {\n  for (int i = 0; i < 10; i++) {\n    if (i == 5) {\n      std::cout\
    \ << \"Loop terminated at i = \" << i << std::endl;\n      break; // Exit the\
    \ loop when i equals 5\n    }\n    std::cout << \"i = \" << i << std::endl;\n\
    \  }\n  return 0;\n}\n```\n\nIn this example, the `break` statement is triggered\
    \ when `i` equals `5`, causing the loop to terminate.\n\nThe `continue` statement,\
    \ on the other hand, allows you to skip the current iteration of a loop and proceed\
    \ to the next iteration. Here's an example:\n\n```cpp\n#include <iostream>\n\n\
    int main() {\n  for (int i = 0; i < 5; i++) {\n    if (i == 2) {\n      std::cout\
    \ << \"Skipping i = \" << i << std::endl;\n      continue; // Skip the rest of\
    \ the loop body for i = 2\n    }\n    std::cout << \"i = \" << i << std::endl;\n\
    \  }\n  return 0;\n}\n```\n\nIn this example, when `i` is equal to `2`, the `continue`\
    \ statement is encountered, and the loop proceeds to the next iteration, skipping\
    \ the rest of the loop body for that specific value of `i`.\n"
  raw: 'In the world of programming, control structures are your tools for dictating
    the flow of your code. They allow you to make decisions, repeat actions, and execute
    code conditionally. In this chapter, we''ll explore C++ control structures, including
    `if` statements, loops, and more, to help you gain full control over your programs.


    ## Conditional Statements with `if`


    The `if` statement is one of the most fundamental control structures in C++. It
    allows you to execute a block of code conditionally, based on the evaluation of
    a specified condition. Here''s the basic syntax of an `if` statement:


    ```cpp


    if (condition) {


    // Code to execute if ''condition'' is true


    }


    ```


    Let''s break down how `if` statements work with an example:


    ```cpp


    #include <iostream>


    int main() {


    int x = 10;


    if (x > 5) {


    std::cout << "x is greater than 5." << std::endl;


    }


    return 0;


    }


    ```


    In this example, we declare a variable `x` with the value `10`. The `if` statement
    checks if `x` is greater than `5`. If the condition (`x > 5`) is true, the code
    inside the curly braces is executed, and "x is greater than 5." is printed to
    the console.


    ### The `else` Clause


    You can extend the `if` statement with an `else` clause to specify what code to
    execute when the condition is false. Here''s the syntax:


    ```cpp


    if (condition) {


    // Code to execute if ''condition'' is true


    } else {


    // Code to execute if ''condition'' is false


    }


    ```


    Here''s an example:


    ```cpp


    #include <iostream>


    int main() {


    int x = 3;


    if (x > 5) {


    std::cout << "x is greater than 5." << std::endl;


    } else {


    std::cout << "x is not greater than 5." << std::endl;


    }


    return 0;


    }


    ```


    In this case, because `x` is not greater than `5`, the code inside the `else`
    block is executed, and "x is not greater than 5." is printed.


    ### The `else if` Clause


    You can further refine your conditional logic by using the `else if` clause to
    test multiple conditions sequentially. Here''s the syntax:


    ```cpp


    if (condition1) {


    // Code to execute if ''condition1'' is true


    } else if (condition2) {


    // Code to execute if ''condition1'' is false and ''condition2'' is true


    } else {


    // Code to execute if neither ''condition1'' nor ''condition2'' is true


    }


    ```


    Let''s see an example:


    ```cpp


    #include <iostream>


    int main() {


    int x = 10;


    if (x > 15) {


    std::cout << "x is greater than 15." << std::endl;


    } else if (x > 10) {


    std::cout << "x is greater than 10 but not 15." << std::endl;


    } else {


    std::cout << "x is not greater than 10." << std::endl;


    }


    return 0;


    }


    ```


    In this example, the `if` statement checks the conditions in the specified order.
    Since `x` is not greater than `15`, it moves to the next condition, which evaluates
    to true. Therefore, "x is greater than 10 but not 15." is printed.


    ### Nested `if` Statements


    You can also nest `if` statements within one another to create more complex conditional
    logic. Each `if` statement is evaluated independently based on its condition.
    Here''s an example of nested `if` statements:


    ```cpp


    #include <iostream>


    int main() {


    int x = 10;


    int y = 5;


    if (x > 5) {


    std::cout << "x is greater than 5." << std::endl;


    if (y > 3) {


    std::cout << "y is greater than 3." << std::endl;


    }


    }


    return 0;


    }


    ```


    In this example, the outer `if` statement checks if `x` is greater than `5`. If
    this condition is true, it enters the inner `if` statement and checks if `y` is
    greater than `3`. Both conditions are true, so both messages are printed to the
    console.


    ### Short-Circuit Evaluation


    C++ uses short-circuit evaluation when evaluating logical expressions within `if`
    statements. This means that as soon as the result of a logical expression is determined,
    further evaluation is halted if not necessary. For example:


    ```cpp


    if (x > 5 && y > 10) {


    // Code


    }


    ```


    In this case, if `x` is not greater than `5`, the `&&` operator doesn''t bother
    evaluating the second part of the condition (`y > 10`) because the entire expression
    can''t be true if the first part is false.


    ### The Ternary Operator in `if` Statements


    You can use the ternary operator within `if` statements to make concise conditional
    assignments. Here''s an example:


    ```cpp


    #include <iostream>


    int main() {


    int age = 18;


    std::string status = (age >= 18) ? "Adult" : "Minor";


    std::cout << "You are a " << status << "." << std::endl;


    return 0;


    }


    ```


    In this example, the tern


    ary operator `(age >= 18) ? "Adult" : "Minor"` checks if `age` is greater than
    or equal to `18`. If true, it assigns "Adult" to `status`; otherwise, it assigns
    "Minor."


    ## Looping with `while`


    Loops are essential for executing a block of code repeatedly. One of the simplest
    looping structures in C++ is the `while` loop. It repeatedly executes a block
    of code as long as a specified condition is true. Here''s the basic syntax:


    ```cpp


    while (condition) {


    // Code to execute while ''condition'' is true


    }


    ```


    Let''s look at a practical example:


    ```cpp


    #include <iostream>


    int main() {


    int count = 0;


    while (count < 5) {


    std::cout << "Count: " << count << std::endl;


    count++;


    }


    return 0;


    }


    ```


    In this example, we declare a variable `count` and use a `while` loop to print
    its value while the condition `count < 5` is true. After each iteration, `count`
    is incremented by `1`. The loop continues until `count` is no longer less than
    `5`.


    ### Infinite Loops


    Be cautious when using `while` loops, as they can lead to infinite loops if not
    properly controlled. An infinite loop is a loop that never terminates because
    its condition is always true. Here''s an example:


    ```cpp


    while (true) {


    // This is an infinite loop


    }


    ```


    To avoid infinite loops, make sure your loop''s condition will eventually become
    false. In the previous example, `count` eventually becomes `5`, causing the loop
    to terminate.


    ### The `do-while` Loop


    Another looping construct in C++ is the `do-while` loop. It''s similar to the
    `while` loop but with one key difference: it always executes its block of code
    at least once before checking the condition. Here''s the syntax:


    ```cpp


    do {


    // Code to execute at least once


    } while (condition);


    ```


    Let''s see an example:


    ```cpp


    #include <iostream>


    int main() {


    int count = 0;


    do {


    std::cout << "Count: " << count << std::endl;


    count++;


    } while (count < 5);


    return 0;


    }


    ```


    In this example, the code inside the `do` block is executed first, and then the
    condition `count < 5` is checked. If the condition is true, the loop continues;
    otherwise, it terminates. This guarantees that the code inside the `do` block
    runs at least once.


    ### Controlling Loops with `break` and `continue`


    You can use the `break` statement to exit a loop prematurely. When a `break` statement
    is encountered within a loop, the loop immediately terminates, and the program
    continues with the next statement after the loop. Here''s an example:


    ```cpp


    #include <iostream>


    int main() {


    for (int i = 0; i < 10; i++) {


    if (i == 5) {


    std::cout << "Loop terminated at i = " << i << std::endl;


    break; // Exit the loop when i equals 5


    }


    std::cout << "i = " << i << std::endl;


    }


    return 0;


    }


    ```


    In this example, the `break` statement is triggered when `i` equals `5`, causing
    the loop to terminate prematurely.


    The `continue` statement, on the other hand, allows you to skip the current iteration
    of a loop and proceed to the next iteration. Here''s an example:


    ```cpp


    #include <iostream>


    int main() {


    for (int i = 0; i < 5; i++) {


    if (i == 2) {


    std::cout << "Skipping i = " << i << std::endl;


    continue; // Skip the rest of the loop body for i = 2


    }


    std::cout << "i = " << i << std::endl;


    }


    return 0;


    }


    ```


    In this example, when `i` is equal to `2`, the `continue` statement is encountered,
    and the loop proceeds to the next iteration, skipping the rest of the loop body
    for that specific value of `i`.


