    - `#include <iostream>`: This line includes the standard input/output library,
    which provides the `std::cout` object for printing to the console.

    - `int main()`: This is the main function of the program. It serves as the entry
    point for the execution of your code. The `int` before `main` indicates that the
    function returns an integer value.

    - `{}`: These curly braces define the scope of the `main` function. Everything
    between these braces is part of the `main` function.

    - `std::cout << "Hello, World!" << std::endl;`: This line uses the `std::cout`
    object to print the text "Hello, World!" to the console. The `<<` operator is
    used to chain multiple output elements together.

    - `return 0;`: Finally, the `return` statement is used to exit the `main` function
    and return a value to the operating system. In this case, we''re returning 0,
    indicating that the program executed successfully.


    # Variables and Data Types


    In C++, data is fundamental. Every program processes and manipulates data in some
    way. To work with data effectively, you need to understand variables and data
    types.


    ## Variables


    A variable is a named memory location that can hold a value. Think of it as a
    labeled box where you can store and retrieve information. In C++, variable names
    are user-defined, and they should be meaningful to make your code more readable.


    Here''s how you declare a variable in C++:


    ```cpp

    data_type variable_name;

    ```


    - `data_type`: This specifies the type of data the variable can hold. For example,
    `int` is used for integers, `double` for floating-point numbers, and `char` for
    characters.

    - `variable_name`: This is the name you give to the variable. It must follow certain
    naming rules, such as starting with a letter and consisting of letters, digits,
    and underscores.


    Here''s an example:


    ```cpp

    int age; // Declares a variable named ''age'' that can hold integer values.

    ```


    You can also initialize a variable at the time of declaration:


    ```cpp

    int score = 100; // Declares and initializes ''score'' with the value 100.

    ```


    ## Data Types


    C++ provides various data types to represent different kinds of values. Here are
    some common data types:


    - `int`: Represents integers (whole numbers) such as 42 or -17.

    - `double`: Represents floating-point numbers (numbers with decimal points) like
    3.14159 or -0.001.

    - `char`: Represents individual characters, such as ''A'' or ''$''.

    - `bool`: Represents boolean values, which can be either `true` or `false`.


    Variables and data types are the building blocks of C++ programs. They allow you
    to store and manipulate information efficiently.


    # Input and Output


    In many programs, you''ll need to interact with the user by reading input and
    displaying output. C++ provides the `<iostream>` library to handle input and output
    operations.


    ### Output using `std::cout`


    We''ve already seen how to use `std::cout` to display text to the console. Here''s
    a reminder:


    ```cpp

    std::cout << "Hello, World!" << std::endl;

    ```


    You can use `std::cout` to output variables and expressions as well:


    ```cpp

    int age = 25;

    std::cout << "My age is: " << age << std::endl;

    ```


    In this example, we''re using `<<` to concatenate the text "My age is: " with
    the value stored in the `age` variable and then ending the line with `std::endl`
    to move to the next line.


    ### Input using `std::cin`


    To read input from the user, you can use `std::cin`. Here''s how you can prompt
    the user for input and store it in a variable:


    ```cpp

    int number;

    std::cout << "Enter a number: ";

    std::cin >> number;

    ```


    In this code, we use `std::cout` to display a prompt, and then `std::cin` to read
    the user''s input into the `number` variable.


    # Comments


    Comments are essential for documenting your code and making it more understandable
    for both yourself and others who may read your code. In C++, you can add comments
    in two ways:


    - Single-line comments start with `//` and continue until the end of the line.
    For example:


    ```cpp

    // This is a single-line comment.

    ```


    - Multi-line comments start with `/*` and end with `*/`. They can span multiple
    lines. For example:


    ```cpp

    /* This is a

    multi-line comment. */

    ```


    Comments are ignored by the compiler and are meant for human readers of the code.
    They are a valuable tool for explaining your code''s logic, providing context,
    and documenting any tricky parts of your program.


    # Summary


    In this chapter, we''ve laid the foundation for your C++ programming journey.
    You''ve learned how to install a C++ compiler, write your first C++ program, and
    understand the basics of variables and data types. Additionally, we explored input
    and output operations using `std::cin` and `std::cout`, and we discussed the importance
    of comments in documenting your code.


    As you continue your C++ learning journey, remember that practice is key. Experiment
    with code, explore different data types, and get comfortable with input and output
    operations. In the next chapter, we''ll dive deeper into C++ programming concepts,
    including operators and expressions, to further enhance your skills.


    So, keep coding, keep learning!

