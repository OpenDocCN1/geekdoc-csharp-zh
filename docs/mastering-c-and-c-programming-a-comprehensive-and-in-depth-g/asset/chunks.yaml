    \n# 第 15 章：使用 WPF (Windows Presentation Foundation) 构建用户界面\n\n欢迎来到使用 C# WPF (Windows\
    \ Presentation Foundation) 进行现代用户界面开发的世界！在本章中，我们将深入研究为应用程序创建丰富且交互式用户界的世界。我们将探索\
    \ WPF 的核心概念、创建布局、设计控件以及处理事件。通过掌握 WPF，你将能够构建出视觉上且用户友好的界面，增强应用程序的整体用户体验。\n\n## WPF\
    \ 简介\n\nWPF 是 Windows 中的一个图形子系统，为桌面应用程序创建用户界面提供了一个强大的框架。它提供了一种灵活的基于 XAML 的界面设计方法，允许开发者将\
    \ UI 设计与逻辑分离。\n\n### WPF 的主要特性\n\n1. **XAML (可扩展应用程序标记语言)**：WPF 使用 XAML 来定义用户界面，实现了\
    \ UI 与后台代码（code-behind）的分离。\n2. **丰富的控件**：WPF 提供了大量的自定义控件，可以进行样式处理以匹配应用程序的设计。\n\
    3. **布局灵活性**：WPF 引入了强大的布局控件，如 `Grid`、`StackPanel` 和 `DockPanel`，用于创建响应性和动态布局。\n\
    4. **数据绑定**：WPF 支持数据绑定，允许轻松地在 UI 和后端逻辑之间同步数据。\n\n## 创建简单的 WPF 应用程序\n\n让我们从创建一个具有基础界面的简单\
    \ WPF 应用程序。\n\n```xaml\n<Window x:Class=\"WpfApp.MainWindow\"\nxmlns=\"http://schemas.microsoft.com/winfx/2006/xaml/presentation\"\
    \nxmlns:x=\"http://schemas.microsoft.com/winfx/2006/xaml\"\nTitle=\"My First WPF\
    \ App\" Height=\"300\" Width=\"400\">\n  <Grid>\n    <TextBlock HorizontalAlignment=\"\
    Center\" VerticalAlignment=\"Center\" FontSize=\"20\">\n    Welcome to WPF!\n\
    \    </TextBlock>\n  </Grid>\n</Window>\n```\n\n在这个示例中，我们定义了一个包含居中 `TextBlock`\
    \ 的 `Grid` 布局。此 XAML 代表了应用程序。\n\n## WPF 中的布局控件\n\nWPF 提供了多种布局控件来组织和构建用户界面中的元素。\n\
    \n### Grid 布局\n\n```xaml\n<Grid>\n  <Grid.RowDefinitions>\n    <RowDefinition\
    \ Height=\"*\"/>\n    <RowDefinition Height=\"2*\"/>\n  </Grid.RowDefinitions>\n\
    \  <TextBlock Grid.Row=\"0\" Text=\"Top Area\"/>\n  <TextBlock Grid.Row=\"1\"\
    \ Text=\"Bottom Area\"/>\n</Grid>\n```\n\n在这个示例中，我们使用 `Grid` 布局创建了两行。`TextBlock`\
    \ 元素位于不同的行。\n\n### StackPanel\n\n```xaml\n<StackPanel>\n  <Button Content=\"Click\
    \ Me\"/>\n  <Button Content=\"Or Click Me\"/>\n  <Button Content=\"Or Even Click\
    \ Me\"/>\n</StackPanel>\n```\n\n`StackPanel` 在单列或单行中排列元素。\n\n## 样式与模板\n\nWPF 允许使用样式和模板自定义控件的外观。\n\
    \n### 应用样式\n\n```xaml\n<Window.Resources>\n  <Style TargetType=\"Button\">\n \
    \   <Setter Property=\"Background\" Value=\"LightBlue\"/>\n    <Setter Property=\"\
    FontSize\" Value=\"14\"/>\n  </Style>\n</Window.Resources>\n\n<StackPanel>\n \
    \ <Button Content=\"Styled Button 1\"/>\n  <Button Content=\"Styled Button 2\"\
    />\n</StackPanel>\n```\n\n在这个示例中，我们为 `Window` 内的所有 `Button` 定义了样式。该样式更改了按钮的背景颜色和字体大小。\n\
    \n## 数据绑定\n\nWPF 数据绑定功能允许你将 UI 元素绑定到数据源，实现自动同步。\n\n### 绑定数据\n\n```xaml\n<StackPanel>\n\
    \  <TextBlock Text=\"{Binding UserName}\" FontSize=\"18\"/>\n  <TextBox Text=\"\
    {Binding UserName, Mode=TwoWay}\"/>\n</StackPanel>\n```\n\n在这个示例中，我们将 `TextBlock`\
    \ 和 `TextBox` 绑定到 `UserName` 属性。`TextBox` 中的更改会自动反映在 `TextBlock` 中。\n\n## 处理事件\n\
    \nWPF 提供了一个健的事件系统来处理用户交互。\n\n### 事件处理\n\n```xaml\n<Button Content=\"Click Me\"\
    \ Click=\"Button_Click\"/>\n```\n\n```csharp\nprivate void Button_Click(object\
    \ sender, RoutedEventArgs e)\n{\n    MessageBox.Show(\"Button clicked!\");\n}\n\
    ```\n\n在这个示例中，我们在 XAML 中定义了一个 `Button` 并在后台代码中处理其 `Click` 事件。\n\n"
