    # Chapter 4: Operators and Expressions


    In the previous chapters, we laid the foundation for your C++ programming journey
    by introducing you to variables, data types, and the basics of writing C++ code.
    Now, it''s time to explore the world of operators and expressions. Operators are
    symbols or keywords that perform operations on one or more operands, while expressions
    are combinations of operators and operands that produce a result.


    ## Arithmetic Operators


    Arithmetic operators allow you to perform basic mathematical operations in C++.
    These operators work on numeric data types, such as integers and floating-point
    numbers. Here are the common arithmetic operators:


    ### Addition `+`


    The addition operator `+` is used to add two or more values together.


    ```cpp

    int sum = 5 + 3; // ''sum'' will contain the value 8.

    ```


    ### Subtraction `-`


    The subtraction operator `-` is used to subtract the right operand from the left
    operand.


    ```cpp

    int difference = 10 - 4; // ''difference'' will contain the value 6.

    ```


    ### Multiplication `*`


    The multiplication operator `*` is used to multiply two or more values.


    ```cpp

    int product = 6 * 7; // ''product'' will contain the value 42.

    ```


    ### Division `/`


    The division operator `/` is used to divide the left operand by the right operand.


    ```cpp

    double result = 8.0 / 2; // ''result'' will contain the value 4.0.

    ```


    ### Modulus `%`


    The modulus operator `%` returns the remainder when the left operand is divided
    by the right operand.


    ```cpp

    int remainder = 15 % 4; // ''remainder'' will contain the value 3.

    ```


    ### Order of Operations


    When you combine multiple arithmetic operators in an expression, C++ follows the
    standard order of operations (PEMDAS/BODMAS):


    1. Parentheses `( )`: Operations inside parentheses are performed first.

    2. Exponents `^` (though C++ doesn''t use this symbol): Exponentiation is evaluated
    next.

    3. Multiplication `*` and Division `/`: These operators are evaluated from left
    to right.

    4. Addition `+` and Subtraction `-`: These operators are evaluated from left to
    right.


    For example, in the expression `3 + 2 * 4`, multiplication (`2 * 4`) is evaluated
    first, resulting in `8`, and then the addition (`3 + 8`) is performed, yielding
    the final result of `11`.


    You can use parentheses to change the order of operations, just like in regular
    mathematics. For instance, `(3 + 2) * 4` would evaluate to `20`.


    ## Assignment Operators


    Assignment operators are used to assign values to variables. They not only assign
    values but can also perform operations at the same time. Here are some common
    assignment operators:


    ### `=`


    The assignment operator `=` is used to assign a value to a variable.


    ```cpp

    int x = 10; // Assigns the value 10 to ''x''.


    ```


    ### `+=`


    The `+=` operator is a compound assignment operator that adds the right operand
    to the left operand and assigns the result to the left operand.


    ```cpp

    int y = 5;

    y += 3; // Equivalent to y = y + 3; ''y'' becomes 8.

    ```


    ### `-=`


    The `-=` operator subtracts the right operand from the left operand and assigns
    the result to the left operand.


    ```cpp

    int z = 10;

    z -= 2; // Equivalent to z = z - 2; ''z'' becomes 8.

    ```


    ### `*=`


    The `*=` operator multiplies the left operand by the right operand and assigns
    the result to the left operand.


    ```cpp

    int a = 6;

    a *= 4; // Equivalent to a = a * 4; ''a'' becomes 24.

    ```


    ### `/=`


    The `/=` operator divides the left operand by the right operand and assigns the
    result to the left operand.


    ```cpp

    double b = 20.0;

    b /= 5; // Equivalent to b = b / 5; ''b'' becomes 4.0.

    ```


    ### `%=`


    The `%=` operator calculates the remainder when the left operand is divided by
    the right operand and assigns the result to the left operand.


    ```cpp

    int c = 15;

    c %= 7; // Equivalent to c = c % 7; ''c'' becomes 1.

    ```


    Assignment operators are convenient for performing operations on variables and
    updating their values in a concise manner.


    ## Comparison Operators


    Comparison operators are used to compare two values and produce a boolean result
    (`true` or `false`). These operators are often used in conditional statements
    and loops to make decisions. Here are the common comparison operators:


    ### `==`


    The equal to operator `==` checks if two values are equal.


    ```cpp

    int num1 = 5;

    int num2 = 7;

    bool isEqual = (num1 == num2); // ''isEqual'' will be ''false''.

    ```


    ### `!=`


    The not equal to operator `!=` checks if two values are not equal.


    ```cpp

    int x = 10;

    int y = 5;

    bool isNotEqual = (x != y); // ''isNotEqual'' will be ''true''.

    ```


    ### `>`


    The greater than operator `>` checks if the left operand is greater than the right
    operand.


    ```cpp

    int a = 8;

    int b = 6;

    bool isGreater = (a > b); // ''isGreater'' will be ''true''.

    ```


    ### `<`


    The less than operator `<` checks if the left operand is less than the right operand.


    ```cpp

    int p = 3;

    int q = 9;

    bool isLess = (p < q); // ''isLess'' will be ''true''.

    ```


    ### `>=`


    The greater than or equal to operator `>=` checks if the left operand is greater
    than or equal to the right operand.


    ```cpp

    int m = 7;

    int n = 7;

    bool isGreaterOrEqual = (m >= n); // ''isGreaterOrEqual'' will be ''true''.

    ```


    ### `<=`


    The less than or equal to operator `<=` checks if the left operand is less than
    or equal to the right operand.


    ```cpp

    int r = 4;

    int s = 4;

    bool isLessOrEqual = (r <= s); // ''isLessOrEqual'' will be ''true''.

    ```


    Comparison operators are crucial for making decisions in your programs. They are
    often used in `if` statements, loops, and other control structures to determine
    the flow of your code.

