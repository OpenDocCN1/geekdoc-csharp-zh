    与 `while` 循环一样，在使用 `for` 循环时要小心避免死循环。确保你的循环条件最终会变为假。


    ## 使用 `for-each` 循环


    C++ 提供了一种方便的方法来遍历集合（例如数组、vector）中的元素，即使用 `for-each` 循环。这种循环也被称为基于范围的 `for` 循环。它简化了遍历元素的过程，不需要显式的索引。其语法如下：


    ```cpp

    for (element_type element : collection) {

    // 处理 ''element'' 的代码

    }

    ```


    让我们看一个使用数组的示例：


    ```cpp

    #include <iostream>


    int main() {

    int numbers[] = {1, 2, 3, 4, 5};

    for (int number : numbers) {

    std::cout << "Number: " << number << std::endl;

    }

    return 0;

    }

    ```


    在这个示例中，`for-each` 循环遍历 `numbers` 数组中的每个元素，当前元素被存储在变量 `number` 中。循环将每个数字打印到控制台。


    ### `for-each` 中的 `auto` 关键字


    你可以使用 `auto` 关键字让编译器推导出集合中元素的类型。这在处理复杂数据类型时特别有用。这是一个示例：


    ```cpp

    #include <iostream>

    #include <vector>


    int main() {

    std::vector<std::string> fruits = {"Apple", "Banana", "Cherry"};

    for (auto fruit : fruits) {

    std::cout << "Fruit: " << fruit << std::endl;

    }

    return 0;

    }

    ```


    在这个示例中，`auto` 关键字用于遍历一个 `std::vector<std::string>`，`fruit` 的类型由编译器自动推断。


    ## 带有 `while` 和 `for` 的条件循环


    循环通常涉及条件，你可以将 `while` 或 `for` 循环与 `if` 语句结合起来创建更复杂的循环逻辑。例如：


    ```cpp

    #include <iostream>


    int main() {

    int i = 0;

    while (i < 5) {

    if (i % 2 == 0) {

    std::cout << "Even: " << i << std::endl;

    } else {

    std::cout << "Odd: " << i << std::endl;

    }

    i++;

    }

    return 0;

    }

    ```


    在这个示例中，我们使用 `while` 循环从 `0` 迭代到 `4`。在循环内部，我们使用 `if` 语句检查 `i` 的当前值是偶数还是奇数。根据条件，打印
    "Even" 或 "Odd" 以及 `i` 的值。


    同样，你可以将条件逻辑整合到 `for` 循环中以实现程序所需的行为。


    ## 总结


    控制结构是编程中至关重要的工具，用于决策、循环和控制代码流。在本章中，我们探索了 `if`、`else` 和 `else if` 条件语句。


    # 第 6 章：函数与作用域


    在本章中，我们将深入探讨函数和作用域。函数是任何程序的的基础，使程序更容易维护。此外，我们还将探索作用域的概念，它决定了变量的可见性和生命周期。


    ## 理解函数


    ### 什么是函数


    C++ 函数是执行特定任务的命名代码块。函数提供了将程序拆分为更小、更易管理的部分的方法，使开发更加容易。它们还实现了复用，你可以多次调用函数。


    函数的结构如下：


    ```cpp

    return_type function_name(parameters) {

    // 函数体

    // 执行任务的代码

    return result; // 可选的返回语句

    }

    ```


    让我们拆解函数的组件：


    - **返回值 (Return Type)**：指定函数完成后返回的值的数据类型。它可以是任何 C++ 数据类型，如 `int`、`double`、`string`，甚至是不返回任何值的
    `void`。

    - **函数名 (Function Name)**：你选择的表示函数的标识符。它应该具有意义并遵循命名规范。

    - **参数 (Parameters)**：在函数名括号内定义的变量。它们是调用函数时传递值的占位符。函数可以有零或多个参数。

    - **函数体 (Function Body)**：函数体包含执行函数分配的任务的实际代码。它封装在大括号 `{}` 中。

    - **返回语句 (Return Statement)**：用于将值传回调用代码。它是可选的，特别是对于类型为 `void` 的函数。当遇到 `return`
    语句时，函数退出，并将指定的值传回给调用者。


    ### 函数示例


    让我们看一个计算数字平方的简单函数示例：


    ```cpp

    #include <iostream>


    // 函数声明

    int square(int num) {

    int result = num * num;

    return result;

    }


    int main() {

    // 函数调用

    int number = 5;

    int squared = square(number);

    std::cout << "The square of " << number << " is " << squared << std::endl;

    return 0;

    }

    ```

    '
- fmt: '

    In this example, we have a function named `square` that takes an integer parameter
    `num`. Inside the function, we calculate the square of `num` and return the result.
    In the `main` function, we call `square(5)`, passing `5` as the argument. The
    result is stored in the variable `squared` and printed to the console.


    ## Function Prototypes


    In C++, functions are typically declared before they are used. This declaration
    is called a function prototype and provides the compiler with information about
    the function''s return type, name, and parameter list. Function prototypes enable
    you to use functions before their actual definitions in your code.


    Here''s how you declare a function prototype:


    ```cpp

    return_type function_name(parameters);

    ```


    For example:


    ```cpp

    #include <iostream>


    // Function prototype

    int square(int num);


    int main() {

    int number = 5;

    int squared = square(number);

    std::cout << "The square of " << number << " is " << squared << std::endl;

    return 0;

    }


    // Function definition

    int square(int num) {

    int result = num * num;

    return result;

    }

    ```


    In this code, we declare the `square` function prototype at the beginning of the
    program. This allows us to use the `square` function in the `main` function before
    its actual definition at the end of the program.


    ## Function Overloading


    C++ supports function overloading, which allows you to define multiple functions
    with the same name but different parameter lists. The compiler determines which
    function to call based on the number or type of arguments passed.


    Here''s an example of function overloading:


    ```cpp

    #include <iostream>


    // Function to add two integers

    int add(int a, int b) {

    return a + b;

    }


    // Function to add two doubles

    double add(double a, double b) {

    return a + b;

    }


    int main() {

    int sum_int = add(5, 10);

    double sum_double = add(3.5, 2.7);

    std::cout << "Sum of integers: " << sum_int << std::endl;

    std::cout << "Sum of doubles: " << sum_double << std::endl;

    return 0;

    }

    ```


    In this example, we have two `add` functions with different parameter types (integers
    and doubles). When we call `add`, the compiler selects the appropriate version
    of the function based on the argument types.


    ## Default Arguments


    C++ allows you to specify default values for function parameters. This means that
    if a caller doesn''t provide a value for a particular parameter, the default value
    will be used. Default arguments make functions more flexible and can simplify
    function calls.


    Here''s an example:


    ```cpp

    #include <iostream>


    // Function with default argument

    int power(int base, int exponent = 2) {

    int result = 1;

    for (int i = 0; i < exponent; i++) {

    result *= base;

    }

    return result;

    }


    int main() {

    int square = power(5); // Uses default exponent value of 2

    int cube = power(3, 3); // Provides custom exponent value

    std::cout << "Square: " << square << std::endl;

    std::cout << "Cube: " << cube << std::endl;

    return 0;

    }

    ```


    In this code, the `power` function has a default argument of `2` for the `exponent`
    parameter. When we call `power(5)`, it calculates the square (since we didn''t
    provide an exponent) using the default value. When we call `power(3, 3)`, we specify
    a custom exponent value of `3`.


    ## Scope of Variables


    Scope refers to the region or context in which a variable is defined and can be
    accessed. In C++, variables have different scopes, and their visibility and lifetime
    depend on where they are declared.


    ### Local Scope


    Variables declared within a function are said to have local scope. They are accessible
    only within that function and are not visible to other functions or code outside
    of the function. When a function exits, its local variables are destroyed.


    ```cpp

    #include <iostream>


    void myFunction() {

    int x = 10; // Local variable with scope limited to myFunction

    std::cout << "Inside myFunction: x = " << x << std::endl;

    }


    int main() {

    myFunction();

    // Uncommenting the line below would

    result in an error

    // std::cout << "Outside myFunction: x = " << x << std::endl;

    return 0;

    }

    ```


    In this example, the variable `x` declared inside `myFunction` is local to that
    function. It cannot be accessed from `main`, as attempting to do so would result
    in an error.


    ### Global Scope


    Variables declared outside of any function, typically at the beginning of a program,
    have global scope. They are visible and accessible throughout the entire program,
    including all functions.


    ```cpp

    #include <iostream>


    int globalVar = 20; // Global variable with program-wide scope

    void myFunction() {

    std::cout << "Inside myFunction: globalVar = " << globalVar << std::endl;

    }


    int main() {

    std::cout << "In main: globalVar = " << globalVar << std::endl;

    myFunction();

    return 0;

    }

    ```


    In this code, `globalVar` is declared at the global scope and is accessible both
    within `main` and `myFunction`.


    ### Scope Resolution Operator (::)


    In cases where there''s a local variable with the same name as a global variable,
    you can use the scope resolution operator `::` to specify which variable you want
    to access.


    ```cpp

    #include <iostream>


    int x = 10; // Global variable


    void myFunction() {

    int x = 5; // Local variable with the same name as global variable

    std::cout << "Local x: " << x << std::endl;

    std::cout << "Global x: " << ::x << std::endl; // Access the global x

    }


    int main() {

    myFunction();

    return 0;

    }

    ```


    ## Lifetime of Variables


    The lifetime of a variable is the duration for which it exists in memory and holds
    a valid value. The lifetime of a variable depends on its scope and storage duration.


    ### Automatic Storage Duration


    Variables with automatic storage duration (the default for local variables) have
    a lifetime that begins when the program execution enters the block in which the
    variable is defined and ends when the block is exited. In other words, they are
    created when the function is called and destroyed when the function exits.


    ```cpp

    #include <iostream>


    void myFunction() {

    int x = 10; // Local variable with automatic duration

    std::cout << "Inside myFunction: x = " << x << std::endl;

    } // x goes out of scope and is destroyed here


    int main() {

    myFunction();

    // Uncommenting the line below would result in an error

    // std::cout << "Outside myFunction: x = " << x << std::endl;

    return 0;

    }

    ```


    In this code, the variable `x` has automatic storage duration and is created when
    `myFunction` is called and destroyed when the function exits. Attempting to access
    `x` outside of the function would result in an error.


    ### Static Storage Duration


    Variables with static storage duration (global variables or local variables declared
    as `static`) have a lifetime that extends throughout the entire program execution.
    They are created when the program starts and destroyed when the program exits.


    ```cpp

    #include <iostream>


    void myFunction() {

    static int x = 10; // Static local variable with static storage duration

    std::cout << "Inside myFunction: x = " << x << std::endl;

    } // x retains its value and persists for the entire program lifetime


    int main() {

    myFunction();

    myFunction(); // x will still be 10 if it were incremented, but here it just persists

    return 0;

    }

    ```


    In this example, the variable `x` is a static local variable. It is created when
    `myFunction` is first called, retains its value between function calls, and is
    destroyed when the program exits.


    ### Dynamic Storage Duration


    Variables with dynamic storage duration are created and destroyed explicitly by
    the programmer using dynamic memory allocation functions like `new` and `delete`
    (or `malloc` and `free` in C). They have a lifetime determined by the programmer.

