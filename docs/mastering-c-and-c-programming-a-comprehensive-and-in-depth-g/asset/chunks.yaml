    ## Generics: Type-Safe Reusability


    Generics allow you to create classes, methods, and interfaces that work with different
    data types while maintaining type safety. They provide a way to create reusable
    code that adapts to different data requirements.


    ### Creating Generic Classes


    A generic class is a class that can work with different types. For example, a
    `List<T>` class can hold elements of any type `T`.


    ```csharp

    using System;

    using System.Collections.Generic;

    class Program

    {

    static void Main()

    {

    List<int> intList = new List<int>();

    intList.Add(5);

    intList.Add(10);

    List<string> stringList = new List<string>();

    stringList.Add("Hello");

    stringList.Add("World");

    foreach (int number in intList)

    {

    Console.WriteLine(number);

    }

    foreach (string str in stringList)

    {

    Console.WriteLine(str);

    }

    }

    }

    }

    ```


    In this example, we demonstrate the use of the generic `List<T>` class for both
    integers and strings.


    ### Creating Generic Methods


    Generic methods allow you to create methods that can work with different data
    types without rewriting code.


    ```csharp

    using System;

    class Program

    {

    static void Swap<T>(ref T a, ref T b)

    {

    T temp = a;

    a = b;

    b = temp;

    }

    static void Main()

    {

    int x = 5, y = 10;

    Console.WriteLine("Before: x = " + x + ", y = " + y);

    Swap(ref x, ref y);

    Console.WriteLine("After: x = " + x + ", y = " + y);

    }

    }

    }

    ```


    Here, the `Swap` method is generic, allowing us to swap values of different types
    using the same code.


    ## Constraints in Generics


    You can apply constraints to generic type parameters to limit the types that can
    be used. Common constraints include `where T : class` (reference type), `where
    T : struct` (value type), and `where T : new()` (parameterless constructor).


    ```csharp

    using System;

    class Program

    {

    static T FindMax<T>(T[] array) where T : IComparable<T>

    {

    T max = array[0];

    foreach (T item in array)

    {

    if (item.CompareTo(max) > 0)

    {

    max = item;

    }

    }

    return max;

    }

    static void Main()

    {

    int[] numbers = { 5, 10, 3, 8, 2 };

    int maxNumber = FindMax(numbers);

    Console.WriteLine("Maximum number: " + maxNumber);

    string[] words = { "apple", "banana", "cherry" };

    string maxWord = FindMax(words);

    Console.WriteLine("Maximum word: " + maxWord);

    }

    }

    }

    ```


    In this example, the `FindMax` method uses the `where T : IComparable<T>` constraint
    to ensure that the generic type parameter `T` implements the `IComparable<T>`
    interface, allowing comparisons.


    ## Conclusion


    In this chapter, we''ve explored the world of collections and generics in C#.
    We''ve learned how collections allow us to manage groups of data efficiently using
    various data structures, including lists, dictionaries, queues, and stacks. We''ve
    also delved into the power of generics, which enable us to write reusable and
    type-safe code that can work with different data types.


    By mastering collections and generics, you''ll be equipped with essential skills
    to manipulate data effectively and create versatile and maintainable code. Whether
    you''re building data-driven applications or creating reusable components, these
    concepts will play a vital role in your programming journey. So, embrace the power
    of collections and generics, and let your code flourish with flexibility, reusability,
    and efficiency!


    # Chapter 12: Delegates, Events, and Lambdas


    Welcome to the world of delegates, events, and lambdas in C#! In this chapter,
    we''ll explore powerful tools that enable you to create more flexible and responsive
    programs. We''ll dive into delegates, which allow you to treat methods as objects,
    events that facilitate communication between components, and lambdas that enable
    concise and expressive code. By mastering these concepts, you''ll elevate your
    programming skills and design applications that are more modular, interactive,
    and elegant.


    ## Delegates: Function Pointers in C#


    Delegates are a fundamental concept in C# that allow you to treat methods as first-class
    objects. They provide a way to encapsulate and pass methods as parameters, enabling
    dynamic and modular programming.


    ### Defining and Using Delegates


    A delegate is a type that represents a reference to a method with a specific signature.
    It provides a way to invoke methods indirectly through the delegate instance.


    ```csharp

    using System;

    delegate int Calculator(int a, int b);

    class Program

    {

    static int Add(int x, int y)

    {

    return x + y;

    }

    static int Multiply(int x, int y)

    {

    return x * y;

    }

    static void Main()

    {

    Calculator calc = Add;

    int result = calc(5, 3);

    Console.WriteLine("Addition result: " + result);

    calc = Multiply;

    result = calc(5, 3);

    Console.WriteLine("Multiplication result: " + result);

    }

    }

    }

    ```


    In this example, we define a delegate `Calculator` that represents methods with
    two `int` parameters and `int` return type. We assign assign `Add` and `Multiply`
    to the delegate instance and invoke them.


    ### Multicast Delegates


    A multicast delegate is a delegate that can hold multiple methods. When invoked,
    all methods are called in the order they were added.


    ```csharp

    using System;

    delegate void Logger(string message);

    class Program

    {

    static void LogToFile(string message)

    {

    Console.WriteLine("Logging to file: " + message);

    }

    static void LogToConsole(string message)

    {

    Console.WriteLine("Logging to console: " + message);

    }

    static void Main()

    {

    Logger log = LogToFile;

    log += LogToConsole;

    log("Hello, delegates!");

    log -= LogToConsole;

    log("Console removed.");

    }

    }

    ```


    Here, we define a multicast delegate `Logger` that can hold references to methods
    `LogToFile` and `LogToConsole`. We observe their execution.


    ## Events: Enabling Component Communication


    Events are a mechanism for communication between different components. They allow
    objects to subscribe to and receive notifications when certain actions occur.


    ### Defining and Using Events


    An event is a delegate with restrictions on how it can be used. It can only be
    invoked within the class where it is defined and can be subscribed to from outside.


    ```csharp

    using System;

    class Publisher

    {

    public event Action<string> NewMessage;

    public void PublishMessage(string message)

    {

    NewMessage?.Invoke(message);

    }

    }

    class Subscriber

    {

    public void OnNewMessage(string message)

    {

    Console.WriteLine("Received message: " + message);

    }

    }

    class Program

    {

    static void Main()

    {

    Publisher publisher = new Publisher();

    Subscriber subscriber = new Subscriber();

    publisher.NewMessage += subscriber.OnNewMessage;

    publisher.PublishMessage("Hello, events!");

    publisher.NewMessage -= subscriber.OnNewMessage;

    }

    }

    ```


    In this example, we define an event `NewMessage` in the `Publisher` class and
    subscribe to it using the `Subscriber` class. When the `PublishMessage` method
    is called, the event is invoked, and the `OnNewMessage` method in the subscriber
    is executed.


    ## Lambdas: Concise Anonymous Functions


    Lambdas provide a concise way to define anonymous functions in C#. They are particularly
    useful when you need to provide a short piece of code as an argument to a method
    or delegate.


    ### Using Lambdas with Delegates


    Lambdas can be used to define inline methods that match the signature of a delegate.


    ```csharp

    using System;

    delegate int Operation(int a, int b);

    class Program

    {

    static void Main()

    {

    Operation add = (x, y) => x + y;

    Operation multiply = (x, y) => x * y;

    Console.WriteLine("Addition: " + add(5, 3));

    Console.WriteLine("Multiplication: " + multiply(5, 3));

    }

    }

    }

    ```


    In this example, we define delegates `add` and `multiply` using lambdas. The lambda
    expressions define inline methods that perform addition and multiplication.


