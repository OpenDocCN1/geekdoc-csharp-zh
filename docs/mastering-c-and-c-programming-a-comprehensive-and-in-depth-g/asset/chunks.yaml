    \ and behaviors of the derived class are \"sliced off,\" leaving only the base\
    \ class part.\n\nHere's an example illustrating object slicing:\n\n```cpp\nclass\
    \ Base {\npublic:\n    int baseValue;\n    Base(int value) : baseValue(value)\
    \ {}\n    virtual void display() const {\n        std::cout << \"Base: \" << baseValue\
    \ << std::endl;\n    }\n};\n\nclass Derived : public Base {\npublic:\n    int\
    \ derivedValue;\n    Derived(int baseVal, int derivedVal) : Base(baseVal), derivedValue(derivedVal)\
    \ {}\n    void display() const override {\n        std::cout << \"Derived: \"\
    \ << baseValue << \", \" << derivedValue << std::endl;\n    }\n};\n\nint main()\
    \ {\n    Derived derivedObj(42, 101);\n    Base baseObj = derivedObj; // Object\
    \ slicing\n    baseObj.display(); // Calls Base's display()\n    return 0;\n}\n\
    ```\n\nIn this code, we have a base class `Base` and a derived class `Derived`.\
    \ The `Derived` class extends the base class by adding an additional attribute\
    \ `derivedValue`. In the `main()` function, we create a `Derived` object and then\
    \ assign it to a `Base` object. This assignment results in object slicing.\n\n\
    When we call `baseObj.display()`, it calls the `display()` method of the base\
    \ class, not the derived class, because `baseObj` is a `Base` object.\n"
