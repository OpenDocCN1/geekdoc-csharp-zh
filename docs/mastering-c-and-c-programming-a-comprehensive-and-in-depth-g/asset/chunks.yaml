    \n### 虚拟函数\n\n为了实现多态和动态绑定，可以使用虚拟函数。虚拟函数在基类中通过 `virtual` 关键字声明，并可以在派生类中被重写。当通过基类类型的指针或引用访问派生类对象时，会在运行时调用相应的派生类虚拟函数。\n\
