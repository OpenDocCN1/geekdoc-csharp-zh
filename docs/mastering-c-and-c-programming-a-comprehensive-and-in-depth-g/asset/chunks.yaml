    \ 调用 add<int>(5, 10)\ndouble result2 = add(3.5, 2.7);    // 调用 add<double>(3.5,\
    \ 2.7)\n```\n\n### 类模板\n\n类模板将模板的概念扩展到类。它们允许你创建处理不同数据类型的泛型类。这是一个泛型栈的类模板示例：\n\n\
    ```cpp\ntemplate <typename T>\nclass Stack {\nprivate:\n    std::vector<T> elements;\n\
    public:\n    void push(T value) {\n        elements.push_back(value);\n    }\n\
    \    T pop() {\n        if (empty()) {\n            throw std::runtime_error(\"\
    Stack is empty\");\n        }\n        T top = elements.back();\n        elements.pop_back();\n\
