    \n### 多态行为\n\n多态允许你将派生类对象视为基类的实例。这在处理对象集合时特别有用。\n\n```csharp\nList<Shape> shapes\
    \ = new List<Shape>();\nshapes.Add(new Circle());\nshapes.Add(new Square());\n\
