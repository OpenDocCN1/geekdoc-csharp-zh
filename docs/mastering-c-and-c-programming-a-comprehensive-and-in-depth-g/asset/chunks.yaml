  trans: "\n\n想象你被要求打印五次“Hello, World!”。与其编写五行相同的代码，不如使用循环来自动处理这些重复性任务。\n\n### `for`\
    \ 循环\n\n`for` 循环是按特定次数重复代码块的常用方法。\n\n```csharp\nfor (int i = 0; i < 5; i++)\n\
    {\n    Console.WriteLine(\"Hello, World!\");\n}\n```\n\n在这个示例中，循环将执行五次 `Console.WriteLine`\
    \ 语句，每次都会增加 `i` 的值。\n\n### `while` 循环\n\n`while` 循环在指定条件保持为 `true` 的情况下会继续执行代码块。\n\
    \n```csharp\nint countdown = 10;\nwhile (countdown > 0)\n{\n    Console.WriteLine(\"\
    Countdown: \" + countdown);\n    countdown--;\n}\n```\n\n这段代码将显示从 10 到 1 的倒计时。\n\
    \n### `do while` 循环\n\n与 `while` 循环类似，`do while` 循环在条件保持为 `true` 的情况下也会重复代码块。关键区别在于是在执行代码块后检查条件，确保代码至少运行一次。\n\
    \n```csharp\nint count = 0;\ndo\n{\n    Console.WriteLine(\"Count: \" + count);\n\
    \    count++;\n} while (count < 5);\n```\n\n此循环将显示数字 0 到 4。\n\n## 组合控制结构\n\n你可以将条件语句和循环结合起来创建更复杂、更灵活的程序。\n\
    \n```csharp\nfor (int i = 1; i <= 100; i++)\n{\n    if (i % 3 == 0 && i % 5 ==\
    \ 0)\n    {\n        Console.WriteLine(\"FizzBuzz\");\n    }\n    else if (i %\
    \ 3 == 0)\n    {\n        Console.WriteLine(\"Fizz\");\n    }\n    else if (i\
    \ % 5 == 0)\n    {\n        Console.WriteLine(\"Buzz\");\n    }\n    else\n  \
    \  {\n        Console.WriteLine(i);\n    }\n}\n```\n\n在这个示例中，我们使用循环遍历从 1 到 100\
    \ 的数字。根据数字是否能被 3、5 或两者整除，我们显示 \"Fizz\"、Buzz\"、FizzBuzz\" 或数字本身。\n\n## 结论\n\n在本章中，我们深入研究了\
    \ C# 中控制流和决策的世界。我们探索了 `if`、`else` 和 `else if` 等条件语句，它们允许我们的程序根据条件做出决策。我们还发现了 `for`、`while`\
    \ 和 `do while` 等循环结构的力量，使我们能够自动处理重复任务并对数据进行迭代。\n\n通过结合这些控制结构，你可以创建对不同场景动态响应的复杂程序。在你继续\
    \ C# 编程之旅时，请记住掌握控制流对于构建高效、灵活且健壮的应用至关重要。因此，拥抱决策和循环的力量，让你的代码活起来吧！\n\n# 第 4 章：循环与迭代\n\
    \n欢迎来到循环和迭代的世界，在这里我们开启了在 C# 程序中重复操作和高效处理数据的能力。循环是基本的工具，允许我们节省时间、减少冗余并优雅地处理重复任务。在本章中，我们将探索不同类型的循环，学习如何控制它们的行为，并发现迭代在现代编程中起着关键作用。\n\
    \n## 循环的力量\n\n想象你是一个老师，有一份学生名单，你需要给他们的作业打分。与其手动为每份作业评分，不如使用循环来自动处理这一过程。循环允许我们多次执行某项任务，而无需反复编写相同的代码。\n\
    \n### `for` 循环\n\n`for` 循环是一种多功能且常用的迭代结构。它允许你指定代码块执行的次数。\n\n```csharp\nfor (int\
    \ i = 1; i <= 5; i++)\n{\n    Console.WriteLine(\"Iteration: \" + i);\n}\n```\n\
    \n在这个示例中，循环将执行五次，每次都会增加 `i` 的值。\n\n### 控制循环行为\n\n循环可以进行定制化以适应各种场景。你可以通过调整初始化、条件和迭代表达式来控制循环行为。\n\
    \n```csharp\nfor (int i = 10; i >= 0; i -= 2)\n{\n    Console.WriteLine(\"Countdown:\
    \ \" + i);\n}\n```\n\n在这里，循环将通过每次迭代减去 2，从 10 倒计时到 0。\n\n### `while` 循环\n\n`while`\
    \ 循环在指定条件保持为 `true` 的情况下重复执行代码块。\n\n```csharp\nint number = 1;\nwhile (number\
    \ <= 5)\n{\n    Console.WriteLine(\"Number: \" + number);\n    number++;\n}\n\
    ```\n\n此循环将显示从 1 到 5 的数字。\n\n### `do while` 循环\n\n`do while` 循环与 `while` 循环类似，但它保证无论条件的初始值如何，代码块至少会被执行一次。\n\
    \n```csharp\nint count = 0;\ndo\n{\n    Console.WriteLine(\"Count: \" + count);\n\
    \    count++;\n} while (count < 5);\n```\n\n在这里，循环将显示从 0 到 4 的数字。\n\n## 循环控制语句\n\
    \n### `break` 语句\n\n`break` 语句允许提前退出循环，即使循环条件尚未满足。\n\n```csharp\nfor (int i =\
    \ 0; i < 10; i++)\n{\n    if (i == 5)\n    {\n        break;\n    }\n    Console.WriteLine(i);\n\
    }\n```\n\n在这个示例中，当 `i` 达到 5 时，循环将停止。\n\n### `continue` 语句\n\n`continue` 语句允许跳过当前迭代并继续下一次。\n\
    \n```csharp\nfor (int i = 0; i < 5; i++)\n{\n    if (i == 2)\n    {\n        continue;\n\
    \    }\n    Console.WriteLine(i);\n}\n```\n\n在这里，循环将跳过 `i` 为 2 的迭代。\n\n## 嵌套循环\n\
    \n循环可以相互嵌套以实现复杂的模式。\n\n```csharp\nfor (int i = 1; i <= 3; i++)\n{\n    for (int\
    \ j = 1; j <= 3; j++)\n    {\n        Console.WriteLine(\"i: \" + i + \", j: \"\
    \ + j);\n    }\n}\n```\n\n在这个示例中，对于每个 `i` 的值，内部循环都会运行三次。\n\n## 无限循环\n\n在编写循环时要小心避免出现无限循环，即条件永远不会变为\
    \ `false`。这会导致程序挂起或崩溃。\n\n```csharp\nwhile (true)\n{\n    Console.WriteLine(\"\
    这是一个无限循环！\");\n}\n```\n\n要退出无限循环，你可以使用 `break` 语句或包含一个变为 `false` 的条件。\n\n## 结论\n\
    \n在本章中，我们开启了 C# 循环和迭代的之旅。我们探索了循环在自动处理重复任务和应对各种场景的力量。我们深入了 `for`、`while` 和 `do\
    \ while` 循环，它们提供了不同的重复控制方式。\n\n我们学习了如何通过调整初始化、条件和迭代表达式来定制循环行为。此外，我们发现了 `break`\
    \ 和 `continue` 等循环控制语句，它们提供了改变循环执行流的方法。\n\n# 第 5 章：函数与方法\n\n欢迎来到函数和方法领域，它们是 C#\
    \ 模块化编程的构建模块。函数和方法允许我们将复杂任务分解为更小、易于管理的代码。在本章中，我们将探索函数的基础、语法以及它们如何增强代码的可用性、可读性和可维护性。\n\
    \n## 函数的本质\n\n想象你正在烘焙蛋糕。与其一次性完成混合原料、烘烤蛋糕和装饰，不如将过程分解为几个步骤。每个步骤都专注于一个特定任务，使得整个过程更加顺畅。同样，函数允许我们将程序分解为执行特定任务的较小、自包含的模块。\n\
