    ### 嵌套 `if` 语句\n\n你还可以将 `if` 语句嵌套在一起以创建更复杂的条件逻辑。每个 `if` 语句都会根据其条件独立求值。以下是一个嵌套\
    \ `if` 语句的示例：\n\n```cpp\n#include <iostream>\n\nint main() {\n  int x = 10;\n\
    \  int y = 5;\n  if (x > 5) {\n    std::cout << \"x is greater than 5.\" << std::endl;\n\
    \    if (y > 3) {\n      std::cout << \"y is greater than 3.\" << std::endl;\n\
    \    }\n  }\n  return 0;\n}\n```\n\n在这个示例中，外部的 `if` 语句检查 `x` 是否大于 `5`。如果该条件为真，它进入内部的\
    \ `if` 语句并检查 `y` 是否大于 `3`。两个条件都为真，因此两条消息都打印到控制台。\n\n### 短路求值\n\nC++ 在求值 `if` 语句内的逻辑表达式时使用短路求值。这意味着一旦逻辑表达式的结果确定，如果没有必要，将停止进一步的评估。例如：\n\
    \n```cpp\nif (x > 5 && y > 10) {\n    // 代码\n}\n```\n\n在这种情况下，如果 `x` 不大于 `5`，`&&`\
    \ 运算符就不会去评估条件的后部分（`y > 10`），因为如果第一部分为假，整个表达式就不可能为真。\n\n### `if` 语句中的三元运算符\n\n\
    你可以在 `if` 语句中使用三元运算符来进行简洁的条件赋值。这是一个示例：\n\n```cpp\n#include <iostream>\n\nint main()\
    \ {\n  int age = 18;\n  std::string status = (age >= 18) ? \"Adult\" : \"Minor\"\
    ;\n  std::cout << \"You are \" << status << \".\" << std::endl;\n  return 0;\n\
    }\n```\n*(注：原文示例代码块似乎不完整，此处已根据逻辑补全并翻译)*\n\n## 使用 `while` 循环\n\n循环对于重复执行代码至关重要。C++\
    \ 中简单的循环结构之一是 `while` 循环。它只要条件为真就会执行代码。其语法如下：\n\n```cpp\nwhile (condition) {\n\
    \    // 代码\n}\n```\n\n来看一个示例：\n\n```cpp\n#include <iostream>\n\nint main() {\n\
    \  int count = 0;\n  while (count < 5) {\n    std::cout << \"Count: \" << count\
    \ << std::endl;\n    count++;\n  }\n  return 0;\n}\n```\n\n在这个示例中，我们声明了 `count`\
    \ 并使用 `while` 来增加它。\n\n### 无限循环\n\n在使用 `while` 循环时要小心，因为可能会导致无限循环。无限循环是指条件始终为真的循环。这是一个示例：\n\
    \n```cpp\nwhile (true) {\n    // 这无限循环\n}\n```\n\n为了避免无限循环，请确保你的条件会变为假。\n\n###\
    \ `do-while` 循环\n\nC++ 的另一种循环结构是 `do-while` 循环。它与 `while` 循环相似，但它在检查条件之前至少执行一次代码块。其语法如下：\n\
    \n```cpp\ndo {\n    // 代码至少一次\n} while (condition);\n```\n\n来看一个示例：\n\n```cpp\n\
    #include <iostream>\n\nint main() {\n  int count = 0;\n  do {\n    std::cout <<\
    \ \"Count: \" << count << std::endl;\n    count++;\n  } while (count < 5);\n \
    \ return 0;\n}\n```\n\n在这个示例中，首先执行 `do` 块中的代码，然后检查条件 `count < 5`。如果条件为真，循环继续；否则，终止。\n\
    \n### 使用 `break` 和 `continue` 控制循环\n\n你可以使用 `break` 语句提前退出循环。当在循环中遇到 `break` 语句时，循环会立即终止，程序继续执行循环后的语句。这是一个示例：\n\
    \n```cpp\n#include <iostream>\n\nint main() {\n  for (int i = 0; i < 10; i++)\
    \ {\n    if (i == 5) {\n      std::cout << \"Loop terminated at i = \" << i <<\
    \ std::endl;\n      break; // 当 i 等于 5 时退出循环\n    }\n    std::cout << \"i = \"\
