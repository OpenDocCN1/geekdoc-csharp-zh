    ## Accessing Attributes and Methods


    Once you have created an object, you can access its attributes and methods using
    the dot (`.`) operator. This operator allows you to interact with the object and
    perform various operations.


    ### Accessing Attributes


    To access the attributes (member variables) of an object, you use the dot operator
    followed by the attribute name. However, keep in mind that if the attributes are
    defined as private, you should use public member functions (methods) to access
    and modify them, ensuring proper encapsulation.


    Here''s how you access attributes:


    ```cpp


    objectName.attributeName = value; // Set the value of an attribute


    data_type attributeValue = objectName.attributeName; // Get the value of an attribute


    ```


    For our `Person` class, you can access the `name` and `age` attributes as follows:


    ```cpp


    std::string name = person1.getName(); // Get the name attribute


    int age = person1.getAge(); // Get the age attribute


    ```


    ### Invoking Methods


    Methods (member functions) define the behavior of objects. You can invoke methods
    on objects to perform specific actions or retrieve data. To call a method on an
    object, use the dot operator followed by the method name and any required parameters.


    Here''s how you invoke methods:


    ```cpp


    objectName.methodName(parameters); // Call a method


    ```


    In our `Person` class, we can call the `getName` and `getAge` methods to retrieve
    the name and age of a person:


    ```cpp


    std::string name = person1.getName(); // Call the getName method


    int age = person1.getAge(); // Call the getAge method


    ```


    ## Constructors and Destructors


    Constructors and destructors are special member functions in C++ classes that
    are used for object initialization and cleanup, respectively.


    ### Constructors


    A constructor is a member function that is automatically called when an object
    of the class is created. It initializes the object''s attributes, allocates resources,
    and performs any necessary setup. Constructors have the same name as the class
    and can have parameters for custom initialization.


    Here''s an example of a constructor in our `Person` class:


    ```cpp


    Person(std::string n, int a) : name(n), age(a) {}


    ```


    In this code, `Person` is the constructor, and it takes two parameters, `n` for
    the name and `a` for the age, to initialize the `name` and `age` attributes of
    the object.


    ### Destructors


    A destructor is a member function with a special name preceded by the tilde (`~`)
    character, such as `~ClassName()`. It is automatically called when an object goes
    out of scope or is explicitly deleted. Destructors are used to release resources,
    close files, or perform any necessary cleanup for an object.


    Here''s an example of a destructor in our `Person` class:


    ```cpp


    ~Person() {


    // Destructor code here (if needed)


    }


    ```


    In this case, the destructor for the `Person` class is empty because there are
    no resources to release, but you can include cleanup code as needed.


    ## Member Access Control


    In C++, class members (attributes and methods) can have different access control
    specifiers that determine their visibility and accessibility from outside the
    class. There are three primary access control specifiers: `public`, `protected`,
    and `private`.


    ### Public


    Members declared as `public` are accessible from anywhere in the program, including
    outside the class. They provide a public interface to the class and can be used
    to interact with objects of the class.


    ### Protected


    Members declared as `protected` are accessible within the class and by derived
    classes. They are not directly accessible from outside the class but can be accessed
    by derived classes if the inheritance relationship is established.


    ### Private


    Members declared as `private` are only accessible within the class. They are not
    visible or accessible from outside the class, ensuring strong encapsulation.


    Here''s an example


    demonstrating access control in a class:


    ```cpp


    class MyClass {


    public:


    int publicMember; // Public member


    protected:


    int protectedMember; // Protected member


    private:


    int privateMember; // Private member


    };


    ```


    In this code, `publicMember` is accessible from anywhere, `protectedMember` can
    be accessed by derived classes, and `privateMember` is only accessible within
    the `MyClass` itself.


    ## Static Members


    In addition to regular instance (non-static) members, C++ classes can have static
    members. Static members belong to the class itself rather than to specific instances
    of the class. They are shared among all objects of the class and can be accessed
    without creating an instance.


    ### Static Variables


    Static variables are declared using the `static` keyword within the class. They
    are often used to represent data that is shared across all objects of the class.


    Here''s an example of a static variable:


    ```cpp


    class MyClass {


    public:


    static int staticVar; // Static variable


    };


    ```


    In this code, `staticVar` is a static variable belonging to the `MyClass` class.
    It is shared among all instances of the class.


    ### Static Methods


    Static methods (member functions) are declared using the `static` keyword and
    do not operate on instance-specific data. They can only access static members
    of the class.


    Here''s an example of a static method:


    ```cpp


    class MyClass {


    public:


    static void staticMethod() {


    // Static method code here


    }


    };


    ```


    Static methods are called on the class itself, not on instances of the class:


    ```cpp


    MyClass::staticMethod(); // Call the static method


    ```


    ## Const-Correctness


    Const-correctness is a concept that involves ensuring that objects and their member
    functions behave as expected when declared as `const`. It is a good practice to
    use `const` to indicate that an object or a member function does not modify the
    object''s state.


    ### Const Member Functions


    You can declare member functions as `const` to indicate that they do not modify
    the object''s data. This allows these functions to be called on `const` objects
    and ensures that the object''s state remains unchanged.


    Here''s an example of a const member function:


    ```cpp


    class MyClass {


    public:


    int getData() const {


    return data;


    }


    private:


    int data;


    };


    ```'
