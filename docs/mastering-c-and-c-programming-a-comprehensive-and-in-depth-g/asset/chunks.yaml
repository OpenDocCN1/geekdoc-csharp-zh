  trans: "\n\n在本章中，我们将探索 C++ 中数组和字符串的核心概念。这些数据结构是组织和操作数据集合的基础，无论它是数字列表、字符列表还是更复杂的信息。\n\
    \n## 数组\n\n### 什么是数组？\n\n数组是一种数据结构，允许你在单个变量名下存储多个相同数据类型的值。你可以将其视为相关元素的集合，所有元素都存储在连续的内存位置中。数组在编程中被广泛使用，因为它们为处理大型数据集提供了一种高效的方法。\n\
    \n以下是在 C++ 中声明数组的方法：\n\n```cpp\ndata_type array_name[array_size];\n```\n\n- `data_type`:\
    \ 指定数组中元素的数据类型，例如 `int`、`double` 或 `char`。\n- `array_name`: 你为数组选择的名称。\n- `array_size`:\
    \ 数组可以容纳的元素数量。数组一旦声明，该大小就是固定不变的。\n\n### 数组初始化\n\n你可以在声明数组时通过提供一个包含在大括号 `{}` 内的值列表来初始化数组。值的数量必须与数组的大小匹配。\n\
    \n```cpp\nint numbers[5] = {1, 2, 3, 4, 5};\n```\n\n在这个示例中，我们声明了一个大小为 5 的整数数组\
    \ `numbers`，并用值 1 到 5 初始化了它。数组现在包含 `[1, 2, 3, 4, 5]`。\n\n如果你在声明时没有指定数组的大小，编译器将根据提供的值数量推断大小：\n\
    \n```cpp\nint numbers[] = {1, 2, 3, 4, 5}; // 编译器推断大小为 5\n```\n\n### 访问数组元素\n\n\
    要访问数组中的单个元素，你需要使用索引，索引是一个表示元素在数组中位置的整数。C++ 中的数组索引从 0 开始，这意味着第一个元素位于索引 0，第二个元素位于索引\
    \ 1，以此此类推。\n\n```cpp\nint numbers[5] = {1, 2, 3, 4, 5};\n\nint firstNumber = numbers[0];\
    \ // 访问第一个元素 (1)\nint secondNumber = numbers[1]; // 访问第二个元素 (2)\n```\n\n在这段代码中，我们分别使用索引\
    \ 0 和 1 访问 `numbers` 数组的第一个和第二个元素。\n\n### 修改数组元素\n\n你可以通过使用赋值运算符 (`=`) 给数组中的元素分配新值来更改其值。\n\
    \n```cpp\nint numbers[5] = {1, 2, 3, 4, 5};\n\nnumbers[2] = 10; // 将第三个元素的值改为\
    \ 10\n```\n\n在这个示例中，我们通过为其赋值值 10 修改了 `numbers` 数组的第三个元素（其索引为 2）。\n\n### 数组大小\n\
    \n数组的大小在声明时是固定的，在程序执行期间不能更改。尝试访问或修改边界之外的元素可能会导致未定义行为和内存损坏。因此，在处理数组时，留意其大小至关重要。\n\
    \n### 遍历数组\n\n在处理数组时，一个常见的任务是遍历所有元素。你可以使用循环（例如 `for` 循环）来实现这一点。这里有一个打印数组所有元素的示例：\n\
    \n```cpp\n#include <iostream>\n\nint main() {\n    int numbers[] = {1, 2, 3, 4,\
    \ 5};\n    for (int i = 0; i < 5; i++) {\n        std::cout << numbers[i] << \"\
    \ \";\n    }\n    return 0;\n}\n```\n\n在这段代码中，我们使用 `for` 循环遍历 `numbers` 数组并打印每个元素。循环从\
    \ `i = 0` 运行到 `i = 4`，涵盖了数组的所有索引。\n\n### 多维数组\n\n除了一维数组，C++ 还支持多维数组。这些具有多个维度的数组，实际上创建了一个元素网格或表格。\n\
    \n一个常见的例子是二维数组，通常用于表示矩阵或网格：\n\n```cpp\nint matrix[3][3] = {\n    {1, 2, 3},\n\
    \    {4, 5, 6},\n    {7, 8, 9}\n};\n```\n\n在这个示例中，我们声明了一个 3x3 的整数矩阵并用值初始化它。你可以使用两个索引访问单个元素，一个用于行，另一个用于列：\n\
    \n```cpp\nint element = matrix[1][2]; // 访问第二行第三列的元素（值: 6）\n```\n\n### 数组与函数\n\
    \n在 C++ 中，数组可以作为参数传递给函数。当数组被传递给函数时，它被视为指向数组第一个元素的指针。这允许函数在不知道数组大小的情况下对其进行操作。\n\
    \n以下是将数组传递给函数以计算其元素和的示例：\n\n```cpp\n#include <iostream>\n\n// 计算数组和的函数\nint sumArray(int\
    \ arr[], int size) {\n    int sum = 0;\n    for (int i = 0; i < size; i++) {\n\
    \        sum += arr[i];\n    }\n    return sum;\n}\n\nint main() {\n    int numbers[]\
    \ = {1, 2, 3, 4, 5};\n    int total = sumArray(numbers, 5);\n    std::cout <<\
    \ \"Sum: \" << total << std::endl;\n    return 0;\n}\n```\n\n"
- fmt: "\n```cpp\n#include <iostream>\n#include <string>\n\nint main() {\n    std::string\
    \ greeting = \"Hello, world!\";\n    // Append to the string\n    greeting +=\
    \ \" Welcome to C++\";\n    // Get the length of the string\n    int length =\
    \ greeting.length();\n    std::cout << \"Modified string: \" << greeting << std::endl;\n\
    \    std::cout << \"Length: \" << length << std::endl;\n    return 0;\n}\n```\n\
    \nIn this code, we declare a `string` variable `greeting` and use its member functions\
    \ to append to the string and obtain its length.\n\n## Key Differences Between\
    \ C-Style Strings and `string` Class\n\nWhile both C-style strings and the `string`\
    \ class are used for text manipulation, there are some important differences:\n\
    \n1. **Null Terminator**: C-style strings require a null character at the end,\
    \ which can make them error-prone if not handled properly. `string` objects manage\
    \ the null terminator internally, reducing the risk of buffer overflows.\n2. **Dynamic\
    \ Sizing**: `string` objects can grow or shrink dynamically, making them more\
    \ flexible for handling variable-length text. C-style strings have a fixed size\
    \ determined at declaration.\n3. **Safety**: `string` objects offer safer operations\
    \ and bounds checking, reducing the chances of runtime errors.\n4. **Standard\
    \ Library**: `string` is part of the C++ Standard Library and provides many useful\
    \ member functions for string manipulation.\n\n## Converting Between C-Style Strings\
    \ and `string`\n\nYou can easily convert between C-style strings and `string`\
    \ objects using member functions and constructors provided by the `string` class.\
    \ Here are examples of converting from `string` to C-style string and vice versa:\n\
    \n```cpp\n#include <iostream>\n#include <string>\n\nint main() {\n    // Convert\
