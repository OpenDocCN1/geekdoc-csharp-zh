    \ 第 13 章：使用 LINQ（集成语言查询）\n\n欢迎来到 C# `LINQ`（集成语言查询）的世界！在本章中，我们将探索 `LINQ` 的威力，这是一种强大的查询语言，允许你以简洁且富有力的方式查询和操作数据集合。通过掌握\
    \ `LINQ`，你能够轻松地对数据执行复杂操作，并创建更高效、易读的代码。\n\n## LINQ 简介\n\n`LINQ` 是 C# 中的一组技术，允许你编写查询语句，用于从各种数据源检索、处理和转换数据。它提供了一种一致的方式来处理不同类型的数据，包括集合、数据库、XML\
    \ 等。\n\n### LINQ 的优势\n\n1. **语法简洁**：`LINQ` 使用声明式和流式语法，允许你以更易读、更简洁的方式表达复杂操作。\n\
    2. **类型安全**：`LINQ` 是静态类型的，这意味着错误在编译时被捕获，而不是运行时。\n3. **高效**：`LINQ` 在内部优化了查询，使许多操作具有更好的性能。\n\
    4. **统一查询语言**：无论你处理集合、数据库、XML 还是其他数据源，都可以使用相同的查询语法。\n\n## LINQ to Objects：查询集合\n\
    \n`LINQ to Objects` 允许你查询和操作存储在集合（如数组、列表和字典）中的数据。\n\n### 使用 LINQ 查询\n\n```csharp\n\
    using System;\nusing System.Linq;\nusing System.Collections.Generic;\n\nclass\
    \ Program\n{\n    static void Main()\n    {\n        List<int> numbers = new List<int>\
    \ { 1, 2, 3, 4, 5 };\n        var evenNumbers = from num in numbers\n        where\
    \ num % 2 == 0\n        select num;\n        foreach (int number in evenNumbers)\n\
    \        {\n            Console.WriteLine(number);\n        }\n    }\n}\n```\n\
    \n在这个示例中，我们使用 `LINQ` 从列表中过滤出偶数。查询表达式使用了 `from`、`where` 和 `select` 子句来执行操作。\n\n\
    ### 投影与转换\n\n```csharp\nusing System;\nusing System.Linq;\nusing System.Collections.Generic;\n\
    \nclass Program\n{\n    static void Main()\n    {\n        List<string> fruits\
    \ = new List<string> { \"apple\", \"banana\", \"cherry\" };\n        var uppercaseFruits\
    \ = from fruit in fruits\n        select fruit.ToUpper();\n        foreach (string\
    \ fruit in uppercaseFruits)\n        {\n            Console.WriteLine(fruit);\n\
    \        }\n    }\n}\n```\n\n在这个示例中，我们使用 `LINQ` 通过 `select` 子句将列表的元素转换为大写。\n\n\
    ## LINQ to SQL：查询数据库\n\n`LINQ to SQL` 允许你使用 `LINQ` 查询查询和操作存储在关系型数据库中的数据。\n\n##\
    \ 连接数据库\n\n```csharp\nusing System;\nusing System.Linq;\n\nclass Program\n{\n\
    \    static void Main()\n    {\n        string connectionString = \"Data Source=(localdb)\\\
    \\MSSQLLocalDB;Initial Catalog=SampleDB;Integrated Security=True\";\n        DataContext\
    \ dataContext = new DataContext(connectionString);\n        var employees = from\
    \ emp in dataContext.Employees\n        where emp.Department == \"IT\"\n     \
    \   select emp;\n        foreach (var employee in employees)\n        {\n    \
    \        Console.WriteLine(employee.Name);\n        }\n    }\n}\n```\n\n在这个示例中，我们使用\
    \ `LINQ` 查询名为 `Employees` 的数据库表，并检索 IT 部门的员工。\n\n## LINQ to XML：查询 XML 数据\n\n\
    `LINQ to XML` 允许你使用 `LINQ` 查询查询和操作 XML 数据。\n\n### 查询 XML\n\n```csharp\nusing System;\n\
    using System.Linq;\nusing System.Xml.Linq;\n\nclass Program\n{\n    static void\
    \ Main()\n    {\n        string xml = @\"<books>\n<book>\n<title>Introduction\
    \ to LINQ</title>\n<author>John Smith</author>\n</book>\n<book>\n<title>Mastering\
    \ C#</title>\n<author>Jane Doe</author>\n</book>\n</books>\";\n        XDocument\
    \ doc = XDocument.Parse(xml);\n        var bookTitles = from book in doc.Descendants(\"\
    book\")\n        select book.Element(\"title\").Value;\n        foreach (string\
    \ title in bookTitles)\n        {\n            Console.WriteLine(title);\n   \
    \     }\n    }\n}\n```\n\n在这个示例中，我们使用 `LINQ` 查询 XML 数据并检索书籍标题。\n\n# 第 14 章：异步编程\n\
    \n欢迎来到 C# 异步编程的世界！在本章中，我们将探索异步编程的威力，这是一种强大的方法，允许你并发执行任务，提高应用程序的性能和响应能力。通过掌握异步编程，你将能够创建响应迅速、资源高效的应用程序。\n\
    \n## 理解异步编程\n\n异步编程是一种允许应用程序并发执行任务而不阻塞主执行线程的技术。这对于涉及等待的任务（如 I/O 操作或网络请求）特别重要，如果不妥善管理，这些任务会导致应用程序无响应。\n\
    \n### 同步与异步\n\n在同步编程中，任务是一个接一个地按顺序执行的。如果某个任务花费很长时间，它可能会阻塞整个程序。\n\n相反，异步编程允许任务并发执行。当一个任务正在等待慢速操作时，其他任务可以继续执行。这使得系统资源的利用更好，响应能力更高。\n\
    \n## 异步方法与 `async` 关键字\n\n在 C# 中，你可以使用 `async` 和 `await` 关键字创建异步方法。`async` 关键字用于标记方法为异步方法，而\
    \ `await` 关键字用于指示方法等待异步操作完成的点。\n"
- fmt: "\n```csharp\nusing System;\nusing System.Net.Http;\nusing System.Threading.Tasks;\n\
    \nclass Program\n{\n    static async Task Main()\n    {\n        await DownloadWebsiteContentAsync();\n\
    \        Console.WriteLine(\"Website content downloaded.\");\n    }\n\n    static\
    \ async Task DownloadWebsiteContentAsync()\n    {\n        using (HttpClient client\
    \ = new HttpClient())\n        {\n            string content = await client.GetStringAsync(\"\
    https://www.example.com\");\n            Console.WriteLine(content.Substring(0,\
    \ 100)); // Display first 100 characters\n        }\n    }\n}\n```\n\nIn this\
    \ example, we use the `async` and `await` keywords to create an asynchronous method\
    \ named `DownloadWebsiteContentAsync`. The method downloads the content of a website\
    \ using `HttpClient` asynchronously.\n\n## Asynchronous Programming Patterns\n\
    \nAsynchronous programming introduces some patterns to manage asynchronous operations\
    \ effectively.\n\n### Fire and Forget\n\n```csharp\nusing System;\nusing System.Threading.Tasks;\n\
    \nclass Program\n{\n    static async Task Main()\n    {\n        Console.WriteLine(\"\
    Starting task...\");\n        FireAndForget();\n        Console.WriteLine(\"Task\
    \ started.\");\n    }\n\n    static async void FireAndForget()\n    {\n      \
    \  await Task.Delay(1000);\n        Console.WriteLine(\"Fire and forget task completed.\"\
    );\n    }\n}\n```\n\nIn this example, the `FireAndForget` method is marked as\
    \ `async void`, which means it's a fire-and-forget method. The `Main` method calls\
    \ this method without awaiting it, allowing it to execute independently.\n\n###\
    \ Task.Run\n\n```csharp\nusing System;\nusing System.Threading.Tasks;\n\nclass\
    \ Program\n{\n    static async Task Main()\n    {\n        Console.WriteLine(\"\
    Starting task...\");\n        await Task.Run(() => DelayAndPrint());\n       \
    \ Console.WriteLine(\"Task completed.\");\n    }\n\n    static async Task DelayAndPrint()\n\
    \    {\n        await Task.Delay(1000);\n        Console.WriteLine(\"Delayed task\
    \ completed.\");\n    }\n}\n```\n\nIn this example, the `Task.Run` method is used\
    \ to run a method on a separate thread. This can be useful for CPU-bound operations\
    \ that might otherwise block the main thread.\n\n### Handling Exceptions in Asynchronous\
    \ Code\n\nHandling exceptions in asynchronous code requires some attention, as\
    \ exceptions thrown in asynchronous tasks may not be caught by traditional `try`-catch`\
    \ blocks.\n\n### Handling Exceptions\n\n```csharp\nusing System;\nusing System.Threading.Tasks;\n\
    \nclass Program\n{\n    static async Task Main()\n    {\n        try\n       \
    \ {\n            await ThrowExceptionAsync();\n        }\n        catch (Exception\
    \ ex)\n        {\n            Console.WriteLine(\"Exception caught: \" + ex.Message);\n\
    \        }\n    }\n\n    static async Task ThrowExceptionAsync()\n    {\n    \
    \    await Task.Delay(100);\n        throw new Exception(\"An async exception\
    \ occurred.\");\n    }\n}\n```\n\nIn this example, we use a `try`-catch` block\
    \ to catch an exception thrown by an asynchronous method. Note that exceptions\
    \ from asynchronous methods are automatically wrapped in an `AggregateException`\
    \ when caught.\n\n## Conclusion\n\nIn this chapter, we've explored the world of\
    \ asynchronous programming in C#. We've learned how to create asynchronous methods\
    \ using the `async` and `await` keywords, allowing tasks to execute concurrently\
    \ and improving responsiveness in our applications. We've discussed patterns like\
    \ fire and forget and using `Task.Run` for managing asynchronous tasks effectively.\n\
    \nAsynchronous programming is essential for building modern applications that\
    \ can handle multiple tasks simultaneously, whether it's downloading data from\
    \ the internet, processing large datasets, or interacting with external services.\
    \ By mastering asynchronous programming, you'll be equipped to create applications\
    \ that provide smooth user experiences and efficient resource utilization. So,\
    \ embrace the power of asynchronous programming, and let your applications shine\
    \ with responsiveness and concurrency!\n\n# Chapter 15: Building User Interfaces\
    \ with WPF (Windows Presentation Foundation)\n\nWelcome to the world of modern\
    \ user interface development using WPF (Windows Presentation Foundation) in C#!\
    \ In this chapter, we'll dive into the world of creating rich and interactive\
    \ user interfaces for your applications. We'll explore the core concepts of WPF,\
    \ creating layouts, designing controls, and handling events. By mastering WPF,\
    \ you'll be able to craft visually appealing and user-friendly interfaces that\
    \ enhance the overall user experience of your applications.\n\n## Introduction\
    \ to WPF\n\nWPF is a graphical subsystem in Windows that provides a powerful framework\
    \ for creating user interfaces in desktop applications. It offers a flexible and\
    \ XAML-based approach to designing interfaces, enabling developers to separate\
    \ UI design from logic.\n\n### Key Features of WPF\n\n1. **XAML (eXtensible Application\
    \ Markup Language)**: WPF uses XAML to define user interfaces, enabling a clear\
    \ separation of UI and code-behind.\n2. **Rich Controls**: WPF provides a wide\
    \ range of customizable controls that can be styled to match your application's\
    \ design.\n3. **Layout Flexibility**: WPF introduces powerful layout controls\
    \ like `Grid`, `StackPanel`, and `DockPanel` to create responsive and dynamic\
    \ layouts.\n4. **Data Binding**: WPF supports data binding, allowing you to easily\
    \ synchronize data between the UI and backend logic.\n\n## Creating a Simple WPF\
    \ Application\n\nLet's start by creating a simple WPF application with a basic\
    \ interface.\n\n```xaml\n<Window x:Class=\"WpfApp.MainWindow\"\nxmlns=\"http://schemas.microsoft.com/winfx/2006/xaml/presentation\"\
    \nxmlns:x=\"http://schemas.microsoft.com/winfx/2006/xaml\"\nTitle=\"My First WPF\
    \ App\" Height=\"300\" Width=\"400\">\n  <Grid>\n    <TextBlock HorizontalAlignment=\"\
    Center\" VerticalAlignment=\"Center\" FontSize=\"20\">\n    Welcome to WPF!\n\
    \    </TextBlock>\n  </Grid>\n</Window>\n```\n\nIn this example, we define a window\
    \ containing a `Grid` layout with a centered `TextBlock`. This XAML represents\
    \ the user interface of our application.\n\n## Layout Controls in WPF\n\nWPF provides\
    \ a variety of layout controls to organize and structure the elements in your\
    \ user interface.\n\n### Grid Layout\n\n```xaml\n<Grid>\n  <Grid.RowDefinitions>\n\
    \    <RowDefinition Height=\"*\"/>\n    <RowDefinition Height=\"2*\"/>\n  </Grid.RowDefinitions>\n\
    \  <TextBlock Grid.Row=\"0\" Text=\"Top Area\"/>\n  <TextBlock Grid.Row=\"1\"\
    \ Text=\"Bottom Area\"/>\n</Grid>\n```\n\nIn this example, we use a `Grid` layout\
    \ to create two rows. The `TextBlock` elements are placed in different rows.\n\
    \n### StackPanel\n\n```xaml\n<StackPanel>\n  <Button Content=\"Click Me\"/>\n\
    \  <Button Content=\"Or Click Me\"/>\n  <Button Content=\"Or Even Click Me\"/>\n\
    </StackPanel>\n```\n\nA `StackPanel` arranges its children in a single column\
    \ or row, stacking them one after the other.\n\n## Styling and Templates\n\nWPF\
    \ allows you to customize the appearance of controls using styles and templates.\n\
    \n### Applying Styles\n\n```xaml\n<Window.Resources>\n  <Style TargetType=\"Button\"\
    >\n    <Setter Property=\"Background\" Value=\"LightBlue\"/>\n    <Setter Property=\"\
    FontSize\" Value=\"14\"/>\n  </Style>\n</Window.Resources>\n\n<StackPanel>\n \
    \ <Button Content=\"Styled Button 1\"/>\n  <Button Content=\"Styled Button 2\"\
    />\n</StackPanel>\n```\n\nIn this example, we define a style for all `Button`\
    \ controls within the `Window`. This style changes the background color and font\
    \ size of the buttons.\n\n## Data Binding\n\nWPF's data binding capabilities allow\
    \ you to bind UI elements to data sources, enabling automatic synchronization.\n\
    \n### Binding to Data\n\n```xaml\n<StackPanel>\n  <TextBlock Text=\"{Binding UserName}\"\
    \ FontSize=\"18\"/>\n  <TextBox Text=\"{Binding UserName, Mode=TwoWay}\"/>\n</StackPanel>\n\
    ```\n\nIn this example, we bind a `TextBlock` and a `TextBox` to a `UserName`\
    \ property. Changes in the `TextBox` are automatically reflected in the `TextBlock`.\n\
    \n## Handling Events\n\nWPF provides a robust event system to handle user interactions.\n\
    \n### Event Handling\n\n```xaml\n<Button Content=\"Click Me\" Click=\"Button_Click\"\
    />\n```\n\n```csharp\nprivate void Button_Click(object sender, RoutedEventArgs\
    \ e)\n{\n    MessageBox.Show(\"Button clicked!\");\n}\n```\n\nIn this example,\
