    \n在这个示例中，当 `i` 等于 `2` 时，遇到了 `continue` 语句，循环跳转到下一次迭代，跳过了该特定值 `i` 的循环剩余部分。\n"
- fmt: 'Loop control statements like `break` and `continue` provide you with the ability
    to fine-tune the behavior of your loops. Whether you need to exit a loop prematurely
    or skip specific iterations, these statements can help you achieve precise control
    over your loops.


    ## Iterating with `for` Loops


    The `for` loop is a versatile looping construct that allows you to specify the
    initialization, condition, and iteration of a loop in a single line. Its syntax
    is as follows:


    ```cpp

    for (initialization; condition; iteration) {

    // Code to execute while ''condition'' is true

    }

    ```


    Let''s break down the components of a `for` loop:


    - **Initialization**: This part is executed once at the beginning of the loop
    and is typically used to initialize loop control variables.

    - **Condition**: The loop continues to execute as long as this condition is true.
    If it evaluates to false, the loop terminates.

    - **Iteration**: After each iteration of the loop, this part is executed. It''s
    often used to update loop control variables.


    Here''s an example:


    ```cpp

    #include <iostream>


    int main() {

    for (int i = 0; i < 5; i++) {

    std::cout << "Iteration " << i << std::endl;

    }

    return 0;

    }

    ```


    In this example, the `for` loop initializes `i` to `0`, continues executing as
    long as `i` is less than `5`, and increments `i` by `1` after each iteration.
    The loop prints "Iteration 0" through "Iteration 4" to the console.


    ### Multiple Initialization and Iteration


    You can have multiple initialization and iteration expressions in a `for` loop,
    separated by commas. This allows you to work with multiple variables simultaneously.
    Here''s an example:


    ```cpp

    #include <iostream>


    int main() {

    for (int i = 0, j = 10; i < 5 && j > 5; i++, j--) {

    std::cout << "i = " << i << ", j = " << j << std::endl;

    }

    return 0;

    }

    ```


    In this example, we have two variables, `i` and `j`, initialized to `0` and `10`,
    respectively. The loop continues as long as `i` is less than `5` and `j` is greater
    than `5`. After each iteration, `i` is incremented, and `j` is decremented.


    ### Infinite `for` Loops


    Just like `while` loops, be cautious when using `for` loops to avoid infinite
    loops. Make sure your loop''s condition will eventually become false.


    ## Looping with `for-each`


    C++ offers a convenient way to iterate over elements in a collection (e.g., arrays,
    vectors) using a `for-each` loop. This loop is also known as a range-based `for`
    loop. It simplifies the process of iterating over elements without needing explicit
    indices. Here''s the syntax:


    ```cpp

    for (element_type element : collection) {

    // Code to process ''element''

    }

    ```


    Let''s see an example using an array:


    ```cpp

    #include <iostream>


    int main() {

    int numbers[] = {1, 2, 3, 4, 5};

    for (int number : numbers) {

    std::cout << "Number: " << number << std::endl;

    }

    return 0;

    }

    ```


    In this example, the `for-each` loop iterates over each element in the `numbers`
    array, and the current element is stored in the variable `number`. The loop prints
    each number to the console.


    ### `auto` Keyword with `for-each`


    You can use the `auto` keyword to let the compiler deduce the type of the elements
    in the collection. This is particularly useful when working with complex data
    types. Here''s an example:


    ```cpp

    #include <iostream>

    #include <vector>


    int main() {

    std::vector<std::string> fruits = {"Apple", "Banana", "Cherry"};

    for (auto fruit : fruits) {

    std::cout << "Fruit: " << fruit << std::endl;

    }

    return 0;

    }

    ```


    In this example, the `auto` keyword is used to iterate over a `std::vector` of
    strings, and the type of `fruit` is deduced automatically by the compiler.


    ## Conditional Loops with `while` and `for`


    Loops often involve conditions, and you can combine `while` or `for` loops with
    `if` statements to create more complex looping logic. For example:


    ```cpp

    #include <iostream>


    int main() {

    int i = 0;

    while (i < 5) {

    if (i % 2 == 0) {

    std::cout << "Even: " << i << std::endl;

    } else {

    std::cout << "Odd: " << i << std::endl;

    }

    i++;

    }

    return 0;

    }

    ```


    In this example, we use a `while` loop to iterate from `0` to `4`. Inside the
    loop, we check if the current value of `i` is even or odd using an `if` statement.
    Depending on the condition, we print "Even" or "Odd" along with the value of `i`.


    Similarly, you can incorporate conditional logic within `for` loops to achieve
    the desired behavior for your program.


    ## Summary


    Control structures are essential tools in programming for making decisions, looping,
    and controlling the flow of your code. In this chapter, we explored conditional
    statements with `if`, `else`, and `else if`.


    # Chapter 6: Functions and Scope


    In this chapter, we''ll delve into the world of functions and scope. Functions
