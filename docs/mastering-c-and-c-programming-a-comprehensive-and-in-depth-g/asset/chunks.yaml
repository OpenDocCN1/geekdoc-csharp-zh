    \n### 封装\n\n封装是 OOP 的核心原则之一，涉及将数据（属性）和操作这些数据的方法（函数）封装在一个名为类的单一单元中。它还包括通过定义访问修饰符（public、protected、private）来控制对数据的访问。封装有助于隐藏类的内部细节，并为对象交互提供清晰的接口。\n\
