    # # Chapter 13: File Handling


    File handling is a crucial aspect of modern software development. In C++, it allows
    you to read data from files, write data to files, and manipulate file content.
    Whether you''re working with configuration files, log files, or data storage,
    mastering file handling is an essential skill for any C++ programmer. In this
    chapter, we will explore how to perform file input and output operations in C++,
    covering everything from basic file reading and writing to more advanced techniques.


    ## Opening and Closing Files


    ### Opening a File


    Before you can read or write data to a file, you must first open it. C++ provides
    the `fstream` library for working with files. To open a file, you can use one
    of the following modes:


    - `ios::in`: Open for reading (input).


    - `ios::out`: Open for writing (output).


    - `ios::app`: Append mode (writing at the end of the file).


    - `ios::ate`: Open and seek to the end of the file.


    - `ios::trunc`: If the file already exists, it truncates (clears) its content.


    You can combine these modes using the bitwise OR operator (`|`) to specify multiple
    modes simultaneously.


    ```cpp


    #include <iostream>


    #include <fstream>


    int main() {


    std::fstream file;


    // Open a file for writing (creates a new file or overwrites an existing one)


    file.open("example.txt", std::ios::out);


    if (!file.is_open()) {


    std::cerr << "Error opening the file." << std::endl;


    return 1;


    }


    // Write data to the file


    file << "Hello, File Handling in C++!" << std::endl;


    // Close the file


    file.close();


    return 0;


    }


    ```


    In this example, we open a file named "example.txt" for writing (`std::ios::out`).
    If the file does not exist, it will be created. We then check if the file opened
    successfully using the `is_open()` member function of the `fstream` object. After
    writing data to the file, we close it using the `close()` member function.


    ### Closing a File


    Closing a file is essential to release system resources and ensure that any pending
    changes are saved. You can use the `close()` member function of the `fstream`
    object to close a file, as shown in the previous example. Once a file is closed,
    you cannot perform any read or write operations on it until you open it again.


    ## Reading from Files


    ### Reading Line by Line


    Reading data from a file line by line is a common task. You can use the `getline()`
    function provided by the C++ Standard Library to read lines from a file. Here''s
    an example:


    ```cpp


    #include <iostream>


    #include <fstream>


    #include <string>


    int main() {


    std::ifstream file("example.txt");


    if (!file.is_open()) {


    std::cerr << "Error opening the file." << std::endl;


    return 1;


    }


    std::string line;


    while (std::getline(file, line)) {


    std::cout << line << std::endl;


    }


    file.close();


    return 0;


    }


    ```


    In this example, we open the "example.txt" file for reading (`std::ifstream`).
    We then use a `while` loop to read lines from the file using `std::getline()`.
    Each line is stored in the `line` variable, which we print to the console. Finally,
    we close the file.


    ### Reading Individual Data Types


    If your file contains structured data, such as integers or floating-point numbers,
    you can read them directly into variables of the corresponding data type. Here''s
    an example of reading integers from a file:


    ```cpp


    #include <iostream>


    #include <fstream>


    int main() {


    std::ifstream file("numbers.txt");


    if (!file.is_open()) {


    std::cerr << "Error opening the file." << std::endl;


    return 1;


    }


    int num;


    while (file >> num) {


    std::cout << "Read: " << num << std::endl;


    }


    file.close();


    return 0;


    }


    ```


    In this example, we open the "numbers.txt" file for reading, and then we use a
    `while` loop to read integers from the file using the `>>` operator. Each integer
    is stored in the `num` variable, which we print to the console.


    ### Checking for End of File


    When reading from a file, it''s essential to check for the end of the file to
    avoid reading beyond the available data. You can use the `eof()` function to check
    if the end of the file has been reached. Here''s an example:


    ```cpp


    #include <iostream>


    #include <fstream>


    int main() {


    std::ifstream file("data.txt");


    if (!file.is_open()) {


    std::cerr << "Error opening the file." << std::endl;


    return 1;


    }


    int num;


    while (!file.eof()) {


    file >> num;


    if (!file.eof()) {


    std::cout << "Read: " << num << std::endl;


    }


    }


    file.close();


    return 0;


    }


    ```


    In this example, we use a `while` loop to read integers from the file while checking
    for `!file.eof()`. This ensures that we only print integers that have been successfully
    read from the file.


    ## Writing to Files


    ### Writing Text Data


    To write text data to a file, you can use the insertion operator (`<<`) with the
    `ofstream` class. Here''s an example of writing text to a file:


    ```cpp


    #include <iostream>


    #include <fstream>


    int main() {


    std::ofstream file("output.txt");


    if (!file.is_open()) {


    std::cerr << "Error opening the file." << std::endl;


    return 1;


    }


    file << "Hello, File Handling in C++!" << std::endl;


    file << "Writing to files is easy." << std::endl;


    file.close();


    return 0;


    }


    ```


    In this example, we open the "output.txt" file for writing (`std::ofstream`) and
    then use the `<<` operator to write text to the file. Each `<<` operation appends
    data to the file. Finally, we close the file.


    ### Writing Individual Data Types


    You can write individual data types, such as integers or floating-point numbers,
    to a file using the `ofstream` class and the insertion operator (`<<`). Here''s
    an example:


    ```cpp


    #include <iostream>


    #include <fstream>


    int main() {


    std::ofstream file("numbers.txt");


    if (!file.is_open()) {


    std::cerr << "Error opening the file." << std::endl;


    return 1;


    }


    int num1 = 42;


    double num2 = 3.14159;


    file << num1 << std::endl;


    file << num2 << std::endl;


    file.close();


    return 0;


    }


    ```


