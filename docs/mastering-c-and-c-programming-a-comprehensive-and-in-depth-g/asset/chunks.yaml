    ## 泛型：类型安全的可重用


    泛型允许你创建可以与不同数据类型工作的类、方法和接口，同时保持类型安全。它们提供了一种创建适应不同数据需求的可重用代码的方法。


    ### 创建泛型类


    泛型类是一种可以处理不同类型的类。例如，`List<T>` 类可以持有任何类型 `T` 的元素。


    ```csharp

    using System;

    using System.Collections.Generic;

    class Program

    {

    static void Main()

    {

    List<int> intList = new List<int>();

    intList.Add(5);

    intList.Add(10);

    List<string> stringList = new List<string>();

    stringList.Add("Hello");

    stringList.Add("World");

    foreach (int number in intList)

    {

    Console.WriteLine(number);

    }

    foreach (string str in stringList)

    {

    Console.WriteLine(str);

    }

    }

    }

    }

    ```


    在这个示例中，我们演示了如何对整数和字符串使用泛型 `List<T>` 类。


    ### 创建泛型方法


    泛型方法允许你创建无需重写代码即可与不同数据类型工作的方法。


    ```csharp

    using System;

    class Program

    {

    static void Swap<T>(ref T a, ref T b)

    {

    T temp = a;

    a = b;

    b = temp;

    }

    static void Main()

    {

    int x = 5, y = 10;

    Console.WriteLine("Before: x = " + x + ", y = " + y);

    Swap(ref x, ref y);

    Console.WriteLine("After: x = " + x + ", y = " + y);

    }

    }

    }

    ```


    在这里，`Swap` 方法是泛型的，允许我们使用相同的代码交换不同类型的值。


    ## 泛型中的约束


    你可以对泛型类型参数应用约束，以限制可以使用使用的类型。常见的约束包括 `where T : class`（引用类型）、`where T : struct`（值类型）和
    `where T : new()`（无参数构造函数）。


    ```csharp

    using System;

    class Program

    {

    static T FindMax<T>(T[] array) where T : IComparable<T>

    {

    T max = array[0];

    foreach (T item in array)

    {

    if (item.CompareTo(max) > 0)

    {

    max = item;

    }

    }

    return max;

    }

    static void Main()

    {

    int[] numbers = { 5, 10, 3, 8, 2 };

    int maxNumber = FindMax(numbers);

    Console.WriteLine("Maximum number: " + maxNumber);

    string[] words = { "apple", "banana", "cherry" };

    string maxWord = FindMax(words);

    Console.WriteLine("Maximum word: " + maxWord);

    }

    }

    }

    ```


    在这个示例中，`FindMax` 方法使用 `where T : IComparable<T>` 约束来确保泛型类型参数 `T` 实现了 `IComparable<T>`
    接口，从而允许比较。


    ## 结论


    在本章，我们我们了 C# 中集合和泛型的世界。我们学习了集合如何允许我们使用各种数据结构（包括列表、字典、队列和栈）高效地管理数据组。我们还深入研究了泛型的力量，它允许我们编写可以处理不同数据类型的可重用且类型安全的代码。


