    }

    return 0;

    }

    ```


    在这个示例中，我们有两个变量 `i` 和 `j`，分别初始化为 `0` 和 `10`。只要 `i` 小于 `5` 且 `j` 大于 `5`，循环就会继续。每次迭代后，`i`
