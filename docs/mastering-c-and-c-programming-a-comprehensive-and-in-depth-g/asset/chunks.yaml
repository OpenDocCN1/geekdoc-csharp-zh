    \  return 0;\n}\n```\n\n在这种情况下，由于 `x` 不大于 `5`，因此执行 `else` 块中的代码，并打印出“x is not\
    \ greater than 5.”。\n\n### `else if` 子句\n\n你可以使用 `else if` 子句按顺序测试多个条件，从而进一步完善你的条件逻辑。以下是语法：\n\
    \n```cpp\nif (condition1) {\n    // 如果 'condition1' 为真，则执行代码\n} else if (condition2)\
