    # **Chapter 6: Object-Oriented Programming Concepts**


    Welcome to the realm of object-oriented programming (OOP), a paradigm that brings
    a new level of structure and organization to your C# programs. Object-oriented
    programming allows you to model real-world entities, their properties, and behaviors
    in your code. In this chapter, we''ll explore the core concepts of OOP, such as
    classes, objects, inheritance, and encapsulation, and how they shape the way we
    design and build software.


    ## Understanding Object-Oriented Programming


    At its core, object-oriented programming revolves around the idea of treating
    everything as an "object." An object is an instance of a class, which is essentially
    a blueprint or template for creating objects. OOP encourages us to think about
    our code in terms of entities and their interactions, mirroring the real world.


    ## Classes and Objects


    ### Classes: Blueprints for Objects


    A class is a user-defined data type that defines the properties (attributes) and
    behaviors (methods) of objects. Think of a class as a blueprint that describes
    how objects of that type should be structured.


    ```csharp


    class Person


    {


    public string Name;


    public int Age;


    public void SayHello()


    {


    Console.WriteLine("Hello, my name is " + Name + " and I am " + Age + " years old.");


    }


    }


    ```


    In this example, we define a `Person` class with properties `Name` and `Age`,
    as well as a method `SayHello`.


    ### Objects: Instances of Classes


    An object is an instance of a class. It''s created using the blueprint provided
    by the class and can have its own values for properties.


    ```csharp


    Person alice = new Person();


    alice.Name = "Alice";


    alice.Age = 25;


    alice.SayHello(); // Output: Hello, my name is Alice and I am 25 years old.


    ```


    Here, we create an object `alice` of the `Person` class and set its properties.
    We then call the `SayHello` method on the `alice` object.


    ## Encapsulation: Data Protection


    Encapsulation is the principle of bundling data (properties) and the methods that
    operate on that data into a single unit (class). It provides data protection by
    controlling the access to the internal state of an object.


    ```csharp


    class BankAccount


    {


    private double balance;


    public void Deposit(double amount)


    {


    if (amount > 0)


    {


    balance += amount;


    }


    }


    public void Withdraw(double amount)


    {


    if (amount > 0 && amount <= balance)


    {


    balance -= amount;


    }


    }


    public double GetBalance()


    {


    return balance;


    }


    }


    ```


    In this example, the `balance` field is encapsulated within the `BankAccount`
    class, and its value can only be modified through the `Deposit` and `Withdraw`
    methods.


    ## Inheritance: Building Hierarchies


    Inheritance allows you to create a new class based on an existing class, inheriting
    its properties and behaviors. The new class is called a derived class, and the
    existing class is the base class.


    ```csharp


    class Animal


    {


    public void Eat()


    {


    Console.WriteLine("The animal is eating.");


    }


    }


    class Dog : Animal


    {


    public void Bark()


    {


    Console.WriteLine("Woof woof!");


    }


    }


    ```


    Here, the `Animal` class has an `Eat` method, and the `Dog` class inherits from
    `Animal` and adds a `Bark` method.


    ## Polymorphism: One Interface, Many Implementations


    Polymorphism is the ability of different classes to be treated as instances of
    the same class through a common interface. It allows for more flexible and dynamic
    code.


    ```csharp


    class Shape


    {


    public virtual void Draw()


    {


    Console.WriteLine("Drawing a shape.");


    }


    }


    class Circle : Shape


    {


    public override void Draw()


    {


    Console.WriteLine("Drawing a circle.");


    }


    }


    class Square : Shape


    {


    public override void Draw()


    {


    Console.WriteLine("Drawing a square.");


    }


    }


    ```


    In this example, the `Draw` method is overridden in the derived classes, allowing
    each shape to have its own implementation of drawing.


    ## Conclusion


    In this chapter, we embarked on a journey through the world of object-oriented
    programming (OOP) concepts in C#. We explored the fundamental ideas behind OOP,
    including classes, objects, inheritance, encapsulation, and polymorphism.'
