    ## Delegates: Function Pointers in C#


    Delegates are a fundamental concept in C# that allow you to treat methods as first-class
    objects. They provide a way to encapsulate and pass methods as parameters, enabling
    dynamic and modular programming.


    ### Defining and Using Delegates


    A delegate is a type that represents a reference to a method with a specific signature.
    It provides a way to invoke methods indirectly through the delegate instance.


    ```csharp


    using System;


    delegate int Calculator(int a, int b);


    class Program


    {


    static int Add(int x, int y)


    {


    return x + y;


    }


    static int Multiply(int x, int y)


    {


    return x * y;


    }


    static void Main()


    {


    Calculator calc = Add;


    int result = calc(5, 3);


    Console.WriteLine("Addition result: " + result);


    calc = Multiply;


    result = calc(5, 3);


    Console.WriteLine("Multiplication result: " + result);


    }


    }


    ```


    In this example, we define a delegate `Calculator` that represents methods with
    two `int` parameters and an `int` return type. We then assign methods `Add` and
    `Multiply` to the delegate instance and invoke them dynamically.


    ### Multicast Delegates


    A multicast delegate is a delegate that can hold references to multiple methods.
    When invoked, all the methods are called in the order they were added.


    ```csharp


    using System;


    delegate void Logger(string message);


    class Program


    {


    static void LogToFile(string message)


    {


    Console.WriteLine("Logging to file: " + message);


    }


    static void LogToConsole(string message)


    {


    Console.WriteLine("Logging to console: " + message);


    }


    static void Main()


    {


    Logger log = LogToFile;


    log += LogToConsole;


    log("Hello, delegates!");


    log -= LogToConsole;


    log("Console logger removed.");


    }


    }


    ```


    Here, we define a multicast delegate `Logger` that can hold references to methods
    `LogToFile` and `LogToConsole`. We add both methods to the delegate instance and
    observe their execution when the delegate is invoked.


    ## Events: Enabling Component Communication


    Events are a mechanism for communication between different components in a program.
    They allow objects to subscribe to and receive notifications when certain actions
    occur.


    ### Defining and Using Events


    An event is a delegate with restrictions on how it can be used. It can only be
    invoked within the class where it is defined and can be subscribed to from outside
    the class.


    ```csharp


    using System;


    class Publisher


    {


    public event Action<string> NewMessage;


    public void PublishMessage(string message)


    {


    NewMessage?.Invoke(message);


    }


    }


    class Subscriber


    {


    public void OnNewMessage(string message)


    {


    Console.WriteLine("Received message: " + message);


    }


    }


    class Program


    {


    static void Main()


    {


    Publisher publisher = new Publisher();


    Subscriber subscriber = new Subscriber();


    publisher.NewMessage += subscriber.OnNewMessage;


    publisher.PublishMessage("Hello, events!");


    publisher.NewMessage -= subscriber.OnNewMessage;


    }


    }


    ```


    In this example, we define an event `NewMessage` in the `Publisher` class and
    subscribe to it using the `Subscriber` class. When the `PublishMessage` method
    is called, the event is invoked, and the `OnNewMessage` method in the subscriber
    is executed.


    ## Lambdas: Concise Anonymous Functions


