    \ `main` 函数之前使用原型声明了函数 `add`。这允许我们在 `main` 中调用 `add`，即使函数的定义出现在代码的后面。\n\n### 为什么要使用函数原型？\n\
    \n函数原型有几个重要用途：\n\n1. **实现前向引用**：原型允许在实际定义之前调用函数，这当函数相互调用或组织方式需要前向引用时非常有用。\n2.\
    \ **捕获错误**：原型有助于在编译过程中早期发现错误。如果你在原型中误写了函数名、返回类型或参数列表，编译器将生成错误。\n3. **改进代码组织**：原型为程序中使用的函数及其签名提供了清晰的概述，使代码更有组织且具可读性。\n\
    4. **促进团队开发**：在涉及多个程序员的大型项目中，原型有助于定义函数的接口，确保用例的一致性。\n\n### 多个函数原型\n\n你可以为同一个函数声明多个函数原型，只要它们的函数名相同但参数列表不同。这被称为函数重载。\n\
    \n```cpp\n#include <iostream>\n\n// 不同参数列表的函数原型\nint add(int a, int b);\ndouble\
    \ add(double a, double b);\n\nint main() {\nint result_int = add(3, 4); // 调用\
    \ int 版本\ndouble result_double = add(1.5, 2.5); // 调用 double 版本\nstd::cout <<\
    \ \"Result (int): \" << result_int << std::endl;\nstd::cout << \"Result (double):\
    \ \" << result_double << std::endl;\nreturn 0;\n}\n\n// 函数定义\nint add(int a, int\
    \ b) {\nreturn a + b;\n}\n\ndouble add(double a, double b) {\nreturn a + b;\n\
    }\n```\n\n在这个示例中，我们有两个 `add` 函数的版本，其中一个接收 `int` 参数，另一个接收 `double` 参数。多个原型允许根据参数类型调用相应的版本。\n\
    \n### 函数定义\n\n函数定义提供了函数的实际实现。它们指定了函数在被调用时做什么。一个函数只能定义一次，但可以使用原型进行多次声明。\n\n函数定义的结构如下：\n\
    \n```cpp\nreturn_type function_name(parameters) {\n    // 函数体\n    // 执行任务的代码\n\
    \    return result; // 可选的返回语句\n}\n```\n\n让我们重新回顾之前带有函数定义的示例：\n\n```cpp\n#include\
    \ <iostream>\n\n// 函数原型\nint add(int a, int b);\n\nint main() {\nint result =\
    \ add(3, 4); // 函数调用\nstd::cout << \"Result: \" << result << std::endl;\nreturn\
    \ 0;\n}\n\n// 函数定义\nint add(int a, int b) {\nreturn a + b;\n}\n```\n\n在此代码中，我们同时拥有\
    \ `add` 的函数原型和函数定义。函数定义出现在 `main` 函数之后，并提供了加法操作的实际实现。\n\n### 函数定义与声明\n\n函数声明（如原型）提供了关于函数名称、返回类型和参数列表的信息。然而，声明并没有提供函数的实现细节。定义则包含了实现代码。\n\
    \n在实践中，你可以在代码中使用函数原型或函数定义。如果你只需要声明函数的签名并打算在程序的其他地方定义它，原型就足够了。\n\n"
