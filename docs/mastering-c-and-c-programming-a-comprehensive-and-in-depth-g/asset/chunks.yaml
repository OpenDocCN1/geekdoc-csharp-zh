    \ 异常处理中的一个重要概念。它指的是程序处理异常而不会导致资源泄漏或进入不一致状态的能力。C++ 提供了三个级别的异常安全：\n\n1. `不抛出异常保证（No-throw\
    \ guarantee）`：保证函数不会抛出异常。这种级别的安全性是最理想的，因为它确保了资源不会泄漏，且程序保持在一致状态。\n\n2. `基本异常安全（Basic\
    \ exception safety）`：函数保证如果抛出异常，就不会泄漏资源。然而，程序的状态可能是不一致的。如何处理这种不一致状态取决于调用者的决定。\n\
    \n3. `强异常安全（Strong exception safety）`：函数保证如果抛出异常，程序的状态将保持不变。这种级别的安全性在实现上最具挑战性，但它确保了最高水平的可靠性。\n\
    \n## 实践中的异常处理\n\n为了演示实践中的异常处理，让我们考虑一个简单的示例：从用户处读取一个整数并同时处理可能的异常。\n\n```cpp\n#include\
    \ <iostream>\n#include <stdexcept>\n\nint main() {\n    try {\n        std::cout\
