    ## Understanding Functions


    ### What Are Functions?


    A function in C++ is a named block of code that performs a specific task. Functions
    provide a way to break down a program into smaller, more manageable pieces, making
    it easier to develop. They also enable reuse, as you can call a function multiple
    times.


    Here''s the basic structure of a function:


    ```cpp

    return_type function_name(parameters) {

    // Function body

    // Code to perform a task

    return result; // Optional return statement

    }

    ```


    Let''s break down the components of a function:


    - **Return Type**: The return type specifies the data type of the value that the
    function will return upon completion. It can be any valid C++ data type, such
    as `int`, `double`, `string`, or even `void` if the function doesn''t return any
    value.

    - **Function Name**: The function name is a user-defined identifier that you choose
    to represent the function. It should be meaningful and follow naming conventions.

    - **Parameters**: Parameters (also known as arguments) are variables that you
    declare within the parentheses after the function name. They act as placeholders
    for values that will be passed to the function when it''s called. Functions can
    have zero or more parameters.

    - **Function Body**: The function body contains the actual code that performs
    the task or tasks assigned to the function. It''s enclosed within curly braces
    `{}`.

    - **Return Statement**: The `return` statement is used to send a value back to
    the calling code. It''s optional, especially in functions with a `void` return
    type. When a `return` statement is encountered, the function exits, and the specified
    value is sent back to the caller.


    ### Function Example


    Let''s look at a simple example of a function that calculates the square of a
    number:


    ```cpp

    #include <iostream>


    // Function declaration

    int square(int num) {

    int result = num * num;

    return result;

    }


    int main() {

    // Function call

    int number = 5;

    int squared = square(number);

    std::cout << "The square of " << number << " is " << squared << std::endl;

    return 0;

    }

    ```

