    using System;


    using System.Net.Http;


    using System.Threading.Tasks;


    class Program


    {


    static async Task Main()


    {


    await DownloadWebsiteContentAsync();


    Console.WriteLine("Website content downloaded.");


    }


    static async Task DownloadWebsiteContentAsync()


    {


    using (HttpClient client = new HttpClient())


    {


    string content = await client.GetStringAsync("https://www.example.com");


    Console.WriteLine(content.Substring(0, 100)); // Display first 100 characters


    }


    }


    }


    ```


    In this example, we use the `async` and `await` keywords to create an asynchronous
    method named `DownloadWebsiteContentAsync`. The method downloads the content of
    a website using `HttpClient` asynchronously.


    ## Asynchronous Programming Patterns


    Asynchronous programming introduces some patterns to manage asynchronous operations
    effectively.


    ### Fire and Forget


    ```csharp


    using System;


    using System.Threading.Tasks;


    class Program


    {


    static async Task Main()


    {


    Console.WriteLine("Starting task...");


    FireAndForget();


    Console.WriteLine("Task started.");


    }


    static async void FireAndForget()


    {


    await Task.Delay(1000);


    Console.WriteLine("Fire and forget task completed.");


    }


    }


    ```


    In this example, the `FireAndForget` method is marked as `async void`, which means
    it''s a fire-and-forget method. The `Main` method calls this method without awaiting
    it, allowing it to execute independently.


    ### Task.Run


    ```csharp


    using System;


    using System.Threading.Tasks;


    class Program


    {


    static async Task Main()


    {


    Console.WriteLine("Starting task...");


    await Task.Run(() => DelayAndPrint());


    Console.WriteLine("Task completed.");


    }


    static async Task DelayAndPrint()


    {


    await Task.Delay(1000);


    Console.WriteLine("Delayed task completed.");


    }


    }


    ```


    In this example, the `Task.Run` method is used to run a method on a separate thread.
    This can be useful for CPU-bound operations that might otherwise block the main
    thread.


    ## Handling Exceptions in Asynchronous Code


    Handling exceptions in asynchronous code requires some attention, as exceptions
    thrown in asynchronous tasks may not be caught by traditional `try`-`catch` blocks.


    ### Handling Exceptions


    ```csharp


    using System;


    using System.Threading.Tasks;


    class Program


    {


    static async Task Main()


    {


    try


    {


    await ThrowExceptionAsync();


    }


    catch (Exception ex)


    {


    Console.WriteLine("Exception caught: " + ex.Message);


    }


    }


    static async Task ThrowExceptionAsync()


    {


    await Task.Delay(100);


    throw new Exception("An async exception occurred.");


    }


    }


    ```


    In this example, we use a `try`-`catch` block to catch an exception thrown by
    an asynchronous method. Note that exceptions from asynchronous methods are automatically
    wrapped in an `AggregateException` when caught.


    ## Conclusion


    In this chapter, we''ve explored the world of asynchronous programming in C#.
    We''ve learned how to create asynchronous methods using the `async` and `await`
    keywords, allowing tasks to execute concurrently and improving responsiveness
    in our applications. We''ve discussed patterns like fire and forget and using
    `Task.Run` for managing asynchronous tasks effectively.


    Asynchronous programming is essential for building modern applications that can
    handle multiple tasks simultaneously, whether it''s downloading data from the
    internet, processing large datasets, or interacting with external services. By
    mastering asynchronous programming, you''ll be equipped to create applications
    that provide smooth user experiences and efficient resource utilization. So, embrace
    the power of asynchronous programming, and let your applications shine with responsiveness
    and concurrency!


    # **Chapter 15: Building User Interfaces with WPF (Windows Presentation Foundation)**


    Welcome to the world of modern user interface development using WPF (Windows Presentation
    Foundation) in C#! In this chapter, we''ll dive into the world of creating rich
    and interactive user interfaces for your applications. We''ll explore the core
    concepts of WPF, creating layouts, designing controls, and handling events. By
    mastering WPF, you''ll be able to craft visually appealing and user-friendly interfaces
    that enhance the overall user experience of your applications.


    ## Introduction to WPF


    WPF is a graphical subsystem in Windows that provides a powerful framework for
    creating user interfaces in desktop applications. It offers a flexible and XAML-based
    approach to designing interfaces, enabling developers to separate UI design from
    logic.


    ### Key Features of WPF


    1\. **XAML (eXtensible Application Markup Language)**: WPF uses XAML to define
    user interfaces, enabling a clear separation of UI and code-behind.


    2\. **Rich Controls**: WPF provides a wide range of customizable controls that
    can be styled to match your application''s design.


    3\. **Layout Flexibility**: WPF introduces powerful layout controls like `Grid`,
    `StackPanel`, and `DockPanel` to create responsive and dynamic layouts.


    4\. **Data Binding**: WPF supports data binding, allowing you to easily synchronize
    data between the UI and backend logic.


    ## Creating a Simple WPF Application


    Let''s start by creating a simple WPF application with a basic interface.


    ```xaml


    <Window x:Class="WpfApp.MainWindow"


    xmlns="http://schemas.microsoft.com/winfx/2006/xaml/presentation"


    xmlns:x="http://schemas.microsoft.com/winfx/2006/xaml"


    Title="My First WPF App" Height="300" Width="400">


    <Grid>


    <TextBlock HorizontalAlignment="Center" VerticalAlignment="Center" FontSize="20">


    Welcome to WPF!


    </TextBlock>


    </Grid>


    </Window>


    ```


    In this example, we define a window containing a `Grid` layout with a centered
    `TextBlock`. This XAML markup represents the user interface of our application.


    ## Layout Controls in WPF


    WPF provides a variety of layout controls to organize and structure the elements
    in your user interface.


    ### Grid Layout


    ```xaml


    <Grid>


    <Grid.RowDefinitions>


    <RowDefinition Height="*"/>


    <RowDefinition Height="2*"/>


    </Grid.RowDefinitions>


    <TextBlock Grid.Row="0" Text="Top Area"/>


    <TextBlock Grid.Row="1" Text="Bottom Area"/>


    </Grid>


    ```


    In this example, we use a `Grid` layout to create two rows with proportional heights.
    The `TextBlock` elements are placed in different rows.


    ### StackPanel


    ```xaml


    <StackPanel>


    <Button Content="Click Me"/>


    <Button Content="Or Click Me"/>


    <Button Content="Or Even Click Me"/>


    </StackPanel>


    ```


    A `StackPanel` arranges its children in a single column or row, stacking them
    one after the other.


    ## Styling and Templates


    WPF allows you to customize the appearance of controls using styles and templates.


    ### Applying Styles


    ```xaml


    <Window.Resources>


    <Style TargetType="Button">


    <Setter Property="Background" Value="LightBlue"/>


    <Setter Property="FontSize" Value="14"/>


    </Style>


    </Window.Resources>


    <StackPanel>


    <Button Content="Styled Button 1"/>


    <Button Content="Styled Button 2"/>


    </StackPanel>


    ```


    In this example, we define a style for all `Button` controls within the `Window`.
    This style changes the background color and font size of the buttons.


    ## Data Binding


    WPF''s data binding capabilities allow you to bind UI elements to data sources,
    enabling automatic synchronization.


    ### Binding to Data


    ```xaml


    <StackPanel>


    <TextBlock Text="{Binding UserName}" FontSize="18"/>


    <TextBox Text="{Binding UserName, Mode=TwoWay}"/>


    </StackPanel>


    ```


    In this example, we bind a `TextBlock` and a `TextBox` to a `UserName` property.
    Changes in the `TextBox` are automatically reflected in the `TextBlock`.


    ## Handling Events


    WPF provides a robust event system to handle user interactions.


    ### Event Handling


    ```xaml


    <Button Content="Click Me" Click="Button_Click"/>


    ```


    ```csharp


    private void Button_Click(object sender, RoutedEventArgs e)


    {


    MessageBox.Show("Button clicked!");


    }


    ```


    In this example, we define a `Button` in XAML and handle its `Click` event in
    the code-behind.


