    \ `Stack` 类的实例：\n\n```cpp\nStack<int> intStack;\nStack<double> doubleStack;\n\
    ```\n\n### 模板特化\n\n模板特化允许你为特定数据类型提供专门实现，同时为其他类型保持泛型模板。当你需要对某些类型优化或自定义行为时，这非常有用。\n\
    \n这是一个计算数字平方的泛型函数的模板特化示例：\n\n```cpp\ntemplate <typename T>\nT square(T x) {\n\
