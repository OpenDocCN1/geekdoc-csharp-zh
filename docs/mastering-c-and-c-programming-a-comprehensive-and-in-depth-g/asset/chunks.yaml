    \n## 指针与函数\n\n指针在 C++ 函数中起着至关重要的作用，特别是在传递参数或返回动态分配的值时。你可以将指针传递给函数，允许函数修改指针所指向的数据。\n\
    \n这里有一个将指针传递给函数的示例：\n\n```cpp\n#include <iostream>\n\nvoid modifyValue(int* ptr)\
    \ {\n  *ptr = 99; // 将 ptr 指向的值改为 99\n}\n\nint main() {\n  int number = 42;\n\
    \  int* ptrToNumber = &number;\n  modifyValue(ptrToNumber);\n  std::cout << \"\
    Modified value: \" << *ptrToNumber << std::endl; // 输出: 99\n  return 0;\n}\n```\n\
    \n在此代码中，我们将指针 `ptrToNumber` 传递给 `modifyValue` 函数，该函数随后更改了指针所指向的值。\n\n## 引用\n\n\
    ### 什么是引用？\n\n引用是现有变量的别名或替代名称。与存储内存地址的指针不同，引用直接引用它别名的变量。引用通常用于创建更具可读性和更直观的代码。\n\
    \n以下是在 C++ 中声明引用的方式：\n\n```cpp\ndata_type& reference_name = existing_variable;\n\
    ```\n\n- `data_type`: 指定变量的数据类型。\n- `reference_name`: 你为引用选择的名字。\n- `existing_variable`:\
    \ 你想要通过引用为其创建别名的变量。\n\n### 初始化引用\n\n引用在声明时必须初始化，并且在初始化后不能更改为指向不同的变量。这使得引用比指针更安全、更可预测。\n\
    \n```cpp\nint number = 42;      // 声明并初始化一个整数变量\nint& refToNumber = number; //\
    \ 声明并初始化指向 'number' 的引用\n```\n\n在此代码中，`refToNumber` 是直接引用 `number` 变量的引用。\n\n\
    ### 使用引用\n\n引用可以像它们所别名的变量一样使用。当你修改引用时，你实际上是在修改它所引用的变量。这是一个示例：\n\n```cpp\nint number\
    \ = 42;      // 声明并初始化一个整数变量\nint& refToNumber = number; // 声明并初始化指向 'number'\
    \ 的引用\nrefToNumber = 99; // 通过引用修改 'number' 的值\n```\n\n在此代码中，更改 `refToNumber`\
    \ 的值也会更改 `number` 的值，因为它们本质上是同一个变量。\n\n### 引用与函数\n\n引用通常用于函数参数，以通过引用方式传递变量，允许函数直接修改原始变量。\n\
    \n这里是将变量通过引用传递给函数的示例：\n\n```cpp\n#include <iostream>\n\nvoid modifyValue(int&\
    \ ref) {\n  ref = 99; // 通过引用修改 'number' 的值\n}\n\nint main() {\n  int number =\
    \ 42;\n  modifyValue(number);\n  std::cout << \"Modified value: \" << number <<\
    \ std::endl; // 输出: 99\n  return 0;\n}\n```\n\n在此代码中，我们通过引用将 `number` 变量传递给 `modifyValue`\
    \ 函数，该函数随后修改了原始 `number` 变量。\n\n### 指针与引用的区别\n\n虽然指针和引用都提供了间接访问和修改变量的方法，但它们之间存在一些重要的区别：\n\
    \n1. **初始化**：引用在声明时必须初始化，且不能更改为指向不同的变量。指针可以在声明时不初始化，也可以可以更改为指向不同的变量。\n2. **可空性**：指针可以为空（不指向任何有效的内存位置），而引用始终引用有效对象。\n\
    3. **算术运算**：指针支持算术操作（例如指针加减法），而引用不支持。\n4. **语法**：引用在访问所引用的变量时使用更简洁的语法，因为它们不需要指针那样的解引用运算符。\n\
    5. **安全性**：引用通常更安全，因为它们保证引用有效对象，而指针可能为空或未初始化，如果使用不当，会导致未定义行为。\n\n### 何时使用指针或引用\n\
    \n在指针和引用之间做出选择取决于程序的具体需求：\n\n- 当你需要表示对象的缺失时（例如使用空指针）、当你想要更改指针指向不同的对象时，或者当你需要指针算术运算时，请使用指针。\n\
    - 当你想创建更可读、更直观的代码时、当你想避免空值问题时，或者你想通过引用将变量传递给函数进行修改时，请使用引用。\n\n## 结论\n\n指针和引用是\
    \ C++ 中的基本概念，提供了处理内存、数据和函数的强大方法。指针提供了对内存的直接控制，对于动态内存分配至关重要；而引用提供了一种更直观、安全的变量处理方式。\n\
    \n理解何时使用指针或引用对于编写高效且可维护的 C++ 代码至关重要。有了这些编程工具，你可以充满信心地探索更高级的技术，并应对复杂的编程挑战。在接下来的章节中，我们将深入更高级的\
    \ C++ 主题，进一步提升你作为 C++ 编程中间学习者的技能。\n\n# 第 9 章：面向对象编程\n\n面向对象编程 (OOP) 是 C++ 中一种强大的范式，允许你围绕对象的概念组织和构建代码。对象是类的实例，类是创建对象的蓝图。在本章中，我们将深入\
    \ OOP 的基础，探索类、对象、继承和封装。\n\n## 类与对象\n\n### 什么是类？\n\n在 C++ 中，类是一种用户定义的数据类型，作为对象的蓝图。它定义了对象的结构和行为。类封装了数据（属性）和操作这些数据的函数（方法），为建模现实实体提供了一种整洁有序的方式。\n\
    \n以下是在 C++ 中声明类的方式：\n\n```cpp\nclass ClassName {\n  // 成员变量（属性）\n  data_type attribute1;\n\
    \  data_type attribute2;\n\npublic:\n  // 成员函数（方法）\n  return_type method1(parameters);\n\
    \  return_type method2(parameters);\n};\n```\n\n- `ClassName`: 类名。\n- `data_type`:\
    \ 类属性的数据类型。\n- `attribute1`, `attribute2`: 代表类的成员变量。\n- `return_type`: 类方法的返回类型。\n\
    - `method1`, `method2`: 定义类行为的方法函数。\n\n### 什么是对象？\n\n对象是类的实例。它是类蓝图的具体实现，拥有自己的属性值值。对象允许你处理数据并根据定义的方法执行操作。\n\
    \n以下是在 C++ 中创建对象的方式：\n\n```cpp\nClassName objectName; // 创建一个类的类的对象\n```\n\n创建对象后，你可以使用点\
    \ (`.`) 运算符访问其属性并调用其方法：\n\n```cpp\nobjectName.attribute1 = value; // 访问并修改属性\n\
    return_type result = objectName.method1(parameters); // 调用方法\n```\n\n### 类构造函数与析构函数\n\
    \n类可以拥有特殊的成员函数，称为构造函数和析构函数。构造函数在对象创建时被调用，允许初始化其属性并分配资源。析构函数在对象离开作用域或显式删除时被调用，允许释放对象获取的所有资源。\n\
    \n这是一个构造函数和析构函数的示例：\n\n"
- fmt: "\n```cpp\nclass MyClass {\nint data;\npublic:\n  // Constructor\n  MyClass(int\
    \ initialData) {\n    data = initialData;\n    std::cout << \"Object created with\
    \ data: \" << data << std::endl;\n  }\n  // Destructor\n  ~MyClass() {\n    std::cout\
    \ << \"Object destroyed with data: \" << data << std::endl;\n  }\n};\n```\n\n\
    In this code, the constructor initializes the `data` attribute, and the destructor\
    \ provides a message when the object is destroyed.\n\n### Inheritance\n\nInheritance\
    \ is a core concept in OOP that allows you to create a new class (derived class\
    \ or subclass) based on an existing class (base class or superclass). The derived\
    \ class inherits attributes and methods from the base class and can also have\
    \ its own additional attributes and methods. Inheritance promotes code reusability\
    \ and allows you to model \"is-a\" relationships between classes.\n\nHere's how\
    \ you define an inheritance relationship in C++:\n\n```cpp\nclass BaseClass {\n\
    \  // Base class members\n};\n\nclass DerivedClass : public BaseClass {\n  //\
    \ Derived class members\n};\n```\n\n- `BaseClass`: The base class from which the\
    \ derived class inherits.\n- `DerivedClass`: The derived class that inherits from\
    \ the base class.\n\nIn the example above, `DerivedClass` inherits members from\
    \ `BaseClass`.\n\n### Access Control in Inheritance\n\nC++ provides three access\
    \ control specifiers for inherited members: `public`, `protected`, and `private`.\
    \ These specifiers control how the inherited members can be accessed from the\
    \ derived class.\n\n- `public`: Inherited members are accessible in the same way\
    \ as they are in the base class.\n- `protected`: Inherited members are treated\
    \ as `protected` in the derived class, meaning they can only be accessed within\
    \ the derived class or its subclasses.\n- `private`: Inherited members are treated\
    \ as `private` in the derived class, making them inaccessible from outside the\
    \ base class.\n\nHere's an example:\n\n```cpp\nclass BaseClass {\npublic:\n  int\
    \ publicMember;\nprotected:\n  int protectedMember;\nprivate:\n  int privateMember;\n\
    };\n\nclass DerivedClass : public BaseClass {\n  // publicMember is still public\n\
    \  // protectedMember is still protected\n  // privateMember is not accessible\
    \ from DerivedClass\n};\n```\n\n### Polymorphism\n\nPolymorphism is a fundamental\
    \ concept in OOP that allows objects of different classes to be treated as objects\
    \ of a common base class. This concept enables you to write code that can work\
    \ with various derived classes uniformly. Polymorphism is achieved through function\
    \ overriding and virtual functions.\n\n#### Function Overriding\n\nFunction overriding\
    \ occurs when a derived class provides a specific implementation of a method that\
    \ is already defined in the base class. The overridden method in the derived class\
    \ has the same name and signature as the base class method.\n\nHere's an example:\n\
    \n```cpp\nclass Animal {\npublic:\n  virtual void makeSound() {\n    std::cout\
    \ << \"Animal makes a sound\" << std::endl;\n  }\n};\n\nclass Dog : public Animal\
    \ {\npublic:\n  void makeSound() override {\n    std::cout << \"Dog barks\" <<\
    \ std::endl;\n  }\n};\n\nclass Cat : public Animal {\npublic:\n  void makeSound()\
    \ override {\n    std::cout << \"Cat meows\" << std::endl;\n  }\n};\n```\n\nIn\
    \ this code, the `makeSound()` method is overridden in both the `Dog` and `Cat`\
    \ classes to provide specific implementations. When you call `makeSound()` on\
    \ an object of the base class `Animal`, the appropriate derived class method is\
    \ invoked.\n\n### Virtual Functions\n\nTo enable polymorphism and dynamic binding,\
    \ you can use virtual functions. A virtual function is declared in the base class\
    \ with the `virtual` keyword, and it can be overridden in derived classes. When\
    \ a derived class object is accessed through a pointer or reference of the base\
    \ class type, the appropriate derived class virtual function is called at runtime.\n\
    \nHere's how you declare a virtual function:\n\n```cpp\nclass BaseClass {\npublic:\n\
