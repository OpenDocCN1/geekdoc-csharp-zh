    ## Abstract Classes and Interfaces


    ### Abstract Classes


    An abstract class is a class that cannot be instantiated and serves as a blueprint
    for other classes. It may contain abstract methods (methods without implementation)
    that must be overridden by its derived classes.


    ```csharp


    abstract class Vehicle


