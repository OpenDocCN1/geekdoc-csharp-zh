    \ name = person1.getName(); // 调用 getName 方法\nint age = person1.getAge(); // 调用\
    \ getAge 方法\n```\n\n## 构造函数和析构函数\n\n构造函数和析构函数是 C++ 类中特殊的成员函数，分别用于对象的初始化和清理。\n\n\
    ### 构造函数\n\n构造函数是在类对象创建时自动被调用的成员函数。它初始化对象的属性、分配资源并执行任何必要的设置。构造函数的名称与类相同，并可以带有参数用于自定义初始化。\n\
    \n这是我们在 `Person` 类中构造函数的示例：\n\n```cpp\nPerson(std::string n, int a) : name(n),\
    \ age(a) {}\n```\n\n在这段代码中，`Person` 是构造函数，它接受两个参数：用于名字的 `n` 和用于年龄的 `a` 初始化对象的\
    \ `name` 和 `age` 属性。\n\n### 析构函数\n\n析构函数是一个以波浪号 (`~`) 字符开头的特殊名称成员函数，例如 `~ClassName()`。当对象超出作用域或被显式删除时，它会被调用。析构函数用于释放资源、关闭文件或对对象执行任何必要的清理。\n\
    \n这是我们在 `Person` 类中析构函数的示例：\n\n```cpp\n~Person() {\n  // 此处编写析构代码（如果需要）\n}\n```\n\
    \n在这种情况下，`Person` 类的析构函数是空的，因为没有资源需要释放，但你可以根据需要包含清理代码。\n\n## 成员访问控制\n\n在 C++ 中，类成员（属性和方法）可以具有不同的访问控制修饰符，决定了它们从类外部的可见性和可访问性。主要的访问控制修饰符有：`public`、`protected`\
    \ 和 `private`。\n\n### public（公共）\n\n声明为 `public` 的成员可以在程序的任何地方访问，包括类外部。它们为类提供了公共接口，并可与类的对象交互。\n\
    \n### protected（保护）\n\n声明为 `protected` 的成员可以在类内部及派生类中访问。不能从外部直接访问。\n\n### private（私有）\n\
    \n声明为 `private` 的成员只能在类内部访问。\n\n以下是一个演示类访问控制的示例：\n\n```cpp\nclass MyClass {\n\
    public:\n  int publicMember; // 公共成员\nprotected:\n  int protectedMember; // 保护成员\n\
    private:\n  int privateMember; // 私有成员\n};\n```\n\n## 静态成员\n\n除了常规实例（非静态）成员外，C++\
    \ 类还可以拥有静态成员。静态成员属于类本身，而不是类的实例。它们被类的所有对象共享，并且可以在不创建实例的情况下进行访问。\n\n### 静态变量\n\n\
    静态变量在类内部使用 `static` 关键字声明。它们通常用于表示所有对象共享的数据。\n\n这是一个静态变量的示例：\n\n```cpp\nclass\
    \ MyClass {\npublic:\n  static int staticVar; // 静态变量\n};\n```\n\n### 静态方法\n\n\
    静态方法（成员函数）使用 `static` 关键字声明，并且不操作特定实例的数据。它们只能访问类的静态成员。\n\n这是一个静态方法的示例：\n\n```cpp\n\
    class MyClass {\npublic:\n  static void staticMethod() {\n    // 此处编写静态方法代码\n\
    \  }\n};\n```\n\n静态方法通过类本身调用，而不是类的实例：\n\n```cpp\nMyClass::staticMethod(); // 调用静态方法\n\
    ```\n\n## 常量正确性 (Const-Correctness)\n\n常量正确性涉及确保对象及其成员函数在声明为 `const` 时行为符合预期的概念。使用\
    \ `const` 对象或成员函数不会修改对象状态是一种良好的实践。\n\n### 常量成员函数\n\n你可以将成员函数声明为 `const` 以表示它们不会修改对象的数据。这允许这些函数在\
    \ `const` 对象上调用，并确保对象状态保持不变。\n\n这是一个常量成员函数的示例：\n\n```cpp\nclass MyClass {\npublic:\n\
    \  int getData() const {\n    return data;\n  }\nprivate:\n  int data;\n};\n```\n\
    \n"
