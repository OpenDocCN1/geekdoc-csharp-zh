    ## Operator Overloading


    Operator overloading is a feature in C++ that allows you to define custom behaviors
    for operators when used with objects of your class. It allows you to make your
    class objects work with operators in a way that is intuitive and meaningful for
    your application.


    ### Example: Operator Overloading for `+` (Addition)


    Let''s say you have a class `Complex` representing complex numbers, and you want
    to be able to add two `Complex` objects using the `+` operator.


    ```cpp


    class Complex {


    private:


    double real;


    double imag;


    public:


    Complex(double r, double i) : real(r), imag(i) {}


    // Overload the + operator


    Complex operator+(const Complex& other) const {


    double newReal = real + other.real;


    double newImag = imag + other.imag;


    return Complex(newReal, newImag);


    }


    // Member function to display the complex number


    void display() const {


    std::cout << real << " + " << imag << "i" << std::endl;


    }


    };


    ```


    In this code, we overload the `+` operator to add two `Complex` objects. The `operator+`
    function takes another `Complex` object as a parameter and returns a new `Complex`
    object representing the sum.


    Now, you can use the `+` operator to add `Complex` objects:


    ```cpp


    Complex a(3.0, 4.0);


    Complex b(1.5, 2.5);


    Complex result = a + b; // Use the + operator to add complex numbers


    result.display(); // Output: 4.5 + 6.5i


    ```


    ## Conclusion


    Classes and objects are fundamental concepts in C++ that enable you to create
    organized, reusable, and modular code. By defining classes with attributes and
    methods, you can model real-world entities and encapsulate their behavior. Objects
    are instances of classes, representing concrete entities that can store data and
    perform actions.


    Constructors and destructors are used for object initialization and cleanup, ensuring
    that objects are in a valid state and that resources are properly managed. Access
    control specifiers (public, protected, private) allow you to control the visibility
    of class members, enforcing encapsulation.


    Static members are shared among all instances of a class and are useful for representing
    shared data or behavior. Const-correctness helps ensure data integrity by allowing
    you to create `const` objects and declare member functions as `const`. Operator
    overloading allows you to define custom behaviors for operators when working with
    class objects.


    Understanding and mastering classes and objects is essential for effective C++
    programming. These concepts serve as the foundation for building complex systems,
    libraries, and applications.


    # # Chapter 11: Inheritance and Polymorphism


    Inheritance and polymorphism are two fundamental concepts in object-oriented programming
    (OOP) that enable the creation of hierarchies of classes and the development of
    flexible, extensible code. In this chapter, we will explore the core principles
    of inheritance, understand how it facilitates code reuse, and delve into the concept
    of polymorphism, where objects of different classes can be treated in a unified
    manner.


    ## Inheritance: Building on Existing Classes


    ### The Concept of Inheritance


    Inheritance is a fundamental concept in OOP that allows you to create new classes
    based on existing classes. Inheritance establishes an "is-a" relationship between
    classes, where a new class, known as the derived or child class, inherits attributes
    and behaviors from an existing class, known as the base or parent class. This
    mechanism enables code reuse, hierarchy modeling, and the organization of classes
    into logical structures.


    The derived class inherits the properties and methods of the base class, and it
    can also add its own unique attributes and behaviors. This inheritance relationship
    forms a hierarchy, where the derived class is a specialized version of the base
    class. The primary goal of inheritance is to promote code reusability and maintain
    a clear and logical class structure.


    ### Base and Derived Classes


    To create an inheritance relationship in C++, you define a base class and a derived
    class. The base class contains common attributes and behaviors that are shared
    among related classes, while the derived class inherits these members and extends
    or specializes them.


    Here''s the basic syntax for defining a derived class:


    ```cpp


    class BaseClass {


    // Base class members


    };


    class DerivedClass : accessSpecifier BaseClass {


    // Derived class members


    };


    ```


    - `BaseClass`: The name of the base class.


    - `DerivedClass`: The name of the derived class.


    - `accessSpecifier`: Specifies the access control for the inheritance relationship
    (public, protected, or private). This determines how the base class members are
    accessible in the derived class.


    ### Access Control in Inheritance


    C++ provides three access control specifiers for inherited members: `public`,
    `protected`, and `private`. These specifiers control how the inherited members
    can be accessed within the derived class and from outside the class hierarchy.


    - `public`: Inherited members retain their original access control. If a member
    was `public` in the base class, it remains `public` in the derived class, and
    it can be accessed from outside the derived class.


    - `protected`: Inherited members are treated as `protected` in the derived class,
    meaning they can only be accessed within the derived class or its subclasses.
    They are not directly accessible from outside the class hierarchy.


    - `private`: Inherited members are treated as `private` in the derived class,
    making them inaccessible from outside the base class. This level of access control
    is rarely used in practice.


    Here''s an example illustrating access control in inheritance:


    ```cpp


    class BaseClass {


    public:


    int publicMember;


    void publicMethod() {


    // ...


    }


    protected:


    int protectedMember;


    void protectedMethod() {


    // ...


    }


    private:


    int privateMember;


    void privateMethod() {


    // ...


    }


    };


    class DerivedClass : public BaseClass {


    // Inherited members retain their access control


    // publicMember and publicMethod are public


    // protectedMember and protectedMethod are protected


    // privateMember and privateMethod are not accessible


    };


    ```


    In this code, the `DerivedClass` inherits members from `BaseClass` with the specified
    access control.


    ### Constructors and Destructors in Inheritance


    Constructors and destructors play a vital role in the object''s lifecycle when
    inheritance is involved. When you have a base class and a derived class, the base
    class constructor is called before the derived class constructor, and the base
    class destructor is called after the derived class destructor.


    Here''s how the constructor and destructor calls work in inheritance:


    1\. Base Class Constructor: When you create an object of the derived class, the
    base class constructor is called first to initialize the base class part of the
    object.


    2\. Derived Class Constructor: After the base class constructor completes, the
    derived class constructor is called to initialize the derived class part of the
    object.


    3\. Derived Class Destructor: When the object goes out of scope or is explicitly
    deleted, the derived class destructor is called first to perform cleanup specific
    to the derived class.'
