    \n### 模板参数\n\n模板参数是在模板内部使用的数据类型或值的占位符。模板参数有两种类型：类型参数（`typename` 或 `class`）和非类型参数（`int`、`double`\
    \ 等）。\n\n这是一个同时带有类型参数和非类型参数的函数模板示例：\n\n```cpp\ntemplate <typename T, int N>\n\
