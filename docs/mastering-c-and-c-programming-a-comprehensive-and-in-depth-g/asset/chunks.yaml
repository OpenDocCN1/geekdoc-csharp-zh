    \n函数是结构化编程的骨石，使我们能够创建组织化且模块化的代码。当你继续 C# 编程之旅时，请记住掌握函数和方法的艺术将使你能够构建优雅高效的软件解决方案。因此，请拥抱模块化和面向函数的设计的力量，让你的代码绽放光！\n\
    \n# 第 6 章：面向对象编程概念\n\n欢迎来到面向对象编程 (OOP) 世界，这种范式为 C# 程序带来了新层次的结构和组织。面向对象编程允许你在代码中对现实世界中的实体、它们的属性和行为进行建模。在本章中，我们将探索\
    \ OOP 的核心概念，如类、对象、继承和封装，以及它们如何塑造我们设计和构建软件的方式。\n\n## 理解面向对象编程\n\n从核心上说，面向对象编程围绕着将一切视为“对象”的想法展开。对象是类的实例，而类本质上是创建对象的蓝图或模板。OOP\
    \ 鼓励我们从实体及其相互作用的角度来思考代码，镜像现实世界。\n\n## 类和对象\n\n### 类：对象的蓝图\n\n类是一种用户定义的数据类型，定义了对象的属性（字段）和行为（方法）。将类类一个蓝图，它描述了该类型的对象应该如何构建。\n\
    \n```csharp\nclass Person\n{\n    public string Name;\n    public int Age;\n \
    \   public void SayHello()\n    {\n        Console.WriteLine(\"Hello, my name\
    \ is \" + Name + \" and I am \" + Age + \" years old.\");\n    }\n}\n```\n\n在这个示例中，我们定义了一个\
    \ `Person` 类，具有属性 `Name` 和 `Age`，以及一个方法 `SayHello`。\n\n### 对象：类的实例\n\n对象是类的实例。它是使用蓝图创建的，并拥有具体的值。\n\
    \n```csharp\nPerson alice = new Person();\nalice.Name = \"Alice\";\nalice.Age\
    \ = 25;\nalice.SayHello(); // Output: Hello, my name is Alice and I am 25 years\
    \ old.\n```\n\n在这里，我们创建了 `Person` 类的实例 `alice`。\n\n## 封装：数据保护\n\n封装是将数据（属性）和操作这些数据的方法封装到一个单元（类）中的原则。它通过控制对对象内部状态的访问来提供数据保护。\n\
    \n```csharp\nclass BankAccount\n{\n    private double balance;\n    public void\
    \ Deposit(double amount)\n    {\n        if (amount > 0)\n        {\n        \
    \    balance += amount;\n        }\n    }\n    public void Withdraw(double amount)\n\
    \    {\n        if (amount > 0 && amount <= balance)\n        {\n            balance\
    \ -= amount;\n        }\n    }\n    public double GetBalance()\n    {\n      \
    \  return balance;\n    }\n}\n```\n\n在这个示例中，`balance` 字段封装在 `BankAccount` 类中，可以通过\
    \ `Deposit` 和 `Withdraw` 方法进行修改。\n\n## 继承：构建层次结构\n\n继承允许你基于现有类创建一个新类，继承它的属性和行为。新类被称为派生类，而现有类被称为基类。\n\
    \n```csharp\nclass Animal\n{\n    public void Eat()\n    {\n        Console.WriteLine(\"\
    The animal is eating.\");\n    }\n}\n\nclass Dog : Animal\n{\n    public void\
    \ Bark()\n    {\n        Console.WriteLine(\"Woof woof!\");\n    }\n}\n```\n\n\
    在这里，`Animal` 类有一个 `Eat` 方法，`Dog` 类继承自 `Animal` 并增加了一个 `Bark` 方法。\n\n## 多态：一种接口，多种实现\n\
    \n多态是不同类通过共同接口被视为同一类实例的能力。它允许代码更加灵活和动态。\n\n```csharp\nclass Shape\n{\n    public\
    \ virtual void Draw()\n    {\n        Console.WriteLine(\"Drawing a shape.\");\n\
    \    }\n}\n\nclass Circle : Shape\n{\n    public override void Draw()\n    {\n\
    \        Console.WriteLine(\"Drawing a circle.\");\n    }\n}\n\nclass Square :\
    \ Shape\n{\n    public override void Draw()\n    {\n        Console.WriteLine(\"\
    Drawing a square.\");\n    }\n}\n```\n\n在这个示例中，`Draw` 方法在派生类中被重写，允许每个形状都有自己的绘制实现。\n\
    \n"
