    \ 和 'condition2' 为假，则执行代码\n}\n```\n\n让我们来看一个示例：\n\n```cpp\n#include <iostream>\n\
    \nint main() {\n  int x = 10;\n  if (x > 15) {\n    std::cout << \"x is greater\
