- - '#'
  - 第 1 章：C# 简介
- - '##'
  - C# 的诞生
- - '##'
  - 为什么选择 C#？
- - '###'
  - 多功能：C# 不限于特定领域。可以使用它开发各种类型的应用程序，包括桌面软件、Web应用程序、移动应用甚至游戏。
- - '###'
  - 面向对象：C# 遵循面向对象编程 (OOP) 范式，促进类、对象和继承的使用。有助于创建组织良好且模块化的代码。
- - '###'
  - 内存管理：C# 通过名为“垃圾回收”的过程包含内存管理。简化了内存分配和释放，降低了内存错误的风险。
- - '###'
  - 丰富的标准库：C# 附带了一个全面的标准库，为各种任务提供了预定义的函数和类。让你专注于特定问题，而不是重复轮子。
- - '###'
  - 交互性：C# 设计上能够与 C、C++ 其他 .NET 语言进行无缝交互。让你能够利用现有的代码和库。
