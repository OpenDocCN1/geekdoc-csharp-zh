- "# ASP.NET Core Blazor Web应用程序：创建强大、响应式且引人入胜的 Web应用程序\n\n\n\n![](img/cover.jpg)\n\
  \n![image](img/cover.jpg)\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n## 第 2 章：选择你的托管模型\n\n\n\n\
  \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n  <meta charset=\"utf-8\"\
  \ />\n  <meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0,\
  \ maximum-scale=1.0, user-scalable=no\" />\n  <title>EShop</title>\n  <base href=\"\
  /\" />\n  <!-- <link href=\"css/bootstrap/bootstrap.min.css\" rel=\"stylesheet\"\
  \ -->\n  <link href=\"https://cdn.jsdelivr.net/npm/bootstrap@5.2.1/dist/css/bootstrap.min.css\"\
  \ rel=\"stylesheet\" integrity=\"sha384-iYQeCzEyFbKjA6...\" crossorigin=\"anonymous\"\
  \ />\n</head>\n<body>\n  <div id=\"app\">Loading...</div>\n  <div id=\"blazor-error-ui\"\
  >\n    An unhandled error has occurred.\n    <a href=\"\" class=\"reload\">Reload</a>\n\
  \    <a class=\"dismiss\">×</a>\n  </div>\n  <script src=\"_framework/blazor.webassembly.js\"\
  ></script>\n</body>\n</html>\n```\n\n这个 `index.html` 是 Blazor WebAssembly 应用的蓝图。它的工作方式与任何其他\
  \ Web 相同。在 `body` 部分，我们定义了一个 id 为 `app` 的 div 元素。在 builder 中添加到 `RootComponents`\
  \ 的组件将在用户关闭页面或导航到外部 URL 时插入到此处。更好的是，可以继承 `CircuitHandler` 来自定义电路的生命周期处理程序。通过记录每个已连接的客户端（如\
  \ SignalR 示例所示），用户可以显示有多少客户端正在阅读他们的博客或观看他们的视频。\n\n## BLAZOR HYBRID\n\nBlazor Hybrid\
  \ 最近加入了 Blazor 家族。它是一种使用 HTML 和 CSS 技术构建原生应用程序的混合方式。结合 `.NET MAUI`、`WPF` 和 `Windows\
  \ Forms`，用户可以解锁所有 Web 平台不具备的功能。接下来的章节将不再涵盖 Blazor Hybrid；但鼓励读者以自己的方式对其进行实验，特别是当他们已经有一个用\
  \ Blazor 构建的生产级 Web 应用时。这将大大减少开发相应原生应用的工作量。\n\n## CONCLUSION\n\n\n\n\n\n本章从 `WebSocket`\
  \ 协议开始。它旨在帮助在客户端和服务器之间建立全双工通信通道。它在实时 Web 应用中非常流行，例如即时消息和游戏。随后，本章引入了一个 .NET 库 `SignalR`。它旨在帮助用户构建高性能的实时应用程序。本章继续通过提供开发\
  \ demo 的信息，介绍客户端如何在线向彼此发送通知。\n\nBlazor Server 极度依赖 `SignalR` 来与客户端建立连接，所有的处理程序都运行在服务器端，而\
  \ Blazor WebAssembly 则将这些工作卸载到浏览器中。文中描述了这两种模式的主要优势。Blazor Hybrid 是另一种基于 Web 技术开发原生应用程序的混合方式，如果用户已经拥有基于\
  \ Blazor 的 Web，或者他们想要开发一个针对多个平台（包括 Web、桌面和移动端）的应用程序，它将整体提高生产力。\n\n在下一章中，将介绍 Blazor\
  \ 世界的核心构建块—— Razor 组件。本文将深入探讨组件是如何实现的，以及如何组合这些组件来渲染 UI、部分页面和布局。\n\n# 第 3 章\n\n#\
  \ 实现 RAZOR 及其他组件\n\n## 引言\n本章介绍了 Razor 组件，并讨论了特殊组件之一：布局（layout），它与其他组件也共享许多共同属性。文中将进入组件实现的细节，以及如何在页面上使用它们。此外，社区提供了大量的开源库，书中也将对其进行介绍。\n\
  \n## 结构\n在本章中，将讨论以下主题：\n- 指令（directives）\n- 单向绑定\n- 双向绑定\n- 级联（cascading）\n- 事件处理\n\
  - 生命周期周期（lifecycle）\n- 布局（layout）\n- 库（libraries）\n\n## 目标\n在本章中，读者将理解创建自定义组件的流程，并理解组件与模型之间的绑定，以创建一个交互式应用程序。\n\
  \n接下来，读者将学习组件的事件处理，并了解组件的生命周期，以自定义组件的行为。读者还将学习如何通过布局复用组件。\n\n从本章开始，读者将根据每章讨论的主题，逐步构建一个商店\
  \ Web 应用，并最终将其部署到云端。\n\n无论用户选择哪种 Blazor 模型，Razor 组件都将是从零构建应用程序的通用构建块。\n\n## RAZOR\
  \ 组件\n组件通常由扩展名为 `.razor` 的文件开发。它们是构建应用程序房子的砖块。Razor 语法基于 HTML 和 C#，其中 HTML 定义了如何渲染组件，而\
  \ C# 则定义了组件的逻辑。以下是用作示例的最简单 Razor 组件之一。\n\n在创建第一个组件之前，需要在首选终端中输入 `dotnet new blazorwasm`\
  \ 来创建一个 Blazor 项目。此示例使用 Microsoft 终端。使用 `dotnet run` 运行默认应用程序，并浏览到相应的端口页面；这里是 `https://localhost:7045`，它将显示类似于图\
  \ 3.1 所示的 Web 页面。\n\n![](img/pg_46.jpg)\n\n图 3.1 Blazor WebAssembly 首页。\n\n创建一个简单的头部组件，将\
  \ Hello, world! 替换为 This is my new head! 首先，进入根目录下的 shared 文件夹并创建一个名为 `MyHeader.razor`\
  \ 的新文件：\n\n```html\n<h1>@head</h1>\n\n@code {\nprivate string head = \"This is my\
  \ new head!\";\n}\n```\n\n更新 `Pages` 文件夹下的 `Index.razor` 以使用新创建的组件：\n\n```razor\n\
  @page \"/\"\n\n<PageTitle>Index</PageTitle>\n@* <h1>Hello, world!</h1> *@\n<MyHead\
  \ />\n\nWelcome to your new app.\n\n<SurveyPrompt Title=\"How is Blazor working\
  \ for you?\" />\n```\n\n我们注释了旧的 `h1` 标签并将其替换为新创建的组件。现在再次使用 `dotnet run` 运行程序并刷新浏览器。注意，首页上有一个显示为\
  \ This is my new head! 的头部：\n\n![](img/pg_47.jpg)\n\n图 3.2 带有新头部的首页。\n\n在 Razor\
  \ 组件中，用户应该广泛使用以 `@` 符号为缀的关键字，该关键字代表指令或指令属性。\n\n### 指令\n指令会更改组件的解析方式。以简单的头部组件 `MyHead`\
  \ 为例。在 `h1` 标签内部，有一个 `@` 符号，后面跟着变量 `head`。如果删掉 `@` 符号，用户将在首页上看到“head”。\n\n在本节中构建一个订单模型，用户可以更新购物车中的物品数量。\n\
  \n首先，创建一个商品模型和一个包含关键信息的订单模型，例如，客户正在购买哪些物品以及这些物品的数量：\n\n```csharp\nnamespace EShop.Models\n\
  {\n    public class ShopItem\n    {\n        public string Name { get; set; }\n\
  \        public string Description { get; set; }\n        public double Price {\
  \ get; set; }\n        public ShopItem(string name, string description, double price)\n\
  \        {\n            Name = name;\n            Description = description;\n \
  \           Price = price;\n        }\n    }\n}\n```\n\n下一个模型是 `CartItem`。它代表客户购物车中的物品，包括该特定物品的数量：\n\
  \n```csharp\nnamespace EShop.Models\n{\n    public class CartItem\n    {\n     \
  \   public ShopItem Item { get; set; }\n        public int Count { get; set; }\n\
  \    }\n}\n```\n\n终一个模型是 `Cart`。它包含了多个 `CartItem`：\n\n```csharp\nnamespace EShop.Models\n\
  {\n    public class Cart\n    {\n        public List<CartItem> Items { get; set;\
  \ } = new List<CartItem>();\n        public void Add(CartItem item)\n        {\n\
  \            Items.Add(item);\n        }\n        public void Remove(CartItem item)\n\
  \        {\n            Items.Remove(item);\n        }\n        public void Clear()\n\
  \        {\n            Items.Clear();\n        }\n    }\n}\n```\n\n接下来，在 `Pages`\
  \ 文件夹中创建一个 `Cart.razor` 页面来显示 `CartItems`：\n\n```razor\n@page \"/cart\"\n<PageTitle>Cart</PageTitle>\n\
  <h1>Cart</h1>\n<button class=\"btn btn-danger\" @onclick=\"Buy\">Buy</button>\n\
  <div class=\"list-group\">\n    @foreach (var item in _cart.Items)\n    {\n    \
  \    <div class=\"list-item\">\n            <div class=\"d-flex justify-content-between\"\
  >\n                <h5 class=\"mb-1\">@item.Item.Name</h5>\n                <small>$@item.Item.Price</small>\n\
  \            </div>\n            <p class=\"mb-1\">@item.Item.Description</p>\n\
  \            <small>\n                <div class=\"d-flex flex-row mb-3\">\n   \
  \                 <i class=\"p-2 bi-dash-square\" @onclick=\"()=>Remove(item)\"\
  ></i>\n                    <p class=\"p-2\">@item.Count</p>\n                  \
  \  <i class=\"p-2 bi-plus-square\" @onclick=\"()=>Add(item)\"></i>\n           \
  \     </div>\n            </small>\n        </div>\n    }\n</div>\n@code {\n   \
  \ private Models.Cart _cart = new Models.Cart();\n    private void Buy()\n    {\n\
  \        _cart.Add(new Models.CartItem(new Models.ShopItem(\"T-shirt\",\"One of\
  \ the tops\", 5), 1));\n    }\n    private void Add(Models.CartItem item)\n    {\n\
  \        item.Count++;\n    }\n    private void Remove(Models.CartItem item)\n \
  \   {\n        item.Count--;\n    }\n}\n```\n\n### 指令属性\n指令属性主要应用于 Razor 组件，并影响功能。它更像是\
  \ Razor 组件的增强。\n\n人们可能会发现非常有用的指令属性是 `@bind`。它在后台视图和模型之间建立数据绑定。当应用程序更新模型数据时，前端将重新渲染以反映变化。这暗示了\
  \ MVVM。\n\n### 单向绑定\nBlazor 提供了数据绑定功能，用户可以将用户输入绑定到他们的模型。\n\n例如，如果客户想将购物车中的物品数量从\
  \ 1 改为 100，按照之前的实现，他们可能需要点击 99 次添加按钮，这绝对不是良好的用户体验。用户可以使用输入元素进行绑定，这样客户就可以输入任何想要的值。\n\
  \n将 `<p>` 标签替换为 `<input>` HTML 元素并绑定到 `item.Count`。为了验证模型值是否正确更新，编写一个 `Print` 方法来记录更新物品的数量：\n\
  \n\n\n\n\n@* some code *@\n\n```html\n<div class=\"d-flex flex-row mb-3\">\n<i class=\"\
  p-2 bi bi-dash-square\" @onclick=\"()=>Remove(item)\"></i>\n<input class=\"p-2\"\
  \ type=\"text\" @bind=\"item.Count\" />\n<i class=\"p-2 bi bi-plus-square\" @onclick=\"\
  ()=>Add(item)\"></i>\n<p class=\"p-2\">@item.Count</p>\n</div>\n```\n@* some code\
  \ *@\n\n购买一件 T 恤，将数量更改为 100，用户应该看到加号按钮旁标签现在也变成了 100。\n\n## 绑定事件 (BINDING EVENT)\n\
  \n在在上一个示例中，更改 item 数量的值后，只有当用户点击其他地方时，下一个标签才会更新为新值。这可能会让客户困惑，因为如果他们不点击任何地方，值就不会更新，导致他们支付了一个数量错误的订单。使用\
  \ `@bind:event` 指令可以轻松解决这个问题。\n\n该指令定义了绑定在什么事件触发下更新值。默认情况下，`@bind:event` 隐式设置为 `onchange`\
  \ 事件。根据 HTML 标准，`onchange` 会在满足两个条件时触发：第一个是内容已更改，第二个是元素失去焦点。在这种情况下，当客户点击一个元素导致 item\
  \ 数量输入框失去焦点并触发 `onchange` 事件时，会导致模型值在后台得到更新。\n\n为了提高用户体验，可以将输入元素上的此绑定指令设置为 `oninput`\
  \ 事件：`<input class=\"p-2\" type=\"text\" @bind=\"item.Count\" @bind:event=\"oninput\"\
  \ />`。这与 `onchange` 事件类似，它会在值改变时立即触发，这意味着客户每按任意键都会触发它，绑定模型将更新得更频繁。这是 `onchange`\
  \ 或 `oninput` 事件之间的一种平衡。如果 `oninput` 事件触发的频繁更新成为应用程序的性能瓶颈，可能会考虑使用默认的 `onchange`\
  \ 事件。\n\n## 绑定格式 (BINDING FORMAT)\n\n另一个实用的绑定指令可能是 `@bind:format`。它定义了显示绑定模型的格式。例如，产品所有者决定使用自定义格式显示购物车中每个项目的更新时间，显示该项目被放入购物车的时间或数量更新的时间。\n\
  \n要显示时间，请为 `CartItem` 模型添加一个 `DateTime` 属性 `UpdateTime`，并在 `Count` 更改时更新它：\n\n```csharp\n\
  namespace EShop.Models\n{\n    public class CartItem\n    {\n        // some code\n\
  \        private int _count;\n        public int Count\n        {\n            get\
  \ => _count;\n            set\n            {\n                _count = value; UpdateTime\
  \ = DateTime.Now;\n            }\n        }\n        public DateTime UpdateTime\
  \ { get; set; } = DateTime.Now;\n        // some code\n    }\n}\n```\n\n将 `UpdateTime`\
  \ 绑定到 Cart Razor 页面上的只读 `<input>` 元素：\n\n```html\n@* some code *@\n<div class=\"\
  d-flex w-100 justify-content-between\">\n<h5 class=\"mb-1\">@item.Item.Name</h5>\n\
  <small><input readonly @bind=\"item.UpdateTime\"></input\n</small>\n</div\n@* some\
  \ code *@\n```\n\n当没有设置格式指令时，应用程序 Web 页面将显示默认的 `DateTime` 字符串：\n\n![](img/pg_55-1.jpg)\n\
  \n图 3.3 默认 DateTime 格式。\n\n为了匹配产品所有者的需求，我们可以为元素添加格式指令，`<small><input readonly @bind=\"\
  item.UpdateTime\" @bind:format=\"HH:mm:ss\"></input></small>`，它将只显示时间不再显示日期：\n\n\
  ![](img/pg_55-2.jpg)\n\n图 3.4 自定义 DateTime 格式。\n\n截至目前，格式指令仅支持 `DateTime` 表达式。要显示更多值的格式化，开发者必须为绑定目的添加自定义字符串属性。\n\
  \n## 未解析的值 (UNPARSED VALUE)\n\n如果客户为项目数量输入字符串而不是数字，绑定指令将自动将值恢复到上一个。在示例中，用户将值绑定到\
  \ `int` 的 `Count` 属性，如果他们先输入 10，然后在键盘上持续输入“H”，它将保持为 10 没有任何影响。\n\n处理未解析值的另一种自定义方法是与字符串值绑定，然后编写\
  \ `get` 和 `set` 方法以独特的方式或格式将绑定字符串转换为模型数据，因为 `bind` 指令会在指定的绑定事件时调用 `get` 和 `set`\
  \ 方法。\n\n## 双向绑定 (TWO-WAY BINDING)\n\n微小的标签部分用于每个项目的 `Count`，现在可能是重构 Cart 页面并创建一个专门用于项目数量的\
  \ `CartItemCount` Razor 组件的好机会。\n\n创建一个名为 `Components` 的新文件夹并在下方创建一个自定义组件 `CartItemCountComponent.razor`：\n\
  \n```html\n<small>\n<div class=\"d-flex flex-row mb-3\">\n<i class=\"p-2 bi bi-dash-square\"\
  \ @onclick=\"Remove\"></i>\n<input class=\"p-2\" type=\"text\" @bind=\"Count\" @bind:event=\"\
  oninput\" />\n<i class=\"p-2 bi bi-plus-square\" @onclick=\"Add\"></i>\n<p class=\"\
  p-2\">@Count</p>\n</div\n</small>\n```\n\n```csharp\n@code {\n    [Parameter]\n\
  \    public int Count { get; set; }\n    public void Add()\n    {\n        Count++;\n\
  \    }\n    public void Remove()\n    {\n        Count--;\n    }\n}\n```\n\n\n\n\
  \n\n```csharp\nawait CountChanged.InvokeAsync(Count);\n}\n\npublic async Task RemoveAsync()\n\
  {\n    Count--;\n    await CountChanged.InvokeAsync(Count);\n}\n\npublic async Task\
  \ OnInput(ChangeEventArgs args)\n{\n    if (args.Value is null || string.IsNullOrWhiteSpace(args.Value.ToString()))\n\
  \    {\n        Count = 1;\n    }\n    else\n    {\n        Count = int.Parse(args.Value.ToString());\n\
  \    }\n    await CountChanged.InvokeAsync(Count);\n}\n}\n```\n\n### 组件版本亮点\n\n\
  `CartItemCount` 组件的这个版本几个亮点。第一个是用户提供了一个 `EventCallback` 事件。通过 `Parameter` 属性，该事件是用户暴露给父组件的事件。父组件将处理带有泛型负载的通知事件以实现进一步逻辑。\n\
  \n在示例中，暴露一个 `CountChanged` 事件，并在所有 `Count` 值变化的地方调用该事件。从页面侧，通过以下代码将单向绑定升级为双向绑定：`<CartItemCount\
  \ @bind-Count=\"item.Count\" @bind-Count:event=\"CountChanged\" />`。与直接将 `item.Count`\
  \ 赋值给 `Count` 属性不同，我们使用 `bind` 指令将 `Count` 属性与 `item.Count` 双向绑定。如果来自 `item.Count`\
  \ 的值发生变化，子项属性将照常更新。这次，如果子组件的 `Count` 属性发生变化，由于用户每次都会调用通知事件，父页面也将收到通知，并同样调用 `Cart`\
  \ 模型的 `set` 方法，这样右上角显示的时间将反映最新的变化。\n\n注意这里的语法。组件参数在父组件中使用 `@bind-{PROPERTY}` 绑定，其中\
  \ `{PROPERTY}` 代表要绑定的属性。在这种情况下，属性是 `Count`，带有 `Parameter` 属性。你还必须实现一个名为 `{PROPERTY}Changed`\
  \ 带有 `Parameter` 属性的 `EventCallback`。这两个“参数”配合 `@bind` 语法实现了组件之间的双向绑定。\n\n### 级联\
  \ (CASCADING)\n\n将参数传递给低层组件已被证明是构建不同层次系统的强大工具。它有助于维护整洁的代码和清晰的业务逻辑。仅仅向下传递一层是不够的。有时，随着应用程序的演变以及更多功能或需求的出现，用户需要引用一个或以上的上下文。如果用户发现自己处于复杂的业务规则情况下，他们通常会选择重构代码以更符合面向对象，并具有多层层次结构。\n\
  \n基于这个原因，开发团队决定再次重构 `Cart` 页面。这次，他们将构建一个特定的 `Cart` Razor 组件，该组件将使用几个 `CartItem`\
  \ 组件来表示客户为购物车选择的商品。\n\n一个新挑战是如何使用 `Parameter` 属性将数据上下文从 `_dart` 对象传递到深层组件；用户只被允许向下传递一层参数。为了更进一步，他们将引入另一个属性\
  \ `CascadingParameter`。通过 `CascadingParameter` 和 `CascadingValue`，用户可以在整个组件树中识别统一的数据上下文。一个典型的例子是为层次树中的所有组件定义通用的\
  \ CSS 样式。\n\n设计的 UI 为 `EShop Cart` 页面定义了统一的 `fontsize`，这个 `fontsize` 标准将传递给所有引用的组件：\n\
  \n```razor\n@using Models\n\n<h3>@Cart.User</h3>\n\n<div class=\"list-group\">\n\
  \    @foreach (var item in Cart.Items)\n    {\n        <div class=\"list-group-item\"\
  >\n            <div class=\"d-flex w-100 justify-content-between\">\n          \
  \      <p class=\"mb-1\" style=\"@FontSize\">@item.Item.Name</p>\n             \
  \   <small><input readonly @bind=\"item.UpdateTime\" @bind:format=\"HH:mm:ss\"></input></small>\n\
  \            </div>\n            <p class=\"mb-1\">@item.Item.Description</p>\n\
  \            <CartItemCount @bind-Count=\"item.Count\" @bind-Count:event=\"CountChanged\"\
  \ />\n        </div>\n    }\n</div>\n\n@code {\n    [Parameter]\n    public Cart\
  \ Cart { get; set; }\n\n    [CascadingParameter(Name = \"FontSize\")]\n    public\
  \ string FontSize { get; set; }\n\n    [CascadingParameter(Name = \"FontStyle\"\
  )]\n    public string FontStyle { get; set; }\n}\n```\n\n将级联属性添加到 `CartItemCountComponent`\
  \ Razor 组件中：\n\n```razor\n<small>\n    <div class=\"d-flex flex-row mb-3\">\n  \
  \      <i class=\"p-2 bi bi-dash-square\" style=\"@FontSize\" @onclick=\"RemoveAsync\"\
  ></i>\n        <input class=\"p-2\" style=\"@FontSize font-style: italic;\" type=\"\
  text\" value=\"@Count\" @oninput=\"OnInput\" />\n        <i class=\"p-2 bi bi-plus-square\"\
  \ style=\"@FontSize\" @onclick=\"AddAsync\"></i>\n        <p class=\"p-2\" style=\"\
  @FontSize\">@Count</p>\n    </div>\n</small>\n```\n\n```csharp\n@code{\n    [Parameter]\n\
  \    public int Count { get; set; }\n\n    [Parameter]\n    public EventCallback<int>\
  \ CountChanged { get; set; }\n\n    [CascadingParameter(Name = \"FontSize\")]\n\
  \    public string FontSize { get; set;}\n\n    [CascadingParameter(Name = \"FontStyle\"\
  )]\n    public string FontStyle { get; set; }\n\n    @* some 代码 *@\n}\n```\n\n在最父层的\
  \ Razor 页面中定义 `CascadingValue`。\n\n```razor\n@page \"/cart\"\n@using EShop.Components;\n\
  <PageTitle>购物车</PageTitle>\n<h1>购物车</h1>\n<button class=\"btn btn-danger\" @onclick=\"\
  Buy\">购买</button>\n<CascadingValue Value=\"@_fontSize\" Name=\"FontSize\">\n   \
  \ <CascadingValue Value=\"@_fontStyle\" Name=\"FontStyle\">\n        <CartComponent=\"\
  @_cart\" />\n    </CascadingValue>\n</CascadingValue>\n\n@code {\n    private Models.Cart\
  \ _cart = new Models.Cart();\n    private string _fontSize = \"font-size:30px;\"\
  ;\n    private string _fontStyle = \"font-style: italic;\";\n\n    private void\
  \ Buy()\n    {\n        _cart.Add(new Models.CartItem(\"T 恤\", \"热门上衣\"));\n   \
  \     _cart.Add(new Models.CartItem(\"夹克\", \"最受欢迎\"));\n    }\n}\n```\n\n核心思想是用\
  \ `CascadingValue` 包裹组件。在这种标签中，用户将定义一个向下穿透整个树的上下文。意图使用 `CascadingParameter` 的组件将接收该上下文。在这个示例中，用户在页面级定义了全局字体大小和字体样式并将它们传递到树中。通常情况下，`CascadingValue`\
  \ 是设置主题或样式的最佳选择。\n\n### 事件处理\n\n组件的另一个流行特性是事件处理。在 Blazor 组件世界，用户可以使用双向绑定部分看到的 `EventCallback`\
  \ 来定义事件，通知父组件数据已更新。与普通 .NET 中的 `event` 关键字不同，组件中使用 `EventCallback` 结构体。`EventCallback`\
  \ 只能被一个方法订阅，当用户触发事件时只会调用该方法。而在普通 .NET 中，事件可以被多个方法订阅，这些方法在触发事件时会被一起调用。\n\n来自产品所有的新用户故事。EShop\
  \ 将允许客户从购物车移除商品，并在移除商品时记录日志，以便业务部门分析数据并改进客户体验。\n\n在 `CartComponent` Razor 组件中添加\
  \ `EventCallback OnItemRemoved`：\n\n```razor\n@using Models\n\n<h3>@Cart.User</h3>\n\
  <div class=\"list-group\">\n    @foreach (var item in Cart.Items)\n    {\n     \
  \   <div class=\"list-group-item\">\n            <div class=\"d-flex w-100 justify-content-between\"\
  >\n                <p class=\"mb-1\" style=\"@FontSize\">@item.Item.Name</p>\n \
  \               <small>\n                    <div>\n                        <input\
  \ readonly @bind=\"item.UpdateTime\" @bind:format=\"HH:mm:ss\"></input>\n      \
  \                  <i class=\"p-2 bi bi-x-octagon-fill\" @onclick=\"()=>Remove(item)\"\
  ></i>\n                    </div>\n                </small>\n            </div>\n\
  \            <p class=\"mb-1\">@item.Item.Description</p>\n            <CartComponent\
  \ OnItemRemoved=\"HandleItemRemoved\" />\n        </div>\n    }\n</div>\n```\n\n\
  \n\n\n\n```html\n<p class=\"mb-1\">@item.Item.Description</p>\n\n<CartItemCountComponent\
  \ @bind-Count=\"item.Count\" @bind-Count:event=\"CountChanged\" />\n\n</div\n\n\
  @code {\n    [Parameter]\n    public Cart Cart { get; set; }\n\n    [CascadingParameter(Name\
  \ = \"FontSize\")]\n    public string FontSize { get; set; }\n\n    [CascadingParameter(Name\
  \ = \"FontStyle\")]\n    public string FontStyle { get; set; }\n\n    [Parameter]\n\
  \    public EventCallback<CartItem> OnCartItemRemoved { get; set; }\n\n    private\
  \ void Remove(CartItem item)\n    {\n        OnCartItemRemoved.InvokeAsync(item);\n\
  \    }\n}\n```\n\n将方法作为委托传递给 `OnCartIteAlibaba` 并反回：\n\n```razor\n@page \"/cart\"\
  \n@using EShop.Components;\n\n<PageTitle>购物车</PageTitle>\n<h1>购物车</h1>\n<button\
  \ class=\"btn btn-danger\" @onclick=\"Buy\">购买</button>\n<CascadingValue Value=\"\
  @_fontSize\" Name=\"FontSize\">\n    <CascadingValue Value=\"@_fontStyle\" Name=\"\
  FontStyle\">\n        <CartComponent Cart=\"@_cart\" OnCartItemRemoved=\"OnCartItemRemoved\"\
  />\n    </CascadingValue>\n</CascadingValue>\n\n@code {\n    private Models.Cart\
  \ _cart = new Models.Cart(\"Brian\");\n    private string _fontSize = \"font-size:\
  \ 30px;\";\n    private string _fontStyle = \"font-style: italic;\";\n\n    private\
  \ void Buy()\n    {\n        _cart.Add(new Models.CartItem(new Models.ShopItem(\"\
  T-恤\",\"上衣之一\", 5), 2));\n        _cart.Add(new Models.CartItem(new Models.ShopItem(\"\
  夹克\", \"最受欢迎\", 17), 1));\n    }\n\n    private void OnCartItemRemoved(Models.CartItem\
  \ item)\n    {\n        _cart.Remove(item);\n    }\n}\n```\n\n在 `CartComponent`\
  \ 组件中，如果 `CartItem` 是一个参数，用户会暴露一个 `EventCallback`，这样页面就可以像调用之前定义的任何其他参数一样，调用组件并将方法分配给此回调。之后，用户可以在子组件中随时调用此回调，并传入\
  \ `CartItem` 实例作为回调参数。在订阅该方法的方法，当用户调用回调时将会执行。通过这种方式，当用户点击子组件中的删除按钮时，他们在页面实现了 `CartItem`\
  \ 的删除操作。\n\n### 生命周期\n\n在 Razor 组件中，有多个虚拟方法供用户选择重写以更改此组件的渲染行为。这些虚拟方法按照生命周期顺序为：`SetParametersAsync`、`OnInitializedAsync`、`OnParametersSetAsync`、`ShouldRender`、`BuildRenderTree`、`OnAfterRenderAsync`。\n\
  \n`SetParametersAsync` 将设置到此组件的所有参数封装在 `ParameterView` 对象中，用户可以通过名称获取参数。现在是根据参数值从后端\
  \ API 获取数据的好机会。接下来，调用基类的 `SetParametersAsync`，在基方法实现中，如果是第一次创建此组件实例，它将调用 `OnInitializedAsync`，然后立即调用\
  \ `OnParametersSetAsync`。此时，用户可以获取组件的状态和已设置的参数。\n\n当用户想要显式地重新渲染组件时，可以调用 `StateHasChanged`\
  \ 来触发渲染。Blazor 将会检查 `ShouldRender`。此方法返回一个 `Boolean` 值，告知 Blazor 是否将进行渲染。如果用户在此方法中返回\
  \ `false`，他们将阻止 Blazor 重新渲染此组件，从而提高用户体验并构建高性能应用程序。如果尚未为此组件编写任何标记代码，`BuildRenderTree`\
  \ 是另一个可以重写的虚拟方法。在此方法中，用户可以通过编码来具体地定义如何渲染组件。一旦 Blazor 完成渲染，将调用 `OnAfterRenderAsync`，此时在此处引用组件（ref\
  \ component）是安全的。如果组件实现了 `IDisposable` 接口，则组件生命周期中的最后一个方法是 `Dispose`。当组件从渲染树中移除时，Blazor\
  \ 将调用此方法，这将是用户释放所有资源的好机会。\n\n### 布局\n\n通过三个默认页面和 `Cart` 页面，`EShop` 应用程序目前总共有四个页面，它们共享相同的顶部头部和侧边导航栏。这是通过\
  \ Blazor 中的布局（Layout）实现的。如果正在构建一个复杂的 Web 应用程序，通常会有多个页面，在整个应用程序中保持一致的头部或导航菜单是非常重要的。布局可以显示在每个页面上，为用户避免了重复代码，并便于维护共享的一致性。\n\
  \n布局实际上是 Blazor 中的一个特殊组件。所有的布局将继承自 `BlazorLayoutComponent`，该类继承自 `ComponentBase`（普通组件继承的相同基类）。它提供了一个类型为\
  \ `RenderFragment` 的特殊参数 `Body`。在实现的布局中可以在任何地方渲染 `@body`。因此，用户可能会在布局中添加顶部头部和侧边导航菜单，就像默认\
  \ Blazor 示例那样，并在 `article` 元素中渲染主体：\n\n```razor\n@inherits LayoutComponentBase\n\
  \n<div class=\"page\">\n    <div class=\"sidebar\">\n        <NavMenu />\n    </div>\n\
  \    <main>\n        <div class=\"top-row px-4\">\n            <a href=\"https://docs.microsoft.com/aspnet/\"\
  \ target=\"_ blank\">关于</a>\n        </div>\n        <article class=\"content px-4\"\
  >@Body\n        </article>\n    </main>\n</div>\n```\n\n布局实际上是 Blazor 中的一个特殊组件。所有的布局将继承自\
  \ `BlazorLayoutComponent`，该类继承自 `ComponentBase`（普通组件继承的相同基类）。它提供了一个类型为 `RenderFragment`\
  \ 的特殊参数 `Body`。在实现的布局中可以在任何地方渲染 `@body`。因此，用户可能会在布局中添加顶部头部和侧边导航菜单，就像默认 Blazor 示例那样，并在\
  \ `article` 元素中渲染主体：\n\n```razor\n@inherits LayoutComponentBase\n\n<div class=\"\
  page\">\n    <div class=\"sidebar\">\n        <NavMenu />\n    </div>\n    <main>\n\
  \        <div class=\"top-row px-4\">\n            <a href=\"https://docs.microsoft.com/aspnet/\"\
  \ target=\"_ blank\">关于</a>\n        </div>\n        <article class=\"content px-4\"\
  >@Body\n        </article>\n    </main>\n</div>\n```\n\n为了将内容包裹在布局中，用户需要声明他们想要放置内容。布局可以像普通组件一样嵌套。以下是如何创建一个布局。在\
  \ `Shared` 文件夹下创建一个名为 `EShopLayout.razor` 的文件：\n\n```razor\n@inherits LayoutComponentBase\n\
  \n<div>\n    <p>EShop 应用</p>\n    <div>\n        @Body\n    </div>\n</div>\n```\n\
  \n首先，创建一个父级布局 `EShopLayout`，并在 `Shared/MainLayout.razor` 的第二行通过添加 `@layout EShopLayout`\
  \ 来引用它。为了验证布局生效，更新 `App.razor` 将 `NotFound` 的布局从 `@typeof(MainLayout)` 更改为 `@typeof(EShopLayout)`。\n\
  \n运行应用程序并观察顶部额外的 `EShop Application` 标签。跳转到未声明的路由（例如 `/eshop`），导航菜单将会消失，只剩下 `EShop\
  \ Application` 标签，这意味着“未找到”路由将直接渲染在 `EShopLayout` 中，而 `Cart` 页面则在嵌套的 `MainLayout`\
  \ 中渲染。\n\n### 库\n\n在开源社区中，有很多用户可以使用的流行的 Blazor 组件库。\n\n（此处重复部分翻译内容）\n[/content]\n\
