  ;\n            CreatedTime = DateTime.Now;\n        }\n    }\n}\n```\n\n在此 `Comment`\
  \ 模型中设计了三个属性，现在使用来自 Bing Image 的图片来代表商品。\n\n在此 `Comment` 模型中设计了三个属性，现在使用来自 Bing\
  \ Image 的图片来代表商品。\n\n```csharp\nnamespace EShop.Models\n{\n    public class ShopItem\n\
