  \ Blazor 组件。\n\n下一章将进一步讨论组件和布局背后的更多机制，并以一些源代码作为示例，学习提高应用程序性能的技术。\n\n# 第 4 章：Blazor\
  \ 组件增强的高级技术\n\n## 引言\n\n第 3 章 介绍了 Razor 组件作为 Blazor 应用的核心构建材料。在本章中，通过深入源码，读者将学习一些增强组件功能和性能的高级方法。\n\
  \n## 结构\n本章将讨论以下主题：\n\n- 如何引用其他组件\n- 如何保留元素或组件\n- 如何对组件使用模板\n- CSS 隔离\n\n在本章中，我们将理解围绕\
  \ Blazor 组件的高级主题。例如，组件引用和保留。我们还将理解组件模板和 CSS 隔离，以帮助你更好地组织代码结构。\n\n## 组件引用\n有时，用户可能想在自己的组件内部控制其他组件。在\
  \ HTML 和 JavaScript 世界中，用户通常会向要操作的元素添加 `id` 属性。而在 Blazor 中，没有简单的方法可以在 C# 代码中通过 `id`\
  \ 获取元素。解决此问题的一种方法是使用 第 3 章 中引入的指令属性之一。\n\n`@ref` 指令属性允许开发者引用另一个组件，通过这种方式，用户可以直接从引用的组件实例调用方法。例如，用户想要检查已添加到购物车的物品，他们可以引用\
  \ `CartComponent` 并调用它的 `Checkout` 方法，就像在普通 C# 代码中从任何其他实例调用方法一样。\n\n```csharp\n\
  // 一其他代码\n\npublic void Checkout()\n{\n    foreach (var item in Cart.Items)\n  \
  \  {\n        Console.WriteLine($\"Checkout {item.Count} {item.Item.Name}, the total\
  \ is {item.Count * item.Item.Price}\");\n    }\n}\n```\n\n首先，在 `CartComponent` 源码中添加一个新的的\
  \ `Checkout` 方法。该方法将遍历购物车中的所有物品，并打印出显示数量、名称和总价的日志。\n\n接下来，在 `CarPage.razor` 的 `CartComponent`\
  \ 中添加 `@ref` 指令属性，并像它是该页面类的一个属性一样使用此组件引用。\n\n```razor\n@page \"/cart\"\n@using EShop.Components;\n\
  \n<PageTitle>购物车</PageTitle>\n<h1>购物车</h1>\n<button class=\"btn btn-danger\" @onclick=\"\
  Buy\">购买</button>\n<CascadingValue Value=\"@_fontSize\" Name = \"FontSize\">\n<CascadingValue\
  \ Value=\"@_fontStyle\" Name = \"FontStyle\">\n<CartComponent @ref=\"cartComponent\"\
  \ Cart=”@_cart”\nOnCartItemRemoved=\"OnCartItemRemoved\" />\n</CascadingValue>\n\
  </CascadingValue>\n<button class=\"btn btn-warning\" @onclick=\"Checkout\">结算</button>\n\
  \n@code {\n    private Models.Cart _cart = new Models.Cart(\"Brian\");\n    private\
  \ string _fontSize = \"font-size: 30px;\";\n    private string _fontStyle = \"font-style:\
  \ italic;\";\n    private CartComponent cartComponent;\n\n    private void Buy()\n\
  \    {\n        _cart.Add(new Models.CartItem(new Models.ShopItem(\"T-shirt\", \"\
  One of the tops\", 5), 2));\n        _cart.Add(new Models.CartItem(new Models.ShopItem(\"\
  Jacket\", \"The most popular\", 17), 1));\n    }\n\n    private void OnCartItemRemoved(Models.CartItem\
  \ item)\n    {\n        _cart.Remove(item);\n    }\n\n    private void Checkout()\n\
  \    {\n        cartComponent.Checkout();\n    }\n}\n```\n\n在这里，我们在 Razor 组件中放置了业务逻辑结算，但在实践中，用户可能想在用户和应用程序之间添加更多交互逻辑，而不是业务逻辑。通常，业务逻辑属于模型层。\n\
  \n在这个示例中，`CartComponent` 中有一个公共方法，它在 `CartPage` 中用于向客户显示购物车详情。在向组件添加 `@ref` 指令属性之前，用户仅依赖于\
  \ `CartComponent` 本身的能力。由于用户使用 `@ref` 指令属性在 Razor 页面中捕获该组件的引用，他们在控制组件行为方面具有更大的灵活性，从而能够为购物车添加更多功能。这就像调用一个普通的\
  \ C# 实例，人们可以调用任何标记为公共可访问的实例成员。\n\n## 组件保留\n在 Web 应用程序中，显示各种类型的数据列表或表格是非常常见的。这可以是员工工资单表格、上个月的销售收入表，或者仅仅是下周的天气预报列表。有时，这些列表或数据是静态的。它们在用户的某些体验过程中保持不变。有时，它们是动态的，用户必须不断刷新数据。结果是\
  \ Web 应用程序必须不断重新渲染自身，如果有大量数据需要刷新，可能会消耗大量资源。\n\n一个例子是，当数据是静态的，它们在用户的某些体验过程中保持不变。有时，它们是动态的，用户必须不断刷新数据。结果是，\
  \ Web 应用程序必须不断重新渲染自身，如果有大量数据需要刷新，可能会消耗大量资源。幸运的是，Blazor 提供了一个指令 `@key` 来保存数据，用户不需要手动控制重新渲染。\n\
  \n创建一个名为 `ListComponent.razor` 的新文件，并在 `Components` 文件夹下结合相应的模型构建列表组件。\n\n```razor\n\
  <div class=\"list\">\n    @foreach (var item in Items)\n    {\n        <li key=\"\
  @item.Item.Id\">\n            <div class=\"list-item\">\n                <div class=\"\
  d-flex w-100 justify-content-between\">\n                    <p class=\"mb-1\" style=\"\
  @FontSize\">@item.Item.Name</p>\n                    <small>\n                 \
  \       <div>\n                            <input readonly @bind=\"item.UpdateTime\"\
  \ @bind:format=\"HH:mm:ss\"></input>\n                            <i class=\"p-2\
  \ bi bi-box-arrow-up\" @onclick=\"()=>MoveToCart(item)\"></i>\n                \
  \        </div>\n                    </small>\n                </div>\n        \
  \        <p class=\"mb-1\">@item.Item.Description</p>\n            </div>\n    \
  \    </li>\n    }\n</div>\n```\n\n\n\n\n\n在 `CartPage` 中使用 `WishListComponent`。\n\
  \n@page \"/cart\"\n\n@using EShop.Components;\n\n<PageTitle>在此购物！</PageTitle>\n\n\
  <h2>在此购物！</h2>\n\n<button class=\"btn btn-danger\" @onclick=\"AddToCart\">向购物车添加物品</button>\n\
  \n<CascadingValue Value=\"@_fontSize\" Name=\"FontSize\">\n  <CascadingValue Value=\"\
  @_fontStyle\" Name=\"FontStyle\">\n    <div>\n      <h2>购物车</h2>\n      <CartComponent\
  \ @ref=\"cartComponent\" Cart=\"@_cart\" OnCartItemRemoved=\"OnCartItemRemoved\"\
  \ OnMovingToWishList=\"OnMovingToWishList\" />\n    </div>\n    <div>\n      <h2>愿望清单</h2>\n\
  \      <WishListComponent @ref=\"wishListComponent\" WishList=\"@_wishList\" OnMovingToCart=\"\
  OnMovingToCart\" />\n    </div>\n  </CascadingValue>\n</CascadingValue>\n\n<button\
  \ class=\"btn btn-warning\" @onclick=\"Checkout\">结账</button>\n\n@* some code *@\n\
  \n添加 C# 代码来实现购物车与愿望清单之间的项目切换逻辑：\n\n@* some code *@\n\n```csharp\n@code {\n  private\
  \ const string USER = \"Brian\";\n  private Models.Cart _cart = new Models.Cart(USER);\n\
  \  private Models.WishList _wishList = new Models.WishList(USER);\n  private string\
  \ _fontSize = \"font-size: 30px;\";\n  private string _fontStyle = \"font-style:\
  \ italic;\";\n  private CartComponent? cartComponent;\n  private WishListComponent?\
  \ wishListComponent;\n\n  private void AddToCart()\n  {\n    _cart.Add(new Models.CartItem(new\
  \ Models.ShopItem(\"T-shirt\", \"One of the tops\", 5), 2));\n    _cart.Add(new\
  \ Models.CartItem(new Models.ShopItem(\"Jacket\", \"The most popular\", 17), 1));\n\
  \    _cart.Add(new Models.CartItem(new Models.ShopItem(\"Sun glasses\", \"On sale\"\
  , 8), 3));\n  }\n\n  private void OnCartItemRemoved(Models.CartItem item)\n  {\n\
  \    _cart.Remove(item);\n  }\n\n  private void Checkout()\n  {\n    cartComponent!.Checkout();\n\
  \  }\n\n  private void OnMovingToCart(Models.WishListItem item)\n  {\n    _wishList.Remove(item);\n\
  \    var cartItem = new Models.CartItem(item.Item, item.Count);\n    _cart.Add(cartItem);\n\
  \  }\n\n  private void OnMovingToWishList(Models.CartItem item)\n  {\n    _cart.Remove(item);\n\
  \    var wishListItem = new Models.WishListItem(item.Item, item.Count);\n    _wishList.Add(wishListItem);\n\
  \  }\n}\n```\n\n`CartPage` 已更新，现在级联样式和字体在 `CartComponent` 和 `WishListComponent`\
  \ 之间共享。用户现在可以点击每个购物车项目右上角的“移动到愿望清单”小图标将其移至愿望清单。或者点击右上角的类似按钮将其反向。\n\n目前尚未实现任何性能优化。如果用户反复来移动项目，性能将会受到影响。接下来，为每个购物车或愿望清单项目的\
  \ `div` 元素添加 `@key` 指令属性，让 Blazor 知道这些元素应该被保留，以及购物车项目是如何映射到它们身上的。\n\n@* some code\
  \ *@\n\n```razor\n@foreach (var item in Cart!.Items)\n{\n  <div class=\"list-group-item\"\
  \ @key=\"item.Item.Name\">\n    @* some code *@\n  </div>\n}\n```\n\n可以使用任何对象作为元素或组件的键（key）。它可以是字符串、数字或实例。Blazor\
  \ 将通过其名称保留元素与购物车项目之间的关系。最佳实践是，当用户正在开发列表组件时使用 `@key` 指令属性，并可以使用项目 ID 作为组件的键。为了保持映射，请不要忘记\
  \ `@key` 也标记了当发生实例替换时，该关系应被销毁，且 Blazor 将重新渲染前端页面。\n\n## 模板组件\n\n随着应用程序的增长，将会有许多地方可以通过组件来消除重复的前端代码。在某些情况下，这将是一个很简单的替换。例如，在开发\
  \ `CartComponent` 时，使用 `CartItemCountComponent` 可以节省精力，允许客户更新他们想要购买的商品。直到目前，用户处理的是完全通过显式编写\
  \ HTML 代码开发的组件。在其他场景下，这些组件的消费者可能会提供要在用户组件内部渲染的 HTML。\n\n例如，在 `CartComponent` 中，可以将\
  \ `for each` 循环的内容封装到另一个组件中，此新组件必须具备在列表组容器中渲染子 HTML 的能力。\n\n实现此的一种直接方法是将 HTML 代码作为字符串传递，新组件将具有一个字符串参数并如下显式渲染\
  \ HTML：\n\n在 `Shared` 文件夹下创建 `GroupContainer.razor`：\n\n```razor\n<div class=\"\
  list-group-item\">\n  <div class=\"d-flex w-100 justify-content-between\">\n   \
  \ <p class=\"mb-1\" style=\"@FontSize\">@Name</p>\n    <small>\n      <div>\n  \
  \      @ChildContent\n      </div>\n    </small>\n  </div>\n  <p class=\"mb-1\"\
  >@Description</p>\n</div>\n```\n\n在此处创建 `GroupContainer.razor.cs`：\n\n```csharp\n\
  using Microsoft.AspNetCore.Components;\n\nnamespace EShop.Shared\n{\n  public partial\
  \ class GroupContainer\n  {\n    [Parameter]\n    public string Name { get; set;\
  \ }\n\n    [Parameter]\n    public string Description { get; set; }\n\n    [Parameter]\n\
  \    public string FontSize { get; set; }\n\n    [Parameter]\n    public RenderFragment?\
  \ ChildContent { get; set; }\n  }\n}\n```\n\n现在我们在 `Cart` 组件中使用此 `GroupContainer`：\n\
  \n```razor\n@foreach (var item in Cart!.Items)\n{\n  <GroupContainer Name=\"@item.Item.Name\"\
  \ Description=\"@item.Item.Description\" FontSize=\"@_fontSize\">\n    <CartItemCount\
  \ Count=\"@item.Count\" />\n  </GroupContainer>\n}\n```\n\n\n\n\n在 lambda 表达式中，`OpenElement`\
  \ 在最前面，这与编写 HTML 代码时一样。用户会先输入 `<p>`。接下来，调用 `AddAttribute` 为 `p` 元素添加 `class` 属性，就如同在\
  \ HTML 中输入 `class='mb-1'` 一样。第三行 `AddContent` 为 `p` 元素提供要显示的内容。最后，通过调用 `CloseElement()`\
  \ 结束 lambda 表达式，这与输入结束标签 `</p>` 一致。\n\n这一切都非常直观，但这里遗漏了一个重要的方面——这前三个方法的整数参数。这里的整数在渲染树中起着至关重要的作用当在\
  \ lambda 表达式中重新对这些整数编号时，它仍然可以编译并运行：\n\n```csharp\n// some code\n\nprivate RenderFragment\
  \ _descriptionRF = (b) =>\n{\n    b.OpenElement(-3, \"p\");\n    b.AddAttribute(-2,\
  \ \"class\", \"mb-1\"); \n    b.AddContent(-1, \"this is a description.\"); \n \
  \   b.CloseElement();\n};\n\n// some code\n```\n\n![](img/pg_87.jpg)\n图 4.1 Description\
  \ RenderFragment。\n\n序列可以从任何数字开始，只要它们是递增的。开发者可能会犯的一个常见错误是使用自动递增索引：\n\n```csharp\n\
  int index = 0\nb.OpenElement(index++, \"p\");\nb.AddAttribute(index++, \"class\"\
  , \"mb-1\");\nb.AddContent(index++, \"this is a description.\");\nb.CloseElement();\n\
  ```\n\n由于我们都是开发者，使用一个跟踪序列的整数似乎更合理。Blazor 与其他 UI 框架的区别在于它使用此序列通过线性算法来计算树差异（tree diff），尽管在在这个简单的示例中它可能运行良好。一旦用户遇到更复杂的场景，例如\
  \ `if` 分支或循环自动生成的序列号，可能会影响性能。这里的关键在于 Blazor 采用的算法，它使用相同的序列来比较新旧渲染。这意味着对于每一个相同的序列号，如果对应的数据发生了变化，Blazor\
  \ 就会确信它将重新渲染该数据。在列表循环中，非常常见的是根据业务逻辑在中间删除或添加某些项，导致删除或添加之后的每条数据都会进行重新渲染，即使它们大部分保持不变，因为如果使用自动递增数字，相应的序列就会改变。\n\
  \n这里的另一个提示是，始终记住在调用 `OpenElement` 或 `OpenComponent` 之后立即调用 `AddAttribute`，否则用户将遇到以下运行时异常：\n\
  \n![](img/pg_88.jpg)\n图 4.2 AddAttribute 异常。\n\n目前，这个 `RenderFragment` 是静态的，始终渲染相同的描述，但用户需要为每个项目显示特定的描述。这里可以使用泛型的\
  \ `RenderFragment`：\n\n```csharp\n// some code\n\nprivate RenderFragment<string>\
  \ _descriptionRF = (desc) => (b) =>\n{\n    b.OpenElement(-3, \"p\");\n    b.AddAttribute(-2,\
  \ \"class\", \"mb-1\");\n    b.AddContent(-1, desc);\n    b.CloseElement();\n};\n\
  \n// some code\n```\n\n将 `Description` 作为参数传递给 `RenderFragment`：\n\n```html\n<div\
  \ class=\"list-group-item\">\n    <div class=\"d-flex w-100 justify-content-between\"\
  >\n        <p class=\"mb-1\" style=\"@FontSize\">@Name</p>\n        <small>\n  \
  \          <div>\n                @ChildContent\n            </div>\n        </small>\n\
  \    </div>\n    @_descriptionRF(Description!)\n</div>\n```\n\n泛型 `RenderFragment`\
  \ 也是一个委托，定义为返回一个普通的 `RenderFragment`。它允许开发者渲染更动态的内容。这个泛型参数为 `RenderFragment` 委托提供了一个强类型参数，并可以传递给\
  \ `RenderTreeBuilder`。在普通的 `RenderFragment` lambda 表达式内部，开发者可以使用此参数自定义输出。\n\n`RenderFragment`\
  \ 提供了一种手动生成 HTML 元素的方法，但必须谨慎使用，否则它将轻易抵消其带来的好处。建议除非有非常充分的理由，否则不要使用 `RenderFragment`。\n\
  \n## CSS 隔离\n\nCSS 样式在整个 Web 应用程序中被广泛使用。尽管非常受欢迎，但开发者目前面临着一些共同挑战。当应用程序变得越来越大且复杂时，维护样式依赖将变得困难。在深层嵌套的元素上定位样式相关的\
  \ bug 将很困难。\n\nBlazor CSS 隔离旨在通过定义仅属于单个组件的样式来避免这些问题。实现隔离的 CSS 样式非常简单。用户只需以相应的 Razor\
  \ 文件名名前缀命名 css 文件，并将它们放在相同的路径下。\n\n例如，在 `GroupContainer` 中，有一个 `<h2>` 元素：\n\n```html\n\
  <div class=\"list-group-item\">\n    <div class=\"d-flex w-100 justify-content-between\"\
  >\n        <h2>@Name</h2>\n        <small>\n            <div>\n                @ChildContent\n\
  \            </div>\n        </small>\n    </div>\n    @_descriptionRF(Description!)\n\
  </div>\n```\n\n在 `Shared` 文件夹下创建 `GroupContainer.razor.css`，并为 `<h2>` 元素编写样式：\n\n\
  ```css\nh2 {\n    color: orange;\n}\n```\n\n通过这种方式，所有的 `<h2>` 元素都会应用该样式。在 `GroupContainer`\
  \ 中，所有的 `<h2>` 元素都会变成橙色。在检查 `<h2>` 元素时，可能会发现：\n\n```html\n<div class=\"list-group-item\"\
  >\n    <div class=\"d-flex w-100 justify-content-between\">\n        <h2>@Name</h2>\n\
  \        <small>\n            <div>\n                @ChildContent\n           \
  \ </div>\n        </small>\n    </div>\n    @_descriptionRF(Description!)\n</div>\n\
  ```\n\n在 `Cart.razor` 中添加一个 `<h2>` 元素，由于它被包裹在 `GroupContainer` 内部，这将是子元素。最后，将 CSS\
  \ 选择器从 `h2` 更新为 `::deep`。运行应用程序发现子标题是橙色的，但父标题仍然是黑色的。样式不起作用！\n\n![](img/pg_91.jpg)\n\
  图 4.3 编译后的隔离样式。\n\n这是因为 `::deep` 选择器不会匹配根部的元素。因此，要么将父标题包裹在 `div` 中，要么在 css 文件中添加另一个\
  \ `h2` 选择器：\n\n```css\nh2, ::deep h2 {\n    color: orange;\n}\n```\n\n由于 css 是隔离的，为了让子继承相同的样式，可以使用\
  \ `::deep`。在这里进行一个小实验，添加父标题和子标题：\n\n```razor\n@* some code *@\n<GroupContainer Name=@item.Name\
  \ Description=@item.Description>\n    <h2>子标题</h2>\n    <input readonly @bind=\"\
  item.UpdateTime\" @bind:format=\"HH:mm:ss\"></input>\n    <i class=\"p-2 bi bi-box-arrow-down\"\
  \ @onclick=\"()=>MoveToWishList(item)\"></i>\n    <i class=\"p-2 bi bi-x-octagon-fill\"\
  \ @onclick=\"()=>Remove(item)\"></i>\n</GroupContainer>\n```\n\n在 `CartComponent.razor`\
  \ 中添加 `<h2>`，由于它在 `GroupContainer` 内部，这将是子元素。最后，将 CSS 选择器从 `h2` 更新为 `::deep`。运行应用程序发现子标题是橙色的，但父标题仍然是黑色的。CSS\
  \ 样式不起作用！\n\n现在，所有的标题都将是橙色的了。\n\n## 总结\n\n本章探讨了 Blazor 组件的高级主题。从组件引用开始，展示了如何通过向目标组件添加\
  \ `@ref` 指令属性，像编写普通 C# 代码一样引用其他组件。接下来，章节讨论了保持组件与其模型之间关系的技术。`@key` 指令属性有助于保持映射，并建议在列表或循环中使用。\n\
  \n`第 4 章`讨论了如何使用纯 C# 代码手动生成前端元素。记住，除非必要否则不要使用 `RenderFragment`。最后，章节探讨了 CSS 隔离以避免依赖混乱，并描述了这种隔离是由编译器实现的。\n\
  \n第 5 章\n\nBLAZOR 中的文件上传\n\n\n\n\n\n# 第 4 章 (#chapter04.xhtml)\n\n讨论了关于 Blazor 组件的一些高级主题，包括组件引用、组件保留和组件模板。它还引入了\
  \ CSS 隔离技术以避免重叠问题。本章将演示用户如何在 `Blazor Server` 和 `Blazor WebAssembly` 中通过文件上传和下载来与其他用户进行交互。\n\
  \n## 目录结构\n\n本章将讨论以下主题：\n\n- 互联网上的文件传输\n- `上传文件`\n- 将文件上传到其他服务提供商\n- 安全性考虑和最佳实践\n\
  \n## 目标\n\n本章向读者介绍了通常用于通过互联网在客户端之间传输文件的协议，并探索了 `HTTP` 和 `FTP` 协议之间的差异。接下来，本章将介绍\
  \ `Blazor` 框架中使用的 `InputFile` 组件，允许用户将文件上传到服务器。将通过一个 EShop 功能进行说明，在该功能中，客户将上传购买商品的照片并对商品留下评论。\n\
  \n## 为 EShop 构建评论功能\n\n文件共享可以是用户与 Web 应用程序之间或用户之间进行通信的一种非常用的方式。如果是社交媒体应用，可能希望允许客户上传他们喜爱的照片，以便其他用户可以发表评论或分享该照片。如果是业务智能应用，客户可能希望将数据下载为\
  \ `Excel` 文件或 `PDF` 报告。在之前的章节中，读者构建了一个 EShop 应用程序，如果卖家可以登录并为待售商品发布选定的图片，或者他们可以为主页自定义头部图片，将使他们的产品更具竞争力。\n\
  \n## 文件传输\n\n在互联网上传输文件的两种常用方式是 `HTTP` 和 `FTP`。`HTTP` 代表“超文本传输协议”（HyperText Transfer\
  \ Protocol）。正如名称所示，`HTTP` 处理的是“超文本”（HyperText），这意味着客户端或 Web 浏览器将发送请求从服务器检索“超文本”。超文本是由美国哲学家和社会学家泰德·尼尔森（Ted\
  \ Nelson）于 1956 年引入的。超文本仍然是文本，但包含更多信息的文本，通过相互引用链接到其他 `超文本`。这些文本之间的链接就像互联网世界中巨大图中的边，而文本则是节点。这些节点通过链接多或少地连接在一起。当用户处于某一个节点时，他们几乎可以直接旅行到任何其他节点，或只需几步，这与公交路线不同，公交乘客必须线性地一直旅行到下一站直到到达目的地，即使中间的站点对他们来说完全没有价值。\n\
  \n文件显然是我们互联网世界中`超文本`的一部分。正如在第 2 章中讨论的，`HTTP` 是一种单向通信协议，客户端将发起请求从 `HTTP` 服务器获取所需的文件。根据其本质，通过\
  \ `HTTP` 协议获取文件不需要身份验证，尽管现在开发者正在添加越来越多复杂的登录机制。所有这些身份验证逻辑都不是 `HTTP` 。它们源于业务。\n\n\
  相反，`FTP` 天生就带有身份验证。`FTP` 代表“文件传输协议”（File Transfer Protocol）。正如名称所示，该协议是为了共享文件而生的。用户通常首先提供凭据登录服务器并获得上传或下载文件的权限。与\
  \ `HTTP` 不同，`FTP` 更适合大文件传输，被广泛应用于企业、大学和机构。\n\n如今，`HTTP` 和 `FTP` 均获得了其安全扩展 `HTTPS`\
  \ 和 `FTPS`，支持“传输层安全”（Transport Layer Security）。通过加密算法增强数据传输，`HTTPS` 和 `FTPS` 变得越来越流行，甚至成为互联网世界的新必经要求。例如，Google\
  \ Chrome 从第 90 版本开始默认使用 `HTTPS`。在本章中，重点是 Web 应用程序通过 `HTTPS` 进行文件传输。\n\n## 文件上传\n\
  \n在 `Blazor Server` 和 `Blazor WebAssembly` 中，都使用 `InputFile` 组件来捕获用户上传的文件。默认情况下，该组件将将渲染为一个输入元素。在\
  \ EShop 应用程序中，产品所有者希望添加一个新功能，允许客户上传带有购物商品照片的评论。\n\n首先，使用之前章节中学习的技术使用自定义组件构建一个商品详情页。\n\
  \n首先，在 `Models` 文件夹下创建一个新文件 `Comments.cs`：\n\n```csharp\nnamespace EShop.Models\n\
