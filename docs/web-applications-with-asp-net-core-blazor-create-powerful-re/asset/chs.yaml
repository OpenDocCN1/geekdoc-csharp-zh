  ### HTTPCLIENT\n\n在对 HTTP 协议有了基本理解后，是时候讨论如何在 Blazor 中进行请求了。在 Blazor 应用程序中，默认带有：\n\
  \n```csharp\nusing Microsoft.AspNetCore.Components.Web;\nusing Microsoft.AspNetCore.Components.WebAssembly.Hosting;\n\
  using EShop.WebAssembly;\nusing System;\n\nvar my = new MyClass\n\n\n    Type =\
  \ =\n\n\n\n         = = \"Hello,\n\n\n\n..\n\nstring =..((.););\n\n.\n..String\n\
  \n\n\n);\n\n = = =..Create(args);\n\n.RootRoot.Add<App>(\"#app\");\nbuilder.RootComponents.Add<HeadOutlet>(\"\
  head::after\");\n\nbuilder.Services.AddScoped(sp => new HttpClient { BaseAddress\
  \ = new Uri(builder.HostEnvironment.BaseAddress) });\n\nawait builder.Build().RunAsync();\n\
  ```\n\n`builder.Services.AddScoped` 用于注册作用域的 `HttpClient` 实例。在商店页面中，使用 `HttpClient`\
  \ 实例获取 `app.css` 的内容。为了制作请求，修改 `pages` 文件夹下的 `ShopItem.razor.cs`：\n\n```csharp\n\
  public partial class ShopItem : ComponentBase\n{\n    [Inject]\n    public HttpClient\
  \ HttpClient { get; set; }\n\n    private async void DownloadAsync()\n    {\n  \
  \      if (_module is not null)\n        {\n            var status = await _module.InvokeAsync<DownloadStatus>(\"\
  download\", \"Brian\");\n        }\n\n        var json = await HttpClient.GetStringAsync(\"\
  /foo.json\");\n        var statusAgain = await HttpClient.GetFromJsonAsync<DownloadStatus>(\"\
  foo.json\");\n\n        Console.WriteLine(statusAgain);\n    }\n}\n```\n\n首先，注入在\
  \ `program.cs` 中注册的 `HttpClient` 实例。然后在 `DownloadAsync` 方法中，发送 `GET` 请求获取资源 `foo.json`\
  \ 的内容。该 JSON 文件放置在 `wwwroot` 文件夹，内容如下：\n\n```json\n{\n  \"succeed\": true,\n  \"\
  name\":\"foo\",\n  \"time\":\"2023-02-25\"\n}\n```\n\n泛型扩展方法 `GetFromJsonAsync`\
  \ 有助于发送 HTTP `GET` 请求，并在底层将响应流反序列化为所需的泛型类型，同时会执行了一些验证，例如内容长度检查或可选的超时检查。\n\n### HTTPCLIENTFACTORY\n\
  \n当应用程序连接到多个后端服务时，需要多个具有不同 `BaseAddress` 的 `HttpClient` 实例。获取这些 `HttpClient` 实例的一种简单方法是按名称注册。\n\
  \n在 `Program.cs` 中：\n\n```csharp\nbuilder.Services.AddHttpClient(\"foo\", client\
  \ =>\nclient.BaseAddress = new Uri(\"https://www.foo.com\"));\n```\n\n\n\n\n```csharp\n\
  builder.Services.AddHttpClient(\"bar\", client =>\n\nclient.BaseAddress = new Uri(\"\
  https://www.bar.com\"));\n```\n\n用户可以注册两个名为 `foo` 和 `bar` 的 `HttpClient`。要在应用程序中使用它们，首先需要注入一个\
  \ `IHttpClientFactory` 实例。如果用户在 `*.razor` 页面中注入，应该在开头使用以下模式：\n\n```razor\n@inject\
  \ IHttpClientFactory ClientFactory\n```\n\n如果你在 `*.razor.cs` C# 后置代码中注入，请使用以下代码：\n\
  \n```csharp\n[Inject]\n\npublic IHttpClientFactory ClientFactory { get; set; }\n\
  ```\n\n使用此 `IHttpClientFactory` 实例在需要时获取正确的 `HttpClient`，如下：\n\n```csharp\nvar client\
  \ = ClientFactory.CreateClient(\"foo\");\n```\n\n使用工厂模式的一个用处是，工厂为每个客户端名称缓存相应的 `HttpClientHanlder`\
  \ 实例，而每次调用 `CreateClient` 时都会创建一个新的 `HttpClient` 实例。在大多数情况下，`HttpClientHandler`\
  \ 实例会管理底层的 HTTP 连接池，因此通过在可能时重用它们来节省接字耗尽和连接延迟。`HttpClientHandler` 默认缓存两分钟，要扩展其生命周期，开发者可以在注册\
  \ `HttpClient` 时调用 `SetHandlerLifetime` 方法。请记住，长生存的 `HttpClientHandler` 实例可能无法及时响应\
  \ DNS 更改。然而，`HttpClient` 实例旨在设计为短命的，因为释放 `HttpClient` 实例不会触发底层 `HttpClientHandler`\
  \ 的释放。请注意，当应用程序需要处理 Cookie 时，`IHttpClientFactory` 并不是推荐的解决方案。`IHttpClientFactory`\
  \ 池化 `MessageHandler` 实例，创建新的 `HttpClient` 实例时，很有可能 `MessageHandler` 实例会被重用，从而导致共享的\
  \ `CookieContainer` 实例。如果这不是所需的行为，请避免使用 `IHttpClientFactory`。\n\n## 再次 HttpClient\n\
  \n调用 Web API 的另一种方法是使用类型化 `HttpClient`。类型化 `HttpClient` 是封装了一个或多个已注册的 `HttpClient`\
  \ 实例的类。使用类型化 `HttpClient` 更新上一个 `HttpClient` 节中的示例。\n\n首先，在项目目录下运行以下命令以添加 Nuget\
  \ 包：\n\n```bash\ndotnet add package Microsoft.Extensions.Http—version 7.0.0\n```\n\
  \n接下来，在 `Utils` 文件夹下的 `EShopHttpClient.cs` 文件创建新的 `EShopHttpClient` 类：\n\n```csharp\n\
  using System.Net.Http.Json;\n\nusing EShop.WebAssembly.Pages;\n\nnamespace EShop.WebAssembly.Utils;\n\
  \npublic class EShopHttpClient\n\n{\n\nprivate readonly HttpClient _httpClient;\n\
  \npublic EShopHttpClient(HttpClient httpClient)\n\n{\n\n_httpClient = httpClient;\n\
  \n}\n\npublic async Task<DownloadStatus> GetDownloadStatusAsync()\n{\n\nvar status\
  \ = await _httpClient.\nGetFromJsonAsync<DownloadStatus>(\"foo.json\");\n\nreturn\
  \ status;\n\n}\n\n}\n```\n\n在构造函数中注入 `HttpClient` 实例，并提供一个异步获取 `DownloadStatus`\
  \ 的方法，并在 `Program.cs` 中注册它，替换旧的 `HttpClient` 注册：\n\n```csharp\nbuilder.Services.AddHttpClient<EShopHttpClient>(sp\
  \ => new HttpClient { BaseAddress = new Uri(builder.HostEnvironment.BaseAddress)\
  \ });\n```\n\n最后，在 `ShopItem.razor.cs` 中，注入 `EShopHttpClient` 实例而非 `HttpClient`\
  \ 实例，并在 `DownloadAsync` 方法中使用它获取状态：\n\n```csharp\npublic partial class ShopItem\
  \ : ComponentBase\n\n{\n\n// some code\n\n[Inject]\n\npublic EShopHttpClient HttpClient\
  \ { get; set; }\n\n// some code\n\nprivate async void DownloadAsync()\n\n{\n\nif\
  \ (_module is not null)\n\n{\n\nvar status = await _module.\nInvokeAsync<DownloadStatus>(\"\
  download\", \"Brian\");\n\n}\n\nvar statusAgain = await HttpClient.\nGetDownloadStatusAsync();\n\
  \nConsole.WriteLine(statusAgain.Time);\n\n}\n\n}\n```\n\n## gRPC\n\n远程过程调用（RPC）以及\
  \ Google 提出的名为 `gRPC` 的 RPC 变得流行。`gRPC` 为与其他服务或客户端通信提供了另一种选择。\n\n通常，用户可以在 `Bar`\
  \ 方法中调用 `Foo` 方法，因为这两个方法留在同一个进程的内存中。请注意，使用 `gRPC`，应用程序可以调用另一个应用程序中的方法，就像它们在同一个进程中一样，即使它们在不同的机器上。我们将发送请求的应用程序称为\
  \ `gRPC client`，响应请求的应用程序称为 `gRPC server`。应用程序经常会在 `gRPC clients` 和 `gRPC servers`\
  \ 之间切换角色。与许多其他 RPC 实现一样，开发者首先定义带有方法参数和返回类型的 `gRPC service`。这种接口定义在消息格式中同样有效。因此，在服务器应用程序中，它将实现该接口并处理客户端请求。\n\
  \n读者现在应该知道如何从 .NET 代码调用 JavaScript 函数了，所以是时候看看另一种方法了。从 JavaScript 函数中，用户可以调用静态 .NET\
  \ 方法、实例 .NET 方法或泛型类的方法。本节将将介绍每个示例。就像 HTTP 协议一样，`gRPC` 在许多不同类型的机器或服务器上运行，并且可以使用多种语言实现，例如\
  \ `C#`、Go 或 Python。\n\n`gRPC` 在许多方面都比 HTTP API 更好。首先，它具有更好的性能，因为 `gRPC` 使用二进制 `Protobuf`，可以快速进行序列化或反序列化，不像\
  \ HTTP 请求-响应对中的 JSON 序列化。`gRPC` 为 HTTP/2 设计，与 HTTP 1.x 相比具有更好的性能。此外，由于 HTTP/2，`gRPC`\
  \ 使得长连接、实时的流通信成为可能，无论是单向还是双向的。通过定义的 `.proto` 文件，可以自动生成客户端代码，而 HTTP API 客户端需要第三方工具来生成代码。因此，当构建微服务集群时，推荐使用\
  \ `gRPC`，否则网络限制是客户用例中的常见问题。\n\n\n\n\n\n本章旨在帮助读者理解后端开发中最重要的概念之一：无状态（stateless）。接下来，读者将介绍非无状态服务、有状态服务，以及一个开源项目\
  \ `EntityFramework Core`。该项目被广泛用于 `.NET Core` 项目，用于将数据持久化到选定的数据库中。后续将深入讨论 `EntityFramework\
  \ Core` 中广泛使用的特性，例如 `entity`（实体）、`context`（上下文）、`query`（查询）和 `migration`（迁移），并附带详细的示例和源码分析。\n\
  \n## 无状态与有状态\n\n无状态或有状态的概念对于资深开发者来说似乎很熟悉，但对于初学者来说往往令人困惑。无状态应用程序主要以孤立的方式为客户端提供服务。此类应用程序不会存储每个请求或事务之间的任何关系。所有请求都被视为来自完全不同的客户端的首次请求。一个例子是\
  \ Google 搜索，它不会将你新的搜索与你之前的搜索关联起来。相反，有状态服务会持有之前请求的上下文，未来的请求或事务可能会受到其影响。例如，像 `Azure\
  \ SQL database` 关系型数据库就是一个典型的有状态应用，它持有所有可以被上一个请求修改的数据。下一个传来的请求通常会读取这些被修改的数据。通常，对有状态服务的请求会在同一服务器上为同一客户端处理，而无状态服务可能每次在不同的服务器上处理来自同一客户端的请求。通过简单部署另一个应用程序实例，可以很容易水平扩展无状态服务。但对于有状态的服务，由于它持有上下文，这并不容易实现。不过请记住，关系型数据库始终是任何面向客户端应用程序的关键数据存储或来源。后续章节将讨论\
  \ `Blazor Server` 如何在目标关系型数据库中持久化数据。\n\n## ENTITYFRAMEWORK CORE\n\n对象关系映射 (ORM)\
  \ 是一种用于在面向对象的程序和数据库之间创建桥梁（即映射）的技巧。在大多数情况下，这种映射工具用于连接关系型数据库，例如 `SQL Server`。通常，人们会使用\
  \ `SQL` 来查询关系型数据库：\n\n```\nSELECT Id, Name, Latitude, Longitude FROM Cities WHERE\
  \ Id = 23\n```\n\n上面的 `SQL` 是从数据库的 `Cities` 表中获取 `Id` 为 23 的特定城市数据的示例。它将返回该城市的 `Id`、`Name`、`Latitude`\
  \ 和 `Longitude`。用面向对象编程语言编写的项目通常会定义如下方法：\n\n```\nvar city = cities.GetById(23);\n\
  ```\n\nORM 工具可以帮助开发者使用类似上述的方法查询数据库，而无需特别关注运行在数据库上的 `SQL`。ORM 工具加速了后端开发者的开发速度，与在代码中直接编写\
  \ `SQL` 相比，它编写的代码更少，但除了理解关系型数据库外，学习 ORM 工具通常需要花费更多精力。对于复杂查询，通常 ORM 工具的性能不如使用 `SQL`。许多面向对象的语言都有\
  \ ORM 工具，而与 `C#` 配合使用的流行的是 `EntityFramework Core`，它被用于大多数 `.NET Core` 项目以连接到数据库，并支持\
  \ `LINQ` 查询、架构迁移和更改跟踪。`EntityFramework Core 1.0` 最初于 2016 年夏天首次发布。最新的非预览版本是 `EF\
  \ Core 7.0`，于 2022 年底发布。作为一种现代的对象-数据库映射器，`EntityFramework Core` 可以与许多不同的数据库配合，如\
  \ `SQL Server`、`Azure SQL Database` 或 `MySQL`。有很多数据库，而且 `EF Core` 非常广泛，因此人们甚至可以编写自定义提供程序。\n\
  \n## CONTEXT OBJECT\n\n在 `EntityFramework Core` 中，`DbContext` 实例代表与目标数据库的连接会话，开发者可以使用此实例从数据库读取或写入数据。`DbContext`\
  \ 类使用存储库（repository）模式和工作单元（unit of work）模式实现。存储库模式的设计用于将数据持久化到数据库。它消除了数据访问层与业务层之间的耦合。基于此，查看此\
  \ `DbContext` 类源码中实现的一些基本方法：\n\n```csharp\npublic class DbContext\n{\n    public\
  \ virtual EntityEntry<TEntity> Add<TEntity>(TEntity entity)\n    where TEntity :\
  \ class\n    {\n        CheckDisposed();\n        return SetEntityState(Check.NotNull(entity,\
  \ nameof(entity)),\n        EntityState.Added);\n    }\n\n    public virtual EntityEntry<TEntity>\
  \ Update<TEntity>(TEntity entity)\n    where TEntity : class\n    {\n        CheckDisposed();\n\
  \        return SetEntityState(Check.NotNull(entity, nameof(entity)), EntityState.Modified);\n\
  \    }\n\n    public virtual EntityEntry<TEntity> Remove<TEntity>(TEntity entity)\
  \ where TEntity : class\n    {\n        Check.NotNull(entity, nameof(entity));\n\
  \        CheckDisposed();\n        var entry = EntryWithoutDetectChanges(entity);\n\
  \        var initialState = entry.State;\n        if (initialState == EntityState.Detached)\n\
  \        {\n            SetEntityState(entry.GetInfrastructure(), EntityState.\n\
  \            Unchanged);\n        }\n        entry.State =\n        initialState\
  \ == EntityState.Added\n        ? EntityState.Detached\n        : EntityState.Deleted;\n\
  \        return entry;\n    }\n\n    public virtual TEntity?\n    Find<[DynamicallyAccessedMembers(IEntityType.\n\
  DynamicallyAccessedMemberTypes)] TEntity>(\n    params object?[]? keyValues)\n \
  \   where TEntity : class\n    {\n        CheckDisposed();\n        return Set<TEntity>().Find(keyValues);\n\
  \    }\n}\n```\n\n`DbContext` 类中的其他实现均已移除，仅关注 CRUD 方法，即 `Add`、`Remove`、`Update`\
  \ 和 `Find`。这些方法构成了一个典型的存储库类。在这样的类中，业务层不需要了解数据访问层所使用的持久化技术。通过 `DbContext` 实例，开发者也可以以面向对象的方式操作数据。事实上，即使数据来自远程\
  \ API 服务器或本地缓存而非直接数据库，可以使用存储库模式。在这种情况下，`DbContext` 类作为业务模型与数据层之间的映射层。事实上，存储库模式通常在领域驱动设计（DDD）模式中被实现为数据访问解决方案。然而，工作单元是类中实现的另一个模式。工作单元代表单个事务中的所有数据操作，应用程序将所有这些操作一次发送到数据库。这比应用程序一个一个发送所有操作要高效得多。在\
  \ `DbContext` 类中，这种模式通过 `SaveChanges` 方法实现。当用户调用 `Add`、`Remove` 或 `Update` 方法时，并没有命令发送到数据库。它只是在本地缓存实体的状态，这意味着如果应用程序在调用\
  \ `SaveChanges` 方法之前崩溃，没有任何数据修改会被持久化到目标数据库：\n\n```csharp\npublic class DbContext\n\
  {\n    public virtual int SaveChanges()\n    => SaveChanges(acceptAllChangesOnSuccess:\
  \ true);\n}\n```\n\n\n\n\n\n带有 `bool` 参数的 `SaveChanges` 方法会调用 `StateManager` 将所有保存的缓存\
  \ `flush`（刷新）到目标数据库，此时将执行数据库交互。在内部，`StateManager` 实例会首先调用方法 `GetEntriesToSave` 来获取条目，然后检查是否有需要保存的条目。如果没有条目，该方法可以立即返回。接下来，`StateManager`\
  \ 实例会调用另一个带有条目列表作为参数的 `SaveChanges` 方法。在这个 `SaveChanges` 方法中，会调用 `IDatabase` 接口上的最后一个\
  \ `SaveChanges` 方法。每个数据库提供程序都将用一个具体类来实现 `IDatabase`。以 `InMemoryDatabase` 和 `RelationalDatabase`\
  \ 为例：\n\n```csharp\npublic class InMemoryDatabase : Database, IInMemoryDatabase\n\
  {\n    private readonly IInMemoryStore _store;\n\n    public override int SaveChanges(IList<IUpdateEntry>\
  \ entries)\n    => _store.ExecuteTransaction(entries, _updateLogger);\n}\n\npublic\
  \ class RelationalDatabase : Database\n{\n    private IUpdateAdapter? _updateAdapter;\n\
  \n    private IUpdateAdapter UpdateAdapter\n    => _updateAdapter ??= Dependencies.UpdateAdapterFactory.Create();\n\
  \n    protected virtual RelationalDatabaseDependencies -RelationalDependencies {\
  \ get; }\n\n    public override int SaveChanges(IList<IUpdateEntry> entries)\n \
  \   => RelationalDependencies.BatchExecutor.Execute(\n        RelationalDependencies.BatchPreparer.BatchCommands(entries,\
  \ UpdateAdapter),\n        RelationalDependencies.Connection);\n}\n```\n\n`InMemoryDatabase`\
  \ 通过执行事务来保存更新的条目，而 `RelationalDatabase` 通过执行批处理命令来实现该方法。例如，如果开发者想要调用远程 API 获取某些数据，他们甚至创建一个实现\
  \ `IDatabase` 接口的具体类 `YourRemoteAPI`，并通过内部服务提供程序将其注入供 `DbContext` 实例使用。\n\n请记住 `DbContext`\
  \ 不是线程安全的，这意味着不能并发共享同一个实例。`DbContext` 设计用于短生命周期使用，因此用户应该记住合理地销毁实例以释放非托管资源。\n\n##\
  \ 数据实体 (Data Entities)\n\n使用 `Azure SQL Database` 作为 `EShop.Server` 项目的目标数据库。首先，在\
  \ Azure Portal 中创建一个 SQL 数据库资源。Azure 为尚未账户的用户提供为期 12 个月的免费试用。关于如何在 Azure 中创建资源有许多教程，这本书将不会涵盖这些内容。`Azure\
  \ SQL Database` 准备好后，请注意稍后使用的连接字符串，如图 11.1 所示。\n\n![](img/pg_236.jpg)\n\n图 11.1\
  \ Azure SQL Database 的连接字符串。\n\n在 Entity Framework Core 中，连接数据库时通常有两种模式：代码优先 (code-first)\
  \ 和数据库优先 (db-first)。当开发者在 C# 代码中设计表时，Entity Framework Core 可以创建表。这被称为代码优先。如果数据库已经有了表，Entity\
  \ Framework Core 可以为用户生成 C# 代码。从引入代码优先开始，然后用新表修改数据库，并再次使用数据库优先模式连接到它。\n\n要开始设计数据库表，请向项目安装\
  \ NuGet 包。进入 `EShop.Server` 项目的根路径，并运行以下命令：\n\n```bash\ndotnet add package Microsoft.EntityFrameworkCore.SqlServer\
  \ --version 7.0.4\ndotnet add package Microsoft.EntityFrameworkCore.Design --version\
  \ 7.0.4\n```\n\n在编写本书时，`7.0.4` 是最新的稳定版本。此包依赖于 `Microsoft.EntityFrameworkCore.Relational`，然后依赖于包\
  \ `Microsoft.EntityFrameworkCore`。如上一节所述，`Microsoft.EntityFrameworkCore.SqlServer`\
  \ 包负责 SQL Server 数据库提供程序。如果用户使用本地 SQLite 数据库，可以选择安装包 `Microsoft.EntityFrameworkCore.Sqlite`。本章将使用\
  \ `Azure SQL Database`。\n\n接下来，在 `Data` 文件夹下，创建一个 `BaseEntity.cs` 文件，以为所有模型提供一个基类：\n\
  \n```csharp\nnamespace EShop.Server.Data;\n\npublic abstract class BaseEntity\n\
  {\n    public int Id { get; set; }\n}\n```\n\n在这个抽象类中，定义一个 `TableName` 属性和一个 `Id`\
  \ 属性，因为所有表示数据库中表的模型都需要这些属性。\n\n接下来，在 `Data` 文件夹下创建一个 `ShopItem.cs` 文件，其属性与 `EShop.WebAssembly`\
  \ 项目中相同模型的属性相似，但目前不会包含注释列表：\n\n```csharp\nnamespace EShop.Server.Data;\n\npublic\
  \ partial class ShopItem : BaseEntity\n{\n    public string Name { get; set; }\n\
  \    public string Description { get; set; }\n    public string ImageUrl { get;\
  \ set; }\n    public double Price { get; set; }\n}\n```\n\n`ShopItem` 实体继承自抽象类 `BaseEntity`，并将映射的表命名为\
  \ `ShopItem`。该类中有四个属性：`Name`、`Description`、`ImageUrl` 和 `Price`，代表 `ShopItem` 表中的四列。\n\
  \n实体定义完成后，是时候解释如何将实体模型映射到目标数据库中的表了。一种是使用特性 (attributes)，另一种是使用流式 API (fluent API)。有些人推荐后一种方法，因为它更好地解耦了业务模型\
  \ `ShopItem` 类。在这种情况下，对于数据库映射，使用实现流式 API 的类。\n\n从开始映射，创建一个名为 `EntityTypeConfigurations`\
  \ 的新文件夹，在其中放置所有的映射配置并创建一个基类文件：\n\n```csharp\nusing EShop.Server.Data;\n\nusing Microsoft.EntityFrameworkCore;\n\
  using Microsoft.EntityFrameworkCore.Metadata.Builders;\n\nnamespace EShop.Server.EntityTypeConfigurations;\n\
  \npublic abstract class BaseEntityTypeConfiguration<TEntity>\n:EntityTypeConfiguration<TEntity>\
  \ where TEntity : BaseEntity\n{\n    protected abstract string TableName { get;\
  \ }\n    protected abstract void ConfigureInternal(EntityTypeBuilder<TEntity> builder);\n\
  \n    public void Configure(EntityTypeBuilder<TEntity> builder)\n    {\n       \
  \ builder.ToTable(TableName);\n        builder.HasKey(e => e.Id);\n        ConfigureInternal(builder);\n\
  \    }\n}\n```\n\n该抽象类接受一个必须是 `BaseEntity` 子类的泛型参数，并定义了两个抽象成员。第一个 `TableName` 用于标识目标数据库中的表。第二个\
  \ `ConfigureInternal` 方法允许子类自定义实体与表之间的映射。\n\n有了抽象配置类，创建一个具体类将 `ShopItem` 模型映射到 `ShopItem`\
  \ 表：\n\n```csharp\nusing EShop.Server.Data;\n\nusing Microsoft.EntityFrameworkCore;\n\
  using Microsoft.EntityFrameworkCore.Metadata.Builders;\n\nnamespace EShop.Server.EntityTypeConfigurations;\n\
  \npublic class ShopItemEntityTypeConfiguration : BaseEntityTypeConfiguration<ShopItem>\n\
  {\n    protected override string TableName => \"ShopItem\";\n\n    protected override\
  \ void ConfigureInternal(EntityTypeBuilder<ShopItem> builder)\n    {\n        builder.Property(e\
  \ => e.Name).IsRequired()\n            .HasMaxLength(10);\n        builder.Property(e\
  \ => e.Description);\n        builder.Property(e => e.ImageUrl).IsRequired()\n \
  \           .HasColumnName(\"Image\");\n        builder.Property(e => e.Price).HasDefaultValue(9.9);\n\
  \    }\n}\n```\n\nLambda 表达式链式调用定义了业务模型与目标数据库之间的桥梁。例如，使用 `Name` 属性作为示例。Lambda 表达式首先识别模型的属性，然后\
  \ `IsRequired` 方法声明该列不能为空，`HasMaxLength` 声明该列长度为 10。这里有大量的流式 API 可自定义特定列的约束。使用 `HasColumnName`\
  \ 方法为列指定一个不同于属性名的名称，并使用 `HasDefaultValue` 为列指定 9.9 的默认价格。\n\n## 数据库迁移 (Database\
  \ Migration)\n\n最后一个设计步骤是创建一个具体的 `DbContext` 类，它表示数据库并应用所有之前的配置：\n\n```csharp\n\
  using EShop.Server.Data;\n\nusing EShop.Server.EntityTypeConfigurations;\nusing\
  \ Microsoft.EntityFrameworkCore;\n```\n\n\n\n\n\n```c\nnamespace EShop.Server;\n\
  \npublic partial class EShopContext : DbContext\n{\n    public EShopContext(DbContextOptions<EShopContext>\
  \ options) : base(options) { }\n\n    protected override void OnModelCreating(ModelBuilder\
  \ modelBuilder)\n    {\n        modelBuilder.ApplyConfiguration(new ShopItemEntityTypeConfiguration());\n\
  \        base.OnModelCreating(modelBuilder);\n    }\n}\n```\n\n在项目根路径下创建一个名为 `EShopContext.cs`\
  \ 的文件，并重写 `OnModelCreating` 方法以应用自定义的业务模型映射。将 `DbContext` 类和模型类标记为 `partial` 是很好的做法。这样开发者就可以只关注必要的部分，并将属性定义与方法实现解耦。\n\
  \n接下来是在 Azure SQL Database 中创建 `ShopItem` 表的最后一步。在调用 `builder.Build()` 之前，向 `Program.cs`\
  \ 添加以下代码：\n\n```csharp\nbuilder.Services.AddDbContextFactory<EShopContext>(options\
  \ => options.UseSqlServer(builder.Configuration.GetConnectionString(\"Database\"\
  )));\n```\n\n用户通常会调用 `AddDbContext` 扩展方法，但对于 Blazor Server 应用程序，建议调用 `AddDbContextFactory`\
  \ 方法，否则开发者将不得不管理 `DbContext` 实例的范围、创建和生命周期。\n\n在 `appsettings.json` 中添加一个键为 `Database`\
  \ 的 `ConnectionStrings` 节点，并将连接字符串的值粘贴在此处：\n\n```json\n\"ConnectionStrings\": {\n\
  \  \"Database\": \"<database connection string>\"\n}\n```\n\n最后，使用 `dotnet` 命令行工具在\
  \ Azure SQL Database 中创建相应的表。使用以下命令安装工具：\n\n```bash\ndotnet tool install --global\
  \ dotnet-ef --version 7.0.4\n```\n\n或者如果你已经安装了特定版本，可以更新到该版本：\n\n```bash\ndotnet\
  \ tool update --global dotnet-ef --version 7.0.4\n```\n\n使用以下命令验证安装是否成功完成：\n\n```bash\n\
  dotnet ef\n```\n\n它应该显示与图 11.2 类似的结果。\n\n![](img/pg_242.jpg)\n\n图 11.2 `dotnet ef`\
  \ 工具\n\n如果发生任何问题，建议确保已将 `dotnet` 工具路径添加到 `PATH` 环境变量中：\n\n```bash\nexport PATH=\"\
  $PATH:/home/brian/.dotnet/tools\"\n```\n\n仅需几行命令，就会在 Azure SQL Database 中创建一个新表：\n\
  \n```bash\ndotnet ef migrations add create-shopitem-table\n```\n\n参考图 11.3。\n\n\
  ![](img/pg_242-1.jpg)\n\n图 11.3 创建迁移。\n\n对于每个创建的迁移，会有三个文件。在这种情况下，它们是 `EShop.Server/Migrations/<datetime>_create-shopitem-table.Designer.cs`、`EShop.Server/Migrations/<datetime>_create-shopitem-table.cs`\
  \ 以及 `EShop.Server/Migrations/EShopContextModelSnapshot.cs`。这些迁移文件有助于跟踪当前模型，并在随着功能演进修改模型时生成新的迁移文件。这些迁移文件可以由选定的源码控制系统（例如\
  \ Git）进行跟踪：\n\n```bash\ndotnet ef database update\n```\n\n参考图 11.4。\n\n![](img/pg_243.jpg)\n\
  \n图 11.4 将迁移应用到数据库。\n\n一旦创建了所有迁移，此命令将向数据库执行 SQL 命令以反映最新的模型更改。EntityFramework Core\
  \ 会首先检查 `__EFMigrationsHistory` 是否存在，如果需要，则创建一个。该表跟踪所有应用到目标数据库的迁移，只有尚未应用的迁移才会被执行。EntityFramework\
  \ Core `dotnet` 工具为用户提供了通过 `dotnet ef database update <migration>` 回滚到特定迁移的选项。如果操作失败，仍然可以通过删除\
  \ `__EFMigrationHistory` 表中的相应记录并运行其他必要的 SQL 命令将数据库更新到之前的状态来手动回滚迁移。这种做法是不推荐的，最好的做法是在整个开发生命周期中使用\
  \ `dotnet` 工具，如图 11.5 所示。\n\n![](img/pg_244.jpg)\n\n图 11.5 Azure SQL Database 中的新表。\n\
  \n使用你喜爱的 SQL Server 客户端连接到 Azure SQL Database，并发现 `ShopItem` 表已按照 C# 代码中的设计被创建。`__EFMigrationHistory`\
  \ 表中有一个记录代表第一次迁移。\n\n### 数据更新\n\n数据库和表准备好后，用户可以向表中添加新的可售商店商品。\n\n首先，创建一个新的 Blazor\
  \ 页面，以便 EShop 员工可以添加商品。此页面应仅供授权的员工使用（身份验证和授权将在下一章讨论）。目前，任何互联网上的访问者都可以打开此页面。在 `pages`\
  \ 文件夹中，创建一个新的 `AddShopItem.razor` 文件：\n\n```razor\n@page \"/add-shop-item\"\n\n\
  <div class=\"ItemContainer\">\n    <h1>添加商店商品</h1>\n</div>\n\n<div>\n    <EditForm\
  \ Model=\"@_shopItem\" OnValidSubmit=\"@HandleValidSubmit\">\n        <div class=\"\
  container\">\n            <div class=\"row\">\n                <div class=\"col\"\
  >\n                    <label>名称</label>\n                    <InputText @bind-Value=\"\
  _shopItem.Name\" />\n                </div>\n                <div class=\"col\"\
  >\n                    <label>描述</label>\n                    <InputTextArea @bind-Value=\"\
  _shopItem.Description\" />\n                </div>\n                <div class=\"\
  col\">\n                    <label>价格</label>\n                    <InputNumber\
  \ @bind-Value=\"_shopItem.Price\" />\n                </div>\n                <div\
  \ class=\"col\">\n                    <label>图片 URL</label>\n                  \
  \  <InputText @bind-Value=\"_shopItem.ImageUrl\" />\n                </div>\n  \
  \          </div>\n            <button type=\"submit\" class=\"btn btn-primary\"\
  >提交</button>\n        </div>\n    </EditForm>\n</div>\n```\n\n这是一个简单的 Blazor 表单，使用了第\
  \ 7 章 中的 `EditForm` 组件。对应的 CSS 文件 `AddShopItem.razor.css` 定义了样式：\n\n```css\n.row\
  \ {\n    margin-top: 20px;\n}\n\n.btn-primary {\n    margin-top: 20px;\n}\n```\n\
  \n`AddShopItem.razor.cs` 中的 C# 代码将借助 `DbContext` 实例与数据库进行通信：\n\n```csharp\nusing\
  \ Microsoft.AspNetCore.Components;\nusing Microsoft.EntityFrameworkCore;\n\nnamespace\
  \ EShop.Server.Pages;\n\npublic partial class AddShopItem : ComponentBase\n{\n \
  \   private EShop.Server.Data.ShopItem _shopItem = new EShop.Server.Data.ShopItem();\n\
  \n    [Inject]\n    public IDbContextFactory<EShopContext> DbFactory { get; set;\
  \ }\n\n    private void HandleValidSubmit()\n    {\n        try\n        {\n   \
  \         using var context = DbFactory.CreateDbContext();\n            context.ShopItems.Add(_shopItem);\n\
  \            context.SaveChanges();\n            _shopItem = new EShop.Server.Data.ShopItem();\n\
  \        }\n        catch (Exception ex)\n        {\n            Console.WriteLine(ex.Message);\n\
  \        }\n    }\n}\n```\n\n`DbFactory` 实例被注入，当用户点击提交按钮时，`DbFactory` 会创建一个 `DbContext`。接下来，`_shopItem`\
  \ 被添加到 `DbContext` 实例的 `DbSet` 属性中。最后一步调用 `SaveChanges` 方法将数据持久化到目标数据库。最后，当代码离开\
  \ `using` 范围时，上下文实例被释放。\n\n运行应用程序并为新的 T 恤输入值，如图 11.6 所示。\n\n![](img/pg_242.jpg)\n\
  \n图 11.6 添加商店商品。\n\n点击提交按钮，在 VS Code 日志窗口中，EntityFramework Core 将打印将在数据库中执行的 SQL\
  \ 命令。注意 EntityFramework 自动使用参数变量来防止 SQL 注入攻击。参考图 11.7。\n\n![](img/pg_242-1.jpg)\n\
  \n图 11.7 EntityFramework SQL 命令。\n\n使用首选的 SQL Server 客户端连接数据库，并运行 SQL 列出 `ShopItem`\
  \ 表中的所有数据。新的 T 恤显示在结果中，如图 11.8 所示。\n\n![](img/pg_249.jpg)\n\n图 11.8 检查 Azure SQL\
  \ Database。\n\n\n\n\n\n在此示例中，每当客户点击提交（Submit）按钮时，都会创建一个 `DbContext` 实例。另一种做法是在组件在重写方法\
  \ `OnInitializedAsync` 中初始化时，通过 `DbFactory` 创建 `DbContext` 实例。接下来，在 `IDisposable`\
  \ 接口的 `Dispose` 方法中手动释放 `DbContext` 实例。这样，`DbContext` 实例的生命周期就与组件的生命周期一致。\n\n##\
  \ 数据查询\n\n在之前的章节中介绍了代码优先（code-first）模式。现在，先使用 SQL 命令创建另一个表：\n\n```sql\nIF OBJECT_ID('[dbo].[ShopItemComment]',\
  \ 'U') IS NOT NULL\n\nDROP TABLE [dbo].[ShopItemComment]\n\nGO\n\nCREATE TABLE [dbo].[ShopItemComment]\n\
  (\n[Id] INT NOT NULL PRIMARY KEY IDENTITY(1,1),\n[ShopItemId] INT NOT NULL,\n[Content]\
  \ NVARCHAR(100) NOT NULL\n);\n\nALTER TABLE [dbo].[ShopItemComment] ADD CONSTRAINT\n\
  FK_Comments_ShopItems FOREIGN KEY (ShopItemId) REFERENCES dbo.ShopItem (Id)\nON\
  \ UPDATE NO ACTION\nON DELETE CASCADE\nGO\n```\n\n该 SQL 命令创建了一个 `ShopItemComment`\
  \ 表，其中 `ShopItemId` 列引用 `ShopItem` 表中的记录。这将建立一对多的关系，其中一个 `ShopItem` 记录可能关联多个 `ShopItemComment`\
  \ 记录。使用以下 SQL 命令为 T 恤 `ShopItem` 插入两条注释：\n\n```sql\nINSERT INTO [dbo].[ShopItemComment]\n\
  (\n[ShopItemId], [Content]\n)\nVALUES (\n(1, 'I like the T-Shirt!'),\n(1, 'It fits\
  \ me just well.')\n)\nGO\n```\n\n远程 Azure SQL 数据库已经过修改，但 C# 代码中的本地模型尚未跟上最新的更改。有两种方法可以修复这个问题。一种方法是使用之前引入的数据库优先（db-first）模式。通过运行以下命令，Entity\
  \ Framework Core 将为开发者重新生成 `EShopContext` 和 C# 模型实体。\n\n```bash\ndotnet ef dbcontext\
  \ scaffold \"<Connection String>\" Microsoft.EntityFrameworkCore.SqlServer -t dbo.ShopItemComment\
  \ -t dbo.ShopItem -c EShopContext --context-dir . -o ./Data -f --no-onconfiguring\n\
  ```\n\n这是代码优先模式的反向操作。用户从远程 SQL Server 生成 C# 代码。除非数据库在之前就已经创建好，否则尽可能建议选择代码优先模型，因为所有的数据库更新都可以在所选的代码库（例如\
  \ Git）中进行跟踪。\n\n另一个选项是手动编写 `dotnet ef dbcontext scaffold` 命令生成的代码。首先，在与 `ShopItem.cs`\
  \ 相同的路径下创建一个 `ShopItemComment.cs` 文件：\n\n```csharp\nnamespace EShop.Server.Data;\n\
  \npublic partial class ShopItemComment : BaseEntity\n{\n    public int ShopItemId\
  \ { get; set; }\n    public string Content { get; set; } \n    public ShopItem ShopItem\
  \ { get; set; }\n}\n```\n\n为了建立关系，添加一个引用相关 `ShopItem` 实例的 `ShopItem` 属性，这被称为导航属性（navigation\
  \ property）。同样，在 `ShopItem` 类中添加相应的导航属性：\n\n```csharp\nnamespace EShop.Server.Data;\n\
  \npublic partial class ShopItem : BaseEntity\n{\n    public string Name { get; set;\
  \ }\n    public string Description { get; set; }\n    public string ImageUrl { get;\
  \ set; }\n    public double Price { get; set; }\n    public List<ShopItemComment>\
  \ ShopItemComments { get; }\n}\n```\n\n接下来，在 `ShopItemCommentEntityTypeConfiguration.cs`\
  \ 中为 `ShopItemComment` 模型定义 `EntityTypeConfiguration`：\n\n```csharp\nusing EShop.Server.Data;\n\
  using Microsoft.EntityFrameworkCore.Metadata.Builders;\nnamespace EShop.Server.Data;\n\
  \npublic partial class ShopItemComment : BaseEntity\n{\n    protected override override\
  \ TableName => \"ShopItemComment\";    protectedprotected void void void void void(EntityTypeBuilder<ShopItemComment>\
  \ builder)\n    {\n        builder.Property(e => e.Content).IsRequired();\n    \
  \    builder.HasOne(e => e.ShopItem)\n        .WithMany(d => d.ShopItemComments)\n\
  \        .HasForeignKey(e => e.ShopItemId);\n    }\n```\n\n`HasOne()` 方法在 `EntityTypeBuilder`\
  \ 上调用，声明每个 `ShopItemComment` 实例关联一个 `ShopItem` 实例。`WithMany()` 表示 `ShopItem` 实例有许多\
  \ `ShopItemComment` 实例，外键为 `ShopItemId`。同样在 `EShopContext` 中更新：\n\n```csharp\npublic\
  \ partial class EShopContext : DbContext\n{\n    public EShopContext(DbContextOptions<EShopContext>\
  \ options) : base(options) { }\n    public DbSet<ShopItem> ShopItems { get; set;\
  \ }\n    public DbSet<ShopItemComment> ItemComments { get; set; }\n\n    protected\
  \ override void OnModelCreating(ModelBuilder modelBuilder)\n    {\n        modelBuilder.ApplyConfiguration(new\
  \ ShopItemEntityTypeConfiguration());\n        modelBuilder.ApplyConfiguration(new\
  \ ItemCommentEntityTypeConfiguration());\n        base.OnModelCreating(modelBuilder);\n\
  \    }\n}\n```\n\n接下来，构建一个页面来显示 Azure SQL 数据库中的 `ShopItem` 实体。在 `Pages` 文件夹下创建一个\
  \ `ShopItem.razor` 以及对应的后台代码文件 `ShopItem.razor.cs`：\n\n```razor\n@page \"/shop-item/{id:int}\"\
  \n\n<table class=\"table\">\n    <thead>\n        <tr>\n            <th scope=\"\
  col\">Id</th>\n            <th scope=\"col\">Comment</th>\n        </tr>\n    </thead>\n\
  \    <tbody>\n        @foreach (var comment in _model.ItemComments)\n        {\n\
  \            <tr>\n                <th scope=\"row\">@comment.Id</th>\n        \
  \        <td>@comment.Content</td>\n            </tr>\n        }\n    </tbody>\n\
  </table>\n```\n\n添加第 8 章引入的 `int` 类型参数并显示 `ShopItem` 的 `Name` 和 `Description`。在后台代码中查询数据：\n\
  \n```csharp\nusing Microsoft.AspNetCore.Components;\nusing Microsoft.EntityFrameworkCore;\n\
  namespace EShop.Server.Pages;\n\npublic partial class ShopItem : ComponentBase\n\
  {\n    [Parameter]\n    public int Id { get; set; }\n    private EShop.Server.Data.ShopItem\
  \ _model;\n\n    [Inject]\n    public IDbContextFactory<EShopContext> DbFactory\
  \ { get; set; }\n\n    protected override Task OnInitializedAsync()\n    {\n   \
  \     try\n        {\n            using var context = DbFactory.CreateDbContext();\n\
  \            _model = context.ShopItems.Where(m => m.Id == Id).Include(s => s.ItemComments).First();\n\
  \        }\n        catch (System.Exception ex)\n        {\n            Console.WriteLine(ex.Message);\n\
  \        }\n        return base.OnInitializedAsync();\n    }\n}\n```\n\n这一次，在组件初始化时创建\
  \ `DbContext` 实例，并在检索数据后立即释放它。运行应用程序并访问 URL `/shop-item/1`，将显示类似于图 11.9 的 Web 页面。\n\
  \n（图片占位符省略）\n\n## 总结\n\n本章首先讨论了无状态服务和状态服务之间的区别，读者了解到大多数关系数据库（如 Azure SQL Database）都是状态服务。接下来，章节介绍了\
  \ `EntityFrameworkCore` 库，它在用户使用 C# 编程时被广泛用作业务逻辑与数据模型之间的桥梁。本章详细解释了 `Context` 实例如何与存储库和工作单元模式配合工作以持久化业务模型数据。它还演示了如何通过代码优先（使用迁移）或数据库优先（使用手动生成的实体模型代码）连接到目标数据库。\n\
  \n\n\n\n\n# 第 11 章 介绍了如何在目标数据库 `Azure SQL Database` 中持久化数据，讨论了 `DbContext` 类的设计模式，并解释了在代码优先或数据库优先模式下使用\
  \ `Entity Framework Core` 处理数据的过程，最后将 EShop 项目管理页面面向公众。本章将介绍如何通过用户身份验证和安全策略来保护 Web\
  \ 内容。\n\n## 结构\n\n本章讨论了以下主题：\n\n- `身份验证 (authentication)`\n- `AuthenticationStateProvider`\
  \ \n- `授权 (authorization)`\n- `基于角色的授权 (role-based authorization)`\n- `基于策略的授权 (policy-based\
  \ authorization)`\n- `ASP.NET Core Identity`\n\n## 目标\n\n本章将帮助读者理解如何对客户进行身份验证以显示不同的\
  \ UI 组件或执行组件访问规则，并结合源码分析 `AuthenticationStateProvider` 服务。接下来，将介绍使用 `Microsoft 账户`或\
  \ `Azure Active Directory` 验证客户的选项。读者将理解如何通过授权控制授予客户的权限，包括基于角色的授权和基于策略的授权。\n\n##\
  \ 身份验证 (AUTHENTICATION)\n\n身份验证是关于识别用户。用户可以是真实的人、物理设备或机器人软件。身份验证是验证身份的过程。\n\n在应用程序中，通过确保凭据信息和用户特征匹配来验证用户。双方都可能发生欺诈，通过操纵系统存储的凭据，或者在身份验证期间提供虚假特征。身份验证通常是应用程序的第一道防线，尽管数据泄露每天发生。这使得身份验证成为必不可少的防御策略。验证人员、设备或机器人的方法有许多不同的，且它们都有自己的优缺点。最常见的身份验证方式是通过用户名和密码。这种方法被几乎每个\
  \ Web 应用程序采用。其理念是在新用户注册时，将用户名和密码（通常经过加密）保存在数据库中。稍后，当用户返回时，将输入其用户名和密码并发送到服务器，将其与数据库中的记录进行比较。如果匹配，服务就会确信他们是他们所声称的身份。良好的做法是要求客户定期更新密码，密码越复杂，账户越安全。除了密码验证方法外，许多网站还鼓励客户开启多因素认证，这意味着客户必须提供多个一个因素来验证自己的身份。\n\
  \n例如，微软开发了一个名为 `Authenticator` 的应用，用户每次登录其 Microsoft 账户时，都必须在应用中选择正确的提示数字，或者在登录页面输入来自应用程序的一次性密码。其他身份验证方法包括生物识别认证、令牌认证或证书认证。理论上，没有一种身份验证方法可以保证\
  \ 100% 的安全，但身份验证越复杂，黑客或恶意软件破解它就越困难。记住，有时，强大的身份验证比为客户交付新功能更为重要。\n\n## 身份状态提供者 (AUTHENTICATIONSTATEPROVIDER)\n\
  \n本节展示了如何在 EShop.Server 中构建密码身份验证系统。`AuthenticationStateProvider` 可以帮助在 EShop 中实现身份验证功能。`AuthenticationStateProvider`\
  \ 是一个抽象类，可以提供当前用户的身份信息。基于此，将构建一个 `ShopAuthenticationStateProvider`。首先，查看 `AuthenticationStateProvider`\
  \ 类的源码：\n\n```csharp\npublic abstract class AuthenticationStateProvider\n{\n   \
  \ public abstract Task<AuthenticationState>\n    GetAuthenticationStateAsync();\n\
  \n    public event AuthenticationStateChangedHandler?\n    AuthenticationStateChanged;\n\
  \n    protected void\n    NotifyAuthenticationStateChanged(Task<AuthenticationState>\
  \ task)\n    {\n        ArgumentNullException.ThrowIfNull(task);\n        AuthenticationStateChanged?.Invoke(task);\n\
  \    }\n}\n\npublic delegate void AuthenticationStateChangedHandler(Task<AuthenticationState>\
  \ task);\n```\n\n注意 `AuthenticationStateChangedHandler` 是一个委托类型，它接受一个 `AuthenticationState`\
  \ 类型的 `Task` 作为参数并返回 `void`。\n\n\n\n\n\n```csharp\nprotected override void BuildRenderTree(RenderTreeBuilder\
  \ builder)\n{\n    builder.OpenElement(0, \"input\");\n    builder.AddMultipleAttributes(1,\
  \ AdditionalAttributes);\n    builder.AddAttribute(2, \"class\", CssClass);\n  \
  \  builder.AddAttribute(3, \"type\", \"password\");\n    builder.AddAttribute(4,\
  \ \"onchange\", EventCallback.Factory.CreateBinder<string>(this, value => CurrentValueAsString\
  \ = value, CurrentValueAsString, null));\n    builder.CloseElement();\n}\n```\n\n\
  使用自定义的 `InputPassword` 组件封装原生的 HTML `<input>` 元素。在创建登录页面之前添加一个模型。在 `Data` 文件夹下创建一个名为\
  \ `SignInFormModel.cs` 的新文件，代码如下：\n\n```csharp\nnamespace EShop.Server.Data;\n\n\
  public class SignInFormModel\n{\n    public string Name { get; set; }\n\n    public\
  \ string Password { get; set; }\n}\n```\n\n在 `Pages` 文件夹下创建新的登录页面 `SignIn.razor`。\n\
  \n```razor\n@page \"/sign-in\"\n<PageTitle>Sign In</PageTitle>\n@if (_authenticated)\n\
  {\n    <h1>Hello, @_model.Name</h1>\n}\nelse\n{\n    <h1>Sign In</h1>\n    <EditForm\
  \ Model=\"@_model\" OnValidSubmit=\"@HandleValidSubmit\">\n        <div class=\"\
  container\">\n            <div class=\"row\">\n                <div class=\"col-1\"\
  >\n                    <label>Name:</label>\n                </div>\n          \
  \      <div class=\"col-4\">\n                    <InputText @bind-Value=\"@_model.Name\"\
  \ />\n                </div>\n            </div>\n            <div class=\"row\"\
  >\n                <div class=\"col-1\">\n                    <label>Password:</label>\n\
  \                </div>\n                <div class=\"col-4\">\n               \
  \     <InputPassword @bind-Value=\"@_model.Password\" />\n                </div>\n\
  \            </div>\n            <button type=\"submit\" class=\"btn btn-primary\"\
  >\n                Submit\n            </button>\n        </div>\n    </EditForm>\n\
  }\n```\n\n上面的代码显示了用户是否已经登录，如果已身份验证，则将显示欢迎提示。如果没有登录，则显示登录表单。\n\n对于 C# 后置代码，在 `SignIn.razor.cs`\
  \ 中编写以下代码：\n\n```csharp\nusing EShop.Server.Auth;\nusing EShop.Server.Data;\nusing\
  \ Microsoft.AspNetCore.Components;\nusing Microsoft.AspNetCore.Components.Authorization;\n\
  \nnamespace EShop.Server.Pages;\n\npublic partial class SignIn : ComponentBase\n\
  {\n    private SignInFormModel _model = new SignInFormModel();\n    private bool\
  \ _authenticated = false;\n\n    [Inject]\n    private EShopAuthenticationStateProvider\
  \ AuthenticationStateProvider { get; set; }\n\n    private void HandleValidSubmit()\n\
  \    {\n        AuthenticationStateProvider.SignIn(_model.Name, _model.Password);\n\
  \    }\n\n    protected override void OnInitialized()\n    {\n        base.OnInitialized();\n\
  \        AuthenticationStateProvider.AuthenticationStateChanged += OnAuthenticationStateChangedAsync;\n\
  \    }\n\n    private async void OnAuthenticationStateChangedAsync(Task<AuthenticationState>\
  \ task)\n    {\n        var state = await task;\n        _authenticated = state.User.Identity.IsAuthenticated;\n\
  \    }\n}\n```\n\n在上面的代码中，用户调用了自定义的 `EShopAuthenticationStateProvider` 上的 `SignIn`\
  \ 方法并订阅了它的 `AuthenticationStateChanged` 事件。用户将根据从事件处理程序 `OnAuthenticationStateChangedAsync`\
  \ 获取的结果，来更新私有布尔字段 `_authenticated`。\n\n运行 `EShop.Server` 项目并在浏览器中导航到 `https://localhost:7181/sign-in`。由于用户尚未通过身份验证，此页面将显示登录表单。在\
  \ `Name` 中输入 `Brian`，在 `Password` 中输入任意随机字符串并点击 `Submit`。页面将隐藏登录表单并转而显示提示 `Hello,\
  \ Brian`。这证明了用户使用 `AuthenticationStateProvider` 实现了一个简单的身份验证机制。\n\n## 授权\n\n授权意味着赋予经过身份验证的用户某些访问资源的权限，在\
  \ `EShop` 应用程序中，可能是一个 Web 页面。以下章节将讨论如何进行授权。\n\n要对应用程序进行授权，使用 `CascadingAuthenticationState`\
  \ 组件封装 `Router`。这在 `App.razor` 文件中完成：\n\n```razor\n<CascadingAuthenticationState>\n\
  \    <Router AppAssembly=\"@typeof(App).Assembly\">\n        <Found>\n         \
  \   <AuthorizeView>\n                <Authorized>\n                    <RouteView\
  \ RouteData=\"@routeData\" Layout=\"@typeof(MainLayout)\" />\n                </Authorized>\n\
  \                <NotAuthorized>\n                    <LayoutView Layout=\"@typeof(MainLayout)\"\
  >\n                        <p>You are not authorized to view this content.</p>\n\
  \                    </LayoutView>\n                </NotAuthorized>\n         \
  \   </AuthorizeView>\n        </Found>\n        <NotFound>\n            <LayoutView\
  \ Layout=\"@typeof(MainLayout)\">\n                <p>Sorry, there's nothing at\
  \ this address.</p>\n            </LayoutView>\n        </NotFound>\n    </Router>\n\
  </CascadingAuthenticationState>\n```\n\n`CascadingAuthenticationState` 组件沿组件树向下提供\
  \ `Task<AuthenticationState>`。每当在注入的 `AuthenticationStateProvider` 上发出 `AuthenticationStateChanged`\
  \ 时，`Task` 实例将由事件参数中的新实例替换。\n\n`CascadingAuthenticationState` 组件注入了 `AuthenticationStateProvider`，但\
  \ `AuthenticationStateProvider` 类型从未被注册过。只注册了 `EShopAuthenticationStateProvider`。已知\
  \ `EShopAuthenticationStateProvider` 继承自 `AuthenticationStateProvider`，因此它可以赋值给\
  \ `AuthenticationStateProvider`。具体如何实现呢？幸运的是，在向服务程序注册类型时，.NET 有一个重载的 `AddScoped`\
  \ 方法接受 `Func` 实例作为创建所需实例的工厂，可以使用它将 `EShopAuthenticationStateProvider` 的实例注册为 `AuthenticationStateProvider`\
  \ 类型：\n\n```csharp\nbuilder.Services.AddScoped<AuthenticationStateProvider>(f =>\
  \ f.GetRequiredService<EShopAuthenticationStateProvider>());\n```\n\n每次需要新的 `AuthenticationStateProvider`\
  \ 实例时，都会调用 Lambda 表达式为应用程序创建一个，这将为 `CascadingAuthenticationState` 提供值。\n\n接下来，用新的\
  \ `AuthorizeView` 组件替换 `RouteView`。除了授权相关的渲染机制外，`AuthorizeView` 还继承自 `RouteView`。通过阅读\
  \ `AuthorizeView` 的源码，用户将默认情况下，它带有一个私有的 `RenderFragment`，如果用户未授权，它将渲染文本“Not authorized”，当用户正在进行授权时，它将渲染文本“Authorizing...”。当然，开发者可以通过为\
  \ `NotAuthorized` 和 `Authorizing` 参数提供值，分别在这两种场景下自定义渲染内容。\n\n\n\n\n\n```csharp\n\
  private static readonly RenderFragment _defaultAuthorizingContent = builder => builder.AddContent(0,\
  \ \"Authorizing...”);\n\n[Parameter]\npublic RenderFragment<AuthenticationState>?\
  \ NotAuthorized { get; set; }\n\n[Parameter]\npublic RenderFragment? Authorizing\
  \ { get; set; }\n\n[Parameter]\npublic object? Resource { get; set; }\n\n[CascadingParameter]\n\
  private Task<AuthenticationState>? ExistingCascadedAuthenticationState { get; set;\
  \ }\n\nprotected override void Render(RenderTreeBuilder builder)\n{\n    if (ExistingCascadedAuthenticationState\
  \ != null)\n    {\n        _renderAuthorizeRouteViewCoreDelegate(builder);\n   \
  \ }\n    else\n    {\n        builder.OpenComponent<CascadingAuthenticationState>(0);\n\
  \        builder.AddAttribute(1, nameof(CascadingAuthenticationState.ChildContent),\
  \ _renderAuthorizeRouteViewCoreDelegate);\n        builder.CloseComponent();\n \
  \   }\n}\n\nprivate void RenderAuthorizeRouteViewCore(RenderTreeBuilder builder)\n\
  {\n    builder.OpenComponent<AuthorizeRouteViewCore>(0);\n    builder.AddAttribute(1,\
  \ nameof(AuthorizeRouteViewCore.RouteData), RouteData);\n    builder.AddAttribute(2,\
  \ nameof(AuthorizeRouteViewCore.Authorized), _renderAuthorizedDelegate);\n    builder.AddAttribute(3,\
  \ nameof(AuthorizeRouteViewCore.Authorizing), _renderAuthorizingDelegate);\n   \
  \ builder.AddAttribute(4, nameof(AuthorizeRouteViewCore.NotAuthorized), _renderNotAuthorizedDelegate);\n\
  \    builder.AddAttribute(5, nameof(AuthorizeRouteViewCore.Resource), Resource);\n\
  \    builder.CloseComponent();\n}\n\nprivate sealed class AuthorizeRouteViewCore\
  \ : AuthorizeViewCore\n{\n    [Parameter]\n    public RouteData RouteData { get;\
  \ set; } = default!;\n\n    protected override IAuthorizeData[]? GetAuthorizeData()\n\
  \        => AttributeAuthorizeDataCache.GetAuthorizeDataForType(RouteData.PageType);\n\
  }\n// some code\n```\n\n```csharp\npublic abstract class AuthorizeViewCore : ComponentBase\n\
  {\n    private AuthenticationState? currentAuthenticationState;\n    private bool?\
  \ isAuthorized;\n\n    [CascadingParameter] \n    private Task<AuthenticationState>?\
  \ AuthenticationState { get; set; }\n\n    /// <inheritdoc />\n    protected override\
  \ void BuildRenderTree(RenderTreeBuilder builder)\n    {\n        if (isAuthorized\
  \ == null)\n        {\n            builder.AddContent(0, Authorizing);\n       \
  \ }\n        else if (isAuthorized == true)\n        {\n            var authorized\
  \ = Authorized ?? ChildContent;\n            builder.AddContent(0, authorized?.Invoke(currentAuthenticationState!));\n\
  \        }\n        else\n        {\n            builder.AddContent(0, NotAuthorized?.Invoke(currentAuthenticationState!));\n\
  \        }\n    }\n\n    protected override async Task OnParametersSetAsync()\n\
  \    {\n        if (ChildContent != null && Authorized != null)\n        {\n   \
  \         throw new InvalidOperationException($”Do not specify both '{nameof(Authorized)}'\
  \ and '{nameof(ChildContent)}.”);\n        }\n        if (AuthenticationState ==\
  \ null)\n        {\n            throw new InvalidOperationException($”Authorization\
  \ requires a cascading parameter of type Task<{nameof(AuthenticationState)}>. Consider\
  \ using {typeof(CascadingAuthenticationState).Name} to supply this.”);\n       \
  \ }\n        isAuthorized = null;\n        currentAuthenticationState = await AuthenticationState;\n\
  \        isAuthorized = await IsAuthorizedAsync(currentAuthenticationState.User);\n\
  \    }\n}\n```\n\n### 渲染逻辑\n在渲染 `AuthorizeRouteView` 组件时，它会首先检查是否存在已有的级联 `Task`\
  \ `AuthenticationState`。如果结果为真，它将直接渲染 `AuthorizeRouteViewCore`，否则它将将其封装在一个级联参数中。\n\
  \n`AuthorizeRouteViewCore` 组件是根据用户是否已授权来渲染不同内容的基类。在 `AuthorizeRouteViewCore` 在前端初始化后，它将在重写方法\
  \ `OnParametersSetAsync` 中验证参数。首先，不允许同时设置 `ChildContent` 和 `Authorized`，否则将抛出 `InvalidOperationException`。接下来，它将检查级联参数\
  \ `AuthenticationState` 是否已设置，并将字段 `isAuthorized` 设为 `null`，以防留有上一次的结果。 。随后，它将从\
  \ `AuthenticationState` 中获取 `User` 属性，并根据用户是否已授权再次设置 `isAuthorized` 字段：\n\n当字段 `isAuthorized`\
  \ 为 `null` 时，组件将渲染 `Authorizing` 子内容，这意味着应用程序正处于清除上一个结果和获取新授权结果的过程之间。当 `isAuthorized`\
  \ 为 `true` 时，将显示 `Authorized` 的内容，否则显示 `NotAuthorized`。对于尚未认证的用户，将显示登录页面，因此 `SignIn`\
  \ 组件被分配给 `NotAuthorized` 属性。\n\n### 保护页面\n如果构建并运行应用程序，每个页面仍然会正常显示，而不需要身份验证，例如上一章中构建的“添加商店商品”页面。为了防止\
  \ EShop 公司的非员工访问商品数据，请在组件页面上添加 `Authorize` 属性：\n\n```razor\n@page \"/add-shop-item”\n\
  @attribute [Authorize]\n<div class=”ItemContainer”>\n    <h1>Add Shop Item</h1>\n\
  </div>\n@* some code *@\n```\n\n通过在页面中添加这一行属性，该页面将受到任何未授权人员的保护。\n\n参考 图 12.1。\n\n\
  ![](img/pg274.jpg)\n\nFIGURE 12.1 使用 `Authorize` 属性保护页面。\n\n注意，用户访问 `/add-shop-item`\
  \ 时，实际上将其重定向到登录页面。参考 图 12.2。\n\n![](img/pg275.jpg)\n\nFIGURE 12.2 授权后访问 /add-shop-item。\n\
  \n请记住，应该在页面上使用 `Authorize` 属性，而不是单个组件。如果渲染子组件取决于身份状态，请使用 `AuthorizeView` 组件来封装。\n\
  \n### 角色授权\n在之前的示例中，所有登录的用户都能在数据库中添加新商品，这显然不是我们想要的。更好的实现是允许 EShop 员工提交“添加商品”表单。简单来说，角色授权是为认证的用户分配角色声明，随后用户访问受特定角色保护的页面时，Blazor\
  \ 将检查用户是否拥有这些特定角色。如果结果为正，用户有权访问页面。如果结果为负，`AuthorizeRouteView` 将用户重定向到 `NotAuthorized`\
  \ 内容。以下显示了如何修改 `EShopAuthenticationState` 并为成功登录的用户分配角色：\n\n```csharp\nusing System.Security.Claims;\n\
  using Microsoft.AspNetCore.Components.Authorization;\n\nnamespace EShop.Server.Auth;\n\
  \npublic class EShopAuthenticationStateProvider : AuthenticationStateProvider\n\
  {\n    private bool _isSignedIn = false;\n    private string _username = string.Empty;\n\
  \    private string Email { get => $\"{_username.Replace(\" \", \"\")@eshop.com\"\
  ; }\n\n    public override Task<AuthenticationState> GetAuthenticationStateAsync()\n\
  \    {\n        ClaimsIdentity claimsIdentity;\n        if (_isSignedIn)\n     \
  \   {\n            var claims = new List<Claim>()\n            {\n             \
  \   new Claim(ClaimTypes.Name, _username),\n                new Claim(ClaimTypes.Email,\
  \ Email),\n                new Claim(ClaimTypes.Role, _username.Contains(\"EShop”)?”Employee”:”Customer”)\n\
  \            };\n            claimsIdentity = new ClaimsIdentity(claims, \"EShopAuth”);\n\
  \        }\n        else\n        {\n            claimsIdentity = new ClaimsIdentity();\n\
  \        }\n        var authenticationState = new AuthenticationState(new ClaimsPrincipal(claimsIdentity));\n\
  \        return Task.FromResult(authenticationState);\n    }\n\n    public void\
  \ SignIn(string username, string password)\n    {\n        _username = username;\n\
  \        _isSignedIn = !string.IsNullOrWhiteSpace(username) && !string.IsNullOrWhiteSpace(password);\n\
  \        NotifyAuthenticationStateChanged(GetAuthenticationStateAsync());\n    }\n\
  }\n```\n\n\n\n\n在前面的代码示例中，假设如果登录用户的用户名包含 EShop，那么他们就是 EShop 公司的员工，并可以为他们添加 `Employee`（员工）角色。否则，该用户是一个潜在客户，他们将在某个时候在\
  \ EShop 应用程序中购买某些衣服，并被分配 `Customer`（客户）角色。在 `AddShopItem.razor` 中，为 `Authorize`\
  \ 特性添加 `Roles` 检查。\n\n```razor\n@attribute [Authorize(Roles = \"Employee\")]\n```\n\
  \n再次运行应用程序，当访问 `/add-shop-item` 时，用户将像以前一样被要求登录。如果用户使用用户名 `Brian` 登录，页面将仅显示 `Hello,\
  \ Brian`，而不会像图 12.3 所示那样重定向回“添加商店商品”页面。\n\n![](img/pg_278.jpg)\n\n图 12.3 基于角色的授权。\n\
  \n如果用户再次使用用户名 `Brian-EShop` 登录，将显示“添加商店商品”页面。\n\n## 基于策略的授权\n\n与基于角色的授权相比，基于策略的授权更加灵活。在基于角色的授权中，应用程序为每个用户分配一个固定角色，且角色是检查的唯一规则。对于基于策略的授权，规则可以超出角色的范围。策略规则仍然可以是角色，但角色也可以是一个简单的电子邮件检查、一个数学方程或更复杂的自定义处理程序，用来判断用户是否获得授权。\n\
  \n一种场景可能是，“添加商店商品”页面仅允许具有特定角色的用户访问，并且他们必须来自特定地区，其邮政编码以特定数字结尾。显然，这无法通过基于角色的授权来实现，因为该规则要求的不仅仅是简单的角色检查。\n\
  \n为了确认基于策略的授权，请在 `Auth` 文件夹下创建一个名为 `AddShopItemRequirement.cs` 的新文件，并包含以下代码\n\n\
  ```csharp\nusing Microsoft.AspNetCore.Authorization;\n\nnamespace EShop.Server.Auth;\n\
  \npublic class AddShopItemRequirement : IAuthorizationRequirement\n{\n    public\
  \ char PostalCodeSuffix { get; }\n    public string Role { get; }\n\n    public\
  \ AddShopItemRequirement(char postalCodeSuffix, string role)\n    {\n        PostalCodeSuffix\
  \ = postalCodeSuffix;\n        Role = role;\n    }\n}\n```\n\n这是一个简单的数据类，包含两个必需属性，并实现了\
  \ `IAuthorizationRequirement` 接口。该接口中没有定义任何方法。它作为稍后处理程序的通用占位符：\n\n```csharp\npublic\
  \ interface IAuthorizationRequirement\n{\n}\n```\n\n接下来，创建一个管理该请求的处理程序。在 `Auth`\
  \ 文件夹下创建一个名为 `AddShopItemHandler.cs` 的新文件，并包含以下代码\n\n```csharp\nusing System.Security.Claims;\n\
  using Microsoft.AspNetCore.Authorization;\n\nnamespace EShop.Server.Auth;\n\npublic\
  \ class AddShopItemHandler : AuthorizationHandler<AddShopItemRequirement>\n{\n \
  \   protected override Task HandleRequirementAsync(AuthorizationHandlerContext context,\
  \ AddShopItemRequirement requirement)\n    {\n        if (!context.User.HasClaim(c\
  \ => c.Type == ClaimTypes.Role) &&\n            !context.User.HasClaim(c => c.Type\
  \ == ClaimTypes.PostalCode))\n        {\n            context.Fail();\n         \
  \   return Task.CompletedTask;\n        }\n\n        var postalCode = context.User.FindFirstValue(ClaimTypes.PostalCode);\n\
  \        var role = context.User.FindFirstValue(ClaimTypes.Role);\n\n        if\
  \ (postalCode.EndsWith(requirement.PostalCodeSuffix) && role == requirement.Role)\n\
  \        {\n            context.Succeed(requirement);\n            return Task.CompletedTask;\n\
  \        }\n\n        context.Fail();\n        return Task.CompletedTask;\n    }\n\
  }\n```\n\n在 `AddShopItemHandler` 类中，重写 `HandleRequirementAsync` 方法。如果当前匹配自定义规则，则调用\
  \ `context` 上的 `Succeed` 方法表示该请求已成功评估。否则，调用 `context` 上的 `Fail` 方法。通过处理程序，甚至可以调用远程服务\
  \ API 来评估策略，这比固定的基于角色的授权强大得多。\n\n最后一步是按如下所示修改 `AddShopItem.razor` 中的 `Authorize`\
  \ 特性：\n\n```razor\n@attribute [Authorize(Policy = \"AddShopItemPolicy\")]\n```\n\
  \n在 `Program.cs` 中注册策略：\n\n```csharp\nbuilder.Services.AddAuthorization(config =>\n\
  {\n    config.AddPolicy(\"AddShopItemPolicy\", p => p.Requirements.Add(new AddShopItemRequirement('2',\
  \ \"Employee\")));\n});\n```\n\n已经实现了一种更灵活、更强大的授权。\n\n## ASP.NET CORE IDENTITY\n\
  \nASP.NET Core Identity 是一个开源服务器库，用户可以部署它来提供预构建的登录 UI 页面，并管理密码、角色、电子邮件等用户数据。这在开发者不需要像之前的示例那样实现自己的身份验证和授权系统时，节省了大量精力和。使用此身份库，与\
  \ Azure Active Directory 或 Azure Active Directory B2C 集成非常容易。如果正在构建面向选择使用 Azure\
  \ Active Directory 作为用户系统的业务客户的应用程序，ASP.NET Core Identity 将是开发者构建此类用户身份验证应用的必备工具。\n\
  \n## 总结\n\n本章首先概述了身份验证（Authentication）和授权（Authorization）的概念，然后讨论了如何通过自定义的 `AuthenticationStateProvider`\
  \ 实现身份验证。接下来，解释了“添加商店商品”页面如何演示两种授权方式，即基于角色的授权和基于策略的授权。通过对比，读者了解到基于策略的授权比基于角色的授权更灵活。\n\
  \n第 13 章将解释如何将 EShop 应用程序部署到运行在云环境中的 Kubernetes。Azure Kubernetes Service (AKS) 允许用户在\
  \ Kubernetes 集群中快速部署应用程序，而运维人员无需担心底层的基础设施。\n\n\n\n\n\n在容器时代到来之前，部署应用程序时开发者需要手动编译源代码，并将二进制文件复制并粘贴到服务器（例如，虚拟机\
  \ VM），同时还要维护相关的依赖工具和服务。例如，基于 Linux 的虚拟机和基于 Windows 的虚拟机需要不同的二进制文件，因此用户必须针对不同的操作系统对相同的源代码进行两次编译。此外，应用程序可能需要数据库（例如，一个用于存储业务数据的\
  \ SQL Server），开发者必须在目标虚拟机上手动安装它。更如此，用户所依赖的这些应用或服务可能还需要安装更多的服务或工具，而所有这些依赖项中的任何一个微小变化，都可能导致在该虚拟机上维护整个应用程序家族需要付出巨大的精力。其中一些过程可以通过\
  \ CI/CD 流水线实现自动化，但另一些不能。开发者或运维人员会发现系统可能太复杂而难以管理，每当部署应用程序的新版本时，都可能发生意外问题。同样重要的是，同一个应用程序可能在一种环境中运行良好，而在另一个环境中却崩溃。\n\
  \n幸运的是，Docker 提供了一个统一的平台，允许在标准环境中运行基于 Linux 或 Windows 的应用程序。其核心思想是：操作系统就像一艘货轮，而运行在操作系统上的每个应用程序或服务都是一个容器。开发者可以自定义容器内部的内容，或者使用由其他专业人员构建的容器。容器的运行环境经过组合，部署应用程序等于部署一系列标准组件。就像乐高积一样，开发者可以在他的工作组件（数据库）之上构建自己的工作（应用程序）。\n\
  \n一个完整的 Docker 由 Docker Client、Docker Daemon、Docker Image 和 Docker Container 组成。Docker\
  \ 在客户端-服务器模式下运行。Docker Daemon 作为服务器运行接收客户端的请求，而 Docker Client 向 Docker Daemon 发送请求。它们可以运行在同一台机器上，也可以在不同的服务器上，并通过\
  \ sockets 或 RESTful API 进行通信。发送给 Docker Daemon 的请求包括创建、运行或分容器。通过这种方式，构建、测试和部署应用程序的整个过程可以通过流水线实现完全自动化。\n\
  \n## 构建 Docker 镜像\n\nDocker 容器是由 Docker 镜像创建的。用户将根据名为 `Dockerfile` 的定义文件构建 Docker\
  \ 镜像。在此之前，用户必须首先安装 Docker 环境。执行此操作的指令非常复杂，书中未涵盖，但用户可以根据自己的操作系统遵循 Docker 官方网站上的说明进行操作。Docker\
  \ 支持 Windows、Linux 和 MacOS。\n\n安装 Docker 后，在终端中运行 `docker --version` 命令，他们应该看到类似的输出。参考图\
  \ 13.1。\n\n![](img/pg_285.jpg)\n\n图 13.1 Docker 命令。\n\n接下来，在根文件夹下创建一个名为 `Dockerfile`\
  \ 的新文件，内容如下：\n\n```dockerfile\nFROM mcr.microsoft.com/dotnet/sdk:6.0\nWORKDIR /app\n\
  COPY . ./\nRUN dotnet restore \\\n&& dotnet publish ./EShop.Server.csproj -o /publish/\n\
  WORKDIR /publish\nENV ASPNETCORE_URLS=\"http://0.0.0.0:5000\"\nENTRYPOINT [\"dotnet\"\
  , \"EShop.Server.dll\"]\n```\n\n`Dockerfile` 的第一行必须以 `FROM` 命令开头。该命令定义了将使用的基础镜像，并启动一个新的构建阶段。此项目是用于构建\
  \ Blazor Server 应用程序，因此选择了微软的 dotnet 6.0 SDK 基础镜像。在构建使用不同语言开发的应用程序时，用户可以选择其他基础镜像。例如，如果正在构建一个\
  \ Golang 服务器的 Docker 镜像，他们可能会选择基于 `golang:1.20.4` 构建镜像，或者为 Node.js 应用选择 `node:18.16.0`。镜像名称由冒号分为两部分。第一部分代表镜像的仓库（repo）。默认情况下，`docker`\
  \ 命令将尝试从 Docker Hub 拉取镜像。要从自定义仓库拉取，用户需要指定完整的仓库名称。例如，`Dockerfile` 中使用的 dotnet SDK\
  \ 镜像位于微软容器注册表，因此全名为是 `mcr.microsoft.com/dotnet/sdk:6.0`。访问 `https://mcr.microsoft.com/en-us`\
  \ 容器注册表网页，并查找必要的镜像。第二部分代表镜像的标签（tag）。在标签部分，容器注册表通常会列出所有可用标签。\n\n参考图 13.2。\n\n![](img/pg_286.jpg)\n\
  \n图 13.2 Docker 镜像标签。\n\n指定仓库和标签后，找到所需的基础 Docker 镜像。有时，人们可以从空（scratch）构建镜像，Docker\
  \ 提供了一个特殊的空镜像名为 `scratch`。这是一个无法拉取、运行或标记的虚拟镜像。它仅表示一个空镜像。\n\n`Dockerfile` 的下一行使用了\
  \ `WORKDIR` 命令。该命令指定镜像的工作目录为 `/app`，后续所有命令都将在该目录下运行。如果目录不存在，`WORKDIR` 将创建该目录。\n\n\
  第三条命令是 `COPY`，它将文件从构建上下文复制到目标镜像。在这里用户将所有内容复制到工作目录，因此该行简单为 `COPY . .`，第一个点代表构建上下文中的所有文件，第二个点代表相对路径。用户也可以使用绝对路径。请注意，`COPY`\
  \ 命令不仅会复制所有文件，还会保留文件的元数据，如访问时间和修改时间。\n\n下一条命令是 `RUN`，后面跟着 shell 指令。Blazor 应用在此阶段将被构建并发布。\n\
  \n再次使用 `WORKDIR` 命令指定包含发布的应用程序二进制文件的工作目录。\n\n`ENV` 命令后续 Dockerfile 命令或运行的应用程序可以使用这里定义的环境变量。\n\
  \n最后一条命令是 `ENTRYPOINT`。该命令定义了运行程序以及传递给它的参数。此示例显示运行程序是 `dotnet`，参数是 `EShop.Server.dll`。\n\
  \n最后，在根文件夹下运行命令 `docker build ./EShop.Server -t eshopserver:1.0.0` 构建镜像，终端应该显示与图\
  \ 13.3 所示类似的输出。\n\n![](img/pg_288.jpg)\n\n图 13.3 构建 Docker 镜像。\n\n运行命令 `docker image\
  \ ls` 查看最近构建的 `eshserver` 镜像。参考图 13.4。\n\n![](img/pg_288-1.jpg)\n\n图 13.4 列出 Docker\
  \ 镜像。\n\n\n\n\n操作系统通常由内核和用户空间组成。对于 Linux 系统，根文件系统可以提供用户空间支持，而 Docker 镜像就像根文件系统。它包含了所有必需的文件，包括程序、库、配置，甚至如上一节中提到的环境变量之类的运行时参数。Docker\
  \ 镜像不包含任何动态数据，一旦构建完成，其内容永远不会改变。由于有太多文件需要构建到 Docker 镜像中，因此采用了逐层构建的方法来生成镜像。每一层都构建在上一层之上，这解释了为什么所有\
  \ Dockerfile 必须以 `FROM` 命令开始。每一层构建完成后，就不会再发生任何变化。这意味着如果你从上一个层中删除一个文件，该文件将被标记而非实际被物理删除。当该镜像的容器最终运行时，尽管无法再次访问它，该文件仍然存在。在创建新镜像时必须非常小心，只添加必要的文件，并在层完成构建之前清理所有缓存或额外文件。\n\
  \n分层结构带来的另一个益处是层变得易于分发、共享或重用。所有修改文件系统的 Dockerfile 命令通常都会创建一个新层，如果文件系统保持不变，Docker\
  \ 守护进程将决定何时可以使用缓存。例如，如果将发布的应用程序目录改为 Blazor 并重新构建 Docker 镜像，Docker 守护进程将尝试尽可能多地重用层，用户将看到输出显示为\
  \ CACHED，如图 13.5 所示。请记住，在修改层之后的所有层也将将被重建，即使它们本身没有进行任何文件更改，但因为它们依赖的层已经更新了。\n\n![](img/pg_289.jpg)\n\
  \n图 13.5 Docker 镜像层。\n\n层本身也是有效的 Docker 镜像，可以从层镜像启动容器。当拉取新镜像时，层也会起作用。用户在本地已拥有的层将被跳过，Docker\
  \ 将只下载用户没有的层。\n\n以下内容解释了如何使用命令启动构建好的镜像的容器：\n\n```bash\ndocker run -p 5000:5000 -d\
  \ eshopserver:1.0.0\n```\n\n参数 `-p` 是 `public`（发布）的缩写，定义了为运行中的容器发布的端口。第一个端口号代表宿主机上的端口，下一个端口代表容器内的端口。通常，用户在双方都使用相同的端口，但他们应该决定是否喜欢两个不同的端口。参数\
  \ `-d` 是 `detach`（分离）的缩写，在后台或分离模式下运行容器，你将返回终端提示符。最后一个参数是选择在容器中运行的镜像，如果省略，则标签默认为\
  \ `latest`。\n\n现在终端将显示容器的哈希 ID。在浏览器访问 `http://localhost:5000`，如果应用程序是用 `dotnet run`\
  \ 启动的，将看到完全相同的页面。参考图 13.6。\n\n![](img/pg_290.jpg)\n\n图 13.6 启动 Docker 容器。\n\n要停止容器，运行命令\
  \ `docker container stop <hash id>`，该哈希 ID 来自 `docker run` 命令的输出。使用命令 `docker container\
  \ ls -a` 检查容器状态，其中 `-a` 参数用于显示已停止的容器。\n\n参考图 13.7。\n\n![](img/pg_291.jpg)\n\n图 13.7\
  \ 容器状态。\n\n### 什么是 K8S？\n\n只要用户在这些环境中使用相同的标签部署相同的镜像，Docker 容器就能帮助维护不同环境之间的一性。另一个考虑因素是，如果一个容器出现问题并退出怎么办？纠正此问题的简单方法是连接到虚拟机并手动重启容器。需要注意的是，随着微服务架构风格变得越来越流行，你可能会在许多不同的虚拟机上运行成百甚至数千个容器。每刻手动部署、检查或修复容器问题变得几乎是不可能的。\n\
  \nKubernetes，或 `K8S`，是一个用于自动化容器化应用部署、扩展和管理的开源系统。可以将其想象成一个管理器，可以部署、检查和重启容器应用等。用户只需定义其容器的预期状态即可使用\
  \ `K8S`。\n\n### K8S 组件\n\nKubernetes 系统部署在集群中，集群中至少有一台工作机器称为 `node`（节点）。为了管理集群和工作节点，Kubernetes\
  \ 提供了一组名为 `Control Plane`（控制平面）的组件。`Control Plane` 作为系统的大脑，控制集群并响应来自任何客户端或节点的请求和事件。在控制平面组件组中，`kube-apiserver`\
  \ 向客户端暴露 Kubernetes API，验证请求数据并作为前端。该组中的下一个组件是 `etcd`，它是一个开源分布式键值数据库，存储所有集群数据，例如\
  \ `Pod` 状态。`kube-scheduler` 是负责选择合适的工作节点来运行 `Pod` 的组件。`kube-controller-manager`\
  \ 是运行多个控制器的组件，包括 `Node controller`（节点控制器）或 `Job controller`（作业控制器）。这些控制器共同控制 `K8S`\
  \ 系统中的 `Node`、`Job` 和通信。控制平面组中的最后一个组件是 `cloud-controller-manager`。它允许用户将集群连接到云提供商。\n\
  \nNode 组件是另一组运行在工作节点上的组件。第一个组件是名为 `kubelet` 的代理，它负责 `Pod` 并确保 `Pod` 在预期状态下运行。在每个工作节点上有一个名为\
  \ `kube-proxy` 的网络代理，维护到 `Pod` 的网络通信。最后一个组件是 `container runtime`（容器运行时），它负责容器运行时。注意，Docker\
  \ 使用的 `containerd` 既不等同于 Docker 容器，也不是 Kubernetes 支持的唯一运行时。\n\n### 部署到 AKS——Azure\
  \ 上的 K8S\n\n除了创建和维护本地 Kubernetes 集群外，本节将重点在 Azure Kubernetes Services (`AKS`) 中部署\
  \ `EShop.Server` 。`AKS` 是 Azure 提供的服务。它为 Azure 中部署云原生应用提供了快速方法并实现了自动扩展。需要一个 Azure\
  \ 账户，可以在 `https://azure.microsoft.com/en-us/free` 获取带有 200 美元额度的免费账户。开始之前，访问 `https://portal.azure.com`\
  \ 并点击 `Create a resource`（创建资源）或在顶部搜索栏中搜索 `Kubernetes`。\n\n参考图 13.8。\n\n![](img/pg_293.jpg)\n\
  \n图 13.8 在 Azure 门户中搜索 Kubernetes。\n\n\n\n首先，选择一个 Azure 订阅，并选择新集群所属的资源组，或者创建一个新的资源组。如果应用程序足够大，建议用户为每个业务线或每个功能创建一个专用资源组。在这里，创建一个名为\
  \ `eshop` 的新资源组。接下来是集群预设配置，对于此，选择 `Dev/Test`，因为本次演示的目的是部署 `EShop.Server`。用户可以根据其应用程序负载或性能需求自由选择其他配置。接下来，同样为集群命名为\
  \ `eshop`。Azure 在全球提供了许多可用区域，最好选择一个距离潜在客户更近的区域。对于此演示，选择免费层级，如果有人仍在学习或测试 `AKS`，这种选择更为合适。选择\
  \ `Standard B2s` 作为节点大小，因为这里没有强烈的性能需求。由于不需要扩展，将 `Scale` 方法从 `Autoscale` 更改为 `Manual`\
  \ 并在集群中分配一个节点。其他字段保持默认值，并点击 `Review + create` 按钮。Azure 将验证配置，如果通过，点击最后的 `Create`\
  \ 按钮创建集群。\n\n请参阅图 13.11 和 13.12。\n\n![](img/pg_295.jpg)\n\nFIGURE 13.11 创建集群。\n\n\
  ![](img/pg_295-1.jpg)\n\nFIGURE 13.12 部署正在进行。\n\n创建集群可能需要几分钟时间，在 Azure 处理期间，用户将看到如前面的截图所示的页面。\n\
  \n准备好后，用户通过点击部署页面上的 `Go to resource` 按钮进入其集群资源。请参阅图 13.13。\n\n![](img/pg_296.jpg)\n\
  \nFIGURE 13.13 集群资源。\n\n集群已就绪，但还需要另一个 Azure 资源：Azure 容器注册表 (`ACR`)。`ACR` 是一个存储和管理容器镜像的私有位置，在这里将用作\
  \ `eshop` Kubernetes 集群的镜像源。同样，人们可以在搜索栏中搜索容器注册库并按照相同过程创建一个。\n\n（参见图 13.14。）\n\n\
  ![](img/pg_297.jpg)\n\nFIGURE 13.14 使用 Azure 容器注册表 (ACR) 创建。\n\n注意，`Registry` 名称在所有\
  \ Azure 容器注册表中必须是唯一的，因此如果名称已被占用，则必须想出一个替代方案。在这里，选择上一步创建的现有 `eshop` 资源组，将 SKU 更改为\
  \ `Basic` 并创建它。\n\n一旦注册表就绪，为 `eshop` 镜像打标签并推送到 Azure 容器注册表。默认情况下，Docker 镜像是为 Docker\
  \ Hub 注册表标记的，应该再次打标签，否则 Docker 镜像将推送到 Docker Hub。要为镜像打标签，运行以下命令：\n\n```\ndocker\
  \ image tag eshopserver:1.0.0 blazoreshop.azurecr.io/eshopserver:1.0.0\n```\n\n\
  注意 Azure 容器注册表的服务器地址位于镜像名称之前。运行 `docker image ls` 显示所有本地镜像，并查看新打标签的镜像。\n\n请参阅图 13.15。\n\
  \n![](img/pg_298.jpg)\n\nFIGURE 13.15 为 Azure 容器注册表标记镜像。\n\n由于 Azure 容器注册表是私有的，用户在推送镜像之前必须登录。建议在生产环境中使用\
  \ `AD` 服务主体登录。对于这种情况，为了简单起见使用了管理员用户方法。进入 Azure 门户中的注册表资源，并在 `Access keys` 选项卡中开启\
  \ `Admin user`。务必保存用户名和密码并将它们保存在安全的地方。运行以下登录命令：\n\n```\ndocker login blazoreshop.azurecr.io\
  \ -u <username> -p <password>\n```\n\n如果终端显示 `Login Succeeded`，就可以推送镜像了。使用以下命令推送镜像：\n\
  \n```\ndocker push blazoreshop.azurecr.io/eshopserver:1.0.0\n```\n\n请参阅图 13.6。\n\
  \n![](img/pg_298-1.jpg)\n\nFIGURE 13.16 将镜像推送到 Azure 容器注册表。\n\n在 Azure 门户中双击推送结果。进入注册资源并点击左侧的\
  \ `Repositories` 菜单以查看刚刚推送的新仓库。\n\n现在镜像已上传，Kubernetes 集群已创建。在最终部署应用程序之前的最后一步是连接\
  \ Kubernetes 集群和注册表。使用 Azure CLI 完成此操作。请参考官方网页 [`learn.microsoft.com/en-us/cli/azure/install-azure-cli`](https://learn.microsoft.com/en-us/cli/azure/install-azure-cli)\
  \ 安装它。在这里使用了 Windows 上的 `WSL`，因此使用命令安装 Azure CLI：\n\n```\ncurl -sL https://aka.ms/InstallAzureCLIDeb\
  \ | sudo bash\n```\n\n一旦安装了 Azure CLI，使用命令登录：\n\n```\naz login\n```\n\n连接 AKS 和\
  \ ACR：\n\n```bash\naz aks get-credentials --name <cluster name> -g <resource group>\
  \ --attach-acr <acr id>\n```\n\n进入 Azure 门户中的 AKS 资源并点击 `Overview` 选项卡，然后点击右上角的\
  \ `JSON View`。在 Kubernetes 中，`pod` 是最小的部署单元。\n\n image/pg_299.jpg)\n\nFIGURE 13.17\
  \ Azure CLI 登录。\n\n要查看集群中的节点，运行以下命令：\n\n```bash\nkubectl get nodes\n```\n\n要查看部署状态，运行以下命令：\n\
  \n```bash\nkubectl get deployments\n```\n\n要查看 pod，运行以下命令：\n\n```bash\nkubectl get\
  \ pods\n```\n\n要查看 pod 的详细信息，运行以下命令：\n\n要查看 YAML 配置，运行以下命令：\n\n```bash\nkubectl\
  \ get deployment -o yaml\n```\n\n在 Kubernetes 中，客户端与 API 服务器通信以预期状态。这种预期状态以 YAML\
  \ 或 JSON 格式定义，这里将使用 YAML。\n\n进入 Azure 门户中的 AKS 资源并点击 `Workloads` 菜单，这将引导到 Workloads\
  \ 管理页面。在此管理页面上，点击 `Deployments` 选项卡，然后点击 `Create` 按钮并选择“Apply a YAML”。在新页面中填充以下\
  \ YAML 内容并点击底部的 `Add` 按钮：\n\n```yaml\napiVersion: apps/v1\nkind: Deployment\nmetadata:\n\
  \  name: eshopserver\n  labels:\n  app: eshopserver\nspec:\n  replicas: 2\n  selector:\n\
  \    matchLabels:\n      app: eshopserver\n  template:\n    metadata:\n      labels:\n\
  \        app: eshopserver\n    spec:\n      containers:\n      - name: eshopserver\n\
  \        image: blazoreshop.azurecr.io/eshopserver:1.0.0\n        ports:\n     \
  \   - containerPort: 5000\n```\n\n所有的 Kubernetes YAML 都遵循相同的架构，从 API 版本和 YAML 中定义的负载资源类型开始。metadata\
  \ 部分定义名称、标签或命名空间。由于未指定命名空间，它将使用默认命名空间。spec 部分定义了负载资源的配置，不同类型的资源详细配置有所不同。在这里，用户首先声明他们希望\
  \ Kubernetes 集群中运行两个 pod。然后他们应该定义此 pod 应使用哪个镜像，以及哪个端口应该被导出并监听。\n\n返回 Workloads 页面查看新创建的\
  \ Deployments 资源。在负载就绪之前，通常只需要几秒钟。请参阅图 13.18。\n\n![](img/pg_301.jpg)\n\nFIGURE 13.18\
  \ 已部署的 Kubernetes 工作负载。\n\n\n\n\n切换到 Pods 标签页，两个新的 pod 应该显示为 Running（运行中），如图 13.19\
  \ 所示。\n\n![](img/pg_301-1.jpg)\n\n图 13.19 AKS 中运行的 pod。\n\n目前，应用程序只能通过内部 Pod IP\
  \ 在集群内部访问。在 Kubernetes 集群中创建一个 Service 将其暴露到公共互联网。进入 Services 和 ingresses 菜单，点击\
  \ Create（创建）按钮，并在下拉列表中选择 Apply a YAML（应用 YAML）。在编辑器中粘贴以下内容：\n\n```yaml\napiVersion:\
  \ v1\nkind: Service\nmetadata:\n  name: eshopserver-service\nspec:\n  type: LoadBalancer\n\
  \  ports:\n  - port: 80\n    targetPort: 5000\n    name: http\n  selector:\n   \
  \ app: eshopserver\n```\n\n这将创建一个类型为 `LoadBalancer` 的 Kubernetes 服务，监听容器端口 5000\
  \ 并端口 80 暴露到公共互联网。在生产环境中，用户通常会创建一个 ingress 控制器来暴露其应用程序。在 Azure 中，Application Gateway\
  \ Ingress Controller（用于管理应用程序流量的负载均衡器）可以帮助实现这一点。\n\n点击 Add（添加）按钮，Kubernetes 服务正在创建中。该服务将被分配一个外部\
  \ IP，EShop 应用程序将通过 http://<service ip> 暴露到互联网。\n\n## 结语\n\n本章首先介绍了 Docker，并探讨了它为什么变得流行。读者随后构建了自己的\
  \ Docker 镜像，同时，书中也解释了 Docker 镜像的分层结构，并讨论了如何利用分层来提高镜像构建效率并降低设备空间成本。接下来，本章介绍了开源 Kubernetes\
  \ 及其控制平面（Control Plan）和工作节点（Work Node）组件。这些组件共同实现了扩展、管理容器化应用程序以及部署的自动化。最后，用户探索了用于存储\
  \ Docker 镜像的 Azure Container Registries (ACR)，并使用了 Azure Kubernetes Service (AKS)\
  \ 来部署和运行 Docker 镜像。\n\n在整本书中，读者学习了 WebAssembly、Blazor 开发以及在 Azure 公有云中的容器化部署。希望这些信息能启发读者构建自己的应用程序！\n\
