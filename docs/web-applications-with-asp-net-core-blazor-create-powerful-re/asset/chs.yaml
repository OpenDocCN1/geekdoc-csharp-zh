  \ `InputFileChangeEventArgs` 参数读取文件流并转换为 Base64 字符串：\n\n```csharp\nusing Microsoft.AspNetCore.Forms;\n\
  namespace EShop.Pages\n{\n    public partial class ShopItem\n    {\n        public\
  \ Models.ShopItem Item { get; }\n        public string? Content { get; set; }\n\
  \        private string _base64Image = string.Empty;\n        public ShopItem()\n\
  \        {\n            Item = new Models.ShopItem(\"T-shirt\", \"The best ever\
  \ with lower price!\", 19.9);\n            Item.ImageUrl = \"https://ts1.cn.mm.bing.net/th/id/R-C.614bdee2065be0f1976bdf839c725e26?rik=EJ2vSWnK-s9a9vQ&riu=http%3a%2f%2fclipart-library.com%2fimg%2f828773.png&eh-k=avi5QwUJFS0v4Qtu8ggI5Ariopp4uJwf7r5QlOnJQ0o%3d&risl=&pid=ImgRaw&r=0\"\
  ;\n        }\n        private void AddComment()\n        {\n            System.Console.WriteLine(\"\
  AddComment\");\n            if (string.IsNullOrWhiteSpace(Content))\n          \
  \  {\n                return;\n            }\n            var comment = new Models.Comment(Content!,\
  \ \"\");\n            Item.AddComment(comment);\n            Console.WriteLine(Content);\n\
  \        }\n        private async void UploadImageAsync(InputFileChangeEventArgs\
  \ args)\n        {\n            using var stream = args.File.OpenReadStream();\n\
  \            byte[] buffer = new byte[(int)stream.Length];\n            await stream.ReadAsync(buffer,\
  \ 0, (int)stream.Length);\n            _base64Image = $\"data:{args.File.ContentType};base64,{Convert.ToBase64String(buffer)}\"\
  ;\n        }\n    }\n}\n```\n\n\n\n\n为了避免恶意攻击，人们应该做的第一件事是在处理所有外部来源的文件之前，对它们进行扫描、检查和验证。此外，用户可能希望直接从客户端浏览器将客户文件上传到受信任的第三方存储服务。例如，`Azure\
  \ Storage` 最适合这些情况，这样应用程序就可以作为代理安全地处理文件，并在需要显示或使用文件时调用外部存储服务。然而，本书将不会涵盖如何上传到第三方的细节，因为读者正在编写\
  \ `C#` 代码（这是选择使用 `Blazor` 构建 Web 应用程序的优势），用户可以调查第三方的后端代码文档，并希望它们提供 `C#` 示例。\n\n\
  最后，限制用户一次可以上传的文件数量是有价值的。要实现这一点，只需在调用 `GetMultipleFiles` 时传递一个显式的最大值即可。默认数量为 10，但请记住在生产环境中如果有更小的限制，请更改它。\n\
  \n## 结论\n\n本章介绍了两种流行的协议——`HTTP` 和 `FTP`，用户可以利用它们在服务器和客户端之间共享文件。接下来，章节详细介绍了如何在 `Blazor`\
  \ 中上传文件的文件的示例，并讨论了读者在处理文件上传时可能想要考虑的一些建议和注意事项。\n\n第 6 章 讨论了如何在 `Blazor` 中向客户提供文件。\n\
  \n# 第 6 章：在 Blazor 中提供和保护文件 \n\n## 引言\n\n上一章介绍了用户如何使用 `InputFile` Razor 组件向 `Blazor`\
  \ 上传文件。本章还讨论了如何保护应用程序免网络安全攻击。向客户端提供文件对于应用程序至关重要，特别是对于那些面向客户的应用程序。需求通常包括定期生成的销售数据文件、用于了解更多洞察的统计下载，或业务智能报告。本章探索了如何向用户提供文件、从应用程序下载文件，以及当用户上传文件时相同的安全性考虑因素。\n\
  \n## 结构\n\n本章讨论了以下主题：\n\n- `ASP.NET Core` 中的 `middlewares`\n- 提供静态文件\n- 提供动态文件\n\
  - 安全建议\n\n## 目标\n\n本章将阐述如何在 `ASP.NET Core` 中处理请求。设计的设计是理解 `ASP.NET Core` 运行机制全景最重要的部分。接下来，章节介绍了如何在\
  \ `Blazor` 中提供静态文件或动态文件。静态文件只是保存在本地硬盘上的静态资产，而动态文件需要在运行时生成。讨论还将触及一些基本的安全规则，以便在向客户端提供文件时保护服务器免受攻击。\n\
  \n## 中间件\n\n在 `Blazor Server` 中，可以选择 `ASP.NET Core` 提供的静态文件中间件为用户提供静态文件。中间件是引入 `ASP.NET\
  \ Core` 的一个新概念。它是一个管道系统，类似于制造工厂中的流水线。来自客户端的所有请求都将输入这个管道系统。每个中间件作为流水线上的工人，创建、删除或修改请求和响应。与流水线不同，中间件管道不仅将传入的请求传递给下一个中间件，而且在到达管道系统的最后一个中间件时，还将响应返回给上一个。此外，每个中间件可以自己决定是否将请求传递给下一个中间件。而在工厂中，工人通常无法控制由谁来处理产品，或者产品在流水线上流向何处。图\
  \ 6.1 显示了中间件系统中的请求工作流：\n\n![](img/pg_112.jpg)\n\n图 6.1 `ASP.NET Core` 中间件系统。\n\n\
  `ASP.NET Core` 带有许多默认中间件，例如静态文件中间件。其他常见的中间件包括 `Redirection`、`routing`、`authentication`、`authorization`\
  \ 等等。甚至是 API 控制器也是通过中间件实现的。所有中间件都遵循图 6.1 所示的相同处理规则。这些中间件共同成了健壮的 `ASP.NET Core` 应用程序。\n\
  \n为了学习更多关于中间件的信息，章节从实现其中一个开始。首先，用户需要基于 `Blazor Server` 创建另一个 `EShop` 项目，并将带有 `Blazor\
  \ WebAssembly` 的 `EShop` 移动到名为 `WebAssembly` 的子文件夹。同时，用户应该创建另一个子文件夹 `Server`，它将包含\
  \ `Blazor Server` 模式下的 `EShop` 代码。要创建一个 `Blazor Server` `EShop`，将目录更改到 `Server`\
  \ 文件夹并运行命令 `dotnet new blazorserver -n EShop.Server -o .`。代码结构将如下所示：\n\n```text\n\
  EShop\n├───EShop.sln\n└───.gitignore\n└───.vscode\n└───EShop.Server\n├───Pages\n\
  ├───Shared\n├───wwwroot\n├───EShop.Server.csproj\n└───other folders and files\n\
  └───EShop.WebAssembly\n├───Pages\n├───Shared\n├───wwwroot\n├───EShop.WebAssembly.csproj\n\
  └───other folders and files\n```\n\n中间件可以通过两种方式实现。第一种且最简单的方法是编写内联中间件。如果用户想要记录来自客户端的每个请求，他们可以轻松地使用内联中间件来实现。用户可以在\
  \ `EShop.Server` 项目的 `Program.cs` 文件中添加内联中间件来记录每个请求：\n\n```csharp\nusing EShop.Server.Data;\n\
  \nvar builder = WebApplication.CreateBuilder(args);\n\n// 将服务添加到容器\n\nbuilder.Services.AddRazorPages();\n\
  \nbuilder.Services.AddServerSideBlazor();\n\nbuilder.Services.AddSingleton<WeatherForecastService>();\n\
  \nvar app = builder.Build();\n\n// 配置 HTTP 请求管道\n\napp.Use(async (context, next)\
  \ =>\n{\n    string log = $\"{context.Request.Scheme}://{context.Request.Host}{context.Request.Path}\"\
  ;\n    Console.WriteLine($\"client requests: {log}\");\n    await next.Invoke();\n\
  });\n\nif (!app.Environment.IsDevelopment())\n{\n    app.UseExceptionHandler(\"\
  /Error\");\n    // 默认 HSTS 值为三十天。在生产场景中可能需要更改此。（参见 https://aka.ms/aspnetcore-hsts.）\n\
  \    app.UseHsts();\n}\n\napp.UseHttpsRedirection();\n\napp.UseStaticFiles();\n\n\
  app.UseRouting();\n\napp.MapBlazorHub();\n\napp.MapFallbackToPage(\"/_Host\");\n\
  \napp.Run();\n```\n\n在前面的代码中，调用了 `Use` 扩展方法。该方法用于向管道系统添加内联中间件委托，用户向该方法传递委托。委托有两个参数。第一个是\
  \ `HttpContext` 类型的上下文，它包含了与请求相关的响应信息。另一个参数被称为 `next`，它是管道系统中将执行的下一个委托。它实际上指向下一个中间件。所有的中间件都像链表一样连接起来，然而这个链是双向的，意味着请求正在进入并传出。\n\
  \n在调试控制台中打印客户端请求的 URL。如图 6.2 所示，客户端首先通过 `http` 方案访问应用程序，并被重定向到端口 5001 使用更安全的 `https`\
  \ 。得益于 `UseHttpsRedirection()`，它添加了一个将 http 请求重定向到 https 的中间件，并强制客户端在访问 `EShop`\
  \ 应用程序时使用 https。之后，所有所需的静态文件和 `Blazor` 组件都加载了。\n\n![](img/pg_115.jpg)\n\n图 6.2 内联日志中间件。\n\
  \n\n\n\n如果用户有更复杂的中间件，他们可能想要一个专用类来作为流水线系统中的中间件。事实上，`aspnet core` 框架并没有提供这样的中间件基类，只要类满足两个要求即可。第一个是一个公共构造函数，其第一个参数的类型为\
  \ `RequestDelegate`。第二个是一个公共的 `Invoke` 或 `InvokeAsync` 方法，其第一个参数的类型为 `HttpContext`。例如，可以将日志逻辑移动到类中，如下代码所示：\n\
  \n```csharp\nnamespace EShop.Server;\n\npublic class LoggerMiddleware\n{\n    private\
  \ readonly RequestDelegate _next;\n\n    public LoggerMiddleware(RequestDelegate\
  \ next)\n    {\n        _next = next;\n    }\n\n    public async Task Invoke(HttpContext\
  \ context)\n    {\n        string log = $\"{context.Request.Scheme}://{context.Request.Host.Value}{context.Request.Path.Value}\"\
  ;\n        Console.WriteLine($\"client requests: {log}\");\n        await context.Response.WriteAsync(\"\
  hello world!\");\n    }\n}\n```\n\n前面的代码展示了 `LoggerMiddleware` 的示例。构造函数或 `Invoke`\
  \ 方法可能会有更多参数，但他们应该确保 `RequestDelegate` 或 `HttpContext` 放在前面。在此次中间件类中，用户没有调用 `next.Invoke()`\
  \ 来短路后面的后续中间件。通过这种方式，用户反转了请求处理方向并开始组合返回给客户端的响应。`LoggerMiddleware` 之前的中间件可以在认为必要时选择修改响应。最后，客户端将从处理请求的第一个中间件接收到响应。\n\
  \n要将此类中间件添加到流水线系统，用户可以在 `Program.cs` 中调用 `UseMiddleware` 扩展方法。它将把中间件注册到流水线中。注意，中间件注册的顺序非常重要，因为如果某个中间件选择短路请求，则注册在它之后的所有中间件将被被忽略，且不会处理请求：\n\
  \n```csharp\nusing EShop.Server;\nusing EShop.Server.Data;\n\nvar builder = WebApplication.CreateBuilder(args);\n\
  \n// 向容器添加服务。\nbuilder.Services.AddRazorPages();\nbuilder.Services.AddServerSideBlazor();\n\
  builder.Services.AddSingleton<WeatherForecastService>();\n\nvar app = builder.Build();\n\
  app.UseMiddleware<LoggerMiddleware>();\n\n// 配置 HTTP 请求流水线。\nif (!app.Environment.IsDevelopment())\n\
  {\n    app.UseExceptionHandler(\"/Error\");\n    // 默认的 HSTS 值为三十天。用户可能在生产场景下想要更改，请参见\
  \ https://aka.ms/aspnetcore-hsts。\n    app.UseHsts();\n}\n\napp.UseHttpsRedirection();\n\
  app.UseStaticFiles();\napp.UseRouting();\napp.MapBlazorHub();\napp.MapFallbackToPage(\"\
  /_Host\");\napp.Run();\n```\n\n![](img/pg_118.jpg)\n图 6.3 中间件短路。\n\n图 6.3 是用户浏览\
  \ `http://localhost:5000` 时应用程序的截图。由于 `LoggerMiddleware` 短路了请求流水线，这次将不会显示带有左侧菜单的熟悉的\
  \ Blazor App 主页。相反，`LoggerMiddleware` 返回了一个简单的纯文本响应。\n\n将 `LoggerMiddleware` 的注册移动到之后：\n\
  \n```csharp\n// 一其他代码\nvar app = builder.Build();\n\n// 配置 HTTP 请求流水线。\nif (!app.Environment.IsDevelopment())\n\
  {\n    app.UseExceptionHandler(\"/Error\");\n    // 默认的 HSTS 值为三十天。用户可能在生产场景下想要更改，请参见\
  \ https://aka.ms/aspnetcore-hsts。\n    app.UseHsts();\n}\n\napp.UseHttpsRedirection();\n\
  app.UseMiddleware<LoggerMiddleware>();\napp.UseStaticFiles();\n// 一其他代码\n```\n\n\
  ![](img/pg_119.jpg)\n图 6.4 重新排序 LoggerMiddleware。\n\n由于 `LoggerMiddleware` 在 `HttpsRedirection`\
  \ 之后，当用户访问 `http://localhost:5000` 时，他们会被重定向到对应的 https 服务端点 `https://localhost:5001`。\n\
  \n## 提供静态文件\n\n默认情况下，当创建一个新的 Blazor Server 或 Blazor WebAssembly 时，支持提供静态文件。由于剩余的中间件被短路，允许请求向下移动流水线系统。更新\
  \ `LoggerMiddleware.cs` 以移除短路：\n\n```csharp\nnamespace EShop.Server;\n\npublic class\
  \ LoggerMiddleware\n{\n    private readonly RequestDelegate _next;\n\n    public\
  \ LoggerMiddleware(RequestDelegate next)\n    {\n        _next = next;\n    }\n\n\
  \    public async Task Invoke(HttpContext context)\n    {\n        string log =\
  \ $\"{context.Request.Scheme}://{context.Request.Host.Value}{context.Request.Path.Value}\"\
  ;\n        Console.WriteLine($\"client requests: {log}\");\n        // await context.Response.WriteAsync(\"\
  hello world!\");\n        await _next.Invoke(context);\n    }\n}\n```\n\n调用 `RequestDelegate`\
  \ 上的 `Invoke` 方法将请求传递给下一个中间件：\n\n这是一个静态文件。在 `wwwroot` 文件夹下添加一个文本文件 `hello.txt` 并带有上述内容。`wwwroot`\
  \ 下的所有文件将被提供，你可能已经发现所有的 CSS 文件也放置在此文件夹下：\n\n![](img/pg_120.jpg)\n图 6.5 在 wwwroot\
  \ 下提供文件。\n\n启动服务器并访问 `https://localhost:5001/hello.txt`，`wwwroot` 下的所有文件将被提供，你可能已经发现所有的\
  \ CSS 文件也放置在此文件夹下：\n\n![](img/pg_120.jpg)\n图 6.5 在 wwwroot 下提供文件。\n\n由于 `LoggerMiddleware`\
  \ 在 `HttpsRedirection` 之后，当用户访问 `http://localhost:5000` 时，他们会被重定向到对应的 https 服务端点\
  \ `https://localhost:5001`。\n\n## 提供静态文件\n\n默认情况下，当创建一个新的 Blazor Server 或 Blazor\
  \ WebAssembly 时，支持提供静态文件。由于剩余的中间件被短路，允许请求向下移动流水线系统。更新 `LoggerMiddleware.cs` 以移除短路：\n\
  \n```csharp\nnamespace EShop.Server;\n\npublic class LoggerMiddleware\n{\n    private\
  \ readonly RequestDelegate _next;\n\n    public LoggerMiddleware(RequestDelegate\
  \ next)\n    {\n        _next = next;\n    }\n\n    public async Task Invoke(HttpContext\
  \ context)\n    {\n        string log = $\"{context.Request.Scheme}://{context.Request.Host.Value}{context.Request.Path.Value}\"\
  ;\n        Console.WriteLine($\"client requests: {log}\");\n        // await context.Response.WriteAsync(\"\
  hello world!\");\n        await _next.Invoke(context);\n    }\n}\n```\n\n调用 `RequestDelegate`\
  \ 上的 `Invoke` 方法将请求传递给下一个中间件：\n\n这是一个静态文件。在 `wwwroot` 文件夹下添加一个文本文件 `hello.txt` 并带有上述内容。`wwwroot`\
  \ 下的所有文件将被提供，你可能已经发现所有的 CSS 文件也放置在此文件夹下：\n\n![](img/pg_120.jpg)\n图 6.5 在 wwwroot\
  \ 下提供文件。\n\n启动服务器并访问 `https://localhost:5001/hello.txt`，`wwwroot` 下的所有文件将被提供，你可能已经发现所有的\
  \ CSS 文件也放置在此文件夹下：\n\n![](img/pg_120.jpg)\n图 6.5 在 wwwroot 下提供文件。\n\n## 静态文件\n\n\
  状态，，，，会会找不到文件文件资源，并返回 404 状态码。要支持自定义目录下的文件，请在 `Program.cs` 中配置 `UseStaticFiles`\
  \ 中间件：\n\n```csharp\nusing EShop.Server;\nusing EShop.Server.Data;\nusing Microsoft.Extensions.FileProviders;\n\
  \nvar builder = WebApplication.CreateBuilder(args);\n\n// 向容器添加服务。\nbuilder.Services.AddRazorPages();\n\
  builder.Services.AddServerSideBlazor();\nbuilder.Services.AddSingleton<WeatherForecastService>();\n\
  \nvar app = builder.Build();\n\n// 配置 HTTP 请求流水线。\nif (!app.Environment.IsDevelopment())\n\
  {\n    app.UseExceptionHandler(\"/Error\");\n    // 默认的 HSTS 值为三十天。用户可能在生产场景下想要更改，请参见\
  \ https://aka.ms/aspnetcore-hsts。\n    app.UseHsts();\n}\n\napp.UseHttpsRedirection();\n\
  app.UseMiddleware<LoggerMiddleware>();\napp.UseStaticFiles(new StaticFileOptions\n\
  {\n    FileProvider = new PhysicalFileProvider(Path.Combine(builder.Environment.ContentRootPath,\
  \ \"Assets\")),\n    RequestPath = \"/assets-url\"\n});\n\napp.UseRouting();\napp.MapBlazorHub();\n\
  app.MapFallbackToPage(\"/_Host\");\napp.Run();\n```\n\n在前面的代码中，出现了静态文件中间件 `StaticFileOptions`。它告诉中间件静态文件放置在哪里以及客户端如何请求它们。`PhysicalFileProvider`\
  \ 中的第一个 `assets` 字符串标识了文件的物理路径。分配给 `RequestPath` 的第二个 `assets` 字符串代表用户导航到获取文件的 URL\
  \ 路径。在示例中，用户将调用 `https://localhost:5001/assets-url/Logo_Square.png` 来获取位于 `Assets`\
  \ 文件夹下的图标：\n\n![](img/pg_122.jpg)\n图 6.6 在另一个目录下提供文件。\n\n现在用户可以将文件放置在任何所需的文件夹下了。需要注意的是，如果他们浏览主页，会发现这是一个纯文本页面，没有颜色、字体大小和样式。这是因为将静态文件目录从\
  \ `wwwroot` 移动到 `Assets`，意味着 Web 应用程序无法在 Assets 文件夹下找到那些 CSS 和 JavaScript 文件了，但是这很容易修复：\n\
  \n![](img/pg_123.jpg)\n图 6.7 缺少 CSS 和 JavaScript 文件。\n\n留出默认的 `UseStaticFiles` 方法，并在下一行再次调用它并使用自定义的文件目录。通过这种方式，人们可以根据自己的喜好提供许多目录中的任何一个。\n\
  \n## 提供动态文件\n\n\n\n\n\n在上一节中，我们讨论了如何向客户提供静态文件。静态文件是指不会改变的文件，例如网站 Logo 或网站的许可声明。当客户需要一份上个月的统计报告时，开发者无法提前准备此类文件并将其存放在特定目录下。这些是动态文件，它们仅在被请求时生成，或者会随着时间的推移而变化。为了提供动态文件，用户需要\
  \ JavaScript 的帮助。在 `/wwwroot` 文件夹下添加新的 `eshop.js` 文件，代码如下：\n\n```javascript\nfunction\
  \ download() {\nconst current = new Date();\nconst day = current.getDate()\nconst\
  \ month = current.getMonth() + 1\nconst year = current.getFullYear()\nconst time\
  \ = year + \"/\" + month + \"/\" + day + \" \" + current.getHours() + \":\" + current.getMinutes()\
  \ + \":\" + current.getSeconds();\nconst data = 'hello world!' + \"\\n\" + time;\n\
  const blob = new Blob([data]);\nconst url = URL.createObjectURL(blob);\nconst anchorElement\
  \ = document.createElement('a');\nanchorElement.href = url;\nanchorElement.download\
  \ = 'hello.txt';\nanchorElement.click();\nanchorElement.remove();\nURL.revokeObjectURL(url);\n\
  }\n```\n\n在 `download` 函数中，用户首先从 `Date` 对象获取当前的日期和时间。然后结合“hello world!”，每当客户端请求此文档时，他们都可以根据当前时间生成内容。该函数的其余部分创建一个锚点元素，它将导航到\
  \ `URL` 并通过 `Blob` 对象表示文件数据。最后，用户调用锚点元素上的 `click` 事件，从 DOM 中移除该元素，并撤销 `URL`，这样浏览器将不再保留引用：\n\
  \n```html\n<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\"\
  \ />\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0, maximum-scale=1.0,\
  \ user-scalable=no\" />\n<title>EShop.WebAssembly</title>\n<base href=\"/\" />\n\
  <link href=\"css/bootstrap/bootstrap.min.css\" rel=\"stylesheet\" />\n<link href=\"\
  css/app.css\" rel=\"stylesheet\" />\n<link href=\"EShop.WebAssembly.styles.css\"\
  \ rel=\"stylesheet\" />\n</head>\n<body>\n<div id=\"app\">Loading...</div\n<div\
  \ id=\"blazor-error-ui\">\nAn unhandled error has occurred.\n<a href=\"\" class=\"\
  reload\">Reload</a>\n<a class=\"dismiss\">\U0001F5D9</a>\n</div>\n<script src=\"\
  _framework/blazor.webassembly.js\"></script>\n<script src=\"eshop.js\"></script>\n\
  </body>\n</html>\n```\n\n接下来，在 `index.html` 中全局引用此 JavaScript 文件，以便 EShop 应用程序中的每个页面都可以像用户在在任何\
  \ JavaScript 项目中通常做的那样调用此 `download` 函数：\n\n```razor\n@page \"/shop-item\"\n@using\
  \ EShop.WebAssembly.Shared;\n<div class=\"ItemContainer\">\n<h1>@Item.Name</h1>\n\
  <h5>$ @Item.Price</h5>\n<p>@Item.Description</p>\n</div>\n```\n\n```razor\n<div\
  \ class=\"ItemContainer\">\n<h1>@Item.Name</h1>\n<h5>$ @Item.Price</h5>\n<p>@Item.Description</p>\n\
  </div>\n```\n\n```razor\n<div class=\"ItemDisplay\">\n<img src=\"@Item.ImageUrl\"\
  \ />\n<div class=\"NewComment\">\n<input type=\"text\" @bind=\"Comment\" OnChange=\"\
  UploadFile\" />\n<button class=\"btn btn-primary\" @onclick=\"AddComment\">Add</button>\n\
  </div>\n```\n\n```razor\n<div>\n<h4>Comments</h4>\n@foreach(var comment in Comments)\n\
  {\n<InputText Value=\"@comment\" />\n</div\n```\n\n```razor\n在 `Item.razor` 页面上，添加\
  \ `CommentModel`：\n\n```razor\n<EditForm Model=\"Model\">\n```\n\n\n\n\n<span class=\"\
  oi oi-home\" aria-hidden=\"true\"></</span> 首页\n\n</NavLink>\n</div\n\n<div class=\"\
  nav-item px-3\">\n  <NavLink class=\"nav-link\" href=\"counter\">\n    <span class=\"\
  oi oi-plus\" aria-hidden=\"true\"></span> 计数器\n  </NavLink>\n</div>\n\n<div class=\"\
  nav-item px-3\">\n  <NavLink class=\"nav-link\" href=\"fetchdata\">\n    <span class=\"\
  oi oi-list-rich\" aria-hidden=\"true\"></span>\n    获取数据\n  </NavLink>\n</div>\n\
  \n<div class=\"nav-item px-3\">\n  <NavLink class=\"nav-link\" href=\"cart\">\n\
  \    <span class=\"oi oi-list-rich\" aria-hidden=\"true\"></span> 购物车\n  </NavLink>\n\
  </div>\n\n<div class=\"nav-item px-3\">\n  <NavLink class=\"nav-link\" href=\"shop-item\"\
  >\n    <span class=\"oi oi-list-rich\" aria-hidden=\"true\"></span> ShopItem\n \
  \ </NavLink>\n</div>\n\n<div class=\"nav-item px-3\">\n  <NavLink class=\"nav-link\"\
  \ href=\"request-item\">\n    <span class=\"oi oi-list-rich\" aria-hidden=\"true\"\
  ></span> RequestItem\n  </NavLink>\n</div>\n</nav>\n\n@* some code *@\n\n已添加另一个导航到\
  \ request-item 表单页面的 `<div>` 元素。使用原生 `<form>` 元素完成新页面 `RequestItem.razor`：\n\n```razor\n\
  @page \"/request-item\"\n\n<PageTitle>请求项目</PageTitle>\n\n<h2>如果您没有找到所需的物品，请在下方填写请求表单。</h2>\n\
  \n<h2>原生表单元素</h2>\n\n<form>\n  <div>\n    <label for=\"item\">项目: </label>\n   \
  \ <input type='text' name='item' id='item' required>\n  </div>\n  <div>\n    <label\
  \ for=\"size\">尺寸: </label>\n    <select name=\"size\" id='size'>\n      <option\
  \ value=\"s\">小号</option>\n      <option value=\"m\">中号</option>\n      <option\
  \ value=\"l\">大号</option>\n    </select>\n  </div>\n  <div>\n    <label for=\"count\"\
  >数量: </label>\n    <input type='number' name='count' id='count' required min=\"\
  1\" max=\"10\">\n  </div>\n  <div>\n    <input type='submit' />\n  </div>\n</form>\n\
  ```\n\n这里使用了一个简单的、未自定义的表单。这足以演示原生 `<form>` 元素提供的核心功能。例如，某些字段被标记为必填，如果这些字段为空，表单将不会提交。添加\
  \ `min` 和 `max` 验证以确保数量值在 1 到 10 之间。请参考图 7.1。\n\n![](img/pg_133.jpg)\n\n图 7.1 原生\
  \ HTML 表单。\n\n接下来，将表单与 Blazor 框架自带的 `EditForm` 组件生成的表单进行比较。\n\n## EditForm\n\n`EditForm`\
  \ 的源代码位于 `https://github.com/dotnet/dotnet/blob/main/src/aspnetcore/src/Components/Web/src/Forms/EditForm.cs`，我们在这里展示其中一些最重要的部分：\n\
  \n```csharp\npublic class EditForm : ComponentBase\n{\n  private EditContext? _editContext;\n\
  \n  [Parameter]\n  public EditContext? EditContext\n  {\n    get => _editContext;\n\
  \    set\n    {\n      _editContext = value;\n      _hasSetEditContextExplicitly\
  \ = value != null;\n    }\n  }\n\n  [Parameter] public object? Model { get; set;\
  \ }\n  [Parameter] public EventCallback<EditContext> OnSubmit\n  {\n    get; set;\n\
  \  }\n  [Parameter] public EventCallback<EditContext> OnValidSubmit { get; set;\
  \ }\n  [Parameter] public EventCallback<EditContext> OnInvalidSubmit { get; set;\
  \ }\n\n  protected override void OnParametersSet()\n  {\n    if (Model != null &&\
  \ Model != _editContext?.Model)\n    {\n      _editContext = new EditContext(Model!);\n\
  \    }\n  }\n\n  protected override void BuildRenderTree(RenderTreeBuilder builder)\n\
  \  {\n    Debug.Assert(_editContext != null);\n    builder.OpenRegion(_editContext.GetHashCode());\n\
  \    builder.OpenElement(0, \"form\");\n    builder.AddMultipleAttributes(1, AdditionalAttributes);\n\
  \    builder.AddAttribute(2, \"onsubmit\", HandleSubmit);\n    builder.OpenComponent<CascadingValue>(3);\n\
  \    builder.AddAttribute(4, \"Is\", true);\n    builder.AddAttribute(5, \"Value\"\
  , _editContext);\n    builder.AddAttribute(6, \"ChildContent\", ChildContent);\n\
  \    builder.CloseComponent();\n    builder.CloseElement();\n    builder.CloseRegion();\n\
  \  }\n\n  private async Task HandleSubmit()\n  {\n    Debug.Assert(_editContext\
  \ != null);\n    if (OnSubmit)\n    {\n      await OnSubmit.InvokeAsync(_editContext);\n\
  \    }\n    if (_editContext.Validate())\n    {\n      if (OnValidSubmit)\n    \
  \  {\n        await OnValidSubmit.InvokeAsync(_editContext);\n      }\n    }\n \
  \   else\n    {\n      if (OnInvalidSubmit)\n      {\n        await OnInvalidSubmit.InvokeAsync(_editContext);\n\
  \      }\n    }\n  }\n}\n```\n\n首先了解到 `EditForm` 继承自 `ComponentBase`。通常情况下，建议使用\
  \ `EditForm`，因为它比原生 `<form>` 元素提供了更多功能。\n\n\n\n\n\n`InputSelect` 组件用于为应用程序用户提供几个选项。在\
  \ EShop 示例中，人们使用此组件选择他们所需的衣物尺寸。这里编写的代码并没有遵循最佳实践设计原则。一旦需要扩展尺寸选项，枚举（enumeration）代码以及带有\
  \ `InputSelect` 组件的表单页面都必须进行修改。当用户面对复杂功能时，很有可能会漏掉其中的某处修改。这正是不一致性产生的地方。\n\n为了解决这个问题，用户可以构建一个继承自\
  \ `InputBase<TValue>` 的自定义组件，它只需要使用的枚举类型，然后它将自动显示该枚举类型中的所有可用选项。\n\n在 `Components`\
  \ 文件夹下创建一个名为 `InputEnum.cs` 的文件：\n\n```csharp\nusing System.Diagnostics.CodeAnalysis;\n\
  using System.Globalization;\nusing Microsoft.AspNetCore.Components;\nusing Microsoft.AspNetCore.Components.Forms;\n\
  using Microsoft.AspNetCore.Components.Rendering;\n\nnamespace EShop.WebAssembly.Components;\n\
  \npublic class InputEnum<Tenum> : InputBase<Tenum>\n{\n    protected override bool\
  \ TryParseValueFromString(string? Value, [MaybeNullWhen(false)] out Tenum result,\
  \ [NotNullWhen(false)] out string? validationErrorMessage)\n    {\n        if (string.IsNullOrWhiteSpace(value))\n\
  \        {\n            result = default;\n            validationErrorMessage =\
  \ $\"{nameof(value)} cannot be null\";\n            return false;\n        }\n\n\
  \        if (Enum.TryParse(typeof(Tenum), value, out object convertedEnum))\n  \
  \      {\n            result = (Tenum)convertedEnum!; validationErrorMessage = null;\n\
  \            return true;\n        }\n        result = default;\n        validationErrorMessage\
  \ = $\"{nameof(value)} is not valid\";\n        return false;\n    }\n\n    protected\
  \ override void BuildRenderTree(RenderTreeBuilder builder)\n    {\n        builder.OpenElement(0,\
  \ \"select\");\n        builder.AddMultipleAttributes(1, AdditionalAttributes);\
  \ \n        builder.AddAttribute(2, \"onchange\", EventCallback.Factory.CreateBinder<string>(this,\
  \ value => CurrentValueAsString = value, CurrentValueAsString, null));\n       \
  \ // 为每个枚举值添加一个 option 元素\n        foreach (var value in Enum.GetValues(typeof(Tenum)))\n\
  \        {\n            builder.OpenElement(3, \"option\");\n            builder.AddAttribute(4,\
  \ \"value\", value.ToString());\n            builder.AddContent(5, value.ToString());\n\
  \            builder.CloseElement();\n        }\n        builder.CloseElement();\
  \ // 关闭 select 元素\n    }\n}\n```\n\n首先，重写抽象方法 `TryParseValueFromString`，它将输入值解析为枚举实例。接下来，同样重写\
  \ `BuildRenderTree` 方法以定义组件的渲染方式。这里 `InputEnum` 封装了原生的 `<select>` 元素。最后，`InputSelect`\
  \ 被替换为 `InputEnum`。这一次，它只需要绑定 `_requestItem.Size`。\n\n## 验证\n\n有时，在将数据提交到服务器之前，需要验证用户的输入，就像使用原生\
  \ `<form>` 元素那样。`EditForm` 提供了一种简单的验证方法，下面将探索如何使用 `EditForm` 验证相同的标准：\n\n```html\n\
  <EditForm Model=\"@_requestItem\">\n    <DataAnnotationsValidator />\n    <p>\n\
  \        <label>\n            Item:\n            <InputText id=\"editform-item\"\
  \ @bind-Value=\"_requestItem.EShopItemName\" />\n        </label>\n    </p>\n  \
  \  <p>\n        <label>\n            Size:\n            <InputEnum @bind-Value=\"\
  _requestItem.Size\" />\n        </label>\n    </p>\n    <p>\n        <label>\n \
  \           Count:\n            <InputNumber id=\"editform-count\" @bind-Value=\"\
  _requestItem.Count\" />\n        </label>\n    </p>\n    <button type=\"submit\"\
  >Submit</button>\n</EditForm>\n```\n\n首先，在此 `EditForm` 中添加一个 `DataAnnotationsValidator`。这个\
  \ `DataAnnotationsValidator` 也是一个组件，位于完全相同的命名空间 `Microsoft.AspNetCore.Components.Forms`\
  \ 下。它有一个由父级 `EditForm` 提供的级联参数 `EditContext`，并通过注入的 `IServiceProvider` 实例调用 `EditContext`\
  \ 上的 `EnableDataAnnotationsValidation` 方法来启用数据验证。\n\n这里是 `EditContextDataAnnotationsExtensions`\
  \ 的主体代码，它在 `EditContext` 上构建了几个扩展方法：\n\n```csharp\npublic static class EditContextDataAnnotationsExtensions\n\
  {\n    public static IDisposable EnableDataAnnotationsValidation(this EditContext\
  \ editContext, IServiceProvider serviceProvider)\n    {\n        return new DataAnnotationsEventSubscriptions(editContext,\
  \ serviceProvider);\n    }\n    // private class DataAnnotationsEventSubscriptions\n\
  }\n```\n\n此 `EnableDataAnnotationsValidation` 方法将创建一个私有的可释放 `DataAnnotationsEventSubscriptions`\
  \ 实例。该私有类 `DataAnnotationsEventSubscriptions` 的构造函数所示：\n\n```csharp\nprivate sealed\
  \ class DataAnnotationsEventSubscriptions : IDisposable\n{\n    private static readonly\
  \ ConcurrentDictionary<(Type ModelType, string FieldName), PropertyInfo?> _propertyInfoCache\
  \ = new();\n    private readonly EditContext _editContext;\n    private readonly\
  \ IServiceProvider? _serviceProvider; \n    private readonly ValidationMessageStore\
  \ _messages;\n\n    public DataAnnotationsEventSubscriptions(EditContext editContext,\
  \ IServiceProvider serviceProvider)\n    {\n        _editContext = editContext ??\
  \ throw new ArgumentNullException(nameof(editContext));\n        _serviceProvider\
  \ = serviceProvider;\n        _messages = new ValidationMessageStore(_editContext);\n\
  \        _editContext.OnFieldChanged += OnFieldChanged;\n        _editContext.OnValidationRequested\
  \ += OnValidationRequested;\n    }\n}\n```\n\n在构造函数中，`EditContext` 订阅了 `OnFieldChanged`\
  \ 和 `OnValidationRequested` 事件：\n\n```csharp\nprivate void OnFieldChanged(object?\
  \ sender, FieldChangedEventArgs eventArgs)\n{\n    var fieldIdentifier = eventArgs.FieldIdentifier;\n\
  \    if (GetValidatableProperty(fieldIdentifier, out var propertyInfo))\n    {\n\
  \        var propertyValue = propertyInfo.GetValue(fieldIdentifier.Model);\n   \
  \     var validationContext = new ValidationContext(fieldIdentifier.Model, _serviceProvider,\
  \ null)\n        {\n            MemberName = propertyInfo.Name\n        };\n   \
  \     var results = new List<ValidationResult>();\n        Validator.TryValidateProperty(propertyValue,\
  \ validationContext, results);\n        _messages.Clear(fieldIdentifier);\n    \
  \    foreach (var result in results)\n        {\n            _messages.Add(fieldIdentifier,\
  \ result.ErrorMessage!);\n        }\n    }\n    }\n}\n```\n\n在之前所示的 `OnFieldChanged`\
  \ 方法中，通过 `fieldIdentifier` 获取属性并调用 `Validator` 的 `TryValidateProperty` 方法来验证属性。如果发现任何违规项，将相应的结果添加到消息列表中，并调用\
  \ `EditContext` 上的 `NotifyStateChanged` 方法。\n\n同样，当 `OnValidationRequested` 被触发时，调用\
  \ `TryValidateObject` 方法验证 `EditContext` 实例的 `Model`，如果生成了任何错误，将将其存储，并通过调用 `EditContext`\
  \ 上的 `NotifyStateChanged` 方法通知它：\n\n```csharp\nprivate void OnValidationRequested(object?\
  \ sender, ValidationRequestedEventArgs e)\n{\n    var validationContext = new ValidationContext(_editContext.Model,\
  \ _serviceProvider, null);\n    var validationResults = new List<ValidationResult>();\n\
  \    Validator.TryValidateObject(_editContext.Model, validationContext, validationResults,\
  \ true);\n    _messages.Clear();\n    foreach (var validationResult in validationResults)\n\
  \    {\n        if (validationResult == null)\n        {\n            continue;\n\
  \        }\n        var hasMemberNames = false;\n        foreach (var memberName\
  \ in validationResult.MemberNames)\n        {\n            hasMemberNames = true;\n\
  \            _messages.Add(_editContext.Field(memberName), validationResult.ErrorMessage!);\n\
  \        }\n        if (!hasMemberNames)\n        {\n            _messages.Add(new\
  \ FieldIdentifier(_editContext.Model, fieldName: string.Empty), validationResult.ErrorMessage!);\n\
  \        }\n    }\n    _editContext.NotifyStateChanged();\n}\n```\n\n读者现在应该理解 `EditForm`\
  \ 如何使用 `ValidationAttribute` 验证数据。接下来，使用原生 `<form>` 元素的相同规则验证客户数据。首先，为 `RequestItem`\
  \ 模型类添加属性：\n\n```csharp\npublic class RequestItem\n{\n    [Required]\n    public\
  \ string EShopItemName { get; set; }\n}\n```\n\n\n\n\n\n```csharp\npublic RequestItemSize\
  \ Size { get; set; }\n\n[Required]\n\n[Range(1, 10)]\n\npublic int Count { get;\
  \ set; } = 1;\n\n}\n```\n\n运行应用程序，填入一些无效数据并点击提交（Submit）按钮，输入框框将变为红色。参考图 7.3。\n\n\
  ![](img/pg_147.jpg)\n\n图 7.3 使用 ValidateAttribute 验证数据。\n\n为了帮助客户理解为什么数据验证失败，使用\
  \ `ValidationSummary` 组件更新 `EditForm`：\n\n```html\n<EditForm Model=\"@_requestItem\"\
  >\n<DataAnnotationsValidator />\n<ValidationSummary />\n<p>\n<label>\nItem:\n<InputText\
  \ id=\"editform-item\" @bind-Value=\"_requestItem.EShopItemName\" />\n</label>\n\
  </p>\n<p>\n<label>\nSize:\n<InputEnum @bind-Value=\"_requestItem.Size\" />\n</label>\n\
  </p>\n<p>\n<label>\nCount:\n<InputNumber id=\"editform-count\" @bind-Value=\"_requestItem.Count\"\
  \ />\n</label>\n</p>\n<button type=\"submit\">Submit</button>\n</EditForm>\n```\n\
  \n参考图 7.4。\n\n![](img/pg_148.jpg)\n\n图 7.4 ValidationSummary。\n\n此摘要的位置和内容都可以轻松自定义。例如，将\
  \ `ValidationSummary` 组件放在提交按钮下方。重新编译并运行，摘要消息将显示在按钮下方，如图 7.5 所示。\n\n![](img/pg_149-1.jpg)\n\
  \n图 7.5 将 ValidationSummary 移动到提交按钮下方。\n\n用户也可以在每个输入字段下方分别显示消息。在这种情况下，使用 `ValidationMessage`\
  \ 组件。参考图 7.6。\n\n![](img/pg_149-2.jpg)\n\n图 7.6 每个字段的 ValidationMessage。\n\n自定义验证消息也非常简单。用户只需要做的就是给\
  \ `ErrorMessage` 参数提供一个字符串内容：\n\n```csharp\npublic class RequestItem\n{\n[Required(ErrorMessage\
  \ = \"请填写项目名称.\")] public string EShopItemName { get; set; }\npublic RequestItemSize\
  \ Size { get; set; }\n[Required(ErrorMessage = \"请填写项目数量.\")] [Range(1, 10, ErrorMessage=\
  \ \"您请求的项目不能超过 10 个。\")] public int Count { get; set; } = 1;\n\n}\n```\n\n再次编译并运行，它将显示新的验证消息。参考图\
  \ 7.7。\n\n![](img/pg_150.jpg)\n\n图 7.7 自定义的验证消息。\n\n## 自定义验证\n\n数据注解可能满足大多数场景的需求，但在某些复杂情况下，开发者寻求一种更自定义的方式来在客户端和服务器端验证用户的数据。自定义验证组件可以帮助在多个阶段验证多个表单。\n\
  \n首先，在 `EShop.WebAssembly` 项目的 `Components` 文件夹下创建一个自定义组件 `RequestItemValidator.cs`：\n\
  \n```csharp\nusing Microsoft.AspNetCore.Components;\nusing Microsoft.AspNetCore.Components.Forms;\n\
  namespace EShop.WebAssembly.Components;\n\npublic class ValidationMessage\n{\npublic\
  \ string Field { get; }\npublic string Message { get; }\npublic ValidationMessage(string\
  \ field, string message)\n{\nField = field;\nMessage = message;\n}\n}\n\npublic\
  \ class RequestItemValidator : ComponentBase\n{\nprivate ValidationMessageStore\
  \ _validationMessageStore;\n[CascadingParameter]\nprivate EditContext EditContext\
  \ { get; set; }\nprotected override void OnInitialized()\n{\nbase.OnInitialized();\n\
  _validationMessageStore = new ValidationMessageStore(EditContext);\nEditContext.OnValidationRequested\
  \ += (_, _) => _validationMessageStore.Clear();\nEditContext.OnFieldChanged += (_,\
  \ e) => _validationMessageStore.Clear(e.FieldIdentifier);\n}\n\npublic void Show(IEnumerable<ValidationMessage>\
  \ validationMessages)\n{\nforeach (var item in validationMessages)\n{\n_validationMessageStore.Add(EditContext.Field(item.Field),\
  \ item.Message);\n}\nEditContext.NotifyValidationStateChanged();\n}\n\npublic void\
  \ Clear()\n{\n_validationMessageStore.Clear();\nEditContext.NotifyValidationStateChanged();\n\
  }\n}\n```\n\n在此处创建一个 `ValidationMessage` 类作为验证字段和消息的容器。`RequestItemValidator` 是另一个继承自\
  \ `ComponentBase` 的组件。它必须有一个类型为 `EditContext` 的级联参数，以便用户可以管理验证。然后用户使用级联的 `EditContext`\
  \ 初始化 `ValidationMessageStore`，并在每次字段更改或请求验证时清除消息。\n\n使用此验证器器，将其添加到 `RequestItem`\
  \ 页面上的 `EditForm` 中：\n\n```html\n<EditForm Model=\"@_requestItem\" OnSubmit=\"@OnSubmit\"\
  >\n<RequestItemValidator @ref=\"_validator\" />\n<p>\n<label>\nItem:\n<InputText\
  \ id=\"editform-item\" @bind-Value=\"_requestItem.EShopItemName\" />\n</label>\n\
  </p>\n<p>\n<label>\nSize:\n<InputEnum @bind-Value=\"_requestItem.Size\" />\n</label>\n\
  </p>\n<p>\n<label>\nCount:\n<InputNumber id=\"editform-count\" @bind-Value=\"_requestItem.Count\"\
  \ />\n</label>\n</p>\n<button type=\"submit\">Submit</button>\n</EditForm>\n```\n\
  \n将默认验证器替换为 `RequestItemValidator` 并在相应的代码中引用它：\n\n```csharp\nusing EShop.WebAssembly.Components;\n\
  namespace EShop.WebAssembly.Pages;\n\npublic partial class RequestItem\n{\nprivate\
  \ Models.RequestItem _requestItem = new Models.RequestItem();\nprivate RequestItemValidator\
  \ _validator;\n\nprivate void OnSubmit()\n{\n_validator.Clear();\nvar messages =\
  \ new List<ValidationMessage>();\n// 验证逻辑\nif (_requestItem.Count < 1)\n{\nmessages.Add(new\
  \ ValidationMessage(nameof(_requestItem.Count), \"数量必须为正数\"));\n}\nif (messages.Count\
  \ > 0)\n{\n_validator.Show(messages);\nreturn;\n}\n// 提交到服务器\nvar random = new Random();\n\
  var passServerValidation = random.Next(2) >= 1;\nif (!passServerValidation)\n{\n\
  messages.Add(new ValidationMessage(nameof(_requestItem.EShopItemName), \"项目名称未通过服务器验证\"\
  ));\n}\n_validator.Show(messages);\n}\n}\n```\n\n在不同的阶段，例如在提交到服务器之前或之后，用户可以显示不同的错误。在点击提交按钮之前，用户可以在客户端进行验证。然后将数据发送到服务器，服务器返回响应或验证消息，以便用户显示这些消息。在示例中，使用\
  \ `Random` 实例表示服务器响应，如果随机数大于或等于一，说明服务器接受了请求。\n\n使用注解和自定义验证器应该涵盖用户遇到的大多数场景。\n\n##\
  \ 表单提交\n\n由于 `EditForm` 将渲染为原生的 `<form>` 元素，用户可以使用提交 `<button>` 或提交 `<input>` 提交表单。有三个事件委托可以附加以提交表单，它们是\
  \ `OnValidSubmit`、`OnInvalidSubmit` 和 `OnSubmit`。\n\n所有这些提交委托都带有 `EditContext` 实例调用。`OnValidSubmit`\
  \ 在验证通过且无错误时触发，而 `OnInvalidSubmit` 在验证失败时调用。`OnSubmit` 是一种更手动、更自定义的提交提交方式，开发者负责通过调用\
  \ `EditContext` 的 `Validate` 方法或在客户端或服务器端的任何方式进行验证来验证表单。\n\n请注意，在 `EditForm` 组件的源码中，它会检查在赋值\
  \ `OnSubmit` 的同时是否赋值了 `OnValidSubmit` 或 `OnInvalidSubmit`。如果是这样，将抛出异常：\n\n```csharp\n\
  if (OnSubmit.HasDelegate && (OnValidSubmit.HasDelegate || OnInvalidSubmit.HasDelegate))\n\
  {\nthrow new InvalidOperationException($\"When supplying an{nameof(OnSubmit)} parameter\
  \ to \" +\n$\"{nameof(EditForm)}, do not also supply \" +\n$nameof(OnValidSubmit)}\
  \ or {nameof(OnInvalidSubmit)}.\");\n}\n```\n\n## EDITCONTEXT 和表单状态\n\n\n\n\n\n\
  `EditContext` 是 `EditForm` 中一个核心属性。当用户将模型分配给 `EditForm` 时，示例中会有一个 `RequestItem`\
  \ 实例。`EditForm` 会在该模型上生成一个 `EditContext` 实例。每当模型被重新分配时，`EditContext` 实例都会随之更新。此\
  \ `EditContext` 是一个级联参数，会被 `EditForm` 的子组件持有，正如读者在之前的示例（如自定义输入组件和验证器）中所看到的。它充当了\
  \ `EditForm` 元数据容器容器。`EditContext` 持有任何字段是否被修改或是否发生验证错误的信息。它将模型的业务逻辑与这些元数据分离。\n\n\
  `FieldIdentifier` 用于在实例级别标识模型属性。与 C# 中的反射（在类级别上标识属性）不同，只要两个实例属于相同类型，用户在某些属性上将获得相同的\
  \ `PropertyInfo`，而 `FieldIdentifier` 还会比较实例引用：\n\n```csharp\npublic override int\
  \ GetHashCode()\n{\n    var modelHash = RuntimeHelpers.GetHashCode(Model);\n   \
  \ var fieldHash = StringComparer.Ordinal.GetHashCode(FieldName);\n    return (\n\
  \        modelHash,\n        fieldHash\n    ).GetHashCode();\n}\n\npublic override\
  \ bool Equals(object? obj)\n=> obj is FieldIdentifier otherIdentifier\n&& Equals(otherIdentifier);\n\
  \npublic bool Equals(FieldIdentifier otherIdentifier)\n{\n    return ReferenceEquals(otherIdentifier.Model,\
  \ Model) &&\n           string.Equals(otherIdentifier.FieldName, FieldName, StringComparison.Ordinal);\n\
  }\n```\n\n如果 `FieldIdentifier` 的源码实现了 `IEquatable<FieldIdentifier>` 接口并重写了 `GetHashCode`\
  \ 和 `Equals` 方法，建议用户始终一起重写这两个方法。首先，哈希是根据模型实例和字段名计算的。如果两个 `FieldIdentifier` 具有相同的模型实例和相同的字段名，它们将被视为相等的。当用户通过注解属性或自定义验证器验证字段时，这一点非常重要。\n\
  \n虽然 `FieldIdentifier` 帮助标识字段，但 `FieldState` 持有有关修改状态和验证消息的信息：\n\n```csharp\ninternal\
  \ sealed class FieldState\n{\n    private readonly FieldIdentifier _fieldIdentifier;\n\
  \    private HashSet<ValidationMessageStore>? _validationMessageStores;\n\n    public\
  \ FieldState(FieldIdentifier fieldIdentifier)\n    {\n        _fieldIdentifier =\
  \ fieldIdentifier;\n    }\n\n    public bool IsModified { get; set; }\n\n    public\
  \ IEnumerable<string> GetValidationMessages()\n    {\n        if (_validationMessageStores\
  \ != null)\n        {\n            foreach (var store in _validationMessageStores)\n\
  \            {\n                foreach (var message in store[_fieldIdentifier])\n\
  \                {\n                    yield return message;\n                }\n\
  \            }\n        }\n    }\n\n    public void AssociateWithValidationMessageStore(ValidationMessageStore\
  \ validationMessageStore)\n    {\n        if (_validationMessageStores == null)\n\
  \        {\n            _validationMessageStores = new HashSet<ValidationMessageStore>();\n\
  \        }\n        _validationMessageStores.Add(validationMessageStore);\n    }\n\
  \n    public void DissociateFromValidationMessageStore(ValidationMessageStore validationMessageStore)\n\
  \    => _validationMessageStores?.Remove(validationMessageStore);\n}\n```\n\n`EditContext`\
  \ 在字典中持有所有的 `FieldIdentifiers` 和对应的 `FieldStates`。当在 `EditContext` 实例上调用 `NotifyFieldChanged`\
  \ 方法时，`FieldState` 上的 `IsModified` 属性将被设置为 true。\n\n请理解 `EditContext` 与 `FieldIdentifier`\
  \ 和 `FieldState` 共同管理表单状态，所有这些管理都与模型的业务逻辑分离。\n\n## 结\n\n本章介绍了原生的 `EditContext`。我们演示了\
  \ `EditForm` 及其功能。读者学习了如何管理状态。最后，`EditContext` 部分讨论了 `App` 组件以及 `Router` 如何工作。\n\
  \n# 第 8 章：应用程序导航\n\n## 引言\n本章将介绍如何导航。\n\n## 结构\n本章将讨论以下主题：\n- `Router`\n- `RouteAttribute`\n\
  - `NavLink`\n- 异步导航\n- ASP.NET core 集成\n\n## 目标\n本章将帮助读者理解导航。\n\n## ROUTER\n根目录下有一个文件尚未触及：`App.razor`。\n\
  \n在 `Program.cs` 中，此 `App` 组件被注册到 `RootComponents` 中：\n\n```csharp\nusing Microsoft.AspNetCore.Components;\n\
  using Microsoft.AspNetCore.Components.Web;\nusing Microsoft.AspNetCore.Components.WebAssembly.Hosting;\n\
  using EShop.WebAssembly;\n\nvar builder = WebAssemblyHostBuilder.CreateDefault(args);\n\
  builder.RootComponents.Add<App>(\"#app\");\nbuilder.RootComponents.Add<HeadOutlet>(\"\
  head\");\n\nbuilder.Services.AddScoped(sp => new HttpClient { BaseAddress = new\
  \ Uri(builder.HostEnvironment.BaseAddress) });\n\nawait builder.Build().RunAsync();\n\
  ```\n\n查看 `App.razor`：\n\n```razor\n<Router AppAssembly=\"@typeof(App).Assembly\"\
  >\n    <Found Context=\"routeData\">\n        <RouteView RouteData=\"@routeData\"\
  \ DefaultLayout=\"@typeof(MainLayout)\" />\n        <FocusOnNavigate RouteData=\"\
  @routeData\" Selector=\"h1\" />\n    </Found>\n    <NotFound>\n        <PageTitle>Not\
  \ found</PageTitle>\n        <LayoutView Layout=\"@typeof(MainLayout)\">\n     \
  \       <p role=\"alert\">Sorry, there’s nothing at this address.</p>\n        </LayoutView>\n\
  \    </NotFound>\n</Router>\n```\n\n`Router` 组件包含两个子元素，`Found` 和 `NotFound`，实现了路由到放置在\
  \ `Pages` 文件夹下的所有组件。直观的是，当可以找到 `Router` 时，`Found` 将被渲染，当未找到此类资源时，`NotFound` 将显示。这是一个构建统一\
  \ 404 页面的好地方。例如，你可能看到 [github.com](http://github.com) 有一个专门用于 404 结果的页面。可以使用此处的\
  \ `NotFound` 部分来实现相同的功能，这样浏览器就不会出现纯文本的“not found”错误：\n\n![](img/pg_163.jpg)\n\n\
  图 8.1 页面未找到。\n\n如果用户导航到不存在的 \"/hello-world\" 页面，页面将返回到此 `NotFound` 部分并在此处显示定义的内容。\n\
  \n除了 `Found` 和 `NotFound`，来自 `Router` 组件的一些有趣的参数如下：\n\n```csharp\n[Parameter]\n\
  [EditorRequired]\npublic Assembly AppAssembly { get; set; }\n\n[Parameter]\npublic\
  \ IEnumerable<Assembly> AdditionalAssemblies { get; set; }\n\n[Parameter]\n[EditorRequired]\n\
  public RenderFragment NotFound { get; set; }\n\n[Parameter]\n[EditorRequired]\n\
  public RenderFragment<RouteData> Found { get; set; }\n\n[Parameter]\npublic RenderFragment?\
  \ Navigating { get; set; }\n\n[Parameter]\npublic EventCallback<NavigationContext>\
  \ OnNavigateAsync { get; set; }\n```\n\n\n\n\n第一个参数是 `AppAssembly`。它默认由 WebAssembly\
  \ 项目模板赋值。该参数用于标识将要扫描的程序集（Assembly），用户在此添加所有页面，例如 `Pages` 文件夹下的组件。\n\n下一个参数是 `AdditionalAssemblies`，如果用户有多个包含页面组件的程序集，则该参数是可选。如果你正在构建一个部署到生产环境的应用程序，使用专门的程序集为不同的功能创建页面是一个很好的主意。\n\
  \n`NotFound` 和 `Found` `RenderFragment` 帮助渲染普通页面以及用于 404 未找到的统一视图。`Navigating` 也是一个\
  \ `RenderFragment`，但 Blazor 框架并不要求它。开发者可以使用 `Navigating` 在导航到另一个页面时渲染加载动画，例如进度环或进度条。最后一个值得注意的是的是\
  \ `OnNavigateAsync`，它是一个事件处理程序，会在每次导航之前被调用。\n\n## ROUTEATTRIBUTE\n\n上一节提到 `App.razor`\
  \ 会扫描一个程序集以确定到每个页面的路由。以下是关于如何通过 `RouteAttribute` 实现这一点的进一步解释。\n\nBlazor 的 `RouteAttribute`\
  \ 位于 `Microsoft.AspNetCore.Components` 命名空间下。注意不要与来自 `Microsoft.AspNetCore.Mvc`\
  \ 命名空间的 `RouteAttribute` 混淆。后者用于在 ASP.NET Core 控制器或操作上定义路由模板：\n\n```csharp\nnamespace\
  \ Microsoft.AspNetCore.Components;\n\n[AttributeUsage(AttributeTargets.Class, AllowMultiple\
  \ = true, Inherited = false)]\npublic sealed class RouteAttribute : Attribute\n\
  {\n    public RouteAttribute(string template)\n    {\n        ArgumentNullException.ThrowIfNull(template);\n\
  \        Template = template;\n    }\n\n    public string Template { get; }\n}\n\
  ```\n\n此 `RouteAttribute` 只有一个参数 `Template`，该 `Template` 用于定义组件的路由 URI。上一节中介绍过的\
  \ `Router` 有一个名为 `Refresh` 的内部方法。有几处调用了这个 `Refresh` 方法，分别在 `SetParametersAsync`\
  \ 和 `RunOnNavigateAsync` 中。`Refresh` 方法会调用自己的私有方法 `RefreshRouteTable`，然后调用 `RouteTableFactory`\
  \ 的静态方法 `Create` 来生成路由表。\n\n深入查看此 `RouteTableFactory.Create()`：\n\n```csharp\npublic\
  \ static RouteTable Create(RouteKey routeKey)\n{\n    if (Cache.TryGetValue(routeKey,\
  \ out var resolvedComponents))\n    {\n        return resolvedComponents;\n    }\n\
  \    var componentTypes = GetRouteableComponents(routeKey); \n    var routeTable\
  \ = Create(componentTypes);\n    Cache.TryAdd(routeKey, routeTable);\n    return\
  \ routeTable;\n}\n```\n\n它接收一个类型为 `RouteKey` 的参数。`RouteKey` 容器用于持有 `AppAssembly`\
  \ 以及任何需要扫描的额外程序集：\n\n```csharp\ninternal readonly struct RouteKey : IEquatable<RouteKey>\n\
  {\n    public readonly Assembly? AppAssembly;\n    public readonly HashSet<Assembly>?\
  \ AdditionalAssemblies;\n\n    public RouteKey(Assembly appAssembly, IEnumerable<Assembly>\
  \ additionalAssemblies)\n    {\n        AppAssembly = appAssembly;\n        AdditionalAssemblies\
  \ = additionalAssemblies is null ? null : new HashSet<Assembly>(additionalAssemblies);\n\
  \    }\n    // some code\n}\n```\n\n如类名所示，它作为创建路由表的键。首先，`RouteTableFactory` 会检查其缓存。如果找到了与键对应的组件，它将直接返回这些组件。否则，它将生成一个新的路由表并将其与键添加到缓存中。\n\
  \n为了生成路由表，`RouteTableFactory` 调用了私有方法 `GetRouteableComponents`。只有当组件实现了 `IComponent`\
  \ 接口且附带有 `RouteAttribute` 时，它才被定义为可路由的。`GetRouteableComponents` 不仅检查 `AppAssembly`，还会检查\
  \ `AdditionalAssemblies`（如果有）：\n\n```csharp\nprivate static List<Type> GetRouteableComponents(RouteKey\
  \ routeKey)\n{\n    var routeableComponents = new List<Type>();\n    if (routeKey.AppAssembly\
  \ is not null)\n    {\n        GetRouteableComponents(routeableComponents, routeKey.AppAssembly);\n\
  \    }\n    if (routeKey.AdditionalAssemblies is not null)\n    {\n        foreach\
  \ (var assembly in routeKey.AdditionalAssemblies)\n        {\n            if (assembly\
  \ != routeKey.AppAssembly)\n            {\n                GetRouteableComponents(routeableComponents,\
  \ assembly);\n            }\n        }\n    }\n    return routeableComponents;\n\
  }\n\nstatic void GetRouteableComponents(List<Type> routeableComponents, Assembly\
  \ assembly)\n{\n    foreach (var type in assembly.ExportedTypes)\n    {\n      \
  \  if (typeof(IComponent).IsAssignableFrom(type) && type.IsDefined(typeof(RouteAttribute)))\n\
  \        {\n            routeableComponents.Add(type);\n        }\n    }\n}\n}\n\
  ```\n\n接下来，`RouteTableFactory` 将使用扫描到的可路由组件创建 `RouteTable`。它遍历上一步中找到的所有组件类型，并检查附带在它们上的\
  \ `RouteAttribute`。由于每个组件可能附带了多个 `RouteAttribute`（例如，可以定义一个可以同时通过 `/route-a` 和 `/route-b`\
  \ 访问的新页面），因此每个组件类型可以映射到多个模板：\n\n```csharp\ninternal static RouteTable Create(List<Type>\
  \ componentTypes)\n{\n    var templatesByHandler = new Dictionary<Type, string[]>();\
  \ \n    foreach (var componentType in componentTypes)\n    {\n        var routeAttributes\
  \ = componentType.GetCustomAttributes(typeof(RouteAttribute), inherit: false);\n\
  \        var templates = new string[routeAttributes.Length];\n        for (var i\
  \ = 0; i < routeAttributes.Length; i++)\n        {\n            var attribute =\
  \ (RouteAttribute)routeAttributes[i];\n            templates[i] = attribute.Template;\n\
  \        }\n        templatesByHandler.Add(componentType, templates);\n    }\n \
  \   return Create(templatesByHandler);\n}\n```\n\n注意，它获取属性时没有继承，因为所有派生的子组件将与父组件共享路由模板。回到带有生成的\
  \ `RouteTable` 的 Router。这将调用私有属性 `Routes` 上的 `Route` 方法。如果客户端请求路径匹配扫描到的路由之一，它会将相应的组件类型分配给\
  \ `RouteContext` 的 `Handler` 属性。最后，用户可以导航到设计的组件页面。如果没有找到匹配项，`Handler` 属性将保持为 null，Router\
  \ 将如之前所示的渲染 `NotFound`。\n\n为了演示基本的导航过程，对源代码进行了一些简化：\n\n```csharp\nvar locationPath\
  \ = NavigationManager.ToBaseRelativePath(_locationAbsolute);\nlocationPath = TrimQueryOrHash(locationPath);\n\
  \nvar context = new RouteContext(locationPath);\nRoutes.Route(context);\n\nif (context.Handler\
  \ != null)\n{\n    var routeData = new RouteData(context.Handler,\n```\n\n\n\n\n\
  ```csharp\ncontext.Parameters ?? _emptyParametersDictionary);\n\n_renderHandle.Render(Found(routeData));\n\
  \n}\nelse\n{\n\n_renderHandle.Render(NotFound);\n}\n```\n\n## NAVLINK\n\n读者现在应该理解，当他们在浏览器中输入\
  \ URI 并按回车访问 Blazor 应用程序中的页面时，底层发生了什么。本节将检查如何在不让用户输入特定 URI 的情况下导航到另一个页面。\n\n用户在\
  \ EShop 项目中创建了几个新页面。每当添加一个新页面时，用户总会在左列添加一个新的菜单项。此菜单帮助用户在应用程序中穿梭。\n\n在 `Shared` 文件夹下，有一个\
  \ `NavMenu.razor` 文件，在其中添加了几个被 `<div>` 元素封装的新的 NavLink 节：\n\n```razor\n@* some code\
  \ *@\n<div class=\"@NavMenuCssClass\" @onclick=\"ToggleNavMenu\">\n  <nav class=\"\
  flex-column\">\n    <div class=\"nav-item px-3\">\n      <NavLink class=\"nav-link\"\
  \ href=\"\" Match=\"NavLinkMatch.All\">\n        <span class=\"oi oi-home\" aria-hidden=\"\
  true\"></</span> 首页\n      </NavLink>\n    </div>\n    <div class=\"nav-item px-3\"\
  >\n      <NavLink class=\"nav-link\" href=\"counter\">\n        <span class=\"oi\
  \ oi-plus\" aria-hidden=\"true\"></</span> 计数\n      </NavLink>\n    </div>\n  \
  \  <div class=\"nav-item px-3\">\n      <NavLink class=\"nav-link\" href=\"fetchdata\"\
  >\n        <span class=\"oi oi-list-rich\" aria-hidden=\"true\"></</span> 获取数据\n\
  \      </NavLink>\n    </div>\n    <div class=\"nav-item px-3\">\n      <NavLink\
  \ class=\"nav-link\" href=\"cart\">\n        <span class=\"oi oi-list-rich\" aria-hidden=\"\
  true\"></</span> 购物车\n      </NavLink>\n    </div>\n    <div class=\"nav-item px-3\"\
  >\n      <NavLink class=\"nav-link\" href=\"shop-item\">\n        <span class=\"\
  oi oi-list-rich\" aria-hidden=\"true\"></</span> 商品项目\n      </NavLink>\n    </div>\n\
  \    <div class=\"nav-item px-3\">\n      <NavLink class=\"nav-link\" href=\"request-item\"\
  >\n        <span class=\"oi oi-list-rich\" aria-hidden=\"true\"></</span> 请求项目\n\
  \      </NavLink>\n    </div>\n  </nav>\n</div>\n@* some code *@\n```\n\n在 `<nav>`\
  \ 元素中列出了六个 NavLink。当用户点击 `NavLink` 时，将导航到 `href` 属性定义的目标页面。在部署到生产环境的应用程序中，建议使用字符串持有路由。\n\
  \n参考图 8.2。\n\n![](img/pg173.jpg)\n\n图 8.2 菜单\n\n理解 `NavLink` 的最佳方法是阅读源代码，读者很快就会发现它是一个组件：\n\
  \n```csharp\npublic class NavLink : ComponentBase, IDisposable\n{\n```\n\n`NavLink`\
  \ 继承自 `ComponentBase` 并实现了 `IDisposable` 接口。首先查看 `NavLink` 暴露的参数：\n\n```csharp\n\
  [Parameter]\npublic string? ActiveClass { get; set; }\n\n[Parameter(CaptureUnmatchedValues\
  \ = true)]\npublic IReadOnlyDictionary<string, object>? AdditionalAttributes { get;\
  \ set; }\n\n[Parameter]\npublic RenderFragment? ChildContent { get; set; }\n\n[Parameter]\n\
  public NavLinkMatch Match { get; set; }\n```\n\n用户应该熟悉 `AdditionalAttributes` 和\
  \ `ChildContent`。一个是捕捉 HTML 属性，另一个是渲染 `NavLink` 内部的子元素。`ActiveClass` 用于渲染 `NavLink`\
  \ 的视觉样式。最后一个 `Match` 是一个简单的枚举，根据 URI 的前缀或匹配整个 URI：\n\n```csharp\npublic enum NavLinkMatch\n\
  {\n  Prefix,\n  All\n}\n```\n\n`NavLink` 中的另一个重要属性是注入的 `NavigationManager`，它是导航的抽象。它暴露了事件\
  \ `LocationChanged` 以及关于导航的一些属性和方法。例如，开发者可以从中获取绝对 URI，或调用它的 `NavigateTo` 方法访问指定的\
  \ URI：\n\n```csharp\n[Inject] private NavigationManager NavigationManager { get;\
  \ set; } = default!;\n```\n\n读者可能会猜测为什么 `NavLink` 分配了 `href` 属性却没有任何这样的参数。这是因为在设置参数时从\
  \ `AdditionalAttributes` 中检索了 `href` 属性：\n\n```csharp\nprotected override void OnParametersSet()\n\
  {\n  // 更新计算状态\n  var href = (string?)null;\n  if (AdditionalAttributes != null\
  \ && AdditionalAttributes.TryGetValue(\"href\", out var obj))\n  {\n    href = Convert.ToString(obj,\
  \ CultureInfo.InvariantCulture);\n  }\n  _hrefAbsolute = href == null ? null : NavigationManager.ToAbsoluteUri(href).AbsoluteUri;\n\
  \  _isActive = ShouldMatch(NavigationManager.Uri);\n  _class = (string?)null;\n\
  \  if (AdditionalAttributes != null && AdditionalAttributes.TryGetValue(\"class\"\
  , out obj))\n  {\n    _class = Convert.ToString(obj, CultureInfo.InvariantCulture);\n\
  \  }\n  UpdateCssClass();\n}\n```\n\n在这里 `NavLink` 检查当前 URI 是否匹配目标，并为 `_isActive`\
  \ 字段赋值布尔值。该字段用于在向用户渲染 `NavLink` 时确定视觉样式：\n\n```csharp\nprivate const string DefaultActiveClass\
  \ = \"active\";\nprivate void UpdateCssClass()\n{\n  CssClass = _isActive ? CombineWithSpace(_class,\
  \ DefaultActiveClass) : _class;\n}\n\nprotected override void BuildTree(RenderTreeBuilder\
  \ builder)\n{\n  builder.OpenElement(0, \"a\");\n  builder.AddMultipleAttributes(1,\
  \ AdditionalAttributes);\n  builder.AddAttribute(2, \"class\", CssClass);\n  if\
  \ (_isActive)\n  {\n    builder.AddAttribute(3, \"aria-current\", \"page\");\n \
  \ }\n  builder.AddContent(4, ChildContent);\n  builder.CloseElement();\n}\n```\n\
  \n在 `BuildTree` 方法中，它首先创建一个 `<a>` 元素并添加 HTML 属性。注意，如果当前 URI 匹配，默认激活的 `ActiveClass`\
  \ 将被添加到属性中。然后将 `ChildContent` 作为 `<a>` 的内容添加，最后标记元素关闭。参考图 8.3，该图显示了未匹配 URL 的 `NavLink`\
  \ 组件的渲染结果。\n\n![](img/pg177.jpg)\n\n图 8.3 在 html 中渲染的 NavLink\n\n`NavMenu.razor.css`\
  \ 定义了 `NavLink` 激活时的视觉样式，因此用户在图 8.2 中可以看到匹配的 `NavLink` 显示半透明白色背景。完全取决于 UI 设计师或开发者通过更新\
  \ CSS 类名或样式来自定义匹配的 NavNavLink 的视觉效果：\n\n```css\n.nav-item ::deep a.active {\n  background-color:\
  \ rgba(255,255,255,0.25);\n  color: white;\n}\n```\n\n最后的一件事是保持激活状态正确。`NavLink`\
  \ 订阅了注入的 `NavigationManager` 的 `LocationChanged` 事件，并在销毁时取消订阅以防止内存泄漏：\n\n```csharp\n\
  protected override void OnInitialized()\n{\n  NavigationManager.LocationChanged\
  \ += OnLocationChanged;\n}\n\npublic void Dispose()\n{\n  NavigationManager.LocationChanged\
  \ -= OnLocationChanged;\n}\n\nprivate void OnLocationChanged(object? sender, LocationChangedEventArgs\
  \ args)\n{\n  var shouldBeActiveNow = ShouldMatch(args.Location);\n  if (shouldBeActiveNow\
  \ != _isActive)\n  {\n    _isActive = shouldBeActiveNow;\n    UpdateCssClass();\n\
  \    StateHasChanged();\n  }\n}\n```\n\n## ROUTE PARAMETERS\n\n到为止已经涵盖了外部和内部导航。接将将详细讨论路由参数。大多数\
  \ Web 应用程序框架都会提供至少一种方式来支持路由参数。例如，在 NEXT.js 中，使用方括号 `[]` 来标记路由中的动态参数。在 ASP.NET Core\
  \ 中，使用大括号 `{}` 构建路由模板。\n\n\n\n\n\n由于 Blazor 也是 .NET Core 家族的一员，它也使用大括号 `{}` 来定义路由参数。当开发者为一组相似的对象构建页面或模板时，路由参数变得特别有用。在\
  \ EShop 中，用户构建了一个路由为 `\"/shop-item\"` 的 `ShopItem.razor`，但该页面专门用于显示 T 恤。通过路由参数的帮助，用户可以复用此页面来显示其他\
  \ ShopItem，例如配件、鞋子或裤子。为了支持路由参数，请修改 `ShopItem.razor` 和 `ShopItem.razor.cs`。\n\n###\
  \ 路由参数\n\n首先，更新 `ShopItem.razor` 中的 `@page` 指令。添加了一对带有名称的大括号：\n\n```\n@page \"/shop-item/{name}\"\
  \n```\n\n@* some code *@\n\n接下来，在 `ShopItem.razor.cs` 中准备接收此参数。添加一个带有 `[Parameter]`\
  \ 特性标记的 `Name` 属性，并将其构造函数中生成 `Item` 模型的逻辑移动到重写的 `OnParametersSet` 方法中，因为 `Name`\
  \ 参数在组件构造函数中还没有值。注意，路由参数是不区分大小写的，所以开发者可以保持自己的命名习惯：\n\n```csharp\npublic partial\
  \ class ShopItem : ComponentBase\n{\n    [Parameter]\n    public string Name { get;\
  \ set; }\n\n    public Models.ShopItem Item { get; private set; }\n\n    public\
  \ string? Content { get; set; }\n\n    private string _base64Image = string.Empty;\n\
  \n    protected override void OnParametersSet()\n    {\n        Item = new Models.ShopItem(Name,\
  \ \"The best ever with lower price!\", 19.9);\n        Item.ImageUrl = \"https://ts1.cn.mm.bing.net/th/id/R-C.614bdee2065be0f1976bdf839c725e26?rik=EJ2vSWnK-s9a9vQ&riu=http%3a%2f%2fclipart-library.com%2fimg%2f828773.png&eh-k=avi5QwUJFS0v4Qtu8ggI5Ariopp4uJwf7r5QlOnJQ0o%3d&risl=&pid=ImgRaw&r=0\"\
  ;\n    }\n    // some code\n}\n```\n\n现在，客户不仅可以购买之前指定的 T 恤，还可以通过输入带有所需物品名称 URI 来浏览他们喜欢的任何物品。请参考图\
  \ 8.5 和图 8.6。\n\n![](img/pg_180.jpg)\n\n图 8.5 购买鞋子。\n\n在图 8.5 中，客户正在访问鞋子页面；在图 8.6\
  \ 中，客户正在访问显示配件信息的页面。\n\n![](img/pg_180-1.jpg)\n\n图 8.6 购买配件。\n\n注意，这里有一个问题。如果客户在浏览器中完全输入\
  \ URI，页面将正确显示。问题出现在点击左侧的 `ShopItem` 导航菜单时——此时它将显示 404 未找到的消息。（参见图 8.7。）\n\n![](img/pg_181.jpg)\n\
  \n图 8.7 物品页面未找到。\n\n修复此问题的一种简单方法是在该 `NavLink` 的 `href` 属性末尾添加一个随机名称。或者可以使用可选参数机制为商店物品名称提供默认值。用户需要做的是在名称后添加一个问号，并在构造\
  \ `Item` 模型之前检查 `Name` 属性是否为空：\n\n```csharp\n@page \"/shop-item/{name?}\"\n\nprotected\
  \ override void OnParametersSet()\n{\n    Name = Name ?? \"T-Shirt\";\n    Item\
  \ = new Models.ShopItem(Name, \"The best ever with lower price!\", 19.9);\n    Item.ImageUrl\
  \ = \"https://ts1.cn.mm.bing.net/th/id/R-C.614bdee2065be0f1976bdf839c725e26?rik=EJ2vSWnK-s9a9vQ&riu=http%3a%2f%2fclipart-library.com%2fimg%2f828773.png&eh-k=avi5QwUJFS0v4Qtu8ggI5Ariopp4uJwf7r5QlOnJQ0o%3d&risl=&pid=ImgRaw&r=0\"\
  ;\n}\n```\n\n现在客户默认将查看 T 恤。\n\n路由参数的另一个技巧是匹配到 URI 结尾所有内容的模式。它只能在路由的末尾使用，且必须是 `string`\
  \ 类型。语法是在参数名称之前添加一个 `*`，即 `/shop-item/{*name}`。通过这样，`Name` 属性将匹配以下 URI：`\"/shop-item/shoes\"\
  ` 或 `\"/shop-item/shoes/size/8\"`，其值将是 `\"shoes\"` 或 `\"shoes/size/8\"`。\n\n最后一个技巧是路由约束。就像我们对泛型有约束一样，我们可以验证路由参数是否为所需的类型。语法非常直观，`/{parameter:type}`，`parameter`\
  \ 代表参数名称，例如上一个示例中的 `Name`。\n\n### 导航事件与异步导航\n\n正如前面的章节介绍的，当发生导航时，`NavigationManager`\
  \ 将发出 `LocationChanged` 事件。如果用户正在寻找一种记录足迹的方法，订阅此事件是一个很好的主意。\n\n要订阅该事件，首先在 WebAssembly\
  \ 根目录下创建一个新文件 `App.razor.cs`，并将 `NavigationManager` 实例作为属性注入：\n\n```csharp\nusing\
  \ Microsoft.AspNetCore.Components;\nusing Microsoft.AspNetCore.Routing;\n\nnamespace\
  \ EShop.WebAssembly;\n\npublic partial class App : IDisposable\n{\n    [Inject]\n\
  \    public NavigationManager NavigationManager { get; set; }\n\n    public void\
  \ Dispose()\n    {\n        NavigationManager.LocationChanged -= OnLocationChanged;\n\
  \    }\n\n    protected override void OnInitialized()\n    {\n        NavigationManager.LocationChanged\
  \ += OnLocationChanged;\n    }\n\n    private void OnLocationChanged(object? sender,\
  \ LocationChangedEventArgs e)\n    {\n        Console.WriteLine(e.Location);\n \
  \       Console.WriteLine(e.IsNavigationIntercepted);\n    }\n}\n```\n\n为了演示，将事件参数打印到控制台。`Location`\
  \ 代表客户即将访问的新 URI。`IsNavigationIntercepted` 表示 Blazor 框架是否从浏览器进行了拦截。例如，如果客户点击左侧菜单列中的\
  \ `Cart`，由于 `Cart` 是通过 `NavLink` 实现（实际上是 `<a>` 元素），因此显然是浏览导航行为，此时 `IsNavigationIntercepted`\
  \ 将为 `true`。要获取 `false` 值，导航应该由 `NavigationManager` 的 `NavigateTo` 方法触发。为了测试这一点，在\
  \ `ShopItem` 页面中添加一个按钮，客户点击它时将导航到购物车页面：\n\n```razor\n@* some code *@\n<div>\n<button\
  \ class=\"btn btn-primary\" @onclick=\"ToCart\">To cart</button>\n</div>\n@* some\
  \ code *@\n```\n\n```csharp\n// some code\n\n[Inject]\npublic NavigationManager\
  \ NavigationManager { get; set; }\n\npublic void ToCart()\n{\n    Console.WriteLine(\"\
  go to cart\");\n    NavigationManager.NavigateTo(\"/cart\", false);\n}\n\n// some\
  \ code\n```\n\n\n\n\n\n`NavigationManager` 被注入到 `ShopItem.razor.cs` 中，它是一个按钮点击事件处理器，用于调用\
  \ `NavigateTo` 方法。点击按钮并再次检查控制台日志，你会发现这次 `IsNavigationIntercepted` 为 `false`，因为导航不是由浏览器触发的。\n\
  \n`OnNavigateAsync` 是开发者可以在 `Router` 组件上订阅的另一个事件。该事件在导航之前被调用。它可以由浏览器或 `NavigationManager`\
  \ 的 `NavigateTo` 方法触发。该 `OnNavigateAsync` 处理器的参数类型为 `NavigationContext`，它包含两个属性：\n\
  \n```csharp\nnamespace Microsoft.AspNetCore.Components.Routing;\n\npublic sealed\
  \ class NavigationContext\n{\n    internal NavigationContext(string path, CancellationToken\
  \ cancellationToken)\n    {\n        Path = path;\n        CancellationToken = cancellationToken;\n\
  \    }\n\n    public string Path { get; }\n\n    public CancellationToken CancellationToken\
  \ { get; }\n}\n```\n\n`Path` 告诉开发者目标 URI 是什么，而 `CancellationToken` 在此处具有重要性。通过这个\
  \ `CancellationToken` 实例，可以将其传递给后续的异步操作（例如 HTTP 请求或将数据保存到数据库），以便在导航取消时同步取消这些操作。\n\
  \n## ASP.NET CORE 集成\n\n到目前为止讨论的所有主题都适用于 Blazor Server 和 Blazor WebAssembly。涉及到路由时，Blazor\
  \ Server 变得复杂，因为 Blazor Server 本质上是一个普通的 ASP.NET Core 项目。如果创建一个 ASP.NET Core API\
  \ 项目并打开两个项目的 `*.csproj` 文件，你会发现两个应用共享相同的项目 SDK `Microsoft.NET.Sdk.Web`，而 Blazor\
  \ WebAssembly 使用的是 SDK `Microsoft.NET.Sdk.BlazorWebAssembly`。这意味着开发者可以像任何其他 ASP.NET\
  \ Core API 项目一样为 Blazor Server 项目添加控制器：\n\n```csharp\nusing EShop.Server.Data;\n\
  \n// some code\n\nbuilder.Services.AddSingleton<WeatherForecastService>();\n\nbuilder.Services.AddControllers();\n\
  \n// some code\n\napp.MapBlazorHub();\n\napp.MapControllers();\n\napp.MapFallbackToPage(\"\
  /_Host\");\n\napp.Run();\n```\n\n在这里，修改 `EShop.Server` 项目的 `Program.cs` 文件以添加控制器功能。在项目根目录下创建一个\
  \ `Controllers` 文件夹，并在其中创建一个 `HelloController.cs` 文件：\n\n```csharp\nusing Microsoft.AspNetCore.Mvc;\n\
  \nnamespace EShop.Server.Controllers;\n\n[Route(\"hello\")]\n\npublic class HelloControler\
  \ : ControllerBase\n{\n    [HttpGet]\n    public IActionResult SayHi()\n    {\n\
  \        return Content(\"Hello, world! From Controller.\");\n    }\n}\n```\n\n\
  该控制器只有一个操作：向世界问好。现在，运行项目并在任何浏览器中访问 `https://localhost:7181/hello`（此处端口号可能不同），将出现来自控制器的纯文本问候。访问\
  \ `https://localhost:7181/hello/world`，它没有映射到任何控制器，浏览器中将渲染 `NotFound`。\n\n请参考 图\
  \ 8.9。\n\n![](img/pg_187.jpg)\n\n图 8.9 未映射控制器。\n\n它没有显示浏览器的默认纯文本 HTTP ERROR 404\
  \ 页面。这是因为映射了到 `/_Host` 页面的回退。该回退的优先级较低，因此应用程序将尝试映射控制器端点或 Blazor 页面，如果失败，用户将被路由到此\
  \ `/_Host` 页面。通过这种方式，开发者可以在 Blazor Server 中实现控制器和 Blazor 页面，而互不干扰。\n\n## 总结\n\n\
  本章说明了 `Router` 组件作为 Blazor 应用的核心，允许用户在应用程序中导航，并在 URI 不匹配时显示专门的错误页面。接下来，章节深入介绍了如何实现\
  \ `Router` 组件以通过 `RouteAttribute` 实现路由。章节还引入了 `NavLink` 组件，它是原生 HTML 开发中 `<a>` 元素的替代品，具有内置的激活状态检查。章节还讨论了应用中路由的更多动态方式，以及页面如何处理不同类型的动态路由。读者还学习了导航事件和带取消的异步导航。最后，章节探索了如何在不互相干扰的情况下使用传统的\
  \ API 控制器开发 Blazor Server。\n\n第 9 章 将讨论 .NET 与 JavaScript 互操作，以及用户如何在 .NET 代码中调用\
  \ JavaScript 函数或反之。读者将通过演示学习如何实现这一点，以及在某些情况下，JavaScript 仍然是必需的工具。\n\n# 第 9 章\n##\
  \ .NET 与 JavaScript 互操作\n\n## 引言\n\n本章介绍了如何从 Blazor .NET 代码调用 JavaScript 函数以及从 JavaScript\
  \ 函数调用 .NET 方法。Blazor 帮助用户用尽可能少的 JavaScript 进行编码。在某些情况下，仍然需要 JavaScript 来操作文档对象模型\
  \ (DOM)。\n\n## 结构\n\n本章讨论了以下主题：\n\n- 序列化\n- 加载 JavaScript\n- 初始化器\n- 从 .NET 调用 JavaScript\n\
  - JavaScript 隔离\n- 从 JavaScript 调用 .NET\n- 缓存\n- 元素引用\n- 类型安全\n\n## 目标\n\n本章首先帮助读者理解\
  \ .NET 中的 JSON 序列化和反序列化，并掌握在 Blazor .NET 代码中调用 JavaScript 函数以及反之的技术。这包括理解加载 JavaScript\
  \ 脚本的位置、隔离 JavaScript 以及控制静态资源（例如 `.js` 文件）的缓存。最后，读者将理解 JavaScript 中的元素引用以及 .NET\
  \ 代码与 JavaScript 函数之间的类型安全。\n\n## 序列化\n\n序列化是一个过程。该过程将对象实例的信息转换为文本或二进制格式，以便于存储在文件中、持久化数据库中，或传递给下一个服务进行处理。序列化的反过程被称为反序列化，它从文本或二进制数据构造对象实例。\n\
  \n序列化和反序列化在 JavaScript 互操作中被广泛使用。本节将介绍内置 `System.Text.Json` 以及如何使用它处理序列化或反序列化。该库具有序列化或反序列化\
  \ JavaScript 对象的能力。JSON 源自 JavaScript 对象表示，但它是语言无关的，这便于在不同语言编写的计算机或服务之间传输。许多产品现在采用微服务架构。JSON\
  \ 被用于在请求和响应之间交换信息。\n\nJSON 也容易理解。一个典型的示例说明了 JSON 文本的键值结构：\n\n```json\n{\n  \"type\"\
  : \"Blazor\",\n  \"content\": \"Hello, world!\"\n}\n```\n\n此示例缩缩增加了可读性。注意，对于机器来说，JSON\
  \ 内容可以更紧凑以节省空间并提高性能。\n\n要在 .NET 代码中生成上述 JSON，首先定义相应的类，然后通过构造所需属性值的实例来实现：\n\n```csharp\n\
  public class MyClass\n{\n    // [System.Text.Json.Serialization.JsonPropertyName(\"\
  type\")] public string Type { get; set; }\n    // [System.Text.Json.Serialization.JsonPropertyName(\"\
  content\")] public string Content { get; set; }\n}\n\nvar myInstance = new MyClass()\n\
  {\n    Type = \"Blazor\",\n    Content = \"Hello, world!\"\n};\n\nstring jsonString\
  \ = System.Text.Json.JsonSerializer.\nSerialize(myInstance);\n```\n\n甚至更简单，不需要定义显式类，就可以从匿名实例转换相同的\
  \ JSON 字符串。\n\n```csharp\nvar myInstance = new\n{\n    type = \"Blazor\",\n    content\
  \ = \"Hello, world!\"\n};\n\nstring jsonString = System.Text.Json.JsonSerializer.\n\
  Serialize(myInstance);\n```\n\n\n\n\n\n默认情况下，该库将实例转换为紧凑的 JSON 字符串。此外，在使用 `JsonSerializer`\
  \ 进行序列化的过程中，有许多可配置的行为。开发者可以构造 `JsonSerializerOptions` 类型的实例并将其传递给 `Serialize` 方法。\n\
  \n## 加载 JavaScript\n\n要调用 JavaScript 函数或反之，用户必须先加载 JavaScript 代码。有几种方法可以完成此任务。第一种方法非常简单，并在下载文件的章节中使用。在\
  \ `EShop.WebAssembly` 项目中，`index.html` 文件位于 `wwwroot` 文件夹下：\n\n```html\n<!DOCTYPE\
  \ html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\" />\n<meta name=\"viewport\"\
  \ content=\"width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no\"\
  \ />\n<title>EShop.WebAssembly</title>\n<base href=\"/\" />\n<link href=\"css/bootstrap/bootstrap.min.css\"\
  \ rel=\"stylesheet\" />\n<link href=\"css/app.css\" rel=\"stylesheet\" />\n<link\
  \ href=\"EShop.WebAssembly.styles.css\" rel=\"stylesheet\" />\n</head>\n<body>\n\
  <div id=\"app\">Loading...</div></div>\n<div id=\"blazor-error-ui\">\nAn unhandled\
  \ error has occurred.\n<a href=\"\" class=\"reload\">Reload</a>a>\n<a class=\"dismiss\"\
  >\U0001F5D9</a>\n</</div>\n<script src=\"_framework/blazor.webassembly.js\"></script>\n\
  <script src=\"eshop.js\"></script>\n</body>\n</html>\n```\n\n在 第 8 章 中，外部的 `eshop.js`\
  \ 被加载在 `body` 部分。如果某人是经验丰富的前端开发者，他们也可以在这里加载内联脚本。为了演示之目的，只需像之前那样在 `<script>` 元素中编写\
  \ JavaScript 代码即可：\n\n```html\n<body>\n<div id=\"app\">Loading...</div></div>\n\
  <div id=\"blazor-error-ui\">\nAn unhandled error has occurred.\n<a href=\"\" class=\"\
  reload\">Reload</a>a>\n<a class=\"dismiss\">\U0001F5D9</a>\n</</div>\n<script src=\"\
  _framework/blazor.webassembly.js\"></script>\n<script type=\"text/javascript\">\n\
  function download() {\nconst current = new Date();\nconst day = current.getDate()\n\
  const month = current.getMonth() + 1\nconst year = current.getFullYear()\nconst\
  \ time = year + \"/\" + month + \"/\" + day + \" \" + current.\ngetHours() + \"\
  :\" + current.getMinutes() + \":\" + current.\ngetSeconds();\nconst data = 'hello\
  \ world!' + \"\\n\" + time;\nconst blob = new Blob([data]);\nconst url = URL.createObjectURL(blob);\n\
  const anchorElement = document.createElement('a');\nanchorElement.href = url;\n\
  anchorElement.download = 'hello.txt';\nanchorElement.click();\nanchorElement.remove();\n\
  URL.revokeObjectURL(url);\n}\n</script>\n</body>\n```\n\n## 初始化器\n\n为了更动态地加载 JavaScript\
  \ 代码，开发者可能会选择从 JavaScript 初始化器加载它们。该初始化器将在 Blazor 应用加载之前或之后执行。开发者可以使用此初始化器来控制 Blazor\
  \ 应用的加载过程、加载自定义的 JavaScript 代码并配置设置。\n\n构建 Blazor 的过程将自动检测此初始化器并导入它。初始化器是通过命名约定检测到的。将其命名为\
  \ `{NAME}.lib.module.js` 并将其直接放在 `wwwroot` 文件夹中。例如，在 `EShop.WebAssembly` 项目中，创建一个名为\
  \ `EShop.WebAssembly.lib.module.js` 的新文件并将其放入 `wwwroot` 文件夹中。在后续代码中，该初始化器导入了 JavaScript：\n\
  \n\n\n\n\n```cs\nBeginInvokeJS(taskId, identifier, argsJson, resultType, targetInstanceId);\n\
  \nreturn new ValueTask<TValue>(tcs.Task);\n\n}\n\ncatch\n{\n\nCleanupTasksAndRegistrations(taskId);\n\
  \nthrow;\n}\n\n```\n\n在给定的内部方法中，首先通过线程安全的 `Interlocked.Increment` 获取 `taskId`，然后创建一个新的\
  \ `TaskCompletionSource` 实例，其返回类型设为泛型参数，并设置了取消检查。如果调用的函数没有被取消或超时，将调用 `JsonSerializer.Serialize`\
  \ 来对 JavaScript 函数的输入参数进行序列化。注意序列化过程，要避免参数实例中出现循环对象引用，因为这是不允许的，且会导致序列化失败。最后，从静态类\
  \ `InternalCalls` 中调用静态方法 `InvokeJs`，该方法被映射到 Mono WebAssembly 运行时中的函数。\n\n带有参数和返回值，再次尝试\
  \ 第 6 章 中的动态下载示例，并带有参数和返回值。首先，修改 JavaScript 下载函数以接收一个 `name` 参数并返回调用状态的实例：\n\n```javascript\n\
  window.download = download;\n\nfunction download(name) {\nconst current = new Date();\n\
  const day = current.getDate()\nconst month = current.getMonth() + 1\nconst year\
  \ = current.getFullYear()\nconst time = year + \"/\" + month + \"/\" + day + \"\
  \ \" + current. getHours() + \":\" + current.getMinutes() + \":\" + current.getSeconds();\n\
  const data = 'hello, ' + name + '!' + '\\n' + time;\nconst blob = new Blob([data]);\n\
  const url = URL.createObjectURL(blob);\nconst anchorElement = document.createElement('a');\n\
  anchorElement.href = url;\nanchorElement.download = 'hello.txt';\nanchorElement.click();\n\
  anchorElement.remove();\nURL.revokeObjectURL(url);\nvar status = {\nsucceed: true,\n\
  name: name,\ntime: current,\n};\nreturn status;\n}\n```\n\n这一次，向用户问好并返回调用状态：\n\n\
  ```cs\npublic class DownloadStatus\n{\n[JsonPropertyName(\"succeed\")]\npublic bool\
  \ Succeed { get; set; }\n[JsonPropertyName(\"name\")]\npublic string Name { get;\
  \ set; }\n[JsonPropertyName(\"time\")]\npublic DateTime Time { get; set; }\n}\n\n\
  public partial class ShopItem : ComponentBase\n{\n// some code\nprivate async void\
  \ DownloadAsync()\n{\nvar status = await JS.InvokeAsync<DownloadStatus>\n(\"download\"\
  , \"Brian\");\n}\n}\n```\n\n在 `ShoptItem` 组件的 C# 后置代码中定义了一个相应的用于反序列化的 `DownloadStatus`\
  \ 类，并将用户名 `Brian` 传递给 JavaScript 下载函数。运行应用程序并点击下载按钮，查看这次下载的 `hello.txt`，它将包含用户名\
  \ `Brian`，如图 9.2 所示。\n\n![](img/pg_201.jpg)\n\n图 9.2 带参数调用 JavaScript 函数。\n\n##\
  \ JavaScript 隔离\n\n加载 JavaScript 还有另一种方法，开发者在日常工作中经常使用，但本章尚未介绍。它被称为 JavaScript 隔离（JavaScript\
  \ isolation）。这种技术带来了两个好处：第一是本地 JavaScript 不会与全局命名空间混合；第二是，如果你是库的创建者，你的消费者不需要手动导入对应的\
  \ JavaScript 代码。以下示例展示了如何将 `eshop.js` 的加载从 `index.html` 移动到与调用它的 Razor 组件并置。移动 JavaScript\
  \ 文件后，将其重命名为 `ShopItem.razor.js` 以匹配组件名称。在这种方法中，不需要相对于窗口的全局标识符。用户此时不要忘记导出函数，否则在运行时将抛出异常：\n\
  \n```javascript\nexport function download(name) {\n// some code\n}\n```\n\n接下来，在\
  \ C# 代码中引入此 JavaScript：\n\n```cs\npublic partial class ShopItem : ComponentBase\n\
  {\n// some code\n[Inject]\npublic IJSRuntime JS { get; set; }\nprivate IJSObjectReference?\
  \ _module;\n\nprotected override async Task OnRenderAsync(bool firstRender)\n{\n\
  \    if (firstRender)\n    {\n        _module = await JS.InvokeAsync<IJSObjectReference>(\"\
  import\", \"./ShopItem.razor.js\");\n    }\n}\n\nprivate async void DownloadAsync()\n\
  {\n    if (_module != null)\n    {\n        var status = await _module.InvokeAsync<DownloadStatus>(\"\
  download\", \"Brian\");\n    }\n}\n```\n\n在 `ShopItem` 组件中，使用按钮来调用 `DownloadAsync`：\n\
  \n```razor\n<button class=\"btn btn-primary\" @onclick=\"DownloadAsync\">Download</button>\n\
  ```\n\n## 从 JavaScript 调用 .NET\n\n本章已经介绍了如何从 JavaScript 调用 .NET。现在，我们将通过示例查看调用静态方法、实例方法等其他类型。\n\
  \n### 静态方法\n\n最简单的方法是从 JavaScript 代码调用静态方法。在 .NET 代码中定义一个静态方法来提供描述。在项目根目录的 `Utils`\
  \ 文件夹下创建一个文件 `ProjectUtility.cs`：\n\n```cs\nusing Microsoft.JSInterop;\nnamespace\
  \ EShop.WebAssembly.Utils;\npublic static class ProjectUtility\n{\n    [JSInvokable(\"\
  getProj\")]\n    public static string GetProject(string key)\n{\n        if (key\
  \ == \"Description\")\n        {\n            return \"This is an EShop project\
  \ powered by Blazor WebAssembly.\";\n        }\n        return \"key not found.\"\
  ;\n    }\n}\n```\n\n静态方法 `GetProject` 使用属性标记带有可选的标识符。如果没有指定标识符，将使用方法名称作为默认标识符。修改\
  \ `ShopItem.razor.js` 以在加载后调用此静态方法：\n\n```javascript\nexport function download(name)\
  \ {\n// some code\n}\n\nfunction getProject(key) {\n    DotNet.invokeMethodAsync('EShop.WebAssembly',\
  \ 'getProj', key)\n    .then(data => {\n        console.log(data);\n    });\n}\n\
  \ngetProject('Description');\n```\n\n### 实例方法\n\n调用 .NET 的实例方法需要更多工作。首先，JavaScript\
  \ 必须持有该实例的引用以便对其调用方法。因此，用户应该将类实例作为 `DotNetObjectReference` 实例传递给 JavaScript。\n\n\
  \n\n\n\n产品所有者（PO）对用户故事（需求）负责。PO 将为客户提供一个新页面用于进行抽奖，运气最大的中奖者将获得一件免费物品。假设已经有一个实现抽奖算法的\
  \ JavaScript 函数，这将有助于业务逻辑逻辑的构建。\n\n首先，在 `Pages` 文件夹下创建一个名为 `Lottery.razor` 的新页面以及相应的样式文件\
  \ `Lottery.razor.css`：\n\n```razor\n@page \"/lottery\"\n\n<PageTitle>抽奖</PageTitle>\n\
  \n<h1>抽奖</h1>\n\n<h4>![](img/pg_206.jpg) 欢迎来到抽奖公园。祝你好运大增！</h4>\n\n<div id=\"lotteryNo\"\
  >\n<input id=\"lotteryTxt\" placeholder=\"请输入您从卖家处获得的抽奖号码。\"\n@bind=\"_lotteryNo\"\
  ></input>\n</div>\n\n<div id=\"drawBtn\">\n<button class=\"btn btn-danger\" @onclick=\"\
  DrawAsync\">抽奖</button>\n</div>\n\n<p id=\"lotteryResult\" class=\"@_resultClasses\"\
  >结果: @_lotteryResult</p>\n```\n\n这是一个简单的页面，客户在结账时输入从卖家处获得的抽奖号码。然后客户将点击“抽奖（Draw）”按钮查看是否能获得免费物品。在\
  \ `Lottery.razor.css` 中为页面添加一些自定义样式：\n\n```css\n#lotteryNo {\n  margin: 10px;\n\
  }\n#lotteryTxt {\n  width: 100%;\n}\n#drawBtn {\n  margin: 10px;\n}\n#lotteryResult{\n\
  \  color: red;\n  font-size: larger;\n  font-weight: bold;\n}\n.hide{\n  visibility:\
  \ hidden;\n}\n```\n\n在在 `Lottery.razor.cs` 中编写后端 C# 代码之前，先完成 JavaScript 函数：\n\n\
  ```javascript\nvar reference = {};\n\nfunction internalDraw(number) {\n  var result\
  \ = '感谢您的购买！';\n  if (number === 'winner') {\n    result = '恭喜！您获得了一件免费物品！'\n  }\n\
  \  return result;\n}\n\nexport function getRef(ref) {\n  reference = ref;\n}\n\n\
  export function draw(number) {\n  var result = internalDraw(number);\n  reference.invokeMethodAsync('display',\
  \ result);\n}\n```\n\n按照设计，`internalDraw` 将是在 JavaScript 库中实现的函数，只有持有内容内容为 `winner`\
  \ 的抽奖的人才能赢得奖品。第一个导出的函数 `getRef` 用于保存从 `.NET` 代码传递的实例引用。`draw` 函数将调用 `.NET` 实例上的方法，向客户显示抽奖结果。转到\
  \ `Lottery.razor.cs`，编写后端 C# 代码，并准备在页面首次渲染时传递实例引用：\n\n```csharp\nusing Microsoft.AspNetCore.Components;\n\
  using Microsoft.JSInterop;\n\nnamespace EShop.WebAssembly.Pages;\n\npublic partial\
  \ class Lottery : ComponentBase\n{\n  private string _lotteryNo;\n  private string\
  \ _resultClasses = \"hide\";\n  private string _lotteryResult = string.Empty;\n\
  \  private DotNetObjectReference<Lottery>? _instanceRef;\n  private IJSObjectReference?\
  \ _module;\n\n  [Inject]\n  private IJSRuntime JS { get; set; }\n\n  protected override\
  \ async Task OnAfterRenderAsync(bool firstRender)\n  {\n    if (firstRender)\n \
  \   {\n      _instanceRef = DotNetObjectReference.Create(this);\n      _module =\
  \ await JS.InvokeAsync<IJSObjectReference>\n        (\"import\", \"./Pages/Lottery.razor.js\"\
  );\n      await _module.InvokeVoidAsync(\"getRef\", _instanceRef);\n    }\n    await\
  \ base.OnAfterRenderAsync(firstRender);\n  }\n\n  private async void DrawAsync()\n\
  \  {\n    // 抽奖的业务逻辑\n    await _module.InvokeVoidAsync(\"draw\", _lotteryNo);\n\
  \  }\n\n  [JSInvokable(\"display\")]\n  public void DisplayResult(string result)\n\
  \  {\n    _resultClasses = string.Empty;\n    _lotteryResult = result;\n    StateHasChanged();\n\
  \  }\n}\n```\n\n当页面首次渲染时，导入相应的 JavaScript 文件并像上一个节那样调用 `getRef` JavaScript 函数。JavaScript\
  \ 端应在变量 `reference` 中持有 `.NET` 类实例的引用。接下来，当客户点击“抽奖”按钮时，它将调用代码中的 C# `DrawAsync` 方法，随后将调用\
  \ JavaScript `draw` 函数。在 `draw` 函数中，使用第三方算法来判断客户是否为获奖者。它将通过调用暴露的 `.NET` 实例方法 `DisplayResult`\
  \ 来显示结果。\n\n\n\n\n\n```csharp\nprivate async void DrawAsync()\n{\n    // 抽奖的业务逻辑\n\
  \    await _module.InvokeVoidAsync(\"draw\", _lotteryNo, _audio);\n}\n```\n\n随后将修改相应的\
  \ JavaScript 函数，以接收 `<audio>` 元素并在产生奖者时播放音乐：\n\n```javascript\nfunction internalDraw(number,\
  \ audio) {\n  var result = 'Thank you for your purchasing!';\n  if (number === 'winner')\
  \ {\n    result = 'Congratulations! You win a FREE item!'\n    audio.play();\n \
  \ }\n  return result;\n}\n\nexport function draw(number, audio) {\n  var result\
  \ = internalDraw(number, audio);\n  reference.invokeMethodAsync('display', result);\n\
  }\n```\n\n运行应用程序，在抽奖页面输入中奖者，并点击 `Draw` 按钮即可听到庆祝音乐播放。\n\n在 JavaScript 函数中处理元素引用时要小心。不要操作\
  \ DOM 的内容，因为这会与 Blazor 框架产生交互。如果这些 DOM 对象被 JavaScript 函数意外修改，Blazor 将失去对这些对象的跟踪，并可能导致运行时异常。\n\
  \n### 类型安全\n\n在 JavaScript 函数中，对象类型之间可以相互转换。相比之下，在 `.NET` 中观察到了相反的情况。允许的转换很少，开发者在传递数据时必须小心。例如，JavaScript\
  \ 中的 `Boolean` 必须映射到 .NET 中的 `Boolean`，JavaScript 中的 `number` 必须映射到 .NET 中的 `Int`、`Float`\
  \ 或 `Decimal`。\n\n如果使用得当，`JsonConverter` 属性对 .NET 和 JavaScript 之间的数据类型映射非常有帮助。如果将\
  \ .NET 中的枚举值传递给或从 JavaScript 函数中接收，在枚举类型上使用 `JsonConverter` 属性可以帮助突破枚举值只能作为整数传递的限制。\n\
  \n## 总结\n\n本章从 JavaScript 互操作中广泛使用的 JSON 序列化和反序列化开始。接着介绍了加载 JavaScript 脚本的不同方法，包括使用\
  \ JavaScript 初始化器的一种更具动态性和可定制的方法。接下来，本章介绍了如何在 .NET 代码中调用 JavaScript 函数，并解释了有助于维护健壮应用的\
  \ JavaScript 隔离技术。还讨论了调用暴露的 .NET 方法并将 .NET 类实例传递给 JavaScript。最后，读者学习了客户端浏览器中的缓存，并详细介绍了如何使用元素引用通过\
  \ JavaScript 互操作操作原生 HTML 元素，以及 JavaScript 和 .NET 之间值得注意的类型安全。\n\n在第 10 章中，将介绍 HTTP\
  \ 协议以及 Blazor WebAssembly 和 Blazor Server 与其他服务的通信。\n\n# 第 10 章：通过 HTTP 连接世界\n\n\
  ## 引言\n\n本章介绍了最常用的 HTTP 协议。HTTP 协议最初并非为如今广泛使用的微服务设计的，但它们很快成为了互联网上的热点。在 Blazor 框架中，HTTP\
  \ 是使用户可以使用应用程序的核心功能之一。现代应用程序不再孤立存在，它们必须连接到世界才能构建。对于 Blazor 而言，用户利用 `http client`\
  \ 通过 HTTP 协议与世界通信。在该框架中，有一个预定义的服务用于调用其他 API，因此用户也可以通过工厂类实例创建自定义的 `http client` 服务。\n\
  \n## \n\n本章讨论了以下主题：\n- 前端与后端分离\n- HTTP 协议\n- CORS\n- HttpClient\n- HttpClientFactory\n\
  - gRPC\n\n## 目标\n\n本章介绍了前端与后端代码及项目的分离，旨在帮助读者理解前后端最常用的通信协议——HTTP 协议。接下来，读者将理解应用程序通过\
  \ HTTP 协议与世界通信时，CORS 带来的限制和风险。`HttpClient` 和 `HttpClientFactory` 是应用程序与外界通信时使用的两个基本类型，读者将对它们的源代码进行分析。最后，读者将学习最流行的远程过程协议（RPC）之一以及定义数据传输格式和消息类型的\
  \ `.proto` 文件。\n\n## 前端与后端分离\n\n前端是客户将交互的用户界面集合。后端通常提供服务或暴露 API 以支持客户交互。关于前端和后端的分离一直存在长期的争论。用户倾向于将\
  \ Blazor WebAssembly 项目构建专门的前端应用，并将 Blazor Server 项目构建为前后端耦合的应用。\n\n前后端耦合项目带来了一些潜在的益处。由于前端和后端在同一个项目中，多个资源可以在这两个部分部分之间共享，并且由于后端\
  \ API 未暴露，可以保护它们免受各种攻击。耦合项目还提高了加载速度，因为前端和后端之间的通信间隙较少。通常，在构建小型项目时建议使用前后端耦合项目。或者，分离的前后端项目带来了更多的模块化和开发层。每个模块都可以独立地开发、测试和部署。随着项目的增长，维护一个单一的单体应用变得越来越困难。分离的项目允许在不同模块中应用不同的技术栈。当前端和后端分别部署时，它们之间的通信是支持客户交互所必要的。HTTP\
  \ 协议是当今应用程序中最流行的通信方式。\n\n## HTTP 协议\n\n运行 `ESShop.Assembly` 应用程序并打开一个带有开发者工具的常用浏览器。在浏览器中访问主页\
  \ `http://localhost:5117`，开发者工具中的网络（Network）标签页将显示发送到服务器的所有 `http` 请求（参见图 10.1），这是\
  \ EShop ：\n\n![](img/pg_217.jpg)\n\n图 10.1 向服务器发送的 HTTP 请求。\n\nHTTP 请求基于 HTTP 协议发送。该协议设计用于客户端和服务器之间的对话，最初用于检索静态资源。HTTP\
  \ 请求由客户端（在示例中为浏览器）发起，每个请求仅包含消息，服务器将对该请求做出响应。\n\nHTTP 请求通过专门的 HTTP 方法发送。HTTP 方法定义了客户端希望服务器执行的操作。常见的\
  \ HTTP 方法有 `GET`、`POST`、`PATCH`、`PUT` 和 `DELETE`。`GET` 方法通常用于从服务器检索资源。在图 10.1 中，名为\
  \ `app.css` 的请求是一个 `GET` 请求，服务器将响应 CSS 内容。当客户端想要在服务器上创建资源时使用 `POST` 方法。例如，当注册新客户时，用户将发送\
  \ `POST` 请求。`PATCH` 较少用于修改资源，而 `PUT` 方法用于用新资源替换目标资源。`DELETE` 请求根据其名称，用于删除目标资源。\n\
  \n除了 HTTP 方法外，HTTP 请求必须定义目标资源的路径。当浏览器发送请求以检索 `app.css` 时，对应的目标路径为 `/css/app.css`。如果请求根目录下的资源，路径则为一个斜杠\
  \ `/`。\n\n在 HTTP 方法之后，请求指定了用于与服务器通信的协议版本。最常用的版本是 `HTTP/1.1`，而 `HTTP/2` 设计旨在获得更好的性能，`HTTP/3`\
  \ 在底层将使用 `QUIC` 而不是 `TCP`。\n\n\n\n\n在介绍了 HTTP 方法、路径和协议版本之后，本章继续介绍 HTTP 头部（Headers）。头部本质上是键值对，允许在服务器和客户端之间进行额外的信息交换，这使得\
  \ HTTP 协议具有很强的扩展性。某些服务器和客户端之间可以对齐一个新的子协议以扩展功能。头部有为 RFC 标准保留的头部，以及服务器与客户端之间约定的自定义头部。头部名称不区分大小写，后面将跟着一个冒号（`:`）和相应的值。例如，`host`\
  \ 头部表示请求发送到的服务器。\n\n对于使用 `POST` 或 `PUT` 方法的请求，请求中通常有一个正体（body）。在 `POST` 请求中，客户端希望在服务器上创建一个新资源，而正体就是请求中指定的新资源。\n\
  \n考虑到以上所有内容，使用 `telnet` 向服务器发送原始（raw）HTTP 请求，并使用 `JSONPlaceholder` 作为虚造的 HTTP API\
  \ 提供者。\n\n在终端中，输入命令 `telnet jsonplaceholder.typicode.com 80`。现在，`telnet` 客户端将连接到目标服务器，如图\
  \ 10.2 所示。\n\n![](img/pg_218.jpg)\n图 10.2 使用 `telnet` 连接。\n\n接下来，输入一个原始 HTTP post\
  \ 请求并发送。在请求发送之前，连续两次 `Enter` 键，如图 10.3 所示。\n\n![](img/pg_219.jpg)\n图 10.3 发送 post\
  \ 请求。\n\n图 10.3 显示了指向目标路径 `/posts` 的服务器的 post 请求，包含两个头部和一个作为正体的 JSON 字符串。（提示：如果远程服务器在发送请求之前关闭连接，请提前在记事本中输入原始\
  \ HTTP 请求，然后将其粘贴此处。）\n\n几乎立即收到了服务器的响应，如图 10.4 所示。\n\n![](img/pg_219-1.jpg)\n图 10.4\
  \ 接收 post 响应。\n\nHTTP 响应的组成方式与 HTTP 请求类似。它首先指示协议版本，并带有一个状态码。之后是状态消息。有一些预定义的标准 RFC\
  \ 状态码和状态消息。例如，代码 `200` 表示请求成功，在图 10.4 中，`201` 表示所需的资源已成功创建。\n\n从图 10.4 中的第二行开始，其格式与请求完全相同。此外，服务器添加的头部比发送的请求更多，并带有\
  \ JSON 正体，这样客户端就能知道更多关于新创建资源的详细信息。\n\nHTTP 协议是无状态的，服务器不会在两个请求之间保留任何数据，即使这些请求是来自同一个客户端且连续接收的。得益于其扩展性，用户可以在请求之间建立连接。无状态\
  \ HTTP 协议的一个常见问题是，Web 应用程序通常是基于用户身份开发的，在用户注销之前必须保留这些身份。头部是存放此类连接的绝佳位置。解决此问题的方法之一使用\
  \ `cookies`。服务器将返回带有 `set-cookie` 头部的响应，包含 `cookie-name` 的值和 `cookie-value`，以及其他规则（如过期时间）。\n\
