  }\n.NewComment {\n  display: flex;\n  flex-direction: column;\n  width: 300px;\n\
  \  margin-top: 20px;\n  align-items: flex-start;\n}\n.NewCommentBtn {\n  margin-top:\
  \ 10px;\n}\n.Comments {\n  margin-top: 20px;\n}\n```\n\n接下来，构建一个用于显示购物商品的新页面。它显示了商品标题及其价格和描述。在左侧有一个卖家提供的图表，在右侧，客户可以对商品发表评论。目前，不要实现身份验证机制，也不要验证用户是否购买过这件\
  \ T 恤。基本上，任何人都可以发表该评论。请参考图 5.1 中的 `ShopItem` 页面。\n\n![](img/pg_104.jpg)\n\n图 5.1\
  \ ShopItem 页面。\n\n最后添加的是 `Shared` 文件夹下的 `NavMenu.razor` 导航菜单中的一个新页面，这样用户就可以点击左侧导航栏轻松导航到显示页面：\n\
  \n```razor\n@* some code *@\n<div class=\"nav-item px-3\">\n  <NavLink class=\"\
  nav-link\" href=\"cart\">\n    <span class=\"oi oi-list-rich\" aria-hidden=\"true\"\
  ></span>\n  购物车\n  </NavLink>\n</div>\n<div class=\"nav-item px-3\">\n  <NavLink\
  \ class=\"nav-link\" href=\"shop-item\">\n    <span class=\"oi oi-list-rich\" aria-hidden=\"\
  true\"></span>\n  商品\n  </NavLink>\n</div>\n@* some code *@\n```\n\n购物商品显示页的骨架几乎已经完成，只差图片上传部分。现在实现该部分，并看看\
  \ Blazor 自带的 `InputFile` 组件如何帮助实现这一点。\n\n删除硬编码的 `ImageUrl` 值，并使用 `Comment.cs` 构造函数中的参数：\n\
  \n```csharp\n// some code\npublic Comment(string content, string imageUrl)\n{\n\
