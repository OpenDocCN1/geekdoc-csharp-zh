    ### The Functional Wallet API: Engaging Warp Speed with Event Sourcing and MongoDB\n\
    \nWith our wallet agent, event sourcing, and MongoDB in place, it’s time to create\
    \ the functional wallet API using minimal hosting in ASP.NET Core. This will allow\
    \ us to harness the power of functional programming, event sourcing, and MongoDB\
    \ in a concise and expressive manner.\n\n```csharp\nusing Microsoft.AspNetCore.Builder;\n\
    using Microsoft.AspNetCore.Http;\nusing Microsoft.Extensions.DependencyInjection;\n\
    \nvar builder = WebApplication.CreateBuilder(args);\n\nbuilder.Services.AddSingleton<WalletEventRepository>(new\
    \ WalletEventRepository(\"mongodb://localhost:27017\", \"wallet\", \"events\"\
    ));\n\nbuilder.Services.AddSingleton<WalletAgent>();\n\nvar app = builder.Build();\n\
    \napp.MapPost(\"/api/wallet/add\", async (WalletAgent walletAgent, decimal amount)\
    \ =>\n{\n    var newEvents = await walletAgent.AddMoney(amount);\n    return Results.Ok(newEvents);\n\
    });\n\napp.MapPost(\"/api/wallet/remove\", async (WalletAgent walletAgent, decimal\
    \ amount) =>\n{\n    var newEvents = await walletAgent.RemoveMoney(amount);\n\
    \    return Results.Ok(newEvents);\n});\n\napp.MapGet(\"/api/wallet/balance\"\
    , async (WalletAgent walletAgent) =>\n{\n    var balance = await walletAgent.GetBalance();\n\
    \    return Results.Ok(balance);\n});\n\napp.Run();\n```\n\nIn this example, we’ve\
    \ combined functional programming techniques with minimal hosting, event sourcing,\
    \ and MongoDB to create a modern and expressive web application. By using event\
    \ sourcing and functional programming principles, our wallet API can be easily\
    \ maintained and scaled as needed.\n\n### Boldly Going Forward\n\nAs we conclude\
    \ our sci-fi-inspired adventure into the world of functional web development,\
    \ remember that functional programming is not just a set of tools or techniques,\
    \ but a mindset that can help us write more robust, maintainable, and elegant\
    \ code. So, engage your warp drive, explore the vast universe of functional programming\
    \ in C#, and let the stars be your guide on this exciting journey.\n\n### 11.2.\
    \ Data Processing and Analysis with Functional Programming\n\nIn this section,\
    \ we will explore how functional programming techniques can be applied to data\
    \ processing and analysis tasks in C#. We’ll be using `Language-Ext` and the MongoDB\
    \ C# driver to create a simple data processing pipeline that demonstrates the\
    \ benefits of functional programming in this context.\n\nBefore we begin, ensure\
    \ that you have installed the necessary NuGet packages:\n\n```bash\nInstall-Package\
    \ LanguageExt.Core\nInstall-Package MongoDB.Driver\n```\n\nIn this example, we\
    \ will work with a simple data model representing a collection of products:\n\n\
    ```csharp\npublic class Product\n{\n    public ObjectId Id { get; set; }\n   \
    \ public string Name { get; set; }\n    public decimal Price { get; set; }\n \
    \   public string Category { get; set; }\n}\n```\n\nLet’s assume we have a MongoDB\
    \ collection containing product data, and we want to perform the following tasks:\n\
    \n* Retrieve all products from the database.\n* Filter products by a specific\
    \ category.\n* Calculate the average price of products.\n\nWe’ll begin by establishing\
    \ a connection to the database and retrieving product data:\n\n```csharp\nusing\
    \ MongoDB.Bson;\nusing MongoDB.Driver;\n\nIMongoClient client = new MongoClient(\"\
    mongodb://localhost:27017\");\nIMongoDatabase database = client.GetDatabase(\"\
    test\");\nIMongoCollection<Product> collection = database.GetCollection<Product>(\"\
    products\");\n\nList<Product> products = await collection.Find(_ => true).ToListAsync();\n\
    ```\n\nWith the data in hand, we can now use `Language-Ext` to create our processing\
    \ pipeline:\n\n```csharp\nusing LanguageExt;\nusing static LanguageExt.Prelude;\n\
    \ndecimal AveragePrice(IEnumerable<Product> products)\n{\n    return products.Any()\
    \ ? products.Average(p => p.Price) : 0m;\n}\n\nOption<decimal> CalculateAverageByCategory(IEnumerable<Product>\
    \ products, string category)\n{\n    return products\n        .Where(p => p.Category\
    \ == category)\n        .ToOption()\n        .Map(AveragePrice);\n}\n\nvar averagePrice\
    \ = CalculateAverageByCategory(products, \"Electronics\")\n    .Match(\n     \
    \   price => $\"Average price: {price}\",\n        () => \"No products found\"\
    \n    );\n\nConsole.WriteLine(averagePrice);\n```\n\nIn this example, we define\
    \ `CalculateAverageByCategory` which takes `IEnumerable<Product>` and a `string`,\
    \ returning an `Option<decimal>`. We use the `Option` monad to handle the possibility\
    \ of having no products.\n\nTo demonstrate the use of agents in data processing,\
    \ we will now introduce agents to handle shared mutable state safely. First, let’s\
    \ install the necessary NuGet package:\n\n```bash\nInstall-Package Microsoft.AspNetCore.Diagnostics\n\
    ```\n\nNow, we’ll create an agent that receives requests concurrently:\n\n```csharp\n\
    using LanguageExt;\nusing static LanguageExt.Prelude;\n\nrecord AveragePriceRequest(string\
    \ Category, IObserver<decimal?> Response);\n\nAgent<AveragePriceRequest> CreateAveragePriceAgent(IEnumerable<Product>\
    \ products)\n{\n    return Agent.Start<AveragePriceRequest>(async request =>\n\
    \    {\n        var averagePrice = CalculateAverageByCategory(products, request.Category);\n\
    \        await request.Response.OnNextAsync(averagePrice.ToNullable());\n    });\n\
    }\n```\n\nNow, let’s create a minimal API that exposes this functionality:\n\n\
    ```csharp\nusing Microsoft.AspNetCore.Builder;\nusing Microsoft.Extensions.DependencyInjection;\n\
    \nvar builder = WebApplication.CreateBuilder(args);\nvar app = builder.Build();\n\
    \napp.UseRouting();\n\nvar products = await FetchProductsAsync(); // Assume this\
    \ function fetches products from the database\n\nvar averagePriceAgent = CreateAveragePriceAgent(products);\n\
    \napp.MapGet(\"/api/average-price/{category}\", async (string category, IObserver<decimal?>\
    \ response) =>\n{\n    var request = new AveragePriceRequest(category, response);\n\
    \    averagePriceAgent.Tell(request);\n    await Task.CompletedTask;\n});\n\n\
    app.UseEndpoints(endpoints => endpoints.MapControllers());\n\nawait app.RunAsync();\n\
    ```\n\nIn this example, we create a minimal API with a single GET endpoint that\
    \ calculates the average price by category using the `averagePriceAgent`. The\
    \ agent processes incoming requests concurrently, ensuring that the API remains\
    \ responsive even under heavy load.\n\nUsing agents in the previous example brings\
    \ several benefits, especially when dealing with concurrent data processing tasks.\
    \ Some of the main advantages of using agents include:\n\n* Safe management of\
    \ shared mutable state: Agents encapsulate the shared state and allow safe access\
    \ and modification. They process messages sequentially and provide exclusive access\
    \ to the state, which eliminates race conditions and synchronization issues without\
    \ the need for locks or complex concurrency mechanisms.\n"
