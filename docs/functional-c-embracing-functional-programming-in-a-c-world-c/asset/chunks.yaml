  trans: "\n\n# 释放判别联合的威力\n\n在我们结束对判别联合（discinated unions）的探索时，我们可以看到它们在函数式 C# 代码中是多么多变且强大的。通过将判别联合与模式匹配等函数式编程技术相结合，我们可以以一种清晰、且且易于维护的方式来建模复杂的数据和行为。\n\
    \n现在，你已经体验了判别联合的魅力，准备好用你新掌握的函数式 C# 能力来应对更具挑战性和复杂的问题了。所以，放去创造吧，创建你自己的动物园、表达式和角色状态——在你的项目中释放判别联合的全部潜力。编码愉快！\n\
    \n## 4.4 解构\n\n解构是 C# 中的一项强大功能，允许你将复杂的数据结构拆分为各个单独的部分。这就像打开一盒什锦巧克力并挑选出你喜喜欢的那些。在本章中，我们将深入解构的世界，揭开元组（tuples）、记录（records）以及其他内容的谜。\n\
    \n### 4.4.1 解构元组\n\nC# 中的元组是简单、轻量级的数据结构，可以包含多个值。它们通常用于将相关数据组合在一起。解构元组意味着将其各个元素提取到单独的变量中。这里有一个简单的示例：\n\
    \n```csharp\nvar person = (Name: \"Alice\", Age: 30);\n\n// 解构元组\n(string name,\
    \ int age) = person;\n\nConsole.WriteLine($\"Name: {name}, Age: {age}\");\n```\n\
    \n在这个示例中，我们创建了一个包含两个命名元素：`Name` 和 `Age` 的元组 `person`。然后，我们使用解构语法将元组解构为两个独立的变量：`name`\
    \ 和 `age`。\n\n### 4.4.2 解构记录\n\n记录（Records）与元组一样，是 C# 中用于组合相关数据的数据结构。它们在 C# 9\
    \ 中引入，提供了一种创建更复杂的不可变数据结构的方法。要解构一个记录，你需要在记录内部定义一个 `Deconstruct` 方法。让我们来看示例：\n\n\
    ```csharp\npublic record Car(string Make, string Model, int Year)\n{\n    public\
    \ void Deconstruct(out string make, out string model, out int year)\n    {\n \
    \       make = Make;\n        model = Model;\n        year = Year;\n    }\n}\n\
    \nvar myCar = new Car(\"Tesla\", \"Model S\", 2022);\n\n// 解构记录\n(string make,\
    \ string model, int year) = myCar;\n\nConsole.WriteLine($\"Make: {make}, Model:\
    \ {model}, Year: {year}\");\n```\n\n在这个示例中，我们定义了一个名为 `Car` 的记录，包含一个接受三个 `out`\
    \ 参数的 `Deconstruct` 方法。然后我们创建了 `Car` 的实例并将其解构为三个独立的变量：`make`、`model` 和 `year`。\n\
    \n### 4.4.3 使用模式解构\n\n模式匹配（Pattern matching）是 C# 中的一项强大功能，允许你根据数据的形状来匹配和解构数据结构。解构可以与模式匹配结合，创建更具表现力且灵活的代码。这里有一个示例：\n\
    \n```csharp\npublic abstract record Shape;\npublic record Circle(double Radius)\
    \ : Shape;\npublic record Rectangle(double Width, double Height) : Shape;\n\n\
    public static double CalculateArea(Shape shape) => shape switch\n{\n    Circle(var\
    \ radius) => Math.PI * radius * radius,\n    Rectangle(var width, var height)\
    \ => width * height,\n    _ => throw new NotSupportedException(\"Unknown shape\"\
    )\n};\n\nvar myCircle = new Circle(5);\nvar myRectangle = new Rectangle(3, 4);\n\
    \nConsole.WriteLine($\"Circle area: {CalculateArea(myCircle)}\");\nConsole.WriteLine($\"\
    Rectangle area: {CalculateArea(myRectangle)}\");\n```\n\n在这个示例中，我们定义了一个抽象记录 `Shape`\
    \ 和两个派生记录：`Circle` 和 `Rectangle`。然后我们创建了一个方法 `CalculateArea`，它使用模式匹配和解构根据类型计算形状的面积。\n\
    \n### 4.4.4 使用扩展方法解构\n\n如果你想解构一个你无法控制的类或结构体，可以使用扩展方法来添加解构功能。这里有一个解构 `KeyValuePair<TKey,\
    \ TValue>` 的示例：\n\n```csharp\npublic static class KeyValuePairExtensions\n{\n\
    \    public static void Deconstruct<TKey, TValue>(this KeyValuePair<TKey, TValue>\
    \ kvp, out TKey key, out TValue value)\n    {\n        key = kvp.Key;\n      \
    \  value = kvp.Value;\n    }\n}\n\nvar dictionary = new Dictionary<string, int>\
    \ { { \"apple\", 5 }, { \"banana\", 3 } };\nforeach (var (key, value) in dictionary)\n\
    {\n    Console.WriteLine($\"Key: {key}, Value: {value}\");\n}\n```\n\n在这个示例中，我们为\
    \ `KeyValuePair<TKey, TValue>` 定义了扩展方法 `Deconstruct`，它接受两个 `out` 参数。这允许我们在遍历字典时，直接在\
    \ `foreach` 循环中解构 `KeyValuePair` 的实例。\n\n### 4.4.5 解构的注意事项与技巧\n\n虽然解构是一个实用的工具，但在使用时有些点需要注意：\n\
    \n- 解构不仅限于元组和记录；你可以解构任何拥有 `Deconstruct` 方法的类或结构体。\n- 在定义 `Deconstruct` 方法时，请注意\
    \ `out` 参数的顺序。\n\n## 5.1 递归：掌握自引用的艺术\n\n递归是一种本质的技术，函数通过调用自己来解决更小的问题。让我们查看阶阶的经典示例：\n\
    \n```csharp\nusing System;\n\nclass Program\n{\n    static int Factorial(int n)\n\
    \    {\n        if (n == 1)\n        {\n            return 1;\n        }\n   \
    \     else\n        {\n            return n * Factorial(n - 1);\n        }\n \
    \   }\n\n    static void Main()\n    {\n        int number = 5;\n        Console.WriteLine($\"\
    The factorial of {number} is {Factorial(number)}\");\n    }\n}\n```\n\n在这个示例中，`Factorial()`\
    \ 函数计算给定数字 `n` 的阶乘。基础情况是 `n` 等于 1，递归情况是函数带有参数 `n - 1` 调用自身，向基础情况靠拢。\n\n另一个例子是斐波那契数列，每个数字都是前两个数字之和。这里是一个使用递归的\
    \ C# 实现：\n\n```csharp\nusing System;\n\nclass Program\n{\n    static int Fibonacci(int\
    \ n)\n    {\n        if (n == 0)\n        {\n            return 0;\n        }\n\
    \        else if (n == 1)\n        {\n            return 1;\n        }\n     \
    \   else\n        {\n            return Fibonacci(n - 1) + Fibonacci(n - 2);\n\
    \        }\n    }\n\n    static void Main()\n    {\n        int position = 10;\n\
    \        Console.WriteLine($\"The {position}th number in the Fibonacci sequence\
    \ is {Fibonacci(position)}\");\n    }\n}\n```\n\n"
- fmt: "\nIn this example, the base cases are when `n` equals 0 or 1, and the function\
    \ returns the corresponding values. The recursive case is when the function calls\
    \ itself twice, once with the argument `n - 1` and once with `n - 2`, to calculate\
    \ the sum of the preceding two numbers.\n\nDespite its power, recursion has some\
    \ drawbacks. It can lead to performance issues due to the overhead of function\
    \ calls and potential stack overflows. To mitigate these issues, a technique called\
    \ “tail recursion” can be used, where the recursive call is the last operation\
    \ performed in the function. This allows the compiler to optimize the code and\
    \ avoid stack overflows. Here’s the factorial example with tail recursion:\n\n\
    ```csharp\nusing System;\n\nclass Program\n{\n    static int TailRecursiveFactorial(int\
    \ n, int accumulator = 1)\n    {\n        if (n == 1)\n        {\n           \
    \ return accumulator;\n        }\n        else\n        {\n            return\
    \ TailRecursiveFactorial(n - 1, accumulator * n);\n        }\n    }\n    static\
    \ void Main()\n    {\n        int number = 5;\n        Console.WriteLine($\"The\
    \ factorial of {number} is {TailRecursiveFactorial(number)}\");\n    }\n}\n```\n\
    \nIn this example, we introduced an `accumulator` parameter that holds the result\
    \ so far. This change allows the compiler to optimize the function calls and prevent\
    \ stack overflows.\n\nNow that we’ve delved into recursion, we’ll move on to another\
    \ functional programming technique: Currying and Partial Application.\n\n# Chapter\
    \ 5: Currying and Partial Application: The Art of Splitting Functions\n\nCurrying\
    \ and Partial Application are like remixing your favorite rock tunes. You take\
    \ an original track, split it into smaller pieces, and rearrange them to create\
    \ something fresh and exciting. In functional programming, these techniques enable\
    \ you to break down complex functions into simpler ones and reuse code more effectively.\n\
    \nCurrying is the process of transforming a function that takes multiple arguments\
    \ into a series of functions that each take a single argument. This technique\
    \ can make your code more flexible and easier to compose.\n\nLet’s start with\
    \ a simple example. We’ll create a function that calculates the total price of\
    \ a product after applying a discount and adding tax. Here’s the original, non-curried\
    \ version:\n\n```csharp\nusing System;\n\nclass Program\n{\n    static decimal\
    \ CalculateTotalPrice(decimal price, decimal discount, decimal tax)\n    {\n \
    \       decimal discountedPrice = price * (1 - discount);\n        return discountedPrice\
    \ * (1 + tax);\n    }\n    static void Main()\n    {\n        decimal price =\
    \ 100;\n        decimal discount = 0.1m;\n        decimal tax = 0.2m;\n      \
    \  Console.WriteLine($\"The total price is {CalculateTotalPrice(price, discount,\
    \ tax)}\");\n    }\n}\n```\n\nNow, let’s curry the `CalculateTotalPrice()` function:\n\
    \n```csharp\nusing System;\n\nclass Program\n{\n    static Func<decimal, Func<decimal,\
    \ Func<decimal, decimal>>> CurriedCalculateTotalPrice =>\n    price => discount\
    \ => tax => price * (1 - discount) * (1 + tax);\n    static void Main()\n    {\n\
    \        decimal price = 100;\n        decimal discount = 0.1m;\n        decimal\
    \ tax = 0.2m;\n        var applyPrice = CurriedCalculateTotalPrice(price);\n \
    \       var applyDiscount = applyPrice(discount);\n        var calculateTotal\
    \ = applyDiscount(tax);\n        Console.WriteLine($\"The total price is {calculateTotal}\"\
    );\n    }\n}\n```\n\nIn this example, we transformed the `CalculateTotalPrice()`\
    \ function into a series of functions using the currying technique. Each function\
    \ takes a single argument and returns another function, eventually calculating\
    \ the total price.\n\nPartial Application is a technique that involves fixing\
    \ a number of arguments in a function, generating a new function with fewer arguments.\
    \ This allows you to create reusable and specialized functions.\n\nLet’s create\
    \ a library that provides a nice way to use currying with extension methods. We’ll\
    \ implement a generic currying method:\n\n```csharp\npublic static class Curry\n\
    {\n    public static Func<T2, Func<T3, TResult>> Curry<T1, T2, T3, TResult>(this\
    \ Func<T1, T2, T3, TResult> func, T1 arg1)\n    {\n        return arg2 => arg3\
    \ => func(arg1, arg2, arg3);\n    }\n}\n```\n\nNow, let’s use this extension method\
    \ to curry the `CalculateTotalPrice()` function:\n\n```csharp\nusing System;\n\
    using CurryLibrary;\n\nclass Program\n{\n    static decimal CalculateTotalPrice(decimal\
    \ price, decimal discount, decimal tax)\n    {\n        decimal discountedPrice\
    \ = price * (1 - discount);\n        return discountedPrice * (1 + tax);\n   \
    \ }\n    static void Main()\n    {\n        decimal price = 100;\n        decimal\
    \ discount = 0.1m;\n        decimal tax = 0.2m;\n        var curriedCalculateTotalPrice\
    \ = ((Func<decimal, decimal, decimal, decimal>)CalculateTotalPrice).Curry(price);\n\
    \        var applyDiscount = curriedCalculateTotalPrice(discount);\n        var\
    \ calculateTotal = applyDiscount(tax);\n        Console.WriteLine($\"The total\
    \ price is {calculateTotal}\");\n    }\n}\n```\n\nIn this example, we used the\
    \ `Curry()` extension method to curry the `CalculateTotalPrice()` function. The\
    \ advantage of this approach is that you can curry any function with three arguments\
    \ without having to change its implementation.\n\nNow, let’s explore a use case\
    \ for Partial Application. Imagine you have a comic book store, and you want to\
    \ apply a 10% discount to all Marvel comics. You can use Partial Application to\
    \ create a specialized function that applies this discount:\n\n```csharp\npublic\
    \ static class PartialApplicationExtensions\n{\n    public static Func<T2, TResult>\
    \ Apply<T1, T2, TResult>(this Func<T1, T2, TResult> func, T1 arg1)\n    {\n  \
    \      return arg2 => func(arg1, arg2);\n    }\n}\n```\n\nUsing the `Apply()`\
    \ extension method, we can create a specialized function that applies 10% discount:\n\
    \n```csharp\nusing System;\nusing CurryLibrary;\n\nclass Program\n{\n    static\
    \ decimal ApplyDiscount(decimal discount, decimal price)\n    {\n        return\
    \ price * (1 - discount);\n    }\n    static void Main()\n    {\n        decimal\
    \ price = 100;\n        decimal discount = 0.1m;\n        var applyMarvelDiscount\
    \ = ((Func<decimal, decimal, decimal>)ApplyDiscount).Apply(discount);\n      \
    \  var discountedPrice = applyMarvelDiscount(price);\n        Console.WriteLine($\"\
    The discounted price is {discountedPrice}\");\n    }\n}\n```\n\nIn this example,\
    \ we used the `Apply()` extension method to fix the discount argument in the `ApplyDiscount()`\
    \ function, creating a specialized function that applies a 10% discount to any\
    \ price.\n\nCurrying and Partial Application are like the dynamic duo of functional\
    \ programming, allowing you to break down complex functions into simpler, reusable\
    \ components. By mastering these techniques, you can create harmony in your code\
    \ and build more robust, maintainable applications.\n\nIn the next section, we’ll\
    \ explore another powerful functional programming technique: Lazy Evaluation.\n\
    \n## 5.3. Lazy Evaluation: The Art of Procrastination\n\nIn the world of functional\
    \ programming, Lazy Evaluation is like a favorite pastime, akin to binge-watching\
    \ your favorite Star Trek series. Just as you might postpone chores to enjoy your\
    \ favorite show, Lazy Evaluation defers the execution of a computation until its\
    \ result is actually needed.\n\nLazy Evaluation can improve performance by avoiding\
    \ unnecessary calculations and reducing memory usage. In C#, you can achieve Lazy\
    \ Evaluation using the `Lazy` class or by working with lazy sequences through\
    \ LINQ’s deferred execution.\n\nLet’s dive into some examples to see Lazy Evaluation\
    \ in action.\n\n### 5.3.1. Using the Lazy Class\n\nThe `Lazy` class allows you\
    \ to defer the initialization of an object until it’s accessed for the first time.\
    \ This can be particularly useful when creating expensive resources, like large\
    \ data structures or network connections.\n"
