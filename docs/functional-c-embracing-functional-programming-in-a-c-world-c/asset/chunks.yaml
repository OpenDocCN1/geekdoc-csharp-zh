  trans: "\n\n请注意，我们不再需要 `async` 和 `await` 关键字，因为 `Bind` 方法在后台处理了异步性。这是一个展示函数式编程如何帮助我们编写更整洁、更易维护的代码，同时利用\
    \ C# 强大的异步特性的示例。\n\n## 8.2. 异步函数式流水线\n\n在上一节中，我们查看了如何使用 `Task` 单元和 `Bind` 方法以函数式风格编写异步代码。现在，让我们扩展这一概念，使用\
    \ LINQ 查询语法构建异步函数式流水线。\n\n首先，我们将为 `Task` 创建几个扩展方法，这将允许我们在异步操作中使用 LINQ 查询语法：\n\n\
    ```csharp\npublic static class TaskExtensions\n{\n    public static async Task<TResult>\
    \ Select<TSource, TResult>(this Task<TSource> task, Func<TSource, TResult> selector)\n\
    \    {\n        var source = await task.ConfigureAwait(false);\n        return\
    \ selector(source);\n    }\n\n    public static async Task<TResult> SelectMany<TSource,\
    \ TResult>(this Task<TSource> task, Func<TSource, Task<TResult>> selector)\n \
    \   {\n        var source = await task.ConfigureAwait(false);\n        return\
    \ await selector(source).ConfigureAwait(false);\n    }\n\n    public static async\
    \ Task<TResult> SelectMany<TSource, TCollection, TResult>(this Task<TSource> task,\
    \ Func<TSource, Task<TCollection>> collectionSelector, Func<TSource, TCollection,\
    \ TResult> resultSelector)\n    {\n        var source = await task.ConfigureAwait(false);\n\
    \        var collection = await collectionSelector(source).ConfigureAwait(false);\n\
    \        return resultSelector(source, collection);\n    }\n}\n```\n\n这些扩展方法（`Select`、`SelectMany`\
    \ 以及带有结果选择器的 `SelectMany` 重载）使我们能够对 `Task` 使用 LINQ 查询语法。现在，让我们使用这些扩展创建一个复杂的银行相关的示例。\n\
    \n假设我们有一个银行系统，它需要异步获取客户数据、账户数据和最近交易。我们将使用以下类来表示我们的数据：\n\n```csharp\npublic class\
    \ Customer\n{\n    public int Id { get; set; }\n    public string Name { get;\
    \ set; }\n}\n\npublic class Account\n{\n    public int Id { get; set; }\n    public\
    \ decimal Balance { get; set; }\n}\n\npublic class Transaction\n{\n    public\
    \ int Id { get; set; }\n    public decimal Amount { get; set; }\n    public DateTime\
    \ Date { get; set; }\n}\n```\n\n现在，让我们创建模拟异步获取这些数据的方法：\n\n```csharp\npublic async\
    \ Task<Customer> GetCustomerAsync(int customerId)\n{\n    // 模拟异步获取客户数据\n    await\
    \ Task.Delay(100);\n    return new Customer { Id = customerId, Name = \"John Doe\"\
    \ };\n}\n\npublic async Task<Account> GetAccountAsync(int accountId)\n{\n    //\
    \ 模拟异步获取账户数据\n    await Task.Delay(100);\n    return new Account { Id = accountId,\
    \ Balance = 5000 };\n}\n\npublic async Task<List<Transaction>> GetRecentTransactionsAsync(int\
    \ accountId)\n{\n    // 模拟异步获取最近交易\n    await Task.Delay(100);\n    return new\
    \ List<Transaction>\n    {\n        new Transaction { Id = 1, Amount = -100, Date\
    \ = DateTime.UtcNow.AddDays(-1) },\n        new Transaction { Id = 2, Amount =\
    \ 200, Date = DateTime.UtcNow.AddDays(-2) },\n        new Transaction { Id = 3,\
    \ Amount = -50, Date = DateTime.UtcNow.AddDays(-3) }\n    };\n}\n```\n\n现在，让我们使用我们的\
    \ `Task` 扩展方法和 LINQ 查询语法构建一个异步函数式流水线：\n\n```csharp\npublic async Task<(Customer,\
    \ Account, List<Transaction>)> FetchCustomerAccountDataAsync(int customerId, int\
    \ accountId)\n{\n    var result = await (from customer in GetCustomerAsync(customerId)\n\
    \                        from account in GetAccountAsync(accountId)\n        \
    \                from transactions in GetRecentTransactionsAsync(accountId)\n\
    \                        select (customer, account, transactions));\n    return\
    \ result;\n}\n```\n\n在 `FetchCustomerAccountDataAsync` 方法中，我们使用 LINQ 查询语法结合扩展方法组合了客户数据、账户数据和最近交易的获取。这允许我们创建一个既可读又易于维护的异步流水线。\n\
    \n现在，让我们使用我们的流水线创建另一个示例。这次，我们将过滤超过阈值的最近交易：\n\n```csharp\npublic async Task<(Customer,\
    \ Account, List<Transaction>)> FetchFilteredAccountDataAsync(int customerId, int\
    \ accountId, decimal threshold)\n{\n    var result = await (from customer in GetCustomerAsync(customerId)\n\
    \                        from account in GetAccountAsync(accountId)\n        \
    \                from transactions in GetRecentTransactionsAsync(accountId)\n\
    \                        let filteredTransactions = transactions.Where(t => Math.Abs(t.Amount)\
    \ > threshold).ToList()\n                        select (customer, account, filteredTransactions));\n\
    \    return result;\n}\n```\n\n在此方法中，我们在 LINQ 查询中添加了一个新步骤，在返回结果之前对交易进行过滤。`let`\
    \ 关键字允许我们引入一个 `filteredTransactions` 变量，该变量持有过滤后的列表。`Where` 函数用于根据给定的阈值过滤交易。\n\
    \n现在我们已经看到了如何使用 LINQ 语法构建异步流水线，让我们来探索如何在这些流水线中处理错误。在函数式世界中，`Result` 类型（也称为 Either\
    \ 单元）通常用于表示可能失败的结果。为了在我们的流水线集成 `Result` 类型，让我们创建一个表示可能失败的异步计算的 `TaskResult<T>`：\n\
    \n```csharp\npublic class TaskResult<T>\n{\n    public Task<T> Value { get; }\n\
    \    public TaskResult(Task<T> value)\n    {\n        Value = value;\n    }\n\
    }\n```\n\n现在，我们可以为 `TaskResult` 类创建类似于 `Task` 扩展方法的扩展方法。这将允许我们以函数式方式处理流水线中的错误。\n\
    \n```csharp\npublic static class TaskResultExtensions\n{\n    public static async\
    \ TaskResult<TResult> Select<TSource, TResult>(this TaskResult<TSource> taskResult,\
    \ Func<TSource, TResult> selector)\n    {\n        var result = await taskResult.Value.ConfigureAwait(false);\n\
    \        return result.Success\n            ? new TaskResult<TResult>(Task.FromResult(new\
    \ Result<TResult>(selector(result.Value))))\n            : new TaskResult<TResult>(Task.FromResult(new\
    \ Result<TResult>(result.ErrorMessage)));\n    }\n\n    public static async TaskResult<TResult>\
    \ SelectMany<TSource, TResult>(this TaskResult<TSource> taskResult, Func<TSource,\
    \ TaskResult<TResult>> selector)\n    {\n        var result = await taskResult.Value.ConfigureAwait(false);\n\
    \        return result.Success\n            ? selector(result.Value)\n       \
    \     : new TaskResult<TResult>(Task.FromResult(new Result<TResult>(result.ErrorMessage)));\n\
    \    }\n\n    public static async TaskResult<TResult> SelectMany<TSource, TCollection,\
    \ TResult>(this TaskResult<TSource> taskResult, Func<TSource, TaskResult<TCollection>>\
    \ collectionSelector, Func<TSource, TCollection, TResult> resultSelector)\n  \
    \  {\n        var result = await taskResult.Value.ConfigureAwait(false);\n   \
    \     if (result.Success)\n        {\n            var source = result.Value;\n\
    \            var collectionResult = await collectionSelector(source).Value.ConfigureAwait(false);\n\
    \            return collectionResult.Success\n                ? new TaskResult<TResult>(Task.FromResult(new\
    \ Result<TResult>(resultSelector(source, collectionResult.Value))))\n        \
    \        : new TaskResult<TResult>(Task.FromResult(new Result<TResult>(collectionResult.ErrorMessage)));\n\
    \        }\n        else\n        {\n            return new TaskResult<TResult>(Task.FromResult(new\
    \ Result<TResult>(result.ErrorMessage)));\n        }\n    }\n}\n```\n\n"
- fmt: "\nNow that we have the `TaskResultExtensions`, let’s create a new example\
    \ that uses these extension methods to build an asynchronous functional pipeline\
    \ with error handling.\n\n```csharp\npublic async Task<Result<(Customer, Account,\
    \ List<Transaction>)>> FetchCustomerAccountDataAsync(int customerId, int accountId)\n\
    {\n    var result = await (from customerResult in GetCustomerAsync(customerId)\n\
    \                        from accountResult in GetAccountAsync(accountId)\n  \
    \                      from transactionsResult in GetRecentTransactionsAsync(accountId)\n\
    \                        select (customerResult, accountResult, transactionsResult));\n\
    \n    return result.IsSuccess\n      ? new Result<(Customer, Account, List<Transaction>)>((result.Value.Item1,\
    \ result.Value.Item2, result.Value.Item3))\n      : new Result<(Customer, Account,\
    \ List<Transaction>)>(result.ErrorMessage);\n}\n```\n\nIn this example, we build\
    \ an asynchronous functional pipeline that fetches customer data, account data,\
    \ and recent transactions using LINQ query syntax with `TaskResult` and the `TaskResultExtensions`.\
    \ If an error occurs in any of the operations, the pipeline returns a `Result<(Customer,\
    \ Account, List)>` with the error message. Otherwise, it returns a successful\
    \ result with the fetched data.\n\nThe `TaskResultExtensions` enable us to create\
    \ asynchronous functional pipelines that handle errors in a functional way, making\
    \ the code more readable and maintainable. It promotes the separation of concerns,\
    \ as each method in the pipeline is responsible for its error handling, and makes\
    \ it easier to deal with different types of errors that may occur during asynchronous\
    \ operations.\n\nIn conclusion, building asynchronous functional pipelines using\
    \ LINQ query syntax and Task extension methods allows for more concise, readable,\
    \ and maintainable code. It also promotes the separation of concerns and makes\
    \ it easier to handle errors in a functional way. By extending this approach to\
    \ handle the `Result` type, we can create robust and efficient asynchronous pipelines\
    \ in C#.\n\n## 8.3 Handling Errors Asynchronously\n\nIn this section, we will\
    \ explore handling errors asynchronously in functional C#. Asynchronous programming\
    \ is an essential aspect of modern software development, allowing us to perform\
    \ non-blocking I/O operations while freeing up resources. In functional programming,\
    \ we typically handle errors using monadic structures like `Either`, `Option`,\
    \ or `Result`.\n\nTo facilitate this, we will use the `Functional-Ext` library,\
    \ which provides several useful utilities and extensions to make functional programming\
    \ with C# more convenient. The library will be explained in more detail in Chapter\
    \ 10.\n\n### 8.3.1 Asynchronous Error Handling with Result\n\n`Result` is a monadic\
    \ structure that represents the outcome of a computation that may result in a\
    \ success or an error. It can hold either a successful value or an error. In asynchronous\
    \ programming, we can use `Result` combined with `Task` to handle errors in an\
    \ async/await-friendly way.\n\nConsider the following example, where we have a\
    \ function that might throw an exception:\n\n```csharp\nasync Task<string> LoadDataAsync(string\
    \ url)\n{\n    // Load data from the URL and return the result as a string\n}\n\
    ```\n\nTo handle errors in a functional way, we can wrap the return type in a\
    \ `Result`:\n\n```csharp\nusing Functional;\nusing System.Threading.Tasks;\n\n\
    async Task<Result<string, Exception>> LoadDataResultAsync(string url)\n{\n   \
    \ try\n    {\n        var data = await LoadDataAsync(url);\n        return Result.Ok<string,\
    \ Exception>(data);\n    }\n    catch (Exception ex)\n    {\n        return Result.Error<string,\
    \ Exception>(ex);\n    }\n}\n```\n\nNow, we can consume the function and handle\
    \ both success and error cases:\n\n```csharp\nasync Task MainAsync()\n{\n    var\
    \ result = await LoadDataResultAsync(\"https://example.com/data\");\n    result.Match(\n\
    \        ok: data => Console.WriteLine($\"Data: {data}\"),\n        error: ex\
    \ => Console.WriteLine($\"Error: {ex.Message}\")\n    );\n}\n```\n\n### 8.3.2\
    \ Composing Asynchronous Functions\n\nOne of the main benefits of using `Result`\
    \ in asynchronous programming is that we can easily compose functions together,\
    \ even if they may fail. The `Functional-Ext` library provides various extensions,\
    \ such as `BindAsync`, to help this.\n\nSuppose we have two functions, `LoadDataResultAsync`\
    \ and `ProcessDataResultAsync`:\n\n```csharp\nasync Task<Result<string, Exception>>\
    \ LoadDataResultAsync(string url) { /* ... */ }\nasync Task<Result<int, Exception>>\
    \ ProcessDataResultAsync(string data) { /* ... */ }\n```\n\nWe can compose these\
    \ functions using `BindAsync`:\n\n```csharp\nasync Task MainAsync()\n{\n    var\
    \ url = \"https://example.com/data\";\n    var result = await LoadDataResultAsync(url).BindAsync(data\
    \ => ProcessDataResultAsync(data));\n    result.Match(\n        ok: processedData\
    \ => Console.WriteLine($\"Processed data: {processedData}\"),\n        error:\
    \ ex => Console.WriteLine($\"Error: {ex.Message}\")\n    );\n}\n```\n\nIn this\
    \ example, `BindAsync` composes the functions and short-circuits the error. If\
    \ `LoadDataResultAsync` returns an error, the `ProcessDataResultAsync` function\
    \ is not called, and the error is propagated to the `Match` function.\n\n### 8.3.3\
    \ Error Handling with Parallelism\n\nThe `Functional-Ext` library also provides\
    \ facilities to handle errors while performing parallel operations. For example,\
    \ let’s consider a case where we need to download data from multiple URLs in parallel\
    \ and process them. The library offers the `Traverse` method to achieve this purpose.\n\
    \nSuppose we have a list of URLs to load data from and process:\n\n```csharp\n\
    using Functional;\nusing System.Threading.Tasks;\n\nasync Task MainAsync()\n{\n\
    \    List<string> urls = new List<string>\n    {\n        \"https://example.com/data1\"\
    ,\n        \"https://example.com/data2\",\n        \"https://example.com/data3\"\
    \n    };\n    var result = await urls.Traverse(async url => await LoadDataResultAsync(url).BindAsync(data\
    \ => ProcessDataResultAsync(data)));\n    result.Match(\n        ok: processedDataList\
    \ =>\n        {\n            Console.WriteLine(\"Processed data:\");\n       \
    \     foreach (var processedData in processedDataList)\n            {\n      \
    \          Console.WriteLine(processedData);\n            }\n        },\n    \
    \    error: ex => Console.WriteLine($\"Error: {ex.Message}\")\n    );\n}\n```\n\
    \nIn this example, `Traverse` applies the given asynchronous function to each\
    \ element of the `urls` list in parallel, and then combines the results into a\
    \ single `Result`. If any of the operations fail, the `Result` will hold the first\
    \ error encountered, and the success case will contain a list of the processed\
    \ data.\n\n### 8.3.4 Retrying Asynchronous Operations\n\nIn some situations, you\
    \ might want to retry an asynchronous operation if it fails. The `Functional-Ext`\
    \ library provides a convenient `RetryAsync` extension method for this purpose.\
    \ Here’s an example that demonstrates how to use `RetryAsync` with our `LoadDataResultAsync`\
    \ function:\n\n```csharp\nasync Task MainAsync()\n{\n    var url = \"https://example.com/data\"\
    ;\n    int maxRetries = 3;\n    var result = await LoadDataResultAsync(url).RetryAsync(maxRetries,\
    \ async (url, retryCount) =>\n    {\n        Console.WriteLine($\"Retrying {retryCount\
    \ + 1}/{maxRetries}...\");\n        await Task.Delay(1000); // Wait for 1 second\
    \ before retrying\n    });\n\n    result.Match(\n        ok: data => Console.WriteLine($\"\
    Data: {data}\"),\n        error: ex => Console.WriteLine($\"Error: {ex.Message}\"\
    )\n    );\n}\n```\n\nIn this example, the `RetryAsync` extension method is used\
    \ to retry the `LoadDataResultAsync` operation if it fails, up to a maximum of\
    \ `maxRetries` times. If the operation continues to fail after all retries, the\
    \ error will be propagated to the `Match` function.\n"
