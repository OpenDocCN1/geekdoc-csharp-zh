    \    {\n        _numbers = _numbers.Add(number);\n    }\n\n    public int GetSum()\n\
    \    {\n        return _numbers.Sum();\n    }\n}\n\nclass Program\n{\n    static\
    \ async Task Main()\n    {\n        var safeCounter = new SafeCounter();\n   \
    \     var addTask = Task.Run(() =>\n        {\n            for (int i = 0; i <\
    \ 1000; i++)\n            {\n                safeCounter.AddNumber(i);\n     \
    \       }\n        });\n        var sumTask = Task.Run(() =>\n        {\n    \
    \        int sum = safeCounter.GetSum();\n            Console.WriteLine($\"Sum:\
    \ {sum}\");\n        });\n        await Task.WhenAll(addTask, sumTask);\n    }\n\
    }\n```\n\n在这个版本中，我们用 `ImmutableList` 替换了 `List`。当我们调用 `AddNumber` 时，会创建一个新列表并原子地更新\
    \ `_numbers` 引用。这确保了 `GetSum` 始终在一致的状态工作，而不需要同步机制。这个示例演示了函数式编程中的不可变数据结构如何帮助避免多线程代码中的同步问题，使其更安全更容易理解。\n\
    \n当我们到达第 3 节的结尾时，你已经接触了一些函数式构建模块。我们探索了纯函数和不可变性这对强大的组合、高阶函数的魔法世界以及 Lambda 表达式。通过理解这些概念，你已经在通向掌握函数式编程的路上了。但等等，还有更多！在下一节中，我们将深入一些优秀的数据结构和模式，它们将你的函数式编程技能推向新的高度。准备学习：\n\
    \n- 元组和记录（Tuples and Records）：紧凑、高效的数据容器，非常适合函数式编程\n- 模式匹配（Pattern Matching）：一种轻松解构和分析数据的强大方式\n\
    - 判别联合（Discriminated Unions）：一种为具有良好定义可能的复杂类型建模的佳工具\n- 解构（Deconstruction）：一种以整洁方式从数据结构中提取值的技术\n\
    \n所以，拿点零食，休息一下，准备好继续这段函数宇宙的奇妙之旅。第 3.2 节见！\n\n## 3.2 高阶函数\n\n高阶函数就像函数式编程中的派对核心。它们可以接受其他函数作为参数，或将它们作为结果返回，创建一个动态、有趣且可组合的环境。在本章中，我们将探索\
    \ C# 中高阶函数的迷世界，揭示它们的秘密，并发现它们如何让我们的代码更具表达力和灵活性。\n\n### 委托的艺术\n\n在高阶函数的世界里，委托是关键。它们允许我们像在高级聚会上传递小菜一样传递行为。让我们从一个简单的示例开始：\n\
    \n```csharp\npublic int ApplyOperation(int x, int y, Func<int, int, int> operation)\n\
    {\n    return operation(x, y);\n}\n\nvar sum = ApplyOperation(3, 4, (x, y) =>\
    \ x + y); // 7\nvar product = ApplyOperation(3, 4, (x, y) => x * y); // 12\n```\n\
    \n在这个示例中，`ApplyOperation` 接收两个整数和一个操作它们的函数。就像服务员端上小吃一样，它将所需的行为直接送到你的盘子里。\n\n###\
    \ 柯里化：一种火辣技巧\n\n柯里化（Currying）是一种为你的代码增添函数式风韵的技巧。它涉及将一个接受多个参数的函数转换为一系列每个接受单个参数的函数。这里有一个让你开胃的简单示例：\n\
    \n```csharp\npublic Func<int, int> Add(int x)\n{\n    return y => x + y;\n}\n\n\
    var addFive = Add(5);\nvar result = addFive(3); // 8\n```\n\n现在，`Add` 返回一个接受整数并将其加到初始\
    \ `x` 的函数。这就像我们准备了一份美味的咖喱，现在可以根据我们的味蕾添加各种配料。\n\n### 高阶函数的派对技巧\n\n让我们学一些新舞步来惊艳我们的函数式编程朋友们！这里有一些可以在日常编码中使用的方便高阶函数：\n\
    \n### Map\n\n`Map` 函数将给定的函数应用于集合中的每个元素，创建一个包含转换后元素的新集合。\n\n```csharp\npublic IEnumerable<TResult>\
    \ Map<TSource, TResult>(IEnumerable<TSource> source, Func<TSource, TResult> selector)\n\
    {\n    foreach (var item in source)\n    {\n        yield return selector(item);\n\
    \    }\n}\n\nvar numbers = new List<int> { 1, 2, 3 };\nvar squares = Map(numbers,\
    \ x => x * x); // [1, 4, 9]\n```\n\n### Filter\n\n`Filter` 函数根据谓词函数过滤集合，只返回满足条件的元素。\n\
    \n```csharp\npublic IEnumerable<T> Filter<T>(IEnumerable<T> source, Func<T, bool>\
    \ predicate)\n{\n    foreach (var item in source)\n    {\n        if (predicate(item))\n\
    \        {\n            yield return item;\n        }\n    }\n}\n\nvar numbers\
    \ = new List<int> { 1, 2, 3, 4, 5 };\nvar evenNumbers = Filter(numbers, x => x\
    \ % 2 == 0); // [2, 4]\n```\n\n### Reduce\n\n`Reduce` 函数使用指定的累加函数将集合的元素积累为单个值。\n\
    \n```csharp\npublic T Reduce<T>(IEnumerable<T> source, Func<T, T, T> accumulator)\n\
    {\n    using var enumerator = source.GetEnumerator();\n    if (!enumerator.MoveNext())\n\
    \    {\n        throw new InvalidOperationException(\"集合至少包含一个元素。\");\n    }\n\
    \    T result = enumerator.Current;\n    while (enumerator.MoveNext())\n    {\n\
    \        result = accumulator(result, enumerator.Current);\n    }\n    return\
    \ result;\n}\n```\n\n"
