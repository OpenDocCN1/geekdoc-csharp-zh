    }


    In this example, we use record patterns to match on the type and properties of
    different shapes. The code is both concise and expressive, allowing us to quickly
    understand the different cases being handled.


    The Adventure Continues: Embracing the Power of Pattern Matching As we close the
    case on pattern matching, we can appreciate the elegance and expressiveness it
    brings to our C# code. By combining the power of pattern matching with other functional
    programming features like tuples, records, and nullable types, we can write code
    that’s easy to read, maintain, and reason about.


    Now that you’ve honed your pattern matching skills, you’re ready to tackle more
    complex and challenging code mysteries. Embrace the power of pattern matching
    in your projects and watch as your code becomes cleaner, more expressive, and
    more maintainable.


    As we continue to explore the world of functional C#, we’ll discover even more
    powerful techniques and patterns to level up our programming skills. From immutability
    and persistent data structures to higher-order functions and beyond, there’s a
    treasure trove of functional knowledge waiting to be unlocked.


    So, keep your magnifying glass handy, your wit sharp, and your curiosity piqued
    as we delve deeper into the fascinating realm of functional programming in C#.
    With pattern matching as one of your many tools, you’ll be well-equipped to solve
    the most perplexing code conundrums and emerge as a true functional programming
    detective. Happy sleuthing, dear coder!


    ## 4.3 Discriminated Unions: The Swiss Army Knife of Data Types


    In the realm of functional programming, there’s one data type that truly stands
    out from the crowd – the discriminated union. It’s like a Swiss Army knife, versatile
    and powerful, ready to tackle any problem you throw at it. Discriminated unions
    allow us to represent a choice between several different, yet related data types,
    making them perfect for modeling complex, hierarchical data structures. So, let’s
    dive in and see how these nifty data types can enhance our functional C# skills!


    ### What’s in a Name: Introducing Discriminated Unions


    Discriminated unions are a way to represent a value that can be one of several
    different types, each with its own set of properties. They’re a powerful way to
    model complex data and are commonly found in functional programming languages
    like Haskell, F#, and others. While C# doesn’t have a built-in discriminated union
    type, we can emulate them using some clever tricks and record types.


    ### A Menagerie of Types: Modeling Animals


    To demonstrate the power of discriminated unions, let’s create a small menagerie
    of animals, each with its own unique set of properties:


    public abstract record Animal;


    public record Mammal(int Legs, bool HasTail) : Animal;


    public record Bird(bool CanFly, string Color) : Animal;


    public record Fish(int Fins, bool HasScales) : Animal;


    In this example, we’ve defined an abstract Animal record and three derived records
    for different types of animals. Each derived record has its own set of properties
    specific to its type. This hierarchy of types emulates a discriminated union,
    allowing us to represent a value that can be one of several different animal types.


    The Lion, the Finch, and the Goldfish: Pattern Matching with Discriminated Unions
    Now that we’ve got our animal kingdom set up, let’s see how discriminated unions
    and pattern matching can work together in perfect harmony. Here’s an example of
    a function that classifies animals based on their properties:


    public string ClassifyAnimal(Animal animal)


    {


        return animal switch


        {


            Mammal { Legs: 4, HasTail: true } => "Quadruped mammal with a tail",


            Bird { CanFly: true, Color: var color } => $"A flying {color} bird",


            Fish { Fins: var fins, HasScales: true } => $"A fish with {fins} fins
    and scales",


            _ => "An interesting creature indeed!"


        };


    }


    In this example, we use pattern matching to classify animals based on their type
    and properties. The concise and expressive syntax allows us to quickly understand
    the various cases being handled, showcasing the power of discriminated unions
    and pattern matching combined.


    ### Samples Galore: More Discriminated Union Goodness


    The possibilities with discriminated unions are endless! You can model anything
    from expressions in a programming language to the various states of a game character.
    Here’s an example of modeling arithmetic expressions using discriminated unions:


    public abstract record Expr;


    public record Constant(int Value) : Expr;


    public record Add(Expr Left, Expr Right) : Expr;


    public record Subtract(Expr Left, Expr Right) : Expr;


    public record Multiply(Expr Left, Expr Right) : Expr;


    public record Divide(Expr Left, Expr Right) : Expr;


    And here’s an example of modeling game character states:


    public abstract record CharacterState;


    public record Idle : CharacterState;


    public record Running : CharacterState;


    public record Jumping(double Height) : CharacterState;


    public record Attacking(int Damage) : CharacterState;


    Now that we have our character state hierarchy set up, let’s use pattern matching
    to handle different states and perform actions accordingly:


    public void HandleCharacterState(CharacterState state)


    {


        switch (state)


        {


            case Idle:


                Console.WriteLine("Character is idle");


                break;


            case Running:


                Console.WriteLine("Character is running");


                break;


            case Jumping(var height):


                Console.WriteLine($"Character is jumping with a height of {height}");


                break;


            case Attacking(var damage):


                Console.WriteLine($"Character is attacking with a damage of {damage}");


                break;


            default:


                Console.WriteLine("Unknown character state");


                break;


        }


    }


    In this example, we use pattern matching to handle different character states
    and perform appropriate actions. Discriminated unions and pattern matching together
    make it easy to express complex behavior in a concise and readable manner.'
