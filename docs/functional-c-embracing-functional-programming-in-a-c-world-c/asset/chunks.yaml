  trans: "\n\n虽然 LINQ 提供了一套全面的操作符，但你有时可能需要针对特定需求自定义操作符。通过利用扩展方法，你可以创建自定义查询操作符，并且它们可以在查询语法（Query\
    \ Syntax）和方法语法（Method Syntax）中无缝使用。在本节中，我们将演示如何创建一个小型的自定义 LINQ 操作符库。\n\n### 6.2.3.1\
    \ 自定义 Map 操作符\n\n让我们创建一个自定义的 `Map` 操作符，它的行为类似于 `Select`。我们首先在 `IEnumerable` 上定义一个扩展方法：\n\
    \n```csharp\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
    \npublic static class LinqExtensions\n{\n    public static IEnumerable<TResult>\
    \ Map<TSource, TResult>(this IEnumerable<TSource> source, Func<TSource, TResult>\
    \ selector)\n    {\n        return source.Select(selector);\n    }\n}\n```\n\n\
    现在我们可以使用方法语法调用我们自定义的 `Map` 操作符：\n\n```csharp\nvar numbers = new List<int> { 1,\
    \ 2, 3, 4, 5 };\nvar squaredNumbers = numbers.Map(x => x * x);\n```\n\n若要在查询语法中使用我们自定义的\
    \ `Map` 操作符，我们需要创建一个自定义的查询关键字。我们将在 `IEnumerable` 上定义一个带有 `map` 关键字的扩展方法：\n\n```csharp\n\
    public static class LinqExtensions\n{\n    public static IEnumerable<TResult>\
    \ map<TSource, TResult>(this IEnumerable<TSource> source, Func<TSource, TResult>\
    \ selector)\n    {\n        return source.Select(selector);\n    }\n}\n```\n\n\
    现在我们可以使用查询语法调用我们自定义的 `Map` 操作符：\n\n```csharp\nvar squaredNumbersQuery = from n\
    \ in numbers select n;\n```\n\n### 6.4.2 Bind 操作符\n\n让我们创建一个自定义的 `Bind` 操作符，它的行为类似于\
    \ `SelectMany`。我们将在 `IEnumerable` 上定义一个扩展方法：\n\n```csharp\npublic static class\
    \ LinqExtensions\n{\n    public static IEnumerable<TResult> Bind<TSource, TResult>(this\
    \ IEnumerable<TSource> source, Func<TSource, IEnumerable<TResult>> selector)\n\
    \    {\n        return source.SelectMany(selector);\n    }\n}\n```\n\n现在我们可以使用方法语法调用我们自定义的\
    \ `Bind` 操作符：\n\n```csharp\nvar names = new List<string> { \"Luke\", \"Leia\"\
    , \"Han\" };\nvar letterCombos = names.Bind(name => name.CharArray());\n```\n\n\
    若要在查询语法中使用我们自定义的 `Bind` 操作符，我们需要创建一个自定义的查询关键字。我们将在 `IEnumerable` 上定义一个带有 `bind`\
    \ 关键字的扩展方法：\n\n```csharp\npublic static class LinqExtensions\n{\n    public static\
    \ IEnumerable<TResult> bind<TSource, TResult>(this IEnumerable<TSource> source,\
    \ Func<TSource, IEnumerable<TResult>> selector)\n    {\n        return source.SelectMany(selector);\n\
    \    }\n}\n```\n\n现在我们可以使用查询语法调用我们自定义的 `Bind` 操作符：\n\n```csharp\nvar letterCombosQuery\
    \ = from name in names from letter in name.CharArray() select letter;\n```\n\n\
    在下一个示例中，我们将使用查询语法创建一个 LINQ 查询，用于从两家不同的航空公司寻找最便宜的票价。我们将使用扩展方法来保持代码的函数化和整洁。\n\n\
    首先，让我们创建表示航班信息的类：\n\n```csharp\npublic class Flight\n{\n    public string Airline\
    \ { get; set; }\n    public string Origin { get; set; }\n    public DateTime DepartureDate\
    \ { get; set; }\n    public decimal Fare { get; set; }\n}\n```\n\n接下来，我们将创建一个包含扩展方法的静态类，用于从虚假航空公司获取航班数据：\n\
    \n```csharp\nusing System.Collections.Generic;\n\npublic static class AirlineExtensions\n\
    {\n    public static IEnumerable<Flight> GetFlightsAirline1(this string origin)\n\
    \    {\n        // 从 Airline1 获取（用于演示的假数据）\n        return new List<Flight>\n\
    \        {\n            new Flight { Airline = \"Airline1\", Origin = origin,\
    \ Destination = \"New York\", DepartureDate = DateTime.Now.AddDays(1), Fare =\
    \ 500 },\n            new Flight { Airline = \"Airline1\", Origin = origin, Destination\
    \ = \"Los Angeles\", DepartureDate = DateTime.Now.AddDays(2), Fare = 800 }\n \
    \       };\n    }\n\n    public static IEnumerable<Flight> GetFlightsAirline2(this\
    \ string origin)\n    {\n        // 从 Airline2 获取（用于演示的假数据）\n        return new\
    \ List<Flight>\n        {\n            new Flight { Airline = \"Airline2\", Origin\
    \ = origin, Destination = \"New York\", DepartureDate = DateTime.Now.AddDays(3),\
    \ Fare = 550 },\n            new Flight { Airline = \"Airline2\", Origin = origin,\
    \ Destination = \"Los Angeles\", DepartureDate = DateTime.Now.AddDays(4), Fare\
    \ = 700 }\n        };\n    }\n}\n```\n\n现在，让我们使用查询语法创建一个 LINQ 查询来从两家航空公司获取最便宜的票价：\n\
    \n```csharp\nusing System;\nusing System.Linq;\n\nclass Program\n{\n    static\
    \ void Main()\n    {\n        string origin = \"San Francisco\";\n        string\
    \ destination = \"Los Angeles\";\n        var bestFares = from airline1Flight\
    \ in origin.GetFlightsAirline1()\n                         from airline2Flight\
    \ in origin.GetFlightsAirline2()\n                         where airline1Flight.Destination\
    \ == destination && airline2Flight.Destination == destination\n              \
    \           let minFare = Math.Min(airline1Flight.Fare, airline2Flight.Fare)\n\
    \                         orderby minFare\n                         select new\
    \ { Airline = (airline1Flight.Fare <= airline2Flight.Fare) ? airline1Flight.Airline\
    \ : airline2Flight.Airline, Fare = minFare };\n\n        Console.WriteLine($\"\
    Best flight fares from {origin} to {destination}:\");\n        foreach (var fare\
    \ in bestFares)\n        {\n            Console.WriteLine($\"{fare.Airline}: {fare.Fare}\"\
    );\n        }\n    }\n}\n```\n\n在这个示例中，我们使用了查询语法来处理大型数据集。为了让之前的代码并行运行，可以使用 `AsParallel()`\
    \ 扩展方法。我们需要为扩展方法添加 `System.Threading` 命名空间：\n\n```csharp\nusing System;\nusing\
    \ System.Collections.Generic;\nusing System.Linq;\nusing System.Threading.Tasks;\n\
    \npublic static class AirlineExtensions\n{\n    public static IEnumerable<Flight>\
    \ GetFlightsAirline1Async(this string origin)\n    {\n        return Task.Run(()\
    \ =>\n        {\n            // 模拟异步调用\n            Task.Delay(500).Wait();\n\
    \            return new List<Flight>\n            {\n                new Flight\
    \ { Airline = \"Airline1\", Origin = origin, Destination = \"New York\", DepartureDate\
    \ = DateTime.Now.AddDays(1), Fare = 500 },\n                new Flight { Airline\
    \ = \"Airline1\", Origin = origin, Destination = \"Los Angeles\", DepartureDate\
    \ = DateTime.Now.AddDays(2), Fare = 800 }\n            };\n        }) as IEnumerable<Flight>;\n\
    \    }\n\n    public static IEnumerable<Flight> GetFlightsAirline2Async(this string\
    \ origin)\n    {\n        return Task.Run(() =>\n        {\n            // 模拟异步调用\n\
    \            Task.Delay(500).Wait();\n            return new List<Flight>\n  \
    \          {\n                new Flight { Airline = \"Airline2\", Origin = origin,\
    \ Destination = \"New York\", DepartureDate = DateTime.Now.AddDays(3), Fare =\
    \ 550 },\n                new Flight { Airline = \"Airline2\", Origin = origin,\
    \ Destination = \"Los Angeles\", DepartureDate = DateTime.Now.AddDays(4), Fare\
    \ = 700 }\n            };\n        }) as IEnumerable<Flight>;\n    }\n}\n```\n\
    \n"
