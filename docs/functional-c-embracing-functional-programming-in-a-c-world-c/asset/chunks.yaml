    \ circle.WithRadius(10); // Creates a new circle with a different radius, without\
    \ modifying the original circle\n\nLet’s explore an example that demonstrates\
    \ the thread-safety benefits of using immutable data structures in a multithreaded\
    \ environment.\n\nImagine we have a List shared between multiple threads. If one\
    \ thread is adding elements to the list while another is reading from it, you\
    \ may encounter synchronization issues, resulting in unexpected behavior or even\
    \ exceptions.\n\nUsing an object-oriented approach (not thread-safe):\n\nusing\
    \ System;\n\nusing System.Collections.Generic;\n\nusing System.Threading.Tasks;\n\
    \nclass UnsafeCounter\n\n{\n\n private List<int> _numbers =  new List<int>();\n\
    \npublic  void  AddNumber(int number)\n\n    {\n\n        _numbers.Add(number);\n\
    \n    }\n\npublic  int  GetSum()\n\n    {\n\n        return _numbers.Sum();\n\n\
        }\n\n}\n\nclass Program\n\n{\n\n    static async Task Main()\n\n    {\n\n\
            var unsafeCounter =  new  UnsafeCounter();\n\nvar addTask = Task.Run(()\
    \  =>\n\n        {\n\n            for  (int i =  0; i <  1000; i++)\n\n            {\n\
    \n                unsafeCounter.AddNumber(i);\n\n            }\n\n        });\n\
    \nvar sumTask = Task.Run(()  =>\n\n        {\n\n            int sum = unsafeCounter.GetSum();\n\
    \n            Console.WriteLine($\"Sum: {sum}\");\n\n        });\n\nawait Task.WhenAll(addTask,\
    \ sumTask);\n\n    }\n\n}\n\nThis example has a race condition because AddNumber\
    \ and GetSum can be executed concurrently, leading to unpredictable results. To\
    \ fix this issue, we can use an immutable data structure, such as ImmutableList,\
    \ which is provided by the System.Collections.Immutable namespace.\n\nUsing a\
    \ functional approach (thread-safe):\n\nusing System;\n\nusing System.Collections.Immutable;\n\
    \nusing System.Linq;\n\nusing System.Threading.Tasks;\n\nclass SafeCounter\n\n\
    {\n\n    private ImmutableList<int> _numbers = ImmutableList<int>.Empty;\n\npublic\
    \  void  AddNumber(int number)\n\n    {\n\n_numbers = _numbers.Add(number);\n\n\
        }\n\npublic  int  GetSum()\n\n    {\n\n        return _numbers.Sum();\n\n\
        }\n\n}\n\nclass Program\n\n{\n\n    static async Task Main()\n\n    {\n\n\
            var safeCounter =  new  SafeCounter();\n\nvar addTask = Task.Run(()  =>\n\
    \n        {\n\n            for  (int i =  0; i <  1000; i++)\n\n            {\n\
    \n                safeCounter.AddNumber(i);\n\n            }\n\n        });\n\n\
    var sumTask = Task.Run(()  =>\n\n        {\n\n            int sum = safeCounter.GetSum();\n\
    \n            Console.WriteLine($\"Sum: {sum}\");\n\n        });\n\nawait Task.WhenAll(addTask,\
    \ sumTask);\n\n    }\n\n}\n\nIn this version, we’ve replaced the mutable List\
    \ with an ImmutableList. When we call AddNumber, a new list is created with the\
    \ added number, and the _numbers reference is updated atomically. This ensures\
    \ that GetSum will always work on a consistent state of the _numbers list, making\
    \ the code thread-safe without needing explicit synchronization mechanisms.\n\n\
    This example demonstrates how using immutable data structures in functional programming\
    \ can help to avoid synchronization issues in multithreaded code, making it safer\
    \ and easier to reason about.\n\nAs we reach the end of Section 3.1, you’ve now\
    \ been introduced to some essential functional building blocks in C#. We’ve explored\
    \ the powerful duo of pure functions and immutability, the magical world of higher-order\
    \ functions, and the secret handshake of lambda expressions. By understanding\
    \ these concepts, you’re well on your way to mastering functional programming\
    \ in C#.\n\nBut wait, there’s more! In the next section, we’ll dive into some\
    \ awesome functional data structures and patterns that will take your functional\
    \ programming skills to the next level. Get ready to learn about:\n\nTuples and\
    \ Records: Compact, efficient data containers that are perfect for functional\
    \ programming Pattern Matching: A powerful way to destructure and analyze data\
    \ with ease Discriminated Unions: A fantastic tool for modeling complex data types\
    \ with limited and well-defined possibilities Deconstruction: A technique to extract\
    \ values from data structures in a clean, functional way So, grab a snack, take\
    \ a break, and get ready to continue this amazing journey into the functional\
    \ programming universe with C#. See you in Section 3.2!\n\n## 3.2\\. Higher-Order\
    \ Functions\n\nHigher-order functions are like the life of the party in functional\
    \ programming. They can take other functions as arguments or return them as results,\
    \ creating a dynamic, fun, and composable environment. In this chapter, we’ll\
    \ explore the fascinating world of higher-order functions in C#, uncovering their\
    \ secrets and discovering how they can make our code more expressive and flexible.\n\
    \n### The Art of Delegation\n\nIn the world of higher-order functions, delegation\
    \ is key. They allow us to pass around behavior like hors d’oeuvres at a fancy\
    \ soiree. Let’s start with a simple example:\n\npublic  int  ApplyOperation(int\
    \ x,  int y, Func<int,  int,  int> operation)\n\n{\n\n return  operation(x, y);\n\
    \n}\n\nvar sum =  ApplyOperation(3,  4,  (x, y)  => x + y);  // 7\n\nvar product\
    \ =  ApplyOperation(3,  4,  (x, y)  => x * y);  // 12\n\nIn this example, ApplyOperation\
    \ takes two integers and a function that operates on them. Just like a waiter\
    \ serving up delicious canapés, it delivers the desired behavior right to your\
    \ plate.\n\n### Currying: A Spicy Technique\n\nCurrying is a technique that adds\
    \ a dash of functional flair to your code. It involves transforming a function\
    \ that takes multiple arguments into a series of functions that each take a single\
    \ argument. Here’s a simple example to whet your appetite:\n\npublic Func<int,\
    \  int>  Add(int x)\n\n{\n\n return y => x + y;\n\n}\n\nvar addFive =  Add(5);\n\
    \nvar result =  addFive(3);  // 8\n\nNow, Add returns a function that takes an\
    \ integer and adds it to the initial x. It’s like we’ve prepared a delightful\
    \ curry, and now we can add various ingredients to suit our taste buds.\n\n###\
    \ Party Tricks with Higher-Order Functions\n\nLet’s learn some new dance moves\
    \ to impress our functional programming friends! Here are a few handy higher-order\
    \ functions that you can use in your everyday coding:\n\n### Map\n\nThe Map function\
    \ applies a given function to each element in a collection, creating a new collection\
    \ with the transformed elements.\n\npublic IEnumerable<TResult> Map<TSource, TResult>(IEnumerable<TSource>\
    \ source, Func<TSource, TResult> selector)\n\n{\n\n    foreach  (var item in source)\n\
    \n   {\n\n        yield  return  selector(item);\n\n    }\n\n}\n\nvar numbers\
    \ =  new List<int>  {  1,  2,  3  };\n\nvar squares =  Map(numbers, x => x * x);\
    \  // [1, 4, 9]\n\n### Filter\n\nThe Filter function filters a collection based\
    \ on a predicate function, returning only the elements that satisfy the condition.\n\
    \npublic IEnumerable<T> Filter<T>(IEnumerable<T> source, Func<T,  bool> predicate)\n\
    \n{\n\n    foreach  (var item in source)\n\n    {\n\n        if  (predicate(item))\n\
    \n        {\n\n            yield  return item;\n\n        }\n\n    }\n\n}\n\n\
    var numbers =  new List<int>  {  1,  2,  3,  4,  5  };\n\nvar evenNumbers =  Filter(numbers,\
    \ x => x %  2  ==  0);  // [2, 4]\n\n### Reduce\n\nThe Reduce function accumulates\
    \ a collection’s elements into a single value using a specified accumulator function.\n\
    \npublic T Reduce<T>(IEnumerable<T> source, Func<T, T, T> accumulator)\n\n{\n\n\
        using  var enumerator = source.GetEnumerator();\n\n    if  (!enumerator.MoveNext())\n\
    \n    {\n\n        throw  new  InvalidOperationException(\"The collection must\
    \ have at least one element.\");\n\n    }\n\nT result = enumerator.Current;\n\n\
        while  (enumerator.MoveNext())\n\n    {\n\nresult =  accumulator(result, enumerator.Current);\n\
    \n    }\n\nreturn result;\n\n}"
