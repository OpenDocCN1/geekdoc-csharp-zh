    - 3.3. Lambda 表达式\n    - Lambda 表达式：简史\n    - Lambda 表达式的艺术\n    - 实战 Lambda\n\
    \    - 事件处理器\n    - LINQ 查询\n    - 谓词函数\n    - Lambda 表达式的局限性\n- 3.4. 闭包\n   \
    \ - 闭包：快速介绍\n    - 底层原理：闭包在 C 中是如何运作的\n    - 日常代码中的闭包\n    - 大告别：迈向函数数据结构\n\n\
    ### 第 4 章：函数式数据结构与模式\n- 4.1. 元组（Tuples）与记录（Records）：数据的黄金搭档\n    - 元组：小而精悍\n \
