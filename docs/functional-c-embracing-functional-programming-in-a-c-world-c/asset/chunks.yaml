  trans: "\n\n# 案件正在进行：高级模式匹配\n\n当模式匹配与元组（tuples）、记录（records）和可空类型等 C# 特性结合时，它变得更加强大。让我们探索一些高级模式匹配技术，它们将帮助我们解决最棘手的代码谜题。\n\
    \n## 元组模式 (Tuple Patterns)\n元组模式允许我们同时对多个值进行匹配，使得表达条件的变得简单。以下示例演示了如何将一对数字分类为大于、小于或相等：\n\
    \n```csharp\npublic string CompareNumbers(int a, int b)\n{\n    return (a, b)\
    \ switch\n    {\n        (var x, var y) when x > y => \"Greater\",\n        (var\
    \ x, var y) when x < y => \"Lesser\",\n        (_, _) => \"Equal\"\n    };\n}\n\
    ```\n\n在这个示例中，我们创建了一个包含两个数字的元组并使用模式匹配对它们进行比较。`when` 关键字允许我们为分支添加额外的条件，从而对匹配过程进行细粒度的控制。\n\
    \n## 记录模式 (Record Patterns)\n结合记录的模式匹配允许我们对对象的形状和属性进行匹配。以下示例演示了如何使用记录模式对几何形状进行分类：\n\
    \n```csharp\npublic record Shape;\npublic record Circle(double Radius) : Shape;\n\
    public record Rectangle(double Width, double Height) : Shape;\n\npublic string\
    \ DescribeShape(Shape shape)\n{\n    return shape switch\n    {\n        Circle\
    \ { Radius: 0 } => \"A point\",\n        Circle c => $\"A circle with radius {c.Radius}\"\
    ,\n        Rectangle r => $\"A rectangle with width {r.Width} and height {r.Height}\"\
    ,\n        _ => throw new NotSupportedException(\"Unknown shape\")\n    };\n}\n\
    ```\n\n在这个示例中，我们使用记录模式匹配不同形状的类型和属性。代码既简洁又富有表现力，使我们能够快速理解正在处理的各种情况。\n\n## 冒险继续：拥抱模式匹配的力量\n\
    当我们结束对模式匹配的探究时，可以欣赏它为 C# 代码带来的优雅感和表现力。通过将模式匹配的力量与元组、记录和可空类型等其他函数式编程特性相结合，我们可以编写易读、易维护且易于推理的代码。现在你已经磨练了模式匹配技巧，准备好应对更复杂、更有挑战性的代码谜题了。在你的项目中拥抱模式匹配的力量，观察你的代码如何变得更加简洁、生动且易维护。\n\
    \n随着我们继续探索函数式 C# 的世界，我们将发现更多强大的技术和模式来提升我们的编程技能。从不可变性和持久数据结构到高阶函数及更多，有许多函数式知识宝等待开启。\n\
    \n所以，请准备好你的放大镜，保持敏锐的思维和好奇心，我们将深入探索 C# 函数式编程的迷人领域。将模式匹配作为你的众多工具之一，你将有能力解决最令人困惑的代码难题，并成为真正的函数式编程侦探。侦查愉快，亲爱的程序员！\n\
    \n## 4.3 判别联合 (Discriminated Unions)：数据类型的瑞士军刀\n在函数式编程领域，有一种数据类型真正脱颖而出——判别联合。它就像一把瑞士军刀，多功能且强大，准备好应对你抛出的任何问题。判别联合允许我们在几种不同但相关的数据类型之间表示选择，使其成为建模复杂层次化数据结构的完美选择。那么，让我们投身其中，看看这些巧妙的数据类型如何增强我们的函数式\
    \ C# 技能！\n\n### 名字的含义：引入判别联合\n判别联合是表示一个可以是几种不同类型之一的值的方法，每种类型都有自己的一组属性。它们是建模复杂数据的强大方式，常见于\
    \ Haskell、F# 等函数式编程语言中。虽然 C# 没有内置的判别联合类型，但我们可以使用巧妙的技巧和记录类型（record types）来模拟它们。\n\
    \n### 类型的动物园：建模动物\n为了演示判别联合的力量，让我们创建一个小型的动物园，每种动物都有自己独特的属性集：\n\n```csharp\npublic\
    \ abstract record Animal;\npublic record Mammal(int Legs, bool HasTail) : Animal;\n\
    public record Bird(bool CanFly, string Color) : Animal;\npublic record Fish(int\
    \ Fins, bool HasScales) : Animal;\n```\n\n在这个示例中，我们定义了一个抽象的 `Animal` 记录和三个针对不同类型动物的派生记录。每个派生记录都有其特定类型的特定属性集。这种类型层次结构模拟了判别联合，允许我们表示可以是几种不同动物类型之一的值。\n\
    \n### 狮子、金雀和金鱼：带判别联合的模式匹配\n现在我们已经建立好了动物王国，让我们看看判别联合和模式匹配如何完美地协同工作。以下是一个根据属性对动物分类的函数示例：\n\
    \n```csharp\npublic string ClassifyAnimal(Animal animal)\n{\n    return animal\
    \ switch\n    {\n        Mammal { Legs: 4, HasTail: true } => \"Quadruped mammal\
    \ with a tail\",\n        Bird { CanFly: true, Color: var color } => $\"{color}\
    \ bird\",\n        Fish { HasScales: true } => $\"fish with {Fins} scales\",\n\
    \        _ => \"An interesting creature!\"\n    };\n}\n```\n\n在这个示例中，我们使用模式匹配来分类动物。简洁的语法允许我们理解各种情况，展示了判别联合的力量。\n\
    \n### 示例尽有：更多判别联合之处\n判别联合的可能性是无尽的！你可以建模从编程语言中的表达式到游戏状态的内容。\n\n```csharp\npublic\
    \ abstract record Expr;\npublic record Constant(int Value) : Expr;\npublic record\
    \ Add(Expr Left, Expr Right) : Expr;\npublic record Subtract(Expr Left, Expr Right)\
    \ : Expr;\npublic record Multiply(Expr Left, Expr Right) : Expr;\npublic record\
    \ Divide(Expr Left, Expr Right) : Expr;\n\npublic abstract record CharacterState;\n\
    public record Idle : CharacterState;\npublic record Running : CharacterState;\n\
    public record Jumping(double Height) : CharacterState;\npublic record Attacking(int\
    \ Damage) : CharacterState;\n\npublic void HandleCharacterState(CharacterState\
    \ state)\n{\n    switch (state)\n    {\n        case Idle:\n            Console.WriteLine(\"\
    Character is idle\");\n            break;\n        case Running:\n           \
    \ Console.WriteLine(\"Character is running\");\n            break;\n        case\
    \ Jumping(var height):\n            Console.WriteLine($\"Character is jumping\
    \ with a height of {height}\");\n            break;\n        case Attacking(var\
    \ damage):\n            Console.WriteLine($\"Character is attacking with a damage\
    \ of {damage}\");\n            break;\n        default:\n            Console.WriteLine(\"\
    Unknown character state\");\n            break;\n    }\n}\n```\n\n在这个示例中，我们使用模式匹配来处理不同的字符状态并执行相应的操作。判别联合和模式匹配使得能够以简洁易读的方式表达复杂的行为。\n\
    \n"
- fmt: "\n# Unleashing the Power of Discriminated Unions\n\nAs we wrap up our exploration\
    \ of discriminated unions, we can see just how versatile and powerful they can\
    \ be in our functional C# code. By combining discriminated unions with other functional\
    \ programming techniques like pattern matching, we can model complex data and\
    \ behavior in a clean, expressive, and maintainable way.\n\nNow that you’ve experienced\
    \ the awesomeness of discriminated unions, you’re ready to tackle even more challenging\
    \ and intricate problems with your newfound functional C# prowess. So, go forth\
    \ and create your own menageries, expressions, and character states – and unleash\
    \ the full potential of discriminated unions in your projects. Happy coding!\n\
    \n## 4.4 Deconstruction\n\nDeconstruction is a powerful feature in C# that allows\
    \ you to break down complex data structures into their individual parts. It’s\
    \ like opening a box of assorted chocolates and picking out your favorite ones.\
    \ In this chapter, we’ll dive into the world of deconstruction, unraveling the\
    \ mysteries of tuples, records, and more.\n\n### 4.4.1 Deconstructing Tuples\n\
    \nTuples in C# are simple, lightweight data structures that can hold multiple\
    \ values. They are often used to group related data together. Deconstructing a\
    \ tuple means extracting its individual elements into separate variables. Here’s\
    \ a simple example:\n\n```csharp\nvar person = (Name: \"Alice\", Age: 30);\n\n\
    // Deconstructing the tuple\n(string name, int age) = person;\n\nConsole.WriteLine($\"\
    Name: {name}, Age: {age}\");\n```\n\nIn this example, we created a tuple `person`\
    \ with two named elements: `Name` and `Age`. We then deconstructed the tuple into\
    \ two separate variables, `name` and `age`, using the deconstruction syntax.\n\
    \n### 4.4.2 Deconstructing Records\n\nRecords, like tuples, are data structures\
    \ in C# that are used to group related data. They were introduced in C# 9 and\
    \ provide a more sophisticated way of creating immutable data structures. To deconstruct\
    \ a record, you need to define a `Deconstruct` method within the record. Let’s\
    \ see an example:\n\n```csharp\npublic record Car(string Make, string Model, int\
    \ Year)\n{\n    public void Deconstruct(out string make, out string model, out\
    \ int year)\n    {\n        make = Make;\n        model = Model;\n        year\
    \ = Year;\n    }\n}\n\nvar myCar = new Car(\"Tesla\", \"Model S\", 2022);\n\n\
    // Deconstructing the record\n(string make, string model, int year) = myCar;\n\
    \nConsole.WriteLine($\"Make: {make}, Model: {model}, Year: {year}\");\n```\n\n\
    In this example, we defined a record `Car` with a `Deconstruct` method that takes\
    \ three `out` parameters. We then created an instance of `Car` and deconstructed\
    \ it into three separate variables: `make`, `model`, and `year`.\n\n### 4.4.3\
    \ Deconstructing with Patterns\n\nPattern matching is a powerful feature in C#\
    \ that allows you to match and deconstruct data structures based on their shape.\
    \ Deconstruction can be combined with pattern matching to create more expressive\
    \ and flexible code. Here’s an example:\n\n```csharp\npublic abstract record Shape;\n\
    public record Circle(double Radius) : Shape;\npublic record Rectangle(double Width,\
    \ double Height) : Shape;\n\npublic static double CalculateArea(Shape shape) =>\
    \ shape switch\n{\n    Circle(var radius) => Math.PI * radius * radius,\n    Rectangle(var\
    \ width, var height) => width * height,\n    _ => throw new NotSupportedException(\"\
    Unknown shape\")\n};\n\nvar myCircle = new Circle(5);\nvar myRectangle = new Rectangle(3,\
    \ 4);\n\nConsole.WriteLine($\"Circle area: {CalculateArea(myCircle)}\");\nConsole.WriteLine($\"\
    Rectangle area: {CalculateArea(myRectangle)}\");\n```\n\nIn this example, we defined\
    \ an abstract record `Shape` and two derived records: `Circle` and `Rectangle`.\
    \ We then created a method `CalculateArea` that uses pattern matching and deconstruction\
    \ to calculate the area of a shape based on its type.\n\n### 4.4.4 Deconstructing\
    \ with Extension Methods\n\nIf you want to deconstruct a class or struct that\
    \ you don’t control, you can use extension methods to add deconstruction functionality.\
    \ Here’s an example of how to deconstruct a `KeyValuePair<TKey, TValue>`:\n\n\
    ```csharp\npublic static class KeyValuePairExtensions\n{\n    public static void\
    \ Deconstruct<TKey, TValue>(this KeyValuePair<TKey, TValue> kvp, out TKey key,\
    \ out TValue value)\n    {\n        key = kvp.Key;\n        value = kvp.Value;\n\
    \    }\n}\n\nvar dictionary = new Dictionary<string, int> { { \"apple\", 5 },\
    \ { \"banana\", 3 } };\nforeach (var (key, value) in dictionary)\n{\n    Console.WriteLine($\"\
    Key: {key}, Value: {value}\");\n}\n```\n\nIn this example, we defined an extension\
    \ method `Deconstruct` for `KeyValuePair<TKey, TValue>` that takes two `out` parameters.\
    \ This allows us to deconstruct instances of `KeyValuePair<TKey, TValue>` directly\
    \ within a `foreach` loop when iterating over a dictionary.\n\n### 4.4.5 Deconstruction\
    \ Gotchas and Tips\n\nWhile deconstruction is a handy tool, there are some things\
    \ to keep in mind when using it:\n\n- Deconstruction is not limited to tuples\
    \ and records; you can deconstruct any class or struct that has a `Deconstruct`\
    \ method.\n- When defining a `Deconstruct` method, be mindful of the order of\
    \ `out` parameters.\n\n## 5.1 Recursion: Mastering the Art of Self-Reference\n\
    \nRecursion is an essential technique where a function calls itself to solve a\
    \ smaller problem. Let’s examine the classic example of calculating the factorial:\n\
    \n```csharp\nusing System;\n\nclass Program\n{\n    static int Factorial(int n)\n\
    \    {\n        if (n == 1)\n        {\n            return 1;\n        }\n   \
    \     else\n        {\n            return n * Factorial(n - 1);\n        }\n \
    \   }\n\n    static void Main()\n    {\n        int number = 5;\n        Console.WriteLine($\"\
    The factorial of {number} is {Factorial(number)}\");\n    }\n}\n```\n\nIn this\
    \ example, the `Factorial()` function calculates the factorial of a given number\
    \ `n`. The base case is when `n` equals 1, and the recursive case is when the\
    \ function calls itself with the argument `n - 1`, working towards the base case.\n\
    \nAnother example is the Fibonacci sequence, where each number is the sum of the\
    \ two preceding ones. Here’s a C# implementation using recursion:\n\n```csharp\n\
    using System;\n\nclass Program\n{\n    static int Fibonacci(int n)\n    {\n  \
    \      if (n == 0)\n        {\n            return 0;\n        }\n        else\
    \ if (n == 1)\n        {\n            return 1;\n        }\n        else\n   \
    \     {\n            return Fibonacci(n - 1) + Fibonacci(n - 2);\n        }\n\
    \    }\n\n    static void Main()\n    {\n        int position = 10;\n        Console.WriteLine($\"\
    The {position}th number in the Fibonacci sequence is {Fibonacci(position)}\");\n\
    \    }\n}\n```\n"
