  trans: "\n\n# 厨房类比\n\n想象你是一个厨师，正在两个不同的厨房中准备食物：OOP 厨房和 FP 厨房。\n\n在 OOP 厨房中，你有一支主厨团队，他们都专攻某项特定任务。每个主厨都是一个对象，拥有自己的内部状态，他们通过来回传递食材（数据）进行通信。例如，负责切洋葱的主厨接收一个洋葱，然后返回完全切好的洋葱。然而，这名主厨也有点健忘，由于其**可变的内部状态**，他们偶尔可能会把洋葱切得太碎或切不够。\n\
    \n另一方面，FP 厨房像一条组织良好的装配线。每个工人（`function`）执行特定的任务，食材在流水线中流动。没有混淆的空间，因为每个工人收到的都是关于如何做的精确指令，而且输出每次都是一致的。在这个厨房里，切洋葱函数保证了每次都能提供切得完美的洋葱。\n\
    \n## 通过派对场景比较 OOP 和 FP\n\n让我们考虑另一个类比来比较 OOP 和 FP：组织派对。\n\n在 OOP 派对中，每位客客代表一个对象，他们相互交流、互动，分享故事并改变心情。派对的氛围是动态且不断变化的，因为客人（对象）会不断影响对方。有时，客人们还会根据共同的兴趣或特征形成小组（`inheritance`）。\n\
    \n相比之下，FP 派对更像是一场聚餐（potluck dinner），每位客人带一道菜（`function`），为整个盛宴做出贡献。菜肴在派对之前就已经准备好了，并在期间保持不变。派对的成功取决于菜肴的构思组合，它们能够良好配合。没有社交或对彼此心情的影响；客人们只是在一个安静且可预测的环境享受美味食物。\n\
    \n### 核心要点\n\n这些类比并不完美，但它们为理解 OOP 和 FP 之间的核心差异提供了一个更易于理解且更轻松的视角：\n\n*   OOP 关注对象之间的交互，导致了动态且有时不可预测的行为。相比之下，FP\
    \ 强调函数的组合以创建可预测且一致的结果。\n*   **可变状态**是 OOP 的核心方面，而 FP 偏好**不可变性和无状态**，从而减少了意外和副作用。\n\
    *   OOP 中的代码复用依赖于继承和多态，而 FP 则通过函数组合和高阶函数来实现。\n*   请记住，这些只是帮助你更好地理解概念的趣味示例。在现实中，OOP\
    \ 和 FP 可以共存，许多现代编程语言都支持这两种范式。作为程序员，你可以混合使用这些方法，为你的特定问题找到最佳解决方案。关键在于理解它们的优缺点并明智地应用它们。\n\
    \n# 1.3. 函数式编程的优势\n\n函数式编程与其它范式（如面向对象编程）相比具有许多优势。以下是使用函数式编程的一些关键优势：\n\n*   **更容易推理**：纯函数和不可变性使得理解代码的行为变得简单。由于函数没有副作用，并且对于给定的输入总是产生相同的输出，你可以更轻松地分析和预测代码的行为。\n\
    *   **更容易测试和调试**：通过纯函数，测试变得更加直观。你只需要用不同的输入测试函数，而无需担心隐藏的状态或副作用。这使得调试变得更简单，因为你可以关注单个函数，而不是对象之间复杂的交互。\n\
    *   **并发与并行性**：函数式编程对不可变性和缺乏共享状态的强调使其天生适用于并发和并行编程。由于数据不会被更改，因此不需要锁或其他同步机制，允许编写更高效、可扩展的并发代码。\n\
    *   **代码复用性与模块化**：函数式编程中的函数被设计为小型的、可复用的且组合组合。这鼓励了模块化，并允许你通过链接简单函数来构建复杂行为。\n* \
    \  **表达性**：函数式编程通常会导致更简洁、更有表现力的代码。高阶函数、模式匹配和其他函数式编程特性允许你编写更易理解和维护的代码。\n*   **重构与可维护性**：由于函数式编程促进使用小型纯函数并避免可变状态，代码变得更容易重构和维护。从长远来看，这可以带来更稳定、更易维护的代码库。\n\
    *   **减少 Bug 潜力**：由于函数式编程消除了副作用和可变状态，减少了因状态意外变化而引入 Bug 的可能性。这可以带来更可靠健壮的软件。\n*\
    \   **适应变化的需求**：函数式编程的模块化和组合使得代码更容易适应变化的需求。较小、独立的函数可以被快速修改或替换，而不影响整个系统。\n\n虽然函数式编程有很多优势，但必须记住，没有任何编程范式对所有情况都是完美的。有时，函数式和面向对象编程的结合可以产生最有效的解决方案。关键在于理解每种方法的优缺点，并在项目中恰当地使用它们。\n\
    \n在接下来的章节中，我们将使用 C# 深入探索函数式编程的世界。你将学习如何利用 C# 的函数式特性来编写更有表现力、更于维护且健壮的代码，即使你对应用程序的部分仍然在使用面向对象编程原则。\n\
    \n# 第 2 章：C# 与函数式编程：成长的友谊\n\n## 2.1. C# 的演变及其函数式特性\n\nC# 自诞生以来已经走了很远。多年来，语言不断演进以纳入函数式编程特性，使得在\
    \ C# 中编写函数式代码变得更容易。让我们简单回顾一下 C# 的历史，看看它与函数式编程的关系是如何发展的。\n\nC# 1.0 - 2.0：C# 的早期阶段受\
    \ Java 影响很大，主要关注面向对象编程。虽然函数式编程并非核心，但 C# 确实引入了委托（delegates），为未来的函数式特性奠定了基础。\n\n\
    C# 3.0：C# 3.0 中 `LINQ`（语言集成查询）的引入标志着该语言函数演进的重大里程碑。LINQ 引入了 Lambda 表达式、扩展方法和匿名类型，使得在\
    \ C# 中编写函数式代码变得简单。此外，C# 3.0 整合了隐式类型局部变量（`var`）、对象和集合初始化以及自动属性，进一步增强了语言的表达性。\n\n\
    ```\n// LINQ 示例\nvar numbers = new List<int> { 1, 2, 3, 4, 5 };\nvar evenNumbers\
    \ = numbers.Where(n => n % 2 == 0);\n```\n\nC# 4.0：C# 4.0 增加了对动态类型以及命名和可选参数的支持，为处理函数时提供了更大的灵活性。\n\
    \nC# 5.0：随着 `async` 和 `await` 关键字的引入，C# 5.0 使得使用函数式方法编写异步代码变得更容易。这导致了更具表达力且简洁的异步代码，这种代码在函数式编程中很常见。\n\
    \n```\n// async 和 await 示例\npublic async Task<int> FetchDataAsync()\n{\n    var\
    \ result = await SomeApi.GetDataAsync();\n    return result.Count;\n}\n```\n\n"
- fmt: "\n# C# 6.0 - 7.x: These versions of C# added many functional features, such\
    \ as expression-bodied members, pattern matching, and local functions. The introduction\
    \ of tuples and deconstruction made it easier to work with multiple return values,\
    \ a common pattern in functional programming.\n\n```csharp\n// Example of pattern\
    \ matching\n\npublic string DescribeShape(object shape)\n{\n    return shape switch\n\
    \    {\n        Circle c => $\"A circle with a radius of {c.Radius}\",\n     \
    \   Rectangle r => $\"A rectangle with a width of {r.Width} and a height of {r.Height}\"\
    ,\n        _ => \"An unknown shape\"\n    };\n}\n```\n\nC# 8.0 - 9.0: With nullable\
    \ reference types, C# moved closer to functional programming by encouraging the\
    \ use of explicit nullability, which promotes safer code. Other functional enhancements\
    \ include switch expressions, records, and init-only properties.\n\n```csharp\n\
    // Example of records\n\npublic record Point(int X, int Y);\n```\n\n## 2.2. The\
    \ C# Functional Ecosystem\n\nC#’s growing support for functional programming has\
    \ led to the development of a rich ecosystem of libraries and tools that further\
    \ enhance its functional capabilities. Some popular libraries and frameworks include:\n\
    \n- **F# Core Library**: F# is a functional-first programming language that runs\
    \ on the .NET platform. Its core library offers many functional programming constructs\
    \ that can be used in C# as well.\n- **LanguageExt**: LanguageExt is a library\
    \ that provides a comprehensive set of functional extensions for C#, including\
    \ options, immutable collections, and monads like `Either` and `Try`.\n- **Immutable\
    \ Collections**: The `System.Collections.Immutable` namespace offers a set of\
    \ immutable collection types, which are ideal for functional programming scenarios\
    \ where mutable state should be avoided.\n\n```csharp\n// Example of using an\
    \ immutable list\n\nusing System.Collections.Immutable;\n\nvar list = ImmutableList<int>.Empty;\n\
    list = list.Add(1);\nlist = list.Add(2);\nlist = list.Add(3);\n```\n\n- **Reactive\
    \ Extensions (Rx.NET)**: Reactive Extensions is a library for composing asynchronous\
    \ and event-based programs using observable sequences and LINQ-style query operators.\
    \ It allows for a more functional and declarative approach to handling asynchronous\
    \ and event-driven programming.\n\n```csharp\n// Example of using Reactive Extensions\n\
    \nusing System.Reactive.Linq;\n\nIObservable<int> source = Observable.Range(1,\
    \ 5);\nIObservable<int> evenNumbers = source.Where(x => x % 2 == 0);\nevenNumbers.Subscribe(x\
    \ => Console.WriteLine($\"Even number: {x}\"));\n```\n\n## 2.3. Hybrid Programming:\
    \ Combining OO and FP in C\n\nC#’s versatility as a hybrid programming language\
    \ allows developers to combine object-oriented and functional programming paradigms,\
    \ depending on the problem at hand. This can lead to more expressive, maintainable,\
    \ and robust code.\n\n### When combining OO and FP in C#, consider the following\
    \ guidelines:\n\n- **Embrace immutability**: Make your classes and their properties\
    \ immutable whenever possible. This helps reduce side effects and makes your code\
    \ more predictable.\n\n```csharp\npublic class Customer\n{\n    public Customer(int\
    \ id, string name)\n    {\n        Id = id;\n        Name = name;\n    }\n   \
    \ public int Id { get; }\n    public string Name { get; }\n}\n```\n\n- **Use pure\
    \ functions**: Favor methods that do not have side effects and depend solely on\
    \ their input parameters. This makes your code easier to reason about and test.\n\
    \n```csharp\npublic int Add(int x, int y) => x + y;\n```\n\n- **Take advantage\
    \ of higher-order functions**: Use higher-order functions like `Select`, `Where`,\
    \ and `Aggregate` from LINQ to manipulate data in a more functional and expressive\
    \ way.\n\n```csharp\nvar totalLength = words.Where(word => !string.IsNullOrEmpty(word))\n\
    \                      .Select(word => word.Length)\n                      .Aggregate((sum,\
    \ length) => sum + length);\n```\n\n- **Consider functional constructs**: Use\
    \ functional constructs like `Option`, `Either`, and `Try` from libraries like\
    \ `LanguageExt` to model your code in a more functional way and better handle\
    \ failures and edge cases.\n\n- **Leverage pattern matching**: Use pattern matching\
    \ to handle complex conditional logic in a more concise and readable manner.\n\
    \nBy blending object-oriented and functional programming approaches in C#, you\
    \ can harness the strengths of both paradigms to write more expressive, maintainable,\
    \ and robust code. As you dive deeper into the world of functional programming\
    \ with C#, you may find yourself making jokes like, “Why did the functional programmer\
    \ get thrown out of school? Because they refused to take classes!” All jokes aside,\
    \ we hope this chapter has provided you with a solid foundation for exploring\
    \ the exciting possibilities that C# offers for functional programming.\n\n# Chapter\
    \ 3: Functional Building Blocks in C\n\nWelcome back, fellow coder! Are you ready\
    \ to dig deeper into functional programming in C#? You’re in luck, because in\
    \ this chapter, we’re going to explore the essential building blocks that make\
    \ functional programming so groovy. We’ll cover pure functions, immutability,\
    \ higher-order functions, lambda expressions, and closures, all while keeping\
    \ it relaxed and fun. So, grab a snack, put on your favorite tunes, and let’s\
    \ dive in!\n\n## 3.1. Pure Functions and Immutability - The Dynamic Duo\n\nLet’s\
    \ dive into the fascinating world of pure functions and immutability.\n\n### Pure\
    \ Functions:\n\nRecall that a pure function is a function that always produces\
    \ the same output for same input and has no side effects. Side effects include\
    \ modifying variables outside the function, interacting with external systems\
    \ (like I/O), or just printing something to the console. Pure functions are like\
    \ well-behaved students in a classroom, never causing trouble.\n\n### Advantages\
    \ of pure functions:\n\n- **Easy to reason about**: Since they depend only on\
    \ input and always produce same output, you can easily predict what a pure function\
    \ will do.\n- **Easy to test**: With no dependencies or side effects, testing\
    \ pure functions is a breeze.\n- **Cacheable**: Since they always return the same\
    \ output for same input, you can cache the results of a pure function, making\
    \ your code faster and more efficient.\n\n### Examples of pure functions:\n\n\
    ```csharp\n// Length of a string\nint Length(string str)\n{\n    return str.Length;\n\
    }\n\n// Checking if a number is even\nbool IsEven(int number)\n{\n    return number\
    \ % 2 == 0;\n}\n\n// Concatenating two strings\nstring Concat(string a, string\
    \ b)\n{\n    return a + b;\n}\n```\n\n### Immutability:\n\nImmutability is all\
    \ about keeping data constant and unchangeable. In functional programming, we\
    \ prefer to work with immutable data structures, which makes our code more predictable\
    \ and less error-prone. Immutability is like a well-maintained garden, where everything\
    \ stays in its place, and you don’t have to worry about getting getting up.\n\n\
    ### Advantages of immutability:\n\n- **Simplifies code**: Immutable data structures\
    \ reduce the need for error-prone defensive copying and make it easier to reason\
    \ about the state of your data.\n- **Enhances thread safety**: Since immutable\
    \ data structures cannot be changed once they’re created, you don’t have to worry\
    \ about synchronization issues in multithreaded code.\n- **Encourages functional\
    \ programming**: Immutability goes hand in hand with pure functions and other\
    \ functional programming concepts, promoting a cleaner and more maintainable coding\
    \ style.\n\n### Examples of immutability:\n\nUsing readonly fields:\n\n```csharp\n\
    public class ImmutablePerson\n{\n    public readonly string Name;\n    public\
    \ readonly int Age;\n\n    public ImmutablePerson(string name, int age)\n    {\n\
    \        Name = name;\n        Age = age;\n    }\n}\n```\n\nUsing immutable collections:\n\
    \n```csharp\nusing System.Collections.Immutable;\n\nvar immutableList = ImmutableList.Create(1,\
    \ 2, 3);\nvar newList = immutableList.Add(4); // Creates a new list with 4 added,\
    \ doesn't modify the original list\n```\n\nCombining pure functions and immutability:\n\
    \n```csharp\npublic class ImmutableCircle\n{\n```\n"
