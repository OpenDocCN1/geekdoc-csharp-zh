    \  int accountId)\n\n{\n\n    var result =  await  (from customer in  GetCustomerAsync(customerId)\n\
    \nfrom account in  GetAccountAsync(accountId)\n\nfrom transactions in  GetRecentTransactionsAsync(accountId)\n\
    \n                        select  (customer, account, transactions));\n\nreturn\
    \ result;\n\n}\n\nIn the FetchCustomerAccountDataAsync method, we combined the\
    \ fetching of customer data, account data, and recent transactions using LINQ\
    \ query syntax with our Task extension methods. This allows us to create an asynchronous\
    \ functional pipeline, which is both readable and maintainable.\n\nNow, let’s\
    \ create another example using our pipeline. This time, we’ll filter the recent\
    \ transactions to display only the transactions that exceed a certain threshold.\n\
    \npublic async Task<(Customer, Account, List<Transaction>)>  FetchFilteredCustomerAccountDataAsync(int\
    \ customerId,  int accountId,  decimal threshold)\n\n{\n\n    var result =  await\
    \  (from customer in  GetCustomerAsync(customerId)\n\nfrom account in  GetAccountAsync(accountId)\n\
    \nfrom transactions in  GetRecentTransactionsAsync(accountId)\n\nlet filteredTransactions\
    \ = transactions.Where(t => Math.Abs(t.Amount)  > threshold).ToList()\n\n                        select\
    \  (customer, account, filteredTransactions));\n\nreturn result;\n\n}\n\nIn this\
    \ method, we added a new step in the LINQ query that filters the transactions\
    \ before returning the result. The let keyword allows us to introduce a new filteredTransactions\
    \ variable, which holds the filtered transaction list. The Where function is used\
    \ to filter the transactions based on the given threshold.\n\nNow that we’ve seen\
    \ how to build asynchronous functional pipelines using LINQ query syntax and Task\
    \ extension methods, let’s explore how to handle errors in these pipelines. In\
    \ the functional programming world, the Result type (also known as the Either\
    \ monad) is commonly used to represent the result of a computation that may fail.\n\
    \nTo integrate the Result type in our pipeline, let’s create a Task<Result> class\
    \ that represents an asynchronous computation that may fail:\n\npublic  class\
    \ TaskResult<T>\n\n{\n\n public Task<Result<T>> Value {  get;  }\n\npublic  TaskResult(Task<Result<T>>\
    \ value)\n\n    {\n\nValue = value;\n\n    }\n\n}\n\nNow, we can create extension\
    \ methods for the TaskResult class similar to our Task extension methods. This\
    \ will allow us to create asynchronous functional pipelines that handle errors\
    \ in a functional way.\n\npublic  static  class TaskResultExtensions\n\n{\n\n\
        public  static async TaskResult<TResult> Select<TSource, TResult>(this TaskResult<TSource>\
    \ taskResult, Func<TSource, TResult> selector)\n\n    {\n\n        var result\
    \ = await taskResult.Value.ConfigureAwait(false);\n\n        return result.IsSuccess\n\
    \n            ?  new TaskResult<TResult>(Task.FromResult(new Result<TResult>(selector(result.Value))))\n\
    \n            :  new TaskResult<TResult>(Task.FromResult(new Result<TResult>(result.ErrorMessage)));\n\
    \n    }\n\npublic  static async TaskResult<TResult> SelectMany<TSource, TResult>(this\
    \ TaskResult<TSource> taskResult, Func<TSource, TaskResult<TResult>> selector)\n\
    \n    {\n\n        var result = await taskResult.Value.ConfigureAwait(false);\n\
    \n        return result.IsSuccess\n\n            ?  selector(result.Value)\n\n\
                :  new TaskResult<TResult>(Task.FromResult(new Result<TResult>(result.ErrorMessage)));\n\
    \n    }\n\npublic  static async TaskResult<TResult> SelectMany<TSource, TCollection,\
    \ TResult>(this TaskResult<TSource> taskResult, Func<TSource, TaskResult<TCollection>>\
    \ collectionSelector, Func<TSource, TCollection, TResult> resultSelector)\n\n\
        {\n\n        var result = await taskResult.Value.ConfigureAwait(false);\n\n\
             if  (result.IsSuccess)\n\n        {\n\n            var source = result.Value;\n\
    \n            var collectionResult = await collectionSelector(source).Value.ConfigureAwait(false);\n\
    \n            return collectionResult.IsSuccess\n\n                ?  new TaskResult<TResult>(Task.FromResult(new\
    \ Result<TResult>(resultSelector(source, collectionResult.Value))))\n\n                :\
    \  new TaskResult<TResult>(Task.FromResult(new Result<TResult>(collectionResult.ErrorMessage)));\n\
    \n        }\n\n        else\n\n        {\n\n            return  new TaskResult<TResult>(Task.FromResult(new\
    \ Result<TResult>(result.ErrorMessage)));\n\n        }\n\n    }\n\n}"
