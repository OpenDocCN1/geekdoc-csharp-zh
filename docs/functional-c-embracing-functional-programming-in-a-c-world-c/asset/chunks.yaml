    \ In functional programming, Memoization allows you to remember and store the\
    \ results of expensive function calls, so you don’t have to recalculate them if\
    \ the same inputs are provided again.\n\nMemoization can significantly improve\
    \ the performance of recursive functions or computations with overlapping subproblems.\
    \ In C#, you can implement Memoization using dictionaries, caches, or even custom\
    \ decorators.\n\nLet’s explore some examples to better understand Memoization\
    \ in action.\n\n### 5.4.1\\. Memoizing Recursive Functions\n\nConsider the classic\
    \ example of computing Fibonacci numbers using a naive recursive implementation:\n\
    \nusing System;\n\nclass Program\n\n{\n\n    static  int  Fibonacci(int n)\n\n\
        {\n\n        if  (n <=  1)  return n;\n\n        return  Fibonacci(n -  1)\
    \  +  Fibonacci(n -  2);\n\n    }\n\nstatic  void  Main()\n\n    {\n\n        Console.WriteLine($\"\
    The 30th Fibonacci number is {Fibonacci(30)}\");\n\n    }\n\n}\n\nThe problem\
    \ with this implementation is that it recalculates the same Fibonacci numbers\
    \ multiple times, leading to an exponential runtime. We can optimize this code\
    \ by memoizing the results of previous computations:\n\nusing System;\n\nusing\
    \ System.Collections.Generic;\n\nclass Program\n\n{\n\n static Dictionary<int,\
    \  int> _memo =  new Dictionary<int,  int>();\n\nstatic  int  Fibonacci(int n)\n\
    \n    {\n\n        if  (n <=  1)  return n;\n\nif  (!_memo.ContainsKey(n))\n\n\
            {\n\n            _memo[n]  =  Fibonacci(n -  1)  +  Fibonacci(n -  2);\n\
    \n        }\n\nreturn _memo[n];\n\n    }\n\nstatic  void  Main()\n\n    {\n\n\
            Console.WriteLine($\"The 30th Fibonacci number is {Fibonacci(30)}\");\n\
    \n    }\n\n}\n\nIn this example, we used a dictionary to store the results of\
    \ previous Fibonacci calculations. When a Fibonacci number is requested, we first\
    \ check if it’s already in the dictionary. If it is, we return the memoized value,\
    \ avoiding the need for redundant calculations.\n\n### 5.4.2\\. Creating a Memoization\
    \ Decorator\n\nA more reusable approach to Memoization is to create a custom decorator\
    \ that can memoize any function. Let’s implement a generic Memoize extension method:\n\
    \npublic  static  class MemoizeExtensions\n\n{\n\n    public  static Func<T, TResult>\
    \ Memoize<T, TResult>(this Func<T, TResult> func)\n\n    {\n\n        var memo\
    \ =  new Dictionary<T, TResult>();\n\nreturn arg =>\n\n        {\n\n            if\
    \  (!memo.ContainsKey(arg))\n\n            {\n\n                memo[arg]  = \
    \ func(arg);\n\n            }\n\nreturn memo[arg];\n\n        };\n\n    }\n\n\
    }\n\nNow, we can use this decorator to memoize any function. Let’s use it to memoize\
    \ our original Fibonacci function:\n\nusing System;\n\nusing MemoizeLibrary;\n\
    \nclass Program\n\n{\n\n    static  int  Fibonacci(int n)\n\n    {\n\n        if\
    \  (n <=  1)  return n;\n\n        return  MemoizedFibonacci(n -  1)  +  MemoizedFibonacci(n\
    \ -  2);\n\n    }\n\nstatic Func<int,  int> MemoizedFibonacci =  ((Func<int, \
    \ int>)Fibonacci).Memoize();\n\nstatic  void  Main()\n\n    {\n\n        Console.WriteLine($\"\
    The 30th Fibonacci number is {MemoizedFibonacci(30)}\");\n\n    }\n\n}\n\nIn this\
    \ example, we used the Memoize extension method to create a memoized version of\
    \ the Fibonacci function. This approach is more reusable, as it can be applied\
    \ to any function with a single input and output."
