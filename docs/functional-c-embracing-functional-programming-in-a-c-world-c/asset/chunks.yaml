  trans: "\n持久化数据类型：不可变且高效的数据结构，例如持久化列表、映射和集合，它们能够实现安全且高效的函数式编程。代数数据类型：支持和类型（也称为判别联合），允许你建模复杂数据类型并以更精确的方式表示数据。单\
    \ ad（Monads）和单 ad 变换器：单 ad 和单 ad 变换器的集合，包括 `Option`、`Either`、`Try`、`Task` 和 `State`，帮助你以函数式方式管理副作用、错误和状态。高阶函数：丰富的高阶函数集，例如\
    \ `Map`、`Bind`、`Fold` 和 `Filter`，能够实现强大且表现性的数据操作。透镜（Lenses）和光学（Optics）：用于处理不可变数据结构的工具，允许你在无需要过多样板代码的情况下操作深层嵌套的数据。要开始使用\
    \ `Language-Ext`，你可以安装 NuGet 包：\n\n```bash\nInstall-Package LanguageExt.Core\n\
    ```\n\n安装包后，你可以通过添加适当的 `using` 语句在 C# 代码中开始使用该库。例如，要使用 `Option` 单 ad，你可以添加：\n\n\
    ```csharp\nusing LanguageExt;\nusing static LanguageExt.Prelude;\n```\n\n让我们探索一个在\
    \ C# 程序中使用 `Language-Ext` 的简单示例。我们将使用 `Option` 单 ad 来表示一个可空值，并演示如何使用 `Map` 和 `Match`\
    \ 函数来处理它。\n\n```csharp\nOption<string> GetName(int id)\n{\n    if (id == 1) return\
    \ Some(\"Alice\");\n    if (id == 2) return Some(\"Bob\");\n    return None;\n\
    }\n\nvar name = GetName(1);\nvar upperName = name.Map(s => s.ToUpper());\nvar\
    \ result = upperName.Match(\n    Some: s => $\"Name: {s}\",\n    None: () => \"\
    Name not found\"\n);\nConsole.WriteLine(result);  // 输出: \"Name: ALICE\"\n```\n\
    \n在这个示例中，我们定义了一个 `GetName` 函数，它返回一个表示可空名称的 `Option`。我们我们使用 `Map` 函数将名称转换为大写，并使用\
    \ `Match` 函数处理处理 `Some` 和 `None` 情况。\n\n# 在继续学习本章，我们将探索更多功能和库，帮助你在 C# 中利用函数式编程技术。\n\
    \n# 第 11 章：结合 Language-Ext 使用单 ad\n\n`Language-Ext` 提供了一组丰富的单 ad，可以帮助你以函数式方式管理副作用、错误和状态。在本节中，我们将通过实际示例演示\
    \ `Language-Ext` 中提供的各种单 ad。\n\n注意：假设你已经安装了 `Language-Ext` NuGet 包并在代码中添加了适当的\
    \ `using` 语句。\n\n## Option 单 ad\n\n`Option` 单 ad 表示一个可空值，允许你以安全且函数式的方式处理可能缺失的数据。\n\
    \n```csharp\nOption<int> Divide(int numerator, int denominator)\n{\n    return\
    \ denominator == 0 ? None : Some(numerator / denominator);\n}\n\nvar result =\
    \ Divide(10, 2)\n    .Map(x => x * 2)\n    .Match(\n        Some: x => $\"Result:\
    \ {x}\",\n        None: () => \"Cannot divide by zero\"\n    );\nConsole.WriteLine(result);\
    \  // 输出: \"Result: 10\"\n```\n\n## Either 单 ad\n\n`Either` 单 ad 表示一个可以是两种类型之一的值，通常用于错误处理，其中一种类型表示错误，另一种类型表示成功。\n\
    \n```csharp\nEither<string, int> SafeDivide(int numerator, int denominator)\n\
    {\n    return denominator == 0 ? Left(\"Cannot divide by zero\") : Right(numerator\
    \ / denominator);\n}\n\nvar result = SafeDivide(10, 2)\n    .Map(x => x * 2)\n\
    \    .Match(\n        Left: error => $\"Error: {error}\",\n        Right: value\
    \ => $\"Result: {value}\"\n    );\nConsole.WriteLine(result);  // 输出: \"Result:\
    \ 10\"\n```\n\n## Try 单 ad\n\n`Try` 单 ad 用于以函数式方式捕获和管理异常。\n\n```csharp\nTry<int>\
    \ ParseInt(string input)\n{\n    return Try(() => int.Parse(input));\n}\n\nvar\
    \ result = ParseInt(\"42\")\n    .Map(x => x * 2)\n    .Match(\n        Fail:\
    \ ex => $\"Error: {ex.Message}\",\n        Succ: value => $\"Result: {value}\"\
    \n    );\nConsole.WriteLine(result);  // 输出: \"Result: 84\"\n```\n\n## Task 单\
    \ ad\n\n`Task` 单 ad 表示异步计算，可以结合 `Language-Ext` 使用，以函数式方式管理异步操作。\n\n```csharp\n\
    async Task<Option<string>> GetNameAsync(int id)\n{\n    await Task.Delay(1000);\n\
    \    return id == 1 ? Some(\"Alice\") : None;\n}\n\nvar result = await GetNameAsync(1)\n\
    \    .Map(name => name.ToUpper())\n    .Match(\n        Some: name => $\"Name:\
    \ {name}\",\n        None: () => \"Name not found\"\n    );\nConsole.WriteLine(result);\
    \  // 输出: \"Name: ALICE\"\n```\n\n## State 单 ad\n\n`State` 单 ad 允许你以函数式方式管理可变状态。\n\
    \n```csharp\nusing LanguageExt.Instances;\n\nState<Dictionary<string, int>, int>\
    \ IncrementCounter(string key)\n{\n    return state =>\n    {\n        if (!state.ContainsKey(key))\n\
    \        {\n            state[key] = 0;\n        }\n        state[key]++;\n  \
    \      return (state, state[key]);\n    };\n}\n\nvar initialState = new Dictionary<string,\
    \ int>();\nvar (updatedState, counterValue) = IncrementCounter(\"A\").Run(initialState);\n\
    Console.WriteLine($\"Counter value: {counterValue}\"); // 输出: \"Counter value:\
    \ 1\"\n```\n\n在本节中，我们提供了使用 `Language-Ext` 中各种单 ad 的实际示例，包括 `Option`、`Either`、`Try`、`Task`\
    \ 和 `State`。\n\n## C 的其他函数式库\n\n除了 `Language-Ext`，还有其他适用于 C 的函数式库。在本节中，我们将要介绍这些库的功能，它们可以进一步丰富你的函数式编程体验。\n\
    \n### FSharpx.Extras\n\n`FSharpx.Extras` 是一个为 C# 提供一组工具函数和类型的库，旨在填补语言在函数式功能方面的空白。FSharpx.Extras\
    \ 的功能包括：\n\n*   判别联合：一种可以是多个命名情况之一的类型。\n*   函数组合：用于组合和操作函数的工具，如 `compose`、`curry`\
    \ 和 `uncurry`。\n*   额外的单 ad：支持 `Reader`、`Writer` 和 `Cont` 单 ad。\n*   异步扩展：使用 `Task`\
    \ 类型处理异步计算的扩展。\n\n你可以通过 NuGet 包安装 `FSharpx.Extras`：\n\n```bash\nInstall-Package\
    \ FSharpx.Extras\n```\n\n### CSharpFunctionalExtensions\n\n`CSharpFunctionalExtensions`\
    \ 是一个专注于为 C 提供简单且轻量级函数式编程工具的库。它包含了用于错误处理的 `Result` 单 ad，以及一组用于处理空类型、集合和其他 C 语言构造体的更函数式方式的扩展方法。\n\
    \n你可以通过 NuGet 包安装 `CSharpFunctionalExtensions`：\n\n```bash\nInstall-Package CSharpFunctionalExtensions\n\
    ```\n\n### FsCheck\n\n`FsCheck` 是一个用于属性测试的库，该测试技术源自 Haskell 的 `QuickCheck` 库。属性测试允许你表达代码应该满足的属性，`FsCheck`\
    \ 将生成测试用例来检查这些属性是否成立。这种测试方法可以用更少的人用测试创建实现更全面的测试。\n\n你可以通过 NuGet 包安装 `FsCheck`：\n\
    \n```bash\nInstall-Package FsCheck\n```\n\n### MoreLINQ\n\n`MoreLINQ` 是一个扩展了 LINQ\
    \ to Objects 运算符额外功能的库，提供了更强大且具表现性的函数式方式来处理集合。`MoreLINQ` 包含了许多处理序列的方法，例如 `DistinctBy`、`Partition`、`TakeEvery`\
    \ 和 `Scan` 等。\n"
- fmt: "\nYou can install `MoreLINQ` using the NuGet package manager:\n\n```\nInstall-Package\
    \ MoreLinq\n```\n\n## 11.4. MoreLINQ: Practical Examples\n\nIn this section, we’ll\
    \ explore practical examples of using `MoreLINQ` to perform more powerful and\
    \ expressive operations on collections in a functional style.\n\nNote: To follow\
    \ the examples, make sure to install the `MoreLINQ` NuGet package and add the\
    \ appropriate `using` statement in your code:\n\n```csharp\nusing MoreLinq;\n\
    ```\n\n### 11.4.1 DistinctBy\n\n`DistinctBy` allows you to filter out duplicate\
    \ elements in a collection based on a key selector function.\n\n```csharp\nclass\
    \ Employee\n{\n public int Id { get; set; }\n public string Name { get; set; }\n\
    }\n\nvar employees =  new List<Employee>\n{\n new Employee { Id = 1, Name = \"\
    Alice\" },\n new Employee { Id = 2, Name = \"Bob\" },\n new Employee { Id = 1,\
    \ Name = \"Alice\" }\n};\n\nvar distinctEmployees = employees.DistinctBy(e =>\
    \ e.Id).ToList();\n\nforeach (var employee in distinctEmployees)\n{\n    Console.WriteLine($\"\
    Employee Id: {employee.Id}, Name: {employee.Name}\");\n}\n\n// Output:\n// Employee\
    \ Id: 1, Name: Alice\n// Employee Id: 2, Name: Bob\n```\n\n### 11.4.2 Partition\n\
    \n`Partition` divides a collection into two separate collections based on a predicate\
    \ function.\n\n```csharp\nvar numbers =  new[] { 1, 2, 3, 4, 5, 6 };\nvar (evens,\
    \ odds) = numbers.Partition(n => n % 2 == 0);\nConsole.WriteLine($\"Evens: {string.Join(\"\
    ,  \", evens)}\");  // Output: \"Evens: 2, 4, 6\"\nConsole.WriteLine($\"Odds:\
    \ {string.Join(\",  \", odds)}\");  // Output: \"Odds: 1, 3, 5\"\n```\n\n### 11.4.3\
    \ TakeEvery\n\n`TakeEvery` selects every N-th element from a collection.\n\n```csharp\n\
    var numbers = Enumerable.Range(1, 10);\nvar everyThirdNumber = numbers.TakeEvery(3);\n\
    Console.WriteLine($\"Every third number: {string.Join(\",  \", everyThirdNumber)}\"\
    );  // Output: \"Every third number: 3, 6, 9\"\n```\n\n### 11.4.4 Scan\n\n`Scan`\
    \ performs a rolling aggregation on a collection, applying a function to each\
    \ element and accumulating the results.\n\n```csharp\nvar numbers =  new[] { 1,\
    \ 2, 3, 4, 5 };\nvar runningTotals = numbers.Scan(0, (total, x) => total + x);\n\
    Console.WriteLine($\"Running totals: {string.Join(\",  \", runningTotals)}\");\
    \  // Output: \"Running totals: 1, 3, 6, 10, 15\"\n```\n\nIn this section, we\
    \ briefly introduced several functional programming libraries for C# that complement\
    \ and extend the core language features. By exploring and incorporating these\
    \ libraries into your projects, you can further enhance your functional programming\
    \ skills and take full advantage of the functional programming paradigm in C#.\n\
    \n# Chapter 12: Real-World Applications and Case Studies\n\n## 12.1 Functional\
    \ Programming in Web Development: A Sci-Fi-Inspired Adventure\n\nIn a galaxy not\
    \ so far away, a group of functional programming pioneers embarked on a mission\
    \ to boldly go where no developer has gone before. They sought to combine functional\
    \ programming and event sourcing to create web applications that were more elegant,\
    \ maintainable, and scalable. With C# as their programming language of choice,\
    \ they set out to demonstrate the power of functional programming and event sourcing\
    \ in modern web development.\n\n### Language-Ext: The Warp Drive of Functional\
    \ Programming\n\nIn the C# universe, `Language-Ext` is a powerful library that\
    \ brings the best of functional programming to the world of `.NET`. By utilizing\
    \ advanced features like immutable data structures, monads, and agents, developers\
    \ can create expressive and safe web applications. For this journey, we’ll create\
    \ a wallet API that allows users to add and remove galactic credits from their\
    \ wallet using a functional approach, agents to avoid concurrency issues, and\
    \ event sourcing for tracking changes.\n\n### Event Sourcing: The Temporal Prime\
    \ Directive\n\nEvent sourcing is an architectural pattern that represents the\
    \ state of an application as a sequence of events. Instead of updating the state\
    \ directly, changes are recorded as events, allowing the state to be recreated\
    \ by replaying these events. This approach provides many benefits, such as improved\
    \ scalability, simplified debugging, and a built-in audit trail. By integrating\
    \ event sourcing into our wallet API, we’ll uphold the Temporal Prime Directive\
    \ and ensure a proper history of our wallet balance changes.\n\n### MongoDB: The\
    \ Intergalactic Database\n\nTo store our events, we’ll use `MongoDB`, a popular\
    \ and flexible NoSQL database. This will allow us to persist our events and recreate\
    \ the state of the wallet whenever needed. First, let’s set up the MongoDB connection\
    \ and create a collection to store our wallet events.\n\nInstall the MongoDB driver\
    \ for C# by adding the following package:\n\n```\ndotnet add package MongoDB.Driver\n\
    ```\n\nNow, let’s set up our MongoDB connection and create a `WalletEventRepository`\
    \ to handle saving and loading events.\n\n```csharp\nusing MongoDB.Driver;\n\n\
    public class WalletEventRepository\n{\n    private readonly IMongoCollection<WalletEvent>\
    \ _walletEvents;\n    public WalletEventRepository(string connectionString, string\
    \ databaseName, string collectionName)\n    {\n        var client = new MongoClient(connectionString);\n\
    \        var database = client.GetDatabase(databaseName);\n        _walletEvents\
    \ = database.GetCollection<WalletEvent>(collectionName);\n    }\n    public async\
    \ Task SaveEvent(WalletEvent walletEvent) => await _walletEvents.InsertOneAsync(walletEvent);\n\
    \    public async Task<List<WalletEvent>> GetAllEvents() => await _walletEvents.Find(_\
    \ => true).ToListAsync();\n}\n```\n\n### The Wallet Agent with Event Sourcing\n\
    \nFirst, let’s create our wallet agent using the `Actor` class. The agent will\
    \ handle concurrency and ensure only one operation is executed at a time. We’ll\
    \ integrate event sourcing into the wallet to track changes and use `MongoDB`\
    \ to store events.\n\n```csharp\nusing LanguageExt;\nusing Prelude;\nusing System.Collections.Immutable;\n\
    \npublic class WalletAgent\n{\n    private readonly Actor<ImmutableList<WalletEvent>>\
    \ agent;\n    private readonly WalletEventRepository eventRepository;\n    public\
    \ WalletAgent(WalletEventRepository eventRepository)\n    {\n        this.eventRepository\
    \ = eventRepository;\n        agent = Actor<ImmutableList<WalletEvent>>.Create(async\
    \ (events, msg) => msg switch\n        {\n            AddMoney addMoney =>\n \
    \           {\n                var newEvent = new WalletEvent.Added(addMoney.Amount);\n\
    \                await eventRepository.SaveEvent(newEvent);\n                return\
    \ events.Add(newEvent);\n            },\n            RemoveMoney removeMoney =>\n\
    \            {\n                var newEvent = new WalletEvent.Removed(removeMoney.Amount);\n\
    \                await eventRepository.SaveEvent(newEvent);\n                return\
    \ events.Add(newEvent);\n            },\n            _ => events\n        }, ImmutableList<WalletEvent>.Empty);\n\
    \    }\n    public async Task<ImmutableList<WalletEvent>> AddMoney(decimal amount)\
    \ => await agent.Ask<ImmutableList<WalletEvent>>(new AddMoney(amount));\n    public\
    \ async Task<ImmutableList<WalletEvent>> RemoveMoney(decimal amount) => await\
    \ agent.Ask<ImmutableList<WalletEvent>>(new RemoveMoney(amount));\n    public\
    \ async Task<decimal> GetBalance()\n    {\n        var events = await eventRepository.GetAllEventsAsync();\n\
    \        return events.Aggregate(0m, (balance, evt) => evt switch\n        {\n\
    \            WalletEvent.Added added => balance + added.Amount,\n            WalletEvent.Removed\
    \ removed => balance - removed.Amount,\n            _ => balance\n        });\n\
    \    }\n}\n```\n\nNow that we have our wallet agent with event sourcing capabilities\
    \ and MongoDB integration, let’s define the messages and events it will handle:\n\
    \n```csharp\npublic abstract record WalletMessage;\npublic record AddMoney(decimal\
    \ Amount) : WalletMessage;\npublic record RemoveMoney(decimal Amount) : WalletMessage;\n\
    public record GetBalance() : WalletMessage;\n\npublic abstract record WalletEvent;\n\
    public static class WalletEvent\n{\n public record Added(decimal Amount) : WalletEvent;\n\
    \ public record Removed(decimal Amount) : WalletEvent;\n}\n```\n"
