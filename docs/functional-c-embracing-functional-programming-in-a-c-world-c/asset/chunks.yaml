  trans: "\n\n```csharp\npublic record Removed(decimal Amount) : WalletEvent;\n```\n\
    \n### 函数式钱包 API：结合事件溯源和 MongoDB 开启曲速模式\n\n有了我们的钱包代理、事件溯源和 MongoDB，现在是时候使用 ASP.NET\
    \ Core 的最小化托管（minimal hosting）创建一个函数式钱包 API 了。这将允许我们以简洁且丰富的方式利用函数式编程、事件溯源和 MongoDB\
    \ 的力量。\n\n```csharp\nusing Microsoft.AspNetCore.Builder;\nusing Microsoft.AspNetCore.Http;\n\
    using Microsoft.Extensions.DependencyInjection;\n\nvar builder = WebApplication.CreateBuilder(args);\n\
    \nbuilder.Services.AddSingleton<WalletEventRepository>(new WalletEventRepository(\"\
    mongodb://localhost:27017\", \"wallet\", \"events\"));\n\nbuilder.Services.AddSingleton<WalletAgent>();\n\
    \nvar app = builder.Build();\n\napp.MapPost(\"/api/wallet/add\", async (WalletAgent\
    \ walletAgent, decimal amount) =>\n{\n    var newEvents = await walletAgent.AddMoney(amount);\n\
    \    return Results.Ok(newEvents);\n});\n\napp.MapPost(\"/api/wallet/remove\"\
    , async (WalletAgent walletAgent, decimal amount) =>\n{\n    var newEvents = await\
    \ walletAgent.RemoveMoney(amount);\n    return Results.Ok(newEvents);\n});\n\n\
    app.MapGet(\"/api/wallet/balance\", async (WalletAgent walletAgent) =>\n{\n  \
    \  var balance = await walletAgent.GetBalance();\n    return Results.Ok(balance);\n\
    });\n\napp.Run();\n```\n\n在这个示例中，我们把函数式编程技术与最小化托管、事件溯源和 MongoDB 结合，创建了一个现代且表达丰富的\
    \ Web 应用程序。通过使用事件溯源和函数式编程原则，我们的钱包 API 可以根据需要轻松地维护和扩展。\n\n### 勇直前行\n\n当我们结束这段科幻小说启发的函数式\
    \ Web 开发之旅时，请记住，函数式编程不仅仅是一套工具或技术，更是一种可以帮助我们编写更健壮、更易维护且优雅代码的心态。所以，开启你的曲速驱动，探索 C#\
    \ 中函数式编程的广阔宇宙，让星辰成为你这段激动旅程的指南吧。\n\n### 11.2. 使用函数式编程进行数据处理和分析\n\n在本节中，我们将探索如何将函数式编程技术应用于\
    \ C# 中的数据处理和分析任务。我们将使用 `Language-Ext` 和 MongoDB C# 驱动创建一个简单的数据处理流水线，以展示函数式编程在此背景下的优势。\n\
    \n在开始之前，请确保已安装了必要的 NuGet 包：\n\n```bash\nInstall-Package LanguageExt.Core\nInstall-Package\
    \ MongoDB.Driver\n```\n\n在这个示例中，我们将处理一个表示产品集合的简单数据模型：\n\n```csharp\npublic class\
    \ Product\n{\n    public ObjectId Id { get; set; }\n    public string Name { get;\
    \ set; }\n    public decimal Price { get; set; }\n    public string Category {\
    \ get; set; }\n}\n```\n\n假设我们有一个包含产品数据的 MongoDB 集合，并且想要执行以下任务：\n\n* 从数据库中检索所有产品。\n\
    * 按特定类别过滤产品。\n* 计算产品的平均价格。\n\n我们将首先建立与数据库的连接并获取产品数据：\n\n```csharp\nusing MongoDB.Bson;\n\
    using MongoDB.Driver;\n\nIMongoClient client = new MongoClient(\"mongodb://localhost:27017\"\
    );\nIMongoDatabase database = client.GetDatabase(\"test\");\nIMongoCollection<Product>\
    \ collection = database.GetCollection<Product>(\"products\");\n\nList<Product>\
    \ products = await collection.Find(_ => true).ToListAsync();\n```\n\n拿到数据后，我们现在可以使用\
    \ `Language-Ext` 创建我们的处理流水线：\n\n```csharp\nusing LanguageExt;\nusing static LanguageExt.Prelude;\n\
    \ndecimal AveragePrice(IEnumerable<Product> products)\n{\n    return products.Any()\
    \ ? products.Average(p => p.Price) : 0m;\n}\n\nOption<decimal> CalculateAverageByCategory(IEnumerable<Product>\
    \ products, string category)\n{\n    return products\n        .Where(p => p.Category\
    \ == category)\n        .ToOption()\n        .Map(AveragePrice);\n}\n\nvar averagePrice\
    \ = CalculateAverageByCategory(products, \"Electronics\")\n    .Match(\n     \
    \   price => $\"Average price: {price}\",\n        () => \"No products found\"\
    \n    );\n\nConsole.WriteLine(averagePrice);\n```\n\n在这个示例中，我们定义了 `CalculateAverageByCategory`，它接受一个\
    \ `IEnumerable<Product>` 和一个 `string`，返回一个 `Option<decimal>`。我们使用 `Option` 单单来处理没有产品的可能。\n\
    \n为了演示在数据处理中使用代理（agents），我们现在将引入代理来安全地处理共享可变状态。首先，安装必要的 NuGet 包：\n\n```bash\n\
    Install-Package Microsoft.AspNetCore.Diagnostics\n```\n\n现在，我们将创建一个并发接收请求的代理：\n\
    \n```csharp\nusing LanguageExt;\nusing static LanguageExt.Prelude;\n\nrecord AveragePriceRequest(string\
    \ Category, IObserver<decimal?> Response);\n\nAgent<AveragePriceRequest> CreateAveragePriceAgent(IEnumerable<Product>\
    \ products)\n{\n    return Agent.Start<AveragePriceRequest>(async request =>\n\
    \    {\n        var averagePrice = CalculateAverageByCategory(products, request.Category);\n\
    \        await request.Response.OnNextAsync(averagePrice.ToNullable());\n    });\n\
    }\n```\n\n现在，让我们创建一个暴露此此功能的最小化 API：\n\n```csharp\nusing Microsoft.AspNetCore.Builder;\n\
    using Microsoft.Extensions.DependencyInjection;\n\nvar builder = WebApplication.CreateBuilder(args);\n\
    var app = builder.Build();\n\napp.UseRouting();\n\nvar products = await FetchProductsAsync();\
    \ // 假设此函数从数据库获取产品\n\nvar averagePriceAgent = CreateAveragePriceAgent(products);\n\
    \napp.MapGet(\"/api/average-price/{category}\", async (string category, IObserver<decimal?>\
    \ response) =>\n{\n    var request = new AveragePriceRequest(category, response);\n\
    \    averagePriceAgent.Tell(request);\n    await Task.CompletedTask;\n});\n\n\
    app.UseEndpoints(endpoints => endpoints.MapControllers());\n\nawait app.RunAsync();\n\
    ```\n\n在这个示例中，我们创建了一个带有单个 GET 终点的最小化 API，它使用 `averagePriceAgent` 按类别计算平均价格。代理并发处理传入的请求，确保\
    \ API 即使在重负载下也能保持响应。\n\n在上一个示例中使用代理带来了许多益处，特别是在处理并发数据处理任务时。使用代理的一些主要优势包括：\n\n\
    * 共享可变状态的安全管理：代理封装了共享状态并允许安全的访问和修改。它们按顺序处理消息并提供对状态的排他访问，从而在不需要锁或复杂的并发机制的情况下消除了竞态条件和同步问题。\n\
    \n"
- fmt: '

    - Asynchronous processing: Agents run in the background and process incoming requests
    concurrently. This means that they can handle multiple requests simultaneously
    without blocking the main execution thread. As a result, the application remains
    responsive even when processing a large number of requests or performing computationally-intensive
    tasks.


    - Simplification of error handling and recovery: Agents provide a clean and consistent
    way to handle errors and recover from failures. By isolating the error handling
    logic within the agent, the application can continue to process incoming requests
    while ensuring that the state remains consistent and error-free.


    - Scalability and performance: Agents can help improve the overall performance
    and scalability of an application by processing requests concurrently and distributing
    the workload across multiple cores or processors. This allows the application
    to take full advantage of modern hardware and efficiently process large amounts
    of data.


    - Functional and declarative programming: Agents align well with the principles
    of functional and declarative programming. They encourage the use of immutable
    data structures and promote a clean separation between state management and computation.
    This leads to more maintainable, testable, and understandable code.


    By combining functional programming techniques, agents, and `Language-Ext`, we
    can create an efficient and safe data processing pipeline that is easily exposed
    via a minimal API. This demonstrates the power of functional programming patterns
    and their practical applications in real-world scenarios.


