    \ C# 函数式编程的快乐吧——别忘了在这个过程中增添乐趣！\n\n## 3.3 Lambda 表达式\n\nLambda 表达式是 C# 世界中神秘而神奇的生物，它们就像小小的忍者，溜入你的代码中，使其更具函数式且更有表现力。在这一章中，我们将揭开这些神秘战士的秘密，探索它们的起源、技巧，以及它们为函数式编程道场带来的强大武器库。\n\
    \n## Lambda 表达式：简史\n\n在深入研究 Lambda 表达式之前，让我们快速回溯过去，了解一下它们的根源。Lambda 表达式起源于 Lambda\
