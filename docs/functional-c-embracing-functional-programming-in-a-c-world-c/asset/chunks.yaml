  trans: "\n\n# 任务示例\n\n考虑一个向不同服务进行多次 API 用的应用程序，我们希望顺序处理这些结果。我们可以使用 `Task` 单元来实现这一目标。\n\
    \n```csharp\npublic async Task<string> FetchDataFromApi(string url)\n{\n    //\
    \ 使用 Task.Delay 模拟 API 调用\n    await Task.Delay(1000);\n    return $\"Data from\
    \ {url}\";\n}\n\npublic async Task<string> ProcessData(string data)\n{\n    //\
    \ 使用 Task.Delay 模拟数据处理\n    await Task.Delay(500);\n    return $\"Processed {data}\"\
    ;\n}\n\npublic async Task<string> FetchAndProcessDataAsync(string url)\n{\n  \
    \  return await FetchDataFromApi(url).Bind(ProcessData);\n}\n\npublic async Task\
    \ ExecuteExample()\n{\n    var urls = new List<string> { \"https://api1.example.com\"\
    , \"https://api2.example.com\" };\n    foreach (var url in urls)\n    {\n    \
    \    var result = await FetchAndProcessDataAsync(url);\n        Console.WriteLine(result);\n\
    \    }\n}\n\nawait ExecuteExample();\n```\n\n在这个示例中，我们使用 `Task<T>` 单元来链式异步调用并顺序处理结果。这使得代码更加整洁且易于管理，同时保留了操作的顺序性。\n\
    \n总之，理解并实现 `Functor`、`Applicative` 和 `Monad` 设计模式可以可以用函数式编程风格编写更简洁、可复用且易于维护的代码。通过结合\
    \ `Maybe<T>`、`IEnumerable<T>` 和 `Task<T>` 等不同的计算上下文利用这些模式，你可以创建出可组合且多功能的代码，以处理广泛的场景。\n\
    \n## 10.3 Task 单元的扩展方法\n\n在本节中，我们将通过一些额外的扩展方法来扩展 `Task` 单元，以处理重试和从错误中恢复。我们将实现的方法是\
    \ `OrElse`、`Recover`、`Bind` 和 `Map`。\n\n让我们从创建一个包含扩展方法的 `TaskExtensions` 类开始：\n\
    \n```csharp\npublic static class TaskExtensions\n{\n    public static async Task<TResult>\
    \ OrElse<TSource, TResult>(\n        this Task<TSource> task,\n        Func<Task<TResult>>\
    \ fallback)\n    where TSource : TResult\n    {\n        try\n        {\n    \
    \        return await task;\n        }\n        catch\n        {\n           \
    \ return await fallback();\n        }\n    }\n\n    public static async Task<T>\
    \ Recover<T>(\n        this Task<T> task,\n        Func<Exception, T> recoverFunc)\n\
    \    {\n        try\n        {\n            return await task;\n        }\n  \
    \      catch (Exception ex)\n        {\n            return recoverFunc(ex);\n\
    \        }\n    }\n\n    public static async Task<TResult> Bind<TSource, TResult>(\n\
    \        this Task<TSource> task,\n        Func<TSource, Task<TResult>> selector)\n\
    \    {\n        return await selector(await task);\n    }\n\n    public static\
    \ async Task<TResult> Map<TSource, TResult>(\n        this Task<TSource> task,\n\
    \        Func<TSource, Result> selector)\n    {\n        return selector(await\
    \ task);\n    }\n}\n```\n\n现在，让我们来解释每个方法：\n\n- `OrElse`:如果 `task` 失败，它将执行 `fallback`\
    \ 函数并返回一个新的 `task`。它适用于实现重试机制或在操作失败时提供备用结果。\n- `Recover`:如果 `task` 失败，它将执行 `recoverFunc`\
    \ 函数，该函数接收异常并返回一个默认值。它适用于从错误中恢复并在操作失败时提供默认值。\n- `Bind` 和 `Map`:这些方法在前面的章节中已经解释过，它们是\
    \ `Task` 单元的基础操作。\n\n现在，让我们创建一些示例来展示这些方法的用法。\n\n```csharp\npublic async Task<string>\
    \ FetchDataFromApiWithErrors(string url)\n{\n    // 模拟有时会抛出异常的 API 调用\n    if\
    \ (url.Contains(\"error\"))\n    {\n        throw new InvalidOperationException(\"\
    Error fetching.\");\n    }\n    await Task.Delay(1000);\n    return $\"Data from\
    \ {url}\";\n}\n\npublic async Task ExecuteExampleWithExtensions()\n{\n    var\
    \ urls = new List<string> {\n        \"https://api1.example.com\",\n        \"\
    https://api2.example.com/error\",\n        \"https://api3.example.com\"\n    };\n\
    \    foreach (var url in urls)\n    {\n        var dataTask = FetchDataFromApiWithErrors(url);\n\
    \        var recoveredDataTask = dataTask.Recover(ex => $\"Recovered data for\
    \ {url}\");\n        var processedDataTask = recoveredDataTask.Map(data => $\"\
    Processed {data}\");\n        var result = await processedDataTask;\n        Console.WriteLine(result);\n\
    \    }\n}\n\nawait ExecuteExampleWithExtensions();\n```\n\n在这个示例中，我们使用 `Recover`\
    \ 和 `Map` 方法来处理错误并处理来自 API 用的数据。利用为 `Task` 单元提供的扩展方法，产生了更健壮且简洁的代码。\n\n## 用例 1：股票数据\
    \ API\n\n假设我们有一个从 API 获取股票数据的应用程序。有两个 API 提供者，一个主和一个备用。如果主 API 失败，应用程序应该回退到备用\
    \ API。此外，如果两个 API 都失败了，我们应该返回一个默认股票值。\n\n首先，让我们创建一个 `Stock` 类和获取股票数据的函数：\n\n```csharp\n\
    public class Stock\n{\n    public string Symbol { get; set; }\n    public double\
    \ Price { get; set; }\n}\n\npublic async Task<Stock> FetchStockFromPrimaryApi(string\
    \ symbol)\n{\n    // 模拟可能失败的 API 调用\n    if (symbol == \"FAIL\")\n    {\n    \
    \    throw new InvalidOperationException(\"Primary API failed.\");\n    }\n  \
    \  await Task.Delay(1000);\n    return new Stock { Symbol = symbol, Price = 100.0\
    \ };\n}\n\npublic async Task<Stock> FetchStockFromSecondaryApi(string symbol)\n\
    {\n    // 模拟可能失败的 API 调用\n    if (symbol == \"FAIL\")\n    {\n        throw new\
    \ InvalidOperationException(\"Secondary API failed.\");\n    }\n    await Task.Delay(1000);\n\
    \    return new Stock { Symbol = symbol, Price = 200.0 };\n}\n\npublic Stock DefaultStock(string\
    \ symbol)\n{\n    return new Stock { Symbol = symbol, Price = 0.0 };\n}\n```\n\
    \n现在，让我们使用 `OrElse` 和 `Recover` 方法创建一个创建一个容错能力的获取股票数据的函数：\n\n```csharp\npublic\
    \ async Task<Stock> FetchStockDataAsync(string symbol)\n{\n    return await FetchStockFromPrimaryApi(symbol)\n\
    \        .OrElse(() => FetchStockFromSecondaryApi(symbol))\n        .Recover(ex\
    \ => DefaultStock(symbol));\n}\n\npublic async Task ExecuteStockData()\n{\n  \
    \  var symbols = new List<string> { \"AAPL\", \"MSFT\", \"FAIL\" };\n    foreach\
    \ (var symbol in symbols)\n    {\n        var stock = await FetchStockDataAsync(symbol);\n\
    \        Console.WriteLine($\"Symbol: {stock.Symbol}, Price: {stock.Price}\");\n\
    \    }\n}\n\nawait ExecuteStockData();\n```\n\n## 用例 2：地理编码与天气 API\n\n假设我们有一个应用程序通过地理编码\
    \ API 获取位置坐标（纬度和经度），然后使用天气 API 获取天气数据。应用程序应该处理可能的 API 失败并在必要提供默认数据。\n\n首先，让我们创建\
    \ `Location` 和 `Weather` 类以及从 API 获取数据的函数：\n\n```csharp\npublic class Location\n\
    {\n    public string Address { get; set; }\n    public double Latitude { get;\
    \ set; }\n    public double Longitude { get; set; }\n}\n\npublic class Weather\n\
    {\n    public string Description { get; set; }\n    public double Temperature\
    \ { get; set; }\n}\n\npublic async Task<Location> FetchLocationAsync(string address)\n\
    {\n    // 模拟可能失败的 API 调用\n    if (address == \"FAIL\")\n    {\n        throw new\
    \ InvalidOperationException(\"Geocoding API failed.\");\n    }\n    await Task.Delay(1000);\n\
    \    return new Location { Address = address, Latitude = 40.7128, Longitude =\
    \ -74.0060 };\n}\n\npublic async Task<Weather> FetchWeatherAsync(double latitude,\
    \ double longitude)\n{\n    // 模拟可能失败的 API 调用\n    if (latitude == 0.0 && longitude\
    \ == 0.0)\n    {\n        throw new InvalidOperationException(\"Weather API failed.\"\
    );\n    }\n}\n```\n\n"
- fmt: "\n```csharp\nawait Task.Delay(1000);\n\nreturn new Weather { Description =\
    \ \"Sunny\", Temperature = 25.0 };\n}\n\npublic Location DefaultLocation(string\
    \ address)\n{\n    return new Location { Address = address, Latitude = 0.0, Longitude\
    \ = 0.0 };\n}\n\npublic Weather DefaultWeather()\n{\n    return new Weather {\
    \ Description = \"Unknown\", Temperature = 0.0 };\n}\n```\n\nNow let’s use the\
    \ `Bind`, `Map`, `OrElse`, and `Recover` methods to create a fault-tolerant function\
    \ to fetch weather data for a given address:\n\n```csharp\npublic async Task<Weather>\
    \ FetchWeatherForAddressAsync(string address)\n{\n    return await FetchLocationAsync(address)\n\
    \        .Recover(ex => DefaultLocation(address))\n        .Bind(location => FetchWeatherAsync(location.Latitude,\
    \ location.Longitude))\n        .Recover(ex => DefaultWeather());\n}\n\npublic\
    \ async Task ExecuteWeatherExample()\n{\n    var addresses = new List<string>\
    \ { \"123 Main St\", \"456 Broadway\", \"FAIL\" };\n    foreach (var address in\
    \ addresses)\n    {\n        var weather = await FetchWeatherForAddressAsync(address);\n\
    \        Console.WriteLine($\"Address: {address}, Weather: {weather.Description},\
    \ Temperature: {weather.Temperature}\");\n    }\n}\n\nawait ExecuteWeatherExample();\n\
    ```\n\nIn these examples, we used the `Map`, `OrElse`, `Bind`, and `Recover` methods\
    \ to handle failures and provide fault tolerance in real-world scenarios involving\
    \ API calls. By combining these methods, we can create applications that gracefully\
    \ handle errors and provide fallback data when necessary.\n\nIn this section,\
    \ we explored the `Functor`, `Applicative`, and `Monad` design patterns and their\
    \ applications in functional programming with C#. We’ve implemented custom extension\
    \ methods for the `Task` monad, such as `Map`, `OrElse`, `Bind`, and `Recover`,\
    \ to improve error handling and resilience in real-world scenarios.\n\nWe demonstrated\
    \ the power of these patterns through various examples, including stock data fetching,\
    \ geocoding, and weather information retrieval. These examples showed how to handle\
    \ errors gracefully, provide fallback data, and maintain the readability and maintainability\
    \ of the code.\n\nBy understanding and implementing these functional design patterns\
    \ in your projects, you can build more robust, composable, and resilient applications\
    \ that can handle various computational contexts and scenarios.\n\nIn the next\
    \ chapters, we will continue our journey in functional programming with C#, covering\
    \ additional topics and concepts to further improve your programming skills and\
    \ understanding of functional programming principles.\n\n# Monoids and Semigroups\n\
    \nIn this section, we will explore `Monoids` and `Semigroups`, which are fundamental\
    \ algebraic structures in functional programming. These structures allow you to\
    \ model and compose operations in a simple and consistent manner. We will start\
    \ by introducing the concept of `Semigroups` and then move on to `Monoids`, providing\
    \ examples and explaining their practical applications in functional programming\
    \ with C#.\n\n## 10.4 Semigroups\n\nA `Semigroup` is an algebraic structure that\
    \ consists of a set of values and an associative binary operation. The binary\
    \ operation must satisfy the following rules:\n\n- **Closure**: The result of\
    \ the binary operation must be a member of the set.\n- **Associativity**: For\
    \ all elements `a`, `b`, and `c` in the set, `(a _ b) _ c = a _ (b _ c)`.\n\n\
    To better understand `Semigroups`, let’s implement a simple example in C#. We\
    \ will create a `Sum Semigroup` to represent the addition of integers:\n\n```csharp\n\
    public class SumSemigroup\n{\n    public int Value { get; }\n    public SumSemigroup(int\
    \ value)\n    {\n        Value = value;\n    }\n    public SumSemigroup Combine(SumSemigroup\
    \ other)\n    {\n        return new SumSemigroup(Value + other.Value);\n    }\n\
    }\n```\n\nThe `SumSemigroup` represents integers and has a `Combine` method that\
    \ adds two `SumSemigroup` instances together, producing a new `SumSemigroup`.\
    \ The `Combine` method is associative, which means it satisfies the requirements\
    \ of a `Semigroup`.\n\nLet’s create a simple example using the `SumSemigroup`:\n\
    \n```csharp\nvar a = new SumSemigroup(1);\nvar b = new SumSemigroup(2);\nvar c\
    \ = new SumSemigroup(3);\nvar result1 = a.Combine(b).Combine(c);  // (1 + 2) +\
    \ 3\nvar result2 = a.Combine(b.Combine(c));  // 1 + (2 + 3)\nConsole.WriteLine($\"\
    Result1: {result1.Value}, Result2: {result2.Value}\");  // Result1: 6, Result2:\
    \ 6\n```\n\nThe example demonstrates the associativity property of the `Combine`\
    \ method in the `SumSemigroup`.\n\n## 10.5 Monoids\n\nA `Monoid` is an extension\
    \ of a `Semigroup`, with the addition of an identity element. The identity element\
    \ is a value that, when combined with any other element using the binary operation,\
    \ results in the same element. In other words, for any element `a` in the set,\
    \ `a _ identity = identity _ a = a`.\n\nTo create a `Monoid` in C#, we can inherit\
    \ from `Semigroup` and add an identity element:\n\n```csharp\npublic class SumMonoid\
    \ : Semigroup\n{\n    public SumMonoid(int value) : base(value) { }\n    public\
    \ static SumMonoid Identity => new SumMonoid(0);\n}\n```\n\nIn this example, the\
    \ identity element is `0`, which means that when we combine any `SumMonoid` instance\
    \ with the identity, the result will be the original value.\n\n```csharp\nvar\
    \ a = new SumMonoid(1);\nvar identity = SumMonoid.Identity;\nvar result1 = a.Combine(identity);\n\
    var result2 = identity.Combine(a);\nConsole.WriteLine($\"Result1: {result1.Value},\
    \ Result2: {result2.Value}\");  // Result1: 1, Result2: 1\n```\n\n`Monoids` and\
    \ `Semigroups` provide a consistent and composable way to model operations, such\
    \ as string concatenation or list merging.\n\n## 10.6 Practical Applications\n\
    \nNow let’s look at some practical applications of `Monoids` in C#.\n\n## 10.7\
    \ String Concatenation Monoid\n\nA classic example of a `Monoid` is the concatenation\
    \ of strings. The binary operation is string concatenation, and the identity element\
    \ is the empty string `\"\"`.\n\n```csharp\npublic class StringMonoid\n{\n   \
    \ public string Value { get; }\n    public StringMonoid(string value)\n    {\n\
    \        Value = value;\n    }\n    public StringMonoid Combine(StringMonoid other)\n\
    \    {\n        return new StringMonoid(Value + other.Value);\n    }\n    public\
    \ static StringMonoid Identity => new StringMonoid(\"\");\n}\n```\n\nAnd here’s\
    \ a simple example of how to use the `StringMonoid`:\n\n```csharp\nvar a = new\
    \ StringMonoid(\"Hello, \");\nvar b = new StringMonoid(\"World\");\nvar identity\
    \ = StringMonoid.Identity;\nvar result = a.Combine(b).Combine(identity);\nConsole.WriteLine($\"\
    Result: {result.Value}\");  // Result: Hello, World\n```\n\n## 10.8 List Merging\
    \ Monoid\n\nAnother useful example of a `Monoid` is the merging of lists. The\
    \ binary operation is list concatenation, and the identity element is the empty\
    \ list.\n\n```csharp\npublic class ListMonoid<T>\n{\n    public List<T> Value\
    \ { get; }\n    public ListMonoid(List<T> value)\n    {\n        Value = value;\n\
    \    }\n    public ListMonoid<T> Combine(ListMonoid<T> other)\n    {\n       \
    \ var result = new List<T>(Value);\n        result.AddRange(other.Value);\n  \
    \      return new ListMonoid<T>(result);\n    }\n    public static ListMonoid<T>\
    \ Identity => new ListMonoid<T>(new List<T>());\n}\n```\n\nHere’s an example of\
    \ how to use the `ListMonoid` to merge integer lists:\n\n```csharp\nvar a = new\
    \ ListMonoid<int>(new List<int> { 1, 2, 3 });\nvar b = new ListMonoid<int>(new\
    \ List<int> { 4, 5, 6 });\nvar identity = ListMonoid<int>.Identity;\nvar result\
    \ = a.Combine(identity).Combine(b);\nConsole.WriteLine($\"Result: {string.Join(\"\
    , \", result.Value)}\");  // Result: 1, 2, 3, 4, 5, 6\n```\n"
