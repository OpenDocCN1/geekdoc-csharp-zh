    \n}\n\nApplicative An Applicative extends the Functor concept by allowing you\
    \ to apply a function wrapped in a computational context to a value inside the\
    \ same context. In C#, we can create an Applicative using the same Maybe type\
    \ as before and implement an Apply extension method:\n\npublic  static  class\
    \ MaybeExtensions\n\n{\n\n    // ...\n\npublic  static Maybe<TResult> Apply<TSource,\
    \ TResult>(\n\n        this Maybe<Func<TSource, TResult>> maybeFunc,\n\n        Maybe<TSource>\
    \ maybeValue)\n\n    {\n\n        return maybeFunc switch\n\n        {\n\n            Some<Func<TSource,\
    \ TResult>> someFunc =>\n\n                maybeValue.Map(value => someFunc.Value(value)),\n\
    \n_ => Maybe<TResult>.None(),\n\n        };\n\n    }\n\n}\n\nNow, let’s implement\
    \ the Apply operation for the IEnumerable type:\n\npublic  static  class EnumerableExtensions\n\
    \n{\n\n    // ...\n\npublic  static IEnumerable<TResult> Apply<TSource, TResult>(\n\
    \n        this IEnumerable<Func<TSource, TResult>> sourceFuncs,\n\n        IEnumerable<TSource>\
    \ sourceValues)\n\n    {\n\n        return from func in sourceFuncs\n\nfrom value\
    \ in sourceValues\n\nselect func(value);\n\n    }\n\n}\n\nAnd for the Task type:\n\
    \npublic  static async Task<TResult> Apply<TSource, TResult>(\n\n    this Task<Func<TSource,\
    \ TResult>> taskFunc,\n\n    Task<TSource> taskValue)\n\n{\n\n    var func = await\
    \ taskFunc;\n\n    var value = await taskValue;\n\n    return  func(value);\n\n\
    }\n\nMonad A Monad is a design pattern that generalizes the concept of chaining\
    \ operations together. Monads allow you to flatten nested computational contexts\
    \ and perform actions sequentially. A monad must provide a bind operation (also\
    \ known as flatMap or SelectMany in C#).\n\nLet’s implement the bind operation\
    \ for our Maybe type:\n\npublic  static  class MaybeExtensions\n\n{\n\n    //\
    \ ...\n\npublic  static Maybe<TResult> Bind<TSource, TResult>(\n\n        this\
    \ Maybe<TSource> maybe,\n\n        Func<TSource, Maybe<TResult>> selector)\n\n\
        {\n\n        return maybe switch\n\n        {\n\n            Some<TSource>\
    \ some =>  selector(some.Value),\n\n_ => Maybe<TResult>.None(),\n\n        };\n\
    \n    }\n\n}\n\nNow, let’s implement the bind operation for the IEnumerable type:\n\
    \npublic  static  class EnumerableExtensions\n\n{\n\n    // ...\n\npublic  static\
    \ IEnumerable<TResult> Bind<TSource, TResult>(\n\n        this IEnumerable<TSource>\
    \ source,\n\n        Func<TSource, IEnumerable<TResult>> selector)\n\n    {\n\n\
            return source.SelectMany(selector);\n\n    }\n\n}\n\nAnd for the Task\
    \ type:\n\npublic  static async Task<TResult> Bind<TSource, TResult>(\n\n    this\
    \ Task<TSource> task,\n\n    Func<TSource, Task<TResult>> selector)\n\n{\n\n    return\
    \ await selector(await task);\n\n}\n\nNow we have seen how to implement Functor,\
    \ Applicative, and Monad for three different computational contexts: Maybe, IEnumerable,\
    \ and Task. With these concepts, you can create more reusable and composable code\
    \ in a functional programming style.\n\n# Chapter 10: Usage and Examples\n\nNow\
    \ that we’ve implemented Functor, Applicative, and Monad for Maybe, IEnumerable,\
    \ and Task, let’s look at how we can use these patterns in real-life examples.\n\
    \n## 10.1 Maybe Example\n\nImagine we have a list of user IDs and a function to\
    \ find a user’s email by their ID. However, the function may return None if the\
    \ user is not found. We can use the Maybe monad to chain multiple operations.\n\
    \npublic  class User\n\n{\n\n public  int Id {  get;  set;  }\n\n public  string\
    \ Email {  get;  set;  }\n\n}\n\npublic Maybe<User>  FindUserById(int id)\n\n\
    {\n\n    // Find a user by ID (could be from a database, for example)\n\n    //\
    \ Here, we're simulating the lookup with a hardcoded list\n\n    var users = \
    \ new List<User>\n\n    {\n\n        new User { Id =  1, Email =  \"john@example.com\"\
    \  },\n\n        new User { Id =  2, Email =  \"jane@example.com\"  },\n\n    };\n\
    \nreturn users.FirstOrDefault(user => user.Id  == id).ToMaybe();\n\n}\n\npublic\
    \ Maybe<string>  GetUserEmail(int userId)\n\n{\n\n return  FindUserById(userId).Map(user\
    \ => user.Email);\n\n}\n\nvar userIds =  new List<int>  {  1,  2,  3,  4  };\n\
    \nvar emails = userIds.Map(GetUserEmail);\n\n## 10.2 IEnumerable Example\n\nSuppose\
    \ we have a list of customers and a list of orders, and we want to find all the\
    \ orders placed by a specific group of customers. We can use the IEnumerable monad\
    \ to achieve this.\n\npublic  class Customer\n\n{\n\n public  int Id {  get; \
    \ set;  }\n\n public  string Name {  get;  set;  }\n\n}\n\npublic  class Order\n\
    \n{\n\n public  int Id {  get;  set;  }\n\n public  int CustomerId {  get;  set;\
    \  }\n\n public  double Total {  get;  set;  }\n\n}\n\npublic IEnumerable<Order>\
    \  GetOrdersForCustomers(\n\n    IEnumerable<Customer> customers,\n\n    IEnumerable<Order>\
    \ orders)\n\n{\n\n    return customers.Bind(customer =>\n\n        orders.Where(order\
    \ => order.CustomerId  == customer.Id));\n\n}\n\nvar customers =  new List<Customer>\n\
    \n{\n\n new Customer { Id =  1, Name =  \"John\"  },\n\n new Customer { Id = \
    \ 2, Name =  \"Jane\"  },\n\n};\n\nvar orders =  new List<Order>\n\n{\n\n new\
    \ Order { Id =  101, CustomerId =  1, Total =  100.0  },\n\n new Order { Id =\
    \  102, CustomerId =  1, Total =  200.0  },\n\n new Order { Id =  103, CustomerId\
    \ =  2, Total =  300.0  },\n\n new Order { Id =  104, CustomerId =  3, Total =\
    \  400.0  },\n\n};\n\nvar customerOrders =  GetOrdersForCustomers(customers, orders);"
