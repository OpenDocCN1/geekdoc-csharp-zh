    \ totals: 1, 3, 6, 10, 15\"\n\nIn this section, we briefly introduced several\
    \ functional programming libraries for C# that complement and extend the core\
    \ language features. By exploring and incorporating these libraries into your\
    \ projects, you can further enhance your functional programming skills and take\
    \ full advantage of the functional programming paradigm in C#.\n\n# Chapter 12:\
    \ Real-World Applications and Case Studies\n\n## 12.1 Functional Programming in\
    \ Web Development: A Sci-Fi-Inspired Adventure\n\nIn a galaxy not so far away,\
    \ a group of functional programming pioneers embarked on a mission to boldly go\
    \ where no developer has gone before. They sought to combine functional programming\
    \ and event sourcing to create web applications that were more elegant, maintainable,\
    \ and scalable. With C# as their programming language of choice, they set out\
    \ to demonstrate the power of functional programming and event sourcing in modern\
    \ web development.\n\n### Language-Ext: The Warp Drive of Functional Programming\n\
    \nIn the C# universe, Language-Ext is a powerful library that brings the best\
    \ of functional programming to the world of .NET. By utilizing advanced features\
    \ like immutable data structures, monads, and agents, developers can create expressive\
    \ and safe web applications. For this journey, we’ll create a wallet API that\
    \ allows users to add and remove galactic credits from their wallet using a functional\
    \ approach, agents to avoid concurrency issues, and event sourcing for tracking\
    \ changes.\n\n### Event Sourcing: The Temporal Prime Directive\n\nEvent sourcing\
    \ is an architectural pattern that represents the state of an application as a\
    \ sequence of events. Instead of updating the state directly, changes are recorded\
    \ as events, allowing the state to be recreated by replaying these events. This\
    \ approach provides many benefits, such as improved scalability, simplified debugging,\
    \ and a built-in audit trail. By integrating event sourcing into our wallet API,\
    \ we’ll uphold the Temporal Prime Directive and ensure a proper history of our\
    \ wallet balance changes.\n\n### MongoDB: The Intergalactic Database\n\nTo store\
    \ our events, we’ll use MongoDB, a popular and flexible NoSQL database. This will\
    \ allow us to persist our events and recreate the state of our wallet whenever\
    \ needed. First, let’s set up the MongoDB connection and create a collection to\
    \ store our wallet events.\n\nInstall the MongoDB driver for C# by adding the\
    \ following package:\n\ndotnet add package MongoDB.Driver\n\nNow, let’s set up\
    \ our MongoDB connection and create a WalletEventRepository to handle saving and\
    \ loading events.\n\nusing MongoDB.Driver;\n\npublic  class WalletEventRepository\n\
    \n{\n\n    private  readonly IMongoCollection<WalletEvent> _walletEvents;\n\n\
    public  WalletEventRepository(string connectionString,  string databaseName, \
    \ string collectionName)\n\n    {\n\n        var client =  new  MongoClient(connectionString);\n\
    \n        var database = client.GetDatabase(databaseName);\n\n_walletEvents =\
    \ database.GetCollection<WalletEvent>(collectionName);\n\n    }\n\npublic async\
    \ Task SaveEventAsync(WalletEvent walletEvent)  =>\n\n        await _walletEvents.InsertOneAsync(walletEvent);\n\
    \npublic async Task<List<WalletEvent>>  GetAllEventsAsync()  =>\n\n        await\
    \ _walletEvents.Find(_ =>  true).ToListAsync();\n\n}\n\n### The Wallet Agent:\
    \ A Trusty Tricorder with Event Sourcing\n\nFirst, let’s create our wallet agent\
    \ using the Actor class from Language-Ext. The agent will handle concurrency issues\
    \ and ensure that only one operation is executed at a time. We’ll also integrate\
    \ event sourcing into the wallet agent to track changes to the wallet balance\
    \ and use our WalletEventRepository to store the events in MongoDB.\n\nusing LanguageExt;\n\
    \nusing  static LanguageExt.Prelude;\n\nusing System.Collections.Immutable;\n\n\
    public  class WalletAgent\n\n{\n\n    private  readonly Actor<ImmutableList<WalletEvent>>\
    \ agent;\n\n    private  readonly WalletEventRepository eventRepository;\n\npublic\
    \  WalletAgent(WalletEventRepository eventRepository)\n\n    {\n\n        this.eventRepository\
    \  = eventRepository;\n\nagent = Actor<ImmutableList<WalletEvent>>.Create(async\
    \  (events, msg)  => msg switch\n\n        {\n\nAddMoney addMoney =>\n\n            {\n\
    \n                var newEvent =  new WalletEvent.Added(addMoneyAmount);\n\n                await\
    \ eventRepository.SaveEventAsync(newEvent);\n\n                return events.Add(newEvent);\n\
    \n            },\n\nRemoveMoney removeMoney =>\n\n            {\n\n            var\
    \ newEvent =  new WalletEvent.Removed(removeMoney.Amount);\n\n            await\
    \ eventRepository.SaveEventAsync(newEvent);\n\n            return events.Add(newEvent);\n\
    \n            },\n\n_ => events\n\n        }, ImmutableList<WalletEvent>.Empty);\n\
    \n    }\n\n    public async Task<ImmutableList<WalletEvent>>  AddMoney(decimal\
    \ amount)  =>\n\n        await agent.Ask<ImmutableList<WalletEvent>>(new  AddMoney(amount));\n\
    \npublic async Task<ImmutableList<WalletEvent>>  RemoveMoney(decimal amount) \
    \ =>\n\n        await agent.Ask<ImmutableList<WalletEvent>>(new  RemoveMoney(amount));\n\
    \npublic async Task<decimal>  GetBalance()\n\n    {\n\n        var events = await\
    \ eventRepository.GetAllEventsAsync();\n\n        return events.Aggregate(0m,\
    \  (balance, evt)  => evt switch\n\n        {\n\n            WalletEvent.Added\
    \ added => balance + added.Amount,\n\n            WalletEvent.Removed removed\
    \ => balance - removed.Amount,\n\n_ => balance\n\n        });\n\n    }\n\n}\n\n\
    Now that we have our wallet agent with event sourcing capabilities and MongoDB\
    \ integration, let’s define the messages and events it will handle:\n\npublic\
    \  abstract record WalletMessage;\n\npublic record AddMoney(decimal Amount)  :\
    \ WalletMessage;\n\npublic record RemoveMoney(decimal Amount)  : WalletMessage;\n\
    \npublic record GetBalance()  : WalletMessage;\n\npublic  abstract record WalletEvent;\n\
    \npublic  static  class WalletEvent\n\n{\n\n public record Added(decimal Amount)\
    \  : WalletEvent;"
