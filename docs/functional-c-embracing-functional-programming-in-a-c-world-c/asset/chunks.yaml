  trans: "\n\n```csharp\nvar closure = new ClosureClass { x = x };\n\nreturn closure.Adder;\n\
    ```\n\n有了了这些幕后的知识，我们就能真正欣赏 C# 中闭包的力量与优雅。\n\n### 日常代码中的闭包\n\n闭包可以在我们的 C# 代码中许多地方找到。让我们探索一些闭包大派用用场并让我们的代码更具功能性和表达力的场景。\n\
    \n#### 回调函数和事件处理器\n\n在处理回调函数和事件处理器时，闭包特别有用，因为它们允许我们在多次调用之间捕获并维护状态：\n\n```csharp\n\
    public void RegisterCallback(Action callback)\n{\n    // ...\n}\n\nint counter\
    \ = 0;\n\nRegisterCallback(() => Console.WriteLine($\"Callback invoked {++counter}\
    \ times\"));\n```\n\n在这个示例中，闭包捕获了 `counter` 变量，使其能够在回调函数的多次调用中保持其状态。\n\n#### 懒性初始化\n\
    \n闭包可以帮助我们以简洁且高效的方式实现懒性初始化：\n\n```csharp\nprivate int? _cachedValue;\n\npublic\
    \ int ExpensiveComputation()\n{\n    if (_cachedValue == null)\n    {\n      \
    \  _cachedValue = // Perform expensive computation\n    }\n    return _cachedValue.Value;\n\
    }\n\npublic Func<int> LazyComputation = () =>\n{\n    if (_cachedValue == null)\n\
    \    {\n        _cachedValue = // Perform expensive computation\n    }\n    return\
    \ _cachedValue.Value;\n};\n```\n\n通过闭包，我们可以创建一个 `LazyComputation` 函数，自动处理昂贵计算结果的缓存。\n\
    \n### 盛大的告别：向函数式数据结构和模式进\n\n当我们离开闭包的温暖怀抱时，我们可以欣赏它们为我们的 C# 代码带来的美感和功能。这些魔法构造体允许我们优雅地捕获和维护状态，在此过程中使我们的代码更具表达力和功能性。\n\
    \n现在我们已经熟悉了闭包，是时候开启我们的下一次冒险了：在第 4 章中探索函数式数据结构和模式的世界。在那里，我们将深入研究不可变性、持久化数据结构和函数式设计模式，这些领域将进一步增强我们对\
    \ C# 函数式编程的掌握。\n\n所以，拿起你最喜欢的茶，把自己包裹在函数式知识的舒适毯子里，准备好迎接即将到来的精彩旅程。闭包教会了我们拥抱捕获状态的力量，现在是时候用函数式数据结构和模式攻克新挑战了。前进吧，勇敢的编码员！\n\
    \n# 第 4 章：函数式数据结构和模式\n\n## 4.1. 元组与记录：数据的黄金组合\n\n在函数式编程这个充满活力的世界里，有两个英雄脱颖而出：元组（Tuples）和记录（Records）。这些超强数据结构帮助我们创建不可变的、具表达力且功能式的代码，这些代码不仅视觉上悦目，而且处理起来是一种享受。让我们与这对黄金组合并肩作战，学习它们如何帮助我们化险为夷！\n\
    \n### 元组：小巧而强大\n\n元组就像那些体积虽小却能带来浓郁口感的小糖果。它们是小小的、不可变的数值集合（错误，应为不可变的值集合），非常适合需要将几条相关数据分组在一起时。不需要花哨的类或结构，只需取一个\
    \ `Tuple` 即可搞定！\n\n这里有一个简单的示例入门：\n\n```csharp\nvar person = Tuple.Create(\"Ada\"\
    , \"Lovelace\", 36);\n\nConsole.WriteLine($\"{person.Item1} {person.Item2} is\
    \ {person.Item3} years old.\");\n```\n\n在这个示例中，我们创建了一个元组来存储一个人的名、姓和年龄。这是一种快速易用封装相关数据的方法，而无需定义自定义类的开销。\n\
    \n等一下，还有更多！C# 7 引入了一种新的、更简洁的元组语法，称为 `ValueTuple`：\n\n```csharp\nvar person = (\"\
    Ada\", \"Lovelace\", 36);\n\nConsole.WriteLine($\"{person.Item1} {person.Item2}\
    \ is {person.Item3} years old.\");\n```\n\n为了更具可读性，我们可以为元组元素赋予自定义名称：\n\n```csharp\n\
    var person = (FirstName: \"Ada\", LastName: \"Lovelace\", Age: 36);\n\nConsole.WriteLine($\"\
    {person.FirstName} {person.LastName} is {person.Age} years old.\");\n```\n\n###\
    \ 记录：不可变性的梦幻\n\n虽然元组非常适合小规模数据集合，但有时我们需要更有劲的东西。记录（Records）登场了——C# 中不可变数据结构的典范。这些厉害的家伙提供了类的所有功能，但又增加了不可变性和基于值的相等性的额外优点。\n\
    \n记录在 C# 9 中引入，使得能够以极少的模板代码轻松定义不可变数据结构：\n\n```csharp\npublic record Person(string\
    \ FirstName, string LastName, int Age);\n```\n\n就这样，我们创建了一个具有名、姓、年龄属性的记录。得益于记录的魔法，我们免费获得了不可变性、基于值的相等性以及一系列其他函数式良好特性：\n\
    \n```csharp\nvar ada = new Person(\"Ada\", \"Lovelace\", 36);\n\nvar clone = ada\
    \ with { Age = 37 };\n\nConsole.WriteLine(ada == clone); // False, 因为它们的年龄不同\n\
    ```\n\n在这个示例中，我们为 Ada Lovelace 创建了一个 `Person` 记录，然后使用 `with` 关键字创建一个新记录，它是原始记录的克隆，但更新了年龄。请注意，原始记录保持不变。\n\
    \n## 元组与记录：并肩无敌\n\n元组和记录在函数式宇宙中是一支强大的团队。它们为我们提供了灵活的数据结构，使我们的代码更具表达力。\n\n## 4.2\
    \ 模式匹配：代码侦探游戏\n\n想象你是一个代码侦探，正在寻找线索并拼凑信息以解开复杂逻辑之谜。模式匹配（Pattern matching）登场了——函数式编程中的福尔摩·摩斯。通过模式匹配，你可以用简洁优雅的方式表达复杂条件，让你的代码更易读。\n\
    \n### 基础，亲爱的编码员：基础模式匹配\n\nC# 7 引入了 switch 表达式（switch expression），它允许我们以更简洁、更具功能的方式执行模式匹配。告别笨拙的旧\
    \ `switch` 语句，迎接新的 switch 表达式。这里有一个简单的示例入门：\n\n```csharp\npublic string GetDayOfWeek(int\
    \ day)\n{\n    return day switch\n    {\n        1 => \"Monday\",\n        2 =>\
    \ \"Tuesday\",\n        3 => \"Wednesday\",\n        4 => \"Thursday\",\n    \
    \    5 => \"Friday\",\n        6 => \"Saturday\",\n        7 => \"Sunday\",\n\
    \        _ => throw new ArgumentOutOfRangeException(nameof(day))\n    };\n}\n\
    ```\n\n在这个示例中，我们使用 switch 表达式将整数值映射到星期几。注意每个用例都表示为简单的类 lambda 语法，使代码既简洁又易读。\n\n"
- fmt: "\n# The Game is Afoot: Advanced Pattern Matching\n\nPattern matching gets\
    \ even more powerful when combined with other C# features like tuples, records,\
    \ and nullable types. Let’s explore some advanced pattern matching techniques\
    \ that will help us solve even the trickiest of code mysteries.\n\n## Tuple Patterns\n\
    Tuple patterns allow us to match on multiple values at once, making it easy to\
    \ express complex conditions. Here’s an example that demonstrates how to classify\
    \ a pair of numbers as greater, lesser, or equal:\n\n```csharp\npublic string\
    \ CompareNumbers(int a, int b)\n{\n    return (a, b) switch\n    {\n        (var\
    \ x, var y) when x > y => \"Greater\",\n        (var x, var y) when x < y => \"\
    Lesser\",\n        (_, _) => \"Equal\"\n    };\n}\n```\n\nIn this example, we\
    \ create a tuple with the two numbers and use pattern matching to compare them.\
    \ The `when` keyword lets us add additional conditions to our cases, giving us\
    \ fine-grained control over the matching process.\n\n## Record Patterns\nPattern\
    \ matching with records allows us to match on the shape and properties of objects.\
    \ Here’s an example that demonstrates how to classify geometric shapes using record\
    \ patterns:\n\n```csharp\npublic record Shape;\npublic record Circle(double Radius)\
    \ : Shape;\npublic record Rectangle(double Width, double Height) : Shape;\n\n\
    public string DescribeShape(Shape shape)\n{\n    return shape switch\n    {\n\
    \        Circle { Radius: 0 } => \"A point\",\n        Circle c => $\"A circle\
    \ with radius {c.Radius}\",\n        Rectangle r => $\"A rectangle with width\
    \ {r.Width} and height {r.Height}\",\n        _ => throw new NotSupportedException(\"\
    Unknown shape\")\n    };\n}\n```\n\nIn this example, we use record patterns to\
    \ match on the type and properties of different shapes. The code is both concise\
    \ and expressive, allowing us to quickly understand the different cases being\
    \ handled.\n\n## The Adventure Continues: Embracing the Power of Pattern Matching\n\
    As we close the case on pattern matching, we can appreciate the elegance and expressiveness\
    \ it brings to our C# code. By combining the power of pattern matching with other\
    \ functional programming features like tuples, records, and nullable types, we\
    \ can write code that’s easy to read, maintain, and reason about.\n\nNow that\
    \ you’ve honed your pattern matching skills, you’re ready to tackle more complex\
    \ and challenging code mysteries. Embrace the power of pattern matching in your\
    \ projects and watch as your code becomes cleaner, more expressive, and more maintainable.\n\
    \nAs we continue to explore the world of functional C#, we’ll discover even more\
    \ powerful techniques and patterns to level up our programming skills. From immutability\
    \ and persistent data structures to higher-order functions and beyond, there’s\
    \ a treasure trove of functional knowledge waiting to be unlocked.\n\nSo, keep\
    \ your magnifying glass handy, your wit sharp, and your curiosity piqued as we\
    \ delve deeper into the fascinating realm of functional programming in C#. With\
    \ pattern matching as one of your many tools, you’ll be well-equipped to solve\
    \ the most perplexing code conundrums and emerge as a true functional programming\
    \ detective. Happy sleuthing, dear coder!\n\n## 4.3 Discriminated Unions: The\
    \ Swiss Army Knife of Data Types\nIn the realm of functional programming, there’s\
    \ one data type that truly stands out from the crowd – the discriminated union.\
    \ It’s like a Swiss Army knife, versatile and powerful, ready to tackle any problem\
    \ you throw at it. Discriminated unions allow us to represent a choice between\
    \ several different, yet related data types, making them perfect for modeling\
    \ complex, hierarchical data structures. So, let’s dive in and see how these nifty\
    \ data types can enhance our functional C# skills!\n\n### What’s in a Name: Introducing\
    \ Discriminated Unions\nDiscriminated unions are a way to represent a value that\
    \ can be one of several different types, each with its own set of properties.\
    \ They’re a powerful way to model complex data and are commonly found in functional\
    \ programming languages like Haskell, F#, and others. While C# doesn’t have a\
    \ built-in discriminated union type, we can emulate them using some clever tricks\
    \ and record types.\n\n### A Menagerie of Types: Modeling Animals\nTo demonstrate\
    \ the power of discriminated unions, let’s create a small menagerie of animals,\
    \ each with its own unique set of properties:\n\n```csharp\npublic abstract record\
    \ Animal;\npublic record Mammal(int Legs, bool HasTail) : Animal;\npublic record\
    \ Bird(bool CanFly, string Color) : Animal;\npublic record Fish(int Fins, bool\
    \ HasScales) : Animal;\n```\n\nIn this example, we’ve defined an abstract `Animal`\
    \ record and three derived records for different types of animals. Each derived\
    \ record has its own set of properties specific to its type. This hierarchy of\
    \ types emulates a discriminated union, allowing us to represent a value that\
    \ can be one of several different animal types.\n\n### The Lion, the Finch, and\
    \ the Goldfish: Pattern Matching with Discriminated Unions\nNow that we’ve got\
    \ our animal kingdom set up, let’s see how discriminated unions and pattern matching\
    \ can work together in perfect harmony. Here’s an example of a function that classifies\
    \ animals based on their properties:\n\n```csharp\npublic string ClassifyAnimal(Animal\
    \ animal)\n{\n    return animal switch\n    {\n        Mammal { Legs: 4, HasTail:\
    \ true } => \"Quadruped mammal with a tail\",\n        Bird { CanFly: true, Color:\
    \ var color } => $\"{color} bird\",\n        Fish { HasScales: true } => $\"fish\
    \ with {Fins} scales\",\n        _ => \"An interesting creature!\"\n    };\n}\n\
    ```\n\nIn this example, we use pattern matching to classify animals. The concise\
    \ syntax allows us to understand the various cases, showcasing the power of discriminated\
    \ unions.\n\n### Samples Galore: More Discriminated Union Good\nThe possibilities\
    \ with discriminated unions are endless! You can model anything from expressions\
    \ in a programming language to the states of a game.\n\n```csharp\npublic abstract\
    \ record Expr;\npublic record Constant(int Value) : Expr;\npublic record Add(Expr\
    \ Left, Expr Right) : Expr;\npublic record Subtract(Expr Left, Expr Right) : Expr;\n\
    public record Multiply(Expr Left, Expr Right) : Expr;\npublic record Divide(Expr\
    \ Left, Expr Right) : Expr;\n\npublic abstract record CharacterState;\npublic\
    \ record Idle : CharacterState;\npublic record Running : CharacterState;\npublic\
    \ record Jumping(double Height) : CharacterState;\npublic record Attacking(int\
    \ Damage) : CharacterState;\n\npublic void HandleCharacterState(CharacterState\
    \ state)\n{\n    switch (state)\n    {\n        case Idle:\n            Console.WriteLine(\"\
    Character is idle\");\n            break;\n        case Running:\n           \
    \ Console.WriteLine(\"Character is running\");\n            break;\n        case\
    \ Jumping(var height):\n            Console.WriteLine($\"Character is jumping\
    \ with a height of {height}\");\n            break;\n        case Attacking(var\
    \ damage):\n            Console.WriteLine($\"Character is attacking with a damage\
    \ of {damage}\");\n            break;\n        default:\n            Console.WriteLine(\"\
    Unknown character state\");\n            break;\n    }\n}\n```\n\nIn this example,\
    \ we use pattern matching to handle different character states and perform appropriate\
    \ actions. Discriminated unions and pattern matching together make it easy to\
    \ express complex behavior in a concise and readable manner.\n"
