    \n## 7.2. The Result and Either Types\n\nAs an alternative to exceptions, functional\
    \ programming languages often use specialized types to represent errors, like\
    \ `Result` and `Either`. These types can be used in C# to provide a more functional\
    \ way of handling errors.\n\nThe `Either` type is a more general version of `Result`.\
    \ It can represent one of two possible types, often used to represent a successful\
    \ result or an error. In this section, we will use the `Language-Ext` library\
    \ to demonstrate how to handle errors using the `Either` type. We will discuss\
    \ the `Language-Ext` library in more detail in Chapter 10.\n\nTo install `Language-Ext`,\
    \ add the NuGet package to your project:\n\n```\nInstall-Package LanguageExt.Core\n\
    ```\n\nLet’s assume we have a `Loan Application` scenario where we need to fetch\
    \ the applicant’s data from a `MongoDB` database. Using `Language-Ext`’s `Either`\
    \ type, we can define a function that returns either a successful result (the\
    \ applicant’s data) or an error.\n\nFirst, let’s define an `Applicant` class:\n\
    \n```csharp\npublic class Applicant\n{\n    public ObjectId Id { get; set; }\n\
    \    public string FullName { get; set; }\n    public string Email { get; set;\
    \ }\n    public decimal LoanAmount { get; set; }\n}\n```\n\nNext, we will define\
    \ an `Error` class:\n\n```csharp\npublic class Error\n{\n    public string Message\
    \ { get; set; }\n}\n```\n\nNow, let’s create a function that fetches the applicant’s\
    \ data from the `MongoDB` database. If an exception occurs, it will return an\
    \ `Error` object. Otherwise, it will return the `Applicant` object.\n\n```csharp\n\
    using LanguageExt;\nusing MongoDB.Driver;\n\npublic async Task<Either<Error, Applicant>>\
    \ GetApplicantAsync(ObjectId id)\n{\n    try\n    {\n        var client = new\
    \ MongoClient(\"mongodb://localhost:27017\");\n        var database = client.GetDatabase(\"\
    LoanApp\");\n        var collection = database.GetCollection<Applicant>(\"Applicants\"\
    );\n        var applicant = await collection.Find(app => app.Id == id).FirstOrDefaultAsync();\n\
    \        return applicant;\n    }\n    catch (Exception ex)\n    {\n        return\
    \ new Error { Message = ex.Message };\n    }\n}\n```\n\nWith the `GetApplicantAsync`\
    \ function, we can now create a Minimal API endpoint that fetches the applicant’s\
    \ data and handles errors using the `Either` type:\n\n```csharp\nusing Microsoft.AspNetCore.Builder;\n\
    using Microsoft.Extensions.DependencyInjection;\nusing LanguageExt;\n\nvar builder\
    \ = WebApplication.CreateBuilder(args);\nbuilder.Services.AddControllers();\n\
    var app = builder.Build();\n\napp.MapGet(\"/applicants/{id}\", async (string id)\
    \ =>\n{\n    ObjectId objectId = ObjectId.Parse(id);\n    var result = await GetApplicantAsync(objectId);\n\
    \    return result.Match<IActionResult>(\n        Right: applicant => Results.Ok(applicant),\n\
    \        Left: error => Results.BadRequest(new { error = error.Message }));\n\
    });\n\napp.Run();\n```\n\nIn the above example, we use the `Either` type to handle\
    \ errors in a functional way. Instead of throwing and catching exceptions, we\
    \ return either a successful result or an error. This approach makes our code\
    \ easier to reason about and allows us to handle errors in a more functional manner.\n\
    \nIn addition to the `Either` type, there’s another common type used to represent\
    \ errors in a functional way: the `Result` type. The `Result` type is similar\
    \ to the `Either` type but is more specialized. It represents either a successful\
    \ result or a failure. Let’s see how we can refactor our previous example using\
    \ the `Result` type from `Language-Ext`.\n\nFirst, let’s create a function that\
    \ fetches the applicant’s data from the `MongoDB` database. If an exception occurs,\
    \ it will return an `Error` object wrapped in a `Result`. Otherwise, it will return\
    \ the `Applicant` object wrapped in a `Result`.\n\n```csharp\nusing LanguageExt;\n\
    using MongoDB.Driver;\n\npublic async Task<Result<Applicant, Error>> GetApplicantAsync(ObjectId\
    \ id)\n{\n    try\n    {\n        var client = new MongoClient(\"mongodb://localhost:27017\"\
    );\n        var database = client.GetDatabase(\"LoanApp\");\n        var collection\
    \ = database.GetCollection<Applicant>(\"Applicants\");\n        var applicant\
    \ = await collection.Find(app => app.Id == id).FirstOrDefaultAsync();\n      \
    \  return Result<Applicant, Error>.Success(applicant);\n    }\n    catch (Exception\
    \ ex)\n    {\n        return Result<Applicant, Error>.Failure(new Error { Message\
    \ = ex.Message });\n    }\n}\n```\n\nWith the `GetApplicantAsync` function, we\
    \ can now create a Minimal API endpoint that fetches the applicant’s data and\
    \ handles errors using the `Result` type:\n\n```csharp\nusing Microsoft.AspNetCore.Builder;\n\
    using Microsoft.Extensions.DependencyInjection;\nusing LanguageExt;\n\nvar builder\
    \ = WebApplication.CreateBuilder(args);\nbuilder.Services.AddControllers();\n\
    var app = builder.Build();\n\napp.MapGet(\"/applicants/{id}\", async (string id)\
    \ =>\n{\n    ObjectId objectId = ObjectId.Parse(id);\n    var result = await GetApplicantAsync(objectId);\n\
    \    return result.Match<IActionResult>(\n        Right: applicant => Results.Ok(applicant),\n\
    \        Left: error => Results.BadRequest(new { error = error.Message })); //\
    \ Note: Match logic might vary based on Result implementation\n});\n\napp.Run();\n\
    ```\n\nIn this example, we use the `Result` type to handle errors in a functional\
    \ way. It is similar to the `Either` type but specifically tailored for success\
    \ or failure.\n\n## 7.3. Railway-Oriented Programming\n\nRailway-oriented programming\
    \ (ROP) is a functional programming pattern that enables you to compose functions\
    \ in a way that makes error handling more manageable and explicit. The concept\
    \ is based on the idea of having two “tracks” or “rails” that your code can travel\
    \ on, one for the success case and the other for the failure case. In ROP, functions\
    \ are designed to return a `Result` or `Either` type, representing success or\
    \ failure.\n\nLet’s consider an example of a loan application at a bank. We will\
    \ implement this process using railway-oriented principles.\n\nFirst, let’s define\
    \ our `LoanApplication` class:\n\n```csharp\npublic class LoanApplication\n{\n\
    \    public Applicant Applicant { get; set; }\n    public decimal LoanAmount {\
    \ get; set; }\n    public int LoanTermInMonths { get; set; }\n}\n```\n\nNext,\
    \ we will create a few functions that represent the steps in the loan application.\
    \ Each function will return a `Result` type, indicating success or failure:\n\n\
    *   `CheckCreditScore`: This function checks the applicant’s credit score and\
    \ returns a `Result` that indicates whether the credit score is within the acceptable\
    \ range.\n*   `EvaluateDebtToIncomeRatio`: This function evaluates the applicant’s\
    \ debt-to-income ratio and returns a `Result` that indicates whether the ratio\
    \ is within the acceptable range.\n*   `ApproveLoan`: This function approves the\
    \ loan based on the applicant’s credit score and debt-to-income ratio.\n\nLet’s\
    \ implement these functions:\n\n```csharp\npublic Result<int, Error> CheckCreditScore(Applicant\
    \ applicant)\n{\n    // Simulate checking the credit score (e.g., by calling a\
    \ credit bureau API)\n    int creditScore = new Random().Next(300, 850);\n   \
    \ if (creditScore < 620)\n    {\n        return Result<int, Error>.Failure(new\
    \ Error { Message = \"Credit score too low.\" });\n    }\n    return Result<int,\
    \ Error>.Success(creditScore);\n}\n\npublic Result<decimal, Error> EvaluateDebtToIncomeRatio(Applicant\
    \ applicant)\n{\n    // Simulate calculating the debt-to-income ratio\n    decimal\
    \ debtToIncomeRatio = new Random().Next(1, 100) / 100m;\n    if (debtToIncomeRatio\
    \ > 0.43m)\n    {\n        return Result<decimal, Error>.Failure(new Error { Message\
    \ = \"Debt-to-income ratio too high.\" });\n    }\n    return Result<decimal,\
    \ Error>.Success(debtToIncomeRatio);\n}\n\npublic Result<LoanApplication, Error>\
    \ ApproveLoan(Applicant applicant, decimal loanAmount, int loanTermInMonths)\n\
    {\n    // Implementation logic here\n}\n```\n"
