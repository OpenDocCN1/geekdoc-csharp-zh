    public Func<T1, TResult> Compose<T1, T2, TResult>(Func<T1, T2> f, Func<T2, TResult>\
    \ g)\n{\n    return x => g(f(x));\n}\n```\n\n```csharp\nvar numbers = new List<int>\
    \ { 1, 2, 3, 4, 5 };\nvar sumOfSquares = Compose(\n    (IEnumerable<int> xs) =>\
