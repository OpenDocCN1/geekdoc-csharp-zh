  trans: "\n考虑这样一个场景：我们有一个类 `ComicBookLibrary`，它会从外部源加载大量的漫画列表：\n\n```csharp\nusing\
    \ System;\nusing System.Collections.Generic;\n\nclass ComicBook\n{\n    public\
    \ string Title { get; set; }\n    public int IssueNumber { get; set; }\n}\n\n\
    class ComicBookLibrary\n{\n    private List<ComicBook> _comicBooks;\n\n    public\
    \ ComicBookLibrary()\n    {\n        _comicBooks = LoadComicBooks();\n    }\n\n\
    \    private List<ComicBook> LoadComicBooks()\n    {\n        // 从外部源加载漫画的耗时操作\n\
    \        Console.WriteLine(\"Loading comic books...\");\n        return new List<ComicBook>\
    \ { new ComicBook { Title = \"Spider-Man\", IssueNumber = 1 } };\n    }\n\n  \
    \  public List<ComicBook> GetComicBooks()\n    {\n        return _comicBooks;\n\
    \    }\n}\n```\n\n在这个示例中，`LoadComicBooks()` 方法在对象构造期间被调用，如果该操作非常耗时，可能会导致性能问题。我们可以使用\
    \ `Lazy` 类来推迟漫画的加载，直到真正需要它们为止：\n\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
    \nclass ComicBook\n{\n    public string Title { get; set; }\n    public int IssueNumber\
    \ { get; set; }\n}\n\nclass ComicBookLibrary\n{\n    private Lazy<List<ComicBook>>\
    \ _lazyComicBooks;\n\n    public ComicBookLibrary()\n    {\n        _lazyComicBooks\
    \ = new Lazy<List<ComicBook>>(LoadComicBooks);\n    }\n\n    private List<ComicBook>\
    \ LoadComicBooks()\n    {\n        // 从外部源加载漫画的耗时操作\n        Console.WriteLine(\"\
    Loading comic books...\");\n        return new List<ComicBook> { new ComicBook\
    \ { Title = \"Spider-Man\", IssueNumber = 1 } };\n    }\n\n    public List<ComicBook>\
    \ GetComicBooks()\n    {\n        return _lazyComicBooks.Value;\n    }\n}\n```\n\
    \n现在，`LoadComicBooks()` 方法只有在第一次执行 `GetComicBooks()` 方法时才会被调用，从而减少了对象构造期间的开销。\n\
    \n### 5.3.2 使用 LINQ 的延迟序列\n\nLINQ（语言集成查询）是 C# 中一个强大的查询库，通过延迟执行（deferred execution）支持延迟计算（Lazy\
    \ Evaluation）。当你将一系列 LINQ 操作链在一起时，实际执行会被推迟，直到结果被枚举。\n\n让我们创建一个整数列表并使用 LINQ 过滤出偶数：\n\
    \n```csharp\nusing System;\nusing System.Linq;\nusing System.Collections.Generic;\n\
    \nclass Program\n{\n    static void Main()\n    {\n        List<int> numbers =\
    \ Enumerable.Range(1, 100).ToList();\n        Console.WriteLine(\"Creating filtered\
    \ sequence...\");\n        var evenNumbers = numbers.Where(n => n % 2 == 0);\n\
    \        Console.WriteLine(\"Enumerating filtered sequence...\");\n        foreach\
    \ (var number in evenNumbers)\n        {\n            Console.WriteLine(number);\n\
    \        }\n    }\n}\n```\n\n在这个示例中，`Where()` 方法是一个 LINQ 操作，它创建了一个新的偶数序列。然而，在\
    \ `foreach` 循环枚举 `evenNumbers` 序列之前，实际过滤并没有执行。这是通过延迟执行实现延迟计算的示例。\n\n现在，让我们更进一步，将延迟计算与\
    \ `yield` 关键字结合起来创建一个无限序列：\n\n```csharp\nusing System;\nusing System.Linq;\nusing\
    \ System.Collections.Generic;\n\nclass Program\n{\n    static IEnumerable<int>\
    \ GenerateFibonacciSequence()\n    {\n        int previous = -1;\n        int\
    \ current = 1;\n        while (true)\n        {\n            int next = previous\
    \ + current;\n            previous = current;\n            current = next;\n \
    \           yield return next;\n        }\n    }\n    static void Main()\n   \
    \ {\n        Console.WriteLine(\"Creating Fibonacci sequence...\");\n        var\
    \ fibonacciSequence = GenerateFibonacciSequence();\n        Console.WriteLine(\"\
    Enumerating Fibonacci sequence...\");\n        foreach (var number in fibonacciSequence.Take(10))\n\
    \        {\n            Console.WriteLine(number);\n        }\n    }\n}\n```\n\
    \n在这个示例中，我们使用 `yield` 关键字来创建一个无限序列。由于延迟计算，当我们使用 `Take()` 方法枚举序列时，只生成了前 10 个数字。\n\
    \n延迟计算就像是拖延的艺术，将计算推迟到绝对必要的时。通过采用这种函数编程技术，你可以优化 C# 代码的性能和内存，就像狂看你喜欢的剧集可以让你空闲时间最大化一样。在下一节中，我们将走向开发者未曾过的领域，探索单子（Monads）的世界。准备好开启这些神秘实体的秘密，并将它们应用到你的函数式编程中！\n\
    \n## 5.4 记忆化：记忆的艺术\n\n记忆化（Memoization）就像拥有过目不，就像《大爆炸理论》中的谢尔·库珀一样。在函数式编程中，记忆化允许你记住并存储耗贵函数调用的结果，这样当提供相同的输入时，就不需要重新计算它们。\n\
    \n记忆化可以显著提高递归函数或具有重叠子问题的计算性能。在 C# 中，你可以使用字典、缓存甚至装饰器来实现记忆化。让我们探索一些示例，以更好地理解实际应用的记忆化。\n\
    \n### 5.4.1 递归函数的记忆化\n\n考虑使用朴素递归实现计算斐波那契数列的经典示例：\n\n```csharp\nusing System;\n\
    class Program\n{\n    static int Fibonacci(int n)\n    {\n        if (n <= 1)\
    \ return n;\n        return Fibonacci(n - 1) + Fibonacci(n - 2);\n    }\n    static\
    \ void Main()\n    {\n        Console.WriteLine($\"The 30th Fibonacci number is\
    \ {Fibonacci(30)}\");\n    }\n}\n```\n\n这种实现的问题在于它会重复计算相同的斐波那契数。我们可以通过对之前的计算进行记忆化来优化这段代码：\n\
    \n```csharp\nusing System;\nusing System.Collections.Generic;\nclass Program\n\
    {\n    static Dictionary<int, int> _memo = new Dictionary<int, int>();\n    static\
    \ int Fibonacci(int n)\n    {\n        if (n <= 1) return n;\n        if (!memo.ContainsKey(n))\n\
    \        {\n            _memo[n] = Fibonacci(n - 1) + Fibonacci(n - 2);\n    \
    \    }\n        return _memo[n];\n    }\n    static void Main()\n    {\n     \
    \   Console.WriteLine($\"The 30th Fibonacci number is {Fibonacci(30)}\");\n  \
    \  }\n}\n```\n\n在这个示例中，我们使用字典来存储之前的斐波那契计算结果。当请求斐波那契数时，我们首先检查它是否在字典中。如果是，我们就返回记忆化的值，避免了冗余计算。\n\
    \n### 5.4.2 创建记忆化装饰器\n\n记忆化的更复用方法是创建一个可以记忆化任何函数的自定义装饰器。让我们来实现一个泛型 `Memoize` 扩展方法：\n\
    \n```csharp\npublic static class MemoizeExtensions\n{\n    public static Func<T,\
    \ TResult> Memoize<T, TResult>(this Func<T, TResult> func)\n    {\n        var\
    \ memo = new Dictionary<T, TResult>();\n        return arg =>\n        {\n   \
    \         if (!memo.ContainsKey(arg))\n            {\n                memo[arg]\
    \ = func(arg);\n            }\n            return memo[arg];\n        };\n   \
    \ }\n}\n```\n\n现在，我们可以使用这个装饰器来记忆化任何函数。让我们它来记忆化我们原始的斐波那契函数：\n\n```csharp\nusing\
    \ System;\nusing MemoizeLibrary;\nclass Program\n{\n    static int Fibonacci(int\
    \ n)\n    {\n        if (n <= 1) return n;\n        return MemoizedFibonacci(n\
    \ - 1) + MemoizedFibonacci(n - 2);\n    }\n    static Func<int, int> MemoizedFibonacci\
    \ = ((Func<int, int>)Fibonacci).Memoize();\n    static void Main()\n    {\n  \
    \      Console.WriteLine($\"The 30th Fibonacci number is {MemoizedFibonacci(30)}\"\
    );\n    }\n}\n```\n\n在这个示例中，我们使用 `Memoize` 扩展方法创建斐波那契函数的记忆化版本。这种方法更具复用性，因为它适用于任何具有单个输入和输出的函数。\n"
- fmt: "\nMemoization is like having a photographic memory in the world of functional\
    \ programming. By remembering the results of expensive computations, you can optimize\
    \ your code and eliminate redundant calculations, just like `Sheldon Cooper`’s\
    \ remarkable recall ability helps him recall vast amounts of information.\n\n\
    In this section, we’ve explored how to implement Memoization in C# using dictionaries\
    \ and custom decorators. By applying these techniques, you can unlock significant\
    \ performance improvements in your code, especially when dealing with recursive\
    \ functions or computations with overlapping subproblems.\n\nNext up, we’ll explore\
    \ the fascinating world of LINQ (Language Integrated Query), which brings the\
    \ power of functional programming to the forefront of C#. LINQ enables you to\
    \ write expressive, composable, and reusable code using a rich set of query operators.\
    \ So, grab your favorite manga or comic book, and get ready to embark on an exciting\
    \ voyage through the universe of functional programming in C# with LINQ as our\
    \ guide!\n\n# Chapter 6: LINQ: The Power of Functional Programming in C\n\n##\
    \ 6.1 Introduction to LINQ\n\nMuch like the Force binds the Star Wars universe\
    \ together, LINQ (Language Integrated Query) unites the world of functional programming\
    \ in C#. LINQ is a powerful querying library that enables you to work with data\
    \ in a more expressive, composable, and flexible way. It offers a rich set of\
    \ query operators to filter, project, and transform data, treating both in-memory\
    \ collections and external data sources as first-class citizens.\n\nLINQ’s functional\
    \ nature encourages a declarative programming style, which helps you write cleaner,\
    \ more maintainable code. LINQ supports various data sources, such as in-memory\
    \ collections, XML, and databases through its different providers: LINQ to Objects,\
    \ LINQ to XML, and LINQ to SQL, respectively.\n\nIn this section, we’ll introduce\
    \ you to the fundamentals of LINQ and showcase its power in the realm of functional\
    \ programming. Let’s embark on this exciting journey, exploring the many ways\
    \ LINQ can transform your C# code.\n\n### 6.1.1 Basic LINQ Syntax\n\nLINQ provides\
    \ two syntax options: query syntax and method syntax. Query syntax, inspired by\
    \ SQL, offers a familiar and more readable way to write LINQ queries. Method syntax,\
    \ on the other hand, uses extension methods and lambda expressions for a more\
    \ functional programming approach.\n\nLet’s look at an example of both syntax\
    \ styles. Suppose we have a list of Star Wars characters and want to filter those\
    \ with the “Jedi” profession:\n\n```csharp\nusing System;\nusing System.Linq;\n\
    using System.Collections.Generic;\n\nclass StarWarsCharacter\n{\n    public string\
    \ Name { get; set; }\n    public string Profession { get; set; }\n}\n\nclass Program\n\
    {\n    static void Main()\n    {\n        List<StarWarsCharacter> characters =\
    \ new List<StarWarsCharacter>\n        {\n            new StarWarsCharacter {\
    \ Name = \"Luke Skywalker\", Profession = \"Jedi\" },\n            new StarWarsCharacter\
    \ { Name = \"Han Solo\", Profession = \"Smuggler\" },\n            new StarWarsCharacter\
    \ { Name = \"Obi-Wan Kenobi\", Profession = \"Jedi\" },\n            new StarWarsCharacter\
    \ { Name = \"Darth Vader\", Profession = \"Sith Lord\" }\n        };\n\n     \
    \   // Query syntax\n        var jediCharactersQuery = from character in characters\n\
    \                                  where character.Profession == \"Jedi\"\n  \
    \                                select character;\n\n        // Method syntax\n\
    \        var jediCharactersMethod = characters.Where(c => c.Profession == \"Jedi\"\
    );\n\n        Console.WriteLine(\"Jedi characters (Query syntax):\");\n      \
    \  foreach (var character in jediCharactersQuery)\n        {\n            Console.WriteLine(character.Name);\n\
    \        }\n\n        Console.WriteLine(\"\\nJedi characters (Method syntax):\"\
    );\n        foreach (var character in jediCharactersMethod)\n        {\n     \
    \       Console.WriteLine(character.Name);\n        }\n    }\n}\n```\n\nIn this\
    \ example, we used both query syntax and method syntax to filter the list of characters.\
    \ The result is the same, but the syntax cater to different preferences.\n\n##\
    \ 6.2 Query Syntax vs. Method Syntax\n\nIn the world of LINQ, there are two primary\
    \ ways to express queries: Query Syntax and Method Syntax. Both have their advantages,\
    \ and understanding their differences is crucial for using LINQ effectively. In\
    \ this section, we’ll compare Query and Method Syntax and provide examples.\n\n\
    ### 6.2.1 Query Syntax\n\nQuery Syntax, also known as Query Expression, resembles\
    \ SQL and is designed to be more readable for developers who work with databases.\
    \ It uses a set of keywords like `from`, `where`, `select`, `orderby`, and `join`.\n\
    \nPros:\n- More readable and familiar to SQL developers.\n- Simplifies complex\
    \ queries.\n\nCons:\n- Limited to a subset of LINQ operators.\n- May require more\
    \ code for simple operations.\n\nExample:\n```csharp\nvar jediCharactersQuery\
    \ = from character in characters\n                          where character.Profession\
    \ == \"Jedi\"\n                          select character;\n```\n\n### 6.2.2 Method\
    \ Syntax\n\nMethod Syntax, also known as Fluent Syntax, relies on extension methods\
    \ and lambda expressions. It offers a more functional approach and provides access\
    \ to the full range of LINQ operators.\n\nPros:\n- More flexible, as it supports\
    \ all LINQ operators.\n- Encourages a functional style.\n\nCons:\n- Less familiar\
    \ and readable for developers.\n- Doesn’t support transparent identifiers, which\
    \ may require additional code for scenarios.\n\nExample:\n```csharp\nvar jediCharactersMethod\
    \ = characters.Where(c => c.Profession == \"Jedi\");\n```\n\nLet’s compare Query\
    \ Syntax and Method Syntax using a more complex example. Suppose we want to join\
    \ a list of authors with a list of books, and then group the books by author:\n\
    \n```csharp\n// Query Syntax\nvar booksByAuthorQuery = from author in authors\n\
    \                        join book in books on author.Id equals book.Id\n    \
    \                    group book by author.Name into bookGroup\n              \
    \          select new { Author = bookGroup.Key, Books = bookGroup.ToList() };\n\
    \n// Method Syntax\nvar booksByAuthorMethod = authors.Join(books, a => a.Id, b\
    \ => b.AuthorId, (a, b) => new { a.Name, Book = b })\n                       \
    \          .GroupBy(x => x.Name, x => x.Book)\n                              \
    \   .Select(g => new { Author = g.Key, Books = g.ToList() });\n```\n\nIn this\
    \ example, Query Syntax is more readable and easier to understand for complex\
    \ queries, whereas Method Syntax is more concise but may be harder to grasp for\
    \ developers unfamiliar with functional programming.\n\n## 6.2.3 Extending LINQ\
    \ with Custom Query Operators\n"
