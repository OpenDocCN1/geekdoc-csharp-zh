  trans: "\n\n既然我们已经有了 `TaskResultExtensions`，让我们创建一个新的示例，使用这些扩展方法来构建一个带有错误处理的异步函数流水线。\n\
    \n```csharp\npublic async Task<Result<(Customer, Account, List<Transaction>)>>\
    \ FetchCustomerAccountDataAsync(int customerId, int accountId)\n{\n    var result\
    \ = await (from customerResult in GetCustomerAsync(customerId)\n             \
    \           from accountResult in GetAccountAsync(accountId)\n               \
    \         from transactionsResult in GetRecentTransactionsAsync(accountId)\n \
    \                       select (customerResult, accountResult, transactionsResult));\n\
    \n    return result.IsSuccess\n      ? new Result<(Customer, Account, List<Transaction>)>((result.Value.Item1,\
    \ result.Value.Item2, result.Value.Item3))\n      : new Result<(Customer, Account,\
    \ List<Transaction>)>(result.ErrorMessage);\n}\n```\n\n在这个示例中，我们使用 LINQ 查询语法，结合\
    \ `TaskResult` 和 `TaskResultExtensions` 构建了一个异步函数流水线，用于获取客户数据、账户数据和最近的交易记录。如果在任何操作中发生错误，流水线将返回一个带有错误信息的\
    \ `Result<(Customer, Account, List)>`。否则，它将返回一个包含获取到的数据的成功结果。\n\n`TaskResultExtensions`\
    \ 使我们能够创建以函数式方式处理错误的异步函数流水线，使代码更具读性和可维护性。它促进了关注点分离，因为流水线中的每个方法都负责其自身的错误处理，并且更容易处理异步操作过程中可能发生的不同类型的错误。\n\
    \n总之，使用 LINQ 查询语法和 Task 扩展方法构建异步函数流水线可以编写更简洁、易读且可维护的代码。它还促进了关注点分离，并更容易以函数式方式处理错误。通过将这种方法扩展到处理\
    \ `Result` 类型，我们可以在 C# 中创建健壮且高效的异步流水线。\n\n## 8.3 异步处理错误\n\n在本节中，我们将探索如何在函数式 C#\
    \ 中异步处理错误。异步编程是现代软件开发的一个重要方面，它允许我们在执行非阻塞 I/O 操作的同时释放资源。在函数式编程中，我们通常使用 `Either`、`Option`\
    \ 或 `Result` 等单数结构来处理错误。\n\n为了方便操作，我们将使用 `Functional-Ext` 库，该库提供了许多实用的工具和扩展，使\
    \ C# 的函数式编程更加方便。该库将在第 10 章中详细介绍。\n\n### 8.3.1 使用 Result 进行异步错误处理\n\n`Result` 是一种单数结构，表示计算的结果，该结果可能是成功也可能是错误。它可以包含一个成功值，也可以包含一个错误。在异步编程中，我们可以将\
    \ `Result` 与 `Task` 结合，以兼容 async/await 的方式处理错误。\n\n考虑以下示例，我们有一个可能会抛出异常的函数：\n\n\
    ```csharp\nasync Task<string> LoadDataAsync(string url)\n{\n    // 从 URL 加载数据并将结果作为字符串返回\n\
    }\n```\n\n为了以函数的方式处理错误，我们可以将返回类型封装在 `Result` 中：\n\n```csharp\nusing Functional;\n\
    using System.Threading.Tasks;\n\nasync Task<Result<string, Exception>> LoadDataResultAsync(string\
    \ url)\n{\n    try\n    {\n        var data = await LoadDataAsync(url);\n    \
    \    return Result.Ok<string, Exception>(data);\n    }\n    catch (Exception ex)\n\
    \    {\n        return Result.Error<string, Exception>(ex);\n    }\n}\n```\n\n\
    现在，我们可以消费该函数并处理成功和错误两种情况：\n\n```csharp\nasync Task MainAsync()\n{\n    var result\
    \ = await LoadDataResultAsync(\"https://example.com/data\");\n    result.Match(\n\
    \        ok: data => Console.WriteLine($\"Data: {data}\"),\n        error: ex\
    \ => Console.WriteLine($\"Error: {ex.Message}\")\n    );\n}\n```\n\n### 8.3.2\
    \ 组合异步函数\n\n在异步编程中使用 `Result` 的主要优势之一是我们可以轻松地组合函数，即使它们可能会失败。`Functional-Ext` 库提供了各种扩展，例如\
    \ `BindAsync`，来帮助实现。\n\n假设我们有两个函数，`LoadDataResultAsync` 和 `ProcessDataResultAsync`：\n\
    \n```csharp\nasync Task<Result<string, Exception>> LoadDataResultAsync(string\
    \ url) { /* ... */ }\nasync Task<Result<int, Exception>> ProcessDataResultAsync(string\
    \ data) { /* ... */ }\n```\n\n我们可以使用 `BindAsync` 组合这些函数：\n\n```csharp\nasync Task\
    \ MainAsync()\n{\n    var url = \"https://example.com/data\";\n    var result\
    \ = await LoadDataResultAsync(url).BindAsync(data => ProcessDataResultAsync(data));\n\
    \    result.Match(\n        ok: processedData => Console.WriteLine($\"Processed\
    \ data: {processedData}\"),\n        error: ex => Console.WriteLine($\"Error:\
    \ {ex.Message}\")\n    );\n}\n```\n\n在这个示例中，`BindAsync` 组合了函数并短路了错误。如果 `LoadDataResultAsync`\
    \ 返回错误，则不会调用 `ProcessDataResultAsync` 函数，错误将传播到 `Match` 函数。\n\n### 8.3.3 并行计算中的错误处理\n\
    \n`Functional-Ext` 库还提供了在执行并行操作时处理错误的方法。例如，考虑一种情况：我们需要并行从多个 URL 下载数据并对其进行处理。该库提供了\
    \ `Traverse` 方法来实现这一目的。\n\n假设我们有一个 URL 列表，用于从中加载并处理数据：\n\n```csharp\nusing Functional;\n\
    using System.Threading.Tasks;\n\nasync Task MainAsync()\n{\n    List<string> urls\
    \ = new List<string>\n    {\n        \"https://example.com/data1\",\n        \"\
    https://example.com/data2\",\n        \"https://example.com/data3\"\n    };\n\
    \    var result = await urls.Traverse(async url => await LoadDataAsync(url).BindAsync(data\
    \ => ProcessDataResultAsync(data)));\n    result.Match(\n        ok: processedDataList\
    \ =>\n        {\n            Console.WriteLine(\"Processed data:\");\n       \
    \     foreach (var processedData in processedDataList)\n            {\n      \
    \          Console.WriteLine(processedData);\n            }\n        },\n    \
    \    error: ex => Console.WriteLine($\"Error: {ex.Message}\")\n    );\n}\n```\n\
    \n在这个示例中，`Traverse` 并行的将异步函数应用于 `urls` 列表的每个元素，然后将结果合并为一个 `Result`。如果任何操作失败，`Result`\
    \ 将持有首次遇到的错误，成功情况将包含处理后的数据列表。\n\n### 8.3.4 重试异步操作\n\n在某些情况下，如果异步操作失败，你可能想重试它。`Functional-Ext`\
    \ 库提供了一个方便的 `RetryAsync` 扩展方法用于此目的。这里有一个示例演示了如何配合 `LoadDataResultAsync` 函数使用 `RetryAsync`：\n\
    \n```csharp\nasync Task MainAsync()\n{\n    var url = \"https://example.com/data\"\
    ;\n    int maxRetries = 3;\n    var result = await LoadDataResultAsync(url).RetryAsync(maxRetries,\
    \ async (url, retryCount) =>\n    {\n        Console.WriteLine($\"Retrying {retryCount\
    \ + 1}/{maxRetries}...\");\n        await Task.Delay(1000); // 重试前等待 1 秒\n   \
    \ });\n\n    result.Match(\n        ok: data => Console.WriteLine($\"Data: {data}\"\
    ),\n        error: ex => Console.WriteLine($\"Error: {ex.Message}\")\n    );\n\
    }\n```\n\n在这个示例中，`RetryAsync` 扩展方法用于在 `LoadDataResultAsync` 操作失败时重试，最多尝试 `maxRetries`\
    \ 次。如果操作在所有重试后仍然失败，错误将传播到 `Match` 函数。\n\n"
- fmt: "\nUsing these concepts and techniques will help you build robust and maintainable\
    \ error handling strategies in your functional C# applications, enabling you to\
    \ handle both success and failure cases in a consistent and composable manner.\n\
    \n# Chapter 9: Functional Design Patterns\n\nIn this chapter, we will explore\
    \ functional design patterns commonly used in functional programming. These design\
    \ patterns help you write cleaner, more reusable, and maintainable code by taking\
    \ advantage of functional programming concepts.\n\n## 9.1 Functor, Applicative,\
    \ and Monad\n\nIn functional programming, `Functor`, `Applicative`, and `Monad`\
    \ are design patterns that deal with effectful computations. They help us compose\
    \ functions that produce values inside a computational context, such as error\
    \ handling, asynchronous operations, or computations that may have side effects.\
    \ Let’s discuss each of these patterns in detail and implement them from scratch\
    \ in C# using various examples.\n\n### Functor\nA `Functor` is a design pattern\
    \ that involves using a generic data type that has a `map` operation. `Functors`\
    \ allow you to apply a function to a value inside a computational context without\
    \ having to explicitly manage the context. In C#, you can think of `IEnumerable`\
    \ and `Task` as examples of functors. The `Select` method of `LINQ` is an example\
    \ of a `map` operation.\n\nLet’s create a simple `Maybe` type and implement the\
    \ `map` operation as an extension method:\n\n```csharp\npublic abstract class\
    \ Maybe<T>\n{\n    public static Maybe<T> None() => new None<T>();\n    public\
    \ static Maybe<T> Some(T value) => new Some<T>(value);\n}\n\npublic class None<T>\
    \ : Maybe<T> { }\n\npublic class Some<T> : Maybe<T>\n{\n    public T Value { get;\
    \ }\n    public Some(T value)\n    {\n        Value = value;\n    }\n}\n\npublic\
    \ static class MaybeExtensions\n{\n    public static Maybe<TResult> Map<TSource,\
    \ TResult>(\n        this Maybe<TSource> maybe,\n        Func<TSource, TResult>\
    \ selector)\n    {\n        return maybe switch\n        {\n            Some<TSource>\
    \ some => Maybe<TResult>.Some(selector(some.Value)),\n            _ => Maybe<TResult>.None(),\n\
    \        };\n    }\n}\n```\n\nNow, let’s implement the `map` operation for the\
    \ `IEnumerable` type:\n\n```csharp\npublic static class EnumerableExtensions\n\
    {\n    public static IEnumerable<TResult> Map<TSource, TResult>(\n        this\
    \ IEnumerable<TSource> source,\n        Func<TSource, TResult> selector)\n   \
    \ {\n        return source.Select(selector);\n    }\n}\n```\n\nAnd for the `Task`\
    \ type:\n\n```csharp\npublic static class TaskExtensions\n{\n    public static\
    \ async Task<TResult> Map<TSource, TResult>(\n        this Task<TSource> task,\n\
    \        Func<TSource, TResult> selector)\n    {\n        return selector(await\
    \ task);\n    }\n}\n```\n\n### Applicative\nAn `Applicative` extends the `Functor`\
    \ concept by allowing you to apply a function wrapped in a computational context\
    \ to a value inside the same context. In C#, we can create an `Applicative` using\
    \ the same `Maybe` type as before and implement an `Apply` extension method:\n\
    \n```csharp\npublic static class MaybeExtensions\n{\n    // ...\n    public static\
    \ Maybe<TResult> Apply<TSource, TResult>(\n        this Maybe<Func<TSource, TResult>>\
    \ maybeFunc,\n        Maybe<TSource> maybeValue)\n    {\n        return maybeFunc\
    \ switch\n        {\n            Some<Func<TSource, TResult>> someFunc =>\n  \
    \              maybeValue.Map(value => someFunc.Value(value)),\n            _\
    \ => Maybe<TResult>.None(),\n        };\n    }\n}\n```\n\nNow, let’s implement\
    \ the `Apply` operation for the `IEnumerable` type:\n\n```csharp\npublic static\
    \ class EnumerableExtensions\n{\n    // ...\n    public static IEnumerable<TResult>\
    \ Apply<TSource, TResult>(\n        this IEnumerable<Func<TSource, TResult>> sourceFuncs,\n\
    \        IEnumerable<TSource> sourceValues)\n    {\n        return from func in\
    \ sourceFuncs\n               from value in sourceValues\n               select\
    \ func(value);\n    }\n}\n```\n\nAnd for the `Task` type:\n\n```csharp\npublic\
    \ static async Task<TResult> Apply<TSource, TResult>(\n    this Task<Func<TSource,\
    \ TResult>> taskFunc,\n    Task<TSource> taskValue)\n{\n    var func = await taskFunc;\n\
    \    var value = await taskValue;\n    return func(value);\n}\n```\n\n### Monad\n\
    A `Monad` is a design pattern that generalizes the concept of chaining operations.\
    \ `Monads` allow you to flatten nested contexts and perform actions. A `monad`\
    \ must provide a `bind` operation (also as `SelectMany` in C#).\n\nLet’s implement\
    \ the `bind` operation for our `Maybe` type:\n\n```csharp\npublic static class\
    \ MaybeExtensions\n{\n    // ...\n    public static Maybe<TResult> Bind<TSource,\
    \ TResult>(\n        this Maybe<TSource> maybe,\n        Func<TSource, Maybe<TResult>>\
    \ selector)\n    {\n        return maybe switch\n        {\n            Some<TSource>\
    \ some => selector(some.Value),\n            _ => Maybe<TResult>.None(),\n   \
    \     };\n    }\n}\n```\n\nNow, let’s implement the `bind` operation for the `IEnumerable`\
    \ type:\n\n```csharp\npublic static class EnumerableExtensions\n{\n    // ...\n\
    \    public static IEnumerable<TResult> Bind<TSource, TResult>(\n        this\
    \ IEnumerable<TSource> source,\n        Func<TSource, IEnumerable<TResult>> selector)\n\
    \    {\n        return source.SelectMany(selector);\n    }\n}\n```\n\nAnd for\
    \ the `Task` type:\n\n```csharp\npublic static async Task<TResult> Bind<TSource,\
    \ TResult>(\n    this Task<TSource> task,\n    Func<TSource, Task<TResult>> selector)\n\
    {\n    return await selector(await task);\n}\n```\n\nNow we have seen how to implement\
    \ `Functor`, `Applicative`, and `Monad` for three different computational contexts:\
    \ `Maybe`, `IEnumerable`, and `Task`. With these concepts, you can create more\
    \ reusable and composable code in a functional style.\n\n# Chapter 10: Usage and\
    \ Examples\n\nNow that we’ve implemented `Functor`, `Applicative`, and `Monad`\
    \ for `Maybe`, `IEnumerable`, and `Task`, let’s look at how we can use these patterns\
    \ in real-life examples.\n\n## 10.1 Maybe Example\n\nImagine we have a list of\
    \ user IDs and a function to find a user’s email by their ID. However, the function\
    \ may return `None` if the user is not found. We can use the `Maybe` monad to\
    \ chain multiple operations.\n\n```csharp\npublic class User\n{\n    public int\
    \ Id { get; set; }\n    public string Email { get; set; }\n}\n\npublic Maybe<User>\
    \ FindUserById(int id)\n{\n    // Find a user by ID (could be from a database,\
    \ for example)\n    // Here, we're simulating the lookup with a hardcoded list\n\
    \    var users = new List<User>\n    {\n        new User { Id = 1, Email = \"\
    john@example.com\" },\n        new User { Id = 2, Email = \"jane@example.com\"\
    \ },\n    };\n    return users.FirstOrDefault(user => user.Id == id).ToMaybe();\n\
    }\n\npublic Maybe<string> GetUserEmail(int userId)\n{\n    return FindUserById(userId).Map(user\
    \ => user.Email);\n}\n\nvar userIds = new List<int> { 1, 2, 3, 4 };\nvar emails\
    \ = userIds.Map(GetUserEmail);\n```\n\n## 10.2 IEnumerable Example\n\nSuppose\
    \ we have a list of customers and a list of orders, and we want to find all the\
    \ orders placed by a specific group of customers. We can use the `IEnumerable`\
    \ monad to achieve this.\n\n```csharp\npublic class Customer\n{\n    public int\
    \ Id { get; set; }\n    public string Name { get; set; }\n}\n\npublic class Order\n\
    {\n    public int Id { get; set; }\n    public int CustomerId { get; set; }\n\
    \    public double Total { get; set; }\n}\n\npublic IEnumerable<Order> GetOrdersForCustomers(\n\
    \    IEnumerable<Customer> customers,\n    IEnumerable<Order> orders)\n{\n   \
    \ return customers.Bind(customer =>\n        orders.Where(order => order.CustomerId\
    \ == customer.Id));\n}\n\nvar customers = new List<Customer>\n{\n    new Customer\
    \ { Id = 1, Name = \"John\" },\n    new Customer { Id = 2, Name = \"Jane\" },\n\
    };\n\nvar orders = new List<Order>\n{\n    new Order { Id = 101, CustomerId =\
    \ 1, Total = 100.0 },\n    new Order { Id = 102, CustomerId = 1, Total = 200.0\
    \ },\n    new Order { Id = 103, CustomerId = 2, Total = 300.0 },\n    new Order\
    \ { Id = 104, CustomerId = 3, Total = 400.0 },\n};\n\nvar customerOrders = GetOrdersForCustomers(customers,\
    \ orders);\n```\n"
