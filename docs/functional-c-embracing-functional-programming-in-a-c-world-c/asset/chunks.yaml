    \ data model representing a collection of products:\n\npublic  class Product\n\
    \n{\n\n public ObjectId Id {  get;  set;  }\n\n public  string Name {  get;  set;\
    \  }\n\n public  decimal Price {  get;  set;  }\n\n public  string Category {\
    \  get;  set;  }\n\n}\n\nLet’s assume we have a MongoDB collection containing\
    \ product data, and we want to perform the following tasks:\n\n*   Retrieve all\
    \ products from the database.\n\n*   Filter products by a specific category.\n\
    \n*   Calculate the average price of the filtered products.\n\nWe’ll begin by\
    \ establishing a connection to the MongoDB database and retrieving the product\
    \ data:\n\nusing MongoDB.Bson;\n\nusing MongoDB.Driver;\n\nIMongoClient client\
    \ =  new  MongoClient(\"mongodb://localhost:27017\");\n\nIMongoDatabase database\
    \ = client.GetDatabase(\"test\");\n\nIMongoCollection<Product> collection = database.GetCollection<Product>(\"\
    products\");\n\nList<Product> products = await collection.Find(_ =>  true).ToListAsync();\n\
    \nWith the product data in hand, we can now use Language-Ext and functional programming\
    \ techniques to create our data processing pipeline:\n\nusing LanguageExt;\n\n\
    using  static LanguageExt.Prelude;\n\ndecimal  AveragePrice(IEnumerable<Product>\
    \ products)\n\n{\n\n return products.Any()  ? products.Average(p => p.Price) \
    \ : 0m;\n\n}\n\nOption<decimal>  CalculateAveragePriceByCategory(IEnumerable<Product>\
    \ products,  string category)\n\n{\n\n    return products\n\n        .Where(p\
    \ => p.Category  == category)\n\n        .ToOption()\n\n        .Filter(ps =>\
    \ ps.Any())\n\n        .Map(AveragePrice);\n\n}\n\nvar averagePrice =  CalculateAveragePriceByCategory(products,\
    \  \"Electronics\")\n\n    .Match(\n\n        Some: price => $\"Average price:\
    \ {price}\",\n\n        None:  ()  =>  \"No products found in the specified category\"\
    \n\n    );\n\nConsole.WriteLine(averagePrice);\n\nIn this example, we define a\
    \ CalculateAveragePriceByCategory function that filters the products by the given\
    \ category and computes the average price using the AveragePrice helper function.\
    \ We use Language-Ext’s Option monad to represent the possibility of having no\
    \ products in the specified category, which allows us to handle the scenario in\
    \ a safe and functional manner.\n\nContinuing with our data processing and analysis\
    \ example, we’ll now introduce agents to handle concurrency. Agents are a functional\
    \ programming pattern for managing shared mutable state in a safe and controlled\
    \ manner. They can help us avoid race conditions and deadlocks while working with\
    \ concurrent data processing tasks.\n\nTo demonstrate the use of agents in a data\
    \ processing pipeline, we will use Language-Ext’s Agent type, and we’ll expose\
    \ the functionality using the .NET 7 minimal API. First, let’s install the necessary\
    \ NuGet package for the minimal API:\n\nInstall-Package Microsoft.AspNetCore.Diagnostics.EntityFrameworkCore\n\
    \nNow, we’ll create an agent that receives requests to calculate the average price\
    \ by category and processes them concurrently:\n\nusing LanguageExt;\n\nusing\
    \  static LanguageExt.Prelude;\n\nrecord AveragePriceRequest(string Category,\
    \ IObserver<decimal?> Response);\n\nAgent<AveragePriceRequest>  CreateAveragePriceAgent(IEnumerable<Product>\
    \ products)\n\n{\n\n    return Agent.Start<AveragePriceRequest>(async request\
    \ =>\n\n    {\n\n        var averagePrice =  CalculateAveragePriceByCategory(products,\
    \ request.Category);\n\n        await request.Response.OnNextAsync(averagePrice.ToNullable());\n\
    \n    });\n\n}\n\nIn this example, we define a CreateAveragePriceAgent function\
    \ that takes an IEnumerable<Product> and returns an agent that can process AveragePriceRequest\
    \ messages. Each AveragePriceRequest contains the category and an observer that\
    \ receives the average price result. The agent will process incoming requests\
    \ concurrently, allowing us to handle multiple requests without blocking or introducing\
    \ synchronization issues.\n\nNow, let’s create a minimal API that exposes this\
    \ functionality:\n\nusing Microsoft.AspNetCore.Builder;\n\nusing Microsoft.Extensions.DependencyInjection;\n\
    \nvar builder = WebApplication.CreateBuilder(args);\n\nvar app = builder.Build();\n\
    \napp.UseRouting();\n\nvar products = await FetchProductsAsync();  // Assume this\
    \ function fetches products from the database\n\nvar averagePriceAgent =  CreateAveragePriceAgent(products);\n\
    \napp.MapGet(\"/api/average-price/{category}\",  async  (string category, IObserver<decimal?>\
    \ response)  =>\n\n{\n\n    var request =  new  AveragePriceRequest(category,\
    \ response);\n\n    averagePriceAgent.Tell(request);\n\n    await Task.CompletedTask;\n\
    \n});\n\napp.UseEndpoints(endpoints => endpoints.MapControllers());\n\nawait app.RunAsync();\n\
    \nIn this example, we create a minimal API with a single GET endpoint that calculates\
    \ the average price by category using the averagePriceAgent. The agent processes\
    \ incoming requests concurrently, ensuring that the API remains responsive even\
    \ under heavy load.\n\nUsing agents in the previous example brings several benefits,\
    \ especially when dealing with concurrent data processing tasks. Some of the main\
    \ advantages of using agents include:\n\n*   Safe management of shared mutable\
    \ state: Agents encapsulate the shared state and allow safe access and modification.\
    \ They process messages sequentially and provide exclusive access to the state,\
    \ which eliminates race conditions and synchronization issues without the need\
    \ for locks or complex concurrency mechanisms."
