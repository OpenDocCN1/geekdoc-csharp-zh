  trans: "\n在这个示例中，基本情况是 `n` 等于 0 或 1，此时函数返回对应的值。递归情况是函数调用调用两次，一次使用参数 `n - 1`，另一次使用\
    \ `n - 2`，以计算前两个数字之和。\n\n尽管递归非常强大，但它也有一些缺点。由于函数调用的开销和潜在的栈溢出，它可能会导致性能问题。为了缓解这些问题，可以使用名为“尾递归”的技术，其中递归调用是函数中执行的最后一个操作。这允许编译器优化代码并避免栈溢出。这里是带有尾递归的阶乘示例：\n\
    \n```csharp\nusing System;\n\nclass Program\n{\n    static int TailRecursiveFactorial(int\
    \ n, int accumulator = 1)\n    {\n        if (n == 1)\n        {\n           \
    \ return accumulator;\n        }\n        else\n        {\n            return\
    \ TailRecursiveFactorial(n - 1, accumulator * n);\n        }\n    }\n    static\
    \ void Main()\n    {\n        int number = 5;\n        Console.WriteLine($\"The\
    \ factorial of {number} is {TailRecursiveFactorial(number)}\");\n    }\n}\n```\n\
    \n在这个示例中，我们引入了一个 `accumulator` 参数来保存目前为止的结果。这一更改允许编译器优化函数调用并防止栈溢出。\n\n现在我们已经深入研究了递归，将转向另一种函数式编程技术：柯里化（Currying）和部分应用（Partial\
    \ Application）。\n\n# 第 5 章：柯里化与部分应用：拆拆拆的艺术\n\n柯里化和部分应用就像重混你最喜欢的摇滚曲。你选取一首原始曲目，将其拆分成更小的片段，并重新排列它们以创建出新鲜且的内容。在函数式编程中，这些技术使你能够将复杂的函数分解为更简单的函数并更有效地重用代码。\n\
    \n柯里化是将一个接受多个参数的函数转换为一系列每个只接受单个参数的函数的过程。这种技术可以使你的代码更加灵活且易于组合。\n\n让我们从一个简单的示例开始。我们将创建一个函数，在应用折扣和添加税之后计算产品的总价。这里是原始的、未柯里化的版本：\n\
    \n```csharp\nusing System;\n\nclass Program\n{\n    static decimal CalculateTotalPrice(decimal\
    \ price, decimal discount, decimal tax)\n    {\n        decimal discountedPrice\
    \ = price * (1 - discount);\n        return discountedPrice * (1 + tax);\n   \
    \ }\n    static void Main()\n    {\n        decimal price = 100;\n        decimal\
    \ discount = 0.1m;\n        decimal tax = 0.2m;\n        Console.WriteLine($\"\
    The total price is {CalculateTotalPrice(price, discount, tax)}\");\n    }\n}\n\
    ```\n\n现在，让我们对 `CalculateTotalPrice()` 函数进行柯里化：\n\n```csharp\nusing System;\n\n\
    class Program\n{\n    static Func<decimal, Func<decimal, Func<decimal, decimal>>>\
    \ CurriedCalculateTotalPrice =>\n    price => discount => tax => price * (1 -\
    \ discount) * (1 + tax);\n    static void Main()\n    {\n        decimal price\
    \ = 100;\n        decimal discount = 0.1m;\n        decimal tax = 0.2m;\n    \
    \    var applyPrice = CurriedCalculateTotalPrice(price);\n        var applyDiscount\
    \ = applyPrice(discount);\n        var calculateTotal = applyDiscount(tax);\n\
    \        Console.WriteLine($\"The total price is {calculateTotal}\");\n    }\n\
    }\n```\n\n在这个示例中，我们使用柯里化技术将 `CalculateTotalPrice()` 函数转换为了一系列函数。每个函数接受一个单一参数并返回另一个函数，最终计算出总价。\n\
    \n部分应用是一种固定函数中某些参数的技术，从而生成一个参数更少的新函数。这允许你创建可重用且专门的函数。\n\n让我们创建一个库，提供一种通过扩展方法使用柯里化的良好方式。我们将实现一个泛型柯里化方法：\n\
    \n```csharp\npublic static class Curry\n{\n    public static Func<T2, Func<T3,\
    \ TResult>> Curry<T1, T2, T3, TResult>(this Func<T1, T2, T3, TResult> func, T1\
    \ arg1)\n    {\n        return arg2 => arg3 => func(arg1, arg2, arg3);\n    }\n\
    }\n```\n\n现在，让我们使用这个扩展方法对 `CalculateTotalPrice()` 函数进行柯里化：\n\n```csharp\nusing\
    \ System;\nusing CurryLibrary;\n\nclass Program\n{\n    static decimal CalculateTotalPrice(decimal\
    \ price, decimal discount, decimal tax)\n    {\n        decimal discountedPrice\
    \ = price * (1 - discount);\n        return discountedPrice * (1 + tax);\n   \
    \ }\n    static void Main()\n    {\n        decimal price = 100;\n        decimal\
    \ discount = 0.1m;\n        decimal tax = 0.2m;\n        var curriedCalculateTotalPrice\
    \ = ((Func<decimal, decimal, decimal, decimal>)CalculateTotalPrice).Curry(price);\n\
    \        var applyDiscount = curriedCalculateTotalPrice(discount);\n        var\
    \ calculateTotal = applyDiscount(tax);\n        Console.WriteLine($\"The total\
    \ price is {calculateTotal}\");\n    }\n}\n```\n\n在这个示例中，我们使用了 `Curry()` 扩展方法对\
    \ `CalculateTotalPrice()` 函数进行柯里化。这种方法的优点是，你可以对任何带有三个参数的函数进行柯里化，而无需更改其实现。\n\n\
    现在，让我们探索部分应用的用例。假设你有一家漫画店，你想对所有漫画应用 10% 的折扣。你可以使用部分应用来创建一个应用该折扣的专门函数：\n\n```csharp\n\
    public static class PartialApplication\n{\n    public static Func<T2, TResult>\
    \ Apply<T1, T2, TResult>(this Func<T1, T2, TResult> func, T1 arg1)\n    {\n  \
    \      return arg2 => func(arg1, arg2);\n    }\n}\n```\n\n```csharp\nusing System;\n\
    using CurryLibrary;\n\nclass Program\n{\n    static decimal ApplyDiscount(decimal\
    \ discount, decimal price)\n    {\n        return price * (1 - discount);\n  \
    \  }\n    static void Main()\n    {\n        decimal price = 100;\n        decimal\
    \ discount = 0.1m;\n        var applyMarvelDiscount = ((Func<decimal, decimal,\
    \ decimal>)ApplyDiscount).Apply(discount);\n        var discountedPrice = applyMarvelDiscount(price);\n\
    \        Console.WriteLine($\"The discounted price is {discountedPrice}\");\n\
    \    }\n}\n```\n\n在这个示例中，我们使用 `Apply()` 扩展方法固定了 `ApplyDiscount()` 函数中的折扣参数，创建一个对任何价格应用\
    \ 10% 折扣的专门函数。\n\n柯里化和部分应用是函数式编程中的黄金组合，允许你将复杂的函数分解为更简单、可重用的组件。通过掌握这些技术，你可以创造出和谐的代码并构建更健壮、更易维护的应用程序。\n\
    \n在下一节中，我们将探索另一种强大的函数式编程技术：惰性求值（Lazy Evaluation）。\n\n## 5.3. 惰性求值：拖延的艺术\n\n在函数式编程的世界里，惰性求值就像一种爱好，类似于追剧你最喜欢的《星际迷航》。正正如你可能会为了看剧而推迟家务一样，惰性求值推迟计算的执行，直到真正需要其结果。\n\
    \n### 5.3.1. 使用 Lazy 类\n\n`Lazy` 类允许你在第一次访问对象时才延迟初始化它。这在创建昂贵的资源（如大型数据结构或网络连接）时特别有用。\n"
- fmt: "\nConsider a scenario where we have a class `ComicBookLibrary`, which loads\
    \ a large list of comic books from an external source:\n\n```csharp\nusing System;\n\
    using System.Collections.Generic;\n\nclass ComicBook\n{\n    public string Title\
    \ { get; set; }\n    public int IssueNumber { get; set; }\n}\n\nclass ComicBookLibrary\n\
    {\n    private List<ComicBook> _comicBooks;\n\n    public ComicBookLibrary()\n\
    \    {\n        _comicBooks = LoadComicBooks();\n    }\n\n    private List<ComicBook>\
    \ LoadComicBooks()\n    {\n        // Expensive operation to load comic books\
    \ from an external source\n        Console.WriteLine(\"Loading comic books...\"\
    );\n        return new List<ComicBook> { new ComicBook { Title = \"Spider-Man\"\
    , IssueNumber = 1 } };\n    }\n\n    public List<ComicBook> GetComicBooks()\n\
    \    {\n        return _comicBooks;\n    }\n}\n```\n\nIn this example, the `LoadComicBooks()`\
    \ method is called during the object’s construction, which could lead to performance\
    \ issues if the operation is expensive. We can use the `Lazy` class to defer the\
    \ loading of comic books until they’re actually needed:\n\n```csharp\nusing System;\n\
    using System.Collections.Generic;\n\nclass ComicBook\n{\n    public string Title\
    \ { get; set; }\n    public int IssueNumber { get; set; }\n}\n\nclass ComicBookLibrary\n\
    {\n    private Lazy<List<ComicBook>> _lazyComicBooks;\n\n    public ComicBookLibrary()\n\
    \    {\n        _lazyComicBooks = new Lazy<List<ComicBook>>(LoadComicBooks);\n\
    \    }\n\n    private List<ComicBook> LoadComicBooks()\n    {\n        // Expensive\
    \ operation to load comic books from an external source\n        Console.WriteLine(\"\
    Loading comic books...\");\n        return new List<ComicBook> { new ComicBook\
    \ { Title = \"Spider-Man\", IssueNumber = 1 } };\n    }\n\n    public List<ComicBook>\
    \ GetComicBooks()\n    {\n        return _lazyComicBooks.Value;\n    }\n}\n```\n\
    \nNow, the `LoadComicBooks()` method is only called when the `GetComicBooks()`\
    \ method is executed for the first time, reducing the overhead during object construction.\n\
    \n### 5.3.2 Lazy Sequences with LINQ\n\nLINQ (Language Integrated Query) is a\
    \ powerful querying library in C# that supports Lazy Evaluation through deferred\
    \ execution. When you chain together a sequence of LINQ operations, the actual\
    \ execution is postponed until the result is enumerated.\n\nLet’s create a list\
    \ of integers and filter out the even numbers using LINQ:\n\n```csharp\nusing\
    \ System;\nusing System.Linq;\nusing System.Collections.Generic;\n\nclass Program\n\
    {\n    static void Main()\n    {\n        List<int> numbers = Enumerable.Range(1,\
    \ 100).ToList();\n        Console.WriteLine(\"Creating filtered sequence...\"\
    );\n        var evenNumbers = numbers.Where(n => n % 2 == 0);\n        Console.WriteLine(\"\
    Enumerating filtered sequence...\");\n        foreach (var number in evenNumbers)\n\
    \        {\n            Console.WriteLine(number);\n        }\n    }\n}\n```\n\
    \nIn this example, the `Where()` method is a LINQ operation that creates a new\
    \ sequence of even numbers. However, the actual filtering isn’t executed until\
    \ the `foreach` loop enumerates the `evenNumbers` sequence. This is an example\
    \ of Lazy Evaluation through deferred execution.\n\nNow, let’s take it a step\
    \ further and combine Lazy Evaluation with the `yield` keyword to create an infinite\
    \ sequence:\n\n```csharp\nusing System;\nusing System.Linq;\nusing System.Collections.Generic;\n\
    \nclass Program\n{\n    static IEnumerable<int> GenerateFibonacciSequence()\n\
    \    {\n        int previous = -1;\n        int current = 1;\n        while (true)\n\
    \        {\n            int next = previous + current;\n            previous =\
    \ current;\n            current = next;\n            yield return next;\n    \
    \    }\n    }\n    static void Main()\n    {\n        Console.WriteLine(\"Creating\
    \ Fibonacci sequence...\");\n        var fibonacciSequence = GenerateFibonacciSequence();\n\
    \        Console.WriteLine(\"Enumerating Fibonacci sequence...\");\n        foreach\
    \ (var number in fibonacciSequence.Take(10))\n        {\n            Console.WriteLine(number);\n\
    \        }\n    }\n}\n```\n\nIn this example, we used the `yield` keyword to create\
    \ an infinite sequence. Due to Lazy Evaluation, only the first 10 numbers are\
    \ generated when we enumerate the sequence using the `Take()` method.\n\nLazy\
    \ Evaluation is like the art of procrastination, delaying computations until they’re\
    \ absolutely necessary. By embracing this functional programming technique, you\
    \ can optimize your C# code for performance and memory, much like binge-watching\
    \ your favorite episodes allows you to maximize your leisure. In the next section,\
    \ we’ll go where no developer has before and explore the realm of Monads. Get\
    \ ready to unlock the secrets of these enigmatic entities and apply their power\
    \ in your functional programming!\n\n## 5.4 Memoization: The Art of Remembering\n\
    \nMemoization is like having an eidetic memory, like Sheldon Cooper from The Bang\
    \ Theory. In functional programming, Memoization allows you to remember and store\
    \ the results of expensive function calls, so you don’t have to recalculate them\
    \ if the same inputs are provided.\n\nMemoization can significantly improve the\
    \ performance of recursive functions or computations with overlapping subproblems.\
    \ In C#, you can implement Memoization using dictionaries, caches, or even decorators.\
    \ Let’s explore some examples to better understand Memoization in action.\n\n\
    ### 5.4.1 Memoizing Recursive Functions\n\nConsider the classic example of computing\
    \ Fibonacci numbers using a naive recursive implementation:\n\n```csharp\nusing\
    \ System;\nclass Program\n{\n    static int Fibonacci(int n)\n    {\n        if\
    \ (n <= 1) return n;\n        return Fibonacci(n - 1) + Fibonacci(n - 2);\n  \
    \  }\n    static void Main()\n    {\n        Console.WriteLine($\"The 30th Fibonacci\
    \ number is {Fibonacci(30)}\");\n    }\n}\n```\n\nThe problem with this implementation\
    \ is that it recalculates the same Fibonacci numbers multiple times, leading to\
    \ an exponential runtime. We can optimize this code by memoizing the results of\
    \ previous computations:\n\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
    class Program\n{\n    static Dictionary<int, int> _memo = new Dictionary<int,\
    \ int>();\n    static int Fibonacci(int n)\n    {\n        if (n <= 1) return\
    \ n;\n        if (!memo.ContainsKey(n))\n        {\n            _memo[n] = Fibonacci(n\
    \ - 1) + Fibonacci(n - 2);\n        }\n        return _memo[n];\n    }\n    static\
    \ void Main()\n    {\n        Console.WriteLine($\"The 30th Fibonacci number is\
    \ {Fibonacci(30)}\");\n    }\n}\n```\n\nIn this example, we used a dictionary\
    \ to store the results of previous Fibonacci calculations. When a Fibonacci number\
    \ is requested, we first check if it’s already in the dictionary. If it is, we\
    \ return the memoized value, avoiding the need for redundant calculations.\n\n\
    ### 5.4.2 Creating a Memoization Decorator\n\nA more reusable approach to Memoization\
    \ is to create a custom decorator that can memoize any function. Let’s implement\
    \ a generic `Memoize` extension method:\n\n```csharp\npublic static class MemoizeExtensions\n\
    {\n    public static Func<T, TResult> Memoize<T, TResult>(this Func<T, TResult>\
    \ func)\n    {\n        var memo = new Dictionary<T, TResult>();\n        return\
    \ arg =>\n        {\n            if (!memo.ContainsKey(arg))\n            {\n\
    \                memo[arg] = func(arg);\n            }\n            return memo[arg];\n\
    \        };\n    }\n}\n```\n\nNow, we can use this decorator to memoize any function.\
    \ Let’s use it to memoize our original Fibonacci function:\n\n```csharp\nusing\
    \ System;\nusing MemoizeLibrary;\nclass Program\n{\n    static int Fibonacci(int\
    \ n)\n    {\n        if (n <= 1) return n;\n        return MemoizedFibonacci(n\
    \ - 1) + MemoizedFibonacci(n - 2);\n    }\n    static Func<int, int> MemoizedFibonacci\
    \ = ((Func<int, int>)Fibonacci).Memoize();\n    static void Main()\n    {\n  \
    \      Console.WriteLine($\"The 30th Fibonacci number is {MemoizedFibonacci(30)}\"\
    );\n    }\n}\n```\n\nIn this example, we used the `Memoize` extension method to\
    \ create a memoized version of the Fibonacci function. This approach is more reusable,\
    \ as it can be applied to any function with a single input and output.\n"
