    \ of tuples and deconstruction made it easier to work with multiple return values,\
    \ a common pattern in functional programming.\n\n// Example of pattern matching\n\
    \npublic  string  DescribeShape(object shape)\n\n{\n\n    return shape switch\n\
    \n    {\n\nCircle c => $\"A circle with a radius of {c.Radius}\",\n\nRectangle\
    \ r => $\"A rectangle with a width of {r.Width} and a height of {r.Height}\",\n\
    \n_ =>  \"An unknown shape\"\n\n    };\n\n}\n\nC# 8.0 - 9.0: With nullable reference\
    \ types, C# moved closer to functional programming by encouraging the use of explicit\
    \ nullability, which promotes safer code. Other functional enhancements include\
    \ switch expressions, records, and init-only properties.\n\n// Example of records\n\
    \npublic record Point(int X,  int Y);\n\n## 2.2\\. The C# Functional Ecosystem\n\
    \nC#’s growing support for functional programming has led to the development of\
    \ a rich ecosystem of libraries and tools that further enhance its functional\
    \ capabilities. Some popular libraries and frameworks include:\n\nF# Core Library:\
    \ F# is a functional-first programming language that runs on the .NET platform.\
    \ Its core library offers many functional programming constructs that can be used\
    \ in C# as well. LanguageExt: LanguageExt is a library that provides a comprehensive\
    \ set of functional extensions for C#, including options, immutable collections,\
    \ and monads like Either and Try.\n\nImmutable Collections: The System.Collections.Immutable\
    \ namespace offers a set of immutable collection types, which are ideal for functional\
