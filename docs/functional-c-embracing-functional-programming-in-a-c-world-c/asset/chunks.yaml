    \n让我们来探索一个示例，展示在多线程环境中使用不可变数据结构带来的线程安全益处。\n\n假设我们有一个在多个线程之间共享的 `List`。如果一个线程正在向列表添加元素，而另一个线程正在从其读取，你可能会遇到同步问题，导致意外之外的行为甚至抛出异常。\n\
    \n### 使用面向对象的方法（非线程安全）：\n\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
    using System.Threading.Tasks;\n\nclass UnsafeCounter\n{\n    private List<int>\
    \ _numbers = new List<int>();\n\n    public void AddNumber(int number)\n    {\n\
