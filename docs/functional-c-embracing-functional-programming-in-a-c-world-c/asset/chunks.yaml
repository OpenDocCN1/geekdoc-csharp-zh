    \ => x % 2 == 0);\nevenNumbers.Subscribe(x => Console.WriteLine($\"Even number:\
    \ {x}\"));\n```\n\n## 2.3. 混合编程：在 C 中结合 OO 和 FP\n\nC# 作为混合编程语言的通用性允许开发者根据手头的问题结合面向对象（OO）和函数式编程（FP）范式。这可以产生更具表现力、可维护且健壮的代码。\n\
    \n### 在 C# 中结合 OO 和 FP 时，请考虑以下指南：\n\n- **拥抱不可变性**: 尽可能让你的类及其属性变为不可变。这有助于减少副作用，并让你的代码更具预测性。\n\
    \n```csharp\npublic class Customer\n{\n    public Customer(int id, string name)\n\
    \    {\n        Id = id;\n        Name = name;\n    }\n    public int Id { get;\
    \ }\n    public string Name { get; }\n}\n```\n\n- **使用纯函数**: 优先使用没有副作用且完全依赖于输入参数的方法。这使得你的代码更容易进行推理和测试。\n\
    \n```csharp\npublic int Add(int x, int y) => x + y;\n```\n\n- **利用高阶函数**: 使用 LINQ\
    \ 中的 `Select`、`Where` 和 `Aggregate` 等高阶函数以更具函数式且具表现力的方式操作数据。\n\n```csharp\nvar\
    \ totalLength = words.Where(word => !string.IsNullOrEmpty(word))\n           \
    \           .Select(word => word.Length)\n                      .Aggregate((sum,\
    \ length) => sum + length);\n```\n\n- **考虑函数式构造**: 使用来自 `LanguageExt` 等库的 `Option`、`Either`\
    \ 和 `Try` 等函数式构造来以更函数式的方式建模你的代码，并更好地处理失败和边缘情况。\n\n- **利用模式匹配**: 使用模式匹配以更简洁、更易读的方式处理复杂的条件逻辑。\n\
    \n通过在 C# 中混合面向对象和函数式编程方法，你可以利用这两种范式的优点来编写出更具表现力、可维护且健壮的代码。当你深入探索 C# 的函数式编程世界时，你可能会发现自己在说像这样的笑话：“为什么函数式程序员被赶出学校？因为他们拒绝上课！”\
    \ 抛开笑话不谈，我们希望这一章为你探索 C# 为函数式编程提供的精彩可能性奠定了坚实的基础。\n\n# 第 3 章：C 中的函数式构建模块\n\n欢迎回来，编码伙伴们！你准备好深入挖掘\
    \ C# 中的函数式编程了吗？你运气不错了，因为在这一章中，我们将探索让函数式编程如此酷炫的本质构建模块。我们将涵盖纯函数、不可变性、高阶函数、Lambda\
    \ 表达式和闭包，同时保持轻松有趣的氛围。所以，拿上零食，放上你最喜欢的音乐，让我们开始吧！\n\n## 3.1. 纯函数与不可变性 - 黄金双星\n\n\
    让我们潜入纯函数和不可变性的迷人世界。\n\n### 纯函数：\n\n记住，纯函数是一个对于相同的输入总是产生相同输出且没有副作用的函数。副作用包括修改函数外部的变量、与外部系统交互（如\
    \ I/O），或仅仅是打印某些内容。纯函数就像教室里表现良好的学生，从不制造麻烦。\n\n### 纯函数的优点：\n\n- **易推理**: 由于它们只依赖于输入并总是产生相同的输出，你可以轻松预测纯函数的行为。\n\
    - **易测试**: 没有依赖项或副作用，测试纯函数轻而易举。\n- **可缓存**: 由于它们对于相同的输入返回相同的输出，你可以缓存纯函数的结果，让你的代码更高效。\n\
    \n### 纯函数示例：\n\n```csharp\n// 字符串长度\nint Length(string str)\n{\n    return str.Length;\n\
    }\n\n// 检查数字是否为偶数\nbool IsEven(int number)\n{\n    return number % 2 == 0;\n}\n\
    \n// 拼接两个字符串\nstring Concat(string a, string b)\n{\n    return a + b;\n}\n```\n\
    \n### 不可变性：\n\n不可变性是关于保持数据不变。在函数式编程中，我们倾向于使用不可变数据结构，这使得我们的代码更具预测性且不易出错。不可变性就像一个维护良好的花园，一切都保持原位，你不必担心弄乱它。\n\
    \n### 不可变性的优点：\n\n- **简化代码**: 不可变数据结构减少了易出错的防御性复制的需求，并更容易理解数据状态。\n- **增强线程安全**:\
    \ 由于不可变数据结构一旦创建就无法更改，你不必担心多线程代码中的同步问题。\n- **鼓励函数式编程**: 不可变性与纯函数等函数式编程概念密不可分，促进了更简洁、更易维护的编码风格。\n\
    \n### 不可变性示例：\n\n使用只读字段：\n\n```csharp\npublic class ImmutablePerson\n{\n    public\
    \ readonly string Name;\n    public readonly int Age;\n\n    public ImmutablePerson(string\
    \ name, int age)\n    {\n        Name = name;\n        Age = age;\n    }\n}\n\
    ```\n\n使用不可变集合：\n\n```csharp\nusing System.Collections.Immutable;\n\nvar immutableList\
    \ = ImmutableList.Create(1, 2, 3);\nvar newList = immutableList.Add(4); // 创建一个包含\
    \ 4 的新列表，不修改原始列表\n```\n\n结合纯函数与不可变性：\n\n```csharp\npublic class ImmutableCircle\n\
    {\n```\n\n"
- fmt: "\n```csharp\npublic double Radius { get; }\n\npublic ImmutableCircle(double\
    \ radius)\n    {\n        Radius = radius;\n    }\n\npublic double GetArea()\n\
    \    {\n        return Math.PI * Math.Pow(Radius, 2);\n    }\n\npublic ImmutableCircle\
    \ WithRadius(double newRadius)\n    {\n        return new ImmutableCircle(newRadius);\n\
    \    }\n}\n```\n\n`var circle = new ImmutableCircle(5);`\n\n`var area = circle.GetArea();\
    \ // Calculates the area using the pure function GetArea\n\n`var biggerCircle\
    \ = circle.WithRadius(10); // Creates a new circle with a different radius, without\
    \ modifying the original circle\n\nLet’s explore an example that demonstrates\
    \ the thread-safety benefits of using immutable data structures in a multithreaded\
    \ environment.\n\nImagine we have a `List` shared between multiple threads. If\
    \ one thread is adding elements to the list while another is reading from it,\
    \ you may encounter synchronization issues, resulting in unexpected behavior or\
    \ even exceptions.\n\n### Using an object-oriented approach (not thread-safe):\n\
    \n```csharp\nusing System;\nusing System.Collections.Generic;\nusing System.Threading.Tasks;\n\
    \nclass UnsafeCounter\n{\n    private List<int> _numbers = new List<int>();\n\n\
    \    public void AddNumber(int number)\n    {\n        _numbers.Add(number);\n\
    \    }\n\n    public int GetSum()\n    {\n        return _numbers.Sum();\n   \
    \ }\n}\n\nclass Program\n{\n    static async Task Main()\n    {\n        var unsafeCounter\
    \ = new UnsafeCounter();\n        var addTask = Task.Run(() =>\n        {\n  \
    \          for (int i = 0; i < 1000; i++)\n            {\n                unsafeCounter.AddNumber(i);\n\
    \            }\n        });\n        var sumTask = Task.Run(() =>\n        {\n\
    \            int sum = unsafeCounter.GetSum();\n            Console.WriteLine($\"\
    Sum: {sum}\");\n        });\n        await Task.WhenAll(addTask, sumTask);\n \
    \   }\n}\n```\n\nThis example has a race condition because `AddNumber` and `GetSum`\
    \ can be executed concurrently, leading to unpredictable results. To fix this\
    \ issue, we can use an immutable data structure, such as `ImmutableList`, which\
    \ is provided by the `System.Collections.Immutable` namespace.\n\n### Using a\
    \ functional approach (thread-safe):\n\n```csharp\nusing System;\nusing System.Collections.Immutable;\n\
    using System.Linq;\nusing System.Threading.Tasks;\n\nclass SafeCounter\n{\n  \
    \  private ImmutableList<int> _numbers = ImmutableList<int>.Empty;\n\n    public\
    \ void AddNumber(int number)\n    {\n        _numbers = _numbers.Add(number);\n\
    \    }\n\n    public int GetSum()\n    {\n        return _numbers.Sum();\n   \
    \ }\n}\n\nclass Program\n{\n    static async Task Main()\n    {\n        var safeCounter\
    \ = new SafeCounter();\n        var addTask = Task.Run(() =>\n        {\n    \
    \        for (int i = 0; i < 1000; i++)\n            {\n                safeCounter.AddNumber(i);\n\
    \            }\n        });\n        var sumTask = Task.Run(() =>\n        {\n\
    \            int sum = safeCounter.GetSum();\n            Console.WriteLine($\"\
    Sum: {sum}\");\n        });\n        await Task.WhenAll(addTask, sumTask);\n \
    \   }\n}\n```\n\nIn this version, we’ve replaced `List` with `ImmutableList`.\
    \ When we call `AddNumber`, a new list is created and the `_numbers` reference\
    \ is updated atomically. This ensures that `GetSum` will always work on a consistent\
    \ state without needing synchronization mechanisms. This example demonstrates\
    \ how immutable data structures in functional programming can help avoid synchronization\
    \ issues in multithreaded code making it safer and easier to reason about.\n\n\
    As we reach the end of Section 3, you’ve now been introduced to some functional\
    \ building blocks. We’ve explored the powerful duo of pure functions and immutability,\
    \ the magical world of higher-order functions, and lambda expressions. By understanding\
