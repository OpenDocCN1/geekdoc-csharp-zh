  trans: "\n```csharp\nusing System.Threading.Tasks;\n\nclass Program\n{\n    static\
    \ async Task Main()\n    {\n        string origin = \"San Francisco\";\n     \
    \   string destination = \"Los Angeles\";\n        var airline1FlightsTask = origin.GetFlightsFromAirline1Async();\n\
    \        var airline2FlightsTask = origin.GetFlightsFromAirline2Async();\n   \
    \     var airline1Flights = await airline1FlightsTask;\n        var airline2Flights\
    \ = await airline2FlightsTask;\n        var bestFares = from airline1Flight in\
    \ airline1Flights.AsParallel()\n        from airline2Flight in airline2Flights.AsParallel()\n\
    \        where airline1Flight.Destination == destination && airline2Flight.Destination\
    \ == destination\n        let minFare = Math.Min(airline1Flight.Fare, airline2Flight.Fare)\n\
    \        orderby minFare\n        select new { Airline = (airline1Flight.Fare\
    \ <= airline2Flight.Fare) ? airline1Flight.Airline : airline2Flight.Airline, Fare\
    \ = minFare };\n        Console.WriteLine($\"Best flight fares from {origin} to\
    \ {destination}:\");\n        foreach (var fare in bestFares)\n        {\n   \
    \         Console.WriteLine($\"Airline:{fare.Airline}, Fare: ${fare.Fare}\");\n\
    \        }\n    }\n}\n```\n\n在这个更新后的示例中，我们把扩展方法改为了异步，并使用了 `Task.Run()` 来模拟 API\
    \ 调用。在 `Main()` 方法中，我们调用了这些异步方法，并使用 `AsParallel()` 来并行执行我们的 LINQ 查询。这种方法在处理大型数据集或复杂操作时，有助于提高性能。\n\
    \n## 6.3 常用 LINQ 操作符\n\n在本节中，我们将探索一些你在 C# 函数式编程之旅中经常用到的常用 LINQ 操作符。这些操作符可以分为过滤、投影、聚合和排序操作。\n\
    \n### 过滤操作符（Filtering Operators）\n这些操作符帮助根据特定条件过滤数据。常用的过滤操作符有：\n\n- **Where**:\
    \ 根据给定的谓词过滤元素序列。\n  ```csharp\n  IEnumerable<int> numbers = new[] { 1, 2, 3, 4,\
    \ 5, 6 };\n  IEnumerable<int> evenNumbers = numbers.Where(n => n % 2 == 0);\n\
    \  ```\n- **OfType**: 根据元素的运行时类型过滤元素序列。\n  ```csharp\n  IEnumerable<object> objects\
    \ = new[] { \"string\", 42, 3.14 };\n  IEnumerable<int> integers = objects.OfType<int>();\n\
    \  ```\n\n### 投影操作符（Projection Operators）\n这些操作符帮助你转换元素序列。常用的投影操作符有：\n\n- **Select**:\
    \ 将序列中的每个元素投影到新的形式。\n  ```csharp\n  IEnumerable<int> numbers = new[] { 1, 2, 3,\
    \ 4, 5 };\n  IEnumerable<int> squaredNumbers = numbers.Select(n => n * n);\n \
    \ ```\n- **SelectMany**: 将序列中的每个元素投影为一个 `IEnumerable`，并将产生的序列平化为单一序列。\n  ```csharp\n\
    \  IEnumerable<string> words = new[] { \"Hello\", \"World\" };\n  IEnumerable<char>\
    \ characters = words.SelectMany(w => w);\n  ```\n\n### 聚合操作符（Aggregation Operators）\n\
    这些操作符帮助你从元素序列中计算单个值。常用的聚合操作符有：\n\n- **Count**: 返回序列中的元素数量。\n  ```csharp\n  IEnumerable<int>\
    \ numbers = new[] { 1, 2, 3, 4, 5 };\n  int count = numbers.Count();\n  ```\n\
    - **Sum**: 计算数值序列之和。\n  ```csharp\n  IEnumerable<int> numbers = new[] { 1, 2,\
    \ 3, 4, 5 };\n  int sum = numbers.Sum();\n  ```\n- **Average**: 计算数值序列的平均值。\n\
    \  ```csharp\n  IEnumerable<int> numbers = new[] { 1, 2, 3, 4, 5 };\n  double\
    \ average = numbers.Average();\n  ```\n- **Min and Max**: 分别返回序列中的最小值和最大值。\n \
    \ ```csharp\n  IEnumerable<int> numbers = new[] { 1, 2, 3, 4, 5 };\n  int minValue\
    \ = numbers.Min();\n  int maxValue = numbers.Max();\n  ```\n\n### 排序操作符（Ordering\
    \ Operators）\n这些操作符帮助你对元素序列。常用的排序操作符有：\n\n- **OrderBy and OrderByDescending**:\
    \ 根据键对序列元素进行升序或降序排序。\n  ```csharp\n  IEnumerable<int> numbers = new[] { 5, 3,\
    \ 1, 4, 2 };\n  IEnumerable<int> ascending = numbers.OrderBy(n => n);\n  IEnumerable<int>\
    \ descending = numbers.OrderByDescending(n => n);\n  ```\n- **ThenBy and ThenByDescending**:\
    \ 根据键对序列中的元素进行后续的升序或降序排序。它通常在 `OrderBy` 或 `OrderByDescending` 之后使用。\n  ```csharp\n\
    \  IEnumerable<string> words = new[] { \"apple\", \"orange\", \"kiwi\" };\n  IEnumerable<string>\
    \ sortedWords = words.OrderBy(w => w.Length).ThenBy(w => w);\n  ```\n\n### 集合操作符（Set\
    \ Operators）\n这些操作符帮助对序列执行集合操作。常用的集合操作符有：\n\n- **Distinct**: 移除序列中的重复元素。\n  ```csharp\n\
    \  IEnumerable<int> numbers = new[] { 1, 2, 2, 3, 4, 4, 5 };\n  IEnumerable<int>\
    \ distinctNumbers = numbers.Distinct();\n  ```\n- **Union**: 返回两个序列的并集。\n  ```csharp\n\
    \  IEnumerable<int> set1 = new[] { 1, 2, 3 };\n  IEnumerable<int> set2 = new[]\
    \ { 3, 4, 5 };\n  IEnumerable<int> union = set1.Union(set2);\n  ```\n- **Intersect**:\
    \ 返回两个序列的交集。\n  ```csharp\n  IEnumerable<int> set1 = new[] { 1, 2, 3 };\n  IEnumerable<int>\
    \ set2 = new[] { 3, 4, 5 };\n  IEnumerable<int> intersection = set1.Intersect(set2);\n\
    \  ```\n- **Except**: 返回两个序列的差集。\n  ```csharp\n  IEnumerable<int> set1 = new[]\
    \ { 1, 2, 3 };\n  IEnumerable<int> set2 = new[] { 3, 4, 5 };\n  IEnumerable<int>\
    \ difference = set1.Except(set2);\n  ```\n\n### 分组操作符（Grouping Operators）\n这些操作符帮助你根据指定的键对元素进行分组。常用的分组操作符有：\n\
    \n- **GroupBy**: 根据键选择器函数对元素进行分组。\n  ```csharp\n  IEnumerable<int> numbers = new[]\
    \ { 1, 2, 3, 4, 5, 6 };\n  IEnumerable<IGrouping<int, int>> groupedNumbers = numbers.GroupBy(n\
    \ => n % 2);\n  ```\n\n通过精通这些 LINQ 操作符，你可以利用 C# 函数式编程的真正威力。有了它们的帮助，你可以构建高效且易于理解的代码来处理最具挑战性的任务。\n\
    \n# 第 7 章：错误处理与函数编程\n\n在本章中，我们将探索如何在 C# 函数式编程中处理错误。我们将从讨论 C# 的传统错误处理方法，转向使用 `Result`\
    \ 和 `Either` 类型更具函数的替代方案。最后，我们将引入轨道式编程。\n\n## 7.1 C# 中的传统错误处理：异常\n\n在 C# 中，处理错误的常用方法是使用异常。异常是表示程序执行期间发生错误或异常情况的对象。当发生错误时，会抛出异常并中断程序的正常流程。为了处理异常，你可以使用\
    \ `try-catch` 块，它允许你定义发生异常时执行的代码块。\n\n这是一个使用异常进行错误处理的函数示例：\n\n```csharp\nint Divide(int\
    \ numerator, int denominator)\n{\n    if (denominator == 0)\n    {\n        throw\
    \ new DivideByZeroException(\"不能除以零。\");\n    }\n    return numerator / denominator;\n\
    }\n```\n\n虽然异常在 C# 中广泛广泛，但在函数式编程方面有一些缺点：\n\n- 异常破坏了函数的引用透明性，使得代码推理变得困难。\n- 抛出和捕获异常会对性能产生负面影响。\n"
