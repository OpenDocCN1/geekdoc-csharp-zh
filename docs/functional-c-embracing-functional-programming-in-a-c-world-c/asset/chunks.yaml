    \ `Result` 和 `Either`。这些类型可以在 C# 中用于提供一种更具函数式的错误处理方式。\n\n`Either` 类型是 `Result`\
    \ 的更通用的版本。它可以表示两种可能的类型之一，通常用于表示成功结果或错误。在本节中，我们将使用 `Language-Ext` 库来演示如何使用 `Either`\
    \ 类型处理错误。我们将在第 10 章中详细讨论 `Language-Ext` 库。\n\n要安装 `Language-Ext`，请向你的项目添加 NuGet\
    \ 包：\n\n```\nInstall-Package LanguageExt.Core\n```\n\n假设我们有一个“贷款申请”场景，我们需要从 `MongoDB`\
    \ 数据库中获取申请人的数据。使用 `Language-Ext` 的 `Either` 类型，我们可以定义一个返回成功结果（申请人数据）或错误的函数。\n\n\
    首先，让我们定义一个 `Applicant` 类：\n\n```csharp\npublic class Applicant\n{\n    public\
