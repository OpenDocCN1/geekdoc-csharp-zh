    \ Main()\n    {\n        var unsafeCounter = new UnsafeCounter();\n        var\
    \ addTask = Task.Run(() =>\n        {\n            for (int i = 0; i < 1000; i++)\n\
    \            {\n                unsafeCounter.AddNumber(i);\n            }\n \
    \       });\n        var sumTask = Task.Run(() =>\n        {\n            int\
    \ sum = unsafeCounter.GetSum();\n            Console.WriteLine($\"Sum: {sum}\"\
    );\n        });\n        await Task.WhenAll(addTask, sumTask);\n    }\n}\n```\n\
    \n这个示例存在竞态条件，因为 `AddNumber` 和 `GetSum` 可以并发执行，导致不可预测的结果。要修复这个问题，我们可以使用不可变数据结构，例如由\
    \ `System.Collections.Immutable` 命名空间提供的 `ImmutableList`。\n\n### 使用函数式方法（线程安全）：\n\
    \n```csharp\nusing System;\nusing System.Collections.Immutable;\nusing System.Linq;\n\
