    # Chapter 5: Currying and Partial Application: The Art of Splitting Functions


    Currying and Partial Application are like remixing your favorite rock tunes. You
    take an original track, split it into smaller pieces, and rearrange them to create
    something fresh and exciting. In functional programming, these techniques enable
    you to break down complex functions into simpler ones and reuse code more effectively.


    Currying is the process of transforming a function that takes multiple arguments
    into a series of functions that each take a single argument. This technique can
    make your code more flexible and easier to compose.


    Let’s start with a simple example. We’ll create a function that calculates the
    total price of a product after applying a discount and adding tax. Here’s the
    original, non-curried version:


    using System;


    class Program


    {


        static  decimal  CalculateTotalPrice(decimal price,  decimal discount,  decimal
    tax)


        {


            decimal discountedPrice = price *  (1  - discount);


            return discountedPrice *  (1  + tax);


        }


    static  void  Main()


        {


            decimal price =  100;


            decimal discount =  0.1m;


            decimal tax =  0.2m;


    Console.WriteLine($"The total price is {CalculateTotalPrice(price, discount, tax)}");


        }


    }


    Now, let’s curry the CalculateTotalPrice() function:


    using System;


    class Program


    {


        static Func<decimal, Func<decimal, Func<decimal,  decimal>>> CurriedCalculateTotalPrice
    =>


    price => discount => tax => price *  (1  - discount)  *  (1  + tax);


    static  void  Main()


        {


            decimal price =  100;


            decimal discount =  0.1m;


            decimal tax =  0.2m;


    var applyPrice =  CurriedCalculateTotalPrice(price);


            var applyDiscount =  applyPrice(discount);


            var calculateTotal =  applyDiscount(tax);


    Console.WriteLine($"The total price is {calculateTotal}");


        }


    }


    In this example, we transformed the CalculateTotalPrice() function into a series
    of functions using the currying technique. Each function takes a single argument
    and returns another function, eventually calculating the total price.


    Partial Application is a technique that involves fixing a number of arguments
    in a function, generating a new function with fewer arguments. This allows you
    to create reusable and more specialized functions.


    Let’s create a library that provides a nice way to use currying with extension
    methods. We’ll also implement a generic currying method:


    public  static  class CurryExtensions


    {


        public  static Func<T2, Func<T3, TResult>> Curry<T1, T2, T3, TResult>(this
    Func<T1, T2, T3, TResult> func, T1 arg1)


        {


            return arg2 => arg3 =>  func(arg1, arg2, arg3);


        }


    }


    Now, let’s use this extension method to curry the CalculateTotalPrice() function:


    using System;


    using CurryLibrary;


    class Program


    {


        static  decimal  CalculateTotalPrice(decimal price,  decimal discount,  decimal
    tax)


        {


            decimal discountedPrice = price *  (1  - discount);


            return discountedPrice *  (1  + tax);


        }


    static  void  Main()


        {


            decimal price =  100;


            decimal discount =  0.1m;


            decimal tax =  0.2m;


    var curriedCalculateTotalPrice =  ((Func<decimal,  decimal,  decimal,  decimal>)CalculateTotalPrice).Curry(price);


            var applyDiscount =  curriedCalculateTotalPrice(discount);


            var calculateTotal =  applyDiscount(tax);


    Console.WriteLine($"The total price is {calculateTotal}");


        }


    }


    In this example, we used the Curry() extension method to curry the CalculateTotalPrice()
    function. The advantage of this approach is that you can curry any function with
    three arguments without having to change its implementation.


    Now, let’s explore a use case for Partial Application. Imagine you have a comic
    book store, and you want to apply a 10% discount to all Marvel comics. You can
    use Partial Application to create a specialized function that applies this discount:


    public  static  class PartialApplicationExtensions


    {


        public  static Func<T2, TResult> Apply<T1, T2, TResult>(this Func<T1, T2,
    TResult> func, T1 arg1)


        {


            return arg2 =>  func(arg1, arg2);


        }


    }


    Using the Apply() extension method, we can create a specialized function that
    applies a 10% discount:


    using System;


    using CurryLibrary;


    class Program


    {


        static  decimal  ApplyDiscount(decimal discount,  decimal price)


        {


            return price *  (1  - discount);


        }


    static  void  Main()


        {


            decimal price =  100;


            decimal discount =  0.1m;


    var applyMarvelDiscount =  ((Func<decimal,  decimal,  decimal>)ApplyDiscount).Apply(discount);


            var discountedPrice =  applyMarvelDiscount(price);


    Console.WriteLine($"The discounted price is {discountedPrice}");


        }


    }


    In this example, we used the Apply() extension method to fix the discount argument
    in the ApplyDiscount() function, creating a specialized function that applies
    a 10% discount to any price.


    Currying and Partial Application are like the dynamic duo of functional programming,
    allowing you to break down complex functions into simpler, reusable components.
    It’s similar to how the legendary partnership of Mick Jagger and Keith Richards
    in The Rolling Stones produced countless rock anthems. By mastering these techniques,
    you can create harmony in your code and build more robust, maintainable applications.


    In the next section, we’ll explore another powerful functional programming technique:
    Lazy Evaluation.


    ## 5.3\. Lazy Evaluation: The Art of Procrastination


    In the world of functional programming, Lazy Evaluation is like a favorite pastime,
    akin to binge-watching your favorite Star Trek series. Just as you might postpone
    chores to enjoy your favorite show, Lazy Evaluation defers the execution of a
    computation until its result is actually needed.


    Lazy Evaluation can improve performance by avoiding unnecessary calculations and
    reducing memory usage. In C#, you can achieve Lazy Evaluation using the Lazy class
    or by working with lazy sequences through LINQ’s deferred execution.


    Let’s dive into some examples to see Lazy Evaluation in action.


    ### 5.3.1\. Using the Lazy Class


    The Lazy class allows you to defer the initialization of an object until it’s
    accessed for the first time. This can be particularly useful when creating expensive
    resources, like large data structures or network connections.'
