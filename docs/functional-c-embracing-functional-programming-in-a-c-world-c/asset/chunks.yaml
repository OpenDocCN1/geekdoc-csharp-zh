  trans: "\n记忆化（Memoization）在函数编程世界中就像拥有过摄影般的记忆。通过记住昂贵计算的结果，你可以优化代码并消除冗余计算，就像 `Sheldon\
    \ Cooper` 卓越的记忆能力帮助他回想起海量信息一样。\n\n在本节中，我们已经探索了如何在 C# 中使用字典和自定义装饰器来实现记忆化。通过应用这些技术，你可以让你的代码获得显著的性能提升，特别是在处理递归函数或具有重叠子问题的计算时。\n\
    \n接下来，我们将探索 LINQ（语言集成查询）的迷人世界，它将函数编程的力量推向了 C# 的前沿。LINQ 允许你使用丰富的查询操作符编写极具表现力、可组合且可重用的代码。所以，拿起你最喜欢的漫画书或小说，准备好以\
    \ LINQ 为我们的指南，开启一场穿越 C# 函数编程宇宙的奇妙旅程吧！\n\n# 第 6 章：LINQ：C# 中函数编程的力量\n\n## 6.1 LINQ\
    \ 简介\n\n就像原力连接着整个《星球大战》宇宙一样，LINQ（语言集成查询）统一了 C# 的函数编程世界。LINQ 是一个强大的查询库，使你能够以更有表现力、可组合且灵活的方式处理数据。它提供了一系列丰富的查询操作符来过滤、投影和转换数据，将内存集合和外部数据源视为一等公民。\n\
    \nLINQ 的函数化性质鼓励声明式编程风格，这有助于你编写更简洁、更易维护的代码。LINQ 通过其不同的提供程序支持多种数据源，例如内存集合、XML 和数据库，分别对应\
    \ LINQ to Objects、LINQ to XML 和 LINQ to SQL。\n\n在本节中，我们将向你介绍 LINQ 的基础知识，并展示它在函数编程领域的力量。让我们开启这段激人的旅程，探索\
    \ LINQ 转换你 C# 代码的多种方式。\n\n### 6.1.1  LINQ 语法\n\nLINQ 提供了两种语法选项：查询语法（Query Syntax）和方法语法（Method\
    \ Syntax）。查询语法受 SQL 启发，为处理数据库的开发者提供了一种熟悉且更具读性的 LINQ 查询写法。方法语法则使用扩展方法和 Lambda 表达式来实现更符合函数编程的方法。\n\
    \n让我们来看两种语法风格的示例。假设我们有一个星球大战角色列表，并想筛选出职业为“绝地武士”（Jedi）的角色：\n\n```csharp\nusing\
    \ System;\nusing System.Linq;\nusing System.Collections.Generic;\n\nclass StarWarsCharacter\n\
    {\n    public string Name { get; set; }\n    public string Profession { get; set;\
    \ }\n}\n\nclass Program\n{\n    static void Main()\n    {\n        List<StarWarsCharacter>\
    \ characters = new List<StarWarsCharacter>\n        {\n            new StarWarsCharacter\
    \ { Name = \"Luke Skywalker\", Profession = \"Jedi\" },\n            new StarWarsCharacter\
    \ { Name = \"Han Solo\", Profession = \"Smuggler\" },\n            new StarWarsCharacter\
    \ { Name = \"Obi-Wan Kenobi\", Profession = \"Jedi\" },\n            new StarWarsCharacter\
    \ { Name = \"Darth Vader\", Profession = \"Sith Lord\" }\n        };\n\n     \
    \   // 查询语法\n        var jediCharactersQuery = from character in characters\n\
    \                                  where character.Profession == \"Jedi\"\n  \
    \                                select character;\n\n        // 方法语法\n      \
    \  var jediCharactersMethod = characters.Where(c => c.Profession == \"Jedi\");\n\
    \n        Console.WriteLine(\"Jedi characters (Query syntax):\");\n        foreach\
    \ (var character in jediCharactersQuery)\n        {\n            Console.WriteLine(character.Name);\n\
    \        }\n\n        Console.WriteLine(\"\\nJedi characters (Method syntax):\"\
    );\n        foreach (var character in jediCharactersMethod)\n        {\n     \
    \       Console.WriteLine(character.Name);\n        }\n    }\n}\n```\n\n在这个示例中，我们同时使用了查询语法和方法语法来过滤角色列表。结果是相同的，但语法迎了不同的偏好。\n\
    \n## 6.2 查询语法 vs 方法语法\n\n在 LINQ 的世界中，表达查询有两种主要方式：查询语法和方法语法。两者各有优劣，理解它们的区别对于有效使用\
    \ LINQ 至关重要。在本节中，我们将对比查询语法和方法语法并提供示例。\n\n### 6.2.1 查询语法\n\n查询语法也称为查询表达式（Query\
    \ Expression），类似于 SQL，旨在为处理数据库的开发者提供更高的可读性。它使用了一组诸如 `from`、`where`、`select`、`orderby`\
    \ 和 `join` 等关键字。\n\n优点：\n- 对 SQL 开发者来说更易读且熟悉。\n- 简化复杂查询。\n\n缺点：\n- 限于 LINQ 操作符的子集。\n\
    -简单操作可能需要更多代码。\n\n示例：\n```csharp\nvar jediCharactersQuery = from character in\
    \ characters\n                          where character.Profession == \"Jedi\"\
    \n                          select character;\n```\n\n### 6.2.2 方法语法\n\n方法语法也称为流式语法（Fluent\
    \ Syntax），依赖扩展方法和 Lambda 表达式。它提供了一种更函数的方法，并提供了对全 LINQ 操作符的访问。\n\n优点：\n- 更灵活，因为它支持所有的\
    \ LINQ 操作符。\n- 鼓励函数风格。\n\n缺点：\n- 对开发者来说不够熟悉和易读。\n- 不支持透明标识符（transparent identifiers），在某些场景下可能需要额外的代码。\n\
    \n示例：\n```csharp\nvar jediCharactersMethod = characters.Where(c => c.Profession\
    \ == \"Jedi\");\n```\n\n让我们用一个更复杂的例子来对比查询语法和方法语法。假设我们要将作者列表与书籍列表连接，然后按作者对书籍分组：\n\
    \n```csharp\n// 查询语法\nvar booksByAuthorQuery = from author in authors\n      \
    \                  join book in books on author.Id equals book.Id\n          \
    \              group book by author.Name into bookGroup\n                    \
    \    select new { Author = bookGroup.Key, Books = bookGroup.ToList() };\n\n//\
    \ 方法语法\nvar booksByAuthorMethod = authors.Join(books, a => a.Id, b => b.AuthorId,\
    \ (a, b) => new { a.Name, Book = b })\n                                 .GroupBy(x\
    \ => x.Name, x => x.Book)\n                                 .Select(g => new {\
    \ Author = g.Key, Books = g.ToList() });\n```\n\n在这个示例中，对于复杂的查询，查询语法更易读且更容易理解，而方法语法虽然简洁，但对于不熟悉函数编程的开发者来说可能难以掌握。\n\
    \n## 6.2.3 使用自定义查询操作符扩展 LINQ\n\n"
- fmt: "\nWhile LINQ provides a comprehensive set of operators, you may sometimes\
    \ need custom operators tailored to your specific needs. By leveraging extension\
    \ methods, you can create custom query operators that can be used seamlessly with\
    \ both Query Syntax and Method Syntax. In this section, we’ll demonstrate how\
    \ to create a small library of custom LINQ operators.\n\n### 6.2.3.1 Custom Map\
    \ Operator\n\nLet’s create a custom `Map` operator, which behaves like `Select`.\
    \ We’ll start by defining an extension method on `IEnumerable`:\n\n```csharp\n\
    using System;\nusing System.Collections.Generic;\nusing System.Linq;\n\npublic\
    \ static class LinqExtensions\n{\n    public static IEnumerable<TResult> Map<TSource,\
    \ TResult>(this IEnumerable<TSource> source, Func<TSource, TResult> selector)\n\
    \    {\n        return source.Select(selector);\n    }\n}\n```\n\nNow we can use\
    \ our custom `Map` operator with Method Syntax:\n\n```csharp\nvar numbers = new\
    \ List<int> { 1, 2, 3, 4, 5 };\nvar squaredNumbers = numbers.Map(x => x * x);\n\
    ```\n\nTo use our custom `Map` operator with Query Syntax, we need to create a\
    \ custom query keyword. We’ll define an extension method on the `IEnumerable`\
    \ with the `map` keyword:\n\n```csharp\npublic static class LinqExtensions\n{\n\
    \    public static IEnumerable<TResult> map<TSource, TResult>(this IEnumerable<TSource>\
    \ source, Func<TSource, TResult> selector)\n    {\n        return source.Select(selector);\n\
    \    }\n}\n```\n\nNow we can use our custom `Map` operator with Query Syntax:\n\
    \n```csharp\nvar squaredNumbersQuery = from n in numbers select n;\n```\n\n###\
    \ 6.4.2 Bind Operator\n\nLet’s create a custom `Bind` operator, which behaves\
    \ like `SelectMany`. We’ll define an extension method on `IEnumerable`:\n\n```csharp\n\
    public static class LinqExtensions\n{\n    public static IEnumerable<TResult>\
    \ Bind<TSource, TResult>(this IEnumerable<TSource> source, Func<TSource, IEnumerable<TResult>>\
    \ selector)\n    {\n        return source.SelectMany(selector);\n    }\n}\n```\n\
    \nNow we can use our custom `Bind` operator with Method Syntax:\n\n```csharp\n\
    var names = new List<string> { \"Luke\", \"Leia\", \"Han\" };\nvar letterCombos\
    \ = names.Bind(name => name.CharArray());\n```\n\nTo use our custom `Bind` operator\
    \ with Query Syntax, we need to create a custom query keyword. We’ll define an\
    \ extension method on the `IEnumerable` with the `bind` keyword:\n\n```csharp\n\
    public static class LinqExtensions\n{\n    public static IEnumerable<TResult>\
    \ bind<TSource, TResult>(this IEnumerable<TSource> source, Func<TSource, IEnumerable<TResult>>\
    \ selector)\n    {\n        return source.SelectMany(selector);\n    }\n}\n```\n\
    \nNow we can use our custom `Bind` operator with Query Syntax:\n\n```csharp\n\
    var letterCombosQuery = from name in names from letter in name.CharArray() select\
    \ letter;\n```\n\nIn this next example, we’ll create a LINQ query to find the\
    \ best fares from two different airline using Query Syntax. We’ll use extension\
    \ methods to keep our code functional and clean.\n\nFirst, let’s create classes\
    \ to represent flight information:\n\n```csharp\npublic class Flight\n{\n    public\
    \ string Airline { get; set; }\n    public string Origin { get; set; }\n    public\
    \ DateTime DepartureDate { get; set; }\n    public decimal Fare { get; set; }\n\
    }\n```\n\nNext, we’ll create a static class with extension methods to fetch flight\
    \ data from fake airline:\n\n```csharp\nusing System.Collections.Generic;\n\n\
    public static class AirlineExtensions\n{\n    public static IEnumerable<Flight>\
    \ GetFlightsAirline1(this string origin)\n    {\n        // Fetch from Airline1\
    \ (fake data for demonstration)\n        return new List<Flight>\n        {\n\
    \            new Flight { Airline = \"Airline1\", Origin = origin, Destination\
    \ = \"New York\", DepartureDate = DateTime.Now.AddDays(1), Fare = 500 },\n   \
    \         new Flight { Airline = \"Airline1\", Origin = origin, Destination =\
    \ \"Los Angeles\", DepartureDate = DateTime.Now.AddDays(2), Fare = 800 }\n   \
    \     };\n    }\n\n    public static IEnumerable<Flight> GetFlightsAirline2(this\
    \ string origin)\n    {\n        // Fetch from Airline2 (fake data for demonstration)\n\
    \        return new List<Flight>\n        {\n            new Flight { Airline\
    \ = \"Airline2\", Origin = origin, Destination = \"New York\", DepartureDate =\
    \ DateTime.Now.AddDays(3), Fare = 550 },\n            new Flight { Airline = \"\
    Airline2\", Origin = origin, Destination = \"Los Angeles\", DepartureDate = DateTime.Now.AddDays(4),\
    \ Fare = 700 }\n        };\n    }\n}\n```\n\nNow, let’s create a LINQ query using\
    \ Query Syntax to fetch the best fares from both airlines:\n\n```csharp\nusing\
    \ System;\nusing System.Linq;\n\nclass Program\n{\n    static void Main()\n  \
    \  {\n        string origin = \"San Francisco\";\n        string destination =\
    \ \"Los Angeles\";\n        var bestFares = from airline1Flight in origin.GetFlightsAirline1()\n\
    \                         from airline2Flight in origin.GetFlightsAirline2()\n\
    \                         where airline1Flight.Destination == destination && airline2Flight.Destination\
    \ == destination\n                         let minFare = Math.Min(airline1Flight.Fare,\
    \ airline2Flight.Fare)\n                         orderby minFare\n           \
    \              select new { Airline = (airline1Flight.Fare <= airline2Flight.Fare)\
    \ ? airline1Flight.Airline : airline2Flight.Airline, Fare = minFare };\n\n   \
    \     Console.WriteLine($\"Best flight fares from {origin} to {destination}:\"\
    );\n        foreach (var fare in bestFares)\n        {\n            Console.WriteLine($\"\
    {fare.Airline}: {fare.Fare}\");\n        }\n    }\n}\n```\n\nIn this example,\
    \ we’ve used Query Syntax to handle large datasets. To make the previous code\
    \ work in parallel, we can use the `AsParallel()` extension. We need to add the\
    \ `System.Threading` namespace to our extension methods:\n\n```csharp\nusing System;\n\
    using System.Collections.Generic;\nusing System.Linq;\nusing System.Threading.Tasks;\n\
    \npublic static class AirlineExtensions\n{\n    public static IEnumerable<Flight>\
    \ GetFlightsAirline1Async(this string origin)\n    {\n        return Task.Run(()\
    \ =>\n        {\n            // Simulate asynchronous call\n            Task.Delay(500).Wait();\n\
    \            return new List<Flight>\n            {\n                new Flight\
    \ { Airline = \"Airline1\", Origin = origin, Destination = \"New York\", DepartureDate\
    \ = DateTime.Now.AddDays(1), Fare = 500 },\n                new Flight { Airline\
    \ = \"Airline1\", Origin = origin, Destination = \"Los Angeles\", DepartureDate\
    \ = DateTime.Now.AddDays(2), Fare = 800 }\n            };\n        }) as IEnumerable<Flight>;\n\
    \    }\n\n    public static IEnumerable<Flight> GetFlightsAirline2Async(this string\
    \ origin)\n    {\n        return Task.Run(() =>\n        {\n            // Simulate\
    \ asynchronous call\n            Task.Delay(500).Wait();\n            return new\
    \ List<Flight>\n            {\n                new Flight { Airline = \"Airline2\"\
    , Origin = origin, Destination = \"New York\", DepartureDate = DateTime.Now.AddDays(3),\
    \ Fare = 550 },\n                new Flight { Airline = \"Airline2\", Origin =\
    \ origin, Destination = \"Los Angeles\", DepartureDate = DateTime.Now.AddDays(4),\
    \ Fare = 700 }\n            };\n        }) as IEnumerable<Flight>;\n    }\n}\n\
    ```\n"
  raw: "While LINQ provides a comprehensive set of operators, you may sometimes need\
    \ custom operators tailored to your specific needs. By leveraging extension methods,\
    \ you can create custom query operators that can be used seamlessly with both\
    \ Query Syntax and Method Syntax. In this section, we’ll demonstrate how to create\
    \ a small library of custom LINQ operators.\n\n### 6.2.3.1 Custom Map Operator\n\
    \nLet’s create a custom Map operator, which behaves like Select. We’ll start by\
    \ defining an extension method on IEnumerable:\n\nusing System;\n\nusing System.Collections.Generic;\n\
    \nusing System.Linq;\n\npublic  static  class LinqExtensions\n\n{\n\n    public\
    \  static IEnumerable<TResult> Map<TSource, TResult>(this IEnumerable<TSource>\
    \ source, Func<TSource, TResult> selector)\n\n    {\n\n        return source.Select(selector);\n\
    \n    }\n\n}\n\nNow we can use our custom Map operator with Method Syntax:\n\n\
    var numbers =  new List<int>  {  1,  2,  3,  4,  5  };\n\nvar squaredNumbers =\
    \ numbers.Map(x => x * x);\n\nTo use our custom Map operator with Query Syntax,\
    \ we need to create a custom query keyword. We’ll define an extension method on\
    \ the IEnumerable with the map keyword:\n\npublic  static  class LinqExtensions\n\
    \n{\n\n    public  static IEnumerable<TResult> map<TSource, TResult>(this IEnumerable<TSource>\
    \ source, Func<TSource, TResult> selector)\n\n    {\n\n        return source.Select(selector);\n\
    \n    }\n\n}\n\nNow we can use our custom Map operator with Query Syntax:\n\n\
    var squaredNumbersQuery = from n in numbers\n\nselect n * n;\n\n6.4.2\\. Custom\
    \ Bind Operator\n\nLet’s create a custom Bind operator, which behaves like SelectMany.\
    \ We’ll define an extension method on IEnumerable:\n\npublic  static  class LinqExtensions\n\
    \n{\n\n    public  static IEnumerable<TResult> Bind<TSource, TResult>(this IEnumerable<TSource>\
    \ source, Func<TSource, IEnumerable<TResult>> selector)\n\n    {\n\n        return\
    \ source.SelectMany(selector);\n\n    }\n\n}\n\nNow we can use our custom Bind\
    \ operator with Method Syntax:\n\nvar names =  new List<string>  {  \"Luke\",\
    \  \"Leia\",  \"Han\"  };\n\nvar letterCombos = names.Bind(name => name.ToCharArray());\n\
    \nTo use our custom Bind operator with Query Syntax, we need to create a custom\
    \ query keyword. We’ll define an extension method on the IEnumerable with the\
    \ bind keyword:\n\npublic  static  class LinqExtensions\n\n{\n\n    public  static\
    \ IEnumerable<TResult> bind<TSource, TResult>(this IEnumerable<TSource> source,\
    \ Func<TSource, IEnumerable<TResult>> selector)\n\n    {\n\n        return source.SelectMany(selector);\n\
    \n    }\n\n}\n\nNow we can use our custom Bind operator with Query Syntax:\n\n\
    var letterCombosQuery = from name in names\n\nfrom letter in name.ToCharArray()\n\
    \n                        select letter;\n\nIn this next example, we’ll create\
    \ a LINQ query to find the best flight fares from two different fake airline companies\
    \ using Query Syntax. We’ll use extension methods to keep our code functional\
    \ and clean.\n\nFirst, let’s create classes to represent flight information:\n\
    \npublic  class Flight\n\n{\n\n public  string Airline {  get;  set;  }\n\n public\
    \  string Origin {  get;  set;  }\n\n public  string Destination {  get;  set;\
    \  }\n\n public DateTime DepartureDate {  get;  set;  }\n\n public  decimal Fare\
    \ {  get;  set;  }\n\n}\n\nNext, we’ll create a static class with extension methods\
    \ to fetch flight data from our fake airline companies:\n\nusing System.Collections.Generic;\n\
    \npublic  static  class AirlineExtensions\n\n{\n\n    public  static IEnumerable<Flight>\
    \  GetFlightsFromAirline1(this  string origin)\n\n    {\n\n        // Fetch flights\
    \ from Airline1 API (fake data for demonstration)\n\n        return  new List<Flight>\n\
    \n        {\n\n            new Flight { Airline =  \"Airline1\", Origin = origin,\
    \ Destination =  \"New York\", DepartureDate = DateTime.Now.AddDays(1), Fare =\
    \  500  },\n\n            new Flight { Airline =  \"Airline1\", Origin = origin,\
    \ Destination =  \"Los Angeles\", DepartureDate = DateTime.Now.AddDays(2), Fare\
    \ =  800  }\n\n        };\n\n    }\n\npublic  static IEnumerable<Flight>  GetFlightsFromAirline2(this\
    \  string origin)\n\n    {\n\n        // Fetch flights from Airline2 API (fake\
    \ data for demonstration)\n\n        return  new List<Flight>\n\n        {\n\n\
                new Flight { Airline =  \"Airline2\", Origin = origin, Destination\
    \ =  \"New York\", DepartureDate = DateTime.Now.AddDays(3), Fare =  550  },\n\n\
                new Flight { Airline =  \"Airline2\", Origin = origin, Destination\
    \ =  \"Los Angeles\", DepartureDate = DateTime.Now.AddDays(4), Fare =  700  }\n\
    \n        };\n\n    }\n\n}\n\nNow, let’s create a LINQ query using Query Syntax\
    \ to fetch the best flight fares from both airlines:\n\nusing System;\n\nusing\
    \ System.Linq;\n\nclass Program\n\n{\n\n    static  void  Main()\n\n    {\n\n\
            string origin =  \"San Francisco\";\n\n        string destination =  \"\
    Los Angeles\";\n\nvar bestFares = from airline1Flight in origin.GetFlightsFromAirline1()\n\
    \nfrom airline2Flight in origin.GetFlightsFromAirline2()\n\n                        where\
    \ airline1Flight.Destination  == destination && airline2Flight.Destination  ==\
    \ destination\n\nlet minFare = Math.Min(airline1Flight.Fare, airline2Flight.Fare)\n\
    \n                        orderby minFare\n\nselect new  { Airline =  (airline1Flight.Fare\
    \  <= airline2Flight.Fare)  ? airline1Flight.Airline  : airline2Flight.Airline,\
    \ Fare = minFare };\n\nConsole.WriteLine($\"Best flight fares from {origin} to\
