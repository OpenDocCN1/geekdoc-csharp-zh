  trans: "\n使用这些概念和技术将帮助你在函数式 C# 应用程序中构建健壮且可维护的错误处理策略，使你能够以一致且可组合的方式处理成功和失败情况。\n\n\
    # 第 9 章：函数式设计模式\n\n在本章中，我们将探索函数式编程中常用的函数式设计模式。这些设计模式帮助你利用函数式编程概念编写更整洁、更可复用且易于维护的代码。\n\
    \n## 9.1 Functor（算子）、Applicative（应用器）和 Monad（单数）\n\n在函数式编程中，`Functor`、`Applicative`\
    \ 和 `Monad` 是处理副作用计算的设计模式。它们帮助我们组合在计算上下文中产生值的函数，例如错误处理、异步操作或可能产生副作用的计算。让我们详细讨论这些模式，并使用各种示例在\
    \ C# 中从零实现它们。\n\n### Functor（算子）\n`Functor` 是一种涉及使用具有 `map` 操作泛型数据类型的设计模式。`Functors`\
    \ 允许你将函数应用于计算上下文中的值，而不需要显式地管理上下文。在 C# 中，你可以将 `IEnumerable` 和 `Task` 视为算子的示例。`LINQ`\
    \ 的 `Select` 方法就是 `map` 操作的示例。\n\n让我们创建一个简单的 `Maybe` 类型，并将 `map` 操作实现为扩展方法：\n\n\
    ```csharp\npublic abstract class Maybe<T>\n{\n    public static Maybe<T> None()\
    \ => new None<T>();\n    public static Maybe<T> Some(T value) => new Some<T>(value);\n\
    }\n\npublic class None<T> : Maybe<T> { }\n\npublic class Some<T> : Maybe<T>\n\
    {\n    public T Value { get; }\n    public Some(T value)\n    {\n        Value\
    \ = value;\n    }\n}\n\npublic static class MaybeExtensions\n{\n    public static\
    \ Maybe<TResult> Map<TSource, TResult>(\n        this Maybe<TSource> maybe,\n\
    \        Func<TSource, TResult> selector)\n    {\n        return maybe switch\n\
    \        {\n            Some<TSource> some => Maybe<TResult>.Some(selector(some.Value)),\n\
    \            _ => Maybe<TResult>.None(),\n        };\n    }\n}\n```\n\n现在，让我们为\
    \ `IEnumerable` 类型实现 `map` 操作：\n\n```csharp\npublic static class EnumerableExtensions\n\
    {\n    public static IEnumerable<TResult> Map<TSource, TResult>(\n        this\
    \ IEnumerable<TSource> source,\n        Func<TSource, TResult> selector)\n   \
    \ {\n        return source.Select(selector);\n    }\n}\n```\n\n对于 `Task` 类型也是：\n\
    \n```csharp\npublic static class TaskExtensions\n{\n    public static async Task<TResult>\
    \ Map<TSource, TResult>(\n        this Task<TSource> task,\n        Func<TSource,\
    \ TResult> selector)\n    {\n        return selector(await task);\n    }\n}\n\
    ```\n\n### Applicative（应用器）\n`Applicative` 通过扩展了 `Functor` 概念，允许你将封装在计算上下文中的函数应用于相同上下文中的值。在\
    \ C# 中，我们可以使用之前相同的 `Maybe` 类型创建一个 `Applicative`，并实现 `Apply` 扩展方法：\n\n```csharp\n\
    public static class MaybeExtensions\n{\n    // ...\n    public static Maybe<TResult>\
    \ Apply<TSource, TResult>(\n        this Maybe<Func<TSource, TResult>> maybeFunc,\n\
    \        Maybe<TSource> maybeValue)\n    {\n        return maybeFunc switch\n\
    \        {\n            Some<Func<TSource, TResult>> someFunc =>\n           \
    \     maybeValue.Map(value => someFunc.Value(value)),\n            _ => Maybe<TResult>.None(),\n\
    \        };\n    }\n}\n```\n\n现在，让我们为 `IEnumerable` 类型实现 `Apply` 操作：\n\n```csharp\n\
    public static class EnumerableExtensions\n{\n    // ...\n    public static IEnumerable<TResult>\
    \ Apply<TSource, TResult>(\n        this IEnumerable<Func<TSource, TResult>> sourceFuncs,\n\
    \        IEnumerable<TSource> sourceValues)\n    {\n        return from func in\
    \ sourceFuncs\n               from value in sourceValues\n               select\
    \ func(value);\n    }\n}\n```\n\n对于 `Task` 类型：\n\n```csharp\npublic static async\
    \ Task<TResult> Apply<TSource, TResult>(\n    this Task<Func<TSource, TResult>>\
    \ taskFunc,\n    Task<TSource> taskValue)\n{\n    var func = await taskFunc;\n\
    \    var value = await taskValue;\n    return func(value);\n}\n```\n\n### Monad（单数）\n\
    `Monad` 是一种泛化操作链概念的设计模式。`Monads` 允许你展平嵌套的上下文并执行操作。`monad` 必须提供一个 `bind` 操作（在 C#\
    \ 中也称为 `SelectMany`）。\n\n让我们为我们的 `Maybe` 类型实现 `bind` 操作：\n\n```csharp\npublic\
    \ static class MaybeExtensions\n{\n    // ...\n    public static Maybe<TResult>\
    \ Bind<TSource, TResult>(\n        this Maybe<TSource> maybe,\n        Func<TSource,\
    \ Maybe<TResult>> selector)\n    {\n        return maybe switch\n        {\n \
    \           Some<TSource> some => selector(some.Value),\n            _ => Maybe<TResult>.None(),\n\
    \        };\n    }\n}\n```\n\n现在，让我们为 `IEnumerable` 类型实现 `bind` 操作：\n\n```csharp\n\
    public static class EnumerableExtensions\n{\n    // ...\n    public static IEnumerable<TResult>\
    \ Bind<TSource, TResult>(\n        this IEnumerable<TSource> source,\n       \
    \ Func<TSource, IEnumerable<TResult>> selector)\n    {\n        return source.SelectMany(selector);\n\
    \    }\n}\n```\n\n对于 `Task` 类型：\n\n```csharp\npublic static async Task<TResult>\
    \ Bind<TSource, TResult>(\n    this Task<TSource> task,\n    Func<TSource, Task<TResult>>\
    \ selector)\n{\n    return await selector(await task);\n}\n```\n\n我们已经了 `Functor`、`Applicative`\
    \ 和 `Monad` 用于三种不同的计算上下文：`Maybe`、`IEnumerable` 和 `Task`。通过这些概念，你可以创建更可复用和可组合的代码。\n"
- fmt: "\n# Task Example\n\nConsider an application that makes multiple API calls\
    \ to different services, and we want to process the results sequentially. We can\
    \ use the `Task` monad to achieve this.\n\n```csharp\npublic async Task<string>\
    \ FetchDataFromApi(string url)\n{\n    // Simulating an API call with Task.Delay\n\
    \    await Task.Delay(1000);\n    return $\"Data from {url}\";\n}\n\npublic async\
    \ Task<string> ProcessData(string data)\n{\n    // Simulating data processing\
    \ with Task.Delay\n    await Task.Delay(500);\n    return $\"Processed {data}\"\
    ;\n}\n\npublic async Task<string> FetchAndProcessDataAsync(string url)\n{\n  \
    \  return await FetchDataFromApi(url).Bind(ProcessData);\n}\n\npublic async Task\
    \ ExecuteExample()\n{\n    var urls = new List<string> { \"https://api1.example.com\"\
    , \"https://api2.example.com\" };\n    foreach (var url in urls)\n    {\n    \
    \    var result = await FetchAndProcessDataAsync(url);\n        Console.WriteLine(result);\n\
    \    }\n}\n\nawait ExecuteExample();\n```\n\nIn this example, we use the `Task<T>`\
    \ monad to chain asynchronous calls and process the results sequentially. This\
    \ makes the code cleaner and more manageable while preserving the sequential nature\
    \ of the operations.\n\nIn conclusion, understanding and implementing `Functor`,\
    \ `Applicative`, and `Monad` design patterns can lead to cleaner, more reusable,\
    \ and more maintainable code in a functional programming style. By leveraging\
    \ these patterns with different computational contexts such as `Maybe<T>`, `IEnumerable<T>`,\
    \ and `Task<T>`, you can create composable and versatile code that can handle\
    \ a wide range of scenarios.\n\n## 10.3 Extension Methods for Task Monad\n\nIn\
    \ this section, we’ll extend the `Task` monad with some additional extension methods\
    \ to handle retries and recover from errors. The methods we will implement are\
    \ `OrElse`, `Recover`, `Bind`, and `Map`.\n\nLet’s start by creating a new `TaskExtensions`\
    \ class that contains the extension methods:\n\n```csharp\npublic static class\
    \ TaskExtensions\n{\n    public static async Task<TResult> OrElse<TSource, TResult>(\n\
    \        this Task<TSource> task,\n        Func<Task<TResult>> fallback)\n   \
    \ where TSource : TResult\n    {\n        try\n        {\n            return await\
    \ task;\n        }\n        catch\n        {\n            return await fallback();\n\
    \        }\n    }\n\n    public static async Task<T> Recover<T>(\n        this\
    \ Task<T> task,\n        Func<Exception, T> recoverFunc)\n    {\n        try\n\
    \        {\n            return await task;\n        }\n        catch (Exception\
    \ ex)\n        {\n            return recoverFunc(ex);\n        }\n    }\n\n  \
    \  public static async Task<TResult> Bind<TSource, TResult>(\n        this Task<TSource>\
    \ task,\n        Func<TSource, Task<TResult>> selector)\n    {\n        return\
    \ await selector(await task);\n    }\n\n    public static async Task<TResult>\
    \ Map<TSource, TResult>(\n        this Task<TSource> task,\n        Func<TSource,\
    \ Result> selector)\n    {\n        return selector(await task);\n    }\n}\n```\n\
    \nNow, let’s explain each method:\n\n- `OrElse`: If the `task` fails, it will\
    \ execute the `fallback` function, returning a new `task`. It’s useful for implementing\
    \ retries or providing an alternative result when an operation fails.\n- `Recover`:\
    \ If the `task` fails, it will execute the `recoverFunc` function, which receives\
    \ the exception and returns a default value. It’s useful for recovering from errors\
    \ and providing default values when an operation fails.\n- `Bind` and `Map`: These\
    \ methods were previously explained in the earlier sections as fundamental operations\
    \ for the `Task` monad.\n\nNow let’s create some examples demonstrating the usage\
    \ of these methods.\n\n```csharp\npublic async Task<string> FetchDataFromApiWithErrors(string\
    \ url)\n{\n    // Simulating an API call that sometimes throws an exception\n\
    \    if (url.Contains(\"error\"))\n    {\n        throw new InvalidOperationException(\"\
    Error fetching.\");\n    }\n    await Task.Delay(1000);\n    return $\"Data from\
    \ {url}\";\n}\n\npublic async Task ExecuteExampleWithExtensions()\n{\n    var\
    \ urls = new List<string> {\n        \"https://api1.example.com\",\n        \"\
    https://api2.example.com/error\",\n        \"https://api3.example.com\"\n    };\n\
    \    foreach (var url in urls)\n    {\n        var dataTask = FetchDataFromApiWithErrors(url);\n\
    \        var recoveredDataTask = dataTask.Recover(ex => $\"Recovered data for\
    \ {url}\");\n        var processedDataTask = recoveredDataTask.Map(data => $\"\
    Processed {data}\");\n        var result = await processedDataTask;\n        Console.WriteLine(result);\n\
    \    }\n}\n\nawait ExecuteExampleWithExtensions();\n```\n\nIn this example, we\
    \ use the `Recover` and `Map` methods to handle errors and process the data from\
    \ the API calls. This results in more resilient and cleaner code, taking advantage\
    \ of the extension methods provided for the `Task` monad.\n\n## Use Case 1: Stock\
    \ Data API\n\nImagine we have an application that fetches stock data from an API.\
    \ There are two API providers, one primary and one secondary. If the primary API\
    \ fails, the application should fall back to the secondary API. Additionally,\
    \ if both APIs fail, we should return a default stock value.\n\nFirst, let’s create\
    \ a `Stock` class and functions for fetching stock data:\n\n```csharp\npublic\
    \ class Stock\n{\n    public string Symbol { get; set; }\n    public double Price\
    \ { get; set; }\n}\n\npublic async Task<Stock> FetchStockFromPrimaryApi(string\
    \ symbol)\n{\n    // Simulate an API call with possible failures\n    if (symbol\
    \ == \"FAIL\")\n    {\n        throw new InvalidOperationException(\"Primary API\
    \ failed.\");\n    }\n    await Task.Delay(1000);\n    return new Stock { Symbol\
    \ = symbol, Price = 100.0 };\n}\n\npublic async Task<Stock> FetchStockFromSecondaryApi(string\
    \ symbol)\n{\n    // Simulate an API call with possible failures\n    if (symbol\
    \ == \"FAIL\")\n    {\n        throw new InvalidOperationException(\"Secondary\
    \ API failed.\");\n    }\n    await Task.Delay(1000);\n    return new Stock {\
    \ Symbol = symbol, Price = 200.0 };\n}\n\npublic Stock DefaultStock(string symbol)\n\
    {\n    return new Stock { Symbol = symbol, Price = 0.0 };\n}\n```\n\nNow let’s\
    \ use the `OrElse` and `Recover` methods to create a fault-tolerant function to\
    \ fetch stock data:\n\n```csharp\npublic async Task<Stock> FetchStockDataAsync(string\
    \ symbol)\n{\n    return await FetchStockFromPrimaryApi(symbol)\n        .OrElse(()\
    \ => FetchStockFromSecondaryApi(symbol))\n        .Recover(ex => DefaultStock(symbol));\n\
    }\n\npublic async Task ExecuteStockData()\n{\n    var symbols = new List<string>\
    \ { \"AAPL\", \"MSFT\", \"FAIL\" };\n    foreach (var symbol in symbols)\n   \
    \ {\n        var stock = await FetchStockDataAsync(symbol);\n        Console.WriteLine($\"\
    Symbol: {stock.Symbol}, Price: {stock.Price}\");\n    }\n}\n\nawait ExecuteStockData();\n\
    ```\n\n## Use Case 2: Geocoding and Weather API\n\nSuppose we have an application\
    \ that fetches location coordinates (latitude and longitude) for a given address\
    \ using a geocoding API and then fetches weather data using a weather API. The\
    \ application should handle possible API failures and provide default data when\
    \ necessary.\n\nFirst, let’s create `Location` and `Weather` classes and functions\
    \ for fetching data from the APIs:\n\n```csharp\npublic class Location\n{\n  \
    \  public string Address { get; set; }\n    public double Latitude { get; set;\
    \ }\n    public double Longitude { get; set; }\n}\n\npublic class Weather\n{\n\
    \    public string Description { get; set; }\n    public double Temperature {\
    \ get; set; }\n}\n\npublic async Task<Location> FetchLocationAsync(string address)\n\
    {\n    // Simulate an API call with possible failures\n    if (address == \"FAIL\"\
    )\n    {\n        throw new InvalidOperationException(\"Geocoding API failed.\"\
    );\n    }\n    await Task.Delay(1000);\n    return new Location { Address = address,\
    \ Latitude = 40.7128, Longitude = -74.0060 };\n}\n\npublic async Task<Weather>\
    \ FetchWeatherAsync(double latitude, double longitude)\n{\n    // Simulate an\
    \ API call with possible failures\n    if (latitude == 0.0 && longitude == 0.0)\n\
    \    {\n        throw new InvalidOperationException(\"Weather API failed.\");\n\
    \    }\n}\n```\n"
  raw: "Task Example Consider an application that makes multiple API calls to different\
    \ services, and we want to process the results sequentially. We can use the Task\
    \ monad to achieve this.\n\npublic async Task<string>  FetchDataFromApi(string\
    \ url)\n\n{\n\n    // Simulating an API call with Task.Delay\n\n    await Task.Delay(1000);\n\
    \n    return $\"Data from {url}\";\n\n}\n\npublic async Task<string>  ProcessData(string\
    \ data)\n\n{\n\n    // Simulating data processing with Task.Delay\n\n    await\
    \ Task.Delay(500);\n\n    return $\"Processed {data}\";\n\n}\n\npublic async Task<string>\
    \  FetchAndProcessDataAsync(string url)\n\n{\n\nreturn await FetchDataFromApi(url).Bind(ProcessData);\n\
    \n}\n\npublic async Task ExecuteExample()\n\n{\n\n    var urls =  new List<string>\
    \  {  \"https://api1.example.com\",  \"https://api2.example.com\"  };\n\n    foreach\
    \  (var url in urls)\n\n    {\n\n        var result = await FetchAndProcessDataAsync(url);\n\
    \n        Console.WriteLine(result);\n\n    }\n\n}\n\nawait ExecuteExample();\n\
    \nIn this example, we use the Task<T> monad to chain asynchronous calls and process\
    \ the results sequentially. This makes the code cleaner and more manageable while\
    \ preserving the sequential nature of the operations.\n\nIn conclusion, understanding\
    \ and implementing Functor, Applicative, and Monad design patterns can lead to\
    \ cleaner, more reusable, and more maintainable code in a functional programming\
    \ style. By leveraging these patterns with different computational contexts such\
    \ as Maybe<T>, IEnumerable<T>, and Task<T>, you can create composable and versatile\
    \ code that can handle a wide range of scenarios.\n\n## 10.3 Extension Methods\
    \ for Task Monad\n\nIn this section, we’ll extend the Task monad with some additional\
    \ extension methods to handle retries and recover from errors. The methods we\
    \ will implement are OrElse, Recover, Bind, and Map.\n\nLet’s start by creating\
    \ a new TaskExtensions class that contains the extension methods:\n\npublic  static\
    \  class TaskExtensions\n\n{\n\n    public  static async Task<TResult> OrElse<TSource,\
    \ TResult>(\n\n        this Task<TSource> task,\n\n        Func<Task<TResult>>\
    \ fallback)\n\nwhere TSource : TResult\n\n    {\n\n        try\n\n        {\n\n\
                return await task;\n\n        }\n\n        catch\n\n        {\n\n\
                return await fallback();\n\n        }\n\n    }\n\npublic  static async\
    \ Task<T> Recover<T>(\n\n        this Task<T> task,\n\n        Func<Exception,\
    \ T> recoverFunc)\n\n    {\n\n        try\n\n        {\n\n            return await\
    \ task;\n\n        }\n\n        catch  (Exception ex)\n\n        {\n\n            return\
    \  recoverFunc(ex);\n\n        }\n\n    }\n\npublic  static async Task<TResult>\
    \ Bind<TSource, TResult>(\n\n        this Task<TSource> task,\n\n        Func<TSource,\
    \ Task<TResult>> selector)\n\n    {\n\n        return await selector(await task);\n\
    \n    }\n\npublic  static async Task<TResult> Map<TSource, TResult>(\n\n        this\
    \ Task<TSource> task,\n\n        Func<TSource, TResult> selector)\n\n    {\n\n\
            return  selector(await task);\n\n    }\n\n}\n\nNow, let’s explain each\
    \ method:\n\n• OrElse: If the task fails, it will execute the fallback function\
    \ provided, returning a new task. It’s useful for implementing retries or providing\
    \ an alternative result when an operation fails.\n\n• Recover: If the task fails,\
    \ it will execute the recoverFunc function, which receives the exception and returns\
    \ a default value. It’s useful for recovering from errors and providing default\
    \ values when an operation fails.\n\n•           Bind and Map: These methods were\
    \ previously explained in the earlier sections as fundamental operations for the\
    \ Task monad.\n\nNow let’s create some examples demonstrating the usage of these\
    \ extension methods.\n\npublic async Task<string>  FetchDataFromApiWithErrors(string\
    \ url)\n\n{\n\n    // Simulating an API call that sometimes throws an exception\n\
    \n    if  (url.Contains(\"error\"))\n\n    {\n\n        throw  new  InvalidOperationException(\"\
    Error fetching data.\");\n\n    }\n\nawait Task.Delay(1000);\n\n    return $\"\
    Data from {url}\";\n\n}\n\npublic async Task ExecuteExampleWithExtensions()\n\n\
    {\n\n    var urls =  new List<string>\n\n    {\n\n        \"https://api1.example.com\"\
    ,\n\n        \"https://api2.example.com/error\",\n\n        \"https://api3.example.com\"\
    ,\n\n    };\n\nforeach  (var url in urls)\n\n    {\n\n        var dataTask = \
    \ FetchDataFromApiWithErrors(url);\n\n        var recoveredDataTask = dataTask.Recover(ex\
    \ => $\"Recovered data for {url}\");\n\n        var processedDataTask = recoveredDataTask.Map(data\
    \ => $\"Processed {data}\");\n\nvar result = await processedDataTask;\n\n        Console.WriteLine(result);\n\
    \n    }\n\n}\n\nawait ExecuteExampleWithExtensions();\n\nIn this example, we use\
    \ the Recover and Map methods to handle errors and process the data from the API\
    \ calls. This results in more resilient and cleaner code, taking advantage of\
    \ the extension methods provided for the Task monad.\n\n## Use Case 1: Stock Data\
    \ API\n\nImagine we have an application that fetches stock data from an API. There\
    \ are two API providers, one primary and one secondary. If the primary API fails,\
    \ the application should fall back to the secondary API. Additionally, if both\
    \ APIs fail, we should return a default stock value.\n\nFirst, let’s create a\
    \ Stock class and functions for fetching stock data:\n\npublic  class Stock\n\n\
    {\n\n public  string Symbol {  get;  set;  }\n\n public  double Price {  get;\
    \  set;  }\n\n}\n\npublic async Task<Stock>  FetchStockFromPrimaryApi(string symbol)\n\
    \n{\n\n    // Simulate an API call with possible failures\n\n    if  (symbol ==\
    \  \"FAIL\")\n\n    {\n\n        throw  new  InvalidOperationException(\"Primary\
    \ API failed.\");\n\n    }\n\nawait Task.Delay(1000);\n\n    return  new Stock\
    \ { Symbol = symbol, Price =  100.0  };\n\n}\n\npublic async Task<Stock>  FetchStockFromSecondaryApi(string\
    \ symbol)\n\n{\n\n    // Simulate an API call with possible failures\n\n    if\
    \  (symbol ==  \"FAIL\")\n\n    {\n\n        throw  new  InvalidOperationException(\"\
    Secondary API failed.\");\n\n    }\n\nawait Task.Delay(1000);\n\n    return  new\
    \ Stock { Symbol = symbol, Price =  200.0  };\n\n}\n\npublic Stock DefaultStock(string\
    \ symbol)\n\n{\n\n return  new Stock { Symbol = symbol, Price =  0.0  };\n\n}\n\
    \nNow let’s use the OrElse and Recover methods to create a fault-tolerant function\
    \ to fetch stock data:\n\npublic async Task<Stock>  FetchStockDataAsync(string\
    \ symbol)\n\n{\n\n    return await FetchStockFromPrimaryApi(symbol)\n\n        .OrElse(()\
    \  =>  FetchStockFromSecondaryApi(symbol))\n\n        .Recover(ex =>  DefaultStock(symbol));\n\
    \n}\n\npublic async Task ExecuteStockDataExample()\n\n{\n\n var symbols =  new\
    \ List<string>  {  \"AAPL\",  \"MSFT\",  \"FAIL\"  };\n\nforeach  (var symbol\
    \ in symbols)\n\n    {\n\n        var stock = await FetchStockDataAsync(symbol);\n\
    \n        Console.WriteLine($\"Symbol: {stock.Symbol}, Price: {stock.Price}\"\
    );\n\n    }\n\n}\n\nawait ExecuteStockDataExample();\n\nUse Case 2: Geocoding\
    \ and Weather API Suppose we have an application that fetches location coordinates\
    \ (latitude and longitude) for a given address using a geocoding API and then\
    \ fetches weather data using a weather API. The application should handle possible\
    \ API failures and provide default data when necessary.\n\nFirst, let’s create\
    \ Location and Weather classes and functions for fetching data from the APIs:\n\
    \npublic  class Location\n\n{\n\n public  string Address {  get;  set;  }\n\n\
    \ public  double Latitude {  get;  set;  }\n\n public  double Longitude {  get;\
    \  set;  }\n\n}\n\npublic  class Weather\n\n{\n\n public  string Description {\
    \  get;  set;  }\n\n public  double Temperature {  get;  set;  }\n\n}\n\npublic\
    \ async Task<Location>  FetchLocationAsync(string address)\n\n{\n\n    // Simulate\
    \ an API call with possible failures\n\n    if  (address ==  \"FAIL\")\n\n    {\n\
    \n        throw  new  InvalidOperationException(\"Geocoding API failed.\");\n\n\
        }\n\nawait Task.Delay(1000);\n\n return  new Location { Address = address,\
    \ Latitude =  40.7128, Longitude =  -74.0060  };\n\n}\n\npublic async Task<Weather>\
    \  FetchWeatherAsync(double latitude,  double longitude)\n\n{\n\n    // Simulate\
    \ an API call with possible failures\n\n    if  (latitude ==  0.0  && longitude\
    \ ==  0.0)\n\n    {\n\n        throw  new  InvalidOperationException(\"Weather\
    \ API failed.\");\n\n    }"
