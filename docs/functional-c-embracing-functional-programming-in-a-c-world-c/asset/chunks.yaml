  trans: "\n\n// // 申请人的信用评分和债务收入比\n\n```csharp\nvar creditScoreResult = CheckCreditScore(applicant);\n\
    \nvar debtToIncomeRatioResult = EvaluateDebtToIncomeRatio(applicant);\n\n// 如果两项评估都成功，则批准贷款\n\
    if (creditScoreResult.IsSuccessful && debtToIncomeRatioResult.IsSuccessful)\n\
    {\n    var loanApplication = new LoanApplication\n    {\n        Applicant = applicant,\n\
    \        LoanAmount = loanAmount,\n        LoanTermInMonths = loanTermInMonths\n\
    \    };\n    return Result<LoanApplication, Error>.Success(loanApplication);\n\
    }\n\n// 如果任一评估失败，返回相应的错误\nreturn creditScoreResult.Match<Result<LoanApplication,\
    \ Error>>(\n    Success: _ => Result<LoanApplication, Error>.Failure(debtToIncomeRatioResult.FailureValue),\n\
    \    Failure: error => Result<LoanApplication, Error>.Failure(error));\n```\n\n\
    现在我们已经实现了这些函数，让我们使用轨道式编程（railway-oriented programming）原则将它们组合进一个 `ProcessLoanApplication`\
    \ 函数中：\n\n```csharp\npublic Result<LoanApplication, Error> ProcessLoanApplication(Applicant\
    \ applicant, decimal loanAmount, int loanTermInMonths)\n{\n    return CheckCreditScore(applicant)\n\
    \        .Bind(creditScore => EvaluateDebtToIncomeRatio(applicant)\n        .Map(debtToIncomeRatio\
    \ => ApproveLoan(applicant, loanAmount, loanTermInMonths)));\n}\n```\n\n在 `ProcessLoanApplication`\
    \ 函数中，我们首先调用 `CheckCreditScore`，然后使用 `Bind` 方法链式调用 `EvaluateDebtToIncomeRatio`\
    \ 的结果。如果两个评估都成功，我们接着使用 `Map` 方法调用 `ApproveLoan`。如果过程中的任何步骤失败，错误将通过链传递并作为最终结果返回。\n\
    \n现在，让我们创建一个示例函数来模拟处理贷款申请：\n\n```csharp\npublic static async Task Main()\n{\n\
    \    var applicant = new Applicant { Name = \"Alice\", AnnualIncome = 80000m };\n\
    \    decimal loanAmount = 250000m;\n    int loanTermInMonths = 360;\n    var result\
    \ = ProcessLoanApplication(applicant, loanAmount, loanTermInMonths);\n    result.Match(\n\
    \        Success: loanApplication => Console.WriteLine(\"Loan approved!\"),\n\
    \        Failure: error => Console.WriteLine($\"Loan denied. Reason: {error.Message}\"\
    )\n    );\n}\n```\n\n让我们通过添加更多步骤来扩展我们的贷款处理流水线，以使轨道式编程的概念更加清晰。我们向向流水线中添加以下新函数：\n\
    \n* `CheckEmploymentHistory`：此函数检查申请人的工作历史，并返回一个 `Result`，指示其是否符合最低工作年限要求。\n*\
    \ `VerifyIdentity`：此函数验证申请人的身份，并返回一个 `Result`，指示身份验证是否成功。\n* `EvaluateLoanRisk`：此函数评估贷款的整体风险，并返回一个\
    \ `Result`，指示风险是否在接受范围内。\n\n现在，让我们实现这些函数：\n\n```csharp\npublic Result<bool, Error>\
    \ CheckEmploymentHistory(Applicant applicant)\n{\n    // 模拟检查工作历史（例如通过调用就业验证 API）\n\
    \    int employmentDurationInMonths = new Random().Next(0, 120);\n    if (employmentDurationInMonths\
    \ < 24)\n    {\n        return Result<bool, Error>.Failure(new Error { Message\
    \ = \"Insufficient employment history.\" });\n    }\n    return Result<bool, Error>.Success(true);\n\
    }\n\npublic Result<bool, Error> VerifyIdentity(Applicant applicant)\n{\n    //\
    \ 模拟验证申请人的身份（例如通过调用身份验证 API）\n    bool identityVerified = new Random().Next(0,\
    \ 2) == 1;\n    if (!identityVerified)\n    {\n        return Result<bool, Error>.Failure(new\
    \ Error { Message = \"Identity verification failed.\" });\n    }\n    return Result<bool,\
    \ Error>.Success(true);\n}\n\npublic Result<bool, Error> EvaluateLoanRisk(Applicant\
    \ applicant, decimal loanAmount, int loanTermInMonths)\n{\n    // 模拟评估贷款风险（例如使用机器学习模型）\n\
    \    bool isAcceptableRisk = new Random().Next(0, 2) == 1;\n    if (!isAcceptableRisk)\n\
    \    {\n        return Result<bool, Error>.Failure(new Error { Message = \"Loan\
    \ risk too high.\" });\n    }\n    return Result<bool, Error>.Success(true);\n\
    }\n```\n\n现在，让我们更新 `ProcessLoanApplication` 函数，将这些新步骤包含在流水线：\n\n```csharp\npublic\
    \ Result<LoanApplication, Error> ProcessLoanApplication(Applicant applicant, decimal\
    \ loanAmount, int loanTermInMonths)\n{\n    return CheckCreditScore(applicant)\n\
    \        .Bind(creditScore => EvaluateDebtToIncomeRatio(applicant)\n        .Bind(debtToIncomeRatio\
    \ => CheckEmploymentHistory(applicant)\n        .Bind(employmentHistory => VerifyIdentity(applicant)\n\
    \        .Bind(identityVerified => EvaluateLoanRisk(applicant, loanAmount, loanTermInMonths)\n\
    \        .Map(risk => ApproveLoan(applicant, loanAmount, loanTermInMonths))));\n\
    }\n```\n\n在更新后的 `ProcessLoanApplication` 函数中，我们使用 `Bind` 方法包含了 `CheckEmploymentHistory`、`VerifyIdentity`\
    \ 和 `EvaluateLoanRisk`。\n\n# 第 8 章：函数式风格的异步编程\n\n## 8.1 Async/Await 与基于的异步模式\n\
    \n在编程世界中，无法避免处理异步操作，特别是在处理 I/O 密集型任务时。C# 在提供管理异步的工具方面取得了巨大进展，使其变得更容易。在本章中，我们将从函数的角度探索异步编程。\n\
    \n基于的异步模式（TAP）是 C# 异步编程模型的核心。它依赖 `Task` 类来表示产生结果或简单完成的工作。\n\n让我们先看一个使用 `async/await`\
    \ 执行异步操作的简单示例：\n\n```csharp\npublic async Task<string> FetchDataFromWebAsync()\n\
    {\n    using (var httpClient = new HttpClient())\n    {\n        var response\
    \ = await httpClient.GetAsync(\"https://api.example.com/data\");\n        var\
    \ content = await response.Content.ReadAsStringAsync();\n        return content;\n\
    \    }\n}\n```\n\n在这个示例中，我们使用 `HttpClient` 从 Web API 获取数据。`async` 关键字表示该方法包含异步代码。`await`\
    \ 关键字暂停方法的执行，直到 `Task` 表示的异步操作完成。该方法返回一个 `Task`，代表正在进行的字符串操作。\n\n现在，让我们探索如何将函数式编程概念应用于\
    \ C# 的异步编程。一种方法是使用单 ad，特别是 `Task` 单 ad。就像 `Option` 和 `Either` 一样，`Task` 单 ad 可以用于以函数方式链式调用和组合异步操作。\n\
    \n例如，让我们使用 `Task` 单 ad 和函数式风格重写 `FetchDataFromWebAsync` 方法：\n\n```csharp\npublic\
    \ Task<string> FetchDataFromWebFuncAsync()\n{\n    return new HttpClient().GetAsync(\"\
    https://api.example.com/data\")\n        .Bind(response => response.Content.ReadAsStringAsync());\n\
    }\n```\n\n在这个版本中，我们使用 `Bind` 方法链式 `GetAsync` 和 `ReadAsStringAsync` 调用。`Bind` 方法可以被视为\
    \ LINQ 中 `SelectMany` 的异步等价物。它允许我们以函数式风格组合多个异步操作。方法仍然返回一个表示正在进行操作的 `Task`。\n\n"
- fmt: "\nNotice that we no longer need the `async` and `await` keywords, as the `Bind`\
    \ method handles the asynchrony behind the scenes. This is an example of how functional\
    \ programming can help us write cleaner and more maintainable code while still\
    \ taking advantage of the powerful asynchronous features of C#.\n\n## 8.2. Asynchronous\
    \ Functional Pipelines\n\nIn the previous section, we looked at how to write asynchronous\
    \ code in a functional style using the `Task` monad and the `Bind` method. Now,\
    \ let’s extend this concept to build asynchronous functional pipelines using LINQ\
    \ query syntax.\n\nTo begin, we’ll create a few extension methods for `Task` that\
    \ will allow us to use LINQ query syntax with asynchronous operations:\n\n```csharp\n\
    public static class TaskExtensions\n{\n    public static async Task<TResult> Select<TSource,\
    \ TResult>(this Task<TSource> task, Func<TSource, TResult> selector)\n    {\n\
    \        var source = await task.ConfigureAwait(false);\n        return selector(source);\n\
    \    }\n\n    public static async Task<TResult> SelectMany<TSource, TResult>(this\
    \ Task<TSource> task, Func<TSource, Task<TResult>> selector)\n    {\n        var\
    \ source = await task.ConfigureAwait(false);\n        return await selector(source).ConfigureAwait(false);\n\
    \    }\n\n    public static async Task<TResult> SelectMany<TSource, TCollection,\
    \ TResult>(this Task<TSource> task, Func<TSource, Task<TCollection>> collectionSelector,\
    \ Func<TSource, TCollection, TResult> resultSelector)\n    {\n        var source\
    \ = await task.ConfigureAwait(false);\n        var collection = await collectionSelector(source).ConfigureAwait(false);\n\
    \        return resultSelector(source, collection);\n    }\n}\n```\n\nThese extension\
    \ methods (`Select`, `SelectMany`, and the overload of `SelectMany` with a result\
    \ selector) enable us to use LINQ query syntax with `Task`. Now, let’s create\
    \ a complex bank-related example using these extensions.\n\nSuppose we have a\
    \ banking system that needs to fetch customer data, account data, and recent transactions\
    \ asynchronously. We’ll use the following classes to represent our data:\n\n```csharp\n\
    public class Customer\n{\n    public int Id { get; set; }\n    public string Name\
    \ { get; set; }\n}\n\npublic class Account\n{\n    public int Id { get; set; }\n\
    \    public decimal Balance { get; set; }\n}\n\npublic class Transaction\n{\n\
    \    public int Id { get; set; }\n    public decimal Amount { get; set; }\n  \
    \  public DateTime Date { get; set; }\n}\n```\n\nNow, let’s create methods that\
    \ simulate fetching this data asynchronously:\n\n```csharp\npublic async Task<Customer>\
    \ GetCustomerAsync(int customerId)\n{\n    // Simulate fetching customer data\
    \ asynchronously\n    await Task.Delay(100);\n    return new Customer { Id = customerId,\
    \ Name = \"John Doe\" };\n}\n\npublic async Task<Account> GetAccountAsync(int\
    \ accountId)\n{\n    // Simulate fetching account data asynchronously\n    await\
    \ Task.Delay(100);\n    return new Account { Id = accountId, Balance = 5000 };\n\
    }\n\npublic async Task<List<Transaction>> GetRecentTransactionsAsync(int accountId)\n\
    {\n    // Simulate fetching recent transactions asynchronously\n    await Task.Delay(100);\n\
    \    return new List<Transaction>\n    {\n        new Transaction { Id = 1, Amount\
    \ = -100, Date = DateTime.UtcNow.AddDays(-1) },\n        new Transaction { Id\
    \ = 2, Amount = 200, Date = DateTime.UtcNow.AddDays(-2) },\n        new Transaction\
    \ { Id = 3, Amount = -50, Date = DateTime.UtcNow.AddDays(-3) }\n    };\n}\n```\n\
    \nNow, let’s build an asynchronous functional pipeline using our `Task` extension\
    \ methods and LINQ query syntax:\n\n```csharp\npublic async Task<(Customer, Account,\
    \ List<Transaction>)> FetchCustomerAccountDataAsync(int customerId, int accountId)\n\
    {\n    var result = await (from customer in GetCustomerAsync(customerId)\n   \
    \                     from account in GetAccountAsync(accountId)\n           \
    \             from transactions in GetRecentTransactionsAsync(accountId)\n   \
    \                     select (customer, account, transactions));\n    return result;\n\
    }\n```\n\nIn the `FetchCustomerAccountDataAsync` method, we combined the fetching\
    \ of customer data, account data, and recent transactions using LINQ query syntax\
    \ with our extension methods. This allows us to create an asynchronous pipeline,\
    \ which is both readable and maintainable.\n\nNow, let’s create another example\
    \ using our pipeline. This time, we’ll filter the recent transactions that exceed\
    \ a threshold:\n\n```csharp\npublic async Task<(Customer, Account, List<Transaction>)>\
    \ FetchFilteredAccountDataAsync(int customerId, int accountId, decimal threshold)\n\
    {\n    var result = await (from customer in GetCustomerAsync(customerId)\n   \
    \                     from account in GetAccountAsync(accountId)\n           \
    \             from transactions in GetRecentTransactionsAsync(accountId)\n   \
    \                     let filteredTransactions = transactions.Where(t => Math.Abs(t.Amount)\
    \ > threshold).ToList()\n                        select (customer, account, filteredTransactions));\n\
    \    return result;\n}\n```\n\nIn this method, we added a new step in the LINQ\
    \ query that filters the transactions before returning the result. The `let` keyword\
    \ allows us to introduce a `filteredTransactions` variable, which holds the filtered\
    \ list. The `Where` function is used to filter the transactions based on the given\
    \ threshold.\n\nNow that we’ve seen how to build asynchronous pipelines using\
    \ LINQ syntax, let’s explore how to handle errors in these pipelines. In the functional\
    \ world, the `Result` type (also known as the Either monad) is commonly used to\
    \ represent a result that may fail. To integrate the `Result` type in our pipeline,\
    \ let’s create a `TaskResult<T>` that represents an asynchronous computation that\
    \ may fail:\n\n```csharp\npublic class TaskResult<T>\n{\n    public Task<T> Value\
    \ { get; }\n    public TaskResult(Task<T> value)\n    {\n        Value = value;\n\
    \    }\n}\n```\n\nNow, we can create extension methods for the `TaskResult` class\
    \ similar to our `Task` extension methods. This will allow us to create functional\
    \ pipelines handle errors in a functional way.\n\n```csharp\npublic static class\
    \ TaskResultExtensions\n{\n    public static async TaskResult<TResult> Select<TSource,\
    \ TResult>(this TaskResult<TSource> taskResult, Func<TSource, TResult> selector)\n\
    \    {\n        var result = await taskResult.Value.ConfigureAwait(false);\n \
    \       return result.Success\n            ? new TaskResult<TResult>(Task.FromResult(new\
    \ Result<TResult>(selector(result.Value))))\n            : new TaskResult<TResult>(Task.FromResult(new\
    \ Result<TResult>(result.ErrorMessage)));\n    }\n\n    public static async TaskResult<TResult>\
    \ SelectMany<TSource, TResult>(this TaskResult<TSource> taskResult, Func<TSource,\
    \ TaskResult<TResult>> selector)\n    {\n        var result = await taskResult.Value.ConfigureAwait(false);\n\
    \        return result.Success\n            ? selector(result.Value)\n       \
    \     : new TaskResult<TResult>(Task.FromResult(new Result<TResult>(result.ErrorMessage)));\n\
    \    }\n\n    public static async TaskResult<TResult> SelectMany<TSource, TCollection,\
    \ TResult>(this TaskResult<TSource> taskResult, Func<TSource, TaskResult<TCollection>>\
    \ collectionSelector, Func<TSource, TCollection, TResult> resultSelector)\n  \
    \  {\n        var result = await taskResult.Value.ConfigureAwait(false);\n   \
    \     if (result.Success)\n        {\n            var source = result.Value;\n\
    \            var collectionResult = await collectionSelector(source).Value.ConfigureAwait(false);\n\
    \            return collectionResult.Success\n                ? new TaskResult<TResult>(Task.FromResult(new\
    \ Result<TResult>(resultSelector(source, collectionResult.Value))))\n        \
    \        : new TaskResult<TResult>(Task.FromResult(new Result<TResult>(collectionResult.ErrorMessage)));\n\
    \        }\n        else\n        {\n            return new TaskResult<TResult>(Task.FromResult(new\
    \ Result<TResult>(result.ErrorMessage)));\n        }\n    }\n}\n```\n"
