  trans: "\n\n您可以使用 NuGet 包管理器安装 `MoreLINQ`：\n\n```\nInstall-Package MoreLinq\n```\n\
    \n## 11.4. MoreLINQ: 实用示例\n\n在本节中，我们将探索使用 `MoreLINQ` 的实用示例，以函数式风格对集合进行更强大且更具表现力的操作。\n\
    \n注意：为了运行这些示例，请确保已安装 `MoreLINQ` NuGet 包，并在代码中添加了相应的 `using` 语句：\n\n```csharp\n\
    using MoreLinq;\n```\n\n### 11.4.1 DistinctBy\n\n`DistinctBy` 允许你根据键选择函数（key selector\
    \ function）过滤掉集合中的重复元素。\n\n```csharp\nclass Employee\n{\n public int Id { get;\
    \ set; }\n public string Name { get; set; }\n}\n\nvar employees =  new List<Employee>\n\
    {\n new Employee { Id = 1, Name = \"Alice\" },\n new Employee { Id = 2, Name =\
    \ \"Bob\" },\n new Employee { Id = 1, Name = \"Alice\" }\n};\n\nvar distinctEmployees\
    \ = employees.DistinctBy(e => e.Id).ToList();\n\nforeach (var employee in distinctEmployees)\n\
    {\n    Console.WriteLine($\"Employee Id: {employee.Id}, Name: {employee.Name}\"\
    );\n}\n\n// Output:\n// Employee Id: 1, Name: Alice\n// Employee Id: 2, Name:\
    \ Bob\n```\n\n### 11.4.2 Partition\n\n`Partition` 根据谓词函数（predicate function）将集合分为两个独立的集合。\n\
    \n```csharp\nvar numbers =  new[] { 1, 2, 3, 4, 5, 6 };\nvar (evens, odds) = numbers.Partition(n\
    \ => n % 2 == 0);\nConsole.WriteLine($\"Evens: {string.Join(\",  \", evens)}\"\
    );  // Output: \"Evens: 2, 4, 6\"\nConsole.WriteLine($\"Odds: {string.Join(\"\
    ,  \", odds)}\");  // Output: \"Odds: 1, 3, 5\"\n```\n\n### 11.4.3 TakeEvery\n\
    \n`TakeEvery` 从集合中选取每 N 个元素。\n\n```csharp\nvar numbers = Enumerable.Range(1, 10);\n\
    var everyThirdNumber = numbers.TakeEvery(3);\nConsole.WriteLine($\"Every third\
    \ number: {string.Join(\",  \", everyThirdNumber)}\");  // Output: \"Every third\
    \ number: 3, 6, 9\"\n```\n\n### 11.4.4 Scan\n\n`Scan` 对集合执行滚动聚合，对每个元素应用一个函数并累加结果。\n\
    \n```csharp\nvar numbers =  new[] { 1, 2, 3, 4, 5 };\nvar runningTotals = numbers.Scan(0,\
    \ (total, x) => total + x);\nConsole.WriteLine($\"Running totals: {string.Join(\"\
    ,  \", runningTotals)}\");  // Output: \"Running totals: 1, 3, 6, 10, 15\"\n```\n\
    \n在本节中，我们简要介绍了几个用于 C# 的函数式编程库，这些库补充并扩展了语言的核心特性。通过探索并将这些库整合到你的项目中，你可以进一步增强函数式编程技能，并充分利用\
    \ C# 中的函数式编程范式。\n\n# 第 12 章：现实世界应用与案例研究\n\n## 12.1 Web 开发中的函数式编程：一场受科幻启发的冒险\n\n\
    在不遥远的星系中，一组函数式编程先驱开启了一项任务，勇敢地前往没有任何开发者踏足过的地方。他们试图将函数式编程和事件溯源相结合，以创建更优雅、易于维护且可扩展的\
    \ Web 应用程序。他们以 C# 为首选编程语言，展示函数式编程和事件溯源在现代 Web 开发中的威力。\n\n### Language-Ext：函数式编程的跃速引擎\n\
    \n在 C# 宇宙中，`Language-Ext` 是一个强大的库，将函数式编程的精华带入了 .NET 世界。通过利用不可变数据结构、单子（monads）和代理（agents）等高级特性，开发者可以创建高效且安全的\
    \ Web 应用程序。在旅程中，我们将创建一个钱包 API，允许用户使用函数式方法向钱包添加和移除银河积分，使用代理来避免并发问题，并使用事件溯源跟踪更改。\n\
    \n### 事件溯源：时间基本指令\n\n事件溯源是一种架构模式，将应用程序的状态表示为事件序列。而不是直接更新状态，而是将更改记录为事件，允许通过重放这些事件来重建状态。这种方法提供了许多优势，例如改进的可扩展性、简化的调试和内置的审计轨迹。通过将事件溯源集成到我们的钱包\
    \ API 中，我们将遵循“时间基本指令”，确保钱包余额变化的正确历史记录。\n\n### MongoDB：星际数据库\n\n为了存储我们的事件，我们将使用\
    \ `MongoDB`，这是一个流行且灵活的 NoSQL 数据库。这将允许我们持久化事件并在需要时重建钱包状态。首先，设置 MongoDB 连接并创建一个存储钱包事件的集合。\n\
    \n通过添加以下包安装 C# 的 MongoDB 驱动：\n\n```\ndotnet add package MongoDB.Driver\n```\n\n\
    现在，让我们设置 MongoDB 连接并创建一个 `WalletEventRepository` 来处理事件的保存和加载。\n\n```csharp\nusing\
    \ MongoDB.Driver;\n\npublic class WalletEventRepository\n{\n    private readonly\
    \ IMongoCollection<WalletEvent> _walletEvents;\n    public WalletEventRepository(string\
    \ connectionString, string databaseName, string collectionName)\n    {\n     \
    \   var client = new MongoClient(connectionString);\n        var database = client.GetDatabase(databaseName);\n\
    \        _walletEvents = database.GetCollection<WalletEvent>(collectionName);\n\
    \    }\n    public async Task SaveEvent(WalletEvent walletEvent) => await _walletEvents.InsertOneAsync(walletEvent);\n\
    \    public async Task<List<WalletEvent>> GetAllEvents() => await _walletEvents.Find(_\
    \ => true).ToListAsync();\n}\n```\n\n### 带有事件溯源的钱包代理\n\n首先，我们使用 `Actor` 类创建钱包代理。该代理将处理并发并确保一次只执行一个操作。我们将事件溯源集成到钱包中以更改，并使用\
    \ `MongoDB` 存储事件。\n\n```csharp\nusing LanguageExt;\nusing Prelude;\nusing System.Collections.Immutable;\n\
    \npublic class WalletAgent\n{\n    private readonly Actor<ImmutableList<WalletEvent>>\
    \ agent;\n    private readonly WalletEventRepository eventRepository;\n    public\
    \ WalletAgent(WalletEventRepository eventRepository)\n    {\n        this.eventRepository\
    \ = eventRepository;\n        agent = Actor<ImmutableList<WalletEvent>>.Create(async\
    \ (events, msg) => msg switch\n        {\n            AddMoney addMoney =>\n \
    \           {\n                var newEvent = new WalletEvent.Added(addMoney.Amount);\n\
    \                await eventRepository.SaveEvent(newEvent);\n                return\
    \ events.Add(newEvent);\n            },\n            RemoveMoney removeMoney =>\n\
    \            {\n                var newEvent = new WalletEvent.Removed(removeMoney.Amount);\n\
    \                await eventRepository.SaveEvent(newEvent);\n                return\
    \ events.Add(newEvent);\n            },\n            _ => events\n        }, ImmutableList<WalletEvent>.Empty);\n\
    \    }\n    public async Task<ImmutableList<WalletEvent>> AddMoney(decimal amount)\
    \ => await agent.Ask<ImmutableList<WalletEvent>>(new AddMoney(amount));\n    public\
    \ async Task<ImmutableList<WalletEvent>> RemoveMoney(decimal amount) => await\
    \ agent.Ask<ImmutableList<WalletEvent>>(new RemoveMoney(amount));\n    public\
    \ async Task<decimal> GetBalance()\n    {\n        var events = await eventRepository.GetAllEventsAsync();\n\
    \        return events.Aggregate(0m, (balance, evt) => evt switch\n        {\n\
    \            WalletEvent.Added added => balance + added.Amount,\n            WalletEvent.Removed\
    \ removed => balance - removed.Amount,\n            _ => balance\n        });\n\
    \    }\n}\n```\n\n现在我们已经了具有事件溯源能力和 MongoDB 集成的钱包代理，让我们定义它将处理的消息和事件：\n\n```csharp\n\
    public abstract record WalletMessage;\npublic record AddMoney(decimal Amount)\
    \ : WalletMessage;\npublic record RemoveMoney(decimal Amount) : WalletMessage;\n\
    public record GetBalance() : WalletMessage;\n\npublic abstract record WalletEvent;\n\
    public static class WalletEvent\n{\n public record Added(decimal Amount) : WalletEvent;\n\
    \ public record Removed(decimal Amount) : WalletEvent;\n}\n```\n\n"
