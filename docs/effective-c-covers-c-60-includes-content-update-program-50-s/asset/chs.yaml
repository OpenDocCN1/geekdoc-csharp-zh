  \n# C 语言习惯\n\n如果你现在做的事情有效，为什么要改变它呢？答案是你可以做得更好。你改变工具或语言是因为你可以提高效率。如果不改变习惯，你就无法意识到预期的收益。当新语言\
  \ C# 与熟悉的语言（如 C++ 或 Java）有许多相似之处时，这会变得更加困难。C# 是另一种使用大括号的语言，让你很容易掉入你在其他语言中使用的习惯。这将阻碍你充分利用\
  \ C#。C# 语言自 2001 年首次发布以来一直在不断进化。它比最初版本离 C++ 或 Java 大得多。如果你是从其他语言接触 C#，你需要学习 C# 的习惯，让语言为你服务，而不是反对你。本章讨论了你应该改变的习惯——以及你应该怎么做。\n\
  \n## 项目 1：优先使用隐式类型局部变量\n\n隐式类型局部变量引入 C# 语言是为了支持匿名类型。使用隐式类型局部变量的第二个原因是，某些查询的结果是 `IQueryable<T>`，而另一些则返回\
  \ `IEnumerable<T>`。如果你将 `IQueryable<T>` 强制转换为 `IEnumerable<T>` 集合，你就会错过 `IQueryProvider`\
  \ 提供的任何增强（见第 42 项）。\n\n\n\n\n我更倾向于使用 `var` 并用它来声明许多局部变量，因为我发现这让开发者的注意力集中在重要部分（语义含义），而不是变量类型的细节上。如果我创建了无法通过类型检查的结构，编译器仍然会警告我。变量的类型安全并不等同于开发者编写完整的类型名。在许多情况下，`IQueryable`\
  \ 和 `IEnumerable` 之间的差异并没有为开发者的你提供任何信息。然而，如果你尝试告诉编译器它是哪种类型，你会发现通过错误的类型可以改变行为（参见第\
  \ 42 项）。有时候，使用隐式类型变量更好，因为编译器选出的类型会比你选的更好。但在其他时候，过度使用 `var` 只会降低代码的可读性。更糟糕的是，使用隐式类型变量可能会导致微妙的转换错误。\n\
  \n局部类型推断\n局部类型推断对 C# 中使用的静态类型没有产生实际影响。这是为什么呢？首先，你需要理解局部类型推断不等同于动态类型。用 `var` 声明的变量不是动态的，而是根据赋值右侧的类型隐式声明的。使用\
  \ `var`，你并没有告诉编译器你正在创建哪种类型；而是编译器为你声明了类型。\n\n## 可读性\n让我们从可读性问题开始。很多时候，局部变量的类型从其初始化语句就可以看出：\n\
  \n```csharp\nvar foo = new MyType();\n```\n\n任何胜任的开发者都能从声明判断出 `foo` 的类型。同样，大多数工厂方法也是清晰的：\n\
  \n点击此处查看代码图像\n\n```csharp\nvar thing = AccountFactory.CreateSavingsAccount();\n\
  ```\n\n然而，在某些情况下，返回类型并不总是从方法名看出：\n\n点击此处查看代码图像\n\n```csharp\nvar result = someObject.DoSomeWork(anotherParameter);\n\
  ```\n\n当然，这是一个刻意的例子，我希望你代码库中的大多数方法的名称都能更好地指示返回了什么。即使在这个刻意的例子中，一个更好的变量名也能为大多数开发者提供更好的含义指示：\n\
  \n点击此处查看代码图像\n\n```csharp\nvar HighestSellingProduct = someObject\n    .DoSomeWork(anotherParameter);\n\
  ```\n\n即使没有任何类型信息，大多数开发者也会正确地假设 `Product` 的类型。\n\n取决于 `DoSomeWork` 的实际签名，当然，`HighestSellingProduct`\
  \ 实际上可能并不是 `Product`。它可能是任何派生自 `Product` 的类，甚至是 `Product` 实现的任何接口。编译器认为 `HighestSellingProduct`\
  \ 就是 `DoSomeWork` 方法签名告诉它的任何类型。\n\n运行时类型实际上是 `Product` 并不并不重要。当编译时类型与运行时类型不同时，编译器总是胜出的。除非你使用某种类型转换，否则你没有发言权。\n\
  \n我们已经进入了 `var` 引入可读性问题的领域。引入 `var` 作为存储方法返回值的变量类型，是使用 `var` 困扰阅读你代码的开发者的方式之一。阅读代码的人会假设一种类型。在运行时，人类可能是正确的。但编译器并没有机会检查对象的运行时类型。编译器检查的是编译时类型，并根据这些声明推断局部变量的类型。变化的是，现在由编译器决定变量的声明类型。当你自己声明类型时，其他开发者可以看到声明类型。相比之下，当你使用\
  \ `var` 时，编译器决定了类型，但开发者可能看不到写出来的类型。由于你编写代码的方式，人类读者和编译器对涉及的类型得出了不同的结论。这将维护错误和可以避免的错误。\n\
  \n## 数值类型\n当你声明内置数值类型的变量时，让我们继续观察由隐式类型局部变量引起的问题。内置数值类型之间存在大量的转换。宽化转换（例如从 `float`\
  \ 到 `double`）始终是安全的。还有窄收转换（例如从 `long` 到 `int`），这些转换涉及精度的损失。通过显式声明所有数值变量的类型，你保留了对所用类型的某些控制，并帮助编译器警告你可能存在的危险转换。\n\
