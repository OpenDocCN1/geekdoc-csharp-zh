  # 索引\n\n## 引言\n\n2016 年的 C# 社区与 *Effective C#* 第一版出版时的 2004 年非常不同。使用 C# 的开发者多得多。C#\
  \ 社区的大部分人现在将 C# 视为他们的第一职业语言。他们并不是带着使用其他语言形成的根深习惯来接触 C# 的。社区的经验范围广泛得多。从应届毕业生到拥有十年经验的专业人士都在使用\
  \ C#。\n\n该社区的经验范围广泛得多。从应届毕业生到拥有十年经验的专业人士都在使用 C#。\n\n该社区的经验范围广泛得多。从应届毕业生到拥有十年经验的专业人士都在使用\
  \ C#。\n\n在这一版中，我正在重新组织这两本书以及新版。*Effective C#* 不会带你开启该语言的历史之旅。相反，它讨论了你如何将当前版本 C#\
  \ 语言的所有特性集成到你的日常开发中。\n\n书中的许多建议都可以通过基于 Roslyn 的分析器和代码修复进行验证。我在这里维护了它们的仓库：`https://github.com/BillWagner/EffectiveCSharpAnalyzers`。如果你有想法或想贡献，请提交\
  \ issue 或向我发送 pull request。除了语言特性外，我假设你对通用语言运行时 (`CLR`) 和即时编译程序 (`JIT`) 有一些了解。\n\
  \n### 关于内容\n\n在你自己编写的几乎每个 C# 程序中，你每天都会用到语言结构。第 1 章“C# 语言惯用法”涵盖了你将频繁使用的那些语言惯用法，它们应该感觉像你手中顺手的工具。这些是你创建的每种类型和实现的每个算法的构建组件。\n\
  \n在托管环境中工作并不意味着环境免除了你的所有责任。你仍然必须与环境协作，创建满足规定性能要求的正确程序。这不仅仅关于性能测试和性能调优。第 2 章“.NET\
  \ 资源管理”将教你设计惯用法，让你能够在详细优化开始之前与环境协作来实现这些目标。\n\n泛型是自 C# 2.0 以来添加到 C# 语言的所有内容的启用技术。第\
  \ 3 章“使用泛型”涵盖了作为 `System.Object` 转换的替代品的泛型，然后讨论了高级技术，如约束、泛型特化、方法约束和向后兼容。你将学习几种技术，通过这些技术，泛型将让你更容易表达你的设计意图。\n\
  \n\n\n\n\n# 第 4 章：使用 LINQ\n\n`LINQ` 解释了查询、查询语法以及相关功能。你将了解到何时使用扩展方法来将合约与实现分离，如何有效地使用\
  \ C# 闭包，以及如何使用匿名类型进行编程。你将学习编译器如何将查询关键字映射到方法调用，如何区分委托和表达式树（并在需要时它们之间进行转换），以及在寻找标量结果时如何对查询进行转义（escape）。\n\
  \n# 第 5 章：异常实践\n\n`Exception Practices`（异常实践）提供了在现代 C# 程序中管理异常和错误的指导。你将学习如何确保错误被正确报告，以及在发生错误如何保持程序状态的一致性并在理想情况下保持不变。你将学习如何为使用你代码的开发者提供更好的调试体验。\n\
  \n## 代码规范\n\n在书中展示代码仍然需要在空间和清晰度之间做出一些权衡。我尝试精简示例，以说明示例的特定要点。这通常意味着省略类或方法的其他部分。有时为了空间，这会包括省略错误恢复代码。公共方法应该验证其参数和其他输入，但这些代码通常为了空间而被省略。类似的空间考虑还去除了方法调用的验证以及复杂算法中经常包含的\
  \ `try/finally` 句。\n\n我通常假设当示例使用常用命名空间时，大多数开发者都能找到相应的命名空间。你可以安全地假设每个示例隐式包含了以下 `using`\
