    8\. Binary Search:


    using System;


    class BinarySearch {


    static int Search(int[] arr, int x) {


    int left = 0, right = arr.Length - 1;


    while (left <= right) {


    int mid = left + (right - left) / 2;


    if (arr[mid] == x)


    return mid;


    if (arr[mid] < x)


    left = mid + 1;


    else


    right = mid - 1;


    }


    return -1;


    }


    static void Main() {


    int[] arr = { 2, 3, 4, 10, 40 };


    int x = 10;


    int result = Search(arr, x);


    if (result == -1)


    Console.WriteLine("Element not present");


    else


    Console.WriteLine("Element found at index " + result);


    }


    }


