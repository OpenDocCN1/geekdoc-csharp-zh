    using System;


    class LCMofNNumbers {


    static int FindGCD(int a, int b) {


    while (b != 0) {


    int temp = b;


    b = a % b;


    a = temp;


    }


    return a;


    }


    static int FindLCM(int[] arr, int n) {


    int lcm = arr[0];


    for (int i = 1; i < n; i++) {


    lcm = (lcm * arr[i]) / FindGCD(lcm, arr[i]);


    }


    return lcm;


    }


