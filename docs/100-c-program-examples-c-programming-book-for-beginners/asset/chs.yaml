  ```csharp\nusing System;\nclass StrongNumber {\n    static int Factorial(int num)\
  \ {\n        if (num == 0 || num == 1)\n            return 1;\n        return num\
  \ * Factorial(num - 1);\n    }\n    static void Main() {\n        Console.WriteLine(\"\
  输入一个数字: \");\n        int num = Convert.ToInt32(Console.ReadLine());\n        int\
  \ originalNum = num;\n        int sum = 0;\n        while (num > 0) {\n        \
  \    int digit = num % 10;\n            sum += Factorial(digit);\n            num\
