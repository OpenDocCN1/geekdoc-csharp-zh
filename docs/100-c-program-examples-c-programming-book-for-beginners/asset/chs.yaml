  class GCDandLCM {\n    static int FindGCD(int a, int b) {\n        while (b != 0)\
  \ {\n            int temp = b;\n            b = a % b;\n            a = temp;\n\
  \        }\n        return a;\n    }\n    static int FindLCM(int a, int b) {\n \
  \       return (a * b) / FindGCD(a, b);\n    }\n    static void Main() {\n     \
  \   Console.WriteLine(\"Enter two numbers: \");\n        int num1 = Convert.ToInt32(Console.ReadLine());\n\
  \        int num2 = Convert.ToInt32(Console.ReadLine());\n        Console.WriteLine(\"\
