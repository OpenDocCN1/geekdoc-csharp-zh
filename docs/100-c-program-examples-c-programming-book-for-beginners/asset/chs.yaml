  ```csharp\nusing System;\n\nclass BinarySearch {\n    static int Search(int[] arr,\
  \ int x) {\n        int left = 0, right = arr.Length - 1;\n        while (left <=\
  \ right) {\n            int mid = left + (right - left) / 2;\n            if (arr[mid]\
  \ == x)\n                return mid;\n            if (arr[mid] < x)\n          \
  \      left = mid + 1;\n            else\n                right = mid - 1;\n   \
  \     }\n        return -1;\n    }\n\n    static void Main() {\n        int[] arr\
  \ = { 2, 3, 4, 5, 6 };\n        int x = 4;\n        int result = Search(arr, x);\n\
  \        if (result == -1)\n            Console.WriteLine(\"元素不存在\");\n        else\n\
  \            Console.WriteLine(\"元素位于索引 \" + result);\n    }\n}\n```\n\n### 9. 检查字符串是否为字母位词\n\
