  \nclass MergeSort {\n    static void Merge(int[] arr, int l, int m, int r) {\n \
  \       int n1 = m - l + 1;\n        int n2 = r - m;\n        int[] L = new int[n1];\n\
  \        int[] R = new int[n2];\n        for (int i = 0; i < n1; ++i)\n        \
  \    L[i] = arr[l + i];\n        for (int j = 0; j < n2; ++j)\n            R[j]\
  \ = arr[m + 1 + j];\n        int k = l;\n        int x = 0, y = 0;\n        while\
  \ (x < n1 && y < n2) {\n            if (L[x] <= R[y]) {\n                arr[k]\
  \ = L[x];\n                x++;\n            }\n            else {\n           \
  \     arr[k] = R[y];\n                y++;\n            }\n            k++;\n  \
  \      }\n        while (x < n1) {\n            arr[k] = L[x];\n            x++;\n\
  \            k++;\n        }\n        while (y < n2) {\n            arr[k] = R[y];\n\
  \            y++;\n            k++;\n        }\n    }\n    static void Sort(int[]\
  \ arr, int l, int r) {\n        if (l < r) {\n            int m = l + (r - l) /\
  \ 2;\n            Sort(arr, l, m);\n            Sort(arr, m + 1, r);\n         \
  \   Merge(arr, l, m, r);\n        }\n    }\n    static void Main() {\n        int[]\
  \ arr = { 12, 11, 13, 5, 6 };\n        int n = arr.Length;\n        Sort(arr, 0,\
  \ n - 1);\n        Console.Write(\"Sorted array: \");\n        foreach (int element\
  \ in arr) {\n            Console.Write(element + \" \");\n        }\n    }\n}\n\n\
