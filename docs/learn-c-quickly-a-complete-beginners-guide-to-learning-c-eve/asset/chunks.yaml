    在 `packages` 文件夹中，包含了应用程序内部的外部库和其他源码，我们在某些功能上需要它们。这些包的示例包括 `Entity Framework`、依赖注入（Dependency
    Injection）支持等。下面你可以看到文件夹结构。


    ### 文件夹结构

    - **DataAccess**: DataAccess 文件夹，包含一个表示数据库上下文（database context）内容的类。该文件夹是应用程序的数据层。在该文件夹中，将包含所有与数据库配置和管理相关的内容。

    - **Interfaces**: 下一个文件夹，我们将在这里存储应用程序的接口组件。这里只有一个接口组件 - `IVehicle` 接口。

    - **Objects**: 下一个文件夹。在这个文件夹中，包含了数据操作所需的实体类。你在这里可以看到三个类：`Car`、`Truck` 和 `Vehicle`
    类。

    - **ServiceInterfaces**: 下一个文件夹。这里我们有接口组件，负责服务对象的依赖注入。每个接口都将有一个实现它的类。

    - **Services**: 最后一个文件夹。正如你可能已经注意到的，这些是实现上一个文件夹中接口的服务类。这些服务类将将用于依赖注入。

    - **Program.cs**: 最后，有一个 `Program.cs` 文件，其中包含一个带有 `Main` 方法的 `Program` 类。正如我们目前所学的，在这个方法内部，所有内容将被整合在一起并确保精确运行。


    现在，让我们将其拆解并逐部分解释。


    ### Objects 文件夹逻辑

    ![](img/image_rsrc1C2.jpg)!(image_rsrc1C3.jpg)


    在类实现之前，我们插入了来自 `Interfaces` 文件夹中唯一接口组件的代码。该接口有两个只读属性，名称为 `IVehicle`。这两个属性别是布尔类型的
    `IsAutomatic` 和字符串类型的 `Vin`。


    在接口组件下方，我们暴露了 `Objects` 文件夹内三个类的每个代码。


    #### Vehicle 类

    第一个类是 `Vehicle` 类。该类实现了 `IVehicle` 接口，这意味着它将拥有 `IVehicle` 中两个属性的实现。除了这两个属性外，它还包含一个
    `int` 数据类型的 `Id` 属性。`IsAutomatic` 和 `Vin` 属性实现了 `protected set`，这意味着这些属性可以在父类和继承类内部进行值赋值。在属性定义之后，有一个
    `Vehicle` 构造函数，它接收两个参数并将它们的值分别分配给 `IsAutomatic` 和 `Vin` 属性。


    #### Car 类

    下一个类是 `Car` 类。该类继承自 `Vehicle` 类 - 所以 `Vehicle` 类是 `Car` 类的父类。它可以访问 `Vehicle` 类的所有属性，并且它也有自己的属性。`Car`
    的属性是 `TrunkSpace` 只读属性。`Car` 自己的构造函数使用了三个参数，即为 `IsAutomatic` 属性、`Vin` 属性和 `TrunkSpace`
    属性的值。该构造函数将参数中的父类属性值传递给基构造函数。这意味着它在传递 `isAutomatic` 和 `vin` 参数值的情况下调用了基构造函数。


    在自己的构造函数实现中，对 `trunkSpace` 参数值是否大于五百进行了检查。如果该条件为真，程序将抛出一个异常，信息为“Trunk space for
    a car cannot exceed 500”。在条件检查下方，是 `TrunkSpace` 属性的经典属性初始状态赋值。


    #### Truck 类

    最后一个类是 `Truck` 类，它也继承自 `Vehicle` 类。我们可以假设 `Truck` 和 `Car` 是 `Vehicle` 类的子类。它有一个名为
    `BedSpace` 的只读属性。在 `Truck` 构造函数中，有与 `Car` 构造函数类似的操作。传递了三个参数，其中两个被传递给基类构造函数，即 `isAutomatic`
    和 `vin` 参数值。在自己的构造函数体中，有一个检查查看 `bedSpace` 参数值是否小于五百。同样，与 `Car` 类一样，如果该条件为真，程序将抛出一个异常，信息为“Trunk
    space for a truck cannot be below 500”。之后，是 `BedSpace` 只读属性的通用属性状态赋值。


    ### 数据层 (VehicleContext)

    接下来要解释的是 `DataLayer`，在此情况下，它代表 `VehicleContext` 类。让我们来看代码：![](img/image_rsrc1C4.jpg)!(image_rsrc1C5.jpg)


    这是一个数据层类。`VehicleContext` 类扩展了来自 `Entity Framework` 包的 `DbContext` 类。在这个类中，我们可以看到公共构造函数。

    1. 第一个是空构造函数，它在不分配任何初始状态的情况下创建 `VehicleContext` 的实例。

    2. 第二个构造函数接收一个 `DbContextOptions<VehicleContext>` 对象的参数。此构造函数也没有自己的实现。尽管如此，它将
    `DbContextOptions` 对象传递给 `DbContext` 类中的基构造函数，以便为上下文分配选项。此构造函数强制 `Entity Framework`
    执行上下文初始化而不是由我们执行。


    构造函数之后，有三个 `DbSet` 属性。每一个都代表数据库中的表内容。第一个将是 `Vehicle` 数据库集，第二个和第三个是它的子类 `Car` 和
    `Truck` 数据库集。


    然后，是 `DbContext` 类的标准重写方法 `OnConfiguring`。在这里我们只是检查 `DbContextBuilder` 是否配置。如果没有配置，我们将抛出一个信息为“Must
    pass optionsBuilder in for use”的异常。


    该类的最后一点是对 `OnModelCreating` 方法的重写。此方法为模型属性设置流式配置，并在需要时添加额外的绑定和逻辑。此方法接收一个参数，该参数是一个
    `ModelBuilder` 类对象，负责管理实体的流式配置。在这个重写实现中，对 `Car` 和 `Truck` 模型对象的每个属性执行了 `ValueGeneratedNever()`
    方法。这意味着当保存实体实例时，这些属性的每一个永远不会由数据库生成值。在执行此操作后，调用了基类的 `OnModelCreating` 方法以配置通用流式数据库工作。以上是关于我们汽车经销商应用程序数据层类的全部。


    ### ServiceInterfaces

    我们现在转向基于依赖注入的组件![](img/image_rsrc1C6.jpg)


    接下来详细介绍 `ServiceInterfaces` 文件夹。在该文件夹内部，我们有两个服务接口组件，它们将由服务类实现以实现依赖注入。第一个接口组件是
    `IDealershipService`。该接口是面向经销商的接口，它包含四个方法的签名：

    1. `GetInventory` 方法，它将在实现中返回 `IVehicle` 类型对象的 `List`。

    2. `GetVehicle` 方法，它接收一个参数 - 车辆识别码，基于此方法为调用者返回 `IVehicle` 类型对象。

    3. 然后，是 `SellVehicle` 方法，它显然根据传递的车辆识别码从特定的库存中移除车辆。

    4. 最后，


