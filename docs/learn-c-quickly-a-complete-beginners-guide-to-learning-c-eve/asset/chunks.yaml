    class property Grade, as well as its Superclass properties FirstName and LastName.
    Great, the compiler is not reporting any errors. Let''s try to do something similar
    with the Teacher class. First, we created an object of a Teacher class; then,
    we assigned a Salary property value and the FirstName, LastName values whose properties
    belong to the Superclass. Now, we run the program and see what happens:![](image_rsrc19G.jpg)Everything
    went well, and the inheritance is proven.It is important to know that there are
    different types of inheritances:  Single inheritance  - there is only one Superclass
    with just one Subclass. Example:class A{// code for the A class}class B : A{//
    code for the B class}Multilevel inheritance  - there is one class that represents
    the Subclass for one class and a Superclass for the other class. Example:class
    A{// code for the A class}class B : A{// code for the B class}class C : B{// code
    for the C class}Hierarchical inheritance  - there is one Superclass that has more
    than one child class. Example:class A{// code for the A class}class B : A{// code
    for the B class}class C : A{// code for the C class}In the inheritance principle,
    there is one more vital thing to know. It is the use of a protected  keyword.
    As promised earlier in the Access modifiers subchapter, the protected keyword
    will be explained here. The protected keyword is used while working with the inheritance
    paradigm. It is an access modifier that commonly shows up right here in the inheritance
    feature. A protected member of a particular class specifies the component which
    is accessible from within the class in which it is declared. Still, it is also
    accessible from within any subclass of that class. An example can be seen below:![](image_rsrc19H.jpg)In
    this example, there is one Superclass, which is the ParentClass and one Subclass,
    which is the ChildClass. In the ParentClass, there are two string data type fields.
    The first field is private, and its value is set to "Private." The second field
    is the protected field, and its value is set to "Protected." Below the ParentClass,
    there is a ChildClass that inherits from the ParentClass. In this class, there
    is only one method - the Print() method. What this method does is that it prints
    out to the console the value of the protected field from the Superclass. As you
    can see, this is allowed, and the compiler did not report any errors.On the other
    hand, in the commented code below, there is an attempt to access the private field
    of a Superclass and write its value to the console output. That is not allowed,
    and the compiler would report an error, and that is why it is commented. In the
    Program class, we will demonstrate how all of this works just smoothly. In the
    Main method, a ChildClass object is instantiated. After it, we then call the Print()
    method over this ChildClass object. At that particular moment, the ChildClass
    object state has all the rights to access the protected member of its parent class.
    That is why this program is executed correctly, and we will see something like
    this on the standard output:![](image_rsrc19J.jpg)The program has printed the
    “Protected” string into the output, which was expected.6.3 - AbstractionAbstraction
    is an object-oriented programming concept that represents the code implementation
    hiding or detail hiding. It is related to the encapsulation concept. So, encapsulation
    represents data hiding, and abstraction provides implementation hiding. One of
    the advantages of abstraction is reducing the complexity of viewing things such
    as implementation. Abstraction is a very useful principle because it ensures that
    only important information is provided to the user. This helps a lot when dealing
    with security in the application or program. Abstraction can be achieved by using
    interface components or abstract classes. Let us demonstrate the example of abstraction
    with the use of an abstract class:![](image_rsrc19K.jpg)In this example, we have
    one abstract class and three derived classes from that abstract class. The abstract
    class is the Ball class. Inside this class, there is only one member and this
    member is the declaration of a public string data type method Size(). This method
    implementation will be provided in the child classes because we want to achieve
    abstraction. This way, the implementation of the Size() method is hidden, which
    is a characteristic of the abstraction principle. Then, we created three subclasses
    that inherit from the superclass Ball, and these classes are TableTennisBall,
    TennisBall, and BasketBall. Each child class has its own override implementation
    of the Size() method. TableTennisBall class returns a "Small" string, TennisBall
    class returns a "Medium" string, and BasketBall class returns a "Big" string as
    a result of the Size() method. Now we get all of this live and demonstrative in
    the Main method of a Program class:![](image_rsrc19M.jpg)The abstraction demonstration
    is here. First, we will instantiate a List of Ball data type objects. Since the
    Ball is an abstract class, it cannot be instantiated, but it can be used as the
    class type when using the child classes. In this list of Ball data types, we have
    added three objects. For every derived class, we instantiated one object. They
    all inherit from the Ball class so that they can belong to the list of Ball data
    types. After that, we would want to iterate through the Ball list and write the
    size of each ball to the console. This can be achieved with a foreach statement
    where we write each result of a Size() method called over each object in a list
    to the standard output. Since there are three objects in a list, there will be
    three lines of the output. In every iteration, the Size() method is called over
    to that particular object. This Size() method execution will jump into different
    implementation every time based on the object type. So, it will return "Small"
    for TableTennisBall, "Medium" for the TennisBall, and "Big" for the BasketBall.
    This way, abstraction is achieved - we have hidden the explicit implementation
    of the Size() method. The output of this program will look like this:![](image_rsrc19N.jpg)In
    the second example, we will demonstrate the abstraction using the interface components
    in the program:![](image_rsrc19P.jpg)The first thing that we will declare is two
    interface components. The first interface is the IModernEngine - with one string
    property, which is the EngineType. The EngineType property has only the get accessor,
    which means that it will be a read-only property in the class or classes that
    will implement the IModernEngine interface. The second interface is IModernTransmission.
    In this interface, there is also just one property. This property is of a bool
    data type, and its name is IsAutomatic. This property also has only the get accessor
    - the class or classes that will implement the IModernTransmission interface will
    have a read-only property, IsAutomatic, in their implementation. These interface
    components will serve as some kind of type in this program. Let us move on to
    the code.![](image_rsrc19R.jpg)Here we have a ModernEngine class that implements
    the previously exposed interface IModernEngine . It has one private field, _numberOfCylinders
    , and the implementation of the EngineType property from the IModernEngine interface.
    This property must have its value set in the constructor because that is the only
    way besides the initialization on the declaration level. The ModernEngine class
    has one parameter in the constructor, and that is the int data type numberOfCylinders
    . In the constructor, there is a number of cylinders check. There are five valid
    possibilities that will result in the EngineType property assignment. When four
    cylinders are passed, the property value will be set to "Inline 4". Then, if six
    cylinders are passed, the property value will be set to "V6".Similarly, if eight
    cylinders are passed, the property value will be set to "V8"; if ten cylinders
    are passed, the property value will be set to "V10", and if twelve cylinders are
    passed, the property value will be set to "V12". If there is no corresponding
    condition that matches the valid number of cylinders, then the Exception will
    be thrown with the message "Invalid number of cylinders, unable to create Engine."
    If the property value is set and valid, the private field _numberOfCylinders will
    also be assigned with the passed value. ![](image_rsrc19S.jpg)Here, we created
    a class that will put interface IModernTransmission to use. The ModernTransmission
    class implements this interface, which means that it contains IsAutomatic property
    implementation. This read-only property is also set in the constructor of the
    class.![](image_rsrc19T.jpg)In this class implementation, we will start to get
    more familiar with the abstraction principle. The ModernCar class does not implement
    any of the interfaces. This class contains next members: public property ModernEngine,
    which is of IModernEngine data type (as mentioned earlier, the usage of the interfaces
    in this program is to have a type role), and another public property - ModernTransmission
    that is of the IModernTransmission data type. Both properties are read-only because
    they have only the get accessor. We will initialize their values in the constructor
    of the ModernCar class—the main part of this class is the constructor and its
    implementation. The constructor takes two arguments, one of IModernEngine type
    and the other of IModernTransmission type. This means that any object of a class
    that implements these two interfaces can be passed when creating an instance of
    a ModernCar class. This way, abstraction is visible because there is no explicit
    type that the ModernCar takes as an argument of its constructor. It is not tightly
    related to some type. Every object of the type (class) that implements these two
    interfaces can be passed here, and an instance of a ModernCar object can be created.
    In the body code part of a constructor, there is just a property assignment with
    the objects that are passed when creating an instance of a ModernCar class.![](image_rsrc19U.jpg)Besides
    the ModernCar class, here we exposed a  ClassicCar  class. This class has two
    public properties: a string EngineType and a bool IsAutomatic. Again, these properties
    are just read-only. This class has a classic constructor, with no flexible assignments
    like that of the ModernCar class. The constructor here, takes two parameters,
    the integer value  numberOfCylinders  and a bool value  isAutomatic . The IsAutomatic
    property is assigned directly, which is not the case with the EngineType property.
    We have the if-else conditions that control the value that will be assigned to
    the EngineType based on the isAutomatic parameter passed. The conditions are the
    same as in some of the previous class constructors (.."V6", "V8", "V10"..). There
    is also an Exception situation if there is no corresponding condition for property
    assignment. Now, let''s bring all of this together and demonstrate the use of
    interfaces and what they bring here.![](image_rsrc19V.jpg)A standard Main function
    inside the Program class brings us the next logic this time: The first thing here
    is the creation of the ClassicCar object instance. The ClassicCar constructor
    is invoked with the six cylinders and a true value for IsAutomatic property. The
    EngineType property assigned to this object is "V6" because of the parameter passed
    while creating an instance of the ClassicCar object. After this, we print the
    EngineType of the previously created object to the console output. The "V6" should
    be seen on the screen.'
