    implementing the abstract definitions. In the abstract classes, there could as
    well be abstract methods  or non-abstract methods. The abstract methods, as well
    as every class member that is marked as abstract, must be implemented in the derived
    class. The classes that are marked with the abstract keyword have the purpose
    of providing the prototype for the derived classes. An abstract class can have
    a constructor implemented. An example is provided below:![](image_rsrc18W.jpg)
    ![](image_rsrc18X.jpg)In the provided example, we can see one abstract class with
    the name Animal. In this class, there is only one member, and that is an abstract
    void method LegsNumber(). When the method is marked as abstract, it means that
    every class derived from that class, as in this case, an Animal class, must have
    an override implementation of that method. Below the abstract class, there are
    two more classes, which are the ''normal'' classes. Both classes have the override
    implementation of a LegsNumber() method from the Animal class. That is because
    both the Elephant and Pigeon classes inherit from the Animal class. Inheritance
    will be explained in detail in a later chapter, but for now, the '':'' symbol
    next to the Elephant and Pigeon class means that they inherit from the Animal
    class. In this case, this means that they must have their own implementation of
    the abstract method from the base class. In the Main method of a Program class,
    there is a declaration of an Animal type variable named animal . Note that there
    is no instantiation of the Animal class because that is not possible, and the
    reason is that the Animal class is an abstract class - so it cannot be instantiated.
    In the next line, the program is instantiating an object of Elephant class into
    the Animal type variable. This is allowed because Animal is the base class of
    the Elephant class. After it, there is a call to the LegsNumber method from the
    animal variable. Furthermore, since the animal is instantiated to be an Elephant
    type, this call executes the LegsNumber method from the Elephant class. The next
    thing is the instantiation of the Pigeon object and assigning it to the same animal
    variable. It ends up with calling the LegsNumber method again from the animal
    object. This time implementation of the LegsNumber from the Pigeon class is used.
    The console output will look like this:![](image_rsrc18Y.jpg)4.2 - ObjectObjects
    in C# represent the real entities in the system, with all of their class type
    characteristics and features. They are located somewhere in memory and have reference
    pointer to it. Whenever the keyword new  is used, an object in memory is created.
    Objects must be of a class type. Every class which is created in C# programming
    language is derived from the System.Object  class (inheritance will be explained
    in later chapters). This means that there is a built-in class Object in C #, and
    every object of any type is derived from that class. Every object created, besides
    its own functionalities, also has the methods that are available from their parent
    class Object. These methods are: Equals, ToString, Finalize, and GetHashCode.
    This could be checked in the example:![](image_rsrc18Z.jpg)This example is using
    the class TShirt , which was shown in the previous example in Class subchapter.
    In the Main method, an object of the TShirt class type is instantiated. This object
    is referenced by the tshirt  variable. In the second line, you can see the available
    methods and properties that could be executed over the tshirt object. Besides Color 
    property and the About  method that are part of the TShirt class, there are also
    four methods from the parent class Object (Equals, GetHashCode, GetType, ToString).4.3
    - InterfaceAnother important component in object-oriented programming is an interface
    . An interface represents multiple declarations of some functionalities. A class
    can implement one or more interfaces, but it can only inherit from one class or
    abstract class. This reveals another C# programming language characteristic -
    it does not support multiple inheritance. Classes that implement some interface
    must provide a full definition of all interface members. In the interface usage,
    there is no manipulation with access modifiers as all the interface members are
    considered to be public. This is because interface existence is all about its
    functionality to be implemented by other classes. If some class must implement
    interface members, it means that the interface members must be public in order
    to be implemented by other classes. The interface is an object-oriented component
    that has declarations, but it cannot have definitions - implementations. If you
    try to insert some implementations in the interface, the compile-time error will
    appear. The interface can contain properties and methods - everything that can
    have the implementation. It cannot have fields and a constructor - because it
    is not a class, and it cannot be instantiated. On implementation of the interface,
    the class must implement all of the interface members. As mentioned, multiple
    inheritance is not supported in C#, but it can be achieved with interface usage
    since a class can implement multiple interfaces. Example:![](image_rsrc190.jpg)Here
    we have one interface defined. It has three boolean properties inside. A class
    that will implement this interface must have the definition of all these interface
    members.![](image_rsrc191.jpg)The program contains one class, which is a Person
    class. This class implements the IPerson interface that has been declared. This
    class has two private string fields, which are _firstName and _lastName. It also
    has a constructor where those field values are assigned. Besides that, this class
    has the definition of three members of the IPerson interface – the IsRunning,
    IsStanding, and IsSitting properties. The compiler is fine with this, as there
    are no errors. But, if we remove any of these three properties from a Person class,
    the compiler would report an error. For example:![](image_rsrc192.jpg)Here, we
    have commented on the IsRunning property that is inside the Person class. The
    compiler is reporting an error that the Person class does not implement that property,
    and the program could not build. After this, we will uncomment the property and
    return to the valid state of a program. Let us create a Program class with the
    Main method inside. There, we will create an instance of a Person class and run
    the program to check if everything is working well.![](image_rsrc193.jpg)Now,
    run the program:![](image_rsrc194.jpg)Everything went smoothly.Chapter 5: CollectionsIn
    C# programming language, there are specialized classes that control data storage
    and data manipulation. These classes are known as  collection  classes. The collection
    classes provide support for the most common data structures, such as queues, stacks,
    lists, and hash tables. Collection classes have various purposes, but the most
    important ones are the manipulation with the particular data structure. Also,
    one great purpose is the dynamic memory allocation, which means that when instantiating
    a collection object, only the reference to that object is being created. Memory
    allocation occurs when you add elements to the collection. So, memory allocation
    happens on-fly. In comparison with that, when instantiating an array object of
    ten integer elements, immediate memory allocation of 10*sizeof(int) bytes in memory
    occurs. Some of the collections support this kind of allocation, while some support
    the super-fast retrieval of an element on the index basis etc.Collection classes
    are split and stored into a few different namespaces. In the System.Collections.Generic
    namespace, there are Generic implementations of some core data structures and
    some of the main collection classes are defined here.  Dictionary<TKey, TValue> 
    is the collection class that stores data based on key-value pairs. It has good
    data retrieval functionality based on index access. The key represents the index
    in this class.  List<T>  is the dynamic array, while  Queue<T>  is the collection
    class that represents the first-in-first-out functionality. Queue data structure
    means that the first element inserted into the queue will be the first element
    leaving the queue. If we push three elements into the queue, for example, 1, 4,
    and 7, and then perform two pop actions, the first pop will take 1 from the queue
    and return it. Then, the second pop will take 4 from the queue and also return
    it. After those actions, the queue will be left with only one value, and that
    is 7. Stack<T>  collection class represents the stack data structure implementation.
    It is the last-in-first-out system. For example, if we push four elements to the
    stack, 1, 4, 7, and 9, and then perform two pop actions, the first pop will take
    and remove value 9 from the stack while the second pop will take and remove value
    7 from the stack. In the end, the stack will have 1 and 4 values, respectively.
    These are just some of the collection classes in C#. It would be good to read
    more about the data structures to enable you to be more familiar with them. Few
    examples of the main data structure manipulation can be seen below:![](image_rsrc195.jpg)In
    this example, we have some main actions executed over the core data structures.
    In this Main method, we have implemented the basic manipulations with the Dictionary,
    List, Queue, and Stack classes in C#. The first thing that is instantiated is
    the dictionary object variable, and it is defined as the int  key  and string 
    value  pair. In the object creation, there are three inserted elements of this
    dictionary. The first one with the key 1 and value "blue," the second one with
    the key 2 and value "black," and the third one with the key 3 and value "yellow."
    These elements are stored in the  colors  object variable. When the program calls
    the output of the colors[1] and colors[3], the colors[1] will enter the dictionary
    and find the value of the key 1\. The same will also be executed with the colors[3];
    it will find the value of the key 3\. This will print blue and yellow in each
    line, respectively. This represents the index-based access to some data.Next,
    we have the creation of a list object. This list will contain elements of the
    int type. We are using the  Add  method to add three integer elements to the list.
    After that, we generate the output to the console of the third list element. We
    then access the third element with the index value 2\. In C#, indexing starts
    from zero, so the first element in any collection is index 0, the second element
    is index 1, etc. Here the output will be number 9\. The following is the Queue
    manipulation. The queue object variable is instantiated, and it is of the Queue
    data type with integer values.After this, we then use the  Enqueue  method to
    insert the elements into the queue. Enqueue method pushes the values 4, 3, and
    6 inside the queue.Then, we use the  Dequeue  method over the queue variable two
    times and print each dequeued value. Dequeue method takes the element from the
    top of the queue and removes it from the queue. So, in the console, there will
    be numbers 4 and 3 printed respectively, leaving the number 6 lonely in the queue.The
    last one is the  Stack . This creates the stack object of Stack data type with
    the integer elements allowed. After this, we push three elements into the stack,
    22, 34, and 11.The  Push  method inserts the element on the top of the stack.
    After the push, we then execute two  Pop  methods and print each value returned
    from the Pop method. The Pop method grabs the last inserted value and removes
    it from the stack. So, the output here will be 11 and 34, respectively, leaving
    the number 22 alone on the stack. The complete console output looks like this:![](image_rsrc196.jpg)5.1
    - ListThe List<T>  is the collection class that is most frequently used in all
    collection classes. It is a type whose main characteristic is the element accessibility
    by index. As mentioned before, List class comes under the System.Collections.Generic
    namespace. The List is a class that provides a lot of methods for the list and
    element manipulation. Some of them are searching, sorting, etc. It is used for
    creating a collection of many different types. It could be a collection of integers,
    strings, and many more. For the reference types, the List allows null value as
    an element. It is also possible to insert duplicate values inside any List collection.
    This class can use both the ordering and equality comparer. Arrays are similar
    to the lists, but the lists are able to resize dynamically, but arrays can not.5.2
    - DictionaryThe Dictionary<TKey, TValue>  collection class is, as its name says,
    a collection of key-value pairs. It belongs to the System.Collections.Generic
    namespace in the C# programming language. What does Dictionary provide? Well,
    the Dictionary class provides something like mapping of related data; it binds
    the key with its value pair and makes it very easy to access certain data if the
    key is known. This class is implemented based on the Hash Table data structure.
    The Hash table is the data structure that has very good performances on insertion
    and retrieving data, no matter the size of the data itself. It is especially efficient
    in searching for the data. In a Dictionary object, every key must be unique. The
    key can not be null, but the value could be. This is possible only if the value
    type is part of the reference types. 5.3 - ForEachThe ForEach method is an extension
    method over the List<T> class. It is used for iterating through the collection
    and executing some operations with the elements. In the most common case, it contains
    a code to either read and pass element value to another job or function, or to
    update an element under certain conditions, etc.To sum up this chapter, a simple
    program is written below:![](image_rsrc197.jpg)Here, we have a class Program that
    contains one method for List() manipulation and one method for Dictionary manipulation.
    In the  List()  method, we are creating a List object of strings that contains
    four elements. These elements are "I," "am," "learning," and "C#!". After the
    variable  sentence  object is instantiated and value-defined, we then execute
    the  ForEach  method over that object. This means that we are iterating through
    the created List and are able to reference the corresponding value in the list
    by the word  variable. Here we simply print the value to the console.The more
    complex method is the  Dictionary()  method. In this method, we created three
    new List objects of the string data type. The first list represents the list of
    words that start with the letter A -  aWords  object. The second list represents
    the list of words starting with the letter B -  bWords  object, and the third
    represents the list of words starting with the letter C -  cWords  object.'
