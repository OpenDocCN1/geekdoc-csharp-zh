  trans: "\n这些对象每个按顺序填充了三个元素和三个单词。然后，我们实例化了一个 `Dictionary` 对象。该字典对象是一个键值对对象，其中 `string`\
    \ 数据类型作为键，`List<string>` 数据类型作为值。这意味着字典的值部分将是一个字符串列表。此 `dictionary` 变量对象被填充了三个键值对。第一个是\
    \ `\"a\" - aWords`，第二个是 `\"b\" - bWords`，第三个是 `\"c\" - cWords`。该方法的最后一条语句是在 `dictionary`\
    \ 变量映射到键 `\"b\"` 的值上调用 `ForEach` 方法。这意味着程序将向控制台打印字符串 \"Words that start with the\
    \ letter b:\"，并将其与 `bWords` 列表中的每个元素拼接。所有这些内容都通过在程序的 `Main` 方法中调用这两个方法来演示。输出结果为：![](img/image_rsrc198.jpg)\n\
    \n# 第 6 章：面向对象编程\n\n面向对象编程（OOP）是世界上最流行的编程范式。该范式是过程化编程的继继者。过程化编程代表编写操作某些数据的函数和过程。另一方面，面向对象编程完全在于创建将方法和数据整合在的的对象。面向对象编程相比过程化范式有许多优势。面向对象编程使得代码更容易处理和维护，并且更容易调试和修改。OOP\
    \ 有助于缩短开发时间，并帮助你构建可重用的代码和组件。此外，它的执行速度更快、更简单。它更容易遵循 DRY 原则，该原则告诉代码的重复必须降到最低。DRY\
    \ 原则代表 Don't Repeat Yourself（不要重复）。某些应用程序通用的代码部分应该被提取并放在一个组件中，使其变得可重用且不再重复。OOP\
    \ 正如其名，基于对象的使用和管理。这些对象包含不同形式的数据。在 C# 编程语言中，这些形式是字段（fields）和属性（properties）。它还包含数据处理部分，被称为过程——在\
    \ C# 中称为方法（methods）。对象代表某些 `class` 的实例，这决定了它们的类型。这意味着 C# 编程语言是基于类的。OOP 范式允许你将问题分解成更小的部分——它将其分解为更小的单元，使得一切都更容易处理。这些单元就是上述的对象。面向对象编程的主要方面有四个特征：`abstraction`（抽象）、`encapsulation`（封装）、`inheritance`（继承）和\
    \ `polymorphism`（多态）。这四个特征是面向对象编程范式的法则。\n\n## 6.1 - 封装\n\n封装代表将数据打包到某些逻辑组件中。它是一种封装数据并绑定到单个单元的机制。封装是保护存储在类中的数据的方法，防止不应使用特定数据的组件访问它。抽象和封装之间存在关系。抽象目的是目的是某些信息可见，而封装的目的是选择具有特定抽象程度的程序功能。封装的使用防止并保护数据免受损坏、错误和误操作。在面向对象编程中，数据及其操作几乎代表一切——它是程序的关键元素。如果我们想保护某些数据，必须使用\
    \ `private` 访问修饰符而不是 `public` 修饰符。如果使用 `private` 访问修饰符，私有数据将通过属性间接进行操作。这意味着类中的数据对其他类是隐藏的——即众周知的数据隐藏。正如前面提到的，可以通过使用控制私有字段及其值的\
    \ `private` 字段和 `public` 属性来实现。使用封装有许多优势，代码的可重用就是其中之一；它在新的需求出现时易于更改。它对于测试代码也非常好，例如在单元测试中。封装的一个简单示例在所示：![](img/image_rsrc199.jpg)\n\
    \n在这个简单的示例中，我们展示了面向对象编程封装功能的使用。在 `Person` 类中，有两个 `private` 字段——这些是我们不希望在整个程序中暴露给人的字段。这些字段的值被封装起来，并且仅在它们自己的类中可用。然而，我们通过创建属性来间接地操作它们，这些属性的任务是控制这些私有字段的值。创建的属性是\
    \ `Name` 和 `Age` 属性。两个属性都有 `get` 和 `set` 访问器。在 `get` 访问器中，两个属性都返回相应的私有字段值。同样，在\
    \ `set` 访问器中，两个属性都将传递的值分配给私有字段。通过这种方式，我们实现了封装。在 `Program` 类的 `Main` 方法中，我们将测试一切是否运行正常。首先，我们实例化\
    \ `Person` 类的对象。之后，我们再次使用封装设置该特定对象的名称和年龄，因为在操作过程中调用了 `set` 访问器。最后，我们使用 `get` 访问器将数据打印到标准输出，包括人的\
    \ `Name` 和 `Age`。程序的输出看起来如下：![](img/image_rsrc19A.jpg)\n\n为了更好地理解这一点，下面展示了一个稍微复杂一点的额外示例：![](img/image_rsrc19B.jpg)\n\
    \n在该示例的开始，我们在最底层暴露了两个类。第一个类是 `Engine` 类。在这个类中，你首先注意到一个整数类型的私有字段 `_numberOfCinders`。无法给此变量赋值，因为它是\
    \ `private` 的。下一步是 `Engine` 构造函数。构造函数接受一个整数类型的参数 `numberOfCinders`。在构造函数内部，有一个检查气缸数量是否为四、六或八的判断。如果不符合，程序将抛出一个\
    \ `Exception`，消息为气缸数量必须为四、六或八。C# 中的异常用于处理错误。例如，如果检测到某些错误，`Exception` 应该在程序的某处捕获并告知用户。这是关于异常的处理。让我们回到示例。如果气缸数量正常，则进入\
    \ `if` 块，然后赋值值赋予私有字段。在构造函数下方，有一个字符串类型的方法 `EngineType()`。在这个方法中，有 `if` 语句检查 `_numberOfCinders`\
    \ 是否为四、六或八。如果等于四，则返回 `\"Inline4\"` 字符串；如果等于六，则返回 `\"V6\"` 字符串；如果等于八，则返回 `\"V8\"\
    ` 字符串。如果不符合这些条件，程序将再次抛出 `Exception`，包含 \"invalid number of cylinders\"。第二个类是 `Transmission`\
    \ 类，它有一个 `bool` 类型的公共属性 `IsAutomatic`。该属性只有一个 `get` 访问器，这意味着该属性的值只能读取。向此属性写入（赋值）是不允许的。只读成员的继承只能在声明或同类构造函数发生。在这种情况下，在\
    \ `Transmission` 类中，`IsAutomatic` 的值是在构造函数中赋值的。`Transmission` 类有一个传递它的 `bool`\
    \ 参数。该值被赋值给 `IsAutomatic` 属性。让我们移动到下一个类。代码所示![](img/image_rsrc19C.jpg)\n\n在名为\
    \ `Car` 的类中，我们有两个公共属性。这两个属性都只有一个 `get` 访问器。这使得它们成为只读属性。在 `Transmission` 类中，这些属性的值不能直接赋值，除非在构造函数或声明层。在这种情况下，在\
    \ `Transmission` 类中，值是在构造函数中赋值的。`Car` 类的构造函数接受两个参数，一个 `Engine` 类型和一个 `Transmission`\
    \ 类型。传递的两个对象被赋值给 `Car` 类的只读属性。`Transmission` 和 `Car` 类的只读属性是封装的，无人更改它们的值。这些值是安全的，不需要担心内部数据的更改。让我们将这些逻辑汇总为一个单元：![](img/image_rsrc19D.jpg)\n\
    \n这里是带有 `Main` 方法的 `Program` 类。在这里，我们将操作之前解释的对象并让它们的特征活跃起来。第一是创建一个六缸的 `Engine`\
    \ 类实例。之后，我们实例化 `Transmission` 类的对象。在创建了 `Engine` 类的实例和 `Transmission` 类的实例后，我们准备好实例化一个\
    \ `Car` 对象。`Car` 类需要 `Engine` 对象和 `Transmission` 对象才能创建。现在，我们使用之前实例化的 `Engine`\
    \ 和 `Transmission` 对象作为参数创建一个 `Car` 类对象。程序打印汽车的引擎类型。我们可以通过以下方式访问此信息：首先，访问汽车对象的\
    \ `Engine` 属性。获取此信息后，我们可以访问 `Car` 类中 `Engine` 属性上的 `EngineType()` 方法。该方法返回 `\"\
    V6\"` 字符串，因为该引擎是用六缸创建并分配给汽车对象的。同样，当我们获取有关汽车自动变速箱的信息时也是这样做。首先，访问汽车对象的 `Transmission`\
    \ 属性，完成后，我们可以访问汽车对象内部 `Transmission` 对象的 `IsAutomatic` 属性。所有信息都打印到控制台输出。控制台打印如下：![](img/image_rsrc19E.jpg)\n\
    \n## 6.2 - 继承\n\n面向对象编程的另一个特性是 `inheritance`（继承）。这种特性是一种允许类继承其他类部分的智能机制。这意味着如果类\
    \ `A` 继承自类 `B`，类 `A` 对象将能够访问类 `B` 的成员；其字段、属性、方法等。在继承原则中，我们识别 `Parent` 类（父类）和 `Child`\
    \ 类（子类）。。Superclass` 代表基类，其特征要在子类中被继承。继承另一个类的类的被称为 `Subclass`。除了该类可以访问基类成员的事实外，它还可以实现自己的成员和特征。`Subclass`\
    \ 看到它所有的特征，包括父类的特征。`Superclass` 只看到它自己的特征。重用概念在继承范式中是完全支持的。reability could be\
    \ mirrored in the example that we need to create some class。在这种情况下，可以重用已有的类。要继承类，使用\
    \ `:` 符号。例如：\n\n```\nclass B : A\n```\n\n在这个示例中，类 `B` 是子类，类 `A` 是基类。如果由于某些原因你想限制某些类的继承，使用\
    \ `sealed`（密封）关键字。例如，对于 `sealed` `Person` 类：\n\n```csharp\nsealed class Person\n\
    class Student : Person\n```\n\n这将为你提供一个编译错误，说 `Student` 类不能派自 `sealed` `Person`。当\
    \ `Subclass` 不继承自基类时，这是一个边缘情况。然而，`sealed` 也可以用于访问修饰符。在访问修饰符章节中承诺过的，`sealed` 关键字将在这里解释。`protected`\
    \ 关键字在处理继承范式时使用。它是一种在继承特征中经常出现在这里的访问修饰符。一个特定类的 `protected` 成员指定了在该类内部可以访问的组件。仍然，在该类的任何子类内部也可以访问的。一个示例所示![](img/image_rsrc19H.jpg)\n\
    \n在这个示例中，有一个父类 `ParentClass` 和一个子类 `ChildClass`。在 `ParentClass` 中，有两个字符串类型的字段。第一个字段是\
    \ `private`，其值设置为 `\"Private\"`。第二个是 `protected` 字段，其值设置为 `\"Protected\"`。在 `ParentClass`\
    \ 下方，有一个继承自 `ParentClass` 的 `ChildClass`。在这个类中，只有一个方法——`Print()`。该方法的作用是向控制台输出基类的\
    \ `protected` 字段的值。你可以看到，这是允许的，编译器没有报告任何错误。然而，在下面被注释的代码中，尝试访问基类的 `private` 字段并将其值写入控制台输出。是不允许的，编译器将报告错误，这就是为什么被注释了。在\
    \ `Program` 类中，我们将展示这一切是如何顺畅运行的。在 `Main` 方法中，实例化了一个 `ChildClass` 对象。之后，我们调用该 `ChildClass`\
    \ 对象的 `Print()` 方法。在那个时刻，`ChildClass` 对象拥有访问父类 `protected` 成员的所有权利。这就是为什么该程序执行正确，我们将在标准输出上看到这样的：![](img/image_rsrc19J.jpg)\n\
    \n程序输出了 `\"Protected\"` 字符串，这是预期的。一切进展顺利，继承得到了证明。重要的是知道有不同类型的继承：\n\n- **单继承**：只有一个父类和一个子类。示例：\n\
    ```\nclass A\nclass B : A\n```\n- **多级继承**：有一个代表一个类的子类和另一个类的父类。示例：\n```\nclass\
    \ A\nclass B : A\nclass C : B\n```\n- **层级继承**：有一个多个子类的父类。示例：\n```\nclass A\n\
    class B : A\nclass C : A\n```\n\n在继承原则中，还有一点需要知道：`protected` 关键字的使用。正如之前在访问修饰符小节中承诺的，`protected`\
