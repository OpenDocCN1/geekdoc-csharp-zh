    a single responsibility principle, so let us refactor this code to get the SRP
    on the way.![](image_rsrc1A9.jpg)Now, this is better. Here we split the logic
    into two classes. One class is for the execution of the database actions, creating
    and deleting the worker entity. The Worker class now serves only one responsibility,
    and that is handling the database actions.'
