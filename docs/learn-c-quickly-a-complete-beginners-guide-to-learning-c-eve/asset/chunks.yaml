    The next method running is `IfElseStatements`. Inside this method, it is demonstrated
    how the `if-else` statement works. In this case, the program contains one `for`
    loop, and inside its body block, there is an `if-else` statement. The `for` loop
    has its initialization part always, and also the variable `index` which will be
    used as a counter as well. The starting value of the `index` variable is zero.
    If the `index` is less than ten, the iterations through the loop will run after
