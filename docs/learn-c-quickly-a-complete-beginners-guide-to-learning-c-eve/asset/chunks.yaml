    \ `Main` 方法中调用这两个方法来演示。输出结果为：![](img/image_rsrc198.jpg)\n\n# 第 6 章：面向对象编程\n\n\
    面向对象编程（OOP）是世界上最流行的编程范式。该范式是过程化编程的继继者。过程化编程代表编写操作某些数据的函数和过程。另一方面，面向对象编程完全在于创建将方法和数据整合在的的对象。面向对象编程相比过程化范式有许多优势。面向对象编程使得代码更容易处理和维护，并且更容易调试和修改。OOP\
    \ 有助于缩短开发时间，并帮助你构建可重用的代码和组件。此外，它的执行更快更快、简单。它更容易遵循 DRY 原则，该原则告诉代码的重复必须降到最低。DRY\
    \ 原则代表 Don't Repeat Yourself（不要重复）。某些应用程序通用的代码部分应该被提取并放在一个组件中，使其变得可重用且不再重复。OOP\
    \ 正如其名，基于对象的使用和管理。这些对象包含不同形式的数据。在 C# 编程语言中，这些形式是字段（fields）和属性（properties）。它还包含数据处理部分，被称为过程——在\
    \ C# 中称为方法（methods）。对象代表某些 `class` 的实例，这决定了它们的类型。这意味着 C# 编程语言是基于类的。OOP 范式允许你将问题分解成更小的部分——它将其分解为更小的单元，使得一切都更容易处理。这些单元就是上述的对象。面向对象编程的主要方面有四个特征：`abstraction`（抽象）、`encapsulation`（封装）、`inheritance`（继承）和\
    \ `polymorphism`（多态）。这四个特征是面向对象编程范式的法则。\n\n## 6.1 - 封装\n\n封装代表将数据打包到某些逻辑组件中。它是一种封装数据并绑定到单个单元的机制。封装是保护存储在类中的数据的方法，防止不应使用特定数据的组件访问它。抽象和封装之间存在关系。抽象的目的是某些信息可见，而封装的目的是选择具有特定抽象程度的程序功能。封装的使用防止并保护数据免受损坏、错误和误操作。在面向对象编程中...\
    \ (省略)如果我们想保护某些数据，必须使用 `private` 访问修饰符而不是 `public` 修饰符。如果使用 `private` 访问修饰符，私有数据将通过属性间接进行操作。这意味着类中的数据对其他类是隐藏的——即众周知的数据隐藏。正如前面提到的，可以通过使用控制私有字段及其值的\
    \ `private` 字段和 `public` 属性来实现。使用封装有许多优势，代码的可重用就是其中之一；它在新的需求出现时易于更改。它对于测试代码也非常好，例如在单元测试中。封装的一个简单示例在所示：![](img/image_rsrc199.jpg)\n\
