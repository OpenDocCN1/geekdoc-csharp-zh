    ## 7.2 - 开闭原则


    开-闭原则的定义是：软件模块、类和组件应该对扩展开放，但对修改关闭。该原则指出，任何软件模块都应该能够轻松地扩展其功能，而无需更改已有的核心实现。任何应用程序或软件模块都应该是灵活且能适应变化的。每个软件在开发周期中都需要经过多次更改，这就是为什么每次修改在完成之前都应该始终进行双重检查。开闭原则规定，应用程序或功能的当前行为可以永久地扩展，而无需转换其当前的实现。因此，新功能应该通过编写新代码并保持现有代码不变来实现。这是因为，如果我们更改了当前的实现，我们可能会在当前功能中引入
    bug，而该功能之前被声明是运行良好的。遵循开闭原则，我们可以降低某些功能的当前实现崩溃的风险。此外，对每个方法和功能单元进行单元测试是理想的，因为如果我们更改了某处的现有实现，通常需要更改单元测试，这会延长开发时间。继承始终是能够引导我们实现开闭原则的方法。听起来很不错，让我们进入示例：


    ![](img/image_rsrc1AA.jpg)


    在这个示例中，我们有三个感兴趣的类。一个是超类 `Vehicle`，另外两个 `Truck` 和 `Car` 是派生类。在超类中，有一个非常受关注的属性。该属性名为
    `IsAutomatic`，可以被派生类的对象使用，也可以在核心类（即超类）中使用。随着进一步的实现，虽然代码行变得越来越大，但该属性可能会产生许多引用，因为它可以被三个类对象（`Vehicle`、`Car`、`Truck`）使用。如果派生类需要某些修改，那么向这些对象添加属性和方法以进一步描述它们是可以接受的。这意味着它们对扩展是开放的。然而，如果需要更改
    `IsAutomatic` 属性的任何内容，将导致一个巨大的混乱，并且必须对该属性的每一个引用进行重构。所以，如你所见，这并不是一个高明的主意。开闭原则反映在这个属性上。该属性对修改是关闭的，因为它可能导致海量的重构。与其在超类中更改
    `IsAutomatic` 属性，不如向超类添加一个新属性，并扩展派生类的构造函数。这实际上取决于你试图实现什么。也许你只想扩展一个派生类；在这种情况下，你只需要在其子类中添加一个属性。


    让我们引入另一个示例：假设有这样下一个问题：公司有员工——软件工程师，总监需要一个程序来计算他需要支付给所有员工的工资总成本。这很简单；实现可以如下：


    ![](img/image_rsrc1AB.jpg)


    这看起来很极了，而且运行正常。目前没有问题，程序也没有违反单职责原则。但公司有不同类型的员工，他们收到的工资不同。我们没有考虑到这一点。给出的信息是有两种类型的员工——软件工程师和
    QA 工程师；他们的工资计算方式不同，因此我们需要实现这种情况。不过这不会成为问题，因为我们将做类似这样的操作：


    ![](img/image_rsrc1AC.jpg)


    我们在这里完成了更改。我们成功地将 QA 工程师的工资计算引入了程序中。现在我们也可以这里添加经理的工资计算。这将通过在 `TotalSalaryCost`
    类的 `TotalSalary` 方法中添加另一个 `if` 块来实现。但这里有一个大问题。每当我们添加一个新的职位及其工资计算公式时，都必须修改 `TotalSalary`
    方法的实现。这意味着 `TotalSalaryCost` 类对修改是不关闭的，每当我们收到更改请求时，都必须修改它。我们如何更好地实现它以避免这种情况呢？通常，我们可以引入抽象；我们可以通过使用接口或抽象类来实现这一点，并解耦具体类代码中的紧密关系。这将使得每个新请求都更容易处理，而无需更改核心计算方法。让我们选择抽象类组件以最可能的方式解决这种情况。最终的解决方案是：


    ![](img/image_rsrc1AD.jpg)


    在这里，我们引入了一个名为 `Salary` 的抽象类。该类只包含一个方法，它是抽象的——`TotalSalaryCost`。`SoftwareEngineerSalary`
    和 `QAEngineerSalary` 类仍在实现中。我们通过让这两个类成为 `Salary` 抽象类的子类完成了更改。因此，`Salary` 类变成了基类，而
    `SoftwareEngineerSalary` 和 `QAEngineerSalary` 现在是派生类。在派生类中，我们实现了父类的抽象方法。这样，员工类型就有它自己的总工资计算。通过这种方式，`TotalSalaryCost`
    类被简化了。这里有一个 `foreach` 语句，在每次迭代中，都会调用当前对象的 `TotalSalaryCost` 方法。这种方式使得开闭原则得以实现。每当我们添加一个新员工并其工资计算时，只需创建一个新的子类并保持现有代码不变。这样，`TotalSalaryCost`
    类就不需要修改。此外，对每个方法和功能都进行单元测试是理想的。开闭原则还可以通过使用接口来实现这一点：


    ![](img/image_rsrc1AE.jpg)


    与其使用抽象类，我们现在有了 `ISalary` 接口。在这个接口中，有一个方法——`TotalSalaryCost`。在之前的示例中，派生类实现了 `ISalary`。在
    `TotalSalaryCost` 类中，一切保持不变；唯一改变的是作为参数的 `cost`。结果是完全相同的，开闭原则再次得到了实现。这很棒，不是吗？


    ## 7.3 - 里氏可替换原则


    里氏可替换原则（LSP）规定，派生类必须能够完全替换它们的基类。这意味着，如果类 A 继承自类 B，那么 A 应该可以完全替换 B。该原则规定，所有子类都不应影响基类的角色。因此，派生类应该是完全可替换父类的。开发者应该确保子类在扩展父类时不改变其行为。让我们通过一个示例来演示：


    ![](img/image_rsrc1AF.jpg)


    在这个示例中，我们可以假设派生类的任何成员都不可能损害基类的行为。从派生类访问父类的 `Capacity` 和 `IsAutomatic` 属性，每个成员都是合适的，且可能发生异常。如果我们在基类实现中添加一个虚方法，并在派生类中覆盖它，但这将抛出
    `NotImplementedException()`。它看起来如下：


    ![](img/image_rsrc1AG.jpg)


    这种方式是显著错误的，逻辑如下：在基类 `Vehicle` 中，我们添加了一个带有核心实现的虚方法 `Type()`。在派生类中，我们没有实现该方法，而是在抛出了
    `NotImplementedException()`。这在许多方面都是错误的，其中之一就是破坏了里氏可替换原则。这是因为，如果在 `Truck` 对象上调用
    `Type()` 方法，它将抛出一个异常。因此，它无法替换父类 `Vehicle`。它损害了已实现的基类功能，而派生类的功能显然没有实现。结果是我们将得到一个异常，因为我们正尝试在
    `Truck` 类对象的控制台上打印 `Type()`。另一个示例如下：


    ![](img/image_rsrc1AH.jpg)


    在这个示例中，我们有一个被标记为抽象的基类 `Worker`。在这个父类中，有两个带有核心实现的虚方法。第一个方法返回工人当前正在工作的任务详情。第二个方法返回关于工人本身的信息。然后有两个类代表
    `Worker` 类的子类。其中一个是 `QAEngineer` 类。在 `QAEngineer` 类中，有基类方法的重写实现。它们都有正常的定义，所以这里一切看起来良好。另一个派生类是
    `SoftwareDeveloper` 类。在这个类中，也有两个来自基类的重写方法。但在这里我们可以看到一个问题：`GetWorkerDetails()`
    方法没有实现；它抛出了 `Exception`。由于某些原因，软件开发者的详情可能无法预览。在 `Main` 方法中，对 `Worker` 类型对象的列表进行迭代。在每次迭代中，都会调用当前对象的
    `GetWorkerDetails()` 方法。这对于编译器来说看起来很好，但实际上会发生什么？当 `SoftwareDeveloper` 对象进入迭代并调用
    `GetWorkerDetails()` 方法时，将抛出异常。这不是我们希望发生的，所以我们必须使派生类完全可替换基类，而目前并非如此。这个示例违反了里氏可替换原则。所以，下一步解决方案是：引入两个接口组件，一个包含
    `GetWorkerDetails()` 方法——例如 `IWorker` 接口，另一个包含 `GetTaskDetails()` 方法——`ITask`
    接口。为了实现里氏可替换原则，合适的类将实现零、一个或两个给定的接口。在这种情况下，`QAEngineer` 将被修改为实现两个接口，因为它需要实现这两个方法。`SoftwareDeveloper`
    类将只实现 `ITask` 接口，因为它只需要 `GetTaskDetails()` 方法。这种方式，里氏可替换原则得到了实现。


    ## 7.4 - 接口隔离


    接口隔离原则规定，实体不应被强制实现它们不使用的接口。可能，创建许多简单且小的接口比创建一个包含许多未使用方法的巨大接口要好得多。接口应该代表与其使用相关的实体。类不应该依赖于它们不使用的接口。类似于，接口应该具有特定的职责。当接口变得越来越大时，可能会包含所有实现者都需要的方法。接口隔离检测到了这个问题。正确的示例如下：


    ![](img/image_rsrc1AJ.jpg)


    在这个示例中，我们展示了接口隔离的正确方法。有两个接口：`ICacity` 和 `ISalary`。`ICacity` 接口有一个只读属性 `Capacity`。`ISalary`
    接口也包含只读属性 `Salary`。`Car` 类实现了 `ICacity`，因为它只需要 `Capacity`。`Truck` 类实现了 `ISalary`，因为它只需要
    `Salary`。这种方式，接口隔离原则完全得到了实现。我们使用了最大潜力的接口。另一个示例如下：


    ![](img/image_rsrc1AK.jpg)


    在这个示例中，有一个接口 `IEmployee`，该接口包含两个方法——`CreateTask` 和 `WorkOnDevelopment`。然后我们有 `Programmer`
    类实现了上述接口。接口中的两个方法都有实现。现在一切看起来都完美了。之后，我们收到请求添加 `Tester` 类，因为测试员也是员工。好的，我们将创建一个
    `Tester` 类并使其实现 `IEmployee` 接口。


    ![](img/image_rsrc1AM.jpg)


    看起来很好。`CreateTask()` 方法有了实现；`WorkOnDevelopment()` 方法会怎样？`Tester` 显然不应该处理开发任务，抛出了
    `NotImplementedException`。然而，这没有遵循接口隔离原则。因此，我们必须将此逻辑拆分为两个接口组件并正确使用。如下：


    ![](img/image_rsrc1AN.jpg)


    太棒了！现在看起来。接口隔离原则现在实现了。我们能够将 `IEmployee` 分为两个更具体的接口。第一个是 `IProgrammer` 接口，它包含了
    `IEmployee` 接口的所有方法。第二个是 `ITester` 接口，它只包含一个方法——`CreateTask`。它没有 `WorkOnDevelopment()`
    方法，因为 `Tester` 类不需要它。`Programmer` 类现在实现 `IEmployee` 接口，并将两个方法的完整实现。`Tester` 类将实现
    `ITester` 接口，它只包含 `CreateTask()` 方法。这种方式，我们能够更好地组织接口的使用。任何类中都没有实现的方法。需要添加到 `Programmer`
    或 `Tester` 类的任何新方法都将找到正确的接口，且没有任何未使用。接口隔离原则在这个示例中完成。代码已准备好处理新功能，并且很容易修改行为。


    ## 7.5 - 依赖倒置原则


    “高层模块不应该依赖于细节，而应该依赖于抽象。” 这句话代表了依赖倒置原则。这意味着，一切都应该以抽象特性进行开发以避免紧密耦合。高层组件通常实现系统的业务层，而低层组件负责详细过程。这里的关键是，必须保持高层和低层模块的松耦合。为了实现这一点，不应该让两个模块识别彼此的实现。模块的紧密耦合是指高层组件了解许多与其交互的组件。如果存在紧密耦合，存在一个模块或类的更改可能会破坏另一个模块或类逻辑的巨大风险。在
    C# 编程语言中，有一种实现依赖倒置原则的技术，它被称为控制反转 (IoC)。控制反转可以通过抽象类或接口组件来实现。这种技术消除了类和模块之间的依赖。低层组件应该遵循单一接口的承诺，而高层组件应该使用实现特定接口的模块。让我们从示例开始：


    ![](img/image_rsrc1AP.jpg)

    ![](img/image_rsrc1AR.jpg)


    在这个示例中，有一个接口 `IVehicle`。在该接口内部，有一个属性，即只读属性 `IsAutomatic`。该接口由两个类实现。第一个被称为 `Car`
    类。`Car` 类实现了 `IVehicle` 并包含了接口中的 `IsAutomatic` 属性。第二个被称为 `Truck` 类。`Truck` 类也实现了
    `IVehicle` 并包含了接口中的 `IsAutomatic` 属性。这种方式，依赖倒置原则得到了实现。现在，让我们看看第二个示例：


    ![](img/image_rsrc1AS.jpg)

    ![](img/image_rsrc1AT.jpg)


    在这个示例中，我们有一个接口 `IShape`，该接口包含了方法的依赖依赖于 `Draw()`。`ShapeManager` 类依赖于该接口。`Draw()`
    和 `Stop()`。依赖注入 (DI) 是控制反转。


