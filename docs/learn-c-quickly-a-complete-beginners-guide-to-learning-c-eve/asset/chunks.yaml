    #### Car Class

    The next class is the `Car` class. This class inherits the `Vehicle` class - so
    the `Vehicle` class is the parent class of the `Car` class. It can access all
    the properties from the `Vehicle` class, and it also has its own property. The
    `Car` property is the `TrunkSpace` read-only property. The `Car`''s own constructor
    uses three parameters, the values for the `IsAutomatic` property, the `Vin` property
    and the `TrunkSpace` property. This constructor passes the parent property values
    from the parameter to the base constructor. It means that it called the base constructor
    with the `isAutomatic` and `vin` parameter values passed.


    In the implementation of its own constructor, there is a check on whether the
    `trunkSpace` parameter value is greater than five hundred. If the condition is
    true, the program will throw an exception with the message "Trunk space for a
    car cannot exceed 500". Below the condition check, there is a classic property
    initial state assignment of the `TrunkSpace` property.


    #### Truck Class

    The last class is the `Truck` class, which also inherits from the `Vehicle` class.
    We can assume that the `Truck` and `Car` are the child classes of a `Vehicle`
    class. It has one read-only property named `BedSpace`. In the constructor of a
    `Truck` class, there is a similar thing as in the `Car` constructor. Three parameters
