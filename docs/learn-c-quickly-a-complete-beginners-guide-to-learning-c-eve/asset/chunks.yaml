    two parameters, and both are int values. The logic is simple. If the first parameter
    passed is greater than the second, the method will return true as a result to
    the caller thread. If the second parameter value is greater than the first, the
    method will return a false value.The second method is the ContainsText method.
    This method also returns the bool type as a result. It takes two parameters, the
