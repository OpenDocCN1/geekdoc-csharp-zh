    this example, we have one class that acts as a superclass - the Sport  class.
    Inside that class, there is one void method Info (), that does the printing to
    the output. A simple print of the message: "The sport message.". You probably
    noticed one thing you did not see until now - the virtual keyword. The virtual 
    method represents a method that could be redefined in the child classes. The implementation
