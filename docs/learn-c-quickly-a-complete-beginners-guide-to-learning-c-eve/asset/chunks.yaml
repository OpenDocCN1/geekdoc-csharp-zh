    # 第一章：介绍性主题


    C# 是一种面向对象的编程语言，自从由微软开发以来，它拥有庞大的社区支持。C# 用于各种软件开发，例如 Web 应用程序、桌面应用程序、移动应用程序等。


    ## 1.1 - 数据类型

    程序中的每个变量必须属于某种数据类型，因此，如果我们需要进行某些计算，就必须使用数字；如果我们需要进行文本处理，则使用字符等。每个数据类型在声明时都有其特定的使用范围和在内存中占用的字节大小。因此，针对相关问题使用最佳数据类型至关重要，这可以避免错误并提高代码的可读性和维护性。


    ## 1.2 - 整数

    整数是 C# 语言中最常用的数据类型之一。整数表示任何不带小数部分的数字，也称为整型（例如 1, 5, 27, 13, -145……）。`Integer`
    内部包含多种类型，但我们最常用的是 `Int32` 数据类型。在 C# 程序中，`Int32` 数据类型通常写为 `int`。它在内存中的大小为 32 位。`int`
    变量可以单独声明，也可以在同一行内声明并赋值。整数数据类型的默认值为零 (0)。


    你在代码中可能会看到的最常见整数类型有：

    1) `byte` – 无符号整数，在内存中占 8 位。

    2) `long` – 内存中为 64 位的整数类型 (`Int64`)。

    3) `short` – 内存中组织为 16 位的整数类型 (`Int16`)。


    ## 1.3 - 小数

    C# 中的小数类型表示不四舍五入的小数。还有几种在内存大小、用法等方面与它不同的 `Decimal` 类型。为了初始化小数数据类型，使用了 `decimal`
    关键字。该类型在内存分配中占用 128 位。对于小数数据类型，必须在末尾添加后缀 `m` 或 `M`，以便编译器知道应该将其处理为小数类型。如果没有插入该后缀，编译器将该数字视为
    `double` 类型。`Double` 是默认的浮点类型，它在内存分配中占用 64 位。还有 `float` 数据类型，其内存大小为 32 位。float
    数据类型的表示后缀为 `f` 或 `F`（如果不添加，则该数字将如前所述视为 double）。


    ## 1.4 - 字符串

    C# 中的字符串数据类型是一种表示文本并与文本变量一起工作的类型。事实上，它是字符数组。声明字符串数据类型使用 `string` 关键字。当使用 `string`
    关键字时，意味着它指的是 `System.String` 类（类将在稍后解释）。有很多扩展方法可以于字符串变量。其中最流行的包括 `Concat` —— 连接两个字符串，`Contains`
    —— 确定字符串是否包含参数值中的给定字符串，`Equals` —— 两个字符串是否具有相同的值等。默认字符串类型是空字符串。


    ## 1.5 - 布尔值

    布尔数据类型被视为 C# 中的逻辑类型。它只有两个可能的值，即 `true`（真）或 `false`（假）。代码中的布尔类型通过 `bool` 关键字引用。布尔数据类型在编程中非常频繁，因为总是需要判断某些逻辑条件。它通常用于比较某些内容，如数字比较、对象比较等。布尔是代码中每个
    `if` 条件的返回值（If-Else 语句将在稍后解释）。默认布尔数据类型值为 false。


    ## 1.6 - Var

    C# 引入了 `Var` 数据类型来隐式声明变量。因此，可以说 `var` 不是一种数据类型；它只代表一种声明变量的方式。这意味着当使用 `var` 关键字声明某些变量时，我们告诉程序在编译期间确定变量的显式数据类型。`var`
    关键字及其使用也有限制，例如所有如 `int`、`string` 和 `bool` 等显式数据类型都可以作为类字段。


    另一方面，隐式声明（`var` 关键字）不能作为类字段。这种“虚拟”数据类型只有在声明的同时进行初始化（赋值）才能使用，因为编译器将根据等式右侧的值调整其真实数据类型。使用
    `var` 关键字声明的变量不能初始化为 `null`。


    ![image_rsrc181.jpg]

    `someVariable` 和 `secondVariable` 的声明和值初始化是没问题的，因为编译器知道如何根据赋值右侧确定这两个变量的数据类型（“New
    text” 是字符串数据类型，53 是整数数据类型）。不允许声明 `thirdVariable`，因为它没有没有值的初始化。也不允许初始化 `fourthVariable`，因为编译器无法通过其右侧赋值识别类型。它是
    `null`，而 `null` 代表变量指针指向无。


    ![image_rsrc182.jpg]

    这里有一个演示数据类型并帮助你更好地理解的示例。在这里，我们有一个 `Program` 类，内部包含六方法。第一个方法是 `Main` 方法。在我们运行程序后，首先调用此方法。在
    `Main` 方法中，调用的第一个演示数据类型基础的方法是 `Integers()` 方法。`Integers()` 方法没有传递任何参数。在这个方法内部声明了整数变量
    `x`、`y` 和 `z`。`z` 变量的赋值基于之前已经声明的变量。


    ```csharp

    int z = x * x + y;

    ```

    此赋值正在执行计算 —— 4 * 4 + 3 * 3，结果等于 25。变量 `z` 在此计算执行后，程序向控制台打印 `z` 的值，结果是 25。


    在 `Integers()` 方法执行后，程序进入 `Double()` 方法。在这里，声明了十进制变量 `decimal`、`debit` 和 `balance`。`balance`
    变量通过 `debit` 的减法计算。计算后结果为 44.57，将在控制台打印。


    现在执行下一个方法是 `String()` 方法。在这里声明了字符串变量 `firstName` 和 `lastName`，程序通过使用插值符号 `$` 对它们进行字符串操作。`fullName`
    变量赋值为 “Tom”，程序在控制台打印。


    下一个方法是 `Boolean()`。在这个方法内部，声明了布尔变量 `is grass` 和 `is ocean`，它们将决定为什么。再次使用插值，程序打印的第一个字符串是
    “Is grass true”，第二个打印的字符串是 “Is ocean false”。


    最后，执行 `Var()` 方法。在这个方法中，声明了布尔类型变量 `result`，在编译时确定。编译期间，编译器查看赋值的右侧并发现 “Hello World”。`result`
    是字符串类型。此后，程序将其值打印到控制台。


    ![image_rsrc183.jpg]


    # 第二章：分支与循环


    编程并不总是直截了当的。有时它涉及到判断和条件。在某些点，根据条件或条件，程序的流程可以通过两种方式完成。这意味着如果满足某些条件，则执行 A，否则执行 B。此外，有时我们需要多次执行某些块并复用其逻辑，可以通过
    C# 中的循环来实现。C# 中的分支和循环依赖于布尔条件。如前所述，根据布尔条件，某个块将执行一次或多次。


    ## 2.1 - For 循环

    在 C# 编程语言中，有几种方法可以循环代码块。书中处理的第一种循环类型是 `for` 循环。`for` 循环用于确切知道想要迭代代码块的次数。它用 `for`
    关键字声明。`for` 循环执行代码块，直到 `for` 语句指定的条件返回 `false` 布尔值。


    ![image_rsrc184.jpg]

    变量初始化由程序执行一次。它在进入 `for` 语句内部的 `body` 块之前执行。在这里声明并初始化将在 `body` 块使用的变量。语法中的 `condition`
    部分表示布尔表达式，根据该表达式将决定是否有必要重新进入 `body` 块。迭代步骤描述了计数器的增加或减少。该语句在每次 `body` 块执行后执行。如果我们由于某些原因想跳出
    `for` 循环的迭代，可以使用 `break` 语句。


    ![image_rsrc185.jpg]

    在这里我们有一个通过 `body` 块迭代五次的代码块。在 `body` 代码块中，计数器变量每次都乘以二。在此计算之前，有一个条件检查计数器值是否超过了一百。它应该通过此块迭代五次，但如果你仔细观察，你会发现它并不是那样的。开始时，计数器值为
    20。第一次迭代后变为 40，第二次变为 80，然后第三次变为 160，在第四次迭代时，条件被满足。因此，由于计数器大于一百，代码退出循环。然后，它继续执行循环语句下面的代码。在
    `for` 循环中，还有一个与 `break` 类似的语句，其关键字被称为 `continue`。`continue` 语句意味着它中断当前迭代的执行，并在满足条件时跳转到下一次迭代。


    ![image_rsrc186.jpg]

    程序的这部分本应该迭代五次，并且每次都将计数器数字打印到控制台，除了其中一次迭代。这是由于 `if` 条件，程序正在检查变量计数器 `i` 是否等于三。在第四次迭代中，变量
    `i` 等于三，程序将执行 `continue` 语句，这中断了第四次迭代的数字打印。然而，它并没有中断整个循环，只是继续下一次迭代。在这种情况下，最后一次迭代的输出如下：


    ![image_rsrc187.jpg]


    ## 2.2 - While 循环

    C# 代码中的下一个循环语句是 `while` 循环。该语句也代表相同代码块的重复执行。使用 `while` 语句的语法如下：


    ![image_rsrc188.jpg]

    `body` 代码块在 `expression` 变量返回 `true` 时执行。与 `for` 循环不同，这里的初始化部分在循环之前完成。在 `body`
    代码块内部应该处理计数器的增加或减少。由于 `while` 语句的条件在开始时为 `false`，程序可能永远不会进入 `body` 代码块。`for` 循环不会发生这种情况，因为最小迭代次数为一次。这里可以通过
    `break` 语句退出循环。`do-while` 循环也是与 `while` 循环相同的，条件在结尾。


    ![image_rsrc189.jpg]

    `do-while` 循环的语法如下：


    ![image_rsrc18A.jpg]

    在这里，程序通过 `while` 循环迭代五次。在第四次迭代中，当计数器 `i` 等于三时，程序进入 `if` 块。你可能在如果 `i` 从开始等于零时会打印任何内容。第一次迭代后，程序不满足条件，循环停止。输出将是：


    ![image_rsrc18B.jpg]


    ## 2.3 - 递归

    “递归”一词在编程以及 C# 语言中都是典型的。当问题变得过于复杂时，算法需要拆分成更小的部分以找到解决方案。递归是一种程序方法或过程反复调用自身来解决问题的技术。为了让这更容易，递归是在
    `body` 块内部调用函数的过程。某些需要遍历特定代码块的问题可以通过递归简化并解决。最佳情况应该是名为阶乘的数学问题的计算。数字的阶乘表示从 1 到该数字每个数字的乘积。零阶乘和一阶乘的值为：

    0! = 1;

    1! = 1;

    2! = 1*2 = 2;

    3! = 1*2*3 = 6;

    4! = 1*2*3*4 = 24;

    5! = 1*2*3*4*5 = 120;


    ![image_rsrc18E.jpg]

    在这个示例中，程序包含一个 `Main` 方法，在控制台上写入两行。第一行的输出值是 `fact(5)` 方法的返回值。第二行的输出是 `factLoop(5)`
    方法的返回值。两个方法都传递了参数，该参数代表程序想要计算的阶乘值——变量 `n`。两个方法都检查传递的数字是否为零或一，因为那是阶乘计算的边界情况（0!
    = 1! = 1）。第二个方法 (`factLoop`) 是通过 `while` 循环计算数字阶乘的方法。初始变量在方法开始处。这些变量被称为 `factorielValue`，它将是函数的返回值（变量内部，程序已经计算出了特定数字的阶乘）。此外，计数器变量
    `i` 代表条件控制器，控制程序应该迭代 `while` 循环多少次以获得数字的阶乘。在每次迭代中，我们将当前的 `factorielValue` 变量值与计数器变量
    `i` 相乘，并将计数器加一。最后迭代结束后，程序将获得传递数字的阶乘值，并作为执行方法的结果返回。


    该算法可以通过递归概念简化。第一个方法 `fact(5)` 使用了递归方法。该方法的结果与上述说明的非递归方法的结果相同——使用循环的解决方案。在此方法中，在零或一阶乘检查后，程序返回乘以当前上下文调用的传递的值。因此，在
    `fact(5)` 调用时，程序计算 `5 * fact(5-1)`，然后调用同一个方法，但传递了不同的参数，这次传递的是参数四。


