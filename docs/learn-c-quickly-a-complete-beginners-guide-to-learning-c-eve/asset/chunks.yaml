    关键字。`virtual` 方法代表可以在派生类中重定义的方法。`virtual` 方法既存在于基类也存在于派生类中。当我们有默认功能并想要扩展或更改该功能时，`override`
    关键字是可选的。与必须 `override` 的 `abstract` 方法不同，`override` 方法提供了一种新的、不同的实现，这是多态的最好示例。


    ## 第 7 章：SOLID 原则


    SOLID 原则代表了程序员在使用 C# 语言进行编程时应该遵循的方式。五个面向对象的设计原则就是 SOLID 设计。当结合遵循这些原则时，它们会让编码变得更加简单。它们使得开发应用程序或任何易受变化的软件变得容易。如果程序员或团队遵循这些原则，维护和扩展代码将变得舒适得多。


    遵循 SOLID 让开发者避免糟糕的编码实践，这使得系统易于重构。SOLID 使软件适用于自适应和敏捷开发。如果不按照 SOLID 设计进行编码，对代码的每个微小更改请求可能对开发者来说都变得非常有压力且痛苦。如果应用程序的设计和架构走向错误的方向，即使是最小的更改也可能导致特定软件出现严重问题。这并不是应该发生的。更改和新功能是软件开发的一部分，它们永远存在，且不应归咎于此。


    在开发过程中最常见的错误是不适合的类中添加更多职责。向特定类添加不相关的功能是不好的。此外，当开发者强制类之间相互依赖时，在某个时刻一个类的更改也会影响另一个类。因此，将类和组件紧密耦合是通往失败的道路。应用程序中重复的代码也是应该避免的。这些只是从手中漏掉的一些错误。解决所有这些潜在问题的办法是从开始选择正确的应用程序架构，在整个开发过程中遵循设计原则并选择正确的设计。


    ### 7.1 - 单一责任原则


    单一责任原则说：“每个软件模块应该只有一个变化的理由。”这意味着每个特定组件应该只有一个职责。这并不意味着每个模块应该只有一个属性。只要它们服务于单一职责，可以有多个成员。这个原则为我们提供了从开始识别类的最佳方式。它让你思考所有可能变化的软件模块。只有对软件有清晰的理解，才能实现最好的职责分离。让我们看看示例：


    ![](img/image_rsrc1A3.jpg)


