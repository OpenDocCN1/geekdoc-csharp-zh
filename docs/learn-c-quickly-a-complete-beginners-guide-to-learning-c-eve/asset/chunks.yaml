    # Chapter 4: Classes and Objects


    In C# programming language, every component is associated with classes and objects,
    and these represent the basic concepts of object-oriented programming. A class
    is something like a prototype from which the user creates objects. A class represents
    a single, unique unit with all of its members, attributes, and functionality.
    The objects are real-life in-memory entities. When instantiated, they allocate
    some memory space and have reference to it. Every object created must be of a
    class type.


    ## 4.1 - Class


    As mentioned, classes represent the unique programming components inside any object-oriented
    software. The class is defined with its access modifier, `class` keyword, and
    a unique name. Inside some class, there could be multiple members such as fields,
    properties, and methods. The default access modifier of a class is `internal`.
    This means that if the access modifier is not specified, then that particular
    class would be treated as `internal`. An example of a class is written below![](image_rsrc1V.jpg)
    This class contains its access modifier `public`, which contains the keyword `class`;
    it has a unique name `TShirt`. Inside this class, there are multiple members defined.
    There is one private field `color`, one public property `Color`, one constructor
    defined (with one parameter), and one public method `About`. Apart from the usual
    classes, there is one special type of class - `abstract class`. An abstract class
    is a special type of class in which an object cannot be instantiated. Abstract
    classes are mostly used to define a base class in the hierarchy, and it is also
    known as an incomplete class. The abstract classes typically represent a base
    class. It is designed to have derived classes implementing the abstract definitions.
    In the abstract classes, there could as well be `abstract methods` or non-abstract
    methods. The abstract methods, as well as every class member that is marked as
    abstract, must be implemented in the derived class. The classes that are marked
    with the `abstract` keyword have the purpose of providing the prototype for the
    derived classes. An abstract class can have a constructor implemented. An example
    is provided below![](image_rsrc18W.jpg) ![](image_rsrc18X.jpg) In the provided
    example, we can see one abstract class with the name `Animal`. In this class,
    there is only one member, and that is an abstract void method `LegsNumber()`.
    When the method is marked as abstract, it means that every class derived from
    that class, as in this case, an `Animal` class, must have an `override` implementation
    of that method. Below the abstract class, there are two more classes, which are
    the ''normal'' classes. Both classes have the `override` implementation of a `LegsNumber()`
    method from the `Animal` class. That is because both the `Elephant` and `Pigeon`
    classes inherit from the `Animal` class. Inheritance will be explained in detail
    later, but for now the `:` symbol next to `Elephant` and `Pigeon` means they inherit
    from the `Animal` class.


    ## 4.2 - Object


    Objects in C# represent the real entities in the system, with all of their class
    characteristics and features. They are located somewhere in memory and have reference
    to it. Whenever the `new` keyword is used, an object in memory is created. Objects
    must be of a class type. Every object created in C# programming language is derived
    from `System.Object` class. Every object created from `System.Object` class (inheritance
    will be explained later) also has the methods available from their parent class.
    These methods are: `Equals`, `ToString`, `Finalize`, and `GetHashCode`. This could
    be checked in the example![](image_rsrc18Z.jpg) This example is using the class
    `TShirt`, which was shown in the previous example. In the `Main` method, an object
    of `TShirt` type is instantiated. This object is referenced by the `tshirt` variable.
    In the second line, you can see the available methods and properties that could
    be executed over the `tshirt` object. Besides `Color` property and `About` method
    that are part of the `TShirt` class, there are also four methods from the parent
    class `Object`: `Equals`, `GetHashCode`, `GetType`, and `ToString`.


    ## 4.3 - Interface


    Another important component in object-oriented programming is `interface`. An
    interface represents multiple declarations of some functionalities. A class can
    implement one or more interfaces, but can only inherit from one class or abstract
    class. This reveals another C# programming language characteristic - it does not
    support multiple inheritance. Classes that implement some interface must provide
    a full definition of all interface members. In the interface usage, there is no
    manipulation with access modifiers as all interface members are considered to
    be `public`. This is because interface existence is all about functionality to
    be implemented by other classes. If some class must implement interface members,
    it means that the interface members must be `public` in order to be implemented
    by other classes. The interface is an object-oriented component that has declarations,
    but it cannot have definitions - implementations. If you try to insert some implementations
    in the interface, the compile-time error will appear. The interface can contain
    properties and methods - everything can have the implementation. It cannot have
    fields and a constructor - because it is not a class, and it cannot be instantiated.
    On implementation of the interface, the class must implement all of the interface
    members. As mentioned, multiple inheritance is not supported in C#, but it can
    be achieved with interface usage since a class can implement multiple interfaces.
    Example![](image_rsrc190.jpg) Here we have one interface defined. It has three
    boolean properties inside. A class that will implement this interface must have
    the definition of all these interface members![](image_rsrc191.jpg) The program
    contains one class, which is `Person` class. This class implements the `IPerson`
    interface that has been declared. This class has two private string fields, which
    are `_firstName` and `_lastName`. It also has a constructor where those field
    values are assigned. Besides that, this class has the definition of three members
    of the `IPerson` interface – `IsRunning`, `IsStanding`, and `IsSitting` properties.
    The compiler is fine with this, as there are no errors. But, if we remove any
