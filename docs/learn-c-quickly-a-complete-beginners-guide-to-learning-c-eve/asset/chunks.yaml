    ProgrammingAsynchronous programming represents a way of handling the events in
    the program. It happens when a single unit of work that represents some jobs or
    events runs separately from the main application thread. After execution, the
    event job will notify the thread that made the call about the success or failure
    execution. You are probably wondering when to use asynchronous programming and
    what kind of benefits it applies to your software. The biggest benefit of using
    the asynchronous programming technique is the better responsiveness and performance
    of a software. The operation, which is marked as asynchronous, is always running
    independently of the main process execution.For example, in C# programming language,
    a program starts executing the code from the Main method, and after everything
    is finished, the program ends when the Main method returns the value. All calls
    run sequentially, and every time, one operation waits until the previous operation
    finishes its job. The way asynchronous programming is done in C# is slightly different.Here
    we are going to demonstrate the main principle. If you want to clarify the method
    to be asynchronous and force it to do the work asynchronously, you need to put the
    async keyword next to the access modifier. After that, you can call this function
    asynchronously. After you have prepared your function to work asynchronously,
    you would probably want to call it at some point. This is done by writing the
    keyword waiting in front of the method call. This means marking it to execute
    asynchronously.Before getting to the examples, there are few things you should
    know. In the C# Framework called .NET, there is a class known as the Threading.Task,
    and this class lets you create event tasks and make them run asynchronously. A
    task is something that represents the object in which some jobs should be done.
    The task is responsible for letting you know if the operation has some results.
    It is responsible for the completeness of the job. It is also essential to know
    what Threads are. The C# .NET framework contains thread-associated classes in
    the System.Threading namespace . It contains a set of components that are needed
    for asynchronous and parallel programming. A Thread represents the small set of
    executable instructions.  Task  represents the return type of an asynchronous
    method. Now, let us demonstrate this with an example:![](image_rsrc1AU.jpg)In
    this small program, there is a simple demonstration of async programming. As always,
    there is a Program class with its Main method inside. Besides the Main method,
    there is one async method; an async task execution. This Task returns a string
    in its result property. Inside the body of the SomAsyncCode method, there is an
    awaited call for the Task.Delay method. This method waits the amount of time that
    is passed to the parameter before it returns the control to the calling thread.
    The amount of time is considered to be in milliseconds. So this Task will wait
    3000 milliseconds, or 3 seconds before it returns the result string "All done!".
    In the Main method, in the beginning, there is a simple output to the console
    saying "Hello World!". After that, there is a call to the Task defined below and
    the assignment of its result to the variable response. In the end, there is a
    print to the console output of the result returned from the asynchronous Task.
    What will actually happen here? You will see the "Hello World!" output to the
    console, and then there would be a delay of three seconds before the code continues
    the execution. After three seconds, the new output will be visible in the console.
    Let us run the program and show you the results:![](image_rsrc1AV.jpg)Here is
    the "Hello World!" message. Wait three seconds: one, two, three. Boom! The final
    output is down:![](image_rsrc1AW.jpg)After three seconds, we have got the result
    of the async Task - the "All done!" message, and the program came to an end. Let
    us demonstrate one more example for better understanding:![](image_rsrc1AX.jpg)In
    this example, there are two methods. The first method is an async Task method,
    which sets one task for asynchronous execution. Inside this async execution, there
    are one thousand iterations of printing the message "Async print" to the standard
    output. In the non-async method, there are two thousand and five hundred iterations
    of printing the "Non async print" message to the standard output. The Main method
    contains the call to each of these methods, respectively. The first call is for
    the async method execution, and the second is for the normal execution. You can
    notice that there is no await  keyword in front of the AsyncMethod() call in the
    Main method. This means that this method will run asynchronously, but the execution
    of the statements below the async call will not wait until AsyncMethod() finishes
    its job. This will result in two jobs working in parallel. The first is the Main
    method thread, which will continue to the NonAsyncMethod() execution after running
    the async task for the AsyncMethod(). It will result in parallel printing of the
    different messages. There will be no order, as both threads will work its own
    foreach statement in parallel. It will provide an output like this:![](image_rsrc1AY.jpg)It
    resulted in total print disorder. Those two processes were "competing" on who
    will execute the job faster. But, if we modify the program a little bit, we can
    make it wait for the async method to finish. Below is the modified code:![](image_rsrc1AZ.jpg)Since
    the Main method could not be marked as async, we created one async method ExecuteJob()
    and added the two methods from the previous example. First, we created Task reference
    from the AsyncMethod() and put it inside the task  variable.  The NonAsyncMethod
    and AsyncMethod are then executed. AsyncMethod is awaited, and its result is printed
    after the execution is finished. The output is seen below:![](image_rsrc1B0.jpg)8.2
    - Parallel ProgrammingThe parallel programming principle is the model in which
    the execution of the processes is divided into smaller pieces, which are to be
    done at the same time. It is also called concurrent programming. It is realized
    by multiple processors (or cores of the processors) in order to accomplish better
    performance in the code execution. By splitting the operations to work concurrently,
    the time of task completion is reduced, which is obviously improving the performance,
    and the user''s experience while working in a certain application. With the processor
    evolving, as a hardware device, the concurrent programming has taken its significant
    place in the programming.The thing you must know is the concept of the Thread.
    A thread represents the certain process execution for which a system is allocating
    the processor time. In concurrent programming, one process can have multiple threads
    that execute some action in Parallel if there are multiple CPUs or CPU cores in
    the hardware. The better the hardware, and the CPU components, the bigger the
    possibility to execute some code in Parallel and to have results faster than in
    the usual technique. It is important to define a few terms in C# programming language
    that are linked with parallel programming. The ConcurrentBag  represents a collection
    class that is supporting the data to be stored in some unordered manner. This
    class also supports the duplicates, and it is a thread-safe class that allows
    multiple threads to take advantage of it.The Parallel  class is the C# built-in
    class that provides the support for loops working in parallel execution. Every
    looping statement we have used until now has been executing the code in a sequential
    way. The Parallel class makes the loops execute their iterations in Parallel.
    There are also key methods, such as Parallel.Invoke , Parallel.For , and Parallel.ForEach
    . Now we jump to the example to furthermore explain the concept of parallel programming.![](image_rsrc1B1.jpg)This
    program consists of one class Program and its Main method. At the beginning of
    the program, we initialize one ConcurrentBag collection of integers. Below the
    ConcurrentBag collection, there is a simple List of int values object initialization.
    The ConcurrentBag object is called parallelIntegers,  and the List object is called listIntegers
    . After that, we created an int variable and assigned value five to it. This variable
    is used for populating the elements of both parallelIntegers and listIntegers
    variables. This is done through the while loop, which iterates five times because,
    in its condition, there is a decrementing of the numberOfIntegers  variable in
    each iteration. The numberOfIntegers decrements each time the execution gets into
    the condition of a while loop. The value of the previously decremented variable
    is added to both the parallelIntegers and listIntegers collections. This means
    that both collections will have the next elements - four, three, two, one, zero.
    After the collections are populated, we are then ready to execute some parallel
    code. The Parallel.Invoke method is then called. This method takes an array of
    Actions as a parameter. The Action represents a Delegate, which is encapsulating
    a method, and it does not take any parameter. It is important to understand the
    Delegates first. A Delegate represents a pointer to a method, and it is a reference
    data type, and this reference is a reference to some method. The Action delegate
    can be used to pass a method as a parameter and all of that is being done without
    declaring a custom delegate itself. In this example, the actions are used with
    the Lambda expression. What are Lambda expressions? This term in C# programming
    language represents an anonymous function that contains expression or sequence
    of statements or operators. The lambda expressions are using the lambda operator
    =>. This operator means something like: "The left side goes to something on the
    right side". The left side represents the input parameters of the lambda expression,
    and the right side contains the code block that works with the parameters passed
    on the right side. Lambda expressions are used to replace delegates when needed.Now,
    let''s return to the example. Here, in the Parallel.Invoke method, we have two
    lambda expressions that are used as Actions. On the left side, there is nothing;
    no parameters. This means that no parameters are passed to this lambda expressions.
    Both actions are supposed to execute in parallel. What are the Actions doing?
    In the first Action code block, there is a loop over each element of the listIntegers 
    collection. In every iteration, the Thread execution sleeps for 1000 milliseconds.
    This means that every iteration will wait for just one second before jumping to
    the next iteration. After the execution of the five iterations in this listIntegers,
    the program will print out to the console line "Linear is done" message. This
    means that the non-concurrent execution of the loop has finished its work. That
    will happen after about five seconds after the Action is invoked.The second Action
    is a little bit different. Here we also have one lambda expression that represents
    the Action. This lambda expression does not also have any parameters passed to
    its code block. In the second Action, there is an iteration through the ConcurrentBag
    collection - parallelIntegers. For each element of this collection, the program
    sleeps for 1000 milliseconds (one second). The main difference is that this loop
    is made concurrently. Every iteration starts at about the same time and will be
    executed separately. The code block of this loop also sleeps the program for one
    second. But, if five iterations start at about the same time, and the job of every
    iteration is to wait for one second, what will actually happen? The thing is that
    those five separate processes will all start at the same time, and each of them
    will wait for one second. This will produce the one-second wait for all of the
    five iterations. So, this loop will be executed in about one second. We can conclude
    that this second Action will be finished in one-second time, which is obviously
    not the case with the first Action. The first Action will last about five seconds
    because every iteration is executed sequentially and non-concurrently. The final
    output of this program will be "Parallel is done" message - after the approximate
    one-second wait, and then, "Linear is done" message after the approximate five
    seconds wait. Let us run the program and prove these statements.![](image_rsrc1B2.jpg)The
    second Action finished the execution after about one second. Let''s wait for the
    first Action to finish its execution. One, two, three, four, five... Boom!![](image_rsrc1B3.jpg)The
    second message is also printed to the console output, and the program finished
    the execution. This way, we have demonstrated the parallel programming concept.
    Pretty cool, right?8.3 - LINQLanguage integrated query, better known as LINQ,
    represents query syntax in C# programming language, and it is used for retrieval
    and filtering of the different sources of objects. LINQ produces a single querying
    interface for various kinds of objects and variables. This query syntax is integrated
    into C# programming language, as well as in Visual Basic. For better understanding,
    we will provide an example to further explain it. Therefore, you have SQL as a
    Structured Query Language. SQL is used to get and save some data into the database.
    It is a language designed to work closely with the database.In the same way as
    SQL, the LINQ is used to get and filter different data sources like collections,
    data sets, etc. There are many ways you can use LINQ; it is used to query object
    collections, ADO .Net data sets, XML Documents, Entity Framework data sets, SQL
    database direct and other data sources by implementing the IQuerable interface.
    LINQ is like a bridge between some data and variables in the program. Every LINQ
    query returns objects as a result. It is good because it enables the use of an
    object-oriented approach on the data set. When using LINQ, you do not have to
    worry about converting the setups of data into objects. LINQ provides a way to
    query data wherever that data came from. It supports the compile-time syntax checking,
    so that if you make a mistake while coding LINQ, the compiler will inform you
    immediately. LINQ allows you to query every collection such as List, Array, Enumerable
    classes, etc.We are heading to the examples now:![](image_rsrc1B4.jpg)In this
    example, we have one class named Car. In the Car class, there are three properties,
