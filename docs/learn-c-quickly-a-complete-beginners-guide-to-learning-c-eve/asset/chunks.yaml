    parameter is the total number of elements the program wants to print out to the
    console line. This parameter is static and it never changes its value. In every
    recursion call, it will have the same value as the value passed from the first
    recursion call. If there were no third and fourth parameters, this sequence would
    print the Fibonacci array of numbers until infinity. This method is initially
    called with the following four parameters: `0` for the current element that should
    be printed, `1` for the next element that should be printed, `1` for the step
    one of the printing, and `10` for the length of the Fibonacci array. In the beginning,
    the program prints the current element of the Fibonacci array, which is passed
    as the first parameter. After that, there is a condition in which the program
    checks whether the step passed from the third parameter is less than the length
    of the desired output array. If that condition is fulfilled, the method calls
    itself again, but with the different parameters. In the next call, the first parameter
    becomes the second parameter from the previous call because, in the previous call,
    the second parameter was the next element for printing. The second parameter,
    which represents the next element for printing, is calculated by the addition
    of the current and the next element from the previous call. The third parameter
    is the step incremented by one, and the fourth parameter stays the same in every
    call. This way, the Fibonacci sequence is built with recursion principle of the
    method calling itself. The flow of recursion calls is the same as in Recursion
    explained earlier. When the last recursive method is executed, its result is returned
    to its parent method. The output of this sequence shall be 0, 1, 1, 2, 3, 5, 8,
    13, 21 and 34, line by line. ![](image_rsrc1M.jpg)


    # Chapter 3: Methods and Properties


    In C# programming language, as well as in other object-oriented languages, there
    is a term called method. A method is some block of code which is executed when
    called inside the program. It can also be defined as a group of statements which
    is supposed to perform some logic. Methods are also known as functions, and they
    are used to perform actions. The biggest advantage of using the methods is code
    reusability. One particular logic can be defined in one place, and can also be
    called multiple times in different places in the program. A method is defined
    with its name, followed by parentheses `()`. The vital elements of the methods
    are the access specifier, return type of the method, method name, list of parameters,
    and body of the method. The access modifier represents the visibility of a method.
    There are two types of methods based on the return types: `void` methods and explicit
    methods. `Void` methods do not have a return value. They are specified to do some
    work which does not require result. Explicit typed methods are the methods that
    have a return value. The return types of a method can be various. For example,
    the return type of a method can be `int`, `string`, `bool`, etc. A method name
    represents the unique identifier of a method, and it is case sensitive in C# programming
    language. That means it recognizes the difference between capital and lowercase
    letters. For example, `Book()` method name is not the same as `book()` method
    name. The list of parameters is used to receive and pass the data to and from
    the method. The parameters can be of any type, and there are a few ways of passing
    the parameters to the method. In value passing method, all changes that are made
    to this parameter inside a method do not have an effect on the argument which
    was passed. This happens because the reference of the variable is not passed;
    it is just a copy of that value. In reference passing method, every change which
    is made to the parameter has an effect on the argument variable. This happens
    because the reference to the memory location of argument is copied into the formal
    parameter. The body block of the method contains a sequence of instructions needed
    for some logic execution. Methods can also be overloaded. Overloading means that
    multiple methods can be defined with the same name but with different parameters.
    For example, the compiler won''t report an error if `Book()` and `Book(int pageNumber)`
    methods are defined.


    Properties in C# programming languages are something like a mix of method and
    variable. It is important to understand the fields first. Fields are elements
    of a class that are used for storing data, and the extension of the field is called
    property. Reading the data, writing the data to it, or calculating the data is
    done using the accessors. The accessors in a property are getters and setters.
    When assigning a value to the property, the `set` is invoked. When using the property
    value, calling it in some code statement, the `get` is invoked. This way, the
    program ensures that the reading and writing of data is safe. Let us jump into
    example and introduce this concept better.![](image_rsrc18P.jpg)


