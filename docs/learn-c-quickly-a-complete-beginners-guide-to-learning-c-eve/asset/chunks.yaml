    ## Chapter 7: SOLID Principles


    SOLID principles represent a way of what programmers should follow while programming
    in C# language. The five object-oriented design principles are SOLID design. When
    following these principles combined, they make everything easier while coding.
    They are making it easy to develop the application or any kind of software that
    is susceptible to changes. If the programmer or the team follows these principles,
    maintaining and extending the code will be far more comfortable.


    Following SOLID makes developers avoid lousy coding practices, and this makes
    the system comfortable for refactoring. SOLID makes the software suitable for
    adaptive and agile development. If not coding in a SOLID design, every small request
    for a change in the code might become really stressful and painful for a developer.
    If the application design and architecture are going in the wrong direction, every
    change, even the smallest, could cause significant problems in the particular
    software. That is not what is supposed to happen. The changes and new features
    are part of the software development, they will always exist, and they are not
    to be blamed.


    The most common mistakes that have been made over the course of development is
    adding more responsibilities to a class that is not suited for that. It is bad
    to add more functionality that is not related to a certain class. Also, when developers
    force the classes to depend on each other, at some point, a change in one class
    will affect the other class also. So, making the classes and components tightly
    coupled is a journey to failure. The duplicate code all over the application is
    also something that should be bypassed. These are just some of the mistakes that
    are slipping through the developer''s hands. The solution to all of these potential
    problems is choosing the right architecture of the application from the start,
    following design principles throughout development, and choosing the right design.


    ### 7.1 - Single Responsibility Principle


    Single Responsibility Principle says, "Every software module should have one reason
    to change." What this means is that every particular component should have only
    one duty. It does not mean that every module should have just one property. There
    could be as many members as needed as long as they serve a single responsibility.
    This principle provides us with the best way of recognizing classes at the start.
    It makes you think of all software modules that can change. Only when there is
    a clear understanding of software should work can the best separation of responsibilities
    be achieved. Let us look at the examples:


