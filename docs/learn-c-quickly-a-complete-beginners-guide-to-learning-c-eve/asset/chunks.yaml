    第二个类被称为 `Reports` 类，它的创建是为了处理报告和文档部分。我们将文档生成方法移动到了这个类中，现在一切看起来都完美了。也许明天，客户会要求我们生成更多类型的文档。在这种情况下，所有与文档和报告相关的新方法都将在
