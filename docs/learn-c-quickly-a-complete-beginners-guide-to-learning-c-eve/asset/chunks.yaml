    logic into two interface components and make their usage correct. Then it will
    look something like this:![](image_rsrc1AN.jpg)Great! It looks better now. The
    interface segregation principle is now fulfilled. We have been able to divide
    the IEmployee interface into two more specific interface components. The first
    one is the program interface, which contains both methods from the IEmployee interface.
    The second method is known as the ITester interface, and this interface contains
    only one method, and that is the CreateDevelopmentTask. It does not have the WorkOnDevelopmentTask
    method because the Tester class does not need it. The Programmer class will now
    implement the IEmployee interface, and it will have full implementation of both
    methods from the interface. The Tester class will implement the ITester interface
    that contains only the CreateDevelopmentTask method. This way, we have been able
    to organize the interface usage better. There are no methods without implementations
    in any of the classes. Every new method that will be needed to add to either Programmer
    or Tester class will find its way to the correct interface, and nothing will be
    unused. The interface segregation principle is completed in this example after
    a few modifications. The code is ready for new features, and it is easily able
    to modify the behavior.7.5 - Dependency Inversion Principle"High-level modules
    should not depend upon the details but on the abstraction." This sentence represents
    the dependency inversion principle. What this means is that there should not be
    tight coupling between software modules and components. Everything should be developed
    with abstraction characteristic to avoid tight coupling. The high-level components
    are commonly implementing the business layer of a system, unlike the low-level
    components which are responsible for the more detailed procedures. The main thing
    here is that we must maintain high-level and low-level modules loosely coupled.
    In order to do so, there should not be an implementation that would make the two
    modules identify each other.Tightly coupling of the modules is when a high-level
    component knows a lot about other components with which it interacts. If there
    is tight coupling, there is also a big risk that the changes to one module or
    class will possibly break the logic in the other module or class. There is a technique
    for the implementation of the dependency inversion principle in C# programming
    language, and it is well-known as Inversion of Control (IoC). The inversion of
    control could be implemented by using abstract classes or interface components.
    This technique removes the dependencies between classes and modules. The low-level
    components should follow the commitment to a single interface, and the high-level
    components are supposed to use modules that are implementing that particular interface.
    Let us start with the examples:![](image_rsrc1AP.jpg)![](image_rsrc1AR.jpg)In
    this example, there is an interface called IVehicle. Inside that interface, there
    is one property, which is the IsAutomatic read-only property. This interface is
    implemented by two classes. The first is known as the Car class. This class implements
    IsAutomatic property from the interface and also contains one property of its
    own. The property that the Car class contains is the TrunkCapacity. Both properties
    are needed for instantiating the object of a Car class. The constructor takes
    two parameters, one for the TrunkCapacity and the second one for the IsAutomatic
    property.The Truck class does something similar. It also implements the read-only
    property IsAutomatic from the interface, and it has one property of its own -
    the BedCapacity. Like in the previous class, here we also need both properties
    in order to create an instance of a Truck object. It is because the constructor
    takes two parameters, one for the BedCapacity assignment, and one for the IsAutomatic
    property assignment. In the Main method of a Program class, we have created an
    empty list of IVehicle elements. After that, we instantiated two objects, one
    object of a Car class type, and the other object of a Truck class type. Each of
    them implements the IVehicle interface so that they could be recognized as IVehicle
    type. Due to this, we can then add those objects into the previously created list,
    and both of them are added to the list. After that, we print into the console
    line, the information about the vehicles from the list. We are printing the IsAutomatic
    information for both of the added objects, and also the TrunkCapacity for the
    Car object and BedCapacity for the Truck object. We are able to access this information
    by casting the object of the IVehicle type into the explicit object, and this
    is done for the TrunkCapacity writing and the BedCapacity writing.For the TrunkCapacity
    information, we must cast an object to the Car object, while for the BedCapacity,
    we must cast an object to the Truck object. This program is following the dependency
    inversion principle because there are no loosely coupled components. For example,
    if we want to add a new class known as Bicycle, we would just create that class
