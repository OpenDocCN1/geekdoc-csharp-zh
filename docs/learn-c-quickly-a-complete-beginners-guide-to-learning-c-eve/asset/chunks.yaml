    methods of the interface. The Draw() method prints that the program is drawing
    circles, and the Stop() method prints that the program stopped the drawing. So,
    these classes represent both the drawing of shapes and the stopping of drawing
    shapes. It describes the control on when to start drawing and when to stop drawing.
    Below these classes, there is a ShapeManager class, which actually does the whole
    thing about the dependency inversion principle. In this class, we have one private
    field _shape , which is of IShape type. We assign the value to this private field
    in the constructor. This constructor takes one parameter, one IShape type object,
    and sets it to the private field value. This is called dependency injection .
    There are a few types of injection; they will be all covered in the Dependency
    Injection chapter later. For now, it is good to know that this is the constructor
    injection. In the run-time, when the object is created, we inject the value through
    the constructor. It is not known which kind of object will be set here until the
    injection.In this case, two possible object types could be injected. The _shape
    field could become either a Rectangle object or the Circle object. Those two classes
