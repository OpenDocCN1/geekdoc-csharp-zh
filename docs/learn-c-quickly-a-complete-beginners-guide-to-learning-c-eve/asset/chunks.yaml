    # Chapter 5: Collections


    In C# programming language, there are specialized classes that control data storage
    and data manipulation. These classes are known as `collection` classes. The collection
    classes provide support for the most common data structures, such as queues, stacks,
    lists, and hash tables. Collection classes have various purposes, but the most
    important ones are the manipulation with the particular data structure. Also,
    one great purpose is the dynamic memory allocation, which means that when instantiating
    a collection object, only the reference to that object is being created. Memory
    allocation occurs when you add elements to the collection. So, memory allocation
    happens on-fly. In comparison with that, when instantiating an array of ten integer
    elements, immediate allocation of `sizeof(int)` bytes in memory occurs. Some collections
    support this kind of allocation, while some are split into few different namespaces.
    In the `System.Collections.Generic` namespace, there are Generic implementations
    of some data structures and some main classes are defined here. `Dictionary<TKey,
    TValue>` is the collection class that stores data based on key-value pairs. It
    has good retrieval functionality based on index. `List<T>` is the dynamic array,
    while `Queue<T>` is the collection class that represents the first-in-first-out
    functionality. Queue structure means that the first element inserted into the
    queue will be the first element. If we push three elements into the queue, for
    example, 4, 3, and 6 inside the queue, then we use `Dequeue` method over the queue
    variable two times and print each dequeued value. `Dequeue` method takes the element
    from the top of the queue and removes it from the queue. So, in the console, there
    will be numbers 4 and 3 printed respectively, leaving the number 6 lonely in the
    queue. The last one is `Stack<T>`. This creates the stack object of `Stack` data
    type with the integer elements allowed. `Stack<T>` represents the stack structure,
    last-in-first-out. If we push three elements into the stack, for example, 22,
    34, and 11. The `Push` method inserts the element on the top of the stack. After
    the push, we then execute two `Pop` methods and print each value returned from
    the `Pop` method. `Pop` method grabs the last inserted value and removes it from
    the stack. So, the output here will be 11 and 34, respectively, leaving the number
    22 alone on the stack. The complete console output looks like this![](image_rsrc196.jpg)


    ## 5.1 - List


    `List<T>` is the collection class that is most frequently used in all collection
    classes. It is a type whose main characteristic is the element accessibility by
    index. As mentioned before, `List` class comes under the `System.Collections.Generic`
    namespace. The `List` is a class that provides a lot of methods for the list and
    element manipulation. Some of them are searching, sorting, etc. It is used for
    creating a collection of many different types. It could be a collection of integers,
    strings, and many more. For the reference types, the `List` allows `null` value
    as an element. It is also possible to insert duplicate values inside any `List`
    collection. This class can use both the ordering and equality comparer. Arrays
    are similar to the lists, but the lists are able to resize dynamically, but arrays
    can not.


    ## 5.2 - Dictionary


    `Dictionary<TKey, TValue>` collection class is, as its name says, a collection
    of key-value pairs. It belongs to the `System.Collections.Generic` namespace.
    What does Dictionary provide? Well, the Dictionary class provides something like
    mapping of related data; it binds the key with its value pair and makes it very
    easy to access certain data if the key is known. This class is implemented based
    on Hash Table data structure. The Hash table is the data structure that has very
    good performances on insertion and retrieving data, no matter the size of the
    data. It is especially efficient in searching for the data. In a Dictionary object,
    every key must be unique. The key can not be `null`, but the value could be. This
    is possible only if the value type is part of reference types.


    ## 5.3 - ForEach


    The `ForEach` method is an extension method over the `List<T>` class. It is used
    for iterating through the collection and executing some operations with the elements.
    In the most common case, it contains a code to either read and pass element value
    to another job or function, or to update an element under certain conditions,
    etc. To sum up this chapter, a simple program is written below![](image_rsrc197.jpg)
    Here, we have a class `Program` that contains one method for `List()` manipulation
    and one method for `Dictionary()` manipulation. In the `List()` method, we are
    creating a `List` object of strings that contains four elements. These elements
    are "I," "am," "learning," and "C!". After the variable `sentence` object is instantiated
    and value-defined, we then execute the `ForEach` method over that object. This
    means that we are iterating through the created List and are able to reference
    the corresponding value in the list by the word `variable`. Here we simply print
    the value to the console. The more complex method is the `Dictionary()` method.
    In this method, we created three new List objects of the string data type. The
    first list represents the list of words that start with the letter A - `aWords`
    object. The second list represents the list of words starting with the letter
    B - `bWords` object, and the third represents the list of words starting with
    the letter C - `cWords` object.

