    Polymorphism is an object-oriented programming paradigm that stands for the usage
    of something with multiple forms. What this means is that one property or a function
    with the same name can have multiple different functionalities - implementations.
    In fact, the ability of a class to have multiple functionalities with the same
    name is Polymorphism. It is the fourth and probably the core paradigm in object-oriented
    programming concepts.


    Polymorphism happens when multiple classes are related to each other and are all
    connected by the inheritance principle. Inheritance and Polymorphism are tightly
    coupled; they go together in most cases. Inheritance enables fields, properties,
    and methods inheritance of the other classes, and the Polymorphism is there to
    use these members to perform different jobs. This is the thing that allows programmers
    to execute a single action in a few different ways.


    Polymorphism can be static or dynamic. Static Polymorphism is also known as the
    compile-time Polymorphism, and Dynamic Polymorphism is called the runtime polymorphism.
    Static Polymorphism happens in the compile-time, while that of dynamic happens
    in the runtime. The example of the compile-time Polymorphism is given below:


