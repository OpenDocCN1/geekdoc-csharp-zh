    # 4) `AddVehicleToInventory` method with `IVehicle` type object in the argument
    that will add the object to the inventory list. The second interface is simpler,
    and it has only one method. The `IManufacturerService` interface component has
    only the `BuyVehicle` method, which returns the `IVehicle` type object. It is
    a manufacturer based interface. Those were the service interface components that
    are ready to be implemented by the service classes. Now, we can go ahead and check
    the service classes, their implementation, and logic.![](image_rsrc1C7.jpg)


    The first service class that will be explained is the `DealershipService` class.
    The code of this class will be split into a few parts, and each part will be separately
    explained because of the size of the class. The `DealershipService` class implements
    the `IDealershipService` interface component, and it will implement all of the
    methods from this interface. The first thing in this class that you can notice
    is the private field `_vehicleContext`, which is of `VehicleContext` class type.
    This field''s state will be set in the class constructor, as provided below. The
    first method that is implemented is the `GetInventory` method. This method is
    supposed to return the `List` of `IVehicle` objects. In the beginning, we are
    instantiating `List<IVehicle>` type object. This object is empty in the beginning.
    Then, the list is populated by the `Cars` and `Trucks` lists from the given context.
    This means that we are adding all of the `Car` objects and all of the `Truck`
    objects from the `_vehicleContext`. The `Cars` and `Trucks` properties inside
    the context object are representing the records from the `Car` and `Truck` table
    in the database. It means that the list which we will return as a result of this
    method execution will have all of the objects from the `Truck` and `Car` database
    table. After we added those two database sets into our list, we are returning
    it as a result to the caller of the method. Now we can move forward with the explanation
    of the next methods.![](image_rsrc1C8.jpg)


    The next method is the `GetVehicle` method. This method will be used to retrieve
    the `IVehicle` object using the vehicle identification number. The method has
    one parameter, which is obviously the `vin` from which the particular object is
    to be found. First, we are declaring the `IVehicle` variable. The value of this
    variable is not instantiated, it is just declared, so this variable state is just
    null for now. Then, we are searching in the database context, in the `Cars` database
    set, the `first-or-default` object whose `Vin` property is equal to the `vin`
    value passed from the parameter. The value returned from this query statement
    will be stored in the `vehicle` variable. If there is no `Car` object with that
    particular `vin` value, the state of the `vehicle` variable will stay null. If
    that would be the case, we will then search in the `Trucks` database set from
    the context. The returned value will be stored again in the `vehicle` variable.
    If this query also did not return anything but null, the program will throw an
    exception with the message that there is no vehicle in the database with the provided
    identification number. However, if there is a vehicle with this particular identification
    number in the `Cars` or `Trucks` database sets, it will be returned as a result
    of this method execution.


    The next method that is implemented is the `SellVehicle` method. It also has one
    parameter, and that parameter is again the vehicle identification number, just
    like in the previous method. The idea is similar to the previous method; we will
    search for the vehicle with the provided `vin` inside the database sets, and if
    any is found, we will remove it from the database set and save the changes. In
    the beginning, we are declaring the `IVehicle` type variable. Then we search for
    the vehicle with provided `vin` inside the `Cars` database set. The result is
    stored in the `vehicle` variable. If the vehicle is null - no `Car` is found with
    that identification number, then we will search inside the `Trucks` database set.
    If the vehicle is found inside the `Trucks` set, we will remove it from the context
    and execute `SaveChanges()` over the context. This method assures that the object
    is deleted from the context. After all of these conditions are fulfilled, we will
    then return the control to the caller of the method. The other case will be if
    the vehicle is found inside the `Cars` database set. In this scenario, we are
    removing the vehicle from the `Cars` context and then performing the `SaveChanges()`
    method over the context object. If none of the conditions are fulfilled, the program
    will throw an exception with the message that states that there is no vehicle
    with the provided identification number. In this scenario, the vehicle is impossible
    to sell (remove) because that vehicle does not exist at all. Let''s take a look
    at the last method inside the `DealershipService` class.![](image_rsrc1C9.jpg)


    The last method implemented is the `AddVehicleToInventory` method. This method
    takes one parameter that is an `IVehicle` type object. The first thing we do here
    is to check whether the passed vehicle object is of a `Car` class type. If this
    is correct, the program enters the `if` body block code. Inside this code block,
    we are instantiating a `Car` class object by providing the `IsAutomatic`, `Vin`,
    and `TrunkSpace` property values from the passed object. This will invoke the
    constructor of the `Car` class, and it will create an instance of that object.
    This object will be stored in the `car` variable. After this, there is an adding
    of the car object to the `Cars` database set inside the database context. This
    will put a newly created car inside the database set, and then execute the `SaveChanges()`
    method over the context, the `Cars` set will be increased by one new car. If all
    of this is done, we are returning from the function. The other case is if the
    vehicle passed object is of a `Truck` class type. In this case, we will instantiate
    the `Truck` object by providing the `IsAutomatic`, `Vin`, and `BedSpace` property
    values from the parameter object. This will invoke the `Truck` constructor, and
    it will return a new object of `Truck` type to the `truck` variable. After that,
    the truck is added to the `Trucks` database set inside the context, and `SaveChanges()`
    is executed to save the newly added object to the database. After this, if none
    of these is executed, the exception is thrown. This exception contains the message
    that there is no corresponding type for the passed an object - it is neither `Car`
    nor `Truck` class type. This is the whole implementation of `DealershipService`
    class, and now we can jump to the other service implementation![](image_rsrc1CA.jpg)


    The second service class is `ManufacturerService` class. This class implements
    `IManufacturerService` interface, which means that it must have the implementation
    of `BuyVehicle` method. The `BuyVehicle` method is the method that is supposed
    to return the object of `IVehicle` type to the caller. At the beginning of the
    method, there is the creation of `Random` object. In C# programming language,
    the `Random` class is the pseudo-random number generator. This means that inside
    this class, there are methods that produce a sequence of numbers that meets certain
    criteria. There is random generator implemented here, and it works with providing
    statistical requirements for randomness. When buying vehicle, this method will
    decide whether would be a Car or Truck object. The decision will be randomly picked.
    In the `if` statement, you can see the call for `Next` method over `randomNumberGenerator`
    object. This object has two integer values which represent the minimum and the
    maximum number to be generated. The `Next` method from `Random` class in C# is
    generating the random value between provided values, and then do modulo operation
    over it. If the result is even number, the program will enter the `if` statement
    body. So, even number will result in `Car` object creation, and odd number will
    result in `Truck` object creation. The chance for both is about 50 percent. In
    the scenario where we are creating `Car` object, we will pass `true` value for
    `IsAutomatic` property, thereby creating a new `GUID` for the vehicle identification
    number and generating a random value between 100 and 499 for `TrunkSpace`. If
    you are not familiar with `GUID`, it stands for globally unique identifier, which
    is also referred to as `UUID` (universally unique identifier). These numbers are
    used in the programming world to represent unique numbers because they are impossible
    to repeat. In the case of creating `Truck` object, we are passing `true` value
    for `IsAutomatic` property, generating a new `GUID` for the vehicle identification
    number, and passing the value between 501 and 2000 for `BedSpace` property of
    Truck class. There is 50% chance for returning the `Car` object as well as the
    `Truck` object as result of `BuyVehicle` method. Now we can go ahead and see the
    `Main` method implementation in `Program` class, which will put all of this together![](image_rsrc1CB.jpg)[](image_rsrc1CC.jpg)


    The implementation of the `Main` method is ready to put to life every component
    in the application now. Let''s start. The first thing you notice is the creation
    of `DbContextOptionsBuilder` object over which we will use the in-memory database.
    The `Options` property of this builder is passed to the `options` variable because
    we will need it for the creation of the database context. After it, there is `using`
    statement in which we will create the context. Next, we will enter the `using`
    statement code block where the whole logic will happen. In the beginning, we will
    initialize the `serviceProvider` variable. We will be creating a new `ServiceCollection`
    object and adding the required mapping for dependencies. A singleton dependency
    map is added for both the service classes. The `DealershipService` mapping is
    added just with the `AddSingleton` method, while the singleton service is added
    with the factory which is specified as a built-in delegate. After the dependency
    injection mappings are defined, the `BuildServiceProvider()` method is called
    over `ServiceCollection` creation. It prepares everything for the usage of dependency
    injection. The DI defined mappings will be stored in the `serviceProvider` variable,
    and we will use that variable to get a particular service when needed. Then we
    will create one string variable `userInput` and assign an empty string to it.
    This variable will be responsible for the user interaction with the console application.
    The `while` loop is executed until the `userInput` becomes "exit".


    Now, everything is ready for printing the initial state of the console output.
    We are going to print the options that the user could execute inside the application.
    First, we are clearing the console, and then we print the console application
    name in the beginning - "Dealership Manager 2.0". The options for the user will
    be: 1) Buy a vehicle, 2) Sell a vehicle, 3) Show inventory. The user is able to
    communicate with the application by pressing the one, two, or three value in the
    console. When the user presses any of these numbers on the keyboard, the value
    will be stored inside the `userInput` variable (`userInput = Console.ReadLine()`).
    If the user typed "exit" to the console line, the program will break and the execution
    will finish. If the user typed number 1 and presses enter, the program will execute
    the first `if` statement code block. If the user presses number 1 and enter, it
    means that he wants to perform the action of buying a car. So, we are calling
    the `serviceProvider` to get the `IManufacturerService` type service and to execute
    the `BuyVehicle` method over that service object. This method execution will create
    one random instance of the `Car` or `Truck` class objects and return that value.
    It will be stored in the `vehicle` variable. Now, when a vehicle is bought, we
    must store it inside the inventory. So, we are calling the `serviceProvider` to
    get the `IDealershipService` type service and execute the `AddVehicleToInventory`
    method over it.


