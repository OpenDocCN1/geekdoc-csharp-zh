    # 4) `AddVehicleToInventory` 方法接收一个 `IVehicle` 类型对象作为参数，该方法将此对象添加到库存列表中。第二个接口更简单，它只有一个方法。`IManufacturerService`
    接口组件只有 `BuyVehicle` 方法，该方法返回一个 `IVehicle` 类型对象。这是一个基于制造商的接口。这些是已经准备好由服务类实现的服务接口组件。现在，我们可以继续检查服务类、它们的实现和逻辑。![](img/image_rsrc1C7.jpg)


    第一个要解释的服务类是 `DealershipService` 类。由于该类较大，该类的代码将分为几个部分，每个部分都将进行单独解释。`DealershipService`
    类实现了 `IDealershipService` 接口组件，并将实现该接口中的所有方法。在这个类中，你可以注意到的第一点是私有字段 `_vehicleContext`，它的类型为
    `VehicleContext` 类。该字段的状态将在类的构造函数中设置，如下所示。第一个实现的方法是 `GetInventory` 方法。该方法返回 `IVehicle`
    对象的 `List`。在开始时，我们实例化 `List<IVehicle>` 类型对象。该对象在开始是空的。然后，通过给定上下文中的 `Cars` 和 `Trucks`
    列表填充列表。这意味着我们正在从 `_vehicleContext` 中添加所有的 `Car` 对象和所有的 `Truck` 对象。上下文对象内部 `Cars`
    和 `Trucks` 属性代表数据库中 `Car` 和 `Truck` 表的记录。这意味着我们作为方法执行结果返回的列表将包含数据库 `Truck` 和 `Car`
    表中的所有对象。在将这两个数据集添加到我们的列表后，我们将其作为结果返回给方法的调用者。现在我们可以继续解释后续方法。![](img/image_rsrc1C8.jpg)


    下一个方法是 `GetVehicle` 方法。该方法将用于通过车辆识别码（VIN）检索 `IVehicle` 对象。该方法有一个参数，显然是用于查找特定对象的
    `vin`。首先，我们声明了 `IVehicle` 变量。该变量的值没有被实例化，只是被声明了，所以目前该变量的状态仅为 `null`。然后，我们在数据库上下文的
    `Cars` 数据集中查找 `Vin` 属性等于参数传递的 `vin` 值的 `first-or-default` 对象。此查询语句返回的值将存储在 `vehicle`
    变量中。如果没有具有该特定 `vin` 值的 `Car` 对象，则 `vehicle` 变量的状态将保持 `null`。如果是这样，我们将从上下查找 `Trucks`
    数据集。返回的值将再次存储在 `vehicle` 变量中。如果此查询也没有返回任何内容（返回 `null`），程序将抛出一个异常，消息为数据库中不存在具有提供识别码的车辆。然而，如果
    `Cars` 或 `Trucks` 数据集中存在此特定识别码的车辆，它将作为方法的执行结果返回。


    下一个实现的方法是 `SellVehicle` 方法。它也有一个参数，该参数同样是车辆识别码，与之前的方法相同。思路与之前的方法相似；我们将在数据集中根据提供的
    `vin` 查找车辆，如果找到，则将其从数据集中删除并保存更改。开始时，我们声明了 `IVehicle` 类型变量。然后我们在 `Cars` 数据集中查找具有提供
    `vin` 的车辆。结果存储在 `vehicle` 变量中。如果车辆为 `null`（未找到具有该识别码的 `Car`），我们将在 `Trucks` 数据集中查找。如果在
    `Trucks` 集合中找到车辆，我们将其从上下文中移除并在上下文上执行 `SaveChanges()`。此方法确保对象已从上下文中删除。在满足所有这些条件后，我们将控制权归还给方法的调用者。另一种情况是在
    `Cars` 数据集中找到了车辆。在这种情况下，我们从 `Cars` 上下文中移除该车辆，然后对上下文对象执行 `SaveChanges()` 方法。如果没有任何条件被满足，程序将抛出一个异常，消息指出没有具有提供识别码的车辆。在这种情况下，该车辆是不可能出售（删除）的，因为该车辆根本不存在。让我们看看
    `DealershipService` 类内部的最后一个方法。![](img/image_rsrc1C9.jpg)


    最后一个实现的方法是 `AddVehicleToInventory` 方法。该方法接收一个类型为 `IVehicle` 的对象参数。我们在这里做的第一件事是检查传递的车辆对象是否为
    `Car` 类类型。如果是，程序将进入 `if` 块块代码。在代码块内部，我们通过提供传递对象的 `IsAutomatic`、`Vin` 和 `TrunkSpace`
    属性值来实例化 `Car` 类对象。这将调用 `Car` 类的构造函数，并创建该对象的实例。该对象将存储在 `car` 变量中。之后，将汽车对象添加到 `Cars`
    数据集中。这将在数据集中添加新创建的汽车，然后对 `Cars` 集合执行 `SaveChanges()`。如果完成了所有这些操作，我们将向调用者返回。另一种情况是传递的对象是
    `Truck` 类类型。在这种情况下，我们通过提供参数对象的 `IsAutomatic`、`Vin` 和 `BedSpace` 属性值来实例化 `Truck`
    对象。这将调用 `Truck` 的构造函数，并返回 `Truck` 类型的新对象。之后，将卡车添加到 `Trucks` 数据集中，并执行 `SaveChanges()`
    保存新添加的对象。如果没有执行上述任何一个操作，程序将抛出一个异常，消息为传递的对象既不是 `Car` 也不是 `Truck` 类型。这是 `DealershipService`
    类的实现 image_rsrc1CA.jpg)


    第二个服务类是 `ManufacturerService` 类。该类实现了 `IManufacturerService` 接口，这意味着它必须实现 `BuyVehicle`
    方法。`BuyVehicle` 方法旨在向调用者返回 `IVehicle` 类型的对象。在方法的开始处，创建了 `Random` 对象。在 C# 语言中，`Random`
    类是随机数生成器，这意味着该类内部的方法产生符合特定标准的数字序列。购买车辆时，此方法将随机决定是 `Car` 对象还是 `Truck` 对象。在 `if`
    语句中，你可以对 `randomNumberGenerator` 调用 `Next` 方法。该对象有两个整数值，代表最小值和最大值。`Random` 类的
    `Next` 方法在的值之间生成随机值，然后对其进行模运算。如果结果是偶数，程序将进入 `if` 语句体。偶数将导致 `Car` 对象的创建，奇数将导致 `Truck`
    对象的创建。两种概率均为 50%。在创建 `Car` 对象的场景下，我们将 `IsAutomatic` 属性传递 `true` 值，生成一个新的车辆识别码
    GUID，并在 100 到 499 之间生成随机值。如果不熟悉 `GUID`，它代表全局唯一标识符，称为 `UUID`（通用唯一标识符）。这些数字在编程世界中表示唯一，因为它们是不重复的。在创建
    `Truck` 对象的情况下，我们为 `IsAutomatic` 属性传递 `true` 值，生成一个新的车辆识别码 GUID，并在 501 到 2000
    之间生成随机值。`BedSpace` 属性的 Truck 类有 50% 的概率返回 `Car` 对象作为 `BuyVehicle` 方法的结果。现在我们可以继续查看
    `Program` 类中的 `Main` 方法实现，它将这一切整合在一起 image_rsrc1CB.jpg)[](image_rsrc1CC.jpg)


    `Main` 方法的实现已准备好让应用程序中的每个组件运行。让我们开始。你首先注意到的是 `DbContextOptionsBuilder` 对象的创建，我们将使用内存数据库。该构建器的
    `Options` 属性传递给 `options` 变量，因为我们需要它来创建数据库上下文。之后是 `using` 语句，我们在其中创建上下文。接下来，我们将进入
    `using` 语句代码块，整个逻辑将发生。开始时，我们将初始化 `serviceProvider` 变量。我们将创建一个 `ServiceCollection`
    对象并添加所需的依赖映射。为两个服务类添加了单例依赖映射。`DealershipService` 映射通过 `AddSingleton` 方法添加，而单例服务通过指定为内置委托的工厂添加。在定义依赖注入映射后，对
    `ServiceCollection` 创建调用 `BuildServiceProvider()` 方法。它为依赖注入的使用做好了准备。DI 定义的映射将存储在
    `serviceProvider` 变量中，我们需要时使用该变量获取特定服务。然后我们创建一个字符串变量 `userInput` 并将其赋值为空字符串。该变量将负责用户与控制台应用程序的交互。`while`
    循环一直执行到 `userInput` 变为 "exit"。


    现在，所有工作已准备好打印控制台输出的初始状态。我们将打印用户可以在程序内部执行的选项。首先，清除控制台，然后在开头打印控制台应用程序名称——“Dealership
    Manager 2.0”。用户的选项有：1) 买车辆，2) 卖车辆，3) 显示库存。用户可以通过在控制台中输入一、二或三与应用程序通信。当用户按下键盘上的任何数字时，该值将存储在
    `userInput` 变量中（`userInput = Console.ReadLine()`）。如果用户在控制台行输入 "exit"，程序将中断并结束执行。如果用户输入数字
    1 并按回车，程序将执行第一个 `if` 语句体。


