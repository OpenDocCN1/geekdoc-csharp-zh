    call will jump into the virtual method implementation in the base class, the second
    will jump into the Football class overridden method, and the third call will execute
    the Basketball class overridden method. It will all result in the next output:![](image_rsrc1A4.jpg)Chapter
    7: SOLID PrinciplesSOLID principles represent a way of what programmers should
    follow while programming in C# programming language. The first five object-oriented
    design principles are SOLID design. When following these principles combined,
    they make everything easier while coding. They are making it easy to develop the
    application or any kind of software that is easily susceptible to changes. If
    the programmer or the team follows these principles, maintaining and extending
    the code will be far more comfortable.Following the SOLID makes developers avoid
    lousy coding practices, and this makes the system comfortable for refactoring.
    SOLID makes the software to be suitable for adaptive and agile development. If
    not coding in a SOLID design, every small request for a change in the code might
    become really stressful and painful for a developer. If the application design
    and architecture are going in the wrong direction, every change, even the smallest,
    could cause significant problems and big changes in the particular software. That
    is not what is supposed to happen. The changes and new features are part of the
    software development, they will always exist, and they are not to be blamed.The
    most common mistakes that have been made over the course of development is adding
    more responsibilities to a class that is not suited for that. It is bad to add
    more functionality that is not related to a certain class. Also, when developers
    force the classes to depend on each other, at some point, a change in one class
    will affect the other class also. So, making the classes and components tightly
    coupled is a journey to failure. The duplicate code all over the application is
    also something that should be bypassed. These are just some of the mistakes that
    are slipping through the developer''s hands. The solution to all of these potential
    problems is choosing the right architecture of the application from the start,
    following design principles throughout development, and choosing the correct design
    patterns in order to produce software based on its terms.What you should also
    know are different design patterns and what they represent. Design patterns represent
    a general solution to the most commonly repeated problem in the software development
    design. It is a template on how to solve some obstacles. So, it does not represent
    a finished code that you can implement into your software - it is just a description
    of how you should do it. The best practices that are adapted by experienced software
    developers are design patterns. Every design pattern defines the problem, the
    solution, the moment of applying the solution, and its potential outcomes. Each
    of them gives you some implementation examples and hints on how to achieve them.
    It would be good if you could read more about design patterns, and try to implement
    them on your own for better understanding. For now, let''s return to the SOLID
    principles. There are five principles included in this paradigm. Each of them
    represents a letter in the SOLID term.  S  stands for the Single Responsibility
    Principle (SRP),  O  stands for Open-Closed Principle (OCP),  L  stands for Liskov
    Substitution Principle (LSP),  I  stands for the Interface Segregation principle
    (ISP), and  D  stands for Dependency Inversion Principle (DIP).7.1 - Single Responsibility
    PrincipleSingle Responsibility Principles says, "Every software module should
    have only one reason to change." What this means is that every software module,
    structure, class, and component in the application should only have one job to
    do. Every little thing in that module should have just one purpose. This means
    that a particular software component should not contain multiple essences in it.
    It should serve only one duty. It does not mean that the software modules that
    you are building should only have one property or one method. There could be as
    many members as needed as long as they serve a single responsibility. This principle
    provides us with the best way of recognizing classes at the start of the prototype
    phase of a software product. It makes you think of all the directions some software
    modules can change. Only when there is a clear understanding of how software should
    work can the best separation of responsibilities be achieved. Let us look at the
    examples:![](image_rsrc1A5.jpg)![](image_rsrc1A6.jpg)In this small, but very clear
    software module, we have a clear design provided. There are three classes that
    provide the same responsibility. Car, Engine, and Transmission classes are the
