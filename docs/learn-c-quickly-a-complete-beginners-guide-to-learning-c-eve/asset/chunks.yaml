    3: Methods and PropertiesIn C# programming language, as well as in the other object-oriented
    programming languages, there is a term called method. A method is some block of
    the code which is executed when being called inside the program. It can also be
    defined as a group of statements, which is supposed to perform some meaningful
    logic. Methods are also known as functions, and they are used to perform certain
    actions. The biggest advantage of using the methods is code reusability. One particular
    logic can be defined in one place, and it can also be called multiple times in
    different places in the program. A method is defined with its name, followed by
    parentheses - () . The vital elements of the methods are the access specifier,
    return type of the method, method name, list of the parameters, and the body of
    the method. The access modifier  represents the visibility of a method from another
    class point of view. There are two types of methods based on the return types,
    and they are void  methods and explicit typed  methods. Void methods do not have
    a return value. They are specified to do some work which does not require returning
    result. While explicit typed methods are the methods that have the return value.
    The return types of a method can be various. For example, the return type of a
    method can be int , string , bool , etc. A method name represents the unique identifier
    of a method, and it is case sensitive in the C# programming language. That means
    that it recognizes the difference between capital and lowercase letters. For example,
    EBook() method name is not the same as the EBOOK() method name. The list of parameters
     is used to receive and pass the data to and from the method. The parameters are
    elements that are optional inside a method. The parameters can be of any type,
    and there could be multiple parameters passed. There are a few possible ways of
    passing the parameters to the method. In a value  passing method, all changes
    that are made to this parameter inside a method do not have an effect on the argument
    which was passed. This happens because the reference of the variable is not passed
    to the function. It is just a copy of that value. In a reference  passing method,
    every change which is made to the parameter has an effect on the argument variable
    passed. This happens because the reference to the memory location of an argument
    is copied into the formal parameter. The body code block  of the method contains
    a sequence of instructions needed for some logic execution. Methods can also be overloaded
    . Overloading means that multiple methods can be defined with the same name but
    with different parameters. For example, the compiler won''t report an error if
    the EBook() and EBook(int pageNumber) methods are defined. Properties  in C# programming
    languages are something like a mix of a method and variable. It is important to
