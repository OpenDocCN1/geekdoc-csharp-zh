    - GenericsThe principle of defining classes and methods with the placeholder represents
    a Generic term in C# programming language. The main concept of the generics is
    to allow every type in C# to act as a parameter to methods, classes, interfaces,
    etc. When talking about collections, there is one important limitation, and that
    is the absence of effective type checking. What this means is that any object
    can be put inside a collection. This is because all class types in C# programming
    language inherit from the base class Object. All of this can evolve to a significant
    performance impact because of the implicit and explicit type-casting, which is
    required to add or get the objects from a collection. Type-safety is the basic
    definition of the C# as a programming language, but this contradicts that claim.
    For this problem, the .NET framework and C# programming language provides generics
    to create classes, interfaces, methods, and structures programmatically. In the
    C# and .NET framework, there is an extensive set of interfaces and classes which
    are built-in. They are located in the System.Collections.Generic namespace, and
    there you can find the implementation of the generic collections. Probably one
    of the most powerful features in C# programming language is the Generics usage.
    With it, you can define the type-safe data structures. With Generics usage, it
    is possible to create classes and methods that lack the data type until the class
    or method is declared and instantiated by the client service code implementation.
    The Generics are powerful because they decrease the need for boxing, unboxing,
    type-casting the objects, etc. The only thing that is specified in the generic
    class creation is parameter types. The boxing and unboxing terms are probably
    something you should also learn when dealing with the C# programming language.
    Boxing represents the execution of conversion of the value type to the object
    type, or to the interface that is implemented by this value type. For example:string
    word = "test";object objString = word ; In this example, the string variable word
    is boxed and assigned to the object variable objString. The unboxing is the process
    of extraction of the value type from the object itself. For example:objString
    = "newTest";word = (string)objString ;In this example, the object objString is
    then unboxed and assigned to a string variable word.The example of the Generic
    class usage is given below:![](image_rsrc1BB.jpg)In this example, you can see
    the Generic class named GenericClass with its T type parameter. T represents a
    type that will be replaced with the concrete object type when this class will
    be instantiated. In this class, we have created one simple Generic usage over
    the encapsulation with the public property and one private field, which is controlled
