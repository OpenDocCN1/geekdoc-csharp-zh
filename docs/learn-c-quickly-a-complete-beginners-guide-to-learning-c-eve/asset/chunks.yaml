    of the `BedSpace` read-only property.


    ### Data Layer (VehicleContext)

    The next thing to be explained is the `DataLayer`, which, in this case, represents
    the `VehicleContext` class. Let''s take a look at the code:![](image_rsrc1C4.jpg)!(image_rsrc1C5.jpg)


    This is a data layer class. The `VehicleContext` class is extending the `DbContext`
