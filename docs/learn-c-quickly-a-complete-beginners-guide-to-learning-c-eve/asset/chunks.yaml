    # Chapter 6: Object-Oriented Programming\n\nObject-Oriented Programming (OOP)\
    \ is the most popular programming paradigm in the world. This paradigm is the\
    \ successor of procedural programming. Procedural programming represents writing\
    \ functions and procedures that manipulate some data. On the other hand, object-oriented\
    \ programming is all about creating objects that have their methods and data all\
    \ in one. There are many advantages that object-oriented programming has over\
    \ the procedural paradigm. The object-oriented programming keeps the code much\
    \ easier to handle and maintain, and it is easier to debug and modify. OOP helps\
    \ to reduce the amount of time of development, and it also helps you in building\
    \ reusable code and components. In addition, it is much faster and easier to execute.\
    \ It is easier to stick to the DRY principle, which tells that the repetition\
    \ of code must be on the minimum. The DRY principle stands for the Don't Repeat\
    \ Yourself. The code parts common to some applications should be extracted and\
    \ placed in one component from which it becomes reusable and not repetitive. OOP,\
    \ as its name says, is based on object using and managing. Those objects contain\
    \ data in different forms. In the C# programming language, those forms are fields,\
    \ properties. It also contains the data manipulation part, which is known as procedures\
    \ - in C# well-known methods. The objects represent instances of some `class`,\
    \ which determine their type. This means that the C# programming language is class-based.\
    \ OOP paradigm allows you to break a problem into smaller pieces - it decomposes\
    \ it into smaller units, which makes everything easier to handle. Those units\
    \ are the objects mentioned above. There are four characteristics of the main\
    \ aspects of object-oriented programming: `abstraction`, `encapsulation`, `inheritance`,\
    \ and `polymorphism`. These four features are the laws of the object-oriented\
    \ programming paradigm.\n\n## 6.1 - Encapsulation\n\nEncapsulation represents\
    \ the packing of data into some logical components. It is a mechanism of wrapping\
    \ the data and binding it into a single unit. Encapsulation is a way of securing\
    \ the data stored in the classes, preventing access for the components that should\
    \ not use that particular data. There is a relation between abstraction and encapsulation.\
    \ The purpose of the abstraction is to make certain information visible, and the\
    \ purpose of the encapsulation is to select the program features that will have\
    \ a certain level of abstraction. The encapsulation usage prevents and protect\
    \ the data from corrupted usage, errors, and mistakes. In object-oriented programming,\
    \ the data and its manipulation is almost everything - it is a critical element\
    \ of a program. If we want to protect certain data, we have to use `private` access\
    \ modifier rather than the `public` modifier. If the `private` access modifier\
    \ is used, the private data is then manipulated indirectly through the properties.\
    \ This means that the data in a class is hidden from other classes - the well-known\
    \ data-hiding. As mentioned earlier, this can be achieved by using the `private`\
    \ fields and `public` properties that control the private fields and their values.\
    \ There are many advantages of using encapsulation, and the reusability of the\
    \ code is one of them; it makes it easy to change when new requirements come by.\
    \ It is also very good for testing the code, like in the case of unit testing.\
    \ A simple example of encapsulation is seen below:![](image_rsrc199.jpg)\n\nIn\
    \ this simple example, we are showing the usage of the encapsulation feature of\
    \ object-oriented programming. In the `Person` class, there are two `private`\
    \ fields - these are fields that we do not want to expose to everyone throughout\
    \ the program. These field's values are encapsulated, and available only in their\
    \ own class. However, we managed to manipulate them indirectly by creating the\
    \ properties whose task is to control these private field's values. The properties\
    \ created are the `Name` and the `Age` property. Both properties have the `get`\
    \ and `set` accessors. In the `get` accessors, both properties return the corresponding\
    \ private field value. Similarly, in the `set` accessor, both properties assign\
    \ the passed value to the private field. This way, we managed to implement encapsulation.\
    \ In the `Main` method of a `Program` class, we will test if everything works\
    \ fine. First, we instantiate the object of a `Person` class. After it, we set\
    \ the values for the name and age of that particular object, again using the encapsulation,\
    \ because the `set` accessors are called during this operation. Finally, we print\
    \ the data to the standard output, both `Name` and `Age` of the person, using\
    \ the `get` accessor in both cases. The output of the program will look like this:![](image_rsrc19A.jpg)\n\
    \nIn order to understand this better, an additional example with a bit more complexity\
    \ is shown below:![](image_rsrc19B.jpg)\n\nAt the beginning of this example, we\
    \ exposed the two classes at the lowest level. The first class is the `Engine`\
    \ class. In this class, the first thing that you will notice is the private field\
    \ of the integer data type - `_numberOfCinders`. It is impossible to assign a\
    \ value to this variable outside of `Engine` class because it is `private`. The\
    \ next thing is `Engine` constructor. The engine constructor takes one parameter\
    \ - `numberOfCinders`, and that parameter is of the integer data type. Inside\
    \ the body of the constructor, there is a check to see if the number of cylinders\
    \ is different from four, six, or eight. If this condition is true, the program\
    \ will throw an `Exception` message that the number of cylinders must be four,\
    \ six, or eight. The Exceptions in C# are used for handling the errors. So, for\
    \ example, if something is detected to be incorrect, then the `Exception` should\
    \ be caught somewhere in the program and inform the user about the error. That\
    \ was a little about exceptions and handling. Let us jump back to the example.\
    \ If the number of cylinders is fine and the code does not enter if block, then\
    \ the private field value is assigned to the parameter. Below the constructor,\
    \ there is a method `EngineType()`, which is of the string data type. In this\
    \ method, there are `if` statements checking whether `_numberOfCinders` is four,\
    \ six, or eight. If `_numberOfCinders` is equal to four then the `\"Inline 4\"\
    ` string will be returned; if is equal to six then the `\"V6\"` string will be\
    \ returned; if is equal to eight then the `\"V8\"` string will be returned. If\
    \ none of these conditions are fulfilled, the program will again throw an `Exception`.\
    \ This Exception will contain a message \"invalid number of cylinders\". The second\
    \ class is `Transmission` class, and it has one public property of `bool` data\
    \ type known as `IsAutomatic`. This property only has a `get` accessor, which\
    \ means that the value of this property can only be read. The writing into this\
    \ property (value assignment) is not allowed. What is the purpose of this property\
    \ if we can not assign a value to it? Inheritance to read-only members can only\
    \ happen as part of the declaration or the same class constructor. In this case,\
    \ as in `Transmission` class, the value for `IsAutomatic` is being assigned in\
    \ class constructor. The `Transmission` class has a constructor with a `bool`\
    \ parameter passed to it. That value is assigned to `IsAutomatic` property.\n\n\
    Let's move on to the next level class. The code is seen below![](image_rsrc19C.jpg)\n\
    \nIn this class, named `Car`, we have two public properties. Each of these two\
    \ properties has only the `get` accessor. This is what makes them read-only properties.\
    \ As in `Transmission` class, the value of these properties can not be directly\
    \ assigned except in the constructor or on the declaration level. In this case,\
    \ as in `Transmission` class, the value is assigned in the constructor. The constructor\
    \ of the `Car` class takes two parameters, one of `Engine` data type and one of\
    \ `Transmission` data type. The two objects passed are assigned to the read-only\
    \ properties of `Car` class. Readonly properties of `Transmission` and `Car` class\
    \ are encapsulated, nothing can change their value. These values are safe, and\
    \ there are no worries about someone changing the data inside. Let's sum all these\
    \ logic into one unit:![](image_rsrc19D.jpg)\n\nHere is the class `Program` with\
    \ its well-known `Main` method. Here, we will manipulate the objects of the previously\
    \ explained classes and make their characteristics and behavior come to life.\
    \ The first thing is creating an instance of the `Engine` class with six cylinders.\
    \ After that, we instantiate an object of a `Transmission` class. This object's\
    \ property `IsAutomatic` is set to `false` during the constructor execution. After\
    \ we created an instance of the `Engine` class and one instance of the `Transmission`\
    \ class, we have everything ready to instantiate a `Car` object. A `Car` class\
    \ requires an `Engine` object and the `Transmission` object in order to be created.\
    \ Now, we create an object of `Car` class with previously instantiated `Engine`\
    \ and `Transmission` objects as parameters. The program prints the engine type\
    \ of a car object. We are able to access this information the next way: first,\
    \ we access the `Engine` property of a car object. After this information is reached,\
    \ we can then access the `EngineType()` method over the `Engine` property of `Car`\
    \ class. This method returns the `\"V6\"` string because that engine is created\
    \ with six cylinders and is assigned to the car object. Similarly, this is what\
    \ we do when reaching the information about the automatic transmission of the\
    \ car object. First, we access the `Transmission` property of a car object, and\
    \ after this is done, we can then access the `IsAutomatic` property of a `Transmission`\
    \ object inside a car object. All of the pieces of information are printed into\
    \ the console output. The console print looks like this:![](image_rsrc19E.jpg)\n\
    \n## 6.2 - Inheritance\n\nAnother essential feature of object-oriented programming\
    \ is `inheritance`. This characteristic is one smart mechanism that allows one\
    \ class to inherit part of other class components. What this means is that if\
    \ class `A` inherits from class `B`, the object of class `A` will be able to access\
    \ the members of class `B`; its fields, properties, methods, etc. In the inheritance\
    \ principle, we recognize `Parent` class (the `Superclass`) and the `Child` class\
    \ (the `Subclass`). The `Superclass` represents the base class, and its features\
    \ are to be inherited in a subclass. The class that inherits part of another class\
    \ is called the `Subclass`. Beyond the fact that this class can access the base\
    \ class members, it can as well implement its own members and features. The `Subclass`\
    \ sees all of its features, including that of the parent class features. The `Superclass`\
    \ sees only its own features, characteristics, members, etc.\n\nThe concept of\
    \ reusability is completely supported in the inheritance paradigm. The reusability\
    \ could be mirrored in the example that we need to create some class with some\
    \ features that already exist in other classes. In this case, we can reuse the\
    \ existing feature and just extend that particular class. To inherit from a class,\
    \ the symbol `:` is used. For example:\n\n```\nclass B : A\n```\n\nIn this example,\
    \ class `B` is a subclass, and class `A` is the base class. If for some reason\
    \ you want to restrict some classes from inheritance, the `sealed` keyword is\
    \ used. For example:\n\n```csharp\nsealed class Person\nclass Student : Person\n\
    ```\n\nThis will provide you with a compilation error saying the `Student` class\
    \ cannot be derived from `sealed` `Person`. There is an edge case when the `Subclass`\
    \ does not inherit from the base class, and the `Subclass` cannot inherit from\
    \ the private members of its parent class. Nevertheless, encapsulation could be\
    \ used because the parent class has `public` properties with getters and setters\
    \ that control private field. One important fact is that a parent class can have\
    \ any number of child classes, but a child class can only have one parent class.\
    \ This is because multiple inheritance is not supported in the C# programming\
    \ language. However, it can be simulated with the interface usage. In the inheritance\
    \ principle, there is only one member of a class that could not be inherited,\
    \ which is the constructor. The constructor cannot be inherited, but the child\
    \ class can always invoke the base class constructor. Please check the example\
