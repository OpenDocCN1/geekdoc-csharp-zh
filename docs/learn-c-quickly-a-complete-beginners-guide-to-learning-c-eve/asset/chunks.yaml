    - Dependency InjectionDependency Injection (DI) represents a design pattern which
    is probably one of the most frequently used design patterns in C# programming.
    The dependency injection design pattern is used for the implementation of the
    Inversion of Control (IoC). What dependency injections do is that it allows the
    creation of the dependent entities outside of a class. It makes us provide those
    objects to the concrete component in different ways. The binding and creation
    of the objects that are marked as a dependent are moved outside of the class that
    is depending on those objects. In order to achieve this, dependency injections
    implementation is needed. The dependency injection allows us to implement loosely
    coupling between software modules. In fact, it helps us to prevent the tight coupling
    between software modules, which could make the development more complex even for
    the small changes and features.When there is a correct implementation of the dependency
    injection in the application or software, then we can easily implement future
    changes and requests from the clients. Our application will be much maintainable
    and flexible for changes. Before we continue, we should first recall what tight
    coupling and loose coupling are. When a lot of classes or components depend on
    each other, that means that they are tightly coupled. In other words, if two software
    modules depend on each other, and we need to change the dependent object, then
    there will also be a need to change the module where the dependent object is used.
    And of course, we do not want that to happen. In big applications that are on
    the enterprise level, this kind of mistake is unacceptable because it could lead
    to major modifications throughout the software modules. In small applications,
    this problem would probably not be too hard to solve, but on the enterprise level,
    the complexity could be enormous.Unlike tight coupling, there is a loose coupling.
    Loose coupling is when software modules or components do not depend on each other.
    In other words, if there is a change inside one module, we are not forced to change
    the logic inside the other module. That is what every software architect is trying
    to achieve when designing the application. When you have loosely coupled software,
    it is easy to make changes and manage the new features. In the dependency injection
    design pattern, there are three types of classes included in the implementation.The
    first class type used is the Client class. The client class represents a dependent
    class, and it depends on the Service class. The service class is the second type
    of class needed inside dependency injection implementation. The Service class
    represents a dependency, and it provides the dependency service to the Client
    class. The last class needed in DI is the Injection class. The job of the Injection
    class is to inject the Service class object into the Client class. There are three
    possible ways of injection. The first dependency injection type is through the
    class constructor, and it is called the Constructor Injection . The main thing
    about the Constructor Injection is that it does not contain any default states.
    Only the specified values are required to instantiate the object. The Constructor
    Injection uses the parameters from the constructor to inject the dependency into
    some field or property in a class, and it is possible to use the injected object
    anywhere within the class. The Constructor Injection is the most popular and the
    one you''ll probably see most of the time. There are many advantages of using
    the Constructor Injection, and the most significant one is the unit-testing support.
    It is the best solution when doing unit and integration testing of software modules. The
    second type of dependency injection is Property Injection . This type of injection
    is also called Setter Injection because it is done through the set accessor of
    the property. It helps us create injected objects as late as possible. There is
    only one minor problem in this type of injection, which is the difficulty of identifying
    the dependencies that are needed. The null checker is required before using the
    Property Injection. The advantage is that it does not depend on adding or changing
    the constructors in the class. The last type of injection is Method Injection
    . It is an injection that is not used so frequently. It is only needed for some
    edge cases. How does it work? The injection happens in the class method itself.
    The dependency is to be utilized by that particular method. This is useful in
    a case when a whole class requires only one method and not the whole dependency. For
    each of these injection types, we will provide an example. Let us start with an
    example showing the most popular and the most used type - the Constructor Injection:![](image_rsrc1BH.jpg)In
    this example, we will demonstrate the Constructor Injection type of Dependency
    Injection design pattern. We have one interface called IService. This interface
    component contains one method signature - PrintMessage(). This method will be
    implemented inside Service classes. The first Service class is the ConfirmationMessageService,
    which is implementing the IService interface and contains its implementation of
    the interface component method PrintMessage(). In the state of the ConfirmationMessageService
    class, this method will print out to the standard output "Confirm injection" message.
    The next Service class is the DeclineMessageService class, which also implements
    the IService interface. Inside this class, there is a different implementation
    of the PrintMessage() method from the interface. In this implementation, we have
    the printing of the "Decline injection" message to the console output. The next
    thing to do is to create a Client class. The Client class, in this example, is
    the MessageManager class. This class contains one private field _service, which
    represents the IService type object. This object is supposed to be injected over
    the constructor when creating an object of the MessageManager class. The constructor
    of this class takes one parameter, and that parameter is the IService type object,
    which will be injected into the private field _service. What we also have in this
    class is the Print() method. The Print() method calls the PrintMessage() method
    execution over the injected IService object.So, there are two possible implementations
    where this call could jump to. It could jump to the ConfirmationMessageService
    class implementation of the PrintMessage() or to the DeclineMessageService class
    implementation of the PrintMessage() method. The Constructor Injection is demonstrated
    in the Main method of the Program class. Here, we created an object of the ConfirmationMessageService
    class. This object is then passed to the constructor when creating the MessageManager
    object. At that particular moment, the dependency injection is happening. The
    msgManager object has the msgService object injected into the _service field of
    its own class. Now, when calling the Print() method over the msgManager variable,
    the PrintMessage() method of a ConfirmationMessageService class will be executed.
    This will result in a "Confirm injection" message printed to the standard output.After
    this, we create an object of the DeclineMessageService class to inject that object
    into the MessageManager object and demonstrate the dependency injection with the
    different class type. The msgManager variable reference is changed to the newly
    instantiated object, which is now with the DeclineMessageService object injection.
    This time the _service field will be injected with the different class type object
    (DeclineMessageService object). So, now, when the Print() method is called over
    the msgManager variable, the PrintMessage() implementation of the DeclineMessageService
    class will be executed. This will result in the printing of the "Decline injection"
    message to the standard output. Now, let''s run the program and check the results.![](image_rsrc1BJ.jpg)The
    results are as expected. The constructor injection is achieved with two different
    class type objects.Now, let us demonstrate the Property Injection (or Setter Injection)
    type of Dependency Injection.![](image_rsrc1BK.jpg)In this example, we have modified
    the previous solution in order to achieve the Property Injection type of Dependency
    Injection. The interface component stayed the same, as well as the Service classes.
    Their functionality and usage should stay the same as in the previous example.
    Objects of those classes should just be injected into the Property of a Client
    class this time, instead of the injection into the constructor. In the Client
    class, there is still private field _service that is of the IService object type.
    The new thing is that there is no more custom constructor where we injected the
    value in the previous example of a Constructor Injection type. Instead of the
    constructor, we have one public property, which is in control of the private field
    _service. This property has a setter accessor, and there the property injection
    will happen. The value passed to the property assignment will be set as a private
    field value of the _service variable. After that is done, the Print() method could
    be called over the previously instantiated MessageManager object. Notice that,
    if you do not inject the value to the public property of a MessageManager object,
    you won''t be able to call the Print() method. In fact, you will be able to call
    that method, but you will get an exception because the Print() method is calling
    the PrintMessage() method over the _service object. Furthermore, if you did not
    inject anything into the Service property, you would not have any object assigned
    to the _service variable, and the program would not call the PrintMessage() over
    the variable which does not have object state assigned to it.In the Main method,
    there is a simple demonstration of this design. In the beginning, there are two
    objects created, one of ConfirmationMessageService class type, and other of the
    MessageManager class type. Notice that the generic constructor is now called for
    the MessageManager object creation. Then, there is the Property Injection, where
    we assign the ConfirmationMessageService object into the Service property of the
    MessageManager object. This line puts the value into the private field _service
    of the msgManager variable.At this moment, everything is ready for calling the
    Print() method over the msgManager without any concerns. That is exactly what
    is done next, and the output will be the message from the PrintMessage() method
    of a ConfirmationMessageService class. In the end, we are going to inject another
    object to demonstrate the second way this program could go. We created a DeclineMessageService
    object and injected it through the Service property of the msgManager variable.
    At this moment, we changed the _service field value to have a different object
    assigned to itself. Now, when executing the Print() method, the program will jump
    to the PrintMessage() method of the DeclineMessageService class, and it will print
    the "Decline injection" message to the console output. The program output will
    stay the same as in the previous example, you can check it above.The last type
    of dependency injection is the Method Injection, and an example of it is provided
    below:![](image_rsrc1BM.jpg)In this example, the interface component and Service
    classes stayed the same as in the previous two examples. Service classes still
    implement the IService interface. The PrintMessage() method of ConfirmationMessageService
    prints the "Confirm injection" message, and the DeclineMessageService prints the
    "Decline injection" message. Again, the Client class retook its changes, and there
    were no more private field in which the Service object was stored. There is also
    no custom constructor, and there are no properties that could implement the dependency
    injection. Now, there is only one method that will be responsible for the injection.
    The Print() method takes one parameter, and it is an IService type object. With
    that object passed to the method, we are calling the PrintMessage() method. This
    is called Method Injection principle. The method will take an object of some interface
    type and will call that object''s particular method. This is not commonly used,
    but it is useful when the whole class itself does not require dependency, but
    only the method holding that dependency. The dependency is injected only for the
    use of a particular method. Everything is put together in the Main method of a
    Program class once again. There is an instantiation of the ConfirmationMessageService
    object and the MessageManager object in the beginning. Then, we run the Print()
    method directly over the msgManager object injecting the Service object, which
    was previously created (the msgService variable). This way, the PrintMessage()
    of a ConfirmationMessageService class will be called. It will print our well-known
    message, "Confirm injection". As in the previous examples, we will inject the
    other class object as well. The DeclineMessageService object is created afterward.
    This object is passed as a parameter to another call of the Print() method over
    the msgManager variable object. It is clear that the execution will jump to the
    DeclineMessageService class implementation of the PrintMessage() method. This
    will result in printing the "Decline injection" message to the standard output.
    The console output of this program will look completely the same as in the previous
    two examples.Now that you’ve learned how to implement the dependency injection
    design pattern, we can successfully move forward to introducing the IoC container,
    which is also known as dependency injection container. Inversion of Control container
    represents a framework that is used for the implementation of the automatic dependency
    injection. Many frameworks can provide this functionality for your software. They
    are responsible for object instantiation and its period of existence. It is also
    taking care of injecting the dependencies to a certain class. The IoC container
    will create an object of the specified class, and it will also inject all of the
    dependency objects. The injection could possibly happen through a constructor,
    a property, or a method as we learned until now. This is all happening in the
    run-time, and the framework is responsible for disposing of the dependencies as
    well. The advantage of using this container is that we do not have to worry about
    building and managing the objects manually. There is a specific lifecycle of the
    dependency injection container. Each container must provide support for the next
    three lifecycle ongoings:1) Registration  - one of the key things is that the
    container must provide the knowledge about the dependencies that need to be instantiated
    when the code runs to a certain type. What this means is that the container must
    find a way to register the mapping of types. This is called registration of the
    dependencies.2) Resolving  - It is already specified that with the IoC, we do
    not need to instantiate objects manually, and that should be the job of the container.
    This process in the framework is called resolving. There should be functions that
    are resolving the provided types. The process is next: the container instantiates
    the object of a provided type, then it injects the needed dependencies and returns
    the object as a result. 3) Disposing  - Every IoC framework has its own lifetime
    manager logic, which is taking care of the object''s lifecycle and its disposal.
    This is what every container must provide at the end of the dependency injection
    usage through the development. The most popular IoC container frameworks that
    are used in C# programming language are Autofac, Unity, StructureMap, etc. In
    the C# programming language, there is something like the default dependency injection
    library. It is stored in the Microsoft.Extensions.DependencyInjection namespace.
    If you do not need some complex and fancy things with dependency injection, then
    this build-in library should be more than great for you. One example is provided
    below:![](image_rsrc1BN.jpg)In this example, we are using the Microsoft Dependency
    Injection library. There are two defined interface components. One is the ICarManufacturer,
    and the other is the ITruckManufacturer interface. The ICarManufacturer interface
    contains one method signature, and that method is CreateCar(). Similarly, the
    ITruckManufacturer interface contains one method signature, which is the CreateTruck()
    method. Then, there is a CarManufacturer class that implements the ICarManufacturer
    interface. It contains the implementation of the CreateCar() method from the interface.
    This method prints to the console "Car created" message. We also have a TruckManufacturer
    class exposed. This class implements the ITruckManufacturer interface, which means
    that it contains the implementation of the CreateTruck() method. This method prints
    the "Truck created" message to the standard output. The dependency injection happens
    in the Main method of the Program class. Here, we are creating a ServiceCollection
    object that is used for storing the service objects.The AddSingleton  method adds
    the CarManufacturer class object for the ICarManufacturer type into the serviceProvider
    variable. This method adds the element to the serviceProvider collection in a
    Singleton design pattern way. The Singleton design pattern is something you must
    also be familiar with, so we will further explain it here. The Singleton design
    pattern represents the usage of only one object of some type through the application
    workflow. On the first call to the singleton object, the instantiation is happening.
    But every time we call the singleton object, we are only going to get the object
    that was created after the first call. This means that singleton objects represent
    the same reference while working with them. The best example of a singleton object
    could be described with the C# property usage. An example is seen below:private
    List<int> intList;public List<int> IntList{get{if(intList != null){return intList;}return
    new List<int>();}}As you can see, whenever the IntList property is called in the
    program, it will always return the same object. The object is created only once,
    and then it is reused. Now, when the singleton principle is clear, we can continue
    with the DI example. AddSingleton method adds the object to the collection in
    a way that whenever that object is used and pulled out from the collection, it
    will be the same object, and it will not be created multiple times. When creating
    the mapping for the ICarManufacturer type, the CarManufacturer object is used.
    For the ITruckManufacturer type, the TruckManufacturer object is used. After the
    Singleton addings, the BuildServiceProvider() method is called, which is creating
    the ServiceProvider containing services from the provided collection. This represents
    the Registration part of the dependency injection. We have registered the mappings
    of the types and related objects and put them inside a serviceProvider collection.The
    next thing is the Resolving process. Firstly, we put the CarManufacturer object
    in the carManufacturer variable. This object is taken from the serviceProvider
    collection with the GetService method. In the GetService method, we provide the
    type of object we want to get from the collection. As we provided the ICarManufacturer,
    we have got the CarManufacturer class object returned and stored inside the carManufacturer
    variable. Now we can execute the CreateCar() method over the returned object.
    It will result in printing the "Car Created" message to the console. Then, we
    also want to take the TruckManufacturer object from the serviceProvider collection
    and execute some code with it. We are again using the GetService method providing
    the ITruckManufacturer type. This will return the TruckManufacturer object from
    the collection, and we will be able to execute the CreateTruck() method over that
    object. It will result in printing the "Truck Created" message to the standard
    output. The output of this program will look like this:![](image_rsrc1BP.jpg)8.6
    - Object Relational MappersThe object-relational mapping represents the technique
    that makes querying the database easier. It allows developers to manipulate the
    data from the database in an object-oriented approach. The database that is linked
    with the object-relational mapping technique, must be a relational database. The
    data manipulation from the database without using the ORM can become very unpleasant
    and complicated because sometimes you must write long and complex SQL queries.
    Sometimes the developers are not so skilled in working with SQL syntax, and the
    development process will take more time than needed when it comes to some SQL
    problems. ORM is created to enable developers to integrate with the database by
    only using the programming language in which they are writing the server-side
    logic. This provided developers to keep their work with the SQL on the minimum
    and to fasten up the development process.ORM is simplifying the contact with the
    database using the objects that are mapped to certain tables from the database.
    The ORM has one core feature inside its implementation. It is the Data Layer software
    module. This module represents a library that is responsible for the communication
    between some object-oriented language and the database. It works as a translator
    and can handle the data flow that is going on in the middle.Object-relational
    mapping is smart enough to provide all CRUD operations from the code. The CRUD
    operations are well-known database-level operations. The C stands for the CREATE;
    the R stands for the READ; the U stands for the UPDATE, and the D stands for the
    DELETE. Create inserts the objects as records into some tables. Read selects the
    data from some tables. The update will update some of the records from a table.
    Delete erases the record or records from a table. The ORM is perfect for some
    cases, and not for others. There are pros and cons whatsoever.One of the advantages
    is that the developer has a data model in one place, which makes everything easier
    to maintain and to stick to the DRY principle (Don''t Repeat Yourself). It is
    also good that you do not have to write poor SQL code, which many of the developers
    do because they do not have appropriate knowledge of it, thereby placing it as
    a sub-language - which SQL is not, it is a powerful programming language. It''s
    good that ORM uses already-prepared statements for a lot of things; they''re easy
    to call, like whatever method is being called. ORM abstracts the database layer
    and makes it easily applicable for modifications. It also provides you with the
    use of object-oriented programming, such as data inheritance. However, there are
    also disadvantages to using ORM. For example, it is not so good with the performance
    factor. For large application systems, everything could be slowed down because
    there are many relations that are not needed in many cases. In that case, the
    SQL master queries are a much safer solution.Several ORM frameworks are well-supported
    by the C# programming language. The best fit now is probably the Entity Framework
    ORM . Let us introduce you more with this popular ORM.Entity FrameworkEntity Framework
    is the ORM that was released by Microsoft company to create the best ORM for C#/.NET
    applications. The main purpose of the Entity Framework is to make the interaction
    between the C# applications and the relational databases. Entity Framework represents
    a simplifier tool for mapping objects in the code to tables and columns in a particular
    database. It is important to know that Entity Framework is an open-source tool
    that is a part of the .NET Framework. So, it can be used free of charge. Entity
    Framework is responsible for executing the database commands and taking the query
    results that happen automatically. This ORM can materialize the query results
    into the class objects in the C# programming language. The Entity Framework is
    capable of generating the commands needed to interact with the database in order
    to read or write data and execute it for you. It has the mechanism to materialize
    query results into object instances inside your application. You can then access
    the properties of the objects to get some column values, or you can use LINQ to
    select further related object or objects. In the Entity Framework, it is possible
    to map multiple entities to a single table or, map a single entity to multiple
    database tables. This is the custom mapping functionality that is provided in
    the Entity Framework.The Microsoft company recommends this framework for all new
    software development processes in C#. The Entity Framework represents a model
    of objects inside the application; it is different from the database model used
    to persist the application data. The approach is just totally different. The model
    can be aligned with the database schema, but it also can be pretty much different,
    which provides flexibility. There are two possible approaches to the use of the
    Entity Framework. The first approach is known as the Code-First Approach. In this
    approach, you must create classes inside the code that will represent the tables
    in the database. When classes and their properties are created, you can execute
    the command to update the database schema. At that moment, the database will be
    changed to create or update the tables that are mapped to the classes inside the
    code. The other approach is the Database-First  approach. In this approach, the
    opposite thing is done. First, we must create or update the database schema through
    SQL, or any tool capable of doing it. After the database schema is changed, we
    can execute the command to create or update the class models inside the application
    code, which will be mapped to the tables from the database. Whatever fits better
    to your requirements and application design can be chosen. We are heading now
    to an example of Entity Framework ORM usage:![](image_rsrc1BR.jpg)In this example,
    we will demonstrate a program that is using the Entity Framework object-relational
    mapper. Here, you can see a class model named Car. The Car class has few properties,
    and each of them will represent one column in the Car table, which will be created
    in the in-memory simulated database for this example. The properties that will
    be mapped to columns are Id, Make, Model, Year, and IsTurboCharged. In order to
    create a database, we will need some database context. In the second class, we
    are creating a component that will be responsible for the database context. A
    CarContext class will inherit from the DbContext class, which is the Entity Framework
    built-in class. In the constructor of the CarContext, we are passing the DbContextOptions
    object of the CarContext type. This object is forwarded to the base constructor,
    which means that it forwarded to the generic DbContext class constructor. We must
    also declare a DbSet of Car objects. In this DbSet variable, all entities (records
    from the database) of Car objects will be stored. Those objects will represent
    the records from the database in the Car table. There is also one method that
    should be overridden, and that is the OnConfiguring method from the DbContext
    class. This method does not have an implementation in its core class. In order
    to configure the database, we must override this method and implement it. This
    method is called for every instance of the database context creation. We will
    just check here if it is the options builder configured for the database. If it
    is not, we will throw an exception. Now, we are ready to create the database and
    to execute some database-level commands.![](image_rsrc1BS.jpg)In the Main method
    of the Program class, the first thing that will be done is the creation of the
    in-memory database, whose name will be CarsDatabase. The creation of the database
    is done, and the Options property is taken from the DbContextOptionsBuilder and
    stored into the options  variable. Now we are ready to play with the database
    through the Entity Framework commands. In the using  statement, we will manipulate
    the data and do some insertions and retrieval. To understand the using statement,
    you must first learn what the try-catch  block is. During programming, many errors
    can occur in the program but when that happens, C# as a programming language will
    throw an exception, and the program will stop the execution. That is not so great
    for the user experience, so when the error happens, we must find a way to process
    that correctly and let the program continue the execution without stopping. This
    is realized in the try-catch block.In the try block, we should insert the code
    that has the possibility to throw an exception. If the exception is thrown, then
    the program will jump into the catch block, allowing us to take control of the
    exception, and possibly print the error message to the user, and continue the
    execution without stopping. In the try-catch block, there is also one more block
    that could be implemented. It is the finally  block.The finally block comes under
    the catch block, and it represents the code that will be executed regardless of
    whether the exception happened or not. So, we are implementing the finally block
    when we want to do something right after the main execution in the try block,
    or after the error is thrown. The using  statement represents the shorter version
    of the try-catch block. In the using statement, there is a built-in try-catch
    block, and if the exception happens, it will be processed automatically in the
    using statement. The using statement will call the Dispose() method after the
    code block execution even if the code throws an exception. So, here we are initializing
    the CarContext, passing the options object to the instantiation of the context 
    object. After that, we then access the virtual Car table from the database by
    using the context.Cars  database set. As mentioned earlier, this database set
    represents the Car table with its records (objects). So, we are using the Add
    method to add four different objects into the set. These objects will represent
    records in the table. It is important to know that the objects are not saved in
    the database when using the Add method. They are just locally added. Every change
    done over the context is done just locally until the SaveChanges() method is called
    on the database context object. After the objects are added to the database set,
    we then performed the SaveChanges() method, and at that moment, all new objects
    that have been added to the database set are inserted into the database.Now, we
    are able to retrieve some data from the database. We will do that again with the
    Entity Framework, accessing the database context and Cars database set. There
    is a need to retrieve the Car object that has a Model name equal to "Viper", and
    this can be done with the help of LINQ. We will access the database set, and then
    we will be able to perform filtering with the LINQ query. We will then use the
    FirstOrDefault() LINQ method to retrieve the required information. The FirstOrDefault()
    method finds the first occurrence of the object if there is a match and returns
    its value. If there is no match for the specified filter, this method will return
    the default value of the type searched. For example, in this case, if there is
    no car object with the "Viper" value of the Model column, the null value will
    be returned. But we are yet happy to have that object, and this method will get
    the desired information successfully. The object is stored in the car  variable,
    and then, accessing its properties, we will print the Year, Make, and Model of
    the selected car to the console output. The result of this program will look like
    this:![](image_rsrc1BT.jpg)8.7 - MappersIn this chapter, you will learn what mappers
    are, why we use them, and how to implement them. While working as a software developer,
    you are constantly in need of manipulating with some objects. Since the objects
    are something that is used all the time in the object-oriented programming principle,
    the developers always struggle with some object changes, modifications, instantiations,
    etc. In some cases, which are very frequent nowadays, there is a need for data
    mapping between two objects. When some values are required to transfer from one
    object to another, it is called object-mapping.The most common situation where
    we need object mapping is when working in Web API projects. The web applications
    today are mostly Web API applications with one client-side application, which
    represents some frontend framework (for example, Angular or React) and is connected
    with a particular backend application. The communication between frontend and
    backend happens most of the time. In that communication, many objects are transferred
    from frontend to backend and vice versa. The typical example would be when there
    is a form on the frontend from which field values must be packed to a certain
    object and transferred to the backend. This transferred object is required to
    be saved as a record inside the particular table in the database. If, for example,
    the backend application is using an ORM like the Entity Framework, then the object
    that came from the frontend must be mapped to the model object.As we learned in
    the ORM chapter, the model object represents the record from a particular table.
    In this case, the transferred object should be mapped to the model object, and
    then, the model object should be saved over the database context. The other frequent
    example would be the data transferred in the opposite direction. Imagine there
    is a page inside the frontend application that is representing the information
    about some business model objects. When you land on that page, the client-side
    application then sends a request to get the information about the wanted object.
    On the backend side, you have to retrieve the object from the database table and
    have it stored in the model object of the Entity Framework ORM. Then, that model
    object must be mapped to the frontend class type object and transferred through
    the protocol back in the client-side application, where the pieces of information
    will be shown to the user. These are the most common data mapping actions that
    are being resolved in web applications nowadays.Object mappings could be done
    manually, mappers could be custom-created, but it would take time. Due to this,
    many applications use already built mapper libraries that can support various
    mappings between objects. In the C# programming language, the best-suited mapper
    library is probably the AutoMapper. It is a free library that can be used in any
    C# application. The AutoMapper is the one who saves you lots of time and effort
    that you would have lost while trying to map properties manually every time you
    need object mapping.Come on now, let''s check out one AutoMapper usage example:![](image_rsrc1BU.jpg)In
    the beginning, there are two classes exposed. As you can assume, the objects of
    those two classes will be the ones that will be mapped. The first class is called
    EuropeanCar, and the second class is called AmericanCar. The AutoMapper works
    in the next way: it scans the property names for both classes that are supposed
    to be mapped. For the property names that are matched in both classes, it will
    do the automatic value transfer from one object property to another. So, in conclusion,
    when you are using the AutoMapper, the classes of the objects that you want to
    map must have the same property names. If they do not have the same names, the
    mapping will be executed only on the properties that are matched by name. The
    properties that are not matched by name will have their default type values in
    the mapped object. Now, let''s see how we will put this together.![](image_rsrc1BV.jpg)Here,
    we will demonstrate the mappings of the objects from the previously explained
    classes. The first thing that must be done is the creation of the MappingConfiguration
    object from the AutoMapper library. When creating this configuration, we must
    provide the mappings and all the details needed for the mappings. In this case,
    we are creating only one map definition, and that is the mapping of the EuropeanCar
    class object to the AmericanCar class object. The CreateMap method is creating
    the definition for assigning property values from the EuropeanCar object to the
    AmericanCar object. Everything after the CreateMap method call represents certain
    definitions for the custom and additional logic of mapping properties. In this
    case, there is one custom mapping for the DriverSide property. In the ForMember
    method, we are defining a custom map for a certain property; in this case, every
    DriverSide value from the EuropeanCar class will be mapped differently to the
    AmericanCar object. In the AmericanCar object, the DriverSide property value will
    always be mapped as the "Left" string value. So, whatever comes from the source
    object, the value of the DriverSide in the destination object will be string "Left".After
    the generic and custom mapping definitions are created, we are ready to instantiate
    the IMapper type object over which we will call the mapping methods. Next, we
    create an object of the EuropeanCar class type. This object will be used for the
    mapping and the creation of the AmericanCar object through the AutoMapper. The
    Map method is executed over the mapper object, and the new instance of the AmericanCar
    class is created. The Map method has many overloads, but in this case, it is required
    to provide the source object type first and the destination object type second,
    after which there is a concrete source object passed to the function. This will
    create a new instance of the AmericanCar class inside AutoMapper, and all properties
    will be mapped as defined in the configuration. After the creation and mapping
    are done, the Map method then returns the newly created object of the destination
    type class. Now, in the americanCar variable, we have the complete object with
    all of the property values mapped from the source object. In the end, we want
    to print the custom mapped property in order to check if everything went fine
    in the AutoMapper. The program output will look like this:![](image_rsrc1BW.jpg)The
    program printed the correct and expected behavior. The mapping for the AmericanCar
    property DriverSide is "Left" which we have defined in the configuration of the
    mappings. In addition, you can try to print out the other property values from
    the americanCar variable, and you will see that all the values are the same as
    from the source object europeanCar. AutoMapper is one powerful tool, isn''t it?8.8
    - Unit TestingUnit testing represents a principle of testing the particular software
    unit or module in order to define that it is ready for usage and to see if the
    functionality behaves well. Unit testing is, in fact, automated tests that are
    developed and run by developers. It is supposed to assure that the unit or any
    application section is working as expected and that it matches the design and
    correct behavior. Unit testing can be performed on both procedural and object-oriented
    programming. From the code aspect, a unit test could be the entire module of the
    application; it could be an individual method, an entire class functionality,
    certain application flow through the multiple method executions, etc. The best
    way is to write tests for the smallest testable units and then build and proceed
    with the more complex tests that are combining the smallest units together into
    some logical code execution flow. While programming in some software, developers
    should create the criteria and the results which are detected as correct behavior
    and insert them into tests to verify the exactness of the tested component. What
    is required to achieve is the isolation of every small part of the application
    and proving that those individual sections are working correctly. The advantages
    of writing the unit tests while developing some software are multitude. Unit tests
    are always there to discover the problems inside the software in their early phase.
    The development cycle is often to last longer if unit tests are included for every
    functionality. It prolongs the time of the completion, but it provides the quality
    of software that is about to be delivered. The unit test can detect the bugs in
    the implementation, as well as some missing logical parts of the component tested.
    If the developer knows that he must write a unit test for the functionality that
    he is about to develop, it forces him to think more sharply, and it also produces
    better and more quality code. The developer is then thinking more about input
    cases, potential outputs, potential errors, which is making him code better and
    write high-quality tested code. The significance of finding problems in the code
    in the early development cycle is crucial. It could reduce the enormous amount
    of time. The cost of finding potential problems on time is very low, unlike the
    cost of identifying, debugging and correcting the bugs later in the development
    cycle. The poor code quality can stop you from creating the unit tests because
    it can become impossible to test the particular unit if it is coded on a low-quality
    level. This is why test-driven development is forcing the programmers to analyze
    better, structuring the classes and methods in a better way. If not found, the
    problems could be released for the client''s live usage of the application, which
    could lead to various problems in the future. The use of unit testing is making
    a developer able to refactor every code part if needed and yet stay sure that
    the application component is still working as expected. The best practice is to
    create test cases for all methods and working flows. This way, whenever some change
    in the code creates a bug, it could be identified very fast.When following the
    test-driven development, commonly known as TDD , unit tests are supposed to be
    written before the code functionality itself. When the unit test is done, and
    the feature is also done, the developer should run the test and check whether
    the functionality works correctly. If the test passes, the feature is considered
    to be complete and accurate. The unit tests are supposed to run until the development
    process is not finished. If the test passed today, it doesn''t mean it''s going
    to pass tomorrow. There is a chance that new functionality or some code that is
    related to an already tested functionality could break the test that was marked
    as good. This is why tests are run in a loop until the whole development is finished.
    If some test execution fails, it is considered that there is a problem in feature
    or maybe a problem in a test. Sometimes tests must be changed, and some things
    should be added in order to cover the correct behavior. When a test fails, it
    does not always mean that the feature is not correct; the test could also be the
    reason for the failure. Test-driven development helps to identify the problems
    before handling the functionality to testers or clients. It reduces the chance
    of something being missed or badly provided.Besides the numerous advantages that
    unit testing usage contains, there are also some limitations and disadvantages,
    like for almost every approach in computer programming. Unit tests are not always
    certain to detect every problem and bug in the software because it cannot cover
    every execution flow. Unit tests are supposed to catch errors only in some small
    targeted places inside the code. They also don’t catch the performance issues
    of the functionality. So, the conclusion is that unit tests cannot prove the complete
    absence of errors, but still, they can help a lot. It is not possible to know
    all possible inputs for some functionality, as by definition, the unit testing
    principle is only covering the testing of small units. However, there are also
    other testing approaches that are supposed to track and identify problems not
    in a single unit, but in some flow, or whole execution path. This approach is
    called integration testing . There are also few more testing approaches that are
    helping to achieve software quality such as penetration testing, UI automated
    testing, etc. When a method has known input parameters and a certain output, in
    that case, unit tests tend to be the most comfortable. But, on the other hand,
    it is not easy to write a unit test when some functions are interacting with external
    components outside the application, such as web services, databases, etc. For
    example, if the method is calling some web service, and the result of the call
    is used for some purpose further in the method, then the developer must mock the
    service response. The service responses could be multiple, so in that case, the
    developer will have a problem because he would need to cover every possible response
    type of the external web service. There is also a problem when the method is working
    closely with the database. In that case, the developer must create a mockup of
    the database or the database section (some table records or similar), which is
    very likely not to be as good as the real database, and the real database interactions.Now,
    let us talk more about the testing approach that correlates close to the unit
    testing. This testing principle is integration testing . Integration testing represents
    a software testing paradigm where individual components are linked and tested
    as a group. The focus inside this principle is to find the problems between interactions
    of the smallest units. The smallest units are supposed to be tested in unit tests,
    and their relations, connections, and dependencies are to be tested inside integration
    tests. In the integration testing principle, there are several approaches. The
    Big-Bang approach is when all of the units are combined and tested at once. The
    Top-Down approach to integration testing is when top-level units are tested at
    the beginning, and lower-level units are tested after that, in a respective way.
    The bottom-up testing approach to integration testing is the opposite of the Top-Down
    approach. So, it is when low-level units are tested first, and the upper-level
    units are tested afterwards. The last approach is the Sandwich or the Hybrid approach.
    It represents the combination of the Bottom-up and Top-down integration testing
    approaches. There are a few things that are required for integration testing success.
    The developer should ensure that there is proper design information where all
    of the possible interactions between units are described. It is not possible to
    execute integration testing without this information clearly defined. The developer
    should be sure that each unit is tested separately before putting them into an
    integration test. If the units are not covered correctly with their own usage
    tests, the integration tests would not have any sense because they would be performed
    with the badly tested smaller units. Developers must automate their tests, especially
    when using the top-down, bottom-up, or hybrid approach. This is because the regression
    testing is about to be re-executed every time a unit is inserted into some integration
    test. For unit testing in C# programming language, there are few frameworks that
    are supporting it. They have the implementation for the creation of the unit test,
    initial setup values, and all the logic of the unit test execution. The most popular
    that are used often in C# are NUnit and XUnit frameworks. The Visual Studio contains
    some built-in unit testing tool that is also commonly used. All of the testing
    frameworks are here to suggest the same goal at the end. They support the developers
    to write unit tests faster, easier, and much simpler than without using the framework.
    The unit testing frameworks offer almost all similar features, but they surely
    differ between each other. Some of the frameworks are concentrated just on the
    execution of the very complex tests, while other frameworks are focused more on
    usability and simplicity of writing and executing the tests. The frameworks have
    differences, and they all group the priorities by their judgment, but at the end
    of the day, they all serve the same final goal.This goal is to define a clear
    path for a developer for the creation, execution, performance, and stability of
    the unit tests. Now, we will demonstrate the whole process of a few small unit
    tests. We will test the code and provide the results to familiarize you with the
    paradigm.For this explanation, we have chosen the NUnit framework for unit testing.
    We have created one NUnit test project inside our solution in Visual Studio. This
    project will contain references from the other projects inside our solution, which
    we will provide to it. Every project reference that has certain units that need
    to be tested will be inserted into the test project. This allows the unit test
    project to access the desired part of the code from other projects. For this example,
    we have created a new project where we will test the code for the unit tests.
    This project name is called TestableProject. Inside this project, we have added
    one class named UnitTestsExample.![](image_rsrc1BX.jpg)![](image_rsrc1BY.jpg)Here,
    we have exposed one class named UnitTestsExample, which will be fully tested inside
    our NUnit TestProject. This class contains four public methods. The first method
