    \ the reporting and documents section. We moved the document generating method\
    \ to this class, and now everything looks perfect. Maybe tomorrow, the client\
    \ will ask us to generate some more types of documents. In that case, all of the\
    \ new methods related to the documents and reports will find their belonging in\
    \ the `Reports` class. For example, the client asks us to produce functionality\
    \ for generating the word document with all the Worker information in it. Below\
    \ the PDF creation method, we would implement the `WORD` creation method, and\
    \ everything will stay according to the single responsibility principle.\n\n##\
    \ 7.2 - Open-Closed Principle\n\nThe definition of the Open-Close principle is\
    \ that the software modules, classes, and components, should be open for extension,\
    \ but closed for modification. This principle says that any software module should\
    \ easily be able to extend its functionality without changing the core implementations\
    \ that already exist. Any application or software module should be flexible and\
    \ adaptable for changes. Every software requires changes many times through the\
    \ development cycle; that is why every modification should always be double-checked\
    \ before completing it. The open-closed principle states that the current behavior\
    \ of the application or feature can perpetually be extended without having to\
    \ transform its present implementation. So, new features should be implemented\
    \ by writing the new code and leaving the existing code as it is. This is because\
    \ if we change the current implementation, we may make a bug in the current feature,\
    \ which was previously stated as the good working one. Following the open-closed\
    \ principle, we can reduce the risk of crashing the present implementation of\
    \ some features. Also, it is desirable to have every method and feature unit-tested,\
    \ so that if we change the existing implementation somewhere, it is often needed\
    \ to change the unit test, and this extends the development time. Inheritance\
    \ is always something that leads us to fulfill the open-closed principle. Sounds\
    \ good, let's jump into the examples:\n\n![](image_rsrc1AA.jpg)\n\nIn this example,\
    \ we have three classes of interest. One is the superclass `Vehicle`, and the\
    \ other two, `Truck` and `Car` are the derived classes. In the superclass, there\
    \ is one property that is of big interest here. This property, called `IsAutomatic`,\
    \ could be used by the objects of the derived classes, as well as in the core\
    \ class - the superclass. With further implementation, while the lines of code\
    \ are getting bigger and bigger, there is a big potential to have many references\
    \ to this property because it could be used by three class objects (`Vehicle`,\
    \ `Car`, `Truck`). If there is a need for some modification in the derived classes,\
    \ it would be fine to add properties and methods to describe those objects further.\
    \ This means that they are opened to the extension. However, if there is a need\
    \ for changing anything about the `IsAutomatic` property, it would create a big\
    \ mess, and refactoring through every reference to that property should be done.\
    \ So, as you can see, that would not be such a smart idea. The open-closed principle\
    \ is reflected in this property. This property is closed for modification because\
    \ it could potentially lead to enormous refactoring. Instead of changing the `IsAutomatic`\
    \ property in the superclass, the new property should be added to the superclass,\
    \ and the derived class constructors should be extended. This actually depends\
    \ on what you are trying to accomplish. Maybe you want to extend only one derived\
    \ class; in that case, you would add one property only in its child class.\n\n\
    Let us introduce another example: Let us assume that there is a next problem:\
    \ the company has employees – software engineers, and the director needs a program\
    \ to calculate the total cost of all the salaries he needs to pay to the employees.\
    \ That is easy; the implementation could be like this:\n\n![](image_rsrc1AB.jpg)\n\
    \nThis looks great, and it works correctly. For now, there are no issues, and\
    \ the program does not violate the single responsibility principle. But the company\
    \ has different types of employees, and they all receive different salaries. We\
    \ did not think about that. The information given is that there are two types\
    \ of employees - the software engineers and the QA engineers; their salaries are\
    \ calculated differently, so we would need to implement that case. This won’t\
    \ be a problem though, as we will do something like this:\n\n![](image_rsrc1AC.jpg)\n\
    \nWe are done with the changes here. We have managed to introduce the QA engineer\
    \ salary calculation into the program. Now we can also add a Manager salary calculation\
    \ here. That would be done by adding another `if` block into the `TotalSalary`\
    \ method of the `TotalSalaryCost` class. But there is one big problem here. Every\
    \ time we add a new position and its calculation formula for the salary, we also\
    \ need to alter the `TotalSalary` method implementation. So, this means that the\
    \ `TotalSalaryCost` class is not closed for modification, and we must modify it\
    \ every time we get a request for change. How can we implement this better to\
    \ avoid this situation? Generally, we can introduce the abstractions; we could\
    \ implement this by using the interfaces or abstract classes and decouple the\
    \ tight relations in the concrete class code. It would make every new request\
    \ easier to handle without changing the core calculation method. Let us choose\
    \ the abstract class component in order to solve this situation in the best way\
    \ possible. The final solution would be:\n\n![](image_rsrc1AD.jpg)\n\nHere, we\
    \ introduced one abstract class that is called `Salary`. This class contains only\
    \ one method, which is abstract - `TotalSalaryCost`. The classes `SoftwareEngineerSalary`\
    \ and `QAEngineerSalary` are still here in the implementation. We have made the\
    \ changes by making those two classes the subclasses of the `Salary` abstract\
    \ class. So, the `Salary` class became the base class, and `SoftwareEngineerSalary`\
    \ and `QAEngineerSalary` are now derived classes. In the derived classes, we have\
    \ implemented the parent class abstract method. This way, employee type has its\
    \ own total salary calculation implementation inside its own class. After these\
    \ changes, `TotalSalaryCost` class is much simplified. There is just one `foreach`\
    \ statement where we have only one line of code. In each iteration, we just call\
    \ the `TotalSalaryCost()` method over the current object. The objects in a loop\
    \ are all of `Salary` type. The calculation of the salaries will jump into the\
    \ correct implementation based on the object that currently in the iteration.\
    \ All of this will be added and saved inside the `cost` variable. The result will\
    \ then be returned through the variable `cost`, where the total amount is stored.\
    \ Now, the open-closed principle is fulfilled. Each time we get a request to add\
    \ a new employee and his salary calculation inside the program, we would just\
    \ create a class for it and make it a subclass of `Salary` class. We will then\
    \ implement the abstract method, and that would be it. The `TotalSalaryCost` class,\
    \ where the iteration and summing of salaries are happening, will stay untouched.\
    \ All of this could also be achieved with the use of interface.\n\n![](image_rsrc1AE.jpg)\n\
    \nInstead of the abstract class, we now have an interface `ISalary`. Inside this\
    \ interface, there is one method - the same method which was inside the abstract\
    \ class in the previous example. The derived classes of the prior example are\
    \ now implementing `ISalary`, which means they have their own implementation of\
    \ the `TotalSalaryCost()` method. In the `TotalSalaryCost` class, everything stayed\
    \ the same; the only thing is changed is the type of `cost` variable, which is\
    \ passed as parameter. Now, instead of the abstract class, we now have `ISalary`\
