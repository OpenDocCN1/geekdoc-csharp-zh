    ## 3.1 - Access Modifiers


    Access modifiers are the integral part of the object-oriented programming in C#,
    as well as in other languages. Access modifiers are the ones who will determine
    the level of accessibility of the program components. They define the openness
    of certain features and try to restrict undesired manipulation by external classes
    or programs. In C# programming language, there are six types of access modifiers:

    1. `public`

    2. `private`

    3. `protected`

    4. `internal`

    5. `private protected`

    6. `protected internal`


    The `public` modifier means that the code is accessible from all classes. The
    `private` modifier defines that the particular code is accessible only from its
    own class. The `protected` modifier means that the code is accessible within the
    same class or in a class that is inherited from that. We will talk about inheritance
    in later chapters. The `internal` keyword defines that the code is only accessible
    within its own assembly, and not from another assembly. `private protected` modifiers
    means that the access is limited to the containing class or types derived from
    the containing class within the current assembly. `protected internal` modifiers
    means that the access is limited to the current assembly and types derived from
    the containing class. The last two modifiers are representing combinations, and
    they are very specific access modifiers used in some advanced techniques. If some
    property, field, or method is declared without an access modifier, it is then
    recognized as a `private` modifier. The `private` modifier is the default modifier.
    For now, let us focus on the `public` and `private` modifiers. An example can
    be seen below![](image_rsrc18S.jpg)


    As provided in this example, there are two classes – `Numbers` and `Program`.
    Inside the `Numbers` class, there are two fields of integer data type defined.
    The first field is `number1` with a `private` access modifier. The second field
    is `number2` with `public` access modifier. In the `Main` method of `Program`
    class, we created an object of `Numbers` class. In the line below that, we can
    see the offered methods, fields, properties which could be executed over the `num`
    object. You will also notice that there is only `number2` variable which could
    be accessed in this particular part of the program. `number1` variable is not
    accessible from the `Program` class because it is `private` – it is only accessible
    from its own class.


    ## 3.2 - Return Values


    As mentioned earlier, methods can have a return value, or they can be `void`,
    which means that they do not have the returning result. While executing statements
    inside some methods, the program can run into the `return` statement. In `void`
    methods, if the `return` statement is called, it cannot have the result assigned
    to the statement. Precisely the `return` statement may be called in `void` methods,
    and then the control is passed to the program section from which the call to the
    `void` method occurred. Also, the `return` statement can be omitted in the `void`
    methods. On the contrary, typed methods must have a `return` statement and the
    value which is being returned. The value returned must be of the same type as
    the method itself. If not, the compiler would report an error. To sum up this
    chapter, an explained program is demonstrated below![](image_rsrc18T.jpg) In this
    example, there are two classes exposed – `Program` class and `Vault` class. The
    first class to be explained is the `Vault` class, along with its members and components.
    The first things you will notice are two private fields and one property. The
    private fields are of the string data type, and those are `_accessKey` and `_secretMessage`.
    The property in this class is the boolean `Unlocked`. The `Unlocked` has a standard
    getter and a private setter. A private setter means that the value of this property
    can only be assigned inside its own class; in this case, it is assigned in the
    `Vault` class. So, if someone tries to assign value to the `Unlocked` property
    of some `Vault` object inside any other class, the compiler would report an error.
    This property has its default value set to false. The next important member of
