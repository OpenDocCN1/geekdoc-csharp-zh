    Programming (OOP) is the most popular programming paradigm in the world. This
    paradigm is the successor of procedural programming. Procedural programming represents
    writing functions and procedures that manipulate some data. On the other hand,
    object-oriented programming is all about creating objects that have their methods
    and data all in one. There are many advantages that object-oriented programming
    has over the procedural paradigm. The object-oriented programming keeps the code
    much easier to handle and maintain, and it is easier to debug and modify. OOP
    helps to reduce the amount of time of development, and it also helps you in building
    reusable code and components. In addition, it is much faster and easier to execute.
    It is easier to stick to the DRY principle, which tells that the repetition of
    code must be on the minimum. The DRY principle stands for the Don''t Repeat Yourself.
    The code parts common to some applications should be extracted and placed in one
    component from which it becomes reusable and not repetitive. OOP, as its name
    says, is based on object using and managing. Those objects contain data in different
    forms. In the C# programming language, those forms are fields, properties. It
    also contains the data manipulation part, which is known as procedures - in C#
    well-known methods. The objects represent instances of some class, which determine
    their type. This means that the C# programming language is class-based. OOP paradigm
    allows you to break a problem into smaller pieces - it decomposes it into smaller
    units, which makes everything easier to handle. Those units are the objects mentioned
    above. There are four characteristics of the main aspects of object-oriented programming: abstraction
    , encapsulation , inheritance , and polymorphism . These four features are the
    laws of the object-oriented programming paradigm. 6.1\. - EncapsulationEncapsulation
    represents the packing of data into some logical components. It is a mechanism
    of wrapping the data and binding it into a single unit. Encapsulation is a way
    of securing the data stored in the classes, preventing access for the components
    that should not use that particular data. There is a relation between abstraction
    and encapsulation. The purpose of the abstraction is to make certain information
    visible, and the purpose of the encapsulation is to select the program features
    that will have a certain level of abstraction. The encapsulation usage prevents
    and protect the data from corrupted usage, errors, and mistakes. In object-oriented
    programming, the data and its manipulation is almost everything - it is a critical
    element of a program. If we want to protect certain data, we have to use private
