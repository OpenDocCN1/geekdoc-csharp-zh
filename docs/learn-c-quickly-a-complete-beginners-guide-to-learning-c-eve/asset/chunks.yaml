    # Chapter 1: Introductory Topics


    C# is an object-oriented programming language that has enormous community support
    since it was built by Microsoft. C# is used for various software development such
    as Web Applications, Desktop Applications, Mobile Applications, etc.


    ## 1.1 - Data Types

    Every variable in the program must belong to some data type, so if we need to
    do some calculations, we will have to use numbers, and if we need to do text manipulation,
    then we use characters, etc. Every data type has its own usage circle and size
    of bytes inside of the memory when declared. Hence, it is important to use the
    best data type for the related problem in order to avoid errors and to make your
    code more readable and maintainable.


    ## 1.2 - Integer

    An integer is one of the most used data types in C# language. The integer represents
    any number that does not have fractional parts, also known as the whole number
    (e.g., 1, 5, 27, 13, -145…). `Integer` has multiple types inside of it, but the
    one we are mostly using is the `Int32` data type. In the C# program, the `Int32`
    data type is commonly written as `int`. It is 32 bits in-memory sized. The `int`
    variable can be declared, or it can be declared and value-assigned in the same
    line. The default value for an integer data type is zero (0).


    The most common integer types that you will probably see throughout the code are:

    1) `byte` – unsigned integer which is 8 bits represented in memory

    2) `long` – it is 64 bits in-memory integer type (`Int64`)

    3) `short` – integer type which is 16 bits organized in memory (`Int16`)


    ## 1.3 Decimal

    Decimal types in C# represent non-rounded – fractional numbers. There are also
    few Decimal types that differ by its size in memory, usage, etc. In order to initialize
    the decimal data type, `decimal` keyword is used. This type is represented with
    128 bit in memory allocation. For decimal data types, suffix `m`, or `M` must
    be added at the end so that the compiler knows it should be treated as decimal
    type. If that suffix is not inserted, the compiler will treat that number as `double`
    type. `Double` is the default floating-point type. It is represented with 64 bits
    in memory allocation. There is also `float` data type, whose size in memory is
    32 bits. Suffix for float data type representation is `f`, or `F` (if not added,
    then the number will be treated as double as mentioned earlier).


    ## 1.4 - String

    String data type in C# is a type that represents text and works with text variables.
    In fact, it is array of characters. Declaring a string data type is done by `string`
    keyword. When `string` keyword is being used, it means that it is referring to
    `System.String` class (classes will be explained later). There are many extension
    methods which could be used over string variable. Some of the most popular are
    `Concat` – which is concatenating two strings, `Contains` – which determines whether
    the string contains the given string from parameter value, `Equals` – which determines
    whether two strings have the same value, etc. The default string type is an empty
    string.


    ## 1.5 - Boolean

    The boolean data type is regarded as the logical type in C#. It has only two possible
    values, and they are `true` or `false`. The boolean type in code is referred by
    the `bool` keyword. Boolean data types are used very often in programming because
    it is always required to determine some logical conditions. It is commonly used
    for comparing things such as number comparison, object comparison, etc. Boolean
    is the returned value in every `if` condition in the code (If-Else statement will
    be explained later). The default Boolean data type value is false.


    ## 1.6 - Var

    Var data type is introduced in C# to implicitly declare variables. So, it can
    be said that `var` is not a data type; it just represents a way of declaring variables.
    What that means is when some variables with the `var` keyword are declared, we
    are telling the program that it needs to determine the explicit data type of variable
    during the time of compilation. There are also restrictions about the `var` keyword
    and its usage such that all explicit data types as `int`, `string`, and `bool`
    can be class fields.


    On the other hand, implicit declaring (`var` keyword) cannot be class fields.
    This “imaginary” data type can only be used if it is declared and initialized
    at the same time (value-assigned) because the compiler will adjust its real data
    type by the value from the right side of the equation. Variable declared with
    the `var` keyword cannot be initialized with the `null` value.


    ![image_rsrc181.jpg]

    Declaration and value initialization of `someVariable` and `secondVariable` is
    fine because the compiler knows how to determine the data type for these two variables
    due to the right side of the assignment (“New text” is the string data type and
    53 is the integer data type). `thirdVariable` declaring is not allowed because
    it does not have any initialization of the value. `fourthVariable` initialization
    is also not allowed because the compiler does not recognize the type by its right
    side assignment. It is `null`, and `null` stands for referencing the variable
    pointer to nothing.


    ![image_rsrc182.jpg]

    Here’s an example that will demonstrate the data types and help you in understanding
    it better. So, here we have a class `Program` with six methods inside of it. The
    first method is the `Main` method. This method is called first after we run the
    program. The only thing that is done in the `Main` method is to call other methods
    that demonstrate some basics of working with data types in C#. The first method
    that is called is the `Integers()` method. `Integers()` method does not have any
    parameters passed to it. Inside of this method, three integer variables `x`, `y`,
    and `z`, are declared. The assignment of the `z` variable is the calculation based
    on the previous two variables which have already been declared.


    ```csharp

    int z = x * x + y * y;

    ```

    This assignment is doing the next calculation – 4 * 4 + 3 * 3, which equals 25.
    So variable `z` is equal to 25. After this calculation, the program prints the
    value of the `z` variable to the console line, and that is 25.


    After the execution of the `Integers()` method, the program is heading to the
    execution of the `Double()` method. Here, declaring three decimal variables is
    done, and these variables are `credit`, `debit`, and `balance`. Variable `balance`
    is calculated by the subtraction of the `debit` and `credit` variables. After
    the calculation, the `balance` value is minus 44.57, which would be printed in
    the console line.


    Now, the next method to be executed is the `String()` method. Here, `firstName`
    and `lastName` variables are declared, and the program is doing the string manipulation
    with them to assign value to the `fullName` variable. By using the interpolation
    sign `$`, the program is forming the new string, which consists of `firstName`
    value, `lastName` value, and the space between them. So `fullName` value assigned
    is “Tom Holland,” and the program is printing that into the console line. `Boolean()`
    method is next. Inside this method, two Boolean variables are declared, and what
    they will determine is “is the grass green and is the ocean red.” Again, using
    interpolation, the program inserts those values into the console line. So the
    first string which would be printed is “Is the grass true” and the second string
    that would be printed is “Is the ocean false”.


    In the end, `Var()` method is executed. In this method, the program is declaring
    a string type variable, which is determined in compilation time. During the compilation
    time, the compiler looks at the right side of the assignment and finds “Hello
    World.” This way the compiler knows that the variable is of string type. After
    it, the program prints its value to the console line.


    ![image_rsrc183.jpg]


    # Chapter 2: Branches and Loops


    Programming is not always straight-forward. So sometimes it is all about decisions
    and conditions. At some point, based on the condition or conditions, the flow
    of the program could be done in two ways. What this means is that if certain conditions
    are fulfilled, block A is executed, else B. Some code blocks will be executed
    based on the condition, others won''t. Also, sometimes we need to execute some
    block multiple times and reuse its logic, and we can achieve this with looping
    in C#. The term looping means that certain block is executed several times until
    conditions are fulfilled. Branching and looping in C# depend on boolean conditions.
    As mentioned before, based on boolean conditions, a certain block will be executed
    once or various number of times.


    ## 2.1 - For Loop

    In C# programming language, there are several ways it could be looped over block
    of the code. The first looping type which is going to be processed in this book
    is the `for` loop. `for` loop is used when you know exactly how many times you
    want to iterate through block of the code. It is declared with the `for` keyword.
    `for` loop executes code block until the specified condition in the `for` statement
    returns a `false` boolean value.


    ![image_rsrc184.jpg]

    The variable initialization is executed only once by the program. It is executed
    before going into the `body` block of the code inside the `for` statement. Here
    we are declaring and initializing the variables that will be used inside the body
    block. The `condition` part from the syntax represents the boolean expression
    on the basis of which it will be decided if it is necessary to re-enter the body
    block. The iterating steps describe the incrementing or decrementing of counter.
    This statement is executed every time after the body block has been executed.
    We can use `break` statement if we want to jump out of the iterations in the `for`
    loop for some reason.


    ![image_rsrc185.jpg]

    Here we have some code block that iterates five times through the body block.
    In the body code block, the counter variable is multiplied each time by two. Before
    this calculation, there is a condition that checks if the counter value exceeds
    one hundred. It is supposed to iterate five times through this block, but if you
    look closer, you’ll notice that it didn’t act like that. In the beginning, the
    counter values twenty. After the first iteration, it became forty, followed by
    the second where it changed to eighty, then in the third, it became one hundred
    sixty, and in the fourth iteration, the condition was fulfilled. So, since the
    counter is greater than one hundred, the code exits the loop. Then, it continues
    the execution of the code below the loop statement. In for loop, there is also
    one statement which is similar to `break`, and its keyword is known as `continue`.
    The `continue` statement means that it is breaking the execution of the current
    iteration and jumps to the next iteration if the condition is fulfilled.


    ![image_rsrc186.jpg]

    This part of the program is supposed to iterate five times, and it ought to print
    the counter number to the console line each time, except in one iteration. This
    is because of the `if` condition, where the program is checking whether variable
    `i` counter is equal to three. In the fourth iteration, variable `i` will be equal
    to three, and the program will execute the `continue` statement, which breaks
    the fourth iteration from printing number three to the console. However, it does
    not break the whole loop; it just breaks that iteration and continues the next
    iteration. In this case, the next iteration is also the last one. So, the program
    output will look like this:


    ![image_rsrc187.jpg]


    ## 2.2 - While Loop

    The next looping statement in C# code that will be analyzed is the `while` loop.
    This statement also represents the repeated execution of the same code block.
    The syntax for using the `while` loop statement in C# is below.


    ![image_rsrc188.jpg]

    Code block from the `body` will be executed while the `expression` variable returns
    a `true` value. Unlike the `for` loop, here, the initialization part must be done
    before the loop itself. Handling of the increment or decrement counters should
    be done inside the body code block in order to create some logical way of using
    the `while` statement. Due to the condition of the `while` statement, we may never
    enter the body code block that is inside the `while` loop. If the condition is
    `false` at the beginning, the program will never jump into the loop, so the minimum
    number of iterations could be zero. This cannot happen in `for` loop because the
    minimum number of iterations is one. Here, `break` statement could also be made
    if the program needs to exit the loop due to some reason. There is also `do-while`
    loop, which is the same as `while` loop, where the condition is at the end. This
    makes the code execution of the body block to run at least once.


    ![image_rsrc189.jpg]

    The syntax for `do-while` loop is below:


    ![image_rsrc18A.jpg]

    Here, the program is supposed to iterate five times through this `while` loop.
    In the fourth iteration, when `i` counter is equal to three, the program enters
    the `if` block, increments the `i` counter, and executes the `continue` statement.
    This prevents the program from doing the console printing of the value three,
    but rather, it executes the next iteration. So, the program output looks completely
    the same as the example with `continue` in the `while` loop.


    ![image_rsrc18B.jpg]

    The syntax for `do-while` loop is below:


    ![image_rsrc18C.jpg]

    At the beginning of this program, variable `i` is initialized with zero. Then
    the program runs `do-while` loop. The command is that it should execute the body
    block since variable `i` value is greater than five. Now, you are probably wondering
    how this would print anything at all if variable `i` equals zero from the beginning.
    After the first iteration, the program will not satisfy the condition, and the
    looping will stop. The output will be:


    ![image_rsrc18D.jpg]


    ## 2.3 - Recursion

    The term “recursion” is typical in programming, as well as in the C# language.
    When the problem starts to be too complex, algorithms need to be split into smaller
    pieces in order to find the solution. Recursion is the programming technique where
    the program method or procedure calls itself repeatedly to solve that problem.
    So, to make this easier, recursion is the process of executing a function which
    means calling itself inside the body block. Some problems which require looping
    through a particular code block can be simplified and solved with recursion. The
    best case should be the calculation of the known mathematical problem named factorial.
    Factorial of a number represents the multiplication of every number from one to
    that particular number. The value of the zero factorial and one factorial is one.

    0! = 1;

    1! = 1;

    2! = 1*2 = 2;

    3! = 1*2*3 = 6;

    4! = 1*2*3*4 = 24;

    5! = 1*2*3*4*5 = 120;


    ![image_rsrc18E.jpg]

    In this example, the program contains one `Main` method, which is the writing
    of two lines in the console. The first line output value is the returned value
    of `fact(5)` method. While the second line output is the returned value of the
    `factLoop(5)` method. Both methods have parameters passed inside, and that parameter
    represents the number that the factorial value program wants to calculate – the
    `n` variable. Both methods have the checker if the passed number is zero or one
    because that is the edge case scenario of the factorial calculation (0! = 1! =
    1). The second method (`factLoop`) is the method that is calculating the factorial
    of the number through the `while` loop. The initial variables are declared at
    the beginning of the method. These variables are known as `factorielValue` which
    would be the return value of the function (inside this variable, the program will
    have calculated the factorial of the particular number). Furthermore, the counter
    variable `i` represents the conditional controller of how many times the program
    should iterate through the `while` loop to get the factorial value of a number.
    In each iteration, we are multiplying the current `factorielValue` variable value
    with the counter variable `i` and increment the counter by one. After the last
    iteration, the program will have the factorial value of the passed number, and
    that number will be returned as a result of the method of execution.


    This algorithm could be simplified with the recursion concept. The first method,
    `fact(5)`, is using the recursion method. The result of this method is the same
    as the result of a non-recursive method, which was explained above – the solution
    with the loop. In this method, after the zero or one factorial check, the program
    returns the passed value that was multiplied by the call of the method in whose
    context is currently. So, with the `fact(5)` call, the program calculates `5 *
    fact(5-1)`, then it calls the same method, but with a different parameter passed,
    this time with the parameter four. The execution of that method calculates the
    `4 * fact(4-1)`, and this continues until the `fact(1)` is called. The results
    of these recursive calls are returned, and then used to calculate the factorial
    of the previous call.


    ![image_rsrc18F.jpg]

    You can see from the program output that both the loop and recursive calculations
    are having the same result, which is 120.


    ![image_rsrc18G.jpg]


    ## 2.4 - If…Else

    As mentioned earlier, and as you can see from some of the examples above, the
    `if-else` statement in C# is used a lot. The conditional programming is required
    pretty much all the time.

