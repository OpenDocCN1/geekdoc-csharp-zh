  \ ball 的大小写入控制台。\n\n```csharp\nforeach (Ball ball in list)\n{\n    ball.Size();\n\
  }\n```\n\n每次迭代都会调用该对象的 `Size()` 方法。该 `Size()` 方法根据对象类型跳转。`TableBall` 返回 `\"Small\"\
