  \ 循环一直执行到 `userInput` 变为 \"exit\"。\n\n现在，所有工作已准备好打印控制台输出的初始状态。我们将打印用户可以在程序内部执行的选项。首先，清除控制台，然后在开头打印控制台应用程序名称——“Dealership\
  \ Manager 2.0”。用户的选项有：1) 买车辆，2) 卖车辆，3) 显示库存。用户可以通过在控制台中输入一、二或三与应用程序通信。当用户按下键盘上的任何数字时，该值将存储在\
  \ `userInput` 变量中（`userInput = Console.ReadLine()`）。如果用户在控制台行输入 \"exit\"，程序将中断并结束执行。如果用户输入数字\
  \ 1 并按回车，程序将执行第一个 `if` 语句体。\n\n"
