  \ `Name` 和 `Age` 属性。两个属性都有 `get` 和 `set` 访问器。在 `get` 访问器中，两个属性都返回相应的私有字段值。同样，在 `set`\
  \ 访问器中，两个属性都将传递的值分配给私有字段。通过这种方式，我们实现了封装。在 `Program` 类的 `Main` 方法中，我们将测试一切是否运行正常。首先，我们实例化\
  \ `Person` 类的对象。之后，我们再次使用封装设置该特定对象的名称和年龄，因为在操作过程中调用了 `set` 访问器。最后，我们使用 `get` 访问器将数据打印到标准输出，包括人的\
