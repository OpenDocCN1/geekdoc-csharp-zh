  \n## 6.2 - 继承\n\n面向对象编程的另一个特性是 `inheritance`（继承）。这种特性是一种允许类继承其他类部分的智能机制。这意味着如果类\
  \ `A` 继承自类 `B`，类 `A` 对象将能够访问类 `B` 的成员；其字段、属性、方法等。在继承原则中，我们识别 `Parent` 类（父类）和 `Child`\
  \ 类（子类）。。Superclass` 代表基类，其特征要在子类中被继承。继承另一个类的类的被称为 `Subclass`。除了该类可以访问基类成员的事实外，它还可以实现自己的成员和特征。`Subclass`\
  \ 看到它所有的特征，包括父类的特征。`Superclass` 只看到它自己的特征。重用概念在继承范式中是完全支持的。reability could be mirrored\
  \ in the example that we need to create some class。在这种情况下，可以重用已有的类。要继承类，使用 `:` 符号。例如：\n\
  \n```\nclass B : A\n```\n\n在这个示例中，类 `B` 是子类，类 `A` 是基类。如果由于某些原因你想限制某些类的继承，使用 `sealed`（密封）关键字。例如，对于\
  \ `sealed` `Person` 类：\n\n```csharp\nsealed class Person\nclass Student : Person\n\
  ```\n\n这将为你提供一个编译错误，说 `Student` 类不能派自 `sealed` `Person`。当 `Subclass` 不继承自基类时，这是一个边缘情况。然而，`sealed`\
  \ 也可以用于访问修饰符。在访问修饰符章节中承诺过的，`sealed` 关键字将在这里解释。`protected` 关键字在处理继承范式时使用。它是一种在继承特征中经常出现在这里的访问修饰符。一个特定类的\
  \ `protected` 成员指定了在该类内部可以访问的组件。仍然，在该类的任何子类内部也可以访问的。一个示例所示![](img/image_rsrc19H.jpg)\n\
  \n在这个示例中，有一个父类 `ParentClass` 和一个子类 `ChildClass`。在 `ParentClass` 中，有两个字符串类型的字段。第一个字段是\
  \ `private`，其值设置为 `\"Private\"`。第二个是 `protected` 字段，其值设置为 `\"Protected\"`。在 `ParentClass`\
  \ 下方，有一个继承自 `ParentClass` 的 `ChildClass`。在这个类中，只有一个方法——`Print()`。该方法的作用是向控制台输出基类的\
  \ `protected` 字段的值。你可以看到，这是允许的，编译器没有报告任何错误。然而，在下面被注释的代码中，尝试访问基类的 `private` 字段并将其值写入控制台输出。是不允许的，编译器将报告错误，这就是为什么被注释了。在\
  \ `Program` 类中，我们将展示这一切是如何顺畅运行的。在 `Main` 方法中，实例化了一个 `ChildClass` 对象。之后，我们调用该 `ChildClass`\
  \ 对象的 `Print()` 方法。在那个时刻，`ChildClass` 对象拥有访问父类 `protected` 成员的所有权利。这就是为什么该程序执行正确，我们将在标准输出上看到这样的：![](img/image_rsrc19J.jpg)\n\
  \n程序输出了 `\"Protected\"` 字符串，这是预期的。一切进展顺利，继承得到了证明。重要的是知道有不同类型的继承：\n\n- **单继承**：只有一个父类和一个子类。示例：\n\
  ```\nclass A\nclass B : A\n```\n- **多级继承**：有一个代表一个类的子类和另一个类的父类。示例：\n```\nclass A\n\
  class B : A\nclass C : B\n```\n- **层级继承**：有一个多个子类的父类。示例：\n```\nclass A\nclass B\
  \ : A\nclass C : A\n```\n\n在继承原则中，还有一点需要知道：`protected` 关键字的使用。正如之前在访问修饰符小节中承诺的，`protected`\
  \ 关键字将在这里解释。`protected` 关键字在处理继承范式时使用。它是一种在继承特征中经常出现的访问修饰符。一个特定类的 `protected` 成员指定了在该类声明内部可以访问的组件。仍然，在该类的任何子类内部也可以访问。\n\
