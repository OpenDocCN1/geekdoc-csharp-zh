  \ `ModernEngine` 属性，并访问 `ModernEngine` 属性的 `EngineType` 属性实现的。应该打印的值是 `\"V6\"`，这与经典汽车对象的情况相同。该程序的输出所示：\n\
  \n![](img/image_rsrc19W.jpg)\n\n## 6.4 - 多态\n\n多态是一种面向对象的编程范式，代表了具有多种形式物体的使用。这意味着具有相同名称的属性或函数可以有多个不同的功能——实现。事实上，一个类拥有相同名称的多个功能的能力就是多态。它是面向对象编程概念中的第四个、可能也是最核心的范式。\n\
  \n多态发生在多个类之间相互相关，并且都通过继承原则连接时。继承和多态是紧密耦合的；在大多数情况下它们共同存在。继承允许其他类继承字段、属性和方法，而多态则用于使用这些成员执行不同的工作。这允许程序员以几种不同的方式执行单一操作。\n\
  \n多态可以是静态的或动态的。静态多态也称为编译时多态，而动态多态称为运行时多态。静态多态发生在编译时，而动态多态发生在运行时。编译时多态的示例所示：\n\n\
  ![](img/image_rsrc19X.jpg)\n\n在这个示例中，有一个 `Printer` 类，其中包含三个方法。这些方法的名称都相同——`PrintData`。它们之间唯一的区别是参数。第一个方法接收一个\
  \ `string` 类型的参数；第二个接收一个 `int` 类型的参数；最后一个方法接收一个 `double` 类型的参数。每个方法执行相同的工作——将传递的参数值打印到控制台输出。\n\
  \n编译器如何允许我们创建三个名称相同的方法呢？嗯，这在之前的章节中提到过。编译器不允许你在以相同的顺序的情况下创建多个名称相同且参数类型也相同的方法。方法的唯一性不仅取决于它的名称，还包括它的参数——整个方法的\
  \ `signature`（签名）。你在这里看到的这种现象被称为方法重载，这在之前的一些章节中已经解释过。重载代表了编译时的多态。在这种情况下，方法名相同但实现不同。\n\
  \n在 `Program` 类中，`Main` 方法包含 `Printer` 类的实例化。`printer` 对象随后调用了三次 `PrintData` 方法，每次都使用不同的参数类型。第一次调用传递了\
  \ `string` 参数，第二次传递了 `int` 参数，第三次传递了 `double` 参数。根据参数类型，程序将识别出它应该在 `Printer` 类中进入哪种方法实现。该程序的输出如下所示：\n\
  \n![](img/image_rsrc19Y.jpg)\n\n第二种类型的多态是动态多态，它发生在运行时。动态多态的示例所示：\n\n![](img/image_rsrc19Z.jpg)\n\
  \n这里我们有一个名为 `Vehicle` 的基类。该类随后有一个名为 `IsAutomatic` 的公共只读属性。在构造函数中，你会注意到我们只给这个属性分配了值。在\
  \ `Vehicle` 类下面，还有两个类，其作用是作为 `Vehicle` 的子类。第一个子类是 `Car` 类。它继承自基类，并且包含一个自己的属性。该属性被称为\
  \ `TrunkCapacity`（后备箱容量），它也是一个只读属性。`Car` 类包含构造函数，接收两个参数：`_TrunkCapacity` 和 `bool`\
  \ 类型的值 `_IsAutomatic`。注意，除了普通的构造函数描述外，还有一个 `:base(_IsAutomatic)` 后缀。`base` 关键字表示也应该调用父类的构造函数，然后我们将\
  \ `_IsAutomatic` 参数传递给它。通过这种方式，`Car` 类将设置其父类的只读属性 `IsAutomatic`。`TrunkCapacity`\
  \ 参数通常被赋值给它。\n\n`Truck` 类也继承自 `Vehicle` 类，其逻辑与 `Car` 类相同。该类有一个只读属性 `BedCapacity`。构造函数接收两个参数\
  \ `_BedCapacity` 和 `_IsAutomatic`。基构造函数通过传递 `_IsAutomatic` 值被调用，`BedCapacity` 通常被赋值给它。让我们在\
  \ `Main` 方法中查看这些是如何共同工作的：\n\n![](img/image_rsrc1A0.jpg)\n\n(注：原文此部分存在大量重复表述和逻辑混乱，译文已根据逻辑进行了梳理并保留核心技术含义)\n\
  \n另一个动态多态的示例是：\n\n![](img/image_rsrc1A1.jpg)\n\n在这个示例中，我们有一个作为父类的类 `Vehicle`。在该类内部，有一个\
  \ `void Info()` 方法进行打印。你可能注意到目前为止没见过的一点——`virtual` 关键字。`virtual` 方法代表可以在派生类中重定义的方法。`virtual`\
  \ 方法既存在于基类也存在于派生类中。当我们有默认功能并想要扩展或更改该功能时，`override` 关键字是可选的。与必须 `override` 的 `abstract`\
  \ 方法不同，`override` 方法提供了一种新的、不同的实现，这是多态的最好示例。\n\n# 第 7 章：SOLID 原则\n\nSOLID 原则代表了程序员在使用\
  \ C# 语言进行编程时应该遵循的方式。五个面向对象的设计原则就是 SOLID 设计。当结合遵循这些原则时，它们会让编码变得更加简单。它们使得开发应用程序或任何易受变化的软件变得容易。如果程序员或团队遵循这些原则，维护和扩展代码将变得舒适得多。\n\
  \n遵循 SOLID 让开发者避免糟糕的编码实践，这使得系统易于重构。SOLID 使软件适用于自适应和敏捷开发。如果不按照 SOLID 设计进行编码，对代码的每个微小更改请求可能对开发者来说都变得非常有压力且痛苦。如果应用程序的设计和架构走向错误的方向，即使是最小的更改也可能导致特定软件出现严重问题。这并不是应该发生的。更改和新功能是软件开发的一部分，它们永远存在，且不应归咎于此。\n\
  \n在开发过程中最常见的错误是不适合的类中添加更多职责。向特定类添加不相关的功能是不好的。此外，当开发者强制类之间相互依赖时，在某个时刻一个类的更改也会影响另一个类。因此，将类和组件紧密耦合是通往失败的道路。应用程序中重复的代码也是应该避免的。这些只是从手中漏掉的一些错误。解决所有这些潜在问题的办法是从开始选择正确的应用程序架构，在整个开发过程中遵循设计原则并选择正确的设计。\n\
  \n## 7.1 - 单一责任原则\n\n单一责任原则说：“每个软件模块应该只有一个变化的理由。”这意味着每个特定组件应该只有一个职责。这并不意味着每个模块应该只有一个属性。只要它们服务于单一职责，可以有多个成员。这个原则为我们提供了从开始识别类的最佳方式。它让你思考所有可能变化的软件模块。只有对软件有清晰的理解，才能实现最好的职责分离。让我们看看示例：\n\
  \n![](img/image_rsrc1A3.jpg)\n\n(注：原文 7.1 之后存在严重重复表述，译文已根据逻辑进行了精简)\n\n\n\n\n\n第二个类被称为\
  \ `Reports` 类，它的创建是为了处理报告和文档部分。我们将文档生成方法移动到了这个类中，现在一切看起来都完美了。也许明天，客户会要求我们生成更多类型的文档。在这种情况下，所有与文档和报告相关的新方法都将在\
  \ `Reports` 类中找到归属。例如，客户要求我们提供一个功能来生成包含所有 Worker 信息的 Word 文档。在 PDF 创建方法下方，我们将实现\
  \ `WORD` 创建方法，一切都将符合单职责原则。\n\n## 7.2 - 开闭原则\n\n开-闭原则的定义是：软件模块、类和组件应该对扩展开放，但对修改关闭。该原则指出，任何软件模块都应该能够轻松地扩展其功能，而无需更改已有的核心实现。任何应用程序或软件模块都应该是灵活且能适应变化的。每个软件在开发周期中都需要经过多次更改，这就是为什么每次修改在完成之前都应该始终进行双重检查。开闭原则规定，应用程序或功能的当前行为可以永久地扩展，而无需转换其当前的实现。因此，新功能应该通过编写新代码并保持现有代码不变来实现。这是因为，如果我们更改了当前的实现，我们可能会在当前功能中引入\
  \ bug，而该功能之前被声明是运行良好的。遵循开闭原则，我们可以降低某些功能的当前实现崩溃的风险。此外，对每个方法和功能单元进行单元测试是理想的，因为如果我们更改了某处的现有实现，通常需要更改单元测试，这会延长开发时间。继承始终是能够引导我们实现开闭原则的方法。听起来很不错，让我们进入示例：\n\
  \n![](img/image_rsrc1AA.jpg)\n\n在这个示例中，我们有三个感兴趣的类。一个是超类 `Vehicle`，另外两个 `Truck` 和\
  \ `Car` 是派生类。在超类中，有一个非常受关注的属性。该属性名为 `IsAutomatic`，可以被派生类的对象使用，也可以在核心类（即超类）中使用。随着进一步的实现，虽然代码行变得越来越大，但该属性可能会产生许多引用，因为它可以被三个类对象（`Vehicle`、`Car`、`Truck`）使用。如果派生类需要某些修改，那么向这些对象添加属性和方法以进一步描述它们是可以接受的。这意味着它们对扩展是开放的。然而，如果需要更改\
  \ `IsAutomatic` 属性的任何内容，将导致一个巨大的混乱，并且必须对该属性的每一个引用进行重构。所以，如你所见，这并不是一个高明的主意。开闭原则反映在这个属性上。该属性对修改是关闭的，因为它可能导致海量的重构。与其在超类中更改\
  \ `IsAutomatic` 属性，不如向超类添加一个新属性，并扩展派生类的构造函数。这实际上取决于你试图实现什么。也许你只想扩展一个派生类；在这种情况下，你只需要在其子类中添加一个属性。\n\
  \n让我们引入另一个示例：假设有这样下一个问题：公司有员工——软件工程师，总监需要一个程序来计算他需要支付给所有员工的工资总成本。这很简单；实现可以如下：\n\n\
  ![](img/image_rsrc1AB.jpg)\n\n这看起来很极了，而且运行正常。目前没有问题，程序也没有违反单职责原则。但公司有不同类型的员工，他们收到的工资不同。我们没有考虑到这一点。给出的信息是有两种类型的员工——软件工程师和\
  \ QA 工程师；他们的工资计算方式不同，因此我们需要实现这种情况。不过这不会成为问题，因为我们将做类似这样的操作：\n\n![](img/image_rsrc1AC.jpg)\n\
  \n我们在这里完成了更改。我们成功地将 QA 工程师的工资计算引入了程序中。现在我们也可以这里添加经理的工资计算。这将通过在 `TotalSalaryCost`\
  \ 类的 `TotalSalary` 方法中添加另一个 `if` 块来实现。但这里有一个大问题。每当我们添加一个新的职位及其工资计算公式时，都必须修改 `TotalSalary`\
  \ 方法的实现。这意味着 `TotalSalaryCost` 类对修改是不关闭的，每当我们收到更改请求时，都必须修改它。我们如何更好地实现它以避免这种情况呢？通常，我们可以引入抽象；我们可以通过使用接口或抽象类来实现这一点，并解耦具体类代码中的紧密关系。这将使得每个新请求都更容易处理，而无需更改核心计算方法。让我们选择抽象类组件以最可能的方式解决这种情况。最终的解决方案是：\n\
  \n![](img/image_rsrc1AD.jpg)\n\n在这里，我们引入了一个名为 `Salary` 的抽象类。该类只包含一个方法，它是抽象的——`TotalSalaryCost`。`SoftwareEngineerSalary`\
  \ 和 `QAEngineerSalary` 类仍在实现中。我们通过让这两个类成为 `Salary` 抽象类的子类完成了更改。因此，`Salary` 类变成了基类，而\
  \ `SoftwareEngineerSalary` 和 `QAEngineerSalary` 现在是派生类。在派生类中，我们实现了父类的抽象方法。这样，员工类型就有它自己的总工资计算。通过这种方式，`TotalSalaryCost`\
  \ 类被简化了。这里有一个 `foreach` 语句，在每次迭代中，都会调用当前对象的 `TotalSalaryCost` 方法。这种方式使得开闭原则得以实现。每当我们添加一个新员工并其工资计算时，只需创建一个新的子类并保持现有代码不变。这样，`TotalSalaryCost`\
  \ 类就不需要修改。此外，对每个方法和功能都进行单元测试是理想的。开闭原则还可以通过使用接口来实现这一点：\n\n![](img/image_rsrc1AE.jpg)\n\
  \n与其使用抽象类，我们现在有了 `ISalary` 接口。在这个接口中，有一个方法——`TotalSalaryCost`。在之前的示例中，派生类实现了 `ISalary`。在\
  \ `TotalSalaryCost` 类中，一切保持不变；唯一改变的是作为参数的 `cost`。结果是完全相同的，开闭原则再次得到了实现。这很棒，不是吗？\n\
  \n## 7.3 - 里氏可替换原则\n\n里氏可替换原则（LSP）规定，派生类必须能够完全替换它们的基类。这意味着，如果类 A 继承自类 B，那么 A 应该可以完全替换\
  \ B。该原则规定，所有子类都不应影响基类的角色。因此，派生类应该是完全可替换父类的。开发者应该确保子类在扩展父类时不改变其行为。让我们通过一个示例来演示：\n\
  \n![](img/image_rsrc1AF.jpg)\n\n在这个示例中，我们可以假设派生类的任何成员都不可能损害基类的行为。从派生类访问父类的 `Capacity`\
  \ 和 `IsAutomatic` 属性，每个成员都是合适的，且可能发生异常。如果我们在基类实现中添加一个虚方法，并在派生类中覆盖它，但这将抛出 `NotImplementedException()`。它看起来如下：\n\
  \n![](img/image_rsrc1AG.jpg)\n\n这种方式是显著错误的，逻辑如下：在基类 `Vehicle` 中，我们添加了一个带有核心实现的虚方法\
  \ `Type()`。在派生类中，我们没有实现该方法，而是在抛出了 `NotImplementedException()`。这在许多方面都是错误的，其中之一就是破坏了里氏可替换原则。这是因为，如果在\
  \ `Truck` 对象上调用 `Type()` 方法，它将抛出一个异常。因此，它无法替换父类 `Vehicle`。它损害了已实现的基类功能，而派生类的功能显然没有实现。结果是我们将得到一个异常，因为我们正尝试在\
  \ `Truck` 类对象的控制台上打印 `Type()`。另一个示例如下：\n\n![](img/image_rsrc1AH.jpg)\n\n在这个示例中，我们有一个被标记为抽象的基类\
  \ `Worker`。在这个父类中，有两个带有核心实现的虚方法。第一个方法返回工人当前正在工作的任务详情。第二个方法返回关于工人本身的信息。然后有两个类代表 `Worker`\
  \ 类的子类。其中一个是 `QAEngineer` 类。在 `QAEngineer` 类中，有基类方法的重写实现。它们都有正常的定义，所以这里一切看起来良好。另一个派生类是\
  \ `SoftwareDeveloper` 类。在这个类中，也有两个来自基类的重写方法。但在这里我们可以看到一个问题：`GetWorkerDetails()`\
  \ 方法没有实现；它抛出了 `Exception`。由于某些原因，软件开发者的详情可能无法预览。在 `Main` 方法中，对 `Worker` 类型对象的列表进行迭代。在每次迭代中，都会调用当前对象的\
  \ `GetWorkerDetails()` 方法。这对于编译器来说看起来很好，但实际上会发生什么？当 `SoftwareDeveloper` 对象进入迭代并调用\
  \ `GetWorkerDetails()` 方法时，将抛出异常。这不是我们希望发生的，所以我们必须使派生类完全可替换基类，而目前并非如此。这个示例违反了里氏可替换原则。所以，下一步解决方案是：引入两个接口组件，一个包含\
  \ `GetWorkerDetails()` 方法——例如 `IWorker` 接口，另一个包含 `GetTaskDetails()` 方法——`ITask`\
  \ 接口。为了实现里氏可替换原则，合适的类将实现零、一个或两个给定的接口。在这种情况下，`QAEngineer` 将被修改为实现两个接口，因为它需要实现这两个方法。`SoftwareDeveloper`\
  \ 类将只实现 `ITask` 接口，因为它只需要 `GetTaskDetails()` 方法。这种方式，里氏可替换原则得到了实现。\n\n## 7.4 - 接口隔离\n\
  \n接口隔离原则规定，实体不应被强制实现它们不使用的接口。可能，创建许多简单且小的接口比创建一个包含许多未使用方法的巨大接口要好得多。接口应该代表与其使用相关的实体。类不应该依赖于它们不使用的接口。类似于，接口应该具有特定的职责。当接口变得越来越大时，可能会包含所有实现者都需要的方法。接口隔离检测到了这个问题。正确的示例如下：\n\
  \n![](img/image_rsrc1AJ.jpg)\n\n在这个示例中，我们展示了接口隔离的正确方法。有两个接口：`ICacity` 和 `ISalary`。`ICacity`\
  \ 接口有一个只读属性 `Capacity`。`ISalary` 接口也包含只读属性 `Salary`。`Car` 类实现了 `ICacity`，因为它只需要\
  \ `Capacity`。`Truck` 类实现了 `ISalary`，因为它只需要 `Salary`。这种方式，接口隔离原则完全得到了实现。我们使用了最大潜力的接口。另一个示例如下：\n\
  \n![](img/image_rsrc1AK.jpg)\n\n在这个示例中，有一个接口 `IEmployee`，该接口包含两个方法——`CreateTask`\
  \ 和 `WorkOnDevelopment`。然后我们有 `Programmer` 类实现了上述接口。接口中的两个方法都有实现。现在一切看起来都完美了。之后，我们收到请求添加\
  \ `Tester` 类，因为测试员也是员工。好的，我们将创建一个 `Tester` 类并使其实现 `IEmployee` 接口。\n\n![](img/image_rsrc1AM.jpg)\n\
  \n看起来很好。`CreateTask()` 方法有了实现；`WorkOnDevelopment()` 方法会怎样？`Tester` 显然不应该处理开发任务，抛出了\
  \ `NotImplementedException`。然而，这没有遵循接口隔离原则。因此，我们必须将此逻辑拆分为两个接口组件并正确使用。如下：\n\n![](img/image_rsrc1AN.jpg)\n\
  \n太棒了！现在看起来。接口隔离原则现在实现了。我们能够将 `IEmployee` 分为两个更具体的接口。第一个是 `IProgrammer` 接口，它包含了\
  \ `IEmployee` 接口的所有方法。第二个是 `ITester` 接口，它只包含一个方法——`CreateTask`。它没有 `WorkOnDevelopment()`\
  \ 方法，因为 `Tester` 类不需要它。`Programmer` 类现在实现 `IEmployee` 接口，并将两个方法的完整实现。`Tester` 类将实现\
  \ `ITester` 接口，它只包含 `CreateTask()` 方法。这种方式，我们能够更好地组织接口的使用。任何类中都没有实现的方法。需要添加到 `Programmer`\
  \ 或 `Tester` 类的任何新方法都将找到正确的接口，且没有任何未使用。接口隔离原则在这个示例中完成。代码已准备好处理新功能，并且很容易修改行为。\n\n\
  ## 7.5 - 依赖倒置原则\n\n“高层模块不应该依赖于细节，而应该依赖于抽象。” 这句话代表了依赖倒置原则。这意味着，一切都应该以抽象特性进行开发以避免紧密耦合。高层组件通常实现系统的业务层，而低层组件负责详细过程。这里的关键是，必须保持高层和低层模块的松耦合。为了实现这一点，不应该让两个模块识别彼此的实现。模块的紧密耦合是指高层组件了解许多与其交互的组件。如果存在紧密耦合，存在一个模块或类的更改可能会破坏另一个模块或类逻辑的巨大风险。在\
  \ C# 编程语言中，有一种实现依赖倒置原则的技术，它被称为控制反转 (IoC)。控制反转可以通过抽象类或接口组件来实现。这种技术消除了类和模块之间的依赖。低层组件应该遵循单一接口的承诺，而高层组件应该使用实现特定接口的模块。让我们从示例开始：\n\
  \n![](img/image_rsrc1AP.jpg)\n![](img/image_rsrc1AR.jpg)\n\n在这个示例中，有一个接口 `IVehicle`。在该接口内部，有一个属性，即只读属性\
  \ `IsAutomatic`。该接口由两个类实现。第一个被称为 `Car` 类。`Car` 类实现了 `IVehicle` 并包含了接口中的 `IsAutomatic`\
  \ 属性。第二个被称为 `Truck` 类。`Truck` 类也实现了 `IVehicle` 并包含了接口中的 `IsAutomatic` 属性。这种方式，依赖倒置原则得到了实现。现在，让我们看看第二个示例：\n\
  \n![](img/image_rsrc1AS.jpg)\n![](img/image_rsrc1AT.jpg)\n\n在这个示例中，我们有一个接口 `IShape`，该接口包含了方法的依赖依赖于\
  \ `Draw()`。`ShapeManager` 类依赖于该接口。`Draw()` 和 `Stop()`。依赖注入 (DI) 是控制反转。\n\n\n\n\n\
  \n在 `packages` 文件夹中，包含了应用程序内部的外部库和其他源码，我们在某些功能上需要它们。这些包的示例包括 `Entity Framework`、依赖注入（Dependency\
  \ Injection）支持等。下面你可以看到文件夹结构。\n\n## 文件夹结构\n- **DataAccess**: DataAccess 文件夹，包含一个表示数据库上下文（database\
  \ context）内容的类。该文件夹是应用程序的数据层。在该文件夹中，将包含所有与数据库配置和管理相关的内容。\n- **Interfaces**: 下一个文件夹，我们将在这里存储应用程序的接口组件。这里只有一个接口组件\
  \ - `IVehicle` 接口。\n- **Objects**: 下一个文件夹。在这个文件夹中，包含了数据操作所需的实体类。你在这里可以看到三个类：`Car`、`Truck`\
  \ 和 `Vehicle` 类。\n- **ServiceInterfaces**: 下一个文件夹。这里我们有接口组件，负责服务对象的依赖注入。每个接口都将有一个实现它的类。\n\
  - **Services**: 最后一个文件夹。正如你可能已经注意到的，这些是实现上一个文件夹中接口的服务类。这些服务类将将用于依赖注入。\n- **Program.cs**:\
  \ 最后，有一个 `Program.cs` 文件，其中包含一个带有 `Main` 方法的 `Program` 类。正如我们目前所学的，在这个方法内部，所有内容将被整合在一起并确保精确运行。\n\
  \n现在，让我们将其拆解并逐部分解释。\n\n### Objects 文件夹逻辑\n![](img/image_rsrc1C2.jpg)!(image_rsrc1C3.jpg)\n\
  \n在类实现之前，我们插入了来自 `Interfaces` 文件夹中唯一接口组件的代码。该接口有两个只读属性，名称为 `IVehicle`。这两个属性别是布尔类型的\
  \ `IsAutomatic` 和字符串类型的 `Vin`。\n\n在接口组件下方，我们暴露了 `Objects` 文件夹内三个类的每个代码。\n\n####\
  \ Vehicle 类\n第一个类是 `Vehicle` 类。该类实现了 `IVehicle` 接口，这意味着它将拥有 `IVehicle` 中两个属性的实现。除了这两个属性外，它还包含一个\
  \ `int` 数据类型的 `Id` 属性。`IsAutomatic` 和 `Vin` 属性实现了 `protected set`，这意味着这些属性可以在父类和继承类内部进行值赋值。在属性定义之后，有一个\
  \ `Vehicle` 构造函数，它接收两个参数并将它们的值分别分配给 `IsAutomatic` 和 `Vin` 属性。\n\n#### Car 类\n下一个类是\
  \ `Car` 类。该类继承自 `Vehicle` 类 - 所以 `Vehicle` 类是 `Car` 类的父类。它可以访问 `Vehicle` 类的所有属性，并且它也有自己的属性。`Car`\
  \ 的属性是 `TrunkSpace` 只读属性。`Car` 自己的构造函数使用了三个参数，即为 `IsAutomatic` 属性、`Vin` 属性和 `TrunkSpace`\
  \ 属性的值。该构造函数将参数中的父类属性值传递给基构造函数。这意味着它在传递 `isAutomatic` 和 `vin` 参数值的情况下调用了基构造函数。\n\
  \n在自己的构造函数实现中，对 `trunkSpace` 参数值是否大于五百进行了检查。如果该条件为真，程序将抛出一个异常，信息为“Trunk space for\
  \ a car cannot exceed 500”。在条件检查下方，是 `TrunkSpace` 属性的经典属性初始状态赋值。\n\n#### Truck 类\n\
  最后一个类是 `Truck` 类，它也继承自 `Vehicle` 类。我们可以假设 `Truck` 和 `Car` 是 `Vehicle` 类的子类。它有一个名为\
  \ `BedSpace` 的只读属性。在 `Truck` 构造函数中，有与 `Car` 构造函数类似的操作。传递了三个参数，其中两个被传递给基类构造函数，即 `isAutomatic`\
  \ 和 `vin` 参数值。在自己的构造函数体中，有一个检查查看 `bedSpace` 参数值是否小于五百。同样，与 `Car` 类一样，如果该条件为真，程序将抛出一个异常，信息为“Trunk\
  \ space for a truck cannot be below 500”。之后，是 `BedSpace` 只读属性的通用属性状态赋值。\n\n### 数据层\
  \ (VehicleContext)\n接下来要解释的是 `DataLayer`，在此情况下，它代表 `VehicleContext` 类。让我们来看代码：![](img/image_rsrc1C4.jpg)!(image_rsrc1C5.jpg)\n\
  \n这是一个数据层类。`VehicleContext` 类扩展了来自 `Entity Framework` 包的 `DbContext` 类。在这个类中，我们可以看到公共构造函数。\n\
  1. 第一个是空构造函数，它在不分配任何初始状态的情况下创建 `VehicleContext` 的实例。\n2. 第二个构造函数接收一个 `DbContextOptions<VehicleContext>`\
  \ 对象的参数。此构造函数也没有自己的实现。尽管如此，它将 `DbContextOptions` 对象传递给 `DbContext` 类中的基构造函数，以便为上下文分配选项。此构造函数强制\
  \ `Entity Framework` 执行上下文初始化而不是由我们执行。\n\n构造函数之后，有三个 `DbSet` 属性。每一个都代表数据库中的表内容。第一个将是\
  \ `Vehicle` 数据库集，第二个和第三个是它的子类 `Car` 和 `Truck` 数据库集。\n\n然后，是 `DbContext` 类的标准重写方法\
  \ `OnConfiguring`。在这里我们只是检查 `DbContextBuilder` 是否配置。如果没有配置，我们将抛出一个信息为“Must pass\
  \ optionsBuilder in for use”的异常。\n\n该类的最后一点是对 `OnModelCreating` 方法的重写。此方法为模型属性设置流式配置，并在需要时添加额外的绑定和逻辑。此方法接收一个参数，该参数是一个\
  \ `ModelBuilder` 类对象，负责管理实体的流式配置。在这个重写实现中，对 `Car` 和 `Truck` 模型对象的每个属性执行了 `ValueGeneratedNever()`\
  \ 方法。这意味着当保存实体实例时，这些属性的每一个永远不会由数据库生成值。在执行此操作后，调用了基类的 `OnModelCreating` 方法以配置通用流式数据库工作。以上是关于我们汽车经销商应用程序数据层类的全部。\n\
