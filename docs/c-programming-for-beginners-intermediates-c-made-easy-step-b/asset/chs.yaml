  \n### C# 数据类型\n在编程中，我们使用数据类型来指定特定变量中可以存储的数据类型。我们已经遇到过各种数据类型，如整数、双精度浮点数和浮。在 C# 中，我们有三种主要的数据类型：\n\
  \n1. 值类型\n2. 引用类型\n3. 指针类型\n\n让我们详细查看一下这些类型。\n\n## 1: 值类型\n值数据类型是整数和浮点数指令，由于它们包含直接数据，因此可以直接赋值。它们包括\
  \ `int`、`char`、`double`、`floats` (float)。值类型派生自 C# 编译器库中可直接使用的 `System.ValueType`\
  \ 类。\n\n如前所述，一旦在创建变量时指定了数据类型，就会分配内存来存储该大小和类型的值。值类型可以细分为更多类型，例如：\n* 预定义值类型\n* 用户定义值类型\n\
  \n下表显示了 C# 语言提供的最常见的预定义值类型![](img/Image00010.jpg) ![](img/Image00011.jpg)\n\n在 C#\
  \ 中，你可以使用大小操作符返回变量所占的精确字节数。下面是一个显示指定数据类型字节大小的程序![](img/Image00012.jpg)\n上述程序的给定结果如下：![](img/Image00013.jpg)\n\
  \n**注意**：上述代码中的大小单位是字节。\n\n上述代码中的大小是字节。用户定义的值类型是根据需要创建的，以确保数据的灵活性。用户定义的值类型包括：\n\n\
  * **结构 (Structures)**：C# 中的结构是用户定义的值类型，类似于类。结构包含直接相关的数据。在 C# 中，结构可以被拆分。下图展示了结构的用法![](img/Image00014.jpg)\n\
  * **常量 (Constants)**：常量是不可改变的类型。在 C# 中，使用 `const` 关键字声明常量。例如 `const double pi =\
  \ 3.14159;`。下面的程序显示了常量的类型和字节大小![](img/Image0015.jpg)\n**注意**：常量的值是固定的。用户定义的常量是代码的灵活性![](img/Image0016.jpg)\n\
  * **枚举 (Enumerations)**：枚举用于表示一组相关的值。下图显示了枚举的用法![](img/Image0017.jpg)\n\n## 2: 引用类型\n\
  我们使用引用类型来引用数据类型。它们不包含直接数据，而是通过引用来工作。引用类型包括：\n\n* **字符串 (String)**：我们使用 `String`\
  \ 类型来创建文本。在 C# 中，字符串是引用类型。你可以使用 `Object` 来处理它们。下图显示了字符串的类型![](img/Image0018.jpg)\n\
  * **对象 (Object)**：对象是所有类型的基类。在 C# 中，你可以将其转换为任何类型![](img/Image0019.jpg)\n* **动态类型\
  \ (Dynamic)**：动态类型在 C# 引入后出现。可以使用 `dynamic` 关键字来声明类型。下面的代码显示了动态类型的用法![](img/Image0020.jpg)[](Image0021.jpg)\n\
  \n## 3: 指针类型\n指针数据类型在 C# 中作为定位符。在 C# 中，指针可以处理内存。下图显示了指针的用法![](img/Image0022.jpg)\n\
  声明指针的通用语法如下：\n\n```\ntype* identifier;\n```\n**注意**：指针在不安全（unsafe）上下文中工作。在本节中，我们涵盖了这些类型。处理数据类型时，理解这一点非常重要。\n\
  \n\n\n\n\n| `ToUInt64` | 将指定的类型转换为无符号大整数 |\n\n既然已经涵盖了 C# 类型转换，现在通过尝试将各种数据类型转换为其他数据类型并查看是否适用来进行练习。\n\
  \n### C# 运算符\n\n在编程中，`Operators`指的是符号或特殊字符，它们帮助计算机程序对给定的变量执行特定操作。作为一种健壮且高效的编程语言，C#\
  \ 包含了多种运算符。它们包括：\n\n- 算术运算符\n- 逻辑运算符\n- 关系运算符\n- 赋值运算符\n- 一元运算符\n- 位运算符\n- 三元运算符\n\
  - 杂项运算符\n\n在本节中，我们将逐部分探索这些运算符。让我们开始吧。\n\n## 1: 算术运算符\n\n我们使用`Arithmetic`算术运算符对支持的数据类型执行数学运算。下表显示了支持的算术运算符。在此示例中，取\
  \ `x = 100` 和 `y = 200`。\n\n| 运算符符号 | 操作/描述 | 示例操作 |\n| :--- | :--- | :--- |\n|\
  \ `+` | 加法 – 将两个值相加得到单个输出 | `X + Y = 300` |\n| `-` | 减法 – 返回第一个值减去第二个值的差 | `X –\
  \ Y = -100`, `Y – X = 100` |\n| `*` | 乘法 – 返回两个操作数的乘积 | `X * Y = 20000` |\n| `/`\
  \ | 除法 – 返回两个指定操作数的商 | `Y / X = 2` |\n| `%` | 取模 – 返回除法运算的数 | `Y % X = 0` |\n| `++`\
  \ | 递增 – 将变量的值加 1 | `X++ = 101`, `Y++ = 201` |\n| `--` | 递减 – 将给定变量的值减 1 | `X--\
  \ = 99`, `Y-- = 199` |\n\n![](img/Image00024.jpg)\n\n## 2: 逻辑运算符\n\n我们使用`Logical`逻辑运算符对给定的变量执行逻辑比较。逻辑运算符的结果是\
  \ `Boolean` 类型，即 `true` 或 `false`。下表显示了 C# 支持的逻辑运算符。\n\n| 运算符符号 | 操作/描述 | 示例操作 |\n\
  | :--- | :--- | :--- |\n| `&&` | 逻辑与 – 当两个值都非零或两个表达式都为真时，结果为真 | `True && True =\
  \ True`, `False && True = False`, `False && False = False` |\n| `||` | 逻辑或 – 如果任一操作数非零或任一表达式为真，则结果为真。反之亦然\
  \ | `True || False = True`, `True || True = True`, `False || False = False` |\n\
  | `!` | 逻辑非 – 返回初始逻辑状态的反转 | `!(True && True) = False`, `!(False && False) = True`,\
  \ `!(True || False) = False` |\n\n![](img/Image00025.jpg)\n\n## 3: 关系运算符\n\n我们使用`Relational`关系运算符对数值执行关系运算。见下表所示的\
  \ C# 支持的关系运算符：取 `x = 100` 和 `y = 200`。\n\n| 运算符符号 | 操作/描述 | 示例操作 |\n| :--- | :---\
  \ | :--- |\n| `==` | 等于 = 如果给定的操作数/表达式相等则返回 true，否则返回 false | `X == y = false` |\n\
  | `!=` | 不等于 – 如果给定的操作数/表达式不相等则返回 true，相等则返回 false | `X != Y = true` |\n| `>` |\
  \ 大于 – 如果左侧操作数/表达式大于右侧操作数/表达式，则返回 true。否则 false | `X > Y = false` |\n| `<` | 小于\
  \ – 如果左侧操作数/表达式小于右侧操作数/表达式，则返回 true。否则 false | `X < Y = true` |\n| `>=` | 大于等于 –\
  \ 如果左侧操作数/表达式大于或等于右侧表达式/操作数，则返回 true | `X >= Y = false` |\n| `<=` | 小于等于 – 如果左侧操作数/表达式小于或等于右侧操作数/表达式，则返回\
  \ True | `X <= Y = true` |\n\n## 4: 赋值运算符\n\n我们使用赋值运算符将右侧操作数的值赋值给左侧操作数。这些操作数可以是原始数据、变量、索引器或属性。赋值给左侧操作数的值相当于该特定表达式的结果。\n\
  \n**注意**：右侧操作数的类型必须与左侧操作数及相应的操作兼容。下表显示了支持的 C# 赋值运算符。\n\n| 运算符符号 | 操作/描述 | 示例操作 |\n\
  | :--- | :--- | :--- |\n| `=` | 简单赋值 – 将右侧的值赋值给左侧操作数 | `x = a + b` |\n| `+=` | 加法赋值\
  \ – 将右侧的值加到左侧操作数，并将结果赋值给左侧操作数 | `a += b` 等于 `a = a + b` |\n| `-=` | 减法赋值 – 从左侧操作数中减去右侧操作数，并将结果赋值给左侧操作数\
  \ | `a -= b` 等于 `a = a - b` |\n| `*=` | 乘法赋值 – 将右侧操作数与左侧操作数相乘，并将结果赋值给左侧操作数 | `a\
  \ *= b` 等于 `a = a * b` |\n| `/=` | 除法赋值 – 将左侧操作数除以右侧操作数，并将结果赋值给左侧操作数 | `a /= b`\
  \ 等于 `a = a / b` |\n| `%=` | 取模赋值 – 将左侧操作数对右侧操作数取模，并将结果赋值给左侧操作数 | `a %= b` 等于 `a\
  \ = a % b` |\n| `<<=` | 左移 – 将表达式中的位向左平移指定的位数，并将结果赋值给左侧操作数 | `a <<= b` 等于 `a = a\
  \ << b` |\n| `>>=` | 右移 – 将表达式中的位向右平移指定的位数，并将结果赋值给左侧操作数 | `a >>= b` 等于 `a = a >>\
  \ b` |\n| `&=` | 位与赋值 – 对第一个操作数与第二个操作数进行位与运算并将结果赋值给左侧操作数 | `a &= b` 等于 `a = a &\
  \ b` |\n| `^=` | 位异或赋值 – 对第一个操作数与第二个操作数进行位异或运算并将结果赋值给左侧操作数 | `a ^= b` 等于 `a = a\
  \ ^ b` |\n| `|=` | 位或赋值 – 使用位或运算处理第一个操作数与第二个操作数并将结果赋值给左侧操作数 | `a |= b` 等于 `a = a\
  \ | b` |\n\n**注意**：本书未涵盖开头提到的位移位运算符，因为这需要位运算知识。\n\n## 5: 优先级\n\n运算符优先级指的是执行运算符的顺序。C#\
  \ 和许多其他编程语言需要优先级来确定在存在多个运算符时应该先执行哪一个操作。\n\n示例：取表达式 `7 + 3 * 10 - 16 / 8 + 100`。该表达式可能有不同的结果。如果你在\
  \ C# 中输入该表达式，结果将是 `135`。这是因为优先级更高的运算符先执行。(Image00027.jpg)\n\n下表按类别显示 C# 运算符优先级。\n\
  \n| 运算符类别 | 包含的运算符 | 结合性 |\n| :--- | :--- | :--- |\n| 后置 | `()` `[]` `->` `.` `++`\
  \ `--` | 从左到右 |\n| 一元 | `+` `-` `!` `~` `++` `--` `sizeof` `&(type)*` | 从右到左 |\n\
  | 乘法 | `%` `/` `*` | 从右到左 |\n| 加法 | `+` `-` | 从左到右 |\n| 移位 | `>>` `<<` | 从右到左 |\n\
  | 关系 | `<` `<=` `>` `>=` | 从左到右 |\n| Equality | `==` `!=` | 从左到右 |\n| 位与 | `&` |\
  \ 从左到右 |\n| 位异或 | `^` | 从左到右 |\n| 位或 | `|` | 从左到右 |\n| 逻辑或 | `&&` | 从左到右 |\n| 逻辑与\
  \ | `||` | 从左到右 |\n| 条件运算符 | `?:` | 从右到左 |\n| 赋值 | `=` `+=` `-=` `*=` `/=` `%=`\
  \ `>>=` `<<=` `&=` `^=` `|=` | 从右到左 |\n\n\n\n\n在本节中，我们学习了 C# 编程语言的构建模块。我们讨论了基础 C#\
  \ 程序的基本结构，以及 C# 中每个概念之间是如何相互关联的。尝试创建你自己的简单程序，以便你更好地理解上述概念。\n\n# 第 4 节 C# 控制流操作\n\
  \n在本节中，我们将讨论 C# 编程语言的另一个重要概念。我们将介绍控制流操作，这些操作可以帮助我们根据某些条件控制 `Program` 的执行方式。要精通 C#，你需要理解变量和数据类型——这些在上一节中已经讨论过。\n\
  \n## C# 中的决策\n\nC# 以及大多数编程语言中的决策允许程序员指定一个要在 `Program` 中测试的特定条件。一旦条件通过测试，`Program`\
  \ 将根据条件的结果执行任务。测试条件的结果为真或假，当其中任一条件为真或假时，将执行不同的任务。\n\nC# 在决策中使用以下以下语句：\n- `If` 语句\n\
  - `If…else` 语句\n- `If…else if…else` 语句\n- 嵌套 `if` 语句\n- `Switch` 语句\n- 嵌套 `switch`\
  \ 语句\n\n### 1: C# if 语句\n\n这是最基本的条件测试语句，当测试条件为真时会执行某项操作。其基本语法如下：\n\n```csharp\n\
  if (condition) {\n    //执行此操作\n}\n```\n\n下面是一个说明 if 语句结构的 C# 程序。在上面的代码中，变量 `a` 的值为\
  \ 200。在第二部分中，我们正在测试 `200 mod 2 == 0`。由于 200 可以被 2 整除且没有余数，因此条件为真，屏幕上打印“Number is\
  \ even”（数字是偶数）。如果你将 `a` 的值改为 101 或另一个奇数，条件 `a % 2 == 0` 将返回假，不执行任何代码。\n\n### 2:\
  \ C# if…else 语句\n\n另一个决策语句是 `if..else` 语句。`if else` 语句与 `if` 语句类似，具有在条件为真时执行操作的能力。其通用语法如下：\n\
  \n```csharp\nif (condition) {\n    // 如果为真则执行此操作\n} else {\n    // 如果为假则执行此操作\n\
  }\n```\n\n让我们修改上面的 `Program`，当提供的数字不是偶数时执行一项操作。\n\n### 3: if…else if…else 语句\n\n\
  这是一种非常常见的决策语句类型，用于测试多个条件。例如，我们可以测试数字是否为偶数。如果是偶数，则打印“Even number”（偶数）；如果是奇数，则打印除法的余数；如果不是，则打印“Invalid\
  \ number”（无效数字）。查看下方的 `Program`。\n\n### 4: 嵌套 if…else if…else 语句\n\n我们使用嵌套（Nested）语句通过单个或相邻条件来检查多个条件。例如，你可以创建一个评分系统，根据分数打印\
  \ `Grade`（等级）：\n- 大于等于 80 – “A”\n- 大于等于 70 – “B”\n- 大于等于 50 – “C”\n- 小于 50 – “D”\n\
  \n### 5: Switch 语句\n\n我们使用 `switch` 语句根据单个条件执行操作。它与嵌套的 `if…else if` 语句非常相似。Switch\
  \ 语句在传递要测试的条件时使用 `case` 关键字。通用语法所示所示：\n\n```csharp\nswitch (expression) {\n    case\
  \ <condition>:\n        // 执行操作；\n        break;\n    case <condition 2>:\n    \
  \    // 执行操作；\n        break;\n    case <condition 3>:\n        // 执行操作\n      \
  \  break;\n    ...\n    default:\n        // 如果所有情况均为假，则执行操作；\n        break;\n\
  }\n```\n\n`case` 语句中的每个条件都会被测试，直到其中一个求值为为真为止。如果两个条件都不匹配，则执行 `default` 条件。\n\n**注意：**\
  \ 每个 `case` 语句都必须以 `break` 语句结束，以便在条件返回真时跳出循环。\n\n### 6: 嵌套 Switch 语句\n\n你可以在一个\
  \ `switch` 语句内部嵌套另一个。也可以在 `if` 语句内部嵌套 `switch` 语句，反之亦然。在嵌套 `switch` 和 `if` 语句的情况下，请确保结束循环，否则\
  \ `Program` 将无限运行。\n\n### C# 循环\n\n在编程中，当我们多次执行一段代码块时，我们会使用循环（Loops）。循环允许程序员在给定条件为真时按顺序执行一组代码。与大多数编程语言一样，C#\
  \ 允许我们在程序中使用循环。C# 有两种主要的循环语句和两种次要的循环语句。它们包括：\n- `For` 循环\n- `While` 循环\n- `do…while`\
  \ 循环\n- 嵌套循环\n\n### 1: For 循环\n\n`for` 循环是一种用于按特定次数执行特定条件的语句。C# 的 `for` 循环语句与 C\
  \ 和 C++ 非常相似。`for` 循环的语法如下：\n\n```csharp\nfor (initialization; condition; loop_counter)\
  \ {\n    // 条件语句\n}\n```\n\n第一步 `initialization`（初始化）初始化循环，包括循环控制变量的声明和初始化。第二步 `condition`（条件）设置循环将用于评估执行哪些代码的条件。如果条件为真，则执行大括号内的代码。否则，执行另一个操作。第三步是\
  \ `loop_counter`（循环计数）。我们使用 `loop_counter` 在每次迭代时更新条件。`loop_counter` 利用一元运算符进行循环更新。\n\
  \n以下是 `for` 循环工作的原理：\n1. `initialization` 步骤只运行一次。\n2. 评估 `condition`，如果为真则执行循环体。\n\
  3. 循环跳回 `loop_counter` 并更新 `loop condition` 然后再次运行。\n4. 重复此过程，直到 `condition` 变为假并循环退出。\n\
  \n\n\n\n下面的程序展示了如何使用 `for` 循环打印 40 到 50 之间的前 10 个数字![](img/Image00033.jpg)执行后，上述程序将显示如下结果：![](img/Image00034.jpg)当循环次数已知时，`for`\
  \ 循环非常高效。如果没有，建议使用 `while` 循环。\n\n## 2: while 循环\n我们使用 `while` 循环在条件为真时持续执行特定代码。编写\
  \ C# `while` 循环的语法为：\n\n```csharp\nwhile (condition) {\n    // 持续执行此代码\n    // 循环计数器\n\
  }\n```\n\n与 `for` 循环不同，`while` 循环可能一次都不执行。如果条件自动变为假，它将跳过循环体。下面是一个演示 `while` 循环的\
  \ C# 程序。(Image00035.jpg)输出与 `for` 循环相似。如果你将条件改为小于 40 的数字，循环体将永远不会执行，因为条件始终为 40。\n\
  \n## 3: do…while 循环\n我们已经看到，在之前的两个循环中，条件是在循环体之前检查的。在 `do…while` 循环中，条件是在循环体结束后检查的。这确保了即使条件永远为假，循环体至少执行一次。`do…while`\
  \ 循环的语法为：\n\n```csharp\ndo {\n    // 循环体\n} while (condition);\n```\n\n注意，条件一直延伸到最后，因此确保了即使条件为假，循环也会在退出之前运行一次。另一方面，如果条件为真，循环将继续运行并使用循环计数器更新，直到其评估结果为假为止。下面的程序展示了如何使用\
  \ `do…while` 循环打印 40 到 50 之间的前 10 个数字。(Image00036.jpg)我们将条件改为等于或小于 40 的值，程序将运行一次并打印\
  \ `a` 的值。\n\n## 4: 嵌套循环\n与大多数编程语言一样，C# 允许我们在其他循环内部创建循环。嵌套循环可以是 `for` 循环内部的 `for`\
  \ 循环、`for` 循环内部的 `while` 循环、`do while` 循环和 `for` 循环等。然而，在使用多个循环时，要保持谨慎，以确保它们不会干扰程序逻辑。\n\
  \n在 `while` 循环内部编写 `while` 循环的语法为：\n\n```csharp\nwhile (condition) {\n    while\
  \ (condition) {\n        // 代码\n    }\n    // 代码\n}\n```\n\n嵌套 `for` 循环可以写为：\n\n\
  ```csharp\nfor (initialization; condition; counter) {\n    for (initialization;\
  \ condition; counter) {\n        // 代码;\n    }\n    // 代码\n}\n```\n\n与其他循环一样，我们也可以在\
  \ `do while` 循环内部编写 `do…while` 循环，如下：\n\n```csharp\ndo {\n    // 代码\n    do {\n\
  \        // 代码\n    } while (condition);\n} while (condition);\n```\n\n## 5: C#\
  \ 循环控制\nC# 具有循环控制语句，允许我们从正常执行流之外改变循环的执行。以下是 C# 中可循环控制语句。\n\n1.  `break` 语句\n2. \
  \ `continue` 语句\n\n### 1: C# Break 语句\n我们在循环中使用 `break` 关键字跳出当前循环范围。如果在内部循环中遇到 `break`\
  \ 关键字，它只会终止内部循环并将执行传递给其上一个前置循环。它也被用于之前讨论过的 `switch` 语句。下面的程序展示了在 `a` 的值更新到 45 之后的\
  \ `break` 语句。(Image00037.jpg)\n\n### 2: C# Continue 语句\n`Continue` 语句与 `break` 语句相似，但不是强制终止循环，而是通过跳过中间的代码来强制循环继续迭代。`while`\
  \ 和 `do…while` 循环中的 `Continue` 语句强制循环控制移动到条件测试。在 `for` 循环中，`continue` 语句强制执行条件判断和循环计数器。(Image00038.jpg)\n\
  \n## 6: C# 无限循环\n无限循环主要由于代码引起，但有时是有意创建的以消耗计算机的处理器能力。我们通过留空循环计数器创建无限循环，使条件始终为真并永远运行循环。下面是一个永远不会停止的\
  \ `for` 循环。(Image00039.jpg)\n如你所见，即使没有 `Console.ReadKey()` 函数，程序也不会关闭，因为它从未停止执行。\n\
  \n**注意**：某些 IDE（如 IntelliJ Rider）会注意到无限循环并向你警告或自动停止它。\n\n我们已经完成了控制流部分。循环起初可能很难掌握，但一旦你掌握了它们，它们就能解决很多问题。每天练习这些概念。寻找解决方案并修复它们。这是学习的唯一途径。尽管可能需要一些时间。\n\
  \n# 章节 5: C# 方法\n在编程中，方法指的是用于执行特定任务的具有相关逻辑的代码块。在 C++ 等语言中它们被称为函数，在 Java 等语言中被称为方法。每个\
  \ C# 程序必须包含至少一个方法，即 `Main`。在多次使用某段代码的情况下，方法非常有用。在本节中，我们将介绍如何使用 C# 创建自己的方法。\n在 C#\
  \ 中使用方法之前，你需要执行以下步骤：\n\n1.  定义方法\n2.  调用方法\n\n### 方法定义\n这是使用方法的第一步。它包含了有效 C# 方法的结构。有效\
  \ C# 方法由以下部分组成：\n\n*   **访问修饰符**：我们使用访问修饰符来指定如何访问方法，例如 `public`、`private`、`protected`、`internal`\
  \ 等。\n*   **返回值**：返回值定义了方法返回的数据类型，如整数、字符串和 `void`。\n*   **函数名**：通常用于调用方法的唯一名称。\n\
  *   **参数**：我们在方法调用期间可以传递的参数。\n*   **方法体**：这是执行方法任务所需的逻辑。\n\n有效 C# 方法的语法为：\n\n```csharp\n\
  <访问修饰符> <返回值> <方法名> (参数) {\n    // 方法体\n    // 如果可用的返回值\n}\n```\n\n我们已经在之前的程序中见过方法，例如\
  \ `main` 方法。(Image00040.jpg)\n让我们来看一个计算圆面积方法的示例程序。(Image0041.jpg)\n\n### 方法调用\n\
  声明方法后，你只需要通过调用方法名并传递必要的参数来使用方法。如果你未能传递方法所需的参数，程序执行过程将无法完成。例如，调用 `AreaOfCircle` 方法时，我们如下所示传递半径。(Image0042.jpg)\n\
  在上面的程序中，我们在调用方法时传递了圆的半径。事实上，我们在 C# 开发人员的 `WriteLine` 方法内部传递了 `AreaOfCircle` 方法。这意味着如果参数匹配，我们可以在方法内部传递方法。\n\
  \n\n\n\n\n# 1: 值传递\n参数按值传递是函数调用过程中传递参数的默认机制。该机制涉及为每个所需的参数创建存储空间，从而将实际参数拷贝到这些位置。该程序通过使用\
  \ `swap` 方法说明了这一机制。(Image00043.jpg) 一旦上述程序编译完成，将显示如下输出。(Image00044.jpg) 这意味着尽管函数内部的值发生了变化，但值本身并没有发生变化。\n\
  \n# 2: 引用传递\n参数引用传递涉及传递实际变量内存地址。与按值传递不同，引用传递方法不会为变量创建新的存储位置。在 C# 中，我们使用 `ref` 关键字声明引用参数。下面的程序显示了引用传递方法调用的用法。(Image00045.jpg)\
  \ 一旦上述代码编译完成，输出将显示：Image00046.jpg) 这表明变量的值在 `swap` 方法内部进行了交换，从而反映在 `Main` 方法中。\n\
  \n# 3: 输出传递\n正如我们所看到的，我们使用 `return` 关键字从方法返回一个值。使用输出参数（output parameters），我们可以从函数返回两个值。输出传递的工作原理与引用传递类似，不同之处它们是将数据传递到方法而不是进入方法。由于这种方法对初学者来说可能有些，你可以在这里找到更多信息。[https://docs.microsoft.com/en-us/dotnet/csharp/language-reference/keywords/out-parameter-modifier]\n\
  \n我们已经完成了方法（Methods）部分。我们已经涵盖了方法创建、方法调用和参数传递等主题。通过实践掌握这些概念的最佳方法。例如，如果你创建了一个程序，尝试将你的代码添加到另一个方法中并仅在主方法中调用它。这将帮助你理解并熟悉方法。\n\
  \n# 第 6 ：C# 数组\n在本节中，我们将介绍另一个重要的概念或数据结构。与大多数编程语言一样，C# 允许我们创建并操作数组。让我们来看看数组是什么以及它们是如何工作的。\n\
  \n我们可以将数组归类为一组共享内存位置的相关数据。我们使用数组来存储相同类型的固定大小顺序数据组。你可以将数组视为容器，用于在连续位置上存储相同类型的变量，其中最低位置地址存储第一个元素，最高地址存储最后一个元素。\n\
  \n例如，如果我们想存储 100 个数字，我们可以使用基本方法——创建名为 `number0`、`number1`、`number2`……`number100`\
  \ 的变量。然而，这非常麻烦且消耗大量内存。另一种方法是创建一个包含 100 个元素的数组并通过索引访问每个元素。让我们看看如何这样做。\n\n### C# 数组的类型\n\
  在进入代码之前，最好注意 C# 具有某些类型的数组。它们包括：\n- 单维数组\n- 多维数组\n- 锯齿数组（Jagged Arrays）\n- 参数数组（Param\
  \ Arrays）\n\n为了简单起见，我们只涵盖单维数组。\n\n### 数组声明\n在 C# 中声明数组时，我们遵循以下语法：\n```\ndatatype[]\
  \ array_name;\n```\n- 我们使用数据类型来定义在数组中存储什么类型的数据。\n- 在方括号 `[]` 中 —— 数组的秩或大小。它指定了数组中将存储多少元素。\n\
  - `array_name` —— 指定标识数组的唯一名称。始终使用具有创意且有意义的。\n\n例如，你可以使用以下数组分别存储整数、双精度或字符值：\n```\n\
  int[] myIntegers;\ndouble[] myValues;\nchar[] myChars;\n```\n注意：一旦声明了数组，将不会为其创建内存位置。\n\
  \n### 数组初始化\n如前所述，数组声明并不分配内存。我们需要通过创建数组的实例来初始化数组。由于数组是引用类型，在 C# 中，我们使用 `new` 关键字创建数组的实例。数组初始化的语法为：\n\
  ```\ndatatype[] arrayName = new datatype[size];\n```\n例如：\n```\nint[] myIntegers\
  \ = new int[100];\ndouble[] myValues = new double[100];\nchar[] myChars = new char[26];\n\
  ```\n\n## 赋值与索引\n一旦声明了数组并完成了初始化，我们就可以使用索引向数组分配值。数组索引从零开始——这意味着如果我们有这样的数组：\n```\n\
  double[] myArray = new double[10]\n```\n数组中的第一个数字位于索引零，而数组中的最后一个元素是 `arrayLength\
  \ – 1`。\n赋值时我们使用以下语法：\n```\narrayName[index] = value;\n```\n例如：Image00047.jpg) 一旦你为数组索引分配了值，就可以简单地通过其索引来使用它。\n\
  注意：与 Python 等编程语言不同，如果你调用 `Console.WriteLine(myArray)`，将打印数组的类型——在这种情况下，为 `System.Double`。\n\
  \n### 数组迭代 – Foreach\n我们可以使用 `for` 循环或 `foreach` 循环访问所有数组元素。由于我们已经涵盖了 `for` 循环，我们将查看\
  \ `foreach` 语句 Image00048.jpg) 一旦上述代码编译完成，它将打印数组索引中的每个元素。由于 `for` 循环更新数组，数组索引不会重复超过一次。下面的输出所示：Image0049.jpg)\
  \ 在本节中，我们涵盖了数组和数组操作。我们还没有涵盖多维数组，因为如果你没有掌握单维数组，它们可能会令人混乱。在转向其他内容之前，确保掌握单维数组的操作。\n\
  \n# 第 7：C# 字符串与字符串操作\n在指南之前的章节中，我们一直使用字符串字符串。然而，处理字符串的最佳方法是声明字符串变量并将所需的字符串存储其中。这允许进行字符串操作。注意：字符串在\
  \ C# 中是 `System.String` 的别名，我们使用它们存储一系列字符。\n\n### 如何创建 C# 字符串对象\n在 C# 中，我们可以使用各种方法创建字符串。我们已经处理了其中一些方法。它们包括：\n\
  - 创建字符串变量并存储字符串字面量\n- 使用字符串拼接运算符\n- 使用 `String` 类\n- 返回字符串的方法调用\n- 使用格式化方法将值或对象转换为相应的字符串表示。\n\
  \n注意：我们不会逐一讨论上述方法；相反，我们将使用一个编写的程序来说明它们是如何工作的 Image0050.jpg) 一旦上述程序编译完成，将显示如下输出 Image0051.jpg)\n\
  \n### 字符串属性\nC# 字符串类具有以下属性：\n- `Length` —— 我们使用 `length` 属性获取指定 `String` 类中字符的数量。\n\
  - `Chars` —— 我们使用此属性获取字符串对象指定位置的字符。\n\n### 字符串方法\n我们有许多与字符串对象兼容的方法，允许编程人员对字符串执行各种操作。这些方法非常多，我们可能无法涵盖所有的。\n\
  \n1. `Compare`: 我们使用 `compare` 方法比较两个字符串并返回一个整数值，以指定根据顺序排序的相对位置。该方法的语法为：\n\n```\n\
  String.Compare(string1, string2, ignoreCase = true/false);\n```\n你可能会遇到允许其他参数的方法，例如\
  \ `IgnoreCase`，它在设置为 `true` 时会忽略大小写。\n\n\n\n\n\n### 2. Concat\n我们使用此方法连接两个或多个字符串对象以生成一个字符串。该方法的语法为：\n\
  \n```\nString.Concat(string1, string2, stringN)\n```\n\n### 3. Contains\n我们使用此方法返回一个布尔值，用指示定义的字符串对象是否出现在字符串中。该方法的语法为：\n\
  \n```\nString.Contain(value)\n```\n\n### 4. Copy\n我们使用此方法通过创建一个与指定字符串具有相同值的新字符串对象来拷贝定义的字符串。其语法为：\n\
  \n```\nString.Copy(string)\n```\n\n### 5. CopyTo\n我们使用此方法将 `String` 对象中特定位置的指定数量字符复制到\
  \ Unicode 字符数组的特定位置。其语法为：\n\n```\nString.CopyTo(int SourceIndex, char[] target,\
  \ int targetIndex, int count)\n```\n\n### 6. ToLower\n使用时，该方法返回将指定字符串转换为小写的字符串副本。\n\
  \n### 7. ToUpper\n该方法返回将指定字符串转换为大写的字符串。\n\n### 8. StartsWith\n我们使用此方法确定字符串实例的开头是否匹配指定的字符串字面量。\n\
  \n### 9. EndsWith\n该方法确定字符串实例的结尾是否匹配指定的字符串字面量。\n\n### 10. Equals\n如果指定的字符串匹配当前字符串对象，则返回一个布尔值。\n\
  \n### 11. IndexOf\n我们使用此方法返回指定字符在字符串对象中从 0 开始的索引——指定的字符必须是 Unicode 格式。`IndexOf`\
  \ 方法有许多变体，每个变体都有不同的参数。\n\n### 12. IsNullEmpty\n如果指定的字符串对象为 null 或为空，则返回一个布尔值。\n\n\
  ### 13. Join\n我们使用此方法使用指定的分隔符在每个元素之间连接字符串数组中的所有元素。\n\n### 14. Remove\n在现有字符串对象的指定索引位置删除指定数量的运算符（字符）。\n\
  \n**注意：** 本指南未涵盖许多字符串方法。请查看 C# 文档获取更多信息。\n\n## 第 8 节：封装\n\n在编程中，封装（Encapsulation）是指将一个或多个项封装在逻辑包中的过程。封装是面向对象编程中一种非常重要的方法论。它允许或拒绝通过用户定义对\
  \ `Program` 中项实现细节进行访问。\n\n我们在之前的节中简要讨论了封装的元素。在本节中，我们将更详细地介绍它。\n\n抽象（Abstraction）和封装是面向对象编程的两个方面。抽象允许\
  \ `Program` 中项的可见，而封装允许程序员实现代码中项的可见性级别或抽象级别。\n\n我们通过使用访问修饰符（见之前的章节）来实现封装。我们使用访问修饰符来定义\
  \ `class` 中成员的可见性和范围。类可以是用户定义的也可以是预构建的类。以下是 C# 支持的访问修饰符。\n\n1. `Public`\n2. `Private`\n\
  3. `Protected`\n4. `Internal`\n5. `Internal protected`\n\n\n\n\n\n# 公共访问修符 (Public)\n\
  我们使用 `public` 访问修符允许类将其所有成员——例如变量和函数——暴露给其他类的其他函数和对象。这使得定义类的其他类可以访问并修改这些元素。只有当其他函数可以更改类的成员时，你才应该使用\
  \ `public` 访问修符。\n\n下面的程序——用于计算圆的面积——说明了这一点。![](img/Image00052.jpg)\n\n在上面的程序中，我们将\
  \ `Circle` 类的变量声明为 `public`，因此可以在 `Main()` 方法中访问。我们通过调用名为 `Circle` 的圆类实例来实现这一点。类中的\
  \ `returnArea` 和 `displayArea` 等方法也可以在不使用类任何实例的情况下访问变量。请注意，`circle` 类内部的两个函数的声明为\
  \ `public`，因此可以在 `main` 方法中通过该类的实例来访问它们。\n\n## 私有访问修符 (Private)\n我们使用 `private`\
  \ 访问修符来隐藏或限制类成员对声明类之外的函数和方法的访问。这意味着与变量在同一类中的函数可以访问它们。类的实例没有权限访问变量。![](img/Image00053.jpg)\n\
  \n当上述代码编译时，其输出应如下：![](img/Image00054.jpg)\n\n在上面的程序中，我们将成员 `radius` 和 `PI` 声明为 `private`，因此在\
  \ `Main()` 方法内部无法访问，因为它们不在同一个类中。然而，`getRadius()`、`returnArea()` 和 `displayArea()`\
  \ 方法可以变量，因为它们在同一个类中。由于它们的声明为 `public`，因此可以使用类的实例在 `Main()` 方法中访问。\n\n## 保护访问修符 (Protected)\n\
  `protected` 访问修符允许子类访问基类的成员变量和方法。这有助于实现继承和多态。\n\n## 内部访问修符 (Internal)\n我们使用 `internal`\
  \ 访问修符允许类将其成员变量和方法暴露给应用程序中的其他方法和对象。这意味着具有 `internal` 访问权限的成员可以从我们定义的应用程序中的任何类或方法访问。\n\
  \n**注意**: 如果没有定义类成员的访问修符，默认访问修符是 `private`。例如，如果你没有定义类 `displayArea()` 的访问修符，它就是\
  \ `private`。\n\n## 保护内部访问修符 (Protected Internal)\n我们使用 `protected internal` 访问修符将当前程序集（assembly）内的子类之外的其他类隐藏类成员。\n\
  \n# 第 9 节：C# 类与对象\n我们已经提了一段时间的类，但还没有涵盖它们是什么或它们如何工作。在本节中，我们将涵盖类，并以一种让你了解它们如何工作的方式对其进行讨论。\n\
  \n在编程中，`Classes`（类）是对象或数据类型的蓝图。类不定义任何数据，但我们使用它们来定义类的对象包含什么以及对象相应的操作。对象是类的实例。例如，一个汽车的蓝图（在这种情况下为一个类）可能包含名称、制造年份、制造商、速度、颜色等。它还可能包括\
  \ `ignite`（点火）、`brake`（刹车）、`accelerate`（加速）、`repair`（维修）等操作。让我们看看如何声明和初始化类。\n\n\
  ### 类定义\n在 C# 中创建类以关键字 `class` 开始，后跟跟类名和用于包含类体的大括号。要为类包含访问修符，请在 `class` 关键字之前包含它：以下是类定义的语法。\n\
  \n```csharp\npublic class <class name> {\n    // variables\n    <access modifier>\
  \ <data type> <variable name>\n    // methods\n    <access modifier> <return type>\
  \ <method name>\n    {\n        // method body\n    }\n}\n```\n\n以下是关于类和类成员需要注意的最重要点：\n\
  - 我们使用 `Data types`（数据类型）表示变量的类型\n- 我们使用 `Return type`（返回值类型）表示方法返回值的类型\n- 我们使用关键字\
  \ `new` 创建类的实例\n- 我们在类的实例上使用点 (`.`) 运算符来访问类的成员\n- `access modifier`（访问修符）规定了类及其成员的访问规则。如果你未能定义它，类的默认访问修符为\
  \ `internal`，而其成员被设为 `private`。\n\n## 构造构造函数 (Constructors)\n构造函数是一种特殊的方法，在创建类的实例时由该类执行。构造函数的名称与其基类相同，但不包含返回值。默认情况下，构造函数没有参数，但参数化构造函数接受支持的参数。参数化构造函数有助于在创建期间为类的实例分配初始值。(Image00055.jpg)\n\
  \n### 析构函数 (Destructors)\n析构函数也是类的特殊方法。然而，它们在相应类的实例超出范围时执行。析构函数的名称与其基类相同，但在名称前有一个波浪号\
  \ `~`。像构造函数一样，它们没有返回值但不能带有参数。它们不能被继承或重载。析构函数在程序退出之前释放内存非常高效。(Image00056.jpg)\n\n\
  ### 静态类成员 (Static Class Members)\n我们还可以将类成员定义为 `static`。一旦你将成员定义为 `static`，这意味着无论创建多少个类实例，只有一个静态成员副本可用。我们可以在成员函数之外或类定义内部初始化\
  \ `Static` 值。我们通常使用具有常量值的 `Static` 成员，因为你可以通过调用类来检索它们。\n\n**注意**: 你可以将方法声明为 `static`，它们可以访问静态变量。\n\
  \n# 第 10 节：C# 继承与多态\n继承和多态是面向对象编程中最重要的概念之一。这些概念有助于代码重用和实现。在本节中，我们将理解如何在 C# 中使用这些概念。\n\
  \n### 继承 (Inheritance)\n程序员使用继承根据其他类来定义/创建类。假设你有一个包含你正要创建类的类的。与其为每个类创建新成员，不如选择继承现有类的成员。新类成为我们所知的派生类，而现有类是基类。例如，梅赛斯是汽车，因此马赫是梅赛斯，因此马赫是汽车。这个概念我们称为\
  \ IS-A 关系。\n\n同样重要的是，你可以从多个类派生一个类，因此它可以从多个类继承成员变量和方法。继承的语法为：\n\n```csharp\n<access\
  \ modifier> <class name> <base class name> {\n    // body\n}\n<class name> <derived\
  \ class name> : <base class name> {\n}\n```\n![](img/Image00057.jpg)\n\n一旦上述代码编译，输出应如下所示：Image00058.jpg\n\
  \n**注意**: 派生类继承基类的所有成员，因此你应该在创建派生类之前创建基类。\n\n### C# 中的多重继承\nC# 不直接支持多重继承。为了实现这一点，我们必须使用接口（interfaces）。下面的程序——用于计算矩形表面涂漆的价格——展示了这一概念的实现。Image00059.jpg!Image00060.jpg\n\
  \n### 多态 (Polymorphism)\n面向对象编程有三个核心概念：封装、继承和多态。我们已经涵盖了前两个。在本节中，我们将涵盖最后一个——多态。多态指的是元素存在多种形式。在编程中，多态意味着一个超类型的变量引用子类型对象。它的主要表现形式是一个“继承，多个函数”。多态存在两种状态：\n\
  \n\n\n\n\n# 静态多态\n在静态多态中，方法的响应是在编译期间确定的。我们称早期绑定或静态绑定。C# 的静态多态有两种状态：\n\n## 1. 运算符重载\n\
  运算符重载是指创建用户定义的类似运算符的函数。重载运算符是带有 `operator` 关键字且在函数名后跟随运算符定义符号的函数。像任何其他函数一样，它们包含返回值和参数。下面是一个说明运算符重载的程序部分。\n\
  \n![](img/Image00061.jpg)\n\n## 2. 函数重载\n函数重载是指在同一作用域内具有相同名称两个或多个函数的概念。然而，这些方法必须在类型和参数数量上有所区别。\n\
  \n## 3. 动态多态\n动态多态的确定发生在运行时。动态多态利用了 C# 创建 `abstract` 类和 `virtual` 虚函数的能力。`abstract`\
  \ 类提供了接口的部分类操作，在派生类继承它时完成实现。`abstract` 类的方法也是 `abstract` 的，并且仅供派生类应用。`abstract`\
  \ 类的不能实例化，也不能在抽象类之外声明方法。\n\n`virtual` 虚函数位于你想要实现的派生类中。由于 `virtual` 函数的调用是在运行时确定的，你可以在不同的派生类上以不同的方式应用它们。\n\
  \n# 第 11 节接口\n在编程中，`Interfaces` 是继承类与接口之间的逻辑契约。继承类包含了契约的“如何做”部分，而接口定义了契约的“是什么”部分。我们可以使用\
  \ `Interfaces` 来定义作为接口成员的方法、事件、属性，且它们只能包含这些成员的声明。继承类处理这些成员的定义。当仅由基类声明了少数方法，且继承类实现相同的功能时，`abstract`\
  \ 类可以起到相同的作用。\n\n### 接口声明\n在 C# 中，我们使用 `interface` 关键字后跟接口名称来进行接口声明。接口声明与类声明相似，并且默认是公共的。下面的代码是一个接口声明示例：\n\
  \n```csharp\npublic interface circle{\n    // members\n    double radius;\n    const\
  \ double PI = 3.14159;\n}\n```\n\n# 第 12 节 C# 错误处理\n错误处理是一个非常重要的概念，它允许程序员在错误发生之前预判并处理程序中的错误。我们也称之为异常处理。与大多数编程语言一样，C#\
  \ 允许程序员处理程序中的错误。让我们简要介绍这些概念。\n\n`Exceptions` 允许程序员将执行控制权从程序的某部分转移到另一部分。我们使用三个主要的关键字利用异常或错误处理。程序中发生的错误就是“异常”。\n\
  \n- `try` – 包含你尝试运行的代码块，以检查其在有或无错误的情况下是否运行\n- `catch` – 这是 `try` 语句之前的语句。它包含处理由\
  \ `try` 语句触发的错误的代码块。它表示捕获并处理错误。\n- `throw` – 用于在程序中一旦错误出现就抛出错误。\n- `finally` – 包含无论是否发生错误都会执行的代码块。例如，在打开文件时，无论是否发生错误都必须关闭它。\n\
  \n这些关键字每一个包含一个在条件为真时运行的代码块。如果 `try` 块产生错误，方法将使用 `try` 和 `catch` 块处理错误。`try` 和 `catch`\
  \ 关键字内部的代码是运行所说的保护代码。异常处理的通用语法为：\n\n```csharp\ntry {\n    // try this code\n}\n\
  catch (ErrorName e1) {\n    // perform this code\n}\ncatch (ErrorName e2) {\n  \
  \  // perform this code\n}\ncatch (ErrorName eN) {\n    // perform this code\n}\n\
  throw (e1, e2…eN) {\n    // throw an error\n}\nfinally {\n    // 无论如何都执行此块\n}\n\
  ```\n**注意：** 你可以创建多的 `catch` 块来处理不同类型的错误。\n\n### 异常类\nC# 中的错误处理异常发生在各自的类中。这些类直接或间接地派自主\
  \ `System.Exception` 类，其中包含 `System.ApplicationException` 和 `System.SystemException`。\n\
  \n`System.ApplicationException` 支持应用程序产生的所有错误，因此程序员从这个基类派生他们的异常。对于基于系统的异常，它们来自 `System.SystemException`\
  \ 类。以下是派自 `System.SystemException` 基类的一些常见预定义异常：\n\n- `System.IO.IOException` –\
  \ 用于处理所有输入/输出错误。\n- `Syste.StackOverflowException` – 用于处理所有由栈溢出产生的错误。\n- `System.DivideByZeroException`\
  \ – 用于处理除零引起的错误。\n- `System.InvalidCastException` – 用于处理类型转换过程中产生的错误。\n- `System.NullReferenceException`\
  \ – 用于处理空对象引用期间发生的错误。\n- `System.OutOfMemeoryException` – 处理因可用内存不足产生的错误。\n- `System.ArrayTypeMismatchException`\
  \ – 用于处理类型与数组类型不兼容产生的错误。\n- `System.IndexOutOfRangeException` – 处理方法引用超出数组范围索引时产生的错误。\n\
  \n# 第 13 节文件输入/输出操作\n在本节中，我们将涵盖 C# 中的文件输入和输出。文件是存储在计算机中具有特定名称的数据集合。对于计算机中存储的每个文件，我们可以使用绝对路径来访问它。流是打开读取和写入的文件。流是通过系统通信路径的字节流。数据流主要有两种类型：\n\
  \n- `Input stream` – 从文件读取数据\n- `Output stream` – 将数据写入文件\n\n\n\n\n\n这两种流有助于文件的读取和写入。\n\
  \n### C# 中的输入/输出类\n\nC# 拥有各种类用于执行文件操作，如创建文件、删除文件、读写文件以及关闭文件。`System.IO` 命名空间通常维护这些类。`System.IO`\
  \ 下常用的文件 I/O 类包括：\n\n- `File`: 帮助进行文件操作。\n- `Path`: 用于对路径信息操作。\n- `Directory`: 用于目录结构操作。\n\
  - `FileInfo`: 用于对文件执行支持的操作。\n- `DirectoryInfo`: 对目录执行操作。\n- `BinaryReader`: 用于从二进制流中读取原始数据。\n\
  - `BinaryWriter`: 用于以二进制格式写入原始数据。\n- `DriveInfo`: 用于获取存储驱动器的信息。\n- `StreamReader`:\
  \ 用于在字节流中读取原始字符。\n- `StreamWriter`: 用于在字节流中写入原始字符。\n- `StringReader`: 用于从字符串缓冲区中读取。\n\
  - `StringWriter`: 用于向字符串缓冲区中写入。\n- `MemoryStream`: 用于对存储在内存中的流数据进行随机数据访问。\n- `BufferedStream`:\
  \ 用于字节流的临时存储。\n\n### FileStream 类操作\n\n我们在执行读取、写入和关闭文件等文件操作时，使用 `System.IO` 命名空间中的\
  \ `FileStream` 类。它来自 C# 中的抽象类 `Stream`。\n\n要使用 `FileStream` 类，必须通过创建新文件或打开现有文件来创建类的实例。我们使用以下语法来创建\
  \ `FileStream` 类实例。\n\n```\nFilestream <object instance name> = new Filestream(<filename>\
  \ <Filemode.Enumerator>, <Fileaccess enumerator, <Fileshare enumerator>);\n```\n\
  \n例如，下面的代码用于读取文件 `file.txt`：\n\n```c\nFileStream F = new FileStream(\"file.txt\"\
  , FileMode.Open, FileAccess.Read, FileShare.Read);\n```\n\n以下是对象实例参数的值：\n- `File\
  \ mode` 参数值\n- `File Access` 参数值\n- `File share` 参数值\n\n## 1: FileMode 参数值\n\n我们通常使用\
  \ `FileMode` 参数或枚举来定义打开指定文件的方法。这些方法包括：\n\n1. `Create`: 用于创建指定名称的新文件。\n2. `Open`:\
  \ 用于打开指定名称的现有文件；你应该提供文件的 `Full path`。\n3. `Append`: 用于打开给定名称的现有文件并将光标移动到文件末尾。如果指定的文件不存在，它也会创建一个新文件。\n\
  4. `Truncate`: 用于打开文件并将文件大小截断为零字节。\n5. `CreateNew`: 指定当前操作系统创建一个新文件。\n\n## 2: FileAccess\
  \ 参数值\n\n我们使用 `FileAccess` 参数来指定文件的访问模式。该参数的属性有：\n\n1. `Read`: 以只读模式打开文件。\n2. `ReadWrite`:\
  \ 以读/写模式打开文件。\n3. `Write`: 以写模式打开文件。\n\n## 3: FileShare 参数值\n\n`FileShare` 参数包含以下方法：\n\
  \n1. `Read`: 用于打开文件进行读取。\n2. `Write`: 用于打开文件进行写入。\n3. `ReadWrite`: 用于打开文件的读写。\n\
  4. `Inheritable`: 用于允许从文件句柄传递继承到子进程。\n5. `None`: 用于拒绝共享文件。\n\n下面的程序显示了 `FileStream`\
  \ 类的用法。\n![](img/Image00062.jpg)\n\n# 逐步控制台计算器\n\n在这一节中，我们将创建一个简单的控制台计算器，允许用户对数字执行各种操作。`Program`\
