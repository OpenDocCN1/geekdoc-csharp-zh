    String.Copy(string)

    ```


    ### 5. CopyTo

    我们使用此方法将 `String` 对象中特定位置的指定数量字符复制到 Unicode 字符数组的特定位置。其语法为：


    ```

    String.CopyTo(int SourceIndex, char[] target, int targetIndex, int count)

    ```


    ### 6. ToLower

    使用时，该方法返回将指定字符串转换为小写的字符串副本。


    ### 7. ToUpper

    该方法返回将指定字符串转换为大写的字符串。


    ### 8. StartsWith

    我们使用此方法确定字符串实例的开头是否匹配指定的字符串字面量。


    ### 9. EndsWith

    该方法确定字符串实例的结尾是否匹配指定的字符串字面量。


    ### 10. Equals

    如果指定的字符串匹配当前字符串对象，则返回一个布尔值。


