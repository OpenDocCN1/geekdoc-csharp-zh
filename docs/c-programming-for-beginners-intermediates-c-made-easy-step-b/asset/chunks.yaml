  trans: "\n在本节中，我们学习了 C# 编程语言的构建模块。我们讨论了基础 C# 程序的基本结构，以及 C# 中每个概念之间是如何相互关联的。尝试创建你自己的简单程序，以便你更好地理解上述概念。\n\
    \n# 第 4 节 C# 控制流操作\n\n在本节中，我们将讨论 C# 编程语言的另一个重要概念。我们将介绍控制流操作，这些操作可以帮助我们根据某些条件控制\
    \ `Program` 的执行方式。要精通 C#，你需要理解变量和数据类型——这些在上一节中已经讨论过。\n\n## C# 中的决策\n\nC# 以及大多数编程语言中的决策允许程序员指定一个要在\
    \ `Program` 中测试的特定条件。一旦条件通过测试，`Program` 将根据条件的结果执行任务。测试条件的结果为真或假，当其中任一条件为真或假时，将执行不同的任务。\n\
    \nC# 在决策中使用以下以下语句：\n- `If` 语句\n- `If…else` 语句\n- `If…else if…else` 语句\n- 嵌套 `if`\
    \ 语句\n- `Switch` 语句\n- 嵌套 `switch` 语句\n\n### 1: C# if 语句\n\n这是最基本的条件测试语句，当测试条件为真时会执行某项操作。其基本语法如下：\n\
    \n```csharp\nif (condition) {\n    //执行此操作\n}\n```\n\n下面是一个说明 if 语句结构的 C# 程序。在上面的代码中，变量\
    \ `a` 的值为 200。在第二部分中，我们正在测试 `200 mod 2 == 0`。由于 200 可以被 2 整除且没有余数，因此条件为真，屏幕上打印“Number\
    \ is even”（数字是偶数）。如果你将 `a` 的值改为 101 或另一个奇数，条件 `a % 2 == 0` 将返回假，不执行任何代码。\n\n###\
    \ 2: C# if…else 语句\n\n另一个决策语句是 `if..else` 语句。`if else` 语句与 `if` 语句类似，具有在条件为真时执行操作的能力。其通用语法如下：\n\
    \n```csharp\nif (condition) {\n    // 如果为真则执行此操作\n} else {\n    // 如果为假则执行此操作\n\
    }\n```\n\n让我们修改上面的 `Program`，当提供的数字不是偶数时执行一项操作。\n\n### 3: if…else if…else 语句\n\
    \n这是一种非常常见的决策语句类型，用于测试多个条件。例如，我们可以测试数字是否为偶数。如果是偶数，则打印“Even number”（偶数）；如果是奇数，则打印除法的余数；如果不是，则打印“Invalid\
    \ number”（无效数字）。查看下方的 `Program`。\n\n### 4: 嵌套 if…else if…else 语句\n\n我们使用嵌套（Nested）语句通过单个或相邻条件来检查多个条件。例如，你可以创建一个评分系统，根据分数打印\
    \ `Grade`（等级）：\n- 大于等于 80 – “A”\n- 大于等于 70 – “B”\n- 大于等于 50 – “C”\n- 小于 50 – “D”\n\
    \n### 5: Switch 语句\n\n我们使用 `switch` 语句根据单个条件执行操作。它与嵌套的 `if…else if` 语句非常相似。Switch\
    \ 语句在传递要测试的条件时使用 `case` 关键字。通用语法所示所示：\n\n```csharp\nswitch (expression) {\n  \
    \  case <condition>:\n        // 执行操作；\n        break;\n    case <condition 2>:\n\
    \        // 执行操作；\n        break;\n    case <condition 3>:\n        // 执行操作\n\
    \        break;\n    ...\n    default:\n        // 如果所有情况均为假，则执行操作；\n        break;\n\
    }\n```\n\n`case` 语句中的每个条件都会被测试，直到其中一个求值为为真为止。如果两个条件都不匹配，则执行 `default` 条件。\n\n\
    **注意：** 每个 `case` 语句都必须以 `break` 语句结束，以便在条件返回真时跳出循环。\n\n### 6: 嵌套 Switch 语句\n\n\
    你可以在一个 `switch` 语句内部嵌套另一个。也可以在 `if` 语句内部嵌套 `switch` 语句，反之亦然。在嵌套 `switch` 和 `if`\
    \ 语句的情况下，请确保结束循环，否则 `Program` 将无限运行。\n\n# C# 循环\n\n在编程中，当我们多次执行一段代码块时，我们会使用循环（Loops）。循环允许程序员在给定条件为真时按顺序执行一组代码。与大多数编程语言一样，C#\
    \ 允许我们在程序中使用循环。C# 有两种主要的循环语句和两种次要的循环语句。它们包括：\n- `For` 循环\n- `While` 循环\n- `do…while`\
    \ 循环\n- 嵌套循环\n\n### 1: For 循环\n\n`for` 循环是一种用于按特定次数执行特定条件的语句。C# 的 `for` 循环语句与\
    \ C 和 C++ 非常相似。`for` 循环的语法如下：\n\n```csharp\nfor (initialization; condition; loop_counter)\
    \ {\n    // 条件语句\n}\n```\n\n第一步 `initialization`（初始化）初始化循环，包括循环控制变量的声明和初始化。第二步\
    \ `condition`（条件）设置循环将用于评估执行哪些代码的条件。如果条件为真，则执行大括号内的代码。否则，执行另一个操作。第三步是 `loop_counter`（循环计数）。我们使用\
    \ `loop_counter` 在每次迭代时更新条件。`loop_counter` 利用一元运算符进行循环更新。\n\n以下是 `for` 循环工作的原理：\n\
    1. `initialization` 步骤只运行一次。\n2. 评估 `condition`，如果为真则执行循环体。\n3. 循环跳回 `loop_counter`\
    \ 并更新 `loop condition` 然后再次运行。\n4. 重复此过程，直到 `condition` 变为假并循环退出。\n"
- fmt: "\nThe program below shows how to use a `for` loop to print the first 10 numbers\
    \ between 40 and 50.![](Image00033.jpg)On execution, the Program above displays\
    \ the following result:![](Image00034.jpg)The `for` loop is very efficient when\
    \ the number of iterations of the loop is known. If not, it is recommended to\
    \ use the `while` loop.\n\n## 2: The while loop\nWe use the `while` loop to continually\
    \ execute a specific code as long as the condition is true. The syntax for writing\
    \ a C# `while` loop is:\n\n```csharp\nwhile (condition) {\n    // execute this\
    \ code continually;\n    // loop_counter;\n}\n```\n\nUnlike the `for` loop, `while`\
    \ loop might not execute even once. If the condition automatically executes as\
    \ false, it skips the loop body. Below is a C# program illustrating the `while`\
    \ loop.![](Image00035.jpg)The output is similar to the `for` loop. If you change\
    \ the condition to a number less than 40, the loop body will never execute since\
    \ the condition is always 40.\n\n## 3: The do…while loop\nWe have already seen\
    \ that in the two already covered loops, the condition is checked before the loop\
    \ body. In the case of a `do…while` loop, the condition is checked at the end\
    \ of the loop body. This ensures that the loop body is executed at least once\
    \ even if the condition is never true. The syntax for the `do…while` loop is:\n\
    \n```csharp\ndo {\n    // loop body;\n} while (condition);\n```\n\nNotice that\
    \ the condition is all the way down after the condition, thus ensuring that the\
    \ loop will run once before exiting if the condition is false. On the other hand,\
    \ if the condition is true, the loop will keep running and updating using the\
    \ loop counter until it evaluates to false. The Program below shows printing the\
    \ first 10 numbers between 40 and 50 using a `do…while` loop.![](Image00036.jpg)If\
    \ we change the condition to a value equal to or less than 40, the Program will\
    \ run once and print the value of `a`.\n\n## 4: Nested Loops\nLike most programming\
    \ languages, C# allows us to create loops inside other loops. Nested loops can\
    \ be a `for` loop inside a `for` loop, a `while` loop inside a `for` loop, `do\
    \ while` loop and `for` loop, etc. However, when using multiple loops, adhere\
    \ to caution to ensure they do not interfere with the program logic.\n\nThe syntax\
    \ for writing a `while` loop inside a `while` is:\n\n```csharp\nwhile (condition)\
    \ {\n    while (condition) {\n        // code\n    }\n    // code\n}\n```\n\n\
    Nested `for` loop can be written as:\n\n```csharp\nfor (initialization; condition;\
    \ counter) {\n    for (initialization; condition; counter) {\n        // code;\n\
    \    }\n    // code\n}\n```\n\nLike other loops, we can also write a `do…while`\
    \ loop inside a `do while` loop as shown:\n\n```csharp\ndo {\n    // code\n  \
    \  do {\n        // code\n    } while (condition);\n} while (condition);\n```\n\
    \n## 5: C# Loop Control\nC# has loop control statements that allow us to alter\
    \ the execution of a loop out of its normal execution flow. The following are\
    \ the loop control statements available in C#.\n\n1.  `break` statement\n2.  `continue`\
    \ statement\n\n### 1: C# Break statement\nWe use the `break` keyword in a loop\
    \ to break out of the current loop scope. If a `break` keyword is encountered\
    \ in an inner loop, it only terminates the inner loop and passes the execution\
    \ to its upper preceding loop. It is also used in the `switch` statement – discussed\
    \ earlier.\nThe Program below shows the `break` statement after the value of `a`\
    \ is updated up to 45.![](Image00037.jpg)\n\n### 2: C# Continue Statement\nThe\
    \ `Continue` statement is similar to the `break` statement, but instead of forcing\
    \ the loop to terminate, it forces the loop to continue the iteration by forcing\
    \ it to skip the code in between. `Continue` statement in a `while` and `do…while`\
    \ loop forces the loop control to move on to the conditional testing. In a `for`\
    \ loop, the `continue` statement forces the conditional and loop counter to execute.![](Image00038.jpg)\n\
    \n## 6: C# Infinite Loops\nInfinite loops mainly occur because of code but are\
    \ sometimes created intentionally to consume a computer’s processing power. We\
    \ create Infinite loops by leaving the loop counter empty, making the condition\
    \ always true and run the loop forever. Below is a `for` loop that never terminates.![](Image00039.jpg)\n\
    As you can see, even without the `Console.ReadKey()` function, the Program does\
    \ not close as it never stops executing.\n\n**NOTE**: Some IDEs such as IntelliJ\
    \ Rider will notice an infinite loop and warn you or automatically stop it.\n\n\
    We have completed the control flow section. Loops can be very hard to grasp at\
    \ first but once you master them, they solve a lot of problems. Practice these\
    \ concepts on a daily basis. Find solutions and fix them. That is the only way\
    \ to learn. It may take some time, though.\n\n# Section 5: C# Methods\nIn programming,\
    \ a method refers to a block of code with related logic used to perform a specific\
    \ task. They are called functions in languages such as C++ and methods in languages\
    \ such as Java. Every C# Program must contain at least one method called `Main`.\
    \ Methods are very useful in cases where you need to use one piece of code more\
    \ than once. This makes the code remain clean, which in turn helps in debugging\
    \ and improves efficiency.\nIn this section, we are going to cover how to use\
    \ C# to create our own methods/functions.\nBefore you can use a method in C#,\
    \ you need to undertake the following steps:\n\n1.  Define the method\n2.  Call\
    \ the method\n\n## Method Definition\nThis is the first step to using methods.\
    \ It includes using the correct structure of a valid C# method. The following\
    \ parts make up a valid C# method:\n\n*   **Access Modifier**: We use Access modifiers\
    \ to specify how the method will be accessed in the Program—for example, `public`,\
    \ `private`, `protected`, `internal`, etc.\n*   **Return type**: The return types\
    \ define the data type the method will return such as integers, strings, and `void`.\n\
    *   **A function name**: This is usually a unique name used to call the method.\n\
    *   **Parameters**: Parameters are arguments that we can pass during the method/function\
    \ call.\n*   **The method body**: This is the logic of the method needed to perform\
    \ the task of the method.\n\nThe syntax for writing a valid C# method is:\n\n\
    ```csharp\n<Access modifier> <return type> <method name> (parameters) {\n    //\
    \ body\n    // return value if available\n}\n```\n\nWe have already seen a method\
    \ such as the `main` method in the previous programs.![](Image00040.jpg)\nLet\
    \ us look at an example program with a method to calculate the area of a circle.![](Image0041.jpg)\n\
    \n## Method Call\nAfter method declaration, you can use the method by simply calling\
    \ the method name and then passing the necessary arguments. If you fail to pass\
    \ the arguments required by the method, the program execution process will not\
    \ complete. For example, to call the method `AreaOfCircle`, we pass the radius\
    \ as the arguments as shown below.![](Image0042.jpg)\nIn the above Program, we\
    \ passed the radius of the circle when calling the method. In fact, we passed,\
    \ the method `AreaOfCircle` inside the `WriteLine` method developed by C# developers.\
    \ This means you can pass methods inside methods if the parameters match.\n\n\
    ## Recursive Method Call\nRecursive method call is a concept where a method calls\
    \ itself. Unlike a method call from another method, Recursive method call needs\
    \ to be terminated using a termination condition. This helps to prevent the method\
    \ from calling itself endlessly.\n\n## C# Parameter Passing\nMethods with parameters\
    \ require those parameters to be passed during the function call. There are three\
    \ ways to pass a parameter during a function call. They include:\n\n1.  Parameter\
    \ passing by value\n2.  Parameter passing by reference\n3.  Parameter passing\
    \ by output\n"
