    # 1. 命名空间 (Namespace)

    # 2. 类 (Class)

    # 3. 类方法 (Class methods)

    # 4. 主方法 (Main Method)

    # 5. 表达式 (Expressions)


    要在 Microsoft Visual Studio 中运行代码，请选择菜单栏中的绿色按钮。一旦上述 `Program` 完成编译，控制窗口将显示“Hello
    World”。让我们来看看上述 `Program` 的特性。


    - **Using System**: 这通常是基础 C# 程序的第一部分。我们使用关键字 `using` 在包含的 `Program` 中引入 `System`
    命名空间。对于 Java 程序员来说，这可以理解 `import` 包或 `#include <header_file>`。较大的程序可能包含多个 `using`
    语句。

    - `Program` 的第二行包含 `namespace` 关键字或声明，它包含了一个类集合。在上面的 `Program` 中，命名空间 `HelloWorld`
    包含一个名为 `Program` 的 `class` —— 它默认以包含源代码的文件名命名。

    - 代码的下一行包含 `class` 声明。`class` 包含了 `Program` 的方法和数据定义。它还包含了多个用于定义指定 `class` 行为的方法。上面的
    `HelloWorld` `Program` 包含一个名为 `Main` 的方法。

    - 接下来是 `Main` 方法声明。主方法是所有用 C# 编写的程序的入口。如所述，我们使用方法来定义方法的功能，因此充当类的动词。在这种情况下，我们使用该方法在控制台中打印文本
    Hello World。如果你熟悉 Java，主方法看起来像这样：

    ```java

    public static void main(String[] args) {​ System.out.println(“Hello world”);}

    ```

    如你所见，C# 从 Java 和 C++ 中借鉴了很多。

    - 最后一行代码是 `Console.WriteLine()` - 这行代码是 `main` 方法广播的动作，从而打印 `WriteLine()` 函数内部的文本。


    **注意**：对于之前的示例，我们使用了 Jetbrains Rider，因此该代码在 Visual studio 中可能没有其他可用代码。你可能会遇到 `Console.ReadKey()`，它会导致
    `Program` 在关闭之前等待按键，从而防止 `Program` 立即执行并关闭。


    C# 基础结构与关键字

    与大多数现代高级编程语言一样，C# 拥有你在编程时必须遵守的限制和规则。这些限制大部分类似于其祖先 —— Java 和 C++，但略有不同。以下是关于 C#
    程序需要注意的一些关键点。


    - C# 程序必须包含一个 `main` 方法。

    - C# 程序的执行从 `Main` 方法开始。

    - 与 Java 不同，`class` 名称可以与包含源代码的文件名不同而不会引起任何错误。

    - C# 是大小敏感的，因此，后面的‘Class’和‘class’是两个不同的单词。

    - 你必须用分号 `;` 终止所有 C# 语句。


    这些是 C# 编程中最基础且最重要的规则。与其他编程语言一样，C# 也有特定的关键字。在这种情况下（大多数编程语言如此），关键字是 C# 编译器保留并使用的单词，因此你不能直接将它们作为标识符。


    在编程中，标识符是用于标识变量、类、方法和其他数据结构的唯一单词 —— 我们将在后面的章节中详细讨论这些。


    C# 编译器保留了以下关键字供其使用 不同的 IDE 和文本编辑器通常以不同的颜色显示它们。然而，你可以通过在单词开头添加 `@` 符号来使用某些关键字。我们不建议这种做法。


    **注意**：在 C# 中，某些关键字在编写代码的上下文中可能有特殊含义。我们称这些为上下文关键字。以下是最常用的 C# 关键字表。


    | void | explicit | break | using | decimal | continue | join |

    | abstract | extern | else | enum | try | add | into |

    | foreach | bool | sealed | case | event | unchecked | Gloab |

    | interface | class | checked | for | out | base | group |

    | as | ulong | do | if | sbyte | uint | |

    | char | this | internal | in | randonly | alias | |

    | while | public | operator | null | float | sizeof | |

    | throw | stackalloc | int | in | namespace | ascending | |

    | lock | private | unsafe | switch | struct | descending | |

    | goto | true | long | false | set | from | |

    | protected | const | out | ref | select | volatile | |

    | implicit | new | finally | static | remove | dynaic | |

    | ushort | object | override | typeof | delegate | get | |

    | short | fixed | is | Virtual | orderby | let | |

    | double | return | string | Params | partial | byte | |


    ## C# 中的注释

    与大多数编程语言一样，C# 允许我们使用注释。编译器忽略注释并利用它们来记录代码以备以后使用。注释非常重要，因为如果其他程序员也在处理代码，你可以使用它们来引用和解释代码。你可以创建两种格式的注释：


    1. **单行注释**：我们在行末尾使用两个正斜杠 `//` 创建单行注释。

    2. **多行注释**：我们使用多行注释将注释连续扩展到多行。我们使用单个反斜杠和星号创建它们，并使用星号和反斜杠（`/* ... */`）关闭。


    **注意**：通过注释记录你的 C# 代码始终是一种良好的习惯。


    ## C# 变量

    在 C# 编程和大多数编程语言中，变量指的是用于存储特定类型数据的容器。赋予变量的名称也称为变量名，用于引用存储变量的内存位置。


    在 C# 中，每个定义的变量都有其特定的类型，用于确定变量可以存储的布局和大小。它还用于定义可以在定义的变量上执行的操作类型。C# 有 5 种主要的变量类型，如下表所示：


    | C# 变量类型 | 类型示例 |

    | :--- | :--- |

    | 进制类型 | decimal |

    | 布尔类型 | 根据赋值的 True 或 false |

    | 整数类型 | Int, byte, ulong, long, char, sbyte, short, ushort, uint, char |

    | 浮点型 | Double and floats |

    | 可空类型 | Nullable types |


    ### 变量定义

    在 C# 中声明变量的通用语法为：

    `<variable_type> <variable_name>;`

    其中 `variable_type` 可以是任何有效的变量类型，`variable_name` 是任何有效的名称。


    示例：

    `int age, price;`

    `double currency;`

    `char index;`

    `float my_float;`


    在上述示例中，`age`、`price`、`currency`、`index` 和 `my_float` 代表程序员创建的变量名，而 `int`、`double`、`char`
    和 `float` 代表 C# 编译器定义的数据类型。


    ### 变量初始化

    你可以通过赋值有效的表达式或值来初始化变量。在 C# 中，我们使用单个等号 `=` 进行变量初始化。变量初始化的通用语法为：

    `<variable_type> <variable_name> = expression or value;`


    示例：

    ```csharp

    int age = 10; // 值

    double currency = 122.69; // 值

    float pi = 3.14159; // 值

    char index = ''A''; // 值

    area = 21 * 21 * 3.14159; // 表达式

    ```

    **注意**：初始化值是一种良好的编程习惯，否则程序可能会产生意外结果。


    ### 变量命名规则

    在 C# 和大多数编程语言命名变量时，必须遵守多种规则。这些规则确保在声明变量时不发生错误。规则如下：


    1. 变量名只能包含字母、数字和下划线。

    2. 除了下划线和 `@` 符号，不能包含任何特殊字符（我们使用该符号根据有效的 C# 关键字命名变量）。

    3. 另有规定，变量名不能包含有效的 C# 关键字。

    4. 变量名之间不能有空格；两个单词之间使用下划线或使用驼峰命名法。

    5. 变量名不能以数字开头。


