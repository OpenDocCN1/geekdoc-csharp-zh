    C# Basic Structure and Keywords

    Like most modern high-level programming language, C# has its constraints and rules
    that you must follow as you program. Most of these constraints are like those
    of its ancestors – Java and C++ but slightly different. The following are some
    key points to note about C# programs.


    - A C# program must contain a `main` method.

    - Execution of a C# program starts at the `Main` method.

    - Unlike Java, the `class` name can be different from the filename containing
    the source code without causing any errors.

    - C# is case sensitive and thus, the latter ‘Class’ and ‘class’ are two different
    words.

    - You must terminate all C# statements with a semicolon `;`


    Those are the most basic and important rules in C# programming. Like other programming
    languages, C# also has specific keywords. In this case, and is the case with a
    majority of programming languages, keywords are words reserved and used by the
    C# compiler, and thus, you cannot directly use them as identifiers.


    In programming, identifiers are unique words used to identify variables, classes,
    methods, and other data structures — we shall talk more about these in later sections.


    The C# compiler reserves the following keywords for its use — different IDEs and
    text editors usually show them in different colors. However, you can use some
    of the keywords by adding the `@` symbol at the beginning of the word. We do not
    recommend this practice.


    **NOTE**: In C#, some keywords may have special meaning when it comes to the context
    of the written code. We call these contextual Keywords. Below is a table of the
    most common C# keywords.


    | void | explicit | break | using | decimal | continue | join |

    | abstract | extern | else | enum | try | add | into |

    | foreach | bool | sealed | case | event | unchecked | Gloab |

    | interface | class | checked | for | out | base | group |

    | as | ulong | do | if | sbyte | uint | |

    | char | this | internal | in | randonly | alias | |

    | while | public | operator | null | float | sizeof | |

    | throw | stackalloc | int | in | namespace | ascending | |

    | lock | private | unsafe | switch | struct | descending | |

    | goto | true | long | false | set | from | |

    | protected | const | out | ref | select | volatile | |

    | implicit | new | finally | static | remove | dynaic | |

    | ushort | object | override | typeof | delegate | get | |

    | short | fixed | is | Virtual | orderby | let | |

    | double | return | string | Params | partial | byte | |


    ## Comments in C#

    Like most programming languages, C# allows us to use comments. The compiler ignores
    Comments and uses them to document the code for later use. Comments are very important
    since you can use them to refer to and explain the code if other programmers are
    working on it too. You can create Comments in two formats:


    1. **Single line comments**: We create single line comments using two forward
    slashes `//` at the end of the line.

    2. **Multiline comments**: We use Multiline comments to extend the comment to
    more than one line continuously. We create them using a single backlash and an
    asterisk and close them using an asterisk and a forward backslash (`/* ... */`).


    **NOTE**: It is always a good practice documenting your C# code by using comments.


    ## C# Variables

    In C# programming and most of programming languages, Variables refer to a container
    used to store a specific type of data. A name given to a variable, also called
    variable name, is used to refer to the memory location where the variable is stored.


    In C#, every defined variable has its specific type used to determine the layout
    and size that the variable can store. It is also used to define the type of operations
    that can be carried out on the defined variable. C# has 5 main types of variables
    as shown in the table below:


    | C# Variable Type | Type Examples |

    | :--- | :--- |

    | Decimals Types | decimal |

    | Boolean Types | True or false, as assigned |

    | Integral Types | Int, byte, ulong, long, char, sbyte, short, ushort, uint, char
    |

    | Floating Point | Double and floats |

    | Nullable Types | Nullable types |


    ### Variable Definition

    The general syntax for declaring a variable in C# is:

    `<variable_type> <variable_name>;`

    Where `variable_type` can be any of the valid variable types and `variable_name`
    is any relevant name you can create.


    Examples include:

    `int age, price;`

    `double currency;`

    `char index;`

    `float my_float;`


    In the above examples, `age`, `price`, `currency`, `index`, and `my_float` represent
    the variable name created by the programmer, while `int`, `double`, `char`, and
    `float` represent the data type of the variable defined by C# compiler.


    ### Variable Initialization

    You can initialize variables by assigning a valid expression or value. In C#,
    we conduct Variable initialization to assign a value using a single equal sign
    `=`. The general syntax for variable initialization is:

    `<variable_type> <variable_name> = expression or value;`


    Example:

    ```csharp

    int age = 10; // value

    double currency = 122.69; // value

    float pi = 3.14159; // value

    char index = ''A''; // value

    area = 21 * 21 * 3.14159; // expression

    ```

    **NOTE**: It is always a good programming practice to initialize values; otherwise,
    the Program may produce unexpected results.


    ### Rules for Variable Naming

    When naming a variable in C# and most of the programming languages, you must follow
    various rules. These rules ensure that no errors occur during variable declaration.
    These rules are:


    1. Variable names can only contain alphabets, numerical values, and underscores.

    2. Variable names cannot contain any special character except an underscore and
    `@` symbol, which we use to name a variable after a valid C# keyword.

    3. Variable names cannot contain a valid C# keyword unless otherwise.

    4. No whitespaces between variable names; Join two words with an underscore or
    use Camel casing.

    5. Variable names cannot start with a number.

