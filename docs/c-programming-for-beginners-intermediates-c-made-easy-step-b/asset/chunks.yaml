    and close them using an asterisk and a forward backslash (/* …*/)


    NOTE: It is always a good practice documenting your C# code by using comments.C#
    VariablesIn C# programming and most programming languages, Variables refer to
    a container used to store a specific type of data. A name given to a variable,
    also called variable name, is used to refer to the memory location where the variable
    is stored. In C#, every defined variable has its specific type used to determine
    the layout and size that the variable can store. It is also used to define the
    type of operations that can be carried out on the defined variable.C# has 5 main
    types of variables as shown in the table below:


    | C# Variable Type | Type Examples |


    | Decimals Types | decimal |


    | Boolean Types | True or false, as assigned |


    | Integral Types | Int, byte, ulong, long, char, sbyte, short, ushort, uint, char
    |


    | Floating Point | Double and floats |


    | Nullable Types | Nullable data types |


    Variable DefinitionThe general syntax for declaring a variable in C# is:<variable_type>
    <variable_name>;Where the variable_type can be any of the valid C# variable types
    and the variable name is any relevant name you can create.Examples include:int
    age, price;double currency;char index;float my_float;In the above examples, age,
    price, currency, index, and my_float represent the variable name created by the
    programmer, while int, double, char, and float represent the data type of the
    variable defined by C# compiler.Variable InitializationYou can initialize variables
    by assigning a valid expression or value. In C#, we conduct Variable initialization–
    to assign a value –using a single equal sign. The general syntax for variable
    initialization is:<variable_type> <variable_name> = expression or value;Example:int
    age = 10; // valuedouble currency = 122.69; // valuefloat pi = 3.14159; // valuechar
    index = ‘A’; // valuearea = 21 * 21 * 3.14159; // expressionNOTE: It is always
    a good programming practice to initialize values; otherwise, the Program may produce
    unexpected results.Rules for Variable NamingWhen naming a variable in C# and most
    of the programming languages, you must follow various rules. These rules ensure
    that no errors occur during variable declaration. These rules are:


    1.  Variable names can only contain alphabets, numerical values, and underscores.


    2.  Variable names cannot contain any special character except an underscore and
    @ symbol, which we use to name a variable after a valid C# keyword.


    3.  Variable names cannot contain a valid C# keyword unless otherwise.


    4.  No whitespaces between variable names; Join two words with an underscore or
    use Camel casing.


    5.  Variable names cannot start with a number'
