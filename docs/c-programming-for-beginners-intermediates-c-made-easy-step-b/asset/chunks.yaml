    ## 第 8 节：封装


    在编程中，封装（Encapsulation）是指将一个或多个项封装在逻辑包中的过程。封装是面向对象编程中一种非常重要的方法论。它允许或拒绝通过用户定义对 `Program`
    中项实现细节进行访问。


    我们在之前的节中简要讨论了封装的元素。在本节中，我们将更详细地介绍它。


    抽象（Abstraction）和封装是面向对象编程的两个方面。抽象允许 `Program` 中项的可见，而封装允许程序员实现代码中项的可见性级别或抽象级别。


    我们通过使用访问修饰符（见之前的章节）来实现封装。我们使用访问修饰符来定义 `class` 中成员的可见性和范围。类可以是用户定义的也可以是预构建的类。以下是
    C# 支持的访问修饰符。


    1. `Public`

    2. `Private`

    3. `Protected`

    4. `Internal`

    5. `Internal protected`


