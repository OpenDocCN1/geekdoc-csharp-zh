    \ 中的输入/输出类\n    - 逐步教程\n    - 控制台计算器\n- 结语\n\n## C# 编程简介与 .NET 框架简介\nC#，读作 `c-sharp`\
    \ 或 `see-sharp`，是一种高级、健壮且现代的编程语言。C# 也是存在于 .NET 编程语言家族中的简单面向对象编程语言。它由微软在 Anders\
    \ Helsberg 的领导下开发，他是 Pascal 和 Delphi 的作者，这两个都是著名的编程语言。\n\n与大多数编程语言一样，C# 的出现是对其他语言的改进，特别是对于此之前的语言，如\
    \ C++ 和 Java。因此，C# 的语法可能看起来与 C++、Java 相似，但在某些情况下有细微差别。C# 允许开发者为桌面、移动设备、嵌入式系统和\
    \ Web 创建安全且健壮的应用程序。在本书中，我们将详细介绍 C# 语言的主要概念，并以独特且易懂的方式帮助你理解 C#，以便你在继续学习旅程时能够理解更深层次的内容。\n\
    \n**注意**：本书非常适合初学者和中级者。因此，我们可能会提到但不会解释 C# 语言的高主题，如 `Generics`（泛型）、`Delegates`（委托）、`Lambda\
    \ Expressions`（Lambda 表达式）、`LINQ`、`Nullable Types`（可空类型）以及异步编程。当你掌握 C# 的基础和中级方面后，确保寻找上述高级主题的知识，并挑战自己尽可能多学习该语言。\n\
    \n## .NET 框架简介\n我们已经提到 C# 是 .NET 家族中的编程语言。如果你对什么是 .NET 家族以及它包含什么感到陌生：这是一个非常著名的开发平台——主要被\
    \ Windows 桌面应用开发者、视频游戏和后端开发者所熟悉。简单来说，.NET（读作 dot net）是一个跨平台且开源的开发者平台，用于跨多个操作系统的桌面开发健壮的应用程序。它封装了从桌面应用程序到移动应用程序的开发，并且如提到的，C#\
    \ 在游戏开发者社区中非常流行。.NET 倡议下的语言包括 C#、F#、Visual Basic 和 ASP.NET。这些语言的相似之处在于，它们都对彼此进行了改进，并用于不同的领域创建应用程序。.NET\
    \ 家族也非常流行，因为它拥有广泛的预定义类库，支持简单和复杂的程序，如数据库、人工智能等。.NET 库通过 `NuGet` 包管理器进行维护、安装和更新。总之，.NET\
    \ 框架是各种编程语言中非常先进的生态系统，这也是本指南的重点。\n\n## C# 编程语言的核心特性\n尽管我们现在有很多编程语言，但 C# 依然非常出色。这是由于以下几个原因，C#\
    \ 与其他编程语言相比具有许多核心特性和功能。让我们讨论一下让 C# 成为优秀编程语言的某些核心特性：\n\n*   它是一门高级编程语言\n*   它是现代且通用的\n\
    *   它非常易学\n*   它是 .NET 框架的一部分\n*   易于使用 `Generics`（泛型）\n*   它创建非常安全且高效的程序\n* \
    \  它是跨平台的\n*   `Assembly Versioning`（程序集版本）\n*   `Indexers`（索引器）\n*   它是为 `CLI`（命令行界面）设计的\n\
    *   自动垃圾回收\n*   事件管理\n\n现在你已经知道了 C# 是什么以及它相比其他编程语言的许多优势，让我们讨论如何设置你的 C# 学习和工作环境。\n\
    \n## 第一部分：设置与安装\n在本节中，我们将查看如何在计算机上设置 C# 并开始创建程序。在我们开始安装集成开发环境 (IDE) 之前，你需要满足以下要求以确保程序的兼容性和高效执行：\n\
    \n*   首选 64 位处理器\n*   Windows Service Pack 1\n*   至少 6GB RAM\n*   磁盘空间 10GB（取决于功能）\n\
    *   最低网络下载速度\n*   如果不符合，我们可以进行 .NET\n*   如果你有上述功能，我们就可以完成 .NET 的安装\n\n### 如何安装\
    \ .NET 框架\n要开始 .NET 框架，请遵循此链接：[`www.microsoft.com/en-us/download.aspx?id=55167`](https://www.microsoft.com/en-us/download.aspx?id=55167)。\n\
    \n### 安装 IDE (C#)\n在这里我们将涵盖 C# 的安装，它包含文本编辑器和 C# 编译器。我们使用 Visual Studio (MVS) 作为\
    \ IDE。下载时请分别访问 Mac 和 Windows 的地址：[`visualstudio.microsoft.com/mac/`](https://visualstudio.microsoft.com/mac/)\
    \ 和 [`visualstudio.microsoft.com/`](https://visualstudio.microsoft.com/)。\n\n\
    1. 下载免费的社区版（Community Edition）。如果需要功能，可以购买企业版或专业版。（Image0002.jpg）\n2. 获取安装程序后，启动它并等待初始设置完成。（Image0003.jpg）\n\
    3. 完成后，将打开另一个所示窗口：（Image0004.jpg）\n4. 选择社区版本并点击安装。另一个窗口将弹出，要求你在安装过程中选择包含的功能。我们需要\
    \ .NET 桌面环境。选择它并点击安装。如果你想安装额外功能，请选择它们但要确保你有足够的空间。（Image0005.jpg）\n5. 选择要安装的功能后，点击安装开始安装。等待过程完成并启动。（Image0006.jpg）\n\
