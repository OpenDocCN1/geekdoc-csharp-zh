    ### 2. Concat

    We use this method to concatenate two or more string objects to produce one string.
    The syntax for this method is:


    ```

    String.Concat(string1, string2, stringN)

    ```


    ### 3. Contains

    We use this method to return a Boolean value to indicate whether the defined string
    object arises in the string. The syntax for this method is:


    ```

    String.Contain(value)

    ```


    ### 4. Copy

    We use this method to copy a defined string by creating a new string object with
    the same value as the specified string. The syntax is:


    ```

    String.Copy(string)

    ```


    ### 5. CopyTo

    We use this method to copy the stated number of characters from a specific position
    of the String object to a specific position in an array of Unicode characters.
    The syntax is:


    ```

    String.CopyTo(int SourceIndex, char[] target, int targetIndex, int count)

    ```


    ### 6. ToLower

    When used, this method returns a copy of the specified string converted to lowercase.


    ### 7. ToUpper

    This method returns the specified string converted to uppercase.


    ### 8. StartsWith

    We use this method to determine whether the start of the string instance matches
    the specified string literals.


    ### 9. EndsWith

    This method determines whether the end of the string instance matches the specified
    string literals.


    ### 10. Equals

    returns a Boolean value if the specified string matches the current string object.


    ### 11. IndexOf

    We use this method to return the zer0-based index of the specified character –
    specified character must be in Unicode Format – in the string object. There are
    many variances of the `IndexOf` method each with different arguments.


    ### 12. IsNullEmpty

    returns a Boolean value if the specified string object is null or empty.


    ### 13. Join

    We us this method to concatenate all the elements in a string array using the
    specified separator in between each element.


    ### 14. Remove

    removes the specified number of operators in the existing string object at the
    specified index position.


    **NOTE:** This guidebook has left many string methods uncovered. Check out the
    C# documentation for more.


    ## Section 8: Encapsulation


    In programming, Encapsulation refers to the process of enclosing one or more items
    in a logical package. Encapsulation is a very important methodology of the object-oriented
    programming. It allows or denies access to implementation details of items in
    the `Program` by user-definition.


    We briefly discussed elements of encapsulation in previous sections. In this section,
    we are going to cover it in more details.


    Abstraction and Encapsulation are two aspects of object-oriented programming.
    Abstraction allows the visibility of items in the `Program` and encapsulation
    allows programmers to implement the level of visibility or abstraction of the
    items in the code.


    We implement Encapsulation by using access modifiers – seen in previous sections.
    We use Access modifiers to define the visibility and the scope of members in a
    `class`. The class can be user defined or the pre-built classes. The following
    are the supported access modifiers in C#.


    1. `Public`

    2. `Private`

    3. `Protected`

    4. `Internal`

    5. `Internal protected`

