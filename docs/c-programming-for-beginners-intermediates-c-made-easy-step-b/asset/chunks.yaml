    ### 3. Contains

    我们使用此方法返回一个布尔值，用指示定义的字符串对象是否出现在字符串中。该方法的语法为：


    ```

    String.Contain(value)

    ```


    ### 4. Copy

    我们使用此方法通过创建一个与指定字符串具有相同值的新字符串对象来拷贝定义的字符串。其语法为：


