- fmt: "\n# Public Access modifier\nWe use the `public` access modifier to allow classes\
    \ to expose all its members —such as variables and functions – to other functions\
    \ and objects from other classes. This enables other classes from the defined\
    \ class to access these elements and modify them. You should only use the `public`\
    \ access modifier when other functions can change the members of the class.\n\n\
    The Program below – used to calculate the area of a circle— illustrates this.![](Image00052.jpg)\n\
    \nFrom the above Program, we declare the variables of the class `Circle` as `public`\
    \ and are thus accessible from the `Main()` method. We do this using the instance\
    \ of the circle class called `Circle`. Methods such as `returnArea` and `displayArea`\
    \ – which are in the class - can also access the variables without using any instance\
    \ of the class. Note that the declaration of the two functions inside the class\
    \ `circle` is `public` and thus can be accessed in the `main` method using an\
    \ instance of the class.\n\n## Private Access Modifier\nWe use the `private` access\
    \ modifier to hide or restrict access of class members to functions and methods\
    \ outside the declared class. This means that functions in the same class as the\
    \ variables can access them. Instances of the classes do not have allowed access\
    \ to variables.![](Image00053.jpg)\n\nWhen the above code compiles, the following\
    \ shall be its output:![](Image00054.jpg)\n\nIn the Program above, we declare\
    \ the members `radius` and `PI` as `private` and thus cannot be accessible inside\
    \ the `Main()` method as they are not in the same class. The methods `getRadius()`,\
    \ `returnArea()` and `displayArea()` can however access the variables as they\
    \ are in the same class. Since their declaration is `public`, they can be accessed\
    \ in the `Main()` method using the instance of the class.\n\n## Protected Access\
    \ Modifier\nThe `protected` access modifier allows the child class to access the\
    \ member variables and methods of the base class. This helps apply inheritance\
    \ and polymorphism.\n\n## Internal Access Modifier\nWe use the `internal` access\
    \ modifier to allow classes to expose the member variables and methods to other\
    \ methods and objects in the application. This means that members with `internal`\
    \ access are accessible from any class or method with the application we defined.\n\
    \n**NOTE**: If you do not define the access modifier of the class members, the\
    \ default access modifier is `private`. For example, if you do not define the\
    \ access modifier of the class `displayArea()`, it is `private`.\n\n## Protected\
    \ Internal Access modifier\nWe use the `protected internal` access modifier to\
    \ hide members in a class from other classes apart from child classes within the\
    \ current assembly.\n\n# Section 9: C# Classes & Objects\nWe have been mentioning\
    \ classes for a while now, but we are yet to cover what they are or how they work.\
    \ In this section, we are going to cover classes and discuss them in a way that\
    \ allows you to know how they work.\n\nIn programming, `Classes` are blueprints\
    \ for an object or data type. Classes do not define any data, but we use them\
    \ to define what the objects of the class consists and the corresponding operations\
    \ of the object. Objects are instances of classes. For example, A blueprint –\
    \ a class in this case – of a car may contain the name, year of manufacture, manufacturer,\
    \ speed, color, etc. It may also include operations such as `ignite`, `brake`,\
    \ `accelerate`, `repair` etc. Let us see how to declare classes and initialize\
    \ them.\n\n## Class Definition\nCreating classes in C# starts with the keyword\
    \ `class` followed by the class name and curly braces to enclose the class body.\
    \ To include an access modifier for the class, include it before the class keyword:\
    \ The following is a syntax for class declaration.\n\n```csharp\npublic class\
    \ <class name> {\n    // variables\n    <access modifier> <data type> <variable\
    \ name>\n    // methods\n    <access modifier> <return type> <method name>\n \
    \   {\n        // method body\n    }\n}\n```\n\nThe following are the most important\
    \ points to note about classes and class members:\n- We use `Data types` to represent\
    \ the type of the variable\n- We use the `Return type` to represent the type of\
    \ return value of the method\n- We use the keyword `new` to create an instance\
    \ of a class\n- We use the dot (`.`) operator with the instance of the class to\
    \ access the class members.\n- The `access modifier` specifies the access rules\
    \ for both the classes and its members. If you fail to define it, the default\
    \ access modifier for a class is `internal` while its members are set to `private`.\n\
    \n## Constructors\nA constructor is a special method with a class executed when\
    \ an instance of a class is created. Constructors have same names as its base\
    \ class but do not contain a return value. By default, constructors do not have\
    \ parameters but parameterized constructors that accept supported parameters.\
    \ Parameterized constructors help in assigning initial values to instances of\
    \ the classes during creation.![](Image00055.jpg)\n\n## Destructors\nDestructors\
    \ are also special methods of a class. However, they execute when the instance\
    \ of its corresponding class goes out of scope. Destructors have the same name\
    \ as its base class with a tilde preceding the name. Like constructors, they do\
    \ not have a return value but cannot take parameters. They cannot be inherited\
    \ or overloaded. Destructors are very efficient at releasing memory before a program\
    \ exits.![](Image00056.jpg)\n\n## Static Class Members\nWe can also define Class\
    \ members as `static`. Once you define the member as `static`, this means only\
    \ one copy of the static member is available no matter how many instances of the\
    \ class are created. We can initialize `Static` values outside the member functions\
    \ or inside the class definition. We normally use `Static` members with constant\
    \ values as you can retrieve them by invoking the class without creating an instance\
    \ of the class.\n\n**NOTE**: You can also declare `Methods` as `static`, which\
    \ can only access static variables. These types of methods exist even before the\
    \ creation of an instance of the object.\n\n# Section 10: Inheritance and Polymorphism\n\
    Inheritance and Polymorphism is one of the most important concepts of Object-Oriented\
    \ Programming. These concepts help with code reuse and implementation time. In\
    \ this section, we are going to understand how to use these concepts in C#.\n\n\
    ## Inheritance\nProgrammers use Inheritance to define/create classes in terms\
    \ of other class. Suppose you have a class that contains members and methods that\
    \ are like a class you are about to create. Instead of creating new members for\
    \ each class, you can choose to inherit the members of the existing class. The\
    \ new class becomes what we know as a derived class while the existing class is\
    \ a base class. For example, a Mercedes is a car, therefore a Maybach is a Mercedes\
    \ hence a Maybach is a car. This concept is what we call IS-A relationship.\n\n\
    It is also important to note that you can derive a class from more than one class,\
    \ and hence it can inherit member variables and methods from multiple classes.\
    \ The syntax for inheritance is:\n\n```csharp\n<access modifier> <class name>\
    \ <base class name> {\n    // body\n}\n<class name> <derived class name> : <base\
    \ class name> {\n}\n```\n![](Image00057.jpg)\n\nOnce the above code is compiles,\
    \ the output should be as the one below:![](Image00058.jpg)\n\n**NOTE**: The derived\
    \ class inherits all the variables and methods from the base class and you should\
    \ therefore create the base class first – before you create the derived class.\n\
    \n## Multiple Inheritance in C#\nC# does not directly support multiple inheritance.\
    \ To do this, we have to use interfaces. The Program below —used to calculate\
    \ the price of painting a rectangular surface – shows the implementation of this\
    \ concept.Image00059.jpg)![](Image00060.jpg)\n\n## Polymorphism\nObject-Oriented\
    \ programming has three core concepts: Encapsulation, Inheritance, and Polymorphism.\
    \ We have already covered the first two. In this section, we are going to cover\
    \ the last one – Polymorphism. Polymorphism refers to existence of more than one\
    \ form of an element. In programming, polymorphism means a variable of a supertype\
    \ referring to a subtype object. Its main expression is as one “inheritance, multiple\
    \ functions.” Polymorphism exists in two states:\n"
