    # 1: 值传递

    参数按值传递是函数调用过程中传递参数的默认机制。该机制涉及为每个所需的参数创建存储空间，从而将实际参数拷贝到这些位置。该程序通过使用 `swap` 方法说明了这一机制。(Image00043.jpg)
    一旦上述程序编译完成，将显示如下输出。(Image00044.jpg) 这意味着尽管函数内部的值发生了变化，但值本身并没有发生变化。


    # 2: 引用传递

    参数引用传递涉及传递实际变量内存地址。与按值传递不同，引用传递方法不会为变量创建新的存储位置。在 C# 中，我们使用 `ref` 关键字声明引用参数。下面的程序显示了引用传递方法调用的用法。(Image00045.jpg)
    一旦上述代码编译完成，输出将显示：Image00046.jpg) 这表明变量的值在 `swap` 方法内部进行了交换，从而反映在 `Main` 方法中。


    # 3: 输出传递

    正如我们所看到的，我们使用 `return` 关键字从方法返回一个值。使用输出参数（output parameters），我们可以从函数返回两个值。输出传递的工作原理与引用传递类似，不同之处它们是将数据传递到方法而不是进入方法。由于这种方法对初学者来说可能有些，你可以在这里找到更多信息。[https://docs.microsoft.com/en-us/dotnet/csharp/language-reference/keywords/out-parameter-modifier]


    我们已经完成了方法（Methods）部分。我们已经涵盖了方法创建、方法调用和参数传递等主题。通过实践掌握这些概念的最佳方法。例如，如果你创建了一个程序，尝试将你的代码添加到另一个方法中并仅在主方法中调用它。这将帮助你理解并熟悉方法。


    # 第 6 ：C# 数组

    在本节中，我们将介绍另一个重要的概念或数据结构。与大多数编程语言一样，C# 允许我们创建并操作数组。让我们来看看数组是什么以及它们是如何工作的。


    我们可以将数组归类为一组共享内存位置的相关数据。我们使用数组来存储相同类型的固定大小顺序数据组。你可以将数组视为容器，用于在连续位置上存储相同类型的变量，其中最低位置地址存储第一个元素，最高地址存储最后一个元素。


    例如，如果我们想存储 100 个数字，我们可以使用基本方法——创建名为 `number0`、`number1`、`number2`……`number100`
    的变量。然而，这非常麻烦且消耗大量内存。另一种方法是创建一个包含 100 个元素的数组并通过索引访问每个元素。让我们看看如何这样做。


    ## C# 数组的类型

    在进入代码之前，最好注意 C# 具有某些类型的数组。它们包括：

    - 单维数组

    - 多维数组

    - 锯齿数组（Jagged Arrays）

    - 参数数组（Param Arrays）


    为了简单起见，我们只涵盖单维数组。


    ## 数组声明

    在 C# 中声明数组时，我们遵循以下语法：

    ```

    datatype[] array_name;

    ```

    - 我们使用数据类型来定义在数组中存储什么类型的数据。

    - 在方括号 `[]` 中 —— 数组的秩或大小。它指定了数组中将存储多少元素。

    - `array_name` —— 指定标识数组的唯一名称。始终使用具有创意且有意义的。


    例如，你可以使用以下数组分别存储整数、双精度或字符值：

    ```

    int[] myIntegers;

    double[] myValues;

    char[] myChars;

    ```

    注意：一旦声明了数组，将不会为其创建内存位置。


    ## 数组初始化

    如前所述，数组声明并不分配内存。我们需要通过创建数组的实例来初始化数组。由于数组是引用类型，在 C# 中，我们使用 `new` 关键字创建数组的实例。数组初始化的语法为：

    ```

    datatype[] arrayName = new datatype[size];

    ```

    例如：

    ```

    int[] myIntegers = new int[100];

    double[] myValues = new double[100];

    char[] myChars = new char[26];

    ```


    ## 赋值与索引

    一旦声明了数组并完成了初始化，我们就可以使用索引向数组分配值。数组索引从零开始——这意味着如果我们有这样的数组：

    ```

    double[] myArray = new double[10]

    ```

    数组中的第一个数字位于索引零，而数组中的最后一个元素是 `arrayLength – 1`。

    赋值时我们使用以下语法：

    ```

    arrayName[index] = value;

    ```

    例如：Image00047.jpg) 一旦你为数组索引分配了值，就可以简单地通过其索引来使用它。

    注意：与 Python 等编程语言不同，如果你调用 `Console.WriteLine(myArray)`，将打印数组的类型——在这种情况下，为 `System.Double`。


    ## 数组迭代 – Foreach

    我们可以使用 `for` 循环或 `foreach` 循环访问所有数组元素。由于我们已经涵盖了 `for` 循环，我们将查看 `foreach` 语句 Image00048.jpg)
    一旦上述代码编译完成，它将打印数组索引中的每个元素。由于 `for` 循环更新数组，数组索引不会重复超过一次。下面的输出所示：Image0049.jpg)
    在本节中，我们涵盖了数组和数组操作。我们还没有涵盖多维数组，因为如果你没有掌握单维数组，它们可能会令人混乱。在转向其他内容之前，确保掌握单维数组的操作。


    # 第 7：C# 字符串与字符串操作

    在指南之前的章节中，我们一直使用字符串字符串。然而，处理字符串的最佳方法是声明字符串变量并将所需的字符串存储其中。这允许进行字符串操作。注意：字符串在 C#
    中是 `System.String` 的别名，我们使用它们存储一系列字符。


    ## 如何创建 C# 字符串对象

    在 C# 中，我们可以使用各种方法创建字符串。我们已经处理了其中一些方法。它们包括：

    - 创建字符串变量并存储字符串字面量

    - 使用字符串拼接运算符

    - 使用 `String` 类

    - 返回字符串的方法调用

    - 使用格式化方法将值或对象转换为相应的字符串表示。


    注意：我们不会逐一讨论上述方法；相反，我们将使用一个编写的程序来说明它们是如何工作的 Image0050.jpg) 一旦上述程序编译完成，将显示如下输出 Image0051.jpg)


    ## 字符串属性

    C# 字符串类具有以下属性：

    - `Length` —— 我们使用 `length` 属性获取指定 `String` 类中字符的数量。

    - `Chars` —— 我们使用此属性获取字符串对象指定位置的字符。


    ## 字符串方法

    我们有许多与字符串对象兼容的方法，允许编程人员对字符串执行各种操作。这些方法非常多，我们可能无法涵盖所有的。


    1. `Compare`: 我们使用 `compare` 方法比较两个字符串并返回一个整数值，以指定根据顺序排序的相对位置。该方法的语法为：


    ```

    String.Compare(string1, string2, ignoreCase = true/false);

    ```

    你可能会遇到允许其他参数的方法，例如 `IgnoreCase`，它在设置为 `true` 时会忽略大小写。


