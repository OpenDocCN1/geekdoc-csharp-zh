    - **Using System**: This is usually the first part of a basic C# program. We use
    the keyword `using` to include the `System` namespace in the included `Program`.
    For Java Programmers, this may interpret to the `import` packages or `#include
    <header_file>`. A larger program may contain more than one `using` statements.

    - The second line in the `Program` contains the `namespace` keyword or declaration
    that contains a collection of classes. In the above `Program`, the namespace `HelloWorld`
    contains the `class` called `Program` – which by default is named after the name
    of the file containing the source code.

    - The next line of the code contains the `class` declaration. The `class` contains
    the methods and the data definitions of the `Program`. It also contains more than
    one method used to define the behavior of the specified `class`. The `HelloWorld`
    `Program` above contains a single method called `Main`.

    - Next is the `Main` method declaration. The main method is the entry point of
    all programs written in C#. As stated earlier, we use methods to define what the
    method does, thus acting as the verb of the class. In this case, we used the method
    to print the text Hello World in the console. If you are familiar with Java, the
    main method looks like this.

    ```java

    public static void main(String[] args) {​ System.out.println(“Hello world”);}

    ```

    As you can see, C# borrows a lot from Java and C++.

    - The last line of code is the `Console.WriteLine()` - This line of code is the
    action which is broadcasted by the method `main` thus printing the text inside
    the `WriteLine()` function.


    **NOTE**: For the previous example, we used the Jetbrains Rider and the code may
