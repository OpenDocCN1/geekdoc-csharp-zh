    \n# C# Data Types\nIn programming, we use Data types to specify the type of data\
    \ that can be stored within a specific variable. We have already encountered various\
    \ data types such as integers, doubles, and floats. In C#, we have three main\
    \ types of data types:\n\n1. Value Types\n2. Reference Types\n3. Pointer Types\n\
    \nLet us look at these types in more details.\n\n## 1: Value Types\nValue data\
    \ types are integer and floating-point directives, and can be assigned values\
    \ directly as they contain direct data. They include `int`, `char`, `double`,\
    \ `floats`. Value data types are derived from the `System.ValueType` class that\
    \ is readily available in the C# compiler library. \n\nAs mentioned earlier, once\
    \ the data type is specified during variable creation, memory is allocated to\
    \ store values of that size and type. Value types can be broken down into more\
    \ types such as:\n* Predefined Value types\n* User-defined value types\n\nThe\
    \ following table shows the most common Predefined Value types provided by the\
    \ C# programming language.![](Image00010.jpg) ![](Image00011.jpg)\n\nIn C#, you\
    \ can use the size of the operator to return the exact number of bytes occupied\
    \ by the variable. Below is a program to show the bytes size of the specified\
    \ data types:![](Image00012.jpg)\nThe given result from the above Program are\
    \ below:![](Image00013.jpg)\n\n**NOTE**: The size in the above code is in bytes.\n\
    \nUser-defined value types are data types created by the user as a way to ensure\
    \ flexibility within the code. We can use this to illustrate the flexibility of\
    \ the .NET framework programming languages. User-defined value types include:\n\
    \n* **Structures**: In C#, a structure is a user-defined value type that is similar\
    \ to a class. Structures contain variables and functions similar to the C# native\
    \ class. The main use of Structures is to store logically related values in a\
    \ single definitive value type. Structures, on the other hand, cannot inherit\
    \ from any class and vice versa. See the Program below illustrating C# structures.![](Image00014.jpg)\n\
    * **Constants**: Constants are normal variable types that cannot be changed. Values\
    \ in a constant are assigned during the declaration and cannot be changed. Used\
    \ for values that are not meant to be changed at any time during the execution.\
    \ We declare them by using the keyword `const` in C#. For example, we can declare\
    \ a variable such as `PI` as a constant since it cannot change – as long as you\
    \ are on earth. `const int pi = 3.14159;` The code below will result in an error\
    \ as we try to perform an operation on a constant value.![](Image00015.jpg)![](Image00016.jpg)\n\
    **NOTE**: It is always good to declare constant values in uppercase to differentiate\
    \ them from normal variables.\n* **Enumerations**: We use enumerations to represent\
    \ a list of named integer constants where each constant is mapped to an integral\
    \ value with the start index being zero. We normally use it when we need to define\
    \ a fixed set of values from properties. The code below represents Enumerations\
    \ that contain related constant values.![](Image00017.jpg)\n\n## 2: Reference\
    \ Types\nWe use Reference data types to reference to actual variables in a program.\
    \ They do not contain any actual data but memory locations of the variables they\
    \ reference to. The relationship between the reference value and the actual value\
    \ in the variable is direct. This means if the value in the memory location changes\
    \ by either of the variables, the other variable automatically updates to reflect\
    \ the new value.\n\nCommon types of reference data types include strings, objects,\
    \ dynamics, interfaces, and classes – includes predefined and user-defined. Let\
    \ us discuss some of these common data types:\n\n### A: String Types\nWe use the\
    \ `string` type to create strong string literals in a variable. The string type\
    \ is of the `System.String` class derived from object type. In C#, Strings are\
    \ represented by enclosing them in double-quotes. Later sections of the book will\
    \ cover String objects.![](Image00018.jpg)\n\n### B: Object Types\nThe object\
    \ type is of the class `System.Object` class and is the root class of all data\
    \ types in C# programming. Object types are very flexible, and you can assign\
    \ to them a value of any type as long as you convert it appropriately. This feature\
    \ of conversion from object to a certain type and certain data type to object\
    \ is known as unboxing and boxing, respectively.![](Image00019.jpg)\n\n### C:\
    \ Dynamic Types\nDynamic Types type came about after the introduction of C# version\
    \ 4.0; their main use is to store any type of value. They help you avoid compile-time\
    \ errors as the type checking of the data types occurs during run-time. However,\
    \ you can get the type of a dynamic data type during runtime by calling the `GetType()`\
    \ method off of it. The applications of the dynamic type are very massive as you\
    \ can use them in methods due to the capability to accept any type of data as\
    \ a parameter. However, in most cases, dynamic types behave like Objects. We create\
    \ it using the keyword `dynamic` with a syntax shown below:\n\n```\ndynamic <variable_name>\
    \ = value;\n```\nThe Program below shows the use case of dynamic type and their\
    \ respective type during run-time.![](Image00020.jpg)![](Image00021.jpg)\n\n##\
    \ 3: Pointer Types\nPointer data types in C# acts as locators or indicators to\
    \ a value. In C#, Pointers perform similarly as both C and C++. The following\
    \ illustration shows how pointers work.![](Image00022.jpg)\nThe general syntax\
    \ for declaring a pointer is:\n\n```\ntype* <identifier>;\n```\n**NOTE**: C# pointers\
    \ and fixed-size buffers occur in Unsafe context, an advanced topic not covered\
    \ in this guidebook. In this section, we have covered the C# data types. Working\
    \ with data types is very easy as long as you master how each type works and its\
    \ length. However, do not memorize the lengths, but it is good to know some of\
    \ them.\n\n# Section 3: Type Casting\nType casting, also called type conversion,\
    \ is a process of converting data types from one type to another. Type casting\
    \ is very important and occurs in two different types:\n\n1. Implicit Type casting\n\
    2. Explicit Type casting\n\n### Implicit Type casting\nIn C#, we perform Implicit\
    \ type conversion in a type-safe manner. Examples of implicit conversion are:\
    \ conversion from smaller integral types to larger integral types.\n\n### Explicit\
    \ Type casting\nUsers using pre-defined methods perform explicit type conversions\
    \ using the cast type operator. Examples include conversion of double to an integer.\
    \ Below is a program illustrating the use of explicit type conversion.![](Image0023.jpg)\n\
    \n### Type Casting Methods\nThe following are the most common types of C# type\
    \ casting methods.\n\n| Method | Description |\n| :--- | :--- |\n| ToInt16 | Coverts\
    \ the specified type to a 16-bit integer |\n| ToInt32 | Coverts the specified\
    \ type to a 32-bit integer |\n| ToInt64 | Coverts the specified type to a 64-bit\
    \ integer |\n| ToDouble | Converts the specified type to a double value |\n| ToBoolean\
    \ | Converts a type to Boolean – if applicable |\n| ToChar | Converts the specified\
    \ type to single Unicode characters |\n| ToByte | Converts the specified type\
    \ to byte type |\n| ToDecimal | Converts integers or floating-point numbers to\
    \ decimal types |\n| ToDateTime | Converts compatible types (strings and integers)\
    \ to date-time structures |\n| ToString | Converts the specified type to string\
    \ type |\n| ToType | Converts a type to the specified types |\n| ToSingle | Converts\
    \ the specified type to a small floating-point number type |\n| ToSbyte | Converts\
    \ the specified type to a signed byte type |\n| ToUInt16 | Converts the specified\
    \ type to an unsigned integer type |\n| ToUInt32 | Converts the specified type\
    \ to an unsigned long type |\n"
