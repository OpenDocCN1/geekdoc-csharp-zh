  trans: "\n\n# 公共访问修符 (Public)\n我们使用 `public` 访问修符允许类将其所有成员——例如变量和函数——暴露给其他类的其他函数和对象。这使得定义类的其他类可以访问并修改这些元素。只有当其他函数可以更改类的成员时，你才应该使用\
    \ `public` 访问修符。\n\n下面的程序——用于计算圆的面积——说明了这一点。![](img/Image00052.jpg)\n\n在上面的程序中，我们将\
    \ `Circle` 类的变量声明为 `public`，因此可以在 `Main()` 方法中访问。我们通过调用名为 `Circle` 的圆类实例来实现这一点。类中的\
    \ `returnArea` 和 `displayArea` 等方法也可以在不使用类任何实例的情况下访问变量。请注意，`circle` 类内部的两个函数的声明为\
    \ `public`，因此可以在 `main` 方法中通过该类的实例来访问它们。\n\n## 私有访问修符 (Private)\n我们使用 `private`\
    \ 访问修符来隐藏或限制类成员对声明类之外的函数和方法的访问。这意味着与变量在同一类中的函数可以访问它们。类的实例没有权限访问变量。![](img/Image00053.jpg)\n\
    \n当上述代码编译时，其输出应如下：![](img/Image00054.jpg)\n\n在上面的程序中，我们将成员 `radius` 和 `PI` 声明为\
    \ `private`，因此在 `Main()` 方法内部无法访问，因为它们不在同一个类中。然而，`getRadius()`、`returnArea()`\
    \ 和 `displayArea()` 方法可以变量，因为它们在同一个类中。由于它们的声明为 `public`，因此可以使用类的实例在 `Main()` 方法中访问。\n\
    \n## 保护访问修符 (Protected)\n`protected` 访问修符允许子类访问基类的成员变量和方法。这有助于实现继承和多态。\n\n## 内部访问修符\
    \ (Internal)\n我们使用 `internal` 访问修符允许类将其成员变量和方法暴露给应用程序中的其他方法和对象。这意味着具有 `internal`\
    \ 访问权限的成员可以从我们定义的应用程序中的任何类或方法访问。\n\n**注意**: 如果没有定义类成员的访问修符，默认访问修符是 `private`。例如，如果你没有定义类\
    \ `displayArea()` 的访问修符，它就是 `private`。\n\n## 保护内部访问修符 (Protected Internal)\n我们使用\
    \ `protected internal` 访问修符将当前程序集（assembly）内的子类之外的其他类隐藏类成员。\n\n# 第 9 节：C# 类与对象\n\
    我们已经提了一段时间的类，但还没有涵盖它们是什么或它们如何工作。在本节中，我们将涵盖类，并以一种让你了解它们如何工作的方式对其进行讨论。\n\n在编程中，`Classes`（类）是对象或数据类型的蓝图。类不定义任何数据，但我们使用它们来定义类的对象包含什么以及对象相应的操作。对象是类的实例。例如，一个汽车的蓝图（在这种情况下为一个类）可能包含名称、制造年份、制造商、速度、颜色等。它还可能包括\
    \ `ignite`（点火）、`brake`（刹车）、`accelerate`（加速）、`repair`（维修）等操作。让我们看看如何声明和初始化类。\n\n\
    ## 类定义\n在 C# 中创建类以关键字 `class` 开始，后跟跟类名和用于包含类体的大括号。要为类包含访问修符，请在 `class` 关键字之前包含它：以下是类定义的语法。\n\
    \n```csharp\npublic class <class name> {\n    // variables\n    <access modifier>\
    \ <data type> <variable name>\n    // methods\n    <access modifier> <return type>\
    \ <method name>\n    {\n        // method body\n    }\n}\n```\n\n以下是关于类和类成员需要注意的最重要点：\n\
    - 我们使用 `Data types`（数据类型）表示变量的类型\n- 我们使用 `Return type`（返回值类型）表示方法返回值的类型\n- 我们使用关键字\
    \ `new` 创建类的实例\n- 我们在类的实例上使用点 (`.`) 运算符来访问类的成员\n- `access modifier`（访问修符）规定了类及其成员的访问规则。如果你未能定义它，类的默认访问修符为\
    \ `internal`，而其成员被设为 `private`。\n\n## 构造构造函数 (Constructors)\n构造函数是一种特殊的方法，在创建类的实例时由该类执行。构造函数的名称与其基类相同，但不包含返回值。默认情况下，构造函数没有参数，但参数化构造函数接受支持的参数。参数化构造函数有助于在创建期间为类的实例分配初始值。(Image00055.jpg)\n\
    \n## 析构函数 (Destructors)\n析构函数也是类的特殊方法。然而，它们在相应类的实例超出范围时执行。析构函数的名称与其基类相同，但在名称前有一个波浪号\
    \ `~`。像构造函数一样，它们没有返回值但不能带有参数。它们不能被继承或重载。析构函数在程序退出之前释放内存非常高效。(Image00056.jpg)\n\
    \n## 静态类成员 (Static Class Members)\n我们还可以将类成员定义为 `static`。一旦你将成员定义为 `static`，这意味着无论创建多少个类实例，只有一个静态成员副本可用。我们可以在成员函数之外或类定义内部初始化\
    \ `Static` 值。我们通常使用具有常量值的 `Static` 成员，因为你可以通过调用类来检索它们。\n\n**注意**: 你可以将方法声明为 `static`，它们可以访问静态变量。\n\
    \n# 第 10 节：C# 继承与多态\n继承和多态是面向对象编程中最重要的概念之一。这些概念有助于代码重用和实现。在本节中，我们将理解如何在 C# 中使用这些概念。\n\
    \n## 继承 (Inheritance)\n程序员使用继承根据其他类来定义/创建类。假设你有一个包含你正要创建类的类的。与其为每个类创建新成员，不如选择继承现有类的成员。新类成为我们所知的派生类，而现有类是基类。例如，梅赛斯是汽车，因此马赫是梅赛斯，因此马赫是汽车。这个概念我们称为\
    \ IS-A 关系。\n\n同样重要的是，你可以从多个类派生一个类，因此它可以从多个类继承成员变量和方法。继承的语法为：\n\n```csharp\n<access\
    \ modifier> <class name> <base class name> {\n    // body\n}\n<class name> <derived\
    \ class name> : <base class name> {\n}\n```\n![](img/Image00057.jpg)\n\n一旦上述代码编译，输出应如下所示：Image00058.jpg\n\
    \n**注意**: 派生类继承基类的所有成员，因此你应该在创建派生类之前创建基类。\n\n## C# 中的多重继承\nC# 不直接支持多重继承。为了实现这一点，我们必须使用接口（interfaces）。下面的程序——用于计算矩形表面涂漆的价格——展示了这一概念的实现。Image00059.jpg!Image00060.jpg\n\
    \n## 多态 (Polymorphism)\n面向对象编程有三个核心概念：封装、继承和多态。我们已经涵盖了前两个。在本节中，我们将涵盖最后一个——多态。多态指的是元素存在多种形式。在编程中，多态意味着一个超类型的变量引用子类型对象。它的主要表现形式是一个“继承，多个函数”。多态存在两种状态：\n\
    \n"
- fmt: "\n# Static Polymorphism\nIn static polymorphism, method response is determined\
    \ during compilation time. We call this early binding or static binding. C#` static\
    \ polymorphism is in two states:\n\n## 1. Operator Overloading\nOperator overloading\
    \ refers to creation of user-defined operator-like functions. Overloaded operators\
    \ are functions with the keyword `operator` and the symbol for operator definition\
    \ following the function name. Like any other functions, they contain return value\
    \ and parameters. Below is a section of a program illustrating operator overloading.\n\
    \n![](Image00061.jpg)\n\n## 2. Functional Overloading\nFunction overloading refers\
    \ to the concept of having two or more functions with the same name in the same\
    \ scope. These methods however must differ in types and the number of arguments.\n\
    \n## 3. Dynamic Polymorphism\nDetermination of dynamic polymorphism occurs during\
    \ runtime. Dynamic polymorphism utilizes the C# capability of creating `abstract`\
    \ classes and `virtual` functions. `abstract` classes provide partial class operations\
    \ of interfaces, completed once a derived class inherits from it. The methods\
    \ of an `abstract` class are also `abstract` and only applied by the derived class.\
    \ Instances of `abstract` classes cannot be created nor can methods be declared\
    \ outside and abstract class.\n\n`virtual` functions are in a class that you want\
    \ to implement an inherited class. Since the calls of `virtual` functions are\
    \ determined during runtime, you can apply them differently on different inherited\
    \ classes.\n\n# Section 11 Interfaces\nIn programming, `Interfaces` are a logical\
    \ contract between the inheriting classes and the interface. The inheriting class\
    \ contains the logical how part of the contract while the interface defines the\
    \ logical what part of the contract. We can use `Interfaces` to define methods,\
    \ events, properties that are members of the interface and they can only contain\
    \ declaration of these members. The inheriting class handles the definition of\
    \ these members. `abstract` classes can serve the same purpose when only the base\
    \ class declares few methods, and the inheriting class is implementing the same\
    \ functionalities.\n\n## Interface Declaration\nIn C#, we conduct Declaration\
    \ of interfaces using the keyword `interface` followed by the name of the interface.\
    \ Interface declaration is similar to that of class and public by default. The\
    \ code below is a sample interface declaration:\n\n```csharp\npublic interface\
    \ circle{\n    // members\n    double radius;\n    const double PI = 3.14159;\n\
    }\n```\n\n# Section 12 C# Error Handling\nError handling is a very important concept\
    \ that allows programmers to anticipate and handle errors in the Program before\
    \ they occur. We also call it exception handling. Like most programming languages,\
    \ C# allows programmers to handle errors in programs. Let us cover these concepts\
    \ briefly.\n\n`Exceptions` allow programmers to transfer the execution control\
    \ from one section of the Program to another. WE utilize exception or Error handling\
    \ using three main keywords. Errors that occur in a program are ‘exceptions.’\n\
    \n- `try` – Contains the block of code you are trying in order to t see if it\
    \ runs with or without errors\n- `catch` – this is the preceding statement after\
    \ the `try` statement. It contains the block of code that handles the error triggered\
    \ by the `try` statement. It indicates catching and handling the error\n- `throw`\
    \ – used in the Program to throw the error once it appears\n- `finally` – This\
    \ contains the block of code executed whether an error occurs or does not. For\
    \ example, while opening a file, it must close whether an error occurs or does\
    \ not.\n\nEach of these keywords contains a block of code that runs if the condition\
    \ is true. If the `try` block produces an error, the method handles the error\
    \ using `try` and `catch` block. The code inside the `try` and `catch` keyword\
    \ is something we call protected code. The general syntax for exception handling\
    \ is:\n\n```csharp\ntry {\n    // try this code\n}\ncatch (ErrorName e1) {\n \
    \   // perform this code\n}\ncatch (ErrorName e2) {\n    // perform this code\n\
    }\ncatch (ErrorName eN) {\n    // perform this code\n}\nthrow (e1, e2…eN) {\n\
    \    // throw an error\n}\nfinally {\n    // perform this block no matter what\n\
    }\n```\n**NOTE:** You can create as many `catch` blocks as possible to handle\
    \ different types of errors.\n\n## Exception Classes\nError handling exceptions\
    \ in C# occur in their respective classes. These classes directly or indirectly\
    \ derive from the main `System.Exception` class some of which include `System.ApplicationException`\
    \ and `System.SystemException`.\n\n`System.ApplicationException` supports all\
    \ the errors produced by the application programs and thus programmers derive\
    \ their exceptions from this base class. For system-based exceptions, they are\
    \ from the `System.SystemException` class. The following are some of the common\
    \ predefined exceptions derived from the `System.SystemException` base class:\n\
    \n- `System.IO.IOException` – used to handle all Input/output errors.\n- `Syste.StackOverflowException`\
    \ – used to handle all errors created from stack overflow.\n- `System.DivideByZeroException`\
    \ – used to handle errors resulting from a division by zero.\n- `System.InvalidCastException`\
    \ – used to handle errors produced during type casting\n- `System.NullReferenceException`\
    \ – used to handle errors occurring during null object referencing\n- `System.OutOfMemeoryException`\
    \ – handles errors produced to insufficient free memory\n- `System.ArrayTypeMismatchException`\
    \ – used to handle errors produced when type is incompatible with the array type.\n\
    - `System.IndexOutOfRangeException` – handles errors produced when methods refer\
    \ to an index out of array range.\n\n# Section 13 File Input/output Operations\n\
    In this section, we are going to cover file input and output in C#. A file is\
    \ as a collection data stored in a computer using a specific name. For each file\
    \ stored in a computer, we can use an absolute path to access it. A stream is\
    \ a file that is open to reading and writing.A stream is a flow of bytes that\
    \ passes through the communication paths of a system. There are two main types\
    \ of data streams:\n\n- `Input stream` – used to read data from a file\n- `Output\
    \ stream` – used to write data to a file\n"
