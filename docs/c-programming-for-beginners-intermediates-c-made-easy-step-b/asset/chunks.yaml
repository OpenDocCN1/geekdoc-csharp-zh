    # 1: Passing by Value

    Parameter passing by value is the default mechanism for passing parameters during
    a function call. This mechanism involves creation of storage space for each of
    the required parameters thus copying the actual parameters into the locations.
    The Program illustrates this mechanism by using a `swap` method.![](Image00043.jpg)
    Once the above Program compiles, the following output displays.![](Image00044.jpg)
    This means that there is no change occurring in the values despite the values
    changing inside the function.


    # 2: Passing by Reference

    Parameter passing by reference involves passing the memory address of the actual
    variable. Unlike passing by value, the pass by reference method does not create
    new storage locations for the variables. In C#, we declare Reference parameters
    using the `ref` keyword. The Program below shows the usage of the pass by reference
    method call.![](Image00045.jpg) Once the above code compiles, the output shall
    display:![](Image00046.jpg) This indicates that the values of the variables are
    swapping inside the `swap` method thus reflecting in the `Main` method.


    # 3: Passing by Output

    As we have already seen, we use the `return` keyword to return one value from
    a method. Using the output parameters, we can return two values from a function.
    Pass by output works similarly as pass by reference, except they do transfer data
    into the method rather than into the method. Since this method may be intimidating
    for beginners, you can find more information here. [https://docs.microsoft.com/en-us/dotnet/csharp/language-reference/keywords/out-parameter-modifier]


    We have completed the Methods section. We have already covered topics such as
    method creation, method calls, and parameter passing. The best way to master these
    concepts through practice. For example, if you create a program, try adding your
    code in another method and only call it in the main method. This will help you
    understand and become comfortable with Methods.


    # Section 6: C# Arrays

    In this section, we are going to cover another important concept or data structure.
    Like most programming languages, C# allows us to create and work with arrays.
    Let us see what arrays are and how they work.


    We can classify Arrays as a group of related data that shares a memory location.
    We use Arrays to store a fixed-size sequential group of data of the same type.
    You can think of arrays as containers used to store variables of the same type
    in contiguous locations where the lowest location address stores the first element,
    and the highest address stores the last element.


    For example, if we wanted to store 100 numbers, we can do it the basic way – creating
    variables named `number0`, `number1`, `number2`…`number100`. However, this is
    tiresome and consumes a lot of memory. Another way would be to create an array
    of 100 elements and access each element by index. Let us see how to do this.


    ## Types of C# Arrays

    Before we get into the code, it is good to note that C# has certain types of arrays.
    They include:

    - Single dimensional Arrays

    - Multidimensional Arrays

    - Jagged Arrays

    - Param Arrays


    For the sake of simplicity, we are only going to cover single-dimensional arrays.


    ## Array Declaration

    To declare an array in C#, we adhere to the following syntax:

    ```

    datatype[] array_name;

    ```

    - We use the data type to define what type of data to store in the array.

    - In the square brackets `[]` – the rank or the size of array is passed. It specifies
    how many elements will be stored in the array.

    - `array_name` – specifies a unique name to identify the array. Always go for
    something creative but meaningful.


    For example, you can use the following arrays to store integer, double, or character
    values respectively:

    ```

    int[] myIntegers;

    double[] myValues;

    char[] myChars;

    ```

    NOTE: Once you declare the array, there will be no memory location created for
    it.


    ## Array Initialization

    As said, array declaration does not allocate memory. We need to initialize the
    array by creating an instance of the array. Since an array is a reference type,
    in C#, we use the keyword `new` to create the instance of the array. The syntax
    for array initialization is:

    ```

    datatype[] arrayName = new datatype[size];

    ```

    For example:

    ```

    int[] myIntegers = new int[100];

    double[] myValues = new double[100];

    char[] myChars = new char[26];

    ```


    ## Value Assignment and Indexing

    Once you have declared the array and it has initialized, we assign values into
    the array by using indexes. Array indexing starts at zero – this means if we have
    an array such as:

    ```

    double[] myArray = new double[10]

    ```

    The first number in the array is at index zero while the last element in the array
    is `arrayLength – 1`.

    To assign values we use the syntax:

    ```

    arrayName[index] = value;

    ```

    For example:![](Image00047.jpg) Once you have assigned a value to the array index,
    you can use it by simply using its index.

    NOTE: Unlike some programming languages such as Python, if you call the `Console.WriteLine(myArray)`,
    the class of the array will be printed – in this case, `System.Double`.


    ## Array Iteration – Foreach

    We can access all the array elements using a `for` loop or a `foreach` loop. Since
    we have already covered the `for` loop, we are going to look at the `foreach`
    statement.![](Image00048.jpg) Once the above code complete compiling, it will
    print each element in the array index. Since the `for` loop updates the array
    on each iteration, the array index does not repeat more than once. The output
    below illustrates that:![](Image0049.jpg) In this section, we have covered arrays
    and array operations. We have not covered Multidimensional arrays as they may
    end up being confusing especially if you fail to master single dimensional arrays.
    Ensure to master how to work with single-dimensional arrays before moving on to
    others.


    # Section 7: C# Strings and String Operations

    In previous sections of this guidebook, we have used C# strings as characters.
    However, the best way to work with strings is by declaring a string variable and
    storing the string required in the variable. This allows for string operations.
    NOTE: Strings are alias of `System.String` in C# and we use them to store a series
    of characters.


    ## How to Create C# String Objects

    In C#, we can create Strings using various methods in. We have already worked
    with some of these methods. They include:

    - Creating a string variable and store the string literal

    - By using the string concatenation operator

    - Using the `String` class

    - Method call that the return value is a string

    - Using a formatting method to convert the value or object to its corresponding
    string representation.


    NOTE: We are not going to discuss the above methods one one; instead, we are going
    to use a written program to illustrate how they work.![](Image0050.jpg) Once the
    above Program compiles, it shall give the following output.![](Image0051.jpg)


    ## String Properties

    C# string class has the following properties:

    - `Length` – We use the `length` property to get the number of characters in the
    specified `String` class.

    - `Chars` – We use this property to get the character at the given position in
    the String object.


    ## String Methods

    We have a wide range of methods that are compatible with the string object thus
    allowing programmers to perform various operations on strings. These methods are
    many and we may not cover all of them.


    1. `Compare`: We use the `compare` method to compare two strings and return an
    integer value to specify the relative position sorted according to order. The
    syntax for this method is:


    ```

    String.Compare(string1, string2, ignoreCase = true/false);

    ```

    You may encounter methods that allow you to pass other arguments such as `IgnoreCase`
    that ignores upper and lower cases when set to true.

