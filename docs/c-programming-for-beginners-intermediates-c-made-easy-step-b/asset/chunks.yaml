  trans: "\n\n下面的程序展示了如何使用 `for` 循环打印 40 到 50 之间的前 10 个数字![](img/Image00033.jpg)执行后，上述程序将显示如下结果：![](img/Image00034.jpg)当循环次数已知时，`for`\
    \ 循环非常高效。如果没有，建议使用 `while` 循环。\n\n## 2: while 循环\n我们使用 `while` 循环在条件为真时持续执行特定代码。编写\
    \ C# `while` 循环的语法为：\n\n```csharp\nwhile (condition) {\n    // 持续执行此代码\n    //\
    \ 循环计数器\n}\n```\n\n与 `for` 循环不同，`while` 循环可能一次都不执行。如果条件自动变为假，它将跳过循环体。下面是一个演示 `while`\
    \ 循环的 C# 程序。(Image00035.jpg)输出与 `for` 循环相似。如果你将条件改为小于 40 的数字，循环体将永远不会执行，因为条件始终为\
    \ 40。\n\n## 3: do…while 循环\n我们已经看到，在之前的两个循环中，条件是在循环体之前检查的。在 `do…while` 循环中，条件是在循环体结束后检查的。这确保了即使条件永远为假，循环体至少执行一次。`do…while`\
    \ 循环的语法为：\n\n```csharp\ndo {\n    // 循环体\n} while (condition);\n```\n\n注意，条件一直延伸到最后，因此确保了即使条件为假，循环也会在退出之前运行一次。另一方面，如果条件为真，循环将继续运行并使用循环计数器更新，直到其评估结果为假为止。下面的程序展示了如何使用\
    \ `do…while` 循环打印 40 到 50 之间的前 10 个数字。(Image00036.jpg)我们将条件改为等于或小于 40 的值，程序将运行一次并打印\
    \ `a` 的值。\n\n## 4: 嵌套循环\n与大多数编程语言一样，C# 允许我们在其他循环内部创建循环。嵌套循环可以是 `for` 循环内部的 `for`\
    \ 循环、`for` 循环内部的 `while` 循环、`do while` 循环和 `for` 循环等。然而，在使用多个循环时，要保持谨慎，以确保它们不会干扰程序逻辑。\n\
    \n在 `while` 循环内部编写 `while` 循环的语法为：\n\n```csharp\nwhile (condition) {\n    while\
    \ (condition) {\n        // 代码\n    }\n    // 代码\n}\n```\n\n嵌套 `for` 循环可以写为：\n\
    \n```csharp\nfor (initialization; condition; counter) {\n    for (initialization;\
    \ condition; counter) {\n        // 代码;\n    }\n    // 代码\n}\n```\n\n与其他循环一样，我们也可以在\
    \ `do while` 循环内部编写 `do…while` 循环，如下：\n\n```csharp\ndo {\n    // 代码\n    do {\n\
    \        // 代码\n    } while (condition);\n} while (condition);\n```\n\n## 5: C#\
    \ 循环控制\nC# 具有循环控制语句，允许我们从正常执行流之外改变循环的执行。以下是 C# 中可循环控制语句。\n\n1.  `break` 语句\n2.\
    \  `continue` 语句\n\n### 1: C# Break 语句\n我们在循环中使用 `break` 关键字跳出当前循环范围。如果在内部循环中遇到\
    \ `break` 关键字，它只会终止内部循环并将执行传递给其上一个前置循环。它也被用于之前讨论过的 `switch` 语句。下面的程序展示了在 `a` 的值更新到\
    \ 45 之后的 `break` 语句。(Image00037.jpg)\n\n### 2: C# Continue 语句\n`Continue` 语句与\
    \ `break` 语句相似，但不是强制终止循环，而是通过跳过中间的代码来强制循环继续迭代。`while` 和 `do…while` 循环中的 `Continue`\
    \ 语句强制循环控制移动到条件测试。在 `for` 循环中，`continue` 语句强制执行条件判断和循环计数器。(Image00038.jpg)\n\n\
    ## 6: C# 无限循环\n无限循环主要由于代码引起，但有时是有意创建的以消耗计算机的处理器能力。我们通过留空循环计数器创建无限循环，使条件始终为真并永远运行循环。下面是一个永远不会停止的\
    \ `for` 循环。(Image00039.jpg)\n如你所见，即使没有 `Console.ReadKey()` 函数，程序也不会关闭，因为它从未停止执行。\n\
    \n**注意**：某些 IDE（如 IntelliJ Rider）会注意到无限循环并向你警告或自动停止它。\n\n我们已经完成了控制流部分。循环起初可能很难掌握，但一旦你掌握了它们，它们就能解决很多问题。每天练习这些概念。寻找解决方案并修复它们。这是学习的唯一途径。尽管可能需要一些时间。\n\
    \n# 章节 5: C# 方法\n在编程中，方法指的是用于执行特定任务的具有相关逻辑的代码块。在 C++ 等语言中它们被称为函数，在 Java 等语言中被称为方法。每个\
    \ C# 程序必须包含至少一个方法，即 `Main`。在多次使用某段代码的情况下，方法非常有用。在本节中，我们将介绍如何使用 C# 创建自己的方法。\n在\
    \ C# 中使用方法之前，你需要执行以下步骤：\n\n1.  定义方法\n2.  调用方法\n\n## 方法定义\n这是使用方法的第一步。它包含了有效 C#\
    \ 方法的结构。有效 C# 方法由以下部分组成：\n\n*   **访问修饰符**：我们使用访问修饰符来指定如何访问方法，例如 `public`、`private`、`protected`、`internal`\
    \ 等。\n*   **返回值**：返回值定义了方法返回的数据类型，如整数、字符串和 `void`。\n*   **函数名**：通常用于调用方法的唯一名称。\n\
    *   **参数**：我们在方法调用期间可以传递的参数。\n*   **方法体**：这是执行方法任务所需的逻辑。\n\n有效 C# 方法的语法为：\n\n\
    ```csharp\n<访问修饰符> <返回值> <方法名> (参数) {\n    // 方法体\n    // 如果可用的返回值\n}\n```\n\n\
    我们已经在之前的程序中见过方法，例如 `main` 方法。(Image00040.jpg)\n让我们来看一个计算圆面积方法的示例程序。(Image0041.jpg)\n\
    \n## 方法调用\n声明方法后，你只需要通过调用方法名并传递必要的参数来使用方法。如果你未能传递方法所需的参数，程序执行过程将无法完成。例如，调用 `AreaOfCircle`\
    \ 方法时，我们如下所示传递半径。(Image0042.jpg)\n在上面的程序中，我们在调用方法时传递了圆的半径。事实上，我们在 C# 开发人员的 `WriteLine`\
    \ 方法内部传递了 `AreaOfCircle` 方法。这意味着如果参数匹配，我们可以在方法内部传递方法。\n\n"
