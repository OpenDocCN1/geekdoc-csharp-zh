    Calculator](#text00061.html_a2BJ)[Conclusion](#text00063.html_a2BS)Section 1Setup
    and InstallationIn this section, we are going to look at how to setup C# on your
    computer and start creating C# programs. Before we begin this environment installation,
    you need to meet a few requirements necessary for running the C# Integrated Development
    Environment (IDE). For compatibility issues and efficient execution of the programs,
    ensure that your computer meets the following requirements:❖         A 1.8Ghz
    and higher Processor – Preferably a 64-bit processor❖         Windows 7 Service
    Pack 1 and higher❖         4GB of RAM and above (6GB for better performance)❖
           Minimum Disk Space of at least 8GB to 210 GB depending on the features
    you want to be installed❖         Microsoft .NET Framework 4.5 and higher❖        
    For the initial setup, you need a relatively good internet speed.These basic requirements
    can determine whether C# will run smoothly on your System or not. If you have
    the above requirements, we can begin.How to install the .NET FrameworkThe very
    first action we are going to conduct is that of installing .NET Framework 4.5
    and higher. In this book, we are going to use version 4.7.To download the .NET
    framework, follow this link:[https://www.microsoft.com/en-us/download/details.aspx?id=55167](https://www.microsoft.com/en-us/download/details.aspx?id=55167)To
    begin the download, select your preferred language and click download. Once the
    download has completed, start the executable and begin the installation.NOTE:
    If you are running updated versions of Microsoft Windows 8.1 and above, you may
    have .NET already installed and you can go ahead and cancel the installation.
    If case it is not, complete the installation.Installing the IDE (C#)Here, we are
    going to cover the installation of the C# IDE that contains a text editor and
    C# compiler binaries. We are going to use the Microsoft Visual Studio (MVS) as
    the IDE.You can use a variety of MVS-environment alternatives such as Jetbrains,
    Rider, and Mono IDE but some of these may require a subscription, which is why
    this book does not cover these installations.Microsoft Visual Studio runs on Windows
    and Mac only (as of 2019). If you are a Linux user, you can download the Mono
    IDE, which is a very great alternative.To download the visual studio installer,
    go to the following addresses for Mac and Windows users respectively[https://visualstudio.microsoft.com/vs/mac/](https://visualstudio.microsoft.com/vs/mac/)[https://visualstudio.microsoft.com/vs/](https://visualstudio.microsoft.com/vs/)Download
    the free, Community Edition. In case of added features or commercial usage, you
    can purchase the Enterprise or Professional editions.![](Image00002.jpg)Once you
    get the installer, launch it, and wait until the initial setup completes and the
    visual studio installer launches.![](Image00003.jpg) Once done, another window
    such as the one shown below shall open:![](Image00004.jpg)Select the community
    version and click install. Another window will launch requesting you to select
    the features to include during the IDE installation process. For this case, we
    require the .NET desktop environment. Select it and click install. If you would
    like to install additional features, select them but ensure you have the required
    space for the installation.![](Image00005.jpg)Once you have selected the features
    to install, click install for the installation to begin. Wait until the process
    completes and then launch it.![](Image00006.jpg)NOTE: In this book, we may interchange
    between Microsoft visual studio and Jetbrains Rider, but the code will work on
    whichever development environment or Operating System you are using.In the previous
    section, we covered the requirements necessary to run C# programs as well as how
    to install the Environment you need to have in place in order to write C# code.
