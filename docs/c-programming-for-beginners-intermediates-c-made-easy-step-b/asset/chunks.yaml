    Now that we have covered the C# type casting, practice by trying to convert various
    data types to other data types and see if they are applicable.


    # C# Operators


    In programming, `Operators` refer to symbols or special characters that help a
    computer program perform a specific operation on the given variables. Being a
    robust and efficient programming language, C# contains several types of operators.
    They include:


    - Arithmetic Operators

    - Logical Operators

    - Relational Operators

    - Assignment Operators

    - Unary Operators

    - Bitwise Operators

    - Ternary Operators

    - Misc Operators


    In this section, we are going to explore these operators’ part-to-part. Let us
    get started.


    ## 1: Arithmetic Operators


    We use `Arithmetic` operators to perform mathematical operations on supported
    data types. The table below shows the supported arithmetic operators. In this
    example, take `x = 100` and `y = 200`.


    | Operator Symbol | Operation/Description | Example Operation |

    | :--- | :--- | :--- |

    | `+` | Addition – add two values to give a single output | `X + Y = 300` |

    | `-` | Subtraction – Returns the difference between second value from the first
    | `X – Y = -100`, `Y – X = 100` |

    | `*` | Multiplication – Returns the multiple of two operands | `X * Y = 20000`
    |

    | `/` | Division – returns the quotient of two specified operands | `Y / X = 2`
    |

    | `%` | Modulo – returns the remainder of a division operation | `Y % X = 0` |

    | `++` | Increment – Increases the value of the variable by one | `X++ = 101`,
    `Y++ = 201` |

    | `--` | Decrement – Decrease the value of a given variable by one | `X-- = 99`,
    `Y-- = 199` |


    ![](Image00024.jpg)


    ## 2: Logical Operators


    We use `Logical` operators to perform logical comparisons on given variables.
    The results of logical operators are `Boolean` types, i.e., `true` or `false`.
    The following table shows C# supported logical operators.


    | Operator Symbol | Operation/Description | Example Operation |

    | :--- | :--- | :--- |

    | `&&` | Logical AND – Evaluates to true if both values are non-zero or both expressions
    evaluate to true | `True && True = True`, `False && True = False`, `False && False
    = False` |

    | `||` | Logical OR – Evaluates to true if either of the operands is non-zero
    or either of the expressions is true. The reverse is true | `True || False = True`,
    `True || True = True`, `False || False = False` |

    | `!` | Logical NOT – Returns the reverse of the initial logical state. | `!(True
    && True) = False`, `!(False && False) = True`, `!(True || False) = False` |


    ![](Image00025.jpg)


    ## 3: Relational Operators


    We use `Relational` operators to perform relational operations on numerical values.
    See the relational operators supported by C# in the table below: Take `x = 100`
    and `y = 200`.


    | Operator Symbol | Operation/Description | Example Operation |

    | :--- | :--- | :--- |

    | `==` | Equal to = Returns true if the given operands/expressions are equal and
    false if not | `X == y = false` |

    | `!=` | Not Equal to – Returns true if the given operands/expressions are not
    equal to and false if they are equal | `X != Y = true` |

    | `>` | Greater than – Returns true if the left-hand operand/ expression is greater
    than the left-hand operand/expression. False if not | `X > Y = false` |

    | `<` | Less than – Returns true if the left-hand operand/expression is less than
    the right-hand operand/expression. False if otherwise | `X < Y = true` |

    | `>=` | Greater than or equal to – returns true if the left-hand operand/expression
    is greater than or equal to the right-hand expression/operand | `X >= Y = false`
    |

    | `<=` | Less than or Equal to – returns True if the left-hand operand/expression
    is less than or equal to the right-hand operand/expression | `X <= Y = true` |


    ## 4: Assignment Operators


    We use the assignment operators to assign the value of the right-hand operand
    to the left-hand operands. These operands could be raw data, variable, an indexer,
    or a property. The value assigned to the left-hand operands translates to the
    result of that specific expression.


    **NOTE**: The data types of the right-hand operands must be compatible with the
    left-hand operand and corresponding operation. The table below shows the supported
    C# assignment operators.


    | Operator Symbol | Operation/Description | Example Operation |

    | :--- | :--- | :--- |

    | `=` | Simple Assignment – Assigns the value on the right-hand to the left-hand
    operands | `x = a + b` |

    | `+=` | Add AND – Adds the value of the right-hand to the left-hand operand and
    result assigned to the left-hand operand | `a += b` is same as `a = a + b` |

    | `-=` | Subtract AND – Subtracts the right-hand operand from the left-hand operand
    and result assigned to the left-hand operand | `a -= b` is same as `a = a - b`
    |

    | `*=` | Multiply AND – Multiplies the right-hand operand with the left-hand operand
    and result assigned to the left-hand operand | `a *= b` is same as `a = a * b`
    |

    | `/=` | Divide AND – Divides the right-hand operand from the left-hand operand
    and result assigned to the left-hand operand | `a /= b` is same as `a = a / b`
    |

    | `%=` | Modulus – Performs modulus on the two operands and assigns to the left-hand
    operand | `a %= b` is same as `a = a % b` |

    | `<<=` | Left Shift – Shifts the bits in the expression to the left by the number
    of positions | `a <<= b` |

    | `>>=` | Right Shift – Shifts the bits in the expression to the right by the
    number of positions | `a >>= b` |

    | `&=` | Bitwise AND – Performs comparison on each bit of the first to the second
    | `a &= b` |

    | `^=` | Bitwise XOR – Compares each bit of the first operand to the second operand
    | `a ^= b` |

    | `|=` | Bitwise OR – Inclusive OR using the OR condition | `a |= b` |


    **NOTE**: This book does not cover Shifts and Bitwise Operators mentioned at the
    beginning as doing so may require knowledge about bit-by-bit operations.


    ## 5: Precedence


    Operator precedence refers to the order in which operators are performed. C# and
    many other programming languages require operator precedence to determine which
    action should be performed first, second, until the last in the case of more than
    one.


    Example: Take an expression such as `7 + 3 * 10 - 16 / 8 + 100`. This expression
    can have various results. If you type the expression in C#, the result will be
    `135`. This is because the operators with higher precedence are evaluated first.
    ![](Image00027.jpg)


    The table below show C# operator precedence by category.


    | Operator Category | Operators Included | Associativity |

    | :--- | :--- | :--- |

    | Postfix | `()` `[]` `->` `.` `++` `--` | Left to Right |

    | Unary | `+` `-` `!` `~` `++` `--` `sizeof` `&(type)*` | Right to Left |

    | Multiplicative | `%` `/` `*` | Right to Left |

    | Additive | `+` `-` | Left to Right |

    | Shift | `>>` `<<` | Right to Left |

    | Relational | `<` `<=` `>` `>=` | Left to Right |

    | Equality | `==` `!=` | Left to Right |

    | Bitwise AND | `&` | Left to Right |

    | Bitwise XOR | `^` | Left to Right |

    | Bitwise OR | `|` | Left to Right |

    | Logical OR | `&&` | Left to Right |

    | Logical AND | `||` | Left to Right |

    | Conditional | `?:` | Right to Left |

    | Assignment | `=` `+=` `-=` `*=` `/=` `%=` `>>=` `<<=` `&=` `^=` `|=` | Right
    to Left |

