  trans: "\n\n# 静态多态\n在静态多态中，方法的响应是在编译期间确定的。我们称早期绑定或静态绑定。C# 的静态多态有两种状态：\n\n## 1. 运算符重载\n\
    运算符重载是指创建用户定义的类似运算符的函数。重载运算符是带有 `operator` 关键字且在函数名后跟随运算符定义符号的函数。像任何其他函数一样，它们包含返回值和参数。下面是一个说明运算符重载的程序部分。\n\
    \n![](img/Image00061.jpg)\n\n## 2. 函数重载\n函数重载是指在同一作用域内具有相同名称两个或多个函数的概念。然而，这些方法必须在类型和参数数量上有所区别。\n\
    \n## 3. 动态多态\n动态多态的确定发生在运行时。动态多态利用了 C# 创建 `abstract` 类和 `virtual` 虚函数的能力。`abstract`\
    \ 类提供了接口的部分类操作，在派生类继承它时完成实现。`abstract` 类的方法也是 `abstract` 的，并且仅供派生类应用。`abstract`\
    \ 类的不能实例化，也不能在抽象类之外声明方法。\n\n`virtual` 虚函数位于你想要实现的派生类中。由于 `virtual` 函数的调用是在运行时确定的，你可以在不同的派生类上以不同的方式应用它们。\n\
    \n# 第 11 节接口\n在编程中，`Interfaces` 是继承类与接口之间的逻辑契约。继承类包含了契约的“如何做”部分，而接口定义了契约的“是什么”部分。我们可以使用\
    \ `Interfaces` 来定义作为接口成员的方法、事件、属性，且它们只能包含这些成员的声明。继承类处理这些成员的定义。当仅由基类声明了少数方法，且继承类实现相同的功能时，`abstract`\
    \ 类可以起到相同的作用。\n\n## 接口声明\n在 C# 中，我们使用 `interface` 关键字后跟接口名称来进行接口声明。接口声明与类声明相似，并且默认是公共的。下面的代码是一个接口声明示例：\n\
    \n```csharp\npublic interface circle{\n    // members\n    double radius;\n  \
    \  const double PI = 3.14159;\n}\n```\n\n# 第 12 节 C# 错误处理\n错误处理是一个非常重要的概念，它允许程序员在错误发生之前预判并处理程序中的错误。我们也称之为异常处理。与大多数编程语言一样，C#\
    \ 允许程序员处理程序中的错误。让我们简要介绍这些概念。\n\n`Exceptions` 允许程序员将执行控制权从程序的某部分转移到另一部分。我们使用三个主要的关键字利用异常或错误处理。程序中发生的错误就是“异常”。\n\
    \n- `try` – 包含你尝试运行的代码块，以检查其在有或无错误的情况下是否运行\n- `catch` – 这是 `try` 语句之前的语句。它包含处理由\
    \ `try` 语句触发的错误的代码块。它表示捕获并处理错误。\n- `throw` – 用于在程序中一旦错误出现就抛出错误。\n- `finally` –\
    \ 包含无论是否发生错误都会执行的代码块。例如，在打开文件时，无论是否发生错误都必须关闭它。\n\n这些关键字每一个包含一个在条件为真时运行的代码块。如果\
    \ `try` 块产生错误，方法将使用 `try` 和 `catch` 块处理错误。`try` 和 `catch` 关键字内部的代码是运行所说的保护代码。异常处理的通用语法为：\n\
    \n```csharp\ntry {\n    // try this code\n}\ncatch (ErrorName e1) {\n    // perform\
    \ this code\n}\ncatch (ErrorName e2) {\n    // perform this code\n}\ncatch (ErrorName\
    \ eN) {\n    // perform this code\n}\nthrow (e1, e2…eN) {\n    // throw an error\n\
    }\nfinally {\n    // 无论如何都执行此块\n}\n```\n**注意：** 你可以创建多的 `catch` 块来处理不同类型的错误。\n\
    \n## 异常类\nC# 中的错误处理异常发生在各自的类中。这些类直接或间接地派自主 `System.Exception` 类，其中包含 `System.ApplicationException`\
    \ 和 `System.SystemException`。\n\n`System.ApplicationException` 支持应用程序产生的所有错误，因此程序员从这个基类派生他们的异常。对于基于系统的异常，它们来自\
    \ `System.SystemException` 类。以下是派自 `System.SystemException` 基类的一些常见预定义异常：\n\n\
    - `System.IO.IOException` – 用于处理所有输入/输出错误。\n- `Syste.StackOverflowException` –\
    \ 用于处理所有由栈溢出产生的错误。\n- `System.DivideByZeroException` – 用于处理除零引起的错误。\n- `System.InvalidCastException`\
    \ – 用于处理类型转换过程中产生的错误。\n- `System.NullReferenceException` – 用于处理空对象引用期间发生的错误。\n\
    - `System.OutOfMemeoryException` – 处理因可用内存不足产生的错误。\n- `System.ArrayTypeMismatchException`\
    \ – 用于处理类型与数组类型不兼容产生的错误。\n- `System.IndexOutOfRangeException` – 处理方法引用超出数组范围索引时产生的错误。\n\
    \n# 第 13 节文件输入/输出操作\n在本节中，我们将涵盖 C# 中的文件输入和输出。文件是存储在计算机中具有特定名称的数据集合。对于计算机中存储的每个文件，我们可以使用绝对路径来访问它。流是打开读取和写入的文件。流是通过系统通信路径的字节流。数据流主要有两种类型：\n\
    \n- `Input stream` – 从文件读取数据\n- `Output stream` – 将数据写入文件\n\n"
- fmt: '

    These two types of streams help in reading and writing of files.


    # Input/output Classes in C#


    C# has various classes used to perform file operations such as file creation,
    file deletion, read and write to files, and close files. The `System.IO` namespace
    normally maintains these classes. Commonly used file I/O classes under `System.IO`
    include:


    - `File`: Helps in file manipulation operations

    - `Path`: Used to perform operations on the path information

    - `Directory`: used in directory structure manipulation

    - `FileInfo`: Used to perform the supported operations on a file

    - `DirectoryInfo`: performs operations on directories.

    - `BinaryReader`: used to read original data in a binary stream.

    - `BinaryWriter`: used to write the original data in binary format

    - `DriveInfo`: Used to fetch information about the storage drives

    - `StreamReader`: used when reading primitive characters in a byte stream

    - `StreamWriter`: used when writing primitive characters in a byte stream

    - `StringReader`: used for reading in a string buffer

    - `StringWriter`: used for writing in a string buffer

    - `MemoryStream`: used for random data access to the streamed data stored in the
    memory

    - `BufferedStream`: used for temporary storage for a stream of bytes


    # FileStream Class Operations


    We use the `FileStream` class contained in the `System.IO` namespace when performing
    file operations such as reading, writing, and closing files. It comes from the
    abstract class `Stream` in C#.


    To use the `FileStream` class, you must create an instance of the class by creating
    a new file or opening an existing one. We use the following syntax to create an
    instance of the class `FileStream`.


    ```

    Filestream <object instance name> = new Filestream(<filename> <Filemode.Enumerator>,
    <Fileaccess enumerator, <Fileshare enumerator>);

    ```


    For example, the code below is used to read a file `file.txt`:


    ```c

    FileStream F = new FileStream("file.txt", FileMode.Open, FileAccess.Read, FileShare.Read);

    ```


    The following are values of the parameters of an instance of object:

    - `File mode` parameter values

    - `File Access` parameter values

    - `File share` parameter values


    ## 1: FileMode Parameter values


    We normally use the `FileMode` parameter or enumerator to define the method for
    opening the specified file. These methods include:


    1. `Create`: used to create a new file of the name specified.

    2. `Open`: used to open an existing file of the name specified; you should give
    the `Full path` of the file.

    3. `Append`: Used to open an existing file with the given name and append the
    cursor at the end of the file. It also creates a new file if the specified file
    does not exist.

    4. `Truncate`: Used to open a file and truncate the file size to zero bytes.

    5. `CreateNew`: used to specify to the current operating System as to create a
    new file


    ## 2: FileAccess Parameter values


    We use `FileAccess` parameter to specify the access mode of the file. The methods
    for this parameter are:


    1. `Read`: opens a file in read-only mode

    2. `ReadWrite`: opens a file in read/write mode

    3. `Write`: opens a file in write mode


    ## 3: FileShare Parameter Values


    `FileShare` parameters contain the following methods:


    1. `Read`: used to open files for reading

    2. `Write`: opens a file for writing

    3. `ReadWrite`: used to open file reading and writing

    4. `Inheritable`: Used to allow the passing of inheritance from file handle to
    child process.

    5. `None`: used to deny sharing of the file


    The Program below shows the usage of `FileStream` class.

    ![](Image00062.jpg)


    # Step by Step Console Calculator


    In this section, we are going to create a simple console calculator that allows
    users to perform various operations on numbers. The code implemented by the `Program`
    encapsulates everything we have covered throughout this guidebook and you can,
    therefore, practice what you have learned thus far by creating this `Program`.
    Since the code below has comments, we shall not discuss it part by part.

    ![](Image00063.jpg)

    ![](Image00064.jpg)

    ![](Image00065.jpg)

    ![](Image00066.jpg)

    ![](Image00067.jpg)


    We have completed our discussion of C# file operations. These file operations
    are very important and require a lot of practice to master. Keep developing programs
    so that you can test and practice the new C# skills you have learned. Practice
    is the only way to master C# and all other programming languages.


    # Conclusion


    Thank you for reading this guide. We hope that the guidebook has shown you just
    how easy it is to master C# once you master the core basics discussed in this
    guide; as mentioned severally, to become a better C# programmer, you need to practice
    as often and as consistently as possible. The more you program and work within
    programs, the faster your programming skills shall develop, and the quicker you
    shall be able to create C# programs that provide real solutions. Please leave
    a review for this book on Amazon by visiting the page below:[https://amzn.to/2VMR5qr](https://amzn.to/2VMR5qr)


    Your Gift

    Let me help you master this and other programming languages quickly. Visit[https://bit.ly/codetutorials](https://bit.ly/codetutorials)
    To Find Out More

