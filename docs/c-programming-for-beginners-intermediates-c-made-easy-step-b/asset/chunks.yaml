    既然已经涵盖了 C# 类型转换，现在通过尝试将各种数据类型转换为其他数据类型并查看是否适用来进行练习。


    # C# 运算符


    在编程中，`Operators`指的是符号或特殊字符，它们帮助计算机程序对给定的变量执行特定操作。作为一种健壮且高效的编程语言，C# 包含了多种运算符。它们包括：


    - 算术运算符

    - 逻辑运算符

    - 关系运算符

    - 赋值运算符

    - 一元运算符

    - 位运算符

    - 三元运算符

    - 杂项运算符


    在本节中，我们将逐部分探索这些运算符。让我们开始吧。


    ## 1: 算术运算符


    我们使用`Arithmetic`算术运算符对支持的数据类型执行数学运算。下表显示了支持的算术运算符。在此示例中，取 `x = 100` 和 `y = 200`。


    | 运算符符号 | 操作/描述 | 示例操作 |

    | :--- | :--- | :--- |

    | `+` | 加法 – 将两个值相加得到单个输出 | `X + Y = 300` |

    | `-` | 减法 – 返回第一个值减去第二个值的差 | `X – Y = -100`, `Y – X = 100` |

    | `*` | 乘法 – 返回两个操作数的乘积 | `X * Y = 20000` |

    | `/` | 除法 – 返回两个指定操作数的商 | `Y / X = 2` |

    | `%` | 取模 – 返回除法运算的数 | `Y % X = 0` |

    | `++` | 递增 – 将变量的值加 1 | `X++ = 101`, `Y++ = 201` |

    | `--` | 递减 – 将给定变量的值减 1 | `X-- = 99`, `Y-- = 199` |


    ![](img/Image00024.jpg)


    ## 2: 逻辑运算符


    我们使用`Logical`逻辑运算符对给定的变量执行逻辑比较。逻辑运算符的结果是 `Boolean` 类型，即 `true` 或 `false`。下表显示了
    C# 支持的逻辑运算符。


    | 运算符符号 | 操作/描述 | 示例操作 |

    | :--- | :--- | :--- |

    | `&&` | 逻辑与 – 当两个值都非零或两个表达式都为真时，结果为真 | `True && True = True`, `False && True
    = False`, `False && False = False` |

    | `||` | 逻辑或 – 如果任一操作数非零或任一表达式为真，则结果为真。反之亦然 | `True || False = True`, `True ||
    True = True`, `False || False = False` |

    | `!` | 逻辑非 – 返回初始逻辑状态的反转 | `!(True && True) = False`, `!(False && False) = True`,
    `!(True || False) = False` |


    ![](img/Image00025.jpg)


    ## 3: 关系运算符


    我们使用`Relational`关系运算符对数值执行关系运算。见下表所示的 C# 支持的关系运算符：取 `x = 100` 和 `y = 200`。


    | 运算符符号 | 操作/描述 | 示例操作 |

    | :--- | :--- | :--- |

    | `==` | 等于 = 如果给定的操作数/表达式相等则返回 true，否则返回 false | `X == y = false` |

    | `!=` | 不等于 – 如果给定的操作数/表达式不相等则返回 true，相等则返回 false | `X != Y = true` |

    | `>` | 大于 – 如果左侧操作数/表达式大于右侧操作数/表达式，则返回 true。否则 false | `X > Y = false` |

    | `<` | 小于 – 如果左侧操作数/表达式小于右侧操作数/表达式，则返回 true。否则 false | `X < Y = true` |

    | `>=` | 大于等于 – 如果左侧操作数/表达式大于或等于右侧表达式/操作数，则返回 true | `X >= Y = false` |

    | `<=` | 小于等于 – 如果左侧操作数/表达式小于或等于右侧操作数/表达式，则返回 True | `X <= Y = true` |


    ## 4: 赋值运算符


    我们使用赋值运算符将右侧操作数的值赋值给左侧操作数。这些操作数可以是原始数据、变量、索引器或属性。赋值给左侧操作数的值相当于该特定表达式的结果。


    **注意**：右侧操作数的类型必须与左侧操作数及相应的操作兼容。下表显示了支持的 C# 赋值运算符。


    | 运算符符号 | 操作/描述 | 示例操作 |

    | :--- | :--- | :--- |

    | `=` | 简单赋值 – 将右侧的值赋值给左侧操作数 | `x = a + b` |

    | `+=` | 加法赋值 – 将右侧的值加到左侧操作数，并将结果赋值给左侧操作数 | `a += b` 等于 `a = a + b` |

    | `-=` | 减法赋值 – 从左侧操作数中减去右侧操作数，并将结果赋值给左侧操作数 | `a -= b` 等于 `a = a - b` |

    | `*=` | 乘法赋值 – 将右侧操作数与左侧操作数相乘，并将结果赋值给左侧操作数 | `a *= b` 等于 `a = a * b` |

    | `/=` | 除法赋值 – 将左侧操作数除以右侧操作数，并将结果赋值给左侧操作数 | `a /= b` 等于 `a = a / b` |

    | `%=` | 取模赋值 – 将左侧操作数对右侧操作数取模，并将结果赋值给左侧操作数 | `a %= b` 等于 `a = a % b` |

    | `<<=` | 左移 – 将表达式中的位向左平移指定的位数，并将结果赋值给左侧操作数 | `a <<= b` 等于 `a = a << b` |

    | `>>=` | 右移 – 将表达式中的位向右平移指定的位数，并将结果赋值给左侧操作数 | `a >>= b` 等于 `a = a >> b` |

    | `&=` | 位与赋值 – 对第一个操作数与第二个操作数进行位与运算并将结果赋值给左侧操作数 | `a &= b` 等于 `a = a & b` |

    | `^=` | 位异或赋值 – 对第一个操作数与第二个操作数进行位异或运算并将结果赋值给左侧操作数 | `a ^= b` 等于 `a = a ^ b` |

    | `|=` | 位或赋值 – 使用位或运算处理第一个操作数与第二个操作数并将结果赋值给左侧操作数 | `a |= b` 等于 `a = a | b` |


    **注意**：本书未涵盖开头提到的位移位运算符，因为这需要位运算知识。


    ## 5: 优先级


    运算符优先级指的是执行运算符的顺序。C# 和许多其他编程语言需要优先级来确定在存在多个运算符时应该先执行哪一个操作。


    示例：取表达式 `7 + 3 * 10 - 16 / 8 + 100`。该表达式可能有不同的结果。如果你在 C# 中输入该表达式，结果将是 `135`。这是因为优先级更高的运算符先执行。(Image00027.jpg)


    下表按类别显示 C# 运算符优先级。


    | 运算符类别 | 包含的运算符 | 结合性 |

    | :--- | :--- | :--- |

    | 后置 | `()` `[]` `->` `.` `++` `--` | 从左到右 |

    | 一元 | `+` `-` `!` `~` `++` `--` `sizeof` `&(type)*` | 从右到左 |

    | 乘法 | `%` `/` `*` | 从右到左 |

    | 加法 | `+` `-` | 从左到右 |

    | 移位 | `>>` `<<` | 从右到左 |

    | 关系 | `<` `<=` `>` `>=` | 从左到右 |

    | Equality | `==` `!=` | 从左到右 |

    | 位与 | `&` | 从左到右 |

    | 位异或 | `^` | 从左到右 |

    | 位或 | `|` | 从左到右 |

    | 逻辑或 | `&&` | 从左到右 |

    | 逻辑与 | `||` | 从左到右 |

    | 条件运算符 | `?:` | 从右到左 |

    | 赋值 | `=` `+=` `-=` `*=` `/=` `%=` `>>=` `<<=` `&=` `^=` `|=` | 从右到左 |


    '
- fmt: "\nIn this section, we have learned the building blocks of the C# programming\
    \ language. We have discussed the basic structure of a basic C# program as well\
    \ as how each concept relates to the other in C#. Try to recreate simple programs\
    \ of your own so that you can get a better understanding of the above concepts.\n\
    \n# Section 4 C# Control-Flow Operations\n\nIn this section, we are going to discuss\
    \ another important concept of the C# programming language. We are going to cover\
    \ control flow operations that help us control how the `Program` executes based\
    \ on certain conditions. To master C#, you need to understand variables and data\
    \ types – discussed in the previous section.\n\n## Decision Making in C#\n\nDecision\
    \ making in C# and most programming languages allow the programmer to specify\
    \ a certain condition to be tested in the `Program`. Once the condition is tested,\
    \ the `Program` performs a task based on the result of the condition. The result\
    \ of the tested condition is either true or false, where a different task is performed\
    \ if either condition is true or false.\n\nC# utilizes the following statements\
    \ in decision-making:\n- `If` statements\n- `If…else` statements\n- `If…else if…else`\
    \ statements\n- `Nested if` statements\n- `Switch` statements\n- `Nested switch`\
    \ statements\n\n### 1: C# if statements\n\nThis is the most basic conditional\
    \ testing statement and performs an action if the tested condition is true. The\
    \ basic syntax is:\n\n```csharp\nif (condition) {\n    //perform this action\n\
    }\n```\n\nBelow is a C# program illustrating the structure of the if statements.\
    \ In the above code, the value of variable `a` is 200. In the second section,\
    \ we are testing whether `200 mod 2 == 0`. Since 200 is evenly divisible by 2\
    \ without a remainder, the condition is true and the text “Number is even” is\
    \ printed on the screen. If you change the value of `a` to 101 or another odd\
    \ number, the condition `a % 2 == 0` will return false, and no code is executed.\n\
    \n### 2: C# if…else statements\n\nThe other decision-making statement is the `if..else`\
    \ statement. The `if else` statement is similar to the `if` statement with the\
    \ capability of performing an action if the condition is true. The general syntax\
    \ is:\n\n```csharp\nif (condition) {\n    // perform this action if true\n} else\
    \ {\n    // perform this action is false\n}\n```\n\nLet us modify the `Program`\
    \ above to perform an action if the number provided is not even.\n\n### 3: if…else\
    \ if…else statements\n\nThis is a very common type of decision-making statement\
    \ used to test for more than one condition. For example, we can test if the number\
    \ is even or not. If it is even, then print “Even number”, else if the number\
    \ is odd, print the remainder of the division and if not, print “Invalid number”.\
    \ Look at the `Program` below.\n\n### 4: Nested if…else if…else statements\n\n\
    We use `Nested` statements to check for checking multiple conditions using a single\
    \ or close condition. For example, you can create a grading system that prints\
    \ the `Grade` according to marks:\n- Greater than or equal to 80 – “A”\n- Greater\
    \ than or equal to 70 – “B”\n- Greater than or equal to 50 – “C”\n- Less than\
    \ 50 – “D”\n\n### 5: Switch Statements\n\nWe use the `switch` statement to perform\
    \ an action based on a single condition. It is very similar to the nested `if…else\
    \ if` statements. Switch statements use the `case` keyword when passing the condition\
    \ to be tested. The general syntax is shown below:\n\n```csharp\nswitch (expression)\
    \ {\n    case <condition>:\n        // perform action;\n        break;\n    case\
    \ <condition 2>:\n        // perform action;\n        break;\n    case <condition\
    \ 3>:\n        // perform action\n        break;\n    ...\n    default:\n    \
    \    // perform action if all cases are false;\n        break;\n}\n```\n\nEach\
    \ condition in the `case` statement is tested until one evaluates to true. If\
    \ neither of the conditions are matched, the `default` condition is executed.\n\
    \n**NOTE:** Each `case` statement must end with a `break` statement to break out\
    \ of the loop once the condition returns true.\n\n### 6: Nested Switch statements\n\
    \nYou can have more than one `switch` statement nested inside the other. It is\
    \ also possible to have `switch` statements inside `if` statements and vice versa.\
    \ In case of nesting `switch` and `if` statements, ensure that you end the loop\
    \ or the `Program` will run forever.\n\n# C# Loops\n\nIn programming, we use `Loops`\
    \ when executing a block of code more than once. Loops allow programmers to execute\
    \ a set of code sequentially provided a given condition is true. Like most programming\
    \ languages, C# allows us to utilize loops in our programs. C# has two main types\
    \ of loop statements and two secondary loop statements. They include:\n- `For`\
    \ loop\n- `While` loop\n- `do…while` loop\n- `nested loops`\n\n### 1: The For\
    \ loop\n\nThe `for` loop is a statement used to perform a certain condition a\
    \ specific number of times. C# `for` loop statement is very similar to that of\
    \ C and C++. The syntax for the `for` loop is:\n\n```csharp\nfor (initialization;\
    \ condition; loop_counter) {\n    // condition statement\n}\n```\n\nThe first\
    \ step, `initialization`, initializes the loop that includes loop control variable\
    \ declaration and initialization. The second step, `condition`, sets the condition\
    \ that the loop will use to evaluate which code will execute. If the condition\
    \ is true, the code inside the curly braces executes. Otherwise, perform another\
    \ action. The third step is the `loop counter`. We use the `loop counter` to update\
    \ the condition per each iteration. The `loop counter` utilizes the unary operators\
    \ for loop update.\n\nThe following is a summary of how the `for` loop works:\n\
    1. The `initialization` step runs only once.\n2. The `condition` evaluates, and\
    \ the loop body executes if it is true.\n3. Loops jump back to the `loop counter`\
    \ and update the `loop condition` and run again.\n4. The process repeats until\
    \ the `condition` becomes false and loops exits.\n"
