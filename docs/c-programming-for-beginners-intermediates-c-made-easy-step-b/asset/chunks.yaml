    这两种流有助于文件的读取和写入。


    # C# 中的输入/输出类


    C# 拥有各种类用于执行文件操作，如创建文件、删除文件、读写文件以及关闭文件。`System.IO` 命名空间通常维护这些类。`System.IO` 下常用的文件
    I/O 类包括：


    - `File`: 帮助进行文件操作。

    - `Path`: 用于对路径信息操作。

    - `Directory`: 用于目录结构操作。

    - `FileInfo`: 用于对文件执行支持的操作。

    - `DirectoryInfo`: 对目录执行操作。

    - `BinaryReader`: 用于从二进制流中读取原始数据。

    - `BinaryWriter`: 用于以二进制格式写入原始数据。

    - `DriveInfo`: 用于获取存储驱动器的信息。

    - `StreamReader`: 用于在字节流中读取原始字符。

    - `StreamWriter`: 用于在字节流中写入原始字符。

    - `StringReader`: 用于从字符串缓冲区中读取。

    - `StringWriter`: 用于向字符串缓冲区中写入。

    - `MemoryStream`: 用于对存储在内存中的流数据进行随机数据访问。

    - `BufferedStream`: 用于字节流的临时存储。


    # FileStream 类操作


    我们在执行读取、写入和关闭文件等文件操作时，使用 `System.IO` 命名空间中的 `FileStream` 类。它来自 C# 中的抽象类 `Stream`。


    要使用 `FileStream` 类，必须通过创建新文件或打开现有文件来创建类的实例。我们使用以下语法来创建 `FileStream` 类实例。


    ```

    Filestream <object instance name> = new Filestream(<filename> <Filemode.Enumerator>,
    <Fileaccess enumerator, <Fileshare enumerator>);

    ```


    例如，下面的代码用于读取文件 `file.txt`：


    ```c

    FileStream F = new FileStream("file.txt", FileMode.Open, FileAccess.Read, FileShare.Read);

    ```


    以下是对象实例参数的值：

    - `File mode` 参数值

    - `File Access` 参数值

    - `File share` 参数值


    ## 1: FileMode 参数值


    我们通常使用 `FileMode` 参数或枚举来定义打开指定文件的方法。这些方法包括：


    1. `Create`: 用于创建指定名称的新文件。

    2. `Open`: 用于打开指定名称的现有文件；你应该提供文件的 `Full path`。

    3. `Append`: 用于打开给定名称的现有文件并将光标移动到文件末尾。如果指定的文件不存在，它也会创建一个新文件。

    4. `Truncate`: 用于打开文件并将文件大小截断为零字节。

    5. `CreateNew`: 指定当前操作系统创建一个新文件。


    ## 2: FileAccess 参数值


    我们使用 `FileAccess` 参数来指定文件的访问模式。该参数的属性有：


    1. `Read`: 以只读模式打开文件。

    2. `ReadWrite`: 以读/写模式打开文件。

    3. `Write`: 以写模式打开文件。


    ## 3: FileShare 参数值


    `FileShare` 参数包含以下方法：


    1. `Read`: 用于打开文件进行读取。

    2. `Write`: 用于打开文件进行写入。

    3. `ReadWrite`: 用于打开文件的读写。

    4. `Inheritable`: 用于允许从文件句柄传递继承到子进程。

    5. `None`: 用于拒绝共享文件。


