  \n![](img/image-04YSW843.jpg)\n\n# 10.9 总结\n\n当只有少数可能的结果时，`if-else` 语句是做出决策的可靠方法。然而，当评估产生许多潜在结果时，这种方法可能会变得繁琐。在这种情况下，`switch`\
  \ 语句是 C# 中实现流控制逻辑的更好选择。在许多情况下，可以使用 `switch` 表达式进一步简化 `switch` 语句。\n\n# 11 使用 for\
  \ 语句循环\n\n本章将继续介绍 `for` 语句。\n\n## 11.1 为什么需要循环？\n\n计算机通常擅长重复性任务。如果你需要执行此操作 100 次甚至\
  \ 10,000 次会发生什么？编写 C# 代码将是不可接受的。\n\n`for` 循环的语法如下：\n\n```csharp\nfor (initializer;\
  \ conditional expression; loop expression)\n```\n\n`initializer` 初始化计数器变量。例如，将其设置为零。\n\
  \n`conditional expression` 指定用于测试，以验证循环是否已执行了所需的迭代次数。例如，如果我们想循环 100 次：\n\n`loop\
  \ expression` 指定在计数器上执行的操作。例如，递加 1：\n\n循环每次迭代中要执行的语句体包含在由左大括号 `{` 和右大括号 `}` 定义的代码块中。通过将所有这些整合在一起，我们可以创建一个\
  \ for 循环来执行前面示例中概述的任务：\n\n```csharp\nlong j = 1;\nfor (int i=0; i<50; i++) {\n \
  \   j += j;\n}\nConsole.WriteLine(\"j = \" + j);\n```\n\n## 11.2 C#\n\n### 循环作用域\n\
  \n创建循环的一个关键点是，循环内部定义的任何变量对循环内部的代码可见。这种概念被称为作用域（scope）。例如，如果在 `for` 循环体内定义了变量 `myCounter`，则该变量在循环终止后将消失：\n\
  \n```csharp\n//变量 myCounter 尚未存在\nfor (int i = 0; i < 10; i++)\n{\n    int myCounter\
  \ = 0; //myCounter 在 for 循环的作用域内\n    myCounter += i;\n}\n\n// 循环结束后 myCounter 超出作用域并消失\n\
  ```\n\n## 11.3 创建无限 for 循环\n\n可以使用 `for(;;)` 语法构建无限执行的 for 循环。例如，下面的代码将在用户手动终止程序（或关闭或重启计算机）之前，持续输出“Hello\
  \ from C#”：\n\n```csharp\nfor (;;)\n{\n    Console.WriteLine(\"Hello from C#\");\n\
  }\n```\n\n如果你在 VS Code 中尝试上面的示例并发现陷入了无限循环，可以使用图 11-1 所示的停止按钮停止执行：\n\n![](img/image-WYUHYY24.png)\n\
  \n图 11-1\n\n## 11.4 跳出 for 循环\n\n\n\n\n\n在创建一个循环后，你可能想在满足完成标准之前，在某些条件下跳出循环（特别是当你创建了无限循环时）。其中一个示例可能涉及持续检查网络套字上的活动。一旦检测到活动，就需要跳出监控循环并执行某些其他任务。\n\
  \n为了跳出循环，C# 提供了 `break` 语句，它可以跳出当前循环并从循环紧后的代码处恢复继续执行。例如：\n\n```csharp\nint j = 10;\n\
  \nfor (int i = 0; i < 50; i++)\n{\n    j += j;\n    Console.WriteLine(\"j = \" +\
  \ j);\n    if (j > 100)\n        break;\n}\n```\n\n在上面的示例中，循环将继续执行，直到 `j` 的值超过 100，在那个时间点上，循环将退出。\n\
  \n## 11.5 嵌套 for 循环\n\n到目前为止，我们只查看了单层 `for` 循环。也可以嵌套 `for` 循环，即让循环位于另一个循环内部。例如：\n\
  \n```csharp\nfor (int i = 0; i < 100; i++) {\n    Console.WriteLine( \"i = \" +\
  \ i);\n    for (int j = 0; j < 10; j++) {\n        Console.WriteLine( \"j = \" +\
  \ j);\n    }\n}\n```\n\n上面的示例将循环 100 次，在每次迭代中显示 `i` 的值。此外，这些迭代中的每一次都将循环 10 次，显示\
  \ `j` 的值。\n\n上面的示例显示了两个层嵌套。当然，也可以嵌套更多层级，但层数过多可能会导致代码难以理解。\n\n## 11.6 从嵌套循环中退出\n\n\
  在跳出嵌套 `for` 循环时，需要注意的一个重要点是，`break` 只退出当前层级的循环。例如，下面的 C# 代码示例将在 `j` 等于 5 时退出嵌套循环的当前迭代。然而，外层循环将继续迭代，并反而执行嵌套循环：\n\
  \n```csharp\nfor (int i = 0; i < 100; i++) {\n    Console.WriteLine( \"i = \" +\
  \ i);\n    for (int j = 0; j < 10; j++) {\n        if (j == 5)\n            break;\n\
  \        Console.WriteLine( \"j = \" + j);\n    }\n}\n```\n\n## 11.7 继续 for 循环\n\
  \n循环中使用的的另一个有用语句是 `continue` 语句。当执行过程在任何循环中找到 `continue` 语句时，它会跳过循环体中所有的剩余代码，并从循环顶部重新开始执行。使用这种技术，我们可以例如构造一个\
  \ `for` 循环，只输出 1 到 9 之间的偶数：\n\n```csharp\nfor (int i = 1; i < 10; i++) {\n    if\
  \ ((i % 2) != 0)\n        continue;\n    Console.WriteLine($\"i = {i}\");\n}\n```\n\
  \n在示例中，如果 `i` 不能被 2 整除且余数为 0，代码将执行 `continue` 操作，将执行发送到 `for` 循环的顶部，从而绕过输出 `i` 值的代码。这导致控制台中只出现偶数。\n\
  \n## 11.8 C# foreach 语句\n\n`foreach` 循环用于迭代集合中的项序列，并提供了一个简单易用的循环选项。\n\n`foreach`\
  \ 循环的语法如下：\n\n```csharp\nforeach <name> in <collection> {\n    // 要执行的代码\n}\n```\n\
  \n在此语法中，`<name>` 是一个常量的名称，该常量包含循环正在迭代的对象中的当前项。循环体中的代码通常会使用此常量名称来引用循环周期中的当前项。`<collection>`\
  \ 是循环正在迭代的对象。例如，它可以是一个字符串或或数值的数组（集合的主题将在名为“在 C# 中创建 2D、3D 和交错数组”的章节中进行更详细介绍）。\n\n\
  例如，考虑以下 `foreach` 循环结构：\n\n```csharp\nstring[] myColors = [\"red\", \"green\", \"\
  yellow\", \"orange\", \"blue\"];\n\nforeach (string color in myColors)\n{\n    Console.WriteLine(\"\
  {0} \", color);\n}\n```\n\n循环开始时声明当前项将被赋值给一个名为 `color` 的常量。然后我们告诉该语句，它将遍历 `myColors`\
  \ 集合中的所有元素。循环体向控制面板发送一条消息，指示分配给 `color` 常量的当前值。\n\n正如我们在“在 C# 中创建 2D、3D 和交错数组”章节中看到的，在处理数组和字典等集合时，`foreach`\
  \ 循环特别特别有益。\n\n## 11.9 接受知识测试\n\n点击下面的链接或扫描二维码，以测试你对 C# 循环的知识和理解：\n\n[`www.answertopia.com/3xzv`](https://www.answertopia.com/3xzv)\n\
  \n![](img/image-SICUB2IT.jpg)\n\n## 11.10 总结\n\n循环控制流是大多数编程语言中发现的一种基础功能。在本章中，我们涵盖了用于多次执行任务的\
  \ `for` 和 `foreach` 语句，并探讨了嵌套循环以及如何使用 `break` 和 `continue` 语句管理循环行为。\n\n# 12. 使用\
  \ do 和 while 进行 C# 循环\n\n在构造循环的主题上，本章旨在引入两种更多的循环选项：`while` 和 `do...while`。\n\n`for`\
  \ 循环在预先知道任务需要重复多少次时运行良好。然而，在某些情况下，代码需要重复直到满足特定条件，而不知道重复次数。C# 提供了方案。\n\n## 12.1 while\
  \ 循环\n\n本质上，`while` 循环重复一组任务直到满足特定条件。`while` 循环的定义如下：\n\n```csharp\nwhile (condition)\
  \ {\n    // 语句\n}\n```\n\n在上面的示例中，`condition` 是一个返回真或假的表达式，`statements` 代表当条件持续为真时执行的代码。例如：\n\
  \n```csharp\nint myCount = 0;\n\nwhile (myCount < 100) {\n    myCount++;\n}\n\n\
  Console.WriteLine($\"myCount = {myCount}\");\n```\n\n在上面的示例中，`while` 评估 `myCount`\
  \ 是否小于 100。如果它已经大于 100，括号中的代码将被跳过，循环将在未执行任何任务的情况下退出。\n\n另一方面，如果 `myCount` 不大于 100，括号中的代码将执行，循环返回\
  \ `while` 语句并重复评估。此过程将重复，直到 `myCount` 的值超过 100，在那个时间点循环将退出。\n\n## 12.2 do... while\
  \ 循环\n\n将 `do...while` 循环类比为反的 `while` 循环通常帮助。`while` 循环在执行循环体代码之前评估表达式。如果表达式在第一次检查时为假，则不执行代码。另一方面，`do...while`\
  \ 循环适用于知道循环体中的代码至少需要执行一次的情况。例如，你可能想继续遍历数组中的项，直到找到特定的项。你知道你至少必须检查数组中的第一个项才有希望找到所需的条目。`do...while`\
  \ 循环的语法如下：\n\n```csharp\ndo {\n    // 语句\n} while (conditional expression);\n```\n\
  \n在下面的 `do...while` 示例中，循环将持续直到名为 `i` 的变量值等于 0：\n\n```csharp\nint i = 10;\n\ndo\
  \ {\n    i--;\n    Console.WriteLine($\"i = {i}\");\n} while (i > 0);\n```\n\n\n\
  \n\n与 `for` 循环一样，也可以使用 `break` 语句随时退出 `while` 或 `do ... while` 循环。当执行路径遇到 `while`\
  \ 语句时，循环将停止，执行将继续到紧随循环后的代码。在接下来的示例中，循环被设置为当 `i` 的值匹配 `j` 的值时退出：\n\n```sharp\nint\
  \ i = 0;\n\nint j = 5;\n\nwhile (i < 100)\n{\n    i++;\n    Console.WriteLine($\"\
  i = {i}\");\n    if (i == j)\n        break;\n}\n```\n\n与跳出 `for` 循环一样，必须注意的是，在嵌套的\
  \ `while` 和 `do ... while` 循环情况下，`while` 语句只会退出当前循环，让外层循环继续执行（并且极可能再次执行内层循环）。\n\n\
  ## 12.4 `continue` 语句\n\n`continue` 语句会跳过循环中剩余的所有代码语句，并将执行返回到循环顶部。\n\n在接下来的示例中，只有当变量\
  \ `i` 的值为偶数时（即能被 2 整除且无余数），才会调用 `WriteLine()` 方法：\n\n```sharp\nint i = 1;\n\nwhile\
  \ (i < 20) {\n    i++;\n    if ((i % 2) != 0)\n        continue;\n    Console.WriteLine(\"\
  i = \" + i);\n}\n```\n\n上述示例中的 `continue` 语句除非 `i` 的值能被 2 无余整除，否则将跳过 `WriteLine()`\
  \ 调用。如果触发了 `continue` 语句，执行将跳转到 `while` 循环顶部，循环体中的语句将重复（直到 `i` 的值超过 19）。\n\n## 12.5\
  \ 知识测试\n\n点击下方链接或扫描二维码以测试你对 C# `do-while` 循环的知识和理解：\n\n[`www.answertopia.com/t2ji`](https://www.answertopia.com/t2ji)\n\
  \n![](img/image-OJBJDMFY.jpg)\n\n## 12.6 总结\n\nC# 的 `do` 和 `while` 语句是多功能工具，用于重复执行某项任务直到满足特定条件，例如算术运算达到预期结果或数据到达网络端口。当独立使用时，`while`\
  \ 循环在执行第一次循环迭代之前会检查条件是否已满足，从而允许完全跳过循环。另一方面，`do ... while` 循环在你知道在满足完成标准之前至少需要执行一次循环代码时非常有帮助。这两种循环都支持\
  \ `break` 和 `continue` 语句。\n\n# 13. C# 面向对象编程简介\n\n到课程为止，我们已经学习了 C# 编程的基础知识，例如变量类型和控制流。虽然使用这些技术编写功能性程序是可能的，但要成为一名精通的\
  \ C# 程序员还有很多工作要做。C# 首先是一种面向对象的编程语言，因此，任何 C# 程序员都被期望使用这种语言创建面向对象的应用程序。\n\nC# 为开发面向对象的应用程序提供了广泛支持。本章将介绍涉及面向对象编程的基本概念，然后解释与使用\
  \ C# 进行应用程序开发相关的概念。\n\n## 13.1 什么是对象？\n\n对象是一个自包含的功能模块，可以作为软件应用程序的构建块被易使用和重用。\n\n\
  对象由数据变量（属性）和函数（方法）组成，可以在对象上进行访问和调用以执行任务。这些被统称为成员。\n\n## 13.2 什么是类？\n\n类就像蓝图或建筑师的图纸，描述了对象在创建时的样子。它定义了对象将拥有的方法和将包含的变量。本质上，类决定了对象的属性和行为。\n\
