  \ (B)：\n\n![](img/image-R4Z29Z9K.png)\n\n图 13-4\n\n## 13.4 声明 C# 类\n\n在实例化对象之前，我们首先需要为对象定义类蓝图。在本章中，我们将创建一个\
  \ `Bank Account` 类来演示 C# 面向对象编程的概念。第一步是使用解决方案管理器（Solution Explorer）向我们的项目添加一个新的类文件。解决方案管理器位于资源管理器的底部，如图\
  \ 13-5 所示：\n\n![](img/image-RYAR6DW.png)\n\n图 13-5\n\n在解决方案管理器中，将鼠标指针悬停在 `ObjectDemo`\
  \ 条目上以显示文件文件夹按钮：\n\n![](img/image-YCW7Z4.png)\n\n图 13-6\n\n点击 `New File...` 按钮将显示调面板，如图\
  \ 13-7 所示：\n\n![](img/image-3CN0NA.png)\n\n图 13-7\n\n选择 `Class` 选项，并在按下 `Enter`\
  \ 创建文件将类命名为 `BankAccount`。新文件将自动加载到编辑器，内容如下：\n\n```csharp\nusing System;\n\nnamespace\
  \ ObjectDemo;\n\npublic class BankAccount\n{\n\n}\n```\n\n## 13.5 访问修饰符\n\n当 VS\
  \ Code 生成我们的 `BankAccount` 类时，它是使用 `public` 访问修饰符声明的。访问修饰符控制是否可以在其他地方访问，并适用于多种类型，包括类、方法、属性和字段。C#\
  \ 支持以下访问修饰符：\n\n- `public`：无访问限制。\n- `protected`：仅对类及其派生类可用。\n- `private`：仅对包含类内部可用。\n\
  - `file`：仅对包含源文件可用。\n- `internal`：仅对当前程序集（通常是编译该类的可执行文件或库）中的代码可用。\n- `protected\
  \ internal`：对当前程序集中的代码或类的派生类可用。\n- `private protected`：仅对包含类或当前程序集内的派生类可用。\n\n##\
  \ 13.6 创建 C# 类成员\n\n类成员、字段或属性上是嵌入类中的变量和方法（方法的概念在本章稍后讨论）。成员可以是 `public`、`private`\
  \ 或 `protected`。\n\n`public` 成员可以从对象外部访问并在派生类中可见。`private` 成员仅可由类内部的方法访问，对派生类不可见。`protected`\
  \ 类仅对派生类可用。\n\n这是数据封装的关键。面向对象的编程规定数据应该封装在类中，并通过类的方法（通常称为 getter 和 setter）进行访问和设置。\n\
  \n## 13.7 字段与属性\n\n直接声明为变量的类成员被称为字段。例如，在下面的类中，`firstname` 变量被声明为字段：\n\n```csharp\n\
  public class MyClass {\n    public string firstname = \"\"; // 这是一个字段\n}\n```\n\n\
  \n\n[content]\n\n然而，面向对象的编程指南建议字段应该被保护免受直接访问（即私有字段）。在 C# 中，这通过声明属性来实现，属性反过来提供了对底层私有字段的访问。\n\
  \n属性有一个名称，并声明了特殊的 `get` 和 `set` 方法（称为访问器方法），这些方法使用以下语法提供对底层字段的访问：\n\n```csharp\n\
  public string <property name=\"\">{</property>\n    get {\n        return <field\
  \ name=\"\">;</field>\n    }\n    set {\n        <field name=\"\">= value;</field>\n\
  \    }\n}\n```\n\n`get` 方法的代码返回赋值给字段的值。而 `set` 方法传递名为 `value` 的变量，该变量可以被赋值给字段。\n\
  \n使用这种方法，我们现在可以实现一个属性来封装我们的 `firstname` 字段：\n\n```csharp\npublic class MyClass\n\
  {\n    private string _firstname = \"\";\n    public string FirstName {\n      \
  \  get {\n            return _firstname;\n        }\n        set {\n           \
  \ _firstname = value;\n        }\n    }\n}\n```\n\n当字段与属性关联时，该字段应声明为私有，并且名称通常以下划线\
  \ (`_`) 为前缀。\n\n声明访问器的更简洁的方法是使用 lambda 运算符 (`=>`) 来为 get 和 set 表达式赋值（Lambda 主题将在“C#\
  \ 匿名方法、Lambdas 和本地函数”章节中介绍）：\n\n```csharp\npublic string <property name=\"\">{</property>\n\
  \    get => <field name=\"\">;</field>\n    set => <field name=\"\">= value;</field>\n\
  }\n```\n\n使用上述方法，我们可以如下所示简化我们的 `MyClass` 示例：\n\n```csharp\npublic class MyClass\n\
  {\n    private string _firstname = \"\";\n    public string FirstName {\n      \
  \  get => _firstname;\n        set => _firstname = value;\n    }\n}\n```\n\n是否将所有字段封装在属性中且不设置任何公共字段，取决于个人偏好，取决于你想要在多大程度上严格遵守面向对象的编程规范。即使在微软的\
  \ C# 参考文档中，你也会看到这两种方法的示例。为了简洁起见，我们在书中的许多示例将使用公共字段。\n\n## 13.8 为 BankAccount 类添加成员\n\
  \n我们现在可以扩展 `BankAccount` 类，添加字段来存储账户名称和账号。遵循数据封装的理念，我们将这些字段设为私有，并使用属性提供访问：\n\n```csharp\n\
  namespace ObjectDemo;\n\npublic class BankAccount\n{\n    private string _accountName\
  \ = \"\";\n    private int _accountNumber = 0;\n    public string AccountName\n\
  \    {\n        get => _accountName;\n        set => _accountName = value;\n   \
  \ }\n    public int AccountNumber\n    {\n        get => _accountNumber;\n     \
  \   set => _accountNumber = value;\n    }\n}\n```\n\n在类中添加了一些字段和属性后，我们需要简要检查其他数据成员类型，并学习如何从类创建对象实例。\n\
  \n## 13.9 静态、只读和常量数据成员\n\n除了我们目前看到的数据成员类型外，C# 还支持几种额外的成员类型。\n\nC# 静态成员类型（也称为类属性）存储该类所有对象实例共的数据值。例如，所有银行客户在储蓄账户上获得的利率相同。因此，`interestRate`\
  \ 成员应声明为静态，因为它是该类所有对象实例共享的。静态成员使用 `static` 关键字声明。例如：\n\n```csharp\npublic class\
  \ BankAccount\n{\n    private static int interestRate;\n}\n```\n\n静态成员通过类进行访问，而不是通过对象。例如，我们可以通过如下方式引用\
  \ `BankAccount` 类来更改所有对象实例的 `interestRate` 成员：\n\n`BankAccount.interestRate = 10;`\n\
  \n对于不能修改的数据成员，使用了 `const` 和 `readonly` 关键字。\n\n## 13.10 从类实例化对象\n\n现在我们已经了如何编写类，需要知道如何从类中创建对象。从类创建对象被称为实例化。第一步是使用\
  \ `new` 关键字创建实例：\n\n```csharp\nBankAccount accountAccount = new BankAccount();\n\
  ```\n\n或者，可以在单条语句中声明对象并对其进行初始化：\n\n```csharp\nBankAccount accountAccount = new BankAccount();\n\
  ```\n\n也可以如下所示声明对象变量并为其赋值：\n\n```csharp\nusing ObjectDemo;\nBankAccount accountAccount\
  \ = new BankAccount();\naccountAccount.AccountName = \"John Smith\";\naccountAccount.AccountNumber\
  \ = 53211;\n\nConsole.WriteLine($\"Customer Name is {accountAccount.AccountName}\"\
  );\nConsole.WriteLine($\"Account Number = {accountAccount.AccountNumber}\");\n```\n\
  \n当属性在对象创建后立即初始化时，可以使用对象初始化器将代码简化如下：\n\n```csharp\nBankAccount accountAccount =\
  \ new()\n{\n    AccountName = \"John Smith\",\n    AccountNumber = 53211\n};\n```\n\
  \n## 13.11 访问对象成员\n\n现在我们有了一个 `BankAccount` 类的实例，需要知道如何访问它的成员。首先，你会记得我们将某些成员声明为公共，而另一些声明为私有。公共成员可以使用所谓的“点符号法”（dot\
  \ notation）从对象外部完全访问。\n\n点符号法是一种通过指定对象和用点 (`.`) 分隔的名称来访问对象的机制。例如，访问名为 `accountAccount`\
  \ 的对象的 `accountName` 成员，我们将使用 `accountAccount.AccountName`。\n\n修改 `Program.cs` 文件如下，以访问\
  \ `BankAccount` 类的公共属性：\n\n```csharp\nBankAccount accountAccount = new();\naccountAccount.AccountName\
  \ = \"John Smith\";\naccountAccount.AccountNumber = 53211;\n\nConsole.WriteLine($\"\
  Customer Name is {accountAccount.AccountName}\");\nConsole.WriteLine($\"Account\
  \ Number = {accountAccount.AccountNumber}\");\n```\n\n运行应用并检查输出如下：\n\n```\nCustomer\
  \ Name is John Smith\nAccount Number = 53211\n```\n\n## 13.12 为 C# 类添加方法\n\n类方法本质上是可以在类上下文中调用的以执行特定任务的代码例程。方法有两种形式：静态方法（也称为类方法）和实例方法。静态方法在类级别操作，例如创建新的类实例。相反，实例方法仅对类的实例操作（例如，对成员变量进行算术运算并返回结果）。\n\
  \n实例方法在所属类的左大右括号内部声明，并使用标准的 C# 方法语法声明。静态方法的声明方式与实例方法相同，只是 `static` 关键字位于声明。\n\n\
  例如，编辑 `BankAccount` 类并添加一个显示名称的方法：\n\n```csharp\npublic class BankAccount\n{\n \
  \   // ... 现有的字段和属性 ...\n    public void DisplayName()\n    {\n        Console.WriteLine(AccountName);\n\
  \    }\n}\n```\n\n\n\n\n```csharp\npublic void DisplayName()\n{\n    Console.WriteLine($\"\
  Customer name is {AccountName}\");\n}\n```\n\n上面的方法是一个实例方法，因此它前面没有 `static` 关键字，并且可以按照如下方式调用：\n\
  \n```csharp\nBankAccount custAccount = new()\n{\n    AccountName = \"John Smith\"\
  ,\n    AccountNumber = 53211\n};\n\ncustAccount.DisplayName();\nConsole.WriteLine($\"\
  Account Number = {custAccount.AccountNumber}\");\n```\n\n在设计 `BankAccount` 类时，调用类本身的\
  \ `static` 方法来识别该类实例可以存储的最大允许余额可能会很有帮助。这将允许应用程序在不创建类实例的情况下识别 `BankAccount` 类是否适合存储新客户的详情。我们将此方法命名为\
  \ `GetMaxBalance()` 并对其所示实现：\n\n```csharp\npublic class BankAccount \n{\n    public\
  \ static double GetMaxBalance()\n    {\n        return(10000000.00);\n    }\n}\n\
  ```\n\n声明方法后，可以直接在类上调用它，而无需创建实例，如下所示：\n\n```csharp\ndouble maxBalance = BankAccount.GetMaxBalance();\n\
  Console.WriteLine($\"Maximum allowed balance = ${maxBalance}\");\nBankAccount custAccount\
  \ = new()\n```\n\n运行该程序应该产生以下输出：\n\n```\nMaximum allowed balance = $10000000\nCustomer\
  \ name is John Smith\nAccount Number = 53211\n```\n\n现在我们已经查看了方法的类成员，下一个任务是查看两个特殊的类方法：构造函数和析构函数。\n\
  \n## 13.13 C# 构造函数\n\n尽管名称听起来很大气，但 C# 类构造函数和析构函数只不过是在对象被实例化和销毁时调用的方法。构造函数特别用于允许在创建时将初始化值传递给对象。假设我们希望在初始化\
  \ `custAccount` 对象时初始化 `_accountName` 和 `_accountNumber` 成员。为了实现这一点，我们需要声明一个构造函数。\n\
  \n构造函数的声明方式与其他方法相同，不同之处方法方法必须与类名匹配。例如，如下所示为 `BankAccount` 类添加一个构造函数：\n\n```csharp\n\
  public class BankAccount\n{\n    private string _accountName;\n    private int _accountNumber;\n\
  \    // 构造函数\n    public BankAccount(string accountName, int accountNumber)\n  \
  \  {\n        _accountName = accountName;\n        _accountNumber = accountNumber;\n\
  \    }\n}\n```\n\n构造函数可以用于在创建实例时初始化这些成员：\n\n```csharp\nBankAccount custAccount =\
  \ new BankAccount(\"Fred Wilson\", 123456);\ncustAccount.DisplayName();\n```\n\n\
  当需要在为属性赋值之外执行某些任务时，上述构造函数类型特别有用。例如，`BankAccount` 构造函数可能包含一些逻辑来捕获空的客户名称字符串：\n\n```csharp\n\
  public BankAccount(string accountName, int accountNumber)\n{\n    if (accountName\
  \ == \"\")\n        _accountName = \"Anonymous\";\n    else\n        _accountName\
  \ = accountName;\n    _accountNumber = accountNumber;\n}\n```\n\n一个类可以包含多个构造函数，每个构造函数有一组唯一的参数。考虑对\
  \ `BankAccount` 类定义的以下更改：\n\n```csharp\npublic class BankAccount\n{\n    private\
  \ string _accountName;\n    private int _accountNumber;\n    private bool _isActive\
  \ = false;\n    // 构造函数\n    public BankAccount(string accountName, int accountNumber)\n\
  \    {\n        _accountName = accountName;\n        _accountNumber = accountNumber;\n\
  \    }\n    public BankAccount(string accountName, int accountNumber, bool isActive)\n\
  \    {\n        _accountName = accountName;\n        _accountNumber = accountNumber;\n\
  \        _isActive = isActive;\n    }\n    public bool IsActive {\n        get =>\
  \ _isActive;\n    }\n}\n```\n\n通过这些更改，可以使用以下方式创建 `BankAccount` 实例：\n\n```csharp\n\
  BankAccount custAccount = new(\"John Smith\", 53211);\nBankAccount cust2 = new(\"\
  John Smith\", 53211, true);\n```\n\n## 13.14 C# 主构造函数\n\n当构造函数的唯一目的是将参数分配类时，建议使用主构造函数。例如，将参数放在类名之后：\n\
  \n```csharp\npublic class BankAccount(string accountName, int accountNumber)\n{\n\
  \    private string _accountName = accountName;\n    private int _accountNumber\
  \ = accountNumber;\n}\n```\n\n## 13.15 C# 析构函数\n\n析构函数用于在对象销毁时清理类使用的任何资源。与可以使用 `new`\
  \ 关键字显式调用的构造函数不同，没有办法可以调用析构函数。它们的定义方式与构造函数相同，不同之处是名称前面有一个波浪号 (`~`）：\n\n```csharp\n\
  // 析构函数\n~BankAccount() {\n}\n```\n\n## 13.16 “this” 关键字\n\n在 C# 中构造类时，你可能会遇到某些情况：方法内部局部属性与类属性冲突。这在在使用公共字段时特别常见。例如，下面的示例类，其中参数名称与公共字段匹配：\n\
  \n```csharp\nclass DemoClass\n{\n    public string name;\n    public int age;\n\
  \    public DemoClass(string name, int age)\n    {\n        name = name;\n     \
  \   age = age;\n    }\n}\n```\n\n当运行上述代码时，将没有名称且年龄将为 0，即使在创建类实例时已将年龄设置为 37。\n\n\
  ```csharp\nDemoClass demo = new(\"Mark\", 37);\nConsole.WriteLine($\"{demo.name}\
  \ is {demo.age} years old.\");\n```\n\n此外，编译器会发出警告，内容为：`warning CS1717: 赋值给了同一个变量；你是否是想赋值其他内容?`\
  \ 这里的问题是编译器不知道在以下初始化代码中引用的是哪个 `name` 和 `age` 变量：\n\n```csharp\npublic DemoClass(string\
  \ name, int age) {\n    name = name;\n    age = age;\n}\n```\n\n为了解决这个问题，我们需要能够告诉编译器将方法参数值分配给相应的公共字段值。我们可以使用\
  \ `this` 关键字来实现。在此范围内，`this` 关键字表示当前的类实例。为了区分冲突的 `name` 和 `age` 变量，我们需要如下使用 `this`\
  \ 关键字：\n\n```csharp\npublic DemoClass(string name, int age) {\n    this.name = name;\n\
  \    this.age = age;\n}\n```\n\n## 13.17 进行知识测试\n\n点击下方链接或扫描二维码测试你对 C# 面对象编程的知识和理解：\n\
  \n[`www.answertopia.com/cnbw`](https://www.answertopia.com/cnbw)\n\n\n\n\n面向对象的编程语言如\
  \ `C#` 促进了类的创建，以鼓励代码重用和数据封装。在本章中，我们涵盖了 `C#` 中类和实例的基本概念，并解释了类成员、构造函数、终结器、属性、字段和方法等概念。\n\
  \n# 14. C# 方法\n\n上一章开始介绍 `C#` 中的面向对象编程，并包含了在类内部声明的方法的使用。本章将更详细地探讨 `C#` 方法，包括如何声明和调用它们、传递参数以及返回结果。还将解释通过引用和值传递参数的主题。\n\
  \nC# 方法对于编写结构良好且高效的代码至关重要。它们提供了一种组织程序的方法，同时避免了代码重复。在本章中，我们将研究如何在 `C#` 中声明和使用方法。\n\
  \n## 14.1 什么是方法？\n\n方法是一个具命名的代码块，可以通过调用它来执行特定任务。它可以接收数据以执行该任务，并向结果返回给调用它的代码。例如，如果\
  \ `C#` 程序中需要执行特定的算术计算，可以将执行该算术的代码放置在方法中。该方法可以设置为接受要进行算术计算的值（称为参数）并返回计算结果。在程序代码中需要计算的任何点，都可以调用该方法并将值作为参数传递，然后返回结果。\n\
  \n## 14.2 方法与函数\n\n如果你熟悉其他编程语言，可能听过或使用过函数。通常情况下，函数的声明方式与方法相同，目的也相同。区别在于，方法必须在类内部声明，而函数则在类外部声明。在\
  \ `C#` 中，只能在类内部声明方法，不存在函数的概念。\n\n## 14.3 参数还是实参？\n\n在讨论方法时，`parameter`（参数）和 `argument`（参数）这两个术语通常互换使用。然而，它们之间存在细微的。方法在被调用时可以接收的值被称为\
  \ `parameters`（参数）。当方法被调用并传递这些值时，它们被称为 `arguments`（参数）。\n\n## 14.4 如何声明 C# 函数\n\n\
  `C#` 函数使用以下语法声明：\n\n```\n<access><return type=\"\"><method name=\"\">(<para type=\"\
  \">, <para name=\"\">, ...){\n    // 方法代码\n}\n```\n\n函数声明各个各个字段的解释如下：\n\n- `<access>`：定义了从代码其他部分访问方法的访问级别。有效值为\
  \ `public`、`private` 或 `protected`，如上一章所解释的。\n- `<return type>`：函数返回的结果的数据类型。如果函数不返回结果，则将其设置为\
  \ `void`。\n- `<method name>`：分配给方法的名称。这是在应用程序代码内部调用方法时引用该方法的名称。\n- `<para type>`：对应\
  \ `parameter`（参数）的类型。\n- `<para name>`：在方法代码中引用该 `parameter`（参数）的名称。\n- `Method\
  \ code`：执行工作的方法代码语句。\n\n例如，以下方法不接受参数，不返回结果，并显示一条消息：\n\n```csharp\npublic void sayHello()\
  \ {\n    Console.WriteLine(\"Hello\");\n}\n```\n\n相反，下面的示例函数接受一个 `int` 和一个 `string`\
  \ 作为参数，并返回一个字符串结果：\n\n```csharp\npublic string BuildMessage(string name, int count)\
  \ {\n    return($\"{name}, you are customer number {count}\");\n}\n```\n\n## 14.5\
  \ 创建 MethodDemo 项目\n\n启动 VS Code，打开你的“C# Essentials”工作空间文件夹，并创建一个名为 `MethodDemo`\
  \ 的新 .NET 控制台应用程序。\n\n## 14.6 声明 C# 类文件\n\n遵循“C# 面向对象编程简介”章节中的步骤，使用解决方案管理器（Solutions\
  \ Explorer）向 `MethodDemo` 项目添加一个名为 `Demo` 的新类文件。添加类文件后，按照如下方式对其进行修改以添加方法：\n\n```csharp\n\
  using System;\n\nnamespace MethodDemo;\n\npublic class Demo\n{\n    public void\
  \ SayHello()\n    {\n        Console.WriteLine(\"Hello\");\n    }\n}\n```\n\n##\
  \ 14.7 调用 C# 方法\n\n一旦声明，就可以使用点符号通过以下语法在类实例上调用 `C#` 方法：\n\n```\n<instance>.<function\
  \ name>(<arg1>, <arg2>, ... )\n```\n\n传递给方法的每个参数必须匹配方法配置为接受的参数。例如，要调用上述名为 `SayHello()`\
  \ 的不接受参数且不返回值的示例方法，我们需要如下所示修改 `Program.cs` 文件：\n\n```csharp\nusing MethodDemo;\n\
  \nDemo demo = new();\n\ndemo.SayHello();\n```\n\n当应用运行时，“Hello”消息将出现在终端中。\n\n##\
  \ 14.8 处理返回值\n\n`SayHello()` 方法定义包含了 `void` 关键字，表示它不返回结果值。接下来，在 `Demo` 类中添加一个名为\
  \ `BuildMessage()` 的方法，它接受两个参数并返回字符串结果如下：\n\n```csharp\npublic class Demo\n{\n \
  \   public void SayHello()\n    {\n        Console.WriteLine(\"Hello\");\n    }\n\
  \n    public string BuildMessage(string name, int count)\n    {\n        return($\"\
  {name}, you are customer number {count}\");\n    }\n}\n```\n\n`SayHello()` 方法定义包含了\
  \ `void` 关键字，表示它不返回结果值。接下来，在 `Demo` 类中添加一个名为 `BuildMessage()` 的方法，它接受两个参数并返回字符串结果如下：\n\
  \n```csharp\npublic class Demo\n{\n    public void SayHello()\n    {\n        Console.WriteLine(\"\
  Hello\");\n    }\n\n    public string BuildMessage(string name, int count)\n   \
  \ {\n        return $\"{name}, you are customer number {count}\";\n    }\n}\n```\n\
  （注：此处原文文本似乎有部分重复或截断，翻译时已根据逻辑进行了对齐）\n\n*纠正：由于原文在 14.8 之后出现了逻辑重复和截断，我将根据上下文逻辑提供完整的翻译流：*\n\
  \n（重新翻译 14.8 之后的部分以确保逻辑连贯）\n\n`SayHello()` 方法定义包含了 `void` 关键字，表示它不返回结果值。接下来，在 `Demo`\
  \ 类中添加一个名为 `BuildMessage()` 的方法，它接受两个参数并返回字符串结果如下：\n\n```csharp\npublic class Demo\n\
  {\n    public void SayHello()\n    {\n        Console.WriteLine(\"Hello\");\n  \
  \  }\n\n    public string BuildMessage(string name, int count)\n    {\n        return\
  \ $\"{name}, you are customer number {count}\";\n    }\n}\n```\n\n在上面的代码中，我们在返回值周围加上了括号如下：\n\
  \n`return $\"{name}, you are customer number {count}\";`\n\n这些括号是可选的，因此以下也是合法的返回语句：\n\
  \n`return $\"{name}, you are customer number {count}\";`\n\n返回 `Program.cs` 文件并添加代码来调用新方法：\n\
  \n```csharp\nDemo demo = new();\n\nstring message = demo.BuildMessage(\"Bill\",\
  \ 10);\n\nConsole.WriteLine(message);\n```\n\n在上面的示例中，我们创建了一个名为 `message` 的变量并使用赋值运算符\
  \ (`=`) 存储方法的结果。当应用运行时，终端应出现以下输出：\n\nHello Bill, you are customer number 10.\n\n\
  ## 14.9 向方法传递参数\n\n在调用期望参数的方法时有多种选择。一种方法如上面所示，是按照方法声明中的顺序传递参数：\n\n```csharp\nstring\
  \ message = demo.BuildMessage(\"Bill Gates\", 10);\n```\n\n以这种方式调用方法时，必须按照参数在方法声明中的顺序传递。使用这种技术向方法传递参数也可能难以理解每个参数的用途。这两个问题都可以通过命名参数来解决。\n\
  \n### 14.9.1 命名参数\n\n命名参数涉及在调用时引用方法声明中分配的参数名称。例如：\n\n`demo.BuildMessage(name: \"\
  Steve\", count: 30);`\n\n由于在使用命名参数时顺序不重要，以下也是合法的调用：\n\n`demo.BuildMessage(count:\
  \ 30, name: \"Steve\");`\n\n对 `Program.cs` 文件进行以下更改以查看命名参数的作用：\n\n```csharp\nDemo\
  \ demo = new();\n\nstring message = demo.BuildMessage(name: \"Bill\", count: 10);\n\
  \nConsole.WriteLine(message);\n\nmessage = demo.BuildMessage(count: 30, name: \"\
  Steve\");\n\nConsole.WriteLine(message);\n```\n\n正如上面的代码所示，在调用方法时，参数的顺序不再重要。理解传递给方法的每个参数的用途也变得更加容易。\n\
  \n### 14.9.2 可选参数\n\n\n\n\n\n可选参数\n\nC# 参数可以通过为指定一个默认参数值来使其变为可选的，如果在调用方法时未提供该参数值，则将使用该默认值。这涉及到在声明方法时为参数分配默认值。在在使用可选参数时，唯一的要求是在方法声明中将可选参数放在任何强制性参数之后。\n\
  \n按照如下方式修改 `BuildMessage()` 方法，以便在调用该方法时未提供客户名称时，使用字符串“Customer”作为默认值：\n\n```csharp\n\
  public class Demo\n{\n    public void SayHello()\n    {\n        Console.WriteLine(\"\
  Hello\");\n    }\n    public string BuildMessage(int count, string name = \"Customer\"\
  )\n    {\n        return $\"Hello {name}, you are visitor number {count}.\";\n \
  \   }\n}\n```\n\n对方法进行更改后，尝试在不传递名称参数的情况下调用：\n\n```csharp\nDemo demo = new();\nstring\
  \ message = demo.BuildMessage(count: 10);\nConsole.WriteLine(message);\n```\n\n\
  当应用程序运行时，将出现以下输出，其中名称被替换为“Customer”：\n\nHello Customer, you are visitor number 10.\n\
  \n## 14.10 处理数量数量的参数\n\n到目前为止，我们查看了调用时接受固定数量参数的方法示例。C# 还提供了一种配置方法以接受可数量参数的方法。这涉及到将参数存放在\
  \ `List` 集合中并使用 `params` 关键字对其进行处理。C# 的 `List` 类允许将多个项分组在单个对象中，将在“C# List 集合”章节中介绍。假设我们需要一个可以接受任意数量字符串参数的方法。使用\
  \ `params` 关键字，我们可以如下声明该方法：\n\n```csharp\npublic void GreetGuests(params List<string>\
  \ guests)\n{\n    foreach (var guest in guests) {\n        Console.WriteLine($\"\
  Welcome, {guest}\");\n    }\n}\n```\n\n当我们调用 `GreetGuests()` 方法时，我们可以传递一个包含任意数量客户名称的\
  \ `List` 实例，而无需更改 `GreetGuests()` 方法：\n\n```csharp\nList<string> names = [\"John\"\
  , \"Paul\", \"George\"];\ndemo.GreetGuests(names);\nnames = [\"Mark\", \"Robert\"\
  ];\ndemo.GreetGuests(names);\n```\n\n`params` 参数可以与其他方法参数结合使用，例如：\n\n```csharp\n\
  public void GreetGuests(int groupId, params List<string> guests)\n{\n    // ...\n\
  }\n```\n\n一个方法只能接受一个 `params` 参数，该参数必须位于参数列表的末尾。\n\n## 14.11 C# in, out, 和 ref 参数修饰符\n\
  \n当参数传递给方法时，它是按值传递的。假设代码包含一个名为 `myVar` 的 `int` 变量，并对其赋值值 10。然后将 `myVar` 变量传递给名为\
  \ `DoSomething()` 的方法。在这种情况下，仅将值 10 的拷贝传递给方法，与原始 `myVar` 变量没有连接。因此，从方法内部对值的任何更改都不会反映在原始变量中。\n\
  \n向 `Demo` 类中添加以下方法以演示这种效果：\n\n```csharp\npublic class Demo {\n    // .\n    public\
  \ void DoSomething(int myVar) {\n        myVar = 10;\n    }\n}\n```\n\n接下来，按照如下方式修改\
  \ `Program.cs` 文件：\n\n```csharp\nint myVar = 20;\nDemo demo = new();\nConsole.WriteLine($\"\
  Before method call myVar = {myVar}\");\ndemo.DoSomething(myVar);\nConsole.WriteLine($\"\
  After method call myVar = {myVar}\");\n```\n\n上面的代码声明了一个变量并对其赋值为 20。在调用方法之前，显示了\
  \ `myVar` 的当前值。然后将变量作为参数传递给 `DoSomething()` 方法，在该方法内部它被赋值为 10。当 `DoSomething()`\
  \ 方法返回时，再次输出赋值给 `myVar` 变量的值。\n\n运行应用程序并验证赋值给 `myVar` 变量的值没有被 `DoSomething()` 方法更改：\n\
  \nBefore method call myVar = 20\nAfter method call myVar = 20\n\n为了允许在方法内部更改赋值给变量的值，我们需要按引用传递变量。\n\
  \n按引用传递意味着我们不是传递底层值，而是传递指向变量存储其值的内存位置的引用。方法内部进行的任何更改都将应用在变量的值上。\n\n在方法中声明参数时以及调用方法时，都使用\
  \ `ref` 修饰符按引用传递变量，如下所示：\n\n```csharp\n// Demo.cs\npublic class Demo {\n    // .\n\
  \    public void DoSomething(ref int myVar) {\n        myVar = 10;\n    }\n}\n\n\
  // Program.cs\nConsole.WriteLine($\"Before method call myVar = {myVar}\");\ndemo.DoSomething(ref\
  \ myVar);\nConsole.WriteLine($\"After method call myVar = {myVar}\");\n```\n\n当应用程序运行时，赋值给\
  \ `myVar` 变量的值发生了变化：\n\nBefore method call myVar = 20\nAfter method call myVar =\
  \ 10\n\n为了允许方法通过参数返回值，请使用 `out` 修饰符。`out` 修饰符与 `ref` ，但变量必须由方法初始化。\n\n```csharp\n\
  // Demo.cs\npublic class Demo {\n    public void GetValue(out int result) {\n  \
  \      result = 42;\n    }\n}\n\n// Program.cs\nint value;\ndemo.GetValue(out value);\
  \ // 输出 42\n```\n\n要防止方法更改按引用传递的变量，请使用 `in` 修饰符。`in` 修饰符按引用传递变量。\n\n```csharp\n\
  // Demo.cs\npublic class Demo {\n    public void DisplayValue(in int value) {\n\
  \        // value = 10; // 错误：不能对只读赋值\n    }\n}\n\n// Program.cs\nint value = 20;\n\
  demo.DisplayValue(in value);\n```\n\n## 14.12 知识测试\n\n点击下方链接或扫描二维码以测试你对以下内容的知识和理解：\n\
  \n[`www.answertopia.com/r67i`](https://www.answertopia.com/r67i)\n\n![](img/W0NI70.jpg)\n\
  \n## 14.13 总结\n\nC# 方法是执行特定任务的自包含代码单元。它们有助于组织代码并促进代码重用。本章讨论了方法并解释了如何创建它们。我们介绍了向方法添加参数以及区分命名参数和可选参数。最后，我们学习了何时使用\
  \ `in`、`out` 和 `ref` 参数修饰符，以及按值和按引用传递参数的区别。\n\n# 15. 委托 (Delegates)\n\n本章将继续探索 C#\
  \ 方法，引入委托的概念，包括它们是什么以及如何使用它们。\n\n## 15.1 什么是委托？\n\n在我们开始探索委托之前，首先有助于理解签名（signature）的概念。在声明方法时，它接受的参数和返回的结果类型构成了方法的签名。以下方法的签名表示它接受一个字符串值作为参数并返回一个整数：\n\
  \n```csharp\npublic int GetLength(string value) {\n    // ...\n}\n```\n\n下面的方法执行完全不同的任务，但与上述\
  \ `GetLength()` 方法具有相同的签名：\n\n```csharp\npublic int CustomerCount(string customer)\
  \ {\n    // ...\n}\n```\n\nC# 委托存储方法引用的变量。如果你熟悉 C 或 C++ 编程，委托类似于函数指针。\n\n一旦声明，委托就可以更改为指向任何匹配委托签名的方法。\n\
  \n\n\n\n要声明一个与我们的两个示例方法（一个字符串参数和一个整数返回类型）相匹配的委托，我们需要编写以下代码：\n\n```csharp\npublic\
  \ delegate string MyDelegate (string s);\n```\n\n## 15.3 使用委托\n\n声明委托后，我们可以使用它来存储对方法的引用。`Delegate`\
  \ 实例通过使用 `new` 关键字创建，并传递要引用的方法，例如：\n\n```csharp\npublic delegate string MyDelegate\
  \ (string s);\n\nMyDelegate delegate1 = new MyDelegate(GetLength);\n\nMyDelegate\
  \ delegate2 = new MyDelegate(CustomerCount);\n```\n\n在上述代码中，我们创建了两个委托实例，每个实例指向我们的示例方法之一。一旦声明，就可以像调用任何其他方法一样调用它们：\n\
  \n```csharp\nvar strlen = delegate1(\"This is some text\");\n\nvar count = delegate2(\"\
  Robert Addison\");\n```\n\n## 15.4 创建 DelegateDemo 项目\n\n启动 VS Code，打开你的“C# Essentials”工作区文件夹，并创建一个名为\
  \ `DelegateDemo` 的新 .NET 控制台应用程序项目。\n\n## 15.5 一个 C# \n\n### 委托示例\n\n在示例中，我们将创建一个名为\
  \ `StringConverter` 的委托。首先按照如下方式编辑 `Program.cs` 文件：\n\n```csharp\nnamespace DelegateDemo\n\
  \n{\n    internal class Program\n    {\n        delegate string StringConverter(string\
  \ value);\n        static string LowerCase(string value)\n        {\n          \
  \  Console.Write(\"Converting to lowercase > \");\n            return value.ToLower();\n\
  \        }\n        static string UpperCase(string value)\n        {\n         \
  \   Console.Write(\"Converting to uppercase > \");\n            return value.ToUpper();\n\
  \        }\n        static void Main(string[] args)\n        {\n        }\n    }\n\
  }\n```\n\n上述更改声明了一个名为 `StringConverter` 的委托，它可以用于引用任何接受并返回字符串值的方法。接下来，我们声明了两个与此签名匹配的方法，`LowerCase()`\
  \ 和 `UpperCase()`。下一步是向 `Main()` 方法中添加代码来使用这些委托：\n\n```csharp\nstatic void Main(string[]\
  \ args)\n{\n    StringConverter converter1 = new(LowerCase);\n\n    StringConverter\
  \ converter2 = new(UpperCase);\n    var lower = converter1(\"This is some TEXT\"\
  );\n    Console.WriteLine(lower);\n    var upper = converter2(\"tHis IS sOmE TExt\"\
  );\n    Console.WriteLine(upper);\n}\n```\n\n`Main()` 方法创建了两个委托实例，每个实例引用两个方法之一。然后通过委托调用这些方法，并将生成的字符串显示在控制台中：\n\
  \nConverting to lowercase > this is some text\n\nConverting to uppercase > THIS\
  \ IS SOME TEXT\n\n由于委托是一个变量，因此可以在任何时候分配不同的方法。\n\n在上面的示例中，`converter1` 和 `converter2`\
  \ 是单播委托，因为它们每个只引用一个方法。也可以创建多播委托。\n\n## 15.6 多播委托\n\n多播委托包含多个委托，允许它引用多个方法。多播委托是通过使用\
  \ `+` 运算符组合现有的委托创建的。\n\n通过对我们的 `Main()` 方法进行以下更改，创建了一个名为 `multicast` 的委托，它包含了 `converter1`\
  \ 和 `converter2`：\n\n```csharp\nstatic void Main(string[] args)\n{\n    StringConverter\
  \ converter1 = new(LowerCase);\n\n    StringConverter converter2 = new(UpperCase);\n\
  \    StringConverter multicast = converter1 + converter2;\n    var result = multicast(\"\
  This is some TEXT\");\n    Console.WriteLine(result);\n}\n```\n\n执行代码时，我们将从控制台输出看到通过单次多播委托调用了\
  \ `LowerCase()` 和 `UpperCase()` 方法：\n\nConverting to lowercase > Converting to uppercase\
  \ > THIS IS SOME TEXT\n\n可以使用 `-` 运算符从多播委托中移除委托。以下更改调整了上述示例，在第一次调用后从 `multicast`\
  \ 中移除 `converter2`：\n\n```csharp\nstatic void Main(string[] args)\n{\n    StringConverter\
  \ converter1 = new(LowerCase);\n\n    StringConverter converter2 = new(UpperCase);\n\
  \    StringConverter multicast = converter1 + converter2;\n    var result = multicast(\"\
  This is some TEXT\");\n    Console.WriteLine(result);\n\n    multicast -= converter2;\n\
  \    var result = multicast(\"This is some TEXT\");\n    Console.WriteLine(result);\n\
  }\n```\n\n执行代码时：\n\nConverting to lowercase > \nlowercase > \n\n## 15.7 传递委托\n\n\
  要将委托传递给方法，该方法必须接受该委托类型作为参数。假设我们需要方法接收 `StringConverter` 实例和一个字符串：\n\n```csharp\n\
  static void DisplayText(StringConverter converter, string text)\n{\n    string result\
  \ = converter(text);\n    Console.WriteLine($\"Converted text = {result}\");\n}\n\
  ```\n\n在 `Main()` 方法中实现以下更改：\n\n```csharp\nnamespace DelegateDemo\n{\n    internal\
  \ class Program\n    {\n        delegate string StringConverter(string value);\n\
  \n        static string LowerCase(string value)\n        {\n            Console.Write(\"\
  Converting to lowercase > \");\n            return value.ToLower();\n        }\n\
  \        static string UpperCase(string value)\n        {\n            Console.Write(\"\
  Converting to uppercase > \");\n            return value.ToUpper();\n        }\n\
  \n        static void Main(string[] args)\n        {\n            StringConverter\
  \ converter1 = new(LowerCase);\n            StringConverter converter2 = new(UpperCase);\n\
  \n            DisplayText(converter1, \"This is some text\");\n            DisplayText(converter2,\
  \ \"This is some text\");\n        }\n\n        static void DisplayText(StringConverter\
  \ converter, string text)\n        {\n            string result = converter(text);\n\
  \            Console.WriteLine($\"Converted text = {result}\");\n        }\n   \
  \ }\n}\n```\n\n执行代码时，控制台将显示：\n\nConverting to lowercase > Converted text = this\
  \ is some text\nConverting to uppercase > Converted text = THIS IS SOME TEXT\n\n\
  ## 15.8 测试\n\n点击下方链接或扫描二维码测试你对 C# 委托的知识：\n\n[`www.answertopia.com/zcff`](https://www.answertopia.com/zcff)\n\
  \n## 15.9 总结\n\nC# 委托允许我们将方法存储在变量中，方法的签名决定了变量类型。方法的签名由它接受的参数和返回类型定义。一旦声明委托，它将具有许多其他类型的功能。特别是，委托允许作为参数传递，甚至作为方法的返回。委托可以包含单个方法（单播），也可以组合创建多播委托。\n\
  \n# 16. 匿名方法、Lambda 和局部函数\n\n在本章中，你将学习如何在 C# 中使用匿名方法、Lambda 和局部函数来编写灵活、简洁且重用的代码。\n\
  \n## 16.1 匿名方法\n\n匿名方法使用 `delegate` 关键字声明。然而，匿名方法并不引用现有的命名方法。相反，要执行的代码被直接分配给委托（这种概念称为内联）。在声明匿名方法时，将使用以下语法：\n\
  \n```csharp\ndelegate <returntype><delegatename>(<parameters>);</parameters></delegatename></returntype>\n\
  ```\n\n区别出现在分配要执行的代码时。为匿名方法分配代码块的语法如下：\n\n```csharp\n<delegate_type><delegate_name>=\
  \ delegate(<parameters>) {</parameters></delegate_name></delegate_type>\n// 要执行的代码\n\
  };\n```\n\n使用这种语法并以我们的 `LowerCase()` 方法代码为例，我们将编写如下代码：\n\n```csharp\ndelegate string\
  \ StringConverter(string value);\n\nStringConverter converter = delegate(string\
  \ value)\n{\n    Console.Write(\"Converting to lowercase > \");\n    return value.ToLower();\n\
  };\n```\n\n\n\n\n```csharp\nreturn value.ToLower();\n};\n```## 16.2 创建 LambdaDemo\
  \ 项目\n\n为了看到上述匿名方法声明的作用，请启动 VS Code，打开你的“C# Essentials”工作空间文件夹，并创建一个名为 `LambdaDemo`\
  \ 的新 .NET 控制台应用程序。接下来，按照如下方式修改 `Program.cs` 文件：\n\n```csharp\nnamespace LambdaDemo\n\
  {\n    internal class Program\n    {\n        delegate string StringConverter(string\
  \ value);\n        static void Main(string[] args)\n        {\n            StringConverter\
  \ converter = delegate (string value)\n            {\n                Console.Write(\"\
  Inline conversion to lowercase > \");\n                return value.ToLower();\n\
  \            };\n        }\n    }\n}\n```\n\n上述代码声明了 `StringConverter` 委托，创建了一个名为\
  \ `converter` 的实例，并为其分配了一个将字符串参数转换为小写的匿名方法。剩下的工作工作是调用 `converter` 并显示结果：\n\n```csharp\n\
  static void Main(string[] args)\n{\n    StringConverter converter = delegate (string\
  \ value)\n    {\n        Console.Write(\"Inline conversion to lowercase > \");\n\
  \        return value.ToLower();\n    };\n    var result = converter(\"This is some\
  \ TEXT\");\n    Console.WriteLine(result);\n}\n```\n\n当上述代码执行时，控制台中将出现以下输出：\n\n\
  ```\nInline conversion to lowercase > this is some text\n```\n\n与标准委托一样，你也可以使用上一章中概述的语法将匿名方法作为参数传递给其他方法，例如：\n\
  \n```csharp\nnamespace LambdaDemo\n{\n    internal class Program\n    {\n      \
  \  delegate string StringConverter(string value);\n        static void DisplayText(StringConverter\
  \ converter, string text)\n        {\n            string result = converter(text);\n\
  \            Console.WriteLine($\"Converted text = { result}\");\n        }\n  \
  \      static void Main(string[] args)\n        {\n            StringConverter converter\
  \ = delegate (string value)\n            {\n                Console.Write(\"Inline\
  \ conversion to lowercase > \");\n                return value.ToLower();\n    \
  \        };\n            DisplayText(converter, \"This IS a teST.\");\n        }\n\
  \    }\n}\n```\n\n运行上述代码将产生以下输出：\n\n```\nInline conversion to lowercase > Converted\
  \ text = this is a test.\n```\n\n## 16.3 Lambda \n\n你可以将 Lambda 认为是允许编写更简洁代码的匿名方法。与委托和匿名方法一样，你首先需要声明一个\
  \ `delegate` 类型的变量来存储 Lambda 引用，并使用以下现在已熟悉的语法定义返回值和参数类型：\n\n`delegate <returntype><delegatename>(<parameters>);</parameters></delegatename></returntype>`\n\
  \nLambda 使用 `=>` 运算符声明。运算符的左侧列出输入参数，右侧由包含要执行代码的表达式或代码块组成。\n\nC# 支持以下类型的 Lambda：\n\
  \n*   表达式 Lambda（Expression lambda）——Lambda 体包含一个要执行的单一表达式。\n*   语句 Lambda（Statement\
  \ lambda）——Lambda 体包含一个用大括号 `{}` 包围的语句块，其中包含多个语句。\n\n表达式 Lambda 的语法如下：\n\n`(input-parameters)\
  \ => expression`\n\n当向 Lambda 传递单个参数时，上述语法中放在输入参数周围的括号是可选的。\n\n另一方面，语句 Lambda 使用以下语法：\n\
  \n`(input-parameters) => { <statements>};</statements>`\n\n为了体会 Lambda 的简洁性，请考虑从我们的\
  \ `Program.cs` 文件中稍作修改匿名方法声明：\n\n```csharp\ndelegate string StringConverter(string\
  \ s);\n\nStringConverter converter = delegate (string s)\n{\n    return s.ToLower();\n\
  };\n```\n\n使用 Lambda，我们可以如下实现相同的行为：\n\n```csharp\ninternal class Program\n{\n  \
  \  delegate string StringConverter(string s);\n    static void Main(string[] args)\n\
  \    {\n        StringConverter converter = s => s.ToLower();\n        var result\
  \ = converter(\"LAMBDA Demo\");\n        Console.WriteLine(result);\n    }\n}\n\
  ```\n\n在使用 Lambda 之前，我们开始于：\n\n```csharp\ndelegate string StringConverter(string\
  \ s);\n\nStringConverter converter = delegate (string s)\n{\n    return s.ToLower();\n\
  };\n```\n\n使用 Lambda 允许我们将代码缩减为：\n\n```csharp\nStringConverter converter = s =>\
  \ s.ToLower();\n```\n\n由于 Lambda 只包含一个单一表达式，我们不需要声明类型。声明 Lambda 后，我们像这样调用它：\n\n\
  `converter(\"LAMBDA Demo\")`\n\n## 16.4 传递参数\n\n与标准委托一样，你也可以使用上一章概述的语法将匿名方法作为参数传递给其他方法，例如：\n\
  \n```csharp\nnamespace LambdaDemo\n{\n    internal class Program\n    {\n      \
  \  delegate string StringConverter(string value);\n        static void DisplayText(StringConverter\
  \ converter, string text)\n        {\n            string result = converter(text);\n\
  \            Console.WriteLine($\"Converted text = { result}\");\n        }\n  \
  \      static void Main(string[] args)\n        {\n            StringConverter converter\
  \ = delegate (string value)\n            {\n                Console.Write(\"Inline\
  \ conversion to lowercase > \");\n                return value.ToLower();\n    \
  \        };\n            DisplayText(converter, \"This IS a teST.\");\n        }\n\
  \    }\n}\n```\n\n运行上述代码将产生以下输出：\n\n```\nInline conversion to lowercase > Converted\
  \ text = this is a test.\n```\n\n如果你需要向 Lambda 传递多个参数，可以通过将它们括在括号中来实现，例如：\n\n```csharp\n\
  delegate string StringConverter(string s, int i);\n\nStringConverter converter =\
  \ delegate (string s, int i)\n{\n    return s.ToLower() + i.ToString();\n};\n```\n\
  \n## 16.5 不传递参数\n\n另一种，不接受参数的 Lambda 使用空括号声明：\n\n```csharp\ndelegate string GetGreeting();\n\
  \nGetGreeting greeting = () => \"Hello World\";\n```\n\n## 16.6 局部函数\n\n局部函数在许多方面与\
  \ Lambda 表达式相似，但也有一些区别。它们是在方法内部声明的命名方法。例如，以下是我们的 `StringConverter` 的局部函数：\n\n```csharp\n\
  delegate string StringConverter(string s);\n\nStringConverter converter(string s)\n\
  {\n    return s.ToLower();\n};\n```\n\n由于 Lambda 只包含一个单一表达式，我们可以简化为：\n\n```csharp\n\
  StringConverter converter = s => s.ToLower();\n```\n\n此示例中的关键点是局部函数可以访问局部变量，而这些变量\
  \ Lambda 无法直接访问。\n\n## 16.7 创建 LambdaDemo 项目\n\n为了尝试局部函数，请在 VS Code 中创建一个新的 .NET\
  \ 控制台应用程序，并将其命名为 `LambdaDemo`。创建项目后，编辑 `Program.cs` 文件使其内容如下：\n\n```csharp\nnamespace\
  \ LambdaDemo\n{\n    internal class Program\n    {\n        static void Main(string[]\
  \ args)\n        {\n            ConvertToEuros(10.00);\n        }\n        private\
  \ static void ConvertToEuros(double value)\n        {\n            var exchangeRate\
  \ = 0.5;\n            double USDToEuro(double dollars) => exchangeRate * dollars;\n\
  \            var result = USDToEuro(value);\n            Console.WriteLine(result);\n\
  \        }\n    }\n}\n```\n\n## 16.8 递归局部函数\n\n\n\n\n\n局部函数也可以递归调用（换句话说，本地函数可以直接或间接地调用其自身）。计算数字的阶乘是递归的一个经典示例。以下代码声明了一个名为\
  \ `FindFactorial()` 的方法，其中包含一个名为 `Factorial()` 的本地函数，它通过递归调用自己来识别数字的阶乘：\n\n```csharp\n\
  private static int FindFactorial(int value)\n{\n    int Factorial(int number)\n\
  \    {\n        // Base case\n        if (number == 0)\n        {\n            return\
  \ 1;\n        }\n        // Recursive case\n        return number * Factorial(number\
  \ - 1);\n    }\n    return Factorial(value);\n}\n```\n\n将上述方法添加到 `Program.cs` 文件中，并按所示从\
  \ `Main()` 方法中调用它：\n\n```csharp\nstatic void Main(string[] args)\n{\n    for (int\
  \ i=1; i<10; i++)\n    {\n        var factorial = FindFactorial(i);\n        Console.WriteLine($\"\
  {i}! = {factorial}\");\n    }\n}\n```\n\n当程序运行时，它将生成以下输出：\n1! = 1\n2! = 2\n3! =\
  \ 6\n4! = 24\n5! = 120\n6! = 720\n7! = 5040\n8! = 40320\n9! = 362880\n\n## 16.9\
  \ Lambda 表达式与本地函数\n\n通常情况下，在 Lambda 表达式和本地函数之间进行选择取决于个人编码风格，尽管使用本地函数具有某些优势，例如可以直接访问局部变量和支持递归。本地函数被认为比\
  \ Lambda 表达式更高效，因为它们不需要分配委托。\n\n值得注意的是，当你在 VS Code 中编写 Lambda 表达式时，编辑器通常会建议你将其转换为本地函数，这暗示了微软对该问题的看法：\n\
  \n![](img/image-5B652R3K.png)\n图 16-1\n\n## 16.10 接受知识测试\n\n点击下方的链接或扫描二维码以测试你对 C#\
  \ 本地函数和 Lambda 表达式的知识和理解：\n\n[`www.answertopia.com/v233`](https://www.answertopia.com/v233)\n\
  \n![](img/image-W0NI70OM.jpg)\n\n## 16.11 总结\n\n本章探讨了匿名方法、Lambda 表达式和本地函数如何让你编写出简洁且可重用的、可以在方法之间传递的\
  \ C# 代码。Lambda 表达式比匿名方法产生更简洁的代码，而本地函数具有简洁性、直接访问局部变量以及支持递归的优势。出于效率和局部变量访问的考虑，通常本地函数优于匿名方法和\
  \ Lambda 表达式。\n\n## 17. C#\n\n### 继承\n\n在《C# 面向对象编程简介》中，我们涵盖了面向对象编程的基本概念，并完成了一个使用\
  \ C# 创建和操作新类的示例。在那个示例中，我们的新类并没有显式地派生自基类（尽管所有的 C# 类最终都派生自 `System.Object`）。本章将深入探讨\
  \ C# 中的继承和子类概念。\n\n## 17.1 什么是继承？\n\n继承的概念为编程引入了现实世界的视角。它允许定义一个具有若干特征的类，然后让其他类派生自该类。派生类继承父类的所有特征，并通常会添加自己的一些特征。\n\
  \n通过派生类，我们创建了通常所说的类层次。层次结构顶端的类称为基类（base class），派生类称为子类（subclasses）。一个类可以派生出任意数量的类。然而，一个派生类只能继承一个类。因此，C#\
  \ 被称为`单继承`编程语言。类并不非要派生自基类。例如，一个子类也可以继承自另一个子类。\n\n## 17.2 一个 C# 继承示例\n\n与大多数编程概念一样，C#\
  \ 中的继承主题通过示例来说效果最好。在《C# 面向对象编程简介》章节中，我们创建了一个名为 `ObjectDemo` 的项目，其中包含一个 `BankAccount`\
  \ 类。我们将使用这个示例来演示 C# 继承。\n\n启动 VS Code，打开你的“C# Essentials”工作空间文件夹，并使用资源管理器找到 `ObjectDemo`\
  \ 项目中的 `BankAccount.cs` 文件，如下图 17-1 所示：\n\n![](img/image-DSM63GCY.png)\n图 17-1\n\
  \n一旦项目加载到 VS Code 中，编辑 `BankAccount.cs` 文件并向类添加一个额外的字段和属性来存储余额：\n\n```csharp\nnamespace\
  \ ObjectDemo;\npublic class BankAccount\n{\n    private string _accountName;\n \
  \   private int _accountNumber;\n    private double _accountBalance;\n\n    public\
  \ BankAccount(string accountName, int accountNumber, double accountBalance)\n  \
  \  {\n        _accountName = accountName;\n        _accountNumber = accountNumber;\n\
  \        _accountBalance = accountBalance;\n    }\n\n    public double AccountBalance\n\
  \    {\n        get => _accountBalance;\n        set => _accountBalance = value;\n\
  \    }\n\n    public void DisplayName()\n    {\n        Console.WriteLine($\"Customer\
  \ is {AccountName}\");\n    }\n}\n```\n\n该类在定义任何银行账户共有的特征（如账户持有人姓名、账号）方面表现得出色。这个类成功定义了任何银行账户共有的特征，例如账户持有人姓名、账号和当前余额。然而，想象我们的程序需要支持多种类型的账户。例如，银行可能会为客户提供计息储蓄账户。储蓄账户将拥有\
  \ `BankAccount` 的所有特征，但还需要一种存储利率的方法。\n\n## 17.3 创建子类\n\n既然我们已经确定需要创建一个 `BankAccount`\
  \ 类的子类，我们现在就可以查看如何实现它。子类的声明方式与其他任何类相同，区别在于类名后面跟着一个冒号（`:`）以及它继承的类名。\n\n考虑到这一点，我们首先可以通过使用资源管理器添加新文件。在资源管理器中，将鼠标指针悬停在\
  \ `ObjectDemo` 条目上并点击新建文件按钮。在文件模板中，选择 `Class` 并在按下 Enter 键之前将新类命名为 `SavingsAccount`。当新文件加载到编辑器时，修改类声明以派生自\
  \ `BankAccount`：\n\n```csharp\nnamespace ObjectDemo;\npublic class SavingsAccount\
  \ : BankAccount\n{\n}\n```\n\n我们现在创建了一个名为 `SavingsAccount` 的 `BankAccount` 子类，但此时\
  \ `SavingsAccount` 类与其父类没有区别。接下来，我们需要添加一个构造函数和一些新成员以添加我们需要的行为：\n\n```csharp\npublic\
  \ class SavingsAccount : BankAccount\n{\n    private double _interestRate;\n\n \
  \   public SavingsAccount(string accountName, int accountNumber, double accountBalance,\
  \ double interestRate)\n        : base(accountName, accountNumber, accountBalance)\n\
  \    {\n        _interestRate = interestRate;\n    }\n\n    public double InterestRate\n\
  \    {\n        get => _interestRate;\n        set => _interestRate = value;\n \
  \   }\n\n    public double MonthlyInterest()\n    {\n        return (_interestRate\
  \ * AccountBalance) / 12;\n    }\n}\n```\n\n我们现在有一个名为 `SavingsAccount` 的新类，它继承了\
  \ `BankAccount` 类的所有成员，并添加了一些属于自己的成员。特别是，我们添加了一个名为 `InterestRate` 的新数据成员，用于用于存储账户支付的利率，以及一个计算每月利息的新方法。\n\
  \n## 17.4 向基类构造函数传递参数\n\n\n\n\n`SavingsAccount` 声明中的构造函数具有特别的意义。在 `BankAccount`\
  \ 基类中，我们有一个接受账户名称、账号和余额参数的构造函数。在 `SavingsAccount` 子类中，我们还必须接受利率值。`: base()` 代码指示\
  \ C# 使用基类 `BankAccount` 类的构造函数来处理名称、账号和余额参数，而将利率留给 `SavingsAccount` 构造函数：\n\n```csharp\n\
  public SavingsAccount(string accountName, int accountNumber,\n                 \
  \     double accountBalance, double interestRate)\n                      : base(accountName,\
  \ accountNumber, accountBalance)\n```\n\n完成 `SavingsAccount` 子类的编写后，我们就可以在项目中使用它了。编辑\
  \ `Program.cs` 文件并进行如下修改：\n\n```csharp\nusing ObjectDemo;\n\nSavingsAccount account\
  \ = new(accountName: \"John Smith\", accountNumber: 12312, accountBalance: 1000.99,\
  \ interestRate: 0.05);\n\nConsole.WriteLine($\"Interest earned this month = { account.MonthlyInterest()}\"\
  );\n\naccount.DisplayName();\n```\n\n当程序运行时，应用将在控制台中显示以下输出：\n\n```\nInterest earned\
  \ this month = 4.17079166666667\nCustomer name is John Smith\n```\n\n## 17.5 重写被继承的方法\n\
  \n在使用继承时，在父类中发现一个几乎能实现你需求、但需要修改以提供你所需的精确功能的方法，这并不稀奇。在这种情况下，一种方案是忽略继承的方法并编写一个具有完全新名称的方法。更好的方案是\
  \ `override`（重写）继承的方法并在子类中编写一个新版本。\n\n在继续示例之前，重写方法时必须遵守三个规则：\n\n1. 子类中重写的方法 get\
  \ 参数数量和类型必须与父类中被重写的方法相同。\n2. 新方法的返回类型必须与父类方法相同。\n3. 基类中的方法声明必须使用 `virtual`、`abstract`\
  \ 或 `override` 修饰符进行声明。\n\n抽象和虚类成员的主题将在下一章介绍。\n\n在我们的 `BankAccount` 类中，有一个名为 `DisplayName()`\
  \ 的方法，用于显示账户持有者的姓名。在我们的 `SavingsAccount` 子类中，我们可能还想输出分配给账户的当前利率。为了实现这一点，第一步是在 `BankAccount`\
  \ 类中将该方法声明为 `virtual`（虚）：\n\n```csharp\npublic class BankAccount\n{\n.\n.\n    virtual\
  \ public void DisplayName()\n    {\n        Console.WriteLine($\"Customer name is\
  \ {AccountName}\");\n    }\n.\n.\n}\n```\n\n接下来，我们在 `SavingsAccount` 子类中声明 `DisplayBalance()`\
  \ 方法的新版本，并加上 `override` 修饰符：\n\n```csharp\npublic class SavingsAccount : BankAccount\n\
  {\n.\n.\npublic override void DisplayName()\n    {\n        Console.WriteLine($\"\
  Customer name is { AccountName }\");\n        Console.WriteLine($\"Account is earning\
  \ { InterestRate }% interest.\");\n    }\n}\n```\n\n现在，当我们调用 `SavingsAccount` 类实例的\
  \ `DisplayName()` 方法时，我们获得了关于客户利率的信息：\n\n```\nInterest earned this month = 4.17079166666667\n\
  Customer name is John Smith\nAccount is earning 0.05% interest.\n```\n\n在子类内部调用基类中的重写方法也是可能的。例如，可以调用基类的\
  \ `DisplayName()` 方法在显示利率之前显示账户持有者的姓名，从而消除了进一步的代码重复。使用点符号表示法，我们可以如下调用 `base` 上的上的方法：\n\
  \n```csharp\npublic override void DisplayName()\n{\n    base.DisplayName();\n  \
  \  Console.WriteLine($\"Account is earning { InterestRate }% interest.\");\n}\n\
  ```\n\n## 17.6 知识测试\n\n点击下方的链接或扫描二维码，以测试你对 C# 继承的知识和理解：\n\n[`www.answertopia.com/mdqq`](https://www.answertopia.com/mdqq)\n\
  \n![](img/image-BXQJ19W6.jpg)\n\n## 17.7 总结\n\n在 C# 中，继承是一种编程概念，允许从现有类创建新类，并对其进行扩展以添加新功能。这意味着，当一个现有类提供了程序员所需的部分（但不是全部）功能时，该类可以作为新子类的基类。通过这种方式，新的子类将继承父类的所有能力，并可以进一步扩展以添加任何缺失的功能。\n\
  \n# 18. C# 抽象类\n\n在前面的章节中，我们检查了 C# 中的面向对象编程和类继承的概念。本章将介绍抽象类。\n\n## 18.1 什么是 C# 抽象类？\n\
  \n在本书到为止所过的示例中，我们创建了既可以被实例化为对象，也可以作为基类来派生类的类。通常情况下，基类并不是为了被实例化，而是仅作为子类的轮廓或模板提供的。这样的类被称为抽象类。抽象类不能被实例化为对象，仅用于派生子类。\n\
  \n## 18.2 抽象成员\n\nC# 抽象类包含抽象成员，这些成员定义了子类必须包含的内容。这些抽象成员声明了需要特定类型的成员，但它并没有实现该成员。抽象成员的实发生在派生类中。派自抽象类的未实现抽象方法将产生语法错误。\n\
  \n## 18.3 声明抽象类\n\n除了使用类修饰符外，正如我们之前看到的，抽象类还必须使用 `abstract` 修饰符声明：\n\n```csharp\n\
  public abstract class Talk\n}\n```\n\n抽象类的方法和属性也使用 `abstract` 关键字声明。例如，为了在 `Talk`\
  \ 类中声明一个抽象方法，需要以下代码：\n\n```csharp\npublic abstract class Talk\n{\n    public abstract\
  \ void Speak();\n}\n```\n\n现在我们有一个具有 `Speak()` 方法的抽象类。注意，此声明表示派自 `Talk` 的任何类都实现该方法。\n\
  \n## 18.4 派自抽象类\n\n要从抽象类派生，我们编写代码如下：\n\n```csharp\npublic class SayHello : Talk\n\
  {\n}\n```\n\n现在我们有一个派自 `Talk` 的类 `SayHello`。下一步是实现 `Speak()` 方法。在派生类中实现抽象成员时，必须使用\
  \ `override` 修饰符。例如：\n\n```csharp\npublic override void Speak() {\n    Console.WriteLine(\"\
  Hello!\");\n}\n```\n\n## 18.5 创建 AbstractClassDemo 项目\n\n掌握了抽象类的基础后，我们可以在项目中使用这些知识。首先在\
  \ VS Code 中创建一个名为 `AbstractClassDemo` 的 .NET 控制台项目。使用解决方案，向 `AbstractClassDemo`\
  \ 项目添加一个名为 `Talk` 的类。编辑 `Talk.cs` 文件，将 `Talk` 类声明为抽象，并添加抽象 `Speak()` 方法如下：\n\n```csharp\n\
  namespace AbstractClassDemo;\n\npublic abstract class Talk\n{\n    public abstract\
  \ void Speak();\n}\n```\n\n接下来，我们需要添加第二个派自 `Talk` 类的类。重复上述步骤，向项目添加一个类文件，这次将其命名为\
  \ `SayHello.cs`。一旦文件已添加，对其进行如下更改以派自 `Talk` 并实现 `Speak()` 方法：\n\n```csharp\nnamespace\
  \ AbstractClassDemo\n{\n    internal class SayHello : Talk\n    {\n        public\
  \ override void Speak()\n        {\n            Console.WriteLine(\"Hello!\");\n\
  \        }\n    }\n}\n```\n\n最后，修改 `Program.cs` 文件以使用这些新类：\n\n```csharp\nusing AbstractClassDemo;\n\
  ```\n\n\n\n\n```csharp\nSayHello demo = new();\n\ndemo.Speak();\n```\n\n运行应用程序以确认控制台中显示了“Hello!”\
  \ 消息。\n\n## 18.6 抽象成员与虚拟成员\n\n到目前为止，我们只查看了抽象类的成员。如上文所述，抽象成员在基类中没有实现，并且必须在派生类中实现才能使类通过。\n\
  \n另一种类型的成员是虚拟成员（virtual member）。被定义为 `virtual` 的成员必须在基类中实现，但如果需要不同的行为，可以在派生类中可选地对其重写。虚拟成员在基类中使用\
  \ `virtual` 修饰符声明。\n\n例如，按照如下所示修改 `Talk` 类，包含一个名为 `Goodbye()` 的虚拟成员：\n\n```csharp\n\
  namespace AbstractClassDemo;\n\npublic abstract class Talk\n{\n    public abstract\
  \ void Speak();\n\n    public virtual void Goodbye()\n    {\n        Console.WriteLine(\"\
  Talk class says goodbye!\");\n    }\n}\n```\n\n接下来，在 `Program.cs` 文件中进行以下更改以调用 `Goodbye()`\
  \ 方法：\n\n```csharp\nSayHello demo = new();\n\ndemo.Speak();\n\ndemo.Goodbye();\n\
  ```\n\n当应用程序运行时，`Speak()` 和 `Goodbye()` 方法将生成如下输出：\n\n```\nHello!\nTalk class says\
  \ goodbye!\n```\n\n假设我们决定 `Talk` 类提供的默认 `Goodbye()` 方法不符合 `SayHello` 子类的需求。在这种情况下，我们可以使用\
  \ `override` 修饰符实现我们自己的方法版本：\n\n```csharp\npublic class SayHello : Talk\n{\n   \
  \ public override void Speak()\n    {\n        Console.WriteLine(\"Hello!\");\n\
  \    }\n\n    public override void Goodbye()\n    {\n        Console.WriteLine(\"\
  SayHello class says goodbye!\");\n    }\n}\n```\n\n当代码执行时，将调用子类中的 `Goodbye()` 方法，而不是\
  \ `Talk` 类中的虚拟版本：\n\n```\nHello!\nSayHello class says goodbye!\n```\n\n与非抽象类一样，子类也可以调用虚拟方法的基类实现。例如，子类版本的\
  \ `Goodbye()` 方法可以修改为在调用自己的同时也调用被重写的基类 `Goodbye()` 方法，如下所示：\n\n```csharp\npublic\
  \ class SayHello : Talk\n{\n    public override void Speak()\n    {\n        Console.WriteLine(\"\
  Hello!\");\n    }\n\n    public override void Goodbye()\n    {\n        base.Goodbye();\n\
  \        Console.WriteLine(\"SayHello class says goodbye!\");\n    }\n}\n```\n\n\
  当调用 `Goodbye()` 方法时，两种变体的输出都将被显示：\n\n```\nHello!\nTalk class says goodbye!\nSayHello\
  \ class says goodbye!\n```\n\n## 18.7 进行知识测试\n\n点击下方的链接或扫描二维码来测试你对 C# 抽象类的知识和理解：\n\
  \nhttps://www.answertopia.com/76b9\n\n![](img/image-8DUERS6H.jpg)\n\n## 18.8 总结\n\
  \n抽象类是不能直接实例化为对象的基类。相反，它们提供了一个模板，定义了子类必须满足的 set。抽象类的成员可以声明为 `abstract` 或 `virtual`。抽象成员在抽象类中不包含任何实现，并且必须在派生类中被重写并实现。另一方面，虚拟成员在抽象类中提供了一个回退实现，当该成员在子类中未被重写时使用。\n\
  \n# 19. C# 接口\n\n在本章中，我们将解释 C# 接口、如何编写自己的接口，以及如何让其他类遵守接口。\n\n## 19.1 理解 C# 接口\n\n\
  默认情况下，只要类语法正确，没有特定的规则规定 C# 类必须遵循什么。然而，在某些情况下，类必须满足特定标准才能与其他类协作。这在编写需要与其他库一起运行的类时尤为常见。接口是一组规则，定义了类必须满足的最低要求。接口使用\
  \ `interface` 关键字声明，并定义了类为了符合一致性而必须包含的方法和属性。当一个类采用接口但没有满足所有接口要求时，将报告错误，指出该类未符合接口。与抽象类不同，接口不包含成员的实现。\n\
  \n## 19.2 声明接口\n\n接口的声明方式与其他类非常相似，只是在声明中使用 `interface` 关键字代替 `class` 关键字。考虑以下接口声明。任何采用此接口的类必须包含一个名为\
  \ `DemoMethod()` 的方法，该方法不接受参数并返回一个字符串值：\n\n```csharp\ninterface IDemoInterface\n\
  {\n    void DemoMethod();\n}\n```\n\n注意，惯例是用接口名称前缀“I”，以与非接口类区分来。\n\n与抽象类不同，接口不能包含其成员的实现。例如，以下并不是一个有效的接口：\n\
  \n```csharp\ninterface IDemoInterface\n{\n    void DemoMethod()\n    {\n       \
  \ Console.WriteLine(\"Hello\");\n    }\n}\n```\n\n上述代码将生成错误：`Target doesn't support\
  \ interface implementation`。\n\n为了符合 `IDemoInterface`，类必须包含 `DemoMethod()` 的实现。例如：\n\
  \n```csharp\npublic class DemoClass : IDemoInterface\n{\n    public void DemoMethod()\n\
  \    {\n        // 代码在此\n    }\n}\n```\n\n## 19.3 创建 InterfaceDemo 项目\n\n在涵盖了 C#\
  \ 接口的基础知识后，我们可以在示例中使用这些知识。首先创建一个名为 `InterfaceDemo` 的 .NET 控制台应用程序项目。\n\n## 19.4\
  \ 添加 C# 接口文件\n\n下一步是使用解决方案管理器添加一个接口文件。解决方案管理器位于面板底部，如图 19-1 所示：\n\n![](img/image-83351.jpg)\
  \ \n\n在解决方案管理器中，将鼠标指针悬停在 `InterfaceDemo` 条上以显示新文件和文件夹按钮：\n\n![](img/image-RI3OE2Z.jpg)\
  \ \n\n点击图 19-2 中箭头所示的新文件按钮，以显示图 19-3 所示的新建文件面板。在面板中，选择 `Interface` 选项：\n\n![](img/image-7766METE.jpg)\
  \ \n\n在按下 Enter 键之前，命名接口 `IMessageBuilder`。新文件将自动加载到编辑器中，内容如下：\n\n```csharp\nnamespace\
  \ InterfaceDemo;\n\npublic interface IMessageBuilder\n{\n}\n```\n\n修改接口声明，添加一个名为\
  \ `ShowMessage()` 的接口成员：\n\n```csharp\nnamespace InterfaceDemo;\n\npublic interface\
  \ IMessageBuilder\n{\n    void ShowMessage();\n}\n```\n\n任何采用 `IMessageBuilder`\
  \ 接口的类都必须包含 `ShowMessage()` 成员。使用解决方案管理器向项目中添加名为 `MyMessageBuilder` 的类文件，并按如下方式对其修改以实现\
  \ `IMessageBuilder` 接口：\n\n```csharp\nnamespace InterfaceDemo;\n\npublic class MyMessageBuilder\
  \ : IMessageBuilder\n{\n}\n```\n\n在上述更改之后，编辑器将报告以下错误：`'MyMessageBuilder' does not\
  \ implement interface member 'IMessageBuilder.ShowMessage()'`。\n\n`MyMessageBuilder`\
  \ 类产生此错误是因为它没有包含 `ShowMessage()` 方法的实现。为了符合接口，我们需要实现 `ShowMessage()` 方法：\n\n```csharp\n\
  namespace InterfaceDemo;\n\npublic class MyMessageBuilder : IMessageBuilder\n{\n\
  \    public void ShowMessage()\n    {\n    }\n}\n```\n\n## 19.5 接口数据成员\n\n接口还可以包含数据成员。处理接口时的一个重要规则是变量必须声明为属性，不能声明为字段或常量（关于字段和属性区别的回顾请参考“C#\
  \ 面对象编程导论”章节）。因此，下面的声明将产生语法错误：\n\n```csharp\npublic interface IMessageBuilder\n\
  {\n    int myField;\n}\n```\n\n\n\n\n```csharp\nstring myMessage; // 接口中不能包含字段\n\
  \nvoid ShowMessage();\n\n}\n```\n\n相反，变量需要声明为属性：\n\n```csharp\npublic interface\
  \ IMessageBuilder\n{\n    string MyMessage { get; set; }\n    void ShowMessage();\n\
  }\n```\n\n请注意，在上述接口中声明了 `get` 和 `set` 访问器方法，但并没有实现。作为接口方法，它们的实现在符合接口的类声明中。\n\n既然\
  \ `IMessageBuilder` 接口要求一个名为 `MyMessage` 的字符串属性，我们需要相应地修改 `MyMessageBuilder` 类：\n\
  \n```csharp\npublic class MyMessageBuilder : IMessageBuilder\n{\n    private string\
  \ _myMessage = \"\";\n\n    public string MyMessage\n    {\n        get => _myMessage;\n\
  \        set => _myMessage = value;\n    }\n    public void ShowMessage()\n    {\n\
  \        Console.WriteLine(_myMessage);\n    }\n}\n```\n\n接下来，修改 `Program.cs` 文件以创建\
  \ `MyMessageBuilder` 对象并调用 `ShowMessage()` 方法：\n\n```csharp\nusing InterfaceDemo;\n\
  MyMessageBuilder msgBuilder = new()\n{\n    MyMessage = \"Interface Demo\"\n};\n\
  msgBuilder.ShowMessage();\n```\n\n最后，编译并运行应用程序以测试消息是否显示。\n\n## 19.6 知识测试\n\n点击下方的链接或扫描二维码来测试你对\
  \ C# 接口（Interfaces）的知识和理解：\n\n[`www.answertopia.com/2tw1`](https://www.answertopia.com/2tw1)\n\
  \n![](img/image-GE713KXZ.jpg)\n\n## 19.7 总结\n\nC# 接口定义了类的最低要求，确保与其他库的兼容性。为了实现接口，类必须实现匹配接口方法和属性。接口可以包含数据成员，这些成员必须声明为属性。\n\
  \n# 20. C# 结构体\n\n## 引言\n\n在前面的章节中介绍了 C# 类之后，本章将介绍 C# 中结构体（structures）的使用。虽然结构体和类表面看起来相似，但在决定使用哪一个时，需要理解一些重要的区别。本章将概述如何声明和使用结构体，探索结构体与类之间的区别，并引入值类型和引用类型的概念。\n\
  \n## 20.1 C# 结构体概述\n\n与类一样，结构体构成了面向对象编程的基础，并提供了一种数据和功能封装到可重用实例的方法。结构体声明与类相似，但使用\
  \ `struct` 关键字代替了 `class` 关键字。例如，以下代码声明了一个包含 `String` 变量、初始化器和方法的简单结构体：\n\n```csharp\n\
  public struct SampleStruct(string name)\n{\n    private string _name = name;\n \
  \   public string Name {\n        get => _name;\n        set => _name = value;\n\
  \    }\n    public string BuildHelloMsg() {\n        return \"Hello \" + _name;\n\
  \    }\n}\n```\n\n将上述结构体声明与等效类声明进行比较：\n\n```csharp\npublic class SampleClass(string\
  \ name)\n{\n    private string _name = name;\n    public string Name {\n       \
  \ get => _name;\n        set => _name = value;\n    }\n    public string BuildHelloMsg()\
  \ {\n        return \"Hello \" + _name;\n    }\n}\n```\n\n除了使用 `struct` 关键字代替 `class`\
  \ 之外，这两个声明是完全相同的。每种类型的实例也使用相同的语法创建：\n\n```csharp\nSampleStruct demoStruct = new(name:\
  \ \"Alex\");\nSampleClass demoClass = new(name: \"Anna\");\n```\n\n鉴于类和结构体之间的共性，理解它们之间的区别至关重要。在探索最显著的区别之前，首先必须理解值类型和引用类型的概念。\n\
  \n## 20.2 创建 StructureDemo 项目\n\n启动 VS Code，打开你的“C# Essentials”工作区文件夹并创建一个名为 `StructureDemo`\
  \ 的新 .NET 控制台应用项目。\n\n## 20.3 值类型与引用类型\n\n虽然结构体和类表面上相似，但当结构和类实例复制或作为参数传递给方法时，行为会发生重大差异。这是因为结构体实例是值类型，而类实例是引用类型。\n\
  \n当结构体实例被复制或传递给方法时，会创建一个实例的实际副本，以及实例中包含的任何数据。这意味着副本拥有自己的数据版本，与原始结构体实例不连接。实际上，这意味着在运行的程序中可能存在多个结构体实例的副本，每个副本都有其关联数据的本地副本。对一个实例的更改对其他实例没有影响。相反，当类实例被复制或作为参数传递时，唯一复制的是该实例所在位置的引用。使用其中一个引用进行的任何更改都会反映在所有引用上。\n\
  \n## 20.4 添加结构体\n\n为了演示引用类型和值类型的实际运行，使用解决方案管理器向 `StructureDemo` 项目中添加一个名为 `SampleStruct`\
  \ 的新结构体。按照通常步骤添加文件，这次按如下所示选择结构体选项：\n\n![](img/image-5.png)\n图 20-1\n\n文件创建后，将其修改为如下：\n\
  \n```csharp\nnamespace StructureDemo;\n\npublic struct SampleStruct(string name)\n\
  {\n    private string _name = name;\n    public string Name {\n        get => _name;\n\
  \        set => _name = value;\n    }\n    public string BuildHelloMsg() {\n   \
  \     return \"Hello \" + _name;\n    }\n}\n```\n\n接下来，修改 `Program.cs` 文件以创建 `SampleStruct`\
  \ 对象并调用 `BuildHelloMsg()` 方法：\n\n```csharp\nusing StructureDemo;\nSampleStruct myStruct1\
  \ = new(name: \"Mark\");\nConsole.WriteLine(myStruct1.BuildHelloMsg());\n```\n\n\
  当代码执行时，将显示“Hello Mark”。现在修改代码，创建一个 `myStruct1` 实例的副本，更改名称属性并显示每个实例的名字：\n\n```csharp\n\
  SampleStruct myStruct1 = new(name: \"Mark\");\nSampleStruct myStruct2 = myStruct1;\n\
  myStruct2.Name = \"David\";\nConsole.WriteLine(myStruct1.BuildHelloMsg());\nConsole.WriteLine(myStruct2.BuildHelloMsg());\n\
  ```\n\n执行时，输出将：\n\nHello Mark\nHello David\n\n显然，名称更改仅适用于 `myStruct2`，因为它是 `myStruct1`\
  \ 的实际副本，包含了自己的数据副本，如下所示：\n\n![](img/image-2WT.png)\n图 20-2\n\n为了与等效类对比这种行为，向项目添加一个名为\
  \ `SampleClass` 的类，并按如下方式实现：\n\n```csharp\nnamespace StructureDemo;\n\npublic class\
  \ SampleClass(string name)\n{\n    private string _name = name;\n    public string\
  \ Name {\n        get => _name;\n        set => _name = value;\n    }\n    public\
  \ string BuildHelloMsg() {\n        return \"Hello \" + _name;\n    }\n}\n```\n\n\
  将类添加到项目后，修改 `Program.cs` 文件以重复结构体示例中执行的操作：\n\n```csharp\nSampleClass myClass1 =\
  \ new(name: \"Mark\");\nSampleClass myClass2 = myClass1;\nmyClass2.Name = \"David\"\
  ;\nConsole.WriteLine(myClass1.BuildHelloMsg());\nConsole.WriteLine(myClass2.BuildHelloMsg());\n\
  ```\n\n当此代码执行时，将生成以下输出：\n\nHello David\nHello David\n\n在这种情况下，名称属性的更改反映在 `myClass1`\
  \ 和 `myClass2` 上，因为它们都是指向同一个类实例的引用，如下图所示：\n\n![](img/image-E38.png)\n图 20-3\n\n\n\
  \n\n\n除了这些值类型和引用类型的区别外，结构体不支持像类那样的继承和子类。句话说，一个结构体无法继承另一个结构体。与类不同，结构体不能包含析构方法（finalizer）。结构体的成员不能指定为\
  \ `abstract`、`virtual` 或 `protected`。然而，结构体可以实现接口。\n\n## 20.5 只读结构体\n\n可以使用 `readonly`\
  \ 修饰符将结构体声明为只读。这样声明后，结构体的所有数据成员也必须声明为只读。对于字段成员（field），这需要使用 `readonly` 修饰符。另一方面，属性要么被声明为只读，要么使用\
  \ `init`-只读访问器（该主题在“C# 面对象编程导论”章节中介绍）。\n\n例如，下面的结构体包含一个只读字段和一个 `init`-只读属性：\n\n\
  ```csharp\nnamespace StructureDemo;\n\npublic readonly struct SampleStruct(string\
  \ name)\n{\n    private readonly string _name = name;\n\n    public string Name\
  \ {\n        get => _name;\n    }\n\n    public string BuildHelloMsg() {\n     \
  \   return \"Hello \" + _name;\n    }\n}\n```\n\n## 20.6 知识测试\n\n点击下方链接或扫描二维码以测试你对\
  \ C# 结构体的知识和理解：\n\n[`www.answertopia.com/i5tf`](https://www.answertopia.com/i5tf)\n\
  \n![](img/image-949XAYQJ.jpg)\n\n## 20.7 总结\n\nC# 结构体和类提供了一种创建实例以定义属性、存储值和定义方法的机制。尽管这两种机制看起来相似，但存在显著的本质差异，特别是当结构体和类实例被复制或传递给方法时。类被分类为引用类型实例，而结构体是值类型。当结构体实例被复制或传递时，会创建一个包含其数据的全新实例副本。另一方面，类实例是通过引用传递和复制的，每个引用都指向同一个类实例。类的其他特性还包括支持继承和析构函数。\n\
  \n# 21. C# 元组类型 Tuple Type\n\n在“C# 方法”章节中，我们学习了如何在 C# 中创建可以传递参数并返回结果的方法。本章将重点介绍\
  \ C# 元组类型，并理解它如何将一组值组合成单一实体。一旦创建，元组可以从一个方法传递到另一个方法，同时允许方法在单个返回值中返回多个结果。元组可以用极少的代码创建，并存储任何类型的数据。此外，元组内部存储的值不需要是相同类型。\n\
  \n## 21.1 创建 TupleDemo 项目\n\n要尝试 C# 元组类型，请启动 `VS Code`，打开你的“C# Essentials”工作空间文件夹并创建一个名为\
  \ `TupleDemo` 的新 .NET 控制台项目。\n\n## 21.2 声明元组\n\n当我们声明元组时，需要为其提供要存储的值以及可选相应的值类型。声明元组的语法如下：\n\
  \n`(<type1>, <type2>, ...) <tuplename>= (<value1>, <value2>, ...)`\n\n例如，如下所示修改\
  \ `Program.cs` 文件，添加顶层语句、`Main()` 方法以及一个包含元组声明的 `GetProductData()` 方法：\n\n```csharp\n\
  namespace TupleDemo\n{\n    internal class Program\n    {\n        static void Main(string[]\
  \ args)\n        {\n            GetProductData();\n        }\n        private static\
  \ void GetProductData()\n        {\n            (int, string, double) myTuple =\
  \ (10, \"Refrigerator\", 432.43);\n        }\n    }\n}\n```\n\n如果你不想声明每个元组值的类型，可以使用\
  \ `var` 关键字让编译器来推断值类型：\n\n`var myTuple = (10, \"Refrigerator\", 432.43);`\n\n##\
  \ 21.3 访问元组值\n\n可以使用几种不同的技术访问元组的元素。特定的元组值可以使用点符号法来访问 `Item <n>`，其中 `<n>` 是项目的编号（第一个值位于位置\
  \ 1）。例如，下面的代码从元组中提取第 2 个元素，将其赋值给变量并写入控制台：\n\n```csharp\nprivate static void GetProductData()\n\
  {\n    var myTuple = (10, \"Refrigerator\", 432.43);\n    Console.WriteLine(myTuple.Item2);\n\
  }\n```\n\n通过数字访问元组元素的替代方案是使用字段名。\n\n## 21.4 字段名\n\n## 创建元组时，你可以为每个值分配名称。当使用类型推断初始化元组时，字段名将放在每个值之前：\n\
  \n`(Count: 10, Product: \"Refrigerator\", Price: 432.43)`\n\n一旦分配了字段名，就可以像下面所示访问对应的值：\n\
  \n```csharp\nprivate static void GetProductData()\n{\n    var myTuple = (Count:\
  \ 10, Product: \"Refrigerator\", Price: 432.43);\n    Console.WriteLine(myTuple.Price);\n\
  \    Console.WriteLine(myTuple.Product);\n    Console.WriteLine(myTuple.Count);\n\
  }\n```\n\n应用程序运行时将出现以下输出：\n```\nPrice = 432.43\n```\n\n## 21.5 从方法返回元组\n\n元组对于从方法返回多个结果特别别有用。例如，假设我们需要的不是显示信息，而是让\
  \ `GetProductData()` 方法返回数据。为了实现这一点，需要在方法声明中包含元组的类型：\n\n```csharp\nprivate static\
  \ (int, string, double) GetProductData()\n{\n    return (10, \"Refrigerator\", 432.43);\n\
  }\n```\n\n或者，可以将单个值放在 `return` 语句后的括号中：\n\n```csharp\nprivate static (int, string,\
  \ double) GetProductData()\n{\n    return (10, \"Refrigerator\", 432.43);\n}\n```\n\
  \n调用时，返回的元组可以赋值给变量，并使用点符号访问：\n\n```csharp\nstatic void Main(string[] args)\n{\n\
  \    var myTuple = GetProductData();\n    Console.WriteLine($\"Price = {myTuple.Item1}\"\
  );\n    Console.WriteLine($\"Product = {myTuple.Item2}\");\n    Console.WriteLine($\"\
  Quantity = {myTuple.Item3}\");\n}\n```\n\n如果你喜欢使用字段名而不是默认的 `Item` 名称，一种方法是包含字段名和类型：\n\
  \n```csharp\nstatic void Main(string[] args)\n{\n    (int Count, string Product,\
  \ double Price) myTuple = GetProductData();\n    Console.WriteLine($\"Price = {myTuple.Price}\"\
  );\n    Console.WriteLine($\"Product = {myTuple.Product}\");\n    Console.WriteLine($\"\
  Quantity = {myTuple.Count}\");\n}\n```\n\n到目前为止，将元组值赋值给命名变量的最方便方法是使用类型推断：\n\n`var\
  \ (count, product, price) = GetProductData();`\n\n使用这种方法，我们可以直接访问这些变量，而无需先从元组中提取它们：\n\
  \n```csharp\nstatic void Main(string[] args)\n{\n    var (count, product, price)\
  \ = GetProductData();\n    Console.WriteLine($\"Price = {price}\");\n    Console.WriteLine($\"\
  Product = {product}\");\n    Console.WriteLine($\"Quantity = {count}\");\n}\n```\n\
  \n\n\n\n除了从方法返回元组结果外，你还可以将元组传递给方法。一个设计为接收示例元组作为参数的方法可以声明如下：\n\n```csharp\npublic\
  \ static void DisplayProductData((int, string, double) productTuple)\n{\n\n}\n```\n\
  \n或者，也可以为元组值分配字段名称：\n\n```csharp\npublic static void DisplayProductData((int count,\
  \ string description,\n                                        double price) productTuple)\n\
  {\n}\n```\n\n一旦声明方法，我们可以多种方式向其传递元组。一种方案是通过字面量值直接传递给方法：\n\n```csharp\nDisplayProductData((20,\
  \ \"Water filter\", 29.99));\n```\n\n另一种方案自然是创建一个元组对象并将其传递给方法：\n\n```csharp\nvar\
  \ myTuple = (20, \"Water filter\", 29.99);\nDisplayProductData(myTuple);\n```\n\n\
  修改 `Program.cs` 文件以添加 `DisplayProductData()` 方法并向其传递元组参数：\n\n```csharp\nstatic void\
  \ Main(string[] args)\n{\n    var myTuple = GetProductData();\n    DisplayProductData(myTuple);\n\
  }\n\npublic static void DisplayProductData((int, string, double) productTuple)\n\
  {\n    var (count, product, price) = productTuple;\n    Console.WriteLine($\"Price\
  \ = {price}\");\n    Console.WriteLine($\"Product = {product}\");\n    Console.WriteLine($\"\
  Quantity = {count}\");\n}\n```\n\n运行程序并验证产品信息是否在控制台中显示。\n\n## 21.7 知识测试\n\n点击下方的链接或扫描二维码，以测试你对\
  \ C# Tuple 类型的知识和理解程度：\n\n[`www.answertopia.com/pxci`](https://www.answertopia.com/pxci)\n\
  \n![](img/image-AG3YT80V.jpg)\n\n## 21.8 总结\n\nC# 元组允许我们临时地将多个值分组到单个实体中。一旦声明，元组就可以用于从方法返回一组结果值，或者在单个参数内在方法之间传递多个参数值。元组支持大多数\
  \ C# 数据类型（包括自定义对象），并且其项不需要是匹配的类型。我们可以通过项目编号和字段名访问元组项，或者直接将它们赋值给命名变量。\n\n## 22. C#\n\
  \n### 命名空间\n\n在前面的章节中，我们详细涵盖了面向对象的 C# 编程。我们学习了如何使用类和结构来组织代码，从而生成组织良好的的可重用代码。在目前使用的许多代码示例中，我们看到了命名空间声明。现在我们已经理解了面向对象编程，准备好去发现什么是命名空间、它们为什么存在以及如何使用它们。\n\
  \n## 22.1 理解作用域\n\n在讨论命名空间之前，我们首先需要理解与编程语言相关的作用域概念。作用域定义了类声明、方法和变量等实体对于当前作用域之外的代码是否可见可访问。在查看\
  \ C# 循环时，我们简要提到过作用域。例如，在 `for` 循环体内声明的变量只属于循环的作用域，在循环执行之前或之后不存在：\n\n```csharp\n\
  // 变量 myCounter 尚未存在\nfor (int i = 0; i < 10; i++)\n{\n    int myCounter = 0; //\
  \ 在 for 循环作用域内创建了 myCounter 变量\n    myCounter += i;\n}\n// 循环退出后，变量 myCounter 现在离开了作用域并消失\n\
  ```\n\n同样，类方法和属性位于它们声明所在的类的作用域内，并且只能通过引用包含它的类来访问。在下面的示例中，我们只能通过引用 `MyClass` 来访问\
  \ `IncrementCounter()` 方法：\n\n```csharp\nclass MyClass\n{\n    static int myCountr\
  \ = 0;\n    public static void IncrementCounter() {\n        myCounter++;\n    }\n\
  }\n\nMyClass.IncrementCounter();\n```\n\n作用域允许我们声明类和结构，而不担心一个类中的方法名可能与其他类中的方法冲突。例如，以下类中相同的方法名不会冲突，因为它们属于不同的作用域：\n\
  \n```csharp\nclass MyClass\n{\n    static int myCounter = 0;\n    public static\
  \ void IncrementCounter() {\n        myCounter++;\n    }\n}\n\nclass MyOtherClass\n\
  {\n    static int myCounter = 0;\n    public static void IncrementCounter() {\n\
  \        myCounter++;\n    }\n}\n```\n\n然而，当类和结构等实体本身具有冲突的名称时，就会出现问题。如果上述两个类都命名为\
  \ `MyClass`，那么解决方案是使用 `命名空间`。\n\n## 22.2 命名空间概述\n\n与类和结构一样，命名空间提供了一个额外的组织层。正如我们看到的，一个项目包含类和结构。特别是在大型项目中，作用域内声明的名称可能会与内置类发生冲突。下面的示例将触发冲突：\n\
  \n```csharp\nclass A {\n    Console.WriteLine(\"First\");\n}\n\nclass A {\n    Console.WriteLine(\"\
  Second\");\n}\n```\n\n命名空间允许将代码组织到独立的作用域中，以便名称不冲突。\n\n### 22.3 创建命名空间项目\n\n在本章的剩余部分，启动\
  \ VS Code，打开你的“C# Essentials”文件夹，并创建一个名为 `NamespaceDemo` 的新 .NET 项目。在资源管理器中找到新项目，编辑\
  \ `Program.cs` 文件，并将现有代码替换为：\n\n```csharp\nclass A {\n    Console.WriteLine(\"First\"\
  );\n}\n\nclass A {\n    Console.WriteLine(\"Second\");\n}\n\nnamespace SampleApp\
  \ {\n    internal class Program {\n        static void Main(string[] args) {\n \
  \       }\n    }\n}\n```\n\n此时，编辑器将报告以下错误：`The namespace '<global>' already contains\
  \ a definition for 'A'`。这告诉我们两个类都位于相同的命名空间中。\n\n## 22.4 声明命名空间\n\n使用 `namespace`\
  \ 关键字后跟名称和封装成员的大括号来声明命名空间。为了解决命名冲突，我们可以将第二个 `A` 声明放在单独的命名空间中，将第一个留在全局命名空间：\n\n```csharp\n\
  class A {\n    Console.WriteLine(\"First\");\n}\n\nnamespace DemoSpace {\n    class\
  \ A {\n        Console.WriteLine(\"Second\");\n    }\n}\n```\n\n进行上述更改后，重复定义的错误应该会被解决：\n\
  \n![](img/image-WOHCDJ5M.png)\n图 22-2\n\n单个源文件可以包含多个命名空间。修改示例以包含两个命名空间如下：\n\n```csharp\n\
  namespace DemoSpaceOne\n{\n    class A\n    {\n```\n\n\n\n\n\n```csharp\nConsole.WriteLine(\"\
  First ClassA OpenFile()\");\n\n        }\n    }\n}\n\nnamespace DemoSpaceTwo\n{\n\
  \    class ClassA\n    {\n        public static void OpenFile()\n        {\n   \
  \         Console.WriteLine(\"Second ClassA OpenFile()\");\n        }\n    }\n}\n\
  ```\n\n通过此更改，我们的项目现在包含了三个命名空间（除了 `Console.WriteLine()` 调用所需的 `System` 命名空间外）：`DemoSpaceOne`、`DemoSpaceTwo`\
  \ 以及全局命名空间：\n\n![](img/image-GBU31OYY.png)\n\n图 22-3\n\n## 22.5 访问命名空间成员\n\n由于两个\
  \ `ClassA` 定义位于不同的命名空间中，我们需要一种方法告诉编译器我们正在访问哪一个类。使用点表示法（dot notation），我们可以通过引用相应的命名空间来区分这些类。按如下方式修改\
  \ `Main()` 方法以调用每个 `ClassA` 实现中的 `OpenFile()` 方法：\n\n```csharp\nnamespace SampleApp\n\
  {\n    internal class Program\n    {\n        static void Main(string[] args)\n\
  \        {\n            DemoSpaceOne.ClassA.OpenFile();\n            DemoSpaceTwo.ClassA.OpenFile();\n\
  \        }\n    }\n}\n```\n\n编译并运行该程序，验证终端中是否出现了下列表输出：\n\n```\nFirst ClassA OpenFile()\n\
  Second ClassA OpenFile()\n```\n\n## 22.6 命名空间与“using” 关键字\n\n点表示法的替代方案是 `using`\
  \ 关键字，它会告诉编译器在没有显式命名空间声明的情况下默认使用哪个命名空间。例如，当在 `Main()` 方法中未指定命名空间时，以下更改将默认使用 `DemoSpaceTwo`：\n\
  \n```csharp\nusing DemoSpaceTwo;\n\nnamespace DemoSpaceOne\n{\n.\n.\n}\n\nnamespace\
  \ DemoSpaceTwo\n{\n.\n.\n}\n\nnamespace SampleApp\n{\n    internal class Program\n\
  \    {\n        static void Main(string[] args)\n        {\n            ClassA.OpenFile();\n\
  \        }\n    }\n}\n```\n\n当程序运行时，将调用属于 `DemoSpaceTwo` 命名空间的 `ClassA.OpenFile()`\
  \ 方法：\n\n```\nSecond ClassA OpenFile()\n```\n\n然而，要访问 `DemoSpaceOne` 的 `OpenFile()`\
  \ 方法，我们仍然必须如下所示覆盖由 `using` 语句指定的默认命名空间：\n\n```csharp\nusing DemoSpaceTwo;\n\nstatic\
  \ void Main(string[] args)\n{\n    ClassA.OpenFile() // 默认指向 DemoSpaceTwo\n    DemoSpaceOne.ClassA.OpenFile();\
  \ // 显式选择 DemoSpaceOne\n}\n```\n\n## 22.7 嵌套命名空间\n\n命名空间可以在其他命名空间内部声明，以创建嵌套层次结构。要体验嵌套命名空间，请在\
  \ `Program.cs` 文件中添加以下命名空间声明：\n\n```csharp\nnamespace DemoOne\n{\n    namespace\
  \ DemoTwo\n    {\n        namespace DemoThree\n        {\n            class ClassC\n\
  \            {\n                public static string message = \"DemoThree message\"\
  ;\n            }\n        }\n    }\n}\n```\n\n要访问 `message` 字段，我们需要引用包含它的每一个命名空间：\n\
  \n```csharp\nstatic void Main(string[] args)\n{\n    var message = DemoOne.DemoTwo.DemoThree.ClassC.message;\n\
  \    Console.WriteLine(message);\n}\n```\n\n当程序运行时，输出现在将是 `DemoThree message`。\n\
  \n## 22.8 别名与命名空间别名运算符\n\nC# 允许使用 `using` 关键字为命名空间引用分配别名。使用这种技术，我们可以如下为我们的嵌套命名空间分配别名：\n\
  \n```csharp\nusing DemoSpaceTwo;\nusing MyAlias = DemoOne.DemoTwo.DemoThree;\n.\n\
  .\n```\n\n要使用别名访问 `ClassC`，我们使用别名运算符（`::`）：\n\n```csharp\nstatic void Main(string[]\
  \ args)\n{\n    ClassA.OpenFile();\n    DemoSpaceOne.ClassA.OpenFile();\n    var\
  \ message = MyAlias::ClassC.message;\n    Console.WriteLine(message);\n}\n```\n\n\
  注意，别名声明并没有覆盖我们的 `using DemoSpaceTwo` 语句，我们仍然可以访问第二个 `ClassA` 的 `OpenFile()` 方法：\n\
  \n```csharp\nClassA.OpenFile();\n```\n\n别名运算符也可以用于显式访问全局命名空间中的对象。考虑以下类代码示例，该类既位于全局命名空间，又位于自定义命名空间中：\n\
  \n```csharp\nclass MyString\n{\n    public static string text = \"Global string\"\
  ;\n}\n\nnamespace SampleApp\n{\n    class MyString\n    {\n        public static\
  \ string text = \"Local string\";\n    }\n    internal class Program\n    {\n  \
  \      static void Main(string[] args)\n        {\n            Console.WriteLine(MyString.text);\n\
  \        }\n    }\n}\n```\n\n当上述代码执行时，将显示来自本地 `MyString` 类的 `text`。要访问全局类，我们可以使用别名运算符指定全局命名空间：\n\
  \n```csharp\nstatic void Main(string[] args)\n{\n    Console.WriteLine(MyString.text);\n\
  \    Console.WriteLine(global::MyString.text);\n}\n```\n\n## 22.9 文件作用域命名空间\n\n\
  如果源文件的全部内容属于同一个命名空间，可以使用文件作用域声明。在以下代码中，`ClassA` 和 `ClassB` 都声明在 `FileScopeSpace`\
  \ 命名空间中：\n\n```csharp\nnamespace FileScopeSpace;\n\nclass ClassA\n\nclass ClassB\n\
  ```\n\n文件作用域命名空间不能包含其他命名空间。因此，以下代码是无效的：\n\n```csharp\nnamespace FileScopeSpace;\n\
  \nclass ClassA\n{\n    public static void OpenFile()\n    {\n        Console.WriteLine(\"\
  Class A OpenFile()\");\n    }\n}\n\nnamespace SpaceOne // 无效的命名空间声明\n{\n    class\
  \ ClassB\n    {\n        public static void OpenFile()\n        {\n            Console.WriteLine(\"\
  Class B OpenFile()\");\n        }\n    }\n}\n```\n\n## 22.10 测试\n\n点击下方链接或扫描二维码测试你对命名空间的知识和理解：\n\
  \n[`www.answertopia.com/bkx3`](https://www.answertopia.com/bkx3)\n\n![](img/image-F998BJU.jpg)\n\
  \n## 22.11 总结\n\n在本章中，我们探索了 C# 命名空间并学会了如何使用它们组织项目并避免冲突。文件作用域命名空间允许整个源文件被指定属于同一个命名空间。\n\
  \n## 23. C#\n\n### 异常处理\n\n在完美的世界里，C# 代码永远不会遇到错误。由于我们并不生活在完美的世界里，因此无法保证代码在执行时不会发生错误（通常称为异常）。因此，确保代码能够顺利处理可能出现的异常至关重要。\n\
  \n本章介绍了使用 C# 进行异常处理，了异常类型、异常如何抛出以及如何使用 `try-catch` 语句处理异常等主题。\n\n\n\n\n\n## 23.2\
  \ 创建 ExceptionDemo 项目\n\n启动 VS Code，打开你的“C# Essentials”工作区文件夹，并创建一个名为 `ExceptionDemo`\
  \ 的 .NET 控制台应用程序。项目准备好后，按照以下方式修改 `Program.cs` 文件：\n\n```csharp\nnamespace ExceptionDemo\n\
  {\n    internal class Program\n    {\n        static void Main(string[] args)\n\
  \        {\n        }\n    }\n}\n```\n\n该项目是一个控制电机的假设应用程序。在通电诊断期间，该程序会读取当前电压，如果超过\
  \ 500 伏，则防止电机启动。在 `Program.cs` 文件中，添加一个执行电压检查的方法并在 `Main()` 方法中调用它：\n\n```csharp\n\
  namespace ExceptionDemo\n{\n    internal class Program\n    {\n        static void\
  \ Main(string[] args)\n        {\n            VoltageCheck(501);\n        }\n  \
  \      private static void VoltageCheck(int voltage)\n        {\n            if\
  \ (voltage > 500)\n            {\n                Console.WriteLine(\"Voltage overload.\"\
  );\n            }\n            else\n            {\n                Console.WriteLine(\"\
  Voltage is safe.\");\n            }\n        }\n    }\n}\n```\n\n运行该程序并检查控制台中是否出现了电压过载消息：\n\
  \n`Voltage overload.`\n\n电压过载是一个严重问题，因此我们不想仅仅显示一条消息并希望用户不要启动电机。相反，我们希望强制程序采取预防措施。为了做到这一点，我们将抛出一个异常。\n\
  \n## 23.3 抛出异常\n\n抛出异常的第一步是选择异常类型。正如我们之前提到的，异常可以使用许多内置类型之一或你创建的自定义类型来抛出。我们将在本章节后面的部分介绍自定义异常类型，因此现在我们将使用\
  \ `ArgumentOutOfRangeException` 类型。这种异常类型通常在传递给方法的参数超出接受范围时抛出（在我们的案例中，是电压读数超过 500\
  \ 伏）。\n\n接下来，创建并初始化异常类型的实例。所有异常类型都必须初始化一个解释问题原因的消息。某些类型（包括 `ArgumentOutOfRangeException`）还需要指定引起异常的参数名称（在我们的案例中，是\
  \ `voltage`）。利用这些信息，我们可以如下创建一个新异常：\n\n`ArgumentOutOfRangeException voltageException\
  \ = new(nameof(voltage), \"Voltage exceeds safety parameters.\");`\n\n使用 `throw`\
  \ 语句后跟异常对象来抛出异常，如下：\n\n```csharp\nthrow voltageException;\n```\n\n在上面的示例中，我们分两个步骤创建和抛出异常。然而，这个序列通常在单次操作中完成：\n\
  \n```csharp\nthrow new ArgumentOutOfRangeException(nameof(voltage), \"Voltage exceeds\
  \ safety parameters.\");\n```\n\n修改 `VoltageCheck()` 方法以抛出异常，如下：\n\n```csharp\n\
  private static void VoltageCheck(int voltage)\n{\n    if (voltage > 500)\n    {\n\
  \        throw new ArgumentOutOfRangeException(nameof(voltage),\n              \
  \                              \"Voltage exceeds safety parameters.\");\n    }\n\
  \    else\n    {\n        Console.WriteLine(\"Safe Voltage\");\n    }\n}\n```\n\n\
  参考控制台，将出现以下输出：\n\n`Unhandled exception. System.ArgumentOutOfRangeException: Voltage\
  \ exceeds safety parameters. (Parameter 'voltage')`\n`   at ExceptionDemo.Program.VoltageCheck(Int32\
  \ voltage) in Program.cs:line`\n\n## 23.4 处理异常\n\n在 C# 中，异常使用 `try-catch` 语句进行处理。为了防止程序崩溃，我们必须在以下位置添加\
  \ `try`：\n\n```csharp\nstatic void Main(string[] args)\n{\n    try\n    {\n    \
  \    VoltageCheck(501);\n    }\n    catch (ArgumentOutOfRangeException)\n    {\n\
  \        Console.WriteLine(\"Voltage overload\");\n    }\n}\n```\n\n到目前为止，我们已经实现了\
  \ `catch` 块。也可以访问异常对象，例如：\n\n```csharp\ntry\n{\n    VoltageCheck(501);\n}\ncatch\
  \ (Exception ex)\n{\n    Console.WriteLine(ex.Message);\n}\n```\n\n当程序运行时，将出现以下输出：\n\
  \n`Voltage overload.`\n\n接下来的示例代码：\n\n```csharp\ntry\n{\n    VoltageCheck(501);\n\
  }\ncatch (ArgumentOutOfRangeException ex)\n{\n    Console.WriteLine(\"Voltage overload\"\
  );\n}\n```\n\n这对于捕获多种类型非常有用。例如：\n\n```csharp\ntry\n{\n    VoltageCheck(501);\n}\n\
  catch (ArgumentOutOfRangeException)\n{\n    Console.WriteLine(\"Voltage overload\"\
  );\n}\nelse if (NullException)\n{\n    Console.WriteLine(\"Null reference\");\n\
  }\n```\n\n## 23.5 使用 `when` 创建异常过滤器\n\n在上面的示例中，我们使用 `when` 来控制异常。在 catch 块中使用 `when`\
  \ 的语法为：\n\n```csharp\ntry\n{\n}\ncatch (exception) when (boolean)\n{\n}\n```\n\n\
  只有当 `when` 后面的布尔表达式求值为真时，catch 块中的代码才会执行。这对于捕获特定类型特别有用。例如，下面的代码：\n\n```csharp\n\
  catch (Exception ex) when (ex is ArgumentOutOfRangeException || ex is NullException)\n\
  ```\n\n异常过滤器可以包含任何布尔表达式，无论是否带有类型匹配。下面的 catch 块仅在异常类型为 `ArgumentException` 且 `motorTemp`\
  \ 超过 102 时才会执行：\n\n```csharp\ntry\n{\n    VoltageCheck(501);\n}\ncatch (Exception\
  \ ex) when (ex is ArgumentOutOfRangeException && motorTemp > 102)\n```\n\n## 23.6\
  \ 使用 `finally` 块\n\n`finally` 块的目的是在 `try-catch` 语句结束之前指定执行的代码，通常用于执行清理任务，例如：\n\n\
  ```csharp\ntry\n{\n    VoltageCheck(501);\n}\ncatch (Exception ex)\n{\n    Console.WriteLine(ex.Message);\n\
  }\nfinally\n{\n    Console.WriteLine(\"Resetting system.\");\n}\n```\n\n## 23.7\
  \ 使用 `try-finally` 语句\n\n根据之前的经验，我们知道未处理的异常会导致程序崩溃，但尚未解释异常在哪里被捕获。本章涵盖的示例暗示异常必须在发生的地方使用\
  \ `try-catch` 语句进行处理。但在实践中，情况并非如此。在深入探讨此主题之前，将运行程序的执行路径视为方法调用的层次结构，从 `Main()` 方法开始是有帮助的。\n\
  \n考虑这种情况：`Main()` 方法调用 `Method A`，随后它又调用 `Method B` 和 `Method C`。然后 `Method C` 调用\
  \ `Method D`，以此类推。这种方法调用的层次结构被称为调用树或调用层次结构。在图示中，我们的理论调用层次结构可能如图 23-1 所示：\n\n![](img/image-N29EWYM5.png)\n\
  \n图 23-1\n\n假设在 `Method D` 中抛出了异常。该异常将沿着调用层次结构向上传播，直到被处理。如果异常在到达 `Main()` 方法之前未被捕获，则程序将会崩溃。这意味着即使异常是在\
  \ `Method D` 中抛出的，我们也可以在包括 `Main()` 在内的任何直接祖先方法中处理它，以防止程序崩溃。\n\n\n\n\n\n为了亲身体验，请在\
  \ `Main()` 和 `VoltageCheck()` 方法之间添加一个名为 `StartMotor()` 的中间方法，并移除 `try-catch` 语句：\n\
  \n```csharp\nnamespace ExceptionDemo\n{\n    internal class Program\n    {\n   \
  \     static void Main(string[] args)\n        {\n            StartMotor();\n  \
  \      }\n        private static void StartMotor()\n        {\n            VoltageCheck(501);\n\
  \            Console.WriteLine(\"Clean up after check.\");\n        }\n        private\
  \ static void VoltageCheck(int voltage)\n        {\n            if (voltage > 500)\n\
  \            {\n                throw new ArgumentOutOfRangeException(nameof(voltage),\n\
  \                    \"Voltage exceeds safety parameters.\");\n            }\n \
  \           else\n            {\n                Console.WriteLine(\"Safe Voltage\"\
  );\n            }\n        }\n    }\n}\n```\n\n由于异常在三个方法中均未被捕获，应用程序在运行时将会崩溃。然而，我们可以通过在\
  \ `VoltageCheck()`、`StartMotor()` 或 `Main()` 中添加 `try-catch` 语句来捕获错误。在本示例中，请使用 `try-catch`\
  \ 语句在 `Main()` 方法内部调用 `StartMotor()`：\n\n```csharp\nstatic void Main(string[] args)\n\
  {\n    try\n    {\n        StartMotor();\n    }\n    catch (Exception ex) {\n  \
  \      Console.WriteLine(ex.Message);\n    }\n}\n```\n\n重新运行程序，确认异常已向上传播到 `Main()`\
  \ 方法并被捕获处理：\n\n`Voltage exceeds safety parameters. (Parameter 'voltage')`\n\n请注意，上述控制台输出没有执行电压检查后的清理操作。按照目前的实现方式，`StartMotor()`\
  \ 将无法感知 `VoltageCheck()` 抛出了异常，`StartMotor()` 中 `VoltageCheck()` 之后的任何代码都将被跳过，控制权将立即返回到\
  \ `Main()`。但假设 `StartMotor()` 无论是否抛出异常都需要在电压检查后执行清理工作。我们可以使用 `try-finally` 语句来实现这种行为：\n\
  \n```csharp\nprivate static void StartMotor()\n{\n    try\n    {\n        VoltageCheck(501);\n\
  \    }\n    finally\n    {\n        Console.WriteLine(\"Clean up whether or not\
  \ voltage is safe.\");\n    }\n}\n```\n\n再次编译并运行程序，验证即使在抛出异常时也会发生清理工作：\n\n`Clean\
  \ up whether or not voltage is safe.`\n`Voltage exceeds safety parameters. (Parameter\
  \ 'voltage')`\n\n## 23.8 重新抛出异常\n\n有时，异常需要在调用层次结构的多个层级进行捕获。通过在捕获异常后将其重新抛出来实现，使其能够继续在层次结构中向上传递。如下所示，在\
  \ `catch` 体中使用 `throw` 语句重新抛出异常：\n\n```csharp\nstatic void Main(string[] args)\n\
  {\n    try\n    {\n        StartMotor();\n    }\n    catch (Exception ex) {\n  \
  \      Console.WriteLine(\"Caught in Main() \" + ex.Message);\n    }\n}\nprivate\
  \ static void StartMotor()\n{\n    try\n    {\n        VoltageCheck(501);\n    }\n\
  \    catch (Exception ex) {\n        Console.WriteLine(\"Caught in StartMotor \"\
  \ + ex.Message);\n        throw;\n    }\n    finally\n    {\n        Console.WriteLine(\"\
  Clean up or not voltage is safe.\");\n    }\n}\n```\n\n运行程序并检查控制台以验证重新抛出有效，且异常被两个方法都捕获：\n\
  \n`StartMotor(): Voltage exceeds safety parameters. (Parameter 'voltage')`\n`Clean\
  \ up or not voltage is safe.`\n`Main(): Voltage exceeds safety parameters. (Parameter\
  \ 'voltage')`\n\n## 23.9 创建异常类型\n\n到目前为止，本章节一直使用内置异常类型来演示如何在 C# 中抛出和捕获异常。然而，有时创建自定义异常比使用预定义类型更有意义。自定义类型派自\
  \ `Exception` 类，并根据需要应包含构造函数和参数。类型名称也应以“Exception”结尾。以下代码为我们应用程序中的高电压错误声明了一个自定义异常：\n\
  \n```csharp\nclass HighVoltageException : Exception\n{\n    public HighVoltageException()\n\
  \    {\n    }\n    public HighVoltageException(string message)\n        : base(message)\n\
  \    {\n    }\n    public HighVoltageException(string message, Exception inner)\n\
  \        : base(message, inner)\n    {\n    }\n}\n```\n\n一旦声明，可以按如下方式抛出异常：\n\n`throw\
  \ new HighVoltageException(\"Voltage exceeds safety parameters.\");`\n\n`HighVoltageException`\
  \ 类型不包含属性，因此仅可以使用消息字符串创建实例：\n\n`throw new HighVoltageException(\"Voltage exceeds\
  \ safety parameters.\");`\n\n我们还可以扩展类型声明，以包含一个属性，用于记录异常发生时的电压水平：\n\n```csharp\n\
  class HighVoltageException : Exception\n{\n    public int Volts;\n    public HighVoltageException()\n\
  \    {\n    }\n    public HighVoltageException(string message)\n        : base(message)\n\
  \    {\n    }\n    public HighVoltageException(string message, Exception inner)\n\
  \        : base(message, inner)\n    {\n    }\n    public HighVoltageException(string\
  \ message, int Volts)\n        : base(message)\n    {\n        this.Volts = Volts;\n\
  \    }\n}\n```\n\n现在可以使用消息字符串和触发异常的电压值来创建一个 `HighVoltageException` 实例：\n\n```csharp\n\
  private static void VoltageCheck(int voltage)\n{\n    if (voltage > 500)\n    {\n\
  \        throw new HighVoltageException(\"Voltage exceeds safety parameters.\",\
  \ voltage);\n    }\n    else\n    {\n        Console.WriteLine(\"Safe Voltage\"\
  );\n    }\n}\n```\n\n异常属性可以像消息属性一样在 `catch` 块中访问。在下面的示例中，电压属性包含在通知文本中并据此做出决策：\n\n\
  ```csharp\ntry\n{\n    StartMotor();\n}\ncatch (HighVoltageException ex)\n{\n  \
  \  Console.WriteLine(ex.Message);\n    Console.Write(\"Current voltage: {ex.Volts}\"\
  );\n    if (ex.Volts < 510)\n    {\n        // 等待并重试\n    }\n    else\n    {\n \
  \       // 关键。关闭系统\n    }\n}\n```\n\n## 23.10 测试\n\n点击下方链接或扫描二维码以测试你对 C# 异常处理的知识和理解：\n\
  \n[`www.answertopia.com/hy8t`](https://www.answertopia.com/hy8t)\n\n## 23.11 总结\n\
  \n异常处理确保程序能够有效地处理错误，通过捕获、处理和响应问题避免崩溃。当方法无法继续执行时，会“抛出”异常。每个异常都有特定的类型，提供了有关错误的性质的信息。除了预定义的异常类型（如\
  \ `ArgumentOutOfRangeException`），有时也可以创建自定义异常类型。使用 `try-catch` 块处理异常。将可能抛出异常的代码放在\
  \ `try` 块中，而 `catch` 块包含抛出异常时执行的代码。`catch` 块可以访问异常详细信息，在可能发生多种类型异常的情况下，可以分别处理特定的异常类型。`finally`\
  \ 块也可用于执行代码（例如清理资源），无论是否发生异常。\n\n## 24 C# 中的异步编程\n\n异步编程允许软件同时执行多个任务。这意味着下载图像或处理大量数据等任务可以比顺序执行更快完成。多任务处理通过在后台执行耗时操作而不影响应用程序的响应速度，提供了更流畅的用户体验。\n\
  \n\n\n\n\n在本章中，我们将探索 C# 的异步特性，并解释如何使用这些特性将多任务支持整合到你的项目中。\n\n## 24.1 线程概述\n\n线程是现代\
  \ CPU 的基础特性，也是操作系统中多任务处理的关键。虽然 CPU 可以处理许多线程，但在给定时间内能够并行运行的实际线程数限于 CPU 核心数（通常取决于\
  \ CPU 型号在 4 到 16 个核心之间）。当线程数量超过可用的 CPU 核心数时，操作系统将使用线程调度来决定这些线程如何在可用核心之间进行共享。\n\n\
  线程类似于运行在主进程内部的小型进程。它们允许应用程序内部出现并行执行的现象，但直接在代码中管理它们可能是一个复杂且不可预测的过程。然而，C# 异步特性的伟大之处在于，它们在背后使用线程，并为你处理了所有的复杂性。\n\
  \n## 24.2 主线程\n\n当应用首次启动时，运行时系统通常会创建一个单一线程，应用默认在该线程中运行。应用中任何使用主线程执行耗时任务的代码都会导致整个应用程序看起来像锁死了一，直到任务完成。可以通过将要执行的任务启动在单独的线程中来避免这种情况，允许主线程不受干扰地继续执行其他任务。\n\
  \n## 24.3 C# 中的异步编程\n\nC# 的异步支持由任务异步编程模型（TAP）提供，该模型允许以安全、逻辑且易于编写和理解的方式执行执行。换句话说，异步\
  \ C# 代码是从上到下顺序编写的，与同步代码非常相似，使其易于理解逻辑流。\n\n本章介绍 C# 异步编程，深入涵盖用于高效并行执行的关键概念和技术。\n\n\
  ## 24.4 创建 AsyncDemo 项目\n\n启动 VS Code，打开你的“C# Essentials”工作空间文件夹，创建一个名为 `AsyncDemo`\
  \ 的新 .NET 控制台应用项目。\n\n## 24.5 同步代码\n\n在探索异步编程之前，我们先来看同步代码执行的示例。首先打开 `Program.cs`\
  \ 文件并进行如下修改：\n\n```csharp\nnamespace AsyncDemo\n{\n    internal class Program\n\
  \    {\n        static void Main(string[] args)\n        {\n        }\n        private\
  \ static string ProcessFile(string filename)\n        {\n            Console.WriteLine($\"\
  Start {filename} at {DateTime.Now}\");\n            Task.Delay(6000).Wait();\n \
  \           return filename;\n        }\n    }\n}\n```\n\n`ProcessFile()` 方法在调用\
  \ `Task.Delay()` 和 `Wait()` 方法之前输出一个开始时间戳，以模拟一个阻塞当前线程的 6 秒文件处理任务。延迟结束后，方法返回已完成的文件。\n\
  \n接下来，我们想从 `Main()` 方法中多次调用 `ProcessFile()`。在此，我们还将输出开始时间戳并使用 C# 的 `Stopwatch` 诊断类来记录方法调用的总执行时间：\n\
  \n```csharp\nusing System.Diagnostics;\nnamespace AsyncDemo\n{\n    internal class\
  \ Program\n    {\n        static void Main(string[] args)\n        {\n         \
  \   Stopwatch stopwatch = Stopwatch.StartNew();\n            Console.WriteLine(\"\
  \\n=== Before async task calls ===\\n\");\n            string filename1 = ProcessFile(\"\
  file1.txt\");\n            Console.WriteLine($\"End {filename1} at {DateTime.Now}\\\
  n\");\n            string filename2 = ProcessFile(\"file2.txt\");\n            Console.WriteLine($\"\
  End {filename2} at {DateTime.Now}\\n\");\n            string filename3 = ProcessFile(\"\
  file3.txt\");\n            Console.WriteLine($\"End {filename3} at {DateTime.Now}\\\
  n\");\n            Console.WriteLine(\"=== After async task calls ===\");\n    \
  \        stopwatch.Stop();\n            Console.WriteLine($\"Elapsed time: {stopwatch.Elapsed.Seconds}\
  \ seconds\");\n        }\n    }\n}\n```\n\n运行应用并检查输出：\n\n```=== Before async task\
  \ calls ===\n\nStart file1.txt at 10/27/2023 10:00:00 AM\nEnd file1.txt at 10/27/2023\
  \ 10:00:06 AM\n\nStart file2.txt at 10/27/2023 10:00:06 AM\nEnd file2.txt at 10/27/2023\
  \ 10:00:12 AM\n\nStart file3.txt at 10/27/2023 10:00:12 AM\nEnd file3.txt at 10/27/2023\
  \ 10:00:18 AM\n=== After async task calls ===\nElapsed time: 18 seconds\n```\n\n\
  从上面的输出中可以看出，三次 `ProcessFile()` 调用是顺序执行的，导致了 18 秒的结果。将 `ProcessFile()` 转换为异步方法应该将总时间从\
  \ 18 秒减少到 6 秒。\n\n## 24.6 理解 Task 类\n\nC# 中的异步操作由 `Task` 对象表示。正如我们之前看到的，我们可以直接调用\
  \ `Task` 方法，例如 `Delay()`：\n\n```csharp\nTask.Delay(6000);\n```\n\n上述代码将启动一个异步的 6\
  \ 秒延迟。换句话说，虽然延迟会执行，但它将在后台进行。为了让执行阻塞当前线程，我们调用了 `Task` 的 `Wait()` 方法：\n\n```csharp\n\
  Task.Delay(6000).Wait();\n```\n\n## 24.7 异步方法\n\n异步执行可以应用于方法、Lambda 和匿名函数，并通过 `async`\
  \ 关键字和指定 `Task` 返回类型进行声明。C# 命名规范还建议（并非强制）方法名以 `Async` 结尾。根据这些要求，我们可以对 `ProcessFile()`\
  \ 方法进行如下修改：\n\n```csharp\nprivate static async Task<string> ProcessFileAsync(string\
  \ filename)\n{\n    Console.WriteLine($\"Start {filename} at {DateTime.Now}\");\n\
  \    await Task.Delay(6000);\n    return filename;\n}\n```\n\n我们已经声明该方法是异步的，并返回一个包含\
  \ `string` 结果参数的 `Task` 对象。注意，由于我们现在在 `async` 方法中工作，我们已经从调用 `Task` 对象的 `Wait()`\
  \ 方法切换到使用 `await` 运算符。\n\n## 24.8 引入 await 运算符\n\nC# 异步执行的基础是 `Task` 类和 `await`\
  \ 运算符。`await` 运算符告诉系统挂起调用方法的执行，直到相应的异步操作完成并返回。\n\n通过 `AsyncDemo` 示例，我们知道 `Main()`\
  \ 方法连续三次调用文件处理方法，并且每次调用都必须等待上一个调用完成后才能执行。除了这种处理多个文件的方式效率低下外，三次调用之后的任何代码在最后一次完成之前都无法执行，这实际上锁定了应用程序。在所有情况下，在等待从\
  \ `ProcessFileAsync()` 方法调用返回结果时，`Main()` 方法可能还有正在执行的其他任务。\n\n使用 `Task` 对象和 `await`，我们可以并行运行三个文件处理操作，并在等待异步调用结果的同时，允许\
  \ `Main()` 方法中的其他代码运行。\n\n\n\n\n作为第一步，我们将演示为什么异步执行同时需要 `Task` 对象和 `await` 操作符。然而，首先需要注意的一点是，异步方法通常只能在其他异步方法的范围内被调用（尽管正如我们在本章稍后部分将看到的，`Task`\
  \ 对象可以用作提供同步和异步代码之间的桥梁）。基于此，进行以下更改以将 `Main()` 声明为异步方法：\n\n```csharp\nstatic async\
  \ Task Main(string[] args)\n{\n    Stopwatch stopwatch = Stopwatch.StartNew();\n\
  // ...\n```\n\n接下来，修改异步调用以使用 `await` 操作符，如下所示：\n\n```csharp\nstatic async Task Main(string[]\
  \ args)\n{\n    Stopwatch stopwatch = Stopwatch.StartNew();\n    Console.WriteLine(\"\
  \\n=== Before async task calls ===\\n\");\n    string filename1 = await ProcessFileAsync(\"\
  file1.txt\");\n    Console.WriteLine($\"End {filename1} at {DateTime.Now}\\n\");\n\
  \    string filename2 = await ProcessFileAsync(\"file2.txt\");\n    Console.WriteLine($\"\
  End {filename2} at {DateTime.Now}\\n\");\n    string filename3 = await ProcessFileAsync(\"\
  file3.txt\");\n    Console.WriteLine($\"End {filename3} at {DateTime.Now}\");\n\
  \    Console.WriteLine(\"\\n=== After async tasks calls ===\\n\");\n    stopwatch.Stop();\n\
  \    TimeSpan timeSpan = stopwatch.Elapsed;\n    Console.WriteLine($\"Elapsed time:\
  \ {timeSpan.Seconds} seconds\\n\");\n}\n```\n\n一旦完成修改，运行应用程序并检查控制台输出，其结果类似于：：\n\n\
  ```\n=== Before async task calls ===\nStart file1.txt at 9/25/2024 9:53:46 AM\n\
  End file1.txt at 9/25/2024 9:53:52 AM\nStart file2.txt at 9/25/2024 9:53:52 AM\n\
  End file2.txt at 9/25/2024 9:53:58 AM\nStart file3.txt at 9/25/2024 9:53:58 AM\n\
  End file3.txt at 9/25/2024 9:54:04 AM\n=== After async tasks calls ===\nElapsed\
  \ time: 18 seconds\n```\n\n尽管我们已经将文件处理方法变为异步并使用了 `await` 操作符，但控制台输出显示任务仍然是在按顺序执行。通过将\
  \ `await` 操作的结果直接赋值给 `string` 变量，我们实际上是承诺等待直到结果返回，从而强制代码以同步方式执行。\n\n为了解决这个问题，我们需要实现以下执行流：\n\
  \n1. 应用程序启动。\n2. `Main()` 调用异步方法。\n3. 当异步任务在后台运行时，`Main()` 继续执行。\n4. 在完成其他工作后，`Main()`\
  \ 在等待异步任务的结果时挂起。\n5. 异步任务完成并返回结果。\n6. `Main()` 恢复执行。\n\n挑战在于获取异步任务的引用，以便稍后用于等待结果。我们通过存储异步方法返回的\
  \ `Task` 对象，并在代码后部分使用它们来等待结果来实现这一目标。为了看到实际效果，请对 `Main()` 方法进行以下更改：\n\n```csharp\n\
  static async Task Main(string[] args)\n{\n    Stopwatch stopwatch = Stopwatch.StartNew();\n\
  \    Console.WriteLine(\"\\n=== Before async task calls ===\\n\");\n    Task<string>\
  \ task1 = ProcessFileAsync(\"file1.txt\");\n    Task<string> task2 = ProcessFileAsync(\"\
  file2.txt\");\n    Task<string> task3 = ProcessFileAsync(\"file3.txt\");\n    Console.WriteLine(\"\
  === After async tasks calls ===\\n\");\n    string filename1 = await task1;\n  \
  \  Console.WriteLine($\"End {filename1} at {DateTime.Now}\");\n    string filename2\
  \ = await task2;\n    Console.WriteLine($\"End {filename2} at {DateTime.Now}\");\n\
  \    string filename3 = await task3;\n    Console.WriteLine($\"End {filename3} at\
  \ {DateTime.Now}\\n\");\n    stopwatch.Stop();\n    TimeSpan timeSpan = stopwatch.Elapsed;\n\
  \    Console.WriteLine($\"Elapsed time: {timeSpan.Seconds} seconds\");\n}\n```\n\
  \n重新运行应用程序并检查控制台输出：\n\n```\n=== Before async task calls ===\nStart file1.txt at\
  \ 9/25/2024 1:59:16 PM\nStart file2.txt at 9/25/2024 1:59:16 PM\nStart file3.txt\
  \ at 9/25/2024 1:59:16 PM\n=== After tasks calls ===\nEnd file1.txt at 9/25/2024\
  \ 1:59:22 PM\nEnd file2.txt at 9/25/2024 1:59:22 PM\nEnd file3.txt at 9/25/2024\
  \ 1:59:22 PM\nElapsed time: 6 seconds\n```\n\n尽管我们已经将文件处理方法变为异步并使用了 `await` 操作符，但控制台输出显示任务仍然是在按顺序执行。通过将\
  \ `await` 操作的结果直接赋值给 `string` 变量，我们实际上是承诺等待直到结果返回，从而强制代码以同步方式执行。\n\n等待，让我重新检查提供的文本。似乎输入文本包含了一些重复或碎片化的部分。我将在保持请求的核心逻辑和结构的同时对其进行清理。\n\
  \n## 24.9 从同步函数进行异步调用\n\n如之前所述，异步方法预计在异步上下文中被调用。然而，可以通过调用 `Task.Run()` 方法在同步上下文中启动异步任务。假设我们有一个名为\
  \ `SyncMethod()` 的同步方法，我们需要在其中调用一个异步方法，并尝试如下所示操作：\n\n```csharp\nprivate static void\
  \ SyncMethod()\n{\n    await AsyncMethod();\n}\n```\n\n上述代码将在代码编辑器中产生以下错误：`await`\
  \ 操作符只能在异步方法中使用。考虑将此方法标记为 `async` 并将其返回类型更改为 `Task`。\n\n我们仅有的选择是让 `SyncMethod()`\
  \ 成为一个异步方法，或者使用 `Task.Run()` 方法启动任务。假设将 `SyncMethod()` 声明为异步方法不是可行方案，在这种情况下，代码需要更改如下：\n\
  \n```csharp\nprivate static void SyncMethod()\n{\n    Task.Run(async () {\n    \
  \    await AsyncMethod();\n    });\n}\n```\n\n## 24.10 取消异步任务\n\n激活的异步任务可以使用 `CancellationTokenSource`\
  \ 类随时进行取消。`CancellationTokenSource` 实例包含一个唯一的 `CancellationToken` 对象，用于向任务发送取消请求。为了向\
  \ `AsyncDemo` 项目添加取消支持，首先对 `Main()` 方法进行以下更改：\n\n```csharp\nstatic async Task Main(string[]\
  \ args)\n{\n    var tokenSource = new CancellationTokenSource();\n    var cancellationToken\
  \ = tokenSource.Token;\n// ...\n}\n```\n\n现在我们有了取消令牌，需要对 `ProcessFileAsync()` 方法进行更改，以便将其传递给执行\
  \ 6 秒延迟的任务：\n\n```csharp\nprivate static async Task<string> ProcessFileAsync(string\
  \ filename, CancellationToken cancellationToken)\n{\n    Console.WriteLine($\"Start\
  \ {filename} at {DateTime.Now}\");\n    await Task.Delay(6000, cancellationToken);\n\
  \    return filename;\n}\n```\n\n在我们可以添加发送取消请求的代码之前，还需要额外的步骤。按照目前的写法，当任务取消时应用程序将崩溃，控制台输出部分显示：\n\
  \n```\nUnhandled exception. System.AggregateException: One or more errors occurred.\
  \ (A task was canceled.)\n   ---> System.Threading.Tasks.TaskCanceledException:\
  \ A task was canceled.\n   at System.Threading.Tasks.Task.GetExceptions(Boolean\
  \ includeTaskCExceptions)\n```\n\n这里的问题是，当任务取消时，它会触发一个异常，如果应用程序没有正确处理该异常，会导致崩溃。此问题的解决方案是配置令牌在任务取消时抛出\
  \ `OperationCanceledException` 错误，然后使用 `try-catch` 语句优雅地处理该异常。\n\n\n\n\n\n```csharp\n\
  Console.WriteLine($\"Start {filename} at {DateTime.Now}\");\n\ntry\n{\n    cancellationToken.ThrowIfCancellationRequested();\n\
  \    await Task.Delay(6000, cancellationToken);\n}\ncatch (OperationCanceledException)\n\
  {\n    Console.WriteLine($\"{filename} processing cancelled\");\n}\nreturn filename;\n\
  ```\n\n在上面的示例中，我们只是输出了一条消息指示任务已取消的消息，但在实际应用中，这里可以采取步骤进行清理，例如删除临时文件或关闭网络连接。\n\n最后一步是为用户提供取消异步任务的方法。我们通过调用\
  \ `CancellationTokenSource` 对象的 `Cancel()` 方法来实现这一点：\n\n```csharp\ntokenSource.Cancel();\n\
  ```\n\n为了演示取消文件处理任务，我们将在任务启动后添加代码，以便在按下键时取消任务，如下：\n\n```csharp\nstatic async Task\
  \ Main(string[] args)\n{\n    var tokenSource = new CancellationTokenSource();\n\
  \    var cancellationToken = tokenSource.Token;\n\n    // ...\n\n    Console.WriteLine(\"\
  \\n=== After async tasks calls ===\\n\");\n    Console.Write(\"Press any key to\
  \ cancel\");\n    Console.ReadKey();\n    tokenSource.Cancel();\n    Task.WaitAll(task1,\
  \ task2, task3);\n    // ...\n}\n```\n\n重新运行程序，点击控制台窗口，并在 6 秒内按下任意键以取消任务。控制台输出应指示取消异常已被整洁处理，并且任务在完成工作之前已取消：\n\
  \n```text\n=== Before async task calls ===\nStart file1.txt at 9/26/2024 2:15:04\
  \ PM\nStart file2.txt at 9/26/2024 2:15:04 PM\nStart file3.txt at 9/26/2024 2:15:04\
  \ PM\n=== After async tasks calls ===\nPress any key to cancel\nfile3.txt processing\
  \ canceled\nfile2.txt processing canceled\nfile1.txt processing canceled\nEnd file1.txt\
  \ at 9/26/2024 2:15:06 PM\nEnd file2.txt at 9/26/2024 2:15:06 PM\nEnd file3.txt\
  \ at 9/26/2024 2:15:06 PM\nElapsed time: 1 seconds\n```\n\n## 24.11 知识测试\n\n点击下方的链接或扫描二维码来测试你对\
  \ C# 异步编程的知识和理解：\n\n[`www.answertopia.com/akfm`](https://www.answertopia.com/akfm)\n\
  \n![](img/image-KRY5XAC2.jpg)\n\n## 24.12 总结\n\nC# 中的异步编程使用 `Task` 类和 `await` 运算符来并行运行任务，提高性能和响应能力。`await`\
  \ 运算符会挂起执行直到任务完成，允许其他代码并发运行。通过将同步方法转换为异步方法，可以同时执行多个任务，从而缩短整体执行时间。\n\n要实现并发执行，请存储\
  \ `async` 方法返回的 `Task` 对象并在稍后等待其结果。异步任务的取消可以使用 `CancellationTokenSource` 对象的 `Cancel()`\
  \ 方法实现。在取消任务时，应该采取适当的步骤处理异常，以防止程序崩溃。\n\n## 25. 在 C# 中创建二维、三维数组和锯齿数组\n\n数组并不是 C#\
  \ 特有的。事实上，在 C# 引入之前，几乎每一种之前的编程语言和脚本语言都提供了对数组的支持。数组允许存储一组相同类型的值集合，并通过单个变量进行访问。数组变量中的每个项目都通过数组索引来访问。\n\
  \nC# 数组虽然很有用，但存在一些局限性。可能最重要的局限性是，一旦创建了数组，就无法增大或减小以容纳更多或更少的值。更动态灵活的集合存储能力将从“C# List\
  \ 集合”章节开始介绍。\n\n## 25.1 在 C# 中创建数组\n\nC# 数组可以通过几种不同的方式创建。一种方法是声明数组但不使用任何值对其初始化。其语法如下：\n\
  \n```cs\ntype[] arrayname;\n```\n\n在上面的示例中，`type` 代表要存储在数组中的数据类型（例如 `string`、`int`、`decimal`\
  \ 等）。方括号（`[]`）表示这是数组的声明，`arrayname` 是引用该数组的名称。\n\n例如，我们可以如下声明一个名为 `myColors` 的字符串数组：\n\
  \n```cs\nstring[] myColors;\n```\n\n在这个示例中，我们声明了数组但没有给它分配任何值。在声明数组后赋值，请使用以下语法：\n\
  \n```cs\nstring[] myColors;\nmyColors = [\"red\", \"green\", \"yellow\", \"orange\"\
  , \"blue\"];\n```\n\n数组也可以通过简单放置逗号分隔的列表来初始化：\n\n```cs\nstring[] myColors = [\"red\"\
  , \"green\", \"yellow\", \"orange\", \"blue\"];\n```\n\n另一个选项是在创建数组时指定数组的大小：\n\n\
  ```cs\nstring[] myColors = new string[5];\n```\n\n这将为 5 个字符串元素留留空间。\n\n## 25.2 多维数组\n\
  \n多维数组通过在方括号内放置逗号来声明。例如，声明一个二维数组：\n\n```cs\nchar[,] myarray;\n```\n\n上述语法中的逗号（`,`）向\
  \ C# 表示这是一个二维数组。二维数组的初始化如下：\n\n```cs\nchar[,] myarray = {\n    {'a', 'b', 'c'},\n\
  \    {'d', 'e'}\n};\n```\n\n这创建了一个具有行和列的多维数组。也可以在创建数组时指定数组的：\n\n```cs\nchar[,] myarray\
  \ = new char[2, 3];\n```\n\n三维数组通过使用两个逗号来声明：\n\n```cs\nchar[,,] myarray;\n```\n\n\
  以下内容将初始化三维数组：\n\n```cs\nchar[,,] myarray = {\n    {\n        {'a', 'b', 'c'},\n\
  \        {'d', 'e', 'f'}\n    },\n    {\n        {'g', 'h', 'i'},\n        {'j',\
  \ 'k', 'l'}\n    }\n};\n```\n\n三维数组本质上是一个每个元素都是二维数组的数组。在上面的声明中，该数组包含两个数组，每个数组包含三个元素。\n\
  \n也可以在声明数组时指定维度：\n\n```cs\nchar[,,] myarray = new char[2, 2, 3] {\n    {\n     \
  \   {'a', 'b', 'c'},\n        {'d', 'e', 'f'}\n    },\n    {\n        {'g', 'h',\
  \ 'i'},\n        {'j', 'k', 'l'}\n    }\n};\n```\n\n## 25.3 声明锯齿数组\n\n锯齿数组是一种每个元素本身也是数组的数组。在这种语境下使用“锯齿”一词是因为数组元素的长度可以不同。锯齿数组可以被认为是每个元素数量不同的二维数组。\n\
  \n以下是一个用于存储不同大小二维数组的锯齿数组声明示例：\n\n```cs\nchar[][] myJaggedArray;\n```\n\n以下代码声明并初始化相同的锯齿数组：\n\
  \n```cs\nchar[][] myJaggedArray = [\n    ['a', 'b', 'c', 'd', 'e'],\n    ['f', 'g',\
  \ 'h', 'i'],\n    ['j', 'j'],\n    ['k', 'l', 'm', 'n', 'o', 'p', 'q', 'r']\n];\n\
  ```\n\n\n\nC# 数组允许存储相同类型的值集合，并可以通过索引访问每个项。多维数组在方括号内使用逗号声明，而锯齿数组（jagged arrays）是长度不一的数组。\n\
  \n# 26. 访问和排序 C# 数组元素\n\n上一章解释了如何在 C# 中创建 2 维数组、3 维数组和锯齿数组。在本章中，我们将探索如何访问、删除和排序数组的元素。\n\
  \n## 26.1 创建 ArrayDemo 项目\n\n启动 VS Code，打开你的“C# Essentials”工作区文件夹，并创建一个名为 `ArrayDemo`\
  \ 的新 .NET 控制台应用程序项目。\n\n创建项目后，打开 `Program.cs` 文件并使用它尝试本章其余部分的示例。\n\n## 26.2 获取数组的维度数\n\
  \n数组的维度可以通过数组的 `Rank` 属性获取。例如：\n\n```csharp\nchar[,] my2Darray = new char[3,3]\n\
  {\n    {'a', 'b', 'c'},\n    {'c', 'd', 'e'},\n    {'c', 'd', 'e'}\n};\n\nchar[,,]\
  \ my3Darray = new char[2,2,3]\n{\n    {\n        { 'a', 'b', 'c' },\n        { 'c',\
  \ 'd', 'e' }\n    },\n    {\n        { 'f', 'g', 'h' },\n        { 'i', 'j', 'k'\
  \ }\n    }\n};\n\nConsole.WriteLine($\"Dimensions in my2Darray = {my2Darray.Rank}\"\
  );\nConsole.WriteLine($\"Dimensions in my3Darray = {my3Darray.Rank}\");\n```\n\n\
  输出：\n```\nDimensions in my2Darray = 2\nDimensions in my3Darray = 3\n```\n\n## 26.3\
  \ 访问数组元素\n\n一旦值被存储在数组中，很可能在 C# 代码的后续某个需要访问这些值。这通过使用数组访问器符号结合目标值在数组中的索引来实现。数组访问器仅为数组名后跟方括号（`[]`）。方括号内放置一个代表目标值在数组索引的数字（注意\
  \ C# 中的第一个数组元素索引为 0）。例如，要访问 `myColors` 数组的第二个元素，将使用以下符号：\n\n```csharp\nstring[]\
  \ myColors = {\"red\", \"green\", \"yellow\", \"orange\", \"blue\"};\nConsole.WriteLine($\"\
  Element at index 1 = {myColors[1]}\");\n```\n\n执行上述代码时，它将输出单词“green”，因为这是数组中索引位置\
  \ 1 包含的字符串。\n\n同样，可以使用访问器符号结合赋值运算符（`=`）来更改数组中特定索引位置的值。例如，要更改数组中第一个项的值：\n\n```csharp\n\
  string[] myColors = [\"red\", \"green\", \"yellow\", \"orange\", \"blue\"];\nmyColors[0]\
  \ = \"violet\";\nConsole.WriteLine($\"Element at index 0 = {myColors[0]}\");\n```\n\
  \n多维数组中的值可以通过指定用并用逗号分隔的每个维度的索引值来访问。例如，要访问 `my2Darray` 中第一个数组的第一个元素，将使用以下访问器（注意数组从索引位置\
  \ 0 开始）：\n\n```csharp\nchar element = my2Darray[0,0];\n```\n\n以下代码演示了如何访问 2D 数组和\
  \ 3D 数组中的各种元素：\n\n```csharp\nchar[,] my2Darray = new char[3,3]\n{\n    {'a', 'b',\
  \ 'c'},\n    {'d', 'e', 'f'},\n    {'g', 'h', 'i'}\n};\n\nchar[,,] my3Darray =\n\
  {\n    {\n        { 'a', 'b', 'c' },\n        { 'd', 'e', 'f' }\n    },\n    {\n\
  \        { 'g', 'h', 'i' },\n        { 'j', 'k', 'l' }\n    }\n};\n\n// 输出 my2Darray\
  \ 中第一个数组的第一个元素\nConsole.WriteLine($\"{my2Darray[0,0]}\");\n// 输出 my2Darray 中最后一个数组的最后一个元素\n\
  Console.WriteLine($\"{my2Darray[2,2]}\");\n// 输出 my3Darray 中第一个 2D 数组中第二个数组的第二个元素\n\
  Console.WriteLine($\"{my3Darray[0,1,1]}\");\n// 输出 my3Darray 中第二个 2D 数组中第二个数组的第三元素\n\
  Console.WriteLine($\"{my3Darray[1,1,2]}\");\n```\n\n输出：\n```\na\ni\ne\nl\n```\n\n\
  ## 26.4 数组迭代\n\n遍历数组中项的最简单方法是使用 `foreach` 语法。例如，下面的代码遍历了整个数组并将每个项输出到控制台：\n\n```csharp\n\
  string[] myColors = [\"red\", \"green\", \"yellow\", \"orange\", \"blue\"];\nforeach\
  \ (string color in myColors)\n{\n    Console.Write(\"{0} \", color);\n}\n```\n\n\
  输出：\n```\nred green yellow orange blue\n```\n\n你也可以使用 `foreach` 语句来遍历多维数组。在下面的示例中，我们使用\
  \ `foreach` 遍历三维数组：\n\n```csharp\nchar[,,] my3Darray =\n{\n    {\n        { 'a',\
  \ 'b', 'c' },\n        { 'd', 'e', 'f' }\n    },\n    {\n        { 'g', 'h', 'i'\
  \ },\n        { 'j', 'k', 'l' }\n    }\n};\n\nforeach (char[,] array in my3Darray)\n\
  {\n    foreach (char element in array)\n    {\n        Console.Write(\"{0} \", element);\n\
  \    }\n}\n```\n\n输出：\n```\na b c d e f g h i j l\n```\n\n## 26.5 使用范围\n\n范围（Ranges）允许你创建数组的子集。使用\
  \ `..` 运算符可以指定起始索引和结束索引。例如：\n\n```csharp\nstring[] sentence = [\"The\", \"best\"\
  , \"way\", \"to\", \"predict\", \"the\", \"future\", \"is\", \"to\", \"it\"];\n\
  string[] subset = sentence[1..4]; // 包含索引 1, 2, 3 的元素\n```\n\n你也可以省略起始或结束索引来表示从开始或到末尾：\n\
  \n```csharp\nstring[] subset = sentence[..3]; // 从索引 0 到 2\nstring[] subset = sentence[2..];\
  \ // 从索引 2 到最后\nstring[] subset = sentence[1..²]; // 从索引 1 到倒数第 2 个元素\n```\n\n范围运算符可以与\
  \ `^` 运算符结合使用，其中 `^` 表示从末尾开始的索引。例如：\n\n```csharp\nstring[] subset = sentence[³];\
  \ // 倒数第 3 个元素\n```\n\n## 26.6 C# 从索引开始的运算符\n\nC# 从索引开始运算符（`^`）允许你根据数组末尾的位置数来指定范围的边界。例如，`¹`\
  \ 代表数组的最后一个项，`²` 代表倒数第二个项，依此类推。索引 `⁰` 已经设置为数组项的总数：\n\n```csharp\nstring[] myArray\
  \ = {\n    \"item 1\", // <-- ⁷ - 倒数第 7 个\n    \"item 2\", // <-- ⁶\n    \"item\
  \ 3\", // <-- ⁵\n    \"item 4\", // <-- ⁴\n    \"item 5\", // <-- ³\n    \"item\
  \ 6\", // <-- ²\n    \"item 7\" // <-- ¹ - 最后最后一个项\n    // ⁰ = 数组长度\n};\n```\n\n\
  以下代码演示了在处理范围和数组时索引运算符的使用：\n\n\n\n\n\n```cs\nstring[] sentence = {\"The\", \"best\"\
  , \"way\", \"to\", \"predict\", \"the\", \"future\", \"is\", \"to\", \"invent\"\
  , \"it\"};\n\nstring[] subset1 = sentence[⁷..⁴];\n\nstring[] subset2 = sentence[..²];\n\
  \nstring[] subset3 = sentence[3..³];\n\nforeach (string word in subset1)\n{\n  \
  \  Console.Write(\"{0} \", word);\n}\nConsole.WriteLine(\"\\n\");\n\nforeach (string\
  \ word in subset2)\n{\n    Console.Write(\"{0} \", word);\n}\nConsole.WriteLine(\"\
  \\n\");\n\nforeach (string word in subset3)\n{\n    Console.Write(\"{0} \", word);\n\
  }\n```\n\nOutput:\npredict the future\nThe best way to predict the future is to\n\
  to predict the future is\n\n```\n\n## 26.7 排序 C# \n\nC# 数组是 `Array` 程序包的一部分，该包还包含了一些用于排序和重排数组的实用方法。\n\
  \n如果你需要对数组进行排序，可以作为参数传递给 `Array.Sort()` 方法，如下所示：\n\n```cs\nstring[] myColors = [\
  \ \"red\", \"green\", \"yellow\", \"orange\", \"blue\" ];\n\nConsole.WriteLine(\"\
  Before Sort\");\nforeach (string color in myColors)\n{\n    Console.Write(\"{0}\
  \ \", color);\n}\n\nArray.Sort(myColors);\nConsole.WriteLine(\"\\n\\nAfter Sort\"\
  );\nforeach (string color in myColors)\n{\n    Console.Write(\"{0} \", color);\n\
  }\n```\n\nOutput:\nBefore Sort\nred green yellow orange blue\nAfter Sort\nblue green\
  \ orange red yellow\n\n你也可以使用 `Array.Reverse()` 方法反转数组中元素的顺序：\n\n```cs\nstring[]\
  \ myColors = [\"red\", \"green\", \"yellow\", \"orange\", \"blue\"];\nArray.Reverse(myColors);\n\
  foreach (string color in myColors)\n{\n    Console.Write(\"{0} \", color);\n}\n\
  ```\n\nOutput:\nblue orange yellow green red\n\n## 26.8 清空 C# 数组\n\n数组中的值可以使用 `Array.Clear()`\
  \ 方法清空。该方法将数组中的每个项重置为该类型的默认值（布尔值为 false，数值项为 0，字符串为 null）。清空数组元素的语法如下：\n\n`Array.Clear(<array>,\
  \ <start index>, <count>);`\n\n在上述语法中，`<array>` 是要清空的数组，`<start index>` 是从数组中哪个位置开始清空，`<count>`\
  \ 是要清空的元素数量。\n\n以下示例演示了从第 1 项开始清空三个元素：\n\n```cs\nstring[] myColors = [\"red\", \"\
  green\", \"yellow\", \"orange\", \"blue\"];\nArray.Clear(myColors, 1, 3);\nforeach\
  \ (string color in myColors)\n{\n    Console.Write(\"{0} \", color);\n}\n```\n\n\
  当运行上述代码时，数组中将只剩下 `blue` 和 `red` 元素。\n\n## 26.9 知识测试\n\n点击下方的链接或扫描二维码以测试你对 C# 数组管理的知识和理解程度：\n\
  \n[`www.answertopia.com/ty5r`](https://www.answertopia.com/ty5r)\n\n![](img/image-E70B6G8K.jpg)\n\
  \n## 26.10 总结\n\n本章探讨了 C# 数组中元素的访问、删除和排序。它演示了如何使用 `Rank` 属性确定维度，使用数组访问符号访问元素，以及使用\
  \ `foreach` 循环遍历数组。此外，还涵盖了使用范围（ranges）和索引索引运算符（index from end operator）提取元素子集，以及使用\
  \ `Array.Sort()`、`Array.Reverse()` 和 `Array.Clear()` 方法分别对数组进行排序、反转和清空。\n\n## 27.\
  \ C# List 集合\n\n在之前的章节中，我们看了 C# 数组。虽然数组在许多任务中用，但在功能和灵活性方面开始显得过时。C# 集合类提供了更高级的机制来收集对象组。\n\
  \n## 27.1 创建 CollectionDemo 项目\n\n启动 VS Code，打开你的“C# Essentials”工作空间文件夹并创建一个名为 `CollectionDemo`\
  \ 的新 .NET 控制台应用程序。\n\n创建项目后，打开 `Program.cs` 文件并使用它尝试本章后续部分的示例。\n\n## 27.2 介绍 C#\
  \ 集合类\n\nC# 集合类专门设计用于对对象进行分组并执行任务。C# 提供了多种集合类，我们将在接下来的章节中查看一些关键类。\n\n## 27.3 使用\
  \ List 创建 C# 列表集合\n\n`List<t>` 类的属性与 C# 数组非常相似。该类相比数组的一个关键优势是，它可以随着所存储对象数量的变化而动态增长或缩小。\n\
  \n创建 `List<type>` 集合的语法如下，其中 `type` 被替换为存储在列表中的数据类型：\n\n`List<type>name = new List<type>();`\n\
  \n或者，上述语法可以简化为：\n\n`List<type>name = [];`\n\n考虑到上述语法，我们可以使用以下两个语句之一，创建一个名为 `colorList`\
  \ 的空 `List<object>`，并配置为存储字符串值：\n\n`List<string>colorList = new List<string>();`\n\
  `List<string>colorList = [];`\n\n## 27.4 向列表添加项\n\n一旦创建了 `List` 实例，就可以调用若干方法来对列表执行任务。其中一种方法是\
  \ `Add()` 方法，正如其名所示，它用于向列表添加项：\n\n```cs\ncolorList.Add(\"Red\");\ncolorList.Add(\"\
  Green\");\ncolorList.Add(\"Yellow\");\ncolorList.Add(\"Purple\");\ncolorList.Add(\"\
  Orange\");\n```\n\n`Add()` 方法将新项添加到列表末尾。要在特定索引插入新项，你需要使用后文 `Insert()` 方法。\n\n##\
  \ 27.5 使用多个值初始化列表\n\n在上面的示例中，我们使用 `Add()` 方法逐个向空列表添加项。但如果你需要大量值初始化列表，可能会发现集合初始化器更高效，其语法如下：\n\
  \n`List<string>colorList = [\"Red\", \"Green\", \"Yellow\", \"Purple\", \"Orange\"\
  ];`\n\n## 27.6 访问列表项\n\n列表中的单个项可以使用其索引值访问（注意第一个项为 0，第二个为 1，依此类推）。索引值放在列表名称后的方括号中。例如，访问\
  \ `colorList` 对象的第二个项：\n\n```cs\nConsole.WriteLine(colorList[1]);\n```\n\nOutput:\n\
  Green\n\n列表项的值同样可以使用索引结合赋值运算符（=）进行更改。例如，将 `Yellow` 颜色更改为 `Indigo`，代码如下：\n\n```cs\n\
  Console.WriteLine($\"Color before = {colorList[2]}\");\ncolorList[2] = \"Indigo\"\
  ;\nConsole.WriteLine($\"Color after = {colorList[2]}\");\n```\n\nOutput:\nColor\
  \ before = Yellow\nColor after = Indigo\n\n与数组一样，你还可以构造 `foreach` 循环列出列表中的所有项。例如：\n\
  \n```cs\nforeach (string color in colorList)\n{\n    Console.Write($\"{color} \"\
  );\n}\n```\n\nOutput:\nRed Green Indigo Purple Orange\n\n## 27.7 从列表中删除项\n\n可以使用\
  \ `Remove()` 方法从列表中删除项。该方法接受要删除的值作为参数。例如，要从 `colorList` 对象中删除 `Orange` 字符串，我们可以编写以下代码：\n\
  \n```cs\ncolorList.Remove(\"Orange\");\nforeach (string color in colorList)\n{\n\
  \    Console.Write($\"{color} \");\n}\n```\n\nOutput:\nRed Green Indigo Purple\n\
  \n注意 C# 列表可以存储重复项。在存在重复项的情况下，`Remove()` 方法只会删除第一个匹配实例。\n\n## 27.8 向列表中插入项\n\n\n\n\
  \n此前，我们使用 `Add()` 方法向列表添加项。然而，`Add()` 方法仅将项添加到列表的末尾。有时，有必要在列表的特定位置插入新项。`Insert()`\
  \ 方法正是为此特定目的而提供的。\n\n`Insert()` 接收两个参数：一个表示插入位置索引的整数，以及要在该位置插入的项。例如，要在示例列表的位置 2\
  \ 处插入一个项：\n\n```csharp\nList<string>colorList = [\"Red\", \"Green\", \"Yellow\"\
  , \"Purple\", \"Orange\"];\ncolorList.Insert(2, \"White\");\n\nforeach (string color\
  \ in colorList)\n{\n    Console.Write($\"{color} \");\n}\n```\n\n输出:\nRed Green\
  \ White Yellow Purple Orange\n\n## 27.9 在 C# 中排序列表\n\n目前无法让 C# 在添加项时自动对列表进行排序。可以通过调用\
  \ `Sort()` 方法对列表中的项进行排序：\n\n```csharp\nList<string>colorList = [\"Red\", \"Green\"\
  , \"Yellow\", \"Purple\", \"Orange\"];\ncolorList.Sort();\n\nforeach (string color\
  \ in colorList)\n{\n    Console.Write($\"{color} \");\n}\n```\n\n输出:\nGreen Orange\
  \ Purple Red Yellow\n\n上面的示例使用 C# 默认比较委托来组织新的列表顺序。虽然这超出了本书的范围，但值得知道的是，对于更高级的需求，你可以创建你自己的比较委托。\n\
  \n## 27.10 在 C# 列表中查找项\n\n`List` 类提供了几种方法来查找项。最基础的方法是 `Contains()` 方法，当在列表对象上调用由于该方法时，如果指定的项位于列表中，则返回\
  \ `true`，否则返回 `false`。\n\n`IndexOf()` 方法返回列表中匹配项的索引值。例如，以下代码示例将输出一个 `true` 结果（表示存在“Red”）以及索引值\
  \ `2`（这是字符串“Yellow”的索引位置）：\n\n```csharp\nList<string>colorList = [\"Red\", \"Green\"\
  , \"Yellow\", \"Purple\", \"Orange\"];\nConsole.WriteLine(colorList.Contains(\"\
  Red\"));\nConsole.WriteLine(colorList.IndexOf(\"Yellow\"));\n```\n\n输出:\nTrue\n\
  2\n\n如果在列表中未找到该项，`IndexOf()` 方法将返回值 `-1`。\n\n`LastIndexOf()` 方法返回列表中与指定项匹配的最后一个项的索引值。这对于列表包含重复项特别有用：\n\
  \n```csharp\nList<string>colorList = [\"Red\", \"Green\", \"Yellow\", \"Purple\"\
  , \"Red\"];\nConsole.WriteLine(colorList.LastIndexOf(\"Red\"));\n```\n\n输出:\n4\n\
  \n## 27.11 获取有关列表的信息\n\n`List<t>` 类的两个属性对于获取列表对象的信息很有帮助。例如，`Capacity` 属性可以识别集合在不调整大小的情况下可以存储多少项。\n\
  \n然而，`Count` 属性标识当前列表中存储了多少项。通常情况下，`Capacity` 的值将匹配或超过当前的 `Count`：\n\n```csharp\n\
  List<string>colorList = [\"Red\", \"Green\", \"Yellow\", \"Purple\", \"Orange\"\
  ];\nConsole.WriteLine($\"Count = {colorList.Count}\");\nConsole.WriteLine($\"Capacity\
  \ = {colorList.Capacity}\");\n```\n\n输出:\nCount = 5\nCapacity = 5\n\n在 `Count` 和\
  \ `Capacity` 之间存在差距的情况下，你可以调用 `TrimExcess()` 方法来移除多余容量：\n\n```csharp\ncolorList.TrimExcess();\n\
  ```\n\n## 27.12 清除 C# 列表\n\n你可以通过调用 `Clear()` 方法移除列表中的所有项。\n\n`Clear()` 方法会从列表中移除项，并将\
  \ `Count` 属性设置为零。然而，在列表清除后，`Capacity` 属性保持不变。要移除列表的容量，请在调用 `Clear()` 方法后紧调用 `TrimExcess()`：\n\
  \n```csharp\nList<string>colorList = [\"Red\", \"Green\", \"Yellow\", \"Purple\"\
  , \"Orange\"];\nConsole.WriteLine($\"Count = {colorList.Count}\");\nConsole.WriteLine($\"\
  Capacity = {colorList.Capacity}\");\ncolorList.Clear();\nConsole.WriteLine($\"Count\
  \ = {colorList.Count}\");\nConsole.WriteLine($\"Capacity = {colorList.Capacity}\"\
  );\ncolorList.TrimExcess();\nConsole.WriteLine($\"Count = {colorList.Count}\");\n\
  Console.WriteLine($\"Capacity = {colorList.Capacity}\");\n```\n\n输出:\nCount = 5\n\
  Capacity = 5\nCount = 0\nCapacity = 5\nCount = 0\nCapacity = 0\n\n## 27.13 知识测试\n\
  \n点击下方链接或扫描二维码以测试你对 C# List 集合的知识和理解：\n\n[`www.answertopia.com/tccy`](https://www.answertopia.com/tccy)\n\
  \n![](img/image-F8OS1N2G.jpg)\n\n## 27.14 总结\n\nC# 集合类提供了分组对象的高级机制，其中 `List` 是允许动态调整大小的关键类。可以使用\
  \ `Add()`、`Remove()`、`Contains()` 和 `IndexOf()` 等方法创建、修改和查询列表。此外，还可以对列表进行排序、清除，并访问其\
  \ `Count` 和 `Capacity` 等属性以获取列表内容的信息。\n\n## 28. C# Dictionary 集合\n\nC# 字典允许以键值对的形式存储和管理数据。字典的作用与数组和列表类似，但字典中的每个项都关联有一个键。\n\
  \n## 28.1 创建 DictionaryDemo\n\n启动 VS，打开“C#”文件夹并创建一个名为 DictionaryDemo 的 .NET 项目。\n\
  \n## 28.2 字典初始化\n\n字典是一种用于存储多个值的数据类型。字典中的每个项由一个键和一个关联的值组成。\n\n可以使用以下语法创建一个空字典：\n\
  \n```csharp\nDictionary<int, string> name = new Dictionary<int, string>();\n```\n\
  \n或者，你可以使用 `var` 关键字：\n\n```csharp\nvar movies = new Dictionary<int, string>();\n\
  ```\n\n可以使用以下语法使用集合初始化器初始化新字典（注意我们再次使用了隐式类型）：\n\n```csharp\nvar movies = new Dictionary<int,\
  \ string>()\n{\n    { 1212, \"The Godfather\" },\n    { 4433, \"Apocalypse Now\"\
  \ },\n    { 5465, \"The Terminal\" },\n    { 1659, \"Casablanca\" }\n};\n```\n\n\
  在上述实例中，C# 编译器将使用隐式类型判断字典的键和值元素都是字符串，并防止插入其他类型的值或键。\n\n## 28.3 字典计数\n\n可以通过访问字典的\
  \ `Count` 属性获取字典中项的计数：\n\n```csharp\nvar movies = new Dictionary<int, string>()\n\
  {\n    { 1212, \"The Godfather\" },\n    { 4433, \"Apocalypse Now\" },\n    { 5465,\
  \ \"The Terminal\" },\n    { 1659, \"Casablanca\" }\n};\nConsole.WriteLine($\"Count\
  \ = {movies.Count}\");\n```\n\n输出:\nCount = 4\n\n## 28.4 字典迭代\n\n与数组和列表一样，你可以使用\
  \ `foreach` 循环语法遍历字典中的所有项。例如，以下代码遍历 movies 字典中的所有项，输出每个项的键和值：\n\n```csharp\nforeach\
  \ (var movie in movies)\n{\n    Console.WriteLine($\"{movie.Key}: {movie.Value}\"\
  );\n}\n```\n\n\n\n\n```csharp\n{ \"CLA-1659\", \"Casablanca\" }\n};\n\nforeach (var\
  \ movie in movies) {\n    var key = movie.Key;\n    var value = movie.Value;\n \
  \   Console.WriteLine($\"{key} - {value}\");\n}\n```\n\n**输出:**\n```\nDRA-1212 -\
  \ The Godfather\nWAR-4433 - Apocalypse Now\nCOM-5465 - The Terminal\nCLA-1659 -\
  \ Casablanca\n```\n\n如我们在上面的代码所示，字典中的每个条目都具有 `Key` 和 `Value` 属性。在这种情况下，我们使用这些属性来提取每个字典条目的键名和电影标题。\n\
  \n## 28.5 添加和删除字典条目\n\n可以通过调用实例的 `Add()` 方法并传递键/值对，向现有字典中添加新条目：\n\n```csharp\nvar\
  \ movies = new Dictionary<string, string>()()\n{\n    { \"DRA-1212\", \"The Godfather\"\
  \ },\n    { \"WAR-4433\", \"Apocalypse Now\" },\n    { \"COM-5465\", \"The Terminal\"\
  \ },\n    { \"CLA-1659\", \"Casablanca\" }\n};\n\nmovies.Add(\"SCI-2323\", \"Prometheus\"\
  );\nConsole.WriteLine(movies[\"SCI-2323\"]);\n```\n\n**输出:**\n```\nPrometheus\n\
  ```\n\n您可以通过调用 `Remove()` 方法并引用与要删除条目匹配的键，从字典中删除条目：\n\n```csharp\nvar movies = new\
  \ Dictionary<string, string>()()\n{\n    { \"DRA-1212\", \"The Godfather\" },\n\
  \    { \"WAR-4433\", \"Apocalypse Now\" },\n    { \"COM-5465\", \"The Terminal\"\
  \ },\n    { \"CLA-1659\", \"Casablanca\" }\n};\n\nmovies.Remove(\"WAR-4433\");\n\
  \nforeach (var movie in movies) {\n    var key = movie.Key;\n    var value = movie.Value;\n\
  \    Console.WriteLine($\"{key} - {value}\");\n}\n```\n\n**输出:**\n```\nDRA-1212\
  \ - The Godfather\nCOM-5465 - The Terminal\nCLA-1659 - Casablanca\n```\n\n## 28.6\
  \ 访问和更新字典项\n\n可以使用键下标语法引用对应的值，来访问或修改特定的值。以下代码引用了一个已知于 `movies` 字典中的键，并输出了关联的值（在本例中为名为“The\
  \ Terminal”的电影）：\n\n```csharp\nvar movies = new Dictionary<string, string>()()\n\
  {\n    { \"DRA-1212\", \"The Godfather\" },\n    { \"WAR-4433\", \"Apocalypse Now\"\
  \ },\n    { \"COM-5465\", \"The Terminal\" },\n    { \"CLA-1659\", \"Casablanca\"\
  \ }\n};\n\nConsole.WriteLine(movies[\"COM-5465\"]);\n```\n\n**输出:**\n```\nThe Terminal\n\
  ```\n\n在更新与指定键关联的值时，也可以使用键进行索引（例如，将同一部电影的标题从“The Terminal”更改为“Caddyshack”）：\n\n\
  ```csharp\nvar movies = new Dictionary<string, string>()()\n{\n    { \"DRA-1212\"\
  , \"The Godfather\" },\n    { \"WAR-4433\", \"Apocalypse Now\" },\n    { \"COM-5465\"\
  , \"The Terminal\" },\n    { \"CLA-1659\", \"Casablanca\" }\n};\n\nmovies[\"COM-5465\"\
  ] = \"Caddyshack\";\nConsole.WriteLine(movies[\"COM-5465\"]);\n```\n\n**输出:**\n\
  ```\nCaddyshack\n```\n\n## 28.7 检查键或值是否存在\n\n可以通过调用 `ContainsKey()` 方法搜索字典，以查找其是否包含特定键。在向字典中添加新条目之前，您可能希望调用此方法以确保键尚未被使用，以避免运行时异常错误。\n\
  \n您还可以通过调用 `ContainsValue()` 方法检查特定值是否存在于字典。以下示例演示了这两种方法的用法：\n\n```csharp\nvar movies\
  \ = new Dictionary<string, string>()()\n{\n    { \"DRA-1212\", \"The Godfather\"\
  \ },\n    { \"WAR-4433\", \"Apocalypse Now\" },\n    { \"COM-5465\", \"The Terminal\"\
  \ },\n    { \"CLA-1659\", \"Casablanca\" }\n};\n\nif (movies.ContainsKey(\"CLA-1659\"\
  )) {\n    Console.WriteLine(\"Key exists in dictionary\");\n}\n\nif (movies.ContainsValue(\"\
  The Godfather\")) {\n    Console.WriteLine(\"Key exists in dictionary\");\n}\n```\n\
  \n**输出:**\n```\nKey exists in dictionary\n```\n\n## 28.8 总结\n\n字典存储键/值对。它可以用于添加、删除和更新条目。\n\
  \n## 29 文件和目录处理\n\n### 29.1 介绍 System.IO\n\n当我们在 `System.IO` 命名空间下处理文件和目录时，特别是我们将使用以下类：\n\
  \n- `Path`: 提供了一组用于管理路径字符串、构建新路径的方法。\n- `Directory`: 提供了一组用于导航目录结构的方法。\n- `DirectoryInfo`:\
  \ 提供了与 `Directory` 类类似的功能。\n- `File`: 提供了一组用于创建、删除和打开文件的静态方法。\n- `FileInfo`: 提供了与\
  \ `File` 类类似的功能，但是非静态方法。\n- `StreamReader` / `StreamWriter`: 提供了比 `File` 和 `FileInfo`\
  \ 更灵活的方案，用于读取和写入文本文件。\n- `BinaryReader` / `BinaryWriter`: 功能与 `StreamReader` 和 `StreamWriter`\
  \ 相同，但用于处理二进制数据。\n\n### 29.2 理解 C# 中的路径\n\n路径由字符串值表示，并根据操作系统类型格式不同。在 Windows 系统上，每个路径组件由反斜杠\
  \ (\\) 分隔，通常以驱动器号开头。\n\n当程序启动时，工作目录是启动应用程序的目录。可以使用方法更改应用程序的工作目录。标准 UNIX 系统（macOS、Linux\
  \ 等）使用正斜杠 (/) 来分隔路径组件。\n\n文件系统的顶层目录被称为根目录，由 `/` 或 `\\` 分隔符表示。以 `/` 或 `\\` 开头的路径被称为绝对路径，因为它们指定了相对于根目录的文件位置。例如，`/home/demo`\
  \ 和 `C:\\Temp\\Files` 是绝对路径。\n\n不以斜开头的路径被解释为相对于当前工作目录。例如，如果当前工作目录是 `C:\\Users\\\
  Demo` 且路径为 `Documents\\Letters`，则该路径被具有等效的完整绝对路径 `C:\\Users\\Demo\\Documents\\Letters`。\n\
  \nWindows 路径出现了一个问题，因为反斜杠字符在 C# 字符串中表示转义序列。因此，以下路径会导致语法错误：\n\n```csharp\n\"C:\\\
  Users\\Demo\\Desktop\\Profile.txt\"\n```\n\n一种方案是“转义”反斜杠：\n\n```csharp\n\"C:\\\\\
  Users\\\\Demo\\\\Desktop\\\\Profile.txt\"\n```\n\n或者，Windows 路径也可以用字符串字面量来表示。\n\n\
  \n\n\n\n`@\"C:\\Users\\Demo\\Desktop\\Profile.txt\"`.\n\n## 29.3 创建 FileDemo 项目\n\
  \n启动 VS Code，打开你的“C# Essentials”工作区文件夹，并创建一个名为 `FileDemo` 的新 .NET 控制台应用程序。项目准备好后，打开\
  \ `Program.cs` 文件并使用它来尝试本章其余的代码示例。\n\n## 29.4 当前工作目录\n\n应用程序的初始当前工作目录是启动它时的目录，可以使用\
  \ `Directory` 类进行识别。编辑 `Program.cs` 文件并如下所示使用静态方法 `Directory.GetCurrentDirectory()`：\n\
  \n```csharp\nstring currentDirectory = Directory.GetCurrentDirectory();\nConsole.WriteLine(currentDirectory);\n\
  ```\n\n点击运行按钮并检查终端输出，当前目录将在此显示。例如：\n\n`/Users/neilsmyth/Documents/Books/C#_13/C#\
  \ Essentials/FileDemo`\n\n## 29.5 检查目录是否存在\n\n`Directory` 和 `DirectoryInfo` 类都提供了一种识别指定路径是否存在目录的方法。以下代码检查名为\
  \ `MyFiles` 的目录是否存在。请注意，由于我们没有在路径前加上 `/` 或 `\\`，该目录名是相对于当前工作目录的：\n\n```csharp\n\
  if (Directory.Exists(\"MyFiles\"))\n{\n    Console.WriteLine(\"Directory Exists.\"\
  );\n}\nelse\n{\n    Console.WriteLine(\"Directory does not exist.\");\n}\n```\n\n\
  通过创建一个用目录路径的 `DirectoryInfo` 实例并访问 `Exists` 属性也可以实现相同的结果：\n\n```csharp\nDirectoryInfo\
  \ dirInfo = new(\"MyFiles\");\nif (dirInfo.Exists)\n{\n    Console.WriteLine(\"\
  Directory Exists.\");\n}\nelse\n{\n    Console.WriteLine(\"Directory does not exist.\"\
  );\n}\n```\n\n## 29.6 创建目录\n\n识别出目录不存在后的下一步是创建它。在 C# 中使用 `Directory.CreateDirectory()`\
  \ 静态方法或 `DirectoryInfo` 对象的 `Create()` 方法创建目录，例如：\n\n```csharp\nif (Directory.Exists(\"\
  MyFiles\"))\n{\n    Console.WriteLine(\"Directory Exists.\");\n}\nelse\n{\n    Console.WriteLine(\"\
  Directory does not exist - creating...\");\n    Directory.CreateDirectory(\"MyFiles\"\
  );\n}\n\nDirectoryInfo dirInfo = new(\"MyFiles\");\nif (dirInfo.Exists)\n{\n   \
  \ Console.WriteLine(\"Directory Exists.\");\n}\nelse\n{\n    Console.WriteLine(\"\
  Directory does not exist - creating...\");\n    dirInfo.Create();\n}\n```\n\n当代码运行时，第一个语句将检测到目录不存在并创建它，第二个语句将报告该目录现在已存在：\n\
  \nDirectory does not exist - creating...\n\nDirectory Exists.\n\n\n\n## 29.7 删除目录\n\
  \n现有目录使用 `Directory` 类的 `Delete()` 方法删除，并将要删除的目录路径作为参数传递，例如：\n\n```csharp\nDirectory.Delete(\"\
  /Temp/Images\");\n```\n\n如果目录包含文件或其他子目录，上述方法调用将触发 I/O 异常，指示目录为空。要覆盖此异常并删除目录及其所有文件和子目录，请如下所示传递布尔值\
  \ true：\n\n```csharp\nDirectory.Delete(\"/Temp/Images\", true);\n```\n\n## 29.8\
  \ 更改当前工作目录\n\n可以通过调用 `Directory.SetCurrentDirectory()` 方法并将目标目录作为参数传递来更改当前工作目录。与所有目录相关操作一样，提供的路径可以是绝对路径或相对路径。向\
  \ `Program.cs` 文件添加以下行将目录更改到 `MyFiles` 文件夹：\n\n```csharp\nDirectory.SetCurrentDirectory(\"\
  MyFiles\");\nConsole.WriteLine(Directory.GetCurrentDirectory());\n```\n\n运行代码并确认当前目录已更改为\
  \ `MyFiles` 子目录，例如：\n\n`/Users/neilsmyth/Dropbox/Documents/Books/C#_13/C# Essentials/FileDemo/MyFiles`\n\
  \n## 29.9 处理文件和目录异常\n\n在 C# 中处理文件和目录时，重要的是许多许多操作都有抛出异常的可能。例如，考虑上述更改当前工作目录的代码。该示例之所以有效，是因为我们检查了\
  \ `MyFiles` 目录的存在性，并在必要时创建了它。然而，如果目录不存在，结果将不同。要看到这一效果，请向项目添加以下代码：\n\n```csharp\n\
  Directory.SetCurrentDirectory(\"MyFiles1\");\n```\n\n点击运行按钮，此时程序将带有以下未处理的 `DirectoryNotFoundException`\
  \ 错误终止：\n\n```\nUnhandled exception. System.IO.DirectoryNotFoundException: Could\
  \ not find a part of the path '/temp/MyFiles1'.\n    at Interop.ThrowExceptionForIoErrno(ErrorInfo\
  \ errorInfo, String path, Boolean isDirError)\n```\n\n为了避免未处理的异常，对文件和目录的处理必须进行防御性编码（例如在引用之前检查目录或文件是否存在），或者在类似下面的\
  \ try-catch 语句中执行：\n\n```csharp\ntry\n{\n    Directory.SetCurrentDirectory(\"MyFiles1\"\
  );\n}\ncatch (Exception ex)\n{\n    Console.WriteLine($\"{ex.Message}\");\n}\n```\n\
  \n## 29.10 使用 File 类处理文件\n\n在涵盖了 C# 目录处理的基础知识后，是时候查看文件了。`System.IO.File` 类提供了用于文件的创建、删除、复制和写入等方法。`FileInfo`\
  \ 类提供了等效的方法。`File` 类提供了一系列用于处理文件的静态方法。\n\n### 29.10.1 检查文件是否存在\n\n与目录一样，我们可以通过调用\
  \ `File.Exists()` 方法检查路径的文件是否存在：\n\n```csharp\nif (File.Exists(\"MyFile.txt\"))\n\
  ```\n\n### 29.10.2 创建并打开文件\n\n我们还可以结合 `FileMode` 值使用 `File.Open()` 方法创建并打开文件：\n\n\
  ```csharp\nvar myFile = File.Open(<path>, <mode>);\n```\n\n打开文件时可以使用以下模式：\n- `Append`:\
  \ 如果文件存在则打开它，否则创建一个新的。后续的写入操作将追加到现有文件中。\n- `Create`: 创建新文件，如果已存在则覆盖它。\n- `CreateNew`:\
  \ 尝试创建一个新文件，如果文件已存在则抛出异常。\n- `Open`: 打开现有文件，如果不存在则抛出异常。\n- `OpenOrCreate`: 如果文件存在则打开，否则创建一个新的。\n\
  - `Truncate`: 打开现有文件并将其截零为零。\n\n要创建一个新文件并覆盖现有文件可以使用以下代码：\n\n```csharp\nFile.Open(\"\
  MyFile.txt\", FileMode.Create);\n```\n\n### 29.10.3 使用 File 类读取和写入\n\n`WriteAllText()`\
  \ 方法将字符串写入指定的文件。如果文件已存在，它将被覆盖，否则将创建一个新文件。相反，`ReadAllText()` 方法将读取文件的内容并将其作为字符串返回。以下代码在读取之前向名为\
  \ `MyFile.txt` 的文件写入字符串：\n\n```csharp\nFile.WriteAllText(\"MyFile.txt\", \"Hello,\
  \ this is some text.\");\nstring content = File.ReadAllText(\"MyFile.txt\");\nConsole.WriteLine($\"\
  content = {content}\");\n```\n\n当代码执行时，终端将显示：\n\n`content = Hello, this is some\
  \ text.`\n\n要向现有文件追加文本，我们调用 `AppendAllText()` 方法：\n\n```csharp\nFile.WriteAllText(\"\
  MyFile.txt\", \"Hello, this is some text.\");\nFile.AppendAllText(\"MyFile.txt\"\
  , \" This is more text.\");\nstring content = File.ReadAllText(\"MyFile.txt\");\n\
  Console.WriteLine($\"content = {content}\");\n```\n\n生成的终端输出将如下：\n\n`Hello, this\
  \ is some text. This is more text.`\n\n要一次性向文件写入多行文本，将行放在列表集合中并传递给 `WriteAllLines()`\
  \ 方法：\n\n```csharp\nList<string> textList = [\"Kia Sorento\", \"Alfa Romeo GTV6\"\
  , \"Chevy Spark\", \"Ford Explorer\", \"Toyota Celica\"];\nFile.WriteAllLines(\"\
  MyFile.txt\", textList);\n```\n\n\n\n\n`ReadAllLines()` 方法读取文件的全部内容，并将文本行作为字符串数组返回：\n\
  \n```csharp\nstring[] readList = File.ReadAllLines(\"MyFile.txt\");\n\nforeach (string\
  \ line in readList) {\n    Console.WriteLine(line);\n}\n```\n\n运行项目并在终端中检查是否有以下输出：\n\
  \n```\nKia Sorento\nAlfa Romeo GTV6\nChevy Spark\nFord Explorer\nToyota Celica\n\
  ```\n\n## 29.11 删除、复制和移动文件\n\n使用 `File` 类的 `Delete()` 方法删除现有文件（`FileInfo` 类中也提供了类似的选项），调用时传入要删除的文件路径，例如：\n\
  \n```csharp\nFile.Delete(\"/Temp/SomeFile.txt\");\n```\n\n要将现有文件复制到新文件，请按如下方式使用\
  \ `File.Copy()` 方法：\n\n```csharp\nFile.Copy(\"File1.txt\", \"/Temp/File2.txt\");\n\
  ```\n\n`File.Move()` 方法将文件从一个位置移动到另一个位置，并包括重命名文件的选项。以下代码在目录之间移动文件：\n\n```csharp\n\
  File.Move(\"MyFile.txt\", \"/Documents/MyFile.txt\");\n```\n\n在以下示例中，使用 `Move()`\
  \ 重命名当前工作目录下的文件：\n\n```csharp\nFile.Move(\"oldfilename.txt\", \"newfilename.txt\"\
  );\n```\n\n## 29.12 使用流进行文件 I/O\n\n`File` 类提供了一种简单的方法将内容作为块或行写入文件。然而，对于更复杂的需求，我们需要使用流（streams）。\n\
  \n`StreamReader` 和 `StreamWriter` 类与 `File` 类相比，在读取文件和写入文件时具有更大的灵活性和控制力，并且更适合处理大文件。\n\
  \n`Stream` 类允许我们按行或按字符读取和写入文本。例如，以下代码使用 `StreamWriter` 的 `Write()` 和 `WriteLine()`\
  \ 方法分别将单个字符和行写入流中：\n\n```csharp\nusing (StreamWriter writer = new(\"MyFile.txt\"\
  ))\n{\n    writer.Write('A');\n    writer.Write('B');\n    writer.Write('C');\n\
  \    writer.WriteLine(\"DEFGHIJKLMNOP\");\n    writer.WriteLine(\"QRSTUVWXYZ\");\n\
  }\n```\n\n注意上述代码中 `using` 语句的使用。`StreamReader` 和 `StreamWriter` 在创建时会分配资源，工作完成后需要释放这些资源。`using`\
  \ 语句确保在完成工作后调用对应对象的 `Dispose()` 方法以释放分配的资源。或者，必须在流实例上调用 `Dispose()`：\n\n```csharp\n\
  writer.Dispose();\n```\n\n以下代码使用 `StreamReader` 的 `ReadLine()` 方法逐行读取 `MyFile.txt`\
  \ 文件的内容：\n\n```csharp\nusing (StreamReader reader = new(\"MyFile.txt\"))\n{\n  \
  \  string line;\n    while ((line = reader.ReadLine()) != null)\n    {\n       \
  \ Console.WriteLine(line);\n    }\n}\n```\n\n我们可以使用 `StreamReader` 的 `Read()` 方法从文件中读取范围内的字符。`Read()`\
  \ 方法有多个重载方法，允许以不同的方式调用它。例如，以下代码读取并显示了我们 `MyFile.txt` 文件中的第一个字符：\n\n```csharp\nConsole.WriteLine($\"\
  Char = {(char)reader.Read()}\");\n```\n\n输出：\n```\nChar = A\n```\n\n`StreamReader`\
  \ 实例保留一个指向文件中当前位置的指针。上面的代码不仅读取了文件的第一个字符，还更新了指针以引用下一个位置。因此，第二次读取操作将返回字符 ‘B’。\n\n\
  为了避免读取到文件末尾之外的风险，我们可以使用 `StreamReader` 的 `Peek()` 方法查看下一个字符而不读取它。当 `Peek()` 返回 -1\
  \ 时，我们知道当前字符是最后一个：\n\n```csharp\nwhile (reader.Peek() >= 0) {\n    Console.WriteLine($\"\
  Char = {(char)reader.Read()}\");\n}\n```\n\n`Read()` 方法还可以使用以下语法从指定的索引位置读取指定数量的字符：\n\
  \n`Read(<char array>, <index>, <count>)`\n\n在上述语法中，`<index>` 参数是相对于当前流位置的偏移量，而不是从流的开始。例如，如果流指针当前为\
  \ 2，且给 `Read()` 传递的索引值为 3，则字符将从位置 5 开始读取。\n\n以下代码示例从当前位置开始，每三个字符一个块从文件中读取：\n\n```csharp\n\
  using (StreamReader reader = new(\"MyFile.txt\"))\n{\n    char[] charBuffer;\n \
  \   while (reader.Peek() >= 0)\n    {\n        charBuffer = new char[3];\n     \
  \   reader.Read(charBuffer, 0, 3);\n        Console.WriteLine(charBuffer);\n   \
  \ }\n}\n```\n\n执行时，上述代码将生成以下输出：\n\n```\nABC\nDEF\nGHI\nJKL\nMNO\nP\nQ\nRST\nUVW\n\
  XYZ\n```\n\n模式在字母 ‘O’ 之后被中断，但请记住这是缓冲区逻辑结束的地方。模式在字母 ‘O’ 之后被中断，但请记住这是缓冲区逻辑结束的地方。（等等，原文此处有重复的句子，我将保持核心逻辑）。\n\
  \n\n\n本章探索了使用 `System.IO` 命名空间中的类在 C# 中进行文件和目录处理。我们涵盖了创建、删除、导航以及处理文件和目录的操作，包括检查存在性、更改当前工作目录以及处理异常。`File`\
  \ 类提供了用于处理文件的静态方法，而 `FileInfo` 类提供了相同目的的非静态方法。我们还通过使用 `StreamReader`、`StreamWriter`、`BinaryReader`\
  \ 和 `BinaryWriter` 类查看了更复杂的文件处理。\n\n# 30. C# 字符串\n\n字符串是字符的集合，这些字符组合在一起形成单词或句子。如果不是为了人类，计算机可能永远与字符串毫无关系。然而，事实是，计算机的主要工作之一就是接受人类提供的数据并向人类展示数据。因此，任何\
  \ C# 程序都可能包含大量专门设计用于处理字符串形式的数据的代码。\n\n## 30.1 创建 StringsDemo 项目\n\n启动 VS Code，打开你的“C#\
  \ Essentials”工作区文件夹，创建一个名为 `StringsDemo` 的新 .NET 控制台应用程序项目。\n\n创建项目后，打开 `Program.cs`\
  \ 文件，并使用它尝试本章其余部分的示例。\n\n## 30.2 在 C# 中创建字符串\n\n字符串是由包含在字符串对象中的字符序列组成的。可以使用多种不同的机制创建字符串对象。\n\
  \n可以如下所示声明字符串但不对其进行初始化：\n\n```csharp\nstring myString;\n```\n\n或者，你可以使用赋值运算符在 C#\
  \ 中为字符串分配字面量值：\n\n```csharp\nstring myString = \"Hello World\";\n```\n\n当然，也可以使用隐式类型来声明字符串：\n\
  \n```csharp\nvar myString = \"Hello World\";\n```\n\n同样，可以使用 `new` 关键字并将字面量值传递给构造函数来创建一个新字符串：\n\
  \n```csharp\nstring myString = new(\"Hello World\");\n```\n\n字符串字面量放置在双引号内（如上所示）。如果字符串本身包含双引号，则应该在双引号字符前加上转义字符\
  \ `\\` `：\n\n```csharp\nConsole.WriteLine(\"He shouted \\\"Can you hear me?\\\"\"\
  );\n```\n\n输出：\n`He shouted \"Can you hear me?\"`\n\n你还可以通过在字符串前加上 `@` 字符来指示 C#\
  \ 将字符串中的所有字符视为字面量（verbatim）。使用 `@` 符号时，双引号之间的所有内容都被视为原始字符串，无论文本中是否存在换行符、回车、反斜杠等。例如：\n\
  \n```csharp\nConsole.WriteLine(@\"You can put a backslash \\ here\n\nand a new line\n\
  \nand tabs work too.\n\nYou can also put in sequences that would normally be seen\
  \ as escape sequences 转义序列.\");\n```\n\n输出：\n`You can put a backslash \\ here\n\
  and a new line\nand tabs work too.\nYou can also put in sequences that would normally\
  \ be seen as escape sequences 转义 序列.`\n\n如果你熟悉其他编程语言的 heredoc 函数，你会很快发现这本质上是 C#\
  \ 的等效实现。\n\n## 30.3 获取 C# 字符串的长度\n\n如果你需要识别 C# 字符串的长度，可以通过访问字符串对象的 `Length` 属性来实现：\n\
  \n```csharp\nstring myString = \"Hello World\";\nConsole.WriteLine($\"myString length\
  \ = {myString.Length}\");\n```\n\n输出：\n`myString length = 11`\n\n## 30.4 将字符串视为数组\n\
  \n通过使用下标语法 `[]` 指定索引值，可以访问字符串中的单个字符（记住第一个字符位于索引位置 0），并将字符串视为数组（数组在“在 C# 中创建 2D、3D\
  \ 和交错数组”中介绍过）：\n\n```csharp\nstring myString = \"Hello World\";\nConsole.WriteLine(myString[0]);\n\
  Console.WriteLine(myString[2]);\nConsole.WriteLine(myString[4]);\n```\n\n输出：\n`H`\n\
  `l`\n`o`\n\n注意的是，字符串是不可变的（换句话说，虽然可以将全新的字符串字面量分配给变量，但你不能更改字符串中的单个字符）。为了体验体验这种限制，请尝试运行以下代码：\n\
  \n```csharp\nstring myString = \"Hello World\";\nmyString[5] = '-';\n```\n\n当尝试运行上述代码时，你将收到编译器的错误，内容如下：\n\
  `Property or indexer 'string.this[int]' cannot be assigned to -- it is read only`\n\
  \n还可以通过调用字符串对象的 `ToCharArray()` 方法将字符串转换为字符数组：\n\n```csharp\nstring myString = \"\
  Hello World\";\nchar[] charArray = myString.ToCharArray();\nforeach (char c in charArray)\
  \ {\n    Console.WriteLine(c);\n}\n```\n\n输出：\n`H`\n`e`\n`l`\n`l`\n`o`\n`W`\n`o`\n\
  `r`\n`l`\n`d`\n\n## 30.5 字符串字符迭代\n\n既然我们可以将数组中的每个字符视为数组元素，那么了解到我们可以使用 `foreach`\
  \ 循环如下遍历字符串的字符应该并不意外：\n\n```csharp\nstring myString = \"Hello World\";\nforeach\
  \ (char c in myString) {\n    Console.WriteLine(c);\n}\n```\n\n输出：\n`G`\n`o`\n`o`\n\
  `d`\n`b`\n`y`\n`e`\n`W`\n`o`\n`r`\n`l`\n`d`\n\n## 30.6 字符串拼接\n\n可以通过简单使用加运算符 `+`\
  \ 将字符串相加来进行拼接（即连接在一起）。\n\n因此，我们可以如下组合两个字符串：\n\n```csharp\nstring myString = \"Hello\
  \ World.\";\nConsole.WriteLine(myString + \" How are you?\");\n```\n\n输出：\n`Hello\
  \ World. How are you?`\n\n或者，你可以使用 `string` 类的 `Concat()` 实例方法拼接字符串。该方法取两个要连接的字符串作为参数，并返回一个包含这两个字符串并集的新字符串：\n\
  \n```csharp\nstring myString1 = \"If at first you don’t succeed, \";\nstring myString2\
  \ = \"try, try again.\";\nstring myString3 = string.Concat(myString1, myString2);\n\
  Console.WriteLine(myString3);\n```\n\n输出：\n`If at first you don’t succeed, try,\
  \ try again.`\n\n## 30.7 比较字符串\n\n如果你需要比较字符串，C# 提供了几种选项。最常用的选项是使用相等运算符，如下所示：\n\n\
  ```csharp\nstring myString1 = \"Hello World\";\nstring myString2 = \"Hello World\"\
  ;\nif (myString1 == myString2)\n{\n    Console.WriteLine(\"The strings match.\"\
  );\n}\nelse\n{\n    Console.WriteLine(\"They strings not match.\");\n}\n```\n\n\
  输出：\n`The strings match.`\n\n你也可以使用 `string.Equals()` 实例方法以类似的方式比较字符串。该方法取两个字符串作为参数，并返回指示字符串是否匹配的\
  \ `Boolean` ：\n\n```csharp\nstring myString1 = \"Hello world\";\nstring myString2\
  \ = \"Hello world\";\nif (string.Equals(myString1, myString2))\n{\n    Console.WriteLine(\"\
  The strings match.\");\n}\nelse\n{\n    Console.WriteLine(\"The strings do not match.\"\
  );\n}\n```\n\n输出：\n`The strings match.`\n\n在上面的示例中，我们在比较时通过 `Equals()` 方法传递了字符串。`Equals()`\
  \ 方法也可以在字符串字面量或字符串对象调用以获得相同的结果：\n\n```csharp\nstring myString1 = \"Hello world\"\
  ;\nstring myString2 = \"Hello world\";\nif (myString1.Equals(myString2, StringComparison.Ordinal))\n\
  {\n    Console.WriteLine(\"The strings match.\");\n}\nelse\n{\n    Console.WriteLine(\"\
  The strings do not match.\");\n}\n```\n\n输出：\n`The strings match.`\n\n为止，我们探索的所有比较都是执行大小敏感比较。在调用\
  \ `Equals()` 方法时，你还可以传递一个比较类型参数。该类型必须取自 C# `StringComparison` 枚举，该枚举在执行文化敏感比较设置的值中，包含了用于忽略大小比较的\
  \ `OrdinalIgnoreCase` 值：\n\n```csharp\nstring myString1 = \"HELLO WORLD\";\nstring\
  \ myString2 = \"Hello world\";\nif (string.Equals(myString1, myString2, StringComparison.OrdinalIgnoreCase))\n\
  {\n    Console.WriteLine(\"The strings match.\");\n}\nelse\n{\n    Console.WriteLine(\"\
  The strings do not match.\");\n}\n```\n\n输出：\n`The strings match.`\n\n\n\n直接在字符串字面量或对象上调用\
  \ `Equals()` 方法时，这种方法同样适用：\n\n```csharp\nvar result = \"My String\".Equals(\"my\
  \ string\", StringComparison.OrdinalIgnoreCase);\n```\n\n`string.Compare()` 方法提供了另一种比较字符串的方法，尽管该方法具有一些额外的实用功能。此方法接受两个要比较的字符串作为参数，并返回一个整数值，表示字符串与排序顺序之间的关系。结果为\
  \ `0` 表示字符串匹配。小于 `0` 的值表示第一个字符串在排序顺序上于第二个字符串。最后，大于 `0` 的结果表示第二个字符串在排序顺序上于第一个字符串：\n\
  \n```csharp\nstring myString1 = \"Bananas are yellow.\";\nstring myString2 = \"\
  Oranges are orange.\";\nvar result = string.Compare(myString1, myString2);\n\nif\
  \ (result == 0)\n{\n    Console.WriteLine(\"Strings match.\");\n}\nelse if (result\
  \ < 0)\n{\n    Console.WriteLine(\"myString1 precedes myString2 in sort order.\"\
  );\n}\nelse if (result > 0)\n{\n    Console.WriteLine(\"myString2 precedes myString1\
  \ in sort order.\");\n}\n```\n\n输出：\nmyString1 precedes myString2 in sort order.\n\
  \n## 30.8 修改字符串大小写\n\n可以使用 `ToUpper()` 和 `ToLower()` 方法更改字符串中字符的大小写。这两个方法都会返回一个修改后的字符串，而不是更改实际字符串。例如：\n\
  \n```csharp\nstring myString = \"Hello World\";\nstring newString;\nnewString =\
  \ myString.ToUpper();\nConsole.WriteLine(newString);\nnewString = myString.ToLower();\n\
  Console.WriteLine(newString);\n```\n\n输出：\nHELLO WORLD\nhello world\n\n## 30.9 将字符串拆分为多个部分\n\
  \n可以使用 `Split()` 方法将字符串拆分为多个部分。`Split()` 接受一个字符作为分隔符参数，用以识别拆分字符串的位置。该方法调用返回一个包含字符串各个部分的数组。例如，以下代码使用逗号字符作为分隔符拆分字符串。结果存储在名为\
  \ `myColors` 的数组中，然后通过 `foreach` 循环从数组中读取每个项并显示它：\n\n```csharp\nstring myString\
  \ = \"Red, Green, Blue, Yellow, Pink, Purple\";\nstring[] myColors = myString.Split(',');\n\
  foreach (string color in myColors)\n{\n    Console.WriteLine(color);\n}\n```\n\n\
  输出：\nRed Green Blue Yellow Pink Purple\n\n如我们所示，`Split()` 方法按照要求拆分了字符串，但我们遇到了一个问题，空格仍然存在。幸运的是，C#\
  \ 提供了一个方法来处理这种情况。\n\n## 30.10 修剪和填充字符串\n\n可以使用 `Trim()` 方法从字符串中删除不需要的开头和结尾空格。调用时，该方法会返回一个修改后的字符串版本，删除了开头和结尾的空格：\n\
  \n```csharp\nstring myString = \" hello \";\nConsole.WriteLine(\"[\" + myString\
  \ + \"]\");\nConsole.WriteLine(\"[\" + myString.Trim() + \"]\");\n```\n\n输出：\n[\
  \ hello ]\n[hello]\n\n如果你只需要删除开头或结尾空格，请分别使用 `TrimStart()` 或 `TrimEnd()` 方法。\n\n\
  修剪方法的反操作是 `PadLeft()` 和 `PadRight()` 方法。这些方法允许向字符串的开头或结尾添加字符。这些方法接受的参数是字符串需要填充的总字符数以及填充字符：\n\
  \n```csharp\nstring myString = \"hello\";\nstring newString;\nnewString = myString.PadLeft(10,\
  \ ' ');\nnewString = newString.PadRight(20, '*');\nConsole.WriteLine(\"[\" + newString\
  \ + \"]\");\n```\n\n输出：\n[ hello**********]\n\n## 30.11 字符串替换\n\n可以使用 `Replace()`\
  \ 方法替换字符串的部分。该方法接受要替换的字符串部分和替换字符串作为参数，并返回一个反映更改的新字符串。`Replace()` 方法将替换字符串中的所有实例：\n\
  \n```csharp\nstring myString = \"Hello World\";\nstring newString;\nConsole.WriteLine(myString);\n\
  newString = myString.Replace(\"Hello\", \"Goodbye\");\nConsole.WriteLine(newString);\n\
  ```\n\n输出：\nHello World\nGoodbye World\n\n## 30.12 知识测试\n\n点击下方链接或扫描二维码以测试你对 C#\
  \ 字符串的知识和理解：\n\n[`www.answertopia.com/nppx`](https://www.answertopia.com/nppx)\n\
  \n![](img/image-G3POG6U1.jpg)\n\n## 30.13 总结\n\nC# 字符串用于人机交互的字符集合。可以使用字面量、`new`\
  \ 关键字或隐式类型创建字符串。可以使用 `Length()`、`ToCharArray()` 和 `Concat()` 等方法处理字符串，并使用 `foreach`\
  \ 循环对其进行迭代。\n\nC# 提供了多种比较字符串的方法，包括 `Equals()` 和 `Compare()` 等相等运算符。`ToUpper()` 和\
  \ `ToLower()` 方法可以更改字符串大小，而 `Split()` 将字符串拆分为部分。`Trim()` 删除开头和结尾空格，而 `PadLeft()`\
  \ 和 `PadRight()` 则在字符串的开头或结尾添加字符。\n\n# 31. 字符串格式化\n\n除了上一节概述的广泛的字符串操作函数外，`string`\
  \ 类还提供了 `Format()` 方法。\n\n除了上一节中概述的多种字符串操作函数外，`string` 类还提供了 `Format()` 方法。\n\n\
  C# `Format()` 方法的主要目的是通过额外的格式控制将字符串、数值或布尔值插入到字符串中。\n\n## 31.1 Format 方法的语法\n\n`Format()`\
  \ 方法的通用语法如下：\n\n```csharp\nstring.Format(\"格式字符串\", arg1, arg2, .... );\n```\n\n\
  格式字符串是用于插入值的字符串。字符串中的占位符指示了值的位置。占位符的形式为 `{}` 包围一个数字。格式字符串后面是逗号分隔的参数列表。每个占位符对应有一个参数。\n\
  \n## 31.2 创建 StringFormat 项目\n\n启动 VS Code，打开你的“C# Essentials”工作空间文件夹，创建一个名为 `StringFormat`\
  \ 的 .NET 控制应用程序。\n\n创建项目后，打开 `Program.cs` 文件并使用它尝试本章剩余示例。\n\n## 31.3 简单的字符串格式化示例\n\
  \n下面的代码示例演示了 `Format()` 方法的基本用法：\n\n```csharp\nstring newString;\nnewString = string.Format(\"\
  There are {0} cats in my {1} and no {2}\", 2, \"house\", \"dogs\");\nConsole.WriteLine(newString);\n\
  ```\n\n输出：\nThere are 2 cats in my house and no dogs\n\n让我们快速回顾上面的 `Format()` 方法调用。格式字符串包含三个占位符\
  \ `{0}`、`{1}` 和 `{2}`。格式字符串后面是用于每个占位符的参数。所以，例如，`{0}` 被第一个参数（数字 `2`）替换，`{1}` 被第二个参数（字符串“house”）替换，依此类推。\n\
  \n如果你回想起“C# 变量与常量”章节，你可能会好奇这与我们在书中反复使用的字符串插值技术有何不同。正如下面所示，C# 字符串格式化在结合格式控制时会变得更加有用。\n\
  \n## 31.4 使用格式控制\n\n到为止，我们只是替换了占位符，但还没有在显示之前更改参数的格式。这实际上是指示 `Format()` 方法在显示时使用每个参数类型的默认格式。\n\
  \n格式控制出现在占位符的大括号 (`{}`) 内部。带有格式控制的占位符格式如下：\n\n```\n{n:controlx}\n```\n\n\n\n在上述语法中，`n`\
  \ 是占位符数字，`control` 是应用于参数的特殊格式控制序列。可选的数字 `x` 进一步对某些控制类型的输出进行格式化。\n\n### 31.5 简单的格式控制示例\n\
  \n以下示例使用了 `X` 格式控制，它用于用十六进制格式显示数字：\n\n```csharp\nvar newString = string.Format(\"\
  The number {0} in Hexadecimal is {0:X}.\", 432);\nConsole.WriteLine (newString);\n\
  ```\n\n输出:\nThe number 432 in Hexadecimal is 1B0.\n\n上面的示例以两种格式显示了参数 `0` (`432`)。第一种是默认的十进制格式，第二种使用\
  \ `X` 格式控制将参数作为十六进制数显示。\n\n`string.Format()` 方法提供了许多格式控制，我们将在下文中进行探索。\n\n### 31.6\
  \ C# string Format() 格式控制\n\n下表列出了 C# `string.Format()` 方法支持的格式控制，以及每个控制的示例：\n\n\
  | 控制符 | 类型 | 描述 | 示例 |\n| :--- | :--- | :--- | :--- |\n| C | 货币 | 显示带有当前区域适当货币符号前缀的数字\
  \ | 432.00 的 `{0:C}` 输出 $432.00 |\n| D | 十进制 | 以十进制形式显示数字，并可选填充 | 432 的 `{0:D4}`\
  \ 输出 00432 |\n| E | 指数法 | 以科学形式显示数字，并对小数部分可选值 | 432.32 的 `{0:E5}` 输出 4.32320E+002\
  \ |\n| F | 固定点 | 显示数字，包括指定的小位数 | 432.324343 的 `{0:F3}` 输出 432.324 |\n| N | 数字 |\
  \ 通过插入逗号和四舍五入到最接近的百分位将数字转换为人类友好的格式 | 123432.324343 的 `{0:N}` 输出 123,432.32 |\n|\
  \ X | 十六进制 | 将数字转换为十六进制 | 432 的 `{0:X}` 输出 1B0 |\n| 0:0… | 零填充 | 向参数添加零填充 | 43.1\
  \ 的 `{0:0000.00}` 输出 0043.10 |\n| 0:0#… | 空格填充 | 向参数添加空格填充 | 43.1 的 `{0:####.##}`\
  \ 输出 43.1 |\n| % | 百分比 | 将参数乘以 100 并附加百分号 | .432 的 `{0:00.00%}` 输出 43.20% |\n\n\
  表 31-1\n\n在进入下一个章节之前，运行以下代码查看这些格式控制的实际效果：\n\n```csharp\nvar newString = string.Format(\"\
  The number {0} fixed to 2 decimal places is {0:F2}.\", 109.78799);\nConsole.WriteLine\
  \ (newString);\n\nnewString = string.Format(\"The number {0} using human friendly\
  \ formatting is {0:N}.\", 1023429.78799);\nConsole.WriteLine (newString);\n\nnewString\
  \ = string.Format(\"The number {0} using exponential formatting is {0:E6}.\", 32423.24232);\n\
  Console.WriteLine (newString);\n\nnewString = string.Format(\"The number {0} as\
  \ a percentage to 3 decinal places is {0:00.000%}.\", 0.24232);\nConsole.WriteLine\
  \ (newString);\n```\n\n输出:\nThe number 109.78799 fixed to 2 decimal places is 109.79.\n\
  The number 1023429.78799 using human friendly formatting is 1,023,429.79.\nThe number\
  \ 32423.24232 using exponential formatting is 3.242324E+004.\nThe number 0.24232\
  \ as a percentage to 3 decinal places is 24.232%.\n\n### 31.7 知识测试\n\n点击下方的链接或扫描二维码来测试你对\
  \ C# 字符串格式化的知识和理解程度：\n\n[`www.answertopia.com/yywc`](https://www.answertopia.com/yywc)\n\
  \n![](img/image-7OJ7GK07.jpg)\n\n### 31.8 总结\n\nC# `string.Format()` 方法允许使用格式控制将值插入字符串。格式控制（如用于货币的\
  \ `C` 和用于十六进制的 `X`）可以在占位符中使用以修改输出格式。该方法为各种数据类型提供了广泛的格式控制。\n\n# 32. C# 日期和时间\n\n\
  很少有可以在不需要处理日期和时间的情况下开发。考虑到这一点，负责 C# 的微软工程师为我们提供了 `DateTime` 对象。本章将介绍如何在基于 C# 的应用程序中使用此对象来处理日期和时间。涵盖主题包括加减时间、获取系统日期和时间，以及在\
  \ C# 中对日期时间进行格式化和元素提取。\n\n### 32.1 创建 DateTime 项目\n\n启动 VS Code，打开“C# Essentials”文件夹，创建一个名为\
  \ `DateTimeDemo` 的新控制台项目。\n\n### 32.2 创建 DateTime\n\n处理 `DateTime` 的第一步是使用 `DateTime`\
  \ 构造函数。例如：\n\n```csharp\nDateTime newDate = new DateTime(2024, 4, 9);\nConsole.WriteLine(newDate.ToString());\n\
  ```\n\n输出:\n4/9/2024\n\n### 32.3 获取系统日期和时间\n\n可以通过 `DateTime` 类的 `Today` 和 `Now`\
  \ 静态属性访问系统日期和时间。`Today` 属性将返回当前日期（时间设置为 12:00 AM），而 `Now` 属性返回当前的日期和时间。例如，以下代码演示：\n\
  \n```csharp\nConsole.WriteLine(DateTime.Today.ToString());\nConsole.WriteLine(DateTime.Now.ToString());\n\
  ```\n\n输出:\n8/16/2024 12:00:00 AM\n8/16/2024 10:32:37 AM\n\n## 32.4 对日期时间进行加减\n\n\
  C# `DateTime` 对象提供了多种方法用于向 `DateTime` 实例添加或减去日期和时间。这些方法列如下所示：\n\n| 方法 | 描述 |\n|\
  \ :--- | :--- |\n| Add | 加/减指定的 `TimeSpan` 实例值。 |\n| AddDays | 加/减指定的数。 |\n| AddHours\
  \ | 加/减指定的小时。 |\n| AddMilliseconds | 加/减指定的毫秒。 |\n| AddMinutes | 加/减指定的分钟。 |\n|\
  \ AddMonths | 加/减指定的月份。 |\n| AddSeconds | 加/减指定的秒。 |\n| AddYears | 加/减指定的年份。 |\n\
  \n表 32-1\n\n需要理解的关键问题是，这些方法不会更改调用该方法的 `DateTime` 对象的值，而是返回一个带有修改后的日期和时间的新 `DateTime`\
  \ 对象。例如，在我们的示例中中添加五天：\n\n```csharp\nDateTime meetingAppt = new(2024, 4, 9, 14, 30,\
  \ 0);\nDateTime newAppt = meetingAppt.AddDays(5);\nConsole.WriteLine(newAppt.ToString());\n\
  ```\n\n输出:\n4/14/2024 2:30:00 PM\n\n要从日期和时间中减去，请向适当的方法传递负值。例如，我们可以从示例对象中减去十个月：\n\
  \n```csharp\nDateTime meetingAppt = new(2024, 4, 9, 14, 30, 0);\nDateTime newAppt\
  \ = meetingAppt.AddMonths(-10);\nConsole.WriteLine(newAppt.ToString());\n```\n\n\
  输出:\n6/9/2023 2:30:00 PM\n\n## 32.5 获取日期和时间的部分\n\n\n\n\n日期和时间由不同且独立的数值组成，即日、月、年、小时、分钟、秒和毫秒。C#\
  \ 的 `DateTime` 对象将每个值存储为对象内部的每个独立属性，允许单独访问每个值。例如，下面的代码示例提取了每个值并在控制台中显示它们：\n\n```csharp\n\
  DateTime meetingAppt = new(2024, 4, 9, 14, 30, 0);\n\nConsole.WriteLine(meetingAppt.Day);\n\
  \nConsole.WriteLine(meetingAppt.Month);\n\nConsole.WriteLine(meetingAppt.Year);\n\
  \nConsole.WriteLine(meetingAppt.Hour);\n\nConsole.WriteLine(meetingAppt.Minute);\n\
  \nConsole.WriteLine(meetingAppt.Second);\n\nConsole.WriteLine(meetingAppt.Millisecond);\n\
  ```\n\n输出：\n9\n4\n2023\n14\n30\n0\n0\n\n32.6\n\n## 32.6 知识测试\n\n点击下方的链接或扫描二维码来测试你对\
  \ C# 日期和时间的知识与理解：\n\n[`www.answertopia.com/ants`](https://www.answertopia.com/ants)\n\
  \n![](img/image-XUU8LYKB.jpg)\n\n## 32.7 总结\n\n在本章中，我们学习了 C# `DateTime` 对象，它用于处理\
  \ C# 中的日期和时间。我们讨论了如何通过指定日期或包含时间值来创建 `DateTime` 对象。我们还查看了如何使用 `Today` 和 `Now` 属性访问当前日期和时间。此外，我们探索了\
  \ `DateTime` 对象提供的处理日期时间的各种方法，例如加减天、月、年和其他时间单位。最后，我们涵盖了如何使用 `DateTime` 属性提取日、月、年、小时和分钟等单个组件，这允许对日期和时间的特定元素进行操作。\n\
