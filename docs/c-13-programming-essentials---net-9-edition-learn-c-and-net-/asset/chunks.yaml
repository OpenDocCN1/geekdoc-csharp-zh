    \n## 24.12 Summary\n\nAsynchronous programming in C# uses the `Task` class and\
    \ `await` operator to run tasks in parallel, improving performance and responsiveness.\
    \ The `await` operator suspends execution until a task is completed, allowing\
    \ other code to run concurrently. By converting synchronous methods to asynchronous\
    \ ones, multiple tasks can be executed simultaneously, reducing overall execution\
    \ time.\n\nTo achieve concurrent execution, store `Task` objects returned by `async`\
    \ methods and await their results later. Cancellation of asynchronous tasks can\
    \ be implemented using the `Cancel()` method of the `CancellationTokenSource`\
    \ object. When canceling tasks, appropriate steps should be taken to handle exceptions\
    \ to prevent the app from crashing.\n\n## 25. Creating 2D, 3D, and Jagged Arrays\
    \ in C#\n\nArrays are certainly not unique to C#. In fact, just about every other\
    \ programming and scripting language preceding the introduction of C# provided\
    \ support for arrays. An array allows a collection of values of the same type\
    \ to be stored and accessed via a single variable. Each item is accessed in the\
    \ array variable through the use of an array index.\n\nC# arrays, while useful,\
    \ have some limitations. Perhaps the most significant limitation is the fact that\
    \ once an array has been created, it cannot be made larger or smaller to accommodate\
    \ more or fewer values. More dynamic and flexible collection storage capabilities\
    \ will be covered starting with the chapter titled “C# List Collections”.\n\n\
    ## 25.1 Creating arrays in C#\n\nA C# array may be created in several different\
    \ ways. One way is to declare an array without initializing it with any values.\
    \ The syntax for this is as follows:\n\n```cs\ntype[] arrayname;\n```\n\nIn the\
    \ above example, `type` represents the type of data to be stored in the array\
    \ (for example, `string`, `int`, `decimal` etc). The square brackets (`[]`) indicate\
    \ that this is the declaration for an array, and `arrayname` is the name by which\
    \ the array is to be referred.\n\nFor example, we can declare an array of strings\
    \ called `myColors` as follows:\n\n```cs\nstring[] myColors;\n```\n\nIn this example,\
    \ we have declared the array but not assigned any values to it. To assign values\
    \ after an array has been declared, use the following syntax:\n\n```cs\nstring[]\
    \ myColors;\nmyColors = [\"red\", \"green\", \"yellow\", \"orange\", \"blue\"\
    ];\n```\n\nAn array may also be initialized by simply placing the comma-separated\
    \ list:\n\n```cs\nstring[] myColors = [\"red\", \"green\", \"yellow\", \"orange\"\
    , \"blue\"];\n```\n\nAnother option is to declare the size of the array when it\
    \ is created:\n\n```cs\nstring[] myColors = new string[5];\n```\n\nThis will reserve\
    \ space for 5 string elements.\n\n## 25.2 Multidimensional arrays\n\nMultidimensional\
    \ arrays are declared by placing commas within the square brackets. For example,\
    \ to declare a two-dimensional array:\n\n```cs\nchar[,] myDarray;\n```\n\nThe\
    \ single comma (`,`) in the above syntax indicates to C# that this is a two-dimensional\
    \ array. A two-dimensional array is initialized as follows:\n\n```cs\nchar[,]\
    \ myDarray = \n{\n    {'a', 'b', 'c'},\n    {'d', 'e', 'f'}\n};\n```\n\nThis creates\
    \ a multidimensional array with rows and columns. It is also possible to specify\
    \ the dimensions when the array is declared:\n\n```cs\nchar[,] myDarray = new\
    \ char[2, 3];\n```\n\nA three-dimensional array is declared by using two commas:\n\
    \n```cs\nchar[,,] my3array;\n```\n\nThe following will initialize the three-dimensional\
    \ array:\n\n```cs\nchar[,,] my3array = \n{\n    {\n        {'a', 'b', 'c'},\n\
    \        {'d', 'e', 'f'}\n    },\n    {\n        {'g', 'h', 'i'},\n        {'j',\
    \ 'k', 'l'}\n    }\n};\n```\n\nA three-dimensional array is essentially an array\
    \ where each element is a two-dimensional array. In the above declaration, the\
    \ array consists of two arrays, each containing three elements.\n\nIt is also\
    \ possible to specify the dimensions when the array is declared:\n\n```cs\nchar[,,]\
    \ my3array = new char[2, 2, 3] \n{\n    {\n        {'a', 'b', 'c'},\n        {'d',\
    \ 'e', 'f'}\n    },\n    {\n        {'g', 'h', 'i'},\n        {'j', 'k', 'l'}\n\
    \    }\n};\n```\n\n## 25.3 Declaring jagged arrays\n\nA jagged array is an array\
    \ where each element is itself an array. The term jagged is used in this context\
    \ because the array elements can be of different lengths. A jagged array can be\
    \ thought of as a 2D array where each array can have a different number of elements.\n\
    \nThe following is an example of a declaration for a jagged array designed to\
    \ hold two-dimensional arrays of variable sizes:\n\n```cs\nchar[][] myJaggedArray;\n\
    ```\n\nThe following code declares and initializes the same jagged array:\n\n\
    ```cs\nchar[][] myJaggedArray = \n[\n    ['a', 'b', 'c', 'd', 'e'],\n    ['f',\
    \ 'g', 'h', 'i'],\n    ['j', 'j'],\n    ['k', 'l', 'm', 'n', 'o', 'p', 'q', 'r']\n\
    ];\n```\n\n## 25.4 Take the knowledge test\n\nClick the link below or scan the\
