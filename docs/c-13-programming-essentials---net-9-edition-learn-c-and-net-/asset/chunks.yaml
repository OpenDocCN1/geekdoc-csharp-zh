  trans: "\n\n为了亲身体验，请在 `Main()` 和 `VoltageCheck()` 方法之间添加一个名为 `StartMotor()` 的中间方法，并移除\
    \ `try-catch` 语句：\n\n```csharp\nnamespace ExceptionDemo\n{\n    internal class\
    \ Program\n    {\n        static void Main(string[] args)\n        {\n       \
    \     StartMotor();\n        }\n        private static void StartMotor()\n   \
    \     {\n            VoltageCheck(501);\n            Console.WriteLine(\"Clean\
    \ up after check.\");\n        }\n        private static void VoltageCheck(int\
    \ voltage)\n        {\n            if (voltage > 500)\n            {\n       \
    \         throw new ArgumentOutOfRangeException(nameof(voltage),\n           \
    \         \"Voltage exceeds safety parameters.\");\n            }\n          \
    \  else\n            {\n                Console.WriteLine(\"Safe Voltage\");\n\
    \            }\n        }\n    }\n}\n```\n\n由于异常在三个方法中均未被捕获，应用程序在运行时将会崩溃。然而，我们可以通过在\
    \ `VoltageCheck()`、`StartMotor()` 或 `Main()` 中添加 `try-catch` 语句来捕获错误。在本示例中，请使用\
    \ `try-catch` 语句在 `Main()` 方法内部调用 `StartMotor()`：\n\n```csharp\nstatic void Main(string[]\
    \ args)\n{\n    try\n    {\n        StartMotor();\n    }\n    catch (Exception\
    \ ex) {\n        Console.WriteLine(ex.Message);\n    }\n}\n```\n\n重新运行程序，确认异常已向上传播到\
    \ `Main()` 方法并被捕获处理：\n\n`Voltage exceeds safety parameters. (Parameter 'voltage')`\n\
    \n请注意，上述控制台输出没有执行电压检查后的清理操作。按照目前的实现方式，`StartMotor()` 将无法感知 `VoltageCheck()` 抛出了异常，`StartMotor()`\
    \ 中 `VoltageCheck()` 之后的任何代码都将被跳过，控制权将立即返回到 `Main()`。但假设 `StartMotor()` 无论是否抛出异常都需要在电压检查后执行清理工作。我们可以使用\
    \ `try-finally` 语句来实现这种行为：\n\n```csharp\nprivate static void StartMotor()\n{\n\
    \    try\n    {\n        VoltageCheck(501);\n    }\n    finally\n    {\n     \
    \   Console.WriteLine(\"Clean up whether or not voltage is safe.\");\n    }\n\
    }\n```\n\n再次编译并运行程序，验证即使在抛出异常时也会发生清理工作：\n\n`Clean up whether or not voltage is\
    \ safe.`\n`Voltage exceeds safety parameters. (Parameter 'voltage')`\n\n## 23.8\
    \ 重新抛出异常\n\n有时，异常需要在调用层次结构的多个层级进行捕获。通过在捕获异常后将其重新抛出来实现，使其能够继续在层次结构中向上传递。如下所示，在\
    \ `catch` 体中使用 `throw` 语句重新抛出异常：\n\n```csharp\nstatic void Main(string[] args)\n\
    {\n    try\n    {\n        StartMotor();\n    }\n    catch (Exception ex) {\n\
    \        Console.WriteLine(\"Caught in Main() \" + ex.Message);\n    }\n}\nprivate\
    \ static void StartMotor()\n{\n    try\n    {\n        VoltageCheck(501);\n  \
    \  }\n    catch (Exception ex) {\n        Console.WriteLine(\"Caught in StartMotor\
    \ \" + ex.Message);\n        throw;\n    }\n    finally\n    {\n        Console.WriteLine(\"\
    Clean up or not voltage is safe.\");\n    }\n}\n```\n\n运行程序并检查控制台以验证重新抛出有效，且异常被两个方法都捕获：\n\
    \n`StartMotor(): Voltage exceeds safety parameters. (Parameter 'voltage')`\n`Clean\
    \ up or not voltage is safe.`\n`Main(): Voltage exceeds safety parameters. (Parameter\
    \ 'voltage')`\n\n## 23.9 创建异常类型\n\n到目前为止，本章节一直使用内置异常类型来演示如何在 C# 中抛出和捕获异常。然而，有时创建自定义异常比使用预定义类型更有意义。自定义类型派自\
    \ `Exception` 类，并根据需要应包含构造函数和参数。类型名称也应以“Exception”结尾。以下代码为我们应用程序中的高电压错误声明了一个自定义异常：\n\
    \n```csharp\nclass HighVoltageException : Exception\n{\n    public HighVoltageException()\n\
    \    {\n    }\n    public HighVoltageException(string message)\n        : base(message)\n\
    \    {\n    }\n    public HighVoltageException(string message, Exception inner)\n\
    \        : base(message, inner)\n    {\n    }\n}\n```\n\n一旦声明，可以按如下方式抛出异常：\n\n\
    `throw new HighVoltageException(\"Voltage exceeds safety parameters.\");`\n\n\
    `HighVoltageException` 类型不包含属性，因此仅可以使用消息字符串创建实例：\n\n`throw new HighVoltageException(\"\
    Voltage exceeds safety parameters.\");`\n\n我们还可以扩展类型声明，以包含一个属性，用于记录异常发生时的电压水平：\n\
    \n```csharp\nclass HighVoltageException : Exception\n{\n    public int Volts;\n\
    \    public HighVoltageException()\n    {\n    }\n    public HighVoltageException(string\
    \ message)\n        : base(message)\n    {\n    }\n    public HighVoltageException(string\
    \ message, Exception inner)\n        : base(message, inner)\n    {\n    }\n  \
    \  public HighVoltageException(string message, int Volts)\n        : base(message)\n\
    \    {\n        this.Volts = Volts;\n    }\n}\n```\n\n现在可以使用消息字符串和触发异常的电压值来创建一个\
    \ `HighVoltageException` 实例：\n\n```csharp\nprivate static void VoltageCheck(int\
    \ voltage)\n{\n    if (voltage > 500)\n    {\n        throw new HighVoltageException(\"\
    Voltage exceeds safety parameters.\", voltage);\n    }\n    else\n    {\n    \
    \    Console.WriteLine(\"Safe Voltage\");\n    }\n}\n```\n\n异常属性可以像消息属性一样在 `catch`\
    \ 块中访问。在下面的示例中，电压属性包含在通知文本中并据此做出决策：\n\n```csharp\ntry\n{\n    StartMotor();\n\
    }\ncatch (HighVoltageException ex)\n{\n    Console.WriteLine(ex.Message);\n  \
    \  Console.Write(\"Current voltage: {ex.Volts}\");\n    if (ex.Volts < 510)\n\
    \    {\n        // 等待并重试\n    }\n    else\n    {\n        // 关键。关闭系统\n    }\n\
    }\n```\n\n## 23.10 测试\n\n点击下方链接或扫描二维码以测试你对 C# 异常处理的知识和理解：\n\n[`www.answertopia.com/hy8t`](https://www.answertopia.com/hy8t)\n\
    \n## 23.11 总结\n\n异常处理确保程序能够有效地处理错误，通过捕获、处理和响应问题避免崩溃。当方法无法继续执行时，会“抛出”异常。每个异常都有特定的类型，提供了有关错误的性质的信息。除了预定义的异常类型（如\
    \ `ArgumentOutOfRangeException`），有时也可以创建自定义异常类型。使用 `try-catch` 块处理异常。将可能抛出异常的代码放在\
    \ `try` 块中，而 `catch` 块包含抛出异常时执行的代码。`catch` 块可以访问异常详细信息，在可能发生多种类型异常的情况下，可以分别处理特定的异常类型。`finally`\
    \ 块也可用于执行代码（例如清理资源），无论是否发生异常。\n\n## 24 C# 中的异步编程\n\n异步编程允许软件同时执行多个任务。这意味着下载图像或处理大量数据等任务可以比顺序执行更快完成。多任务处理通过在后台执行耗时操作而不影响应用程序的响应速度，提供了更流畅的用户体验。\n\
    \n"
- fmt: "\nIn this chapter, we will explore the asynchronous features of C# and explain\
    \ how they can be used to incorporate multi-tasking support into your projects.\n\
    \n## 24.1 An overview of threads\n\nThreads are a fundamental feature of modern\
    \ CPUs and are essential for multitasking in operating systems. While CPUs can\
    \ handle numerous threads, the actual number of threads that can run in parallel\
    \ at a given time is limited by the number of CPU cores, typically ranging from\
    \ 4 to 16 cores depending on the CPU model. When the number of threads exceeds\
    \ the available CPU cores, the operating system uses thread scheduling to determine\
    \ how these threads are shared among the available cores.\n\nThreads are like\
    \ small processes that run within a main process. They allow for the appearance\
    \ of parallel execution within applications and managing them directly in code\
    \ can be a complex and unpredictable process. The great thing about the asynchronous\
    \ features of C#, however, is that they use threads behind the scenes, handling\
    \ all the complexity for you.\n\n## 24.2 The main thread\n\nWhen an app is first\
    \ started, the runtime system will typically create a single thread in which the\
    \ app will run by default. Any code within an app that performs a time-consuming\
    \ task using the main thread will cause the entire application to appear to lock\
    \ up until the task is completed. This can be avoided by launching the tasks to\
    \ be performed in separate threads, allowing the main thread to continue unhindered\
    \ with other tasks.\n\n## 24.3 Asynchronous programming in C#\n\nAsynchronous\
    \ support in C# is provided by the Task Asynchronous Programming model (TAP),\
    \ which allows parallel execution to be performed safely and in a way that is\
    \ logical and easy to both write and understand. In other words, asynchronous\
    \ C# code is written sequentially from top to bottom in much the same way as synchronous,\
    \ making it easy to understand the logic flow.\n\nThis chapter introduces C# asynchronous\
    \ programming, providing in-depth coverage of key concepts and techniques for\
    \ efficient parallel execution.\n\n## 24.4 Creating the AsyncDemo project\n\n\
    Launch VS Code, open your “C# Essentials” workspace folder, and create a new .NET\
    \ Console App project named `AsyncDemo`.\n\n## 24.5 Synchronous code\n\nBefore\
    \ exploring asynchronous programming, we will first look at an example of synchronous\
    \ code execution. Begin by opening the `Program.cs` file and modifying it as follows:\n\
    \n```csharp\nnamespace AsyncDemo\n{\n    internal class Program\n    {\n     \
    \   static void Main(string[] args)\n        {\n        }\n        private static\
    \ string ProcessFile(string filename)\n        {\n            Console.WriteLine($\"\
    Start {filename} at {DateTime.Now}\");\n            Task.Delay(6000).Wait();\n\
    \            return filename;\n        }\n    }\n}\n```\n\nThe `ProcessFile()`\
    \ method outputs a starting timestamp before calling the `Task.Delay()` and `Wait()`\
    \ methods to simulate a 6-second file processing task that blocks the current\
    \ thread. After the delay, the method returns the name of the completed file.\n\
    \nNext, we want to call `ProcessFile()` multiple times from the `Main()` method.\
    \ In doing so, we will also output start timestamps and use the C# `Stopwatch`\
    \ diagnostic class to record the total execution time of the method calls:\n\n\
    ```csharp\nusing System.Diagnostics;\nnamespace AsyncDemo\n{\n    internal class\
    \ Program\n    {\n        static void Main(string[] args)\n        {\n       \
    \     Stopwatch stopwatch = Stopwatch.StartNew();\n            Console.WriteLine(\"\
    \\n=== Before async task calls ===\\n\");\n            string filename1 = ProcessFile(\"\
    file1.txt\");\n            Console.WriteLine($\"End {filename1} at {DateTime.Now}\\\
    n\");\n            string filename2 = ProcessFile(\"file2.txt\");\n          \
    \  Console.WriteLine($\"End {filename2} at {DateTime.Now}\\n\");\n           \
    \ string filename3 = ProcessFile(\"file3.txt\");\n            Console.WriteLine($\"\
    End {filename3} at {DateTime.Now}\\n\");\n            Console.WriteLine(\"===\
    \ After async task calls ===\");\n            stopwatch.Stop();\n            Console.WriteLine($\"\
    Elapsed time: {stopwatch.Elapsed.Seconds} seconds\");\n        }\n    }\n}\n```\n\
    \nRun the app and check the output:\n\n```=== Before async task calls ===\n\n\
    Start file1.txt at 10/27/2023 10:00:00 AM\nEnd file1.txt at 10/27/2023 10:00:06\
    \ AM\n\nStart file2.txt at 10/27/2023 10:00:06 AM\nEnd file2.txt at 10/27/2023\
    \ 10:00:12 AM\n\nStart file3.txt at 10/27/2023 10:00:12 AM\nEnd file3.txt at 10/27/2023\
    \ 10:00:18 AM\n=== After async task calls ===\nElapsed time: 18 seconds\n```\n\
    \nAs we see from the above output, the three calls to `ProcessFile()` were executed\
    \ sequentially resulting in 18 seconds. Converting `ProcessFile()` to an asynchronous\
    \ method should reduce the total time from 18 to 6 seconds.\n\n## 24.6 Understanding\
    \ the Task class\n\nAsynchronous operations in C# are represented by `Task` objects.\
    \ As we saw earlier, we can directly call `Task` methods such as `Delay()`, for\
    \ example:\n\n```csharp\nTask.Delay(6000);\n```\n\nThe above code will start an\
    \ asynchronous 6-second delay. In other words, although the delay will be performed,\
    \ it will occur in the background. To make the execution block the current thread\
    \ we called the `Wait()` method of the `Task` to:\n\n```csharp\nTask.Delay(6000).Wait();\n\
    ```\n\n## 24.7 Declaring asynchronous methods\n\nAsynchronous execution can be\
    \ applied to methods, lambdas, and anonymous functions and are declared using\
