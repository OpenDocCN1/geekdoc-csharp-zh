    \ the future is\n\n```\n\n## 26.7 Sorting C# arrays\n\nThe C# array is part of\
    \ the `Array` package, which also includes some useful methods for sorting and\
    \ re-ordering arrays.\n\nIf you need to sort an array, pass it as an argument\
    \ to the `Array.Sort()` method as follows:\n\n```cs\nstring[] myColors = [ \"\
    red\", \"green\", \"yellow\", \"orange\", \"blue\" ];\n\nConsole.WriteLine(\"\
    Before Sort\");\nforeach (string color in myColors)\n{\n    Console.Write(\"{0}\
    \ \", color);\n}\n\nArray.Sort(myColors);\nConsole.WriteLine(\"\\n\\nAfter Sort\"\
    );\nforeach (string color in myColors)\n{\n    Console.Write(\"{0} \", color);\n\
    }\n```\n\nOutput:\nBefore Sort\nred green yellow orange blue\nAfter Sort\nblue\
    \ green orange red yellow\n\nYou can also reverse the order of the elements in\
    \ an array using the `Array.Reverse()` method:\n\n```cs\nstring[] myColors = [\"\
    red\", \"green\", \"yellow\", \"orange\", \"blue\"];\nArray.Reverse(myColors);\n\
    foreach (string color in myColors)\n{\n    Console.Write(\"{0} \", color);\n}\n\
    ```\n\nOutput:\nblue orange yellow green red\n\n## 26.8 Clearing C# arrays\n\n\
    The values in an array may be cleared using the `Array.Clear()` method. This method\
    \ clears each item in an array to the default value for the type (false for Boolean\
    \ values, 0 for numeric items, and null for strings). The syntax for clearing\
    \ array elements is as follows:\n\n`Array.Clear(<array>, <start index>, <count>);`\n\
    \nIn the above syntax, `<array>` is the array to be cleared, `<start index>` is\
    \ the position within the array at which clearing is to begin, and `<count>` is\
    \ the number of elements to be cleared.\n\nThe following example clears three\
    \ elements starting at item 1:\n\n```cs\nstring[] myColors = [\"red\", \"green\"\
    , \"yellow\", \"orange\", \"blue\"];\nArray.Clear(myColors, 1, 3);\nforeach (string\
    \ color in myColors)\n{\n    Console.Write(\"{0} \", color);\n}\n```\n\nWhen the\
    \ above code runs, only the `blue` and `red` elements will remain in the array.\n\
    \n## 26.9 Take the knowledge test\n\nClick the link below or scan the QR code\
    \ to test your knowledge and understanding of C# array management:\n\n[https://www.answertopia.com/ty5r](https://www.answertopia.com/ty5r)\n\
    \n![](images/image-E70B6G8K.jpg)\n\n## 26.10 Summary\n\nThis chapter explored\
    \ accessing, removing, and sorting elements in C# arrays. It demonstrated how\
    \ to use the `Rank` property to determine the number of dimensions, the array\
    \ accessor notation to access elements, and the `foreach` loop to iterate through\
    \ arrays. Additionally, it covers using ranges and the index from end operator\
    \ to extract subsets of elements, and the `Array.Sort()`, `Array.Reverse()`, and\
    \ `Array.Clear()` methods to sort, reverse, and clear arrays, respectively.\n\n\
    ## 27. C# List Collections\n\nIn the previous chapters, we looked at C# Arrays.\
    \ While useful for many tasks, arrays are starting to show their age in terms\
    \ of functionality and flexibility. The C# Collection Classes provide more advanced\
    \ mechanisms for gathering groups of objects.\n\n## 27.1 Creating the CollectionDemo\
    \ Project\n\nLaunch VS Code, open your “C# Essentials” workspace folder and create\
    \ a new .NET Console App project named `CollectionDemo`.\n\nOnce you have created\
    \ the project, open the `Program.cs` file and use it to try out the examples in\
    \ the rest of this chapter.\n\n## 27.2 Introducing the C# Collection Classes\n\
    \nThe C# Collection classes are designed specifically for grouping objects and\
    \ performing tasks on them. Several collection classes are available with C#,\
    \ and we will look at some key classes in the next few chapters.\n\n## 27.3 Creating\
    \ C# list collections with List\n\nThe `List<t>` class has properties very similar\
    \ to C# arrays. One key advantage of this class over arrays is that it can grow\
    \ and shrink as the number of stored objects changes.\n\nThe syntax for creating\
    \ a `List<type>` collection is as follows where `type` is replaced by the data\
    \ type to be stored in the list:\n\n`List<type>name = new List<type>();`\n\nAlternatively,\
    \ the above syntax may be simplified as follows:\n\n`List<type>name = [];`\n\n\
    With the above syntax in mind, we could create an empty `List<object>` named `colorList`\
    \ configured to store string values using either of the following statements:\n\
    \n`List<string>colorList = new List<string>();`\n`List<string>colorList = [];`\n\
    \n## 27.4 Adding items to lists\n\nOnce you have created a `List` instance, there\
    \ are several methods you can call to perform tasks on the list. One such method\
    \ is the `Add()` method which, as the name suggests, is used to add items to the\
    \ list:\n\n```cs\ncolorList.Add(\"Red\");\ncolorList.Add(\"Green\");\ncolorList.Add(\"\
    Yellow\");\ncolorList.Add(\"Purple\");\ncolorList.Add(\"Orange\");\n```\n\nThe\
    \ `Add()` method appends the new item to the end of the list. To insert new items\
    \ at a specific index, you will need to use the `Insert()` method covered later.\n\
    \n## 27.5 Initializing a list with multiple values\n\nIn the above example, we\
    \ created an empty list and added items one by one using the `Add()` method. However,\
    \ if you need to initialize a list with a large number of values, you may find\
    \ it more efficient to use a collection initializer, the syntax for which is follows:\n\
    \n`List<string>colorList = [\"Red\", \"Green\", \"Yellow\", \"Purple\", \"Orange\"\
    ];`\n\n## 27.6 Accessing list items\n\nIndividual items in a list may be accessed\
    \ using the item’s index value (keeping in mind that the first item is 0, the\
    \ second 1, and so on). The index value is placed in square brackets after the\
    \ list name. For example, to access the second item in the `colorList` object:\n\
    \n```cs\nConsole.WriteLine(colorList[1]);\n```\n\nOutput:\nGreen\n\nA list item\
    \ value can similarly be changed using the index combined with the assignment\
    \ (`=`) operator. For example, to change the `Yellow` color to `Indigo`, the code\
    \ would read as follows:\n\n```cs\nConsole.WriteLine($\"Color before = {colorList[2]}\"\
    );\ncolorList[2] = \"Indigo\";\nConsole.WriteLine($\"Color after = {colorList[2]}\"\
    );\n```\n\nOutput:\nColor before = Yellow\nColor after = Indigo\n\nAs with arrays,\
    \ you can also construct a `foreach` loop to list all of the items in a list.\
    \ For example:\n\n```cs\nforeach (string color in colorList)\n{\n    Console.Write($\"\
    {color} \");\n}\n```\n\nOutput:\nRed Green Indigo Purple Orange\n\n## 27.7 Removing\
    \ items from lists\n\nItems may be removed from a list using the `Remove()` method.\
    \ This method takes the value of the item to be removed as an argument. For example,\
    \ to remove the `Orange` string from the `colorList` object, we could write the\
    \ following code:\n\n```cs\ncolorList.Remove(\"Orange\");\nforeach (string color\
    \ in colorList)\n{\n    Console.Write($\"{color} \");\n}\n```\n\nOutput:\nRed\
    \ Green Indigo Purple\n\nNote that C# lists can store duplicate entries. In the\
