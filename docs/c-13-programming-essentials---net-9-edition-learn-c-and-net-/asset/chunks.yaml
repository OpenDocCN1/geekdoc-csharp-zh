    ## 18.8 Summary


    Abstract classes are base classes that cannot be directly instantiated as objects.
    Instead, they provide a template that defines the requirements that subclasses
    must meet. The members of an abstract class can be declared abstract or virtual.
    Abstract members do not contain any implementation in the abstract class and must
    be overridden and implemented in derived classes. On the other hand, virtual members
    provide a fallback implementation within the abstract class to be used when the
    member is not overridden in subclasses.


    ## 19\. C# Interfaces


    In this chapter, we will explain C# interfaces, how to write your own, and how
    to make other classes comply with one.


    ## 19.1 Understanding C# interfaces


    By default, there are no specific rules to which a C# class must conform as long
    as the class is syntactically correct. In some situations, however, a class must
    meet specific criteria to work with other classes. This is particularly common
    when writing classes that need to work with other libraries. An interface is a
    set of rules that define the minimum requirements that a class must meet. An interface
    is declared using the interface keyword and defines the methods and properties
    that a class must contain to be in conformance. When a class adopts an interface
    but does not meet all the interface requirements, errors will be reported stating
    that the class fails to conform to the interface. Unlike abstract classes, an
    interface does not contain implementations of members.


    ## 19.2 Declaring an interface


    Interfaces are declared much like other classes except that we use interface keyword
    instead of class in the declaration. Consider the following interface declaration.
    Any classes that adopt this interface must include a method named DemoMethod(),
    which accepts no parameters and returns a string value:


    interface IDemoInterface


    {


        void DemoMethod();


    }


    Note that the convention is to prefix interface names with “I” to differentiate
    them from non-interface classes.


    Unlike abstract classes, an interface must not contain implementations of its
    members. The following, for example, is not a valid interface:


    interface IDemoInterface


    {


        void DemoMethod()


        {


            Console.WriteLine("Hello");


        }


    }


    The above code will generate the following syntax error:


    Error CS8701 Target runtime doesn''t support default interface implementation.


    To comply with the IDemoInterface interface, a class must include a DemoMethod()
    implementation matching the interface method signature. For example:


    public class DemoClass : IDemoInterface


    {


        public void DemoMethod()


        {


            // Code here


        }


    }


