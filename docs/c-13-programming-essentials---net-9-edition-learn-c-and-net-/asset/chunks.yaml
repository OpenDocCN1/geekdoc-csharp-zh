    work with dates and times. Recognizing this, the Microsoft engineers responsible
    for C# gave us the DateTime object. This chapter will look at using this object
    to work with dates and times in C# based applications. Topics covered include
    adding and subtracting time, getting the system date and time, and formatting
    and extracting elements of dates and times in C#.


    ## 32.1 Creating the DateTimeDemo project


    Launch VS Code, open your “C# Essentials” workspace folder, and create a new .NET
    Console App project named DateTimeDemo.


    After creating the project, open the Program.cs file and use it to try out the
    examples in the rest of this chapter.


    ## 32.2 Creating a C# DateTime object


    The first step in using the DateTime object when working with dates and times
    in C# is to create an object instance. You do this using the new keyword passing
    through year, month, and day values. For example, to create a DateTime object
    preset to April 9, 2024, you would write the following code:


    DateTime meetingAppt = new(2024, 4, 9);


    Console.WriteLine (meetingAppt.ToString());


    Output:


    4/9/2024 12:00:00 AM


    In the above example, after setting the date, we use the ToString() method of
    the DateTime object to output the current date and time value as a string.


    Note that if a time is not specified along with the date, the DateTime class constructor
    will set the time to 12:00 am.


    Time values are specified by passing through hours, minutes, and seconds values
    to the constructor. The following code, for example, sets the time property of
    a DateTime object to 14:30:00 using the same date as before:


    DateTime meetingAppt = new(2024, 4, 9, 14, 30, 0);


    Console.WriteLine (meetingAppt.ToString());


    Output:


    4/9/2024 2:30:00 PM


    ## 32.3 Getting the current system time and date


    The system date and time of the computer on which the C# code is executing may
    be accessed using the Today and Now static properties of the DateTime class. The
    Today property will return the current system date (and the time set to 12:00
    AM), while the Now property returns the current date and time. For example, the
    following code demonstrates these properties (keeping in mind that the server
    on which the code is executing may not be in your timezone):


    Console.WriteLine(DateTime.Today.ToString());


    Console.WriteLine(DateTime.Now.ToString());


    Output:


    8/16/2024 12:00:00 AM


    8/16/2024 10:32:37 AM


    ## 32.4 Adding to or subtracting from dates and times


    The C# DateTime object provides several methods for adding or subtracting dates
    and times from a DateTime object instance. These methods are outlined in the following
    table:


    | Method | Description |


    | Add | Adds/Subtracts the value of the specified TimeSpan object instance. |


    | AddDays | Adds/Subtracts the specified number of days. |


    | AddHours | Adds/Subtracts the specified number of hours. |


    | AddMilliseconds | Adds/Subtracts the specified number of Milliseconds. |


    | AddMinutes | Adds/Subtracts the specified number of minutes. |


    | AddMonths | Adds/Subtracts the specified number of months. |


    | AddSeconds | Adds/Subtracts the specified number of seconds. |


    | AddYears | Adds/Subtracts the specified number of years. |


    Table 32-1


    A vital issue to understand is that these methods do not change the value of the
    DateTime object on which the method is called but instead return a new DateTime
    object primed with the modified date and time. For example, add five days to our
    example as follows:


    DateTime meetingAppt = new(2024, 4, 9, 14, 30, 0);


    DateTime newAppt = meetingAppt.AddDays(5);


    Console.WriteLine(newAppt.ToString());


    Output:


    4/14/2024 2:30:00 PM


    To subtract from a date and time, pass through a negative value to the appropriate
    method. For example, we can subtract ten months from our example object as follows:


    DateTime meetingAppt = new(2024, 4, 9, 14, 30, 0);


    DateTime newAppt = meetingAppt.AddMonths(-10);


    Console.WriteLine(newAppt.ToString());


    Output:


    6/9/2023 2:30:00 PM


