    15.4 Creating the DelegateDemo project


    Launch VS Code, open your “C# Essentials” workspace folder, and create a new .NET
    Console App project named DelegateDemo.


    ## 15.5


    ### A C#


    ## delegate example


    In this example, we will create a delegate called StringConverter. Begin by editing
    the Program.cs file as follows:


    namespace DelegateDemo


    {


        internal class Program


        {


            delegate string StringConverter(string value);


            static string LowerCase(string value)


            {


                 Console.Write("Converting to lowercase > ");


                 return value.ToLower();


            }


            static string UpperCase(string value)


            {


                Console.Write("Converting to uppercase > ");


                return value.ToUpper();


            }


            static void Main(string[] args)


            {


            }


        }


    }


    The above changes declare a delegate named StringConverter that can be used to
    reference any method that accepts and returns a string value. Next, we declared
    two methods matching this signature, LowerCase() and UpperCase(). The next step
    is to add code the Main() method to use these delegates:


    static void Main(string[] args)


    {


    StringConverter converter1 = new(LowerCase);


        StringConverter converter2 = new(UpperCase);


        var lower = converter1("This is some TEXT");


        Console.WriteLine(lower);


        var upper = converter2("tHis IS sOmE TExt");


        Console.WriteLine(upper);


    }


    The Main() method creates two delegate instances, each referencing one of the
    two methods. These methods are then called via the delegates, and the resulting
    strings are displayed in the console:


    Converting to lowercase > this is some text


    Converting to uppercase > THIS IS SOME TEXT


    Since the delegate is a variable, a different method may be assigned at any time.


    In the above example, converter1 and converter2 are single cast delegates in that
    they reference only one method each. It is also possible to create multicast delegates.


    ## 15.6 Multicast delegates


    A multicast delegate contains more than one delegate, allowing it to reference
    multiple methods. Multicast delegates are created by combining existing delegates
    using the + operator.


    The following changes to our Main() method create a delegate named multicast comprising
    both converter1 and converter2:


    static void Main(string[] args)


    {


        StringConverter converter1 = new(LowerCase);


        StringConverter converter2 = new(UpperCase);


    StringConverter multicast = converter1 + converter2;


    var result = multicast("This is some TEXT");


        Console.WriteLine(result);


    }


    When the code is executed, we will see from the console output that both the LowerCase()
    and UpperCase() methods were called via the single multicast delegate call:


    Converting to lowercase > Converting to uppercase > THIS IS SOME TEXT


    Delegates can be removed from a multicast delegate using the ‘-’ operator. The
    following changes adapt the above example to remove converter2 from multicast
    after the first call:


    static void Main(string[] args)


    {


        StringConverter converter1 = new(LowerCase);


        StringConverter converter2 = new(UpperCase);


        StringConverter multicast = converter1 + converter2;


        var result = multicast("This is some TEXT");


        Console.WriteLine(result);


        multicast -= converter2;


        result = multicast("AfTeR reMovAL oF converter2");


        Console.WriteLine(result);


    }


    When the code executes, the first call to the delegate results in calls to the
    LowerCase() and UpperCase() methods. After the removal of converter2 from the
    multicast delegate, only LowerCase() is called.


    Converting to lowercase > Converting to uppercase > THIS IS SOME TEXT


    Converting to lowercase > after removal of converter2


    ## 15.7 Passing a delegate to a method


    C# delegates have some useful capabilities, one of which is the ability to be
    passed as arguments to other methods.


    If you need a method to accept a delegate as a parameter, declare the parameter
    type accordingly in the method signature. Suppose we need to write a method that
    takes as parameters an instance of our StringConverter delegate and a string to
    be converted. Such a method could be declared as follows:


    public static void DisplayText(StringConverter converter)


    {


        // Code to display text here


    }


    Make the following changes to fully implement the DisplayText() method and call
    it from the Main() method:


    namespace DelegateDemo


    {


        internal class Program


        {


            delegate string StringConverter(string value);


    .


    .


            static void DisplayText(StringConverter converter, string text)


            {


                string result = converter(text);


                Console.WriteLine($"Converted text = {result}");


            }


            static void Main(string[] args)


            {


                StringConverter converter1 = new(LowerCase);


                StringConverter converter2 = new(UpperCase);


    .


    .


    DisplayText(converter1, "This IS a teST.");


            }


        }


    }


    When the code executes, the following output will appear in the console indicating
    that the delegate was successfully passed to the DisplayText() method:


    Converting to lowercase > Converted text = this is a test.


