  trans: "\n面向对象的编程语言如 `C#` 促进了类的创建，以鼓励代码重用和数据封装。在本章中，我们涵盖了 `C#` 中类和实例的基本概念，并解释了类成员、构造函数、终结器、属性、字段和方法等概念。\n\
    \n# 14. C# 方法\n\n上一章开始介绍 `C#` 中的面向对象编程，并包含了在类内部声明的方法的使用。本章将更详细地探讨 `C#` 方法，包括如何声明和调用它们、传递参数以及返回结果。还将解释通过引用和值传递参数的主题。\n\
    \nC# 方法对于编写结构良好且高效的代码至关重要。它们提供了一种组织程序的方法，同时避免了代码重复。在本章中，我们将研究如何在 `C#` 中声明和使用方法。\n\
    \n## 14.1 什么是方法？\n\n方法是一个具命名的代码块，可以通过调用它来执行特定任务。它可以接收数据以执行该任务，并向结果返回给调用它的代码。例如，如果\
    \ `C#` 程序中需要执行特定的算术计算，可以将执行该算术的代码放置在方法中。该方法可以设置为接受要进行算术计算的值（称为参数）并返回计算结果。在程序代码中需要计算的任何点，都可以调用该方法并将值作为参数传递，然后返回结果。\n\
    \n## 14.2 方法与函数\n\n如果你熟悉其他编程语言，可能听过或使用过函数。通常情况下，函数的声明方式与方法相同，目的也相同。区别在于，方法必须在类内部声明，而函数则在类外部声明。在\
    \ `C#` 中，只能在类内部声明方法，不存在函数的概念。\n\n## 14.3 参数还是实参？\n\n在讨论方法时，`parameter`（参数）和 `argument`（参数）这两个术语通常互换使用。然而，它们之间存在细微的。方法在被调用时可以接收的值被称为\
    \ `parameters`（参数）。当方法被调用并传递这些值时，它们被称为 `arguments`（参数）。\n\n## 14.4 如何声明 C# 函数\n\
    \n`C#` 函数使用以下语法声明：\n\n```\n<access><return type=\"\"><method name=\"\">(<para\
    \ type=\"\">, <para name=\"\">, ...){\n    // 方法代码\n}\n```\n\n函数声明各个各个字段的解释如下：\n\
    \n- `<access>`：定义了从代码其他部分访问方法的访问级别。有效值为 `public`、`private` 或 `protected`，如上一章所解释的。\n\
    - `<return type>`：函数返回的结果的数据类型。如果函数不返回结果，则将其设置为 `void`。\n- `<method name>`：分配给方法的名称。这是在应用程序代码内部调用方法时引用该方法的名称。\n\
    - `<para type>`：对应 `parameter`（参数）的类型。\n- `<para name>`：在方法代码中引用该 `parameter`（参数）的名称。\n\
    - `Method code`：执行工作的方法代码语句。\n\n例如，以下方法不接受参数，不返回结果，并显示一条消息：\n\n```csharp\npublic\
    \ void sayHello() {\n    Console.WriteLine(\"Hello\");\n}\n```\n\n相反，下面的示例函数接受一个\
    \ `int` 和一个 `string` 作为参数，并返回一个字符串结果：\n\n```csharp\npublic string BuildMessage(string\
    \ name, int count) {\n    return($\"{name}, you are customer number {count}\"\
    );\n}\n```\n\n## 14.5 创建 MethodDemo 项目\n\n启动 VS Code，打开你的“C# Essentials”工作空间文件夹，并创建一个名为\
    \ `MethodDemo` 的新 .NET 控制台应用程序。\n\n## 14.6 声明 C# 类文件\n\n遵循“C# 面向对象编程简介”章节中的步骤，使用解决方案管理器（Solutions\
    \ Explorer）向 `MethodDemo` 项目添加一个名为 `Demo` 的新类文件。添加类文件后，按照如下方式对其进行修改以添加方法：\n\n\
    ```csharp\nusing System;\n\nnamespace MethodDemo;\n\npublic class Demo\n{\n  \
    \  public void SayHello()\n    {\n        Console.WriteLine(\"Hello\");\n    }\n\
    }\n```\n\n## 14.7 调用 C# 方法\n\n一旦声明，就可以使用点符号通过以下语法在类实例上调用 `C#` 方法：\n\n```\n<instance>.<function\
    \ name>(<arg1>, <arg2>, ... )\n```\n\n传递给方法的每个参数必须匹配方法配置为接受的参数。例如，要调用上述名为 `SayHello()`\
    \ 的不接受参数且不返回值的示例方法，我们需要如下所示修改 `Program.cs` 文件：\n\n```csharp\nusing MethodDemo;\n\
    \nDemo demo = new();\n\ndemo.SayHello();\n```\n\n当应用运行时，“Hello”消息将出现在终端中。\n\n\
    ## 14.8 处理返回值\n\n`SayHello()` 方法定义包含了 `void` 关键字，表示它不返回结果值。接下来，在 `Demo` 类中添加一个名为\
    \ `BuildMessage()` 的方法，它接受两个参数并返回字符串结果如下：\n\n```csharp\npublic class Demo\n{\n\
    \    public void SayHello()\n    {\n        Console.WriteLine(\"Hello\");\n  \
    \  }\n\n    public string BuildMessage(string name, int count)\n    {\n      \
    \  return($\"{name}, you are customer number {count}\");\n    }\n}\n```\n\n`SayHello()`\
    \ 方法定义包含了 `void` 关键字，表示它不返回结果值。接下来，在 `Demo` 类中添加一个名为 `BuildMessage()` 的方法，它接受两个参数并返回字符串结果如下：\n\
    \n```csharp\npublic class Demo\n{\n    public void SayHello()\n    {\n       \
    \ Console.WriteLine(\"Hello\");\n    }\n\n    public string BuildMessage(string\
    \ name, int count)\n    {\n        return $\"{name}, you are customer number {count}\"\
    ;\n    }\n}\n```\n（注：此处原文文本似乎有部分重复或截断，翻译时已根据逻辑进行了对齐）\n\n*纠正：由于原文在 14.8 之后出现了逻辑重复和截断，我将根据上下文逻辑提供完整的翻译流：*\n\
    \n（重新翻译 14.8 之后的部分以确保逻辑连贯）\n\n`SayHello()` 方法定义包含了 `void` 关键字，表示它不返回结果值。接下来，在\
    \ `Demo` 类中添加一个名为 `BuildMessage()` 的方法，它接受两个参数并返回字符串结果如下：\n\n```csharp\npublic\
    \ class Demo\n{\n    public void SayHello()\n    {\n        Console.WriteLine(\"\
    Hello\");\n    }\n\n    public string BuildMessage(string name, int count)\n \
    \   {\n        return $\"{name}, you are customer number {count}\";\n    }\n}\n\
    ```\n\n在上面的代码中，我们在返回值周围加上了括号如下：\n\n`return $\"{name}, you are customer number\
    \ {count}\";`\n\n这些括号是可选的，因此以下也是合法的返回语句：\n\n`return $\"{name}, you are customer\
    \ number {count}\";`\n\n返回 `Program.cs` 文件并添加代码来调用新方法：\n\n```csharp\nDemo demo\
    \ = new();\n\nstring message = demo.BuildMessage(\"Bill\", 10);\n\nConsole.WriteLine(message);\n\
    ```\n\n在上面的示例中，我们创建了一个名为 `message` 的变量并使用赋值运算符 (`=`) 存储方法的结果。当应用运行时，终端应出现以下输出：\n\
    \nHello Bill, you are customer number 10.\n\n## 14.9 向方法传递参数\n\n在调用期望参数的方法时有多种选择。一种方法如上面所示，是按照方法声明中的顺序传递参数：\n\
    \n```csharp\nstring message = demo.BuildMessage(\"Bill Gates\", 10);\n```\n\n\
    以这种方式调用方法时，必须按照参数在方法声明中的顺序传递。使用这种技术向方法传递参数也可能难以理解每个参数的用途。这两个问题都可以通过命名参数来解决。\n\n\
    ## 14.9.1 命名参数\n\n命名参数涉及在调用时引用方法声明中分配的参数名称。例如：\n\n`demo.BuildMessage(name: \"\
    Steve\", count: 30);`\n\n由于在使用命名参数时顺序不重要，以下也是合法的调用：\n\n`demo.BuildMessage(count:\
    \ 30, name: \"Steve\");`\n\n对 `Program.cs` 文件进行以下更改以查看命名参数的作用：\n\n```csharp\n\
    Demo demo = new();\n\nstring message = demo.BuildMessage(name: \"Bill\", count:\
    \ 10);\n\nConsole.WriteLine(message);\n\nmessage = demo.BuildMessage(count: 30,\
    \ name: \"Steve\");\n\nConsole.WriteLine(message);\n```\n\n正如上面的代码所示，在调用方法时，参数的顺序不再重要。理解传递给方法的每个参数的用途也变得更加容易。\n\
    \n## 14.9.2 可选参数\n\n"
