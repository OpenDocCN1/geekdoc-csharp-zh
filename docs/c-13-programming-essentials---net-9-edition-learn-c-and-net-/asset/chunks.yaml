    \n![](img/image-KRY5XAC2.jpg)\n\n## 24.12 总结\n\nC# 中的异步编程使用 `Task` 类和 `await`\
    \ 运算符来并行运行任务，提高性能和响应能力。`await` 运算符会挂起执行直到任务完成，允许其他代码并发运行。通过将同步方法转换为异步方法，可以同时执行多个任务，从而缩短整体执行时间。\n\
    \n要实现并发执行，请存储 `async` 方法返回的 `Task` 对象并在稍后等待其结果。异步任务的取消可以使用 `CancellationTokenSource`\
    \ 对象的 `Cancel()` 方法实现。在取消任务时，应该采取适当的步骤处理异常，以防止程序崩溃。\n\n## 25. 在 C# 中创建二维、三维数组和锯齿数组\n\
    \n数组并不是 C# 特有的。事实上，在 C# 引入之前，几乎每一种之前的编程语言和脚本语言都提供了对数组的支持。数组允许存储一组相同类型的值集合，并通过单个变量进行访问。数组变量中的每个项目都通过数组索引来访问。\n\
    \nC# 数组虽然很有用，但存在一些局限性。可能最重要的局限性是，一旦创建了数组，就无法增大或减小以容纳更多或更少的值。更动态灵活的集合存储能力将从“C#\
    \ List 集合”章节开始介绍。\n\n## 25.1 在 C# 中创建数组\n\nC# 数组可以通过几种不同的方式创建。一种方法是声明数组但不使用任何值对其初始化。其语法如下：\n\
    \n```cs\ntype[] arrayname;\n```\n\n在上面的示例中，`type` 代表要存储在数组中的数据类型（例如 `string`、`int`、`decimal`\
    \ 等）。方括号（`[]`）表示这是数组的声明，`arrayname` 是引用该数组的名称。\n\n例如，我们可以如下声明一个名为 `myColors` 的字符串数组：\n\
    \n```cs\nstring[] myColors;\n```\n\n在这个示例中，我们声明了数组但没有给它分配任何值。在声明数组后赋值，请使用以下语法：\n\
    \n```cs\nstring[] myColors;\nmyColors = [\"red\", \"green\", \"yellow\", \"orange\"\
    , \"blue\"];\n```\n\n数组也可以通过简单放置逗号分隔的列表来初始化：\n\n```cs\nstring[] myColors = [\"\
    red\", \"green\", \"yellow\", \"orange\", \"blue\"];\n```\n\n另一个选项是在创建数组时指定数组的大小：\n\
    \n```cs\nstring[] myColors = new string[5];\n```\n\n这将为 5 个字符串元素留留空间。\n\n## 25.2\
    \ 多维数组\n\n多维数组通过在方括号内放置逗号来声明。例如，声明一个二维数组：\n\n```cs\nchar[,] myarray;\n```\n\n\
    上述语法中的逗号（`,`）向 C# 表示这是一个二维数组。二维数组的初始化如下：\n\n```cs\nchar[,] myarray = {\n    {'a',\
    \ 'b', 'c'},\n    {'d', 'e'}\n};\n```\n\n这创建了一个具有行和列的多维数组。也可以在创建数组时指定数组的：\n\n\
    ```cs\nchar[,] myarray = new char[2, 3];\n```\n\n三维数组通过使用两个逗号来声明：\n\n```cs\nchar[,,]\
    \ myarray;\n```\n\n以下内容将初始化三维数组：\n\n```cs\nchar[,,] myarray = {\n    {\n     \
    \   {'a', 'b', 'c'},\n        {'d', 'e', 'f'}\n    },\n    {\n        {'g', 'h',\
    \ 'i'},\n        {'j', 'k', 'l'}\n    }\n};\n```\n\n三维数组本质上是一个每个元素都是二维数组的数组。在上面的声明中，该数组包含两个数组，每个数组包含三个元素。\n\
    \n也可以在声明数组时指定维度：\n\n```cs\nchar[,,] myarray = new char[2, 2, 3] {\n    {\n   \
    \     {'a', 'b', 'c'},\n        {'d', 'e', 'f'}\n    },\n    {\n        {'g',\
    \ 'h', 'i'},\n        {'j', 'k', 'l'}\n    }\n};\n```\n\n## 25.3 声明锯齿数组\n\n锯齿数组是一种每个元素本身也是数组的数组。在这种语境下使用“锯齿”一词是因为数组元素的长度可以不同。锯齿数组可以被认为是每个元素数量不同的二维数组。\n\
    \n以下是一个用于存储不同大小二维数组的锯齿数组声明示例：\n\n```cs\nchar[][] myJaggedArray;\n```\n\n以下代码声明并初始化相同的锯齿数组：\n\
    \n```cs\nchar[][] myJaggedArray = [\n    ['a', 'b', 'c', 'd', 'e'],\n    ['f',\
    \ 'g', 'h', 'i'],\n    ['j', 'j'],\n    ['k', 'l', 'm', 'n', 'o', 'p', 'q', 'r']\n\
    ];\n```\n"
- fmt: "\nC# arrays allow collections of values of the same type, with each item accessed\
    \ through an index. Multidimensional arrays are declared with commas within square\
    \ brackets, while jagged arrays are arrays of arrays with varying lengths.\n\n\
    # 26. Accessing and Sorting C# Array Elements\n\nThe previous chapter explained\
    \ how to create 2-dimensional, 3-dimensional, and jagged arrays in C#. In this\
    \ chapter, we will explore how to access, remove, and sort the elements of an\
    \ array.\n\n## 26.1 Creating the ArrayDemo Project\n\nLaunch VS Code, open your\
    \ “C# Essentials” workspace folder and create a new .NET Console App project named\
    \ `ArrayDemo`.\n\nOnce you have created the project, open the `Program.cs` file\
    \ and use it to try out the examples in the rest of this chapter.\n\n## 26.2 Getting\
    \ the number of dimensions of an array\n\nThe number of dimensions of an array\
    \ can be obtained via the `Rank` property of the array. For example:\n\n```csharp\n\
    char[,] my2Darray = new char[3,3]\n{\n    {'a', 'b', 'c'},\n    {'c', 'd', 'e'},\n\
    \    {'c', 'd', 'e'}\n};\n\nchar[,,] my3Darray = new char[2,2,3]\n{\n    {\n \
    \       { 'a', 'b', 'c' },\n        { 'c', 'd', 'e' }\n    },\n    {\n       \
    \ { 'f', 'g', 'h' },\n        { 'i', 'j', 'k' }\n    }\n};\n\nConsole.WriteLine($\"\
    Dimensions in my2Darray = {my2Darray.Rank}\");\nConsole.WriteLine($\"Dimensions\
    \ in my3Darray = {my3Darray.Rank}\");\n```\n\nOutput:\n```\nDimensions in my2Darray\
    \ = 2\nDimensions in my3Darray = 3\n```\n\n## 26.3 Accessing array elements\n\n\
    Once values have been stored in an array, it is highly likely that these values\
    \ will need to be accessed at some later point in the C# code. This is achieved\
    \ using the array accessor notation combined with the index into the array of\
    \ the desired value. The array accessor is simply the array name followed by square\
    \ brackets (`[]`). Within the square brackets is placed a number representing\
    \ the index into the array of the desired value (keeping in mind that the first\
    \ array element in C# is index 0). For example, to access the second element of\
    \ our `myColors` array, the following notation would be used:\n\n```csharp\nstring[]\
    \ myColors = {\"red\", \"green\", \"yellow\", \"orange\", \"blue\"};\nConsole.WriteLine($\"\
    Element at index 1 = {myColors[1]}\");\n```\n\nWhen executed, the above code will\
    \ output the word “green” since this is the string contained at index position\
    \ 1 in the array.\n\nSimilarly, the value at a particular index position in an\
    \ array may be changed using the accessor notation combined with the assignment\
    \ operator (`=`). For example, to change the value of the first item in the array:\n\
    \n```csharp\nstring[] myColors = [\"red\", \"green\", \"yellow\", \"orange\",\
    \ \"blue\"];\nmyColors[0] = \"violet\";\nConsole.WriteLine($\"Element at index\
    \ 0 = {myColors[0]}\");\n```\n\nValues in a multidimensional array may be accessed\
    \ by specifying the index values for each dimension separated by commas. For example,\
    \ to access the first element of the first array of our `my2Darray` the following\
    \ accessor would be used (keeping in mind that arrays start at index position\
    \ 0):\n\n```csharp\nchar element = my2Darray[0,0];\n```\n\nThe following code\
    \ demonstrates accessing a variety of elements, both in 2D and 3D arrays:\n\n\
    ```csharp\nchar[,] my2Darray = new char[3,3]\n{\n    {'a', 'b', 'c'},\n    {'d',\
    \ 'e', 'f'},\n    {'g', 'h', 'i'}\n};\n\nchar[,,] my3Darray =\n{\n    {\n    \
    \    { 'a', 'b', 'c' },\n        { 'd', 'e', 'f' }\n    },\n    {\n        { 'g',\
    \ 'h', 'i' },\n        { 'j', 'k', 'l' }\n    }\n};\n\n// Output first element\
    \ of first array in my2Darray\nConsole.WriteLine($\"{my2Darray[0,0]}\");\n// Output\
    \ last element of last array in my2Darray\nConsole.WriteLine($\"{my2Darray[2,2]}\"\
    );\n// Output 2nd element of 2nd array in 1st 2D array of my3Darray\nConsole.WriteLine($\"\
    {my3Darray[0,1,1]}\");\n// Output 3rd element of 2nd array in 2nd 2D array of\
    \ my3Darray\nConsole.WriteLine($\"{my3Darray[1,1,2]}\");\n```\n\nOutput:\n```\n\
    a\ni\ne\nl\n```\n\n## 26.4 Array iteration\n\nThe easiest way to iterate through\
    \ items in an array is to make use of `foreach` syntax. The following code, for\
    \ example, iterates through all of an array and outputs each item to the console:\n\
    \n```csharp\nstring[] myColors = [\"red\", \"green\", \"yellow\", \"orange\",\
    \ \"blue\"];\nforeach (string color in myColors)\n{\n    Console.Write(\"{0} \"\
    , color);\n}\n```\n\nOutput:\n```\nred green yellow orange blue\n```\n\nYou can\
    \ also use `foreach` statement to iterate through multidimensional arrays. In\
    \ the following example, we use `foreach` to iterate through all the elements\
    \ of a three-dimensional array:\n\n```csharp\nchar[,,] my3Darray =\n{\n    {\n\
    \        { 'a', 'b', 'c' },\n        { 'c', 'd', 'e' }\n    },\n    {\n      \
    \  { 'f', 'g', 'h' },\n        { 'i', 'j', 'k' }\n    }\n};\n\nforeach (char letter\
    \ in my3Darray)\n{\n    Console.Write(\"{0} \", letter);\n}\n```\n\nOutput:\n\
    ```\na b c d e f g h i j k\n```\n\n## 26.5 Working with ranges\n\nThe C# range\
    \ (`..`) and index from end (`^`) operators are particularly useful for accessing\
    \ subsets of array. Ranges are constructed using the following syntax where `x`\
    \ and `y` represent the beginning and end range, respectively: `x..y`.\n\nWhen\
    \ working with ranges, it is important to remember that syntax `x..y` encompasses\
    \ all the numbers from `x` up to, but not including, `y`. The range `5..8`, therefore,\
    \ specifies the positions 5, 6, and 7.\n\nIn the absence of start or end positions,\
    \ the range will include all possible values starting at 0 until the end of the\
    \ array is reached: `..`.\n\nOne-sided range operators specify a range that can\
    \ extend as far as possible in a specified direction until the natural beginning\
    \ or end of the range is reached (or until some other condition is met). A one-sided\
    \ range is declared by omitting the number from one side of the range, for example:\
    \ `x..` or `..y`.\n\nA range to specify two elements in an array starting with\
    \ position 2 through the last element could be declared as follows: `2..`. Similarly,\
    \ to specify a range that begins with the first element and ends with the element\
    \ at position 5, the range would be specified as follows: `..6`.\n\nThe following\
    \ example extracts items 4 through 6 and assigns them to a new array named `words`:\n\
    \n```csharp\nstring[] sentence = [\"The\", \"best\", \"way\", \"to\", \"predict\"\
    , \"the\", \"future\", \"is\", \"to\", \"it\"];\nstring[] words = sentence[4..7];\n\
    ```\n\nSimilarly, we can use the following range syntax to extract words starting\
    \ at element 0 and ending at element 4:\n\n```csharp\nstring[] words = sentence[..5];\n\
    ```\n\nWe can also combine the index operator with the range operator to perform\
    \ operations similar to the following which extracts elements starting at position\
    \ 1 up until the second from last element of the array:\n\n```csharp\nstring[]\
    \ words = sentence[1..^2];\n```\n\nTry the following code to see the above examples\
    \ in action:\n\n```csharp\nstring[] sentence = [\"The\", \"best\", \"way\", \"\
    to\", \"predict\", \"the\", \"future\", \"is\", \"to\", \"it\"];\nstring[] subset1\
    \ = sentence[^7..^4];\nstring[] subset2 = sentence[..^2];\nstring[] subset3 =\
    \ sentence[3..^3];\n\nforeach (string word in subset1)\n{\n    Console.Write(\"\
    {0} \", word);\n}\nConsole.WriteLine(\"\\n\");\nforeach (string word in subset2)\n\
    {\n    Console.Write(\"{0} \", word);\n}\nConsole.WriteLine(\"\\n\");\nforeach\
    \ (string word in subset3)\n{\n    Console.Write(\"{0} \", word);\n}\nConsole.WriteLine(\"\
    \\n\");\n```\n\nWhen the above code runs, it will generate the following output:\n\
    ```\npredict the future\nThe best way to predict the future is to\nto predict\
    \ the future is\n```\n\n## 26.6 C# index from end operator\n\nThe C# index from\
    \ end (`^`) operator allows you to specify the end of a range based on the number\
    \ of positions from the end of the array. The index `^1`, for example, represents\
    \ the last item in the array, `^2` the second from last item in the array, and\
    \ so on. Index `^0` is already set to the total number of items in the array:\n\
    \n```csharp\nstring[] myArray = {\n    \"item 1\", // <-- ^7 - 7th from last\n\
    \    \"item 2\", // <-- ^6\n    \"item 3\", // <-- ^5\n    \"item 4\", // <--\
    \ ^4\n    \"item 5\", // <-- ^3\n    \"item 6\", // <-- ^2\n    \"item 7\" //\
    \ <-- ^1 - Last item\n    // ^0 = array length\n};\n```\n\nThe following code\
    \ demonstrates the use of the index operator when working with ranges and arrays:\n"
