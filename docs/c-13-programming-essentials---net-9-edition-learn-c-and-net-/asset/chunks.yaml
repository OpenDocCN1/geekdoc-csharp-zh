    to access the current date and time using the `Today` and `Now` properties. Additionally,
    we explored the various methods provided by the `DateTime` object for manipulating
    dates and times, such as adding or subtracting days, months, years, and other
    time units. Finally, we covered how to extract individual components like the
    day, month, year, hour, and minute using `DateTime` properties, which allows for
    working with specific elements of dates and times.


