    ## 4.2 Downloading Visual Studio Code


    The first step in installing Visual Studio Code (often abbreviated to `VS Code`)
    is downloading it. Downloads for Windows, macOS, and Linux are available from
    the following web page:


    [https://code.visualstudio.com/Download](https://code.visualstudio.com/Download)


    ## 4.3 Installing on Windows


    Visual Studio Code for Windows is available for Arm and Intel-based systems. Once
    you have downloaded the installer, launch it and follow the setup wizard to complete
    the installation. You can use the default settings unless you have specific installation
    requirements.


    ## 4.4 Installing on macOS


    Visual Studio Code is available for Apple Silicon and Intel-based systems and
    is provided as a ZIP archive file containing versions for both processor types.
    Once you have downloaded the file, double-click on it to extract the Visual Studio
    Code package, then open a second Finder window and drag the package to your Applications
    folder. For convenience, take this opportunity to drag Visual Studio Code to the
    Dock as shown in Figure 4-4 below:


    ![](images/image-LEPAITPN.png)


    Figure 4-4


    ## 4.5 Installing on Linux


    VS Code installation packages are available for several Linux distributions including
    Debian, Ubuntu, SUSE, and most Red Hat Linux-based platforms with support for
    x64, Arm32, and Arm64 processor architectures.


    The steps to install VS Code will depend on which distribution you are running
    as outlined below:


    ### 4.5.1 Debian/Ubuntu


    VS Code for Debian and Ubuntu is provided as a .deb package. To complete the installation,
    open a Terminal window, change directory to the location of the downloaded package,
    and run the following command (where `<filename>.deb` is the name of the package
    file):


    ```bash

    $ sudo dpkg -i <filename>.deb

    ```


    ### 4.5.2 Red Hat-based distributions


    Visual Code is installed on Red Hat-based systems including RHEL, CentOS, Fedora,
    AlmaLinux, and Rocky Linux using a Red Hat Package Manager (.rpm) file. To install
    VS Code, open a terminal window, change directory to the location of the downloaded
    package, and run the following command (where `<filename>.rpm` is the name of
    the package file):


    ```bash

    $ sudo rpm -ihv <filename>.rpm

    ```


    After the installation completes, VS Code may be launched either by searching
    for the app in the desktop environment or via the command line by running the
    `code` executable.


    ## 4.6 Customizing Visual Studio Code


    When VS Code runs for the first time, the screen shown in Figure 4-5 will appear.
    By default, the user interface will use the Dark Modern theme. If you prefer a
    different theme, make a selection from the option marked A below, or click the
    Browse Color Themes button (B) to browse the entire list:


    ![](images/image-FAGNZRHN.png)


    Figure 4-5


    ## 4.7 Adding the C# Dev Kit extension


    The extension for C# development is the C# Dev Kit, and we will need to install
    it before we start writing code. To install the extension, click on the Extensions
    button located in the sidebar (marked A in Figure 4-6 below), then enter “C# Dev
    Kit” into the search field (B). Locate the C# Dev Kit entry in the extensions
    list and click the Install button (C) to add the extension:


    ![](images/image-629NUXQA.png)


    Figure 4-6


    Another helpful extension when programming in C# is IntelliCode for C# Dev Kit.
    This extension uses AI to offer code completion suggestions as you type into the
    editor and is a valuable tool for increasing productivity and identifying ways
    to improve your code. Click the Install button marked D to add IntelliCode support
    to your VS Code configuration.


    With the above steps completed, Visual Studio Code is installed and configured,
    and you are ready to start programming in C#.


    ## 4.8 Take the knowledge test


    Click the link below or scan the QR code to test your knowledge and understanding
    of Visual Studio Code installation:


    [https://www.answertopia.com/iyjz](https://www.answertopia.com/iyjz)


    ![](images/image-A852O5DS.jpg)


    ## 4.9 Summary


    Visual Studio Code is a free code editing environment available for Windows, macOS,
    and Linux that, when combined with the C# Dev Kit extension, provides everything
    you need to learn C#. To install Visual Studio Code, download it from the official
    website and follow the installation instructions for your operating system. After
    installing Visual Studio Code, install the .NET SDK and the C# Dev Kit extension
    to enable C# development.


    ## 5. A Guided Tour of Visual Studio Code


    Now that we have installed VS Code, we must learn how to use it before we start
    writing C# code. In this chapter, we will take a guided tour of VS Code and cover
    the basics of using its key features. While an in-depth overview of every aspect
    of VS Code is beyond the scope of this chapter, the aim is to provide the skills
    needed to begin editing C# code with confidence.


    ## 5.1 Workspaces, projects, and solutions


    When you start using VS Code, the first thing you will do is create a workspace.
    A workspace is a folder that contains one or more other folders. When you open
    a workspace, you will also open its subfolders. The terms `workspace` and `folder`
    are used interchangeably in the documentation and the menus within VS Code. For
    example, when you select the “Open Folder” option in VS Code, you are opening
    a workspace.


    When working with C# and .NET in VS Code, each workspace subfolder generally contains
    a project. Each project represents a separate app, library, or service you are
    developing and contains all the source code and configuration settings to build
    it.


    When you create your first C# project in VS Code, you will be asked to create
    or select a folder to contain the project. The folder you choose will be the workspace
    in which the project resides.


    In addition to the new project and workspace, VS Code will also create a solution
    file. The solution file references all of the projects within the workspace. Within
    VS Code, you will use the Solution Explorer to manage the projects in your workspace
    and perform tasks such as adding new classes or folders.


    ## 5.2 The VS Code main window


    Once you have created your first project, you will need to familiarize yourself
    with various elements that make up the VS Code user interface. Figure 5-1 shows
    a VS Code session with an open workspace containing multiple projects. The key
    areas of the main window are as follows:


    A - Activity Bar - The activity bar contains buttons to display the primary sidebar,
    search project files, connect to Git source repositories, run and debug code,
    browse and install extensions, and run tests. Options are also available to log
    into your Microsoft account and access settings.


    B - Primary Sidebar - The primary sidebar is divided into three sections. The
    top section is the Explorer view, which lists all folders and files within the
    current workspace. Selecting a file from the list loads it into the editor (F).


    C - Outline - The outline section of the primary sidebar displays the hierarchical
    structure of the currently selected source file, including symbols, classes, methods,
    and properties.


    D - Timeline - The primary sidebar timeline panel lists recently performed activities
    such as saving, creating, or deleting project files.


    E - Solution Explorer - This panel lists the files and folders referenced in the
    current solution file and allows tasks such as creating new classes to be performed.


    F - Editor - The editor is where you will write and edit C# code. VS Code supports
    side-by-side and split editing modes where multiple files are open and visible
    simultaneously. Floating editor windows can also be detached from the main window.

