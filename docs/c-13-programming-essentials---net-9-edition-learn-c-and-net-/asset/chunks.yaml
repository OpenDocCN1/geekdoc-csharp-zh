    Next, modify the asynchronous calls to use the await operator as shown below:


    static async Task Main(string[] args)


    {


        Stopwatch stopwatch = Stopwatch.StartNew();


        Console.WriteLine("\n=== Before async task calls ===\n");


    string filename1 = await ProcessFileAsync("file1.txt");


        Console.WriteLine($"End {filename1} at {DateTime.Now}\n");


    string filename2 = await ProcessFileAsync("file2.txt");


        Console.WriteLine($"End {filename2} at {DateTime.Now}\n");


    string filename3 = await ProcessFileAsync("file3.txt");


        Console.WriteLine($"End {filename3} at {DateTime.Now}");


        Console.WriteLine("\n=== After async tasks calls ===\n");


        stopwatch.Stop();


        TimeSpan timeSpan = stopwatch.Elapsed;


        Console.WriteLine($"Elapsed time: {timeSpan.Seconds} seconds\n");


    }


    Once the modifications are complete, run the app and check the console output,
    which resembles the following:


    === Before async task calls ===


    Start file1.txt at 9/25/2024 9:53:46 AM


    End file1.txt at 9/25/2024 9:53:52 AM


    Start file2.txt at 9/25/2024 9:53:52 AM


    End file2.txt at 9/25/2024 9:53:58 AM


    Start file3.txt at 9/25/2024 9:53:58 AM


    End file3.txt at 9/25/2024 9:54:04 AM


    === After async tasks calls ===


    Elapsed time: 18 seconds


    Although we have made the file processing method asynchronous and used the await
    operator, the console output shows that the tasks are still being performed sequentially.
    By assigning the result from the await operation directly to the string variables
    we have committed ourselves to waiting until the result is returned, thereby forcing
    the code to execute synchronously.


    To resolve this, we need to implement the following execution flow:


    1\. App launches.


    2\. Main() calls async methods.


    3\. Main() continues to execute while async tasks run in the background.


    4\. After completing other work, Main() suspends while awaiting results from async
    tasks.


    5\. Async tasks complete and return results.


    6\. Main() resumes execution.


    The challenge is to obtain references to the async tasks that can be used later
    to await the results. We achieve this by storing the Task objects returned by
    the async methods and using them later in the code to await the results. To see
    this in action, make the following changes to the Main() method:


    static async Task Main(string[] args)


    {


        Stopwatch stopwatch = Stopwatch.StartNew();


        Console.WriteLine("\n=== Before async task calls ===\n");


        Task <string>task1 = ProcessFileAsync("file1.txt");</string>


        Task <string>task2 = ProcessFileAsync("file2.txt");</string>


        Task <string>task3 = ProcessFileAsync("file3.txt");</string>


        Console.WriteLine("=== After async tasks calls ===\n");


        string filename1 = await task1;


        Console.WriteLine($"End {filename1} at {DateTime.Now}");


        string filename2 = await task2;


        Console.WriteLine($"End {filename2} at {DateTime.Now}");


        string filename3 = await task3;


        Console.WriteLine($"End {filename3} at {DateTime.Now}\n");


        stopwatch.Stop();


        TimeSpan timeSpan = stopwatch.Elapsed;


        Console.WriteLine($"Elapsed time: {timeSpan.Seconds} seconds");


    }


    Rerun the app and check the console output:


    === Before async task calls ===


    Start file1.txt at 9/25/2024 1:59:16 PM


    Start file2.txt at 9/25/2024 1:59:16 PM


    Start file3.txt at 9/25/2024 1:59:16 PM


    === After async tasks calls ===


    End file1.txt at 9/25/2024 1:59:22 PM


    End file2.txt at 9/25/2024 1:59:22 PM


    End file3.txt at 9/25/2024 1:59:22 PM


    Elapsed time: 6 seconds


    The first point to note from the above output is that the total execution time
    has dropped to 6 seconds from the previous 18 seconds because the three async
    tasks were executed concurrently. In addition, the “After async tasks calls” message
    appears before the async tasks have been completed, allowing Main() to perform
    other work before waiting for the task results.


    As an alternative to waiting for each task to complete individually, we can pass
    them to the Task.WaitAll() method and obtain the return values via the Result
    property of the respective Task objects:


    static async Task Main(string[] args)


    {


    .


    .


        Console.WriteLine("\n=== After async tasks calls ===\n");


    Task.WaitAll(task1, task2, task3);


        Console.WriteLine($"End {task1.Result} at {DateTime.Now}");


        Console.WriteLine($"End {task2.Result} at {DateTime.Now}");


        Console.WriteLine($"End {task3.Result} at {DateTime.Now}");


    .


    .


    }


    ## 24.9 Asynchronous calls from synchronous functions


    As previously mentioned, async methods are expected to be called from within an
    asynchronous context. It is, however, possible to start async tasks from within
    a synchronous context by calling the Task.Run() method. Suppose we have a synchronous
    method named SyncMethod() from which we need to call an async method and attempt
    to do so as follows:


    private static void SyncMethod()


    {


        await AsyncMethod();


    }


    The above code will result in the following error notification in the code editor:


    The ''await'' operator can only be used within an async method. Consider marking
    this method with the ''async'' modifier and changing its return type to ''Task''.


    The only options we have are to make SyncMethod() an async method or start the
    task using the Task.Run() method. Assuming that declaring SyncMethod() as an async
    method is not a viable option, in this case, the code will need to be changed
    as follows:


    private static void SyncMethod()


    {


    Task.Run(async () => {


            await AsyncMethod();


    });


    }


    ## 24.10 Canceling asynchronous tasks


    Active asynchronous tasks can be canceled at any time using the CancellationTokenSource
    class. A CancellationTokenSource instance contains a unique CancellationToken
    object that is used to send cancellation requests to running tasks. To add cancellation
    support to the AsyncDemo project, begin with the following changes to the Main()
    method:


    static async Task Main(string[] args)


    {


        var tokenSource = new CancellationTokenSource();


        var cancellationToken = tokenSource.Token;


    .


    .


    Now that we have a cancellation token, some changes need to be made to the ProcessFileAsync()
    method so that it can be passed to the Task that performs the 6-second delay:


    private static async Task <string>ProcessFileAsync(string filename,</string>


                                      CancellationToken cancellationToken)


    {


        Console.WriteLine($"Start {filename} at {DateTime.Now}");


        await Task.Delay(6000, cancellationToken);


        return filename;


    }


    Before we can add code to send a cancellation request, some additional steps are
    required. As currently written, the app will crash when the task is canceled with
    console output that will read in part:


    Unhandled exception. System.AggregateException: One or more errors occurred. (A
    task was canceled.)


     ---> System.Threading.Tasks.TaskCanceledException: A task was canceled.


       at System.Threading.Tasks.Task.GetExceptions(Boolean includeTaskCanceledExceptions)


    The problem here is that when a task is canceled it triggers an exception which,
    if not handled correctly by the app, will result in a crash. The solution to this
    is to configure the token to throw an OperationCanceledException error when the
    task is canceled, and then use a try-catch statement to gracefully handle the
    exception:


    private static async Task <string>ProcessFileAsync(string filename, CancellationToken
    cancellationToken)</string>


