  trans: "\n与 `for` 循环一样，也可以使用 `break` 语句随时退出 `while` 或 `do ... while` 循环。当执行路径遇到\
    \ `while` 语句时，循环将停止，执行将继续到紧随循环后的代码。在接下来的示例中，循环被设置为当 `i` 的值匹配 `j` 的值时退出：\n\n```sharp\n\
    int i = 0;\n\nint j = 5;\n\nwhile (i < 100)\n{\n    i++;\n    Console.WriteLine($\"\
    i = {i}\");\n    if (i == j)\n        break;\n}\n```\n\n与跳出 `for` 循环一样，必须注意的是，在嵌套的\
    \ `while` 和 `do ... while` 循环情况下，`while` 语句只会退出当前循环，让外层循环继续执行（并且极可能再次执行内层循环）。\n\
    \n## 12.4 `continue` 语句\n\n`continue` 语句会跳过循环中剩余的所有代码语句，并将执行返回到循环顶部。\n\n在接下来的示例中，只有当变量\
    \ `i` 的值为偶数时（即能被 2 整除且无余数），才会调用 `WriteLine()` 方法：\n\n```sharp\nint i = 1;\n\n\
    while (i < 20) {\n    i++;\n    if ((i % 2) != 0)\n        continue;\n    Console.WriteLine(\"\
    i = \" + i);\n}\n```\n\n上述示例中的 `continue` 语句除非 `i` 的值能被 2 无余整除，否则将跳过 `WriteLine()`\
    \ 调用。如果触发了 `continue` 语句，执行将跳转到 `while` 循环顶部，循环体中的语句将重复（直到 `i` 的值超过 19）。\n\n##\
    \ 12.5 知识测试\n\n点击下方链接或扫描二维码以测试你对 C# `do-while` 循环的知识和理解：\n\n[`www.answertopia.com/t2ji`](https://www.answertopia.com/t2ji)\n\
    \n![](img/image-OJBJDMFY.jpg)\n\n## 12.6 总结\n\nC# 的 `do` 和 `while` 语句是多功能工具，用于重复执行某项任务直到满足特定条件，例如算术运算达到预期结果或数据到达网络端口。当独立使用时，`while`\
    \ 循环在执行第一次循环迭代之前会检查条件是否已满足，从而允许完全跳过循环。另一方面，`do ... while` 循环在你知道在满足完成标准之前至少需要执行一次循环代码时非常有帮助。这两种循环都支持\
    \ `break` 和 `continue` 语句。\n\n## 13. C# 面向对象编程简介\n\n到课程为止，我们已经学习了 C# 编程的基础知识，例如变量类型和控制流。虽然使用这些技术编写功能性程序是可能的，但要成为一名精通的\
    \ C# 程序员还有很多工作要做。C# 首先是一种面向对象的编程语言，因此，任何 C# 程序员都被期望使用这种语言创建面向对象的应用程序。\n\nC# 为开发面向对象的应用程序提供了广泛支持。本章将介绍涉及面向对象编程的基本概念，然后解释与使用\
    \ C# 进行应用程序开发相关的概念。\n\n## 13.1 什么是对象？\n\n对象是一个自包含的功能模块，可以作为软件应用程序的构建块被易使用和重用。\n\
    \n对象由数据变量（属性）和函数（方法）组成，可以在对象上进行访问和调用以执行任务。这些被统称为成员。\n\n## 13.2 什么是类？\n\n类就像蓝图或建筑师的图纸，描述了对象在创建时的样子。它定义了对象将拥有的方法和将包含的变量。本质上，类决定了对象的属性和行为。\n\
    \n## 13.3 创建 ObjectDemo 项目\n\n启动 VS Code，并打开你的“C# Essentials”工作区文件夹。按下 `Cmd-Shift-P`\
    \ 显示命令面板并选择 `.NET: New Project...` 命令，如下所示：\n\n![](img/image-XUZJO9EB.png)\n\n\
    图 13-1\n\n从模板列表中选择 `Console App` 选项，在提示时将项目命名为 `ObjectDemo`，然后按 `Enter` 键确认选择：\n\
    \n![](img/image-NI13RAGJ.png)\n\n图 13-2\n\n接受默认的工作区文件夹，以及创建新项目的选项：\n\n![](img/image-0CPU1ABO.png)\n\
    \n图 13-3\n\n从操作栏中选择 `Explorer` 选项（在下方图 13-4 中标记为 A），并确认 `ObjectDemo` 项目现在列在工作区文件夹中\
    \ (B)：\n\n![](img/image-R4Z29Z9K.png)\n\n图 13-4\n\n## 13.4 声明 C# 类\n\n在实例化对象之前，我们首先需要为对象定义类蓝图。在本章中，我们将创建一个\
    \ `Bank Account` 类来演示 C# 面向对象编程的概念。第一步是使用解决方案管理器（Solution Explorer）向我们的项目添加一个新的类文件。解决方案管理器位于资源管理器的底部，如图\
    \ 13-5 所示：\n\n![](img/image-RYAR6DW.png)\n\n图 13-5\n\n在解决方案管理器中，将鼠标指针悬停在 `ObjectDemo`\
    \ 条目上以显示文件文件夹按钮：\n\n![](img/image-YCW7Z4.png)\n\n图 13-6\n\n点击 `New File...` 按钮将显示调面板，如图\
    \ 13-7 所示：\n\n![](img/image-3CN0NA.png)\n\n图 13-7\n\n选择 `Class` 选项，并在按下 `Enter`\
    \ 创建文件将类命名为 `BankAccount`。新文件将自动加载到编辑器，内容如下：\n\n```csharp\nusing System;\n\nnamespace\
    \ ObjectDemo;\n\npublic class BankAccount\n{\n\n}\n```\n\n## 13.5 访问修饰符\n\n当 VS\
    \ Code 生成我们的 `BankAccount` 类时，它是使用 `public` 访问修饰符声明的。访问修饰符控制是否可以在其他地方访问，并适用于多种类型，包括类、方法、属性和字段。C#\
    \ 支持以下访问修饰符：\n\n- `public`：无访问限制。\n- `protected`：仅对类及其派生类可用。\n- `private`：仅对包含类内部可用。\n\
    - `file`：仅对包含源文件可用。\n- `internal`：仅对当前程序集（通常是编译该类的可执行文件或库）中的代码可用。\n- `protected\
    \ internal`：对当前程序集中的代码或类的派生类可用。\n- `private protected`：仅对包含类或当前程序集内的派生类可用。\n\n\
    ## 13.6 创建 C# 类成员\n\n类成员、字段或属性上是嵌入类中的变量和方法（方法的概念在本章稍后讨论）。成员可以是 `public`、`private`\
    \ 或 `protected`。\n\n`public` 成员可以从对象外部访问并在派生类中可见。`private` 成员仅可由类内部的方法访问，对派生类不可见。`protected`\
    \ 类仅对派生类可用。\n\n这是数据封装的关键。面向对象的编程规定数据应该封装在类中，并通过类的方法（通常称为 getter 和 setter）进行访问和设置。\n\
    \n## 13.7 字段与属性\n\n直接声明为变量的类成员被称为字段。例如，在下面的类中，`firstname` 变量被声明为字段：\n\n```csharp\n\
    public class MyClass {\n    public string firstname = \"\"; // 这是一个字段\n}\n```\n"
- fmt: "\nObject-oriented programming guidelines, however, suggest that fields should\
    \ generally be protected from direct access (known as private fields). In C#,\
    \ this is achieved by declaring a property, which, in turn, provides access to\
    \ the underlying private field.\n\nA property is provided with a name and declares\
    \ special `get` and `set` methods (referred to as accessor methods), which are\
    \ used to provide access to the underlying field using the following syntax:\n\
    \n```csharp\npublic string <property name=\"\">{</property>\n    get {\n     \
    \   return <field name=\"\">;</field>\n    }\n    set {\n        <field name=\"\
    \">= value;</field>\n    }\n}\n```\n\nThe code of the `get` method returns the\
    \ value assigned to the field. The `set` method, on the other hand, is passed\
    \ a variable named `value` that can be assigned to the field.\n\nUsing this approach,\
    \ we can now implement a property to encapsulate our `firstname` field:\n\n```csharp\n\
    public class MyClass\n{\n    private string _firstname = \"\";\n    public string\
    \ FirstName {\n        get {\n            return _firstname;\n        }\n    \
    \    set {\n            _firstname = value;\n        }\n    }\n}\n```\n\nWhen\
    \ a field is associated with a property, the field should be declared as being\
    \ private, and the name is generally prefixed with an underscore (`_`).\n\nA more\
    \ concise approach to declaring accessors is to use the lambda operator (`=>`)\
    \ to assign get and set expressions (the topic of Lambdas will be covered in the\
    \ “C# Anonymous Methods, Lambdas, and Local Functions” chapter):\n\n```csharp\n\
    public string <property name=\"\">{</property>\n    get => <field name=\"\">;</field>\n\
    \    set => <field name=\"\">= value;</field>\n}\n```\n\nUsing the above approach,\
    \ we can simplify our `MyClass` example as follows:\n\n```csharp\npublic class\
    \ MyClass\n{\n    private string _firstname = \"\";\n    public string FirstName\
    \ {\n        get => _firstname;\n        set => _firstname = value;\n    }\n}\n\
    ```\n\nWhether or not to encapsulate all fields within properties and have no\
    \ public fields is a matter of personal preference in terms of how rigidly you\
    \ want to adhere to object-oriented programming conventions. You will see examples\
    \ of both approaches even in Microsoft’s C# reference documents. For the sake\
    \ of brevity, we will use public fields in many examples in this book.\n\n## 13.8\
    \ Adding members to the BankAccount class\n\nWe can now extend our `BankAccount`\
    \ class to add fields to hold the account name and number. True to the concept\
    \ of data encapsulation, we will be making these fields private and using properties\
    \ to provide access:\n\n```csharp\nnamespace ObjectDemo;\n\npublic class BankAccount\n\
    {\n    private string _accountName = \"\";\n    private int _accountNumber = 0;\n\
    \    public string AccountName\n    {\n        get => _accountName;\n        set\
    \ => _accountName = value;\n    }\n    public int AccountNumber\n    {\n     \
    \   get => _accountNumber;\n        set => _accountNumber = value;\n    }\n}\n\
    ```\n\nWith some fields and properties added to our class, we need to briefly\
    \ examine a few additional data member types and learn how to create object instances\
    \ from the class.\n\n## 13.9 Static, read-only, and const data members\n\nIn addition\
    \ to the data member types we have looked at so far, C# also supports several\
    \ additional member types.\n\nC# static member types (also called class properties)\
    \ store data values common to all object instances of the class. For example,\
    \ all bank customers would earn the same interest rate on a savings account. Therefore,\
    \ an `interestRate` member would be declared static since it is shared across\
    \ all object instances of the class. Static members are declared using the `static`\
    \ keyword. For example:\n\n```csharp\npublic class BankAccount\n{\n    private\
    \ static int interestRate;\n}\n```\n\nStatic members are accessed through the\
    \ class, not through the object. For example, we would change the `interestRate`\
    \ member for all object instances by referencing the `BankAccount` class as follows:\n\
    \n`BankAccount.interestRate = 10;`\n\nFor data members that must not be modified\
    \ the `const` and `readonly` keywords are used.\n\n## 13.10 Instantiating an object\
    \ from the class\n\nNow that we know how to write a class, we need to know how\
    \ to create objects from it. Creating an object from the class is called instantiation.\
    \ The first step is to create an instance using the `new` keyword:\n\n```csharp\n\
    BankAccount accountAccount = new BankAccount();\n```\n\nAlternatively, it is possible\
    \ to declare the object and initialize it in a single statement:\n\n```csharp\n\
    BankAccount accountAccount = new BankAccount();\n```\n\nIt is also possible to\
    \ declare the object variable and assign its values as follows:\n\n```csharp\n\
    using ObjectDemo;\nBankAccount accountAccount = new BankAccount();\naccountAccount.AccountName\
    \ = \"John Smith\";\naccountAccount.AccountNumber = 53211;\n\nConsole.WriteLine($\"\
    Customer Name is {accountAccount.AccountName}\");\nConsole.WriteLine($\"Account\
    \ Number = {accountAccount.AccountNumber}\");\n```\n\nWhen properties are initialized\
    \ immediately after object creation, the code can be simplified as follows using\
    \ an object initializer:\n\n```csharp\nBankAccount accountAccount = new()\n{\n\
    \    AccountName = \"John Smith\",\n    AccountNumber = 53211\n};\n```\n\n## 13.11\
    \ Accessing object members\n\nNow that we have an instance of the `BankAccount`\
    \ class, we need to know how to access its members. First, you will recall that\
    \ we declared some members as public and others as private. The public members\
    \ are fully accessible from outside the object using what is called dot notation.\n\
    \nDot notation is a mechanism by which object members may be accessed by specifying\
    \ the object and member names separated by a dot (`.`). For example, to access\
    \ the `accountName` member of an object named `accountAccount` we would use `accountAccount.AccountName`.\n\
    \nModify the `Program.cs` file as follows to access the public properties of the\
    \ `BankAccount` class:\n\n```csharp\nBankAccount accountAccount = new();\naccountAccount.AccountName\
    \ = \"John Smith\";\naccountAccount.AccountNumber = 53211;\n\nConsole.WriteLine($\"\
    Customer Name is {accountAccount.AccountName}\");\nConsole.WriteLine($\"Account\
    \ Number = {accountAccount.AccountNumber}\");\n```\n\nRun the app and check that\
    \ the output reads as follows:\n\n```\nCustomer Name is John Smith\nAccount Number\
    \ = 53211\n```\n\n## 13.12 Adding methods to a C# class\n\nClass methods are essentially\
    \ code routines that can be called to perform specific tasks within the class’s\
    \ context. Methods come in two forms: static methods (also called class methods)\
    \ and instance methods. Static methods operate at the class level, such as creating\
    \ a new class instance. On the other hand, instance methods operate only on the\
    \ instances of a class (for example, performing an arithmetic operation on two\
    \ member variables and returning the result).\n\nInstance methods are declared\
    \ within the opening and closing braces of the class to which they belong and\
    \ are declared using the standard C# method declaration syntax. Static methods\
    \ are declared like instance methods, except that the `static` keyword precedes\
    \ the declaration.\n\nFor example, edit the `BankAccount` class and add a method\
    \ to display the customer’s name as follows:\n\n```csharp\npublic class BankAccount\n\
    {\n    // ... existing fields and properties ...\n    public void DisplayName()\n\
    \    {\n        Console.WriteLine(AccountName);\n    }\n}\n```\n"
