    ## 26.10 Summary


    This chapter explored accessing, removing, and sorting elements in C# arrays.
    It demonstrated how to use the Rank property to determine the number of dimensions,
    the array accessor notation to access elements, and the foreach loop to iterate
    through arrays. Additionally, it covers using ranges and the index from end operator
    to extract subsets of elements, and the Array.Sort(), Array.Reverse(), and Array.Clear()
    methods to sort, reverse, and clear arrays, respectively.


    ## 27\. C# List Collections


    In the previous chapters, we looked at C# Arrays. While useful for many tasks,
    arrays are starting to show their age in terms of functionality and flexibility.
    The C# Collection Classes provide more advanced mechanisms for gathering groups
    of objects.


    ## 27.1 Creating the CollectionDemo Project


    Launch VS Code, open your “C# Essentials” workspace folder and create a new .NET
    Console App project named CollectionDemo.


    Once you have created the project, open the Program.cs file and use it to try
    out the examples in the rest of this chapter.


    ## 27.2 Introducing the C# Collection Classes


    The C# Collection classes are designed specifically for grouping objects and performing
    tasks on them. Several collection classes are available with C#, and we will look
    at some key classes in the next few chapters.


    ## 27.3 Creating C# list collections with List


    The List <t>class has properties very similar to C# arrays. One key advantage
    of this class over arrays is that it can grow and shrink as the number of stored
    objects changes.</t>


    The syntax for creating a List <t>collection is as follows where type is replaced
    by the data type to be stored in the list:</t>


    List <type>name = new List<type>();</type></type>


    Alternatively, the above syntax may be simplified as follows:


    List <type>name = [];</type>


    With the above syntax in mind, we could create an empty List <t>object named colorList
    configured to store string values using either of the following statements:</t>


    List <string>colorList = new List<string>();</string></string>


    List <string>colorList = [];</string>


    ## 27.4 Adding items to lists


    Once you have created a List object instance, there are several methods you can
    call to perform tasks on the list. One such method is the Add() method which,
    as the name suggests, is used to add items to the list object:


    List <string>colorList = [];</string>


    colorList.Add ("Red");


    colorList.Add ("Green");


    colorList.Add ("Yellow");


    colorList.Add ("Purple");


    colorList.Add ("Orange");


    The Add() method appends the new item to the end of the list. To insert new items
    at a specific index location, you will need to use the Insert() method covered
    later in the chapter.


    ## 27.5 Initializing a list with multiple values


    In the above example, we created an empty list and then added items one by one
    using the Add() method. However, if you need to initialize a list with a large
    number of values, you may find it more efficient to use a collection initializer,
    the syntax for which is as follows:


    List <type><list-name>= [ <item1>, <item2>, <item3>, ... ]</item3></item2></item1></list-name></type>


    Using this syntax, we can modify our initialization example as follows:


    List <string>colorList = ["Red", "Green", "Yellow", "Purple", "Orange"];</string>


    ## 27.6 Accessing list items


    Individual items in a list may be accessed using the item’s index value (keeping
    in mind that the first item is index 0, the second index 1, and so on). The index
    value is placed in square brackets after the list name. For example, to access
    the second item in the colorList object:


    List <string>colorList = ["Red", "Green", "Yellow", "Purple", "Orange"];</string>


    Console.WriteLine(colorList[1]);


    Output:


    Green


    A list item value can similarly be changed using the index combined with the assignment
    (=) operator. For example, to change the Yellow color to Indigo, the code would
    read as follows:


    List <string>colorList = ["Red", "Green", "Yellow", "Purple", "Orange"];</string>


    Console.WriteLine($"Color before = {colorList[2]}");


    colorList[2] = "Indigo";


    Console.WriteLine($"Color after = {colorList[2]}");


    Output:


    Color before = Yellow


    Color after = Indigo


    As with arrays, you can also construct a foreach loop to list all of the items
    in a list. For example:


    List <string>colorList = ["Red", "Green", "Yellow", "Purple", "Orange"];</string>


    foreach (string color in colorList)


    {


        Console.Write($"{color} ");


    }


    Output:


    Red Green Yellow Purple Orange


    ## 27.7 Removing items from lists


    Items may be removed from a list using the Remove() method. This method takes
    the value of the item to be removed as an argument. For example, to remove the
    “Orange” string from the colorList object, we could write the following code:


    List <string>colorList = ["Red", "Green", "Yellow", "Purple", "Orange"];</string>


    colorList.Remove("Orange");


    foreach (string color in colorList)


    {


        Console.Write($"{color} ");


    }


    Output:


    Green Yellow Purple Orange


    Note that C# lists can store duplicate entries. In the case of duplicated items,
    the Remove() method will only remove the first matching instance.


