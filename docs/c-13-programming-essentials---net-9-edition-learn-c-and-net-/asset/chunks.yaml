    Note the use of the using statement in the above code. StreamReader and StreamWriter
    allocate resources when they are created which need to be released when the work
    is complete. The using statement ensures the Dispose() method is called on the
    corresponding object on completion to free the allocated resources. Alternatively,
    the Dispose() must be called on the stream instance:


    writer.Dispose();


    The following code reads the content of the MyFile.txt file line by line using
    the StreamReader ReadLine() method:


    using (StreamReader reader = new("MyFile.txt"))


    {


        string line;


        while ((line = reader.ReadLine()) != null)


        {


            Console.WriteLine(line);


        }


    }


    We can use the StreamReader Read() method to read ranges of characters from a
    file. The Read() method has several overrides that allow it to be called in different
    ways. The following code, for example, reads and displays the first character
    from our MyFile.txt file:


    Console.WriteLine($"Char = {(char)reader.Read()}");


    Output:


    Char = A


    StreamReader instances retain a pointer indicating the current position in the
    file. The above code not only reads the first character from the file but also
    updates the pointer to reference the next position. A second read operation, therefore,
    would return the ‘B’ character.


    To avoid the risk of reading beyond the end of a file, we can use the StreamReader
    Peek() method to see the next character without reading it. When Peek() returns
    -1 we know that the current character is the last:


    while (reader.Peek() >= 0) {


        Console.WriteLine($"Char = {(char)reader.Read()}");


    }


    The Read() method, can also read a specified number of characters from a given
    index position using the following syntax:


    Read(<char array="">, <index>, <count>)</count></index></char>


    In the above syntax, the <index>parameter is an offset relative to the current
    stream position, not from the start of the stream. For example, if the stream
    pointer is currently 2 and Read() is passed an index value of 3, the characters
    will be read starting at position 5.</index>


    The following code example reads from the file in blocks of three characters,
    starting from the current position:


    using (StreamReader reader = new("MyFile.txt"))


    {


        char[] charBuffer;


        while (reader.Peek() >= 0)


        {


            charBuffer = new char[3];


            reader.Read(charBuffer, 0, 3);


            Console.WriteLine(charBuffer);


        }


    }


    When executed, the above code will generate the following output:


    ABC


    DEF


    GHI


    JKL


    MNO


    P


    Q


    RST


    UVW


    XYZ


    The pattern is disrupted after the letter ‘O’, but keep in mind that this is where
    we switched from Write() to WriteLine(), which introduced a newline between the
    ‘P’ and ‘Q’.


    When working with streams, we can obtain the stream length by accessing the reader’s
    BaseStream.Length property:


    var length = reader.BaseStream.Length;


    This is useful for initializing the character buffer when reading the entire stream:


    char[] charBuffer;


    var length = reader.BaseStream.Length;


    while (reader.Peek() >= 0)


    {


        charBuffer = new char[length];


        reader.Read(charBuffer, 0, (int)length);


        Console.WriteLine(charBuffer);


    }


    Another technique for reading until the end of the stream is to use the ReadToEnd()
    method, which returns a string value containing the stream’s content from the
    current position to the end:


    string contents = reader.ReadToEnd();


    ## 29.13 Asynchronous file handling


    In addition to the synchronous methods covered so far, the File and Stream classes
    include asynchronous equivalents which are particularly helpful when working with
    large files. The following are some examples of these asynchronous methods:


    •File.WriteAllLinesAsync()


    •File.ReadAllLinesAsync()


    •File.WriteAllTextAsync()


    •File.ReadAllTextAsync()


    •StreamReader.ReadAsync()


    •StreamReader.ReadBlockAsync()


    •StreamReader.ReadLineAsync()


    •StreamReader.ReadToEndAsync()


    •StreamWriter.WriteAsync()


    •StreamWriter.WriteLineAsync()


    These methods are syntactically similar to the synchronous equivalents but must
    be called from within async contexts using the await keyword, as outlined in the
    “Asynchronous Programming in C#” chapter.


    ## 29.14 Working with binary streams


    So far in this chapter, we have worked exclusively with text-based files. For
    binary file handling, C# provides the BinaryReader and BinaryWriter classes. The
    following example writes string, boolean, double, integer, and char values to
    a binary file:


    using (BinaryWriter writer = new(File.Open("Binary.dat", FileMode.Create)))


    {


        writer.Write("Test data");


        writer.Write(false);


        writer.Write(3.57);


        writer.Write(33);


        writer.Write(''W'');


    }


    When reading from a binary stream, the appropriate BinaryReader method must be
    called to match the data type as follows:


    using (BinaryReader reader = new(File.Open("Binary.dat", FileMode.Open)))


    {


        Console.WriteLine("String = " + reader.ReadString());


        Console.WriteLine("Boolean = " + reader.ReadBoolean());


        Console.WriteLine("Double = " + reader.ReadDouble());


        Console.WriteLine("Int = " + reader.ReadInt32());


        Console.WriteLine("Char = " + reader.ReadChar());


    }


    When it runs, the above code will generate the following output:


    String = Test data


    Boolean = False


    Double = 3.57


    Int = 33


    Char = W


