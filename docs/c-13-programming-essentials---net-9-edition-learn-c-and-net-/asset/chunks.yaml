    ## 30\. C# Strings


    Strings are collections of characters that are grouped together to form words
    or sentences. If it wasn’t for humans, computers would probably never have anything
    to do with strings. The fact is, however, that one of the primary jobs of a computer
    is to accept data from and present data to humans. For this reason, it is highly
    likely that any C# program is going to involve a considerable amount of code specifically
    designed to work with data in the form of strings.


    ## 30.1 Creating the StringsDemo Project


    Launch VS Code, open your “C# Essentials” workspace folder, and create a new .NET
    Console App project named StringsDemo.


    After creating the project, open the Program.cs file and use it to try out the
    examples in the rest of this chapter.


    ## 30.2 Creating strings in C#


    Strings consist of sequences of characters contained in a string object. A string
    object may be created using a number of different mechanisms.


    A string may be declared but not initialized as follows:


    string myString;


    Alternatively, you can assign a literal value to a string in C# using the assignment
    operator:


    string myString = "Hello World";


    It is, of course, also possible to declare a string using implicit typing:


    var myString = "Hello World";


    Similarly, a new string may be created using the new keyword and passing through
    the literal value to the constructor:


    string myString = new("Hello World");


    String literals are placed within double quotes (as shown above). If the string
    itself contains double quotes, the escape character (\) should precede the double-quote
    characters:


    Console.WriteLine("He shouted \"Can you hear me?\"");


    Output:


    He shouted "Can you hear me?"


    You can also instruct C# to treat all the characters in a string verbatim by prefixing
    the string with the @ character. When using @ notation, everything between the
    double quotes is treated as a raw string, regardless of whether new lines, carriage
    returns, backslashes, etc., are present in the text. For example:


    Console.WriteLine(@"You can put a backslash \ here


    and a new line


    and tabs work too.


    You can also put in sequences that would normally be seen as escape sequences
    like \n and \t.");


    Output:


