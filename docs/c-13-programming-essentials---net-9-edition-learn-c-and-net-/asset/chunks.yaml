- fmt: "\n`C#` is part of the never-ending quest to make programming computers as\
    \ easy and efficient as possible for humans. While it is easy to describe `C#`\
    \ as another object-oriented programming language, the fact is that `C#` is an\
    \ integral part of an entire development and execution infrastructure. The primary\
    \ object of these initial chapters is to provide an overview of both the `C#`\
    \ language and the infrastructure on which it relies.\n\n 2.1 The history of programming\
    \ languages\n\nThe problem with programming is that computers think exclusively\
    \ in numbers (0 and 1, to be precise), known as machine code, while humans communicate\
    \ using words. In the early days, programmers entered machine code directly into\
    \ computers to program them. This, as you can imagine, was a laborious and error-prone\
    \ process. The next evolution was associating brief human-readable commands with\
    \ the corresponding machine code. For example, a programmer could enter the command\
    \ `MOV` to transfer a value from one microprocessor register to another. These\
    \ commands would then be translated into machine code by a piece of software called\
    \ an assembler, thereby giving this command syntax the name Assembly Language.\n\
    \nNext came a series of high-level languages designed to make it easier for humans\
    \ to write programs. These programs are written using a human-readable syntax\
    \ and then either compiled to machine code by a compiler or interpreted by an\
    \ interpreter on the processor’s behalf. Such languages include `BASIC`, `COBOL`,\
    \ `Pascal`, and `Fortran`. Another language is `C`, which was created at AT&T\
    \ Bell Labs in the late 1960s and early 1970s. Then, in the late 1970s and early\
    \ 1980s, work started on an object-oriented approach to `C` programming, culminating\
    \ in a new, object-oriented variant of `C` known as `C++`.\n\nThe story, however,\
    \ continues. The problem with `C++` was that it was too easy to make programming\
    \ mistakes. For example, `C++` would quite happily allow a programmer to make\
    \ coding mistakes that would cause buffers to overflow, memory locations to be\
    \ arbitrarily overwritten, and introduce memory leaks that would cause applications\
    \ to bloat to the point of using up the entire physical memory and swap space\
    \ on a system. Another problem encountered with `C`, `C++`, and all other compiled\
    \ languages is that the source code must be recompiled for each processor type,\
    \ making it difficult to port an application from one hardware platform to another.\n\
    \nTo address the shortcomings of `C` and `C++`, Sun Microsystems started work\
    \ on a new programming language and execution environment in the 1990s. The result\
    \ was called `Java`. `Java` consists of a programming language with many of the\
    \ pitfalls of `C++` removed, a portable intermediate byte code format, a runtime\
    \ environment (called the virtual machine) that executes the byte code and handles\
    \ issues such as memory management, and a vast suite of libraries providing all\
    \ the functionality required to develop enterprise-class applications (such as\
    \ networking, file handling, database access, graphics, etc.).\n\n`Java` gained\
    \ rapid acceptance, and for a time, Microsoft began its `Java` “embrace and extend”\
    \ campaign. Sun was happy for Microsoft to embrace `Java` but reached for their\
    \ lawyers when they realized that the “extend” part was a plan for Microsoft to\
    \ introduce their own proprietary version of the language. Politics ensued, and\
    \ Microsoft eventually walked away from `Java`. Soon after, Microsoft started\
    \ talking about something called `.NET`, followed by a programming language called\
    \ `C#`.\n\n 2.2 What exactly is\n\n### C#?\n\n“What does all this history have\
    \ to do with `C#`?” I hear you ask. The origins of the `C#` programming syntax\
    \ can be traced back to `C` and `C++`. If you are already familiar with `C` or\
    \ `C++` (or even `Kotlin` or `Swift`, for the matter), then you have a big head\
    \ start in learning `C#`. The same can be said of syntax similarities between\
    \ `Java`, `C`, `C++`, and `C#` syntax. In addition, `C#` also inherits many of\
    \ the benefits of `Java` in terms of memory handling (better known as garbage\
    \ collection) and an intermediate byte code that negates the need to recompile\
    \ an application for each target hardware platform. `C#` is also accompanied by\
    \ a vast framework of libraries designed to provide the programmer with ready-made\
    \ solutions to almost every imaginable scenario.\n\nDespite these similarities,\
    \ there are differences between the `Java` and `C#` infrastructures. Therefore,\
    \ the next chapter will provide an overview of the `C#` infrastructure.\n\n 2.3\
    \ Who is using C#?\n\nAlthough some significant new programming languages have\
    \ been released since the introduction of `C#` (such as `Swift` and `Kotlin`),\
    \ `C#` is still evolving as a language and has a vast and growing user base.\n\
    \nAt the time of writing, for example, `C#` was ranked on the `TIOBE Index` in\
    \ 5th place among the top 50 most widely used programming languages (eclipsed\
    \ only by `C`, `Java`, `Python`, and `C++`).\n\n`C#` is used to develop desktop,\
    \ mobile, and server applications, as well as web-based applications and services.\
    \ It is the programming language of choice on all Microsoft platforms and is used\
    \ to program within the `Unity` Real-Time Development Platform.\n\n 2.4 Take the\
    \ knowledge test\n\nClick the link below or scan the QR code to test your knowledge\
    \ and understanding of the history of `C#`:\n\n[https://www.answertopia.com/qoe2](https://www.answertopia.com/qoe2)\n\
    \n![](images/image-4R5YZF8F.jpg)\n\n 2.5 Summary\n\n`C#` is a programming language\
    \ created by Microsoft that combines elements from other popular languages like\
    \ `C`, `C++`, and `Java`. It’s designed to make programming simpler and more efficient\
    \ with features like memory management to reduce errors and intermediate byte\
    \ code for compatibility across platforms. `C#` is used for desktop, mobile, server,\
    \ web, and game development and is among the top 10 most widely used programming\
    \ languages.\n\n# 3. C# Infrastructure\n\nThis chapter will introduce the infrastructure\
    \ on which the `C#` language is built. By the end of the chapter, you will have\
    \ a clear understanding of what acronyms such as `CLI`, `CLR`, `VES`, `JIT`, and\
    \ `.NET` mean.\n\n## 3.1 The Common Language Infrastructure\n\n### CLI)\n\n`C#`\
    \ is an object-oriented programming language. It is essentially a standard defining\
    \ what constitutes syntax. On its own, `C#` is of little use because it depends\
    \ upon the Common Language Infrastructure (`CLI`) for the compilation and execution\
    \ of applications. The `CLI`, in turn, is a standard that defines specifications\
    \ for the following components:\n\n•Virtual Execution System (`VES`)\n•Common\
    \ Intermediate Language (`CIL`)\n•Common Type System (`CTS`)\n•Common Language\
    \ Specification (`CLS`)\n•Framework\n\nIn the remainder of this chapter, we will\
    \ examine each CLI component to understand how the CLI environment fits together.\n\
    \n## 3.2 Common Intermediate Language\n\n### CIL)\n\nUnlike the `C` and `C++`\
    \ compilers, which compile the source code to machine code understood by the target\
    \ microprocessor, the `C#` compiler compiles to an intermediate byte code format\
    \ known as the Common Intermediate Language (`CIL`). This code can be executed\
    \ on any system with a CLI-compliant Virtual Execution System (`VES`). Therefore,\
    \ there is no need to compile an application for every target platform.\n\nThe\
    \ word “Common” in Common Intermediate Language is used because this format is\
    \ common to more than just the `C#` programming language. In fact, any programming\
    \ language may target the `CIL`, allowing libraries and code modules from different\
    \ languages to execute together in the same application. Typical languages for\
    \ which CIL compilation is available include `Visual Basic`, `COBOL`, `PowerShell`,\
    \ `Python`, and `C++`.\n\n## 3.3 Virtual Execution System (\n\n VES)\n"
  raw: 'C# is part of the never-ending quest to make programming computers as easy
    and efficient as possible for humans. While it is easy to describe C# as another
    object-oriented programming language, the fact is that C# is an integral part
    of an entire development and execution infrastructure. The primary object of these
    initial chapters is to provide an overview of both the C# language and the infrastructure
    on which it relies.


    ## 2.1 The history of programming languages


    The problem with programming is that computers think exclusively in numbers (0
    and 1, to be precise), known as machine code, while humans communicate using words.
    In the early days, programmers entered machine code directly into computers to
    program them. This, as you can imagine, was a laborious and error-prone process.
    The next evolution was associating brief human-readable commands with the corresponding
    machine code. For example, a programmer could enter the command MOV to transfer
    a value from one microprocessor register to another. These commands would then
    be translated into machine code by a piece of software called an assembler, thereby
    giving this command syntax the name Assembly Language.


    Next came a series of high-level languages designed to make it easier for humans
    to write programs. These programs are written using a human-readable syntax and
    then either compiled to machine code by a compiler or interpreted by an interpreter
    on the processor’s behalf. Such languages include BASIC, COBOL, Pascal, and Fortran.
    Another language is C, which was created at AT&T Bell Labs in the late 1960s and
    early 1970s. Then, in the late 1970s and early 1980s, work started on an object-oriented
    approach to C programming, culminating in a new, object-oriented variant of C
    known as C++.


    The story, however, continues. The problem with C++ was that it was too easy to
    make programming mistakes. For example, C++ would quite happily allow a programmer
    to make coding mistakes that would cause buffers to overflow, memory locations
    to be arbitrarily overwritten, and introduce memory leaks that would cause applications
    to bloat to the point of using up the entire physical memory and swap space on
    a system. Another problem encountered with C, C++, and all other compiled languages
    is that the source code must be recompiled for each processor type, making it
    difficult to port an application from one hardware platform to another.


    To address the shortcomings of C and C++, Sun Microsystems started work on a new
    programming language and execution environment in the 1990s. The result was called
    Java. Java consists of a programming language with many of the pitfalls of C++
    removed, a portable intermediate byte code format, a runtime environment (called
    the virtual machine) that executes the byte code and handles issues such as memory
    management, and a vast suite of libraries providing all the functionality required
    to develop enterprise-class applications (such as networking, file handling, database
    access, graphics, etc.).


    Java gained rapid acceptance, and for a time, Microsoft began its Java “embrace
    and extend” campaign. Sun was happy for Microsoft to embrace Java but reached
    for their lawyers when they realized that the “extend” part was a plan for Microsoft
    to introduce their own proprietary version of the language. Politics ensued, and
    Microsoft eventually walked away from Java. Soon after, Microsoft started talking
    about something called .NET, followed by a programming language called C#.


    ## 2.2 What exactly is


    ### C#?


    “What does all this history have to do with C#?” I hear you ask. The origins of
    the C# programming syntax can be traced back to C and C++. If you are already
    familiar with C or C++ (or even Kotlin or Swift, for that matter), then you have
    a big head start in learning C#. The same can be said of syntax similarities between
    Java, C, C++, and C# syntax. In addition, C# also inherits many of the benefits
    of Java in terms of memory handling (better known as garbage collection) and an
    intermediate byte code that negates the need to recompile an application for each
    target hardware platform. C# is also accompanied by a vast framework of libraries
    designed to provide the programmer with ready-made solutions to almost every imaginable
    scenario.


    Despite these similarities, there are differences between the Java and C# infrastructures.
    Therefore, the next chapter will provide an overview of the C# infrastructure.


    ## 2.3 Who is using C#?


    Although some significant new programming languages have been released since the
    introduction of C# (such as Swift and Kotlin), C# is still evolving as a language
    and has a vast and growing user base.


    At the time of writing, for example, C# was ranked on the TIOBE Index in 5th place
    among the top 50 most widely used programming languages (eclipsed only by C, Java,
    Python, and C++).


    C# is used to develop desktop, mobile, and server applications, as well as web-based
    applications and services. It is the programming language of choice on all Microsoft
    platforms and is used to program within the Unity Real-Time Development Platform.


