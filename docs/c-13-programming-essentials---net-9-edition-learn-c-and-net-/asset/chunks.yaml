  trans: "\n`SavingsAccount` 声明中的构造函数具有特别的意义。在 `BankAccount` 基类中，我们有一个接受账户名称、账号和余额参数的构造函数。在\
    \ `SavingsAccount` 子类中，我们还必须接受利率值。`: base()` 代码指示 C# 使用基类 `BankAccount` 类的构造函数来处理名称、账号和余额参数，而将利率留给\
    \ `SavingsAccount` 构造函数：\n\n```csharp\npublic SavingsAccount(string accountName,\
    \ int accountNumber,\n                      double accountBalance, double interestRate)\n\
    \                      : base(accountName, accountNumber, accountBalance)\n```\n\
    \n完成 `SavingsAccount` 子类的编写后，我们就可以在项目中使用它了。编辑 `Program.cs` 文件并进行如下修改：\n\n```csharp\n\
    using ObjectDemo;\n\nSavingsAccount account = new(accountName: \"John Smith\"\
    , accountNumber: 12312, accountBalance: 1000.99, interestRate: 0.05);\n\nConsole.WriteLine($\"\
    Interest earned this month = { account.MonthlyInterest()}\");\n\naccount.DisplayName();\n\
    ```\n\n当程序运行时，应用将在控制台中显示以下输出：\n\n```\nInterest earned this month = 4.17079166666667\n\
    Customer name is John Smith\n```\n\n## 17.5 重写被继承的方法\n\n在使用继承时，在父类中发现一个几乎能实现你需求、但需要修改以提供你所需的精确功能的方法，这并不稀奇。在这种情况下，一种方案是忽略继承的方法并编写一个具有完全新名称的方法。更好的方案是\
    \ `override`（重写）继承的方法并在子类中编写一个新版本。\n\n在继续示例之前，重写方法时必须遵守三个规则：\n\n1. 子类中重写的方法 get\
    \ 参数数量和类型必须与父类中被重写的方法相同。\n2. 新方法的返回类型必须与父类方法相同。\n3. 基类中的方法声明必须使用 `virtual`、`abstract`\
    \ 或 `override` 修饰符进行声明。\n\n抽象和虚类成员的主题将在下一章介绍。\n\n在我们的 `BankAccount` 类中，有一个名为 `DisplayName()`\
    \ 的方法，用于显示账户持有者的姓名。在我们的 `SavingsAccount` 子类中，我们可能还想输出分配给账户的当前利率。为了实现这一点，第一步是在\
    \ `BankAccount` 类中将该方法声明为 `virtual`（虚）：\n\n```csharp\npublic class BankAccount\n\
    {\n.\n.\n    virtual public void DisplayName()\n    {\n        Console.WriteLine($\"\
    Customer name is {AccountName}\");\n    }\n.\n.\n}\n```\n\n接下来，我们在 `SavingsAccount`\
    \ 子类中声明 `DisplayBalance()` 方法的新版本，并加上 `override` 修饰符：\n\n```csharp\npublic class\
    \ SavingsAccount : BankAccount\n{\n.\n.\npublic override void DisplayName()\n\
    \    {\n        Console.WriteLine($\"Customer name is { AccountName }\");\n  \
    \      Console.WriteLine($\"Account is earning { InterestRate }% interest.\");\n\
    \    }\n}\n```\n\n现在，当我们调用 `SavingsAccount` 类实例的 `DisplayName()` 方法时，我们获得了关于客户利率的信息：\n\
    \n```\nInterest earned this month = 4.17079166666667\nCustomer name is John Smith\n\
    Account is earning 0.05% interest.\n```\n\n在子类内部调用基类中的重写方法也是可能的。例如，可以调用基类的 `DisplayName()`\
    \ 方法在显示利率之前显示账户持有者的姓名，从而消除了进一步的代码重复。使用点符号表示法，我们可以如下调用 `base` 上的上的方法：\n\n```csharp\n\
    public override void DisplayName()\n{\n    base.DisplayName();\n    Console.WriteLine($\"\
    Account is earning { InterestRate }% interest.\");\n}\n```\n\n## 17.6 知识测试\n\n\
    点击下方的链接或扫描二维码，以测试你对 C# 继承的知识和理解：\n\n[`www.answertopia.com/mdqq`](https://www.answertopia.com/mdqq)\n\
    \n![](img/image-BXQJ19W6.jpg)\n\n## 17.7 总结\n\n在 C# 中，继承是一种编程概念，允许从现有类创建新类，并对其进行扩展以添加新功能。这意味着，当一个现有类提供了程序员所需的部分（但不是全部）功能时，该类可以作为新子类的基类。通过这种方式，新的子类将继承父类的所有能力，并可以进一步扩展以添加任何缺失的功能。\n\
    \n## 18. C# 抽象类\n\n在前面的章节中，我们检查了 C# 中的面向对象编程和类继承的概念。本章将介绍抽象类。\n\n## 18.1 什么是 C#\
    \ 抽象类？\n\n在本书到为止所过的示例中，我们创建了既可以被实例化为对象，也可以作为基类来派生类的类。通常情况下，基类并不是为了被实例化，而是仅作为子类的轮廓或模板提供的。这样的类被称为抽象类。抽象类不能被实例化为对象，仅用于派生子类。\n\
    \n## 18.2 抽象成员\n\nC# 抽象类包含抽象成员，这些成员定义了子类必须包含的内容。这些抽象成员声明了需要特定类型的成员，但它并没有实现该成员。抽象成员的实发生在派生类中。派自抽象类的未实现抽象方法将产生语法错误。\n\
    \n## 18.3 声明抽象类\n\n除了使用类修饰符外，正如我们之前看到的，抽象类还必须使用 `abstract` 修饰符声明：\n\n```csharp\n\
    public abstract class Talk\n}\n```\n\n抽象类的方法和属性也使用 `abstract` 关键字声明。例如，为了在 `Talk`\
    \ 类中声明一个抽象方法，需要以下代码：\n\n```csharp\npublic abstract class Talk\n{\n    public abstract\
    \ void Speak();\n}\n```\n\n现在我们有一个具有 `Speak()` 方法的抽象类。注意，此声明表示派自 `Talk` 的任何类都实现该方法。\n\
    \n## 18.4 派自抽象类\n\n要从抽象类派生，我们编写代码如下：\n\n```csharp\npublic class SayHello : Talk\n\
    {\n}\n```\n\n现在我们有一个派自 `Talk` 的类 `SayHello`。下一步是实现 `Speak()` 方法。在派生类中实现抽象成员时，必须使用\
    \ `override` 修饰符。例如：\n\n```csharp\npublic override void Speak() {\n    Console.WriteLine(\"\
    Hello!\");\n}\n```\n\n## 18.5 创建 AbstractClassDemo 项目\n\n掌握了抽象类的基础后，我们可以在项目中使用这些知识。首先在\
    \ VS Code 中创建一个名为 `AbstractClassDemo` 的 .NET 控制台项目。使用解决方案，向 `AbstractClassDemo`\
    \ 项目添加一个名为 `Talk` 的类。编辑 `Talk.cs` 文件，将 `Talk` 类声明为抽象，并添加抽象 `Speak()` 方法如下：\n\n\
    ```csharp\nnamespace AbstractClassDemo;\n\npublic abstract class Talk\n{\n   \
    \ public abstract void Speak();\n}\n```\n\n接下来，我们需要添加第二个派自 `Talk` 类的类。重复上述步骤，向项目添加一个类文件，这次将其命名为\
    \ `SayHello.cs`。一旦文件已添加，对其进行如下更改以派自 `Talk` 并实现 `Speak()` 方法：\n\n```csharp\nnamespace\
    \ AbstractClassDemo\n{\n    internal class SayHello : Talk\n    {\n        public\
    \ override void Speak()\n        {\n            Console.WriteLine(\"Hello!\");\n\
    \        }\n    }\n}\n```\n\n最后，修改 `Program.cs` 文件以使用这些新类：\n\n```csharp\nusing\
    \ AbstractClassDemo;\n```\n"
