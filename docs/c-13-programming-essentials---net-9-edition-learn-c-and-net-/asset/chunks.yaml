    既然我们已经描述了 C# 变量和常量，现在我们可以检查作为 C# 程序员可以使用的不同类型，从数值数据类型开始。


    ## 7.4 整数类型


    一种被广泛使用的数据类型是整数。C# 根据数字大小以及整数是有带符号（正数或负数）还是无符号（仅限正数）提供了几种整数类型。所有整数变量类型都有一个共同点：它们只能用于存储整数。


    下表列出了各种 C# 整数类型、每种类型消耗物理内存字节数的详细信息以及允许的取值范围。


    | 类型 | 字节大小 | 取值范围 |

    | :--- | :--- | :--- |

    | byte | 1 字节 | 0 to 255 |

    | sbyte | 1 字节 | -128 to 127 |

    | short | 2 字节 | -32,768 to 32,767 |

    | ushort | 2 字节 | 0 to 65,535 |

    | int | 4 字节 | -2,147,483,648 to 2,147,483,647 |

    | uint | 4 字节 | 0 to 4,294,967,295 |

    | long | 8 字节 | -9,223,372,036,854,775,808 to 9,223,372,036,854,775,807 |

    | ulong | 8 字节 | 0 to 18,446,744,073,709,551,615 |


    表 7-1


    以下代码演示了这些数据类型中的：


    ```cs

    int myInt = 2010210;

    byte myByte = 233;

    sbyte mySbyte = 127;

    ```


    所有的 C# 数值数据类型都包含边界属性，可以通过访问这些属性来识别特定类型支持的最小值和最大值。例如，以下代码向控制台输出了上述某些整数类型的最小和最大边界：


    ```cs

    Console.WriteLine("byte Min Value = " + byte.MinValue);

    Console.WriteLine("byte Max Value = " + byte.MaxValue);

    Console.WriteLine("short Min Value = " + short.MinValue);

    Console.WriteLine("short Max Value = " + short.MaxValue);

    Console.WriteLine("int Min Value = " + int.MinValue);

    Console.WriteLine("int Max Value = " + int.MaxValue);

    Console.WriteLine("uint Min Value = " + uint.MinValue);

    Console.WriteLine("uint Max Value = " + uint.MaxValue);

    Console.WriteLine("long Min Value = " + long.MinValue);

    Console.WriteLine("long Max Value = " + long.MaxValue);

    ```


    上述代码将生成以下输出：


    ```

    byte Min Value = 0

    byte Max Value = 255

    short Min Value = -32768

    short Max Value = 32767

    int Min Value = -2147483648

    int Max Value = 2147483647

    uint Min Value = 0

    uint Max Value = 4294967295

    long Min Value = -9223372036854775808

    long Max Value = 9223372036854775807

    ```


    ## 7.5 浮点变量


    整数对于处理整数很好，但当存在小数点后的数字时，用处不大。此类数字可以存储在 `float` 或 `double` 变量类型中。此类数字的默认类型是 `double`。下表显示了这类型，并对支持的数字范围和每种情况下的有效位数进行了比较：


    | 类型 | 字节大小 | 取值范围 | 数字精度 |

    | :--- | :--- | :--- | :--- |

    | float | 8 字节 | +/-1.5 * 10−45 to +/-3.4 * 1038 | 6 – 7 位 |

    | double | 16 字节 | +/-5.0 * 10−324 to +/-1.7 * 10308 | 15 – 16 位 |


    表 7-2


    由于 C# 中的浮点值默认被认为是 `double`，因此无法如下所示声明 `float` 变量：


    ```cs

    float myFloat = 23234.23;

    ```


    尝试编译上述代码将导致语法错误，部分内容如下：


    `无法将类型 double 的字面量隐式转换为类型 ''float'';请使用 ''F'' 后缀创建此类型的字面量`


    首先，我们需要理解“字面量”（literal）在这种语境下意味着什么。任何显式输入到 C# 代码中的值，例如数字（10, 23234.34, -11 等）或字符串（“Hello
    World”, “Dog” 等），都被称为字面量。


    在上面的示例中，字面量值 `23234.23` 被赋值给名为 `myFloat` 的 `float` 变量。问题在于，由于浮点字面量被认为是 `double`
    类型，因此无法进行此赋值，因为类型不匹配。相反，我们必须告诉 C# 我们的字面量数字实际上是 `float` 类型。通过在数字后面加上 `F` 后缀来实现：


    ```cs

    float myFloat = 23234.23F;

    ```


