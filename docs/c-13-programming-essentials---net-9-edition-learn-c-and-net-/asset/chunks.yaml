  trans: "\n\n在书的早期，我们使用了 `C#` 中的逻辑表达式来判断某个值是真是假。编程的很大一部分艺术涉及到编写根据一个或多个标准做出决策的代码。这些决策决定了在程序运行时哪些代码被执行，哪些代码被跳过。\n\
    \n在之前的章节中，已经在一些示例中使用 `if` 语句。在本章中，我们将更详细地查看 `if` 语句。\n\n## 9.2 使用 if 语句\n\n`if`\
    \ 语句是 `C#` 程序员可用的控制流选项中最基础的一种。熟悉 `C`、`C++` 或 `Java` 的程序员会立即适应使用 `C#` `if` 语句。\n\
    \n`C#` `if` 语句的基本语法如下：\n\n```csharp\nif (boolean expression) {\n    // 当表达式求值为\
    \ true 时执行的 C# 代码\n}\n```\n\n如果 `boolean` `expression` 的结果为 `true`，则语句体中的代码将被执行。语句体被括号（`{}`）括。相反，如果表达式求值为\
    \ `false`，则语句体中的代码将被跳过。\n\n例如，如果需要根据一个值是否大于另一个值来做出决策：\n\n```csharp\nint x = 10;\n\
    \nif ( x > 9 ) {\n    Console.WriteLine(\"x is greater than 9!\");\n}\n```\n\n\
    显然，`x` 大于 `9`，导致消息出现。\n\n注意：如果语句体只包含一条语句，可以省略外层的大括号（`{}`）。一旦语句体中包含多条语句，就必须重新添加括号。\n\
    \n## 9.3 使用 if … else … 语句\n\n`if` 语句的另一种变体允许我们使用以下语法，当 `if` 语句中的表达式求值为 `false`\
