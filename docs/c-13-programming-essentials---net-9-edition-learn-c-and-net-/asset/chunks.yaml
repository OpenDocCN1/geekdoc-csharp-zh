    ## 17.5 Overriding inherited methods


    When using inheritance, it is not unusual to find a method in the parent class
    that almost does what you need but requires modification to provide the precise
    functionality you require. One option in this scenario would be to ignore the
    inherited method and write a new method with an entirely new name. A better option
