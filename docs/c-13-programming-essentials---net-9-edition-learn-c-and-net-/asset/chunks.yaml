    \n![](img/image-F998BJU.jpg)\n\n## 22.11 总结\n\n在本章中，我们探索了 C# 命名空间并学会了如何使用它们组织项目并避免冲突。文件作用域命名空间允许整个源文件被指定属于同一个命名空间。\n\
    \n## 23. C#\n\n### 异常处理\n\n在完美的世界里，C# 代码永远不会遇到错误。由于我们并不生活在完美的世界里，因此无法保证代码在执行时不会发生错误（通常称为异常）。因此，确保代码能够顺利处理可能出现的异常至关重要。\n\
    \n本章介绍了使用 C# 进行异常处理，了异常类型、异常如何抛出以及如何使用 `try-catch` 语句处理异常等主题。\n\n"
- fmt: "\n## 23.2 Creating the ExceptionDemo project\n\nLaunch VS Code, open your\
    \ “C# Essentials” workspace folder, and create a new .NET Console App project\
    \ named `ExceptionDemo`. Once the project is ready, modify the `Program.cs` file\
    \ as follows:\n\n```csharp\nnamespace ExceptionDemo\n{\n    internal class Program\n\
    \    {\n        static void Main(string[] args)\n        {\n        }\n    }\n\
    }\n```\n\nThe project is a hypothetical app that controls an electric motor. During\
    \ the power-on diagnostics, the app reads the current voltage and prevents the\
    \ motor from starting if it exceeds 500 volts. Remaining in the `Program.cs` file,\
    \ add a method to perform the voltage check and call it from the `Main()` method:\n\
    \n```csharp\nnamespace ExceptionDemo\n{\n    internal class Program\n    {\n \
    \       static void Main(string[] args)\n        {\n            VoltageCheck(501);\n\
    \        }\n        private static void VoltageCheck(int voltage)\n        {\n\
    \            if (voltage > 500)\n            {\n                Console.WriteLine(\"\
    Voltage overload.\");\n            }\n            else\n            {\n      \
    \          Console.WriteLine(\"Voltage is safe.\");\n            }\n        }\n\
    \    }\n}\n```\n\nRun the app and check that the voltage overload message appears\
    \ in the console:\n\n`Voltage overload.`\n\nA voltage overload is a serious issue,\
    \ so we want to do more than display a message and hope the user doesn’t just\
    \ start the motor. Instead, we want to force the app to take preventative measures.\
    \ To do this, we will throw an exception.\n\n## 23.3 Throwing exceptions\n\nThe\
    \ first step in throwing an exception is to choose an exception type. As we mentioned\
    \ previously, exceptions can be thrown using one of the many built-in types or\
    \ a custom type you have created. We will cover custom exception types later in\
    \ the chapter, so for now, we will use the `ArgumentOutOfRangeException` type.\
    \ This exception type is typically thrown when an argument passed to a method\
    \ is outside an acceptable range (in our case a voltage reading exceeding 500\
    \ volts).\n\nNext, an instance of the exception type is created and initialized.\
    \ All exception types must be initialized with a message explaining the cause\
    \ of the problem. Some types, including `ArgumentOutOfRangeException`, also require\
    \ the name of the parameter that caused the exception (in our case, the `voltage`).\
    \ With this information, we can create a new exception as follows:\n\n`ArgumentOutOfRangeException\
    \ voltageException = new(nameof(voltage), \"Voltage exceeds safety parameters.\"\
    );`\n\nExceptions are thrown using the `throw` statement followed by the exception\
    \ object, as follows:\n\n```csharp\nthrow voltageException;\n```\n\nIn the above\
    \ examples, we have created and thrown the exception as separate steps. This sequence\
    \ is, however, typically performed in a single operation:\n\n```csharp\nthrow\
    \ new ArgumentOutOfRangeException(nameof(voltage), \"Voltage exceeds safety parameters.\"\
    );\n```\n\nModify the `VoltageCheck()` method to throw an exception as follows:\n\
    \n```csharp\nprivate static void VoltageCheck(int voltage)\n{\n    if (voltage\
    \ > 500)\n    {\n        throw new ArgumentOutOfRangeException(nameof(voltage),\n\
    \                                            \"Voltage exceeds safety parameters.\"\
    );\n    }\n    else\n    {\n        Console.WriteLine(\"Safe Voltage\");\n   \
    \ }\n}\n```\n\nRefer to the console, where the following output will appear:\n\
    \n`Unhandled exception. System.ArgumentOutOfRangeException: Voltage exceeds safety\
    \ parameters. (Parameter 'voltage')`\n`   at ExceptionDemo.Program.VoltageCheck(Int32\
    \ voltage) in Program.cs:line`\n\n## 23.4 Handling exceptions\n\nIn C#, exceptions\
    \ are handled using `try-catch` statements. To prevent the app from crashing,\
    \ we must add `try` to:\n\n```csharp\nstatic void Main(string[] args)\n{\n   \
    \ try\n    {\n        VoltageCheck(501);\n    }\n    catch (ArgumentOutOfRangeException)\n\
    \    {\n        Console.WriteLine(\"Voltage overload\");\n    }\n}\n```\n\nSo\
    \ far, we have implemented `catch` block. It is also possible to access the exception\
    \ object, for example:\n\n```csharp\ntry\n{\n    VoltageCheck(501);\n}\ncatch\
    \ (Exception ex)\n{\n    Console.WriteLine(ex.Message);\n}\n```\n\nWhen the app\
    \ runs, the following output will appear:\n\n`Voltage overload.`\n\nThe following\
    \ code for example:\n\n```csharp\ntry\n{\n    VoltageCheck(501);\n}\ncatch (ArgumentOutOfRangeException\
    \ ex)\n{\n    Console.WriteLine(\"Voltage overload\");\n}\n```\n\nThis is useful\
    \ for catching more than one type. For example:\n\n```csharp\ntry\n{\n    VoltageCheck(501);\n\
    }\ncatch (ArgumentOutOfRangeException)\n{\n    Console.WriteLine(\"Voltage overload\"\
    );\n}\nelse if (NullException)\n{\n    Console.WriteLine(\"Null reference\");\n\
    }\n```\n\n## 23.5 Creating exception filters with the `when`\n\nIn the above example,\
    \ we used `when` to control the exception. The syntax for using `when` in a catch\
    \ block is:\n\n```csharp\ntry\n{\n}\ncatch (exception) when (boolean)\n{\n}\n\
    ```\n\nThe code within the catch block will only execute if the Boolean expression\
    \ after `when` evaluates to true. This is particularly useful for catching specific\
    \ types. The following code, for example:\n\n```csharp\ncatch (Exception ex) when\
    \ (ex is ArgumentOutOfRangeException || ex is NullException)\n```\n\nException\
    \ filters can contain any Boolean expression, with or without type matching. The\
    \ following catch block will only execute if the exception type is `ArgumentException`\
    \ and `motorTemp` exceeds 102:\n\n```csharp\ntry\n{\n    VoltageCheck(501);\n\
    }\ncatch (Exception ex) when (ex is ArgumentOutOfRangeException && motorTemp >\
    \ 102)\n```\n\n## 23.6 Using `finally` blocks\n\nThe purpose of the `finally`\
    \ block is to specify code to be executed before a `try-catch` statement finishes\
    \ and is typically used to perform clean-up tasks, for example:\n\n```csharp\n\
    try\n{\n    VoltageCheck(501);\n}\ncatch (Exception ex)\n{\n    Console.WriteLine(ex.Message);\n\
    }\nfinally\n{\n    Console.WriteLine(\"Resetting system.\");\n}\n```\n\n## 23.7\
    \ Using the `try-finally` Statement\n\nFrom previous experience, we know that\
    \ an unhandled exception will cause a running app to crash, but have yet to explain\
    \ where exceptions can be caught. The examples covered in this chapter so far\
    \ have implied that exceptions must be handled at the point that they occur using\
    \ a `try-catch statement`. In practice, however, this is not the case. Before\
    \ exploring this topic in more detail it helps to view the execution path of a\
    \ running app as a hierarchy of method calls, starting with the `Main()` method\
    \ representing the top level.\n\nConsider a scenario where the `Main()` method\
    \ calls `Method A` which, in turn, calls `Method B` and `Method C`. Method `C`\
    \ then calls `Method D`, and so on. This hierarchy of method calls is referred\
    \ to as a call tree or call hierarchy. In diagram form, our theoretical call hierarchy\
    \ might appear as shown in Figure 23-1 below:\n\n![](images/image-N29EWYM5.png)\n\
    \nFigure 23-1\n\nSuppose an exception is thrown in `Method D`. This exception\
    \ will propagate up through the call hierarchy until the exception is handled.\
    \ If the exception reaches the `Main()` method without being caught, the app will\
    \ crash. This means that even though the exception was thrown in `Method D`, we\
    \ can handle it in any direct ancestor method up to and including `Main()` to\
    \ prevent the app from crashing.\n"
  raw: '## 23.2 Creating the ExceptionDemo project


    Launch VS Code, open your “C# Essentials” workspace folder, and create a new .NET
    Console App project named ExceptionDemo. Once the project is ready, modify the
    Program.cs file as follows:


    namespace ExceptionDemo


    {


        internal class Program


        {


            static void Main(string[] args)


            {


            }


        }


    }


    The project is a hypothetical app that controls an electric motor. During the
    power-on diagnostics, the app reads the current voltage and prevents the motor
    from starting if it exceeds 500 volts. Remaining in the Program.cs file, add a
    method to perform the voltage check and call it from the Main() method:


    namespace ExceptionDemo


    {


        internal class Program


        {


            static void Main(string[] args)


            {


                VoltageCheck(501);


            }


            private static void VoltageCheck(int voltage)


            {


                if (voltage > 500)


                {


                    Console.WriteLine("Voltage overload.");


                }


                else


                {


                    Console.WriteLine("Voltage is safe.");


                }


            }


        }


    }


    Run the app and check that the voltage overload message appears in the console:


    Voltage overload.


    A voltage overload is a serious issue, so we want to do more than display a message
    and hope the user doesn’t just start the motor. Instead, we want to force the
    app to take preventative measures. To do this, we will throw an exception.


    ## 23.3 Throwing exceptions


    The first step in throwing an exception is to choose an exception type. As we
    mentioned previously, exceptions can be thrown using one of the many built-in
    types or a custom type you have created. We will cover custom exception types
    later in the chapter, so for now, we will use the ArgumentOutOfRangeException
    type. This exception type is typically thrown when an argument passed to a method
    is outside an acceptable range (in our case a voltage reading exceeding 500 volts).


    Next, an instance of the exception type is created and initialized. All exception
    types must be initialized with a message explaining the cause of the problem.
    Some types, including ArgumentOutOfRangeException, also require the name of the
    parameter that caused the exception (in our case, the voltage). With this information,
    we can create a new exception as follows:


    ArgumentOutOfRangeException voltageException = new(nameof(voltage), "Voltage exceeds
    safety parameters.");


    Exceptions are thrown using the throw statement followed by the exception object,
    as follows:


    throw voltageException;


    In the above examples, we have created and thrown the exception as separate steps.
    This sequence is, however, typically performed in a single operation:


    throw new ArgumentOutOfRangeException(nameof(voltage), "Voltage exceeds safety
    parameters.");


    Modify the VoltageCheck() method to throw an exception as follows:


    private static void VoltageCheck(int voltage)


    {


        if (voltage > 500)


        {


    throw new ArgumentOutOfRangeException(nameof(voltage),


                               "Voltage exceeds safety parameters.");


        }


        else


        {


            Console.WriteLine("Safe Voltage");


        }


    }


    Refer to the console, where the following output will appear:


    Unhandled exception. System.ArgumentOutOfRangeException: Voltage exceeds safety
    parameters. (Parameter ''voltage'')


       at ExceptionDemo.Program.VoltageCheck(Int32 voltage) in Program.cs:line 16


       at ExceptionDemo.Program.Main(String[] args) in Program.cs:line 8


    This message tells us the app was terminated due to an unhandled exception. The
    error includes the exception type, the message, and the name of the parameter
    that caused the exception.


    We now need to add additional code to handle the exception when it is thrown.


    ## 23.4 Handling exceptions


    Exceptions in C# are handled using try-catch statements. To prevent our app from
    crashing when the exception is thrown, we must make the following changes to the
    Main() method:


    static void Main(string[] args)


    {


    try


        {


            VoltageCheck(501);


    }


        catch


        {


            Console.WriteLine("Voltage too high - disconnecting power");


        }


    }


    When the app runs, the try-catch statement will handle the exception and allow
    the app to take corrective action.


    It is also possible to access the exception object within the body of the catch
    block, providing access to the message:


    try


    {


        VoltageCheck(501);


    }


    catch (ArgumentOutOfRangeException ex)


    {


    Console.WriteLine(ex.Message);


    }


    So far, we have implemented code to handle a single exception type. The code within
    the body of the try block may, however, throw a variety of exception types. By
    accessing the exception object, we can identify the exception type and take type-specific
    actions. For example:


    catch (Exception ex)


    {


    if (ex is ArgumentOutOfRangeException)


        {


    Console.WriteLine(ex.Message);


        }


        else if (ex is NullReferenceException)


        {


            Console.WriteLine(ex.Message);


        }


    }


    ## 23.5 Creating exception filters with the “when” keyword


    In the above example, we used an if ... else if statement to take different actions
    depending on the type of the caught exception. The when keyword provides a higher-level
    filtering option to control whether a catch block meets specific rules. The syntax
    for using when in a catch block is as follows:


    try


    {


    }


    catch (<exception>) when (<boolean expression="">)</boolean></exception>


    {


    }


    The code within the catch block will only execute if the Boolean expression after
    the when keyword evaluates to true. This is particularly useful for catching more
    than one exception type within a single catch block. The following code, for example,
    will only catch the exception if it matches either of the given types:


    catch (Exception ex) when (ex is ArgumentOutOfRangeException ||


                               ex is ArgumentException)


    Exception filters can contain any Boolean logical expression, with or without
    exception type matching. The following catch block will only execute if the exception
    type is ArgumentException and the motorTemp variable exceeds 102:


    try


    {


        VoltageCheck(501);


    }


    catch (Exception ex) when (ex is ArgumentOutOfRangeException && motorTemp > 102)


    {


    }


    ## 23.6 Using finally blocks


    The purpose of the finally block is to specify code to be executed just before
    a try-catch statement finishes and is typically used to perform clean-up tasks,
    for example:


    try


    {


        VoltageCheck(501);


    }


    catch (Exception ex)


    {


        Console.WriteLine(exception.Message);


    }


    finally


    {


        Console.WriteLine("Resetting system.");


    }


    ## 23.7 Using the try-finally Statement


    From previous experience, we know that an unhandled exception will cause a running
    app to crash, but have yet to explain where exceptions can be caught and handled.
    The examples covered in this chapter so far have implied that exceptions must
    be handled at the point that they occur using a try-catch statement. In practice,
    however, this is not the case. Before exploring this topic in more detail it helps
    to view the execution path of a running app as a hierarchy of method calls, starting
    with the Main() method representing the top level.


    Consider a scenario where the Main() method calls Method A which, in turn, calls
    methods B and C. Method C then calls Method D, and so on. This hierarchy of method
    calls is referred to as a call tree or call hierarchy. In diagram form, our theoretical
    call hierarchy might appear as shown in Figure 23-1 below:


    ![](images/image-N29EWYM5.png)


    Figure 23-1


    Suppose an exception is thrown in Method D. This exception will propagate up through
    the call hierarchy until the exception is handled. If the exception reaches the
    Main() method without being caught, the app will crash. This means that even though
    the exception was thrown in Method D, we can handle it in any direct ancestor
    method up to and including Main() to prevent the app from crashing.'
