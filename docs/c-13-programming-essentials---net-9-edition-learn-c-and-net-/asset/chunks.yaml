    ## 21.8 Summary


    C# tuples allow us to temporarily group multiple values into a single entity.
    Once declared, a tuple can be used to return groups of result values from a method
    or to pass multiple parameter values between methods within a single argument.
    Tuples support most C# data types, including custom objects, and their items do
    not have to be of matching types. We can access tuple items by item number and
    field name or assign them directly to named variables.


    ## 22.


    ### C#


    ## Namespaces


    In the preceding chapters, we have covered object-oriented C# programming in detail.
    We have learned how code is structured using classes and structures that result
    in well-organized re-usable code. In many of the code examples used so far, we
    have seen namespace declarations. Now that we understand object-oriented programming,
    we are ready to find out what namespaces are, why they exist, and how to use them.


    ## 22.1 Understanding scope


    Before we talk about namespaces, we first need to understand the concept of scope
    as it relates to programming languages. Scope defines whether entities such as
    class declarations, methods, and variables are visible and accessible to code
    that resides outside the current scope. We touched on scope briefly when looking
    at C# looping. For example, variables declared within a body of a for loop belong
    only to the loop’s scope and do not exist before or after the loop executes:


    // variable myCounter does not yet exist


    for (int i = 0; i < 10; i++)


    {


           int myCounter = 0; //myCounter variable created in scope of for loop


           myCounter += i;


    }


    // after loop exit variable myCounter is now out of scope and ceases to exist


    Similarly, class methods and properties reside in the scope of the class in which
    they are declared and can only be accessed by referencing the containing class.
    In the following example, we can only access the IncrementCounter() method by
    referencing MyClass:


    class MyClass


    {


        static int myCountr = 0;


        public static void IncrementCounter() {


            myCounter++;


        }


    }


    MyClass.IncrementCounter();


    Scope allows us to declare classes and structures without worrying that a method
    name in one class might conflict with a method in another class. For example,
    the identical method names in the following classes do not conflict because they
    belong to separate scopes:


    class MyClass


    {


        static int myCounter = 0;


        public static void IncrementCounter() {


            myCounter++;


        }


    }


    class MyOtherClass


    {


        static int myCounter = 0;


        public static void IncrementCounter() {


            myCounter++;


        }


    }


    A problem arises, however, when entities like classes and structures themselves
    have conflicting names. If both of the above classes were named MyClass, the code
    would generate a syntax error because they are declared within the same scope.
    The solution to this is to use namespaces.


    ## 22.2 An overview of namespaces


    Much like classes and structures, namespaces provide an additional layer of organization
    within C# code. As we have seen, a C# project contains classes and structures
    containing members, spread across multiple source code files.


    Particularly within large projects with complex code bases, there is a possibility
    that names that are not declared within the scope of class or structure will conflict
    with each other, either in the code you have written or between your code and
    the built-in .NET classes and structures. The following code, for example, will
    trigger a syntax error because the class names conflict:


    class ClassA


    {


        public static void OpenFile() {


            Console.WriteLine("Class A OpenFile()");


        }


    }


    class ClassA


    {


        public static void OpenFile()


        {


            Console.WriteLine("Class A OpenFile()");


        }


    }


    Namespaces allow application code to be organized into separate scopes (called
    spaces) so that the names in one namespace do not conflict with the same names
    in another. In the absence of a specific namespace, declarations such as those
    above are members of the global namespace, as illustrated in Figure 22-1 below:


    ![](images/image-6HMJWVAR.png)


    Figure 22-1


    Aside from renaming one of the classes, the only way to resolve the ClassA naming
    conflict is to move one or both classes into separate namespaces. In the rest
    of this chapter, we will create a project to resolve the above problem and explore
    namespaces in more detail.


