    ## 8.12 Bitwise Operators


    As previously discussed, computer processors work in binary. These are essentially
    streams of ones and zeros, each one referred to as a bit. Bits are formed into
    groups of 8 to form bytes. As such, it is not surprising that we, as programmers,
    will occasionally end up working at this level in our code. To facilitate this
    requirement, C# provides a range of bit operators.


    Those familiar with bitwise operators in other languages such as C, C++, and Java
    will find nothing new in this area of the C# language syntax. For those unfamiliar
    with binary numbers, now may be a good time to seek out reference materials on
    the subject in order to understand how ones and zeros are formed into bytes to
    form numbers. Other authors have done a much better job of describing the subject
    than we can do within the scope of this book.


    For the purposes of this exercise we will be working with the binary representation
    of two numbers (for the sake of brevity we will be using 8-bit values in the following
    examples). First, the decimal number 171 is represented in binary as:


    10101011


    Second, the number 3 is represented by the following binary sequence:


    00000011


    Now that we have two binary numbers with which to work, we can begin to look at
    the C# bitwise operators:


    ## 8.12.1 Bitwise NOT


    The Bitwise NOT is represented by the tilde (~) character and has the effect of
    inverting all of the bits in a number. In other words, all the zeros become ones
    and all the ones become zeros. Taking our example 3 number, a Bitwise NOT operation
    has the following result:


    00000011 NOT


    ========


    11111100


    The following C# code, therefore, results in a value of -4:


    int y = 3;


    int z = ~y;


    Console.WriteLine($"Result is {z}");


    ## 8.12.2 Bitwise AND


    The Bitwise AND is represented by a single ampersand (&). It makes a bit by bit
    comparison of two numbers. Any corresponding position in the binary sequence of
    each number where both bits are 1 results in a 1 appearing in the same position
    of the resulting number. If either bit position contains a 0 then a zero appears
    in the result. Taking our two example numbers, this would appear as follows:


    10101011 AND


    00000011


    ========


    00000011


    As we can see, the only locations where both numbers have 1s are the last two
    positions. If we perform this in C# code, therefore, we should find that the result
    is 3 (00000011):


    int x = 171;


    int y = 3;


    int z = x & y;


    Console.WriteLine($"Result is {z}");


    ## 8.12.3 Bitwise OR


    The bitwise OR also performs a bit by bit comparison of two binary sequences.
    Unlike the AND operation, the OR places a 1 in the result if there is a 1 in the
    first or second operand. The operator is represented by a single vertical bar
    character (|). Using our example numbers, the result will be as follows:


    10101011 OR


    00000011


    ========


    10101011


    If we perform this operation in a C# example the result will be 171:


    int x = 171;


    int y = 3;


    int z = x | y;


    Console.WriteLine($"Result is {z}");


    ## 8.12.4 Bitwise XOR


    The bitwise XOR (commonly referred to as exclusive OR and represented by the caret
    ‘^’ character) performs a similar task to the OR operation except that a 1 is
    placed in the result if one or other corresponding bit positions in the two numbers
    is 1\. If both positions are a 1 or a 0 then the corresponding bit in the result
    is set to a 0\. For example:


    10101011 XOR


    00000011


    ========


    10101000


    The result in this case is 10101000 which converts to 168 in decimal. To verify
    this we can, once again, try some C# code:


    int x = 171;


    int y = 3;


    int z = x ^ y;


    Console.WriteLine($"Result is {z}");


    ## 8.12.5 Bitwise Left Shift


    The bitwise left shift moves each bit in a binary number a specified number of
    positions to the left. Shifting an integer one position to the left has the effect
    of doubling the value.


    As the bits are shifted to the left, zeros are placed in the vacated right most
    (low order) positions. Note also that once the left most (high order) bits are
    shifted beyond the size of the variable containing the value, those high order
    bits are discarded:


    10101011 Left Shift one bit


    ========


    101010110


    In C# the bitwise left shift operator is represented by the ‘<<’ sequence, followed
    by the number of bit positions to be shifted. For example, to shift left by 1
    bit:


    int x = 171;


    int z = x << 1;


    Console.WriteLine($"Result is {z}");


    When compiled and executed, the above code will display a message stating that
    the result is 342 which, when converted to binary, equates to 101010110.


    ## 8.12.6 Bitwise Right Shift


    A bitwise right shift is, as you might expect, the same as a left except that
    the shift takes place in the opposite direction. Shifting an integer one position
    to the right has the effect of halving the value.


    Note that since we are shifting to the right there is no opportunity to retain
    the lower most bits regardless of the data type used to contain the result. As
    a result, the low order bits are discarded. Whether or not the vacated high order
    bit positions are replaced with zeros or ones depends on whether the sign bit used
    to indicate positive and negative numbers is set or not.


    10101011 Right Shift one bit


    ========


    01010101


    The bitwise right shift is represented by the ‘>>’ character sequence followed
    by the shift count:


    int x = 171;


    int z = x >> 1;


    Console.WriteLine($"Result is {z}");


    When executed, the above code will report the result of the shift as being 85,
    which equates to binary 01010101.


    ## 8.13 Compound Bitwise Operators


    As with the arithmetic operators, each bitwise operator has a corresponding compound
    operator that allows the operation and assignment to be performed using a single
    operator:


    | Operator | Description |


    | x &= y | Perform a bitwise AND of x and y and assign result to x |


    | x &#124;= y | Perform a bitwise OR of x and y and assign result to x |


    | x ^= y | Perform a bitwise XOR of x and y and assign result to x |


    | x <<= n | Shift x left by n places and assign result to x |


    | x >>= n | Shift x right by n places and assign result to x |


