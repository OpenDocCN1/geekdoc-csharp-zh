    ```\n\n## 29.11 Deleting, copying, and moving files\n\nExisting files are deleted\
    \ using the `Delete()` method of the `File` class (similar options are available\
    \ in the `FileInfo` class), passing through the path of the file to be deleted,\
    \ for example:\n\n```csharp\nFile.Delete(\"/Temp/SomeFile.txt\");\n```\n\nTo copy\
    \ an existing file to a new file use the `File.Copy()` method as follows:\n\n\
    ```csharp\nFile.Copy(\"File1.txt\", \"/Temp/File2.txt\");\n```\n\nThe `File.Move()`\
    \ method moves a file from one location to another, including the option to rename\
    \ the file. The following code moves a file between directories:\n\n```csharp\n\
    File.Move(\"MyFile.txt\", \"/Documents/MyFile.txt\");\n```\n\nIn the following\
    \ example, `Move()` is used to rename a file in the current working directory:\n\
    \n```csharp\nFile.Move(\"oldfilename.txt\", \"newfilename.txt\");\n```\n\n## 29.12\
    \ File I/O with streams\n\nThe `File` class provides a simple way to write content\
    \ to files as blocks or lines of text. For more complex requirements, however,\
    \ we need to use streams.\n\nThe `StreamReader` and `StreamWriter` classes are\
    \ used to read from and write to files with greater flexibility and control compared\
    \ to the `File` class and are also better suited for working with large files.\n\
    \nThe `Stream` classes allow us to read and write text by line or character. The\
    \ following code, for example, uses the `StreamWriter` `Write()` and `WriteLine()`\
    \ methods to write individual characters and lines to the stream, respectively:\n\
    \n```csharp\nusing (StreamWriter writer = new(\"MyFile.txt\"))\n{\n    writer.Write('A');\n\
    \    writer.Write('B');\n    writer.Write('C');\n    writer.WriteLine(\"DEFGHIJKLMNOP\"\
    );\n    writer.WriteLine(\"QRSTUVWXYZ\");\n}\n```\n\nNote the use of the `using`\
    \ statement in the above code. `StreamReader` and `StreamWriter` allocate resources\
    \ when they are created which need to be released when the work is complete. The\
    \ `using` statement ensures the `Dispose()` method is called on the corresponding\
    \ object on completion to free the allocated resources. Alternatively, the `Dispose()`\
    \ must be called on the stream instance:\n\n```csharp\nwriter.Dispose();\n```\n\
    \nThe following code reads the content of the `MyFile.txt` file line by line using\
    \ the `StreamReader` `ReadLine()` method:\n\n```csharp\nusing (StreamReader reader\
    \ = new(\"MyFile.txt\"))\n{\n    string line;\n    while ((line = reader.ReadLine())\
    \ != null)\n    {\n        Console.WriteLine(line);\n    }\n}\n```\n\nWe can use\
    \ the `StreamReader` `Read()` method to read ranges of characters from a file.\
    \ The `Read()` method has several overrides that allow it to be called in different\
    \ ways. The following code, for example, reads and displays the first character\
    \ from our `MyFile.txt` file:\n\n```csharp\nConsole.WriteLine($\"Char = {(char)reader.Read()}\"\
    );\n```\n\nOutput:\n```\nChar = A\n```\n\n`StreamReader` instances retain a pointer\
    \ indicating the current position in the file. The above code not only reads the\
    \ first character from the file but also updates the pointer to reference the\
    \ next position. A second read operation, therefore, would return the ‘B’ character.\n\
    \nTo avoid the risk of reading beyond the end of a file, we can use the `StreamReader`\
    \ `Peek()` method to see the next character without reading it. When `Peek()`\
    \ returns -1 we know that the current character is the last:\n\n```csharp\nwhile\
    \ (reader.Peek() >= 0) {\n    Console.WriteLine($\"Char = {(char)reader.Read()}\"\
    );\n}\n```\n\nThe `Read()` method, can also read a specified number of characters\
    \ from a given index position using the following syntax:\n\n`Read(<char array>,\
    \ <index>, <count>)`\n\nIn the above syntax, the `<index>` parameter is an offset\
    \ relative to the current stream position, not from the start of the stream. For\
    \ example, if the stream pointer is currently 2 and `Read()` is passed an index\
    \ value of 3, the characters will be read starting at position 5.\n\nThe following\
    \ code example reads from the file in blocks of three characters, starting from\
    \ the current position:\n\n```csharp\nusing (StreamReader reader = new(\"MyFile.txt\"\
    ))\n{\n    char[] charBuffer;\n    while (reader.Peek() >= 0)\n    {\n       \
    \ charBuffer = new char[3];\n        reader.Read(charBuffer, 0, 3);\n        Console.WriteLine(charBuffer);\n\
    \    }\n}\n```\n\nWhen executed, the above code will generate the following output:\n\
