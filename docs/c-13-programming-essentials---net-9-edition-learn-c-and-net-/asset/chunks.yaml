    \n## 16.3 Lambdas\n\nYou can think of lambdas as anonymous methods that allow\
    \ code to be written more concisely. As with delegates and anonymous methods,\
    \ you will first need to declare a variable of type `delegate` in which to store\
    \ the lambda reference and to define the return value and parameter types using\
    \ the following, now familiar, syntax:\n\n`delegate <returntype><delegatename>(<parameters>);</parameters></delegatename></returntype>`\n\
    \nLambdas are declared using the `=>` operator. The left side of the operator\
    \ lists the input parameters, and the right side consists of an expression or\
    \ code block containing the code to be executed.\n\nC# supports the following\
    \ types of lambda:\n\n*   Expression lambda – The lambda body contains a single\
    \ expression to be executed.\n*   Statement lambda – The lambda body contains\
    \ a statement block enclosed in braces `{}` containing multiple statements.\n\n\
    The syntax for an expression lambda reads as follows:\n\n`(input-parameters) =>\
    \ expression`\n\nWhen passing a single parameter to a lambda, the parentheses\
    \ placed around the input parameters in the above syntax are optional.\n\nA statement\
    \ lambda, on the other hand, uses the following syntax:\n\n`(input-parameters)\
    \ => { <statements>};</statements>`\n\nTo appreciate the concise nature of lambdas,\
    \ consider the following slightly modified anonymous method declaration from our\
    \ `Program.cs` file:\n\n```csharp\ndelegate string StringConverter(string s);\n\
    \nStringConverter converter = delegate (string s)\n{\n    return s.ToLower();\n\
    };\n```\n\nUsing a lambda, we can implement the same behavior as follows:\n\n\
    ```csharp\ninternal class Program\n{\n    delegate string StringConverter(string\
    \ s);\n    static void Main(string[] args)\n    {\n        StringConverter converter\
    \ = s => s.ToLower();\n        var result = converter(\"LAMBDA Demo\");\n    \
    \    Console.WriteLine(result);\n    }\n}\n```\n\nBefore using a lambda, we started\
    \ with:\n\n```csharp\ndelegate string StringConverter(string s);\n\nStringConverter\
    \ converter = delegate (string s)\n{\n    return s.ToLower();\n};\n```\n\nUsing\
    \ a lambda allowed us to reduce the code to:\n\n```csharp\nStringConverter converter\
    \ = s => s.ToLower();\n```\n\nSince the lambda only contains a single expression,\
    \ we did not need to declare the type. Having declared the lambda, we call it\
    \ like:\n\n`converter(\"LAMBDA Demo\")`\n\n## 16.4 Passing parameters\n\nAs with\
    \ standard delegates, you can also pass anonymous methods as arguments to other\
    \ methods using the syntax outlined in the previous chapter, for example:\n\n\
    ```csharp\nnamespace LambdaDemo\n{\n    internal class Program\n    {\n      \
    \  delegate string StringConverter(string value);\n        static void DisplayText(StringConverter\
    \ converter, string text)\n        {\n            string result = converter(text);\n\
    \            Console.WriteLine($\"Converted text = { result}\");\n        }\n\
    \        static void Main(string[] args)\n        {\n            StringConverter\
    \ converter = delegate (string value)\n            {\n                Console.Write(\"\
    Inline conversion to lowercase > \");\n                return value.ToLower();\n\
    \            };\n            DisplayText(converter, \"This IS a teST.\");\n  \
    \      }\n    }\n}\n```\n\nRunning the above code will produce the following output:\n\
    \n```\nInline conversion to lowercase > Converted text = this is a test.\n```\n\
    \nIf you need to pass multiple parameters to a lambda, you can do so by enclosing\
    \ them in parentheses. For example:\n\n```csharp\ndelegate string StringConverter(string\
    \ s, int i);\n\nStringConverter converter = delegate (string s, int i)\n{\n  \
    \  return s.ToLower() + i.ToString();\n};\n```\n\n## 16.5 Passing no parameters\n\
    \nAlternately, a lambda that accepts no parameters is declared using empty parentheses:\n\
    \n```csharp\ndelegate string GetGreeting();\n\nGetGreeting greeting = () => \"\
    Hello World\";\n```\n\n## 16.6 Local functions\n\nLocal functions are similar\
    \ in many ways to lambda expressions with some important differences. They are\
    \ named methods declared within other methods. For example, the following is the\
    \ local function of our `StringConverter`:\n\n```csharp\ndelegate string StringConverter(string\
    \ s);\n\nStringConverter converter(string s)\n{\n    return s.ToLower();\n};\n\
    ```\n\nSince the lambda only contains a single expression, we can abbreviate the\
    \ code to:\n\n```csharp\nStringConverter converter = s => s.ToLower();\n```\n\n\
    A key point to note in this example is that the local function has access to the\
    \ local variables, neither of which would have been directly available to a lambda\
    \ expression.\n\n## 16.7 Creating the LambdaDemo project\n\nTo try out local functions,\
    \ create a new .NET Console App project in VS Code, and name it `LambdaDemo`.\
    \ Once the project has been created, edit the `Program.cs` file so that it reads\
    \ as follows:\n\n```csharp\nnamespace LambdaDemo\n{\n    internal class Program\n\
    \    {\n        static void Main(string[] args)\n        {\n            ConvertToEuros(10.00);\n\
    \        }\n        private static void ConvertToEuros(double value)\n       \
    \ {\n            var exchangeRate = 0.5;\n            double USDToEuro(double\
    \ dollars) => exchangeRate * dollars;\n            var result = USDToEuro(value);\n\
    \            Console.WriteLine(result);\n        }\n    }\n}\n```\n\nThe `ConvertToEuros()`\
    \ method accepts a dollar amount and returns the equivalent in euros. Within this\
