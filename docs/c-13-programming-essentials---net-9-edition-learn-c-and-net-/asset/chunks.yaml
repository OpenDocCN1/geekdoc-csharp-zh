    \ on a string literal or object:\n\n```c\nvar result = \"My String\".Equals(\"\
    my string\", StringComparison.OrdinalIgnoreCase);\n```\n\nThe `string.Compare()`\
    \ method provides yet another way to compare strings, though this method has some\
    \ useful additional features. This method accepts as arguments the two strings\
    \ to be compared and returns an integer value indicating how the strings relate\
    \ to each other in relation to sort order. A result of `0` indicates that the\
    \ strings match. A value of less than `0` indicates that the first string precedes\
    \ the second string in the sort order. Finally, a result of greater than `0` indicates\
    \ the second string precedes the first in the sort order:\n\n```c\nstring myString1\
    \ = \"Bananas are yellow.\";\nstring myString2 = \"Oranges are orange.\";\nvar\
    \ result = string.Compare(myString1, myString2);\n\nif (result == 0)\n{\n    Console.WriteLine(\"\
    Strings match.\");\n}\nelse if (result < 0)\n{\n    Console.WriteLine(\"myString1\
    \ precedes myString2 in sort order.\");\n}\nelse if (result > 0)\n{\n    Console.WriteLine(\"\
    myString2 precedes myString1 in sort order.\");\n}\n```\n\nOutput:\nmyString1\
    \ precedes myString2 in sort order.\n\n## 30.8 Changing string case\n\nThe case\
    \ of the characters in a string may be changed using the `ToUpper()` and `ToLower()`\
    \ methods. Both of these methods return a modified string rather than changing\
    \ the actual string. For example:\n\n```c\nstring myString = \"Hello World\";\n\
    string newString;\nnewString = myString.ToUpper();\nConsole.WriteLine(newString);\n\
    newString = myString.ToLower();\nConsole.WriteLine(newString);\n```\n\nOutput:\n\
    HELLO WORLD\nhello world\n\n## 30.9 Splitting a string into multiple parts\n\n\
    A string may be separated into multiple parts using the `Split()` method. `Split()`\
    \ takes as an argument the character to use as the delimiter to identify the points\
    \ at which the string is to be split. Returned from the method call is an array\
    \ containing the individual parts of the string. For example, the following code\
    \ splits a string up using the comma character as the delimiter. The results are\
    \ placed in an array called `myColors` and a `foreach` loop then reads each item\
    \ from the array and displays it:\n\n```c\nstring myString = \"Red, Green, Blue,\
    \ Yellow, Pink, Purple\";\nstring[] myColors = myString.Split(',');\nforeach (string\
    \ color in myColors)\n{\n    Console.WriteLine(color);\n}\n```\n\nOutput:\nRed\
    \ Green Blue Yellow Pink Purple\n\nAs we can see, the `Split()` method broke the\
    \ string up as requested, but we have a problem in that the spaces are still present.\
    \ Fortunately, C# provides a method to handle this.\n\n## 30.10 Trimming and padding\
    \ strings\n\nUnwanted leading and trailing spaces can be removed from a string\
    \ using the `Trim()` method. When called, this method returns a modified version\
    \ of the string with both leading and trailing spaces removed:\n\n```c\nstring\
    \ myString = \" hello \";\nConsole.WriteLine(\"[\" + myString + \"]\");\nConsole.WriteLine(\"\
    [\" + myString.Trim() + \"]\");\n```\n\nOutput:\n[ hello ]\n[hello]\n\nIf you\
    \ only need to remove leading or trailing spaces, use either the `TrimStart()`\
    \ or `TrimEnd()` method respectively.\n\nThe inverse of the trim methods are the\
    \ `PadLeft()` and `PadRight()` methods. These methods allow leading or trailing\
    \ characters to be added to a string. The methods take as arguments the total\
    \ number of characters to which the string is to be padded and the padding character:\n\
    \n```c\nstring myString = \"hello\";\nstring newString;\nnewString = myString.PadLeft(10,\
    \ ' ');\nnewString = newString.PadRight(20, '*');\nConsole.WriteLine(\"[\" + newString\
    \ + \"]\");\n```\n\nOutput:\n[ hello**********]\n\n## 30.11 String replacement\n\
    \nParts of a string may be replaced using the `Replace()` method. This method\
    \ takes the part of the string to be replaced and the replacement string as arguments\
    \ and returns a new string reflecting the change. The `Replace()` method will\
    \ replace all instances of the string:\n\n```c\nstring myString = \"Hello World\"\
    ;\nstring newString;\nConsole.WriteLine(myString);\nnewString = myString.Replace(\"\
    Hello\", \"Goodbye\");\nConsole.WriteLine(newString);\n```\n\nOutput:\nHello World\n\
    Goodbye World\n\n## 30.12 Take the knowledge test\n\nClick the link below or scan\
    \ the QR code to test your knowledge and understanding of C# strings:\n\n[https://www.answertopia.com/nppx](https://www.answertopia.com/nppx)\n\
    \n![](images/image-G3POG6U1.jpg)\n\n## 30.13 Summary\n\nC# strings are collections\
    \ of characters used for human-computer interaction. Strings can be created using\
    \ literals, `new` keyword, or implicit typing. They can be manipulated using methods\
    \ like `Length()`, `ToCharArray()`, and `Concat()`, and iterated over using `foreach`\
    \ loops.\n\nC# provides various methods for comparing strings, including equality\
    \ operators like `Equals()`, and `Compare()`. The `ToUpper()` and `ToLower()`\
    \ methods can change string case, while `Split()` separates strings into parts.\
    \ `Trim()` removes leading and trailing spaces, while `PadLeft()` and `PadRight()`\
    \ add characters to the beginning or end of a string.\n\n# 31. String Formatting\n\
    \nIn addition to the wide selection of string manipulation functions outlined\
    \ in the previous chapter, the `string` class also provides the `Format()` method.\n\
    \nThe primary purpose of the C# `string.Format()` method is to provide a way of\
    \ inserting string, numerical, or boolean values into a string with additional\
    \ formatting control.\n\n## 31.1 The Syntax of the string Format() method\n\n\
    The general syntax of the `string Format()` method is as follows:\n\n```c\nstring.Format(\"\
    format string\", arg1, arg2, .... );\n```\n\nThe format string is the string into\
    \ which the values will be placed. Within this string are placeholders that indicate\
    \ the location of each value within the string. Placeholders take the form of\
    \ braces `{}` surrounding a number indicating the corresponding argument to be\
    \ substituted for the placeholder. Following on from the format string is a comma-separated\
    \ list of arguments. There must be an argument for each of the placeholders.\n\
    \n## 31.2 Creating the StringFormatDemo project\n\nLaunch VS Code, open your “C#\
    \ Essentials” workspace folder, and create a new .NET Console App project named\
    \ `StringFormatDemo`.\n\nAfter creating the project, open the `Program.cs` file\
    \ and use it to try out the examples in the rest of this chapter.\n\n## 31.3 A\
    \ simple string formatting example\n\nThe following code example demonstrates\
    \ a straightforward use of the `string Format()` method:\n\n```c\nstring newString;\n\
    newString = string.Format(\"There are {0} cats in my {1} and no {2}\", 2, \"house\"\
    , \"dogs\");\nConsole.WriteLine (newString);\n```\n\nOutput:\nThere are 2 cats\
    \ in my house and no dogs\n\nLet’s quickly review the `string Format()` method\
    \ call in the above example. The format string contains three placeholders indicated\
    \ by `{0}`, `{1}`, and `{2}`. Following the format string are the arguments to\
    \ be used in each placeholder. So, for example, `{0}` is replaced by the first\
    \ argument (the number `2`), the `{1}` by the second argument (the string “house”),\
    \ and so on.\n\nIf you cast your mind back to the “C# Variables and Constants”\
    \ chapter, you will probably wonder how this compares to the string interpolation\
    \ technique we have used countless times throughout the book. As we will see below,\
    \ C# string formatting becomes more useful when combined with format controls.\n\
    \n## 31.4 Using format controls\n\nSo far, we have only substituted arguments\
    \ for placeholders, but we have not changed the format of the arguments before\
    \ they are displayed. This essentially instructs the `Format()` method to use\
    \ the default formatting for each argument type when displaying the string. Perhaps\
    \ the most powerful aspect of the `Format()` method is the ability to use format\
    \ controls within the placeholders to control the output format.\n\nFormat controls\
    \ appear inside the braces (`{}`) of the placeholders. The format of a placeholder\
    \ with a format control is as follows:\n\n```\n{n:controlx}\n```\n"
