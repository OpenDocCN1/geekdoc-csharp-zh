    /Temp/Images\", true);\n```\n\n## 29.8 更改当前工作目录\n\n可以通过调用 `Directory.SetCurrentDirectory()`\
    \ 方法并将目标目录作为参数传递来更改当前工作目录。与所有目录相关操作一样，提供的路径可以是绝对路径或相对路径。向 `Program.cs` 文件添加以下行将目录更改到\
