  trans: "\n[content]\n\n然而，面向对象的编程指南建议字段应该被保护免受直接访问（即私有字段）。在 C# 中，这通过声明属性来实现，属性反过来提供了对底层私有字段的访问。\n\
    \n属性有一个名称，并声明了特殊的 `get` 和 `set` 方法（称为访问器方法），这些方法使用以下语法提供对底层字段的访问：\n\n```csharp\n\
    public string <property name=\"\">{</property>\n    get {\n        return <field\
    \ name=\"\">;</field>\n    }\n    set {\n        <field name=\"\">= value;</field>\n\
    \    }\n}\n```\n\n`get` 方法的代码返回赋值给字段的值。而 `set` 方法传递名为 `value` 的变量，该变量可以被赋值给字段。\n\
    \n使用这种方法，我们现在可以实现一个属性来封装我们的 `firstname` 字段：\n\n```csharp\npublic class MyClass\n\
    {\n    private string _firstname = \"\";\n    public string FirstName {\n    \
    \    get {\n            return _firstname;\n        }\n        set {\n       \
    \     _firstname = value;\n        }\n    }\n}\n```\n\n当字段与属性关联时，该字段应声明为私有，并且名称通常以下划线\
    \ (`_`) 为前缀。\n\n声明访问器的更简洁的方法是使用 lambda 运算符 (`=>`) 来为 get 和 set 表达式赋值（Lambda 主题将在“C#\
    \ 匿名方法、Lambdas 和本地函数”章节中介绍）：\n\n```csharp\npublic string <property name=\"\">{</property>\n\
    \    get => <field name=\"\">;</field>\n    set => <field name=\"\">= value;</field>\n\
    }\n```\n\n使用上述方法，我们可以如下所示简化我们的 `MyClass` 示例：\n\n```csharp\npublic class MyClass\n\
    {\n    private string _firstname = \"\";\n    public string FirstName {\n    \
    \    get => _firstname;\n        set => _firstname = value;\n    }\n}\n```\n\n\
    是否将所有字段封装在属性中且不设置任何公共字段，取决于个人偏好，取决于你想要在多大程度上严格遵守面向对象的编程规范。即使在微软的 C# 参考文档中，你也会看到这两种方法的示例。为了简洁起见，我们在书中的许多示例将使用公共字段。\n\
    \n## 13.8 为 BankAccount 类添加成员\n\n我们现在可以扩展 `BankAccount` 类，添加字段来存储账户名称和账号。遵循数据封装的理念，我们将这些字段设为私有，并使用属性提供访问：\n\
    \n```csharp\nnamespace ObjectDemo;\n\npublic class BankAccount\n{\n    private\
    \ string _accountName = \"\";\n    private int _accountNumber = 0;\n    public\
    \ string AccountName\n    {\n        get => _accountName;\n        set => _accountName\
    \ = value;\n    }\n    public int AccountNumber\n    {\n        get => _accountNumber;\n\
    \        set => _accountNumber = value;\n    }\n}\n```\n\n在类中添加了一些字段和属性后，我们需要简要检查其他数据成员类型，并学习如何从类创建对象实例。\n\
    \n## 13.9 静态、只读和常量数据成员\n\n除了我们目前看到的数据成员类型外，C# 还支持几种额外的成员类型。\n\nC# 静态成员类型（也称为类属性）存储该类所有对象实例共的数据值。例如，所有银行客户在储蓄账户上获得的利率相同。因此，`interestRate`\
    \ 成员应声明为静态，因为它是该类所有对象实例共享的。静态成员使用 `static` 关键字声明。例如：\n\n```csharp\npublic class\
    \ BankAccount\n{\n    private static int interestRate;\n}\n```\n\n静态成员通过类进行访问，而不是通过对象。例如，我们可以通过如下方式引用\
    \ `BankAccount` 类来更改所有对象实例的 `interestRate` 成员：\n\n`BankAccount.interestRate =\
    \ 10;`\n\n对于不能修改的数据成员，使用了 `const` 和 `readonly` 关键字。\n\n## 13.10 从类实例化对象\n\n现在我们已经了如何编写类，需要知道如何从类中创建对象。从类创建对象被称为实例化。第一步是使用\
    \ `new` 关键字创建实例：\n\n```csharp\nBankAccount accountAccount = new BankAccount();\n\
    ```\n\n或者，可以在单条语句中声明对象并对其进行初始化：\n\n```csharp\nBankAccount accountAccount = new\
    \ BankAccount();\n```\n\n也可以如下所示声明对象变量并为其赋值：\n\n```csharp\nusing ObjectDemo;\n\
    BankAccount accountAccount = new BankAccount();\naccountAccount.AccountName =\
    \ \"John Smith\";\naccountAccount.AccountNumber = 53211;\n\nConsole.WriteLine($\"\
    Customer Name is {accountAccount.AccountName}\");\nConsole.WriteLine($\"Account\
    \ Number = {accountAccount.AccountNumber}\");\n```\n\n当属性在对象创建后立即初始化时，可以使用对象初始化器将代码简化如下：\n\
    \n```csharp\nBankAccount accountAccount = new()\n{\n    AccountName = \"John Smith\"\
    ,\n    AccountNumber = 53211\n};\n```\n\n## 13.11 访问对象成员\n\n现在我们有了一个 `BankAccount`\
    \ 类的实例，需要知道如何访问它的成员。首先，你会记得我们将某些成员声明为公共，而另一些声明为私有。公共成员可以使用所谓的“点符号法”（dot notation）从对象外部完全访问。\n\
    \n点符号法是一种通过指定对象和用点 (`.`) 分隔的名称来访问对象的机制。例如，访问名为 `accountAccount` 的对象的 `accountName`\
    \ 成员，我们将使用 `accountAccount.AccountName`。\n\n修改 `Program.cs` 文件如下，以访问 `BankAccount`\
    \ 类的公共属性：\n\n```csharp\nBankAccount accountAccount = new();\naccountAccount.AccountName\
    \ = \"John Smith\";\naccountAccount.AccountNumber = 53211;\n\nConsole.WriteLine($\"\
    Customer Name is {accountAccount.AccountName}\");\nConsole.WriteLine($\"Account\
    \ Number = {accountAccount.AccountNumber}\");\n```\n\n运行应用并检查输出如下：\n\n```\nCustomer\
    \ Name is John Smith\nAccount Number = 53211\n```\n\n## 13.12 为 C# 类添加方法\n\n类方法本质上是可以在类上下文中调用的以执行特定任务的代码例程。方法有两种形式：静态方法（也称为类方法）和实例方法。静态方法在类级别操作，例如创建新的类实例。相反，实例方法仅对类的实例操作（例如，对成员变量进行算术运算并返回结果）。\n\
    \n实例方法在所属类的左大右括号内部声明，并使用标准的 C# 方法语法声明。静态方法的声明方式与实例方法相同，只是 `static` 关键字位于声明。\n\n\
    例如，编辑 `BankAccount` 类并添加一个显示名称的方法：\n\n```csharp\npublic class BankAccount\n{\n\
    \    // ... 现有的字段和属性 ...\n    public void DisplayName()\n    {\n        Console.WriteLine(AccountName);\n\
    \    }\n}\n```\n"
- fmt: "\n```csharp\npublic void DisplayName()\n{\n    Console.WriteLine($\"Customer\
    \ name is {AccountName}\");\n}\n```\n\nThe method above is an instance method,\
    \ so the `static` keyword does not precede it and can be called as follows:\n\n\
    ```csharp\nBankAccount custAccount = new()\n{\n    AccountName = \"John Smith\"\
    ,\n    AccountNumber = 53211\n};\n\ncustAccount.DisplayName();\nConsole.WriteLine($\"\
    Account Number = {custAccount.AccountNumber}\");\n```\n\nWhen designing the `BankAccount`\
    \ class, it might be helpful to call a `static` method on the class itself to\
    \ identify the maximum allowable balance that class instances can store. This\
    \ would enable an application to identify whether the `BankAccount` class is suitable\
    \ for storing details of a new customer without creating a class instance. We\
    \ will name this method `GetMaxBalance()` and implement it as follows:\n\n```csharp\n\
    public class BankAccount \n{\n    public static double GetMaxBalance()\n    {\n\
    \        return(10000000.00);\n    }\n}\n```\n\nWith the method declared, it can\
    \ be called directly on the class without the need to create an instance as follows:\n\
    \n```csharp\ndouble maxBalance = BankAccount.GetMaxBalance();\nConsole.WriteLine($\"\
    Maximum allowed balance = ${maxBalance}\");\nBankAccount custAccount = new()\n\
    {\n```\n\nRunning the app should produce the following output:\n\n```\nMaximum\
    \ allowed balance = $10000000\nCustomer name is John Smith\nAccount Number = 53211\n\
    ```\n\nNow that we have looked at method class members, the next task is to look\
    \ at two special class methods: constructors and finalizers.\n\n## 13.13 C# constructors\n\
    \nDespite the grand-sounding names, C# class constructors and finalizers are nothing\
    \ more than methods that get called when an object is instantiated and destroyed.\
    \ The constructor is particularly useful for allowing initialization values to\
    \ be passed through to an object at creation time. Let’s say that we would like\
    \ to be able to initialize the `_accountName` and the `_accountNumber` members\
    \ at the point that we initialize the `custAccount` object. To do so, we need\
    \ to declare a constructor.\n\nConstructors are declared the same way as other\
    \ methods with the exception that the name of the method must match the class\
    \ name. For example, add a constructor to our `BankAccount` class as follows:\n\
    \n```csharp\npublic class BankAccount\n{\n    private string _accountName;\n \
    \   private int _accountNumber;\n    // Constructor\n    public BankAccount(string\
    \ accountName, int accountNumber)\n    {\n        _accountName = accountName;\n\
    \        _accountNumber = accountNumber;\n    }\n}\n```\n\nThe constructor can\
    \ be used to initialize these members at the point that the instance is created:\n\
    \n```csharp\nBankAccount custAccount = new BankAccount(\"Fred Wilson\", 123456);\n\
    custAccount.DisplayName();\n```\n\nThe type of constructor outlined above is particularly\
    \ useful when tasks need to be performed in addition to assigning values to properties.\
    \ For example, the `BankAccount` constructor might include some logic to catch\
    \ an empty customer name string:\n\n```csharp\npublic BankAccount(string accountName,\
    \ int accountNumber)\n{\n    if (accountName == \"\")\n        _accountName =\
    \ \"Anonymous\";\n    else\n        _accountName = accountName;\n    _accountNumber\
    \ = accountNumber;\n}\n```\n\nA class can contain multiple constructors, each\
    \ with a unique set of parameters. Consider the following changes to the `BankAccount`\
    \ class definition:\n\n```csharp\npublic class BankAccount\n{\n    private string\
    \ _accountName;\n    private int _accountNumber;\n    private bool _isActive =\
    \ false;\n    // Constructor\n    public BankAccount(string accountName, int accountNumber)\n\
    \    {\n        _accountName = accountName;\n        _accountNumber = accountNumber;\n\
    \    }\n    public BankAccount(string accountName, int accountNumber, bool isActive)\n\
    \    {\n        _accountName = accountName;\n        _accountNumber = accountNumber;\n\
    \        _isActive = isActive;\n    }\n    public bool IsActive {\n        get\
    \ => _isActive;\n    }\n}\n```\n\nWith these changes, `BankAccount` instances\
    \ may be created using:\n\n```csharp\nBankAccount custAccount = new(\"John Smith\"\
    , 53211);\nBankAccount cust2 = new(\"John Smith\", 53211, true);\n```\n\n## 13.14\
    \ C# primary constructors\n\nWhen a constructor’s sole purpose is to assign parameters\
    \ to the class, a primary constructor is recommended. For example, placing the\
    \ parameters after the class name:\n\n```csharp\npublic class BankAccount(string\
    \ accountName, int accountNumber)\n{\n    private string _accountName = accountName;\n\
    \    private int _accountNumber = accountNumber;\n}\n```\n\n## 13.15 C# finalizers\n\
    \nFinalizers are used to clean up any resources a class uses when the object is\
    \ destroyed. Unlike constructors, which can be explicitly called using the `new`\
    \ keyword, there is no way to call a finalizer. They are defined in the same way\
    \ as constructors, with the exception that the name is preceded by the tilde (`~`):\n\
    \n```csharp\n// Finalizer\n~BankAccount() {\n}\n```\n\n## 13.16 The “this” keyword\n\
    \nWhen constructing classes in C#, you may encounter situations where a property\
    \ that is local to a method conflicts with a class property. This is particularly\
    \ common when using public fields. Take, for example, the following sample class\
    \ in which the parameter names match those of public fields:\n\n```csharp\nclass\
    \ DemoClass\n{\n    public string name;\n    public int age;\n    public DemoClass(string\
    \ name, int age)\n    {\n        name = name;\n        age = age;\n    }\n}\n\
    ```\n\nWhen the above code runs, there will be no name and the age will be 0 even\
    \ though age was set to 37 when the class instance was created.\n\n```csharp\n\
    DemoClass demo = new(\"Mark\", 37);\nConsole.WriteLine($\"{demo.name} is {demo.age}\
    \ years old.\");\n```\n\nIn addition, the compiler will issue a warning which\
    \ reads: `warning CS1717: Assignment made to same variable; did you mean to assign\
    \ something else?`. The problem here is that the compiler doesn’t know which `name`\
    \ and `age` variables are being referenced in the following initializer code:\n\
    \n```csharp\npublic DemoClass(string name, int age) {\n    name = name;\n    age\
    \ = age;\n}\n```\n\nTo resolve this problem, we need a way to tell the compiler\
    \ that the method parameter values are to be assigned to the corresponding public\
    \ field values. We can do this using the `this` keyword. In this context, the\
    \ `this` keyword represents the current class instance. To differentiate the conflicting\
    \ `name` and `age` variables, we need to use the `this` keyword as follows:\n\n\
    ```csharp\npublic DemoClass(string name, int age) {\n    this.name = name;\n \
    \   this.age = age;\n}\n```\n\n## 13.17 Take the knowledge test\n\nClick the link\
