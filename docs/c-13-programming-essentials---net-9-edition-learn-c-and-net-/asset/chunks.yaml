    o


    W


    o


    r


    l


    d


    ## 30.5 String character iteration


    Given that we can treat each character in an array as an array element, it should
    not surprise you to learn that we can iterate through the characters of a string
    using a foreach loop as follows:


    string myString = "Hello World";


    foreach (char c in myString) {


        Console.WriteLine(c);


    }


