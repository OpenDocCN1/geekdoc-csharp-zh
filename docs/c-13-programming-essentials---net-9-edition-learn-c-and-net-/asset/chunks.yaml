  trans: "\n\n除了这些值类型和引用类型的区别外，结构体不支持像类那样的继承和子类。句话说，一个结构体无法继承另一个结构体。与类不同，结构体不能包含析构方法（finalizer）。结构体的成员不能指定为\
    \ `abstract`、`virtual` 或 `protected`。然而，结构体可以实现接口。\n\n## 20.5 只读结构体\n\n可以使用 `readonly`\
    \ 修饰符将结构体声明为只读。这样声明后，结构体的所有数据成员也必须声明为只读。对于字段成员（field），这需要使用 `readonly` 修饰符。另一方面，属性要么被声明为只读，要么使用\
    \ `init`-只读访问器（该主题在“C# 面对象编程导论”章节中介绍）。\n\n例如，下面的结构体包含一个只读字段和一个 `init`-只读属性：\n\n\
    ```csharp\nnamespace StructureDemo;\n\npublic readonly struct SampleStruct(string\
    \ name)\n{\n    private readonly string _name = name;\n\n    public string Name\
    \ {\n        get => _name;\n    }\n\n    public string BuildHelloMsg() {\n   \
    \     return \"Hello \" + _name;\n    }\n}\n```\n\n## 20.6 知识测试\n\n点击下方链接或扫描二维码以测试你对\
    \ C# 结构体的知识和理解：\n\n[`www.answertopia.com/i5tf`](https://www.answertopia.com/i5tf)\n\
    \n![](img/image-949XAYQJ.jpg)\n\n## 20.7 总结\n\nC# 结构体和类提供了一种创建实例以定义属性、存储值和定义方法的机制。尽管这两种机制看起来相似，但存在显著的本质差异，特别是当结构体和类实例被复制或传递给方法时。类被分类为引用类型实例，而结构体是值类型。当结构体实例被复制或传递时，会创建一个包含其数据的全新实例副本。另一方面，类实例是通过引用传递和复制的，每个引用都指向同一个类实例。类的其他特性还包括支持继承和析构函数。\n\
    \n## 21. C# 元组类型 Tuple Type\n\n在“C# 方法”章节中，我们学习了如何在 C# 中创建可以传递参数并返回结果的方法。本章将重点介绍\
    \ C# 元组类型，并理解它如何将一组值组合成单一实体。一旦创建，元组可以从一个方法传递到另一个方法，同时允许方法在单个返回值中返回多个结果。元组可以用极少的代码创建，并存储任何类型的数据。此外，元组内部存储的值不需要是相同类型。\n\
    \n### 21.1 创建 TupleDemo 项目\n\n要尝试 C# 元组类型，请启动 `VS Code`，打开你的“C# Essentials”工作空间文件夹并创建一个名为\
    \ `TupleDemo` 的新 .NET 控制台项目。\n\n## 21.2 声明元组\n\n当我们声明元组时，需要为其提供要存储的值以及可选相应的值类型。声明元组的语法如下：\n\
    \n`(<type1>, <type2>, ...) <tuplename>= (<value1>, <value2>, ...)`\n\n例如，如下所示修改\
    \ `Program.cs` 文件，添加顶层语句、`Main()` 方法以及一个包含元组声明的 `GetProductData()` 方法：\n\n```csharp\n\
    namespace TupleDemo\n{\n    internal class Program\n    {\n        static void\
    \ Main(string[] args)\n        {\n            GetProductData();\n        }\n \
    \       private static void GetProductData()\n        {\n            (int, string,\
    \ double) myTuple = (10, \"Refrigerator\", 432.43);\n        }\n    }\n}\n```\n\
    \n如果你不想声明每个元组值的类型，可以使用 `var` 关键字让编译器来推断值类型：\n\n`var myTuple = (10, \"Refrigerator\"\
    , 432.43);`\n\n## 21.3 访问元组值\n\n可以使用几种不同的技术访问元组的元素。特定的元组值可以使用点符号法来访问 `Item <n>`，其中\
    \ `<n>` 是项目的编号（第一个值位于位置 1）。例如，下面的代码从元组中提取第 2 个元素，将其赋值给变量并写入控制台：\n\n```csharp\n\
    private static void GetProductData()\n{\n    var myTuple = (10, \"Refrigerator\"\
    , 432.43);\n    Console.WriteLine(myTuple.Item2);\n}\n```\n\n通过数字访问元组元素的替代方案是使用字段名。\n\
    \n## 21.4 字段名\n\n## 创建元组时，你可以为每个值分配名称。当使用类型推断初始化元组时，字段名将放在每个值之前：\n\n`(Count: 10,\
    \ Product: \"Refrigerator\", Price: 432.43)`\n\n一旦分配了字段名，就可以像下面所示访问对应的值：\n\n```csharp\n\
    private static void GetProductData()\n{\n    var myTuple = (Count: 10, Product:\
    \ \"Refrigerator\", Price: 432.43);\n    Console.WriteLine(myTuple.Price);\n \
    \   Console.WriteLine(myTuple.Product);\n    Console.WriteLine(myTuple.Count);\n\
    }\n```\n\n应用程序运行时将出现以下输出：\n```\nPrice = 432.43\n```\n\n## 21.5 从方法返回元组\n\n元组对于从方法返回多个结果特别别有用。例如，假设我们需要的不是显示信息，而是让\
    \ `GetProductData()` 方法返回数据。为了实现这一点，需要在方法声明中包含元组的类型：\n\n```csharp\nprivate static\
    \ (int, string, double) GetProductData()\n{\n    return (10, \"Refrigerator\"\
    , 432.43);\n}\n```\n\n或者，可以将单个值放在 `return` 语句后的括号中：\n\n```csharp\nprivate static\
    \ (int, string, double) GetProductData()\n{\n    return (10, \"Refrigerator\"\
    , 432.43);\n}\n```\n\n调用时，返回的元组可以赋值给变量，并使用点符号访问：\n\n```csharp\nstatic void Main(string[]\
    \ args)\n{\n    var myTuple = GetProductData();\n    Console.WriteLine($\"Price\
