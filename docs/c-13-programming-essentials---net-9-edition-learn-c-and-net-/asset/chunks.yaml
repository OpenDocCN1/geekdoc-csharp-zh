    C# strings are collections of characters used for human-computer interaction.
    Strings can be created using literals, new keyword, or implicit typing. They can
    be manipulated using methods like Length(), ToCharArray(), and Concat(), and iterated
    over using foreach loops.


    C# provides various methods for comparing strings, including equality operators
    like Equals(), and Compare(). The ToUpper() and ToLower() methods can change string
    case, while Split() separates strings into parts. Trim() removes leading and trailing
    spaces, while PadLeft() and PadRight() add characters to the beginning or end
    of a string.


    ## 31.


    ### C#


    ## String Formatting


    In addition to the wide selection of string manipulation functions outlined in
    the previous chapter, the string class also provides the Format() method.


    The primary purpose of the C# string Format() method is to provide a way of inserting
    string, numerical, or boolean values into a string with additional formatting
    control.


    ## 31.1 The Syntax of the string Format() method


    The general syntax of the string Format() method is as follows:


    string.Format("format string", arg1, arg2, .... );


    The format string is the string into which the values will be placed. Within this
    string are placeholders that indicate the location of each value within the string.
    Placeholders take the form of braces {} surrounding a number indicating the corresponding
    argument to be substituted for the placeholder. Following on from the format string
    is a comma-separated list of arguments. There must be an argument for each of
    the placeholders.


    ## 31.2 Creating the StringFormatDemo project


    Launch VS Code, open your “C# Essentials” workspace folder, and create a new .NET
    Console App project named StringFormatDemo.


    After creating the project, open the Program.cs file and use it to try out the
    examples in the rest of this chapter.


    ## 31.3 A simple string formatting example


    The following code example demonstrates a straightforward use of the string Format()
    method:


    string newString;


    newString = string.Format("There are {0} cats in my {1} and no {2}", 2, "house",
    "dogs");


    Console.WriteLine (newString);


    Output:


    There are 2 cats in my house and no dogs


    Let”s quickly review the string Format() method call in the above example. The
    format string contains three placeholders indicated by {0}, {1}, and {2}. Following
    the format string are the arguments to be used in each placeholder. So, for example,
    {0} is replaced by the first argument (the number 2), the {1} by the second argument
    (the string “house”), and so on.


    If you cast your mind back to the “C# Variables and Constants” chapter, you will
    probably wonder how this compares to the string interpolation technique we have
    used countless times throughout the book. As we will see below, C# string formatting
    becomes more useful when combined with format controls.


    ## 31.4 Using format controls


    So far, we have only substituted arguments for placeholders, but we have not changed
    the format of the arguments before they are displayed. This essentially instructs
    the Format() method to use the default formatting for each argument type when
    displaying the string. Perhaps the most powerful aspect of the Format() method
    is the ability to use format controls within the placeholders to control the output
    format.


    Format controls appear inside the braces ({}) of the placeholders. The format
    of a placeholder with a format control is as follows:


