- fmt: "\nEarlier in the book, we used logical expressions in `C#` to determine whether\
    \ something is true or false. Much of the art of programming involves writing\
    \ code that makes decisions based on one or more criteria. Such decisions define\
    \ which code gets executed and which gets bypassed when running the program.\n\
    \nIn previous chapters, the `if` statement has been used in some examples. In\
    \ this chapter, we will look at `if` statements in more detail.\n\n## 9.2 Using\
    \ the if statement\n\nThe `if` statement is the most basic of the control flow\
    \ options available to the `C#` programmer. Programmers familiar with `C`, `C++`,\
    \ or `Java` will immediately be comfortable using `C#` `if` statements.\n\nThe\
    \ basic syntax of the `C#` `if` statement is as follows:\n\n```csharp\nif (boolean\
    \ expression) {\n    // C# code to be performed when the expression evaluates\
    \ to true here\n}\n```\n\nIf the `boolean` `-sp;-expression` evaluates to `true`,\
    \ then the code in the statement’s body is executed. The body of the statement\
    \ is enclosed in braces (`{}`). If, on the other hand, the expression is evaluated\
    \ as `false`, the code in the body of the statement is skipped.\n\nFor example,\
    \ if a decision needs to be made depending on whether one value is greater than\
    \ another:\n\n```csharp\nint x = 10;\n\nif ( x > 9 ) {\n    Console.WriteLine(\"\
    x is greater than 9!\");\n}\n```\n\nClearly, `x` is greater than `9`, causing\
    \ the message to appear.\n\nNote: If the body contains only one statement, the\
    \ enclosing braces (`{}`) may be omitted. These must be added once more than one\
    \ statement is included in the body.\n\n## 9.3 Using if … else … statements\n\n\
    The next variation of the `if` statement allows us to specify some code to execute\
    \ if the expression in the `if` statement is evaluated as `false` using the following\
    \ syntax:\n\n```csharp\nif (boolean expression) {\n    // Code to be executed\
    \ if the expression is true\n} else {\n    // Code to be executed if the expression\
    \ is false\n}\n```\n\nUsing the above syntax, we can now extend our previous example\
    \ to display a different message if the comparison expression evaluates to be\
    \ `false`:\n\n```csharp\nint x = 8;\n\nif ( x > 9 ) {\n    Console.WriteLine(\"\
    x is greater than 9!\");\n} else {\n    Console.WriteLine(\"x is less than 9!\"\
    );\n}\n```\n\nIn this case, the second `WriteLine()` statement would execute if\
    \ the value of `x` was less than `9`.\n\nAs with the standalone `if` statement,\
    \ the braces (`{}`) are optional if the body only contains one statement. The\
    \ following is, therefore, valid code:\n\n```csharp\nint x = 8;\n\nif ( x > 9\
    \ ) {\n    Console.WriteLine(\"x is greater than 9!\");\n} else {\n    Console.WriteLine(\"\
    x is less than 9!\");\n}\n```\n\n## 9.4 Using if … else if … statements\n\nSo\
    \ far, we have looked at `if` statements that make decisions based on the result\
    \ of a single logical expression. Sometimes, it becomes necessary to make decisions\
    \ based on several different criteria. For this purpose, we can use the `if` …\
    \ `else if` … construct, the syntax for which is as follows:\n\n```csharp\nif\
    \ (boolean expression) {\n    // Code to be executed if the expression is true\n\
    } else if (boolean expression) {\n    // Code to be executed if the expression\
    \ is true\n} else if .....\n} else {\n    // Code to be executed if previous expressions\
    \ are all false\n}\n```\n\nNote: The final `else` can be omitted if no action\
    \ is to be taken if all the boolean expressions evaluate to a `false` result.\n\
    \nThe following code excerpt demonstrates the use of the `if` … `else if` … construct:\n\
    \n```csharp\nint x = 11;\n\nif (x == 10) {\n    Console.WriteLine(\"x is 10\"\
    );\n} else if (x == 9) {\n    Console.WriteLine(\"x is 9\");\n} else if (x ==\
    \ 8) {\n    Console.WriteLine(\"x is 8\");\n} else {\n    Console.WriteLine(\"\
    x is some other number\");\n}\n```\n\nThis approach works well for a moderate\
    \ number of comparisons but can become cumbersome for a larger volume of expression\
    \ evaluations. The `C#` `switch` statement provides a more flexible and efficient\
    \ solution for such situations. The `switch` statement will be covered in the\
    \ next chapter.\n\n## 9.5 Take the knowledge test\n\nClick the link below or scan\
    \ the QR code to test your knowledge and understanding of `C#` control flow:\n\
    \n[https://www.answertopia.com/xzu2](https://www.answertopia.com/xzu2)\n\n![](images/image-KAH4PRCP.jpg)\n\
    \n## 9.6 Summary\n\nThe term control flow describes the logic that dictates the\
    \ execution path through an application’s source code as it runs. This chapter\
    \ has examined conditional control flow and explored how the `if` and `else` statements\
    \ are used to implement this type of flow logic.\n\n## 10. The C# switch Statement\n\
    \nIn this chapter, we will introduce the `C#` `switch` statement and demonstrate\
    \ why it is a better alternative to complicated `if` ... `else if` ... statements.\n\
    \nIn the previous chapter, we looked at controlling program execution flow using\
    \ the `if` and `else` statements. While these statement constructs work well for\
    \ testing a limited number of conditions, they quickly become unwieldy when dealing\
    \ with more significant numbers of possible conditions. `C#` has inherited the\
    \ `switch` statement from the C language.\n\nIn this chapter, we will explore\
    \ the `switch` statement in detail.\n\n### 10.1 Why use the switch statement?\n\
    \nFor a few evaluations, the `if` ... `else if` construct is perfectly adequate.\
    \ Unfortunately, any more than three scenarios can quickly make such construct\
    \ hard to read. Imagine, however, if instead of 3 models, we had to test for 10\
    \ or 20. Clearly, a more straightforward solution is needed, and that solution\
    \ is the `switch` statement.\n\n```csharp\nstring carModel = \"Corolla\";\nstring\
    \ carManufacturer;\n\nif ((String.Compare(carModel, \"Patriot\") == 0) ||\n(String.Compare(carModel,\
    \ \"Liberty\") == 0) ||\n(String.Compare(carModel, \"Wrangler\") == 0)) {\n  \
    \  carManufacturer = \"Jeep\";\n} else if (String.Compare(carModel, \"Focus\"\
    ) == 0) {\n    carManufacturer = \"Ford\";\n} else if (String.Compare(carModel,\
    \ \"Corolla\") == 0) {\n    carManufacturer = \"Toyota\";\n} else {\n    carManufacturer\
    \ = \"unknown\";\n}\n\nConsole.WriteLine($\"Manufacturer is {carManufacturer}\"\
    );\n```\n\n### 10.2 Using the switch statement\n\nThe syntax for a `C#` `switch`\
