    \n```csharp\nBankAccount custAccount = new()\n{\n    AccountName = \"John Smith\"\
    ,\n    AccountNumber = 53211\n};\n\ncustAccount.DisplayName();\nConsole.WriteLine($\"\
    Account Number = {custAccount.AccountNumber}\");\n```\n\n在设计 `BankAccount` 类时，调用类本身的\
    \ `static` 方法来识别该类实例可以存储的最大允许余额可能会很有帮助。这将允许应用程序在不创建类实例的情况下识别 `BankAccount` 类是否适合存储新客户的详情。我们将此方法命名为\
    \ `GetMaxBalance()` 并对其所示实现：\n\n```csharp\npublic class BankAccount \n{\n    public\
    \ static double GetMaxBalance()\n    {\n        return(10000000.00);\n    }\n\
    }\n```\n\n声明方法后，可以直接在类上调用它，而无需创建实例，如下所示：\n\n```csharp\ndouble maxBalance = BankAccount.GetMaxBalance();\n\
    Console.WriteLine($\"Maximum allowed balance = ${maxBalance}\");\nBankAccount\
    \ custAccount = new()\n```\n\n运行该程序应该产生以下输出：\n\n```\nMaximum allowed balance =\
    \ $10000000\nCustomer name is John Smith\nAccount Number = 53211\n```\n\n现在我们已经查看了方法的类成员，下一个任务是查看两个特殊的类方法：构造函数和析构函数。\n\
    \n## 13.13 C# 构造函数\n\n尽管名称听起来很大气，但 C# 类构造函数和析构函数只不过是在对象被实例化和销毁时调用的方法。构造函数特别用于允许在创建时将初始化值传递给对象。假设我们希望在初始化\
    \ `custAccount` 对象时初始化 `_accountName` 和 `_accountNumber` 成员。为了实现这一点，我们需要声明一个构造函数。\n\
    \n构造函数的声明方式与其他方法相同，不同之处方法方法必须与类名匹配。例如，如下所示为 `BankAccount` 类添加一个构造函数：\n\n```csharp\n\
    public class BankAccount\n{\n    private string _accountName;\n    private int\
    \ _accountNumber;\n    // 构造函数\n    public BankAccount(string accountName, int\
    \ accountNumber)\n    {\n        _accountName = accountName;\n        _accountNumber\
    \ = accountNumber;\n    }\n}\n```\n\n构造函数可以用于在创建实例时初始化这些成员：\n\n```csharp\nBankAccount\
    \ custAccount = new BankAccount(\"Fred Wilson\", 123456);\ncustAccount.DisplayName();\n\
    ```\n\n当需要在为属性赋值之外执行某些任务时，上述构造函数类型特别有用。例如，`BankAccount` 构造函数可能包含一些逻辑来捕获空的客户名称字符串：\n\
    \n```csharp\npublic BankAccount(string accountName, int accountNumber)\n{\n  \
    \  if (accountName == \"\")\n        _accountName = \"Anonymous\";\n    else\n\
    \        _accountName = accountName;\n    _accountNumber = accountNumber;\n}\n\
    ```\n\n一个类可以包含多个构造函数，每个构造函数有一组唯一的参数。考虑对 `BankAccount` 类定义的以下更改：\n\n```csharp\n\
    public class BankAccount\n{\n    private string _accountName;\n    private int\
    \ _accountNumber;\n    private bool _isActive = false;\n    // 构造函数\n    public\
    \ BankAccount(string accountName, int accountNumber)\n    {\n        _accountName\
    \ = accountName;\n        _accountNumber = accountNumber;\n    }\n    public BankAccount(string\
    \ accountName, int accountNumber, bool isActive)\n    {\n        _accountName\
    \ = accountName;\n        _accountNumber = accountNumber;\n        _isActive =\
    \ isActive;\n    }\n    public bool IsActive {\n        get => _isActive;\n  \
    \  }\n}\n```\n\n通过这些更改，可以使用以下方式创建 `BankAccount` 实例：\n\n```csharp\nBankAccount\
    \ custAccount = new(\"John Smith\", 53211);\nBankAccount cust2 = new(\"John Smith\"\
    , 53211, true);\n```\n\n## 13.14 C# 主构造函数\n\n当构造函数的唯一目的是将参数分配类时，建议使用主构造函数。例如，将参数放在类名之后：\n\
    \n```csharp\npublic class BankAccount(string accountName, int accountNumber)\n\
    {\n    private string _accountName = accountName;\n    private int _accountNumber\
    \ = accountNumber;\n}\n```\n\n## 13.15 C# 析构函数\n\n析构函数用于在对象销毁时清理类使用的任何资源。与可以使用\
    \ `new` 关键字显式调用的构造函数不同，没有办法可以调用析构函数。它们的定义方式与构造函数相同，不同之处是名称前面有一个波浪号 (`~`）：\n\n\
    ```csharp\n// 析构函数\n~BankAccount() {\n}\n```\n\n## 13.16 “this” 关键字\n\n在 C# 中构造类时，你可能会遇到某些情况：方法内部局部属性与类属性冲突。这在在使用公共字段时特别常见。例如，下面的示例类，其中参数名称与公共字段匹配：\n\
    \n```csharp\nclass DemoClass\n{\n    public string name;\n    public int age;\n\
    \    public DemoClass(string name, int age)\n    {\n        name = name;\n   \
    \     age = age;\n    }\n}\n```\n\n当运行上述代码时，将没有名称且年龄将为 0，即使在创建类实例时已将年龄设置为 37。\n\
    \n```csharp\nDemoClass demo = new(\"Mark\", 37);\nConsole.WriteLine($\"{demo.name}\
    \ is {demo.age} years old.\");\n```\n\n此外，编译器会发出警告，内容为：`warning CS1717: 赋值给了同一个变量；你是否是想赋值其他内容?`\
    \ 这里的问题是编译器不知道在以下初始化代码中引用的是哪个 `name` 和 `age` 变量：\n\n```csharp\npublic DemoClass(string\
    \ name, int age) {\n    name = name;\n    age = age;\n}\n```\n\n为了解决这个问题，我们需要能够告诉编译器将方法参数值分配给相应的公共字段值。我们可以使用\
    \ `this` 关键字来实现。在此范围内，`this` 关键字表示当前的类实例。为了区分冲突的 `name` 和 `age` 变量，我们需要如下使用 `this`\
    \ 关键字：\n\n```csharp\npublic DemoClass(string name, int age) {\n    this.name =\
    \ name;\n    this.age = age;\n}\n```\n\n## 13.17 进行知识测试\n\n点击下方链接或扫描二维码测试你对 C#\
    \ 面对象编程的知识和理解：\n\n[`www.answertopia.com/cnbw`](https://www.answertopia.com/cnbw)\n\
    \n"
- fmt: "\nObject-oriented programming languages like C#` promote the creation of classes\
    \ to encourage code reuse and data encapsulation. In this chapter, we have covered\
    \ the fundamental concepts of classes and instances within `C#` and explained\
    \ concepts such as class members, constructors, finalizers, properties, fields,\
    \ and methods.\n\n# 14. C# Methods\n\nThe previous chapter began the introduction\
    \ to object-oriented programming in `C#` and included the use of methods declared\
    \ within classes. This chapter will explore `C#` methods in more detail, including\
    \ how they are declared and called, passing arguments, and returning results.\
    \ The topic of passing arguments by reference and value will also be explained.\n\
    \nC## methods are vital to writing well-structured and efficient code. They provide\
    \ a way to organize programs while avoiding code repetition. In this chapter,\
    \ we will examine how methods are declared and used within `C#`.\n\n## 14.1 What\
    \ is a method?\n\nA method is a named block of code that can be called upon to\
    \ perform a specific task. It can be passed data on which to perform the task\
    \ and return results to the code that called it. For example, if a particular\
    \ arithmetic calculation needs to be performed in a `C#` program, the code to\
    \ perform the arithmetic can be placed in a method. The method can be programmed\
    \ to accept the values on which the arithmetic is to be performed (referred to\
    \ as parameters) and return the calculation result. At any point in the program\
    \ code where the calculation is required, the method is called and passed values\
    \ as arguments, and the result is returned.\n\n## 14.2 Methods vs. functions\n\
    \nYou may have heard about or used functions if you are familiar with other programming\
    \ languages. Generally, functions are declared the same way as methods and fulfill\
    \ the same purpose. The difference is that methods must be declared within a class,\
    \ while functions are declared outside of a class. In terms of `C#`, it is only\
    \ possible to declare methods within a class, and the concept of functions does\
    \ not exist. \n\n## 14.3 Parameter or argument?\n\nThe terms `parameter` and `argument`\
    \ are often used interchangeably when discussing methods. However, there is a\
    \ subtle difference. The values a method can accept when it is called are called\
    \ `parameters`. When the method is called and passed those values, they are referred\
    \ to as `arguments`.\n\n## 14.4 How to declare a C# function\n\nA `C#` function\
    \ is declared using the following syntax:\n\n```\n<access><return type=\"\"><method\
    \ name=\"\">(<para type=\"\">, <para name=\"\">, ...){\n    // Method code\n}\n\
    ```\n\nExplanations of the various fields of the function declaration are as follows:\n\
    \n- `<access>`: Defines the level of access to the method from other parts of\
    \ the code. Valid values are `public`, `private`, or `protected`, as explained\
    \ in the previous chapter.\n- `<return type>`: The data type of the result returned\
    \ by the function. If the function does not return a result, then this is set\
    \ to `void`.\n- `<method name>`: The name assigned to the method. This is the\
    \ name by which the method will be referenced when it is called from within the\
    \ application code.\n- `<para type>`: The type of the corresponding `parameter`.\n\
    - `<para name>`: The name by which the `parameter` is referenced in the method\
    \ code.\n- `Method code`: The code statements of the method that perform the work.\n\
    \nAs an example, the following method takes no parameters, returns no result,\
    \ and displays a message:\n\n```csharp\npublic void sayHello() {\n    Console.WriteLine(\"\
    Hello\");\n}\n```\n\nThe following sample function, on the other hand, takes an\
    \ `int` and a `string` as parameters and returns a string result:\n\n```csharp\n\
    public string BuildMessage(string name, int count) {\n    return($\"{name}, you\
    \ are customer number {count}\");\n}\n```\n\n## 14.5 Creating the MethodDemo project\n\
    \nLaunch VS Code, open your “C# Essentials” workspace folder and create a new\
    \ .NET Console App project named `MethodDemo`.\n\n## 14.6 Declaring a C# class\
    \ file\n\nFollowing the steps in the “An Introduction to C# Object-Oriented Programming”\
    \ chapter, use the Solutions Explorer to add a new class file named `Demo` to\
    \ the `MethodDemo` project. Once you have added the class file, modify it as follows\
    \ to add a method:\n\n```csharp\nusing System;\n\nnamespace MethodDemo;\n\npublic\
    \ class Demo\n{\n    public void SayHello()\n    {\n        Console.WriteLine(\"\
    Hello\");\n    }\n}\n```\n\n## 14.7 Calling a C# method\n\nOnce declared, `C#`\
    \ methods are called on class instances using dot notation using the following\
    \ syntax:\n\n```\n<instance>.<function name>(<arg1>, <arg2>, ... )\n```\n\nEach\
    \ argument passed through to a method must match the parameters the method is\
    \ configured to accept. For example, to call the above example method named `SayHello()`,\
    \ which takes no parameters and returns no value, we need to modify the `Program.cs`\
    \ file as follows:\n\n```csharp\nusing MethodDemo;\n\nDemo demo = new();\n\ndemo.SayHello();\n\
    ```\n\nWhen the app runs, the “Hello” message will appear in the terminal.\n\n\
    ## 14.8 Handling return values\n\nThe `SayHello()` method definition included\
    \ the `void` keyword to indicate that it did not return a result value. Next,\
    \ add a method named `BuildMessage()` to the `Demo` class which accepts two parameters\
    \ and returns a string result as follows:\n\n```csharp\npublic class Demo\n{\n\
    \    public void SayHello()\n    {\n        Console.WriteLine(\"Hello\");\n  \
    \  }\n\n    public string BuildMessage(string name, int count)\n    {\n      \
    \  return ($\"Hello {name}, you are visitor number {count}.\");\n    }\n}\n```\n\
    \nIn the above code, we placed parentheses around the return value as follows:\n\
    \n`return ($\"Hello {name}, you are visitor number { count}\");`\n\nThese parentheses\
    \ are optional, so the following is also a valid use of the return statement:\n\
    \n`return $\"Hello {name}, you are visitor number {count}.\";`\n\nReturn to the\
    \ `Program.cs` file and add code to call the new method:\n\n```csharp\nDemo demo\
    \ = new();\n\nstring message = demo.BuildMessage(\"Bill\", 10);\n\nConsole.WriteLine(message);\n\
    ```\n\nIn the above example, we created a new variable named `message` and used\
    \ the assignment operator (`=`) to store the method’s result. When the app runs,\
    \ the following output should appear in the terminal:\n\nHello Bill, you are visitor\
    \ number 10.\n\n## 14.9 Passing arguments to a method\n\nSeveral options are available\
    \ when calling a method that expecting arguments. One option, as demonstrated\
    \ above, is to pass the arguments in the order in which they are declared in the\
    \ method declaration:\n\n```csharp\nstring message = demo.BuildMessage(\"Bill\
    \ Gates\", 10);\n```\n\nWhen calling a method in this way, the arguments must\
    \ be passed in the order in which the parameters are declared in the method. Passing\
    \ arguments to a method using this technique can also make it difficult to understand\
    \ the purpose of each argument. Both of these issues can be resolved using named\
    \ arguments.\n\n## 14.9.1 Named arguments\n\nUsing named arguments involves referencing\
    \ the parameter names assigned in the method declaration when making calls. For\
    \ example:\n\n`demo.BuildMessage(name: \"Steve\", count: 30);`\n\nSince ordering\
    \ is not important when using named arguments, the following is also a valid call:\n\
    \n`demo.BuildMessage(count: 30, name: \"Steve\");`\n\nMake the following changes\
    \ to the `Program.cs` file to see named arguments in action:\n\n```csharp\nDemo\
    \ demo = new();\n\nstring message = demo.BuildMessage(name: \"Bill\", count: 10);\n\
    \nConsole.WriteLine(message);\n\nmessage = demo.BuildMessage(count: 30, name:\
    \ \"Steve\");\n\nConsole.WriteLine(message);\n```\n\nAs demonstrated in the code\
    \ above, the ordering of the arguments no longer matters when making the method\
    \ call. It is also easier to understand the purpose of each argument being passed\
    \ to the method.\n\n## 14.9.2 Optional arguments\n"
