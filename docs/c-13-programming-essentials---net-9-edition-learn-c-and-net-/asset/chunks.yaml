    `VES`（称为运行时）是执行 `CIL` 字节码的环境。`VES` 读取由 C# 编译器生成的字节码，并使用即时编译（`JIT`）编译器将字节码编译为运行该代码的处理器器的原生机器代码。在执行期间，该代码会与运行时代理协作工作，由该代理管理执行过程。因此，这种执行代码被称为`托管代码`（managed
    code），该过程会处理诸如垃圾回收（用于处理内存分配和释放）、内存访问和类型安全等问题，以确保代码不会执行任何不应的操作。


    与 `VES` 经常一起使用的术语是公共语言运行时（`CLR`）。`CLR` 是微软对 `CLI` 规范中 `VES` 组件实现的官方名称。


    值得注意的是，`JIT` 过程可能会在应用程序执行时引入启动延迟。`.NET` 提供的避免此问题的方案是使用 `NGen` 编译器将 `CLI` 字节码预编译为原生机器代码。然而，由于
    `NGen` 编译必须在目标处理器架构上进行，此步骤通常在用户安装应用程序时执行。


    ## 3.4 通用类型系统 (CTS) & 通用语言规范 (CLS)


    如前所述，几种不同的编程语言都针对 `CLI`，这允许例如 C# 源代码与 Visual Basic 代码进行交互。然而，为了实现这一目标，每种语言必须对数据类型在内存中的存储方式具有相同的概念。因此，`CTS`
    定义了兼容 `CLI` 的语言如何查看值的位模式以及对象的布局和行为，以确保互操作性。


    `CLS` 是 `CTS` 的子集，旨在创建可互操作的库。


    ## 3.5 框架（基类库和框架类库）


    `CLI` 规定了一组执行 `CLI` 代码必须可用的基类，也称为基类库（`BCL`）。`BCL` 包含了应用程序编程接口（`APIs`），这些接口允许 `CIL`
    代码与运行时环境以及底层操作系统进行交互。


    除了基础内容外，还有 `.NET Framework 类库`（`FCL`）。这个微软库包含了创建图形用户界面、数据库应用程序、网络访问等的 `APIs`。


    ## 3.6 CLI 的实现


    微软对 `CLI` 栈的实现被称为 `.NET`。最初它仅在 Windows 系统可用，微软在 2014 年将 `.NET` 重新封装为开源的跨平台开发平台，可在
    Windows、Linux 和 macOS 上使用。


    微软提供的另一种实现是共享源代码通用语言基础设施（`SSCLI`）。然而，`SSCLI` 主要是一个学习工具，因此，其许可条款禁止将其作为商业应用程序的基础。


    最后，如果你想使用 C# 为 iOS 和 Android 开发应用，还有 `.NET MAUI` 实现。


    ## 3.7 参加知识测试


    点击下方的链接或扫描二维码，以测试你对 C# 基础设施的知识和理解：


    `[`www.answertopia.com/kbxm`](https://www.answertopia.com/kbxm)`


    ![](img/image-S7CB1ZFT.jpg)


    ## 3.8 总结


    通用语言基础设施（`CLI`）为执行 C# 代码提供了一个标准化的环境。它包含了通用中间语言（`CIL`）、虚拟执行系统（`VES`）、通用类型系统（`CTS`）和通用语言规范（`CLS`）。`CLI`
    实现了不同编程语言之间的互操作性，并为执行 `CIL` 代码提供了基类库。


    此外，.NET Framework 类库提供了大量的预构建函数和类集合，用于创建各种应用程序，并包含了文件 I/O、网络、数据库访问和用户界面设计的 `APIs`。


    ## 4. 安装 Visual Studio Code, C# 和 .NET 9


    为了开始使用 C# 编程，我们需要一个环境来编写、编辑、编译和运行我们的代码。有很多选择，但对于本书，我们需要一个免费且对所有读者都提供的解决方案，无论他们是在
    macOS、Windows 还是 Linux 系统上学习 C#。一个流行的工具也是我们将在本章中安装的工具是 Visual Studio Code。Visual
    Studio Code 由微软开发，是一个功能丰富、直观的代码编辑环境，与 `C# Dev Kit` 扩展结合时，它提供了学习 C# 所需的一切。


    ## 4.1 安装 .NET 9 SDK


    除了安装 Visual Studio Code 之外，在编译 C# 程序之前我们还需要安装 `.NET 9 SDK`。虽然有多种方法可以安装 `.NET`，但我们将使用一种独立于
    Visual Studio Code 下载并安装 SDK 的技术。


    `.NET 9 SDK` 的安装步骤取决于你正在使用的操作系统，如下所示。


    ### 4.1.1 在 Windows 上安装 .NET 9


    `.NET 9 SDK` 适用于运行在 x86、x64 和 Arm64 处理器架构上的 Windows 系统。使用以下链接下载与你的系统匹配的最新 `.NET
    9 安装程序`：


    `[`dotnet.microsoft.com/en-us/download/dotnet/9.0`](https://dotnet.microsoft.com/en-us/download/dotnet/9.0)`


    下载安装程序后，启动它并按照设置向导完成安装：


    ![](img/image-KVK3CAQW.png)


    图 4-1


    ### 4.1.2 在 macOS 上安装 .NET 9


    `.NET 9 SDK` 的 macOS 版本适用于 Intel 和 Apple Silicon 系统。要开始安装，打开浏览器窗口，导航到以下 URL 并下载与你的系统匹配的安装程序：


    `[`dotnet.microsoft.com/en-us/download/dotnet/9.0`](https://dotnet.microsoft.com/en-us/download/dotnet/9.0)`


    下载安装程序后，启动它并按照步骤完成安装：


    ![](img/image-20BSBE80.png)


    图 4-2


    ### 4.1.3 在 Red Hat Linux 上安装 .NET 9


    在源自 Red Hat 的发行版上安装 .NET 9 的最佳方法取决于你阅读本书的时间。在编写时，.Net 9 仍在发布候选（RC）阶段。当你读到这里时，.NET
    9 可能已经正式发布。要确认这一点，打开终端窗口并运行以下命令：


    `sudo dnf install dotnet-sdk-9.0`


    如果安装请求报告没有 `dotnet-sdk-9.0` 的匹配项，请跳到“从二进制文件安装 .Net 9”部分进行安装。否则，按‘y’完成安装。


    ### 4.1.4 在 Debian/Ubuntu 上安装 .NET 9


    Debian 和 Ubuntu 安装步骤再次取决于 .NET 9 SDK 的发布状态。首先在终端窗口中运行常用命令：


    `sudo apt-get install dotnet-sdk-9.0`


    如果安装请求报告找不到 `dotnet-sdk-9.0` 软件包，请跳到下一节进行安装。否则，按‘y’完成安装。


    ### 4.1.5 从二进制文件安装 .Net 9


    如果 .NET 9 尚未正式发布，则需要使用发布候选 SDK 二进制文件进行安装。返回 .NET 9 下载页面，并下载如图 4-3 所示与你的 CPU 匹配的二进制文件：


    ![](img/image-GFWW4IA1.png)


    图 4-3


    在终端窗口中，创建一个你想安装 .NET 9 的目录。接下来，运行以下命令（假设你选择了 `$HOME/dotnet9` 作为安装目录）：


    ```bash

    cd $HOME/dotnet9

    tar xvfz<path to="" downloaded binary archive=""></path>

    ```


    解压 .NET 包后，修改你的 `$HOME/.bashrc` 文件以导出 `DOTNET_ROOT` 环境变量并将 .NET 9 SDK 添加到你的路径中。


