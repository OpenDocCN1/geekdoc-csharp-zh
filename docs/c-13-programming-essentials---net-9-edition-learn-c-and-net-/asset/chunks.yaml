    to the Program.cs file to change directory to the MyFiles folder:


    Directory.SetCurrentDirectory("MyFiles");


    Console.WriteLine(Directory.GetCurrentDirectory());


    Run the code and confirm that the current directory has changed to the MyFiles
    subdirectory, for example:


    /Users/neilsmyth/Dropbox/Documents/Books/C#_13/C# Essentials/FileDemo/MyFiles


    ## 29.9 Handling File and Directory Exceptions


    When working with files and directories in C#, it is important to note that many
    operations have the potential to throw exceptions. Consider, for example, the
    above code to change the current working directory. The example works because
    we had checked for the existence of the MyFiles directory, and created it if necessary.
    The result, however, would have been different if the directory did not exist.
    To see this in action, add the following code to the project:


    Directory.SetCurrentDirectory("MyFiles1");


    Click the run button, at which point the program will terminate with the following
    unhandled DirectoryNotFoundException error:


    Unhandled exception. System.IO.DirectoryNotFoundException: Could not find a part
    of the path ''/temp/MyFiles1''.


       at Interop.ThrowExceptionForIoErrno(ErrorInfo errorInfo, String path, Boolean
    isDirError)


    To avoid unhandled exceptions, file and directory handling must be coded defensively
    (for example checking a directory or file exists before referencing it) or performed
    within try-catch statements similar to the following:


    try


    {


        Directory.SetCurrentDirectory("MyFiles1");


    }


    catch (Exception ex)


    {


        Console.WriteLine($"{ex.Message}");


    }


    ## 29.10 File handling using the File class


    With the basics of directory handling in C# covered, it is time to look at working
    with files. The System.IO File class provides a range of static methods for working
    with files, including creation, deletion, copying, reading, and writing. Equivalent
    methods are provided by the FileInfo class.


    29.10.1 Checking if a file exists


    As with directories, we can check for the presence of a file at a specified path
    by calling the File.Exists() method:


    if (File.Exists("/tmp/MyFile.txt"))


    {


    }


    ## 29.10.2 Creating and opening files


    We can also create and open files using the File.Open() method combined with a
    FileMode value:


    var myFile = File.Open(<path>, FileMode.<mode>);</mode></path>


    The following modes are available when opening files:


    •Append - Opens the file if it exists, or creates a new one if it does not. Subsequent
    write operations are appended to the existing file content.


    •Create - Creates a new file, or overwrites it if it already exists.


    •CreateNew - Attempts to create a new file and throws an exception if the file
    already exists.


    •Open - Opens an existing file and throws an exception if it doesn’t exist.


    •OpenOrCreate - If the file exists it is opened, otherwise a new file is created.


    •Truncate - Opens an existing file and truncates it to zero length.


    To create a new file, overwriting it if it already exists, we can use the following
    code:


    File.Open("MyFile.txt", FileMode.Create);


    ## 29.10.3 Reading and writing using the File class


    The WriteAllText() method writes a string to a specified file. If the file already
    exists, it will be overwritten with the new content, otherwise, a new file will
    be created.


    Conversely, the ReadAllText() method will read the content of a specified file
    and return it as a string value. The following code writes a string to a file
    named MyFile.txt before reading it back:


    File.WriteAllText("MyFile.txt", "Hello, this is some text.");


    string content = File.ReadAllText("MyFile.txt");


    Console.WriteLine($"content = {content}");


    When the code executes, the following will appear in the terminal:


    content = Hello, this is some text.


    To append text to an existing file, we call the AppendAllText() method as follows:


    File.WriteAllText("MyFile.txt", "Hello, this is some text.");


    File.AppendAllText("MyFile.txt", " This is more text.");


    string content = File.ReadAllText("MyFile.txt");


    Console.WriteLine($"content = {content}");


    The resulting terminal output will read as follows:


    Hello, this is some text. This is more text.


    To write multiple lines of text to a file in a single operation, place the lines
    in a list collection and pass it to the WriteAllLines() method:


    List <string>textList = ["Kia Sorento", "Alfa Romeo GTV6", "Chevy Spark",</string>


                                "Ford Explorer", "Toyota Celica"];


    File.WriteAllLines("MyFile.txt", textList);'
