    Now that we have described C# variables and constants, we can examine the different
    types available to us as C# programmers beginning with numerical data types.


    ## 7.4 Integer types


    A widely used data type is the integer. C# provides several integer types based
    on number size and whether the integers are signed (positive or negative) or unsigned
    (positive only). All the integer variable types have one thing in common: they
    may only be used to store whole numbers.


    The following table lists the various C# integer types, details of the number
    of bytes of physical memory consumed by each type, and the acceptable value ranges.


    | Type | Size in bytes | Value range |

    | :--- | :--- | :--- |

    | byte | 1 byte | 0 to 255 |

    | sbyte | 1 byte | -128 to 127 |

    | short | 2 bytes | -32,768 to 32,767 |

    | ushort | 2 bytes | 0 to 65,535 |

    | int | 4 bytes | -2,147,483,648 to 2,147,483,647 |

    | uint | 4 bytes | 0 to 4,294,967,295 |

    | long | 8 bytes | -9,223,372,036,854,775,808 to 9,223,372,036,854,775,807 |

    | ulong | 8 bytes | 0 to 18,446,744,073,709,551,615 |


    Table 7-1


    The following code demonstrates some of these data types:


    ```cs

    int myInt = 2010210;

    byte myByte = 233;

    sbyte mySbyte = 127;

    ```


    All C# numerical data types contain bounds properties that can be accessed to
    identify that particular type’s minimum and maximum supported values. The following
    code, for example, outputs to the console the minimum and maximum bounds for some
    of the integer types listed above:


    ```cs

    Console.WriteLine("byte Min Value = " + byte.MinValue);

    Console.WriteLine("byte Max Value = " + byte.MaxValue);

    Console.WriteLine("short Min Value = " + short.MinValue);

    Console.WriteLine("short Max Value = " + short.MaxValue);

    Console.WriteLine("int Min Value = " + int.MinValue);

    Console.WriteLine("int Max Value = " + int.MaxValue);

    Console.WriteLine("uint Min Value = " + uint.MinValue);

    Console.WriteLine("uint Max Value = " + uint.MaxValue);

    Console.WriteLine("long Min Value = " + long.MinValue);

    Console.WriteLine("long Max Value = " + long.MaxValue);

    ```


    The above code will generate the following output:


    ```

    byte Min Value = 0

    byte Max Value = 255

    short Min Value = -32768

    short Max Value = 32767

    int Min Value = -2147483648

    int Max Value = 2147483647

    uint Min Value = 0

    uint Max Value = 4294967295

    long Min Value = -9223372036854775808

    long Max Value = 9223372036854775807

    ```


    ## 7.5 Floating-point Variables


    Integers are fine for dealing with whole numbers but of little use when there
    are numbers after the decimal point. Such numbers may be stored in `float` or
    `double` variable types. The default type for such numbers is `double`. The following
    table shows the two types with comparisons of the number ranges supported and
    the number of significant digits in each case:


    | Type | Size in bytes | Value range | Digit accuracy |

    | :--- | :--- | :--- | :--- |

    | float | 8 bytes | +/-1.5 * 10−45 to +/-3.4 * 1038 | 6 – 7 digits |

    | double | 16 bytes | +/-5.0 * 10−324 to +/-1.7 * 10308 | 15 – 16 digits |


    Table 7-2


    Since floating-point values in C# are considered to be `double` by default, it
    is not possible to declare a `float` variable as follows:


    ```cs

    float myFloat = 23234.23;

    ```


    An attempt to compile the above code will result in a syntax error that reads
    in part:


    `Literal of type double cannot be implicitly converted to type ''float''; use
    an ''F'' suffix to create a literal of this type`


    First, we need to understand what literal means in this context. Any value that
    is explicitly entered into C# code, such as a number (10, 23234.34, -11, etc.)
    or a string (“Hello World”, “Dog” etc.), is referred to as a literal.


    In the above example, a literal value of `23234.23` is assigned to a `float` variable
    named `myFloat`. The problem is that because floating-point literals are considered
    to be of type `double` this assignment cannot be made because the types don’t
    match. Instead, we must tell C# that our literal number is actually of type `float`.
    This is achieved by placing an ‘F’ suffix at the end of the number literal as
    follows:


    ```cs

    float myFloat = 23234.23F;

    ```


    The following code demonstrates `float` and `double` declarations:


    ```cs

    float myFloat = 23234.23F;

    double myDouble = 23234.23;

    ```


    ## 7.6 Decimal type


    Integers are fine for dealing with whole numbers but of little use when there
    are numbers after the decimal point. Such numbers may be stored in float or double
    variable types. The default type for such numbers is double. The following table
    shows the two types with comparisons of the number ranges supported and the number
    of significant digits in each case:


    (Note: The text provided for 7.6 appears to be repetitive/placeholder text in
    the source, but I have maintained the structure per instructions).


    ## 7.7 Boolean type


    Integers are fine for dealing with whole numbers but of little use when there
    are numbers after the decimal point. Such numbers may be stored in float or double
    variable types. The default type for such numbers is double. The following table
    shows the two types with comparisons of the number ranges supported and the number
    of significant digits in each case:


    (Note: The text provided for 7.7 appears to be repetitive/placeholder text in
    the source).


    ## 7.8 Character data type


    When talking about characters, we are referring to individual letters and numbers.
    For example, the letter ‘a’ is a character, as is the visual representation of
    the number ‘1’. Such characters may be stored in a `char` type. A `char` can contain
    one character and one character only. It is important to be aware that a character
    is not limited to those in the English alphabet. Characters are stored internally
    in C# as grapheme clusters. A grapheme cluster combines two or more Unicode scalars
    to represent a visible character.


    In addition, characters can be counted in loops and mathematical expressions.
    To assign a character to a variable or constant, surround the character with single
    quotes:


    ```cs

    char myVar = ''a'';

    const char myConst = ''b'';

    ```


    The following lines assign a variety of different characters to `char` type variables:


    ```cs

    char myChar1 = ''f'';

    char myChar2 = '':'';

    char myChar3 = ''X'';

    ```


    Characters may also be referenced using Unicode code points. The following example
    assigns the Unicode value for a four-pointed star symbol to a variable using Unicode
    and prints it:


    ```cs

    char myChar4 = ''\u2726'';

    Console.WriteLine(myChar4);

    ```


    ## 7.9 Special characters


    In addition to the standard set of characters outlined above, a range of special
    characters (also called escape sequences) is available for specifying items such
    as a new line, tab, or a specific Unicode value within a string. These special
    characters are identified by prefixing the character with a backslash (a concept
    referred to as escaping).


    For example, the escape sequence for a new line special character is `\n`. The
    following code fragment uses this new line special character to add blank lines
    within a string:


    ```cs

    Console.WriteLine("This is a line of text.\n\n\nAn this is another.");

    ```

