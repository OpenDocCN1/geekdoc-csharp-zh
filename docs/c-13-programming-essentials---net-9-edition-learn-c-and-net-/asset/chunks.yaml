    chapter. Suppose that we need a method that will accept an unspecified number
    of string arguments. Using the params keyword, we could declare the method as
    follows:


    public void GreetGuests(params List <string>guests)</string>


    {


        foreach (var guest in guests) {


            Console.WriteLine($"Welcome, {guest}");


        }


    }


    When we call the GreetGuests() method, we can pass it a List instance containing
    any number of guest names without making changes to the GreetGuests() method:


    List <string>names = ["John", "Paul", "George"];</string>


    demo.GreetGuests(names);


    names = ["Mark", "Robert"];


    demo.GreetGuests(names);


    A params parameter can be combined with other method parameters, for example:


    public void GreetGuests(int groupId, params List <string>guests)</string>


    {


    .


    .


    }


    A method can accept only one params argument, which must be positioned at the
    end of the parameter list.


    ## 14.11 C# in, out, and ref parameter modifiers


    When an argument is passed to a method, it is passed as a value. Suppose the code
    contains an int variable named myVar, to which the value 10 is assigned. The myVar
    variable is then passed to a method named DoSomething(). In this scenario, only
    a copy of the value 10 is passed to the method with no connection to the original
    myVar variable. Consequently, any changes to the value from within the method
    will not be reflected in the original variable.


    Add the following method to the Demo class to demonstrate this effect in action:


    public class Demo {


    .


    .


        public void DoSomething(int myVar) {


            myVar = 10;


        }


    }


    Next, modify the Program.cs file as follows:


    int myVar = 20;


    Demo demo = new();


    Console.WriteLine($"Before method call myVar = {myVar}");


    demo.DoSomething(myVar);


    Console.WriteLine($"After method call myVar = {myVar}");


    The code above declares a variable and assigns it a value of 20. Before calling
    the method, the current value of myVar is displayed. The variable is then passed
    as an argument to the DoSomething() method, where it is assigned a value of 10\.
    When the DoSomething() method returns, the value assigned to the myVar variable
    is output again.


    Run the app and verify the value assigned to the myVar variable was not changed
    by the DoSomething() method:


    Before method call myVar = 20


    After method call myVar = 20


    To allow the value assigned to the variable to be changed within the method, we
    need to pass the variable by reference.


    Passing by reference means that instead of passing the underlying value, we are
    passing a reference to the location in memory where the variable stores its value.
    Any changes made within the method will be made to the variable’s value.


    A variable is passed by reference using the ref modifier both when declaring the
    parameter in the method and when calling the method, as shown below:


    // Demo.cs


    public class Demo {


    .


    .


        public void DoSomething(ref int myVar) {


            myVar = 10;


        }


    }


    // Program.cs


    Console.WriteLine($"Before method call myVar = {myVar}");


    demo.DoSomething(ref myVar);


    Console.WriteLine($"After method call myVar = {myVar}");


    The output from running the app shows that the value assigned to myVar changes
    from 20 to 10 after the method call:


    Before method call myVar = 20


    After method call myVar = 10


    Another modifier available when calling methods is the out keyword. Whether the
    variable value is changed within the method is optional when using the ref modifier.
    To force the change to the variable within the method, use the out modifier instead
    of the ref.


    The out modifier is generally used to force the method to initialize a variable
    when it is null at the point it is passed. For example:


    // Demo.cs


    .


    .


    public void DoSomething(out string myVar)


    {


    myVar = "Hello";


    }


    // Program.cs


    string myVar;


    Demo demo = new();


    demo.DoSomething(out myVar);


    Console.WriteLine($"After method call myVar = {myVar}");


    The final modifier to be covered is the in modifier. This modifier also sends
    the variable to the method by reference but prevents that reference from being
    changed from within the method. The following code change, for example, will generate
    a syntax error because myVar is now a read-only variable:


    // Demo.cs


    .


    .


    public void DoSomething(in string myVar)


    {


        myVar = "Hello"; // Syntax error - readonly variable


    }


    // Program.cs


    .


    .


    demo.DoSomething(in myVar);


    .


    .


