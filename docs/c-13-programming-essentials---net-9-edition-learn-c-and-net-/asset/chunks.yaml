    \ not support inheritance and subclassing in the way that classes do. In other\
    \ words, it is not possible for one structure to inherit from another structure.\
    \ Unlike classes, structures also cannot contain a finalizer method. Structure\
    \ members cannot be specified as `abstract`, `virtual`, or `protected`. Structures\
    \ can, however, implement interfaces.\n\n## 20.5 Read-only structures\n\nStructures\
    \ can be declared as being read-only using the `readonly` modifier. When declared\
    \ in this way, all data members of the structure must also be declared as being\
    \ read-only. In the case of field members, this requires the use of the `readonly`\
    \ modifier. Properties, on the other hand, must either be declared as readonly\
    \ or use the `init`-only accessors (a topic covered in the chapter entitled “An\
    \ Introduction to C# Object-Oriented Programming”).\n\nThe following structure,\
    \ for example, includes both a read-only field and an init-only property:\n\n\
    ```csharp\nnamespace StructureDemo;\n\npublic readonly struct SampleStruct(string\
    \ name)\n{\n    private readonly string _name = name;\n\n    public string Name\
    \ {\n        get => _name;\n    }\n\n    public string BuildHelloMsg() {\n   \
    \     return \"Hello \" + _name;\n    }\n}\n```\n\n## 20.6 Take the knowledge\
