    the result type it returns make up the method’s signature. The signature of the
    following method indicates that it accepts a string value as a parameter and returns
    an integer:


    public int GetLength(string value) {


    .


    .


    }


    The following method performs an entirely different task but has the identical
    signature as the above GetLength() method:


    public int CustomerCount(string customer) {


    .


    .


    }


    A C# delegate is a variable that stores a reference to a method. If you are familiar
    with C or C++ programming, delegates are similar to function pointers.


