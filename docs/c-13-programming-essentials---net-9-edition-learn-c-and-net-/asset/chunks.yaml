    ## 6. Creating an Example C# App in VS Code


    The preceding chapters of this book have explained how to configure a C# development
    environment using Visual Studio Code and explored the tool’s main features. Before
    moving on to slightly more advanced topics, now is a good time to validate that
    everything is installed and functioning correctly. The best way to achieve this
    is to create a C# app and compile and run it. This chapter will cover creating
    a C# console application project using VS Code.


    ## 6.1 Creating the SampleApp project


    To begin, launch VS Code and display the Command Palette (`Ctrl-Shift-P` or `Cmd-Shift-P`).
    When the palette appears, locate and select the `.NET: New Project...` option.


    ![](images/image-WY7SL0KG.png)


    Figure 6-1


    At this point, VS Code will ask us to select a project type. All the projects
    in this book will be console-based apps, so select the `Console App` project template
    option highlighted in Figure 6-2:


    ![](images/image-C4NLMAAC.png)


    Figure 6-2


    Once the project template has been selected, VS Code will display a file browser
    dialog. You will recall from the previous chapter that VS Code projects are stored
    in workspace folders. Since this is the first project we will create in VS Code,
    we will also need a workspace to contain it and the projects created in later
    chapters. Within the file browser, navigate to a suitable location on your file
    system and create a new folder named `C# Essentials` to serve as the workspace.
    Open the new folder to return to the Command Palette, name the project `SampleApp`,
    and press the `Enter` key:


    ![](images/image-BIXXX66T.png)


    Figure 6-3


    Finally, the Command Palette will seek confirmation that you wish to create the
    project in the designated workspace folder:


    ![](images/image-I100IEKL.png)


    Figure 6-4


    Review the workspace path, then press `Enter` to create the project.


    ## 6.2 Reviewing the SampleApp project


    Now that we have created our first C# project, we can use the Explorer panel to
    review the files and folders that VS Code generated for us. If the Explorer is
    not already visible, select it using the action bar button indicated in Figure
    6-5:


    ![](images/image-SYE88AYD.png)


    Figure 6-5


    The Explorer lists our `C# Essentials` workspace and the `SampleApp` project folder.
    The arrows to the left of the workspace and project folder names (highlighted
    in Figure 6-6) are called disclosure arrows and are used to show and hide the
    folder contents:


    ![](images/image-JF7MG0A3.png)


    Figure 6-6


    Click the disclosure arrow next to the `SampleApp` folder to view the files contained
    within the project:


    ![](images/image-PYX2QRUD.png)


    Figure 6-7


    The two subfolders, named `bin` and `obj`, are used by VS Code when the app is
    compiled and run, and the `SampleApp.csproj` file stores the project’s configuration
    settings. Select the `SampleApp.csproj` file to view its contents in the editor
    panel.


    In addition to the workspace and project folder, VS Code has created a solution
    file named `C# Essentials.sln`, which contains references to the workspace projects.
    While selecting the solution file will display the content in the editor panel,
