    \n```csharp\nint x = 8;\n\nif ( x > 9 ) {\n    Console.WriteLine(\"x is greater\
    \ than 9!\");\n} else {\n    Console.WriteLine(\"x is less than 9!\");\n}\n```\n\
    \n## 9.4 使用 if … else if … 语句\n\n到为止，我们看了根据单个逻辑表达式结果做出决策的 `if` 语句。有时，根据根据几个不同的标准做出决策。为此，我们可以使用\
