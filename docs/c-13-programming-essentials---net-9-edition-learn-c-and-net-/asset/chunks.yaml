    VS Code also generated a file named `Program.cs`, where we will begin writing
    code.


    ## 6.3 Writing the app code


    The `Program.cs` file represents the entry point into the app code when it runs.
    In other words, when we compile and run the app, the first lines of code to be
    executed will be those contained in the `Program.cs` file. Select the file to
    load it into the editor, where it will read as follows:


    ```csharp

    // See https://aka.ms/new-console-template for more information


    Console.WriteLine("Hello, World!");

    ```


    The first line is a comment informing us that the file uses the new console template.
    This template is particularly significant, as we will see later in the chapter.
    For now, we are more interested in the second line:


    ```csharp

    Console.WriteLine("Hello, World!");

    ```


    The above line of code uses the `WriteLine()` method of the built-in `Console`
    class to display a message in the terminal window. To try out this code, click
    the run button shown in Figure 6-9:


    ![](images/image-TQ1OKNOK.png)


    Figure 6-9


    When the build process begins, refer to the `Terminal` in the bottom panel where,
    in addition to the diagnostic output, the “Hello, World!” output will appear:


    ![](images/image-B01WBXU9.png)


