    ## 5. Visual Studio Code 导览之旅


    现在我们已经安装了 VS Code，在开始编写 C# 代码之前必须学习如何使用它。在本章中，我们将对 VS Code 进行导览，并涵盖使用其关键功能的基础。虽然对
    VS Code 的每个方面进行深度概述出了本章的范围，但目标是提供从容开始编辑 C# 代码所需的技能。


    ## 5.1 工作空间、项目和解决方案


    当你开始使用 VS Code 时，执行的第一件事是创建一个工作空间（workspace）。工作空间是一个包含一个或多个其他文件夹的文件夹。当你打开工作空间时，也会打开它的子文件夹。在文档和
    VS Code 菜单中，`workspace` 和 `folder` 术语通用。例如，当你在 VS Code 中选择“打开文件夹”选项时，你正在打开一个工作空间。


    在 VS Code 中处理 C# 和 .NET 时，每个工作空间子文件夹包含一个项目。每个项目代表一个正在开发的应用程序、库或服务，并包含了它的源代码。


    当你在 VS Code 中创建第一个 C# 项目时，会被要求创建一个或选择一个文件夹来包含项目。你选择的文件夹将是项目所在的工作空间。


    除了新项目和工作空间，VS Code 还会创建一个解决方案（solution）文件。解决方案引用工作空间内的所有项目。在 VS Code 中，你将使用解决方案管理器来管理工作空间中的项目并执行添加新类等任务。


    ## 5.2 VS Code 主窗口


    一旦你创建了第一个项目，就需要熟悉组成 VS Code 用户界面的各种元素。图 5-1 显示了一个开启了多个项目的 VS Code 会话。主窗口的关键区域如下：


    A - 活动栏（Activity Bar）：活动栏包含显示主侧边栏、搜索项目文件、连接 Git 源码仓库、运行和调试代码、浏览并安装扩展以及运行测试的按钮。还有登录微软账户和访问设置的选项。


    B - 主侧边栏（Primary Sidebar）：主侧边栏分为三个部分。顶部是资源管理器视图，它列出了当前工作空间中的所有文件夹和文件。从列表中选择文件将其加载到编辑器（F）。


    C - 大纲（Outline）：主侧边栏的大纲部分显示当前所选源文件的层级结构，包括符号、类、方法和属性。


    D - 时间线（Timeline）：主侧边栏的时间线面板列出了最近的操作，如保存、创建或删除项目文件。


    E - 解决方案管理器（Solution Explorer）：此面板列出当前解决方案文件中引用的文件和文件夹，并允许执行创建新类等任务。


    F - 编辑器（Editor）：编辑器是你编写和编辑 C# 代码的地方。VS Code 支持并排和分屏编辑模式，多个文件可以同时打开并可见。浮动编辑器窗口也可以从主窗口分离。


