    \ Lambda 表达式。\n\n## 17. C#\n\n### 继承\n\n在《C# 面向对象编程简介》中，我们涵盖了面向对象编程的基本概念，并完成了一个使用\
    \ C# 创建和操作新类的示例。在那个示例中，我们的新类并没有显式地派生自基类（尽管所有的 C# 类最终都派生自 `System.Object`）。本章将深入探讨\
    \ C# 中的继承和子类概念。\n\n### 17.1 什么是继承？\n\n继承的概念为编程引入了现实世界的视角。它允许定义一个具有若干特征的类，然后让其他类派生自该类。派生类继承父类的所有特征，并通常会添加自己的一些特征。\n\
    \n通过派生类，我们创建了通常所说的类层次。层次结构顶端的类称为基类（base class），派生类称为子类（subclasses）。一个类可以派生出任意数量的类。然而，一个派生类只能继承一个类。因此，C#\
    \ 被称为`单继承`编程语言。类并不非要派生自基类。例如，一个子类也可以继承自另一个子类。\n\n### 17.2 一个 C# 继承示例\n\n与大多数编程概念一样，C#\
    \ 中的继承主题通过示例来说效果最好。在《C# 面向对象编程简介》章节中，我们创建了一个名为 `ObjectDemo` 的项目，其中包含一个 `BankAccount`\
    \ 类。我们将使用这个示例来演示 C# 继承。\n\n启动 VS Code，打开你的“C# Essentials”工作空间文件夹，并使用资源管理器找到 `ObjectDemo`\
    \ 项目中的 `BankAccount.cs` 文件，如下图 17-1 所示：\n\n![](img/image-DSM63GCY.png)\n图 17-1\n\
    \n一旦项目加载到 VS Code 中，编辑 `BankAccount.cs` 文件并向类添加一个额外的字段和属性来存储余额：\n\n```csharp\n\
    namespace ObjectDemo;\npublic class BankAccount\n{\n    private string _accountName;\n\
    \    private int _accountNumber;\n    private double _accountBalance;\n\n    public\
    \ BankAccount(string accountName, int accountNumber, double accountBalance)\n\
    \    {\n        _accountName = accountName;\n        _accountNumber = accountNumber;\n\
    \        _accountBalance = accountBalance;\n    }\n\n    public double AccountBalance\n\
    \    {\n        get => _accountBalance;\n        set => _accountBalance = value;\n\
    \    }\n\n    public void DisplayName()\n    {\n        Console.WriteLine($\"\
    Customer is {AccountName}\");\n    }\n}\n```\n\n该类在定义任何银行账户共有的特征（如账户持有人姓名、账号）方面表现得出色。这个类成功定义了任何银行账户共有的特征，例如账户持有人姓名、账号和当前余额。然而，想象我们的程序需要支持多种类型的账户。例如，银行可能会为客户提供计息储蓄账户。储蓄账户将拥有\
    \ `BankAccount` 的所有特征，但还需要一种存储利率的方法。\n\n### 17.3 创建子类\n\n既然我们已经确定需要创建一个 `BankAccount`\
    \ 类的子类，我们现在就可以查看如何实现它。子类的声明方式与其他任何类相同，区别在于类名后面跟着一个冒号（`:`）以及它继承的类名。\n\n考虑到这一点，我们首先可以通过使用资源管理器添加新文件。在资源管理器中，将鼠标指针悬停在\
    \ `ObjectDemo` 条目上并点击新建文件按钮。在文件模板中，选择 `Class` 并在按下 Enter 键之前将新类命名为 `SavingsAccount`。当新文件加载到编辑器时，修改类声明以派生自\
    \ `BankAccount`：\n\n```csharp\nnamespace ObjectDemo;\npublic class SavingsAccount\
    \ : BankAccount\n{\n}\n```\n\n我们现在创建了一个名为 `SavingsAccount` 的 `BankAccount` 子类，但此时\
    \ `SavingsAccount` 类与其父类没有区别。接下来，我们需要添加一个构造函数和一些新成员以添加我们需要的行为：\n\n```csharp\n\
    public class SavingsAccount : BankAccount\n{\n    private double _interestRate;\n\
    \n    public SavingsAccount(string accountName, int accountNumber, double accountBalance,\
    \ double interestRate)\n        : base(accountName, accountNumber, accountBalance)\n\
    \    {\n        _interestRate = interestRate;\n    }\n\n    public double InterestRate\n\
    \    {\n        get => _interestRate;\n        set => _interestRate = value;\n\
    \    }\n\n    public double MonthlyInterest()\n    {\n        return (_interestRate\
    \ * AccountBalance) / 12;\n    }\n}\n```\n\n我们现在有一个名为 `SavingsAccount` 的新类，它继承了\
    \ `BankAccount` 类的所有成员，并添加了一些属于自己的成员。特别是，我们添加了一个名为 `InterestRate` 的新数据成员，用于用于存储账户支付的利率，以及一个计算每月利息的新方法。\n\
    \n## 17.4 向基类构造函数传递参数\n\n"
- fmt: "\nOf particular significance is the constructor in the `SavingsAccount` declaration.\
    \ In the `BankAccount` base class, we have a constructor that accepts account\
    \ name, number, and balance parameters. In the `SavingsAccount` subclass, we must\
    \ also accept the interest rate value. The `: base()` code instructs C# to handle\
    \ the name, number, and balance parameters using the constructor from the base\
    \ `BankAccount` class, leaving the interest rate for the `SavingsAccount` constructor:\n\
    \n```csharp\npublic SavingsAccount(string accountName, int accountNumber,\n  \
    \                    double accountBalance, double interestRate)\n           \
    \           : base(accountName, accountNumber, accountBalance)\n```\n\nWith our\
    \ `SavingsAccount` subclass complete, we can use it in our project. Edit the `Program.cs`\
    \ file and modify it as follows:\n\n```csharp\nusing ObjectDemo;\n\nSavingsAccount\
    \ account = new(accountName: \"John Smith\", accountNumber: 12312, accountBalance:\
    \ 1000.99, interestRate: 0.05);\n\nConsole.WriteLine($\"Interest earned this month\
    \ = { account.MonthlyInterest()}\");\n\naccount.DisplayName();\n```\n\nWhen it\
    \ runs, the app will display the following output in the console:\n\n```\nInterest\
    \ earned this month = 4.17079166666667\nCustomer name is John Smith\n```\n\n##\
    \ 17.5 Overriding inherited methods\n\nWhen using inheritance, it is not unusual\
    \ to find a method in the parent class that almost does what you need but requires\
    \ modification to provide the precise functionality you require. One option in\
    \ this scenario would be to ignore the inherited method and write a new method\
    \ with an entirely new name. A better option is to `override` the inherited method\
    \ and write a new version in the subclass.\n\nBefore proceeding with an example,\
    \ three rules must be obeyed when overriding a method:\n\n1. The overriding method\
    \ in the subclass must take the same number and types of parameters as the overridden\
    \ method in the parent class.\n2. The new method must have the same return type\
    \ as the parent method.\n3. The method declaration in the base class must be declared\
    \ using `virtual`, `abstract`, or `override` modifiers.\n\nThe topics of abstract\
    \ and virtual class members will be covered in the next chapter.\n\nIn our `BankAccount`\
    \ class, we have a method named `DisplayName()`, which displays the account holder’s\
    \ name. In our `SavingsAccount` subclass, we might also want to output the current\
    \ interest rate assigned to the account. To achieve this, the first step is to\
    \ declare the method in the `BankAccount` class as being `virtual`:\n\n```csharp\n\
    public class BankAccount\n{\n.\n.\n    virtual public void DisplayName()\n   \
    \ {\n        Console.WriteLine($\"Customer name is {AccountName}\");\n    }\n\
    .\n.\n}\n```\n\nNext, we declare a new version of the `DisplayBalance()` method\
    \ in our `SavingsAccount` subclass, prefixed with the `override` modifier:\n\n\
    ```csharp\npublic class SavingsAccount : BankAccount\n{\n.\n.\npublic override\
    \ void DisplayName()\n    {\n        Console.WriteLine($\"Customer name is { AccountName\
    \ }\");\n        Console.WriteLine($\"Account is earning { InterestRate }% interest.\"\
    );\n    }\n}\n```\n\nNow, when we call the `DisplayName()` method on an instance\
    \ of the `SavingsAccount` class, we get information about the customer’s interest\
    \ rate:\n\n```\nInterest earned this month = 4.17079166666667\nCustomer name is\
    \ John Smith\nAccount is earning 0.05% interest.\n```\n\nIt is also possible to\
    \ call the overridden method in the base class from within a subclass. For example,\
    \ the `DisplayName()` method of the base class could be called to display the\
    \ account holder’s name before the interest rate is displayed, thereby eliminating\
    \ further code duplication. Using dot notation, we can call the method on the\
    \ `base` object as follows:\n\n```csharp\npublic override void DisplayName()\n\
    {\n    base.DisplayName();\n    Console.WriteLine($\"Account is earning { InterestRate\
    \ }% interest.\");\n}\n```\n\n## 17.6 Take the knowledge test\n\nClick the link\
    \ below or scan the QR code to test your knowledge and understanding of C# inheritance:\n\
    \n[https://www.answertopia.com/mdqq](https://www.answertopia.com/mdqq)\n\n![](images/image-BXQJ19W6.jpg)\n\
    \n## 17.7 Summary\n\nIn C#, inheritance is a programming concept that allows new\
    \ classes to be created from existing classes and extended to add new functionality.\
    \ This means that when an existing class provides some, but not all, of the functionality\
    \ required by a programmer, that class can be used as the basis for a new subclass.\
    \ By doing so, the new subclass will inherit all the parent class’s capabilities\
    \ and can be extended further to add any missing functionality.\n\n## 18. C# Abstract\
    \ Classes\n\nIn the preceding chapters, we have examined object-oriented programming\
    \ in C# and the concept of class inheritance. This chapter will introduce abstract\
    \ classes.\n\n## 18.1 What is a C# abstract class?\n\nIn the examples we have\
    \ looked at so far in this book, we have created classes that could be both instantiated\
    \ as objects and used as a base class from which to derive classes. Often, a base\
    \ class is not intended to be instantiated and is provided solely as an outline\
    \ or template for subclasses. Such a class is known as an abstract class. An abstract\
    \ class cannot be instantiated as an object and is only provided to derive subclasses.\n\
    \n## 18.2 Abstract members\n\nA C# abstract class contains abstract members, which\
    \ define what a subclass must contain. These abstract members declare that a member\
    \ of a particular type is required; it does not implement the member. Implementation\
    \ of abstract members takes place within the derived class. A subclass that derives\
    \ from an abstract class and fails to implement abstract methods will generate\
    \ syntax errors.\n\n## 18.3 Declaring a C# abstract class\n\nIn addition to using\
    \ the class modifier, as we have seen in previous examples, abstract classes must\
    \ also be declared using the `abstract` modifier:\n\n```csharp\npublic abstract\
    \ class Talk {\n}\n```\n\nAbstract class member methods and properties are also\
    \ declared using the `abstract` keyword. For example, to declare an abstract method\
    \ in our `Talk` class, the following code is required:\n\n```csharp\npublic abstract\
    \ class Talk {\n    public abstract void Speak();\n}\n```\n\nWe now have an abstract\
    \ class with an abstract method named `Speak()`. Note that this declaration only\
    \ states that any class derived from the `Talk` class must implement a method\
    \ called `Speak()` which returns no value (i.e., it is declared as `void`) and\
    \ has no parameters. It does not, however, implement the method.\n\n## 18.4 Deriving\
    \ from an abstract class\n\nTo subclass from an abstract class, we write code\
    \ as follows:\n\n```csharp\npublic class SayHello : Talk {\n}\n```\n\nWe now have\
    \ a class named `SayHello`, which is derived from the `Talk` class. The next step\
    \ is to implement the abstract `Speak()` method. When implementing abstract members\
    \ in a derived class, the `override` modifier must be used. For example:\n\n```csharp\n\
    public override void Speak() {\n    Console.WriteLine(\"Hello!\");\n}\n```\n\n\
    We now have a subclass derived from the `Talk` abstract class, which implements\
    \ the `Speak()` method.\n\n## 18.5 Creating the AbstractClassDemo project\n\n\
    With the basics of abstract classes covered, we can put this knowledge to use\
    \ in an example project. Begin by creating a new .NET Console project in VS Code\
    \ named `AbstractClassDemo`.\n\nUsing the Solution Explorer, add a new Class to\
    \ the `AbstractClassDemo` project named `Talk`.\n\nEdit the `Talk.cs` file to\
    \ declare the `Talk` class as abstract and to add the abstract `Speak()` method\
    \ as follows:\n\n```csharp\nnamespace AbstractClassDemo;\n\npublic abstract class\
    \ Talk\n{\n    public abstract void Speak();\n}\n```\n\nNext, we need to add the\
    \ second class which will be subclassed from the `Talk` class. Repeat the above\
    \ steps to add a class file to the project, this time naming the file `SayHello.cs`.\
    \ Once the file has been added, make the following changes to subclass from `Talk`\
    \ and implement the `Speak()` method:\n\n```csharp\nnamespace AbstractClassDemo\n\
    {\n    internal class SayHello : Talk\n    {\n        public override void Speak()\n\
    \        {\n            Console.WriteLine(\"Hello!\");\n        }\n    }\n}\n\
    ```\n\nFinally, modify the `Program.cs` file to use the new classes:\n\n```csharp\n\
    using AbstractClassDemo;\n```\n"
