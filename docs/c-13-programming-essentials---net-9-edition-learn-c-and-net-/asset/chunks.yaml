    图 6-1


    此时，VS Code 将要求我们选择项目类型。本书中的所有项目将是基于控制台的应用，因此选择图 6-2 中高亮的 `Console App` 项目模板选项：


    ![](img/image-C4NLMAAC.png)


    图 6-2


    一旦选择了项目模板，VS Code 将显示一个文件浏览器对话框。你可能还从上一章中记得，VS Code 项目存储在工作区文件夹中。由于这是我们在 VS Code
    中创建的第一个项目，我们还需要一个工作区来包含它以及后续章节中创建的项目。在文件浏览器中，导航到你文件系统上的合适位置，并创建一个名为 `C# Essentials`
    的新文件夹作为工作区。打开新文件夹返回命令面板，将项目命名为 `SampleApp`，并按 `Enter` 键：


    ![](img/image-BIXXX66T.png)


    图 6-3


    最后，命令面板将确认你是否要在指定的工作区文件夹中创建项目：


    ![](img/image-I100IEKL.png)


    图 6-4


    查看工作区路径，然后按 `Enter` 创建项目。


    ## 6.2 审查 SampleApp 项目


    现在我们已经创建了第一个 C# 项目，可以使用资源管理器查看 VS Code 为我们生成的文件和文件夹。如果资源未显示，请使用图 6-5 所示按钮显示它：


    ![](img/image-SYE88AYD.png)


    图 6-5


    资源管理器列出了 `C# Essentials` 工作区和 `SampleApp` 项目。名称左侧的箭头（图 6-6 中高亮）是展开箭头，用于显示和隐藏内容：


    ![](img/image-JF7MG0A3.png)


    图 6-6


    点击 `SampleApp` 文件夹旁边的箭头查看项目包含的文件：


    ![](img/image-PYX2QRUD.png)


    图 6-7


    两个子文件夹在 VS Code 编译和运行时使用，`SampleApp.csproj` 文件存储项目设置。选择 `SampleApp.csproj` 文件在编辑器面板中查看内容。


    除了工作区和项目文件夹，VS Code 还创建了一个名为 `C# Essentials.sln` 的解决方案文件，它包含了对项目的引用。虽然选择解决方案文件会在编辑器中显示内容，但更好的选项是使用下所示的解决方案管理器：


    ![](img/image-OX8GE0G2.png)


    图 6-8


    VS Code 还生成了一个名为 `Program.cs` 的文件，我们将在其中编写代码。


    ## 6.3 编写应用代码


    `Program.cs` 文件代表应用运行时的入口。也就是说，当我们编译并运行应用时，首先执行的代码行将是 `Program.cs` 文件中的内容。选择该文件将其加载到编辑器，内容如下：


    ```csharp

    // See https://aka.ms/new-console-template for more information


    Console.WriteLine("Hello, World!");

    ```


    第一行是注释，告知该文件使用了新的控制台模板。该模板非常重要，我们将在稍稍后看到。现在，我们更关注第二行：


    ```csharp

    Console.WriteLine("Hello, World!");

    ```


    上述代码行使用内置 `Console` 类的 `WriteLine()` 方法在终端窗口中显示消息。要尝试此代码，点击图 6-9 所示的运行按钮：


    ![](img/image-TQ1OKNOK.png)


    图 6-9


    当构建开始时，请参考底部面板中的`终端`，除诊断输出外，还会出现“Hello, World!”输出：


    ![](img/image-B01WBXU9.png)


    图 6-10


