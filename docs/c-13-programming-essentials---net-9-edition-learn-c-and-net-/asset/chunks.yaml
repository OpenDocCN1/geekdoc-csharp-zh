- fmt: "\nHaving created a loop, you might want to break out of it under certain conditions\
    \ before the completion criteria have been met (particularly if you have created\
    \ an infinite loop). One such example might involve continually checking for activity\
    \ on a network socket. Once the activity has been detected, it will be necessary\
    \ to break out of the monitoring loop and perform some other task.\n\nTo break\
    \ out of a loop, C# provides the `break` statement, which breaks out of the current\
    \ loop and resumes execution at the code directly after the loop. For example:\n\
    \n```csharp\nint j = 10;\n\nfor (int i = 0; i < 50; i++)\n{\n    j += j;\n   \
    \ Console.WriteLine(\"j = \" + j);\n    if (j > 100)\n        break;\n}\n```\n\
    \nIn the above example, the loop will continue to execute until the value of `j`\
    \ exceeds 100, at which point the loop will exit.\n\n## 11.5 Nested for loops\n\
    \nSo far, we have looked at only a single level of `for` loop. It is also possible\
    \ to nest `for` loops where loops reside inside other loops. For example:\n\n\
    ```csharp\nfor (int i = 0; i < 100; i++) {\n    Console.WriteLine( \"i = \" +\
    \ i);\n    for (int j = 0; j < 10; j++) {\n        Console.WriteLine( \"j = \"\
    \ + j);\n    }\n}\n```\n\nThe above example will loop 100 times, displaying the\
    \ value of `i` on each iteration. In addition, each of those iterations will loop\
    \ 10 times, displaying the value of `j`.\n\nThe above example shows two levels\
    \ of nesting. Of course, it is possible to nest to more levels, though too many\
    \ levels may result in difficult-to-understand code.\n\n## 11.6 Breaking from\
    \ nested loops\n\nAn important point to be aware of when breaking out of a nested\
    \ `for` loop is that the `break` only exits from the current level of the loop.\
    \ For example, the following C# code example will exit from the current iteration\
    \ of the nested loop when `j` equals 5. The outer loop will, however, continue\
    \ to iterate and, in turn, execute the nested loop:\n\n```csharp\nfor (int i =\
    \ 0; i < 100; i++) {\n    Console.WriteLine( \"i = \" + i);\n    for (int j =\
    \ 0; j < 10; j++) {\n        if (j == 5)\n            break;\n        Console.WriteLine(\
    \ \"j = \" + j);\n    }\n}\n```\n\n## 11.7 Continuing for loops\n\nAnother helpful\
    \ statement for use in loops is the `continue` statement. When the execution process\
    \ finds a `continue` statement in any loop, it skips all remaining code in the\
    \ loop’s body and begins execution again from the top of the loop. Using this\
    \ technique, we can, for example, construct a `for` loop that outputs only even\
    \ numbers between 1 and 9:\n\n```csharp\nfor (int i = 1; i < 10; i++) {\n    if\
    \ ((i % 2) != 0)\n        continue;\n    Console.WriteLine($\"i = {i}\");\n}\n\
    ```\n\nIn the example, if `i` is not divisible by 2 with 0 remaining, the code\
    \ performs a `continue` operation, sending execution to the top of the `for` loop,\
    \ thereby bypassing the code to output the value of `i`. This results in only\
    \ even numbers appearing in the console.\n\n## 11.8 The C# foreach statement\n\
    \nThe `foreach` loop is used to iterate over a sequence of items in a collection\
    \ and provides a simple-to-use looping option.\n\nThe syntax of the `foreach`\
    \ loop is as follows:\n\n```csharp\nforeach <name> in <collection> {\n    // code\
    \ to be executed\n}\n```\n\nIn this syntax, `<name>` is the name for a constant\
    \ containing the current item from the object through which the loop is iterating.\
    \ The code in the loop’s body will typically use this constant name to reference\
    \ the current item in the loop cycle. The `<collection>` is the object through\
    \ which the loop is iterating. This could, for example, be an array of string\
    \ or numeric values (the topic of collections will be covered in greater detail\
    \ in the chapter entitled “Creating 2D, 3D, and Jagged Arrays in C#”).\n\nConsider,\
    \ for example, the following `foreach` loop construct:\n\n```csharp\nstring[]\
    \ myColors = [\"red\", \"green\", \"yellow\", \"orange\", \"blue\"];\n\nforeach\
    \ (string color in myColors)\n{\n    Console.WriteLine(\"{0} \", color);\n}\n\
    ```\n\nThe loop begins by stating that the current item will be assigned to a\
    \ constant named `color`. We then tell the statement that it is to iterate through\
    \ all the elements in the `myColors` collection. The loop’s body sends a message\
    \ to the console panel indicating the current value assigned to the `color` constant.\n\
    \nAs we will see in the “Creating 2D, 3D, and Jagged Arrays in C#” chapter, the\
    \ `foreach` loop is particularly beneficial when working with collections such\
    \ as arrays and dictionaries.\n\n## 11.9 Take the knowledge test\n\nClick the\
    \ link below or scan the QR code to test your knowledge and understanding of C#\
    \ looping:\n\n[https://www.answertopia.com/3xzv](https://www.answertopia.com/3xzv)\n\
    \n![](images/image-SICUB2IT.jpg)\n\n## 11.10 Summary\n\nLoop control flow is a\
    \ fundamental feature found in most programming languages used to perform tasks\
    \ that must be executed multiple times. In this chapter, we have covered the C#\
    \ `for` and `foreach` statements and how they are utilized to execute tasks a\
    \ specified number of times. Additionally, we have explored nested loops and explained\
    \ how to manage loop behavior using the `break` and `continue` statements.\n\n\
    ## 12. C# Looping with do and while Statements\n\nWith the topic of constructing\
    \ loops using the `for` statement, this chapter aims to introduce two more looping\
    \ options: the `while` and `do...while`.\n\nThe `for` loop described in the previous\
    \ chapter works well when you know in advance how many times a task needs to be\
    \ repeated. However, there will be instances where code needs to be repeated until\
    \ a specific condition is met, with no way of knowing how many repetitions will\
    \ be needed. C# provides alternatives.\n\n## 12.1 The while loop\n\nEssentially,\
    \ the `while` loop repeats a set of tasks until a specified condition is met.\
    \ The `while` loop syntax is defined as follows:\n\n```csharp\nwhile (condition)\
    \ {\n    // statements\n}\n```\n\nIn the above example, `condition` is an expression\
    \ that will return either true or false, and the statements represent the code\
    \ to be executed while the condition continues to evaluate to true. For example:\n\
    \n```csharp\nint myCount = 0;\n\nwhile (myCount < 100) {\n    myCount++;\n}\n\n\
    Console.WriteLine($\"myCount = {myCount}\");\n```\n\nIn the above example, the\
    \ `while` expression evaluates whether the `myCount` variable is less than 100.\
    \ If it is already greater than 100, the code in the braces is skipped, and the\
    \ loop exits without performing any tasks.\n\nIf, on the other hand, `myCount`\
    \ is not greater than 100, the code in the braces is executed, and the loop returns\
    \ to the `while` statement and repeats the evaluation. This process repeats until\
    \ the value of `myCount` exceeds 100, at which point the loop exits.\n\n## 12.2\
    \ do... while loops\n\nIt is often helpful to think of the `do...while` loop as\
    \ an inverted `while` loop. The `while` loop evaluates an expression before executing\
    \ the code in the loop’s body. The code is not executed if the expression evaluates\
    \ to false on the first check. The `do...while` loop, on the other hand, is provided\
    \ for situations where you know that the code contained in the loop’s body will\
    \ always need to be executed at least once. For example, you may want to keep\
    \ stepping through the items in an array until a specific item is found. You know\
    \ that you have to at least check the first item in the array to have any hope\
    \ of finding the entry you need. The syntax for the `do...while` loop is as follows:\n\
    \n```csharp\ndo {\n    // statements\n} while (conditional expression);\n```\n\
    \nIn the `do...while` example below, the loop will continue until the value of\
    \ a variable named `i` equals 0:\n\n```csharp\nint i = 10;\n\ndo {\n    i--;\n\
    \    Console.WriteLine($\"i = {i}\");\n} while (i > 0);\n```\n"
