    ## 7.6 Decimal type


    The integer and floating-point families of C# variable types have some limitations.
    Integers can only handle whole numbers, resulting in the fractional part of a
    value being stripped off. Floats, on the other hand, have problems with rounding
    accuracy. The best of both worlds is sometimes needed, and the decimal variable
    type is provided to address this situation. The decimal type is a compromise between
    integer and float variable types in that it can store fractional parts of a value
    and provide exact values in computations.


    As with floating-point numbers, literal values must be declared as being of type
    decimal using an ‘M’ suffix. The following code declares two decimal values, multiplies
    them, and displays the result:


    decimal val1 = 11231.582M;


    decimal val2 = 43342.12M;


    decimal result = val1 * val2;


    ## 7.7 Boolean type


    The C# Boolean variable type is declared using the bool keyword and allows for
    storing true and false values. Boolean variables are helpful in control flow constructs
    such as if and while statements.


    Unlike some other programming languages, C# Boolean variables must be assigned
    either true or false and cannot be assigned 1 or 0:


    bool loopFinished = false;


    if (loopFinished) {


      Console.WriteLine("The loop is complete");


    } else {


      Console.WriteLine("Still looping");


    }


