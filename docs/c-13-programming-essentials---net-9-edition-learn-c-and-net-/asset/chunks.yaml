    ## 10.4 Explaining the example


    In the above example, the string assigned to the carModel variable is used as
    the governing variable in the switch statement. As with the Jeep manufacturer,
    case statements may be grouped, preceding a single set of statements.


    The default option sets the carManufacturer string to “unknown” if none of the
    case statements match the car model string.


    ## 10.5 Using switch expressions


    Using a switch statement has saved us some typing and made the code easier to
    read, but C# allows us to further simplify the code using switch expressions,
    the syntax for which is as follows:


    result = value switch


    {


        constant1 => statements,


        constant2 => statements,


        constant3 or constant4 or ... => statements,


        constant5 and constant 6 or constant7 => statements,


        _ => default_statement


    };


    Using a switch expression, our example can be simplified as follows:


    string carModel = "Corolla";


    string carManufacturer;


    carManufacturer = carModel switch


    {


        "Patriot" or "Liberty" or "Wrangler" => "Jeep",


        "Focus" => "Ford",


        "Corolla" => "Toyota",


        _ => "unknown"


    };


    Console.WriteLine($"Manufacturer is {carManufacturer}");


    ## 10.6 Using goto in a C# switch statement


    In our original example, we used the break statement to exit out of the switch
    statement. The result of this is to move the point of program execution to the
    statements immediately following the switch statement. Unfortunately, this presents
    a problem when the default statements must be executed. To address this requirement,
    we can replace the break statements in our example code with a goto default statement:


    string carModel = "Corolla";


    string carManufacturer = "unknown";


    switch (carModel) {


        case "Patriot":


        case "Liberty":


        case "Wrangler":


            carManufacturer = "Jeep";


            goto default;


        case "Focus":


            carManufacturer = "Ford";


            goto default;


        case "Corolla":


            carManufacturer = "Toyota";


            goto default;


        default:


            Console.WriteLine($"The {carModel} is manufactured by {carManufacturer}");


            break;


    }


    While the goto statement could also be used to jump to a labeled location in our
    C# code, using it in this way is strongly discouraged. The above-mentioned use
    is the only acceptable use of the goto statement in a modern object-oriented language
    such as C#. As any veteran programmer will tell you, if you find yourself in a
    position where a goto statement is your only way of achieving something, you need
    to re-think and re-structure your code so that you no longer need the goto.


    ## 10.7 Using continue in a C# switch statement


    Another alternative to the break statement is the continue statement. Suppose
    the switch statement is part of a loop. In that case, the continue statement will
    cause execution to return immediately to the beginning of the loop, bypassing
    any subsequent code yet to be executed in the current loop iteration.


    The use of the continue statement in loops will be covered in the “C# Looping
    with the for Statement” chapter.


