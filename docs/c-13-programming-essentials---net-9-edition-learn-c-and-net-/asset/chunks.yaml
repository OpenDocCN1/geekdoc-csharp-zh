    \nTable 7-3\n\n## 7.10 String data type\n\nPreviously, we looked at storing individual\
    \ characters in a `char` variable. While this works for storing a single letter,\
    \ number, or Unicode scalar, it is of little use for storing entire words or sentences.\
    \ For this purpose, the `string` variable type is supported by C#. Constants or\
    \ variables of type `string` can store a string of any number of characters.\n\
    \nString literal values are surrounded by double quotes (`\"`). For example:\n\
    \n```cs\nstring myString = \"This is string is literal.\";\n```\n\n## 7.11 Verbatim\
    \ string literals\n\nA regular string value will interpret special characters.\
    \ The following code, for example, consists of a string containing multiple special\
    \ characters:\n\n```cs\nstring myString = \"This is some text\\n\\n\\tand this\
    \ is some more.\";\n```\n\nAs shown above, the only way to make the text span\
    \ multiple lines is to use the `\\n` escape character when using a standard string\
    \ literal. The following code, for example, will not compile:\n\n```cs\nstring\
    \ myString = \"This is some text\n\n    and this is some more.\";\n```\n\nA string\
    \ literal must be declared as a verbatim string literal type for it to be interpreted\
    \ precisely as written.\n\nVerbatim string literals ignore the special meaning\
    \ of escape characters and can span multiple lines. To declare a string literal\
    \ as verbatim, prefix the declaration with the `@` character. For example, this\
    \ allows literals such as the following to be expressed:\n\n```cs\nstring myString\
    \ = @\"Hi Team,\n\nThe file located at 'C:\\Users\\demo\\newdata.txt'\n\nuses\
    \ the \\t sequence to insert tabs into text.\n\n             Best regards\n\n\
    \                               John\";\n\nConsole.WriteLine(myString);\n```\n\
    \nThe above string literal will appear as follows when the code runs:\n\nHi Team,\n\
    \nThe file located at 'C:\\Users\\demo\\newdata.txt'\n\nuses the \\t sequence\
    \ to insert tabs into text.\n\n             Best regards\n\n                 \
    \              John\n\n## 7.12 String interpolation\n\nStrings may also be constructed\
    \ using combinations of strings, variables, constants, expressions, and function\
    \ calls using string interpolation.\n\nInterpolation involves embedding items\
    \ into a string by prefixing the literal declaration with a `$` character and\
    \ wrapping the item as follows where `{item}` is a constant or variable name,\
    \ a function call, or even an expression such as a mathematical calculation:\n\
    \n```cs\nint count = 10;\n\nstring message = $\"The current count is {count}\"\
    ;\n```\n\nThe following code, for example, creates a new string variable using\
    \ string interpolation to embed content from a variety of sources before outputting\
    \ it to the console:\n\n```cs\nstring userName = \"John\";\n\nint inboxCount =\
    \ 25;\n\nint maxCount = 100;\n\nvar message = $\"{userName} has {inboxCount} messages.\
    \ Message capacity remaining is {maxCount - inboxCount}.\";\n\nConsole.WriteLine(message);\n\
    ```\n\nRunning the above example code will generate the following:\n\nJohn has\
