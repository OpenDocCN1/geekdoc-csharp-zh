    of C# List collections:


    [https://www.answertopia.com/tccy](https://www.answertopia.com/tccy)


    ![](images/image-F8OS1N2G.jpg)


    ## 27.14 Summary


    C# Collection Classes provide advanced mechanisms for grouping objects, with List
    <t>being a key class that allows for dynamic resizing. Lists can be created, modified,
    and queried using methods like Add(), Remove(), Contains(), and IndexOf(). Additionally,
    lists can be sorted, cleared, and their properties like Count and Capacity can
    be accessed to obtain information about the list content.</t>


    ## 28\. C# Dictionary Collections


    C# dictionaries allow data to be stored and managed as key-value pairs. Dictionaries
    fulfill a similar purpose to arrays and lists, except each item stored in the
    dictionary has associated with it a unique key (to be precise, the key is unique
    to the particular dictionary object) which can be used to reference and access
    the corresponding value.


    ## 28.1 Creating the DictionaryDemo Project


    Launch VS Code, open your “C# Essentials” workspace folder and create a new .NET
    Console App project named DictionaryDemo.


    Once you have created the project, open the Program.cs file and use it to try
    out the examples in the rest of this chapter.


    ## 28.2 Dictionary initialization


    A dictionary is a data type explicitly designed to hold multiple values in a single
    unordered collection. Each item in a dictionary consists of a key and an associated
    value.


    An empty dictionary may be created using the following syntax:


    Dictionary <key-type value-type="">name =</key-type>


        new Dictionary<key-type value-type="">();</key-type>


    The following code, for example, creates an empty dictionary using an int for
    the key and a string for the values:


    Dictionary <int string="">movies =</int>


        new Dictionary<int string="">();</int>


    Alternatively, you can use implicit typing using the var keyword:


    var movies = new Dictionary<int string="">();</int>


    A new dictionary may be initialized with a collection of values using a collection
    initializer with the following syntax (note that we are once again using implicit
    typing):


    var name = new Dictionary<key-type value-type="">()</key-type>


    {


        { key1, value1 },


        { key2, value2 },


        { key3, value3 },


    .


    .


    };


    The following code creates a new dictionary initialized with four key-value pairs
    in the form of strings acting as keys for corresponding movie titles:


    var movies = new Dictionary<string string="">()</string>


    {


        { "DRA-1212", "The Godfather" },


        { "WAR-4433", "Apocalypse Now" },


        { "COM-5465", "The Terminal" },


        { "CLA-1659", "Casablanca" }


    };


    In the above instance, the C# compiler will use implicit typing to decide that
    both the key and value elements of the dictionary are of string and prevent values
    or keys of other types from being inserted into the dictionary.


    ## 28.3 Dictionary item count


    A count of the items in a dictionary can be obtained by accessing the dictionary’s
    Count property:


    var movies = new Dictionary<string string="">()</string>


        {


            { "DRA-1212", "The Godfather" },


            { "WAR-4433", "Apocalypse Now" },


            { "COM-5465", "The Terminal" },


            { "CLA-1659", "Casablanca" }


        };


    Console.WriteLine($"Count = {movies.Count}");


    Output:


    Count = 4


    ## 28.4 Dictionary iteration


    As with arrays and lists, you can iterate through all entries in a dictionary
