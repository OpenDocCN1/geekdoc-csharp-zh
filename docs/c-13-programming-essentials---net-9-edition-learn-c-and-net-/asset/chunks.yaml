    ```\n\n运行代码并确认当前目录已更改为 `MyFiles` 子目录，例如：\n\n`/Users/neilsmyth/Dropbox/Documents/Books/C#_13/C#\
    \ Essentials/FileDemo/MyFiles`\n\n## 29.9 处理文件和目录异常\n\n在 C# 中处理文件和目录时，重要的是许多许多操作都有抛出异常的可能。例如，考虑上述更改当前工作目录的代码。该示例之所以有效，是因为我们检查了\
    \ `MyFiles` 目录的存在性，并在必要时创建了它。然而，如果目录不存在，结果将不同。要看到这一效果，请向项目添加以下代码：\n\n```csharp\n\
    Directory.SetCurrentDirectory(\"MyFiles1\");\n```\n\n点击运行按钮，此时程序将带有以下未处理的 `DirectoryNotFoundException`\
    \ 错误终止：\n\n```\nUnhandled exception. System.IO.DirectoryNotFoundException: Could\
    \ not find a part of the path '/temp/MyFiles1'.\n    at Interop.ThrowExceptionForIoErrno(ErrorInfo\
    \ errorInfo, String path, Boolean isDirError)\n```\n\n为了避免未处理的异常，对文件和目录的处理必须进行防御性编码（例如在引用之前检查目录或文件是否存在），或者在类似下面的\
    \ try-catch 语句中执行：\n\n```csharp\ntry\n{\n    Directory.SetCurrentDirectory(\"\
    MyFiles1\");\n}\ncatch (Exception ex)\n{\n    Console.WriteLine($\"{ex.Message}\"\
    );\n}\n```\n\n## 29.10 使用 File 类处理文件\n\n在涵盖了 C# 目录处理的基础知识后，是时候查看文件了。`System.IO.File`\
    \ 类提供了用于文件的创建、删除、复制和写入等方法。`FileInfo` 类提供了等效的方法。`File` 类提供了一系列用于处理文件的静态方法。\n\n\
    ### 29.10.1 检查文件是否存在\n\n与目录一样，我们可以通过调用 `File.Exists()` 方法检查路径的文件是否存在：\n\n```csharp\n\
    if (File.Exists(\"MyFile.txt\"))\n```\n\n### 29.10.2 创建并打开文件\n\n我们还可以结合 `FileMode`\
    \ 值使用 `File.Open()` 方法创建并打开文件：\n\n```csharp\nvar myFile = File.Open(<path>, <mode>);\n\
    ```\n\n打开文件时可以使用以下模式：\n- `Append`: 如果文件存在则打开它，否则创建一个新的。后续的写入操作将追加到现有文件中。\n- `Create`:\
    \ 创建新文件，如果已存在则覆盖它。\n- `CreateNew`: 尝试创建一个新文件，如果文件已存在则抛出异常。\n- `Open`: 打开现有文件，如果不存在则抛出异常。\n\
    - `OpenOrCreate`: 如果文件存在则打开，否则创建一个新的。\n- `Truncate`: 打开现有文件并将其截零为零。\n\n要创建一个新文件并覆盖现有文件可以使用以下代码：\n\
    \n```csharp\nFile.Open(\"MyFile.txt\", FileMode.Create);\n```\n\n### 29.10.3 使用\
    \ File 类读取和写入\n\n`WriteAllText()` 方法将字符串写入指定的文件。如果文件已存在，它将被覆盖，否则将创建一个新文件。相反，`ReadAllText()`\
    \ 方法将读取文件的内容并将其作为字符串返回。以下代码在读取之前向名为 `MyFile.txt` 的文件写入字符串：\n\n```csharp\nFile.WriteAllText(\"\
    MyFile.txt\", \"Hello, this is some text.\");\nstring content = File.ReadAllText(\"\
    MyFile.txt\");\nConsole.WriteLine($\"content = {content}\");\n```\n\n当代码执行时，终端将显示：\n\
    \n`content = Hello, this is some text.`\n\n要向现有文件追加文本，我们调用 `AppendAllText()` 方法：\n\
    \n```csharp\nFile.WriteAllText(\"MyFile.txt\", \"Hello, this is some text.\");\n\
    File.AppendAllText(\"MyFile.txt\", \" This is more text.\");\nstring content =\
    \ File.ReadAllText(\"MyFile.txt\");\nConsole.WriteLine($\"content = {content}\"\
    );\n```\n\n生成的终端输出将如下：\n\n`Hello, this is some text. This is more text.`\n\n要一次性向文件写入多行文本，将行放在列表集合中并传递给\
    \ `WriteAllLines()` 方法：\n\n```csharp\nList<string> textList = [\"Kia Sorento\"\
    , \"Alfa Romeo GTV6\", \"Chevy Spark\", \"Ford Explorer\", \"Toyota Celica\"];\n\
    File.WriteAllLines(\"MyFile.txt\", textList);\n```\n\n"
