    ## 10.9 Summary


    The if-else statement is a reliable way to make decisions when there are only
    a few possible outcomes. However, when many potential outcomes result from an
    evaluation, this approach can become cumbersome. In such cases, the switch statement
    is a better option for implementing flow control logic in C#. A switch statement
    may be further simplified in many situations using a switch expression.


    ## 11\. C# Looping with the for Statement


    This chapter will continue looking at control flow in C# code. In the preceding
    chapters, we have examined using logical expressions to decide what C# code should
    be executed. Another aspect of control flow entails the definition of loops. Loops
    are sequences of C# statements that execute repeatedly until a specified conditions
    are met.


    ## 11.1 Why use loops?


    It is generally common knowledge that computers are great at performing repetitive
    tasks an infinite number of times and doing so very quickly. It is also common
    knowledge that computers really don’t do anything unless someone programs them
    to tell them what to do. Loop statements are the primary mechanism for telling
    a computer that a sequence of tasks needs to be repeated a specific number of
    times. Suppose, for example, that you need to add a number to itself ten times.
    One way to do this might be to write the following C# code:


    long j = 1;


    j += j;


    j += j;


    j += j;


    j += j;


    j += j;


    j += j;


    j += j;


    j += j;


    j += j;


    j += j;


    While somewhat cumbersome, this does work. What would happen if you needed to
    perform this task 100 or even 10,000 times? Writing C# code to perform this as
    above would be prohibitive. Such a scenario is precisely what the for loop is
    intended to handle.


    The syntax of a C# for loop is as follows:


    for ( <initializer>; <conditional expression="">; <loop expression="">)</loop></conditional></initializer>


    {


          statements to be executed


    }


    The <initializer>element initializes a counter variable. Traditionally, the variable
    i is used for this purpose. For example:</initializer>


    i = 0;


    The code above sets the counter to be variable i and sets it to zero. Note that
    if the counter variable has not been previously declared, it may be declared as
    part of the for statement:


    int i = 0;


    The conditional expression specifies the test to verify whether the loop has performed
    the required number of iterations. For example, if we want to loop 100 times:


    i < 100;


    Finally, the loop expression specifies the action to perform on the counter variable.
    For example, to increment by 1:


    i++;


    The body of statements to be executed on each iteration of the loop is contained
    within the code block defined by the opening ({) and closing (}) braces.


    By bringing this all together, we can create a for loop to perform the task outlined
    in the earlier example:


    long j = 1;


    for (int i=0; i<50; i++) {


          j += j;


          Console.WriteLine("j = " + j);


    }


    ## 11.2


    ### C#


    ## loop variable scope


    A key point to note in creating loops is that any variables defined within the
    body of a loop are only visible to code within the loop. This is a concept known
    as scope. If, for example, a variable myCounter is defined within the body of
    a for loop, that variable ceases to exist once the loop terminates:


    // variable myCounter does not yet exist


    for (int i = 0; i < 10; i++)


    {


           int myCounter = 0; //myCounter variable created in scope of for loop


           myCounter += i;


    }


    // after loop exit variable myCounter is now out of scope and ceases to exist


    ## 11.3 Creating an infinite for loop


    A for loop, which will execute an infinite number of times, may be constructed
    using for (;;) syntax. For example, the following code sample will output “Hello
    from C#” until the program is manually terminated by the user (or the computer
    is turned off or rebooted):


    for (;;)


    {


        Console.WriteLine("Hello from C#");


    }


    If you try the above example in VS Code and find yourself in an infinite loop,
    you can stop execution using the stop button highlighted in Figure 11-1 below:


    ![](images/image-WYUHYY24.png)


