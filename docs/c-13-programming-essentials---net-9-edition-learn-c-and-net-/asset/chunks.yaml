    ## 30.6 Concatenating strings


    Strings may be concatenated (i.e., joined together) simply by adding them together
    using the addition operator (+).


    We can, therefore, combine two strings as follows:


    string myString = "Hello World.";


    Console.WriteLine(myString + " How are you?");


    Output:


    Hello World. How are you?


    Alternatively, you can concatenate strings using the Concat() instance method
    of the string class. This method takes two strings to be joined as arguments and
    returns a new string containing the union of the two strings:


    string myString1 = "If at first you don’t succeed, ";


    string myString2 = "try, try again.";


    string myString3 = string.Concat(myString1, myString2);


    Console.WriteLine(myString3);


    Output:


    If at first you don’t succeed, try, try again.


    ## 30.7 Comparing strings


    C# provides several options if you need to compare one string with another. The
    most common option is to use the equality operator, as demonstrated in the example
    below:


    string myString1 = "Hello World";


    string myString2 = "Hello World";


    if (myString1 == myString2)


    {


        Console.WriteLine("The strings match.");


    }


    else


    {


        Console.WriteLine("They strings not match.");


    }


    Output:


    The strings match


    You can also compare strings in a similar way using the string.Equals() instance
    method. This method takes as arguments two strings to be compared and returns
    a Boolean result indicating whether or not the strings match:


    string myString1 = "Hello world";


    string myString2 = "Hello world";


    if (string.Equals(myString1, myString2))


    {


        Console.WriteLine("The strings match.");


    }


    else


    {


        Console.WriteLine("The strings do not match.");


    }


    Output:


    The strings match.


    In the above example, we passed both strings through to the Equals() method when
    performing the comparison. The Equals() method can also be called on a string
    literal or string object to achieve the same result:


    string myString1 = "Hello world";


    string myString2 = "Hello world";


    if (myString1.Equals(myString2, StringComparison.Ordinal))


    {


        Console.WriteLine("The strings match.");


    }


    else


    {


        Console.WriteLine("The strings do not match.");


    }


    Output:


    The strings match.


    So far, all of the comparisons we have explored have performed a case-sensitive
    comparison. When calling the Equals() method, you can also pass through a comparison
    type parameter. The type must be taken from the C# StringComparison enumeration,
    which, among values for performing culture-sensitive comparison settings, includes
    the OrdinalIgnoreCase value for case-insensitive comparisons:


    string myString1 = "HELLO WORLD";


    string myString2 = "Hello world";


    if (string.Equals(myString1, myString2, StringComparison.OrdinalIgnoreCase))


    {


        Console.WriteLine("The strings match.");


    }


    else


    {


        Console.WriteLine("The strings do not match.");


    }


    Output:


    The strings match.'
