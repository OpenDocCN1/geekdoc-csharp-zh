    ## 8.12 位运算符


    正如之前讨论的，计算机处理器以二进制方式工作。这些二进制本质上是 1 和 0 的流，每个 1 或 0 被称为一个位（bit）。8 个位组成一组，形成一个字节（byte）。因此，作为程序员，我们在代码中偶尔需要处理这一层面的工作并不为奇奇。为了满足这一需求，C#
    提供了一系列 `bit operators`（位运算符）。


    对于那些熟悉 `C`、`C++` 和 `Java` 等其他语言中位运算符的人来说，在 `C#` 语言语法的这一领域不会发现任何新奇。对于不熟悉二进制数的人来说，现在是寻找该主题相关参考资料的好时机，以便理解
    1 和 0 是如何组成字节并形成数字的。其他作者在描述该主题方面做得比我们在本书范围内所能做的多得多。


    为了本次练习的目的，我们将处理两个数字的二进制表示（为了简洁起见，在随后的示例中使用 8 位值）。首先，十进制数字 `171` 的二进制表示为：


    10101011


    其次，数字 `3` 由以下二进制序列表示：


    00000011


    现在有了两个可以操作的二进制数，我们可以开始查看 `C#` 位运算符了：


    ### 8.12.1 位取反 (Bitwise NOT)


    位取反由波浪号（`~`）表示，其效果是反转数字中所有的位。换句话说，所有的 0 都变成 1，所有的 1 都变成 0。以我们的示例数字 `3` 为例，位取反操作的结果如下：


    00000011 NOT

    11111100


    因此，以下 `C#` 代码的结果为 `-4`：


    ```csharp

    int y = 3;

    int z = ~y;

    Console.WriteLine($"Result is {z}");

    ```


    ### 8.12.2 位与 (Bitwise AND)


    位与由单个 ampersand（`&`）表示。它对两个数字进行逐位比较。在每个数字的二进制序列中，两个位都为 1 的任何对应位置会导致结果数字的相同位置出现
    1。如果任一个位位置包含 0，则结果中会出现 0。以我们的两个示例数字为例，显示如下：


    10101011 AND

    00000011

    00000011


    正如我们看到的，两个数字都有 1 的唯一位置是最后两个位置。因此，如果我们在 `C#` 代码中执行此操作，应该发现结果是 `3`（`00000011`）：


    ```csharp

    int x = 171;

    int y = 3;

    int z = x & y;

    Console.WriteLine($"Result is {z}");

    ```


    ### 8.12.3 位或 (Bitwise OR)


    位或也对两个二进制序列进行逐位比较。与与操作不同，如果第一个或第二个操作数中有一个 1，则位或操作就会在结果中放置一个 1。该运算符由单个竖线字符（`|`）表示。使用我们的示例数字，结果如下：


    10101011 OR

    00000011

    10101011


    如果我们在 `C#` 示例中执行此操作，结果将是 `171`：


    ```csharp

    int x = 171;

    int y = 3;

    int z = x | y;

    Console.WriteLine($"Result is {z}");

    ```


    ### 8.12.4 位异或 (Bitwise XOR)


    位异或（通常称为 `exclusive OR`，由脱符号字符（`^`）表示）执行与或操作类似的任务，不同在于如果两个数字中一个或另一个对应的位位置为 1，则在结果中放置一个
    1。如果两个位置都是 1 或 0，则结果中的相应位被设置为 0。例如：


    10101011 XOR

    00000011

    10101000


    在这种情况下，结果为 `10101000`，它转换为十进制则为 `168`。为了验证这一点，我们可以再次尝试一些 `C#` 代码：


    ```csharp

    int x = 171;

    int y = 3;

    int z = x ^ y;

    Console.WriteLine($"Result is {z}");

    ```


    ### 8.12.5 位左移 (Bitwise Left Shift)


    位左移将二进制数中的每个位向左移动指定数的位数。将整数向左移动一位的效果是使值翻倍。


    随着位向左移动，0 被放置在空出的最右侧（低位）位置。另请注意，一旦最左侧（高位）位移出了包含该值的变量的大小，这些高位就会被丢弃：


    10101011 Left Shift one bit

    101010110


    在 `C#` 中，位左移运算符由 `<<` 序列表示，后面紧跟要移动的位数。例如，向左位移 `1` 位：


    ```csharp

    int x = 171;

    int y = 3;

    int z = x << y; // 注意：原文示例逻辑通常是移位

    ```


    在 `C#` 中，位左移运算符由 `<<` 序列表示，后面紧跟要移动的位数。例如，向左位移 `1` 位：


    ```csharp

    int x = 171;

    int y = 1;

    int z = x << y;

    Console.WriteLine($"Result is {z}");

    ```

    （注：原文示例代码中 `z = x << y` 处 `y` 为 1，即位移 1 位）


    在 `C#` 中执行此操作结果为 `342`（二进制 `101010110`）。


    ### 8.12.6 位右移 (Bitwise Right Shift)


    位右移将二进制数中的每个位向右移动指定数的位数。将整数向右移动一位的效果是使值减半。


    随着位向右移动，0 被放置在空出的最右侧（低位）位置。另请注意（取决于符号位），一旦最左侧（高位）位移出了包含该值的变量的大小，这些高位就会被丢弃：


    10101011 Right Shift one bit

    01010101


    在 `C#` 中，位右移运算符由 `>>` 序列表示，后面紧跟要移动的位数。例如，向右位移 `1` 位：


    ```csharp

    int x = 171;

    int y = 1;

    int z = x >> y;

    Console.WriteLine($"Result is {z}");

    ```


    在 `C#` 中执行此操作结果为 `85`（二进制 `01010101`）。


    ## 8.13 复合位运算符


    与算术运算符一样，每个位运算符都有对应的复合运算符，允许使用单个运算符完成操作和赋值：


    | 运算符 | 描述 |

    | :--- | :--- |

    | `x &= y` | 对 `x` 和 `y` 执行位与并将结果赋值给 `x` |

    | `x |= y` | 对 `x` 和 `y` 执行位或并将结果赋值给 `x` |

    | `x ^= y` | 对 `x` 和 `y` 执行位异或并将结果赋值给 `x` |

    | `x <<= n` | 将 `x` 左移 `n` 位并将结果赋值给 `x` |

    | `x >>= n` | 将 `x` 右移 `n` 位并将结果赋值给 `x` |


