    In the above syntax, `n` is the placeholder number and `control` is the special
    format control sequence to be applied to the argument. The `x` optional number
    further formats the output for certain control types.


    ### 31.5 A simple format control example


    The following example uses the `X` format control, which is used to display a
    number using hexadecimal format:


    ```csharp

    var newString = string.Format("The number {0} in Hexadecimal is {0:X}.", 432);

    Console.WriteLine (newString);

    ```


    Output:

    The number 432 in Hexadecimal is 1B0.


    The above example displays argument `0` (`432`) in two formats. The first is the
    default decimal format, while the second uses the `X` format control to display
    the argument as a hexadecimal number.


    The `string.Format()` method provides a wide range of format controls which we
    will explore below.


    ### 31.6 C# string Format() format controls


    The following table lists format controls supported by the C# `string.Format()`
    method together with examples of each control:


    | Control | Type | Description | Example |

    | :--- | :--- | :--- | :--- |

    | C | Currency | Displays number prefixed with the currency symbol appropriate
    to the current locale | `{0:C}` of 432.00 outputs $432.00 |

    | D | Decimal | Displays numbers in decimal form with optional padding | `{0:D4}`
    of 432 outputs 00432 |

    | E | Exponential | Displays number in scientific form with optional value for
    the fractional part | `{0:E5}` of 432.32 outputs 4.32320E+002 |

    | F | Fixed | Displays the number, including the specified number of decimal digits
    | `{0:F3}` of 432.324343 outputs 432.324 |

    | N | Number | Converts a number to a human-friendly format by inserting commas
    and rounding to the nearest 100th | `{0:N}` of 123432.324343 outputs 123,432.32
    |

    | X | Hexadecimal | Converts a number to hexadecimal | `{0:X}` of 432 outputs
    1B0 |

    | 0:0… | Zero Padding | Adds zeros to pad argument | `{0:0000.00}` of 43.1 outputs
    0043.10 |

    | 0:0#… | Space Padding | Adds spaces to pad argument | `{0:####.##}` of 43.1
    outputs 43.1 |

    | % | Percentage | Multiplies the argument by 100 and appends a percentage sign
    | `{0:00.00%}` of .432 outputs 43.20% |


    Table 31-1


    Before moving on to the next chapter, run the following code to see some of these
    format controls in action:


    ```csharp

    var newString = string.Format("The number {0} fixed to 2 decimal places is {0:F2}.",
    109.78799);

    Console.WriteLine (newString);


    newString = string.Format("The number {0} using human friendly formatting is {0:N}.",
    1023429.78799);

    Console.WriteLine (newString);


    newString = string.Format("The number {0} using exponential formatting is {0:E6}.",
    32423.24232);

    Console.WriteLine (newString);


    newString = string.Format("The number {0} as a percentage to 3 decinal places
    is {0:00.000%}.", 0.24232);

    Console.WriteLine (newString);

    ```


    Output:

    The number 109.78799 fixed to 2 decimal places is 109.79.

    The number 1023429.78799 using human friendly formatting is 1,023,429.79.

    The number 32423.24232 using exponential formatting is 3.242324E+004.

    The number 0.24232 as a percentage to 3 decinal places is 24.232%.


