- fmt: "\nThe Terminal panel is a fully interactive environment. You can run commands\
    \ just as you would in a Command Prompt on Windows or a terminal window on macOS\
    \ or Linux.\n\nEdit the `Program.cs` file and add the following lines:\n\n```csharp\n\
    Console.Write(\"Please enter your name: \");\nvar username = Console.ReadLine();\n\
    Console.WriteLine($\"Hi {username}. Welcome to C#!\");\n```\n\nThe call to the\
    \ `ReadLine()` method waits for keyboard input and assigns typed text to a variable\
    \ called `username`:\n\n```\nHello, World!\nPlease enter your name: John Smith\n\
    Hi John Smith, Welcome to C#!\n```\n\n## 6.4 Top-level statements and the Main\
    \ method\n\nThe above example may be puzzling to those familiar with other programming\
    \ languages in that we could write lines and execute code without any surrounding\
    \ code structure or “instructions” to the compiler. Languages such as `C#` usually\
    \ require additional information, such as a class name and directives to import\
    \ framework dependencies. For example, our `Program.cs` file makes calls to methods\
    \ belonging to the `Console` class, which, in turn, belongs to the `System` namespace,\
    \ but we did not need to import that namespace into our code for it to run.\n\n\
    Another common requirement is to specify which code is the starting point for\
    \ execution. Many programming languages have a special main function or method\
    \ containing those initial lines of code. So if other programming languages have\
    \ these requirements, why doesn’t `C#`?\n\nThe answer is that `C#` has these requirements,\
    \ but VS Code automatically generates these so-called top-level statements for\
    \ us in the background. This is what the new console template comment in the `Program.cs`\
    \ file was referring to. Although we only have four lines of code in our app,\
    \ the actual code that gets compiled will resemble the following:\n\n```csharp\n\
    using System;\n\nnamespace SampleApp\n{\n    internal class Program\n    {\n \
    \       static void Main(string[] args)\n        {\n            Console.Write(\"\
    Please enter your name: \");\n            var username = Console.ReadLine();\n\
    \            Console.WriteLine($\"Hi {username}. Welcome to C#!\");\n        }\n\
    \    }\n}\n```\n\nThe `using` directive in the above code tells the compiler to\
    \ import the `System` namespace because the code in the file depends on it. Next,\
    \ the internal class is wrapped in a namespace declaration called `SampleApp`.\
    \ `C#` code contains classes, variables, and methods, all of which are assigned\
    \ names. Namespaces allow application code to be organized so that the names in\
    \ one workspace do not conflict with the same names in other workspaces. Anything\
    \ declared outside of a namespace is part of the global namespace.\n\nWithin the\
    \ `SampleApp` namespace, a `Program` class is declared to contain the `Main()`\
    \ method, which, in turn, contains the app code.\n\nYou can override the default\
    \ new console template behavior simply by declaring the above code in your `Program.cs`\
    \ file. The choice of which approach to use is one of personal preference, though\
    \ situations may arise where manually declaring the top-level statements is necessary.\
    \ Therefore, it is important to understand what is happening behind the scenes.\n\
    \n## 6.5 Take the knowledge test\n\nClick the link below or scan the QR code to\
    \ test your knowledge and understanding of `C#` in Visual Studio Code:\n\n[https://www.answertopia.com/zkxb](https://www.answertopia.com/zkxb)\n\
    \n![](images/image-4UYO622H.jpg)\n\n## 6.6 Summary\n\nIn this chapter, we created\
    \ a new workspace containing a .NET Console app project and explored the files\
    \ that make up a typical project before writing, compiling, and running `C#` code.\
    \ The chapter also introduced the concept of namespaces and explained how top-level\
    \ statements and the `Main()` method are automatically generated by VS Code.\n\
    \n## 7. C# Variables and Constants\n\nTo gain proficiency in any programming language,\
    \ you need to learn the basics. One of the most fundamental aspects of programming\
    \ is using variables and constants. Even advanced programs such as high-end video\
    \ games and enterprise commerce applications utilize variables in some form.\n\
    \nThis chapter will cover everything a `C#` programmer needs to know about variables\
    \ and constants.\n\n## 7.1 What is a C# variable?\n\nVariables are locations in\
    \ computer memory that are reserved for storing the data used by an application.\
    \ Each variable is given a name by the programmer and assigned a value. The name\
    \ assigned to the variable may then be used in the `C#` code to access the value\
    \ assigned to the variable. This access can involve either reading the variable’s\
    \ value or changing the value. It is, of course, the ability to change the value\
    \ of variables that gives them the name variable.\n\n## 7.2 Type annotations and\
    \ implicit typing\n\n`C#` is categorized as a type-safe programming language.\
    \ This essentially means that once a variable’s data type has been identified,\
    \ that variable cannot subsequently be used to store data of any other type without\
    \ inducing a compilation error. This contrasts with loosely typed programming\
    \ languages, where a variable, once declared, can subsequently be used to store\
    \ other data types.\n\nThere are two ways in which the type variable will be identified.\
    \ One approach is to use a type annotation when the variable or constant is declared\
    \ in the code. This is achieved by preceding the variable name with the type declaration.\
    \ The following line of code, for example, declares a variable named `userCount`\
    \ as being of type `int` (integer):\n\n```csharp\nint userCount = 10;\n```\n\n\
    When using type annotation, a value may be assigned to the variable after it has\
    \ been declared:\n\n```csharp\nint userCount;\nuserCount = 10;\n```\n\nAs an alternative\
    \ to type annotation, the `C#` compiler can use implicit typing to identify the\
    \ variable. When relying on implicit typing, the compiler looks to see what type\
    \ of value is assigned to the variable when it is initialized. To instruct the\
    \ compiler to use implicit typing, you must precede the variable name with the\
    \ `var` keyword. Consider, for example, the following variable declarations:\n\
    \n```csharp\nvar signalStrength = 22;\nvar companyName = \"My Company\";\n```\n\
    \nWhile compiling the above lines of code, `C#` will infer that the `signalStrength`\
    \ variable is type `int` and that `companyName` is type `string`.\n\nWhen a variable\
    \ is declared using implicit typing, it must be assigned a value at the point\
    \ of declaration. The following, for example, is not valid `C#` syntax:\n\n```csharp\n\
    var bookTitle;\nbookTitle = \"C# 13 Essentials - .NET 9 Edition\";\n```\n\n##\
    \ 7.3 What is a C# constant?\n\nA constant is similar to a variable, providing\
    \ a named location in memory to store a data value. Constants differ in one significant\
    \ way: once a value has been assigned to a constant, it cannot subsequently be\
    \ changed.\n\nConstants are particularly useful if a value is used repeatedly\
    \ throughout the application code. Rather than using the value each time, it makes\
    \ the code easier to read if the value is first assigned to a constant, which\
    \ is then referenced in the code. For example, it might not be clear to someone\
    \ reading your `C#` code why you used the value 5 in an expression. If, instead\
    \ of the value 5, you use a constant named `interestRate`, the purpose of the\
    \ value becomes much more apparent. Constants also have the advantage that if\
    \ the programmer needs to change a widely used value, it only needs to be changed\
    \ once in the constant declaration and not each time it is referenced.\n\nConstants\
    \ are declared using the `const` keyword and have a type, a name, and a value:\n\
    \n```csharp\nconst int interestRate = 10;\n```\n\nNote that a constant must be\
    \ initialized at the point that it is declared. For example, the following code\
    \ will fail to compile because it declares a constant without assigning a value:\n\
    \n```csharp\nconst int interestRate; // Invalid - a constant must be initialized\
    \ at creation\n```\n"
