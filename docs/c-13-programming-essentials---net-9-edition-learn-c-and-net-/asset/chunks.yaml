    ## 28.7 Checking if a key or value exists


    A dictionary can be searched to find out if it contains a particular key by calling
    the ContainsKey() method. Before adding new entries to a dictionary, you may want
    to call this method to ensure the key has not already been used to avoid a runtime
    exception error.


    You can also check whether a specific value exists in a dictionary with a call
    to the ContainsValue() method. The following example demonstrates both of these
    methods in action:


    var movies = new Dictionary<string string="">()</string>


    {


        { "DRA-1212", "The Godfather" },


        { "WAR-4433", "Apocalypse Now" },


        { "COM-5465", "The Terminal" },


        { "CLA-1659", "Casablanca" }


    };


    if (movies.ContainsKey("CLA-1659")) {


        Console.WriteLine("Key exists in dictionary");


    }


    if (movies.ContainsValue("The Godfather")) {


        Console.WriteLine("Title exists in dictionary");


    }


