  trans: "\n`C#` 是永无止境的追求的一部分，旨在让计算机编程对人类来说尽可能简单和高效。虽然将 `C#` 描述为另一种面向对象的编程语言很容易，但事实是，`C#`\
    \ 是整个开发和执行基础设施中不可或缺的一部分。这些章节的主要目标是概述 `C#` 语言及其所依赖的基础设施。\n\n 2.1 编程语言的历史\n\n编程的问题在于，计算机完全用数字进行思考（确切来说是\
    \ 0 和 1），这被称为机器码，而人类则使用单词进行交流。在早期，程序员直接向计算机输入机器码来对其进行编程。正如你所想象的，这是一个艰巨且容易出错的过程。下一次演进是将简短的人类可读命令与相应的机器码关联起来。例如，程序员可以输入\
    \ `MOV` 命令将值从一个微处理器寄存器转移到另一个。这些命令随后将由一个称为汇编器（assembler）的软件翻译成机器码，从而赋予这种命令语法“汇编语言”（Assembly\
    \ Language）的名字。\n\n接下来出现了一系列高级语言，旨在让人类更容易编写程序。这些程序使用人类可读的语法编写，然后由编译器编译成机器码，或者由解释器代表处理器进行解释。此类语言包括\
    \ `BASIC`、`COBOL`、`Pascal` 和 `Fortran`。另一种语言是 `C`，它于 20 世纪 60 年代末和 70 年代初创建于 AT&T\
    \ 贝尔实验室。然后，在 70 年代末和 80 年代初，人们开始研究一种面向面向的 `C` 编程方法，并形成了一种全新的面向对象的 `C` 变体，即 `C++`。\n\
    \n然而，故事仍在继续。`C++` 的问题在于很容易犯编程错误。例如，`C++` 会很乐然地允许程序员编写会导致缓冲区溢出的代码错误、内存位置被任意覆盖，并引入内存泄漏，导致应用程序膨胀到耗尽系统上的整个物理内存和交换空间。`C`、`C++`\
    \ 以及所有其他编译语言遇到的另一个问题是，源代码必须为每种处理器类型重新编译，这使得将应用程序从一个硬件平台迁移到另一个平台变得困难。\n\n为了解决 `C`\
    \ 和 `C++` 的缺点，太阳微系统公司（Sun Microsystems）在 90 年代开始研发一种新的编程语言和执行环境。结果被称为 `Java`。`Java`\
    \ 由一个消除了许多 `C++` 陷阱的编程语言、一种可移植的中间字节码格式、一个执行字节码并处理内存管理等问题的运行时环境（称为虚拟机）以及一个庞大的库套组成，提供了开发企业级应用程序所需的所有功能（如网络、文件处理、数据库访问、图形等）。\n\
    \n`Java` 迅速获得了认可，在一段时间内，微软启动了其 `Java` “拥抱并扩展”运动。太阳公司对微软拥抱 `Java` 感到高兴，但当他们意识到“扩展”部分是微软引入自己的专有版本语言的计划时，他们请出了律师。政治斗争随之而来，微软最终离开了\
    \ `Java`。不久，微软开始谈论被称为 `.NET` 的东西，随后是门名为 `C#` 的编程语言。\n\n 2.2 到底什么是\n\n### C#?\n\
    \n“所有这些历史与 `C#` 有什么关系？”我听到你这样问道。`C#` 编程语法的起源可以追溯到 `C` 和 `C++`。如果你已经熟悉 `C` 或 `C++`（甚至是\
    \ `Kotlin` 或 `Swift`），那么在学习 `C#` 时你就具有巨大的优势。`Java`、`C`、`C++` 和 `C#` 语法之间的相似性也是如此的。此外，`C#`\
    \ 还继承了 `Java` 在内存处理（更广为人知的垃圾回收）和中间字节码方面的许多优势，中间字节码消除了为每个目标硬件平台重新编译应用程序的需求。`C#`\
    \ 还伴随着一个庞大的库框架，旨在为程序员提供几乎所有想象情场景的现成解决方案。\n\n尽管有这些相似之处，`Java` 和 `C#` 基础设施之间存在差异。因此，下一章将提供\
    \ `C#` 基础设施的概述。\n\n 2.3 谁在使用 C#?\n\n尽管自 `C#` 引入以来发布了一些重要的新编程语言（如 `Swift` 和 `Kotlin`），但\
    \ `C#` 作为一种语言仍在不断进化，并拥有庞大且不断增长的用户群。\n\n例如，在写作时，`C#` 在 `TIOBE Index` 的前 50 个最广泛使用的编程语言中位列第\
    \ 5（仅次于 `C`、`Java`、`Python` 和 `C++`）。\n\n`C#` 用于开发桌面、移动端和服务器应用程序，以及基于 Web 的应用程序和服务。它是所有微软平台上的首选编程语言，并用于\
    \ `Unity` 实时开发平台中的编程。\n\n 2.4 接受知识测试\n\n点击下方链接或扫描二维码以测试你对 `C#` 历史的知识和理解：\n\n[`www.answertopia.com/qoe2`](https://www.answertopia.com/qoe2)\n\
    \n![](img/image-4R5YZF8F.jpg)\n\n 2.5 总结\n\n`C#` 是微软创建的一种编程语言，结合了 `C`、`C++` 和\
    \ `Java` 等其他流行语言的元素。它的设计旨在让编程更简单更高效，具有内存管理等功能以减少错误，并通过中间字节码实现跨平台兼容。`C#` 用于桌面、移动、服务器、Web\
    \ 和游戏开发，是前 10 大编程语言之一。\n\n# 3. C# 基础设施\n\n本章将介绍构建 `C#` 语言的基础设施。在本章结束时，你将清晰理解 `CLI`、`CLR`、`VES`、`JIT`\
    \ 和 `.NET` 等缩写的含义。\n\n 3.1 通用语言基础设施\n\n### CLI)\n\n`C#` 是一种面向对象的编程语言。它本质上是一个定义语法的标准。单独的\
    \ `C#` 用处有限，因为它依赖通用语言基础设施（CLI）来编译和执行应用程序。CLI 反过来定义了以下组件的规范：\n\n•虚拟执行系统 (`VES`)\n\
    •通用中间语言 (`CIL`)\n•通用类型系统 (`CTS`)\n•通用语言规范 (`CLS`)\n•框架\n\n在本剩下的范围内，我们将检查每个 CLI\
    \ 组件，以理解 CLI 环境是如何结合的。\n\n 3.2 通用中间语言\n\n### CIL)\n\n与 `C` 和 `C++` 编译器将源代码编译为目标微处理器可理解的机器码不同，`C#`\
    \ 编译器编译为一种名为通用中间语言（CIL）的中间字节码格式。这种代码可以在任何带有符合 CLI 的虚拟执行系统（VES）的系统上执行。因此，无需为每个目标平台编译应用程序。\n\
    \n通用中间语言中的“通用”一词之所以被使用，是因为这种格式不仅适用于 `C#` 编程语言。事实上，任何编程语言都可以目标 `CIL`，允许来自不同语言的库和代码模块在同一个应用程序中执行。支持\
    \ CIL 编译的典型语言包括 `Visual Basic`、`COBOL`、`PowerShell`、`Python` 和 `C++`。\n\n 3.3\
    \ 虚拟执行系统 (\n\n VES)\n\n"
