    ## 8\. C# Operators and Expressions


    This chapter covers using operators to create expressions when programming in
    C#, including arithmetic and assignment operators. Other topics covered include
    operator precedence, logical operators, and the ternary operator.


    In the previous chapter, we used variables and constants in C# and described the
    different variable and constant types. However, being able to create constants
    and variables is only part of the story. The next step is using these variables
    and constants in C# code. The primary method for working with the data stored
    in constants and variables is in the form of expressions. This chapter will examine
    C# expressions and operators in detail.


    ## 8.1 What is an expression?


    The most fundamental expression consists of an operator, two operands, and an
    assignment. The following is an example of an expression:


    int theResult = 1 + 2;


    In the above example, the (+) operator adds two operands (1 and 2) together. The
    assignment operator (=) subsequently assigns the result of the addition to an
    integer variable named theResult. The operands could have easily been variables
    or constants (or a mixture of each) instead of the actual numerical values used
    in the example.


    In the remainder of this chapter, we will examine the various operators available
    in C#.


    ## 8.2 The basic assignment operator


    We have already looked at the most basic of assignment operators, the = operator.
    This assignment operator assigns the result of an expression to a variable. In
    essence, the = assignment operator takes two operands. The left-hand operand is
    the variable to which a value is to be assigned, and the right-hand operand is
    the value to be assigned. The right-hand operand is, more often than not, an expression
    that performs some arithmetic or logical evaluation. The following examples are
    all valid uses of the assignment operator:


    int x;


    int y = 15;


    int z = 5;


    x = 10; // Assigns the value 10 to a variable named x


    x = y + z; // Assigns the result of variable y added to variable z to variable
    x


    x = y; // Assigns the value of variable y to variable x


    Assignment operators may also be chained to assign the same value to multiple
    variables. For example, the following code assigns the value 20 to the x, y, and
    z variables:


    int x, y, z;


    x = y = z = 20;


    ## 8.3


    ### C#


    ## arithmetic operators


    C# provides a range of operators to create mathematical expressions. These operators
    primarily fall into the category of binary operators in that they take two operands.
    The exception is the unary negative operator (-), which indicates that a value
    is negative rather than positive. This contrasts with the subtraction operator
    (-), which takes two operands (i.e., one value to be subtracted from another).
    For example:


    int y = -10; // Unary - operator used to assign -10 to a variable named y


    int z = 2;


    int x = y - z; // Subtraction operator. Subtracts z from y


    The following table lists the primary C# arithmetic operators:


    | Operator | Description |


    | – (unary) | Negates the value of a variable or expression |


    | * | Multiplication |


    | / | Division |


    | + | Addition |


    | – | Subtraction |


    | % | Modulo |


    Table 8-1


    Note that multiple operators may be used in a single expression, for example:


    int y = 10; // Unary - operator used to assign -10 to a variable named y


    int z = 2;


    int x = y * 10 + z - 5 / 4;


    While the above code is perfectly valid, it is essential to be aware that C# does
    not evaluate the expression from left to right or right to left but instead in
    an order specified by the precedence of the various operators that conform to
    basic mathematical principles. Operator precedence is an important topic to understand
    since it impacts the result of a calculation and will be covered in detail in
    the next section.


    ## 8.4


    ### C#


    ## operator precedence


    C# uses the same operator order concept as in basic mathematics. For example,
    we probably all learned from our school days that the answer to the following
    calculation is 210, not 300:


    int x;


    x = 10 + 20 * 10;


    Console.WriteLine(x);


    When the code runs, the generated result will be 210\. This is a direct result
    of operator precedence. C# knows the same rules we learned at school that tell
    it which order operators should be evaluated in an expression. For example, C#
    correctly considers the multiplication operator (*) to be of higher precedence
    than the addition (+) operator.


    Fortunately, the precedence built into C# can be overridden by surrounding the
    lower priority section of an expression with parentheses (another common concept
    in basic mathematics). For example:


    int x;


    x = (10 + 20) * 10;


    In the above example, the expression fragment enclosed in parentheses is evaluated
    before the higher precedence multiplication, resulting in a value of 300.


    The following table outlines the C# operator precedence order from highest precedence
    to lowest:


    | Precedence | Operators |


    | Highest | +, -, !, ~, ++x, –x, (T)x |


    |  | * / % |


    |  | + – |


    |  | << >> |


    |  | < > <= >= is as |


    |  | == != |


    |  | & |


    |  | ^ |


    |  | &#124; |


    |  | && |


    |  | &#124;&#124; |


    |  | :? |


    | Lowest | =, *=, /=, %=, +=, -=, <<=, >>=, &=, ^=, &#124;= |


    Table 8-2


    It should come as no surprise that the assignment operators have the lowest precedence
    since you would only want to assign the result of an expression once that expression
    has been thoroughly evaluated. Don’t worry about memorizing the above table. Most
    programmers use parentheses to evaluate their expressions in the desired order.


