    abstract member is not implemented in the base class and must be implemented in
    derived classes for the class to compile.


    Another type of member is a virtual member. A member defined as virtual must be
    implemented in the base class but may optionally be overridden in the derived
    class if different behavior is required. Virtual members are declared using the
    virtual modifier in the base class.


