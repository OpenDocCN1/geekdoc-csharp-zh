    ## 8. C# 运算符和表达式


    本章介绍了在 C# 程序中使用运算符创建表达式，包括算术运算符和赋值运算符。其他涵盖的话包括运算符优先级、逻辑运算符和三元运算符。


    在上一章中，我们在 C# 中使用了变量和常量，并描述了不同的变量和常量类型。然而，能够创建常量变量只是故事的一部分。下一步是在 C# 代码中使用这些变量和常量。处理存储在常量和变量中的数据的主要形式是表达式。本章将详细研究
    C# 表达式和运算符。


    ## 8.1 什么是表达式？


    表达式由一个运算符、两个操作数和一个赋值组成。以下是一个表达式的示例：


    ```csharp

    int theResult = 1 + 2;

    ```


    在上述示例中，`(+)` 运算符将两个操作数（`1` 和 `2`）相加。赋值运算符（`=`）随后将加法结果赋值给一个名为 `theResult` 的整数变量。操作数完全可以是变量或常量（或两者的混合），而不是示例中使用的实际数值。


    在本章的剩余部分中，我们将研究 C# 中可用的各种运算符。


    ## 8.2 基础赋值运算符


    我们已经查看了最基础的赋值运算符，即 `=` 运算符。该赋值运算符将表达式的结果赋值给变量。从本质上说，`=` 赋值运算符接收两个操作数。左侧操作数是要待赋值的值的变量，右侧操作数是待赋值的值。右侧操作数通常是一个执行某些算术或逻辑评估的表达式。以下示例都是赋值运算符的有效用法：


    ```csharp

    int x;


    int y = 15;


    int z = 5;


    x = 10; // 将值 10 赋值给名为 x 的变量


    x = y + z; // 将变量 y 加上变量 z 的结果赋值给变量 x


    x = y; // 将变量 y 的值赋值给变量 x

    ```


    赋值运算符也可以链式使用，为多个变量分配相同的值。例如，以下代码将值 `20` 赋值给 `x`、`y` 和 `z` 变量：


    ```csharp

    int x, y, z;


    x = y = z = 20;

    ```


    ## 8.3 C#


    ### ### 算术运算符


    C# 提供了一系列运算符来创建数学表达式。这些运算符主要属于二进制运算符，因为它们接收两个操作数。例外是一元负运算符（`-`），它表示一个值为负值而不是正值。这与减法运算符（`-`）不同，减法运算符接收两个操作数（即从另一个值中减去一个值）。例如：


    ```csharp

    int y = -10; // 将 -10 赋值给名为 y 的变量


    int z = 2;


    int x = y - z; // 减法。从 y 中减去 z

    ```


    下表列出了主要的算术运算符：


    | 运算符 | 描述 |

    | :--- | :--- |

    | – (一元) | 取反 |

    | * | 乘法 |

    | / | 除法 |

    | + | 加法 |

    | – | 减法 |

    | % | 取模 |


    表 8-1


    注意，单个表达式可以使用多个运算符，例如：


    ```csharp

    int y = -10; // 一元运算符将 -10 赋值给名为 y 的变量


    int z = 2;


    int x = y / 5;

    ```


    并不是从左到右或从右到左评估表达式，而是根据优先级顺序。


    ## 8.4 C#


    ### ### 运算符优先级


    C# 使用与基础数学相同的运算符顺序概念。例如，我们可能在学校中学过以下计算的答案是 210，而不是 300：


    ```csharp

    int x;


    x = 10 + 20 * 10;


    Console.WriteLine(x);

    ```


    当代码运行时，生成的的结果将是 210。这是运算符优先级的直接。C# 正确认为乘法运算符（`*`）的优先级高于加法运算符（`+`）。


    幸运的是，可以通过括号包裹低优先级的部分来覆盖 C# 内置的优先级（基础数学中的另一个常见概念）。例如：


    ```csharp

    int x;


    x = (10 + 20) * 10;

    ```


    在上述示例中，括号内的表达式部分在执行高优先级乘法之前计算，结果为 300。


    下表概述了 C# 运算符从最高优先级到最低优先级的顺序：


    | 优先级 | 运算符 |

    | :--- | :--- |

    | 最高 | +, -, !, ~, ++x, –x, (T)x |

    |  | * / % |

    |  | + – |

    |  | << >> |

    |  | < > >= >= |

    |  | == != |

    |  | & |

    |  | ^ |

    |  | \| |

    |  | && |

    |  | \|\| |

    |  | :? |

    | 最低 | =, *= /=, %= +=, -=, <<=, >>=, &=, ^=, |= |


    表 8-2


    赋值运算符具有最低优先级并不出意料，因为你只会在该表达式经过彻底评估后才对其结果赋值。不要担心背诵上面的表格。大多数程序员使用括号来按照所需的顺序评估它们的表达式。


