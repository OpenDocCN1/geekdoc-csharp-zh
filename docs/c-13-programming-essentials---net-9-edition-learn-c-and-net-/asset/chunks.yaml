    support inheritance and subclassing in the way that classes do. In other words,
    it is not possible for one structure to inherit from another structure. Unlike
    classes, structures also cannot contain a finalizer method. Structure members
    cannot be specified as abstract, virtual, or protected. Structures can, however,
    implement interfaces.


    ## 20.5 Read-only structures


    Structures can be declared as being read-only using the readonly modifier. When
    declared in this way, all data members of the structure must also be declared
    as being read-only. In the case of field members, this requires the use of the
    readonly modifier. Properties, on the other hand, must either be declared as readonly
    or use the init-only accessors (a topic covered in the chapter entitled “An Introduction
    to C# Object-Oriented Programming”).


    The following structure, for example, includes both a read-only field and an init-only
    property:


    namespace StructureDemo;


    public readonly struct SampleStruct(string name)


    {


        private readonly string _name = name;


        public string Name {


            get => _name;


        }


        public string BuildHelloMsg() {


            return "Hello " + _name;


        }


    }


    20.6 Take the knowledge test


    Click the link below or scan the QR code to test your knowledge and understanding
    of C# structures:


    [https://www.answertopia.com/i5tf](https://www.answertopia.com/i5tf)


    ![](images/image-949XAYQJ.jpg)


    ## 20.7 Summary


    C# structures and classes provide a mechanism for creating instances that define
    properties, store values, and define methods. Although the two mechanisms appear
    similar, significant behavioral differences exist, especially when structure and
    class instances are copied or passed to a method. Classes are categorized as reference-type
    instances, while structures are value-type. When a structure instance is copied
    or passed, an entirely new copy of the instance is created containing its own
    data. On the other hand, class instances are passed and copied by reference, with
    each reference pointing to the same class instance. Other features unique to classes
    include support for inheritance and finalizers.


    ## 21\. C# Tuple Type


    In the “C# Methods” chapter, we learned how to create methods in C# that can pass
    arguments and return results. This chapter will focus on the C# tuple type and
    understand how it combines collections of values into a single entity. Once created,
    a tuple can be passed from one method to another while allowing methods to return
    multiple results in a single return value. Tuples can be created with minimal
    coding and can store data of any type. Additionally, the values stored within
    a tuple are not required to be the same type.


    21.1 Creating the TupleDemo project


    To try out the C# tuple type, launch VS Code, open your “C# Essentials” workspace
    folder and create a new .NET Console App project named TupleDemo.


    ## 21.2 Declaring a Tuple


    When we declare a tuple we need to provide it with the values to be stored and,
    optionally, the corresponding value types. The syntax for declaring a tuple is
    as follows:


    (<type1>, <type2>, ...) <tuplename>= (<value1>, <value2>, ...)</value2></value1></tuplename></type2></type1>


    For example, modify the Program.cs file as follows, to add the top-level statements,
    the Main() method, and a method named GetProductData() that contains a tuple declaration:


    namespace TupleDemo


    {


        internal class Program


        {


            static void Main(string[] args)


            {


                GetProductData();


            }


            private static void GetProductData()


            {


                (int, string, double) myTuple = (10, "Refrigerator", 432.43);


            }


        }


    }


    If you prefer not to declare the type of each tuple value, the var keyword may
    be used to tell the compiler to infer the value types:


    var myTuple = (10, "Refrigerator", 432.43);


    ## 21.3 Accessing tuple values


    The elements of a tuple can be accessed using several different techniques. A
    specific tuple value may be accessed using dot notation to access Item <n>where
    <n>is the number of the item (with the first value being at position 1). The code
    below, for example, extracts item 2 from the tuple, assigns it to a variable and
    writes it to the console:</n></n>


    private static void GetProductData()


    {


        var myTuple = (10, "Refrigerator", 432.43);


        var item2 = myTuple.Item2;


        Console.WriteLine(item2);


    }


    An alternative to accessing tuple elements by item number is to use field names.


    ## 21.4 Tuple field names


    When creating a tuple, you can assign a name to each value. The names assigned
    to the values stored in a tuple can then be used when you reference those values
    in code, for example:


    (int Count, string Product, double Price) myTuple = (10, "Refrigerator", 432.43);


    When using type inference to initialize a tuple, the field names are placed before
    each value:


    var myTuple = (Count: 10, Product: "Refrigerator", Price: 432.43);


    Once field names have been assigned, the corresponding values are accessed using
    dot notation, as demonstrated in the code changes below:


    private static void GetProductData()


    {


        var myTuple = (Count: 10, Product: "Refrigerator", Price: 432.43);


        Console.WriteLine($"myTuple Price = { myTuple.Price}");


        Console.WriteLine($"myTuple Product = { myTuple.Product}");


        Console.WriteLine($"myTuple Quantity = { myTuple.Count}");


    }


    The following output will appear in the console when the app runs:


    myTuple Price = 432.43


    myTuple Product = Refrigerator


    myTuple Quantity = 10


    ## 21.5 Returning tuples from methods


    Tuples are particularly useful for returning multiple results from a method. For
    example, suppose that instead of displaying product information, we need our GetProductData()
    method to return the data. To achieve this, the type of each tuple value needs
    to be included in the method return type declaration as follows:


    private static (int, string, double) GetProductData()


    {


    .


    .


    }


    When returning the tuple from within the method, we can return an existing tuple
    as follows:


    private static (int, string, double) GetProductData()


    {


        var myTuple = (Count: 10, Product: "Refrigerator", Price: 432.43);


    return myTuple;


    }


    Alternatively, the individual values can be returned by placing them in parentheses
    after the return statement:


    private static (int, string, double) GetProductData()


    {


        return (10, "Refrigerator", 432.43);


    }


    When called, the returned tuple can be assigned to a variable, and the individual
    values accessed using dot notation:


    static void Main(string[] args)


    {


    var myTuple = GetProductData();


        Console.WriteLine($"myTuple Price = {myTuple.Item1}");


        Console.WriteLine($"myTuple Product = {myTuple.Item2}");


        Console.WriteLine($"myTuple Quantity = {myTuple.Item3}");


    }


    If you prefer to use field names instead of the Item <n>default names, one option
    is to include the field names and types as follows:</n>


    static void Main(string[] args)


    {


    (int Count, string Product, double Price) myTuple = GetProductData();


        Console.WriteLine($"myTuple Price = {myTuple.Price}");


        Console.WriteLine($"myTuple Product = {myTuple.Product}");


        Console.WriteLine($"myTuple Quantity = {myTuple.Count}");


    }


    By far, the most convenient way to assign each tuple value to a named variable
    is to use type inference. The following code, for example, assigns the three values
    in the tuple returned by GetProductData() to variables named count, product, and
    price:


    var (count, product, price) = GetProductData();


    Using this approach, we can now access the variables directly without needing
    first to extract them from the tuple:


    static void Main(string[] args)


    {


    var (count, product, price) = GetProductData();


        Console.WriteLine($"Price = {price}");


        Console.WriteLine($"Product = {product}");


        Console.WriteLine($"Quantity = {count}");


    }


