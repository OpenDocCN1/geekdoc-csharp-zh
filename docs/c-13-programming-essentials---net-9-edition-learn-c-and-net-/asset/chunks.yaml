  trans: "\n本章探索了使用 `System.IO` 命名空间中的类在 C# 中进行文件和目录处理。我们涵盖了创建、删除、导航以及处理文件和目录的操作，包括检查存在性、更改当前工作目录以及处理异常。`File`\
    \ 类提供了用于处理文件的静态方法，而 `FileInfo` 类提供了相同目的的非静态方法。我们还通过使用 `StreamReader`、`StreamWriter`、`BinaryReader`\
    \ 和 `BinaryWriter` 类查看了更复杂的文件处理。\n\n# 30. C# 字符串\n\n字符串是字符的集合，这些字符组合在一起形成单词或句子。如果不是为了人类，计算机可能永远与字符串毫无关系。然而，事实是，计算机的主要工作之一就是接受人类提供的数据并向人类展示数据。因此，任何\
    \ C# 程序都可能包含大量专门设计用于处理字符串形式的数据的代码。\n\n## 30.1 创建 StringsDemo 项目\n\n启动 VS Code，打开你的“C#\
    \ Essentials”工作区文件夹，创建一个名为 `StringsDemo` 的新 .NET 控制台应用程序项目。\n\n创建项目后，打开 `Program.cs`\
    \ 文件，并使用它尝试本章其余部分的示例。\n\n## 30.2 在 C# 中创建字符串\n\n字符串是由包含在字符串对象中的字符序列组成的。可以使用多种不同的机制创建字符串对象。\n\
    \n可以如下所示声明字符串但不对其进行初始化：\n\n```csharp\nstring myString;\n```\n\n或者，你可以使用赋值运算符在\
    \ C# 中为字符串分配字面量值：\n\n```csharp\nstring myString = \"Hello World\";\n```\n\n当然，也可以使用隐式类型来声明字符串：\n\
    \n```csharp\nvar myString = \"Hello World\";\n```\n\n同样，可以使用 `new` 关键字并将字面量值传递给构造函数来创建一个新字符串：\n\
    \n```csharp\nstring myString = new(\"Hello World\");\n```\n\n字符串字面量放置在双引号内（如上所示）。如果字符串本身包含双引号，则应该在双引号字符前加上转义字符\
    \ `\\` `：\n\n```csharp\nConsole.WriteLine(\"He shouted \\\"Can you hear me?\\\"\
    \");\n```\n\n输出：\n`He shouted \"Can you hear me?\"`\n\n你还可以通过在字符串前加上 `@` 字符来指示\
    \ C# 将字符串中的所有字符视为字面量（verbatim）。使用 `@` 符号时，双引号之间的所有内容都被视为原始字符串，无论文本中是否存在换行符、回车、反斜杠等。例如：\n\
    \n```csharp\nConsole.WriteLine(@\"You can put a backslash \\ here\n\nand a new\
    \ line\n\nand tabs work too.\n\nYou can also put in sequences that would normally\
    \ be seen as escape sequences 转义序列.\");\n```\n\n输出：\n`You can put a backslash\
    \ \\ here\nand a new line\nand tabs work too.\nYou can also put in sequences that\
    \ would normally be seen as escape sequences 转义 序列.`\n\n如果你熟悉其他编程语言的 heredoc 函数，你会很快发现这本质上是\
    \ C# 的等效实现。\n\n## 30.3 获取 C# 字符串的长度\n\n如果你需要识别 C# 字符串的长度，可以通过访问字符串对象的 `Length`\
    \ 属性来实现：\n\n```csharp\nstring myString = \"Hello World\";\nConsole.WriteLine($\"\
    myString length = {myString.Length}\");\n```\n\n输出：\n`myString length = 11`\n\n\
    ## 30.4 将字符串视为数组\n\n通过使用下标语法 `[]` 指定索引值，可以访问字符串中的单个字符（记住第一个字符位于索引位置 0），并将字符串视为数组（数组在“在\
    \ C# 中创建 2D、3D 和交错数组”中介绍过）：\n\n```csharp\nstring myString = \"Hello World\";\n\
    Console.WriteLine(myString[0]);\nConsole.WriteLine(myString[2]);\nConsole.WriteLine(myString[4]);\n\
    ```\n\n输出：\n`H`\n`l`\n`o`\n\n注意的是，字符串是不可变的（换句话说，虽然可以将全新的字符串字面量分配给变量，但你不能更改字符串中的单个字符）。为了体验体验这种限制，请尝试运行以下代码：\n\
    \n```csharp\nstring myString = \"Hello World\";\nmyString[5] = '-';\n```\n\n当尝试运行上述代码时，你将收到编译器的错误，内容如下：\n\
    `Property or indexer 'string.this[int]' cannot be assigned to -- it is read only`\n\
    \n还可以通过调用字符串对象的 `ToCharArray()` 方法将字符串转换为字符数组：\n\n```csharp\nstring myString =\
    \ \"Hello World\";\nchar[] charArray = myString.ToCharArray();\nforeach (char\
    \ c in charArray) {\n    Console.WriteLine(c);\n}\n```\n\n输出：\n`H`\n`e`\n`l`\n\
    `l`\n`o`\n`W`\n`o`\n`r`\n`l`\n`d`\n\n## 30.5 字符串字符迭代\n\n既然我们可以将数组中的每个字符视为数组元素，那么了解到我们可以使用\
    \ `foreach` 循环如下遍历字符串的字符应该并不意外：\n\n```csharp\nstring myString = \"Hello World\"\
    ;\nforeach (char c in myString) {\n    Console.WriteLine(c);\n}\n```\n\n输出：\n\
    `G`\n`o`\n`o`\n`d`\n`b`\n`y`\n`e`\n`W`\n`o`\n`r`\n`l`\n`d`\n\n## 30.6 字符串拼接\n\n\
    可以通过简单使用加运算符 `+` 将字符串相加来进行拼接（即连接在一起）。\n\n因此，我们可以如下组合两个字符串：\n\n```csharp\nstring\
    \ myString = \"Hello World.\";\nConsole.WriteLine(myString + \" How are you?\"\
    );\n```\n\n输出：\n`Hello World. How are you?`\n\n或者，你可以使用 `string` 类的 `Concat()`\
    \ 实例方法拼接字符串。该方法取两个要连接的字符串作为参数，并返回一个包含这两个字符串并集的新字符串：\n\n```csharp\nstring myString1\
    \ = \"If at first you don’t succeed, \";\nstring myString2 = \"try, try again.\"\
    ;\nstring myString3 = string.Concat(myString1, myString2);\nConsole.WriteLine(myString3);\n\
    ```\n\n输出：\n`If at first you don’t succeed, try, try again.`\n\n## 30.7 比较字符串\n\
    \n如果你需要比较字符串，C# 提供了几种选项。最常用的选项是使用相等运算符，如下所示：\n\n```csharp\nstring myString1 =\
    \ \"Hello World\";\nstring myString2 = \"Hello World\";\nif (myString1 == myString2)\n\
    {\n    Console.WriteLine(\"The strings match.\");\n}\nelse\n{\n    Console.WriteLine(\"\
    They strings not match.\");\n}\n```\n\n输出：\n`The strings match.`\n\n你也可以使用 `string.Equals()`\
    \ 实例方法以类似的方式比较字符串。该方法取两个字符串作为参数，并返回指示字符串是否匹配的 `Boolean` ：\n\n```csharp\nstring\
    \ myString1 = \"Hello world\";\nstring myString2 = \"Hello world\";\nif (string.Equals(myString1,\
    \ myString2))\n{\n    Console.WriteLine(\"The strings match.\");\n}\nelse\n{\n\
    \    Console.WriteLine(\"The strings do not match.\");\n}\n```\n\n输出：\n`The strings\
    \ match.`\n\n在上面的示例中，我们在比较时通过 `Equals()` 方法传递了字符串。`Equals()` 方法也可以在字符串字面量或字符串对象调用以获得相同的结果：\n\
    \n```csharp\nstring myString1 = \"Hello world\";\nstring myString2 = \"Hello world\"\
    ;\nif (myString1.Equals(myString2, StringComparison.Ordinal))\n{\n    Console.WriteLine(\"\
    The strings match.\");\n}\nelse\n{\n    Console.WriteLine(\"The strings do not\
    \ match.\");\n}\n```\n\n输出：\n`The strings match.`\n\n为止，我们探索的所有比较都是执行大小敏感比较。在调用\
    \ `Equals()` 方法时，你还可以传递一个比较类型参数。该类型必须取自 C# `StringComparison` 枚举，该枚举在执行文化敏感比较设置的值中，包含了用于忽略大小比较的\
    \ `OrdinalIgnoreCase` 值：\n\n```csharp\nstring myString1 = \"HELLO WORLD\";\nstring\
    \ myString2 = \"Hello world\";\nif (string.Equals(myString1, myString2, StringComparison.OrdinalIgnoreCase))\n\
    {\n    Console.WriteLine(\"The strings match.\");\n}\nelse\n{\n    Console.WriteLine(\"\
    The strings do not match.\");\n}\n```\n\n输出：\n`The strings match.`\n"
