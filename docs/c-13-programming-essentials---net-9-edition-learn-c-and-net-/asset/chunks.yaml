    foreach (string color in colorList)


    {


        Console.Write($"{color} ");


    }


    Output:


    Red Green White Yellow Purple Orange


    ## 27.9 Sorting lists in C#


    There is no way to tell C# to automatically sort a list as items are added. The
    items in a list can be sorted into order by calling the Sort() method:


    List <string>colorList = ["Red", "Green", "Yellow", "Purple", "Orange"];</string>


    colorList.Sort();


    foreach (string color in colorList)


    {


        Console.Write($"{color} ");


    }


    Output:


    Green Orange Purple Red Yellow


    The above example uses the C# default comparison delegate to organize the new
    list order. Although beyond the scope of this book, it is worth knowing that for
    more advanced requirements, you can create your own comparison delegate.


    ## 27.10 Finding items in a C# list


    Several methods are provided with the List class for finding items. The most basic
    method is the Contains() method which, when called on a list object, returns true
    if the specified item is located in the list, or false if it is not.


    The IndexOf() method returns the index value of a matching item in a list. For
    example, the following code sample will output a true result indicating the presence
    of “Red” and the value 2, which is the index position of the “Yellow” string:


    List <string>colorList = ["Red", "Green", "Yellow", "Purple", "Orange"];</string>


    Console.WriteLine(colorList.Contains("Red"));


    Console.WriteLine(colorList.IndexOf("Yellow"));


    Output:


    True


    2


    If the item is not found in the list, a value of -1 is returned by the IndexOf()
    method.


    The LastIndexOf() method returns the index value of the last item in the list
    to match the specified item. This is particularly useful when a list contains
    duplicate items:


    List <string>colorList = ["Red", "Green", "Yellow", "Purple", "Red"];</string>


    Console.WriteLine(colorList.LastIndexOf("Red"));


    Output:


    4


    ## 27.11 Obtaining information about a list


    Two properties of the List <t>class are helpful in obtaining information about
    a list object. For example, the Capacity property can identify how many items
    a collection can store without resizing.</t>


    The Count property, however, identifies how many items are currently stored in
    the list. In general, the Capacity value will match or exceed the current Count:


    List <string>colorList = ["Red", "Green", "Yellow", "Purple", "Orange"];</string>


    Console.WriteLine($"Count = {colorList.Count}");


    Console.WriteLine($"Capacity = {colorList.Capacity}");


    Output:


    Count = 5


    Capacity = 5


    In instances where a gap exists between Count and Capacity you can remove excess
    capacity with a call the TrimExcess() method:


    colorList.TrimExcess();


    ## 27.12 Clearing C# lists


    You can remove all of the items in a list by making a call to the Clear() method.


    The Clear() method removes the items from the list and sets the Count property
    to zero. The Capacity property, however, remains unchanged after the list has
    been cleared. To remove the capacity of a list, follow the Clear() method call
    with a call to TrimExcess():


    List <string>colorList = ["Red", "Green", "Yellow", "Purple", "Orange"];</string>


    Console.WriteLine($"Count = {colorList.Count}");


    Console.WriteLine($"Capacity = {colorList.Capacity}");


    colorList.Clear();


    Console.WriteLine($"Count = {colorList.Count}");


    Console.WriteLine($"Capacity = {colorList.Capacity}");


    colorList.TrimExcess();


    Console.WriteLine($"Count = {colorList.Count}");


    Console.WriteLine($"Capacity = {colorList.Capacity}");


    Output:


    Count = 5


    Capacity = 5


    Count = 0


    Capacity = 5


    Count = 0


    Capacity = 0


