        Console.WriteLine(result);


    }


    When the above code executes, the following output will appear in the console:


    Inline conversion to lowercase > this is some text


    As with standard delegates, you can also pass anonymous methods as arguments to
    other methods using the syntax outlined in the previous chapter, for example:


    namespace LambdaDemo


    {


