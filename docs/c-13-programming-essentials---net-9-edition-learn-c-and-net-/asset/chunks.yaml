    The `VES` (referred to as the runtime) is the environment in which the `CIL` byte
    code is executed. The `VES` reads the byte code generated by the C# compiler and
    uses a Just in Time (`JIT`) compiler to compile the byte code down to the native
    machine code of the processor on which it is running. While executing, this code
    does so in conjunction with a runtime agent, which manages the execution process.
    As a result, this executing code is known as `managed code`, and the process handles
    issues such as garbage collection (to handle memory allocation and de-allocation),
    memory access, and type safety to ensure that the code does not do anything it
    is not supposed to do.


    A term often used in connection with the `VES` is the Common Language Runtime
    (`CLR`). The `CLR` is officially the name given to Microsoft’s implementation
    of the `VES` component of the `CLI` specification.


    It is worth noting that the `JIT` process can introduce a startup delay in the
    execution of an application. One option available with `.NET` to avoid this problem
    is pre-compiling `CLI` byte code to native machine code using the `NGen` compiler.
    However, because the `NGen` compilation must occur on the target processor architecture,
    this step is often performed when the user installs the application.


    ## 3.4 Common Type System (CTS) & Common Language Specification (CLS)


    As mentioned previously, several different programming languages target the `CLI`,
    allowing, for example, code from C# sources to interact with code from Visual
    Basic. However, to achieve this feat, each language must have the same concept
    of how data types are stored in memory. The `CTS`, therefore, defines how a `CLI`-compatible
    language must view the bit patterns of values and the layout and behavior of objects
    to ensure interoperability.


    The `CLS` is a subset of the `CTS` aimed at creating interoperable libraries.


    ## 3.5 The Framework (Base Class and Framework Class Libraries)


    The `CLI` specifies a set of base classes that must be available to execute `CLI`
    code, otherwise known as the Base Class Library (`BCL`). The `BCL` contains Application
    Programming Interfaces (`APIs`) that enable executing `CIL` code to interact with
    the runtime environment and the underlying operating system.


    Beyond the basics, there is also the `.NET Framework Class Library` (`FCL`). This
    Microsoft library contains `APIs` for creating graphical user interfaces, database
    applications, web access, and more.


    ## 3.6 Implementations of the CLI


    Microsoft’s implementation of the `CLI` stack is called `.NET`. Initially only
    available on Windows systems, Microsoft repackaged `.NET` in 2014 as an open-source,
    cross-platform development platform available on Windows, Linux, and macOS.


    Another implementation Microsoft provides is Shared Source Common Language Infrastructure
    (`SSCLI`). `SSCLI`, however, is primarily a learning tool and, as such, is licensed
    under terms that prohibit use as the basis of commercial applications.


    Finally, if you would like to develop apps for iOS and Android using C#, there
    is also the `.NET MAUI` implementation.


    ## 3.7 Take the knowledge test


    Click the link below or scan the QR code to test your knowledge and understanding
    of C# Infrastructure:


    `[https://www.answertopia.com/kbxm](https://www.answertopia.com/kbxm)`


    ![](images/image-S7CB1ZFT.jpg)


    ## 3.8 Summary


    The Common Language Infrastructure (`CLI`) provides a standardized environment
    for executing C# code. It includes the Common Intermediate Language (`CIL`), Virtual
    Execution System (`VES`), Common Type System (`CTS`), and Common Language Specification
    (`CLS`). The `CLI` enables interoperability between different programming languages
    and provides a base class library for executing `CIL` code.


    In addition, the .NET Framework Class Library offers a vast collection of pre-built
    functions and classes for creating diverse applications and includes `APIs` for
    file I/O, networking, database access, and user interface design.


    ## 4. Installing Visual Studio Code, C# and .NET 9


    To begin programming in C#, we will need an environment to write, edit, compile,
    and run our code. There are many options, but for this book, we need a solution
    that is free to use and available to all readers, regardless of whether they are
    learning C# on macOS, Windows, or Linux systems. A popular tool, and the one we
    will be installing in this chapter, is Visual Studio Code. Developed by Microsoft,
    Visual Studio Code is a feature-rich, intuitive code editing environment, which,
    when combined with the `C# Dev Kit` extension, provides everything we need to
    learn C#.


    ## 4.1 Installing the .NET 9 SDK


    In addition to installing Visual Studio Code, we will also need to install the
    `.NET 9 SDK` prior to compiling C# programs. While there are several ways to install
    `.NET`, we will use a technique that involves downloading and install the SDK
    independently from Visual Studio Code.


    The `.NET 9 SDK` installation steps are specific to the operating system you are
    using as outlined below.


    ### 4.1.1 Installing .NET 9 on Windows


    The `.NET 9 SDK` is available for Windows systems running on x86, x64, and Arm64
    processor architectures. Using the following link, download the latest `.NET 9
    Installer` package that matches your system:


    `[https://dotnet.microsoft.com/en-us/download/dotnet/9.0](https://dotnet.microsoft.com/en-us/download/dotnet/9.0)`


    Once you have downloaded the installer, launch it and follow the setup wizard
    to complete the installation:


    ![](images/image-KVK3CAQW.png)


    Figure 4-1


    ### 4.1.2 Installing .NET 9 on macOS


    The macOS edition of the `.NET 9 SDK` is available or Intel and Apple Silicon
    systems. To begin the installation, open a browser window, navigate to the following
    URL, and download the Installer that matches your system:


    `[https://dotnet.microsoft.com/en-us/download/dotnet/9.0](https://dotnet.microsoft.com/en-us/download/dotnet/9.0)`


    After downloading the installer, launch it and follow the steps to complete the
    installation:


    ![](images/image-20BSBE80.png)


    Figure 4-2


    ### 4.1.3 Installing .NET 9 on Red Hat Linux


    The best way to install .NET 9 on distributions derived from Red Hat will depend
    on when you are reading this. At the time of writing, .Net 9 was still at the
    release candidate stage. It is possible that by the time you read this, .NET 9
    will have been officially released. To find out, open a Terminal window and run
    the following command:


    `sudo dnf install dotnet-sdk-9.0`


    If the installation request reports that there is no match for `dotnet-sdk-9.0`,
    skip to the “Installing .Net 9 from the Linux binaries” section to perform the
    installation. Otherwise, press ‘y’ to complete the installation.


    ### 4.1.4 Installing the .NET 9 on Debian/Ubuntu


    The installation steps for Debian and Ubuntu systems will, once again, depend
    on the release status of the .NET 9 SDK. Begin by running the following common
    in a Terminal window:


    `sudo apt-get install dotnet-sdk-9.0`


    If the installation request reports that the `dotnet-sdk-9.0` package could not
    be found, skip to the next section to perform the installation. Otherwise, press
    ‘y’ to complete the installation.


    ### 4.1.5 Installing .Net 9 from the Linux binaries


    If .NET 9 has not yet been officially released, the installation will need to
    be performed using the release candidate SDK binaries. Return to the .NET 9 download
    page and locate and download the binary that matches your CPU as highlighted in
    Figure 4-3:


    ![](images/image-GFWW4IA1.png)


    Figure 4-3


    Within a Terminal window, create a directory into which you would like to install
    .NET 9\. Next, run the following commands (which assume you chose `$HOME/dotnet9`
    as your installation directory):


    ```bash

    cd $HOME/dotnet9

    tar xvfz<path to="" downloaded="" binary="" archive=""></path>

    ```


    After unpacking the .NET package, modify your `$HOME/.bashrc` file to export the
    `DOTNET_ROOT` environment variable and to add the .NET 9 SDK to your path.

