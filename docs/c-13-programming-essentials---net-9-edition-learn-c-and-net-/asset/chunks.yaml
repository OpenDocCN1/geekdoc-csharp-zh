    ## 13.13 C# constructors


    Despite the grand-sounding names, C# class constructors and finalizers are nothing
    more than methods that get called when an object is instantiated and destroyed.
    The constructor is particularly useful for allowing initialization values to be
    passed through to an object at creation time. Let’s say that we would like to
    be able to initialize the _accountName and _accountNumber members at the point
    that we initialize the custAccount object. To do so, we need to declare a constructor.


    Constructors are declared the same way as other methods with the exception that
    the name of the method must match the class name. For example, add a constructor
    to our BankAccount class as follows:


    public class BankAccount


    {


        private string _accountName;


        private int _accountNumber;


        // Constructor


        public BankAccount(string accountName, int accountNumber)


        {


            _accountName = accountName;


            _accountNumber = accountNumber;


        }


    .


