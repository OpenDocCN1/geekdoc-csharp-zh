  trans: "\n\nTerminal（终端）面板是一个完全交互的环境。你可以像在 Windows 的命令提示符或 macOS 或 Linux 的终端窗口中一样运行命令。\n\
    \n编辑 `Program.cs` 文件并以下行：\n\n```csharp\nConsole.Write(\"Please enter your name:\
    \ \");\nvar username = Console.ReadLine();\nConsole.WriteLine($\"Hi {username}.\
    \ Welcome to C#!\");\n```\n\n对 `ReadLine()` 方法的调用会等待键盘输入，并将输入的文本赋值给名为 `username`\
    \ 的变量：\n\n```\nHello, World!\nPlease enter your name: John Smith\nHi John Smith,\
    \ Welcome to C#!\n```\n\n## 6.4 顶层语句和 Main 方法\n\n对于熟悉其他编程语言的人来说，上面的示例可能会让他们感到困惑，因为我们可以在没有任何周围代码结构或对编译器的“指令”的情况下直接编写行并执行代码。像\
    \ `C#` 等语言通常需要额外的信息，例如类名和导入框架依赖项的指令。例如，我们的 `Program.cs` 文件调用了属于 `Console` 类的方法，而该类又属于\
    \ `System` 命名空间，但我们不需要将该命名空间导入代码即可运行它。\n\n另一个常见的要求是指定哪些代码是执行的起点。许多编程语言语言都有一个特殊的\
    \ `main` 函数或方法，其中包含初始的代码行。那么如果其他编程语言有这些要求，为什么 `C#` 却没有呢？\n\n答案是 `C#` 确实有这些要求，但\
    \ VS Code 会在后台自动为我们生成这些所谓的“顶层语句”。这就是 `Program.cs` 文件中新控制台模板注释所指的内容。尽管我们的应用程序中只有四行代码，但实际被编译的代码将类似于以下内容：\n\
    \n```csharp\nusing System;\n\nnamespace SampleApp\n{\n    internal class Program\n\
    \    {\n        static void Main(string[] args)\n        {\n            Console.Write(\"\
    Please enter your name: \");\n            var username = Console.ReadLine();\n\
    \            Console.WriteLine($\"Hi {username}. Welcome to C#!\");\n        }\n\
    \    }\n}\n```\n\n上述代码中的 `using` 指令告诉编译器导入 `System` 命名空间，因为文件中的代码依赖于它。接下来，内部类被封装在一个名为\
    \ `SampleApp` 的命名空间声明中。`C#` 代码包含类、变量和方法，所有这些都被分配了名称。命名空间允许组织应用程序代码，使得一个工作空间中的名称不会与其他工作空间中的相同名称冲突。在命名空间之外声明任何内容都是全局命名空间的一部分。\n\
    \n在 `SampleApp` 命名空间内，声明了一个 `Program` 类来包含 `Main()` 方法，该方法又包含了应用程序代码。\n\n你只需通过在\
    \ `Program.cs` 文件中声明上述代码，即可覆盖默认的新控制台模板行为。选择使用哪种方法取决于个人喜好，尽管可能会出现需要手动声明顶层语句的情况。因此，理解背后正在发生什么是非常重要的。\n\
    \n## 6.5 接受知识测试\n\n点击下方的链接或扫描二维码以测试你对在 Visual Studio Code 中 `C#` 的知识和理解：\n\n[`www.answertopia.com/zkxb`](https://www.answertopia.com/zkxb)\n\
    \n![](img/image-4UYO622H.jpg)\n\n## 6.6 总结\n\n在本章中，我们创建了一个包含 .NET 控制台应用项目的新工作区，并在编写、编译和运行\
    \ `C#` 代码之前，探索了构成典型项目的文件。本章还引入了命名空间的概念，并解释了顶层语句和 `Main()` 方法是如何由 VS Code 自动生成的。\n\
    \n## 7. C# 变量和常量\n\n要精通任何编程语言，你都需要学习基础知识。编程最基础的方面之一是使用变量常量。即使是像高级视频游戏和企业商业应用等高级程序也会以某种形式使用变量。\n\
    \n本章将涵盖 `C#` 程序员关于变量和常量所需的一切。\n\n## 7.1 什么是 C# 变量？\n\n变量是计算机内存中的位置，用于存储应用程序使用的数据。每个变量都由程序员赋予一个名称并分配一个值。分配给变量的名称随后可以在\
    \ `C#` 代码中使用以访问分配给变量的值。这种访问可以涉及读取变量的值或更改该值。当然，正是改变变量值的能力让它们被称为“变量”。\n\n## 7.2\
    \ 类型注解和隐式类型\n\n`C#` 被归类类型安全的编程语言。这本质上意味着一旦确定了变量的数据类型，该变量就不能再用于存储任何其他类型的数据，否则会引发编译错误。这与松散类型语言形成对比，在松散类型语言中，变量一旦声明，随后就可以被用于存储其他数据类型。\n\
    \n识别变量类型有两种方法。一种方法是在代码中声明变量或常量时使用类型注解。这是通过在变量名之前加上类型声明来实现的。例如，下面行代码声明了一个名为 `userCount`\
    \ 的变量，其类型为 `int`（整数）：\n\n```csharp\nint userCount = 10;\n```\n\n使用类型注解时，可以在变量声明后向其分配一个值：\n\
    \n```csharp\nint userCount;\nuserCount = 10;\n```\n\n作为类型注解的替代方案，`C#` 编译器可以使用隐式类型来识别变量。当依赖隐式类型时，编译器会查看在初始化时赋值给变量的值类型。要指示编译器使用隐式类型，必须在变量名之前加上\
    \ `var` 关键字。考虑以下变量声明：\n\n```csharp\nvar signalStrength = 22;\nvar companyName\
    \ = \"My Company\";\n```\n\n在编译上述代码时，`C#` 将推断 `signalStrength` 变量是 `int` 类型，`companyName`\
    \ 是 `string` 类型。\n\n使用隐式类型声明变量时，必须在声明点赋值值。例如，下面不是合法的 `C#` 语法：\n\n```csharp\nvar\
    \ bookTitle;\nbookTitle = \"C# 13 Essentials - .NET 9 Edition\";\n```\n\n## 7.3\
    \ 什么是 C# 常量？\n\n常量类似于变量，提供了内存中命名的位置来存储数据值。常量的区别在于：一旦给常量分配了值，就不能再更改。\n\n如果一个值在应用程序代码中反复使用，常量将特别有用。与其每次都使用该值，不如先将该值赋值给常量然后在代码中引用，这样代码更易读。例如，阅读你的\
    \ `C#` 代码的人可能不清楚你为什么在表达式中使用值 5。如果不是使用 5，而是使用名为 `interestRate` 的常量，该值的目的就会变得明显得多。常量的优点在于，如果程序员需要更改一个广泛使用的值，只需要在常量声明处更改一次，而不需要每次引用都更改。\n\
    \n常量使用 `const` 关键字声明并具有类型、名称和值：\n\n```csharp\nconst int interestRate = 10;\n```\n\
    \n注意，常量必须在声明时进行初始化。例如，下面的代码将编译失败，因为它声明了一个常量但没有分配值：\n\n```csharp\nconst int interestRate;\
