    ## 9.6 Summary


    The term control flow describes the logic that dictates the execution path through
    an application’s source code as it runs. This chapter has examined conditional
    control flow and explored how the if and else statements are used to implement
    this type of flow logic.


    ## 10\. The C# switch Statement


    In this chapter, we will introduce the C# switch statement and demonstrate why
    it is a better alternative to complicated if ... else if ... statements.


    In the previous chapter, we looked at controlling program execution flow using
    the if and else statements. While these statement constructs work well for testing
    a limited number of conditions, they quickly become unwieldy when dealing with
    more significant numbers of possible conditions. C# has inherited the switch statement
    from the C programming language.


    In this chapter, we will explore the switch statement in detail.


    ## 10.1 Why use the switch statement?


    For a few logical value evaluations, the if … else if … construct is perfectly
    adequate. Unfortunately, any more than two or three possible scenarios can quickly
    make such a construct both time-consuming to write and difficult to read. As a
    case in point, consider the following code example. The program uses if … else
    if … statements to identify the manufacturer of a car based on the model name:


    string carModel = "Corolla";


    string carManufacturer;


    if ((String.Compare(carModel, "Patriot") == 0) ||


        (String.Compare(carModel, "Liberty") == 0) ||


        (String.Compare(carModel, "Wrangler") == 0)) {


        carManufacturer = "Jeep";


    }


    else if (String.Compare(carModel, "Focus") == 0) {


        carManufacturer = "Ford";


    }


    else if (String.Compare(carModel, "Corolla") == 0) {


        carManufacturer = "Toyota";


    } else {


        carManufacturer = "unknown";


    }


    Console.WriteLine($"Manufacturer is {carManufacturer}");


    While the code is not excessive, it is already starting to become somewhat hard
    to read and takes more time to write than necessary. Imagine, however, if instead
    of 3 car models, we had to test for 10 or 20 models. Clearly, a more straightforward
    solution is needed, and that solution is the switch statement.


    ## 10.2 Using the switch statement


    The syntax for a C# switch statement is as follows:


    switch (value){


         case constant:


              statements


              break/jump


         case constant:


              statements


              break/jump


         default:


              statements


              break/jump


     }


    This syntax needs some explanation before we create a switch-based version of
    the above if … else if … construct.


    In the above syntax outline, value represents either a value or an expression
    that returns a value. This is the value against which the switch operates. Using
    our example, this would be the string representing the car model.


    A case statement is required for each possible match, followed by a constant value
    (once again, using our example, this would be the car models). Each case constant
    must be of the same type as the governing value. Following the case line are the
    C# statements to be executed if the value matches the case constant.


    After the statements comes an optional break, goto, or continue statement. These
    statements break out of the switch statement when a match is found, jump to a
    specific location in the code, or skip any remaining code in a loop and begin
    the next iteration.


    Finally, the default: section of the construct defines what should happen if none
    of the case statements present a match to the value.


