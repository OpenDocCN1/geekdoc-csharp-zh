    \        }\n        static string UpperCase(string value)\n        {\n       \
    \     Console.Write(\"Converting to uppercase > \");\n            return value.ToUpper();\n\
    \        }\n        static void Main(string[] args)\n        {\n        }\n  \
    \  }\n}\n```\n\n上述更改声明了一个名为 `StringConverter` 的委托，它可以用于引用任何接受并返回字符串值的方法。接下来，我们声明了两个与此签名匹配的方法，`LowerCase()`\
    \ 和 `UpperCase()`。下一步是向 `Main()` 方法中添加代码来使用这些委托：\n\n```csharp\nstatic void Main(string[]\
    \ args)\n{\n    StringConverter converter1 = new(LowerCase);\n\n    StringConverter\
    \ converter2 = new(UpperCase);\n    var lower = converter1(\"This is some TEXT\"\
    );\n    Console.WriteLine(lower);\n    var upper = converter2(\"tHis IS sOmE TExt\"\
    );\n    Console.WriteLine(upper);\n}\n```\n\n`Main()` 方法创建了两个委托实例，每个实例引用两个方法之一。然后通过委托调用这些方法，并将生成的字符串显示在控制台中：\n\
    \nConverting to lowercase > this is some text\n\nConverting to uppercase > THIS\
    \ IS SOME TEXT\n\n由于委托是一个变量，因此可以在任何时候分配不同的方法。\n\n在上面的示例中，`converter1` 和 `converter2`\
    \ 是单播委托，因为它们每个只引用一个方法。也可以创建多播委托。\n\n## 15.6 多播委托\n\n多播委托包含多个委托，允许它引用多个方法。多播委托是通过使用\
    \ `+` 运算符组合现有的委托创建的。\n\n通过对我们的 `Main()` 方法进行以下更改，创建了一个名为 `multicast` 的委托，它包含了\
    \ `converter1` 和 `converter2`：\n\n```csharp\nstatic void Main(string[] args)\n\
    {\n    StringConverter converter1 = new(LowerCase);\n\n    StringConverter converter2\
    \ = new(UpperCase);\n    StringConverter multicast = converter1 + converter2;\n\
    \    var result = multicast(\"This is some TEXT\");\n    Console.WriteLine(result);\n\
    }\n```\n\n执行代码时，我们将从控制台输出看到通过单次多播委托调用了 `LowerCase()` 和 `UpperCase()` 方法：\n\nConverting\
    \ to lowercase > Converting to uppercase > THIS IS SOME TEXT\n\n可以使用 `-` 运算符从多播委托中移除委托。以下更改调整了上述示例，在第一次调用后从\
    \ `multicast` 中移除 `converter2`：\n\n```csharp\nstatic void Main(string[] args)\n\
    {\n    StringConverter converter1 = new(LowerCase);\n\n    StringConverter converter2\
    \ = new(UpperCase);\n    StringConverter multicast = converter1 + converter2;\n\
    \    var result = multicast(\"This is some TEXT\");\n    Console.WriteLine(result);\n\
    \n    multicast -= converter2;\n    var result = multicast(\"This is some TEXT\"\
    );\n    Console.WriteLine(result);\n}\n```\n\n执行代码时：\n\nConverting to lowercase\
    \ > \nlowercase > \n\n## 15.7 传递委托\n\n要将委托传递给方法，该方法必须接受该委托类型作为参数。假设我们需要方法接收 `StringConverter`\
    \ 实例和一个字符串：\n\n```csharp\nstatic void DisplayText(StringConverter converter, string\
    \ text)\n{\n    string result = converter(text);\n    Console.WriteLine($\"Converted\
    \ text = {result}\");\n}\n```\n\n在 `Main()` 方法中实现以下更改：\n\n```csharp\nnamespace\
    \ DelegateDemo\n{\n    internal class Program\n    {\n        delegate string\
    \ StringConverter(string value);\n\n        static string LowerCase(string value)\n\
    \        {\n            Console.Write(\"Converting to lowercase > \");\n     \
    \       return value.ToLower();\n        }\n        static string UpperCase(string\
    \ value)\n        {\n            Console.Write(\"Converting to uppercase > \"\
    );\n            return value.ToUpper();\n        }\n\n        static void Main(string[]\
    \ args)\n        {\n            StringConverter converter1 = new(LowerCase);\n\
    \            StringConverter converter2 = new(UpperCase);\n\n            DisplayText(converter1,\
    \ \"This is some text\");\n            DisplayText(converter2, \"This is some\
    \ text\");\n        }\n\n        static void DisplayText(StringConverter converter,\
    \ string text)\n        {\n            string result = converter(text);\n    \
    \        Console.WriteLine($\"Converted text = {result}\");\n        }\n    }\n\
    }\n```\n\n执行代码时，控制台将显示：\n\nConverting to lowercase > Converted text = this is\
    \ some text\nConverting to uppercase > Converted text = THIS IS SOME TEXT\n\n\
    ## 15.8 测试\n\n点击下方链接或扫描二维码测试你对 C# 委托的知识：\n\n[`www.answertopia.com/zcff`](https://www.answertopia.com/zcff)\n\
    \n## 15.9 总结\n\nC# 委托允许我们将方法存储在变量中，方法的签名决定了变量类型。方法的签名由它接受的参数和返回类型定义。一旦声明委托，它将具有许多其他类型的功能。特别是，委托允许作为参数传递，甚至作为方法的返回。委托可以包含单个方法（单播），也可以组合创建多播委托。\n\
    \n## 16. 匿名方法、Lambda 和局部函数\n\n在本章中，你将学习如何在 C# 中使用匿名方法、Lambda 和局部函数来编写灵活、简洁且重用的代码。\n\
    \n## 16.1 匿名方法\n\n匿名方法使用 `delegate` 关键字声明。然而，匿名方法并不引用现有的命名方法。相反，要执行的代码被直接分配给委托（这种概念称为内联）。在声明匿名方法时，将使用以下语法：\n\
    \n```csharp\ndelegate <returntype><delegatename>(<parameters>);</parameters></delegatename></returntype>\n\
    ```\n\n区别出现在分配要执行的代码时。为匿名方法分配代码块的语法如下：\n\n```csharp\n<delegate_type><delegate_name>=\
    \ delegate(<parameters>) {</parameters></delegate_name></delegate_type>\n// 要执行的代码\n\
    };\n```\n\n使用这种语法并以我们的 `LowerCase()` 方法代码为例，我们将编写如下代码：\n\n```csharp\ndelegate\
    \ string StringConverter(string value);\n\nStringConverter converter = delegate(string\
    \ value)\n{\n    Console.Write(\"Converting to lowercase > \");\n    return value.ToLower();\n\
    };\n```\n"
