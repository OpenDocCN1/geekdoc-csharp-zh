    ## 17.


    ### C#


    ## Inheritance


    In “An Introduction to C# Object-Oriented Programming” we covered the basic concepts
    of object-oriented programming and worked through an example of creating and working
    with a new class using C#. In that example, our new class was not explicitly derived
    from a base class (though all C# classes are ultimately derived from the System.Object).
    This chapter will delve into the concepts of inheritance and subclassing in C#.


    ## 17.1 What is inheritance?


    The concept of inheritance brings a real-world perspective to programming. It
    allows a class to be defined with a number of characteristics and then other classes
    to be derived from that class. The derived class inherits all of the features
    of the parent class and typically adds some of its own.


    By deriving classes, we create what is often referred to as a class hierarchy.
    The class at the top of the hierarchy is known as the base class, and the derived
    classes are called subclasses. Any number of classes may be derived from a class.
    However, a derived class can only inherit from one class. As such, C# is known
    as a single inheritance programming language. Classes need not only be derived
    from a base class. For example, a subclass can also be inherited from another
    subclass.


    ## 17.2


    ### A C#


    ## inheritance example


    As with most programming concepts, the subject of inheritance in C# is best illustrated
    with an example. In the “An Introduction to C# Object-Oriented Programming” chapter,
    we created a project called ObjectDemo containing a BankAccount class. We will
    use this example to demonstrate C# inheritance.


    Launch VS Code, open your “C# Essentials” workspace folder and use the Explorer
    panel to locate the BankAccount.cs file within the ObjectDemo project, as shown
    in Figure 17-1 below:


    ![](images/image-DSM63GCY.png)


    Figure 17-1


    Once the project has loaded into VS Code, edit the BankAccount.cs file and add
    an additional field and property to the class to store the account balance:


    namespace ObjectDemo;


    public class BankAccount


    {


        private string _accountName;


        private int _accountNumber;


    private double _accountBalance;


        public BankAccount(string accountName, int accountNumber,


                                              double accountBalance)


        {


            _accountName = accountName;


            _accountNumber = accountNumber;


    _accountBalance = accountBalance;


        }


    .


    .


        public double AccountBalance


        {


            get => _accountBalance;


            set => _accountBalance = value;


        }


        public void DisplayName()


        {


            Console.WriteLine($"Customer name is {AccountName}");


        }


    .


    .


    }


    This class does an excellent job of defining characteristics common to any type
    of bank account, such as account holder name, account number, and current balance.
    Imagine, however, that our banking program needs to support several specific types
    of bank accounts. For example, the bank might offer its customers an interest-bearing
    savings account. A savings account will have all the characteristics of our BankAccount class
    but would also need a way to store the prevailing interest rate. One option would
    be to create a brand new class from the ground up called SavingsAccount, which
    duplicates everything we have in our BankAccount class, plus extra members needed
    for a savings account. An alternative and more efficient method is to derive a SavingsAccount class
    from the BankAccount class and then add the extra functionality into this subclass.


    ## 17.3 Creating a subclass in C#


    Now that we have ascertained that we need to create a subclass of our BankAccount class,
    we can look at how to achieve this. Subclasses are declared the same way as any
    other class, except that the class name is followed by a colon (:) and the name
    of the class from which it is to inherit.


    With this in mind we can begin by using the Solution Explorer to add a new Class
    file to the project.


    Using the Solution Explorer, hover the mouse pointer over the ObjectDemo project
    entry and click the new file button. In the file template palette, select the
    Class entry and name the new class SavingsAccount before pressing the Enter key
    to create the file. When the new file loads into the editor, modify the class
    declaration to subclass from BankAccount:


    namespace ObjectDemo;


    public class SavingsAccount : BankAccount


    {


    }


    We have now created a subclass of BankAccount called SavingsAccount, but at this
    point, the SavingsAccount class is no different than its parent class. Next, we
    need to add a constructor and some new members to add the behavior we need:


    public class SavingsAccount : BankAccount


    {


        private double _interestRate;


        public SavingsAccount(string accountName, int accountNumber,


                   double accountBalance, double interestRate)


                             : base(accountName, accountNumber, accountBalance)


        {


            _interestRate = interestRate;


        }


        public double InterestRate


        {


            get => _interestRate;


            set => _interestRate = value;


        }


        public double MonthlyInterest()


        {


            return (_interestRate * AccountBalance) / 12;


        }


    }


    We now have a new class called SavingsAccount, which inherits all the members
    of the BankAccount class and adds some members of its own. In particular, we have
    added a new data member called InterestRate, which will store the interest rate
    paid on the account together with a new method to calculate the monthly interest.


