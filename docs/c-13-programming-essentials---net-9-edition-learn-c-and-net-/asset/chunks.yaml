    ## 26.7 Sorting C# arrays


    The C# array is part of the Array package, which also includes some useful methods
    for sorting and re-ordering arrays.


    If you need to sort an array, pass it as an argument to the Array.Sort() method
    as follows:


    string[] myColors = [ "red", "green", "yellow", "orange", "blue" ];


    Console.WriteLine("Before Sort");


    foreach (string color in myColors)


    {


        Console.Write("{0} ", color);


    }


    Array.Sort(myColors);


    Console.WriteLine("\n\nAfter Sort");


    foreach (string color in myColors)


    {


        Console.Write("{0} ", color);


    }


    Output:


    Before Sort


    red green yellow orange blue


    After Sort


    blue green orange red yellow


    You can also reverse the order of the elements in an array using the Array.Reverse()
    method:


    string[] myColors = ["red", "green", "yellow", "orange", "blue"];


    Array.Reverse(myColors);


    foreach (string color in myColors)


    {


        Console.Write("{0} ", color);


    }


    Output:


    blue orange yellow green red


    ## 26.8 Clearing C# arrays


    The values in an array may be cleared using the Array.Clear() method. This method
    clears each item in an array to the default value for the type (false for Boolean
    values, 0 for numeric items, and null for strings). The syntax for clearing array
    elements is as follows:


    Array.Clear(<array>, <start index="">, <count>);</count></start></array>


    In the above syntax, <array>is the array to be cleared, <start index="">is the
    position within the array at which clearing is to begin, and <count>is the number
    of elements to be cleared.</count></start></array>


    The following example clears three elements starting at item 1:


    string[] myColors = ["red", "green", "yellow", "orange", "blue"];


    Array.Clear(myColors, 1, 3);


    foreach (string color in myColors)


    {


        Console.Write("{0} ", color);


    }


    When the above code runs, only the blue and red elements will remain in the array.


