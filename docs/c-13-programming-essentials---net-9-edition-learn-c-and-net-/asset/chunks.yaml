    ```\n\n这种方法对于中等数量的比较效果良好，但对于大量的表达式评估可能会变得非常繁琐。`C#` `switch` 语句为此类情况提供了更灵活、更高效的解决方案。`switch`\
    \ 语句将在下一节介绍。\n\n## 9.5 知识测试\n\n点击下面的链接或扫描二维码，以测试你对 `C#` 控制流的知识和理解：\n\n[`www.answertopia.com/xzu2`](https://www.answertopia.com/xzu2)\n\
    \n![](img/image-KAH4PRCP.jpg)\n\n## 9.6 总结\n\n“控制流”一词描述了在应用程序源代码运行时决定执行路径的逻辑。本章检查了条件控制流，并探索了如何使用\
    \ `if` 和 `else` 语句来实现这种流逻辑。\n\n## 10. C# switch 语句\n\n在本章中，我们将引入 `C#` `switch`\
    \ 语句，并演示为什么它是复杂的 `if` ... `else if` ... 语句的更好替代方案。\n\n在上一节中，我们学习了使用 `if` 和 `else`\
    \ 语句控制程序的执行流。虽然这些语句结构在测试有限数量条件时效果良好，但在处理大量条件时，它们会迅速变得难以处理。`switch` 语句继承自 C 语言。\n\
    \n在本章中，我们将详细探究 `switch` 语句。\n\n### 10.1 为什么要使用 switch 语句？\n\n对于少数评估，`if` ... `else\
    \ if` 结构完全足够。遗憾的是，如果有超过三个场景，这种结构就会变得难以阅读。想象一下，如果我们要测试 10 个或 20 个模型，显然需要一个更直接的解决方案，而这个解决方案就是\
    \ `switch` 语句。\n\n```csharp\nstring carModel = \"Corolla\";\nstring carManufacturer;\n\
    \nif ((String.Compare(carModel, \"Patriot\") == 0) ||\n(String.Compare(carModel,\
    \ \"Liberty\") == 0) ||\n(String.Compare(carModel, \"Wrangler\") == 0)) {\n  \
    \  carManufacturer = \"Jeep\";\n} else if (String.Compare(carModel, \"Focus\"\
    ) == 0) {\n    carManufacturer = \"Ford\";\n} else if (String.Compare(carModel,\
    \ \"Corolla\") == 0) {\n    carManufacturer = \"Toyota\";\n} else {\n    carManufacturer\
    \ = \"unknown\";\n}\n\nConsole.WriteLine($\"Manufacturer is {carManufacturer}\"\
    );\n```\n\n### 10.2 使用 switch 语句\n\n`switch` 语句的语法如下：\n\n```csharp\nswitch (value)\
    \ {\n    case constant:\n        statements;\n        break;\n    case constant:\n\
    \        statements;\n        break;\n    default:\n        statements;\n}\n```\n\
    \n在我们创建上述 `if` … `else if` … 结构的 switch 版本之前，这种语法需要一些解释。\n\n在上述语法结构中，`value` 代表一个值或一个返回值的表达式。这是\
    \ switch 操作的值。使用我们的示例，这将是代表汽车模型的字符串。\n\n对于每个可能的匹配，都需要一个 `case` 语句（再次使用我们的示例，这将是汽车模型）。每个\
    \ `case` 常量必须与主值的类型相同。`case` 行之后是匹配常量后要执行的 C# 语句。\n\n语句之后是可选的 `break`、`goto` 或\
    \ `continue` 语句。这些语句在找到匹配时跳出 `switch` 语句、跳转到代码中的特定位置或跳过循环中的剩余代码并开始下次迭代。\n\n最后，结构的\
    \ `default:` 部分定义了当没有 `case` 语句与值匹配时应该发生什么。\n\n### 10.3 switch 语句示例\n\n考虑到以上信息，我们现在可以构建一个\
    \ `switch` 语句，它提供与我们之前有些笨拙的 `if` … `else if` … 结构相同的功能：\n\n```csharp\nstring carModel\
    \ = \"Corolla\";\nstring carManufacturer;\n\nswitch (carModel) {\n    case \"\
    Patriot\":\n    case \"Liberty\":\n    case \"Wrangler\":\n        carManufacturer\
    \ = \"Jeep\";\n}\n```\n\n"
- fmt: "\n```csharp\nbreak;\n\n    case \"Focus\":\n        carManufacturer = \"Ford\"\
    ;\n        break;\n\n    case \"Corolla\":\n        carManufacturer = \"Toyota\"\
    ;\n        break;\n\n    default:\n        carManufacturer = \"unknown\";\n  \
    \      break;\n}\n\nConsole.WriteLine($\"Manufacturer is {carManufacturer}\");\n\
    ```\n\n## 10.4 Explaining the example\n\nIn the above example, the string assigned\
    \ to the `carModel` variable is used as the governing variable in the `switch`\
    \ statement. As with the Jeep manufacturer, `case` statements may be grouped,\
    \ preceding a single set of statements.\n\nThe `default` option sets the `carManufacturer`\
    \ string to “unknown” if none of the `case` statements match the car model string.\n\
    \n## 10.5 Using switch expressions\n\nUsing a `switch` statement has saved us\
    \ some typing and made the code easier to read, but C# allows us to further simplify\
    \ the code using `switch` expressions, the syntax for which is as follows:\n\n\
    ```csharp\nresult = value switch\n{\n    constant1 => statements,\n    constant2\
    \ => statements,\n    constant3 or constant4 or ... => statements,\n    constant5\
    \ and constant6 or constant7 => statements,\n    _ => default_statement\n};\n\
    ```\n\nUsing a `switch` expression, our example can be simplified as follows:\n\
    \n```csharp\nstring carModel = \"Corolla\";\nstring carManufacturer;\ncarManufacturer\
    \ = carModel switch\n{\n    \"Patriot\" or \"Liberty\" or \"Wrangler\" => \"Jeep\"\
    ,\n    \"Focus\" => \"Ford\",\n    \"Corolla\" => \"Toyota\",\n    _ => \"unknown\"\
    \n};\n\nConsole.WriteLine($\"Manufacturer is {carManufacturer}\");\n```\n\n##\
    \ 10.6 Using goto in a C# switch statement\n\nIn our original example, we used\
    \ the `break` statement to exit out of the `switch` statement. The result of this\
    \ is to move the point of program execution to the statements immediately following\
    \ the `switch` statement. Unfortunately, this presents a problem when the `default`\
    \ statements must be executed. To address this requirement, we can replace the\
    \ `break` statements in our example code with a `goto default` statement:\n\n\
    ```csharp\nstring carModel = \"Corolla\";\nstring carManufacturer = \"unknown\"\
    ;\n\nswitch (carModel) {\n    case \"Patriot\":\n    case \"Liberty\":\n    case\
    \ \"Wrangler\":\n        carManufacturer = \"Jeep\";\n        goto default;\n\
    \    case \"Focus\":\n        carManufacturer = \"Ford\";\n        goto default;\n\
    \    case \"Corolla\":\n        carManufacturer = \"Toyota\";\n        goto default;\n\
    \    default:\n        Console.WriteLine($\"The {carModel} is manufactured by\
    \ {carManufacturer}\");\n        break;\n}\n```\n\nWhile the `goto` statement\
    \ could also be used to jump to a labeled location in our C# code, using it in\
    \ this way is strongly discouraged. The above-mentioned use is the only acceptable\
    \ use of the `goto` statement in a modern object-oriented language such as C#.\
    \ As any veteran programmer will tell you, if you find yourself in a position\
    \ where a `goto` statement is your only way of achieving something, you need to\
    \ re-think and re-structure your code so that you no longer need the `goto`.\n\
    \n## 10.7 Using continue in a C# switch statement\n\nAnother alternative to the\
    \ `break` statement is the `continue` statement. Suppose the `switch` statement\
    \ is part of a loop. In that case, the `continue` statement will cause execution\
    \ to return immediately to the beginning of the loop, bypassing any subsequent\
    \ code yet to be executed in the current loop iteration.\n\nThe use of the `continue`\
    \ statement in loops will be covered in the “C# Looping with the for Statement”\
    \ chapter.\n\n## 10.8 Take the knowledge test\n\nClick the link below or scan\
    \ the QR code to test your knowledge and understanding of the C# `switch` statement:\n\
    \n[https://www.answertopia.com/k4uy](https://www.answertopia.com/k4uy)\n\n![](images/image-04YSW843.jpg)\n\
    \n## 10.9 Summary\n\nThe `if-else` statement is a reliable way to make decisions\
    \ when there are only a few possible outcomes. However, when many potential outcomes\
    \ result from an evaluation, this approach can become cumbersome. In such cases,\
    \ the `switch` statement is a better option for implementing flow control logic\
    \ in C#. A `switch` statement may be further simplified in many situations using\
    \ a `switch` expression.\n\n## 11. Looping with the for Statement\n\nThis chapter\
    \ will continue looking at `for` statements.\n\n### 11.1 Why loops?\n\nIt is generally\
    \ common that computers are great at repetitive tasks. What would happen if you\
    \ needed to perform this 100 or even 10,000 times? Writing C# code would be prohibitive.\n\
    \nThe syntax of a `for` loop is as follows:\n\n```csharp\nfor (initializer; conditional\
    \ expression; loop expression)\n```\n\nThe `initializer` initializes a counter\
    \ variable. For example, sets it to zero.\n\nThe `conditional expression` specifies\
    \ the test to verify whether the loop has performed the required number of iterations.\
    \ For example, if we want to loop 100 times:\n\nThe `loop expression` specifies\
    \ the action to perform on the counter. For example, to increment by 1:\n\nThe\
    \ body of statements to be executed on each iteration of the loop is contained\
    \ within the code block defined by the opening ({) and closing (}) braces. By\
    \ bringing this all together, we can create a for loop to perform the task outlined\
    \ in the earlier example:\n\n```csharp\nlong j = 1;\nfor (int i=0; i<50; i++)\
    \ {\n    j += j;\n}\nConsole.WriteLine(\"j = \" + j);\n```\n\n## 11.2 C#\n\n###\
    \ loop variable scope\n\nA key point to note in creating loops is that any variables\
    \ defined within a loop are only visible to code within the loop. This is a concept\
    \ known as scope. If, for example, a variable `myCounter` is defined within the\
    \ body of a for loop, that variable ceases to exist once the loop terminates:\n\
    \n```csharp\n// variable myCounter does not yet exist\nfor (int i = 0; i < 10;\
    \ i++)\n{\n    int myCounter = 0; //myCounter created in scope of for loop\n \
    \   myCounter += i;\n}\n\n// after loop exit myCounter is now out of scope and\
    \ ceases to exist\n```\n\n## 11.3 Creating an infinite for loop\n\nA for loop,\
    \ which will execute an infinite number of times, may be constructed using `for(;;)`\
