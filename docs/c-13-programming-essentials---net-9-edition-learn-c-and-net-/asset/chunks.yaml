    \n注意，别名声明并没有覆盖我们的 `using DemoSpaceTwo` 语句，我们仍然可以访问第二个 `ClassA` 的 `OpenFile()`\
    \ 方法：\n\n```csharp\nClassA.OpenFile();\n```\n\n别名运算符也可以用于显式访问全局命名空间中的对象。考虑以下类代码示例，该类既位于全局命名空间，又位于自定义命名空间中：\n\
