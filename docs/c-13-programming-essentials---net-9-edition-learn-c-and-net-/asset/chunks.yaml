    Care should be taken when using explicit casts. If the value being cast is greater
    than the storage capacity of the destination variable, the value will change without
    warning. For example, consider the following modification of the above example:


    ```csharp

    long myLong = 138129210212;


    int myInteger;


    myInteger = (int) myLong;


    Console.WriteLine($"myLong = {myLong}");


    Console.WriteLine($"myInteger = {myInteger}");

    ```


    The output from the above code illustrates that the value assigned to `myInt`
    no longer matches that assigned initially to `myLong`:


    ```text

    myLong = 138129210212

    myInteger = 690256740

    ```


    In this case, the `myLong` value exceeds the `int` data type’s storage capacity,
    causinging the variable’s value to change without warning. A bug of this nature
    may be difficult to locate in a complex development project.


    Similarly, assigning a floating-point value to a variable that only stores whole
    numbers will result in the loss of the fractional part of the original value.


    Note that casting is only possible on numerical data types. It is not, therefore,
    possible to perform casts on string, `bool`, or `char` data types.


