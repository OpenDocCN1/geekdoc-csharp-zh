  raw: 'In this chapter, we will explore the asynchronous features of C# and explain
    how they can be used to incorporate multi-tasking support into your projects.


    ## 24.1 An overview of threads


    Threads are a fundamental feature of modern CPUs and are essential for multitasking
    in operating systems. While CPUs can handle numerous threads, the actual number
    of threads that can run in parallel at a given time is limited by the number of
    CPU cores, typically ranging from 4 to 16 cores depending on the CPU model. When
    the number of threads exceeds the available CPU cores, the operating system uses
    thread scheduling to determine how these threads are shared among the available
    cores.


    Threads are like small processes that run within a main process. They allow for
    the appearance of parallel execution within applications and managing them directly
    in code can be a complex and unpredictable process. The great thing about the
    asynchronous features of C#, however, is that they use threads behind the scenes,
    handling all the complexity for you.


    ## 24.2 The main thread


    When an app is first started, the runtime system will typically create a single
    thread in which the app will run by default. Any code within an app that performs
    a time-consuming task using the main thread will cause the entire application
    to appear to lock up until the task is completed. This can be avoided by launching
    the tasks to be performed in separate threads, allowing the main thread to continue
    unhindered with other tasks.


    ## 24.3 Asynchronous programming in C#


    Asynchronous support in C# is provided by the Task Asynchronous Programming model
    (TAP), which allows parallel execution to be performed safely and in a way that
    is logical and easy to both write and understand. In other words, asynchronous
    C# code is written sequentially from top to bottom in much the same way as synchronous,
    making it easy to understand the logic flow.


    This chapter introduces C# asynchronous programming, providing in-depth coverage
    of key concepts and techniques for efficient parallel execution.


    24.4 Creating the AsyncDemo project


    Launch VS Code, open your “C# Essentials” workspace folder, and create a new .NET
    Console App project named AsyncDemo.


    ## 24.5 Synchronous code


    Before exploring asynchronous programming, we will first look at an example of
    synchronous code execution. Begin by opening the Program.cs file and modifying
    it as follows:


    namespace AsyncDemo


    {


        internal class Program


        {


            static void Main(string[] args)


            {


            }


            private static string ProcessFile(string filename) {


                Console.WriteLine($"Start {filename} at {DateTime.Now}");


                Task.Delay(6000).Wait();


                return filename;


            }


        }


    }


    The ProcessFile() method outputs a starting timestamp before calling the Task.Delay()
    and Wait() methods to simulate a 6-second file processing task that blocks the
    current thread. After the delay, the method returns the name of the completed
    file.


    Next, we want to call ProcessFile() multiple times from the Main() method. In
    doing so, we will also output start timestamps and use the C# Stopwatch diagnostic
    class to record the total execution time of the method calls:


    using System.Diagnostics;


    namespace AsyncDemo


    {


        internal class Program


        {


            static void Main(string[] args)


            {


                Stopwatch stopwatch = Stopwatch.StartNew();


                Console.WriteLine("\n=== Before async task calls ===\n");


                string filename1 = ProcessFile("file1.txt");


                Console.WriteLine($"End {filename1} at {DateTime.Now}\n");


                string filename2 = ProcessFile("file2.txt");


                Console.WriteLine($"End {filename2} at {DateTime.Now}\n");


                string filename3 = ProcessFile("file3.txt");


                Console.WriteLine($"End {filename3} at {DateTime.Now}\n");


                Console.WriteLine("=== After async tasks calls ===\n");


                stopwatch.Stop();


                TimeSpan timeSpan = stopwatch.Elapsed;


                Console.WriteLine($"Elapsed time: {timeSpan.Seconds} seconds");


            }


    .


    .


    }


    Run the app and check the console output resembles the following:


    Start file1.txt at 9/24/2024 1:05:04 PM


    End file1.txt at 9/24/2024 1:05:10 PM


    Start file2.txt at 9/24/2024 1:05:10 PM


    End file2.txt at 9/24/2024 1:05:16 PM


    Start file3.txt at 9/24/2024 1:05:16 PM


    End file3.txt at 9/24/2024 1:05:22 PM


    Elapsed time: 18 seconds


    As we can see from the above output, the three calls to the ProcessFile() method
    were executed sequentially resulting in a combined processing time of 18 seconds.
    Converting ProcessFile() to an asynchronous method should reduce the total elapsed
    time from 18 to 6 seconds. Before we make this change, however, we first need
    to introduce the C# Task class.


    ## 24.6 Understanding the C# Task class


    Asynchronous operations in C# are represented by Task objects. As we saw earlier,
    we can directly call static Task methods such as Delay(), for example:


    Task.Delay(6000);


    The above code will start an asynchronous 6-second delay. In other words, although
    the delay will be performed, it will occur in the background, and any subsequent
    code after the call will execute immediately. To make the execution block the
    current thread we called the Wait() method of the Task to prevent further execution
    until after the delay:


    Task.Delay(6000).Wait();


    As we will see in the remainder of this chapter, any asynchronous operation that
    we initiate will have a Task object associated with it that will allow us to manage
    the background execution.


    ## 24.7 Declaring asynchronous methods


    Asynchronous execution can be applied to methods, lambdas, and anonymous functions
    and are declared using the async keyword and specifying a Task return type. C#
    naming convention also recommends, but does not require, that the method name
    ends in “Async”. Given these requirements, we can modify our ProcessFile() method
    as follows:


    private static async Task <string>ProcessFileAsync(string filename)</string>


    {


        Console.WriteLine($"Start {filename} at {DateTime.Now}");


    await Task.Delay(6000).Wait();


        return filename;


    }


    We have declared that the method is asynchronous and returns a Task object containing
    a string result parameter (in this case the file name).


    Note that because we are now working within an async method, we have switched
    from calling the Wait() method of the Task object to using the await operator.


    ## 24.8 Introducing the await operator


    The foundations of C# asynchronous execution are the Task class and the await
    operator. The await operator tells the system to suspend the execution of the
    calling method until a corresponding asynchronous operation completes and returns.


    Using our AsyncDemo example, we know that the Main() method makes three consecutive
    calls to the file processing method and that each call has to wait until the previous
    one completes before it can execute. In addition to being an inefficient way to
    process multiple files, none of the code after the three calls can execute until
    the last one completes, essentially locking up the app. In all likelihood, there
    are other tasks the Main() method could be performing while waiting for the results
    to be returned from the ProcessFileAsync() method calls, such as processing other
    data, providing status updates to the user, and responding to user input.


    Using Task objects and await, we can run three file processing operations in parallel
    and also allow other code in the Main() method to run while we wait for the results
    from the asynchronous calls.'
