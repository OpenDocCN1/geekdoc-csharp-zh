    ## 26.3 访问数组元素\n\n一旦值被存储在数组中，很可能在 C# 代码的后续某个需要访问这些值。这通过使用数组访问器符号结合目标值在数组中的索引来实现。数组访问器仅为数组名后跟方括号（`[]`）。方括号内放置一个代表目标值在数组索引的数字（注意\
    \ C# 中的第一个数组元素索引为 0）。例如，要访问 `myColors` 数组的第二个元素，将使用以下符号：\n\n```csharp\nstring[]\
    \ myColors = {\"red\", \"green\", \"yellow\", \"orange\", \"blue\"};\nConsole.WriteLine($\"\
    Element at index 1 = {myColors[1]}\");\n```\n\n执行上述代码时，它将输出单词“green”，因为这是数组中索引位置\
    \ 1 包含的字符串。\n\n同样，可以使用访问器符号结合赋值运算符（`=`）来更改数组中特定索引位置的值。例如，要更改数组中第一个项的值：\n\n```csharp\n\
    string[] myColors = [\"red\", \"green\", \"yellow\", \"orange\", \"blue\"];\n\
    myColors[0] = \"violet\";\nConsole.WriteLine($\"Element at index 0 = {myColors[0]}\"\
    );\n```\n\n多维数组中的值可以通过指定用并用逗号分隔的每个维度的索引值来访问。例如，要访问 `my2Darray` 中第一个数组的第一个元素，将使用以下访问器（注意数组从索引位置\
    \ 0 开始）：\n\n```csharp\nchar element = my2Darray[0,0];\n```\n\n以下代码演示了如何访问 2D 数组和\
    \ 3D 数组中的各种元素：\n\n```csharp\nchar[,] my2Darray = new char[3,3]\n{\n    {'a', 'b',\
