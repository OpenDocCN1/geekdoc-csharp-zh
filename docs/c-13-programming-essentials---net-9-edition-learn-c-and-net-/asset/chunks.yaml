    to be performed in addition to assigning values to properties. For example, the
    BankAccount constructor might include some logic to catch an empty customer name
    string:


    public BankAccount(string accountName, int accountNumber)


    {


        if (accountName == "")


            _accountName = "Anonymous";


        else


            _accountName = accountName;


        _accountNumber = accountNumber;


    }


    A class can contain multiple constructors, each with a unique set of parameters.
