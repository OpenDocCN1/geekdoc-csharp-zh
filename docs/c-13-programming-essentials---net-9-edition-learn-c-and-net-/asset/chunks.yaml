    Running the above code will produce the following output:


    Inline conversion to lowercase > Converted text = this is a test.


    ## 16.3 Lambdas


    You can think of lambdas as anonymous methods that allow code to be written more
    concisely. As with delegates and anonymous methods, you will first need to declare
    a variable of type delegate in which to store the lambda reference and to define
    the return value and parameter types using the following, now familiar, syntax:


    delegate <returntype><delegatename>(<parameters>);</parameters></delegatename></returntype>


    Lambdas are declared using the => operator. The left side of the operator lists
    the input parameters, and the right side consists of an expression or code block
    containing the code to be executed.


    C# supports the following types of lambda:


    •Expression lambda – The lambda body contains a single expression to be executed.


    •Statement lambda – The lambda body contains a statement block enclosed in braces
    ({}) containing multiple statements.


    The syntax for an expression lambda reads as follows:


    (input-parameters) => expression


    When passing a single parameter to a lambda, the parentheses placed around the
    input parameters in the above syntax are optional.


    A statement lambda, on the other hand, uses the following syntax:


    (input-parameters) => { <statements>};</statements>


    To appreciate the concise nature of lambdas, consider the following slightly modified
    anonymous method declaration from our Program.cs file:


    delegate string StringConverter(string s);


    .


    .


    StringConverter converter = delegate (string s)


    {


        return s.ToLower();


    };


    Using a lambda, we can implement the same behavior as follows:


    .


    .


    internal class Program


    {


    delegate string StringConverter(string s);


        static void Main(string[] args)


        {


            StringConverter converter = s => s.ToLower();


    var result = converter("LAMBDA Demo");


            Console.WriteLine(result);


        }


    }


    Before using a lambda, we started with the following code:


    delegate(string s)


    {


        return s.ToLower();


    };


    Using a lambda has allowed us to reduce the original code to the following:


    s => s.ToLower();


    In the above lambda example, the left side of the lambda operator indicates that
    a single parameter named s is being passed through to the expression on the right.
    Notice that we did not need to declare that s is of type string. This is because
    we have already declared the type in the delegate variable declaration. The expression
    simply returns the value after converting it to lowercase. Having declared the
    lambda, we call it just like an anonymous method:


    var result = converter("LAMBDA Demo");


    ## 16.4 Passing multiple parameters


    Our earlier lambda example used only one input parameter. If you need to pass
    multiple parameters to a lambda, you can do so by enclosing them in parentheses
    (()). For example:


    .


    .


    delegate string MultiLambda(string s, int i, double d);


    .


    .


    static void Main(string[] args)


    {


    MultiLambda sample = (s, i, d) => $"Product = {s}, Count = {i}, Price = ${d}";


    .


    .


    Console.WriteLine(sample("HDMI Cable", 5, 20.99));


    }


    When the app runs, the product properties will be displayed as follows:


    Product = HDMI Cable, Count = 5, Price = $20.99


    ## 16.5 Passing no parameters


    Alternately, a lambda that accepts no parameters is declared using empty parentheses:


    .


    .


    delegate string SayHello();


    .


    .


    static void Main(string[] args)


    {


        SayHello hello = () => "Hello";


        Console.WriteLine(hello());


    }


    ## 16.6 Local functions


    Local functions are similar in many ways to lambda expressions with some important
    differences. Local functions are named methods that are declared within other
    methods. Like private methods, local functions are not accessible outside the
    scope of the containing method and do not need to be assigned to delegate variables.


    Local functions are declared in the same way as any other C# method. For example,
    the following is the local function equivalent of our StringConverter lambda:


    string converter(string s)


    {


        return s.ToLower();


    }


    Since the converter function only contains a single expression, we can abbreviate
    the statement using the => operator:


    string converter(string s) => s.ToLower();


    Unlike anonymous methods and lambdas, local functions have direct access to the
    local variables and values within the containing method’s scope.


    ## 16.7 Creating the LocalFunctions project


    To try out local functions, create a new .NET Console App project in VS Code,
    and name it LocalFunctions. Once the project has been created, edit the Program.cs
    file so that it reads as follows:


    namespace LocalFunctions


    {


        internal class Program


        {


            static void Main(string[] args)


            {


                ConvertToEuros(10.00);


            }


            private static void ConvertToEuros(double value)


            {


                var exchangeRate = 0.5;


                double USDToEuro(double dollars) => exchangeRate * dollars;


                var result = USDToEuro(value);


                Console.WriteLine(result);


            }


        }


    }


    The ConvertToEuros() method accepts a dollar amount and returns the equivalent
    in euros. Within this method, we have declared a local function called USDToEuro()
    which multiplies the dollar parameter value by the local exchange rate variable
    and returns the result:


    double USDToEuro(double dollars) => exchangeRate * dollars;


    A key point to note in this example is that the local function has access to both
    the value parameter and the local exchangeRate variable, neither of which would
    have been directly available to a lambda expression.


