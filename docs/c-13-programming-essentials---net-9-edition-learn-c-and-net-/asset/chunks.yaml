        // Constructor


        public BankAccount(string accountName, int accountNumber)


        {


            _accountName = accountName;


            _accountNumber = accountNumber;


        }


        public BankAccount(string accountName, int accountNumber, bool isActive)


        {


            _accountName = accountName;


            _accountNumber = accountNumber;


            _isActive = isActive;


        }


        public bool IsActive {


            get => _isActive;


            set => _isActive = value;


        }


    .


    .


    With these changes, BankAccount class instances may be created using either constructor:


    BankAccount custAccount = new("John Smith", 53211);


    BankAccount custAccount2 = new("John Smith", 53211, true);


    ## 13.14 C# primary constructors


    When a constructor’s sole purpose is to assign provided parameters to properties
    with no additional actions, a primary constructor is recommended. Primary constructors
    are declared by placing the parameters after the class name and assigning them
    to the private variables. For example:


    public class BankAccount(string accountName, int accountNumber)


    {


        private string _accountName = accountName;


        private int _accountNumber = accountNumber;


        // Constructor


        public BankAccount(string accountName, int accountNumber)


        {


            _accountName = accountName;


            _accountNumber = accountNumber;


        }


    ## 13.15 C# finalizers


    Finalizers are used to clean up any resources a class object uses when the object
    is destroyed. Unlike constructors, which can be triggered from code using the
    new keyword, there is no way to explicitly call a finalizer (for example, there
    is no delete equivalent to the new keyword). Instead, the finalizer will be called
    when the runtime system decides the object instance is no longer needed. All the
    programmer can be sure of is that the finalizer will be called at some time between
    when the code no longer needs the object and the point that the application terminates.


    Finalizers are defined in the same way as constructors, with the exception that
    they cannot be public and the name is preceded by the tilde character (~):


    // Finalizer


    ~BankAccount() {


        // Code to perform clean-up


    }


    ## 13.16 The “this” keyword


    When constructing classes in C#, you may encounter situations where a property
    that is local to a method or the name assigned to the method parameter conflicts
    with a class property. This is particularly common when using public fields within
    class declarations.


    Take, for example, the following sample class in which the parameter names for
    the initializer match those of the public fields:


    class DemoClass


    {


        public string name;


        public int age;


        public DemoClass(string name, int age)


        {


            name = name;


            age = age;


        }


    }


    The following code creates a DemoClass instance and initializes it with name and
    age values:


    DemoClass demo = new("Mark", 37);


    Console.WriteLine($"{demo.name} is {demo.age} is years old.");


    When the above code runs, there will be no name and the age will be 0 even though
    age was set to 37 when the class instance was created. In addition, the compiler
    will issue a warning which reads:


    warning CS1717: Assignment made to same variable; did you mean to assign something
    else?


    The problem here is that the compiler doesn’t know which name and age variables
    are being referenced in the following initializer code:


    public DemoClass(string name, int age) {


        name = name;


        age = age;


    }


    To resolve this problem, we need a way to tell the compiler that the method parameter
    values are to be assigned to the corresponding public field values. We can do
    this using the this keyword. In this context, the this keyword represents the
    current class instance. To differentiate the conflicting name and age variables,
    we need to use the this keyword as follows:


    public DemoClass(string name, int age) {


    this.name = name;


    this.age = age;


    }


    Now we not only no longer see the compiler’s warning messages but see Mark’s name
    and correct age.


