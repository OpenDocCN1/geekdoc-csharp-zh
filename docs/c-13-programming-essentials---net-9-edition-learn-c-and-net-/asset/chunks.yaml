    Any character preceded by a backslash is considered a special character and treated
    accordingly. This raises the question of what to do if you want a backslash character.
    We achieve this by escaping the backslash itself (\\):


    Console.WriteLine("C# special characters are escaped using the \\ character.");


    When the above code executes, it will generate the following output:


    C# special characters are escaped using the \ character.


    Commonly used special characters supported by C# are as follows:


    | Constant | Special value |


    | \e | Escape character |


    | \n | Newline |


    | \r | Carriage return |


    | \t | Horizontal tab |


    | \\ | Backslash |


    | \” | Double quote (used when placing a double quote into a string declaration)
    |


    | \’ | Single quote (used when placing a single quote into a string declaration)
    |


    | \unn | Single-byte Unicode scalar where nn is replaced by two hexadecimal digits
    representing the Unicode character. |


    | \unnnn | Double-byte Unicode scalar where nnnn is replaced by four hexadecimal
    digits representing the Unicode character. |


    | \nnnnnnnn | Four-byte Unicode scalar where nnnnnnnn is replaced by eight hexadecimal
    digits representing the Unicode character. |


