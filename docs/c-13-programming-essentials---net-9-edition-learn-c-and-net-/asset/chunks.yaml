    \ C#\n\n### 命名空间\n\n在前面的章节中，我们详细涵盖了面向对象的 C# 编程。我们学习了如何使用类和结构来组织代码，从而生成组织良好的的可重用代码。在目前使用的许多代码示例中，我们看到了命名空间声明。现在我们已经理解了面向对象编程，准备好去发现什么是命名空间、它们为什么存在以及如何使用它们。\n\
    \n### 22.1 理解作用域\n\n在讨论命名空间之前，我们首先需要理解与编程语言相关的作用域概念。作用域定义了类声明、方法和变量等实体对于当前作用域之外的代码是否可见可访问。在查看\
    \ C# 循环时，我们简要提到过作用域。例如，在 `for` 循环体内声明的变量只属于循环的作用域，在循环执行之前或之后不存在：\n\n```csharp\n\
