    ### C#


    ## File and Directory Handling


    In this chapter, we explore how to work with files and directories in C#, covering
    classes and methods available in the System.IO namespace. In particular, we will
    use Directory, File, FileInfo, and Stream classes to handle files and work with
    filesystem directories. After completing this chapter, you’ll be able to check
    if files exist, and create, read from, and write to text and binary files.


    ## 29.1 Introducing the System.IO classes


    When we work with files and directories in C#, we do so using a set of classes
    provided by the System.IO namespace. The key classes, and the ones we will be
    using in this chapter, are as follows:


    •Path - Provides a set of methods for managing file path strings, including constructing
    new paths and obtaining information about existing paths.


    •Directory - Provides a set of static methods for creating, deleting, moving,
    and navigating filesystem directory structures.


    •DirectoryInfo - Provides a set of features similar to the Directory class but
    in the form of non-static methods. This involves creating a DirectoryInfo instance
    initialized with the directory path and then calling methods on that object.


    •File - Includes a set of static methods for working with files, including methods
    to create, copy, delete, and open files. The File static methods are passed paths
    to the files on which the corresponding action is to be performed.


    •FileInfo - Provides features similar to the File class but in the form of non-static
    methods. This involves creating a FileInfo instance initialized with the file
    path and then calling methods on that object to perform operations such as opening,
    deleting, reading, and writing.


    •StreamReader / StreamWriter - The StreamReader and StreamWriter classes provide
    a more flexible alternative to the File and FileInfo classes for reading from
    and writing to files. These classes are intended for use when working with text-based
    files.


    •BinaryReader / BinaryWriter - These classes perform the same function as StreamReader
    and StreamWriter classes, but are used when working with files containing binary
    data.


    ## 29.2 Understanding paths in C#


    Paths in C# are represented by string values and will be formatted differently
    subject to the operating system type on which the code is running. On Windows
    systems, each path component is separated by a backslash (\) and is typically
    prefixed by a drive letter (C:\Users\Demo\Desktop). Systems that use the standard
    UNIX convention (macOS, Linux, iOS, Android, etc.) use the forward slash (/) to
    separate path components (/Users/Demo/Desktop).


    When a program starts, the current working directory is the directory from which
    the app was launched. The current working directory of an application can be changed
    using the Directory and DirectoryInfo methods.


    A filesystem top-level directory is referred to as the root directory and is represented
    by the ‘/’ or’ \’ separator. Path names that begin with a ‘/’ or ‘\’ are said
    to be absolute path names in that they specify a filesystem location relative
    to the root directory. For example, “/home/demo” and “C:\Temp\Files” are absolute
    paths.


    Paths that do not begin with a slash are interpreted to be relative to a current
    working directory. So, for example, if the current working directory is “C:\Users\Demo“
    and the path is “Documents\Letters”, then the path is considered to have an equivalent
    full, absolute pathname of “C:\Users\Demo\Documents\Letters”.


    Windows-style paths present a problem because the backslash character represents
    escape sequences in C# strings. The following path, therefore, will cause a syntax
    error:


    "C:\Users\Demo\Desktop\Profile.txt"


    One option is to “escape” the backslash as follows:


    "C:\\Users\\Demo\\Desktop\\Profile.txt"


    Alternatively, Windows paths can be expressed as string literals:'
