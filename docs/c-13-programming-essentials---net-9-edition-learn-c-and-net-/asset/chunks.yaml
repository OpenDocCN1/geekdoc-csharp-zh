    of j.


    The above example shows two levels of nesting. Of course, it is possible to nest
    to more levels, though too many levels may result in difficult-to-understand code.


    ## 11.6 Breaking from nested loops


    An important point to be aware of when breaking out of a nested for loop is that
    the break only exits from the current level of the loop. For example, the following
    C# code example will exit from the current iteration of the nested loop when j
    equals 5\. The outer loop will, however, continue to iterate and, in turn, execute
    the nested loop:


    for (int i = 0; i < 100; i++) {


         Console.WriteLine( "i = " + i);


         for (int j = 0; j < 10; j++) {


            if (j == 5)


                break;


                Console.WriteLine( "j = " + j);


         }


    }


    ## 11.7 Continuing for loops


    Another helpful statement for use in loops is the continue statement. When the
    execution process finds a continue statement in any loop, it skips all remaining
    code in the loop’s body and begins execution again from the top of the loop. Using
    this technique, we can, for example, construct a for loop that outputs only even
    numbers between 1 and 9:


    for (int i = 1; i < 10; i++) {


         if ((i % 2) != 0)


              continue;


         Console.WriteLine($"i = {i}");


    }


    In the example, if i is not divisible by 2 with 0 remaining, the code performs
    a continue operation, sending execution to the top of the for loop, thereby bypassing
    the code to output the value of i. This results in only even numbers appearing
    in the console.


    ## 11.8 The C# foreach statement


    The foreach loop is used to iterate over a sequence of items in a collection and
    provides a simple-to-use looping option.


    The syntax of the foreach loop is as follows:


    foreach <name>in <collection>{</collection></name>


        // code to be executed


    }


    In this syntax, <name>is the name for a constant containing the current item from
    the object through which the loop is iterating. The code in the loop’s body will
    typically use this constant name to reference the current item in the loop cycle.
    The <collection>is the object through which the loop is iterating. This could,
    for example, be an array of string or numeric values (the topic of collections
    will be covered in greater detail in the chapter entitled “Creating 2D, 3D, and
    Jagged Arrays in C#”).</collection></name>


    Consider, for example, the following foreach loop construct:


    string[] myColors = ["red", "green", "yellow", "orange", "blue"];


    foreach (string color in myColors)


    {


        Console.WriteLine("{0} ", color);


    }


    The loop begins by stating that the current item will be assigned to a constant
    named color. We then tell the statement that it is to iterate through all the
    elements in the myColors collection. The loop’s body sends a message to the console
    panel indicating the current value assigned to the color constant.


    As we will see in the “Creating 2D, 3D, and Jagged Arrays in C#” chapter, the
    foreach loop is particularly beneficial when working with collections such as
    arrays and dictionaries.


