- fmt: '

    Dates and times comprise distinct and separate values, namely the day, month,
    year, hours, minutes, seconds, and milliseconds. The C# `DateTime` object stores
    each value as a separate property within the object, allowing each to be accessed
    individually. For example, the following code sample extracts each value and displays
    it in the console:


    ```csharp

    DateTime meetingAppt = new(2024, 4, 9, 14, 30, 0);


    Console.WriteLine(meetingAppt.Day);


    Console.WriteLine(meetingAppt.Month);


    Console.WriteLine(meetingAppt.Year);


    Console.WriteLine(meetingAppt.Hour);


    Console.WriteLine(meetingAppt.Minute);


    Console.WriteLine(meetingAppt.Second);


    Console.WriteLine(meetingAppt.Millisecond);

    ```


    Output:

    9

    4

    2023

    14

    30

    0

    0


