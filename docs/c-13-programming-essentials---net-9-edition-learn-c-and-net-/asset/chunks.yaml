    ## Structures


    Having covered C# classes in the preceding chapters, this chapter will introduce
    the use of structures in C#. Although at first glance structures and classes look
    similar, there are some important differences that need to be understood when
    deciding which to use. This chapter will outline how to declare and use structures,
    explore the differences between structures and classes and introduce the concepts
    of value and reference types.


    ## 20.1 An overview of C# structures


    As with classes, structures form the basis of object-oriented programming and
    provide a way to encapsulate data and functionality into reusable instances. Structure
    declarations resemble classes with the exception that the struct keyword is used
    in place of the class keyword. The following code, for example, declares a simple
    structure consisting of a String variable, initializer, and method:


    public struct SampleStruct(string name)


    {


        private string _name = name;


        public string Name {


            get => _name;


            set => _name = value;


        }


        public string BuildHelloMsg() {


            return "Hello " + _name;


        }


    }


    Consider the above structure declaration in comparison to the equivalent class
    declaration:


    public class SampleClass(string name)


    {


        private string _name = name;


        public string Name {


            get => _name;


            set => _name = value;


        }


        public string BuildHelloMsg() {


            return "Hello " + _name;


        }


    }


    Other than the use of the struct keyword instead of class, the two declarations
    are identical. Instances of each type are also created using the same syntax:


    SampleStruct demoStruct = new(name: "Alex");


    SampleClass demoClass = new(name: "Anna");


    Given the commonality between classes and structures, it is important to gain
    an understanding of how the two differ. Before exploring the most significant
    difference it is first necessary to understand the concepts of value types and
    reference types.


    20.2 Creating the StructureDemo project


    Launch VS Code, open your “C# Essentials” workspace folder and create a new .NET
    Console App project named StructureDemo.


    ## 20.3 Value types vs. reference types


    While on the surface structures and classes look alike, major differences in behavior
    occur when structure and class instances are copied or passed as arguments to
    methods. This occurs because structure instances are value type while class instances
    are reference type.


    When a structure instance is copied or passed to a method, an actual copy of the
    instance is created, together with any data contained within the instance. This
    means that the copy has its own version of the data which is unconnected with
    the original structure instance. In effect, this means that there can be multiple
    copies of a structure instance within a running app, each with its own local copy
    of the associated data. A change to one instance has no impact on any other instances.


    In contrast, when a class instance is copied or passed as an argument, the only
    thing duplicated or passed is a reference to the location in memory where that
    class instance resides. Any changes made to the instance using those references
    will be performed on the same instance. In other words, there is only one class
    instance but multiple references pointing to it. A change to the instance data
    using any one of those references changes the data for all other references.


