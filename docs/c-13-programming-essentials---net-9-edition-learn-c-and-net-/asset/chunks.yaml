    ## 17.7 Summary


    In C#, inheritance is a programming concept that allows new classes to be created
    from existing classes and extended to add new functionality. This means that when
    an existing class provides some, but not all, of the functionality required by
    a programmer, that class can be used as the basis for a new subclass. By doing
    so, the new subclass will inherit all the parent class’s capabilities and can
    be extended further to add any missing functionality.


    ## 18\. C# Abstract Classes


    In the preceding chapters, we have examined object-oriented programming in C#
    and the concept of class inheritance. This chapter will introduce abstract classes.


    ## 18.1 What is a C# abstract class?


    In the examples we have looked at so far in this book, we have created classes
    that could be both instantiated as objects and used as a base class from which
    to derive classes. Often, a base class is not intended to be instantiated and
    is provided solely as an outline or template for subclasses. Such a class is known
    as an abstract class. An abstract class cannot be instantiated as an object and
    is only provided to derive subclasses.


    ## 18.2 Abstract members


    A C# abstract class contains abstract members, which define what a subclass must
    contain. These abstract members declare that a member of a particular type is
    required; it does not implement the member. Implementation of abstract members
    takes place within the derived class. A subclass that derives from an abstract
    class and fails to implement abstract methods will generate syntax errors.


    ## 18.3 Declaring a C# abstract class


    In addition to using the class modifier, as we have seen in previous examples,
    abstract classes must also be declared using the abstract modifier:


    public abstract class Talk {


    }


    Abstract class member methods and properties are also declared using the abstract
    keyword. For example, to declare an abstract method in our Talk class, the following
    code is required:


    public abstract class Talk {


         public abstract void Speak();


    }


    We now have an abstract class with an abstract method named Speak(). Note that
    this declaration only states that any class derived from the Talk base class must
    implement a method called Speak() which returns no value (i.e., it is declared
    as void) and has no parameters. It does not, however, implement the method.


    ## 18.4 Deriving from an abstract class


    To subclass from an abstract class, we write code as follows:


    public class SayHello : Talk {


    }


    We now have a class named SayHello , which is derived from the abstract Talk class.
    The next step is to implement the abstract Speak() method. When implementing abstract
    members in a derived class, the override modifier must be used. For example:


    public override void Speak() {


        Console.WriteLine("Hello!");


    }


    We now have a subclass derived from the Talk abstract class, which implements
    the abstract Speak() method.


    ## 18.5 Creating the AbstractClassDemo project


    With the basics of abstract classes covered, we can put this knowledge to use
    in an example project. Begin by creating a new .NET Console App project in VS
    Code named AbstractClassDemo.


    Using the Solution Explorer, add a new Class to the AbstractClassDemo project
    named Talk.


    Edit the Talk.cs file to declare the Talk class as abstract and to add the abstract
    Speak() method as follows:


    namespace AbstractClassDemo;


    public abstract class Talk


    {


    public abstract void Speak();


    }


    Next, we need to add the second class which will be subclassed from the Talk class.
    Repeat the above steps to add a class file to the project, this time naming the
    file SayHello.cs. Once the file has been added, make the following changes to
    subclass from Talk and implement the Speak() method:


    namespace AbstractClassDemo


    {


        internal class SayHello : Talk


        {


            public override void Speak()


            {


                Console.WriteLine("Hello!");


            }


        }


    }


    Finally, modify the Program.cs file to use the new classes:


