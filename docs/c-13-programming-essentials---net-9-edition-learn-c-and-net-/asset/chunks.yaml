    Hello\");\n    }\n    public string BuildMessage(int count, string name = \"Customer\"\
    )\n    {\n        return $\"Hello {name}, you are visitor number {count}.\";\n\
    \    }\n}\n```\n\n对方法进行更改后，尝试在不传递名称参数的情况下调用：\n\n```csharp\nDemo demo = new();\n\
    string message = demo.BuildMessage(count: 10);\nConsole.WriteLine(message);\n\
    ```\n\n当应用程序运行时，将出现以下输出，其中名称被替换为“Customer”：\n\nHello Customer, you are visitor\
    \ number 10.\n\n## 14.10 处理数量数量的参数\n\n到目前为止，我们查看了调用时接受固定数量参数的方法示例。C# 还提供了一种配置方法以接受可数量参数的方法。这涉及到将参数存放在\
    \ `List` 集合中并使用 `params` 关键字对其进行处理。C# 的 `List` 类允许将多个项分组在单个对象中，将在“C# List 集合”章节中介绍。假设我们需要一个可以接受任意数量字符串参数的方法。使用\
    \ `params` 关键字，我们可以如下声明该方法：\n\n```csharp\npublic void GreetGuests(params List<string>\
    \ guests)\n{\n    foreach (var guest in guests) {\n        Console.WriteLine($\"\
    Welcome, {guest}\");\n    }\n}\n```\n\n当我们调用 `GreetGuests()` 方法时，我们可以传递一个包含任意数量客户名称的\
    \ `List` 实例，而无需更改 `GreetGuests()` 方法：\n\n```csharp\nList<string> names = [\"John\"\
    , \"Paul\", \"George\"];\ndemo.GreetGuests(names);\nnames = [\"Mark\", \"Robert\"\
    ];\ndemo.GreetGuests(names);\n```\n\n`params` 参数可以与其他方法参数结合使用，例如：\n\n```csharp\n\
    public void GreetGuests(int groupId, params List<string> guests)\n{\n    // ...\n\
    }\n```\n\n一个方法只能接受一个 `params` 参数，该参数必须位于参数列表的末尾。\n\n## 14.11 C# in, out, 和 ref\
    \ 参数修饰符\n\n当参数传递给方法时，它是按值传递的。假设代码包含一个名为 `myVar` 的 `int` 变量，并对其赋值值 10。然后将 `myVar`\
    \ 变量传递给名为 `DoSomething()` 的方法。在这种情况下，仅将值 10 的拷贝传递给方法，与原始 `myVar` 变量没有连接。因此，从方法内部对值的任何更改都不会反映在原始变量中。\n\
    \n向 `Demo` 类中添加以下方法以演示这种效果：\n\n```csharp\npublic class Demo {\n    // .\n    public\
    \ void DoSomething(int myVar) {\n        myVar = 10;\n    }\n}\n```\n\n接下来，按照如下方式修改\
    \ `Program.cs` 文件：\n\n```csharp\nint myVar = 20;\nDemo demo = new();\nConsole.WriteLine($\"\
    Before method call myVar = {myVar}\");\ndemo.DoSomething(myVar);\nConsole.WriteLine($\"\
    After method call myVar = {myVar}\");\n```\n\n上面的代码声明了一个变量并对其赋值为 20。在调用方法之前，显示了\
    \ `myVar` 的当前值。然后将变量作为参数传递给 `DoSomething()` 方法，在该方法内部它被赋值为 10。当 `DoSomething()`\
    \ 方法返回时，再次输出赋值给 `myVar` 变量的值。\n\n运行应用程序并验证赋值给 `myVar` 变量的值没有被 `DoSomething()`\
    \ 方法更改：\n\nBefore method call myVar = 20\nAfter method call myVar = 20\n\n为了允许在方法内部更改赋值给变量的值，我们需要按引用传递变量。\n\
    \n按引用传递意味着我们不是传递底层值，而是传递指向变量存储其值的内存位置的引用。方法内部进行的任何更改都将应用在变量的值上。\n\n在方法中声明参数时以及调用方法时，都使用\
    \ `ref` 修饰符按引用传递变量，如下所示：\n\n```csharp\n// Demo.cs\npublic class Demo {\n    //\
    \ .\n    public void DoSomething(ref int myVar) {\n        myVar = 10;\n    }\n\
    }\n\n// Program.cs\nConsole.WriteLine($\"Before method call myVar = {myVar}\"\
    );\ndemo.DoSomething(ref myVar);\nConsole.WriteLine($\"After method call myVar\
    \ = {myVar}\");\n```\n\n当应用程序运行时，赋值给 `myVar` 变量的值发生了变化：\n\nBefore method call\
    \ myVar = 20\nAfter method call myVar = 10\n\n为了允许方法通过参数返回值，请使用 `out` 修饰符。`out`\
    \ 修饰符与 `ref` ，但变量必须由方法初始化。\n\n```csharp\n// Demo.cs\npublic class Demo {\n   \
    \ public void GetValue(out int result) {\n        result = 42;\n    }\n}\n\n//\
    \ Program.cs\nint value;\ndemo.GetValue(out value); // 输出 42\n```\n\n要防止方法更改按引用传递的变量，请使用\
    \ `in` 修饰符。`in` 修饰符按引用传递变量。\n\n```csharp\n// Demo.cs\npublic class Demo {\n  \
    \  public void DisplayValue(in int value) {\n        // value = 10; // 错误：不能对只读赋值\n\
    \    }\n}\n\n// Program.cs\nint value = 20;\ndemo.DisplayValue(in value);\n```\n\
    \n## 14.12 知识测试\n\n点击下方链接或扫描二维码以测试你对以下内容的知识和理解：\n\n[`www.answertopia.com/r67i`](https://www.answertopia.com/r67i)\n\
    \n![](img/W0NI70.jpg)\n\n## 14.13 总结\n\nC# 方法是执行特定任务的自包含代码单元。它们有助于组织代码并促进代码重用。本章讨论了方法并解释了如何创建它们。我们介绍了向方法添加参数以及区分命名参数和可选参数。最后，我们学习了何时使用\
    \ `in`、`out` 和 `ref` 参数修饰符，以及按值和按引用传递参数的区别。\n\n## 15. 委托 (Delegates)\n\n本章将继续探索\
    \ C# 方法，引入委托的概念，包括它们是什么以及如何使用它们。\n\n### 15.1 什么是委托？\n\n在我们开始探索委托之前，首先有助于理解签名（signature）的概念。在声明方法时，它接受的参数和返回的结果类型构成了方法的签名。以下方法的签名表示它接受一个字符串值作为参数并返回一个整数：\n\
    \n```csharp\npublic int GetLength(string value) {\n    // ...\n}\n```\n\n下面的方法执行完全不同的任务，但与上述\
    \ `GetLength()` 方法具有相同的签名：\n\n```csharp\npublic int CustomerCount(string customer)\
    \ {\n    // ...\n}\n```\n\nC# 委托存储方法引用的变量。如果你熟悉 C 或 C++ 编程，委托类似于函数指针。\n\n一旦声明，委托就可以更改为指向任何匹配委托签名的方法。\n\
    \n"
