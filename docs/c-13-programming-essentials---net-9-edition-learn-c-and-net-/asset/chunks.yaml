    \ `delegate` 类型的变量来存储 Lambda 引用，并使用以下现在已熟悉的语法定义返回值和参数类型：\n\n`delegate <returntype><delegatename>(<parameters>);</parameters></delegatename></returntype>`\n\
    \nLambda 使用 `=>` 运算符声明。运算符的左侧列出输入参数，右侧由包含要执行代码的表达式或代码块组成。\n\nC# 支持以下类型的 Lambda：\n\
    \n*   表达式 Lambda（Expression lambda）——Lambda 体包含一个要执行的单一表达式。\n*   语句 Lambda（Statement\
    \ lambda）——Lambda 体包含一个用大括号 `{}` 包围的语句块，其中包含多个语句。\n\n表达式 Lambda 的语法如下：\n\n`(input-parameters)\
    \ => expression`\n\n当向 Lambda 传递单个参数时，上述语法中放在输入参数周围的括号是可选的。\n\n另一方面，语句 Lambda\
    \ 使用以下语法：\n\n`(input-parameters) => { <statements>};</statements>`\n\n为了体会 Lambda\
    \ 的简洁性，请考虑从我们的 `Program.cs` 文件中稍作修改匿名方法声明：\n\n```csharp\ndelegate string StringConverter(string\
    \ s);\n\nStringConverter converter = delegate (string s)\n{\n    return s.ToLower();\n\
    };\n```\n\n使用 Lambda，我们可以如下实现相同的行为：\n\n```csharp\ninternal class Program\n{\n\
    \    delegate string StringConverter(string s);\n    static void Main(string[]\
    \ args)\n    {\n        StringConverter converter = s => s.ToLower();\n      \
    \  var result = converter(\"LAMBDA Demo\");\n        Console.WriteLine(result);\n\
    \    }\n}\n```\n\n在使用 Lambda 之前，我们开始于：\n\n```csharp\ndelegate string StringConverter(string\
    \ s);\n\nStringConverter converter = delegate (string s)\n{\n    return s.ToLower();\n\
    };\n```\n\n使用 Lambda 允许我们将代码缩减为：\n\n```csharp\nStringConverter converter = s =>\
    \ s.ToLower();\n```\n\n由于 Lambda 只包含一个单一表达式，我们不需要声明类型。声明 Lambda 后，我们像这样调用它：\n\n\
    `converter(\"LAMBDA Demo\")`\n\n## 16.4 传递参数\n\n与标准委托一样，你也可以使用上一章概述的语法将匿名方法作为参数传递给其他方法，例如：\n\
    \n```csharp\nnamespace LambdaDemo\n{\n    internal class Program\n    {\n    \
    \    delegate string StringConverter(string value);\n        static void DisplayText(StringConverter\
    \ converter, string text)\n        {\n            string result = converter(text);\n\
    \            Console.WriteLine($\"Converted text = { result}\");\n        }\n\
    \        static void Main(string[] args)\n        {\n            StringConverter\
    \ converter = delegate (string value)\n            {\n                Console.Write(\"\
    Inline conversion to lowercase > \");\n                return value.ToLower();\n\
    \            };\n            DisplayText(converter, \"This IS a teST.\");\n  \
    \      }\n    }\n}\n```\n\n运行上述代码将产生以下输出：\n\n```\nInline conversion to lowercase\
    \ > Converted text = this is a test.\n```\n\n如果你需要向 Lambda 传递多个参数，可以通过将它们括在括号中来实现，例如：\n\
    \n```csharp\ndelegate string StringConverter(string s, int i);\n\nStringConverter\
    \ converter = delegate (string s, int i)\n{\n    return s.ToLower() + i.ToString();\n\
    };\n```\n\n## 16.5 不传递参数\n\n另一种，不接受参数的 Lambda 使用空括号声明：\n\n```csharp\ndelegate\
    \ string GetGreeting();\n\nGetGreeting greeting = () => \"Hello World\";\n```\n\
    \n## 16.6 局部函数\n\n局部函数在许多方面与 Lambda 表达式相似，但也有一些区别。它们是在方法内部声明的命名方法。例如，以下是我们的 `StringConverter`\
    \ 的局部函数：\n\n```csharp\ndelegate string StringConverter(string s);\n\nStringConverter\
    \ converter(string s)\n{\n    return s.ToLower();\n};\n```\n\n由于 Lambda 只包含一个单一表达式，我们可以简化为：\n\
    \n```csharp\nStringConverter converter = s => s.ToLower();\n```\n\n此示例中的关键点是局部函数可以访问局部变量，而这些变量\
    \ Lambda 无法直接访问。\n\n## 16.7 创建 LambdaDemo 项目\n\n为了尝试局部函数，请在 VS Code 中创建一个新的 .NET\
    \ 控制台应用程序，并将其命名为 `LambdaDemo`。创建项目后，编辑 `Program.cs` 文件使其内容如下：\n\n```csharp\nnamespace\
    \ LambdaDemo\n{\n    internal class Program\n    {\n        static void Main(string[]\
    \ args)\n        {\n            ConvertToEuros(10.00);\n        }\n        private\
    \ static void ConvertToEuros(double value)\n        {\n            var exchangeRate\
    \ = 0.5;\n            double USDToEuro(double dollars) => exchangeRate * dollars;\n\
    \            var result = USDToEuro(value);\n            Console.WriteLine(result);\n\
    \        }\n    }\n}\n```\n\n## 16.8 递归局部函数\n\n"
