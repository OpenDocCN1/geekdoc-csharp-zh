    ## 13.9 Static, read-only, and const data members


    In addition to the data member types we have looked at so far, C# also supports
    several additional member types.


    C# static member types (also called class properties) store data values common
    to all object instances of the class. For example, all bank customers would earn
    the same interest rate on a savings account. Therefore, an interestRate member
    would be declared static since it is shared across all object instances of the
    class. Static members are declared using the static keyword. For example:


    public class BankAccount


    {


       private static int interestRate;


    }


    Static members are accessed through the class, not through the object. For example,
    we would change the interestRate member for all object instances by referencing
    the BankAccount class as follows:


    BankAccount.interestRate = 10;


    For data members that must not be modified the const and readonly keywords are
    provided by C#. Both achieve the same objective of preventing the value assigned
    to a data member from being changed after it has been declared. The value of a
    const or readonly member must be assigned at creation time:


    public readonly int daysInWeek = 7;


    ## 13.10 Instantiating an object from a C# class


    Creating an object from the class ‘blueprint’ is called instantiation. The first
    step is to create an object variable of the required object type. An instance
    of the object is then created using the new keyword and assigned to the object
    variable:


    BankAccount custAccount;


    custAccount = new BankAccount();


    It is also possible to declare the object variable and assign the object in a
    single statement:


    BankAccount custAccount = new BankAccount();


    Alternatively, since we have declared custAccount as being of type BankAccount,
    we can let the compiler infer that we are requesting an new BankAccount instance
    as follows:


    BankAccount custAccount = new();


    Edit the Program.cs file and add the following code:


    using ObjectDemo;


    BankAccount custAccount = new();


    Having created an instance of our BankAccount class the next step is to learn
    how to access the members of the class.


    ## 13.11 Accessing C# object members


    Now that we know how to write a class and instantiate objects from it, we need
    to know how to access its members.


    First, you will recall that we declared some members as being public and others
    as being private. The public methods are fully accessible from outside the object.
    This is achieved using something called dot notation.


    Dot notation is a mechanism by which object members may be accessed by specifying
    the object and member names separated by a dot (.). For example, to access the
    accountName member of an object named custAccount we would reference this member
    using custAccount.accountName.


    Modify the Program.cs file as follows to access the public member properties of
    the BankAccount object using dot notation:


    BankAccount custAccount = new();


    custAccount.AccountName = "John Smith";


    custAccount.AccountNumber = 53211;


    Console.WriteLine($"Customer Name is {custAccount.AccountName}");


    Console.WriteLine($"Account Number = {custAccount.AccountNumber}");


    After creating an instance of our BankAccount class, the above code assigns values
    to two private fields via our object’s AccountName and AccountNumber properties.
    The code then references these properties to display the customer name and account
    number values.


    Run the app and check that the output reads as follows:


    Customer Name is John Smith


    Account Number = 53211


    In the above example, we created the custAccount object, then used dot notation
    to assign a customer name and account number to the instance. When properties
    are initialized immediately after object creation, the code can be simplified
    as follows to perform the object instantiation and property initialization in
    a single operation:


    BankAccount custAccount = new()


    {


        AccountName = "John Smith",


        AccountNumber = 53211


    };


    ## 13.12 Adding methods to a C# class


    Class methods are essentially code routines that can be called to perform specific
    tasks within the class’s context.


    Methods come in two forms: static methods (also called class methods) and instance
    methods. Static methods operate at the class level, such as creating a new class
    instance. On the other hand, instance methods operate only on the instances of
    a class (for example, performing an arithmetic operation on two member variables
    and returning the result).


    Instance methods are declared within the opening and closing braces of the class
    to which they belong and are declared using the standard C# method declaration
    syntax.


    Static methods are declared like instance methods, except that the static keyword
    precedes the declaration.


    For example, edit the BankAccount class and add a method to display the customer’s
    name as follows:


    public class BankAccount


    {


        private string _accountName = "";


        private int _accountNumber = 0;


    .


