    ## 15.3 Using delegates


    With a delegate declared, we can use it to store references to methods. Delegate
    instances are created using the new keyword, passing through the method to be
    referenced, for example:


    public delegate string MyDelegate (string s);


    MyDelegate delegate1 = new MyDelegate(GetLength);


    MyDelegate delegate2 = new MyDelegate(CustomerCount);


    In the above code, we have created two delegate instances, each pointing to one
