    ## 11.10 Summary


    Looping control flow is a fundamental feature found in most programming languages
    used to perform tasks that must be executed multiple times. In this chapter, we
    have covered the C# for and foreach statements and how they are utilized to execute
    tasks a specified number of times. Additionally, we have explored nested loops
    and explained how to manage loop behavior using the break and continue statements.


    ## 12\. C# Looping with do and while Statements


    With the topic of constructing loops using the C# for statement covered, this
    chapter aims to introduce two more looping options: the while and do ... while
    constructs.


    The C# for loop described in the previous chapter works well when you know in
    advance how many times a particular task needs to be repeated in a program. However,
    there will be instances where code needs to be repeated until a specific condition
    is met, with no way of knowing how many repetitions will be needed to meet those
    criteria. While it is possible to achieve this with a for loop containing a break
    statement, C# provides a better alternative in the form of the while loop (yet
    another construct inherited by C# from the C Programming Language).


    ## 12.1 The C# while loop


    Essentially, the while loop repeats a set of tasks until a specified condition
    is met. The while loop syntax is defined as follows:


    while (<condition>) {</condition>


        // C# statements go here


    }


    In the above example, <condition>is an expression that will return either true
    or false, and the // C# statements go here comment represents the C# code to be
    executed while the condition expression continues to evaluate to true. For example:</condition>


    int myCount = 0;


    while ( myCount < 100 ) {


        myCount++;


    }


    Console.WriteLine($"myCount = {myCount}");


    In the above example, the while expression will evaluate whether the myCount variable
    is less than 100\. If it is already greater than 100, the code in the braces is
    skipped, and the loop exits without performing any tasks.


    If, on the other hand, myCount is not greater than 100, the code in the braces
    is executed, and the loop returns to the while statement and repeats the evaluation
    of myCount. This process repeats until the value of myCount exceeds 100, at which
    point the loop exits.


    ## 12.2 C# do … while loops


    It is often helpful to think of the do … while loop as an inverted while loop.
    The while loop evaluates an expression before executing the code in the loop’s
    body. The code is not executed if the expression evaluates to false on the first
    check. The do … while loop, on the other hand, is provided for situations where
    you know that the code contained in the loop’s body will always need to be executed
    at least once. For example, you may want to keep stepping through the items in
    an array until a specific item is found. You know that you have to at least check
    the first item in the array to have any hope of finding the entry you need. The
    syntax for the do … while loop is as follows:


    do


    {


        // C# statements here


    } while (<conditional expression="">);</conditional>


    In the do … while example below, the loop will continue until the value of a variable
    named i equals 0:


    int i = 10;


    do {


        i--;


        Console.WriteLine($"i = {i}");


    } while (i > 0);


