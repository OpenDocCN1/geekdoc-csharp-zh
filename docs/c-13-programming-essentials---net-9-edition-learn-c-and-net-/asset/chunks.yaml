    \n![](images/image-949XAYQJ.jpg)\n\n## 20.7 Summary\n\nC# structures and classes\
    \ provide a mechanism for creating instances that define properties, store values,\
    \ and define methods. Although the two mechanisms appear similar, significant\
    \ behavioral differences exist, especially when structure and class instances\
    \ are copied or passed to a method. Classes are categorized as reference-type\
    \ instances, while structures are value-type. When a structure instance is copied\
    \ or passed, an entirely new copy of the instance is created containing its own\
    \ data. On the other hand, class instances are passed and copied by reference,\
    \ with each reference pointing to the same class instance. Other features unique\
    \ to classes include support for inheritance and finalizers.\n\n## 21. C# Tuple\
    \ Type\n\nIn the “C# Methods” chapter, we learned how to create methods in C#\
    \ that can pass arguments and return results. This chapter will focus on the C#\
    \ tuple type and understand how it combines collections of values into a single\
    \ entity. Once created, a tuple can be passed from one method to another while\
    \ allowing methods to return multiple results in a single return value. Tuples\
    \ can be created with minimal coding and can store data of any type. Additionally,\
    \ the values stored within a tuple are not required to be the same type.\n\n###\
    \ 21.1 Creating the TupleDemo project\n\nTo try out the C# tuple type, launch\
    \ `VS Code`, open your “C# Essentials” workspace folder and create a new .NET\
    \ Console App project named `TupleDemo`.\n\n## 21.2 Declaring a Tuple\n\nWhen\
    \ we declare a tuple we need to provide it with the values to be stored and, optionally,\
    \ the corresponding value types. The syntax for declaring a tuple is as follows:\n\
    \n`(<type1>, <type2>, ...) <tuplename>= (<value1>, <value2>, ...)`\n\nFor example,\
    \ modify the `Program.cs` file as follows, to add the top-level statements, the\
    \ `Main()` method, and a method named `GetProductData()` that contains a tuple\
    \ declaration:\n\n```csharp\nnamespace TupleDemo\n{\n    internal class Program\n\
    \    {\n        static void Main(string[] args)\n        {\n            GetProductData();\n\
    \        }\n        private static void GetProductData()\n        {\n        \
    \    (int, string, double) myTuple = (10, \"Refrigerator\", 432.43);\n       \
    \ }\n    }\n}\n```\n\nIf you prefer not to declare the type of each tuple value,\
    \ the `var` keyword may be used to tell the compiler to infer the value types:\n\
    \n`var myTuple = (10, \"Refrigerator\", 432.43);`\n\n## 21.3 Accessing tuple values\n\
    \nThe elements of a tuple can be accessed using several different techniques.\
    \ A specific tuple value may be accessed using dot notation to access `Item <n>`\
    \ where `<n>` is the number of the item (with the first value being at position\
    \ 1). The code below, for example, extracts item 2 from the tuple, assigns it\
    \ to a variable and writes it to the console:\n\n```csharp\nprivate static void\
    \ GetProductData()\n{\n    var myTuple = (10, \"Refrigerator\", 432.43);\n   \
    \ Console.WriteLine(myTuple.Item2);\n}\n```\n\nAn alternative to accessing tuple\
    \ elements by number is to use field names.\n\n## 21.4 Field names\n\nWhen creating\
    \ a tuple, you can assign a name to each value. When using type inference to initialize\
    \ a tuple, the field names are placed before each value:\n\n`(Count: 10, Product:\
    \ \"Refrigerator\", Price: 432.43)`\n\nOnce field names have been assigned, the\
    \ corresponding values can be accessed as demonstrated below:\n\n```csharp\nprivate\
    \ static void GetProductData()\n{\n    var myTuple = (Count: 10, Product: \"Refrigerator\"\
    , Price: 432.43);\n    Console.WriteLine(myTuple.Price);\n    Console.WriteLine(myTuple.Product);\n\
    \    Console.WriteLine(myTuple.Count);\n}\n```\n\nThe following output will appear\
    \ when the app runs:\n```\nPrice = 432.43\nProduct = Refrigerator\nQuantity =\
    \ 10\n```\n\n## 21.5 Returning tuples from methods\n\nTuples are particularly\
    \ useful for returning multiple results from a method. For example, suppose that\
    \ instead of displaying information, we need our `GetProductData()` method to\
    \ return the data. To achieve this, the type of each tuple needs to be included\
    \ in the method return declaration:\n\n```csharp\nprivate static (int, string,\
    \ double) GetProductData()\n{\n    return (10, \"Refrigerator\", 432.43);\n}\n\
    ```\n\nAlternatively, the individual values can be returned by placing them in\
    \ parentheses after the `return` statement:\n\n```csharp\nprivate static (int,\
    \ string, double) GetProductData()\n{\n    return (10, \"Refrigerator\", 432.43);\n\
    }\n```\n\nWhen called, the returned tuple can be assigned to a variable, and the\
    \ values accessed using dot notation:\n\n```csharp\nstatic void Main(string[]\
    \ args)\n{\n    var myTuple = GetProductData();\n    Console.WriteLine($\"Price\
    \ = {myTuple.Item1}\");\n    Console.WriteLine($\"Product = {myTuple.Item2}\"\
    );\n    Console.WriteLine($\"Quantity = {myTuple.Item3}\");\n}\n```\n\nIf you\
    \ prefer to use field names instead of the default `Item` names, one option is\
    \ to include the field names and types as:\n\n```csharp\nstatic void Main(string[]\
    \ args)\n{\n    (int Count, string Product, double Price) myTuple = GetProductData();\n\
    \    Console.WriteLine($\"Price = {myTuple.Price}\");\n    Console.WriteLine($\"\
    Product = {myTuple.Product}\");\n    Console.WriteLine($\"Quantity = {myTuple.Count}\"\
    );\n}\n```\n\nBy far, the most convenient way to assign each tuple value to a\
    \ named variable is to use type inference:\n\n`var (count, product, price) = GetProductData();`\n\
    \nUsing this approach, we can now access the variables directly without needing\
    \ first to extract them from the tuple:\n\n```csharp\nstatic void Main(string[]\
    \ args)\n{\n    var (count, product, price) = GetProductData();\n    Console.WriteLine($\"\
    Price = {price}\");\n    Console.WriteLine($\"Product = {product}\");\n    Console.WriteLine($\"\
    Quantity = {count}\");\n}\n```\n"
