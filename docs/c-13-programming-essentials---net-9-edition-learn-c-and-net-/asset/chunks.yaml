  trans: "\n\n## 23.2 创建 ExceptionDemo 项目\n\n启动 VS Code，打开你的“C# Essentials”工作区文件夹，并创建一个名为\
    \ `ExceptionDemo` 的 .NET 控制台应用程序。项目准备好后，按照以下方式修改 `Program.cs` 文件：\n\n```csharp\n\
    namespace ExceptionDemo\n{\n    internal class Program\n    {\n        static\
    \ void Main(string[] args)\n        {\n        }\n    }\n}\n```\n\n该项目是一个控制电机的假设应用程序。在通电诊断期间，该程序会读取当前电压，如果超过\
    \ 500 伏，则防止电机启动。在 `Program.cs` 文件中，添加一个执行电压检查的方法并在 `Main()` 方法中调用它：\n\n```csharp\n\
    namespace ExceptionDemo\n{\n    internal class Program\n    {\n        static\
    \ void Main(string[] args)\n        {\n            VoltageCheck(501);\n      \
    \  }\n        private static void VoltageCheck(int voltage)\n        {\n     \
    \       if (voltage > 500)\n            {\n                Console.WriteLine(\"\
    Voltage overload.\");\n            }\n            else\n            {\n      \
    \          Console.WriteLine(\"Voltage is safe.\");\n            }\n        }\n\
    \    }\n}\n```\n\n运行该程序并检查控制台中是否出现了电压过载消息：\n\n`Voltage overload.`\n\n电压过载是一个严重问题，因此我们不想仅仅显示一条消息并希望用户不要启动电机。相反，我们希望强制程序采取预防措施。为了做到这一点，我们将抛出一个异常。\n\
    \n## 23.3 抛出异常\n\n抛出异常的第一步是选择异常类型。正如我们之前提到的，异常可以使用许多内置类型之一或你创建的自定义类型来抛出。我们将在本章节后面的部分介绍自定义异常类型，因此现在我们将使用\
    \ `ArgumentOutOfRangeException` 类型。这种异常类型通常在传递给方法的参数超出接受范围时抛出（在我们的案例中，是电压读数超过\
    \ 500 伏）。\n\n接下来，创建并初始化异常类型的实例。所有异常类型都必须初始化一个解释问题原因的消息。某些类型（包括 `ArgumentOutOfRangeException`）还需要指定引起异常的参数名称（在我们的案例中，是\
    \ `voltage`）。利用这些信息，我们可以如下创建一个新异常：\n\n`ArgumentOutOfRangeException voltageException\
    \ = new(nameof(voltage), \"Voltage exceeds safety parameters.\");`\n\n使用 `throw`\
    \ 语句后跟异常对象来抛出异常，如下：\n\n```csharp\nthrow voltageException;\n```\n\n在上面的示例中，我们分两个步骤创建和抛出异常。然而，这个序列通常在单次操作中完成：\n\
    \n```csharp\nthrow new ArgumentOutOfRangeException(nameof(voltage), \"Voltage\
    \ exceeds safety parameters.\");\n```\n\n修改 `VoltageCheck()` 方法以抛出异常，如下：\n\n```csharp\n\
    private static void VoltageCheck(int voltage)\n{\n    if (voltage > 500)\n   \
    \ {\n        throw new ArgumentOutOfRangeException(nameof(voltage),\n        \
    \                                    \"Voltage exceeds safety parameters.\");\n\
    \    }\n    else\n    {\n        Console.WriteLine(\"Safe Voltage\");\n    }\n\
    }\n```\n\n参考控制台，将出现以下输出：\n\n`Unhandled exception. System.ArgumentOutOfRangeException:\
    \ Voltage exceeds safety parameters. (Parameter 'voltage')`\n`   at ExceptionDemo.Program.VoltageCheck(Int32\
    \ voltage) in Program.cs:line`\n\n## 23.4 处理异常\n\n在 C# 中，异常使用 `try-catch` 语句进行处理。为了防止程序崩溃，我们必须在以下位置添加\
    \ `try`：\n\n```csharp\nstatic void Main(string[] args)\n{\n    try\n    {\n  \
    \      VoltageCheck(501);\n    }\n    catch (ArgumentOutOfRangeException)\n  \
    \  {\n        Console.WriteLine(\"Voltage overload\");\n    }\n}\n```\n\n到目前为止，我们已经实现了\
    \ `catch` 块。也可以访问异常对象，例如：\n\n```csharp\ntry\n{\n    VoltageCheck(501);\n}\ncatch\
    \ (Exception ex)\n{\n    Console.WriteLine(ex.Message);\n}\n```\n\n当程序运行时，将出现以下输出：\n\
    \n`Voltage overload.`\n\n接下来的示例代码：\n\n```csharp\ntry\n{\n    VoltageCheck(501);\n\
    }\ncatch (ArgumentOutOfRangeException ex)\n{\n    Console.WriteLine(\"Voltage\
    \ overload\");\n}\n```\n\n这对于捕获多种类型非常有用。例如：\n\n```csharp\ntry\n{\n    VoltageCheck(501);\n\
    }\ncatch (ArgumentOutOfRangeException)\n{\n    Console.WriteLine(\"Voltage overload\"\
    );\n}\nelse if (NullException)\n{\n    Console.WriteLine(\"Null reference\");\n\
    }\n```\n\n## 23.5 使用 `when` 创建异常过滤器\n\n在上面的示例中，我们使用 `when` 来控制异常。在 catch 块中使用\
    \ `when` 的语法为：\n\n```csharp\ntry\n{\n}\ncatch (exception) when (boolean)\n{\n\
    }\n```\n\n只有当 `when` 后面的布尔表达式求值为真时，catch 块中的代码才会执行。这对于捕获特定类型特别有用。例如，下面的代码：\n\n\
    ```csharp\ncatch (Exception ex) when (ex is ArgumentOutOfRangeException || ex\
    \ is NullException)\n```\n\n异常过滤器可以包含任何布尔表达式，无论是否带有类型匹配。下面的 catch 块仅在异常类型为 `ArgumentException`\
    \ 且 `motorTemp` 超过 102 时才会执行：\n\n```csharp\ntry\n{\n    VoltageCheck(501);\n}\n\
    catch (Exception ex) when (ex is ArgumentOutOfRangeException && motorTemp > 102)\n\
    ```\n\n## 23.6 使用 `finally` 块\n\n`finally` 块的目的是在 `try-catch` 语句结束之前指定执行的代码，通常用于执行清理任务，例如：\n\
    \n```csharp\ntry\n{\n    VoltageCheck(501);\n}\ncatch (Exception ex)\n{\n    Console.WriteLine(ex.Message);\n\
    }\nfinally\n{\n    Console.WriteLine(\"Resetting system.\");\n}\n```\n\n## 23.7\
    \ 使用 `try-finally` 语句\n\n根据之前的经验，我们知道未处理的异常会导致程序崩溃，但尚未解释异常在哪里被捕获。本章涵盖的示例暗示异常必须在发生的地方使用\
    \ `try-catch` 语句进行处理。但在实践中，情况并非如此。在深入探讨此主题之前，将运行程序的执行路径视为方法调用的层次结构，从 `Main()`\
    \ 方法开始是有帮助的。\n\n考虑这种情况：`Main()` 方法调用 `Method A`，随后它又调用 `Method B` 和 `Method C`。然后\
    \ `Method C` 调用 `Method D`，以此类推。这种方法调用的层次结构被称为调用树或调用层次结构。在图示中，我们的理论调用层次结构可能如图\
    \ 23-1 所示：\n\n![](img/image-N29EWYM5.png)\n\n图 23-1\n\n假设在 `Method D` 中抛出了异常。该异常将沿着调用层次结构向上传播，直到被处理。如果异常在到达\
    \ `Main()` 方法之前未被捕获，则程序将会崩溃。这意味着即使异常是在 `Method D` 中抛出的，我们也可以在包括 `Main()` 在内的任何直接祖先方法中处理它，以防止程序崩溃。\n\
    \n"
- fmt: "\nTo experience this firsthand, add an interim method named `StartMotor()`\
    \ between the `Main()` and `VoltageCheck()` methods and remove the `try-catch`\
    \ statement:\n\n```csharp\nnamespace ExceptionDemo\n{\n    internal class Program\n\
    \    {\n        static void Main(string[] args)\n        {\n            StartMotor();\n\
    \        }\n        private static void StartMotor()\n        {\n            VoltageCheck(501);\n\
    \            Console.WriteLine(\"Clean up after check.\");\n        }\n      \
    \  private static void VoltageCheck(int voltage)\n        {\n            if (voltage\
    \ > 500)\n            {\n                throw new ArgumentOutOfRangeException(nameof(voltage),\n\
    \                    \"Voltage exceeds safety parameters.\");\n            }\n\
    \            else\n            {\n                Console.WriteLine(\"Safe Voltage\"\
    );\n            }\n        }\n    }\n}\n```\n\nSince the exception is not caught\
    \ in any of the three methods, the app will crash when it runs. We can, however,\
    \ catch the error by adding a `try-catch` statement to `VoltageCheck()`, `StartMotor()`\
    \ or `Main()`. For this example, use a `try-catch` statement to call `StartMotor()`\
    \ from within the `Main()` method:\n\n```csharp\nstatic void Main(string[] args)\n\
    {\n    try\n    {\n        StartMotor();\n    }\n    catch (Exception ex) {\n\
    \        Console.WriteLine(ex.Message);\n    }\n}\n```\n\nRerun the app and confirm\
    \ that the exception propagated up to the `Main()` method and was caught and handled:\n\
    \n`Voltage exceeds safety parameters. (Parameter 'voltage')`\n\nNote that the\
    \ above console output does not perform the cleanup operation after the voltage\
    \ check. As currently implemented, `StartMotor()` will be unaware that the voltage\
    \ check threw an exception and any code in `StartMotor()` after the `VoltageCheck()`\
    \ will be skipped and control returned immediately to `Main()`. Suppose, however,\
    \ that `StartMotor()` needs to perform the cleanup after the voltage check, regardless\
    \ of whether an exception was thrown. We can achieve this behavior using a `try-finally`\
    \ statement:\n\n```csharp\nprivate static void StartMotor()\n{\n    try\n    {\n\
    \        VoltageCheck(501);\n    }\n    finally\n    {\n        Console.WriteLine(\"\
    Clean up whether or not voltage is safe.\");\n    }\n}\n```\n\nCompile and run\
    \ the app once more and verify that the cleanup occurs even when the exception\
    \ is thrown:\n\n`Clean up whether or not voltage is safe.`\n`Voltage exceeds safety\
    \ parameters. (Parameter 'voltage')`\n\n## 23.8 Re-throwing exceptions\n\nSometimes\
    \ an exception needs to be caught at multiple levels of the call hierarchy. This\
    \ is achieved by re-throwing the exception after it has been caught so that it\
    \ continues to pass upward in the hierarchy. Exceptions are re-thrown using the\
    \ `throw` statement in the catch body as outlined below:\n\n```csharp\nstatic\
    \ void Main(string[] args)\n{\n    try\n    {\n        StartMotor();\n    }\n\
    \    catch (Exception ex) {\n        Console.WriteLine(\"Caught in Main() \" +\
    \ ex.Message);\n    }\n}\nprivate static void StartMotor()\n{\n    try\n    {\n\
    \        VoltageCheck(501);\n    }\n    catch (Exception ex) {\n        Console.WriteLine(\"\
    Caught in StartMotor \" + ex.Message);\n        throw;\n    }\n    finally\n \
    \   {\n        Console.WriteLine(\"Clean up or not voltage is safe.\");\n    }\n\
    }\n```\n\nRun the app and check the console to verify that the re-throw worked\
    \ and the exception was caught by both methods:\n\n`StartMotor(): Voltage exceeds\
    \ safety parameters. (Parameter 'voltage')`\n`Clean up or not voltage is safe.`\n\
    `Main(): Voltage exceeds safety parameters. (Parameter 'voltage')`\n\n## 23.9\
    \ Creating exception types\n\nSo far, this chapter has used built-in exception\
    \ types to demonstrate how to throw and catch exceptions in C#. However, it will\
    \ sometimes make more sense to create a custom exception than using one of the\
    \ predefined types. Custom types are derived from the `Exception` class and should\
    \ include constructors and parameters if required. The type name should also end\
    \ in “Exception”. The following code declares a custom exception for high-voltage\
    \ errors in our app:\n\n```csharp\nclass HighVoltageException : Exception\n{\n\
    \    public HighVoltageException()\n    {\n    }\n    public HighVoltageException(string\
    \ message)\n        : base(message)\n    {\n    }\n    public HighVoltageException(string\
    \ message, Exception inner)\n        : base(message, inner)\n    {\n    }\n}\n\
    ```\n\nOnce declared, the exception can be thrown as follows:\n\n`throw new HighVoltageException(\"\
    Voltage exceeds safety parameters.\");`\n\nThe `HighVoltageException` type does\
    \ not contain properties, so an instance can be created with only the message\
    \ string:\n\n`throw new HighVoltageException(\"Voltage exceeds safety parameters.\"\
    );`\n\nWe can also extend the type declaration to include a property to record\
    \ the voltage level when the exception occurred:\n\n```csharp\nclass HighVoltageException\
    \ : Exception\n{\n    public int Volts;\n    public HighVoltageException()\n \
    \   {\n    }\n    public HighVoltageException(string message)\n        : base(message)\n\
    \    {\n    }\n    public HighVoltageException(string message, Exception inner)\n\
    \        : base(message, inner)\n    {\n    }\n    public HighVoltageException(string\
    \ message, int Volts)\n        : base(message)\n    {\n        this.Volts = Volts;\n\
    \    }\n}\n```\n\nA `HighVoltageException` instance can now be created with a\
    \ message string and the voltage value that triggered the exception:\n\n```csharp\n\
    private static void VoltageCheck(int voltage)\n{\n    if (voltage > 500)\n   \
    \ {\n        throw new HighVoltageException(\"Voltage exceeds safety parameters.\"\
    , voltage);\n    }\n    else\n    {\n        Console.WriteLine(\"Safe Voltage\"\
    );\n    }\n}\n```\n\nException properties can be accessed from within catch blocks\
    \ in the same way as the message property. In the following example, the `Volts`\
    \ property is included in the notification text and used to make a decision based\
    \ on the voltage level:\n\n```csharp\ntry\n{\n    StartMotor();\n}\ncatch (HighVoltageException\
    \ ex)\n{\n    Console.WriteLine(ex.Message);\n    Console.Write(\"Current voltage:\
    \ {ex.Volts}\");\n    if (ex.Volts < 510)\n    {\n        // Wait and retry\n\
    \    }\n    else\n    {\n        // Critical. Shutdown system\n    }\n}\n```\n\
    \n## 23.10 Take the knowledge test\n\nClick the link below or scan the QR code\
    \ to test your knowledge and understanding of C# exception handling:\n\n[https://www.answertopia.com/hy8t](https://www.answertopia.com/hy8t)\n\
    \n## 23.11 Summary\n\nException handling in C# ensures that programs deal with\
    \ errors effectively by allowing code to catch, handle, and respond to problems\
    \ without crashing. Exceptions are “thrown” when a method encounters an error\
    \ that prevents it from proceeding. Each exception has a specific type which provides\
    \ information about the nature of the error. In addition to predefined exception\
    \ types like `ArgumentOutOfRangeException`, custom exception types can be created\
    \ when more specific error details are needed. Exceptions are handled using `try-catch`\
    \ blocks. The code that may throw an exception is placed inside the `try` block,\
    \ while the `catch` block contains code to handle the exception if one is thrown.\
    \ The `catch` block can access details about the exception, and in cases where\
    \ multiple types of exceptions may occur, specific exception types can be handled\
    \ separately using filtering. The `finally` block can also be used to execute\
    \ code, such as cleaning up resources, whether or not an exception occurs.\n\n\
    ##24. Asynchronous Programming in C#\n\nAsynchronous programming allows software\
    \ to execute multiple tasks simultaneously. This means tasks like downloading\
    \ images or processing large amounts of data can be completed faster than if performed\
    \ sequentially. Multi-tasking also provides a smoother user experience by allowing\
    \ time-consuming operations to be performed in the background without impacting\
    \ the app’s responsiveness.\n"
  raw: 'To experience this firsthand, add an interim method named StartMotor() between
    the Main() and VoltageCheck() methods and remove the try-catch statement:


    namespace ExceptionDemo


    {


        internal class Program


        {


            static void Main(string[] args)


            {


    StartMotor();


            }


    private static void StartMotor()


            {


                VoltageCheck(501);


                Console.WriteLine("Clean up after check.");


            }


            private static void VoltageCheck(int voltage)


            {


                if (voltage > 500)


                {


                    throw new ArgumentOutOfRangeException(nameof(voltage),


                                        "Voltage exceeds safety parameters.");


                }


                else


                {


                    Console.WriteLine("Safe Voltage");


                }


            }


        }


    }


    Since the exception is not caught in any of the three methods, the app will crash
    when it runs. We can, however, catch the error by adding a try-catch statement
    to VoltageCheck(), StartMotor() or Main(). For this example, use a try-catch statement
    to call StartMotor() from within the Main() method:


    static void Main(string[] args)


    {


        try


        {


            StartMotor();


        }


        catch (Exception ex) {


            Console.WriteLine(ex.Message);


        }


    }


    Rerun the app and confirm that the exception propagated up to the Main() method
    and was caught and handled:


    Voltage exceeds safety parameters. (Parameter ''voltage'')


    Note that the above console output does not perform the cleanup operation after
    the voltage check. As currently implemented, StartMotor() will be unaware that
    the voltage check threw an exception and any code in StartMotor() after the VoltageCheck()
    will be skipped and control returned immediately to Main(). Suppose, however,
    that StartMotor needs to perform the cleanup after the voltage check, regardless
    of whether an exception was thrown. We can achieve this behavior using a try-finally
    statement:


    private static void StartMotor()


    {


    try


        {


            VoltageCheck(501);


        }


     finally


        {


            Console.WriteLine("Clean up whether or not voltage is safe.");


        }


    }


    Compile and run the app once more and verify that the cleanup occurs even when
    the exception is thrown:


    Clean up whether or not voltage is safe.


    Voltage exceeds safety parameters. (Parameter ''voltage'')


    ## 23.8 Re-throwing exceptions


    Sometimes an exception needs to be caught at multiple levels of the call hierarchy.
    This is achieved by re-throwing the exception after it has been caught so that
    it continues to pass upward in the hierarchy. Exceptions are re-thrown using the
    throw statement in the catch body as outlined below:


    static void Main(string[] args)


    {


        try


        {


            StartMotor();


        }


        catch (Exception ex) {


    Console.WriteLine("Caught in Main() " + ex.Message);


        }


    }


    private static void StartMotor()


    {


        try


        {


            VoltageCheck(501);


        }


        catch (Exception ex)


        {


    Console.WriteLine("Caught in StartMotor " + ex.Message);


            throw;


    }


        finally


        {


            Console.WriteLine("Clean up whether or not voltage is safe.");


        }


    }


    Run the app and check the console to verify that the re-throw worked and that
    the exception was caught by both methods:


    StartMotor(): Voltage exceeds safety parameters. (Parameter ''voltage'')


    Clean up whether or not voltage is safe.


    Main(): Voltage exceeds safety parameters. (Parameter ''voltage'')


    ## 23.9 Creating custom exception types


    So far, this chapter has used built-in exception types to demonstrate how to throw
    and catch exceptions in C#. However, it will sometimes make more sense to create
    a custom exception type than using one of the predefined types. Custom types are
    derived from the Exception class and should include three constructors and parameters
    if required. The type name should also end in “Exception”. The following code
    declares a custom exception type for high-voltage errors in our example app:


    public class HighVoltageException : Exception


    {


        public HighVoltageException()


        {


        }


        public HighVoltageException(string message)


            : base(message)


        {


        }


        public HighVoltageException(string message, Exception inner)


            : base(message, inner)


        {


        }


    }


    Once declared, the exception can be thrown as follows:


    throw new HighVoltageException("Voltage exceeds safety parameters.");


    The HighVoltageException type does not contain properties, so an instance can
    be created with only the message string:


    throw new HighVoltageException("Voltage exceeds safety parameters.");


    We can also extend the type declaration to include a property to record the voltage
    level when the exception occurred:


    public class HighVoltageException : Exception


    {


    public int Volts;


        public HighVoltageException()


        {


        }


        public HighVoltageException(string message)


            : base(message)


        {


        }


        public HighVoltageException(string message, Exception inner)


            : base(message, inner)


        {


        }


        public HighVoltageException(string message, int Volts)


            : base(message)


        {


            this.Volts = Volts;


        }


    }


    A HighVoltageException instance can now be created with a message string and the
    voltage value that triggered the exception:


    private static void VoltageCheck(int voltage)


    {


        if (voltage > 500)


        {


            throw new HighVoltageException("Voltage exceeds safety parameters.",


                                                               voltage);


        }


        else


        {


            Console.WriteLine("Safe Voltage");


        }


    }


    Exception properties can be accessed from within catch blocks in the same way
    as the message property. In the following example, the Volts property is included
    in the notification text and used to make a decision based on the voltage level:


    try


    {


        StartMotor();


    }


    catch (HighVoltageException ex)


    {


        Console.WriteLine(ex.Message);


        Console.Write("Current voltage: {ex.Volts}");


        if (ex.Volts < 510)


        {


            // Wait and retry


        }


        else


        {


            // Critical. Shutdown system


        }


    }


    23.10 Take the knowledge test


    Click the link below or scan the QR code to test your knowledge and understanding
    of C# exception handling:


    [https://www.answertopia.com/hy8t](https://www.answertopia.com/hy8t)


    ![](images/image-9AXGG490.jpg)


    ## 23.11 Summary


    Exception handling in C# ensures that programs deal with errors effectively by
    allowing code to catch, handle, and respond to problems without crashing. Exceptions
    are “thrown” when a method encounters an error that prevents it from proceeding.
    Each exception has a specific type which provides information about the nature
    of the error. In addition to predefined exception types like ArgumentOutOfRangeException,
    custom exception types can be created when more specific error details are needed.
    Throwing an exception stops the normal flow of execution and transfers control
    to exception-handling code.


    Exceptions are handled using try-catch blocks. The code that may throw an exception
    is placed inside the try block, while the catch block contains code to handle
    the exception if one is thrown. The catch block can access details about the exception,
    and in cases where multiple types of exceptions may occur, specific exception
    types can be handled separately using filtering. The finally block can also be
    used to execute code, such as cleaning up resources, whether or not an exception
    occurs.


    ## 24\. Asynchronous Programming in C#


    Asynchronous programming allows software to execute multiple tasks simultaneously.
    This means tasks like downloading images or processing large amounts of data can
    be completed faster than if performed sequentially. Multi-tasking also provides
    a smoother user experience by allowing time-consuming operations to be performed
    in the background without impacting the app’s responsiveness.'
