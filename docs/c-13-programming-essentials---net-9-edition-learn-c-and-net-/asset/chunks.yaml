    \ `Array.Sort()`、`Array.Reverse()` 和 `Array.Clear()` 方法分别对数组进行排序、反转和清空。\n\n##\
    \ 27. C# List 集合\n\n在之前的章节中，我们看了 C# 数组。虽然数组在许多任务中用，但在功能和灵活性方面开始显得过时。C# 集合类提供了更高级的机制来收集对象组。\n\
    \n## 27.1 创建 CollectionDemo 项目\n\n启动 VS Code，打开你的“C# Essentials”工作空间文件夹并创建一个名为\
    \ `CollectionDemo` 的新 .NET 控制台应用程序。\n\n创建项目后，打开 `Program.cs` 文件并使用它尝试本章后续部分的示例。\n\
    \n## 27.2 介绍 C# 集合类\n\nC# 集合类专门设计用于对对象进行分组并执行任务。C# 提供了多种集合类，我们将在接下来的章节中查看一些关键类。\n\
    \n## 27.3 使用 List 创建 C# 列表集合\n\n`List<t>` 类的属性与 C# 数组非常相似。该类相比数组的一个关键优势是，它可以随着所存储对象数量的变化而动态增长或缩小。\n\
    \n创建 `List<type>` 集合的语法如下，其中 `type` 被替换为存储在列表中的数据类型：\n\n`List<type>name = new\
    \ List<type>();`\n\n或者，上述语法可以简化为：\n\n`List<type>name = [];`\n\n考虑到上述语法，我们可以使用以下两个语句之一，创建一个名为\
    \ `colorList` 的空 `List<object>`，并配置为存储字符串值：\n\n`List<string>colorList = new List<string>();`\n\
    `List<string>colorList = [];`\n\n## 27.4 向列表添加项\n\n一旦创建了 `List` 实例，就可以调用若干方法来对列表执行任务。其中一种方法是\
    \ `Add()` 方法，正如其名所示，它用于向列表添加项：\n\n```cs\ncolorList.Add(\"Red\");\ncolorList.Add(\"\
    Green\");\ncolorList.Add(\"Yellow\");\ncolorList.Add(\"Purple\");\ncolorList.Add(\"\
    Orange\");\n```\n\n`Add()` 方法将新项添加到列表末尾。要在特定索引插入新项，你需要使用后文 `Insert()` 方法。\n\n\
    ## 27.5 使用多个值初始化列表\n\n在上面的示例中，我们使用 `Add()` 方法逐个向空列表添加项。但如果你需要大量值初始化列表，可能会发现集合初始化器更高效，其语法如下：\n\
    \n`List<string>colorList = [\"Red\", \"Green\", \"Yellow\", \"Purple\", \"Orange\"\
    ];`\n\n## 27.6 访问列表项\n\n列表中的单个项可以使用其索引值访问（注意第一个项为 0，第二个为 1，依此类推）。索引值放在列表名称后的方括号中。例如，访问\
    \ `colorList` 对象的第二个项：\n\n```cs\nConsole.WriteLine(colorList[1]);\n```\n\nOutput:\n\
    Green\n\n列表项的值同样可以使用索引结合赋值运算符（=）进行更改。例如，将 `Yellow` 颜色更改为 `Indigo`，代码如下：\n\n```cs\n\
    Console.WriteLine($\"Color before = {colorList[2]}\");\ncolorList[2] = \"Indigo\"\
    ;\nConsole.WriteLine($\"Color after = {colorList[2]}\");\n```\n\nOutput:\nColor\
    \ before = Yellow\nColor after = Indigo\n\n与数组一样，你还可以构造 `foreach` 循环列出列表中的所有项。例如：\n\
    \n```cs\nforeach (string color in colorList)\n{\n    Console.Write($\"{color}\
    \ \");\n}\n```\n\nOutput:\nRed Green Indigo Purple Orange\n\n## 27.7 从列表中删除项\n\
    \n可以使用 `Remove()` 方法从列表中删除项。该方法接受要删除的值作为参数。例如，要从 `colorList` 对象中删除 `Orange` 字符串，我们可以编写以下代码：\n\
    \n```cs\ncolorList.Remove(\"Orange\");\nforeach (string color in colorList)\n\
    {\n    Console.Write($\"{color} \");\n}\n```\n\nOutput:\nRed Green Indigo Purple\n\
    \n注意 C# 列表可以存储重复项。在存在重复项的情况下，`Remove()` 方法只会删除第一个匹配实例。\n\n## 27.8 向列表中插入项\n\n"
- fmt: "\nPreviously we used the `Add()` method to add items to a list. The `Add()`\
    \ method, however, only adds items to the end of a list. Sometimes it is necessary\
    \ to insert a new item at a specific location in a list. The `Insert()` method\
    \ is provided for this particular purpose.\n\n`Insert()` takes two arguments,\
    \ an integer indicating the index location of the insertion and the item to be\
    \ inserted at that location. For example, to insert an item at location 2 in our\
    \ example list:\n\n```csharp\nList<string>colorList = [\"Red\", \"Green\", \"\
    Yellow\", \"Purple\", \"Orange\"];\ncolorList.Insert(2, \"White\");\n\nforeach\
    \ (string color in colorList)\n{\n    Console.Write($\"{color} \");\n}\n```\n\n\
    Output:\nRed Green White Yellow Purple Orange\n\n## 27.9 Sorting lists in C#\n\
    \nThere is no way to tell C# to automatically sort a list as items are added.\
    \ The items in a list can be sorted into order by calling the `Sort()` method:\n\
    \n```csharp\nList<string>colorList = [\"Red\", \"Green\", \"Yellow\", \"Purple\"\
    , \"Orange\"];\ncolorList.Sort();\n\nforeach (string color in colorList)\n{\n\
    \    Console.Write($\"{color} \");\n}\n```\n\nOutput:\nGreen Orange Purple Red\
    \ Yellow\n\nThe above example uses the C# default comparison delegate to organize\
    \ the new list order. Although beyond the scope of this book, it is worth knowing\
    \ that for more advanced requirements, you can create your own comparison delegate.\n\
    \n## 27.10 Finding items in a C# list\n\nSeveral methods are provided with the\
    \ `List` class for finding items. The most basic method is the `Contains()` method\
    \ which, when called on a list object, returns true if the specified item is located\
    \ in the list, or false if it is not.\n\nThe `IndexOf()` method returns the index\
    \ value of a matching item in a list. For example, the following code sample will\
    \ output a true result indicating the presence of “Red” and the value 2, which\
    \ is the index position of the “Yellow” string:\n\n```csharp\nList<string>colorList\
    \ = [\"Red\", \"Green\", \"Yellow\", \"Purple\", \"Orange\"];\nConsole.WriteLine(colorList.Contains(\"\
    Red\"));\nConsole.WriteLine(colorList.IndexOf(\"Yellow\"));\n```\n\nOutput:\n\
    True\n2\n\nIf the item is not found in the list, a value of `-1` is returned by\
    \ the `IndexOf()` method.\n\nThe `LastIndexOf()` method returns the index value\
    \ of the last item in the list to match the specified item. This is particularly\
    \ useful when a list contains duplicate items:\n\n```csharp\nList<string>colorList\
    \ = [\"Red\", \"Green\", \"Yellow\", \"Purple\", \"Red\"];\nConsole.WriteLine(colorList.LastIndexOf(\"\
    Red\"));\n```\n\nOutput:\n4\n\n## 27.11 Obtaining information about a list\n\n\
    Two properties of the `List<t>` class are helpful in obtaining information about\
    \ a list object. For example, the `Capacity` property can identify how many items\
    \ a collection can store without resizing.\n\nThe `Count` property, however, identifies\
    \ how many items are currently stored in the list. In general, the `Capacity`\
    \ value will match or exceed the current `Count`:\n\n```csharp\nList<string>colorList\
    \ = [\"Red\", \"Green\", \"Yellow\", \"Purple\", \"Orange\"];\nConsole.WriteLine($\"\
    Count = {colorList.Count}\");\nConsole.WriteLine($\"Capacity = {colorList.Capacity}\"\
    );\n```\n\nOutput:\nCount = 5\nCapacity = 5\n\nIn instances where a gap exists\
    \ between `Count` and `Capacity` you can remove excess capacity with a call the\
    \ `TrimExcess()` method:\n\n```csharp\ncolorList.TrimExcess();\n```\n\n## 27.12\
    \ Clearing C# lists\n\nYou can remove all of the items in a list by making a call\
    \ to the `Clear()` method.\n\nThe `Clear()` method removes the items from the\
    \ list and sets the `Count` property to zero. The `Capacity` property, however,\
    \ remains unchanged after the list has been cleared. To remove the capacity of\
    \ a list, follow the `Clear()` method call with a call to `TrimExcess()`:\n\n\
    ```csharp\nList<string>colorList = [\"Red\", \"Green\", \"Yellow\", \"Purple\"\
    , \"Orange\"];\nConsole.WriteLine($\"Count = {colorList.Count}\");\nConsole.WriteLine($\"\
    Capacity = {colorList.Capacity}\");\ncolorList.Clear();\nConsole.WriteLine($\"\
    Count = {colorList.Count}\");\nConsole.WriteLine($\"Capacity = {colorList.Capacity}\"\
    );\ncolorList.TrimExcess();\nConsole.WriteLine($\"Count = {colorList.Count}\"\
    );\nConsole.WriteLine($\"Capacity = {colorList.Capacity}\");\n```\n\nOutput:\n\
    Count = 5\nCapacity = 5\nCount = 0\nCapacity = 5\nCount = 0\nCapacity = 0\n\n\
    ## 27.13 Take the knowledge test\n\nClick the link below or scan the QR code to\
    \ test your knowledge and understanding of C# List collections:\n\n[https://www.answertopia.com/tccy](https://www.answertopia.com/tccy)\n\
    \n![](images/image-F8OS1N2G.jpg)\n\n## 27.14 Summary\n\nC# Collection Classes\
    \ provide advanced mechanisms for grouping objects, with `List` being a key class\
    \ that allows for dynamic resizing. Lists can be created, modified, and queried\
    \ using methods like `Add()`, `Remove()`, `Contains()`, and `IndexOf()`. Additionally,\
    \ lists can be sorted, cleared, and their properties like `Count` and `Capacity`\
    \ can be accessed to obtain information about the list content.\n\n## 28. C# Dictionary\
    \ Collections\n\nC# dictionaries allow data to be stored and managed as key-value\
    \ pairs. Dictionaries fulfill a similar purpose to arrays and lists, except each\
    \ item stored in the dictionary has associated with it a key.\n\n## 28.1 Creating\
    \ the DictionaryDemo\n\nLaunch VS, open the “C#” folder and create a new .NET\
    \ project named DictionaryDemo.\n\n## 28.2 Dictionary initialization\n\nA dictionary\
    \ is a data type designed to hold multiple values. Each item in a dictionary consists\
    \ of a key and an associated value.\n\nAn empty dictionary may be created using\
    \ the following syntax:\n\n```csharp\nDictionary<int, string> name = new Dictionary<int,\
    \ string>();\n```\n\nAlternatively, you can use the `var` keyword:\n\n```csharp\n\
    var movies = new Dictionary<int, string>();\n```\n\nA new dictionary may be initialized\
    \ with a collection initializer using the following syntax (note that we are again\
    \ using implicit typing):\n\n```csharp\nvar movies = new Dictionary<int, string>()\n\
    {\n    { 1212, \"The Godfather\" },\n    { 4433, \"Apocalypse Now\" },\n    {\
    \ 5465, \"The Terminal\" },\n    { 1659, \"Casablanca\" }\n};\n```\n\nIn the above\
    \ instance, the C# compiler will use implicit typing to decide that both the key\
    \ and value elements of the dictionary are strings and prevent values or keys\
    \ of other types from being inserted into the dictionary.\n\n## 28.3 Dictionary\
    \ item count\n\nA count of the items in a dictionary can be obtained by accessing\
    \ the dictionary’s `Count` property:\n\n```csharp\nvar movies = new Dictionary<int,\
    \ string>()\n{\n    { 1212, \"The Godfather\" },\n    { 4433, \"Apocalypse Now\"\
    \ },\n    { 5465, \"The Terminal\" },\n    { 1659, \"Casablanca\" }\n};\nConsole.WriteLine($\"\
    Count = {movies.Count}\");\n```\n\nOutput:\nCount = 4\n\n## 28.4 Dictionary iteration\n\
    \nAs with arrays and lists, you can iterate through all entries in a dictionary\
    \ using `foreach` looping syntax. The following code, for example, iterates through\
    \ all of the entries in the movies dictionary, outputting both the key and value\
    \ for each entry:\n\n```csharp\nforeach (var movie in movies)\n{\n    Console.WriteLine($\"\
    {movie.Key}: {movie.Value}\");\n}\n```\n"
