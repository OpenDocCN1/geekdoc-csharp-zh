    and a new line


    and tabs work too.


    You can also put in sequences that would normally be seen as escape sequences
    like \n and \t.


    If you are familiar with the heredoc function of other programming languages,
    you will quickly notice that this is essentially the C# equivalent.


    30.3 Obtaining the length of a C# string


    If you need to identify the length of a C# string, you can do so by accessing
    the Length property of the string object:


    string myString = "Hello World";


    Console.WriteLine($"myString length = {myString.Length}");


    Output:


    myString length = 11


    ## 30.4 Treating strings as arrays


    It is possible to access individual characters in a string by treating the string
    as an array (arrays were covered in “Creating 2D, 3D, and Jagged Arrays in C#”).


    By specifying the index value using subscripting syntax ([]), you can access individual
    characters in a string (keeping in mind that the first character is at index position
    0):


    string myString = "Hello World";


    Console.WriteLine(myString[0]);


    Console.WriteLine(myString[2]);


    Console.WriteLine(myString[4]);


    Output:


    H


    l


    o


    It is important to note that strings are immutable (in other words, while an entirely
    new string literal may be assigned to the variable, you cannot change the individual
    characters in a string). To experience this limitation, try running the following
    code:


    string myString = "Hello World";


    myString[5] = ''-'';


    When attempting to run the above code, you will have received an error from the
    compiler stating the following:


    Property or indexer ''string.this[int]'' cannot be assigned to -- it is read only


    It is also possible to convert a string to an array of characters by making a
    call to the string object’s ToCharArray() method as follows:


    string myString = "Hello World";


    char[] charArray = myString.ToCharArray();


    foreach (char c in charArray) {


        Console.WriteLine(c);


    }


    Output:


    H


    e


