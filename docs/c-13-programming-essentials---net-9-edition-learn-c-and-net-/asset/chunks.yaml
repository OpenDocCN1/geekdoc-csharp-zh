  trans: "\n`ReadAllLines()` 方法读取文件的全部内容，并将文本行作为字符串数组返回：\n\n```csharp\nstring[] readList\
    \ = File.ReadAllLines(\"MyFile.txt\");\n\nforeach (string line in readList) {\n\
    \    Console.WriteLine(line);\n}\n```\n\n运行项目并在终端中检查是否有以下输出：\n\n```\nKia Sorento\n\
    Alfa Romeo GTV6\nChevy Spark\nFord Explorer\nToyota Celica\n```\n\n## 29.11 删除、复制和移动文件\n\
    \n使用 `File` 类的 `Delete()` 方法删除现有文件（`FileInfo` 类中也提供了类似的选项），调用时传入要删除的文件路径，例如：\n\
    \n```csharp\nFile.Delete(\"/Temp/SomeFile.txt\");\n```\n\n要将现有文件复制到新文件，请按如下方式使用\
    \ `File.Copy()` 方法：\n\n```csharp\nFile.Copy(\"File1.txt\", \"/Temp/File2.txt\"\
    );\n```\n\n`File.Move()` 方法将文件从一个位置移动到另一个位置，并包括重命名文件的选项。以下代码在目录之间移动文件：\n\n```csharp\n\
    File.Move(\"MyFile.txt\", \"/Documents/MyFile.txt\");\n```\n\n在以下示例中，使用 `Move()`\
    \ 重命名当前工作目录下的文件：\n\n```csharp\nFile.Move(\"oldfilename.txt\", \"newfilename.txt\"\
    );\n```\n\n## 29.12 使用流进行文件 I/O\n\n`File` 类提供了一种简单的方法将内容作为块或行写入文件。然而，对于更复杂的需求，我们需要使用流（streams）。\n\
    \n`StreamReader` 和 `StreamWriter` 类与 `File` 类相比，在读取文件和写入文件时具有更大的灵活性和控制力，并且更适合处理大文件。\n\
    \n`Stream` 类允许我们按行或按字符读取和写入文本。例如，以下代码使用 `StreamWriter` 的 `Write()` 和 `WriteLine()`\
    \ 方法分别将单个字符和行写入流中：\n\n```csharp\nusing (StreamWriter writer = new(\"MyFile.txt\"\
    ))\n{\n    writer.Write('A');\n    writer.Write('B');\n    writer.Write('C');\n\
    \    writer.WriteLine(\"DEFGHIJKLMNOP\");\n    writer.WriteLine(\"QRSTUVWXYZ\"\
    );\n}\n```\n\n注意上述代码中 `using` 语句的使用。`StreamReader` 和 `StreamWriter` 在创建时会分配资源，工作完成后需要释放这些资源。`using`\
    \ 语句确保在完成工作后调用对应对象的 `Dispose()` 方法以释放分配的资源。或者，必须在流实例上调用 `Dispose()`：\n\n```csharp\n\
    writer.Dispose();\n```\n\n以下代码使用 `StreamReader` 的 `ReadLine()` 方法逐行读取 `MyFile.txt`\
    \ 文件的内容：\n\n```csharp\nusing (StreamReader reader = new(\"MyFile.txt\"))\n{\n\
    \    string line;\n    while ((line = reader.ReadLine()) != null)\n    {\n   \
    \     Console.WriteLine(line);\n    }\n}\n```\n\n我们可以使用 `StreamReader` 的 `Read()`\
    \ 方法从文件中读取范围内的字符。`Read()` 方法有多个重载方法，允许以不同的方式调用它。例如，以下代码读取并显示了我们 `MyFile.txt` 文件中的第一个字符：\n\
    \n```csharp\nConsole.WriteLine($\"Char = {(char)reader.Read()}\");\n```\n\n输出：\n\
    ```\nChar = A\n```\n\n`StreamReader` 实例保留一个指向文件中当前位置的指针。上面的代码不仅读取了文件的第一个字符，还更新了指针以引用下一个位置。因此，第二次读取操作将返回字符\
    \ ‘B’。\n\n为了避免读取到文件末尾之外的风险，我们可以使用 `StreamReader` 的 `Peek()` 方法查看下一个字符而不读取它。当 `Peek()`\
    \ 返回 -1 时，我们知道当前字符是最后一个：\n\n```csharp\nwhile (reader.Peek() >= 0) {\n    Console.WriteLine($\"\
    Char = {(char)reader.Read()}\");\n}\n```\n\n`Read()` 方法还可以使用以下语法从指定的索引位置读取指定数量的字符：\n\
    \n`Read(<char array>, <index>, <count>)`\n\n在上述语法中，`<index>` 参数是相对于当前流位置的偏移量，而不是从流的开始。例如，如果流指针当前为\
    \ 2，且给 `Read()` 传递的索引值为 3，则字符将从位置 5 开始读取。\n\n以下代码示例从当前位置开始，每三个字符一个块从文件中读取：\n\n\
    ```csharp\nusing (StreamReader reader = new(\"MyFile.txt\"))\n{\n    char[] charBuffer;\n\
    \    while (reader.Peek() >= 0)\n    {\n        charBuffer = new char[3];\n  \
    \      reader.Read(charBuffer, 0, 3);\n        Console.WriteLine(charBuffer);\n\
    \    }\n}\n```\n\n执行时，上述代码将生成以下输出：\n\n```\nABC\nDEF\nGHI\nJKL\nMNO\nP\nQ\nRST\n\
    UVW\nXYZ\n```\n\n模式在字母 ‘O’ 之后被中断，但请记住这是缓冲区逻辑结束的地方。模式在字母 ‘O’ 之后被中断，但请记住这是缓冲区逻辑结束的地方。（等等，原文此处有重复的句子，我将保持核心逻辑）。\n"
- fmt: "\nThis chapter explored file and directory handling in C# using classes from\
    \ the `System.IO` namespace. We covered creating, deleting, navigating, and working\
    \ with files and directories, including checking for existence, changing the current\
    \ working directory, and handling exceptions. The `File` class provides static\
    \ methods for working with files, while the `FileInfo` class offers non-static\
    \ methods for the same purpose. We also looked at more complex file handling using\
    \ the `StreamReader`, `StreamWriter`, `BinaryReader`, and `BinaryWriter` classes.\n\
    \n# 30. C# Strings\n\nStrings are collections of characters that are grouped together\
    \ to form words or sentences. If it wasn’t for humans, computers would probably\
    \ never have anything to do with strings. The fact is, however, that one of the\
    \ primary jobs of a computer is to accept data from and present data to humans.\
    \ For this reason, it is highly likely that any C# program is going to involve\
    \ a considerable amount of code specifically designed to work with data in the\
    \ form of strings.\n\n## 30.1 Creating the StringsDemo Project\n\nLaunch VS Code,\
    \ open your “C# Essentials” workspace folder, and create a new .NET Console App\
    \ project named `StringsDemo`.\n\nAfter creating the project, open the `Program.cs`\
    \ file and use it to try out the examples in the rest of this chapter.\n\n## 30.2\
    \ Creating strings in C#\n\nStrings consist of sequences of characters contained\
    \ in a string object. A string object may be created using a number of different\
    \ mechanisms.\n\nA string may be declared but not initialized as follows:\n\n\
    ```csharp\nstring myString;\n```\n\nAlternatively, you can assign a literal value\
    \ to a string in C# using the assignment operator:\n\n```csharp\nstring myString\
    \ = \"Hello World\";\n```\n\nIt is, of course, also possible to declare a string\
    \ using implicit typing:\n\n```csharp\nvar myString = \"Hello World\";\n```\n\n\
    Similarly, a new string may be created using the `new` keyword and passing through\
    \ the literal value to the constructor:\n\n```csharp\nstring myString = new(\"\
    Hello World\");\n```\n\nString literals are placed within double quotes (as shown\
    \ above). If the string itself contains double quotes, the escape character `\\\
    ` should precede the double-quote characters:\n\n```csharp\nConsole.WriteLine(\"\
    He shouted \\\"Can you hear me?\\\"\");\n```\n\nOutput:\n`He shouted \"Can you\
    \ hear me?\"`\n\nYou can also instruct C# to treat all the characters in a string\
    \ verbatim by prefixing the string with the `@` character. When using `@` notation,\
    \ everything between the double quotes is treated as a raw string, regardless\
    \ of whether new lines, carriage returns, backslashes, etc., are present in the\
    \ text. For example:\n\n```csharp\nConsole.WriteLine(@\"You can put a backslash\
    \ \\ here\n\nand a new line\n\nand tabs work too.\n\nYou can also put in sequences\
    \ that would normally be seen as escape sequences like \\n and \\t.\");\n```\n\
    \nOutput:\n`You can put a backslash \\ here\nand a new line\nand tabs work too.\n\
    You can also put in sequences that would normally be seen as escape sequences\
    \ like \\n and \\t.`\n\nIf you are familiar with the heredoc function of other\
    \ programming languages, you will quickly notice that this is essentially the\
    \ C# equivalent.\n\n## 30.3 Obtaining the length of a C# string\n\nIf you need\
    \ to identify the length of a C# string, you can do so by accessing the `Length`\
    \ property of the string object:\n\n```csharp\nstring myString = \"Hello World\"\
    ;\nConsole.WriteLine($\"myString length = {myString.Length}\");\n```\n\nOutput:\n\
    `myString length = 11`\n\n## 30.4 Treating strings as arrays\n\nIt is possible\
    \ to access individual characters in a string by treating the string as an array\
    \ (arrays were covered in “Creating 2D, 3D, and Jagged Arrays in C#”).\n\nBy specifying\
    \ the index value using subscripting syntax `[]`, you can access individual characters\
    \ in a string (keeping in mind that the first character is at index position 0):\n\
    \n```csharp\nstring myString = \"Hello World\";\nConsole.WriteLine(myString[0]);\n\
    Console.WriteLine(myString[2]);\nConsole.WriteLine(myString[4]);\n```\n\nOutput:\n\
    `H`\n`l`\n`o`\n\nIt is important to note that strings are immutable (in other\
    \ words, while an entirely new string literal may be assigned to the variable,\
    \ you cannot change the individual characters in a string). To experience this\
    \ limitation, try running the following code:\n\n```csharp\nstring myString =\
    \ \"Hello World\";\nmyString[5] = '-';\n```\n\nWhen attempting to run the above\
    \ code, you will have received an error from the compiler stating the following:\n\
    `Property or indexer 'string.this[int]' cannot be assigned to -- it is read only`\n\
    \nIt is also possible to convert a string to an array of characters by making\
    \ a call to the string object’s `ToCharArray()` method as follows:\n\n```csharp\n\
    string myString = \"Hello World\";\nchar[] charArray = myString.ToCharArray();\n\
    foreach (char c in charArray) {\n    Console.WriteLine(c);\n}\n```\n\nOutput:\n\
    `H`\n`e`\n`l`\n`l`\n`o`\n`W`\n`o`\n`r`\n`l`\n`d`\n\n## 30.5 String character iteration\n\
    \nGiven that we can treat each character in an array as an array element, it should\
    \ not surprise you to learn that we can iterate through the characters of a string\
    \ using a `foreach` loop as follows:\n\n```csharp\nstring myString = \"Hello World\"\
    ;\nforeach (char c in myString) {\n    Console.WriteLine(c);\n}\n```\n\nOutput:\n\
    `G`\n`o`\n`o`\n`d`\n`b`\n`y`\n`e`\n`W`\n`o`\n`r`\n`l`\n`d`\n\n## 30.6 Concatenating\
    \ strings\n\nStrings may be concatenated (i.e., joined together) simply by adding\
    \ them together using the addition operator `+`.\n\nWe can, therefore, combine\
    \ two strings as follows:\n\n```csharp\nstring myString = \"Hello World.\";\n\
    Console.WriteLine(myString + \" How are you?\");\n```\n\nOutput:\n`Hello World.\
    \ How are you?`\n\nAlternatively, you can concatenate strings using the `Concat()`\
    \ instance method of the `string` class. This method takes two strings to be joined\
    \ as arguments and returns a new string containing the union of the two strings:\n\
    \n```csharp\nstring myString1 = \"If at first you don’t succeed, \";\nstring myString2\
    \ = \"try, try again.\";\nstring myString3 = string.Concat(myString1, myString2);\n\
    Console.WriteLine(myString3);\n```\n\nOutput:\n`If at first you don’t succeed,\
    \ try, try again.`\n\n## 30.7 Comparing strings\n\nC# provides several options\
    \ if you need to compare one string with another. The most common option is to\
    \ use the equality operator, as demonstrated in the example below:\n\n```csharp\n\
    string myString1 = \"Hello World\";\nstring myString2 = \"Hello World\";\nif (myString1\
    \ == myString2)\n{\n    Console.WriteLine(\"The strings match.\");\n}\nelse\n\
    {\n    Console.WriteLine(\"They strings not match.\");\n}\n```\n\nOutput:\n`The\
    \ strings match.`\n\nYou can also compare strings in a similar way using the `string.Equals()`\
    \ instance method. This method takes as arguments two strings to be compared and\
    \ returns a `Boolean` result indicating whether or not the strings match:\n\n\
    ```csharp\nstring myString1 = \"Hello world\";\nstring myString2 = \"Hello world\"\
    ;\nif (string.Equals(myString1, myString2))\n{\n    Console.WriteLine(\"The strings\
    \ match.\");\n}\nelse\n{\n    Console.WriteLine(\"The strings do not match.\"\
    );\n}\n```\n\nOutput:\n`The strings match.`\n\nIn the above example, we passed\
    \ both strings through the `Equals()` method when performing the comparison. The\
    \ `Equals()` method can also be called on a string literal or string object to\
    \ achieve the same result:\n\n```csharp\nstring myString1 = \"Hello world\";\n\
    string myString2 = \"Hello world\";\nif (myString1.Equals(myString2, StringComparison.Ordinal))\n\
    {\n    Console.WriteLine(\"The strings match.\");\n}\nelse\n{\n    Console.WriteLine(\"\
    The strings do not match.\");\n}\n```\n\nOutput:\n`The strings match.`\n\nSo far,\
    \ all of the comparisons we have explored have performed a case-sensitive comparison.\
    \ When calling the `Equals()` method, you can also pass through a comparison type\
    \ parameter. The type must be taken from the C# `StringComparison` enumeration,\
    \ which, among values for performing culture-sensitive comparison settings, includes\
    \ the `OrdinalIgnoreCase` value for case-insensitive comparisons:\n\n```csharp\n\
    string myString1 = \"HELLO WORLD\";\nstring myString2 = \"Hello world\";\nif (string.Equals(myString1,\
    \ myString2, StringComparison.OrdinalIgnoreCase))\n{\n    Console.WriteLine(\"\
    The strings match.\");\n}\nelse\n{\n    Console.WriteLine(\"The strings do not\
    \ match.\");\n}\n```\n\nOutput:\n`The strings match.`\n"
