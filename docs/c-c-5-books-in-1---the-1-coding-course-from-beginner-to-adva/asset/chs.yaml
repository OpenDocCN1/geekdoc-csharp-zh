  \ = scores.Where(n => n > 57).Count();\n        Console.WriteLine‘{0} 分数大于 57’,\
  \ highScores);\n    }\n}\n```\n\n### 任务 2：\n\n使用 Lambda 表达式创建一个查询，提取一年级学生、二年级学生等的总分。\n\
  \n#### 解决方案\n\n```cs\nprivate static void StudentsByGrade()\n{  \n    var categ\
  \ =\n    from student in students\n    group student by student.grade into studentGroup\n\
  \    select new { GradeLevel = studentGroup.Key, TotalScore = studentGroup.Sum(s\
  \ => s.ExamScores.Sum()) };\n\n    foreach (var cat in categ)\n    {\n        Console.WriteLine\
  \ (‘年级 = {0} 总分 = {1}`, cat.GradeLevel, cat.TotalScore);\n    }\n}\n```\n\n# 第 11\
  \ 章：可空类型\n\nC# 提供了一种带有特殊空值的数据类型，其有自己的范围。`int32` 数据类型的范围是 -2147483648 到 2147483647，而可空\
  \ `int32` 可以存储 `int` 数据类型范围内所有数字的空值。`Boolean` 值的 `Nullable` 可以存储 true、false 或空值。\n\
  \n在本章中，我们将学习：\n\n* 可空类型的结构\n* 可空类型的语法\n* `HasValue` 和 `Has` 属性\n* 空合并运算符\n\n###\
  \ C# 中的可空类型结构\n\n下表向我们展示了原始数据类型的可空类型结构及其范围。正如我们所说明的那样，可空类型有一个额外的空值。\n\n| 类型 | 范围\
  \ |\n| :--- | :--- |\n| 可空 Boolean | True 或 False 或 Null |\n| 可空 byte | 0 到 255\
  \ 或 Null |\n| 可空 decimal | (-7.9 x 1028 到 7.9 x 1028) / 100 到 28 或 Null |\n| 可空\
  \ double | (+/-)5.0 x 10-324 到 (+/-)1.7 x 10308 或 Null |\n| 可空 DateTime | 代表时间中的瞬间或\
  \ Null |\n| 可空 Int16 | -32,768 到 +32,767 或 Null |\n| 可空 Int32 | -2,147,483,648 到\
  \ 2,147,483,647 或 Null |\n| 可空 Int64 | -9,223,372,036,854,775,808 到 9,223,372,036,854,775,807\
  \ 或 Null |\n| 可空 Single | 单一值或 Null |\n| 可空 char | U+0000 到 U+FFFF 或 Null |\n\n\
  ### C# 中可空类型的语法\n\n声明可空类型有两种主要方法。第一种如下：\n\n`System.Nullable<data_type> variable_name;`\n\
  \n它以 `System.Nullable`（称为相关对象）开头，后跟数据类型规范 — `int`、`double` 以及变量名。另一种声明可空类型的方法如下：\n\
  \n`data_type? variable_name = null;`\n\n它以数据类型规范、问号和变量名开头。让我们来看一些例子。\n\n#### 示例\
  \ 1\n\n```cs\nnamespace nullable\n{\n    Class program\n    {\n        static void\
  \ Main ()\n        {\n            int? x= null;\n            int? y=1;\n       \
  \     if(x==null)\n                Console.WriteLine(y)\n            else\n    \
  \            Console.WriteLine‘未定义’;\n        }\n    }\n}\n```\n\n在上面的示例中，我们声明了可空整数。在上面的示例中，我们声明了可空整数。如果\
  \ `x` 为空，则打印 `y`；否则打印“未定义”。\n\n输出 1：\n1\n\n#### 示例 2\n\n```cs\nnamespace nullable\n\
  {\n    Class program\n    {\n        static void Main ()\n        {\n          \
  \  int? x= null;\n            int? y=1;\n            if(x==null)\n             \
  \   Console.WriteLine(y)\n            else\n                Console.WriteLine‘未定义’;\n\
  \        }\n    }\n}\n```\n\n在上面的示例中，我们声明了可空整数。在上面的示例中，我们声明了可空整数。如果 `x` 为空，则打印 `y`；否则打印“未定义”。\n\
  \n输出 2：\n1\n\n#### 示例 3\n\n```cs\nnamespace nullable\n{\n    Class program\n   \
  \ {\n        static void Main ()\n        {\n            int? x= null;\n       \
