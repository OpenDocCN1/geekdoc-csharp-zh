  \nThe Snow White value is at index 2. :)\n\nIs Snow White still at index 2? True\
  \ or False? False.\n\n#### RemoveAt Function\n\n我们将使用 `RemoveAt` 方法来移除特定索引处的项。下面的程序用于展示如何使用\
