  );\n            Console.WriteLine(\"True or False, does the value \\\"One Ring To\
  \ Them All\\\"? \" + ar.ContainsValue(\"One Ring To Them All\"));\n            Console.WriteLine(\"\
  True or False, does the value \\\"Snowhite\\\"? \" + ar.ContainsValue(\"Snow White\"\
