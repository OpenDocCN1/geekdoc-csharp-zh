  \ `CarCollection` 的自定义集合类型添加了索引器方法的支持。我们还没有添加索引器，但请注意下面的用法：\n\n```\nclass myProgram\n\
  {\n    static void Main(string[] args)\n    {\n        Console.WriteLine (\"++++\
  \ Indexers are awesome ++++\\n\");\n        CarCollection myCar = new CarCollection();\n\
  \        // 使用索引器语法引入对象\n        myCar[0] = new Car (\"Nissan\", \"Qashqai\", 2018);\n\
  \        myCar[1] = new Car (\"Renault\", \"Clio\", 2016);\n        myCar[2] = new\
  \ Car (\"Ford\", \"Mustang\", 1969);\n        myCar[3] = new Car (\"Toyota\", \"\
  Tacoma\", 2019);\n        myCar[4] = new Car (\"Mercedes\", \"C300\", 2016);\n \
  \       // 使用索引器检索并显示项。\n        for (int i = 0; i < myCar.Count; i++)\n       \
  \ {\n            Console.WriteLine(\"Car number: {0}\", i);\n            Console.WriteLine(\"\
  Brand: {0} {1}\", myCar[i].BrandName, myCar[i].ModelName);\n            Console.WriteLine(\"\
  Year: {0}\", myCar[i].Year);\n            Console.WriteLine();\n        }\n    }\n\
  }\n```\n\n正如你所看到的，索引器允许我们以类似于数组的方式控制子项集合。我们需要弄清楚的是如何配置我们的 `CarCollection` 类来利用这一功能。当你考虑到\
  \ C# 属性定义中的索引器类型时，我们应该如下所示修改 `CartCollection` 类：\n\n```cs\n// 在类的定义中引入索引器\npublic\
  \ class CarCollection : IEnumerable\n{\n    private ArrayList arCar = new ArrayList();\n\
  \    // 类的自定义索引器\n    public Car this[int index]\n    {\n        get => (Car)arCar[index];\n\
  \        set => arCar.Insert(index, value);\n    }\n}\n```\n\n正如你所看到的，我们的索引器与没有\
  \ `this` 关键字的属性声明相同。我们还使用了 `get` 语法来返回正确的项。这意味着请求被委托给索引器，该索引器属于 `ArrayList` 项，即接受我们索引器的类。我们还有\
  \ `set` 语法，在其中我们需要使用 `insert` 方法添加新的 `Car` 项，该方法属于 `ArrayList` 类。在这种情况下，索引器的作用与普通的公共方法相同，但实现在自定义集合中的索引器可以轻松集成到任何\
  \ `.NET` 库中。\n\n### 使用字符串值索引\n\n`CarCollection` 类定义了一个索引器，允许调用者通过数值值确定子项。然而，为了使用字符串，这是必需的。字典提供了对封装类型的访问。让我们看一下：\n\
  \n```cs\npublic class CarCollection : IEnumerable\n{\n    private Dictionary <string,\
  \ Car> listCar = new Dictionary <string, Car>();\n    // 根据字符串索引器返回一个对象\n    public\
  \ Car this[string name]\n    {\n        get => (Car)listCar[name];\n        set\
  \ => listCar[name] = value;\n    }\n    public void ClearCar() { listCar.Clear();\
  \ }\n    public int Count => listCar.Count;\n    IEnumerator IEnumerable.GetEnumerator()\
  \ => listCar.GetEnumerator();\n}\n```\n\n让我们看看调用者如何与 `Car` 对象交互：\n\n```\nstatic\
  \ void Main(string[] args)\n{\n    Console.WriteLine (\"++++ Indexers are awesome\
  \ ++++\\n\");\n    CarCollection myCar = new CarCollection();\n    myCar[\"Nissan\"\
  ] = new Car (\"Nissan\", \"Qashqai\", 2018);\n    // 获取 \"Nissan\" 并打印数据。\n    Car\
  \ nissan = myCar[\"Nissan\"];\n    Console.WriteLine(nissan.toString());\n    Console.ReadLine();\n\
  }\n```\n\n### 索引器重载\n\n你可以在一个类上重载索引器方法。你也可以为一个类型定义多个索引器，以便调用者可以使用数值或字符串索引访问子项。例如，`.NET`\
  \ 的数据访问 API (ADO.NET) 有一个 `DataSet` 类，支持 `Tables` 属性，该属性返回 `DataTable Collection`\
  \ 类型。该类型通过定义三个索引器来获取和设置所有数据表项，其中位于顺序位置，其余通过字符串命名，并带有包含命名空间的选项。以下是一个示例：\n\n```cs\n\
  public sealed class DataTableCollection : InternalDataCollectionBase\n{\n    //\
  \ ...\n    // 这些是重载索引器\n    public DataTable this [int index] { get; }\n}\n```\n\
  \n\n\n\n```csharp\npublic DataTable this [string name] { get; }\n\npublic DataTable\
  \ this [string name, string tableNamespace] { get; } } }\n\n基类库中的类型通常支持索引器（indexer）。因此，即使你不需要创建自定义索引器，也有几种类型支持该语法。\n\
  \n## 多维索引器\n\n此外，你还可以拥有一个接受多个参数的索引器。假设我们有一个使用二维数组来存储子对象的集合。它的样子会是这样：\n\n```csharp\n\
  public class SomeContainer\n{\n    private int[,] my2DintArray = new int [10, 10];\n\
  \n    public int this[int row, int column]\n    {\n        /* 从二维数组中获取或设置值 */\n\
  \    }\n}\n```\n\n如果你不创建自定义集合，就不需要多维索引器了。然而，这种结构在 `ADO.NET` 中仍然有用。最好是将 `DataTable`\
  \ 想象成一个具有行和列的表格，就像 Excel 电子表格一样。使用数据适配器（data adapter）向表格中填充对象。让我们构建一个包含三列的表格，包含车辆详情：品牌、型号和制造年份。看看一旦我们有一行数据，可以如何利用多维索引器的。让我们看看下面的代码以获得更好的理解。你需要导入\
  \ `System.Data` 才能使代码工作。\n\n```csharp\nstatic void MultiIndexerDataTable()\n{\n\
  \    // 创建一个有三列的数据表。\n    DataTable myTable = new DataTable();\n    myTable.Columns.Add\
  \ (new DataColumn(\"Brand\"));\n    myTable.Columns.Add (new DataColumn(\"Model\"\
  ));\n    myTable.Columns.Add (new DataColumn(\"Year\"));\n\n    // 接下来，我们将插入一行。\n\
  \    myTable.Rows.Add (\"Ford\", \"Mustang\", 1969);\n\n    // 现在我们可以实现索引器来学习这一行数据。\n\
  \    Console.WriteLine (\"Brand: {0}\", myTable.Rows[0][0]);\n    Console.WriteLine\
  \ (\"Model: {0}\", myTable.Rows[0][1]);\n    Console.WriteLine (\"Year : {0}\",\
  \ myTable.Rows[0][2]);\n}\n```\n\n即使你不熟悉 `ADO.NET`，上面的示例也是为了向你展示索引器如何支持多个维度，这意味着它们可以简化你访问和操作自定义集合中子项的方式。\n\
  \n### 运算符重载\n\n如你所知，编程语言具有用于对特定数据类型执行各种任务的符号。例如 `+` 运算符，用于将浮点数或整数相加。\n\n```csharp\n\
  // 整数加法运算符的示例。\nint x = 100;\nint y = 200;\nint z = x + y;\n// z 的值现在是 300。\n```\n\
  \n你在刚开始学习时就学到了这个。但你考虑过这个运算符如何用于其他数据类型（如字符串）吗？\n\n```csharp\n// 字符串加法运算符的示例。\nstring\
  \ x = \"Hello\";\nstring y = \" world!\";\nstring z = x + y;\n// 字符串 z 现在是 \"Hello\
  \ World!\"\n```\n\n再次，你知道这一点。注意运算符如何根据它们处理的数据类型产生不同的行为。当用于数值数据类型时，我们得到一个和；当用于字符串时，字符串会进行拼接。C#\
  \ 允许你创建自定义类，这意味着这些运算符的行为将与你使用的运算符与有不同。运算符重载允许你做到这一点。\n\n在初学者指南中，当我们谈到 `Polymorphism`（多态）时，简要提到了这一点。我们在这里进行更深层次的探索。\n\
  \n运算符重载的核心在于定义运算符的功能，以便它对你的对象和类产生独特的影响。下面是可以重载的运算符列表：\n\n6. 一元运算符：`+`, `-`, `!`,\
  \ `~`, `++`, `--`, `true` 和 `false`。\n7. 二元运算符：`+`, `-`, `*`, `/`, `%`, `|`, `^`,\
  \ `<<`, `>>`。\n8. 比较运算符：`==`, `!=`, `<`, `>`, `<=`, `>=`。请记住，在 C# 中，你必须一起重载这些“类”的运算符。\n\
  \n下面是你不能重载的运算符列表：\n\n1. 简写赋值运算符：`+=`, `-=`, `*=`, `/=`, `%=`, `&=`, `|=`, `^=`,\
  \ `<<=`, `>>=`。注意，虽然这些运算符不能被重载，但当你重载与它们相关的二进制运算符时，它们会被包含在内。\n2. `[]` 运算符：你不能重载这个运算符；但是，你可以使用索引器结构来代替它以获得相同的功能。\n\
  3. `()` 运算符：此运算符不能被重载；但如果你需要那种功能，可以使用自定义转换方法。\n\n现在你已经知道了所有的规则，让我们开始重载一些运算符。我们将从一元运算符开始。\n\
  \n### 一元运算符重载\n\n在重载一元运算符时，要求在运算符关键字旁使用 `static` 关键字。在接下来的示例中，我们将有一个与类定义类型相同的单个参数。\n\
  \n```csharp\npublic class Line\n{\n    ...\n    // 对于 Line，我们将给它的 X 和 Y 值各加 1。\n\
  \    public static Line operator++(Line l1) => new Line (l1.X);\n\n    // 现在让我们使用减法。\n\
  \    public static Line operator --(Line l1) => new Line (l1.X);\n}\n```\n\n我们可以像示例中那样增加或减少值：\n\
  \n```csharp\nstatic void Main (string args)\n{\n    ...\n    // 在示例中增加或减少值。\n  \
  \  lFive++;\n    Console.WriteLine (\"lnFive = {0}\", lFive);\n    lFive--;\n  \
  \  Console.WriteLine (\"lnFive = {0}\", lFive);\n}\n```\n\n## 二元运算符重载\n\n为了说明如何重载二元运算符，我们定义\
  \ `Line` 类：\n\n```csharp\npublic class Line\n{\n    public int x {get; set;}\n \
  \   public int y {get; set;}\n\n    public Line (int xPos, int yPos)\n    {\n  \
  \      x = xPos;\n        y = yPos;\n    }\n\n    public override string ToString()\
  \ => $\"[{x}, {y}]\";\n}\n```\n\n下一步是将 Lines 相加。让我们看看代码：\n\n```csharp\nstatic void\
  \ Main (string args)\n{\n    ...\n    // 创建两个 Line 对象。\n    Line lnOne = new Line\
  \ (100, 100);\n    Line lnTwo = new Line (40, 40);\n\n    // 通过计算两个之和创建一个较大的 Line。\n\
  \    Line lnThree = lnOne + lnTwo;\n    Console.WriteLine (\"lnThree = {0}\", lnThree);\n\
  \n    // 通过减法创建一个较小的 line。\n    Line lnFour = lnOne - lnTwo;\n    Console.WriteLine\
  \ (\"lnFour = {0}\", lnFour);\n}\n```\n\n加运算符根据获取的 `Line` 参数返回 `Line` 对象。为了允许自定义类型以指定的方式做出响应，我们使用\
  \ `operator` 关键字配合 `static` 关键字。当重载二元运算符时，我们需要传递两个或多个与类相同的参数（在本例中为 `Line`）。\n\n\
  ```csharp\npublic class Line\n{\n    public int x {get; set;}\n    public int y\
  \ {get; set;}\n\n    public Line (int xPos, int yPos)\n    {\n        x = xPos;\n\
  \        y = yPos;\n    }\n\n    // 使用重载的 + 运算符。\n    public static Line operator+\
  \ (Line l1, Line l2) => new Line (l1.x + l2.x, l1.y + l2.y);\n\n    // 使用重载的 - 运算符。\n\
  \    public static Line operator - (Line l1, Line l2) => new Line (l1.x - l2.x,\
  \ l1.y - l2.y);\n}\n```\n\n\n\n\n\n我们的程序应该能够正常编译而不报错。现在，我们可以像这样对线性对象进行加减：\n\n```csharp\n\
  lnOne = [100, 100]\nlnTwo = [40, 40]\nlnOne + lnTwo: [140, 140]\nlnOne - lnTwo:\
  \ [60, 60]\n```\n\n注意，当重载二元运算符时，你不需要传递相同类型的参数。如果你认为这样最好，可以拥有不同的参数。在接下来的示例中，我们重载了\
  \ `+` 运算符，允许调用者获取另一个专注于数值布局的 `Line` 对象：\n\n```csharp\npublic class Line\n{\n...\n\
  public static Line operator + (Line l1, int change) => new Line (l1.x + change,\
  \  l1.y + change);\npublic static Line operator + (int change, Line l1) => new Line\
  \ (l1.x + change,  l1.y + change);\n}\n```\n\n请注意，两种方法变体都是为了传递参数所需的。仅定义其中一个是不够的，因为编译器不会自动处理另一个。你可以像这样使用运算符的任意版本：\n\
  \n```csharp\n// Print [110, 110].\nLine largerLine = lnOne + 10;\nConsole.WriteLine\
  \ (\"lnOne + 10 = {0}\", largerLine);\n\n// Print [120, 120].\nConsole.WriteLine\
  \ (\"10 + largerLine = {0}\", 10 + largerLine);\nConsole.WriteLine();\n```\n\n既然我们已经看过了重载二元运算符，让我们讨论一下简写赋值运算符的问题。记住，你不能像在\
  \ C++ 中那样重载 `+=` 和 `-=` 运算符。在 C# 中，如果你有一个类型重载了与之相关的二元运算符，这些运算符可以自动模拟。在之前的示例中，我们重载了\
  \ `+` 和 `-` 运算符。现在我们可以使用简写运算符：\n\n```csharp\nstatic void Main (string[] args)\n\
  {\n...\n// +=\nLine lnThree = new Line (90, 5);\nConsole.WriteLine (\"lnThree =\
  \ {0}\", lnThree);\nConsole.WriteLine (\"lnThree += lnTwo: {0}\", lnThree += lnTwo);\n\
  \n// -=\nLine lnFour = new Line (0, 500);\nConsole.WriteLine (\"lnFour = {0}\",\
  \ lnFour);\nConsole.WriteLine (\"lnFour -= lnThree: {0}\", lnFour -= lnThree);\n\
  Console.ReadLine();\n}\n```\n\n### 比较运算符重载\n\n你已经知道如何通过 `IComparable` 接口来比较对象了。然而，只要它们针对同一个类，我们就可以重载比较运算符。记住，如果你计划重载\
  \ `<` 运算符，你必须也重载 `>` 运算符，以及 `<=` 和 `>=` 运算符。让我们来看 `Line` 类型重载这些运算符的示例，以便我们可以比较 `Lines`：\n\
  \n```csharp\nstatic void Main (string[] args)\n{\n...\nConsole.WriteLine (\"lnOne\
  \ < lnTwo : {0}\", lnOne < lnTwo);\nConsole.WriteLine (\"lnOne > lnTwo : {0}\",\
  \ lnOne > lnTwo);\nConsole.ReadLine();\n}\n```\n\n重载这些运算符是一项简单的任务。该过程看起来如下：\n\n\
  ```csharp\n// Line 现在是可比较的。\npublic class Line: IComparable<Line>\n{ ...\npublic\
  \ int CompareTo (Line other)\n{\nif (this.X > other.X && this.Y > other.Y)\n   \
  \ return 1;\nif (this.X < other.X && this.Y < other.Y)\n    return -1;\nelse\n \
  \   return 0;\n}\npublic static bool operator < (Line l1, Line l2) => l1.CompareTo(l2)\
  \ < 0;\npublic static bool operator > (Line l1, Line l2) => l1.CompareTo(l2) > 0;\n\
  public static bool operator <= (Line l1, Line l2) => l1.CompareTo(l2) <= 0;\npublic\
  \ static bool operator >= (Line l1, Point p2) => l1.CompareTo(l2) >= 0;\n}\n```\n\
  \n### 等等运算符重载\n\n要重载相等运算符，你需要熟悉覆盖 `System.Object.Equals`。因此，它将从基于引用的比较变为基于值的比较。当我们重写\
  \ `Equals` 时，我们就面临了重载 `==` 和 `!=` 等等运算符的任务。下面使用更新后的 `Line` 类型执行此操作的示例：\n\n```csharp\n\
  public class Line\n{\n...\npublic override bool Equals (object o) => o.ToString()\
  \ == this.ToString();\npublic override int GetHashCode() => this.ToString().GetHashCode();\n\
  // 现在我们要重载 == 和 != 运算符。\npublic static bool operator == (Line l1, Line l2) => l1.Equals(l2);\n\
  public static bool operator != (Line l1, Line l2) => !l1.Equals(l2);\n}\n```\n\n\
  看这两个运算符是如何调用被重写的 `Equals` 方法的。这处理了大部分工作流。我们可以这样使用重载的运算符：\n\n```csharp\nstatic void\
  \ Main (string[] args)\n{\n...\nConsole.WriteLine (\"lnOne == lnTwo : {0}\", lnOne\
  \ == lnTwo);\nConsole.WriteLine (\"lnOne != lnTwo : {0}\", lnOne != lnTwo);\nConsole.ReadLine\
  \ ();\n}\n```\n\n使用相等运算符比较两个对象比调用 `Equals` 更容易。当你重载它们时，C# 会要求你重写它们。你不必担心忘记这一步，因为编译器会提醒你。\n\
  \nC# 允许你创建具有更独特行为的自定义...（注：提供的文本后续是关于扩展方法的重复描述）。\n\n### 扩展方法\n\n扩展方法是在 .NET 3.5\
  \ 版本引入的。它们允许我们在不更改类类型的情况下为类实现方法和属性。你需要在静态类中定义扩展方法，因此必须使用 `static` 关键字。此外，扩展方法通过\
  \ `this` 关键字识别，该关键字应用于方法的第一个参数。\n\n\n\n\n\n```csharp\n// 将它们放在一个字符串中。\n\nstring\
  \ newDigits = new string(digits);\n\n// 最后，我们可以将修改后的字符串以整数的形式返回。\n\nreturn int.Parse(newDigits);}}\n\
  ```\n\n观察 `this` 关键字如何在定义之前标记每个扩展方法的第一个参数。你需要一致地这样做，因为第一个参数是告诉程序我们正在扩展该类型的唯一标识符。在我们的示例中，我们使用\
  \ `DisplayDefiningAssembly` 方法来扩展 `System.object`，因此所有类型都包含它作为一个成员。请记住，在 .NET 框架中，`Object`\
  \ 是其内部所有类型的父类。另一方面，`BackwardsDigits` 方法用于扩展整数。因此，如果另一个类型调用了此方法，我们将得到错误。\n\n让我们来看一个示例，其中\
  \ `Main` 方法扩展了类库中的某些类型。\n\n```csharp\nstatic void Main(string[] args)\n{\n\nConsole.WriteLine\
  \ (\"++++ 扩展方法规则! ++++\\n\");\n\n// 整数已经被同化，反抗是徒劳的\nint myInt = 123456789; myInt.DisplayDefiningAssembly();\n\
  \n// DataSet 也发生了变化。\nSystem.Data.DataSet d = new System.Data.DataSet();\nd.DisplayDefiningAssembly();\n\
  \n// 媒体播放器是下一个倒下的！\nSystem.Media.SoundPlayer sp = new System.Media.SoundPlayer();\n\
  sp.DisplayDefiningAssembly();\n\nConsole.WriteLine (\"myInt 的值: {0}\", myInt);\n\
  Console.WriteLine(\"myInt 的反转数字: {0}\", myInt.BackwardsDigits());\n\nConsole.ReadLine();\
  \ }\n```\n\n我们的输出应该是：\n\n```\n++++ 扩展方法规则! ++++\nInt32 位于这里: => mscorlib\nDataSet\
  \ 位于这里: => System.Data\nSoundPlayer 位于这里: => System\nmyInt 的值: 123456789\nmyInt\
  \ 的反转数字: 987654321\n```\n\n所有持有扩展方法的类都需要通过 .NET 命名空间定义。如果你使用的命名空间与使用扩展方法的命名空间不同，则需要使用\
  \ `using` 关键字添加它们。这意味着你的程序将能够访问用于你所扩展的类型的所有扩展方法。如果你不使用正确的命名空间，这些方法将无法在你的程序文件中可用。此外，记住扩展方法不是全局的，它们被限制在命名空间中，例如我们定义的类被添加到名为\
  \ `AwesomeExtensionMethods` 的命名空间中，如下所示：\n\n```csharp\nnamespace AwesomeExtensionMethods\n\
  {  static class MyExtensions {... } }\n```\n\n在需要该类定义的项目中，你需要导入此命名空间。\n\n最佳实践是将你的扩展方法限制在一个特定的\
  \ .NET 命名空间和一个类库中。遵循此工作流将帮助你创建程序，通过指向适当库的引用并导入所需的命名空间来访问扩展。\n\n## 匿名类型\n\n你已经知道，定义多个表示特定对象功能的类是对其进行建模时最重要的任务之一。当你知道一个类将具有对未来项目有用的函数时，创建一个类是最好的。以方法、事件和构造函数形式存在的可重用代码可以显著减少你投入到项目的时间精精力，让你能够关注更重要的事情。然而，在某些情况下，你需要一个类来构建一个没有任何适应函数或方法的数据点集合。在某些情况下，你可能需要一个仅供程序内部特定方法使用的类型。如果你只有少数地方可以实现它，那么避免开发类定义可能是更好的主意。\n\
  \n让我们来看一个基本的基于值的示意性数据类型：\n\n```csharp\nclass MyClass {\n\n// 确定所有的变量。\n// 为它们中的每一个创建一个属性。\n\
  // 重写 ToString() 以阐明关键成员变量。\n// 重写 GetHashCode() 和 Equals() 以实现基于值的等效性功能。\n\n}\n\
  ```\n\n注意这需要几行代码以及你必须留意的额外类。在处理短期数据时，考虑使用自定义数据类型代替它。假设你需要一个方法来接收某些参数；你想使用它们来构建一个在方法内部使用的新数据类型。此外，你还想用\
  \ `ToString` 方法打印信息。你可以通过匿名类型来实现这一点。\n\n#### 定义 要要定义匿名类型，你使用 `var` 关键字和对象初始化。这会告诉编译器在编译期间创建一个类定义。对象初始化还告诉编译器为该类型构建只读属性和私有备份字段。为了说明如何定义匿名类型，我们将创建一个名为\
  \ `Anonymous` 的应用程序。然后，我们在类中中插入下一个方法。这将根据参数定义一个新类型。\n\n```csharp\nstatic void BuildAnonType\
  \ ( string make, string color, int currSp )\n{\n\n// 使用传入的参数创建匿名类型。\nvar bird =\
  \ new { Species = species, Size = size, Speed = currSp };\n\n// 现在，我们可以通过这种类型获取属性数据。\n\
  Console.WriteLine (\"我看到了一只 {0} {1} 以 {2} MPH 飞行\", bird.Size, bird.Species, bird.Speed);\n\
  \n// System.Object 中的每个虚拟方法都有自定义实现。\nConsole.WriteLine (\"ToString() == {0}\", bird.ToString());\
  \ }\n```\n\n我们可以从 `Main` 调用该方法，也可以使用硬编码值创建匿名类型，如下：\n\n```csharp\nstatic void Main\
  \ (string[] args)\n{\n\nConsole.WriteLine(\"++++ 匿名类型会议++++\\n\");\n\n// 创建一个表示鸟的匿名类型。\n\
  var myBird = new { Color = \"Black\", Species = \"Raven\", FlightSpeed = 50 };\n\
  \n// 显示颜色和种类。\nConsole.WriteLine (\"我的鸟是 {0} {1}.\", myBird.Color, myBird.Species);\n\
  \n// 接下来使用辅助方法创建匿名类型。\nBuildAnonType (\"Raven\", \"Black\", 50);\n\nConsole.ReadLine();\
  \ }\n```\n\n匿名函数允许我们快速得出一个类型。请记住，匿名类型来自 `System.Object`，因此它们允许我们调用 `ToString`、`GetHashCode`、`GetType`\
  \ 和 `Equals`。为了实现这一点，让我们假设应用程序定义了一个静态辅助方法：\n\n```csharp\nstatic void ReflectAnonymousType\
  \ (object obj)\n{\n\nConsole.WriteLine(\"实例类型为: {0}\", obj.GetType().Name);\nConsole.WriteLine\
  \ (\"0} 的基类是 {1}\",\nobj.GetType().Name, obj.GetType().BaseType);\nConsole.WriteLine(\"\
  ToString() == {0}\", obj.ToString());\n\nConsole.WriteLine(\"GetHashCode() == {0}\"\
  , obj.GetHashCode());\n\nConsole.WriteLine();\n\n}\n```\n\n现在我们通过使用 `myBird` 对象作为参数从\
  \ `Main` 调用此方法：\n\n```csharp\nstatic void Main(string[] args)\n{\n\nConsole.WriteLine(\"\
  ++++++++\\n\");\n\n// 创建一个表示鸟的匿名类型。\nvar myBird = new { Color = \"Black\", Species\
  \ = \"Raven\", FlightSpeed = 50 };\n\n// 反映编译器生成的结果。\nReflectAnonymousType (myBird);\n\
  \nConsole.ReadLine(); }\n```\n\n输出应该类似于这样：\n\n```\n++++++++会议++++\n实例类型为: <>f__AnonymousType0`3\n\
  <>f__AnonymousType0`3 的基类是 System.Object\nToString() = { Color = Black, Species\
  \ = Raven, FlightSpeed = 50 }\nGetHashCode() = -528093386\n```\n\n注意我们的对象被列为类型 `<>f__AnonymousType0`3`。编译器创建了类型名称，因此无法从\
  \ C# 代码库访问。但是通过对象初始化定义的键值对，它们被映射到具有相同名称的属性。这是一个与备份字段匹配的只读属性，而备份字段也是只读的。让我们分析下一个代码块，看看它是如何确定表示\
  \ `myBird` 项的生成类的。\n\n```csharp\ninternal sealed class <>f__AnonymousType0<<Color>j__TPar,\n\
  <Make>j__TPar, <FlightSpeed>j__TPar>\n\n{\n\n#### 这里是只读字段。\n}\n```\n\n\n\n\n\n```csharp\n\
  private readonly <Color>j__TPar <Color>i__Field;\n\nprivate readonly <FlightSpeed>j__TPar\
  \ <FlightSpeed>i__Field;\n\nprivate readonly <Make>j__TPar <Species>i__Field;\n\n\
  // 构造函数。\npublic <>f__AnonymousType0(<Color>j__TPar Color, <Make>j__TPar Make, <FlightSpeed>j__TPar\
  \ FlightSpeed);\n\n// 重写的方法。\npublic override bool Equals (object value);\n\npublic\
  \ override int GetHashCode();\n\npublic override string ToString();\n\n// 只读属性。\n\
  public <Color>j__TPar Color { get; }\n\npublic <FlightSpeed>j__TPar FlightSpeed\
  \ { get; }\n\npublic <Species>j__TPar Species { get; }\n\n}\n```\n\n匿名类型配备了对 `ToString`、`GetHashCode`\
  \ 和 `Equals` 的重写，因为它们源自 `System.Object`。`ToString` 会根据每个键/值对创建一个字符串，如下所示：\n\n```csharp\n\
  public override string ToString()\n{\n    StringBuilder builder = new StringBuilder();\n\
  \    builder.Append(\"{ Color = \");\n    builder.Append(this.<Color>i__Field);\n\
  \    builder.Append(\", Species = \");\n    builder.Append(this.<Species>i__Field);\n\
  \    builder.Append(\", FlightSpeed = \");\n    builder.Append(this.<FlightSpeed>i__Field);\n\
  \    builder.Append(\" }\"); return builder.ToString();\n}\n```\n\n“GetHashCode”的实现决定了一个哈希值，该值使用所有匿名类型的成员变量作为\
  \ `System.Collections.Generic.EqualityComparer` 的输入。因此，当两个匿名类型由具有相同值的属性定义时，会产生相同的哈希值。由于如此，使用\
  \ `Hashtable` 容器处理匿名类型被认为是更优的。\n\n### 指针类型\n\n我们将讨论一个我在 `.NET` 项目中很少使用的高级特性：指针类型。你应该知道，指针类型需要一些\
  \ C++ 知识。如果你对 C++ 一点了解，你应该过一眼，以便对这些是什么有个大致的了解。你也可以跳过这一节。这不应该让你太担心，因为你很少遇到需要指针操作的情况，但这是一个你可能想要了解的特性。\n\
  \n在 C# 中，你处理两种类型的数据：引用类型和值类型。第三种是指针类型。要处理指针类型，你需要允许避免 CLR 内存管理的运算符。\n\n指针是一个表示内存中特定位置的变量。以下操作被用于创建和处理指针变量：\n\
  \n1. `*` 运算符（在这种情况下也被称为关键字）是构建指针变量所需的。它的工作方式与 C++ 中的指针间接完全相同。\n2. 需要 `&` 运算符获取变量的地址。\n\
  3. 需要 `->` 运算符来访问指针变量表示的特定类型的字段。\n4. 需要 `[]` 运算符对指针变量指向的槽进行索引。如果你了解 C++，你会注意到这与运算符与变量之间的交互具有相似之处。\n\
  5. `++` 和 `--` 运算符应用于指针类型以递增或减少。\n6. `+` 和 `-` 运算符作为普通的加减运算符工作，可以与指针类型配合。\n7. 所有比较和等价运算符也可以用于指针类型。\n\
  8. 需要 `Stackalloc` 关键字直接将数组分配到栈上。\n9. `Fixed` 关键字用于固定变量以便发现其地址。\n\n简单警告一下，你可以自由探索指针操作，但\
  \ `.NET` 运行时将不知道你在做什么。所以，如果你不确定自己在做什么，最好不要这样做——你可能不想要那种类型的后果。\n\n处理完这些，让我们开始吧。当你想要通过直接访问\
  \ CLR 外部的内存来优化程序的部分时，你可能需要指针类型。另一种情况是你想要调用以 C 为核心的 dll 文件或 COM 服务，因为它们需要指针。在这种情况下，你有跳过指针并使用\
  \ `System.IntPtr` 的选项。\n\n如果你决定使用指针类型，你需要告诉编译器（`csc.exe`）你想使用“不安全代码”（unsafe code）。方法如下：\n\
  \n```bash\ncsc /unsafe *.cs\n```\n\n在 Visual Studio 中，导航到属性中的生成选项卡并选择“允许不安全代码”（allow\
  \ unsafe code）。然后创建一个启用该设置的新控制台应用。\n\n首先，你需要使用 “unsafe” 关键字将你的代码声明为不安全。如果不这样做，它将被视为安全的。方法如下：\n\
  \n```csharp\nclass myApp {\n    static void Main(string[] args)\n    {\n       \
  \ unsafe\n        {\n            // 你只能在此块内玩转指针类型！\n        }\n        // 指针在此部分没有作用力！\n\
  \    }\n}\n```\n\n在方法内部，我们可以创建任何内容——类、结构体和参数等——只要我们做了我们的 “unsafe” 声明。下面是一些示例：\n\n\
  ```csharp\n// 这里，我们将有一个不安全的结构体，\n// 它只在不安全环境中工作\nunsafe struct Node\n{  \n    public\
  \ int Value;  \n    public Node* Left;  \n    public Node* Right; \n}\n\n// 这里我们有一个安全的结构体，但\
  \ Node2 的成员是不安全的。\n// 然而，你可以从不安全环境外部访问该值，\n// 除了“Left”和“Right”。\npublic struct Node2\n\
  {\n    public int Value;\n    public Node* Left;\n    public Node* Right;\n}\n```\n\
  \n\n\n\n\n在查看库的配置方法之前，我们首先需要了解如何在 .NET 命名空间内部封装自定义类型。到目前为止，你只处理过依赖于基础命名空间（即 `System`）的小应用程序。当你开始构建更复杂的程序时，自定义命名空间对你的类型的重要性将变得显而易见。你还应该知道，定义自定义命名空间比拥有大量的\
  \ `dll` 程序集更有益处，因为你的合作伙伴最终需要一种引用该库的方法来使用你创建的类型。这涉及到导入自定义命名空间。\n\n为了说明自定义命名空间的重要性，我们将创建一个名为\
  \ `MyCustomNamespaces` 的新项目。假设我们正在构建一组动物类，包括 `Cat`（猫）、`Dog`（狗）和 `Ferret`。由于它们有一些相似之处，我们应该将它们分组到一个名为\
  \ `MyAnimals` 的命名空间下。该命名空间属于 `MyCustomNamespaces` 程序集。现在我们有两个选择：将我们的类定义在一个名为 `AnimalsLib.cs`\
  \ 的单文件中，如下所示：\n\n```csharp\n// AnimalsLib.cs using System;\n\nnamespace MyAnimals\n\
  {\n    // Cat class \n    public class Cat\n    { /* A collection of members...\
  \ */ }\n\n    // Dog class \n    public class Dog\n    { /* Another collection of\
  \ members... */ }\n\n    // Ferret class \n    public class Square\n    { /* Another\
  \ collection of members... */ } \n}\n```\n\n记住，编译器在处理包含我们所有类型的单个代码文件时不会有问题，但当你尝试重用类定义以供另一个项目使用时，你会遇到一些问题。例如，你可能在一个新项目中需要\
  \ `Cat` 类的功能。当每一个类型都定义在一个文件中时，你必须处理整个 set 的类。这就是选择替代方案的原因：将命名空间划分到不同的代码文件中。你只需要确保通过将所有类型包装在相同的命名空间定义中，使所有类型都封装在适当的逻辑集合中。让我们来说：\n\
  \n```csharp\n// Cat.cs using System;\n\nnamespace MyAnimals\n{ \n    // Cat class\
  \  \n    public class Cat\n    { /* A collection of methods... */ }\n}\n\n// Dog.cs\
  \ using System;\n\nnamespace MyAnimals\n{ \n    // Dog class  \n    public class\
  \ Dog { /* Another collection of methods... */ } \n}\n\n// Ferret.cs using System;\n\
  \nnamespace MyAnimals\n{ \n    // Ferret class  \n    public class Ferret\n    {\
  \ /* A collection of methods... */ }\n}\n```\n\n通过这两种方案，你可以看到 `MyAnimals` 命名空间充当了包含类的抽象包。当我们处理需要访问另一个命名空间中类型的不同命名空间时，我们必须使用\
  \ `using` 关键字。\n\n```csharp\n// 从公共类库导入命名空间的示例。\n\nusing System;\n\n// 使用定义在 MyAnimals\
  \ 命名空间内部的类型。\nusing MyAnimals;\n\nnamespace MyCustomNamespaces\n{\n    public class\
  \ Program\n    {\n        static void Main (string[] args)\n        {\n        \
  \    Dog d = new Dog();\n            Cat c = new Cat();\n            Ferret f =\
  \ new Ferret();\n        }\n    }\n}\n```\n\n在上面的示例中，我们假设定义 `My Animals` 命名空间的代码文件是持有定义\
  \ `MyCustomNamespaces` 文件的程序组件。我们实际上谈论的是编译可执行程序集所需的所有文件。只需记住，当你在外部程序集中定义 `MyAnimals`\
  \ 命名空间时，在编译过程发生之前，必须为库提供引用。我们将在本章的后续章节进一步讨论这个主题。\n\n### 使用全限定名称解决命名冲突\n\n知道，当你引用定义在外部命名空间内部的类型时，并不总是应用\
  \ `using` 关键字。你可以使用类型的完整名称，如下：\n\n```csharp\n// 注意，这次我们不需要导入 MyAnimals 命名空间。\n\n\
  using System;\n\nnamespace MyCustomNamespaces\n{\n    public class Program\n   \
  \ {\n        static void Main(string[] args)\n        {\n            MyShapes.Dog\
  \ d = new MyAnimals.Dog();\n            MyShapes.Cat c = new MyAnimals.Cat();\n\
  \            MyShapes.Ferret f = new MyAnimals.Ferret();\n        }\n    }\n}\n\
  ```\n\n通常你不需要使用完整名称，因为不会提高代码质量或执行速度。CIL 代码使用全限定名定义类型，但 C# 的 `using` 关键字可以帮助你避免重复输入。使用全名有其优势；它可以帮助你避免由于多个命名空间共享相同名称而产生的冲突。例如，如果你有另一个名为\
  \ `MyMammals` 的命名空间并定义了三个类：\n\n```csharp\nusing System;\n\nnamespace MyMammals\n\
  {\n    // Cat class.\n    public class Cat { }\n    // Dog class.\n    public class\
  \ Dog { }\n    // Ferret class.\n    public class Ferret { }\n}\n```\n\n我们将用接几行更新\
  \ `Program` 类。注意由于两个命名空间共享相同名称类而出现的编译时错误。\n\n```csharp\nusing System;\nusing MyAnimals;\n\
  using MyMammals;\n\nnamespace MyCustomNamespaces\n{\n    public class Program\n\
  \    {\n        static void Main(string[] args)\n        { \n            // 对我们引用的命名空间感到困惑\n\
  \            Dog d = new Dog();\n            // 我们收到了编译器错误！\n            Cat c =\
  \ new Cat();\n            // 我们收到了编译器错误！\n            Ferret f = new Ferret();\n\
  \        }\n    }\n}\n```\n\n为了解决这个问题，我们需要使用全限定名：\n\n```csharp\n// 解决命名冲突\n\nstatic\
  \ void Main(string[] args)\n{\n    MyAnimals.Dog d = new MyAnimals.Dog();\n    MyAnimals.Cat\
  \ c = new MyAnimals.Cat();\n    MyAnimals.Ferret f = new MyAnimals.Ferret();\n}\n\
  ```\n\n\n\n\n注意，在 Visual Studio 中工作时，程序的命名空间名称默认为项目名称。这意味着你必须从 `Project > Add New\
  \ Item` 菜单添加后续代码，以便在默认命名空间中自动插入新类型。要重命名命名空间，你应该点击从 `Properties` 选项卡访问的应用程序面板中的 `Default\
  \ Namespace` 选项。从今以后，添加到你的项目中的所有内容都将成为 `Tutorial` 根命名空间以及使用它们的其他命名空间的一部分。\n\n现在，让我们讨论一下\
  \ .NET 程序集及其优势。\n\n## .NET 程序集的目的\n\n.NET 程序通过链接多个程序集创建。程序集可以被视为托管在 `CLR` 内的二进制文件。像\
  \ `.exe` 和 `.dll` 这样的普通二进制文件与使用相同扩展名的旧二进制文件并没有太大共同之处。因此，为了理解它的工作原理，我们必须讨论程序集结构的优势：\n\
  \n1. **代码复用性**：在 `C#` 中进行编程时，你可能认为你的程序是可执行程序集的一部分，但事实并非如此。你构建的程序依赖于 .NET 库内部的多个类型，或者\
  \ `mscorlib.dll` 和 `System.Core.dll`。调用库以 `.dll` 文件的形式提供，包含了各种外部程序所需的所有类型。因此，当我们开发一个可执行程序集时，我们都依赖系统库和自定义库来构建应用程序。注意，类库并不一定包含\
  \ `.dll` 扩展。程序集也可以使用可执行文件中的各种类型。.NET 框架允许我们复用任何类型，不受语言限制，无论我们是如何封装该库的。例如，可以使用 `C#`\
  \ 构建一个新库，并在另一个 .NET 语言中使用它。我们还从这些语言中派生类型。例如，在 `C#` 中定义的基类可以由使用 `Basic` 创建的类进行扩展。在\
  \ `F#` 中定义的接口可以集成到任何 `C#` 结构中。当将可执行文件反汇编译为程序集集合时，我们得到的代码不依赖于特定语言，并且可以以多种方式复用。\n\n\
  2. **可版本化单元**：程序集被认为是可版本化的单元，这意味着它们被分配了由四个部分组成的版本号：`<major>.<minor>.<build>.<revision>`。如果你没有指定版本，你的程序集将被设置为版本\
  \ `1.0.0.0.0`。为什么这很重要？这意味着我们可以使用带有公钥值的版本号，允许同一个程序集的不同版本在机器上协同工作。\n\n3. **类型边界**：类型的全名是由添加到其名称的命名空间前缀构建的。程序集还提供了关于标识类型的信息。假设我们有两个程序集，`MyBirds`\
  \ 和 `YourBirds`，它们都定义在相同的命名空间 `BirdLibrary` 中，并且包含 `Raven` 类。在 .NET 中，这些是唯一的类型。\n\
  \n4. **自描述性**：程序集被认为是自描述的，因为它们记录了为了实现目标而需要访问的所有外部程序集。这意味着如果程序集需要访问 `System.Windows.Forms`\
  \ 和 `System.Core` 库，依赖项将列在程序集的清单（manifest）中。清单就是所谓的包含名称、版本等描述性信息的元数据集合。此外，我们还有包含程序集内容信息的元数据，如接口、类、构造函数以及每个种类型的成员。程序集的文档非常详尽，以至于\
  \ `CLR` 不需要检查系统注册表来查找外部库的位置。\n\n5. **程序集可以配置**：程序集可以设置为私有和共享。私有程序集位于依赖它的程序的相同目录中。另一方面，共享程序集被同一系统中的多个程序使用。它们需要成为全局程序集缓存目录的一部分。如既往，你可以编辑和编写配置文件；无论它们是如何部署的。这样，你可以告诉\
  \ `CLR` 在特定位置搜索程序集或加载特定版本。\n\n## 总结\n\n在本章中，我们学习了 .NET 类库、定义自定义命名空间以及嵌套命名空间。我们讨论了如何解决处理多个命名空间时产生的冲突。你学得越多，就越能够配置应用程序的每个细节，以便尽可能地维护它。在下一章中，我们将讨论反射和后期绑定。\n\
  \n# 第 3 章：\n\n## 类型反射与后期绑定\n\n将程序集视为任何涉及 .NET 部署的基础组件。我们可以使用 Visual Studio 的对象浏览器和类似工具探索应用程序程序集引用内部的类型。诸如\
  \ `ildasm.exe` 之类的外部程序，允许我们检查元数据、CIL 代码和程序集清单。另一种方法是通过 `System.Reflection` 命名空间提取数据。\n\
  \n本章将探索反射的概念和元数据的重要性。我们还将查看与反射相关的某些主题。例如，我们将看到 .NET 客户端如何使用后期绑定来激活从编译角度来看未知的类型。\n\
  \n### 类型元数据\n\n元数据非常重要，因为它通过提供有关所有类、结构体、枚举、接口和委托的信息来描述我们的类型。许多属于 .NET 的工具都可以利用这些信息。例如\
  \ Windows 通信框架（Windows Communication Foundation），它需要在运行时知道类型格式。还有几个编译器工具和 IntelliSense。它们都需要知道类型描述。\n\
  \n我们使用键盘快捷键 `Ctrl + M` 打开已构建的程序集之一，通过 `ildasm.exe` 检查类型的元数据。看看发生了什么。\n\n注意元数据中有多少信息（或内容）。这不是你写在书里的东西。它非常多。我们制作的简单程序集的信息可能包含多个页内容。\n\
  \n```\nTypeDef #2 (0200003)\nTypDefName: CarLibrary.EngineState (0200003)\nFlags:\
  \ [Public] [AutoLayout] [Class] [Sealed] [AnsiClass] (00000101)\nExtends: 01000001\
  \ [TypeRef] System.Enum\nField #1 (04000006)\nField Name: value__ (04000006)\nFlags:\
  \ [Public] [SpecialName] [RTSpecialName] (00000606)\nCallCnvntn: [FIELD]\nField\
  \ type: I4\nField #2 (04000007)\nField Name: engineAlive (04000007)\nFlags: [Public]\
  \ [Static] [Literal] [HasDefault] (00008056)\nDefltValue: (I4) 0\nCallCnvntn: [FIELD]\n\
  Field type: ValueClass CarLibrary.EngineState\n```\n\n在上面的示例中，`TypDefName` 决定了类型的名称，即\
  \ `CarLIbrary.EngineState`。`Extends` 行描述了所有 .NET 类型的基类型。它记录了一个名为 `System.Enum` 的引用类型。这意味着我们将元数据总结为描述所有类型定义和引用类型的表格化集合。\n\
  \n### 反射\n\n\n\n\n反射涉及运行时类型发现；我们可以使用 `ildasm.exe` 工具来获取在前面的章节中获得的信息。例如，我们可以检索程序集中所有类型的列表。该列表将包含类型定义的所有内容，如方法、属性和字段。我们还可以获取有关具有特定支持的接口的信息以及与它们方法相关的细节，例如命名空间和类。让我们以\
  \ `System.Reflection` 为例。以下是你需要了解的项：\n\n1. `Assembly`：它是一个抽象类，包含成员集合，允许我们加载、观察和操作程序集。\n\
  2. `AssemblyName`：该类允许我们了解有关程序集身份的信息，例如程序集的版本。\n3. `EventInfo`：包含关于特定事件的细节。\n4.\
  \ `FieldInfo`：包含关于特定字段的信息。\n5. `MethodInfo`：包含关于特定方法的细节。\n6. `ParameterInfo`：包含关于某些参数的细节。\n\
  7. `PropertyInfo`：提供关于属性的信息。\n8. `MemberInfo`：它决定了 `EventInfo`、`FieldInfo`、`MemberInfo`\
  \ 和 `PropertyInfo` 类的行为。\n9. `Module`：这允许我们访问由许多文件构成的程序集中的特定模块。\n\n为了学习如何使用命名空间来读取元数据（Metadata），我们将探索\
  \ `System.Type` 类。\n\n`System.Type` 用于查找我们可以访问的成员数量，以便我们探索元数据。大多数成员返回来自 `reflection`\
  \ 命名空间的类型。其中一个例子是 `Type.GetMethods`，它返回一个 `MethodInfo` 项数组。这样的成员列表非常长。你可以阅读 .NET\
  \ SDK 文档来了解它们。\n\n可以通过多种方式获取类型类的实例。记住，你不能使用“new”关键字来构建类型对象，因为这是一个抽象类。我们的第一个选项是 `System.Object`，它定义了\
  \ `GetType` 方法。该方法将返回一个带有元数据的类实例。\n\n```csharp\n// 我们将使用 WildBird 实例来访问类型信息。\n\n\
  WildBird wb = new WildBird();\n\nType t = sc.GetType();\n```\n\n请注意，只有当你拥有要反射的类型的编译时信息时，此方法才有效。在这种情况下，该类型是\
  \ `WildBird`。你必须在内存中拥有它的实例。\n\n这是具有局限性的。你现在可以理解为什么像 `ildasm.exe` 这样的工具不会通过直接调用 `GetType`\
  \ 来检索数据。默认情况下，这些工具不会在自定义创建的程序集中编译。\n\n我们可以用于获取此数据的另一个选项是“typeof”运算符，如下所示：\n\n```csharp\n\
  // 使用 typeof。\n\nType t = typeof (WildBird);\n```\n\n该运算符不需要你构建正尝试获取信息的对象的实例。你的代码库只需要具有编译时信息。`typeof`\
  \ 需要一个强类型名称，请记住这一点。\n\n获取信息的更灵活的方法是调用 `GetType`，它是 `System.Type` 的一部分。在这种情况下，需要你想要访问的类型的全限定名。与另外两个选项不同，我们不需要编译时知识，因为\
  \ `Type.GetType` 会获取 `System.String` 的实例。该方法是可重载的，因此我们可以设置布尔值。其中一个参数将控制在找不到类型时抛出异常的方式。第二个参数确保我们设置字符串的大小写敏感性。让我们来看例子：\n\
  \n```csharp\n// 使用静态 Type.GetType() 方法获取类型信息。\n\n// 确保在未找到 WildBird 时不抛出异常，忽略大小写。\n\
  \nType t = Type.GetType (\"AnimalLibrary.WildBird\", false, true);\n```\n\n在前面的示例中，通过\
  \ `GetType` 的字符串没有确认包含类型的程序集。在这个示例中，我们假设类型位于正在操作的程序集内部。这意味着当我们需要时，可以轻松从外部私有程序集访问元数据。\n\
  \n幸运的是，我们可以通过使用类型的全限定名格式化字符串参数，后跟主机程序集的名称来获取它。它看起来如下：\n\n```csharp\n// 获取外部程序集内部找到的类型信息。\n\
  \nType t = Type.GetType (\"AnimalLibrary.WildBird, AnimalLibrary\");\n```\n\n我们还可以添加加号符号来表示嵌套类型。例如，假设我们想从嵌套在任何类中的枚举中获取类型信息。你可以这样操作：\n\
  \n```csharp\nType t = Type.GetType (\"AnimalLibrary.WildBirds+Species\");\n```\n\
  \n你现在应该已经有了关于使用 `System.Reflection` 命名空间的核心成员在运行时检索元数据的足够知识。反射服务是某些编程概念（如晚绑定）的基础。\n\
  \n### Late Binding（晚绑定）\n\n晚绑定允许我们在运行时设置特定类型的实例并调用其任何成员。你不需要对实例的存在具有编译时知识。这意味着一个晚绑定到属于外部程序集的任何类型的程序不需要引用该程序集。\n\
  \n程序员经常忽略晚绑定，因为发现应用到对象上的优势需要花费精力。建议对对象进行早绑定。例如，较优的做法是添加对程序集的引用并使用“new”关键字指定类型。早绑定允许你在编译期间而不是运行时发现错误。但是，如果你正在创建一个计划要扩展的程序，晚绑定仍然起着重要作用。在我们继续之前，让我们讨论\
  \ `activator` 类。\n\n#### Activator 类\n\n晚绑定依赖于 `System.Activator` 类，它是基础库的一部分。为了说明，我们将创建一个\
  \ `LateBindApp` 并导入命名空间：`System.IO` 和 `System.Reflection`。这里是程序类：\n\n```csharp\n\
  // 我们将使用晚绑定设置并加载外部库。\npublic class Program\n{\n    static void Main (string[] args)\n\
  \    {\n        Console.WriteLine (\"++++ Late Binding is ++++\");\n        // 尝试加载\
  \ AnimalLibrary 的本地副本。\n        Assembly a = null;\n        try\n        { \n  \
  \          a = Assembly.Load (\"AnimalLibrary\"); \n        }\n        catch (FileNotFoundException\
  \ ex)\n        { \n            Console.WriteLine (ex.Message); \n            return;\n\
  \        }\n        if(a != null) \n            CreateUsingLateBinding(a);\n   \
  \     Console.ReadLine();\n    }\n\n    static void CreateUsingLateBinding (Assembly\
  \ asm)\n    {\n        try\n        { \n            // 获取 Raven 类型的元数据。\n      \
  \      Type raven = asm.GetType(\"AnimalLibrary.Raven\");\n            // 设置一个快速\
  \ Raven 实例。\n            object obj = Activator.CreateInstance(raven); \n      \
  \      Console.WriteLine(\"Created a {0} using late binding!\", obj); \n       \
  \ } \n        catch(Exception ex)\n        { \n            Console.WriteLine(ex.Message);\n\
  \        }\n    }\n}\n```\n\n我们现在不能执行该程序。首先，我们需要将 `AnimalLibrary.dll` —— 或者你创建的任何文件\
  \ —— 放入应用程序中。这样做是因为我们正在调用 `Assembly.Load` 方法，这意味着 CLR 将对文件夹进行扫描。\n\n注意 `CreateInstance`\
  \ 方法返回的是 `object` 而不是强类型的 `Raven`，这意味着当对 `obj` 变量应用点运算符时，你将看不到属于 `Raven` 类的成员。你如何修复这个问题？你考虑过显式转换吗？让我们看看：\n\
  \n```csharp\n// 通过转换访问 Raven 的成员\nobject obj = (Raven)Activator.CreateInstance(raven);\n\
  ```\n\n// 结果成功了吗？没有。我们现在有一个编译错误。\n\n\n\n\n注意应用程序并没有对 `AnimalLibrary.dll` 的引用。这意味着无法使用\
  \ `using` 关键字来导入 `AnimalLibrary` 命名空间，意味着我们无法使用显式转换。我们可以得出结论：后期绑定（late binding）的目的是在未知编译时的情况下设置对象的实例。你可能在想，如何在\
  \ `System.Object` 引用内部调用 `Raven` 对象的方法。答案是反射（reflection）。\n\n## 调用方法\n\n假设我们的 `Raven`\
  \ 类有一个名为 `Flight` 方法，该方法在显示消息的同时会将翅膀的状态设置为“不可移动”。为了提取该方法的 `MethodInfo`，我们必须使用类型方法\
  \ `GetMethod`。一旦获取了该信息项，就可以使用 `Invoke` 调用飞行方法。`MethodInfo.Invoke` 的要求是传输由 `MethodInfo`\
  \ 特征的方法所需的参数。请记住，参数是由 `System.Object` 的类型数组描述的。`Flight` 方法不需要任何参数，所以我们只需要传递一个 `null`\
  \ 值。现在，让我们来看：\n\n```csharp\nstatic void BuildWithLateBinding(Assembly asm)\n{\n\
  \    try\n    {\n        // 获取我们 Raven 类型的元数据。\n        Type raven = asm.GetType(\"\
  AnimalLibrary.Raven\");\n\n        // 设置 Raven。\n        object obj = Activator.CreateInstance\
  \ (raven);\n        Console.WriteLine(\"Created a {0} with late binding!\", obj);\n\
  \n        // 获取 Flight 的信息。\n        MethodInfo mi = raven.GetMethod(\"Flight\"\
  );\n\n        // 调用无任何参数的方法。\n        mi.Invoke(obj, null);\n    }\n    catch(Exception\
  \ ex)\n    {\n        Console.WriteLine(ex.Message);\n    }\n}\n```\n\n你将看到调用 `Flight`\
  \ 方法后消息是如何呈现的。每当你使用后期绑定调用一个不需要参数的方法时，你都需要将参数分组在一个项数组中。话虽如此，以下是在 `Animal` 类中定义的 `AnimalLibrary`\
  \ 方法：\n\n```csharp\npublic void EnableFlight (bool flightOn, WingsFlapping wf)\n\
  {\n    public void EnableFlight (bool flightOn, WingsFlapping wf)\n    => MessageBox.Show\
  \ (flightOn ? $\"Flapping hard{wf}\" : \"Calmly...\");\n}\n```\n\n这里我们有一个两个参数的方法：一个布尔值，用于决定鸟类是否飞行；一个枚举，用于决定飞行的类型。\n\
  \n让我们看看另一个属于 `Program` 类的调用 `EnableFlight` 的方法。看看我们是如何使用枚举中的值来提到“快速”这种飞行类型的。\n\n\
  ```csharp\nstatic void InvokeMethodWithArgsWithLateBinding (Assembly asm)\n{\n \
  \   try\n    {\n        // 第一步是获取鸦的元数据描述。\n        Type corvid = asm.GetType(\"\
  AnimalLibrary.Crow\");\n\n        // 接下来，我们需要设置鸦。\n        object obj = Activator.CreateInstance(corvid);\n\
  \n        // 带参数调用 EnableFlight()。\n        MethodInfo mi = corvid.GetMethod(\"\
  EnableFlight\");\n        mi.Invoke(obj, new object[] { true, 2 });\n    }\n   \
  \ catch (Exception ex)\n    { \n        Console.WriteLine(ex.Message);\n    }\n\
  }\n```\n\n现在你应该能够看到反射、后期绑定和动态加载之间的联系。还有我们没有讨论过的反射 API。你现在可以自己查看它了。\n\n## 总结\n\n\
  反射是一个有趣的特性，尤其是在健壮的面向对象构建中。在本章中，我们看到了这个概念是如何围绕 `Type` 类和 `reflection` 命名空间的。它涉及到在运行时进行研究和探测，以回答关于对象的谁、什么、何地和为什么的问题。后期绑定涉及到在不知道成员名称的情况下设置特定类型的变体并调用其成员。该概念与动态加载有关，动态加载允许你将程序集加载到内存中。\n\
  \n让我们转向围绕属性（attributes）的概念。\n\n# 第 4 章：\n\n## 基于属性的编程\n\n.NET 编译器的目的之一是为每个定义或引用的类型创建元数据。此外，.NET\
  \ 为程序员员提供了一种在程序集中嵌入自定义元数据的方法。这是通过属性实现的。属性是使用在特定类型（类、接口、成员、方法、属性或程序集）上的一系列注解。\n\n\
  属性是扩展了 `System.Attribute` 类的类类型。一旦你熟悉了更多的命名空间，你将看到在项目中可以实现的大量属性。如果你愿意，也可以开发自定义属性。这些将允许你对类型进行完全控制。你还能够从属性中构建新类型。让我们看看基类库中找到的属性。请记住，我们不会列出所有属性，我们将关注最流行的。\n\
  \n1. `CLSCompliant`：此属性强制被注解的对象遵循通用语言规范。注意，遵循 CLS 规范的类型可以在任何 .NET 编程语言中使用。\n2. `DllImport`：此属性允许你的代码调用基于\
  \ C 和 C++ 的库。这包括操作系统 API。然而，在处理 COM 相关的应用程序时会避免使用此属性。\n3. `Obsolete`：此属性标识不再使用的元素。尝试使用这些对象之一将给你带来编译器警告。\n\
  4. `Serializable`：此属性为类标记可序列化标记，意味着它将被转换为字节流以传输到文件或内存中。\n\n要晓，当属性被使用时，嵌入的元数据将被另一个组件反射，否则不会影响任何。\n\
  \n### 属性消费者\n\n.NET 框架带有遵循属性的工具和实用程序。例如，编译器执行之一是查找属性。这发生在编译过程中。假设编译器遇到了 `CLSCompliant`\
  \ 属性。它将验证属性项是否符合 CLS 规范。如果我们有一个带有 `Obsolete` 属性的对象，编译器会显示警告。但并不是所有的开发工具都内置了该功能。\n\
  \n属于基类库的方法准备好反射大量的属性。例如，当你想要将对象的状态带到文件时，你将类标记为 `Serializable` 属性。当 `Serialize` 方法检测到属性时，文件以二进制格式持久化。要晓，当你编写程序时，你可以让它反射自定义属性和已有的属性。你能够构建一个可以被程序集读取的自定义关键字集合。\n\
  \n### 属性实例\n\n为了可视化属性是如何实现的，我们将创建一个小型应用程序。将其命名为 `AttributesInAction`。我们将处理一个名为 `Warrior`\
  \ 的类，它可以以二进制格式持续。我们必须使用 `Serializable` 属性。要晓我们也可以使用 `NonSerialized` 属性来避免拥有持久化字段。代码如下：\n\
  \n```csharp\n// 将我们创建的类保存到文件中。\n[Serializable] public class Warrior\n{\n    // 下一个字段不会被序列化。\n\
  \    [NonSerialized] float strengthOfWarrior;\n\n    // 下一个字段将保持可序列化。\n    bool\
  \ hasSword;\n    bool hasDagger;\n    bool hasArmor;\n}\n```\n\n\n\n\n一个对象可以拥有多个属性。假设我们有一个名为\
  \ `HorseCarriage` 的旧类，被标记为 `serializable`，但它也是一个过时的项。此时不需要删除该类的定义。当你从代码库中删除内容时，会有损坏项目的风险。更明智的做法是用\
  \ `Obsolete` 属性将其标记为过期。以下是操作方法：\n\n```csharp\n[Serializable, Obsolete (\"升级你的交通工具！\"\
  )]\npublic class HorseCarriage {  // ... }\n```\n\n你也可以通过将属性分别放在它们自己的括号中来实现相同的操作：\n\
  \n```csharp\n[Serializable]\n[Obsolete (\"升级你的交通工具！\")]\npublic class HorseCarriage\
  \ {  // ... }\n```\n\n该属性的类名是 `ObsoleteAttribute`，而不是 `Obsolete`。在 .NET 命名规范中，所有属性默认都附加了\
  \ `Attribute` 关键字。正因如此，你不需要每次使用它时都手动输入它——C# 可以识别出你在做什么。如果你认为这会让你的代码更具可读性，可以使用这种命名系统。如下所示：\n\
  \n```csharp\n[SerializableAttribute]\n[ObsoleteAttribute (\"升级你的交通工具！\")]\npublic\
  \ class HorseCarriage {  // ... }\n```\n\n如果你将与其他 .NET 语言一起，请考虑坚持带有 `Attribute`\
  \ 后缀的命名规范。并不是所有语言像 C# 那么细心。\n\n### 构造函数参数\n\n`Obsolete` 属性可以接受构造函数参数。在代码编辑器中右键点击对象并查看属性的定义。选择“转到定义”。你会发现该属性接受\
  \ `System.String`。\n\n```csharp\npublic sealed class ObsoleteAttribute : Attribute\n\
  {\n    public ObsoleteAttribute (string message, bool error);\n    public ObsoleteAttribute(string\
  \ message);\n    public ObsoleteAttribute();\n    public bool IsError { get; }\n\
  \    public string Message { get; }\n}\n```\n\n记住，当你在属性上使用构造函数参数时，应首先由外部工具进行反射（reflection），以便属性能够分配内存。字符串信息将存储在程序集的元数据中。现在我们有了这个过时的类，可以分配这样的变体：\n\
  \n```csharp\nstatic void Main(string[] args)\n{\n    HorseCarriage horse = new HorseCarriage();\n\
  }\n```\n\n你可以看到当光标悬停在过时类型上时，字符串数据如何在错误列表面板和问题代码行中被检索并显示。\n\n我们可以得出以下几点：\n\n1. 属性是作为\
  \ `System.Attribute` 部分的类。\n2. 在对象或工具对它们进行反射之前，它们什么也做不了。\n3. 它们创建了嵌入元数据。\n4. 它们使用方括号进行应用。\n\
  \n我们已经查看了预定义属性。让我们如何自定义属性并应用它们。\n\n### 创建和应用自定义属性\n\n要创建一个属性，我们必须首先定义一个派自 `System.Attribute`\
  \ 的类。我们将通过坚持动物主题示例来说明本节的要点，并构建一个名为 `AttributedAnimalLibrary` 的新类库项目。我们将拥有一个新的程序集，其目的是定义动物的数量。每个动物将用一个自定义属性进行描述：\n\
  \n```csharp\npublic sealed class AnimalDescriptionAttribute : System.Attribute\n\
  {\n    public string Description { get; set; }\n    public AnimalDescriptionAttribute\
  \ (string animalDescription) => Description = animalDescription;\n    public AnimalDescriptionAttribute(){\
  \ }\n}\n```\n\n在示例中，`AnimalDescriptionAttribute` 保留了通过 `Description`（一个自动属性）处理的一段字符串数据。该类派自\
  \ `System.Attribute`；其定义并没有特殊之处。但由于潜在的安全风险，建议将所有自定义属性都创建为 `sealed`（密封的）。\n\n现在我们按照自己的意对类型进行注解。让我们在刚刚创建的库中添加一些类定义：\n\
  \n```csharp\n// 我们需要使用命名属性来分配描述。\n[Serializable] [AnimalDescription(Description\
  \ = \"我那匹疲惫的老马\")]\npublic class Horse { }\n\n[Serializable] [Obsolete (\"去买车吧！\"\
  )]\n[VehicleDescription(\"我的公马太老了，不行了…… \")]\npublic class Volvo { }\n\n[VehicleDescription(\"\
  一辆装满新功能的全新汽车\")]\npublic class Dodge { }\n```\n\n马的描述添加了一个基于属性的元素，该元素是一个命名属性。\n\n\
  `Description` 属性被用作 `Vehicle Description` 属性的构造函数，在那里准备字符串数据。当外部因素对属性进行反射时，值会被传递给\
  \ `Description` 属性。同样，我们有两个没有使用该属性的类型，即 `Volvo` 和 `Dodge`。无论如何，当编译 `AttibutedAnimalLibrary`\
  \ 时，我们可以使用 `ildasm.exe` 工具访问任何类型的元数据。这将显示所有类的嵌入式描述。\n\n### 程序集级别的属性\n\n属性可以使用 `[assembly:]`\
  \ 标签应用于属于该程序集的任何类型。假设我们需要保证属于公共类型的所有成员都定义在程序集中，并且符合 CLS 规范。记住，符合 CLS 规范的程序集将在每个\
  \ .NET 编程语言中运行。这意味着如果你有几个不符合 CLS 规范的公共成员，其他 .NET 相关语言将无法依赖它们。这些示例包括指针参数和无符号数据。在这种情况下，你需要通过验证它们的\
  \ CLS 合规性，确保你创建的库可以被其他语言使用。\n\n要检查合性，你需要在代码开头一个特定的程序集级属性。程序集级属性需要在命名空间范围之外。以下是你需要遵循的模式：\n\
  \n```csharp\n// 首先，我们需要创建一小段 using 声明。\nusing System;\nusing System.Collections.Generic;\n\
  using System.Linq;\nusing System.Text;\n\n// 下一步是声明程序集级属性。\n// 注意，对于此程序集中的每一个公共类型\n\
  // 必须实施 CLS 合规性。\n[assembly: CLSCompliant(true)]\n\n// 然后，我们需要类型和命名空间。\nnamespace\
  \ AttributedAnimalLibrary {  // 类型... }\n```\n\n记住，如果你开始编写不符合 CLS 规范的代码，你会看到编译器警告。\n\
  \n```csharp\n// CLS 不接受 Ulong 类型。\npublic class Volvo {  public ulong notCompliant;\
  \ }\n```\n\n\n\n当你导航到 Visual Studio 的解决方案管理器并展开属性选项卡时，你会发现所有项目包含一个名为 `AssemblyInfo.cs`\
  \ 的文件。你可以使用它在文件中放置所有所需的程序集级属性。注意，清单持有来自以下属性的元数据：\n\n1. `AssemblyCompany`：该属性包含公司的所有信息。\n\
  2. `AssemblyCopyright`：该属性为特定项目提供版权信息。\n3. `AssemblyCulture`：该属性持有程序集支持的语言信息。\n\
  4. `AssemblyDescription`：该属性描述产品。\n5. `AssemblyVersion`：该属性提供程序集的版本号。版本格式如下：`<major.minor.build.revision>`。\n\
  \n还有许多其他属性。要了解更多信息，请参阅文档。\n\n#### 使用早期绑定反射属性\n\n\n\n\n如果没有其他组件反映其属性值，那么属性就没太大用处。只有当某个属性是已知的，软件组件才能对其进行利用或操作。尽管如此，软件元素通常可以通过之前讨论的技术找到该属性：晚绑定和早期绑定。这意味着只要应用程序可以访问属性的编译时定义，你就可以使用早期绑定。`AttributedAnimalLibrary`\
  \ 程序集包含一个自定义属性的定义。这是因为该属性的定义方式类似于公共类。最好的方法是使用早期绑定。\n\n话虽如此，让我们设置一个名为 `AnimalDescriptionAttributeReader`\
  \ 的新项目，并引用 `AttributedAnimalLibrary`。我们首先向原始的 `.cs` 文件中添加以下代码：\n\n```cs\n// 使用早期绑定来反射属性。\n\
  \nusing System;\n\nusing System.Collections.Generic;\nusing System.Linq;\nusing\
  \ System.Text;\nusing AttributedAnimalLibrary;\n\nnamespace AnimalDescriptionAttributeReader\n\
  \n{\n\nclass Program\n{\nstatic void Main(string[] args)\n{ \nConsole.WriteLine\
  \ (\"*****AnimalDescriptionAttribute Value*****\\n\");\n\nReflectOnAttributesUsingEarlyBinding();\n\
  \nConsole.ReadLine();\n}\n\nprivate static void ReflectOnAttributesUsingEarlyBinding()\n\
  { \n// 我们需要获取一个代表马的类型。\nType t = typeof(Horse);\n\n  // 获取所有马的属性。 \nobject[] customAtts\
  \ = t.GetCustomAttributes(false);\n\n // 打印描述。     \nforeach (AnimalDescriptionAttribute\
  \ v in customAtts)  \nConsole.WriteLine(\"-> {0}\\n\", v.Description);\n}\n}\n\n\
  }\n```\n\n值得注意的是 `Type.GetCustomAttributes` 方法，它检索回一个项数组，该数组将包含应用到成员上的每个属性。成员由类型表示。在这种情况下，这是一个\
  \ `Boolean` 参数，用于确定搜索的范围。当检索到属性列表时，我们遍历类并打印来自描述属性的值。\n\n### 使用晚绑定反射属性\n\n在早的章节中，我们讨论了如何使用早期绑定来打印马的描述数据。我们能够做到这一点是因为\
  \ `AnimalDescriptionAttribute` 类在 Attribute Animal Library 中被定义为一个公共成员。但是，通过引入晚绑定和动态加载来反射属性，我们可以实现更多功能。为了说明这一点，我们将创建一个名为\
  \ `AnimalDescriptionAttributeExploreLB` 的项目。对于此项目，我们需要复制 `AttributedAnimalLibrary`\
  \ 文件并将其粘贴到 `\\bin\\debug` 文件夹。让我们关注代码：\n\n```cs\nusing System;\n\nusing System.Collections.Generic;\n\
  using System.Linq;\nusing System.Text;\nusing System.Reflection;\n\nnamespace AnimalDescriptionAttributeExplorerLB\n\
  \n{\n\nclass Program\n{\nstatic void Main(string[] args)\n{ \nConsole.WriteLine(\"\
  *****AnimalDescriptionAttribute Value*****\\n\");\n\nReflectAttributesUsingLateBinding();\
  \ \n\nConsole.ReadLine();\n}\n\n private static void ReflectAttributesUsingLateBinding()\n\
  {\ntry \n{    \n// 我们需要加载 AttributedAnimalLibrary 的副本。      \nAssembly asm = Assembly.Load(\"\
  AttributedAnimalLibrary\");\n\n  // 从 AnimalDescriptionAttribute 中检索类型信息。\nType\
  \ animalDesc =\nasm.GetType(\"AttributedAnimalLibrary.AnimalDescriptionAttribute\"\
  );\n\n// 从 Description 属性中检索类型信息。\nPropertyInfo propDesc = animalDesc.GetProperty(\"\
  Description\");\n\n  // 从程序集从检索类型。\nType[] types = asm.GetTypes();\n\n// 为了提取 AnimalDescriptionAttributes\n\
  // 我们需要遍历每一个类型。\nforeach (Type t in types)\n{\nobject[] objs = t.GetCustomAttributes(animalDesc,\
  \ false);\n\n// 遍历所有 AnimalDescriptionAttribute 并\n// 使用晚绑定打印描述。\nforeach (object\
  \ o in objs)\n{\nConsole.WriteLine(\"-> {0}: {1}\\n\",\nt.Name, propDesc.GetValue(o,\
  \ null));\n}\n}\n}\ncatch (Exception ex)\n{ Console.WriteLine(ex.Message); }}}}\n\
  ```\n\n如果你一直在跟着学习，这段代码中的一切都很容易理解。代码是自解释的，如果你觉得有点困惑，可以看几次。唯一不同的是用于激活属性访问器的 `GetValue`\
  \ 方法。\n\n### 反射、晚绑定和自定义属性\n\n到目前为止，我们通过许多示例探索了这些概念和技术，但你可能会好奇它们在什么场景下应该实现。这种疑问完全正常，因为我们探索的是相当学术的编程方面。为了更好地理解这些内容如何帮助现实项目，你需要回顾理论。假设你是一个大团队中的程序员，正在编写一个需要满足以下条件的新程序。\n\
  \n程序必须能够被其他外部工具扩展。想想这意味着什么。想想我们使用的 IDE：`Visual Studio`。当它最初创建时，代码中留下了“门”，以允许第三方软件开发者添加他们自己的模块。在这种情况下，该\
  \ IDE 的开发者无法为尚未创建的外部程序集定义引用。他们是如何解决这些问题的？让我们来看看：\n\n1. 首先要记住，任何可扩展的程序都必须提供一个输入系统，使用户指示附加哪些模块。这部分需要动态加载。\n\
  2. 所有可扩展的程序都必须建立模块支持我们需要的功能的能力。例如，当我们有支持我们需要的功能的接口时。\n3. 我们最后需要的是晚绑定。查询特定接口的可扩展程序可以判断该类型是否可以激活。\n\
  \n### 总结\n\n在本章节中，我们主要查看了属性及其目的。我们查看了预定义属性以及创建和应用自定义属性的方法。我们查看了早期和晚绑的应用。只需记住，当你使用属性时，你会改进程序集的元数据。\n\
  \n# 第 5 章：CIL 和动态程序集\n\n在开发 .NET 程序时，你绝大多数时间都会使用 `C#`。毕竟，这是你阅读本书的原因，而且使用 `C#` 既又高效。如果你记得我们早的课程，就会知道编译器的作用是将\
  \ `.cs` 文件转换为 `CIL` 代码、元数据和程序集清单。有趣的是，`CIL` 是一门功能性编程语言，有它自己的语法和编译器。在本章中，我们将学习 `CIL`，它可以被认为是\
  \ .NET 的原生语言。我们将学习 `CIL` 指令、属性或操作码之间的区别。我们还将探索程序集的反向工程以及其他关注 `CIL` 的工具。你将获得在 `CIL`\
  \ 中声明类型、命名空间和成员的基础知识。\n\n### 为什么要关注 CIL？\n\n正如前面提到的，`CIL` 是 .NET 的原生语言。每当你使用 `visual\
  \ basic`、`F#` 或 `C#` 创建程序集时，编译器都会将其翻译为 `CIL`。就像任何语言一样，`CIL` 有它自己的语法和标记，因为它是一门完整的编程语言。因此，你可以使用\
  \ `CIL` 创建程序集并使用 `CIL` 的编译器 `ilasm.exe` 进行编译。\n\n尽管它并不流行，但 `CIL` 有很多巨大的价值。关于 `CIL`\
  \ 的知识越多，你在高级编程中的进展就越越容易。以下是你通过学习 `CIL` 获得的几个例子：\n\n\n\n\n\n1. 你将能够解构功能完整的程序集，编辑其代码，并将新版本重新编译为自定义\
  \ `.NET` 二进制文件。当你需要更改 `CIL` 以与各种 COM 功能相互操作时，这非常有用。\n\n2.get `CIL` 的知识将帮助你通过 `System.Reflection.Emit`\
  \ 命名空间创建动态程序集。该命名空间是一个允许你创建内存中程序集的 API，该程序集可以持久化到磁盘。如果你计划使用 C# 技能来开发工具，这将非常有用，因为你能够快速生成程序集。\n\
  \n3. 你将对 `CTS` 有深入的理解，特别是那些只能在 `CIL` 级别找到各种功能。注意，`CIL` 是唯一与 `.NET` 相关的编程语言，允许你控制\
  \ `CTS` 的每一个特性和功能。例如，你可以通过 `CIL` 定义全局成员和字段。记住，这在 C# 中是不被允许的。\n\n如果你仍然对学习 `CIL` 不确定，那没关系。如果你只想精通\
  \ C# 和 `.NET` 基础库，你不需要学习它。然而，`CIL` 提供了对编程更深层的理解，你可能会发现这趣。你可以将 `CIL` 与 C 程序员对汇编语言的知识相比较。优势在于，理解更深的程序员可以想出他们原本无法想到的先进原始解决方案。为了有机会成为编程大师，你应该尝试一下\
  \ `CIL`。\n\n本章的目的是教你 `CIL` 更高级的原理。我们不会从零开始探索语法。如果本章激发了你对该语言的兴趣，请查看此链接并下载官方文档：https://www.ecma-international.org/publications/standards/Ecma-335.htm\n\
  \n### CIL 指令、特性和操作码\n\n在探索像 `CIL` 这样的底层语言时，你会发现一些奇怪的术语和概念，它们看起来极其复杂，即使它们是熟悉的概念也是如此。为了说明，请看这个集合：\n\
  \n`{ new, private, public, get, enum, operator, this, unsafe}`\n\n一旦你看到它们，就知道它们是\
  \ C# 关键字。但，如果你挖掘得深一点，你会发现它们有不同的含义。例如，`enum` 定义了一个派自 `System.Enum` 的类型。`this` 关键字引用当前对象。`unsafe`\
  \ 决定了 `CLR` 是否可以直接观察代码块。`operator` 允许你创建一个隐藏方法，该方法只有在你使用特定运算符（如减号）时才会被调用。`CIL` 不仅仅定义关键字。编译器理解的符号被分为若干类，这些类又根据其含义进行分类。这些类别是\
  \ `CIL` 指令、特性（attributes）和操作码（opcodes，也称为操作代码）。所有这些类别都通过语法和标记描绘。现在，让我们看看每个类别扮演的角色：\n\
  \n1. **CIL 指令 (CIL Directives)**：描述程序集架构的 `CIL` 标记被称为指令。它们的目的是通知编译器如何在程序集中定义类型、成员和命名空间。指令可以通过它们如何用点（dot）前缀分隔来识别，如下：`.namespace`、`.method`\
  \ 等。当编译器面对一个包含单个命名空间指令和两个类指令的 `CIL` 文件时，它将创建一个定义了一个包含两个类类型的单一命名空间的程序集。\n\n2. **CIL\
  \ 特性 (CIL Attributes)**：通常，`CIL` 指令提供的描述数据不足以解释类型或成员的定义。正因如此，可以使用 `CIL` 特性指定许多指令来确定如何处理它们。例如，我们可以在类指令上添加\
  \ `public` 特性，同时带有 `extends` 特性和 `implements` 特性。`public` 特性将决定可见性类型，`extends` 特性描述基类，`implements`\
  \ 特性列出类型支持的接口。不应将 `CIL` 特性与 `.NET` 特性混淆，因为它们即使在概念上也是不同的。\n\n3. **CIL 操作码 (CIL Opcodes)**：在用\
  \ `CIL` 指令和和特性定义了命名空间类型之后，我们必须添加拼图的最后一块：实现的逻辑。这就是为什么我们需要操作代码。与其他底层编程语言类似，`opcodes`\
  \ 在语言上很难理解。这意味着当你加载字符串变量时，你将使用一个名为 `LoadString` 的操作码，但在 `CIL` 中，它应该是 `ldstr`。虽然可读性和发音可能是问题，但操作码仅在实现范围内使用。\n\
  \n如前所述，像 `ldstr` 这样的操作码对于实现特定类型的成员是必要的。但，这些标记本质上是代表二进制操作码的 `CIL` 助记符。所以，假设我们有一个如下编写的\
  \ C# 方法：\n\n```csharp\nstatic int Add (int x, int y)\n{\n    return x + y;\n}\n\
  ```\n\n两个数之和的操作码是 `0X58`。使用 `0X59` 操作码减去两个值。编译器以二进制信息块的形式处理 `CIL` 代码。这听起来很复杂，但所有的二进制操作码都可以用助记符代替编写。例如，在加法操作的情况下，我们可以使用\
  \ `add` 助记符代替 `0X58` 来相加。现在你已经看到了二进制和助记符之间的区别，你应该知道 `CIL` 反汇编器会自动二进制代码转换为对应的助记符。以下示例是我们的\
  \ `Add` 方法的 `CIL` 表示：\n\n```cil\n.method private hidebysig static int32 Add(int32\
  \ x, int32 y) cil managed\n{\n.maxstack 2\n.locals init ([0] int32 CS$1$0000)\n\
  IL_0000: nop\nIL_0001: ldarg.0\nIL_0002: ldarg.1\nIL_0003: add\nIL_0004: stloc.0\n\
  IL_0005: br.s\nIL_0007: ldloc.0\nIL_0008: ret\n}\n```\n\n\n\n\n当你看到这种方法是如何从 C# 编译器翻译为\
  \ CIL 的时，你会发现该方法将根据 `.locals` 指令为变量定义一个存储隔间。通过使用 `ldstr` 和 `stloc.o` CIL 操作码，字符串被加载并存储在变量内部。如你所知，第一个代表加载字符串（load\
  \ string）。第二个翻译为加载索引为 0 的局部参数（loading the local argument）。该索引的值通过 `ldloc.o` 操作码加载到内存中，然后通过\
  \ `ret` 操作码返回函数。\n\n现在你已经理解了 CIL 指令、操作码和属性，让我们结合实际应用来探索 CIL 编程吧。\n\n## 回向工程 (Round\
  \ Trip Engineering)\n\n我们已经知道 `ildasm.exe` 工具被用于检查生成的 CIL 代码，但你应该知道，它还可以从已加载的程序集中将加载的\
  \ CIL 导出到外部文件。当你拥有了 CIL 代码时，你可以对其进行编辑并重新编译——这是一个非常实用的功能。这被称为回向工程，在以下情况下非常有用：\n\n\
  1.  你丢失了程序集的源代码，但仍然需要修改它。\n2.  你面临一次糟糕的编译，它翻译了错误的 CIL，但你需要编辑代码库。\n3.  你正在为 COM 互操作性构建库，需要考虑各种\
  \ COM IDL 属性，但它们在翻译过程中消失了。\n\n为了说明这一点，我们将使用任何文本编辑器（记事本即可）创建一个名为 `HelloApp.cs` 的新文件，然后声明一个类类型。如果你愿意，可以在\
  \ Visual Studio 中设置一个控制台应用程序。如果你这样做了，必须移除 `AssemblyInfo` 文件，因为它会生成我们不需要的 CIL 代码。让我们来看看程序：\n\
  \n```csharp\n// 一个基础的 C# 控制台应用。\n\nusing System;\n\n// 类将不会封装在命名空间内。\n// 这将导致一个简单的\
  \ CIL 代码块。\nclass Program {  static void Main(string[] args)\n  {\n    Console.WriteLine\
  \ (\"Hello CILly!\");\n    Console.ReadLine();\n  }\n}\n```\n\n将文件保存到首选目录中。然后使用以下命令编译应用程序：\n\
  \n`csc HelloApp.cs`\n\n使用 `ildasm` 工具运行该文件。导航到 File（文件），然后选择 Dump（导出）菜单，将 CIL 代码保存到扩展名为\
  \ `.il` 的单独文件中。将文件保存在编译的位置。保持所有设置为默认值。此外，`ildasm` 工具在导出程序集数据时会创建一个 `.res` 文件。这是一个资源文件，你可以删除它或忽略它——我们用不到它。它包含了\
  \ CLR 安全数据，与我们的目的无关。\n\n现在，我们可以用任何文本编辑器查看 CIL 文件。它看起来应该是这样的：\n\n```il\n// 这里有我们引用的程序集。\n\
  .assembly extern mscorlib\n{\n.publickeytoken = (B7 7A 5C 56 19 34 E0 89 )\n.ver\
  \ 4:0:0:0\n}\n\n// 这里有我们自己的程序集。\n.assembly HelloApp\n{\n/**** 为了清晰起见移除 TargetFrameworkAttribute\
  \ 数据！ ****/\n.hash algorithm 0x00008004\n.ver 0:0:0:0\n}\n\n.module HelloApp.exe\n\
  .imagebase 0x00400000\n.file alignment 0x00000200\n.stackreserve 0x00100000\n.subsystem\
  \ 0x0003\n.corflags 0x00000003\n\n// 定义了 Program 类。\n.class private auto ansi beforefieldinit\
  \ Program\nextends [mscorlib]System.Object\n{\n.method private hidebysig static\
  \ void Main(string[] args) cil managed\n{\n// 该方法成为可执行文件的入口点。\n.entrypoint\n.maxstack\
  \ 8\nIL_0000: nop\nIL_0001: ldstr \"Hello CILly!\"\nIL_0006: call void [mscorlib]System.Console::WriteLine(string)\n\
  IL_000b: nop\nIL_000c: call string [mscorlib]System.Console::ReadLine()\nIL_0011:\
  \ pop\nIL_0012: ret\n}\n\n // 这里有我们的构造函数。\n.method public hidebysig specialname\
  \ rtspecialname\ninstance void .ctor() cil managed\n{\n.maxstack 8\nIL_0000: ldarg.0\n\
  IL_0001: call instance void [mscorlib]System.Object::.ctor()\nIL_0006: ret\n}\n\
  }\n```\n\n当所有外部引用的程序集都声明后，打开 CIL 代码文件。在上面的示例中，我们为 mscorlib 声明了一个 `.assembly` 标记。记住，如果类库依赖于其他程序集中的类型，你必须添加额外的程序集指令。下一步是寻找带有默认版本设置的程序集定义，因为我们从未提到过该值。在这种情况下，版本为\
  \ `0.0.0.0`。你可以使用 `AssemblyVersion` 属性创建一个不同的版本。此外，程序集由如 `.module` 等几个指令描述。\n\n\
  一旦程序集被记录并定义，该定义就变成了 `Program` 类型的定义。注意类方向包含了许多可选属性。大部分属性是可选的。**（注：此处原文逻辑为接上文翻译了\
  \ Main 方法后的代码逻辑）\n\n```il\n.method private hidebysig static void Main(string[] args)\
  \ cil managed\n{\n.entrypoint\n.maxstack 8\nIL_0000: nop\nIL_0001: ldstr \"Hello\
  \ CILly!\"\nIL_0006: call void [mscorlib]System.Console::WriteLine(string)\nIL_000b:\
  \ nop\nIL_000c: call string [mscorlib]System.Console::ReadLine()\nIL_0011: pop\n\
  IL_0012: ret\n}\n```\n(注：根据指令要求，此处保持了翻译逻辑)\n\n\n\n\n```.il\n.method private hidebysig\
  \ static void Main(string[] args) cil managed\n{\n.entrypoint\n.maxstack 8\n// To\
  \ do list: Type some new CIL code!\n}\n```\n\n目标是强制将一个新的字符串推入栈中，然后使用 `MessageBox.Show`\
  \ 调用它。我们使用这种方法而不是 `Console.WriteLine`。请记住，在输入外部类型的名称时，你必须使用带有程序集名称的全限定名称。记住，在 CIL\
  \ 中，所有方法引用的文档都带有完全限定返回类型。现在，让我们回到 `Main` 方法并使用以下代码对其进行更新：\n\n```.il\n.method private\
  \ hidebysig static void Main(string[] args) cil managed\n{\n.entrypoint\n.maxstack\
  \ 8\nldstr \"I love CIL\"\ncall valuetype [System.Windows.Forms]\nSystem.Windows.Forms.DialogResult\n\
  [System.Windows.Forms]\nSystem.Windows.Forms.MessageBox::Show(string)  pop  ret\n\
  }\n```\n\n我们的 CIL 代码现在与此 C# 定义完美匹配：\n\n```csharp\nclass Program\n{\n  static void\
  \ Main(string[] args)\n  {\n    System.Windows.Forms.MessageBox.Show(\"I love CIL\"\
  );\n  }\n}\n```\n\n### 编译代码\n\n一旦你保存了更新后的 `.il` 文件，就可以使用 CIL 编译器 `ilasm.exe` 开始编译过程。该编译器有几个命令。我们将关注最重要的几个。如果你想了解更多，请使用\
  \ `-?` 标记来查看它们。如此，以下是基本选项：\n\n1. `/debug`: 此命令行标记将添加调试信息。这包括变量、参数名和行号。\n2. `/dll`:\
  \ 这为输出创建一个 `.dll` 文件。\n3. `/exe`: 与 `/dll` 类似，除非另有说明，否则具有默认设置。\n4. `/output`: 设置输出名称和扩展名。如果不使用此选项，文件名将与你的源代码文件名相同。\n\
  5. `/key`: 允许程序集使用强名称进行编译。\n\n现在我们已经有了更新后的 `.il` 文件，可以使用以下命令编译它：\n\n`ilasm /exe\
  \ HelloApp.il /output=NewAssembly.exe`\n\n现在你可以开始这个新程序了，它将显示一个包含消息的对话框而不是控制台。这是一个基础程序，但它演示了使用\
  \ CIL 进行循环工程的概念。只需记住，当你使用 CIL 而不是 C# 创建或编辑程序集时，你始终应该检查二进制镜像编译是否转换为了正确的 .NET 镜像。这可以通过\
  \ `peverify.exe` 工具完成，只需输入以下命令：\n\n`peverify NewAssembly.exe`\n\n此实用程序检查你的程序集中的每一个操作代码并寻找有效的\
  \ CIL。该工具侧重于语义，因此如果你在退出函数之前没有清理栈，当你尝试运行代码时，它会警告你。\n\n### 动态程序集\n\n当你打算在 CIL 中创建一个复杂的应用程序时，你需要在上做好准备。一方面，CIL\
  \ 具有很强的表达性，允许你对 CTS 允许的任何编程结构进行完全的访问和控制。另一方面，编写 CIL 是耗时且枯燥的，更不用说出错的概率很高。此时，你可能在想你应该记忆多少语法。这没有标准答案，但你的大部分编程会话将不会涉及任何\
  \ CIL。理解 CIL 概念将使能够探索一个完全全新的概念，即动态程序集。\n\n到目前为止，我们关注的是静态程序集，所以你可能在想它们之间的区别。记住，静态程序集只是存在硬盘文件上的\
  \ .NET 二进制文件。它们由 CLR 请求并从磁盘加载。每当你编译用 C# 编写的代码，结果都是静态程序集。另一方面，动态程序集存在于内存中，这有助于来自\
  \ `System.Reflection.Emit` 命名空间的类型。该命名空间允许你构建带有定义、模块和运行时逻辑的程序集。这种内存二进制文件可以保存到磁盘，从而产生另一个静态程序集。创建动态程序集需要深入理解操作代码。\n\
  \n动态程序集需要高级编程。它们很少是编程目标的一部分，但它们可以非常有用。例如，在开发一个需要根据用户命令生成许多程序集的编程工具时，它们非常重要。当你想要加载静态程序集并动态向二进制添加新类型时，它们也有用。如此，让我们仔细观察\
  \ `System.Reflection.Emit` 命名空间。\n\n尽管开发动态程序集需要对操作代码有深入的理解，但 `System.Reflection.Emit`\
  \ 命名空间的类型隐藏了 CIL 的复杂性。例如，你可以尝试使用 `TypeBuilder` 类，而不是声明所有所需的指令和属性来定义类型。此外，你不需要使用\
  \ `Constructor Builder` 来定义构造函数。你也可以发射一个特殊的名称或 `ctor` 标记作为代替。此命名空间有多个成员，如果你想了解更多，请查看文档。\n\
  \n通常，属于此命名空间的类型允许你在构建动态程序集的同时以程序化的方式表示 CIL 代码。有很多这样的成员，但我们最感兴趣的是 `ILGenerator`。该成员的作用是向另一个成员引入\
  \ CIL 操作代码。注意，你不能立即创建此类类型的对象，因为它不包含公共构造函数。要获取 `ILGenerator`，你必须调用属于各种生成器类型的方法。这些类型是\
  \ `MethodBuilder` 和 `ConstructorBuilder`。查看代码：\n\n```csharp\n// 从构造函数中提取 ILGenerator。\n\
  // 对象将是 myConstructorBuilder。\nConstructorBuilder myConstructorBuilder = ...\nILGenerator\
  \ myGen = myConstructorBuilder.GetILGenerator();\n```\n\n当 `ILGenerator` 准备就绪，无论你有多少方法，都可以开始发射操作代码。要了解更多关于\
  \ `ILGenerator` 的方法，请查阅文档。我们将重点关注反射 `Emit` 方法。\n\n### 发射动态程序集\n\n为了说明如何在运行时定义程序集，我们将设置一个文件动态程序集。将其命名为\
  \ `MyAssembly.dll`。模块内部有一个名为 `HelloWorld` 的类，它接受一个基础构造函数和一个用于声明字符串类型值的自定义构造函数。该类支持一个名为\
  \ `SayHi` 的公共实例方法。该方法将向 I/O 流打印消息并通过 `ReceiveMsg` 方法返回一个私有字符串。如下：\n\n```csharp\n\
  // 该类使用 System.Reflection.Emit 命名空间在运行时构建。\npublic class HelloWorld\n{\n  private\
  \ string myMessage;\n  HelloWorld() {}\n  HelloWorld(string s) {myMessage = s;}\n\
  \  public string ReceiveMsg()\n  {return myMessage;}\n  public void SayHi()\n  {\n\
  \    System.Console.WriteLine (\"The HelloWorld class says Hi!\");\n  }\n}\n```\n\
  \n\n\n\n```csharp\nAssemblyBuilderAccess.Save);\n\n// Remember that we are creating\
  \ a one file assembly.\n\n// The name of the module will be identical to that of\
  \ the assembly.\nModuleBuilder module = assembly.DefineDynamicModule(\"MyAssembly\"\
  , \"MyAssembly.dll\");\n\n// Public class named \"HelloWorld\".\nTypeBuilder helloWorldClass\
  \ = module.DefineType(\"MyAssembly.HelloWorld\", TypeAttributes.Public);\n\n// Declare\
  \ the private String member variable and name it \"theMessage\".\nFieldBuilder msgField\
  \ = helloWorldClass.DefineField(\"theMessage\", Type.GetType(\"System.String\"),\
  \ FieldAttributes.Private);\n\n// Setup the custom ctor.\nType[] constructorArgs\
  \ = new Type[1];\nconstructorArgs[0] = typeof(string);\nConstructorBuilder constructor\
  \ = helloWorldClass.DefineConstructor(MethodAttributes.Public, CallingConventions.Standard,\
  \ constructorArgs);\nILGenerator constructorIL = constructor.GetILGenerator();\n\
  constructorIL.Emit(OpCodes.Ldarg_0); Type objectClass = typeof(object);\nConstructorInfo\
  \ superConstructor = objectClass.GetConstructor(new Type[0]);\nconstructorIL.Emit(OpCodes.Call,\
  \ superConstructor);\nconstructorIL.Emit(OpCodes.Ldarg_0); constructorIL.Emit(OpCodes.Ldarg_1);\n\
  constructorIL.Emit(OpCodes.Stfld, msgField);\nconstructorIL.Emit(OpCodes.Ret);\n\
  \n// Build the default ctor.\nhelloWorldClass.DefineDefaultConstructor(MethodAttributes.Public);\n\
  \n// Setup the ReceiveMsg() method.\nMethodBuilder receiveMsgMethod = helloWorldClass.DefineMethod(\"\
  ReceiveMsg\", MethodAttributes.Public, typeof(string), null);\nILGenerator methodIL\
  \ = receiveMsgMethod.GetILGenerator();\nmethodIL.Emit(OpCodes.Ldarg_0); methodIL.Emit(OpCodes.Ldfld,\
  \ msgField);\nmethodIL.Emit(OpCodes.Ret);\n\n// Build the SayHi method.\nMethodBuilder\
  \ sayHiMethod = helloWorldClass.DefineMethod(\"SayHi\", MethodAttributes.Public,\
  \ null, null);\nmethodIL = sayHiMethod.GetILGenerator();\nmethodIL.EmitWriteLine(\"\
  HelloWorld class says hi!\");\nmethodIL.Emit(OpCodes.Ret);\n\n// Emitting the type,\
  \ also referred to as “baking\".\nhelloWorldClass.CreateType();\n\n// Saving the\
  \ assembly to disk is optional.\nassembly.Save(\"MyAssembly.dll\");\n}\n```\n（源：Dynamic\
  \ Assemblies using Reflection.Emit, https://www.codeproject.com/Articles/18677/Dynamic-Assemblies-using-Reflection-Emit-Part-II-o\
  \ 检索于 2019 年 11 月）。\n\n## Summary\n\n在本章中，我们学习了 `CIL` 背后的语法和概念。`CIL` 与 `C#` 的不同在于它没有定义关键字集合，而是提供了指令、属性和操作码。你还学习了若干\
  \ CIL 工具程序，并探索了如何通过往返工程（round trip engineering）来修改程序集。此外，你还学习了如何处理引用程序集、命名空间、成员和\
  \ `types`，并开发了一个可以通过命令行执行的新代码库。最后，我们向你介绍了动态程序集和 `Reflection.Emit` 命名空间。你现在对在运行时如何在内存中定义程序集有了大致的了解。虽然你不会经常处理动态程序集，但这些知识以一种不可或缺的方式扩展了你的思维。\n\
  \n# 第 6 章：Windows Presentation Foundation (WPF)\n\n历史时刻！当第一个版本的 `.NET` 平台发布时，想要开发图形应用程序的程序员可以使用两个\
  \ API：`Windows Forms` 和 `GDI+`。它们今天仍被用于创建旧式的图形界面，但微软已经发布了一个全新的 GUI 系统：`Windows Presentation\
  \ Foundation`（简称）。这个新的替代方案随着 `.NET 3.0` 推出。\n\n本章将探索这一图形框架，以理解它与旧 API 之间的核心区别。你还将学习\
  \ `Application` 和 `Window` 主类的用途。简而言之，我们将探索 `WPF` 的图形渲染服务。这是一个关于这些图形系统的通用介绍性章节。本节旨在向你介绍纯\
  \ `C#` 编程之外的其他选项，这样你在决定项目开发工作流时就能做出更好的决策。\n\n### 目的\n\n微软为桌面可执行文件开发了许多图形用户界面系统。所有这些\
  \ API 都包含代表任何面向 GUI 程序的核心功能和特性的代码库。它们包含了窗口、控件、菜单、对话框等许多元素。当 `.NET` 最初发布时，`Windows\
  \ Forms` 因其直观性成为了用户界面的行业标准。即使在今天，该 API 仍在使用中，但方式受到了很大限制，因为它在视觉上不如现代系统漂亮或实用。此外，`Windows\
  \ Forms` 不支持通过各种插件和外部模块来扩展功能。\n\n`Windows Forms` 程序员必须依赖许多互不连接的 API 和对象模型。创建这些 API\
  \ 是繁琐的，因为每个都需要不同的思考模式，尽管它们都是用 `C#` 编写的。例如，向网格中附加数据所需的技能与构建 3D 渲染动画完全不同。这意味着 `Windows\
  \ Forms` 开发者必须拥有一极其多样的工具箱，而不是精于专。这正是 `Windows Presentation Foundation` 登场的地方。\n\n\
  `WPF` 目标是将这些不同的任务和功能整合到一个通用模式中。这意味着如果你想创建一个动画，不需要进行任何与 `DirectX API` 相关的手动编程，因为\
  \ `WPF`涵盖了这些功能。最重要的一点是，所有 `.NET` 程序员都有单一的 API 来满足他们所有的需求。只需要学习 `WPF` 程序集并研究 `XAML`\
  \ 即可创建复杂的、现代的界面。基础知识就足够了。\n\n你对 `WPF` 使用得越多，`XAML` 就变得越容易理解。它提供了极大的活性。它允许你创建按钮和复选框等\
  \ UI。例如，你可以创建一个圆形按钮控件，通过动画让 Logo 活起来。旧的 GUI 工具如 `Windows Forms` 和 `MFC` 使用基于 `C`\
  \ 的低级 API 处理图形渲染。它已经是 Windows 的一部分了，今天它为普通的业务应用程序提供了足够的性能。如果你想要华丽的图形，你需要的是 `DirectX`。`WPF`\
  \ 与旧模型不同，一切都是图形渲染的，无论是 2D、3D 还是动画。这一切依赖于 `DirectX API`。最大的优势是你的应用程序将从各种系统优化。所有的\
  \ WPF 程序都可以访问各种服务或效果，如模糊、透明度和抗锯齿——你不需要自己编写它们。\n\n总结来说，Windows Presentation Foundation\
  \ 是一种将多种 API 整合到一个模型的 API。此外，这些程序整合了多种服务。它是开发流程的重大改进，因为在引入之前，整合过于困难且复杂。让我们来看看 `WPF`\
  \ 的基础特性：\n\n1. `WPF` 包含许多高度自定义的布局管理器。\n2. 访问强大的数据绑定引擎，将内容与界面元素连接起来。\n3. 提供样式引擎以启用各种主题。\n\
  4. 使用矢量图形，从而允许开发者调整图形元素或屏幕的分辨率和大小，使一切都适应托管应用程序的系统。\n5. 完全支持 2D 和 3D 图形以及动画。\n6.\
  \ `WPF` 拥有排版 API，并完全支持整合旧的 GUI 系统如 `Windows Forms` 和 `ActiveX`。\n\n\n\n\n既然你已经看到了使用\
  \ WPF 的好处，让我们来探索使用该 API 开发的类型。\n\n## WPF 程序集\n\nWPF 可以被描述为收集在几个 .NET 程序集中的类型集合。请查看文档以探索开发阶段必须引用的许多程序集；这些程序集通常用于创建应用程序。Visual\
  \ Studio 会自动引用。让我们来看几个关键程序集：\n\n1. `PresentationCore`：此程序集定义了一个命名空间集合，构图形用户界面层的基础。例如，`PresentationCore`\
  \ 支持 `Ink API`、一些动画原始类型以及一组渲染类型。\n\n2. `PresentationFramework`：持有大部分 WPF 控件，包括 `Application`\
  \ 和 `Window` 类。它包含了对交互式 2D 图形的支持以及大量的数据绑定类型。\n\n3. `SystemXaml`：此程序集提供了在 XAML 文件之上进行编程所需的命名空间。此库允许你开发各种支持实用程序，或在运行时对\
  \ XAML 进行完全控制。\n\n4. `WindowsBase`：此程序集用于定义构成整个 WPF API 架构的类型。它包含了多个线程类型、安全类型和类型转换器。\n\
  \n这些基础程序集构成了命名空间、数百个类、结构、委托和枚举，它们共同组成了 WPF。让我们探索最常用的命名空间的用途：\n\n1. `System.Windows`：被认为是基础\
  \ WPF 命名空间。它包含了所有主类，包括 `Application` 和 `Window`。这些类在每个项目中都是必须。\n\n2. `System.Windows.Controls`：此命名空间持有大部分控件以及用于创建菜单和工具提示的类型。\n\
  \n3. `System.Windows.Data`：此命名空间持有专门与数据绑定引擎工作的类型集合。\n\n4. `System.Windows.Documents`：此命名空间包含与文档\
  \ API 工作的类型。你需要这个命名空间为你的应用程序添加 PDF 功能。它的实现是通过 XML 纸规范（XML Paper Specification）协议。\n\
  \n5. `System.Windows.Ink`：此命名空间提供 `Ink API` 支持。该 API 允许你记录来自控制器（如鼠标）的所有输入并做出相应响应。它最适合以平板为中心的编程。\n\
  \n6. `System.Windows.Markup`：此命名空间定义了处理 XAML 标记所需的类型。\n\n7. `System.Windows.Media`：一个核心命名空间，为许多关注媒体特性的命名空间提供根功能。这些命名空间内部包含了与\
  \ 3D 渲染、动画等工作的类型。\n\n8. `System.Windows.Shapes`：此命名空间定义了能够实现响应鼠标输入的 2D 图形渲染的类。\n\
  \n我们到此为止，因为这些是最常用的命名空间了。让我们开始探索 `Application` 和 `Window` 类。\n\n### Application 类\n\
  \n`Application` 类是运行中的 WPF 程序的全局实例。该类有一个有一个 `Run` 方法来运行应用程序，以及一组如 `Startup` 和 `Exit`\
  \ 的事件，包括处理浏览器应用程序的各种其他事件。请查看 WPF 文档以更好地理解这些许多属性。在此期间，我们将探索本质属性：\n\n1. `Current`：这是一个静态属性，提供了访问一个运行中的\
  \ `Application` 对象的权限。当窗口需要访问创建它的对象时，这个属性非常有用。\n\n2. `MainWindow`：此属性帮助我们获取或设置程序的主窗口。\n\
  \n3. `Properties`：此属性允许我们找到可以通过应用程序中的方法访问的数据。它包括窗口、对话框等。\n\n4. `StartupUri`：设置一个\
  \ URI 来指定程序运行时将打开哪个窗口。\n\n所有基于 WPF 的程序都需要定义一个扩展 `Application` 类的类。在其中，你声明 `Main`\
  \ 方法（启动点）。它将构建其子类的实例并管理 `Startup` 和 `Exit` 事件。让我们看看下方的示例：\n\n```csharp\n// 首先，我们需要为\
  \ WPF 应用定义应用程序对象。\n\nclass MyApp : Application\n{\n    [STAThread] static void Main(string[]\
  \ args)\n    {\n        // 设置应用程序对象。\n        MyApp app = new MyApp();\n\n     \
  \   // 启动和退出事件。\n        app.Startup += (s, e) => { /* Launch the app */ };\n  \
  \      app.Exit += (s, e) => { /* Exit the app */ };\n    }\n}\n```\n\n在 `Startup`\
  \ 中，所有传入的参数将被处理，应用程序将启动。另一方面，`Exit` 会退出应用程序。\n\n### Window 类\n\n`Window` 类代表属于应用程序的任何类的类的窗口。它是\
  \ `PresentationFramework` 程序集的一部分。它包含了程序主窗口的所有对话框。注意，`Window` 类持有一个添加功能的类集合。查看文档以了解更多关于它们的信息。我们将讨论那些对于初步理解\
  \ WPF 重要的类。\n\n`ContentControl` 类是 `Window` 类的父类。它是核心类之一，提供了派生类型，这些类型通过 `Content`\
  \ 属性持放在控件表面区域内的一段视觉数据。内容模型允许我们自定义内容控件的视觉效果。例如，当你考虑按钮控件的内容时，你会想到像“取消”或“接受”之类的字符串字面量。如果你使用\
  \ XAML 制作 WPF 控件，`content` 属性的值可以被注册为基础字符串。你可以像这样在组件定义内部声明该属性：\n\n```xml\n<!-- 在起始元素内声明\
  \ Content 值 -->\n<Button Height=\"70\" Width=\"90\" Content=\"OK\"/>\n```\n\n你可以将内容设置为任何你想要的内容。例如，你可以让一个按钮包含一个文本段落。在旧的\
  \ UI 结构（如 Windows Forms）中，你必须自己创建控件。这样做将涉及大量的代码以及一个需要你管理的类类。在 WPF 中，这是没有的。在 WPF\
  \ 中，你不需要在定义内部使用属性来为内容属性赋值；相反，你在组件的作用范围内定义数据。\n\n虽然 WPF 控件和 `ContentControl` 共享同一个父类，但它们并不是同一种东西。根类提供了几个提供核心用户界面功能的基成员。例如，`Control`\
  \ 定义了控制大小、不透明度、光标、背景颜色等的属性。根类还提供了模板支持。\n\n### 用于图形渲染的 WPF\n\n在本节中，我们将讨论 WPF 的图形能力：渲染服务。WPF\
  \ 提供了渲染图形信息的方法：形状、图形和视觉。一旦你理解了它们的优缺点，你对 WPF 的理解将会增加。你将欣赏图形和几何图形如何更灵活地渲染 2D 信息。此外，多个视觉层优化了你的项目的性能。\n\
  \n\n\n\n你现在可能对创建复杂且图形密集型的程序不感兴趣。尽管如此，这些过程背后的概念适用于各种服务。`WPF` 依赖于一种被称为保留模式图形（retained-mode\
  \ graphics）的图形渲染。这意味着过程化代码生成图形渲染。`WPF` 的作用是维护图形对象并确保它们得到适当的重绘和更新。因此，当图形信息被渲染时，即使在你在其上方放置另一个窗口或将其最小化导致图像被隐藏，它也一直存在。对比一下，当微软的渲染\
  \ API 限于 `Windows Forms` 时，我们拥有的是即时模式（immediate mode）图形系统。程序员必须准备一个模型，以确保渲染的图形在应用程序运行期间得到适当的管理和定期更新。今天，`WPF`\
  \ 处理了这一切。一个渲染基本几何形状（如矩形）的 `Windows Forms` 程序需要一个 `Paint` 事件来创建一个绘制该形状的对象。还必须包含架构设计，以确保图像在最小化时保持完整。从即时模式图形到保留模式图形的转变是解放性的。程序员需要编写和更新的图形代码变少了。\n\
  \n话虽如此，`WPF` 的图形 API 与旧的渲染工具并没有区别。它们都支持某些类型的笔刷和笔对象、命中测试技术、图形更改等。如果你熟悉 `Windows Forms`\
  \ 渲染，那么学习 `WPF` 渲染将不会有困难。\n\n## 渲染选项\n\n如前所述，`WPF` 具有适应性，提供了丰富的图形渲染选择。你的选择超出了 `XAML`\
  \ 或过程化的 `C#` 代码。以下是 `WPF` 提供的三种方法：\n\n1. `Shapes`：`WPF` 提供的 `System.Windows.Shapes`\
  \ 命名空间定义了渲染 2D 几何对象（如矩形、多边形等）的类。这些是基本类型但在过度使用时会消耗大量内存。\n2. `Drawings`：涉及 `System.Windows.Media.Drawing`\
  \ 命名空间的子类。你会发现像 `ImageDrawing` 和 `Geometry Drawing` 这样的类用于渲染消耗系统资源的视觉数据，但这也意味着功能较少。\n\
  3. `Visuals`：最快的图像渲染方法。`Visuals` 允许使用只能通过 `C#` 代码访问的视觉层，这意味着你能够直接与 `WPF` 的图形系统交互。\n\
  \n所有这些方法执行的是相同的事情。区别在于细节。主要的区别因素是性能和内存使用。`WPF` 是一个密集型系统，对你的系统要求很高。尽管如此，期望一个程序在一个窗口中渲染数千张图像是合理的。这就是为什么选择形状、绘制或视觉效果会影响你应用程序的性能。请注意，在大多数情况下，你不会只使用一种方法。开发者会结合所有三种方法，为每种方法选择最合适的内容。开发者结合所有三种方法是正常现象。\n\
  \n接受的标准是在处理简单图形数据（如工具提示和鼠标输入）时使用 `Shapes` 命名空间。在处理用 `C#` 或 `XAML` 组合的矢量数据时，主要使用\
  \ `Drawings`。绘制还可以对鼠标事件和其他操作做出响应，但你必须自己编写该功能。\n\n`Visuals` 通常用于渲染海量的视觉数据，因为视觉层提供了最快、高效的渲染方法。例如，假设你正在创建一个用于显示数据图的应用程序。视觉层将优化地生成图点，不会占用你的系统内存。\n\
  \n无论你使用哪种技术，你始终需要各种图形原元（如笔刷和笔）以及变换对象。\n\n## 总结\n\n在本章中，我们向你介绍了 Windows Presentation\
  \ Foundation。虽然我们没有深入探讨过多的细节，但你应该已经有足够的知识来独立上手。你探索了基本概念，例如是什么让 `WPF` 应用程序活跃起来，以及在制定项目设计时可用的选项。现在你可以使用\
  \ `C#` 和 `WPF` 来处理控制台应用程序以外的内容。\n\n# 第 7 章\n\n## ASP .NET\n\n在本章中，我们将学习 `ASP.MVC`，这是一个\
  \ Web 应用程序框架。该框架的出现是因为需要，在线社区需要一个遵循 `HTTP` 且比之前的框架更容易测试的新框架。\n\n在第一部分中，你将学习 `MVC`\
  \ 模式。\n\n### MVC 模式\n\n`MVC` 代表模型-视图-控制器（Model View Controller）。该模式最早出现于 70 年代。它是为了\
  \ 1980 年推出的面向对象编程语言 `SmallTalk` 开发的。该模式再次出现是因为它现在可以在其他语言（如 `Java`、`Ruby`）以及各种框架（如\
  \ `Angular`）中实现。在 2007 年左右，该模式以 `ASP.NET MVC` 的形式为 `.NET` 开发者实现。\n\n首先，我们有模型（Model）。它代表应用程序的数据，由一组基本的\
  \ `CLR` 对象表示，这些对象与数据访问库中的对象相同。视图模型（View models）由一个或多个为视图设计的模型组成。为了更好地理解它们，可以将这些模型想象成数据库表。从学术角度来看，模型是纯洁的，因为它们不持有验证逻辑或类似的规则。从实践角度来看，模型是否包含这些逻辑取决于使用的框架、编程语言以及项目需求。例如，`EF\
  \ Core` 包含若干个数据注解，作为数据库表建模的方法，在 Core MVC 内部包含了验证方法。通常情况下，数据验证和注释被放置在最合理的地方，以减少潜在的重复代码。\n\
  \n接下来是视图（View），它代表应用程序的用户界面。视图将接受指令并将这些指令的结果显示给用户。注意，视图必须尽可能轻量，以便于执行指令。控制器（Controller）必须处理所有繁重的工作。控制器是操作背后的智能。它有两个主要目的。第一个是接受用户命令（称为\
  \ `actions`）并将其推送到存储库中。第二个是将任何更改传递给视图。记住，就像模型和视图一样，控制器需要尽可能轻量。\n\n这听起来并不复杂。但为什么要使用\
  \ `MVC` 而不是其他框架呢？\n\n`ASP.NET MVC` 发布于 2007 年，但 `ASP.NET Web Forms` 在此已经发展了六年。\n\
  \n\n\n这些开发者有了新的需求。他们不再需要大量的工具和实用程序来填补之前的空白，但他们对渲染后的视图有更多的控制需求。随着每次 `Web Forms` 的更新，新功能被不断添加。每一次更新都显著改进了应用程序，并导致了更复杂的网站。但问题也出现了。例如，`viewstate`\
  \ 在渲染页面中的位置对性能产生了负面影响。最终，这导致了 `.NET`、`Ruby` 和 `Ruby on Rails` 中出现更多问题。当时，微软无法简单地删除这项技术，因为很多功能都依赖它。必须找到一个新的解决方案，而不断更新\
  \ `Web Forms` 来修复这些问题是不够的。微软必须弄如何在让当前的 Web 开发者满意的同时，为那些想要进一步探索 Web 的人提供一个新的平台。\n\
  \n这就是 `.NET MVC` 的诞生。这两个模型之间有许多差异。例如，代码后文件（code-behind files）、`viewstate` 和控件支持被移除。此外，测试、依赖注入、控件分离和清洁代码技术得到了更好的支持。此外还开发了\
  \ `Razor` 视图引擎。几乎所有内容都得到了改进，但主要的缺点是 `.NET MVC` 需要对 `HTML`、`JavaScript` 和 `HTTP`\
  \ 函数有一定的熟悉程度。\n\n`MVC` 框架的配置被约定优于所取代。换言之，必须遵循命名约定和通用架构等约定，以便减少 `MVC` 项目所需的配置。\n\n\
  ## MVC 应用程序模板\n\n现在我们已经了解了一些历史和理论，让我们来看一些代码。`Visual Studio` 自带了一个完整的项目模板，旨在帮助你构建\
  \ `MVC` 应用程序。导航到 `File` 标签，选择 `New`，然后点击项目。在左侧边栏中，`Visual C#` 下有 `Web` 选项。选择 `ASP.NET\
  \ Web Application` 并命名。当下一个窗口弹出时，按照 `MVC` 模板操作。会有一个预选的复选框，用于“添加文件夹和核心引用以”（add folders\
  \ and core references for）。在这个窗口中，如果你想创建一个同时与 `MVC` 和 `Web Forms` 通的混合程序，可以勾选 `Web\
  \ Forms` 复选框。为了本节的目的，仅选择 `MVC`。还有另一个名为“添加单元测试”（add unit tests）的选项。如果你勾选它，将创建一个带有用于单元测试的核心框架的新项目。我们不会探索单元测试，因为这对这本书来说太太大了。尽管如此，在完成设置之前，请查看身份验证机制。\n\
  \n选择“更改身份验证”（change authentication）选项，将弹出一个对话框。保持默认（“身份验证设置为无身份验证”），并在提示时点击“确定”。完成后，将创建一组文件和文件夹。\n\
  \n请注意，从任何版本的 `MVC` 模板修改 `Project_Readme.html` 文件都是一个项目概述功能。这意味着当项目最初被加载时，将提供一组指向文档的链接，建立多个服务之间的连接。许多\
  \ `MVC` 文件都有它们所属特定位置。尽管如此，仍有一些文件可以位于根文件夹之外。让我们检查一些：\n\n1. `Global.asax.cs`：此文件允许我们连接到框架的工作流。默认模板依赖于一个名为\
  \ `application start`（应用程序启动）的事件处理器。然而，还有许多其他你可以连接的处理器。\n2. `Models`：这是一个存放所有模型类的文件夹。当你开发一个复杂的应用程序时，数据访问库应该包含你所有的模型。此文件夹通常用于存放视图模型，例如\
  \ `Visual Studio` 为框架身份识别创建的类。\n3. `Controller`：包含你应用程序的所有控制器文件。\n4. `Views`：你所有的\
  \ `MVC` 视图都将放在这里。文件夹的架构有一个特定的约定。所有控制器都需要在 `Views` 文件夹内部有自己的文件夹。它们会在与控制器相同标签的文件夹内搜索其视图。例如，`Views/Home`\
  \ 文件夹将包含用于 `HomeController` 控制器的视图。你还会在主文件夹根目录下找到一个名为 `_ViewStart.cshtml` 的配置文件。该文件属于其文件夹结构内部的视图，并决定了页面类型。此外，配置文件将在视图渲染之前执行。\n\
  5. `Shared`：此文件夹属于 `views` 文件夹。任何视图都可以访问它。它只包含两个文件：`Layout.cshtml` 文件和 `Error.cshtml`\
  \ 文件。第一个表示由视图启动配置文件确定的布局。第二个包含项目的错误模板。\n6. `ASP.NET`：有很多这样的文件夹，例如 `App Data` 文件夹（`MVC`\
  \ 模板的一部分）。该文件夹包含网站所需的所有基于文件的信息。还有其他用于存储代码和其他资源的的生成文件夹。你可以通过右键点击你的项目并选择 `Add` 菜单中的\
  \ `ASP.NET Web Folder` 选项来添加新文件夹。这些文件夹在网站上看不到。\n7. `App_Start`：旧版本的 `MVC` 框架将配置代码放在全局类中。一个接一个的补丁导致配置变得过于复杂，无法在一个类中处理。因此，开发被分为多个类。`App_Start`\
  \ 文件夹包含所有这些类。那里的代码会自动编译。\n\n现在让我们关注到 `BundleConfig` 类。该类容纳了 `CSS` 和 `JavaScript`\
  \ 文件的包（bundles）和压缩设置。通常，这些文件为了生产目的是经过打包和压缩的。这些过程在调试模式下是不可见的。你可以通过调整该类或 `web.config`\
  \ 文件来控制所有这些。假设你想关闭打包和压缩。在这种情况下，你必须在配置文件中的 web 部分中输入以下行：\n\n```xml\n<system.web>\n\
  <compilation debug=\"true\" targetFramework=\"4.7\" />\n</system.web>\n```\n\n如果你不熟悉，打包（bundling）是将多个文件合并为一个。打包可以提高网站速度，因为\
  \ Web 浏览器一次可以下载的文件数量是有限的。在你的网站上有许多小文件会降低性能。解决方案是将文件打包在一起以减少它们的数量。另一种解决方案是将它们分布在内容分发网络中。无论你选择哪种方法，你都需要决定最适合你的方案。构建方法的缺点是产生可能减慢用户体验的大文件。\n\
  \n另一边是压缩（minification）过程。这个过程可以加快网页的加载时间。`JavaScript` 和 `CSS` 文件仅包含变量和函数以提高可读性。然而，大小非常重要，特别是当网站经常通过移动设备访问时。压缩解决了这个问题。它将长名称替换为短名称，删除额外的空间等。更改格式并使所有内容变短意味着传输的位更少，从而意味着更短的加载时间。正如此，所有优秀的框架都提供了这些文件的两个版本：一个用于生产，另一个用于开发。\n\
  \n### 总结\n\n在本章中，我们引入了 `ASP.NET MVC` 框架，它已成为大多数 `C#` 应用程序开发工作流的主流。它包含一组库，增加了 `C#`\
  \ 的抽象层。`MVC` 模式将项目分为三个部分，使其更加高效。此外，我们还查看了模式本身，以及为什么它在逻辑应用程序与图形组件之间存在分离的用户界面中非常有用。拥有内部数据表示允许更高效地向用户展示和接受信息，从而使复杂程序的开发成为可能。\n\
  \n\n\n\n\n# NET Core\n\n2016 年，微软发布了一个名为 `.NET Core` 的新 .NET 平台。该平台是跨平台的，可以在三大最大的操作系统：Windows、Linux\
  \ 和 macOS 上运行。它基于你现在非常熟悉的 `.NET` 和 `C#`。该平台包含了 `.NET Core` 运行时、`ASP.NET Core` 以及\
  \ `Entity Framework Core`。在编写本文时（2020 年 1 月），`.NET Core` 的第五版本已经发布，扩展了跨平台部署功能并带来了许多其他值得探索的变更。\n\
  \n与其他技术不同，`.NET Core` 是完全开源的。你可以在这里检查代码并进行随处修改，以查看会发生什么。你还可以利用自己对 `C#` 和 `.NET`\
  \ 的知识为社区和开发团队做出贡献。这对于普通用户是有利的，因为庞大的贡献者社区意味着更快的改进。此外，文档非常详尽。你可以从中学习到很多知识。你可以在这里查看：[`docs.microsoft.com/en-us/`](https://docs.microsoft.com/en-us/)。\n\
  \n`.NET Core` 的理念诞生于开发者要求 `ASP.NET` 平台能够在其他平台上运行，而不仅仅是其他 Windows。这导致了一个名为 `Project\
  \ K` 的项目，目的是将 `.NET` 功能提供给其他平台。大部分工作集中在 `ASP.NET` 上以便将其扩展到其他系统，因此必须移除对 `System.Web`\
  \ 的任何依赖。正如你可以想象的，移除这样的组件并不是没有代价的。这意味着他们必须几乎从零开始编写框架，并重新决定是否添加许多必需的组件。因此，决定需要一个可以被所有基于\
  \ Web 的应用程序使用的框架。这导致了 `MVC` 平台和 `Web API` 的合并。引入 `Entity Framework` 是因为平台需要一个新的数据访问层。这个平台被命名为\
  \ `.NET Core`。\n\n这让人好奇其他的 `.NET` 框架会发生什么。它们的支持会结束吗？你必须重写应用程序以获得 `Core` 的支持吗？答案是否。`C#`\
  \ 和 `.NET` 平台正在不断开发，尽管最近没有非常令人兴奋的进展。但所有这些技术都非常成熟，看起来短期内不会被取代。看看 `WinForms` 和 `Web\
  \ Forms`；即使很少有关于它们的讨论，它们仍被许多产品使用。\n\n## NET Core 的目的\n\n`.NET Core` 不仅仅是为了扩展 `.NET`\
  \ 功能。请记住 `.NET` 自 2002 年以来一直存在。从那时起技术发生了巨大的变化。开发者变得更有经验，计算机变得更强大，用户数量增加了。这些都是自 2002\
  \ 年以来发生的明显变化。尽管如此，这里是 `.NET Core` 的目标和功能列表：\n\n1. **跨平台支持**：在所有三个操作系统及其版本上运行核心功能。现在已添加了对\
  \ `Android`、`iOS` 和 `Xamarin` 的支持。\n2. **性能**：性能仍然是 `.NET Core` 最重要的目标之一。频繁的发布确保了框架不断改进。\n\
  3. **可移植类库**：Core 现在包含了 `.NET Standard`。这是一项在 `.NET` 运行时中实现某些统一行为的规范。\n4. **部署**：Core\
  \ 应用程序是可移植的。它们还可以作为独立产品部署。换句话说，它们可以随框架或 `Core` 系统安装一起提供。\n5. **命令行支持**：该平台支持完整的命令行。\n\
  \n由于 `Visual Studio` 现在可以在 Mac 上使用，因此可以在任何地方开发 `.NET Core` 应用程序。不需要虚拟化。你还使用来自 `Core`\
  \ 开发的跨平台工具在任何系统上工作。同样吸引人的是广泛的部署选择，不再依赖于 Windows。例如，Linux 服务器是标准选择，因为它们的运行和维护成本更低，特别是在如今的云环境中。因此，直接将应用程序部署到云端的选项可以降低成本。这可能解释了新初创公司的激增，因为它变得具有成本效益。现在，小型开发者团队可以构建自己的产品。\n\
  \nCore 还提供了**容器化**（Containerization），这是 Core 令人印象深刻的内容之一。Core 应用程序接收容器化支持。这意味着像\
  \ `Docker` 这样的容器可以简化应用程序从一个环境发布到另一个的环境。例如，Core 可以轻松将应用程序从开发环境移动到测试环境。项目文件被封装成单个容器，因此有了“容器化”这一术语。容器可以直接复制，无需安装。由于\
  \ Windows 支持 `Docker`，事情变得简单得多。这意味着你将能够在容器中开发应用并在部署时移动容器，这意味着你不需要进行安装——不再有部署过程，不再有安装过程。\n\
  \n使用 `ASP.NET Core` 开发的大多数应用程序都能产生高基准测试分。如你所知，性能是开发者最重要的事情之一。原始的 `.NET` 框架已经老了，开发者已从中尽其所能。这是他们编写\
  \ `Core` 的原因之一。从头开始允许他们从初就进行优化。换句话说，性能变成了核心驱动力。\n\n## 组件\n\n以下是 `.NET Core` 的基本结构：\n\
  \n1. `Core` 运行时。\n2. 框架库。\n3. `SDK` 工具和 `dotnet` 应用程序主机。\n4. 语言编译。\n\n`Runtime`（又\
  \ `CoreCLR`）是 `.NET Core` 的根库。它包含了垃圾回收器、基础 `.NET` 类型、`JIT` 编译器和许多库。它是连接这些库与不同操作系统的内核。依赖操作系统的只有类。类库本身以独立的\
  \ `NuGet` 包形式提供。定义的代码被编译为 `CoreLib` 程序集，它在运行时之外并不使用。`CoreCLR` 还提供了如 ILASM 和 ILASM\
  \ 等工具。\n\n框架库（称为 `CoreFX`）是基础库的集合，包含了文件系统、集合、控制台、`XML` 等类。这些库构建了 `CoreCLR` 并为其他框架提供材料。然而，除了库中包含许多\
  \ `CoreCLR` 元素外，这些库专注于运行时。你可以得出结论：`CoreCLR` 和 `CoreFX` 构建了 `.NET Core`。\n\n\n\n\n\
  请记住，不要将 `.NET Core` 与完整的 `.NET framework` 混淆，因为尽管它们有许多相同的 API 并依赖于 `C#`，但它们之间存在区别。以下是其中一些因素：\n\
  \n1. Core 为每个系统提供了额外的平台支持。\n2. 虽然 Core 由微软支持和维护，但它是开源的。\n3. 引入的应用程序模型较少。\n4. Core\
  \ 的 API 较少。\n\n我们已经讨论了前两个区别。值得注意的是，Core 并不支持完整框架中的每一个应用模型。对于基于 Windows 技术创建的模型，这种说法甚至更为准确。此外，Core\
  \ 应用程序可以被描述为控制台应用程序或类库。\n\nCore 的 API 较少是因为完整的 Framework 极其庞大。因此，尝试更改所有的 API 是现实的。Core\
  \ 开发者遵循敏捷设计原则，因此他们的目标是提供精简版作为版本一，以满足最小需求。这听起来可能不好，但并不意味着开发者很懒惰。随着每一次新的迭代，受支持的 API\
  \ 数量都会增加。例如，2.0 版本又引入了 32,000 个 API。\n\n尽管如此，`.NET Core` 是一项正在大力开发的全新技术。尽管如此，它正在迅速证明自己是不可或缺的。\n\
  \n## 总结\n\n在本章中，我们了 `.NET Core` 的结构和目标。我们学习了 Core 和完整 `.NET framework` 之间重要的区别。随着你的练习，你会发现创建\
  \ Core 应用程序与创建通用的 `.NET Framework` 应用程序并没有太大区别。你只是框架和 API 的数量较少。一切仍然都是 `C#` 编程。Core\
  \ 的优势在于它的开源性质，这意味着它从全球数千名开发者中受益。这意味着 Bug 被修复了，工具和新功能的实现速度在不断加快。这看起来可能是一个缺点，因为开发者可能难以跟上，但这是积极的，因为它让你的工作变得更轻松。\n\
  \n# 结论\n\n多么精彩的旅程！你已经从初学者 `C#` 编程指南的起点开始，现在你终于完成了高级课程。祝喜你。你已经走了很远的路了。很多人在学习过程中没有走到这一步。我们承认框架是令人敬畏的。这就是为什么这些指南的制作方式是为了帮助你学习。\n\
  \n我们的目的是为你提供所需的基础工具，以开启你成为高级 `C#` 程序员的旅程，使用 `ASP .NET MVC`、`.NET Core` 等工具进行工作。你已经到了一个仅靠书籍是不够的阶段；你必须投入文档进行学习。这不是你独自承担的旅程。在线上有许多社区拥有共同的目标。与他们一起学习吧。所以去出去吧，为项目做出贡献，永远不要停止学习。\n\
