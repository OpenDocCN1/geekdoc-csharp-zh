  \ 第一章\n\n## 引言 - C# 的环境搭建与历史\n\n微软在 2000 年宣布了 `C#` 并在 2002 年发布了该语言。`C#` 原本被称为 \"\
  Cool\"，意为“C 类面向对象的编程”（C-like object-orientated programming）。`C#` 是一种基于 C 的编程语言。它的读作\
  \ C \"sharp\"；井号符号意味着 `C#` 是 `C++` 的后续迭代版本。\n\n以下是 `C#` 的时间线，详细列出了每个版本新增的内容（“C#\
  \ 简介”）：\n\n### 2002 年 1 月：`C#` `1.0`\n* 类型安全的编程语言\n* 现代\n* OOP（面向对象编程）\n\n### 2005\
  \ 年 11 月：`C#` `2005`\n* 泛型 (Generics)\n* 部分类 (Partial classes)\n* 匿名类型\n* 迭代器 (Iterators)\n\
  * 可空类型 (Nullable types)\n* 静态类 (Static classes)\n\n### 2007 年 11 月：`C#` `2007`\n\
  * 对之前新增内容的改进\n* 扩展方法 (Extensions methods)\n* 表达式树 (Expression trees)\n* 部分方法 (Partial\
  \ methods)\n\n### 2010 年 4 月：`C#` `4.0`\n* 动态绑定技术\n* 具名命名和参数（可选）\n\n### 2012 年 8\
  \ 月：`C#` `5.0`\n* 异步编程（一项巨大的改进，允许程序员创建多线程应用程序）\n* 用于调用者信息的特性 (Attributes)\n\n###\
  \ 2015 年 7 月：`C#` `6.0`（本书包含此版本及以上版本）\n* 异常过滤器\n* 字符串插值\n* 包含静态类型成员的命名空间\n* 编译器服务\
  \ (Compiler as a service)\n\n### 2017 年 8 月：`C#` `7.0`\n* 输出变量 (Out variables)\n\
  * 元组与解构\n* 模式匹配 (Pattern matching)\n* 地函数\n* 扩展的表达式体成员\n* Ref 局部变量和返回值 (Ref locals\
  \ and returns)\n\n### 2019 年 9 月：`C#` `0.8`\n* 只读成员\n* 默认接口方法\n* 模式匹配增强：\n    *\
  \ Switch 表达式\n    * 属性模式\n    * 元组模式\n    * 位置模式\n    * Using 声明\n    * 静态局部函数\n\
  \    * 可丢弃的 ref 结构体 (Disposable ref structs)\n    * 可空引用类型\n    * 异步流\n    * 索引和范围\
  \ (Indices and ranges)\n    * 空合并赋值\n    * 非托管构造类型\n    * 嵌套表达式中的 Stackalloc\n \
  \   * 插值逐字字符串的增强\n\n## 在 Windows 上运行 C#\n\n你可能对本章将要涵盖的所有内容都很熟悉，但我们必须过一遍它们，因为回顾基础知识总是一个好主意。将其视为对于那些离开编程一段时间的人来说的一次非常需要的温习。不过，在\
  \ Windows 上使用 `C#` 仍然是更好的主意，因为 `C#` 是微软的语言。Windows 操作系统对其进行了优化。\n\n### Mac 用户\n\
  你可以在 Mac 上使用 `C#`。微软已经发布了 Mac 版的 `Visual Studio`，但在 Windows 笔记本电脑上使用 `C#` 的体验更好。通过使用\
  \ Oracle 提供的 `Virtual Box` 等工具在 Mac 上运行虚拟 Windows 操作系统也会很有帮助。\n\n### 1. 面向对象语言\n\
  `C#` 中除原始数据类型外，一切都是对象。如你所知，对象具有属性和构造函数。如果你工作过其他面向对象的语言，你就见过这些。我们将在接下来的章节中看到更多内容。由于\
  \ `C#` 是面向对象的，因此它易于维护和模块化。\n\n### 2. 强类型\n正如你对基于 `C` 的编程语言所预期的那样，`C#` 是强类型的。这意味着不像\
  \ `Javascript`，你必须在程序中指定数据类型。这显著减少了运行时错误。这被称为类型安全。当你处理更大的应用程序时，类型安全的优势会变得更加明显。\n\
  \n### 3. 自动垃圾回收\n`C#` 定运行垃圾回收，移除未使用的对象和悬挂指针，从而刷新内存。`.NET` 框架负责这项任务。你不需要自己执行这些繁琐的任务；这为你节省了时间，并让你能够专注于应用程序的功能。\n\
  \n### 4. 易于学习\n`C#` 是一门高级编程语言，这使其更容易学习。与 `C` 和 `C++` 等低级编程语言不同，许多你必须执行的任务（如内存管理和指针）都是自动完成的。这使得你的代码更加简洁且重点突出。在\
  \ `C` 中需要十行代码的内容，在 `C#` 中大约只需要三行。\n\n### 5. 应用范围\n`C#` 是微软生态系统的核心。它的许多技术都运行在其之上。Windows\
  \ Phone 使用 `C#`，`ASP.NET` 使用 `C#` 作为后端，Windows Form 和 Windows Presentation Framework\
  \ 也运行在 `C#` 上。如果你正在构建运行在 Windows 上的东西并希望它运行良好，`C#` 是最佳选择。其他其他方法可以编写在 Windows 上运行的程序，但除非你额外花精力优化程序，否则性能将不会是一样的。\n\
  \n### 6. Visual Studio\n`Visual Studio` 是全球最常用的 IDE 之一，`C#` 彰显了该语言的重要性和强大。在编写程序时，开发社区越大越有帮助。这意味着如果出现问题，已经有人遇到过该问题、记录了它并找到了解决方案。`C#`\
  \ 在 `Stack Overflow` 上拥有第四大的社区。\n\n\n\n\n\n## 5. 当你运行脚本时\n\n正如你按下“开始”（Start）按钮一样，控制台窗口将显示运行脚本的结果。在这种情况下，它会显示消息：“恭喜，你写了第一个程序”。看起来如下：\n\
  \n![](img/00250.jpeg)\n\n为了理解发生了什么，让我们来看看我们写的代码：\n\n```csharp\nusing System;\nusing\
  \ System.Collections.Generic;\nusing System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\n\
  \nnamespace MyProgram\n{\n    class Program\n    {\n        static void Main(string[]\
  \ args)\n        {\n            Console.WriteLine(\"Congratulations, you wrote your\
  \ first Program\");\n            Console.ReadKey();\n        }\n    }\n}\n```\n\n\
  `using` 语句（顶部的那些）用于导入库，这些库包含了预置的函数，称为方法，我们可能在代码中需要它们。C# 中的任何代码块都放置在`namespace`命名空间）内部的`class`类）中。这是意料之中的，因为程序是面向对象的。在我们写的程序中，我们的\
  \ `class` 是 `Program`，而 `namespace` 是 `\"MyProgram\"`。\n\n`Classes`类作为一种对象类型，内部包含方法。我们的程序\
  \ `class` 拥有 `Main` 方法，其返回类型为 `void`，方法类型为 `static`。`Main` 方法是我们执行的 C# 代码开始的地方。为了编写这行代码，我们使用了\
  \ `WriteLine` 方法，它是 `Console` `class` 的一部分。我们传递了想要在控制台中显示的文本。然后我们使用了 `Console` `class`\
  \ 的 `ReadKey` 方法，防止文本在打印到屏幕后立即消失。\n\n这就是我们第一个程序的全部内容了。\n\n# 第 2 章：C# 接口 (Interfaces)\n\
  \n接口是包含函数声明的类，这些函数可以被其他类继承。继承方法的类负责定义方法。\n\n接口的定义方式如下：\n\n```csharp\npublic interface\
  \ interfacename\n{\n    // 接口方法声明\n}\n```\n\n继承类按如下方式定义方法：\n\n```csharp\nclass classname\
  \ : interfacename\n{\n    // 接口方法定义\n}\n```\n\n这是一个使用接口的应用程序。\n\n```csharp\nusing\
  \ System;\n\nnamespace Demo\n{\n    // 定义接口\n    public interface Score\n    {\n\
  \        // 声明接口方法\n        void DisplayScore();\n        int Calculate();\n   \
  \ }\n    public class Player : Score\n    {\n        public int PlayerID;\n    \
  \    public string PlayerName;\n        public int score1,score2;\n        // 定义接口方法\n\
  \        public void DisplayScore()\n        {\n            Console.WriteLine(\"\
  The score for try 1 is \" + score1);\n            Console.WriteLine(\"The score\
  \ for try 2 is \" + score2);\n        }\n        public int Calculate()\n      \
  \  {\n            return (score1 + score2);\n        }\n    }\n    class Program\n\
  \    {\n        // 主函数\n        static void Main(string[] args)\n        {\n   \
  \         Player player1 = new Player();\n            player1.playerID = 1;\n  \
  \          player1.PlayerName = \"John\";\n            player1.score1 = 10;\n  \
  \          player1.score2 = 20;\n            player1.DisplayScore();\n         \
  \   Console.WriteLine(\"The score is \" + player1.Calculate());\n            Console.Read();\n\
  \        }\n    }\n}\n```\n\n我们在上面的代码中看到的是：\n- 我们定义了一个名为 `Score` 的接口，它包含一个 `Display`\
  \ 方法和一个 `Calculate` 方法。\n- 随后在 `Player` `class` 中定义了这些函数的实现。\n\n我们在控制台中看到的是：\nThe\
  \ score for try 1 is 10\nThe score for try 2 is 20\nThe Total score is 30\n\n我们可以让一个类同时继承多个接口。让我们来看这个例子。下面是多个接口的应用。\n\
  \n```csharp\nusing System;\nnamespace Demo\n{\n    // 定义接口\n    public interface\
  \ Score\n    {\n        // 声明接口方法\n        void DisplayScore();\n        int Calculate();\n\
  \    }\n    public interface location\n    {\n        // 声明接口方法\n        void InputCity(string\
  \ city);\n        void DisplayCity();\n    }\n    public class Player : Score, location\n\
  \    {\n        public int PlayerID;\n        public string PlayerName;\n      \
  \  public int score1, score2;\n        private string city;\n        // 定义接口方法\n\
  \        public void InputCity(string pcity)\n        {\n            city = pcity;\n\
  \        }\n        public void DisplayCity()\n        {\n            Console.WriteLine(\"\
  The player is from\" + city);\n        }\n        public void DisplayScore()\n \
  \       {\n            Console.WriteLine(\"The score for try 1 \" + score1);\n \
  \           Console.WriteLine(\"The score for try 2 \" + score2);\n        }\n \
  \       public int Calculate()\n        {\n            return (score1 + score2);\n\
  \        }\n    }\n    class Program\n    {\n        // 主函数\n        static void\
  \ Main(string[] args)\n        {\n            Player player1 = new Player();\n \
  \           player1.PlayerID = 1;\n            player1.PlayertName = \"John\";\n\
  \            player1.score1 = 10;\n            Player1.score2 = 20;\n          \
  \  player1.DisplayScore();\n            Console.WriteLine(\"The Total score \" +\
  \ player1.Calculate());\n            player1.InputCity(\"New York\");\n        \
  \    player1.DisplayCity();\n            Console.Read();\n        }\n    }\n}\n\
  ```\n\n通过上面的程序：\n- 我们定义了两个接口：`Score` 接口和 `Location` 接口。\n- `Player` `class` 同时实现了这两个接口并定义了方法。\n\
  \n以下是程序应该显示的内容：\nThe score for try 1 is 10\nThe score for try 2 is 20\nThe Total\
  \ score is 30\nThe player is from New York\n\n接口中的属性 (Properties in Interfaces)\n\
  \n可以在接口中定义属性。它们只能拥有 `get` 或 `set` 关键字，这告诉我们它们是只读属性还是读写属性。以下是语法结构。\n\n```csharp\n\
  public interface facename\n{\n    // 属性声明\n    datatype property\n    {\n      \
  \  get;\n        set;\n    }\n}\n```\n\n如果定义了 `get` 和 `set` 方法，则意味着该属性是读写属性。这里是接口属性如何工作的示例。使用接口属性：\n\
