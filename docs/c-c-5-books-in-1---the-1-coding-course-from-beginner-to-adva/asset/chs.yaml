  \ 2-4 描述部分的翻译）\n\n### 空合并运算符\n\nC# 为我们提供可以检查空值的运算符。当发现空值变量时，它会为该变量赋值值。\n\n让我们来看这个：\n\
  \n#### 示例 5\n\n```cs\nnamespace nullable\n{\n    Class program\n    {\n        static\
  \ void Main ()\n```\n\n\n\n\n\n```csharp\nstatic void Main ()\n{\n    int? a = null;\n\
  \    int? b = 4;\n    int c = a ?? 8;\n    System.Console.WriteLine($\"Value of\
