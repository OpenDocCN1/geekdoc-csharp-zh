  \ 2. :)\n\nIs Snow White still at index 2? False.\n\n# 第 7 章：索引器 (Indexers)\n\n\
  索引器允许自定义类像数组一样被索引。每个成员都通过数组操作符（`[]`）而不是属性来访问（你可能会认为这是一个类“C# 索引器”）。索引器的定义如下：\n\n\
  ```csharp\ntype this[int index]\n{\n    get\n    {\n        // 返回值\n    }\n    set\n\
  \    {\n        // 设置值\n    }\n}\n```\n\n以下是您访问类 `Example[2]`的方法；在下面的示例中，我们将它用作专辑搜索器，它告诉我们专辑发布的年份。\n\
  \n```csharp\nusing System;\nusing System.Collections.Generic;\n\nnamespace ConsoleApplication1\n\
  {\n    class Program\n    {\n        static void Main()\n        {\n           \
  \ Album main_floor = new Album();\n            // 添加项目\n            main_floor.AddItem(new\
  \ Item(\"The Crux\", 2012));\n            main_floor.AddItem(new Item(\"Chromatica\"\
  , 2020));\n            // 使用索引器获取年份\n            Console.WriteLine(\"The Crux by\
  \ HURT was released in \" + main_floor[\"The Crux\"] + \" and Chromatica by Lady\
  \ Gaga in \" + main_floor[\"Chromatica\"] + \".\");\n            Console.ReadKey();\n\
  \        }\n    }\n    class Album\n    {\n        List<Item> Items = new List<Item>();\n\
  \        public void AddItem(Item item)\n        {\n            Items.Add(item);\n\
  \        }\n        public double this[string index]\n        {\n            get\n\
  \            {\n                foreach (Item item in Items)\n                {\n\
  \                    if (item.Name == index)\n                    {\n          \
  \              return item.Year;\n                    }\n                }\n   \
  \             // 用于表示没有项目\n                return -1;\n            }\n         \
  \   set\n            {\n                // 你也可以用此来设置值，就像属性一样\n            }\n  \
  \      }\n    }\n    // 用于持有项目的简单类\n    class Item\n    {\n        public Item(string\
  \ name, double year)\n        {\n            Name = name;\n            Year = year;\n\
  \        }\n        public string Name { get; }\n        public double Year { get;\
  \ }\n    }\n}\n```\n\n我们应该在控制台中得到这个结果：\n\nThe Crux by HURT was released in 2012\
  \ and Chromatica by Lady Gaga in 2020.\n\n如果你在理解我做了什么上有困难，请将代码复制并粘贴到你的 IDE 中。它会被正确地高亮，代码也将更容易跟随。\n\
  \n# 第 8 章：泛型 (Generics)\n\n泛型允许我们在不指定数据类型的情况下声明列表、类和其他元素。换句话说，你将能够创建可以处理任何数据类型的方法和类。参数将作为不同类型的占位符。编译器将根据数据类型使用这些方法。泛型提高了代码的可重用性和灵活性。让我们看看下面的示例，以便你对泛型有更生动的理解。\n\
  \n我们在这里使用 `Display` 来展示它是如何工作的。在这个示例中，我们使用了多个方法来显示整数。\n\n```csharp\nusing System;\n\
  using System.Collections;\n\nnamespace Demo\n{\n    class Program\n    {\n     \
  \   // 显示整数的方法\n        public static void Add(int i)\n        {\n            Console.WriteLine(“The\
  \ value is “ + i);\n        }\n        // 显示双精度数字的方法\n        public static void\
  \ Add(double i)\n        {\n            Console.WriteLine(“The value is “ + i);\n\
  \        }\n        // 主函数\n        static void Main(string[] args)\n        {\n\
  \            Add(1);\n            Add(1.1);\n            Console.Read();\n     \
  \   }\n    }\n}\n```\n\n关于该程序，结果应该是这种格式：\n\nThe value is 1\n\nThe value is 1.1\n\
  \n在之前的示例中，我们创建了执行相同任务的方法。然而，我们需要一个用于整数，另一个用于双精度类型。我们可以使用 `Generic` 数据类型使此程序更泛化。下一个程序展示了如何使用泛型类型。\n\
  \n```csharp\nusing System;\nusing System.Collections.Generic;\n\nnamespace Demo\n\
  {\n    class Program\n    {\n        // 泛型 Display 方法\n        public static void\
  \ Display<T>(T i)\n        {\n            Console.WriteLine(\" This is value \"\
  \ + i);\n        }\n        // 主函数\n        static void Main(string[] args)\n  \
  \      {\n            // 带数据类型调用泛型\n            Display<int>(1);\n            Display<double>(1.1);\n\
  \            Console.Read();\n        }\n    }\n}\n```\n\n### 泛型类 (Generic Classes)\n\
  \n\n\n\n\n类也可以是泛型的。泛型类的语法声明如下所示。\n\n```csharp\npublic class classname<T>\n```\n\n\
  在这段代码中，`classname` 是类的名称。让我们来看一个泛型类的示例。\n\n示例：下方的程序展示了使用泛型类的方法。\n\n```csharp\nusing\
  \ System;\nusing System.Collections.Generic;\n\nnamespace Demo\n{\n    // 泛型类\n\
  \    public class GenericSet<T>\n    {\n        private T[] array;\n        public\
  \ GenericSet(int size)\n        {\n            array = new T[size + 1];\n      \
  \  }\n        public T getItem(int index)\n        {\n            return array[index];\n\
  \        }\n        public void setItem(int index, T value)\n        {\n       \
  \     array[index] = value;\n        }\n    }\n    class Program\n    {\n      \
  \  // 主函数\n        static void Main(string[] args)\n        {\n            GenericSet<int>\
  \ gn=new GenericSet<int>(2);\n            gn.setItem(1,1);\n            gn.setItem(2,2);\n\
  \            Console.WriteLine(\"Item number one is \" + gn.getItem(1));\n     \
  \       Console.WriteLine(\"Item number two \" + gn.getItem(2));\n            Console.Read();\n\
  \        }\n    }\n}\n```\n\n关于该程序，结果应该是这种格式：\n\nItem number one is 1\nItem number\
  \ two is 2\n\n## 泛型列表 <T> 集合\n\n泛型集合允许我们创建具有 `Array` 和 `ArrayList` 功能的数据集合。因此，它们更像数组。你必须像下面一样声明它们并初始化它们：\n\
  \n示例 1：\n\n```csharp\nusing System;\nusing System.Collections.Generic;\n\nnamespace\
  \ MySampleApplication\n{\n    public class Program\n    {\n        public static\
  \ void Main(string[] args)\n        {\n            List<int> myRows = new List <int>\
  \ ();\n            myRows.Add(11);\n            myRows.Add(22);\n            myRows.Add(33);\n\
  \            foreach(int i in myRows)\n            {\n                Console.WriteLine(\"\
  Number \" + i + \" in the house!\");\n            }            \n        }\n   \
  \ }\n}\n```\n\n`List` 类的类型签名是 `List<T>`，其中 `T` 可以是任何数据类型：字符串、`char`、`int`、`double`\
  \ 等。如果你定义了一个 `int` 列表，它将只包含 `int`，其他任何数据类型也是如此。在上面的示例中，列表将只包含整数，因为我们是这样定义的。此外，我们可以使用\
  \ `Add()` 方法添加任意数量的整数。列表允许我们在它们上使用许多方法，如 `Contains`、`Remove`、`Count` 等。\n\n以下是上述示例的输出：\n\
  \nNumber 11 in the house!\nNumber 22 in the house!\nNumber 33 in the house!\n\n\
  这之所以有效，是因为我们有 `myRows`，它存储了 `int` 类型的数据。我们使用 `Add` 方法添加整数，并使用 `foreach` 循环打印这些整数的值。\n\
  \n## 泛型方法\n\n泛型方法和类在跨数据类型的各种情况下为我们提供了高重用性。泛型方法的神奇之处在于，它们可以在包含它们的类不是泛型的空间中使用，或者类具有未定义的参数中使用。泛型方法始终遵循此模式：`method\
  \ name (type param)`。让我们来看下面的。\n\n示例 2：\n\n```csharp\nnamespace MySampleApplication\n\
  {\n    public static class MathExp\n    {\n        public static T Max<T>(T first,\
  \ params T[] values) where T : IComparable\n        {\n            T max = first;\n\
  \            foreach (T item in values)\n            {\n                if (item.CompareTo(max)\
  \ > 0)\n                {\n                    max = item;\n                }\n\
  \            }\n            return max;\n        }\n        public static T Min<T>(T\
  \ first, params T[] values) where T : IComparable\n        {\n            T mini\
  \ = first;\n            foreach (T item in values)\n            {\n            \
  \    if (item.CompareTo(mini) < 0)\n                {\n                    mini\
  \ = item;\n                }\n            }\n            return mini;\n        }\n\
  \    }\n}\n```\n\n示例类 `MathExp` 有两个泛型方法：`Min<T>` 和 `Max<T>`。这些函数的功能非常直接。`Min<T>`\
  \ 查找并返回列表中的最小值。`Max<T>` 查找列表中的最大值。`<T>` 是任何数据类型（如 `int`、字符串等）的占位符。这里是这两个方法的示例：\n\
  \n```csharp\nConsole.WriteLine(MathExp.Max<int>(63, 80, 700));\nConsole.WriteLine(MathExp.Max<string>(\"\
  Almonds\", \"Walnuts\"));\n```\n\n输出将是：\n700\nWalnuts\n\n在示例中，如果我们没有在列表中指定数据类型，C#\
  \ 编译器仍然能够运行该方法，因为它可以找出列表中包含什么数据类型。这被称为类型接口。为了看到它的作用，我们必须尝试代码，如下所示：\n\n```csharp\n\
  Console.WriteLine(MathExp.Max<int>(63, 80, 700));\nConsole.WriteLine(MathExp.Max<string>(\"\
  Almonds\", \"Walnuts\"));\n``` 输出将是：\n700\nWalnuts\n\n# 第 9 章 垃圾回收\n\n泛型方法和类使我们在跨数据类型的各种情况下具有高重用用性。泛型方法的神奇之处在于，它们可以在包含它们的类不是泛型的空间中使用，或者类具有未定义的参数中使用。泛型方法始终遵循此模式：`method\
