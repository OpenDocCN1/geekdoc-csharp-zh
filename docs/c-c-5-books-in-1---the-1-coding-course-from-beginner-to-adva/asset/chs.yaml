  \n### 索引器方法\n\n你知道如何索引操作符从数组中访问项，但让我们再次来看：\n\n```\nstatic void Main (string[] args)\n\
  {\n    // 使用索引操作符循环遍历\n    // 命令行参数。\n    for (int i = 0; i < args.Length; i++)\n\
  \        Console.WriteLine(\"Args: {0}\", args[i]);\n\n    // 声明一个包含本地整数的数组\n  \
  \  int[] myInts = { 12, 8, 101, 523, 8964};\n\n    // 使用索引操作符访问每个元素\n    for (int\
  \ y = 0; y < myInts.Length; y++)\n        Console.WriteLine(\"Index {0}  = {1} \"\
  , y, myInts[y]);\n\n    Console.ReadLine();\n}\n```\n\n这是一个使用索引操作符从数组访问项的教科书级示例。有趣的是，C#\
  \ 允许我们创建一个像数组一样可以索引的自定义类。为了实现这一点，我们必须定义索引器方法。这在开发泛型和非泛型集合类也有帮助。\n\n在实现自定义索引器之前，让我们看看它是如何工作的。假设我们为名为\
  \ `CarCollection` 的自定义集合类型添加了索引器方法的支持。我们还没有添加索引器，但请注意下面的用法：\n\n```\nclass myProgram\n\
