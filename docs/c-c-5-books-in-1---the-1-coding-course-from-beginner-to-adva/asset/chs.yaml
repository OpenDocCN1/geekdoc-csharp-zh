  \ |\n| ToArray | 用于将元素存入数组中 |\n| Dequeue | 用于从队列中移除元素（第一个元素） |\n| Contains | 用于查找队列是否包含某个特定元素\
  \ |\n\n### Count Property\n\n对于获取队列中的元素数量是非常关重要的。\n\n使用 count 属性\n\n```csharp\n\
