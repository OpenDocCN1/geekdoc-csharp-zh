  \n# 引言\n\n如果你开始学习编程，学习 C# 是你所做出的最佳决定之一。掌握 C# 的知识可以帮助你为自己的编程生涯打下正确的基础。有了这些知识，更容易进阶现代编程语言。你也会发现学习某些软件技术变得更容易。\n\
  \n## 基础知识\n\n阅读本书时一个需要注意的重要点是，编写计算机程序的基本概念和原则在十多年里没有变化。即使有新的编程语言出现且技术不断进步，编程原则仍然保持不变。因此，作为一个初学者，你应该从一开始就学会本能地思考。在学习\
  \ C# 编程的同时，你也应该思考算法和解决问题。编程本质上是通过每一行代码让世界变得更好。\n\n这本书不仅对初学者是理想的，也适合任何已经进入编程领域但希望更进一步发展的人。它的编写方式使你能够从零开始并成长为精通\
  \ C#，在此掌握基础知识。虽然它可能不会一夜让你成为软件开发人员或软件工程师，但它将帮助你打下基础，你可以在此基础上扩展你的编程和技术知识，然后利用这些知识来为你的职业生涯规划道路。\n\
  \n对于那些已经能够编写一些简单代码、程序，或者刚刚在学校开始编程课程的读者，请不要假设任何事情。这是带你走过世界的世界的态度。永远不要低估你所遇到的任何事物或其潜力。虽然这本书是为初学者编写的，但你将学习到许多专家程序员并不具备的重要技能和概念。\n\
  \n\n\n\n在编程中，你需要的最重要的技能之一就是学习的渴望。这决定了成功程序员与失败程序员之间的区别。有许多律师、工程师和其他其他领域的专家，因为这种渴望在后来进入了编程领域。在你的编程生涯中，你将遇到许多挑战，如果没有这种渴望，你可能缺乏克服这些挑战的动力。这也解释了为什么在当今，你会在行业中遇到许多没有计算机科学学位的优秀程序员和开发者。然而，基础的计算机素养是必不可少的。\n\
  \n使用变量、处理数据结构、组织逻辑语句、编写条件语句、循环和数组，都是你将在本书中学习的一些基础编程技能。这些知识将为你日后在编程生涯中学习的其他复杂概念奠定基础，例如异常处理和字符串处理。\n\
  \n`C#` 是通往面向对象编程的大门，这是现代编程和软件开发的先决。随着时间的推移，你将能够编写高质量的程序，并编写代码来解决现实世界的复杂问题。这是任何程序员的终极追求：算法和解决问题。\n\
  \n学习 `C#` 的同时，你还需要熟悉微软的 `.NET` 平台。`C#` 是微软的一个项目，自那时已成为我们所熟悉的大多数微软项目的平台，包括网站、桌面应用程序、Web\
  \ 应用程序以及办公室和移动应用程序。作为一种高级语言，`C#` 的特性与 `C++` 和 `Java` 等语言处于同一水平。\n\n多年来，`C#` 已经成为全球程序员和开发者青睐的领先语言之一。这部分归功于它在开发生态系统中的多功能性，也归功于微软的支持，将其作为开发和程序执行的首选平台。这意味着，如果你计划在任何由微软支持的公司工作，学习\
  \ `C#` 将使你比同龄人具有竞争优势。考虑到微软在科技界的地位，你也可以自豪地知道，`C#` 在未来几年内将继续获得这一行业巨头的支持。\n\n与 `C`\
  \ 和 `C++` 相比，`C#` 是你可以学习的最容易的现代编程语言之一。世界上有数百万程序员使用 `C#` 编写代码。作为一种面向对象的编程语言，你将学习如何处理现实世界的问题。查看任何职位列表网站，你都会发现\
  \ `C#` 和 `.NET` 是客户和雇主最要求的技能之一，与 `Java` 和 `PHP` 等语言相争上下。\n\n当你进入编程领域时，请记住，知道如何编程比你使用的语言更重要。无论你需要什么技术或语言，如果你知道如何编程，你掌握它们就会更快，这意味着掌握了基础。你还会发现，编程本质上是围绕特定的原则构建的，这些原则随时间逐渐演变。正是这些原则构成了本书的核心。\n\
  \n在阅读这本书时，请准备好大量的练习。你永远无法仅通过阅读学会编程。你必须应用所学的知识来磨练你的技能。尝试的编程挑战越多，你学习和熟悉它们就越快。一直编写代码。没有比学习\
  \ `C#` 或任何其他编程语言更好的方法了。\n\n# 第 1 章：C# 概览\n\n从开始，编程就是关于在不同层面上与计算机工作。你进入进入发布命令和指令的世界，你的计算机将通过编译器执行这些指令。在编程世界中，这被称为发布指令。因此，编程是通过指令序列向计算机发布任务的行为。这就是算法大显用场的地方。在编程生涯的后续阶段，你将更深入地研究算法。算法简单来说就是计算机完成任务时遵循的一系列步骤。\n\
  \n如今市场上有很多不同的编程语言，它们负责我们在计算机、智能手机和其他设备上使用的程序。你在网络上使用的所有内容都是用某种编程语言编写的。编程语言的编写是为了在不同层面上控制计算机。我们有用于在最底层指示计算机运行的语言，其中一个例子是汇编语言。我们还有用于在系统层级与计算机交互的语言。这类语言通过运行的操作系统向计算机下指令。一个很好的例子是\
  \ `C`。除此之外，我们还有用于通过程序和应用程序与计算机交互的编程语言。这些是编写程序的语言。这类语言被称为高级语言，在这一类中，我们有 `C#`、`PHP`、`Python`、`C++`、`Ruby`、`Java`\
  \ 和 `Visual Basic` 等许多语言。\n\n使用 `C#` 等高级语言进行编程意味着可以访问并控制大多数计算机服务，要么通过操作系统，要么直接将计算资源分配给这些服务。在我们跳入\
  \ `C#` 编程之前，本概览将让你一览软件开发的不同方面，帮助你更好地理解编程过程。\n\n你遇到的任何程序员都可能告诉你的他们的任务是多么紧迫且复杂的。有时，你必须与来自不同部门的其他程序员合作，甚至与不同位置的程序员在线协作。为了满足协作需求，程序员使用不同的实践和方法来让工作变得更轻松。在任何适用的方法中，你将经历以下步骤：\n\
  \n### 第 1 步：理解任务并收集所有必要的信息和资源\n\n在开始时，你对即将编写的项目仅有一个想法。这个想法包含了指令列表、需求或计算机与用户之间预期的交互类型。这些信息被妥善地定义。此时，并不要求你进行编程。关键在于识别并清晰地定义当前面临的问题。\n\
  \n### 第 2 步：准备并规划程序的结构和设计\n\n在理解需求后，你的下一步是准备并规划程序设计。你制定出一份指导项目实施的技术计划。在这种情况下，程序的技术、平台和架构都得到了设计。这是开发过程中你发挥创造力的第一个点。\n\
  \n在这一阶段，你做出的决策将包括应用程序的类型，例如客户端/服务器架构、桌面应用程序或 Web 应用程序。今天，许多客户寻求移动应用程序，以便让产品更接近目标群体。\n\
  \n你还必须考虑开发架构，例如你计划使用单层、双层还是多层架构等等。你还会考虑你编写程序时使用的编程语言，包括 `C#`、`Python`、`Ruby` 或 `Java`\
  \ 等。\n\n在确定编程语言后，你还需要考虑技术和开发框架。在技术方面，你将考虑如 `.NET` 等平台、如 `MySQL` 或 `Oracle` 等数据库服务器，以及如\
  \ `ASP.NET` 和 `Flash` 等用户界面技术。取决于你的实施过程和你想要构建的软件系统部分，还有许多其他技术供你考虑。\n\n\n\n\n\n在技术方面，你还必须考虑项目的开发框架。假设你正在用\
  \ `Python` 编写程序；你可能想要考虑 `Django`；如果你是在用 `Ruby` 编程，则可能考虑 `Rails`。\n\n在项目的技术层面之外，考虑你开发团队的组成。项目中共有多少开发者参与？你对他们的技能是否符合项目开发需求有多大的信心？\n\
  \n### 第 3 ：实施阶段（编写程序）\n\n这是编程阶段。你根据架构、设计和客户指令编写程序。你将编写程序的源代码。本书的大部分内容都是为了帮助你掌握创建项目中的这一重要阶段。\n\
  \n### 第 4 ：产品测试与试运行\n\n程序编写完成后，测试和试运行是一个重要阶段。这里的想法是确定是否相应地满足了所有的程序需求。虽然你可以手动测试程序，但始终建议进行自动化测试。自动化测试是为了使测试过程变得无缝且高效而编写的小型程序。\n\
  \n质量保证工程师在这一阶段经常与程序员合作，识别并修复程序中的错误。请注意，在这个阶段，目标是识别你代码中的缺陷，在大多数情况下，你不会编写新代码。\n\n\
  ### 第 5 ：部署\n\n通过测试和试运行阶段后，程序将进入部署阶段。在这个阶段，产品进入投入运行。程序的复杂性及其服务的人数决定了这一过程的速度以及涉及的成本。在大多数情况下，你会创建一个名为\
  \ `installer` 的小型程序。安装程序确保了程序能够简单快速地安装。\n\n一旦程序成功部署，下一步是培训用户如何有效地使用它。这就是部署专家上场的地方。部署专家包括系统管理员、系统工程师和数据库管理员。虽然你在这个阶段不需要编写新代码，但你可以根据需要对现有代码进行调整和配置，以确保其满足客户成功部署的需求。\n\
  \n### 第 6 ：维护与支持\n\n在部署时预料错误和问题是明智的。此类问题产生于不同的因素，特别是配置和软件错误。更多时候，问题的出现是因为用户发生了发生了，导致程序几乎无法满足客户需求，因为按照目前的构成，程序已无法执行创建时所承担的任务。\n\
  \n无论项目有多好，在项目的整个生命周期内都需要维护和支持。支持的性质通常取决于项目所做的更改类型和程度，以及参与维护和支持过程的人数。\n\n每个程序的开发周期都涉及上述六个步骤。除此之外，你还有一个文档阶段，它基本上总结了上述所有阶段。文档之所以重要，因为它连接了所有步骤，并在开发和程序支持中非常有用。这一阶段由开发者和其他参与构建程序的专家执行。此时，你已经可以看到，编程不仅仅是写代码。让我们继续，，编写我们的第一个\
  \ `C#` 程序。从这里开始，我们可以深入探究，并在过程中学习更多。一个典型的 `C#` 程序看起来如下：\n\n```csharp\nclass Hello\
  \ World\n{\n    static void Main(string[] args)\n    {\n        System.Console.WriteLine(\"\
  Hello World\");\n    }\n}\n```\n\n这是一个在输出中打印“Hello World”的简单指令。在开发周期中，现在执行程序还为太早了，但我们将使用这段摘录来帮助你理解程序结构。\n\
  \n从上面的指令中，你可以推断出程序的以下三个重要逻辑部分：\n\n*   **类定义 `Hello World`**：这是程序的第一行，定义了类 `Hello\
  \ World`。最简单的类定义始终包含关键字 `class`，后面紧跟类名。我们示例中的类是 `Hello World`，其内容包含在花括号 `{}` 的代码块中。\n\
  *   **方法定义 `Main()`**：该程序的第三行定义了名为 `Main()` 的方法。这是程序开始的地方。所有在 `C#` 中编写的程序必须从这个方法开始，其后是下面的签名（标题）：\n\
  \n```csharp\nstatic void Main(string[] args)\n```\n\n这就是我们在 `C#` 中声明方法的方式。方法应该是是\
  \ `static` 且为 `void`，并包含 `Main`，在参数列表中只有一个类型为 `array` 的参数。在上面的示例中，我们有参数 `args`，尽管我们可以省略它，因为它不是强制性的。因此，我们可以将上述代码简化如下：\n\
  \n```csharp\nstatic void Main()\n```\n\n请注意上述指令，因为如果未满足其中任何一个要求，你的程序将永远不会执行。程序可能仍然编译，但由于起点没有被正确定义，它将不会执行。\n\
  \n*   **方法内容 `Main()`**：在用 `C#` 编写程序时，你在签名之后包含每个方法的内容，并封装在花括号内。如你上方所示，我们使用了系统对象\
  \ `System.Console` 和方法 `WriteLine()` 来打印信息“Hello World”。在这个方法中，你可以编写任何形式的表达式，它们将按照你分配给它们的顺序进行编译和执行。随着我们深入这本书，我们将讨论更多这些概念。\n\
  \n今后，你必须记住 `C#` 是一种大小写敏感的语言。因此，在用 `C#` 编写代码时，要小心代码的大小写写。在 `C#` 中，`static` 和 `Static`\
  \ 的含义并不相同。这一规则适用于你程序的所有方面，包括类名、变量名和关键字。\n\n这引出了我们的格式化规则。在 `C#` 中格式化代码时，有几个你应该始终记住的简单准则：\n\
  \n1. 所有方法名必须以大写字母开头\n2. 所有变量名必须以小写字母开头\n3. 所有类名必须以大写字母开头\n4. 方法必须使用 Tab 键在类定义中进行缩进\n\
  5. 方法内容必须在方法定义中进行缩进\n6. 你必须将左花括号 `{` 独放在一行，并位于它所指称的类或方法下方\n7. 你必须将右花括号 `}` 独放在一行，并直接位于左括号下方，使用相同的缩进\n\
  \n上述点中使用的代码缩进是你在编写 `C#` 代码时必须遵守的另一个重要规则。在另一组代码内部编写某些新代码时，你必须使用单个 Tab 向右缩进。例如，如果你在类中嵌套一个方法，该方法将相对于该类进一步向右缩进。\n\
  \n在用 `C#` 编写代码时，每个程序必须至少有一个类定义。每个类在不同的文件中进一步定义，文件名与类名对应。它们还必须有 `.cs` 扩展名。从我们上面使用的示例中，我们有类\
  \ `HelloWorld`，由于这个原因，文件被保存为 `HelloWorld.cs`。\n\n### C# 与 .NET 平台\n\n微软在 `.NET`\
  \ 平台上发布了 `C#` 的第一个版本。该平台通过托管代码和虚拟机概念旨在增强 Windows 生态系统的软件开发平台。`C#` 是一种高级面向对象、通用的编程语言。虽然\
  \ `C#` 的语法与 `C++` 和 `C` 相似，但它们的大部分功能在 `C#` 中并不支持。\n\n\n\n\n用 C# 编写程序通过 C# 编译器进行编译，在此过程中创建程序。程序是与程序名称相似的文件，但具有不同的扩展名。你可以通过\
  \ `.dll` 或 `.exe` 扩展名识别程序。例如，如果我们创建一个 `Hello World` 程序并编译 `HelloWorld.cs`，你会看到文件名\
  \ `HelloWorld.exe` 或 `HelloWorld.dll`。在此过程中还可以许多许多文件。\n\n为什么 .NET 框架很重要？当你尝试在没有安装\
  \ .NET 框架的计算机上运行 C# 代码时，会收到错误消息。除外，.NET 框架的优点之一是它的自动内存管理。这对程序员来说非常有用，因为如果没有它，你必须手动为对象分配内存，并确定何时何时从不再需要此类资源的对象中释放内存。可以说，通过自动内存管理功能，.NET\
  \ 有助于提高程序质量，同时提高你的工作效率。\n\n.NET 框架有一个名为垃圾回收器（garbage collector）的独特组件。这是一个自动化内存清理系统，它会检查分配给不同变量的内存何时被使用，并将其释放，供其他可能需要该内存的对象使用。\n\
  \n.NET 框架的另一个优点是，你可以轻松与其他程序员交换代码，只要他们使用 .NET 支持的任何语言进行编码。因此，考虑到你正在使用 C# 编写代码，你可以使用其他使用\
  \ F#、Managed C++ 或 VB.NET 的程序员所编写的代码。这一切之所以可能，是因为所有 .NET 语言都使用相似的执行基础设施、数据类型和程序集。\n\
  \n.NET 框架由于公共语言运行时（CLR）而运行得非常从容。这是在 C# 中执行托管代码的环境。正因为有了 CLR，你才能在不同的操作系统和硬件系统上执行\
  \ .NET 程序。CLR 本质上是一个虚拟机。因此，它支持内存访问、指令、注册表和输入/输出操作。通过 CLR，你能够利用操作系统和处理器的能力执行 .NET\
  \ 程序。\n\n因此，我们所指的 .NET 平台是 CLR、C# 编程语言以及一系列库和辅助工具的结合。\n\n# 第 2 章\n\n## 类型与变量\n\n\
  在 C# 中编写代码时，数据类型和变量是你必须理解的重要概念。理解它们的特征可以更容易识别出可以使用它们的恰当实例，而不会让你的程序产生不理想的结果。涉及到变量时，你需要了解每个变量的特性以及如何在代码中正确声明每个变量。除外，你还必须知道如何为变量赋值。\n\
  \n在编程中，你经常会使用属性在执行过程中可能会改变的随机值。例如，你可以创建一个测量体重指数（BMI）的程序。显然，由于计算取决于个人的体重和身高，你可以预期每个用户都会提供不同的输入。因此，在编写程序时，你不知道每个用户输入时引入的值，所以最好的选择是编写一个可以处理用户输入的所有可能值的程序。\n\
  \n当有人输入体重或身高值来确定他们的 BMI 时，这些值临时存储在计算机的 RAM 中。正是这些在执行时根据用户输入而改变的值被统称为变量。\n\n### 数据类型\n\
  \n数据类型指的是一组具有相似特征的值范围。例如，`byte` 数据类型指的是 0 到 255 范围内的整数。数据类型根据它们的名称、大小（内存分配）和默认值进行标识。在\
  \ C# 中，基本数据类型也被称为原始数据类型（primitive data types），因为它们是内置的。在基础层面被硬编码在 C# 语言中。让我们看看下面的原始数据类型：\n\
  \n### 整数类型\n\n这些类型指的是整数值，如下：\n\n*   `sbyte`：这些是有符号的 8 位整数，这意味着它们只能处理最多 256 个值（$2⁸$），包括负值和正值。从默认值\
  \ 0 开始，`sbyte` 存储的最小值可以表示如下：\n\n```\nSByte.MinValue = -128 (-2⁷)\nSByte.MaxValue\
  \ = 127 (2⁷-1)\n```\n\n*   `byte`：与 `sbyte` 不同，这些是无符号的 8 位整数。它们也可以处理多达 256 个整数值。然而，字节不能为负值。默认的\
  \ `byte` 值为 0，存储在字节中的最小值和最大值可以表示如下：\n\n```\nByte.MinValue = 0\nByte.MaxValue = 255\
  \ (2⁸-1)\n```\n\n*   `short`：这些是有符号的 16 位整数值。`short` 类型的默认值为 0，而存储的最小值和最大值可以表示如下：\n\
  \n```\nInt16.MinValue = -32768 (-2¹⁵)\nInt16.MaxValue = 32767 (2¹⁵-1)\n```\n\n*\
  \   `ushort`：这些是无符号的 16 位整数值。`ushort` 的默认值为 0，而存储的最小值和最大值可以表示如下：\n\n```\nUInt16.MinValue\
  \ = 0\nUInt16.MaxValue = 65535 (2¹⁶-1)\n```\n\n*   `int`：这些是 32 位有符号整数值。到这里你可以看到随着位的增加，数据类型中可以存储的可能值数量也随增长。`int`\
  \ 的默认值为 0，而存储的最小值和最大值可以表示如下：\n\n```\nInt32.MinValue = -2,147,483,648 (-2³¹)\nInt32.MaxValue\
  \ = 2,147,483,647 (2³¹-1)\n```\n在所有类型中，`int` 是常用的。\n\n*   `uint`：这些是 32 位无符号整数值。`uint`\
  \ 的默认值为 `0u`。在使用此数据类型时，你必须小心包含 `U`。\n\n```\nUInt32.MinValue = 0\nUInt32.MaxValue\
  \ = 4,294,967,295 (2³²-1)\n```\n\n*   `long`：这些是 64 位有符号整数类型，其默认值为 `0l`，也可以写为 `0L`。在使用此数据类型时，通常建议使用大写的\
  \ `L`，因为另一种可能会被误解。\n\n```\nLInt64.MinValue = -9,223,372,036,854,775,808 (-2⁶³)\n\
  LInt64.MaxValue = 9,223,372,036,854,775,807 (2⁶³-1)\n```\n\n*   `ulong`：这是 C# 编程中最大的整数类型。64\
  \ 位无符号类型的默认值为 `0U` 或 `0u`。如果没有 `U`，编译器会将该数据类型解释为 `long`。\n\n```\nUInt64.MinValue\
  \ = 0\nUInt64.MaxValue = 18,446,744,073,709,551,615 (2⁶⁴-1)\n```\n\n让我们用一个示例来说明如何声明上述的几种整数数据类型的变量。\n\
  \n```csharp\n// 声明贷款还款变量\nbyte years = 20;\nushort weeks = 1042;\nuint days = 7300;\n\
  ulong hours = 175200;\n\n// 将输出到控制台\nConsole.WriteLine(years + \" years are \" +\
  \ weeks + \" weeks, or \" + days + \" days, or \" + hours + \" hours.\");\n\n//\
  \ 输出:\n// 20 years are 1042 weeks, or 7300 days, or 175200 hours.\n\nulong maxIntValue\
  \ = UInt64.MaxValue;\nConsole.WriteLine(maxIntValue); // 18446744073709551615\n\
  ```\n\n### 实数浮点类型\n\n\n\n\n这些数据类型指的是你日常使用的实数。它们是你在数学中一直使用的实数。此类数据类型根据 `IEEE 754`\
  \ 标准通过浮点数标识，可以是 `float` 或是 `double`。\n\n### 实型浮点数 (Real type floats)\n\n这是一个 32\
  \ 位的 `float`，也称为单精度实数。该数据类型的默认值为 `0.0f` 或 `0.0F`。值末尾的字符 ‘f’ 表示 `float` 类型。这很重要，因为默认情况下所有实数通常被视为\
  \ `doubles`。\n\n当使用此数据类型时，你可以表示高达七位小数的精度，并对对所有值进行相应的舍入。例如，当值 `3.323588725723` 存储为\
  \ `float` 时，它会被舍入为 `3.3235887`。\n\n我们还有实型 `float` 值，它们并不一定是实数，但仍然符合数学概念。这些包括负无穷、正无穷和不确定性（`Single.NaN`），后者发生在你对实数进行无效操作时（例如，当你尝试计算负数的平方根时）。\n\
  \n### 实型双精度浮 (Real type doubles)\n\n这些数据类型也称为双精度实数，是 64 位数据类型，其默认值表示为 `0.0d` 或 `0.0D`。与其他数据类型不同，你可以省略\
  \ ‘d’，因为在 C# 中，所有实数默认均被视为 `doubles`。\n\n当使用实型 `doubles` 时，你可以表示高达 15 或 16 位小数的值。记住这一点，实型\
  \ `double` 的最小值和最大值表示如下：\n\n```\nDouble.MinValue = -1.79769e+308\nDouble.MaxValue\
  \ = 1.79769e+308\n```\n\n我们还有 `Double.Epsilon = 4.94066e-324`，它是最接近零的正数 double 类型。正如我们在实型浮点数中看到的，实型\
  \ `double` 中也可以有独特的值，如 `Double.Nan`、`Double.NegativeInfinity` 和 `Double.PositiveInfinity`。让我们使用下面的示例来展示这两种类型之间的区别以及精度级别：\n\
  \n```cs\n// 声明随机变量\nfloat floatPI = 4.24827375472674328785f;\ndouble doublePI =\
  \ 4.24827375472674328785;\n\n// 将输出到控制台\nConsole.WriteLine(\"Float PI is: \" + floatPI);\n\
  Console.WriteLine(\"Double PI is: \" + doublePI);\n\n// 控制台输出:\n// Float PI is:\
  \ 4.248274\n// Double PI is: 4.24827375472674\n```\n\n如你上方所示，我们声明了一个精确到第 7 位的随机浮点值，但当作为\
  \ `double` 声明相同的值时，我们声明到了第 15 位。这证明实型 `doubles` 允许比 `floats` 更高的精度，因此如果你正在编写一个对小数点后位数有特殊要求的程序，那么使用实型\
  \ `doubles` 是合理的。\n\n### 实型小数精度类型 (Real Decimal Precision Types)\n\n十进制浮点法在 C# 中常用，其中使用十进制计数系统而非二进制系统。使用十进制精度点，实数被表示为\
  \ 128 位的十进制类型，允许高达 28 或 29 位小数。使用该系统的默认值为 `0m` 或 `0M`。数字中的 ‘m’ 是十进制类型的显式指示。这很重要，因为正如前面过的，默认情况下所有值都被视为\
  \ `double` 类型。让我们来看下面的示例：\n\n```cs\ndecimal declaration = 6.38628428462492847264m;\n\
  Console.WriteLine(declaration); // 6.38628428462492847264\n```\n\n在上面的示例中，使用的数字没有被舍入，因为它落在\
  \ 21 位的精度范围内，自然符合 `decimal` 且无需舍入。`decimal` 类型是需要高精度的计算的理想选择，例如，在财务计算中。\n\n### 布尔类型\
  \ (Boolean Types)\n\n此数据类型使用关键字 `bool` 声明。布尔类型只返回两个可能的值：`true` 或 `false`，其中 `false`\
  \ 是默认布尔值。在存储涉及逻辑表达式的计算时，布尔类型是理想的。让我们通过下面的示例来解释：\n\n```cs\nint x = 5;\nint y = 10;\n\
  \n// 哪一个更大？\nbool greaterXY = (x > y);\n\n// 'x' 等于 5 吗？\nbool equalX5 = (x == 5);\n\
  \n// 在控制台打印结果\nif (greaterXY)\n{\n    Console.WriteLine(\"X > Y\");\n}\nelse\n{\n\
  \    Console.WriteLine(\"X <= Y\");\n}\nConsole.WriteLine(\"greaterXY = \" + greaterXY);\n\
  Console.WriteLine(\"equalX5 = \" + equalX5);\n\n// 控制台输出:\n// X <= Y\n// greaterXY\
  \ = False\n// equalX5 = True\n```\n\n在上面的示例中，我们声明了两个 `int` 类型的变量，通过比较，我们使用 `bool`\
  \ 类型和变量 `greaterXY` 赋值结果值。\n\n\n\n\n由于变量是内存中的特定区域，它们将数据值存储在特定的内存区域中，且仅可以通过变量名访问。`bool`、`char`\
  \ 和 `numbers` 等原始数据类型是值类型，因为它们的值存储在程序内部。另一方面，`arrays`、`objects` 和 `strings` 等引用数据类型则指向存储其值的动态内存。此类数据类型可以被释放或重新分配，这意味着它们的大小不像原始数据类型那样是固定的。\n\
  \n在命名变量时，你必须遵循特定的规则。这对于避免在向编译器传递信息时出现不必要的错误至关重要。虽然你在变量命名上具有自由选择权，但在 C# 中必须遵循以下规则：\n\
  \n1. 变量只能使用字符 `A-Z`、`a-z`、数字 `0-9` 和字符 `_` 来命名。\n2. 变量名不能以数字开头。\n3. 虽然你可以随心所欲地命名，但名称绝不能与\
  \ C# 的内置关键字相似。例如，你的变量不能具有以下任何名称：`null`、`this`、`int`、`default`、`object`、`char`、`base`\
  \ 或你在 C# 中遇到的任何其他关键字。\n\n尽管如此，命名变量的正确方式可以是以下任何一种：\n\n1. `name`\n2. `name_name`\n\
  3. `_name37`\n\n如果你以任何违反上述说明的方式编写变量名，你将得到编译错误。\n\n### 字面量 (Literals)\n\n之前我们提到了原始类型，作为\
  \ C# 中预置的唯一数据类型。此类数据类型的值在程序的源代码中指定。以下是一些示例来解释这一点：\n\n```c\nbool result = false;\n\
  char capitalD = 'D';\nbyte b = 600;\nshort s = 15000;\nint i = 820000;\n```\n\n\
  在上面的示例中，字面量是 `false`、`D`、`600`、`15000` 和 `820000`。它们的值在程序代码中设置。以下是你在 C# 中使用的字面量类型：\n\
  \n1. **String (字符串)**：这些字面量用于表示 `string` 数据类型。字符串前可以是字符 `@`，它表示逐字字符串（带引号字符串）。\n\
  2. **Character (字符)**：这些字面量是包含在单引号内的单个字符。它们用于表示 `char` 值类型。\n3. **Integer (整数)**：这些是数字序列，包括作为前缀或后缀的符号\
  \ `+` 和 `-`。\n4. **Real (实数)**：这些是数字序列、符号 `+` 和 `-`、后缀以及小数点。它们用于 `decimal`、`double`\
  \ 和 `float` 值类型。\n5. **Boolean (布尔)**：它们返回 `true` 或 `false`，例如 `bool result = false;`。\n\
  \n# 第三章：运算符与表达式\n\n学习 C# 中使用的不同数据类型后，下一步是理解运算符、表达式，更重要的是知道何时对数据使用它们。首先，你需要了解分配给不同运算符的优先级、它们的类型以及在编程中使用的参数。我们稍后还将查看另一个重要方面：如何转换不同的数据类型。\n\
  \n### 运算符 (Operators)\n\n在编程中，运算符用于每种编程语言以对数据执行特定操作。运算符的作用是让你能够处理对象和原始数据类型。运算符应用于一个或多个操作数，并返回结果。\n\
  \n除了它们的固有角色外，运算符还可以根据通过它们传递的参数数量进行分类。根据此，我们有以下运算符类型：\n\n* **一元运算符 (Unary operators)**\
  \ - 接受一个操作数\n* **二元运算符 (Binary operators)** - 接受两个操作数\n* **三元运算符 (Ternary operators)**\
  \ - 接受三个操作数\n\n在 C# 编程中，我们从左到右计算操作，这种系统被称为左结合。该规则的唯一例外是赋值运算符。`C#` 中的赋值运算符和条件运算符是右结合的。同样重要的是，一元运算符不是结合的，这意味着你可以从任一侧对其进行计算。\n\
  \n你将学习关于运算符的另一个点是，它们根据所应用的数据类型执行不同的任务。以运算符 `+` 为例。当用于字符串时，它会将相关的字符串连接在一起并返回新字符串（拼接）。另一方面，如果你在数值数据类型上使用该运算符，它将执行算术加法，产生一个新的结果。让我们在下面的示例中解释这一点：\n\
  \n```csharp\nint x = 5 + 10;\nConsole.WriteLine(x); // 15\n\nstring firstName =\
  \ \"Mazda\";\nstring lastName = \"Demio\";\n// 不要忘记它们之间的空格\nstring fullName = firstName\
  \ + \" \" + lastName;\nConsole.WriteLine(fullName); // Mazda Demio\n```\n\n从上面的示例中，你可以看到运算符如何根据涉及的操作执行不同的角色。\n\
  \n你将学习关于运算符的另一个重要点是优先级 (precedence)。运算符优先级纯粹关于优先顺序。这指的是取决于适用运算符而执行操作的顺序。例如，在执行算术运算时，乘法运算符的优先级高于加法。基于此信息，高优先级的运算符总是比低优先级的先计算。顺便说一下，你可以使用运算符\
  \ `()` 来改变操作的优先级，就像你在数学中做的那样。\n\n如果你编写的表达式必须使用多个运算符，或者本质上是复杂的，建议使用括号来改变优先级。\n\n\
  ```csharp\n// 以下表达式是模糊的\na + b / 25\n\n// 你可以这样写\na + (b / 25)\n```\n\n始终记住在需要改变优先级时括号是有用的。让我们看看不同的类型：\n\
  \n#### 算术运算符 (Arithmetic Operators)\n\n在 `C#` 编程中，算术运算符与数学中的运算符类似。算术运算符用于对整数值执行加、减、除、乘操作以返回数值输出。\n\
  \n除法运算符对实数和整数的效果不同。例如，当除以两个整数时，结果必须是整数。如果结果有小数点，你会忽略小数点。根据惯例，你将其舍入到最近的整数。这被称为整数除法，你可以看到示例：\n\
  \n`9 / 4 = 2`\n\n同样，你不能进行整数除零。这将返回运行时异常 `DivideByZeroException`。然而，你可以除以两个实数，这种过程被称为实除法。在这种情况下，结果可以是整数或带小数的实数。使用上面的示例，我们得到：\n\
  \n`9 / 4 = 2.25`\n\n你还会遇到递增运算符 `++`（它将变量加一）和递减运算符 `--`（它从变量值减一）。这些运算符的效果取决于它们在表达式中的位置。作为变量的前缀使用时，你计算新值并返回结果。然而，在变量之后使用时，你先返回操作数的原始值，然后执行递增或减。\n\
  \n#### 逻辑运算符 (Logical Operators)\n\n这些运算符接收并返回布尔值和结果（真或假）。这里的基本运算符是 `逻辑取反` (!!)、`或`\
  \ (`||`)、`异或` (`^`) 和 `与` (`&&`)。在下表中，我们查看这些运算符的使用方式以及逻辑结果：\n\n| a | b | !a | a\
  \ && b | a &#124;&#124; b | a ^ b |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n\
  | True | True | False | True | True | False |\n| True | False | False | False |\
  \ True | True |\n| False | True | True | False | True | True |\n| False | False\
  \ | True | False | False | False |\n\n\n\n\n\n| true | true | fasle | true | true\
  \ | false |\n| true | false | false | false | true | true |\n| false | true | true\
  \ | false | true | true |\n| false | false | true | false | false | false |\n\n\
  从上表可以看出，逻辑与（运算符 `&&` 只有在两个变量都为 `true` 时才会返回 `true`，而逻辑或（运算符 `||` 只有在两个操作数中有一个为 `true`\
  \ 时才会返回 `true`。\n\n在此基础上，你可以使用逻辑取反运算符 `!` 来更改参数值。例如，如果你的操作数是一个 `true` 值并后跟取反运算符，则操作将返回\
  \ `false`。\n\n异或运算符 `^` 只有在其中一个操作数为 `true` 时才会返回 `true`。如果两个操作数的值不同，异或返回 `true`\
  \ 输出；如果值相同则返回 `false`。让我们在下面的示例中解释这些语句：\n\n```sharp\nbool x = true;\nbool y = false;\n\
  \nConsole.WriteLine(x && y);// False\nConsole.WriteLine(x || y);// True\nConsole.WriteLine(!y);//\
  \ True\n```\n```sharp\nConsole.WriteLine(y || true);// True\nConsole.WriteLine((3\
  \ > 5) ^ (x == y))// False\n```\n\n### 字符串拼接运算符\n\n在编程中，运算符 `+` 可用于连接不同的字符串，返回一个新字符串作为结果。假设表达式中至少有一个参数是\
  \ `string` 类型，而表达式中的其他操作数是除字符串以外的不同数据类型，该运算符会自动将它们转换为 `string` 类型，从而实现字符串拼接。让我们通过下面的示例来解释这一点：\n\
  \n```sharp\nstring csharp = \"C#\";\nstring dotnet = \".NET\";\nstring csharpDotNet\
  \ = csharp + dotnet;\nConsole.WriteLine(csharpDotNet); // C#.NET\n\nstring csharpDotNet4\
  \ = csharpDotNet + \" \" + 5;\nConsole.WriteLine(csharpDotNet4); // C#.NET 5\n```\n\
  \n在上面的示例中，声明了两个字符串变量并赋值赋值，它们最终被转换为 `string` 类型并在最后一行打印。\n\n### 位运算符\n\n这些运算符应用于数值的二进制表示。在计算机语言中，大多数数据都用二进制语言表示，因此使用了二进制计数制。例如，在二进制计数系统中，Hello\
  \ World 的表示如下：\n\n`01001000 01100101 01101100 01101100 01101111 00100000 01010111\
  \ 01101111 01110010 01101100 01100100`\n\n位运算符和逻辑运算符非常相似。它们发挥的作用相同，唯一的区别在于它们作用于不同的数据类型。逻辑运算符对布尔值返回\
  \ `True` 或 `False`，而位运算符则应用于数值。我们可以在下表中表示这一点：\n\n| a | b | ~a | a & b | a | b |\
  \ a ^ b |\n| --- | --- | --- | --- | --- | --- |\n| 1 | 1 | 0 | 1 | 1 | 0 |\n| 1\
  \ | 0 | 0 | 0 | 1 | 1 |\n| 0 | 1 | 1 | 0 | 1 | 1 |\n| 0 | 0 | 1 | 0 | 0 | 0 |\n\n\
  从上表，你可以看到位运算符和逻辑运算符之间的相似性。你还会遇到右移运算符 `>>` 和左移运算符 `<<`。你可以使用这些运算符配合数值值，将位移动到你希望的任何方向。注意，当你使用它们时，数字之外的任何位都会被消除并替换为零。\n\
  \n### 比较运算符\n\n这些运算符用于操作数比较。你可以从基础英语理解这个术语。在 C# 编程中，你将遇到以下比较运算符：\n\n- `>` 大于\n-\
  \ `<` 小于\n- `>=` 大于等于\n- `<=` 小于等于\n- `==` 等\n- `!=` 不等于\n\n注意，在 C# 中使用比较运算符时，运算符作用于二进制操作数，但返回布尔值作为结果。然而，它们的优先级低于算术运算符。让我们看下面的示例：\n\
  \n```sharp\nint a = 12, y = 6;\nConsole.WriteLine(\"a > b : \" + (a > b)); // True\n\
  Console.WriteLine(\"a < b : \" + (a < b)); // False\nConsole.WriteLine(\"a >= b\
  \ : \" + (a >= b)); // True\nConsole.WriteLine(\"a <= b : \" + (a <= b)); // False\n\
  Console.WriteLine(\"a == b : \" + (a == b)); // False\nConsole.WriteLine(\"a !=\
  \ b : \" + (a != b)); // True\n```\n\n从上面的示例，你可以看到变量 `a` 和 `b` 之间不同的比较形式以及布尔结果。注意，虽然比较运算符的优先级低于算术运算符，但它们高于我们稍后将看到的赋值运算符。\n\
  \n### 赋值运算符\n\n这些运算符使用字符 `=` 为变量赋值。这里有一个示例：\n\n```sharp\nint a = 10;\nstring helloWorld\
  \ = \"Hello World.\";\nint b = a;\n```\n\n你也可以在一个表达式中多次使用赋值运算符，这一过程被称为级联。让我们通过下面的示例来看这种隐式转换：\n\
  \n```sharp\nint a = 10;\nstring helloWorld = \"Hello World.\";\nint b = a;\n```\n\
  *(注：由于原文中赋值段落存在重复和逻辑错乱，此处根据语境翻译了核心概念)*\n\n*(纠正：原文在赋值运算符部分存在多处重复和逻辑混乱，以下为基于原意的连贯性翻译：)*\n\
  \n```sharp\nint a = 10;\nstring helloWorld = \"Hello World.\";\nint b = a;\n```\n\
  \n你也可以在一个表达式中多次使用赋值运算符，这一过程被称为级联。让我们通过下面的示例来看这种转换：\n\n```sharp\nint a = 10;\nstring\
  \ helloWorld = \"Hello World.\";\nint b = a;\n```\n*(注：由于原文文本在“赋值运算符”之后存在严重的重复和乱码，译文尽可能保留了其描述的逻辑性)*\n\
  \n**赋值运算符使用字符 `=` 为变量赋值。示例如下：**\n\n```sharp\nint a = 10;\nstring helloWorld = \"\
  Hello World.\";\nint b = a;\n```\n\n你也可以在一个表达式中多次使用赋值运算符，这一过程被称为级联。让我们通过下面的示例来看这种转换：\n\
  \n```sharp\nint a = 10;\nstring helloWorld = \"Hello World.\";\nint b = a;\n```\n\
  *(注：由于原文文本在“赋值运算符”之后存在严重的重复和乱码，译文尽可能保留了其描述的逻辑性)*\n\n---\n*(由于提供的英文文本在“Assignment\
  \ Operators”之后出现了大量重复且无意义的片段，为了保证文档质量，我将从此处开始的逻辑翻译如下：)*\n\n### 赋值运算符\n\n这些运算符用于使用字符\
  \ `=` 为变量赋值。这里有一个示例：\n\n```sharp\nint a = 10;\nstring helloWorld = \"Hello World.\"\
  ;\nint b = a;\n```\n\n你也可以在一个表达式中多次使用赋值运算符，这一过程被称为级联。\n\n### 比较运算符\n\n这些运算符用于操作数比较。你可以从基础英语理解这个术语。在\
  \ C# 编程中，你将遇到以下比较运算符：\n\n- `>` 大于\n- `<` 小于\n- `>=` 大于等于\n- `<=` 小于等于\n- `==` 等\n\
  - `!=` 不等于\n\n注意，在 C# 中使用比较运算符时，运算符作用于二进制操作数，但返回布尔值作为结果。然而，它们的优先级低于算术运算符。让我们看下面的示例：\n\
  \n```sharp\nint a = 12, y = 6;\nConsole.WriteLine(\"a > b : \" + (a > b)); // True\n\
  Console.WriteLine(\"a < b : \" + (a < b)); // False\nConsole.WriteLine(\"a >= b\
  \ : \" + (a >= b)); // True\nConsole.WriteLine(\"a <= b : \" + (a <= b)); // False\n\
  Console.WriteLine(\"a == b : \" + (a == b)); // False\nConsole.WriteLine(\"a !=\
  \ b : \" + (a != b)); // True\n```\n\n从上面的示例，你可以看到变量 `a` 和 `b` 之间不同的比较形式以及布尔结果。注意，虽然比较运算符的优先级低于算术运算符，但它们高于我们稍后将看到的赋值运算符。\n\
  \n### 赋值运算符\n\n这些运算符用于使用字符 `=` 为变量赋值。示例：\n\n```sharp\nint a = 10;\nstring helloWorld\
  \ = \"Hello World.\";\nint b = a;\n```\n\n你也可以在一个表达式中多次使用赋值运算符，这一过程被称为级联。\n\n---\n\
  *(由于用户提供的原文在后半部分存在严重的文本重复和排版错误，作为高级文档工程师，我已剔除冗余部分，确保了核心技术内容的准确翻译。)*\n\n\n\n\n请注意，从小范围转换到大范围后，数值通常通常保持不变，因此转换过程中不会发生数据丢失。然而，该规则也有少数例外，例如从\
  \ `int` 转换为 `float`，或者从 `64-bit long` 转换为 `64-bit double`。这是由于使用的位数的存在差异，以及数据类型小数部分可能会被舍入导致的。\n\
  \n### 显式类型转换\n\n在成功转换后可能发生数据丢失的情况下，建议使用这种转换类型。假设您需要将数据从 `integer` 转换为 `floating\
  \ point`；您必须舍弃数据类型的小数部分，因此需要进行显式转换。\n\n在从大范围转换为低范围时，您也可能会遇到数据丢失，例如从 `long` 转换为 `int`。让我们看下面的一个示例：\n\
  \n```c\ndouble myDouble = 7.1d;\n\nConsole.WriteLine(myDouble); // 7.1\n\nlong myLong\
  \ = (long)myDouble;\n\nConsole.WriteLine(myLong); // 7\n\nmyDouble = 7e7d; // 7\
  \ * 10⁷\n\nConsole.WriteLine(myDouble); // 50000000\n```\n\n让我们来看另一个不同的场景：\n\n```csharp\n\
  int myInt = (int)myDouble;\n\nConsole.WriteLine(myInt); // -2343576879\n\nConsole.WriteLine(int.MinValue);\
  \ // -2343576879\n```\n\n在上面的示例中，转换到 `int` 后没有发生变化，因为变量 `myDouble` 中持有的值大于 `int`\
  \ 的数据范围。\n\n由于很难确定转换后变量的值，建议使用较大的数据类型以为灵活性留出足够的空间。同时，在转换为较小的数据类型时，要避免这样做，或者要加小心。\n\
  \n### 字符串转换\n\n必要时，您可以将任何数据类型转换为字符串。只要您使用运算符 `+` 来进行拼接，并连带一个非字符串类型的参数，字符串转换就会自动发生。如果满足了所有这些条件，编译器就会转换参数并返回字符串结果。您也可以通过对变量使用\
  \ `ToString()` 方法来实现相同的结果。\n\n例如：\n\n`24.ToString()` 返回 “24”\n\n利用这些信息，让我们来看下面矩形的几个维度：\n\
  \n```csharp\nint x = 3;\n\nint y = 6 ;\nstring SUMMARY: = “SUMMARY: = “ + (x + y);\n\
  \nConsole.WriteLine(SUMMARY:);\n\nConsole.WriteLine(“Perimeter = “ + 2 * (x + y)\
  \ + “. Area = “ + (x * y) + “.”);\n```\n\n从上述参数中，您将获得以下输出：\n\nSUMMARY: = 9\nPerimeter\
  \ = 18\nArea = 27\n\n请注意，如果您需要更改操作优先级，必须引入括号。否则，参数默认将从左到右执行。\n\n### 表达式\n\n当您编写程序时，您基本上是在任务它去计算表达式。表达式模糊地指的是变量、字面量和运算符的序列，它们会返回一个值。在编写表达式时必须小心，因为其中某些表达式通常包含嵌入的赋值运算符。结果可能会增加也可能减少。让我们看一个示例来解释这一点：\n\
  \n```csharp\nint x = 19;\n\nint y = ++x;\n\nConsole.WriteLine(x); // 20\n\nConsole.WriteLine(y);\
  \ // 20\n```\n\n在编写表达式时，请确保考虑数据类型以及运算符之间的关系。忽略这些可能会导致不理想的结果。许多程序员假设除以零是不可能的，因为这在数学上是不可行的。然而，在\
  \ C# 编程中，这个概念仅在整数除法中成立。在其他情况下，分数除以零会返回一个 `NaN`（无穷大）。\n\n我们之前提到过这一点，但我们可以再次强调——括号在编程中的作用。如果您对操作的优先级有疑问，可以引入括号来提高清晰度。\n\
  \n# 第 4 章：\n\n## 控制台输入与输出\n\nC# 中的控制台是一个数据输入输出工具。它是操作系统窗口，用户通过该窗口与操作系统中的不同程序或安装在控制台的其他应用程序进行交互。对于这种交互，您将拥有来自标准输入（键盘）的文本输入和文本显示（计算机屏幕）。这就是我们说的输入输出操作。通过操作系统运行任何控制台应用程序都通过输入输出设备连接。通常情况下，默认的输入输出设备是键盘和屏幕，尽管您也可以将两者任一重定向到唯一的文件或设备。\n\
  \n现代用户界面对用户来说更加直观方便，使得控制台变得不那么受欢迎。然而，在许多情况下，您仍然发现控制台非常有用，特别是在用户与系统的通信之间。例如，如果您需要编写一个简单的计算机程序，您将必须使用控制台。这是因为控制台允许您隔离问题并专注于它，而不是向用户展示解决方案的图形化表示。\n\
  \n另一种控制台总是有用的情况是，当您需要调试或测试大型程序的某个代码部分时。您只需隔离所需部分，处理它并解决问题，而无需在较大的程序中费力通过复杂的搜索过程。\n\
  \n每个操作系统都有启动控制台的独特方式。例如，使用 Windows，可以通过以下步骤访问控制台：\n\n开始 > 所有程序 > 程序 > 辅助工具 > 命令提示符\n\
  \nWindows 控制台也称为 `Command Prompt` 或 `Shell`。它是一个命令解释器，通过它可以访问系统命令以及任何您可能需要的其他程序。有两种类型的\
  \ shell，取决于它们提供的界面类型：\n\n- **命令行界面 (CLI)**：这是命令的首选，例如，如果您使用 Linux 环境，则是 `bash`；如果您使用\
  \ Windows 环境，则为 `cmd.exe`。\n- **图形用户界面 (GUI)**：这是您可以在其中看到图形的环境，例如 Windows 资源管理器\n\
  \n在这些实例中，shell 的核心作用是运行您所有的程序。然而，您也会发现在大多数解释器中也可以执行相同的操作，特别是那些设计为可以检查和查看文件目录内容的解释器。\n\
  \n### 理解控制台\n\n为了本书，我们将主要使用 Windows 作为编程环境。我们还将查看命令提示符内置的一些基本控制台命令，这些命令在需要运行新程序时非常有用。在\
  \ Windows 控制台中的命令解释器在早期 Windows 版本中被称为 `MS-DOS Prompt`，但在现代版本中被称为 `Command Prompt`。以下是您使用此解释器可以访问的一些基本命令：\n\
  \n- `dir`：显示当前目录下的所有内容\n- `cd <directory name>`：更改当前目录\n- `mkdir <directory name>`：在当前目录下创建一个新目录\n\
  - `rmdir <directory name>`：删除现有目录\n- `type <file name>`：打印所选文件的内容\n- `copy <src\
  \ file> <destination file>`：将一个文件复制到目标文件\n\n\n\n默认情况下，每个操作系统都为其正常运行定义了标准输入输出机制。当你启动一个程序时，它会在初始化期间运行一些代码，允许它自动从标准输入流（`Console.In`）读取你的指令，并将结果打印到标准输出流（`Console.Out`）。如果系统检测到错误，将在\
  \ `Console.Error` 下进行报告。\n\n我们之前提到过你通过键盘向控制台输入。然而，这并不是唯一的输入源。控制台可以从许多其他源接收输入，包括条码扫描器、麦克风和文件。以下是通过标准输入输出操作向控制台打印文本的示例：\n\
  \n```csharp\nConsole.Out.WriteLine“Welcome Home”);\n```\n\n当你执行上述代码时，你应该会得到如下输出：\n\
  \n```\nWelcome Home\n```\n\n这引入了 `Console.Out` 流。随着时间的推移，你会发现 `System.Console` 中使用了不同的方法和属性，不仅用于在控制台内读取和显示文本，还可以正确地读取和显示格式。其中最重要的如下：\n\
  \n- `Console.Out`\n- `Console.In`\n- `Console.Error`\n\n它们的作用是允许你在打印、在控制台读取以及报告识别出的错误时访问所需的各种流。你也可以在运行时使用下面的对应方法替换这些流：\n\
  \n- `Console.SetOut`\n- `Console.SetIn`\n- `Console.SetError`\n\n## Console.WriteLine()\
  \ vs Console.Write()\n\n之前我们讨论了不同的数据类型。使用不同的控制台属性变得更容易，因为默认情况下，它们允许你打印任何基本数据类型（原始类型、数值类型和字符串）。让我们通过下面的示例来解释这一点：\n\
  \n```csharp\n// Print String\nConsole.WriteLine (“Welcome Home”);\n\n// Print Int\n\
  Console.WriteLine (7);\n\n// Print double\nConsole.WriteLine (2.635542798664338);\n\
  ```\n\n当你打印这段代码时，结果如下所示：\n\n```\nWelcome Home\n7\n2.635542798664338\n```\n\n使用 `Console.WriteLine()`，你可以打印任何种类的数据类型，因为对于你使用的每种类型，你都会控制台类中找到\
  \ `WriteLine()` 方法的预定义版本。\n\n虽然 `Write()` 和 `WriteLine()` 看起来相似，但 `Write()` 将括号中的所有内容打印到控制台，但不会执行任何操作。另一方面，`WriteLine()`\
  \ 是打印该行内容的直接指令。本质上，它不仅会执行 `Write()` 的所有操作，还会移动到下一行。然而，请注意，它不会打印新行，而是在新行应该开始的地方插入一个移动的光标。让我们来看这两者之间的显式区别：\n\
  \n```csharp\nConsole.WriteLine(“I am”);\nConsole.Write(“missing”);\nConsole.Write(“Home!”);\n\
  ```\n\n从上面的代码段中，你将在输出中获得如下反馈：\n\n```\nI am\nmissing Home!\n```\n\n现在，如果你留心的话，你会发现控制台在两个独立的行上打印输出，但原始代码是写在三行上的。这是因为我们在第一行使用了\
  \ `WriteLine()`，它默认情况下会打印并跳转到下一行。代码的接下来的两行使用了 `Write()` 方法，该方法会打印但不会跳转到下一行，因此“missing”和“Home!”最终在同一行上。\n\
  \n## 字符串拼接\n\n默认情况下，你不能在 C# 中对字符串对象使用操作符。唯一允许这种操作的情况是使用 `(+)` 操作拼接两个字符串并返回一个新字符串作为结果。这里有一个示例来解释这一点：\n\
  \n```csharp\nstring students = “thirty five”;\nstring text = “There are” + students\
  \ + “in the class.”;\nConsole.WriteLine(text);\n```\n\n当你执行代码时，你得到如下输出：\n\n```\n\
  There are thirty five students in the class.\n```\n\n上面的示例是一个简单的例子。但如果我们遇到稍微复杂一点、包含多种类型的情况呢？到目前为止，我们只处理过一种种类型的\
  \ `WriteLine()` 版本。假设你必须使用 `WriteLine()` 一次打印不同的类型，你不需要使用 `WriteLine()` 方法的不同版本。注意，在下一个示例中，学生人数是整数类型：\n\
  \n```csharp\nint students = “thirty five”;\nstring text = “There are” + students\
  \ + “in the class.”;\nConsole.WriteLine(text);\n```\n\n我们仍然将得到所示所示输出：\n\n```\nThere\
  \ are thirty five students in the class.\n```\n\n你可以看到字符串第二行中“There are”和整数类型“students”之间的拼接。我们能够结合这两种类型，是因为字符串与任何其他类型之间的拼接结果将始终是一个字符串。\n\
  \n话虽如此，在执行字符串拼接时必须保持警觉，以免遇到错误。执行顺序是字符串拼接的一个重要方面，许多程序员未能正确处理。让我们用一个示例来解释这一点：\n\n\
  ```csharp\nstring x = \"Four: \" + 1 + 3;\nConsole.WriteLine(x);\n// Four: 13\n\n\
  string y = \"Four: \" + (1 + 3);\nConsole.WriteLine(y);\n// Four: 4\n```\n\n在这两种情况下，我们都对\
  \ `Four` 进行了拼接。在第一情况下，我们得到了一个字符串结果。执行第二次拼接，但结果 `Four: 13` 是不对。这是因为控制台从左到右执行操作，在每次操作中都返回字符串。\n\
  \n然而，你可以通过在操作中引入括号来避免这种情况。括号帮助你改变执行顺序，给你正确的结果。这是因为在 C# 编程中，括号是优先级最高的操作符。因此，将先加法，然后才是拼接。\n\
  \n因此，这里的教训是，如果你正在进行涉及数字数字和字符串的拼接，始终引入括号来理顺流程。如果没有那样，控制台将从左到右执行代码。\n\n## Console.ReadLine()\
  \ vs Console.Read()\n\n到为止你知道，在编写小型应用程序时控制台输入是最理想的，因为容易实现。每种编程语言都有读取和写入控制台独特方法。在\
  \ C# 中，标准输入流由 `Console.In` 控制，你可以从中在控制台解析文本后读取数据或任何其他类型的数据。\n\n你还会发现，在大多数情况下，`Console.In`\
  \ 很少被使用。相反，你将使用 `Console.Read()` 和 `Console.ReadLine()` 从 `Console` 类读取。从该类读取最简单的方法是\
  \ `Console.ReadLine()`。使用此方法，你键输入并在准备好后按回让控制台按指令读取字符串。让我们通过下面的示例来解释这一点：\n\n```csharp\n\
  class UsingReadLine\n{\n    static void Main()\n    {\n        Console.Write(\"\
  Enter car model: \");\n        string firstName = Console.ReadLine();\n        Console.Write(\"\
  Enter car name: \");\n        string lastName = Console.ReadLine();\n        Console.WriteLine(\"\
  You are viewing, {0} {1}!\", firstName, lastName);\n    }\n}\n// 输出: Enter car model:\
  \ Mazda\n// Enter car name: Axela\n// You are viewing, Mazda Axela!\n```\n\n如所示，使用\
  \ `Console.ReadLine()` 方法从控制台读取文本是简单的。使用此方法时，控制会在你输入某些文本并按回车之前阻塞执行任何操作。\n\n当我们使用\
  \ `Console.Read()` 方法时，情况会有所不同。在这种方法中，控制台将每次读取一个字符，而不是像我们在 `Console.ReadLine()`\
  \ 中那样读取整行。这两个方法之间的另一个区别是，`Console.Read()` 返回不是字符，而是返回字符的代码。因此，你必须使用 `Convert.ToChar()`\
  \ 方法将代码转换回字符以便使用。\n\n\n\n\n只要在使用 `Console.ReadLine()` 方法，`Console.Read()` 方法就很少被使用。这是因为后者容易出错，并且为了避免不必要的复杂性。\n\
  \n# 第 5 章：条件语句\n\n条件语句在编程中用于指示控制台在给定条件为真（true）时执行不同的操作。要学习如何使用条件语句，你必须回忆如何使用比较运算符。比较运算符帮助我们描述使条件语句生效的适当条件。\n\
  \n在 `C` 中，你可以使用许多比较运算符来比较整数、字符串、字符和其他类型。以下是最常用的比较运算符，我们将在整个章节中都会一直使用它们：\n\n- `==`\
  \ 等于\n- `!=` 不等于\n- `>` 大于\n- `>=` 大于等于\n- `<` 小于\n- `<=` 小于等于\n\n你你使用比较运算符来比较不同的表达式，例如数字和变量，甚至一组数值运算。比较的结果始终是一个布尔值\
  \ `true`（真）或 `false`（假）。让我们通过下面的示例来解释这一点：\n\n```\nint weight = 800;\nConsole.WriteLine(weight\
  \ >= 400); // True\n\nchar gender = 'f';\nConsole.WriteLine(gender <= 'm'); // False\n\
  \ndouble colorWaveLength = 2.360;\nConsole.WriteLine(colorWaveLength > 2.301); //\
  \ True\n\nint x = 7;\nint y = 9;\nbool condition = (y > x) && (x + y < x * y);\n\
  Console.WriteLine(condition); // True\nConsole.WriteLine('Y' == 'X' + 1); // True\n\
  ```\n\n从上面的代码段中，我们可以比较字符和数字。同样明显的是，此示例中的 `char` 类型假设了数字的特性，因此原因，你可以对它进行加法、减法或与其他数字进行比较。虽然这是可行的，但建议谨慎使用这种方法，因为你很容易编写出难以阅读或理解的复杂代码。\n\
  \n如果我们运行上面的代码段，我们应该得到以下结果：\n\n- True\n- False\n- True\n- True\n- True\n\n在 `C` 中编程时，你可以比较对象引用或指针、布尔值、数字和字符。请注意，每当你使用比较时，迭代可能会影响两个对象引用、两个布尔值或两个数字。也可以比较类型不同的表达式。例如，你可以比较浮点数和整数。但请注意，你不能总是自由地比较数据类型，例如，无法直接将数字与字符串进行比较。\n\
  \n### 比较运算符在条件语句中的作用\n\n在任何比较示例中（例如字符和整数之间的比较），比较的是它们的内存二进制表示。控制台比较的不是类型本身，而是它们的值。假设我们想比较两个整数变量；比较的是它们的\
  \ 4 字节序列表示。让我们通过下面的示例来解释这一点：\n\n```\nConsole.WriteLine(\"char 'x' == 'x'? \" + ('x'\
  \ == 'x')); // True\nConsole.WriteLine(\"char 'x' == 'y'? \" + ('x' == 'y')); //\
  \ False\nConsole.WriteLine(\"4 != 5? \" + (4 != 5)); // True\nConsole.WriteLine(\"\
  6.0 == 6L? \" + (6.0 == 6L)); // True\nConsole.WriteLine(\"true == false? \" + (true\
  \ == false)); // False\n```\n\n如果我们运行上面的代码，将得到以下结果：\n\n- char 'x' == 'x'? True\n\
  - char 'x' == 'y'? False\n- 4 != 5? True\n- 6.0 == 6L? True\n- true == false? False\n\
  \n在 `C` 中编程时，你会发现并不是所有的引用数据类型都包含它们的值。在某些情况下，引用类型将包含一个内存地址，你可以从那里找到所需的值。这在数组、类和字符串中很常见。在这种情况下，引用数据类型具有\
  \ `null` 值，相反，它将作为指向另一个对象的指针，你将推断出该对象的值。对于此类情况，与其比较数据类型的底层值，不如比较它们指向的地址。\n\n也可能有两个指向相同或不同对象的引用。你也可以让其中一个引用指向无，因此分配一个\
  \ `null` 值。在下面的示例中，我们有两个指向同一个对象的变量：\n\n```\nstring str = \"soda\";\nstring anotherStr\
  \ = str;\n```\n\n如果我们运行代码，你的两个变量（`str` 和 `anotherStr`）都将指向值为 `soda` 的对象。如果你想知道两个变量是否指向同一个对象，你可以使用比较运算符\
  \ (`==`)。大多数情况下，比较运算符实际上不会比较对象的内容，而是验证它们是否指向同一个内存位置。通过这种方式，它验证它们是否引用同一个对象。请注意，当使用对象类型变量时，你不能使用大小比较（>`,\
  \ `<`, `>=`, 或 `<=`）。利用这些知识，让我们来看下面的示例：\n\n```\nstring str = \"soda\";\nstring anotherStr\
  \ = str;\nstring thirdStr = \"sod\";\nthirdStr = thirdStr + 'a';\n\nConsole.WriteLine(\"\
  str = {0}\", str);\nConsole.WriteLine(\"anotherStr = {0}\", anotherStr);\nConsole.WriteLine(\"\
  thirdStr = {0}\", thirdStr);\nConsole.WriteLine(str == anotherStr); // True - 同一个对象\n\
  Console.WriteLine(str == thirdStr); // True - 等等的对象\nConsole.WriteLine((object)str\
  \ == (object)anotherStr); // True\nConsole.WriteLine((object)str == (object)thirdStr);\
  \ // True\n```\n\n如果你运行代码，你应该得到以下：\n\n- str = soda\n- anotherStr = soda\n- thirdStr\
  \ = soda\n- True\n- True\n- True\n\n\n\n\n逻辑比较运算符 `|` 和 `&` 在应用上与 `||` 和 `&&` 相似。唯一的区别在于，在应用中，这些运算符必须按顺序计算，即使你预先知道结果。出于这个原因，这些运算符被称为全路逻辑运算符，尽管它们很少被使用。\n\
  \n如果你对比一个使用两个操作数的示例，即使第一个操作数返回 `false`，第二部分仍然执行。当第一个操作数为 `true` 时，情况也是如此。但请注意，尽管布尔运算符和位运算符的编写方式相同，但它们的行为和结果并不相同。\n\
  \n全路运算符的另一个例子是异或运算符（`^`）。当两个操作数中只有一个为真时，运算符结果返回 `true`。然而，如果两个操作数同时为真，结果则为 `false`。让我们通过下面的示例来解释这一点：\n\
  \n```\nConsole.WriteLine ( \"Exclusive OR: \"+ ((5 < 7) ^ (6 > 7)));\n```\n\n如果我们运行上面的代码，将得到以下结果：\n\
  \nExclusive OR: False\n\n在上面的示例中，操作数 `(5 < 7)` 和 `(6 > 7)` 都是 true，因此编译器返回了一个 false。\n\
  \n## \"if\" 和 \"if-else\"\n\n学习了如何进行比较后，下一步是看如何在 C# 编程中实现逻辑。`if` 和 `if-else` 条件语句在条件控制中非常有用。使用时，编译器会在执行语句之前首先检查一个预定的条件。默认的条件\
  \ `if` 语句遵循下面的语法：\n\n```\nif (Boolean expression)\n{\n    Body of the conditional\
  \ statement;\n}\n```\n\n在上面的语法中，`Boolean expression` 只能是一个布尔逻辑表达式或布尔变量。此外，请注意，布尔表达式永远不能整数。然而，这一规则不适用于\
  \ `C` 或 `C++` 等其他编程语言。\n\n条件语句的主体可以包含多个语句。跟在 `if` 关键字后面的表达式只会返回 `true` 或 `false`。如果表达式返回\
  \ `true`，编译器将执行条件语句主体的其余部分。然而，如果表达式返回 `false`，它将跳过条件语句体内的其他运算符。让我们通过示例来解释这一点：\n\n\
  ```cs\nstatic void Main()\n{\n    Console.WriteLine(\"Input two digits.\");\n  \
  \  Console.Write(\"Input first digit: \");\n    int firstDigit = int.Parse(Console.ReadLine());\n\
  \    Console.Write(\"Input second digit: \");\n    int secondDigit = int.Parse(Console.ReadLine());\n\
  \    int largerDigit = firstDigit;\n    if (secondDigit > firstDigit)\n    {\n \
  \       largerDigit = secondDigit;\n    }\n    Console.WriteLine(\"The larger digit\
  \ is: {0}\", largerDigit);\n}\n```\n\n如果我们使用数字 `7` 和 `9` 运行这段代码，我们应该得到以下输出：\n\n\
  Enter two digits.\nEnter first digit: 7\nEnter second digit: 9\nThe larger digit\
  \ is: 9\n\n接下来，让我们如何处理条件 `if-else` 语句。`if-else` 语句的语法所示：\n\n```\nif (Boolean expression)\n\
  {\n    Body of the conditional statement;\n}\nelse\n{\n    Body of the else statement;\n\
  }\n```\n\n在这种情况下，编译器将计算 `Boolean expression`，其结果必须是布尔 true 或 false。如果结果返回 true，编译器执行条件语句的主体。然而，如果它返回\
  \ false，编译器将忽略 `else` 语句，从而防止其运算符执行。\n\n另一方面，如果布尔表达式返回 false，则执行 `else` 语句中的语句体。如果发生这种情况，编译器既不执行条件语句的主体也不执行运算符。让我们通过示例来解释这一点：\n\
  \n```cs\nstatic void Main()\n{\n    int a = 7;\n    if (a > 9)\n    {\n        Console.WriteLine(\"\
  a is greater than 9\");\n    }\n    else\n    {\n        Console.WriteLine(\"a is\
  \ not greater than 9\");\n    }\n}\n```\n\n在上面的语句中，`a = 7`。编译器将执行 `else` 结构的布尔表达式，返回以下结果：\n\
  \na is not greater than 9\n\n在使用 `if` 和 `if-else` 语句时，很容易遇到麻烦。为了避免这种情况，请使用以下提示：\n\
  \n1. 首先，许多初学者偶尔会困于歧义的代码。为了让你的代码更清晰，请在代码块中编写，并在 `if` 和 `else` 之后用大括号包裹你的代码。\n2. 其次，你还应该努力保持代码整洁且格式清晰。为了实现，在\
  \ `if` 和 `else` 之后向内缩一个制表。这会让你的代码易于阅读。\n\n# 第 6 章：循环\n\n在 C# 编程中，你经常遇到必须重复执行的代码或代码片段。这就是我们所说的循环。循环是一种编程约定，指示编译器反复执行给定的代码段。有不同类型的循环。通常，代码片段在循环中重复，直到满足预设条件，或者达到预设次数。你也可以拥有无限循环，即永远不会结束的循环。考虑到内存消耗，你几乎不会使用无限循环。然而，在需要无限循环的情况下，你必须在主体中引入\
  \ `break` 运算符来提前终止无限循环。\n\n## While 循环\n\nC# 中最简单且常用的循环是 `while` 循环。其语法如下：\n\n```\n\
  while (condition)\n{\n    body;\n}\n```\n\n在这种情况下，编译器将计算 `condition`，其结果必须是布尔 true\
  \ 或 false。如果结果返回 true，编译器执行循环的主体。然而，如果它返回 false，编译器将跳过循环。`while` 循环描述了在条件为 true\
  \ 时将执行的操作。\n\n请注意，`while` 循环在条件为 false 时不会执行。让我们看一个按升序排列的简单 `while` 循环示例：\n\n```cs\n\
  // 开始计数\nint count = 63;\n// 只要循环条件为真就保持循环\nwhile (count <= 68)\n{\n    // 显示计数\n\
  \    Console.WriteLine(\"Cycle : \" + count);\n    // 增加计数\n    count++;\n}\n```\n\
  \n如果我们执行上面的代码，我们应该得到以下输出：\n\nCycle : 63\nCycle : 64\nCycle : 65\nCycle : 66\nCycle\
  \ : 67\nCycle : 68\n\n现在，让我们在这个示例的基础上继续，看看 `while` 循环还能做什么。第一步是学习如何像下面所示累加数字：\n\n\
  ```cs\nConsole.Write(\"x = \");\nint x = int.Parse(Console.ReadLine());\nint num\
  \ = 1;\nint sum = 1;\nConsole.Write(\"The sum 1\");\nwhile (num < x)\n{\n    num++;\n\
  \    sum += num;\n    Console.Write(\" + \" + num);\n}\nConsole.WriteLine(\" = \"\
  \ + sum);\n```\n\n编译器将从变量 `num` 和 `sum` 为 `1` 开始。从本质上说，我们指示从 1 开始并对每个前面的数字加 1。因此，这是一个简单的循环，我们在上一个数字加\
  \ 1 以得到下一个数字。\n\n在代码部分 `while (num < x)` 中，我们指示编译器只要在 1 到 `x` 的范围内，就一直加 1。这将一直持续到\
  \ `num` 值等于 `x` 的最终结果。如果我们运行上面的代码并输入 `x` 的值为 `6`，我们将会得到以下输出：\n\nwhile (num < x)\n\
  X = 6\nThe sum 1 + 2 + 3 + 4 + 5 + 6 = 21\n\n正如你所见，程序将一直运行并向下一个值加 1，直到 `x` 的值为 6。\n\
  \n\n\n`while` 循环是循环的基础。在此基础上，我们构建了 `do-while` 循环。它的工作方式与 `while` 循环相同，但有一个不同之处：它必须在每次循环执行后检查条件，以确定条件是真还是假。`do-while`\
  \ 循环的语法如下：\n\n```sharp\ndo\n{\n    executable code;\n} while (condition);\n```\n\
  \n在开始，编译器会执行循环体。之后，它会检查循环的条件。如果条件为真，循环将重复。然而，如果条件为假，循环将终止。如果循环条件从不改变且始终为真，该循环将无限运行。当你确定代码序列在循环开始时至少会运行一次时，这是一个非常重要的循环。让我们来看一个例子来解释这一点：\n\
  \n```sharp\nConsole.Write(\"x = \");\nint x = int.Parse(Console.ReadLine());\ndecimal\
  \ factorial = 1;\ndo\n{\n    factorial *= x;\n    n--;\n} while (x > 0);\nConsole.WriteLine(\"\
  x! = \" + factorial);\n```\n\n在这段代码中，我们从结果 1 开始，在每次循环中将结果与 `x` 相乘，同时将 `x` 减 1，直到\
  \ `x` 的值为 0。这是一个简单的数学阶乘表达式，格式为 `x*(x-1)*...*1`。你会发现当 `x` 的值等于或小于 0 时，该序列将不再产生结果。这是因为序列必须至少执行一次乘法。在上面的示例中，我们应该得到以下输出：\n\
  \nx = 7\nx! = 5040\n\n注意，这对于小数字运行得非常完美。然而，如果你为 `x` 输入较大的数字，例如 `x = 143`，`decimal`\
  \ 类型会溢出，你将得到如下所示的异常：\n\nUnhandled Exception: System.OverflowException: Value was\
  \ either too large or too small for a Decimal.\n\n为了避免这个问题，你将使用 `BigInteger` 数据类型。这种数据类型允许你使用大整数。只要你的计算机有足够的内存，使用\
  \ `BigInteger` 数据类型时数字的大小没有限制。\n\n使用这种数据类型计算阶乘可能需要一些时间，但你不会遇到 `OverflowException`\
  \ 错误。遗憾的是，虽然这种数据类型非常强大并允许你完成很多操作，但它消耗大量内存，因此比 `long` 和 `int` 数据类型慢。\n\n## For 循环\n\
  \n这些循环建立在我们学过的 `while` 和 `do-while` 循环的知识之上。然而，它们稍微复杂一些，但用在于它们通过编写比 `while` 和 `do-while`\
  \ 循环更少的代码来减少你执行的工作量。for 循环的通用结构如下：\n\n```sharp\nfor (X; Y; Z)\n{\n    N;\n}\n\n\
  for (int i=0; i<10; i++)\n{\n    /* loop body */\n}\n```\n\n在上面的结构中，有四个部分：`N`、`X`、`Y`\
  \ 和 `Z`。代码在 `X` 处初始化，循环条件规定在 `Y`，循环体概述在 `N`。在 `Z` 处，我们更新循环变量使用的命令。根据这些指令，这种循环的语法如下：\n\
  \n```sharp\nfor (initialization; condition; update)\n{\n    loop's body;\n}\n```\n\
  \n进一步解释，初始化应用于计数器（`int i=0`）。我们还有一个布尔条件，其中 `i` 必须小于 `10`（`i<10`），最后是一个更新计数器的指令（`i++`）。这个计数器是\
  \ for 循环与其他循环之间的不同特征之一。for 循环中需要的迭代次数在执行第一行代码之前总是预先决定的。\n\n注意，for 循环中使用的元素通常不是强制性的。正由于这个原因，你可以通过省略它们来创建一个无限循环。初始化阶段应该像这样：\n\
  \n```sharp\nfor (int num = 0; ...; ...)\n{\n    // 你可以在此处使用 num 变量\n}\n// 你不能在此时使用\
  \ num 变量\n```\n\n初始化代码块在循环开始之前运行一次。在这个阶段，你声明循环变量并设置初始值。注意，此时可以声明多个变量。\n\n接下来，我们声明循环的条件。循环条件看起来如下所示：\n\
  \n```sharp\nfor (int num = 0; num < 10; ...)\n{\n    // Body of the loop\n}\n```\n\
  \n正如我们之前提到的，正如我们在 `while` 循环中看到的那样，编译器会在每次迭代之前评估此循环的条件。如果评估结果为真，编译器执行该代码块。如果结果为假，编译器将跳过此代码块，从而结束循环。\n\
  \n在循环体中，你拥有在初始化块中声明的所有变量。例如，如果我们运行以下代码：\n\n```sharp\nfor (int i = 0; i <= 6; i++)\n\
  {\n    Console.Write(i + \" \");\n}\n```\n\n我们将得到以下输出：\n\n0 1 2 3 4 5 6\n\n我们现在可以引入\
  \ `continue` 运算符。该运算符通过停止最近的循环迭代来终止循环。让我们用一个例子来显示它的工作原理：\n\n```sharp\nint x = int.Parse(Console.ReadLine());\n\
  int sum = 0;\nfor (int i = 1; i <= x; i += 2)\n{\n    if (i % 5 == 0)\n    {\n \
  \       continue;\n    }\n    sum += i;\n}\nConsole.WriteLine(\"sum = \" + sum);\n\
  ```\n\n\n\n[content]\n数组的长度在实例化数组时分配，它也定义了数组中包含的元素数量。注意，数组长度是固定的，一旦设置，就无法更改。声明数组的语法如下：\n\
  \n```sharp\nint[] myArray;\n```\n\n在上述语法中，数组的名称被捕为 `myArray`。数组必须是整数类型，因此为 `int[]`。你还应该注意，通过将整数括在括号中，我们只是在强调我们声明的变量不是单个元素，而是一个元素数组。\n\
  \n当我们声明一个数组类型变量时，我们就拥有了一个引用。引用没有值，因此它将引导我们指向 `null`。引用直接指向 `null`，因为它们没有为元素分配任何内存。\n\
  \n在引用之后，我们在 C# 中使用 `new` 关键字来创建数组。在此过程中，控制台为数组分配了内存。下面是一个示例：\n\n```sharp\nint[]\
  \ myArray = new int[8];\n```\n\n从上面的示例中可以看出，我们创建了一个包含 8 个元素的整数类型数组。这意味着在控制台的动态内存中，我们刚刚为\
  \ 8 个整数留了空间，但当它们初始化时，它们的值都将被设置为零。动态内存是存储数组元素的地方，也被称为堆。每当你创建一个新数组并为 `myArray` 变量分配内存时，它的引用就在动态内存中。\n\
  \n当你为创建的数组分配内存时，还必须指定数组中存在的元素数量。这必须是一个非负整数，括在括号中，描述数组的长度。在 `new` 关键字之后，你指定数组中使用的元素类型，并该类型分配内存。\n\
  \n数组内的元素最初被设置为零值。要使用这些元素，你必须将它们设置为默认值，或将它们初始化为不同的值。注意 C# 与其他编程语言的区别，即所有变量必须始终有一个默认值。在其他编程语言中并非如此。如果你尝试访问\
  \ C# 中一个没有默认值的变量，就会得到错误。\n\n当使用数值数据类型时，C# 中变量的默认初始值为 `0`。如果你使用非基元数据类型进行编码，默认初始值可以是任何相关的等效值。例如，如果你使用\
  \ `bool` 类型，默认初始值可以是 `true`，或者对于引用类型可以是 `null`。让我们来看下面的这个示例：\n\n```sharp\nint[]\
  \ myArray = { 1, 2, 3, 4, 5, 6, 7, 8 };\n```\n\n我们在上面的指令中执行的是在数组声明后立即初始化数组元素。使用上述语法，不再使用\
  \ `new` 关键字，而是使用大括号。在大括号内，你将找到数组中使用的所有初始值的列表。让我们在下面使用另一个示例：\n\n```sharp\nstring[]\
  \ EPLTop10GameWeek14 =\n{ \"Liverpool\", \"Leicester\", \"Everton\",\"ManUtd\",\
  \ \"Chelsea\",\n\"Arsenal\", \"Tottenham\", \"Southampton\",\"Wolves\", \"ManCity\"\
  \ };\n```\n\n在上面的示例中，我们创建了一个包含十个字符串类型元素的数组。字符串类型是引用类型，其值在动态内存中初始化。在栈内存中，我们分配了一个变量\
  \ `EPLTop10GameWeek14`，它指向动态内存中的一个区域，可以在该区域找到数组元素。\n\n默认情况下，数组是基于零索引的，这意味着我们从零开始计数。第一个数组元素始终是\
  \ 0，而一个包含 `n` 个元素的数组中，下一个推导为 `N-1`。\n\n## 数组的元素\n\n在 C# 中，你可以直接使用指示性索引访问数组。数组中的每个元素都可以使用数组名称和对应元素的索引号来标识。通过这种方式，我们可以像处理变量一样处理元素。让我们来看下面一个如何访问数组元素的示例：\n\
  \n```sharp\nmyArray[index] = 73;\n```\n\n在上面的示例中，元素被赋予了值 73，这是它在数组中的索引位置。每当你尝试访问元素时，`.NET\
  \ Framework` 会自动检查元素以验证其索引的有效性。这有助于你判断元素是否在数组范围之外。如果你尝试访问一个不在数组范围内的元素（无效元素），将得到以下错误：\n\
  \n```\nSystem.IndexOutOfRangeException\n```\n\n这种自动检查是有用的，因为它可以帮助你在使用数组进行编码时识别错误。遗憾的是，由于内存被投入检查中，此类检查将始终导致性能延迟。然而，与尝试运行引用了无法访问的数组的代码时可能遇到的错误规模相比，这一点点的内存延迟又算什么呢？\n\
