  \n在计算机编程中，你会经常遇到栈，无论是在游戏开发、算法编写还是缓存中。栈之所以是优选，是因为它们容易跟踪。由于它们使用了“后进先出”（last-first-out）的过程，使得处理变得简单。\n\
  \n栈的工作方式就像它的名字听起来一样。它是一个事物的塔，新项目被添加在顶部。这不一定是一种有组织的处理方式，但它可以非常强大。在计算机的普通栈中，移除塔中间的物品是危险的，因此最后添加的东西会被先移除，你不能移除中间或底部的东西。\n\
  \n向栈中添加东西被称为“推送”（push）。你可以在需要时执行此操作。移除元素被称为“弹出”（pop）。当你弹出某个东西时，它会从栈中移除，但你可以对它进行处理。你也可以将其丢弃。\n\
  \n列表和栈对计算机编程至关重要。如果你掌握了它们，你将看到整体技能的提升，因为你能够更有效地操作数据、保存日志和运行算法。\n\n下面是栈的语法。\n`Stack\
  \ variename=new Stack();`\n`fieldname` 是我们赋予栈的变量。\n\n向栈中添加东西被称为推送。\n`element` 是被添加到栈中的值。\n\
  \n使用栈\n\n```csharp\nusing System;\nusing System.Collections;\nnamespace Demo\n{\n\
  \    class Program\n    {\n        // 主函数\n        static void Main(string[] args)\n\
  \        {\n            // 定义 ArrayList\n            ArrayList ar = new ArrayList();\n\
  \            // 向数组列表添加元素\n            ar.Add(1);\n            ar.Add(2);\n    \
  \        ar.Add(3);\n            Console.Read();\n        }\n    }\n}\n```\n\n`Stack`\
  \ 类有很多可以对其执行的操作。我们在下面简要介绍它们：\n\n### 栈操作\n\n这是一个摘要。\n\n| 函数 | 描述 |\n| :--- | :---\
  \ |\n| Count | 告诉我们栈中有多少元素 |\n| Clear | 栈中的所有元素 |\n| Pop | 移除栈中的最后一个元素 |\n| Peek\
  \ | 查看栈中的最后一个元素。它不会移除它。 |\n| ToArray | 将所有元素放入数组 |\n| Contains | 检查栈是否包含某个元素。 |\n\
  \n### Count 函数 (Count Function)\n\n我们正在使用 `count` 操作来查找栈中有多少元素。\n\n使用 `count` 属性\n\
  \n```csharp\nusing System;\nusing System.Collections;\nnamespace Demo\n{\n    class\
  \ Program\n    {\n        // 主函数\n        static void Main(string[] args)\n    \
  \    {\n            // 定义 ArrayList\n            ArrayList ar = new ArrayList();\n\
  \            // 向数组列表添加元素\n            ar.Push(1);\n            ar.Push(2);\n  \
  \          ar.Push(3);\n            Console.WriteLine(\"The number of elements on\
  \ the stack is \" + ar.Count);\n            Console.Read();\n        }\n    }\n\
  }\n```\n\n控制台将打印以下内容：\n栈中的元素数量为 3\n\n### 清空函数 (Clear Function)\n\n我们使用 `clear` 函数移除栈中的所有元素。\n\
  \n使用 `clear` 函数\n\n```csharp\nusing System;\nusing System.Collections;\nnamespace\
  \ Demo\n{\n    class Program\n    {\n        // 主函数\n        static void Main(string[]\
  \ args)\n        {\n            // 定义 ArrayList\n            ArrayList ar = new\
  \ ArrayList();\n            // 向数组列表添加元素\n            ar.Push(45);\n           \
  \ ar.Push(77);\n            ar.Push(99);\n            ar.Push(54);\n           \
  \ Console.WriteLine(\"The number of elements on the stack is \" + ar.Count);\n \
  \           // 清空栈\n            ar.Clear();\n            Console.WriteLine(\"The\
  \ number of elements on the stack is \" + ar.Count);\n            Console.Read();\n\
  \        }\n    }\n}\n```\n\n我们应该在控制台中得到如下结果：\n栈中的元素数量为 4\n栈中的元素数量为 0\n\n### 弹出函数\
  \ (Pop Function)\n\n我们使用 `pop` 移除最后添加的元素。\n\n使用 `pop` 函数\n\nusing System;\n\n\n\n\
  \n\n```csharp\nusing System.Collections;\n\nnamespace Demo\n{\n    class Program\n\
  \    {\n        // The main function\n        static void Main(string[] args)\n\
  \        {\n            // Defining the Stack\n            Stack ar = new Stack();\n\
  \            // Adding elements to the Stack\n            ar.Push(87);\n       \
  \     ar.Push(90);\n            ar.Push(15);\n            Console.WriteLine(\"The\
  \ number of elements in the stack is\" + ar.Count());\n            Console.WriteLine(\"\
  We have popped an element reducing the number of elements to \" + ar.Pop());\n \
  \           Console.Read();\n        }\n    }\n}\n```\n\n关于该程序，结果结果应该是这种格式：\n\n\
  The number of elements in the stack is 3\nWe have popped an element reducing the\
  \ number of elements to 2\n\n### Peek Function\n\n我们将使用 `peek` 来查看栈中的最后一个元素。\n\n\
  以下是 `peek` 函数的一个应用示例。\n\n```csharp\nusing System;\nusing System.Collections;\nnamespace\
  \ Demo\n{\n    class Program\n    {\n        // The main function\n        static\
  \ void Main(string[] args)\n        {\n            // Defining the Stack\n     \
  \       Stack ar = new Stack();\n            // Adding elements to the Stack\n \
  \           ar.Push(11);\n            ar.Push(22);\n            ar.Push(333);\n\
  \            Console.WriteLine(\"The element at the top of the stack is \" + ar.Peek());\n\
  \            Console.Read();\n        }\n    }\n}\n```\n\n我们应该在控制台中看到这个结果：\n\nThe\
  \ element at the top of the stack is 333\n\n### ToArray Function\n\n我们将使用 `ToArray`\
  \ 方法将栈的内容导出到数组中。\n\n接下来的程序展示了使用 `ToArray` 函数的方法。\n\n```csharp\nusing System;\nusing\
  \ System.Collections;\nnamespace Demo\n{\n    class Program\n    {\n        // The\
  \ main function\n        static void Main(string[] args)\n        {\n          \
  \  // Defining the Stack\n            Stack ar = new Stack();\n            object[]\
  \ ar1 = new object[3];\n            // Adding elements to the Stack\n          \
  \  ar.Push(11);\n            ar.Push(22);\n            ar.Push(33);\n          \
  \  // Transfering the elements to an array\n            ar1=ar.ToArray();\n    \
  \        Console.WriteLine(\"The first element is \" + ar1[0].ToString());\n   \
  \         Console.WriteLine(\"The second element is \" + ar1[1].ToString());\n \
  \           Console.WriteLine(\"The third element is \" + ar1[2].ToString());\n\
  \            Console.Read();\n        }\n    }\n}\n```\n\n我们应该在控制台中看到这些：\n\nThe\
  \ first element is 33\nThe second element is 22\nThe third element is 1\n\n### Contains\
  \ Function\n\n下面我们使用该函数来查找栈是否包含某个特定元素。\n\n此程序用于展示 `contains` 函数。\n\n```csharp\n\
  using System;\nusing System.Collections;\nnamespace Demo\n{\n    class Program\n\
  \    {\n        // The main function\n        static void Main(string[] args)\n\
  \        {\n            // Defining the Stack\n            Stack ar = new Stack();\n\
  \            // Adding elements to the Stack\n            ar.Push(800);\n      \
  \      ar.Push(342);\n            ar.Push(3);\n            // Transfering the elements\
  \ to an array\n            Console.WriteLine(\"Does the stack contain the element\
  \ 800? True or False? \" + ar.Contains(800));\n            Console.Read();\n   \
  \     }\n    }\n}\n```\n\n以下是我们在控制台中应该得到的：\n\nDoes the stack contain the element\
  \ 800? True or False? True\n\n### Queue\n\n`Queue` 集合是一个先进先出的集合，与栈（stack）集合相反。下面的语法用于定义一个队列：\n\
  \n`Queue variablename=new Queue();`\n\n```与之前一样，`variablename` 代表我们分配给 `Queue` 集合的任何变量。`Enqueue`\
  \ 方法向队列添加元素：\n\n`Variablename.Enqueue(element)` \n\n在上面的示例中，`element` 代表要添加到队列的值。\n\
  \n下面，我们来说明队列是如何被使用的。\n\n以下是队列的应用示例。\n\n```csharp\nusing System;\nusing System.Collections;\n\
