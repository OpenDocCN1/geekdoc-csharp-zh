  \            }\n            set\n            {\n                score = value;\n\
  \            }\n        }\n    }\n    class Program\n    {\n        // 主函数\n   \
  \     static void Main(string[] args)\n        {\n            Player player1 = new\
  \ Playert();\n            player1.PlayerID = 1;\n            player1.PlayerName\
  \ = \"John\";\n            player1.score = 20;\n            player1.try = \"first\
  \ try\";\n            Console.WriteLine(\"The score is \" + player1.marks);\n  \
  \          Console.WriteLine(\"The try is the \" + player1.try);\n            Console.WriteLine(\"\
  The PlayerID is \" + player1.PlayerID);\n            Console.Read();\n        }\n\
  \    }\n}\n```\n\n\n\n\n\n```\n        }\n    }\n}\n```\n\n在上面的程序中：\n\n- 我们接口中设置了\
  \ 3 个属性。\n- `Try` 和 `Score` 属性是可读写的属性，因为它们拥有 `get` 和 `set` 方法。\n- `PlayerID` 只有\
  \ `get` 属性，这意味着它是一个只读属性。\n- 随后我们在类中定义了这些属性的实现。\n\n关于该程序，结果格式如下：\n\nThe score is\
  \ 20\nThe try is the first try\nThe PlayerID is 1\n\n# 第三章\n\n## 命名空间 (Namespaces)\n\
  \n命名空间允许我们分离并使用具有相似名称和参数但用途不同的函数（“C# 命名空间”）。在编程语言中并不常见。每个函数都必须有一个唯一的名称。\n\n以下是语法：\n\
  \n```csharp\nnamespace namespaceName\n{\n    Class definition\n    {\n        //\
  \ Define the functions\n    }\n}\n```\n\n所有定义的函数将属于 `namespaceName` 命名空间。在某些程序中，你需要以下定义：\n\
  \n`using System;`\n\n结果将是使用 `System` 命名空间中定义的函数。\n\n示例：下面的程序用于演示如何使用命名空间。\n\n```csharp\n\
  using System;\n\n// 一个 namespace\nnamespace NameA\n{\n    public class ClassA\n\
  \    {\n        public void FunctionA()\n        {\n            Console.WriteLine(\"\
  This is from namespace A\");\n        }\n    }\n}\n\n// 第二个 namespace\nnamespace\
  \ NameB\n{\n    public class ClassB\n    {\n        public void FunctionA()\n  \
  \      {\n            Console.WriteLine(\"This is from namespace B\");\n       \
  \ }\n    }\n}\n\nnamespace Demo\n{\n    class Program\n    {\n        // The main\
  \ function\n        static void Main(string[] args)\n        {\n            // Using\
  \ the namespaces\n            NameA.ClassA clsA = new NameA.ClassA();\n        \
  \    clsA.FunctionA();\n            NameB.ClassB clsB = new NameB.ClassB();\n  \
  \          clsB.FunctionA();\n            Console.Read();\n        }\n    }\n}\n\
  ```\n\n在上面的程序中：\n\n- 我们定义了两个命名空间：`NameA` 和 `NameB`。它们都定义了具有相似函数的类。\n- 我们可以在主程序中通过其命名空间调用每个函数。\n\
  \n该程序给出了以下输出：\n\nThis is from namespace A\nThis is from namespace B\n\n我们可以使用 `using`\
  \ 指令来调用函数，以避免指定函数的特定命名空间，如下所示：\n\n此程序用于演示命名空间子句的使用。\n\n```csharp\nusing System;\n\
  using NameA;\nusing NameB;\n\n// 一个 namespace\nnamespace NameA\n{\n    public class\
  \ ClassA\n    {\n        public void FunctionA()\n        {\n            Console.WriteLine(\"\
  This is from namespace A\");\n        }\n    }\n}\n\n// 第二个 namespace\nnamespace\
  \ NameB\n{\n    public class ClassB\n    {\n        public void FunctionA()\n  \
  \      {\n            Console.WriteLine(\"This is from namespace B\");\n       \
  \ }\n    }\n}\n\nnamespace Demo\n{\n    class Program\n    {\n        // The main\
  \ function\n        static void Main(string[] args)\n        {\n            // Using\
  \ the namespaces\n            NameA.ClassA clsA = new NameA.ClassA();\n        \
  \    clsA.FunctionA();\n            NameB.ClassB clsB = new NameB.ClassB();\n  \
  \          clsB.FunctionA();\n            Console.Read();\n        }\n    }\n}\n\
  ```\n\n关于该程序，结果格式如下：\n\nThis is from namespace A\nThis is from namespace B\n\n嵌套命名空间\
  \ (Nested Namespaces)\n\n命名空间也可以嵌套，这意味着将一个命名空间放在另一个内部。以下是语法形式：\n\n```csharp\nnamespace\
  \ namespace1\n{\n    Class definition\n    {\n        // Define the functions\n\
  \    }\n    namespace namespace2\n    {\n        Class definition\n        {\n \
  \           // Define the functions\n        }\n}\n```\n\n我高亮了命名空间的括号，以便你可以看到它们是嵌套的并方便导航。以下是我们如何访问函数\
  \ A：\n\n`namespace1.FunctionA`\n\n我们通过这种方式访问函数 B：\n\n`namespace1.namespace2.FunctionB`\n\
  \n你可以看到我们正在使用点符号法，这是另一个我们本质上在处理对象的标志。\n\n使用嵌套命名空间。\n\n```csharp\nusing System;\n\
  \n// 一个 namespace\nnamespace NameA\n{\n    public class ClassA\n    {\n        public\
  \ void FunctionA()\n        {\n            Console.WriteLine(\"This is from namespace\
  \ A which contains namespace B\");\n        }\n    }\n    // inner namespace\n \
  \   namespace NameB\n    {\n        public class ClassB\n        {\n           \
  \ public void FunctionA()\n            {\n                Console.WriteLine(\"This\
  \ is from namespace B inside Namespace A\");\n            }\n        }\n    }\n\
  }\n\nnamespace Demo\n{\n    class Program\n    {\n        // The main function\n\
  \        static void Main(string[] args)\n        {\n            // Using the namespaces\n\
  \            NameA.ClassA clsA = new NameA.ClassA();\n            clsA.FunctionA();\n\
  \            NameA.NameB.ClassB clsB = new NameA.NameB.ClassB();\n            clsB.FunctionA();\n\
  \            Console.Read();\n        }\n    }\n}\n```\n\n在上面的程序中：\n\n- 我们在命名空间\
  \ `NameA` 内部嵌套了命名空间 `NameB`。它们都定义了函数。\n- 我们得到以下结果：\n\nThis is from namespace A which\
  \ contains namespace B\nThis is from namespace B inside Namespace A\n\n# 第四章\n\n\
  ## 决策语句与流程控制 (Decision Statements and Flow Control)\n\n### != 运算符\n\n`!=` 运算符用于检查两个操作数是否不等。`!`\
  \ 运算符也可以取反条件。\n\n用法如下：\n\n```csharp\nbool levelComplete = (score >= pointsNeeded);\n\
  if(!levelComplete)\n{\n    Console.WriteLine(\"You haven't won yet. Keep trying...\"\
  );\n}\n```\n\n你可以与其他运算符一起 `!`，但请记住 `!` 的优先级高于关系运算符。如果你想在关系运算符之前取反，你需要将它们放在括号内：\n\
  \n```csharp\nif(!(score > oldScore))\n{\n}\n```\n\n这等同于：\n\n```csharp\nif(score\
  \ <= oldScore)\n{\n}\n```\n\n在编程中，实现相同功能有很多方法。你只需要选择最简单的即可。\n\n### 条件运算符：&& 和 ||\n\
  \n你的条件运算符可以处理多个事物。假设你正在制作一个玩家通过艰难地形的游戏。当能量耗尽或食物耗尽时，玩家就会失败。只要食物可用，他们一直会有食物。如果食物耗尽，他们可以消耗能量直到找到下一个补给点。他们失败的唯一方式是既没有能量也没有食物。因此，你需要一个检查两个条件的条件，并在两个条件满足时结束游戏。\n\
  \n要做到这一点，你需要使用 AND 运算符 (`&&`)。\n\n在这里我们尝试条件运算符。我们有提到的 AND 运算符 (`&&`) 以及 OR 运算符 (`||`)，这些是用来同时检查多个元素的：\n\
  \n```csharp\nint food = 20;\nint energy = 40;\nif(food <= 0 && energy <= 0)\n{\n\
  \    Console.WriteLine(\"Game over\");\n}\n```\n\n这意味着如果食物小于等于 0 且能量小于等于 0，游戏就应该结束。\n\
  \n`||` 运算符只需要一个条件为真。它更适用于有多种死亡方式的游戏。让我们想象我们的角色在能量为零或时间耗尽时死亡（在这种情况下，我们没有食物变量）。只要其中一个情况为真，游戏就会结束，而不是两者都满足。\n\
  \n```csharp\nint energy = 50;\nint time = 40;\nif(time < 0 || energy < 0)\n{\n \
  \   Console.WriteLine(\"You lost. Try again!\");\n}\n```\n\n\n\n\n\n你应该知道，默认情况下，计算机执行“惰性求”（lazy\
  \ evaluations），这意味着如果第一个条件满足，它们将不会检查第二个条件。只有当第一个条件（时间）不满足时，它们才会检查第二个条件（能量）。\n\n\
  你可以将多个条件操作组合在一起。你可以通过括号来发挥创意力。但务必记住，每当你创建这些条件时，都要确保让其他人阅读起来保持简单，永远不要为了其目的而让事情变得过于复杂。\n\
  \n# 第 5 章：反射\n\nC# 在运行时从代码段中检索信息的能力被称为反射。如果你想获取关于方法的更多信息（“C# 反射”），你就会使用反射。我们还可以做更多：我们还可以通过反射在运行时创建对象并调用方法。\n\
  \n在下面的示例中，我们使用 `Type` 数据类型来获取有关类的信息。\n\n### 使用 Type 获取类的信息\n\n```csharp\nusing System;\n\
  using System.IO;\n\nnamespace Demo\n{\n    class Player\n    {\n        // 定义成员\n\
  \        public int id;\n        public string name;\n        public void Display()\n\
  \        {\n            Console.WriteLine(\"The player ID is \" + id);\n       \
  \     Console.WriteLine(\"The name of the player is \" + name);\n        }\n   \
  \ }\n\n    class Program\n    {\n        // 主函数\n        static void Main(string[]\
  \ args)\n        {\n            Player player1 = new Player();\n            // 尝试获取对象的类型\n\
  \            Type myTypeObj = player1.GetType();\n            Console.WriteLine(\"\
  The object is of Type \" + myTypeObj);\n            Console.Read();\n        }\n\
  \    }\n}\n```\n\n以下是我们所做的：\n- 使用 `Type` 获取了关于 `player1` 对象的信息。\n- 我们能够获取该对象的类。\n\
  \n下面是我们将看到的输出：\n`The object is of Type Demo.Player`\n\n### MethodInfo\n\n接下来的反射方法用于从类获取有关方法的信息。下面是一个示例：接下来的程序展示了如何使用\
  \ `MethodInfo`。\n\n```csharp\nusing System;\nusing System.IO;\nusing System.Reflection;\n\
  \nnamespace Demo\n{\n    class Player\n    {\n        // 定义成员\n        public int\
  \ id;\n        public string name;\n        public void Display()\n        {\n \
  \           Console.WriteLine(\"The ID is \" + id);\n            Console.WriteLine(\"\
  The player name is \" + name);\n        }\n    }\n\n    class Program\n    {\n \
  \       // 主函数\n        static void Main(string[] args)\n        {\n           \
  \ Player player1 = new Player();\n            // 尝试获取对象的类型\n            Type myTypeObj\
  \ = player1.GetType();\n            Console.WriteLine(\"The object is of Type \"\
  \ + myTypeObj);\n            // 使用反射获取关于 Display 方法的信息\n            MethodInfo myMethodInfo\
  \ = myTypeObj.GetMethod(\"Display\");\n            Console.WriteLine(\"Is the method\
  \ static? \" + myMethodInfo.IsStatic);\n            Console.Read();\n        }\n\
  \    }\n}\n```\n\n程序将带给我们以下结果：\n`The object is of Type Demo.Player`\n`Is the method\
  \ static? False`\n\n# 第 6 章：集合\n\n集合是特殊的类，简化了 C# 中的数据处理工作。例如，集合拥有一个 `size()` 方法，可以在不需要冗繁代码的情况下获取数组大小。C#\
  \ 拥有以下集合类：\n\n- **ArrayList**：用于存储相同数据类型连续值的容器。\n- **SortedList**：允许以常数时间执行插入和删除操作的序列容器。可以双向迭代。\n\
  - **Stacks（栈）**：为后进先出（LIFO）设计，从一端插入和提取项。\n- **Queues（队列）**：为先进先出（FIFO）设计，从一侧插入并在另一侧提取项。\n\
  \n数组非常棒，因为我们可以根据需要将其变小或放大。由于使用的内存是连续的，数组是高效的。但数组不是动态的。面对今天的计算需求，程序员必须发挥创意来克服这一点。如今，程序员可以编写出随需要收缩和扩展的动态程序。这就是为什么当程序员寻找灵活性和威力时，列表比数组更流行。如果你用过像\
  \ Python 这样的语言，这对你来说并不新鲜。\n\n列表是一个灵活的数组。随着情况的变化，列表可以随时变为所需的任何大小。列表没有定义的长度。它们可以不断被添加。它们就像化石；曾几何段时间它们不是。它们现在已经进化了数百万年，今天活着的生物和未来活着的生物将一直被添加到列表中，直到没有为止。列表中可以添加多少项不受限于任何固有大小。唯一的限制是地球将存在多久。如果地球永远存在，随之，我们将永远拥有化石。同样的原理适用于列表。\n\
  \n列表还带有全备的功能。要使用列表并利用其所有特性，你需要导入 `System.Collections` 命名空间。使用列表时，你必须声明列表及其类型，如下：\n\
  `List<type> name = new List<type>();`\n\n你使用 `Add` 方法添加项，如下：\n`myList.add(2);`\n\
  `myList.add(5);`\n`myList.add(8);`\n\n你也可以使用 `AddRange` 方法将现有数组添加到列表中，如下：\n`myList.add(arrayName);`\n\
  \n你可以通过两种方式从列表中删除项：通过项的值或项的索引。列表的索引工作与数组索引相同：\n`myList.remove(5); // 将移除 5，通过值移除`\n\
  `myList.removeAt(0); // 将移除 2，通过索引移除`\n\n列表中只剩下 8 了。注意我们正在操作上一个示例中创建的列表。我希望这说明了列表是么灵活。\n\
  \n## ArrayList\n\n`ArrayList` 容器存储相同数据类型的值。让我们来看一个示例。你以以下方式定义 `ArrayList`：\n`ArrayList\
  \ variName=new ArrayList();`\n\n`varName` 是我们分配给 `ArrayList` 的变量，以便我们对它使用各种方法。这是我们使用\
  \ `Add` 方法向 `ArrayList` 添加一个项。\n`varName.Add(element)`\n\n如果需要，我们可以通过索引访问此元素。接下来的示例说明了\
  \ `ArrayList`。这里是数组列表的应用：\n\n```csharp\nusing System;\nusing System.Collections;\n\
  \nnamespace Demo\n{\n    class Program\n    {\n        // 主函数\n        static void\
  \ Main(string[] args)\n        {\n            // 定义 ArrayList\n            ArrayList\
  \ ar = new ArrayList();\n            // 向数组列表添加元素\n            ar.Add(10);\n   \
  \         ar.Add(15);\n            ar.Add(23);\n            // 显示数组元素\n        \
  \    Console.WriteLine(\" The first element of the array is \" + ar[0]);\n     \
  \       Console.WriteLine(\" The second element of the array is \" + ar[1]);\n \
  \       }\n    }\n}\n```\n\n\n\n\n\n此程序演示了如何使用字符串列表。\n\n```csharp\nusing System;\n\
  using System.Collections;\n\nnamespace Demo\n{\n    class Program\n    {\n     \
  \   // 主函数\n        static void Main(string[] args)\n        {\n            // 定义\
  \ ArrayList\n            ArrayList ar = new ArrayList();\n            // 向数组列表添加元素\n\
  \            ar.Add(\"Hi\");\n            ar.Add(\"There\");\n            ar.Add(\"\
  World\");\n            // 显示数组的元素\n            Console.WriteLine(\" The first element\
  \ of the array is \" + ar[0]);\n            Console.WriteLine(\" The second element\
  \ of the array is \" + ar[1]);\n            Console.WriteLine(\" The third element\
  \ of the array is \" + ar[2]);\n            Console.Read();\n        }\n    }\n\
  }\n```\n\n我们将在控制台中看到的内容：\n数组的第一个元素是 Hi\n数组的第二个元素是 There\n数组的第三个元素是 World\n\n我们可以向\
  \ `ArrayList` 中添加各种数据类型。\n\n`ArrayList` 类具有许多方法，可以用于操作数据。\n\n## ArrayList 操作\n\n\
  下节部分总结了 `ArrayList` 可用的各种操作。\n\n| 功能 | 说明 |\n| :--- | :--- |\n| size | 此属性告诉我们 `ArrayList`\
  \ 的大小 |\n| Clear() | 此函数移除 `ArrayList` 中的所有元素 |\n| Contains() | 此方法检查 `ArrayList`\
  \ 是否包含特定元素，然后返回一个布尔值：如果包含返回 True，如果不包含返回 False。 |\n| IndexOf() | 这返回指定元素在 `ArrayList`\
  \ 中的索引。 |\n| InsertAt() | 此方法在 `ArrayList` 的特定索引处插入一个值/项 |\n| Remove() | 此方法从 `arrayList`\
  \ 中删除一个项 |\n| RemoveAt() | 此方法将删除指定索引处的项 |\n| Reverse() | 此方法反转 `ArrayList` 中的元素。\
  \ |\n| Sort() | 此方法按字母顺序对数组元素进行排序，如果是数字则按升序排列。 |\n| GetRange() | 此方法用于提取一个数组并将其添加到\
  \ `ArrayList` 中。 |\n\n让我们简要查看上面上面定义的每个方法是如何工作的。\n\n## Size Function\n\n此属性告诉我们 `ArrayList`\
  \ 的大小，即其中包含元素数量。我们将使用直观的 `Count` 方法来完成。\n\n### 使用 count 属性\n\n```csharp\nusing System;\n\
  using System.Collections;\n\nnamespace Demo\n{\n    class Program\n    {\n     \
  \   // 主函数\n        static void Main(string[] args)\n        {\n            // 定义\
  \ ArrayList\n            ArrayList ar = new ArrayList();\n            // 向数组列表添加元素\n\
  \            ar.Add(11);\n            ar.Add(13);\n            ar.Add(15);\n   \
  \         // 显示数组列表的大小\n            Console.WriteLine(\" The size of the array list\
  \ is \" + ar.Count);\n            Console.Read();\n        }\n    }\n}\n```\n\n\
  以下是控制台打印的内容：\n数组列表的大小是 3\n\n### Clear Function\n\n此函数移除 `ArrayList` 中的所有元素。\n\n\
  ### 使用 clear 方法\n\n```csharp\nusing System;\nusing System.Collections;\n\nnamespace\
  \ Demo\n{\n    class Program\n    {\n        // 主函数\n        static void Main(string[]\
  \ args)\n        {\n            // 定义 ArrayList\n            ArrayList ar = new\
  \ ArrayList();\n            // 向数组列表添加元素\n            ar.Add(2);\n            ar.Add(4);\n\
  \            ar.Add(7);\n            // 清空数组的所有元素\n            ar.Clear();\n   \
  \         Console.WriteLine(\" size of the array list is \" + ar.Count);\n     \
  \       Console.Read();\n        }\n    }\n}\n```\n\n它应该告诉我们数组中空无一物，如下：\n数组的大小为\
  \ 0\n\n### Contains Function\n\n此方法检查 `ArrayList` 是否包含特定元素，然后返回一个布尔值：如果包含返回 True，如果不包含返回\
  \ False。下一个程序展示了如何使用 `contains` 方法。\n\n```csharp\nusing System;\nusing System.Collections;\n\
  \nnamespace Demo\n{\n    class Program\n    {\n        // 主函数\n        static void\
  \ Main(string[] args)\n        {\n            // 定义 ArrayList\n            ArrayList\
  \ ar = new ArrayList();\n            // 向数组列表添加元素\n            ar.Add(13);\n   \
  \         ar.Add(7);\n            ar.Add(30);\n            Console.WriteLine(\"\
  Does the array contain the value 3? \" + ar.Contains(30));\n            Console.Read();\n\
  \        }\n    }\n}\n```\n\n程序应该返回 true，如下所示：\n数组是否包含值 3\n\n## IndexOf Function\n\
  \n这返回指定元素在 `ArrayList` 中的索引。这里是 `IndexOf` 方法的一个应用。\n\n```csharp\nusing System;\n\
  using System.Collections;\n\nnamespace Demo\n{\n    class Program\n    {\n     \
  \   // 主函数\n        static void Main(string[] args)\n        {\n            // 定义\
  \ ArrayList\n            ArrayList ar = new ArrayList();\n            // 向数组列表添加元素\n\
  \            ar.Add(50);\n            ar.Add(2000);\n            ar.Add(37);\n \
  \           Console.WriteLine(\"The index of value 37 is \" + ar.IndexOf(37));\n\
  \            Console.Read();\n        }\n    }\n}\n```\n\n## Insert Function\n\n\
  此方法在 `ArrayList` 的特定索引处插入一个值/项。下面的程序展示了 `insert` 方法。\n\n```csharp\nusing System;\n\
  using System.Collections;\n\nnamespace Demo\n{\n    class Program\n    {\n     \
  \   // 主函数\n        static void Main(string[] args)\n        {\n            // 定义\
  \ ArrayList\n            ArrayList ar = new ArrayList();\n            // 向数组列表添加元素\n\
  \            ar.Add(100);\n            ar.Add(22);\n            ar.Add(37);\n  \
  \          Console.WriteLine(\"The index of value 37 is \" + ar.IndexOf(37));\n\
  \            // 在位置 2 插入 4\n            ar.Insert(2, 4);\n            Console.WriteLine(\"\
  The value at 2 is \" + ar[2]);\n            Console.Read();\n        }\n    }\n\
  }\n```\n\n我们在控制台中看到的：\n值 37 的索引是 2\n位置 2 的值是 4\n\n#### Remove Function\n\n此方法从 `arrayList`\
  \ 中删除一个项。\n\n```csharp\nusing System;\nusing System.Collections;\n\nnamespace Demo\n\
  {\n    class Program\n    {\n        // 主函数\n        static void Main(string[] args)\n\
  \        {\n            // 定义 ArrayList\n            ArrayList ar = new ArrayList();\n\
  \            // 向数组列表添加元素\n            ar.Add(19);\n            ar.Add(200);\n \
  \           ar.Add(37);\n            Console.WriteLine(\"The value at position 1\
  \ is \" + ar[1]);\n            // 移除值\n            ar.Remove(200);\n           \
  \ Console.WriteLine(\"The value at position 1 is \" + ar[1]);\n            Console.Read();\n\
  \        }\n    }\n}\n```\n\n我们在控制台中看到的内容：\n位置 1 的值是 200\n位置 1 的值是 37\n\n#### RemoveAt\
  \ Function\n\n此方法将删除指定索引处的项。程序演示了如何使用 `RemoveAt` 方法。\n\n```csharp\nusing System;\n\
  using System.Collections;\n\nnamespace Demo\n{\n    class Program\n    {\n     \
  \   // 主函数\n        static void Main(string[] args)\n        {\n            // 定义\
  \ ArrayList\n            ArrayList ar = new ArrayList();\n            // 向数组列表添加元素\n\
  \            ar.Add(89);\n            ar.Add(202);\n            ar.Add(303);\n \
  \           Console.WriteLine(\"The value at position 1 is \" + ar[1]);\n      \
  \      // 移除索引为 1 的值\n            ar.RemoveAt(1);\n        }\n    }\n}\n```\n\n\n\
  \n\n\n```csharp\nConsole.WriteLine(\"The value at position 1 is \" + ar[1]);\nConsole.Read();\n\
  \    }\n}\n```\n\n这是我们在控制台中应该看到的内容：\n位置 1 的值为 202\n位置 1 的值为 302\n\n## 反转函数 (Reverse\
  \ Function)\n\n此方法用于反转 `ArrayList` 中的元素。\n\n### 使用 reverse 方法\n\n```csharp\nusing\
  \ System;\nusing System.Collections;\nnamespace Demo\n{\n    class Program\n   \
  \ {\n        // 主函数\n        static void Main(string[] args)\n        {\n      \
  \      // 定义 ArrayList\n            ArrayList ar = new ArrayList();\n          \
  \  // 向数组列表添加元素\n            ar.Add(22);\n            ar.Add(27);\n            ar.Add(40);\n\
  \            Console.WriteLine(\"The value at index 0 is \" + ar[0]);\n        \
  \    Console.WriteLine(\"The value at index 1 is \" + ar[1]);\n            Console.WriteLine(\"\
  The value at index 2 is \" + ar[2]);\n            // 反转列表\n            ar.Reverse();\n\
  \            Console.WriteLine(\"The value at index 0 is \" + ar[0]);\n        \
  \    Console.WriteLine(\"The value at index 1 is \" + ar[1]);\n            Console.WriteLine(\"\
  The value at index 2 is \" + ar[2]);\n            Console.Read();\n        }\n \
