  \ 章: \n\n## 匿名类型\n\nC# 允许我们创建名为匿名数据类型的新型数据类型。我们可以在不定义它们的情况下创建它们。它们在实例化时创建，既是编译器生成的类型，也是引用类型。编译器会根据它们的属性来定义它们。匿名类型是\
  \ SQL 中用一个重要特性，在 LINQ 查询中非常有用。匿名类型是只读的。\n\n在本章中，我们将学习“匿名”类型：\n\n### 目录\n- `var`\
  \ 语句\n- 创建和使用匿名类型\n- 比较两个匿名实例\n\n### Var 语句\n\n`Vars` 是 C# 3.0 中引入的。正如其名称所示，它们用于隐式声明局部变量，这意味着你不需要指定它将持有的数据类型。让我们来看看下面的示例：\n\
  \n```csharp\nvar str='name';\nvar num='89';\nvar array=new[]{1,2,3};\n```\n\n编译器将像这样编译所有这些代码：\n\
  \n```csharp\nvar str='name';     // string str='name';\nvar num='89'        // int\
  \ num='5';\nvar array=new[]{1,2,3}; // int array=new[]{1,2,3};\n```\n\n让我们来看看下面的示例：\n\
  \n**示例 1:**\n\n```csharp\nusing System;\nusing System.Collections.Generic;\nusing\
  \ System.Linq;\nusing System.Text;\nusing System.Threading.Tasks;\n\nnamespace anonymous\n\
  {\n    class Program\n    {\n        static void Main(string[] args)\n        {\n\
  \            var name = \"Jonathan Davis\";\n            var number = 25;\n    \
  \        string s = \"USA\";\n            var s2 = s;\n            s2 = null;\n\
  \            string s3 = null;\n            var s4 = s3;\n            Console.WriteLine(name);\n\
  \            Console.WriteLine(number);\n            Console.WriteLine(s);\n   \
  \         Console.WriteLine(s2);\n            Console.WriteLine(s3);\n         \
  \   Console.WriteLine(s4);\n        }\n    }\n}\n```\n\n**输出 1:**\nJonathan Davis\n\
  25\nUSA\n\n变量 `var s2`、`var s3` 和 `var s4` 的值为 null，这就是为什么它们创建了空空间的原因。`var` 变量的值在编译时不能为\
  \ null，但在运行时可以。\n\n`Vars` 不是匿名类型。\n\n其他无效的 `var` 语句：\n```csharp\nvar a; // 无效，因为它需要初始化\n\
  var num=null  // 编译时不能为 Null\nvar v='Lord of the Rings'\nv=15 // 整数不能赋值给隐式声明的字符串变量\n\
  ```\n\n### 在 C# 中创建和使用匿名类型\n\n匿名类型可以使用 `var` 语句创建的引用类型。如果我们需要创建一个匿名类型来表示一个点，我们会这样做：\n\
  \n```csharp\nvar point = new {x=18,y=10};\n```\n\n`Var` 语句要求我们从开始初始化，因此值不能初始化为 null\
  \ 值。以下是错误的：\n\n```csharp\nvar point = new {x=18,y=null}; // 错误的语句，编译时不能为 null\n\
  ```\n\n**示例 2:**\n\n```csharp\nusing System;\nnamespace anonymous\n{\n    class\
  \ Program\n    {\n        static void Main(string[] args)\n        {\n         \
  \   var Name = new { FirstName = \"Phill\", LastName = \"Glass\" };\n          \
  \  Console.WriteLine(Name.FirstName);\n            Console.WriteLine(Name.LastName);\n\
  \        }\n    }\n}\n```\n\n**输出 2:**\nPhill\nGlass\n\n这里是编译器如何创建匿名类型的：\n```csharp\n\
  using System;\nnamespace anonymous\n{\n    class Program\n    {\n        static\
  \ void Main(string[] args)\n        {\n            var Employee = new { EmpName\
  \ = \"Cain\", EmpAddress = \"Florida\" , salary=\"28,000\"};\n        }\n    }\n\
  }\n```\n\n然后编译器会按如下方式创建类型：\n```csharp\nnamespace anonymous\n{\n    class Program\n\
  \    {\n        private string Name;\n        private string Address;\n        int\
  \ salary;\n        public string EmpName{get {return Name;}set {Name=value;}}\n\
  \        public string EmpAddress{get {return Address;}set {Address=value;}}\n \
  \       public int Empsalary{get {return salary;}set {salary=value;}}\n    }\n}\n\
  ```\n\n在所有示例中，我们都是显式命名的。如果它们基于属性或变量设置，我们也可以这样做。\n\n**示例 3:**\n\n```csharp\nusing\
  \ System;\nnamespace anonymous\n{\n    class Program\n    {\n        static void\
  \ Main(string[] args)\n        {\n            int variable = 88;\n            var\
  \ implicitProperties = new { variable, DateTime.Now };\n            var explicitProperties\
  \ = new { variable = variable, Now = DateTime.Now }; // 与上述相同\n            Console.WriteLine(\"\
  Time is \"+implicitProperties);\n            Console.WriteLine(\"Time is \"+explicitProperties);\n\
  \        }\n    }\n}\n```\n\n**输出 3:**\nTime is { variable = 88, Now = ... }\nTime\
  \ is { variable = 88, Now = ... }\n\n### 比较两个匿名实例\n\n基于属性，匿名类型可以创建 `Equals()` 来比较两个实例。我们可以使用\
  \ `GetHashCode()` 获取它们的哈希值。这里是我们可以这样做的示例：\n\n**示例 4:**\n\n```csharp\nnamespace anonymous\n\
  {\n    class Program\n    {\n        static void Main(string[] args)\n        {\n\
  \            var point1 = new { A = 1, B = 2 };\n            var point2 = new {\
  \ A = 1, B = 2 };\n            var point3 = new { A = 2, B = 1 };\n            Console.WriteLine(point1.Equals(point2));\n\
  \            Console.WriteLine(point1.GetHashCode() == point2.GetHashCode());\n\
  \            Console.WriteLine(point2.Equals(point3));\n            Console.WriteLine(point2.GetHashCode()\
  \ == point3.GetHashCode());\n        }\n    }\n}\n```\n\n**输出 4:**\nTrue\nTrue\n\
  False\nFalse\n\n# 第 13 章:\n\n## LINQ\n\nLINQ 代表语言集成查询（从基础到高级的 LINQ 教程）。如果你处理过数据库，你就知道什么是查询。简而言之，它是程序员与数据库交互的方式。程序员使用它们访问数据库以插入、编辑、检索或删除数据。LINQ\
  \ 为 C# 开发者提供了访问和处理多种数据类型（如 XML 字段、数据库）的新方法。LINQ 由两个基本单元组成：序列和元素。LINQ 序列是实现 `IEnumerable<T>`\
  \ 接口的集合，其中集合中的每个项目被称为元素。`IEnumerable<T>` 接口的一个典型示例是数组，如下：\n\n```csharp\nstring[]\
  \ cities = {\"Frankfurt\",\"New York\",\"Cardiff\",\"Sydney\",\"Toronto\"};\n```\n\
  \n字符串类型数组包含城市名称。这样的集合被称为本地序列，因为所有的项目都在系统的本地内存中。\n\n### 查询运算符\n\n查询运算符接收 LINQ 序列作为输入，进行转换并返回转换后的序列。`System.Linq`\
  \ 命名空间下的 `Enumerable` 类大约有 40 个查询运算符。让我们来看看常用的 LINQ 运算符。\n\n#### Where 操作\n\n`where`\
  \ 操作根据一组条件过滤序列。例如，你想获取数组中字符长度大于或等于 8 的城市列表。下面是该操作的示例。\n\n**示例 1:**\n\n```csharp\n\
  using System;\nusing System.Collections;\nusing System.Collections.Generic;\nusing\
  \ System.Linq;\n\nnamespace MyCSharpApplication\n{\n    class Program\n    {\n \
  \       public static void Main()\n        {\n```\n\n\n\n```csharp\nstring[] cities\
  \ ={\"Frankfurt\", \"New York\", \"Cardiff\", \"Sydney\", \"Toronto\" };\n\nList<string>\
  \ citiesendingwiths = (from c in cities\n                                where c.Length\
  \ >=8\n                                select c).ToList();\nforeach(string c in\
  \ citiesendingwiths)\n{\n    Console.WriteLine(c);\n}\nConsole.Read();\n```\n\n\
  **输出：**\n\nFrankfurt\n\nNew York\n\nLINQ 查询序列与 SQL 查询相似。我们在上面通过从长度为 8 个字符或更长的列表中获取城市来说明了这一点。“New\
  \ York”符合条件，因为空格也计入字符内。\n\n这种 LINQ 语法因为与 SQL 查询语法相似，因此通常被称为“查询语法”。另一种使用 Lambda 表达式执行\
  \ LINQ 查询的方法被称为“流式语法（fluent syntax）”。下面的示例演示了这一点：\n\n### 示例 2:\n\n```csharp\nusing\
  \ System;\nusing System.Collections;\nusing System.Collections.Generic;\nusing System.Linq;\n\
  \nnamespace MyCSharpApplication\n{\n    class Program\n    {\n        public static\
  \ void Main()\n        {\n            string[] cities = {\"Frankfurt\", \"New York\"\
  , \"Cardiff\", \"Sydney\", \"Toronto\" };\n            List<string> citiesendingwiths\
  \ = cities.Where(c => c.Length >= 8).ToList();\n            foreach(string c in\
  \ citiesendingwiths)\n            {\n                Console.WriteLine(c);\n   \
  \         }\n            Console.Read();\n        }\n    }\n}\n```\n\n就像在 SQL 中一样，你可以在\
  \ LINQ 中配合逻辑运算符和比较运算符。例如，你可能想要获取一个长度超过 6 个字符且名称中包含字母“o”的城市列表。AND 运算符将帮助你实现这一点，如下文所示。\n\
  \n### 示例 3:\n\n```csharp\nusing System;\nusing System.Collections;\nusing System.Collections.Generic;\n\
  using System.Linq;\n\nnamespace MyCSharpApplication\n{\n    class Program\n    {\n\
  \        public static void Main()\n        {\n            string[] cities = {\"\
  Frankfurt\", \"New York\", \"Cardiff\", \"Sydney\", \"Toronto\" };\n           \
  \ List<string> citiesendingwiths = cities.Where(c => c.Length >= 6 && c.Contains(\"\
  o\")).ToList();\n            foreach(string c in citiesendingwiths)\n          \
  \  {\n                Console.WriteLine(c);\n            }\n            Console.Read();\n\
  \        }\n    }\n}\n```\n\n我们只会在控制台中打印出 Toronto 和 New York，因为它们是唯一满足“长度超过 6 个字符”且“包含字母\
  \ o”这两个条件的城市。\n\n### Select\n\n`select` 查询通常用于具有多个成员的对象。它被用于提取对象集合中的特定成员；也可以用于任何对象。下面的示例演示了\
  \ Select 查询。\n\n### 示例 4:\n\n```csharp\nusing System;\nusing System.Collections;\n\
  using System.Collections.Generic;\nusing System.Linq;\n\nnamespace MyCSharpApplication\n\
  {\n    public class Person\n    {\n        public int age;\n        public string\
  \ name;\n        public Person(int age, string name)\n        {\n            this.age\
  \ = age;\n            this.name = name;\n        }\n    }\n    class Program\n \
  \   {\n        public static void Main()\n        {\n            Person p1 = new\
  \ Person(9, \"James\");\n            Person p2 = new Person(8, \"Carrie\");\n  \
  \          Person p3 = new Person(13, \"Mark\");\n            Person p4 = new Person(15,\
  \ \"Evelyn\");\n            Person p5 = new Person(6, \"Max\");\n            List<Person>\
  \ plist = new List<Person>();\n            plist.Add(p1);\n            plist.Add(p2);\n\
  \            plist.Add(p3);\n            plist.Add(p4);\n            plist.Add(p5);\n\
  \            List<string> personnames = plist.Where(p => p.age <= 12).Select(per\
  \ => per.name).ToList();\n            foreach(string pname in personnames)\n   \
  \         {\n                Console.WriteLine(pname);\n            }\n        \
  \    Console.Read();\n        }\n    }\n}\n```\n\n我们创建了一个 `Person` 类，它包含两个成员变量：`age`\
  \ 和 `name`。它们通过构造函数初始化。然后，我们创建了 5 个 `Person` 对象并将它们存储在一个名为 `plist` 的 `Person` 列表中。接着，我们使用带有\
  \ `Where` 和 `Select` 运算符的 LINQ 查询来提取年龄小于 12 岁的人。如果没有 `select` 运算符，整个对象都会被提取，但这并不是我们想要的。我们想要符合这些条件的人员。这就是为什么我们使用\
  \ `Select` 运算符并传递了一个获取名称的 Lambda 表达式。\n\nLINQ 是广泛的话题，可以写满整本书。我们将结束对运算符的讨论。\n\n###\
  \ 与其他数据类型协作\n\nLINQ 之所以是一项吸引人的技术，是因为它与许多数据类型兼容。你可以使用相同的语法处理来自外部源的数据，而其他查询语言则对每个源都需要不同的语法。例如，与\
  \ SQL Server 交互的 SQL 查询和用于 XML 数据类型的 Xquery。在本节中，我们将查看以下关系：\n\n- LINQ 与 SQL\n- LINQ\
  \ 与 Lambda 表达式\n\n#### LINQ 和 SQL\n\nLINQ 是处理 SQL 数据更智能的替代方案。你会听到“LINQ to SQL”这个术语，它要求使用\
  \ LINQ 访问 SQL 数据库。实现方法是将目标数据库映射到 LINQ。\n\n\n\n\n如你所见，我们使用了 `where` 方法直接从 `Toys`\
  \ 数据库的 `Users` 表访问数据，而不是使用传统的 SQL 语法。所有工作方式与之前相同，只是我们使用了 `List` 数据类型来存储由 LINQ 查询返回的值。\n\
  \n### 示例 3：\n\n```csharp\npublic User bringUser(string name)\n{\n    DBToysDataContext\
  \ sampleDB = new DBToysDataContext();\n    User use = sampleDB.Users.Single(u, u.UserName=>name);\n\
  \    return use;\n}\n```\n\nLINQ 表达式还允许我们提取或发送单行数据。`bringUser` 函数接收 `name` 作为输入并将其与\
  \ `Users` 表中的对象进行匹配。`SampleDB.Users.Single()` 中的 `Single` 方法寻找匹配项并返回单行。\n\n### LINQ\
  \ 与 Lambda 表达式\n\n虽然我们之前已经讨论过 Lambda 表达式，但在处理数据集合或数据列表时，LINQ 查询通常意味着使用 Lambda 表达式，以根据某些特定标准过滤列表项。让我们来看看如何实现：\n\
  \n### 示例 4：\n\n```csharp\nIEnumerable <SelectListItem> toys = database.Toys\n  \
  \  .Where(toy => toy.Tag == curTag.ID)\n    .Select(toy => new SelectListItem {\
  \ Value = toy.Name, Text = toy.ID });\n\nViewBag.toySelector = toys;\n```\n\n在上面的代码中，我们声明了变量\
  \ `toys` 并将其强制转换为 `SelectListItem` 类型，以保存 LINQ 查询的结果行。我们使用了 `Where` 和 `Select` 两个方法来寻找匹配我们查询的目标玩具。`toy\
  \ => toy.Tag == curTag.ID` 行根据传递的标签选择玩具，而 `toy => new SelectListItem {Value = toy.Name,\
  \ Text = toy.ID` 行则根据传递的 ID 和名称选择特定的玩具。符合此标准的最终玩具被保存在 `toys` 变量中。\n\n### XML XML\n\
  \n让我们看看如何使用 LINQ 来处理 XML 数据。XML 代表可扩展标记语言（Extensible Markup Language）。由于其与不同系统的兼容性，该数据类型在万网上被广泛使用。它通常被称为自描述或自定义数据。XML\
  \ 具有高度的标准性，其自定义标签用于数据的共享、访问和操作。\n\n我们将看到如何使用 LINQ 来：\n* 获取并删除 XML 数据\n* 插入和更新 XML\
  \ 数据\n\n#### 获取并删除 XML 数据\n\nXML 数据文件有一个根/父标签或元素，它封装并定义了子记录的类型及其其属性。子记录（元素）包含数据。看下方的\
  \ XML 代码。我们将使用它来测试我们的 LINQ 查询。\n\n#### 示例 XML 数据\n\n```xml\n<? Xml version='1.0'\
  \ encoding='utf-8'?>\n<Toys>\n  <Toy ID='1'>\n    <Name>Batman</Name> \n    <Price>$0.45</Price>\
  \  \n  </Toy>\n  <Toy ID='2'>\n    <Name>Snowhite</Name>  \n    <Price>$0.40</Price>\
  \    \n  </Toy>\n  <Toy ID='3'>\n    <Name>Hulk</Name>    \n    <Price>$0.55</Price>\
  \    \n  </Toy> \n</Toys>\n```\n\n`Toys` 是根元素，内部有多个 `Tot` 元素。每个子玩具元素都有一个 `ID` 属性，并将\
  \ `Price` 和 `Name` 作为内部元素。\n\n现在让我们使用 LINQ 查询从表中提取数据。\n\n### 示例 1：\n\n```csharp\n\
  private string file = 'SampleData.xml';\nprivate void GetData()\n{\n    try\n  \
  \  {\n        XDocument doc = XDocument.Load(file);\n        var comingToys = from\
  \ toy in doc.Descendants('Toy')\n        select new\n        {\n            ID=\
  \ Convert.ToInt32(toy.Attribute('ID').Value),\n            Name = toy.Element('Name').Value\
  \ ,\n            Price = toy.Element('Price').Value\n        };\n        foreach\
  \ (var x in toys)\n        {\n            Console.WriteLine('Toy ID', x[ID]); \n\
  \            Console.WriteLine('Toy Name', x[Name]);\n            Console.WriteLine('Toy\
  \ Price', x[Price]);\n        }\n    }\n    catch (Exception err)\n    {\n     \
  \   MessageBox.Show(err.Message);\n    }\n}\n```\n\n指向我们 XML 文件的起始名为 `SampleData.xml`。在函数中，我们使用\
  \ `Load(file)` 函数加载 xml 文件。文件加载后，使用 `descendant()` 方法提取 `toy` 元素。然后我们遍历每个 `toy`，获取\
  \ `ID` 属性及其内部元素，并将它们存储在动态对象中。\n\n**输出 1：**\nToy 1 Name Batman Price $0.45\nToy 1\
  \ Name Snowhite Price $0.40\nToy 1 Name Hulk Price $0.5\n\n如果你想从数据文件中删除一个名称，可以执行以下操作：\n\
  \n### 示例 2：\n\n```csharp\nprivate string file = 'SampleData.xml';\nPrivate void\
  \ DeleteData (int id)\n{\n    try\n    {\n        XDocument sampleXML = XDocument.Load(file);\n\
  \        XElement cToy = sampleXML.Descendants('Toy').Where(c => c.Attribute('ID').Value.Equals(id));\n\
  \        cToy.Remove();\n        sampleXML.Save(file);\n    }\n    catch (Exception\
  \ e)\n    {\n        MessageBox.Show(e.Message);\n    }\n}\n```\n\n文件加载后，代码寻找匹配项并返回单行，使用\
  \ `Remove()` 方法删除该子元素，然后 `sampleXML.Save(file)` 保存更改。\n\n#### 插入和更新 XML 数据\n\n插入数据与从\
  \ XML 文件提取数据并没有太大区别。我们将使用 LINQ 来插入一个与现有元素签名相同的 `Xelement` 对象到 `XDocument` 中。\n\n\
  ### 示例 3：\n\n```csharp\nprivate string file = 'SampleData.xml';\nprivate void InsertData(string\
  \ name, string price)\n{\n    try\n    {\n        XDocument doc = XDocument.Load(file);\n\
  \        XElement newToy = new XElement('Toy', newElement('Name', name), newElement('Price',\
  \ price));\n        var lastToy = doc.Descendants('Toy').Last();\n        int newID\
  \ = Convert.ToInt32(lastToy.Attribute('ID').Value);\n        newToy.SetAttributeValue('ID',\
  \ ++newID);\n        doc.Root.Add(newToy);\n        doc.Save(file);\n    }\n   \
  \ catch (Exception err)\n    {\n        MessageBox.Show(err.Message);\n    }\n}\n\
  ```\n\n创建 `XDocument` 对象后，我们创建一个与现有元素签名相同的 `Xelement` 类型。我们通过 `doc.Descendants('Toy').Last()`\
  \ 选择最后一个 `toy`。我们访问其 `ID` 并对其递增，然后将其作为属性设置给新玩具。最后，通过 `doc.Root.Add(newToy)` 将其插入并执行\
  \ `doc.Save(file)`。\n\n**输出 3：**\nXML 文件现在包含第四个子元素。如果我们传递 `Thor` 作为名称并将 `$0.65`\
  \ 作为价格，我们将得到如下第四个元素：\n\n```xml\n<Toy ID='4'>\n  <Name>Thor</Name>\n  <Price>$0.65</Price>\n\
  </Toy>\n```\n\n要对 XML 文件进行更改，我们必须先定位目标元素。下面的代码行实现了这一点：`XElement cToy=doc.Descendants('Toy').Where(c=>c.Attribute('ID').Value.Equals(id))`。它寻找匹配提供的\
  \ `ID` 的元素，允许 `XElement` 对象 `cToy` 指向它。一旦完成，我们就可以 `cToy.Element('Price').Value =\
  \ price` 更新其内部值。然后保存我们所做的更改。所有这些内容如下。\n\n### 示例 4：\n\n```csharp\nprivate string\
  \ file = 'SampleData.xml';\nprivate void UpdateData(string name, string price, int\
  \ id)\n{\n    try\n    {\n        XDocument doc = XDocument.Load(file);\n      \
  \  XElement cToy = doc.Descendants('Toy').Where(c=>c.Attribute('ID').Value.Equals(id));\n\
  \        cToy.Element('Name').Value = name;\n        cToy.Element('Price').Value\
  \ = price;\n        doc.Save(file);\n    }\n    catch (Exception err)\n    {\n \
  \       MessageBox.Show(err.Message);\n    }\n}\n```\n\n\n\n\n如果我们传递了以下参数：id= 1,\
  \ name= “Black Widows,” price=”$0.90”，我们将用以下玩具替换蝙蝠侠：\n\n```xml\n<Toy ID='1'>\n \
  \   <Name>Black Widow</Name>\n    <Price>$0.90</Price>\n</Toy>\n```\n\n# 第 14 章：工厂模式与组合模式\n\
  \n## 工厂模式\n\n工厂模式允许你使用模板化的对象创建模式轻松地创建多个对象。\n\n### 它的基本原理：\n你首先创建一个类接口，用于标准化数据对象的创建。你将使用子类来创建数据对象。子类允许在创建内容上具有灵活性。如果你使用的编程语言没有接口或抽象类，你你需要创建一个工厂接口类，并让子类扩展它。\n\
  \n想象一下你被赋予任务在任何时候创建各种运动球。我们说的是篮球、板球、排球球、足球等。每当被要求制作时，你总是知道应该如何制作每种球。每种球的代码应该是什么样子的？这就是为什么你需要创建一个接口来概述球类对象的构建过程。\n\
  \n我们将该接口称为“球制造器”（BallMaker）。对于每种球类型，我们都会创建一个扩展“BallMaker”的子类。子类将创建球对象，每个子类都根据自己的规范进行创建。这意味着\
  \ `FootballMaker` 会制造足球，而 `BasketballMaker` 会制造篮球。\n\n实现所需的伪代码可以在存档中找到。它应该帮助你为你选择的语言创建该模式。\n\
  \n### C# 中的工厂模式\n\n这是工厂模式在 C# 中的样子：\n\n```csharp\n// 工厂由任何需要使用它的子类实现\ninterface\
  \ Factory {\n    // 输入：你的选择\n    // 输出：你的选择（默认设置为 Void）\n    // 实现此接口的类的构造函数\n \
  \   void createObject();\n}\n\n// 子工厂 1:\n// 根据 Factory 接口创建不同的对象\nclass SubFactory1\
  \ : Factory {\n    // 这实现了接口中概述的相同函数\n    void Factory.createObject() {\n      \
  \  // 为此创建器类包含任何独特的区别\n        // 此处的任何其他代码\n    }\n}\n\n// 子工厂 2:\n// 根据 Factory\
  \ 接口创建不同的对象\nclass SubFactory2 : Factory {\n    // 这实现了接口中概述的相同函数\n    void Factory.createObject()\
  \ {\n        // 为此创建器类包含任何独特的区别\n        // 此处的任何其他代码\n    }\n}\n```\n\n### 实现工厂模式\n\
  \n使用你喜欢的 IDE 来实现代码。你可以使用在线工具，如 [codechef.com](http://codechef.com)、[rextester.com](http://rextester.com)、[ideone.com](http://ideone.com)\
  \ 或 [codpad.org](http://codpad.org)。\n\n现在让我们通过示例亲眼观察工厂模式。还将有一个工作坊允许你继续学习该模式。\n\n\
  #### 运动球创建器\n想象你有一个按需生成的 Web 应用，用于创建不同种类的运动球。以下是通用球类的样子：\n\n```java\n// 一个运动球具有：\n\
  // - 球的类型\n// - 用于制造它的材料数组\n// - 它的尺寸，以半径（英寸）表示\n// - 任何额外注释\n// - 制造它的公司品牌\n//\
  \ - 产品名称\nclass SportsBall {\n    public String type;\n    public String[] materialsUsed;\n\
  \    public float radius;\n    public String comments;\n    public String make;\n\
  \    public String modelName;\n}\n```\n\n如你所见，创建运动球对象涉及许多细小的细节。例如，如果你必须创建一个足球，其过程将与创建一个网球不同。它们使用不同的材料，尺寸不同，风格也不同。在现实世界中，它们可能由不同的公司制造，并赋予它们不同的特性。\n\
  \n如果你想更简单、用少的代码创建球，你将使用工厂模式。然而，正如你所看到的，在创建运动球对象时涉及许多细小的细节。所以，如果你必须创建一个，比如篮球，这个过程将与创建一个足球相比复杂得多。它们具有不同的类型、材料和尺寸。它们也可能由不同的品牌制造，并且会有不同的特征。让我们看看设置模式涉及的步骤。然后你将通过扩展这些工作来练习。\n\
  \n##### 第 1 步：接口\n我们首先创建一个所有球工厂类都将实现的接口。它有一个方法，返回运动球的实例。\n\n```java\n// BallFactory\
  \ 接口：\n// 关于如何创建球的接口\ninterface BallFactory {\n    /*\n    // 输入：无\n    // 输出：一个\
  \ Sports Ball\n    // 效果：创建一个 SportsBall；\n    // 实现此接口的类将在制造时有自己的区别\n    */\n \
  \   SportsBall createBall();\n}\n```\n\n##### 第 2 步：类\n现在我们创建一个实现 `BallFactory`\
  \ 的工厂类。现在，它只创建篮球。\n\n```java\n// 篮球制造器：\n// 创建具有不同字段的篮球对象\nclass BasketballMaker\
  \ : BallFactory {\n    // (方法实现了接口版本)\n    // 效果：创建一个篮球作为运动球\n    SportsBall BallFactory.createBall()\
  \ {\n        SportsBall b = new SportsBall();\n        b.type = \"Basketball\";\n\
  \        b.materialsUsed = new String[3];\n        b.materialsUsed[0] = \"rubber\"\
  ;\n        b.materialsUsed[1] = \"fiber\";\n        b.materialsUsed[2] = \"synthetic\
  \ rubber\";\n        b.radius = 4.8f;\n        b.make = \"Spalding\";\n        b.modelName\
  \ = \"Series Basketball\";\n        return b;\n    }\n}\n```\n\n##### 第 3 步：设计额外的工厂类\n\
  我们可以根据需要创建许多不同的工厂类。它们都实现了 `Factory` 接口并创建具有不同特性的球对象。下面是一个制造棒球的。\n\n```java\n// 棒球制造器：\n\
  // 创建具有不同字段的棒球对象\nclass BaseballMaker : BallFactory {\n    // (方法实现了接口版本)\n    //\
  \ 效果：创建一个篮球作为运动球\n    SportsBall BallFactory.createBall() {\n        SportsBall\
  \ b = new SportsBall();\n        b.type = \"Baseball\";\n        b.materialsUsed\
  \ = new String[6];\n        b.materialsUsed[0] = \"cork\";\n        b.materialsUsed[1]\
  \ = \"wool\";\n        b.materialsUsed[2] = \"poly/cotton\";\n        b.materialsUsed[3]\
  \ = \"cowhide\";\n        b.materialsUsed[4] = \"yarn\";\n        b.materialsUsed[5]\
  \ = \"composite rubber\";\n        b.radius = 1.45f;\n        b.make = \"Rawlings\"\
  ;\n        b.modelName = \"MLB Official Baseball\";\n        return b;\n    }\n\
  }\n```\n\n##### 第 4 步：运行代码\n创建后，你可以运行代码。为你设计的每个工厂类创建一个 `main` 函数。我们指的是拥有 `publicstatic-void\
  \ main` 方法的主类。你将调用这些工厂来制造球。\n\n在我们的示例中，我们制作了两个工厂：篮球工厂和棒球工厂。我们将使用它们来创建篮球和棒球对象。\n\n\
  ```java\n// 创建工厂\nBallFactory f1 = new BasketballMaker();\nBallFactory f2 = new\
  \ BaseballMaker();\n\n// 创建篮球对象：\n// 使用篮球工厂制造篮球\nSportsBall bb1 = f1.createBall();\n\
  \n// 创建棒球对象：\n// 使用棒球工厂制造棒球\nSportsBall bb2 = f2.createBall();\n\n// 测试：\n```\n\n\
  \n\n\n\n```csharp\n// 这行应该打印出 \"Basketball\"\nConsole.WriteLine(bb1.type);\n\n//\
  \ 这行应该打印出 \"Baseball\"\nConsole.WriteLine(bb2.type);\n```\n\n# 组合模式\n\n想象你以层次结构组织了数据，所有这些数据看起来像“文件”和“文件夹”。如你所知，文件可以放入文件夹，文件夹可以放入其他文件夹，以此此类推。你可能希望实现类似的结构，而不需要复制不必要的代码。组合模式可以帮助实现这一点。\n\
  \n### 它的基本工作原理：\n\n有两个类：`File` 类和 `Folder` 类。将它们想象成项目和组、玩具和箱子，或者衣服和包。它是两个类的组合，其中一个类是由由于这两种类型都构成的。\n\
  \n它们可能可能具有相似的特征、方法和字段，因此你可能需要编写比通常多一倍的代码：一个用于项目，另一个用于分组。为了解决这个问题，你需要让它们继承一个共同的父类或抽象类。换句话说，一个组件（component）。这里有一个重要的区别：`Group`\
  \ 应该包含该父类的集合。因为它们源自同一个父类，`Group` 类可以容纳一组组或项目。\n\n所以如果你有两个类，`Clothing` 和 `Bag`，一个\
  \ `Bag` 包含衣服，但它内部也可以包含包。它们共享相似的属性，如名称和描述。如果它们有这么多相似之处，为每个实例编写单独的代码将是不明智的。你可以应用组合模式，让衣服和包都继承一个父类。`bag`\
  \ 类将进行调整，使其既接受包也接受衣服。\n\n重要的点是，项目/容器类继承一个共同的父类或组件。容器类将包含一个组件列表，这些组件既可以是项目，也可以是容器。\n\
  \n取决于你所使用的语言，父类可以是抽象类、接口或该语言提供的其他类型的抽象。组合模式的伪代码包含在存档（Archive）中，因此如果你需要在不同的语言中使用它，它将对你有所帮助。\n\
  \n现在，让我们来看看下面的组合模式。\n\n## C# 中的组合模式\n\n以下是组合模式在 C# 中的实现方式：\n\n```csharp\n/*\n//\
  \ Component 是 File 和 Folder 类继承的父类\n// 你可以定义两个子类共享的任何字段和方法\n*/\nabstract class Component\
  \ {\n    // 在需要的地方插入任意数量的字段和方法\n    String someField;\n    void someMethod() {};\n\
  }\n\n// 普通项目类（如 File）：\n// 包含了在 Component 中定义的所有字段和方法\nclass File: Component {\n\
  }\n\n// 普通分组类（如 Folder）：\n// 包含了在 Component 中定义的所有字段和方法\n// 还有\n// - 一个组件列表，可以包含项目或组\n\
  class Folder : Component {\n    List<Component> contents = new List<Component>();\n\
  }\n```\n\n## 实现组合模式\n\n使用你选择的 IDE 来实现代码。你可以使用在线工具，如 [codechef.com](http://codechef.com)、[rextester.com](http://rextester.com)、[ideone.com](http://ideone.com)\
  \ 或 [codpad.org](http://codpad.org)。\n\n我们将考虑一种使用组合模式是绝佳解决方案的情况，并构建组合模式。\n\n## 文件管理器\n\
  \n想象你是一个流行社交媒体网站的 Web 开发者，你被分配添加一个功能，允许用户上传并在文件中组织其数据。换句话说，你必须创建 `File` 和 `Folder`\
  \ 类。从一开始，你就意识到这些类共享许多特征，如名称、创建日期、修改日期、图标和缩略图。你知道你需要实现组合模式，因为这是实现这一目标更简单的方法。\n\n\
  ### 第一步：组件父类\n\n我们做的第一件事是创建一个 `File` 和 `Folders` 将派自的父类。由于我们正在使用 C#，我们可以使用 `Abstract`（抽象）类。\n\
  \n所以我们将创建一个接受名称、创建日期和最后修改日期的父类。\n\n```csharp\n/*\n// Component 是 File 和 Folder 类继承的父类\n\
  // 它具有：\n// - 名称，类型为 String\n// - 创建日期\n// - 最后修改日期\n// 它可以：\n// - 重命名自己\n// - 更新修改日期\n\
  */\nabstract class Component {\n    String name;\n    DateTime dateCreated;\n  \
  \  DateTime dateLastModified;  \n}\n```\n\n### 第二步：自定义组件构造函数\n\n然后我们为我们的组件/父类编写一个略有不同的版本。这样当创建一个新组件时，将设置名称并将日期设置为当前日期。\n\
  \n所有的文件和文件夹将使用相同的组件作为构造函数。\n\n```csharp\nabstract class Component {\n    public\
  \ String name;\n    public DateTime dateCreated;\n    public DateTime dateLastModified;\
  \      \n\n    /*\n    // 输入：一个 String\n    // 组件的自定义构造函数，\n    // 创建时将设置日期\n  \
  \  */\n    public Component(String n) {\n        name = n;\n        dateCreated\
  \ = DateTime();\n        dateLastModified = DateTime();\n    }\n}\n```\n\n你可以看到这如何减少代码行并防止错误。所有结果对类都可用，它们共享许多相似之处。属性将与父类共享，因此不需要编写两次代码。它们源自父类。\n\
  \n### 第三步：创建 File 类\n\n`File` 类将与文件夹类共享相似之处，但它包含：\n\n```csharp\n// 普通项目类（如 File）：\n\
  // 包含了在 Component 中定义的所有字段和方法\n// 还有：\n// - 一个 type\nclass File : Component {\n\
  \    public String type;\n\n    public File(String n, String f) : base(n) {\n  \
  \      type = f;\n    }\n}\n```\n\n### 第三步（原文如此）：创建 Folder 类\n\n在制作 `Folder` 类时，过程是相同的，除非你添加：\n\
  \n```csharp\n// 普通分组类（如 Folder）：\n// 包含了在 Component 中定义的所有字段和方法\n// 还有：\n// - 一个组件列表，可以包含项目或组\n\
  class Folder : Component {\n    List<Component> contents = new List<Component>();\n\
  \n    public Folder(String n) : base(n) {\n    }\n}\n```\n\n### 第四步：运行与测试\n\n下一步是通过创建文件和文件夹来测试代码。因此在\
  \ `Main` 类或此代码运行的地方运行这些代码。\n\n```csharp\nFolder top = new Folder(\"Top Folder\"\
  );\nFile a = new File(\"A\", \"Spreadsheet\");\nFile b = new File(\"B\", \"Picture\"\
  );\nFolder mid = new Folder(\"Mid Folder\");\ntop.contents.Add(a);\ntop.contents.Add(b);\n\
  top.contents.Add(mid);\nFile c = new File(\"C\", \"Video\");\nFile d = new File(\"\
  D\", \"Letter Document\");\nFolder bot = new Folder(\"Bottom Folder\");\nmid.contents.Add(c);\n\
  mid.contents.Add(d);\nmid.contents.Add(bot);\nFile e = new File(\"E\", \"PDF\");\n\
  bot.contents.Add(e);\n```\n\n之后，在上述代码之后放置以下代码并运行它。\n\n```csharp\nConsole.WriteLine(top.name);\n\
  foreach (var Component in top.contents) {\n    Console.WriteLine(\"    \" + Component.name);\n\
  }\nforeach (var Component in mid.contents) {\n    Console.WriteLine(\"        \"\
  \ + Component.name);\n}\n```\n\n\n\n\n\n```csharp\nforeach (var Component in bot.contents)\
  \ {\n    Console.WriteLine(\"            \" + Component.name); \n}\n```\n\n遵循这些步骤后，输出应该如下：\n\
  \n顶层文件夹\n    A\n    B\n    中间文件夹\n        C\n        D\n        底部文件夹\n        \
  \    E\n\n如果操作正确，我们就可以创建一个文件、文件夹和子文件夹的层级系统。\n\n# 第 15 章：观察者模式\n\n在某些情况下，你需要创建两个具有“观察者”（observer）与“被观察者”（observed）预关系的类。换句话说，一个对象需要观察或监控另一个对象来实现其功能。例如，你可以有一个类来收集你周围环境的数据：时间、天气、位置等。你可能还会有另一个对象，它需要这些数据来提醒用户附近的朋友、天气情况，并提醒他们活动和计划。为了实现这一点，你需要使用观察者模式，因为一个对象需要为了其主要功能而观察其他对象。\n\
  \n### 它的基本工作原理：\n\n观察者模式在开发者中非常流行，因为我们使用的许多应用程序都是以描述的方式运行的。它包含“主体（Subject）”和“观察者（Observer）”。观察和作为对象是这些行为的描述，因此我们实现了\
  \ `Observer` 和 `Subject` 接口。这将允许类应用观察者和主体行为。所有这些类都必须应用它们的接口。\n\n所有实现 `Observer`\
  \ 接口的类都将有一组待观察的主体列表。它们需要一个 `update()` 方法，根据主体对象的相应变化来更新它们的数据。\n\n所有实现 `Subject`\
  \ 接口的类都将有一个观察者对象列表，用于通知用户数据的变化。\n\n当主体对象发生数据变化时，它会调用 `notify()` 方法，该方法会通知其观察者列表。一旦观察者收到通知，它们就会调用\
  \ `update()` 方法，根据主体的更新更新更新自己的数据。\n\n在实现观察者模式时，你只需要考虑两点：观察者的数量和主体的数量。我们将处理多观察者和多主体的场景以展示其动态过程。\n\
  \n## C# 中的观察者模式\n\n下面是观察者模式在 C# 中的外观。你会看到两组类/接口对。我们将从观察者对开始。\n\n```csharp\n/*\n\
  // 所有观察类都实现 Observer 抽象\n// 它可以：\n// - 根据主体更新对象数据\n// 观察类可能需要一个主体列表来访问\n// (添加在\
  \ Observer 类中)\n*/ \n\ninterface Observer {           \n    void update();\n   \
  \ // 在此处输入任何其他方法\n}\n\n/*\n// 观察类拥有：\n// - update() 方法的工作版本\n// - 任意数量的额外字段和方法\n\
  */\nclass ObservingClass : Observer {\n    // 在此处输入任何关键字段；    \n    // 输入：（可选）\n\
  \    // 输出：无\n    // 效果：响应主体更新数据\n    void Observer.update() {\n    // 在此处对观察者的关键字段进行任何更改\n\
  \    }\n}\n```\n\n下面是主体类/接口对。\n\n```csharp\n/*\n// 所有主体类都实现 Subject 抽象\n// 它可以：\n\
  // - 通知观察者\n// - 在其更新列表中添加/删除观察者\n// 主体类还需要一个观察者列表来更新\n// (添加在 Subject 类中)\n*/\n\
  interface Subject {\n    public void notifyObservers();\n    public void addObs(Observer\
  \ o);\n    public void deleteObs(Observer o);\n    // 在此处输入任何其他方法\n}\n\n/*\n// 主体类拥有：\n\
  // - 一个用于通知的观察者列表\n// - notifyObservers() 方法的工作版本\n// - 任意数量的额外字段和方法\n// 主体类还需要一个观察者列表来更新\n\
  // (添加在 Subject 类中)\n*/\nclass SubjectClass : Subject {\n    // 在此处输入任何关键字段；   \
  \ \n    private List<Observer> obs = new List<Observer>();\n    // 输入：（可选）\n   \
  \ // 输出：无\n    // 效果：由于任何变化更新列表中的所有观察者\n    public void notifyObservers(){\n   \
  \     foreach (var o in obs) {\n            o.update();\n        }\n    }\n    //\
  \ 添加/删除方法：\n    // 输入：Observer\n    // 输出：无\n    // 效果：响应主体更新\n    public void addObs(Observer\
  \ o) {\n        obs.Add(o);\n    }\n    public void deleteObs(Observer o) {\n  \
  \      obs.Remove(o);\n    }\n}\n```\n\n现在，我们详细介绍如何实现观察者模式。\n\n### 实现观察者模式\n\n使用你喜欢的\
  \ IDE 来实现代码。你可以使用在线 IDE，如 `codechef.com`、`rextester.com`、`ideone.com` 或 `codpad.org`。\n\
  \n我们将使用一个你可能在现实世界遇到的例子。在这个例子中，你将是一个黑客专家。追捕行动。想象你被 FBI 招募去捕一个恐怖组织。你可以轻松地追踪该恐怖组织，但外地的数十名探员需要实时获取信息。这意味着你必须更改他们设备上的软件。你需要创建一个原型，当恐怖分子靠近时警报探员。\n\
  \n#### 第一步：：识别观察者和主体\n\n在这种语境下，谁是你的观察者，谁是你的主体？恐怖分子是主体。你需要跟踪他们的位置。这就是你的代码将拥有的信息。它只有几行：\n\
  \n```csharp\n// 单个恐怖分子拥有：\n// - 一个位置（字符串类型）\n// - 一个观察者对象列表\nclass Terrorist{\n\
  \    public String location;\n}\n```\n\nFBI 的设备是观察者。我们需要修改 `Module`，让它在关键进展时发送通知。设备模块看起来如下：\n\
  \n```csharp\n// 设备模块拥有：\n// - 一个警报状态（布尔类型）\n// - 通知更新（字符串）\n// - 一个位置（字符串类型）\n//\
  \ 它可以：\n// - 推送警报\n// - 更新警报和通知\nclass Module{\n    public String location;\n  \
  \  public boolean alert;\n    public String notifications;\n    // 效果：如果 alert 为真，则打印警报\n\
  \    void sendAlerts(){\n        if (alert) {\n            Console.WriteLine(\"\
  ALERT: \" + notifications + \" Agents in \" + this.location);\n        }\n    }\n\
  }\n```\n\n#### 第二步：设置观察者和主体抽象\n\n在 C# 中，我们两者的抽象都是接口。它们看起来如下：\n\n```csharp\n/*\n\
  // 所有观察类都实现 Observer 抽象\n// 它可以：\n// - 根据主体更新对象数据\n// 观察类可能需要一个主体列表来访问\n// (添加在\
  \ Observer 类中)\n*/ \ninterface Observer {          \n    void update();\n}\n\n/*\n\
  // 所有主体类都实现 Subject 抽象\n// 它可以：\n// - 通知观察者\n// - 在其更新列表中添加/删除观察者\n// 主体类还需要一个观察者列表来更新\n\
  // (添加在 Subject 类中)\n*/ \ninterface Subject {\n    void notifyObservers();\n   \
  \ void addObs(Observer o);\n    void deleteObs(Observer o);\n}\n```\n\n#### 第三步：修改我们的主体类以作为主体\n\
  \n告诉我们恐怖分子所在的数据对象就是主体类。因此，它将实现 `Subject` 接口。这意味着你需要添加并包含 `Subject` 接口中指定的方法。这还需要包含一个需要通知的观察者对象列表。为了防止黑客攻击，此字段应保持为私有。\n\
  \n```csharp\n// 单个恐怖分子拥有：\n// - 一个位置（字符串类型）\n// - 一个观察者对象列表\n// 同时实现了 Subject 接口；\
  \ \n// （需要实现它的方法）\nclass Terrorist : Subject{\n    public String location;\n   \
  \ private List<Observer> obs = new List<Observer>();\n    // 新：来自 Subject 接口\n \
  \   public void notifyObservers() {};\n}\n```\n\n\n\n\n\n```java\npublic void addObs(Observer\
  \ o) {};\n\npublic void deleteObs(Observer o) {};\n\n}\n```\n\n对于 `notifyObservers`\
  \ 方法，我们需要遍历 `Observers` 列表并更新它们。因此，该方法应该修改如下：\n\n```csharp\n// 新增：来自 Subject 接口\n\
  \npublic void notifyObservers() {\n    foreach (var o in obs) {\n        o.update();\n\
  \    }\n}\n```\n\n我们将需要实现 `addObs()` 和 `deleteObs()` 方法，它们将根据需要添加或移除 `Observers`。\n\
  \n```java\npublic void addObs(Observer o) {\n    obs.Add(o);\n};\n\npublic void\
  \ deleteObs(Observer o) {\n    obs.Remove(o);\n};\n```\n\n完成所有更改后，你的 `Terrorist`\
  \ 类应该像这样：\n\n```csharp\nclass Terrorist implements Subject{\n    String location;\n\
  \    private List<Observer> obs = new ArrayList<Observer>();\n    // 新增：来自 Subject\
  \ 接口\n    public void notifyObservers() {\n        for (Observer o: obs) {\n   \
  \         o.update();\n        }\n    };\n    public void addObs(Observer o) {\n\
  \        obs.add(o);\n    };\n    public void deleteObs(Observer o) {\n        obs.remove(o);\n\
  \    };\n}\n```\n\n### 步骤 4：修改我们的 Observer 类以作为一个观察者\n\n我们的 `Module` 数据类将作为一个 `Observer`，因此它将包含观察者方法及其所有方法。\n\
  \n```csharp\n// 一个设备模块拥有：\n// - 一个警报状态（布尔值）\n// - 通知更新（字符串形式）\n// - 一个位置（字符串）\n\
  // 它可以：\n// - 推送警报 \n// - 更新警报与通知\n// 同时实现了 Observer 接口；\n// (需要实现它的方法)\nclass Module\
  \ : Observer{\n    public String location;\n    public boolean alert;\n    public\
  \ String notifications;\n    public void update() {};\n\n    // 效果：如果 alerts 为 true，则打印警报通知\
  \ \n    void sendAlerts(){\n        if (alert) {\n            Console.WriteLine(\"\
  ALERT: \" \n                            + notifications \n                     \
  \       + \"Agents in \" \n                            + this.location);\n     \
  \   }\n    }\n}\n```\n\n在添加 `update()` 方法之前，思考一下模块将如何运作是值得。\n\n### 步骤 5：修改观察类以根据\
  \ Subject 类进行更新\n\n每当 `Terrorists` 附近时，`Module` 类必须发送更新和警报。\n\n`Terrorists'` 的本地字段是一个\
  \ `Sting`，`Module` 也是如此。\n\n每当 `Module` 的位置与 `Terrorists` 匹配时，将发送警报，但在接收来自 `Terrorist`\
  \ 类的数据之前，`update` 方法需要获得来自 `Terrorist` 对象的输入。\n\n```java\n// 输入：一个 Terrorist 对象\n\
  // 输出：无\n// 效果：如果 Terrorist 和此模块的位置相同，\n// 将 Alert 设为 true 并更新通知。\n// 之后，发送警报\n\
  public void update(Terrorist t) { };\n```\n\n对于任何使用此方法的代码，你都需要相应的更新。观察者接口需要修改以包含此类输入：\n\
  \n```java\ninterface Observer {           \n    …\n    public void update(Terrorist\
  \ t);\n…  \n```\n\n`terrorist` 类的通知方法也需要根据输入类型进行修改。它需要能够通知其类中的观察者。因此，类本身就是输入。\n\n\
  ```csharp\nclass Terrorist : Subject{\n    …\n    public void notifyObservers()\
  \ {\n        foreach (var o in obs) {\n            o.update(this);\n        }\n\
  \    };\n    …\n}\n```\n\n### 步骤 5：实现 update()\n\n下一步是让 `update()` 方法运行起来。我们将代码放在\
  \ `Module` 类的 `update()` 方法中。\n\n```java\n// 输入：一个 Terrorist 对象\n// 输出：无\n// 效果：如果\
  \ Terrorist 和此模块的位置相同，\n// 将 Alert 设为 true 并更新通知。\n// 之后，发送警报\npublic void update(Terrorist\
  \ t) {\n    if (this.location == t.location) {\n        this.alert = true;\n   \
  \     this.notifications = \"Terrorist Nearby \";\n    }\n    else {\n        this.alert\
  \ = false;\n        this.notifications = \"\";\n    }\n    sendAlerts();\n};\n```\n\
  \n#### 运行代码\n\n我们将在两种场景下运行代码。在两种情况下，观察类都将根据它从主题类获得的信息发出警报信号。在这种场景下，观察者多于主题者。（将下面的代码粘贴到你的\
  \ `Main()` 方法下方）\n\n```java\n// 第 1 部分：创建所有数据对象\nTerrorist t = new Terrorist();\n\
  Module m1 = new Module(); \nModule m2 = new Module();\nModule m3 = new Module();\n\
  Module m4 = new Module(); \n\n// 第 2 部分：将所有观察者添加到 Subject 列表\nt.addObs(m1);\nt.addObs(m2);\n\
  t.addObs(m3);\nt.addObs(m4);\n\n// 创建所有位置\nString[] locs = new String[10];\nlocs[0]\
  \ = \"Los Angeles\";\nlocs[1] = \"Chicago\";\nlocs[2] = \"New York\";\nlocs[3] =\
  \ \"Seattle\";\nlocs[4] = \"Cleveland\";\nlocs[5] = \"Boston\";\nlocs[6] = \"San\
  \ Francisco\";\nlocs[7] = \"Miami\";\nlocs[8] = \"St. Louis\";\nlocs[9] = \"Dallas\"\
  ;\n\n// 第 3 部分：设置观察者的位置\nm1.location = locs[1];\nm2.location = locs[4];\nm3.location\
  \ = locs[5];\nm4.location = locs[9];\n\n// 当恐怖分子在全美移动时，\n// 它会通知所有模块其位置。\n// 当附近有恐怖分子时，模块会触发警报。\n\
  for(int i = 0; i < 10; i++) {\n    t.location = locs[i];\n    t.notifyObservers();\n\
  }\n```\n\n当代码运行时，你将在控制台看到：\nALERT: Terrorist Agents in Chicago\nALERT: Terrorist\
  \ Agents in Cleveland\nALERT: Terrorist Agents in Boston\nALERT: Terrorist Agents\
  \ in Dallas\n\n在这些场景中，主题者多于观察者。（将下面的代码粘贴到你的 `Main()` 方法下方）\n\n```java\n// 第 1 部分：创建所有数据对象\n\
  Terrorist t1 = new Terrorist();\nTerrorist t2 = new Terrorist();\nTerrorist t3 =\
  \ new Terrorist();\nTerrorist t4 = new Terrorist();\nTerrorist t5 = new Terrorist();\
  \        \nModule m = new Module(); \n\n// 第 2 部分：将所有观察者添加到 Subject 列表\nt.addObs(m1);\n\
  t.addObs(m2);\nt.addObs(m3);\nt.addObs(m4);\nt.addObs(m5);\n\n// 创建所有位置\nString[]\
  \ locs = new String[10];\nlocs[0] = \"Los Angeles\";\nlocs[1] = \"Chicago\";\nlocs[2]\
  \ = \"New York\";\nlocs[3] = \"Seattle\";\nlocs[4] = \"Cleveland\";\nlocs[5] = \"\
  Boston\";\nlocs[6] = \"San Francisco\";\nlocs[7] = \"Miami\";\nlocs[8] = \"St. Louis\"\
  ;\nlocs[9] = \"Dallas\";\n\n// 第 3 部分：设置观察者的位置\nm1.location = locs[1];\nm2.location\
  \ = locs[4];\nm3.location = locs[5];\nm4.location = locs[9];\n```\n\n\n\n\n\n开车非常简单。要启动汽车，你只需转动点火开关钥匙或按下按钮。加速时，踩油门。减速或停止时，踩刹车踏板，而方向盘则允许你控制汽车行驶的方向。\n\
  \n然而，汽车是非常复杂的。启动汽车需要大量的能量。它需要汽油。你的发动机需要足够的油来润滑发动机活塞和其他所有部件。火花塞需要点燃气缸，为汽车移动产生足够的能量。转向、加速和制动等功能需要一套不同的、复杂的组件协同工作。\n\
  \n从驾驶座来看，我们无法接触到所有这些复杂性。我们只能看到面前简单的工具。简而言之，这就是一个 `Facade`（外观模式）。\n\n## 外观模式的工作原理\n\
  \n外观模式的工作原理也是类似的。它提供了一个顶层组件，负责监督复杂系统的功能。这使得操作复杂系统变得简单得多，因为你只需要在 `Facade` 中控制你面前的简单系统。我们的汽车类比就向我们展示了这一点。驾驶员不需要自己去操作每一个组件，不需要进入发动机内部，也不需要执行数百万次操作来让汽车移动。他只需要知道如何操作挡杆、踏板、方向盘，并了解基础知识——将复杂的事简单化。驾驶员的每一个动作都会触发一系列复杂的事件链。\n\
  \n### 创建外观模式\n\n当你想要实现外观模式时，首先需要理解我们想要简化的核心过程（Procedures）或行为（Behavior）。\n\n使用接口，我们可以遵循以下步骤：\n\
  \n1. 创建一个包含核心过程的 `Facade` 接口。\n2. 创建一个通用的客户端类来执行 `Facade` 接口。\n3. 通用客户端类应该应用所有的主要过程，并包含尽可能多的组件实例。\n\
  4. 如果必要，创建多个 `Facade` 接口和客户端类。在这样做时，重复步骤 1 到 3。\n5. 有必要时，为通用客户端类创建子类；访问系统的代码将以客户端子类的形式执行。\n\
  \n如果你正在使用一个封装类（encompassing class），请遵循这些步骤：\n\n1. 创建通用的 `Facade` 类。该类实现了之前提到的所有主要过程。它应该包含尽可能多的实例。\n\
  2. 创建一个通用的客户端类。它应该包含一个 `Facade` 类的实例。\n3. 如果合适，创建多个 `Facade` 类并重复步骤 1 和 2。\n4. 如果需要，为通用客户端类创建子类。任何访问系统的代码都通过客户端子类中的\
  \ `Facade` 类执行。\n\n你采取的步骤取决于你的情况。因此，请判断使用一个封装的 `Facade` 包装类是否合适。\n\n## C# 中的外观模式\n\
  \n为了充分理解外观模式，我们需要观察它的环境。注意构成复杂系统的组件集合。\n\n下面是一个带有多个子组件的组件类示例，该类的方法可能依赖于它的子组件。\n\n\
  ```csharp\n// 组件类，带有子组件\n// 方法：\n// - 一个访问子组件的方法\n\nclass ComponentOne {\n    SubcompOneOne\
  \ sc11 = new SubcompOneOne();\n    SubcompOneTwo sc12 = new SubcompOneTwo();   \
  \ \n    // 输入 & 输出: (由你选择)\n    // 效果: (由你选择)\n    public void distinctMethodOne()\
  \ {\n        sc11.distinctMethodOneOne();\n        sc12.distinctMethodOneTwo();\n\
  \    }    \n}\n\nclass SubcompOneOne {\n    // 输入 & 输出: (由你选择)\n    // 效果: (由你选择)\n\
  \    public void distinctMethodOneOne() {\n    }    \n}\n\nclass SubcompOneTwo {\n\
  \    // 输入 & 输出: (由你选择)\n    // 效果: (由你选择)\n    public void distinctMethodOneTwo()\
  \ {\n  }    \n}\n```\n\n这是是环境中另外两个组件的示例：\n\n```csharp\nclass ComponentTwo {\n  \
  \  // 输入 & 输出: (由你选择)\n    // 效果: (由你选择)\n    public void distinctMethodTwo() {\n\
  \        // (在此处添加实现)\n    }    \n}\n\nclass ComponentN {\n    // 输入 & 输出: (由你选择)\n\
  \    // 效果: (由你选择)\n    public void distinctMethodN() {\n        // (在此处添加实现)  \
  \      \n    }    \n}\n```\n\n所有组件都需要进行协调。下面是我们在 C# 中实现外观模式的方式。它看起来是这样的：\n\n```csharp\n\
  // 作为接口 Facade\n// (包含利用环境内\n// 组件的主要过程)\ninterface Facade {\n    // 主要过程：\n   \
  \ // 输入 & 输出: (由你选择)\n    // 效果: (由你选择)\n    // 来自所有组件的调用\n    void activateA();\n\
  \    void activateB();\n}\n\n// 客户端类\n// (在 Facade 内实现所有过程)\nclass Client : Facade\
  \ {\n    ComponentOne c1 = new ComponentOne();\n    ComponentTwo c2 = new ComponentTwo();\n\
  \    ComponentN cN = new ComponentN();\n    // 来自 Facade 的方法：\n    void activateA()\
  \ {\n        c1.distinctMethodOne();\n    }\n    void activateB() {\n        c2.distinctMethodTwo();\n\
  \        cN.distinctMethodN();\n    }\n}\n// 接口由 Client 类实现：\n// 客户端子类：(需要时添加)\n\
  class ClientA : Client {}\nclass ClientB : Client {}\n```\n\n如果 `Facade` 被实现为超类，它看起来是这样的：\n\
  \n```csharp\n// 作为超类的 Facade\n// 包含环境内\n// 组件的主要过程\nclass Facade {\n    // 环境中的实例\n\
  \    ComponentOne c1 = new ComponentOne();\n    ComponentTwo c2 = new ComponentTwo();\n\
  \    ComponentN cN = new ComponentN();\n    // 主要过程：\n    // 输入 & 输出: (由你选择)\n \
  \   // 效果: (由你选择)\n    // 来自所有组件的调用\n    void activateA() {\n        c1.distinctMethodOne();\n\
  \    }\n    void activateB() {\n        c2.distinctMethodTwo();\n        cN.distinctMethodN();\n\
  \    }\n}\n\n// 客户端拥有 Facade 的实例\n// 客户端类：\nclass Client {\n    Facade f = new Facade();\n\
  }\n// 客户端子类：(需要时添加)\nclass ClientA : Client {}\nclass ClientB : Client {}\n```\n\
  \n## 应用外观模式\n\n使用你喜欢的 IDE 来实现代码。可以使用 `codechef.com`、`rextester.com`、`ideone.com`\
  \ 或 `codepad.org`。\n\n这是一个需要外观模式的示例。\n\n### 带有曲速驱动的银河飞船\n\n这是来自银河飞船系统的代码部分。每部分代码都管理相应的硬件组件。\n\
  \n```csharp\n// 银河飞船 GSX2013-A4\n// 组件列出：\n// - 正子引擎\n// - 点火晶体\n// - 物质驱动\n// -\
  \ 能量预点火器\n// - 物质融合反应堆\n// - 曲速驱动\n// - 银河导航\n// - 坐标\n// - 曲速触发器\nclass PositronEngine\
  \ {\n    IgnitionCrystal igc = new IgnitionCrystal();\n    DarkMatterDrive dmd =\
  \ new DarkMatterDrive();\n    public void startEngine() {\n        igc.lightUp();\n\
  \        dmd.activate();\n    }\n}\n\nclass IgnitionCrystal {\n    public void lightUp()\
  \ {\n        // (某些硬件实现)    \n    }\n}\n\nclass DarkMatterDrive {\n    EnergyPreIgniter\
  \ epi = new EnergyPreIgniter();\n    MatterFusionReactor mfr = new MatterFusionReactor();\n\
  \    public void activate() {\n        epi.ignite();\n        mfr.fuse();\n    }\n\
  }\n\nclass EnergyPreIgniter {\n    public void ignite(){\n        // (某些硬件实现)  \
  \  \n    }\n}\n\nclass MatterFusionReactor {\n    public void fuse() {\n       \
  \ // (某些硬件实现)\n    }\n}\n\nclass WarpDrive {\n    WarpIgniter wi = new WarpIgniter();\n\
  }\n```\n\n\n\n\n\n```cs\nMatterFusionReactor mfr = new MatterFusionReactor();\n\n\
  public void warpTo(Coordinates c) {\n    wi.activate();\n    mfr.fuse();\n    //\
  \ (将飞船传跃到给定位置)\n}\n}\n\n// 注意：确保‘using System.Collections;’ 行 \n// 位于代码的顶部\n\nclass\
  \ GalacticNavigation {\n    ArrayList points = new ArrayList();\n}\n\nclass Coordinates\
  \ {\n    int x, y, z;\n    public Coordinates(int x, int y, int z) {\n        this.x\
  \ = x;\n        this.y = y;\n        this.z = z;\n    }\n}\n\nclass WarpIgniter\
  \ {\n    public void activate() {\n        // (此处为某些硬件实现)\n    }\n}\n```\n\n尽管我们只有几行代码，但可以看出这是一个复杂的系统。假设我们被要求协调各个组件来完成如启动主引擎和激活曲速驱动之类的任务。我们会发现这些任务需要在一个通用的处理器下处理。这就是我们应用**外观模式（Facade\
  \ pattern）**的原因。\n\n### 识别主要程序\n\n我们的主要程序如下：\n\n- 启动主引擎\n- 激活曲速驱动\n\n我们需要为这些程序实现一个外观模式。我们选择的方法是使用一个包含性的\
  \ Facade 包装类。\n\n#### 1) 创建通用的“Facade”类……\n\n我们首先像如下所示创建包装器 `Facade` 类：\n\n```cs\n\
  class Facade {\n}\n```\n\n该类应该实现前面提到的**所有**主要程序。\n\n```cs\nclass Facade {\n    //\
  \ 新行：\n    // 主要程序： \n    public void startEngine(){\n        pe.startEngine();\
  \ \n        // (其余的实现)\n    }\n    public void activateWarpDrive(){\n        wd.warpTo(new\
  \ Coordinates(0, 0, 0));\n        // (其余的实现)\n    }\n}\n```\n\n它将包含尽可能多的组件。\n\n\
  我们需要包含来自那些贡献于主要程序的类的实例。\n\n仔细观察代码，我们会注意到其他组件依赖于其他组件才能运行。如果我们对它进行映射，它看起来像这样：\n\n\
  `PositronEngine`（正子引擎）依赖于：\n-> `IgnitionCrystal`（点火晶体）\n-> `DarkMatterDrive`（暗物质驱动）（依赖于：）\n\
  - -> `EnergyPreIgniter`（能量预点器）\n- -> `MatterFusionReactor`（物质聚变反应堆）\n\n`WarpDrive`（曲速驱动）依赖于：\n\
  -> `WarpIgniter`（曲速点火器）\n-> `MatterFusionReactor`（物质聚变反应堆）\n\n我们可以看到 `PositronEngine`\
  \ 和 `WarpDrive` 类某种程度上依赖于相关的类。\n\n这意味着我们需要这两个类的实例，其余部分将以任何必要与它们链接。\n\n```cs\nclass\
  \ Facade {\n    // 新行：\n    PositronEngine pe = new PositronEngine();\n    WarpDrive\
  \ wd = new WarpDrive();\n    // 主要程序： \n    public void startEngine(){\n       \
  \ pe.startEngine(); \n        // (其余的实现)\n    }\n    public void activateWarpDrive(){\n\
  \        wd.warpTo(new Coordinates(0, 0, 0));\n        // (其余的实现)\n    }\n}\n```\n\
  \n#### 2) 创建一个包含 Facade 类实例的通用客户端。\n\n客户端类的泛化是指包含 `Facade` 实例的类：\n\n```cs\n// 客户端：\n\
  //（其余软件访问此内容）\nclass Client {\n    Facade f = new Facade();\n}\n```\n\n我们需要访问客户端类及其外观来访问系统的功能：\n\
  \n```cs\nClient c = new Client();\n// 启动引擎：\nc.f.startEngine();\n// 激活曲速驱动：\nc.f.activateWarpDrive();\n\
  ```\n\n#### 3) 根据需要为通用客户端创建子类。\n\n进一步开发你的客户端的一种方法是创建一个专门的子类以及更多内容。\n\n```cs\n//\
  \ 客户端子类：\n//（需要时随时添加）\nclass ClientA: Client {}\nclass ClientB: Client {}\n```\n\
  \n你的客户端子类将像通用客户端一样访问 `Facade`：\n\n```cs\nClient ca = new ClientA();\nClient cb =\
  \ new ClientB();\n// 启动引擎：\nca.f.startEngine();\ncb.f.startEngine();\n// 激活曲速驱动：\n\
  ca.f.activateWarpDrive();\ncb.f.activateWarpDrive();\n```\n\n我们可以看到外观模式是如何创建一个简单的核心或功能的。因此，当面对此类问题时，请考虑使用该模式。\n\
  \n##### 多个外观\n\n如果程序需要你创建多个外观，让我们看看它是如何工作的。让我们使用示例来展示这一点：\n\n```cs\nclass EngineFacade\
  \ {\n    PositronEngine pe = new PositronEngine();\n    // 主要程序： \n    public void\
  \ startEngine(){\n        pe.startEngine(); \n        // (其余的实现)\n    }\n}\n\nclass\
  \ WarpDriveFacade {\n    WarpDrive wd = new WarpDrive();\n    // 主要程序： \n    public\
  \ void activateWarpDrive(){\n        wd.warpTo(new Coordinates(0, 0, 0));\n    \
  \    // (其余的实现)\n    }\n}\n```\n\n即使是通用的 `Client` 类也会反映这些变化：\n\n```cs\n// 客户端类：\n\
  //（其余软件访问此内容）\nclass Client {\n    EngineFacade ef = new EngineFacade();\n    WarpDriveFacade\
  \ wdf = new WarpDriveFacade();\n}\n```\n\n# 第十七章：异步编程\n\nC# 允许你编写异步代码。假设你正在处理一个下载图片的\
  \ Windows 程序。点击按钮并下载图像将花费 30 秒，如果你同步下载图像，程序将无响应。更好的方法是异步的。\n\n我们将探索这意味着什么，以及我们如何使用它。\n\
  \n### 内容\n* 使用 `async` 和 `await` 进行异步编程\n\n我们可以通过两个关键字使用异步编程：`async` 和 `await`。让我们来看看它们。\n\
  \n### Async\n\n如果在声明函数时加上 `async` 关键字，该函数将变为异步的。该关键字激活 .NET 资源。语法如下：\n\n```cs\n\
  public async void MyProcess()\n```\n\n上述函数将被异步调用。\n\n### Await\n\n带有 `async` 的函数内部必须有一个\
  \ `await` 关键字。其语法如下：\n\n```cs\npublic async void MyProcess()\n{\n    // 执行异步工作\n\
  \    await Task.delay(5);\n}\n```\n\n上述函数将在等待 5 秒后激活。\n\n下面的代码从网络下载图像。\n\n示例 1：\n\
  \n```cs\nprivate void button_Click(object sender, EventArgs e) {\n    WebClient\
  \ image = new WebClient();\n    byte[] imageData = image.DownloadData('http://urlOfTheImage');\n\
  \    this.imageView.Image = Image.FromStream(new MemoryStream(imageData));\n}\n\
  ```\n\n你的应用程序在代码执行时会变得无响应，这是不理想的。我们可以像这样使用 `async` 和 `await` 来修复它：\n\n示例 2：\n\n\
  ```cs\nprivate async void button_Click(object sender, EventArgs e) {\n    WebClient\
  \ image = new WebClient();\n    byte[] imageData = await image.DownloadDataTaskAsync('http://urlOfTheImage');\n\
  \    this.imageView.Image = Image.FromStream(new MemoryStream(imageData));\n}\n\
  ```\n\n如果你查看这两个代码块，你会发现三个区别：\n\n- 在函数前添加 `async` 关键字。\n- `await` 关键字位于图像下载方法之前。\n\
  - `DownloadDataAsync` 替换了 `DownloadData` 方法。\n\n`DownloadData` 方法同步下载数据。当完成后，它将控制权返回给调用者，这会导致程序无响应。`DownloadDataAsync`\
  \ 返回控制权并异步下载。`await` 方法在下载完成之前释放 UI 线程。\n\n注意：异步方法可以返回三种类型。\n\n- `Void`：不返回内容。\n\
  - `Task`：它将执行一个操作。\n\n\n\n\n\n- `Task<T>`: 返回一个带有 `T` 类型参数的任务。\n\n`Task`: `Task`\
  \ 将不返回任何值（假设它是 void），而 `Task<int>` 将返回一个 `int` 类型元素。我们可以将其称为泛型类型。\n\n注意：如果缺少 `await`\
  \ 关键字，异步方法将以同步方式运行。\n\n### 示例 3:\n\n```csharp\nusing System;\nusing System.IO;\n\
  using System.Threading.Tasks;\n\nclass Program\n{\n    static void Main()\n    {\n\
  \        Task task = new Task(ProcesstheDataAsync);\n        task.Start();\n   \
  \     task.Wait();\n        Console.ReadLine();\n    }\n    static async void ProcesstheDataAsync()\n\
  \    {\n        Task<int> task = HandleFileAsync('C:\\enable1.txt');\n        Console.WriteLine('Wait\
  \ ' + 'while I carry out something vital.');\n        int x = await task;\n    \
  \    Console.WriteLine('Count: ' + x);\n    }\n    static async Task<int> HandleFileAsync(string\
  \ file)\n    {\n        Console.WriteLine('HandleFile enter');\n        int count\
  \ = 0;\n        using (StreamReader reader = new StreamReader(file))\n        {\n\
  \            string v = await reader.ReadToEndAsync();\n            count += v.Length;\n\
  \            for (int i = 0; i < 10000; i++)\n            {\n                int\
  \ x = v.GetHashCode();\n                if (x == 0)\n                {\n       \
  \             count--;\n                }\n            }\n        }\n        Console.WriteLine('HandleFile\
  \ exit');\n        return count;\n    }\n}\n```\n\n初始输出 3:\nHandleFile enter\nWait\
  \ while I carry out something vital.\n\n最终输出 3:\nHandleFile enter\nWait while I\
  \ carry out something vital.\nHandleFile exit\nCount: 196\n\n在 `main` 方法之后，我们创建了\
  \ `ProcesstheDataAsync` 的实例作为参数。在下一行中，我们通过 `task.Start()` 初始化了任务，然后通过 `task.Wait()`\
  \ 等待它完成。`ProcesstheDataAsync` 中的 `async` 签名告诉我们该方法是异步的，这使得 `await` 成为强制性的。方法内部的第一行调用了\
  \ `HandleFileAsync` 方法。这意味着在 `HandleFileAsync` 方法返回之前，控制权将返回。\n\nHandleFile enter\n\
  Wait while I carry out something vital.\n\n`HandleFileAsync` 的第一行打印到屏幕上，然后控制权返回到\
  \ `ProcessDataAsync`。接着第二行打印在屏幕上。计算出的结果随后赋值给变量 `x`，然后打印在屏幕上。\n\n让我们关注第二个 `HandleFileAsync`\
  \ 方法。在第一行打印之后，整数在 `count` 变量中初始化，当我们传递文件位置时，将其设置为 `0`。为了从文件 `C:\\enable1.txt` 读取数据，我们初始化了\
  \ `StreamReader` 类型并传递了文件位置。一个异步内置方法 `reader.ReadToEndAsync()` 读取文件，我们使用 `await`\
  \ 关键字告诉它等待执行完成。之后，我们将结果赋值给字符串类型 `v`。然后，我们将字符串的 `length` 加到 `count` 变量中。接着我们使用代码对\
  \ `count` 进行操作。记住，代码是为了供你理解。最后，该方法打印了行 `HandleFile exit` 和其值。\n\n# 第 18 章：游戏开发\n\
  \n我们将学习如何如何在游戏开发中使用我们的 C# 技能。我们将探索游戏开发的基本方面，以及如何在 C# 中处理这些内容来开发视频游戏。\n\n许多人认为，编写视频游戏是学习编程的最佳方式之一。游戏将教你许多与整体编程相关的知识。你会在遇到通过其他方式无法获得的概念，它会扩展你的思维和逻辑推理能力。\n\
  \n2004 年，微软发布了一个名为 XNA 的游戏引擎。像《泰拉世界》这样的热门游戏就是使用该引擎开发的。XNA 现在已经过时了。它被集成到另一个名为 MonoGame\
  \ 的引擎中，MonoGame 更流行，并允许程序员进行跨平台开发。XNA 只允许你为微软平台开发游戏。而 MonoGame 已为 Xbox、PlayStation、Apple\
  \ iPhone 和 Google Android 构建过游戏。\n\nMonoGame 是免费且开源的。你可以下载它并修改代码，这让你对软件拥有更大的自主权。你可以在网上找到\
  \ MonoGame。网上有很多关于 MonoGame 的教程。在本章中，我们将深入解释核心概念，以便你更容易跟上任何教程。\n\n### 内容流水线 (Content\
  \ Pipeline)\n\n所有游戏都需要内容。内容流水线是你用来向游戏提供内容的方法。MonoGame 内容流水线与 Visual Studio 并行运行，为你提供了一种创建和导入内容的简单方法。例如，如果你需要创建一个字体，你需要在你的内容流水线中创建一个新的\
  \ `SpriteFont`。如果你需要导入角色艺术，也将使用内容流水线来完成。\n\n### MonoGame 结构\n\nMonoGame 项目在自动创建的主类中有几个方法。你会在其中找到\
  \ `Initialize`、`LoadContent` 和 `UnloadContent`。了解它们是如何工作的至关重要。\n\n所有这些类都是保护方法（protected）。这意味着你可以通过从\
  \ `Game` 类创建的新类来重写它们。你可以从新创建的 `Game` 类中调用 `LoadContent` 和 `UnloadContent`。这是合理的，因为丢弃特定的游戏资产以执行对你的项目更合适的操作可能是很有用的。例如，如果一个敌人死亡且这是它在游戏中最后一次出现，你就可以使用重写的\
  \ `UnloadContent` 来卸载该资产，从而提高性能。\n\n默认类对于理解非常重要，我们将在下文中探索它们。\n\n`Draw()` 用于在屏幕上绘制帧。这用于确定绘制逻辑。在某些情况下，你需要绘制一个派生自保护方法并定义在相关类规范中的独立函数。然而，了解它在游戏语文中如何运作很重要。\n\
  \n`Initialize()` 初始化你的内容。它在 `Game` 和 `GraphicsDevice` 对象创建之后、`LoadContent` 方法调用之前调用。你使用它来初始化游戏对象等。如果你想在游戏开始后初始化某些内容，也可以从派生类调用它。\n\
  \n`LoadContent()` 加载所有的游戏资源。这些是你的 `SpriteFonts`、游戏精灵等。我们稍后会详细讨论。\n\n`UnloadContent()`\
  \ 卸载所有的游戏资源。可以在任何时间调用，例如当你不再需要特定的精灵，正如我们之前讨论的那样。该方法可以在 `Game` 类或其派生类中调用。在处理较大的游戏时，了解这一点尤为重要。\n\
  \n`Update()` 更新你的游戏。此方法持续运行并包含游戏逻辑。这包括人工智能、单元碰撞等。它包含了你游戏中经常发生的任何内容。这是一个非常重要的部分。\n\
  \n所有这些都是在创建 `Game` 类的新实例时创建的五个主要方法。\n\n\n\n\n\n# 文本\n\n纹理可以通过内容流水线导入。然后，可以使用适当的方法将其导入到\
  \ `LoadContent` 中。这是在使用 `Initialize` 方法进行初始化后完成的。\n\n下面初始化了一个 2D 精灵（sprite）：\n\n\
  ```\nprivate Texture2D myTexture;\n```\n\n为了绘制你所有的纹理，必须创建一个 `SpriteBatch` 对象，因此应该尽早创建它。通常情况下，当你开始创建游戏项目时，标准模板已经为你创建了一个\
  \ `SpriteBatch`。\n\n你会在 `LoadContent` 方法中编写以下代码：\n\n```\nmyTexture = Content.Load<Texture2D>(\"\
  textureName\");\n```\n\n完成后，你在 `Draw()` 方法中绘制该精灵。\n\n你像这样开始绘图过程：\n\n```\nspriteBatch.Begin();\n\
  ```\n\n然后你绘制精灵：\n\n```\nspriteBatch.Draw(myTexture, new Vector2(0, 0), Color.White);\n\
  ```\n\n一个新的 `Vector2` 为你提供了绘制精灵时所需的 `x` 和 `y` 坐标。绘制从精灵的左上角开始。向右和向下移动的数字越大；向左向上移动的数字越小。\n\
  \n`Color.White` 为你的纹理提供了一个基础色。你的精灵还加载了默认颜色，正如你所指定的样的。如果没有它，你的精灵将会有不同的颜色。\n\n`spriteBatch`\
  \ 过程这样结束：\n\n```\nspriteBatch.End();\n```\n\n你可以运行游戏来查看精灵是否加载正确。它应该加载在你的默认 `Cornflower\
  \ Blue`（矢尾蓝）背景之上。如果成功了，恭喜你！你现在理解了如何将图像加载到游戏中。这是一项非常有用的技能。\n\n## 从键盘和鼠标获取信息\n\n我们将查看键盘和鼠标输入是如何工作的。MonoGame\
  \ 支持各种输入设备，如游戏手柄和触摸屏，但对于我们的目的来说，如果使用你已经获得访问权限的工具会简单得多。这是非常好的切入点之一。\n\nXNA 和 MonoGame\
  \ 简化了输入操作。输入是基于给定外设的状态：键盘、鼠标和游戏手柄。这些逻辑位于初始化后的 `update` 函数中。假设本部分的所有内容发生在 `Update`\
  \ 函数中。\n\n要操作键盘，你需要创建一个 `keyboard state`（键盘状态）并从键盘获取信息。因为 `Update` 方法会持续运行，所以信息将不断被收集。\n\
  \n你需要创建一个 `KeyboardState` 对象。你可以给它起任何名字，但为了获取当前状态，你需要使用 `Keyboard` 类的 `Get.State`\
  \ 方法。\n\n```\nKeyboardState state = Keyboard.GetState();\n```\n\n以下是检查某个按键是否被按下的方法。假设每个精灵都存储了一个集成在\
  \ 2D 向量中的 `X` 和 `Y` 坐标，如下所示：\n\n```\nVector2 spritePosition = Vector2.Zero;\n```\n\
  \n精灵的位置将使用 `Draw()` 进行绘制。它的位置将通过 `update()` 方法更新。如果我们想在按下键时将精灵移动到相应的位置，我们就会编写 `isKeyDown`\
  \ 检查。当 `Key` 被按下时，位置就会改变。按键存储在 `Keys` 命名空间的枚举中，因此不需要担心映射问题。\n\n我们会在 `Update` 方法中放入以下逻辑：\n\
  \n```\nif (state.IsKeyDown(Keys.W))\n    spritePosition.Y -= 5;\n\nif (state.IsKeyDown(Keys.A))\n\
  \    spritePosition.Y += 5;\n\nif (state.IsKeyDown(Keys.S))\n    spritePosition.X\
  \ -= 5;\n\nif (state.IsKeyDown(Keys.D))\n    spritePosition.X += 5;\n```\n\n在这个示例中，`A`\
  \ 让精灵向左移动，`W` 让它向上移动，`S` 让它向下移动，`D` 让它右移动。因为 `Update()` 方法一直在运行，这些条件会被不断检查，这意味着游戏会在按下按键时立即做出响应。我们可以实现一个\
  \ `Escape` 检查，在按下时关闭游戏。\n\n```\nif (state.IsKeyDown(Keys.Escape))\n    Exit();\n\
  ```\n\n自己进行调试和测试。运行它，看看你导入的所有按键和纹理是否按预期移动。\n\n让我们来看看如何处理来自鼠标的输入。它与键盘输入有相似之处，因为一切都基于鼠标当前的状态。移除键盘逻辑并替换为以下代码。\n\
  \n```\nMouseState state = Mouse.GetState();\n```\n\n绘制你精灵的位置，通过将其绘制到向量 `SpritePostion`\
  \ 来让它随鼠标移动。使用鼠标状态返回的向量来移动它：\n\n```\nspritePosition.X = state.X;\nspritePosition.Y\
  \ = state.Y;\n```\n\n它们现在将相互对应。当你移动鼠标时，精灵也应该移动。你自己来测试并调试程序。\n\n这对于你开始学习输入已经足够了。现在你看到了它们在基础层面上是如何工作的。这些知识可以很容易扩展到其他输入设备，如游戏手柄。\n\
  \n## 基本单元碰撞\n\n单元碰撞是游戏编程中最重要的功能之一。游戏中的一切内容都以纹理的形式呈现。甚至游戏菜单也是纹理。如果你想检查诸如鼠标悬停之类的事件，必须使用单元碰撞。\n\
  \n单元碰撞有许多形式。简化的形式被称为边界盒碰撞（bounding box collision）。这是我们将关注的。边界盒是基于矩形的。单元碰撞有许多形式，记住，是基于宽度和高度。如果矩形与另一个相交，就可以得出它们正在碰撞。XNA\
  \ 中的矩形内置了碰撞属性，这意味着我们不需要担心它。这是最不消耗资源的碰撞方式，并不总是最好的。对于我们的目的，我们将介绍碰撞的基础。处理碰撞的第一步是定义两个实体的矩形：\n\
  \n```\nRectangle(X_position, Y_position, Width, Height);\n```\n\n你可以创建：\n\n```\n\
  Rectangle playerRect = new Rectangle(playerPosition.X, playerPosition.Y, playerTexture.Width,\
  \ playerTexture.Height);\n```\n\n并对对手同样操作：\n\n```\nRectangle enemyRect = new Rectangle(enemyPosition.X,\
  \ enemyPosition.Y, enemyTexture.Width, enemyTexture.Height);\n```\n\n然后编写碰撞的 if\
  \ 语句：\n\n```\nif (playerRect.collides(enemyRect)) {\n    // 碰撞逻辑位于其中\n}\n```\n\n\
  这背后的逻辑非常简单。你不会遇到问题。你需要亲自动实践来明白我的意思。随着你的进步，它会变得有点困难，但你练习得越多，就会越好。\n\n## 人工智能\n\n\
  游戏中的人工智能令人印象深刻。在使用它之前，我们将简单讨论一下。\n\n假设你正在制作一种让游戏实体跟随玩家的人工智能系统。有许多方法可以实现。这取决于路径规划，即寻找两点之间的最短路径。它对于游戏和许多其他应用都很重要。\n\
  \n路径规划有不同的形式。`A*` 方法和 `MaxDxDy` 是最流行的。`A*` 方法不如 `MaxDxDy` 准确。`MaxDxDy` 因高精确度而受欢迎，但会消耗大量的系统资源。游戏已经对我们的系统提出了很大要求，因此我们将关注更简单、更节省资源的\
  \ `A*` 方法。保留 `A*` 方法的其他原因是它是简单且对初学者友好的，它也是最常见的路径规划算法。\n\n\n\n\n\n`A*` 是一种完备算法，这意味着只要问题符合其应用场景，它总能找到解决方案。\n\
  \n路径寻找算法基于地图上充满了节点的假设。因此，最好在俯视视角的瓦格游戏中练习它们，因为在尝试用于更复杂的应用之前，这样可以让你更容易地看到算法是如何运作的。\n\
  \n`A*` 算法搜索成本最低的路径；成本由到终点的距离、时间和其他因素定义。\n\n目标是最小化该值：\n\nf(n) = g(n) + h(n)\n\n`n`\
  \ 可以定义为路径上的一个节点——最后一个被选中的节点——而 `g(n)` 是从程序起始节点到给定 `n` 的当前累计支出，`h(n)` 则是一种启发式方法，对当前节点到终点的支出提供可靠的估计。\n\
  \n算法通过循环，根据上一个节点和当前节点来最小化支出，以确定下一个最佳节点。比较节点的 `f(n)`，并取下一个与上一个 `f(n)` 的节点。非节点、障碍物和复杂地形等不被视为可行。\n\
  \n你可以通过创建一个瓦格地图来实现该算法，其中你的精灵必须到达地图上的另一个终点。你甚至可以通过将终点文件放在另一个位置来测试不同的路径寻找算法。\n\n应用启发式方法有两种：欧几里得法或曼哈顿法。\n\
  \n最简单的是曼哈顿法，但它没有给出最佳估计。它的数学复杂性也最低，因此消耗资源较少。\n\n曼哈顿距离可以这样应用：\n\n`| destination.X\
  \ - node.X | + |destination.Y - node.Y |`\n\n欧几里得距离可以这样应用：\n\n```\nsqrt( (destination.X\
  \ - node.X)2 + (destination.Y - node.Y)2 )\n```\n\n它们都会为任何给定的节点 `n` 提供 `h(n)`。这是你可以在游戏中实现的最简单的人工智能。世界上还有更多算法可以实现更多功能；我们选择这种是因为因为它更容易理解。\n\
  \n这些都是最基础的内容。你现在已经有了坚实的理解，可以继续学习其他游戏开发的其他概念。然后你就可以开始构建自己的游戏了。游戏开发将迅速提高你的编程能力和推理能力。没有理由不尝试一下。在编程中，没有任何时间是被浪费的；每一都有意义。此外，你还可以制作你一直想做的游戏。\n\
  \n# 结论\n\n你的下一步是运用你所学的一切。为了提高水平，请挑战自己。编程挑战是提高技能的好好方法。如果你有想要构建的东西，去看看是否其他人做过同样的事情，并学习他们是如何做的。始终尽可能多学习编程方面的知识，不要害怕实验或提问。\n\
  \n我不会骗你；编程并不容易。对你来说有一段漫长而艰难的旅程。如果你选择成为一名程序员，你就必须接受自己永远无法了解全部，并且对不断学习保持开放。这就是为什么我决定教你底层概念和方法。这仅仅是基础，是一个工具箱，你将对其进行磨练、成长并学会更好地使用。你已经准备好了。\n\
  \n会有某些时候，你想把头撞在桌子上并放弃。冒充者症在技术领域是真实的；每个人都觉得自己像个骗子，但那是因为编程是一个广大的领域，有太多需要学习的东西了。唯一重要的是要有能力在问题发生时修复它们，并构建你被要求的东西。你会发现，大多数时候你必须制定计划或进行研究。极少的情况下你会直接知道做什么。\n\
  \n你也可以尝试查看开源项目，或继续阅读以提高自己。你在这里获得了一个良好的基础，你可以将其扩展到其他 C 风格的编程语言。\n\n# References\n\
