  }\n```\n\n正如你所看到的，索引器允许我们以类似于数组的方式控制子项集合。我们需要弄清楚的是如何配置我们的 `CarCollection` 类来利用这一功能。当你考虑到\
  \ C# 属性定义中的索引器类型时，我们应该如下所示修改 `CartCollection` 类：\n\n```cs\n// 在类的定义中引入索引器\npublic\
