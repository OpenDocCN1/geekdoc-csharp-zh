  \ `Add()` 方法添加任意数量的整数。列表允许我们在它们上使用许多方法，如 `Contains`、`Remove`、`Count` 等。\n\n以下是上述示例的输出：\n\
  \nNumber 11 in the house!\nNumber 22 in the house!\nNumber 33 in the house!\n\n\
  这之所以有效，是因为我们有 `myRows`，它存储了 `int` 类型的数据。我们使用 `Add` 方法添加整数，并使用 `foreach` 循环打印这些整数的值。\n\
  \n## 泛型方法\n\n泛型方法和类使我们在跨数据类型的各种情况下为我们提供了高重用用性。泛型方法的神奇之处在于，它们可以在包含它们的类不是泛型的空间中使用，或者类具有未定义的参数中使用。泛型方法始终遵循此模式：`method\
  \ name (type param)`。让我们来看下面的。\n\n示例 2：\n\n```csharp\nnamespace MySampleApplication\n\
  {\n    public static class MathExp\n    {\n        public static T Max<T>(T first,\
  \ params T[] values) where T : IComparable\n        {\n            T max = first;\n\
  \            foreach (T item in values)\n            {\n                if (item.CompareTo(max)\
  \ > 0)\n                {\n                    max = item;\n                }\n\
  \            }\n            return max;\n        }\n        public static T Min<T>(T\
  \ first, params T[] values) where T : IComparable\n        {\n            T mini\
  \ = first;\n            foreach (T item in values)\n            {\n            \
  \    if (item.CompareTo(mini) < 0)\n                {\n                    mini\
  \ = item;\n                }\n            }\n            return mini;\n        }\n\
  \    }\n}\n```\n\n示例类 `MathExp` 有两个泛型方法：`Min<T>` 和 `Max<T>`。这些函数的功能非常直接。`Min<T>`\
  \ 查找并返回列表中的最小值。`Max<T>` 查找列表中的最大值。`<T>` 是任何数据类型（如 `int`、字符串等）的占位符。这里是这两个方法的示例：\n\
  \n```csharp\nConsole.WriteLine(MathExp.Max<int>(63, 80, 700));\nConsole.WriteLine(MathExp.Max<string>(\"\
  Almonds\", \"Walnuts\"));\n```\n\n输出将是：\n700\nWalnuts\n\n在示例中，如果我们没有在列表中指定数据类型，C#\
  \ 编译器仍然能够运行该方法，因为它可以找出列表中包含什么数据类型。这被称为类型接口。为了看到它的作用，我们必须尝试代码，如下所示：\n\n```csharp\n\
  Console.WriteLine(MathExp.Max<int>(63, 80, 700));\nConsole.WriteLine(MathExp.Max<string>(\"\
  Almonds\", \"Walnuts\"));\n``` 输出将是：\n700\nWalnuts\n\n# 第 9 章 垃圾回收\n\n类也可以是泛型的。泛型类的语法声明如下所示。\n\
  \n```csharp\npublic class classname<T>\n```\n\n在这段代码中，`classname` 是类的名称。让我们来看一个泛型类的示例。\n\
  \n示例：下方的程序展示了使用泛型类的方法。\n\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
  \nnamespace Demo\n{\n    // 泛型类\n    public class GenericSet<T>\n    {\n       \
  \ private T[] array;\n        public GenericSet(int size)\n        {\n         \
  \   array = new T[size + 1];\n        }\n        public T getItem(int index)\n \
  \       {\n            return array[index];\n        }\n        public void setItem(int\
  \ index, T value)\n        {\n            array[index] = value;\n        }\n   \
  \ }\n    class Program\n    {\n        // 主函数\n        static void Main(string[]\
  \ args)\n        {\n            GenericSet<int> gn=new GenericSet<int>(2);\n   \
  \         gn.setItem(1,1);\n            gn.setItem(2,2);\n            Console.WriteLine(\"\
  Item number one is \" + gn.getItem(1));\n            Console.WriteLine(\"Item number\
  \ two \" + gn.getItem(2));\n            Console.Read();\n        }\n    }\n}\n```\n\
  \n\n\n\n* 它也可以通过 `GC.Collect()` 方法被触发并专门调用。这种情况很少见，因为 `GC` 始终处于激活状态，并在需要时执行操作。\n\
  \n# 什么是托管/非托管对象或资源？\n\n简而言之：\n\n* 任何在 `CLR` 范围内创建、管理和运行的对象都是托管对象。如果它属于纯净的 `.Net`\
  \ 代码、由运行时管理，并且在 `.NET` 范围内，那么它就是托管的。因此，`.NET` 框架内的任何类都应视为托管对象。\n* 任何不被 `CLR` 管理的项目都是在\
  \ `.NET` 库外部创建的，并且不属于托管对象。这些包括 COM 对象、连接对象、互操作对象（interop objects）以及所有的第三方库对象，即使它们在\
  \ `.NET` 框架内被引用，也是如此。\n\n## 清理所有非托管资源\n\n`GC` 无法清理非托管对象。当任务完成时，显式地释放它们是程序员的责任。非托管对象隐藏在操作系统资源周围，例如数据库连接、文件流、类句柄、指针、注册表等。`GC`\
  \ 可以跟踪托管和非托管资源的生命周期，但移除非托管对象的责任在于程序员。\n\n这里是你可以实现此点的几种方法：\n\n* 实现 `Dispose` 方法和\
  \ `IDisposable` 接口\n* 通过“`using”代码块\n\n你可以通过两种方式实现 `Dispose` 方法：\n\n* 使用 `SafeHandle`\
  \ 类，这是一个包含 `IDisposable` 接口和 `CriticalFinalizerObject` 的内置抽象类。你需要实现这两者。\n* 通过重写\
  \ `Object.Finalize` 方法，在对象销毁之前清理该对象使用的非托管资源。\n\n让我们来看允许我们此操作的代码：\n\n### 'using'\
  \ 语句\n\n`using` 语句确保对象被移除。如果对象超出了范围，就会调用 `Dispose` 方法。它的作用与 `Try` 相同。我将通过创建一个实现\
  \ `IDisposable` 的类来向你展示它的工作原理。`using` 语句无论如何调用 `Dispose`：\n\n```cs\nclass testClass\
  \ : IDisposable\n{\n    public void Dispose()\n    {\n        // 在此处释放对象\n     \
  \   // 清理资源\n        Console.WriteLine(00);\n    }\n}\n\n// 调用类\nclass Program\n\
  {\n    static void Main()\n    {\n        // 使用实现了 Dispose 的类配合 using 语句。\n    \
  \    using (testClass objClass = new testClass())\n        {\n            Console.WriteLine(01);\n\
  \        }\n        Console.WriteLine(02);\n    }\n}\n\n// 输出\n01\n00\n02\n\n//\
  \ 它与下面的 TRY...Finally 代码完全相同\n\n```cs\n{\n    clsDispose_Fin objClass = new clsDispose_Fin();\n\
  \    try\n    {\n        // 代码写在这里 \n    }\n    finally\n    {\n        if (objClass\
  \ != null)\n            ((IDisposable)objClass).Dispose();\n    }\n}\n```\n\n在这样的设置下，一旦打印了\
  \ `01`，`using` 代码块就会调用 `Dispose` 方法，然后执行 `using` 块之后的语句。\n\n## 快速入门\n\n* 面向对象编程（或\
  \ `OOP`）是一种编写反映真实世界对象的编程方式。\n* `C#` 类描述了一类对象执行的功能、它将包含的数据类型、函数和用途。\n* 创建新对象就像 `Random\
  \ random = new Random()` 一样简单。这将创建一个用于生成随机数的 `Random` 对象。\n* 在 `C#` 中通常不需要析构函数，因为垃圾回收（`Garbage\
  \ Collection`）在对象不再使用时会释放它。\n* 栈（Stack）和堆（Heap）帮助管理内存。\n* 垃圾回收器（`Garbage Collector`）分配和释放内存。\n\
  * `GC` 管理堆（`Heap`）——这是一个用于存储对象的内存块。\n* `GC` 管理堆。\n* 托管对象。\n* `GC` 管理托管对象。\n* 托管和非托管资源。\n\
  \n\n\n然后你将创建如下的表达式树：\n\n```cs\nExpression<Func<int, int, int>> expression = (a,b)\
  \ => a + b;\n```\n\nLambda 表达式现在被转换为表达式树，它看起来像这样：“Expression<X>”。你将无法执行标识符 `expression`，因为现在它被视为数据结构。\n\
  \n在 Visual Studio (IDE) 中，你可以使用 `ExpressionTreeVisualizer` 来查看 `expression` 语句的表达式树。\n\
  \n![00001.jpeg](img/00251.jpeg)\n\n上面的图向我们展示了 TreeView 控件中的 Lambda 表达式及其各个组成部分。\n\
  \n`Expression<x>` 类包含四个属性：\n\n* `Body`\n* `Parameters`\n* `NodeType`\n* `Type`\n\
  \n当我们折叠树结构时，这些属性是清晰可见的，如下所示。\n\n![00002.jpeg](img/00252.jpeg)\n\n```cs\nBinaryExpression\
  \ body = (BinaryExpression)expression.Body;\n\nParameterExpression left = (ParameterExpression)body.Left;\n\
  \nParameterExpression right = (ParameterExpression)body.Right;\n\nConsole.WriteLine(expression.Body);\n\
  \nConsole.WriteLine‘ 表达式的左部分: ‘ +\n‘{0}{4} 节点类型: {1}{4} 右部分: {2}{4} 的类型: {3}{4}’,\n\
  left.Name, body.NodeType, right.Name, body.Type, Environment.NewLine);\n```\n\n\
  上面的代码帮助我们探索表达式树。我们首先声明了 `BinaryExpressions` 类型的 `body` 变量。它持有表达式的主体，即 `(a+b)`。我们通过\
  \ `(ParameterExpression)body.Left` 访问左侧参数，它是 `parameterExpression` 类型的 `left` 变量。这就是变量\
  \ `a`。然后我们在 `parameterExpression` 类型的 `right` 变量中使用 `(ParameterExpression)body.Right`\
  \ 来访问变量 `b`。最后，我们使用内置方法在控制台中打印表达式的主体、它的 `NodeType`、左侧和右侧以及表达式类型。\n\n## 练习\n\n###\
  \ 任务 1：\n\n编写一个 Lambda 表达式，计算此序列（31, 23, 64, 40, 85, 55, 50 和 99）中大于 57 的分数总数。\n\
  \n#### 解决方案\n\n```cs\nclass SampleLambda\n{\n    static void Main()\n    {\n   \
