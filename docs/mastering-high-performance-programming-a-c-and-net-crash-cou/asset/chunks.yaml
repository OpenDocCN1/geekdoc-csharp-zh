    \ 方法是构造函数，在创建类实例时被调用。\n- `self.initUI` 方法初始化 UI 元素和窗口属性。\n- 创建了一个 `QLabel` 来显示文本“Hello,\
    \ Qt World!”。\n- 创建了一个 `QVBoxLayout` 用于管理组件的垂直排列。\n- 将标签添加到布局中。\n- 将该布局设置为主窗口的布局。\n\
    - 设置了窗口标题和几何形状（位置和大小）。\n\n## 3. 实例化应用程序和主窗口\n\n```python\nif __name__ == \"__main__\"\
