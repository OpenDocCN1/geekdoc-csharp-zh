    ## Guidelines


    - **Use Descriptive Names**: Employ clear and concise names for folders and subdirectories.
    This improves understanding and navigability.

    - **Maintain Consistency**: Adhere to the chosen structure throughout your project.
    This ensures a uniform and well-organized codebase.

    - **Leverage Qt Creator (optional)**: `Qt Creator` offers project templates that
    provide a basic directory structure, saving you time during initial setup.


    Example Structure:


    ```

    project_name/

    |- src/

    |   |- main.cpp

    |   |- my_class.cpp

    |   |- my_class.h

    |- include/

