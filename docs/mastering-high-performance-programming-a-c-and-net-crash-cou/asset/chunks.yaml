    ## 指南


    - **使用描述性名称**：为文件夹和子目录使用清晰、简洁的名称。这可以提高理解性和导航性。

    - **保持一致性**：在整个项目中遵循所选的结构。这确保了代码库的统一和有序。

    - **利用 Qt Creator（可选）**：`Qt Creator` 提供了项目模板，提供基础的目录结构，帮助您在初始化期间节省时间。


    示例结构：


    ```

    project_name/

    |- src/

    |   |- main.cpp

    |   |- my_class.cpp

    |   |- my_class.h

    |- include/

    |   |- my_project_header.h

    |- ui/ (可选)

    |   |- mainwindow.ui

    |- resources/

    |   |- icon.png

    |   |- data.txt

    |- tests/ (可选)

    |   |- my_class_test.cpp

    |- docs/ (可选)

    |   |- README.md

    ```


    记住：这是一份通用指南。请根据你项目的特定需求调整结构。随着经验的积累，你可能会进一步自定义目录结构，以适应具有许多子组件的复杂项目。


    通过遵循这些原则并根据你的特定需求进行定制，你将建立一个能够简化开发、促进协作并确保你的 Qt 长期健康的项目目录。


    # 第 3 章：面向 Python 开发者的 Qt 基础


    ## 桥接：面向 Python 开发者的 Qt 基础


    Python 因其可读性深受喜爱，是处理各种任务的优秀语言。但在构建功能丰富的图形用户界面 (GUI) 时，`Qt` 成为了一个强大的伴侣。本指南作为一个桥梁，为
    Python 开发者提供必要的 Qt 基础知识，开启他们的 GUI 开发之旅。


    ### 内置库之外的世界


    虽然 Python 提供了如 `Tkinter` 和 `wxPython` 等内置库，但 `Qt` 在多个方面都超越了它们：


    - **丰富的功能 set**：`Qt` 拥有庞大的预制小部件和功能库，允许你创建与原生应用媲美的全功能 GUI。想象一下构建复杂的布局、集成多媒体元素或实现复杂的交互——`Qt`
    赋予你实现这一切。

    - **跨平台能力**：编写一次代码，即可无缝部署在 Windows、macOS 和 Linux 上。这种“编写一次，随处运行”(WORA) 的哲学简化了开发，并消除了为每个部署目标编写特定平台代码的需求。`Qt`
    底层的 C++ 核心确保了跨不同系统的兼容性。

    - ** **原生外观和感受**：是否遇到过在特定操作系统上感觉格格不入的 Python GUI？`Qt` 消除了这个问题。它利用每个平台的原生外观和感受，确保你的应用程序与用户环境无缝集成。这增强了用户体验，并避免了外国界面带来的突兀感。


    ### 拥抱 Python 版 Qt


    以下是 `Qt` 如何与 Python 集成，让 Python 开发者能够上手：


    - **Qt for Python 绑定**：这些绑定充当桥梁，允许你在 Python 代码中调用 `Qt` 的 C++ 功能。这消除了直接学习 `C++`
    的需求，并让你能够在 Python 环境中利用 `Qt` 的力量。

    - **Shiboken**：一种流行的工具，用于从 `Qt` 的 C++ 类生成 Python 绑定。它简化了从 Python 与 `Qt` 功能交互的过程。


    ### 开始使用 Qt for Python


    1. **下载并安装**：访问 Qt 官方网站 (`https://download.qt.io/`) 并下载与你的 Python 安装版本兼容的 Qt 版本。安装程序通常包含用于生成
    Python 绑定的 `Shiboken`。

    2. **选择开发环境**：流行的选项包括带有 `Qt` 插件的 `PyCharm`，或者 Python IDE `Visual Studio Code`
    结合 `Qt Designer` 插件。

    3. **探索示例和教程**：`Qt` 提供了丰富的官方和社区创建的示例与教程，专为 Python 开发者设计。这些资源提供了实践经验，并展示了 Qt for
    Python 的能力。


    ### Python 开发者的核心 Qt 概念


    虽然 `Qt` 提供了巨大的生态系统，但掌握这些基础概念至关重要：


    - **信号与槽 (Signals and Slots)**：UI 元素与应用程序逻辑之间通信的核心机制。当发生某些事件时（例如点击按钮），小部件会发射信号，槽（你
    Python 代码中的函数）可以连接以接收这些信号并做出相应。

    - **小部件与布局 (Widgets and Layouts)**：`Qt` 提供了各种预制小部件，如按钮、菜单和文本框。利用布局（如 `QHBoxLayout`
    或 `QVBoxLayout`）在 UI 中组织和定位这些小部件。

    - **属性 (Properties)**：大多数小部件都有各种控制其外观和行为的属性（例如尺寸、颜色、字体）。你可以从 Python 代码中修改这些属性以自定义
    UI 元素。


    ### 结论


    通过理解这些基础知识并利用 Qt for Python 绑定的力量，你作为一名 Python 开发者，可以开始创作惊艳且功能丰富的 GUI。记住，旅程始于足下。所以，深入探索
    Qt for Python 的世界，挖掘它的能力，见证它为你的 Python 开发工作开启的潜力！


    # 使用常用小部件：按钮、标签、文本输入框等


    ## 构建基块大盛宴：掌握常用 Qt 小部件


    任何用户界面 (UI) 的基础都在于其小部件。`Qt` 作为一个强大的 GUI 开发框架，提供了丰富的预制小部件军库，它们是构建直观且交互式应用的基石。本指南将赋予你有效使用这些常用小部件的知识：


    ### 1. 按钮：多能的点击触发器


    - `QPushButton`：经典的按钮，理想用于用户交互。自定义它的文本、样式，并将其连接到槽以执行操作。

    - `QToolButton`：紧凑型按钮，通常用于工具栏快速访问功能。

    - `QCheckBox`：可以勾选或取消勾选的按钮，用于二选一。


    ### 2. 标签：信息伴侣


    - `QLabel`：在 UI 上显示静态文本。通过各种属性（如字体大小、颜色、对齐）对文本进行格式化。

    - `QLCDNumber`：数字格式显示数值，适用于读数或计数。


    ### 3. 文本输入框：让输入变得简单


    - `QLineEdit`：用于用户数据的单行文本输入框。实现验证（使用正则表达式）以确保用户符合格式。

    - `QPlainTextEdit`：多行文本输入框，适用于长文本或代码编辑。


    ### 4. 容器：整理混乱


    - `QWidget`：大多数小部件的基类，作为其他小部件的容器。使用布局（将在后续指南中介绍）在 `QWidget` 内安排小部件。

    - `QHBoxLayout`：从左到右水平排列小部件，适用于创建工具栏或按钮行。

    - `QVBoxLayout`：从上到下垂直排列小部件，适用于堆叠标签、输入框或其他 UI 元素。


    ### 5. 其他常用小部件


    - `QSlider`：允许用户在特定范围内选择值的图形控件。

    - `QComboBox`：下拉菜单，让用户从预定义的列表中进行选择。

    - `QListWidget`：显示多个项目的列表视图，通常用于选择或显示数据。


    ### 利用小部件属性


    大多数小部件都有各种控制其外观和行为的属性。探索与以下相关的属性：


    - **几何形状**：小部件的尺寸、位置以及最小/最大尺寸。

    - **外观**：字体、颜色、文本对齐和背景样式。

    - **文本内容**：对于和输入框，修改显示的文本或设置占位符。

    - **行为**：启用或禁用用户交互，默认将复选框勾选等。


