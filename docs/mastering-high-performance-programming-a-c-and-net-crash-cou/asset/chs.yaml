  \n# Qt 和 PyQt 术语表\n\n本术语表对你在使用 `Qt` 和 `PyQt` 进行应用开发时会遇到的常用术语进行了解释。\n\n### Qt 术语：\n\
  \n- `Qt`: 一个跨平台应用程序开发框架。它提供了一套用于构建用户界面、网络、图形等的完整 API。\n- `Widget`（小部件）：`Qt` 中用户界面的基础构建模块。部件代表按钮、标签、文本框等元素。\n\
  - `Layout Manager`（布局管理器）：一种在窗口或容器内安排和定位部件的机制。`Qt` 提供了各种布局管理器，如 `QHBoxLayout`（水平）和\
  \ `QVBoxLayout`（垂直）。\n- `Signal`（信号）：由 `Qt` 对象发出的事件（例如按钮点击），用于通知其他对象特定操作。\n- `Slot`（槽）：定义在应用程序代码中的函数，旨在接收和处理由\
  \ `Qt` 对象发出的信号。\n- `Signal & Slot Mechanism`（信号槽机制）：`Qt` 对象之间一种强大的通信方法，允许应用程序逻辑中实现松耦合和模块化。\n\
  - `UI`（用户界面）：用户在应用程序中与之交互的视觉布局和元素。`Qt` 提供了设计和构建用户界面的工具和功能。\n- `Designer`（Qt Designer）：`Qt`\
  \ 附带的视觉 UI 创建工具。它允许你通过拖放部件并定义其属性来设计 UI。\n- `MOC`（元对象编译器）：一种根据你的 `Qt` 类定义生成代码的工具。生成的代码通过启用信号与槽之间的连接来促进信号槽机制。\n\
  \n### PyQt 术语：\n\n- `PyQt`: `Qt` 框架的 Python 绑定。它允许你使用 Python 代码而不是 C++ 来开发 `Qt`\
  \ 应用程序。\n- `PyQt5/PySide2`: `Qt` 的不同流行绑定。`PyQt5` 绑定到 `Qt 5`，而 `PySide2` 绑定到一个略有不同的商业\
  \ `Qt` 版本。两者都为 Python 开发 `Qt` 提供了相似的功能。\n- `QtWidgets`: 一个 `PyQt` 模块，包含了构建用户界面的核心部件，如\
  \ `QPushButton`、`QLabel` 和 `QLineEdit`。\n- `QtCore`: 一个 `PyQt` 模块，提供事件处理、定时器和文件\
  \ I/O 等核心功能，对应用程序逻辑至关重要。\n- `QUiLoader`: 一个 `PyQt` 类，用于将由 `Qt Designer` 生成的 UI 文件（`.ui`）加载到你的\
  \ Python 代码中。\n\n### 额外术语：\n\n- `Cross-Platform`（跨平台）：使用 `Qt` 和 `PyQt` 构建的应用程序可以在各种操作系统（Windows、\
  \ macOS、Linux）上运行，只需少量代码更改。\n- `GUI`（图形用户界面）：利用窗口、按钮和菜单等图形元素进行交互的用户界面。\n- `API`（应用程序编程接口）：`Qt`\
  \ 提供的一系列函数和工具，开发者可以使用它们来构建应用程序。\n\n本术语表是理解 `Qt` 和 `PyQt` 术语的起点。随着你深入开发，你将遇到与高级功能和特定模块相关的更具体的术语。请随时咨询\
  \ `Qt` 和 `PyQt` 文档以获取更多详情！\n"
