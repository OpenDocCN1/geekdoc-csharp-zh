  \nC#通过称角色寄亲辈作为 base!语言内置词汇 base 赋权访问种子生发端口恰似蛋糕制作工序里的内芯成形预留酥油外面奶油涂抹地方留白尽管如此 Empty\
  \ 当前貌似仍存在细枝末节等待注入一股锦上添花装饰灵魂缘由陈述到此结束。 \n\n***\n深入分析：《 base 与建设机制》\n\n疑点此时闪现:“初次接触反而令人百思不解究竟执行期间计算机面临关键词时会引发何种连锁反应?”\n\
  \n\n\n\n\n**回答：** 当程序到达 `base` 部分时，它会运行父类中的构造函数。在这种情况下，因为 `FallingSprite` 继承了 `MovingSprite`，所以\
  \ `MovingSprite` 的构造函数会运行并设置 `MovingSprite` 的内容。\n\n**问题：** 在调用 `base(sprite: sprite,\
  \ xSpeed: 0, ySpeed: ySpeed)` 时，参数代表什么？\n\n**回答：** 这里，基类构造方法的调用（即创建 `FallingSprite`\
  \ 基础的 `MovingSprite`）接收了传入的 `sprite` 和 `ySpeed` 值。由于基类和父类构造函数中的参数名称相同，看起来似乎某些参数被传递给了它们自己，但实际上这些值是被传递给了父类的。\n\
  \n**问题：** 为什么发送给基类构造函数的 `xSpeed` 值被设置为 0？\n\n**回答：** 下落的精灵垂直向下掉落，因此它没有向左或向右的移动，而这正是\
  \ `xSpeed` 会提供的移动能力。`FallingSprite` 的构造函数告诉基类（`MovingSprite`）的构造函数 `xSpeed` 值为 0。\n\
  \n***\n\n你可以在任何可以使用 `MovingSprite` 的地方使用 `FallingSprite`。这是合理的，因为 `FallingSprite`\
  \ 继承了其父类的能力。它包含了 X 和 Y 速度值，以及一个可以调用来更新精灵状态的 `Update` 方法。\n\n`FallingSprite` 的构造函数必须将精灵放置在屏幕上某个随机的起始位置。它是通过为正在创建的精灵的左边缘和底部选择随机值来实现的。每个新精灵都被放置在屏幕上的不同位置，在游戏开始时产生一个随机的星场。\n\
  \n![Image](img/425fig01.jpg)\n\n***\n\n![Image](img/analysis.jpg) 代码分析：`FallingSprite`\
  \ 构造函数体\n\n**问题：** `spriteRand` 变量起什么作用？\n\n**回答：** 当精灵被构造时，`spriteRand` 变量用于在屏幕上为精灵选择一个随机位置作为起点。当精灵更新时，会再次使用随机数生成器——它会选择一个跨屏幕的随机位置让精灵重新出现。\n\
  \n我在这里使用的技术与我在 `Keep Up!` 游戏使用的技术非常相似，当时我们想要每次玩游戏时让球从屏幕顶部不同的 X 位置开始。它使用随机数生成器为精灵生成随机的\
  \ X 位置。\n\n**问题：** 为什么 `spriteRand` 变量是静态（static）的？\n\n**回答：** 记住 `static` 意味着“类的一部分，而不是实例的一部分”。换句话说，整个\
  \ `FallingSprite` 类只有一个 `spriteRand` 值供其使用。这实际上非常有道理。没有需要每个精灵都拥有自己的随机数生成器。所有精灵可以共享同一个。\n\
  \n***\n\n### 自定义 FallingSprite 行为\n\n现在 `FallingSprite` 已经掌握了所有所需信息，我们可以为下落的精灵创建一个自定义的\
  \ `Update` 行为。我们将为适用于下落精灵的精灵创建一个更具体（不那么抽象）的 `Update` 方法版本。这被称为对父类中的方法进行*覆盖*（或称重写，*overriding*）。\n\
  \n新的 `Update` 方法不会简单地让精灵在屏幕上移动；当精灵到达底部时，它还会拾起精灵并放回顶部。`Update` 方法将使用由 Snaps 库提供的\
  \ `GameViewportWidth` 和 `GameViewportHeight` 值。C# 允许覆盖方法调用父类中的方法（即那个只是移动精灵的 `Update`\
  \ 版本），我们的新方法将使用这种技术。\n\n![Image](img/426fig01.jpg)\n\n***\n\n![Image](img/analysis.jpg)\
  \ 代码分析：检查 `Update` 方法\n\n**问题：** `base.Update()` 方法调用执行了什么？\n\n**回答：** 调用被覆盖的方法通常是有用的。在这种情况下，`FallingSprite`\
  \ 中的 `Update` 方法可以调用 `MovingSprite` 中的 `Update` 方法来更新精灵位置，然后在执行此操作后添加自己的行为。\n\n\
  **问题：** 为什么方法要检查精灵的顶部是否超过了视口的高度？\n\n**回答：** 精灵的 `Top` 属性是精灵顶部线的 Y 坐标。随着我们向屏幕下方移动，Y\
  \ 值会增加。当精灵的顶部超过了视口的高度值时，这意味着精灵刚刚超出了视口的底部。此时，精灵不再可见，可以再次重新放置在屏幕顶部。\n\n**问题：** 为什么该方法在再次将其放置在顶部时，将精灵的底部设置为\
  \ 0？\n\n**回答：** 同样，这里这是因为屏幕顶部的 Y 坐标为 0。我们希望星星从屏幕边缘进入视野，这会将精灵放置在屏幕顶部正上方，准备向下进入视野。\n\
  \n***\n\n#### 允许方法被覆盖\n\n为了让覆盖能够工作，我们需要对 `MovingSprite` 父类进行细微的更改。我们必须将 `MovingSprite`\
  \ 类中的 `Update` 方法变为*虚*的（*virtual*）方法。\n\n![Image](img/427fig01.jpg)\n\n在方法声明前添加\
  \ `virtual` 关键字使得子类中的方法能够覆盖它。这正是我们想要的——我们想要一个会移动的精灵，但它必须以特定的方式移动，而我们在子类中创建了 `Update`\
  \ 行为。\n\n***\n\n![Image](img/analysis.jpg) 代码分析：虚方法\n\n继承似乎带来了许多新术语和一些问题。\n\n**问题：**\
  \ 方法变为虚方法会发生什么？\n\n**回答：** 对于方法的使用者来说，没有任何变化。工作方式完全相同。区别发生在程序运行并调用方法时。如果系统知道正在调用一个虚方法，它会检查是否有覆盖。\n\
  \n**问题：** 为什么不把所有方法都设为虚以获得最大的灵活性？\n\n**回答：** 你可以把所有方法都设为虚以便随时被覆盖。但有两个原因你可能不想这样做。首先，调用虚方法需要多一点时间，因为系统必须检查覆盖。其次，更重要的是，某些方法你永远不希望子类覆盖。例如，在一个\
  \ `Bank` 类中，你会确保某些方法（特别是涉及存款和取款的方法）不能被重写。我们不希望程序员对这些重要方法添加自己的行为。\n\n***\n\n如果你运行\
  \ **Ch14_02_SingleFallingStar** 中的示例程序，你会看到一颗星星掉落在屏幕上。当它到达屏幕底部时，它会被重新放在顶部。\n\n####\
  \ 创建移动的星场\n\n你的朋友、家人和其他潜在客户可能对只有一个星星在屏幕上移动的游戏并不那么感兴趣。他们希望看到至少有一百颗星星。事实证明这样做非常简单。我们只需要创建\
  \ 100 个下落的星并将它们放入列表：\n\n![Image](img/428fig01.jpg)\n\n一旦我们有了移动精灵的列表，就可以在游戏循环中列表进行动画处理。\n\
  \n![Image](img/429fig01.jpg)\n\n***\n\n![Image](img/analysis.jpg) 代码分析：移动精灵的列表\n\
  \n**问题：** 为什么我们使用 `MovingSprites` 列表而不是 `FallingSprites` 列表？\n\n\n\n\n\n**答案：**\
  \ 如果你理解了这个问题的答案，说明你已经在理解类层次结构和对象的道路上了。我们知道，子类可以做父类能做的所有事情，因为它继承了父类的所有行为和属性。这意味着对\
  \ `MovingSprite` 的引用也可以指向 `FallingSprite`，因为它们都能够像 `MovingSprite` 一样运行（尽管当在 `FallingSprite`\
  \ 上调用 `Update` 方法时，它执行的是该类型的 `Update` 方法，而不是 `MovingSprite` 的 `Update` 方法）。\n\n\
  接下来，我们将创建一个供玩家飞行的火箭精灵，然后创建一个会追逐玩家的追逐者外星人。这些精灵也将基于 `MovingSprite` 类，因此它们也可以被添加到精灵列表中并由游戏循环更新，但它们都将有自己特定的\
  \ `Update` 行为。\n\n**问题：** 为了处理 200 颗掉落星星，我需要添加多少代码？\n\n**答案：** 不需要。你只需要将 `for` 循环限制的值从\
  \ 100 改为 200 即可。这将使循环运行 200 次并生成 200 颗星星。\n\n* * *\n* * *\n\n![Image](img/happen.jpg)\
  \ 让事情发生：尽情享受粒子效果的乐趣\n\n移动星场是我们的第一个“粒子效果”，指的是由许多具有特定寿命和行为的小粒子创建的游戏元素。你可以将每颗星星想象成一个粒子，它在屏幕顶部创建，掉落到底部，然后在顶部重新创建。许多电脑游戏使用粒子效果来产生诸如火花喷射、烟雾甚至火焰等效果。粒子是带有特定行为创建的，运行该行为，然后重置以再次循环。如果你有足够大的自尊，甚至可以创建一个你自己脸的移动星场。\n\
  \n你还可以尝试实验所谓的“视差效果”。简单来说，当我们在移动时，离我们的物体看起来比远处的物体移动得更快。你可以使用视差效果来创建一个具有不同大小星星的星场，其中较大的星星移动得更快。这可以提供一种三维空间中真实的运动效果。\n\
  \n* * *\n\n### 基于 MovingSprite 创建火箭\n\n**图 14-2** 展示了我们在我们创建的星场背景下的火箭精灵。\n\n![Image](img/14fig02.jpg)\n\
  \n**图 14-2** 穿过星群的火箭。\n\n我们的玩家将使用 `RocketSprite` 对象来控制游戏。在《Keep Up!》中，我们有一个玩家可以左右移动的板子，但对于火箭，我们希望玩家能够在屏幕上到处移动它。该图显示了我们想要的效果。玩家可以使用手柄在火箭飞过星场时对其进行控制。\n\
  \n我们可以使用与制作掉落精灵时相同的序列来制作火箭。首先，我们需要确定火箭需要知道哪些信息。结果证明，火箭只需要移动所需的 X 和 Y 轴速度。\n\n![Image](img/431fig01.jpg)\n\
  \n这种模式与掉落的星星类似，但因为火箭可以上下和左右移动，我们需要为每个方向提供速度值。\n\n![Image](img/431fig02.jpg)\n\n\
  火箭的 `Update` 方法工作方式与《Keep Up!》中的板子相同。它使用 Snaps 框架提供的手柄方法来确定哪些手柄处于激活状态，然后相应地更新火箭精灵的位置。它还利用视口的宽度和高度来限制定火箭的位置，防止其移出视口。注意，前面的代码只显示了\
  \ Y 轴行为。火箭的 X 位置重复了相同的行为。\n\n* * *\n\n### 代码分析：你不必使用基方法\n\n**问题：** 在 `Rocket-Sprite`\
  \ 类的 `Update` 方法没有调用 `base.Update()`。这是一个错误吗？为什么 `RocketSprite` 不使用 `MovingSprite`\
  \ 的 `Update` 方法？\n\n**答案：** `MovingSprite` 是会移动的精灵，但这是一个相当泛的术语。`RocketSprite` 更专门，因为火箭的移动是由玩家输入控制的；精灵并不是一直移动。必须移动的精灵可以使用\
  \ `MovingSprite` 中的 `Update` 方法，并在此基础上添加自己的行为。然而，`RocketSprite` 应该只在玩家对手柄上选择相关方向时才移动。它无法使用\
  \ `MovingSprite Update` 方法提供的那种“全天候”移动。\n\n* * *\n\n一旦我们创建了 `RocketSprite`，剩下的工作就是将火箭添加到我们的游戏中。这些语句的顺序与我们添加移动星星时使用的顺序相同。程序必须创建\
  \ `ImageSprite`，将其添加到游戏，将火箭的大小设置为屏幕的合理比例，将其放置在正确的位置，然后使用它来创建 `RocketSprite` 实例。\n\
  \n点击此处查看代码\n\n```\nImageSprite rocketImage = new ImageSprite(\n    imageUrl: \"\
  ms-appx:///Images/SpaceRocket.png\");\n\nSnapsEngine.AddSpriteToGame(rocketImage);\n\
  \nrocketImage.ScaleSpriteWidth(SnapsEngine.GameViewportWidth / 15);\n\nrocketImage.CenterX\
  \ = SnapsEngine.GameViewportWidth / 2.0;\n\nrocketImage.CenterY = SnapsEngine.GameViewportHeight\
  \ / 2.0;\n\nRocketSprite rocket = new RocketSprite(sprite: rocketImage,\n    xSpeed:\
  \ 10, ySpeed: 10);\n\nsprites.Add(rocket);\n```\n\n`Ch14_04_FlyingRocket`\n\n###\
  \ 添加一些外星人\n\n你的弟弟要求有很多外星人精灵，并且游戏必须具有不同性格的外星人。他已经有了六个想法并正在构思更多。但你不确定。\n\n* * *\n\n\
  ![Image](img/common.jpg) 程序员要点：想法太多会让你退后，而不是前进\n\n\n\n\n考虑到我们想要不同类型的外星人，现在是深入思考类层次结构的好时机。通过与你弟弟的讨论，你发现他所有的外星人都有目标（它们试图摧毁的火箭），并且它们要么是死的，要么是死的。如果我们直接添加全套新的外星人精灵类，我们就必须为每种类型重复目标和状态值。此外，我们还需要为游戏中的每种外星人类型维护独立的列表。相反，我们可以创建一个\
  \ `AlienSprite` 类型，包含所有外星人都需要的信息和行为：\n\n![Image](img/433fig01.jpg)\n\n现在，我们所有的外星人类型都可以扩展\
  \ `AlienSprite` 类型，以添加它们所需的任何额外元素。如果我们识别出其他任何所有外星人都需要的属性，我们就可以将其添加到 `AlienSprite`\
  \ 类中，所有的子类也将将获得这些内容。例如，你之后可能决定每个外星人在被击杀时应该值特定的分值。这个属性可以添加到 `AlienSprite` 类中，这样任何基于\
  \ `AlienSprite` 的类现在都可以拥有分值。\n\n***\n\n![Image](img/common.jpg) 程序员观点：添加中间类型是一个非常棒的主意\n\
  \n在设计类型时，你经常会发现对 `AlienSprite` 这样的中间类型的需求。例如，在一个文档管理系统中，你可能有一个父类 `Document`，它被一个中间类\
  \ `Letter` 扩展，该类持有收件人的姓名和地址、发送日期等。在 `Letter` 之下，你可以拥有 `Order`、`Receipt`、`Statement`\
  \ 以及你的系统可能需要处理的其他类型的信件/文档。\n\n### 添加一个追逐的外星人\n\n我们将创建的第一个外星人类似于火箭。但当玩家选择移动方向时火箭会移动，而外星人一直在移动，它通过使用非常简单的算法来选择它的移动方向，如下：\n\
  \n- 如果火箭在我们上方，向上加速。\n- 如果火箭在我们下方，向下加速。\n- 如果火箭在我们右侧，向左加速。\n- 如果火箭在我们左侧，向右加速。\n\n\
  如果你不确定加速度意味着什么，以及加速度与速度之间的区别，那么让我们来看一些简单的物理知识。\n\n我们外星人的速度是它每次循环循环时移动的距离。每当游戏更新时，我们将这个速度值加到外星人的位置值上进行更新。速度随时间改变距离。如果我们开车并以每小时\
  \ 60 英里的速度行驶一小时，我们将行驶 60 英里。\n\n加速度是速度变化的速率。如果我们按下汽车的加速板，我们的汽车就会随着时间提速（速度随时间变化）。我们可以说我们的汽车每\
  \ 10 秒速度快 5 英里。这相当于“从 0 到 60 英里”的时间为 12 秒。\n\n我们通过给追逐外星人的速度增加一个加速度值，使其朝着目标的方向移动。你可以说我们在朝着火箭的方向“按下了加速板”。有趣的地方在于，加速度让玩家能够躲避外星人。\n\
  \n游戏在游戏循环期间更新时将使用这些加速度值和火箭的位置。还有一个让外星人减速的摩擦值。在每次循环中，我们将外星人的速度乘以摩擦值（小于 1），以稍微减缓运动。这就是我们将使用的\
  \ `Update` 方法。\n\n![Image](img/435fig01.jpg)\n\n外星人将通过在每次游戏循环更新精灵时向火箭方向加速来追逐火箭。加速度值和摩擦值的不同设置对精灵的行为有显著影响。例如，你可以制作一个缓慢向玩家漂移的外星人，或者一个攻击更快速的外星人。这些你可以无需任何编程工作即可添加的新类型外星人；你只需要设置不同的加速度和摩擦值。你可以花费许多快乐的来调整不同类型追逐精灵的行为并将它们添加到游戏中。当每个外星人被构造时，必须赋予它加速度和摩擦值，以控制它在目标周围屏幕移动的速度。这些值将存储在外星人内部，并用于控制它在游戏期间的行为。\n\
  \n这是 `ChasingAlien` 实例的构造函数。它存储了特定外星人将使用的加速度值。\n\n![Image](img/436fig01.jpg)\n\n\
  注意，构造函数还将父对象 `MovingSprite` 的速度设置为 0。这样做是因为当 `ChasingAlien` “醒来”时，它完全没有在移动。\n\n\
  ***\n\n![Image](img/common.jpg) 程序员观点：在游戏中尽可能根据需要使用物理学和人工智能\n\n追逐外星人的 `Update` 方法是我们游戏内部一个微型的“物理引擎”。真正的物理学家可能会对我们所做的简化感到非常沮丧，但这段代码很棒的地方在于它是有效的，而且运行得非常好。实际上不需要任何更精确的物理模拟，因为我们创建的东西创造了极佳的游戏体验。这里有一个重要的教训：从简单的东西开始，如果它有效，就停止。\n\
  \n这也是我们第一次在游戏中使用人工智能（AI）。游戏中的人工智能并没有特别之处。它只是让玩家认为游戏很聪明的代码。如果你玩这个游戏（你应该玩的），你真的认为外星人内部有一个小飞行员正操纵他的飞行器向你驶来。你甚至可以通过让他冲向你，然后在最后一刻躲开来欺骗对手。\n\
  \n***\n\n下面的代码显示了追逐外星人的构造。外星人的加速量和摩擦值是我通过测试得出的。我认为它们效果良好。精灵看起来像一只愤怒的蜜蜂一样追逐火箭。\n\n\
  点击此处查看代码\n\n```\nChasingAlien chaser = new ChasingAlien(sprite: alienImage,\ntarget:\
  \ rocket,\nxAcceleration: 0.3, yAcceleration: 0.3,\nfriction: 0.99, score: 100);\n\
  ```\nCh14_05_ChasingAlien\n\n***\n\n![Image](img/happen.jpg) 让某些事情发生：在游戏中调试物理效果\n\
  \n如果你查看追逐外星人的代码，你会发现它使用了 0.3 的加速度和 0.99 的摩擦值。你可能会发现改变这些值很有趣（刚开始不要太大），并看看外星人在追逐玩家时行为发生了什么变化。例如，如果你增大加速度值，外星人的追逐将更具侵略性。通过添加两个玩家需要躲避的外星人并为它们设置不同的物理参数，你可以创造出非常有趣的游戏玩法。\n\
  \n另一个有趣的添加是让一个外星人追逐另一个。我的追逐外星人追逐火箭，但你可以制作另一个跟随外星人的精灵。如果你在游戏中添加许多这样的外星人，就可以组成一条外星人蛇”。如果你让第一个外星人追逐玩家，它是有效的。\n\
  \n\n\n\n**3.** 为新的精灵类型创建一个构造函数，用以接收并存储这些信息。\n\n**4.** 决定精灵在更新时需要执行什么操作。\n\n**5.**\
  \ 在新精灵类型的 `Update` 方法中添加这些行为。\n\n**6.** 在游戏时创建该精灵，并在游戏开始时将其添加到游戏的精灵列表中。\n\n这是一个示例。`LineAlien`\
  \ 在屏幕的最大位置和最小位置之间缓慢地向左右移动：\n\n![Image](img/438fig01.jpg)![Image](img/438fig01a.jpg)\n\
  \n这段代码的妙之处在于它非常简洁。我们唯一从零开始创建的部分是 `Update` 方法。其他所有内容是从层次结构中更高的类继承而来的。\n\n单个 `LineAlien`\
  \ 本身并没有那么令人深刻，但我们可以使用 `for` 循环在屏幕上创建一排这样的外星，如下方的代码所示。图 14-3 显示了正在开发中的这行外星看起来是什么样的。它们左右移动的方式与另一个非常流行的视频游戏类似。\n\
  \n![Image](img/439fig01.jpg)![Image](img/14fig03.jpg)\n\n**图 14-3** 一排目标外星。\n\n\
  ### 设计类层次结构\n\n将像 `LineAlien` 这样的类添加到我们的游戏中是面向对象设计的基础。随着程序的开发，我们可以复用和自定义现有的程序元素。然而，在开始构建类之前，先有一个设计可能是最好的。图\
  \ 14-4 显示了我们一直在构建的游戏的设计。\n\n![Image](img/14fig04.jpg)\n\n**图 14-4** 游戏对象类图。\n\n\
  这被称为*类图*。它展示了游戏内对象的一种“族树”。父类位于图的顶部，子类位于其下方。`MovingSprite` 类是所有游戏对象的父类。它持有精灵的图像和位置。它下方的每个类都基于这些项目进行构建，并根据需要添加额外数据。\n\
  \n***\n\n![Image](img/analysis.jpg) 代码分析：查看类图\n\n**问题：** 哪个类具有的能力最少？\n\n**答案：**\
  \ 我们已经考虑过这个问题了。图顶部的类是能力最少的类，尽管这有点不直直觉，因为大多数显示组织的图会将最有权力的人（国王或老板）放在顶部，将权力较小的人放在下面。然而，能力随着你向下移动图而累积的方式，意味着行为范围最广的类将位于底部。\n\
  \n**问题：** 导弹如何知道它可以攻击谁？\n\n**答案：** 当你考虑程序将如何工作以及系统中的对象如何获取足够的信息来完成工作时，这些图非常有用。导弹包含一个它可以杀死的所有外星精灵列表，每当它更新时，它都会检查这个精灵列表，看看是否击中了其中任何一个。如果击中了某个精灵，它将调用该精灵的\
  \ `Kill` 方法将其杀死，并找出它得了多少分。然后它会增加发射它的火箭的分。\n\n**问题：** 为什么 `RocketSprite` 包含一个导弹列表？\n\
  \n**答案：** 随着游戏的进行，你被要求添加“强化”元素，允许玩家拥有多枚导弹。这意味着 `RocketSprite` 必须包含一个导弹列表，而不仅仅是一个。\n\
  \n**问题：** 我们如何处理不同类型的导弹？\n\n**答案：** 事实证明，实现这一点并不困难。就像我们有一个作为所有外星基础的 `AlienSprite`\
  \ 一样，我们可以拥有一个 `MissileSprite` 作为所有导弹的基础。\n\n***\n\n图 14-5 是我目前为止开发的游戏截图。屏幕上有两种外星——邪恶的紫色追逐外星和一排只在左右来回移动的绿色外星。屏幕上方还有一个蓝色的导弹，是玩家刚刚发射出去的（但没中）。你可以用它来制作任何你喜欢的太空射击游戏。\n\
  \n![Image](img/14fig05.jpg)\n\n**图 14-5** 太空中的太空火箭。\n\n***\n\n![Image](img/happen.jpg)\
  \ 让事情发生：制作一些你自己的游戏\n\n现在你已经知道向游戏添加新游戏对象是多么简单了，你可以轻松地添加具有不同行为的精灵。你可以制作一个只有在玩家靠近时才追逐玩家的精灵，或者一个当玩家靠太近时醒来并开始追逐玩家的精灵。你可以制作在游戏过程中改变大小的精灵，让它们逐渐占据屏幕，并随着时间的推移变得越来越难以躲避。你可以创建一个逃避玩家的胆小精灵。（在这种情况下，你可能会改变游戏规则，让游戏的目标是捕捉而不是躲避。）你可以制作在视野边缘弹跳的追逐精灵，或者从一侧传送到另一侧的精灵。你可以为精灵添加随机性，让它们有时追逐玩家。\n\
  \n***\n\n### 你学到的\n\n在这一章中，你学习了如何创建支撑游戏的对象。你通过创建一个包含所有对象所需的基础元素的父对象，然后创建扩展它并提供更具体、更抽象行为的子类来实现。你看到在这样的类层次结构中，扩展父类的子类实际上基于父实例，并且父实例在构造子类期间必须创建。你还看到在父类中定义为虚拟的方法可以在子类中重写。如果有用，子类还可以通过\
  \ `base` 关键字使用父类中的方法。\n\n**我必须在开始之前设计好所有的类层次结构吗？**\n\n\n\n\n如果你的程序需要处理大量相关项，你就需要一个类层次结构。例如，如果你正在创建一个从犯罪现场收集证据的工具，那么建立一个基于名为\
  \ `Evidence` 的父类的类层次结构将非常有用，该父类将存储收集证据的日期、时间和位置。在那个父类之下，你可以拥有子类，它们包含图像、声音、所收集样本的细节等。在这种情况下，你拥有一组强大的证据类型族，你的系统想要收集它们。随着技术的进步，你可能会发现需要管理不同类型的证据。这些可以随着系统的演进而添加。\n\
  \n然而，如果你的程序关注的是从根本上保持不变的内容，并且不会有不同类型的此类物品，你就不需要类层次结构。例如，如果你写一个玩扑牌的程序，实际上真的只有一种扑牌。扑牌将有一组表示其颜色、花色和值的属性，而且这永远不需要扩展，因为程序永远不需要处理新类型的扑牌。\n\
  \n### 是否可能使用类层次结构设计出糟糕的设计？\n\n哦，肯定的。有一些常见的错误。第一个是拥有非常宽的类层次结构。这意味着你最终会得到如 `Car`、`SportsCar`、`PeopleCarrier`、`PickupTruck`\
  \ 等类。这种宽度使得设计变得非常困难。例如，一种运动多用途汽车（SUV）是继承自 `SportsCar` 还是 `PeopleCarrier`？在这种情况下，你实际上只需要在\
  \ `Car` 对象中有一个 `CarType` 属性就可以了。但你可能会有一个名为 `Truck` 的类，因为卡车与汽车非常不同。当你考虑设计时，你需要考虑该类的行为是否需要针对这种特定类型而是不同的。如果答案是肯定的，你可以考虑创建一个新类；如果答案是否定的——如果你只是在存储关于该类的这个特定实例的某些信息——那么相反你可以添加一个持有这些信息的属性。\n\
  \n另一个错误是拥有非常深的类层次结构。你创建了大量的大量的子类，“以防万一”它们可能有用。你可能有 `Car`、`TwoWheelDriveCar`、`FourWheelDriveCar`、`TwoWheelDriveConvertable`、`FourWheelDriveConvertable`、`TwoWheelDriveSportsCar`\
  \ 等，它们相互继承。这会让程序运行变慢，因为当程序运行时，在层次结构中寻找重写的方法需要更长的时间。我尝试让我的类设计层级不超过三到四层。\n\n最后一个错误是将本不该出现在那里的东西引入类层次结构中。你可能考虑添加一种名为\
  \ `HiredCar` 的新类型汽车，它将租车者的名字和地址存储在 `Car` 类中。然而，这些项目通过向某些本不该出现在那里的类项中添加数据，从而污染了层次结构。如果你想管理一家租车业务，你应该基于\
  \ `Hire` 对象来工作，这些对象包含了对被租用的 `Car` 对象的引用以及租它们的 `Customer` 对象的引用。`Car` 类应该持有与汽车直接相关的信息，而不包含其他内容。\n\
  \n## 15. 游戏和软件组件\n\n![Image](img/15fig00.jpg)\n\n* * *\n\n### 你将学到什么\n\n当你开始学习编程时，我说过：“任何能组织派对的人都能写程序。”你现在已经发现，很多编程实际上都是关乎组织，这就是为什么良好的组织者往往是优秀的程序员。在上一章中，你已经学会了如何创建相关对象的家族树，以便更轻松地组织复杂的应用程序。新版本的对象不是从零开始的，而是只需要提供与它所扩展的对象不同的行为。这是一个支撑许多大型应用程序的重要原则。\n\
  \n在本章中，你将更深入地理解对象在程序中是如何被使用的，并开始将它们看作是可以组合在一起以形成解决方案的组件。你将发现对象如何通过相互发送消息进行通信，以及对象如何维护对自身状态的感知。然后，你将转向考虑如何创建可以作为复杂设计基础的模板对象，以及如何使用软件接口将对象转换为可重用且灵活的程序元素。在章节结束时，我们还将拥有一个完全可玩的太空射击游戏！\n\
  \n游戏和对象\n\n你学到的内容\n\n* * *\n\n### 游戏和对象\n\n《太空中的太空火箭》（Space Rockets in Space）的图形元素是一个很好的开始。游戏里有一个玩家可以控制的对象（火箭）和正在攻击的外星人。但要开发一个完整的游戏，我们需要让玩家能够射击外星人、失去生命并得分。\n\
  \n我们已经创建了一组代表屏幕上游戏精灵的对象，如**图 15-1** 所示。现在我们需要让这些对象协同工作，创建一个完整的游戏体验。首先，我们需要为外星人成功追上火箭的情况添加一些后果。在我们的游戏中，火箭每次被外星人击中时，火箭必须失去一条生命。当火箭失去所有生命时，游戏结束。为了做到这一点，第一步是发现如何让外星人和火箭能够产生交互。\n\
  \n![Image](img/15fig01.jpg)\n\n**图 15-1** 太空中的太空火箭。\n\n### 创建协作对象\n\n在视频游戏的术语中，火箭被外星人击中时必须“承受伤害”。从编程的角度来看，你可以认为这是一个外星人精灵向火箭发送了一条消息，说“我击中你了”。然后火箭可以决定这产生什么影响\n\
  \n当我学习编程时，对对象向另一个对象发送消息感到非常困惑。但事实证明非常简单\n\n- `RocketSprite` 类包含一个名为 `TakeDamage`\
  \ 的方法。\n- `AlienSprite` 类调用该方法。\n\n因此你可以将“消息传递”简化为对象之间的安排，其中一个对象包含接收消息的方法，另一个对象调用该方法来发送消息。程序一直在使用消息。当你点击鼠标时，活动程序接收到的消息表示鼠标被点击了。消息是以方法调的形式传递的。当你在本书的后续编写\
  \ Windows Presentation Foundation (WPF) 应用时，你将使用这种机制。\n\n* * *\n\n![Image](img/common.jpg)\
  \ 程序员观点：消息传递很重要\n\n决定你系统中的对象如何交互是设计过程的一个重要部分。你可能认为没有必要发送消息：也许外星人精灵可以直接减少计算火箭生命数的变量值。然而，“发送消息”要好得多。消息的发送者只需要调用方法来传递消息，但发送者不需要知道接收者实际上如何处理该消息。\n\
  \n此外，方法调用可以触发另一个对象的动作——例如，火箭可以启动爆炸动画，更改图像以显示它受了伤，甚至向游戏发送另一条消息，告诉游戏火箭已被销毁。\n\n如果你这样想，这会让程序员变得像电工一样的的人。一旦你创建了对象，你就可以通过在它们之间传递消息将它们“接线”起来。\n\
  \n* * *\n\n\n\n在下面的代码中，你可以看到 `AlienSprite` 中 `Update` 方法的行为，该方法用于检测外星是否击中了火箭。`Update`\
  \ 方法包含了一些语句，用于检查外星和火箭是否相交，并并了你在第 13 章中见过的 `IntersectsWith` 方法。当我们编写《Keep It Up!》时，我们使用\
  \ `IntersectsWith` 来检查挡板和球是否碰撞。在这个游戏中，我们检查的是火箭和外星是否发生了碰撞。\n\n点击此处查看代码图片\n\n```java\n\
  public class AlienSprite : MovingSprite\n{\n    // 如果为 false，则外星对游戏玩法没有影响\n    public\
  \ bool AlienAlive = true;\n\n    // 外星正在追逐的火箭\n    public RocketSprite rocketTarget;\n\
  \n    public AlienSprite(ImageSprite sprite, double xSpeed, double ySpeed,\n   \
  \                     RocketSprite target) :\n        base(sprite: sprite, xSpeed:\
  \ xSpeed, ySpeed: ySpeed)\n    {\n        rocketTarget = target;\n    }\n\n    //\
  \ 调用此告诉外星它已被杀死\n    public void Kill()\n    {\n        // 如果我们已经死了，就不需要做任何事情\n \
  \       if (AlienAlive)\n        {\n            // 如果我们到了这里，我们必须杀死自己\n         \
  \   // 设置标志位表示我们已经死了\n            AlienAlive = false;\n            // 隐藏该外星的精灵\n\
  \            spriteValue.Hide();\n        }\n    }\n\n    public override void Update()\n\
  \    {\n        // 如果外星已经死了，则什么都不做\n        if (!AlienAlive)\n            return;\n\
  \n        // 更新精灵的位置\n        base.Update();\n        // 检查外星和火箭目标精灵是否相交\n     \
  \   if (spriteValue.IntersectsWith(rocketTarget.spriteValue))\n        {\n     \
  \       // 如果我们到了这里，说明外星击中了火箭\n            // 杀死自己\n            Kill();\n      \
  \      // 告诉目标它必须受到伤害\n            rocketTarget.TakeDamage();\n            return;\n\
  \        }\n    }\n}\n```\n\n如果 `IntersectsWith` 方法返回 `true`，则意味着外星击中了火箭。如果发生这种情况，外星会执行一系列操作。首先，它调用一个名为\
  \ `Kill` 的方法将自己从游戏玩法移除。接下来，调用 `RocketSprite` 上的 `TakeDamage` 方法对火箭造成伤害。\n\n接下来的代码展示了\
  \ `TakeDamage` 方法的第一版本，它是 `RocketSprite` 类的一部分。当火箭受到伤害时，`Lives` 计数器会减少 1，并且该方法会播放音效。\n\
  \n![Image](img/451fig01.jpg)\n\n如果你运行 `Ch15_01_TakeDamage`，你会发现每当火箭与外星碰撞时，外星都会消失（并且你会听到“叮”的一声）。如果你在程序运行时查看其内部，你会看到\
  \ `Lives` 计数器（变量 `Lives` 的值）减少了。\n\n*(注：提供的原文在后续包含大量重复章节，我已根据指令逻辑地处理了独特的内容流。)*\n\
  \n\n\n\n我们之前已经见过 `this` 引用。它是指向当前代码执行所在对象的引用。上面的语句正在一个 `SpaceRocketsInSpaceGame`\
  \ 类实例的方法内部运行，因此 `this` 的值是对该游戏类的一个引用。这正是 `RocketSprite` 所需要的，所以因此我们在调用构造函数创建 `RocketSprite`\
  \ 时，将引用 `this` 传递给 `RocketSprite`。\n\n![Image](img/analysis.jpg) 代码分析：`this` 到底是什么意思？\n\
  \n**问题：** 在调用 `RocketSprite` 构造函数时，关键字 `this` 是什么意思？\n\n**答案：** 所有关于对象、消息和 `this`\
  \ 的讨论可能让人感到困惑。处理这种复杂性的最佳方法是记住我们正在尝试做什么。我们正在制作一个涉及火箭和外星人的游戏。如果外星人撞击火箭，火箭必须受到伤害。如果火箭被毁，游戏应该结束。因此，外星人需要一种方式告诉火箭它正在造成伤害，而火箭也需要一种方式告诉游戏游戏结束了。这就像我需要知道你的手机号码，以便我可以给你打电话并约你喝咖啡一样。\n\
  \n在程序中，我们谈论的是对象引用而不是手机号码。火箭需要对游戏的引用，以便它能告诉游戏已经结束了。在人类语境中，编程关键字 `this` 意味着 `我的手机号码`。如果我想让你知道如何联系我，我必须把我的手机号码给你。在对象内部内部运行的方法的情况下，你可以将引用\
  \ `this` 视为该方法运行所在对象的引用。因此，一个方法可以将 `this` 传递给另一个对象，以便给该对象一个指向自身的引用（或其手机号码）。\n\n\
  ## 停止游戏运行\n\n我们现在有一种方法向游戏发送消息，告诉它游戏结束了。我们还需要一种方法在收到此消息时停止游戏。\n\n![Image](img/455fig01.jpg)\n\
  \n游戏包含一个名为 `gameRunning` 的标记，当游戏运行时，该标记为 `true`。当调用 `EndCurrentGame` 来停止游戏时，它会将此标记设置为\
  \ `false`。我们可以通过随时调用 `EndCurrentGame` 方法来结束游戏。\n\n下面的代码显示了游戏中的 `PlayGame` 方法。它设置游戏环境，然后在\
  \ `gameRunning` 值为 `true` 的期间反复更新游戏对象。一旦该值变为 `false`，`while` 循环就会结束，游戏宣告完成。\n\n\
  ![Image](img/456fig01.jpg)\n\n如果你玩这个版本的游戏，你会发现只要火箭撞击了三个外星人，游戏就会结束。现在我们需要制作一个可以反复玩的游戏，以便玩家能够尝试提高自己的分数。为了实现这一点，可以使游戏对象占据不同的状态。\n\
  \n### 对象与状态\n\n每个人都有自己喜爱的生存状态。我的状态是坐在电脑前写程序，但我也有其他状态——例如，吃饭、睡觉以及（当我无法避免时）工作。允许软件对象也拥有状态通常非常有用。你已经看到《太空射击者》中的外星人有一个状态，即它们要么是死的，要么是活的。我们现在想做的是将状态管理扩展到游戏本身。\n\
  \n我为游戏设计了一个标题界面，如**图 15-2**所示。我特别对指令**按下空格键开始游戏**感到自自豪。这个屏幕应该一直显示，直到玩家按下空格键（或 **Fire**\
  \ 按钮）开始游戏。然后游戏将一直运行，直到火箭被毁，此时将显示几秒钟的 **Game Over** 屏幕，然后游戏应该返回标题界面。\n\n![Image](img/15fig02.jpg)\n\
  \n**图 15-2** 《太空空间中的太空火箭》标题界面。\n\n换句话说，游戏必须有三种不同的状态：\n\n1. 标题界面\n2. 玩游戏\n3. 游戏结束界面\n\
  \n处理此问题的最佳方法是管理游戏的 `SpaceRocketsInSpaceGame` 对象包含一个数据成员（类中的变量），存储游戏的当前状态。然而，在我们创建变量之前，我们必须决定什么种类型的变量最合适。理想情况下，我们希望变量类型只有三个可能的取值，每个游戏状态对应一个。我们可以使用\
  \ C# 枚举类型（参见第 9 章）来定义一个可以包含游戏可能状态的类型。\n\n![Image](img/457fig01.jpg)\n\n这些语句显示了如何创建和使用名为\
  \ `GameStates` 的枚举类型。这种类型的变量可以是三个值中的之一，每个状态对应一个。该类型创建在 `SpaceRocketsInSpaceGame`\
  \ 类内部，以便它可以代表游戏状态。当游戏运行时，它的行为取决于游戏的当前状态。\n\n![Image](img/458fig01.jpg)\n\n## 代码分析：添加更多游戏状态\n\
  \n![Image](img/analysis.jpg)\n\n程序中的几乎所有对象都会有某种它们将管理的状态。\n\n**问题：** 我们该如何给游戏添加一个“高分显示”状态呢？\n\
  \n**答案：** 游戏代码是构建基于状态游戏的非常好的模板。我们可以通过向 `enum` 添加一个代表新状态的值、为该状态添加一个更新游戏的新方法，然后在 `switch`\
  \ 中添加相应的分支，以便在游戏处于该状态时调用该方法。\n\n**问题：** 我们该如何给游戏添加额外的关卡？\n\n**答案：** 像《太空空间中的太空火箭》这样的游戏通常多个关卡，具有不同的背景和不同类型的外星人。你可能会认为可以通过给游戏添加更多状态来增加关卡（例如，我们可以有一个名为\
  \ `Level1` 的状态另一个名为 `Level2`）。但这不是组织代码的好方法。更好的方法是添加一个属性，可能是 `LevelNumber`，表示正在玩的关卡编号，并让\
  \ `UpdateGame` 方法处理此。换句话说，每个用于管理状态的方法实际上都可以是微型状态机。\n\n![Image](img/common.jpg) 程序员观点：消息与状态相辅相成\n\
  \n对象的状态将决定它如何响应收到的消息。某些消息会导致对象状态改变，而某些消息在特定状态下会被忽略。例如，如果游戏不在 `GameActive` 状态，它将忽略任何进来的\
  \ `EndCurrentGame` 消息，因为它们并不相关。如果我们回到之前的“派对门卫”情境，我们可以告诉门卫，一旦有 50 个人到达，他必须挂起“满员”牌子并停止允许任何新人的进入。在这种情况下，门卫将从“接受访客”状态变为“满员”，并以不同的方式响应“进入的访客”。\n\
  \n用于此版本的《太空空间中的太空火箭》的主游戏循环现在会为每种可能的游戏状态调用一个特定的更新方法。\n\n点击此处查看代码图像\n\n```csharp\n\
  public void UpdateTitle()\n{\n    if (SnapsEngine.GetFireGamepad())\n    {\n   \
  \     StartNewGame();\n    }\n}\n```\n\n\n\n\n\n以上是用于更新标题界面的方法。它会检查 `Fire` 按钮是否被按下（这等于键盘上的空格键）。如果按钮被按下，`UpdateTitle`\
  \ 会调用一个方法来启动游戏。其思路是让 `StartNewGame` 方法随后重置所有游戏对象并启动游戏运行。但现在有一个问题：我们不知道如何重置所有游戏对象。\n\
  \n***\n\n![Image](img/wrong.jpg) 可能会出什么问题：有时你会被措手不及\n\n我们使用 `blindsided`（措手不及）来形容那些你完全没有预料到的事情——比如我的一位朋友，他仔细地在两个独立的硬盘上为所有文件创建了备份，以确保如果其中一个硬盘故障，他不会丢失任何数据。遗憾的是，当他那台带有两块硬盘的电脑被偷时，这对他并没有多大帮助。\n\
  \n在软件项目中，当你突然发现程序需要执行一整套额外的任务时，你也会感到措手不及。在创建应用程序时，这种情况发生在我身上几次，问题通常是因为我在开始构建之前，没有仔细推演我的解决方案。\n\
  \n如果我们预先推演了游戏运行时会发生的情况，我们很快就会发现需要一种重启游戏的方法，而为了做到这一点，游戏对象必须能够自己重置。我们需要添加这种行为，否则我们就无法获得一个完善的游戏。\n\
  \n你可能认为，如果你仔细地推演一切，就永远不会像这样被措手不及。遗憾的是，情况并非总是如此。我曾被客户忘记告诉我应用程序需要执行的一大堆事情所困扰，也经历过令人沮丧的发现：被告知必须使用的硬件实际上运行速度不够快。\n\
  \n每当我遇到这种情况时，我都会仔细记录发生的情况，并在下一个项目中确保自己也采取了措施来解决那个问题。然而，我仍然意识到，偶尔我还是得处理一些完全意料之外的事情。事实证明，周密的计划并不能消除项目的所有风险，就像一个计划周密的生日派对如果生日女孩在活动前一天患了麻疹，也会陷入混乱。你只需要确保已经计划了所有可能发生的事件，并准备好应对命运带来的任何其他意外。\n\
  \n***\n\n### 游戏重置行为与抽象类\n\n我们刚刚发现了一个在设计中没有解决的问题：当游戏结束我们想要开始新游戏时会发生什么？我们不希望在每次开始新游戏时都重新创建所有的精灵（sprite）对象，因为那样太慢了。我们需要告诉每个精灵将其重置到初始位置。我们并不确切知道游戏对象需要做什么——例如，外星人精灵如果死掉了就必须复活——但我们知道每个对象都必须执行某些事情。\n\
  \n我们可以使用另一个 C# 特性来让这种情况更容易管理：`abstract`（抽象）方法。抽象方法是一种意图的声明。它表示对某种行为的需求，但没有具体说明该行为应该是什么。在程序中，这种需求以一个标记为\
  \ `abstract` 的“空”方法的形式表达：\n\n![Image](img/461fig01.jpg)\n\n如果抽象方法位于层级结构顶部的类中，这实际上是在说：“如果我们想要创建该类的实例，那么任何扩展\
  \ `MovingSprite` 类的类都提供一个 `Reset` 方法。”抽象方法是一个极好的设计工具，因为它们让你考虑操作，而无需具体描述这些操作将如何被执行。\n\
  \n例如，你可能正在实现一个管理银行不同类型账户的系统。你知道银行管理许多不同的账户——支票账户、信用卡账户、储蓄账户等等。处理此问题的合理方法是创建一个类层级结构，顶端是\
  \ `Account` 类，下面是更具体的类（`CheckingAccount`、`SavingAccount` 等），并提供更具体的行为。每个账户必须具备某些基础行为，如存款和取款、检查余额等。这些行为是每个账户都需要的，但每个账户将以自己的方式执行这些行为。你想做的是定义一个要求，即必须提供这些方法，而不具体说明它们如何被执行。你可以通过为所有你希望子类提供的方法创建抽象方法来实现这一点。这些方法强制子类提供所需的行为，但不必指定这些行为将如何工作。\n\
  \n***\n\n![Image](img/analysis.jpg) 代码分析：抽象方法和类\n\n**问题：** `Update` 方法是虚拟（virtual）的，而\
  \ `Reset` 方法是抽象（abstract）的。它们之间有什么区别？\n\n**答案：** 当我们创建 `MovingSprite` 类时，我们决定扩展\
  \ `MovingSprite` 的类可能可以在让精灵移动的 `Update` 行为基础上进行构建。将方法标记为 `virtual` 意味着它可以被子类中的方法重写（override）。我们在许多类中都这样做了。`RocketSprite`\
  \ 重写了 `Update` 以提供一个允许玩家控制火箭的版本，而 `ChaserAlien` 类则重写了 `Update` 以提供一个让精灵始终朝玩家移动的版本。\n\
  \n抽象则不同。它说：“你需要以你自己的方式完成这件事。我并不确切知道你需要做什么，但我知道你必须这样做。”在我们的游戏语境下，抽象 `Reset` 方法的声明表达了每个精灵都需要重置行为的需求。\n\
  \n**问题：** 为什么 `MovingSprite` 类现在是抽象的？\n\n**答案：** `MovingSprite` 类现在是抽象的，因为系统永远无法创建该类的实例。如果我们真的创建了一个实例并尝试在该对象上使用\
  \ `Reset` 方法，程序将不知道该做什么。\n\n**问题：** 如果一个类被设为抽象意味着什么？\n\n**答案：** 抽象意味着程序永远无法创建这种类型的类。该类作为其他类的模板，这些类将扩展抽象类并提供抽象元素的实现。\n\
  \n**问题：** 为什么你们不直接创建一个可以被重写的虚拟 `Reset` 方法？\n\n**答案：** `Update` 方法在精灵内部运行以更新它。我们将\
  \ `Update` 方法设为虚的，以便在扩展 `MovingSprite` 类的其他类中对其自定义。然而，并不是总是每个类都需要重写父类的方法。换句话说，没有什么能强制子类提供\
  \ `Update` 方法。但是，将方法设为抽象意味着子类*必须*提供 `Reset` 方法的实现。\n\n\n\n\n如果我们为 `MovingSprite`\
  \ 类添加一个抽象的 `Reset` 方法，这将导致整个程序的崩溃。编译器现在会报错，说我们游戏中的没有任何精灵类（sprite classes）具有 `Reset`\
  \ 方法，因此程序无法再次编译。此时，我们无能可做的只有深吸一口气（可能还要喝杯浓咖啡），然后遍历所有类以添加所需的 `Reset` 行为。对于某些对象，我们还需要修改构造函数，以便它存储精灵在创建时的原始位置。这样，`Reset`\
  \ 方法就可以使用该位置将精灵放回屏幕上的相同位置。\n\n* * *\n\n![Image](img/common.jpg) 程序员要点：少许的设计投入可以替代大量的编程工作\n\
  \n如果我们从从开始时就意识到游戏需要能够重置所有对象，我们就能节省大量的重复工作。当我开始着一个项目工作时，我会画一张像图 14-4 那样的图表，然后尽可能地考虑各种场景。我特别注意从端到端地思考程序。我的意思是，我会思考程序从用户对代码执行的操作开始，到程序在其整个生命周期内被使用的所有方式，它是如何被使用的。如果在游戏开发的最开始就这样做，我们就会意识到游戏结束并需要重启时需要发生某些事情。\n\
  \n执行这种设计最好的方法是让客户坐在旁边，这样他就可以问诸如“游戏结束时发生了什么？”\n\n* * *\n\n以下代码显示了 `RocketSprite`\
  \ 的 `Reset` 行为。当精灵创建时，该方法存储精灵的原始 X 和 Y 值。然后，当精灵被重置时，`Reset` 将火箭移回此位置，并将生命值和分数设为原始值。\n\
  \n![Image](img/463fig01.jpg)\n\n当游戏想要重置所有精灵时，它只需要执行此操作：\n\n![Image](img/464fig01.jpg)\n\
  \n记住，变量 `sprites` 持有一个游戏正在使用的所有精灵的列表。你在上面看到的循环与我们在每个精灵的 `Update` 方法中使用的循环完全相同。然而，这次使用的是\
  \ `Reset` 行为。在每个对象上调用的方法不，在每个对象上调用的 `Reset` 方法是适用于该特定类型的那个。即使你向游戏中添加了许多新精灵，该方法仍然有效，因为它们都被要求提供适用于它们自己的\
  \ `Reset` 行为。\n\n示例游戏 `Ch15_04_CompleteGame` 是一个相当完整的游戏，它在每次游戏完成后都会使用精灵的重置行为。它还显示分数和生命数（借自《Keep\
  \ It Up!》），并在每次外星人被消毁时重置它们。\n\n* * *\n\n![Image](img/happen.jpg) 让事情发生：制作你自己的完整游戏\n\
  \n你可以将 `Ch15_04_CompleteGame` 作为几乎任何你想制作的基于精灵的游戏的基础。你可以修改精灵的行为，或者只需更改美术。你可以为游戏添加更多声音，或者让它完全静音。你可以改变游戏的工作方式，让你在被愤怒的黄蜂追逐时捕捉落下的雨滴。\n\
  \n* * *\n\n### 接口与组件\n\n在《太空中的太空火箭》游戏中，所有精灵都基于 `MovingSprite` 类型，屏幕上的所有对象都存储在一个精灵列表中。\n\
  \n点击此处查看代码图\n\n```java\nList<MovingSprite> sprites = new List<MovingSprite>();\n\
  ```\n\n该列表包含了指向所有星星、外星人、火箭和导弹的引用。这之所以有效，是因为 `MovingSprite` 是所有这些对象类型的父类，`MovingSprite`\
  \ 引用可以指向其中任何一个。每当我们向游戏添加新类型的精灵时，它都是 `MovingSprite` 类的子类，我们可以直接将其添加到列表中。然后，当我们要更新游戏时，通过遍历精灵列表中的所有对象就可以更新所有精灵：\n\
  \n点击此处查看代码图\n\n```java\nforeach (MovingSprite sprite in sprites)\n    sprite.Update();\n\
  ```\n\n这种方法运行良好，但如果我们想在游戏中使用其他组件，它可能会缺乏活性。例如，另一位开发者可能制作了一组操作游戏背景图像的游戏对象，而我们想在游戏中使用它们。在理想世界中，这些背景应该基于\
  \ `MovingSprite` 类，但事实证明背景设计师以一种设计了她的类。她有一组类就像你在**图 15-3** 中看到的那样。\n\n![Image](img/15fig03.jpg)\n\
  \n**图 15-3** 背景精灵设计\n\n我们在这些背景上将的问题是，父类是 `BackgroundSprite`，因此它们与我们游戏中基于 `MovingSprite`\
  \ 类的类是完全不同的类。我们无法轻松将它们添加到游戏的精灵列表中，因为它们与 `MovingSprite` 不匹配。\n\n#### 添加抽象\n\n我们之所以遇到这个问题是因为\
  \ `MovingSprite` 和 `BackgroundSprite` 都是精灵，但它们之间没有任何关系。我们可以通过创建一个新的父类并让 `BackgroundSprite`\
  \ 和 `MovingSprite` 都继承它来解决这个问题。然后我们的程序就可以以这种类型来操作游戏对象。换句话说，游戏中的所有内容都是 `GameSprite`，可以是\
  \ `MovingSprite` 或 `BackgroundSprite`。图 15-4 显示了这种方法如何工作。\n\n![Image](img/15fig04.jpg)\n\
  \n**图 15-4** 合并类图\n\n`GameSprite` 类持有图像，而 `MovingSprite` 和 `BackgroundSprite` 类是该类的子类。以下是这三个类的编写方式：\n\
  \n![Image](img/467fig01.jpg)\n\n```java\nList<GameSprite> sprites = new List<GameSprite>();\n\
  ```\n\n这种方法的问题在于，如果我们已经有了现有类，实现它将非常耗时。这些类之间可能没有共同点。我们需要一种方法，可以使用这些对象的能力，而我们的程序不需要关心使用的特定类型。C#\
  \ 以接口（interface）的形式提供了这种方法。\n\n* * *\n\n![Image](img/wrong.jpg) 可能出现的问题：确保你最抽象的类足够抽象\n\
  \n程序员使用抽象作为一种跳出问题思考的方式。例如，如果我正在创建一个管理服装商店的应用程序，我可能会与店经理讨论服装，而不是具体的连衣裙、裤子、衬衫、袜子和领带。一旦我发现了系统对服装物品需要什么，我就可以根据不同服装类型的特定需求制作“量身定制”（抱歉双关）的子类。例如，连衣裙有一个尺码值，而一条裤子有一个腰围测量和内长测量。\n\
  \n\n\n如果服装店出售手提包和钱包（它们很有可能这样做），这些对象完全不符合我的服装类层级结构。我本应该从一个更抽象的类开始，也许称为 `Stock`（库存），它持有关于库存物品的所有信息（例如价格、库存水平、供应商），然后我可以拥有描述不同类型库存的子类。这使得我们的应用程序更具“面向未来性”，因为如果商店以后扩展到珠宝等业务，我们只需要添加另一个子类即可。\n\
  \n我们对精灵（sprites）的设计反映了抽象性的缺乏，因为游戏也需要一些不会移动的精灵。我们真的应该从一开始就将 `GameSprite` 为所有精灵的父类。当你选择层级结构中顶层类的名称和功能时，你需要确保它具有足够的抽象性。\n\
  \n***\n\n### 接口 (Interfaces)\n\n`Interface`（接口）是一个让人困惑的词。它立刻让人们联想到带有鼠标、键盘和大平板显示器的台式电脑。但在\
  \ C# 程序中，接口是一个类可以声称自己能够做的事情的集合。当我想到接口时，我想的是定义电源插座和插头之间连接的接口。该接口定义了插座产生的电压、插头引脚的形状和大小以及每个引脚的用途。\n\
  \n接口规范并没有说明插座中的电是如何产生的，也没有说明插头应该连接到哪里。电源插座可以由核电站或电池供逆变器驱动，插头可以连接到电水壶或平板电视。连接的每一端都对对方有一个视图，而这种视图完全由接口定义。它们不知道也不在乎实际上是什么在产生或消耗电力。\n\
  \n我们希望我们的软件对象也有类似的东西。我们希望有一种方法，让单个游戏可以使用精灵对象，而不必关心它们具体是什么类型的对象。我们可以通过准确识别类中所需的哪些行为，然后在\
  \ C# 接口中表达这些行为来实现这一点。在我们的游戏中，我们希望游戏中的精灵能够做两件事：每个精灵都能够更新自己（它必须包含一个 `Update` 方法），并且每个精灵都必须能够为新游戏重置自己（它必须包含一个\
  \ `Reset` 方法）。\n\n如果一个对象可以做这两件事，我们并不在乎它是什么：我们可以在游戏中使用它。我们可以用 C# 接口的形式表达这两种能力：\n\n\
  ![Image](img/469fig01.jpg)\n\n此代码创建了一个名为 `IGameSprite` 的接口，它规定了类为我们游戏中的精灵提供的两个方法。任何包含\
  \ `Update` 和 `Reset` 方法的类都可以在声明时将接口名称添加到类名中，告诉编译器它实现了该接口：\n\n![Image](img/469fig02.jpg)\n\
  \n这告诉编译器 `MovingSprite` 类（以及它的任何子类）实现了 `IGameSprite` 接口。这是一种表达方式，表示层级结构中的对象必须包含\
  \ `Reset` 和 `Update` 方法，否则程序将无法创建该类的实例。任何想要被当作 `IGameSprite` 处理的类都可以实现该接口。程序还可以创建\
  \ `IGameSprite` 类型的引用，这些引用可以指向任何实现该接口的类实例。\n\n点击此处查看代码图像\n\n```cs\nList<IGameSprite>\
  \ sprites = new List<IGameSprite>();\n```\n\n我的游戏对象列表现在是一个 `IGameSprite` 对象列表——也就是说，是可以更新和重置的对象列表。当程序运行时，无论这些对象是什么，都会对它们执行这些操作。后台程序员只需要向她的后台绘图类添加一个\
  \ `Reset` 和一个 `Update` 方法，告诉编译器这些类实现了 `IGameSprite` 接口，它们就可以与系统中的其他类一起使用了。接口定义了完全不同的对象之间交互的精确方式。\n\
  \n接口允许你根据对象能做什么来考虑对象，而不是根据它们是什么。它们在程序设计中允许了更大的灵活性。它们允许你指定组件之间如何交互，并使我们能够很容易地将一个组件替换为另一个，而系统不会报错。\n\
  \n***\n\n![Image](img/analysis.jpg) 代码分析：接口\n\n**问题：** 我们接口列表是什么意思？\n\n**回答：** 精灵列表包含了我们程序中所有精灵的引用，它现在是一个\
  \ `IGameSprite` 接口列表。这看起来有点让人困惑，因为接口并不是一个“东西”，它只是行为的集合。然而，这正是我们想要的。这有点像聚集了一群都是消防员的人。我们可能会看到老师、作家、艺术家和美容师出现，但只要他们实现了“消防员”接口（基本上就是赶到、救人和灭火），我们就不在乎他们实际上是什么。记住，接口提供了一种根据对象能做什么而不是它实际是什么来引用对象的方法。\n\
  \n**问题：** 如果我们尝试让接口引用指向一个没有实现该接口的对象会怎样？\n\n**回答：** 回消防消防员例子，你是在问如果我们要求一个不是消防员的人去消防会发生什么。答案是\
  \ C# 编译器会仔细跟踪哪些类实现了哪些接口，并会检查在你尝试使用接口引用时，该引用的对象是否具备所需的。\n\n**问题：** 一个类可以实现多个接口吗？\n\
  \n**回答：** 可以。就像一个美容师可以是消防员又是杂技演员一样。对象实现的每个接口都提供了该对象的不同“视图”。\n\n**问题：** 为什么接口名称以字母\
  \ `I` 开头？\n\n**回答：** C# 程序中的约定是接口的名称始终以 `I` 开始。这样程序员就可以很容易地区分接口和类。接口与类非常不同。接口实际上并没有告诉计算机如何做事；相反，它提供了一个类必须做的事情列表。\n\
  \n***\n\n***\n\n![Image](img/common.jpg) 程序员观点：接口和抽象类是深奥的内容，值得学习\n\n由于你正在学习编程，可能会发现抽象类和接口非常难以完全理解。我们从根据变量内容做出简单决策的程序开始。然后我们转向将数据封装成对象，以便更容易管理相关数据。现在我们正转向基于其他对象的对象（类层级）、模板对象（抽象类）以及基于对象的组件。\n\
  \n这些都是高级编程和软件设计主题。你不需要立即完全理解。你可以在不使用类层级的情况下创建出程序。如果你正在设计由许多不同组件组成的大复杂解决方案，我强烈建议你回到这本书这部分的章节，看看我们是如何组合游戏中的元素的。\n\
  \n***\n\n### 你所学到的知识\n\n\n\n\n\n在本章中，我们以《太空中的火箭》游戏为载体，完成了对 C# 中面向对象特性的探索。你已经发现了程序中的一个对象如何向另一个对象发送消息，以及复杂的程序如何由一组协作的对象组合而成。你已经看到，消息实际上只是具有约定含义的方法调用，而且对象可以响应其收到的消息并发送消息。你还研究了如何给对象赋予状态，以及对象的状态如何设定了处理传入消息的上下文。\n\
  \n有时，设计过程会确定需要对象以适用于每个特定对象提供一组特定的行为。你已经看到如何使用 C# 抽象类（abstract classes）来创建“模板”，这些模板指定了特定行为的抽象要求，而没有具体指定该行为在抽象类的每个子类中应如何工作。\n\
  \n接口（Interfaces）将抽象类的概念推得更远。抽象类允许我们设计模板，规定类层次结构中所有对象必须实现的行为。相比之下，接口指定了任何类都可以实现的一组行为。类可以实现接口，并根据这种能力进行管理。简单来说，抽象类允许我们根据对象“是什么”来管理对象，而接口允许我们根据对象“能做什么”来管理对象。\n\
  \n编程正在变成一种组织性的练习，我们可以开始将非常复杂的系统分解为一组每个对象在实现中扮演特定角色的。事实证明，你可以离开键盘，绘制一些图表显示解决方案中的每个元素需要做什么，从而完成大部分程序设计工作。\n\
  \n以下是一些你可能对软件组件思考的问题。\n\n### 对象（object）和组件（component）之间有什么区别？\n\n我们开始使用对象作为聚集数据值的方式，以便于管理。我们创建对象来表示曲调中的音符、地址簿中的联系人以及类似物品。你发现，通过赋予它们行为，可以让对象变得更有用，例如音符可以自己播放，或者联系人对象可以确保我们永远不会存储缺少名称的联系人。当对象开始协作使系统运行起来时，你就进入了组件的范畴。在我们的视频游戏中，外星精灵在造成伤害时会向火箭发送消息，如果这意味着火箭被摧毁且游戏结束，火箭就会向游戏发送消息。一旦你开始根据对象的能力（而不是它们是什么）来考虑对象，你谈论的就是软件组件了。\n\
  \n### 使用对象会让我的程序运行得更慢吗？\n\n是的，但并不重要。计算的基本原理之一是编写程序有许多方法。任何使用对象构建的程序都可以改写成一个巨大的方法。它将非常难以理解，如果出现故障将无法修复，但它的运行速度可能比基于对象的解决方案稍微快一点。基于对象的解决方案在构造易用性、测试能力和修改便利性方面的优势是巨大的，以至于无疑是编写大型程序的最佳方式。\n\
  \n### 我知道关于对象我需要知道的所有知识了吗？\n\n我已经编程了长期。在编程职业的前期阶段，我没有使用对象，原因非常简单：它们还没有被发明。然而，我发现我倾向于用“类对象”的方式来结构化我的程序，使用子程序和数据库，并将它们分组以创建我自己的对象。我使用对象已经很长时间了，仍然认为我的知识是不完整的。学习编程的奇妙之处在于，只要你还在编程，你始终在学习。本文这部分的笔记在设计大型系统时应该为你提供足够的思考空间，但只有编写更多代码并养成查看他人代码的习惯才能学到更多。在书的最后一部分第四部分，你将运用你的编程技能并学习如何使用它们来制作完整的应用程序。你将从框架转向接口设计的世界，在那里你可以创建任何类型的应用程序。你还将学习现代应用程序是如何构建的，并掌握一些软件工程技能。第四部分的电子书包含在从\
