  \ `aspect ratio`（宽高比例），它是图片高度与宽度的比例。你在讨论视频显示器时经常看到这个术语。宽屏视频通常以 16:9 的宽高比例显示（宽 16\
  \ 单位，高 9 单位），而旧的显示器以及某些平板电脑的宽高比例为 4:3（宽 4 单位，高 3 单位）。游戏开发者面临的挑战之一，就是确保他们的游戏可以在任何尺寸和形状的显示器上正常运行。\n\
  \n![Image](img/analysis.jpg) 代码分析：高度和宽度值到底意味着什么？\n\n我们一直使用数字来指定屏幕对象的尺寸，你可能已经注意到，很显然，当数字变大时，屏幕上的对象也会变大。但我们需要考虑这些数字的真实含义以及它们是如何被使用的。\n\
  \n**问题：** 尺寸值到底意味着什么？\n\n**答案：** 位置和尺寸值是以像素（pixels）为单位指定的。在视频游戏的早期，一个像素正好等于显示器上的一个点。这意味着\
  \ `Figure 12-3` 中拉伸的球体宽度正好为 400 个点，高度为 100 个点。今天，显示器有许多尺寸和分辨率，使用点数已经不再明智了。在 Windows\
  \ 10 显示器上，一个像素大约等于 1/96 英寸，因此我之前显示的球体尺寸将略大于一英寸，无论运行该程序的设备是哪种类型的显示器。\n\n如果你打算只在一台电脑上运行游戏，你可以使用适用于该机器显示器的精灵（sprite）尺寸。然而，如果你想让你的游戏供许多用户使用（例如通过\
  \ Windows Store），你就需要确保玩家无论使用何种设备都能获得良好的体验。\n\n大约一英寸的球体尺寸对于大屏电脑来说是完美的，但对于小型平板电脑或\
  \ Windows Mobile 设备来说，这是一个非常糟糕的主意。解决这个问题的方法是调整精灵的尺寸，以适应运行游戏的机器。\n\n### 调整精灵尺寸\n\n\
  我们希望游戏能够适应不同的屏幕尺寸。Snaps 为你提供了属性，告诉程序游戏当前正在使用的 `viewport`（视口）尺寸。你可以将游戏看作是在一个无限大的空间上绘制的。视口是该空间中对游戏玩家可见的部分。视口的左上角位于坐标\
  \ 0,0，底部和右侧边缘的位置取决于视口的宽度。视口中不可见的任何内容都不会被绘制。\n\n对于某个特定的游戏，我可能希望球的宽度是视口宽度的二十分。以下语句使用\
  \ `GameViewportWidth` 属性来获取视口的宽度，然后计算出该宽度的二分之一作为球的宽度。这里还有一个对应的高度属性。\n\n![Image](img/387fig01.jpg)\n\
  \n`Figure 12-5` 显示了一个宽度为屏幕宽度二分之一的球体。大多数游戏通过在游戏开始时设置游戏对象的尺寸来工作。\n\n![Image](img/12fig05.jpg)\n\
  \n**图 12-5** 一个较小的球体，按比例绘制。\n\n### 代码分析：视口宽度与屏幕尺寸\n\n**问题：** 如果你认为我以前向你介绍过屏幕尺寸，那么你是对的。在\
  \ `Chapter 9` 中，当我们编写绘程序时，使用了一个名为 `GetScreenSize` 的 Snaps 方法，程序可以使用该方法来确定屏幕的宽度和高度。该方法返回一个\
  \ `SnapsCoordinate` 值，其 X 值设置为屏幕宽度，Y 值设置为屏幕高度。为什么我们有两个获取屏幕尺寸的版本呢？\n\n**答案：** `GetScreenSize`\
  \ 方法返回程序运行内部的窗口的尺寸。然而，当我们制作在全屏模式下运行的游戏时，游戏会接管整个屏幕显示，在这种情况下，窗口尺寸值是不正确的。因此，我们有两种尺寸获取方法。\n\
  \n### 使用精灵填充屏幕\n\n如果你想让一张图像填充整个屏幕，可以设置精灵的宽度和高度值以匹配屏幕尺寸。以下是操作方法：\n\n![Image](img/388fig01.jpg)\n\
  \n在球体图像的情况下，填充屏幕会导致图像被严重拉伸变形。然而，这种技术是制作填充整个屏幕的背景精灵的绝佳方法。如果精灵包含的是一种图案——例如，草地或混凝土地板——而不是一个可识别的物体，玩家可能不会注意到图像有轻微的扭真。\n\
  \n### 在屏幕上为精灵\n\n`ImageSprite` 类提供了可以用于管理精灵在屏幕上位置的属性。这两个语句将球放置在屏幕的左上角：\n\n![Image](img/388fig02.jpg)\n\
  \nX 和 Y 的值提供了精灵左上角的位置。换句话说，当 `ImageSprite` 位于左上角时，其 X 和 Y 位置设置为 0。\n\n### 让精灵移动起来\n\
  \n我们真正想要的是元素可以在屏幕上移动的游戏。为了实现这一点，游戏可以在循环期间对精灵的位置进行更改。为了理解这是如何工作的，请看这里：\n\n![Image](img/389fig01.jpg)\n\
  \n当你运行程序时，球似乎在屏幕上的两个位置之间跳动。当然，它并没有真的移动——而是你的大脑被骗成了从一个地方移动到了另一个地方。如果我们频繁更新精灵，并且每次移动的距离不要，就能产生移动的效果。以下是显示这种效果的代码：\n\
  \n![Image](img/389fig02.jpg)\n\n这是一个经典的游戏循环。循环中的两个语句更新球的位置，然后绘制屏幕。接着循环重复。如果你运行这个程序，你会看到球在屏幕上平滑移动。球之所以稳定移动，是因为每循环一次，像素值就会增加\
  \ 1 个球速值。`DrawGamePage` 方法被设置为每秒绘制 60 帧，因此在一秒钟内，球移动的距离略大于半英寸（记得每英寸大约有 96 个像素）。如果你想让球移动得快一倍，只需将\
  \ `xBallSpeed` 和 `yBallSpeed` 的值改为 2 即可。\n\n代码分析：精灵移动\n\n这段代码需要仔细研究并引发了一些有趣的问题。\n\
  \n**问题：** 为什么当 Y 增加时精灵向下移动？\n\n**答案：** 在计算机图形中，显示原点（坐标 0,0 的点）总是屏幕的左上角。这可能与硬件从屏幕顶部映射到内存的方式有关，但我必须承认我不确定。对于本章而言，我认为答案必须是“因为它就是如此”，我们只需要继续下去。\n\
  \n**问题：** 如果程序尝试在屏幕区域之外绘制图像，会发生什么？\n\n\n\n\n\n**回答：** Windows 管理系统并不关心你的程序是否尝试绘制不在屏幕上的内容。你可以将屏幕看作指向无限大区域的*视口*（viewport），该区域包含了所有正在显示的物体。Windows\
  \ 只会绘制那些通过视口可见的物体部分；其他任何部分都会被裁剪。让 `ImageSprite` “消失”的一种方法是将其移动到可见区域之外，但使用 `Hide`\
  \ 方法更有效，因为它会完全停止精灵的绘制。\n\n**问题：** 如果我们将其中一个速度值设置为 0 会发生什么情况？\n\n**回答：** 程序通过两个值来表示球移动的方向：在屏幕上水平移动的距离，以及向下移动的距离。如果其中一个值为\
  \ 0，则意味着在该方向上没有移动。例如，如果 `YBallSpeed` 为 0，小球将水平移动但不会垂直方向移动。如果两个速度值都是 0，小球将静止不动。\n\
  \n**问题：** 如果我们将其中一个速度值设置为负数会发生什么情况？\n\n**回答：** 负速度完全没问题；它们会让球向相反方向移动。在 X 轴（从左到右）上，负速度表示向左移动。在\
  \ Y 轴（从上到下）上，负速度会让球向上移动。\n\n* * *\n\n### 让精灵反弹起来\n\n我们现在已经有了移动功能，但这种移动并不很有用。球向下穿过视口，然后从底部消失了。我们希望球能够从视口的底部、顶部和侧面发生反弹。\n\
  \n如果球试图离开屏幕底部，游戏必须让球改变方向并向上移动。如果球试图离开屏幕顶部，游戏必须让它向下移动。游戏还必须通过类似的测试，确保球不会离开左边缘和右边缘。我们可以用如下方式表示反弹球的算法：\n\
  \n“如果球到达视口的底部，它应该向上反弹。如果球到达视口的顶部，球应该向下反弹。如果球到达视口的左侧，它应该向右反弹，而如果球到达视口的右侧，它应该向左反弹。”\n\
  \n当某物物体发生反弹时，移动方向就会改变。我们的程序必须检测球何时移出视口，并对方向进行相应的更改。`ImageSprite` 类提供了一个 `Bottom`\
  \ 属性，给出精灵底部的 Y 坐标。如果此值超过了视口的高度，球就必须改变移动方向并向上反弹。以下是让球从屏幕底部反弹的代码：\n\n![Image](img/391fig01.jpg)\n\
  \n还有一个 `Top` 属性，给出精灵顶部的 Y 坐标。如果 `Top` 值任何时候小于 0，球必须向下反弹。这是为了让球从顶部反弹必须进行的第二个测试。\n\
  \n点击此处查看代码图片\n\n```\nif (ball.Top < 0)\n{\n    // 球正在离开顶部边缘\n    if (YBallSpeed\
  \ < 0)\n    {\n        // 球正在屏幕向上移动\n        // 因为速度是负的\n        // 让它反弹回视口内\n \
  \       // 将速度设为正数\n        YBallSpeed = -YBallSpeed;\n    }\n}\n```\n\n还有 `Left`\
  \ 和 `Right` 属性，提供 `ImageSprite` 左边缘和右边缘的 X 坐标。\n\n`Ch12_09_BouncingSprite` 中的示例代码包含了测试球移出四个边缘的条件。我们现在可以让球在屏幕上弹跳了。我们接下来需要一个挡板来击球。但那是章的内容。\n\
  \n* * *\n\n![Image](img/happen.jpg) 让事情发生：让一些图片在屏幕上弹跳\n\n现在你已经知道如何缩放图像和在屏幕上放置物体，你可以玩转图片了。你可以通过在视口中移动精灵来缓慢平移，或者通过更改精灵的大小来放大。或者你也可以直接让你兄弟或朋友的脸在屏幕上弹跳。将多张图片这样非常有趣。\n\
  \n* * *\n\n* * *\n\n![Image](img/common.jpg) 程序员的观点：有时非常简单\n\n### 你学到了什么\n\n在这一章中，你学习了游戏的基础知识、什么是游戏以及游戏实际上是如何运行的。你看到了二维游戏的基础元素是*精灵*（sprite），而精灵是图像的容器。你还学习了更多关于显示器坐标系统的工作原理，原点（`X`\
  \ 和 `Y` 为 0 的点）位于屏幕的左上角。你现在知道 Windows 显示器尺寸是以像素为单位的，每英寸有 96 像素。如果游戏要在一系列设备上正确运行，可能会导致问题，所以你还看到了\
  \ `Snaps` 方法，这些方法可以缩放 `ImageSprites` 以保持它们的形状。\n\n最后，你发现玩玩图像并让它们在屏幕上移动非常有趣。\n\n\
  这里有一些你可能想要思考关于游戏的问题：\n\n**我真的需要一台性能非常强大的电脑来运行这些游戏吗？**\n\n根据我的经验，不需要。Snaps 引擎已经在最强大的\
  \ Surface Book 上测试过，也在一个廉价的七英寸平板电脑上测试过。在这两种情况下，它看起来都运行良好。关键因素是屏幕上任何时候的精灵数量。系统似乎可以处理\
  \ 500 个，这对于我们要编写的游戏类型足够了。唯一让 Snaps 引擎感到吃力的设备是 Raspberry Pi。游戏实际上可以运行，但更新非常缓慢。这是由于在编写时，运行在\
  \ Raspberry Pi 上的嵌入式 Windows 10 版本不支持提供良好更新所需的图形加速。\n\n**所有的游戏引擎都像 Snaps 引擎一样工作吗？**\n\
  \nSnaps 引擎是高度简化的，它实际上运行在支撑通用 Windows 应用程序的图形环境之上。它运行得如此良好，是对许多工程师技能的致敬。大多数游戏引擎与底层硬件的耦合紧密得多，这意味着它们可以提供好得多的性能。\n\
  \n**游戏开发看起来很有趣。我可以在哪里找到一个正式的游戏引擎？**\n\n我最喜欢的编写游戏的 C# 引擎叫做 MonoGame。它易于学习和使用，利用了\
  \ C# 语言，并可以为 Windows 10、Android 甚至 Apple iOS 编写游戏。一旦掌握了书中的技巧，我强烈建议你在最喜欢的搜索引擎中搜索\
  \ MonoGame。\n\n\n\n\n\n# 你将学习到\n\n在本章中，你将编写你的第一个正式游戏，包含开头、中间和结尾。你将发现游戏如何获取玩家的输入并利用这些输入来控制游戏中的对象。你还将发现游戏如何检测屏幕上的对象何时发生相互作用，以及你如何利用这些交互来生成游戏玩法。不过，游戏不仅仅关于图像，所以我们还将考虑游戏如何产生声音输出并为玩家显示文本消息。在本章结束时，我们将查看一个完整的游戏，并考虑如何使用随机性——计算机游戏制作者最大的盟友之一——为游戏玩法增加趣味。在整个过程中，我将突出一些切入点，你可以获取我们正在查看的示例代码并用它来创作你自己的作品，无论是动画心情消息还是你自己的游戏。计算机是你所能操作的最具创造力的设备之一，我认为游戏是你探索这种创造力的最佳方式之一。\n\
  \n- 创建一个由玩家控制的挡板\n- 在游戏中添加声音\n- 在游戏中显示文本\n- 你学到的内容\n\n***\n\n### 创建由玩家控制的挡板\n\n\
  在第 12 章结束时，我们有一个可以在屏幕上弹跳的小球精灵。现在我们将添加玩家控制，用于与球交互。我提供了一个紫色的挡板，你可以用它来击球。（你可以在 `BeginToCodeWithCSharp`\
  \ 项目的 Images 文件夹中找到该精灵的图像——`paddle.png`。你也可以添加你自己的图像。）\n\n以下语句将挡板精灵加载到游戏中并进行设置。它的尺寸被设置为视口宽度的十分之一，挡板的底部放置在距离屏幕底部\
  \ 10 像素处。图 13-1 显示了挡板的位置。\n\n![Image](img/396fig01.jpg)![Image](img/13fig01.jpg)\n\
  \n**图 13-1** 球和挡板在一起，但没有任何交互。\n\n如果我们将这些语句添加到我们在第 12 章末尾编写的弹球程序中，我们就可以看到球和挡板一起出现在屏幕上。现在我们需要允许玩家移动挡板。事实证明这相当简单。\n\
  \n#### Snaps 手柄\n\nSnaps 框架提供了方法，用于获取由 Snaps 游戏引擎管理的“手柄”状态。为了控制游戏，玩家可以通过多种方式与 Snaps\
  \ 手柄进行交互——使用键盘、触摸屏、鼠标，甚至是 Xbox One 或 Xbox 360 控制器。\n\nSnaps 手柄可以检测五个动作——左、右、上、下和开火（Fire）。方向映射到键盘上的方向键，开火动作映射到空格键（Spacebar）。如果你使用控制器，方向映射到\
  \ d 方向键，开火动作是 A 按钮。\n\n当游戏运行时，屏幕上还会显示一个游戏手柄供鼠标和触摸屏使用，如图 13-2 所示。你可以通过将鼠标指针悬停在你想要触发的面板上，或者在触摸屏上触摸面板来激活这些面板。\n\
  \n![Image](img/13fig02.jpg)\n\n**图 13-2** 屏幕手柄。\n\n游戏可以读取 Snaps 手柄的设置并相应更新游戏中的对象。例如，`XPaddleSpeed`\
  \ 变量存储了玩家移动挡板时挡板移动的速度。我在下面的语句中将其设置为 15，这比相应的 10 的球速要快得多。这是公平的，因为这给了玩家一个追上球的机会。这个速度越接近球的速度，玩家的技巧性就必须越高。\n\
  \n```c\ndouble XPaddleSpeed = 15;\n```\n\n当然，如果你让挡板移动得比球慢，那么游戏将变得无法进行，因为玩家永远无法追上球。这对玩家来说是相当过劣的行为，但尝试一下可能会很有趣。\n\
  \n游戏程序可以使用五个方法之一来检查玩家是否触发了特定的手柄动作，这些方法被命名为 `GetRightGamepad`、`GetLeftGamepad`、`GetUpGamePad`、`GetDownGamePad`\
  \ 和 `GetFireGamepad`。只要相应的动作被选中，这些方法就会返回 `true`。请注意，与检测事件的按键和鼠标点击不同，这些方法检测的是电平（levels）——换句话说，它们并不检测键盘上的按键何时被按下；相反，它们让游戏检查按键是按下还是松开。\n\
  \n![Image](img/398fig01.jpg)\n\n前面的代码显示了程序如何读取 Snaps 手柄并更新挡板的位置。如果 `GetRightGamePad`\
  \ 方法返回 `true`，程序根据挡板的速度将挡板向右移动。如果 `GetLeftGamePad` 方法返回 `true`，程序根据挡板的速度将挡板向左移动。这就是我们允许玩家左右移动的所有内容。\n\
  \n***\n\n![Image](img/analysis.jpg) 代码分析：挡板移动\n\n**问题**：为什么测试只执行一次，挡板却持续移动？\n\n\
  **回答**：观察上面的语句，挡板移动的测试只执行了一次，但请记住这段代码位于游戏循环内部，并且每秒重复多次。这意味着当玩家选择方向时挡板会移动，当玩家松开时会停止。事实证明这为控制提供了非常真实且易于操作的感觉。\n\
  \n**问题**：如何让挡板在屏幕上上下移动？\n\n**回答**：你可以使用相同的技术允许玩家在整个屏幕上移动挡板。游戏可以使用 `GetUpGamepad`\
  \ 和 `GetDownGamepad` 方法来检测玩家何时选择了向上或向下。它可以更新挡板的 Y 位置以反映这种变化。\n\n**问题**：如果玩家同时选择左和右移动会发生什么？\n\
  \n**回答**：试一下！挡板向左移动是因为选中了左，然后向右移动是因为选中了右。结果将是挡板完全不移动，这正是应该发生的。\n\n**问题**：挡板应该移动多快？\n\
  \n**回答**：这是你必须通过尝试来发现的。我让手柄每每次更新移动 15 像素，而我游戏中的球每每次更新移动 10 像素。这给了玩家优势，因为这意味着只要他们移动挡板足够快，就一直能追上球。\n\
  \n#### 防止挡板移出屏幕\n\n\n\n\n你可能很喜欢左右移动挡板来追逐球，尽管在目前这两个物体之间还没有产生交互。然而，你可能已经注意到了游戏中的一个缺陷：挡板很容易完全移动到视口侧面之外。如果你一直按住左方向键，挡板就会移动到左侧边缘并然后消失。这是因为与球不同，程序中没有代码可以阻止挡板移出屏幕的边界之外。幸运的是，我们可以向游戏循环中添加一些代码来修复这个问题：\n\
  \n点击此处查看代码图像\n\n```csharp\nif (paddle.Left < 0)\n{\n    // 试图移出左边缘 - 将挡板拉回\n   \
  \ paddle.Left = 0;\n}\n\nif (paddle.Right > SnapsEngine.GameViewportWidth)\n{\n\
  \    // 试图移出右边缘 - 将挡板拉回\n    paddle.Right = SnapsEngine.GameViewportWidth;\n}\n\
  ```\n\n### Ch13_03_SpriteAndPaddleClamped\n\n这两个条件在游戏更新挡板位置后执行。它们通过在挡板超出视口时将其位置重置为视口边缘，确保挡板永远不会离开视口。这在视频游戏中是一种非常常见的做法，被称为*夹紧（clamping）*。一个值被限制在一个特定的范围内，且不允许其超出该范围。\n\
  \n#### 用挡板击中球\n\n目前，球和挡板之间没有交互；球直接穿过了挡板。我们想要提供一种行为，当两个物体相交时让球从挡板上弹回。`ImageSprite`\
  \ 类提供了一个方法，可以检查另一个精灵是否与特定的精灵相交：\n\n![图像](img/400fig01.jpg)\n\n当球和挡板相交时，游戏反转 Y 轴的速度，这导致球看起来像是是从挡板上弹回的。玩家现在可以用挡板“击中”球。如果你这样玩一会儿，你会发现有时球似乎击中了挡板，但实际上并不应该命中。图\
  \ 13-3 显示了这里发生的情况。\n\n![图像](img/13fig03.jpg)\n\n**图 13-3** 球和挡板的边界框。\n\n前面的代码显示的\
  \ `IntersectsWith` 方法使用屏幕上对象的宽度和高度在每个对象周围画一个框。如果框相交，该方法返回 `true`。在图 13-3 中，挡板和球并没有实际上接触，但它们周围的框相交了，所以即使在不应该碰撞的情况下，球也会被弹回。有些游戏通过测试相交区域（球和挡板共享的小矩形）来解决这个问题，以检查它们是否有任何像素实际上重叠。如果重叠了，精灵就碰撞了。其他游戏通过将所有精灵都变为矩形，让它们看起来实际上发生了了碰撞。\n\
  \n***\n\n![图像](img/common.jpg) 程序员观点：游戏是“作弊”的好去地方\n\n编写游戏的奇之处在于，你控制了整个游戏宇宙。在这种情况下，我们遇到了一个问题：有时球和挡板碰撞时，看起来并不应该碰撞。我们可以编写一些花哨的额外代码通过检查像素是否重叠来解决这个问题，或者改变球和挡板的形状让它们变成矩形。另一种方法是继续使用矩形来检测精灵周围的碰撞，但让矩形变小，这样球就必须进入挡板深一点才能与它碰撞。\n\
  \n在这种情况下，我们将忽略这个问题，并希望当动作移动很快时，玩家会因为沉浸在游戏中而不会注意到。游戏充满了这种小“作弊”。关键的测试在于，你所做的妥协是否会影响良好的游戏体验。\n\
  \n***\n\n#### 在游戏中添加声音\n\n音效可以为游戏增添许多内容。Snaps 游戏引擎包含一个特殊的音效方法，你可以用它在游戏运行过程中播放声音。\n\
  \n![图像](img/401fig01.jpg)\n\n记住，你可以为游戏添加自己的声音。要回想起关于在程序中添加声音的记忆，请回顾第 5 章，我们在那里第一次看到了\
  \ `PlaySoundEffect` 方法。\n\n***\n\n![图像](img/analysis.jpg) 代码分析：游戏与声音\n\n**问题：**\
  \ 为什么我们的游戏需要一个特殊的音效方法？\n\n**答案：** 我为游戏创建了一个特殊的音效方法，因为游戏可能会同时播放很多声音。这会对程序使用内存的方式产生负面影响，并在程序运行时内存被回收时导致游戏“卡顿”。`PlayGameSoundEffect`\
  \ 方法通过重用声音来限制游戏使用的声音通道数量。这意味着某些声音可能无法播放完成，但它确实确保了游戏体验的良好。\n\n***\n\n***\n\n![图像](img/happen.jpg)\
  \ 让事情发生：让游戏运行起来\n\n现在你可以获取所有的图像并使用它们来创建游戏玩法。也许你可以让球在屏幕上移动。为屏幕添加一些动作。\n\n***\n\n\
  ### 在游戏中显示文本\n\n任何游戏都需要显示文本。Snaps 框架提供了一种特殊的精灵可以显示文本。\n\n![图像](img/403fig01.jpg)\n\
  \n你可以使用 `TextBlock`。文本和图像之间的主要区别在于设置大小。对于图像，你设置宽度和高度，但对于 `TextBlock`，你需要在创建精灵时使用\
  \ `FontSize`。`FontSize` 的值是以像素为单位的字体高度。在这种情况下，它是指字母 A 的顶部和 g 的底部之间的距离。如果不指定字体，文本将使用默认字体\
  \ Segoe UI。我喜欢这个字体，但如果你喜欢其他的，可以添加 `FontFamily` 字符串来指定字体名称。接下来显示的 `giantTextSprite`\
  \ 使用了相当惊人的尺寸。\n\n点击此处查看代码图像\n\n```csharp\nusing SnapsLibrary;\n\npublic class Ch12_13_DisplayingText\n\
  {\n    public void StartProgram()\n    {\n        SnapsEngine.StartGame(fullScreen:\
  \ false, framesPerSecond: 60);\n        TextBlockSprite tinyTextSprite = new TextBlockSprite(\n\
  \            text: \"Hello. 我是默认字体的文字\",\n            fontSize: 20, color: SnapsColor.Blue);\n\
  \        SnapsEngine.AddSpriteToGame(tinyTextSprite);\n        TextBlockSprite giantTextSprite\
  \ = new TextBlockSprite(\n            text: \"我是巨大的文字\",\n            fontSize:\
  \ 200, fontFamily: \"Impact\",\n            color: SnapsColor.Red);\n        SnapsEngine.AddSpriteToGame(giantTextSprite);\n\
  \        while (true)\n        {\n            tinyTextSprite.Top = 10;\n       \
  \     tinyTextSprite.CenterX = SnapsEngine.GameViewportWidth / 2.0;\n        }\n\
  \    }\n}\n```\n\n这就是在视口中显示文本块的程序。你可以看到这些块在图 13-4 中显示的样子。\n\n\n\n\n\n```cs\nGiantTextSprite.Bottom\
  \ = SnapsEngine.GameViewportHeight - 10;\nGiantTextSprite.CenterX = SnapsEngine.GameViewportWidth\
  \ / 2.0;\nSnapsEngine.DrawGamePage();\n}\n}\n}\n```\n\n# Ch13_06_ 显示文本\n\n![Image](img/13fig04.jpg)\n\
  \n图 13-4 以两种尺寸和位置显示文本。\n\n程序可以随时更改 `TextBlockSprite` 的内容。显示的文本将在下一次显示更新时更改。更改内容可能会导致精灵图的宽度和高度发生变化，但你可以轻松地将文本居中，或将其放置在显示器的左侧或右侧。此语句将\
  \ `tinyTextSprite` 的中心位置设置为显示器的中心位置。\n\n点击此处查看代码图片\n\n`tinyTextSprite.CenterX =\
  \ SnapsEngine.GameViewportWidth / 2.0;`\n\n为了让这种定位生效，必须在游戏循环中执行，这样当文本精灵图的宽度或高度发生变化时，位置就可以随之更新。\n\
  \n### 旋转文本\n\n如果你想让文本向上屏幕移动，让你的文字以有趣的角度出现，甚至让消息在屏幕上旋转，你可以设置 `TextBlockSprite` 的\
  \ `RotationAngle` 属性。角度以度为单位：\n\n点击此处查看代码图片\n\n```cs\nGiantTextSprite.RotationAngle\
  \ = 90;\n```\n\n此语句将 `GiantTextSprite` 的角度顺时针旋转 90 度。你可以在游戏循环期间更新精灵的旋转角度，制作一些酷的显示效果。\n\
  \n![Image](img/406fig01.jpg)![Image](img/406fig01a.jpg)\n\n之前的程序与你在上一章节中看到的软球程序（`Ch12_03_SquishyBall`）类似。但这个程序不是让球来回挤压，而是显示一个旋转的、在屏幕上放大和缩放的催眠信息。这是通过在每次游戏更新时更改文本的字体大小来实现的。运行程序查看这些效果。\n\
  \n***\n\n![Image](img/happen.jpg) 让事情发生：制作一些酷炫的消息显示\n\n你可以尽情玩这个催眠文本显示程序。改变文本改变大小的速率很有趣，但你可能也喜欢尝试同时显示两条消息并让它们以不同的速率改变大小。你可以使用游戏手柄让玩家更改消息移动的速度或选择不同的消息。\n\
  \n你还应该记住，程序可以以移动 `ImageSprite` 的方式在屏幕上移动 `TextBlockSprite`（你也可以旋转 `ImageSprites`）。如果你愿意，可以将球和球拍替换为单词。你可以显示一条巨大的信息，然后缓慢地滑过视口。你还可以通过叠加绘制相同消息的多个颜色版本来产生阴影效果，从而赋予文字真实的冲击力。我将在下一节中演示这种效果，用于我们第一个完整游戏的标题。\n\
  \n***\n\n***\n\n![Image](img/wrong.jpg) 可能会出现什么问题：缺少字体会让你的游戏看起来很傻\n\n让游戏与众不同的好方法是用有趣的字体显示游戏消息。但不要犯一个错误，认为每个人电脑上都有和你一样的字体。Microsoft\
  \ Office 和 Adobe Photoshop 等程序在安装时会添加额外的字体。你游戏的某些玩家可能没有这些程序，因此他们就不会这些字体。如果游戏尝试使用主机计算机上不可用的字体，它实际上不会运行失败，但看起来可能会相当傻。所有的示例程序都使用了\
  \ Windows 10 提供的字体。\n\n***\n\n### 制作一个完整的游戏\n\n你已经学会了制作简单的基于精灵的游戏所需的几乎所有操作。现在让我们把这些元素结合起来，制作一个可玩的游戏。这个游戏将是一个简单的“接球”游戏，玩家必须尽可能用球拍击中球。玩家每次击中球都会得一分。然而，如果他们错过了球，球掉到了屏幕底部，他们就会失去生命。如果玩家失去三次生命，游戏结束。\n\
  \n为了让游戏玩法更有性，我们可以在玩家每次得分时让球向上移动屏幕，给他们更少的反应时间。这个游戏可以作为你可能想写的许多游戏的模板。你可以在章节的演示代码文件\
  \ `Ch13_08_KeepUpGame` 中找到整个游戏。`图 13-5` 显示了当一个技巧高的玩家（我）玩游戏时的样子。\n\n![Image](img/13fig05.jpg)\n\
  \n图 13-5 正在进行的“接球！”游戏。\n\n这里是完整的游戏程序。我将代码拆分成了方法以便于理解。游戏循环位于程序的中间，一直持续到玩家失去所有生命为止。点击此处查看代码图片\n\
  \n```cs\npublic void Start()\n{\n    setupGame();\n    while (true)\n    {\n   \
  \     waitForStart();\n        resetGame();\n        while (true)\n        {\n \
  \           positionMessages();\n            updateBall();\n            updateGamepad();\n\
  \            updateScore();\n            SnapsEngine.DrawPage();\n            //\
  \ 如果我们没有生命了，跳出游戏\n            if (lives == 0)\n            {\n                break;\n\
  \            }\n        }\n        // 当我们到达这里时，游戏结束了\n        displayGameOver();\n\
  \        SnapsEngine.Delay(10);\n    }\n}\n```\n\nCh13_08_KeepUpGame\n\n\n\n\n\n\
  `ThrowDice` 方法使用了位于 `System` 命名空间下的 `Random` 类。该类提供了多种方法，可以返回供程序使用的随机数。`ThrowDice`\
  \ 方法使用了 `Next` 方法。`Next` 方法接收两个数字——最小值和一个不包含在内的最大值（exclusive maximum value）。这意味着\
  \ `ThrowDice` 的用户获得的数字至少是 1，但他们获得的最大数字将是 6，因为排除的最大值是 7。\n\n`ThrowDice` 使用的 `Next`\
  \ 方法可以用于生成你想要的任何范围内的整数。你只需要指定所需的起始和结束值，但请记住结束值是不包含的，这意味着你永远不会实际得到那个值。\n\n***\n\n\
  ![Image](img/analysis.jpg) 代码分析：查看 ThrowThrowDice\n\n通过对 Snaps 框架的这次内部观察，产生了一些有趣的问题。\n\
  \n**问题：** 为什么 `SnapsEngine` 类被标记为 `partial`（部分）类？\n\n**答案：** 直到现在，我们一直在程序文件文件中将所有的类写成一个单一的实体。然而，C#\
  \ 允许你将类的内容分布在许多源文件中。如果你这样做，类的每个元素都必须标记为 `partial`，以告诉编译器需要从所有分离的元素组装成整个类。\n\n将类的部分标记为\
  \ `partial` 对类的工作方式没有影响，但它可以让程序员更容易在非常大的程序中找到方向。他们不需要翻阅大量文件来寻找 `ThrowDice` 方法，只需要查看几个文件即可。对于像\
  \ `SnapsEngine` 这样提供所有 Snaps 行为的大型类来说，这样做是一个好主意。\n\n***\n\n### 随机数生成的科学性\n\n尽管你可能并不认为如此，但计算机并不擅长产生真正的随机行为。程序能做的最好的就是是从一个值（称为种子\
  \ seed）开始，然后对这个数字进行一些巧妙的计算，以计算出序列中的下一个数字。这个过程不断重复，以逐个提供后续的随机值。因此，`Next` 方法的命名非常恰当，因为它提供了由该随机数生成器管理的随机数序列中的下一个数字。这种技术被称为伪随机数生成器，因为你得到的数字看起来是随机的，但它们实际上是完全可预测的——只要你知道种子值和正在使用的巧妙计算方法。\n\
  \n此时，你可能会问自己：“如果计算机不能产生真正的随机数，随机数生成器是如何获得第一个种子数字的？”答案是它使用了宿主机的系统时钟，时钟每秒不断更新多次。程序从时钟读取时间，并将其作为随机数生成器的种子值。每当玩家运行程序时，她都会获得一个不同的随机数序列。\n\
  \n程序还可以将特定值设置为随机数生成器的种子，如下：\n\n点击此处查看代码图像\n\n```\nRandom repeatable = new Random(1);\n\
  ```\n\n此语句将导致随机数生成器在每次使用时都产生完全相同的值序列。这是一个非常有用的功能。我恰好知道（因为我尝试过），如果你像上面的代码那样使用种子值\
  \ 1，那么第一次掷骰子将产生值 2。\n\n一些电脑游戏在其游戏世界的部分使用了过程生成（procedural generation）技术。例如，不是让游戏记住草哪些部分是绿色的哪些部分是棕色的，而是使用固定的随机数序列，这意味着每次每次运行时地面看起来都是样的，但所需的数据存储量极小。我也使用过这种技术来让游戏角色以每次玩游戏都重复的方式行为，这让玩家能够通过学习角色的行为来取得进展。如果我们对随机定位使用固定种子，就意味着球的起始位置在每次玩游戏时都会遵循相同的序列。这可能是一件好事，因为它鼓励玩家练习游戏并学习该序列。\n\
  \n### 生成随机球起始位置\n\nKeep Up! 游戏包含一个名为 `resetGame` 的方法，它为新游戏做好了准备工作。\n\n![Image](img/412fig01.jpg)\n\
  \n目前，该方法将球的左边缘设置为 0，这样球在游戏开始时位于屏幕的左角。但我们可以使用随机数生成器来使用一个预测性更低的起始位置。\n\n点击此处查看代码图像\n\
  \n```\nRandom ballPosition = new Random(1);\n```\n\n这是用于球位置的随机数生成器。我给它一个固定的种子，以便在每次玩游戏时初始球位置的序列都是相同的。在\
  \ `resetGame` 方法内部，我们可以每次使用这个随机数生成器计算一个新的新的起始位置。\n\n![Image](img/413fig01.jpg)\n\
  \n我们不希望游戏将球放置在屏幕边缘之外，因此可能的位置范围实际上是屏幕宽度减去球的宽度。一旦有了可用宽度，我们通过乘以 0 到 1 之间的随机数来计算随机宽度值，这正是\
  \ `Next` 方法提供的。这为球提供了一个起始位置。\n\n还有许多其他地方可以添加随机性。\n\n***\n\n![Image](img/happen.jpg)\
  \ 让事情发生：制作 Keep Up\n\n你可以将 Keep Up! 游戏作为你自己游戏的起点。第一步可以是更改游戏使用的图像，并可能添加背景图片。你可以改变球和玩家交互的方式，根据它击中球拍的哪个部分来向另一个方向移动。你可以添加一个玩家必须避开的球，如果碰到它就会立即游戏结束。当玩家获得特定分数后，球会出现。你可以让球拍随着游戏的进行而缩小，或者让它变大并在球拍碰到屏幕边缘时玩家失去生命。你可以改变球拍和球的速度，让球拍随着游戏的进行移动得越来越慢。你可以查看\
  \ Keep Up! 代码内部，找到创建令人深刻的分数的秘密（如图 13-5 所示 (ch13.html_ch13fig05))）。有很多可以做的事情来让游戏属于你。\n\
  \n记住，你也可以在游戏中使用所有其他 Snaps 方法，这样你就可以游戏结束时发出有关游戏状态的消息，甚至在一天中运行得更慢（或更改屏幕颜色）。\n\n***\n\
  \n### 你学到的\n\n在本章中，你学习了如何使用程序制作游戏，以及即使是简单的游戏行为也可以创造有趣且具有竞争性的体验。你发现了如何获取游戏中的用户输入，并利用此控制对象在游戏环境中的位置。你看到了“边界限制”（clamping）的重要性，以确保对象保持在特定的范围内，以及如何通过检测两个对象相交来让它们相互作用。你现在还可以为游戏添加声音，让游戏过程更加愉快。\n\
  \n\n\n\n\n这里是一些你可能想要针对游戏开发思考的问题。\n\n### 这些都关乎游戏吗？\n\n绝对不是。举来说一个例子，你在本章中看到的文本处理技术在许多与游戏无关的情况下都大大用用场。你可以使用这种技术在任何程序中显示动画消息。用户现在期望用户界面中有动画效果，而你所学的知识为计算机程序如何在图形环境中操作对象提供了坚实的基础。如果你开始使用我在第\
  \ 16 章中介绍的 `XAML`（可扩展应用程序标记语言）创建用户界面，你可以在此基础上进行构建。\n\n### 游戏必须好看好看吗？\n\n毫无疑问，精美的美术会让游戏玩起来更有趣。但不可否认的事实是，视觉视觉效果并不能让游戏变得好玩。最早电脑游戏的图形元素尽可能少，但有数百万人在玩。计算机游戏的历史中充满了视觉上精美的作品，但因为它们不好玩，没有人真正喜欢它们。\n\
  \n### 我如何制作出一个出色的游戏？\n\n我的强烈建议是：先做一个能运行的东西，然后对其进行小改。始终保持一个可运行的游戏版本供人们尝试，并仔细听取他们的意见。不要等你完成了全部\
  \ 15 个关卡，而在前三个关卡完成后就找一些人玩玩，然后根据他们的反馈修改游戏的其余部分。不要只依赖朋友和家人的意见。他们会说喜欢你的游戏是因为他们喜欢你。如果你最的敌人都得承认你的游戏非常好玩，你就知道你手里握着一个冠军。并且不断尝试。\n\
  \n## 14. 游戏与对象层次结构\n\n![Image](img/14fig00.jpg)\n\n* *\n\n### 你将学到\n\n在过去的几个章节中，我们的重点从“如何告诉计算机去做事情”转向了“如何管理复杂性”。我们从考虑程序可以执行的操作开始，然后处理数据集合，并创建结构和类来帮助将数据封装成有意义的对象。在本章中，你将通过构建一个游戏来扩展你面向对象技术的知识。你将学习的技术可以应用于远超游戏的领域，但游戏是探索这些技术的非常有的地方。\n\
  \n我们将首先查看 `inheritance`（继承），这种技术可以让你避免在类内部重复代码元素。然后，我们将探索如何从一组协作的对象创建出复杂的游戏。\n\n\
  - 游戏与对象：太空中的太空火箭\n- 设计类层次结构\n- 你所学过的\n\n* *\n\n### 游戏与对象：太空中的太空火箭\n\n在本节中，我们将开始构建一种新类型的太空射击游戏——太空中的太空火箭（Space\
