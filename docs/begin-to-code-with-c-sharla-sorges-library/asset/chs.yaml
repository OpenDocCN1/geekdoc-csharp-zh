  \ `8 GB` 或更多。\n• 完整的 `Visual Studio 2015 Community` 安装程序大约占用 `8 GB` 的硬盘空间。\n\n对图形显示没有特殊要求，尽管更高分辨率的屏幕可以让你在编写程序时看到更多内容。`Snaps`\
