  ```\n\n现在，`Contact` 类的用户唯一能做的增加时间。我们的律师客户会非常喜欢这个功能，因为这意味着行为不当的程序无法丢失她与联系人相处的分钟。\n\
  \n这条语句向与 Rob 相处的时间增加了 30 分钟。这种方法可以作为更安全解决方案的基础——更改分钟数的唯一方法是调用那个向其增加时间的方法：\n\n```csharp\n\
  rob.AddMinutes(30);\n```\n\n使用此类方法是一种非常流行的编程模式。对象中的数据（我们真正关心的值）存储在私有成员中。这意味着数据项对于运行在对象外部的代码是不可直接的。然而，控制数据访问的方法被公开，以便可以使用它们更改数据并读回值。程序员喜欢拥有控制权，这种设计模式在程序对变量进行更改时为他们提供了控制权。\n\
