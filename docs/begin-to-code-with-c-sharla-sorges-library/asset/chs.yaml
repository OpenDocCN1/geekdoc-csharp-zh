  ```\n\n### Ch07_06_ProperlyNumberedStand\n\n这个版本显式地创建了一个用于显示消息的计数器（`displayCount`）。代码中还包含了一条解释为什么要这么做的注释。我认为这是一种更具专业水准的代码。有些程序员可能会说这段代码的效率较低，因为我在每次循环中都创建了一个新变量，但事实可能并非如此。现在的编译器在优化程序创建方式方面非常出色。无论如何，我非常愿意用极少量的计算机算力换取可读性的巨大提升。\n\
