  \n接的一组语句展示了如何使用这些方法。程序序列获取 Rob 与律师相处的分钟数，在该值基础上加上 10，然后将结果存回对象中。在任何时候，`Contact`\
  \ 对象外部的代码都无法直接与 `contactMinutesSpent` 变量交互，但它可以调用对象中提供访问支持的公共方法。\n\n![Image](img/342fig02.jpg)\n\
  \n然而，到目前为止，`SetMinutesSpent` 方法并不能程序设置无效的 `ContactMinutesSpent` 值。它只是简单地将参数提供的值复制到\
