  \ `Xbox One` 和 `Xbox 360` 控制器。\n\n`Visual Studio 2015 社区版` 是一款免费提供的应用程序，可以在 `Windows\
  \ 10` 电脑上创建 `C#` 程序。如果你电脑上已经有了较早版本的 `Visual Studio`（例如 `Visual Studio 2013`），恐怕你无法在学习本书中使用它。然而，`2015`\
  \ 版本的 `Visual Studio` 可以与现有的安装并存运行。在第 1 章中，我提供了一个关于如何安装 `Visual Studio` 并启动它的详细说明链接。为了使用\
  \ `Visual Studio`，最好有一个 `Microsoft` 账户，以便可以为你分配一个开发许可。\n\n#### 下载\n\n`Visual Studio\
  \ 2015 社区版` 是一款免费提供的应用程序，可以在 `Windows 10` 电脑上创建 `C#` 程序。如果你电脑上已经有了较早版本的 `Visual\
  \ Studio`（例如 `Visual Studio 2013`），恐怕你无法在学习本书中使用它。然而，`2015` 版本的 `Visual Studio`\
  \ 可以与现有的安装并存运行。在第 1 章中，我提供了一个关于如何安装 `Visual Studio` 并启动它的详细说明链接。为了使用 `Visual Studio`，最好有一个\
  \ `Microsoft` 账户，以便可以为你分配一个开发许可。\n\n（注：由于提供的原文中存在大量重复内容，根据指令“一定不要重复输出原文”的原则，此处仅展示翻译逻辑，实际操作中应根据原文逻辑结构进行去重。以下为针对提供的逻辑文本的完整展开翻译。）\n\
  \n---\n\n**翻译：**\n\n[content]\n现在已经没有人从零开始构建程序了。所有的软件都是使用已经构建好的软件部分构建的。如果一个程序想要显示文本、发出声音或播放某些视频，它只需请求另一个程序来完成即可。每种流行的计算机语言的背后都有一个庞大的现有代码库支持，而程序员需要理解的事情之一就是如何使用这些库以及由他人编写的软件。\n\
  \n我专门为这本书创建了 `Snaps` 库。它提供了一系列易于使用且能够相互配合的功能性行为。你将在你的第一个程序中使用 `Snaps` 库。在书的后续部分，你将发现其他可以使用的功能库，你可以使用它们来构建程序。\n\
  \n使用 `Snaps` 的程序运行在 `Snaps` 引擎内部，该引擎是一个自包含的环境，在这个环境中，程序可以发送消息、获取用户输入、绘制图像、发出声音，甚至查询天气状况。\n\
  \n我会提供关于 `Snaps` 如何工作的示例，然后由你来发现你能创作出什么内容。我们将遵循的原则是：“如果你不能用编程来让你的朋友和家人印象深刻，那么编程有什么意义呢？”我真的希望你能写出一些令自己惊叹的程序，甚至可能将它们发布供他人欣赏。\n\
  \n* * *\n\n![Image](img/common.jpg) 程序员观点：一切都构建在别人的代码之上\n\n第一个“程序员观点”是关于一个优秀的程序员可以多“创造性地偷懒”，这似乎很恰当。如果他们能找到使用已经写好的程序的方法，他们永远不会自己写一个程序。（为什么要重造轮子呢？）我提供的\
  \ `Snaps` 就是这样一个例子。你将在书的后续部分查看其中一些的内部，并发现它们本身也使用了其他的库。\n\n* * *\n\n### 软件与硬件 \n\n\
  你需要一台电脑和一些软件来运行书中的程序。恐怕我无法为你提供电脑，但在第一章中，你将发现哪里获取 `Visual Studio 2015 社区版`，这是你将用它来创建程序的免费软件。你还将学习从哪里下载\
  \ `Snaps` 库以及我们将检查和使用的演示代码。\n\n你使用的电脑必须运行 64 位的 `Windows 10` 操作系统。以下是其他要求：\n\n•\
