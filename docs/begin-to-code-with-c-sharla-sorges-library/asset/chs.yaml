  \n\n\n\n```csharp\nthis.name = value;\n\n}\n```\n\n`set` 行为执行了两个件事：它显示一条消息以便我们观察它的运行过程，然后它将\
  \ `name` 成员的值设置为赋值给属性的任何。`set` 行为使用了一个新的 C# 关键字 `value`，该值是 `set` 操作所赋值的值。在我们的示例程序中，`value`\
  \ 关键字被设置为“Robert”，因为这就是被赋值的值。你可以将 `value` 关键字看作类似于方法调用中的参数；它被赋予的值是输入到赋值语句中的任何值。这个版本的\
  \ `set` 行为使用该值来立即设置名称，但我们可以在这里添加一些验证逻辑，以拒绝无效的名称——事实上，我们稍后会这样做。\n\n当使用 `get` 行为时，过程反过来了：\n\
  \n点击此处查看代码图片\n\n```csharp\nstring name = rob.ContactName;\n```\n\n从属性读取值会触发 `get`\
  \ 行为的运行。该行为*必须*返回属性类型对应的值，在本例中是一个字符串。\n\n点击此处查看代码图片\n\n```csharp\nget\n{\n    SnapsEngine.DisplayString(\"\
  Getting the value of the name\");\n    return this.contactName;\n}\n```\n\n与 `set`\
  \ 行为一样，我添加了一条语句来显示消息，展示正在发生的情况。在最终程序中，这些消息将不会显示，但你可以运行示例程序并观察执行是如何流过的。\n\n如果这让你有点困惑，请记住，我们添加\
  \ `Name` 属性是为了让其他程序能够获取联系人的 `Name` 值，但我们也想控制名称中文本更改的方式。例如，我们可以修改 `set` 行为，使其拒绝空字符串作为名称：\n\
  \n点击此处查看代码图片\n\n```csharp\nset\n{\n    if (value != \"\")\n        this.contactName\
  \ = value;\n}\n```\n\n这个版本只有在有名称可设置时才会设置名称；否则，名称的值不会发生改变。`Contact` 类的用户可以非常容易地读取和写入\
  \ `Name` 属性，但对名称值的更改受到了控制，以确保 `Contact` 类始终持有可以被视为有效的名称。\n\n***\n\n![图像](img/wrong.jpg)\
  \ 可能会出什么问题：检测无效更改\n\n使用属性来保护对象中持有的值可以防止坏事发生在值上。如果我们使用上面所示 `Name` 属性 `set` 行为，我们就可以完全确定\
  \ `Contact` 对象的用户无法将联系人的名称设置为空字符串。然而，对象的用户永远不知道自己做错了什么。这条语句将在没有任何任何问题的情况下运行。它不会正确地设置名称，但程序会平平安无事地继续运行。\n\
  \n```csharp\nrob.ContactName = \"\";\n```\n\n我不喜欢这种行为。我不希望程序的用户认为他们执行的操作已经成功了，而实际上它并没有成功。这里的难点在于，`set`\
  \ 属性没有办法指示它收到的值是错误的。它唯一能做的就是抛出一个异常：\n\n点击此处查看代码图片\n\n```csharp\nset\n{\n    if (value\
  \ == \"\")\n        throw new Exception(\"Invalid name: \" + value);\n\n    this.name\
  \ = value;\n}\n```\n\n这是一个带有态度的 `set` 行为。如果 `set` 行为不喜欢提供的名称值，它将通过抛出异常来拒绝该值。我们之前在第\
  \ 9 章中见过 `Exception` 对象，在那里我们通过抛出异常来防止创建无效的音符。在这里，我们使用它来拒绝无效的名称。抛出异常的结果是停止程序流；在书的后后部分，你将发现程序如何捕获并处理异常，但目前我们将异常视为一种在检测到出现问题时防止程序继续运行的方法。\n\
  \n***\n\n#### 使用属性强制执行业务规则\n\n如果你思考过软件创作的艺术（你确实应该这样做），你正在设计一个系统，使其行为方式符合我们律师客户的逻辑。如果你问她，她会对什么构成了客户的有效名称有意见。她可能会说类似：“名称不能是空字符串”，这很有用，因为这正是我们的\
  \ `Name` 属性所强制的。\n\n我将这些语句称为“业务规则”，因为它们是我们系统必须执行的约束。在与客户合作的任何项目中，最重要的部分之一就是去寻找业务规则，并利用它们来构建你正在做的工作的规范。\n\
  \n一旦你有了业务规则，你就可以创建执行这些规则的软件。我使用一种特定的方法模式来实现。我的模式从一个 `validate` 方法开始：\n\n点击此处查看代码图片\n\
  \n```csharp\nstatic public string ValidateName(string newName)\n{\n    if (newName\
  \ == \"\")\n        return \"A name cannot be an empty string\";\n\n    return \"\
  \";\n}\n```\n\n该方法基于“没消息就是好消息”的原则。如果它认为输入是有效的，则返回一个空字符串；如果无效，则返回一个错误消息（“名称不能是空字符串”）。\n\
  \n接下来我是在我的 `set` 行为中使用该方法：\n\n点击此处查看代码图片\n\n```csharp\nset\n{\n    string message\
  \ = ValidateName(value);\n    if (message != \"\")\n        throw new Exception(message);\n\
  \n    name = value;\n}\n```\n\n如果验证失败，`set` 行为将抛出一个包含名称被拒绝原因的异常。我的理论是，异常几乎不会产生，因为一个周到的开发者会先使用\
  \ `ValidateName` 方法确保他的更改是有效的。循环只有在用户输入有效名称时才会完成。\n\n![图像](img/350fig01.jpg)\n\n\
  ***\n\n![图像](img/analysis.jpg) 代码分析：为什么 `ValidateName` 方法是静态的？\n\n你可能注意到 `ValidateName`\
  \ 方法被标记为 `static` 方法。这意味着它是 `Contact` 类的成员，而不是实例的一部分。\n\n**问题：** 为什么 `ValidateName`\
  \ 方法是静态的？\n\n**答案：** 要理解这种设计选择，你首先需要确定 `static` 的含义。`static` 关键字使类的成员“始终存在”。它是类的一部分，而不是类实例的一部分。像\
  \ `AddMinutes` 这样的方法不能是静态的，因为程序会调用 `AddMinutes` 为特定的实例添加某些分钟。然而，`ValidateName` 行为并不针对任何特定的\
  \ `Contact` 实例，当你恰好没有 `Contact` 实例时，可以使用这个方法是非常用的。\n\n***\n\n### 管理对象构造过程\n\n我刚刚描述的模式可以用于确保对象中数据的更改符合应用程序所需的业务规则。如果律师决定只允许存储具有四个字母的名称，我们可以更改\
  \ `ValidateName` 方法来强制执行这一要求。然而，我们还有另一个地方需要考虑验证，那就是在构造对象时：\n\n点击此处查看代码图片\n\n```csharp\n\
  Contact badNews = new Contact(name: \"\", address:\"\", phone: \"\");\n```\n\n\n\
  \n\n上述语句将创建一个`name`、`address`和`phone number`成员完全空的 `Contact` 值。这是一件糟糕的事情，并且会完全破坏我们所有的业务规则。修复此问题是在构造函数中使用验证行为。\n\
  \n点击此处查看代码图片\n\n```c\npublic Contact(string name, string address, string phone)\n\
  {\n    // errorMessage 包含完整的错误信息\n    string errorMessage = \"\";\n\n    // error\
  \ 包含每次验证产生消息\n    string error;\n\n    // 验证姓名\n    error = ValidateName(name);\n\
  \    // 如果姓名无效，错误字符串将保存原因\n    if (error != \"\")\n        // 如果执行到这里，说明姓名存在错误\n\
  \        errorMessage = error;\n\n    // 验证地址\n    error = ValidateAddress(address);\n\
  \    // 如果地址无效，错误字符串将保存原因\n    if (error != \"\")\n        // 如果执行到这里，说明地址存在错误\n\
  \        // 将添加到错误报告中\n        errorMessage = errorMessage + error;\n\n    // 验证电话号码\n\
  \    error = ValidatePhone(phone);\n    // 如果电话号码无效，错误字符串将保存原因\n    if (error !=\
  \ \"\")\n        // 如果执行到这里，说明电话号码存在错误\n        // 将添加到错误报告中\n        errorMessage\
  \ = errorMessage + error;\n\n    // 如果错误信息不是空字符串，说明出了问题\n    if (errorMessage !=\
  \ \"\")\n        // 通过抛出异常来放弃构造\n        throw new Exception(errorMessage);\n\n\
  \    this.ContactName = name;\n    this.ContactAddress = address;\n    this.ContactPhone\
  \ = phone;\n    this.contactMinutesSpent = 0;\n}\n```\n\n类的构造方法在创建类的新实例时被调用。在上面的代码中，构造函数对所提供的每个项目使用验证方法来创建一个新的联系人。如果任何验证方法失败，验证产生的错误将添加到一个复合错误消息中，该消息将准确描述构造失败的原因。然后，此错误消息将作为异常抛出，以便由尝试创建新联系人的程序捕获并用于错误报告。\n\
  \n### 捕获并处理异常\n\n我已经讨论过通过抛出异常作为停止程序运行的方法，但我还没有涵盖程序如何处理可能抛出的异常。C# 语言提供了可以用于捕获异常的\
  \ `try/catch` 结构。可以使用它在创建新联系人时显示适当的消息。\n\n![图像](img/353fig01.jpg)\n\n如果用户输入有效的联系人信息，`Contact`\
  \ 类的构造函数就不会抛出异常，程序也不会执行 `catch` 块中的任何语句。相反，它将直接进入方法末部的 `SnapsEngine.WaitForButton`\
  \ 调用。然而，如果传递构造函数的数值之一无效，就会抛出异常，执行将立即转移到 `catch` 关键字之后的块。\n\n***\n\n![图像](img/analysis.jpg)\
  \ 代码分析：为什么联系人不是总是被存储？\n\n你团队中的一名程序员热于了解异常是如何工作的，她一直在研究 `newContact` 方法的代码。然而，她对代码的以下部分有一个特殊的问题：\n\
  \n点击此处查看代码图片\n\n```csharp\ntry\n{\n    newContact = new Contact(name: name, address:\
  \ address, phone: phone);\n    storeContact(newContact);\n    storeAllContacts();\n\
  \    SnapsEngine.DisplayString(\"Contact stored\");\n}\n```\n\n她认为这个程序是错误的，因为如果提供构造函数的姓名、地址或电话信息无效，构造函数将抛出异常。然而，一旦异常被处理，程序将继续执行下一个语句并存储一个无效的联系人。\n\
  \n**问题：** 为什么你的同事是错了？\n\n**答案：** 一旦抛出异常，发生点之后的所有语句都会被跳过。\n\n你向同事解释异常会阻止任何语句的执行，但她又问了一个问题。\n\
  \n**问题：** 如果 `storeContact` 或 `storeAllContacts` 抛出异常会怎样？\n\n**答案：** 如果其中一个方法抛出异常，程序将转移到\
  \ `catch` 块。异常处理器无法“知道”导致异常的原因，但可以使用异常的 `Message` 属性来传递描述发生故障的消息。例如，如果无法保存联系人，它可以生成一个异常以便查看。\n\
  \n点击此处查看代码图片\n\n```csharp\nthrow new Exception(message: \"Contact could not be saved\"\
  );\n```\n\n**问题：** 异常处理器如何知道是什么导致了异常？\n\n**答案：** 在 `newContact` 方法的情况下，抛出异常有三种可能的原因：联系人的姓名、地址或电话号码可能无效；无法在内存中存储新联系人；或者无法存储所有联系人。`catch`\
  \ 代码目前通过仅显示抛出的消息来处理此。如果你想让程序对不同的异常采取特定操作，你必须将每个语句放在它自己的 `try` 块中。\n\n\n\n\n上一个例子恰恰说明了这一点。从编程的角度来看，在我们创建某个东西失败时显示所有错误是一个好主意，但从用户的角度来看，他们更倾向于在产生错误的地方尽可能近地识别出错误。\n\
  \n在使用一个新系统时，你需要做的一件事就是强迫自己使用一段时间，或者更好的是，让你妈妈来帮你测试它。我经常发现，我在编写代码时做出的设计决定会让程序在现实生活中变得非常难用。我会强迫自己花一或两个小时专门运行我的新程序，以尝试发现并消除这些错误。如果我能让其他人使用这个程序，我将获得更好的反馈，因为他们并不知道程序是如何工作的，并且会犯下我甚至无法想象的错误。当然，事实证明，我往往需要编写更多的代码——就像我们在创建一个新联系人时必须添加额外的循环一样。然而，这些变化对用户的体验产生了巨大的影响，并最终将体现在更高的评分和更多的销售额上。\n\
  \n***\n\n### 将图保存到文件中\n\n到目前为止，我们的程序存储的数据都是基于 C# 变量的。我们以这种方式存储了整数、浮点数和字符串。然而，图片是一个庞大得多的复杂对象，通常存储在文件中。\n\
  \nSnaps 框架提供了程序可以使用的方法来将绘图保存为图像。图像存储在文件的方式与你的数码相机在拍照时存储图片的方式相同。使用的图形文件格式是 `PNG`（便携网络图形的缩写）。许多程序都可以处理\
  \ `PNG` 文件。\n\n让我们看看可以使用哪些方法来存储绘图程序中的图形。通过使用这些方法，你可以开始创建一个绘图日记。\n\n#### SaveGraphicsImageToFileAsPNG\n\
  \n`SaveGraphicsImageToFileAsPNG` 方法将当前绘图保存到用户计算机上的文件中。用户会被提示文件应该存储在何。\n\n以下程序绘制了一个灰点，然后将图片保存到宿主机计算机上。随后，使用标准的“文件另存”对话框询问文件应该存储在何，如图\
  \ 11-1，你可以在那里看到我测试的结果。\n\n点击此处查看代码图像\n\n```csharp\nusing SnapsLibrary;\n\nclass\
  \ Ch11_06_SaveGraphics\n{\n    public void StartProgram()\n    {\n        SnapsEngine.DrawDot(x:\
  \ 100, y: 100, width: 50);\n        SnapsEngine.SaveGraphicsImageToFileAsPNG();\n\
  \    }\n}\n```\n\n![Image](img/11fig01.jpg)\n\n图 11-1** 使用“另存为”对话框保存的图形文件。\n\n如果你想存储单个绘图，可以使用\
  \ `SaveGraphicsImageToFileAsPNG` 方法，但绘图日记背后的想法是程序将自动存储文件，而无需用户选择目的地。为了做到，你必须使用与本地存储配合的方法。\n\
  \n#### SaveGraphicsImageToLocalStoreAsPNG\n\n通用 Windows （Universal Windows Application），如我们一直在编写的那些程序，在宿主机计算机的文件存储中有其自己的私有空间。应用程序可以向该私有存储区域写入任意数量的文件，但该存储区域特定于该应用程序，对设备上的任何其他程序都是不可见的。此外，不允许应用程序直接与计算机中其他部分的文件进行交互。\n\
  \nSnaps 库包含一个方法，可将当前显示的图形存储在本地存储的一个文件中。该方法 `SaveGraphicsImageToLocalStoreAsPNG`\
  \ 接收要创建的文件名。以下是一个将图像保存为名为 `test.png` 的本地文件的文件的语句。\n\n点击此处查看代码图像\n\n```csharp\nSnapsEngine.SaveGraphicsImageToLocalStoreAsPNG(\"\
  test.png\");\n```\n\nCh11_07_SaveGraphicsLocal\n\n用户无法在其计算机的普通文件存储中找到此文件，但这不是问题，因为绘图应用程序可以访问这些文件，并在需要时显示它们。\n\
  \n#### LoadGraphicsPNGImageFromLocalStore\n\n当 Snaps 想要显示本地图像的内容时，它使用 `LoadGraphicsPNGImageFromLocalStore`\
  \ 方法：\n\n![Image](img/358fig01.jpg)\n\n此代码段打开文件 `test.png` 中的图像并在屏幕上显示它。如果找不到图像，该方法返回值\
  \ `false`。在程序中，我们使用该返回值来触发错误消息。如果你在运行 Ch11_07_SaveGraphicsLocal 之前运行此程序，或者使用与 `test.png`不同的文件名，你将看到错误行为生效。\n\
  \n这些方法为绘图日记应用程序如何保存和查看简单图形提供了基础，但每个要保存的绘图都需要一个文件名。分配唯一文件名的一种良好方法是使用我们以前未见过的数据结构——`DateTime`\
  \ 结构。该结构提供了许多实用的行为。\n\n#### DateTime 结构\n\n许多程序需要处理日期和时间，因此 C# 的设计者创建了一个可以表示特定日的结构。\n\
  \n***\n\n***\n\n![Image](img/analysis.jpg) 代码分析：结构体与类\n\n**问题：** 理解结构体和类的区别以及何时该使用它们对你非常重要。\n\
  \n**回答：** `DateTime` 对象应该始终按值进行操作，而不是作为按引用管理的对象。一个给定的 `DateTime` 值描述一个独特的时间点，并且通常是另一个对象的属性——例如拍摄时的日期时间。我们不希望这些值被引用管理；它们应该是它们所描述的对象的一部分。C#\
  \ 的设计者将 `DateTime` 设计为结构以反映这一点。当你创建自己的对象时，也需要考虑这一点。不要把一切都制成类。\n\n`DateTime` 结构位于\
  \ `System` 命名空间。每当你使用该结构时，都可以使用限定名称（`System.DateTime`），但更简单的方法是包含 `using` 语句告诉 C#\
  \ 编译器你想使用 `System` 命名空间：\n\n```csharp\nusing System;\n```\n\n***\n\n#### 获取当前日期\n\
  \n`DateTime` 结构提供了一个名为 `Now` 的静态属性，它以 `DateTime` 对象的形式返回当前日期。你可以使用该属性创建一个显示数字钟的\
  \ Snaps 程序：\n\n![Image](img/360fig01.jpg)\n\n此程序包含一个永远不会结束的 `while` 循环。在循环内部，程序读取日期时间并将其显示在屏幕上。它使用\
  \ `ToString` 方法请求 `DateTime` 值返回一个描述显示的日期时间值的字符串。\n\n循环中还包含对 Snaps `Delay` 方法的调用。该调用在每次循环运行时会将程序延迟一秒。如果没有延迟，程序将以其最快的速度运行循环，这将为运行程序的计算机提供相当的工作量。由于时间显示显示的是秒值的跳动，因此没有必要比每秒更快地更新显示。程序使用\
  \ `Delay` 方法允许其他程序运行，直到需要更新时间。\n\n\n\n\n\n### 渐变的日期和时间显示\n\n如果你运行上方时钟程序，你会发现，除非另指定，否则\
  \ Snaps 的 `DisplayString` 方法会缓慢地渐入正在显示的文本。这在大多数情况下都是没问题的，因为用户不喜欢显示内容的突然变化。然而，如果你想显示一个跳动的时钟，你需要的新的日期和时间立即显示，而不是渐入。我们可以调用\
  \ `DisplayString` 方法的另一个版本，并要求它不要渐入文本：\n\n点击此处查看代码图像\n\n```\nSnapsEngine.DisplayString(message:currentDateAndTime.ToString(),\n\
  \    alignment: SnapsTextAlignment.center,\n    fadeType: SnapsFadeType.nofade,\n\
  \    size: 50);\n```\n\n`Ch11_10_DigitalClockNoFade`\n\n这是 `DisplayString` 方法的重载版本，接受另外三个参数，允许我们指定文本的对齐方式、使用的渐变类型以及文本的大小。\n\
  \n如果你运行示例程序 `Ch11_10_DigitalClockNoFade`，你会发现秒数以一种令人印象深刻的方式跳动。50 的文本大小也为显示提供了一个合适的大小，如\
  \ `Figure 11-2` 所示。\n\n![Image](img/11fig02.jpg)\n\n**图 11-2** 一个用 Snaps 构建的简单数字时钟。\n\
  \n### 使用日期时间创建文件名\n\n我们想使用日期和时间为我们的图形创建一个唯一的文件名。这是数字相机每次拍照时都会做的事情。遗憾的是，`DateTime`\
  \ 结构提供的 `ToString` 方法返回的是包含冒号的时间描述字符串，而冒号在文件名中是非法的。相反，你可以要求 `DateTime` 值给你一个表示该日期和时间的数字。`DateTime`\
  \ 结构提供了一个名为 `ToFileTime` 的方法，它返回一个长整数值，该值由编码为单个值的日期信息组成。（`ToFileTime` 方法之所以这样命名，是因为时间数据的格式与\
  \ Windows 操作系统用于存储文件存储文件中时间戳的格式相同。）该值是如何构造的并不重要；你只需要知道，如果将此值转换为字符串，你就可以该字符串作为要存储的文件名。\n\
  \n![Image](img/362fig01.jpg)\n\n### 创建 Drawing 类\n\n在创建文件名并保存每个图形后，我们必须考虑如何再次获取已保存的文件。一种方法是创建一个\
  \ `Drawing` 类，它将包含给定图形的 `DateTime` 值。该类还可以管理图形的保存和加载。\n\n![Image](img/362fig02.jpg)\n\
  \n`Drawing` 类包含一个数据成员，即该图形的 `DateTime` 值。`Drawing` 类有两个公共方法。一个保存当前图形，另一个方法用于在屏幕上显示已保存的图形。\n\
  \n以下是程序如何创建一个新的 `Drawing` 然后使用它存储图形的方法。\n\n点击此处查看代码图像\n\n```\nDrawing record = new\
  \ Drawing();\nrecord.StoreGraphicsNow();\n```\n\n当程序想要显示图形时，它只需要调用 `ShowStoredGraphics`\
  \ 方法。\n\n```\nrecord.ShowStoredGraphics();\n```\n\n***\n\n![Image](img/analysis.jpg)\
  \ 代码分析：查看 `Drawing` 类\n\n**问题：** 我们将如何使用 `Drawing` 项目来存储图片？\n\n**回答：** 你可以将每个 `Drawing`\
  \ 项目想象成类似于 Time Tracker 应用程序中的 `Contact`。它包含一个识别特定图形的成员。你可以将图形列表存储在 JSON 字符串中，并使用它来查找图形——就像你曾在\
  \ Time Tracker 应用程序中存储联系人项目列表一样。\n\n**问题：** 如果你如此担心对象中数据的保护，为什么 `Drawing` 类的 `date`\
  \ 成员不是私有的呢？\n\n**回答：** 如果我们想使用 JSON 序列化器来存储 `Drawing` 值，我们必须允许在序列化过程中设置日期和时间。这意味着数据成员必须设为公有，以便在加载时可以设置它的值。如果我真的认真安全，我会使用一个类（可能称为\
  \ `DrawingJson`）来管理保存和加载行为，以及另一个类（可能称为 `SecureDrawing`），它对内部持有的数据有完全的保护。\n\n**问题：**\
  \ 为什么图形的文件名是类的属性？每次需要时直接从 `date` 属性创建创建文件名字符串难道不会更快吗？\n\n**回答：** 丰富的程序员试图确保他们只在一个地方执行某项特定任务。这并不是为了提高性能，而是为了如果我们需要更改行为（也许为了修复\
  \ bug），我们只需要在一个地方进行更改。\n\n***\n\n### 创建图形列表\n\n存储单个图形是很棒的，但绘画日记需要考虑许多图形。我们可以通过创建一个\
  \ `Drawing` 值的列表来实现这一点。每当保存一个新图形时，它就会被添加到程序持有的图形列表中。\n\n```java\nList<Drawing> drawings;\n\
  ```\n\n上述语句创建了列表。当程序启动时，将会。\n\n![Image](img/364fig01.jpg)\n\n`LoadDrawings` 方法加载所有图形。当方法首次运行时，将会。\n\
  \n![Image](img/364fig02.jpg)\n\n### 使日记\n\n现在我们有了存储和加载图形的方法，我们可以创建剩余的方法。\n\n`StoreDrawing`\
  \ 方法创建一个新的 `Drawing` 值，使用它存储图形，然后清除屏幕。\n\n![Image](img/365fig01.jpg)\n\n`Displayings`\
  \ 方法遍历列表，请求每一个显示。它在每个图形之间暂停一秒。当显示完毕后，该方法清除屏幕，准备好下一个图形。\n\n点击此处查看代码图像\n\n```\nvoid\
  \ Displayings() {\n    foreach (Drawing d in drawings) {\n        d.ShowStoredGraphics();\n\
  \        SnapsEngine.Delay(1);\n    }\n    SnapsEngine.ClearGraphics();\n}\n```\n\
  \n`DisplayHelp` 方法正如其名。它告诉用户如何使用程序。这里的主意是用户在屏幕上画画，并在想要执行命令时触摸左上角。\n\n点击此处查看代码图像\n\
  \n```\nvoid DisplayHelp() {\n    SnapsEngine.SetTitleString(\"Drawing Diary\");\n\
  \    SnapsEngine.DisplayString(\"触摸左上角显示菜单\");\n    SnapsEngine.Delay(3);\n    SnapsEngine.SetTitleString(\"\
  \");\n    SnapsEngine.DisplayString(\"\");\n}\n```\n\n`DrawDotsUntilDrawInCorner`\
  \ 方法与我们在 9 章中使用的绘制方法非常相似。它等待用户触摸屏幕或点击鼠标进行绘制。然后它在位置画一个点。如果用户在屏幕左上角（距离角落 50 像素内）处绘图，该方法返回。\n\
  \n![Image](img/366fig01.jpg)\n\n`ProcessCommand` 方法接收用户的命令并调用所需方法执行命令。用户可以清除屏幕、将图形图像保存为绘画，并播放所有当前图形。\n\
  \n点击此处查看代码图像\n\n```java\nvoid ProcessCommand() {\n    string command = SnapsEngine.SelectFrom3Buttons(\"\
  Clear\", \"Save\", \"Play\");\n    switch (command) {\n        case \"Clear\":\n\
  ```\n\n\n\n\n\n```javascript\nSnapsEngine.ClearGraphics();\nbreak;\ncase \"Save\"\
  :\n    StoreDrawing();\n    break;\ncase \"Play\":\n    DisplayDrawings();\n   \
  \ break;\n}\n}\n```\n\n这是完整的程序。它从加载图形、设置绘图颜色开始，然后反复允许用户绘图并输入命令。最终程序使用了许多微型方法。我认为这是一种组织代码的非常好方法。它让导航变得非常容易。如果客户要求你添加额外的命令（例如允许她选择不同的绘图颜色），那么这段代码应该放在哪里是显而易见的。每个方法都有一个合理的名字，让另一个程序员能够很容易地熟悉程序。\n\
  \n点击此处查看代码图像\n\n```csharp\npublic void StartProgram()\n{\n    LoadAllDrawings();\n\
  \    SnapsEngine.SetDrawingColor(SnapsColor.Blue);\n    DisplayHelp();\n    while\
  \ (true)\n    {\n        DrawDotsUntilDrawInLeftCorner();\n        ProcessCommand();\n\
  \    }\n}\n```\n\nCh11_11_ 绘图日志\n\n* * *\n\n![Image](img/happen.jpg) 让事情发生：制作一个胡须生成器大者画廊\n\
  \n你现在可以使用你所学的知识创建一个胡须编辑程序，它可以让你加载你拍摄的照片并对其进行注释，例如添加胡须甚至全大胡子。你可以使用该程序保存图片并为“通缉”人物提供幻灯片。如果你能从\
  \ Snaps 应用使用设备上的摄像头，那就太棒了。事实证明这非常简单：\n\n```csharp\nSnapsEngine.TakePhotograph();\n\
  ```\n\n`TakePhotograph()` 方法将在你的 Windows 10 设备上打开相机对话框并允许你拍照。拍照完成后，照片将显示在屏幕上。如果程序执行了任何绘图操作，这些操作将添加到图像并在保存图像时存储。\n\
  \n我在在本章的示例代码中放置了一个胡须生成程序。你可以在演示文件 `Ch11_12_MustacheMachine` 中找到它。你可能会感到惊讶的是它与绘图日志是相似。试着给绘图日志添加一个“拍照”命令吧。\n\
  \n* * *\n\n### 你学到了什么\n\n在本章中，你向成为一名“专业”开发者迈出了坚实的一步。你看到了如何使用 C# 构造来允许程序管理对对象内部元素和行为的访问。你已经看到通过将数据设为私有并提供公共的\
  \ `get` 和 `set` 方法，你可以创建一个在程序适用业务规则上下文中始终持有有效内容的对象。\n\n你还发现了 C# 属性，它让其他人能够轻松访问由对象管理的数据，同时让你能够确保对象内部保存的数据始终具有完整性。你还查看了异常，并发现了程序如何处理在程序运行过程中抛出的异常。\n\
  \n你还从零开始构建了一个全新的应用程序。在“绘图日志”中，你探索了对象中持有的数据与宿主计算机文件中持有的数据之间的关系。它还展示了如何将一个相当复杂的程序拆分为一组小的、易于理解的方法。\n\
  \n这里是一些你可能想要思考的问题：\n\n**我们真的需要保护对象中持有的数据吗？**\n\n这取决于程序的上下文。如果你在写一个无关紧要的游戏或只有你自己才会使用的程序，你可能可以放弃数据保护并将程序中的所有内容都设为公共。然而，如果你正在与其他程序员一起工作，或者正在创建一个将被其他程序员使用的东西，我认为你应该关注你的程序对象的完整性。根据我的经验，如果有人对你的某个软件对象做了某些愚蠢的事导致了糟糕的结果，那么如果应用程序因此失败，会被认为是是你的错。在这种情况下，说“那是件愚蠢的事”并不是有效的辩护。\n\
  \n**属性和 `get`、`set` 方法哪一个更好？**\n\n我们知道通过将成员数据设为私有，我们可以停止对对象中元素的不受控更改。然而，一旦我们这样做，我们现在必须以某种方式允许外部世界访问这些成员数据；否则，数据就是没用的。提供这种访问本质上有两种方法。你可以创建\
  \ `get` 和 `set` 方法。\n\n**什么能阻止人们更改数据？**\n\n这是一个好问题。恶意的程序员可能仅仅通过更改存储中的文本来更改记录内部的值。然而，有几种方法可以阻止这一点。\n\
  \n第一种方法是在保存数据时使用某种加密。加密是一个机械过程，输入数据（例如“helloworld”）并将其转换为更难理解的数据（例如“ifps”）。这实际上并不非常安全，因为它只是将每个字母替换为字母表中的下一个字母。有比这好得多的加密技术可以利用，使数据更难被损坏。当程序读取数据时，它会解密信息并恢复有效数据。\n\
  \n处理数据损坏的另一种方法是不进行任何编码，而是做一些事情来检测数据何时被更改。如果我们以特定的方式组合对象中的所有值（例如，相加所有字符代码和数据值并乘以几个魔数），我们可以生成一个与数据一起存储的校验码。如果有人更改了数据，我们的程序将会注意到，因为它会重新计算校验值并查看它是否与存储的匹配。\n\
  \n如果你认为这一切听起来像是一场猫鼠游戏，你是的。这些加密和数据验证的游戏正在范围内进行，网络和计算机设计人员正在与不断试图破坏和破坏我们许多生活的数字系统的黑客作斗。这是一个迷人的领域，也是一个获得非常有趣（且高薪）工作的好去处。\n\
  \n### 第三部分：制作游戏\n\n## 12. 什么是游戏？\n\n游戏是开发编程技能的好极的地方。它们有趣且即时，你可以创建它们来给朋友留下印象。它们还提供了一个极佳的框架，你可以在此构建对象开发的基本原理。你已经开始在程序中使用对象了，现在让我们看看如何用它们玩得认真的。\n\
  \n你将学到的内容\n\n程序员创建游戏的时间和我们拥有计算机的时间一样长。我认为即使你不打算从事游戏开发，也应该尝试写写游戏。其之一，精通编程完全取决于练习，而游戏为你提供了一个编写大量代码的好地方。但主要原因是，开发游戏让你能够在无惧失败的情况下“涂鸦”代码。\n\
  \n\n\n\n\n当你创建一个游戏时，你不必担心要符合某项规范或要实现解决问题的“正确”方法。你只需要写一些可能有趣的东西，然后看看它是否真的有趣。如果它运行得不像你预期的的那样，那也很有趣。编写游戏让你能够对代码中进行实验，这非常有意思。\n\
  \n在本章中，你将发现游戏是如何运作的，并开始使用构成游戏玩法的软件元素。\n\n### 创建视频游戏\n\n## 你已经学到了什么\n\n* * *\n\n\
  ### 创建视频游戏\n\n今天，我们将开始编写一个游戏。为了保持简单，我们将在二维中工作——换句话说，我们游戏中的对象是平面的。Xbox One 上的游戏（如《光环》/Halo）提供了玩家可以探索和与之交互的庞大三维世界。我们的游戏将只允许玩家在平面屏幕上操作图像。\n\
  \n从游戏玩性的角度来看，这实际上并不是一个大问题。历史上最受欢迎的游戏，从《乒乓球》（Pong）到《太空入侵者》（Space Invaders）再到《愤怒的小鸟》（Angry\
  \ Birds），都是二维的。本章的课程之一就是：简单的游戏可以有多吸引人。\n\n我们将从绘制一些游戏对象开始，让它们移动起来并相互交互。然后我们可以扩展到不同的游戏玩法。\n\
  \n#### 游戏和游戏引擎\n\n`game engine`（游戏引擎）位于计算机游戏底层的程序代码，为游戏提供使用的平台。大型游戏工作室花费数百万美元开发支撑其产品的游戏引擎。游戏引擎负责绘制玩家看到的显示内容，并更新游戏中对象的状态。它每秒执行多次绘制和更新操作，为玩家提供引浸式的游戏体验。\n\
  \n有许多不同的游戏引擎。出于我们的目的，我将使用我创建的运行在 `Snaps` 框架内的微型游戏引擎。它不是世界上最强大的引擎，但它能让你掌握游戏开发的原理。一旦你通过\
  \ `Snaps` 引擎练了手，就可以转向其他平台。我将在本章末尾提供关于一个你可能喜欢的使用的框架的一些有用提示。\n\n`Snaps` 游戏引擎并不是一直运行的。相反，当你想玩游戏时才开启它。当游戏引擎启动时，它会让游戏全屏（如果要求的话）并设置好要使用的输入设备。这里是程序调用以启动游戏引擎的\
  \ `Snaps` 方法：\n\n![Image](img/376fig01.jpg)\n\n游戏可以在全屏模式下运行，也可以在显示器的窗口中运行。`Start-GameEngine`\
  \ 方法被赋予一个布尔值以选择使用哪种模式。游戏引擎还被赋予游戏运行的每秒帧数。如果你运行 `Ch12_01_EmptyGame` `Snaps` ，你还会在屏幕上看到任何东西。我们稍后会在游戏中添加一些对象。\n\
  \n* * *\n\n![Image](img/analysis.jpg) 代码分析：每秒帧\n\n`StartGameEngine` 方法的第二个参数是游戏目标运行的每秒帧数。\n\
  \n**问题：** 每秒帧（frames per second）到底意味着什么？\n\n**答案：** 线索就在名称中。每秒帧值是每秒应重绘屏幕的次数。游戏通过定期重绘整个屏幕来工作。屏幕上的图像看起来在移动，是因为它们在每次操作时都在不同的位置被绘制。如果连续重绘之间的时间间隔增加，屏幕上的图像看起来移动的步长更大，从而产生抖动的显示。现代游戏通常尝试以每秒\
  \ 60 帧的速度运行，尽管这个数字取决于屏幕上同时有多少项目。你可以尝试调整这个值，以获得你认为看起来良好的显示。我发现 60 是一个很好的起始数字。\n\n\
  * * *\n\n#### 游戏循环\n\n如果你查看 `Ch12_01_EmptyGame` 中的代码，你会注意到它包含一个无限运行的循环，但看起来似乎没做什么。\n\
  \n点击此此处查看代码图像\n\n```\nwhile (true)\n{\n    // 游戏更新逻辑在这里\n    SnapsEngine.DrawGamePage();\n\
  }\n```\n\n这个循环被称为 `game loop`（游戏循环）。它在游戏激活期间持续运行。目前，循环只包含一条语句，调用 `Snaps` 库中的 `DrawGamePage`\
  \ 方法。这是更新屏幕上所有项目的方法。如果任何游戏元素的位置发生了变化，该方法将在更新后的位置重绘该项目。该方法还管理计时，以便游戏循环实际上能够按照创建游戏引擎时选定的帧率更新屏幕。目前，屏幕上什么都没有，所以我认为我们需要继续进行并显示一些项目。\n\
  \n* * *\n\n![Image](img/analysis.jpg) 代码分析：无限循环\n\n无限循环对程序执行来说可能是件坏事，因为它意味着程序将永远不会停止。然而，我们现在的程序中有一个无限循环，这可能值得讨论。\n\
  \n**问题：** 在什么情况下无限循环是好事？\n\n**答案：** 无限循环是一个永远运行且没有任何退出方式的循环。但对于游戏来说，这种持续的过程实际上是你所需要的。`DrawGamePage`\
  \ 方法会暂停程序，以便游戏按照请求的帧率更新（在本程序中每秒 60 次）。\n\n* * *\n\n#### 游戏和精灵\n\n我们可以将显示上的每个元素称为精灵（sprite）。一个精灵包含图像，并具有位置和方向。如果你在玩一个射击游戏，屏幕上的飞船、背景图片和穿过太空的导弹都是精灵。我们将从一个非常简单的球精灵开始。\n\
  \n##### 为游戏添加精灵图像\n\n你可以通过将图像拖入 Visual Studio 项目的 Images 文件夹向游戏添加图像。这使得图像的一个副本。我们在第\
  \ 3 章 中做过这种操作，当时我们使用 `Snaps` 方法 `DisplayImageFromUrl` 添加了显示的图像。**图 12-1** 显示了 Visual\
  \ Studio 如何管理本书代码 Images 文件夹中的球图像 (`ball.png`)。\n\n![Image](img/12fig01.jpg)\n\n\
  **图 12-1** Images 文件夹中的球。\n\n当你将鼠标悬停在 Images 文件夹的图像上时，Visual Studio 将向你显示该文件的缩略图。我将在示例中使用这个球，但你可以为游戏添加自己的图像。这会让它变得很多趣且个性化。\n\
  \n* * *\n\n制作一些事情：制作自己的游戏图像\n\n你可以通过将自己的图像拖入 Snaps 项目的 Images 文件夹为游戏添加自己的图像。图像可以是\
  \ JPEG、GIF 或 PNG 。我更喜欢使用 PNG 文件，因为这些文件支持透明图像——换句话说，PNG 图像的部分可以显示背后的图像。当我们开始在游戏中使用球时你会你会这一点。球的图像是一个矩形图片，但只有球的圆形部分遮挡了下面的图像。球图像的其他部分是透明的。\n\
  \n处理图像可以玩很多乐趣。如果你需要一个支持图层和透明度的良好的免费图像编辑器，我建议你看看 Paint.NET，你可以从 [www.getpaint.net](http://www.getpaint.net)\
  \ 下载。\n\n\n\n\n\n![Image](img/common.jpg) 程序员观点：精灵（Sprites）和图形不再仅仅用于游戏\n\n如果你正在阅读这本书的这部分，并好奇为什么当你只想编写实用的应用程序时，我却在教你如何制作游戏，那么我建议你继续读下去。现代应用程序现在包含许多类似于游戏元素的行为。我们这一代计算机用户是在玩游戏中成长起来的，因此他们期望自己使用的系统具有与他们所玩的游戏一样流畅的图形和动画。\n\
  \n虽然作为一名程序员，你可能并不被要求设计这些图形，但你仍然需要很好了解如何利用类游戏的行为来增强用户体验。而且，这非常有趣。\n\n***\n\n### Snaps\
  \ 图像精灵（Image-Sprite）类\n\n现在我们已经在项目中有了一个图像文件，我们需要将其附加到一个软件对象上，该对象将在游戏内管理该图像。到目前为止，你应该已经熟悉这样一个概念：程序员可以创建一个软件对象来表示程序将处理的实体。我们已经创建并使用了对象来表示音符和通讯录联系人，这仅仅是两个例子。\n\
  \n我们的游戏屏幕上需要一个可以显示图像的精灵。我创建了一个 `Image-Sprite` 类，它将代表屏幕上的图像。在你的程序中，你可以随时创建一个新的 `ImageSprite`\
  \ 实例：\n\n点击此处查看代码图\n\n```\nImageSprite ball = new ImageSprite(imageUrl: \"ms-appx:///Images/ball.png\"\
  );\n```\n\n`ImageSprite` 类有一个构造函数，接受一个单一参数，该参数字符串给出了精灵要显示的图像的位置。一旦该语句完成，它就创建了一个名为\
  \ `ball` 的引用，指向一个 `ImageSprite` 实例，该实例在游戏被绘制时将生成球的图像。球本身并做不了什么——它必须被添加到游戏引擎中才能显示。游戏充当所有精灵的容器，并管理它们如何以及在何时被绘制在屏幕上。\n\
  \n如果你更倾向于从互联网上的图像为你的游戏制作精灵，你可以这样做：\n\n点击此处查看代码图\n\n```\nImageSprite ball = new ImageSprite(imageURL:\
  \ \"https://farm9.staticflickr.com/8713/16988005732_7fefe368cc_d.jpg\");\n```\n\n\
  你可以将 `ImageSprite` 视为图像的某种载体。你可以告诉 `ImageSprite` 将图像放置在屏幕上你喜欢的任何位置。你还可以在用它以各种方式缩放和旋转图像。\n\
  \n### 将 ImageSprite 添加到游戏引擎\n\n游戏引擎维护着当前正在使用的精灵列表。当你创建一个 `ImageSprite` 时，你必须告诉游戏引擎将新精灵添加到此列表中。\n\
  \n点击此处查看代码图\n\n```\nSnapsEngine.AddSpriteToGame(ball);\n```\n\n这条语句将球添加到游戏中。现在，当游戏循环运行时，精灵将绘制在屏幕上。当你在游戏中的某一点发现由于某个特定的\
  \ `Image-Sprite` 不再需要时（可能玩家已经从第 1 层升到了第 2 层），你可以使用 `RemoveSpriteFromGame` 方法移除精灵。\n\
  \n这里有一个最简单的游戏：\n\n![Image](img/381fig01.jpg)\n\n实际上，这更像是一个图像显示程序，因为每次游戏更新时精灵都没有发生任何变化，所以它并没有做任何事——它只是在屏幕上显示一个漂亮的大球。图\
  \ 12-2 显示了当 `Ch_12_02BallSprite` 程序运行时绘制的球。\n\n![Image](img/12fig02.jpg)\n\n**图\
  \ 12-2** 显示球精灵。\n\n球的图像大小约为 260 像素，并以该维度绘制，这对于我们的游戏来说有点大。我们需要找到一种方法制作一个大小合适的球。\n\
  \n### 修改 ImageSprite 的大小\n\n在第 11 章中，你看到了一个类如何包含属性行为，这些行为可以用于管理对对象内部持有数据的访问。`Contact`\
  \ 类有一个 `Name` 属性，允许程序操作 `Contact` 值所持的人的名字。`ImageSprite` 类提供了属性，允许程序在精灵显示时操作精灵的宽度和高度。\n\
  \n![Image](img/382fig01.jpg)\n\n程序可以通过给精灵的 `Height` 和 `Width` 属性赋值来设置精灵的高度和宽度。然而，更改精灵的大小并不会立即改变其在显示器尺寸；只有在调用\
  \ `DrawGamePage` 方法时，尺寸才会改变。当之前的程序运行时，它会让球收缩和扩张，正如你在图 12-3 中所示。\n\n![Image](img/12fig03.jpg)\n\
