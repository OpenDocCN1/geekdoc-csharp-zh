  \n告诉我们你对这本书的看法，帮助微软为您改进产品。感谢您！\n\n*http://aka.ms/tellpress*\n\n* *\n\n## 引言\n\n\
  我认为编程是你能学习的技能中最具创造力的事情。如果你学习了绘画，你就能画画；如果你学习了小提琴，你就能演奏音乐。但如果你学习了编程，你就可以创造完全全新的体验（如果你愿意，你也可以画画和音乐）。一旦你踏上了编程的道路，你的前途将无\
  \ Limit 限。总会有新的设备、技术和市场让你施展自己的编程技能。\n\n你可以把这本书看作是你通往编程启蒙之旅的第一步。最好的旅程都是带着明确的目标出发的，这一本也不例外。我想把这个目标描述为“实用性”。读完这本书后，你不会成为世界上最优秀的程序员（除非我退休了），但你将拥有足够的技能和知识来编写出真正有用的程序。也许你还可以让至少一个程序在\
  \ `Microsoft Store` 上供全球下载。\n\n然而，在开始之前，我想先给出一个小警告。就像导游会想告诉你，如果你去非洲游猎探险，可能会遇到狮子、老虎和鳄鱼一样，我觉得我必须让你知道，我们的旅程可能不会一帆风顺。程序员必须学会用稍微不同的方式来解决问题，因为计算机的工作方式与我们完全不同。人类可以做复杂的事情但速度很慢；计算机可以非常快速地完成简单的事情。程序员的任务就是利用机器简单的能力来解决复杂的问题。这正是我们要学习的内容。\n\
  \n作为程序员，成功的关键与许多其他努力大同。如果你想成为一名世界级的小提琴演奏家，你必须大量练习。编程也是如此。你必须花费大量时间在程序上，以获得代码编写技能。但好消息是，正如小提琴家非常享受让乐器“唱歌”一样，让计算机完全按照你的想法运行也是一个非常有成就感的体验。当你看到别人使用你写的程序，并发现它们既有用又有趣时，这种感觉会更加愉快。\n\
  \n### 本书是如何构成的\n\n我将这本书分为四个部分。每一部分都建立在前一部分的基础上，旨在将你培养成为成功的程序员。我们从考虑程序用于告诉计算机做什么的低级编程指令开始，最后查看专业的软件实践方法。\n\
  \n### 第 1 部分：编码基础\n\n第一部分将带你入门。它将指引你在哪里安装和使用所需的编程工具，并向你介绍所有程序都会使用的 `C#` 编程语言的基础元素。\n\
  \n## 第 2 部分：高级编程\n\n第二部分描述了用于创建更复杂应用的 `C#` 编程语言特性。它将展示如何将大型程序分解为更小的元素，以及如何创建反映所解决特定问题的自定义数据类型。你还将发现程序在未运行时如何在存储中维护数据。\n\
  \n## 第 3 部分：制作游戏\n\n制作游戏非常有趣。事实证明它是学习使用面向对象编程技术的极佳方法。在这一部分，你将构建一些可玩的游戏，同时学习通过继承和基于组件的软件设计扩展编程对象的原理。\n\
  \n### 第 4 部分：创建应用程序\n\n第四部分将介绍如何创建完整的应用程序。你将发现如何设计图形用户界面以及如何将程序代码连接到显示器上的元素。你还将学习现代应用程序的结构。第四部分没有出现在这本纸书中，但以电子书的形式提供，可以从本书的网页\
  \ `https://aka.ms/BeginCodeCSharp/downloads` 免费下载。\n\n你 你如何学习\n\n在每一章中，我都会告诉你更多关于编程的知识。我会向你展示如何做某事，然后邀请你利用所学知识创造属于自己的东西。你离完成某事或制作独特个性化的东西只有一页左右的距离。在每一章中，我们都会使用\
  \ `Snaps`——我将教你如何使用预构建的功能块。之后，就看你创造什么不起的东西了！\n\n如果你喜欢，可以直接通读这本书，但如果你放慢速度并配合其中的实践部分，你会学到更多。这本书并不能真正教你如何编程，就像关于自行车的书无法教你如何骑自行车一样。你必须投入时间和练习来学习如何做。但这本书将给你尝试的知识和信心。\n\
  \n* * *\n\n![Image](img/happen.jpg) 让事情发生\n\n是的，学习事物最好的方法就是实践，因此你会在文中看到“让事情发生”（Make\
  \ Happen）元素。这些元素为你提供了练习编程技能的机会。每一个元素都从一个示例开始，然后介绍一些你可以尝试的步骤。你创建的所有内容都运行在 Windows\
  \ PC、平板电脑或手机上。你甚至可以通过 `Windows Store` 将你的作品发布到全世界。\n\n* * *\n\n![Image](img/analysis.jpg)\
  \ 代码分析\n\n学习编程的一种棒方法是查看别人编写的代码并推断它们的作用（以及有时为什么没有按预期运行）。在本书的“代码分析”挑战中，你将使用推理能力来判断程序的行为、修复错误并提出改进。\n\
  \n* * *\n\n![Image](img/wrong.jpg) 可能会出现什么\n\n如果你还不知道程序可能会出错，那么在你开始编写第一个程序后很快就会学到教训。为了帮助你提前应对这个问题，我包含了“可能会出现什么？”元素，预判你可能出现的问题并提供解决方案。例如，当我介绍新功能时，有时会花些时间考虑它可能如何失效，以及你在使用它时需要担心什么。\n\
  \n\n\n\n\n现在已经没有人从零开始构建程序了。所有的软件都是使用已经构建好的软件部分构建的。如果一个程序想要显示文本、发出声音或播放某些视频，它只需请求另一个程序来完成即可。每种流行的计算机语言的背后都有一个庞大的现有代码库支持，而程序员需要理解的事情之一就是如何使用这些库以及由他人编写的软件。\n\
  \n我专门为这本书创建了 `Snaps` 库。它提供了一系列易于使用且能够相互配合的功能性行为。你将在你的第一个程序中使用 `Snaps` 库。在书的后后部分，你将发现其他其他可以使用的功能库，你可以使用它们来构建程序。\n\
  \n使用 `Snaps` 的程序运行在 `Snaps` 引擎内部，该引擎是一个自包含的环境，在这个环境中，程序可以发送消息、获取用户输入、绘制图像、发出声音，甚至查询天气状况。\n\
  \n我会提供关于 `Snaps` 如何工作的示例，然后由你来发现你能创作出什么内容。我们将遵循的原则是：“如果你不能用编程来让你的朋友和家人印象深刻，那么编程有什么意义呢？”我真的希望你能写出一些令自己惊叹的程序，甚至可能将它们发布供他人欣赏。\n\
  \n* * *\n\n![Image](img/common.jpg) 程序员观点：一切都构建在别人的代码之上\n\n第一个“程序员观点”是关于一个优秀的程序员可以多“创造性地偷懒”，这似乎很恰当。如果他们能找到使用已经写好的程序的方法，他们永远不会自己写一个程序。（为什么要重造轮子呢？）我提供的\
  \ `Snaps` 就是这样一个例子。你将在书的后后部分查看其中一些的内部，并发现它们本身也使用了其他的库。\n\n* * *\n\n### 软件与硬件\n\n\
  你需要一台电脑和一些软件来运行书中的程序。恐怕我无法为你提供电脑，但在第一章中，你将发现哪里获取 `Visual Studio 2015 社区版`，这是你将用它来创建程序的免费软件。你还将学习从哪里下载\
  \ `Snaps` 库以及我们将检查和使用的演示代码。\n\n你使用的电脑必须运行 64 位的 `Windows 10` 操作系统。以下是其他要求：\n\n•\
  \ `1 Ghz` 或更快的处理器，最好是 `Intel i5` 或更高级的处理器。\n• 至少 `4 gigabytes (GB)` 内存 (`RAM`)，但最好是\
  \ `8 GB` 或更多。\n• 完整的 `Visual Studio 2015 Community` 安装程序大约占用 `8 GB` 的硬盘空间。\n\n对图形显示没有特殊要求，尽管更高分辨率的屏幕可以让你在编写程序时看到更多内容。`Snaps`\
