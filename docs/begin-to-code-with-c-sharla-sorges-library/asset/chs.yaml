  \ 的值加 1，代码 `+ 1` 导致 1 被接到字符串的末尾。为了让程序正常工作，你必须强制先计算和，然后将此结果作为整数显示。你可以使用括号告诉编译器你想先评估表达式的一部分，因此你可以这样做：\n\
  \n\n\n现在程序在构建字符串时，它在执行其他操作之前会计算 `count + 1`，这意味着程序正确显示了摊位编号。但我还会再做一次修改，将代码写如下：\n\
  \n点击此处查看代码图片\n\n```csharp\nfor (int count = 0; count < sales.Length;count = count\
  \ + 1 )\n{\n    // 用户喜欢从 1 开始计数，而不是 0\n    int displayCount = count + 1;\n    sales[count]\
