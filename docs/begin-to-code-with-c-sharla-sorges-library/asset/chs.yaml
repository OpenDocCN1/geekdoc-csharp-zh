  \ `Snaps` 库中的 `Delay` 方法，你可以让程序在鸡蛋煮熟期间暂停，并在鸡蛋煮好时发出通知。我的测试表明，要得到一个完美的鸡蛋，你应该煮五分钟（或\
  \ 300 秒）。这段代码是一个很好的起点——在你制作煮蛋计时器时，请复制这段代码，而不是复制或编辑 `MyProgram.cs`：\n\n点击此处查看代码图片\n\
  \n```csharp\nusing SnapsLibrary;\n\nclass Ch03_12_EggTimerStart\n{\n    public void\
  \ StartProgram()\n    {\n        SnapsEngine.SetTitleString(\"Egg Timer\");\n  \
  \      SnapsEngine.DisplayString(\"There are five minutes left\");\n        SnapsEngine.Delay(60);\n\
  \        SnapsEngine.DisplayString(\"There are four minutes left\");\n    }\n}\n\
  ```\n\n我认为这是你开发者的另一个重要里程碑。与你之前创建的倒计时器不同，这个程序具备了正式产品的所有要素。你妈妈会觉得这个程序很有用。Windows 商店有很多作为计时器的产品，没有理由你制作的计时器不能成为其中之一。\n\
  \n你可以为你的计时器添加额外功能，例如在鸡蛋快要好时更改屏幕颜色，甚至在计时器结束前提供 30 秒的警告——也许在最后时刻进行类似“十、九、八”的倒计时。你还可以让计时器通过语音播报剩余时间，同时将其显示出来。\n\
  \n你还可以利用这种设计来制作在许多其他情况下都有用的计时器。这里我能想到的四个：\n\n- 你的好朋友发现了开发自己照片的热情，她想要一个她可以在黑暗下使用的计时器。这个计时器应该每隔五秒宣布一次经过了多少秒。\n\
  - 你和同事们建立了一个问答俱乐部，想要控制每个团队回答问题所需的时间。每个团队有 10 秒钟。\n- 你哥哥玩着一个游戏，每个玩家都必须用牙签在 30 秒内吃掉尽可能多的烘焙豆（我没说这是一种理智的游戏），他需要一个计时器来配合。\n\
  - 你妈妈热衷运动，需要一些东西来记录她训练的每个阶段，并告诉她下一个活动是什么。共有五项活动：原地跑步、俯卧撑、开合跳、坐立和深蹲起跳。每个活动应该执行 30\
  \ 秒，然后是 10 秒的休息时间。\n\n尝试着制作这些计时器以及你可能想到的任何其他计时器。在下一章中，你将发现程序如何从用户获取输入，这样你就可以做出出更好的计时器，允许用户设置计时器运行的时间长度。\n\
  \n* * *\n\n### 你学到了什么\n\n在本章中，你更加熟悉了你创建程序的 Visual Studio 环境。你看到了 C# 程序被表达为一系列语句，这些语句在程序运行时会按顺序执行。你还看到你和我编写的高级\
  \ C# 代码通过一个名为“编译器”的程序转换为低级的计算机指令。有时代码编译成功，程序运行顺利；而有时代码因为错误而没有通过编译。\n\n你看到编译器确保程序符合\
  \ C# 语言的规则。编译器会拒绝那些没有完全正确的语句的程序。而人类读者会容忍缺失或错误的标点符号，编译器会拒绝任何不遵守编程语言规则的内容。\n\n我们到为止编写的程序使用了由\
  \ `Snaps` 库提供的 Snaps，这让我们能够执行诸如语音消息、显示颜色和延迟程序执行等操作。这些组件以方法的形式提供，通过传递数据来告诉它们要做什么。例如，`SpeakString`\
  \ 方法被赋予要朗读的字符串文本。\n\n以下是一些你可能对程序、语句和编译器进行思考的问题。\n\n**程序的用户需要拥有 Visual Studio 副本才能运行程序吗？**\n\
  不需要。Visual Studio 可以生成用户无需 Visual Studio 即可运行的程序文件。\n\n**我必须知道每一个 Visual Studio\
  \ 命令是如何工作的吗？**\n不需要。通过操作其中的几个就可以应付了。\n\n**编译器因为对无效代码感到困惑就是因为它无能吗？**\n你可能觉得编译器有点傻，因为有时它在看到错误时确实会抱怨。如果你疑惑编译器为什么不直接替换正确的字符并继续运行，那是可以原谅的。然而，事实证明这样做是有理由的。如果编译器插入了它认为缺失的内容，它对你（程序员）真正想要做什么做了假设。让编译器坚持让你准确表达你想做的内容要安全得多。\n\
  \n每个方法都是为接收特定信息定制的。`Delay` 方法需要告知多少秒。`SpeakString` 方法需要要朗读的字符串。编译器知道方法被构建来接收什么，并且只会向它传递该类型的数据。如果你尝试向\
  \ `Delay` 传递字符串，程序将无法编译。\n\n\n\n\n## 处理数字操作\n# 处理不同类型的数据\n### 程序中的整数和实数\n# 额外的 Snaps\
  \ \n### 你所学到的\n\n### 从变量开始\n\n到目前为止，我们处理的程序使用了内置的数据。例如，下面的语句获取了数据（文本“Hello world”），然后对其进行处理——在这种情况下，将其转换为计算机能听懂的语言。\n\
  \n点击此处查看代码图片\n\n```\nSnapsEngine.SpeakString(\"Hello world\");\n```\n\n许多程序都以这种方式内置数据——例如，一个视频游戏除了程序代码外还包含了图像和声音。这些数据来自“硬编码”在程序代码中的值。这些值被称为*字面量*（literal）值。\n\
  \n字面量对于程序中的固定数据是可以的，但如果你想让代码具有灵活性，你就需要进行其他操作。要更改程序中的字面量，你必须更改实际代码（例如，将“Hello world”更改为你想要的新消息），然后重新编译程序。为了让代码更具灵活性，你使用*变量*。变量可以接受用户的输入，然后程序就可以对这些输入进行处理。\n\
  \n![Image](img/analysis.jpg) 代码分析：字面量\n\n**问题：** 语句 `SnapsEngine.SpeakString(\"\
  Hello world\");` 中的字面量是什么？\n\n**答案：** 字面量是字符串 `\"Hello world\"`。\n\n**问题：** 名为 `SpeakString`\
  \ 的方法是一个字面量吗？\n\n**答案：** 不是。为了理解为什么，请考虑程序中提供指令的代码（执行工作的实体）与程序中的数据（被执行工作的对象）之间的区别。`SpeakString`\
  \ 是一个方法的标识符，它允许计算机输出文本字符串。`\"Hello world\"` 是我们想要程序说出的字面量文本。\n\n**问题：** 字符串是唯一一种字面量吗？\n\
  \n**答案：** 不是。在本章的后面部分，你将学习数值型字面量。\n\n### 变量与计算机存储\n\n为了让一个程序完全有用，它必须能够接受并处理来自外部源的数据。每当你按下键、轻触手机屏幕或移动鼠标时，你都在向程序提供输入，这些输入存储在某种变量中。但该变量存储在哪里呢？\n\
  \n当计算机所有者自豪地说“我的计算机有 16 GB 内存”时，她实际上是在说计算机中的*随机访问存储器*（RAM）包含了海量（160 亿）个独立的内存位置，每个位置都可以存储一个名为*字节*（byte）的微小数据。每个内存位置都有编号，计算机可以随时访问任何位置（这就是为什么它被称为*随机*访问存储器）。这些内存位置用于存储给计算机的指令（程序）以及程序处理的数据。例如，当你使用文字处理器时，计算机中的部分\
  \ RAM 正在存储文字处理器程序，另一部分 RAM 正在存储正在处理的文本。\n\n存储在 RAM 中的数据与存储在硬盘器或 U 盘等设备上的数据存在区别。当你使用文字处理器时，程序从硬盘器加载你的文档并将其复制到\
  \ RAM。当你保存文档时，它会从 RAM 复制回磁盘存储。当你处理程序和数据时，它们会保存在于 RAM 中，因为这样可以极快地访问数据。但 RAM 也是易失的。当你退出程序或关闭计算机时，RAM\
  \ 中的内容会被销毁。（在本书的后续章节，你将发现如何让程序将数据存储在存储设备上，但现在我们先考虑程序如何处理存储在 RAM 中的数据。）\n\n你可以将变量视为内存中一个命名的位置，其中存储着程序正在“思考”的内容。在程序运行时，它通过处理变量来生成结果，然后程序输出该结果。另一种思考变量的方式是将其看作一个“带名字的盒子”。在程序中，这个盒子被用来存储物品。程序员为变量提供一个名称，并指定可以存储在其中的数据类型（如文本或数字）。\n\
  \n### 声明变量\n\n假设我们创建一个程序，用于宣布我们举办的华华派对中到达的人员。使用该程序，每位客人都会输入自己的名字。客人的名字将存储在程序中定义的变量中，然后程序通过从内存中检索该变量来宣布客人的到来。\n\
  \n为了让这个程序运行，我们需要一个可以存储客所输入名字的变量。名字是一段文本，所以我们需要一个可以存放字符串的变量。\n\n![Image](img/072fig01.jpg)\n\
  \n这段代码是一个*声明*，它告诉 C# 在内存中为一个可以存储文本字符串的变量留出空间。C# 编译器理解 `string` 单词是声明的开始。`string`\
  \ 后面跟着要创建的变量名称，在本例中为 `guestName`。\n\n你为变量使用的名称称为*标识符*（identifier）。C# 编译器对标识符执行一些规则：\n\
  \n- 标识符可以包含字母、数字和下划字符。\n- 标识符必须以字母或下划线开头。\n- 你不能使用与 C# 内置关键字匹配的标识符。例如，`string` 单词就是一个关键字。\n\
  \n![Image](img/analysis.jpg) 代码分析：标识符\n\n**问题：** `my$name` 是一个好的标识符吗？\n\n**答案：**\
  \ 不是。它包含美元符号，这在标识符中是不允许的。可以使用 `MyName` 或 `my_name`。\n\n**问题：** `2ndInningsScore`\
  \ 是有效的标识符吗？\n\n**答案：** 不是。它以数字开头，这是允许的。\n\n**问题：** `x29zog` 是好的标识符吗？\n\n**答案：**\
  \ 是，这是一个合法的标识符——C# 不会反对它。但尽管它是有效的，它并没有意义。变量的标识符应该指示它的用途，而这个名称并没有做到。\n\n**问题：** `textstring`\
  \ 是好的标识符吗？\n\n**答案：** 这是一个有效的标识符。它包含了单词 `string`，这是一个关键字，但在这种情况下编译器并不介意，因为 `string`\
  \ 是更大单词的一部分。然而，我不喜欢这样的标识符，我更喜欢像 `nameString` 这样的。\n\n### 简单赋值语句\n\n变量声明后，程序可以给变量赋值。这里有一个例子：\n\
  \n![Image](img/073fig01.jpg)\n\n这种类型的语句被称为*赋值*（assignment）。左侧的变量被赋予右侧的值。程序运行此语句的结果是变量\
  \ `guestName` 保存字符串“Rob”。\n\n变量和值之间的等号并不是在进行比较。相反，它表示我们让左侧的变量等于右侧的值。我称之为 *gozzinta*\
  \ 操作，因为值“进入”了左侧的目标。\n\n赋值语句是程序非常重要的部分。每当程序处理数据时，它都是通过向变量赋值来实现的。我们将在书的后面部分更详细地讨论赋值。\n\
  \n![Image](img/wrong.jpg) 可能出现的问题：赋值问题\n\n\n\n\n赋值语句是程序为变量赋予值的方式。然而，可能会出现问题，以下是赋值失败的几种方式：\n\
  \n```csharp\nnewKidInTown = \"Nowhere\";\n```\n\n只要变量 `newKidInTown` 已经声明，这个语句就是完全合法的。如果没有声明，编译器将生成一个错误。在\
  \ C# 中，如果你要给变量赋值，就必须先声明该变量。\n\n```csharp\nstring Name;\nname = \"Rob\";\n```\n\n\
  从表面上看，这段代码看起来是合法的。但如果你仔细观察，你会发现声明的变量标识符是 `Name`，而使用的变量标识符是 `name`。C# 语言区分标识符中的大写字母和小写字母。这里\
  \ `n` 的大小写不同意味着编译器会报错说变量 `name` 未声明。\n\n```csharp\nstring age;\nage = 21;\n```\n\
  \n这段代码看起来是合法的，但编译器会报错，因为在 C# 中，文本字符串必须包含在双引号内——“21”是一个字符串，但 21（不带引号）是一个数字。\n\n*\
  \ *\n\n### 在程序中使用变量\n\n在你的程序中，任何可以使用可以使用实际字符串的地方都可以使用 `string` 变量。例如，我们在之前的章节中使用\
  \ `SpeakString` 时，我们给了该方法一个我们让计算机读出的字面量字符串值。但你也可以给 `SpeakString` 或 `DisplayString`\
  \ 一个包含字符串的变量值，如下：\n\n![Image](img/074fig01.jpg)\n\n在程序中使用变量标识符（在本例中 `guestName`）会让程序使用该变量所持有（赋值给）的值。通过将我们看过的代码行组合在一起，你可以看到它是如何工作的。这是一个可以运行并显示“Rob”的程序：\n\
  \n![Image](img/074fig02.jpg)\n\n但我们这样做实现了什么？为什么不像我们在早期章节的程序中所做，直接在 `DisplayString`\
  \ 的调用中放入字面量字符串“Rob”呢？嗯，当你从用户那里获取 `guestName` 的值而不是将其设为固定值时，事情就会变得有趣得多。\n\n为了更详细地查看其工作原理，我们将使用另一个\
  \ Snap 方法，即 `ReadString` 方法。它的功能正如你预期的那样——读取用户输入的字符串。\n\n![Image](img/075fig01.jpg)\n\
  \n在该语句中，`ReadString` 方法被赋予了一个字符串，作为用户的提示——“你的名字是什么？”。当执行此语句时，程序会显示提示和一个用于用户输入的文本框。然后它会暂停并等待用户输入他们的名字，如图\
  \ 4-1\n\n**图 4-1** 该程序将你在文本框中输入的名称存储为字符串变量。\n\n当用户按下 Enter 键时，`ReadString` 方法会将用户输入的任何作为字符串返回，因此赋值给\
  \ `guestName` 的字符串是从用户的输入读取的，而不是像上一个示例那样固定为值“Rob”。你可以在任何需要从用户那里获取信息时使用 `ReadString`\
  \ 方法。这里有一个更完整的示例。\n\n![Image](img/076fig01.jpg)\n\n从用户处读取数据让这个程序变成了一个“真正的”处理器，它接受一种形式的信息（用户输入的文本）并产生另一种形式的输出（屏幕显示）。\n\
  \n* *\n\n![Image](img/happen.jpg) 让事情发生：创建一个播报员\n\n你现在就可以尝试这个程序。只需运行名为 `Ch04_02_Reading-AString`\
  \ 的 Snap 应用。Snap 方法将获取你输入的名称并将其显示。你可以添加对 `SpeakString` 方法的调用，让程序也按名字播报用户。如果你想用大字母显示名字，你还可以使用\
  \ `SetTitleString` 方法。\n\n* *\n\n### 在声明中赋值\n\nC# 允许你在声明变量的同时对其赋值。这里有一条语句，它替换了你刚刚看到的两个语句：\n\
  \n点击此处查看代码图像\n\n```csharp\nstring guestName = Snaps.ReadString(\"What is your name?\"\
  );\n```\n\n该语句从用户处获取一个字符串，并将其存储在标识符为 `guestName` 的 `string` 变量中。这种语句让程序变得略短，并且减少了程序尝试使用未赋值变量的概率。\n\
  \n### 合并字符串\n\n在本章的开头，我们打算制作一个程序，在人们到达派对时播报他们的名字。现在我们想让公告更花哨一点。在情况下，我希望程序说“The honorable\
  \ Mister Rob Miles。”我可以尝试使用以下 C# 代码来实现：\n\n![Image](img/077fig01.jpg)\n\n这段代码片段（你可以在名为\
  \ `Ch04_04_StiltedAnnouncer` 的 Snap 应用中找到）运行正常，但由于消息的两个部分是由单独的语句产生的，语音输出过程将它们视为单独的项目，导致输出听起来有些生硬。我们想要将引言和名字组合成一个字符串，如下：\n\
  \n点击此处查看代码图像\n\n```csharp\nstring fullMessage = \"The honorable \" + guestName;\n\
  ```\n\n这就是我们在 C# 中看到的第一个*表达式*。表达式是某种执行的操作的内容。它由*操作数*（要处理的项目）和*运算符*（指示特定操作）组成。播报程序中的表达式元素如图\
  \ 4-2\n\n**图 4-2** 表达式结构。表达式是 C# 处理数据的基础部分。你将在未来的章节中看到更多。\n\n* *\n\n![Image](img/wrong.jpg)\
  \ 可能会出错：无效运算符\n\nC# 语言提供了大量的运算符。程序不仅可以使用加号组合字符串或相数字，还可以进行减、乘、除等，你很快就会看到示例。但现在，看看这条语句：\n\
  \n点击此处查看代码图像\n\n```csharp\nstring fullMessage = \"The honorable Mister \" - guestName;\n\
  ```\n\n这个语句看起来试图从引入字符串中减去 `guestName`。这种操作将不起，因为 C# 不允许从一个字符串中减去另一个。程序将字符串相加才有意义。编译器总是检查运算符的上下文。虽然从一个数字减去另一个是可以的，但从一个字符串减去另一个是不可能的。当你编写程序时（特别是当编译器对你执行的操作报错时），请务必考虑你所执行操作的上下文。\n\
  \n* *\n\n* *\n\n![Image](img/happen.jpg) 让事情发生：报告星期：使用模式\n\n播报程序从用户处获取字符串并将其显示。你可以使用相同的模式制作一个告诉你是星期几的程序——然后你可以运行这个程序并决定早上是否需要起床。为了制作这个程序，你可以使用名为\
  \ `GetDayOfWeekName` 的 Snap 方法。当你调用该方法时，它读取计算机中的时钟并计算今天是星期几。它以字符串的形式返回此值。\n\n点击此处查看代码图像\n\
  \n```csharp\nstring day = SnapsEngine.GetDayOfWeekName();\n```\n\n\n\n构建此程序的最好方法基于现有的程序进行构建，使用这种\
  \ Snap 方法的方法与公告员（announcer）程序是相同的。以下是公告员程序的功能：\n\n![Image](img/079fig01.jpg)\n\n\
  一个说星期几的程序也非常相似。主要的区别在于消息的来源。\n\n点击此处查看代码图像\n\n```\nstring dayName = SnapsEngine.GetDayOfWeekName();\n\
  \nSnapsEngine.SpeakString(dayName);\n```\n\n在任何你想创建一个“向方法提问并获取响应”的程序的地方，你都可以使用公告员程序的模式。当你遇到新问题时，考虑你是否已经用特定的模式解决了该问题是一个非常好的主意。一个告诉你是星期几的完整版本程序所示：\n\
  \n![Image](img/079fig02.jpg)\n\n你可以让程序在显示星期几的同时将其播报出来。你还可以添加一个标题显示，让用户知道程序正在为他们做什么。通过拼接字符串，你甚至可以让程序问候你并说：“日好，Rob。在这个美好的周四你过得怎么样？”\n\
  \n***\n\n### 处理数字\n\n到目前为止，我们在编程中主要处理文本字符串。现在是时候学习程序如何表示和处理数值了。\n\n#### 整数和实数\n\n\
  对于 C# 来说，数字有两种：`whole numbers` 整数和 `real numbers` 实数。整数没有小数部分。计算机精确地存储整数的值。相反，实数具有小数元素。作为程序员，你需要选择想要使用哪种数字来存储特定的值。\n\
  \n***\n\n![Image](img/analysis.jpg) 代码分析：整数与实数\n\n你可以通过观察它们可能使用的几种情况来学习整数和实数之间的区别。\n\
  \n**问题：** 我正在制造一个可以数头上头发数量的设备。我应该将这个值存储为整数还是实数？\n\n**答案：** 这应该是一个整数，因为不存在半根头发。\n\
  \n**问题：** 我想把我的数发机用在 100 个人身上，计算他们所有人头发的平均数量。我应该将这个值存储为整数还是实数？\n\n**答案：** 当你算出结果时，你会发现平均值有一个小数部分，这意味着你应该使用实数来存储它。\n\
  \n**问题：** 我想在程序中跟踪产品的价格。我应该如何做？\n\n**答案：** 这实际上非常棘手。你可能认为价格应该存储为实数——例如，$1.50（一比半美元）。然而，你也可以将价格存储为整数\
  \ 150 分。在在这种情况下，你使用的数字类型取决于你用这个数字做什么。如果你只是跟踪销售产品收到的总金额，你可以使用整数来保存价格和总额。但是，如果你还向人们借钱来购买你的产品，并想计算向他们收取的利息，那么你需要一个小数部分来更精确地持有该数字。\n\
  \n***\n\n***\n\n![Image](img/common.jpg) 程序员观点：存储变量的方式取决于你想对它做什么\n\n这看起来很显而易见，你会用整数来计算你头上的头发数量。然而，有人可能会认为，我们也可以用整数来表示\
  \ 100 个人头发的平均数量。这是因为计算出的平均值将是千位数，而头发的碎小部分不会增加多少有用信息。当你考虑如何在程序中表示数据时，你必须考虑到它将如何被使用。\n\
  \n***\n\n#### C# 整数类型\n\n正如我提到的，整数没有小数部分。它们经常被用于计数事物的程序。此外，整数的值是由计算机程序精确存储的。换句话说，每个整数值都映射到计算机内存中，其方式完美保留了该值。\n\
  \n当我在程序中使用整数时，我倾向于使用 `int` 类型，它的范围可达 2,147,483,647。如果我想存储的数字比这大，我可以使用 `long` 类型，它的范围大达\
  \ 9,223,372,036,854,775,807。如果我只想数到 32,767，我可以使用名为 `short` 的类型。所有这些类型都有等效的负数范围。\n\
  \n每种类型在 RAM 中占据不同的空间。`long` 类型占用八个内存单元，而 `short` 类型只占用两个。在我编写的大多数 C# 程序中，我倾向于使用\
  \ `int` 类型，因为我确信我永远不会超过它的范围。\n\n***\n\n![Image](img/wrong.jpg) 可能会出现什么：小心不要超过整数类型的范围\n\
  \n你可能认为计算机会检测到特定类型的范围被超出。换句话说，你可能期望程序在尝试将值 32768 放入 `short`（它只能存储 32767）时停止。然而，这无法保证。相反，你可能会发现值变得错误而程序仍在继续。这可能会导致严重的问题。我使用\
  \ `int` 类型而不是 `short` 的主要原因是，我可以想象到可能需要存储大于 2,000,000 的值的情况。当你为变量选择类型时，考虑该类型的范围很重要。如果你有疑问，请选择一个空间充足的类型。在计算机通常拥有大量\
  \ RAM 的世界，你不需要通过牺牲变量的大小来节省空间。\n\n***\n\n#### C# 实数类型\n\n实数类型具有小数部分，即数字小数点后的部分。实数并不总是精确存储的。一个特定的实数映射到内存的方式是尽可能地存储原始值。你可以通过使用大量的计算机内存来增加存储过程的精度，但你永远无法精确持有所有值。\n\
  \n这实际上并不是问题。我们习惯了像π 这样的值永远无法精确持有，因为它们“无限延伸”。我有一本书包含了小数点后一百位的圆周率值，但我仍然无法说这就是π的精确值。我只能说，书中的值比任何人需要的都要精确得多。）\n\
  \n当你创建一个用于持有整数的变量时，你应该从考虑该变量将将用于什么开始。在考虑如何在程序中存储实数时，也这样做。从思考你的应用程序从变量中需要的*范围*和*精度*开始。\n\
  \n*精度*决定了数字存储的精确程度。例如，C# 提供了一种名为 `float` 的实数类型，它可以持有七位精度的数字。`float` 变量可以存储值 1234567.0\
  \ 或 0.1234567，但它不能存储 1234567.1234567，因为它没有足够的精度来 14 位。实数类型的范围告诉你它可以存储的最大和最小值。对于\
  \ `float` 类型，它可以持有一个 38 位的数字（即一个 1 后面跟着 38 个零）。\n\n\n\n\n如果我想非常精确地存储一个值，我会使用 `double`\
  \ 类型（该名称是 *double precision* 双倍精度的缩写）。这种类型可以提供大约 15 位数字的精度，并能够存储超过 300 位的数字。还有一种称为\
  \ `decimal` 的类型，它的范围比 `double` 小（它可以处理 28 位的数值），但它能提供 28 位的精度。\n\n大多数情况下，我使用 `float`\
  \ 数据类型，它的精度对我的需求已经足够了。如果我的程序在计算中使用每秒重复数百万次的特定变量，我就会使用 `double` 精度类型。在这样的程序中，`float`\
  \ 类型将不再适用，因为误差可能会随着时间的推移而累积并变得明显。如果我在对金额进行利息计算，我会使用 `decimal` 类型。`decimal` 类型的高精度能够准确地持有即使是非常微小的利息。\n\
  \n***\n\n![Image](img/wrong.jpg) 可能会出什么问题：变量并非完美，但它们足够好\n\n你可能会认为你无所不能的计算机能够精确地存储所有值。发现事实并非如此，而且一个简单的\
  \ 10 位口袋计算器性能可以超过你强大的个人电脑，这会让你有些惊讶。\n\n然而，这种精度的缺乏在编程中并不是真正的问题，因为我们通常接收的数据本身并不特别精确。例如，如果我改进我的数发设备来测量头发长度，那么想要让测量精度超过\
  \ 1/10 英寸（2.4 毫米）是非常困难的。这意味着在 `double` 类型的变量中存储头发长度是没有意义的，因为数据根根就不在那里。\n\n需要记住的一点是，对于整数还是实数，你都应该根据它的用途来选择你将使用的类型。\n\
  \n***\n\n### 执行计算\n\n你已经看到程序如何通过创建连接字符串的表达式来操作字符串。你还可以创建包含涉及数字表达式的语句。这些表达式可以求值以产生结果，然后你就可以根据程序需要使用该结果。表达式可以简单到只有一个值，也可以复杂到一个大型计算。以下是几个数值表达式的示例：\n\
  \n```\n2 + 3 * 4\n-1 + 3\n(2 + 3) * 4\n```\n\n这些表达式是由计算机从左到右进行计算（求值）的，就像你自己阅读它们一样。同样，就像传统数学中一样，表达式中的乘法和除法先执行，然后是加法和减法。\n\
  \nC# 通过给每个运算符分配优先级来实现这种顺序。当 C# 计算表达式时，它会找到所有优先级最高的运算符并首先应用它们。然后它寻找下一个优先级的运算符，依此类推，直到获得最终结果。求值顺序意味着表达式\
  \ `2 + 3 * 4` 的计算结果是 14，而不是 20。\n\n如果你想强制表达式的计算顺序，可以在你想要先求值的元素周围加上括号，如上面的最后一个示例所示。如果你愿意，也可以在括号内再嵌套括号——只要确保左括号的数量和右括号的数量相等即可。由于我是一个性情直率（简单单纯）的人，我倾向于通过给所有内容加上括号来让事情变得非常清晰。\n\
  \n可能没必要对*表达式求值*（内行人士的称呼）感到过度激动。通常情况下，事情的处理往往会按照你预期的逻辑进行。\n\n这里是一些其他运算符、它们的功能以及优先级（priority）列表。运算符按优先级从高到低列出。\n\
  \n![Image](img/084tab01.jpg)\n\n这不是可用运算符的完整列表，但目前足够用了。因为这些运算符作用于数字，所以它们通常被称为*数值运算符*。然而，其中一个\
  \ `+` 运算符正如你已经看到的那样，也可以应用于字符串之间。\n\n***\n\n![Image](img/analysis.jpg) 代码分析：计算结果\n\
  \n**问题：** 尝试看看在执行以下语句后，计算 `a`、`b` 和 `c` 的值：\n\n```\nint a = 1;\nint b = 2;\nint\
  \ c = a + b;\nc = c * (a + b);\nb = a + b + c;\n```\n\n**答案：** `a=1`, `b=12`, `c=9`。计算这些结果的最佳方法是像计算机一样，逐条执行每条语句。当我这样做时，我会把变量值写在纸上，然后在执行过程中更新它们。这实际上是一种非常有用的做法。这意味着你可以在不需要实际运行程序的情况下预测程序将做什么。\n\
  \n***\n\n***\n\n![Image](img/wrong.jpg) 可能会出什么问题：愚蠢的计算\n\n表达式中使用的运算符之一是除法运算符。这意味着你可以编写这样愚蠢的代码：\n\
  \n```\nint factor = 0;\nint kaboom = 1 / factor;\n```\n\n这段代码尝试将 1 除以 0，得到一个不合理的结果。你可能会这会导致计算机本身崩溃。在过去，这确实发生过。我对以前用过的一个计算器有美好的记忆。如果我尝试将\
  \ 1 除以 0，它就会一直增加，试图达到无穷的结果。在 C# 程序中，发生的情况是 C# 运行时将直接停止你的程序。\n\n***\n\n### 处理不同类型的数据\n\
  \n你已经发现在 C# 语言中，每个变量都有特征类型，例如 `string` 或 `int`。现在我们将更详细地探讨类型。你可以将类型想象成一个只能停一种汽车的车库。C#\
  \ 编译器执行类型检查，以确保程序不会以无效的方式组合类型。就像你不能把长轿车放入紧凑型车的车库一样，你不能直接将一种类型的变量转换为另一种类型。然而，程序经常需要在类型之间移动值——例如，为了用文本显示数值——那么如何这样做呢？\n\
  \n#### 将数字转换为文本\n\nC# 允许你编写可以操作文本和数字的程序，以便将数字表示为文本或将文本转换为数值。我们将通过制作数字钟来探索如何这样做。早些时候我们使用了一个获取星期几的\
  \ Snap。还有一个获取日期和时间的 Snap。`GetHourValue` 方法以整数形式返回小时值。以下语句声明了一个类型为 `int` 标识符为 `hourValue`\
  \ 的变量。然后它将该变量赋值为 `GetHourValue` 方法的结果。\n\nClick here to view code image\n\n```\n\
  int hourValue = SnapsEngine.GetHourValue();\n```\n\n现在你有了小时值，可以让程序输出它。你可能会通过使用 `DisplayString`\
  \ 方法制作数字钟的一部分，如下：\n\nClick here to view code image\n\n```\nSnapsEngine.DisplayString(hourValue);\n\
  ```\n\n但遗憾的是，这不起通。当你尝试运行程序时，Visual Studio 会生成一个错误。\n\n\n\n\n\n在这里，看起来编译器似乎想和我们争论一番，但这实际上并不是该信息的真实含义。`argument`（参数）是\
  \ C# 中称为你提供给方法的一段数据，用于告诉它你想让它做什么。在 `DisplayString` 方法的中，参数就是你想让程序显示的字符串。发生这个错误是因为我们没有给\
  \ `DisplayString` 传递一个 `string` 类型的参数。我们给它传递的是一个包含数值的 `int`。错误信息告诉你，`DisplayString`\
  \ 接收到的输入类型不正确，而且 C# 编译器不会自动将 `int` 转换为 `string`。为了让程序正常运行，我们需要将 `hourValue` 中的数字转换为程序可以传递给\
  \ `DisplayString` 的字符串。（如果你尝试使用 `SpeakString`，也会遇到相同的问题，因为该方法也期望被给一段一段要朗读的文本字符串。）\n\
  \n程序可以通过请求变量提供其自身的字符串版本，来获取任何类型变量的字符串版本。C# 中的每种类型都提供了一个名为 `ToString` 的方法，该方法返回一个描述该类型内容的字符串。\n\
  \n点击此处查看代码图像\n\n```c\nstring hourString = hourValue.ToString();\n```\n\n这条语句创建了一个名为\
  \ `hourString` 的新 `string` 变量，将小时值作为文本字符串存储其中。现在程序可以提供时间了。这里是我们运行时显示小时的完整程序。\n\n\
  ![Image](img/087fig01.jpg)\n\n* * *\n\n![Image](img/analysis.jpg) 代码分析：显示完整时间\n\n\
  如果我们之前开始的那个计时程序能在显示小时的同时也显示分钟值，将会得到改进。为此，我们有一个 Snaps 方法 `GetMinuteValue`。通过将此方法添加到程序中，你可以连接小时和分钟字符串来创建一个完整的时间消息，事实证明这非常简单：\n\
  \n点击此处查看代码图像\n\n```c\nint hourValue = SnapsEngine.GetHourValue();\nint minuteValue\
  \ = SnapsEngine.GetMinuteValue();\nSnapsEngine.DisplayString(hourValue + \":\" +\
  \ minuteValue);\n```\n\nCh04_06_TimeDisplay\n\n上面的语句获取了小时和分钟值，然后用冒号将它们显示在一起，如下：\n\
  \n![Image](img/088fig01.jpg)\n\n但如果你查看显示小时和分钟的代码，你应该注意到它有一个很奇怪的地方。之前，当我们想要显示数字时，必须将数字转换为字符串。\n\
  \n**问题：** 为什么 `DisplayString` 现在可以无问题地处理 `hourValue` 和 `minuteValue` 的值？\n\n**答案：**\
  \ 这段代码之所以能运行，与 `+` 运算符在程序中处理字符串的方式的一种特性有关。如果应用于 `+` 运算符的操作数之一不是字符串，则该操作数会被 C# 编译器自动转换为字符串。我并不喜欢这种行为。我看得出它的目的是让编写程序稍微简单一点，但当你学习编写代码时，你会发现这种行为非常难以理解。它意味着程序可以在任何可以使用字符串的地方使用数值（在本例中，为小时和分钟）。但我们知道事实并非如此。\n\
  \n* * *\n\n* * *\n\n![Image](img/happen.jpg) 让事情发生：说出时间，并放大它\n\n你可以对时钟做的一个简单改进是让它在屏幕上显示的同时也说出时间。但让一个时钟通过增大屏幕上字母的大小来指示时间也可能很有趣。Snaps\
  \ 方法 `SetDisplayStringSize` 可用于设置显示文本的大小。它接收一个数字进行处理，并使用提供的值来设置屏幕上文本的大小。\n\n点击此处查看代码图像\n\
  \n```c\nSnapsEngine.SetDisplayStringSize(20);\n```\n\n这条语句将显示字符串中的文本大小设置为 20，这是程序启动时的文本大小。如果你想要更大的文本，可以输入更大的值。你可以根据你的系统进行实验，看看哪些值对你最有效。（在书的稍后部分，你将学到对象在程序中是如何表示大小的。）我通过将小时值乘以\
  \ 20 并将文本大小设置为该结果得到了不错的效果，但你可能想尝试其他值。如果你乘以一个太大的数，你可能会发现程序显示“推”出了 Snaps 控制面板到应用程序窗口的底部，你必须停止程序以选择另一个运行的\
  \ Snaps 应用程序。\n\n* * *\n\n### 程序中的整数和实数\n\nC# 在程序中使用实数和整数时同样会强制类型检查。我们可以通过操作一个简单的程序，将华氏度转换为对应的摄氏度来观察结果。\n\
  \n#### 变量类型与表达式\n\n要将温度从华氏度转换为摄氏度，从华氏度值减去 32，然后将结果除以 1.8。你可以编写一个 C# 表达式来计算此结果：\n\
  \n点击此处查看代码图像\n\n```c\nint tempInFahrenheit = 54;\nint tempCentigrade = (tempInFahrenheit\
  \ - 32) / 1.8;\n```\n\n我很喜欢这段代码。它计算了摄氏度。它很好地使用了括号来确保程序先减去 32。不幸的是，程序在编译时产生了错误：\n\
  \n点击此处查看代码图像\n\n错误：无法将类型 'double' 转换为 'int'。你是否缺少了转换？\n\n发生这个错误是因为计算结果是一个带有小数部分的数字，而我们正试图将其存储在一个声明为整数变量中。C#\
  \ 编译器不允许这样做。\n\n* * *\n\n![Image](img/analysis.jpg) 代码分析：丢失数据\n\n目前还不清楚代码中哪条语句引起了问题。这引发了一些问题：\n\
  \n**问题：** “double”值是从哪里来的？\n\n**答案：** 程序中的双精度元素是字面量 1.8。当编译器看到整数字面量时，将其视为整数。当编译器看到包含小数点的字面量时，将其视为双精度实数。当\
  \ C# 计算一个表达式时，结果的类型是表达式中所使用的“最大”类型。这意味着双精度值的表达式将返回双精度结果。\n\n**问题：** 为什么编译器在抱怨？\n\
  \n**答案：** 将值从双精度转换为整数对于计算机来说并不是问题。对于程序来说这也是简单的操作。但是，编译器担心程序员可能会丢失数据，因为实数的可能会部分会被弃。它实际上说：“我不会这样做这种转换；你必须显式地告诉我要这样做。”\n\
  \n**问题：** 错误信息中提到的转换（cast）是什么？\n\n**答案：** 如果你排戏，你的工作是决定哪个演员扮演哪个角色。一旦你决定了，就可以告诉凯文他扮演麦白——并祝他好运。在编程术语中，转换（cast）非常相似。它就像是：“我知道这个值是一个双精度值，但在该语句中我想让它扮演整数的角色。”编译器对你意识到转换正在发生，并允许操作继续。你将在本节稍后部分学习如何进行转换。\n\
  \n\n\n\n我们可以通过使用 `double` 来更改存储摄氏度的变量类型来修复此错误：\n\n点击此处查看代码图像\n\n```\nint tempInFahrenheit\
  \ = 54;\ndouble tempInCentigrade = (tempInFahrenheit - 32) / 1.8;\n```\n\n### Ch04_07_\
  \ 摄氏度与华氏度\n\n#### 精度与准确度\n\n当我运行一直在学习的温度转换语句时，我得到了以下结果：\n\n`tempInFahrenheit = 54`\n\
  \n`tempInCentigrade = 12.222222222222221`\n\n乍一看，摄氏度的存储精度似乎比华氏度要高得多。但事实并非如此；这仅仅是数字计算的结果方式。当程序进行计算时，它生成了一个以这种高精度存储的结果，但这并不意味着数据中包含了更多的细节。\n\
  \n在我的大多数程序中，我并不使用双精度类型，因为我不需要那个程度的精度。相反，我使用 `float` 类型，它是 *floating-point number*（浮点数）的缩写。正如我之前提到的，这种类型存储数字的精度不如\
  \ `double`，但这些值占用的内存空间只有一半，而且计算速度快得多。如果你考虑在手机等小型设备上运行程序，那么这些考虑可能是重要的。\n\n* * *\n\
  \n![图像](img/common.jpg) 程序员提示：不要将精度与准确度混淆\n\n记住这一点非常：数字并不会因为高精度存储而变得更准确。在实验室中测量蚂腿长度的科学家无法做到超过几位数的精度（除非他们拥有某种惊人的技术），因此他们使用极得精度来存储和处理结果并没有意义。使用更高的精度会减慢程序速度，并且意味着变量会占用更多的内存空间。\n\
  \n* * *\n\n我可以修改温度转换程序，让变量 `tempInCentigrade` 存储在浮点变量而不是双精度变量中，如下：\n\n点击此处查看代码图像\n\
  \n```\nint tempInFahrenheit = 54;\nfloat tempInCentigrade = (tempInFahrenheit -\
  \ 32) / 1.8;\n```\n\n但遗憾的是，这些语句无法通过编译：\n\n点击此处查看代码图像\n\n错误 1 无法将类型 'double' 隐转换为\
  \ 'float'。存在显式转换（你是否遗漏了强制转换？）\n\n这与我们之前尝试将双精度值放入整数时遇到的问题相同。如果你仔细考虑，这个错误是完全合逻辑的。将双精度结果移动到浮点变量中可能会导致数据丢失，因为浮点值的存储精度没有双精度值那样精确。\n\
  \n* * *\n\n![图像](img/common.jpg) 程序员提示：编译器真的站在我们这一边\n\n随着你编写越来越多的程序，你会习惯编译器像这样挑剔。令人恼的是，在我们的程序案例中，使用\
  \ `float` 还是 `double` 并没有什么区别。然而，某一天，你可能会发现自己正在编写关于火箭制导计算的程序，其中结果的微小误差就可能导致灾难。编译器必须确保所有程序尽可能安全，因此你能做的最好的事情就是变得更好地处理这些错误，并尝试从源上不要引入它们。\n\
  \n* * *\n\n#### 通过强制转换转换类型\n\n我们可以通过强制转换（casting）来解决数字类型不匹配的问题。你使用强制转换来显式告知编译器，你意识到某个操作可能会丢失数据，但你知道这不会影响程序的行为。看这行代码：\n\
  \n![图像](img/092fig01.jpg)\n\n在这里，我将整个表达式封装在括号中，然后使用强制转换告诉编译器：“我不在乎这个值的类型是什么。我希望你把它视为一个浮点值。”该语句指示编译器执行显式转换，并在必要时丢弃结果中的某些细节。\n\
  \n强制转换是强大的魔法。你也可以使用强制转换将实数转换为整数：\n\n点击此处查看代码图像\n\n```\nint tempInCentigrade = (int)\
  \ ((tempInFahrenheit - 32) / 1.8);\n```\n\n这种强制转换实际上是非常危险的。它告诉编译器通过丢弃小数部分将实数转换为整数。也就是说，值\
  \ `0.999` 将被转换为 `0`，在此过程中丢失了大量数据。这里是执行此转换的更好方法：\n\n点击此处查看代码图像\n\n```\nint tempInCentigrade\
  \ = (int) (((tempInFahrenheit - 32) / 1.8) + 0.5);\n```\n\n在强制转换之前向值添加 `0.5` 确保了\
  \ `0.999` 被向上舍入。\n\n#### 在操作数上使用强制转换\n\n修复类型问题的另一种方法是给编译器提供关于它所处理的值的更多信息。如果我们告诉它\
  \ `1.8` 实际上是一个浮点值，它将生成浮点结果。你可以通过一点技巧这样做：\n\n点击此处查看代码图像\n\n```\nfloat tempInCentigrade\
  \ = (tempInFahrenheit - 32) / (float)1.8;\n```\n\n### Ch04_08_ 浮点数\n\n* * *\n\n\
  ![图像](img/analysis.jpg) 代码分析：转换与性能\n\n表达式中的类型对性能有影响。这值得探索。\n\n**问题：** 为什么你认为强制转换\
  \ 1.8 会更高效？\n\n**答案：** 如果我们将双精度计算结果强制转换为浮点值，我们实际上是在执行高精度计算，然后进行丢弃工作。更有效的方法是直接使用浮点值进行计算，无需转换。在普通程序中这可能没有区别，但这是关注性能的程序员（例如游戏开发者）经常担心的问题。\n\
  \n* * *\n\n事实证明，C# 的设计者提供了一种快速说明操作数是浮点值的方法——你只需要在值后面加上一个 `f`：\n\n![图像](img/094fig01.jpg)\n\
  \n值 `1.8f` 是程序中的字面量；它不是变量。在这个语句中实际上有两个字面量——`1.8` 和 `32`。除非我们给编译器更多信息，否则它将假设没有小数点的字面量是整数，带有小数点的是双精度。\n\
  \n#### 类型与错误\n\n当你一种类型转换为另一种类型时发生的错误是最难处理的错误之一。程序的意图可能是正确的——事实上，你告诉计算机要做什么没有任何问题——但程序的实现（实现此意图的语句）可能会导致数据丢失。编译器会注意到这一点，除非你显式地对这种转换负责，否则将拒绝编译程序。\n\
  \n\n\n\n\n```cpp\nint average = (t1 + t2 + t3) / 3;\n```\n\n**问题：** 这告诉了关于变量 `t1`、`t2`\
  \ 和 `t3` 的什么？\n\n**答案：** 它们必须是整数。如果它们是 `float` 或 `double`，编译器将不允许将计算结果存储在整数变量中。\n\
  \n**问题：** 你的朋友希望在结果中获得小数部分。他尝试了以下语句，虽然它可以正常编译和运行，但似乎并没有增加任何细节。问题出在哪里了？\n\n点击此处查看代码图像\n\
  \n```cpp\nfloat average = (t1 + t2 + t3) / 3;\n```\n\n**答案：** 计算产生的是整数结果，因为表达式中的所有操作数都是整数，而编译器总是按照操作数的最高精度进行处理的。\n\
  \n**问题：** 你告诉了你的朋友，他需要确保计算平均值的表达式产生浮点数结果。他将代码改为以下语句，但代码无法通过编译，现在他很生气。你该如何修复这个问题？\n\
  \n点击此处查看代码图像\n\n```cpp\nfloat average = (t1 + t2 + t3) / 3.0;\n```\n\n**答案：** 问题在于编译器将字面量\
  \ `3.0` 视为双精度值。计算生成了一个双精度值，而该值无法放入浮点变量中。修复此问题的最佳方法是在数值后加上一个 *f* (`3.0f`)，以此告诉编译器\
  \ `3.0` 是一个浮点数值。\n\n***\n\n### 额外 Snaps\n\n在进入下一章之前，你可能想通过使用更多的 Snaps 来锻炼你的编程技能。这里有几个你可以尝试的：\n\
  \n#### 天气 Snaps\n\n如果你确实有一些天气数据可以处理，那么将华氏度转换为摄氏度将更有用。名为 `GetTodayTemperatureInFahrenheit`\
  \ 的 Snaps 方法返回美国某个地点的温度。（信息由美国国家气象局 [www.weather.gov](http://www.weather.gov) 提供）。你必须为该方法提供你想查询温度的地点纬度和经度。以下是一个获取华盛顿州西雅图温度的示例。\n\
  \n点击此处查看代码图像\n\n```cpp\nint temperature = SnapsEngine.GetTodayTemperatureInFahrenheit\
  \ (latitude: 47.61,\n    longitude: -122.33);\n```\n\nCh04_09_TemperatureDisplay\n\
  \n你可以使用 Bing 搜索引擎找到美国境内某个城镇或城市的纬度。只需搜索“*MyLocation* Latitude”，你就能获得所需的数值。在调用方法时，`latitude`\
  \ 和 `longitude` 项是*命名参数*。你之前在第 3 章 中关于如何创建颜色值的描述中第一次见过这些的示例。在这里，我们提供了两个描述地点的参数。\n\
  \n如果你想获取某地天气状况的简描述，可以使用 `GetWeatherConditionsDescription` 方法，它返回一个描述状况的短字符串。\n\n\
  点击此处查看代码图像\n\n```cpp\nstring conditions =\n    SnapsEngine.GetWeatherConditionsDescription(latitude:\
  \ 47.61,\n        longitude: -122.33);\n```\n\nCh04_10_WeatherConditionsDisplay\n\
  \n我刚刚运行了该方法，它为西雅图返回了信息“多云”。\n\n请记住，这些方法仅提供美国境内地区的天气信息。如果你尝试使用其他国家或地区的纬经度值，将得到一个非常荒谬的温度（1000\
  \ 度）或一个指示天气信息不可用的消息。\n\n#### 掷骰 (ThrowDice)\n\n到为止，我们的程序运行方式完全一致。当我们使用相同的输入运行程序时，会得到相同的输出。但有时程序获取一些随机数据来处理是有用的。你可以利用随机性让游戏更有趣。Snaps\
  \ 库提供了一个名为 `ThrowDice` 的方法，模拟单次掷骰。不需要向该方法传递任何信息；程序可以直接使用提供的结果。接下来的三个语句展示了该方法的使用：\n\
  \n点击此处查看代码图像\n\n```cpp\nint spotCount = SnapsEngine.ThrowDice();\nSnapsEngine.SetTitleString(spotCount.ToString());\n\
  SnapsEngine.SpeakString(\"You have rolled a \" + spotCount.ToString());\n```\n\n\
  Ch04_11_Dice\n\n第一个语句将整数变量 `spotCount` 设置为掷骰的结果。第二个语句设置标题字符串，第三个语句播报结果。\n\n### 你学到了什么\n\
  \n在本章中，你学习了程序使用随机存存储器（RAM）来存储数据和代码。RAM 是一系列编号的位置，每个位置存储一个字节。你不需要担心数据存储在内存的哪个位置，因为\
  \ C# 会自动管理变量。\n\n每个变量的创建都带有一个由程序员选择的标识符。标识符应该反映变量的用途。变量可以被赋值，并且可以在表达式中使用。表达式由操作数（变量和字面量值）组成。表达式可以包含多个运算符，而运算符的执行顺序在\
  \ C# 中是有定义的，以确保结果符合预期。\n\n给定变量被定义为能够持有特定类型的数据，例如整数或字符串。C# 在不同类型之间转换时要求显式操作，以确保数据在转换过程中意外丢失。\n\
  \n以下是一些你可能喜欢的关于类型、变量和表达式的问题。\n\n**存储在计算机中的值是无限精确的吗？**\n\n不是的。每个数值类型都有特定的范围（最大和最小值）和精度（有效数字）。你可以通过选择使用更多字节内存存储每个值的类型来增加存储数据的准确性。例如，`double`\
  \ 变量占用 8 字节，而 `float` 变量只占用 4 字节。\n\n**使用双精度值可以获得更高的准确性吗？**\n\n这实际上取决于输入数据的准确性。如果你用尺子测量桌子的长度并将该值用于程序，那么使用双精度不太可能改进任何结果，因为输入值的精度并不高。\n\
  \n**在表达式中添加括号会让程序运行得更快吗？**\n\n不会的。它可能帮助编译器理解你的程序，但不会影响程序的实际运行速度。\n\n**变量的类型真的重要吗？**\n\
  \n\n\n\n是的。如果你尝试将文本存储在一个专门为存储数字的位置，这显然是行不通的。但如果你使用的数值类型范围不足以容纳你想要存入的数值，可能会遇到更糟糕的问题。例如，你可能会声明一个\
  \ `byte` 类型的变量（试图为了节省内存），然后在该变量中存储值 10,000。这将是无法容纳的（`byte` 中可以存放的最大值是 255），结果你的程序将随之表现出非常奇怪的行为。\n\
  \n## 5. 在程序中做出决策\n\n![Image](img/05fig00.jpg)\n\n***\n\n### 你将学到\n\n我曾将计算机比作一台香肠机，它接收输入，对其进行某种处理，然后产生输出。这是开始思考计算机的一种很好的方法，但计算机实际上执行的操作比这要多得多。与现实中的香肠机不同（它只是试图将你放入的任何东西做成香肠），计算机能够以不同的方式响应不同的输入。在本章中，你将发现如何让你的程序对不同的输入做出响应。你还将学习让计算机以这种方式工作所伴的责任——你必须确保程序做出的决策是合理的。\n\
  \n掌握了这些信息后，我们将构建一个根据用户选择行为的应用程序。在构建此应用程序的过程中，你将更多地学习可以用于控制程序的逻辑表达式。然后，在章节末尾，我们将通过探索如何在程序中结合图像和声音来扩展你新发现的编程技能。\n\
  \n- 理解布尔类型\n- 使用 `if` 结构和运算符\n- 创建语句块\n- 使用逻辑运算符创建复杂条件\n- 添加注释使程序更清晰\n- 游乐场设施设施与程序\n\
  - 处理程序资源工作\n- 你学到的内容\n\n***\n\n### 理解布尔类型\n\n你已经看到 C# 提供了不同的类型，例如 `string` 和 `float`，你可以用它们来表示程序中的数据。我喜欢认为，你会永远将头上的头发数量与整数联系在一起，将头发的平均长度与实数（浮点数和双精度）联系在一起。现在是时候认识另一个类型了：`Boolean`\
  \ 类型。与提供数值范围的数值类型不同，`Boolean` 类型只有两个可能的值：`true` 或 `false`。\n\n#### 声明布尔变量\n\n程序像任何其他类型的变量一样声明并赋值布尔变量。以下语句声明了一个名为\
  \ `ItIsTimeToGetUp` 的布尔变量，并将其值设置为 `true`。（在我的世界里，似乎总是该起床的时候。）注意，C# 的设计者决定通过给布尔类型命名为\
  \ `bool` 来稍微缩短程序文本。\n\n```csharp\nbool ItIsTimeToGetUp = true;\n```\n\n如果在极少数的情况下我被允许留在床里，我们可以更改赋值以将值设置为\
  \ `false`：\n\n```csharp\nbool ItIsTimeToGetUp = false;\n```\n\n***\n\n![Image](img/analysis.jpg)\
  \ 代码分析：布尔值\n\n**问题：** 如果我尝试将布尔变量设置为数字而不是 `true` 或 `false`，会发生什么？\n\n**答案：** 我认为我们都知道这个问题的答案。编译器对布尔值强制执行类型规则，就像对所有其他类型执行一样。C#\
  \ 程序中的关键字 `true` 实际上是一个字面量布尔值，表示 `true`，就像值 12 是一个表示数值 12 的字面量整数值一样。\n\n**问题：**\
  \ 为什么我们需要布尔变量？\n\n**答案：** 如果仔细考虑，我们并不真的需要布尔变量。我们可以简单地使用整数，并采用一种约定：0 表示 `false`，任何其他值都表示\
  \ `true`。然而，我们必须依靠所有程序员都理解这一约定并正确使用它。如果我们真的只感兴趣只存储 `true` 或 `false`（例如，我体么帅，要么不帅），那么使用一个可以仅表示这两种状态的类型就有意义了。拥有布尔类型的另一个好理由是在程序中执行逻辑，你将在本章的晚些部分学习这一点。\n\
  \n**问题：** `true` 和 `false` 是什么？\n\n**答案：** `true` 和 `false` 是程序中的字面量值，表示 `true`\
  \ 或 `false`。你以前见过字面量值。程序可以包含字面量整数 1 或字面量字符串“Rob”。如果我们在程序中使用 `false`，C# 编译器将其视为一个值为\
  \ `false` 的布尔值。C# 编译器将确保我们只将这些字面量赋值给布尔变量。\n\n***\n\n#### 布尔表达式\n\n布尔变量可以赋值给任何返回\
  \ `true` 或 `false` 值的表达式。例如，我每天都需要在早上 7 点起床。我们可以使用一个涉及当前时间小时值的布尔表达式：\n\n![Image](img/103fig01.jpg)\n\
  \n第一个语句使用当前时间的小时值设置 `ItIsTimeToUp`，以判断我是否需要起床。\n\n你可以通过 `!` 运算符反转任何布尔表达式的值（将 `true`\
  \ 变为 `false`，反之亦然）。该语句创建一个布尔变量 `ICanStayBed`，持有 `ItIsTimeToUp` 的反值。\n\n点击此处查看图像\n\
  \n```csharp\nbool ICanStayBed = !ItIsTimeToUp;\n```\n\n***\n\n![Image](img/analysis.jpg)\
  \ 代码分析：布尔表达式\n\n**问题：** `>` 字符意味着什么？\n\n**答案：** 如果你在学校学过数学，你就会熟悉 `>` 字符。它表示大于。就像\
  \ `+` 运算符将两个操作数并返回和一样，`>` 运算符比较两个值，如果左侧的值大于右侧则返回 `true`。\n\n**问题：** 为什么测试是“大于 6”而不是“大于\
  \ 7”？\n\n**答案：** 我们使用这个测试是因为我需要在 7 点起床。因此，当 `hourValue` 为 7 时，表达式必须为 `true`。如果我们使用“大于\
  \ 7”的测试，表达式将直到小时达到 8 变为真（因为 7 并不大于 7）。\n\n我认为测试布尔表达式的最佳方法是把它们读出来，将变量替换为实际值。如果你说表达式的结果在“7\
  \ 大于 7”时为真，你可以判断它是错误的，因为听起来就不对。当然，事实证明我完全支持任何能让我多睡一小时的软件漏洞。\n\n**问题：** 程序可以比较实数也可以比较整数吗？\n\
  \n**答案：** 是的。例如，大于（`>`）运算符可以适用于两个 `float` 值。\n\n**问题：** 我应该如何做一个测试来确定我是否可以在床上？\n\
  \n**答案：** C# 提供了一个名为“小于”（`<`）的逻辑运算符，可以执行此测试。\n\n点击此处查看图像\n\n```csharp\nbool ICanStayBed\
  \ = hourValue < 7;\n```\n\n***\n\n### 使用 `if` 结构和运算符\n\n\n\n\n\n假设我想写一个程序，显示一条消息来告诉我现在是否需要起床。我们可以使用\
  \ C# 提供的 `if` 结构，通过使用一个布尔变量来控制该程序的执行。在 C# 的 `if` 结构中，`if` 关键字后面跟着一个括在括号内的布尔值。这通常被称为\
  \ `condition`（条件）。条件控制着程序的行为。如果条件为真（true），则执行条件之后的语句；如果条件为假（false），则在程序运行时将忽略该语句。\n\
  \n下面是一个使用 `if` 结构的程序，只有当你在早上 7 点或以后运行它时，它才会显示“该起床了”的消息。\n\n![Image](img/105fig01.jpg)\n\
  \n我们可以通过在 `if` 结构内部包含逻辑表达式来简化程序，如下所示：\n\n![Image](img/105fig02.jpg)\n\n### 在 `if`\
  \ 结构中添加 `else` 部分\n\n许多程序希望在条件为真时执行一个操作而在条件为假时执行另一个操作。`if` 结构可以包含一个 `else` 元素，用于指定在条件为假时要执行的语句。\n\
  \n以下程序显示的消息取决于用户运行它的时间。在早上 7:00 之前，它显示“回去睡吧”。早上 7:00 之后，它显示“该起床了”。\n\n![Image](img/105fig03.jpg)\n\
  \n* * *\n\n![Image](img/analysis.jpg) 代码分析：`If` 结构\n\n**问题：** `if` 结构必须有 `else`\
  \ 部分吗？\n\n**回答：** 不需要。包含 `else` 部分在某些情况下非常有用，但取决于程序试图解决的问题。\n\n**问题：** `if` 结构中的条件控制的是编译器的行为吗？\n\
  \n**回答：** 不的。请记住，编译器是将你的 C# 程序文本转换为可以在计算机上运行的机器码的工具。当 C# 编译器编译 `if` 结构时，它会创建做出决策的机器码，然后运行选定的语句。决策是在程序运行时做的，而不是在编译时做的。\n\
  \n**问题：** 如果一个条件永远为真会发生什么？\n\n**回答：** 如果一个条件永远为真，受该条件控制的语句永远不会执行。如果编译器检测到这种情况，会给你发出警告“检测到不可达代码”（Unreachable\
  \ code detected）。\n\n**问题：** 为什么 `if 条件下方的语句缩进了几个空格？\n\n**回答：** 这条语句不需要缩进。即使我们将所有内容放在同一行，C#\
  \ 编译器也能理解我们想让程序做什么。缩进是为了让程序更容易理解。它显示了 `if` 结构下方的语句正受上方条件的控制。这样缩进代码是一种非常常见的做法，这种行为已经内置在\
  \ Visual Studio 编辑器中了。换句话说，当你输入 `if` 结构并在条件部分结束后按回车键时，Visual Studio 会自动对下一行缩进。\n\
  \n* * *\n\n### 关系运算符\n\n小于运算符（`<`）被称为 `relational operator`（关系运算符），因为它衡量两个值之间的关系。你还可以使用其他关系运算符。你选择哪种运算符取决于你想让程序做什么。\n\
  \n![Image](img/107tab01.jpg)\n\n* * *\n\n![Image](img/analysis.jpg) 代码分析：关系运算符\n\
  \n**问题：** 运算符中的两个（包含等于的那些）是用两个字符表示的。它是如何工作的？\n\n**回答：** 当 C# 编译器遍历你的程序时，它会寻找字符组合并将其转换为代表程序中元素的符号。这些元素随后被用于构建你的程序。其中一些符号是关键字，如\
  \ `if` 和 `int`。其他符号是元素，例如文本字符串（用双引号括起来）和字面量值。字符序列 `<=` 被识别并转换为“小于等于”符号。\n\n**问题：**\
  \ 我如何记住哪个符号代表哪个意思？\n\n**回答：** 当我学习编程时，我利用“小于”符号看起来有点像字母 `L` 的方法来区分它们的。\n\n* * *\n\
  \n### 等等运算符\n\n除了关系运算符外，C# 还提供了几个程序可以使用的 `equality operators`（等等运算符）来测试相等性。\n\n\
  ![Image](img/107tab02.jpg)\n\n这里有一个使用等于运算符在时间小时值为 9 时显示消息的示例。\n\n![Image](img/108fig01.jpg)\n\
  \n`==` 运算符可能会让人感到困惑。你已经看到，当你想要给变量赋值时，使用的是 `=` 运算符。C# 使用 `==` 符号来表示相等性测试，这样程序员就不会在这两个操作之间产生混淆。等等运算符用于生成真或假的答案，而赋值运算符用于移动数据。这些运算符的行为截然不同，因此用不同的符号来标识它们是有合理的。\n\
  \n* * *\n\n![Image](img/wrong.jpg) 可能会出问题的地方：比较实数\n\n在第 4 章中，我们开始处理实数，实数有小数部分也有整数部分。例如，值\
  \ 1.1 有一个整数部分（1）和一个小数部分（.1，或十分之一）。C# 程序可以在 `float`、`double` 和 `decimal` 类型中存储实值。你已经发现实数值并不总是被精确存储的；如果你尝试比较数值，可能会导致问题。\n\
  \n![Image](img/108fig02.jpg)\n\n我们知道 0.1 + 0.2 应该是 0.3，但由于计算机无法完全存储，0.1 + 0.2 的结果是\
  \ 0.3000000000000004。这是一个极小的差异，但从相等性测试来看，这两个数字是不等的，所以消息不会显示。请注意，这并不反映计算机或编程语言的问题；而是数字存储方式的结果。某些数字（例如三分之一）无法用小数形式精确表示。如果你想比较浮点值，你的程序应该将它们相减并查看差异是否很。\n\
  \n* * *\n\n### 比较字符串\n\n程序可以使用等等运算符比较两个字符串。这个程序获取星期几名称，如果是周六，则显示消息。\n\n![Image](img/109fig01.jpg)\n\
  \n你可以使用类似的代码制作一个通过名字识别人的程序：\n\n![Image](img/109fig02.jpg)\n\n#### 大写和小写字符\n\n如果你尝试用这个\
  \ Great One 程序，可能会遇到问题，这取决于你如何输入名字。相等性测试认为大写和小写字符是不同的；换句话说，如果你输入字符串“ROB”，你将不会特殊对待。\n\
  \n为了解决这个问题，你可以要求任何字符串提供其大写版本。字符串值提供了一个 `ToUpper()` 方法，返回一个将所有小写字母替换为大写字符的字符串。你可以这样使用\
  \ `ToUpper()` 方法：![Image](img/110fig01.jpg)\n\n无论用户输入“rob”、“Rob” 还是“ROB”，这个版本的程序都能正常工作。\n\
  \n### 创建语句块\n\n\n\n\n\n`if` 条件控制着 C# 语句的执行。然而，有时你可能希望在条件为真时执行多条语句。例如，你可以编写一个公告程序，它询问用户的姓名，然后用该用户最喜欢的颜色提供个性化的问候。为了实现这一点，程序需要从一个单一条件控制多条语句。\n\
  \n你通过创建一个语句的 `block`（**块**）来编写此类此类任务的代码。语句块是一系列被一对大括号——即 `{` 和 `}` 字符——围起来的 C# 语句。你在我们之前检查和编写的程序中已经见过语句块了；在那些程序中，`StartProgram`\
  \ 方法中的语句就被包含在一个块中。你可以在程序的任何地方创建块，它等同于单条语句。\n\n![Image](img/111fig01.jpg)\n\n这个程序将通过名字识别出我，然后用我最喜欢的颜色显示一条励人心心的消息。块中的所有语句都由\
  \ `if` 构造函数中定义的单一条件控制。\n\n### 代码块中的局部变量\n\n如果你查看 `ColorfulGreeter` 程序，你会发现变量 `dayOfWeek`\
  \ 和 `fullMessage` 是在由 `if` 条件控制的代码块内部声明的。C# 程序员说这些变量是该代码块的 `local`（局部），这意味着这些变量只存在于此块内部。一旦块中的最后一条语句完成，程序移出了\
  \ `if` 条件控制的语句块，这两个变量就会被丢弃。如果程序在稍后重新进入该块，变量将重新创建。程序中可以使用特定变量的部分被称为该变量的 `scope`（**作用域**）。\n\
  \nC# 编译器不允许你在声明该变量的块——作用域之外使用该变量，因为对编译器来说，该变量在程序的该点是不存在的。这是一种组织变量使用的非常合理的方法。它让程序更加清晰，因为程序员可以在程序中使用变量的地方更近的地方声明变量。此外，如果两个程序员在编写同一个程序，且他们每个人都想使用一个名为\
  \ `count` 的变量，只要它们在各自独立的代码块中声明，就可以做。。（在不使用变量时丢弃变量也可以节省内存，尽管在如今编写程序时，你通常有充足的内存可用。）\n\
  \n***\n\n![Image](img/analysis.jpg) 代码分析：考虑变量作用域\n\n查看以下语句：\n\n```csharp\n{\n  \
  \  int i=99 ;\n}\n\n{\n    int i = 100;\n}\n```\n\n**问题：** 在上述代码段中使用了多少变量？\n\n**答案：**\
  \ 有两个变量。它们都命名为 `i`，并且都是它们所在代码块的局部变量。在第一个块中，`i` 的值被设置为 99；在第二个块中，另一个变量 `i`（仅局部第二个块的局部变量）的值被设置为\
  \ 100。\n\n```csharp\n{\n    int i=99 ;\n}\n\n{\n    string i = \"I am i\";\n}\n\
  ```\n\n**问题：** 这段代码合法吗？\n\n**答案：** 是的。整型变量 `i` 在声明字符串变量 `i` 之前已经被丢弃（它超出了作用域）。\n\n\
  ```csharp\n{\n    int count=99 ;\n}\n\ncount = 100;\n```\n\n**问题：** 这段代码合法吗？\n\n\
  **答案：** 不合法。变量 `count` 的作用域被限制在声明它的代码块中，这意味着在块之外尝试将 `count` 设置为 100 将不起作用。如果你尝试在声明它的块之外使用变量，编译器会报错。程序员说该变量“超出了作用域（out\
  \ of scope）”。\n\n```csharp\n{\n    int i;\n    {\n        int i;\n        i = 99;\n\
  \    }\n}\n```\n\n**问题：** 这段代码合法吗？\n\n**答案：** 不合法。C# 编译器不允许你创建包含与外部块中同名变量的嵌套块。这样做可能会导致代码混淆。在这个例子中，并不一定清楚语句\
  \ `i = 99` 指的是内部块中声明的 `i` 版本还是外部块中的版本。\n\n***\n\n### 使用逻辑运算符创建复杂条件\n\n程序有时需要做出比简单的关系测试更复杂的决策。C#\
  \ 提供了你可以用于此操作的 `logical`（逻辑）运算符。例如，在周六我被允许睡懒赖直到 9:00 而不是 7:00，所以如果星期是周六，我需要执行不同的测试来查看是否需要起床。这个程序必须测试星期是否为周六\
  \ *并且* 时间是否是 9 点。该需求中的关键词是“和（and）”，这意味着两个条件都必须为真。\n\nC# 提供了一个 `logical` 运算符，单个和符号\
  \ (`&`)，它可以与两个逻辑操作数一起。如果 `&` 左侧的操作数和右侧的操作数均为真，则 `&` 运算符的值为 `true`。这是一个在周六且小时值大于\
  \ 8 时显示消息的程序。\n\n点击此处查看代码图像\n\n```csharp\nif (SnapsEngine.GetDayName() == \"Saturday\"\
  \ & SnapsEngine.GetHourValue() > 8)\n    SnapsEngine.DisplayString(\"It is time\
  \ to get up\");\n```\n\nCh05_10_ 周末闹\n\n有几种逻辑运算符可以组合逻辑值。\n\n![Image](img/114tab01.jpg)\n\
  \n***\n\n![Image](img/analysis.jpg) 代码分析：逻辑运算符\n\n使用逻辑做出决策是成为程序员的一部分。我们可以通过查看更多代码来探索这一点。看看这段代码，我添加了\
  \ `else` 部分。\n\n点击此处查看代码图像\n\n```csharp\nif (SnapsEngine.GetDayName() == \"Saturday\"\
  \ & SnapsEngine.GetHourValue() > 8)\n    SnapsEngine.DisplayString(\"It is time\
  \ to get up\");\nelse\n    SnapsEngine.DisplayString(\"什么时候打印?\");\n```\n\nCh05_11_\
  \ 何时打印\n\n**问题：** `if` 构造函数的 `else` 部分到底什么时候被执行？\n\n**答案：** 要得出答案，你必须从逻辑上思考。“该起床了”消息是在周六且小时值大于\
  \ 8 时产生的。因此，`else` 部分在这些情况不成立时都会执行。这意味着 `else` 语句在其他所有每天以及周六 8 点之前都会执行。\n\n**问题：**\
  \ 这段代码会在周五早上 6 点显示“什么时候打印？”吗？\n\n**答案：** 是的。6 点 点在我的起床时间之前，但因为不是周六，第一个条件为假。逻辑与运算符\
  \ (`&`) 需要两个操作数均为真，所以它不会触发“该起床了”的消息。\n\n**问题：** 如果我将上述语句中的 `&` 运算符替换为“短路”版本 `&&`\
  \ 会发生什么？\n\n**答案：** 程序的行为将完全相同，但在某些情况下运行速度稍快。如果星期不是周六，`&&` 运算符将不再测试小时值，因为对于 `&`\
  \ 操作来说，两个操作数都必须为真，如果第一个操作数为为假，测试第二个就没有意义了。\n\n**问题：** 你的朋友尝试编写一个闹钟程序，让你在周六早上 9 点起床，在周其他其他时间早上\
  \ 7 点起床。然而，它不起作用。这是他的代码：\n\n```csharp\nif (SnapsEngine.GetDayName() == \"Saturday\"\
  )\n    if (SnapsEngine.GetHourValue() > 8)\n        SnapsEngine.DisplayString(\"\
  It is time to get up\");\nelse\n    if (SnapsEngine.GetHourValue() > 6)\n      \
  \  SnapsEngine.DisplayString(\"It is time to get up\");\n```\n\n\n\n\n\n**答案：**\
  \ 代码的逻辑是正确的。如果星期是周六，程序会测试小时是否大于 8。对于一周中的其他任何一天，程序会测试小时是否大于 6。然而，你的朋友在编码时犯了一个错误。`else`\
  \ 语句与第二个 `if` 条件关联（`else` 总是与它最近的 `if` 关联）。你可以通过更改布局来反映代码的实际行为并观察这一点：\n\n点击此处查看代码图像\n\
  \n```\nif (SnapsEngine.GetDayOfWeekName() == \"Saturday\")\n    if (SnapsEngine.GetHourValue()\
  \ > 8)\n        SnapsEngine.DisplayString(\"It is time to get up\")\n    else\n\
  \        if (SnapsEngine.GetHourValue() > 6)\n            SnapsEngine.DisplayString(\"\
  It is time to get up\")\n```\n\n这表明，如果小时不大于 8，程序实际上会执行小时大于 6 的测试。上述代码的布局显示了程序的哪个部分由哪个条件控制。我们可以通过将语句放入块中来解决这个问题。\n\
  \n点击此处查看代码图像\n\n```\nif (SnapsEngine.GetDayOfWeekName() == \"Saturday\")\n{\n  \
  \  if (SnapsEngine.GetHourValue() > 8)\n        SnapsEngine.DisplayString(\"It is\
  \ time to get up\")\n}\nelse\n{\n    if (SnapsEngine.GetHourValue() > 6)\n     \
  \   SnapsEngine.DisplayString(\"It is time to get up\")\n}\n```\n\n***\n\n## 逻辑处理\n\
  \n编写此类此类逻辑决策的代码是学习编程中最困难的部分之一。这就像在解决逻辑谜题，因为这正是你所做的。我能给你的最好建议是写下你想让程序做什么，然后推演它，将该描述转换为逻辑表达式。例如：“我想在工作时间超过\
  \ 40 小时或星期是周六时支付加班费。”即使在编程多年后，我有时仍会求助于这种技术。一旦我写了一些我认为可以运行的代码，我就会通过尝试一些值并观察决策的结果来对其进行测试。\n\
  \n***\n\n![Image](img/happen.jpg) 让事情发生：让“起床程序”按分钟运行\n\n你现在对编写能够告诉你什么时候需要起床的程序有了相当的了解。然而，到目前为止编写的程序有一个严重的局限性，即它们只处理小时值。看看你是否否制作一个版本，让我在\
  \ 7:15 之后而不是 7:00 之后告诉我起床。\n\n**提示：** 你可能会尝试组合测试小时和分钟值的条件并决定何时触发闹钟而焦得不可交。我的强烈建议是让时钟仅按分钟值工作。你可以通过小时值乘以\
  \ 60 然后加上时间来计算当天的几分钟——例如，7:15 是 `(7*60) + 15` = 当天的第 435 分钟。使用“当天分钟”意味着你的测试将变得简单得多。\n\
  \n***\n\n### 添加注释使程序更清晰\n\n编写程序时，要让阅读你代码的人易于理解发生了什么是非常重要的。你已经看到，在为变量命名时，你需要确保该名称描述了该变量的用途。你还可以通过添加解释性注释使程序更加清晰，一旦你开始引导程序做出决策，你就应该添加注释来解释你的程序正在做什么。你不是为计算机写注释；你是为阅读你程序的人写注释。你还可以使用注释来指示程序的特定版本、最后修改的时间和原因，以及编写它的程序员名称——即使是你自己。\n\
  \n单行注释从字符序列 `//` 开始，并在行尾结束，如下所示：\n\n![Image](img/117fig01.jpg)\n\n你可以在语句的末尾或单独的一行中添加单行注释。在\
  \ Visual Studio 中，注释以绿色显示，使其突出显示。\n\n你可以通过用 `/*` 和 `*/` 包裹注释来编写跨越几行的注释，如下所示：\n\n\
  ![Image](img/118fig01.jpg)\n\n此程序中的注释非常清楚地说明了代码的功能以及如何使用它。当编译器在程序中看到字符序列 `/*` 时，它会忽略其后的文本，直到它看到\
  \ `*/` 为止，而 `*/` 结束了注释文本。你可以在程序的任何地方放置注释。编译器将完全忽略它们。\n\n有些人说，写程序有点像在写故事。我不完全认同这是真的，但我认为虽然程序本身不是故事，但一个好的程序确实具有一些特征：\n\
  \n- 它应该是易于读的。读者在任何时候都不应该被强制回溯，或温习作者假设已存在的知识。\n- 代码中所有的名称都应该具有意义并彼此区分。\n- 它应该有良好的标点符号和语法。各种组件应该以清晰的方式组织。\n\
  - 它在页面上应该看起来好看。一个好的程序缩进良好，语句应该分布在页面上。\n\n程序员添加的注释是良好程序的重要部分。没有注释的程序就像一架没有窗户的飞机：它可能带你去正确的地方，但从内部很难判断它要去哪里。注释有助于让你的程序变得更容易理解。你会惊讶地发现自己很快就会忘记是如何让程序运行的。在写注释时要大方，但不应该添加过多的细节。记住，阅读你程序的人应该掌握该语言，不需要你解释一切：\n\
  \n点击此处查看代码图像\n\n```\ngoatCount = goatCount + 1; // 将 goatCount 加 1\n```\n\n我觉得这种注释是对读者的侮辱。如果你选择合理的名称，你会发现代码的大部分内容会直接表达其意图。从现在开始，看到的示例代码将具有我认为适当的注释。\n\
  \n### 游乐场设施与程序\n\n现在你已经知道如何在程序中做出决策，你可以开始编写更有用的软件了。假设你的邻居是一个主题乐场的主人，他给了你一份工作。主题乐场的一些设施根据年龄限制，他想在游乐场到处安装电脑，以便人们了解自己可以玩哪些设施。他需要一些软件，如果你能提供解决方案，他会给你一张季票，这是一个非常诱人的提议。他告诉了你关于设施的以下信息：\n\
  \n![Image](img/119tab01.jpg)\n\n\n\n\n\n`SelectFrom5Buttons` 方法在屏幕上显示五个按钮，然后等待用户选择其中一个。当用户选择一个按钮时，该方法将返回所选按钮的名称。随后，程序会将页面标题设置为所选游乐设施的名称`图\
  \ 5-1` 显示了程序运行时的界面。\n\n![Image](img/05fig01.jpg)\n\n**图 5-1** 用于选择游乐场设施的菜单。\n\n\
  在这里，用户正准备选择 `The Regurgitator`（吐出器）项目。你可以在任何需要用户从一系列选项中选择内容的地方使用 `SelectFromButtons`\
  \ 方法。Snaps 框架包含了该方法的两个版本以及最多到六个按钮的版本。\n\n现在，让我们在程序中添加一个 `if` 结构，使其根据选择的游乐设施表现出不同的行为：\n\
  \n点击此处查看代码图像\n\n```csharp\nusing SnapsLibrary;\n\nclass Ch05_13_HandleRiverCruise\n\
  {\n    public void StartProgram()\n    {\n        SnapsEngine.SetTitleString(\"\
  Super Funfair Rides\");\n        string ride;\n        ride = SnapsEngine.SelectFrom5Buttons(\n\
  \            \"Scenic River Cruise\",\n            \"Carnival Carousel\",\n    \
  \        \"Jungle Adventure Water Splash\",\n            \"Downhill Mountain Run\"\
  ,\n            \"The Regurgitator\");\n        SnapsEngine.SetTitleString(ride);\n\
  \        if (ride == \"Scenic River Cruise\")\n        {\n            SnapsEngine.DisplayString(\"\
  There are no age restrictions on this ride. Enjoy.\");\n        }\n    }\n}\n```\n\
  \n这段代码处理了用户选择“Scenic River Cruise”（风景游游）的情况，显示了`图 5-2` 所示的消息。\n\n![Image](img/05fig02.jpg)\n\
  \n**图 5-2** 确认河游没有年龄限制的消息。\n\n根据你从游乐场主那里获得的信息，你知道如果用户选择了 Scenic River Cruise 以外的任何设施，程序必须获取用户的年龄。你可以向代码中添加一个\
  \ `else` 语句来满足这一需求。记住，如果所选设施是 Scenic River Cruise 以外的，`if` 结构将执行代码的 `else` 部分，这正是我们想要的。在这里我在代码中程序需要读取年龄值的地方放置了注释。\n\
  \n点击此处查看代码图像\n\n```csharp\nif (ride == \"Scenic River Cruise\")\n{\n    SnapsEngine.DisplayString(\"\
  There are no age restrictions on this ride. Enjoy.\");\n}\nelse\n{\n    // We need\
  \ to get the age of the user \n}\n```\n\n### 读取数字\n\nScenic River Cruise 的选择很容易处理，因为任何人都可以乘坐这项设施。对于其他设施，程序必须获取想要乘坐该设施的人的年龄。幸运的是，Snaps\
  \ 有一个名为 `ReadInteger` 的方法，我们可以用它来实现这一点。`ReadInteger` 方法读取用户输入的数字。它与你之前过的 `ReadString`\
  \ 方法相似：\n\n![Image](img/122fig01.jpg)\n\n`ReadInteger` 方法会显示一个询问用户年龄的提示，然后返回用户输入的整数值。`图\
  \ 5-3` 显示了如何读取年龄值。如果用户没有输入有效的整数（例如用户输入了字符串“twenty-five”），`ReadInteger` 方法将显示错误消息并要求用户再次尝试。\n\
  \n![Image](img/05fig03.jpg)\n\n**图 5-3** 获取用户的年龄。\n\n### 使用 if 条件构建逻辑\n\n一旦我们的游乐场程序知道了用户的年龄，它就可以决定用户是否可以乘坐该设施。程序有两项数据可以进行处理：\n\
  - 所选的设施，存储在名为 `ride` 的字符串变量中。\n- 用户的年龄，存储在名为 `ageInt` 的整数变量中。\n\n程序可以使用一系列的 `if...else`\
  \ 来做出决策：\n\n点击此处查看代码图像\n\n```csharp\nif (ride == \"Carnival Carousel\")\n{\n   \
  \ if (ageInt >= 3)\n    {\n        SnapsEngine.DisplayString(\"You can go on the\
  \ ride.\");\n    }\n    else\n    {\n        SnapsEngine.DisplayString(\"I'm sorry.\
  \ You are too young.\");\n    }\n}\n```\n\n这些条件适用于 Carnival Carousel（嘉年华旋转马）。第一个（外层）`if`\
  \ 语句用于确定设施。内部的 `if` 语句根据用户的年龄做出相应的决定。\n\n现在你已经有了适用于 Carnival Carousel 的代码，可以将其作为处理其他一些设施代码的基础。为了让程序适用于\
  \ Jungle Adventure Splash（丛林探险水嬉戏），你需要检查一个不同的设施名称，并根据不同的年龄拒绝用户。记住，对于这项设施，访问者至少需要满几岁。你可以检查访问者是否大于五岁（`ageInt\
  \ > 5`）或使用大于等于运算符。你可以检查访问者是否大于五岁来检查 `ageInt`。\n\n点击此处查看代码图像\n\n```csharp\nif (ride\
  \ == \"Jungle Adventure Splash\")\n{\n    if (ageInt >= 6)\n    {\n        SnapsEngine.DisplayString(\"\
  You can go on the ride.\");\n    }\n    else\n    {\n        SnapsEngine.DisplayString(\"\
  I'm sorry. You are too young.\");\n    }\n}\n```\n\n### 完成程序\n\n一旦我们的游乐场程序知道了用户的年龄，它就可以决定用户是否可以乘坐该设施。你可以通过使用相同的模式轻松实现\
  \ Downhill Mountain Run（下山跑）。但最后一个设施 Regurgitator（吐出器）更为复杂。由于这项设施非常极端，游乐场主对其健康表示担心，因此设置了年龄上限和下限。我们需要编写一系列条件来处理这种情况。要理解处理\
  \ Regurgitator 的代码，你需要更多关于 `if` 结构的知识。考虑以下代码：\n\n点击此处查看代码图像\n\n```csharp\nif (ride\
  \ == \"The Regurgitator\")\n{\n    // We get here we are dealing with the \n}\n\
  ```\n\n注释使得我们在块中添加的所有语句只有在所选设施是 Regurgitator 时才会运行。换句话说，该块中的任何语句都不需要询问“所选设施是 Regurgitator\
  \ 吗？”，因为该块只在这种情况下运行。语句之前的决策决定了语句运行的上下文。我喜欢添加注释来明确上下文，就像这样：\n\n点击此处查看代码图像\n\n```csharp\n\
