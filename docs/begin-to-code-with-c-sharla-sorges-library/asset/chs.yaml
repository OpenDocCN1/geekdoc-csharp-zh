  \ 2015 社区版` 是一款免费提供的应用程序，可以在 `Windows 10` 电脑上创建 `C#` 程序。如果你电脑上已经有了较早版本的 `Visual\
  \ Studio`（例如 `Visual Studio 2013`），恐怕你无法在学习本书中使用它。然而，`2015` 版本的 `Visual Studio`\
  \ 可以与现有的安装并存运行。在第 1 章中，我提供了一个关于如何安装 `Visual Studio` 并启动它的详细说明链接。为了使用 `Visual Studio`，最好有一个\
  \ `Microsoft` 账户，以便可以为你分配一个开发许可。\n\n#### 下载\n\n`Visual Studio 2015 社区版` 是一款免费提供的应用程序，可以在\
  \ `Windows 10` 电脑上创建 `C#` 程序。如果你电脑上已经有了较早版本的 `Visual Studio`（例如 `Visual Studio 2013`），恐怕你无法在学习本书中使用它。然而，`2015`\
  \ 版本的 `Visual Studio` 可以与现有的安装并存运行。\n\n（注：原文中存在大量重复段落，译文已按要求进行去重处理。）\n\n\n\n\n#\
  \ 你所学到的 (#ch01.html_ch01lev1sec4)\n\n## 建立工作场所\n\n如果你是一名在驾驶室里花费数小时在全国范围内运送货物的卡车司机，你会希望拥有一辆拥有舒适座椅、良好道路视野以及操作轻便控制装置的卡车。如果你的卡车有足够的动力以合理的速度爬山坡，并且在弯曲的山路路上易于操控，那会更有帮助。\n\
  \n与此类似，如果你打算在键盘前花费任何时间编写程序，你理应该准备一个体面的工作场所。如果可能，找一个可以放置电脑、键盘和显示器的地方，然后拉一把你不介意坐上几个小时的椅子。\n\
  \n编写程序不需要特别华丽的电脑，但你的机器需要合理的内存和处理器性能来处理我们将要用到的工具。我建议你找一台至少配备 `Intel i5` 或等效处理器、4GB\
  \ 内存和 256GB 硬盘空间的 `Windows 10` 设备。你可以使用比这配置更低的电脑，但它们可能会让开发过程变得有些沮丧，因为在你对程序进行任何更改后，它们需要一段时间时间来更新你的程序。\n\
  \n非常重要的一点是，`你必须有一台运行 64 位版本 Windows 10 的计算机`。非常小的设备运行的是 32 位版本的 `Windows 10`。这对于大多数应用程序来说很好，但它无法使用\
  \ `Visual Studio` 工具来构建 `Windows 10` 应用程序。\n\n## 获取工具和演示\n\n我们将使用的所有工具都是免费下载和安装的。我发现如此强大的软件可以免费供任何人使用，感到非常惊讶和幸运。`Visual\
  \ Studio` 程序让创建应用程序和游戏变得非常简单。它甚至可以帮助你将程序在 `Windows Store` 中出售。\n\n我强烈建议任何开始编程的人至少将他们的其中一个程序推向市场。想到你制作的软件可以在商店里提供给所有人，这种感觉很棒。\n\
  \n然而，在你开始分享或出售你的编程作品之前，你必须下载并安装实现这一切可能的工具。安装将需要一些时间，具体取决于你的网络连接速度。在某些情况下，你只能坐着等待，让内容从互联网获取并进行安装。在\
  \ `Visual Studio` 下载和安装期间，你可能有足够的时间整理一下环境并做些家务。不过注意一点：按照我给你的顺序执行操作非常重要。好消息是，你想要使用的每台电脑只需进行一次安装。\n\
  \n你安装 `Visual Studio` 的步骤会随时间变化，并且可能会根据你是否拥有 `Microsoft account` 或其他因素而异。我没有在这里列出详细步骤，而是在网上提供了这些信息（以便我可以在需要时随时进行更新）。\n\
  \n如果你还没有下载本书引言中“下载”节中描述的示例代码和其他在线内容，请访问以下网站并现在下载文件：\n\n`https://aka.ms/BeginCodeCSharp/downloads`\n\
  \n打开名为 `GettingStarted.pdf` 的文件，并按照其提供的说明安装 `Visual Studio Community 2015`，并提取并设置示例代码和应用程序。\n\
  \n安装完成后，为了确保你已准备就绪，请使用 `File Explorer` 打开包含演示代码的文件夹。你应该能看到图 1-1 所示的文件和文件夹。你现在准备好打开\
  \ `Visual Studio` 并开始用 `C#` 编码了，我们将在下一节中进行！\n\n![Image](img/01fig01.jpg)\n\n**图\
  \ 1-1** `BeginToCodeWithCSharp` 文件夹的内容。稍后你将从这里开始。\n\n## 使用工具\n\n你已经到达学习编程过程的一个重要点。你即将打开\
  \ `Visual Studio` 并开始使用本书的演示代码。这有点就像打开新公寓或房子的门，或者进入你买的一辆闪亮的新车。\n\n### Visual Studio\
  \ 项目和解决方案\n\n正如你将学到的，`Visual Studio` 将你的编程工作组织为*项目 (projects)* 和*解决方案 (solutions)*。当你使用\
  \ `Visual Studio` 开发应用、程序、网站、Web 应用、脚本、插件或其他内容时，你就会创建一个新项目。项目是一组资源（代码文件、图像等），被用于你正在开发的程序。当你创建项目时，`Visual\
  \ Studio` 还会创建一个解决方案并将项目包含在该解决方案中。一个解决方案可以包含单个项目，但当你的程序需要另一个项目所包含的资源时，你可以向解决方案添加额外的项目。解决方案中的所有项目都会由\
  \ `Visual Studio` 组合在一起使解决方案正常工作。\n\n`Visual Studio` 自动与解决方案文件（`.sln` 文件）关联，就像文字处理器与文档文件关联一样。这意味着当你打开图\
  \ 1-2 所示选中的 `BeginToCodeWithCSharp` 解决方案时，`Visual Studio` 环境和解决方案会自动打开。继续打开该解决方案（例如通过双击）。\n\
  \n![Image](img/01fig02.jpg)\n\n**图 1-2** 通过双击打开解决方案\n\n`Visual Studio` 是一种保护性程序，不会自动信任从互联网下载的项目，因此它会像图\
  \ 1-3 所示那样让你确认项目。在这种情况下项目是安全的（毕竟它们是我写的），所以选择确定。\n\n![Image](img/01fig03.jpg)\n\n\
  **图 1-3** Visual Studio 确认你选择的文件\n\n`Visual Studio` 提供了*解决方案资源管理器 (Solution Explorer)*，你可以使用它来浏览解决方案中的项目以及解决方案中的每个文件。`解决方案资源管理器`\
  \ 提供了一个组织良好的视图，让我们开始使用它。图 1-4 显示了当 `Visual Studio` 打开 `BeginToCodeWithCSharp` 解决方案时你应该看到的内容（你的显示取决于安装了哪些选项）。\n\
  \n![Image](img/01fig04.jpg)\n\n**图 1-4** Visual Studio 主页面。解决方案资源管理器位于页面右上方。\n\n\
  解决方案包含两个项目。一个是 `BeginToCodeWithCSharp` 项目，另一个是 `Snaps` 项目，它包含了示例应用程序使用的工具集。（`Snaps`\
  \ 项目提供了任何程序的功能，包括你以后创建的。你将在本书后面学习更多关于 Snaps 的知识。）\n\n### 使用 Visual Studio 运行程序\n\
  \n`Visual Studio` 被称为集成开发环境 (IDE)。它是程序员不仅可以编写程序代码还可以看到程序运行的地方。让我们通过运行为你下载的演示代码创建的一些示例应用程序来熟悉\
  \ `Visual Studio`。\n\n当你想要把控制权交给程序时，通过使用运行按钮告诉 `Visual Studio` 运行它，该按钮是我在下一页图 1-5\
  \ 中指出的绿色箭头的按钮。\n\n![Image](img/01fig05.jpg)\n\n**图 1-5** Visual Studio 的运行按钮启动你正在编写的程序\n\
  \n\n\n\n\n当您使用运行按钮启动应用程序时，Visual Studio 实际上执行了两个操作。首先，它根据解决方案中管理的组件创建应用程序。这个过程被称为\
  \ `building the application`（构建应用程序）。应用程序完成后，Visual Studio 会交出控制权并让其运行。对于我们的解决方案，构建过程需要连接\
  \ Internet 才能工作。\n\n现在点击运行按钮让应用程序运行。Visual Studio 会显示 `开始使用 C# 编写` 窗口，如 `图 1-6`\
  \ 所示。如果需要的话，您可以在屏幕上移动此窗口、将其最小化，并使用右上角的 `Maximize`（最大化）按钮（正方形）将其全屏显示。\n\n![Image](img/01fig06.jpg)\n\
  \n**图 1-6** `BeginToCodeWithCSharp` 应用程序正在运行。\n\n`BeginToCodeWithCSharp` 解决方案是我为您创建的一个应用程序，它可以让你在书中的示例应用程序之间导航。换句话说，书中的每个演示程序都作为一个独立的应用程序包含在解决方案中，通过运行解决方案，您就可以选择特定的示例应用程序进行运行。其中一些应用是可以使用的完整应用程序（甚至可以在\
  \ Windows 商店出售），而另一些则是我们将共同查看的特定编程点的简单演示。\n\n窗口底部的按钮是运行这些示例应用的控制控件。要运行应用程序，请先使用按钮上方的导航面板选择它。在标记为\
  \ `Folder`（文件夹）的左侧面板中，选择一个特定的应用程序文件夹，大多数文件夹以书的章节命名。在右侧面板中，从该文件夹选择一个应用程序。当您选择 `Run\
  \ an app`（运行应用程序）时，您选择的应用程序就会运行。\n\n***\n\n![Image](img/happen.jpg) 让事情发生：选择并运行应用程序\n\
  \n这是我们的第一个“让事情发生”（Make Something Happen）侧边栏——欢迎！有时在这些侧边栏中，我会要求您做一些事情，而在其他时候，我会要求您只需尝试某些东西。在所有情况下，您都在做开发人员所做的工作。这次我想让您选择并运行\
  \ `BeginToCodeWithCSharp` 中的一些应用程序。（是的，这是书中最简单的“让事情发生”了。）\n\n确保您的解决方案正在运行。从左侧面板选择一个文件夹，并在右侧面板选择一个示例程序。有很多应用程序可供选择。您可以从开始查看\
  \ `Chapter 03` 文件夹中的 `Ch_03_03_Speaking` 程序，它将让您的计算机通过声音向您介绍自己。\n\n![Image](img/009fig01.jpg)\n\
  \n选择 `Run an app`，您选择的应用程序就会运行。当程序完成后，导航面板将再次显示。尝试选择并运行更多应用程序。如果您想玩游戏，可以看一眼 `第 13\
  \ 章` 文件夹中的 `Ch_13_08_KeepUpGame`。\n\n***\n\n### 停止在 Visual Studio 中运行的程序\n\n在您尝试完一些应用程序后，您需要停止\
  \ `BeginToCodeWithCSharp` 应用程序。您需要这样操作，因为在程序运行期间，Visual Studio 不允许您更改程序的内容。（这样做就像在飞机仍在空中时对它进行维护。）而且，是的，您正准备通过编写一些代码来更改一个程序了！\n\
  \n当您想要停止程序时，只需使用右上角的关闭按钮（X）来关闭窗口即可，就像您处理任何其他应用程序一样。然而，Visual Studio 还提供了一个按钮（在 `图\
  \ 1-7` 中所示），您可以用它来停止运行中的程序。在程序由于某种方式“卡住”的罕见情况下，可以使用它。\n\n![Image](img/01fig07.jpg)\n\
  \n**图 1-7** 使用此按钮停止 Visual Studio 中运行的程序。\n\n### 重复应用程序\n\n您可以使用 `Run that app again`（再次运行该程序）按钮来重新运行上次运行的程序。即使您关闭了电脑并在稍后返回\
  \ `BeginToCodeWithCSharp` 解决方案，上一个程序的名称也会被记住。\n\n***\n\n![Image](img/wrong.jpg)\
  \ 可能会出什么问题：在应用程序中“卡住”\n\n欢迎来到我们的第一个“可能会出什么问题”（What Could Go Wrong）侧边栏。在这里，我们关注您在处理代码时可能会遇到的任何陷阱。在这个侧边栏中，我们将考虑您如何在示例应用程序之间移动。\n\
  \n某些应用程序是运行后即完成的简单演示，允许您从主应用程序的导航面板选择并运行另一个应用程序。其他应用程序被设计为持续运行，就像“真正的”应用程序一样。例如，您可能早些发现没有办法停止\
  \ Keep Up! 游戏；该程序被设计为持续运行。\n\n如果您发现自己“卡住”在某个应用程序中并想运行另一个，只需在 Visual Studio 中停止 `BeginToCodeWithCSharp`\
  \ 解决方案（如之前所示），或选择运行中应用程序右上角的 X 来停止它。虽然我刚刚向您演示了如何停止程序，但我还是想在这里包含一个“可能会出什么问题”侧边栏，向您展示我在您学习过程中会为您提供支持。\n\
  \n***\n\n### MyProgram 应用程序\n\n正如您所见，当您首次运行 `BeginToCodeWithCSharp` 解决方案时，应用程序会显示一条欢迎消息：“欢迎来到\
  \ Snap 世界。”这条消息是由一个程序显示的。\n\nVisual Studio 管理程序的方式就像 操作系统管理文件的方式一样。例如，现代应用程序包含声音和图像，这些项目都需要组合在一起使用，如\
  \ `图 1-8` 所示。\n\n![Image](img/01fig08.jpg)\n\n**图 1-8** MyProgram 应用程序\n\n在 Visual\
  \ Studio 中，解决方案管理器（Solution Explorer）帮助程序员管理组成程序的元素。您可以将解决方案管理器理解为特殊的资源浏览器。它提供了构建应用程序时用到的所有文件的视图。`BeginToCodeWithCSharp`\
  \ 项目包含许多文件夹。您可以通过点击项目旁边的箭头来导航元素和文件夹。在书的后面，我们将查看更多文件夹，但现在请您注意 `MyProgram.cs` 源文件，它存储在\
  \ `My Snaps apps` 文件夹中，并在 `图 1-8` 中被选中。该文件包含了当 `BeginToCodeWithCSharp` 解决方案启动时运行的代码。\n\
  \n在解决方案管理器中双击此文件，其代码将出现在 Visual Studio 的编辑器窗口中，如 `图 1-9` 所示。\n\n![Image](img/01fig09.jpg)\n\
  \n**图 1-9** 编辑器窗口显示了 MyProgram.cs 文件的内容。\n\n\n\n\n\n如果你认为编程语言必须是复杂且难以理解的，那么你就错错了。我认为许多人（能读懂英语的人）都能理解，图\
  \ 1-9 中所示的程序显示了“Begin to Code with C#”和“Welcome to the world of Snaps”的消息。\n\n程序之所以清晰，部分源于\
  \ C# 语言，它的设计初衷就是易于理解；但另一部分源于仔细挑选了能够描述程序组件的名称。我本可以用“xyzzy”来代替 `SetTitleString` 来命名在窗口中显示标题消息的行为。计算机并不并不乎我如何给这些东西命名，只要我保持一致并且它能区分它们即可。然而，我写这个程序不仅仅是为了计算机。我也是为了写给像你这样的初学者看的，你们将通过研究程序的功能来学习编程，然后开始编写你们自己的程序。\n\
  \n***\n\n![Image](img/happen.jpg) 让事情发生：修改消息\n\n点击“解决方案管理器”（Solution Explorer）中的箭头，打开\
  \ `BeginToCodeWithCSharp` 项目和 `My Snaps apps` 文件夹。双击 `MyProgram.cs` 文件并进行编辑（如果它尚未打开）。你可以通过修改此程序使其工作方式略有不同，从而创建你的第一个程序。你可以从修改程序显示的消息开始。我们正在运行的程序代码（你可以在图\
  \ 1-9 中也看到）如下：\n\n```sharp\npublic class MyProgram\n{\n    public void StartProgram()\n\
  \    {\n        SnapsEngine.SetTitleString(\"Begin to Code With C#\");\n       \
  \ SnapsEngine.DisplayString(\"Welcome to the world of Snaps\");\n    }\n}\n```\n\
  \nVisual Studio 专门编写，以不同的颜色显示代码的不同部分。一种约定是，程序运行时显示在屏幕上的文本——这些文本被称为*字符串*（string)—在程序代码中以红色文字显示。你不需要让字符串文本变成红色；当字符串在代码中被正确括起来时，这会自动发生。（稍后会详细介绍。）像我下面一样对字符串进行一些更改，但不要更改任何其他代码。然后使用\
  \ Visual Studio 中的运行按钮再次运行程序。屏幕上的消息将改变，以反映你对代码所做的更改。例如，下一页的截图显示了我更改的结果。\n\n点击此处查看代码图像\n\
  \n```sharp\npublic class MyProgram\n{\n    public void StartProgram()\n    {\n \
  \       SnapsEngine.SetTitleString(\"Rob Miles will one day rule the world\");\n\
  \        SnapsEngine.DisplayString(\"...oh yes he will\");\n    }\n}\n```\n\n![Image](img/014fig01.jpg)\n\
  \n在更改文本时要务必小心删除程序中标记字符串开始和结束的双引号字符（\"\"）。如果你删除了这些字符，你会发现这些文本在 C# 程序中不再具有意义，并且当你尝试运行程序时，将会得到错误。如果发生这种情况，请不要担心：Visual\
  \ Studio 编辑器具有强大的撤销（undo）功能，你可以用它来撤销对文件所做的更改。只需按住 `Ctrl` 键并按 `Z` 即可撤销对文件的连续更改。如果你在编辑器（显示代码的窗口）中多次按下\
  \ `Ctrl+Z`，你最终将回到程序的原始状态。\n\n你刚刚写了（或至少编辑了）你的第一个程序。现在，如果你被要求制作一个可以在屏幕上显示消息的东西，你已经对如何实现它有了初步的想法。当然，我还会解释你刚刚调整的代码的许多其他方面，帮助你完善理解！\n\
  \n***\n\n![Image](img/common3.jpg) 程序员观点：并没有所谓的“专业”程序\n\n你在这里运行的——在对 `MyProgram.cs`\
  \ 文件进行编辑后——是一个“真正的”程序。如果你愿意，可以使用 Visual Studio 内置的工具将此程序提交到 Windows 商店，供世界上任何人下载和使用（尽管诚实地说，我不确定现在是否有人觉得它有用）。学习编程的人有时会想，他们什么时候才能达到像“专业”开发者一样精通的程度。答案是，只要有人付钱让你写程序，你就是一名专业开发人员。\n\
  \n当然，被给钱做某事并不会让你变得更擅长，但在这种，它应该为你的努力提供有用的焦点。如果你想让人为你的程序付钱，你需要确保你的程序是值得付费的。\n\n***\n\
  \n### 你学到的\n\n在第一章中，你为自己建立了一个工作空间，安装了将要使用的 Visual Studio 工具，并查看了书中提供的一些示例应用程序。你发现\
  \ Visual Studio 使用解决方案（solutions）和项目（projects）来组织资源。你还通过更改程序显示的消息创建了你的第一个应用程序。\n\
  \n为了加强对本章的理解，你可能想考虑以下问题：\n\n#### 程序（program）和应用程序（application）之间有什么区别？\n\n当人们谈论软件时，你会发现*program*和*application*（或简称为\
  \ *app*）这两个词被交替使用。当我谈论程序时，我描述的是某些告诉计算机做什么的代码。我认为应用程序是更大、更成熟的东西。应用程序将程序代码与图像、声音等资源结合，为用户提供完整的体验。程序可以简单到几行\
  \ C# 代码。\n\n#### Visual Studio 中的项目（project）和解决方案（solution）之间有什么区别？\n\n*solution*是最外层的容器。解决方案可以包含项目，并通常用于创建完整的应用程序或产品。*project*可以包含\
  \ C# 源文件，并通常是解决方案的一个完整子组件。例如，构成 Snaps 框架的所有 C# 程序文件都封装成一个项目——`BeginToCodeWithCSharp`解决方案中的\
  \ `Snaps` 项目——可以在任何需要使用 Snaps 资源的解决方案中使用。当你开始在本书中编写自己的应用程序时，你会经常使用 `Snaps` 项目中的资源。\n\
  \n#### 为什么我们需要像 C# 这样特殊的语言来为计算机编程？\n\n我对这个问题最喜欢的答案是这对句子：“Time flies like an arrow.\
  \ Fruit flies like a banana.”（时间如箭，果蝇喜欢香蕉）。人类可以推断出第一句关于飞行，而第二句完全关于昆虫和它们午饭吃什么。人类使用语言的方式充满了歧义和混乱。幸运的是，我们大脑中拥有非常强大的计算机，它们天生为了处理语言设计的，我们在早年都在为它们编程。相比之下，可怜的计算机有一个非常简单的思考机器，只有在给定硬性和快速的规则时效果最好。\n\
  \n\n\n\n\n# Visual Studio 是编写程序的唯一途径吗？\n\n不是的。你有许多工具可以用来创建软件。其中一些工具绑定于一种特定的编程语言，而另一些则更具通用性。不过，Visual\
  \ Studio 是最好的工具之一。\n\n## 如果我弄坏了程序怎么办？\n\n有些人担心，他们在计算机上对程序进行的操作可能会以某种方式“弄坏”它。我以前也担心过，但我已经克服了这种恐惧，方法是确保每当我做某件事时，总有一条退路。你现在正处于这种幸运的境地。你完全清楚如何在计算机上安装\
  \ Visual Studio，而且你正在使用从下载的 `.zip` 文件夹中提取的演示代码副本。即使发生了糟糕的错误，导致你弄坏了程序无法运行，你只需要从 `.zip`\
  \ 文件夹中重新提取一份干净的演示代码并重新开始。\n\n## 2. 什么是编程？\n\n![Image](img/02fig00.jpg)\n\n* * *\n\
  \n### 你将学到\n\n在本章中，你将处理更多的 C# 程序。但在在此之前，我们将进行一些侦探工作，发现究竟是什么让程序员，以及计算机到底在做什么。\n\n\
  - 是什么成就了程序员？\n- 计算机作为数据处理器\n- 数据与信息\n- 你所学过的\n\n* * *\n\n### 是什么成就了程序员？\n\n如果你以前写过程序，不要担心。编程并不是火箭科学——它……嗯，就是编程。学习编程最困难的部分在于，你在开始时会被很多想法和概念冲击，这可能会让你感到困惑。\n\
  \n然而，如果你觉得学习编程听起来很辛苦，或者你可能做不到，我强烈建议你把这些想法抛脑后。编程就像为朋友组织生日派对一样。\n\n#### 编程与派对策划\n\n\
  如果你正在组织一个派对，你必须决定邀请谁。你需要记住谁想吃素食披萨，哪些孩子不能坐在一起以免引起麻烦。你需要弄清楚孩子们会带走什么礼物，以及他们在派对期间会做什么。你还需要安排好时间，确保魔术师或乐队不会恰好在上菜时到达。为了寻求帮助，你会使用像**图\
  \ 2-1](#ch02.html_ch02fig01)**所示的列表来组织派对。编程就是这样。它完全关乎组织。\n\n![Image](img/02fig01.jpg)\n\
  \n**图 2-1** 派对策划非常像编程——你必须保持条理。\n\n如果你能组织派对，你就能写程序。程序中发生的情况有点不同，但基本原理是相同的。而且由于程序包含了你创建和管理的元素（不像不听话的孩子），你对具体发生的状况拥有完全的控制权。此外，一旦你进行了一些编程，你可能会开始以系统的方法处理所有任务，因此少量的编程经验可以让你整体上成为一个更好的组织者。\n\
  \n大多数人将编程定义为“通过做没人能懂的事情来赚大钱”。我将编程定义为“为给定的问题确定解决方案，并以计算机系统可以理解并执行的形式将其表达”。这个定义引出了两点点：\n\
  \n- 在编写程序完成任务之前，你必须能够自己解决这个问题。\n- 必须让计算机理解你想要让它做的事情。\n\n你可以把程序想得有点像食谱。如果你不知道如何烤蛋糕，你就无法告诉别人如何做。如果你交谈的人听不懂诸如“将面粉和糖翻入混合物中”之类的指令，你仍然无法告诉他如何烤蛋糕。\n\
  \n要创建一个程序，你必须采取你已经想出的解决方案，然后将其写成计算机可以执行的简单步骤。\n\n### 编程与问题\n\n我也喜欢把程序员想得有点像水工。水工带着一大包工具和备件来到工作现场。在观察了一会儿水路问题后，他打开包，取出各种工具和零件，将它们组合在一起，并解决了你的问题。编程就是这样。你被赋予一个要解决的问题，而你手头有一大包工具（在这种情况下是编程语言）。你观察问题一会儿，想出如何解决它，然后将语言的片段组合起来解决问题。编程的艺术在于知道需要从你的工具箱中取出哪些片段来解决问题的每个部分。\n\
  \n获取一个问题并将其分解为可以给计算机的一系列指令的艺术，是编程中有趣的部分。然而，学习编程不仅仅是学习编程语言的问题。编程也不仅仅是想出一个解决问题的程序。在编写程序时，你必须考虑许多事情，并不是所有事情都与当前的问题直接相关。\n\
  \n首先，假设你正在为客户编写程序。他或她有一个问题，并希望你写一个程序来解决它。我们还假设客户对计算机的了解比我们少。起初，你甚至不需要提到编程语言、计算机类型或任何此类；你只需要确保你知道他们想要什么。因为程序员以他们提出解决方案的能力而自豪，一旦被给出一个问题，他们会立即开始思考解决问题的方法——这几乎是一种反射动作。遗憾的是，许多软件项目都失败了，因为它们解决的问题是错误的。软件开发人员根本没有发现需求是什么。相反，他们创建了他们认为需要的东西。客户认为，由于开发者停止了提问，正确的解决方案正在构建中。只有在最后的交付时，可怕的真相才被揭露。你能立即对客户说出的最糟糕的话就是“我可以这样做”。相反，你应该先想：“这是客户想要的吗？我真的理解问题是什么吗？”提问这些问题是一种自律。在解决问题之前，你应该确保你对问题的定义是严密的，并且是你和客户都认同的。\n\
  \n在现实世界中，这种定义有时被称为*功能设计规范*，或 `FDS`。`FDS` 准确地告诉你是客户想要什么。你和客户都签字，底线是，如果你提供了一个按照设计规范运行的系统，客户就必须付钱。一旦你有了设计规范，你就可以思考解决问题的方法。\n\
  \n你可能认为如果你是为自己写程序，拥有规范是不必要的，但事实并非如此。编写某种形式的规范迫使你从非常详细的层面思考你的问题。它还迫使你思考你的系统不做什么。为自己构建东西时与为客户工作一样，你都需要这种清晰度。规范从一开始就设定了预期。\n\
  \n* * *\n\n![Image](img/common.jpg) 程序员观点：规范必须一直存在\n\n\n\n我曾为了赚钱编写过许多程序。在没有获得可靠规范之前，我永远不会编写任何程序。即使在为朋友工作时（或者尤其是那时）也是如此。\n\
  \n***\n\n### 现代开发\n现代开发技术将客户置于开发的中心，并让他们持续参与到设计过程中。这些技术反映了这样假设：在项目开始时获取确定的规范是非常困难的。作为开发者，你并不真正了解客户的业务，而客户也不了解用于解决问题的技术的局限性和可能性的。考虑到这一点，制作解决方案的一系列版本，并在进入下一个版本之前与客户讨论每个版本，是一个好主意。这被称为`原型设计`（prototyping）。\n\
  \n### 程序员与人\n了解客户想要什么是任何编程任务中最重要的方面之一。然而，在许多其他情况下，与其他人的沟通也同样重要。也许你想要说服一位富裕的资助者，你拥有下一个大作的想法；或者说服客户你拥有他们问题的最佳解决方案。\n\
  \n并不是所有程序员在开始都是优秀的沟通者。但要记住，沟通技巧是可以学习的，就像学习新的编程语言一样。这可能意味着要走出舒适区——没有人喜欢第一次站在观众面前——但通过练习，你可以掌握沟通技巧，并大大增加你在这一行业中走得远的机会。\n\
  \n有效的沟通也延伸到写作。能够创建他人可以读懂的文本是一项非常有用的技能，再次强调，最好的方法就是练习。我的建议是开始写博客或日记。最初只有你妈妈读你的博客没关系，重要的是你要经常写。如果你写一些你感兴趣的内容（我写关于编程的内容——不出所料吧——在`[www.robmiles.com](http://www.robmiles.com)`上），你会很快变得非常擅长。\n\
  \n***\n\n![Image](img/common.jpg) 程序员观点：能够良好交流的程序员获得最多的资金和最有趣的工作\n\n即使你只能用单字和咕噜声进行交流，只要你能快速编写出符合给定要求的代码，就可以通过编程过上生活。但真正有趣的任务会交给那些交流良好的开发者。他们是那些能够推销自己想法，并擅长与客户交流以发现客户想要什么的人。\n\
  \n***\n\n## 作为数据处理器的计算机\n现在你知道程序员在做什么，我们可以开始考虑计算机是什么，以及什么让它如此特殊。\n\n### 机器、计算机与我们\n\
  人类是一个工具制造的物种。我们发明发明来让生活更容易，我们已经这样做几千年了。我们从机械设备开始，比如犁，它让农作更高效，但在上个世纪，我们转向了电子设备。`图\
  \ 2-2`提供了一个快速总结。\n\n![Image](img/02fig02.jpg)\n\n**图 2-2** 为我们工作的机器。\n\n机器通常涉及某些东西进入（输入），并产生我们想要的输出或事件。犁有东西进入，产生作物作为输出。\n\
  \n随着计算机变得越来越小便宜，它们进入了许多领域。今天大多数相当复杂的设备都包含数据处理组件以优化其性能，有些设备的存在仅仅是因为我们可以构建此类功能。你作为一个初级程序员正在进入这个世界。将数据处理认为远不止计算公司工资——计算数字并打印结果（计算机的传统用途）。作为软件工程师，你不可避免地花费大量时间将数据处理组件适配到其他设备中驱动它们。\n\
  \n你还应该记住，看似无害的程序可能具有威胁生命的。例如，医生可能会使用你开发的表格来计算患者的药物剂量。在这种情况下，程序中的缺陷可能会导致伤害。\n\n###\
  \ 应用\n典型数据处理应用的示例包括以下（并在`图 2-3](#ch02.html_ch02fig03)`所示）：\n\n- **手机**：手机中的微型计算机接收无线电信号并将其转换为声音。同时，它接收麦克风的信号并将其转换为从无线电发送的模式。\n\
  - **汽车**：发动机中的微型计算机接收传感器信息，告知当前发动机转速、车速、空气氧含量等，产生电压以控制化油器的设置、火花塞定时以及其他优化引擎性能的内容。\n\
  - **游戏机**：计算机接收来自控制器的指令并使用这些指令来管理它为玩家创建的人造世界。\n\n![Image](img/02fig03.jpg)\n\n**图\
  \ 2-3** 许多不同的设备使用计算机。\n\n\n\n\n\n### 让程序运行\n\n每台计算机内部都都有硬件——也就是说物理机器——它们实际上执行了我一直在描述的数据处理工作。这些硬件被称为`中央处理器`，或\
  \ `CPU`。直接控制 `CPU` 并告诉它该做什么的程序被称为`机器码`。不同种类的 `CPUs` 具有不同的机器码设计，就像人类使用许多不同的语言进行交流一样。\n\
  \n机器码包含了告诉 `CPU` 应该做什么的各个步骤。简单的操作——例如，将一个数字加到另一个数字上——是由一系列机器码指令完成的。要编写机器码，你必须确切知道硬件是如何工作的以及它所理解的特定指令。为了理解这意味着，请查看图\
  \ 2-4，它显示了一个程序的部分内容，该程序用于计算客户在超市购买的物品总额。该程序将商品的价格加到客户的总账单中。\n\n![Image](img/02fig04.jpg)\n\
  \n**图 2-4** 高级程序中的单个步骤被低级程序拆解。\n\n右侧的指令是计算机实际上能够执行的低级指令。这些指令描述了计算机执行“将商品价格加到账单中”这一动作必须经历的各个步骤。编写低级程序相当枯燥，因为正如你所看到的，一个动作需要被拆分成许多更小的动作。\n\
  \n然而，好消息是，多年来程序员们考虑了这个问题，并发明了新的语言，用来告诉 `CPU` 该做什么。这些语言比机器码“层级更高”。用高级语言编写的程序并不提供执行某个特定动作所需的单个机器码步骤。它只包含诸如“将此数字加到另一个数字上”之类的指令。一种称为`编译器`的特殊程序会获取这个高级程序，并生成计算机能够执行该任务所需的机器码。在你写完高级程序（例如，使用\
  \ `C#`）之后，它将被编译，以生成在计算机内部运行的机器码。\n\n使用高级语言的一个有用副作用是，通过更改编译器，你可以为不同的硬件平台生成机器码程序。你在学习本书期间将编写的\
  \ `C#` 程序可以在 Windows、Android 和 Apple 设备上运行，因为有可用的编译器可以将高级语句转换为适用于这些设备的机器码。如果有人问你正在学习编程哪种类型的计算机，你可以正确地回答“所有”。\n\
  \n## 作为数据处理器的程序\n\n图 2-5 显示了每台计算机的工作。数据进入计算机，计算机对其进行处理，然后数据从计算机输出。数据以什么形式存在以及输出意味着什么完全取决于我们，程序做什么也是取决于我们。\n\
  \n![Image](img/02fig05.jpg)\n\n**图 2-5** 作为数据处理器的计算机。\n\n正如我之前快速提到的，另一种思考程序的方式是将其看作食谱，这在图\
  \ 2-6 中所示。\n\n![Image](img/02fig06.jpg)\n\n**图 2-6** 食谱与程序。\n\n在这个例子中，厨师扮演了计算机的角色，而食谱就是控制厨师如何处理配料的程序。食谱可以使用许多不同的配料，程序也可以处理许多不同的输入。例如，一个程序可能会获取你的年龄和你想看的电影名称，并提供一个输出来决定你是否可以去看那部电影。\n\
  \n***\n\n![Image](img/analysis.jpg) # 代码分析：神秘程序调查\n\n欢迎来到我们的第一个“代码分析”章节。在这些章节中，你将查看一些程序代码并考虑它提出的问题。在第一个情况下，你将获取计算机是什么的概念，并考虑当一个特定程序运行时会发生什么——你将尝试找出程序是如何处理输入以产生输出的。这有点像侦探工作，一位伟大的侦探到达罪案现场，然后利用可用证据推断发生了什么。下面的截图显示了当你运行第\
  \ 1 章中的第一个程序时看到的窗口。程序显示了一条欢迎消息以及一个文件夹和 Snaps 应用程序列表，正如你在这里看到的。\n\n![Image](img/029fig01.jpg)\n\
  \n**问题：** 这个程序的输入和输出是什么？\n\n**答案：** 识别输出非常简单。它是用户在屏幕上看到的显示。程序的输入识别起来稍微困难一点，但事实证明它们是在编写程序时被放入程序中的。在在上一个章节中，你学习了如何使用\
  \ `Visual Studio` 查看程序的内容。这里是你打开打开 `MyProgram.cs` 文件时找到的程序代码。\n\n![Image](img/029fig02.jpg)\n\
  \n我标出了程序中提供程序输入的两个字符串。在这种情况下，输入是以文本字符串的形式构建在程序代码中的，这些字符串会在程序运行时显示。你可以判断这些是输入，因为如果你更改了这些字符串，程序在运行时将会执行不同的操作。事实上，我们曾在第\
  \ 1 章 结束时确实这样做过。\n\n有些程序像这样是完全自包含的，它们所有的信息都构建在代码中。但程序更有可能从外部接收数据并对其进行处理。现在，让我们来看一个接收用户数据的程序。\n\
  \n这个程序是提供的代码中的 Snaps 应用程序之一。每一章都展示了若干示例程序，你可以通过选择左侧的章节文件夹、在右侧选择程序，然后选择 `Run an app`\
  \ 按钮来运行任何一个程序。我们将运行的第一个示例应用程序是 `Ch02_01_Mystery1`，你在该截图中看到它被选中。\n\n![Image](img/030fig01.jpg)\n\
  \n如果你对我们的神秘程序执行此操作，你会收到一个输入数字的请求，如下所示：\n\n![Image](img/031fig01.jpg)\n\n进入程序的数据是一个数字；在这里我输入了值\
  \ `1`。当你选择 `Enter` 时，程序获取该数字，对其进行处理，然后返回结果：\n\n![Image](img/031fig02.jpg)\n\n事实证明，当你输入\
  \ `1` 时，神秘程序的输出是 `2`。你可能对输入如何处理以产生此输出有一个理论。这里有两个符合我们观察的理论：\n\n- 程序可能总是输出 `2`。\n\
  - 程序可能将输入加 `1`。\n\n你可以使用 `Run that app again` 按钮再次运行神秘程序并尝试不同的数字。我尝试了几个数字并得到了以下结果：\n\
  \n- `1` 产生 `2`。\n- `2` 产生 `4`。\n- `3` 产生 `6`。\n- `0` 产生 `0`。\n\n根据这些结果，我认为我们可以推断程序的行为是将进入的数字翻倍。\n\
  \n程序员将这种程序检查方法称为*黑盒测试*。程序被视为一个无法查看内部的黑盒。输入值被喂入黑盒，并检查其输出是否符合我们认为程序应该做的做法。\n\n\n\n\
  \n黑盒测试的核心思想是建立一种信心，确保程序确实执行了我们想要的功能。如果有人付给我们巨额酬金编写一个能让输入数字翻倍的程序，从我们已经执行的测试来看，我们似乎已经有了可以胜任的东西。\n\
  \n我们所做的测试似乎很有说服力，但除非尝试每一个可能的数字，否则我们无法确定程序产生的输出始终是输入的两倍。这说明了这种形式测试的一个问题：它可以证明程序中存在缺陷，但不能证明缺陷不存在。\n\
  \n为了说明黑盒测试的局限性，请尝试输入 `40`，看看程序在接收该值时会发生什么：\n\n![Image](img/033fig01.jpg)\n\n结果显示，除了\
  \ `40` 之外的每一个输入值，程序产生的都是输入的两倍。但对于输入值 `40`，屏幕会显示“海盗王的消息”。这好像程序在专门寻找数值 `40`，并在接收到该值时表现出不同的行为。事实确实如是。如果你想了解这段代码是如何工作的，请在\
  \ Visual Studio 中打开示例程序并查看。使用 `Solution Explorer`（解决方案资源管理器）找到源代码文件，如下，就像你在第 1 章中打开\
  \ `MyProgram.cs` 文件一样。\n\n![Image](img/033fig02.jpg)\n\n* * *\n\n执行操作后，你会发现以下程序代码：\n\
  \n![Image](img/034fig01.jpg)\n\n现在，不要太担心程序文本中的大括号和不同颜色的单词；只需考虑被标出的元素。你可以看到代码中包含某种形式的测试（通过\
  \ `if` 结构实现，你将在第 5 章中学习更多内容）以及一个似乎通过将数值与其相加来实现翻倍的语句。\n\n如果你想防止程序中出现缺陷，就必须查看实际程序代码。程序员将这种程序评估形式称为*白盒测试*或*代码审查*。你不再观察程序对特定输入产生的输出，而是查看代码调用的操作，并确保这些操作与你想要的行为相匹配。你通过假装成计算机并运行程序语句来观察结果来实现这一点。\n\
  \n* * *\n\n![Image](img/common.jpg) 程序员观点：测试真的很难——但你必须尝试\n\n黑盒测试的危险之处之一在于，它只能证明程序存在缺陷。如果我们向程序输入大量数据且所有输出都是正确的，这并不意味着程序没有缺陷；它仅仅意味着我们还没有找到能让程序失败的测试用例。真正确保程序能够运行的唯一方法是查看代码本身。\n\
  \n请不要将“测试”与“为了看看程序看起来是否好用而做的某事”混淆。在“神秘程序 1”的数字翻倍机中，我们可以输入几个数字并查看生成的结果看起来是否正常，但那测试。那只是看程序看起来是否好用。\n\
  \n如果我认真的要测试这样的程序，我会创建一组特定的测试。我会确保测试包含非常大和非常小的数字，以及负值和数值 `0` 值，并将测试形式化，这样当测试成功执行后，程序就会被“签字认可”通过测试。如果我足够聪明，我会创建一个程序来替我进行测试。这个程序可以输入数百万个值并检查每个匹配的输出是否正确。当然，如果我的测试从未输入过\
  \ `40` 这个“海盗值”，那么程序虽然通过了测试，在使用时仍有失败的可能。但正如我所说，测试只能证明缺陷的存在，不能证明不存在缺陷。\n\n好消息是，黑盒和白盒测试的结合可以产生足够可靠的程序。但请记住，适当的测试是经过规划、管理和记录的，而不仅仅是“为了看看好用而做的某事”。\n\
  \n* * *\n\n* * *\n\n![Image](img/happen.jpg) 让事情发生：消灭海盗\n\n这个练习并不是真正的程序编程，但你应该能够制作出一个对于每个输入值都能正确运行的翻倍程序。你可以通过删除检查值\
  \ `40` 的代码以及发现值 `40` 时运行的代码来实现。你可以通过编辑章节示例本身来实现（在这种情况下，可以认为你对示例代码副本进行了“个性化”处理）。\n\
  \n* * *\n\n### 数据与信息\n\n现在你已经理解了计算机是处理数据的机器，而程序告诉计算机如何处理数据，让我们进一步深入探讨数据和信息的本质。人们经常混用*数据（data）*和*信息（information）*这两个词，但我认为区分两者很重要，因为计算机和人类考虑数据的方式完全不同。请看**图\
  \ 2-7](#ch02.html_ch02fig07)**。\n\n![Image](img/02fig07.jpg)\n\n**图 2-7** 左侧的数据；右侧的信息\n\
  \n计算机和人类考虑数据的方式完全不同。\n\n对于计算机而言，数据是计算机存储和处理的 1 和 0 的集合。这就是数据。\n\n另一方面，信息是人类对数据进行解释并赋予其含义。严格来说，计算机处理数据，而人类处理信息。例如，计算机可能在内存某处存储如下位模式：\n\
  \n```\n11111111 11111111 11111111 00000000\n```\n\n你可以将其视为意味着“你在银行透支了 256 美元”、“你在地面以下\
  \ 256 英尺处”或“32 个开关中有 8 个是关闭的”。从数据到信息的转换通常发生在人类读取输出结果时。\n\n为什么我得如此吹节？因为必须记住，计算机并不“知道”它正在处理的数据真正意味着什么。对于计算机来说，数据只是位模式；是用户赋予了这些模式意义。当你收到一张显示账户里有\
  \ 8,388,608 美元的银行单时，请记住这一点。\n\n\n\n\n你现在将运行另一个神秘程序，以观察计算机是如何存储数据的。这个程序的名字起得相当平庸，叫做\
  \ `Ch02_02_MysteryProgram2`。你可以按照之前的步骤来选择并运行它。（如果你愿意，也可以使用 Visual Studio 在开始时直接查看代码，但我认为那是在某种作弊。）\n\
  \n当你运行程序时，系统会要求你输入一些内容。输入单词 `hello` 并按 Enter 键，程序会显示如下所示的内容：\n\n![Image](img/037fig01.jpg)\n\
  \n程序显示了你刚刚输入的单词，后面跟着一系列神秘代码。如果你仔细观察，就能开始推导出这些代码的含义了。程序显示了五个代码值，这与单词“hello”包含的字母数量相同。此外，第三和第四个代码是同一个数字，就像“hello”中的第三和第四个字母相同的一样。\n\
  \n事实证明，这些“代码”实际上是计算机用来表示这些文本字母的数字。现代数字设备使用一种名为 Unicode 的标准，它提供了字符代码到特定数值的映射。这个神秘程序只是获取你输入的单词中的每个字符，将其转换为数字，然后显示该数字。让我们通过分析代码来具体它的工作原理。\n\
  \n点击此处查看代码图像\n\n```csharp\npublic class Ch02_02_MysteryProgram2\n{\n    public void\
  \ StartProgram()\n    {\n        SnapsEngine.SetTitleString(\"Mystery Program 2\"\
  );\n        // 从用户处读取字符串\n        string inputText = SnapsEngine.ReadString(\"Enter\
  \ something please\");\n        // 只显示字符串的前 10 个字符\n        if (inputText.Length\
  \ > 10)\n            inputText = inputText.Substring(0, 10);\n        SnapsEngine.AddLineToDisplay(inputText);\n\
  \        // 获取字符串中的每个字符\n        foreach (char ch in inputText)\n        {\n   \
  \         // 获取表示此字符的数字并\n            // 显示它\n            int chVal = (int)ch;\n\
  \            SnapsEngine.AddLineToDisplay(\"code = \" + chVal);\n        }\n   \
  \ }\n}\n```\n\n这个程序比第一个神秘程序更复杂。它包含一个循环——一种允许程序重复指令的编程机制——它被应用于你输入的单词中的每个字符，将字符转换为整数并显示。这段代码中用到了一些相当高级的\
  \ C# 结构，我们将在书后的部分介绍，但你应该能够从中提取出一些有意义的元素。目前，这已经足够了。\n\n***\n\n![Image](img/common1.jpg)\
  \ 程序员观点：能够“读懂”程序代码很有用\n\n多年来，我查看过很多程序。有些是我写的，有些是别人写的。有些程序是用我熟悉的编程语言编写的，而另一些则是用我从未见过的语言编写的。\n\
  \n我已经学会不要被那些我不懂的程序片段分心，而是专注于我能理解的部分。你可能不知道程序列表中的 `public class` 部分意味着什么，但行 `string\
  \ inputText = SnapsEngine.ReadString(\"Enter something please\");` 应该读起来有点意义，并让你认为这可能是程序获取文本字符串的地方。\n\
  \n美国人使用“spelunking”（探洞）一词来描述探索地下洞穴的爱好。这个词也被用来描述探索陌生程序代码的“爱好”。你应该尝试精通“探洞”书中的这些程序。你可以从寻找你已知存在的地标开始，然后以此为基础，不断完善你对程序行为的理解。例如，你知道程序在某处会对字符串中的每个\
  \ `for each` 字符执行操作。知道了这一点，你就应该能推推出该操作发生在代码的哪里。\n\n***\n\n### 你学到的知识\n\n在本章中，你学习了一些关于计算机实际上如何工作以及编程的本质。你发现计算机使用二进制（0\
  \ 和 1）处理数据，而编程就是向计算机提供指令以执行任务的过程。你还学习了数据和信息之间的区别。\n\n为了加强对内容的理解，你可能想考虑以下关于计算机和程序的问题。\n\
  \n**计算机会“知道”某人的年龄为 -20 岁是不合逻辑的吗？**\n不会。对于计算机来说，年龄值只是一个表示数字的位模式。如果我们想让计算机拒绝负数年龄，我们必须实际上将这种理解构建到程序中。\n\
  \n**如果程序的输出是汽车燃料喷射系统的设置，那么输出是数据还是信息？**\n一旦某事物开始对数据产生作用，我认为它就变成了信息。人类并没有对这些值进行任何操作，但它们会导致引擎速度变化，这很可能会影响人类，所以我认为这属于信息而非数据。\n\
  \n**计算机因为听不懂英语就是愚蠢吗？**\n要写出完全没有歧义的英语是非常困难的。法律行业的很大程度上建立在对文本的精确解释以及在特定情况下的应用之上。既然我们人类无法对如何理解某事达成共识，我认为因为计算机不能做到就叫它愚蠢是不公平的。\n\
  \n**如果不知道如何算出答案，我可以写一个程序来完成吗？**\n不能。你可以把一些语句组合在一起，看看运行时会发生什么，但这极不可能产生你想要的结果。这有点像是把一堆轮子、齿轮和引擎扔向墙壁，期望它们落地并组合成一辆可以运行的汽车。事实上，编写程序最好的方法通常是离开键盘一段时间，仅仅思考程序应该做什么。\n\
  \n**假设客户用英寸测量一切物是明智的吗？**\n对项目做出任何假设都是不明智的。一个成功的程序员需要确保他所做的每件事都建立在坚实的理解之上。你所做的每一个假设都会增加灾难发生的可能性。\n\
  \n**如果程序执行了错误，是我的错还是客户的错？**\n这取决于：\n\n• 规格正确，程序错误：程序员的错\n• 规格错误，程序正确：客户的错\n• 规格错误，程序错误：大家的错\n\
  \n\n\n\n\n![Image](img/03fig00.jpg)\n\n# 你将学习什么\n\n现在你已经对计算机、程序和程序员有了一点了解，你现在可以开始考虑编写程序代码了。\n\
  \n在本章中，你将仔细检查一些 C# 程序，以找出它们是如何运行的。我把这些程序“Snaps 应用”，因为它们使用了 `Snaps` 库，这是一个简单的编程资源集合，可以帮助你“转瞬之间（in\
  \ a snap）”完成任务。通过分析这些程序如何使用库提供的各种 `Snaps` 离散编程功能或行为，你将学习到 C# 编程的基础知识。在此过程中，你将学习更多关于如何使用\
  \ Visual Studio 创建和管理 `BeginToCodeWithCSharp` 解决方案中的代码元素，以及当编译器抱怨你的程序在它看来不合逻辑时该如何处理。\n\
  \n在本章的结束时，你将创建出能够为一些现实问题提供简单解决方案的程序。\n\n- C# 程序结构\n- 额外的 Snaps 技巧\n- 创建新的程序文件\n\
  - 额外的 Snaps 技巧\n- 创建自己的颜色\n- 你学到了什么\n\n## C# 程序结构\n\n让我们详细观察一些 Snaps 应用，以理解它们的元素以及这些元素的组织。当你第一次运行\
  \ `BeginToCodeWithCSharp` 解决方案时看到的欢迎界面并不复杂，但它是我们开始的好起点。我们在分析第 2 章 中的 `MyProgram.cs`\
  \ 时，已经快速检查了创建该体验的代码。现在请看名为 `Ch03_01_WelcomeProgram.cs` 的文件。（以防你忘记：使用解决方案管理器在解决方案的章节文件夹之间导航以找到该文件，然后选择该文件并在编辑器窗口中显示其代码。）\n\
  \n注意，代码与 `MyProgram.cs` 中的代码几乎完全一样，所以这个程序应该带给我们同样的体验，对吧？让我们检查一下。再次运行解决方案，在 **Folder**\
  \ 列表中选择 **Chapter 03**，在 **Snaps apps** 列表中选择 `Ch03_01_WelcomeProgram`，然后运行该应用。是的，同样的体验，这完全合逻辑。现在，让我们彻底拆解这个程序，弄清楚它是如何工作的。它的代码如下所示，我用注释标注了程序的每个部分。我们将在接下来的章节中逐行检查这些部分。\n\
  \n![Image](img/044fig01.jpg)\n\n### 识别资源\n\n```python\nusing SnapsLibrary;\n```\n\
  \n我在第 2 章中描述过 C# 编译器。这是一个将高层 C# 程序（如我们正在分析的这一个）转换成可以在你的计算机内部运行的机器码的程序。当你运行 C# 代码时，Visual\
  \ Studio 内置的编译器会将程序转换为机器码以便其运行。C# 程序可以包含称为“指令（directives）”的行，这些行为编译器提供指示。程序的的第一行是\
  \ `using` 指令。\n\n作为一名程序员，你经常想要使用预构建的软件部分，就像厨师有时会使用现成的面点一样。现成的 C# 程序被封装成组件库，可以添加到\
  \ Visual Studio 解决方案中。正如我提到的，`Snaps` 库就是我提供的一个此类库的示例，帮助你入门。这里的 `using` 指令将该库识别为已添加到我们解决方案中的资源，正如你稍后将看到的，这个程序将使用它的某些内容，具体说是\
  \ `SnapsEngine`。这个 `using` 指令告诉编译器：“如果我提到了你以前没见过的东西，去 `SnapsLibrary` 里看看你是否能在那里找到它。”这就像对我们的厨师说：“如果你需要用一些面点，去冰箱看看。”\
  \ 我们书中要编写的几个程序将只使用 `SnapsLibrary` 中的项。稍后我们将创建使用其他库的程序。\n\n***\n\n![Image](img/analysis.jpg)\
  \ 代码分析：使用 `using` 指令\n\n在某些“代码分析”章节中（如本节），你不需要查看任何代码就可以考虑与代码相关的问题。\n\n**问题：** `using`\
  \ 指令真的获取了程序想要使用的库吗？\n\n**回答：** 不。这听起来可能很困惑，但 `using` 指令只是告诉编译器去哪里查找程序中可用的项。程序可用的资源是在\
  \ Visual Studio 项目中设置的。我们可以更改 `using` 指令，引导编译器使用来自不同地方的代码。这就像是告诉厨师，“如果你需要用一些面点，去水槽边看看”，这样他就会使用另一个位置的资源。\n\
  \n**问题：** 如果我添加了大量的 `using` 指令，这会让我的程序变大吗？\n\n**回答：** 不。指令只是告诉编译器去哪里寻找东西。它不会增加程序的大小。\n\
  \n***\n\n### 开始一个类\n\n点击此处查看代码\n\n```csharp\npublic class Ch03_01_WelcomeProgram\n\
  ```C# 可以被称为面向对象的语言。这是因为在 C# 的世界里，一切都是对象。C# 程序可以是一个简单的数字，也可以是一个复杂的游戏。对象可以包含其他对象。包含在内部被称为对象的成员。\n\
  \n我们可以用类定义的形式表达对象。C# 类可以描述数据成员（对象可以持有的值）和行为成员（可以让对象做的事）。当你设计对象时，你编写 C# 来指定这些内容。程序的这行代码告诉编译器我们要定义一个名为\
  \ `Ch03_01_WelcomeProgram` 的 `class`。\n\n你之后会发现更多。\n\n**问题：** 类定义是定义对象的唯一方法吗？\n\n\
  **回答：** 不是。还有其他类型的 C# 对象，你之后会看到。\n\n**问题：** 定义类真的会创建对象吗？\n\n**回答：** 不。把类想象成对象的蓝图或设计，就像你可能拥有木房屋计划一样。拥有木房屋计划并不会真正给你木房屋，拥有类定义也不会真正给你对象。\n\
  \n**问题：** 所有的类都必须包含数据和行为吗？\n\n**回答：** 不是。有些类只包含数据成员，而另一些类只包含行为成员。例如，尚未看到的 Math 库包含了可以执行数学函数的类。\n\
  \n**问题：** 程序何时实际上根据类 `Ch03_01_WelcomeProgram` 创建对象？\n\n**回答：** 这是自动发生的。执行顺序如下：用户运行\
  \ **BeginToCodeCSharp** 应用，然后选择 `Ch03_01_WelcomeProgram` 并运行它。**BeginToCodeWithCsharp**\
  \ 应用创建一个基于 `Ch03_01_WelomeProgram` 类的对象，然后运行该对象的 `StartProgram` 行为。\n\n### 声明 StartProgram\
  \ 方法\n\n```csharp\npublic void StartProgram()\n```\n\n对象中的行为以方法的形式表达。方法是一段被赋予名的\
  \ C# 代码。程序可以通过给出方法的名称来运行方法代码——这被称为调用方法。你将从调用已经编写（由我编写）的方法开始，但稍后你将创建自己的方法。\n\n\n\n\
  \n\n此程序的唯一类——`Ch03_01_WelcomeProgram`——只有一个行为，一个名为 `StartProgram` 的方法。声明 `public\
  \ void StartProgram()` 标记了 `StartProgram` 方法的开始。（方法修饰符 `public` 和返回类型 `void` 告诉我们关于该方法的性质，但这些是我们目前不需要深入研究的细节。）`StartProgram`\
  \ 方法是特殊的。它是 Snaps 应用程序的入口。换句话说，要启动运行 Snaps 应用程序，就会调用 `StartProgram` 方法。\n\n此程序的类不包含任何数据成员，但以后我们将设计一些包含数据的对象。\n\
  \n***\n\n![Image](img/analysis.jpg) 代码分析：在类中声明方法\n\n**问题：** 行为（behavior）和方法（method）之间有什么区别？\n\
  \n**回答：** 行为是对象可以执行的操作。而方法是实现该行为的实际 C# 代码。\n\n**问题：** 一个类可以包含多个方法吗？\n\n**回答：** 是的。程序员决定一个类应该提供多少种行为，并为每种行为编写一个方法。我们一直在看的演示程序只有一个行为：启动演示。稍后，我们将创建内部包含许多方法的类。\n\
  \n**问题：** `StartProgram` 方法是如何被使用的？\n\n**回答：** `StartProgram` 是一个特殊的方法，因为它定义了任何\
  \ Snaps 应用程序的起点。当我们在 Snaps 库提供的环境中工作时，我们将始终调用 `StartProgram` 方法来启动程序的运行。\n\n***\n\
  \n### 设置标题并显示消息\n\n点击此处查看代码图像\n\n```csharp\nSnapsEngine.SetTitleString(\"Begin to\
  \ Code with C#\");\nSnapsEngine.DisplayString(\"Welcome to the world of Snaps\"\
  );\n```\n\n这两行代码中的第一行是 `StartProgram` 方法中的第一个 C# 语句。语句是程序中执行任务的部分。语句可以调用方法、做出决定或操纵某些数据。语句被包含在方法内部，并在方法被调用时执行。`StartProgram`\
  \ 方法只包含两个语句；较大的程序将包含更多的语句。`StartProgram` 方法中的两个语句确实调用了其他方法。\n\n方法中的每个条语句都是按顺序执行的，从第一个开始，然后移动到下一个。你可以使用几种类型的语句，你会在学习\
  \ C# 语言时发现它们。分号 `;` 字符标记每个语句的结束。\n\n第一条语句将我们的程序标题设置为“Begin to Code with C#”。它使用\
  \ `SnapsEngine` 类来实现此。`SnapsEngine` 类是 Snaps 库的一部分——我们在程序第一行中识别出的资源——该类提供了许多我们可以在程序中使用的行为。你可以将\
  \ `SnapsEngine` 想象成一种“程序管家”，它可以为你编写的程序执行任务。\n\n每个 `SnapsEngine` 行为都以 C# 方法的形式提供，我们的程序可以调用它们。在这个示例中，你可以看到如何使用\
  \ `SnapsEngine` 中的 `SetTitleString` 方法。然后，就像对管家的“给我喝口水”指令需要带上你想要的饮料类型一样，`SetTitleString`\
  \ 方法需要给出一个作为程序标题使用的文本字符串。C# 字符串给在所调用的方法名称后的括号中。在方法调用中添加的信息被称为方法的参数（argument）。\n\n\
  关于字符串本身，语句中的双引号字符 `\"` 标记了字符串的开始和结束——字符串紧接在第一个双引号之后开始，在第二个双引号之前立即结束。在 C# 中的约定是，当你想指定一段文本时，都要像这样用双引号将其括起来。如果我们在字符串文本中添加空格——例如`\"\
  \ Welcome to Snaps \"`——这些空格也会显示在程序的标题中（尽管用户可能不会注意到）。\n\n第二条语句的工作方式与前一个相同。它调用 `SnapsEngine`\
  \ 类中的方法，该方法将字符串作为消息显示在 Snaps 应用程序的屏幕上（而不是将字符串设置为屏幕上的标题）。当你看到 `DisplayString` 方法名时，你预会在方法的括号内看到引号和字符串文本吗？很好！\n\
  \n***\n\n![Image](img/analysis.jpg) 代码分析：在类中调用方法\n\n**问题：** `SetTitleString` 方法在哪里声明？\n\
  \n**回答：** `SetTitleString` 方法在 `SnapsEngine` 类中的声明方式，与 `StartProgram` 方法在 `Ch03_01_WelcomeProgram`\
  \ 类中的方式完全相同。以后你将发现如何在类中创建自己的方法。\n\n**问题：** 如果我不给 `SetTitleString` 提供一个要处理的字符串会发生什么？\n\
  \n**回答：** `SetTitleString` 的设计规定在调用时将提供一个字符串。如果程序没有为方法调用提供字符串参数，编译器会报错说程序无效。\n\n\
  **问题：** 为什么我们必须在给 `SetTitleString` 的字符串周围加上括号？编译器完全可以判断出要显示的字符串将以双引号开头吧。\n\n**回答：**\
  \ 我们需要包含括号的原因是告诉编译器输入方法的参数列表的开始和结束。`SetTitleString` 只向其输入了一个项，但其他方法可能有许多项。如果你查看程序的文本，你会发现\
  \ `StartProgram` 方法被指定为接受一个“空”参数列表，这意味着它不处理任何项。C# 语言的设计者使用了不同的字符来定义（或界定）程序中不同元素的范围。正如我们所见，字符串由双引号界。参数列表由左括号和右括号\
  \ `(` 和 `)` 界。类的内容和方法体由大括号 `{` 和 `}` 界。正如你预期的那样，编译器会仔细确保这些界符的使用“符合逻辑”，并会拒绝任何界符不匹配的程序。\n\
  \n***\n\n你可以将我们刚刚分析的这两个语句（设置屏幕标题和显示消息）视为示例程序的“有效负载”。这些语句周围的其余代码为这些操作提供了结构。要编写更大的程序，你只需要复制这种结构并添加更多语句。现在你已经了解了简单程序是如何组合的，你可以开始制作自己的程序了，以\
  \ Snaps 应用程序为起点。例如，你可以创建一个显示两个消息字符串的程序，而不是一个标题和一个消息，就像我在 `Ch03_02_MoreStatements.cs`\
  \ 中做的那样。\n\n\n\n\n在这个程序中，`SetTitleString` 没有被调用，并且有两个语句调用了 `DisplayString` 方法，因此程序会显示一条消息，紧接着显示第二条消息。你可以在程序中放入大量的语句。你只需要通过添加更多的语句，就可以编写一个逐行显示葛茨底斯堡演说（或其他任何长文本）的程序。需要记住，当程序运行时，每条语句都会按照顺序被执行。先前的程序在显示“Goodbye\
  \ chickens”之前，始终会显示“Hello world”。（让我再次强调一下，程序并没有显示你在上一个句子中看到的双引号，因为在界定字符串文本的双引号之间，字符串文本本身并没有出现引号。我在这一段落中使用的双引号仅是为了清晰起见，因为我正在描述程序要显示的文本。）\n\
  \n因此，当你通过 `DisplayString` 方法显示字符串时，它会替换之前 `DisplayString` 调用所显示的字符串（如果有之前的调用的话）。在我们的示例中，这就是为什么“Hello\
  \ world”被“Goodbye chickens”替换了。稍后你将发现如何在屏幕上构建多行文本。此外，如果你想的话，可以使用 `DisplayString`\
  \ 来显示非常长的消息；如果文本超出了屏幕边缘，它会自动换行。如果你显示一条极长的消息，你会发现它延伸到了屏幕底部，用户将无法阅读全部内容。\n\n### 额外功能\
  \ (Extra Snaps)\n\n每过一段时间，我会介绍其他的 Snaps——由 Snaps 库启用的行为——你可以尝试玩玩。你可以像我们一直分析的程序使用\
  \ `DisplayString` 一样，在你的程序中使用它们。\n\n### SpeakString\n\n你可以编写朗读文本而不是显示文本的程序。这是一个示例：\n\
  \n点击此处查看代码图像\n\n```csharp\nusing SnapsLibrary;\n\nclass Ch03_03_Speaking\n{\n  \
  \  public void StartProgram()\n    {\n        SnapsEngine.SpeakString(\"Hi there.\
  \ I'm your friendly computer.\");\n    }\n}\n```\n\n`SpeakString` 方法的使用方式与 `DisplayString`\
  \ 方法相同，但它让电脑输出提供的文本而不是显示在屏幕上。这是一个非常有用的方法，因为它可以轻松创建可以说话的程序。\n\n***\n\n![Image](img/analysis.jpg)\
  \ **代码分析**: 语音与显示\n\n让我们来看一些代码，并尝试找出它为什么没有按照预期工作。假设这是你弟弟写的程序。他想要一个能先显示“Computer\
  \ Running”然后说“Computer Running”的程序，但他抱怨说视觉消息直到电脑说话完之后才出现。\n\n点击此处查看代码图像\n\n```csharp\n\
  using SnapsLibrary;\n\nclass Ch03_04_DoubleOutput\n{\n    public void StartProgram()\n\
  \    {\n        SnapsEngine.SpeakString(\"Computer Running\");\n        SnapsEngine.DisplayString(\"\
  Computer Running\");\n    }\n}\n```\n\n**问题：** 为什么消息在电脑说话完后才出现在屏幕上？\n\n**答案：** 当你试图弄清楚一个程序的功能时，像像电脑一样运行”并按顺序逐条处理语句通常是有帮助的。电脑在显示消息之前先说话，是因为它严谨地严丝合缝地遵循了语句的顺序。`DisplayString`\
  \ 方法在 `SpeakString` 方法执行完毕之后才会运行。这个问题可以通过反转语句的顺序来解决。查看 Visual Studio 中的 `Ch03_05_DoubleOututFixed.cs`\
  \ 即可。\n\n***\n\n### 创建新的程序文件\n\n编程是极具创造性的，随着本书的进行，你将创建自己的程序。我真正希望的是你对程序有自己的想法，并与我建议的程序一起构建它们。你创建的每个新程序都是一个新的\
  \ Snaps ，其他学习者可以进行分析或使用。\n\n你可以使用 `MyProgram.cs` 程序文件作为起点创建一个新的 Snaps 应用。首先（像我们常做的那样）打开\
  \ `BeginToCodeWithSharp` 解决方案文件，然后在解决方案管理器中找到 `BeginToCodeWithCSharp` 项目下 `My Snaps\
  \ apps` 文件夹中的该文件。在解决方案管理器中右键点击该文件打开上下文菜单，然后选择“复制”，如 `图 3-1` 所示。\n\n![Image](img/03fig01.jpg)\n\
  \n**图 3-1** 复制程序。\n\n现在，右键点击文件夹并选择“粘贴”，将此副本粘贴到 `My Snaps apps` 文件夹中，如 `图 3-2` 所示。\n\
  \n![Image](img/03fig02.jpg)\n\n**图 3-2** 粘贴程序。\n\n`图 3-3` 显示了副本，命名为 `MyProgram -\
  \ Copy`。\n\n![Image](img/03fig03.jpg)\n\n**图 3-3** 程序文件。\n\n让我们重命名此文件以反映新的 Snaps。在解决方案管理器中右键点击该文件（名称中包含“Copy”的那个）打开上下文菜单，然后选择“重命名”（我确定你知道该怎么做！）现在你可以为你的应用输入新名称，非常小心不要删除末尾的\
  \ `.cs`。如果你删除了这部分，Visual Studio 就不会知道这是一个 C# 程序，并且在你尝试运行它时将无法工作。\n\n\n\n**答案：**\
  \ 要回答这个问题，你必须理解程序中 `logical`（逻辑）和 `physical`（物理）名称之间的区别。你可以将存放我们程序的文件名视为物理名称，因为文件名连接到计算机上存储的实际文件。然而，程序中元素的名称并没有绑定到存放程序文本的物理文件。它们存在于一个由程序员定义的“逻辑”命名空间中。\n\
  \n当 C# 编译器编译程序时，它会读取所有的源文件，并构建出一份程序中定义的所有不同项目的列表。这就是程序的逻辑命名空间。逻辑命名空间中的每个项目都必须具有唯一的名称。如果我们创建了两个同名的项目，编译器就会报错，这正是我们之前复制\
  \ `MyProgram.cs` 文件时发生的情况。复制之后，有两个名为 `MyProgram` 的类。我们通过将其中一个项目的名称更改为新的、唯一的名称，解决了这个问题。\n\
  \n**问题：** 程序的源文件名称（物理名称）与该源文件中类（class）名称（逻辑名称）必须匹配吗？\n\n**答案：** 不需要。让这两个名称匹配通常很方便，因为这可以更容易找到特定的项目，但\
  \ C# 编译器并不强制要求这样做。\n\n**问题：** 如果程序中已经包含一个名为 `Countdown` 的类，我们又添加另一个，会发生什么？\n\n**答案：**\
  \ 你可能猜得出发生什么。编译器会报错，因为它不喜欢有两个同名的项目。\n\n***\n\n顺便说一下，也许你期望在点击运行按钮时 `Countdown` 应用立即运行？每当第一次运行\
  \ `BeginToCodeWithCSharp` 时，Snaps 环境都会寻找一个名为 `MyProgram` 的类，然后调用该类中的 `StartProgram`\
  \ 方法。这意味着每当你启动 `BeginToCodeWithCSharp` 时，它都会首先运行原始程序：`MyProgram.cs`。然后你使用 `Folder`\
  \ 和 `Snaps apps` 列表选择你想要运行的其他应用程序。\n\n每次当你想要创建一个应用程序并将其添加到我们的 Snaps 环境时，都可以遵循这个复制、粘贴和修改的过程。或者，既然你已经知道\
  \ `MyProgram` 是 Snaps 环境启动时自动运行的程序，这里有一个可以让事情变得简单的小技巧：从编辑 `MyProgram.cs` 文件的内容开始。这样，你创建的代码就会运行，而无需在环境中环境中查找并选择新程序（就像我们刚刚运行\
  \ `Countdown` 应用程序时必须做的那样）。\n\n记住：只要 `MyProgram.cs` 中的类仍名为 `MyProgram`，这个程序就会在环境中首先运行。当你完成\
  \ `MyProgram.cs` 文件中新程序的构建后，你可以将程序代码复制并粘贴到新的源文件（一个新的 `.cs` 文件），为该新源文件赋予一个唯一的名称，并重命名新程序的类，这样\
  \ Visual Studio 就不会给你画红线并阻止你的程序编译。而且，此时，如果你真的想让 `MyProgram` 应用像在前三个章节中那样运行——设置相同的标题并显示我们在章节中看到的相同消息——你知道如何让它恢复到那种状态。\n\
  \n现在明白我为什么把这个源文件命名为 `MyProgram.cs` 了吗？它已经准备好供你用来构建很多程序了！\n\n***\n\n![Image](img/happen.jpg)\
  \ 让事情发生：构建一个倒计时公告器\n\n这个“让事情发生（Make Something Happen）”是非常有意义的。它代表了你通往编程启蒙之路上的一个非常重要的里程碑。在此之前，你一直在修改或修复现有的程序，这是一个很好的入门方式，但过了某个时刻，你必须从零开始创建自己的程序。那个时间就是现在。想想，即使是比尔·盖斯也得从某处开始。但我非常确定，他的第一个程序无法与其用户交流。在比尔·盖斯学习写代码的时代，让计算机说话是非常困难的，但他也会感受到像你现在即将感受到的那种兴奋感。\n\
  \n在你构建此应用程序之后，你就写下了你的第一个程序。你可以使用任何你想要的消息来让程序更具个性化，在下一节中，你将发现更多可以使用的 Snaps，用它们可以让程序变得更有趣。\n\
  \n你应该已经有一个名为 `Countdown` 的“空”应用程序。目前它几乎什么都不做——它只在最后一次看到的状态中设置了一个标题字符串——但现在你将编写自己的语句来赋予它生命。你可以使用\
  \ `SnapsEngine` 类提供的 `SpeakString`、`DisplayString` 和 `SetTitleString` 方法来创建你的程序。\n\
  \n你只需要做的就是写一个从 10 倒计时到 0 的程序。提示：你的程序将包含至少 10 条语句。改进程序，让它在屏幕上显示数字的同时将它们读出来。这应该使你程序中的语句数量增加一倍。\n\
  \n***\n\n***\n\n![Image](img/wrong.jpg) 可能会出什么错：编译错误\n\n在程序运行之前，必须经过编译器的检查。你可以将这个过程想象得像对飞机进行的飞行前检查。在飞行之前，机长必须绕飞机走一遍，数数翅膀，确保所有轮胎都有气，并确保飞机安全可行。同样，编译器在程序运行之前对其进行飞行前检查。如果程序不符合\
  \ C#，编译器将生成需要你（程序员）修复的错误。\n\n遗憾的是，编译器对错误的比人类挑剔得多。我可以走向某人并问“你在做什么？”，我会得到回答，尽管我问的问题并不规范。然而，如果我尝试编译以下程序，将会得到错误：\n\
  \n```csharp\nusing SnapsLibrary;\n\npublic class BadBrackets\n{\n    public void\
  \ StartProgram()\n    (\n        SnapsEngine.SpeakString(\"Hello world\");\n   \
  \     SnapsEngine.SpeakString(\"Goodbye chickens\");\n    )\n}\n```\n\n这段代码与我们知道可以程序非常相似，但文本中有两个小错误。坏消息是它们生成了\
  \ 11 个困惑的错误，如截图所示。\n\n![Image](img/058fig01.jpg)\n\n这种情况下困难的部分是，这些消息都没有真正告诉你哪里错了（有些看起来非常吓人）。编译器是一个非常聪明的程序，但它并不聪明到：“你在应该使用花括号的地方使用了括号”。更新这段代码，使语句以左大括号\
  \ `{` 开头并以右大括号 `}` 结尾，程序就能运行。当你标记程序部分的开始和结束时，必须始终使用花括号。括号用于其他用途。\n\n***\n\n***\n\
  \n\n\n\n# 1. 从一个可以`compiles` 或成功运行的程序开始。（记住：编译器会将我们的高级代码转换并生成机器码，使计算机能够执行我们让它执行的动作。这就是为什么我们说一个无错误且运行成功的程序就是已经编译通过了。）Visual\
  \ Studio 提供了软件向导，可以使用它们来创建一个功能简单但可以编译通过的程序。\n\n2. 经常编译（在 Visual Studio 中点击运行按钮）。如果你自上次成功编译以来所做的更改较少，你就可以将错误隔离到少数几个地方。\n\
  \n3. 寻找三种经典的编译错误：\n\na. 遗漏某些内容——例如，没有在语句末尾处加分号。\n\nb. 使用了错误的字符——例如，使用了 `` 而不是 `}`。\n\
  \nc. 拼写错误——例如，将 `StartProgram` 写成了 `startProgram`。在 C# 世界中，使用大写字母还是小写字母很重要。\n\n\
  4. 不要期望错误出现在编译器检测到的位置。某些错误——例如缺少大括号——可能在程序之后的很多行处才被检测到。\n\n5. 使用颜色高亮来帮助自己。属于 C#\
  \ 的单词显示为蓝色。文本字符串显示为红色。如果一个单词的颜色不是你认为它应该有的颜色，你可能输入错误。\n\n6. 修复所有你能看到的错误，然后重新编译。有时编译器会变得困惑，并在逻辑合理的行上报告错误。一旦你修复了所有能看到的错误，再次编译看看是否成功。\n\
  \n7. 使用撤销（Undo）和重做（Redo）。Visual Studio 包含一个非常强大的编辑器，带有撤销按钮（`Ctrl+Z`）和重做按钮（`Ctrl+Y`），你可以用它们对代码所做的更改向前或向回溯。你可以利用这些命令以及\
  \ Visual Studio 用于高亮错误的红色波浪线来找到错误所在。\n\n***\n\n![Image 代码分析：寻找编译错误此程序在编译时会产生 20\
  \ 个错误。看看你能否找到所有的错误。点击此处查看代码图像```csharpusing SnapsLibrary;public Class MyProgram{\
  \    public void StartProgram()    {        SnapsEngine.SetTitleString(\"Begin to\
  \ Code with C#\");        SnapsEngine.DisplayString(\"Welcome to the world of Snaps\"\
  );    }}```以下是错误：![Image](img/060fig00.jpg)\n\n如果你修复了这两个错误，我们就有了一个可以正常编译的程序。\n\n\
  ***\n\n### 额外的 Snaps\n\n在某些章节的末尾，我会介绍一些你可以尝试的额外 Snaps。你可以像之前使用 `SpeakString` Snap\
  \ 一样，在你的程序中使用它们。\n\n### Delay（延迟）\n\n你可能想通过 `Delay` Snap 让你的程序延迟一会：\n\n![Image](img/061fig01.jpg)\n\
  \n此程序显示“Start”，暂停 10 秒，然后显示“End”。`Delay` 方法与 `DisplayString` 的不同之处在于你提供的数据类型。你传递给\
  \ `DisplayString` 方法的是你想让程序显示的字符串。你传递给 `Delay` 方法的是你想让程序暂停的秒数。如果你想让程序暂停少于一秒，这个数字可以是一个分数：\n\
  \n![Image](img/061fig02.jpg)\n\n你可以使用 `Delay` 让程序看起来像在思考某事，或者给用户时间阅读屏幕上的某些信息。\n\n\
  ### SetTextColor（设置文本颜色）\n\n这个 Snap 让你设置屏幕上消息中文本的颜色：\n\n![Image](img/062fig01.jpg)\n\
  \n你也可以调用此方法来更改屏幕上已有文本的颜色。\n\n点击此处查看代码图像\n\n```csharp\nusing SnapsLibrary;\n\nclass\
  \ Ch03_08_DelayedBlueText\n{\n    public void StartProgram()\n    {\n        SnapsEngine.DisplayString(\"\
  Blue Monday\");\n        SnapsEngine.Delay(2);\n        SnapsEngine.SetTextColor(SnapsColor.Blue);\n\
  \    }\n}\n```\n\n此程序最初用默认颜色显示“Blue Monday”。两秒后，它将文本颜色改为蓝色。\n\n### SetTitleColor（设置标题颜色）\n\
  \n这个 Snap 让你设置屏幕上标题消息中文本的颜色：\n\n点击此处查看代码图像\n\n```csharp\nusing SnapsLibrary;\n\n\
  class Ch03_09_GreenSystemStarting\n{\n    public void StartProgram()\n    {\n  \
  \      SnapsEngine.SetTitleColor(SnapsColor.Green);\n        SnapsEngine.TitleString(\"\
  System Starting\");\n    }\n}\n```\n\n此程序将标题设置为绿色，然后显示“System Starting”。在 `SetTitleColor`\
  \ 的情况下，我们使用了 `SnapsColor.Green`。\n\n### SetBackgroundColor（设置背景颜色）\n\n这个 Snap 让你设置屏幕的背景颜色。\n\
  \n点击此处查看代码图像\n\n```csharp\nusing SnapsLibrary;\n\nclass Ch03_10_Red\n{\n    public\
  \ void StartProgram()\n    {\n        SnapsEngine.SetBackgroundColor(SnapsColor.Red);\n\
  \    }\n}\n```\n\n### 创建自定义颜色\n\nSnaps 库包含了一些你可以使用的内置颜色。例如，`SnapsColor.Blue`、`SnapsColor.Green`\
  \ 和 `SnapsColor.Red`。然而，你可能想使用库中没有的颜色，例如淡紫色。当你向计算机描述一种颜色时，必须使用数字：红、绿、蓝的量。在 Snaps（以及许多其他平台）中，每个描述颜色强度的数字范围都是\
  \ 0 到 255。\n\n### SetBackgroundColor 方法\n\n`SetBackgroundColor` 方法接受一个或三个项目进行处理。它可以接收一个\
  \ `SnapsColor` 值，也可以接收红、绿、蓝的值。每个颜色强度值都通过名称来标识，这使得程序员更容易看出哪个值用于什么用途。\n\n在设计方法时，程序员必须决定方法工作需要多少信息以及这些信息应该是什么格式。在\
  \ `SetBackgroundColor` 的情况下，该方法需要被告知红、绿、蓝的量。供给方法的项目以列表形式给出，每个项目之间用逗号隔开。如果你漏掉了某个项目或列出了太多，编译器在尝试创建程序就会报错。\n\
  \n点击此处查看代码图像\n\n```csharp\nSnapsEngine.SetBackgroundColor(red:255,green:255);\n\
  ```\n\n编译器不喜欢这条语句，因为 Snaps 库中的 `SetBackgroundColor` 尚未被（我）创建为只接受两个项目。\n\n```\nError\
  \ 1: 方法 'SetBackgroundColor' 不接受 2 个参数\n```\n\n***\n\n![Image](img/wrong.jpg) 可能会出什么问题：糟糕的配色方案\n\
  \n\n\n\n如果你编写一个在红色背景上显示红色文字的程序，你不会遇到任何错误，但你的程序用户会怎么说呢？我个人喜欢使用默认颜色（即你启动程序时得到的那些颜色）。如果你想展示你的创造力，可以选择其他颜色，但请务确保在许多不同的设备上测试你的颜色配色方案，因为某些机器显示颜色的效果比其他机器好得多。如果你有客户，还应该向他们确认你提议的配色方案，因为颜色是客户意见非常强烈的方面之一。此外，不同的人对颜色的感知程度也不相同。不要假设别人看到的颜色和你看到的一模一样！\n\
  \n* * *\n\n* * *\n\n![Image](img/happen.jpg) 让事情发生：制作一个煮蛋计时器\n\n你现在可以使用你的编程技能来编写一个可以计算煮蛋需要多久的程序了。通过使用\
  \ `Snaps` 库中的 `Delay` 方法，你可以让程序在鸡蛋煮熟期间暂停，并在鸡蛋煮好时发出通知。我的测试表明，要得到一个完美的鸡蛋，你应该煮五成分钟（或\
  \ 300 秒）。这段代码是一个很好的起点——在你制作煮蛋计时器时，请复制这段代码，而不是复制或编辑 `MyProgram.cs`：\n\n点击此处查看代码图片\n\
  \n```csharp\nusing SnapsLibrary;\n\nclass Ch03_12_EggTimerStart\n{\n    public void\
  \ StartProgram()\n    {\n        SnapsEngine.SetTitleString(\"Egg Timer\");\n  \
  \      SnapsEngine.DisplayString(\"There are five minutes left\");\n        SnapsEngine.Delay(60);\n\
  \        SnapsEngine.DisplayString(\"There are four minutes left\");\n    }\n}\n\
  ```\n\n我认为这是你开发者的另一个重要里程碑。与你之前创建的倒计时器不同，这个程序具备了正式产品的所有要素。你妈妈会觉得这个程序很有用。Windows 商店有很多作为计时器的产品，没有理由你制作的计时器不能成为其中之一。\n\
  \n你可以为你的计时器添加额外功能，例如在鸡蛋快要好时更改屏幕颜色，甚至在计时器结束前提供 30 秒的警告——也许在最后时刻进行类似“十、九、八”的倒计时。你还可以让计时器通过语音播报剩余时间，同时将其显示出来。\n\
  \n你还可以利用这种设计来制作在许多其他情况下都有用的计时器。这里我能想到的四个：\n\n- 你的好朋友发现了开发自己照片的热情，她想要一个可以在黑暗下使用的计时器。这个计时器应该每隔五秒宣布一次经过了多少秒。\n\
  - 你和同事们建立了一个问答俱乐部，想要控制每个团队回答问题所需的时间。每个团队有 10 秒钟。\n- 你哥哥玩着一个游戏，每个玩家都必须用牙签在 30 秒内吃掉尽可能多的烘焙豆（我没说这是一种理智的游戏），他需要一个计时器来配合。\n\
  - 你妈妈热衷运动，需要一些东西来记录她训练的每个阶段，并告诉她下一个活动是什么。共有五项活动：原地跑步、俯卧撑、开合跳、坐立和深蹲起跳。每个活动应该执行 30\
  \ 秒，然后是 10 秒的休息时间。\n\n尝试着制作这些计时器以及你可能想到的任何其他计时器。在下一章中，你将发现程序如何从用户获取输入，这样你就可以做出出更好的计时器，允许用户设置计时器运行的时间长度。\n\
  \n* * *\n\n### 你学到了什么\n\n在本章中，你更加熟悉了你创建程序的 Visual Studio 环境。你看到了 C# 程序被表达为一系列语句，这些语句在程序运行时会按顺序执行。你还看到你和我编写的高级\
  \ C# 代码通过一个名为“编译器”的程序转换为低级的计算机指令。有时代码编译成功，程序运行顺利；而有时代码因为错误而没有通过编译。\n\n你看到了编译器确保程序符合\
  \ C# 语言的规则。编译器会拒绝那些没有完全正确的语句的程序。而人类读者会容忍缺失或错误的标点符号，编译器会拒绝任何不遵守编程语言规则的内容。\n\n我们到为止编写的程序使用了由\
  \ `Snaps` 库提供的 Snaps，这让我们能够执行诸如语音消息、显示颜色和延迟程序执行等操作。这些组件以方法的形式提供，通过传递数据来告诉它们要做什么。例如，`SpeakString`\
  \ 方法被赋予要朗读的字符串文本。\n\n以下是一些你可能对程序、语句和编译器进行思考的问题。\n\n**程序的用户需要拥有 Visual Studio 副本才能运行程序吗？**\n\
  不需要。Visual Studio 可以生成用户无需 Visual Studio 即可运行的程序文件。\n\n**我必须知道每一个 Visual Studio\
  \ 命令是如何工作的吗？**\n不需要。通过操作其中的几个就可以应付了。\n\n**编译器因为对无效代码感到困惑就是因为它无能吗？**\n你可能觉得编译器有点傻，因为有时它在看到错误时确实会抱怨。如果你疑惑编译器为什么不直接替换正确的字符并继续运行，那是可以原谅的。然而，事实证明这样做是有理由的。如果编译器插入了它认为缺失的内容，它对你（程序员）真正想要做什么做了假设。让编译器坚持让你准确表达你想做的内容要安全得多。\n\
  \n每个方法都是为接收特定信息定制的。`Delay` 方法需要告知多少秒。`SpeakString` 方法需要要朗读的字符串。编译器知道方法被构建来接收什么，并且只会向它传递该类型的数据。如果你尝试向\
  \ `Delay` 传递字符串，程序将无法编译。\n\n[/content] -> (注：此处为演示逻辑，实际输出译文应按下方格式)\n\n---\n\n**抱歉，由于你在提示词中要求“输出应包含在[content]...[/content]中”，我将重新整合最后一段待翻译文本的输出结果：**\n\
  \n[content]\n如果你编写一个在红色背景上显示红色文字的程序，你不会遇到任何错误，但你的程序用户会怎么说呢？我个人喜欢使用默认颜色（即你启动程序时得到的那些颜色）。如果你想展示你的创造力，可以选择其他颜色，但请确保在许多不同的设备上测试你的颜色配色方案，因为某些机器显示颜色的效果比其他机器好得多。如果你有客户，还应该向他们确认你提议的配色方案，因为颜色是客户意见非常强烈的方面之一。此外，不同的人对颜色的感知程度也不相同。不要假设别人看到的颜色和你看到的一模一样！\n\
