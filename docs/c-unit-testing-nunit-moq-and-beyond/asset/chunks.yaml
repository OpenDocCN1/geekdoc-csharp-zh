  trans: "\n\n## 模拟文件系统（进阶）\n\n使用模拟（Mocking）框架来替代文件系统的交互，并直接检查方法尝试写入的内容。\n\n## Void\
    \ 方法中的异常\n\n如果你的 `void` 方法设计为在错误条件下抛出异常，那么你的测试应该断言这些情况：\n\n- `Assert.Throws<ExceptionType>(...)`\
    \ 确保抛出了正确的异常类型。\n- 检查异常详情：如果异常携带了额外数据（自定义错误消息），请在测试中验证这些数据。\n\n## 设计考量\n\n- 是否过度使用了\
    \ Void 方法？有时，将 `void` 方法重构为返回一个值（即使是简单的状态码或结果对象），也可以提高其可测试性。\n- 将可测试性作为设计驱动力：在编写代码之前考虑如何测试它，可以引导你做出更自然、更易测试的设计。\n\
    \n## 下节内容\n\n单元测试理想情况下关注一个孤立的单元。然而，当方法必须与外部组件交互时会发生什么？让我们学习处理异常的技巧。\n\n# 处理异常：在错误条件下的测试方法行为\n\
    \n异常情况（一语双关！）是软件开发中的事实。良好的单元测试不仅应该验证“快乐路径”（正常路径），还应确保代码能够优雅地处理错误场景。\n\n### 1.\
    \ 异常作为契约的一部分\n\n- 预期异常：如果方法设计为在特定条件下（例如，无效无效）抛出特定异常类型，你的测试必须断言这一点。\n- 文档异常：将方法抛出的异常视为其文档行为的一部分，随后，这也是你需要测试的内容的一部分。\n\
    \n### 2. NUnit 与异常\n\nNUnit 提供了几种断言异常的方法：\n\n- `Assert.Throws<ExceptionType>(...)`:\
    \ 最通用的形式。确保在代码块中的某处抛出了特定的异常类型。\n\n```csharp\nAssert.Throws<ArgumentNullException>(()\
    \  => myObject.Process(null));\n```\n\n- `Assert.That(() => myObject.DoSomething(),\
    \ Throws.Exception.TypeOf<InvalidOperationException>())`: 将断言与异常检查结合。\n- 检查异常详情：\n\
    \n```csharp\nvar ex = Assert.Throws<DivideByZeroException>(()  => Calculator.Divide(10,\
    \  0));\nAssert.That(ex.Message, Does.Contain(\"zero\"));\n```\n\n### 3. 测试策略\n\
    \n- 触发错误：仔细设计测试输入，以强制触发你想测试的异常条件。\n- 多种用例：同一个方法可能会根据错误类型抛出不同的异常类型。为每情况编写测试。\n\
    - 不要过度捕捉：在测试代码中，避免使用过于宽泛的 `try-catch`，以免隐藏异常的具体性质。\n\n### 示例：用户注册方法\n\n假设有一个如下要求的方法：\n\
    \n```csharp\npublic void  RegisterUser(string username,  string password)\n{\n\
    \ if  (username ==  null  )throw  new ArgumentNullException(...);\n if  (password.Length\
    \ <  8) throw  new ArgumentException(...);\n // ... 剩余的注册逻辑\n}\n```\n\n**测试将涵盖：**\n\
    \n- 传递空 `username` -> `ArgumentNullException`\n- 密码太短 -> `ArgumentException`\n\
    - 有效输入 -> 不抛出异常\n\n## 附加资源\n\n- NUnit 关于异常断言的文档：[`docs.nunit.org/articles/nunit/writing-tests/assertions/exception-assertions.html`](https://docs.nunit.org/articles/nunit/writing-tests/assertions/exception-assertions.html)\n\
    \n## 基础之外\n\n- 自定义异常：如果你有自定义异常类型，可以编写测试来验证它们携带的任何额外信息（错误代码、自定义消息）。\n- 错误处理逻辑：如果你的代码具有复杂的\
    \ `try-catch` 逻辑，你可能需要专门针对测试该错误处理行为的单元测试。\n\n## 验证事件调用：确保正确的事件处理\n\n事件是 C# 中异步和松耦合编程的基石。正确测试组件是否触发事件以及系统的其他部分如何对其做出反应，对于保证健壮的行为至关重要。\n\
    \n### 1. 为什么要测试事件？\n\n- 隐式契约：事件在代码部分之间建立了隐式连接。测试确保这些连接按设计工作。\n- 时机很重要：通常，单元测试应该验证事件是否按正确顺序或响应特定的触发器触发。\n\
    - 事件数据：如果你的事件携带数据，测试应该检查事件参数中的载荷是否正确。\n\n### 2. 测试事件的策略\n\n- 手动订阅：在测试中，订阅被测试单元的事件。在事件处理器内部，设置标记或存储结果以供后续断言。\n\
    - NUnit 的事件监听器：NUnit 为事件断言提供了一些支持，但通常被认为是基础性的。\n- 模拟框架（强大的工具）：模拟框架（我们稍后介绍）在这里变得无价。它们可以让你验证协作对象是否触发了带有预期参数的事件。\n\
    \n### 示例：文件监控组件\n\n假设有一个监控文件变化的类：\n\n```csharp\npublic class FileMonitor\n{\n\
    \    public event EventHandler<FileChangedEventArgs> FileChanged;\n    private\
    \ void OnFileChanged(string filename)\n    {\n        FileChanged?.Invoke(this,\
    \ new FileChangedEventArgs(filename));\n    }\n    // ... 文件监控逻辑 ...\n}\n```\n\
    \n**测试可以验证：**\n\n- 变化时触发事件：模拟文件变化并断言 `FileChanged` 已触发。\n- 事件数据：确保 `FileChangedEventArgs`\
    \ 中的 `filename` 是正确的。\n- 变化时不触发事件：测试在没有文件活动时事件是否不会被触发。\n\n### 3. 额外考虑\n\n- 异步事件：如果事件在不同的线程上触发，确保你的测试处理了等待或同步问题。\n\
    - 测试订阅者：你可能还需要专门针对响应事件的组件编写单元测试，以确保它们的行为符合预期。\n\n## 模拟框架使测试更高级\n\n虽然可以手动进行基础事件断言，但在处理事件时，模拟库可以赋予你更细粒度的检查和显著清晰的测试代码。\n\
    \n## 下节内容\n\n有时，你完美的单元测试设计依赖于测试未直接暴露的代码——那些讨厌的私有方法。让我们讨论测试这些方法的权衡和技术。\n\n# 解开测试私有方法的谜团\n\
    \n私有方法的设计目的是作为内部辅助工具。单元测试应该直接进入类的私有内部机制吗？让我们来看看支持和反对的论点，以及一些实用策略。\n\n### 纯主义者的观点：“不要这样做”\n\
    \n- 单元测试即公共 API：纯主义者认为，单元测试应该只测试类的公共接口。私有方法是实现细节。\n- 重构安全网：单元测试的一个关键优势是能够无忧地重构。如果你的测试依赖于私有细节，重构可能会在无意中破坏它们。\n\
    - 深层次问题的症状：对私有方法的测试需求通常预示着设计问题——该类可能做得太多，或者违反了单一责任原则。\n\n### 实用主义者的视角：“有时是必要的”\n\
    \n- 遗留代码：对于大型旧代码库，将其重构为“完美”可测试的单元在短期内是不现实的目标。\n- 复杂的内部逻辑：那些私有方法内部可能包含复杂的算法或计算，值得直接测试以确保正确性。\n\
    - TDD：如果你严格执行测试驱动开发，你可能在私有方法实现之前就写了执行这些预期行为的测试。\n\n### 策略（如果你必须这么做）\n\n- 反射：C#\
    \ 反射允许访问私有成员。注意：这会让测试变得脆弱，因为它们现在直接与类的内部结构绑定了。\n\n"
- fmt: "\n- ● Partial Classes and the ‘InternalsVisibleTo’ Attribute: Specifically\
    \ for testing purposes, you can expose internal members to your test assembly.\
    \ A less intrusive approach than reflection.\n- ● Elevate to Protected (If Feasible):\
    \ Consider whether the method could be made `protected`. This allows for derived\
    \ test classes to access it, maintaining some level of encapsulation.\n\n## Example:\
    \ Tricky Calculations\n\nImagine a private method in an `OrderService` that handles\
    \ complex tax calculations. Directly testing this private method could bring more\
    \ confidence than just testing edge cases of the public API.\n\n### Additional\
    \ Resources\n\n- ● Martin Fowler on Testing Private Methods: [https://martinfowler.com/articles/mocksArentStubs.html](https://martinfowler.com/articles/mocksArentStubs.html)\n\
    \n## When in Doubt, Refactor First\n\nBefore reaching for techniques to directly\
    \ test private methods, critically ask yourself:\n\n- ● Can I refactor the code\
    \ to extract the complex logic into a separate, more testable unit?\n- ● Do my\
    \ tests for the public methods provide enough indirect coverage of the private\
    \ behavior to give me confidence?\n\n## Up Next\n\nTesting isn’t about getting\
    \ a perfect score on some theoretical metric. Let’s discuss how code coverage\
    \ tools can provide valuable insights, but also how to interpret those insights\
    \ wisely.\n\n## Exploring Code Coverage: Metrics and Insights\n\nCode coverage\
    \ tools give you a picture of which parts of your code are executed by your tests.\
    \ However, understanding how to use this information wisely is key.\n\n### 1.\
    \ Beyond the Raw Percentage\n\n- ● High Coverage != Bulletproof: High coverage\
    \ doesn’t guarantee you’ve caught all bugs or that your tests are thorough.\n\
    - ● Low Coverage = Red Flag: Low coverage indicates areas of your code completely\
    \ untested and thus more likely to harbor problems.\n- ● Focus on Change: Utilize\
    \ code coverage tools to see which parts of your code are tested by changes for\
    \ a pull request or a feature development.\n\n### 2. Types of Code Coverage\n\n\
    - ● Line Coverage: The most basic - which lines of code were hit by the tests.\n\
    - ● Branch Coverage: Did your tests exercise different branches of `if`-statements\
    \ and conditional logic? This is often more meaningful than pure line coverage.\n\
    - ● Method Coverage: A finer-grained metric, ensuring individual methods have\
    \ been entered.\n\n### 3. Visualizing Code Coverage\n\nTools often provide ways\
    \ to visualize coverage directly in your IDE, highlighting lines in green (covered)\
    \ and red (not covered). This makes it very intuitive to spot gaps.\n\n### Example:\
    \ A Legacy Application\n\nYou’re adding features to an existing system with minimal\
    \ tests. Code coverage analysis might reveal:\n\n- ● Critical business logic:\
    \ with poor coverage: Prioritize writing tests here.\n- ● Old, unused code: If\
    \ it’s uncovered, perhaps it’s safe for refactoring or removal.\n\n### 4. Setting\
    \ Targets\n\n- ● Avoid Obsessing Over 100%: It’s often wasted effort. Focus on\
    \ the untested areas of high importance.\n- ● Reasonable Baselines: Start with\
    \ a modest target (e.g., 60-70%) and gradually increase it as you add more tests.\n\
    - ● New Code: Consider a stricter bar for newly written code, aiming for higher\
    \ coverage to avoid the build-up of ‘testing debt.’\n\n### Additional Resources\n\
    \n1. **OpenCover**: `OpenCover` is a free and open-source code coverage tool for\
    \ .NET, which is widely used and supports various testing frameworks like `NUnit`,\
    \ `MSTest`, and `xUnit`. You can find more information and download it from the\
    \ [OpenCover GitHub repository] ([https://github.com/OpenCover/opencover](https://github.com/OpenCover/opencover)).\n\
    2. **NCover**: `NCover` is a commercial code coverage tool for .NET, offering\
    \ features like branch coverage, code highlighting, and integration with popular\
    \ CI/CD systems. You can learn more about `NCover` and its features on the [NCover\
    \ website] ([https://www.ncover.com/](https://www.ncover.com/)).\n3. **JetBrains\
    \ dotCover**: `dotCover` is a code coverage tool provided by JetBrains, known\
    \ for its `ReSharper` and `IntelliJ IDEA` products. It offers integration with\
    \ Visual Studio and supports various .NET testing frameworks. You can find more\
    \ information about `dotCover` on the [JetBrains website] ([https://www.jetbrains.com/dotcover/](https://www.jetbrains.com/dotcover/)).\n\
    4. **Coverlet**: `Coverlet` is a cross-platform code coverage library for .NET,\
    \ compatible with .NET Core` and `.NET Framework`. It’s open-source and integrates\
    \ well with other testing frameworks. You can learn more about `Coverlet` and\
    \ how to use it from the [Coverlet GitHub repository] ([https://github.com/coverlet-coverage/coverlet](https://github.com/coverlet-coverage/coverlet)).\n\
    5. **Visual Studio’s built-in code coverage tools**: Visual Studio Enterprise\
    \ edition includes built-in code coverage tools that integrate seamlessly with\
    \ the IDE. You can run code coverage analysis directly from Visual Studio and\
    \ view coverage results within the IDE.\n\nEach of these tools has its own set\
    \ of features, advantages, and limitations, so you may want to evaluate them based\
    \ on your specific requirements and preferences.\n\n## The Right Mindset\n\nCode\
    \ coverage is a tool, not a master. Use it to:\n\n- ● Uncover blind spots\n- ●\
    \ Drive the creation of new, meaningful tests\n- ● Identify potentially unused\
    \ code\n\n## Up Next\n\nTesting is an evolving skill. Let’s discuss some real-world\
    \ testing challenges and the best practices to overcome them.\n\n## Real-world\
    \ Testing Challenges and Solutions\n\nUnit testing in a pristine, controlled environment\
    \ is one thing; real production systems are another. Let’s confront some common\
    \ hurdles and the best practices to tackle them.\n\n### 1. Challenge: Complex\
    \ Setups\n\n- ● Databases, External Services, etc.: Often, your code depends on\
    \ things difficult to replicate in unit tests.\n- ● Solutions:\n    - Mocking\
    \ Frameworks (more on this later) to simulate external dependencies\n    - Test\
    \ Databases: Use in-memory databases or dedicated, temporary test instances.\n\
    \    - Containerization (for complex cases): Package dependencies for easy setup/teardown\
    \ in tests.\n\n### 2. Challenge: Non-Deterministic Behavior\n\n- ● System Time:\
    \ Tests relying on the current date and time are brittle.\n- ● External Data:\
    \ If your test depends on data from an unpredictable source (web service, etc.),\
    \ results can be flaky.\n- ● Solutions:\n    - Control Time: Libraries to ‘freeze’\
    \ time for tests.\n    - Isolate External Dependencies: Mocks to replace those\
    \ with predictable responses\n\n### 3. Challenge: Legacy Code Monoliths\n\n- ●\
    \ Tightly Coupled Spaghetti: Code that wasn’t designed for testability is a nightmare\
    \ to isolate.\n- ● Solutions:\n    - Refactoring: It’s an investment, but gradually\
    \ breaking down dependencies makes code testable in the long run.\n    - Seams:\
    \ Find points where you can introduce test doubles, even minimally at first.\n\
    \    - ‘Characterisation Tests’ (For the truly awful): Write tests that capture\
    \ the current behavior, preventing regressions, and providing a safety net for\
    \ refactoring.\n\n### 4. Challenge: Asynchronous Code\n\n- ● Concurrency and Race\
    \ Conditions: Hard-to-predict interactions between threads/tasks\n- ● Solutions:\n\
    \    - Task-Focused Assertions: Features in testing libraries to work with `Tasks`\
    \ directly.\n    - Synchronization Primitives: If needed, carefully use semaphores\
    \ or similar to control execution order in tests.\n    - Deterministic Task Scheduling\
    \ (Advanced): For really intricate cases, there are libraries to orchestrate task\
    \ execution in your tests.\n\n### 5. Challenge: UI Testing\n\n- ● Unit Tests !=\
    \ UI Tests: User interface interactions are often best tested with specialized\
    \ tools (like `Selenium`).\n- ● Know the Boundaries: Understand what unit tests\
    \ do (and don’t) cover regarding the UI. Model-View-Controller/ViewModel patterns\
    \ can help create testable UI logic.\n\n### 6. Challenge: The ‘Right’ Amount of\
    \ Testing\n\n- ● Diminishing Returns: 100% code coverage can be an elusive and\
    \ sometimes unhelpful goal.\n- ● Solution: Risk-Based Approach: Focus tests on\
    \ the most critical, error-prone sections of your codebase.\n\n### Additional\
    \ Resources\n"
  raw: '● Partial Classes and the ‘InternalsVisibleTo’ Attribute: Specifically for
    testing purposes, you can expose internal members to your test assembly. A less
    intrusive approach than reflection.


    ● Elevate to Protected (If Feasible): Consider whether the method could be made  protected.
    This allows for derived test classes to access it, maintaining some level of encapsulation.


    Example: Tricky Calculations


    Imagine a private method in an  OrderService that handles complex tax calculations.
    Directly testing this private method could bring more confidence than just testing
    edge cases of the public API.


    Additional Resources


    ●     Martin Fowler on Testing Private Methods:  [https://martinfowler.com/articles/mocksArentStubs.html](https://martinfowler.com/articles/mocksArentStubs.html)


    When in Doubt, Refactor First


    Before reaching for techniques to directly test private methods, critically ask
    yourself:


    ● Can I refactor the code to extract the complex logic into a separate, more testable
    unit?


    ● Do my tests for the public methods provide enough indirect coverage of the private
    behavior to give me confidence?


    Up Next


    Testing isn’t about getting a perfect score on some theoretical metric. Let’s
    discuss how code coverage tools can provide valuable insights, but also how to
    interpret those insights wisely.


    Exploring Code Coverage: Metrics and Insights


    Code coverage tools give you a picture of which parts of your code are executed
    by your tests. However, understanding how to use this information wisely is key.


    1\. Beyond the Raw Percentage


    ● High Coverage != Bulletproof: High coverage doesn’t guarantee you’ve caught
    all bugs or that your tests are thorough.


    ● Low Coverage = Red Flag: Low coverage indicates areas of your code completely
    untested and thus more likely to harbor problems.


    ● Focus on Change: Utilize code coverage tools to see which parts of your code
    are tested by changes for a pull request or a feature development.


    2\. Types of Code Coverage


    ● Line Coverage: The most basic - which lines of code were hit by the tests.


    ● Branch Coverage: Did your tests exercise different branches of if-statements
    and conditional logic? This is often more meaningful than pure line coverage.


    ● Method Coverage: A finer-grained metric, ensuring individual methods have been
    entered.


    3\. Visualizing Code Coverage


    Tools often provide ways to visualize coverage directly in your IDE, highlighting
    lines in green (covered) and red (not covered). This makes it very intuitive to
    spot gaps.


    Example: A Legacy Application


    You’re adding features to an existing system with minimal tests. Code coverage
    analysis might reveal:


    ● Critical business logic: with poor coverage: Prioritize writing tests here.


    ● Old, unused code: If it’s uncovered, perhaps it’s safe for refactoring or removal.


    4\. Setting Targets


    ● Avoid Obsessing Over 100%: It’s often wasted effort. Focus on the untested areas
    of high importance.


    ● Reasonable Baselines: Start with a modest target (e.g., 60-70%) and gradually
    increase it as you add more tests.


    ● New Code: Consider a stricter bar for newly written code, aiming for higher
    coverage to avoid the build-up of ‘testing debt.’


    Additional Resources


    1.  OpenCover: OpenCover is a free and open-source code coverage tool for .NET,
    which is widely used and supports various testing frameworks like NUnit, MSTest,
    and xUnit. You can find more information and download it from the [OpenCover GitHub
    repository] ([https://github.com/OpenCover/opencover](https://github.com/OpenCover/opencover)).


    2.  NCover: NCover is a commercial code coverage tool for .NET, offering features
    like branch coverage, code highlighting, and integration with popular CI/CD systems.
    You can learn more about NCover and its features on the [NCover website] ([https://www.ncover.com/](https://www.ncover.com/)).


    3.  JetBrains dotCover: dotCover is a code coverage tool provided by JetBrains,
    known for its ReSharper and IntelliJ IDEA products. It offers integration with
    Visual Studio and supports various .NET testing frameworks. You can find more
    information about dotCover on the [JetBrains website] ([https://www.jetbrains.com/dotcover/](https://www.jetbrains.com/dotcover/)).


    4.  Coverlet: Coverlet is a cross-platform code coverage library for .NET, compatible
    with .NET Core and .NET Framework. It’s open-source and integrates well with other
    testing frameworks. You can learn more about Coverlet and how to use it from the
    [Coverlet GitHub repository] ([https://github.com/coverlet-coverage/coverlet](https://github.com/coverlet-coverage/coverlet)).


    5.  Visual Studio’s built-in code coverage tools: Visual Studio Enterprise edition
    includes built-in code coverage tools that integrate seamlessly with the IDE.
    You can run code coverage analysis directly from Visual Studio and view coverage
    results within the IDE.


    Each of these tools has its own set of features, advantages, and limitations,
    so you may want to evaluate them based on your specific requirements and preferences.


    The Right Mindset


    Code coverage is a tool, not a master. Use it to:


    ●     Uncover blind spots


    ●     Drive the creation of new, meaningful tests


    ●     Identify potentially unused code


    Up Next


    Testing is an evolving skill. Let’s discuss some real-world testing challenges
    and the best practices to overcome them.


    Real-world Testing Challenges and Solutions


    Unit testing in a pristine, controlled environment is one thing; real production
    systems are another. Let’s confront some common hurdles and the best practices
    to tackle them.


    1\. Challenge: Complex Setups


    ● Databases, External Services, etc.: Often, your code depends on things difficult
    to replicate in unit tests.


    ●     Solutions:


    ○ Mocking Frameworks (more on this later) to simulate external dependencies


    ○ Test Databases: Use in-memory databases or dedicated, temporary test instances.


    ○ Containerization (for complex cases): Package dependencies for easy setup/teardown
    in tests.


    2\. Challenge: Non-Deterministic Behavior


    ● System Time: Tests relying on the current date and time are brittle.


    ● External Data: If your test depends on data from an unpredictable source (web
    service, etc.), results can be flaky.


    ●     Solutions:


    ○     Control Time: Libraries to ‘freeze’ time for tests.


    ○ Isolate External Dependencies: Mocks to replace those with predictable responses


    3\. Challenge: Legacy Code Monoliths


    ● Tightly Coupled Spaghetti: Code that wasn’t designed for testability is a nightmare
    to isolate.


    ●     Solutions:


    ○ Refactoring: It’s an investment, but gradually breaking down dependencies makes
    code testable in the long run.


    ○ Seams: Find points where you can introduce test doubles, even minimally at first.


    ○ ‘Characterisation Tests’ (For the truly awful): Write tests that capture the
    current behavior, preventing regressions, and providing a safety net for refactoring.


    4\. Challenge: Asynchronous Code


    ●     Concurrency and Race Conditions: Hard-to-predict interactions between threads/tasks


    ●     Solutions


    ○ Task-Focused Assertions: Features in testing libraries to work with  Tasks directly.


    ○ Synchronization Primitives: If needed, carefully use semaphores or similar to
    control execution order in tests.


    ○ Deterministic Task Scheduling (Advanced): For really intricate cases, there
    are libraries to orchestrate task execution in your tests.


    5\. Challenge: UI Testing


    ● Unit Tests != UI Tests: User interface interactions are often best tested with
    specialized tools (like Selenium).


    ● Know the Boundaries: Understand what unit tests do (and don’t) cover regarding
    the UI. Model-View-Controller/ViewModel patterns can help create testable UI logic.


    6\. Challenge: The ‘Right’ Amount of Testing


    ● Diminishing Returns: 100% code coverage can be an elusive and sometimes unhelpful
    goal.


    ● Solution: Risk-Based Approach: Focus tests on the most critical, error-prone
    sections of your codebase.


    Additional Resources'
