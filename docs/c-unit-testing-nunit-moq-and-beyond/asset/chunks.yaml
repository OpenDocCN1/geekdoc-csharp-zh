  trans: "\n\n# 清理（Teardown）：清理现场\n\nTeardown 方法会撤销在 setup 中执行的操作，确保环境整洁：\n\n- 释放资源：关闭文件、连接等。\n\
    - 删除临时数据：移除记录。\n- 重置 Mock：清理 mock 对象。\n\n## NUnit：Setup 和 Tearown 属性\n\nNUnit\
    \ 提供了用于指定 setup 和 teardown 方法的属性：\n\n- `[SetUp]` 方法在 `[TestFixture]` 中的每个测试之前运行。\n\
    - `[TearDown]` 方法在每个测试之后运行。\n\n### 示例：一个略为设计的化的测试\n\n```csharp\n[TestFixture]\n\
    public class FileProcessorTests\n{\n    private string _tempFilePath;\n\n    [SetUp]\n\
    \    public void Setup()\n    {\n        _tempFilePath = Path.GetTempFileName();\n\
    \    }\n\n    [TearDown]\n    public void TearDown()\n    {\n        File.Delete(_tempFilePath);\n\
    \    }\n\n    [Test]\n    public void WriteToFile_CreatesFileIfntExist() {\n \
    \       // 在此处编写测试逻辑...\n    }\n}\n```\n\n## 附加资源\n\n- NUnit 文档 - SetUp and TearDown：[`docs.nunit.org/articles/nunit/writing-tests/setup-and-teardown.html`](https://docs.nunit.org/articles/nunit/writing-tests/setup-and-teardown.html)\n\
    \n## 基础之外\n\n- `OneTimeSetUp/TearDown`：使用 `[OneTimeSetUp]` 在所有测试之前执行一次。\n- 层级\
    \ Setup：在单个测试方法（类）之前运行设置。\n\n## 核心要点\n\n有效使用 setup 和 teardown 对于创建可靠、独立的单元测试至关重要。通过确保测试环境整洁，可以更有信心地捕捉\
    \ bug。\n\n## 接下来\n\n反复编写带有微调输入的相同测试变非常枯燥。让我们探索参数化测试（Parameterized tests）这一强大方法。\n\
    \n# 释放参数化测试的力量\n\n参数化测试允许你通过使用不同的输入集多次运行同一个测试来简化测试流程。这有助于你有效地覆盖多种场景。\n\n## 为什么参数化测试很重要\n\
    \n1. **减少冗余**：与其编写多个相似的测试方法，你只需要一个参数化测试。这让你的测试套更加整洁。\n2. **增加覆盖率**：测试更广泛的输入，包括边界情况和潜在错误场景，只需少量代码。\n\
    3. **数据驱动**：你的测试逻辑变成了模板，由你提供的数据驱动。\n\n## NUnit：[TestCase] 属性\n\nNUnit 的 `[TestCase]`\
    \ 属性是创建参数化测试的关键：\n\n```csharp\n[Test]\n[TestCase(5,2,7)] // 这里的用例\npublic void\
    \ Add_CalculatesSum(int a, int b, int expectedResult)\n{\n    var calculator =\
    \ new Calculator();\n    Assert.AreEqual(expectedResult, calculator.Add(a, b));\n\
    }\n```\n\n### 拆解：\n\n- `[TestCase]` 属性：定义输入参数和预期结果。\n- 方法参数：测试方法的参数与 `[TestCase]`\
    \ 属性中的值对齐。\n\n### 测试运行器的魔力\n\nNUnit 测试运行器将执行两次 `Add_CalculatesSum` 测试，每次注入不同的\
    \ `TestCase` 数据。这就像在一个类中拥有多个测试一样！\n\n## 测试数据来源\n\n- **内联（Inline）**：如示例所示，直接在 `[TestCase]`\
    \ 属性中提供值。\n- `[TestCaseSource]`：引用变量、属性或返回 `IEnumerable` 的方法用于更复杂或动态的数据集。\n- **自定义属性**：创建自己的属性从外部文件（CSV、XML\
    \ 等）获取测试数据。\n\n## 附加资源\n\n- NUnit 文档 - 参数化测试：[`docs.nunit.org/articles/nunit/writing-tests/attributes/testcase.html`](https://docs.nunit.org/articles/nunit/writing-tests/attributes/testcase.html)\n\
    \n## 基础之外\n\n- **描述性参数**：在 `[TestCase]` 中使用命名参数以获得更好的失败报告（例如 `[TestCase(5, 2,\
    \ ExpectedResult=7)]`）。\n- **结合 Setup/Teardown**：参数化测试可以使用 `[SetUp]` 和 `[TearDown]`\
    \ 执行任何测试前/后操作，与普通测试一样。\n\n## 何时使用参数化测试\n\n- 函数逻辑适用于各种输入，且输出根据输入而变化。\n- 使用边界值和边缘情况进行测试。\n\
    \n## 下一步\n\n有时有必要临时禁用或排除测试。让我们探索选择性忽略和跳过测试的策略。\n\n# 选择性测试：忽略和跳过测试的策略\n\n有时你需要临时控制测试套件中执行哪些测试。可能是因为测试正在开发中、依赖于不可用的外部资源或标记了特定条件。让我们探索如何管理这种情况。\n\
    \n## 1. 忽略测试（Ignoring）\n\n被忽略的测试完全排除在测试运行之外。NUnit 提供了几种机制：\n\n- `[Ignore]` 属性：最简单的方法。对测试方法或整个测试类具应用\
    \ `[Ignore]`。\n\n```csharp\n[Ignore(\"功能尚未实现\")]\n[Test]\npublic void NewFeature_PlaceOrder_CalculatesCorrectTotal()\n\
    {\n    // ... 测试逻辑\n}\n```\n\n- **原因（可选）**：包含字符串原因以便对被忽略的测试提供更好的报告。\n- **Explicit\
    \ 属性（罕见）**：在需要高级场景时使用 `[Explicit]` 属性。这些测试仅在显式选择时运行。\n\n## 2. 跳过测试（Skipping -\
    \ 条件性）\n\n跳过的测试会被测试运行器识别，但除非满足特定条件，否则不会执行。NUnit 提供了实现这种的方法：\n\n- `Assume.That`：对环境做出假设。如果条件失败，则跳过该测试。\n\
    \n```csharp\n[Test]\npublic void DatabaseWrite_WhenConnected_SavesData()\n{\n\
    \    Assume.That(_database.IsConnected, \"数据库必须连接\");\n    // ... 测试逻辑\n}\n```\n\
    \n- 带有不匹配输入的 `[TestCase]`：输入无法满足测试方法内条件的参数化测试可以被跳过。\n\n## 忽略 vs 跳过\n\n- **忽略（Ignore）**：\n\
    \    - 正在开发的功能。\n    - 已知损坏并等待修复的测试。\n- **跳过（Skip）**：\n    - 依赖环境的测试（例如当数据库关闭时）。\n\
    \    - 特定于平台的测试（例如跳过不适用于你操作系统的测试）。\n\n"
- fmt: "\nThe core principle of unit testing is isolation. However, in the real world,\
    \ code units often interact with components like databases, web services, file\
    \ systems, and other external dependencies. Let’s explore how to manage these\
    \ dependencies to ensure our unit tests remain focused on the code we intend to\
    \ test.\n\n## 1. The Problem with External Dependencies\n\n- **Slowness**: Relying\
    \ on external systems can make tests slow, impacting your development feedback\
    \ loop.\n- **Unreliability**: Externals can be down or behave unpredictably (network\
    \ glitches, etc.), leading to flaky, non-deterministic tests.\n- **Lack of Control**:\
    \ You cannot easily manipulate scenarios for error conditions or edge cases when\
    \ depending completely on an external system.\n\n## 2. Techniques for Isolating\
    \ Your Code Under Test\n\n- **Abstractions (Interfaces)**: Define interfaces for\
    \ the dependencies of your code. During testing, you can replace real implementations\
    \ with test doubles.\n\n```csharp\npublic interface IEmailService {\n    void\
    \ SendEmail(string to, string subject, string body);\n}\n```\n\n- **Test Doubles**:\
    \ A generic term for stand-ins used in place of real dependencies. The common\
    \ types include:\n    - **Fakes**: Working implementations but simplified (in-memory\
    \ data store instead of a full database).\n    - **Stubs**: Minimal implementations\
    \ providing canned responses for pre-defined scenarios.\n    - **Mocks**: Sophisticated\
    \ doubles that allow you to verify if interactions and calls happened as expected.\
    \ (We’ll discuss these more in upcoming chapters)\n\n## 3. Example: Isolating\
    \ a File Writer\n\nLet’s imagine a class that writes data to a file:\n\n```csharp\n\
    public class OrderProcessor {\n    private readonly IFileWriter _fileWriter;\n\
    \    public OrderProcessor(IFileWriter fileWriter) {\n        _fileWriter = fileWriter;\n\
    \    }\n\n    public void Process(Order order) {\n        // ... process the order\n\
    \        _fileWriter.WriteToFile(\"order.txt\", order.ToString());\n    }\n}\n\
    ```\n\nNotice that `OrderProcessor` doesn’t directly create a file. It depends\
    \ on an interface `IFileWriter`, making it “testable.”\n\nIn a Unit Test: You\
    \ could provide a fake `IFileWriter` that records data in memory instead of hitting\
    \ the file system.\n\n### Additional Resources\n- Martin Fowler on Test Doubles:\
    \ [https://martinfowler.com/articles/mocksArentStubs.html](https://martinfowler.com/articles/mocksArentStubs.html)\n\
    \n### Key Mindset Shift\nDesigning your code to depend on abstractions (like interfaces)\
    \ improves testability and often leads to better overall design due to increased\
    \ flexibility.\n\n### Next Up\nReliable tests should have predictable outcomes.\
    \ In the next chapter, we’ll discuss ways to ensure your tests remain consistent\
    \ and dependable over time.\n\nLet’s make your tests robust!\n\n# Building Trustworthy\
    \ Tests, Part 2: Ensuring Consistency and Reliability\n\nA test suite you can’t\
    \ trust is worse than no tests at all. Let’s focus on how to guarantee your tests\
    \ produce consistent results, minimizing the chance of false alarms or unexpected\
    \ failures unrelated to actual changes in your production code.\n\n## 1. Sources\
    \ of Inconsistency\n\n- **Timing Issues**: Tests that rely on the current date,\
    \ time, or race conditions between different parts of the system can be non-deterministic.\n\
    - **Shared Mutable State**: If tests modify global variables or leave resources\
    \ in an altered state, it can lead to order-dependent failures.\n- **External\
    \ Dependencies**: As discussed earlier, network issues or a database in an unknown\
    \ state can lead to instability.\n- **Overly-Complex Test Logic**: Too many intricate\
    \ steps in a test make it harder to reason about potential failure points.\n\n\
    ## 2. Strategies for Robustness\n\n- **Control Time**: Libraries like `NodaTime`\
    \ can let you “freeze” the current date and time within tests, eliminating inconsistencies\
    \ based on when the test was executed.\n- **Emphasis on Isolation**: Remind yourself\
    \ of the core unit testing principle. Double-check your `[SetUp]` methods to fully\
    \ reset any state before every test.\n- **Clean Up Thoroughly**: Ensure your `[TearDown]`\
    \ methods meticulously reverse changes (delete files, restore database records,\
    \ etc.)\n- **Test Doubles (Again)**: By substituting external dependencies with\
    \ test doubles, you gain control over their behavior, leading to more predictable\
    \ tests.\n- **Seeding Data**: When working with data sources (even in-memory ones),\
    \ start with a known, pre-populated dataset for each test.\n\n## 3. Avoid Over-Dependence\
    \ on Threading or Concurrent Operations\n\nIf possible, structure unit tests to\
    \ avoid direct reliance on multithreading scenarios. These can be notoriously\
    \ tricky to test consistently due to timing sensitivities. For those cases, specialized\
    \ techniques for concurrency testing might be required, which is often a broader\
    \ topic than pure unit testing.\n\n## 4. Simplicity as a Safeguard\n\nClear, easy-to-understand\
    \ tests are less likely to have hidden assumptions or side effects leading to\
    \ flakiness. If a test is hard to follow, there’s a greater chance of subtle issues.\n\
    \n## 5. When a Test Fails…\n\n- **First, Rule Out the Obvious**: Double-check\
    \ if it’s a genuine failure in your production code and not an issue within the\
    \ test itself.\n- **Reproduce Reliably**: Can you make the failure happen consistently?\
    \ Intermittent failures are the most difficult to troubleshoot.\n- **Isolate the\
    \ Root Cause**: Narrow down the problem to the most specific code unit possible.\n\
    \n### Continuous Vigilance\nMaintaining a reliable test suite is an ongoing effort.\
    \ As your project evolves, be mindful of new dependencies or complex logic creeping\
    \ into your tests.\n\nSection 3: Advanced Testing Techniques\n\n# Unveiling Core\
    \ Unit Testing Techniques\n\nWhile the foundational principles remain essential,\
    \ as you become a seasoned unit testing practitioner, having some go-to techniques\
    \ in your arsenal will prove invaluable. Let’s explore a few core concepts that\
    \ will frequently appear in well-crafted tests.\n\n## 1. Equivalence Classes and\
    \ Boundary Values\n\n- **Equivalence Classes**: Instead of testing every possible\
    \ input value, group inputs that are expected to be processed similarly. For instance,\
    \ testing with a few positive numbers instead of every conceivable positive number.\n\
    - **Boundary Values**: Specifically focus tests on the edges of valid ranges.\
    \ For example, if a function accepts ages 18-65, test with 18, 65, and values\
    \ right outside the boundaries (17, 66).\n\n## 2. State Verification\n\n- **Directly\
    \ Checking State**: After a unit of code runs, assert that internal properties\
    \ or variables have the expected values.\n- **State-Based Behavior**: Assert that\
    \ an object’s behavior changes in the correct way based on its modified state.\
    \ For example, after a withdraw operation, a bank account’s `getBalance()` method\
    \ should return a lower value.\n\n## 3. Error Handling and Exceptions\n\n- **Expect\
    \ Exceptions**: Use NUnit attributes like `[ExpectedException]` to ensure your\
    \ code throws the right type of exception for invalid input or error conditions.\n\
    - **Inspect Exception Details**: Go beyond just the type of exception. Verify\
    \ if any custom messages or data contained within the exception are correct.\n\
    \n## 4. Interaction Testing with Collaborators\n\n- **Not in Complete Isolation**:\
    \ While unit tests should focus on one unit, sometimes they need to involve how\
    \ a unit collaborates with its dependencies.\n- **Mocking Frameworks (Coming Soon!)**:\
    \ These will become your essential tool for controlling and verifying interactions\
    \ between components, which we’ll delve into in upcoming chapters.\n\n### Example:\
    \ Thinking in ‘Techniques’\n\nLet’s revisit our `Calculator`, with a new method:\n\
    \n```csharp\npublic double SquareRoot(double num) {\n    if (num < 0) \n     \
    \   throw new ArgumentException(\"Cannot calculate square root of a negative number\"\
    );\n    return Math.Sqrt(num);\n}\n```\n\nApplying the techniques:\n\n- **Equivalence\
    \ Classes / Boundary**: Test with zero, a few positive values, large positive\
    \ values.\n- **Error Handling**: Test that a negative input throws an `ArgumentException`.\n"
