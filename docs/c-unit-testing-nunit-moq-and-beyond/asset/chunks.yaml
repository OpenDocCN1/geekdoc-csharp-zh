  trans: "\n\n# 自定义断言\n自定义断言：考虑针对你领域相关的非常特定的检查编写你自己的断言。\n\n## 4. 示例：统计计算器\n假设有一个 `StatisticsCalculator`\
    \ 类，它提供了如下方法：\n\n- `double GetAverage(int[] numbers)`\n- `int[] GetPositiveValues(int[]\
    \ numbers)`\n\n字体 测试可以涵盖：\n- `GetAverage`:\n    - 不同的数字集合\n    - 空数组 -> 错误或有意义的默认值\n\
    - `GetPositiveValues`:\n    - 全正数、部分负数、全负数\n    - 返回结果的顺序（是否应该与输入匹配？）\n\n### 额外资源\n\
    - NUnit 文档：`CollectionAssert` [https://docs.nunit.org/articles/nunit/writing-tests/assertions/collection-assertions.html]\n\
    \n## 基础之外\n并非所有集合都是平等的。字典（Dictionaries）和集合（Sets）需要专门的测试逻辑来检查键和值是否存在以及关联是否正确。\n\
    \n## 下一步计划\n在第 2 部分中，我们将扩展对不同集合类型的测试，并解决处理大型数据集时潜在的性能考虑因素。\n\n# 数组与集合的全面测试方法，第\
    \ 2 部分\n\n## 扩展我们的测试工具箱\n让我们深入测试更专业的集合类型，并考虑处理集合时的性能影响。\n\n### 1. 字典 / 映射\n- **键的存在性**：检查特定键是否存在（以及不存在）。\n\
    - **值检索**：确保通过键获取返回的是预期值且具有正确的数据类型。\n- **键值关联**：验证键和值之间具有正确的关系，特别是在修改之后。\n\n###\
    \ 2. 集合\n- **成员身份**：测试特定元素是否存在于集合中。\n- **唯一性**：确保你的集合实现遵守“无重复”规则。\n- **集合操作**：如果你的代码执行了这些操作，测试交集、并集、差集的结果。\n\
    \n### 示例：用户权限管理器\n假设有一个使用集合管理的类：\n\n```csharp\npublic class PermissionManager\n\
    {\n    private readonly HashSet<string> _userPermissions;\n    // ... 方法如 AddPermission,\
    \ RemovePermission, HasPermission 等\n}\n```\n\n### 测试场景：\n- `AddPermission`：即使添加多次，新权限是否只添加一次？\n\
    - `RemovePermission`：现有的权限可以按预期移除吗？\n- `HasPermission`：检查不同输入下的正确真/假结果结果。\n\n\
    ### 3. 性能考虑\n- **大型集合**：设计具有相当规模集合的测试，以发现排序、搜索或过滤操作中的性能瓶颈。\n- **算法选择**：代码中使用的底层数据结构和算法将极大影响性能。理解这些权衡。\n\
    - **性能分析工具**：如果测试中出现特定的变慢，考虑使用性能分析工具来精确定位问题。\n\n### 4. 不可变性（如适用）\n如果你正在处理不可变集合，你的测试需要反映这一点：\n\
    - **修改验证**：断言对不可变集合的操作产生了一个新集合，而不是修改现有的集合。\n\n### 额外资源\n- C# 集合类型文档：（`List`, `Dictionary`,\
    \ `HashSet`, 等）[https://docs.microsoft.com/en-us/dotnet/csharp/programming-guide/concepts/collections]\n\
    \n## 深入表面\n彻底的集合测试意味着理解你所使用的特定集合类型的细微差别，以及在应用程序上下文中潜在的性能问题。\n\n## 验证方法的返回类型：最佳实践\n\
    虽然基本单元测试的基石是检查方法是否返回了预期值，但让我们深入研究确保你的返回类型断言准确且健壮的策略。\n\n### 1. 不仅仅关于“快乐路径”\n-\
    \ **数据类型至关重要**：不要只检查是否返回了值，要确保它是正确的数据类型。区分返回字符串“10”的方法和返回数字 10 的方法。\n- **复杂返回类型**：如果方法返回类或结构体，验证返回对象的内容以及任何嵌套属性。\n\
    - **空值**：显式地规划方法可能返回 `null` 的场景。你的代码能优雅地处理这种情况吗？\n\n### 2. 断言的精确性\n- **浮点数比较**：注意潜在的舍入误差。使用在可容差误差范围内检查近似相等的断言。\n\
    - **集合**：（基于之前的章节）：在相关处，利用特定的集合断言来检查匹配的大小、内容和顺序。\n- **自定义类型**：在必要时，在你的自定义类上实现\
    \ `Equals` 或 `GetHashCode` 重写，使测试断言中的比较具有意义。\n\n### 示例：数据转换服务\n假设有一个方法：\n\n```csharp\n\
    public double ConvertTemperature(int celsius) { ... }\n```\n\n### 测试可以涵盖：\n- **类型**：`Assert.IsInstanceOf<double>(result)`。\n\
    - **准确性**：确保几个已知的摄氏度到华度的转换是正确的。\n- **意外输入**：验证提供非数字输入时的行为（异常、默认值？）\n\n### 3. 测试库增强类型检查\n\
    考虑用于增强你断言的库：\n- **Fluent Assertions**：提供了一种可读的方式来断言对象类型：\n```csharp\nobject result\
    \ = GetResult();\nresult.Should().BeOfType<Invoice>();\n```\n- **Shouldly**：类似的流式类型检查。\n\
    \n### 4. 边界情况\n- **枚举**：如果方法返回枚举，检查有效值和可能的无效值，以确保优雅处理。\n- **考虑设计**：你的方法应该通过返回值信号错误（例如，特殊的响应代码），还是应该抛出异常？你的测试需要与这一设计选择保持一致。\n\
    \n### 额外资源\n- NUnit 的 `IsInstanceOf` ：[https://docs.nunit.org/articles/nunit/writing-tests/constraints/isinstanceof.html]\n\
    \n## 基础之外\n你的返回类型的复杂性直接影响测试的复杂性。对于复杂的自定义类型，这可能涉及专门为这些类型编写微测试套件以保证行为正确。\n\n## 处理\
    \ void 方法：测试策略与考虑因素\nvoid 方法（即缺少显式返回值的方法）面临着独特的挑战。它们通常会产生副作用：修改状态、发送通知或与外部系统交互。我们如何证明它们执行了应该做的事情？\n\
    \n### 1. 间接法\n由于你不能直接对 void 方法的返回值进行断言，你需要观察它对系统的影响：\n- **状态更改**：如果方法修改了对象的属性或字段，在调用方法后对这些更改进行言。\n\
    - **协作者调用**：使用 Mock 框架（我们稍后会介绍）来验证 void 方法是否使用预期参数调用了系统中的其他组件。\n- **外部交互**：如果方法与文件、数据库或网络资源交互，测试预期更改是否存在（文件创建、数据库记录更新等）。\n\
    \n### 2. 像侦探一样思考\n测试 void 方法在于追踪“面包屑”：\n- **留下了什么痕迹？**\n    - 方法是否更新了可见检查的属性？\n\
    \    - 它是否触发了事件？\n    - 是否生成了日志？\n- **可测试的缝隙**：如果直接检查困难，考虑重构以在代码中引入专门为测试暴露状态的点。\n\
    \n### 示例：文件写入器\n假设有一个 void 方法：\n\n```csharp\npublic void WriteMessageToFile(string\
    \ message, string filename)\n{\n    // 文件写入逻辑...\n}\n```\n\n### 测试可以：\n- 检查文件是否存在：断言创建了指定名称的文件。\n\
    - 验证内容：读取文件以确认写入了预期的消息。\n\n"
- fmt: "\n## Mocking the File System (More Advanced)\n\nUse a mocking framework to\
    \ substitute the file system interaction and directly inspect what the method\
    \ tried to write.\n\n## Exceptions in Void Methods\n\nIf your `void` method is\
    \ designed to throw exceptions under error conditions, your tests should assert\
    \ these:\n\n- `Assert.Throws<ExceptionType>(...)` Ensure the correct exception\
    \ type is thrown.\n- Inspect Exception Details: If the exception carries additional\
    \ data (custom error messages), verify them within your test.\n\n## Design Considerations\n\
    \n- Are Void Methods Overused? Sometimes, refactoring a `void` method to return\
    \ a value, even a simple status code or result object, can improve testability.\n\
    - Testability as a Design Driver: Thinking about how you will test your code before\
    \ you write it can lead to designs that are more naturally testable.\n\n## Up\
    \ Next\n\nA unit test should ideally focus on one unit in isolation. However,\
    \ what happens when methods must interact with external components? Let’s learn\
    \ about techniques for handling exceptions.\n\n# Handling Exceptions: Testing\
    \ Method Behavior Under Error Conditions\n\nExceptional situations (pun intended!)\
    \ are a fact of software development. Well-crafted unit tests should not only\
    \ verify the ‘happy path’ but also ensure your code gracefully handles error scenarios.\n\
    \n### 1. Exceptions as Part of the Contract\n\n- Expected Exceptions: If a method\
    \ is designed to throw a specific exception type under certain conditions (invalid\
    \ input, for example), your tests must assert that.\n- Document Exceptions: Treat\
    \ exceptions thrown by a method as part of its documented behavior, and subsequently,\
    \ part of what you need to test.\n\n### 2. NUnit and Exceptions\n\nNUnit provides\
    \ several ways to assert on exceptions:\n\n- `Assert.Throws<ExceptionType>(...)`:\
    \ The most general form. Ensure that a specific exception type is thrown somewhere\
    \ within a block of code.\n\n```csharp\nAssert.Throws<ArgumentNullException>(()\
    \  => myObject.Process(null));\n```\n\n- `Assert.That(() => myObject.DoSomething(),\
    \ Throws.Exception.TypeOf<InvalidOperationException>())`: Combines an assertion\
    \ with the exception check.\n- Examining Exception Details:\n\n```csharp\nvar\
    \ ex = Assert.Throws<DivideByZeroException>(()  => Calculator.Divide(10,  0));\n\
    Assert.That(ex.Message, Does.Contain(\"zero\"));\n```\n\n### 3. Test Strategy\n\
    \n- Triggering Errors: Carefully design test inputs to force the exceptional conditions\
    \ you wish to test.\n- Multiple Cases: A single method might throw different exception\
    \ types based on the type of error. Have tests for each.\n- Don’t Over-Catch:\
    \ In your test code, avoid using an overly broad `try-catch` that hides the specific\
    \ nature of the exception.\n\n### Example: A User Registration Method\n\nImagine\
    \ a method with the following requirements:\n\n```csharp\npublic void  RegisterUser(string\
    \ username,  string password)\n{\n if  (username ==  null  )throw  new ArgumentNullException(...);\n\
    \ if  (password.Length <  8) throw  new ArgumentException(...);\n // ... rest\
    \ of the registration logic\n}\n```\n\n**Tests Would Cover:**\n\n- Passing a null\
    \ `username` -> `ArgumentNullException`\n- Too short password -> `ArgumentException`\n\
    - Valid input -> Does not throw exceptions\n\n## Additional Resources\n\n- NUnit\
    \ documentation on exception Assertions: [https://docs.nunit.org/articles/nunit/writing-tests/assertions/exception-assertions.html](https://docs.nunit.org/articles/nunit/writing-tests/assertions/exception-assertions.html)\n\
    \n## Beyond the Basics\n\n- Custom Exceptions: If you have custom exception types,\
    \ you can write tests to verify any additional information they carry (error codes,\
    \ custom messages).\n- Error Handling Logic: If your code has complex `try-catch`\
    \ logic, you may need unit tests specifically focused on testing that error-handling\
    \ behavior.\n\n## Validating Event Invocation: Ensuring Correct Event Handling\n\
    \nEvents are a cornerstone of asynchronous and loosely coupled programming in\
    \ C#. Properly testing that your components raise events, and that other parts\
    \ of your system react to them, is crucial for guaranteeing robust behavior.\n\
    \n### 1. Why Test Events?\n\n- Implicit Contracts: Events form implicit connections\
    \ between parts of your code. Tests ensure those connections work as designed.\n\
    - Timing Matters: Often, unit tests should verify that events are fired in the\
    \ correct sequence or in response to specific triggers.\n- Event Data: If your\
    \ events carry data, tests should check if the payload within the event arguments\
    \ is correct.\n\n### 2. Strategies for Testing Events\n\n- Manual Subscription:\
    \ In your test, subscribe to the event of the unit under test. Within the event\
    \ handler, set flags, or store results for later assertions.\n- NUnit’s Event\
    \ Listener: NUnit offers some support for event assertions, but it’s often considered\
    \ basic.\n- Mocking Frameworks (The Power Tool): Mocking frameworks (which we’ll\
    \ cover later) become invaluable here. They can let you verify that a collaborator\
    \ raised a specific event with the expected arguments.\n\n### Example: A File\
    \ Monitoring Component\n\nImagine a class that monitors file changes:\n\n```csharp\n\
    public class FileMonitor\n{\n    public event EventHandler<FileChangedEventArgs>\
    \ FileChanged;\n    private void OnFileChanged(string filename)\n    {\n     \
    \   FileChanged?.Invoke(this, new FileChangedEventArgs(filename));\n    }\n  \
    \  // ... file monitoring logic ...\n}\n```\n\n**Tests Could Verify:**\n\n- Event\
    \ Raised on Change: Simulate a file change and assert that `FileChanged` was raised.\n\
    - Event Data: Ensure the `filename` within `FileChangedEventArgs` is correct.\n\
    - No Event on Change: Test that the event is not fired if there’s no file activity.\n\
    \n### 3. Additional Considerations\n\n- Asynchronous Events: Ensure your test\
    \ handles waiting or synchronization if events are raised on a different thread.\n\
    - Testing the Subscribers: You might also need unit tests specifically focusing\
    \ on components that react to events to ensure their behavior is expected.\n\n\
    ## Mocking Frameworks Enable Sophistication\n\nWhile basic event assertions can\
    \ be done manually, mocking libraries empower you with more fine-grained checks\
    \ and significantly cleaner test code when it comes to event handling.\n\n## Up\
    \ Next\n\nSometimes your perfect unit test design relies on testing code that\
    \ isn’t directly exposed – those pesky private methods. Let’s discuss the trade-offs\
    \ and techniques for testing them.\n\n# Unraveling the Mystery of Testing Private\
    \ Methods\n\nPrivate methods are intended as internal helpers. Should a unit test\
    \ directly reach into the private workings of your class? Let’s examine the arguments\
    \ for and against, and some practical strategies.\n\n### Purist’s View: “Don’t\
    \ Do It”\n\n- Unit Tests As Public API: Purists argue that unit tests should only\
    \ exercise a class’s public interface. Private methods are implementation details.\n\
    - Refactoring Safety Net: A key benefit of unit tests is enabling refactoring\
    \ without fear. If your tests rely on private details, refactoring might inadvertently\
    \ break them.\n- Symptom of a Deeper Problem: The need to test private methods\
    \ often hints at a design issue – the class might be doing too much or violating\
    \ the Single Responsibility Principle.\n\n### Pragmatist’s Perspective: “Sometimes\
    \ Necessary”\n\n- Legacy Code: With large, older code bases, refactoring into\
    \ ‘perfectly’ testable units might be an unrealistic goal in the short term.\n\
    - Complex Internal Logic: There may be intricate algorithms or calculations hidden\
    \ within those private methods that warrant direct testing to ensure correctness.\n\
    - TDD: If you practice Test-Driven Development religiously, you might write tests\
    \ exercising the desired behavior before the private method is even implemented.\n\
    \n### Strategies (If You Must)\n\n- Reflection: C# Reflection allows accessing\
    \ private members. Caution: This makes tests brittle, as they are now tied directly\
    \ to the internal structure of the class.\n"
