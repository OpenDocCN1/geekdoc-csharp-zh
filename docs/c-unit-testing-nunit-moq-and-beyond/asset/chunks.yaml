  trans: "\n\n- xUnit Test Patterns（Gerard Meszaros 著）：[`www.amazon.com/xUnit-Test-Patterns-Refactoring-Code/dp/0131495054`](https://www.amazon.com/xUnit-Test-Patterns-Refactoring-Code/dp/0131495054)\
    \ 虽然不是专门针对 C#，但它是测试策略方面的经典著作。\n- Stack Overflow - 常见的单元测试挑战：[`stackoverflow.com/questions/tagged/unit-testing?tab=Frequent`](https://stackoverflow.com/questions/tagged/unit-testing?tab=Frequent)\n\
    \n# 演进你的测试策略\n\n现实项目需要务实的方法。不断调整：\n\n- 从失败的测试中学习：失败的测试表明存在潜在的 Bug 或编写不当的测试。分析根原因。\n\
    - 与与其他测试类型平衡：单元测试与集成测试、端到端测试等并存。\n\n## 下一步预告\n\n提高可测试性的关键方面在于“解耦”代码的依赖关系。让我们深入探讨松耦合原则，以及它们如何为你的测试工作提供支持。\n\
    \n# 第 4 节：为了可测试性解耦依赖关系\n\n## 理解解耦外部依赖的重要性\n\n当代码单元紧密交织时，它们变得难以进行隔离测试而闻名。将代码与外部依赖解耦是构建可测试软件的基础。\n\
    \n### 1. 为什么依赖关系会阻碍单元测试\n\n- 不可预测的行为：数据库、文件系统、网络服务——这些在测试期间可能会变化或不可用，从而以意想不到的方式破坏测试。\n\
    - 测试缓慢：依赖真实的外部系统通常会导致测试运行缓慢。\n- 设置复杂性：测试可能需要复杂的环境配置或对环境进行 mock，导致测试变得脆弱。\n\n###\
    \ 2. 引入：松耦合\n\n松耦合的代码意味着组件通过定义良好的接口进行交互（在 C# 术语中，即抽象类或接口）。这对测试具有深远的影响：\n\n- 替换：在单元测试期间，我们可以用“测试替身”（test\
    \ doubles）替换真实的依赖。\n- 控制：我们决定测试替身的行为，从而产生可预测的测试场景。\n- 聚焦：被测试的单元成为主角，我们可以精确地检查其逻辑而受干扰。\n\
    \n### 3. 解耦技术\n\n- 依赖注入：一种核心模式，单元的依赖是从外部提供的，而不是在内部创建。我们将在接下来的章节中探索它的具体形式。\n- 接口：在组件之间定义约定。类可以依赖\
    \ `IFileWriter` 接口，而不是特定的文件写入实现。\n- 缝隙（Seams）：在代码中引入点，在测试期间可以交换依赖项（例如，使方法可以配置为以使用真实数据库或测试数据库）。\n\
    \n#### 示例：重构前后对比\n\n紧耦合（坏）：\n\n```csharp\npublic class OrderProcessor\n{\n   \
    \ private readonly DatabaseContext _database;\n\n    public OrderProcessor() {\n\
    \        _database = new DatabaseContext(\"connectionString\");\n    }\n\n   \
    \ public void ProcessOrder(Order order)\n    {\n        // ... processing logic\n\
    \        _database.Insert(order);\n    }\n}\n```\n\n解耦（好）：\n```csharp\npublic\
    \ class OrderProcessor\n{\n    private readonly IOrderRepository _repository;\n\
    \    public OrderProcessor(IOrderRepository repository) {\n        _repository\
    \ = repository;\n    }\n\n    public void ProcessOrder(Order order)\n    {\n \
    \       // ... processing logic\n        _repository.Save(order);\n    }\n}\n\
    ```\n\n### 4. 测试之外的收益\n\n- 灵活性：切换实现更加简单。以后需要不同的数据库吗？新的日志记录方式？松耦合的代码允许更优雅地处理这些需求。\n\
    - 可维护性：责任边界清晰的组件更容易理解、修改和重构。\n- 并行开发：团队可以使用 mock 来代替未完成的依赖项，同时处理不同的组件。\n\n## 额外资源\n\
    \n- Robert C. Martin（“Uncle Bob”）关于依赖倒置原则的观点：[`blog.cleancoder.com/uncle-bob/2014/05/08/SingleReponsibilityPrinciple.html`](https://blog.cleancoder.com/uncle-bob/2014/05/08/SingleReponsibilityPrinciple.html)（SOLID\
    \ 原则的一部分）\n\n# 让我们开始实践\n\n接下来，我们将讨论促进松耦合的设计原则，使你的代码不仅更具测试性，而且整体上更具适应性。\n\n## 拥抱松耦合设计原则以编写可测试代码\n\
    \n可测试性不应该是事后考虑的；它应该影响你的设计选择。让我们探索一些自然上让你的代码更易测试的关键原则。\n\n### 1. 接口的力量\n\n- 接口作为约定：接口（如\
    \ `ILogger`, `IPaymentGateway`）定义了组件之间的交互，而不是它们的具体实现。\n- 提升测试性：依赖 `ILogger` 的类在测试期间可以使用任何实现，无论是真实的还是测试替身。\n\
    \n### 2. 优先使用组合而非继承\n\n- 继承：紧耦合：当你过度使用继承时，你的类会变得硬性链接，使得更难隔离部分进行测试。\n- 组合：灵活性：通过由定义良好接口的较小部分组合来构建对象。这允许你在测试期间交换或注入那些较小的组件。\n\
    \n#### 示例：日志志记录\n\n继承（灵活性较低）：\n```csharp\npublic class FileLogger : Logger { ...\
    \ }\npublic class OrderProcessor\n{\n    private readonly FileLogger _logger;\
    \ // 与 FileLogger 紧绑定\n    ...\n}\n```\n\n组合（灵活性更高）：\n```csharp\npublic class\
    \ OrderProcessor\n{\n    private readonly ILogger _logger; // 适用于任何 ILogger\n\
    \    public OrderProcessor(ILogger logger){\n        _logger = logger;\n    }\n\
    \    ...\n}\n```\n\n### 3. 单职责原则 (SRP)\n\n- 只做好一件：试图做太多事的类是测试的噩梦。每个类应该有一个清晰、专注的职责。\n\
    - 测试收益：更小、更聚焦类更容易隔离测试，且改变的原因更少（减少测试脆弱性）。\n\n### 4. 依赖倒置原则 (DIP)\n\n- “依赖抽象而非细节”：高层模块不应直接依赖低层细节；两者都应该依赖于抽象。\n\
    - 为什么重要：这反转了控制流，并更容易替换组件进行测试。我们很快就会涵盖实现 DIP 的技术。\n\n#### 示例：持久化\n\n```csharp\n\
    public interface IOrderRepository { \n    void Save(Order order);\n}\n\npublic\
    \ class SqlOrderRepository : IOrderRepository { ... } // 具体实现\npublic class OrderService\n\
    {\n    private readonly IOrderRepository _repository;\n    public OrderService(IOrderRepository\
    \ repository) { ... }\n}\n```\n\n## 理论与实践\n\n设计是关于权衡的。有时，一点“紧耦合”可能是务实的选择。然而，理解这些原则使你能够做出明智的设计决策。\n\
    \n## 下一步预告\n\n"
- fmt: "\n1. **Identify Target**: Choose a class or section of code that is difficult\
    \ to test.\n2. **Write Characterisation Tests (If Needed)**: If tests are lacking,\
    \ write tests that capture the current behavior, even if dirty.\n3. **Small Refactorings**:\
    \ Make a single focused change (extract method, introduce a parameter to a constructor,\
    \ etc.) Rerun your tests, they should still pass.\n4. **Repeat**: Iterate with\
    \ tiny refactorings, always keeping tests green.\n\n## 3. Example: Breaking a\
    \ Database Dependency\n\nLet’s imagine a class tightly bound to a database:\n\n\
    ```csharp\npublic class CustomerService\n{\n    private readonly string _connectionString;\n\
    \    public CustomerService(string connectionString)  {\n        _connectionString\
    \ = connectionString;\n    }\n    public Customer GetCustomerById(int id)\n  \
    \  {\n        // Complex database query logic using _connectionString ...\n  \
    \  }\n}\n```\n\n### Steps:\n\n1. **Interface**: Introduce `ICustomerRepository`\
    \ with methods like `GetById(int id)`.\n2. **Make `CustomerService` use the Interface**:\
    \ Change its constructor and modify database logic to use the repository.\n3.\
    \ **Test Double Implementation**: During tests, you can now provide a fake `ICustomerRepository`.\n\
    \n### Additional Resources\n\n* **Martin Fowler’s Refactoring Catalog**: [https://refactoring.com/catalog/](https://refactoring.com/catalog/)\
    \ A classic.\n* **Book**: Working Effectively with Legacy Code (Michael Feathers):\
    \ [https://www.amazon.com/Working-Effectively-Legacy-Michael-Feathers/dp/0131177052](https://www.amazon.com/Working-Effectively-Legacy-Michael-Feathers/dp/0131177052)\n\
    \n### Cautions\n\n* **Don’t Change Everything at Once**: Large rewrites are risky.\
    \ Small steps are your friend.\n* **Tests as a Guide**: Your test suite tells\
    \ you when your refactoring is functionally equivalent and when you’ve made a\
    \ mistake.\n\n### Up Next\n\nIn Part 2, we’ll look at specific refactoring techniques\
    \ and the core concept of dependency injection, a powerful pattern for creating\
    \ loosely coupled code.\n\n# Step-by-Step Refactoring Towards a Loosely-coupled\
    \ Architecture, Part 2\n\nIn the previous chapter, we started introducing seams\
    \ into our code. Now, let’s learn how to fully leverage those seams to inject\
    \ dependencies, making our units gloriously testable.\n\n## 1. Dependency Injection\
    \ (DI) in a Nutshell\n\n* **Core Idea**: A class doesn’t create its dependencies\
    \ directly. Instead, they are ‘injected’ from the outside.\n* **Benefits**:\n\
    \    * Decoupling at its finest\n    * Easily swap in test doubles\n    * Increased\
    \ flexibility in our application’s overall structure\n\n## 2. Types of Dependency\
    \ Injection\n\n* **Constructor Injection**: Dependencies are passed through the\
    \ constructor. (The most preferred for its clarity and testability)\n* **Property\
    \ Injection**: Dependencies are set through public properties. (Used sometimes,\
    \ but less ideal for testability)\n* **Method Injection**: A dependency is passed\
    \ directly as a parameter to a specific method. (Useful at times, but not a whole-system\
    \ DI approach)\n\n## 3. Refactoring Continued: Our Database Example\n\nLet’s assume\
    \ after Part 1 we have:\n\n```csharp\npublic interface ICustomerRepository { ...\
    \ }\n\npublic class CustomerService\n{\n    private readonly ICustomerRepository\
    \ _repository;\n    public CustomerService(ICustomerRepository repository)  {\n\
    \        _repository = repository;\n    }\n    // ... rest of the code using _repository\n\
    }\n```\n\n### Steps\n\n1. **Real vs. Fake**: Create a `DatabaseCustomerRepository`\
    \ (real) and maybe a `FakeCustomerRepository` (for tests). Both implement `ICustomerRepository`.\n\
    2. **Wiring it Up**: Somewhere in your application’s startup or composition logic,\
    \ you’ll decide which to use:\n\n```csharp\n// Production Mode\nvar customerService\
    \ =  new CustomerService(new DatabaseCustomerRepository(\"...\"));\n\n// Test\
    \ Mode\nvar customerService =  new CustomerService(new FakeCustomerRepository());\n\
    ```\n\n## 4. Taking It Further\n\n* **Manual DI vs. Frameworks**: What we did\
    \ was “manual” dependency injection. For large projects, consider Dependency Injection\
    \ Frameworks which automate object ‘wiring’ based on configuration. We’ll cover\
    \ these later!\n\n### Additional Resources\n\n* **Mark Seemann on Dependency Injection**:\
    \ [https://blog.ploeh.dk/](https://blog.ploeh.dk/) (Search his site for DI content,\
    \ he’s a thought leader on the topic)\n\n### Trade-offs\n\n* **Increased Indirection**:\
    \ DI can potentially make the flow of your application slightly harder to trace\
    \ for newcomers. Good documentation helps!\n* **The Right Amount**: Be pragmatic.\
    \ Not everything must be injected, finding the balance is key.\n\n# Dependency\
    \ Injection via Method Parameters: Implementation and Benefits\n\nWhile constructor\
    \ injection is king for testability, there are scenarios where injecting dependencies\
    \ directly into a method is the right tool for the job.\n\n## 1. How Method Injection\
    \ Works\n\nInstead of the dependency being provided at object construction, it’s\
    \ passed as a parameter to a specific method:\n\n```csharp\npublic class ReportGenerator\n\
    {\n    public void GenerateMonthlyReport(ITextFormatter formatter, string data)\
    \ {\n        // ... Logic to generate report, using formatter\n    }\n}\n```\n\
    \n## 2. When It Makes Sense\n\n* **Optional Dependencies**: The dependency isn’t\
    \ always needed for the object to function.\n* **Multiple Collaborators**: Perhaps\
    \ the method could work with different kinds of formatters (XML, etc.).\n* **Legacy\
    \ Code Constraints**: If refactoring a constructor is difficult, method injection\
    \ can be a way to introduce testability.\n\n## 3. Example: Flexibility in Formatting\n\
    \n```csharp\n// Test Scenario 1\nvar generator =  new ReportGenerator();\ngenerator.GenerateMonthlyReport(new\
    \ XmlFormatter(), \"...\");\n\n// Test Scenario 2\ngenerator.GenerateMonthlyReport(new\
    \ CsvFormatter(), \"...\");\n```\n\n## 4. Testability Considerations\n\n* **Possible\
    \ with Method Injection**: You can easily pass in test doubles during your unit\
    \ tests.\n* **Slightly Less Explicit**: Constructor injection makes a class’s\
    \ dependencies obvious at glance. Method injection trades some of that off.\n\n\
    ## 5. Trade-offs\n\n* **Increased Parameter Lists**: Overuse can lead to methods\
    \ with many parameters. Strike a balance.\n* **Object State**: Constructor Injection\
    \ encourages immutable objects, which is good practice. With method injection,\
    \ there might be a temptation to change the dependency through the method, leading\
    \ to less predictable state.\n\n## Method Injection’s Place in Your Toolkit\n\n\
    It’s not a replacement for constructor injection, but rather a complementary technique:\n\
    \n* **Constructor Injection**: The Default (For core, always-required dependencies)\n\
    * **Method Injection**: The Supplement (For special-case or situational dependencies)\n\
    \n### Up Next\n\nLet’s look at property injection, a less common pattern, understanding\
    \ where it sits in our dependency arsenal.\n\n# Leveraging Property Injection\
    \ for Enhanced Flexibility\n\nProperty injection offers a middle ground between\
    \ the rigidity of constructor injection and the free-for-all of direct field assignments.\
    \ Let’s see when it’s useful and the trade-offs involved.\n\n## 1. The Mechanics\n\
    \nInstead of a dependency being provided through the constructor, it is set via\
    \ a public property:\n\n```csharp\npublic class OrderProcessor\n{\n    public\
    \ ILogger Logger { get; set; }\n    // ... other code ...\n}\n```\n\n## 2. Use\
    \ Cases\n\n* **Optional Dependencies**: Maybe a component can use a logger, but\
    \ it’s not strictly essential for its creation.\n* **Configuration-Driven**: Perhaps\
    \ the decision of which dependency to inject is made based on a configuration\
    \ file or external settings.\n* **Framework Constraints**: Some frameworks or\
    \ libraries might encourage or even force the use of property injection.\n\n##\
    \ 3. The Testability Angle\n\n* **It Works**: You can easily set up test doubles\
    \ in your unit tests:\n\n```csharp\nvar orderProcessor =  new OrderProcessor();\n\
    orderProcessor.Logger =  new TestLogger();\n```\n"
