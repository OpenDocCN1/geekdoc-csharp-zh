  trans: "\n\n- 但需要提醒一点：属性注入会让类的核心依赖关系在一眼看上去不再那么直观。\n\n## 4. 灵活性 vs. 显式性\n\n- **可变状态**：由于属性在对象创建后可以更改，这带来了对象在不完整或不一致的状态下使用的风险（例如，如果\
    \ `Logger` 从未被设置）。\n- **文档是关键**：属性注入更依赖良好的文档来使预期的使用模式变得清晰。\n\n### 示例：高度可配置组件\n\
    \n想象一个可以记录到不同目标的的报告生成器。属性注入允许你在运行时动态切换日志目标。\n\n### 额外资源\n\n- **《NET 中的依赖注入》（Mark\
    \ Seemann 著）**：[`www.amazon.com/Dependency-Injection-NET-Mark-Seemann/dp/1935182501`](https://www.amazon.com/Dependency-Injection-NET-Mark-Seemann/dp/1935182501)\
    \ 虽然不是专针对 C#，但深入涵盖了 DI 概念。请查看关于属性注入的章节。\n\n## 何时选择属性注入\n\n1. **可选优于强制**：当一个组件确实并不总是需要该依赖时，这非常合适。\n\
    2. **后期配置**：如果注入什么内容的决定在对象构造很久之后才做出来。\n3. **务实主义**：适应遗留代码或框架限制。\n\n通常情况下，建议如下：\n\
    \n- **优先使用构造函数注入**：对于核心的、强制的依赖，保持清晰性和不可变性。\n- **谨慎使用属性注入**：仅用于那些灵活性是首要优势的特定场景。\n\
    \n## 下一节\n\n构造函数注入仍然是可测试性的之王。让我们来看看它是如何提供最无缝且受控的方式来连接系统依赖的。\n\n# 利用构造函数注入实现无缝依赖管理\n\
    \n构造函数注入是创建可测试单元的金标准。它提供了清晰性，促进了不可变性，并优雅地引导你走向更好的设计。\n\n## 1. 核心\n\n- **构造函数中的依赖**：类通过在构造函数中要求这些参数来清晰地声明其依赖项。\n\
    - **控制反转**：类不会主动去寻找并创建它的依赖；它期望这些依赖被提供。\n\n### 示例\n\n```csharp\npublic class OrderProcessor\n\
    {\n    private readonly IPaymentGateway _paymentGateway;\n    private readonly\
    \ ILogger _logger;\n\n    public OrderProcessor(IPaymentGateway paymentGateway,\
    \ ILogger logger)\n    {\n        _paymentGateway = paymentGateway;\n        _logger\
    \ = logger;\n    }\n\n    // ... other methods ...\n}\n```\n\n## 2. 为什么它在可测试性上卓越\n\
    \n- **显式合约**：如果不提供依赖的合适实现，你甚至无法创建 `OrderProcessor` 的实例。这防止了意外误用。\n- **测试双变得简单**：在测试期间，你传入你的测试双：\n\
    ```csharp\nvar orderProcessor = new OrderProcessor(new FakePaymentGateway(), new\
    \ TestLogger());\n```\n- **不可变性**：通过在构造函数中分配依赖并将其设置为 `readonly`，你鼓励创建在过程中不会改变内部依赖的对象，从而导致更可预测的行为。\n\
    \n## 3. 测试之外的设计优势\n\n- **松耦合**：`OrderProcessor` 与任何 `IPaymentGateway` 配合，使其更具重用性。\n\
    - **早期错误检测**：如果你尝试在运行时使用无效依赖创建 `OrderProcessor`，你将获得即时反馈，而不是之后出现神秘的失败。\n\n## 4.\
    \ 潜在的“缺点”（以及如何解决）\n\n- **更长的构造函数参数列表**：这意味着一个类可能承担了过多的责任（考虑重构）。\n- **所有内容的连接**：在大型项目中，你可能需要一个依赖注入框架来自动化对象创建——我们很快就会介绍这些！\n\
    \n### 额外资源\n\n- **Martin Fowler 的博客文章“构造函数注入”**：[`martinfowler.com/articles/injection.html#ConstructorInjection`](https://martinfowler.com/articles/injection.html#ConstructorInjection)\n\
    \n## 最小阻力路径\n\n在可能的情况下，构造函数注入应该是默认选择，因为它在可测试性和整体设计方面都具有优势。\n\n## 下一节\n\n牢牢掌握 DI\
    \ 技术是棒的。但我们如何将其扩展到大型应用程序中？让我们探索一下能够为我们简化这一过程的依赖注入框架。\n\n# 探索依赖注入框架：选项与考虑\n\n我们已经学习了如何“手动”进行\
    \ DI。现在，让我们看看框架如何自动完成组件的连接，使其更加简洁，特别是对于大型项目。\n\n## 1. 为什么要使用 DI 框架？\n\n- **减少样板代码**：不需要到处手动传递依赖，你只需配置框架，它就会使用正确的协作对象实例化你的对象。\n\
    - **对象生命周期**：框架可以管理依赖是单例（重用一个实例）、瞬态（每次都创建一个新实例）还是更复杂的类型。\n- **集中式配置**：你在一个地方定义组件如何连接，提高了可见性。\n\
    - **高级功能**：某些框架提供拦截、基于约的连接等功能。\n\n## 2. .NET 中的流行选项\n\n- **Microsoft.Extensions.DependencyInjection**：内置、轻量级，适合入门。\n\
    - **Ninject**：成熟、灵活、基于 XML 的配置（感觉有点老了）。\n- **Autofac**：非常强大，功能丰富，是大型应用程序的热门选择。\n\
    - **Lamar**：专注于速度和清晰度，正在受到关注。\n- **其他许多**：DryIoc, StructureMap, Castle Windsor\
    \ 等。\n\n## 3. 选择时的关键考虑因素\n\n- **性能**：对于大多数应用程序，任何主流框架都可以。如果你有极端的性能需求，请进行基准测试！\n\
    - **功能 vs. 简单**：你需要高级功能（如拦截），还是更轻量级的框架更好？\n- **配置风格**：某些使用代码设置，某些使用 XML，另一些使用约定。找到一个适合你项目风格的。\n\
    - **社区与文档**：健康的社区意味着更好的支持和学习资源。\n\n## 4. 基础示例（概念性）\n\n假设我们正在使用一个虚构的简单 DI 框架\n\n\
    ```csharp\n// Configuration\ncontainer.Register<IPaymentGateway, StripePaymentGateway>();\n\
    container.Register<ILogger, FileLogger>();\n\n// Usage（在应用程序启动的某处）\nvar orderProcessor\
    \ = container.Resolve<OrderProcessor>();\n```\n\n## 5. 基础之外的考虑\n\n- **与 ASP.NET\
    \ Core 集成**：现代 框架通常有自己的 DI 系统，可能与你选择的框架交互。\n- **为 DI 设计**：有效使用 DI 会影响你长期如何构建类结构。\n\
    - **不要过度复杂**：DI 是一个工具，而不是宗教。在合适的地方使用它。\n\n### 额外资源\n\n- **StackOverflow 上 DI 框架的比较**：[`stackoverflow.com/questions/130794/which-net-dependency-injection-frameworks-are-worth-looking-into`](https://stackoverflow.com/questions/130794/which-net-dependency-injection-frameworks-are-worth-looking-into)\n\
    - **Autofac 文档**：[`autofac.org/`](https://autofac.org/)（其他框架的文档很容易找到）\n\n## 下一节\n\
    \n告别脆弱测试，拥抱 Mock！让我们学习如何构建 Mock 对象来隔离单元并专注于测试。\n\n# 释放 Mock 框架的力量：单元测试工具\n\nMock\
    \ 是软件世界中的替身、替演员。它们允许我们隔离单元并进行精确的测试。\n\n## 1. 什么是 Mock 框架？\n\n- **生成测试双的库**：Mock\
    \ 框架（如 C# 中的 `Moq`）允许你动态创建实现接口的伪对象。\n- **控制！**：你决定这些伪对象如何响应方法调用、返回什么值等。\n- **聚焦**：Mock\
    \ 框架让你将聚光灯完全投在待测试的单元上，移除不可预测的依赖。\n\n## 2. 为什么 Mock 是游戏规则的改变者\n\n"
- fmt: "\n- Dealing with Unavailable Dependencies: A database might not be ready,\
    \ a web service down. Mocks don’t care.\n- Test ‘Bad’ Paths: Force your mock to\
    \ throw an exception and see how your unit reacts.\n- Performance: A mock object\
    \ responding with canned data is blazing fast compared to a real external system.\n\
    \n### 3. Basic Example Using Moq (Syntax may vary slightly)\n\n```csharp\n// Arrange\n\
    var mockLogger = new Mock<ILogger>();\nmockLogger.Setup(m => m.Log(It.IsAny<string>()));\
    \ // We don't care about the input for this test\nvar service = new CustomerService(mockLogger.Object);\n\
    \n// Act\nservice.PlaceOrder(someOrder);\n\n// Assert\nmockLogger.Verify(m =>\
    \ m.Log(It.Is<string>(s => s.StartsWith(\"Order placed\"))), Times.Once());\n\
    ```\n\n### 4. Key Concepts\n\n- Mocks vs. Stubs vs. Fakes: Subtle distinctions\
    \ exist, but often we use ‘mock’ as the umbrella term,\n- Setup: Preparing the\
    \ mock’s behavior in advance (like in the example).\n- Verification: Checking\
    \ if methods on the mock were called as expected.\n\n### 5. When to Reach for\
    \ a Mock\n\n- Slow dependencies\n- Unavailable systems during development\n- Error\
    \ cases that are hard to trigger with the real dependency\n- Isolating the true\
    \ functionality you’re testing\n\n### Additional Resources\n\n- Moq Documentation:\
    \ [https://github.com/moq/moq4/wiki/Quickstart](https://github.com/moq/moq4/wiki/Quickstart)\n\
    \n### Cautions: Don’t Overdo It\n\n- Maintainability Matters: Overly complex mock\
    \ setups lead to brittle tests.\n- Test the Real Thing (sometimes): Integration\
    \ tests with real dependencies also have their place in a healthy testing strategy.\n\
    \n### Up Next\n\nLet’s get practical! We’ll dive into specific scenarios and Moq\
    \ techniques to create sophisticated mocks for even tricky dependencies.\n\n#\
    \ Crafting Mock Objects Using Moq: Advanced Techniques, Part 1\n\nWe’ve grasped\
    \ the basics of mocking. Now, let’s unlock more intricate scenarios to make our\
    \ mocks even more effective.\n\n### 1. Matching Arguments\n\n- Going Beyond “Any”:\
    \ `It.Is<string>(s => s.Contains(\"error\"))` – Match only strings containing\
    \ ‘error’.\n- Matchers for Precision: `It.IsRegex(\"[a-z]{10}\")` – complex matching\
    \ when needed.\n- Custom Matchers: For really bespoke scenarios, you can even\
    \ create your own matching logic.\n\n### 2. Mocking Multiple Return Values\n\n\
    - Setup Sequences:\n```csharp\nmockRepo.SetupSequence(m => m.GetById(123))\n \
    \       .Returns(aCustomer)\n        .Returns((Customer)null);\n```\n- Behavior\
    \ Change over Time: First call returns a customer, subsequent calls return null\
    \ (simulating something not being found).\n\n### 3. Mocking Properties\n\n- Getters\
    \ & Setters:\n```csharp\nmockService.Setup(m => m.Status).Returns(\"OK\");\nmockService.SetupSet(m\
    \ => m.LastUpdated = DateTime.Now);\n```\n- Testing Interactions: Mocking properties\
    \ is helpful for both setting up test values and later verifying if your unit\
    \ under test modified them.\n\n### 4. Mocking Void Methods\n\n- Callbacks:\n```csharp\n\
    int callCount = 0;\nmockMailer.Setup(m => m.SendMail(It.IsAny<string>(), It.IsAny<string>()))\n\
    \          .Callback(() => callCount++);\n\n// ... your test ...\nAssert.AreEqual(2,\
    \ callCount); // Verify the void method was called twice\n```\n- Indirect Verification:\
    \ Mocking frameworks often can detect calls to void methods even without a setup,\
    \ making them ideal for interaction testing (which we’ll cover further soon!).\n\
    \n### 5. Partial Mocks\n\n- Mocking Some Parts, Real Implementation for Others:\
    \ Useful when you have a class where only a specific method needs to be replaced\
    \ with a mock version.\n- Use with Care: They can make tests a bit ‘magical’ as\
    \ real code is silently executed. Consider if refactoring the class under test\
    \ is a better option.\n\n#### Example: Mocking a File I/O Dependency\n\n```csharp\n\
    var mockFileSystem = new Mock<IFileSystem>();\nmockFileSystem.Setup(fs => fs.FileExists(It.IsAny<string>())).Returns(true);\n\
    mockFileSystem.Setup(fs => fs.ReadAllText(\"data.txt\")).Returns(\"test content\"\
    );\nvar fileProcessor = new FileProcessor(mockFileSystem.Object);\n```\n\n###\
    \ Additional Resources\n\n- Moq “cheat sheet”: [https://github.com/Moq/moq4/wiki/Quickstart#cheat-sheet](https://github.com/Moq/moq4/wiki/Quickstart#cheat-sheet)\n\
    \n### Trade-offs\n\n- Complexity vs. Readability: Complex mocks can become hard\
    \ to understand. Strive for a balance between flexibility and clarity.\n\n###\
    \ Up Next\n\nIn Part 2, we’ll tackle raising events from mocks, testing how classes\
    \ interact, and strategies to avoid mocking pitfalls.\n\n# Crafting Mock Objects\
    \ Using Moq: Advanced Techniques, Part 2\n\n### 1. Raising Events from Mocks\n\
    \n- Why It Matters: Testing how unit reacts to events.\n```csharp\nvar mockMailer\
    \ = new Mock<IMailer>();\nmockMailer.Raise(m => m.Sent, new EventArgs(\"test\"\
    ));\nvar service = new NotificationService(mockMailer.Object);\n```\n\n### 2.\
    \ Mocking Out-Parameters\n\n- Scenario: When method uses `out` parameters.\n```csharp\n\
    mockRepo.Setup(m => m.TryById(It.IsAny<int>(), out customer))\n        .Returns(true);\n\
    ```\n\n### 3. Verifying Calls in Specific Order\n\n- Sequence Matters: Especially\
    \ when unit interacts with mock multiple times.\n```csharp\nvar sequence = new\
    \ MockSequence();\nmockMock.InSequence(sequence).Setup(m => m.Step1());\nmockMock.InSequence(sequence).Setup(m\
    \ => m.Step2());\n```\n\n### 4. State-based vs. Interaction Testing\n\n- State-based:\
    \ Ensuring the output and side-effects of a method are as expected.\n- Interaction-based:\
    \ Verifying whether the unit under test collaborates with its dependencies correctly.\n\
    \n#### Example: Testing Complex Interaction\n\nImagine an `OrderProcessor` that\
    \ talks to a payment gateway and inventory system:\n\n```csharp\nvar mockPaymentGateway\
    \ = new Mock<IPaymentGateway>();\nvar mockInventoryService = new Mock<IInventoryService>();\n\
    var orderProcessor = new OrderProcessor(mockPaymentGateway.Object, mockInventoryService.Object);\n\
    \norderProcessor.ProcessOrder(order);\n\nmockPaymentGateway.Verify(x => x.ProcessPayment(order),\
    \ Times.Once);\nmockInventoryService.Verify(x => x.ReduceStock(order.Items), Times.Once);\n\
    ```\n\n### 5. When Mocking Gets Tough\n\n- Overly Complex Mocks: A sign your code\
    \ might need refactoring.\n- Tooling Limits: Extremely intricate mocking might\
    \ be possible, but the test itself becomes brittle.\n- Stepping Back: Consider\
    \ if a coarser-grained integration test is needed in some cases, along with your\
    \ unit tests.\n"
