  trans: "\n\n-   防止腐烂：如果不加维护，代码会随着时间的推移而退化。重构有助于对抗复杂性的“腐烂”和技术债。\n-   开发者快乐：整洁、设计良好的代码编写起来更加愉快！\n\
    \n## 测试：你的重构安全网\n\n想象一下在没有测试的情况下进行重构。每次更改都会带随着一种担心意外破坏某些东西的持续恐惧。拥有一套稳健的测试，你将获得这种巨大的优势：\n\
    \n1. **进行更改**：根据需要重构你的代码。\n2. **运行测试**：你的测试套件会自动运行。\n3. **即时反馈**：如果测试通过，你就有充分的你的更改没有引入意外的问题。如果某个测试失败，它会精确指出你需要关注的地方。\n\
    \n### 示例例说明\n\n假设你有一个复杂的方法 `CalculateOrderTotal`，它已经变得难以理解。通过覆盖各种 `CalculateOrderTotal`\
    \ 场景的测试，你可以：\n\n- 将该方法拆分为更小、更关注特定点的函数。\n- 引入更清晰的变量名。\n- 优化计算逻辑。\n\n……在此过程中，测试会不断验证它仍然输出正确的结果！\n\
    \n### 信心拥抱变化\n\n在有强大的测试套件的情况下进行重构将改变你的心态。你不再害怕变化，而是拥抱它，确信如果你失误，测试会迅速发出信号。\n\n\
    ### 重构类型\n\n以下是测试大显身手的常见重构技术：\n\n- **提取方法 (Extract Method)**：将一个长方法解耦为较小的、命名良好的函数。\n\
    - **重命名 (Rename)**：使用具描述性的类、方法或变量名来提高可读性。\n- **引入设计模式**：应用成熟模式（观察者、工厂等）来增强结构和灵活性。\n\
    \n### 额外资源\n\n- Refactoring.Guru（重构目录）：[`refactoring.guru/`](https://refactoring.guru/)\n\
    - Martin Fowler: Refactoring [`martinfowler.com/books/refactoring.html`](https://martinfowler.com/books/refactoring.html)（一本关于重构的经典书籍）\n\
    \n## 核心要点\n\n重构和测试形成了一个强大的循环。测试赋予你重构的勇气，而重构往往会导致更简单、更容易测试的代码。这促进了代码的长期健康。\n\n\
    ## 下一步\n\n现在你已经理解了测试的重要性，让我们深入学习如何使用强大的 NUnit 框架编写优秀的单元测试的细节。\n\n让我们用 NUnit 开始测试吧！\n\
    \n# 在 Visual Studio 中利用 NUnit 进行高效测试\n\nNUnit 是一个经过测试的 C# 和 .NET 生态系统的单元测试框架。与\
    \ Visual Studio 使用时，你将获得无缝的测试体验。让我们探索如何协同使用它们。\n\n## 前提条件\n\n- 基础 Visual Studio\
    \ 经验（创建项目等）\n- 理解之前章节中的单元测试概念\n\n## 1. 安装 NUnit\n\n最简单的方法是使用 Visual Studio 的 NuGet\
    \ 包管理器：\n\n1. 右键点击你的测试项目 -> “管理 NuGet 包……”\n2. 搜索 `NUnit` 并安装 `NUnit` 包。\n3. 同时安装\
    \ `NUnit3TestAdapter` 包。这使得 Visual Studio 能够发现并运行你的测试。\n\n## 2. Visual Studio\
    \ 的测试管理器 (Test Explorer)\n\n你与 NUnit 测试交互的主要界面是测试管理器窗口：\n\n- **找到它**：查看 -> 测试管理器（或使用\
    \ Visual Studio 中的搜索框）\n- **运行测试**：安装 NUnit 后，生成你的项目。测试将出现在测试管理器中。你可以单独运行它们或一次性运行所有。\n\
    - **结果**：测试管理器显示清晰的结果（通过/失败/跳过）以及任何错误输出。\n\n## 3. 编写你的第一个 NUnit 测试（复习）\n\n让我们创建一个新测试。回顾上一个章节中的结构：\n\
    \n```csharp\nusing NUnit.Framework;\n\nnamespace CalculatorTests\n{\n    [TestFixture]\n\
    \    public class CalculatorTests\n    {\n        [Test]\n        public void\
    \ Add_PositiveNumbers_ReturnsCorrectSum()\n        {\n            // ... (Arrange,\
    \ Act, Assert 如之前所示)\n        }\n    }\n}\n```\n\n**(关键点)**\n\n- `NUnit.Framework`：包含必要的命名空间。\n\
    - `TestFixture`：标记类类包含测试。\n- `Test`：标记单个的测试方法。\n\n## 4. 运行和调试测试\n\n- **运行**：点击测试管理器中的“运行”图标。\n\
    - **调试**：像处理普通代码一样在你的测试方法内部设置断点。单步执行以详细调查测试失败。\n\n## 5. 测试组织\n\n- **测试固件**：使用多个\
    \ `[TestFixture]` 类在逻辑上分组测试（例如，`AccountServiceTests`、`OrderRepositoryTests`）。\n\
    - **命名空间**：使用命名空间进一步组织较大的测试项目。\n\n## 6. 额外的 NUnit 特性（预览）\n\n我们稍后会深入探讨，这里是进一步能力的预览：\n\
    \n- **参数化测试**：用于数据驱动测试的 `[TestCase]` 特性。\n- **Setup/Teardown**：`[SetUp]` 用于公共测试初始化，`[TearDown]`\
    \ 用于清理。\n- **断言 (Assertions)**：NUnit 提供了一套丰富的断言方法（例如 `AreEqual`、`Throws` 等）。\n\
    \n### 额外资源\n\n- NUnit 文档：[`docs.nunit.org/`](https://docs.nunit.org/)\n- Visual\
    \ Studio 测试工具：[`docs.microsoft.com/en-us/visualstudio/test/`](https://docs.microsoft.com/en-us/visualstudio/test/)\n\
    \n## 指尖上的力量\n\nNUnit 和 Visual Studio 结合在一起，在你喜爱的 IDE 中直接提供顺畅且强大的测试工作流。随着你编写越来越复杂的测试，你将越来越重视这种集成的价值。\n\
    \n## 下一个：测试驱动开发\n\n现在你已经准备好了 NUnit，让我们探索一种可以彻底改变你编写软件方式哲学：测试驱动开发 (TDD)！\n\n# 拥抱测试驱动开发：原则与实践\n\
    \n测试驱动开发 (TDD) 不仅仅是编写测试。它是一种翻转传统开发过程的哲学，让测试驱动你设计和编写代码的方式。让我们深入它的核心原则和优势。\n\n##\
    \ TDD 循环\n\nTDD 围绕着一个短的迭代循环：\n\n1. **红色 (Red)**：从编写一个失败的小测试开始（因为功能还没有）。\n2. **绿色\
    \ (Green)**：编写最少的代码使测试通过。在这个阶段不要担心完美的设计。\n3. **重构 (Refactor)**：有了通过的测试，现在可以放心地重构并改进你的代码设计，确保测试仍然通过。\n\
    \n## TDD 的优势\n\n- **专注与引导**：TDD 让你一次专注于一个微小的功能单元，从而实现增进的进展。\n- **早期反馈**：失败的测试会迅速指出你的实现是否偏离了预期行为。\n\
    - **设计强制器**：循环中的“稍后设计”步骤鼓励做出设计设计，促进可测试、可维护的代码。\n- **内置的回归安全网**：随着你代码库的增长，你的 TDD\
    \ 测试将形成一个日益健壮的防止回归的安全网。\n\n## 实际示例\n\n让我们回顾我们的 `Calculator` 类：\n\n1. **红色**：编写一个类似\
    \ `Add_PositiveNumbers_ReturnsCorrectSum()` 的测试。它最初预期失败，因为 `Add` 并不存在。\n2. **绿色**：创建一个简单的\
    \ `Add` 方法并带有硬编码逻辑使测试通过（例如，目前仅返回一个固定和）。\n3. **重构**：现在用适当的计算替换硬编码逻辑，确保测试（以及你此后添加的任何其他测试）仍然通过。\n\
    \n## TDD 心态转变\n\n采用 TDD 需要练习和心态的转变。不要直接跳入编码，要学会思考“测试优先”。以下是这种转换的一些建议：\n\n- **小步走**：从测试非常小的行为单元开始。\n\
    - **不要过度思考**：在“绿色”阶段，优先考虑仅仅让测试通过，而不是编写最优雅的解决方案。\n- **信任过程**：起初可能会感觉慢，但随着你测试套件的增长，你将获得速度和信心。\n\
    \n## 额外资源\n\n- 测试驱动开发 (TDD）简介：[`www.agilealliance.org/glossary/tdd/`](https://www.agilealliance.org/glossary/tdd/)\n\
    \n"
