  trans: "\n\n1. **识别目标**：选择一个难以测试的类或代码段。\n2. **编写特征化测试（如果需要）**：如果缺少测试，编写能够捕获当前行为的测试，即使这些代码目前很乱。\n\
    3. **小规模重构**：进行单一且集中的更改（提取方法、为构造函数引入参数等）。重新运行测试，它们应该仍然通过测试。\n4. **重复**：通过微小的重构进行迭代，始终保持测试通过（绿色）的状态。\n\
    \n## 3. 示例：打破数据库依赖\n\n让我们想象一个与数据库紧耦合的类：\n\n```csharp\npublic class CustomerService\n\
    {\n    private readonly string _connectionString;\n    public CustomerService(string\
    \ connectionString)  {\n        _connectionString = connectionString;\n    }\n\
    \    public Customer GetCustomerById(int id)\n    {\n        // 使用 _connectionString\
    \ 的复杂数据库查询逻辑 ...\n    }\n}\n```\n\n### 步骤：\n\n1. **接口**：引入 `ICustomerRepository`\
    \ 并包含如 `GetById(int id)` 等方法。\n2. **让 `CustomerService` 使用接口**：更改其构造函数并修改数据库逻辑以使用存储库。\n\
    3. **测试双实现**：在测试期间，你现在可以提供一个假的 `ICustomerRepository`。\n\n### 额外资源\n\n* **Martin\
    \ Fowler 的重构目录**：[`refactoring.com/catalog/`](https://refactoring.com/catalog/)\
    \ 经典之。\n* **书籍**：《Legacy 代码重构》(Working Effectively with Legacy Code - Michael\
    \ Feathers)：[`www.amazon.com/Working-Effectively-Legacy-Michael-Feathers/dp/0131177052`](https://www.amazon.com/Working-Effectively-Legacy-Michael-Feathers/dp/0131177052)\n\
    \n### 注意事项\n\n* **不要一次改变所有内容**：大规模重写是有风险的。小步是你的朋友。\n* **测试作为指南**：测试套件会告诉你重构在功能上何时是等价，以及何时犯了错误。\n\
    \n### 下节预\n\n在第 2 部分，我们将查看具体的重构技术和依赖注入的核心概念，这是一种创建松耦合代码的强大模式。\n\n# 迈向松耦合的逐步重构，第\
    \ 2 部分\n\n在上一章节中，我们开始在代码中引入接缝（seams）。现在，让我们学习如何充分利用这些接缝来注入依赖，使我们的单元变得易于测试。\n\n\
    ## 1. 依赖注入 (DI) 概述\n\n* **核心思想**：类不直接创建它的依赖项。相反，它们是从外部“注入”的。\n* **收益**：\n    *\
    \ 极致的解耦\n    * 轻松切换测试双端\n    * 增加应用程序整体结构的灵活性\n\n## 2. 依赖注入的类型\n\n* **构造函数注入**：通过构造函数传递依赖。（由于其清晰性和可测试性，这是首选方式）\n\
    * **属性注入**：通过公共属性设置依赖。（有时使用，但对可测试性而言不够理想）\n* **方法注入**：依赖项直接作为参数传递给特定方法。（有时有用，但不是一种全系统的\
    \ DI 方案）\n\n## 3. 继续重构：我们的数据库示例\n\n假设在第 1 部分之后，我们拥有：\n\n```csharp\npublic interface\
    \ ICustomerRepository { ... }\n\npublic class CustomerService\n{\n    private\
    \ readonly ICustomerRepository _repository;\n    public CustomerService(ICustomerRepository\
    \ repository)  {\n        _repository = repository;\n    }\n    // ... 使用 _repository\
    \ 的其余代码\n}\n```\n\n### 步骤\n\n1. **真实 vs 伪造**：创建一个 `DatabaseCustomerRepository`（真实的）和一个可能的\
    \ `FakeCustomerRepository`（用于测试）。两者都实现 `ICustomerRepository`。\n2. **连接**：在应用程序的启动或组合逻辑的某处，你决定使用哪一个：\n\
    \n```csharp\n// 生产模式\nvar customerService =  new CustomerService(new DatabaseCustomerRepository(\"\
    ...\"));\n\n// 测试模式\nvar customerService =  new CustomerService(new FakeCustomerRepository());\n\
    ```\n\n## 4. 进一步探索\n\n* **手动 DI vs 框架**：我们所的是“手动”依赖注入。对于大型项目，考虑使用依赖注入框架，它可以根据配置自动化对象的“连接”。我们稍后介绍这些！\n\
    \n### 额外资源\n\n* **Mark Seemann 关于依赖注入的文章**：[`blog.ploeh.dk/`](https://blog.ploeh.dk/)（在他的网站搜索\
    \ DI 相关内容，他是该领域的思想领袖）\n\n### 权衡\n\n* **增加间接性**：DI 可能会让新手追踪应用程序的流变得稍微困难。良好的文档会有帮助！\n\
    * **适度**：要务实。并不是所有内容都必须注入，找到平衡是关键。\n\n# 通过方法参数进行依赖注入：实现与收益\n\n虽然构造函数注入在可测试性方面是王者，但在某些情况下，直接将依赖项注入方法中是处理工作的正确工具。\n\
    \n## 1. 方法注入如何工作\n\n依赖项不是在对象构造时提供的，而是作为参数传递给特定方法：\n\n\n\n```csharp\npublic class\
    \ ReportGenerator\n{\n    public void GenerateMonthlyReport(ITextFormatter formatter,\
    \ string data) {\n        // ... 使用 formatter 生成报告的逻辑\n    }\n}\n```\n\n## 2.\
    \ 何时适用\n\n* **可选依赖**：对象的运行并不总是需要该依赖项。\n* **多个协作者**：也许该方法可以与不同类型的格式化器（XML 等）工作。\n\
    * **遗留代码限制**：如果重构构造函数很困难，方法注入可以是引入可测试性的方法。\n\n## 3. 示例：格式化中的灵活性\n\n```csharp\n\
    // 测试场景 1\nvar generator =  new ReportGenerator();\ngenerator.GenerateMonthlyReport(new\
    \ XmlFormatter(), \"...\");\n\n// 测试场景 2\ngenerator.GenerateMonthlyReport(new\
    \ CsvFormatter(), \"...\");\n```\n\n## 4. 可测试性考虑\n\n* **通过方法注入可行**：你可以在单元测试期间轻松传递测试双端。\n\
    * **稍微不直观**：构造函数注入让类的依赖项一目了然。方法注入牺牲了部分直观性。\n\n## 5. 权衡\n\n* **参数列表增加**：过度使用会导致方法带有许多参数。请保持平衡。\n\
    * **对象状态**：构造函数注入鼓励不可变对象，这是良好的做法。使用方法注入时，可能会通过方法更改依赖的诱惑，导致状态变得不可预测。\n\n## 方法注入在工具箱中的位置\n\
    \n它不是构造函数注入的替代品，而是一种补充技术：\n\n* **构造函数注入**：默认方案（用于核心、始终需要的依赖项）\n* **方法注入**：补充方案（用于特殊情况或情境依赖项）\n\
    \n### 下节预\n\n让我们看看属性注入，这是一种不常见的模式，了解它在我们的依赖库处于什么位置。\n\n# 利用属性注入增强灵活性\n\n属性注入在构造函数注入的僵性与直接字段赋值的随意之间提供了一个折中方案。让我们看看何时有用以及涉及的权衡。\n\
    \n## 1. 机制\n\n依赖项不是通过构造函数提供的，而是通过公共属性设置的：\n\n```csharp\npublic class OrderProcessor\n\
    {\n    public ILogger Logger { get; set; }\n    // ... 其他代码 ...\n}\n```\n\n##\
    \ 2. 使用场景\n\n* **可选依赖**：可能组件可以使用日志记录器，但它对于它的创建并不是绝对必需的。\n* **配置驱动**：注入哪种依赖项的决定可能是基于配置文件或外部设置的。\n\
    * **框架限制**：某些框架或库可能会鼓励甚至强制使用属性注入。\n\n## 3. 可测试性角度\n\n* **它是可行的**：你可以在单元测试中轻松设置测试双端：\n\
    \n```csharp\nvar orderProcessor =  new OrderProcessor();\norderProcessor.Logger\
    \ =  new TestLogger();\n```\n\n"
- fmt: "\n- But a Word of Caution: Property injection makes the core dependencies\
    \ of a class less immediately obvious at a glance.\n\n## 4. Flexibility vs. Explicitness\n\
    \n- **Mutable State**: Since the property can be changed after object creation,\
    \ it carries the risk of the object being used in an incomplete or inconsistent\
    \ state (e.g., if `Logger` was never set).\n- **Documentation is Key**: Property\
    \ injection relies more heavily on good documentation to make the intended usage\
    \ pattern clear.\n\n### Example: Highly Configurable Component\n\nImagine a report\
    \ generator that can log to different targets. Property injection would let you\
    \ dynamically switch the logging target at runtime.\n\n### Additional Resources\n\
    \n- **Dependency Injection in .NET (Book by Mark Seemann)**: [https://www.amazon.com/Dependency-Injection-NET-Mark-Seemann/dp/1935182501](https://www.amazon.com/Dependency-Injection-NET-Mark-Seemann/dp/1935182501)\
    \ While not C# specific, covers DI concepts in-depth. Look for sections on property\
    \ injection.\n\n## When to Choose Property Injection\n\n1. **Optional over Mandatory**:\
    \ A good fit when a component truly doesn’t always need the dependency.\n2. **Late\
    \ Configuration**: If the decision of what to inject is determined well after\
    \ object construction.\n3. **Being Pragmatic**: Adapting to legacy code or framework\
    \ restrictions.\n\nGenerally speaking, it’s often advisable to:\n\n- **Prefer\
    \ Constructor Injection**: For core, mandatory dependencies to maintain clarity\
    \ and immutability.\n- **Use Property Injection Sparingly**: For those specific\
    \ scenarios where its flexibility is the paramount advantage.\n\n## Up Next\n\n\
    Constructor injection remains the king of testability. Let’s look at how it provides\
    \ the most seamless and controlled way to wire up the dependencies of our system.\n\
    \n# Utilizing Constructor Injection for Seamless Dependency Management\n\nConstructor\
    \ injection is the gold standard for creating testable units. It provides clarity,\
    \ promotes immutability, and gracefully guides you towards better design.\n\n\
    ## 1. The Essence\n\n- **Dependencies in the Constructor**: A class clearly declares\
    \ its dependencies by requiring them as parameters in its constructor.\n- **Inversion\
    \ of Control**: The class doesn’t reach out and create its dependencies; it expects\
    \ them to be provided.\n\n### Example\n\n```csharp\npublic class OrderProcessor\n\
    {\n    private readonly IPaymentGateway _paymentGateway;\n    private readonly\
    \ ILogger _logger;\n\n    public OrderProcessor(IPaymentGateway paymentGateway,\
    \ ILogger logger)\n    {\n        _paymentGateway = paymentGateway;\n        _logger\
    \ = logger;\n    }\n\n    // ... other methods ...\n}\n```\n\n## 2. Why It Rules\
    \ for Testability\n\n- **Explicit Contracts**: You can’t even create an instance\
    \ of `OrderProcessor` without providing suitable implementations of its dependencies.\
    \ This prevents accidental misuse.\n- **Test Doubles Made Easy**: During testing,\
    \ you pass in your test doubles:\n```csharp\nvar orderProcessor = new OrderProcessor(new\
    \ FakePaymentGateway(), new TestLogger());\n```\n- **Immutability**: By assigning\
    \ dependencies in the constructor and making them `readonly`, you encourage creating\
    \ objects that don’t change their internal dependencies mid-flight, leading to\
    \ more predictable behavior.\n\n## 3. Design Benefits Beyond Testing\n\n- **Loose\
    \ Coupling**: The `OrderProcessor` works with any `IPaymentGateway`, making it\
    \ more reusable.\n- **Early Error Detection**: If you attempt to create an `OrderProcessor`\
    \ at runtime with invalid dependencies, you’ll get immediate feedback, not a mysterious\
    \ failure later on.\n\n## 4. Potential “Drawbacks” (And how to address them)\n\
    \n- **Longer Constructor Parameter Lists**: A sign that a class might have too\
    \ many responsibilities (consider refactoring).\n- **Wiring it All Together**:\
    \ In large projects, you’ll likely want a Dependency Injection framework to automate\
    \ object creation – we’ll cover those soon!\n\n### Additional Resources\n\n- **Blog\
    \ post “Constructor Injection” by Martin Fowler**: [https://martinfowler.com/articles/injection.html#ConstructorInjection](https://martinfowler.com/articles/injection.html#ConstructorInjection)\n\
    \n## The Path of Least Resistance\n\nConstructor injection, when possible, should\
    \ be your default choice due to its advantages in both testability and overall\
    \ design.\n\n## Up Next\n\nHaving a solid grasp of DI techniques is great. But\
    \ how do we scale this to large applications? Let’s explore Dependency Injection\
    \ Frameworks that streamline this process for us.\n\n# Exploring Dependency Injection\
    \ Frameworks: Options and Considerations\n\nWe’ve learned how to do DI ‘manually’.\
    \ Now, let’s see how frameworks automate the wiring-up of our components, making\
    \ it cleaner, especially for large projects.\n\n## 1. Why Use a DI Framework?\n\
    \n- **Reduced Boilerplate**: Instead of manually passing dependencies everywhere,\
    \ you configure the framework, and it instantiates your objects with the right\
    \ collaborators.\n- **Object Lifecycles**: Frameworks can manage whether your\
    \ dependencies are singletons (one instance reused), transient (new instance each\
    \ time), or something more elaborate.\n- **Centralized Configuration**: You define\
    \ how components are connected in one place, improving visibility.\n- **Advanced\
    \ Features**: Some frameworks offer interception, convention-based wiring, and\
    \ more.\n\n## 2. Popular Options in .NET\n\n- **Microsoft.Extensions.DependencyInjection**:\
    \ Built-in, lightweight, good for getting started.\n- **Ninject**: Mature, flexible,\
    \ XML-based configuration (feels a bit older).\n- **Autofac**: Very powerful,\
    \ feature-rich, popular choice for large applications.\n- **Lamar**: Focus on\
    \ speed and clarity, gaining traction.\n- **Many Others**: DryIoc, StructureMap,\
    \ Castle Windsor, etc.\n\n## 3. Key Considerations When Choosing\n\n- **Performance**:\
    \ For most applications, any major framework is fine. If you have extreme performance\
    \ needs, benchmark!\n- **Features vs. Simplicity**: Do you need advanced features\
    \ (like interception), or is a leaner framework better?\n- **Configuration Style**:\
    \ Some use code-based setup, others XML, and others conventions. Find one that\
    \ suits your project’s style.\n- **Community & Documentation**: A healthy community\
    \ means better support and learning resources.\n\n## 4. Basic Example (Conceptual)\n\
    \nLet’s assume we’re using a fictional, simple DI framework\n\n```csharp\n// Configuration\n\
    container.Register<IPaymentGateway, StripePaymentGateway>();\ncontainer.Register<ILogger,\
    \ FileLogger>();\n\n// Usage (somewhere in your app's startup)\nvar orderProcessor\
    \ = container.Resolve<OrderProcessor>();\n```\n\n## 5. Considerations Beyond the\
    \ Basics\n\n- **Integration with ASP.NET Core**: Modern web frameworks often have\
    \ their own DI system that might interact with your chosen framework.\n- **Design\
    \ for DI**: Using DI effectively influences how you structure your classes long-term.\n\
    - **Don’t Overcomplicate**: DI is a tool, not a religion. Use it where it makes\
    \ sense.\n\n### Additional Resources\n\n- **Comparison of DI frameworks on StackOverflow**:\
    \ [https://stackoverflow.com/questions/130794/which-net-dependency-injection-frameworks-are-worth-looking-into](https://stackoverflow.com/questions/130794/which-net-dependency-injection-frameworks-are-worth-looking-into)\n\
    - **Autofac Documentation**: [https://autofac.org/](https://autofac.org/) (Documentation\
    \ for other frameworks can be easily found)\n\n## Up Next\n\nSaying goodbye to\
    \ brittle tests and hello to the power of mocks! Let’s learn how to craft mock\
    \ objects to isolate units for focused testing.\n\n# Unleashing the Power of Mocking\
    \ Frameworks: Essential Tools for Unit Testing\n\nMocks are the stand-ins, the\
    \ stunt doubles of the software world. They allow us to isolate our units and\
    \ test them with laser-like precision.\n\n## 1. What is a Mocking Framework?\n\
    \n- **Libraries that Generate Test Doubles**: Mocking frameworks (like `Moq` for\
    \ C#) let you create fake objects that implement interfaces on the fly.\n- **Control!**:\
    \ You dictate how these fake objects should respond to method calls, what values\
    \ they return, and more.\n- **Focus**: Mocking frameworks let you shift the spotlight\
    \ entirely onto the unit you’re testing, removing unpredictable dependencies.\n\
    \n## 2. Why Mocks are a Game-Changer\n"
