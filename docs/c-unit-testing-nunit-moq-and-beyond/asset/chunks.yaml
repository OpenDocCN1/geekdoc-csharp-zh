  trans: "\n\n# 你需要关注流过系统的值\n\n- 基于交互的：\n    - 与外部协作者的行为至关重要。\n    - 确保被测单元正确地“编排”其依赖项。\n\
    \n## 4. 过度强调的危险\n\n- 过度基于状态（State-based）：导致测试变得脆弱，因为它们依附于方法的具体实现细节。\n- 过度基于交互（Interaction-based）：可能会导致对代码进行微观管理，即使外部行为保持一致，代码也难以重构。\n\
    \n### 示例：重新审视订单处理\n\n- 基于状态的：`ProcessOrder` 是否正确地设置了 `Order` 对象上的 `status` 属性？\n\
    - 基于交互的：`ProcessOrder` 是否调用了支付网关并更新了库存？是否向这两个者都传递了正确的订单数据？\n\n### 额外资源\n\n- Martin\
    \ Fowler 论“Mocks 不是 Stubs”：[`martinfowler.com/articles/mocksArentStubs.html`](https://martinfowler.com/articles/mocksArentStubs.html)（深入探讨了哲学上的区别）\n\
    \n## 5. 混合测试的智慧\n\n大多数现实世界的单元测试都结合了这两种技术。艺术在于找到正确的平衡：\n\n- 从结果开始：你的单元应该做的核心任务是什么？这通常决定了基于状态的是否应该是你的起点。\n\
    - 协作者工作流：是否存在必须以特定方式发生的关键交互？在此基础上叠加交互测试。\n\n### 下节预：\n\n让我们看看测试对象交互如何变得更加复杂，以及处理复杂场景的策略。\n\
    \n# 测试对象交互：策略与示例\n\n当单元并非孤立存在时，我们需要验证它们是否正确通信。Mock 框架在这一领域大放异彩。\n\n## 1. 交互测试的本质\n\
    \n- 视角转变：从单元返回什么转变为它如何使用其依赖项。\n- 为什么重要：错误的交互是 Bug 的常见来源，即使单个单元看起来都工作正常。\n\n##\
    \ 2. 关键策略\n\n- 验证调用：你的单元是否在依赖对象上调用了“正确”的方法？是否使用了正确的参数？\n\n```c\nmockPaymentService.Verify(m\
    \ => m.Charge(order, customer.CreditCard), Times.Once);\n```\n\n- 顺序（当顺序很重要时）：\n\
    \n```csharp\n// 示例 - 确保在处理支付之前检查库存\nvar mockSequence = new Sequence();\nmockInventory.InSequence(mockSequence).Setup(x\
    \ => x.IsInStock(order));\nmockPaymentGateway.InSequence(mockSequence).Setup(x\
    \ => x.Charge(order));\n```\n\n- 间接观察：有时你不需要 Mock 直接协作者。相反，你测试是否发生了某些下游结果：\n \
    \   - 调用链之后是否发生了数据库更新？\n    - 消息是否被放入队列进行异步处理？\n\n## 3. 示例场景\n\n- Web 控制器：确保处理表单提交的控制器与服务层或存储层正确交互以保存数据。\n\
    - 具有多个依赖项的服务：验证 `OrderService` 如何使用 `InventoryManager` 验证库存、使用 `PaymentProcessor`\
    \ 充电，然后使用 `NotificationService` 发送确认邮件。\n- 工作流：测试由多个步骤组成的过程，确保对象能够沿传递数据并正确触发下一阶段。\n\
    \n## 4. 考虑因素\n\n- 细节粒：你深入多深？Mock 每一个交互会导致测试变得脆弱且过于具体。专注于最关键的协作点。\n- 部分 Mock（Partial\
    \ Mocks）：对于混合场景可能有用，即你想在单个对象上混合真实行为和 Mock 行为。\n- 测试意图：你正在验证的交互目的是目的是什么？在你的测试名称中保持其清晰。\n\
    \n### 示例：订单处理工作流\n\n```csharp\n[Test]\npublic void ProcessOrder_ValidatesStock_ChargesCustomer_SendsEmail()\n\
    {\n    // 设置 mocks，可能包含针对返回值的基于状态的设置\n    // 执行\n    orderService.Process(order);\n\
    \    // 断言交互\n    mockInventory.Verify(i => i.ReduceStock(order.Items), Times.Once);\n\
    \    mockPaymentGateway.Verify(p => p.Charge(order.Total), Times.Once);\n    mockMailer.Verify(m\
    \ => m.SendOrderConfirmation(order), Times.Once);\n}\n```\n\n### 下节预告\n\nMock\
    \ 可以是一项超能力，但如果不加使用会导致测试头疼。让我们学习如何识别滥用 Mock 的陷阱，以及保持测试健康的最佳实践。\n\n# 识别并避免 Mock\
    \ 滥用：最佳实践\n\nMock 是一项强大的工具，但必须谨慎使用。否则，你得到的测试将是脆弱、意图模糊，甚至可能给你虚假的安全感。\n\n## 1. Mock\
    \ 滥用的迹象\n\n- 测试与实现过度紧密：如果微小的代码更改破坏了许多测试，你可能过度 Mock 了。\n- 测试指定了“如何做”而非“做什么”：过于详细的顺序，验证低级交互——你的测试不应该逐行地镜像你的生产环境代码。\n\
    - 设置 Mock 困难：复杂的设置调用链表明你的真实代码可能存在可测试性问题。\n- TDD 变得不可能：如果因为 Mock 导致你难以在编写代码之前编写测试，这是一个危险信号。\n\
    - 测试失去可读性：充斥着晦涩 Mock 设置和验证的测试难以理解和维护。\n\n## 2. 预防策略\n\n- Mock 角色而非实现：关注依赖项的合约（接口），而不是其内部细节。\n\
    - 测试行为而非调用：从基于状态的测试开始。将交互测试隔离到最关键的交互上。\n- 不要 Mock 你不拥有的：Mock 第三方库可能是必要的，但要非常克制。优先编写一个带有你可控接口的轻薄封装层以供测试使用。\n\
    - 为了可测试性进行重构：如果觉得 Mock 很痛苦，通常意味着你的代码耦合过于紧密。\n- 考虑更粗粒度的测试：有时，稍微高层级的集成测试结合单元测试提供更好的价值。\n\
    \n## 3. “虚假准确性”陷阱\n\n过度 Mock 的测试即使在真实系统由于集成问题而失败时也可能通过。\n\n- 平衡是关键：单元测试、集成测试甚至端到端测试的结合是一种健康的策略。\n\
    - 监控：将测试与真实世界的监控相结合，以捕捉漏掉测试网的问题。\n\n### 示例：过度 Mock 一个 OrderService\n\n```csharp\n\
    // 坏的范例！\nmockRepo.Setup(r => r.GetCustomer(order.CustomerId)).Returns(customer);\n\
    mockInventory.Setup(i => i.IsInStock(order.Items)).Returns(true);\nmockRepo.Setup(r\
    \ => r.Save(order));\n// … 更多关于网关、通知等的设置\n// 测试变得几乎无法理解，并与实现深度绑定\n```\n\n"
- fmt: "\n# TDD Rhythm\nTest-Driven Development works best when writing tests is a\
    \ seamless part of the development flow.\n\n## 2. When Other Roles Get Involved\n\
    \n- **Testers/QA Specialists**:\n    - Bring a dedicated focus on testing edge\
    \ cases and breaking things creatively.\n    - Can contribute broader integration\
    \ tests.\n- **DevOps Collaboration**: In environments with strong `CI/CD`, there’s\
    \ often a shared effort in maintaining testing infrastructure and pipelines.\n\
    - **Special Expertise**: Highly complex domains might necessitate bringing in\
    \ developers with very specific testing skills for particularly intricate parts\
    \ of the system.\n\n## 3. Evolving with Your Team\n\n- **Small Teams**: Often,\
    \ developers wear most of the hats, including testing.\n- **Growing Teams**: As\
    \ teams scale, specialized testers start to play a more significant role.\n- **Project\
    \ Maturity**: A new, experimental project might be developer-driven, whereas a\
    \ safety-critical system might warrant a dedicated QA team.\n- **Continuous Adaptation**:\
    \ Regularly assess what works best for your team’s dynamics and project needs.\n\
    \n## 4. Best Practices, Regardless of Role\n\n- **Code Review for Tests**: Just\
    \ like production code, tests benefit from review by peers.\n- **Shared Standards**:\
    \ Coding styles, naming conventions, etc., for tests keep the project cohesive.\n\
    - **Focus on the ‘Why’ Not Just the ‘How’**: Ensure everyone understands the testing\
    \ philosophy to avoid rote, low-value tests.\n- **Skill Development**: Provide\
    \ testing training across the team, even if certain roles specialize more in it.\n\
    \n### Additional Resources\n- Martin Fowler on “Who Writes Tests”: [https://martinfowler.com/articles/whoTests.html](https://martinfowler.com/articles/whoTests.html)\n\
    \n## 5. Anti-Patterns to Avoid\n\n- **Throwing Code ‘Over the Wall’ to QA**: Creates\
    \ silos, not collaboration.\n- **Seeing Testing as ‘Less Important’**: Testing\
    \ is a core development skill.\n- **No Room for Experimentation**: Allow processes\
    \ to evolve as your team does.\n\n## Conclusion\nThere’s no single, perfect answer.\
    \ The best approach fosters a culture where testing is valued, well-understood,\
    \ and a collaborative effort tailored to your team’s specific structure and your\
    \ project’s nature.\n\n## Conclusion\nThroughout this book, we’ve embarked on\
    \ an empowering journey. You’ve transformed from someone tentatively approaching\
    \ automated testing to a developer armed with the knowledge and tools to write\
    \ robust, maintainable `C#` code.\n\n### Key Takeaways\n- **Testing as a Core\
    \ Skill**: It’s not an afterthought; it’s interwoven into how you design and build\
    \ software.\n- **Confidence in Change**: Refactoring, extending, and updating\
    \ code without fear, knowing your tests form a safety net.\n- **Cleaner Designs**:\
    \ The need for testability naturally encourages loose coupling, interfaces, and\
    \ modularity.\n- **Beyond Just Unit Tests**: Understanding the strategic role\
    \ of integration tests and the larger testing landscape.\n- **The Joy of the ‘Green\
    \ Tick’**: The satisfaction of well-crafted tests passing, signaling that your\
    \ system is behaving as intended.\n\n## The Adventure Continues\nThis book is\
    \ not the destination, but a springboard. Here’s how to keep growing:\n- **Practice,\
    \ Practice, Practice**: Build testing muscle memory. Start with small projects,\
    \ then apply it at work.\n- **Community**: Engage with online forums and local\
    \ meetups. Learn from others, and share your own knowledge.\n- **Never Stop Questioning**:\
    \ Are there better ways to test? Can this code be made more test-friendly?\n-\
    \ **Expand Your Toolbox**: Explore other testing techniques like property-based\
    \ testing or mutation testing as you become more advanced.\n\n## A Call to Action\n\
    Embrace testing as your ally. Witness how it elevates your code quality, your\
    \ confidence, and ultimately the value you deliver as a software developer. Be\
    \ the champion of testing within your team, spreading the knowledge and reaping\
    \ the collective rewards.\n\n## You’ve Got This\nThe journey may have had its\
    \ challenges, but you’ve leveled up. The world of reliable, well-tested `C#` applications\
    \ now lies open before you. Go forth and code with the unwavering confidence that\
    \ comes from a solid suite of tests!\n"
  raw: '● TDD Rhythm: Test-Driven Development works best when writing tests is a seamless
    part of the development flow.


    2\. When Other Roles Get Involved


    ●     Testers/QA Specialists:


    ○ Bring a dedicated focus on testing edge cases and breaking things creatively.


    ○     Can contribute broader integration tests.


    ● DevOps Collaboration: In environments with strong CI/CD, there’s often a shared
    effort in maintaining testing infrastructure and pipelines.


    ● Special Expertise: Highly complex domains might necessitate bringing in developers
    with very specific testing skills for particularly intricate parts of the system.


    3\. Evolving with Your Team


    ● Small Teams: Often, developers wear most of the hats, including testing.


    ● Growing Teams: As teams scale, specialized testers start to play a more significant
    role.


    ● Project Maturity: A new, experimental project might be developer-driven, whereas
    a safety-critical system might warrant a dedicated QA team.


    ● Continuous Adaptation: Regularly assess what works best for your team’s dynamics
    and project needs.


    4\. Best Practices, Regardless of Role


    ● Code Review for Tests: Just like production code, tests benefit from review
    by peers.


    ● Shared Standards: Coding styles, naming conventions, etc., for tests keep the
    project cohesive.


    ● Focus on the ‘Why’ Not Just the ‘How’: Ensure everyone understands the testing
    philosophy to avoid rote, low-value tests.


    ● Skill Development: Provide testing training across the team, even if certain
    roles specialize more in it.


    Additional Resources


    ●     Martin Fowler on “Who Writes Tests”:  [https://martinfowler.com/articles/whoTests.html](https://martinfowler.com/articles/whoTests.html)


    5\. Anti-Patterns to Avoid


    ● Throwing Code ‘Over the Wall’ to QA: Creates silos, not collaboration.


    ● Seeing Testing as ‘Less Important’: Testing is a core development skill.


    ● No Room for Experimentation: Allow processes to evolve as your team does.


    Conclusion


    There’s no single, perfect answer. The best approach fosters a culture where testing
    is valued, well-understood, and a collaborative effort tailored to your team’s
    specific structure and your project’s nature.


    Conclusion


    Throughout this book, we’ve embarked on an empowering journey. You’ve transformed
    from someone tentatively approaching automated testing to a developer armed with
    the knowledge and tools to write robust, maintainable C# code.


    Key Takeaways


    ● Testing as a Core Skill: It’s not an afterthought; it’s interwoven into how
    you design and build software.


    ● Confidence in Change: Refactoring, extending, and updating code without fear,
    knowing your tests form a safety net.


    ● Cleaner Designs: The need for testability naturally encourages loose coupling,
    interfaces, and modularity.


    ● Beyond Just Unit Tests: Understanding the strategic role of integration tests
    and the larger testing landscape.


    ● The Joy of the ‘Green Tick’: The satisfaction of well-crafted tests passing,
    signaling that your system is behaving as intended.


    The Adventure Continues


    This book is not the destination, but a springboard. Here’s how to keep growing:


    ● Practice, Practice, Practice: Build testing muscle memory. Start with small
    projects, then apply it at work.


    ● Community: Engage with online forums and local meetups. Learn from others, and
    share your own knowledge.


    ● Never Stop Questioning: Are there better ways to test? Can this code be made
    more test-friendly?


    ● Expand Your Toolbox: Explore other testing techniques like property-based testing
    or mutation testing as you become more advanced.


    A Call to Action


    Embrace testing as your ally. Witness how it elevates your code quality, your
    confidence, and ultimately the value you deliver as a software developer. Be the
    champion of testing within your team, spreading the knowledge and reaping the
    collective rewards.


    You’ve Got This


    The journey may have had its challenges, but you’ve leveled up. The world of reliable,
    well-tested C# applications now lies open before you. Go forth and code with the
    unwavering confidence that comes from a solid suite of tests!


    * * *'
