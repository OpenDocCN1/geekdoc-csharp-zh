  trans: "\n\n```csharp\nusing YourProjectNamespace; // 为 Calculator 类的命名空间\n```\n\
    \n### 步骤 4：编写你的第一个测试方法\n\n```csharp\n[TestFixture]  // 标记此类包含测试\n\npublic class\
    \ CalculatorTests\n{\n    [Test]  // 标记此方法为测试方法\n    public void Add_PositiveNumbers_ReturnsCorrectSum()\n\
    \    {\n        // Arrange（准备）\n        var calculator = new Calculator();\n \
    \       int a = 5;\n        int b = 8;\n        int expectedResult = 13;\n   \
    \     // Act（执行）\n        int actualResult = calculator.Add(a, b);\n        //\
    \ Assert（断言）\n        Assert.AreEqual(expectedResult, actualResult);\n    }\n\
    }\n```\n\n### 步骤 5：运行你的测试！\n\n使用 IDE 内置的测试运行器（例如 `Rider` 或 `Visual Studio` 的 `Test\
    \ Explorer`）来定位并运行测试。你应该能看到它通过了！\n\n#### 深度解析\n\n● **测试结构**：NUnit 测试在标记为 `[TestFixture]`\
    \ 的类中，通过带有 `[Test]` 属性的方法定义。\n\n● **AAA 模式**：（Arrange-Act-Assert）：测试的常用结构；你设置测试数据、执行待测试代码，并断言预期结果。\n\
    \n● **断言**：NUnit 提供了各种 `Assert` 方法（如 `AreEqual`）来验证结果。\n\n#### 额外资源\n\n● **NUnit\
    \ 文档**：[`docs.nunit.org/`](https://docs.nunit.org/)\n\n恭喜！你编写了第一个 C# 单元测试。\n\n\
    #### 下一步工作\n\n这只是开始！在下一章节中，我们将深入探讨如何扩展测试，并确保它们既有效又可维护。\n\n# 深入研究单元测试组合：高级技术\n\n\
    在上一章节中，你已经迈了编写简单单元测试的第一步。现在，让我们进一步深入，探索让你的测试更具表现力、更健壮且能够处理复杂性的技术。\n\n#### 1. 测试多个场景\n\
    \n单个测试方法通常需要验证不同的条件。让我们扩展之前的 `Calculator` 示例：\n\n```csharp\n[Test]\npublic void\
    \ Add_HandlesNegativeNumbers_ReturnsCorrectSum()\n{\n    var calculator = new\
    \ Calculator();\n    // 场景 1\n    Assert.AreEqual(-5, calculator.Add(-3, -2));\n\
    \    // 场景 2\n    Assert.AreEqual(2, calculator.Add(5, -3));\n}\n```\n\n与其使用单独的测试方法，我们使用多个\
    \ `Assert` 语句来处理各种场景。\n\n#### 2. 用于数据驱动测试的参数化测试\n\n使用 NUnit 的参数化测试扩展上述概念：\n\n\
    ```csharp\n[Test]\npublic void Add_HandlesVariousInputs_ReturnsCorrectSum(\n \
    \   [Values(2, 5, 8)] int a,\n    [Values(-4, 0, 3)] int b,\n    [Values(-2, 5,\
    \ 11)] int expectedResult)\n{\n    var calculator = new Calculator();\n    Assert.AreEqual(expectedResult,\
    \ calculator.Add(a, b));\n}\n```\n\nNUnit 将多次运行测试，每次使用所提供参数的组合！\n\n#### 3. 测试驱动开发\
    \ (TDD) 的艺术\n\n虽然这不严格来说是一种组合技术，但让我们引入 TDD：\n\n● **Red（红色）**：首先，为尚未的功能编写一个会失败的测试。\n\
    \n● **Green（绿色）**：编写最小的实现以使测试通过。\n\n● **Refactor（重构）**：在确保测试仍然通过的同时，改进代码设计。\n\n\
    TDD 以测试为基础引导开发。我们稍后将用整章来介绍它！\n\n#### 4. 测试边界情况和错误条件\n\n不要只测试“快乐路径”。良好的测试会探索边界：\n\
    \n```csharp\n[Test]\npublic void Add_LargeNumbers_ThrowsOverflowException()\n\
    {\n    var calculator = new Calculator();\n    Assert.Throws<OverflowException>(()\
    \ => calculator.Add(int.MaxValue, 1));\n}\n```\n\n#### 5. 将测试命名作为文档\n\n描述性的名称让测试自解释其义：\n\
    \n```csharp\n[Test]\npublic void Divide_DenominatorZero_ThrowsDivideByZeroException()\n\
    { ...  }\n```\n\n#### 6. 使用 Setup/Teardown 组织\n\n对于多个测试中重复的设置和清理步骤，请在测试类的方法上使用\
    \ NUnit 的 `[SetUp]` 和 `[TearDown]` 属性。注意：这些可能会让测试变得复杂。\n\n#### 额外资源\n\n（本节未提供额外资源）\n\
    \n"
- fmt: "\n Preventing Rot: Untouched, code tends to degrade over time. Refactoring\
    \ helps fight complexity “rot” and technical debt.\n- Developer Happiness: Clean,\
    \ well-designed code is simply more enjoyable to work with!\n\n## Tests: Your\
    \ Refactoring Safety Net\n\nImagine refactoring without tests. Every change introduces\
    \ a nagging fear of accidentally breaking something. With a solid set of tests,\
    \ you get this amazing advantage:\n\n1. **Make Changes**: Restructure your code\
    \ as needed.\n2. **Run Tests**: Your test suite automatically runs.\n3. **Instant\
    \ Feedback**: If tests pass, you have high confidence your changes haven’t introduced\
    \ unexpected problems. If a test fails, it pinpoints exactly where you need to\
    \ focus.\n\n### Illustrative Example\n\nLet’s say you have a complex method `CalculateOrderTotal`\
    \ that’s become difficult to understand. With tests covering various `CalculateOrderTotal`\
    \ scenarios, you can:\n\n- Break down the method into smaller, more focused functions.\n\
    - Introduce clearer variable names.\n- Optimize the calculation logic.\n\n…all\
    \ while tests keep verifying it still gives the correct output!\n\n### Embracing\
    \ Change with Confidence\n\nRefactoring with a strong test suite in place transforms\
    \ your mindset. Instead of fearing change, you embrace it, confident that your\
    \ tests will quickly signal if you make a misstep.\n\n### Types of Refactoring\n\
    \nHere are common refactoring techniques where tests shine:\n\n- **Extract Method**:\
    \ Decouple a long method into smaller, well-named functions.\n- **Rename**: Improve\
    \ readability with more descriptive class, method, or variable names.\n- **Introduce\
    \ Design Patterns**: Apply established patterns (Observer, Factory, etc.) to enhance\
    \ structure and flexibility.\n\n### Additional Resources\n\n- Refactoring.Guru\
    \ (Catalog of Refactorings): [https://refactoring.guru/](https://refactoring.guru/)\n\
    - Martin Fowler: Refactoring [https://martinfowler.com/books/refactoring.html](https://martinfowler.com/books/refactoring.html)\
    \ (A classic book on refactoring)\n\n## Key Takeaway\n\nRefactoring and testing\
    \ form a powerful cycle. Tests give you the courage to refactor, and refactoring\
    \ often leads to simpler code that is easier to test. This promotes long-term\
    \ code health.\n\n## Up Next\n\nNow that you understand the importance of testing,\
    \ let’s dive into the specifics of writing excellent unit tests using the powerful\
    \ NUnit framework.\n\nLet’s get testing with NUnit!\n\n# Leveraging NUnit for\
    \ Efficient Testing in Visual Studio\n\nNUnit is a battle-tested unit testing\
    \ framework for C# and the .NET ecosystem. When paired with Visual Studio, you\
    \ get a seamless testing experience. Let’s explore how to use them in tandem.\n\
    \n## Prerequisites\n\n- Basic Visual Studio experience (creating projects, etc.)\n\
    - Understanding of unit testing concepts from previous chapters\n\n## 1. Installing\
    \ NUnit\n\nThe easiest way is using Visual Studio’s NuGet Package Manager:\n\n\
    1. Right-click on your test project -> “Manage NuGet Packages…”\n2. Search for\
    \ `NUnit` and install the `NUnit` package.\n3. Install the `NUnit3TestAdapter`\
    \ package as well. This enables Visual Studio to discover and run your tests.\n\
    \n## 2. Visual Studio’s Test Explorer\n\nYour primary interface for interacting\
    \ with NUnit tests is the Test Explorer window:\n\n- **Find it**: View -> Test\
    \ Explorer (or use the search bar in Visual Studio)\n- **Run Tests**: After installing\
    \ NUnit, build your project. Tests will appear in the Test Explorer. You can run\
    \ them individually or all at once.\n- **Results**: Test Explorer displays clear\
    \ results (pass/fail/skipped) along with any error output.\n\n## 3. Writing Your\
    \ First NUnit Test (Revisited)\n\nLet’s create a new test. Recall this structure\
    \ from a previous chapter:\n\n```csharp\nusing NUnit.Framework;\n\nnamespace CalculatorTests\n\
    {\n    [TestFixture]\n    public class CalculatorTests\n    {\n        [Test]\n\
    \        public void Add_PositiveNumbers_ReturnsCorrectSum()\n        {\n    \
    \        // ... (Arrange, Act, Assert as before)\n        }\n    }\n}\n```\n\n\
    **(Key Points)**\n\n- `NUnit.Framework`: Include the necessary namespace.\n- `TestFixture`:\
    \ Marks a class as containing tests.\n- `Test`: Marks individual test methods.\n\
    \n## 4. Running and Debugging Tests\n\n- **Run**: Click the ‘Run’ icons in the\
    \ Test Explorer.\n- **Debugging**: Set breakpoints inside your test methods just\
    \ like regular code. Step through to investigate test failures in detail.\n\n\
    ## 5. Test Organization\n\n- **Test Fixtures**: Use multiple `[TestFixture]` classes\
    \ to group tests logically (e.g., `AccountServiceTests`, `OrderRepositoryTests`).\n\
    - **Namespaces**: Use namespaces to further organize larger test projects.\n\n\
    ## 6. Additional NUnit Features (Just a Taste)\n\nWe’ll dive deeper later, but\
    \ here’s a preview of further capabilities:\n\n- **Parameterized Tests**: `[TestCase]`\
    \ attribute for data-driven testing.\n- **Setup/Teardown**: `[SetUp]` for common\
    \ test initialization, `[TearDown]` for cleanup.\n- **Assertions**: NUnit provides\
    \ a rich set of assertion methods (e.g., `AreEqual`, `Throws`, etc.)\n\n### Additional\
    \ Resources\n\n- NUnit Documentation: [https://docs.nunit.org/](https://docs.nunit.org/)\n\
    - Visual Studio Test Tools: [https://docs.microsoft.com/en-us/visualstudio/test/](https://docs.microsoft.com/en-us/visualstudio/test/)\n\
    \n## Power at Your Fingertips\n\nNUnit and Visual Studio combine to provide a\
    \ smooth and powerful testing workflow directly within your favorite IDE. As you\
    \ write more complex tests, you’ll increasingly value this integration.\n\n##\
    \ Next: Test-Driven Development\n\nNow that you’re set up with NUnit, let’s explore\
    \ a philosophy that can revolutionize how you write software: Test-Driven Development\
    \ (TDD)!\n\n# Embracing Test-Driven Development: Principles and Practices\n\n\
    Test-Driven Development (TDD) is more than just writing tests. It’s a philosophy\
    \ that flips the traditional development process, letting tests drive the way\
    \ you design and write your code. Let’s dive into its core principles and benefits.\n\
    \n## The TDD Cycle\n\nTDD revolves around a short, iterative cycle:\n\n1. **Red**:\
    \ Begin by writing a small test that fails (because the functionality doesn’t\
    \ exist yet).\n2. **Green**: Write the bare minimum production code to make the\
    \ test pass. Don’t worry about perfect design at this stage.\n3. **Refactor**:\
    \ With a passing test, now confidently restructure and improve your code design,\
    \ ensuring tests still pass.\n\n## Benefits of TDD\n\n- **Focus and Guidance**:\
    \ TDD keeps you focused on tiny units of functionality at a time, leading to incremental\
    \ progress.\n- **Early Feedback**: Failing tests quickly highlight if your implementation\
    \ is deviating from the desired behavior.\n- **Design Enforcer**: The ‘design\
    \ later’ step in the cycle encourages better design decisions, promoting testable,\
    \ maintainable code.\n- **Built-in Regression Safety Net**: As your codebase grows,\
    \ your TDD tests form an increasingly robust safety net against regressions.\n\
    \n## A Practical Example\n\nLet’s revisit our `Calculator` class:\n\n1. **Red**:\
    \ Write a test like `Add_PositiveNumbers_ReturnsCorrectSum()`. It expects the\
    \ result initially fails since `Add` doesn’t exist.\n2. **Green**: Create the\
    \ simplest `Add` method with hardcoded logic to make the test pass (e.g., just\
    \ returning a fixed sum for now).\n3. **Refactor**: Now, replace the hardcoded\
    \ logic with a proper calculation, ensuring the test (and any others you’ve since\
    \ added) still pass.\n\n## TDD Mindset Shift\n\nAdopting TDD requires practice\
    \ and a shift in mindset. Instead of jumping straight into coding, learn to think\
    \ “test first.” Here are some tips for this transition:\n\n- **Baby Steps**: Start\
    \ with very small units of behavior to test.\n- **Don’t Overthink**: In the ‘green’\
    \ phase, prioritize merely making the test pass, not writing the most elegant\
    \ solution.\n- **Trust the Process**: Initially, it might feel slower, but as\
    \ your test suite grows, you’ll gain speed and confidence.\n\n## Additional Resources\n\
    \n- Introduction to Test-Driven Development (TDD): [https://www.agilealliance.org/glossary/tdd/](https://www.agilealliance.org/glossary/tdd/)\n"
  raw: '● Preventing Rot: Untouched, code tends to degrade over time. Refactoring
    helps fight complexity “rot” and technical debt.


    ● Developer Happiness: Clean, well-designed code is simply more enjoyable to work
    with!


    Tests: Your Refactoring Safety Net


    Imagine refactoring without tests. Every change introduces a nagging fear of accidentally
    breaking something. With a solid set of tests, you get this amazing advantage:


    1.  Make Changes: Restructure your code as needed.


    2.  Run Tests: Your test suite automatically runs.


    3.  Instant Feedback: If tests pass, you have high confidence your changes haven’t
    introduced unexpected problems. If a test fails, it pinpoints exactly where you
    need to focus.


    Illustrative Example


    Let’s say you have a complex method  CalculateOrderTotal that’s become difficult
    to understand. With tests covering various  CalculateOrderTotal scenarios, you
    can:


    ●     Break down the method into smaller, more focused functions.


    ●     Introduce clearer variable names.


    ●     Optimize the calculation logic.


    …all while tests keep verifying it still gives the correct output!


    Embracing Change with Confidence


    Refactoring with a strong test suite in place transforms your mindset. Instead
    of fearing change, you embrace it, confident that your tests will quickly signal
    if you make a misstep.


    Types of Refactoring


    Here are common refactoring techniques where tests shine:


    ● Extract Method: Decouple a long method into smaller, well-named functions.


    ● Rename: Improve readability with more descriptive class, method, or variable
    names.


    ● Introduce Design Patterns: Apply established patterns (Observer, Factory, etc.)
    to enhance structure and flexibility.


    Additional Resources


    ●     Refactoring.Guru (Catalog of Refactorings):  [https://refactoring.guru/](https://refactoring.guru/)


    ●     Martin Fowler: Refactoring  [https://martinfowler.com/books/refactoring.html](https://martinfowler.com/books/refactoring.html)
    (A classic book on refactoring)


    Key Takeaway


    Refactoring and testing form a powerful cycle. Tests give you the courage to refactor,
    and refactoring often leads to simpler code that is easier to test. This promotes
    long-term code health.


    Up Next


    Now that you understand the importance of testing, let’s dive into the specifics
    of writing excellent unit tests using the powerful NUnit framework.


    Let’s get testing with NUnit!


    # Leveraging NUnit for Efficient Testing in Visual Studio


    NUnit is a battle-tested unit testing framework for C# and the .NET ecosystem.
    When paired with Visual Studio, you get a seamless testing experience. Let’s explore
    how to use them in tandem.


    Prerequisites


    ●     Basic Visual Studio experience (creating projects, etc.)


    ●     Understanding of unit testing concepts from previous chapters


    1\. Installing NUnit


    The easiest way is using Visual Studio’s NuGet Package Manager:


    1.  Right-click on your test project -> “Manage NuGet Packages…”


    2.  Search for ‘NUnit’ and install the NUnit package.


    3.  Install the ’NUnit3TestAdapter* package as well. This enables Visual Studio
    to discover and run your tests.


    2\. Visual Studio’s Test Explorer


    Your primary interface for interacting with NUnit tests is the Test Explorer window:


    ● Find it: View -> Test Explorer (or use the search bar in Visual Studio)


    ● Run Tests: After installing NUnit, build your project. Tests will appear in
    the Test Explorer. You can run them individually or all at once.


    ● Results: Test Explorer displays clear results (pass/fail/skipped) along with
    any error output.


    3\. Writing Your First NUnit Test (Revisited)


    Let’s create a new test. Recall this structure from a previous chapter:


    using NUnit.Framework;


    namespace CalculatorTests


     {


        [TestFixture]


        public  class  CalculatorTests


        {


            [Test]


            public  void  Add_PositiveNumbers_ReturnsCorrectSum()


            {


                // ... (Arrange, Act, Assert as before)


            }


        }


    }


    (Key Points)


    ●     NUnit.Framework: Include the necessary namespace.


    ●     *TestFixture`*: Marks a class as containing tests.


    ●     *Test`*: Marks individual test methods.


    4\. Running and Debugging Tests


    ●     Run: Click the ‘Run’ icons in the Test Explorer.


    ● Debugging: Set breakpoints inside your test methods just like regular code.
    Step through to investigate test failures in detail.


    5\. Test Organization


    ● Test Fixtures: Use multiple  [TestFixture] classes to group tests logically
    (e.g.,  AccountServiceTests,  OrderRepositoryTests).


    ●     Namespaces: Use namespaces to further organize larger test projects.


    6\. Additional NUnit Features (Just a Taste)


    We’ll dive deeper later, but here’s a preview of further capabilities:


    ●     Parameterized Tests: [TestCase] attribute for data-driven testing.


    ●     Setup/Teardown: [SetUp] for common test initialization,  [TearDown] for
    cleanup.


    ● Assertions: NUnit provides a rich set of assertion methods (e.g.,  AreEqual,  Throws,
    etc.)


    Additional Resources


    ●     NUnit Documentation:  [https://docs.nunit.org/](https://docs.nunit.org/)


    ●     Visual Studio Test Tools:  [https://docs.microsoft.com/en-us/visualstudio/test/](https://docs.microsoft.com/en-us/visualstudio/test/)


    Power at Your Fingertips


    NUnit and Visual Studio combine to provide a smooth and powerful testing workflow
    directly within your favorite IDE. As you write more complex tests, you’ll increasingly
    value this integration.


    Next: Test-Driven Development


    Now that you’re set up with NUnit, let’s explore a philosophy that can revolutionize
    how you write software: Test-Driven Development (TDD)!


    Embracing Test-Driven Development: Principles and Practices


    Test-Driven Development (TDD) is more than just writing tests. It’s a philosophy
    that flips the traditional development process, letting tests drive the way you
    design and write your code. Let’s dive into its core principles and benefits.


    The TDD Cycle


    TDD revolves around a short, iterative cycle:


    1.  Red: Begin by writing a small test that fails (because the functionality doesn’t
    exist yet).


    2.  Green: Write the bare minimum production code to make the test pass. Don’t
    worry about perfect design at this stage.


    3.  Refactor: With a passing test, now confidently restructure and improve your
    code design, ensuring tests still pass.


    Benefits of TDD


    ● Focus and Guidance: TDD keeps you focused on tiny units of functionality at
    a time, leading to incremental progress.


    ● Early Feedback: Failing tests quickly highlight if your implementation is deviating
    from the desired behavior.


    ● Design Enforcer: The ‘design later’ step in the cycle encourages better design
    decisions, promoting testable, maintainable code.


    ● Built-in Regression Safety Net: As your codebase grows, your TDD tests form
    an increasingly robust safety net against regressions.


    A Practical Example


    Let’s revisit our  Calculator class:


    1.  Red: Write a test like  Add_PositiveNumbers_ReturnsCorrectSum(). It expects
    the result but initially fails since  Add doesn’t exist.


    2.  Green: Create the simplest  Add method with hardcoded logic to make the test
    pass (e.g., just returning a fixed sum for now).


    3.  Refactor: Now, replace the hardcoded logic with a proper calculation, ensuring
    the test (and any others you’ve since added) still pass.


    TDD Mindset Shift


    Adopting TDD requires practice and a shift in mindset. Instead of jumping straight
    into coding, learn to think “test first.” Here are some tips for this transition:


    ● Baby Steps: Start with very small units of behavior to test.


    ● Don’t Overthink: In the ‘green’ phase, prioritize merely making the test pass,
    not writing the most elegant solution.


    ● Trust the Process: Initially, it might feel slower, but as your test suite grows,
    you’ll gain speed and confidence.


    Additional Resources


    ●     Introduction to Test-Driven Development (TDD):  [https://www.agilealliance.org/glossary/tdd/](https://www.agilealliance.org/glossary/tdd/)'
