  trans: "\n\n# TDD 节奏\n当编写测试成为开发流程中无缝衔的一部分时，测试驱动开发的效果最好。\n\n## 2. 当其他角色参与时\n\n- **测试人员/QA\
    \ 专家**：\n    - 专注于边缘用例测试，并以创造性的方式破坏系统。\n    - 可以贡献于更广泛的集成测试。\n- **DevOps 协作**：在具有强大\
    \ `CI/CD` 的环境中，通常在维护测试基础设施和流水线方面有共同努力。\n- **专业知识**：高度复杂的领域可能需要引入具有非常特定测试技能的开发者，处理系统中特别复杂的部分。\n\
    \n## 3. 随团队共同演进\n\n- **小型团队**：通常，开发者兼任大多数角色，包括测试。\n- **成长型团队**：随着团队规模的扩大，专门的测试人员开始发挥更重要的作用。\n\
    - **项目成熟度**：新的实验性项目可能由开发者驱动，而安全至关重要的系统可能需要专门的 QA 团队。\n- **持续适应**：定期评估哪种最适合你团队动态和项目需求的方案。\n\
    \n## 4. 无论何种角色，最佳实践\n\n- **测试代码审查**：就像生产代码一样，测试也受益于同行评审。\n- **共享标准**：测试的编码风格、命名规范等可以保持项目的凝聚力。\n\
    - **关注“为什么”而不仅仅是“如何做”**：确保每个人都理解测试哲学，以避免机械、低价值的测试。\n- **技能开发**：为整个团队提供测试培训，即使某些角色更专精于此。\n\
    \n### 额外资源\n- Martin Fowler 关于“谁来写测试”的文章：[`martinfowler.com/articles/whoTests.html`](https://martinfowler.com/articles/whoTests.html)\n\
    \n## 5. 需要避免的反模式\n\n- **将代码“扔过墙去”给 QA**：这制造了孤岛，而非协作。\n- **将测试视为“不重要”**：测试是一项核心开发技能。\n\
    - **不留实验空间**：允许流程随团队的发展而演进。\n\n## 结论\n没有单一、完美的答案。最好的方法是培养一种文化：重视测试、理解测试，并根据你团队的特定结构和项目性质量身定制协作。\n\
    \n## 结论\n在本书中，我们开启了一段赋能的旅程。你已经从一个尝试尝试自动化测试的人，转变为一个拥有知识和工具、能够编写健壮且可维护的 `C#` 代码的开发者。\n\
    \n### 核心收获\n- **测试作为核心技能**：它不是事后考虑的因素；它交织在你设计和构建软件的方式中。\n- **变化的信心**：无恐惧地重构、扩展和更新代码，因为知道测试形成了一个安全网。\n\
    - **更整洁的设计**：对可测试性的需求自然地鼓励松耦合、接口和模块化。\n- **不仅仅是单元测试**：理解集成测试的战略作用以及更宏大的测试蓝图。\n\
    - **“绿色勾选”的快乐**：精心设计的测试通过时的满足感，这标志着你的系统运行符合预期。\n\n## 冒险继续继续\n本书不是终点，而是跳板。以下是持续成长的方法：\n\
    - **练习、练习、再练习**：建立测试肌肉记忆。从小项目开始，然后应用到工作中。\n- **社区**：参与在线论坛和本地聚会。从他人那里学习，并分享自己的知识。\n\
    - **永不停提问**：是否有更好的测试方法？这段代码可以变得更易于测试吗？\n- **扩展你的工具箱**：随着水平的提高，探索其他测试技术，如基于属性的测试或变异测试。\n\
    \n## 行动号召\n拥抱测试这一盟友。见证它是如何提升你的代码质量、信心，并最终提升作为软件开发者交付的价值。成为你团队中的测试冠军者，传播知识并收获集体回报。\n\
    \n## 你可以的\n这段旅程可能充满挑战，但你已经升级了。可靠的经过良好测试的 `C#` 应用世界现在向你敞开。去吧，带着源自坚实测试套件的坚定信心去编写代码吧！\n\
