    Example: A User Permission Manager


    Imagine a class managing permissions using sets:


    public  class  PermissionManager


     {


        private  readonly  HashSet<string> _userPermissions;


        // ... methods like  AddPermission, RemovePermission, HasPermission etc.


    }


    Test Scenarios:


    ● AddPermission : Does a new permission get added only once, even if added multiple
    times?


    ●     RemovePermission: Can existing permissions be removed as expected?


    ●     HasPermission: Checks for correct true/false results with varying inputs.


    3\. Performance Considerations


    ● Large Collections: Design tests with sizable collections to spot performance
    bottlenecks in sorting, searching, or filtering operations.


    ● Algorithm Choice: The underlying data structure and algorithms used in your
    code will heavily influence performance. Understand those trade-offs.


    ● Profiling Tools: Consider using profiling tools to pinpoint specific slowdowns
    if they arise within your tests.


    4\. Immutability (If Applicable)


    If you’re working with immutable collections, your tests need to reflect that:


    ● Modification Verification: Assert that operations on an immutable collection
    produce a new collection rather than modifying the existing one.


    Additional Resources


    ● Documentation of C# collection types: (List, Dictionary, HashSet, etc.)  [https://docs.microsoft.com/en-us/dotnet/csharp/programming-guide/concepts/collections](https://docs.microsoft.com/en-us/dotnet/csharp/programming-guide/concepts/collections)


    Beyond the Surface


    Thorough collection testing means understanding the nuances of the specific collection
    types you use and potential performance concerns within your application’s context.


    Verifying Method Return Types: Best Practices


    While a cornerstone of basic unit testing is checking whether a method returns
    the expected value, let’s dive deeper into strategies for ensuring your return
    type assertions are accurate and robust.


    1\. Not Just About the ‘Happy Path’


    ● Data Types Matter: Don’t just check if a value is returned, ensure it’s the
    correct data type. Differentiate between a method returning a string “10” and
    the number 10.


    ● Complex Return Types: If a method returns a class or struct, verify the contents
    of the returned object and any nested properties.


    ● Nulls: Explicitly plan for scenarios where a method might return  null. Does
    your code handle this gracefully?


    2\. Precision in Assertions


    ● Floating-point Comparisons: Be aware of potential rounding errors. Use assertions
    that check for approximate equality within an acceptable tolerance.


    ● Collections: (building upon previous chapters): Utilize collection-specific
    assertions to check for matching size, contents, and order where relevant.


    ● Custom Types: Implement  Equals or  GetHashCode overrides on your custom classes,
    if necessary, to make comparisons in test assertions meaningful.


    Example: A Data Conversion Service


    Imagine a method:


    public  double  ConvertTemperature(int celsius)  {  ...  }


    Tests Could Cover:


    ●     Type: Assert.IsInstanceOf<double>(result).


    ● Accuracy: Ensure a few known Celsius to Fahrenheit conversions are correct.


    ● Unexpected Input: Validate behavior if non-numeric input is provided (exception,
    default value?)


    3\. Test Libraries Enhance Type Checks


    Consider libraries to augment your assertions:


    ● Fluent Assertions: Provides a readable way to assert object types:


    object result =  GetResult();


    result.Should().BeOfType<Invoice>();


    ●     Shouldly: Similar fluent-style type checking.


    4\. Edge Cases


    ● Enums: If a method returns an enum, check valid values and potentially invalid
    ones to ensure graceful handling.


    ● Consider Design: Should your methods signal errors through return values (e.g.,
    special result codes), or should they throw exceptions? Your tests need to align
    with this design choice.


    Additional Resources


    ●     NUnit’s IsInstanceOf Constraint:  [https://docs.nunit.org/articles/nunit/writing-tests/constraints/isinstanceof.html](https://docs.nunit.org/articles/nunit/writing-tests/constraints/isinstanceof.html)


    Beyond the Basics


    The complexity of your return types directly influences the complexity of your
    tests. For intricate custom types, this might even involve writing mini-test suites
    specifically for those types to guarantee correct behavior.


    Tackling Void Methods: Testing Strategies and Considerations


    Void methods, those lacking an explicit return value, present a unique challenge.
    They often produce side effects: modifying a state, sending a notification, or
    interacting with external systems. How do we prove they did what they were supposed
    to?


    1\. The Indirect Approach


    Since you cannot directly assert on a void method’s return value, you need to
    observe its impact on the system:


    ● State Changes: If a method modifies an object’s properties or fields, assert
    those changes after the method call.


    ● Collaborator Calls: Use mocking frameworks (which we’ll cover in-depth later)
    to verify that a void method invokes other components in your system with the
    expected parameters.


    ● External Interactions: If the method interacts with files, databases, or network
    resources, test for the presence of expected changes (file created, database record
    updated, etc.)


    2\. Think Like a Detective


    Testing void methods is about following the “breadcrumbs”:


    ●     What Traces Are Left?


    ○     Did the method update a property visible for inspection?


    ○     Does it raise events?


    ○     Are logs generated?


    ● Testable Seams: If direct inspection is difficult, consider refactoring to introduce
    points in your code that expose the state specifically for testing.


    Example: A File Writer


    Imagine a void method:


    public  void  WriteMessageToFile(string message,  string filename)


     {


       // File writing logic...


    }


    Tests Could:


    ● Check file existence: Assert that a file with the given name was created.


    ● Verify Content: Read the file to confirm the expected message was written.'
