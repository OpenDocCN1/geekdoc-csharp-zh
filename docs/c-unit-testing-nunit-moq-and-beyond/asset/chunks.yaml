    \ Your Code Under Test\n\n● Abstractions (Interfaces): Define interfaces for the\
    \ dependencies of your code. During testing, you can replace real implementations\
    \ with test doubles.\n\npublic  interface  IEmailService  {\n\n void  SendEmail(string\
    \ to,  string subject,  string body);\n\n }\n\n● Test Doubles: A generic term\
    \ for stand-ins used in place of real dependencies. The common types include:\n\
    \n○ Fakes: Working implementations but simplified (in-memory data store instead\
