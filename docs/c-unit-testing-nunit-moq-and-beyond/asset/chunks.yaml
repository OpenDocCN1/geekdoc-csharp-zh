  trans: "\n\n-   处理不可用的依赖：数据库可能未就绪，Web 服务可能宕机。Mock（模拟）并不关心这些。\n-   测试“异常”路径：强制你的\
    \ mock 抛出异常，并观察单元如何反应。\n-   性能：与真实的外部系统相比，使用预设数据的 Mock 对象响应速度极快。\n\n### 3. 使用\
    \ Moq 的基础示例（语法可能略有不同）\n\n```csharp\n// Arrange\nvar mockLogger = new Mock<ILogger>();\n\
    mockLogger.Setup(m => m.Log(It.IsAny<string>())); // 此测试我们不在乎输入\nvar service =\
    \ new CustomerService(mockLogger.Object);\n\n// Act\nservice.PlaceOrder(someOrder);\n\
    \n// Assert\nmockLogger.Verify(m => m.Log(It.Is<string>(s => s.StartsWith(\"Order\
    \ placed\"))), Times.Once());\n```\n\n### 4. 核心概念\n\n-   Mocks vs. Stubs vs. Fakes：之间存在细微区别，但我们通常使用“mock”作为一个通用术语。\n\
    -   Setup：预先准备 mock 的行为（如示例所示）。\n-   Verification：检查 mock 上的方法是否按预期被调用。\n\n###\
    \ 5. 何时该使用 Mock\n\n-   缓慢的依赖\n-   开发期间不可用的系统\n-   难以用真实依赖触发的错误情况\n-   隔离你正在测试的真实功能\n\
    \n### 额外资源\n\n-   Moq 文档：[`github.com/moq/moq4/wiki/Quickstart`](https://github.com/moq/moq4/wiki/Quickstart)\n\
    \n### 注意事项：不要过度使用\n\n-   可维护性非常重要：过度复杂的 mock 设置会导致测试变得脆弱。\n-   测试真实对象（有时如此）：在健康的测试策略中，带有真实依赖的集成测试也有其用武之地。\n\
    \n### 下节预告\n\n让我们进入实践阶段！我们将深入研究特定场景和 Moq 技术，为即使是棘手的依赖创建复杂的 mock。\n\n# 使用 Moq 构建\
    \ Mock 对象：高级技巧，部分一\n\n我们已经掌握了 mocking 的基础。现在，让我们解锁更复杂的场景，让我们的 mock 更加高效。\n\n###\
    \ 1. 匹配参数\n\n-   超越“Any”：`It.Is<string>(s => s.Contains(\"error\"))` – 只匹配包含“error”的字符串。\n\
    -   精确匹配器：`It.IsRegex(\"[a-z]{10}\")` – 在需要时进行复杂匹配。\n-   自定义匹配器：对于非常定制的场景，你甚至可以创建自己的匹配逻辑。\n\
    \n### 2. Mock 多个返回值\n\n-   序列设置（Setup Sequences）：\n```csharp\nmockRepo.SetupSequence(m\
    \ => m.GetById(123))\n        .Returns(aCustomer)\n        .Returns((Customer)null);\n\
    ```\n-   随时间的变化：第一次调用返回客户，后续调用返回 null（模拟未找到对象）。\n\n### 3. Mock 属性\n\n-   Getters\
    \ & Setters：\n```csharp\nmockService.Setup(m => m.Status).Returns(\"OK\");\nmockService.SetupSet(m\
    \ => m.LastUpdated = DateTime.Now);\n```\n-   测试交互：Mock 属性对于设置测试值以及随后验证你的测试单元是否修改了这些属性非常有帮助。\n\
    \n### 4. Mock Void（空）方法\n\n-   回调（Callbacks）：\n```csharp\nint callCount = 0;\n\
    mockMailer.Setup(m => m.SendMail(It.IsAny<string>(), It.IsAny<string>()))\n  \
    \        .Callback(() => callCount++);\n\n// ... 你的测试 ...\nAssert.AreEqual(2,\
    \ callCount); // 验证 void 方法被调用了两次\n```\n-   间接验证：Mock 框架通常不需要设置就能检测到 void 方法的调用，使其成为交互测试的理想选择（我们很快会进一步介绍！）。\n\
    \n### 5. 部分 Mock（Partial Mocks）\n\n-   部分 Mock，其他部分使用真实实现：当你有一个类，只有一个特定方法需要替换为\
    \ mock 版本时非常有用。\n-   谨慎使用：它们可能会让测试变得有些“魔术”，因为真实代码会被静默执行。考虑重构被测试类是否是更好的选择。\n\n\
    #### 示例：Mock 文件 I/O 依赖\n\n```csharp\nvar mockFileSystem = new Mock<IFileSystem>();\n\
    mockFileSystem.Setup(fs => fs.FileExists(It.IsAny<string>())).Returns(true);\n\
    mockFileSystem.Setup(fs => fs.ReadAllText(\"data.txt\")).Returns(\"test content\"\
    );\nvar fileProcessor = new FileProcessor(mockFileSystem.Object);\n```\n\n###\
    \ 额外资源\n\n-   Moq “速查表”：[`github.com/Moq/moq4/wiki/Quickstart#cheat-sheet`](https://github.com/Moq/moq4/wiki/Quickstart#cheat-sheet)\n\
    \n### 权衡\n\n-   复杂度 vs. 可读性：复杂的 mock 可能会变得难以理解。在灵活性和清晰之间寻求平衡。\n\n### 下节预告\n\n\
    在第二部分中，我们将处理从 mock 触发事件、测试类之间如何交互，以及避免 mocking 陷阱的策略。\n\n# 使用 Moq 构建 Mock 对象：高级技巧，部分二\n\
    \n### 1. 从 Mock 触发事件\n\n-   重要性：测试单元如何对事件做出反应。\n```csharp\nvar mockMailer = new\
    \ Mock<IMailer>();\nmockMailer.Raise(m => m.Sent, new EventArgs(\"test\"));\n\
    var service = new NotificationService(mockMailer.Object);\n```\n\n### 2. Mock\
    \ 输出参数（Out-Parameters）\n\n-   场景：当方法使用 `out` 参数时。\n```csharp\nmockRepo.Setup(m\
    \ => m.TryById(It.IsAny<int>(), out customer))\n        .Returns(true);\n```\n\
    \n### 3. 按顺序验证调用\n\n-   顺序很重要：特别是当单元多次与 mock 交互时。\n```csharp\nvar sequence = new\
    \ MockSequence();\nmockMock.InSequence(sequence).Setup(m => m.Step1());\nmockMock.InSequence(sequence).Setup(m\
    \ => m.Step2());\n```\n\n### 4. 状态测试 vs 交互测试\n\n-   状态测试：确保方法的输出和副作用符合预期。\n- \
    \  交互测试：验证测试单元是否与其依赖正确协作。\n\n#### 示例：测试复杂交互\n\n假设有一个与支付网关和库存系统交互的 `OrderProcessor`：\n\
    \n```csharp\nvar mockPaymentGateway = new Mock<IPaymentGateway>();\nvar mockInventoryService\
    \ = new Mock<IInventoryService>();\nvar orderProcessor = new OrderProcessor(mockPaymentGateway.Object,\
    \ mockInventoryService.Object);\n\norderProcessor.ProcessOrder(order);\n\nmockPaymentGateway.Verify(x\
    \ => x.ProcessPayment(order), Times.Once);\nmockInventoryService.Verify(x => x.ReduceStock(order.Items),\
    \ Times.Once);\n```\n\n### 5. 当 Mock 变得困难时\n\n-   过度复杂的 Mock：这是代码可能需要重构的信号。\n\
    -   工具限制：极其复杂的 mocking 可能可行，但测试本身会变得脆弱。\n-   退后一步：考虑在某些情况下，除了单元测试外，是否还需要更粗粒度的集成测试。\n\
    \n"
- fmt: "\n# You care about the values flowing through the system\n\n- Interaction-based:\n\
    \    - Behavior with external collaborators is essential\n    - Ensuring the unit\
    \ under test “orchestrates” its dependencies correctly.\n\n## 4. The Dangers of\
    \ Over-Emphasis\n\n- Excess State-based: Brittle tests, as they get attached to\
    \ the specific implementation details of the method.\n- Excess Interaction-based:\
    \ Can lead to micro-managing your code, making it resistant to refactoring even\
    \ when the external behavior remains consistent.\n\n### Example: Order Processing\
    \ Revisited\n\n- State-based: Does `ProcessOrder` correctly set the `status` property\
    \ on the `Order` object?\n- Interaction-based: Does `ProcessOrder` call the payment\
    \ gateway and then update inventory? Was the correct order data passed to both?\n\
    \n### Additional Resources\n\n- Martin Fowler on “Mocks Aren’t Stubs”: [https://martinfowler.com/articles/mocksArentStubs.html](https://martinfowler.com/articles/mocksArentStubs.html)\
    \ (Delves deeper into the philosophical distinctions)\n\n## 5. The Wisdom of Hybrid\
    \ Tests\n\nMost real-world unit tests employ a mix of both techniques. The art\
    \ is in striking the right balance:\n\n- Start with the Outcome: What’s the core\
    \ thing your unit is supposed to do? This often suggests if state-based is your\
    \ starting point.\n- Collaborator Workflow: Are there crucial interactions that\
    \ must happen in a specific way? Layer on interaction testing.\n\n### Up Next:\n\
    \nLet’s see how testing object interactions can get more complex, and strategies\
    \ for dealing with intricate scenarios.\n\n# Testing Object Interaction: Strategies\
    \ and Examples\n\nWhen units don’t exist in isolation, we need to verify they\
    \ communicate correctly. Mocking frameworks shine in this domain.\n\n## 1. The\
    \ Essence of Interaction Testing\n\n- Shift of Perspective: From what a unit returns\
    \ to how it uses its dependencies.\n- Why It Matters: Incorrect interactions are\
    \ a common source of bugs, even when units individually seem to work.\n\n## 2.\
    \ Key Strategies\n\n- Verifying Calls: Did your unit call the ‘right’ method on\
    \ a dependent object? With the correct arguments?\n\n```c\nmockPaymentService.Verify(m\
    \ => m.Charge(order, customer.CreditCard), Times.Once);\n```\n\n- Sequences (When\
    \ Order Matters):\n\n```csharp\n// Example - Ensure inventory check happens BEFORE\
    \ processing payment\nvar mockSequence = new Sequence();\nmockInventory.InSequence(mockSequence).Setup(x\
    \ => x.IsInStock(order));\nmockPaymentGateway.InSequence(mockSequence).Setup(x\
    \ => x.Charge(order));\n```\n\n- Indirect Observation: Sometimes you don’t mock\
    \ a direct collaborator. Instead, you test if some downstream result occurred:\n\
    \    - Did a database update happen after a call chain?\n    - Did a message get\
    \ placed on a queue for asynchronous processing?\n\n## 3. Example Scenarios\n\n\
    - Web Controller: Ensure a controller handling a form submission interacts correctly\
    \ with a service or repository layer to save data.\n- Service with Multiple Dependencies:\
    \ Verify an `OrderService` uses `InventoryManager` to validate stock, a `PaymentProcessor`\
    \ to charge, and then a `NotificationService` to send confirmation emails.\n-\
    \ Workflows: Test a process comprised of multiple steps, ensuring objects pass\
    \ data along and trigger the next stage correctly.\n\n## 4. Considerations\n\n\
    - Level of Detail: How deep do you go? Mocking every interaction leads to brittle,\
    \ overly-specific tests. Focus on the most critical points of collaboration.\n\
    - Partial Mocks: Can be useful for hybrid scenarios where you want a mix of real\
    \ and mocked behavior on a single object.\n- Test Intent: What’s the purpose of\
    \ the interaction you’re verifying? Keep this clear in your test names.\n\n###\
    \ Example: Order Processing Workflow\n\n```csharp\n[Test]\npublic void ProcessOrder_ValidatesStock_ChargesCustomer_SendsEmail()\n\
    {\n    // Setup mocks, potentially with state-based setups for return values\n\
    \    // Act\n    orderService.Process(order);\n    // Assert interactions\n  \
    \  mockInventory.Verify(i => i.ReduceStock(order.Items), Times.Once);\n    mockPaymentGateway.Verify(p\
    \ => p.Charge(order.Total), Times.Once);\n    mockMailer.Verify(m => m.SendOrderConfirmation(order),\
    \ Times.Once);\n}\n```\n\n### Up Next\n\nMocking can be a superpower but using\
    \ it unwisely leads to test headaches. Let’s learn how to recognize the pitfalls\
    \ of mock abuse and best practices for keeping your tests healthy.\n\n# Identifying\
    \ and Avoiding Mock Abuse: Best Practices\n\nMocking is a potent tool but must\
    \ be wielded with care. Otherwise, you end up with tests that are brittle, obscure\
    \ the intent, and might even give you a false sense of security.\n\n## 1. Telltale\
    \ Signs of Mock Abuse\n\n- Tests Too Tightly Coupled to Implementation: If minor\
    \ code changes break many tests, you’re likely mocking excessively.\n- Tests Specifying\
    \ ‘How’ instead of ‘What’: Overly elaborate sequences, verifying low-level interactions\
    \ – your tests shouldn’t mirror your production code line-by-line.\n- Difficulty\
    \ Setting Up Mocks: Complex chains of setup calls indicate your real code might\
    \ have testability problems.\n- TDD Becomes Impossible: If you struggle to write\
    \ the test before the code due to mocks, it’s a red flag.\n- Tests Lose Readability:\
    \ Tests littered with obscure mock setups and verifications are hard to understand\
    \ and maintain.\n\n## 2. Strategies for Prevention\n\n- Mock Roles, Not Implementations:\
    \ Focus on the contract (interface) of the dependency, not its internal details.\n\
    - Test Behavior, Not Calls: Start with state-based testing. Isolate interaction\
    \ testing to the most critical interactions.\n- Don’t Mock What You Don’t Own:\
    \ Mocking third-party libraries can be necessary, but very sparingly. Prefer writing\
    \ a thin wrapper with an interface you control for testing purposes.\n- Refactor\
    \ for Testability: If mocking feels painful, it’s usually a sign that your code\
    \ is too tightly coupled.\n- Consider Coarser-grained Tests: Sometimes a slightly\
    \ higher-level integration test, in conjunction with unit tests, provides better\
    \ value.\n\n## 3. The ‘Spurious Accuracy’ Trap\n\nOverly mocked tests might pass\
    \ even when the real system would fail due to integration issues.\n\n- Balance\
    \ is Key: A mix of unit, integration, and even end-to-end tests is a healthy strategy.\n\
    - Monitoring: Combine testing with real-world monitoring to catch issues that\
    \ slip through your test net.\n\n### Example: Over-Mocking an OrderService\n\n\
    ```csharp\n// Bad example!\nmockRepo.Setup(r => r.GetCustomer(order.CustomerId)).Returns(customer);\n\
    mockInventory.Setup(i => i.IsInStock(order.Items)).Returns(true);\nmockRepo.Setup(r\
    \ => r.Save(order));\n// … more setup for payment gateway, notifications, etc.\n\
    // Test becomes nearly impossible to understand and heavily tied to the implementation\n\
    ```\n"
