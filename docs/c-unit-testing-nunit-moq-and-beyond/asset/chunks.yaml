  trans: "\n\n- JetBrains Rider 单元测试文档：[`www.jetbrains.com/help/rider/Getting_Started_with_Unit_Testing.html`](https://www.jetbrains.com/help/rider/Getting_Started_with_Unit_Testing.html)\n\
    - JetBrains 关于测试的博客：[`blog.jetbrains.com/dotnet/tag/testing/`](https://blog.jetbrains.com/dotnet/tag/testing/)\n\
    \n## 效率与洞察\n\nRider 不仅仅是运行你的测试，它还将单元测试转化为代码与其测试之间流动的对话。这种紧紧的集成帮助你更快地编写更好的测试，并能以手术级的精度修复问题。\n\
    \n## 下节内容\n\n让我们在 Rider 的实际指导下，对一个真实世界的类进行操作。下一章将提供如何在 Rider 中创建第一个单元测试的实战指南。\n\
    \n# 动手实践：在 Rider 中编写你的第一个单元测试\n\n让我们付诸行动，使用 Rider 编写第一个 C# 单元测试。为了保持一致性，我们将继续使用熟悉的\
    \ `Calculator` 示例。\n\n## 前提条件\n\n- 已安装 Rider\n- 熟悉 C# 语法\n\n## 第 1 ：创建项目\n\n1.\
    \ 新解决方案：在 Rider 中，选择“File” -> “New Solution”。\n2. 项目类型：\n    - 选择“Class Library\
    \ (.NET Framework)”或类似类型作为生产代码（`CalculatorProject` – 名称可根据需要调整）。\n    - 创建“Unit\
    \ Test Project (.NET Framework)”或类似类型用于测试（`CalculatorTests`）。\n3. 解决方案结构：确保两个项目都已添加到同一个解决方案中。\n\
    \n## 第 2 ：添加 Calculator 类\n\n在你的 `CalculatorProject` 中，创建一个 `Calculator.cs` 文件：\n\
    \n```csharp\npublic class Calculator\n{\n    public int Add(int a, int b)\n  \
    \  {\n        return a + b;\n    }\n}\n```\n\n## 第 3 ：安装 NUnit\n\n1. 右键点击你的测试项目\
    \ > “Manage NuGet Packages…”\n2. 浏览：搜索“NUnit”并安装该包。\n3. 同时安装：安装 `NUnit3TestAdapter`\
    \ 包（这将启用 Rider 内部测试发现功能）。\n\n## 第 4 ：创建你的第一个测试类\n\n在你的 `CalculatorTests` 项目中，创建一个\
    \ `CalculatorTests.cs` 文件：\n\n```csharp\nusing NUnit.Framework;\n\nnamespace CalculatorTests\n\
    {\n    [TestFixture]\n    public class CalculatorTests\n    {\n        [Test]\n\
    \        public void Add_PositiveNumbers_ReturnsCorrectSum()\n        {\n    \
    \        // Arrange\n            var calculator = new Calculator();\n        \
    \    // Act\n            int result = calculator.Add(5, 8);\n            // Assert\n\
    \            Assert.AreEqual(13, result);\n        }\n    }\n}\n```\n\n## 第 5：发现并运行你的测试\n\
    \n1. 构建：生成解决方案（Rider 通常会提示你这样做）。\n2. 测试管理器：Rider 应该会自动发现你的测试。你可能会发现一个特定的“Unit\
    \ Tests”窗口，类似于 Visual Studio 的 Test Explorer。\n3. 运行：在 Test Explorer 中右键点击 `Add_PositiveNumbers_ReturnsCorrectSum`\
    \ 测试（或整个测试件），并选择“Run”。\n\n## 第 6：成功（希望如此！）\n\n你应该看到测试通过，并显示出满意的绿色指示！\n\n## 故障排除\n\
    \n- 未找到测试：确保你已安装 `NUnit3TestAdapter` 并重新生成了项目。\n- 版本不正确：确保 Rider 使用你的 NUnit 版本支持的\
    \ .NET 框架。\n\n## 核心要点\n\n- 解决方案结构：测试位于独立的项目项目中。\n- NUnit 特性：`[TestFixture]` 和\
    \ `[Test]`\n- AAA 模式：Arrange（准备），Act（执行），Assert（断言）\n\n## 下一步骤\n\n- 为不同的 `Calculator`\
    \ 场景添加更多测试（负数、减法等）。\n- 尝试 Rider 的测试运行和调试功能。\n\n恭喜！你已经迈入了单元测试领域实实的一步。继续编写测试，你将会看到它们如何改变你的开发体验。\n\
    \n## 接下来\n\n我们将深入探讨一种被称为“黑盒”的测试方法。\n\n## 揭秘黑盒测试\n\n黑盒测试是一种强大的方法，我们关注输入和输出，而不了解其内部工作机制。\n\
    \n### 为什么是“黑盒”？\n\n- **抽象**：你不需要关心实现细节。\n- **灵活性**：如果实现发生变化，黑盒测试需要修改的可能性较低。\n\n\
    ## 黑盒测试的核心原则\n\n1. **关注接口而非实现**：围绕公开暴露的方法和属性设计测试。\n- **覆盖输入和输出**：\n    - 有效输入：预期行为。\n\
    \    - 无效输入：代码如何处理坏数据？\n    - 边界值：在极端情况下进行测试。\n\n### 示例：我们的 Calculator\n\n与其担心内部细节，不如关注以下场景：\n\
    - `Positive numbers`：应该得到预期的总和。\n- `Negative numbers`：应该得到预期的值。\n- `Zero`：应该得到预期的值。\n\
    \n### 黑盒测试中的技术\n\n- **等价划分**：将输入划分为不同的类。\n- **边界值分析**：对边缘输入进行严格测试。\n\n### 黑盒测试的优势\n\
    \n- **韧性强的测试**：与实现的耦合度较低。\n- **清晰的规范**：有助于定义预期行为。\n- **对非开发者友好**：不熟悉代码的人也可以做出贡献。\n\
    \n## 黑盒 vs 白盒\n\n黑盒测试与“白盒”测试互补，白盒测试要求了解实现细节。一个健康的测试策略通常会结合使用。\n\n## 额外资源\n\n-\
    \ 黑盒测试：[`www.guru99.com/black-box-testing.html`](https://www.guru99.com/black-box-testing.html)\n\
    - ISTQB 术语表：[`www.istqb.org/downloads/syllibus/glossary-of-terms/`](https://www.istqb.org/downloads/syllibus/glossary-of-terms/)\n\
    \n## 一种策略，而非全能解决方案\n\n单黑盒测试无法涵盖所有场景（例如复杂的内部逻辑路径）。请策略性地与其他技术结合使用。\n\n## 下节：管理测试设置与清理——确保测试的独立性\n\
    \n有时，代码单元需要协作工作以完成任务。下一章将重点关注管理必要的设置（Setup）和清理（Teardown），以确保测试处于已知且可靠的状态。\n\n\
    ### 共享状态的挑战\n\n隔离的测试才是可靠的测试。隔离的一个核心方面是确保每个测试从干净的开始开始，并且不会留下任何可能损坏后续测试的副作用。这就是设置和清理方法发挥作用。\n\
    \n### Setup：为行动做准备\n\nSetup 方法用于测试前的共同安排：\n\n- **实例化对象**：创建被测对象以及任何辅助对象。\n- **初始化变量**：将变量设置为已知值。\n\
    - **模拟依赖项**：配置 mock 对象（我们稍后会详细介绍模拟）。\n- **准备外部资源**：如果需要，设置文件、数据库记录等。\n\n"
- fmt: "\n# Teardown: Cleaning Up the Scene\n\nTeardown methods reverse actions performed\
    \ in setup, ensuring a clean environment:\n\n- Releasing Resources: Closing files,\
    \ connections, etc.\n- Deleting Temporary Data: Removing test records from a database.\n\
    - Resetting Mocks: Clearing mock object behavior.\n\n## NUnit: Setup and Teardown\
    \ Attributes\n\nNUnit provides attributes to designate your setup and teardown\
    \ methods:\n\n- `[SetUp]` Method runs before each test within a `[TestFixture]`.\n\
    - `[TearDown]` Method runs after each test.\n\n### Example: A (Slightly Contrived)\
    \ File Test\n\n```csharp\n[TestFixture]\npublic class FileProcessorTests\n{\n\
    \    private string _tempFilePath;\n\n    [SetUp]\n    public void Setup()\n \
    \   {\n        _tempFilePath = Path.GetTempFileName();\n    }\n\n    [TearDown]\n\
    \    public void TearDown()\n    {\n        File.Delete(_tempFilePath);\n    }\n\
    \n    [Test]\n    public void WriteToFile_CreatesFileIfItDoesntExist() {\n   \
    \     // Test logic here...\n    }\n}\n```\n\n## Additional Resources\n\n- NUnit\
    \ Documentation - SetUp and TearDown: [https://docs.nunit.org/articles/nunit/writing-tests/setup-and-teardown.html](https://docs.nunit.org/articles/nunit/writing-tests/setup-and-teardown.html)\n\
    \n## Beyond the Basics\n\n- `OneTimeSetUp/OneTimeTearDown`: Use `[OneTimeSetUp]`\
    \ for actions that should happen once before all tests in a fixture.\n- Hierarchical\
    \ Setup: Setups at higher levels (the class) run before those defined within individual\
    \ test methods.\n\n## Key Takeaway\n\nEffective use of setup and teardown is essential\
    \ for creating trustworthy, independent unit tests. By ensuring a clean testing\
    \ environment, you can catch bugs earlier and with more confidence.\n\n## Up Next\n\
    \nWriting the same test variations with slightly altered inputs over and over\
    \ again is tedious. Let’s explore parameterized tests, a powerful way to streamline\
    \ this process.\n\n# Unleashing the Power of Parameterized Tests\n\nParameterized\
    \ tests let you streamline your testing process by running a single test multiple\
    \ times with different sets of inputs and expected outputs. This reduces redundancy\
    \ and helps you cover diverse scenarios efficiently.\n\n## Why Parameterized Tests\
    \ Matter\n\n1. **Reduce Verbosity**: Instead of multiple near-identical test methods,\
    \ you have a single parameterized test. This keeps your test suite cleaner.\n\
    2. **Increased Coverage**: Easily test a broader range of inputs, including edge\
    \ cases and potential error scenarios, with a few lines of code.\n3. **Data-Driven**:\
    \ Your test logic becomes a template, and variations are driven by the data you\
    \ provide.\n\n## NUnit: The [TestCase] Attribute\n\nNUnit’s `[TestCase]` attribute\
    \ is the key to creating parameterized tests:\n\n```csharp\n[Test]\npublic void\
    \ Add_CalculatesCorrectSum([TestCase(5,2,7)] [TestCase(10, -3, 7)])\npublic void\
    \ Add(int a, int b, int expectedResult)\n{\n    var calculator = new Calculator();\n\
    \    Assert.AreEqual(expectedResult, calculator.Add(a, b));\n}\n```\n\n### Let’s\
    \ break it down:\n\n- `[TestCase]` attributes: Each `[TestCase]` defines a set\
    \ of input parameters (5, 2, 7 in the first case) and the expected result.\n-\
    \ Method Parameters: Your test method’s parameters align with the values you provide\
    \ in the `[TestCase]` attributes.\n\n### Test Runner Magic\n\nNUnit’s test runner\
    \ will execute the `Add_CalculatesCorrectSum` test twice, injecting the different\
    \ `TestCase` data each time. It’s like having multiple tests in one!\n\n## Sources\
    \ for Test Data\n\n- **Inline**: As in the example, provide values directly within\
    \ the `[TestCase]` attributes.\n- `[TestCaseSource]`: Reference a variable, property,\
    \ or method that returns an `IEnumerable` of test cases for more complex or dynamic\
    \ sets of data.\n- **Custom Attributes**: Create your own attributes to fetch\
    \ test data from external files (CSV, XML, etc.).\n\n## Additional Resources\n\
    \n- NUnit Documentation - Parameterized Tests: [https://docs.nunit.org/articles/nunit/writing-tests/attributes/testcase.html](https://docs.nunit.org/articles/nunit/writing-tests/attributes/testcase.html)\n\
    \n## Beyond the Basics\n\n- **Descriptive Arguments**: Use optional named arguments\
    \ within `[TestCase]` for better failing test reports (e.g., `[TestCase(5, 2,\
    \ 7, ExpectedResult = 7)]`).\n- **Combining with Setup/Teardown**: Parameterized\
    \ tests can use `[SetUp]` and `[TearDown]` for any pre/post-test actions just\
    \ like regular tests.\n\n## When to Use Parameterized Tests\n\n- A function’s\
    \ logic applies to various inputs, and the output varies based on that input.\n\
    - Testing with boundary values and edge cases.\n\n## Next Up\n\nSometimes, it’s\
    \ necessary to temporarily disable or exclude tests. Let’s explore strategies\
    \ for selectively ignoring and skipping tests.\n\n# Selective Testing: Strategies\
    \ for Ignoring and Skipping Tests\n\nSometimes you need to temporarily control\
    \ which tests execute within your test suite. This might be due to tests that\
    \ are under development, depend on unavailable external resources, or those marked\
    \ with specific conditions. Let’s explore how to manage this.\n\n## 1. Ignoring\
    \ Tests\n\nIgnored tests are completely excluded from your test run. NUnit offers\
    \ a few mechanisms:\n\n- `[Ignore]` Attribute: The simplest way. Apply `[Ignore]`\
    \ to a test method or an entire test fixture.\n\n```csharp\n[Ignore(\"Functionality\
    \ not yet implemented\")]\n[Test]\npublic void NewFeature_PlaceOrder_CalculatesCorrectTotal()\n\
    {\n    // ... test logic\n}\n```\n\n- **Reason (Optional)**: Include a string\
    \ reason for better reporting on ignored tests.\n- **Explicit Attribute (Rare)**:\
    \ When needed for advanced scenarios, use `[Explicit]` attribute. These tests\
    \ only run when explicitly selected.\n\n## 2. Skipping Tests (Conditional)\n\n\
    Skipped tests are recognized by the test runner but are not executed unless specific\
    \ conditions are met. NUnit provides ways to achieve this:\n\n- `Assume.That`:\
    \ For making assumptions about the environment. If the condition fails, the test\
    \ is skipped.\n\n```csharp\n[Test]\npublic void DatabaseWrite_WhenConnected_SavesData()\n\
    {\n    Assume.That(_database.IsConnected, \"Database must be connected\");\n \
    \   // ... test logic\n}\n```\n\n- `[TestCase]` with non-matching inputs: Parameterized\
    \ tests whose input fail to satisfy a condition within the test method can be\
    \ skipped.\n\n## When to Ignore vs. Skip\n\n- **Ignore**:\n    - Functionality\
    \ under development.\n    - Tests known to be broken and awaiting a fix.\n- **Skip**:\n\
    \    - Environment-dependent tests (e.g., when a database is down).\n    - Platform-specific\
    \ tests (e.g., skip tests not applicable to your OS).\n\n## Additional Resources\n\
    \n- NUnit Documentation - Ignoring Tests: [https://docs.nunit.org/articles/nunit/writing-tests/ignoring-tests.html](https://docs.nunit.org/articles/nunit/writing-tests/ignoring-tests.html)\n\
    - NUnit Documentation - Conditional Tests: [https://docs.nunit.org/articles/nunit/writing-tests/conditional-test-attributes.html](https://docs.nunit.org/articles/nunit/writing-tests/conditional-test-attributes.html)\n"
  raw: 'Teardown: Cleaning Up the Scene


    Teardown methods reverse actions performed in setup, ensuring a clean environment:


    ●     Releasing Resources: Closing files, connections, etc.


    ●     Deleting Temporary Data: Removing test records from a database.


    ●     Resetting Mocks: Clearing mock object behavior.


    NUnit: Setup and Teardown Attributes


    NUnit provides attributes to designate your setup and teardown methods:


    ●     [SetUp] Method runs before each test within a  [TestFixture].


    ●     [TearDown] Method runs after each test.


    Example: A (Slightly Contrived) File Test


    [TestFixture]


    public  class  FileProcessorTests


     {


        private  string _tempFilePath;


        [SetUp]


        public  void  Setup()


        {


    _tempFilePath = Path.GetTempFileName();


        }


        [TearDown]


        public  void  TearDown()


        {


            File.Delete(_tempFilePath);


        }


        [Test]


        public  void  WriteToFile_CreatesFileIfItDoesntExist()  {


            // Test logic here...


        }


    }


    Additional Resources


    ●     NUnit Documentation - SetUp and TearDown:  [https://docs.nunit.org/articles/nunit/writing-tests/setup-and-teardown.html](https://docs.nunit.org/articles/nunit/writing-tests/setup-and-teardown.html)


    Beyond the Basics


    ● OneTimeSetUp/OneTimeTearDown: Use  [OneTimeSetUp] for actions that should happen
    once before all tests in a fixture.


    ● Hierarchical Setup: Setups at higher levels (the class) run before those defined
    within individual test methods.


    Key Takeaway


    Effective use of setup and teardown is essential for creating trustworthy, independent
    unit tests. By ensuring a clean testing environment, you can catch bugs earlier
    and with more confidence.


    Up Next


    Writing the same test variations with slightly altered inputs over and over again
    is tedious. Let’s explore parameterized tests, a powerful way to streamline this
    process.


    # Unleashing the Power of Parameterized Tests


    Parameterized tests let you streamline your testing process by running a single
    test multiple times with different sets of inputs and expected outputs. This reduces
    redundancy and helps you cover diverse scenarios efficiently.


    Why Parameterized Tests Matter


    1.  Reduce Verbosity: Instead of multiple near-identical test methods, you have
    a single parameterized test. This keeps your test suite cleaner.


    2.  Increased Coverage: Easily test a broader range of inputs, including edge
    cases and potential error scenarios, with a few lines of code.


    3.  Data-Driven: Your test logic becomes a template, and variations are driven
    by the data you provide.


    NUnit: The  [TestCase] Attribute


    NUnit’s  [TestCase] attribute is the key to creating parameterized tests:


    [Test]


    public  void  Add_CalculatesCorrectSum([TestCase(5,2,7)]  [TestCase(10,  -3,  7)])


     public  void(int a,  int b,  int expectedResult)


    {


        var calculator =  new  Calculator();


        Assert.AreEqual(expectedResult, calculator.Add(a, b));


    }


    Let’s break it down:


    ● [TestCase] attributes: Each  [TestCase] defines a set of input parameters (5,
    2, 7 in the first case) and the expected result.


    ● Method Parameters: Your test method’s parameters align with the values you provide
    in the  [TestCase] attributes.


    Test Runner Magic


    NUnit’s test runner will execute the  Add_CalculatesCorrectSum test twice, injecting
    the different  TestCase data each time. It’s like having multiple tests in one!


    Sources for Test Data


    ● Inline: As in the example, provide values directly within the  [TestCase] attributes.


    ● [TestCaseSource]: Reference a variable, property, or method that returns an  IEnumerable
    of test cases for more complex or dynamic sets of data.


    ● Custom Attributes: Create your own attributes to fetch test data from external
    files (CSV, XML, etc.).


    Additional Resources


    ●     NUnit Documentation - Parameterized Tests  [https://docs.nunit.org/articles/nunit/writing-tests/attributes/testcase.html](https://docs.nunit.org/articles/nunit/writing-tests/attributes/testcase.html)


    Beyond the Basics


    ● Descriptive Arguments: Use optional named arguments within  [TestCase] for better
    failing test reports (e.g.,  [TestCase(5, 2, 7, ExpectedResult = 7)]).


    ● Combining with Setup/Teardown: Parameterized tests can use  [SetUp] and  [TearDown]
    for any pre/post-test actions just like regular tests.


    When to Use Parameterized Tests


    ● A function’s logic applies to various inputs, and the output varies based on
    that input.


    ●     Testing with boundary values and edge cases.


    Next Up


    Sometimes, it’s necessary to temporarily disable or exclude tests. Let’s explore
    strategies for selectively ignoring and skipping tests.


    Selective Testing: Strategies for Ignoring and Skipping Tests


    Sometimes you need to temporarily control which tests execute within your test
    suite. This might be due to tests that are under development, depend on unavailable
    external resources, or those marked with specific conditions. Let’s explore how
    to manage this.


    1\. Ignoring Tests


    Ignored tests are completely excluded from your test run. NUnit offers a few mechanisms:


    ● [Ignore] Attribute: The simplest way. Apply  [Ignore] to a test method or an
    entire test fixture.


    [Ignore("Functionality not yet implemented")]


    [Test]


    public  void  NewFeature_PlaceOrder_CalculatesCorrectTotal()


     {


        // ... test logic


    }


    ● Reason (Optional): Include a string reason for better reporting on ignored tests.


    ● Explicit Attribute (Rare): When needed for advanced scenarios, use the  [Explicit]
    attribute. These tests only run when explicitly selected.


    2\. Skipping Tests (Conditional)


    Skipped tests are recognized by the test runner but are not executed unless specific
    conditions are met. NUnit provides ways to achieve this:


    ● Assume.That: For making assumptions about the environment. If the condition
    fails, the test is skipped.


    [Test]


    public  void  DatabaseWrite_WhenConnected_SavesData()


     {


        Assume.That(_database.IsConnected,  "Database must be connected");


        // ... test logic


    }


    ● [TestCase] with non-matching inputs: Parameterized tests whose input parameters
    fail to satisfy a condition within the test method can be conditionally skipped.


    When to Ignore vs. Skip


    ●     Ignore:


    ○     Functionality under development.


    ○     Tests known to be broken and awaiting a fix.


    ●     Skip:


    ○ Environment-dependent tests (when a database is down, tests related to it may
    be skipped).


    ○ Platform-specific tests (e.g., skip tests not applicable to your current OS)


    Additional Resources


    ●     NUnit Documentation - Ignoring Tests:  [https://docs.nunit.org/articles/nunit/writing-tests/ignoring-tests.html](https://docs.nunit.org/articles/nunit/writing-tests/ignoring-tests.html)


    ●     NUnit Documentation - Conditional Tests  [https://docs.nunit.org/articles/nunit/writing-tests/conditional-test-attributes.html](https://docs.nunit.org/articles/nunit/writing-tests/conditional-test-attributes.html)


    Strategic Use


    Ignoring and skipping have valid uses, but remember these guidelines:


    ● Don’t Overuse: Excessive ignoring/skipping hides problems. Strive to keep the
    majority of your tests active.


    ● Review Regularly: Ignored/Skipped tests shouldn’t linger indefinitely. Address
    their underlying reasons and re-enable them as soon as possible.


    ● Reporting: Test reporting tools should clearly visualize ignored and skipped
    tests alongside successes and failures for a holistic view.


    Temporary Measures


    Treat ignoring and skipping tests as tools to manage a test suite in transition.
    The ultimate goal should be a suite where the vast majority of tests actively
    participate in guarding the quality of your code.


    Next Up


    Units of code rarely exist in true isolation. The next chapter will delve into
    strategies for creating trustworthy unit tests in the face of external dependencies.


    # Building Trustworthy Tests, Part 1: Handling Dependencies'
