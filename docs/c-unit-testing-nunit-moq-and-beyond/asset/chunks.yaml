  trans: "\n\n- **复杂度**：复杂的逻辑更容易出现错误；因此，需要更彻底的测试。\n- **关键性**：如果某个代码单元的失败会对你的应用程序产生严重后果，请优先进行严格的测试。\n\
    - **变更频率**：频繁修改的代码区域可能需要更丰富的测试集，以便更容易地发现回归问题。\n\n## 5. 演进的测试范围\n\n避免“写一次就完之了”的心态：\n\
    \n- **新功能**：随着应用程序的扩展，可能需要新的测试用来覆盖新增的功能。\n- **Bug 修复**：在修复 Bug 时，先编写一个能够重现该 Bug\
    \ 的测试，以确保修复补丁有效并防止其再次发生。\n- **重构**：随着代码结构的变化，请相应地调整你的测试。\n\n### 示例：回到计算器\n\n假设我们的\
    \ `Calculator` 现在有了一个更复杂的 `Divide` 方法：\n\n```csharp\npublic double Divide(double\
    \ a, double b) {\n    if (b == 0) {\n        throw new DivideByZeroException();\n\
    \    }\n    // 如果结果超出 double 的范围，则处理潜在的溢出\n    if (Math.Abs(a) == double.MaxValue\
    \ && Math.Abs(b) == 1.0) {\n        return a;\n    }\n    return a / b;\n}\n```\n\
    \n### 更多资源\n\n- **边界值分析**：[`en.wikipedia.org/wiki/Boundary-value_analysis`](https://en.wikipedia.org/wiki/Boundary-value_analysis)\n\
    - **等价类划分**：[`en.wikipedia.org/wiki/Equivalence_partitioning`](https://en.wikipedia.org/wiki/Equivalence_partitioning)\n\
    - **在确定测试场景时基于示例的思维**：[`www.agilealliance.org/resources/experience-reports/example-based-testing-an-introduction/`](https://www.agilealliance.org/resources/experience-reports/example-based-testing-an-introduction/)\n\
    \n## 寻找平衡点\n\n找到理想的测试范围是在彻底性和实用性之间持续不断的平衡。通过实践，你将更擅长定位那些对你的时间和精力提供最高投资回报的测试。\n\
    \n## 下一节\n\n清晰的测试结构和描述性的命名将极大提高测试的可读性。让我们在下一节中深入探讨有效的测试组织。\n\n## 结构化你的测试：命名与组织的艺术\n\
    \n结构良好且命名合理的测试对于可读性和可维护性至关重要。它们增强了测试作为系统“活文档”的价值。让我们深入这些关键方面。\n\n### 1. 测试类的组织\n\
    \n- **每个生产类对应一个测试类**：镜像生产代码的结构可以提高导航性。（例如，使用 `CalculatorTests` 来测试 `Calculator`\
    \ 类）\n- **使用嵌套类进行细粒度分组（可选）**：对于包含许多方法的类，可以嵌套测试类来组织代码——例如专门用于测试加法部分的 `CalculatorTests.AdditionTests`。\n\
    \n### 2. 测试方法的命名\n\n具有描述性的方法名像一个故事，告诉你在测试中正在验证什么。一种常见且有效的规范是：\n\n`MethodName_ScenarioUnderTest_ExpectedBehavior`\n\
    \n- **MethodName**：正在被测试的生产代码中的方法。\n- **ScenarioUnderTest**：特定的输入条件或设置。\n- **ExpectedBehavior**：预期的结果或输出。\n\
    \n**示例**：`Divide_PositiveNumbers_ReturnsCorrectQuotient`\n\n### 3. Arrange-Act-Assert\
    \ (AAA) 模式\n\n在每个测试方法内部，AAA 模式能够提升清晰度：\n\n- **Arrange（准备）**：设置测试的对象、数据和任何先置条件。\n\
    - **Act（执行）**：调用正在测试的实际方法或代码单元。\n- **Assert（断言）**：使用断言检查预期结果。\n\n### 4. 文件夹结构\n\
    \n在测试项目中镜像生产代码的项目结构。这有助于找到与特定组件相关的测试。\n\n### 5. 一致性至上\n\n选择一种风格并在整个测试套件中坚持下去。一致性让团队中的每个人都更容易理解测试代码。\n\
    \n### 使用我们的计算器进行示例\n\n```csharp\n[TestFixture]\npublic class CalculatorTests\n\
    {\n    [Test]\n    public void Add_PositiveNumbers_ReturnsCorrectSum()\n    {\n\
    \        // Arrange\n        var calculator = new Calculator();\n        int a\
    \ = 5, b = 7;\n        int expectedResult = 12;\n        // Act\n        int actualResult\
    \ = calculator.Add(a, b);\n        // Assert\n        Assert.AreEqual(expectedResult,\
    \ actualResult);\n    }\n    // 后续还有关于减法、乘法等的测试\n}\n```\n\n### 更多资源\n\n- **Roy\
    \ Osherove: The Art of Unit Testing: Naming Tests**：[`osherove.com/blog/2005/4/3/naming-standards-for-unit-tests.html`](https://osherove.com/blog/2005/4/3/naming-standards-for-unit-tests.html)\n\
    - **NCrunch: Good Unit Test Naming Conventions**：[`www.ncrunch.net/documentation/reference_writing_good_test_names`](https://www.ncrunch.net/documentation/reference_writing_good_test_names)\n\
    \n## 测试结构成功的因素\n\n组织良好的测试在需求变化时更容易理解、调试和更新。随着测试套件的增长，对合理结构的投资将产生巨大的巨大的报。\n\n##\
    \ 接下来介绍\n\n你的 IDE 可以显著增强你的测试工作流。在下一节中，我们将看到如何利用 Rider 的功能来优化单元测试体验。\n\n让我们用 IDE\
    \ 让这些测试变得高效吧！\n\n# 利用 Rider IDE：优化你的单元测试工作流\n\nRider 凭借其丰富的特性和智能代码洞察，可以显著增强你的单元测试体验。让我们探索它如何简化你的工作流。\n\
    \n### 1. 无缝兼容 Visual Studio（如果适用）\n\n如果你正在从 Visual Studio 迁移，Rider 为 NUnit 项目提供了广泛广泛支持以及熟悉的\
    \ Test Explorer 界面。这降低了学习曲线。\n\n### 2. 测试发现与执行\n\n- **Test Explorer 集成**：Rider\
    \ 自动发现 NUnit 测试并与其类似 Test Explorer 的窗口集成。\n- **在多个级别运行测试**：直接从 IDE 中执行单个测试、整个测试固件、测试组或整个测试套件。\n\
    - **即时反馈**：提供通过（绿色）、失败（红色）或跳过（蓝色）测试的清晰指示。\n\n### 3. 指尖上的调试能力\n\n- **单步执行测试代码**：像处理应用程序代码一样使用断点并调试测试。分析变量、单步执行路径，并快速识别失败的根源。\n\
    - **实时堆栈跟踪**：当测试失败时，Rider 的堆栈跟踪允许你直接跳转到代码中失败的行。\n\n### 4. 测试中的导航与代码重构\n\n- **跳转到声明/实现**：使用快捷键（如\
    \ F12）在测试代码和相应的生产代码之间从缝导航。\n- **放心地重构**：Rider 的重构工具在测试代码中运行可靠。重命名方法、引入参数等时，测试会自动更新，保持同步。\n\
    \n### 5. 代码生成与代码片段\n\n- **生成测试固件**：Rider 可以为你为你创建基础的测试固件结构（`[TestFixture]`、空测试方法），节省你的键盘敲击次数。\n\
    - **NUnit 代码片段**：使用内置代码片段（例如输入‘test’并展开）来编写常用的 NUnit 测试结构，以快速编写测试。\n\n### 6. 持续测试（高级功能）\n\
    \n- **后台测试执行**：Rider 可以在你编写代码时在后台持续运行相关测试。获取更改是否意外破坏了某些功能的即时反馈。\n- **内联通知**：在代码编辑器中微妙地集成通过/失败结果，让你在无需切换上下文的情况下处理测试失败。\n\
    \n### 示例工作流\n\n1. 编写测试（或让 Rider 生成基础结构）\n2. **发现**：Rider 将你的测试添加到测试树中。\n3. **运行与调试**：执行测试。如果失败，进行调试以定位生产代码中的问题。\n\
    4. **重构**：使用 Rider 的重构工具修复你的生产代码或测试。\n5. **持续测试（可选）**：在工作时获取代码更改的即时影响。\n\n"
- fmt: "\n- JetBrains Rider Unit Testing Documentation: [https://www.jetbrains.com/help/rider/Getting_Started_with_Unit_Testing.html](https://www.jetbrains.com/help/rider/Getting_Started_with_Unit_Testing.html)\n\
    - JetBrains Blog Posts on Testing: [https://blog.jetbrains.com/dotnet/tag/testing/](https://blog.jetbrains.com/dotnet/tag/testing/)\n\
    \n## Efficiency and Insight\n\nRider doesn’t just run your tests, it transforms\
    \ unit testing into a fluid conversation between your code and its tests. This\
    \ tight integration helps you write better tests faster and fix issues with surgical\
    \ precision.\n\n## Next Up\n\nLet’s make your work on a real-world class using\
    \ Rider with hands-on guidance. The next chapter will provide a practical walkthrough\
    \ for creating your first unit tests in Rider.\n\n# Hands-On: Crafting Your First\
    \ Unit Test in Rider\n\nLet’s get practical and write your first C# unit test\
    \ using Rider. We’ll stick with our familiar `Calculator` example for consistency.\n\
    \n## Prerequisites\n\n- Rider installed\n- Basic familiarity with C# syntax\n\n\
    ## Step 1: Create Your Projects\n\n1. New Solution: In Rider, select “File” ->\
    \ “New Solution”.\n2. Project Types:\n    - Choose a “Class Library (.NET Framework)”\
    \ or similar for your production code (`CalculatorProject` – adjust naming as\
    \ you like).\n    - Create a “Unit Test Project (.NET Framework)” or similar for\
    \ your tests (`CalculatorTests`).\n3. Solution Structure: Ensure both projects\
    \ are added to the same solution.\n\n## Step 2: Add the Calculator Class\n\nIn\
    \ your `CalculatorProject`, create a `Calculator.cs` file:\n\n```csharp\npublic\
    \ class Calculator\n{\n    public int Add(int a, int b)\n    {\n        return\
    \ a + b;\n    }\n}\n```\n\n## Step 3: Install NUnit\n\n1. Right-click your test\
    \ project > “Manage NuGet Packages…”\n2. Browse: Search for “NUnit” and install\
    \ the package.\n3. Also Install: Install the `NUnit3TestAdapter` package (this\
    \ enables test discovery within Rider).\n\n## Step 4: Create Your First Test Class\n\
    \nIn your `CalculatorTests` project, create a `CalculatorTests.cs` file:\n\n```csharp\n\
    using NUnit.Framework;\n\nnamespace CalculatorTests\n{\n    [TestFixture]\n  \
    \  public class CalculatorTests\n    {\n        [Test]\n        public void Add_PositiveNumbers_ReturnsCorrectSum()\n\
    \        {\n            // Arrange\n            var calculator = new Calculator();\n\
    \            // Act\n            int result = calculator.Add(5, 8);\n        \
    \    // Assert\n            Assert.AreEqual(13, result);\n        }\n    }\n}\n\
    ```\n\n## Step 5: Discover and Run Your Test\n\n1. Build: Build your solution\
    \ (Rider usually prompts you to do so).\n2. Test Explorer: Rider should automatically\
    \ discover your test. You might find a dedicated “Unit Tests” window, similar\
    \ to Visual Studio’s Test Explorer.\n3. Run: Right-click on the `Add_PositiveNumbers_ReturnsCorrectSum`\
    \ test (or the entire fixture) in the Test Explorer, and select “Run”.\n\n## Step\
    \ 6: Success (Hopefully!)\n\nYou should see your test pass with a satisfying green\
    \ indicator!\n\n## Troubleshooting\n\n- Tests Not Found: Make sure you’ve installed\
    \ the `NUnit3TestAdapter` and rebuilt your project.\n- Incorrect Version: Ensure\
    \ Rider uses a .NET framework supported by your NUnit version.\n\n## Key Takeaways\n\
    \n- Solution Structure: Tests reside in a separate project.\n- NUnit Attributes:\
    \ `[TestFixture]` and `[Test]`\n- AAA Pattern: Arrange, Act, Assert\n\n## Next\
    \ Steps\n\n- Add more tests for different `Calculator` scenarios (negative numbers,\
    \ subtraction, etc.).\n- Experiment with Rider’s test running and debugging features.\n\
    \nCongratulations! You’ve taken your first substantial step into the realm of\
    \ unit testing. Keep building tests, and you’ll see how they transform your development\
    \ experience.\n\n## Up Next\n\nLet’s delve into a testing approach known as ‘black-box’\
    \ testing.\n\n## Shedding Light on Black-box Testing\n\nBlack-box testing is a\
    \ powerful approach where we focus on inputs and outputs without knowing internal\
    \ workings.\n\n### Why “Black-box”?\n\n- **Abstraction**: You don’t concern yourself\
    \ with implementation.\n- **Flexibility**: If implementation changes, black-box\
    \ tests are less likely to be modified.\n\n### Key Principles of Black-Box\n\n\
    1. **Focus on the Interface, Not Implementation**: Design tests around exposed\
    \ methods and properties.\n- **Cover Input and Output**:\n    - Valid inputs:\
    \ Expected behavior.\n    - Invalid inputs: How does code handle bad data?\n \
    \   - Boundary values: Testing at extremes.\n\n### Example: Our Calculator\n\n\
    Instead of worrying about internal details, focus on scenarios like:\n- `Positive\
    \ numbers`: Should result in the expected sum.\n- `Negative numbers`: Should result\
    \ in expected values.\n- `Zero`: Should result in the expected value.\n\n### Techniques\
    \ within Black-Box Testing\n\n- **Equivalence Partitioning**: Dividing input into\
    \ classes.\n- **Boundary Value Analysis**: Rigorously testing inputs at the edges.\n\
    \n### Benefits of Black-Box Testing\n\n- **Resilient Tests**: Less coupled to\
    \ implementation.\n- **Clear Specifications**: Helps define expected behavior.\n\
    - **Non-Developer Friendly**: People less familiar with code can still contribute.\n\
    \n## Black-Box vs White-Box\n\nBlack-box testing complements “white-box” testing,\
    \ where you have knowledge of the implementation. A healthy testing strategy often\
    \ employs both.\n\n## Additional Resources\n\n- Black Box Testing: [https://www.guru99.com/black-box-testing.html](https://www.guru99.com/black-box-testing.html)\n\
    - ISTQB Glossary of Terms: [https://www.istqb.org/downloads/syllibus/glossary-of-terms/](https://www.istqb.org/downloads/syllibus/glossary-of-terms/)\n\
    \n## A Strategy, Not an All-Encompassing Solution\n\nBlack-box testing alone doesn’t\
    \ cover all scenarios (e.g., complex internal logic paths). Use it strategically\
    \ alongside other techniques.\n\n## Up Next: Managing Test Setup and Teardown\
    \ Ensuring Test Independence\n\nSometimes, units of code need to work together\
    \ to perform a task. The next chapter will focus on managing the setup and teardown\
    \ necessary to get your tests into a known, reliable state.\n\n### The Challenge\
    \ of Shared State\n\nIsolated tests are reliable tests. A core aspect of isolation\
    \ is ensuring each test starts with a clean slate and doesn’t leave any side effects\
    \ that might corrupt subsequent tests. This is where setup and teardown methods\
    \ come into play.\n\n### Setup: Getting Ready for Action\n\nSetup methods are\
    \ used for common pre-test arrangements:\n\n- **Instantiating Objects**: Creating\
    \ the objects under test and any supporting objects.\n- **Initializing Variables**:\
    \ Setting variables to known values.\n- **Mocking Dependencies**: Configuring\
    \ mock objects (we’ll cover mocking in detail later).\n- **Preparing External\
    \ Resources**: Setting up files, database records, etc., if needed.\n"
  raw: '●     JetBrains Rider Unit Testing Documentation:  [https://www.jetbrains.com/help/rider/Getting_Started_with_Unit_Testing.html](https://www.jetbrains.com/help/rider/Getting_Started_with_Unit_Testing.html)


    ●     JetBrains Blog Posts on Testing  [https://blog.jetbrains.com/dotnet/tag/testing/](https://blog.jetbrains.com/dotnet/tag/testing/)


    Efficiency and Insight


    Rider doesn’t just run your tests, it transforms unit testing into a fluid conversation
    between your code and its tests. This tight integration helps you write better
    tests faster and fix issues with surgical precision.


    Next Up


    Let’s make your work on a real-world class using Rider with hands-on guidance.
    The next chapter will provide a practical walkthrough for creating your first
    unit tests in Rider.


    # Hands-On: Crafting Your First Unit Test in Rider


    Let’s get practical and write your first C# unit test using Rider. We’ll stick
    with our familiar  Calculator example for consistency.


    Prerequisites


    ●     Rider installed


    ●     Basic familiarity with C# syntax


    Step 1: Create Your Projects


    1.  New Solution: In Rider, select “File” -> “New Solution”.


    2.  Project Types:


    ○ Choose a “Class Library (.NET Framework)” or similar for your production code
    (CalculatorProject – adjust naming as you like).


    ○ Create a “Unit Test Project (.NET Framework)” or similar for your tests (CalculatorTests).


    3.  Solution Structure: Ensure both projects are added to the same solution.


    Step 2: Add the Calculator Class


    In your  CalculatorProject, create a  Calculator.cs file:


    public  class  Calculator


     {


        public  int  Add(int a,  int b)


        {


             return a + b;


        }


    }


    Step 3: Install NUnit


    1.  Right-click your test project > “Manage NuGet Packages…”


    2.  Browse: Search for “NUnit” and install the package.


    3.  Also Install: Install the “NUnit3TestAdapter” package (this enables test discovery
    within Rider).


    Step 4: Create Your First Test Class


    In your  CalculatorTests project, create a  CalculatorTests.cs file:


    using NUnit.Framework;


    namespace CalculatorTests


     {


        [TestFixture]


        public  class  CalculatorTests


        {


            [Test]


            public  void  Add_PositiveNumbers_ReturnsCorrectSum()


            {


                // Arrange


                var calculator =  new  Calculator();


                // Act


                int result = calculator.Add(5,  8);


                // Assert


                Assert.AreEqual(13, result);


            }


        }


    }


    Step 5: Discover and Run Your Test


    1.  Build: Build your solution (Rider usually prompts you to do so).


    2.  Test Explorer: Rider should automatically discover your test. You might find
    a dedicated “Unit Tests” window, similar to Visual Studio’s Test Explorer.


    3.  Run: Right-click on the  Add_PositiveNumbers_ReturnsCorrectSum test (or the
    entire fixture) in the Test Explorer, and select “Run”.


    Step 6: Success (Hopefully!)


    You should see your test pass with a satisfying green indicator!


    Troubleshooting


    ● Tests Not Found: Make sure you’ve installed the “NUnit3TestAdapter” and rebuilt
    your project.


    ● Incorrect Version: Ensure Rider uses a .NET framework supported by your NUnit
    version.


    Key Takeaways


    ●     Solution Structure: Tests reside in a separate project.


    ●     NUnit Attributes: [TestFixture] and  [Test]


    ●     AAA Pattern: Arrange, Act, Assert


    Next Steps


    ● Add more tests for different  Calculator scenarios (negative numbers, subtraction,
    etc.).


    ●     Experiment with Rider’s test running and debugging features.


    Congratulations! You’ve taken your first substantial step into the realm of unit
    testing. Keep building tests, and you’ll see how they transform your development
    experience.


    Up Next


    Let’s delve into a testing approach known as ‘black-box’ testing where we focus
    on inputs, outputs, and behaviors without worrying about the internal workings
    of your code.


    Shedding Light on Black-box Testing Techniques


    Black-box testing is a powerful approach where you focus squarely on the inputs
    and expected outputs of your code units, treating their internal implementation
    details as a “black box.”


    Why “Black Box”?


    ● Abstraction: You don’t concern yourself with how a component produces its results,
    only that it produces the correct results for a given set of inputs.


    ● Flexibility: If the internal implementation changes (but the input-output behavior
    remains the same), your black-box tests shouldn’t need to be modified.


    Key Principles of Black-Box Testing


    1.  Focus on the Interface, Not the Implementation: Design tests around the publicly
    exposed methods and properties of a class, and what they’re supposed to do.


    2.  Cover Input and Output Scenarios:


    ○ Valid inputs: Test cases that should lead to expected results.


    ○ Invalid inputs: How does your code handle bad data or edge cases (e.g., negative
    numbers in a square root function)?


    ○ Boundary values: Inputs at the extremes of valid ranges (zero, maximum values,
    etc.).


    Example: Our Calculator


    Instead of worrying about the specific calculation within the  Add method, we’d
    focus on test cases like this:


    ●     Positive numbers: (5, 3) -> Should result in 8


    ●     Negative numbers: (-2, -5) -> Should result in -7


    ●     Zero: (0, 10) -> Should result in 10


    Techniques within Black-Box Testing


    ● Equivalence Partitioning: Dividing input data into classes that you expect to
    be processed similarly. For example, all positive numbers versus all negative
    numbers, instead of testing hundreds of individual numbers.


    ● Boundary Value Analysis: Rigorously testing inputs at the edges of those equivalence
    classes (e.g., the smallest valid positive number, the largest valid one).


    Benefits of Black-Box Testing


    ● Resilient Tests: Since they’re less coupled to the implementation, black-box
    tests are more likely to survive refactoring.


    ● Clear Specifications: Black-box tests help define the expected behavior of your
    components.


    ● Non-Developer Friendly: People less familiar with the underlying code can still
    contribute by designing input/output scenarios.


    Black-Box vs White-Box


    Black-box testing complements “white-box” testing, where you do have knowledge
    of the implementation. A healthy testing strategy often employs a combination
    of both.


    Additional Resources


    ●     Black Box Testing Techniques  [https://www.guru99.com/black-box-testing.html](https://www.guru99.com/black-box-testing.html)


    ●     ISTQB Glossary of Testing Terms  [https://www.istqb.org/downloads/syllibus/glossary-of-terms/](https://www.istqb.org/downloads/syllibus/glossary-of-terms/)


    A Strategy, Not an All-Encompassing Solution


    Black-box testing alone doesn’t cover all scenarios (e.g., complex internal logic
    paths). Use it strategically alongside other testing techniques.


    Up Next


    Sometimes, units of code need to work together to perform a task. The next chapter
    will focus on managing the setup and teardown necessary to get your tests into
    a known, reliable state.


    Managing Test Setup and Teardown: Ensuring Test Independence


    Isolated tests are reliable tests. A core aspect of isolation is ensuring each
    test starts with a clean slate and doesn’t leave any side effects that might corrupt
    subsequent tests. This is where setup and teardown methods come into play.


    The Challenge of Shared State


    Imagine these scenarios:


    ● Test Modifying a Global Variable: One test modifies a global variable, and a
    subsequent test unknowingly relies on that modified version.


    ● Test Manipulating a Database: A test adds data to a database. If not cleaned
    up properly, it could interfere with other tests that expect an empty database.


    Setup: Getting Ready for Action


    Setup methods are used for common pre-test arrangements:


    ● Instantiating Objects: Creating the objects under test and any supporting objects.


    ●     Initializing Variables: Setting variables to known values.


    ● Mocking Dependencies: Configuring mock objects (we’ll cover mocking in detail
    later).


    ● Preparing External Resources: Setting up files, database records, etc., if needed.'
