  trans: "\n\n-   TDD 的三个规则：[`www.agilealliance.org/glossary/tdd/`](https://www.agilealliance.org/glossary/tdd/)\n\
    \n## 基础之外\n\n掌握 TDD 是一场持续的旅程。随着经验的积累，你将发现有助于设计可测试系统的模式，以及 TDD 如何影响你解决问题的方法。\n\n\
    ## 第 2 节：掌握单元测试基础知识\n\n### 理解单元测试的核心原理\n\n虽然像 `NUnit` 这样的工具提供了编写测试的机制，但牢固的基础原理将引导你创建真正有效的测试。让我们来探索这些基石。\n\
    \n### 1. 隔离 (Isolation)：单元测试的核心\n- 真正的单元测试针对的是系统中最小的可测试代码单元，且与系统的其他部分完全隔离。\n-\
    \ 为什么重要：隔离允许你精确地定位故障的根源。如果测试失败，你确切知道问题出在哪里。\n\n### 2. 快速 (FAST)\n- 单元测试的执行必须极快。\n\
    - 为什么重要：缓慢的测试会抑制人们频繁测试的意愿。你希望能够在几秒内运行整个测试套件，从而在编码时获得快速反馈。\n\n### 3. 独立且可重复 (Independent\
    \ and Repeatable)\n- 每个单元测试应该是自包含的，不依赖于其他测试的执行顺序或副作用。\n- 无论外部因素如何，测试在每次运行时都应该一致产生相同的结果。\n\
    - 为什么重要：不可靠的测试会破坏你对测试套件的信任。依赖顺序的测试可能会隐藏错误，并让调试变成噩梦。\n\n### 4. 自验证 (Self-Validating)\n\
    - 单元测试应该有一个清晰、无歧义的通过或失败结果。避免主观解释。\n- 为什么重要：当自动化测试对你的代码运行情况提供确定、自动化的判决时，它最有价值。\n\
    \n### 5. 及时 (Timely)\n- 理想情况下，在编写生产代码的同时编写单元测试，甚至在之前之前编写（TDD！）。\n- 为什么重要：后期补测更加困难。早期测试迫使你思考代码的可测试性，并能塑造更好的设计。\n\
    \n### 良好单元测试的共同特征\n让我们将这些原则扩展到更具实践性的观察中：\n- 聚焦 (Focused)：一个良好的单元测试验证代码单元的某个特定行为。\n\
    - 可读性 (Readable)：测试即是文档。它们的意图应该是清晰的。\n- 可维护性 (Maintainable)：随着代码的演进，测试应该易于更新，且破坏极少。\n\
    \n### 原则性 vs 教条主义 (Principled vs. Dogmatic)\n将这些视为指导原则而非不可逾越的法律。在某些情况下，适当的妥协是合理的（例如，一个非常小且控制良好的依赖可能是不可避免的）。\n\
    \n### 其他资源\n- Roy Osherove 著的《单元测试艺术》：[`www.manning.com/books/the-art-of-unit-testing-second-edition`](https://www.manning.com/books/the-art-of-unit-testing-second-edition)（著名的单元测试书籍）\n\
    - 单元测试原理 [`martinfowler.com/bliki/UnitTest.html`](https://martinfowler.com/bliki/UnitTest.html)\n\
    \n### 有效单元测试的核心特征\n\n在上一章节中，我们讨论了引导单元测试的核心原理。让我们将这些原理转化为你在良好的单元测试中会发现的可操作特质。\n\
    \n### 1. 聚焦且具体 (Focused and Specific)\n每个测试都应该专注于被测试代码的单一、定义良好的行为。以下是这很重要的原因：\n\
    - 定位问题：粒度测试可以快速揭示失败的根源。\n- 避免重叠：范围过大的测试可能导致冗余，或者完全遗漏微妙的边缘情况。\n\n### 2. 可读且自解释性\
    \ (Readable and Self-Descriptive)\n测试充当代码意图行为的活文档。优先考虑清晰性：\n- 描述性命名：测试方法名应传达正在测试的场景（例如：`CalculateDiscount_AppliesSeniorDiscount_WhenAgeOver65`）。\n\
    - 结构清晰：采用 `AAA`（Arrange-Act-Assert，准备-执行-断言）模式。\n- 极少注释：你的测试结构大部分情况下应该是自解释的；对于复杂的设置，少用注释。\n\
    \n### 3. 可信赖且可靠 (Trustworthy and Reliable)\n不稳定的测试套件会损害信心。力求一致，并避免由以下因素引起的虚假警报：\n\
    - 外部依赖：尽量减少对真实数据库、文件系统等的使用，因为这些会引入不可控的因素。\n- 测试顺序依赖：无意中依赖之前执行的测试会导致不可预测的结果。\n\
    - 非确定性：如果你的逻辑使用了随机数或依赖于当前时间等元素，请想办法在测试中控制这些因素。\n\n### 4. 可维护性 (Maintainable)\n\
    软件会发生变化，你的测试也需要随之改变。以下是减少测试维护烦恼的方法：\n- 避免过度 Mock (Avoid-Mocking)：过度复杂的 Mock 设置会导致测试变得脆弱，当底层代码发生变化时极易崩溃。\n\
    - 测试设计：在测试中遵循与生产代码相同的设计原则。结构良好的测试更易调整。\n- 与重构同步：在重构生产代码时，同步重构你的测试，保持它们的一致。\n\n\
    #### 示例：重新审视我们的计算器\n让我们想象一个写得糟糕的 `Calculator` 测试：\n\n```c\n[Test]\npublic void\
    \ CalculatorCanDoMath()\n{\n    var calculator = new Calculator();\n    Assert.AreEqual(5,\
    \ calculator.Add(2, 3));\n    Assert.AreEqual(10, calculator.Multiply(5, 2));\n\
    \    Assert.AreEqual(2, calculator.Subtract(5, 3));\n}\n```\n\n**弱点：**\n- 不够聚焦：一次测试了多个操作。\n\
    - 命名糟糕：没有传达测试意图。\n- 脆弱：如果 `Add` 的实现崩溃，所有的断言都可能失败。\n\n### 其他资源\n- Roy Osherove\
    \ 关于可维护测试：[`www.manning.com/books/the-art-of-unit-testing-second-edition`](https://www.manning.com/books/the-art-of-unit-testing-second-edition)\n\
    - XUnit 测试模式：重构代码 [`www.amazon.com/xUnit-Test-Patterns-Refactoring-Code/dp/01314954`](https://www.amazon.com/xUnit-Test-Patterns-Refactoring-Code/dp/01314954)\n\
    \n### 旅程而非终点\n编写出色的单元测试是一个持续学习的过程。从这些特质开始，随着经验的增加，你权衡这些因素的能力将自然提高。\n\n## 下节内容\n\
    了解要测试什么以及关注哪些场景是一项关键技能。在下一章节中，我们将应对如何明智地定义测试范围。\n\n## 定义测试范围：明智选择测试内容\n\n详尽测试所有可能的输入和代码路径通常是不行的，并且会导致测试泛滥。让我们探索如何策略性地定义测试范围，以实现单元测试价值化。\n\
    \n### 1. 代码逻辑\n主要关注方法中的决策点和算法逻辑：\n- 条件语句 (`if/else`)：确保代码的每个分支在不同测试用例下执行。\n- 循环：验证循环运行正确，处理零迭代等边缘情况，并适应不同的大小。\n\
    - 计算：测试你的公式和计算逻辑。\n\n### 2. 边缘情况和边界值\n特别注意有效范围边界的输入值。\n- 数字：考虑零、负数、极大值以及与计算逻辑相关的数值。\n\
    - 字符串：测试空字符串、包含特殊字符的字符串或最大长度的字符串。\n- 集合：检查空集合、单元素集合、最大数量集合等。\n\n### 3. 错误情况\n\
    当出现问题时，你的代码表现如何？包含以下测试：\n- 触发异常：验证你的代码在无效条件下抛出正确的异常，并得到妥善处理。\n- 无效输入：确保坏输入被检测到并适当拒绝。\n\
    \n### 4. 风险评估\n识别具有以下特征的代码区域：\n\n"
- fmt: "\n- **Complexity**: Complex logic is more prone to errors; therefore, it warrants\
    \ more thorough testing.\n- **Criticality**: If the failure of a code unit would\
    \ have severe consequences for your application, prioritize rigorous testing.\n\
    - **Rate of Change**: Frequently modified code areas might warrant a richer set\
    \ of tests to catch regressions more easily.\n\n## 5. Evolving Test Scope\n\n\
    Avoid a “write once and forget” mentality:\n\n- **New Features**: As you expand\
    \ your application, new tests will likely be required to cover the added functionality.\n\
    - **Bug Fixes**: When fixing a bug, write a test that reproduces the bug first\
    \ to ensure the fix works and prevent re-occurrences.\n- **Refactoring**: As your\
    \ code structure changes, adjust your tests accordingly.\n\n### Example: Back\
    \ to the Calculator\n\nLet’s suppose our `Calculator` now has a more complex `Divide`\
    \ method:\n\n```csharp\npublic double Divide(double a, double b) {\n    if (b\
    \ == 0) {\n        throw new DivideByZeroException();\n    }\n    // Handle potential\
    \ overflow if the result is out of double's range\n    if (Math.Abs(a) == double.MaxValue\
    \ && Math.Abs(b) == 1.0) {\n        return a;\n    }\n    return a / b;\n}\n```\n\
    \n### Additional Resources\n\n- **Boundary Value Analysis**: [https://en.wikipedia.org/wiki/Boundary-value_analysis](https://en.wikipedia.org/wiki/Boundary-value_analysis)\n\
    - **Equivalence Partitioning**: [https://en.wikipedia.org/wiki/Equivalence_partitioning](https://en.wikipedia.org/wiki/Equivalence_partitioning)\n\
    - **Example-based thinking when determining test scenarios**: [https://www.agilealliance.org/resources/experience-reports/example-based-testing-an-introduction/](https://www.agilealliance.org/resources/experience-reports/example-based-testing-an-introduction/)\n\
    \n## Striking the Right Balance\n\nFinding the ideal test scope is an ongoing\
    \ balance between thoroughness and practicality. With practice, you’ll get better\
    \ at pinpointing the tests that provide the most return on investment for your\
    \ time and effort.\n\n## Up Next\n\nA clear test structure and descriptive naming\
    \ dramatically improve the readability of your tests. Let’s delve into effective\
    \ test organization in the next chapter.\n\n## Structuring Your Tests: The Art\
    \ of Naming and Organization\n\nWell-structured and named tests are essential\
    \ for readability and maintainability. They enhance the value of your tests as\
    \ living documentation of your system. Let’s dive into the key aspects.\n\n###\
    \ 1. Test Class Organization\n\n- **One Test Class per Production Class**: Mirroring\
    \ the structure of your production code improves navigability. (e.g., `CalculatorTests`\
    \ to test the `Calculator` class)\n- **Nested Classes for Fine-Grained Grouping\
    \ (Optional)**: For classes with many methods, nest test classes to organize –\
    \ like `CalculatorTests.AdditionTests` specifically for testing the addition aspect.\n\
    \n### 2. Test Method Naming\n\nDescriptive method names act as a story, telling\
    \ you what a test is verifying. A common and effective convention is:\n\n`MethodName_ScenarioUnderTest_ExpectedBehavior`\n\
    \n- **MethodName**: The method of your production code being tested.\n- **ScenarioUnderTest**:\
    \ Specific input conditions or setup.\n- **ExpectedBehavior**: The anticipated\
    \ result or outcome.\n\n**Example**: `Divide_PositiveNumbers_ReturnsCorrectQuotient`\n\
    \n### 3. The Arrange-Act-Assert (AAA) Pattern\n\nWithin each test method, the\
    \ AAA pattern fosters clarity:\n\n- **Arrange**: Set up objects, data, and any\
    \ preconditions for the test.\n- **Act**: Invoke the actual method or unit of\
    \ code you are testing.\n- **Assert**: Check the expected outcomes using assertions.\n\
    \n### 4. Folder Structure\n\nMirror the project structure of your production code\
    \ within your test project. This makes it easy to find tests related to specific\
    \ components.\n\n### 5. Consistency is King\n\nChoose a style and stick with it\
    \ throughout your test suite. Consistency makes tests easier to understand for\
    \ everyone on your team.\n\n### Example with Our Calculator\n\n```csharp\n[TestFixture]\n\
    public class CalculatorTests\n{\n    [Test]\n    public void Add_PositiveNumbers_ReturnsCorrectSum()\n\
    \    {\n        // Arrange\n        var calculator = new Calculator();\n     \
    \   int a = 5, b = 7;\n        int expectedResult = 12;\n        // Act\n    \
    \    int actualResult = calculator.Add(a, b);\n        // Assert\n        Assert.AreEqual(expectedResult,\
    \ actualResult);\n    }\n    // More tests follow for subtraction, multiplication,\
    \ etc.\n}\n```\n\n### Additional Resources\n\n- **Roy Osherove: The Art of Unit\
    \ Testing: Naming Tests**: [https://osherove.com/blog/2005/4/3/naming-standards-for-unit-tests.html](https://osherove.com/blog/2005/4/3/naming-standards-for-unit-tests.html)\n\
    - **NCrunch: Good Unit Test Naming Conventions**: [https://www.ncrunch.net/documentation/reference_writing_good_test_names](https://www.ncrunch.net/documentation/reference_writing_good_test_names)\n\
    \n## Test Structure as a Success Factor\n\nWell-organized tests are easier to\
    \ understand, debug, and update when requirements change. As your test suite grows,\
    \ the investment in proper structure pays huge dividends.\n\n## Next Up\n\nYour\
    \ IDE can significantly enhance your testing workflow. In the next chapter, we’ll\
    \ see how to leverage Rider’s features to optimize your unit testing experience.\n\
    \nLet’s get those tests streamlined with your IDE!\n\n# Leveraging Rider IDE:\
    \ Optimizing Your Unit Testing Workflow\n\nRider, with its rich feature set and\
    \ intelligent code insights, can significantly enhance your unit testing experience.\
    \ Let’s explore how it can streamline your workflow.\n\n### 1. Seamless Visual\
    \ Studio Compatibility (If Relevant)\n\nIf you’re transitioning from Visual Studio,\
    \ Rider offers extensive support for NUnit projects and the familiar Test Explorer\
    \ interface. This eases the learning curve.\n\n### 2. Test Discovery and Execution\n\
    \n- **Test Explorer Integration**: Rider automatically discovers NUnit tests and\
    \ integrates with its Test Explorer-like window.\n- **Run Tests at Many Levels**:\
    \ Execute individual tests, entire test fixtures, groups of tests, or your whole\
    \ test suite directly from the IDE.\n- **Instant Feedback**: Clear indicators\
    \ for passed (green), failed (red), or skipped (blue) tests.\n\n### 3. Debugging\
    \ Power at Your Fingertips\n\n- **Step Through Test Code**: Use breakpoints and\
    \ debug tests just like your application code. Analyze variables, step through\
    \ execution paths, and quickly identify the root cause of failures.\n- **Live\
    \ Stack Trace**: When a test fails, Rider’s stack trace lets you jump straight\
    \ to the failing line in your code.\n\n### 4. Navigation and Code Refactoring\
    \ Within Tests\n\n- **Go to Declaration/Implementation**: Effortlessly navigate\
    \ between test code and corresponding production code using keyboard shortcuts\
    \ (like F12).\n- **Refactor with Confidence**: Rider’s refactoring tools work\
    \ reliably within test code. Rename methods, introduce parameters, etc., while\
    \ tests automatically update, keeping them in sync.\n\n### 5. Code Generation\
    \ and Snippets\n\n- **Generating Test Fixtures**: Rider can create basic test\
    \ fixture structures (`[TestFixture]`, empty test methods) for you, saving your\
    \ keystrokes.\n- **NUnit Snippets**: Use built-in snippets (e.g., type ‘test’\
    \ and expand) for common NUnit test structures for rapid test writing.\n\n###\
    \ 6. Continuous Testing (Advanced Feature)\n\n- **Background Test Execution**:\
    \ Rider can continuously run relevant tests in the background as you code. Get\
    \ immediate feedback on whether changes accidentally break something.\n- **Inline\
    \ Notifications**: See pass/fail results subtly integrated within the code editor,\
    \ letting you address test failures without switching context.\n\n### Example\
    \ Workflow\n\n1. Write a Test (or let Rider generate the basics)\n2. **Discover**:\
    \ Rider adds your test to the testing tree.\n3. **Run and Debug**: Execute the\
    \ test. If it fails, debug to pinpoint the problem in your production code.\n\
    4. **Refactor**: Fix your production code or tests with Rider’s refactoring tools.\n\
    5. **Continuous Testing (Optional)**: Get real-time code change impact as you\
    \ work.\n\n## Additional Resources\n"
  raw: "● Complexity: Complex logic is more prone to errors; therefore, it warrants\
    \ more thorough testing.\n\n● Criticality: If the failure of a code unit would\
    \ have severe consequences for your application, prioritize rigorous testing.\n\
    \n● Rate of Change: Frequently modified code areas might warrant a richer set\
    \ of tests to catch regressions more easily.\n\n5\\. Evolving Test Scope\n\nAvoid\
    \ a “write once and forget” mentality:\n\n● New Features: As you expand your application,\
    \ new tests will likely be required to cover the added functionality.\n\n● Bug\
    \ Fixes: When fixing a bug, write a test that reproduces the bug first to ensure\
    \ the fix works and prevent re-occurrences.\n\n● Refactoring: As your code structure\
    \ changes, adjust your tests accordingly.\n\nExample: Back to the Calculator\n\
    \nLet’s suppose our  Calculator now has a more complex  Divide method:\n\npublic\
    \  double  Divide(double a,  double b)  {\n\n    if  (b ==  0)  {\n\n        throw\
    \  new  DivideByZeroException();\n\n    }\n\n // Handle potential overflow if\
    \ the result is out of double's range\n\n if  (Math.Abs(a)  ==  double.MaxValue\
    \ && Math.Abs(b)  ==  1.0)  {\n\n        return a;\n\n    }\n\n    return a /\
    \ b;\n\n}\n\nAdditional Resources\n\n●     Boundary Value Analysis:  [https://en.wikipedia.org/wiki/Boundary-value_analysis](https://en.wikipedia.org/wiki/Boundary-value_analysis)\n\
    \n●     Equivalence Partitioning:  [https://en.wikipedia.org/wiki/Equivalence_partitioning](https://en.wikipedia.org/wiki/Equivalence_partitioning)\n\
    \n●     Example-based thinking when determining test scenarios:  [https://www.agilealliance.org/resources/experience-reports/example-based-testing-an-introduction/](https://www.agilealliance.org/resources/experience-reports/example-based-testing-an-introduction/)\n\
    \nStriking the Right Balance\n\nFinding the ideal test scope is an ongoing balance\
    \ between thoroughness and practicality. With practice, you’ll get better at pinpointing\
    \ the tests that provide the most return on investment for your time and effort.\n\
    \nUp Next\n\nA clear test structure and descriptive naming dramatically improve\
    \ the readability of your tests. Let’s delve into effective test organization\
    \ in the next chapter.\n\nStructuring Your Tests: The Art of Naming and Organization\n\
    \nWell-structured and named tests are essential for readability and maintainability.\
    \ They enhance the value of your tests as living documentation of your system.\
    \ Let’s dive into the key aspects.\n\n1\\. Test Class Organization\n\n● One Test\
    \ Class per Production Class: Mirroring the structure of your production code\
    \ improves navigability. (e.g.,  CalculatorTests to test the  Calculator class)\n\
    \n● Nested Classes for Fine-Grained Grouping (Optional): For classes with many\
    \ methods, nest test classes to organize – like  CalculatorTests.AdditionTests\
    \ specifically for testing the addition aspect.\n\n2\\. Test Method Naming\n\n\
    Descriptive method names act as a story, telling you what a test is verifying.\
    \ A common and effective convention is:\n\nMethodName_ScenarioUnderTest_ExpectedBehavior\n\
    \n●     MethodName: The method of your production code being tested.\n\n●     ScenarioUnderTest:\
    \ Specific input conditions or setup.\n\n●     ExpectedBehavior: The anticipated\
    \ result or outcome.\n\nExample: Divide_PositiveNumbers_ReturnsCorrectQuotient\n\
    \n3\\. The Arrange-Act-Assert (AAA) Pattern\n\nWithin each test method, the AAA\
    \ pattern fosters clarity:\n\n● Arrange: Set up objects, data, and any preconditions\
    \ for the test.\n\n● Act: Invoke the actual method or unit of code you are testing.\n\
    \n●     Assert: Check the expected outcomes using assertions.\n\n4\\. Folder Structure\n\
    \nMirror the project structure of your production code within your test project.\
    \ This makes it easy to find tests related to specific components.\n\n5\\. Consistency\
    \ is King\n\nChoose a style and stick with it throughout your test suite. Consistency\
    \ makes tests easier to understand for everyone on your team.\n\nExample with\
    \ Our Calculator\n\nLet’s see everything in action:\n\n[TestFixture]\n\npublic\
    \  class  CalculatorTests\n\n {\n\n    [Test]\n\n    public  void  Add_PositiveNumbers_ReturnsCorrectSum()\n\
    \n    {\n\n        // Arrange\n\n        var calculator =  new  Calculator();\n\
    \n        int a =  5, b =  7;\n\n        int expectedResult =  12;\n\n        //\
    \ Act\n\n        int actualResult = calculator.Add(a, b);\n\n        // Assert\n\
    \n        Assert.AreEqual(expectedResult, actualResult);\n\n    }\n\n // More\
    \ tests follow for subtraction, multiplication, etc.\n\n}\n\nAdditional Resources\n\
    \n● Roy Osherove: The Art of Unit Testing: Naming Tests  [https://osherove.com/blog/2005/4/3/naming-standards-for-unit-tests.html](https://osherove.com/blog/2005/4/3/naming-standards-for-unit-tests.html)\n\
    \n●     NCrunch: Good Unit Test Naming Conventions  [https://www.ncrunch.net/documentation/reference_writing_good_test_names](https://www.ncrunch.net/documentation/reference_writing_good_test_names)\n\
    \nTest Structure as a Success Factor\n\nWell-organized tests are easier to understand,\
    \ debug, and update when requirements change. As your test suite grows, the investment\
    \ in proper structure pays huge dividends.\n\nNext Up\n\nYour IDE can significantly\
    \ enhance your testing workflow. In the next chapter, we’ll see how to leverage\
    \ Rider’s features to optimize your unit testing experience.\n\nLet’s get those\
    \ tests streamlined with your IDE!\n\n# Leveraging Rider IDE: Optimizing Your\
    \ Unit Testing Workflow\n\nRider, with its rich feature set and intelligent code\
    \ insights, can significantly enhance your unit testing experience. Let’s explore\
    \ how it can streamline your workflow.\n\n1\\. Seamless Visual Studio Compatibility\
    \ (If Relevant)\n\nIf you’re transitioning from Visual Studio, Rider offers extensive\
    \ support for NUnit projects and the familiar Test Explorer interface. This eases\
    \ the learning curve.\n\n2\\. Test Discovery and Execution\n\n● Test Explorer\
    \ Integration: Rider automatically discovers NUnit tests and integrates with its\
    \ Test Explorer-like window.\n\n● Run Tests at Many Levels: Execute individual\
    \ tests, entire test fixtures, groups of tests, or your whole test suite directly\
    \ from the IDE.\n\n● Instant Feedback: Clear indicators for passed (green), failed\
    \ (red), or skipped (blue) tests.\n\n3\\. Debugging Power at Your Fingertips\n\
    \n● Step Through Test Code: Use breakpoints and debug tests just like your application\
    \ code. Analyze variables, step through execution paths, and quickly identify\
    \ the root cause of failures.\n\n● Live Stack Trace: When a test fails, Rider’s\
    \ stack trace lets you jump straight to the failing line in your code.\n\n4\\\
    . Navigation and Code Refactoring Within Tests\n\n● Go to Declaration/Implementation:\
    \ Effortlessly navigate between test code and corresponding production code using\
    \ keyboard shortcuts (like F12).\n\n● Refactor with Confidence: Rider’s refactoring\
    \ tools work reliably within test code. Rename methods, introduce parameters,\
    \ etc., while tests automatically update, keeping them in sync.\n\n5\\. Code Generation\
    \ and Snippets\n\n● Generating Test Fixtures: Rider can create basic test fixture\
    \ structures ([TestFixture], empty test methods) for you, saving you keystrokes.\n\
    \n● NUnit Snippets: Use built-in snippets (e.g., type ‘test’ and expand) for common\
    \ NUnit test structures for rapid test writing.\n\n6\\. Continuous Testing (Advanced\
    \ Feature)\n\n● Background Test Execution: Rider can continuously run relevant\
    \ tests in the background as you code. Get immediate feedback on whether changes\
    \ accidentally break something.\n\n● Inline Notifications: See pass/fail results\
    \ subtly integrated within the code editor, letting you address test failures\
    \ without switching context.\n\nExample Workflow\n\n1.  Write a Test (or let Rider\
    \ generate the basics)\n\n2.  Discover: Rider adds your test to the testing tree.\n\
    \n3.  Run and Debug: Execute the test. If it fails, debug to pinpoint the problem\
    \ in your production code.\n\n4.  Refactor: Fix your production code or tests\
    \ with Rider’s refactoring tools.\n\n5.  Continuous Testing (Optional): Get real-time\
    \ code change impact as you work.\n\nAdditional Resources"
