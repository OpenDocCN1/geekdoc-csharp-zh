  trans: "\n\n# 测试类型速查表：[`abstracta.us/blog/quality-assurance/test-types-cheatsheet`](https://abstracta.us/blog/quality-assurance/test-types-cheatsheet)\n\
    \n## 了解你的测试需求\n\n最适合你项目的测试组合取决于其独特的需求。随着你深入单元测试，你也将洞察何时其他测试类型变得至关重要，以确保你的 C# 应用真正交付价值。\n\
    \n接下来，让我们通过理解**测试金字塔**概念来建立基础！\n\n## 构建坚实的基础：测试金字塔概念\n\n想象正在盖房子。你从一个坚固的基础开始，然后在其上方层层。测试金字塔是软件测试中类似的概念。它是一个强大的视觉比喻，引导你优先考虑不同的测试类型，以创建一个稳健且高效的测试策略。\n\
    \n### 理解分层\n\n经典的测试金字塔通常由三个主要层组成：\n\n1. `Unit Tests`（基础）：这形成了金字塔最大且最重要的部分。在这里，你专注于隔离测试单个代码单元（如函数或方法）。\n\
    2. `Integration Tests`（中间层）：较小的一层，专门测试多个单元或组件如何协同工作。\n3. `End-to-End (E2E) Tests`（顶部）：金字塔最小的部分。这些测试模拟真实世界的用户场景，通常跨越整个应用程序，包括\
    \ UI、数据库和其他系统。\n\n### 为什么用金字塔？\n\n以下是这种金字塔结构重要的原因：\n\n* **速度**：`Unit tests` 运行极快，在开发过程中提供快速反馈。`Integration`\
    \ 和 `E2E tests` 的执行通常较慢。\n* **成本**：`Unit tests` 的编写和运行成本相对较低。在金字塔上的位置越高，你的测试可能变得越复杂、越耗时且可能越脆弱。\n\
    * **重点**：金字塔鼓励你关注在单元级别上测试应用程序的核心逻辑，因为那里最可能出现  Bug。\n\n### 理想比例\n\n虽然测试比例会根据你的项目性质而异，但通用指南是：拥有大量的\
    \ `unit tests` 基础，较少量的 `integration` 测试，以及少数针对性的 `E2E tests`。\n\n### 测试金字塔的益处\n\
    \n* **健壮的项目**：坚实的 `unit tests` 基础随着时间的推移能提高代码的稳定性。\n* **优化投入**：金字塔引导你走向平衡的测试策略，实现投资回报最大化。\n\
    * **更快的反馈循环**：通过更多的 `unit tests` 及其快速执行，你可以尽早获得潜在问题的早期信号。\n\n### 额外资源\n\n* [介绍软件测试金字塔：[`martinfowler.com/articles/practical-test-pyramid.html`](https://martinfowler.com/articles/practical-test-pyramid.html)]\n\
    * [测试金字塔：更好的自动化软件测试指南：[`www.browserstack.com/guide/testing-pyramid-for-test-automation`](https://www.browserstack.com/guide/testing-pyramid-for-test-automation)]\n\
    \n## 超越经典金字塔\n\n需要注意的是，经典的测试金字塔是一个概念模型，不应被视为僵化的教条。某些项目可能从稍微修改的形状中受益。关键在于为你的上下文找到最佳平衡。\n\
    \n### 准备深入探讨\n\n现在你已经掌握了测试金字塔的精髓，下一章将带你进入测试工具的世界。你将学习编写和执行 C# 测试所需的必备工具。\n\n让我们继续吧！\n\
    \n# 导航测试工具图谱\n\nC# 测试的世界提供了丰富的工具生态系统，使你能够编写、运行和分析自动化测试。让我们浏览一下关键类别和流行选择，帮助你为项目选择最适合的工具。\n\
    \n### 1. 测试框架\n\n这些框架为组合测试提供了结构和词汇。C# 世界中的主要参与者包括：\n\n* `NUnit`：一个成熟、广泛采用且灵活的测试框架。我们将在书后重点介绍\
    \ `NUnit`。\n* `xUnit`：一个受 `NUnit` 基本原理启发的现代、简洁且可扩展的测试框架。\n* `MSTest`：内置于 Visual\
    \ Studio 的测试框架提供了与 IDE 的无缝集成。\n\n### 2. 断言库\n\n断言库提供了一种清晰的方式来表达测试的预期结果。流行的选项包括：\n\
    \n* **内置断言**：`NUnit`、`xUnit` 和 `MSTest` 都带有自己的断言机制。\n* **Fluent Assertions（流式断言）**：为编写断言提供可读性强的、流式的语法（例如\
    \ `myResult.Should().BePositive()`）。\n* **Shouldly**：另一个关注表达性断言的断言库（例如 `myResult.ShouldBePositive()`）。\n\
    \n### 3. Mock 框架（模拟框架）\n\n模拟（Mocking）对于单元测试期间隔离你的代码至关重要。C# 的首选是：\n\n* `Moq`：强大、多功能且易于学习。支持基于状态和基于交互的测试风格。我们将在后续章节深入探讨\
    \ `Moq`。\n\n### 4. 代码覆盖率工具\n\n代码覆盖率让你了解代码中有百分之几被测试执行执行。流行的工具包括：\n\n* `dotCover`：来自\
    \ JetBrains 的强大的商业代码覆盖率工具，具有出色的 Visual Studio 和 Rider 集成。\n* `OpenCover`：用于代码覆盖率分析的免费开源替代方案。\n\
    \n### 5. 测试运行器（Test Runners）\n\n测试运行器发现并执行你的测试。它们通常集成在 IDE 或构建系统中。\n\n* `Visual\
    \ Studio Test Explorer`：Visual Studio 内置的测试运行器。\n* `ReSharper Test Runner`：JetBrains\
    \ 为 ReSharper 开发的高级测试运行器。\n\n### 选择你的工具箱\n\n这里有一个可以帮助你的简化起点：\n\n* **测试框架**：`NUnit`\n\
    * **断言库**：`Fluent Assertions`\n* **Mock 框架**：`Moq`\n* **IDE**：`Visual Studio`\
    \ 或 `Rider`\n\n### 不要感到压力\n\n这个图谱可能看起来非常大。关键是从核心工具集开始，随着你深入单元测试不断扩展你的知识。我们将关注使用\
    \ `NUnit`、`Moq` 和 IDE 集成运行器，为你提供一个强大且实用的配置。\n\n## 即将实战体验\n\n在下一章中，你将通过编写和理解第一个\
    \ C# 测试向前迈出一大步！让我们动手起来吧！\n\n# 编写你的第一个单元测试：分步指南\n\n是时候从理论转向实践了！在这一章中，你将使用 `NUnit`\
    \ 创建第一个 C# 测试。我们将逐步介绍这一过程，使其成为一次清晰且可见的体验。\n\n### 前提条件\n\n* 基础 C# 语法理解。\n* 一个像\
    \ Visual Studio 或 Rider 的 IDE（本例中使用 Rider）。\n\n### 场景：一个简单的计算器\n\n让我们想象一个带有简单\
    \ `Add` 方法的简单 `Calculator` 类：\n\n```csharp\npublic class Calculator\n{\n    public\
    \ int Add(int a, int b)\n    {\n        return a + b;\n    }\n}\n```\n\n我们的目标是编写一个单元测试来验证\
    \ `Add` 方法运行正常。\n\n### 第 1 步：创建测试项目\n\n1. 在 Rider（或你选择的 IDE）中创建一个新项目。\n2. 选择“Unit\
    \ Test Project”模板（不同 IDE 的命名可能不同）。\n3. 将项目命名为 `CalculatorTests`。\n\n### 第 2 步：安装\
    \ NUnit\n\n1. 导航到测试项目的 NuGet 包管理器。\n2. 搜索 `NUnit` 并安装该包。\n3. 考虑也安装 `NUnit3TestAdapter`\
    \ 包（这使得测试可以被 IDE 中的测试运行器发现）。\n\n### 第 3 步：编写你的第一个测试类\n\n1. 在测试项目中创建一个新的 C# 类文件。将其命名为\
    \ `CalculatorTests`（与你的计算器类名对应）。\n2. 添加必要的 `using` 语句：\n\n```csharp\nusing NUnit.Framework;\
    \ // 用于 NUnit 断言和属性\n```\n\n"
- fmt: "\n```csharp\nusing YourProjectNamespace; // Replace with the namespace of\
    \ your Calculator class\n```\n\n### Step 4: Write Your First Test Method\n\n```csharp\n\
    [TestFixture]  // Marks this class as containing tests\n\npublic class CalculatorTests\n\
    {\n    [Test]  // Marks this method as a test\n    public void Add_PositiveNumbers_ReturnsCorrectSum()\n\
    \    {\n        // Arrange\n        var calculator = new Calculator();\n     \
    \   int a = 5;\n        int b = 8;\n        int expectedResult = 13;\n       \
    \ // Act\n        int actualResult = calculator.Add(a, b);\n        // Assert\n\
    \        Assert.AreEqual(expectedResult, actualResult);\n    }\n}\n```\n\n###\
    \ Step 5: Run Your Test!\n\nUse your IDE’s built-in test runner (e.g., `Rider`s\
    \ or `Visual Studio`’s `Test Explorer`) to locate and run the test. You should\
    \ see it pass!\n\n#### Breaking it Down\n\n● **Test Structure**: NUnit tests are\
    \ defined by methods with the `[Test]` attribute within a class marked with `[TestFixture]`.\n\
    \n● **AAA Pattern**: (Arrange-Act-Assert): A common structure for tests; you set\
    \ up test data, execute the code to be tested, and assert the expected outcome.\n\
    \n● **Assertions**: NUnit provides various `Assert` methods (like `AreEqual`)\
    \ to verify results.\n\n#### Additional Resources\n\n● **NUnit Documentation**:\
    \ [https://docs.nunit.org/](https://docs.nunit.org/)\n\nCongratulations! You’ve\
    \ written your first C# unit test.\n\n#### Next Steps\n\nThis is just the beginning!\
    \ In the next chapter, we’ll dive deeper into how you can expand your tests and\
    \ ensure they’re both effective and maintainable.\n\n# Deep Dive into Unit Test\
    \ Composition: Advanced Techniques\n\nIn the previous chapter, you took your first\
    \ steps writing a simple unit test. Now, let’s go deeper and explore techniques\
    \ to make your tests more expressive, robust, and capable of handling complexity.\n\
    \n#### 1. Testing Multiple Scenarios\n\nA single test method often needs to verify\
    \ different conditions. Let’s extend our `Calculator` example:\n\n```csharp\n\
    [Test]\npublic void Add_HandlesNegativeNumbers_ReturnsCorrectSum()\n{\n    var\
    \ calculator = new Calculator();\n    // Scenario 1\n    Assert.AreEqual(-5, calculator.Add(-3,\
    \ -2));\n    //Scenario 2\n    Assert.AreEqual(2, calculator.Add(5, -3));\n}\n\
    ```\n\nInstead of separate test methods, we use multiple `Assert` statements for\
    \ various scenarios.\n\n#### 2. Parameterized Tests for Data-Driven Testing\n\n\
    Expand the concept above with NUnit’s parameterized tests:\n\n```csharp\n[Test]\n\
    public void Add_HandlesVariousInputs_ReturnsCorrectSum(\n    [Values(2, 5, 8)]\
    \ int a,\n    [Values(-4, 0, 3)] int b,\n    [Values(-2, 5, 11)] int expectedResult)\n\
    {\n    var calculator = new Calculator();\n    Assert.AreEqual(expectedResult,\
    \ calculator.Add(a, b));\n}\n```\n\nNUnit will run the test multiple times, each\
    \ with a combination of the provided parameters!\n\n#### 3. The Art of Test-Driven\
    \ Development (TDD)\n\nWhile not strictly a composition technique, let’s introduce\
    \ TDD:\n\n● **Red**: First, write a failing test for a feature that doesn’t exist\
    \ yet.\n\n● **Green**: Write the minimal implementation to only make the test\
    \ pass.\n\n● **Refactor**: Improve your code’s design while ensuring tests still\
