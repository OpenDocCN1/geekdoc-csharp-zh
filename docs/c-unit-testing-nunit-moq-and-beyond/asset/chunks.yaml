  trans: "\n\n单元测试的核心原则是隔离。然而在现实世界中，代码单元通常会与其他组件产生交互。让我们探索如何管理这些依赖关系，以确保单元测试仍然集中在想要测试的代码上。\n\
    \n## 1. 外部依赖带来的问题\n\n- **缓慢**：依赖外部系统会导致测试运行变慢，从而影响开发反馈循环。\n- **不可靠性**：外部系统可能会宕机或出现不可预测的行为（如网络故障等），导致测试不稳定（flaky\
    \ tests）。\n- **缺乏控制**：当完全依赖外部系统时，无法针对错误条件或边界情况进行模拟。\n\n## 2. 隔离测试代码的技术\n\n- **抽象（接口）**：为代码的依赖定义接口。在测试期间，可以用测试双胞替换真实的实现。\n\
    \n```csharp\npublic interface IEmailService {\n    void SendEmail(string to, string\
    \ subject, string body);\n}\n```\n\n- **测试双胞**：替代真实依赖的通用术语。常见类型包括：\n    - **伪造（Fakes）**：工作但简化的实现（使用内存存储而非完整数据库）。\n\
    \    - **存桩（Stubs）**：为预定义的场景提供固定的响应。\n    - **模拟（Mocks）**：复杂的双胞，允许你验证调用是否按预期发生（我们将在后续章节讨论）。\n\
    \n## 3. 示例：隔离写入器\n\n假设有一个向文件写入类：\n\n```csharp\npublic class OrderProcessor {\n\
    \    private readonly IFileWriter _fileWriter;\n    public OrderProcessor(IFileWriter\
    \ fileWriter) {\n        _fileWriter = fileWriter;\n    }\n\n    public void Process(Order\
    \ order) {\n        // ... 处理订单\n        _fileWriter.WriteToFile(\"order.txt\"\
    , order.ToString());\n    }\n}\n```\n\n注意 `OrderProcessor` 并没有直接创建文件。它依赖于接口 `IFileWriter`，使其变得“可测试”。在单元测试中，你可以提供一个在内存中记录数据的\
    \ `IFileWriter`。\n\n### 额外资源\n- Martin Fowler 关于测试双胞：[https://martinfowler.com/articles/mocksArentubs.html\n\
    \n### 关键心态转变\n让代码依赖抽象（如接口）可以提高可测试性，并通常会导致更好的设计。\n\n### 后续计划\n可靠的测试应该具有可预测的结果。在下一章节中，我们将讨论如何确保测试随时间保持一致性。让你的测试变得健壮吧！\n\
    \n# 构建可靠的测试（部分）：确保一致性和可靠性\n\n一个不可信任的测试套件比没有测试还要糟糕。让我们关注如何产生一致的结果，减少与生产代码无关的误报或意外失败。\n\
    \n## 1. 不一致性的来源\n\n- **时间问题**：依赖当前日期、时间或系统部分之间竞态条件的测试是非确定的。\n- **共享状态**：如果测试修改了全局变量或留下了改变的状态，会导致顺序相关的失败。\n\
    - **外部依赖**：如前所述，网络问题或未知状态的会导致不稳定。\n- **过度复杂的测试逻辑**：测试中过多的复杂步骤使得推理故障点变得困难。\n\n\
    ## 2. 健壮性策略\n\n- **控制时间**：`NodaTime` 等库允许你在测试中“冻结”当前日期和时间，消除基于执行时间的不一致性。\n- **强调隔离**：提醒自己在每个测试之前，通过\
    \ `[SetUp]` 方法完全重置任何状态。\n- **彻底清理**：细致地通过 `[TearDown]` 方法还原更改（删除文件、恢复数据库记录等）。\n\
    - **测试双胞（再次）**：通过用测试双胞替换外部依赖，获得其行为，使测试更具预测性。\n- **数据填充**：在处理数据源时（即使是内存数据），使用已知数据集。\n\
    \n## 3. 避免过度依赖线程或并发操作\n\n如果可能，构建单元测试以避免直接依赖多线程场景。由于时间敏感性，这些非常难以测试。对于这些情况，可能需要专门的并发测试技术，这比纯单元测试更广泛。\n\
    \n## 4. 简单作为保障\n\n清晰易懂的测试不太可能导致不稳定的隐藏假设或副作用。如果一个测试难以追踪，那么可能存在微妙的问题。\n\n## 5. 当测试失败时……\n\
    \n- **首先排除明显因素**：双检是生产代码中的真实失败，还是测试本身的问题。\n- **可靠地复现**：你能让失败持续发生吗？间歇性失败最难排查。\n\
    - **隔离根源**：将问题缩小到尽可能具体的代码单元。\n\n### 持续警惕\n维护可靠的测试套件是一项持续工作。随着项目的演进，注意新的依赖或复杂逻辑侵入测试。\n\
    \n第 3 部分：高级测试技术\n\n# 揭秘核心单元测试技术\n\n虽然基础原则至关重要，但当你成为资深单元测试从业者时，工具箱中掌握一些技巧将证明是无价的。让我们探索一些经常出现在编写良好的测试中的核心概念。\n\
    \n## 1. 等价类和边界值\n\n- **等价类**：与其测试所有可能的输入值，不如将预期类似方式处理的输入分组。例如，测试几个正数而不是每一个可能的正数。\n\
    - **边界值**：专门关注有效范围的边缘测试。例如，如果一个函数接受 18-65 岁的年龄，测试 18、65 以及边界之外的值（17, 66）。\n\n\
    ## 2. 状态验证\n\n- **直接检查状态**：代码单元运行后，断言内部属性或变量具有预期的值。\n- **基于状态的行为**：断言对象的行为根据其修改的状态以正确的方式改变。例如，在取款操作后，银行账户的\
    \ `getBalance()` 方法应该返回较低的值。\n\n## 3. 错误处理和异常\n\n- **预期异常**：使用 NUnit 属性如 `[ExpectedException]`\
    \ 确保代码对无效输入或错误条件抛出正确的异常。\n- **检查异常详情**：不仅看异常类型。验证异常包含的任何自定义消息或数据是否正确。\n\n## 4.\
    \ 与协作者的交互测试\n\n- **并非完全隔离**：虽然单元测试应该专注于一个单元，但有时它们需要涉及单元如何与其依赖项协作。\n- **模拟框架（即将到来！）**：这些将成为你控制和验证组件间交互的重要工具，我们将在后续章节深入探讨。\n\
    \n### 示例：用“技术”思考\n\n让我们重新回到 `Calculator`，增加一个新方法：\n\n```csharp\npublic double\
    \ SquareRoot(double num) {\n    if (num < 0) \n        throw new ArgumentException(\"\
    无法计算负数的平方根\");\n    return Math.Sqrt(num);\n}\n```\n\n应用这些技术：\n\n- **等价类 / 边界**：测试零、几个正数、大正数。\n\
    - **错误处理**：测试负数输入是否抛出 `ArgumentException`。\n\n"
- fmt: "\n## State Verification (Less Applicable Here): Since the output is a direct\
    \ calculation, there’s not much internal state to check.\n\n## Additional Resources\n\
    \n● Test Driven Development (TDD) Kata with calculator example by Roy Osherove:\
    \ [https://osherove.com/blog/2005/4/3/naming-standards-for-unit-tests.html](https://osherove.com/blog/2005/4/3/naming-standards-for-unit-tests.html)\n\
    \n## Beyond the Basics\n\nThese techniques serve as your building blocks. Combining\
    \ them with black-box testing, parameterized tests, and a mocking framework will\
    \ give you a powerful toolset for crafting thorough unit tests.\n\n## Up Next\n\
    \nStrings are a common data type. Let’s get specific about strategies to create\
    \ robust unit tests that work with string inputs and outputs.\n\n# Mastering String\
    \ Testing Strategies, Part 1\n\nStrings are ubiquitous in software. From user\
    \ input to file contents, you’ll encounter them frequently, and string manipulation\
    \ can be tricky. Let’s develop a robust approach to testing code that works heavily\
    \ with strings\n\n### 1. Not Just About Correct Output\n\nSure, verifying that\
    \ a function produces the correct output string is essential, but string tests\
    \ need to go deeper. Consider:\n\n● Case Sensitivity: Should string comparisons\
    \ be case-sensitive or insensitive? This depends on your domain requirements.\n\
    \n● Whitespace: Are leading/trailing spaces significant? How should tabs vs. spaces\
    \ be treated?\n\n● Encoding: Especially when dealing with internationalization,\
    \ ensure your tests handle various character sets (UTF-8, etc.) correctly.\n\n\
    ### 2. Common Scenarios To Test\n\n● Concatenation: Verify results of combining\
    \ multiple strings.\n\n● Substrings: Test if correct substrings can be extracted\
    \ (starting position, length).\n\n● Searching: Look for specific substrings or\
    \ patterns within larger strings.\n\n● Trimming / Removal: Ensure whitespace or\
    \ specific characters can be removed correctly.\n\n● Formatting: If your code\
    \ formats strings (e.g., dates, currencies), test various valid and invalid inputs.\n\
    \n### 3. Test Libraries Enhance String Assertions\n\nWhile `NUnit` offers core\
    \ assertions, consider specialized string assertion libraries:\n\n● Fluent Assertions\
    \ Provides a readable, fluent syntax.\n\n```csharp\nstring formattedDate = \"\
    2023-12-22\";\n\nformattedDate.Should().StartWith(\"2023\").And.Contain(\"-12-\"\
    );\n```\n\n● Shouldly Another option with a similar assertion style.\n\n### 4.\
    \ Edge Cases\n\n● Empty Strings: How does your code behave with empty strings\
    \ as input?\n\n● Nulls: If applicable, does it handle null values gracefully?\n\
    \n● Extremely Long Strings: Performance might degrade with very large inputs.\
    \ Consider testing this if it’s a concern.\n\n#### Example: A Text Transformer\n\
    \nLet’s imagine a class with methods to manipulate text:\n\n```csharp\npublic\
    \ class TextTransformer\n{\n    public string ToTitleCase(string str) {...}\n\
    \    public string RemoveSpecialCharacters(string str) {...}\n}\n```\n\nTests\
    \ could include:\n\n● `ToTitleCase`:\n\n    ○ Mixed case input -> Correct capitalization\n\
    \    ○ All-lowercase -> Correct handling\n    ○ Null input -> Exception or empty\
    \ string (depends on your design)\n\n● `RemoveSpecialCharacters`:\n\n    ○ String\
    \ with various symbols -> Symbols removed\n    ○ Whitespace handling (is it preserved?)\n\
    \n## Additional Resources\n\n● Fluent Assertions documentation: [https://fluentassertions.com/](https://fluentassertions.com/)\n\
    \n● Shouldly documentation: [https://shouldly.github.io/](https://shouldly.github.io/)\n\
    \n## Precision Matters\n\nPay careful attention to how your domain treats strings.\
    \ Are they purely data, or do they represent something with stricter rules (e.g.,\
    \ usernames, URLs)?\n\n## Up Next\n\nIn Part 2, we’ll delve into regular expressions\
    \ and explore strategies for testing code that utilizes them.\n\nLet’s make your\
    \ string handling code rock-solid!\n\n# Mastering String Testing Strategies, Part\
    \ 2\n\nRegular expressions (RegEx) are a powerful tool for pattern matching and\
    \ string manipulation. When your code employs them, let’s arm your unit tests\
    \ to ensure their proper usage.\n\n### 1. Testing with Regular Expressions\n\n\
    ● Verification: Assert whether a string matches or doesn’t match a given RegEx\
    \ pattern. Libraries like `Fluent Assertions` often have specialized methods for\
    \ this.\n\n● Capturing Groups: If your `RegEx` extracts parts of a string, test\
    \ that the correct substrings are captured.\n\n● Edge Cases: Try invalid patterns\
    \ or complex strings that could reveal unexpected issues in your regular expressions.\n\
    \n### 2. Strategies to Control Complexity\n\n● Helper Functions: Break down complex\
    \ regular expressions into smaller, easier-to-test units if possible.\n\n● Data\
    \ Providers: Consider using `Parameterized Tests` to feed a variety of sample\
    \ inputs and expected RegEx outcomes.\n\n● Online RegEx Tools: While testing,\
    \ use tools like [https://regex101.com/](https://regex101.com/) to visualize and\
    \ experiment with patterns before embedding them in tests.\n\n### 3. Example:\
    \ Email Validation\n\nSuppose you have a basic email validator using a regular\
    \ expression:\n\n```csharp\npublic class UserAccountUtil\n{\n    public bool IsValidEmail(string\
    \ email)\n    {\n        Regex emailRegex = new Regex(@\"^\\w+@w+\\.\\w+$\");\n\
    \        return emailRegex.IsMatch(email);\n    }\n}\n```\n\nTests could include:\n\
    \n● Valid Formats: `xyz@com`\n● Invalid Formats: `noSymbol`, `some@thing`\n● Edge\
    \ Cases: with special characters\n\n### 4. Caveats of Regular Expressions\n\n\
    ● Readable but Tricky: RegEx syntax is powerful but terse.\n\n● Don’t Overuse:\
    \ Sometimes simpler string manipulation may be appropriate.\n\n## Additional Resources\n\
    \n● C# Regex Documentation: [https://docs.microsoft.com/en-us/dotnet/standard/base-types/regex](https://docs.microsoft.com/en-us/dotnet/standard/base-types/regex)\n\
    \n## Beyond the Basics\n\nIf a significant portion of your logic depends on regular\
    \ expressions, consider writing unit tests for the RegEx patterns in isolated\
    \ fashion.\n\n## Up Next\n\nArrays and collections are fundamental data structures.\
    \ Let’s explore strategies to test code that works with them.\n\n# Comprehensive\
    \ Testing Approaches for Arrays and Collections, Part 1\n\nArrays and collections\
    \ are core building blocks in software. Testing code that manipulates them requires\
    \ a tailored approach. Let’s lay the foundation for writing robust tests for this\
    \ type of code.\n\n### 1. Why Special Treatment?\n\n● Content AND Structure: You\
    \ need to verify not only the individual elements within an array or collection\
    \ but also their order, size, and potential duplicates.\n\n● Collection Types:\
    \ Lists, sets, dictionaries … each data structure exhibits distinct behaviors\
    \ that your tests need to address.\n\n● Diverse Operations: Common operations\
    \ like sorting, filtering, and searching demand specific test cases.\n\n### 2.\
    \ Key Areas of Focus\n\n● Contents:\n\n    ○ Are the expected elements present?\n\
    \    ○ In the correct order (if relevant)?\n    ○ Is a calculated result based\
    \ on the collection’s content correct?\n\n● Size:\n\n    ○ Does operation produce\
    \ a collection of the expected size?\n    ○ Boundary checks: empty collections,\
    \ and potentially very large ones\n\n● Transformation: Test that operations correctly\
    \ modify the original collection (if they are meant to), or produce a new one,\
    \ leaving the original intact.\n\n### 3. Strategies and Assertions\n\n● NUnit’s\
    \ Collection Assert: Offers methods like `Contains`, `AreEqual`, `IsSubsetOf`,\
    \ etc.\n\n```csharp\nint[] result = CalculatePrimes(10);\n\nCollectionAssert.Contains(result,\
    \ 7);\n\nCollectionAssert.DoesNotContain(result, 8);\n```\n\n● LINQ for flexible\
    \ queries: Check conditions on the contents.\n\n```csharp\nList<string> names\
    \ = GetCustomerNames();\n\nAssert.IsTrue(names.Any(name => name.StartsWith(\"\
    Alice\")));\n```\n"
