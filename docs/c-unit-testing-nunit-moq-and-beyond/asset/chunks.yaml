    ## 欢迎语与你将学到的


    ### 欢迎来到健壮 C# 代码的世界


    软件测试往往被边缘化，被视为在“真实”代码编写完成后某个时候做的无聊步骤。但随着项目的增长，其复杂性也随之增加。Bug 变得越来越难以发现，更改可能会无意中给应用程序中看似不相关的区域引入意外的问题。事实是，创建稳定、可维护的软件不仅仅是编写今天就能运行的代码。


    本书旨在改变你的观点。它将引导你通过自动化测试的力量，对你的 `C#` 应用程序建立信心，并重点关注单元测试。单元测试在开发过程中充当你的安全网，帮助你尽早隔离问题，并让你自由地进行更改，而无必时刻担心弄坏某些东西。


    ### 你将学到的


    这份全面的指南将带你开启一段旅程，改变你对测试的思考：


    -   **坚实的基础**：你将理解自动化测试的优势、不同测试类型以及它们是如何协同工作的。精通测试金字塔概念将帮助你构建测试策略。

    -   **精通单元测试**：发现核心单元测试原理、编写有效测试的最佳实践，以及处理你的 `C#` 代码各个方面（字符串、异常、事件等）的技巧。

    -   **超越基础**：探索高级单元测试概念，如参数化测试、代码覆盖率分析和测试私有方法，开启效率的新境界。

    -   **依赖管理**：学习代码解耦的重要性、依赖注入的概念，以及它如何带来更具测试性的系统。

    -   **Mock 的力量**：通过上手使用 `Moq`（一个强大的 Mock 框架）来隔离组件并模拟依赖以进行专注测试。

    -   **测试驱动开发 (TDD)**：将测试驱动开发作为一种哲学来指导你的开发过程，从一开始就编写更健壮、更易维护的代码。

    -   **行业洞察**：从专家技巧和策略中受益，应对现实世界中的测试挑战，并将测试无缝集成到你的开发工作流中。


    ### 本书适合谁


    -   **所有水平的 C# 开发者**：无论你是测试新手还是已有某些经验，本书都将扩展你的知识并巩固你的测试技能。

    -   **追求质量的团队**：学习如何提高代码可靠性并减少缺陷进入生产环境的风险，让你的开发过程更高效。

    -   **软件架构师**：发现可测试的设计如何实现更敏捷的交付。


    ### 前提条件


    你应该对 `C#` 语法有基础了解，并能够创建应用程序。


