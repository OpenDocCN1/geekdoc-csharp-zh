  trans: "\n\n## 状态验证（此处适用较少）：由于输出是直接计算的，没有多少内部状态需要检查。\n\n## 额外资源\n\n● Roy Osherove\
    \ 提供的带有计算器示例的测试驱动开发（TDD）Kata:[`osherove.com/blog/2005/4/3/naming-standards-for-unit-tests.html`](https://osherove.com/blog/2005/4/3/naming-standards-for-unit-tests.html)\n\
    \n## 基础进阶\n\n这些技术是你的构建基石。将它们与黑盒测试、参数化测试和 Mock 框架相结合，将为你提供一套强大的工具集，用于编写详尽的单元测试。\n\
    \n## 下一步\n\n字符串是一种常见的数据类型。让我们具体讨论如何创建处理字符串输入和输出的健壮单元测试的策略。\n\n# 精通字符串测试策略，第一部分\n\
    \n字符串在软件中无处不在。从用户输入到文件内容，你都会频繁遇到它们，而且字符串处理可能会非常复杂。让我们开发一种健壮的方法来测试大量处理字符串的代码。\n\
    \n### 1. 不仅仅关于正确的输出\n\n当然，验证函数产生正确的输出字符串是至关重要的，但字符串测试需要更深层次。考虑以下点：\n\n● 大写敏感性：字符串比较应该是区分大小写的还是不区分的？这取决于你的领域需求。\n\
    \n● 空格：行首/行尾的空格是否有意义？如何处理制表符与空格？\n\n● 编码：特别是在处理国际化时，确保你的测试能够正确处理各种字符集（UTF-8 等）。\n\
    \n### 2. 需要测试的常见场景\n\n● 拼接：验证组合多个字符串的结果。\n\n● 子字符串：测试是否可以提取正确的子字符串（起始位置、长度）。\n\
    \n● 搜索：在较大的字符串中查找特定的子字符串或模式。\n\n● 修剪/删除：确保可以正确删除空格或特定字符。\n\n● 格式化：如果你的代码会格式化字符串（例如日期、货币），测试各种有效和无效输入。\n\
    \n### 3. 测试库增强字符串断言\n\n虽然 `NUnit` 核心断言，但请考虑专门的字符串断言库：\n\n● Fluent Assertions 提供了可读的、流式的语法。\n\
    \n```csharp\nstring formattedDate = \"2023-12-22\";\n\nformattedDate.Should().StartWith(\"\
    2023\").And.Contain(\"-12-\");\n```\n\n● Shouldly 是另一种具有相似断言风格的选项。\n\n### 4. 边界情况\n\
    \n● 空字符串：你的代码处理空字符串输入表现如何？\n\n● Null：如果适用，它是否能优雅地处理空值？\n\n● 极长字符串：对于巨大的输入，性能可能会下降。如果担心，请考虑测试。\n\
    \n#### 示例：文本转换器\n\n让我们想象有一个操作文本方法的类：\n\n```csharp\npublic class TextTransformer\n\
    {\n    public string ToTitleCase(string str) {...}\n    public string RemoveSpecialCharacters(string\
    \ str) {...}\n}\n```\n\n测试可以包括：\n\n● `ToTitleCase`：\n\n    ○ 混合大小写输入 -> 正确的大小\n\
    \    ○ 全小写 -> 正确处理\n    ○ Null 输入 -> 异常或空字符串（取决于你的设计）\n\n● `RemoveSpecialCharacters`：\n\
    \n    ○ 带有各种符号的字符串 -> 符号被移除\n    ○ 空格处理（是否保留了？）\n\n## 额外资源\n\n● Fluent Assertions\
    \ 文档:[`fluentassertions.com/`](https://fluentassertions.com/)\n\n● Shouldly 文档:[`shouldly.github.io/`](https://shouldly.github.io/)\n\
    \n## 准确性很重要\n\n仔细注意你的领域如何处理字符串。它们是纯数据，还是代表具有更严格规则的内容（例如用户名、URL）？\n\n## 下一步\n\n\
    在第二部分，我们将深入研究正则表达式，并探索使用正则表达式的代码测试策略。\n\n让我们你的字符串处理代码稳如磐石！\n\n# 精通字符串测试策略，第二部分\n\
    \n正则表达式（RegEx）是模式匹配和字符串处理的强大工具。当你的代码使用它们时，让我们武装你的单元测试，以确保它们的正确使用。\n\n### 1. 使用正则表达式进行测试\n\
    \n● 验证：断言字符串是否匹配或不匹配给定的 RegEx 模式。像 `Fluent Assertions` 这样的库通常有专门的方法。\n\n● 捕获组：如果你的\
    \ `RegEx` 提取了字符串的部分，测试是否捕获了正确的子字符串。\n\n● 边界情况：尝试无效的模式或复杂的字符串，这可能会揭示你正则表达式中意想不到的问题。\n\
    \n### 2. 控制复杂性的策略\n\n● 辅助函数：如果可能，将复杂的正则表达式拆分为更小、更容易测试的单元。\n\n● 数据提供者：考虑使用 `参数化测试`\
    \ 提供各种样本输入和预期的 RegEx 结果。\n\n● 在线正则表达式工具：在测试时，使用 [`regex101.com/`](https://regex101.com/)\
    \ 等工具在将模式嵌入测试之前对其进行可视化和实验。\n\n### 3. 示例：电子邮件验证\n\n假设你有一个使用正则表达式的基础电子邮件验证器：\n\n\
    ```csharp\npublic class UserAccountUtil\n{\n    public bool IsValidEmail(string\
    \ email)\n    {\n        Regex emailRegex = new Regex(@\"^\\w+@w+\\.\\w+$\");\n\
    \        return emailRegex.IsMatch(email);\n    }\n}\n```\n\n测试可以包括：\n\n● 有效格式：`xyz@com`\n\
    ● 无效格式：`noSymbol`, `some@thing`\n● 边界情况：带有特殊字符\n\n### 4. 正则表达式的注意事项\n\n● 可读但复杂：RegEx\
    \ 语法强大但简洁。\n\n● 不要过度使用：有时更简单的字符串处理可能更好。\n\n## 额外资源\n\n● C# 正则表达式文档:[`docs.microsoft.com/en-us/standard/base-types/regex`](https://docs.microsoft.com/en-us/standard/base-types/regex)\n\
    \n## 基础进阶\n\n如果逻辑的大部分依赖正则表达式，考虑以孤立的方式为正则表达式编写测试。\n\n## 下一步\n\n数组和集合是基础数据结构。让我们探索处理它们的代码策略。\n\
    \n# 数组和集合的全面测试方法，第一部分\n\n数组和集合是软件的核心构建。测试操作它们的代码需要专门的方法。让我们为编写此类代码奠定基础。\n\n###\
    \ 1. 为什么特殊处理？\n\n● 内容与结构：你不仅需要验证数组或集合中的单个元素，还需要验证它们的顺序、大小和重复。\n\n● 集合类型：列表、集合、字典\
    \ … 每种数据结构都表现出需要解决的行为。\n\n● 多种操作：排序、过滤和搜索等常见操作需要特定的用例。\n\n### 2. 关注领域\n\n● 内容：\n\
    \n    ○ 期的元素是否存在？\n    ○ 是否在正确的顺序（如果相关）？\n    ○ 基于集合内容的计算结果是否正确？\n\n● 大小：\n\n\
    \    ○ 操作产生的集合大小是否正确？\n    ○ 边界检查：空集合，以及可能的巨大集合\n\n● 转换：测试操作是否正确修改了原始集合（如果旨在如此），或者产生了一个新的，保持原始集合不变。\n\
    \n### 3. 策略与断言\n\n● NUnit 的集合断言：提供了 `Contains`, `AreEqual`, `IsSubsetOf` 等方法。\n\
    \n```csharp\nint[] result = CalculatePrimes(10);\n\nCollectionAssert.Contains(result,\
    \ 7);\n\nCollectionAssert.DoesNotContain(result, 8);\n```\n\n● 使用 LINQ 进行灵活查询：检查条件。\n\
    \n```csharp\nList<string> names = GetCustomerNames();\n\nAssert.IsTrue(names.Any(name\
    \ => name.StartsWith(\"Alice\")));\n```\n\n"
- fmt: "\n# Custom Assertions\nCustom Assertions: Consider crafting your own assertions\
    \ for very specific checks relevant to your domain.\n\n## 4. Example: A Statistics\
    \ Calculator\nImagine a `StatisticsCalculator` class providing methods like:\n\
    \n- `double GetAverage(int[] numbers)`\n- `int[] GetPositiveValues(int[] numbers)`\n\
    \n### Tests Could Cover:\n- `GetAverage`:\n    - Diverse sets of numbers\n   \
    \ - Empty array -> error or a meaningful default\n- `GetPositiveValues`:\n   \
    \ - All positives, some negatives, all negatives\n    - The order of the returned\
    \ result (should it match the input?)\n\n### Additional Resources\n- NUnit documentation\
    \ : `CollectionAssert` [https://docs.nunit.org/articles/nunit/writing-tests/assertions/collection-assertions.html]\n\
    \n## Beyond the Basics\nNot all collections are created equal. Dictionaries and\
    \ sets require specialized test logic to check for the existence and correct association\
    \ of keys and values.\n\n## Up Next\nIn Part 2, we’ll expand on testing different\
    \ collection types and address potential performance considerations when dealing\
    \ with large datasets.\n\n# Comprehensive Testing Approaches for Arrays and Collections,\
    \ Part 2\n\n## Expanding Our Testing Toolkit\nLet’s delve into testing more specialized\
    \ collection types and consider performance implications when dealing with collections.\n\
    \n### 1. Dictionaries / Maps\n- **Key Existence**: Checks for the presence (and\
    \ absence) of specific keys.\n- **Value Retrieval**: Ensure fetching by key returns\
    \ the expected value with correct data types.\n- **Key-Value Association**: Verify\
    \ that keys and values have the correct relationship, especially after modifications.\n\
    \n### 2. Sets\n- **Membership**: Tests if specific elements exist within the set.\n\
    - **Uniqueness**: Ensure your set implementation upholds the ‘no duplicates’ rule.\n\
    - **Set Operations**: Test results of intersections, unions, differences, etc.,\
    \ if your code performs those.\n\n### Example: A User Permission Manager\nImagine\
    \ a class managing permissions using sets:\n\n```csharp\npublic class PermissionManager\n\
    {\n    private readonly HashSet<string> _userPermissions;\n    // ... methods\
    \ like AddPermission, RemovePermission, HasPermission etc.\n}\n```\n\n### Test\
    \ Scenarios:\n- `AddPermission`: Does a new permission get added only once, even\
    \ if added multiple times?\n- `RemovePermission`: Can existing permissions be\
    \ removed as expected?\n- `HasPermission`: Checks for correct true/false results\
    \ with varying inputs.\n\n### 3. Performance Considerations\n- **Large Collections**:\
    \ Design tests with sizable collections to spot performance bottlenecks in sorting,\
    \ searching, or filtering operations.\n- **Algorithm Choice**: The underlying\
    \ data structure and algorithms used in your code will heavily influence performance.\
    \ Understand those trade-offs.\n- **Profiling Tools**: Consider using profiling\
    \ tools to pinpoint specific slowdowns if they arise within your tests.\n\n###\
    \ 4. Immutability (If Applicable)\nIf you’re working with immutable collections,\
    \ your tests need to reflect that:\n- **Modification Verification**: Assert that\
    \ operations on an immutable collection produce a new collection rather than modifying\
    \ the existing one.\n\n### Additional Resources\n- Documentation of C# collection\
    \ types: (`List`, `Dictionary`, `HashSet`, etc.) [https://docs.microsoft.com/en-us/dotnet/csharp/programming-guide/concepts/collections]\n\
    \n## Beyond the Surface\nThorough collection testing means understanding the nuances\
    \ of the specific collection types you use and potential performance concerns\
    \ within your application’s context.\n\n## Verifying Method Return Types: Best\
    \ Practices\nWhile a cornerstone of basic unit testing is checking whether a method\
    \ returns the expected value, let’s dive deeper into strategies for ensuring your\
    \ return type assertions are accurate and robust.\n\n### 1. Not Just About the\
    \ ‘Happy Path’\n- **Data Types Matter**: Don’t just check if a value is returned,\
    \ ensure it’s the correct data type. Differentiate between a method returning\
    \ a string “10” and the number 10.\n- **Complex Return Types**: If a method returns\
    \ a class or struct, verify the contents of the returned object and any nested\
    \ properties.\n- **Nulls**: Explicitly plan for scenarios where a method might\
    \ return `null`. Does your code handle this gracefully?\n\n### 2. Precision in\
    \ Assertions\n- **Floating-point Comparisons**: Be aware of potential rounding\
    \ errors. Use assertions that check for approximate equality within an acceptable\
    \ tolerance.\n- **Collections**: (building upon previous chapters): Utilize collection-specific\
    \ assertions to check for matching size, contents, and order where relevant.\n\
    - **Custom Types**: Implement `Equals` or `GetHashCode` overrides on your custom\
    \ classes, if necessary, to make comparisons in test assertions meaningful.\n\n\
    ### Example: A Data Conversion Service\nImagine a method:\n\n```csharp\npublic\
    \ double ConvertTemperature(int celsius) { ... }\n```\n\n### Tests Could Cover:\n\
    - **Type**: `Assert.IsInstanceOf<double>(result)`.\n- **Accuracy**: Ensure a few\
    \ known Celsius to Fahrenheit conversions are correct.\n- **Unexpected Input**:\
    \ Validate behavior if non-numeric input is provided (exception, default value?)\n\
    \n### 3. Test Libraries Enhance Type Checks\nConsider libraries to augment your\
    \ assertions:\n- **Fluent Assertions**: Provides a readable way to assert object\
    \ types:\n```csharp\nobject result = GetResult();\nresult.Should().BeOfType<Invoice>();\n\
    ```\n- **Shouldly**: Similar fluent-style type checking.\n\n### 4. Edge Cases\n\
    - **Enums**: If a method returns an enum, check valid values and potentially invalid\
    \ ones to ensure graceful handling.\n- **Consider Design**: Should your methods\
    \ signal errors through return values (e.g., special result codes), or should\
    \ they throw exceptions? Your tests need to align with this design choice.\n\n\
    ### Additional Resources\n- NUnit’s `IsInstanceOf` Constraint: [https://docs.nunit.org/articles/nunit/writing-tests/constraints/isinstanceof.html]\n\
    \n## Beyond the Basics\nThe complexity of your return types directly influences\
    \ the complexity of your tests. For intricate custom types, this might even involve\
    \ writing mini-test suites specifically for those types to guarantee correct behavior.\n\
    \n## Tackling Void Methods: Testing Strategies and Considerations\nVoid methods,\
    \ those lacking an explicit return value, present a unique challenge. They often\
    \ produce side effects: modifying a state, sending a notification, or interacting\
    \ with external systems. How do we prove they did what they were supposed to?\n\
    \n### 1. The Indirect Approach\nSince you cannot directly assert on a void method’s\
    \ return value, you need to observe its impact on the system:\n- **State Changes**:\
    \ If a method modifies an object’s properties or fields, assert those changes\
    \ after the method call.\n- **Collaborator Calls**: Use mocking frameworks (which\
    \ we’ll cover in-depth later) to verify that a void method invokes other components\
    \ in your system with the expected parameters.\n- **External Interactions**: If\
    \ the method interacts with files, databases, or network resources, test for the\
    \ presence of expected changes (file created, database record updated, etc.)\n\
    \n### 2. Think Like a Detective\nTesting void methods is about following the “breadcrumbs”:\n\
    - **What Traces Are Left?**:\n    - Did the method update a property visible for\
    \ inspection?\n    - Does it raise events?\n    - Are logs generated?\n- **Testable\
    \ Seams**: If direct inspection is difficult, consider refactoring to introduce\
    \ points in your code that expose the state specifically for testing.\n\n### Example:\
    \ A File Writer\nImagine a void method:\n\n```csharp\npublic void WriteMessageToFile(string\
    \ message, string filename)\n{\n    // File writing logic...\n}\n```\n\n### Tests\
    \ Could:\n- Check file existence: Assert that a file with the given name was created.\n\
    - Verify Content: Read the file to confirm the expected message was written.\n"
