    \ allow you to verify if interactions and calls happened as expected. (We’ll discuss\
    \ these more in upcoming chapters)\n\n3\\. Example: Isolating a File Writer\n\n\
    Let’s imagine a class that writes data to a file:\n\npublic  class  OrderProcessor\n\
    \n {\n\n    private  readonly  IFileWriter _fileWriter;\n\n    public  OrderProcessor(IFileWriter\
    \ fileWriter)\n\n    {\n\n_fileWriter = fileWriter;\n\n    }\n\n    public  void\
    \  Process(Order order)\n\n    {\n\n       // ... process the order\n\n       _fileWriter.WriteToFile(\"\
    order.txt\", order.ToString());\n\n    }\n\n }\n\nNotice that  OrderProcessor\
    \ doesn’t directly create a file. It depends on an interface  IFileWriter, making\
    \ it “testable.”\n\nIn a Unit Test: You could provide a fake  IFileWriter that\
    \ records data in memory instead of hitting the file system.\n\nAdditional Resources\n\
    \n●     Martin Fowler on Test Doubles:  [https://martinfowler.com/articles/mocksArentStubs.html](https://martinfowler.com/articles/mocksArentStubs.html)\n\
    \nKey Mindset Shift\n\nDesigning your code to depend on abstractions (like interfaces)\
    \ improves testability and often leads to better overall design due to increased\
    \ flexibility.\n\nNext Up\n\nReliable tests should have predictable outcomes.\
    \ In the next chapter, we’ll discuss ways to ensure your tests remain consistent\
    \ and dependable over time.\n\nLet’s make your tests robust!\n\n# Building Trustworthy\
    \ Tests, Part 2: Ensuring Consistency and Reliability\n\nA test suite you can’t\
    \ trust is worse than no tests at all. Let’s focus on how to guarantee your tests\
    \ produce consistent results, minimizing the chance of false alarms or unexpected\
    \ failures unrelated to actual changes in your production code.\n\n1\\. Sources\
    \ of Inconsistency\n\n● Timing Issues: Tests that rely on the current date, time,\
    \ or race conditions between different parts of the system can be non-deterministic.\n\
    \n● Shared Mutable State: If tests modify global variables or leave resources\
    \ in an altered state, it can lead to order-dependent failures.\n\n● External\
    \ Dependencies: As discussed earlier, network issues or a database in an unknown\
    \ state can lead to instability.\n\n● Overly-Complex Test Logic: Too many intricate\
    \ steps in a test make it harder to reason about potential failure points.\n\n\
    2\\. Strategies for Robustness\n\n● Control Time: Libraries like NodaTime can\
    \ let you “freeze” the current date and time within tests, eliminating inconsistencies\
    \ based on when the test was executed.\n\n● Emphasis on Isolation: Remind yourself\
    \ of the core unit testing principle. Double-check your setup ([SetUp]) methods\
    \ to fully reset any state before every test.\n\n● Clean Up Thoroughly: Ensure\
    \ your  [TearDown] methods meticulously reverse changes (delete files, restore\
    \ database records, etc.)\n\n● Test Doubles (Again): By substituting external\
    \ dependencies with test doubles, you gain control over their behavior, leading\
    \ to more predictable tests.\n\n● Seeding Data: When working with data sources\
    \ (even in-memory ones), start with a known, pre-populated dataset for each test.\n\
    \n3\\. Avoid Over-Dependence on Threading or Concurrent Operations\n\nIf possible,\
    \ structure unit tests to avoid direct reliance on multithreading scenarios. These\
    \ can be notoriously tricky to test consistently due to timing sensitivities.\
    \ For those cases, specialized techniques for concurrency testing might be required,\
    \ which is often a broader topic than pure unit testing.\n\n4\\. Simplicity as\
    \ a Safeguard\n\nClear, easy-to-understand tests are less likely to have hidden\
    \ assumptions or side effects leading to flakiness. If a test is hard to follow,\
    \ there’s a greater chance of subtle issues.\n\n5\\. When a Test Fails…\n\n● First,\
    \ Rule Out the Obvious: Double-check if it’s a genuine failure in your production\
    \ code and not an issue within the test itself.\n\n● Reproduce Reliably: Can you\
    \ make the failure happen consistently? Intermittent failures are the most difficult\
    \ to troubleshoot.\n\n● Isolate the Root Cause: Narrow down the problem to the\
    \ most specific code unit possible.\n\nContinuous Vigilance\n\nMaintaining a reliable\
    \ test suite is an ongoing effort. As your project evolves, be mindful of new\
    \ dependencies or complex logic creeping into your tests that might erode their\
    \ consistency.\n\nSection 3:\n\nAdvanced Unit Testing Techniques\n\n# Unveiling\
    \ Core Unit Testing Techniques\n\nWhile the foundational principles remain essential,\
    \ as you become a seasoned unit testing practitioner, having some go-to techniques\
    \ in your arsenal will prove invaluable. Let’s explore a few core concepts that\
    \ will frequently appear in well-crafted unit tests.\n\n1\\. Equivalence Classes\
    \ and Boundary Values\n\n● Equivalence Classes: Instead of testing every possible\
    \ input value, group inputs that are expected to be processed similarly. For instance,\
    \ testing with a few positive numbers instead of every conceivable positive number.\n\
    \n● Boundary Values : Specifically focus tests on the edges of valid input ranges.\
    \ For example, if a function accepts ages 18-65, test with 18, 65, and values\
    \ right outside the boundaries (17, 66).\n\n2\\. State Verification\n\n● Directly\
    \ Checking State: After a unit of code runs, assert that internal properties or\
    \ variables have the expected values.\n\n● State-Based Behavior: Assert that an\
    \ object’s behavior changes in the correct way based on its modified state. For\
    \ example, after a  withdraw operation, a bank account’s  getBalance() method\
    \ should return a lower value.\n\n3\\. Error Handling and Exceptions\n\n● Expect\
    \ Exceptions: Use NUnit attributes like  [ExpectedException] to ensure your code\
    \ throws the right type of exception for invalid input or error conditions.\n\n\
    ● Inspect Exception Details: Go beyond just the type of exception. Verify if any\
    \ custom messages or data contained within the exception are correct.\n\n4\\.\
    \ Interaction Testing with Collaborators\n\n● Not in Complete Isolation: While\
    \ unit tests should focus on one unit, sometimes they need to involve how a unit\
    \ collaborates with its dependencies.\n\n● Mocking Frameworks (Coming Soon!):\
    \ These will become your essential tool for controlling and verifying interactions\
    \ between components, which we’ll delve into in upcoming chapters.\n\nExample:\
    \ Thinking in ‘Techniques’\n\nLet’s revisit our  Calculator, with a new method:\n\
    \npublic  double  SquareRoot(double num)\n\n {\n\n if  (num <  0)  throw  new\
    \  ArgumentException(\"Cannot calculate square root of a negative number\");\n\
    \n    return Math.Sqrt(num);\n\n }\n\nApplying the techniques:\n\n● Equivalence\
    \ Classes / Boundary: Test with zero, a few positive values, large positive values.\n\
    \n● Error Handling: Test that a negative input throws an  ArgumentException."
