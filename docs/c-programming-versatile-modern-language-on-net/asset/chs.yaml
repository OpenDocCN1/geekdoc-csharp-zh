  \ `Key Vault` 以及基于角色的访问控制 (`RBAC`) 来保护云资源。\n\n示例：从 `Azure Key Vault` 访问密钥。\n\n```csharp\n\
  using Azure.Identity;\nusing Azure.Security.KeyVault.Secrets;\nusing System;\nusing\
