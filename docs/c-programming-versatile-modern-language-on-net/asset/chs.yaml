  my-encryption-key\");\nstring key = secret.Value;\n```\n\n## 应用程序组件的安全\n\n应用程序组件的安全涉及将安全实践应用于应用程序架构的不同部分。\n\
  \n### 1. Web 应用的安全\n\n为 Web 应用实施安全实践，包括输入验证、输出编码以及使用安全的库和框架。\n\n```csharp\n// Example:\
  \ Input validation using data annotations\npublic class UserModel\n{\n    [Required]\n\
