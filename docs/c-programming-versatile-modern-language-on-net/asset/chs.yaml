  \n### 1. 增强的跨平台支持\n#### 扩展到更多平台\n`.NET` 通向统一平台的之旅始于 `.NET Core`，并将随着 `.NET 8` 及后续版本继续。。进旨在提供无缝的跨平台支持，让开发者更容易创建在\
