  \ is over 30 years old.\");\n        }\n    }\n\n    public static void Main()\n\
  \    {\n        var person = new Person(\"Alice\", 35);\n        PrintPersonInfo(person);\n\
  \    }\n}\n```\n\n### 2. .NET 8 及以后\n\n### 跨平台开发\n\n随着 `.NET 8` 的发布及未来版本的到来，`Microsoft`\
