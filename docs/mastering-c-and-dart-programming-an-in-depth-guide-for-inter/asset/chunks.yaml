    ```\n\n在这里，`Greet` 函数接收一个字符串类型的参数 `name` 并返回一个问候消息。\n\n### 返回值\n\n函数还可以返回值，将函数的输出结果返回给调用者。\n\
    \n```csharp\nint Square(int number)\n{\n  return number * number;\n}\n\nint result\
