    # **Chapter 11: Working with Collections and Generics**


    Welcome to the realm of collections and generics in C#! In this chapter, we''ll
    explore how to effectively manage groups of data using various collection types
    and how to create versatile and type-safe code using generics. By mastering these
    concepts, you''ll be able to manipulate and organize data in your programs with
    ease and create more robust and flexible code.


    ## Collections: Managing Groups of Data


    Collections are data structures that allow you to store and manipulate groups
    of related data items. They provide a powerful way to manage, search, and manipulate
    data efficiently.


    ### Lists: Dynamic Arrays


    A `List` is a dynamic array that can grow or shrink as needed. It provides methods
    for adding, removing, and accessing elements.


    ```csharp


    using System;


    using System.Collections.Generic;


    class Program


    {


    static void Main()


    {


    List<int> numbers = new List<int>();


    numbers.Add(5);


    numbers.Add(10);


    numbers.Add(15);


    foreach (int number in numbers)


    {


    Console.WriteLine(number);


    }


    }


    }


    ```


    In this example, we create a `List` of integers and add three numbers to it. The
    `foreach` loop then iterates through the list and prints each number.


    ### Dictionaries: Key-Value Pairs


    A `Dictionary` is a collection that stores key-value pairs. It allows you to quickly
    retrieve values based on their associated keys.


    ```csharp


    using System;


    using System.Collections.Generic;


    class Program


    {


    static void Main()


    {


    Dictionary<string, int> ages = new Dictionary<string, int>();


    ages["Alice"] = 25;


    ages["Bob"] = 30;


    ages["Charlie"] = 28;


    Console.WriteLine("Alice''s age: " + ages["Alice"]);


    }


    }


    ```


    Here, we create a `Dictionary` that maps names to ages. We retrieve and print
    Alice''s age using her name as the key.


    ### Queues and Stacks: First-In-First-Out and Last-In-First-Out


    `Queue` and `Stack` are specialized collections that implement the first-in-first-out
    (FIFO) and last-in-first-out (LIFO) data structures, respectively.


    ```csharp


    using System;


    using System.Collections.Generic;


    class Program


    {


    static void Main()


    {


    Queue<string> queue = new Queue<string>();


    queue.Enqueue("First");


    queue.Enqueue("Second");


    queue.Enqueue("Third");


    while (queue.Count > 0)


    {


    string item = queue.Dequeue();


    Console.WriteLine(item);


    }


    }


    }


