    # # Chapter 8: Error Handling and Exceptions in Dart


    In this chapter, we''ll explore the world of error handling and exceptions in
    Dart. Errors are a common part of software development, and understanding how
    to handle them gracefully is crucial for building robust and reliable applications.
    Dart provides a comprehensive exception handling mechanism to help you identify,
    handle, and recover from errors effectively.


    ## Understanding Errors and Exceptions


    ### What Are Errors and Exceptions?


    In programming, errors are unexpected events or conditions that occur during the
    execution of a program and disrupt its normal flow. These errors can be caused
    by various factors, such as invalid inputs, hardware failures, or issues in the
    code itself. Handling errors is essential to prevent crashes and ensure that the
    program can continue running even when problems arise.


    Exceptions, on the other hand, are a specific type of error that occurs when the
    program encounters an exceptional condition that cannot be handled by normal program
    flow. Exceptions are raised by the program and can be caught and handled by the
    developer to prevent the program from terminating abruptly.


    ### Dart''s Exception Hierarchy


    Dart has a rich exception hierarchy that categorizes exceptions based on their
    type and origin. At the top of the hierarchy is the `Error` class, which represents
    the most general form of runtime errors. Below `Error`, there are several built-in
    exception classes, such as `Exception`, `FormatException`, and `StateError`, each
    serving a specific purpose.


    Here are some common exception classes in Dart:


    - `Exception`: The base class for all exceptions that do not represent errors.


    - `FormatException`: Raised when a string cannot be parsed as expected, such as
    when converting a string to a numeric type.


    - `StateError`: Indicates an invalid state in the program.


    - `TypeError`: Raised when an operation is performed on an object of an incompatible
    type.


    - `RangeError`: Indicates that an index or value is out of range.


    - `AssertionError`: Raised when an assertion fails.


    By using the appropriate exception classes, you can categorize errors and handle
    them accordingly.


    ## Handling Exceptions


    ### The `try`, `catch`, and `finally` Blocks


    Dart provides a structured way to handle exceptions using `try`, `catch`, and
    `finally` blocks.


    - The `try` block contains the code that may raise an exception.


    - The `catch` block is used to catch and handle exceptions.


    - The `finally` block contains code that runs regardless of whether an exception
    is thrown or not.


    Here''s the basic syntax of exception handling in Dart:


    ```dart


    try {


    // Code that may raise an exception.


    } catch (exception) {


    // Code to handle the exception.


    } finally {


    // Code that runs regardless of whether an exception was thrown.


    }


    ```


    Let''s look at an example:


    ```dart


    void main() {


    try {


    var result = 10 ~/ 0; // Attempting to divide by zero.


    print("Result: $result");


    } catch (e) {


    print("Error: $e");


    } finally {


    print("Execution completed.");


    }


    }


    ```


    In this example, the `try` block contains the division operation, which will raise
    a `IntegerDivisionByZeroException` because division by zero is not allowed. The
    `catch` block catches the exception, and the `finally` block always executes,
    ensuring that the program continues to run even after an exception occurs.


    ### Catching Specific Exceptions


    You can catch specific types of exceptions by specifying the exception type in
    the `catch` block. This allows you to handle different types of exceptions differently.


    ```dart


    void main() {


    try {


    var result = 10 ~/ 0; // Attempting to divide by zero.


    print("Result: $result");


    } on IntegerDivisionByZeroException {


    print("Cannot divide by zero.");


    } catch (e) {


    print("Error: $e");


    } finally {


    print("Execution completed.");


    }


    }


    ```


    In this modified example, we use `on IntegerDivisionByZeroException` to catch
    the specific exception type. This way, we can provide a more informative error
    message when a division by zero occurs.


    ### Rethrowing Exceptions


    Sometimes, you may want to catch an exception, perform some actions, and then
    rethrow the same exception to propagate it further up the call stack. Dart allows
    you to rethrow exceptions using the `rethrow` keyword within a `catch` block.


    ```dart


    void validateAge(int age) {


    try {


    if (age < 0) {


    throw FormatException("Age cannot be negative.");


    }


    } catch (e) {


    print("Validation failed: $e");


    rethrow; // Rethrow the exception.


    }


    }


    void main() {


    try {


    validateAge(-5); // Calling a function that throws an exception.


    } catch (e) {


    print("Error: $e");


    }


    }


    ```


    In this example, the `validateAge` function checks if the provided age is negative
    and throws a `FormatException` if it is. The `rethrow` statement in the `catch`
    block allows the exception to propagate up to the calling code, preserving the
    original exception information.


    ### Custom Exceptions


    In addition to built-in exceptions, Dart allows you to create custom exceptions
    by extending the `Exception` class or one of its subclasses. Custom exceptions
    are useful when you need to represent specific error conditions in your application.


    ```dart


    class CustomException implements Exception {


    final String message;


    CustomException(this.message);


    @override


    String toString() => message;


    }


    void main() {


    try {


    throw CustomException("This is a custom exception.");


    } catch (e) {


    print("Caught custom exception: $e");


    }


    }


    ```


    In this example, we define a custom exception class `CustomException` that extends
    `Exception`. We provide a constructor that accepts a message, and we override
    the `toString` method to return the message when the exception is printed. Custom
    exceptions allow you to create meaningful and informative error messages tailored
    to your application''s needs.


    ## Exception Propagation


    When an exception is thrown in a Dart program, it starts looking for a `catch`
    block that can handle it. If the current function doesn''t have a `catch` block
    that matches the exception type, the exception propagates up the call stack to
    the nearest enclosing `try-catch` block that can handle it. If no suitable `catch`
    block is found, the program terminates with an unhandled exception error.


    ```dart


    void innerFunction() {


    throw Exception("An error occurred in innerFunction.");


    }


    void outerFunction() {


    try {


    innerFunction();


    } catch (e) {


    print("Caught exception in outerFunction: $e");


    }


    }


    void main() {


    outerFunction();


    }


    ```


    In this example, an exception is thrown in `innerFunction`, but it is caught and
    handled in the `catch` block of `outerFunction`. This prevents the program from
    terminating due to an unhandled exception.


    ## Assertions


    Assertions are a way to check whether certain conditions hold true during program
    execution. Dart provides two types of assertions: `assert` and `assert()`.


    - The `assert` statement is used to assert that a condition is true. If the condition
    is false, it throws an `AssertionError`. It is typically used for debugging and
    development purposes and is removed in production code.


    ```dart


    void divide(int a, int b) {


    assert(b != 0, "Division by zero is not allowed.");


    print("Result: ${a / b}");


    }


    void main() {


    divide(10, 0); // Throws AssertionError in debug mode.


