    在此例中，我们创建了两个映射：`fruits` 和 `colors`。`fruits` 映射使用了带有字符串键和双浮点值的 map 字面量，而 `colors`\
    \ 映射使用 `Map` 类构造函数创建，并对键和值进行了显式的类型注解。\n\n### 访问映射条目\n\n你可以通过键访问 map 中的值。Dart map\
