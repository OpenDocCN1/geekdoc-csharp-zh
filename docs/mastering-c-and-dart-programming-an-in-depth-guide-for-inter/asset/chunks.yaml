    ## Sets


    A set is an unordered collection of unique values. Dart''s `Set` class provides
    a way to work with sets, ensuring that no duplicate elements are allowed.


    ### Creating Sets


    You can create a set in Dart using the `Set` class constructor or by using set
    literals, denoted by curly braces `{}`.


    ```dart


    // Using set literals.


    var fruits = {''apple'', ''banana'', ''cherry''};


    // Using the Set class constructor.


    var colors = Set<String>.from([''red'', ''green'', ''blue'']);


    ```


    In this example, we create two sets: `fruits` and `colors`. The `fruits` set uses
    set literals, while the `colors` set is created using the `Set` class constructor,
    specifying the type of elements (`String`).


    ### Adding and Removing Elements


    Sets in Dart are mutable, allowing you to add and remove elements. You can use
    the `add` and `remove` methods to modify sets.


    ```dart


    var fruits = {''apple'', ''banana'', ''cherry''};


    // Adding elements.


    fruits.add(''orange'');


    fruits.addAll({''grape'', ''kiwi''});


    // Removing elements.


    fruits.remove(''banana'');


    fruits.removeAll({''cherry'', ''kiwi''});


    ```


    In this example, we modify the `fruits` set by adding and removing elements using
    the `add`, `addAll`, `remove`, and `removeAll` methods.


    ### Set Operations


    Dart sets support various set operations, such as union, intersection, difference,
    and subset checking, which can be performed using set methods and operators.


    ```dart


    var set1 = {1, 2, 3};


    var set2 = {3, 4,


    5};


    // Union of sets.


    var union = set1.union(set2); // {1, 2, 3, 4, 5}


    // Intersection of sets.


    var intersection = set1.intersection(set2); // {3}


    // Difference of sets.


    var difference = set1.difference(set2); // {1, 2}


    // Subset checking.


    var isSubset = set1.isSubsetOf(set2); // false


    ```


    In this example, we perform set operations on `set1` and `set2` using the `union`,
    `intersection`, `difference`, and `isSubsetOf` methods.


    ## Maps


    A map is an unordered collection of key-value pairs, where each key is associated
    with a value. In Dart, maps are used to represent data in a dictionary-like format.


    ### Creating Maps


    You can create a map in Dart using map literals, which consist of key-value pairs
    enclosed in curly braces `{}`.


    ```dart


    // Using map literals.


    var fruits = {


    ''apple'': 2.0,


    ''banana'': 1.5,


    ''cherry'': 3.0,


    };


    // Using the Map class constructor.


    var colors = Map<String, String>();


    colors[''red''] = ''FF0000'';


    colors[''green''] = ''00FF00'';


    ```


    In this example, we create two maps: `fruits` and `colors`. The `fruits` map uses
    map literals with string keys and double values, while the `colors` map is created
    using the `Map` class constructor with explicit type annotations for keys and
    values.


    ### Accessing Map Entries


    You can access the values in a map using their keys. Dart maps use square brackets
    `[]` to access values associated with keys.


    ```dart


    var fruits = {


    ''apple'': 2.0,


    ''banana'': 1.5,


    ''cherry'': 3.0,


    };


    var applePrice = fruits[''apple'']; // 2.0


    ```


    In this example, we access the value associated with the key `''apple''` in the
    `fruits` map, retrieving the price of an apple.


    ### Modifying Maps


    Maps in Dart are mutable, allowing you to add, update, or remove key-value pairs.


    ```dart


    var fruits = {


    ''apple'': 2.0,


    ''banana'': 1.5,


    ''cherry'': 3.0,


    };


    // Adding a new entry.


    fruits[''orange''] = 2.5;


    // Updating an existing entry.


    fruits[''banana''] = 1.2;


    // Removing an entry.


    fruits.remove(''cherry'');


    ```


    In this example, we modify the `fruits` map by adding a new entry for `''orange''`,
    updating the price of `''banana''`, and removing the entry for `''cherry''`.


    ### Iterating Over Maps


    You can iterate over the key-value pairs of a map using loops or higher-order
    functions like `forEach`.


    ```dart


    var fruits = {


    ''apple'': 2.0,


    ''banana'': 1.5,


    ''cherry'': 3.0,


    };


    // Using a for-in loop.


    for (var entry in fruits.entries) {


    var key = entry.key;


    var value = entry.value;


    print(''$key: $value'');


    }


    // Using forEach method.


    fruits.forEach((key, value) {


    print(''$key: $value'');


    });'
