    3. **HTTP 动词 (HTTP Verbs)**：REST API 使用标准的 HTTP 方法（GET, POST, PUT, DELETE 等）来对资源执行操作。每个\
    \ HTTP 方法都有特定的含义。\n4. **统一接口 (Uniform Interface)**：REST API 具有一致且统一的接口，使它们易于被理解和使用。\n\
    5. **表表示 (Representation)**：资源可以有多种表示形式，例如 JSON、XML 或 HTML，客户端可以选择它们偏好的表示形式。\n\
    \n#### RESTful 端点 (Endpoints)\n\nRESTful API 暴露了代表资源的端点（Endpoints），并定义了可以在这些资源上执行的操作。这些端点通过\
    \ URIs 标识，并对 HTTP 方法做出响应。\n\n例如，设想考虑一个用于管理书籍列表的 RESTful API。它可能具有以下端点：\n\n- `GET\
    \ /books`：获取所有书籍的列表。\n- `GET /books/{id}`：通过 ID 获取特定的书籍。\n- `POST /books`：创建一本新书。\n\
    - `PUT /books/{id}`：更新现有的书籍。\n- `DELETE /books/{id}`：通过 ID 删除某本书。\n\n#### API\
    \ 响应\n\n当你向 API 发起请求时，收到的响应通常包含以下：\n\n1. **状态码 (Status Code)**：指示请求结果的 HTTP 状态码（例如：成功的\
    \ 200，未找到的 404 等）。\n2. **头部 (Headers)**：有关响应的元数据，包括内容类型和长度。\n3. **正文 (Body)**：API\
    \ 返回的实际数据，通常为 JSON 或。\n\n#### REST 认证\n\n许多 REST API 需要身份验证以确保只有授权用户才能访问资源或执行特定操作。身份验证机制包括\
    \ API 密钥、OAuth 令牌或用户名/密码组合。\n\n## 在 Dart 中进行 HTTP 请求\n\nDart 提供了用于向 RESTful API\
    \ 发送 HTTP 请求的内置库。常用的库是 `http`。\n\n### 安装 HTTP 包\n\n要在 Dart 应用程序中使用 `http` 包，你需要在\
    \ `pubspec.yaml` 文件中添加它：\n\n```yaml\ndependencies:\n  http: ⁰.13.3\n```\n\n添加依赖后，运行\
    \ `pub get` 或 `dart pub get` 来下载并安装该包。\n\n### 发送 GET 请求\n\n要使用 `http` 包向 RESTful\
    \ API 发送 GET 请求，你可以使用 `get` 函数。这是一个如何从 API 获取书籍列表的示例：\n\n```dart\nimport 'package:http/http.dart'\
    \ as http;\nimport 'dart:convert';\n\nFuture<void> fetchBooks() async {\n  final\
    \ response = await http.get(Uri.parse('https://api.example.com/books'));\n  if\
    \ (response.statusCode == 200) {\n    // 请求成功，解析响应。\n    final data = json.decode(response.body);\n\
    \    print('Fetched books: $data');\n  } else {\n    // 请求失败，带有错误码。\n    print('Request\
    \ failed with status code: ${response.statusCode}');\n  }\n}\n```\n\n在此示例中，我们使用\
    \ `http.get` 向指定的 URL 发送 GET 请求。我们检查响应状态码来判断请求是否成功。\n\n### 发送 POST 请求\n\n要向 RESTful\
    \ API 发送带有数据的 POST 请求，你可以使用 `http` 包中的 `post` 函数。这是一个如何使用 POST 请求创建新书的示例：\n\n\
    ```dart\nimport 'package:http/http.dart' as http;\n\nFuture<void> createBook(String\
    \ title, String author) async {\n  final response = await http.post(\n    Uri.parse('https://api.example.com/books'),\n\
    \    body: {\n      'title': title,\n      'author': author,\n    },\n  );\n \
    \ if (response.statusCode == 201) {\n    // 书籍创建成功。\n  }\n}\n```\n\n"
