    Here''s the basic syntax of a `while` loop:


    ```dart


    while (condition) {


    // Code to be executed as long as the condition is true.


    }


    ```


    Let''s use a `while` loop to count down from 5 to 1:


    ```dart


    int count = 5;


    while (count > 0) {


    print(count);


    count--;


    }


    ```


    In this example, the loop runs as long as `count` is greater than 0. After each
    iteration, `count` is decremented by 1.


    ### The `do-while` Loop


    The `do-while` loop is similar to the `while` loop, but it guarantees that the
    block of code is executed at least once before checking the condition. This can
    be useful when you want to ensure that a certain task is performed before deciding
    whether to continue looping.


    Here''s the basic syntax of a `do-while` loop:


    ```dart


    do {


    // Code to be executed at least once.


    } while (condition);


    ```


    Let''s use a `do-while` loop to prompt the user for input until a valid value
    is provided:


    ```dart


    String userInput;


    bool isValid = false;


    do {


    print("Please enter a valid input: ");


    userInput = getUserInput(); // Assume this function gets user input.


    isValid = validateInput(userInput); // Assume this function validates the input.


    } while (!isValid);


    ```


    In this example, the loop continues to prompt the user for input until `isValid`
    becomes `true`.


    ### Loop Control Statements


    Dart provides loop control statements that allow you to modify the behavior of
    loops:


    #### **1\. `break`**


    The `break` statement is used to exit a loop prematurely, regardless of whether
    the loop''s condition is still `true`.


    ```dart


    for (int i = 1; i <= 10; i++) {


    if (i == 5) {


    break; // Exit the loop when i is 5.


    }


    print(i);


    }


    ```


    In this example, the loop will terminate when `i` equals 5.


    #### **2\. `continue`**


    The `continue` statement is used to skip the current iteration of a loop and proceed
    to the next iteration.


    ```dart


    for (int i = 1; i <= 5; i++) {


    if (i == 3) {


    continue; // Skip iteration when i is 3.


    }


    print(i);


    }


    ```


    In this example, the loop skips printing the number 3 and continues to iterate.


    ## Conclusion


    Control flow and loops are indispensable tools in the arsenal of every Dart programmer.
    Conditional statements, such as `if`, `else`, and `else if`, enable you to make
    decisions and execute code selectively. Loops, including `for`, `while`, and `do-while`,
    empower you to repeat tasks and perform actions iteratively.


    As you continue your Dart programming journey, you''ll frequently encounter scenarios
    where you need to control the flow of your code and repeat operations. Mastery
    of these fundamental concepts will enhance your ability to create dynamic and
    responsive Dart applications.


    # # Chapter 5: Functions and Methods in Dart


    In this chapter, we''ll delve into the world of functions and methods in Dart,
    a fundamental concept in programming. Functions allow you to encapsulate a set
    of instructions into a reusable block of code, making your programs more organized,
    modular, and efficient. Whether you''re a beginner or an experienced developer,
    mastering functions and methods is essential for writing maintainable Dart code.


    ## Understanding Functions


    ### What is a Function?


    A function is a self-contained block of code that performs a specific task or
    set of tasks. It encapsulates a series of instructions into a single unit, allowing
    you to execute those instructions by calling the function. Functions help you
    break down complex problems into smaller, manageable parts, making your code more
    readable and maintainable.


    In Dart, a function consists of the following components:


    - **Function Name**: A unique identifier that represents the function. It should
    follow Dart''s variable naming rules.


    - **Parameters (Optional)**: Values that you can pass to the function when calling
    it. Parameters allow you to provide input to the function.


    - **Return Type**: The data type of the value that the function returns, if any.
    Dart functions can return a value, or they can be void (indicating no return value).


    - **Function Body**: The block of code enclosed in curly braces `{}` that contains
    the instructions to be executed when the function is called.


    ### Declaring and Calling Functions


    Let''s start by declaring a simple function and calling it. Here''s the syntax
    for declaring a function in Dart:


    ```dart


    returnType functionName(parameters) {


    // Function body with instructions.


    // Optionally, return a value of the specified returnType.


    }


    ```


    Here''s a basic example of a Dart function:


    ```dart


    // Function that adds two numbers and returns the result.


    int add(int a, int b) {


    return a + b;


    }


    void main() {


    // Calling the add function and storing the result in a variable.


    int sum = add(5, 3);


    print("The sum is: $sum"); // Outputs: The sum is: 8


    }


    ```


    In this example:


    - We declare a function named `add` that takes two integer parameters, `a` and
    `b`, and returns an integer. Inside the function body, we perform the addition
    and return the result.


    - In the `main` function, we call the `add` function with arguments `5` and `3`.
    The result, `8`, is stored in the variable `sum`, which is then printed to the
    console.


    ### Function Parameters


    Functions can accept zero or more parameters, which are placeholders for the values
    you pass to the function when calling it. Parameters allow you to make your functions
    more flexible and versatile.


    Here''s a function with multiple parameters:


    ```dart


    // Function that greets a person.


    String greet(String name, int age) {


    return "Hello, $name! You are $age years old.";


    }


    void main() {


    String message = greet("Alice", 25);


    print(message); // Outputs: Hello, Alice! You are 25 years old.


