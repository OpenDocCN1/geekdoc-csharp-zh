  trans: "\n\n```csharp\nusing System;\nusing System.Net.Http;\nusing System.Threading.Tasks;\n\
    \nclass Program\n{\n    static async Task Main()\n    {\n        await DownloadWebsiteContentAsync();\n\
    \        Console.WriteLine(\"Website content downloaded.\");\n    }\n\n    static\
    \ async Task DownloadWebsiteContentAsync()\n    {\n        using (HttpClient client\
    \ = new HttpClient())\n        {\n            string content = await client.GetStringAsync(\"\
    https://www.example.com\");\n            Console.WriteLine(content.Substring(0,\
    \ 100)); // Display first 100 characters\n        }\n    }\n}\n```\n\n在这个示例中，我们使用\
    \ `async` 和 `await` 关键字来创建一个名为 `DownloadWebsiteContentAsync` 的异步方法。该方法使用 `HttpClient`\
    \ 异步地下载网站的内容。\n\n## 异步编程模式\n\n异步编程引入了一些模式，用于有效管理异步操作。\n\n### 触发后忘记 (Fire and Forget)\n\
    \n```csharp\nusing System;\nusing System.Threading.Tasks;\n\nclass Program\n{\n\
    \    static async Task Main()\n    {\n        Console.WriteLine(\"Starting task...\"\
    );\n        FireAndForget();\n        Console.WriteLine(\"Task started.\");\n\
    \    }\n\n    static async void FireAndForget()\n    {\n        await Task.Delay(1000);\n\
    \        Console.WriteLine(\"Fire and forget task completed.\");\n    }\n}\n```\n\
    \n在这个示例中，`FireAndForget` 方法被标记为 `async void`，这意味着是一个“触发后忘记”的方法。`Main` 方法在调用该方法时没有等待（await），允许它独立执行。\n\
    \n### Task.Run\n\n```csharp\nusing System;\nusing System.Threading.Tasks;\n\n\
    class Program\n{\n    static async Task Main()\n    {\n        Console.WriteLine(\"\
    Starting task...\");\n        await Task.Run(() => DelayAndPrint());\n       \
    \ Console.WriteLine(\"Task completed.\");\n    }\n\n    static async Task DelayAndPrint()\n\
    \    {\n        await Task.Delay(1000);\n        Console.WriteLine(\"Delayed task\
    \ completed.\");\n    }\n}\n```\n\n在这个示例中，使用 `Task.Run` 方法在单独线程上运行方法。这对于可能会阻塞主线程的\
    \ CPU 密集型操作非常有用。\n\n### 在异步代码中处理异常\n\n在异步代码中处理异常需要一些注意，因为异步任务中抛出的异常可能无法被传统的 `try-catch`\
    \ 块捕获。\n\n```csharp\nusing System;\nusing System.Threading.Tasks;\n\nclass Program\n\
    {\n    static async Task Main()\n    {\n        try\n        {\n            await\
    \ ThrowExceptionAsync();\n        }\n        catch (Exception ex)\n        {\n\
    \            Console.WriteLine(\"Exception caught: \" + ex.Message);\n       \
    \ }\n    }\n\n    static async Task ThrowExceptionAsync()\n    {\n        await\
    \ Task.Delay(100);\n        throw new Exception(\"An async exception occurred.\"\
    );\n    }\n}\n```\n\n在这个示例中，我们使用 `try-catch` 块来捕获异步方法抛出的异常。请注意，来自异步方法的异常在被捕获时，会自动包装在\
    \ `AggregateException` 中。\n\n## 结论\n\n在本章中，我们探索了 C# 异步编程的世界。我们学习了如何使用 `async`\
    \ 和 `await` 关键字创建异步方法，允许任务并发执行并提高应用程序的响应能力。我们讨论了如“触发后忘记”以及使用 `Task.Run` 有效管理异步任务等模式。\n\
    \n异步编程对于构建能够同时处理多个任务的现代应用程序至关重要，无论是从互联网下载数据、处理大型数据集还是与外部服务交互。通过掌握异步编程，你将能够创建提供流畅用户体验和高效资源利用的应用程序。因此，拥抱异步编程的力量，让你的应用程序在响应性和并发性上放彩！\n\
    \n# 第 15 章：使用 WPF (Windows Presentation Foundation) 构建用户界面\n\n欢迎来到使用 C# 和 WPF\
    \ (Windows Presentation Foundation) 进行现代用户界面开发的世界！在本章中，我们将深入研究为应用程序创建丰富且交互式用户界面。我们将探索\
    \ WPF 的核心概念、创建布局、设计控件以及处理事件。通过掌握 WPF，你将能够构建出视觉吸引力且用户友界面，从而增强应用程序的整体用户体验。\n\n##\
    \ WPF 简介\n\nWPF 是 Windows 中的一个图形子系统，为创建桌面应用程序的用户界面提供了一个强大的框架。它提供了一种灵活的基于 XAML\
    \ 的界面设计方法，允许开发者将 UI 设计与逻辑分离。\n\n### WPF 的主要特性\n\n1. **XAML (可扩展应用程序标记语言)**：WPF\
    \ 使用 XAML 来定义用户界面，实现了 UI 与后置代码（code-behind）的清晰分离。\n2. **丰富的控件**：WPF 提供了广泛的可定制控件，可以对其进行样式处理以匹配你的应用程序设计。\n\
    3. **布局灵活性**：WPF 引入了强大的布局控件，如 `Grid`、`StackPanel` 和 `DockPanel`，用于创建响应式和动态布局。\n\
    4. **数据绑定**：WPF 支持数据绑定，允许你轻松同步 UI 和后端逻辑之间的数据。\n\n## 创建简单的 WPF 应用\n\n让我们从创建一个具有基本界面的简单\
    \ WPF 应用开始。\n\n```xaml\n<Window x:Class=\"WpfApp.MainWindow\"\nxmlns=\"http://schemas.microsoft.com/winfx/2006/xaml/presentation\"\
    \nxmlns:x=\"http://schemas.microsoft.com/winfx/2006/xaml\"\nTitle=\"My First WPF\
    \ App\" Height=\"300\" Width=\"400\">\n  <Grid>\n    <TextBlock HorizontalAlignment=\"\
    Center\" VerticalAlignment=\"Center\" FontSize=\"20\">\n      Welcome to WPF!\n\
    \    </TextBlock>\n  </Grid>\n</Window>\n```\n\n在这个示例中，我们定义了一个包含 `Grid` 布局的居中\
    \ `TextBlock` 的窗口。这段 XAML 代表了应用程序的用户界面。\n\n## WPF 中的布局控件\n\nWPF 提供了多种布局控件来组织和构建用户界面中的元素。\n\
    \n### Grid 布局\n\n```xaml\n<Grid>\n  <Grid.RowDefinitions>\n    <RowDefinition\
    \ Height=\"*\"/>\n    <RowDefinition Height=\"2*\"/>\n  </Grid.RowDefinitions>\n\
    \  <TextBlock Grid.Row=\"0\" Text=\"Top Area\"/>\n  <TextBlock Grid.Row=\"1\"\
    \ Text=\"Bottom Area\"/>\n</Grid>\n```\n\n在这个示例中，我们使用 `Grid` 布局创建了两行。`TextBlock`\
    \ 元素位于不同的行。\n\n### StackPanel\n\n```xaml\n<StackPanel>\n  <Button Content=\"Click\
    \ Me\"/>\n  <Button Content=\"Or Click Me\"/>\n  <Button Content=\"Or Even Click\
    \ Me\"/>\n</StackPanel>\n```\n\n`StackPanel` 在单列或单行中排列子元素。\n\n## 样式与模板\n\nWPF\
    \ 允许使用样式和模板自定义控件的外观。\n\n### 应用样式\n\n```xaml\n<Window.Resources>\n  <Style TargetType=\"\
    Button\">\n    <Setter Property=\"Background\" Value=\"LightBlue\"/>\n    <Setter\
    \ Property=\"FontSize\" Value=\"14\"/>\n  </Style>\n</Window.Resources>\n<StackPanel>\n\
    \  <Button Content=\"Styled Button 1\"/>\n  <Button Content=\"Styled Button 2\"\
    />\n</StackPanel>\n```\n\n在这个示例中，我们为 `Window` 内的所有 `Button` 控件定义了样式。这种样式更改了按钮的背景颜色字体大小。\n\
    \n## 数据绑定\n\nWPF 的数据绑定能力允许将 UI 元素绑定到数据源，实现自动同步。\n\n### 绑定数据\n\n```xaml\n<StackPanel>\n\
    \  <TextBlock Text=\"{Binding UserName}\" FontSize=\"18\"/>\n  <TextBox Text=\"\
    {Binding UserName, Mode=TwoWay}\"/>\n</StackPanel>\n```\n\n在这个示例中，我们将 `TextBlock`\
    \ 和 `TextBox` 绑定到 `UserName` 属性。`TextBox` 中的更改会自动反映在 `TextBlock` 中。\n\n## 处理事件\n\
    \nWPF 提供了一个强大的事件系统来处理用户交互。\n\n### 事件处理\n\n```xaml\n<Button Content=\"Click Me\"\
    \ Click=\"Button_Click\"/>\n```\n\n```csharp\nprivate void Button_Click(object\
    \ sender, RoutedEventArgs e)\n{\n    MessageBox.Show(\"Button clicked!\");\n}\n\
    ```\n\n在这个示例中，我们在 XAML 中定义了一个 `Button` 并在后置代码中处理它的 `Click` 事件。\n\n"
