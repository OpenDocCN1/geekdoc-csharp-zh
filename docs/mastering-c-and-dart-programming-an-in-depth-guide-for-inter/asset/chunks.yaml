    # Chapter 3: Understanding Variables and Data Types


    In this chapter, we''ll dive deep into the fundamental building blocks of any
    programming language: variables and data types. Understanding these concepts is
    crucial as they form the basis for working with data and information in Dart.
    Whether you''re new to programming or transitioning from another language, mastering
    variables and data types in Dart will set you on the path to becoming a proficient
    developer.


    ## Variables: A Place to Store Data


    At its core, a variable is a container for holding data. Think of it as a labeled
    box where you can store different types of information, such as numbers, text,
    or complex structures. Variables allow you to manipulate and work with data in
    your programs dynamically.


    ### Declaring Variables


    To use a variable in Dart, you must declare it first. Declaration involves specifying
    the variable''s name and, optionally, its initial value and data type. Here''s
    a basic syntax for declaring variables in Dart:


    ```dart

    // Syntax: data_type variable_name = initial_value;


    int age = 25; // An integer variable named "age" with an initial value of 25.


    String name = "John"; // A string variable named "name" with an initial value
    of "John".

    ```


    Dart is a statically typed language, which means that you must specify the data
    type when declaring a variable. This type is used to determine what kind of data
    the variable can hold.


    ### Data Types


    Dart supports a variety of data types, each designed for specific types of data.
    Let''s explore some of the most commonly used data types in Dart:


    #### 1. int


    The `int` data type represents integers, which are whole numbers without a fractional
    or decimal part. For example:


    ```dart

    int age = 30; // An integer variable storing the value 30.

    ```


    #### 2. double


    The `double` data type represents numbers with a decimal point, also known as
    floating-point numbers. For example:


    ```dart

    double pi = 3.14159; // A double variable storing the value of Pi.

    ```


    #### 3. String


    The `String` data type represents text or character data, enclosed in single or
    double quotes. For example:


    ```dart

    String greeting = "Hello, Dart!"; // A string variable storing a greeting.

    ```


    #### 4. bool


    The `bool` data type represents Boolean values, which can be either `true` or
    `false`. For example:


    ```dart

    bool isDartFun = true; // A boolean variable indicating that Dart is fun.

    ```

