  trans: "\n\n```dart\n// 在两个对象上都调用 speak 方法。\n\nanimal.speak(); // 输出: Generic Animal\
    \ makes a sound\n\ndog.speak();    // 输出: Buddy barks\n\n}\n```\n\n在这个示例中，我们有一个父类\
    \ `Animal` 类，它包含一个 `name` 属性和一个 `speak` 方法。`Dog` 类是 `Animal` 的子类，并重写了 `speak`\
    \ 方法以提供它自己的实现。当我们创建这两个类的实例对象并调用 `speak` 方法时，每个对象都会表现出自己的行为。\n\n### 子类中的构造函数\n\n\
    子类可以有自己的构造函数，它们还可以使用 `super` 关键字调用父类的构造函数。这允许你初始化继承自父类的属性以及子类特有的属性。\n\n```dart\n\
    class Vehicle {\n  String brand;\n  Vehicle(this.brand);\n  void drive() {\n \
    \   print(\"$brand is moving\");\n  }\n}\n\nclass Car extends Vehicle {\n  int\
    \ doors;\n  Car(String brand, this.doors) : super(brand); // 调用父类的构造函数。\n  void\
    \ honk() {\n    print(\"Honk honk!\");\n  }\n}\n\nvoid main() {\n  // 创建父类和子类的对象。\n\
    \  Vehicle vehicle = Vehicle(\"Generic Vehicle\");\n  Car car = Car(\"Toyota\"\
    , 4);\n  // 调用两个对象的方法。\n  vehicle.drive(); // 输出: Generic Vehicle is moving\n\
    \  car.drive();    // 输出: Toyota is moving\n  car.honk();      // 输出: Honk honk!\n\
    }\n```\n\n在这个示例中，`Car` 类是 `Vehicle` 的子类，并且有它自己的属性 `doors`。`Car` 类通过 `super(brand)`\
    \ 调用父类 `Vehicle` 的构造函数来初始化继承自 `Vehicle` 的 `brand` 属性。\n\n### `super` 关键字\n\nDart\
    \ 中的 `super` 关键字用于引用父类，或调用父类的方法和构造函数。它允许子类访问并利用其父类的属性和行为。\n\n在之前的示例中，我们使用 `super`\
    \ 来调用父类的构造函数，以确保继承自父类的属性被正确地初始化。\n\n### 方法重写\n\n子类可以重写（提供它们自己的实现）继承自父类的方法。要重写一个方法，你需要在方法之前使用\
    \ `@override` 注解。\n\n```dart\nclass Shape {\n  double area() {\n    return 0.0;\
    \ // 所有形状的默认实现。\n  }\n}\n\nclass Circle extends Shape {\n  double radius;\n  Circle(this.radius);\n\
    \  @override\n  double area() {\n    return 3.14 * radius;\n  }\n}\n\nclass Square\
    \ extends Shape {\n  double side;\n  Square(this.side);\n  @override\n  double\
    \ area() {\n    return side * side;\n  }\n}\n\nvoid main() {\n  // 创建不同形状的对象。\n\
    \  Circle circle = Circle(5.0);\n  Square square = Square(4.0);\n  // 计算并打印面积。\n\
    \  print(\"Circle Area: ${circle.area()}\"); // 输出: Circle Area: 15.7\n  print(\"\
    Square Area: ${square.area()}\"); // 输出: Square Area: 16.0\n}\n```\n\n在这个示例中，我们有一个\
    \ `Shape` 父类，它拥有一个返回 `0.0` 的默认 `area` 方法。`Circle` 和 `Square` 重写了 `area` 方法以提供它们自己的实现。\n\
    \n### `is` 和 `as` 运算符\n\nDart 提供了两个运算符 `is` 和 `as`，用于处理类和类型检查：\n\n- `is` 运算符：`is`\
    \ 运算符检查对象是否是特定类的实例。如果对象是指定类的实例，则返回 `true`；否则返回 `false`。\n\n```dart\nclass Animal\
    \ {}\nclass Dog extends Animal {}\n\nvoid main() {\n  Animal animal = Dog();\n\
    \  if (animal is Dog) {\n    print(\"It's a Dog!\");\n  } else {\n    print(\"\
    It's not a Dog.\");\n  }\n}\n```\n\n在这个示例中，我们使用 `is` 运算符来检查 `animal` 对象是否是 `Dog`\
    \ 的实例，它会打印 \"It's a Dog!\"。\n\n- `as` 运算符：`as` 运算符用于类型转换。它允许你将一个对象视为指定类型的实例。如果对象不是指定的类型，它会抛出错误。\n\
    \n```dart\nclass Animal {}\nclass Dog extends Animal {\n  void bark() {\n    print(\"\
    Woof!\");\n  }\n}\n\nvoid main() {\n  Animal animal = Dog();\n  Dog dog = animal\
    \ as Dog;\n  if (dog != null) {\n    dog.bark(); // 输出: Woof!\n  }\n}\n```\n\n\
    在这个示例中，我们使用 `as` 运算符将 `animal` 对象强制转换为 `Dog`。由于 `animal` 对象确实是 `Dog` 的实例，因此转换成功，并且我们可以调用\
    \ `bark` 方法。\n\n# 第 7 章：与集合操作\n\n在本章中，我们将探索 Dart 中集合的世界。集合是基础的数据结构，用于存储和操作值组，例如列表（list）、集合（set）和映射（map）。Dart\
    \ 提供了丰富的集合类以及处理数据的强大功能。\n\n## 列表 (Lists)\n\n列表是值的有序集合，也称为元素，每个元素通过索引标识。Dart 中的列表类似于其他编程语言中的数组。\n\
    \n### 创建列表\n\n在 Dart 中，你可以使用字面量 `[]` 或 `List` 构造函数来创建列表。\n\n```dart\nvar fruits\
    \ = ['apple', 'banana', 'cherry']; // 使用字面量\nvar numbers = List<int>.generate(3,\
    \ 0); // 使用构造函数\n```\n\n### 访问列表元素\n\n你可以通过索引访问列表元素。\n\n```dart\nvar fruits =\
    \ ['apple', 'banana', 'cherry'];\nprint(fruits[0]); // 输出: apple\nprint(fruits[1]);\
    \ // 输出: banana\nprint(fruits[2]); // 输出: cherry\n```\n\n### 修改列表\n\nDart 中的列表是可变的，这意味着可以在创建后更改元素。你可以通过索引为元素赋值新值。\n\
    \n```dart\nvar fruits = ['apple', 'banana', 'cherry'];\nfruits[1] = 'orange';\
    \ // 将 banana 改为 orange\nfruits[2] = 'grape'; // 将 cherry 改为 grape\n```\n\n###\
    \ 添加和删除元素\n\nDart 提供了多种添加和删除列表元素的方法：\n\n- **添加元素**：\n  - `add(element)`：将元素添加到末尾。\n\
    \  - `insert(index, element)`：在指定的索引处插入元素。\n  - `addAll(iterable)`：将迭代量所有元素添加到末尾。\n\
    - **删除元素**：\n  - `remove(element)`：从列表中删除第一个匹配元素。\n  - `removeAt(index)`：删除指定索引处的元素。\n\
    \  - `removeLast()`：删除并返回列表最后一个元素。\n  - `removeWhere(predicate)`：删除满足给定谓词的元素。\n\
    \  - `clear()`：移除列表中的所有元素。\n\n```dart\nvar numbers = [1, 2, 3];\n// 添加元素\nnumbers.add(4);\
    \ // [1, 2, 3, 4]\nnumbers.insert(1, 5); // [1, 5, 2, 3, 4]\nnumbers.addAll([6,\
    \ 7]); // [1, 5, 2, 3, 4, 6, 7]\n\n// 删除元素\nnumbers.remove(3); // [1, 5, 2, 4,\
    \ 6, 7]\nnumbers.removeAt(1); // [1, 2, 4, 6, 7]\nnumbers.removeLast(); // [1,\
    \ 2, 4, 6]\n```\n\n"
