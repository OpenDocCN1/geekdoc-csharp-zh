    \ `fruits` 集合。\n\n### 集合操作\n\nDart 集合支持各种集合操作，如并集、交集、差集和子集检查，这些操作可以通过集合方法和运算符来实现。\n\
    \n```dart\nvar set1 = {1, 2, 3};\nvar set2 = {3, 4, 5};\n\n// 并集。\nvar union =\
