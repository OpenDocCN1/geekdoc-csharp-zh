    \ `true`，`while` 循环就会重复执行代码块。\n\n```csharp\nint number = 1;\n\nwhile (number <=\
    \ 5)\n{\n    Console.WriteLine(\"Number: \" + number);\n    number++;\n}\n```\n\
    \n这个循环将显示数字 1 到 5。\n\n### `do while` 循环\n\n`do while` 循环与 `while` 循环类似，但它无论条件的初始值如何，都能保证代码块至少执行一次。\n\
    \n```csharp\nint count = 0;\n\ndo\n{\n    Console.WriteLine(\"Count: \" + count);\n\
    \    count++;\n} while (count < 5);\n```\n\n在这里，循环将显示数字 0 到 4。\n\n## 循环控制语句\n\n\
    ### `break` 语句\n\n`break` 语句允许你提前退出循环，即使循环条件尚未满足。\n\n```csharp\nfor (int i = 1;\
    \ i <= 10; i++)\n{\n    if (i == 6)\n    {\n        break;\n    }\n    Console.WriteLine(\"\
    Value: \" + i);\n}\n```\n\n在这个示例中，循环将在 `i` 达到 6 时停止。\n\n### `continue` 语句\n\n\
    `continue` 语句允许你跳过当前迭代并继续到下一次。\n\n```csharp\nfor (int i = 1; i <= 5; i++)\n{\n\
    \    if (i == 3)\n    {\n        continue;\n    }\n    Console.WriteLine(\"Value:\
    \ \" + i);\n}\n```\n"
