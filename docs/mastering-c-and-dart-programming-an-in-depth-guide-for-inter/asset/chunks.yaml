    \ `catch` 块。如果当前函数没有匹配异常类型的 `catch` 块，异常将向上传播到最近的可以处理它的封装 `try-catch` 块。如果没有找到合适的\
    \ `catch` 块，程序将由于未处理的异常而终止。\n\n```dart\nvoid innerFunction() {\n  throw Exception(\"\
