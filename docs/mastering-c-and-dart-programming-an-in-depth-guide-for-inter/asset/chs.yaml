  \ Flutter 支持。\n\n## 选择文本编辑器\n\n如果你更倾向于轻量级的方法，或者对特定的文本编辑器有偏好，可以使用任何你选择的编辑器来编写 Dart\
  \ 代码。一些流行的选项包括：\n\n- **Sublime Text**: 一个高度可定制的文本编辑器，拥有活跃的社区以及许多可用于 Dart 开发的插件。\n\
  - **Atom**: 由 GitHub 开发的开源文本编辑器，有大量可用于 Dart 开发的包。\n- **Notepad++**: 一个适用于 Windows\
