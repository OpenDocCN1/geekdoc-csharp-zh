  \n## 尝试新功能\n\n### 预览版\n- Microsoft 定期发布 `Xamarin.Forms` 的预览版本，其中包含即将推出的功能和增强。尝试这些预览版有助于你理解最新进展并为未来的变化做好准备。\n\
