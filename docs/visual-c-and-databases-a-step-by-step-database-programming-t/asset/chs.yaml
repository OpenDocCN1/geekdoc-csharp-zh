  *(注：原文最后的代码块在逻辑上似乎不完整，已根据提供的文本内容进行对应性翻译/保留)*\n\n6. 保存（位于 `VCSDB\\Class` 文件夹中的 `5-6`\
  \ 示例）并再次运行。点击 `Edit`。注意焦点如何在两个字段之间移动。\n\n## 示例 5-6：使用 SQL 数据库\n\n## 错误捕获与处理\n\n\
  即使设计良好，错误仍然可能发生，特别是在处理数据库时。偶尔会遇到无效字段。\n\n运行时错误（在 C# 中称为异常）是可以“捕获的”。也就是说，C# 识别到错误的发生并允许你捕获它。如果错误未捕获，程序将终止。大多数运行时错误发生在尝试打开、读取、写入或保存文件时。其他常见的运行时错误包括除零、溢出（超出范围）和不的数据类型。\n\
  \n错误捕获和处理必须在应用程序中可能需要的地方实现。C# 不允许全局捕获。你至少需要在每个写入或读取数据库的方法中实现错误捕获和处理。\n\nC# 使用结构化方法来处理异常。这种结构被称为\
  \ try/catch/finally 块。使用该块的注释语法如下：\n\n```csharp\ntry\n{\n    // 这里是你尝试的代码，可能会发生\n\
  \    // 某种错误\n}\ncatch (ExceptionType ex)\n{\n    // 如果发生了 ExceptionType 类型的错误，\n\
  \    // 执行此代码\n}\ncatch (Exception ex)\n{\n    // 如果发生了任何其他错误，\n    // 执行此代码\n}\n\
  finally\n{\n    // 无论是否发生错误，都会执行此代码\n// 此块是可选的\n}\n// 执行在此继续\n```\n\n上述代码从上到下工作。它“尝试”try\
  \ 到第一个 catch 语句之间的代码。如果没有遇到错误，finally 块中的任何代码都将被执行，程序将在 try/catch/finally 块的右括号后继续。如果发生了异常（错误），程序将查找并匹配发生异常的第一个\
  \ catch 语句（你可以有多个 catch 语句，且必须有一个）。如果找到了，则执行相应块中的代码（帮助消除错误的代码——异常处理），然后执行 finally\
  \ 块中的代码，最后程序在右括号后继续执行。如果发生的错误不匹配任何特定异常，则执行“通用”catch 块中的代码，随后执行 finally 块中的代码。\n\n\
  \n\n\n\n此结构可以捕获并处理 `Visual C# Exception` 类中定义的任何类型的异常。有数百个与数据访问、输入输出函数、图形函数、数据类型和数值计算相关的可能异常。以下是一些示例异常类型的列表（它们的名称描述了相应的错误状况）：\n\
  \n| ArgumentException | ArgumentNullException |\n| :--- | :--- |\n| ArgumentOutOfRangeException\
  \ | ArithmeticException |\n| ArrayTypeMismatchException | DivideByZeroException\
  \ |\n| DllNotFoundException | Exception |\n| FormatException | IndexOutOfRangeException\
  \ |\n| DirectoryNotFoundException | EndOfStreamException |\n| FileNotFoundException\
  \ | IOException |\n| OutOfMemoryException | OverflowException |\n\n让我们仔细查看 `catch`\
  \ 块。当你定义一个 `catch` 块时，你实际上是在定义你想要捕获的异常类型。例如，如果你想捕获除以零错误（即 `DivideByZeroException`），我们使用：\n\
  \n```csharp\ncatch (DivideByZeroException ex)\n{\n    // 如果发生除以零，则执行的代码\n}\n```\n\
  \n如果在 `try` 块中发生了除以零的操作，将执行此 `catch` 语句之后的代码。你可能会在此处放置一个消息框，告诉用户发生了什么，并为他们提供解决问题的选项。为了帮助实现消息功能，你作为异常定义的可选变量（在此例中为\
  \ `ex`）有一个你可以使用的 `Message` 属性。可以通过 `ex.Message` 获取消息。\n\n可以使用 `break` 语句退出 `try`\
  \ 块。请注意，即使遇到 `break`，`finally` 块中的任何代码仍会被执行。一旦执行了 `finally` 代码，程序执行将将在关闭 `try` 块的右括号后继续。\n\
  \n捕获“未找到文件”错误的 `try`  块示例：\n\n```csharp\ntry\n{\n    // 打开文件的代码\n}\ncatch (FileNotFoundException\
  \ ex)\n{\n    // 描述错误的消息框\n    MessageBox.Show(ex.Message, \"Error\",\n    MessageBoxButtons.OK,\
  \ MessageBoxIcon.Error);\n}\nfinally\n{\n    // 关闭文件的代码（即使发生错误）\n}\n```\n\n捕获“格式化”错误的\
  \ `try` 块示例（当尝试将空文本字符串转换为数值时发生）：\n\n```csharp\ntry\n{\n    // 格式化文本字符串的代码\n}\ncatch\
  \ (FormatException ex)\n{\n    // 直接将数值值设置为 0.0 的代码\n}\nfinally\n{\n    // 关闭文件的代码（即使发生错误）\n\
  }\n```\n\n通用错误捕获程序的示例：\n\n```csharp\ntry\n{\n    // 尝试的代码\n}\ncatch (Exception ex)\n\
  {\n    // 描述错误的消息框\n    MessageBox.Show(ex.Message, \"Error\",\n    MessageBoxButtons.OK,\
  \ MessageBoxIcon.Error);\n}\nfinally\n{\n    // 完成代码块的代码\n}\n```\n\n我们只简要地查看了 Visual\
  \ C# 的结构化运行时错误处理能力。在不知道应用程序用途的情况下，很难变得更具体。你需要知道你正在寻找什么类型的错误，以及在遇到这些错误时应该采取什么纠正措施。在你构建和运行自己的应用程序时，你会遇到运行时错误。这些错误可能是由于你的代码中的错误导致的。如果是，请修复它们。但它们可能是由于用户的某些无效输入引起的错误，因为文件不符合某些规范或磁盘驱动器未就绪。你需要使用错误处理来防止此类错误关闭你的应用程序，导致用户处于挫败状态。\n\
  \n### 示例 5-7 作者表输入表单（错误捕获）\n\n如所述，错误捕获和处理应该包含在每个读取或写入数据库信息的方法中。它也应该包含在打开或保存数据库文件的方法中。\n\
  \n1. 加载完成完成示例 5-6。我们将修改此示例以包含错误捕获处理。\n2. 修改 `frmAuthors_Load` 方法以包含错误处理。更改部分已用阴影标记：\n\
