  \ CheckBox 控件（复选框）：\n\n![Image](img/00033.jpeg)\n\n复选框用于对问题提供是或否的答案。`Checked` 属性指示其状态。代码通常添加到\
  \ `CheckedChanged` 事件中。\n\n### CheckBoxList 控件（复选框列表）：\n\n![Image](img/00459.jpeg)\n\
  \n复选框列表包含一组独立的复选框控件。它是在表单上快速添加多个复选框的有用控件。对于少量（少 10 个）项目，它可以代替列表框。单个控件由 `Items` 集合定义（`Text`\
  \ 属性指定标题，Selected 指示状态）。\n\n### RadioButton 控件（单选按钮）：\n\n![Image](img/00239.jpeg)\n\
  \n单选按钮控件与 Windows 单选按钮相同。它用于从互斥选项组中选择。`Checked` 属性指示其状态。代码通常添加到 `CheckedChanged`\
  \ 事件中。\n\n### RadioButtonList 控件（单选按钮列表）：\n\n![Image](img/00256.jpeg)\n\n单选按钮列表提供了在\
  \ Web 应用程序中放置一组依赖单选按钮的简单方法。单个控件由 `Items` 集合定义（`Text` 属性指定标题，Selected 指示状态）。\n\n\
  ### Image 控件（图像控件）：\n\n![Image](img/00086.jpeg)\n\n\n\n图像在 Web 应用程序中用。它们让你的应用程序看起来更加精致。图像控件包含图形。图像（通过\
  \ `ImageURL` 属性设置）通常是 `gif` 或 `jpg` 文件。\n\n默认情况下，Web 控件以流式模式（flow mode）放置在表单上。这意味着每个元素都放置在上一个元素的右侧。这与构建\
  \ Windows 表单使用的技术不同。我们希望模拟 Windows 表单的行为。要实现这一点，请在开发环境中选择 `Tools` 菜单项并选择 `Options`。\n\
  \n![Image](img/00387.jpeg)\n\n选择 `Web Forms Designer` 和 `CSS Styling`。在“Change position\
  \ to absolute for controls …”（将控件的位置更改为绝对……）旁边勾选。然后点击 `OK`。\n\n通过此更改，有两种方法可以将 Web\
  \ 控件从工具箱移动到 Web 表单：\n\n1. 点击工具箱中的工具并按住鼠标键。将选中的工具拖到表单上。当松开鼠标键时，默认大小控件将出现在表单的左上角。这是经典的“拖放”操作。对于按钮控件，我们会看到：\n\
  \n![Image](img/00049.jpeg)\n\n2. 双击工具箱中的工具，它将以默认大小在表单上。它将位于表单的左上角。你可以移动它或调整它的大小。这里是使用此方法放置在表单上的按钮控件：\n\
  \n![Image](img/00388.jpeg)\n\n要移动已绘制的控件，点击表单中的对象（会出现一个带有箭头的交叉符号）。现在，将控件拖到新位置。松开鼠标键。\n\
  \n要调整控件的大小，点击控件使其被选中（激活）并出现尺寸句柄。使用这些句柄来调整对象的大小。\n\n![Image](img/00181.jpeg)\n\n\
  要删除控件，选择该控件使其处于状态（将出现尺寸句柄）。然后按下键盘上的 `<Delete>` 。或者，右键点击控件。将出现一个菜单。选择 `Delete` 选项。在删除控件后，你可以通过\
  \ `Edit` 菜单下的 `Undo` 选项立即更改主意。\n\n# 构建 Web 应用程序\n\n构建 Web 应用程序，我们遵循与构建 Windows 应用程序相同的三个步骤：\n\
  \n1. 通过在 Web 表单上放置控件来绘制用户界面\n2. 为控件分配属性\n3. 为控件事件编写代码（可能还会编写其他方法）\n\n我们已经看到了 Web\
  \ 控件以及如何将它们放置在 Web 表单上。让我们看看如何编写代码。你会发现这个过程与我们用于 Windows 应用程序的方法类似。\n\n代码放置在 `Code\
  \ Window` 中。在代码窗口中输入代码就像使用任何文字处理器一样。你可以剪切、复制、粘贴和删除文本（使用 `Edit` 菜单或工具栏）。你使用菜单（`View`）、工具栏或在表单激活时按下\
  \ `<F7>`（还有其他方法——尝试双击控件）来访问代码窗口。这里是“空白”Web 应用程序的 `Code` 窗口：\n\n![Image](img/00423.jpeg)\n\
  \n头部开始 `partial class`。任何 Web 表单作用域级别的声明都放在此行之后。有一个 `Page_Load` 事件。这类似于 Windows\
  \ 表单的 `Load` 事件，任何必要的初始化都放置在那里。\n\n就像在 Windows 应用程序中一样，代码窗口右上角的框是方法列表，显示了代码窗口中的所有方法。双击感兴趣的控件将访问默认事件方法。或者，可以使用属性窗口定义事件。这与我们在\
  \ Windows 应用程序中看到的相同。这就是 Web 表单的迷之处——构建应用程序几乎没有新东西需要学习。\n\n一旦你的控件到位并编写了代码，你就可以运行你的\
  \ Web 应用程序了。在运行之前，确保你的浏览器已启动是良好的。点击 `Visual C#` 工具栏中的 `Start` 按钮，你的浏览器应该显示你的应用程序（`.aspx`\
  \ 文件）。一旦启动，你可能会看到此窗口：\n\n![Image](img/00109.jpeg)\n\n使用调试器使用 Web 应用需要特殊步骤。我们不会采取这些步骤。因此，如果出现此窗口，只需选择\
  \ `Run without debugging` 并点击 `OK`。在浏览器中运行时，选择 `View` 菜单并选择 `View Source` 以查看生成显示网页的实际\
  \ HTML 代码。\n\n我们用一个简单的数据库示例结束这次对 Web 应用程序的简要检查。\n\n 示例 11-3：查看天气数据\n\n我们将构建一个简单的\
  \ Web 应用程序，在网格视图控件中显示 `Sea02DB.accdb` 数据。该数据库的副本保存在 `VCSDB\\Code\\Class 11\\Example\
  \ 11-3` 文件夹中。整个示例在编写任何代码的情况下构建。\n\n1. 启动一个新的 Web 应用程序。在表单上放置单个标签控件。将其 `Text` 属性设置为\
  \ `Seattle 2002 Weather`。它看起来应该是这样：\n\n![Image](img/00432.jpeg)\n\n2. 我们将使用数据库文件创建一个数据源，然后使用拖放功能创建一个数据网格，显示数据库中的\
  \ `Weather` 表。显示 `Server Explorer` 窗口（点击 `View` 菜单项，然后选择 `Server Explorer`）。右键点击\
  \ `Data Connections` 项并选择 `Add Connection`。此窗口应该出现：\n\n![Image](img/00008.jpeg)\n\
  \n浏览到 `Sea02DB.accdb` 并点击 `OK`。\n\n3. 数据连接（我稍微扩展了它）现在显示在 `Server Explorer` 中：\n\n\
  ![Image](img/0114.jpeg)\n\n4. 将 `Weather` 表从 `Server Explorer` 拖放到 Web 表单。将发生两件事：添加了一个数据源，以及一个数据网格。我的表单看起来像这样（我向下移动了网格）：\n\
  \n![Image](img/00099.jpeg)\n\n5. 保存你的 Web 应用程序。（此应用程序保存在 `VCSDB\\Code\\Class 11`\
  \ 文件夹中。）此时，如果一切顺利，你可以点击 `Start` 按钮（记住不带调试运行）并在你的默认浏览器中看到你的应用程序：\n\n![Image](img/00250.jpeg)\n\
  \n我们在没有代码的情况下完成了这一切！\n\n### 总结\n\nVisual C# 和数据库课程结束了。此时，你已经掌握了使用 `Visual C#` 开发桌面（单用户）应用程序的重要编程技能。然而，我们刚刚开始查看\
  \ `Visual C#` 在处理数据库方面的所有能力。\n\n优秀的程序员永远停止学习。学习本课程中的材料直到你熟悉它们。在整个课程中，提供了扩展你知识库的建议。去做吧！将你的知识扩展到多用户、网络环境。外部的新世界是互联网。学习如何在互联网上部署数据库应用程序。有很多高级书籍讨论这些主题和更多内容。而且，也许有一天，我们会有另一个深入探讨使用\
  \ `Visual C#` 进行数据库编程的课程。\n\n 示例 1-4：最后的数据库项目\n\n我们用这个相同的通用项目结束我们所有的课程。使用 `Visual\
  \ C#` 设计一个全球范围内都想买的数据库管理应用程序。构建一个世界级的界面。彻底调试并测试你的应用程序。创建一个分发包。寻找分销商或通过你新创建的 dot-com\
  \ 公司自己分发。变得极其富有。记住那些让这一切可能的人，并奖励他们工作和股票期。\n\nKidware Software 提供的更多自学或讲师指导的计算机编程教程\n\
  \n![Image](http://www.computerscienceforkids.com/microsoft-small-basic)\n\n\n\n\n\
  # 《少儿 Small Basic》是一本关于计算机编程的图解介绍，它提供了一个交互式的、自学式的教程，用于介绍新的 `Small Basic` 编程环境。该书由\
  \ 30 节短课程组成，解释了如何创建和运行 `Small Basic` 程序。小学生将学习到程序设计和 `Small Basic` 语言的许多元素。书中使用了大量的示例来演示构建过程中的每一个步骤。该教程还包含了两个完整的游戏（“悬疑单词游戏”和“披萨击击器”）供学生构建和尝试。专为\
