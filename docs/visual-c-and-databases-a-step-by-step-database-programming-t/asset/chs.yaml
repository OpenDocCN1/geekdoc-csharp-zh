  \n### 4. 保存并运行示例\n\n你应该能看到（经过一阵硬盘转动声后）：\n\n![Image](img/00272.jpeg)\n\n这张表显示，一本书最多有四位作者。我们将允许这种情况。在此类示例中，这是一个很好的检查，可以确保报告的数学是正确的。\n\
