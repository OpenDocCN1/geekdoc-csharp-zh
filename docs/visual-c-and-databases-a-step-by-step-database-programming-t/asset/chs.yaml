  | Name | `btnPrevious` |\n| Text | `<` |\n| FontStyle | `Bold` |\n| button3: | |\
  \ | |\n| Name | `btnNext` |\n| Text | `>` |\n| FontStyle | `Bold` |\n| button4:\
  \ | | | |\n| Name | `btnLast` |\n| Text | `>|` |\n| FontStyle | `Bold` |\n\n完成后，我的表单看起来如下：\n\
  \n![Image](img/00236.jpeg)\n\n3. 在代码窗口的顶部添加此行：\n\n```\nusing System.Data.OleDb;\n\
  ```\n\n4. 创建数据对象的表级声明：\n\n```\nOleDbConnection phoneConnection;\nOleDbCommand phoneCommand;\n\
  OleDbDataAdapter phoneAdapter;\nDataTable phoneTable;\nCurrencyManager phoneManager;\n\
  ```\n\n5. 将此代码添加到 `PhoneDB_Load` 方法中（创建数据对象）：\n\n```csharp\nprivate void PhoneDB_Load(object\
  \ sender, EventArgs e)\n{\n    // 连接到数据库\n    phoneConnection = new OleDbConnection(\"\
  Provider=Microsoft.ACE.OLEDB.12.0;Data Source=c:\\\\VCSDB\\\\Working\\\\PhoneDB.accdb\"\
  );\n    // 建立命令对象\n    phoneCommand = new OleDbCommand(\"Select * from PhoneTable\
  \ ORDER ContactName\", phoneConnection);\n    // 建立适配器\n    phoneAdapter = new OleDbDataAdapter(phoneCommand);\n\
  \    // 数据表\n    phoneTable = new DataTable();\n    phoneAdapter.Fill(phoneTable);\n\
  \    // 建立货币管理器\n    phoneManager = (CurrencyManager)this.BindingContext[phoneTable];\n\
  \    // 绑定控件\n    txtID.DataBindings.Add(\"Text\", phoneTable, \"ContactID\");\n\
  \    txtName.DataBindings.Add(\"Text\", phoneTable, \"ContactName\");\n    txtNumber.DataBindings.Add(\"\
  Text\", phoneTable, \"ContactNumber\");\n}\n```\n\n6. 在 `PhoneDB_Closing` 事件中添加此代码以将更改保存到数据库：\n\
  \n```csharp\nprivate void PhoneDB_Closing(object sender, FormClosingEventArgs e)\n\
  {\n    try\n    {\n        // 保存更新的表\n        OleDbCommandBuilder phoneCommands\
  \ = new OleDbCommandBuilder(phoneAdapter);\n        phoneAdapter.Update(phoneTable);\n\
  \    }\n    catch (Exception ex)\n    {\n        MessageBox.Show(\"保存数据库文件出错:\\\
  r\\n\" + ex.Message, \"保存错误\", MessageBoxButtons.OK, MessageBoxIcon.Error);\n  \
  \  }\n    // 关闭连接\n    phoneConnection.Close();\n    // Dispose 对象\n    phoneConnection.Dispose();\n\
  \    phoneCommand.Dispose();\n    phoneAdapter.Dispose();\n    phoneTable.Dispose();\n\
  }\n```\n\n7. 最后，为四个导航按钮添加点击代码：\n\n```csharp\nprivate void btnFirst_Click(object\
  \ sender, EventArgs e)\n{\n    phoneManager.Position = 0;\n}\n\nprivate void btnPrevious_Click(object\
  \ sender, EventArgs e)\n{\n    phoneManager.Position--;\n}\n\nprivate void btnNext_Click(object\
  \ sender, EventArgs e)\n{\n    phoneManager.Position++;\n}\n\nprivate void btnLast_Click(object\
  \ sender, EventArgs e)\n{\n    phoneManager.Position = phoneManager.Count - 1;\n\
  }\n```\n\n8. 保存应用程序（保存在 VCSDB\\VCSDB Code\\Class 6 文件夹下的 Example 6-1）并运行它。这是第一条记录：\n\
  \n![Image](img/00329.jpeg)\n\n滚动记录（使用导航按钮）以熟悉列表。注意记录按名称排序。\n\n转最后一条记录（点击 `>|` 箭头）。名称应该是\
  \ Zuffi, Adam：\n\n![Image](img/00290.jpeg)\n\n将姓改为 Duffi。点击另一个记录。返回最后一条记录，你会看到名称更改反映在显示的记录中：\n\
  \n![Image](img/00376.jpeg)\n\n\n\n\n你看到编辑和保存一条记录有多简单了吗？正如我们提到的，这太简单了。用户可能没有意识到任何更改正在被保存。回想，当我们讨论适当的界面设计时，我们决定所有用户任务应该是显而易见的，并且我们应该引导用户完成这些任务。在这个示例中，用户在想要编辑记录和想要保存记录时应该告诉我们。在用户决定更改记录之前，是不允许更改记录的。让我们加入这些修改。\n\
  \n### 1. 初始设置与 UI\n1. 首先，将所有文本框的 `ReadOnly` 属性设置为 `True`（我们将在之后决定何时将其为 `False` 以允许编辑）。现在，添加三个按钮，具有以下属性：\n\
  \n| button1: | |\n| :--- | :--- |\n| Name | `btnEdit` |\n| Text | Edit |\n\n| button2:\
  \ | |\n| :--- | :--- |\n| Name | `btnSave` |\n| Text | Save |\n| Enabled | `False`\
  \ |\n\n| button3: | |\n| :--- | :--- |\n| Name | `btnCancel` |\n| Text | Cancel\
  \ |\n| Enabled | `False` |\n\n现在，表单看起来如下：\n\n![Image](img/00399.jpeg)\n\n### 2.\
  \ 实现应用程序状态\n2. 我们将使用第 5 章引入的应用程序状态概念（我们经常使用 `mode` 作为状态的同义词）。插入一个名为 `SetState` 的方法，并有一个字符串参数\
  \ `appState`。将此代码放在该方法中：\n\n```csharp\nprivate void SetState(string appState)\n\
  {\nswitch (appState)\n{\ncase \"View\":\nbtnFirst.Enabled = true;\nbtnPrevious.Enabled\
  \ = true;\nbtnNext.Enabled = true;\nbtnLast.Enabled = true;\nbtnEdit.Enabled = true;\n\
  btnSave.Enabled = false;\nbtnCancel.Enabled = false;\ntxtID.BackColor = Color.White;\n\
  txtID.ForeColor = Color.Black;\ntxtName.ReadOnly = true;\ntxtNumber.ReadOnly = true;\n\
  break;\ndefault: // \"Edit\" mode\nbtnFirst.Enabled = false;\nbtnPrevious.Enabled\
  \ = false;\nbtnNext.Enabled = false;\nbtnLast.Enabled = false;\nbtnEdit.Enabled\
  \ = false;\nbtnSave.Enabled = true;\nbtnCancel.Enabled = true;\ntxtID.BackColor\
  \ = Color.Red;\ntxtID.ForeColor = Color.White;\ntxtName.ReadOnly = false;\ntxtNumber.ReadOnly\
  \ = false;\nbreak;\n}\ntxtName.Focus();\n}\n```\n\n此方法有两个模式：`View` 和 `Edit`。在 `View`\
  \ 模式（表单加载时的默认模式）下，我们可以查看数据。在 `Edit` 模式（以及后的 Add 模式）下，可以更改数据并保存（或取消编辑操作）。注意，我们从没有“解锁”带有\
  \ ID 字段的文本框（在 `Edit` 模式下它是红色的）。这是一个主要的数据库键，我们不允许它发生更改。\n\n### 3. 初始化状态\n3. 在 `frmPhoneDB_Load`\
  \ 方法的末尾添加此行，使表单初始处于 View 模式：\n\n```csharp\nSetState(\"View\");\n```\n\n这使得表单初始处于\
  \ View 模式。\n\n### 4. 编辑事件处理\n4. 将此代码放在 `btnEdit_Click` 事件方法中：\n\n```csharp\nprivate\
  \ void btnEdit_Click(object sender, EventArgs e)\n{\nSetState(\"Edit\");\n}\n```\n\
  \n此代码将表单置于 `Edit` 模式并允许编辑数据表。\n\n### 5. 保存事件处理\n5. 将此代码放在 `btnSave_Click` 事件方法中：\n\
  \n```csharp\nprivate void btnSave_Click(object sender, EventArgs e)\n{\nphoneManager.EndCurrentEdit();\n\
  SetState(\"View\");\n}\n```\n\n此代码通过调用货币管理器的 `EndCurrentEdit` 方法保存绑定控件中的更改。它将应用程序状态重置为\
  \ `View` 模式。\n\n### 6. 取消事件处理\n6. 将此代码放在 `btnCancel_Click` 事件方法中：\n\n```csharp\n\
  private void btnCancel_Click(object sender, EventArgs e)\n{\nphoneManager.CancelCurrentEdit();\n\
  SetState(\"View\");\n}\n```\n\n此代码取消编辑操作并将应用程序状态重置为 `View` 模式。\n\n### 7. 测试工作流\n\
  7. 重新保存修改后的应用程序。运行它。转到最后一条记录（记得 Zuffi, Adam 吗？）。尝试更改名称——你不应该能够更改，因为文本框被锁定了。点击 Edit。表单处于\
  \ Edit 模式：\n\n![Image](img/00306.jpeg)\n\n将姓氏改为 Duffi。点击 Cancel。注意 Name 字段被设回 Zuffi，表单恢复到查看模式。什么都没有发生变化。再次点击\
  \ Edit。将姓氏改为 Duffi。点击 Save。表单返回查看模式，名称的更改反映在显示的记录中。你看到这个界面的用法是清晰的吗？尽管如此，请注意记录并没有重新排序。也就是说，“Duffi”条目仍然是最后一条记录。停止应用程序。\n\
  \n### 8. 处理排序\n8. 重新启动应用程序。转到最后一条记录。Adam ‘Duffi’ 在哪里？滚动记录到 ‘D’ 开头的列表——他应该在那儿。当我们使用原始的\
  \ SQL 命令（`SELECT * FROM PhoneTable ORDER BY ContactName`）重新打开数据库时，新的名称将会出现。\n\n\n\
  \n这会将新记录从“编辑缓冲区”中删除。我们仍然需要做一些额外的工作。为什么呢？在添加记录之前，用户正在查看某个特定的记录。我们希望在取消添加操作后，能够显示之前的那条记录。我们可以在添加记录之前存储该记录的书签（bookmark）来实现这一点。书签是数据库管理任务中的一个占位符。然后，如果“添加操作”被取消，我们就恢复书签。存储书签（使用\
  \ `currency manager` 的 `Position` 属性）的代码如下：\n\n```csharp\nmyBookmark = myManager.Position;\n\
  ```\n\n注意，这需要一个类型为 `int` 的变量 `myBookmark` 来保存书签。要恢复书签，请反转关系的两边：\n\n```csharp\nmyManager.Position\
  \ = myBookmark;\n```\n\n### 示例 6-2 添加数据库记录\n\n让我们修改之前的示例（示例 6-1），以包含向电话号码列表添加记录的能力。\n\
  \n1. 添一个按钮。将 `Name` 设置为 `btnAdd`，将 `Text` 设置为 `Add New`（添加新建）。表单应该如下所示（你可能需要调整一下表单大小）：\n\
  \n![Image](img/00435.jpeg)\n\n2. 将这些行与表单级声明放在一起。这些变量将存储应用程序状态以及我们使用的任何书签。\n\n```csharp\n\
  string myState;\nint myBookmark;\n```\n\n3. 将此代码放在 `btnAdd_Click` 事件方法中：\n\n```csharp\n\
  private void btnAdd_Click(object sender, EventArgs e)\n{\n    myBookmark = phoneManager.Position;\n\
  \    SetState(\"Add\");\n    phoneManager.AddNew();\n}\n```\n\n这段代码首先设置了书签，以防操作后取消。然后它将应用程序置于\
  \ `AddNew` 模式并添加一条空白记录。\n\n4. 修改 `btnCancel_Click` 代码，以区分在编辑模式和添加模式下的取消操作（新代码为阴影显示部分）：\n\
  \n```csharp\nprivate void btnCancel_Click(object sender, EventArgs e)\n{\n    phoneManager.CancelCurrentEdit();\n\
  \    if (myState.Equals(\"Add\"))\n    {\n        phoneManager.Position = myBookmark;\n\
  \    }\n    SetState(\"View\");\n}\n```\n\n在这段代码中，如果是编辑模式，则没有任何变化。如果是添加模式，则取消记录的添加并恢复已保存的书签。无论何种情况，用户都会返回\
  \ View 状态。`MyState` 是在下一个例中定义的变量。\n\n5. 修改 `SetState` 方法，使状态保存在 `MyState` 中，识别新的\
  \ Add 状态，并正确切换 Add New 按钮的 `Enabled` 属性（新代码为阴影显示部分）：\n\n```csharp\nprivate void\
  \ SetState(string appState)\n{\n    myState = appState;\n    switch (appState)\n\
  \    {\n        case \"View\":\n            btnFirst.Enabled = true;\n         \
  \   btnPrevious.Enabled = true;\n            btnNext.Enabled = true;\n         \
  \   btnLast.Enabled = true;\n            btnEdit.Enabled = true;\n            btnSave.Enabled\
  \ = false;\n            btnCancel.Enabled = false;\n            btnAdd.Enabled =\
  \ true;\n            txtID.BackColor = Color.White;\n            txtID.ForeColor\
  \ = Color.Black;\n            txtName.ReadOnly = true;\n            txtNumber.ReadOnly\
  \ = true;\n            break;\n        default: // \"Edit\" mode, \"Add\" mode\n\
  \            btnFirst.Enabled = false;\n            btnPrevious.Enabled = false;\n\
  \            btnNext.Enabled = false;\n            btnLast.Enabled = false;\n  \
  \          btnEdit.Enabled = false;\n            btnSave.Enabled = true;\n     \
  \       btnCancel.Enabled = true;\n            btnAdd.Enabled = false;\n       \
  \     txtID.BackColor = Color.Red;\n            txtID.ForeColor = Color.White;\n\
  \            txtName.ReadOnly = false;\n            txtNumber.ReadOnly = false;\n\
  \            break;\n    }\n    txtName.Focus();\n}\n```\n\n6. 保存应用程序（保存在 `VCSDB\\\
  VCSDB Code\\Class 6` 文件夹下的 Example 6-2 目录）。运行它。点击 Add New。注意三个文本框（ID、Name 和 Number）都是空的：\n\
  \n![Image](img/00304.jpeg)\n\n回 `ContactID` 字段是主键且是自动编号的。那么，为什么没有生成并显示 ID 值呢？ADO\
  \ .NET 的一个“特性”是，在将修改过的行写回数据库（更新数据适配器）之前，它不会生成此类值。在这个示例中，我们直到结束应用程序时才会保存数据库，因此在重新打开数据库之前看不到这些值。\n\
  \n7. 输入一个名称（姓，名）和一个电话号码。（我确定你已经意识到我们应该对电话号码字段进行一些输入和输入验证，但在这个简单的示例中我们忽略了它。）这是我的新记录：\n\
  \n![Image](img/00310.jpeg)\n\n注意没有 ID。点击 Save。应用程序返回 View 状态，显示其他某些记录。正如之前提到的，我们将在本章稍后部分学习如何显示新添加的记录。再次点击\
  \ Add New。输入一条新记录，但这次点击 Cancel。显示的记录应该是点击 Add New 之前看到的那一个。用户喜欢看到这样的结果。滚动记录——被取消的记录应该找不到。已添加的记录应该还在那里。停止应用程序。\n\
  \n8. 再次运行应用程序找到新添加的条目。\n\n![Image](img/00321.jpeg)\n\n### 6-2 使用 SQL Server 删除记录\n\
  \n从数据库删除记录是简单但危险的。在删除记录时，我们需要确保用户想要要删除。\n\n### 6-2 删除数据库记录\n\n从数据库删除记录是简单但危险的。在删除记录时，我们需要确保用户想要要删除。要从数据库删除记录的步骤如下：\n\
  \n1. 显示要删除的记录。\n2. 使用对话框询问用户是否想要删除。\n3. 删除记录。\n\n我们建议使用对话框来确认。\n\n![Image](img/00314.jpeg)\n\
  \n生成此对话框的代码：\n\n```csharp\nMessageBox.Show(\"Are you sure you want to delete this\
  \ record?\", \"Delete Record\", MessageBoxButtons.YesNo, MessageBoxIcon.Question,\
  \ MessageBoxDefaultButton.Button2)\n```\n\n注意我们让 No 按钮默认。如果用户对这个框做出 No 回复，只需退出方法。如果响应是\
  \ Yes，我们就执行删除。要从数据表中删除记录，使用货币管理器的 `RemoveAt` 方法：\n\n```csharp\nmyManager.RemoveAt(myManager.Position);\n\
  ```\n\n这段代码不可撤销地删除 `myManager.Position` 处的记录。\n\n\n对 SQL Server 版本进行相同的更改。\n\n#\
  \ 在数据库中查找记录\n\n[content]在数据库管理任务中，许多时候你可能希望在数据库中定位某些记录。例如，在我们正在使用的电话数据库中，用户可能想要查找特定的个人。或者，在书籍数据库中，用户可能需要查找特定作者的所有书籍。或者，在向数据表添加记录后，你想要查找该记录并显示它。\n\
  \n在数据库中查找记录的一种方法是通过 SQL 查询。SQL 查询返回所有匹配特定标准的记录（对于大型数据库来说，这种方法很慢）。此类搜索在第 5 章中讨论过。在本节中，我们关注如何在数据表中查找单条记录。完成此任务有两种方法。首先，将使用数据表的\
  \ `Find` 方法。\n\n数据表的 `Find` 方法仅在排序的列上执行搜索。这正是我们在电话数据库中需要的，因为我们要根据名称进行搜索。更复杂的搜索需要复杂的技巧（下文讨论）。\n\
  \n如果我们有一个按 `mySortField` 排序的数据表 (`myTable`)，并且正在查找 `myValue`，则 `Find` 方法的语法如下：\n\
  \n```cs\nint myRow;\n\nphoneTable.DefaultView.Sort = mySortField;\n\nmyRow = myTable.DefaultView.Find(myValue);\n\
  ```\n\n此方法返回数据表中包含所需值的行 (`myRow`)。如果现在找到了该行，则返回负数 (`-1`)。将货币管理器 `Position` 属性设置为\
  \ `myRow` 将正确重新绑定控件。\n\n`Find` 方法易用但有局限性。如果我们想根据更复杂的标准或排序列的其他列查找行，则使用数据表的 `Select`\
  \ 方法。语法如下：\n\n```cs\nDataRow[] myRows;\n\nmyRows = myTable.Select(criteria);\n```\n\
  \n其中 `criteria` 是搜索标准的布尔表达式。该方法返回数据表中匹配标准的每个行的数组 (`myRows`)。搜索标准类似于 SQL 中的 `WHERE`\
  \ 子句。它指定了搜索的要求。通常的形式是将一个或多个字段与目标值进行比较。例如，使用电话数据库，如果我们想查找名为 Smith 的个人（`ContactName`\
  \ 字段），我们将使用：\n\n```cs\ncriteria = \"ContactName = 'Smith'\"\n```\n\n注意嵌入字符串周围单引号。如果你不确定字段字段，可以使用\
  \ `LIKE` 关键字配合通配符字符 (`*`)。例如，在上面的示例中，你不确定要找的名字是 Smith 还是 Smyth。查找它们的搜索标准是：\n\n```cs\n\
  criteria = \"ContactName LIKE 'Sm*'\"\n```\n\n如何知道搜索是否成功？检查返回行数组的长度。如果在调用 `Select`\
  \ 方法后长度大于 0，则搜索成功了。`Select` 方法的一个问题是它不提供数据表内的相应行号（像 `Find` 方法那样）。它只告诉我们匹配搜索标准的行。要找到相应的行号（以便对货币管理器定位），我们需要做一些工作。代码并不困难，只是有点别扭。\n\
  \n假设返回的行数组 (`myRows`) 长度不为零，并且数据表的默认视图按 `mySortField` 排序，数组中第一行的相应行号为：\n\n```cs\n\
  int firstRow;\n\nfirstRow = myTable.DefaultView.Find(myRows[0][mySortField]);\n\
  ```\n\n此代码使用 `Find` 方法定位包含 `myRows[0]` 中发现的 `mySortField` 值的行 (`firstRow`)。正如我们所说，这很别扭，但它有效。在找到\
  \ `firstRow` 后，将货币管理器的 `Position` 属性设置为该值以正确重新绑定所有控件。\n\n### 示例 6-4：查找数据库记录\n\n\
  在我们使用的电话数据库中，我们在编辑和向数据表添加记录运行时一个缺点。在保存更改后，货币管理器并不指向我们刚刚编辑或添加的记录。我们现在可以使用数据表的 `Find`\
  \ 方法来修正该缺点。\n\n1. 打开示例 6-3（我们一直在构建的电话数据库示例）。\n2. 修改 `btnSave_Click` 事件方法，在重新排序保存的数据表后实现搜索（新代码为阴影部分）：\n\
  \n```cs\nprivate void btnSave_Click(object sender, EventArgs e)\n{\n\n    string\
  \ savedName = txtName.Text;\n\n    int savedRow;\n\n    phoneManager.EndCurrentEdit();\n\
  \n    phoneTable.DefaultView.Sort = \"ContactName\";\n\n    savedRow = phoneTable.DefaultView.Find(savedName);\n\
  \n    phoneManager.Position = savedRow;\n\n    SetState(\"View\");\n}\n```\n\n当我们进入此方法时，我们决定保存显示的信息。在结束编辑之前，我们将\
  \ `ContactName` 字段（包含在 `txtName` 框中）保存到变量 `savedName` 中。在结束编辑（保存数据表）后，我们使用 `Find`\
  \ 方法查找保存的名称。返回的行 (`savedRow`) 用于重新定位货币管理器。注意我们没有检查 `savedRow` 是否有效，因为我们保证搜索是成功的。在其他搜索中，你可能需要确保\
  \ `savedRow` 不为 -1。\n3. 保存应用程序（在 `6-4` 文件夹中）并运行它。编辑一个记录。注意现在显示的记录是新编辑的。尝试 Add New。\n\
  \n\n\n\n在此段代码中，`myField` 是一个字符串数据类型。代码使用了特殊形式的 `for` 循环 (`foreach`)，它会遍历 `Rows`\
  \ 集合中的所有元素。此类代码可用于数据库的批量更改。例如，你可以用它为所有的电话号码添加区号，或者更改特定字段的大小写。我们将在下一个示例中进行操作。\n\n\
  除了直接编辑数据行外，你还可以使用数据行对象向数据表添加新行。要向 `myTable` 添加新行，请使用以下代码：\n\n```csharp\nDataRow\
  \ newRow;\nnewRow = myTable.NewRow();\n// ‘使用字段字段\nnewRow[myField] = fieldValue;\n\
  // ‘添加所有字段后添加行\nmyTable.Rows.Add(newRow);\n```\n\n要从数据表（`MyTable`）中删除第 `n` 行，只需使用：\n\
  \n```csharp\nmyTable.Rows[n].Delete();\n```\n\n### 示例 6-5：在代码中修改记录\n\n注意，我们一直使用的电话数据库中的电话号码没有列出区号。它是用于本地通话的。如果我们想扩展数据库以允许拨打区号外的电话，我们需要为所有现有号码添加区号。我们可以运行应用程序并逐个编辑所有记录以添加区号，也可以在代码中完成。让我们来试一下。\n\
  \n1. 重新打开示例 6-4。在 `frmPhoneDB_Load` 方法的底部添加此代码：\n\n```csharp\nforeach (DataRow phoneRow\
  \ in phoneTable.Rows)\n{\n    phoneRow[\"ContactNumber\"] = \"(206) \" +\n    phoneRow[\"\
  ContactNumber\"].ToString();\n}\n```\n\n在这段代码中，我们遍历了数据表（`phoneTable`）中的每一行，并更改了\
  \ `ContactNumber` 字段，添加了 `(206)` 区号。\n\n2. 保存（保存存在 `VCSDB\\VCSDB Code\\Class 6 folder\\\
  Example 6-5` 中）并运行应用程序。注意现在所有的电话号码都有区号了。这是我们的老朋友 Adam Zuffi：\n\n![Image](img/00319.jpeg)\n\
  \n3. 如果需要，将添加区号的代码行替换为此行：\n\n```csharp\nphoneRow[\"ContactNumber\"] =\nphoneRow[\"\
  ContactNumber\"].ToString().Substring(6, 8);\n```\n\n再次运行应用程序。此行代码剥除了区号，将数据库恢复到原始状态。一旦你完成了所有修改，删除更改\
  \ `ContactNumber` 的代码。如果不这样做，每次运行程序时都会产生更改。\n\n### 示例 6-5：使用 SQL Server 数据库\n\n\
  对 SQL Server 版本的项目进行相同的更改。\n\n### 停止数据库应用程序\n\n在我们类中构建的所有应用程序中，可以通过以下四种方式之一停止执行：\n\
  \n1. 使用 Visual C# 工具栏上的 `End`（结束）按钮。\n2. 点击表单左上角的控制框并选择 `Close`（关闭）。\n3. 按下 `Alt-<F4>`。\n\
  4. 点击应用程序表单右上角的 `X`。\n\n当其他人使用我们的应用程序时，Visual C# 的 `End` 按钮将不可用，控制框可能可见也不可见，且所有用户可能不知道可以使用\
  \ `Alt-<F4>` 或 `X` 按钮来停止。我们需要一种方法来清晰地指示用户如何停止应用程序。\n\n停止应用程序最直接的方法是提供一个可以点击的按钮。你选择标题。Windows\
  \ 应用程序中使用的标题有 `Exit`、`Stop`、`Close` 和 `Done`。我们将使用 `Done` 作为 `Text` 属性。我们将按钮命名为\
  \ `btnDone`。因此，我们只需要在 `btnDone_Click` 事件方法中放入代码。代码非常简单：\n\n```csharp\nprivate void\
  \ btnDone_Click(object sender, EventArgs e)\n{\n    this.Close();\n}\n```\n\n这够简单吧？一行代码就停止了应用程序。这行代码告诉表单关闭自己（`this`）。\n\
  \n关于应用程序状态，在任何编辑期间 `Done` 按钮都应该是禁用的。我们确保用户在停止应用程序之前已保存了对数据库所做的任何更改。可以使用按钮的 `Enabled`\
  \ 属性轻松控制。但存在一个问题。我们可以阻止用户在不适当的时间点击 `Done`，但无法阻止用户使用其他三种停止应用程序的方法之一（控制框、`Alt-<F4>`、`x`）。而且，我们无法阻止用户完全关机\
  \ Windows 操作系统！幸运的是，Visual C# 提供了一个方法，允许我们拦截任何关闭表单的尝试，并判断该尝试是否合适。该方法是表单的 `FormClosing`\
  \ 事件。\n\n`FormClosing` 方法在关闭表单之前调用。我们一直使用此方法保存到数据库的更改并关闭连接。现在，我们将添加功能以确保用户可以关闭表单。`FormClosing`\
  \ 方法的格式如下：\n\n```csharp\nprivate void MyForm_FormClosing(object sender,\nFormClosingEventArgs\
  \ e)\n{\n    .\n    .\n}\n```\n\n`e` 参数（类型为 `FormClosingEventArgs`）有两个属性：`e.Cancel`\
  \ 和 `e.CloseReason`。如果 `e.Cancel` 为 `false`，当方法退出时，关闭将继续。如果 `e.Cancel` 为 `true`，则关闭过程被取消。`e.CloseReason`\
  \ 告诉我们触发关闭的原因：\n\n| 属性 | 描述 |\n| :--- | :--- |\n| ApplicationExit | 应用程序正在关闭。 |\n\
  | FormOwner | 所有者表单正在关闭。 |\n| None | 原因未定义或无法确定。 |\n| TaskClosing | 任务管理器正在关闭应用程序。\
  \ |\n| UserClosing | 用户正在关闭表单。 |\n| WindowsShutDown | 操作系统正在关闭所有应用程序。 |\n\n所以，我们如何使用此事件？关于数据库管理，我们只需检查是否有正在进行的编辑。如果是，我们通知用户并取消关闭。如果没有编辑，我们允许继续关闭。这就是，下一个示例说明了其用法\n\
  \n为我们一直在使用的电话数据库添加停止功能。\n\n1. 重新打开示例 6-4（不修改电话号码）。添加一个名为 `btnDone`、文本为 `Done` 的按钮。表单看起来像这样：\n\
  \n![Image](img/340.jpeg)\n\n2. 在 `btnDone_Click` 方法放置此代码：\n\n```csharp\nprivate\
  \ void btnDone_Click(object sender, EventArgs e)\n{\n    this.Close();\n}\n```\n\
  \n3. 修改 `SetState` 方法，在视图下将 `btnDone` 的 `Enabled` 属性设置为 `true`，在添加/编辑模式下设置为 `false`。\n\
  \n4. 在 `frmPhoneDB_Closing` 方法中添加阴影代码：\n\n```csharp\nprivate void frmPhoneDB_Closing(object\
  \ sender,\nFormClosingEventArgs e)\n{\n    if (myState.Equals(\"Edit\") || myState.Equals(\"\
  Add\"))\n    {\n        MessageBox.Show(\"你必须完成当前编辑后停止应用程序。\", \"\",\nMessageBoxButtons.OK,\
  \ MessageBoxIcon.Information);\n        e.Cancel = true;\n    }\n    else\n    {\n\
  \        try\n        {\n            // 保存后的电话表\n            OleDbBuilder phoneAdapterCommands\
  \ = new OleDbBuilder(phoneAdapter);\n            phoneAdapter.Update(phoneTable);\n\
  \        }\n        catch (Exception ex)\n        {\n            MessageBox.Show(\"\
  保存数据库到文件时出错:\\r\\n\"\n+ ex.Message, \"保存错误\", MessageBoxButtons.OK,\nMessageBoxIcon.Error);\n\
  \        }\n        // 关闭连接\n        phoneConnection.Close();\n        // 释放对象\n\
  \        phoneConnection.Dispose();\n        phoneCommand.Dispose();\n        phoneAdapter.Dispose();\n\
  \        phoneTable.Dispose();\n    }\n}\n```\n\n5. 保存（保存存在 `VCSDB\\VCSDB Code\\\
  Class 6 folder\\Example 6-6`）应用程序并运行。点击编辑。注意 Done 按钮是禁用的：\n\n![Image](img/00474.jpeg)\n\
  \n点击表单右上角的 X。这不应该停止应用程序。会出现此消息框：\n\n![Image](img/00347.jpeg)\n\n点击 OK 返回数据库屏幕。点击取消。现在，再次尝试\
  \ X。应用程序应该停止。尝试使用其他方法（包括 Done 按钮）停止应用程序，分别在视图模式和编辑模式下。确保一切运行正常。\n\n\n\n\n## 使用 SQL\
  \ Server 数据库\n\n对项目的 SQL Server 版本执行相同的更改。\n\n## 示例 6-7：作者表（Authors Table）输入表单\n\
  \n终于，我们可以利用新的数据库管理知识来完成第 6 章中开始的图书数据库输入表单。在这个示例中，我们将处理 `Authors` 表。在下一个示例中，我们将完成\
  \ `Publishers`（出版社）表。我们将分阶段进行修改，并在每阶段完成后进行测试。\n\n### 额外的导航功能\n\n回想一下，在第 6 章中我们提到，良好的界面设计之一是意识到你可能忽略了某些功能。而\
  \ Visual C# 环境使得修正这些遗漏变得简单。`Authors` 表输入表单只有两个导航按钮——一个移动到“上一个”记录，另一个移动到“下一条”记录。这可能会限制我们。我们将添加移动到数据表开头和结尾的能力。添加这些额外的导航功能是修正遗漏的一个良好示例。\n\
  \n1. 加载 `Example 5-8`（`Authors` 表输入表单的版本）。添加两个按钮。设置这些属性：\n\n| button1: | |\n| :---\
  \ | :--- |\n| Name | `btnFirst` |\n| Text | `< First` |\n\n| button2: | |\n| :---\
  \ | :--- |\n| Name | `btnLast` |\n| Text | `Last >` |\n\n将 `btnPrevious` 按钮的 `Text`更改为\
  \ `< Previous`，并将 `btnNext` 按钮的 `Text`更改为 `Next >`（移除 `=` 号）。表单看起来如下：\n\n![Image](img/00460.jpeg)\n\
  \n2. 将此代码添加到 `btnFirst_Click` 方法中：\n\n```csharp\nprivate void btnFirst_Click(object\
  \ sender, EventArgs e)\n{\n    authorsManager.Position = 0;\n}\n```\n\n将此代码添加到 `btnLast_Click`\
  \ 方法中：\n\n```csharp\nprivate void btnLast_Click(object sender, EventArgs e)\n{\n\
  \    authorsManager.Position = authorsManager.Count - 1;\n}\n```\n\n3. 进入 `SetState`\
  \ 方法。确保 `First` 和 `Last` 按钮在 `View` 模式下启用，在 `Add` 和 `Edit` 模式下禁用（与 `Previous` 和\
  \ `Next` 按钮相同）。\n\n4. 保存应用（保存在 `VCSDB\\Code\\Class 6` 文件夹下的 `Example 6-7` 文件夹中）。运行它。你应该看到：\n\
  \n![Image](img/00349.jpeg)\n\n确保新的导航按钮工作正常（包括在记录之间移动以及状态改变时的启用/禁用）。\n\n### 编辑记录\n\
  \n我们现在添加编辑功能以及相应的保存和/取消编辑的能力。\n\n1. 修改 `btnSave_Click` 方法以保存编辑并将指针重新定位到编辑的记录（新代码行已着影）：\n\
  \n```csharp\nprivate void btnSave_Click(object sender, EventArgs e)\n{\n    if (!ValidateData())\n\
  \    {\n        return;\n    }\n    string savedName = txtAuthorName.Text;\n   \
  \ int savedRow;\n    try\n    {\n        authorsManager.EndCurrentEdit();\n    \
  \    authorsTable.DefaultView.Sort = \"Author\";\n        savedRow = authorsTable.DefaultView.Find(savedName);\n\
  \        authorsManager.Position = savedRow;\n        MessageBox.Show(\"Record saved.\"\
  , \"Save\",\n        MessageBoxButtons.OK, MessageBoxIcon.Information);\n      \
  \  SetState(\"View\");\n    }\n    catch (Exception ex)\n    {\n        MessageBox.Show(\"\
  Error saving record.\", \"Error\",\n        MessageBoxButtons.OK, MessageBoxIcon.Error);\n\
  \    }\n}\n```\n\n2. 修改 `btnCancel_Click` 方法以在取消编辑时恢复控件（新代码行已着影）：\n\n```csharp\n\
  private void btnCancel_Click(object sender, EventArgs e)\n{\n    authorsManager.CancelCurrentEdit();\n\
  \    SetState(\"View\");\n}\n```\n\n3. 将着影代码添加到 `frmAuthors_FormClosing` 方法中，以将任何更改保存到数据库文件：\n\
  \n```csharp\nprivate void frmAuthors_FormClosing(object sender, FormClosingEventArgs\
  \ e)\n{\n    try\n    {\n        // save changes to database\n        OleDbCommandBuilder\
  \ authorsAdapterCommands = new\n        OleDbCommandBuilder(authorsAdapter);\n \
  \       authorsAdapter.Update(authorsTable);\n    }\n    catch (Exception ex)\n\
  \    {\n        MessageBox.Show(\"Error saving database to file: \\r\\n\"\n    \
