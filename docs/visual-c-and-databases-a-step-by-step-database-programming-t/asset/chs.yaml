  \ 事件中使用此代码显示帮助文件：\n\n```csharp\nprivate void btnHelp_Click(object sender, EventArgs\
  \ e)\n{\n    Help.ShowHelp(this, hlpAuthors.HelpNamespace);\n}\n```\n\n9. 保存（保存在\
  \ `VCSDB\\Code\\Class 5` 文件夹下的 Example 5-8 文件夹中）并运行应用程序。按下 `<F1>` 或点击帮助。无论通过哪种方式，你都应该看到帮助文件：\n\
  \n![Image](img/00232.jpeg)\n\n## 示例 5-8：使用 SQL Server 数据库\n\n对 SQL Server 版本的项目进行相同的更改。\n\
  \n## 应用程序测试\n\n我们对 Visual C# 界面设计的讨论到此结束。现在，我们为书籍数据库的作者表有一个相当完整的界面。显然，我们仍然需要按钮背后的剩余代码。我们将在下一章处理。\n\
  \n一旦完成了应用程序，就需要对其进行测试以确保其运行符合预期。如果你在构建应用程序时足够小心，在最终测试中不应出现任何意外。事实上，Visual C# 环境有助于实现这一目标。Visual\
  \ C# 的事件驱动特性使其分阶段构建应用程序，并在构建的每个阶段进行测试和调试。换句话说，你不需要在开始测试之前就有一个完整的应用程序。我们已经在作者表示例中做到了。\n\
  \nVisual C# 的事件驱动特性也使得修改应用程序变得容易。我们将在第 6 章修改书籍数据库示例时看到，我们在设计中遗留了一些遗漏和错误。但这些遗漏和错误可以使用\
  \ Visual C# 环境轻松修正。这些修正将让你对应用程序的构建和测试过程有更深入的理解。\n\n让其他人（特别是潜在用户）尝试你的应用程序，看看它的使用是否如你所计划的那样直观。项目的输入和输出是否合适？应用程序状态是否清晰？根据用户反馈实现并重新测试任何更改。并且在“发布”应用程序后，跟踪所有的反馈。这些信息可以用于你产品的未来更新。\n\
  \n在离开本章之前，让我们看看其他你可能在数据库界面武器中使用的 Visual C# 控件。\n\n## 其他控件\n\n除了本章前面讨论的标准 Visual\
  \ C# 控件外，还有许多其他控件可以构建数据库界面。如果不在工具箱中，在使用之前必须将这些控件添加到 Visual C# 工具箱中。\n\n要加载控件，请确保工具箱在开发环境中可见。从\
  \ Visual C# 工具菜单中选择 `Choose Toolbox Items`。在弹出的对话框中选择 `.NET Framework Components`：\n\
  \n![Image](img/00485.jpeg)\n\n要添加一个或多个控件，选择所需选项旁边的复选框。完成后，选择 OK，选控件将出现在工具箱中。Visual\
  \ C# 在线帮助系统可以提供详细的使用说明。\n\n在这里，我们查看其他几个控件（某些是数据绑，某些不是）以及它们如何与 Visual C# 使用。\n\n\
  ### MaskedTextBox 控件\n\n![Image](img/0021.jpeg)\n\n罩文本框（MaskedTextBox）控件使用掩码来提示输入数据。它工作像文本框控件，但掩码允许你指定格式。在数据库中，该控件可以用于提示日期、时间、数字或货币值。\n\
  \n**MaskedTextBox 属性：**\n\n| 属性 | 说明 |\n| :--- | :--- |\n| `Mask` | 确定输入信息的类型。 |\n\
  | `PromptChar` | 用于缺失信息的字符。 |\n| `Text` | 包含输入到控件的数据（包括提示符）。 |\n| `TextMaskFormat`\
  \ | 表明 `Text` 属性是否包含字面量。 |\n\n**MaskedTextBox 事件：**\n\n| 事件 | 说明 |\n| :--- | :---\
  \ |\n| `Leave` | 用户离开控件时触发。 |\n| `LostFocus` | 控件失去焦点时触发。 |\n| `MaskInputRejected`\
  \ | 用户输入的数据不匹配掩码时触发。 |\n\n**MaskedTextBox 的典型用法：**\n\n> ➢ 设置 `Name` 属性。初始化 `Text`\
  \ 属性为所需的字符串。设置 `Mask` 属性。\n> ➢ 在代码中，需要时给控件焦点。在 `Leave` 事件发生时读取 `Text` 属性。\n> ➢ 你可能还想更改\
  \ `Font`、`BackColor` 和 `ForeColor` 属性。\n\n该控件具有内置的输入验证功能，可以减轻你作为程序员的任务。我们将在后续章节的一些示例应用程序中使用掩码编辑控件。\n\
  \n### NumericUpDown 控件\n\n![Image](img/00245.jpeg)\n\n`NumericUpDown` 控件用于获取数值输入。它看起来像带有两个小箭头的文本框控件。点击箭头会更改值，其范围在指定的最小值和最大值之间。如果需要，用户甚至可以输入值。此类控件适用于提供月份，或在某些\
  \ Windows 多媒体应用程序中作为音量控制。\n\n**NumericUpDown 属性：**\n\n| 属性 | 说明 |\n| :--- | :---\
  \ |\n| `Name` | 获取或设置数值控件的名称（数值控件名称的三字母前缀为 `nud`）。 |\n| `BackColor` | 获取或设置数值控件的背景颜色。\
  \ |\n| `BorderStyle` | 获取或设置数值控件的边框样式。 |\n| `Font` | 获取或设置字体、样式、大小。 |\n| `ForeColor`\
  \ | 获取或设置文本或图形的颜色。 |\n| `Increment` | 获取或设置点击向上或向下按钮时增加或减少数值控件的值。 |\n\n\n\n\n\n\
  | 属性 | 说明 |\n| :--- | :--- |\n| `Maximum` | 获取或设置数值增调控件的最大值。 |\n| `Minimum` | 获取或设置数值增调控件的最小值。\
  \ |\n| `ReadOnly` | 获取或设置一个值，指示文本是否仅可以通过向上或向下按钮更改。 |\n| `TextAlign` | 获取或设置数值增调控件中文本的对齐方式。\
  \ |\n| `Value` | 获取或设置分配给数值增调控件的值。 |\n\n### NumericUpDown 方法\n\n| 名称 | 说明 |\n| :---\
  \ | :--- |\n| `DownButton` | 递减数值增调控件的值。 |\n| `UpButton` | 增数值增调控件的值。 |\n\n### NumericUpDown\
  \ 事件\n\n| 事件 | 说明 |\n| :--- | :--- |\n| `Leave` | 当增调控件失去焦点时发生。 |\n| `ValueChanged`\
  \ | 当 `Value` 属性发生某种方式的变化时发生。 |\n\n`Value` 属性可以通过点击任意箭头或可选地通过输入值来更改。如果使用箭头，值将始终处于\
  \ `Minimum` 和 `Maximum` 之间。如果用户可以输入值，则你无法控制输入了什么值。然而，一旦控件失去焦点，输入的值将与 `Minimum` 和\
  \ `Maximum` 进行比较，并进行任何调整。因此，如果你允许输入值，只需在 `Leave` 事件中检查 `Value` 属性。\n\n#### NumericUpDown\
  \ 控件的典型用法：\n- ➢ 设置 `Name`、`Minimum` 和 `Maximum` 属性。初始化 `Value` 属性。\n- ➢ 监控 `ValueChanged`（或\
  \ `Leave`）事件以检测 `Value` 的变化。\n- ➢ 你可能还想更改 `Font`、`Backcolor` 和 `Forecolor` 属性。\n\
  \n`NumericUpDown` 控件是一种“点击”类型的控件，可以代替用户的输入输入。我们将在后续章节的某些示例应用程序中使用 `NumericUpDown`\
  \ 控件。\n\n## TabControl 控件\n\n![Image](img/00192.jpeg)\n\n`TabControl` 控件提供了一种在单个表单上显示多个对话框或信息的简单方法。这是在许多商业\
  \ Windows 应用程序中看到的界面。标签控件提供了一组标签页，每个标签页都作为其他控件的容器（工作就像组框或面板）。特别是，标签“页”内的单选按钮组将作为一个独立的组运行。一次只能有一个标签处于激活状态。使用此控件非常简单。只需将每个标签容器构建为单独的组：添加控件、设置属性并像你对任何应用程序那样编写代码。从一个标签切换到下一个标签的导航非常简单：只需点击相应的标签。\n\
  \n### TabControl 属性\n\n| 名称 | 说明 |\n| :--- | :--- |\n| `Name` | 获取或设置标签控件的名称（控件名称的三字母前缀为\
  \ tab）。 |\n| `BackColor` | 获取或设置标签控件的背景颜色。 |\n| `BorderStyle` | 获取或设置标签控件的边界样式。\
  \ |\n| `Font` | 获取或设置字体名称、样式、大小。 |\n| `ForeColor` | 获取或设置文本或图形的颜色。 |\n| `ItemSize`\
  \ | 确定标签大小的尺寸结构。 |\n| `SelectedIndex` | 获取或设置当前显示的标签索引。 |\n| `SizeMode` | 决定标签的大小方式。\
  \ |\n| `TabPages` | 描述每个标签页的集合。 |\n\n### TabControl 事件\n\n| 事件 | 说明 |\n| :--- |\
  \ :--- |\n| `SelectedIndexChanged` | 当 `SelectedIndex` 属性发生变化时发生。 |\n\n标签控件最重要的属性是\
  \ `TabPages`。它用于设计每个标签页（称为 `TabPage`）。在属性窗口中选择 `TabPages` 属性并点击出现的省略号，将显示 `TabPage`\
  \ 集合编辑器。通过此编辑器，你可以添加、删除、插入和移动标签页。要添加标签页，点击 `Add` 按钮。将为标签分配名称和索引。最初会添加两个标签，因此编辑器看起来如下：\n\
  \n![Image](img/00238.jpeg)\n\n可以根据需要添加任意标签页。标签页“数组”是从零开始索引的；因此，如果你有 `N` 个标签，第一个索引是\
  \ 0，最后一个索引是 `N – 1`。你可以在属性区域更改你需要的任何属性。\n\n### TabPage 属性\n\n| 名称 | 说明 |\n| :---\
  \ | :--- |\n| `Name` | 获取或设置标签页的名称（控件名称的三字母前缀为 tab）。 |\n| `BackColor` | 获取或设置标签页的背景颜色。\
  \ |\n| `BorderStyle` | 获取或设置标签页的边界样式。 |\n| `Font` | 获取或设置字体名称、样式、大小。 |\n| `ForeColor`\
  \ | 获取或设置文本或图形的颜色。 |\n| `Text` | 出现在标签页上的标题信息。 |\n\n完成后，点击 `OK` 退出 `TabPage` 集合编辑器。\n\
  \n下一步是向标签控件的每个“页”添加控件。这非常简单。只需点击标签即可显示所需的标签页。然后现在标签页上放置控件，将该页视为组框或面板控件。确保你的控件已“附着”到标签页上。你仍然可以在表单上放置未与任何标签页关联的控件。作为程序员，你需要知道哪个标签是激活的（`SelectedIndex`\
  \ 属性）。你需要确定与每个标签页相关的控件。\n\n#### TabControl 控件的典型用法：\n- ➢ 设置 `Name` 属性和大小。\n- ➢ 使用\
  \ `TabPage` 集合编辑器设置标签页。\n- ➢ 向标签页添加控件。\n- ➢ 编写与标签控件相关的代码。\n\n标签控件正成为 Windows 应用程序中非常流行的控件。它允许在单个表单中放置大量功能。10。\n\
  \n## ToolStrip（工具栏）控件\n\n![Image](img/0395.jpeg)\n\n几乎所有的 Windows 应用程序现在都使用工具栏。工具栏为常用命令提供了快速访问。在数据库应用程序中，它可以添加、删除或编辑记录。`ToolStrip`\
  \ 控件（称为工具栏）本身就是一个微应用程序。它提供了设计和实现工具栏所需的一切。\n\n### ToolStrip 属性\n\n| 名称 | 说明 |\n|\
  \ :--- | :--- |\n| `Name` | 获取或设置工具栏控件的名称（控件名称的三字母前缀为 tab）。 |\n| `BackColor` | 背景颜色。\
  \ |\n| `Items` | 分配给工具栏的控件集合。 |\n| `LayoutStyle` | 建立工具栏是垂直还是水平的。 |\n| `Dock` |\
  \ 建立工具栏在表单上的位置。 |\n\n主要的属性是 `Items` 集合。它建立了工具栏中的每个项。在属性窗口中选择 `Items` 属性并点击出现的省略号，将显示项编辑器。通过此编辑器，你可以添加、删除、插入和移动项。我们将查看添加两种类型的项：`ToolStripButton`\
  \ 和 `ToolStripSeparator`（用于分隔工具栏按钮）。要添加按钮，确保 `ToolStripButton` 出下拉框中并点击 `Add` 按钮。将为按钮分配一个名称。添加一个按钮后，编辑器看起来如下：\n\
  \n![Image](img/00247.jpeg)\n\n### ToolStripButton 属性\n\n| 名称 | 说明 |\n| :--- | :---\
  \ |\n| `Name` | 获取或设置按钮的名称（控件名称的三字母前缀为 tab）。 |\n| `DisplayStyle` | 设置在按钮上显示图像、文本还是两者都有。\
  \ |\n| `Image` | 显示在按钮上的图像。 |\n| `Text` | 显示在按钮上的说明信息，通常为空。 |\n| `TextImageRelation`\
  \ | 文本相对于图像的位置。 |\n| `ToolTipText` | 显示在按钮工具提示中的文本。 |\n\n要添加分隔符，确保 `ToolStripSeparator`\
  \ 出现在下拉框中并点击 `Add`。完成按钮编辑后，点击 `OK` 退出项编辑器。\n\n\n\n\n\n设置 `Image` 属性需要几个步骤（该过程类似于用于\
  \ Picture 框控件的过程）。首先，点击属性窗口中 `Image` 属性旁边的省略号。将出现此“选择资源”窗口：\n\n![Image](img/00087.jpeg)\n\
  \n图像将是本地资源，因此请选择 `Local resource`（本地资源）单选按钮并点击 `Import`（导入）按钮。\n\n一个“打开”窗口将显示图形文件（如果你想查看\
  \ `ico` 文件，必须将`Files of type`更改为 `All Files`）。在 `VCSDB\\Code\\Class 5` 文件夹中有一个名为\
  \ `Toolbar Graphics` 的文件夹。在此文件夹中，有很多用于工具栏的位图文件：\n\n![Image](img/00096.jpeg)\n\n\
  选择所需的文件并点击 `Open`。一旦选择了图像，在“选择资源”窗口中点击 `OK`。它将被分配给 `Image` 属性。\n\n设置好工具栏后，你需要为每个工具栏按钮编写\
  \ `Click` 事件的代码。此事件与我们在按钮控件中遇到的 `Click` 事件是相同的。\n\n### ToolStrip 控件的典型用法\n\n> ➢\
  \ 设置 `Name` 属性和所需的位置。\n> ➢ 为每个按钮决定图像、`text` 和 `tooltip text`（工具提示文本）。\n> ➢ 使用 `Items\
  \ Collection Editor`（项目集合编辑器）建立每个按钮/分隔符。\n> ➢ 为每个工具栏按钮的 `Click` 事件编写代码。\n\n工具栏是一个非常强大且专业的工具。而且它很容易实现和使用。在适合界面设计的地方，尽量使用它。\n\
  \n### ListBox 控件\n\n![Image](img/00127.jpeg)\n\n`ListBox` 控件显示项目列表（可以根据需要显示任意数量），用户从中可以选择一个或多个项目。如果项目数量超过了显示数量，将会自动添加滚动条。它支持单项选择和多项选择。对于数据库应用程序，你可以在同一个控件中显示多行数据（给定字段）（请参见\
  \ `DataSource` 和 `DisplayMember` 属性）。\n\n#### ListBox 属性\n\n| Name | Description\
  \ |\n| :--- | :--- |\n| `Name` | 获取或设置列表框的名称（列表框名称的三字母前缀为 `lst`）。 |\n| `BackColor`\
  \ | 获取或设置列表框的背景颜色。 |\n| `DataSource` | 要绑定到控件的数据表。 |\n| `DisplayMember` | 从数据源中要显示的字段。\
  \ |\n| `Font` | 获取或设置字体名称、样式、大小。 |\n| `ForeColor` | 获取或设置文本颜色。 |\n| `Items` | 获取列表框的\
  \ `Items` 对象。 |\n| `SelectedIndex` | 获取或设置列表框中当前选中项的从 0 开始的索引。 |\n| `SelectedIndices`\
  \ | 列表框中所有当前选中项索引的从 0 开始的数组。 |\n| `SelectedItem` | 获取或设置列表框中当前选中的项目。 |\n| `SelectedItems`\
  \ | 列表框的 `SelectedItems` 对象。 |\n| `SelectedValue` | 用于数据绑定的由/向 `ValueMember` 提供的或接收的值。\
  \ |\n| `SelectionMode` | 获取或设置在列表框中选择项目的方法（允许单选或多选）。 |\n| `Sorted` | 获取或设置一个值，该值指示列表框中的项目是否按字母顺序排序。\
  \ |\n| `Text` | 列表框中当前选中项的文本。 |\n| `TopIndex` | 获取或设置列表框中第一个可见项的索引。 |\n| `ValueMember`\
  \ | 与 `DisplayMember` 显示的相同记录对应的数据源字段。 |\n\n#### ListBox 方法\n\n| Method | Description\
  \ |\n| :--- | :--- |\n| `ClearSelected` | 取消列表框中所有项目的选择。 |\n| `FindString` | 在列表框中查找第一个以指定字符串开头的项目。\
  \ |\n| `GetSelected` | 返回一个指示指定项目是否被选中的值。 |\n| `SetSelected` | 选择或清除列表框中指定项目的选定状态。\
  \ |\n\n#### ListBox 事件\n\n| Event | Description |\n| :--- | :--- |\n| `SelectedIndexChanged`\
  \ | 当 `SelectedIndex` 属性发生变化时发生。 |\n\n数据绑定列表控件的用途之一是从数据库表（`DataSource`）填充列表（`DisplayMember`），然后允许进行选择。这允许我们列出数据库表中特定字段的所有值。这些选择可以被表上的任何控件使用，无论其是否绑定了数据。对于我们一直在使用的\
  \ `BooksDB.accdb` 数据库 `Authors` 表，如果我们显示 `Author` 字段，列表框将显示：\n\n![Image](img/00042.jpeg)\n\
  \n更复杂的数据绑定（使用 `SelectedValue` 和 `ValueMember` 属性）是可能的。在稍后的章节中开发书籍数据库管理系统时，我们将查看这种复杂绑定（参见示例\
  \ 6-9）。\n\n使用列表框 `Items` 对象、`SelectedItems` 对象和 `SelectionMode` 属性还需要进一步的讨论。`Items`\
  \ 对象有它自己的属性来指定列表框中的项目。它还有它自己的方法来在列表框中添加和删除项目。`Items` 对象是列表中项目的从 0 开始的数组，而 `Count`（`Items`\
  \ 的一个属性）是列表中的项目数量。因此，名为 `lstExample` 的列表框中的第一个项目是：\n\n```\nlstExample.Items[0]\n\
  ```\n\n名为 `lstExample` 的列表框中的最后一个项目是：\n\n```\nlstExample.Items[lstExample.Items.Count\
  \ - 1]\n```\n\n使用 `Items` 对象的、`SelectedItems` 对象和 `SelectionMode` 属性还需要进一步的讨论。\n\
  \n`Items` 对象有它自己的属性来指定列表框中的项目。它还有它自己的方法来在列表框中添加和删除项目。`Items` 对象是列表中项目的从 0 开始的数组，而\
  \ `Count`（`Items` 的一个属性）是列表中的项目数量。因此，名为 `lstExample` 的列表框中的第一个项目是：\n\n```\nlstExample.Items[0]\n\
  ```\n\n名为 `lstExample` 的列表框中的最后一个项目是：\n\n```\nlstExample.Items[lstExample.Items.Count\
  \ - 1]\n```\n\n使用 `Items` 对象的、`SelectedItems` 对象和 `SelectionMode` 属性还需要进一步的讨论。\n\
  \n`Items` 对象有它自己的属性来指定列表框中的项目。它还有它自己的方法来在列表框中添加和删除项目。`Items` 对象是列表中项目的从 0 开始的数组，而\
  \ `Count`（`Items` 的一个属性）是列表中的项目数量。因此，名为 `lstExample` 的列表框中的第一个项目是：\n\n```\nlstExample.Items[0]\n\
  ```\n\n名为 `lstExample` 的列表框中的最后一个项目是：\n\n```\nlstExample.Items[lstExample.Items.Count\
  \ - 1]\n```\n\n*(注：由于原文文本中存在大量重复的段落，上述翻译已根据“不要重复输出原文”的原则进行了去重处理，并确保逻辑连贯。)*\n\n**修正后的完整翻译（去重并逻辑对齐后）：**\n\
