  5. 在 `frmAuthors_Load`: 将所有的 `OleDbCommand` 改为 `SqlCommand`，所有的 `OleDbDataAdapter`\
  \ 改为 `SqlDataAdapter`。\n\n## 数据库管理\n\n### 回顾预览\n\n在前面的章节中，我们已经了打开数据库的能力。利用这些知识，我们构建一个数据库管理系统。在本章中，我们将学习数据库管理的步骤。\n\
  \n### 数据库管理任务\n\n正如第 1 章提到的，数据库的任务非常简单。从概念上讲，你可以对数据库做几件事：\n\n1. 查看数据\n2. 修改（编辑）数据\n\
  3. 添加数据\n4. 删除数据\n5. 查找数据\n\n在学习的现在，我们已经详细讨论了主题 1（查看数据）。在本节中，我们将处理接下来的三个主题。最后一个主题（查找数据）将在本章后面介绍。\n\
  \n### 编辑数据库记录\n\n数据库编辑涉及对数据表中多个记录的字段进行修改。该数据表是由 ADO .NET 数据连接对象处理某些 SQL 语句形成的。在\
  \ Visual C# 中编辑数据是一个简单的任务——三个步骤：\n\n1. 显示要编辑的记录和相关字段。\n2. 进行更改。\n3. 保存更改。\n\n一旦完成步骤\
  \ 1 和 2，步骤 3 是自动的（如果你允许）。编辑后，当你通过程序导航或其他操作移动到另一个记录时，ADO .NET（通过货币管理器数据适配器）会保存更改。这种自动保存更改对于简单的应用程序非常有用，但它让编辑变得过于简单。我们将更系统地进行编辑。我们遵循的编辑步骤是：\n\
  \n1. 显示要编辑的记录和相关字段。\n2. 进行更改。\n3. 验证更改。\n4. 保存更改（或可选地取消编辑操作）。\n\n\n\n\n要显示记录，我们使用程序化导航或某些搜索技术。一旦显示了正确的记录，它会自动进入编辑模式。在编辑模式下，用户可以使用任何表示该字段的\
  \ Visual C# 数据绑定控件来更改任何所有显示的字段。\n\n在编辑之后，我们需要进行适当的输入和输入验证，以确保符合所有验证规则。ADO .NET 没有为验证提供任何特定的事件方法。你作为程序员，需要提供所有的验证代码并决定将这些代码放在什么位置。只需确保在将任何新信息写入数据库之前完成验证即可。\n\
  \n在大多数情况下，你将希望给用户保存更改和/或取消任何编辑的选项。要保存编辑，请使用货币管理器的 `EndCurrentEdit` 方法。假设有一个名为 `myManager`\
  \ 的管理器，保存当前记录的语法为：\n\n```\nmyManager.EndCurrentEdit();\n```\n\n这将保存绑定到货币管理器的数据绑定控件中的值。这不会在数据库中保存新值（它只保存了本地数据表副本）。\n\
  \n要在数据库中保存更改，我们使用数据适配器的 `Update` 方法。如果数据适配器 `myAdapter` 连接到名为 `myTable` 的数据表，保存更改的语法为：\n\
  \n```\nmyAdapter.Update(myTable);\n```\n\n为了使此行代码正常运行，它需要一个通过以下方式创建的“更新命令”：\n\n\
  ```\nOldDbCommandBuilder myAdapterUpdate = new OleDbCommandBuilder(myAdapter);\n\
  ```\n\n此声明是在使用 `Update` 方法之前定义的（它还创建了适配器所需的删除和插入命令）。这种保存方法通常在应用程序关闭时执行。\n\n要取消编辑期间所做的任何更改，你使用货币管理器的\
  \ `CancelCurrentEdit` 方法。语法为：\n\n```\nmyManager.CancelCurrentEdit();\n```\n\n之后，数据绑定控件将重置为它们的“编辑前”值。\n\
  \n# 电话联系人数据库\n\n在本章的许多示例中，我们将使用一个名为 `PhoneDB.accdb` 的练习数据库，它包含在示例代码中（位于 `VCSDB\\\
  Databases` 文件夹下）。这是一个简单的联系人数据库，在名为 `PhoneTable` 的单表中包含名称和电话号码的三个字段（`ContactID`、`ContactName`\
  \ 和 `ContactNumber`）。使用此示例让我们能够编辑、添加和删除记录，而不必担心破坏某些重要内容，例如书籍数据库。\n\n电话数据库 `PhoneTable`\
  \ 表有 26 条记录：\n\n![Image](img/00117.jpeg)\n\n`ContactName` 和 `ContactName` 是简单的字符串字段。`ContactID`\
  \ 是主键并是自动编号的，确保每条记录都有唯一值。ADO .NET 数据库引擎分配该值，我们不会让用户更改它。\n\n## 示例 6-1：编辑数据库记录\n\n\
  让我们查看编辑数据库记录时的一些编码和考虑因素。我们将使用电话数据库（`PhoneDB.accdb`）及其单表 `PhoneTable`。要从此表中检索字段（按\
  \ `ContactName` 排序），我们使用此 SQL 语句：\n\n```\nSelect * from PhoneTable ORDER BY ContactName\n\
  ```\n\n1. 将 `PhoneDB.accdb` 复制到与 `BooksDB.accdb` 和 `NWindDB.accdb` 相同的工作目录（让我们可以在代码目录中保留一个“干净”的副本）。记得我们一直使用的工作目录是\
  \ `c:\\VCSDB\\Working`。\n\n2. 启动新应用程序。在项目表单上添加三个标签、三个文本框和四个按钮。表单看起来应该像这样：\n\n![Image](img/00397.jpeg)\n\
  \n为每个控件设置以下属性：\n\n| Form1: | | |\n| :--- | :--- |\n| Name | `frmPhoneDB` |\n| FormBorderStyle\
  \ | `FixedSingle` |\n| StartPosition | `CenterScreen` |\n| Text | `Phone DBMS` |\n\
