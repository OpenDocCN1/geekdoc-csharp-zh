  \ 表添加并保存一条记录时，我们收到了一个错误消息，说明未提供 `PubID` 字段。我们现在来纠正这个问题。如所述，书籍数据库中的每条标题都需要一个 `PubID`（或出版者识别码）编号。这是一个与\
  \ `Publishers` 表中的主键相关的外键。此键告诉我们书籍的出版者是谁。\n\n对于现有的记录，由于它是外键，`PubID` 值是已知且可以更改的。对于新增的记录，用户必须提供一个值。但是，用户如何知道书籍出版者的\
  \ `PubID` 值呢？他们可能并不知道。但用户应该知道出版者的名称。与其要求用户提供 `PubID`，不如让用户提供出版者名称，并让数据库引擎提供相应的 `PubID`。同样，当用户导航到一条现有记录时，我们更希望看到出版者名称而不是相应的\
