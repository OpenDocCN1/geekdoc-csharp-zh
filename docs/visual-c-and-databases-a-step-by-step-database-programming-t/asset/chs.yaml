  \ | 与 `DisplayMember` 显示的相同记录对应的数据源字段。 |\n\n#### ListBox 方法\n\n| Method | Description\
  \ |\n| :--- | :--- |\n| `ClearSelected` | 取消列表框中所有项目的选择。 |\n| `FindString` | 在列表框中查找第一个以指定字符串开头的项目。\
  \ |\n| `GetSelected` | 返回一个指示指定项目是否被选中的值。 |\n| `SetSelected` | 选择或清除列表框中指定项目的选定状态。\
  \ |\n\n#### ListBox 事件\n\n| Event | Description |\n| :--- | :--- |\n| `SelectedIndexChanged`\
  \ | 当 `SelectedIndex` 属性发生变化时发生。 |\n\n数据绑定列表控件的用途之一是从数据库表（`DataSource`）填充列表（`DisplayMember`），然后允许进行选择。这允许我们列出数据库表中特定字段的所有值。这些选择可以被表上的任何控件使用，无论其是否绑定了数据。对于我们一直在使用的\
