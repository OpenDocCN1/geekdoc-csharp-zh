  Debug` 文件夹（你可能需要先创建该文件夹）。\n\n5. 加载之前完成的示例 5-7。我们将修改此示例以包含我们的帮助系统。向项目中添加一个帮助提供程序控件——将其命名为\
  \ `hlpAuthors`。将 `frmAuthors` 的 `HelpNavigator` 属性设置为 `TableofContents`。\n\n6. 在\
  \ `frmAuthors_Load` 方法顶部附近添加阴影代码。这段代码指向项目应用程序文件夹中的帮助文件：\n\n```csharp\nprivate void\
