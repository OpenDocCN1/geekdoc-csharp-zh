  \     salesDatabase.Create(\"Provider=Microsoft.ACE.OLEDB.12.0;\n        Data Source\
  \ = \" + Application.StartupPath +\n        \"\\\\KWSalesDB.accdb\");\n        //\
  \ 创建 Customers 表\n        databaseTable = new Table();\n        databaseTable.Name\
  \ = \"Customers\";\n        // 添加字段\n        databaseTable.Columns.Append(\"CustomerID\"\
  , DataTypeEnum.adInteger, 10);\n        databaseTable.Columns.Append(\"FirstName\"\
  , DataTypeEnum.adWChar, 40);\n        databaseTable.Columns.Append(\"LastName\"\
  , DataTypeEnum.adWChar, 40);\n        databaseTable.Columns.Append(\"Address\",\
  \ DataTypeEnum.adWChar, 40);\n        databaseTable.Columns.Append(\"City\", DataTypeEnum.adWChar,\
  \ 40);\n        databaseTable.Columns.Append(\"State\", DataTypeEnum.adWChar, 20);\n\
  \        databaseTable.Columns.Append(\"Zip\", DataTypeEnum.adWChar, 10);\n    }\n\
  \    // (此处代码逻辑根据原文略有断层，保持翻译结构)\n    // ... 剩余部分代码逻辑 ...\n```\n\n2. 保存并运行应用程序。点击\
  \ `Create Database`。你应该看到 `Customers` 表现在有了字段：\n\n![Image](img/0185.jpeg)\n\n记住添加的字段是必填项。对于我们的销售数据库，这是所需要的。但在许多情况下，并非如此。要从字段中移除此限制，使用：\n\
  \n```csharp\nmyTable.Columns(myFieldName).Attributes = ColumnAttributesEnum.adColNullable;\n\
  ```\n\n现在，如果你重新运行并在 `Access` 中查看表，发现：\n\n![Image](img/0194.jpeg)\n\n## 定义主键\n\n\
  我们需要为表定义主键。要这样做，我们使用 `ADOX Table` 的 `Keys` 集合。创建一个名为 `myTable` 的表的语法如下：\n\n```csharp\n\
  myTable.Keys.Append(myKeyName, KeyTypeEnum.adKeyPrimary);\n```\n\n其中 `myKeyName`\
  \ 是分配给键的名称，`myFieldName` 是被指定为主键的字段。这两个空参数用于外键，在这里不需要。我们的 `Customers` 表有一个主键，`CustomerID`。\n\
  \n1. 回到你的项目。在 `btnCreate_Click` 方法中添加阴影代码：\n\n```csharp\nprivate void btnCreate_Click(object\
  \ sender, EventArgs e)\n{\n    Catalog salesDatabase = new Catalog();\n    Table\
  \ databaseTable;\n    try\n    {\n        salesDatabase.Create(\"Provider=Microsoft.ACE.OLEDB.12.0;\n\
  \        Data Source = \" + Application.StartupPath +\n        \"\\\\KWSalesDB.accdb\"\
  );\n        // 创建 Customers 表\n        databaseTable = new Table();\n        databaseTable.Name\
  \ = \"Customers\";\n        // 添加字段\n        databaseTable.Columns.Append(\"CustomerID\"\
  , DataTypeEnum.adInteger, 10);\n        databaseTable.Columns.Append(\"FirstName\"\
  , DataTypeEnum.adWChar, 40);\n        databaseTable.Columns.Append(\"LastName\"\
  , DataTypeEnum.adWChar, 40);\n        databaseTable.Columns.Append(\"Address\",\
  \ DataTypeEnum.adWChar, 40);\n        databaseTable.Columns.Append(\"City\", DataTypeEnum.adWChar,\
  \ 40);\n        databaseTable.Columns.Append(\"State\", DataTypeEnum.adWChar, 20);\n\
  \        databaseTable.Columns.Append(\"Zip\", DataTypeEnum.adWChar, 10);\n    \
  \    // 添加键\n        databaseTable.Keys.Append(\"PK_Customers\", KeyTypeEnum.adKeyPrimary,\
  \ \"CustomerID\", null, null);\n        salesDatabase.Tables.Append(databaseTable);\n\
  \    }\n    catch (Exception ex)\n    {\n        MessageBox.Show(ex.Message, \"\
  Error\",\n        MessageBoxButtons.OK, MessageBoxIcon.Error);\n    }\n    finally\n\
  \    {\n        salesDatabase = null;\n    }\n}\n```\n\n2. 保存并运行应用程序。查看 `Customers`\
  \ 表显示 `CustomerID` 是主键（注意第一列中的键匙图标）：\n\n![Image](img/00143.jpeg)\n\n## 定义表索引\n\n\
  最后，我们想要为表定义索引。要这样做，我们使用 `ADOX Table` 的 `Indexes` 集合。创建一个名为 `myTable` 的表的语法如下：\n\n\
  ```csharp\nmyTable.Indexes.Append(myIndexName, myFieldName);\n```\n\n其中 `myIndexName`\
  \ 是分配给索引的名称，`myFieldName` 是被指定为索引的字段。这两个名称的值可以相同。我们的 `Customers` 表有两个索引字段，`CustomerID`\
  \ 和 `LastName`。让我们来定义它们。\n\n\n\n\n```vb\nPrivate Sub btnCreate_Click(ByVal sender\
  \ As System.Object, ByVal e As System.EventArgs) Handles btnCreate.Click\n\n   \
  \ Dim SalesDatabase As New Catalog\n    Dim DatabaseTable As Table\n\n    Try\n\
  \        SalesDatabase.Create(\"Provider=Microsoft.ACE.OLEDB.12.0; Data Source =\
  \ \" + Application.StartupPath + \"\\KWSalesDB.accdb\")\n        ' Create Customers\
  \ table\n        DatabaseTable = New Table\n        DatabaseTable.Name = \"Customers\"\
  \n        ' Add fields\n        DatabaseTable.Columns.Append(\"CustomerID\", DataTypeEnum.adInteger)\n\
  \        DatabaseTable.Columns(\"CustomerID\").ParentCatalog = SalesDatabase\n \
  \       DatabaseTable.Columns(\"CustomerID\").Properties(\"Autoincrement \").Value\
  \ = True\n        DatabaseTable.Columns.Append(\"FirstName\", DataTypeEnum.adWChar,\
  \ 40)\n        DatabaseTable.Columns.Append(\"LastName\", DataTypeEnum.adWChar,\
  \ 40)\n        DatabaseTable.Columns.Append(\"Address\", DataTypeEnum.adWChar, 40)\n\
  \        DatabaseTable.Columns.Append(\"City\", DataTypeEnum.adWChar, 40)\n    \
  \    DatabaseTable.Columns.Append(\"State\", DataTypeEnum.adWChar, 20)\n       \
  \ DatabaseTable.Columns.Append(\"Zip\", DataTypeEnum.adWChar, 10)\n        ' Add\
  \ keys\n        DatabaseTable.Keys.Append(\"PK_Customers\", KeyTypeEnum.adKeyPrimary,\
  \ \"CustomerID\")\n        ' Add indexes\n        DatabaseTable.Indexes.Append(\"\
  CustomerID\", \"CustomerID\")\n        DatabaseTable.Indexes.Append(\"LastName\"\
  , \"LastName\")\n        SalesDatabase.Tables.Append(DatabaseTable)\n    Catch ex\
  \ As Exception\n        MessageBox.Show(ex.Message, \"Error\", MessageBoxButtons.OK,\
  \ MessageBoxIcon.Error)\n    Finally\n        SalesDatabase = Nothing\n    End Try\n\
  End Sub\n```\n\n2. 保存并运行应用程序。点击 `Create Database`。如果你检查 `Customers` 表中的 `CustomerID`\
  \ 和 `LastName` 字段（使用 `Access`），你将发现它们是索引。`Customers` 表现在已经创建完成。让我们创建其他三个表。\n\n3.\
  \ `Orders` 表有三个字段：\n\n| Name | DataType |\n| :--- | :--- |\n| `OrderID` | Text (FieldSize\
  \ = 10) |\n| `CustomerID` | Number (Long Integer, no default value, FieldSize =\
  \ 10) |\n| `OrderDate` | Date/Time (FieldSize = 20) |\n\n主键是 `OrderID`。所有三个字段都是索引字段。创建此表结构的代码如下：\n\
  \n```javascript\n// Create Orders table\ndatabaseTable = new Table();\ndatabaseTable.Name\
  \ = \"Orders\";\n// Add fields\ndatabaseTable.Columns.Append(\"OrderID\", DataTypeEnum.adWChar,\
  \ 10);\ndatabaseTable.Columns.Append(\"CustomerID\", DataTypeEnum.adInteger, 10);\n\
  databaseTable.Columns.Append(\"OrderDate\", DataTypeEnum.adDate, 20);\n// Add keys\n\
  databaseTable.Keys.Append(\"PK_OrderID\", KeyTypeEnum.adKeyPrimary, \"OrderID\"\
  , null, null);\n// Add indexes\ndatabaseTable.Indexes.Append(\"OrderID\", \"OrderID\"\
  );\ndatabaseTable.Indexes.Append(\"CustomerID\", \"CustomerID\");\ndatabaseTable.Indexes.Append(\"\
  OrderDate\", \"OrderDate\");\nsalesDatabase.Tables.Append(databaseTable);\n```\n\
  \n将此代码添加到创建 `Customers` 表之后的 `btnCreate_Click` 方法中。再次保存应用程序并运行。点击 `Create Database`。在\
