  \ | Text (FieldSize = 10) |\n| Quantity | Number (Integer, no default value) |\n\
  \n2. 为表添加两个索引。这里：\n\n![Image](img/00040.jpeg)\n\n3. 关闭窗口。将表保存为 `Purchases`。你会看到此消息询问是否要定义主键：\n\
