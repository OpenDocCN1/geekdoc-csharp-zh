  \n### Products 表\n\n1. 在设计视图中创建最后一个表。添加以下字段：\n\n| Name | DataType |\n| :--- | :---\
  \ |\n| ProductID | Text (FieldSize = 10) |\n| Description | Text (FieldSize = 40)\
