  \ Purchase Cost（我们支付了多少钱）\n- Serial Number（物品序列号）\n- Photo File（物品照片的路径）\n- Engraved（指示物品是否刻有身份识别信息）\n\
  \n家庭清单项目的开发将按照通常的逻辑顺序进行。我们首先创建数据库。接下来，构建界面，允许用户查看、编辑、添加或删除数据库中的记录。最后，我们添加一些代码来创建数据库中创建可打印的信息列表。\n\
