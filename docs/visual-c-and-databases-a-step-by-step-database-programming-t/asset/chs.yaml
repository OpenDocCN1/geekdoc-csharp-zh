  Select * FROM Authors ORDER BY Author\", booksConnection);\n\n    // 建立数据适配器\n \
  \   authorsAdapter = new OleDbDataAdapter();\n    authorsTable = new DataTable();\n\
  \    authorsAdapter.Fill(authorsTable);\n\n    // 将控件绑定数据表\n    txtAuthorID.DataBindings.Add(\"\
  Text\", authorsTable, \"Au_ID\");\n    txtAuthorName.DataBindings.Add(\"Text\",\
