  \ 6-9）。\n\n使用列表框 `Items` 对象、`SelectedItems` 对象和 `SelectionMode` 属性还需要进一步的讨论。`Items`\
  \ 对象有它自己的属性来指定列表框中的项目。它还有它自己的方法来在列表框中添加和删除项目。`Items` 对象是列表中项目的从 0 开始的数组，而 `Count`（`Items`\
  \ 的一个属性）是列表中的项目数量。因此，名为 `lstExample` 的列表框中的第一个项目是：\n\n```\nlstExample.Items[0]\n\
  ```\n\n名为 `lstExample` 的列表框中的最后一个项目是：\n\n```\nlstExample.Items[lstExample.Items.Count\
  \ - 1]\n```\n\n\n\n\n- ➢ 如果配合数据库使用，将 `DataSource` 属性设置为所需的数据表，并将 `DisplayMember`\
  \ 属性设置为对应的数据表字段。\n- ➢ 监控 `SelectedIndexChanged` 事件以获取单个选择。\n- ➢ 使用 `SelectedIndex`\
  \ 或 `Text` 属性来确定选定的项目。\n\n什么时候应该使用组合框（combo control）而不是列表框（list box control）？组合框是一个极佳的数据输入控件。它优于列表框的优势在于为经验丰富的用户提供了输入他们知道是正确的数值的能力，从而加速数据输入过程。列表框控件不允许任何输入。当表单空间有限时，它也是一个很好的控件。使用\
  \ `DropDownList` 样式可以复制列表框的功能，而不需要为列表框留空间。\n\n## DataGridView 控件\n\n![Image](img/00026.jpeg)\n\
  \n数据网格视图控件是最实用的数据绑定控件之一。它可以显示整个数据库表。然后可以根据需要对表格进行编辑。回想一下，我们在第 4 章的 SQL Tester 程序中使用过此控件。\n\
  \n从功能来看，数据绑定网格控件本身自成一类。它本质上是一个独立的、功能非常强大的程序。它有一个主要属性：\n\n| 属性 | 描述 |\n| :--- | :---\
  \ |\n| `DataSource` | 要显示的数据表名称。 |\n\n数据网格视图控件是 `DataColumn` 对象的集合（对应表中的字段）以及 `DataRow`\
  \ 对象的集合（对应记录）。可以通过鼠标操作或编程方式访问并编辑单元格。\n\n对于书籍数据库，如果我们在数据网格视图中显示一直以来使用的 Authors 表（`DataSource`\
  \ 属性），我们将看到：\n\n![Image](img/00368.jpeg)\n\n`DataGridView` 控件的典型用法：\n- ➢ 设置 `Name`\
  \ 属性。\n- ➢ 将 `DataSource` 属性设置为所需的数据表。\n- ➢ 添加任何所需的编辑功能。\n\n随着你数据库学习的深入，鼓励你进一步研究数据网格视图控件（属性、事件、方法）。我们将在后续章节学习的应用中使用它。\n\
  \n## MonthCalendar 控件\n\n![Image](img/00452.jpeg)\n\n`MonthCalendar` 控件允许用户选择日期。这是一个非常易用的界面——只需指向并点击即可。该控件用于信息排序、预订或选择当前日期。它可以用于选择单个日期或一个日期范围。\n\
  \n### MonthCalendar 属性：\n\n| 属性 | 描述 |\n| :--- | :--- |\n| `Name` | 获取或设置月份日历的名称（标签名的三字母前缀为\
  \ cal）。 |\n| `BackColor` | 获取或设置月份日历的背景颜色。 |\n| `CalendarDimensions` | 获取或设置显示的月份列数和行数。\
  \ |\n| `FirstDayOfWeek` | 获取或设置月份日历中显示的每周的第一天。 |\n| `Font` | 获取或设置字体名称、样式、大小。 |\n\
  | `ForeColor` | 获取或设置文本或图形的颜色。 |\n| `MaxDate` | 获取或设置允许的最大日期。 |\n| `MaxSelectionCount`\
  \ | 在月份日历控件中可以选择的最大天数。 |\n| `MinDate` | 获取或设置允许的最小日期。 |\n| `SelectionEnd` | 获取或设置选定日期范围的结束日期。\
  \ |\n| `SelectionRange` | 获取月份日历控件的选定日期范围。 |\n| `SelectionStart` | 获取或设置选定日期范围的开始日期。\
  \ |\n| `ShowToday` | 获取或设置一个值，指示 `TodayDate` 属性代表的日期是否显示在控件底部。 |\n| `ShowTodayCircle`\
  \ | 获取或设置一个值，指示当天的日期是否被圈出。 |\n| `TodayDate` | 获取或设置 `MonthCalendar` 用作今天日期的值。 |\n\
  \n### MonthCalendar 方法：\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `SetDate` | 设置日期为当前选定的日期。\
  \ |\n\n### MonthCalendar 事件：\n\n| 事件 | 描述 |\n| :--- | :--- |\n| `DateChanged` |\
  \ 当 `MonthCalendar` 中的日期发生变化时发生。 |\n| `DateSelected` | 当选择某个日期时发生。 |\n\n`MonthCalendar`\
  \ 控件的典型用法：\n- ➢ 设置 `Name` 属性。设置 `MaxSelectionCount`（如果只是选择单个日期，则设置为 1）。\n- ➢ 监控\
  \ `DateChanged` 和/或 `DateSelected` 事件以确定日期值。值位于 `SelectionStart` 和 `SelectionEnd`\
  \ 属性之间。\n\n## DateTimePicker 控件\n\n![Image](img/00125.jpeg)\n\n`DateTimePicker`\
  \ 控件的工作原理类似于 `MonthCalendar` 控件，但不同的界面和格式选项。它允许用户选择单个日期。选定的日期出现在组合框中。日历部分以“下拉”的形式提供。此控件也可以用于选择时间；我们不会查看那个选项。\n\
  \n### DateTimePicker 属性：\n\n| 属性 | 描述 |\n| :--- | :--- |\n| `Name` | 获取或设置日期/时间选择控件的名称（标签名的三字母前缀为\
  \ dtp）。 |\n| `BackColor` | 获取或设置控件背景颜色。 |\n| `Font` | 获取或设置字体名称、样式、大小。 |\n| `ForeColor`\
  \ | 获取或设置文本或图形的颜色。 |\n| `Format` | 获取或设置显示的日期的格式。 |\n| `MaxDate` | 获取或设置允许的最大日期。\
  \ |\n| `MinDate` | 获取或设置允许的最小日期。 |\n| `Value` | 获取或设置分配给控件的日期值。 |\n\n### DateTimePicker\
  \ 事件：\n\n| 事件 | 描述 |\n| :--- | :--- |\n| `ValueChanged` | 当 `Value` 属性更改时发生。 |\n\
  \n`DateTimePicker` 控件的典型用法：\n- ➢ 设置 `Name` 和 `Format` 属性。\n- ➢ 需要时读取 `Value` 属性。\n\
  \n## OpenFileDialog 控件\n\n![Image](img/0027.jpeg)\n\n在本课程的所有示例中，数据库名称假设在设计时是已知的。有时并非如此。例如，假设老师使用数据库应用程序跟踪成绩。当老师启动应用程序时，需要指定访问哪个数据库文件。我们从用户那里获取的是打开或保存文件的完整路径。\n\
  \n### OpenFileDialog 属性：让我们先查看文件对话框控件。\n\n### OpenFileDialog 属性：\n\n| 属性 | 描述 |\n\
  | :--- | :--- |\n| `Name` | 获取或设置文件对话框的名称（我通常将此控件命名为 `dlgOpen`）。 |\n| `AddExtension`\
  \ | 获取或设置一个值，如果用户省略扩展名，对话框会自动添加扩展名。 |\n| `CheckFileExists` | 获取或设置一个值，如果用户指定的文件不存在，对话框将显示警告。\
  \ |\n| `CheckPathExists` | 获取或设置一个值，如果用户指定的路径不存在，对话框将显示警告。 |\n| `DefaultExt` | 获取或设置默认文件扩展名。\
  \ |\n| `FileName` | 获取或设置包含文件对话框中选择的文件名的字符串。 |\n| `Filter` | 获取或设置当前文件名过滤器字符串，该字符串决定了“文件类型”框中的选项。\
  \ |\n| `FilterIndex` | 获取或设置文件对话框中当前选定过滤器的索引。 |\n| `InitialDirectory` | 获取或设置文件对话框显示的初始目录。\
  \ |\n| `Title` | 获取或设置文件对话框的标题。 |\n\n### OpenFileDialog 方法：\n\n| 方法 | 描述 |\n| :---\
  \ | :--- |\n| `ShowDialog` | 显示对话框。返回的值指示用户点击了哪个按钮（确定或取消）。 |\n\n\n\n\n\n要使用 `OpenFileDialog`\
  \ 控件，我们像添加任何控件一样将其添加到应用程序。由于 `OpenFileDialog` 控件没有即时用户界面（由你控制何时出现），因此该控件在设计时不会显示在表单上。此类\
  \ Visual C# 控件会出现在 IDE 设计窗口中表单下方的“托盘”中。添加后，我们设置几个属性。然后，我们编写代码在需要时显示对话框。接着，用户进行选择并关闭对话框。此时，我们使用提供的信息来完成我们的任务。\n\
  \n使用 `ShowDialog` 方法来显示 `OpenFileDialog` 控件。对于一个名为 `dlgOpen` 的控件，相应的代码是：\n\n```csharp\n\
  dlgOpen.ShowDialog();\n```\n\n显示的对话框类似于：\n\n![Image](img/00007.jpeg)\n\n用户使用对话框控件选择文件（或在\
  \ `File name` 框中输入名称）。文件类型从 `Files of type` 框中选择（此处的值通过 `Filter` 属性设置）。选中后，点击 `Open`\
  \ 按钮。可以点击 `Cancel` 取消打开操作。`ShowDialog` 方法返回被点击的按钮。如果点击 `Open`，它返回 `DialogResult.OK`；如果点击\
  \ `Cancel`，它返回 `DialogResult.Cancel`。该控件的优点是它可以在返回应用程序之前对文件名进行验证。`FileName` 属性包含所选文件的完整路径。\n\
  \n### `OpenFileDialog` 控件的典型用法：\n\n> - 设置 `Name`、`Filter` 和 `Title` 属性。\n> - 使用\
  \ `ShowDialog` 方法显示对话框。\n> - 读取 `FileName` 属性以确定所选文件\n\n## SaveFileDialog 控件\n\n\
  ![Image](img/00001.jpeg)\n\n为了获取保存文件名，我们使用 `SaveFileDialog` 控件。该控件确保用于保存文件的任何选路径都存在，并且如果选择了现有文件，用户已同意覆盖该文件。\n\
  \n### SaveFileDialog 属性\n\n| Name | Description |\n| :--- | :--- |\n| `Name` | 获取或设置保存文件对话框的（我通常将此控件命名为\
  \ `dlgSave`）。 |\n| `AddExtension` | 表示如果用户省略扩展名，对话框是否自动为文件名添加扩展名。 |\n| `CheckFileExists`\
  \ | 表示如果用户指定了不存在的文件名，对话框是否显示警告。当你希望用户保存到现有文件时这很有用。 |\n| `CheckPathExists` | 表示如果用户指定了不存在的路径，对话框是否显示警告。\
  \ |\n| `CreatePrompt` | 表示如果用户指定了不存在的文件，对话框是否提示用户请求创建文件的权限。 |\n| `DefaultExt` |\
  \ 获取或设置默认文件扩展名。 |\n| `FileName` | 获取或设置包含在文件对话框中选中的文件名的字符串。 |\n| `Filter` | 获取或设置当前文件名筛选字符串，该字符串决定了出现在“Files\
  \ of type”框中的选项。 |\n| `FilterIndex` | 获取或设置在文件对话框中当前选中的筛选器索引。 |\n| `InitialDirectory`\
  \ | 或或设置由文件对话框显示的初始目录。 |\n| `OverwritePrompt` | 表示如果用户指定了已存在的文件，对话框是否显示警告。默认值为 True。\
  \ |\n| `Title` | 获取或设置文件对话框的标题。 |\n\n### SaveFileDialog 方法\n\n| Method | Description\
  \ |\n| :--- | :--- |\n| `ShowDialog` | 显示对话框。返回值表示用户点击了哪个按钮（OK 或 Cancel）。 |\n\n\
  `SaveFileDialog` 控件将出现在设计窗口的托盘区域。使用 `ShowDialog` 方法来显示 `SaveFileDialog` 控件。对于一个名为\
  \ `dlgSave` 的控件，相应的代码是：\n\n```csharp\ndlgSave.ShowDialog();\n```\n\n显示的对话框类似于：\n\
  \n![Image](img/00206.jpeg)\n\n用户在 `File name` 框中输入名称（或使用对话框控件选择文件）。文件类型从 `Files\
  \ of type` 框中选择（此处的值通过 `Filter` 属性设置）。选中后，点击 `Save` 按钮。可以点击 `Cancel` 取消保存操作。如果用户选择了现有文件并点击\
  \ `Save`，将出现以下对话框：\n\n![Image](img/00119.jpeg)\n\n这就是上述防止无意覆盖现有文件的保护机制。`ShowDialog`\
  \ 方法返回被点击的按钮。如果点击 `Save`，它返回 `DialogResult.OK`；如果点击 `Cancel`，它返回 `DialogResult.Cancel`。`FileName`\
  \ 属性包含所选文件的完整路径。\n\n### `SaveFileDialog` 控件的典型用法：\n\n> - 设置 `Name`、`DefaultExt`、`Filter`\
  \ 和 `Title` 属性。\n> - 使用 `ShowDialog` 方法显示对话框。\n> - 读取 `FileName` 属性以确定所选文件\n\n###\
  \ 总结\n\n这里涵盖了丰富的材料。你现在有了关于 Visual C# 工具箱以及如何使用这些工具进行适当界面设计的完整参考。Visual C# 界面非常重要，我们希望确保你有许多可用工具。这将使你（以及用户）任务变得简单得多。\n\
  \n尽管做了这些工作，我们的界面仍不完整。我们仍然需要允许我们编辑、添加和删除数据库中记录的代码。我们需要允许我们撤销更改的代码。这些主题以及更多内容将在后续章节中介绍。\n\
  \n## 示例 5-9：Publishers 表表单\n\n在本章中，我们构建了一个允许我们维护数据库中 `Authors` 表的框架。该框架将在下一章进行修改并作为数据库管理系统的一部分实现。该数据库管理系统还需要维护\
  \ `Publishers` 和 `Titles` 表的界面。`Titles` 表界面有点复杂，因为它使用外键引用其他表。我们将在下一章开发此界面。作为练习，我们将开始维护\
  \ `Publishers` 表。\n\n我们将遵循在本章中构建 Authors 输入表单时使用的步骤：\n\n> - 构建界面\n> - 添加消息框（框）\n\
  > - 编写状态\n> - 执行输入验证\n> - 执行输入验证\n> - 添加错误捕获和处理\n> - 添加在线帮助系统\n> - 测试\n\n然而，与其从零开始，我们将遵循一种经过验证的编程方法——将现有应用程序适应新用途。`Publishers`\
  \ 表界面本质上与 `Authors` 表界面相同，只是更多（或不同的）输入字段。适应现有应用程序为我们程序员节省了大量时间。你必须确保修改符合新应用程序的需求，同时消除旧应用程序的遗迹。此练习说明了所遵循的修改步骤和要求的检查。重要的步骤：经常保存工作。你想确保你的更改始终存在。\n\
  \n### 构建界面\n\n1. 复制 `Example 5-8` 项目文件夹（Authors 输入表单的最后一个版本）。将新复制的文件夹重命名为其他名称（我使用了\
