  Example 1-1\\\n```\n\n# 前言 作者：David B. Taylor，前大学教授兼系主任\n\n当今使用的大多数计算机程序都需要与存储在数据库中的信息进行交互，因此学习使用数据库进行编程可以成倍地增加开发者的市场竞争力。\n\
  \n本书的结构是一本自学指南，但也可以很容易适应课堂教学和讨论。本书的内容非常出色。它从基础开始，以小而清晰但具有功能性的渐进方式进行。它让数据库编程的教学和学习变得简单得多。\n\
  \n《Visual C# 和数据库》由两位从软件开发领域一路爬出来的专家编写，对数据库程序开发提供了完整、详尽且易于理解的解释。他们的示例反映了现实应用，将帮助新开发者快速掌握数据库软件开发。学生可以轻松地转换和扩展示例以用于他们自己的应用程序。例如，第\
  \ 4 章中的 `Books Database` 可以很容易地修改为搜索类似的汽车、自行车或密码等等数据库。示例使用微软的 Access 数据库管理系统 (`DBMS`)\
  \ 和 `SQL Server` 创建。这使得学生易于比较自己的能力和语法。\n\n我由衷地享受了阅读和研究《Visual C# 和数据库》中的示例。示例清晰且易于遵循。如果我有任何问题或我的代码无法运行，我只需看一眼作者完成的代码示例即可重回正轨。\n\
  \n在整本书中，作者强调了用户界面 (`UI`) 设计的重要性。这比初看可能没那么重要，但开发者往往倾向于关注代码而忘记 `UI`，但最终会有人使用这个程序，因此程序一个功能性且具有吸引力的呈现形式可能是最终产品成功或失败的关键。\n\
  \n本书的一个大加分是作者包含了一些额外且非常有用的类比主题，例如第 5 章中用 `HTML` 创建的在线帮助系统以及第 7 章中的图形方法。本书并不是关于 `HTML`\
  \ 或图形的，但这些偶然的包含让学生得以一窥其他重要话题。这只是两个不必包含在内的例子，但它们作为其他章节的一部分被加入了，并将最终使学生受益。这是作者深思熟虑的结果，展示了本书的真实价值。\n\
  \n作为一个程序员、长期的大学教授以及前计算机、工程和商务系主任，我评审了大多数流行编程语言的无数编程书籍。Conrod 和 Tylee 编写的《Visual\
  \ C# 和数据库》是我帮助开发者跨越到回报丰厚的数据库开发领域的最喜教材。我强烈向任何认真想要成为专业软件开发者/工程师的人推荐这本书。\n\nDavid B.\
  \ Taylor, B.S.E.T., M.A.Ed., Ed.S.\n前教授兼系主任\n计算机、工程与商务系\nSeminole State College\n\
  佛罗里达州，桑福德\n\n# 1 介绍 Visual C# 和数据库\n\n## 预告\n\n在第一章中，我们将快速概述课程包含的内容。我们将讨论完成课程所需的条件。\n\
  \n我们将简要查看什么是数据库、它们在哪里使用，以及如何将 Visual C# 用于数据库。而且，我们将回顾 Visual C# 开发环境以及构建应用程序的步骤。\n\
  \n## 课程目标\n\n- 理解使用微软 Visual C# 构建“前端”界面的优势\n- 学习数据库结构、术语和正确的数据库设计\n- 学习使用 Visual\
  \ C# 数据对象连接数据库\n- 学习 Visual C# 数据绑定控件\n- 学习使用 SQL 查询数据库\n- 理解正确的数据库搜索技术\n- 学习使用\
  \ ADOX 创建数据库\n- 学习数据库管理技术\n- 学习创建和制作数据库报告\n- 学习发布 Visual C# 数据库应用程序\n- 理解连接到不同类型的数据库和远程数据库\n\
  - 介绍其他数据库概念\n\n\n\n\n\n本课程并不教你如何构建一个 Visual C# 应用程序。假设读者对 Visual C# 开发环境有基础了解，并知道构建\
  \ Visual C# 应用程序涉及的步骤。在完成第一章末的示例应用程序构建后，你应该对此感到相当自如。如果不是，我们公司 Kidware Software 提供了多项教程来教授这些信息。请访问我们的官方网站：\n\
  \nhttp://www.kidwaresoftware.com\n\n# 什么是数据库？\n\n数据库是信息的集合。这些信息以一种非常结构化的方式存储。通过利用这种已知的结构，我们可以快速、准确地访问和修改这些信息。\n\
  \n在信息时代，数据库无处不在：\n\n> ⇒ 当你去图书馆并在电脑上查阅书籍时，你正在访问图书馆的图书数据库。\n> ⇒ 当你在线上购买某些产品时，你正在访问网络商户的产品数据库。\n\
  > ⇒ 你亲爱的银行在他们的数据库中保留了你所有的财务记录。当你收到每月对账单时，银行会生成一份数据库报告。\n> ⇒ 当你打电话预约医生号时，接待台人员会在他们的数据库中查询可用时间段。\n\
  > ⇒ 当你去汽车经销商处进行维修时，技术人员会在维修厂数据库中调出你的过往记录。\n> ⇒ 在杂商店，当收银员扫描每个产品时，价格会在商店的数据库中找到，那里同时也进行库存控制。\n\
  > ⇒ 当你在电视上看棒球赛时，解说员告诉你“击球手对左投投手的击率为 .328，这些投手的母亲出生在肯塔基州的一个周二上午”，这条无用信息是从球队数据库中提取的。\n\
  \n你一定能想到更多数据库进入你生活的场景。核心理念是它们无处不在。而且，每个数据库都需要某种方式让用户与其中的信息进行交互。这种交互是由数据库管理系统（DBMS）完成的。\n\
  \nDBMS 的任务其实非常简单。在概念上，你对数据库可以的操作只有几件事：\n\n1. 查看数据\n2. 查找感兴趣的数据\n3. 修改数据\n4. 添加数据\n\
  5. 删除数据\n\n有很多商业数据库管理系统可以执行这些任务。诸如 `Access`（微软产品）和 `Oracle` 等程序在全球范围内使用。在本课程中，我们将学习如何使用\
  \ `Visual C#` 作为 DBMS。\n\n你可能会将 Visual C# 作为 DBMS 使用的示例：\n\n* 实现一个需要管理数据库的新应用程序\n\
  * 连接到现有的数据库\n* 通过服务器或互联网与数据库交互\n\n在 DBMS 中，数据库可能在你的（或用户的）计算机上本地可用，也可能在多个用户共享的局域网（LAN）上可用，或者仅通过互联网在\
  \ Web 服务器上可用。在本课程中，我们大部分时间都在查看本地数据库，但也会涉及远程数据库的访问。\n\n我们将在下一章更深入地研究数据库。你会发现数据库有自己的词汇表。现在，让我们来看看\
  \ `Visual C#` 是如何融入数据库管理系统中的。\n\n# Visual C# 处于什么位置？\n\n对于数据库管理，我们说我们的 `Visual C#`\
  \ 应用程序充了数据库的前端。这意味着 `Visual C#` 应用程序提供了用户与数据库之间的接口。该接口允许用户告诉数据库他们需要什么，并允许数据库响应请求，以某种方式显示所请求的信息。\n\
  \n`Visual C#` 应用程序无法直接与数据库交互。在应用程序和数据库之间有一组中间组件，被称为 `ADO (ActiveX Data Object) .NET`\
  \ 数据对象：\n\n![Image](img/00154.jpeg)\n\n数据对象是 `Visual C#` 组件，允许连接到数据库、从数据库创建数据集以及管理数据库内容。这些对象是应用程序与数据库之间的通路，在两者之间往返信息。\n\
  \n如前面提到的，有很多商业产品（`Access`、`SQL Server`、`Oracle`）可以执行数据库管理任务。你可能会问，既然有了这些商业产品，为什么还要用\
  \ `Visual C#` 作为数据库管理系统（DBMS）呢？使用 `Visual C#` 作为 DBMS 而不是 `Access` 有两个主要优势：\n\n\
  1. 用户不需要在计算机上安装任何商业产品，也不需要知道如何使用此类产品。这节省用户的费用。\n2. 通过构建自定义前端，你限制了用户对数据库内信息的操作范围。在正常操作下，商业\
  \ DBMS 不提供此类限制。\n\n因此，在本课程中，我们将学习如何构建作为数据库前端的 `Visual C#` 应用程序。研究表明，超过一半的 `Visual\
  \ C#` 应用程序涉及与数据库的工作。我们将学习如何让我们的应用程序成为完整的数据库管理系统，能够查看、搜索、修改、添加和/或删除数据库信息。\n\n在继续之前，让我们回顾一下构建\
  \ `Visual C#` 应用程序的步骤，然后构建一个简单的应用程序进行练习。\n\n# 构建 Visual C# 应用程序\n\n在本章的剩余部分中，我们将提供\
  \ Visual C# 应用程序的概述，以及如何使用 Visual C# 开发环境来开发应用程序。这应该让你对继续学习本课程所需的知识有一个初步了解，并介绍作者用于描述\
  \ Visual C# 应用程序的术语。\n\n## Visual C# 应用程序的结构\n\n项目\n\n![Image](img/0168.jpeg)\n\n\
  应用程序由以下部分组成：\n\n* **表单 (Forms)**：你为用户界面创建的窗口\n* **控件 (Controls)**：绘制在表单上的用于交互的图形特征（文本框、标签、滚动条、按钮等）。表单是对象\n\
  * **属性 (Properties)**：表单或控件的每个特征都由属性指定。示例属性包括名称、标题、大小、位置和内容。`Visual C#` 应用默认属性。你可以在设计应用程序时甚至运行时更改属性。\n\
  * **方法 (Methods)**：可以调用以对特定控件执行动作的内置方法\n* **事件方法 (Event Methods)**：与对象或控件相关的代码。这是在发生事件时执行的代码。在我们的应用程序中，这些代码将用\
  \ C# 语言编写\n* **通用方法 (General Methods)**：与对象无关的代码。这些代码必须在应用程序中调用或调用\n\n## 开发应用程序的步骤\n\
  \n构建 Visual C# 应用程序涉及三个主要步骤：\n\n1. 绘制用户界面\n2. 为控件分配属性\n3. 为事件方法编写代码。开发任何需要的通用方法。\n\
  \n我们将查看每一个步骤。\n\n### 绘制用户界面和设置属性\n\n`Visual C#` 以三种模式运行：\n\n* **设计模式 (Design mode)**：用于构建应用程序\n\
  * **运行模式 (Running mode)**：用于运行应用程序\n* **调试模式 (Debugging mode)**：应用程序暂停并可以使用调试器\n\
  \n我们在这里重点关注设计模式。\n\n启动 `Visual C#` 时应该会出现几个窗口。如果其中任何窗口没有出现，可以通过主窗口菜单的 View 项访问。\n\
  \n\n\n\n⇒ 主窗口由标题栏、菜单栏和工具栏组成。标题栏显示项目名称。菜单栏包含下拉菜单，通过这些你可以控制 Visual C# 环境的操作。工具栏包含按钮，提供了某些菜单选项的快捷键（工具提示显示其功能）。\n\
  \n![Image](img/00468.jpeg)\n\n⇒ 表单窗口是开发 Visual C# 应用程序的核心。这是你绘制应用程序的地方。\n\n![Image](img/00266.jpeg)\n\
  \n⇒ 工具箱是应用程序中使用的控件（对象）的选择菜单。\n\n![Image](img/00268.jpeg)\n\n## 属性窗口\n\n属性窗口有两个用途。它的主要用途是为对象（控件）建立设计模式下的（初始）属性值。它也可以用于为控件建立事件方法。在这里，我们只查看如何操作属性。要执行此操作，请点击任务栏中的\
  \ `Properties` 按钮：\n\n![Image](img/00455.jpeg)\n\n窗口顶部的下拉框列出了当前表单中的所有对象。该框下方是活动（当前选定）对象的可用属性。提供两种属性视图：字母顺序和分类（通过下拉框下方的菜单栏进行选择）。通过突出感兴趣的属性并按下\
  \ `<F1>` 可以获取有关任何属性的帮助。\n\n⇒ 解决方案管理器窗口显示组成应用程序的所有表单和其他文件的列表\n\n![Image](img/00281.jpeg)\n\
  \n如前所述，用户界面是在表单窗口中“绘制”的。在表单上放置控件有四种方法：\n\n1. 点击工具箱中的工具并按住鼠标左键。将选中的工具拖动到表单上。当光标指针位于所需的左上角时，释放鼠标左键，将出现默认大小的控件。这是经典的“拖放”操作。\n\
  2. 双击工具箱中的工具，该控件将以默认大小创建在表单上。然后你可以移动它或调整其大小。\n3. 点击工具箱中的工具，然后将鼠标指针移动到表单窗口。光标变为十字准星。将十字准星放置在你想要放置控件的位置的左上角，并点击鼠标左键。控件将出现在点击点。\n\
  4. 点击工具箱中的工具，然后将鼠标指针移动到表单窗口。光标变为十字准星。将十字准星放置在你想要放置控件的位置的左上角，按下鼠标左键不松开并将光标拖向右下角。将绘制矩形。当你释放鼠标左键时，控件将绘制在矩形中。\n\
  \n要移动已绘制控件，点击表单中的对象（将出现一个带有箭头的十字）。现在，将控件拖到新位置。释放鼠标左键。\n\n要调整控件大小，点击该控件使其被选中（活动状态）并出现调整句柄。使用这些句柄来调整对象的大小。\n\
  \n![Image](img/00305.jpeg)\n\n要删除控件，选择该控件使其处于活动状态（将出现调整句柄）。然后按下键盘上的 `<Delete>` 键。或者，右键点击控件。将出现一个菜单。选择\
  \ `Delete` 选项。在删除控件后，你可以通过 `Edit` 菜单下的 `Undo` 选项立即撤回主意。\n\n## 在设计时设置控件属性\n\n在启动新项目时，每个表单和控件都有分配的属性。显示对象属性有两种方法。第一种方法是点击表单窗口中的对象（表单或控件）。该控件上将出现调整句柄。当控件有调整句柄时，我们称之为活动控件。现在，点击\
  \ `Properties` 窗口或工具栏中的 `Properties` 按钮。第二种方法是先点击 `Properties` 窗口。然后从 `Properties`\
  \ 窗口顶部的下拉框中选择对象。这样做，选中的对象（控件）现在变为活动状态（具有调整句柄）。显示的是 `Form` 对象的 `Properties` 窗口（确保工具栏中选择了\
  \ `Properties` 按钮而不是 `Events` 按钮）：\n\n![Image](img/00279.jpeg)\n\n`Properties` 窗口顶部的下拉框是\
  \ `Object` 。它显示应用程序中每个对象的名称及其类型。此显示显示 `Form` 对象。`Properties` 列表位于此框正。在此列表中，你可以滚动查看选中对象的属性列表。通过点击属性来选择属性。可以通过输入新值或从预定义设置列表（以下拉列表形式提供）中选择来更改属性。属性有两种查看方式：字母顺序和分类（使用\
  \ `Object` 下方的菜单栏选择）。`Properties` 窗口底部是所选属性的简短描述（一种动态帮助系统）。\n\n对于每个控件，一个非常重要的属性是其\
  \ `Name`。Visual C# 使用该名称在代码中引用特定对象或控件。为 Visual C# 控件命名已建立了一种约定。该约定是使用三个字母（小写）前缀（标识控件类型），后跟你分配的名称。一些前缀如下（随着笔记的进行我们将看到更多）：\n\
  \n| 控件 | 前缀 | 示例 |\n| :--- | :--- | :--- |\n| Form | frm | `frmWatch` |\n| Button\
  \ | btn | `btnExit`, `btnStart` |\n| Label | lbl | `lblStart`, `lblEnd` |\n| Text\
  \ Box | txt | `txtTime`, `txtName` |\n| Menu | mnu | `mnuExit`, `mnuSave` |\n| Check\
  \ box | chk | `chkChoice` |\n\n建议使用大小写字母以提高可读性。但请注意 Visual C# 是一种大小写敏感语言，这意味着 `frmWatch`\
  \ 和 `FRMWATCH` 是不同的。控件（对象）名称可以长达 40 个字符，必须以字母开头，只能包含字母、数字和下划线 `_`。名称用于建立方法名。\n\n\
  ## 在运行时设置属性\n\n除了在设计时设置属性外，你可以在运行时设置或修改属性。要执行此操作，你必须编写代码。代码格式为：\n\n`objectName.PropertyName\
  \ = NewValue;`\n\n这种格式被称为点表示。例如，要更改名为 `btnStart` 的按钮的 `BackColor` 属性，我们会输入：\n\n\
  ```\nbtnStart.BackColor = Color.Blue;\n```\n\n良好的命名约定有助于理解发生的情况。名为 `btnStart` 的按钮现在将变为蓝色。\n\
  \n## 编写代码\n\n构建 Visual C# 应用程序的最后一步是用 C# 语言编写代码。这是任何 Visual C# 应用程序中最耗时的任务，也是最有趣且最有成就感的任务。随着控件添加到表单中，Visual\
  \ C# 会自动构建所有事件方法的框架。我们只需要在希望应用程序响应的事件方法中添加代码。如果需要，我们还可以编写通用方法。\n\n\n\n\n代码放置在代码窗口中。建立控件事件方法有两种方法：一种直接从表单建立，另一种是使用属性窗口。让我们来看这两种方法。每个控件都有一个默认事件方法，这是控件最常使用的方法。例如，按钮控件的默认事件方法是\
  \ `Click` 事件，因为我们通常对按钮执行的操作就是点击。要访问控件的默认事件方法，你只需双击表单上的控件即可。\n\n虽然双击控件来建立控件事件方法简单又快速，但如果你对默认事件不感兴趣，这种方法将不再适用。在这种情况下，你需要使用属性窗口。回想我们提到过，属性窗口不仅用于建立属性，还用于事件方法。要使用属性窗口建立事件方法，点击属性窗口工具栏上的\
  \ `Events` 按钮（显示为闪电图标）：\n\n![Image](img/00312.jpeg)\n\n活动控件将将列出来（默认事件将突出显示）：\n\n\
  ![Image](img/00263.jpeg)\n\n要建立事件方法，向下滚动列出的事件并双击感兴趣的那个。选定的事件方法将出现在代码窗口中。\n\n在输入\
  \ Visual C# 代码时，有几条规则需要注意：\n\n* ➢ Visual C# 是区分大小写的，这意味着大写和小写字母被视为不同的字符。在输入代码时，确保你正确使用大小写字母。\n\
  * ➢ Visual C# 忽略任何“空白空间”，例如空格。我们经常使用空白空间来提高代码的可读性。\n* ➢ 大括号用于分组。它们标记了编程区域的开始和结束。确保你的\
  \ Visual C# 程序中左括号和右括号的数量相等。我们将匹配的一对大括号之间的代码部分称为“块”（block）。\n* ➢ 在块内对代码进行缩进是一种良好的编码习惯。这使得代码更易于理解。Visual\
  \ C# 环境会自动为你对块中的代码进行缩进。\n* ➢ 每条 Visual C# 语句都会以分号结束。语句是生成某些结果的程序表达式。请注意，并非所有的 Visual\
  \ C# 表达式都是语句（例如，定义表单构造函数的行末尾没有分号）。\n\n## 变量复习\n\nVisual C# 使用变量来存储应用程序所需的信息。命名变量时遵循的规则如下：\n\
  \n* ⇒ 长度不超过 40 个字符\n* ⇒ 它们可以包含字母、数字和下划线 (`_`)\n* ⇒ 首字符必须是字母，根据惯例，通常是小写\n* ⇒ 你不能使用保留字（Visual\
  \ C# 需要的单词）\n\n## Visual C# 数据类型\n\n* ⇒ `bool`（真或假）\n* ⇒ `int`, `long`（整数）\n* ⇒\
  \ `short`, `float`, `double`（浮点数）\n* ⇒ `DateTime`\n* ⇒ `string`（用于许多控件属性）\n* ⇒ `char`（单字符字符串变量）\n\
  * ⇒ `Object`（是的，对象也可以是变量！）\n\n## 变量声明\n\n一旦确定了变量名和变量类型，我们就必须告诉 Visual C# 应用程序该名称和类型是什么。我们说，必须显式地声明变量。\n\
  \n显式类型变量有许多优点。首先，我们确保了所有计算都能正确完成，拼写错误的变量名很容易被发现，而且 Visual C# 会确保变量名称的一致性。由于这些优点，由于这也是良好的编程习惯，我们将始终显式地类型变量。\n\
  \n要显式类型变量，你必须首先确定其作用域（scope）。作用域确定了我们希望变量值的传播范围有多大。我们将使用三个层级的作用域：\n\n* ➢ 块级（Block\
  \ level）\n* ➢ 方法级（Method level）\n* ➢ 表单级（Form level）\n\n块级变量仅在单个代码块可用（将在第 2 类中详细讨论）。\n\
  \n方法级变量的值仅在方法内部可用。此类变量在方法内部声明，使用变量类型作为声明符：\n\n```cs\nint myInt;\ndouble myDouble;\n\
  string myString, yourString;\n```\n\n这些声明通常放在方法起始左大括号之后。\n\n表单级变量保留其值，并供该表单内的所有方法使用。表单级变量声明在代码窗口中，位于\
  \ Visual C# 自动生成的表单构造函数之后，位于任何其他方法之外：\n\n![Image](img/00102.jpeg)\n\n表单级变量的声明与方法级变量一样：\n\
  \n```cs\nint myInt;\nDateTime myDate;\n```\n\n## 示例 1-1\n\n### 列表应用程序\n\n在本示例中，我们将构建一个可以作为数据库接口的\
  \ Visual C# 应用程序。程序允许输入信息（姓名和地址）以建立邮件列表。增加的一个功能是计时器，用于跟踪输入地址花费的时间。在每次输入后，我们不将信息写入数据库（正如我们通常做的那样），而是输入的信息显示在\
  \ Visual C# 消息框中。我们展示这个示例是为了说明构建应用程序的步骤。如果你觉得构建此应用程序并理解相应的代码，你可能已经具备了继续本课程所需的 Visual\
  \ C# 技能。\n\n1. 开始一个新项目。在表单上放置两个分组框（group boxes），一个用于输入地址信息，另一个用于计时功能。在第一个分组框中，放置五个标签（labels）、五个文本框（text\
  \ boxes）和两个按钮（buttons）。在第二个分组框中，放置一个文本框三个按钮。添加一个计时器控件。调整控件的大小和位置，使你的表单看起来如下\n\n\
  ![Image](img/00296.jpeg)\n\n2. 为表单和控件设置属性（这些只是建议——你可以根据喜好更改）：\n\n| 控件 | 属性 | 值 |\n\
  | :--- | :--- | :--- |\n| Form | Name | `frmMailing` |\n| | BorderStyle | `Fixed`\
  \ |\n| | Text | `Mailing List` |\n| GroupBox1 | Name | `grpMail` |\n| | Text | `Address\
  \ Information` |\n| Label1 | Text | `Name` |\n| Label2 | Text | `Address` |\n| Label3\
  \ | Text | `City` |\n| Label4 | Text | `State` |\n| Label5 | Text | `Zip` |\n| TextBox1\
  \ | Name | `txtName` |\n| | TabIndex | `0` |\n| TextBox2 | Name | `txtAddress` |\n\
  | | TabIndex | `1` |\n| TextBox3 | Name | `txtCity` |\n| | TabIndex | `2` |\n| TextBox4\
  \ | Name | `txtState` |\n| | TabIndex | `3` |\n| TextBox5 | Name | `txtZip` |\n\
  | | TabIndex | `4` |\n| Button1 | Name | `btnAccept` |\n| | Text | `Accept` |\n\
  | | TabIndex | `5` |\n| Button2 | Name | `btnClear` |\n| | Text | `Clear` |\n| GroupBox2\
  \ | Name | `grpTime` |\n| | Text | `Elapsed Time` |\n| TextBox6 | Name | `txtElapsedTime`\
  \ |\n| | Font | `Bold, 14` |\n| | TabStop | `False` |\n| | Text | `00:00:00` |\n\
  | | TextAlign | `Center` |\n| Button3 | Name | `btnStart` |\n| | Text | `Start`\
  \ |\n| Button4 | Name | `btnPause` |\n| | Text | `Pause` |\n| | Enabled | `False`\
  \ |\n| Button5 | Name | `btnExit` |\n| | Text | `Exit` |\n| Timer1 | Name | `timSeconds`\
  \ |\n| | Enabled | `False` |\n| | Interval | `1000` |\n\n完成后，表单应该像这样：\n\n![Image](img/00062.jpeg)\n\
  \n3. 表单级变量声明：\n\n```cs\nDateTime lastNow;\nTimeSpan elapsedTime;\n```\n\n4. 将此代码放入\
  \ `btnStart_Click` 事件方法中：\n\n```cs\nprivate void btnStart_Click(object sender, EventArgs\
  \ e)\n{\n    // 开始按钮被点击\n    // 禁用开始和退出按钮\n    // 启用暂停按钮\n    btnStart.Enabled =\
  \ false;\n    btnExit.Enabled = false;\n    btnPause.Enabled = true;\n\n    // 建立起始时间并启动计时器控件\n\
  \    lastNow = DateTime.Now;\n    timSeconds.Enabled = true;\n\n    // 启用邮件列表\n\
  \    grpMail.Enabled = true;\n\n    txtName.Focus();\n}\n```\n\n\n\n\n\n### 5. 将此代码放入\
  \ `btnPause_Click` 事件方法中：\n\n```csharp\nprivate void btnPause_Click(object sender,\
  \ EventArgs e)\n{\n    // 暂停按钮被点击\n    // 禁用暂停按钮\n    // 启用开始和退出按钮\n    btnPause.Enabled\
  \ = false;\n    btnStart.Enabled = true;\n    btnExit.Enabled = true;\n    // 停止计时\n\
  \    timSeconds.Enabled = false;\n    // 禁用编辑区域\n    grpMail.Enabled = false;\n\
  }\n```\n\n### 6. 将此代码放入 `btnExit_Click` 事件方法中：\n\n```csharp\nprivate void btnExit_Click(object\
  \ sender, EventArgs e)\n{\n    this.Close();\n}\n```\n\n### 7. 将此代码放入 `timSeconds_Timer`\
  \ 事件方法中：\n\n```csharp\nprivate void timSeconds_Tick(object sender, EventArgs e)\n\
  {\n    // 计算并显示已时间\n    elapsedTime += DateTime.Now - lastNow;\n    txtElapsedTime.Text\
  \ = Convert.ToString(new\n    TimeSpan(elapsedTime.Hours, elapsedTime.Minutes,\n\
  \    elapsedTime.Seconds));\n    lastNow = DateTime.Now;\n}\n```\n\n注意上述代码中的几行非常长，导致文字处理器在页边距处换行。请将每一行输入为一个长行，而不是分成两行。请注意，在这些笔记中展示实际代码时，这种情况非常常见。\n\
  \n### 8. 将此代码放入 `txtInput_KeyPress` 事件方法中（处理所有文本框的 `KeyPress` 事件）：\n\n```csharp\n\
  private void txtInput_KeyPress(object sender,\n    KeyPressEventArgs e)\n{\n   \
  \ String boxName = ((TextBox) sender).Name;\n    // 检查回车键\n    if ((int) e.KeyChar\
  \ == 13)\n    {\n        switch (boxName)\n        {\n            case \"txtName\"\
  :\n                txtAddress.Focus();\n                break;\n            case\
  \ \"txtAddress\":\n                txtCity.Focus();\n                break;\n  \
  \          case \"txtCity\":\n                txtState.Focus();\n              \
  \  break;\n            case \"txtState\":\n                txtZip.Focus();\n   \
  \             break;\n            case \"txtZip\":\n                btnAccept.Focus();\n\
  \                break;\n        }\n    }\n    // 在邮政编码框中，确保只允许数字或退格键\n    if (boxName.Equals(\"\
  txtZip\"))\n    {\n        if ((e.KeyChar >= '0' && e.KeyChar <= '9') || (int) e.KeyChar\
  \ == 8)\n        {\n            e.Handled = false;\n        }\n        else\n  \
  \      {\n            e.Handled = true;\n        }\n    }\n}\n```\n\n### 9. 将此代码放入\
  \ `btnAccept_Click` 事件方法中：\n\n```csharp\nprivate void btnAccept_Click(object sender,\
  \ EventArgs e)\n{\n    string s;\n    // 按钮被点击 - 在消息框中显示表单标签和输出\n    // 确保每个文本框都有输入\n\
  \    if (txtName.Text.Equals(\"\") || txtAddress.Text.Equals(\"\") || txtCity.Text.Equals(\"\
  \") || txtState.Text.Equals(\"\") || txtZip.Text.Equals(\"\"))\n    {\n        MessageBox.Show(\"\
  每个框都必须有内容!\", \"错误\", MessageBoxButtons.OK, MessageBoxIcon.Information);\n     \
  \   txtName.Focus();\n        return;\n    }\n    s = txtName.Text + \"\\r\\n\"\
  \ + txtAddress.Text + \"\\r\\n\";\n    s += txtCity.Text + \", \" + txtState.Text\
  \ + \" \" + txtZip.Text;\n    MessageBox.Show(s, \"邮寄标签\", MessageBoxButtons.OK);\n\
  \    btnClear.PerformClick();\n}\n```\n\n### 10. 将此代码放入 `btnClear_Click` 事件方法中：\n\
  \n```csharp\nprivate void btnClear_Click(object sender, EventArgs e)\n{\n    txtName.Text\
  \ = \"\";\n    txtAddress.Text = \"\";\n    txtCity.Text = \"\";\n    txtState.Text\
  \ = \"\";\n    txtZip.Text = \"\";\n    txtName.Focus();\n}\n```\n\n### 11. 保存应用程序（保存于\
  \ `VCSDB\\Code\\Class 1` 文件夹下的 `Example 1-1` 中）。运行应用程序。确保其功能符合设计。这是运行中的程序。\n\n![Image](img/00307.jpeg)\n\
