  \n## Visual Basic 家庭作业\n\nVisual Basic^® Homework Projects 是一学期学期的自学编程教程，用简单、易于懂的术语解释了如何构建一个\
  \ Visual Basic Windows 项目。学生将学习项目设计、Visual Basic 工具箱、Visual Basic 语言的许多元素，以及如何调试和发布已完成的项目。构建的项目包括双模式秒表、闪闪卡数学测验、多选题考试、黑杰克纸牌游戏、体重监测器、家庭库存管理器和雪球掷游戏。\n\
  \n![Image](http://www.computerscienceforkids.com/visual-basic)\n\n## VISUAL BASIC\
  \ 与数据库\n\nVISUAL BASIC AND DATABASES 是一本教程，详细介绍了如何使用 Visual Basic 为桌面应用程序访问和维护数据库。涵盖的主题包括：数据库结构、数据库设计、Visual\
  \ Basic 项目构建、`ADO .NET` 数据对象（`connection`、`data adapter`、`command`、`data table`）、数据绑定控件、适当的界面设计、结构化查询语言\
  \ (`SQL`）、使用 Access、`SQL Server` 和 ADOX 创建数据库，以及数据库报告。实际开发的项目包括书籍跟踪系统、销售发票程序、家庭库存系统和每日天气监测器。\n\
