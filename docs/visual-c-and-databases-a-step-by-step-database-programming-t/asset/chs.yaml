  \ 将此代码放在 `frmKWSales_Load` 事件方法中：\n\n```csharp\nprivate void frmKWSales_Load(object\
  \ sender, EventArgs e)\n{\n    // 连接到销售数据库\n    KWSalesConnection = new\n    OleDbConnection(\"\
  Provider=Microsoft.ACE.OLEDB.12.0; Data\n    Source = \" + Application.StartupPath\
  \ + \"\\\\KWSalesDB.accdb\");\n    KWSalesConnection.Open();\n\n    // 建立 Orders\
  \ 命令对象\n    ordersCommand = new OleDbCommand(\"SELECT * FROM Orders\n    ORDER BY\
  \ OrderID\", KWSalesConnection);\n\n    // 建立 Orders 数据适配器/数据表\n    ordersAdapter\
  \ = new OleDbDataAdapter();\n    ordersAdapter.SelectCommand = ordersCommand;\n\
  \    ordersTable = new DataTable();\n    ordersAdapter.Fill(ordersTable);\n\n  \
  \  orderNumber = 0;\n    NewOrder();\n}\n```\n\n此代码连接到 KWSALES 数据库文件（在应用程序文件夹中），并创建查看\
  \ Orders 表所需的的数据对象。它初始化了 `orderNumber` 并开始一个新订单（`NewOrder` 方法很快就会看到）。\n\n### 4.\
  \ 将此代码放在 `frmKWSales_FormClosing` 事件方法中以清理对象：\n\n```csharp\nprivate void frmKWSales_FormClosing(object\
