  ## 编辑记录\n\n我们现在添加编辑主数据库记录的功能。\n\n1. 锁定表单上的所有文本框（`ReadOnly = true`）。同时禁用日期时间选择器和加载照片的按钮（`Enabled\
  \ = false`）。\n\n2. 给表单添加三个按钮。使用这些属性：\n\n| button1: | |\n| :--- | :--- |\n| Name\
  \ | `btnEdit` |\n| Text | `Edit` |\n| FontSize | 10 |\n| TabStop | False |\n\n|\
  \ button2: | |\n| :--- | :--- |\n| Name | `btnSave` |\n| Text | `Save` |\n| Enabled\
  \ | False |\n| TabStop | False |\n\n| button3: | |\n| :--- | :--- |\n| Name | `btnCancel`\
  \ |\n| Text | `Cancel` |\n| Enabled | False |\n| TabStop | False |\n\n3. 在表级声明中添加一个变量来跟踪系统状态：\n\
  ```cs\nstring myState;\n```\n\n4. 添加一个名为 `SetState` 的方法来建立应用程序状态：\n```cs\nprivate\
  \ void SetState(string appState)\n{\n    myState = appState;\n    switch (myState)\n\
  \    {\n        case \"View\":\n            btnFirst.Enabled = true;\n         \
  \   btnPrevious.Enabled = true;\n            btnNext.Enabled = true;\n         \
  \   btnLast.Enabled = true;\n            btnEdit.Enabled = true;\n            btnSave.Enabled\
  \ = false;\n            btnCancel.Enabled = false;\n            txtItem.ReadOnly\
  \ = true;\n            txtLocation.ReadOnly = true;\n            txtStore.ReadOnly\
  \ = true;\n            dtpDatePurchased.Enabled = false;\n            txtPurchaseCost.ReadOnly\
  \ = true;\n            txtSerialNumber.ReadOnly = true;\n            chkEngraved.Enabled\
  \ = false;\n            btnLoadPhoto.Enabled = false;\n            break;\n\n  \
  \      default: // \"Edit\"\n            btnFirst.Enabled = false;\n           \
  \ btnPrevious.Enabled = false;\n            btnNext.Enabled = false;\n         \
  \   btnLast.Enabled = false;\n            btnEdit.Enabled = false;\n           \
  \ btnSave.Enabled = true;\n            btnCancel.Enabled = true;\n            txtItem.ReadOnly\
  \ = false;\n            txtLocation.ReadOnly = false;\n            txtStore.ReadOnly\
  \ = false;\n            dtpDatePurchased.Enabled = true;\n            txtPurchaseCost.ReadOnly\
  \ = false;\n            txtSerialNumber.ReadOnly = false;\n            chkEngraved.Enabled\
  \ = true;\n            btnLoadPhoto.Enabled = true;\n            break;\n    }\n\
  \    txtItem.Focus();\n}\n```\n\n\n\n\n该方法有两种两种模式：查看（View）和编辑（Edit）。在查看模式下（表单加载时的模式），我们只能查看数据。在编辑模式下，数据可以被更改，然后保存（或取消编辑操作）。\n\
  \n5. 将此行代码放置在 `frmInventory_Load` 事件方法的末尾：\n\n```csharp\nSetState(\"View\");\n```\n\
  \n这使得表单初始处于查看模式。\n\n6. 将此代码放在 `btnEdit_Click` 事件方法中：\n\n```csharp\nprivate void\
  \ btnEdit_Click(object sender, EventArgs e)\n{\n    SetState(\"Edit\");\n}\n```\n\
  \n这使表单置于编辑模式下，并允许对数据表进行编辑。\n\n7. 将此代码放在 `btnSave_Click` 事件方法中：\n\n```csharp\nprivate\
  \ void btnSave_Click(object sender, EventArgs e)\n{\n    string savedItem = txtItem.Text;\n\
  \    int savedRow;\n    inventoryManager.EndCurrentEdit();\n    inventoryTable.DefaultView.Sort\
  \ = \"Item\";\n    savedRow = inventoryTable.DefaultView.Find(savedItem);\n    inventoryManager.Position\
  \ = savedRow;\n    SetState(\"View\");\n}\n```\n\n这段代码会保存任何更改并返回查看模式。完成后，它会将货币管理器的位置设置为保存的记录。\n\
