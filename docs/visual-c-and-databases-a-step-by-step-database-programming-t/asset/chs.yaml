  \ | 禁用 | 取消 |\n\n当点击 `New` 按钮时，用户可以输入新客户信息。这些随后可以保存到数据库中。现在的表单看起来如下：\n\n![Image](img/0342.jpeg)\n\
  \n3. 在表声明中添加两个变量：\n\n```csharp\nbool newCustomer = false;\nint savedIndex;\n```\n\
