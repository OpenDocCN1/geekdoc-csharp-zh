  \ KWSALES 数据库所需的所有表：\n\n![Image](img/00150.jpeg)\n\n## 定义关系\n\n我们有了 KWSALES 数据库的四个表，但它们是独立的实体。最后一步是定义主键和/或外键之间的关系。注意，只有当两个字段的数据类型相同时才能定义关系。\n\
  \n1. 从 Access 主菜单选择“数据库工具”（Database Tools）选项卡，然后选择“关系”（Relationships）。“显示表”（Show\
  \ Table）对话框出现：\n\n![Image](img/00235.jpeg)\n\n选择列出的表并点击“添加”（Add）。然后关闭此对话框。四个表将出现在关系窗口中（主键显示小钥匙）：\n\
  \n![Image](img/00056.jpeg)\n\n2. 要将一个键从一个表关联到另一个表，只需将该键从一个表拖到另一个表中的相应键。例如，将 `Customers`\
  \ 表中的 `CustomerID`（主键）拖到 `Orders` 表中的 `CustomerID`（外键）。你将看到：\n\n![Image](img/00141.jpeg)\n\
  \n点击“创建”（Create），链接形成：\n\n![Image](img/00484.jpeg)\n\n\n\n3. 再次创建两个链接。将 `Orders`\
  \ 表中的 `OrderID`（主键）连接到 `Purchases` 表中的 `OrderID`（外键）。然后，将 `Purchases` 表中的 `ProductID`（外键）连接到\
  \ `Products` 表中的 `ProductID`（主键）。现在 `Relationships`（关系）窗口应该会显示：\n\n![Image](img/00016.jpeg)\n\
  \n所有的键键关系都已清晰定义。关闭窗口时请务必保存这些更改。\n\n`KWSALES` 数据库的定义现在已完成。此版本的数据库保存为 `VCSDB\\Databases`\
  \ 文件夹下的 `KWSalesDB.accdb`。如果需要，此时可以向表中添加值。只需打开表并向结果网格填充值即可。例如，如果你打开 `Customers`\
  \ 表，你将看到：\n\n![Image](img/00064.jpeg)\n\n我们在此不会填充表。那将在第 10 章通过代码完成。\n\n# 使用 Server\
  \ Explorer 构建 SQL Server 数据库\n\n可以使用 Microsoft Visual Studio 构建 SQL Server 数据库。`Server\
  \ Explorer`（服务器资源管理器）工具有助于这一构建。\n\n与 Access 版本的 `KWSALES` 类似，构建 SQL Server 版本（命名为\
  \ `SQLKWSalesDB.mdf`）最好通过示例来说明。在这里，我们使用 Visual Studio 来构建我们的 `KWSALES` 数据库。你会发现\
  \ `Server Explorer` 在构建数据库时使用了不同的词汇。例如，字段被称为列（columns），且许多数据类型有不同的名称（`varchar` 用于\
  \ `Text` 字段）。这些差异应该很容易理解。\n\n## 示例 9-2：使用 Server Explorer 创建 KWSALES 数据库\n\n在本示例中，我们将使用\
  \ Microsoft Visual Studio 构建构建一个包含 4 个 表的 `KWSALES` 数据库的 SQL Server 版本（`SQLKWSalesDB.mdf`）。我们将逐个构建每个表，并添加关联的数据字段（以及任何必要的键和索引）。作为参考，表和字段结构如下：\n\
  \n![Image](img/00065.jpeg)\n\n## 开始准备\n\n1. 启动 Visual Studio。通过 `View`（视图）菜单选项并选择\
  \ `Server Explorer` 来打开它。找到此窗口：\n\n![Image](img/00031.jpeg)\n\n右键点击 `Data Connections`（数据连接）并选择\
  \ `Create New SQL Server Database`（创建新的 SQL Server 数据库）。此窗口：\n\n![Image](img/00043.jpeg)\n\
  \n输入你的 `Server name`（服务器名称，计算机名称后加反斜杠和 `SQLEXPRESS`）。为 `New database name`（新数据库名称）输入\
  \ `SQLKWSalesDB` 并点击 `OK`。\n\n2. 新数据库（我扩展了连接以显示包含的文件夹）将出现在 `Server Explorer` 窗口的\
  \ `Data Connections` 下：\n\n![Image](img/00051.jpeg)\n\n对于你想创建的每个表，右键点击 `Tables`\
  \ 文件夹并选择 `Add New Table`（添加新表）。执行此操作后，将打开一个设计窗口，允许你在表中输入字段。\n\n3. 我们现在将对 `KWSALES`\
  \ 数据库中的每个表执行此操作。\n\n### Customers 表\n\n1. 在设计视图中创建一个新表。你会看到：\n\n![Image](img/00068.jpeg)\n\
  \n4. 有一个网格用于定义每个字段（此处称为列）。你为字段提供一个 `Column Name`（列名）并定义其 `Data Type`（数据类型）。你还决定该字段是否可以为空（null）。对于每个字段，使用\
  \ `Properties Window`（属性窗口）设置字段（列）属性。一个特殊属性是 `Identity Specification`（标识规范）。它用于主键以确保值的唯一性（将\
  \ `Is Identity` 设置为 `True`）。网格右侧是定义键和索引的地方。网格下方是 `Design`（设计）窗口，在其中编写创建表的实际脚本语言。通过更改脚本面板中的第一行将\
  \ `Customers` 表命名为：\n\n```sql\nCREATE TABLE [dbo].[Customers]\n```\n\n5. `Customers`\
  \ 表的第一个字段是 `CustomerID`。输入其作为 `Column Name`，使用 `bigint` `Data Type`，并将 `Is Identity`\
  \ 属性设置为 `True`。继续使用这些选择添加其他字段（括号中表示字段的长度）：\n\n| Name | DataType |\n| :--- | :---\
  \ |\n| FirstName | varchar(40) |\n| LastName | varchar(40) |\n| Address | varchar(40)\
  \ |\n| City | varchar(40) |\n| State | varchar(20) |\n| Zip | varchar(10) |\n\n\
  确保所有字段都不允许 `Null`（空）值（我们想确保地址是完整的）。\n\n此时，设计网格应该像这样所示：\n\n![Image](img/00077.jpeg)\n\
  \n现在，我们定义主键和任何索引以允许快速搜索。`CustomerID` 是主字段。如果该字段旁边没有出现小键，我们需要在在那里放一个。右键点击 `CustomerID`\
  \ 行并选择 `Set Primary Key`（设置主键）。现在该条目旁边出现了一个小键，表示它是主键。\n\n我们希望 `LastName` 成为一个索引。寻找此面板：\n\
  \n![Image](img/00094.jpeg)\n\n右键点击 `Indexes` 并选择 `Add New`（新建），然后选择 `Index`。你会看到添加了一个索引（`IX_Customers_Column`）\n\
  \n![Image](img/00076.jpeg)\n\n高亮显示的索引并进入 `Properties Window`。选择 `Columns`（列）属性。点击\
  \ `Columns` 属性旁的省略号：\n\n![Image](img/00084.jpeg)\n\n选择 `LastName` 升序：\n\n![Image](img/00087.jpeg)\n\
  \n现在 `CustomerID`主键允许任何键。\n\n`Customers` 表的定义现在完成：\n\n![Image](img/00091.jpeg)\n\
  \n`Customers` 表的设计网格：\n\n![Image](img/00091.jpeg)\n\n6. ` ` ` ` 保存这些更改。 `Server\
  \ Explorer` 刷新。你会看到已添加的表：\n\n![Image](img/00039.jpeg)\n\n### Orders 表\n\n1. 在设计视图中创建一个新表。按照\
  \ ` ` `` ` ` ` ` ` ` ` ` `以下字段：\n\n![Image](img/00012.jpeg)\n\n| Name | DataType\
  \ |\n| :--- | :--- |\n| OrderID | varchar(10) |\n| CustomerID | bigint |\n| OrderDate\
  \ | datetime |\n\n2. 将 `OrderID` 设置为主键。确保这些字段都不允许空值。\n\n![Image](img/00013.jpeg)\n\
  \n3. ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` ` `\
  \ ` ` ` ` ` ` ` 的设计网格：\n\n![Image](img/00016.jpeg)\n\n### Purchases 表\n\n1. 在设计视图中创建一个新表。添加以下字段：\n\
  \n| Name | DataType |\n| :--- | :--- |\n| OrderID | varchar(10) |\n| ProductID |\
  \ varchar(10) |\n| Quantity | int |\n\n2. 将 `ProductID` 和 `Quantity` 的 `Allow Nulls`\
  \ 设置为 `Yes`。添加两个索引，一个用于 `OrderID`，一个用于 `ProductID`。\n\n![Image](img/00019.jpeg)\n\
  \n### Products 表\n\n1. 在设计视图中创建最后一个表。添加以下字段：\n\n| Name | DataType |\n| :--- | :---\
  \ |\n| ProductID | varchar(10) |\n| Description | varchar(40) |\n| Price | money\
  \ |\n| NumberSold | int |\n\n2. 将 `ProductID` 设置为主键。不要让任何字段接受空值。\n\n![Image](img/00022.jpeg)\n\
  \n\n\n\n我们在 `KWSALES` 数据库中有有四张表，但它们是独立的实体。最后一步是定义主键和/或外键之间的关系。请注意，只有当两个字段的数据类型相同时，才能在它们之间定义关系。\n\
  \n以下是我们要定义的关系的图形化描述：\n\n![Image](img/00440.jpeg)\n\n要定义这些关系，我们需要修改表设计器中的脚本代码。\n\n\
  1. 要将一个表的外键与另一个表的主键相关联，请右键点击持有外键的表并选择`打开表定义`（Open Table Definition）。例如，我们想将 `Orders`\
  \ 表中的 `CustomerID` 字段（外键）与 `Customers` 表中的 `CustomerID`（主键）关联。执行此操作，在服务器资源管理器（Server\
  \ Explorer）中右键点击 `Orders` 表并选择`打开表定义`。在设计窗的右侧，右键点击`外键`（Foreign Keys）然后选择`新建外键`（Add\
  \ New Foreign Key）。将形成一个默认键——你会看到：\n\n![Image](img/00441.jpeg)\n\n点击表定义下的脚本窗格（`Design`\
  \ 标签），将外键引用的默认定义替换为以下：\n\n```\nCONSTRAINT [FK_Orders_CustomerID] FOREIGN KEY ([CustomerID])\
  \ REFERENCES [dbo].[Customers] ([CustomerID])\n```\n\n这表示我们有一个名为 `FK_Orders_CustomerID`\
  \ 的约束（关系），它将 `Orders` 表中的 `CustomerID` 字段与 `Customers` 表中的 `CustomerID` 字段相关联。\n\
  \n`Orders` 完成后的脚本窗格显示如下：\n\n![Image](img/00449.jpeg)\n\n我们还需要在 `Purchases` 表中使用外键建立另外两个关系。我们遵循相同的步骤。\n\
  \n2. 我们想将 `Purchases` 表中的 `OrderID` 字段（外键）与 `Orders` 表中的 `OrderID`（主键）关联。执行此操作，在服务器资源管理器中右键点击\
  \ `Purchases` 表并选择`打开表定义`。在设计窗的右侧，右键点击`外键`然后选择`新建外键`。将形成一个默认键。\n\n点击表定义下的脚本窗格（`Design`\
  \ 标签），将外键引用的默认定义替换为以下：\n\n```\nCONSTRAINT [FK_Purchases_OrderID] FOREIGN KEY ([OrderID])\n\
  REFERENCES [dbo].[Orders] ([OrderID]),\n```\n\n3. 最后，我们想将 `Purchases` 表中的 `ProductID`\
  \ 字段（外键）与 `Products` 表中的 `ProductID`（主键）关联。此时应显示 `Purchases` 表。在设计窗的右侧，右键点击`外键`然后选择`新建外键`。将形成一个默认键。\n\
  \n点击表定义下的脚本窗格（`Design` 标签），将外键引用的默认定义替换为以下：\n\n```\nCONSTRAINT [FK_Purchases_ProductID]\
  \ FOREIGN KEY ([ProductID])\nREFERENCES [dbo].[Products] ([ProductID]),\n```\n\n\
  `Purchases` 完成后的脚本窗格显示如下：\n\n![Image](img/00035.jpeg)\n\n所有的键关系都已清晰定义。点击`更新`（Update），然后选择`更新数据库`（Update\
  \ Database）。\n\n`KWSALES` 数据库的定义现在已完成。此 SQL Server 版本的数据库保存为 `VCSDB\\Databases`\
  \ 文件夹下的 `SQLKWSalesDB.mdf`。如果需要，可以使用服务器资源管理器填充数据库。执行此操作，右键点击表并选择`显示表数据`（Show Table\
  \ Data）。将打开一个窗口，允许你向网格中添加值。例如，如果你选择 `Customers` 表，你将看到：\n\n![Image](img/00335.jpeg)\n\
  \n我们不会在这里填充这些表。那将在第 10 章通过代码完成。\n\n你可能想知道 SQL Server 将此数据库存储在计算机的哪个位置。如果你使用了默认设置，它将位于类似下面的文件夹：\n\
  \n```\nC:\\Program Files\\Microsoft SQL Server\\MSSQL12.SQLEXPRESS\\MSSQL\\Data\n\
  ```\n\n# 使用 Visual C# 构建 Access 数据库\n\n如果你没有 Access 或不想使用 Access 创建数据库，请不要绝望。可以使用\
  \ Visual C# 编程创建并填充 Access 类型的数据库。要实现此操作，我们使用一种称为 ADO 扩展（`ADOX`）的库。`ADOX` 与 ADO\
  \ .NET 技术的前身有关，但它对于眼下的任务非常有用。\n\n实际上，有些时候你需要或想要使用 Visual C# 来创建数据库。例如，在一个应用程序中，用户选择想要在特定表中包含的字段。在这种情况下，数据库表结构在运行时是未知的，因此需要使用\
  \ Visual C# 来构建数据库。或者你的应用程序需要一个空白数据库作为启动。在这种情况下，如果用户想要开始一个新文件，我们需要将保存的数据库文件复制到新文件中。当我们为此类应用程序构建分发包时，需要记住包含该空文件，否则会导致问题。与其信任我们的记忆，不如直接在\
  \ Visual C# 中使用 `ADOX` 构建空文件。\n\n遵循的步骤与使用 Access 时遵循的步骤几乎相同：\n\n- 创建数据库\n- 创建表\n\
  -向表中添加字段\n- 为表定义主键\n-为表定义索引\n- 一旦创建了所有表，定义表与表之间的关系\n\n构建 `KWSALES` 数据库的示例过程中，将讨论上述每一个步骤。我们在使用\
  \ Visual C# 构建 `KWSALES` 数据库时将讨论这些。如果你没有 Access，互联网上有许多免费产品可以查看 Access 类型文件。\n\n\
  ## 示例 9-3：使用 Visual C# 构建 KWSALES\n\n在本例中，我们将通过所有步骤来构建 Access 类型的数据库。参考结构如下：\n\n\
  ![Image](img/00411.jpeg)\n\n### 为 ADOX 库添加引用\n\n1. 在 Visual C# 中启动一个项目。此项目将有一个按钮（`Name`\
  \ 属性为 `Create`，`Text` 属性为 `Create Database`）。我们将在 `Create_Click` 事件方法中编写代码。我的表单如下：\n\
  \n![Image](img/00158.jpeg)\n\n2. 为了使用 `ADOX`，我们必须添加引用。转到新项目的解决方案资源管理器。右键点击项目名称并选择`添加引用`。\n\
