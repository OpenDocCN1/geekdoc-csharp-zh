  \n## 添加新客户\n\n如果下单客户是新的且数据库中没有信息怎么办？我们需要修改项目以处理这种情况。编码有点复杂。记住自动编号字段（如 `CustomerID`\
  \ 字段）在 ADO.NET 写入数据库之前是不生成的。因此，当我们添加新客户到我们的数据库时，需要关闭然后重新打开以检索 `CustomerID` 值。详情请参见\
  \ `btnSave_Click` 方法。\n\n1. 在 KWSales 表单区域的组合框右侧添加三个按钮：\n\n![Image](img/0157.jpeg)\n\
