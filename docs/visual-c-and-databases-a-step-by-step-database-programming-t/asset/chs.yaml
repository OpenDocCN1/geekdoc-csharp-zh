  Are you sure you want to delete this record?\", \"Delete\", MessageBoxButtons.YesNo,\
  \ MessageBoxIcon.Question, MessageBoxDefaultButton.Button2);\n    if (response ==\
  \ DialogResult.No)\n    {\n        return;\n    }\n    try\n    {\n    }\n    catch\
  \ (Exception ex)\n    {\n        MessageBox.Show(\"Error deleting record.\", \"\
  Error\", MessageBoxButtons.OK, MessageBoxIcon.Error);\n    }\n}\n```\n\n4. 保存应用程序（保存在\
  \ VCSDB\\Code\\Class 5 文件夹）。在连接字符串中，将数据库名称更改为 `BooksDB1.accdb`。运行应用程序。错误捕获将显示找不到数据库的提示：\n\
  \n![Image](img/0174.jpeg)\n\n如果没有错误捕获，用户将不知道是什么导致了程序的停止。将数据库名称改回正确的值（`BooksDB.accdb`）。\n\
  \n### 使用 SQL 数据库\n\n使用 SQL Server 版本的项目，对 `frmAuthors_Load`、`btnAddNew_Click`、`btnSave_Click`\
  \ 和 `btnDelete_Click` 进行相同的更改。\n\n### 在线帮助系统\n\n到目前，我们只简要地查看了 Visual C# 的结构化运行时错误处理能力。在不知道应用程序用途的情况下，很难变得更具体。你需要知道你正在寻找什么类型的错误，以及在遇到这些错误时应该采取什么纠正措施。在你构建和运行自己的应用程序时，你会遇到运行时错误。这些错误可能是由于你的代码中的错误导致的。如果是，请修复它们。但它们也可能是由于用户的某些无效输入引起的错误，因为文件不符合某些规范或磁盘驱动器未就绪。你需要使用错误处理来防止此类错误关闭你的应用程序，导致用户处于挫败状态。\n\
  \n在线帮助系统\n\n到此，我们已经了如何构建强大、直观的界面，确保输入有效并处理任何可能发生的运行时错误。尽管尽了这些努力，有时仍会有用户对下一步该做什么感到困惑。直觉告诉用户按下\
  \ `F1` 键。很久以前，在旧的 DOS 世界，有人决定这就是神奇的“帮助我！”键。用户在按下 `F1` 时期待获得帮助（我确定你在使用 Visual C#\
  \ 时经常依赖它）。如果按下 `F1` 后没有任何反应，用户就会产生挫败感——这不是好事。所有并非为了个人而编写的应用程序都应该包含某种形式的在线帮助系统。在本节中，我们将展示如何为你的数据库应用程序构建一个非常简单的在线帮助系统。该系统将包含一个供用户选择的帮助主题列表。\n\
  \n\n\n\n\n我们正在创建一个所谓的 HTML 帮助系统。HTML 代表超文本标记语言（hypertext markup language），它是生成网页的优选“编程”语言。这种语言将用于生成和显示帮助系统中显示的主题。幸运的是，我们不需要学习大量的\
  \ HTML（如果需要的话的话）。构建一个 HTML 帮助系统涉及几个文件和几个步骤。以图表形式表示，如下：\n\n![Image](img/00169.jpeg)\n\
  \n我们需要为帮助系统中的每个主题创建主题文件（`.HTM` 文件）（我们也可以添加图形）。这些主题由目录文件（`.HHC`）和索引文件（`.HHK`）组织。项目文件（`.HHP`）指定了帮助项目的组件。所有这些文件都会被“编译”以生成最终的帮助文件（`.CHM`）。该文件就是用户可以打开以查看完成的帮助系统的文件。\n\
  \n开发的帮助系统与所有 Windows 应用程序使用的帮助系统类似。例如，这里有一个帮助系统（`.CHM` 文件），它解释了如何从你的计算机中添加或删除程序：\n\
  \n![Image](img/00178.jpeg)\n\n左侧框架是可点击主题的层级结构（目录）。右侧框架显示当前选中的主题信息。左侧框架中的其他标签允许用户浏览索引（此处未显示）并搜索帮助文件。该文件还具有若干导航功能和打印选项。这里的关键点是，这个帮助系统对你的用户来说是。使用在线帮助不需要任何新说明。\n\
  \n我们将构建一个与上面显示的类似的 HTML 帮助系统，但功能极简。学习如何构建一个功能全帮助系统本身就是一门课程。在本章中，我们将学习如何创建纯文本主题、添加目录文件、创建项目文件，并查看如何将整个包编译成实用的（即使是简单的）帮助系统。\n\
  \n## 创建帮助文件\n\n如果我们知道各种文件所需的结构，我们只使用文本编辑器就可以创建帮助系统。但我们不会采用那种方法。在线帮助系统将使用 Microsoft\
  \ HTML Help Workshop 构建。这是微软的一款免费产品，极大地简化了帮助系统的构建。该工作箱允许你构建和组织构建帮助系统所需的所有文件。一旦构建完成，只需点击即可编译和查看帮助系统。\n\
  \n所以，显然，你需要在计算机上安装该工作箱。可以从多个微软网站下载 HTML Help Workshop。要找到下载链接，请访问微软网站（`http://www.microsoft.com`）。搜索“HTML\
  \ Help”——搜索结果应显示一个 HTML Downloads 主题。选择该链接，你将被引导至一个可以下载的地方。下载完成后，按照指示安装工作箱。\n\n\
  创建一个完整的帮助文件是一项大任务，有时花费的时间与创建应用程序本身一样多！正因如此，我们将简单概述涉及的步骤，生成一个简单的示例，并提供进一步参考的指导。构建自己的帮助文件涉及五个主要步骤：\n\
  \n1. 创建你的应用程序并开发帮助系统主题的层级列表。此列表由标题和特定标题下的主题组成。\n2. 创建主题文件（HTM 扩展）。请确保你对主题文件进行了拼写和语法检查。如果你的帮助系统中存在错误，你的用户可能对你开发应用程序时付出的用心没有太大信心。\n\
  3. 创建目录（HHC 扩展）。\n4. 创建帮助项目文件（HHP 扩展）。\n5. 编译帮助文件以创建你完成的帮助系统（CHM 扩展）。\n\n步骤 1 取决于应用程序。在这里，我们将查看如何使用\
  \ HTML Help Workshop 完成后四个步。\n\n## 启动 HTML Help Workshop\n\n我们将演示如何使用 HTML Help\
  \ Workshop 构建一个非常基础的帮助系统。帮助文件将有两个标题。每个标题将有三个子主题：\n\n标题 1\n主题 1\n主题 2\n主题 3\n\n标题\
  \ 2\n主题 1\n主题 2\n主题 3\n\n虽然简单，这里遵循的步骤可以用于构建一个完善的帮助系统。构建此帮助系统期间创建的所有文件都可以在 `VCSDB\\\
  Code\\Class 5\\Sample Help` 文件夹中找到。如果安装恰当，你的计算机程序菜单中将有一个帮助工作箱的项目。点击“开始”，然后点击“程序”。选择\
  \ HTML Help Workshop，再次选择 HTML Help Workshop。应该出现此对话框：\n\n![Image](img/00416.jpeg)\n\
  \n我们想要启动一个新项目。在“文件”菜单下选择“新建”。在出现的选择框中选择“项目”并点击“确定”。会出现一个可爱的“新建项目向导”：\n\n![Image](img/00176.jpeg)\n\
  \n此时，我们只需要向向导告诉我们项目文件的名称。点击“下一步”。在下一个屏幕上，找到（或创建）存放你文件的文件夹（再次，我使用了 `VCSDB\\Code\\\
  Class 5\\Sample Help`）并使用项目名称 `Sample`。点击两次“下一步”（不做其他选择），然后点击“完成”。文件 `Sample.hhp`\
  \ 被创建，你将看到：\n\n![Image](img/00195.jpeg)\n\n## 创建主题文件\n\n此时，我们准备好创建主题文件了。这些文件是用户可以查看以获取帮助系统目录区域列出的主题帮助的文件。在我们的示例中将有八个这样的文件（每个标题各一个，每个三个主题各一个）。\n\
  \n每个文件都是单独创建并保存为 HTM 文件的。要创建第一个文件（对应标题 1），在“文件”菜单下选择“新建”。选择“HTML 文件”并点击“确定”。为文件命名（Heading\
  \ 1）并点击“确定”。一个主题框架将会出现：\n\n![Image](img/180.jpeg)\n\n右侧窗口是你输入主题信息的地方。文件那里有一些 HTML\
  \ 代码。如果你以前没见过 HTML，不要恐慌。我们会让它变得简单。我们只 `<BODY>` 和 `</BODY>` 标签之间的内容。这些标记标记了选择此标题时显示的文本的开始和结束。\n\
  \n大多数 HTML 标签是成对工作的。第一个标签表示开始某事，带有斜杠 `/` 的第二个标签表示停止某事。因此，`<BODY>` 表示主体开始。`</BODY>`\
  \ 表示主体结束。理解 HTML 真的很容易。\n\n稍微多一点 HTML 有助于让你的文本具有良好的外观。要更改字体，使用 `FONT` 标签：\n\n```html\n\
  <FONT FACE=\"FontName\" SIZE=\"FontSize\">\n```\n\n其中 `FontName` 是所需的字体名称 `FontSize`\
  \ 是所需的大小。注意这与 Visual Basic 中的 `Font` 构造非常相似。当你用完一种字体并想要指定新字体时，必须使用 `</FONT>` 标签。要加粗文本，使用\
  \ `<STRONG>` 和 `</STRONG>` 标签。在 HTML 中划分段落，使用 `<P>` 和 `</P>` 标签。要换行，使用 `<BR>`。没有对应的\
  \ `</BR>` 标签。\n\n所以，使用我们简单的 HTML 知识（如果你懂更多，尽管使用），我们可以创建第一个主题文件。我用于创建第一个主题（Heading1）的\
  \ HTML 是：\n\n```html\n<BODY>\n<STRONG>\n这是标题 1\n</STRONG>\n<P>\n在这里我解释此标题下可用的子主题。\n\
  </P>\n</BODY>\n```\n\n此 HTML 将创建这个完成的主题：\n\n![Image](img/0210.jpeg)\n\n完成输入第一个主题后，在“文件”菜单下选择“关闭文件”。选择一个文件名（我使用了\
  \ `Heading1.HTM`）来使用并保存主题文件。当然，你随时随时重新打开、修改并重新保存任何主题文件。\n\n\n\n\n你对帮助系统中的每个主题都重复上述过程。也就是说，创建一个新文件，输入你的主题并保存。你的帮助系统中的每个主题都将拥有一个\
  \ HTM 文件。对于我们的示例，请使用你喜欢的文本和格式再创建七个 HTM 文件。我创建的文件保存为：`Heading1.HTM`、`Topic11.HTM`、`Topic12.HTM`、`Topic13.HTM`、`Heading2.HTM`、`Topic21.HTM`、`Topic22.HTM`、`Topic23.HTM`。\n\
  \n使用 Help Workshop 创建 HTML 主题文件有点繁琐。你需要使用 HTML 标签，而且在完成帮助系统之前，你并不知道你的主题文件看起来是什么样的。使用\
  \ WYSIWYG（所见即所得）编辑器是更好的选择。此类编辑器允许你在不需要了解任何 HTML 的情况下创建 HTML 文件。你只需要在普通的文字处理环境环境中输入内容，然后将其保存为\
  \ HTML 格式即可。目前有多种 WYSIWYG HTML 编辑器可用。可以从互联网下载网站查看选项。此外，大多数文字处理器都提供将文档保存为 HTML 文件的选项。我始终对主题文件使用\
  \ WYSIWYG 编辑器（FrontPage 是我的选择）。我只需将每个主题文件保存到与我的帮助系统文件相同的文件夹中，就像我使用内置编辑器一样。\n\n接下来，我们创建一个目录文件。但在离开你的主题文件之前，请确保它们尽可能完整和准确。再次，请检查是否有拼写错误——没有什么比一份准备粗糙的帮助文件更让用户感到恐慌了。他们会迅速得出结论：如果帮助系统构建得不用心心，那么应用程序也一定构建得很草率。\n\
  \n# 创建目录文件\n\n目录文件指定了当选择帮助系统的“内容（Contents）”选项卡时显示的主题层次结构。在 HTML Help Workshop 中，选择“文件（File）”菜单下的“新建（New）”选项。选择“目录（Table\
  \ of Contents）”，然后点击“确定（OK）”。出现以下窗口：\n\n![Image](img/00186.jpeg)\n\n我们要添加两个标题，每个标题下有三个主题。要插入标题，在右侧框架中点击带有文件夹图标的工具栏按钮（`插入标题（Insert\
  \ a heading）`）。出现此窗口：\n\n![Image](img/00193.jpeg)\n\n在“项目标题（Entry title）”中输入条目的标题（这将显示在“内容”中——我使用了\
  \ *My First Heading*）。\n\n你还需要将此主题链接到它的主题文件（`HTM 文件`）。要做到此点，点击“添加（Add）”，会显示此界面：\n\
  \n![Image](img/00205.jpeg)\n\n点击“浏览（Browse）”按钮，“指向”对应的主题文件（在此情况下为 `Heading1.HTM`）。点击“确定（OK）”关闭此窗口。\n\
  \n点击“确定（OK）”关闭目录条目窗口，你现在将看到：\n\n![Image](img/00275.jpeg)\n\n你创建了目录中的第一个条目。注意标题旁边的图标是一个“打开的文件夹”。要将其更改为更熟悉的“打开的书”，点击顶部工具栏按钮（`内容属性（Contents\
  \ properties）`）。在出现的窗口中，取消取消“使用文件夹代替书籍（Use Folders Instead of Books）”旁边的勾选，并点击“确定（OK）”。\n\
  \n现在，我们需要在第一个标题下输入第一个主题。点击标题按钮下的工具栏按钮（`插入页面（Insert a page）`）。将出现此对话框：\n\n![Image](img/00090.jpeg)\n\
  \n回答“否（No）”——我们要在标题主题之后添加条目。此时，你遵循处理标题时的相同步骤：输入标题并添加指向主题文件的链接。\n\n为我们小示例中的所有主题文件添加目录条目。使用你选择的任何标题信息。当你输入第二个标题时，它将列在第一个标题下的第三个主题下方。要将其向左移动（使其成为主标题），右键点击标题并选择`向左移动（Move\
  \ Left）`（即工具栏上的左箭头按钮）。完成后，我得到了效果：\n\n![Image](img/00203.jpeg)\n\n保存内容文件。在“文件（File）”菜单下选择“关闭文件（Close\
  \ File）”，并为此内容文件分配名称 `Sample.HHC`。\n\n# 编译帮助文件\n\n我们几乎准备好编译并创建我们的帮助系统了。在在此之前，我们需要向项目文件添加条目。此时项目文件显示为：\n\
  \n![Image](img/00211.jpeg)\n\n我们首先需要添加主题文件。要做到此点，选择“添加/删除主题文件（Add/remove topic files）”工具栏按钮。在出现的窗口中，点击“添加（Add）”，选择所有主题文件。你应该看到：\n\
  \n![Image](img/00214.jpeg)\n\n点击“确定（OK）”。\n\n现在，项目文件已添加主题文件：\n\n![Image](img/00213.jpeg)\n\
  \n现在我们指定目录文件并设置其他几个属性。点击“更改项目选项（Change project options）”工具栏按钮。点击“常规（General）”选项卡并为你的帮助系统输入标题（我使用了\
  \ *My Sample Help File*）并指定默认文件（`Heading1.htm`）：\n\n![Image](img/00234.jpeg)\n\n\
  点击“文件（Files）”选项卡并选择 `Sample.hhc` 作为你的内容文件。点击“确定（OK）”完成项目文件的指定。此时，通过选择“文件（File）”菜单下的“保存项目（Save\
  \ Project）”来保存所有文件。\n\n我们现在可以将项目编译为成品——一个完整的 HTML 帮助系统。要做到这一点，点击“编译 HTML 文件（Compile\
  \ HTML file）”按钮（类似于肉肉机）位于工具栏。浏览你的项目文件（`Sample.hhp`）。点击“编译（Compile）”。\n\n最后，我们可以查看我们的产品。点击工具栏上的“查看（View）”按钮。选择\
  \ `Sample.chm` 文件。目录将出现，标题并显示：\n\n![Image](img/00113.jpeg)\n\n点击目录以显示主题。\n\n\n\n\
  上述步骤提供了对 HTML 帮助系统的最基本但足够的访问方法。如果你需要更多的功能（如上下文敏感型帮助、单个控件的帮助、弹出帮助、在对话框中添加帮助），请参阅关于\
  \ `Help Provider` 控件的 Visual C#文档。\n\n## 示例 5-8：作者表输入表单（在线帮助）\n\n我们将为作者表输入表单构建一个简单的帮助系统并将其附加到应用程序中。请参考之前的笔记完成此处列出的每个步骤。\n\
  \n1. 使用 FrontPage 或类似产品准备一个单独的主文件（保存为 `authors.htm`，并存放在 `VCSDB\\Code\\Class 5\\\
  Example 5-8\\HelpFile` 文件夹中）：\n\n![Image](img/00219.jpeg)\n\n2. 使用 HTML Help Workshop\
