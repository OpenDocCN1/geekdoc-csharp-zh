  ```\n\n此代码为书籍连接对象创建了命令对象。\n\n### 3. 重新保存并运行应用程序，确保没有出现错误。\n\n## DataAdapter 对象\n\
  \n正如所见，数据适配器对象使用命令对象在连接对象和包含一个或多个数据表的数据集之间传输数据。对于我们的初始工作，我们将使用数据适配器直接形成一个数据表（将在后续讨论），而不使用数据集。通常情况下，你想要查看的每个数据表都需要一个数据适配器对象。\n\
  \n### 数据适配器属性：\n\n| 属性 | 描述 |\n| :--- | :--- |\n| `DeleteCommand` | 允许适配器从数据表中删除行的命令对象。\
  \ |\n| `InsertCommand` | 允许适配器向数据表插入行的命令对象。 |\n| `SelectCommand` | 适配器用于为数据表选择行的命令对象。\
  \ |\n| `UpdateCommand` | 适配器用于更新数据表中的行的命令对象。 |\n\n### 数据适配器方法：\n\n| 方法 | 描述 |\n\
  | :--- | :--- |\n| `Fill` | 用给定的数据表填充数据适配器。 |\n| `Update` | 更新数据适配器持有的数据表。 |\n\n\
  ### DataAdapter 对象 – Access 数据库\n\n要声明并构造名为 `myAdapter` 的 `OleDbDataAdapter`，使用：\n\
  \n```cs\nOleDbDataAdapter myAdapter;\nmyAdapter = new OleDbDataAdapter();\n```\n\
  \n我们使用 SQL 查询指定 `SelectCommand`（`myCommand`，一个命令对象），以选择将组成相应数据表的行。\n\n`myAdapter.SelectCommand\
  \ = myCommand;`\n\n一旦指定了 `SelectCommand`，其他命令对象（`DeleteCommand`、`InsertCommand`、`UpdateCommand`）将使用命令生成器对象构建。为我们的示例适配器（`myAdapter`）完成此任务的语句是：\n\
  \n```cs\nOleDbCommandBuilder myCommandBuilder = new OleDbCommandBuilder(myAdapter);\n\
  ```\n\n执行此行后，可以通过检查以下查看（如果需要）三个命令对象：\n`myCommandBuilder.GetDeleteCommand.CommandText`\n\
  `myCommandBuilder.GetInsertCommand.CommandText`\n`myCommandBuilder.GetUpdateCommand.CommandText`\n\
  \n我们实际上从未查看这些命令对象——它们由数据适配器的 `Update` 方法使用。我们在第 5 章开始学习数据库管理任务时会查看该方法。\n\n信不信，我们很快就要看到一些真实的数据了！数据适配器的\
  \ `Fill` 方法完成了此任务，但首先我们来看查看数据集和数据表。\n\n### DataAdapter 对象 – SQL Server 数据库\n\n要声明并构造名为\
  \ `myAdapter` 的 `SqlDataAdapter`，使用：\n\n```cs\nSqlDataAdapter myAdapter;\nmyAdapter\
  \ = new SqlDataAdapter();\n```\n\n我们使用 SQL 查询指定 `SelectCommand`（`myCommand`，一个命令对象），以选择将组成相应数据表的行。\n\
  \n`myAdapter.SelectCommand = myCommand;`\n\n一旦指定了 `SelectCommand`，其他命令对象（`DeleteCommand`、`InsertCommand`、`UpdateCommand`）将使用命令生成器对象构建。为我们的示例适配器（`MyAdapter`）完成此任务的语句是：\n\
  \n```cs\nSqlCommandBuilder myCommandBuilder = new SqlCommandBuilder(myAdapter);\n\
  ```\n\n执行此行后，可以通过检查查看（如果需要）三个命令对象：\n`myCommandBuilder.GetDeleteCommand.CommandText`\n\
  `myCommandBuilder.GetInsertCommand.CommandText`\n`myCommandBuilder.GetUpdateCommand.CommandText`\n\
  \n我们实际上从未查看这些命令对象——它们由数据适配器的 `Update` 方法使用。我们在第 5 章开始学习数据库管理任务时会查看该方法。\n\n信不信，我们很快就要看到一些真实的数据了！数据适配器的\
  \ `Fill` 方法完成了此任务，但首先我们来看查看数据集和数据表。\n\n## DataSet 对象\n\n数据集对象提供了构建、加载、存储和保存数据所需的所有功能。它是多个数据表的“容器”。\n\
  \n### DataSet 属性：\n\n| 属性 | 描述 |\n| :--- | :--- |\n| `DataSetName` | 分配给数据集的名称。\
  \ |\n| `Tables` | 数据集中数据表的集合。 |\n\n要声明并构造名为 `myDataSet` 的 `DataSet`，使用：\n\n```cs\n\
  DataSet myDataSet;\nmyDataSet = new DataSet();\n```\n\n要将数据表（`myTable`）添加到数据集，使用：\n\
  \n```cs\nmyDataSet.Tables.Add(myTable);\n```\n\n我们并不使用数据集——我们倾向于直接与数据表工作。\n\n##\
  \ DataTable 对象\n\n数据表对象表示数据表中包含的信息。\n\n### DataTable 属性：\n\n| 属性 | 描述 |\n| :---\
  \ | :--- |\n| `Columns` | 定义列的 `DataColumn` 对象集合。 |\n| `DataSet` | 包含此 DataTable\
  \ 的 DataSet 对象（如果有）。 |\n| `DefaultView` | 表示 DataTable 内容的 DataView。 |\n| `Rows`\
  \ | 定义表行的 `DataRow` 对象集合。 |\n| `TableName` | 数据表的名称。 |\n\n### DataTable 方法：\n\n\
  | 方法 | 描述 |\n| :--- | :--- |\n| `Clear` | 从数据表中删除所有行。 |\n| `Copy` | 创建数据表的副本。 |\n\
  | `ImportRow` | 将 `DataRow` 对象导入数据表。 |\n| `NewRow` | 为数据表创建一个新的 `DataRow` 对象。 |\n\
  \n要声明并构造一个名为 `myTable` 的数据表，使用：\n\n（此处代码逻辑同上文）\n\n一旦创建了表，就可以使用相应数据适配器的 `Fill` 方法进行填充。如果该适配器是\
  \ `myAdapter`，语法为：\n\n`myAdapter.Fill(myTable);`\n\n此时，我们有了一个通过向数据库发送 SQL 查询生成的、可以在\
  \ Visual C# 应用程序中查看的数据表。\n\n## DataRow 对象\n\n数据行对象表示数据表中记录记录的信息。它对于检索和/修改记录中的单个字段非常有用。\n\
  \n### DataRow 属性：\n\n| 属性 | 描述 |\n| :--- | :--- |\n| `Item` | 获取或设置行的一个字段。参数可以是列索引或字段名。\
  \ |\n| `Table` | 包含该行的表的引用。 |\n\n### DataRow 方法：\n\n| 方法 | 描述 |\n| :--- | :--- |\n\
  | `BeginEdit` | 将数据行于编辑模式。 |\n| `CancelEdit` | 取消数据行的当前编辑。 |\n| `Delete` | 从数据表中删除该行。\
  \ |\n\n我们将在课程后半部分详细查看数据行，特别是第 10 章的示例项目。\n\n示例 3-1（数据表）\n\n访问书籍数据库\n\n\n\n我们在示例中添加了一个数据适配器对象和一个数据表对象。与数据适配器关联的数据表将包含来自\
  \ books 数据库的 `Titles` 表。\n\n### 1. 添加这些表单级声明：\n\n**Access 数据库:**\n```cs\nOleDbDataAdapter\
  \ titlesAdapter;\nDataTable titlesTable;\n```\n\n**SQL Server 数据库:**\n```cs\nSqlDataAdapter\
  \ titlesAdapter;\nDataTable titlesTable;\n```\n\n### 2. 将阴影部分的代码添加到 `frmTitles_Load`\
  \ 方法中：\n\n**Access 数据库:**\n```csharp\nprivate void frmTitles_Load(object sender,\
  \ EventArgs e)\n{\n    // 连接到 books 数据库\n    booksConnection = new OleDbConnection(\"\
  Provider=Microsoft.ACE.OLEDB.12.0; Data Source = c:\\\\VCSDB\\\\Working\\\\BooksDB.accdb\"\
  );\n    // 打开连接\n    booksConnection.Open();\n    // 显示状态\n    lblState.Text = booksConnection.State.ToString();\n\
  \    // 建立命令对象\n    titlesCommand = new OleDbCommand(\"Select * from Titles\", booksConnection);\n\
  \    // 建立数据适配器/数据表\n    titlesAdapter = new OleDbDataAdapter();\n    titlesAdapter.SelectCommand\
  \ = titlesCommand;\n    titlesTable = new DataTable();\n    titlesAdapter.Fill(titlesTable);\n\
  \    // 关闭连接\n    booksConnection.Close();\n    // 显示状态\n    lblState.Text += booksConnection.State.ToString();\n\
  \    // 释放连接对象\n    booksConnection.Dispose();\n    titlesCommand.Dispose();\n \
  \   titlesAdapter.Dispose();\n    titlesTable.Dispose();\n}\n```\n\n**SQL Server\
  \ 数据库:**\n```csharp\nprivate void frmTitles_Load(object sender, EventArgs e)\n{\n\
  \    // 连接到 books 数据库\n    booksConnection = new SqlConnection(\"Data Source=.\\\
  \\SQLEXPRESS; AttachDbFilename=c:\\\\VCSDB\\\\Working\\\\SQLBooksDB.mdf; Integrated\
  \ Security=True; Connect Timeout=30; User Instance=True\");\n    // 打开连接\n    booksConnection.Open();\n\
  \    // 显示状态\n    lblState.Text = booksConnection.State.ToString();\n    // 建立命令对象\n\
  \    titlesCommand = new SqlCommand(\"Select * from Titles\", booksConnection);\n\
  \    // 建立数据适配器/数据表\n    titlesAdapter = new SqlDataAdapter();\n    titlesAdapter.SelectCommand\
  \ = titlesCommand;\n    titlesTable = new DataTable();\n    titlesAdapter.Fill(titlesTable);\n\
  \    // 关闭连接\n    booksConnection.Close();\n    // 显示状态\n    lblState.Text += booksConnection.State.ToString();\n\
  \    // 释放连接对象\n    booksConnection.Dispose();\n    titlesCommand.Dispose();\n \
  \   titlesAdapter.Dispose();\n    titlesTable.Dispose();\n}\n```\n\n这段新代码创建了数据适配器，并从\
  \ `Titles` 表加载了数据。\n\n### 3. 重新保存并运行应用程序\n再次确保没有错误。如果没有发生错误，说明你已成功创建了数据表。接下来，我们查看如何在\
  \ Visual C# 应用程序中查看此表中的信息。\n\n## 数据绑定控件\n我们已经看到 ADO .NET 数据对象允许我们连接到数据库并形成数据表。然而，这些对象并没有为我们提供任何查看数据库中信息的方法。要查看信息，我们使用数据绑定控件，这些是特殊的控件，其属性由数据库字段建立而得。对于你需要查看的数据库表中的每个字段（列），都需要一个数据绑定控件。大多数标准的\
  \ Visual C# 工具都可以用作数据绑定控件。\n\n![图像](img/00089.jpeg)\n\n一些数据绑定数据控件（使用简单绑定）包括：\n\n\
  | 控件 | 描述 |\n| :--- | :--- |\n| Label | 可用于对指定的文本数据字段提供只读访问。通常绑定 `Text` 属性。 |\n\
  | Text Box | 可用于对指定的文本数据字段提供读写访问。可能是最广泛的数据绑定工具。通常绑定 `Text` 属性。 |\n| Check Box |\
  \ 用于对布尔字段提供读/写访问。`Value` 属性是数据绑定的。 |\n| Picture Box | 用于从位图、图标、gif、jpeg 或元文件文件中显示图形图像。为图像/二进制数据字段提供读/写访问。`Image`\
  \ 属性是数据绑定的。 |\n\n其他使用复杂绑定的控件（在本课程的后部分将详细介绍）：\n\n| 控件 | 描述 |\n| :--- | :--- |\n|\
  \ List Box | 可显示数据库中特定字段的所有值。 |\n| Combo Box | 可显示数据库中特定字段的所有值。 |\n| Data Grid View\
  \ | 可显示整个数据库表。 |\n\n将控件（`myControl`）的特定属性（`myProperty`）绑定到数据表对象（`myTable`）的特定字段（`myField`），语法为：\n\
  \n`myControl.DataBindings.Add(myProperty, myTable, myField);`\n\n因此，每个需要绑定到数据库字段的控件都需要这样的语句。绑定通常在初始表单的\
  \ `Load` 方法中完成。\n\n清除定义的定义的定义的语法为：\n`myControl.DataBindings.Clear();`\n\n### 示例\
  \ 3-1（数据绑定）访问 Books 数据库\n我们现在添加一些绑定到 `Titles` 数据库表字段的控件，以便我们可以查看某些数据。\n\n1. 移除用于显示状态的\
  \ Label 控件（我们现在知道一切运行正常了）。\n2. 添加四个 Label 控件和四个 Text Box 控件，使表单看起来如下：\n![图像](img/00058.jpeg)\n\
  3. 设置以下属性：\n\n| 控件 | 属性 | 绑定字段 |\n| :--- | :--- | :--- |\n| Label1 | Text | Title\
  \ |\n| Label2 | Text | Year Published |\n| Label3 | Text | ISBN |\n| Label4 | Text\
  \ | Publisher ID |\n| Text Box1 | Text | Title |\n| Text Box2 | Text | Year Published\
  \ |\n| Text Box3 | Text | ISBN |\n| Text Box4 | Text | PubID |\n\n完成后的表单应如下：\n![图像](img/0016.jpeg)\n\
  \n4. 将阴影部分的代码添加到 `frmTitles_Load` 方法中。这些行将四个 Text Box 绑定到 `Titles` 表中的相应字段。移除引用\
  \ `lblState` 的行。\n\n\n\n\n\n```cs\ntxtPubID.DataBindings.Add(\"Text\",titlesTable,\
  \ \"PubID\");\n\n//close the connection\n\nbooksConnection.Close();\n\n//display\
  \ state\n\nlblState.Text += booksConnection.State.ToString();\n\n//dispose of the\
  \ connection object\n\nbooksConnection.Dispose();\n\ntitlesCommand.Dispose();\n\n\
  titlesAdapter.Dispose();\n\ntitlesTable.Dispose();\n\n}\n```\n\n5. 保存并重新运行应用程序。你应该看到：\n\
  \n![Image](img/00470.jpeg)\n\n终于，我们可以在 Visual C# 应用程序中看到数据了。`Titles` 表中的第一条记录正在显示。我们仍然没有方法在表格中进行导航。接下来我们将通过一个非常强大的数据对象——`CurrencyManager`\
  \ 对象来实现这一功能。\n\n## CurrencyManager 对象\n\n我们需要查看数据的最后一个组件是货币管理器（currency manager）对象。一旦与数据表对象联联，货币管理器不仅允许在表格的行之间进行导航，还提供了若干数据库管理任务，如编辑、添加记录和删除记录。\n\
  \n![Image](img/00184.jpeg)\n\n### 货币管理器对象属性：\n\n| Bindings | 绑定到此管理器的控件集合。 |\n|\
  \ Count | 与管理器关联的表格行数。 |\n| Position | 获取或设置数据表中的当前行（范围从 0 到 `Count` – 1）。 |\n\n\
  ### 货币管理器方法：\n\n| AddNew | 向数据源添加新的一行。 |\n| CancelCurrentEdit | 取消当前的编辑操作。 |\n|\
  \ EndCurrentEdit | 结束当前的编辑操作并接受任何更改。 |\n| Refresh | 刷新绑定的控件。 |\n| RemoveAt | 删除指定的数据行。\
  \ |\n\n现在，我们专门查看货币管理器对象的导航能力。首先，使用以下代码声明货币管理器对象（`myManager`）：\n\n```cs\nCurrencyManager\
  \ myManager;\n```\n\n我们使用关联数据表的 `BindingContext` 为货币管理器建立引用。对于一个名为 `myTable` 的表，我们使用此语法：\n\
  \n```cs\nmyManager = (CurrencyManager)\nthis.BindingContext[myTable];\n```\n\n这仅仅是将表的绑定上下文信息转换为货币管理器对象。\n\
  \n一旦建立了货币管理器对象，就可以通过简单修改 `Position` 属性来实现数据表中 `Count` 行之间的基础导航。请查看示例 3-1 的最终版本，了解其如何这样使用。\n\
  \n## 示例 3-1（最终版本）\n\n### 访问 Books 数据库\n\n最后，我们添加允许在 `Titles` 数据库表行之间进行导航的控件。\n\n\
  1. 添加四个按钮控件，使表单看起来所示：\n\n![Image](img/00069.jpeg)\n\n2. 设置以下属性：\n\n| Button1: |\
  \ |\n| | Name | `btnFirst` |\n| | Text | `&First` |\n| Button2: | |\n| | Name |\
  \ `btnPrevious` |\n| | Text | `&Previous` |\n| Button3: | |\n| | Name | `btnNext`\
  \ |\n| | Text | `&Next` |\n| Button4: | |\n| | Name | `btnLast` |\n| | Text | `&Last`\
  \ |\n\n完成后的表单为：\n\n![Image](img/00015.jpeg)\n\n3. 添加此表级声明：\n\n```cs\nCurrencyManager\
  \ titlesManager;\n```\n\n4. 在 `frmTitles_Load` 方法中添加阴影行。这些行设置了指向 `Titles` 表的货币管理器引用。\n\
  \n**访问数据库：**\n\n```cs\nprivate void frmTitles_Load(object sender, EventArgs e)\n\
  {\n// connect to books database\nbooksConnection = new\nOleDbConnection(\"Provider=Microsoft.ACE.OLEDB.12.0;\
  \ Data\nSource = c:\\\\VCSDB\\\\Working\\\\BooksDB.accdb\");\n\n//open the connection\n\
  booksConnection.Open();\n\n// establish command object\ntitlesCommand = new OleDbCommand(\"\
  Select * from Titles\",\nbooksConnection);\n\n// establish data adapter/data table\n\
  titlesAdapter = new OleDbDataAdapter();\ntitlesAdapter.SelectCommand = titlesCommand;\n\
  titlesTable = new DataTable();\ntitlesAdapter.Fill(titlesTable);\n\n// bind controls\
  \ to data table\ntxtTitle.DataBindings.Add(\"Text\", titlesTable, \"Title\");\n\
  txtYearPublished.DataBindings.Add(\"Text\", titlesTable, \"Year_Published\");\n\
  txtISBN.DataBindings.Add(\"Text\", titlesTable, \"ISBN\");\ntxtPubID.DataBindings.Add(\"\
  Text\",titlesTable, \"PubID\");\n\n// establish currency manager\ntitlesManager\
  \ = (CurrencyManager)\nBindingContext[titlesTable];\n\n//close the connection\n\
  booksConnection.Close();\n\n//dispose of the connection object\nbooksConnection.Dispose();\n\
  titlesCommand.Dispose();\ntitlesAdapter.Dispose();\ntitlesTable.Dispose();\n}\n\
  ```\n\n**SQL Server 数据库：**\n\n```cs\nprivate void frmTitles_Load(object sender,\
  \ EventArgs e)\n{\n// connect to books database\nbooksConnection = new SqlConnection(\"\
  Data\nSource=.\\\\SQLEXPRESS;\nAttachDbFilename=c:\\\\VCSDB\\\\Working\\\\SQLBooksDB.mdf;\n\
  Integrated Security=True; Connect Timeout=30; User\nInstance=True\");\n\n//open\
  \ the connection\nbooksConnection.Open();\n\n//display state\nlblState.Text = booksConnection.State.ToString();\n\
  \n// establish command object\ntitlesCommand = new SqlCommand(\"Select * from Titles\"\
  , booksConnection);\n\n// establish data adapter/data table\ntitlesAdapter = new\
  \ SqlDataAdapter();\ntitlesAdapter.SelectCommand = titlesCommand;\ntitlesTable =\
  \ new DataTable();\ntitlesAdapter.Fill(titlesTable);\n\n// bind controls to data\
  \ table\ntxtTitle.DataBindings.Add(\"Text\", titlesTable, \"Title\");\ntxtYearPublished.DataBindings.Add(\"\
  Text\", titlesTable, \"Year_Published\");\ntxtISBN.DataBindings.Add(\"Text\", titlesTable,\
  \ \"ISBN\");\ntxtPubID.DataBindings.Add(\"Text\", titlesTable, \"PubID\");\n\n//\
  \ establish currency manager\ntitlesManager = (CurrencyManager)\nBindingContext[titlesTable];\n\
  \n//close the connection\nbooksConnection.Close();\n\n//dispose of the connection\
  \ object\nbooksConnection.Dispose();\ntitlesCommand.Dispose();\ntitlesAdapter.Dispose();\n\
  titlesTable.Dispose();\n}\n```\n\n5. 为这些按钮添加这四个 Click 方法；每个方法只需相应地修改 `Position`\
  \ 属性：\n\n```cs\nprivate void btnFirst_Click(object sender, EventArgs e)\n{\ntitlesManager.Position\
  \ = 0;\n}\n\nprivate void btnPrevious_Click(object sender, EventArgs e)\n{\ntitlesManager.Position--;\n\
  }\n\nprivate void btnNext_Click(object sender, EventArgs e)\n{\ntitlesManager.Position++;\n\
  }\n\nprivate void btnLast_Click(object sender, EventArgs e)\n{\ntitlesManager.Position\
  \ = titlesManager.Count - 1;\n}\n```\n\n\n\n\n\n如果你愿意，可以查看示例 3-2。它将引导你通过数据向导（data\
  \ wizards）来重新构建示例 3-1。你会发现向导其实非常酷！我仍然使用它们来快速构建个人使用的应用程序。它们对于快速测试数据库应用程序概念也很有帮助。你可以决定是否喜欢它们。正如前面提到的，本课程中将不会使用这些工具。\n\
