  \n## 示例 5-2: 使用 SQL Server 数据库\n\nSQL Server 版本的示例差异：\n\n1. SQL Server 版本的书籍数据库是\
  \ `SQLBooksDB.mdf`。将 `SQLBooksDB.mdf` 拷贝到你的工作目录。\n\n2. 使用此 `using` 语句：\n\n```csharp\n\
  using System.Data.SqlClient;\n```\n\n3. 在声明中，使用这些对象：\n\n```csharp\nSqlConnection\
  \ booksConnection;\nSqlCommand authorsCommand;\nSqlDataAdapter authorsAdapter;\n\
  DataTable authorsTable;\nCurrencyManager authorsManager;\n```\n\n4. 在 `frmAuthors_Load`\
  \ 方法中，使用此连接对象：\n\n```csharp\nbooksConnection = new SqlConnection(\"Data Source=.\\\
  \\SQLEXPRESS;AttachDbFilename=c:\\\\VCSDB\\\\Working\\\\SQLBooksDB.mdf;Integrated\
  \ Security=True; Connect Timeout=30;User Instance=True\");\n```\n\n5. 在 `frmAuthors_Load`\
  \ 中：\n\n* 将所有的 `OleDbCommand` 实例更改为 `SqlCommand`\n* 将所有的 `OleDbDataAdapter` 实例更改为\
  \ `SqlDataAdapter`\n\n\n\n\n在许多数据库应用程序中，你可能想向用户传递某些信息。这些信息可能是一个礼貌消息（“新记录已写入”），也可能是需要反馈的问题（“你确定要删除此记录吗？”）。Visual\
  \ C#（以及 Windows）为提供此类信息提供了一个极佳媒介——`MessageBox` 对象。\n\n如果你用过 Windows 应用程序，一定见过消息框。回想你见过的所有例子。例如，消息框被用于询问你在退出前是否要保存文件，或者在磁盘驱动器未准备好时向你发出警告。例如，当我在\
  \ Microsoft Word 中编写这些笔记并尝试退出时，我看到了这个消息框：\n\n![Image](img/00237.jpeg)\n\n在这个消息框中，你所控制的不同部分已标记了标签。你将看到如何按照你想要的方式格式化消息框。\n\
  \n要使用 `MessageBox` 对象，你需要决定消息的 `Text` 是什么、你想要的 `Caption` 是什么、什么样的 `Icon` 和 `Buttons`\
  \ 适当，以及想要哪个 `DefaultButton`。在代码中显示消息框，你使用 `MessageBox.Show` 方法。\n\n`MessageBox`\
  \ 有多种重载方式来实现 `Show` 方法。一些较常用的方式有：\n\n```\nMessageBox.Show(Text);\nMessageBox.Show(Text,\
  \ Caption);\nMessageBox.Show(Text, Caption, Buttons);\nMessageBox.Show(Text, Caption,\
  \ Buttons, Icon);\nMessageBox.Show(Text, Caption, Buttons, Icon, DefaultButton);\n\
  ```\n\n在这些实现中，如果省略了 `DefaultButton`，则第一个按钮为默认按钮。如果省略了 `Icon`，则不显示图标。如果省略了 `Buttons`，则显示“OK”按钮。如果省略了\
  \ `Caption`，则不显示标题。\n\n决定消息框的 `Text` 和 `Caption` 信息（字符串数据类型）。其他参数由 Visual C# 预定义常量定义。`Buttons`\
  \ 常量由 `MessageBoxButtons` 常量定义：\n\n| 成员 | 说明 |\n| :--- | :--- |\n| AbortRetryIgnore\
  \ | 显示中止、重试和忽略按钮 |\n| OK | 显示 OK 按钮 |\n| OKCancel | 显示 OK 和取消按钮 |\n| RetryCancel\
  \ | 显示重试和取消按钮 |\n| YesNo | 显示 是和否按钮 |\n| YesNoCancel | 显示 是、否和取消按钮 |\n\n指定按钮选择的语法是通常的点表示法：\n\
  \n`MessageBoxButtons.Member`\n\n因此，要显示 OK 和 取消按钮，常量是：\n\n`MessageBoxButtons.OKCancel`\n\
  \n然而，你不需要记住这些。在输入代码时，当你到达该参数处，Intellisense（智能感知）功能将提供按钮选择的下拉列表！这将发生在 `MessageBox`\
  \ 对象中的所有参数上。\n\n显示的 `Icon` 由 `MessageBoxIcon` 常量确定：\n\n| 成员 | 说明 |\n| :--- | :---\
  \ |\n| IconAsterisk | 显示信息图标 |\n| IconInformation | 显示信息图标 |\n| IconError | 显示错误图标（红圈中的白色\
  \ X） |\n| IconHand | 显示错误图标 |\n| IconNone | 不显示图标 |\n| IconStop | 显示错误图标 |\n| IconExclamation\
  \ | 显示感叹号图标 |\n| IconWarning | 显示感叹号图标 |\n| IconQuestion | 显示问号图标 |\n\n要指定图标，语法为：\n\
  \n`MessageBoxIcon.Member`\n\n注意，`MessageBoxIcon` 常量有八个不同的成员，但只有四种可用图标（信息、错误、感叹、疑问）。这是因为当前的\
  \ Windows 系统仅提供四种图标。未来的实现可能会提供更多。\n\n当显示消息框时，显示的按钮之一将具有焦点或成为默认按钮。如果用户按下 `<Enter>`，则选中该按钮。你使用\
  \ `MessageBoxDefaultButton` 常量指定哪个按钮是默认按钮：\n\n| 成员 | 说明 |\n| :--- | :--- |\n| Button1\
  \ | 消息框中的第一个按钮为默认 |\n| Button2 | 消息框中的第二个按钮为默认 |\n| Button3 | 消息框中的第三个按钮为默认 |\n\n\
  要指定默认按钮，语法为：\n\n`MessageBoxDefaultButton.Member`\n\n所指定的默认按钮相对于显示的按钮从左到右。因此，如果你显示了\
  \ 是、否 和 取消按钮，并将第二个按钮设置为默认，则“否”按钮将具有焦点（成为默认）。尽量让默认响应是“伤害最小的”，即使用户只是盲目接受它。\n\n当你调用\
  \ `MessageBox` 对象的 `Show` 方法时，该方法返回一个来自 `DialogResult` 常量的值。可用的成员有：\n\n| 成员 | 说明\
  \ |\n| :--- | :--- |\n| Abort | 选中中止按钮 |\n| Cancel | 选中取消按钮 |\n| Ignore | 选中忽略按钮\
  \ |\n| No | 选中 否按钮 |\n| OK | 选中 OK 按钮 |\n| Retry | 选中重试按钮 |\n| Yes | 选中 是按钮 |\n\n\
  ### MessageBox 示例：\n\n这个很小的代码段落（第一行非常长）：\n\n```\nif (MessageBox.Show(\"This is an\
  \ example of a message box\",\n\"Message Box Example\", MessageBoxButtons.OKCancel,\n\
  MessageBoxIcon.Information,\nMessageBoxDefaultButton.Button1) == DialogResult.OK)\n\
  {\n// 一切正常\n}\nelse\n{\n// 按了取消\n}\n```\n\n显示出此消息框：\n\n![Image](img/00254.jpeg)\n\
  \n当然，你将根据用户点击的是 OK 还是 取消编写代码。\n\n### 另一个 MessageBox 示例：\n\n很多时候，你只是想向用户显示一条快速消息（只需要一个\
  \ OK 按钮）。这段代码执行了：\n\n```c\nMessageBox.Show(\"Quick message for you.\", \"Hey You!\"\
  );\n```\n\n结果消息框：\n\n![Image](img/0262.jpeg)\n\n注意没有图标，且显示了 OK 按钮（未指定）。此外，注意在代码中不需要读取返回值——我们知道它是什么！\n\
  \n### 示例 5-3\n\n#### 作者表输入框（消息框）\n\n在作者示例中，有两个地方可以使用消息框。一个是在保存后让用户知道的，另一个与删除记录有关。\n\
  \n1. 加载之前完成的示例 5-2。我们将修改此示例以包含消息框。\n\n2. 在 `btnSave_Click` 事件中使用以下代码：\n\n```c\n\
  private void btnSave_Click(object sender, EventArgs e)\n{\nMessageBox.Show(\"Record\
  \ saved.\", \"Save\",\nMessageBoxButtons.OK, MessageBoxIcon.Information);\n}\n```\n\
  \n显然，随着我们继续此示例，该事件中会有更多代码。这段代码实现了消息框。\n\n3. 在 `btnDelete_Click` 事件中使用以下代码：\n\n```c\n\
  private void btnDelete_Click(object sender, EventArgs e)\n{\nDialogResult response;\n\
  response = MessageBox.Show(\"Are you sure you want\ndelete this record?\", \"Delete\"\
  , MessageBoxButtons.YesNo,\nMessageBoxIcon.Question, MessageBoxDefaultButton.Button2);\n\
  \nif (response == DialogResult.No)\n{\nreturn;\n}\n}\n```\n\n注意，如果用户选择“否”，我们将退出方法。而且，注意“否”按钮是默认——这让用户在按下回车之前思考一下。像上面一样，随着我们的进行，该方法中会有更多代码。\n\
  \n4. 保存应用程序（保存在 VCSDB\\Code\\Class 5 文件夹下的 Example 5-3）并运行。点击保存按钮，你会看到：\n\n![Image](img/0278.jpeg)\n\
  \n点击 OK，然后尝试点击删除按钮查看：\n\n![Image](img/0267.jpeg)\n\n## 使用 SQL Server 数据库\n\n使用 SQL\
  \ Server 版本的项目，进行相同的更改。\n\n#### 应用程序状态\n\n\n\n\n向用户展示 Visual C# 数据库接口时，用户应该能够一眼看出需要做什么。选项应当是直观的，并且可能犯错的可能性应尽可能降至最低，甚至完全消除。为了保持这种显而易见的特性，你应该始终意识到应用程序正处于什么状态。\n\
  \n### 应用程序状态\n应用程序状态意味着明确界面内当前正在执行什么操作。你是在添加记录、编辑记录、删除记录，还是可能离开应用程序？一旦你知道了应用程序所处的状态，就可以调整界面，使得用户可以使用该特定状态下所需的选项。你还需要知道何时以及如何从一个状态转换到另一个状态。\n\
  \n哪些选项是可以通过调整来反映应用程序状态的？一个首要选项是控件的 `Enabled` 属性。通过将 `Enabled` 设置为 `False`，可以禁用控件，使用户无法使用。因此，如果用户无法保存当前记录，那么执行保存操作的按钮其\
  \ `Enabled` 属性应为 `False`。另一种更彻底的禁用控件方法是将其 `Visible` 属性设置为 `False`。在这种情况下，不会对应用程序状态产生任何误解。当应用程序从一个状态移动到另一个状态时，你需要确定哪些控件应该启用，哪些应该禁用。\n\
  \n对于文本框控件，一个重要的属性是 `ReadOnly` 属性。如果文本框中的值不需要编辑，请将 `ReadOnly` 设置为 `True`。当允许编辑时（状态发生变化），将\
  \ `ReadOnly` 属性切换为 `False`。对于始终只读的文本框（用于显示而非编辑目的），使用颜色（红色较好）来指示它们是不可访问的。在文本框中编辑时，使用\
  \ `Focus` 方法将光标置于框内，使其成为活动控件（赋予焦点），从而节省用户一次鼠标点击。`Focus` 方法还可以用于程序化地按指定顺序将用户从一个文本框移动到下一个。\n\
  \n另一种按规定从一个控件移动到另一个控件的机制是 `TabIndex` 属性，结合 `TabStop`。如果 `TabStop` 为 `True`，则 `TabIndex`\
  \ 定义了按下 `<Tab>` 键时控件激活的顺序（一次时间只能有一个控件处于激活；按下 `<Shift>-<Tab>` 时顺序会反转）。在设计时将控件放置于表单上，它们会被分配一个\
  \ `TabStop = true` 的 `TabIndex` 值。如果你不希望某个控件通过 `<Tab>` 激活，则需要将其 `TabStop` 属性重置为\
  \ `False`。如果分配的顺序不可接受，请重置目标控件的 `TabIndex` 属性，从低数字开始，并每向 `<Tab>` 序列添加一个控件就增加该值。`<Tab>`\
  \ 排序的一个主要应用是在详细输入表单从一个文本框移动到下一个。\n\n### 实际练习\n如果你对控件焦点和标签页移动的概念感到陌生或不熟悉，请尝试这样做。在\
  \ Visual C# 中创建一个新应用程序。添加三个按钮（`Button1`、`Button2`、`Button3`），然后三个文本框（`Text1`、`Text2`、`Text3`）。运行应用程序。第一个按钮（`Button1`）应该拥有焦点（文字周围有一个小框）。如果此时按下\
  \ `<Enter>`，此按钮被“点击”了。按下 `<Tab>` 键，焦点移动到第二个按钮。按两次 `<Tab>`。焦点现在应该第一个文本框中（光标在框内）。继续按\
  \ `<Tab>`，观察焦点如何从一个控件移动到另一个，始终保持相同的顺序。按下 `<Shift>-<Tab>` 会反转顺序。现在，为每个按钮将 `TabStop`\
  \ 属性设置为 `False`（将其从标签页序列中移除）。重新运行应用程序，你应该注意到焦点只在文本框之间切换。尝试重置文本框的 `TabIndex` 属性来改变切换方向。在你的应用程序中始终使用焦点概念来指示用户哪个控件是激活的。\n\
  \n这些关于应用程序状态的讨论听起来可能很复杂，但事实并非如此。再次，这只是常识问题。设计好界面后，在 Visual C# 环境中逐步运行你的应用程序，尝试每一个可用选项。对于每个选项，问问自己用户需要看到什么。实现必要的逻辑以确保这就是用户看到的所有。确保从一个状态到另一个状态的移动是明显且正确的。尝试很多，直到你对成品感到满意。Visual\
  \ C# 环境让执行此类任务变得非常简单。\n\n### 示例 5-4：作者表输入表（应用程序状态）\n\n作者表输入单可以在三种状态之一运行：视图状态、添加状态或编辑状态。在视图状态下，用户可以在记录之间导航、切换到编辑状态、添加和/或删除记录，或退出应用程序。在添加和编辑状态下，不应允许导航，数据可以更改，且用户应该能够访问保存和取消功能。这些状态都可以可以使用按钮的\
  \ `Enabled` 属性和文本框的 `ReadOnly` 属性来实现。我们使用 `TabIndex`（以及 `TabOrder`）来控制文本框控件焦点的切换。我们将使用一个通用方法允许从一个状态切换到另一个状态。\n\
  \n1. 在 Visual C# 环境中打开示例 5-3。我们将修改此示例以包含状态考虑。\n\n2. 通过将所有（八个按钮）的 `TabStop` 属性设置为\
  \ `False`，将按钮从标签页序列中移除。同样将 `txtAuthorID` 文本框的 `TabStop` 设置 `False`（我们不会编辑此值——稍后我们会解释原因）。将\
  \ `txtAuthorName` 的 `TabIndex` 设置为 1，`txtYearBorn` 的 `TabIndex` 设置为 2。\n\n3. 添加一个名为\
  \ `SetState` 的方法，参数为字符串 `appState`。将以下代码添加到 `SetState` 方法中：\n\n```csharp\nprivate\
  \ void SetState(string appState)\n{\n    switch (appState)\n    {\n        case\
  \ \"View\":\n            txtAuthorID.BackColor = Color.White;\n            txtAuthorID.ForeColor\
  \ = Color.Black;\n            txtAuthorName.ReadOnly = true;\n            txtYearBorn.ReadOnly\
  \ = true;\n            btnPrevious.Enabled = true;\n            btnNext.Enabled\
  \ = true;\n            btnAddNew.Enabled = true;\n            btnSave.Enabled =\
  \ false;\n            btnCancel.Enabled = false;\n            btnEdit.Enabled =\
  \ true;\n            btnDelete.Enabled = true;\n            btnDone.Enabled = true;\n\
  \            txtAuthorName.Focus();\n            break;\n        default: // 非 View\
  \ 的添加或编辑\n            txtAuthorID.BackColor = Color.Red;\n            txtAuthorID.ForeColor\
  \ = Color.White;\n            txtAuthorName.ReadOnly = false;\n            txtYearBorn.ReadOnly\
  \ = false;\n            btnPrevious.Enabled = false;\n            btnNext.Enabled\
  \ = false;\n            btnAddNew.Enabled = false;\n            btnSave.Enabled\
  \ = true;\n            btnCancel.Enabled = true;\n            btnEdit.Enabled =\
  \ false;\n            btnDelete.Enabled = false;\n            btnDone.Enabled =\
  \ false;\n            txtAuthorName.Focus();\n            break;\n    }\n}\n```\n\
  \n此代码将应用程序设置为视图、添加或编辑状态。注意哪些按钮是可用的，哪些不是。注意作者 ID 框在添加和编辑状态下是红色的，表示不可更改。注意添加和编辑状态（目前）是相同的，只是对视图状态的切换——这会经常发生——是剪切粘贴代码的地方。我们现在需要修改应用程序代码以使用此方法在状态之间移动。\n\
  \n4. 我们希望在应用程序初始化时处于视图状态。在 `frmAuthors_Load` 事件的底部添加这两行代码：\n\n```csharp\nthis.Show();\n\
  SetState(\"View\");\n```\n\n5. 点击新增按钮时，我们想要切换到添加状态。在 `btnAddNew_Click` 事件方法的顶部添加此行代码：\n\
  \n```csharp\nSetState(\"Add\");\n```\n\n6. 点击编辑按钮时，我们切换到编辑状态。在 `btnEdit_Click` 事件方法的顶部添加此行代码：\n\
  \n```csharp\nSetState(\"Edit\");\n```\n\n7. 在取消或保存操作之后（在添加或编辑状态下），我们想要返回视图状态。在 `btnCancel_Click`\
  \ 和 `btnSave_Click` 事件方法的末尾放置此行：\n\n```csharp\nSetState(\"View\");\n```\n\n删除按钮不需要任何状态更改代码——它只在视图状态下有效，并在删除后保持在该状态。\n\
  \n\n\n\n\n# 8. 我们快要完成了。这是一个很小的更改，但非常重要，它让你的应用程序看起来更加专业。注意，如果你点击 `Previous`（上一个）按钮且指针处于第一条记录，什么都不会发生变化。同样，在数据表的末尾，如果你点击\
  \ `Next`（下一个），什么都不会发生。这种缺乏变化会让用户感到困惑。为了给用户提供他们已达到限制的反馈，我喜欢提供一些听觉反馈。对 `btnPrevious`\
  \ 和 `btnNext` 点击事件方法进行阴影修改，当用户触及限制时播放蜂鸣声：\n\n```csharp\nprivate void btnPrevious_Click(object\
  \ sender, EventArgs e)\n{\n    if (authorsManager.Position == 0)\n    {\n      \
  \  Console.Beep();\n    }\n    authorsManager.Position--;\n}\n\nprivate void btnNext_Click(object\
  \ sender, EventArgs e)\n{\n    if (authorsManager.Position == authorsManager.Count\
  \ - 1)\n    {\n        Console.Beep();\n    }\n    authorsManager.Position++;\n\
  }\n```\n\n# 9. 保存并运行应用程序（保存在 `VCSDB\\Code\\Class 5` 文件夹下的 `Example 5-4` 文件夹）。初始（视图）状态为：\n\
  \n![Image](img/0037.jpeg)\n\n注意当界面表上访问不同功能时，各种按钮的状态是如何变化的。在添加和编辑状态（ID 框为红色），检查两个文本框的\
  \ Tab 顺序（这是一个非常短的 Tab 顺序！）：\n\n![Image](img/00029.jpeg)\n\n在每种状态下，用户都能清楚知道哪些功能是可用的以及何时可用。当你尝试越过数据表开头或结尾的限制时，听到蜂鸣声了吗？\n\
  \n## 示例 5-4\n## 使用 SQL Server 数据库\n对 SQL Server 版本的项目进行相同的更改。\n\n## 条目验证\n在整个数据库工作过程中，你会发现使用\
  \ Visual C# 查看数据库信息是一项易举的任务。然而，当你想要修改数据库中的信息时，事情很快就会变得困难。而且，当你允许用户输入信息时，情况会变得非常困难。这就是为什么，如果可能，不要允许用户输入内容。尽可能使用点点点击类型的控件。\n\
  \n检查用户的输入信息需要你进行编程。你必须确保存入数据库的信息是正确的。检查用户信息有两个步骤：条目验证和输入验证。条目验证与文本框控件相关，检查正确的按键。输入验证与多种控件类型相关，并确保输入和选择符合某些要求。在本节中，我们将处理条目验证。输入验证将在本章的下一节讨论。\n\
  \n如前，条目验证检查正确的按键。例如，如果需要数字输入，则只允许按下数字键。如果不允许空格，就不要允许。如果输入必须是大写字母，则不允许输入小写字母。限制按键被称为“按键拦截”（key\
  \ trapping）。\n\n### 按键拦截\n按键拦截是在文本框控件的 `KeyPress` 事件方法中完成的。此类方法的格式如下（对于名为 `txtExample`\
  \ 的文本框）：\n\n```csharp\nprivate void txtExample_KeyPress(object sender, KeyPressEventArgs\
  \ e)\n{\n}\n```\n\n在此方法中发生的是，每当在相应的文本框中按下按键时，`KeyPressEventArgs` 类都会通过 `char` 类型属性\
  \ `e.KeyChar` 将按下的按键传递给该方法。记住 `char` 类型用于表示单个字符。因此我们可以检查此键。如果它是可接受的按键，我们将 `e.Handled`\
  \ 属性设置为 `False`。这告诉 Visual C# 该方法未被处理，应该允许 `KeyPress`。如果检测到不可接受的按键，我们将 `e.Handled`\
  \ 设置为 `true`。这会“欺骗”Visual C# 让它认为 `KeyPress` 事件已被处理，且按键将被忽略。\n\n我们需要某种方法来区分按了哪些键。通常的字母、数字和字符键很容易检测。为了帮助检测不可读的按键，我们可以检查按键对应的\
  \ Unicode 值。我们将用到的两个值是：\n\n| 定义 | 值 |\n| :--- | :--- |\n| 退格键 (Backspace) | 8 |\n\
  | 回车键 (<Enter> 键) | 13 |\n\n例如，假设我们有一个文本框 (`txtExample`)，我们只想输入数字或小数点。构建按键拦截程序有多种方法。我建议使用一个\
  \ `if` 块，根据 `e.KeyChar` 的不同值采取不同的步骤。如果 `e.KeyChar` 代表数字、小数点或退格键（务必包含退格键，否则用户将无法正常编辑文本框），我们将允许按键（`e.Handled\
  \ = false`）。否则，我们将设置 `e.Handled` 为 `true` 以忽略按键（我们还添加了蜂鸣声）。执行此操作的代码是：\n\n```csharp\n\
  if (e.KeyChar >= '0' && e.KeyChar <= '9')\n{\n    // 数字值\n    e.Handled = false;\n\
  }\nelse if ((int) e.KeyChar == 8)\n{\n    // 退格\n    e.Handled = false;\n}\nelse\
  \ if (e.KeyChar == '.')\n{\n    // 小数点\n    e.Handled = false;\n}\nelse\n{\n   \
  \ // 其他任何字符\n    e.Handled = true;\n}\n```\n\n注意，如果 `e.KeyChar` 是有效的键，我们才允许按键。\n\
  \n## 示例 5-5\n### 作者表单（条目验证）\n在作者表单中，`Year Born` 字段只需要数字。\n\n1. 完成 `Example 5-4`。\n\
  2. 在 `Year Born` 字段中，我们需要包含输入验证。\n3. 使用此代码 `txtBorn_KeyPress` 事件：\n\n```csharp\n\
  private void txtBorn_KeyPress(object sender, KeyPressEventArgs e)\n{\n    if ((e.KeyChar\
  \ >= '0' && e.KeyChar <= '9') || (int) e.KeyChar == 8)\n    {\n        // 允许按键\n\
  \        e.Handled = false;\n    }\n    else\n    {\n        e.Handled = true;\n\
  \        Console.Beep();\n    }\n}\n```\n\n4. 保存并运行应用程序（保存在 `VCSDB\\Code\\Class\
  \ 5` 文件夹下的 `Example 5-5` 文件夹）。点击 `Edit` 切换到编辑状态。点击 `Year Born` 文本框。当你输入错误的键时，听到蜂鸣声了吗？\n\
  \n## 使用 SQL Server 数据库\n对 SQL Server 版本的项目进行相同的更改。\n\n## 输入验证\n在研究示例之前，确保输入值是有效的。一些常见的验证规则如下：\n\
  - 该字段是必填的吗？如果必填字段没有提供输入，可能会产生问题。\n- 输入在既定范围内吗？例如，如果输入 4 月的日期，值是否在 1 到 30 之间？\n-\
  \ 输入长度正确吗？社会安全号码（包括连字符）需要 11 个字符。如果没有检测到 11 个字符，则输入不是有效的社会安全号码。可以使用 C# 的 `Length`\
  \ 属性，也可以使用文本框的 `MaxLength` 属性（限制长度）。\n- 输入是有条件的吗？某些字段只有在填写其他字段时才需要填写。例如，如果用户点击发送另一个地址，你需要确保该地址存在。\n\
  - 输入是主键吗？如果是，且用户有输入能力，我们必须确保它是唯一值。表中的每个主键值必须不同。\n\n所需的输入验证量取决于特定的字段。很多情况下，不需要。你作为程序员，需要检查每个输入字段并回答上述问题：该字段是必填的吗？必须在某个范围内吗？有长度限制吗？是否有条件？任何“是”的回答都需要\
  \ C# 代码来验证。\n\n\n\n\n\n验证代码应该放在哪里？\n\n这实际上取决于你如何实现数据库编辑功能。我们将在第 6 章中详细讨论这个话题。对于我们正在创建的示例，我们将编写一个名为\
  \ `ValidateData` 的通用方法，该方法将在 `Save` 按钮的 `Click` 事件中调用。用户在编辑完成后点击此按钮，这里是检查有效性的绝佳位置。如果违反了任何验证规则，我们不允许执行请求的更改。\n\
  \n我们看到，条目和输入验证需要我们进行一些编程工作。但这是值得的。字段验证确保了我们存入数据库的信息的完整性。我们始终需要维护这种完整性。最后，再次强调一次（你明白这很重要吗）——只要如果你可以消除用户输入——就去这样做吧！\n\
  \n## 示例 5-6：作者表输入表单（输入验证）\n\n如所述，`Year Born`（出生年份）必须经过验证。我们将确保，如果尝试输入（我们不会强制输入年份），该年份的字符数不超过四个，不大于当前年份，且比当前年份早不超过\
  \ 150 年（通过不硬编码最小年份，代码会自动升级）。我们还将确保用户输入了 `Author Name`（作者姓名）。\n\n1. 加载早些完成的示例 5-5。我们将修改此示例以包含输入验证。\n\
  2. 将 `txtYearBorn` 文本框的 `MaxLength` 属性设置为 4。\n3. 添加一个名为 `ValidateData` 的方法，其返回一个\
  \ `Boolean` 参数（如果为 true，则满足了所有验证规则）。添加此代码：\n\n```csharp\nprivate bool ValidateData()\n\
  {\n    string message = \"\";\n    int inputYear, currentYear;\n    bool allOK =\
  \ true;\n\n    // 检查姓名\n    if (txtAuthorName.Text.Trim().Equals(\"\"))\n    {\n\
