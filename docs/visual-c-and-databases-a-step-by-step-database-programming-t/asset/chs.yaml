  \ Visual Basic Windows 应用程序。教程包含了几个详细的计算机项目，供学生构建和尝试。这些项目包括数字猜谜游戏、纸牌游戏、零用钱计算器、绘图程序、州府游戏以及几个像乒乓（Pong）这样的视频游戏。我们还包含了几个大学预备加分项目，包括贷款计算器、投资组合管理器和支票簿平衡器。专为\
