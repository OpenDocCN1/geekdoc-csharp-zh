  \n---\n\n# 2 数据库简介\n\n## 回顾与展望\n\n在上一章中，我们从非常通泛的角度查看了数据库。我们了解到 Visual C# 数据库应用程序的核心部分是\
  \ `ADO .NET` 数据对象。\n\n在本章中，我们将提供关于数据库结构的更多详细信息。我们将使用示例数据库来展示这些的概念。\n\n## 数据库结构与术语\n\
  \n从最简单的术语来说，数据库是信息的集合。这种集合存储在一个或多个表中。\n\n数据库表中的行用于描述相似的项。数据库表中的列提供了记录的特征。这些特征被称为\
  \ `数据库字段`。每个字段包含特定的信息。在定义数据库字段时，你会指定数据类型。某些字段类型包括 `Binary`、`Boolean`、`Counter`、`Double`、`Long`、`Integer`。\n\
  \n这是一个简单的数据库示例：\n\n![Image](img/images)\n\n在这个数据库表中，每个记录代表一个个体。字段（描述符）包括 `ID_No`、`Name`、`Date_of_Birth`、`Height`\
  \ 和 `Weight`。\n\n大多数数据库使用索引允许更快的访问。索引是指向表的排序列表。索引的巧妙之处在于 C# 数据对象处理所有细节。我们只需对想要搜索的字段标记索引。\n\
  \n使用单表的数据库被称为 `平文件数据库`。早期的数据库软件只处理平文件数据库。而且对于简单的应用程序，平文件数据库可能足够。然而，对于大量数据，平文件数据库会变得笨拙并迅速膨大。\n\
  \n## 关系型数据库\n\n大多数数据库由许多表组成。每个表包含一个逻辑分组，拥有自己的记录和字段。当在数据库中使用多个表时，表必须具有共同字段以允许交叉引用。通过共同字段将一个表引用另一个表被称为\
  \ `关系`。此类表格组合被称为 `关系数据库`。\n\n关系型数据库允许我们存储海量数据，且维护需求比同类的平文件数据库更简单。作为一个例子，假设我们有一个列出杂货商店商品的平文件数据库，带有描述每个产品的多个字段（制造商名称、地址、电话...）。如果你有\
  \ 1000 个产品由同一制造商制造，平文件中文件中会有大量重复。而且，如果制造商更改电话号码，你必须在 1000 个处进行更改！在关系型数据库中，你可以使用两个表，一个产品，一个制造商。在产品表中，你只需要有一个制造商\
  \ ID，它与制造商表中的 ID 相对应。然后，如果电话号码变了，你只需要更改制造商表中的一个字段——这节省了大量工作！将数据库表分解为简单表的过程被称为 `数据库归一化`。\n\
  \n关系型数据库表之间的关系通过键建立。`主键`是唯一标识记录的字段，以便从相关表中引用。`外键`是持有标识值以关联存储在其他表中的记录的字段。\n\n当一个表中的一个记录与另一个表中的一个记录链接时，我们说是\
  \ `一对一关系`。当一个表中的一个记录链接另一个表中的多个记录时，我们说是 `一对多关系`。而且，当一个表中的许多记录与另一个表中的许多记录链接时，我们说是\
  \ `多对多关系`。\n\n\n\n\n\n在本课程的前几章节中，我们将使用一个示例 Microsoft Access 数据库。这个关系型数据库（`BooksDB.accdb`）位于随笔记提供的\
  \ `VCSDB\\Databases` 文件夹中。该数据库是一个经典，几代程序员都使用它来理解数据库编程。你将对这个数据库非常熟悉。它是一个关于计算机编程（以及数据库）的书籍数据库。让我们来看看它的关系结构，以说明介绍的许多新概念。\n\
  \n## 使用 SQL Server 数据库\n\n你可能会注意到这里使用的示例（`BooksDB.accdb`）是一个 Microsoft Access 数据库。这些笔记最初是使用\
  \ Access 数据库开发的。如果你倾向于使用 SQL Server 数据库，笔记已经过修改以支持此功能。在笔记的每个章节中，寻找标题为 `Using SQL\
  \ Server Databases` 的部分，以获取该章节所需的特定修改。\n\n要使用 SQL Server 数据库，假设你已经在计算机上安装了 `SQL\
  \ Server`。我们使用的是从微软免费下载的 `SQL Server Express 2014` 版本：\n\n[`www.microsoft.com/en-us/download/details.aspx?id=42299`](https://www.microsoft.com/en-us/download/details.aspx?id=42299)\n\
  \n网站提供了完整的安装说明。请下载 64 位版本。\n\n此外，要使用 SQL Server 数据库，你需要笔记中包含的 Access 数据库的 SQL Server\
  \ 版本。`SQL Server`数据库通过 `.mdf` 文件扩展名来区分。如果感兴趣，这些转换是用另一个名为 `SQL Server Migration Assistant\
  \ for Access` 的微软免费产品创建的。可以在此处找到该产品的信息：\n\n[`www.microsoft.com/en-us/download/details.aspx?id=43690`](https://www.microsoft.com/en-us/download/details.aspx?id=43690)\n\
  \n本章剩余的信息与你选择使用的任何数据库产品无关。\n\n## 示例关系型数据库\n\n书籍（`BooksDB.accdb`）数据库由四个表组成：\n\n*\
  \ `Authors` (6,246 条记录)\n* `Publishers` (727 条记录)\n* `Titles` (8,569 条记录)\n* `Title_Author`\
  \ (16,056 条记录)\n\n当你查看每个表时，请注意这些表是如何作为信息的逻辑分组。检查记录和字段结构。特别注意每个名称中带有“ID”的字段都充当将一个表与另一个表关联的键。\n\
  \n`Authors` 表包含有关数据库中书籍作者的信息。该表有三个 (3) 个字段：`Au_ID`、`Name` 和 `Year_Born`：\n\n![Image](img/00280.jpeg)\n\
  \n数据库中有 6,246 个不同的作者。\n\n`Publishers` 表包含书籍数据库中出版者的信息。该表有十 (10) 个字段：`PubID`、`Name`、`Company_Name`、`Address`、`City`、`State`、`Zip`、`Telephone`、`Fax`\
  \ 和 `Comments`：\n\n![Image](img/00301.jpeg)\n\n数据库中有 727 个不同的出版者。\n\n`Titles` 表包含数据库中每个书籍标题的信息。该表有八\
  \ (8) 个字段：`Title`、`Year_Published`、`ISBN`、`PubID`、`Description`、`Notes`、`Subject`\
  \ 和 `Comments`：\n\n![Image](img/00442.jpeg)\n\n数据库中有 8,569 个不同的书籍标题。\n\n`Title_Author`\
  \ 表包含数据库中书籍标题与作者之间的关联信息。它只有两个字段：`ISBN`（国际标准书号，书店和图书馆用于引用书籍的数字）和 `Au_ID`：\n\n![Image](img/00233.jpeg)\n\
  \n该表中有 16,056 条目。你可能会想——如果数据库中有 8,569 个标题，为什么这个表中的条目几乎是它的两倍呢？答案是许多书籍有多个作者，而此表列出了每个标题的所有作者。\n\
  \n书籍数据库中显然有很多信息！尽管如此，这个示例非常有用，它展示了我们使用 `Visual C#` 可以处理的数据库。它是一个设计良好的数据库，我们可以从中学习。我们将在稍后的章节中讨论数据库设计，因此这里讨论的大部分内容以后将是非常有用的信息。你可能会想——这些数据库表的视图是从哪里来的？它们是使用\
  \ `Microsoft Access` 获取的。再过几章，你就能使用 `Visual C#` 获取此类视图了。\n\n## 示例数据库结构\n\n让我们更仔细地观察书籍数据库。为了帮助，我们将使用这个框图（使用\
  \ `Access` 获取），它阐明了数据库结构：\n\n![Image](img/00464.jpeg)\n\n该图将每个表显示为列出相应字段的独立窗口。表之间的关系通过线性连接来说明。\n\
  \n查看书籍数据库表。注意每个表都是信息的逻辑分组。书籍出版商在一个表（`Publishers`）中，书籍标题在一个表（`Titles`）中，书籍作者在一个表（`Authors`）中。设计良好的数据库具有这样定义良好的表。定义良好的表使得数据库管理成为一项简单得的任务。\n\
  \n注意每个表有两种类型的信息：源数据和关系数据。源数据是实际信息，例如名称、电话和地址。关系数据是通过键对其他表中的数据的引用，例如 `PubID`、`ISBN`\
  \ 和 `Au_ID`。\n\n主键定义了一个唯一的记录。`Publishers` 表中的 `PubID`、`Titles` 表中的 `ISBN` 以及 `Authors`\
  \ 表中的 `Au_ID` 是主键。它们在各自的表中标识唯一的条目。外键是通过键对其他表数据的引用，例如 `PubID`、`ISBN` 和 `Au_ID`。\n\
  \n## 虚拟数据库表\n\n书籍数据库（`BooksDB.accdb`）的主要目的是跟踪书籍标题信息。注意每个表提供关于书籍的部分信息，但要获取书籍的所有信息，我们需要四个表。\n\
  \n使用这四个表的关系数据，我们应该能够获取任何书籍的描述。让我们来看一个例子。这是 `Titles` 表中的一个条目（一条记录）：\n\n| Title |\
  \ 1-2-3 Database Techniques |\n| Year_Published | 1990 |\n| ISBN | 0-8802234-6-4\
  \ |\n| PubID | 45 |\n| Description | 29.95 |\n| Notes | 650.0285536920 |\n| Subject\
  \ | [Blank] |\n| Comments | HF5548.4.L67A52 1989 |\n\n将 `ISBN` 输入 `Title_Author`\
  \ 表将为我们提供这些 `Au_ID` 值：\n\n| Au_ID | 2467, 5265, 5266 |\n\n注意该书有三个作者。在 `Authors`\
  \ 表中使用这些 `Au_ID` 值揭示了作者信息：\n\n| Au_ID=2467 | Author: Stern, Nancy |\n| Year_Born\
  \ | [Blank] |\n| Au_ID=5265 | Author: Weil, Bill |\n| Year_Born | [Blank] |\n| Au_ID=5266\
  \ | Author: Anderson, Dick |\n| Year_Born | [Blank] |\n\n最后一次关系移动使用 `Publishers`\
  \ 表中的 `PubID` 将我们提供有关书籍出版者的完整细节：\n\n| Name | QUE CORP |\n| Company_Name | QUE CORP\
  \ |\n| Address | 11711 N College Ave, Suite 140 |\n| City | Carmel |\n| State |\
  \ IN |\n| Zip | 46032 |\n\n\n\n\n\n| 电话 | [空白] |\n| 传真 | [空白] |\n| 注释 | [空白] |\n\
  \n完成后，我们就了解了关于“1-2-3 Database Techniques”这本书特定书籍的所有信息。我们本质上做的是形成了一个包含单条记录和许多字段的巨大表。这种对数据库数据的新视图被称为虚拟数据库表。它是虚拟的，因为它并不以原生表的形式存在于\
  \ `BooksDB.accdb` 数据库——它是使用四个原生表创建的。\n\n对数据库进行查询创建了上述虚拟表。我们要求数据库告诉我们它关于“1-2-3 Database\
  \ Techniques”这本书的所有信息。数据库做出了响应（实际上，是我们自己完成了这些工作），提供了来自其四个表的所有信息。这是数据库管理系统中一项非常常见的任务，也是我们在本课程中经常要做的：查询数据库。对数据库的每次查询都会形成一个包含我们查询结果的虚拟表。我们的查询不会像这里执行的那样全面（显示所有内容！）。通常，查询会请求符合某些特定标准的所有记录。例如，我们可能想查询书籍数据库，显示特定公司出版的所有书籍。此查询的结果将在虚拟表中返回。\n\
  \n数据库查询使用一种名为 `SQL`（结构化查询语言）的特定语言进行。我们将在后面的章节学习 `SQL`。现在，请记住 `SQL` 可以从数据库形成虚拟表。这些表向我们展示数据库中感兴趣的信息。并且，使用\
  \ Visual C# 作为前端，使用 `SQL` 进行查询是非常简单的。我们构建查询并传递给数据对象，这些对象为我们完成所有工作，返回查询请求的所有记录。这就像魔法一样！在前几章中，我们将执行这些工作——打开书籍数据库并形成我们可以查看的虚拟表。\n\
  \n# 创建数据库\n\n在离开这个数据库介绍之前，你可能在问自己——像书籍数据库这样的数据库是如何创建的？表是如何定义的？字段是如何定义的？记录是如何创建的？\n\
  \n数据库是使用 Access、Oracle、Microsoft SQL Server 等商业应用程序创建的。这些产品中的每一个都有一个设计模式，你可以在其中定义表以及作为表一部分字段。你还可以使用这些应用程序向表中输入记录。书籍数据库是用\
  \ Access 构建的。在课程的第一部分，我们将与现有数据库一起工作，而不会涉及创建数据库。\n\n后面的章节将讨论适当的数据库设计和数据库的创建。如果你有\
  \ Access 并知道如何使用它，那么在创建数据库的时候，你也可以使用它。我们将在课程的以后讨论其他可能性，包括使用 Visual C# 创建数据库。\n\n\
  ### 总结\n\n在本章中，我们查看了第一个数据库——包含在这些课程笔记中的书籍数据库 (`BooksDB.accdb`)。我们学习了关系型数据库的结构，讨论了表、记录和字段。图中说明了使用主键和外键的关系。\n\
  \n引入了虚拟表的概念。查询数据库会形成虚拟表。在下一章中，我们将开始学习如何使用 Visual C# 连接数据库并处理查询以形成此类虚拟表。\n\n3\n\n\
  # 数据库连接\n\n## 复习与预览\n\n到目前，我们已经查看了数据库及其结构。我们已经看到数据对象在数据库和 Visual C#“前端”之间工作以管理数据库。\n\
  \n在本章中，我们第一次使用 Visual C# 连接到数据库。此连接是使用我们一直提到的数据对象建立的。使用数据绑定控件结合数据对象，将允许我们查看数据库中的信息。\n\
  \n## 数据对象概览\n\nVisual C# 提供了几个对象，允许与数据库进行交互。这些对象属于五大类之一：\n\n> ⇒ 连接对象（Connections）允许程序连接到数据库\n\
  > ⇒ 数据容器（Data containers）在数据从数据库加载后存储数据。\n> ⇒ 数据适配器（Data adapters）在数据库和容器之间移动数据\n\
  > ⇒ 命令对象（Command objects）允许对数据进行操作\n> ⇒ 导航对象（Navigation objects）允许用户移动数据（并也可以修改数据）\n\
  \n某些对象（数据容器、数据适配器、导航对象）在本质上是通用的，适用于任何类型的数据库。\n\n连接对象和命令对象特定于所使用的数据库类型。Visual C#\
  \ 提供了与对象链接和嵌入数据库 (OLE DB)、SQL Server（包括 Microsoft Data Engine (MSDE)）、开放数据库连接 (ODBC)\
  \ 和 Oracle 数据库协同工作的对象。如果你现在不理解所有这些，不要担心。在这些笔记中，我们将与 Access 数据库 (OLE DB) 和 SQL Server\
  \ 数据库一起。在最后一章，我们将查看连接到其他数据库。\n\n我们将详细查看每个数据对象。随着我们对这些对象的讨论进行，我们将使用 Visual C# 逐步打开并查看书籍数据库中的项目。\n\
  \n## 连接对象\n\n连接对象在你的应用程序和数据库之间建立连接。\n\n![图像](img/00344.jpeg)\n\n如所述，Visual C# 支持多种数据库类型。因此，它提供了几种不同的连接对象：`OleDbConnection`、`SqlConnection`、`OdbcConnection`、`OracleConnection`。\n\
  \n连接对象属性：\n\n| 属性 | 描述 |\n| :--- | :--- |\n| `ConnectionString` | 包含建立数据库连接所需的信息。\
  \ |\n| `Database` | 当前数据库名称。 |\n| `DataSource` | 当前数据库文件名。 |\n| `State` | 当前连接状态（Closed,\
  \ Connecting, Open, Executing, Fetching, Broken） |\n\n连接对象方法：\n\n| 方法 | 描述 |\n|\
  \ :--- | :--- |\n| `Open` | 打开连接。 |\n| `Close` | 关闭连接。 |\n| `Dispose` | 释放连接对象。\
  \ |\n\n### 连接对象 - Access \n\n要使用 `OleDbConnection` 对象和其他 OLE 数据库对象，应用程序必须在代码顶部具有此行：\n\
  \n```csharp\nusing System.Data.OleDb;\n```\n\n我们在类中构建的每个 Access 示例都有此行。要使用名为 `myConnectionString`\
  \ 的连接字符串声明并构造名为 `myConnection` 的 `OleDbConnection` 对象，使用：\n\n```csharp\nOleDbConnection\
  \ myConnection;\nmyConnection = new OleDbConnection(myConnectionString);\n```\n\n\
  Access 数据库的连接字符串是：\n\n`Provider=Microsoft.ACE.OLEDB.12.0; Data Source = DatabaseName`\n\
  \n其中 `DatabaseName` 是数据库的完整路径。\n\n我们将开始查看第二章中讨论书籍数据库 (`BooksDB.accdb`)。该数据库位于 `VCSDB\\\
  Databases` 目录。制作数据库的副本并将其放在工作目录（由你决定名称——我们将使用 `VCSDB\\Working`）。我们这样做是为了确保计算机上始终有一个有效的\
  \ `BooksDB.accdb` 副本。你会发现 Visual C# 的威力可能会对数据库造成损害（当然，我们会尽量减少这种可能性）。所以，我们遵循格言，“防患未然”。\n\
  \n### Access 数据库与 64 位操作系统\n\n笔记中使用的 Access 数据库仅适用于 32 位操作系统。如果你使用的是 64 位版本的 Visual\
  \ Studio，你需要对构建的每个项目进行更改。\n\n遵循以下步骤：\n\n> ➢ 项目构建后，选择项目（Project）菜单项，并选择你的项目属性（Properties）。\n\
  > ➢ 在弹出的窗口中，选择生成（Build）选项卡。\n> ➢ 在“平台目标”（Platform target）下，确保选择的是 `x86` 而不是 `AnyCPU`。更改后的窗口应如下所示：\n\
  \n> ![图像](img/00294.jpeg)\n\n> ➢ 关闭窗口以完成更改。\n\n\n\n\n\n你如何知道自己是否遇到了操作系统问题？第一个症状是你的应用程序没有显示任何数据，这表明数据库没有正确打开。其次，`Immediate\
  \ Window`立即窗口）将出现此错误消息：\n\nAn unhandled exception of type 'System.InvalidOperationException'\
  \ occurred in System.Data.dll\n\n或者在打开数据库时，你可能会看到此窗口：\n\n![Image](img/00354.jpeg)\n\
  \n如果你看到此类症状，请对项目的属性进行上述注意事项修正。\n\n## Connection 对象 - SQL Server 数据库\n\n要使用 `SqlConnection`\
  \ 对象，应用程序必须在相应代码列表的顶部包含此行：\n\n```csharp\nusing System.Data.SqlClient;\n```\n\n我们在该类中构建的每个\
  \ SQL Server 示例都应该包含此行。\n\n要声明并构造名为 `myConnection` 的 `SqlConnection` 对象，使用名为 `myConnectionString`\
