  \ sender, EventArgs e)\n{\n    OleDbCommand resultsCommand = null;\n    OleDbDataAdapter\
  \ resultsAdapter = new OleDbDataAdapter();\n    DataTable resultsTable = new DataTable();\n\
  \    try\n    {\n        // 建立命令对象和数据适配器\n        resultsCommand = new OleDbCommand(txtSQLTester.Text,\
