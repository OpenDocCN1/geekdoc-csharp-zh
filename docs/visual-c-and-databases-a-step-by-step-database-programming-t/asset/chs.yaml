  \ `OleDbDataAdapter` 实例替换为 `SqlDataAdapter`。\n\n### 查看作者选择\n\n我们的快速示例显示，我们需要在 `Titles`\
  \ 输入表单上处理多达四个作者。但注意，书籍数据库的 `Titles` 表没有作者信息。因此，如果我们在 `Titles` 输入表单上输入作者，我们该如何处理这些信息呢？我们需要某种方式将\
  \ `Titles` 表（通过 `ISBN` 字段）连接到 `Title_Author` 表（匹配 `ISBN` 和 `Au_ID`），再连接到 `Authors`\
  \ 表（该表包含作者信息，特别是 `Author`）。\n\n也许，真正的 SQL 专家可以构建一个查询，让 `Titles` 输入表单显示所有书籍标题信息以及相应的作者。这样，所有的数据库管理任务都将通过数据库引擎自动化。但我并不是\
  \ SQL 专家，我不知道怎么做。在这里，我们将利用 Visual C# 编程技能使用一种更具临时性的方法来开发解决方案。我们将缓慢进行，分小步走。\n\n用户的基本需求是为\
  \ `Titles` 表中的每个标题提供多达四个作者识别号（`Au_ID` 字段）。这些值将与 `Title_Author` 表中相应的标题 `ISBN` 字段匹配。就像我们在此示例早之前添加的\
  \ `Publisher` 信息一样，我们不期望用户知道特定作者的识别号，但我们期望他或她知道作者的名字。因此，使用数据绑定的组合框（列出作者名供选择）似乎是一个很好的开始。\n\
  \n#### 步骤\n\n1. 重新打开我们一直在工作的 `BOOKS` DBMS 应用程序（示例 6-9）。打开 `Titles` 表单。在表单上添加四个 label\
