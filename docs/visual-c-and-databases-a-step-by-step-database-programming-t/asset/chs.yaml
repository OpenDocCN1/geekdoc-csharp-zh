  \    {\n        SetState(\"Add\");\n    }\n    catch (Exception ex)\n    {\n   \
  \     MessageBox.Show(\"Error adding record.\", \"Error\", MessageBoxButtons.OK,\
  \ MessageBoxIcon.Error);\n    }\n}\n\nprivate void btnSave_Click(object sender,\
