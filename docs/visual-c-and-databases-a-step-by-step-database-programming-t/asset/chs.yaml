  \n### 在示例中使用 SQL Server 数据库\n\n在本章的两个示例中，我们构建了一个用于 Access 数据库的，另一个用于 SQL Server\
  \ 数据库的。我认为你也会认同，构建每种应用程序并没有太大区别。\n\n在未来的章节和示例 3-3 中，我们将只构建每个示例的 Access 版本，并为你提供将示例适配到\
  \ SQL Server 数据库所需的少数步骤。请查看每个示例末尾标题为 `Using SQL Server Databases` 的区域。\n\n### 总结\n\
  \n在本章中，我们终于使用 Visual C# 连接到实际数据库（包括 Access 和 SQL Server 版本）。我们使用了几个 ADO .NET 数据对象，通过数据绑定控件连接并查看了书籍数据库中的\
  \ `Titles` 表。\n\n使用的对象有：\n\n| Connection Object | Description |\n| :--- | :--- |\n\
  | Connection Object | 形成到数据库的连接。 |\n| Command Object | 形成 SQL 查询以从数据库检索数据表。 |\n\
  | Data Adapter Object | 使用命令对象在数据库和数据表之间传输数据。 |\n| Data Table Object | 存储由数据适配器对象检索的数据表。\
  \ |\n| Data Bound Controls | “绑定”到数据表对象字段的控件。 |\n| Currency Manager Object | 管理绑定到数据表的控件。同时提供导航和编辑功能。\
  \ |\n\n我们查看了 Visual C# 数据向导。该向导适用于数据库应用程序的快速原型设计，但它在分发方面的缺乏灵活性使其不适合我们此处的工作。\n\n\
  即使在做了做了所有这些工作之后，目前我们能做的只是查看数据库表，这在某些应用程序中已经足够了（想一下你的当地图书馆——他们显然不希望顾客更改数据库中的信息）。要构建一个完整的数据库管理系统，我们需要了解\
  \ SQL，这种数据库查询背后的强大语言。将在下一章中讨论。\n\n如果你对目前呈现的所有材料感到压力很大，不要担心——当你继续这门课程并成为更熟练的数据库程序员时，你会更多地看到它们。\n\
  \n### 示例 3-3：Northwind Traders 数据库\n\n这些笔记包含第二个示例数据库。Access 版本是 `NWIND.MDB`，位于 `VCSDB\\\
  Databases` 文件夹中。该数据库由一家虚拟公司（Northwind Traders）使用。它有八张表。在这次练习中，我们重复示例 3-1 的任务，使用该数据库中的一个表（`Customers`）。执行此操作的\
  \ SQL 语句（用于 `command object`）是：\n\n```sql\nSelect * from Customers\n```\n\n这个示例让你进一步练习使用\
