  \n# 课程描述\n\nVisual C# and Databases 这一教程详细介绍了如何使用 Visual C# 访问和维护数据库。涵盖的主题包括数据库结构、数据库设计、Visual\
  \ C# 项目构建、`ADO .NET` 数据对象、数据绑定控件、界面设计、结构化查询语言 (`SQL`) 以及数据库报告。\n\nVisual C# and\
  \ Databases 通过超过 850 页课程笔记和实际的 Visual C# 示例进行呈现。假设读者没有数据库经验。然而，假设课程读者熟悉 Visual C#\
  \ 环境以及构建 Visual C# 应用程序的步骤。\n\n# 课程先决条件\n\n为了掌握 Visual C# and Databases 中介绍的概念，你应该具备微软\
