  \"))\n    {\n        inputYear = Convert.ToInt32(txtYearBorn.Text);\n        currentYear\
  \ = DateTime.Now.Year;\n        if (inputYear > currentYear || inputYear < currentYear\
  \ - 150)\n        {\n            message += \"Year born must be between \" +\n \
