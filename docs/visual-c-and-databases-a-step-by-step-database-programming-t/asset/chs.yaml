  \ 的内容并将其放入 `string2` 中，从位置 `p` 开始。结果在字符串 `s` 中返回。它用于将字符串定位在指定的列中。\n\n### 6. 保存并运行应用程序（你可能需要一个数据库的干净副本来操作）。输入订单并打印它们。这里是打印发票的顶部：\n\
