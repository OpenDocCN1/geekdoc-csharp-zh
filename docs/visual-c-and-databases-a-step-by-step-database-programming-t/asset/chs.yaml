  \\authors.chm\";\n        // connect to books database\n        booksConnection\
  \ = new\n        OleDbConnection(\"Provider=Microsoft.ACE.OLEDB.12.0; Data\n   \
  \     Source = c:\\\\VCSDB\\\\Working\\\\BooksDB.accdb\");\n        booksConnection.Open();\n\
  \        // establish command object\n    }\n}\n```\n\n7. 在表单上添加一个按钮。分配 `Text` 为\
