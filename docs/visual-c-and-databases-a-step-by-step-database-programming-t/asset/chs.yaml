  \                tempLH = temp;\n            if (temp < tempLL)\n              \
  \  tempLL = temp;\n            sumL += temp;\n            nL++;\n            sxL\
  \ += x;\n            sx2L += x * x;\n            sxyL += x * temp;\n        }\n\
  \        else\n        {\n            lowTemp[x - xStart] = -1000.0F;\n        }\n\
  \    }\n\n    if (tempLL >= tempHH)\n        noData = true;\n    else\n        noData\
  \ = false;\n\n    if (!noData)\n    {\n        lblTHH.Text = String.Format(\"{0:f1}\"\
  , tempHH);\n        lblTHL.Text = String.Format(\"{0:f1}\", tempHL);\n        lblTLH.Text\
  \ = String.Format(\"{0:f1}\", tempLH);\n        lblTLL.Text = String.Format(\"{0:f1}\"\
  , tempLL);\n        if (nH > 1)\n        {\n            a1H = Convert.ToSingle((nH\
  \ * sxyH - sxH * sumH) / (nH * sx2H - sxH * sxH));\n            if (a1H >= 0)\n\
  \                lblTHT.Text = \"+\" + String.Format(\"{0:f1}\", (nDays - 1) * a1H);\n\
  \            else\n                lblTHT.Text = String.Format(\"{0:f1}\", (nDays\
  \ - 1) * a1H);\n        }\n        if (nL > 1)\n        {\n            a1L = Convert.ToSingle((nL\
  \ * sxyL - sxL * sumL) / (nL * sx2L - sxL * sxL));\n            if (a1L >= 0)\n\
