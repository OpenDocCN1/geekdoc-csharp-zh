  \n![Image](img/00295.jpeg)\n\n## 示例 3-3 使用 SQL Server 数据库\n\nSQL Server 版本示例的差异：\n\
  \n1. Northwind 数据库的 SQL Server 版本（`WindDB.mdf`）可以从我们的网站下载，如第 2 节所示，或者如果你有这些笔记的 CD-光\
  \ 光，它也位于 `VCSDB\\Databases` 文件夹中。将 `WindDB.mdf` 复制到你的工作目录。\n2. 使用\n```csharp\nusing\
  \ System.Data.SqlClient;\n```\n3. 使用这些语句声明对象：\n```csharp\nSqlConnection NWindConnection;\n\
  SqlCommand customersCommand;\nSqlDataAdapter customersAdapter;\n```\n4. 在 `frmCustomers_Load`\
  \ 方法中，使用此连接对象：\n```csharp\nNWindConnection = new SqlConnection(\"Data Source=.\\\
  \\SQLEXPRESS;AttachDb=c:\\\\VCSDB\\\\Working\\\\WindDB.mdf;Integrated Security=True;Connect\
  \ Timeout=30;\");\n```\n\n## 使用 SQL 进行查询：回顾与预览\n\n在学习的这一阶段，我们可以查看数据库包含的任何表（原生表）。任何数据库管理系统的一个强大功能是能够形成数据的任何视图。本章将讨论虚拟表的形成。\n\
  \n虚拟数据视图是通过查询数据库获得的。用于此类查询的语言是结构化查询语言，或 `SQL`。在本章中，我们将学习如何使用 `SQL` 从数据库中提取信息。注意，`SQL`\
  \ 不仅用于 Visual# 应用程序。它是数据库查询的标准语言，因此在这里学到的知识可以转移到其他管理系统。\n\n### SQL 背景\n\n`SQL` 于\
  \ 20 世纪 70 年代初在 IBM 开发，与 E. F. Codd 开发的关系数据库理论同时出现。`SQL` 继承了之前一种名为 SEQUEL 的数据库语言。正因如此，许多程序员将\
  \ `SQL` 读作“sequel”。正确的发音是“ess-que-ell”。\n\n`SQL` 是一组语句，用于告诉数据库引擎（例如带有 Visual# 的\
  \ ADO .NET）用户想要什么信息。引擎随后处理该语句集以提供信息。`SQL` 语句分为两类：数据操纵语言 (`DML`) 和数据定义语言 (`DDL`)。`DDL`\
  \ 语句可定义表、索引和关系。`DML` 语句用于对数据进行选择、排序和计算。\n\n`SQL` 已被采用 ANSI（美国国家标准协会）标准。这意味着有一套被每个数据库管理系统识别的既定\
  \ `SQL` 语句。然而，尽管有了这个标准，每个制造商都添加了自己的“方言”。在这些笔记中，我们将使用 Microsoft SQL。当语句或函数不符合 ANSI\
  \ 标准时，将向读者指出。\n\n### SQL 基础\n\n`SQL` 可与任何数据库管理系统配合。在这里学习的内容将帮助任何数据库程序员。`SQL` 是一组包含约\
  \ 30 条用于数据库管理任务的语句。要查询数据库，我们形成一个 `SQL` 语句。语句是由 `SQL` 关键字和其他信息（如数据库表名和字段名）组成的字符串。该语句告诉数据库引擎我们想要从数据库中获取什么信息。你不需要告诉数据库引擎如何获取信息——它会为你完成所有工作！\n\
  \n#### SQL 语句可以完成什么？\n\n- 排序记录\n- 选择字段\n- 选择记录\n- 交叉引用表\n- 执行计算\n- 为数据库报告提供数据\n\
  - 修改数据\n\n尽管我们还不知道 `SQL` 语句看起来像什么样，但我们需要对如何构造此类语句设置一些规则。然后，我们将查看如何在 Visual# 应用程序中使用\
  \ `SQL` 语句。\n\n`SQL` 语句中的所有 `SQL` 关键字都将用大写字母输入。尽管 `SQL` 是不区分大小写的，但这是一个良好的编程习惯，并允许我们（以及其他人）区分\
  \ `SQL` 语句中的关键字和其他信息。\n\n`SQL` 使用 `row`（行）一词来指代数据库记录，`column`（列）一词来指代数据库字段。这在本课程中不会涉及，但如果你阅读其他关于\
  \ `SQL` 的书籍，就应该意识到这种区别。\n\n嵌入在 `SQL` 语句中的字符串信息可以用双引号（`\"`）或单引号（`'`）括起来。在 Visual#\
  \ 中，你应该使用单引号来包围嵌入字符串。因为 `SQL` 语句本身是一个字符串——所以在 Visual# 代码中，`SQL` 语句必须用双引号包围。为了避免混淆，我们使用单引号包围嵌入字符串。\n\
  \n`SQL` 支持使用通配符形成数据视图。在这里使用 Microsoft 通配符，星号（`*`）。通配符的使用将在许多示例中说明。ANSI 标准 `SQL`\
  \ 使用百分号（`%`）作为通配符。\n\n如果表或字段名有空格，必须用括号（`[]`）括起来。例如，如果表名为 `My Big Table`，在 `SQL`\
  \ 语句中使用：\n`[My Big Table]`\n\n这种表示在某些 `SQL` 实现中是不允许的。在不支持的实现中，表和字段名不允许空格，因此这不应该是问题。一个经验法则是尽可能避免表和字段名中的空格。\n\
  \n要在 `SQL` 语句中引用特定表中的特定字段，使用点表示法：\n`TableName.FieldName`\n\n如果表名或字段名有空格，必须用括号括起来。再次，尽可能避免空格。\n\
  \n现在，我们准备好开始形成 `SQL` 语句并在 Visual# 应用程序中使用它们了。一个警告——`SQL` 是获取和修改数据库数据的非常强大的工具，但它也可能极具破坏性——一条\
  \ `SQL` 语句就可以删除整个数据库！所以，要小心，并始终对这种潜在的破坏提供保护措施。\n\n### SQL 在 Visual# 中的位置\n\n在第 3\
  \ 章中，我们使用单个 `SQL` 语句查看书籍数据库中 `Titles` 表的一些字段。`SQL` 语句被用于形成命令对象（基于连接对象），该命令对象随后被数据适配器对象用于形成数据表。然后该数据表可以使用数据绑定控件进行查看。\n\
  \n处理 `SQL` 语句涉及的代码（假设所有对象都已正确声明）：\n\n**访问数据库：**\n\n```csharp\nmyCommand = new OleDbCommand(mySQL,\
  \ myConnection);\nmyAdapter.SelectCommand = myCommand;\nmyAdapter.Fill(myTable);\n\
  ```\n\n\n\n\n\n# SQL Server 数据库\n\n```csharp\nmyCommand = new SqlCommand(mySQL,\
  \ myConnection);\nmyAdapter.SelectCommand = myCommand;\nmyAdapter.Fill(myTable);\n\
  ```\n\n在此代码中，`mySQL` 是作用于连接对象 `myConnection` 的 SQL 语句（假设该连接对象已针对数据库打开）。生成的命令对象 `myCommand`\
  \ 由数据适配器 `myAdapter` 用来形成数据表 `myTable`。该表随后将用于数据绑定。\n\n从 SQL 查询中一个我们感兴趣的结果是返回的记录数（如果有的话）。形成的数据表在以下属性中包含了该信息：\n\
  \n`myTable.Rows.Count`\n\n## 示例 4-1 SQL 测试器\n\n现在，我们已经了解了 SQL 语句的一些规则和语法，以及如何在 Visual\
