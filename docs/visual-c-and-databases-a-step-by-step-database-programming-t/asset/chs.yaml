  \n\n\n\n与 `Access` 示例一样，如果需要，此时可以向表中添加值。你将使用在前面的章节中讨论的数据对象。一旦创建了这些对象，你就可以通过编程向表中添加行并更新数据库。我们在这里不会填充表，这将在第\
  \ 10 章的示例中完成。\n\n## 示例 9-4\n### 使用 Visual C# 创建 SQL Server 数据库\n\n也可以使用 Visual C#\
  \ 创建 SQL Server 数据库。过程涉及执行 SQL 语句来完成开发中的每一步：\n\n* 创建数据库\n* 创建表\n* 为表添加字段\n* 为表定义主键\n\
  * 为表定义索引\n* 定义表之间的关系\n\n在本示例中，我们将执行第一步——创建一个 SQL Server 数据库。其余步骤涉及一些相当复杂的 SQL 语句，超出了本课程的范围。我们建议读者参考\
  \ SQL 参考（以及互联网）以获取更多信息。\n\n1. 在 Visual C# 中启动新项目。该项目将有一个按钮（`Name` 属性为 `btnCreate`，`Text`\
  \ 属性为 `Create Database`）。我们只需在 `btnCreate_Click` 事件过程中编写代码来创建数据库。我的表单看起来所示：\n\n\
  ![Image](img/00106.jpeg)\n\n2. 进入你的项目代码窗口并添加通常行：\n\n```cs\nusing System.Data.SqlClient;\n\
  ```\n\n3. 将此代码添加到 `btnCreate_Click` 事件过程中：\n\n```cs\nprivate void btnCreate_Click(object\
  \ sender, EventArgs e)\n{\n    SQLConnection myConnection = new\n    SqlConnection(\"\
  Server=.\\SQLEXPRESS; Trusted_Connection=Yes\");\n    SQLCommand myCommand = new\
  \ SqlCommand(\"CREATE DATABASE SQLDatabase\", myConnection);\n    myConnection.Open();\n\
  \    myCommand.ExecuteNonQuery();\n    myConnection.Close()\n}\n```\n\n这会在你的 SQL\
  \ Server 实例上创建一个名为 `SQLDatabase.mdf` 的空数据库（在我的电脑上名为 `.\\SQLEXPRESS`）。该数据库通过执行以下\
  \ SQL 命令来创建：\n\n```sql\nCREATE DATABASE SQLDatabase\n```\n\n针对打开的连接对象 `myConnection`\
  \ 执行。\n\n4. 保存应用程序并运行它。点击 `Create Database`。如果没有错误，数据库就创建了。但是，数据库在哪里呢？\n\n新创建的数据库位于你的\
  \ SQL Server 实例上。启动一个新的 Visual C# 项目。点击 `View` 菜单并选择 `Server Explorer`。你应该看到：\n\n\
  ![Image](img/00126.jpeg)\n\n右键点击 `Data Connections` 并选择 `Add Connection`。出现此表单：\n\
  \n![Image](img/00163.jpeg)\n\n输入显示的项目（使用你的服务器名称）并点击 `OK`。\n\n在 `Server Explorer`\
  \ 中，你现在将看到：\n\n![Image](img/00378.jpeg)\n\n`Data Connections` 下列出了 `SQLDatabase`。这是一个没有表的空数据库。如所述，添加表、字段和关系需要针对连接对象执行额外的\
  \ SQL 语句。我们在这里不会涵盖此类语句。\n\n如果你继续使用 Visual C# 开发 SQL Server 数据库，请注意当你再次运行应用程序时，你可能会收到类似这样的错误消息：\n\
  \n![Image](img/00336.jpeg)\n\n如果选定的名称已经存在，则无法创建数据库。我们已经有一个名为 `SQLDatabase` 的数据库，所以不能再次创建它。在设计新数据库时，这是一个持续出现的问题。在尝试某些更改之前，你必须记住删除旧版本。这种删除可以通过在\
  \ Server Management 工具中右键点击数据库并选择 `Delete` 来完成。\n\n## 数据库设计完善\n\n数据库设计已经完成，数据库已经构建（使用讨论的两种方法之一）。在构建数据库管理系统（当然是使用\
  \ `Visual C#`）之前，你应该重新检查你的数据库设计。这将使任何缺陷一目易见。\n\n你应该检查的内容包括：\n\n* 字段类型是否正确？\n* 文本字段长度是否足够？是否太长？\n\
  * 是否有缺失字段？\n* 是否需要额外的字段？\n\n你可能会发现需要重新设计你的数据库。是的，你可能需要重新开始。数据库结构通常是永久的，不能轻易更改。但在你构建完整的管理系统来配合它之前，现在修改数据库要比在开发道路的后期进行更改容易得多。\n\
  \n### 总结\n\n在本章中，我们讨论了为用于数据库管理系统设计良好的数据库的几个步骤（例如在第 6 章构建、在第 7 章修改的那个）。设计数据库的主要考虑因素是完备、详尽和准确。稍后修改数据库项目可能是一项巨大的工程。\n\
  \n我们检查了使用 `Access` 和 Visual C# 的 `ADOX` 库构建 `Access` 数据库的方法。还涵盖了使用 `Server Explorer`\
  \ 构建 SQL Server 数据库。构建的空数据库可以连接到 Visual Basic 前端接口，形成一个完整的数据库管理系统。在下一章中，我们将查看三个正是此要求的案例研究。\n\
  \n10 个示例数据库项目\n\n## 复习与预览\n\n我们已经完成了对使用 Visual C# 进行数据库编程的介绍（一个很长的介绍）。我们学习了数据库结构、恰当的界面设计、数据库管理技术、数据库报告以及如何创建数据库。\n\
  \n在本章中，我们将把所有的技能付诸实践，查看一些示例项目。这些项目是典型的数据库应用程序。所研究的应用程序是使用第 9 章刚刚构建的 `KWSALES` 数据库的程序、一个家庭库存跟踪系统和一个天气监控器。\n\
  \n### 数据库项目概述\n\n我们在本章中构建三个项目。第一个是针对上一章构建的 `KWSALES` 数据库的销售表单。第二个应用程序允许用户跟踪家庭或其他地点的物品，供保险用途。最后一个应用程序是记录并绘制随时间变化的温度程序。\n\
  \n每个项目都将分阶段构建。每个阶段遵循的步骤都有详细说明。这将让你了解如何使用 Visual C# 构建数据库管理系统。Visual C# 是构建应用程序的理想环境。还提供了改进每个应用程序的建议。\n\
  \n另一个建议——在构建应用程序时，在开始之前为你的数据库创建一个副本。开发项目时会出现很多错误，你不希望这些错误破坏所需的数据。因此，始终使用数据库的副本进行构建。当你确定项目运行正常后，可以使用“干净”的副本。\n\
  \n## 示例 10-1\n### 订单项目\n\n在第 9 章中，我们构建了一个类似于我们公司（KIDware）用于跟踪订单和销售的数据库。在本应用程序中，我们为该数据库构建\
  \ Visual C# 界面。该界面将用于向数据库输入新订单。\n\n订单表应允许向数据库输入以下信息：\n\n* 订单 ID\n* 订单日期\n* 客户 ID\n\
  * 客户姓名和姓氏\n* 客户地址信息\n* 产品订单信息\n\n在开始此项目之前，我们建议快速复习第 9 章，以熟悉 `KWSALES` 数据库的结构。\n\n\
  ### 准备工作\n\n\n\n\n我们将通过开发提交订单或退出程序的能力开始此项目。订单提交功能目前不会编写代码，但将开始编写访问接口。\n\n### 1.\
