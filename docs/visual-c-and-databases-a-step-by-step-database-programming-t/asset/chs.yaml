  ## 使用 Visual C# 编程游戏\n\nProgramming Games with Visual C#® 是一学期学期的“中级”编程教程，由 10 章节组成，用简单、易于懂的术语解释了如何构建\
  \ Visual C# 视频游戏。所构建的游戏是非暴力的、适合家庭的，并且了逻辑思维能力。学生将学习如何编写以下 Visual C# 视频游戏：保险箱破解者（Safecracker）、井井棋（Tic\
  \ Tac Toe）、匹配游戏（Match Game）、披萨交付（Pizza Delivery）、登月（Moon Landing）和跳青蛙（Leap Frog）。这个中级自学教程可以在家里或学校使用。教程对儿童来说足够简单，对初成年人来说也足够有趣。\n\
