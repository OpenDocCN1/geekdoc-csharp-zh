  \n## 示例 6-9：使用 SQL Server 数据库\n\n对示例 6-8 的 SQL Server 版本应用指定的修改，确保：\n- 将所有的 `OleDbCommand`\
  \ 实例更改为 `SqlCommand`\n- 将所有的 `OleDbDataAdapter` 实例更改为 `SqlDataAdapter`\n- 将所有的 `OleDbCommandBuilder`\
  \ 实例更改为 `SqlCommandBuilder`\n\n### 总结\n\n在本章中，你构建了一个非常大的应用程序。你学习了如何在单表和多表数据库中编辑、添加和删除记录。你学习了如何找到感兴趣的记录。你构建的书籍数据库管理系统在功能性上可以与中型商业应用程序媲美。如果你完成了这个详细的示例，恭喜你。\n\
  \n在本章中，你了解到，尽管构建数据库管理系统是一个漫长且详细的过程，但它相对简单。实现任何数据库管理任务都有一套固定的方法。Visual C# 环境由于其事件驱动的特性，允许我们分阶段构建应用程序。这种能力允许我们构建应用程序的一部分，对其进行测试，然后继续。不需要在测试之前构建整个应用程序。\n\
  \n我们的数据库学习中剩余的话题是数据库报告、应用程序分发和数据库设计。在课程的后期，我们将构建三个完整的数据库项目。\n\n# 第 7 章：数据库报告\n\n\
  ## 复习与预览\n\n我们已经看到，使用 ADO .NET 数据对象结合 Visual C# 可以允许我们构建一个稳健、运行良好的数据库管理系统。我们能够在任何数据库中编辑、添加、删除和/或查找记录。\n\
  \n一旦你费尽精力管理了数据库，能够从你的数据中获取打印或显示的信息将是一件很好的事。获取此类信息的媒介被称为数据库报告。在本章中，我们将查看如何使用 Visual\
  \ C# 代码获取数据库报告。\n\n### PrintDocument 对象\n\n用户期望能够获得数据库中包含信息的打印副本。这些信息以数据库报告的形式存在。生成报告是一项简单的任务。你只需要确定你想在报告中包含哪些信息，以及你希望如何呈现它们。我们将查看使用\
  \ Visual C# 的 `PrintDocument` 对象来制作数据库报告。用于打印的对象位于 `Drawing.Printing` 命名空间中。对于任何带有打印功能的应用程序，在代码窗口顶部添加此使用声明：\n\
  \n```csharp\nusing System.Drawing.Printing;\n```\n\nVisual C# 的 `PrintDocument`\
  \ 对象提供了一个虚拟空间，你可以在其中放置要打印的信息。这些信息使用 Visual C# 属性和方法放置在空间中。你只需要编写代码将信息放在你想要的位置即可。`PrintDocument`\
  \ 对象没有利用任何数据绑定控件或数据库访问技术。你需要在代码中手动完成这些。`PrintDocument` 对象适用于快速生成数据报告，并在显示内容上提供了很大的灵活性。它还允许你利用几个与打印相关的常用对话框。而且，你不需要学习任何新东西。使用它只需要你的\
  \ Visual C# 知识。\n\n`PrintDocument` 对象（位于 `Drawing.Printing` 命名空间中）控制打印过程并四个四个属性：\n\
  \n| 属性 | 说明 |\n| :--- | :--- |\n| `DefaultPageSettings` | 指定文档的默认页面设置。 |\n| `DocumentName`\
  \ | 指定打印时显示的名称。 |\n| `PrintController` | 指定引导打印过程的控制器。 |\n| `PrinterSettings` |\
  \ 指定打印文档的打印机。 |\n\n使用 `PrintDocument` 对象打印文档（可能包括文本和图形）的步骤是：\n1. 声明一个 `PrintDocument`\
  \ 对象\n2. 创建一个 `PrintDocument` 对象\n3. 设置所需的属性\n4. 使用 `PrintDocument` 对象打印文档\n\n前三步是简单的。要声明并创建一个名为\
  \ `myDocument` 的 `PrintDocument` 对象，使用：\n\n```csharp\nPrintDocument myDocument;\n\
  ..\nmyDocument = new PrintDocument();\n```\n\n任何属性通常来自我们稍后将的对话框。\n\n最后一步提出了问题：`PrintDocument`\
  \ 对象如何通过 `Print` 方法打印？打印是在与 `PrintDocument.PrintPage` 事件关联的通用 Visual C# 方法完成的。这是你必须创建并编写的方法。该方法告诉\
  \ `PrintDocument` 对象每页的内容。一旦方法编写，你需要在代码中添加事件处理程序，以便 `PrintDocument` 对象在准备好打印时跳转。现在听起来可能很复杂，一旦你做了打印，就会非常简单。\n\
  \n打印页的通用 Visual C# 方法格式如下：\n\n```csharp\nprivate void MyPrintPage(object sender,\
  \ PrintPageEventArgs e)\n{\n..\n}\n```\n\n在这个方法中，你构造 `PrintDocument` 对象要打印的每一页。而且，你会发现这个方法的代码是熟悉的。\n\
  \n在 `MyPrintPage` 方法中，参数 `e`（类型为 `PrintPageEventArgs`）具有许多关于打印过程属性。最重要的属性是图形对象：\n\
  \n`e.Graphics`\n\n`PrintDocument` 为我们提供了一个图形对象，用于绘制我们要打印的每一页。我们可以绘制线条、矩形、图像甚至是文本！我们将详细查看如何这样做。但首先，让我们回顾如何建立和使用\
  \ `PrintDocument` 对象。\n\n这里有一个带注释的代码段建立了一个 `PrintDocument` 对象（`myDocument`），并将其连接到名为\
  \ `MyPrintPage` 的方法，通过图形对象提供打印页：\n\n```csharp\n// 声明文档\nPrintDocument myDocument;\n\
  ..\n// 创建并命名文档\nmyDocument = new PrintDocument();\nmyDocument.DocumentName = \"\
  My Document\";\n..\n// 你可以在这里设置其他属性\n..\n// 添加处理器\nmyDocument.PrintPage += new PrintPageEventHandler(this.MyPrintPage);\n\
  // 打印文档\nmyDocument.Print();\n// 完成打印后释放文档\nmyDocument.Dispose();\n```\n\n此代码假设\
  \ `MyPrintPage` 方法可用。让我们看看如何构建这样的方法。\n\n### 打印文档页面\n\n\n\n\n\n`PrintDocument` 对象（在它的\
  \ `PrintPage` 事件中）提供了一个图形对象（`Drawing.Graphics`）用于“绘制”我们的页面。而这正是我们使用图形方法所做的工作。对于打印文档中的每一页，我们都会绘制所需的文本信息（`DrawString`\
  \ 方法）、任何线条（`DrawLine` 方法）、矩形（`DrawRectangle` 方法）或图像（`DrawImage` 方法）。\n\n一旦页面完全绘制到图形对象上，我们就会“告诉”\
  \ `PrintDocument` 对象将其打印出来。我们对每一个想要打印的每一页都重复此过程。这确实需要你亲自做一些工作。你必须知道你的文档有多少页，以及每页的内容是什么。我通常会定义一个页码变量来帮助跟踪当前正在绘制的页面。\n\
  \n一旦页面完成，有两种可能：还有更多页面需要打印，或者没有更多页面需要打印。`e.HasMorePages` 属性（`Boolean`）用于指定存在哪种情况。如果页面完成且有更多页面需要打印，请使用：\n\
  \n```csharp\ne.HasMorePages = true;\n```\n\n在这种情况下，`PrintDocument` 对象将返回 `PrintPages`\
  \ 事件以处理下一页。如果页面完成且打印结束（没有更多页面），请使用：\n\n```csharp\ne.HasMorePages = false;\n```\n\
  \n这告诉 `PrintDocument` 对象它的工作已经完成。此时，你应该释放 `PrintDocument` 对象。\n\n让我们来看一下单个页面的图形对象。打印页面的边界由\
  \ `e.MarginBounds` 属性定义（这些属性由 `PrinterSettings` 属性建立）：\n\n![Image](img/00020.jpeg)\n\
  \n这成为了我们在页面上定位项目的的调色板。所有属性的单位都是 1/100 英寸。水平位置由 `x` 控制（从 0 向右增加），垂直位置由 `y` 控制（从 0\
  \ 向下增加）。\n\n每一页的处理流程是决定“什么放在哪里”，然后使用适当的图形方法对所需信息定位。Visual C# 有许多图形方法。在这里，我们将讨论限制在打印文本、线条、矩形和图像上。在讨论图形方法之前，我们需要提供关于两个有用对象的信息：`Pen`\
  \ 和 `Brush`。\n\n### Pen 对象\n\n某些打印图形方法需要 `Pen` 对象。这支虚拟笔就像你写字和画图用的笔一样。你可以选择笔的颜色和宽度。可以使用\
  \ Visual C# 内置的笔，也可以创建自己的笔。\n\n在许多情况下，Visual C# 内置的笔对象已经足够。`Pens` 类将使用你选择的颜色绘制宽度为\
  \ 1 像素的线条。如果选择颜色是 `ColorName`，引用此类笔的语法为：\n\n```csharp\nPens.ColorName\n```\n\n要创建自己的\
  \ `Pen` 对象（在 `Drawing` 命名空间中），你首先使用以下声明笔：\n\n```csharp\nPen myPen;\n```\n\n然后使用\
  \ `Pen` 构造函数创建笔：\n\n```csharp\nmyPen = new Pen(color, width);\n```\n\n其中 `color`\
  \ 是你的新笔绘制的颜色，`width` 是绘制线条的整数宽度（单位为像素）。这支笔将绘制一条实线。颜色参数可以是内置颜色之一，也可以用 `FromArgb`\
  \ 函数生成的颜色。\n\n创建后，你可以随时使用笔对象的 `Color` 和 `Width` 属性更改颜色和宽度。语法为：\n\n```csharp\nmyPen.Color\
  \ = newColor;\nmyPen.Width = newWidth;\n```\n\n这里 `newColor` 是新指定的颜色，`newWidth`\
  \ 是新的整数笔宽。\n\n当使用笔对象完成绘图后，应使用 `Dispose` 方法释放它：\n\n```csharp\nmyPen.Dispose();\n\
  ```\n\n### Brush 对象\n\nVisual C# 中的区域填充和文本打印是通过 `Brush` 对象完成的。与 `Pen` 对象一样，画笔就像你画画用的刷笔——只需选择颜色即可。可以使用\
  \ Visual C# 内置的画笔，也可以创建自己的画笔。\n\n在大多数情况下，Visual C# 内置的画笔对象已经足够。`Brushes` 类提供了使用\
  \ 141 种内置颜色之一绘制的画笔对象。引用此类画笔的语法为：\n\n```csharp\nBrushes.ColorName\n```\n\n要创建自己的\
  \ `Brush` 对象（来自 `Drawing` 命名空间），你首先使用以下声明画笔：\n\n```csharp\nBrush myBrush;\n```\n\
  \n然后使用 `SolidBrush` 构造函数创建实色画笔：\n\n```csharp\nmyBrush = new SolidBrush(color);\n\
  ```\n\n其中 `color` 是你的新画笔绘制的颜色。此颜色参数可以是内置颜色之一，也可以用 `FromArgb` 函数生成的颜色。\n\n创建后，你可以随时使用画笔对象的\
  \ `Color` 属性更改画笔的颜色。语法为：\n\n```csharp\nmyBrush.Color = newColor;\n```\n\n其中 `newColor`\
  \ 是新指定的颜色。\n\n当使用画笔对象完成绘画后，应使用 `Dispose` 方法释放它：\n\n```csharp\nmyBrush.Dispose();\n\
  ```\n\n### Graphics 方法\n\n要在图形对象（`Drawing.Graphics`）上放置文本，请使用 `DrawString` 方法。要在位置\
  \ `(x, y)` 放置字符串 `myString`，使用字体对象 `myFont` 和画笔对象 `myBrush`，语法为：\n\n```csharp\n\
  e.Graphics.DrawString(myString, myFont, myBrush, x, y);\n```\n\n通过此语句，你可以在任何地方放置任何文本，使用任何字体、任何颜色和任何画笔样式。你只需要做出所需的规格即可。打印页面上的每行文本都需要一个\
  \ `DrawString` 语句。\n\n确定字符串大小的方法有两种。这对于文本在页面上的垂直和水平放置都有帮助。要确定特定字体的高度（像素单位），请使用：\n\
  \n```csharp\nmyFont.GetHeight(e.Graphics)\n```\n\n如果你需要字符串的宽度和高度，请使用：\n\n```csharp\n\
  e.Graphics.MeasureString(myString, myFont)\n```\n\n该方法返回一个包含两个属性的 `SizeF` 结构：`Width`\
  \ 和 `Height`（单位都是百分之一英寸）。许多时候，你会在文档中使用线条来勾勒不同区域。要在图形对象上绘制线条，请使用 `DrawLine` 方法：\n\
  \n```csharp\ne.Graphics.DrawLine(myPen, x1, y1, x2, y2);\n```\n\n此语句将从 `(x1, y1)`\
  \ 绘制线条到 `(x2, y2)`，使用 `myPen` 对象。\n\n要绘制矩形（用于表格或图形区域），请使用 `DrawRectangle` 方法：\n\n\
  ```csharp\ne.Graphics.DrawRectangle(myPen, x1, y1, x2, y2);\n```\n\n此语句将绘制一个左上角在\
  \ `(x1, y1)`、右下角在 `(x2, y2)` 的矩形，使用 `myPen` 对象。\n\n`DrawImage` 方法用于在页面上放置图像（`myImage`对象。语法为：\n\
  \n```csharp\ne.Graphics.DrawImage(myImage, x, y, width, height);\n```\n\n图像的左上角将位于\
  \ `(x, y)`，具有指定的宽度和高度。图像将缩放到适应指定的区域。\n\n如果使用 `DrawImage` 来打印托管图形对象的面板的内容（我们将在第 10\
  \ 章中讨论），你必须确保图形是持久的。我们回顾一下步骤。对于名为 `pnlExample` 的面板，将 `BackgroundImage` 设置为空的位图：\n\
  \n```csharp\npnlExample.BackgroundImage = new Drawing.Bitmap(pnlExample.ClientSize.Width,\
  \ pnlExample.ClientSize.Height, Drawing.Imaging.PixelFormat.Format24bppRgb);\n```\n\
  \n然后，使用以下建立绘制对象 `myObject`：\n\n```csharp\nmyObject = Graphics.FromImage(pnlExample.BackgroundImage);\n\
  ```\n\n现在，应用于此对象的任何图形方法都将具有持久性。为了保持这种持久性，在对此对象进行每次绘制操作后，使用：\n\n```csharp\nmyObject.Refresh();\n\
  ```\n\n随后可以使用 `DrawImage` 方法打印此对象中的图像：\n\n```csharp\ne.Graphics.DrawImage(pnlExample.BackgroundImage,\
  \ x, y, width, height);\n```\n\n\n\n\n\n许多打印任务只需用户点击标记为“打印”的按钮，结果就会显示在打印页面上，无需进一步交互。如果需要更多交互，则有三个对话框控件可以帮助指定所需的打印作业属性：`PageSetupDialog`、`PrintDialog`\
  \ 和 `PrintPreviewDialog`。使用这些控件会为应用程序添加更多代码。你必须获取任何用户输入并在程序中实现这些值。我们将展示每个控件的功能，并由你决定是否想在工作中使用它们。`PrintPreviewDialog`\
  \ 控件 特别酷！！\n\n## PageSetupDialog 控件\n\n![Image](img/00424.jpeg)\n\n`PageSetupDialog`\
  \ 控件允许用户设置有关打印任务的各种参数。这是与大多数 Windows 应用程序中相同的对话框。用户可以设置边框和边距调整、页眉和页脚，以及横向与纵向方向。\n\
  \n### PageSetupDialog 属性\n\n| Name | Description |\n| :--- | :--- |\n| `Name` |\
  \ 获取或设置页面设置对话框名称（我通常将此控件命名为 `dlgSetup`）。 |\n| `AllowMargins` | 获取或设置一个值，表示对话框中的边距部分是否启用。\
  \ |\n| `AllowOrientation` | 获取或设置一个值，表示对话框中的方向部分（横向 vs 纵向）是否启用。 |\n| `AllowPaper`\
  \ | 获取或设置一个值，表示对话框中的纸张部分（纸张大小和纸源）是否启用。 |\n| `AllowPrinter` | 获取或设置一个值，表示打印按钮是否启用。\
  \ |\n| `Document` | 获取或设置一个值，表示从哪个 `PrintDocument` 获取页面设置。 |\n| `MinMargins` | 获取或设置一个值，表示允许用户选择的最小边距，单位为英寸的百分分之一。\
  \ |\n| `PageSettings` | 获取或设置一个值，表示要修改的页面设置。 |\n| `PrinterSettings` | 获取或设置用户点击打印按钮时对话框要修改的打印设置。\
  \ | |\n\n### FontDialog 方法\n\n| Method | Description |\n| :--- | :--- |\n| `ShowDialog`\
  \ | 显示对话框。返回值表示用户点击了哪个按钮（确定或取消）。 |\n\n要使用 `PageSetupDialog` 控件，我们像添加任何控件一样将其添加到应用程序中。它将出现在表单下方的工具栏中。添加后，我们设置几个属性。然后，我们编写代码在需要时显示对话框。用户随后进行选择并关闭对话框。此时，我们使用提供的信息来完成任务。\n\
  \n`ShowDialog` 方法用于显示 `PageSetupDialog` 控件。对于一个名为 `dlgSetup` 的控件，相应的代码为：\n\n```\n\
  dlgSetup.ShowDialog();\n```\n\n显示的对话框如下：\n\n![Image](img/00430.jpeg)\n\n用户进行任何所需的选择。完成后，点击“确定”按钮。此时，可以使用各种属性（即\
  \ `PageSettings` 和 `PrinterSettings`）。可以点击“取消”来取消更改。`ShowDialog` 方法返回被点击的按钮。如果点击确定，则返回\
  \ `DialogResult.OK`；如果点击取消，则返回 `DialogResult.Cancel`。\n\n**PageSetupDialog 控件的典型用法：**\n\
  \n> ➢ 设置 `Name` 属性。决定哪些选项应该可用。\n> ➢ 在打印之前使用 `ShowDialog` 方法显示对话框。\n> ➢ 使用 `PageSettings`\
  \ 和 `PrinterSetting` 属性更改打印输出。\n\n## PrintDialog 控件\n\n![Image](img/00443.jpeg)\n\
  \n`PrintDialog` 控件允许用户选择使用哪个打印机、选择页面方向、打印页面范围和份数。这是许多 Windows 应用程序中相同的对话框。\n\n###\
  \ PrintDialog 属性\n\n| Name | Description |\n| :--- | :--- |\n| `Name` | 获取或设置打印对话框的名称（我通常将此控件命名为\
  \ `dlgPrint`）。 |\n| `AllowPrintToFile` | 获取或设置一个值，表示“打印到文件”复选框是否启用。 |\n| `AllowSelection`\
  \ | 获取或设置一个值，表示“从... 到... 页”选项按钮是否启用。 |\n| `AllowSomePages` | 获取或设置一个值，表示“页”选项按钮是否启用。\
  \ |\n| `Document` | 获取或设置用于获取 `PrinterSettings` 的 `PrintDocument`。 |\n| `PrinterSettings`\
  \ | 获取或设置对话框要修改的 `PrinterSettings`。 |\n| `PrintToFile` | 获取或设置一个值，表示“打印到文件”复选框是否被勾选。\
  \ |\n\n### PrintDialog 方法\n\n| Method | Description |\n| :--- | :--- |\n| `ShowDialog`\
  \ | 显示对话框。返回值表示用户点击了哪个按钮（确定或取消）。 |\n\n要使用 `PrintDialog` 控件，我们像添加任何控件一样将其添加到应用程序中。它将出现在表单下方的工具栏中。添加后，我们设置几个属性。然后，我们编写代码在需要时显示对话框。用户随后进行选择并关闭对话框。此时，我们使用提供的信息来完成任务。\n\
  \n`ShowDialog` 方法用于显示 `PrintDialog` 控件。对于一个名为 `dlgPrint` 的控件，相应的代码为：\n\n```\ndlgPrint.ShowDialog();\n\
  ```\n\n显示的对话框如下：\n\n![Image](img/00448.jpeg)\n\n用户进行任何所需的选择。完成后，点击“确定”按钮。此时，可以使用各种属性（即\
  \ `PrinterSettings`）。可以点击“取消”来取消。`ShowDialog` 方法返回被点击的按钮。如果点击确定，则返回 `DialogResult.OK`；如果点击取消，则返回\
  \ `DialogResult.Cancel`。\n\n**PrintDialog 控件的典型用法：**\n\n> ➢ 设置 `Name` 属性。决定哪些选项应该可用。\n\
  > ➢ 在打印之前使用 `ShowDialog` 方法显示对话框配合 `PrintDocument` 对象。\n\n## PrintPreviewDialog\
  \ 控件\n\n![Image](img/0024.jpeg)\n\n`PrintPreviewDialog` 控件是 C# 的一个很棒补充。它允许用户在预览模式下查看打印输出。他们可以在这里放大或缩小页面。预览文档也可以通过此控件进行打印。对于程序员来说，这是一个非常有用的“临时”控件。通过预览模式而不是打印页面来查看页面。\n\
  \n### PrintPreviewDialog 属性\n\n| Name | Description |\n| :--- | :--- |\n| `Name`\
  \ | 获取或设置打印预览对话框名称（我通常将此控件命名为 `dlgPreview`）。 |\n| `AcceptButton` | 获取或设置用户按下 Enter\
  \ 键时对应的按钮。 |\n| `Document` | 获取或设置要预览的文档。 |\n| `Text` | 获取或设置与此控件关联的文本。 |\n\n###\
  \ PrintPreviewDialog 方法\n\n| Method | Description |\n| :--- | :--- |\n| `ShowDialog`\
  \ | 显示对话框。返回值表示用户点击了哪个按钮（确定或取消）。 |\n\n要使用 `PrintPreviewDialog` 控件，我们像添加任何控件一样将其添加到应用程序中。它将出现在表单下方的工具栏中。添加后，我们设置几个属性，主要是\
  \ `Document`。确保为选定的 `Document` 正确编写了 `PrintPage` 事件。编写代码在需要时显示对话框。文档页面将生成，用户可以在预览窗口中查看它。\n\
  \n`ShowDialog` 方法用于显示 `PrintPreviewDialog` 控件。对于一个名为 `dlgPreview` 的控件，相应的代码为：\n\n\
  ```\ndlgPreview.ShowDialog();\n```\n\n显示的对话框（无文档）如下：\n\n![Image](img/00456.jpeg)\n\
  \n用户可以在预览显示的文档时使用各种布局、缩放和打印选项。完成后，用户关闭对话控件。\n\n**PrintPreviewDialog 控件的典型用法：**\n\
  \n> ➢ 设置 `Name` 属性。设置 `Document` 属性。\n> ➢ 使用 `ShowDialog` 方法显示对话框并查看预览文档。\n\n##\
  \ PrintDocument 对象与数据库\n\n你可能在问，所有这些 `PrintDocument` 对象信息是如何与数据库管理系统协同工作的？这其实非常简单。只需遵循几个直接（尽管很多时候是详细的）步骤即可。\n\
  \n\n\n\n首先，确定你需要在数据库报告中包含哪些数据库信息。你是想打印所有字段和所有记录吗？如果是，你需要编写代码来循环感兴趣的记录。你只想打印特定的记录吗？确定这些信息位于你的\
  \ Visual C# 应用程序的什么位置。通常，它们可以在表单（s）控件的属性中找到。\n\n其次，确定数据库报告每页的布局。我的方法是在一张标准尺寸的网格纸上画出草图。在编写代码（即下一步）时，这是一个很好的参考。\n\
  \n第三，在向你的 Visual C# 应用程序中添加控件（s）和代码，以访问数据库报告的打印程序。这通常是一个带有 `Click` 事件的按钮，其中包含打印代码。\n\
  \n最后，编写 Visual C# 代码来建立数据库报告的每一页。这些代码通常放在它自己的独立方法中。使用位置属性（`PrintPage` 事件方法中的 `e`\
  \ 参数）将所有信息放置在所需的位置。`PrintDocument` 对象的一个优点是，不需要顺序放置信息。也就是说，你不需要从顶部开始向下处理。你可以以任何顺序在页面的任何位置放置信息。当页面完成后，使用\
  \ `e.HasMorePages` 将其发送到打印机。你会发现你需要编写很多代码，但这些代码非常容易编写。让我们通过示例来看每一个步骤。\n\n我们在这里构建的第一个示例（示例\
  \ 7-1）是简单的，只打印单页。当用户点击按钮打印时，报告直接发送到他们的默认打印机。对于跨许多页的大型数据库报告，这不是一个好主意。应该给用户一个界面，让他们提前知道打印作业的大小。根据这些信息，用户应该能够决定继续打印整个报告还是选择报告的部分。`PrintPreviewDialog`\
  \ 控件提供了这种实用。在示例 7-2 和 7-3 中，我们将提供一个使用该控件作为打印界面的示例。\n\n### 示例 7-1：数据库报告\n\n在这个示例中，我们使用第\
  \ 6 章构建的图书数据库管理系统。我们将添加打印任何书名显示记录的功能。\n\n1. 如果你愿意，在开始此示例之前，复制在示例 6-9 中构建的图书数据库管理系统。打开该项目。确保\
