  \            else\n                lblTLT.Text = String.Format(\"{0:f1}\", (nDays\
  \ - 1) * a1L);\n        }\n        lblTHA.Text = String.Format(\"{0:f1}\", sumH\
  \ / nH);\n        lblTLA.Text = String.Format(\"{0:f1}\", sumL / nL);\n    }\n \
  \   else\n    {\n        lblTHH.Text = \"---\";\n        lblTLH.Text = \"---\";\n\
  \        lblTHL.Text = \"---\";\n        lblTLL.Text = \"---\";\n        lblTHA.Text\
  \ = \"---\";\n        lblTLA.Text = \"---\";\n        lblTHT.Text = \"---\";\n \
  \       lblTLT.Text = \"---\";\n    } 遍历数据库中的每条记录，并将温度值存储在 `HighTemp` 和 `LowTemp`\
