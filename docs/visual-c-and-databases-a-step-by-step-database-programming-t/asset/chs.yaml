  Error in Processing SQL\", MessageBoxButtons.OK, MessageBoxIcon.Error);\n    }\n\
  \    resultsCommand.Dispose();\n    resultsAdapter.Dispose();\n    resultsTable.Dispose();\n\
  }\n```\n\n让我们花点时间看看这段代码发生了什么。我们做的第一件事是使用异常处理（`try` 块）。如果没有它，如果我们在 SQL 语句中犯了一个微小的错误，程序将会停止。有了它，我们就能得到一个指示错误的消息并被允许继续。在错误控制之后，SQL\
  \ 语句（来自 `txtSQLTester`）由 `resultsAdapter` 处理，并形成 `resultsTable`。\n\n在输入 SQL 语句时要小心。虽然我们在测试器中有异常处理，但如果你犯了错误，返回的（很多时候）并没有太大帮助。\n\
  \n8. **执行 SQL 语句。** 在文本框中输入 `SELECT * FROM Titles` 并点击 Statement。你应该看到：\n\n![Image](img/018.jpeg)\n\
  \n## 使用 SQL Server 数据库\n\nSQL Server 版本的差异：\n\n1. SQL Server 版本的书籍数据库是 `BooksDB.mdf`。将\
  \ `BooksDB.mdf` 复制到你的工作目录。\n\n2. 使用此 `using` 语句：\n\n```csharp\nusing System.Data.SqlClient;\n\
  ```\n\n3. 在声明中，使用此连接对象：\n\n```csharp\nSqlConnection booksConnection;\n```\n\n4.\
  \ 在 `frmSQLTester_Load` 方法中，使用此连接对象：\n\n```csharp\nbooksConnection = new SqlConnection(\"\
  Data Source=.\\\\SQLEXPRESS;AttachDbFilename=c:\\\\VCSDB\\\\Working\\\\BooksDB.mdf;Integrated\
  \ Security=True; Connect Timeout=30; User Instance=True\");\n```\n\n5. 在 `btnTest_Click`\
  \ 方法中：\n- 将所有的 `OleDbCommand` 更改为 `SqlCommand`\n- 将所有的 `OleDbDataAdapter` 更改为 `SqlDataAdapter`\n\
  \n## SELECT/FROM SQL 语句\n\n最常用的 SQL 语句是我们一直作为示例使用的：`SELECT/FROM` 语句。该语句允许你从一个或多个表中选取字段。\n\
  \n`SELECT/FROM` SQL 语句的语法为：\n\n`SELECT [Fields] FROM [Tables]`\n\n其中 `[Fields]`\
  \ 是所需的字段列表，`[Tables]` 是字段所在表的列表。通配符 `*` 可用于字段列表，以选择所列表的所有字段。例如：\n\n`SELECT * FROM\
  \ Titles`\n\n选择并返回书籍数据库表中的所有字段。如果我们只需要表中的选字段，则使用字段列表，它是逗号分隔的所需字段列表，或者：\n\n`SELECT\
  \ Field1, Field2, Field3 FROM Table`\n\n\n\n\n将从 `Table` 返回三个命名字段。请确保不要在最后一个字段名后放置逗号。若要从书籍数据库\
  \ `Titles` 表中仅获取 `Title` 和 `Year_Published` 字段，请使用：\n\n```sql\nSELECT Title,Year_Published\
  \ FROM Titles\n```\n\n注意，字段名没有使用规定的 `Table.Field` 点表示法。在这里处，省略表名是可以接受的，因为不会对字段的出处产生混义。当使用多个表时，我们必须使用点表示法。\n\
  \n用 SQL 测试器尝试此操作，你会看到只返回了两个字段。\n\n![Image](img/00072.jpeg)\n\n`DISTINCT` 关键字可以与\
  \ `SELECT` 使用，将返回的记录限制为每个字段唯一条目仅一条。也就是说，没有重复条目。例如，先在 SQL 测试器中尝试这个：\n\n```sql\nSELECT\
  \ PubID FROM Titles\n```\n\n![Image](img/00137.jpeg)\n\n现在，尝试：\n\n```sql\nSELECT\
  \ DISTINCT PubID FROM Titles\n```\n\n![Image](img/00276.jpeg)\n\n你应该看到返回的记录要少得多\
  \ - 只返回了唯一的发行商。\n\n## ORDER BY 子句\n\n当你使用 `SELECT/FROM` 语句时，记录按照它们在所选表中的发现顺序返回。要按其他顺序对返回的记录进行排序，你需要使用\
  \ `ORDER BY` 子句。语法为：\n\n```sql\nSELECT [Fields] FROM [Tables] ORDER BY FieldSort\n\
  ```\n\n该语句从列出的表中选择列出的字段，并按名为 `FieldSort` 的字段进行排序。默认情况下，排序是升序的。如果你希望排序为降序，则在 `FieldSort`\
  \ 名称后加上关键字 `DESC`。\n\n用 SQL 测试器尝试此语句：\n\n```sql\nSELECT * FROM Titles ORDER BY PubID\n\
  ```\n\n`Titles` 表中的所有记录将按发行商 ID 的顺序返回。\n\n![Image](img/00060.jpeg)\n\n尝试尝试这个，顺序应该是反转的：\n\
  \n```sql\nSELECT * FROM Titles ORDER BY PubID DESC\n```\n\n你可以在 `ORDER BY` 子句中使用多个字段。SQL\
  \ 将根据所有请求的排序创建一个数据表。用 SQL 测试器尝试这个：\n\n```sql\nSELECT * FROM Titles ORDER BY PubID,Title\n\
  ```\n\n返回的记录将按发行商排序，每个发行商的书籍按字母顺序排列。\n\n![Image](img/00283.jpeg)\n\n如果你想限制排序记录的\
  \ SQL 语句返回的记录数量，可以在 `SELECT` 中使用 `TOP` 关键字。`TOP n` 返回前 `n` 条记录。`TOP n PERCENT` 返回返回记录的前\
  \ `n` 百百分比。如果有两个或多个记录具有相同的排序值，则它们都会被返回。使用 SQL 测试器并尝试：\n\n```sql\nSELECT TOP 20 *\
  \ FROM Titles ORDER BY PubID,Title\n```\n\n应该返回 20 本书。现在，尝试：\n\n```sql\nSELECT TOP\
  \ 20 PERCENT * FROM Titles ORDER BY PubID,Title\n```\n\n将返回更多的书籍。\n\n## WHERE 子句\n\
  \n`SELECT/FROM` SQL 语句最实用的方面之一是通过 `WHERE` 子句限制返回的数据表。该子句指定了形成数据表时必须满足的一些标准。语法为：\n\
  \n```sql\nSELECT [Fields] FROM [Tables] WHERE Criteria\n```\n\n`WHERE` 子句通过允许你对任何字段的值进行逻辑检查，来限制返回记录的数量。用于执行这些检查的算符包括：\n\
  \n| 运算符 | 描述 |\n| :--- | :--- |\n| `<` | 小于 |\n| `>` | 大于 |\n| `=` | 等于 |\n| `<=`\
  \ 小于等于 |\n| `>=` | 大于等于 |\n| `<>` | 不等于 |\n\n其他运算符有：\n\n| 运算符 | 描述 |\n| :--- | :---\
  \ |\n| `Between` | 在范围内 |\n| `In` | 指定值列表 |\n| `Like` | 通配符匹配 |\n\n`WHERE` 子句可以限制从一个表显示的信息，也可以组合来自一个或多个表的信息。\n\
  \n### 单表 WHERE 子句\n\n假设我们要查看书籍数据库 `Titles` 表中 1995 年之后出版书籍的所有字段。并且，我们希望返回的记录按 `Title`\
  \ 排序。实现此操作的 SQL 语句如下（我们将每个子句单独写一行以清楚地指示发生了什么——多行 SQL 语句是允许的，而且很多也是理想的）：\n\n```sql\n\
  SELECT *\nFROM Titles\nWHERE Year_Published > 1995\nORDER BY Title\n```\n\n这就是 SQL\
  \ 真正的威力所在之处。通过这个简单的语句，数据库引擎可以快速找到所需的记录并对它们进行排序——完全不需要我们来编写任何代码！\n\n![Image](img/00244.jpeg)\n\
  \n如果我们想知道关于华盛顿州所有书籍发行商的信息呢？用 `BooksDB.accdb` 中的 `Publishers` 表尝试此 SQL 语句：\n\n```sql\n\
  SELECT * FROM Publishers WHERE State = 'WA'\n```\n\n注意，我们把州名的缩写（一个字符串）括在单引号中，正如本章前面讨论过的那样。用\
  \ SQL 测试器尝试此 SQL 语句，你应该能在华盛顿州发现一个孤独的发行商（BetaV）！\n\n![Image](img/00369.jpeg)\n\n\
  想知道微软在哪里吗？\n\n`BETWEEN` 关键字允许我们搜索一个范围的值。想要 1995 年到 1998 年之间出版的所有书籍吗？使用这个表语句：\n\n\
  ```sql\nSELECT * FROM Titles WHERE Year_Published BETWEEN 1995 AND 1998\n```\n\n\
  ![Image](img/0047.jpeg)\n\n`IN` 关键字让我们指定一个值列表。假设我们想知道纽约州、马萨诸塞州和加利福尼亚州的发行商。可以使用：\n\
  \n```sql\nSELECT * FROM Publishers WHERE State IN ('NY', 'MA', 'CA')\n```\n\n![Image](img/0105.jpeg)\n\
  \n`LIKE` 关键字允许我们在 `WHERE` 子句中使用通配符。记住 SQL 通配符是 `*`。\n\n```sql\nSELECT * FROM Authors\
  \ WHERE Author LIKE '%g%'\n```\n\n![Image](img/0083.jpeg)\n\n通过使用逻辑运算符 `AND` 和 `OR`\
  \ 可以实现多个标准。例如，为了查找 1993 年之后且标题以字母 Data 开头的 `Titles` 表书籍，我们将使用：\n\n```sql\nSELECT\
  \ * FROM Titles WHERE Year_Published > 1993 AND Title LIKE 'Data%'\n```\n\n![Image](img/0437.jpeg)\n\
  \n## 多表 WHERE 子句\n\n到目前为止，我们在课程中做的几乎所有操作都涉及单个原生（内置）表。这对于我们理解数据库设计、学习使用工具以及学习简单的\
  \ SQL 语句非常有价值。现在，我们开始研究数据库管理系统最大的用途之一——组合多个表的信息。SQL 让这种组合变成了一个简单的任务。\n\n我们仍然使用相同的\
  \ `SELECT/FROM` 语法，结合 `WHERE` 和 `ORDER BY` 子句来形成我们的新表：\n\n```sql\nSELECT [Fields]\n\
  FROM [Tables]\nWHERE Criteria\nORDER BY [Fields]\n```\n\n\n\n`WHERE` 子句声明了在合并两个表时必须满足的条件。通常的选择是将一个表中的主键与另一个表中对应的外键进行匹配。在这里，我们希望每个表中的出版者识别码相匹配：\n\
  \n```\nWHERE Titles.PubID = Publishers.PubID\n```\n\n表中任何不符合 `WHERE` 标准的记录将不会包含在返回的数据表中。\n\
  \n最后，我们声明了希望如何对结果数据表进行排序：\n\n```\nORDER BY Titles.Title\n```\n\n因此，完整的 SQL 语句如下：\n\
  \n```sql\nSELECT Titles.Title,Publishers.Company_Name\nFROM Titles,Publishers\n\
  WHERE Titles.PubID = Publishers.PubID\nORDER BY Titles.Title\n```\n\n尝试在 SQL 测试器中运行这个。\n\
  \n![Image](img/00053.jpeg)\n\n你感到惊讶吗？你刚刚见到了使用 SQL 配合 ADO .NET 数据库引擎（或任何数据库系统）的真实威力之一。我们只需要告诉引擎我们想要什么（通过\
  \ SQL 语句），它就为我们完成了所有的工作——不需要编写代码！让我们再看几个例子。\n\n在上一个例子中，假设你只想要由 Que Corporation 出版的书籍。修改\
  \ SQL 语句来实现（我们添加了一个 `AND` 子句）：\n\n```sql\nSELECT Titles.Title,Publishers.Company_Name\n\
  FROM Titles,Publishers\nWHERE Titles.PubID = Publishers.PubID\nAND Publishers.Company_Name\
  \ = 'QUE CORP'\nORDER BY Titles.Title\n```\n\n![Image](img/00298.jpeg)\n\n如果我们想列出书的标题、出版者和作者，并按作者姓名排序会怎样？这需要使用书籍数据库中的所有四个表。让我们构建这个\
  \ SQL 语句。我们需要三个字段：\n\n```sql\nSELECT Authors.Author,Titles.Title,Publishers.Company_Name\n\
  ```\n\n如提到的，检索这些信息需要所有四个表：\n\n```\nFROM Authors,Titles,Publishers,Title_Author\n\
  ```\n\n我们仍然需要出版者识别码相匹配，但现在还需要确保书名（通过 `ISBN` 字段）和作者识别码相匹配。对应的 `WHERE` 子句是：\n\n```\n\
  WHERE Titles.ISBN = Title_Author.ISBN\nAND Authors.Au_ID = Title_Author.Au_ID\n\
  AND Titles.PubID = Publishers.PubID\n```\n\n最后，对结果进行排序：\n\n```\nORDER BY Authors.Author\n\
  ```\n\n将所有内容放入 SQL 测试器中，为我们提供了超过 16,000 条列表（每个作者以及他撰写或合写的每本书各有一条目）：\n\n![Image](img/00445.jpeg)\n\
  \n如此强大的力量！你能想象尝试用 C# 代码来执行此记录检索任务吗？\n\n如果显示的字段名没有清晰地描述显示的信息，你可以对其起别名，或者使用 `AS` 子句将其更改为更有意义的内容。尝试这个简单的例子：\n\
  \n```sql\nSELECT Au_ID AS This_Author FROM Authors\n```\n\n注意，现在显示的列是 `This_Author`。\n\
  \n![Image](img/00098.jpeg)\n\n字段名不受别名的影响——改变的只是显示名称。\n\n### INNER JOIN 子句\n\n在合并表时，SQL\
  \ 的 `INNER JOIN` 子句的作用与 `WHERE` 子句相同。`INNER JOIN` 的语法与 `WHERE` 子句略有不同。\n\n```sql\n\
  SELECT [Fields]\nFROM Table1 INNER JOIN Table2 ON Linking Criteria\nWHERE Criteria\n\
  ORDER BY [Fields]\n```\n\n这个相当长的语句首先指定了要 `SELECT` 的字段。`FROM` 子句指定字段将来自第一个表（`Table1`），并将其与第二个表（`Table2`）进行\
  \ `INNER JOIN`。`ON` 子句规定了用于连接的连接标准（通常是键值的匹配）。到此为止，表已经合并。你仍然可以使用 `WHERE` 子句从该表中提取特定信息（你只是不能用它来合并表），并且如果需要，还可以使用\
  \ `ORDER BY` 子句。让我们重复刚才用 `WHERE` 子句做的例子。\n\n要显示书名和出版者名称，`SELECT` 子句为：\n\n```\nSELECT\
  \ Titles.Title, Publishers.Company_Name\n```\n\n我们希望将 `Titles` 表与 `Publishers` 表“连接”，确保\
  \ `PubID` 字段匹配。对应的 `INNER JOIN` 语句是：\n\n```\nFROM Titles INNER JOIN Publishers\n\
  ON Titles.PubID = Publishers.PubID\n```\n\n最后，我们按标题排序：\n\n```\nORDER BY Titles.Title\n\
  ```\n\n在 SQL 测试器中尝试此 SQL 语句，你应该获得与之前使用 `WHERE` 子句看到的相同结果：\n\n![Image](img/00315.jpeg)\n\
  \n为了说明将 `WHERE` 子句（限制显示的记录）与 `JOIN` 子句结合使用，请在 SQL Tester 中尝试此修改后的 SQL 语句：\n\n```sql\n\
  SELECT Titles.Title, Publishers.Company_Name\nFROM Titles INNER JOIN Publishers\n\
  ON Titles.PubID = Publishers.PubID\nWHERE Publishers.Company_Name = 'QUE CORP'\n\
  ORDER BY Titles.Title\n```\n\n仅列出 QUE CORP 的出版者。\n\n使用 `INNER JOIN` 子句合并两个表的信息要复杂一些。表需要分阶段连接，使用括号嵌套\
  \ `INNER JOIN` 子句。假设我们有三个表（`Table1`、`Table2`、`Table3`）需要合并。`Table1` 和 `Table3` 有一个用于连接的共同键字段。我们需要出版者识别码相匹配，但现在还需要确保书名（通过\
  \ `ISBN` 字段）和作者识别码匹配。对应的 `WHERE` 子句是：\n\n```\nWHERE Titles.ISBN = Title_Author.ISBN\n\
  AND Authors.Au_ID = Title_Author.Au_ID\nAND Titles.PubID = Publishers.PubID\n```\n\
  （注：此处原文逻辑似乎在描述处有跳跃，已按原文语意翻译）\n\n最后，结果进行了排序：\n\n```\nORDER BY Authors.Author\n```\n\
  （注：由于提供的英文文本在某些部分存在逻辑嵌套或描述混乱，翻译已遵循原文结构进行翻译）\n\n\n\n\n```sql\nSELECT Titles.Title,\
  \ Publishers.Company_Name\nFROM Titles\nRIGHT OUTER JOIN Publishers\nON Titles.PubID\
  \ = Publishers.PubID\nORDER BY Titles.Title\n```\n![Image](img/00313.jpeg)\n\n数据库中有几个出版商（约\
  \ 19 个）没有对应的标题。\n\n`LEFT OUTER JOIN` 包含了第一个命名表（最左边的表）的所有记录，即使第二个命名表（最右侧的表）中的记录没有匹配的值。在\
  \ SQL Tester 中尝试此操作：\n\n```sql\nSELECT Titles.Title, Publishers.Company_Name\nFROM\
  \ Titles\nLEFT OUTER JOIN Publishers\nON Titles.PubID = Publishers.PubID\nORDER\
  \ BY Titles.Title\n```\n![Image](img/00419.jpeg)\n\n返回的数据表与通过 `INNER JOIN` 得到的相同。显然，数据库中的所有书籍都有对应的出版商——这实际上是件好事。\n\
  \n## 使用 SQL 的函数（Access 数据库）\n\nSQL 包含了一些基本函数，允许你修改显示的信息。它不会影响数据库中的底层信息。例如，假设你希望\
  \ `books` 数据库 `Titles` 表中的所有书名都以大写字母列。在 SQL Tester 中尝试此 SQL 语句：\n\n```sql\nSELECT\
  \ UCase(Titles.Title) FROM Titles ORDER BY Titles.Title\n```\n![Image](img/00005.jpeg)\n\
  \n注意 SQL 为此“派生”字段分配了 `Expr1000` 标题。我们可以使用 SQL 的别名功能将此标题更改为我们想要的任何内容（现有字段名除外）。尝试这个：\n\
  \n```sql\nSELECT UCase(Titles.Title) AS Title FROM Titles\n```\n\n或者，如果我们有一个过程只能使用书名的左侧\
  \ 10 个字符呢？此 SQL 语句可以解决问题：\n\n```sql\nSELECT Left(UCase(Titles.Title), 10) AS Title\
  \ FROM Titles\n```\n\n你还可以在 SQL 语句中进行基础数学运算。`BOOKS` 数据库 `Authors` 表有一个 `Year_Born`\
  \ 字段。此 SQL 语句将显示每个作者以及他们在 2006 年（编写本文时）的年龄：\n\n```sql\nSELECT Authors.Author,(2006-Authors.Year_Born)\
  \ AS Age\nFROM Authors\n```\n![Image](img/00240.jpeg)\n\n注意，大多数列表没有 `Age` 值——我不得不向下滚动了一会儿才找到一个。这是因为只有少数作者记录有出生年份输入——条目为\
  \ `NULL`（不包含任何信息）。\n\n`NULL` 是一个特殊值，意味着那里无物——这不等同于空字符串或空格。在我们的工作中，我们将尽量避免在数据库中放置\
  \ `NULL`，但有时这是不可行的，或者它们可能存在于其他数据库中。你需要决定在你的设计中如何处理 `NULL`。我们将看到它们导致问题的示例。可以使用 SQL\
  \ 函数 `IS NULL` 和 `IS NOT NULL` 测试 `NULL` 字段。我们可以将此添加到上面的 SQL 语句中，以只找到具有出生年份的 `Authors`\
  \ 记录：\n\n```sql\nSELECT Authors.Author,(2006-Authors.Year_Born) AS Age\nFROM Authors\n\
  WHERE Authors.Year_Born IS NOT NULL\n```\n\n你现在应该找到 20 个列出年龄的作者。\n\n## 使用 SQL 的函数（SQL\
  \ Server 数据库）\n\n在使用 SQL Server 数据库时，可以使用一些函数作为 SQL 语句的一部分（完整函数列表请参阅 SQL Server\
  \ 参考）。这允许你修改显示的信息。它不会影响数据库中的底层信息。例如，假设你希望 `SQLBooksDB.mdf` `Titles` 表中的所有书名都以大写字母列。在\
  \ SQL Tester 中尝试此 SQL 语句：\n\n```sql\nSELECT UPPER(Titles.Title) FROM Titles ORDER\
  \ BY Titles.Title\n```\n![Image](img/00243.jpeg)\n\n注意 SQL 为此“派生”字段分配了 `Column1`\
  \ 标题。我们可以使用 SQL 的别名功能将此标题更改为我们想要的任何内容（现有字段名除外）。尝试这个：\n\n```sql\nSELECT UPPER(Titles.Title)\
  \ AS Title FROM Titles\n```\n\n或者，如果我们有一个过程只能使用书名的左侧 10 个字符呢？此 SQL 语句可以解决问题：\n\n\
  ```sql\nSELECT LEFT(UPPER(Titles.Title), 10) AS Title FROM Titles\n```\n\n你还可以在\
  \ SQL 语句中进行基础数学运算。`BOOKS` 数据库 `Authors` 表有一个 `Year_Born` 字段。此 SQL 语句将显示每个作者以及他们在\
  \ 2006 年（编写本文时）的年龄：\n\n```sql\nSELECT Authors.Author,(2006-Authors.Year_Born) AS\
  \ Age\nFROM Authors\n```\n![Image](img/00439.jpeg)\n\n注意，大多数列表没有 `Age` 值——我不得不向下滚动了一会儿才找到一个。这是因为只有少数作者记录有出生年份输入——条目为\
  \ `NULL`（不包含任何信息）。\n\n`NULL` 是一个特殊值，意味着那里无物——这不等同于空字符串或空格。在我们的工作中，我们将尽量避免在数据库中放置\
  \ `NULL`，但有时这是不可行的，或者它们可能存在于其他数据库中。你需要决定在你的设计中如何处理 `NULL`。我们将看到它们导致问题的示例。可以使用 SQL\
  \ 函数 `IS NULL` 和 `IS NOT NULL` 测试 `NULL` 字段。我们可以将此添加到上面的 SQL 语句中，以只找到具有出生年份的 `Authors`\
  \ 记录：\n\n```sql\nSELECT Authors.Author,(2006-Authors.Year_Born) AS Age\nFROM Authors\n\
  WHERE Authors.Year_Born IS NOT NULL\n```\n\n你现在应该找到 20 个列出年龄的作者。\n\n## SQL 聚合函数\n\
  \n除了 SQL 函数外，ADO 引擎还支持聚合函数。这些函数允许你计算字段的统计数据并为结果设置别名。`NULL` 字段会被聚合函数忽略。\n\n| 函数 |\
  \ 描述 |\n| :--- | :--- |\n| `AVG(Field)` | 字段的平均值 |\n| `COUNT(Field)` | 字段的计数 |\n\
  | `FIRST(Field)` | 字段的第一个值 |\n| `LAST(Field)` | 字段的最后一个值 |\n| `MAX(Field)` | 字段的最大值\
  \ |\n| `MIN(Field)` | 字段的最小值 |\n| `SUM(Field)` | 字段的和 |\n\n在 `Authors` 表上尝试此示例：\n\
  \n```sql\nSELECT COUNT(Authors.Author) AS HowMany,\nAVG(Authors.Year_Born) AS AveYear,\n\
  FIRST(Authors.Year_Born) AS FirstYear,\nLAST(Authors.Year_Born) AS LastYear,\nMAX(Authors.Year_Born)\
  \ AS MaxYear,\nMIN(Authors.Year_Born) AS MinYear,\nSUM(Authors.Year_Born) AS SumYear\n\
  FROM Authors\n```\n![Image](img/00412.jpeg)\n\n注意某些聚合字段（`FirstYear`, `LastYear`）没有值，因为这些是\
  \ `NULL`。\n\n聚合函数可以用于分组。`GROUP BY` 子句允许你确定具有重复字段值的记录。想知道每个州有多少出版商吗？尝试此 SQL 语句：\n\
  \n```sql\nSELECT Publishers.State, Count(Publishers.State) as HowMany\nFROM Publishers\n\
  GROUP BY Publishers.State\n```\n![Image](img/00434.jpeg)\n\n你可以使用 `HAVING` 限定符进一步减少\
  \ `GROUP BY` 子句的结果。假设在上面的示例中，你只想显示以字母 M 开头的州（奇怪的要求）。此 SQL 语句可以解决问题：\n\n```sql\n\
  SELECT Publishers.State, Count(Publishers.State) as HowMany\nFROM Publishers\nGROUP\
  \ BY Publishers.State\nHAVING Publishers.State LIKE 'M%'\n```\n![Image](img/00322.jpeg)\n\
  \n## SQL 构建工具\n\n我们完成了对 SQL 语言的审查。还有一些我们没有过的命令。如果你想了解更多，有大量的 ANSI 标准 SQL 和微软版本的参考资料。你现在知道如何构造\
  \ SQL 语句从多表数据库中提取所需信息，并且知道如何阅读他人的 SQL 语句。\n\n你已经看到构造 SQL 语句有时是一个枯燥的过程。为了辅助构造此类语句，有几种工具供我们使用。我们将讨论两个：一个是\
  \ Access 中的，另一个是数据向导提供的（第 3 章讨论）。\n\n### 使用 Access 的 SQL 语句\n\n要使用 Microsoft Access\
  \ 构建 SQL 查询，你的电脑上显然必须安装了 Access。例如，我们将构建一个显示 `books` 数据库中每本书书的作者、标题和出版商的 SQL 查询：\n\
  \n\n\n\n\n- 启动 Access 并打开你的 `BooksDB.accdb` 副本。点击 `Queries`（查询）选项卡，在设计视图选择 `Create\
  \ Query`（创建查询），点击 `Open`（打开）。\n- 在 `Show Table`（显示表）窗表中，添加四个表。完成后，点击 `Close`（关闭）。会出现一个拆分窗口，上方是关联表（显示主键和外键之间的关系），下方是一个表格。\n\
  - 在窗口下方，点击第一个 `Field`（字段）列，点击下拉箭头并选择 `Authors.Author`。在 `Sort`（排序）下，选择 `Ascending`（升序）（按\
  \ `Author` 排序）。在第二列中，点击下拉箭头并选择 `Titles.Title`。在第三列中，点击下拉箭头并选择 `Publishers.Company_Name`。完成后，你应该能看到（所示，我稍微移动了表的位置）：\n\
  \n![Image](img/00407.jpeg)\n- 点击 Access 工具栏上的感叹号（`!`）来生成数据表。现在，点击 Access 主菜单上的 `View`（视图）并选择\
  \ `SQL View`（SQL 视图）。\n- 像魔法一样，用于生成数据表的 SQL 显示了出来：\n\n```\nSELECT Authors.Author,\
  \ Titles.Title, Publishers.Company_Name\nFROM (Publishers INNER JOIN Titles ON Publishers.PubID\
  \ = Titles.PubID) INNER JOIN (Authors INNER JOIN Title_Author ON Authors.Au_ID =\
  \ Title_Author.Au_ID) ON Titles.ISBN = Title_Author.ISBN\nORDER BY Authors.Author;\n\
  ```\n\n注意此查询的几点。首先，它使用 `INNER JOIN` 子句来合并表。其次，注意查询末尾的分号（`;`）。这并不是必须的，`ADO .NET`\
  \ 数据库引擎会忽略它。你现在可以将上述查询复制并粘贴到你的 `Visual C#` 应用程序中任何地方。你可能需要对查询进行一些调整，以确保它在运行时不会产生语法错误。注意此生成的查询与这些笔记中之前开发的非常相似。它之所以相似是因为作者使用了\
  \ Access 来生成该查询——你也应该尽可能使用 Access 的查询生成功能。这可以确保 SQL 语句是正确的，帮助减少你的编程烦恼。\n\n## 使用数据向导的\
  \ SQL 语句\n\n在第 3 章中，我们过的 `Visual C#` 数据向导作为构建应用程序的工具。尽管我们不会使用该向导来构建应用程序（主要是为了简化应用程序的分发），但它可以生成我们可能需要的任何\
  \ SQL 语句。\n\n这里的步骤与刚刚在 Access 中使用的步骤相似（这并不意外，因为它们可能使用了相同的底层代码）。而且，尽管此示例使用了 `BooksDB.accdb`，使用\
  \ SQL Server 版本（`SQLBooksDB.mdf`）也可以。在 `Visual C#` 中创建一个新项目。\n\n- 选择 `Project`（项目）菜单项，然后\
  \ `Add New Data Source`（添加新数据源）。在屏幕上点击 `Next` 直直到你看到（我们假设连接仍然“指向”书籍数据库；如果不是，请执行必要的步骤）：\n\
  \n![Image](img/00409.jpeg)\n\n我们需要数据集中中的所有表。勾选 `Authors`、`Publishers`、`Title_Author`\
  \ 和 `Titles`。然后，点击 `Finish`（完成）。\n\n一个新的数据集（`booksDataSet`）出现在 `Data Sources`（数据源）窗口中：\n\
  \n![Image](img/00415.jpeg)\n- 我们现在需要添加表适配器（table adapter），从表中生成所需的字段以形成另一个表。在 `Data\
  \ Sources` 窗口中突出 `booksDataSet`，点击该窗口工具栏中的 `Edit DataSet with Designer`（用设计器编辑数据集）按钮。将出现此显示四个独立表的窗口：\n\
  \n![Image](img/00417.jpeg)\n\n我们的虚拟表将包含 `Author`、`Title` 和 `Company_Name` 字段。为了构建此表，我们需要一个新的\
  \ `TableAdapter`。右键点击显示窗口，选择 `Add`（添加），然后选择 `TableAdapter`。\n- 将添加一个新的适配器，`TableAdapter\
  \ Configuration Wizard`（表适配器配置向导）将启动。点击 `Choose Your Data Connection`（选择数据连接）窗口以及后续\
  \ `Choose a Command Type`（选择命令类型）窗口（在其中我们告诉适配器我们正在使用 `SQL`）。将出现 `Enter a SQL Statement`（输入\
  \ SQL 语句）窗口：\n\n![Image](img/00428.jpeg)\n\n在这里我们让向导来构建 SQL 语句。\n- 点击 `Query Builder`（查询生成器）查看：\n\
  \n![Image](img/00414.jpeg)\n\n选择 `Authors`、`Publishers`、`Title_Author` 和 `Titles`\
  \ 表并点击 `Add`（添加）。\n- 点击 `Close`（关闭）。你会看到：\n\n![Image](img/00444.jpeg)\n\n查询生成器显示了表之间的关系（即\
  \ `ISBN` 值如何连接 `Titles` 与 `Title_Author`，Au_ID` 如何连接 `Title_Author` 与 `Authors`，PubID`\
  \ 如何连接 `Titles` 与 `Publishers`）。在 `Titles` 表中选择 `Title`。在 `Publishers` 表中选择 `Company_Name`。然后在\
  \ `Authors` 表中选择 `Author`。添加后，在下方的表中选择排序类型为 `Ascending`（升序这将根据 `Author` 名称对表进行排序。\n\
  - 一旦完成选择，窗口将显示：\n\n![Image](img/00422.jpeg)\n\n点击 `OK` 查看生成的以下 SQL 语句：\n\n```\n\
  SELECT Titles.Title, Publishers.Company_Name, Authors.Author\nFROM (((Authors INNER\
  \ JOIN Title_Author ON Authors.Au_ID = Title_Author.Au_ID) INNER JOIN Titles ON\
  \ Titles.ISBN = Titles.ISBN) INNER JOIN Publishers ON Titles.PubID = Publishers.PubID)\n\
  ORDER BY Authors.Author;\n```\n\n这与 Access 生成的语句基本相同（只是结尾没有分号）。更多步骤。如果你有 Access，这可能是生成\
  \ SQL 的最佳方法。\n\n## 代码中构建命令\n\n在上述两个示例中，我们不知道用户将选择什么。幸运的是，`C#` 语言丰富的字符串处理，在代码中构建此类语句是一个直接的过程。\n\
  \n要在代码中构建 SQL 命令，将所有已知子句形成字符串变量。一旦用户做出选择，使用字符串连接运算符（`+`）这些选择放在完整语句的正确位置。该语句可以在运行时处理，使用之前讨论的方法。下一个示例演示这一点。\n\
  \n### 示例 4-2：搜索数据库\n\n我们创建一个应用程序（使用 `BooksDB.accdb` 数据库），显示书籍的作者、标题和出版商。用户可以显示数据库中的所有书籍，或者在数据库中搜索特定的作者（按首字母搜索，使用按钮）。这个示例有很多要学。你将看到如何在代码中构建\
  \ SQL 命令，如何将该语句放入代码，如何设置方便的搜索机制以及如何构建良好的界面，这些主题将在第 5 章详细介绍。\n\n1. 开始一个新项目。添加一个数据网格控件和一个按钮。调整控件的位置和大小直到表单看起来所示：\n\
  \n![Image](img/00091.jpeg)\n\n确保数据网格和按钮之间留有空间。我们将使用此空间用于搜索数据库表的两行按钮控件。\n\n2. 设置表单和控件的属性：\n\
  \n| Form1: |\n| :--- | :--- |\n| `Name` | `frmBooks` |\n| `BorderStyle` | `FixedSingle`\
  \ |\n| `StartPosition` | `CenterScreen` |\n| `Text` | `Books Database` |\n\n| button1:\
  \ |\n| :--- | :--- |\n| `Name` | `btnAll` |\n| `Text` | `Show All Records` |\n\n\
  | dataViewGrid1: |\n| :--- | :--- |\n| `Name` | `grdBooks` |\n| `AutoSizeColumnsMode`\
  \ | `Fill` |\n\n此时，表单应该看起来所示：\n\n![Image](img/00446.jpeg)\n\n\n\n\n\n### 3. 在代码窗口顶部添加此行以允许使用数据对象：\n\
  \n```csharp\nusing System.Data.OleDb;\n```\n\n### 4. 表单级声明：\n\n```csharp\nOleDbConnection\
  \ booksConnection;\nString SQLAll;\nButton[] btnRolodex = new Button[26];\n```\n\
  \n`SQLAll` 将存储默认 SQL 语句的变量。`btnRolodex` 是用于搜索的按钮数组。\n\n### 5. `frmBooks_Load` 方法的代码：\n\
  \n```csharp\nprivate void frmBooks_Load(object sender, EventArgs e)\n{\n    // 连接到书籍数据库\n\
  \    booksConnection = new\n    OleDbConnection(\"Provider=Microsoft.ACE.OLEDB.12.0;\
  \ Data\nSource = c:\\\\VCSDB\\\\Working\\\\BooksDb.accdb\");\n    booksConnection.Open();\n\
  \n    // 创建搜索用的通讯录按钮\n    int w, lStart, l, t;\n    int buttonHeight = 33;\n\n \
  \   // 通过尝试错误找到\n    // 搜索按钮\n    // 确定按钮宽度 - 每行 13 个\n    w = Convert.ToInt32(this.ClientSize.Width\
  \ / 14);\n\n    // 在表单上居中按钮\n    lStart = Convert.ToInt32(0.5 * (this.ClientSize.Width\
  \ - 13 * w));\n    l = lStart;\n    t = grdBooks.Top + grdBooks.Height + 2;\n\n\
  \    // 创建并定位 26 个按钮\n    for (int i = 0; i < 26; i++)\n    {\n        // 创建新推按钮\n\
  \        btnRolodex[i] = new Button();\n        btnRolodex[i].TabStop = false;\n\
  \        // 设置文本属性\n        btnRolodex[i].Text = ((char) (65 + i)).ToString();\n\
  \        // 位置\n        btnRolodex[i].Width = w;\n        btnRolodex[i].Height =\
  \ buttonHeight;\n        btnRolodex[i].Left = l;\n        btnRolodex[i].Top = t;\n\
  \n        // 设置酷炫颜色\n        btnRolodex[i].BackColor = Color.Blue;\n        btnRolodex[i].ForeColor\
  \ = Color.White;\n\n        // 将按钮添加到表单\n        this.Controls.Add(btnRolodex[i]);\n\
  \n        // 添加事件处理器\n        btnRolodex[i].Click += new\n        System.EventHandler(this.btnSQL_Click);\n\
  \n        // 下一个左\n        l += w;\n        if (i == 12)\n        {\n          \
  \  // 移动到下一行\n            l = lStart;\n            t += buttonHeight;\n        }\n\
  \    }\n\n    // 构建基础 SQL 语句\n    SQLAll = \"SELECT Authors.Author,Titles.Title,Publishers.Company_Name\
  \ \";\n    SQLAll += \"FROM Authors, Titles, Publishers, Title_Author \";\n    SQLAll\
  \ += \"WHERE Titles.ISBN = Title_Author.ISBN \";\n    SQLAll += \"AND Authors.Au_ID\
  \ = Title_Author.Au_ID \";\n    SQLAll += \"AND Titles.PubID = Publishers.PubID\
  \ \";\n\n    // 显示表单并初始点击所有记录\n    this.Show();\n    btnAll.PerformClick();\n}\n\
  ```\n\n此例程创建了连接对象并使用 `btnRolodex` 数组建立了 A 到 Z 的搜索按钮。它确定了按钮宽度并相应放置。研究执行此操作的代码——它非常有用。此例程还构建了从数据库获取作者、标题和出版商的默认\
  \ SQL 语句。注意，语句是分阶段构建的，每个阶段向语句添加另一个子句。特别注意，每个随后的子句末尾都有空格，以确保关键字之间没有“粘连”。最后，通过“点击”\
  \ `btnAll` 控件显示所有记录。\n\n### 6. `frmBooks_FormClosing` 方法的代码：\n\n```csharp\nprivate\
  \ void frmBooks_FormClosing(object sender,\nFormClosingEventArgs e)\n{\n    booksConnection.Close();\n\
  \    booksConnection.Dispose();\n}\n```\n\n### 7. `btnSQL_Click` 方法的代码（处理所有控制按钮的\
  \ Click 事件）：\n\n```csharp\nprivate void btnSQL_Click(object sender, EventArgs e)\n\
  {\n    OleDbCommand resultsCommand = null;\n    OleDbDataAdapter resultsAdapter\
  \ = new\n    OleDbDataAdapter();\n    DataTable resultsTable = new DataTable();\n\
  \    String SQLStatement;\n\n    // 确定点击了哪个按钮并形成 SQL 语句\n    Button buttonClicked\
  \ = (Button) sender;\n    switch (buttonClicked.Text)\n    {\n        case \"Show\
  \ All Records\":\n            SQLStatement = SQLAll;\n            break;\n     \
  \   case \"Z\":\n            // 点击 Z\n            // 追加 SQLAll 以限制记录为 Z 字母\n   \
  \         SQLStatement = SQLAll + \"AND Authors.Author > 'Z' \";\n            break;\n\
  \        default:\n            // 点击了除 Z 以外的字母键\n            // 追加 SQLAll 以限制记录为点击的字母\n\
  \            int index = (int) (Convert.ToChar(buttonClicked.Text)) - 65;\n    \
  \        SQLStatement = SQLAll + \"AND Authors.Author > '\" + btnRolodex[index].Text\
  \ + \" ' \";\n            SQLStatement += \"AND Authors.Author < '\" + btnRolodex[index\
  \ + 1].Text + \" ' \";\n            break;\n    }\n    SQLStatement += \"ORDER BY\
  \ Authors.Author\";\n\n    // 应用 SQL 语句\n    try\n    {\n        // 建立命令对象和数据适配器\n\
  \        resultsCommand = new OleDbCommand(SQLStatement, booksConnection);\n   \
  \     resultsAdapter.SelectCommand = resultsCommand;\n        resultsAdapter.Fill(resultsTable);\n\
  \n        // 绑定网格视图到数据表\n        grdBooks.DataSource = resultsTable;\n    }\n  \
  \  catch (Exception ex)\n    {\n        MessageBox.Show(ex.Message, \"Error in Processing\
  \ SQL\",\n        MessageBoxButtons.OK, MessageBoxIcon.Error);\n    }\n    resultsCommand.Dispose();\n\
  \    resultsAdapter.Dispose();\n    resultsTable.Dispose();\n}\n```\n\n\n\n\n2.\
  \ 保存（位于 `VCSDB\\Code\\Class 4` 文件夹下的 Example 4-3 文件夹中）并运行你的应用程序。现在，尝试操作。使用 SQL 检查八张表（`Categories`、`Customers`、`Employees`、`Order\
  \ Details`、`Orders`、`Products`、`Shippers`、`Suppliers`）。检查每个字段。尝试从表中选择特定字段。尝试对结果排序。尝试组合表以显示各种信息。尝试使用\
  \ SQL 聚合函数进行计算。使用 Access 或数据向导生成 SQL 语句。将这些语句剪粘贴到 `SQL Tester` 中尝试。\n\n以下是查找 `Customers`\
  \ 表中所有字段的结果：\n\n![Image](img/00002.jpeg)\n\n这里是 `Products` 表相同的结果：\n\n![Image](img/00097.jpeg)\n\
  \n## 示例 4-3：使用 SQL Server 数据库\n\n如下所示修改示例 4-1 的 SQL Server 版本：\n\n1. SQL Server\
  \ 版本的数据库是 `SQLNWindDB.mdf`。确保 `SQLNWindDB.mdf` 位于你的工作目录。\n\n2. 在 `frmSQLTester_Load`\
  \ 方法中，使用此连接对象：\n\n```csharp\nNWindConnection = new SqlConnection(\"DataSource=.\\\
  \\SQLEXPRESS;AttachDbFilename=c:\\\\VCSDB\\\\Working\\\\SQLNWindDB.mdf;Integrated\
  \ Security=True; Connect Timeout=30; User Instance=True\");\n```\n\n## Visual C#\
  \ 界面设计\n\n### 复与预览\n\n在课程的目前阶段，我们可以使用 Visual C# 连接到数据库，SQL 语句允许我们获取任何所需的数据库信息视图。但，这就是我们能做的全部——查看数据。\n\
  \n我们现在想知道如何允许用户与数据交互——获取替代视图、修改它、添加它、删除它。为了实现这一点，我们需要一个良好的用户界面。\n\n在本章中，我们将查看 Visual\
  \ C# 前端的一些设计考虑因素。我们将检查构建实用用界面和应用程序所需的工具箱控件和 Visual C# 编码技术。几个示例将阐明这些工具和技术的使用。\n\n\
  ### 界面设计哲学\n\n适当应用程序界面的设计哲学非常基础——尽可能简单、尽可能直观。通过这样做，你将为你自己（程序员）和你的用户节省很多问题。这可能是一句显而易见的话，但你会对有多少程序员不遵循这一点感到惊讶。\n\
  \n第一个考虑因素应该是确定你想让应用程序执行的进程和函数。输入和输出是什么？为你所有应用程序的进程开发一个框架或流程图。数据库界面的可能功能包括：数据输入、搜索、删除信息、添加信息、编辑信息、数据排序和打印功能。\n\
  \n决定是否需要多个表单。决定你需要 Visual C# 工具箱中的哪些控件。内置的 Visual C# 工具和函数能满足你的需求吗？你是否需要开发一些自己的工具或函数？你是否需要获取一些第三方控件？\n\
  \n尽可能地减少用户出错的可能。这是一个非常重要的步骤。用户可能犯的错误越少，你必须做的错误检查就越少。如果特定的输入需要数值数据，确保用户无法输入他的姓名。当可以使用“点点击”类型的工具来代替需要用户输入内容的工具时，请选择它们。例如，让用户点击一年的某个月，而不是让用户输入月份。如果你可以避免让用户输入任何内容，就这样做吧！每一个“输入输入”都需要某种验证，这意味着你方面需要进行额外工作。\n\
  \n在应用程序的所有步骤中，让用户直观地知道他们应该做什么。不要让用户猜测或让用户猜测。作为程序员，你控制信息从用户到程序以及反向流动。始终保持这种控制。尝试预测用户在使用你的应用程序时可能出错的所有方式。编写一个在用户一切都正确操作时运行良好的应用程序是容易的。编写一个能够处理用户可能执行的所有错误且不崩溃的应用程序是很困难。而且，尽管困难，但它是直观的，只需遵循你的常识即可。\n\
  \n让你的界面对用户有吸引力。使用可以接受的颜色，不要沉溺于过多的字体类型。确保没有拼写错误（这是我个人的小癖）。使界面与其他 Windows 应用程序保持一致。在程序设计中，熟悉感是好的。从其他应用程序中“借用”想法是完全合理的。\n\
  \n虽然不是用户看到的界面的一部分，但你应该让你的代码具有可读性和可追溯性——未来的代码修改者将感谢你。选择有意义的变量和控件名称。使用注释来解释你正在做什么。考虑开发可重用的代码——在你当前开发之外的实用模块。这将在未来的开发中节省你的时间。\n\
  \n在发布之前完全调试你的应用程序。没有什么比用户打电话给你指出应用程序中的缺陷更糟糕的事情了。找到所有 Bug 的好方法是让几个人尝试代码——一个微型的测试程序。让我们用一个示例来说说明这些哲学。\n\
  \n## 示例 5-1：重新回顾邮件列表\n\n打开并运行第 1 章构建的邮件列表示例（示例 1-1，也保存在 `VCSDB\\Code\\Class 5` 文件夹下的\
  \ Example 5-1 文件夹中）。它说明了刚刚提到的许多界面设计哲学。注意程序流——它是如何指导用户做什么并尽量减少错误可能性的。特别注意：\n\n> ⇒\
  \ 除非计时启动，否则无法输入地址信息（通过 `grpMail` 的 `Enabled` 属性控制）。\n\n> ⇒ 当地址信息框激活时，光标出现在第一个文本框中，让用户首先输入姓名（通过\
  \ `txtName` 文本框 `Focus` 方法控制）。\n\n> ⇒ 在每个文本框中输入信息后，按 `<Enter>` 或 `<Tab>` 会移动到下一个文本框（通过\
  \ `Focus` 方法控制）。\n\n> ⇒ 当用户在最后一个文本框（`Zip`）中输入后，焦点移动到接受按钮，因此简单的 `<Enter>` 即可接受标签（对\
  \ `btnAccept` 按钮使用 `Focus`）。\n\n注意程序流如何引导用户完成输入过程。关于应用程序的计时部分，注意暂停按钮初始是灰色的（`Enabled`\
  \ 为 `False`），只有在计时运行时才是激活的（`Enabled` 为 `True`）。其他计时器控件相应切换。\n\n此应用程序也对输入进行了一些验证。如果没有输入五个值，就会弹出一个消息框通知用户他的错误。而且，当\
  \ `txtZip` 激活时，只能输入数字（在 `KeyPress` 事件中完成）。这是邮政编码框，只能输入数字。可能更妥妥的方法是确保输入的邮编符合五位或九位邮政编码格式。另一种可能的验证是提供一个包含\
  \ 50 个州的列表框控件（向我们的外国读者道歉，使用了一个地方性的示例）供选择，而不是让用户输入州名。\n\n\n\n\n构建 Visual C# 界面的第一步是在表单（form）上“绘制”应用程序。我们在表单上放置所需的控件，设置属性，并为所需的事件和通用方法编写\
  \ C# 代码。作为界面设计人员，您需要决定哪些控件在效率、适用性以及最大限度减少错误可能性方面最能满足您的需求。\n\n在本节中，我们将简要回顾标准的 Visual\
  \ C# 控件。我们将检查它们可能如何在数据库“前端”中被使用，并介绍与这些控件相关的一些重要属性、事件和方法。这些信息将作为对 Visual C# 工具箱中可用内容的快速回顾——一个关于标准控件及其如何与数据库配合使用的“一站式”参考。稍后对更高级控件的查看将完成该参考指南。\n\
  \n## 表单控件 (Form Control)\n\n`Form` 是绘制用户界面的地方。无论是用于数据库还是其他用途，它是 Visual C# 应用程序的核心。\n\
  \n### 表单属性 (Form Properties)\n\n| Name | Description |\n| :--- | :--- |\n| `Name`\
  \ | 获取或设置表单名称（表单名的三字母前缀为 `frm`）。 |\n| `AcceptButton` | 获取或设置表单上的按钮，当用户按下 `<Enter>`\
  \ 键时点击。 |\n| `BackColor` | 获取或设置表单的背景颜色。 |\n| `CancelButton` | 获取或设置按钮控件，当用户按下 `<Esc>`\
  \ 键时点击。 |\n| `ControlBox` | 获取或设置一个值，指示是否在表单的标题栏中显示控制框。 |\n| `Enabled` | 如果为 False，则表单上的所有控件都被禁用。\
  \ |\n| `Font` | 获取或设置字体名称、样式、大小。 |\n| `ForeColor` | 获取或设置文本或图形的颜色。 |\n| `BorderStyle`\
  \ | 设置表单边框为固定或可调整大小。 |\n| `Height` | 表单的高度（以像素为单位）。 |\n| `Help` | 获取或设置一个值，指示是否在表单标题框中显示帮助按钮。\
  \ |\n| `Icon` | 获取或设置表单的图标。 |\n| `Left` | 从屏幕左侧到表单左边缘的距离（以像素为单位）。 |\n| `MaximizeButton`\
  \ | 获取或设置一个值，指示是否在表单标题栏中显示最大化按钮。 |\n| `MinimizeButton` | 获取或设置一个值，指示是否在表单标题栏中显示最小化按钮。\
  \ |\n| `StartPosition` | 获取或设置应用程序运行时表单的起始位置。 |\n| `Text` | 获取或设置表单窗口标题。 |\n| `Top`\
  \ | 从屏幕顶部到表单顶部边缘的距离（以像素为单位）。 |\n| `Width` | 表单的宽度（以像素为单位）。 |\n\n### 表单方法 (Form Methods)\n\
  \n| Name | Description |\n| :--- | :--- |\n| `Close` | 关闭表单。 |\n| `Focus` | 将焦点设置为表单。\
  \ |\n| `Hide` | 隐藏表单。 |\n| `Refresh` | 强制表单立即重绘自身。 |\n| `Show` | 通过将 `Visible` 属性设置为\
  \ `True` 使表单显示。 |\n\n调用方法的普通语法是输入控件名称、一个点号、然后是方法名。对于表单方法，使用的名称是 `this`。这是一个 Visual\
  \ C# 关键字，用于引用表单。因此，要关闭表单，请使用：\n\n```\nthis.Close();\n```\n\n### 表单事件 (Form Events)\n\
  \n| Name | Description |\n| :--- | :--- |\n| `Activated` | 当在代码中或通过用户激活表单时发生。 |\n\
  | `Click` | 当用户点击表单时发生。 |\n| `FormClosing` | 当表单正在关闭时发生。 |\n| `DoubleClick` | 当双击表单时发生。\
  \ |\n| `Load` | 在表单首次显示之前发生。 |\n| `Paint` | 当表单被重绘时发生。 |\n\n`Form` 对象的典型用法（对于本章及后续章节中的每个控件，我们都提供有关该控件通常如何被使用的信息）：\n\
  \n- ➢ 设置 `Name` 和 `Text` 属性\n- ➢ 设置 `StartPosition` 属性（在本课程中，此属性几乎总是被设置为 `CenterScreen`）\n\
  - ➢ 将 `BorderStyle` 设置为某个值。在本课程中，我们将主要使用 `FixedSingle` 表单。在 Visual C# 中，你可以拥有可调整大小的表单（并且有有用的属性可以帮助完成此任务），但我们将在课程中不可调整大小的表单。\n\
  - ➢ 在表单的 `Load` 事件中编写任何需要的初始化代码。要在代码窗口中访问此事件，请双击表单。\n\n## 按钮控件 (Button Control)\n\
  \n![Image](img/00462.jpeg)\n\n按钮可能是使用最广泛的控件。它被用于开始、中断或结束特定的过程。在数据库中，它被用于在记录之间导航、添加记录和删除记录。\n\
  \n### 按钮属性 (Button Properties)\n\n| Name | Description |\n| :--- | :--- |\n| `Name`\
  \ | 获取或设置按钮的名称（按钮名的三字母前缀为 `btn`）。 |\n| `BackColor` | 获取或设置按钮的背景颜色。 |\n| `Enabled`\
  \ | 如果为 False，按钮可见，但无法接受点击。 |\n| `Font` | 获取或设置字体名称、样式、大小。 |\n| `ForeColor` | 获取或设置文本或图形的颜色。\
  \ |\n| `Image` | 获取或设置显示在按钮控件上的图像。 |\n| `Text` | 获取或设置显示在按钮上的文本。 |\n| `TextAlign`\
  \ | 获取或设置文本的对齐方式。 |\n\n### 按钮方法 (Button Methods)\n\n| Name | Description |\n| :---\
  \ | :--- |\n| `Focus` | 将焦点设置为按钮。 |\n| `PerformClick` | 生成 `Click` 事件。 |\n\n###\
  \ 按钮事件 (Button Events)\n\n| Name | Description |\n| :--- | :--- |\n| `Click` | 当用户点击或选择按钮时发生。\
  \ |\n\n## 标签控件 (Label Control)\n\n![Image](img/00462.jpeg)\n\n标签是一种用于显示在设计时输入、运行时由用户输入或在代码内分配信息的控件。显示的文本可以更改。\n\
  \n### 标签属性 (Label Properties)\n\n| Name | Description |\n| :--- | :--- |\n| `Name`\
  \ | 获取或设置标签的名称（标签的三字母前缀为 `lbl`）。 |\n| `AutoSize` | 获取或设置一个值，指示标签是否自动调整大小以显示内容。 |\n\
  | `BackColor` | 获取或设置标签的背景颜色。 |\n| `BorderStyle` | 获取或设置标签的边框样式。 |\n| `Font` | 获取或设置字体名称、样式、大小。\
  \ |\n| `ForeColor` | 获取或设置文本或图形的颜色。 |\n| `Text` | 获取或设置显示在标签上的字符串。 |\n| `TextAlign`\
  \ | 获取或设置文本的对齐方式。 |\n\n注意，默认情况下标签控件没有调整句柄。要调整标签，请将 `AutoSize` 设置为 `False`。\n\n###\
  \ 标签方法 (Label Methods)\n\n| Name | Description |\n| :--- | :--- |\n| `Refresh` |\
  \ 强制更新标签。 |\n\n### 标签事件 (Label Events)\n\n| Name | Description |\n| :--- | :---\
  \ |\n| `Click` | 当用户点击标签时发生。 |\n| `DoubleClick` | 当用户双击标签时发生。 |\n\n标签用于静态显示的典型用法：\n\
  \n- ➢ 设置 `Name`（静态显示不需要）和 `Text` 属性。\n- ➢ 您可能想更改 `Font`、`BackColor` 和 `ForeColor`\
  \ 属性。\n\n标签用于更改显示的典型用法：\n\n- ➢ 设置 `Name` 属性。初始化 `Text` 为所需的字符串。\n- ➢ 将 `AutoSize`\
  \ 设置为 `False`，调整控件并选择所需的 `TextAlign` 值。\n- ➢ 在需要代码中分配 `Text` 属性（`String` 类型）。\n\
  - ➢ 您可能想更改 `Font`、`BackColor` 和 `ForeColor` 属性。\n\n## 文本框控件 (TextBox Control)\n\n\
  ![Image](img/0467.jpeg)\n\n文本框用于显示设计时输入、运行时由用户输入或在代码内分配的信息。显示的文本可以编辑。这是数据库应用程序中用于编辑字段的工具。\n\
  \n### TextBox 属性 (TextBox Properties)\n\n| Name | Description |\n| :--- | :--- |\n\
  | `Name` | 获取或设置文本框的名称（文本框名的三字母前缀为 `txt`）。 |\n| `BackColor` | 获取或设置文本框的背景颜色。 |\n\
  | `BorderStyle` | 获取或设置文本框的边框样式。 |\n| `Font` | 获取或设置字体名称、样式、大小。 |\n| `ForeColor`\
  \ | 获取或设置文本或图形的颜色。 |\n| `HideSelection` | 获取或设置一个值，指示当控件失去焦点时文本框中的选中文本是否保持高亮。 |\n\
  | `Lines` | 获取或设置文本框控件中的行。 |\n| `MaxLength` | 获取或设置用户可以在文本框中输入的最大字符数。 |\n\n\n\n\n\
  \n| 属性 | 描述 |\n| :--- | :--- |\n| `MultiLine` | 获取或设置一个值，表示这是否为多行文本框控件。 |\n| `PasswordChar`\
  \ | 获取或设置用于掩码单行 `TextBox` 控件中密码字符的字符。 |\n| `ReadOnly` | 获取或设置一个值，表示文本框中的文本是否为只读。\
  \ |\n| `ScrollBars` | 获取或设置在多行 `TextBox` 控件中应显示哪些滚动条。 |\n| `SelectedText` | 获取或设置一个值，表示控件中当前选中的文本。\
  \ |\n| `SelectionLength` | 获取或设置文本框中选中的字符数。 |\n| `SelectionStart` | 获取或设置文本框中选中文本的起始点。\
  \ |\n| `Text` | 获取或设置文本框中的当前文本。 |\n| `TextAlign` | 获取或设置文本框中文本的对齐方式。 |\n| `TextLength`\
  \ | 获取文本框中文本的长度。 |\n\n### TextBox 方法\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `AppendText()`\
  \ | 在文本框的当前文本后追加文本。 |\n| `Clear()` | 清除文本框中的所有文本。 |\n| `Focus()` | 将光标置于指定的文本框中。\
  \ |\n| `SelectAll()` | 选中文本框中的所有文本。 |\n| `Undo()` | 撤销文本框中的最后编辑操作。 |\n\n### TextBox\
  \ 事件\n\n| 事件 | 描述 |\n| :--- | :--- |\n| `KeyDown` | 当控件获得焦点并按下按键时发生。 |\n| `KeyPress`\
  \ | 当控件获得焦点并按下按键时发生 – 用于按键拦截。 |\n| `Leave` | 当用户离开文本框时触发。这是编辑后检查文本框内容的好地方。 |\n|\
  \ `TextChanged` | 当 `Text` 属性值发生变化时发生。 |\n\n#### TextBox 控件作为显示控件的典型用法：\n\n- 设置\
  \ `Name` 属性。初始化 `Text` 属性为所需的字符串。\n- 将 `ReadOnly` 属性设置为 `True`。\n- 如果要显示多行，将 `MultiLine`\
  \ 属性设置为 `True`。\n- 在需要的地方在代码中为 `Text` 属性赋值。\n- 你可能还想更改 `Font`、`BackColor` 和 `ForeColor`\
  \ 属性。\n\n#### TextBox 控件作为输入设备的典型用法：\n\n- 设置 `Name` 属性。初始化 `Text` 属性为所需的字符串。\n-\
  \ 如果可能输入多行，将 `MultiLine` 属性设置为 `True`。\n- 在代码中，需要时给控件设置 `Focus`。在 `KeyPress` 事件中提供按键拦截代码。在\
  \ `Leave` 事件发生时读取 `Text` 属性。\n- 你可能还想更改 `Font`、`BackColor` 和 `ForeColor` 属性。\n\n\
  ## CheckBox 控件\n\n![Image](img/00112.jpeg)\n\n复选框提供了一种从潜在候选列表中进行选择的方法。一组选择中的某些、全部或一个都不一个可以被选中。在数据库中，复选框用于各种选择。\n\
  \n### CheckBox 属性\n\n| 属性 | 描述 |\n| :--- | :--- |\n| `Name` | 获取或设置复选框的名称（复选框名称的三字母前缀为\
  \ `chk`）。 |\n| `AutoSize` | 获取或设置一个值，表示复选框是否自动调整大小以显示其全部内容。 |\n| `BackColor` | 获取或设置复选框背景颜色。\
  \ |\n| `Checked` | 获取或设置一个值，表示复选框是否处于选中状态。 |\n| `Font` | 获取或设置字体名称、样式、大小。 |\n| `ForeColor`\
  \ | 获取或设置文本或图形的颜色。 |\n| `Text` | 获取或设置显示在复选框旁字符串。 |\n| `TextAlign` | 获取或设置复选框文本的对齐方式。\
  \ |\n\n### CheckBox 方法\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `Focus()` | 将焦点移至此复选框。\
  \ |\n\n### CheckBox 事件\n\n| 事件 | 描述 |\n| :--- | :--- |\n| `CheckedChanged` | 当 `Checked`\
  \ 属性的值发生变化时（无论是在代码中还是点击复选框）。 |\n| `Click` | 当点击复选框时触发。`Checked` 属性由 Visual C# 自动更改。\
  \ |\n\n#### CheckBox 控件的典型用法：\n\n- 设置 `Name` 和 `Text` 属性。初始化 `Checked` 属性。\n- 监控\
  \ `Click` 或 `CheckedChanged` 事件以确定何时点击按钮。任何时候读取 `Checked` 属性以确定复选框状态。\n- 你可能还想更改\
  \ `Font`、`BackColor` 和 `ForeColor` 属性。\n\n## RadioButton 控件\n\n![Image](img/00466.jpeg)\n\
  \n单选按钮提供了在一组潜在候选选项中进行互斥选择的能力。因此，单选按钮作为一个一组工作，其中只有一个可以具有 `True`（或选中）值。表单上的单选按钮作为一个独立组工作，面板和分组框内的单选按钮组也是如此。单选按钮不是数据绑定控件，但它们仍可以用于数据库接口中的各种选项。\n\
  \n### RadioButton 属性\n\n| 属性 | 描述 |\n| :--- | :--- |\n| `Name` | 获取或设置单选按钮的名称（单选按钮名称的三字母前缀为\
  \ `rdo`）。 |\n| `AutoSize` | 获取或设置一个值，表示单选按钮是否自动调整大小以显示其全部内容。 |\n| `BackColor` |\
  \ 获取或设置单选按钮背景颜色。 |\n| `Checked` | 获取或设置一个值，表示单选按钮是否被选中。 |\n| `Font` | 获取或设置字体名称、样式、大小。\
  \ |\n| `ForeColor` | 获取或设置文本或图形的颜色。 |\n| `TextAlign` | 获取或设置单选按钮文本的对齐方式。 |\n\n###\
  \ RadioButton 方法\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `Focus()` | 将焦点移至此单选按钮。 |\n\
  | `PerformClick()` | 产生 `Click` 事件模拟点击。 |\n\n### RadioButton 事件\n\n| 事件 | 描述 |\n\
  | :--- | :--- |\n| `CheckedChanged` | 当 `Checked` 属性的值发生变化时（无论是在代码中还是点击复选框）。 |\n\
  | `Click` | 当点击单选按钮时触发。`Checked` 属性由 Visual C# 自动更改。 |\n\n#### RadioButton 控件的典型用法：\n\
  \n- 一组单选按钮。\n- 为组中的每个按钮设置 `Name` 和 `Text` 属性（可能更改 `Font`、`BackColor` 和 `ForeColor`\
  \ 属性）以及 `Text` 属性。\n- 初始化 `Checked` 属性为 `True`。\n- 监控 `Click` 或 `CheckedChanged`\
  \ 事件以确定何时点击按钮。最后点击的按钮将具有 `Checked` 属性。 |\n\n## GroupBox 控件\n\n![Image](img/0231.jpeg)\n\
  \n分组框提供了一种对相关控件的方法。分组框内的单选按钮与其他单选按钮独立工作。\n\n### Group 属性\n\n| 属性 | 描述 |\n| :---\
  \ | :--- |\n| `Name` | 获取或设置分组框的名称（分组框名称的三字母前缀为 `grp`）。 |\n| `BackColor` | 获取或设置分组框背景颜色。\
  \ |\n| `Enabled` | 获取或设置表示分组框是否启用。如果为 `False`，分组框中的所有控件都被禁用。 |\n| `Font` | 获取或设置字体名称、样式、大小。\
  \ |\n| `ForeColor` | 获取或设置文本颜色。 |\n| `Text` | 获取或设置显示在分组框标题区域的字符串。 |\n| `Visible`\
  \ | 如果为 `False`，则隐藏分组框（及其所有控件）。 |\n\n分组框控件有一些方法和事件，但这些很少使用。我们更关注与分组框中的控件相关的方法和事件。\n\
  \n#### GroupBox 控件的典型用法：\n\n- 设置 `Name` 和 `Text` 属性。\n- 将所需的控件放入分组框中。\n- 使用通常的技术监控分组框内控件的事件。\n\
  \n## Panel 控件\n\n![Image](img/00088.jpeg)\n\n面板（Panel）控件是另一种 Visual C# 分组控件。它的行为与分组框控件几乎相同。面板控件缺少\
  \ `Text` 属性（标题信息），但具有可选的滚动功能。面板内的单选按钮作为一个独立组工作。面板控件还可以用于显示图形（线条、曲线、形状、动画）。\n\n###\
  \ Panel 属性\n\n| 属性 | 描述 |\n| :--- | :--- |\n| `Name` | 获取或设置面板的名称（面板名称的三字母前缀为 `pnl`）。\
  \ |\n| `AutoScroll` | 获取或设置一个值，表示面板是否允许用户滚动到放置在其可见边界之外的控件。 |\n| `BackColor` | 获取或设置面板背景颜色。\
  \ |\n| `BorderStyle` | 获取或设置面板边框样式。 |\n\n\n\n\n\n| 属性 | 说明 |\n| :--- | :--- |\n\
  | 启用 (Enabled) | 获取或设置指示面板是否启用的值。如果为 False，面板中的所有控件均禁用。 |\n| 可见 (Visible) | 如果为\
  \ False，隐藏面板（及其所有控件）。 |\n\n类似于 `GroupBox` 控件，`Panel` 控件也有一些方法和事件，但这些很少被使用（我们将在后面的图形章节中看到一些\
  \ `Panel` 事件）。我们通常只关心面板内控件相关的方法和事件。\n\n### Panel 控件的典型用法：\n\n* ➢ 设置 `Name` 属性。\n\
  * ➢ 将所需的控件放置在面板 控件中。\n* ➢ 使用常规技术监控面板内控件的事件。\n\n## PictureBox 控件\n\n![Image](img/00248.jpeg)\n\
  \nPictureBox（PictureBox）允许你在表单上放置图形信息。在数据库中，图片框用于存储图形数据。\n\n### PictureBox 属性：\n\
  \n| 属性名称 | 说明 |\n| :--- | :--- |\n| `Name` | 获取或设置图片框的名称（图片框名称的三字母前缀为 `pic`）。 |\n\
  | `BackColor` | 获取或设置图片框的背景颜色。 |\n| `BorderStyle` | 指明图片框的边框样式。 |\n| `Height` |\
  \ 图片框的高度（单位为像素）。 |\n| `Image` | 建立要在图片框中显示的图形文件（jpeg, gif, bmp 文件）。 |\n| `Left`\
  \ | 从表单左边缘到图片框左边缘的距离（单位为像素）。 |\n| `SizeMode` | 指明图像显示方式。 |\n| `Top` | 从表单标题栏底部到图片框顶边缘的距离（单位为像素）。\
  \ |\n| `Width` | 图片框的宽度（单位为像素）。 |\n\n### PictureBox 事件：\n\n| 事件 | 说明 |\n| :--- |\
  \ :--- |\n| `Click` | 当图片框被点击时触发。 |\n\n### 使用 PictureBox 控件显示图片的典型用法：\n\n* ➢ 设置\
  \ `Name` 和 `SizeMode` 属性（最常用的是 `StretchImage`）。\n* ➢ 设置 `Image` 属性，可以在设计模式或运行时设置，记住图标文件不会自动显示。\n\
  \n## 示例 5-2: 作者表输入表单\n\n在第 6 章中，我们将为书籍数据库构建一个完整的数据库管理系统。数据库中的每个表都需要某种输入表单。在本章中，我们为\
  \ `Authors`（作者）表构建这样一个表单。尽管这是一个非常简单的表（只有三个字段：`Au_ID`、`Author`、`Year_Born`），但它为说明正确界面设计的许多步骤提供了极佳的基础。命令对象检索字段（按\
  \ `Author` 排序）所需的 SQL 语句是：\n\n```sql\nSELECT * FROM Authors ORDER BY Author\n```\n\
  \n我们需要一个输入表单，允许用户编辑现有记录、删除现有记录或添加新记录。表单还应允许在记录之间进行导航。要遵循的步骤如下：\n\n1. 启动新应用程序。我们需要三个标签（label）控件和三个文本框（textBox）来显示字段。我们需要两个按钮从一个记录移动到下一个。我们需要五个按钮来控制编辑功能，一个按钮允许我们停止编辑。将这些控件放置在表单上。布局类似于：\n\
  \n![Image](img/00251.jpeg)\n\n2. 为表单和控件设置这些属性：\n\n| 控件 | 属性 | 值 |\n| :--- | :---\
  \ | :--- |\n| `Form1` | `Name` | `frmAuthors` |\n| | `BorderStyle` | `FixedSingle`\
  \ |\n| | `StartPosition` | `CenterScreen` |\n| | `Text` | `Authors` |\n| `label1`\
  \ | `Text` | `Author ID` |\n| `textBox1` | `Name` | `txtAuthorID` |\n| | `BackColor`\
  \ | `White` |\n| | `ReadOnly` | `True` |\n| `label2` | `Text` | `Author Name` |\n\
  | `textBox2` | `Name` | `txtAuthorName` |\n| | `BackColor` | `White` |\n| | `ReadOnly`\
  \ | `True` |\n| `label3` | `Text` | `Year Born` |\n| `textBox3` | `Name` | `txtYearBorn`\
  \ |\n| | `BackColor` | `White` |\n| | `ReadOnly` | `True` |\n| `button1` | `Name`\
  \ | `btnPrevious` |\n| | `Text` | `<= Previous` |\n| `button2` | `Name` | `btnNext`\
  \ |\n| | `Text` | `Next =>` |\n| `button3` | `Name` | `btnEdit` |\n| | `Text` |\
  \ `&Edit` |\n| `button4` | `Name` | `btnSave` |\n| | `Text` | `&Save` |\n| `button5`\
  \ | `Name` | `btnCancel` |\n| | `Text` | `&Cancel` |\n| `button6` | `Name` | `btnAddNew`\
  \ |\n| | `Text` | `&Add New` |\n| `button7` | `Name` | `btnDelete` |\n| | `Text`\
  \ | `&Delete` |\n| `button8` | `Name` | `btnDone` |\n| | `Text` | `Do&ne` |\n\n\
  注意，我们“锁定”了（`ReadOnly = True`）所有的文本框。当我们（作为程序员）决定用户可以更改值时，我们将解锁它们（记住，我们掌握控制权）。此时，表单应显示如下：\n\
  \n![Image](img/00251.jpeg)\n\n3. 随着进度，我们将向此输入表单添加功能。当我们（作为程序员）决定用户可以更改值时，我们将解锁它们（记住，我们掌握控制权）。此时，表单应显示如下：\n\
  \n![Image](img/00251.jpeg)\n\n4. 在窗口顶部添加此行代码：\n\n```csharp\nusing System.Data.OleDb;\n\
  ```\n\n5. 表单级声明：\n\n```csharp\nOleDbConnection booksConnection;\nOleDbCommand authorsCommand;\n\
  OleDbDataAdapter authorsAdapter;\nDataTable authorsTable;\nCurrencyManager authorsManager;\n\
  ```\n\n6. 将此代码添加到 `frmAuthors_Load` 方法中：\n\n```csharp\nprivate void frmAuthors_Load(object\
  \ sender, EventArgs e)\n{\n    // 连接数据库\n    booksConnection = new OleDbConnection(\"\
  Provider=Microsoft.OLEDB.12.0; Data Source=c:\\\\VCSDB\\\\Working\\\\Books.accdb\"\
