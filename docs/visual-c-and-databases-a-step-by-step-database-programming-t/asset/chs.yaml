  \ \"Year_Born\");\n\n    // 建立货币管理器\n    authorsManager = (CurrencyManager)this.BindingContext[authorsTable];\n\
  }\n```\n\n7. 在事件添加此代码以关闭数据库连接：\n\n```csharp\nprivate void frmAuthors_Closing(object\
  \ sender, FormClosingEventArgs e)\n{\n    // 关闭连接\n    booksConnection.Close();\n\
  \n    // 释放对象\n    booksConnection.Dispose();\n    authorsCommand.Dispose();\n \
  \   authorsAdapter.Dispose();\n    authorsTable.Dispose();\n}\n```\n\n8. 为两个按钮编写\
  \ `Click` 事件代码以允许导航：\n\n```csharp\nprivate void btnPrevious_Click(object sender,\
  \ EventArgs e)\n{\n    authorsManager.Position--;\n}\n\nprivate void btnNext_Click(object\
  \ sender, EventArgs e)\n{\n    authorsManager.Position++;\n}\n```\n\n9. 保存应用程序（保存在\
