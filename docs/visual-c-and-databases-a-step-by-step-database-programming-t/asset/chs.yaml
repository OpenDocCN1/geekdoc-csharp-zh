  \ 我们将使用组合框以以下格式列出现有客户：\n\n`LastName, FirstName (CustomerID)`\n\n这将允许我们根据唯一的 `CustomerID`\
  \ 轻松地定位现有客户。当用户选择一个名称时，姓名和地址字段将自动填充。将此通用方法（`FillCustomers`）添加到项目中（此代码初始化了组合框中的列表）：\n\
  \n```csharp\nprivate void FillCustomers()\n{\n    if (customersTable.Rows.Count\
