  \n    // 释放对象\n    ordersCommand.Dispose();\n    ordersAdapter.Dispose();\n    ordersTable.Dispose();\n\
  }\n```\n\n### 5. 添加一个名为 `NewOrder` 的通用方法并使用此代码：\n\n```csharp\nprivate void NewOrder()\n\
  {\n    string IDString;\n    DateTime thisDay = DateTime.Now;\n    lblDate.Text\
  \ = thisDay.ToShortDateString();\n\n    // 构建字符串格式的订单 ID\n    orderNumber++;\n \
  \   IDString = thisDay.Year.ToString().Substring(2);\n    if (thisDay.Month < 10)\n\
  \        IDString += \"0\" + thisDay.Month.ToString();\n    else\n        IDString\
  \ += thisDay.Month.ToString();\n\n    if (thisDay.Day < 10)\n        IDString +=\
  \ \"0\" + thisDay.Day.ToString();\n    else\n        IDString += thisDay.Day.ToString();\n\
  \n    if (orderNumber < 10)\n        IDString += \"00\" + orderNumber.ToString();\n\
  \    else if (orderNumber < 100)\n        IDString += \"0\" + orderNumber.ToString();\n\
  \    else\n        IDString += orderNumber.ToString();\n\n    lblOrderID.Text =\
  \ IDString;\n}\n```\n\n此代码将今天的日期放在 `lblDate` 控件中，并生成一个新的 `orderID` 值。在我们的工作中，`orderID`\
  \ 的格式如下：前两个数字是年份，接下来的两个是月份，最后的三位是日期，随着订单号的增加而递增。例如，如果是 10 月 8 日，`orderID` 为 `2310008`（假设是\
  \ 2023 年且订单号为 8）。\n\n### 6. 将此代码放在 `btnExit_Click` 中：\n\n```csharp\nprivate void\
