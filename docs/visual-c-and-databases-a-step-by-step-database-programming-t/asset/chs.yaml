  \ `SQLWeatherDBBlank.mdf`（空数据库）。\n\n### 总结\n在本章中，我们开发了三个不同的数据库应用程序。每个应用程序都解决了你在开发自己的应用程序时可能会遇到的一些典型问题。\n\
  \n\n\n\n\n在你学习的这个阶段，你应该对 Visual C# 数据对象有了良好的理解。你已经熟练开发设计良好的 Visual C# 数据库接口。而且，你知道如何创建数据库和数据库报告。在课程的最后一个章节中，我们将讨论几个最后的主题，这些主题可以作为你成为高级数据库程序员的跳板。\n\
  \n# 11 其他数据库主题\n\n## 回顾与展望\n你基本上已经完成了 Visual C# 与数据库的课程。在这一阶段，你已经对使用 Visual C# 配合\
  \ Access 数据库有了良好的中级理解。但是，即使有了 700 页的笔记，仍有很多东西需要学习。\n\n在最后一章中，我们将查看几个不相关的主题。提供这些信息是为了帮助你提升\
  \ Visual C# 数据库程序员的技能。我们将讨论导出和导入数据库数据、与其它数据库类型工作、多用户考虑以及 Web 应用程序。本章中的示例仅使用 Access\
  \ 数据库。如果你正在使用 SQL Server 数据库，你现在应该具备修改这些示例以适用于你的数据库的能力。\n\n## 导出数据库数据\n任何应用程序（而是数据库应用程序）中的常见任务都是将信息从一个应用程序移动到另一个应用程序的能力。在本节中，我们将讨论从数据库导出数据。在下一节中，我们将涵盖相关的导入问题。数据可以通过多种格式进行传输。在这里，我们只讨论如何通过顺序磁盘文件传输数据。一种日益流行的格式是用于互联网的\
  \ XML 文件——如果你将在互联网上使用你的应用程序，你可能想研究一下这个。\n\n顺序文件是按行列出的数据列表。你可以使用任何文本编辑器查看顺序文件。我们将使用一种特殊类型的顺序文件——逗号分隔文件。该文件的\
  \ Windows 扩展名为 `csv`（逗号分隔变量），它是应用程序之间导出和导入数据最常用的格式。在处理数据库工作时，我们只需遍历数据表，对于每条记录，将所需的字段值写入文件的单行中，并用逗号分隔它们。\n\
  \n从数据库导出数据到顺序文件遵循的方法是：\n\n1. 打开数据库并使用 ADO .NET 数据对象建立数据库表。\n2. 打开所需的输出顺序文件（在文件名后使用\
  \ `csv` 扩展名）。\n3. 对于数据表中的每条记录，将所需的字段（用逗号分隔）写入输出文件。\n4. 关闭并保存顺序文件。\n\n我们知道如何建立数据表。让我们看看其他步骤。\n\
  \n用于导出和导入数据的方法位于 `System.IO` 命名空间中。因此，我们在代码窗口的顶部添加此行：\n\n```\nusing System.IO;\n\
  ```\n\n#### 打开顺序文件进行输出\n使用 Visual C# 语法打开顺序文件进行输出的方法是：\n\n```csharp\nStreamWriter\
  \ outputFile;\noutputFile = new StreamWriter(myFile);\n```\n\n其中 `myFile` 是要打开的文件名（一个字符串），`outputFile`\
  \ 是返回的用于向磁盘写入信息的 `StreamWriter` 对象。确保 `myFile` 具有 `csv` 扩展名。请注意，如果打开的文件已经存在，Windows\
  \ 操作系统做的第一件事就是删除现有文件！因此，请添加你可能需要的任何保护以避免擦掉需要的文件。一旦文件打开，就可以准备向其中写入数据了。\n\n如果数据导出功能是你的数据库应用程序不可或缺的一部分，应该使用打开文件对话框来获取顺序文件的路径。使用\
  \ `csv` 作为 `DefaultExt` 并检查覆盖权限。如果你只是为了快速的导出任务而使用文件，我们建议将顺序文件放在你的应用程序目录中。记得 `Application.StartupPath`\
  \ 属性提供了此路径。例如，为了作为 `outputFile` 打开我们应用程序目录中的 `test.csv`，我们将使用：\n\n```csharp\noutputFile\
  \ = new StreamWriter(Application.StartupPath + \"\\\\test.csv\");\n```\n\n#### 向顺序文件写入数据\n\
  一旦打开，向文件写入数据是一项简单任务。信息（变量或文本）以追加的方式写入顺序文件。每次追加都需要独立的 Visual C# 语句。\n\n对于一个作为 `outputFile`\
  \ 打开的文件，保存名为 `MyVariable` 变量的语法是：\n\n```csharp\noutputFile.Write(myVariable);\n\
  ```\n\n该语句将将指定的变量（我们数据库中的一个字段）追加到顺序文件的当前行中。使用 `Write` 输出，所有内容将将写在一个非常长的行中。对于 `csv`\
  \ 文件，我们在每条信息后在行尾追加一个逗号。\n\n三个字段 `field1`、`field2`、`field3` 的示例：\n\n```csharp\nStreamWriter\
  \ outputFile;\noutputFile = new StreamWriter(\"c:\\\\junk\\\\TestOut.csv\");\noutputFile.Write(field1);\n\
  outputFile.Write(\",\");\noutputFile.Write(field2);\noutputFile.Write(\",\");\n\
  outputFile.Write(field3);\n```\n\n此代码运行后，文件 `c:\\junk\\TestOut.txt` 将有一单行，所有三个字段都用逗号分隔。\n\
  \n在行完成后移动到新行，使用：\n\n```csharp\noutputFile.Write(outputFile.NewLine);\n```\n\n你应该知道，我们并不限于仅以逗号分隔格式导出数据。通过\
  \ Visual C#，我们可以按照任何所需的格式将数据写入文件。事实上，在某些情况下，应用程序可能需要非逗号分隔的文件。然而，我们在这里不会这样做。\n\n\
  #### 保存顺序文件\n当完成向文件的写入后，使用 `Close` 方法关闭文件。对于我们的示例，语法是：\n\n```csharp\noutputFile.Close();\n\
  ```\n\n一旦文件关闭，它将保存在磁盘上。\n\n## 示例 11-1 导出数据库数据\n在本示例中，我们将从第 9 和第 10 章学习的 `KWSalesDB.accdb`\
  \ 数据库导出逗号分隔文件。然后我们将生成的 `csv` 文件加载到 Microsoft Excel 中查看。这是典型的导出任务。记得客户表有以下字段：`CustomerID`、`FirstName`、`LastName`、`Address`、`City`、`State`\
  \ 和 `Zip`。\n\n1. 开始一个新的应用程序。在表单上放置一个按钮。设置这些属性：\n\n| Property | Value |\n| :--- |\
  \ :--- |\n| Form1 Name | frmExport |\n| BorderStyle | FixedSingle |\n| StartPosition\
  \ | CenterScreen |\n| Text | Export Data |\n| button1 Name | btnExport |\n| Text\
  \ | Export |\n\n我的表单看起来像这样：\n\n![Image](img/00155.jpeg)\n\n2. 将 `KWSalesDB.accdb`\
  \ 复制到工作目录 `VCSDB\\Code\\Class 10\\ `。该副本有一些客户可以查看。\n\n3. 在代码窗口顶部添加这些行：\n\n```csharp\n\
  using System.Data.OleDb;\nusing System.IO;\n```\n\n4. 创建对象的表级声明：\n\n```csharp\n\
  OleDbConnection KWSalesConnection;\nOleDbCommand customersCommand;\nOleDbDataAdapter\
  \ customersAdapter;\nDataTable customersTable;\n```\n\n5. 在 `frmExport_Load` 事件方法中添加此代码（假设\
  \ `KWSalesDB.accdb` 数据库在你的工作目录中）：\n\n```csharp\nprivate void frmExport_Load(object\
  \ sender, EventArgs e)\n{\n    // 连接数据库\n    KWSalesConnection = new OleDbConnection(\"\
  Provider=Microsoft.ACE.OLEDB.12.0; Data Source=c:\\\\VCSDB\\\\Working\\\\KWSalesDB.accdb\"\
  );\n    KWSalesConnection.Open();\n\n    // 建立命令对象\n    customersCommand = new OleDbCommand(\"\
  Select * from Customers\", KWSalesConnection);\n\n    // 建立数据适配器/数据表\n    customersAdapter\
  \ = new OleDbDataAdapter();\n    customersAdapter.SelectCommand = customersCommand;\n\
  \    customersTable = new DataTable();\n    customersAdapter.Fill(customersTable);\n\
  }\n```\n\n6. 在 `frmExport_FormClosing` 事件方法中添加代码以释放对象：\n\n```csharp\nprivate void\
  \ frmExport_FormClosing(object sender, FormClosingEventArgs e)\n{\n    // 关闭连接\n\
  \    KWSalesConnection.Close();\n\n    // 释放对象\n    KWSalesConnection.Dispose();\n\
  \    customersCommand.Dispose();\n    customersAdapter.Dispose();\n    customersTable.Dispose();\n\
  }\n```\n\n\n\n\n\n### 7. 将此代码放入 `btnExport_Click` 事件方法中：\n\n```csharp\nprivate void\
  \ btnExport_Click(object sender, EventArgs e)\n{\n    StreamWriter outputFile;\n\
  \    outputFile = new StreamWriter(Application.StartupPath + \"\\\\customer.csv\"\
  );\n    //写入表头\n    for (int n = 0; n < customersTable.Columns.Count; n++)\n   \
  \ {\n        outputFile.Write(customersTable.Columns[n]);\n        if (n < customersTable.Columns.Count\
  \ - 1)\n            outputFile.Write(\",\");\n    }\n    outputFile.Write(outputFile.NewLine);\n\
  \    // 写入所有字段\n    foreach (DataRow myRow in customersTable.Rows)\n    {\n    \
  \    for (int n = 0; n < customersTable.Columns.Count; n++)\n        {\n       \
  \     if (myRow[n] != null)\n                outputFile.Write(myRow[n].ToString());\n\
  \            if (n < customersTable.Columns.Count - 1)\n                outputFile.Write(\"\
  ,\");\n        }\n        outputFile.Write(outputFile.NewLine);\n    }\n    outputFile.Close();\n\
  }\n```\n\n在这段代码中，我们首先打开了顺序文件 `customer.csv`。我们将列表头写入文件。然后循环遍历数据表中的每一行。对于每条记录，我们将这七个字段写入文件。完成后，关闭文件（并保存）。\n\
  \n8. 保存（保存在 `VCSDB\\Code\\Class 11` 文件夹下的 Example 11-1 文件夹中）并运行应用程序。点击 `Export`。停止应用程序。进入\
  \ Windows 资源管理器，你应该能看到 `customer.csv` 保存在你的应用程序目录中（项目的 `Bin\\Debug` 文件夹）。双击该文件。Excel\
  \ 应该会启动，你将看到：\n\n![Image](img/00073.jpeg)\n\n数据已经从数据库移动到 Excel 中。我们现在可以使用此文件（结合\
  \ Microsoft Word 使用）来生成邮寄标签。`csv` 文件也可以用记事本打开。执行此操作，你将看到该文件逗号分隔的特性：\n\n![Image](img/00343.jpeg)\n\
  \n### 导入数据库数据\n\n另一个常见任务是从其他源获取数据并将其放入数据库。这就是数据导入问题。我们假设数据以某种顺序文件的形式存在。文件并不一定必须是逗号分隔的。只要我们知道文件的结构，就可以编写\
  \ Visual C# 代码来读取它。然而，在这里我们将假设文件是逗号分隔的。\n\n从顺序文件导入数据到数据库的方法是：\n\n1. 使用 `Access`\
  \ 或 `ADOX` 代码建立空的数据库数据表。\n2. 打开所需的输入顺序文件（将具有 `csv` 扩展名）。\n3. 对于数据表中的每条所需记录，从输入文件中读取所需的字段（用逗号分隔），并将它们提交到数据库。\n\
  4. 关闭顺序文件。\n\n再次，我们知道如何执行（或应该知道如何执行）必需的数据库任务。让我们来看看其他步骤。\n\n#### 打开顺序文件以供输入\n\n\
  用于打开顺序文件以供输入的 Visual C# 语法如下：\n\n```csharp\nStreamReader inputFile;\ninputFile =\
  \ new StreamReader(myFile);\n```\n\n其中 `myFile` 是指向正在打开的文件的完整路径（驱动器、目录、文件名），`inputFile`\
  \ 是一个 `StreamReader` 对象。\n\n#### 从顺序文件中读取数据\n\n一旦打开，数据将使用 `inputFile.ReadLine()`\
  \ 逐行读取（注意：原文在此处的逻辑较为碎片化，我根据 C# 的 `ReadLine` 标准模式进行了重构）：\n\n```csharp\nstring myLine;\n\
  while ((myLine = inputFile.ReadLine()) != null)\n{\n    //在此处进行处理逻辑\n}\n```\n\n\
  #### 关闭顺序文件\n\n当从文件中读取所有值后，将其关闭。\n\n```csharp\ninputFile.Close();\n```\n\n### 示例\
  \ 11-2: 导入数据\n\n回顾示例 10-1，我们的天气监控器示例。注意我们在此示例包含了两个数据库：`Sea02DB.accdb` 和 `Sea03DB.accdb`，分别包含了\
  \ 2002 年和 2003 年华盛顿州西雅图的天气信息。我们没有将这些信息输入数据库，它们是从文件中导入的。在这个示例中，我们展示了如何获取天气服务文件并将其加载到数据库中。\n\
  \n1. 首先，让我们看看顺序文件。打开位于 `VCSDB\\Code\\Class 11\\Example 11-2` 文件夹中的 `Sea02.txt`。使用记事本打开，该文件显示如下：\n\
  \n![Image](img/0018.jpeg)\n\n注意，文件有一行表头信息（我们将跳过这一行）。之后的每一行都包含最高温度、最低温度、降水量以及可能添加的任何注释。这四个值将加载到相应的数据库字段中。回想数据库有五个字段：`WeatherDate`、`HighTemp`、`LowTemp`、`Precip`\
  \ 和 `Comment`。显然，我们将在代码中生成 `WeatherDate` 字段（考虑到已知年份是 2002 年，这并不困难）。\n\n2. 一个新应用程序。在表单上放置一个按钮。设置这些属性：\n\
  \n| Form1: | |\n| :--- | :--- |\n| Name | `frmImport` |\n| BorderStyle | `FixedSingle`\
  \ |\n| StartPosition | `CenterScreen` |\n| Text | `Import Data` |\n| button1: |\
  \ |\n| Name | `btnImport` |\n| Text | `Import` |\n\n我的小表单看起来如下：\n\n![Image](img/00228.jpeg)\n\
  \n3. 为你的项目引用 `ADOX` 库。在代码窗口顶部添加这些行：\n\n```csharp\nusing ADOX;\nusing System.Data.OleDb;\n\
  using System.IO;\n```\n\n4. 为表单级别添加这些数据对象的声明：\n\n\n\n\n\n```cs\nOleDbConnection\
  \ weatherConnection;\nOleDbCommand weatherCommand;\nOleDbDataAdapter weatherAdapter;\n\
  DataTable weatherTable;\n```\n\n### 5. 将此代码放入 `btnImport_Click` 事件方法中：\n\n```cs\n\
  private void btnImport_Click(object sender, EventArgs e)\n{\n    Catalog weatherDatabase\
  \ = new Catalog();\n    Table databaseTable;\n    string databaseFile = Application.StartupPath\
  \ + \"\\\\Sea02DB.accdb\";\n    string dataFile = Application.StartupPath + \"\\\
  \\Sea02.txt\";\n    string dataYear = \"2002\";\n    // 创建空数据库\n    try\n    {\n\
  \        weatherDatabase.Create(\"Provider=Microsoft.ACE.OLEDB.12.0; Data Source\
  \ = \" + databaseFile);\n        // 创建表\n        databaseTable = new Table();\n\
  \        databaseTable.Name = \"Weather\";\n        // 添加字段\n        databaseTable.Columns.Append(\"\
  WeatherDate\", DataTypeEnum.adDate, 20);\n        databaseTable.Columns.Append(\"\
  HighTemp\", DataTypeEnum.adSingle, 10);\n        databaseTable.Columns.Append(\"\
  LowTemp\", DataTypeEnum.adSingle, 10);\n        databaseTable.Columns.Append(\"\
  Precip\", DataTypeEnum.adSingle, 10);\n        databaseTable.Columns.Append(\"Comment\"\
  , DataTypeEnum.adWChar, 50);\n        databaseTable.Columns[\"HighTemp\"].Attributes\
  \ = ColumnAttributesEnum.adColNullable;\n        databaseTable.Columns[\"LowTemp\"\
  ].Attributes = ColumnAttributesEnum.adColNullable;\n        databaseTable.Columns[\"\
  Precip\"].Attributes = ColumnAttributesEnum.adColNullable;\n        databaseTable.Columns[\"\
  Comment\"].Attributes = ColumnAttributesEnum.adColNullable;\n        // 主键\n   \
  \     databaseTable.Keys.Append(\"PK_Weather\", KeyTypeEnum.adKeyPrimary, \"WeatherDate\"\
  , null, null);\n        databaseTable.Indexes.Append(\"WeatherDate\", \"WeatherDate\"\
  );\n        weatherDatabase.Tables.Append(databaseTable);\n    }\n    catch (Exception\
  \ ex)\n    {\n        MessageBox.Show(ex.Message, \"Error Creating Database\",\n\
  \            MessageBoxButtons.OK, MessageBoxIcon.Error);\n    }\n    finally\n\
  \    {\n        weatherDatabase = null;\n    }\n    // 连接到数据库\n    weatherConnection\
  \ = new OleDbConnection(\"Provider=Microsoft.ACE.OLEDB.12.0; Data Source = \" +\
  \ databaseFile);\n    weatherConnection.Open();\n    weatherCommand = new OleDbCommand(\"\
  SELECT * FROM Weather ORDER BY WeatherDate\", weatherConnection);\n    weatherAdapter\
  \ = new OleDbDataAdapter();\n    weatherAdapter.SelectCommand = weatherCommand;\n\
  \    weatherTable = new DataTable();\n    weatherAdapter.Fill(weatherTable);\n \
  \   // 填充日期和其他字段\n    StreamReader inputFile = new StreamReader(dataFile);\n   \
  \ // 跳过第一行\n    inputFile.ReadLine();\n    DateTime tableDate = new DateTime(Convert.ToInt32(dataYear),\
  \ 1, 1);\n    DateTime nextYear = new DateTime(Convert.ToInt32(dataYear) + 1, 1,\
  \ 1);\n    int nDays = (nextYear - tableDate).Days;\n    DataRow newRow;\n    string\
  \ myLine, myVariable;\n    int cl;\n    for (int n = 1; n <= nDays; n++)\n    {\n\
  \        newRow = weatherTable.NewRow();\n        newRow[\"WeatherDate\"] = tableDate;\n\
  \        // 读取数据行并解析出四个字段\n        myLine = inputFile.ReadLine();\n        // 高温\n\
  \        cl = myLine.IndexOf(\",\");\n        myVariable = myLine.Substring(0, cl);\n\
  \        newRow[\"HighTemp\"] = Convert.ToSingle(myVariable);\n        myLine =\
  \ myLine.Substring(cl + 1, myLine.Length - cl - 1).Trim();\n        // 低温\n    \
  \    cl = myLine.IndexOf(\",\");\n        myVariable = myLine.Substring(0, cl);\n\
  \        newRow[\"LowTemp\"] = Convert.ToSingle(myVariable);\n        myLine = myLine.Substring(cl\
  \ + 1, myLine.Length - cl - 1).Trim();\n        // 降水量\n        cl = myLine.IndexOf(\"\
  ,\");\n        myVariable = myLine.Substring(0, cl);\n        if (!myVariable.Equals(\"\
  \"))\n            newRow[\"Precip\"] = Convert.ToSingle(myVariable);\n        else\n\
  \            newRow[\"Precip\"] = 0.0;\n        myLine = myLine.Substring(cl + 1,\
  \ myLine.Length - cl - 1).Trim();\n        // 注释\n        newRow[\"Comment\"] =\
  \ myLine;\n        weatherTable.Rows.Add(newRow);\n        tableDate += new TimeSpan(1,\
  \ 0, 0, 0);\n    }\n    inputFile.Close();\n    // 保存数据库并释放对象\n    OleDbCommandBuilder\
  \ weatherAdapterCommand = new OleDbCommandBuilder(weatherAdapter);\n    weatherAdapter.Update(weatherTable);\n\
  \    weatherConnection.Close();\n    weatherConnection.Dispose();\n    weatherCommand.Dispose();\n\
  \    weatherAdapter.Dispose();\n    weatherTable.Dispose();\n    weatherAdapterCommand.Dispose();\n\
  }\n```\n\n这段代码的大部分借自示例 10-3（天气监测器项目）。我们使用 `ADOX` 来创建空的 `Sea02DB.accdb` 数据库并创建字段。然后，我们创建了向数据库中添加行所需的数据对象。\n\
  \n接下来，打开数据文件（`Sea02.txt`）并初始化日期。注意我们跳过了表头行。文件中的每行数据都有四个值。在读取每行时，会添加一条新记录，并将正确的值（通过逗号位置解析后）放入五个数据库字段中。完成后，关闭顺序文件并将数据表保存到数据库。\n\
  \n### 6. 保存（保存在 VCSDB\\Code\\Class 11 文件夹下的 Example 11-2 文件夹中）并运行。\n\n\n\n\n\n支持多个用户同时访问单个数据库需要特别考虑。幸运的是，Visual\
  \ C# 为我们提供了几个工具来处理多用户。ADO .NET 数据库引擎在多用户环境中运行良好。要在此类环境中使用数据库，你需要：\n\n*   将数据库文件放置在共享目录中。\n\
  *   确保文件服务器已配置好，以便每个用户都对包含数据库文件的目录具有读取和写访问权限。\n*   配置应用程序中的所有数据源，使其指向共享的数据库文件。\n\
  \n当多个用户尝试访问相同数据时可能会导致问题。典型问题包括：\n\n*   两个用户尝试更新同一条记录。\n*   一个用户更新记录时，另一个用户正在查看它，导致可见数据过时。\n\
  *   一个用户删除记录时，另一个用户正在使用它。\n\n锁定（locking）的概念被用于缓解这些其他问题。此外，在多用户环境中需要大量的错误处理，但这些都是你已经掌握的技能。\n\
  \n# 数据库 Web 应用程序\n\n大家都知道互联网已成为日常生活的一部分。Visual C# 的一个伟大新功能是 Web 表单（web forms）概念。通过\
  \ Web 表单，我们可以构建运行在互联网上的应用程序——Web 应用程序。Web 应用程序与我们构建的 Windows 应用程序不同。用户（客户端）向服务器计算机发送请求。服务器生成一个\
  \ Web 页面（HTML）并将其返回给客户端计算机，以便可以使用浏览器软件查看。\n\nWeb 应用程序使用 Visual C# 使用名为 `ASP .NET`（Active\
  \ Server Pages .NET）的技术构建。`ASP .NET` 是用于构建 Web 应用程序的早期改进版本。在过去，要构建动态 Web 应用程序，你需要使用混合编程技术。Web\
  \ 页面是用 `HTML`（是的，就是我们用来编写帮助文件的 `HTML`）生成的，编程则通过 `ASP`（Active Server Pages）和 `VCS\
  \ Script`（一种 Visual C# 脚本语言）完成。\n\n使用 `ASP .NET`，构建 Web 应用程序的过程与构建 Windows 应用程序的过程相同。要构建\
  \ Web 应用程序，我们从表单开始，添加 Web 控件并为 Web 控件事件编写代码。有一个显示控件的可视项目组件，以及一个包含事件方法、通用方法和函数的代码组件。\n\
  \n在这些笔记中，我们介绍了带有数据库的 Web 应用程序概念。你可以利用你新的编程技能深入研究关于 `ASP .NET` 和 Web 应用程序的高级参考。在这里，我们涵盖了几个\
  \ Web 应用程序主题：\n\n*   介绍使用 Web 表单构建 Web 应用程序的方法。\n*   讨论 Web 表单控件以及它们与 Windows 对应控件的区别。\n\
  *   通过简单的数据库示例演示构建 Web 应用程序的过程。\n\n# 开始一个新的 Web 应用程序\n\n要开始构建 Web 应用程序的过程，在 Visual\
  \ C# 中选择 `File` 菜单选项。然后，点击 `New Web Site`。出现此窗口：\n\n![Image](img/00103.jpeg)\n\n\
  从 `Templates` 列表中选择 `ASP .NET Empty Web Site`。在 `Browse` 按钮左侧的下拉框中，选择或输入用于存放你的新网站的文件夹名称。确保所选的\
  \ `Language` 是 Visual C#。点击 `OK` 创建应用程序。\n\n创建完成后，在 `Solution Explorer` 窗口中右键点击网站名称，选择\
  \ `Add`，然后 `Web Form`。会出现一个空白的 Web 表单（扩展名为 `aspx`）。\n\n此时，我们可以通过在 Web 表单上放置控件并为各种事件编写代码来开始构建我们的第一个\
  \ Web 应用程序。设计窗口将显示一个空白表单：\n\n![Image](img/00366.jpeg)\n\n（如果表单没有出现，右键点击项目名称，选择 `Add`\
  \ 然后 `Web Form`）。表单有两种视图：`Design`（图形化显示）和 `Source`（表单背后的 `HTML` 代码）。\n\n让我们看看可用控件以及如何将它们放置在表单上。\n\
  \n# Web 表单控件\n\n在编辑 Web 表单时，放置在 Web 表单上的可用控件可以在 Visual C# 工具箱中找到。显示某些结果控件的视图如下：\n\
  \n![Image](img/00429.jpeg)\n\n此菜单中的名称应该很熟悉。这些控件与我们在整个课程中使用的 Windows 表单控件相似。然而，它们存在差异。主要区别在于某些属性的名称（例如，使用\
  \ `ID` 属性代替 `Name` 属性），并且 Web 表单控件的事件通常比其 Windows 对应控件少得多。让我们某些控件——你可以根据特定需求研究其他控件。\n\
  \n### Label 控件（标签控件）：\n\n![Image](img/00337.jpeg)\n\n标签控件允许在表单上放置格式化的文本信息（`Text`\
  \ 属性）。通过 `Font` 属性设置字体。\n\n### TextBox 控件（文本框控件）：\n\n![Image](img/00146.jpeg)\n\n\
  文本框控件允许在表单上放置文本信息（`Text` 属性）。这可能是最常用的 Web 表单控件。它没有用于按键捕获的 `KeyPress` 事件。可以使用验证控件通过\
