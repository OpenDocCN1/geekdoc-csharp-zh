  \n## 多表数据库管理\n\n我们已经看到，为单个数据表表单添加数据库管理功能是一个直接的过程。对于编辑、添加和删除记录的某些方法，`ADO.NET` 数据库引擎使得这些任务变得简单。然而，大多数数据库在单个文件中包含多个表，当向这些多表数据库添加管理能力时，会出现复杂情况。你需要做的事情包括：\n\
  \n* 在单个表上显示多个表的信息\n* 使用选定的记录更改另一个表中的信息\n* 协调多个表的更新\n* 处理数据适配器（data adapter）的多个访问\n\
  \n在本节中，我们为多表数据库管理提供了一些通用规则。多表数据库管理中最重要的规则与单表管理相同。理解你的数据库应用程序以及你试图做的事情。提前计划。在开发应用程序时要保持系统性。理解一个表的更改如何影响其他表。利用\
  \ `Visual C#` 环境的优势。分阶段进行开发并测试每个阶段，直到符合你的预期。你可能会对想法进行多次迭代。确保你的应用程序是易懂且直观的。正如我们所说，这些规则与单表相同，多表中有更多需要考虑的事。\n\
  \n### 数据库键\n\n键连接了关系型数据库中的表。主键（Primary keys）是唯一的标识符。外键（Foreign keys）是多对一的标识符，用于指向数据库信息。你需要知道数据库中的哪些字段是主键，哪些是外键。在我们的单表示例中（`Authors`\
  \ 表和 `Publishers` 表），`ADO.NET` 引擎自动分配（自增）主键（`Au_ID` 和 `PubID`）字段。这种限制不允许用户修改主键。在多表数据库中，用户将可以选择更改外键。这是允许的。\n\
  \n在多表情况下，删除记录时必须对键格外小心。如果你删除了一个主键记录，而其他记录需要外键，那些“外键”记录将丢失被删除记录的信息。这些被称为孤儿记录（orphan\
  \ records）——它们是不完整的。这损害了数据库的完整性并非好事。例如，在书籍数据库中，如果你删除了 `Publisher` 条目，`Titles` 表中的所有书籍将无法访问该出版社的信息。在删除主键记录之前，确保没有其他记录依赖于要删除的信息。幸运的是，`ADO.NET`\
  \ 引擎通过不允许数据适配器更新（保存回原始数据库）来帮助你避免孤儿。我们在 `Authors` 和 `Publishers` 表示例中看到了这种错误消息。\n\
  \n你可能会偶尔有被任何“外键”引用的“主记录”。这是可以接受的；在这种情况下没有完整性的丢失。数据库只是在某些时间使用一个额外的条目。\n\n### 数据库修改\n\
  \n由于我们同时处理许多数据库表（因此是许多数据表），我们必须始终意识到特定数据表的更改如何影响其他数据表。这就是 `ADO.NET` 数据库引擎的力量可以提供帮助，也可能带来困扰的地方。以书籍数据库为例（我们将在下一个示例中看到），假设你有一个使用\
  \ `SQL` 创建的显示书籍标题和出版社名称的数据表（使用 `PubID` 连接两个表）。如果你在该数据表中更改了出版社名称，`ADO.NET` 数据库引擎将在\
  \ `Publishers` 表中具有相同 `PubID` 的每个条目写入该更改。数据库中该特定出版社的所有书籍将与新的出版社名称连接。你只需少量操作即可更改数千条记录！如果你确实想更改出版社名称这是好事，但如果是无意则是危险的。所以，正如我们所说，在构建多表界面时要小心且系统。\n\
  \n还有可能你需要使用 `C#` 代码协调各个数据库表之间的变化。如果你使用未绑定数据的控件，或者无法使用 `SQL` 构建一个完整的可更新数据表，就会出现这种情况。书籍数据库的示例（`Example\
  \ 6-9`）与一本书可能有多个作者的事实有关。我们希望在数据表中显示、编辑和更新所有作者。这不能仅通过 `SQL` 完成；我们必须使用代码。协调表修改没有通用规则——每个情况都是不同的。只需决定需要做什么并尝试即可。\n\
  \n## 最终应用程序\n\n本章的最终应用程序将说明概述的许多多表数据库管理操作。此最终应用程序通过整合 `Titles` 和 `Title_Author`\
  \ 表将一切连接在一起，从而完成我们的数据库应用程序。它将利用早期示例中构建的 `Authors` 和 `Publishers` 表。密切关注实现应用程序的步骤。在将来构建的数据库应用程序中，你会遇到类似的问题和操作。\n\
  \n请注意，这并不是将书籍数据库表整合到管理系统的唯一方法。我们有自己的处理方法，你也将开发自己的方法。随时修改此示例以适应你的风格。\n\n## 示例 6-9\
  \ 书籍数据库管理系统\n\n在本章的之前的示例中，我们开发了 `Visual C#` 表单（界面），允许管理书籍数据库中的 `Authors` 和 `Publishers`\
  \ 表。为了完成此数据库管理，我们需要一个表单（它将依赖于 `Authors` 和 `Publishers` 表单），允许用户编辑、添加和删除有关书籍标题的信息。这涉及使用多个表（不仅是\
  \ `Authors` 和 `Publishers` 表，还包括 `Titles` 和 `Title_Author` 表）。我们在示例中开发那个最终表单。\n\n\
  \n\n\n\n作为开发此数据库管理系统的辅助，我们重复了第 2 章中首次看到的一个图表，它展示了书籍数据库的四张表：\n\n![Image](img/00383.jpeg)\n\
  \n此表显示了每个表的字段以及数据库键如何连接这些表。在整个示例中参考此表将帮助你理解我们所采取的步骤。\n\n# 基础书籍标题输入表\n\n我们首先构建并测试一个用于书籍标题的基本输入表。我们想要输入书籍输入哪些信息？像标题、出版日期、作者和出版商这类基本信息就可以开始。这些信息中的大部分可以从书籍数据库的\
  \ `Titles` 表中获取。回想起这是我们在构建应用程序时尚未处理过的表。该表有八个字段：\n\n- `Title`\n- `Year_Published`\n\
  - `ISBN`\n- `PubID`\n- `Description`\n- `Notes`\n- `Subject`\n- `Comments`\n\n命令对象检索字段（按\
