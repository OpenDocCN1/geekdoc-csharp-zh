  \ = -1000; tempHL = 1000;\n    tempLH = -1000; tempLL = 1000;\n    sumH = 0; nH\
  \ = 0;\n    sumL = 0; nL = 0;\n    sxH = 0; sx2H = 0; sxyH = 0;\n    sxL = 0; sx2L\
  \ = 0; sxyL = 0;\n\n    for (int x = xStart; x <= xEnd; x++)\n    {\n        if\
  \ (weatherTable.Rows[x][\"HighTemp\"] != DBNull.Value)\n        {\n            temp\
  \ = Convert.ToSingle(weatherTable.Rows[x][\"HighTemp\"]);\n            highTemp[x\
  \ - xStart] = temp;\n            if (temp > tempHH)\n                tempHH = temp;\n\
  \            if (temp < tempHL)\n                tempHL = temp;\n            sumH\
