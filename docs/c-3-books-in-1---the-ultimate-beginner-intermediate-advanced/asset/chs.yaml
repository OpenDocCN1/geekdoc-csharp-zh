  - [基础单元碰撞: 253]\n- [人工智能: 254]\n- [结论: 257]\n- [参考文献: 258]\n\n# 第一章：引言 - C# 的设置与历史\n\
  \n微软在 2000 年宣布了 `C#`并在 2002 年发布了该语言。`C#` 原本被称为 \"Cool\"，意为“C 类面向对象的编程”（C-like object-orientated\
  \ programming）。`C#` 是一种基于 C 的编程语言。它的读音是 C \"sharp\"；井号符号暗示 `C#` 是 `C++` 的后续迭代。\n\
  \n以下是 `C#` 的时间线，详细说明了每个版本添加的内容（“C# 简介”）：\n\n### 2002 年 1 月：C# 1.0\n- 类型安全的编程语言\n\
  - 现代化的\n- OOP（面向对象编程）\n\n### 2005 年 11 月：C# 2005\n- 泛型\n- 局部类\n- 匿名类型\n- 迭代器\n-\
  \ 可空类型\n- 静态类\n\n### 2007 年 11 月：C# 2007\n- 对之前新增内容的改进\n- 扩展方法\n- 表达式树\n- 局部方法\n\
  \n### 2010 年 4 月：C# 4.0\n- 动态绑定技术\n- 动态命名和参数（可选）\n\n### 2012 年 8 月：C# 5.0\n- 异步编程（一项重大的新增，允许程序员创建多线程应用程序）\n\
  - 用于调用者信息的特性\n\n### 2015 年 7 月：C# 6.0（本书包含此版本及以上版本）\n- 异常过滤器\n- 字符串插值\n- 包含静态类型成员的命名空间\n\
  - 编译器即服务\n\n### 2017 年 8 月：C# 7.0\n- 输出变量\n- 元组和解构\n- 模式匹配\n- 局部函数\n- 扩展的表达式体成员\n\
  - 引用局部变量和返回值\n\n### 2019 年 9 月：C# 0.8\n- 只读成员\n- 默认接口方法\n- 模式匹配的增强：\n    - switch\
  \ 表达式\n    - 属性模式\n    - 元组模式\n    - 位置模式\n    - 使用声明\n    - 静态局部函数\n    - 可释放的引用结构体\n\
  \    - 可空引用类型\n    - 异步流\n\n\n\n\n\n# 索引与范围\n- 空合并赋值\n- 未受托管的构造类型\n- 嵌套表达式中的 stackalloc\n\
  - 插值原始字量字符串的增强\n\n## 在 Windows 上运行 C#\n\n你可能对本章将涵盖的所有内容都很熟悉，但我们必须得过一遍，因为回顾基础知识总是一个好主意。对于那些暂时离开编程的人来说，这就像是一次非常需要的复习。在\
  \ Windows 上使用 C# 仍然是更好的选择，因为 C# 是微软的语言，Windows 操作系统针对它进行了优化。\n\n### Mac 用户：\n你可以在\
  \ Mac 上使用 C#。微软已经发布了 Visual Studio Mac 版，但在 Windows 笔记本电脑上运行 C# 的体验更好。你可以使用 Oracle\
  \ 的 Virtual Box 等工具在 Mac 上运行虚拟 Windows 操作系统，这会有很大帮助。\n\n### 1. 面对象语言\n除了原始数据类型外，C#\
  \ 中的一切都是对象。如你所知，对象具有属性和构造函数。如果你工作过其他面向对象的语言，你就见过这些。我们将在接下来的章节中看到更多内容。由于 C# 是面向对象的，因此它易于维护和模块化。\n\
  \n### 2. 强类型\n正如你对基于 C 的编程语言所预期的那样，C# 是强类型的。这意味着与 Javascript 不同，你必须在程序中指定数据类型。这显著减少了运行时错误。这被称为类型安全。当你处理更大的应用程序时，类型安全的优势会变得更加明显。\n\
  \n### 3. 自动垃圾回收\nC# 会定期运行垃圾回收，这移除未使用的对象和悬挂指针，从而刷新内存。.NET 框架负责执行此任务。你不需要自己完成这些繁琐的任务；它为你节省了时间，并让你能够专注于应用程序的功能上。\n\
  \n### 4. 易于学习\nC# 是一种高级级编程语言，这使得它更容易学习。与 C 和 C++ 等低级编程语言不同，你必须执行的许多任务（如内存管理和指针）都是自动完成的。这使得你的代码更加简洁和集中。在\
  \ C 中需要十行代码的内容，在 C# 中大约只需要三行代码。\n\n### 5. 应用范围\nC# 是微软生态系统的核心。微软的许多技术都运行在其之上。Windows\
  \ Phone 使用 C#，ASP.NET 使用 C# 作为其后端，Windows Form 和 Windows Presentation Framework\
  \ 也运行在 C# 上。如果你正在构建运行在 Windows 上的程序并希望它运行良好，C# 是最佳选择。你可以通过其他方法编写在 Windows 上运行的程序，但除非你额外努力优化程序，否则性能将无法同日。从\
  \ Web 开发到应用程序、操作系统和游戏引擎，C# 可以胜任许多工作。\n\n### 6. Visual Studio 的组成部分\n微软的 Visual Studio\
  \ 是全球最流行的 IDE 之一，而 C# 作为 Visual Studio 语言的一部分，彰显了该语言的重要性和。\n\n### 7. 庞大的开发者社区\n\
  在编写程序时，如果程序的开发社区越大，将会有很大帮助。这意味着如果出现问题，很可能有人遇到过该问题、记录了它并找到了解决方案。因此，你不会被困很久，而且一直可以获得免费的支持。C#\
  \ 在 Stack Overflow 上拥有第四大的社区。有趣的是，Stack Overflow 也是用 C# 编写的。\n\n## 环境搭建\n\n这里是我们在第一本书中讨论过的内容。在使用\
  \ C# 时，最好在安装了最新 .Net 框架的 Windows 机器上进行。当你安装 Visual Studio 时，开发 C# 所需的所有文件和框架都将加载到你的系统中。Visual\
  \ Studio 是 C# 的首选 IDE。你可以在[此处](https://visualstudio.microsoft.com/downloads/) 下载最新的\
  \ Visual Studio。下载后你应该能看到它。\n\n![Image](img/00018.jpeg)\n\n你会发现 Visual Studio 有三个版本：社区版（Community，免费）、专业版（Professional）和企业版（Enterprise，均为付费）。社区版要求你拥有一个微软账户。如果你使用的是\
  \ Windows 机器，你可能已经有一个账户了。如果没有，很容易创建一个，而且是免费的。安装过程就像下载任何其他程序一样，不会进行任何额外操作。\n\n##\
  \ 运行你的第一个程序\n\n按照以下步骤运行你的第一个 C# 程序。\n\n1. 在开始菜单上打开 Visual Studio 或在 Windows 搜索框中搜索它（\"\
  Visual Studio\"）：\n![00004.jpeg](img/00019.jpeg)\n2. 选择 `File` -> `New` -> `Project`\
  \ 创建新项目，如下：\n![00005.jpeg](img/00020.jpeg)\n3. 你将面对许多 C# 程序选项。选择 \"Console App (.NET\
  \ Framework)\" 并赋予你选择的应用程序名称。我将其命名为 \"MyProgram\"。点击 OK。\n![00006.jpeg](img/00021.jpeg)\n\
  4. 你将导航到一个可以编写 C# 代码的窗口。在窗口中复制以下代码，并点击顶部菜单上标记为 \"Start\" 的绿色按钮。\n![Image](img/00022.jpeg)\n\
  5. 当你点击“Start”按钮运行脚本时，控制窗口将显示运行脚本的结果。在这种情况下，它显示消息：“Congratulations, you wrote your\
  \ first Program”。它看起来像：\n![Image](img/0023.jpeg)\n\n为了理解发生了什么，让我们来看我们编写的代码：\n\n\
  ```csharp\nusing System;\nusing System.Collections.Generic;\nusing System.Text;\n\
  using System.Threading;\n\nnamespace MyProgram\n{\n    class Program\n    {\n  \
  \      static void Main(string[] args)\n        {\n            Console.WriteLine(\"\
  Congratulations, you wrote first Program\");\n            Console.ReadKey();\n \
  \       }\n    }\n}\n```\n\n# 第 2 章：\n\n## C# 接口\n\n接口是包含可以被其他类继承的定义的类。继承方法的类定义该方法。接口的定义如下：\n\
  \n```csharp\npublic interface interfaceename\n{\n    // 接口方法\n}\n```\n\n继承类如下定义方法：\n\
  \n```csharp\nclass classname : interfaceename\n{\n    // 接口方法\n}\n```\n\n这里是一个使用接口的应用程序：\n\
  \n```csharp\nusing System;\n\nnamespace Demo\n{\n    // 定义接口\n    public interface\
  \ Score\n    {\n        // 声明接口方法\n        void DisplayScore();\n        int Calculate();\n\
  \    }\n\n    public class Player : Score\n    {\n        public int PlayerID;\n\
  \        public string PlayerName;\n        public int score1,score2;\n\n      \
  \  // 定义接口方法\n        public void DisplayScore()\n        {\n            Console.WriteLine(\"\
  The score for try 1 is \" + score1);\n            Console.WriteLine(\"The score\
  \ for try 2 is \" + score2);\n        }\n\n        public int Calculate()\n    \
  \    {\n            return (score1 + score2);\n        }\n    }\n}\n```\n\n\n\n\n\
  \n```csharp\nclass Program\n{\n    // The main function\n    static void Main(string[]\
  \ args)\n    {\n        Player player1 = new Player();\n        player1.playerID\
  \ = 1;\n        player1.PlayerName = \"John\";\n        player1.score1 = 10;\n \
  \       player1.score2 = 20;\n        player1.DisplayScore();\n        Console.WriteLine(\"\
  The Total score is \" + player1.Calculate());\n        Console.Read();\n    }\n\
  }\n```\n\n在上面的代码中我们看到了以下操作：\n\n* 我们定义了一个名为 `Score` 的接口类，它包含一个 `Display` 方法和一个 `Calculate`\
  \ 方法。\n* 然后我们在 `Player` 类中定义了这些函数的实现。\n\n这是我们在控制台中应该看到的结果的内容：\n\nThe score for try\
  \ 1 is 10\nThe score for try 2 is 20\nThe Total score is 30\n\n我们还可以让一个类同时继承多个接口。让我们来看一个例子。\n\
  \n下面是多接口的应用。\n\n```csharp\nusing System;\n\nnamespace Demo\n{\n    // Defining the\
  \ interface\n    public interface Score\n    {\n        // Declaring the interface\
  \ methods\n        void DisplayScore();\n        int Calculate();\n    }\n    public\
  \ interface location\n    {\n        // Declaring the interface methods\n      \
  \  void InputCity(string city);\n        void DisplayCity();\n    }\n    public\
  \ class Player : Score, location\n    {\n        public int PlayerID;\n        public\
  \ string PlayerName;\n        public int score1, score2;\n        private string\
  \ city;\n        // Defining the interface methods\n        public void InputCity(string\
  \ pcity)\n        {\n            city = pcity;\n        }\n        public void DisplayCity()\n\
  \        {\n            Console.WriteLine(\"The player is from\" + city);\n    \
  \    }\n        public void DisplayScore()\n        {\n            Console.WriteLine(\"\
  The score for try 1 \" + score1);\n            Console.WriteLine(\"The score for\
  \ try 2 \" + score2);\n        }\n        public int Calculate()\n        {\n  \
  \          return (score1 + score2);\n        }\n    }\n    class Program\n    {\n\
  \        // The main function\n        static void Main(string[] args)\n       \
  \ {\n            Player player1 = new Player();\n            player1.PlayerID =\
  \ 1;\n            player1.ertName = \"John\";\n            player1.score1 = 10;\n\
  \            player1.score2 = 20;\n            player1.DisplayScore();\n       \
  \     Console.WriteLine(\"The Total \" + player1.Calculate());\n            player1.InputCity(\"\
  New York\");\n            player1.DisplayCity();\n            Console.Read();\n\
  \        }\n    }\n}\n```\n\n通过上述程序：\n\n* 我们定义了两个接口：`Score` 接口和 `Location` 接口。\n\
  * `Player` 类实现了这两个接口并定义了方法。\n\n以下是程序应该显示的内容：\n\nThe score for try 1 is 10\nThe score\
  \ for try 2 is 20\n\n### 接口中的属性\n\n可以在接口中定义属性。它们只能拥有 `get` 或 `set` 关键字，这告诉我们它们是只读属性还是读写属性。\n\
  \n以下是语法：\n\n```csharp\npublic interface interename\n{\n    // Property declaration:\n\
  \    datatype propertyname\n    {\n        get;\n        set;\n    }\n}\n```\n\n\
  如果 `get` 和 `set` 方法都被定义，则意味着该属性是一个读写属性。这里是接口中属性如何运作的示例。\n\n使用接口中的属性\n\n```csharp\n\
