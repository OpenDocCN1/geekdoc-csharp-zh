  \ is All\nThe second element of the array is Things\nThe third element of the array\
  \ is End\n\n### SortedList（排序列表）\n\n`SortedLists` 以键/值对的形式存储数据。可以通过键或索引访问这些数据。以下是我们初始化\
  \ `SortedList` 集合的语法。\n\n`SortedList variablename=new SortedList ():\n\n要向集合中添加内容，你需要按照以下方式使用\
  \ `Add()` 方法。\n\n`Variablename.Add (key,value)`\n\n如你所示，项是带有其键和值添加的。下面是一个现实世界中可能呈现的示例。下一个程序用于展示如何使用\
  \ `SortedList`。\n\n```csharp\nusing System;\nusing System.Collections;\n\nnamespace\
