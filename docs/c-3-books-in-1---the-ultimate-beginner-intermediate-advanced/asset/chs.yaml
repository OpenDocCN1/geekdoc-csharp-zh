  \n关于该程序，结果应该是这种格式的：\n\nThe score is 20\nThe try is the first try\nThe PlayerID is\
  \ 1\n\n# 第 3 章：\n\n## 命名空间\n\n命名空间允许我们分离并使用具有相似名称和参数但用途不同的函数（“C# 命名空间”）。编程语言并不常见这样做。每个函数都必须有一个唯一的名称。\n\
  \n以下是语法：\n\n```csharp\nnamespace namespaceName\n{\n    Class definition\n    {\n\
  \        // Define the functions\n    }\n}\n```\n\n所有定义的函数都将属于 `namespaceName` 命名空间。在某些程序中，你需要以下定义：\n\
  \n`using System;`\n\n其结果是使用 `System` 命名空间中定义的函数。\n\n示例：下面的程序用于演示如何使用命名空间。\n\n```csharp\n\
  using System;\n\n// One namespace\nnamespace NameA\n{\n    public class ClassA\n\
  \    {\n        public void FunctionA()\n        {\n            Console.WriteLine(\"\
  This is from namespace A\");\n        }\n    }\n}\n\n// Second namespace\nnamespace\
  \ NameB\n{\n    public class ClassB\n    {\n        public void FunctionA()\n  \
  \      {\n            Console.WriteLine(\"This is from namespace B\");\n       \
  \ }\n    }\n}\n\nnamespace Demo\n{\n    class Program\n    {\n        // The main\
  \ function\n        static void Main(string[] args)\n        {\n            // Using\
  \ the namespaces\n            NameA.ClassA clsA = new NameA.ClassA();\n        \
  \    clsA.FunctionA();\n            NameB.ClassB clsB = new NameB.ClassB();\n  \
  \          clsB.FunctionA();\n            Console.Read();\n        }\n    }\n}\n\
  ```\n\n\n\n\n\n```csharp\nConsole.WriteLine(\"This is from namespace B\");\n   \
  \     }\n    }\n}\n\nnamespace Demo\n{\n    class Program\n    {\n        // The\
  \ main function\n        static void Main(string[] args)\n        {\n          \
  \  // Using the namespaces\n            ClassA clsA = new ClassA();\n          \
  \  clsA.FunctionA();\n            ClassB clsB = new ClassB();\n            clsB.FunctionA();\n\
  \            Console.Read();\n        }\n    }\n}\n```\n\n关于该程序，输出结果应该是这种格式：\n\n\
  **This is from namespace A**\n\n**This is from namespace B**\n\n## 嵌套命名空间\n\n命名空间也可以嵌套，这意味着将一个命名放在另一个命名空间内部。语法如下：\n\
  \n```csharp\nnamespace namespaceName1\n{\n    Class definition\n    {\n        //\
  \ Define the functions\n    }\n    namespace namespaceName2\n    {\n        Class\
  \ definition\n        {\n            // Define the functions\n        }\n    }\n\
  }\n```\n\n我高亮了命名空间的大括号，你可以看到它们是嵌套的，并且方便导航。以下是访问函数 A 的方式。\n\n`namespaceName1.FunctionA`\n\
  \n我们通过这种方式访问函数 B。\n\n`namespaceName1.namespaceName2.FunctionB`\n\n你可以看到我们正在使用点符号符号，这是另一个说明我们本质上处理的是对象。\n\
  \n### 使用嵌套命名空间。\n\n```csharp\nusing System;\n\n// One namespace\nnamespace NameA\n\
  {\n    public class ClassA\n    {\n        public void FunctionA()\n        {\n\
  \            Console.WriteLine(\"This is from namespace A which contains namespace\
  \ B\");\n        }\n    }\n    // inner namespace\n    namespace NameB\n    {\n\
  \        public class ClassB\n        {\n            public void FunctionA()\n \
  \       {\n                Console.WriteLine(\"This is from namespace B inside Namespace\
  \ A\");\n            }\n        }\n    }\n}\n\nnamespace Demo\n{\n    class Program\n\
  \    {\n        // The main function\n        static void Main(string[] args)\n\
  \        {\n            // Using the namespaces\n            NameA.ClassA clsA =\
  \ new NameA.ClassA();\n            clsA.FunctionA();\n            NameA.NameB.ClassB\
  \ clsB = new NameA.NameB.ClassB();\n            clsB.FunctionA();\n            Console.Read();\n\
  \        }\n    }\n}\n```\n\n在上面的程序中：\n\n*   我们在命名空间 `NameA` 内部嵌套了命名空间 `NameB`。尽管\
  \ `NameB` 在 `NameA` 内部，它们都定义了类似的函数。\n*   然后我们通过点符号访问特定的函数。\n\n我们最终得到了如下结果：\n\n**This\
  \ is from namespace A** **which contains namespace B**\n\n**This is from namespace\
  \ B** **inside Namespace A**\n\n# 第 4 章：高级决策语句与流程控制\n\n### != 运算符\n\n`!=` 运算符用于检查两个给定的操作数是否“不相等”。`!`\
  \ 运算符也可以用于否定条件。它用于在条件的反值为真时执行代码。语法如下：\n\n```csharp\nbool levelComplete = score >=\
  \ pointsNeeded;\nif(!levelComplete)\n{\n    Console.WriteLine(\"You haven't won.\"\
  );\n}\n```\n\n你可以将 `!` 运算符与其他运算符使用，但你应该记住 `!` 的优先级高于关系运算符。这意味着它的条件会在其他条件之前被检查。如果你想让关系运算符在否定之前被检查，则需要像这样将关系运算符放在括号中：\n\
  \n```csharp\nif(!(score > oldHighScore))\n```\n\n这等同于：\n\n```csharp\nif(score <=\
  \ oldHighScore)\n```\n\n在编程中，有很多方法可以实现相同的功能。你必须选择最简单且合适的方法。\n\n### 条件运算符：&& 和 ||\n\
  \n你的条件运算符可以被用来跟踪多个事物。假设你正在制作一个游戏，玩家控制角色在地形中移动。当角色的能量耗尽或食物耗尽时，玩家就会失败。如果能量耗尽，只要有食物，他们一直拥有食物。如果食物耗尽，他们可以依靠能量生存直到下一个。他们唯一的失败方式就是既没有能量也没有食物。因此，你需要一个同时检查这两个条件的条件，并且只有当两个条件都满足时才结束游戏。为了这一点，你需要使用\
  \ AND 运算符 (`&&`)。\n\n这就是使用条件运算符的地方。正如提到的，我们有 AND 运算符 (`&&`) 和 OR 运算符 (`||`)，这些是我们用于同时检查多个元素的：\n\
  \n```csharp\nint food = 20;\nint energy = 40;\nif(food <= 0 && energy <= 0)\n{\n\
  \    Console.WriteLine(\"Game over\");\n}\n```\n\n这意味着如果食物小于等于零且能量小于等于零，游戏就应该结束。`||`\
  \ 运算符只需要一个条件为真。它在一种可以通过两种方式死亡的游戏中效果更好。让我们想象我们的角色在能量为零或时间耗尽时会死亡（在此例中，我们没有食物 变量）。这些情况中只要一个为真游戏就会结束，而不需要两者都满足。\n\
  \n```csharp\nint energy = 50;\nint time = 40;\nif(time < 0 || energy < 0)\n{\n \
  \   Console.WriteLine(\"You lost. Try again!\");\n}\n```\n\n你应该知道，默认情况下计算机执行“惰性求”，这意味着如果第一个条件满足，它们将不会检查第二个条件。只有当第一个条件（`time`）不满足时，才会检查第二个条件（`energy`）。你可以将多个条件操作组合在一起。你可以通过括号来发挥创意。但是，当你创建这些条件时，记住让别人易于阅读，永远不要为了目的而让事情过于复杂。\n\
  \n# 第 5 章：反射\n\nC# 在运行时从代码段检索信息的能力被称为反射（reflection）。如果你想了解关于方法的信息（“C# 反射”），就会使用反射。我们不仅于此：我们还可以通过反射在运行时创建对象并调用方法。在下面的示例中，我们使用\
  \ `Type` 数据类型获取有关类的信息。\n\n### 使用 Type 获取类的信息\n\n```csharp\nusing System;\nusing\
  \ System.IO;\n\nnamespace Demo\n{\n    class Player\n    {\n        // Defining\
  \ the members\n        public int id;\n        public string name;\n        public\
  \ void Display()\n        {\n            Console.WriteLine(\"The player ID is \"\
  \ + id);\n            Console.WriteLine(\"The name of the player is \" + name);\n\
  \        }\n    }\n    class Program\n    {\n        // The main function\n    \
  \    static void Main(string[] args)\n        {\n            Player player1 = new\
  \ Player();\n            // Trying to get the type of object\n            Type myTypeObj\
  \ = player1.GetType();\n            Console.WriteLine(\"The object is of Type \"\
  \ + myTypeObj);\n            Console.Read();\n        }\n    }\n}\n```\n\n在上面的程序中：\n\
  \n我们做了这些：使用 `Type`，获取了关于 `player1` 对象的信息。我们能够获取对象的类。下面是我们看到的输出：\n\n**The object\
  \ is Demo.Player**\n\n### MethodInfo\n\n下面的反射方法用于从类中获取有关方法的信息。以下是使用 MethodInfo 的示例。\n\
  \n```csharp\nusing System;\nusing System.IO;\nusing System.Reflection;\n\nnamespace\
  \ Demo\n{\n    class Player\n    {\n        public int id;\n        public string\
  \ name;\n        public void Display()\n        {\n            Console.WriteLine(\"\
  The ID is \" + id);\n            Console.WriteLine(\"The name is \" + name);\n \
  \       }\n    }\n    class Program\n    {\n        static void Main(string[] args)\n\
  \        {\n            Player player1 = new Player();\n            Type myTypeObj\
  \ = player1.GetType();\n            Console.WriteLine(\"The object is of Type \"\
  \ + myTypeObj);\n            // 使用反射获取关于 Display 方法的信息\n            MethodInfo myMethodInfo\
  \ = myTypeObj.GetMethod(\"Display\");\n        }\n    }\n}\n```\n\n\n\n\n\n```csharp\n\
  Console.WriteLine(\"Is the method a static method? \" + myMethodInfo.IsStatic +\
  \ \".\");\nConsole.Read();\n}\n}\n}\n```\n\n程序将带我们得到结果：\n\n**对象的类型为 Demo.Player**\n\
  \n该方法是静态方法吗？False\n\n# 第 6 章：集合 (Collections)\n\n集合是特殊的类，简化了对特殊数据类的操作（“C# 中的集合”）。\n\
  \n例如，`ArrayList` 集合内部有一个 `size()` 方法，可以无需编写繁琐的代码获取数组的大小（注：）。\n\nC# 拥有以下集合类：\n\n\
  *   `ArrayList` - 数组容器，用于存储相同数据类型的连续值。\n*   `SortedList` – 这些是序列容器，允许以常数时间进行插入和删除操作。可以在双方向上进行迭代。\n\
  *   `Stacks`（栈） - 这是一种专为 LIFO（后进先出）情况设计的类型，项从容器的一端插入并从中取出。\n*   `Queues`（队列） - 这是一种专为\
  \ FIFO（先进先出）情况设计的类型，项从一侧插入，然后从另一侧取出。\n\n让我们详细查看这些内容。清晰地理解这些概念是非常重要的。\n\n数组非常好，因为我们可以根据需要将其变得尽可能小或尽可能大。由于使用的内存是连续的，我们知道数组是高效且节省的。但数组不是动态的。面对当今的计算需求，程序员必须发挥创意来克服这一点。这曾是一个优势，因为这意味着数组不会失控增长并占用系统内存。那时的计算机没有我们今天拥有的那种内存，因此数组在防止进程占用内存方面发挥了重要作用。\n\
  \n如今，程序员可以编写越来越动态的程序，可以根据需要收缩和扩展，因为计算机拥有更多内存，也更强大。这对程序员来说是好事，因为这意味着他们可以编写更有趣的东西，因为现在有了足够的空间（当然，是不负责任的情况下）。\n\
  \n这就是为什么当程序员在寻找通用性和力量时，列表比数组变得更流行的原因。如果你用过 Python 等编程语言，这对你来说并不陌生。列表是一个灵活的数组。\n\n\
  随着情况的变化，列表可以调整到所需的任何大小。列表没有固定的长度。它们可以不断添加项。它们就像化石；曾有一段时间没有任何化石。它们现在已经进化了数百万年，今天活着的生物和未来将生存的生物将不断添加到那个化石列表中，直到地球不再存在。列表中可以添加多少化石不受限于任何固有大小。唯一的限制是地球将存在多久。如果地球永远存在，生命也随之存在，我们将永远地添加化石。同样的原理也适用于列表。\n\
  \n列表还带了全内置函数。要使用列表并利用其所有功能，你需要导入 `System.Collections` 命名空间。\n\n使用列表时，你必须声明列表及其类型，如下：\n\
  \n`List<*type*> name = new List<*type*>();`\n\n你使用 `Add` 方法添加项，如下：\n\n```csharp\n\
  myList.add(2);\nmyList.add(5);\nmyList.add(8);\n```\n\n你还可以使用 `AddRange` 方法将现有数组添加到列表中，如下：\n\
  \n```csharp\nmyList.addRange(*arrayName*);\n```\n\n你可以通过两种方式之一从列表中删除项：通过项的 `value`\
  \ 或项的索引。列表的索引工作与数组索引相同。\n\n```csharp\nmyList.remove(5); // 将移除 5，按值移除\nmyList.removeAt(0);\
  \ // 将移除 2，按索引移除\n// 列表中只剩下 8。注意我们正在操作上一个示例中创建的列表。\n```\n\n我希望这说明了列表是多灵活。\n\n###\
  \ ArrayList\n\n数组容器存储相同数据类型的值。让我们来看一个例子。\n\n你通过以下方式定义 `ArrayList`：\n\n```csharp\n\
  ArrayList variablename=new ArrayList():\n```\n\n`Variablename` 是我们分配给 `Array` 的变量，以便我们对其使用各种方法。这是我们正在使用\
  \ `Add` 方法向 `arrayList` 添加项。\n\n```csharp\nVariablename.Add(element)\n```\n\n如果我们需要，可以通过其索引访问此元素。接下来的示例说明了\
  \ `ArrayList`。\n\n这是一个数组列表的应用。\n\n```csharp\nusing System;\nusing System.Collections;\n\
  \nnamespace Demo\n{\n    class Program\n    {\n        // 主函数\n        static void\
  \ Main(string[] args)\n        {\n            // 定义 ArrayList\n            ArrayList\
  \ ar = new ArrayList();\n            // 向数组列表添加元素\n            ar.Add(10);\n   \
  \         ar.Add(15);\n            ar.Add(23);\n            // 显示数组的元素\n       \
  \     Console.WriteLine(\" 数组的第一个元素是 \" + ar[0]);\n            Console.WriteLine(\"\
  \ 数组的第二个元素是 \" + ar[1]);\n            Console.WriteLine(\" 数组的第三个元素是 \" + ar[2]);\n\
  \            Console.Read();\n        }\n    }\n}\n```\n\n这是我们将在控制台中看到的：\n\n**数组的第一个元素是\
  \ 1**0\n数组的第二个元素是 15\n数组的第三个元素是 23\n\n我们可以向 `ArrayList` 添加各种数据类型。这个程序展示了使用字符串数组列表的方法。\n\
  \n```csharp\nusing System;\nusing System.Collections;\n\nnamespace Demo\n{\n   \
  \ class Program\n    {\n        // 主函数\n        static void Main(string[] args)\n\
  \        {\n            // 定义 ArrayList\n            ArrayList ar = new ArrayList();\n\
  \            // 向数组列表添加元素\n            ar.Add(\"Hi\");\n            ar.Add(\"There\"\
  );\n            ar.Add(\"World\");\n            // 显示数组的元素\n            Console.WriteLine(\"\
  \ 数组的第一个元素是 \" + ar[0]);\n            Console.WriteLine(\" 数组的第二个元素是 \" + ar[1]);\n\
  \            Console.WriteLine(\" 数组的第三个元素是 \" + ar[2]);\n            Console.Read();\n\
  \        }\n    }\n}\n```\n\n输出将是：\n数组的第一个元素是 Hi\n数组的第二个元素是 There\n数组的第三个元素是 World\n\
  \n`ArrayList` 类有许多可以操作数据的方法。\n\n### ArrayList 操作\n\n下面的部分总结了 `ArrayList` 的各种操作。\n\
  \n| 函数 | 描述 |\n| :--- | :--- |\n| `size` | 该属性告诉我们 ArrayList 的大小 |\n| `Clear()`\
  \ | 移除 ArrayList 中的所有元素 |\n| `Contains()` | 检查 ArrayList 是否包含特定元素，然后返回布尔值：包含返回 True，否则返回\
  \ False |\n| `IndexOf()` | 返回指定元素在 ArrayList 中的索引 |\n| `InsertAt()` | 在 ArrayList\
  \ 的特定索引处插入值/项 |\n| `Remove()` | 从 arrayList 中移除项 |\n| `RemoveAt()` | 移除指定索引处的项 |\n\
  | `Reverse()` | 反转 ArrayList 中的元素 |\n| `Sort()` | 按字母顺序或数字升序排序数组 中的元素 |\n| `GetRange()`\
  \ | 该方法用于提取数组并将其添加到 ArrayList |\n\n让我们看看上面简述定义的每个方法是如何工作的。\n\n### Size 函数\n\n该属性告诉我们\
  \ ArrayList 的大小，即其中元素的数量。我们将使用直观的 `Count` 方法来实现此。\n\n使用 count 属性\n\n```csharp\n\
  using System;\nusing System.Collections;\n\nnamespace Demo\n{\n    class Program\n\
  \    {\n        // 主函数\n        static void Main(string[] args)\n        {\n   \
  \         // 定义 ArrayList\n            ArrayList ar = new ArrayList();\n       \
  \     // 向数组列表添加元素\n            ar.Add(11);\n        }\n    }\n}\n```\n\n\n\n\n\
  ```csharp\nar.Add(13);\nar.Add(15);\n// 显示数组列表的大小\nConsole.WriteLine(\" The size\
  \ of the array list is \" + ar.Count);\nConsole.Read();\n}\n}\n}\n```\n\n以下是控制台打印的内容：\n\
  The size of the array list is 3\n\n#### Clear Function\n\n此函数移除 `ArrayList` 中的所有元素。\n\
  \n使用 `clear` 方法\n\n```csharp\nusing System;\nusing System.Collections;\n\nnamespace\
  \ Demo\n{\n    class Program\n    {\n        // 主函数\n        static void Main(string[]\
  \ args)\n        {\n            // 定义 ArrayList\n            ArrayList ar = new\
  \ ArrayList();\n            // 向数组列表添加元素\n            ar.Add(12);\n            ar.Add(14);\n\
  \            ar.Add(17);\n            // 清空数组列表的所有元素\n            ar.Clear();\n\
  \            Console.WriteLine(\" The size of the array list is \" + ar.Count);\n\
  \            Console.Read();\n        }\n    }\n}\n```\n\n它应该告诉我们数组中空无，如下所示：\n**The\
  \ size of the array list is 0**\n\n#### Contains Function\n\n此方法检查 `ArrayList` 是否包含特定元素，然后返回一个布尔值：如果包含返回\
  \ `True`，否则返回 `False`。\n\n下一个程序展示了如何使用 `contains` 方法。\n\n```csharp\nusing System;\n\
  using System.Collections;\n\nnamespace Demo\n{\n    class Program\n    {\n     \
  \   // 主函数\n        static void Main(string[] args)\n        {\n            // 定义\
  \ ArrayList\n            ArrayList ar = new ArrayList();\n            // 向数组列表添加元素\n\
  \            ar.Add(13);\n            ar.Add(27);\n            ar.Add(30);\n   \
  \         Console.WriteLine(\"Does the array contain the value 3? \" + ar.Contains(30));\n\
  \            Console.Read();\n        }\n    }\n}\n```\n\n程序应该返回 true，如下：\n**Does\
  \ the array contain the value 3? True**\n\n### IndexOf Function\n\n此方法返回指定元素在 `ArrayList`\
  \ 中的索引。\n\n以下是 `IndexOf` 方法的一个应用。\n\n```csharp\nusing System;\nusing System.Collections;\n\
  \nnamespace Demo\n{\n    class Program\n    {\n        // 主函数\n        static void\
  \ Main(string[] args)\n        {\n            // 定义 ArrayList\n            ArrayList\
  \ ar = new ArrayList();\n            // 向数组列表添加元素\n            ar.Add(50);\n   \
  \         ar.Add(200);\n            ar.Add(37);\n            Console.WriteLine(\"\
  The index of value 37 is \" + ar.IndexOf(37));\n            Console.Read();\n  \
  \      }\n    }\n}\n```\n\n程序将在控制台中打印出此内容：\nThe index of value 37 is 2\n\n### Insert\
  \ Function\n\n此方法在 `ArrayList` 的特定索引处插入一个值/项。\n\n下面的程序展示了 `insert` 方法。\n\n```csharp\n\
  using System;\nusing System.Collections;\n\nnamespace Demo\n{\n    class Program\n\
  \    {\n        // 主函数\n        static void Main(string[] args)\n        {\n   \
  \         // 定义 ArrayList\n            ArrayList ar = new ArrayList();\n       \
