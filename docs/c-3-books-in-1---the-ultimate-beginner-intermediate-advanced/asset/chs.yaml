  );\n            ar.Add(\"b\");\n            Console.WriteLine(\"The value at index\
  \ 0 is \" + ar[0]);\n            Console.WriteLine(\"The value at index 1 is \"\
  \ + ar[1]);\n            Console.WriteLine(\"The value at index 2 is \" + ar[2]);\n\
  \            // 排序列表\n            ar.Sort();\n            Console.WriteLine(\"The\
  \ value at index 0 is \" + ar[0]);\n            Console.WriteLine(\"The value at\
  \ index 1 is \" + ar[1]);\n            Console.WriteLine(\"The value at index 2\
  \ is \" + ar[2]);\n            Console.Read();\n        }\n    }\n}\n```\n\n控制台将打印如下：\n\
  **The value at index 0 is c**\nThe value at index 1 is b\nThe value at index 2 is\
  \ a\n**The value at index 0 is a**\n**The value at index 1 is b**\n**The value at\
  \ index 2 is c**\n\n如果值是数字，它将按升序排列。\n\n### GetRange Function\n\n此方法用于提取一个数组并将其添加到\
  \ `ArrayList` 中。\n\n使用 `GetRange` 方法\n\n```csharp\nusing System;\nusing System.Collections;\n\
  \nnamespace Demo\n{\n\n\n\n\n```cs\nclass Program\n{\n    // The main function\n\
  \    static void Main(string[] args)\n    {\n        // Defining the ArrayList\n\
