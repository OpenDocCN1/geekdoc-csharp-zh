  \ Contains 函数\n\n下面我们将使用 `contains` 方法来检查队列中是否包含特定元素。\n\n下面的程序用于演示 `contains` 函数。\n\
  \n```csharp\nusing System;\nusing System.Collections;\n\nnamespace Demo\n{\n   \
