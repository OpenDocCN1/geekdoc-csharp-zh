  \ does the SortedList contain the Value \"One Ring To Them All\"? True.\nTrue or\
  \ False, does the SortedList contain the Value \"Snowhite\"? False.\n\n### IndexOfKey\
  \ 函数\n\n我们将使用 `IndexOfKey` 方法来查找键的索引。下一个程序将用于展示如何使用 `IndexOfKey` 函数。\n\n```csharp\n\
  using System;\n\nusing System.Collections;\n\nnamespace Demo\n{\n    class Program\n\
  \    {\n        // 主函数\n        static void Main(string[] args)\n        {\n   \
