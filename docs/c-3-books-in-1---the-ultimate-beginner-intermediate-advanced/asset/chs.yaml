  The number of elements on the stack is \" + ar.Count);\n            Console.Read();\n\
  \        }\n    }\n}\n```\n我们应该在控制台中得到以下结果：\nThe number of elements on the stack\
  \ is 4\n**The number of elements on the stack is 0**\n\n#### Pop Function\n\n下面我们正在使用\
