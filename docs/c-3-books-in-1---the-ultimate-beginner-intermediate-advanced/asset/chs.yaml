  \n### Clears 函数\n\n我们将使用 `clear` 来移除 `SortedList` 中的所有项。\n\n```csharp\nusing System;\n\
  \nusing System.Collections;\n\nnamespace Demo\n{\n    class Program\n    {\n   \
