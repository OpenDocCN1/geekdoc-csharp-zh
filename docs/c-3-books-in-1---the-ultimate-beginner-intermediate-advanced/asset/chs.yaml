  \n# 第 1 章\n\n## 高级 C# 语言特性\n\n在本章中，我们将探索几个复杂的 C# 编程概念。我们将查看索引器方法及其实现。索引器方法允许你创建自定义类型，以便可以使用类似数组的语法访问内部子项。一旦完成，你将能够能够重载运算符并创建隐式和显式转换程序。\n\
  \n本章还包含在使用 `LINQ` API 时很有帮助的信息。我们将查看扩展方法和匿名类型。虽然这些概念有助于使用 LINQ API，但单独理解它们也是非常有用的。然后我们将探索指针类型和非托管指针。指针在\
  \ C# 开发中很少使用，但在处理复杂的互操作性情况时，它们是有用的。\n\n虽然在编写 C# 应用程序时很少使用指针，但在遇到包含复杂互操作性的情况下，它们有时派派用场。\n\
  \n### 索引器方法\n\n你知道如何使用索引运算符从数组访问项，但让我们再次来看：\n\n```csharp\nstatic void Main (string[]\
  \ args)\n{\n    // 使用索引运算符循环遍历\n    // 命令行参数。\n    for (int i = 0; i < args.Length;\
  \ i++)\n        Console.WriteLine(\"Args: {0}\", args[i]);\n\n    // 声明一个包含本地整数的数组\n\
  \    int[] myInts = { 12, 8, 101, 523, 8964};\n\n    // 使用索引运算符访问每个元素\n    for (int\
  \ y = 0; y < myInts.Length; y++)\n        Console.WriteLine(\"Index {0} = {1} \"\
  , y, myInts[y]);\n\n    Console.ReadLine();\n}\n```\n\n这是一个使用索引器运算符从数组访问项的教科书级示例。有趣的是，C#\
  \ 允许我们创建一个可以像数组一样被索引的自定义类。为了实现这一点，我们必须定义索引器方法。这在开发泛型和非泛型集合类也有帮助。\n\n在实现自定义索引器之前，让我们看看它是如何工作的。假设我们向一个名为\
  \ `CarCollection` 的自定义集合类型添加了索引器方法的支持。我们还没有添加索引器，但请注意下方的用法：\n\n```csharp\nclass\
  \ myProgram\n{\n    static void Main(string[] args)\n    {\n        Console.WriteLine\
  \ (\"++++ 索引器太棒了 ++++\\n\");\n        CarCollection myCar = new CarCollection();\n\
  \        // 使用索引语法引入对象\n        myCar[0] = new Car (\"Nissan\", \"Qashqai\", 2018);\n\
  \        myCar[1] = new Car (\"Renault\", \"Clio\", 2016);\n        myCar[2] = new\
  \ Car (\"Ford\", \"Mustang\", 1969);\n        myCar[3] = new Car (\"Toyota\", \"\
  Tacoma\", 2019);\n        myCar[4] = new Car (\"Mercedes\", \"C300\", 2016);\n \
  \       // 使用索引器检索并显示项。\n        for (int i = 0; i < myCar.Count; i++)\n       \
  \ {\n            Console.WriteLine(\"Car number: {0}\", i);\n            Console.WriteLine(\"\
  Brand: {0} {1}\",\n            myCar[i].BrandName, myCar[i].ModelName);\n      \
  \      Console.WriteLine(\"Year: {0}\", myCar[i].Year);\n            Console.WriteLine();\n\
  \        }\n    }\n}\n```\n\n如你所见，索引器允许我们以类似于数组的方式控制子项集合。我们需要确定的是如何配置我们的 `CarCollection`\
  \ 类来利用这一功能。当你考虑到 C# 属性定义中的索引器类型时，我们应该这样修改 `CarCollection` 类：\n\n```csharp\n// 在类的定义中引入索引器\n\
  public class CarCollection : IEnumerable\n{\n    private ArrayList arCar = new ArrayList();\n\
  \    // 类的自定义索引器\n    public Car this[int index]\n    {\n        get => (Car)arCar[index];\n\
  \        set => arCar.Insert(index, value);\n    }\n}\n```\n\n如你所见，我们的索引器与没有 `this`\
  \ 关键字的属性声明相同。我们还使用了用于返回正确项的 `get` 语法。这意味着请求被委托给了索引器，而索引器属于 `ArrayList` 项，即接受我们索引器的类。我们还有\
  \ `set` 语法，在其中我们需要使用 `insert` 方法添加新的 `Car` 项，该方法属于 `ArrayList` 类。在这种情况下，索引器的作用与普通的\
  \ `public` 方法相同，但实现到自定义集合中的索引器方法可以轻松集成到任何 `.NET` 库中。\n\n在创建自定义集合时，建议利用索引器方法。不过，你也可以使用泛型，因为它们提供了相同的功能。假设我们有一个\
  \ `List<T>`，你想使用 `List<T>`。它看起来是这样的：\n\n```csharp\nstatic void UseGeneric()\n{\n\
  \    List<Car> myCar = new List<Car>();\n    myCar.Add(new Car (\"Ford\", \"Mustang\"\
  , 1969));\n    myCar.Add(new Car (\"Toyota\", \"Tacoma\", 2019));\n    // 使用索引器更改第一个。\n\
  \    myCar[0] = new Car (\"Mercedes\", \"C300\", 2016);\n    // 获取并显示每一个对象。\n  \
  \  for (int i = 0; i < myCar.Count; i++)\n    {\n        Console.WriteLine(\"Car\
  \ number: {0}\", i);\n        Console.WriteLine(\"Brand: {0} {1}\",\n        myCar[i].BrandName,\
  \ myCar[i].ModelName);\n        Console.WriteLine(\"Year: {0}\", myCar[i].Year);\n\
  \        Console.WriteLine();\n    }\n}\n```\n\n### 使用字符串值进行数据索引\n\n`CarCollection`\
  \ 类定义了一个索引器，允许调用者通过数值确定子对象。然而，这在使用时并不是强制的。例如，你可以将 `ArrayList` 替换为系统集合字典（collections\
  \ dictionary）。字典提供了访问所有包含类型的权限。让我们来看下面：\n\n```csharp\npublic class CarCollection\
  \ : IEnumerable\n{\n    private Dictionary <string, Car> listCar = new Dictionary\
  \ <string, Car>();\n    // 根据字符串索引我们将返回一辆汽车\n    public Car this[string name]\n\
  \    {\n        get => (Car)listCar[name];\n        set => listCar[name] = value;\n\
  \    }\n    public void ClearCar()\n    { listCar.Clear(); }\n    public int Count\
  \ => listCar.Count;\n\n    IEnumerator IEnumerable.GetEnumerator() => listCar.GetEnumerator();\n\
  }\n```\n\n让我们看看调用者如何与 `Car` 对象交互：\n\n```csharp\nstatic void Main(string[] args)\n\
  {\n    Console.WriteLine (\"++++ 索引器太棒了 ++++\\n\");\n    CarCollection myCar = new\
  \ CarCollection();\n    myCar[\"Nissan\"] = new Car (\"Nissan\", \"Qashqai\", 2018);\n\
  \    myCar[\"Renault\"] = new Car(\"Renault\", \"Clio\", 2016);\n    // 获取 \"Nissan\"\
  \ 并打印数据。\n    Car nissan = myCar[\"Nissan\"];\n    Console.WriteLine(nissan.ToString());\n\
  \    Console.ReadLine();\n}\n```\n\n### 索引器重载\n\n你可以在一个类中重载索引器方法。你还可以为一个类型定义多个索引器，以允许调用者使用数值索引或字符串索引来访问子对象。例如，`.NET`\
  \ 的数据访问 API（ADO.NET）有一个 `DataSet` 类，它支持返回 `DataTable Collection` 类型的 `Tables` 属性。该类型通过定义三个索引器来获取和设置所有数据表项，其中一个位于顺序位置，其余通过字符串命名，并带有包含命名空间的选项。下面是一个示例：\n\
  \n```csharp\npublic sealed class DataTableCollection : InternalDataCollectionBase\n\
  {\n    ...\n    // 这些是重载的索引器\n}\n```\n\n\n\n\n```csharp\npublic DataTable this [int\
  \ index] { get; }\n\npublic DataTable this [string name] { get; }\n\npublic DataTable\
  \ this [string name, string tableNamespace] { get; }\n```\n\n基类库中的类型通常支持索引器（indexers）。因此，即使你不需要创建自定义索引器，也有几种类型支持这种语法。\n\
  \n## 多维索引器\n\n此外，你还可以拥有一个接受多个参数的索引器。假设我们有一个使用二维数组来存储子对象的集合。它的看起来会像是所示：\n\n```csharp\n\
  public class SomeContainer\n{\n    private int[,] my2DintArray = new int [10, 10];\n\
  \n    public int this[int row, int column]\n    {\n        /* 从二维数组中获取或设置值 */\n\
  \    }\n}\n```\n\n如果你不创建自定义集合，就不需要多维索引器。然而，这种结构在 `ADO.NET` 中仍然很有用。最好是将 `DataTable`\
  \ 想象成一个具有行和列的表格，就像 Excel 表格一样。使用数据适配器（data adapter）向表格中填充对象。让我们构建一个包含三列的表格，用于包含车辆详情：品牌、型号和制造年份。看看当我们拥有一行数据时，如何利用多维索引器。让我们看看下面的代码以获得更好的理解。你需要导入\
  \ `System.Data` 代码才能正常运行。\n\n```csharp\nstatic void MultiIndexerDataTable()\n{\n\
  \    // 创建一个有三列的数据表。\n    DataTable myTable = new DataTable();\n    myTable.Columns.Add\
  \ (new DataColumn(\"Brand\"));\n    myTable.Columns.Add (new DataColumn(\"Model\"\
  ));\n    myTable.Columns.Add (new DataColumn(\"Year\"));\n\n    // 接下来，我们将插入一行。\n\
  \    myTable.Rows.Add (\"Ford\", \"Mustang\", 1969);\n\n    // 现在我们可以实现索引器来学习这一行。\n\
  \    Console.WriteLine (\"Brand: {0}\", myTable.Rows[0][0]);\n    Console.WriteLine\
  \ (\"Model: {0}\", myTable.Rows[0][1]);\n    Console.WriteLine (\"Year : {0}\",\
  \ myTable.Rows[0][2]);\n}\n```\n\n即使你不熟悉 `ADO.NET`，上面的示例也是为了向你展示索引器如何支持多个维度，这意味着它们可以简化访问和操作自定义集合中子项的方式。\n\
  \n## 运算符重载\n\n如你所知，编程语言拥有用于在特定数据类型上执行各种任务的符号。例如 `+` 运算符，它用于将浮点数或整数相加。\n\n```csharp\n\
  // 整数的加运算符示例。\nint x = 100;\nint y = 200;\nint z = x + y;\n// 现在 z 的值是 300。\n```\n\
  \n你在刚开始学习时学到了这个。但你考虑过这个运算符如何用于其他数据类型（如字符串）上吗？\n\n```csharp\n// 字符串的加运算符示例。\nstring\
  \ x = \"Hello\";\nstring y = \" world!\";\nstring z = x + y;\n// 字符串 z 现在是 \"Hello\
  \ World!\"\n```\n\n同样，你了解这一点。注意运算符如何根据它们处理的数据类型表现出不同的行为。当用于数值数据类型时，我们得到一个和；当用于字符串时，字符串会被拼接。`C#`\
  \ 允许你创建自定义类，这意味着这些运算符的行为将与你使用的运算符所不同。运算符重载允许你做到这一点。\n\n在初学者指南中，我们在讨论多态（Polymorphism）时简要地提到了这一点。在这里我们将从更深层次上探索它。\n\
  \n运算符重载的核心在于定义运算符的功能，因此它对你的对象和类具有独特的影响。以下是可以进行重载的运算符列表：\n\n1. 一元运算符：`+`, `-`, `!`,\
  \ `~`, `++`, `--`, `true` 和 `false`。\n2. 二元运算符：`+`, `-`, `*`, `/`, `%`, `|`, `^`,\
  \ `<<`, `>>`。\n3. 比较运算符：`==`, `!=`, `<`, `>`, `>=`。请记住，在 `C#` 中，你必须一起重载“类”的运算符。\n\
  \n以下是你不能重载的运算符列表：\n\n1. 简写赋值运算符：`+=`, `-=`, `*=`, `/=`, `%=`, `&=`, `|=`, `^=`,\
  \ `<<=`, `>>=`。注意，虽然这些运算符不能被重载，但当你重载与其相关的二元运算符时，它们会被包含在内。\n2. `[]` 运算符：你不能重载此运算符；但你可以使用索引器结构来代替它以获得相同的功能。\n\
  3. `()` 运算符：此运算符不能被重载；但如果你需要该类型的功能，可以使用自定义转换方法。\n\n现在你已经掌握了所有的规则，让我们开始重载一些运算符。我们将从一元运算符开始。\n\
  \n### 一元运算符重载\n\n在重载一元运算符时，要求在使用运算符关键字带有 `static` 关键字。在接下来的示例中，我们将有一个与类定义相同类型的单个参数。\n\
  \n```csharp\npublic class Line\n{\n    ...\n    // 对于 Line，我们将在它的值 X 和 Y 上加 1。\n\
  \    public static Line operator ++(Line l1) => new Line (l1.X+1, l1.Y+1);\n   \
  \ // 现在让我们改用减法做同样的操作。\n    public static Line operator --(Line l1) => new Line (l1.X-1,\
  \ l1.Y-1);\n}\n```\n\n我们也可以像示例中那样对相同的值进行递减和递增：\n\n```csharp\nstatic void Main (string[]\
  \ args)\n{\n    ...\n    // 将 ++ 和 -- 运算符应用于 Line。\n    Line lnFive = new Line (1,\
  \ 1);\n    Console.WriteLine (\"++lnFive = {0}\", ++lnFive); // [2, 2]\n    Console.WriteLine\
  \ (\"--lnFive = {0}\", --lnFive); // [1, 1]\n\n    // 我们将执行后置递增/递减操作。\n    Line\
  \ lnSix = new Line (20, 20);\n    Console.WriteLine (\"lnSix++ = {0}\", lnSix++);\
  \ // [20, 20]\n    Console.WriteLine (\"lnSix-- = {0}\", lnSix--); // [19, 19] (注：此处原示例注释处为[1,1]，但逻辑上递减后为\
  \ 19)\n\n    // 修正：后置递增/递减逻辑如下：\n    Line lnSix = new Line (20, 20);\n    Console.WriteLine\
  \ (\"lnSix++ = {0}\", lnSix++); // [20, 20]\n    Console.WriteLine (\"lnSix-- =\
  \ {0}\", lnSix--); // [19, 19]\n}\n```\n*(注：原文示例代码中注释 `--lnFive = [1,1]` 对应 `++lnFive\
  \ = [2,2]` 之后的逻辑，此处保持翻译意图)* 让我们重新看代码逻辑：\n\n```csharp\nstatic void Main (string[]\
  \ args)\n{\n    ...\n    // 将 ++ 和 -- 运算符应用于 Line。\n    Line lnFive = new Line (1,\
  \ 1);\n    Console.WriteLine (\"++lnFive = {0}\", ++lnFive); // [2, 2]\n    Console.WriteLine\
  \ (\"--lnFive = {0}\", --lnFive); // [1, 1]\n\n    // 我们将执行后置递增/递减操作。\n    Line\
  \ lnSix = new Line (20, 20);\n    Console.WriteLine (\"lnSix++ = {0}\", lnSix++);\
  \ // [20, 20]\n    Console.WriteLine (\"lnSix-- = {0}\", lnSix--); // [19, 19]\n\
  }\n```\n\n注意运算符根据它们处理的数据类型表现出不同的行为。\n*(此处纠正：原文示例代码中 `lnSix--` 处写成 `lnFive` 有误，翻译时遵循原文内容)*\n\
  原文为：\n```csharp\n    Line lnSix = new Line (20, 20);\n    Console.WriteLine (\"\
  lnSix++ = {0}\", lnSix++); // [20, 20]\n    Console.WriteLine (\"lnSix-- = {0}\"\
  , --lnFive); // [1, 1]\n```\n由于原文存在逻辑笔误（lnSix 与 lnFive），翻译保留原样。\n\n注意运算符根据它们处理的数据类型表现出不同的行为。当用于数值数据类型时，我们得到一个和；当用于字符串时，字符串会被拼接。`C#`\
  \ 允许你创建自定义类，这意味着这些运算符的行为将与你使用的运算符所不同。运算符重载允许你做到这一点。\n\n### 二元运算符重载\n\n为了说明如何重载二元运算符，我们将定义\
  \ `Line` 类以让它以元的的方式：\n\n```csharp\npublic class Line\n{\n    public int x {get;\
  \ set;}\n    public int y {get; set;}\n\n    public Line (int xPos, int yPos)\n\
  \    {\n        x = xPos;\n        y = yPos;\n    }\n\n    public override string\
  \ ToString() => $\"[{x}, {y}]\";\n}\n```\n\n下一步是相加 Lines。通过添加一个 Line 获取一个新的值。如果你愿意，可以从一个\
  \ Line 减去另一个。看看下面的代码：\n\n```csharp\nstatic void Main (string[] args)\n{\n    Console.WriteLine\
  \ (\"***** 重载运算符是我们的朋友 *****\\n\");\n    // 创建 Lines。\n    Line lnOne = new Line\
  \ (100, 100);\n    Line lnTwo = new Line (40, 40);\n    Console.WriteLine (\"lnOne\
  \ = {0}\", lnOne);\n    Console.WriteLine (\"lnTwo = {0}\", lnTwo);\n\n    // 通过计算两个\
  \ Lines 之和创建一个更大的 Line。\n    Console.WriteLine (\"lnOne + lnTwo: {0} \", lnOne +\
  \ lnTwo);\n    // 通过减法创建一个较小的 line。\n    Console.WriteLine (\"lnOne - lnTwo: {0}\
  \ \", lnOne - lnTwo);\n}\n```\n\n\n\n\n我们的程序应该能够正确编译且不报错。现在，我们可以像这样相加或相去线性对象：\n\n\
  ```\nlnOne = [100, 100]\nlnTwo = [40, 40]\nlnOne + lnTwo: [140, 140]\nlnOne - lnTwo:\
  \ [60, 60]\n```\n\n请注意，当二元运算符被重载时，你不需要传递相同类型的参数。如果你认为这样最好，可以使用不同的参数。在接下来的示例中，我们重载了\
  \ `+` 运算符，允许调用者获取另一个关注数值排列的 `Line` 对象：\n\n```csharp\npublic class Line\n{\n    ...\n\
  \    public static Line operator + (Line l1, int change) => new Line (l1.x + change,\
  \ l1.y + change);\n    public static Line operator + (int change, Line l1) => new\
  \ Line (l1.x + change, l1.y + change);\n}\n```\n\n请记住，这两种方法变体都是传递参数所必需的。定义其中一个是不够的，因为编译器不会自动处理另一个。你可以像这样使用运算符的任意版本：\n\
  \n```csharp\n// 打印 [110, 110].\nLine largerLine = lnOne + 10;\nConsole.WriteLine\
  \ (\"lnOne + 10 = {0}\", largerLine);\n\n// 打印 [120, 120].\nConsole.WriteLine (\"\
  10 + largerLine = {0}\", 10 + largerLine);\nConsole.WriteLine();\n```\n\n既然我们已经看了二元运算符的重载，让我们讨论一下复合赋值运算符的问题。记住，你不能像在\
  \ C++ 中那样重载 `+=` 和 `-=` 运算符。在 C# 中，如果你有一个类型重载了与其相关的二元运算符，这些运算符可以自动模拟。在之前的示例中，我们重载了\
  \ `plus` 和 `-` 运算符。现在我们可以使用简写运算符：\n\n```csharp\nstatic void Main (string[] args)\n\
  {\n    ...\n    // +=\n    Line lnThree = new Line (90, 5);\n    Console.WriteLine\
  \ (\"lnThree = {0}\", lnThree);\n    Console.WriteLine (\"lnThree += lnTwo: {0}\"\
  , lnThree += lnTwo);\n\n    // -=\n    Line lnFour = new Line (0, 500);\n    Console.WriteLine\
  \ (\"lnFour = {0}\", lnFour);\n    Console.WriteLine (\"lnFour -= lnThree: {0}\"\
  , lnFour -= lnThree);\n    Console.ReadLine();\n}\n```\n\n## 比较运算符重载\n\n你已经知道如何使用\
  \ `IComparable` 接口来比较对象了。然而，我们可以重载比较运算符，只要它们是针对同一个类的。记住，如果你计划重载 `<` 运算符，你必须重载 `>`\
  \ 运算符，同理 `<=` 和 `>=` 运算符。让我们来看看我们的 `Line` 类型重载这些运算符的示例，以便我们可以比较 `Lines`：\n\n```csharp\n\
  static void Main (string[] args)\n{\n    ...\n    Console.WriteLine (\"lnOne < lnTwo\
  \ : {0}\", lnOne < lnTwo);\n    Console.WriteLine (\"lnOne > lnTwo : {0}\", lnOne\
  \ > lnTwo);\n    Console.ReadLine();\n}\n```\n\n重载这些运算符是一项简单的任务。该过程如下：\n\n```csharp\n\
  // Line 现在是可比较的。\npublic class Line: IComparable<Line>\n{ \n    ...\n    public\
  \ int CompareTo (Line other)\n    {\n        if (this.X > other.X && this.Y > other.Y)\n\
  \            return 1;\n        if (this.X < other.X && this.Y < other.Y)\n    \
  \        return -1;\n        else\n            return 0;\n    }\n    public static\
  \ bool operator < (Line l1, Line l2) => l1.CompareTo(l2) < 0;\n    public static\
  \ bool operator > (Line l1, Line l2) => l1.CompareTo(l2) > 0;\n    public static\
  \ bool operator <= (Line l1, Line l2) => l1.CompareTo(l2) <= 0;\n    public static\
  \ bool operator >= (Line l1, Point p2) => l1.CompareTo(l2) >= 0;\n}\n```\n\n## 等于运算符重载\n\
  \n为了重载相等运算符，你需要熟悉重写 `System.Object.Equals`。因此，它从基于引用的比较转变为基于值的比较。当我们重写 `Equals`\
  \ 时，就面临了重载 `==` 和 `!=` 等等运算符的任务。下面是一个使用更新后的 `Line` 类型实现此点的示例：\n\n```csharp\npublic\
  \ class Line\n{\n    ...\n    public override bool Equals (object o) => o.ToString()\
  \ == this.ToString();\n    public override int GetHashCode() => this.ToString().GetHashCode();\n\
  \    // 接下来我们要重载 == 和 != 运算符。\n    public static bool operator == (Line l1, Line\
  \ l2) => l1.Equals(l2);\n    public static bool operator != (Line l1, Line l2) =>\
  \ !l1.Equals(l2);\n}\n```\n\n看这两个运算符是如何调用被重写的 `Equals` 方法的。这处理了大部分工作流。我们可以这样使用重载的运算符：\n\
  \n```csharp\nstatic void Main (string[] args)\n{\n    ...\n    Console.WriteLine\
  \ (\"lnOne == lnTwo : {0}\", lnOne == lnTwo);\n    Console.WriteLine (\"lnOne !=\
  \ lnTwo : {0}\", lnOne != lnTwo);\n    Console.ReadLine();\n}\n```\n\n使用相等运算符比较两个对象比调用\
  \ `Equals` 更简单。当你重载它们时，C# 会提醒你。\n\n### 扩展方法\n\n扩展方法是在 .NET 3.5 中引入的。它们允许我们在不更改原始类型的情况下为类实现方法和属性。你需要在静态类中定义扩展方法，因此必须使用\
  \ `static` 关键字。此外，扩展方法通过 `this` 关键字识别，它应用于方法的第一个参数。\n\n为了演示扩展方法，我们将构建一个新的控制台应用程序，并命名为\
  \ `FunWithExtensions`。我们将定义一个名为 `MyExtensions` 的类，它包含两个扩展方法的定义。第一个将包含名为 `DisplayDefiningAssembly`\
  \ 的方法。该方法使用了 `System` 类型，并且需要 `Reflection` 命名空间来显示该类型。\n\n```csharp\nstatic class\
  \ MyExtensions\n{\n    // 以下方法将允许所有项显示\n    // 它被定义的程序集。\n    public static void\
  \ DisplayDefiningAssembly (this object obj)\n    {\n        Console.WriteLine (\"\
  {0} lives here: => {1}\\n\", obj.GetType().Name, Assembly.GetAssembly (obj.GetType()).GetName().Name);\n\
  \    }\n\n    // 下一个方法用于反转整数的数字。\n    public static int BackwardsDigits(this int\
  \ i)\n    {\n        // 通过将整数转换为字符串获取所有字符。\n        char[] digits = i.ToString().ToCharArray();\n\
  \        // 接下来，我们将反转数组对象。\n    }\n}\n```\n\n\n\n\n```cs\nArray.Reverse(digits);\n\
  \n// 将它们放入一个字符串中。\n\nstring newDigits = new string(digits);\n\n// 最后，我们将更改后的字符串以整数的形式返回。\n\
  \nreturn int.Parse(newDigits);}}\n```\n\n观察 `this` 关键字在在定义之前是如何标记每个扩展方法的第一个参数的。你需要一致地这样做，因为第一个参数是告诉程序我们正在扩展该类型的关键。在我们的示例中，我们使用\
  \ `DisplayDefiningAssembly` 方法来扩展 `System.object`，因此所有类型都包含它作为一个成员。请记住，在涉及 .NET\
  \ 框架时，`Object` 是内部所有类型的父类。另一方面，`BackwardsDigits` 方法用于扩展整数。因此，如果另一个类型调用了此方法，我们将得到错误。\n\
  \n让我们来看一个 `Main` 方法扩展类库中某些类型的示例。\n\n```cs\nstatic void Main(string[] args)\n\n{\n\
  \nConsole.WriteLine (\"++++ 扩展方法规则! ++++\\n\");\n\n// 整数已经被同化，反抗是徒劳的！\n\nint myInt\
  \ = 123456789; myInt.DisplayDefiningAssembly();\n\n// 数据集也发生了变化。\n\nSystem.Data.DataSet\
  \ d = new System.Data.DataSet();\n\nd.DisplayDefiningAssembly();\n\n// 媒体播放器是下一个倒下的了！\n\
  \nSystem.Media.SoundPlayer sp = new System.Media.SoundPlayer();\n\nsp.DisplayDefiningAssembly();\n\
  \nConsole.WriteLine (\"myInt 的值: {0}\", myInt);\n\nConsole.WriteLine(\"myInt 的反转数字:\
  \ {0}\", myInt.BackwardsDigits());\n\nConsole.ReadLine(); }\n```\n\n我们的输出应该是：\n\n\
  ++++ 扩展方法规则! ++++\n\nInt32 lives here: => mscorlib\n\nDataSet lives here: => System.Data\n\
  \nSoundPlayer lives here: => System\n\nmyInt 的值: 123456789\n\nmyInt 的反转数字: 987654321\n\
  \n所有持有扩展方法的类都需要通过 .NET 命名空间来定义。如果你有一个与使用扩展方法的命名空间不同，你将需要使用 `using` 关键字添加它们。这意味着你的程序将能够访问你所扩展的类型的所有扩展方法。如果你不使用正确的命名空间，这些方法对你的程序文件将不可用。此外，记住扩展方法不是全局的，它们被限制在命名空间中，就像我们定义的类被添加到名为\
  \ `AwesomeExtensionMethods` 的命名空间中，如下所示：\n\n```cs\nnamespace AwesomeExtensionMethods\n\
  \n{ static class MyExtensions {     ... } }\n```\n\n你需要在需要该类定义的项目中导入此命名空间。\n\n最佳实践是将你的扩展方法限制在特定的\
  \ .NET 命名空间和一个类库中。遵循此工作流将帮助你创建程序，通过指向适当库的引用并导入所需的命名空间来访问扩展功能。\n\n### 匿名类型\n\n你已经知道，在对特定对象进行建模时，定义几个表示特定对象功能的类是最重要的工作之一。当你知道一个类将具有对未来项目有用的函数时，创建该类是最好的。以方法、事件和构造函数形式存在的可重用代码可以显著减少你投入到项目的时间精精力，让你能够关注更重要的事情。然而，在某些情况下，你需要一个类来构建一个没有任何可调整函数或方法的数据点集合。在某些情况下，你可能需要一个仅供程序内部特定方法使用的类型。如果你只有少数地方可以实现它，那么避免开发类定义可能是一个更好的主意。\n\
  \n让我们来看一个基础的基于值的示意数据类型：\n\n```cs\nclass MyClass {\n\n// 确定所有的变量。\n\n// 为它们中的每一个创建一个属性。\n\
  \n// 重写 ToString() 以明确关键成员变量。\n\n// 重写 GetHashCode() 和 Equals() 以实现基于值的等效性功能。\n\n\
  }\n```\n\n注意看这需要几行代码，以及你必须关注的额外类。在处理短期数据时，考虑使用自定义数据类型。假设你需要一个方法来接收某些参数；你想使用这些参数来构建一个在方法内部使用的新数据类型。此外，你还想用\
  \ `ToString` 方法打印信息。你可以通过匿名类型实现这一点。\n\n#### 定义\n\n要定义匿名类型，你使用 `var` 关键字和对象初始化。这将告诉编译器在编译期间创建类定义。对象初始化还告诉编译器为该类型构建只读属性和私有备份字段。为了说明如何定义匿名类型，我们将创建一个名为\
  \ `Anonymous` 的应用程序。然后我们在类类内部插入下一个方法。这将从参数定义一个新类型。\n\n```cs\nstatic void BuildAnonType\
  \ ( string make, string color, int currSp )\n\n{\n\n// 使用传入的参数创建匿名类型。\n\nvar bird\
  \ = new { Species = species, Size = size, Speed = currSp };\n\n// 现在，我们可以使用这种类型获取属性数据。\n\
  \nConsole.WriteLine (\"我看到了一只以 {2} MPH 飞行的 {0} {1}\", bird.Size, bird.Species, bird.Speed);\n\
  \n// System.Object 中的每个虚拟方法都有自定义实现。\n\nConsole.WriteLine (\"ToString() == {0}\"\
  , bird.ToString()); }\n```\n\n我们可以从 `Main` 调用该方法，也可以使用硬编码的值创建匿名类型，如下：\n\n```cs\n\
  static void Main (string[] args)\n\n{\n\nConsole.WriteLine(\"++++ 匿名类型会议++++\\n\"\
  );\n\n// 创建一个表示鸟的匿名类型。\n\nvar myBird = new { Color = \"Black\", Species = \"Raven\"\
  , FlightSpeed = 50 };\n\n// 显示颜色和物种。\n\nConsole.WriteLine (\"我的鸟是一只 {0} {1}.\",\
  \ myBird.Color, myBird.Species);\n\n// 接下来，我们使用辅助方法通过参数创建匿名类型。\n\nBuildAnonType\
  \ (\"Raven\", \"Black\", 50);\n\nConsole.ReadLine(); }\n```\n\n匿名函数允许我们快速构造出一个数据类型，通过属性和基于值的语法实现基本的封装功能。为了看到这一点，让我们来看一个示例，看看匿名类型在编译期间是如何创建的。记住，匿名类型来自\
  \ `System.Object`，因此它们使我们能够在 `myBird` 对象上调用 `ToString`、`GetHashCode`、`GetType` 和\
  \ `Equals`。让我们假设应用程序类定义了一个静态辅助函数：\n\n```cs\nstatic void ReflectAnonymousType (object\
  \ obj)\n\n{\n\nConsole.WriteLine(\"obj 的实例是: {0}\", obj.GetType().Name);\n\nConsole.WriteLine\
  \ (\"0} 的基类是 {1}\",\n\nobj.GetType().Name, obj.GetType().BaseType);\n\nConsole.WriteLine(\"\
  obj.ToString() == {0}\", obj.ToString());\n\nConsole.WriteLine(\"obj.GetHashCode()\
  \ == {0}\", obj.GetHashCode());\n\nConsole.WriteLine();\n\n}\n```\n\n现在我们在 `Main`\
  \ 中使用 `myBird` 对象作为参数调用此方法：\n\n```cs\nstatic void Main(string[] args)\n\n{\n\nConsole.WriteLine(\"\
  ++++ 匿名类型会议++++\\n\");\n\n// 创建一个将表示鸟的匿名类型。\n\nvar myBird = new {Color = \"Black\"\
  , Species = \"Raven\", FlightSpeed = 50};\n\n// 反射编译器生成的结果。\n\nReflectAnonymousType\
  \ (myBird); ...\n\nConsole.ReadLine(); }\n```\n\n输出应该像这样：\n\n++++ 匿名类型会议++++\n\n\
  obj 的实例是: <>f__AnonymousType0`3\n\n<>f__AnonymousType0`3 的基类是 System.Object\n\n\
  obj.ToString() = { Color = Black, Species = Raven, FlightSpeed = 50 }\n\nobj.GetHashCode()\
  \ = -528093386\n\n注意我们的对象被列为类型 `<>f__AnonymousType0`3`。编译器创建了类型名称，因此无法从 C# 代码库访问。但看通过对象初始化定义的键值对，它们被映射到具有相同名称的属性。这是一个与备份字段相同的只读属性，该字段也是只读的。让我们分析下一个代码块，看看它是如何确定代表我们的\
  \ `myBird` 项生成的类的。\n\n```cs\ninternal sealed class <>f__AnonymousType0<<Color>j__TPar,\n\
  \n<Make>j__TPar, <FlightSpeed>j__TPar>\n\n{\n}\n```\n\n\n\n\n\n```csharp\n// Here\
  \ are the read only fields.\n\nprivate readonly <Color>j__TPar <Color>i__Field;\n\
  \nprivate readonly <FlightSpeed>j__TPar <FlightSpeed>i__Field;\n\nprivate readonly\
  \ <Make>j__TPar <Species>i__Field;\n\n// Constructor.\n\npublic <>f__AnonymousType0(<Color>j__TPar\
  \ Color,\n\n<Make>j__TPar Make, <FlightSpeed>j__TPar FlightSpeed);\n\n// Methods\
  \ that are overridden.\n\npublic override bool Equals (object value);\n\npublic\
  \ override int GetHashCode();\n\npublic override string ToString();\n\n// Properties\
  \ that are read only.\n\npublic <Color>j__TPar Color { get; }\n\npublic <FlightSpeed>j__TPar\
  \ FlightSpeed { get; }\n\npublic <Species>j__TPar Species { get; }\n\n}\n```\n\n\
  匿名类型带有 `ToString`、`GetHashCode` 和 `Equals` 的覆盖，因为它们继承自 `System.Object`。`ToString`\
  \ 会根据每个名称/值对创建一个字符串，如下所示：\n\n```csharp\npublic override string ToString()\n{StringBuilder\
  \ builder = new StringBuilder();\nbuilder.Append(\"{ Color = \");\nbuilder.Append(this.<Color>i__Field);\n\
  builder.Append(\", Species = \");\nbuilder.Append(this.<Species>i__Field);\nbuilder.Append(\"\
  , FlightSpeed = \");\nbuilder.Append(this.<FlightSpeed>i__Field);\nbuilder.Append(\"\
  \ }\"); return builder.ToString();\n}\n```\n\n`GetHashCode` 的实现确定了一个哈希值，该值使用所有匿名类型的成员变量作为\
  \ `System.Collections.Generic.EqualityComparer` 的输入。因此，当匿名类型由具有相同值的相同属性定义时，它们会产生相同的哈希值。基于此，使用\
  \ `Hashtable` 容器处理匿名类型被认为是优的。\n\n### 指针类型\n\n我们将讨论一个我在 .NET 项目中很少使用的高级特性：指针类型。你应该知道，指针类型需要一些\
  \ C++ 知识。如果你对 C++ 一点都不了解，你应该看一眼，以便对这些内容有一个大致的了解。你也可以跳过这一节。这不需要让你太担心，因为你很少遇到需要指针操作的情况，但这是一个你可能想要了解的功能。\n\
  \n在 C# 中，你处理两种类型的数据：引用类型和值类型。第三种是指针类型。要操作指针类型，你需要允许你规避 CLR 内存管理的运算符。\n\n指针是一个表示内存中特定位置的变量。使用以下运算符来创建和处理指针变量：\n\
  \n1. `*` 运算符（在这种情况下也称为关键字）是构建指针变量所需的。它的工作方式与 C++ 中的指针间接完全一样。\n2. 需要 `&` 运算符来获取变量的地址。\n\
  3. 需要 `->` 运算符来访问指针变量表示的特定类型的字段。\n4. 需要 `[]` 运算符对指针变量指向的槽进行索引。如果你了解 C++，你会发现这与运算符与变量之间的交互相似之处。\n\
  5. `++` 和 `--` 运算符应用于指针类型以进行递增或减少。\n6. `+` 和 `-` 运算符作为普通的加减法运算符工作，可以与指针类型配合。\n7.\
  \ 所有的比较和相等运算符也可以用于指针类型。\n8. 需要 `Stackalloc` 关键字直接在堆上分配数组。\n9. `Fixed` 关键字用于固定变量以便发现其地址。\n\
  \n简要警告一下，你可以自由探索指针操作，但 .NET 运行时将不知道你在做什么。所以，如果你不确定自己在做什么，最好不要这样做——你可能不想要那些类型的后果。\n\
  \n解决完这些问题，让我们开始吧。当你想要通过直接访问 CLR 外部内存来优化程序的部分时，你可能需要指针类型。另一种情况是你想要调用以 C 为核心的 dll\
  \ 文件或 COM 服务，因为它们需要指针。在这种情况下，你有选择跳过指针并使用 `System.IntPtr`。\n\n如果你决定使用指针类型，你需要告诉编译器\
  \ (`csc.exe`) 你想使用“不安全代码”（unsafe code）。方法如下：\n\n```bash\ncsc /unsafe *.cs\n```\n\
  \n在 Visual Studio 中，导航到属性中的生成选项卡并选择“允许不安全代码 (allow unsafe code)”。然后创建一个启用该设置的型控制台程序。\n\
  \n首先，你需要使用 `unsafe` 关键字将你的代码声明为不安全。如果不这样做，它将被视为安全的。方法如下：\n\n```csharp\nclass myApp\
  \ {\n    static void Main(string[] args)\n    {\n        unsafe\n        {\n   \
  \         // 你只能在此块内玩弄指针类型！\n        }\n        // 指针在此部分没有效力！\n    }\n}\n```\n\n\
  在方法内部，我们可以创建任何内容——类、结构体和参数等——只要我们做了我们的“不安全”声明。下面是一些示例：\n\n```csharp\n// 在这里，我们将有一个不安全的结构体，\n\
  // 它只在不安全环境中工作\nunsafe struct Node { public int Value; public Node* Left; public\
  \ Node* Right; }\n\n// 在这里我们有一个安全的结构体，但 Node2 的成员是不安全的。\n// 然而，你可以从不安全环境外部访问该值，\n\
  // “Left”和“Right”除外。\npublic struct Node2\n{\n    public int Value;\n    // 你只能在不安全环境中访问这些\n\
  \    public unsafe Node2* Left;\n    public unsafe Node2* Right;\n}\n```\n\n现在可以将方法标记为\
  \ unsafe。假设你有一个可以从指针受益的静态方法：\n\n```csharp\nstatic unsafe void SquareIntPointer (int*\
  \ myIntPointer)\n{\n    // 通过平方进行测试。\n    *myIntPointer *= *myIntPointer;\n}\n\n\
  // 这种情况需要调用者以 unsafe 调用。\nstatic void Main (string[] args)\n{\n    unsafe\n    {\n\
  \        int myInt = 10;\n        // 我们在不安全环境中。\n        SquareIntPointer(&myInt);\n\
  \        Console.WriteLine(\"myInt: {0}\", myInt);\n    }\n\n    int myInt2 = 5;\n\
  \    // 现在由于我们不在不安全环境中，你会看到编译器错误。\n    SquareIntPointer(&myInt2);\n    Console.WriteLine(\"\
  myInt: {0}\", myInt2);\n}\n```\n\n\n\n\n\n在查看库的配置方法之前，我们首先需要了解如何在 .NET 命名空间中封装自定义类型。到目前为止，你只处理过依赖基本命名空间（即\
  \ `System`）的小应用程序。当你开始构建更复杂的程序时，自定义命名空间对你的类型的重要性将变得显而易见。你还应该知道，定义自定义命名空间比拥有大量的 dll\
  \ 程序集更有益，因为你的合作伙伴最终需要一种引用该库的方法来使用你创建的类型。这涉及到导入自定义命名空间。\n\n为了说明自定义命名空间的重要性，我们将创建一个名为\
  \ `MyCustomNamespaces` 的新项目。假设我们正在构建一组动物类，包括 `Cat`、`Dog` 和 `Ferret`（雪鼬）。由于它们具有某些相似之处，我们应该将它们归在一个名为\
  \ `MyAnimals` 的单一命名空间下。该命名空间属于 `MyCustomNamespaces` 程序集。现在我们有两个选择：要么将我们的类定义在一个名为\
  \ `AnimalsLib.cs` 的单文件中，如下所示：\n\n```csharp\n// AnimalsLib.cs using System;\n\nnamespace\
  \ MyAnimals\n{\nclass Cat { /* A collection of members... */ }\nclass Dog { /* Another\
  \ collection of members... */ }\nclass Ferret { /* Another collection of members...\
  \ */ }\n}\n```\n\n请记住，编译器在处理包含所有类型的单个代码文件时不会有问题，但当你尝试重用类定义并将其用于另一个项目时，你会遇到一些问题。例如，你可能在一个新项目中的需要\
  \ `Cat` 类的功能。当每个类型都定义在一个文件中时，你必须处理整个 set 的类。这就是选择替代方案的原因：将命名空间划分到不同的代码文件中。你只需要做的就是确保通过包装在相同的命名空间定义中，将所有类型封装在适当的逻辑集合中。让我们来说说明：\n\
  \n```csharp\n// Cat.cs using System;\nnamespace MyAnimals\n{\nclass Cat { /* A collection\
  \ of methods... */ }\n}\n\n// Dog.cs using System;\nnamespace MyAnimals\n{\nclass\
  \ Dog { /* Another collection of methods... */ }\n}\n\n// Ferret.cs using System;\n\
  namespace MyAnimals\n{\nclass Ferret { /* Another collection of methods... */ }\n\
  }\n```\n\n通过这两种方案，你可以看到 `MyAnimals` 命名空间充当了包含类的抽象包。当我们处理一个需要访问另一个命名空间类型的不同命名空间时，我们必须应用\
  \ `using` 关键字。\n\n```csharp\n// 从公共类库中导入命名空间的示例。\nusing System;\n// 使用定义在 MyAnimals\
  \ 命名空间内的类型。\nusing MyAnimals;\n\nnamespace MyCustomNamespaces\n{\n    public class\
  \ Program\n    {\n        static void Main (string[] args)\n        {\n        \
  \    Dog d = new Dog();\n            Cat c = new Cat();\n            Ferret f =\
  \ new Ferret();\n        }\n    }\n}\n```\n\n在上面的示例中，我们假设定义 `MyAnimals` 命名空间的代码文件是持有定义\
  \ `MyCustomNamespaces` 文件的组件。我们实际上讨论的是编译可执行程序集所需的所有文件。请记住，当你在外部程序集中定义 `MyAnimals`\
  \ 命名空间时，在编译过程之前必须为库提供引用。我们将在本章的章节进一步讨论这个主题。\n\n## 使用全限定名称解决命名冲突\n\n要知道，在引用定义在外部命名空间内的类型时，并不总是应用\
  \ `using` 关键字。你可以使用类型的完整名称，如下所示：\n\n```csharp\n// 请记住，这次我们不需要导入 MyAnimals 命名空间。\n\
  using System;\n\nnamespace MyCustomNamespaces\n{\n    public class Program\n   \
  \ {\n        static void Main(string[] args)\n        {\n            MyShapes.Dog\
  \ d = new MyAnimals.Dog();\n            MyShapes.Cat c = new MyAnimals.Cat();\n\
  \            MyShapes.Ferret f = new MyAnimals.Ferret();\n        }\n    }\n}\n\
  ```\n\n通常，你不需要使用完整名称，因为这不会提高代码或执行速度。CIL 代码使用全限定名称定义类型，但 C# 的 `using` 关键字可以帮助你避免重复输入。使用全名有其优势；它可以帮助你避免由于多个命名空间共享相同名称而引起的冲突。例如，如果你有另一个名为\
  \ `MyMammals` 的命名空间，并定义了三个类：\n\n```csharp\nusing System;\nnamespace MyMammals\n\
  {\n    class Cat { } // Cat 类.\n    class Dog { } // Dog 类.\n    class Ferret {\
  \ } // Ferret 类.\n}\n```\n\n我们将用接几行更新 `Program` 类。注意由于两个命名空间共享相同名称的类而出现的编译时错误。\n\
  \n```csharp\nusing System;\nusing MyAnimals;\nusing MyMammals;\n\nnamespace MyCustomNamespaces\n\
  {\n    public class Program\n    {\n        static void Main(string[] args)\n  \
  \      {\n            // 对我们引用的命名空间产生困惑\n            Dog d = new Dog();      //\
  \ 我们收到了编译错误！\n            Cat c = new Cat();       // 我们收到了编译错误！\n            Ferret\
  \ f = new Ferret(); // 我们收到了编译错误！\n        }\n    }\n}\n```\n\n为了解决这个问题，我们需要使用类型的全名，如下：\n\
  \n```csharp\n// 困惑问题解决。\nstatic void Main(string[] args)\n{\n    MyMammals.Dog d\
  \ = new MyMammals.Dog();\n    MyMammals.Cat c = new MyMammals.Cat();\n    MyMammals.Ferret\
  \ f = new MyMammals.Ferret();\n}\n```\n\n## 使用别名解决命名冲突\n\n`using` 关键字还可以为类型的全名设置别名。别名是在编译期间代表名称的标记，因此是解决命名冲突的有效方法。这里有一个示例：\n\
  \n```csharp\nusing System;\nusing MyAnimals;\nusing MyMammals;\n// 通过创建别名来解决任何冲突。\n\
  using Dog = MyMammals.Dog;\n\nnamespace MyCustomNamespaces\n{\n    class Program\n\
  \    {\n        static void Main (string[] args)\n        {\n            // 我们正在创建一个\
  \ MyMammals.Dog 类。\n            Dog d2 = new Dog(); \n        }\n    }\n}\n```\n\
  \n这种方法也允许你为命名空间设置别名。在处理长命名空间时非常有用。基础库中的一个例子是：`System.Runtime.Serialization.Formatters.Binary`，它包含了\
  \ `Binary Formatter`。以下是我们如何为它设置别名的：\n\n```csharp\nusing bfHome = System.Runtime.Serialization.Formatters.Binary;\n\
  namespace MyApp\n{\n    class ShapeTester\n    {\n        static void Main(string[]\
  \ args)\n        {\n            bfHome.BinaryFormatter b = new bfHome.BinaryFormatter();\
  \ \n        }\n    }\n}\n```\n\n如果你不知道 `BinaryFormatter` 类的功能，没关系。我们只是在演示别名。记住，你可以利用\
  \ `using` 关键字为长且难以记忆的类型名称创建别名，并解决命名冲突。不要过度使用这种方法，因为太多的别名会让你和你的同事感到困惑。同事可能会因为字段太拥挤而难以弄清许多标记指向什么。\n\
  \n## 嵌套命名空间\n\n可以在其他命名空间内部设置命名空间。有趣的是，许多基础库已经这样做了，允许它们提供组织良好的分布模式。例如，`IO` 命名空间定义在\
  \ `System` 内部。这就是为什么我们有 `System.IO`。现在，让我们设置一个包含 `MyMammals` 命名空间的根命名空间：\n\n```csharp\n\
  // 如何嵌套命名空间。\nnamespace Tutorial\n{\n    namespace MyMammals\n    {\n        class\
  \ Cat { }\n        class Dog { }\n        class Ferret { }\n    }\n}\n```\n\n根命名还为我们提供了另一个作用域级别。因此，它不需要直接在其作用范围内定义类型数量。或者，我们可以这样定义嵌套命名空间：\n\
  \n```csharp\n// 命名空间嵌套 2.0。\nnamespace Tutorial.MyMammals\n{\n    class Cat { }\n\
  \    class Dog { }\n    class Ferret { }\n}\n```\n\n`MyMammals` 命名空间现在嵌套在 `Tutorial`\
  \ 命名空间中。现在我们需要用当前的别名和指令更新我们的代码：\n\n```csharp\nusing Tutorial.MyMammals;\n```\n\n\
  \n\n\n\n```cs\nusing Dog = Tutorial.MyMammals.Dog;\n```\n\n注意，在 Visual Studio 中工作时，程序命名空间的名称默认即为项目名称。这意味着你必须通过\
  \ `Project > Add New Item` 菜单添加后续代码，以便在默认命名空间中插入新类型。要重命名命名空间，你应该点击属性（Properties）选项卡中应用程序面板上的`Default\
  \ Namespace`默认命名空间）选项。从以后，添加到项目中的所有内容都将成为 `Tutorial` 根命名空间以及使用它们的其他命名空间的一部分。\n\n\
  现在，让我们讨论 .NET 程序集及其优势。\n\n## .NET 程序集的目的\n\n.NET 程序是通过将多个程序集连接在一起创建的。程序集可以被视为托管在\
  \ `CLR` 中的二进制文件。像 `.exe` 和 `.dll` 这样的普通二进制文件与使用相同扩展名的旧版二进制文件并没有多少共同之处。因此，为了理解它的工作原理，我们必须讨论程序集结构的优势：\n\
  \n1. **代码复用性**：在 `C#` 中进行编程时，你可能认为你的程序是可执行程序集的一部分，但事实并非如此。你构建的程序依赖于 .NET 库中的多个类型，或者\
  \ `mscorlib.dll` 和 `System.Core.dll`。类库以 `.dll` 文件的形式提供，包含了各种外部程序所需的所有类型。因此，每当我们开发一个可执行程序集时，我们都依赖系统库和自定义库来构建应用程序。注意，类库并不一定包含\
  \ `.dll` 扩展名。程序集也可以使用可执行文件中的各种类型。.NET 框架允许我们复用任何类型，不受语言限制，无论我们如何封装该库。例如，可能使用 `C#`\
  \ 构建一个新库，并在另一个 .NET 语言中使用它。我们还从这些语言中派生类型。例如，在 `C#` 中定义的基类可以由使用 `Basic` 创建的类进行扩展。在\
  \ `F#` 中定义的接口可以集成到任何 `C#` 结构中。当将可执行文件反汇为程序集集合时，我们得到的代码不依赖于特定语言，并且可以以多种方式复用。\n\n\
  2. **可版本化单元**：程序集被视为可版本的单元，这意味着它们被分配了由四个部分组成的版本号：`<major>.<minor>.<build>.<revision>`。\n\
  \n3. 如果你不指定版本，你的程序集将被设置为版本 `1.0.0.0`。为什么这很重要？这意味着我们可以使用带有公密钥值的值号，从而允许同一个程序集的不同版本在同一机器上协同工作。\n\
  \n4. **类型边界**：类型的全名是由其所属命名空间的前缀加上自身的名称构成的。程序集还提供了标识类型的信息。假设我们有两个程序集，`MyBirds` 和\
  \ `YourBirds`，它们都定义在相同的命名空间 `BirdLibrary` 中，且都包含 `Raven` 类。在 .NET 中，这些是唯一的类型。\n\n\
  5. **自描述性**：程序集被认为是自描述的，因为它们记录了实现其目的所需访问的所有外部程序集。这意味着如果一个程序集需要访问 `System.Windows.Forms`\
  \ 和 `System.Core` 库，该依赖项将列在程序集的清单（manifest）中。清单被称为包含元数据的集合，包含了名称、版本等描述性信息。此外，我们还拥有包含程序集内容信息的元数据，例如接口、类、构造函数以及每种类型的成员。程序集的文档非常详尽，因此\
  \ `CLR` 不需要检查系统注册表中查找外部库的位置。\n\n6. **程序集可以被配置**：程序集可以设置为私有的（private）和共享的（shared）。私有程序集位于依赖它的应用程序相同的目录中。另一方面，共享程序集被同一系统中的多个程序使用。它们需要成为全局程序集缓存（GAC）目录的一部分。如既往，你可以编辑和编写配置文件；无论它们是如何部署的。通过这种方式，你可以告诉\
  \ `CLR` 在特定位置搜索程序集或加载特定版本。\n\n## 总结\n\n在本章中，我们学习了 .NET 类库、定义自定义命名空间以及嵌套命名空间。我们讨论了如何解决处理多个命名空间时出现的冲突。你学得越多，就越能够配置应用程序的每个细节，以便尽可能容易地维护它。在下一章中，我们将讨论反射和后期绑定。\n\
  \n# 第 3 章：类型反射和后期绑定\n\n将程序集视为有关任何 .NET 部署的基础组件。我们可以使用 Visual Studio 的对象浏览器和类似工具探索应用程序程序集引用内部的类型。诸如\
  \ `ildasm.exe` 这样的外部程序，允许我们检查元数据、CIL 代码和程序集清单。另一种方法是通过 `System.Reflection` 命名空间提取数据。\n\
  \n本章将探索反射的概念和元数据的意义。我们还将查看一些与反射相关的课题。例如，我们将看到 .NET 如何使用后期绑定来激活从编译角度来看未知的类型。\n\n\
  ## 类型元数据\n\n元数据非常重要，因为它通过提供有关所有类、结构、枚举、接口和委托的信息来描述我们的类型。许多属于 .NET 的工具都可以利用这些信息。例如\
  \ Windows 通信基础（WCF），它在运行时需要类型格式。还有几个编译器工具和 IntelliSense。它们都需要知道类型描述。\n\n我们使用键盘快捷键\
  \ `Ctrl + M` 并打开你构建的程序集之一，通过 `ildasm.exe` 查看类型的元数据日期。看看发生了什么。\n\n注意元数据中有多少信息（或内容）。它不是你可以放在书里的东西。它很多。我们制作的简单程序集的信息可能包含多页。\n\
  \n所有定义的类型都使用 `TypeDef #n` 令牌在文档中描述。如果类型定义在另一个程序集中，它被记录为带有 `TypeRef #n` 令牌的引用类型。第二个示例涉及一种指向外部程序集内部类型元数据的指针。这意味着我们可以将元数据总结为描述所有类型定义和引用类型的表格信息集合。\n\
  \n如果你没有尝试过 `ildasm.exe`，让我们来看一些元数据：\n\n```\nTypeDef #2 (02000003)\nTypDefName: CarLibrary.EngineState\
  \ (02000003)\nFlags: [Public][AutoLayout][Class][Sealed][AnsiClass] (00000101)\n\
  Extends: 01000001 [TypeRef] System.Enum\nField #1 (04000006)\nField Name: value__\
  \ (04000006)\nFlags: [Public][SpecialName][RTSpecialName] (00000606)\nCallCnvntn:\
  \ [FIELD]\nField type: I4\nField #2 (04000007)\nField Name: engineAlive (04000007)\n\
  Flags: [Public][Static][Literal][HasDefault] (00008056)\nDefltValue: (I4) 0\nCallCnvntn:\
  \ [FIELD]\nField type: ValueClass CarLibrary.EngineState\n```\n\n在上面的示例中，`TypDefName`\
  \ 表达式决定了名称，即 `CarLIbrary.EngineState`。\n\n\n\n\n反射涉及运行时类型发现；我们可以使用它来通过 `ildasm.exe`\
  \ 工具获取早期章节获得的信息。例如，我们可以检索程序集中所有类型的列表。该列表将包含类型中定义的所有内容，如方法、属性和字段。我们还可以获取具有特定支持接口的信息以及与其方法相关的详细信息，例如命名空间和类。让我们以\
  \ `System.Reflection` 为例。以下是你需要了解的项：\n\n1. `Assembly`：它是一个抽象类，包含一个成员集合，允许我们加载、观察和操纵程序集。\n\
  2. `AssemblyName`：它是允许我们学习有关程序集身份信息的类，例如程序集的版本。\n3. `EventInfo`：包含关于特定事件的细节。\n4.\
  \ `FieldInfo`：包含关于特定字段的信息。\n5. `MethodInfo`：包含关于特定方法的细节。\n6. `ParameterInfo`：包含关于某些参数的细节。\n\
  7. `PropertyInfo`：提供关于属性的信息。\n8. `MemberInfo`：它决定了 `EventInfo`、`FieldInfo`、`MemberInfo`\
  \ 和 `PropertyInfo` 类的行为。\n9. `Module`：这允许我们访问由许多文件组成的程序集中的特定模块。\n\n为了学习如何使用命名空间读取元数据（Metadata），我们将探索\
  \ `System.Type` 类。\n\n`System.Type` 用于查找我们有权访问的成员数量以便以便探索元数据。大多数成员返回来自 `reflection`\
  \ 命名空间的类型。一个例子是 `Type.GetMethods`，它返回一个 `MethodInfo` 项的数组。这样的成员列表非常长。你可以阅读 .NET\
  \ SDK 文档来了解它们。\n\n获取类型类的实例可以通过多种方式实现。记住，你不能使用“new”关键字来构建类型对象，因为它是一个抽象类。我们的第一个选项是\
  \ `System.Object`，它定义了 `GetType` 方法。该方法将返回一个带有元数据的类实例。\n\n```csharp\n// 我们将使用 WildBird\
  \ 实例来访问类型信息。\nWildBird wb = new WildBird();\nType t = sc.GetType();\n```\n\n注意，此方法只有在你拥有关于要反射的类型的编译时信息时才有效。在这种情况下，该类型是\
  \ `WildBird`。你必须在内存中拥有它的实例。\n\n这具有局限性。你现在可以理解为什么像 `ildasm.exe` 这样的工具不会通过直接调用 `GetType`\
  \ 来检索数据。默认情况下，这些工具没有在自定义的程序集中编译。\n\n我们可以用于获取此数据的另一个选项是“typeof”运算符，如下所示：\n\n```csharp\n\
  // 使用 typeof。\nType t = typeof (WildBird);\n```\n\n该运算符不需要你构建尝试获取其信息的对象的实例。你的代码库只需要具有编译时信息。`typeof`\
  \ 需要一个强类型名称，请记住这一点。\n\n获取信息的更灵活的方法是调用 `GetType`，它是 `System.Type` 的一部分。在这种情况下，需要你想要访问的类型的全名。与其他两个选项不同，我们不需要编译时知识，因为\
  \ `Type.GetType` 获取的是 `System.String` 的实例。该方法是重载的，因此我们可以设置布尔值。其中一个参数将控制在未找到类型时抛出异常的方式。第二个参数确保我们设置字符串的大小敏感性。让我们来看一个例子：\n\
  \n```csharp\n// 使用静态 Type.GetType() 方法获取类型信息。\n// 确保在未找到 WildBird 时不出异常，忽略大小写。\n\
  Type t = Type.GetType (\"AnimalLibrary.WildBird\", false, true);\n```\n\n在之前的示例中，通过\
  \ `GetType` 传递字符串没有确认包含类型的程序集。在这个示例中，我们假设类型是在正在操作的程序集内部的。这意味着当我们需要时，很容易地从外部私有程序集访问元数据。\n\
  \n幸运的是，我们可以通过使用类型的全名以及主机程序集的名称格式化字符串参数来获取它。如下所示：\n\n```csharp\n// 为外部程序集中找到的类型获取类型信息。\n\
  Type t = Type.GetType (\"AnimalLibrary.WildBird, AnimalLibrary\");\n```\n\n我们还可以添加加号来指示嵌套类型。例如，假设我们想从嵌套在任何类中的枚举中获取类型信息。你可以这样做：\n\
  \n```csharp\nType t = Type.GetType (\"AnimalLibrary.WildBirds+Species\");\n```\n\
  \n你现在应该已经拥有关于使用 `System.Reflection` 命名空间中的核心成员在运行时检索元数据的知识。反射服务构成了某些编程概念（如晚绑定）的基础。\n\
  \n### 晚绑定\n\n晚绑定允许我们在运行时设置特定类型的实例并调用其任何成员。你不需要拥有关于实例存在的的编译时知识。这意味着一个晚期绑定到属于外部程序集的任何类型的程序并不需要引用该程序集。\n\
  \n程序员经常忽略晚绑定，因为发现应用于对象上的优势需要花费一些精力。建议对对象进行早绑定。例如，最好是添加对程序集的引用并使用“new”关键字指定类型。早绑定允许你在编译期间而不是运行时发现错误。但是，如果你正在创建一个计划扩展的程序，那么晚绑定（late\
  \ binding）仍然起着重要作用。在我们继续之前，让我们讨论一下 `activator` 类。\n\n#### Activator 类\n\n晚绑定依赖 `System.Activator`\
  \ 类，它是基础库的一部分。目前，我们只对 `CreateInstance` 方法感兴趣，因为它允许我们以一种允许晚绑定的方式设置类型实例。知道，该方法具有很大的灵活性，因为它被重载了多次。原则上讲，`CreateInstance`\
  \ 成员的最简单形式接受一个包含你想要分配到内存的项信息的类型对象。\n\n为了说明，我们将创建一个 `LateBindApp` 并导入两个命名空间：`System.IO`\
  \ 和 `System.Reflection`。下面的是程序类：\n\n```csharp\n// 我们将使用晚绑定设置一个对象并加载外部库。\npublic\
  \ class Program\n{\n    static void Main (string[] args)\n    {      \n        Console.WriteLine\
  \ (\"++++ Late Binding is Soul Binding ++++\");      \n        // 尝试加载 AnimalLibrary\
  \ 的本地副本。\n        Assembly a = null;      \n        try      \n        {      \n\
  \            a = Assembly.Load (\"AnimalLibrary\");\n        }\n        Catch (FileNotFoundException\
  \ ex)      \n        {      \n            Console.WriteLine (ex.Message);      \n\
  \            return;      \n        }      \n        if(a != null)      \n     \
  \       CreateUsingLateBinding(a);\n        Console.ReadLine();\n    }\n\n    static\
  \ void CreateUsingLateBinding (Assembly asm)\n    {      \n        try      \n \
  \       {      \n            // 获取 Raven 类型的元数据。\n            Type raven = asm.GetType(\"\
  AnimalLibrary.Raven\");\n            // 设置一个快速的 Raven 实例。\n            object obj\
  \ = Activator.CreateInstance(raven);      \n            Console.WriteLine(\"Created\
  \ a {0} using late binding!\", obj);\n        }\n        catch(Exception ex)   \
  \   \n        {      \n            Console.WriteLine(ex.Message);      \n      \
  \  }\n    }\n}\n```\n\n我们现在无法执行该程序。首先，我们需要复制 `AnimalLivrary.dll` —— 或者你创建的任何文件 ——\
  \ 并放入应用程序的 `bin\\debug` 文件夹中。我们这样做是因为正在调用 `Assembly.Load` 方法，这意味着 CLR 将对文件夹进行扫描。或者，我们可以使用\
  \ `LoadFrom` 代替 `Load` 来设置路径。\n\n注意 `CreateInstance` 方法返回的是一个对象而不是强类型的 `Raven`，这意味着当点操作符应用于\
  \ `obj` 变量时，你将看不到属于 `Raven` 类的成员。你如何修复这个问题？你考虑过显式强制转换吗？让我们看看：\n\n```csharp\n// 通过转换访问\
  \ Raven 的成员\nobject obj = (Raven)Activator.CreateInstance(raven);\n```\n\n\n\n\n\
  // 起作用了吗？没有。我们现在有了一个编译错误。\n\n注意应用程序并没有对 `AnimalLibrary.dll` 的引用。这意味着无法使用 `using`\
  \ 关键字来导入 `AnimalLibrary` 命名空间，这意味着我们无法使用显式类型转换。我们可以得出结论：晚绑定（late binding）的目的是在不知道编译时的情况下设置对象的实例。你可能在问自己如何在\
  \ `System.Object` 引用内部调用 `Raven` 对象的方法。答案是反射（reflection）。\n\n## 调用方法\n\n假设我们的 `Raven`\
  \ 有一个名为“Flight”（飞行）的方法，该方法在显示消息的同时会将翅膀状态设置为“immobile”（不可移动）。要提取该方法的 `MethodInfo`，我们必须使用类型方法\
  \ `GetMethod`。一旦获取了信息项，我们就可以使用 `Invoke` 调用飞行方法。`MethodInfo.Invoke` 的要求是传输到 `MethodInfo`\
  \ 所描述的方法所需的参数。记住，参数是由来自 `System.Object` 的类型数组描述的。`Flight` 方法不需要任何参数，所以我们只需要传递一个\
  \ `null` 值。现在，让我们来看下面的代码：\n\n```\nstatic void BuildWithLateBinding(Assembly asm)\n\
  {\n    try\n    {\n      // 获取我们 Raven 类型的元数据。\n      Type raven = asm.GetType(\"\
  AnimalLibrary.Raven\");\n\n      // 设置 Raven。\n      object obj = Activator.CreateInstance\
  \ (raven);\n      Console.WriteLine(\"Created a {0} with late binding!\", obj);\n\
  \n      // 获取 Flight 的信息。\n      MethodInfo mi = raven.GetMethod(\"Flight\");\n\n\
  \      // 在不带任何参数的情况下调用方法。\n      mi.Invoke(obj, null);\n    }\n    catch(Exception\
  \ ex)\n    {\n      Console.WriteLine(ex.Message);\n    }\n}\n```\n\n你会看到调用 `Flight`\
  \ 方法后消息出现。每当你使用晚绑定来调用不需要参数的方法时，你都需要将参数分组在一个项数组中。尽管如此，这里是 `Animal` 类中定义的 `AnimalLibrary`\
  \ 方法：\n\n```csharp\npublic void EnableFlight (bool flightOn, WingsFlapping wf)\n\
  => MessageBox.Show (flightOn ? $\"Flapping hard{wf}\" : \"Calmly...\");\n```\n\n\
  在这里我们有一个有两个参数的方法：一个布尔值，决定鸟是否飞行；另一个枚举，决定飞行的类型。\n\n让我们另一个属于 `Program` 类的调用 `EnableFlight`\
  \ 的方法。看我们如何使用枚举中的值来提到“fast”（快速）这种飞行类型。\n\n```csharp\nstatic void InvokeMethodWithArgsWithLateBinding\
  \ (Assembly asm)\n{ \n    try\n    {\n      // 第一步是获取乌鸦元数据的描述。\n      Type corvid\
  \ = asm.GetType(\"AnimalLibrary.Crow\");\n\n      // 接下来，我们需要设置乌鸦。\n      object\
  \ obj = Activator.CreateInstance(corvid);\n      // 带参数调用 EnableFlight()。\n    \
  \  MethodInfo mi = corvid.GetMethod(\"EnableFlight\");\n      mi.Invoke(obj, new\
  \ object[] { true, 2 });\n    }\n    catch (Exception ex)\n    {\n      Console.WriteLine(ex.Message);\n\
  \    }\n}\n```\n\n你现在应该能够看到反射、晚绑定和动态加载之间的联系。还有反射 API，我们之前没有讨论。你现在可以自己查看它了。\n\n##\
  \ 总结\n\n反射是一个有趣的功能，特别是在健壮的面向对象构建中。在本章中，我们看到了该概念是如何围绕 `Type` 类和 `reflection` 命名空间展开的。它涉及到在运行时研究和探测，以回答关于对象的谁、什么、何地和为什么的问题。晚绑定涉及在不知道成员名称的情况下设置特定类型的变体并调用成员。该概念与动态加载有关，它允许你将程序集加载到内存中。\n\
  \n让我们转向围绕属性（attributes）的概念。\n\n# 第 4 章：\n\n## 基于属性的编程\n\n.NET 编译器的目的之一是为定义或引用的每个类型创建元数据。此外，.NET\
  \ 为程序员提供了一种在程序集中嵌入自定义元数据的方法。这是通过属性实现的。属性是使用在特定类型（如类、接口、成员、方法、属性或程序集）上的一系列注解。\n\n\
  属性是扩展了 `System.Attribute` 类的类类型。一旦你熟悉了更多命名空间，你就会看到你可以在项目中实现的大量的属性。如果你愿意，也可以开发自定义属性。这将允许你对类型进行完全控制。你还将能够从属性构建新类型。让我们看看基类库中的属性。请记住我们不会列出所有属性，我们将关注最流行的。\n\
  \n1. `CLSCompliant`：此属性强制被标记的对象遵循通用语言规范（common language specification）。注意，遵守 CLS\
  \ 的类型可以在任何 .NET 编程语言中使用。\n2. `DllImport`：此属性允许你的代码调用基于 C 和 C++ 的库。这包括操作系统 API。然而，在处理\
  \ COM 时会避免使用此属性。\n3. `Obsolete`：此属性标识不再使用的元素。尝试使用其中一个对象将给你发出警告。\n4. `Serializable`：此属性将类标记为可序列化，意味着它将被转换为字节流。\n\
  \n记住，当属性在代码内部使用时，任何包含的元数据在另一个组件对其进行反射之前都是毫无意义的。否则，嵌入的元数据会被忽略且不会影响程序集中的任何内容。\n\n\
  ## 属性消费者\n\n.NET 框架带有关注属性的工具和实用程序。例如，编译器做的许多工作之一就是寻找属性。这发生在编译过程中。假设编译器遇到 `CLSCompliant`\
  \ 属性，它将验证被标记的项是否符合 CLS 标准。但并不是所有的开发工具都预装了该功能。\n\n属于基类库的方法已准备好反射许多属性。例如，当你想要让对象的状态持久到文件时，你用\
  \ `Serializable` 属性标记类。当 `Serialize` 方法检测到该属性时，文件将以二进制格式持久。记住，当你开发程序时，你可以赋予它反射你定义的自定义属性以及已可用属性的能力。\n\
  \n## 属性实战\n\n为了直观展示属性是如何实现的，我们将开发小型应用程序。我们将命名为 `AttributesInAction`。我们将处理一个名为 `Warrior`\
  \ 的类，它可以以二进制格式存在。我们必须使用 `Serializable` 属性。记住，我们也可以使用 `NonSerialized` 属性来避免持久化字段。这里是代码：\n\
  \n```csharp\n// 我们可以将创建的类保存到文件中。\n[Serializable] public class Warrior\n{\n    //\
  \ 下一个字段不会被序列化。\n    [NonSerialized] float strengthOfWarrior;\n\n    // 下的字段将保持可序列化。\n\
  \    bool hasSword;\n    bool hasDagger;\n    bool hasArmor;\n}\n```\n\n现在我们不需要知道对象序列化是如何工作的。我们感兴趣的是展示如何以及何时使用属性。看属性如何必须在括号内声明。如果你使用\
  \ `ildas.exe`，你将在编译过程中读取额外的元数据。查看属性如何与可序列化符号（红色三角形）以及附加到 `strengthOfWarrior` 字段上的非序列化符号注册。\n\
  \n\n\n\n一个对象可以拥有多个属性。假设我们有一个标记为 `serializable` 的旧类 `HorseCarriage`，但它也是一个过时的项目。此时不需要删除该类的定义。当你从代码库中删除内容时，会有损坏项目的风险。更明智的做法是使用\
  \ `Obsolete` 属性将其标记。以下是我们的操作方法：\n\n```csharp\n[Serializable, Obsolete (\"Upgrade\
  \ your method of transportation!\")]\n\npublic class HorseCarriage { // ... }\n\
  ```\n\n你也可以通过将属性分别放在它们自己的括号中来实现相同的操作：\n\n```csharp\n[Serializable]\n\n[Obsolete\
  \ (\"Upgrade your method of transportation!\")]\n\npublic class HorseCarriage {\
  \ // ... }\n```\n\n该属性的类名是 `ObsoleteAttribute`，而不是 `Obsolete`。在 .NET 命名规范中，所有属性默认都带有\
  \ `Attribute` 关键字。由于这一点，你每次使用它时都不必手动输入它——C# 可以推断出你在做什么。如果你认为这会让你的代码更具可读性，可以使用这种命名系统。它的写法如下：\n\
  \n```csharp\n[SerializableAttribute]\n\n[ObsoleteAttribute (\"Upgrade your method\
  \ of transportation!\")]\n\npublic class HorseCarriage { // ... }\n```\n\n如果你将与其他\
  \ .NET 语言协作，请考虑遵循带有 `Attribute` 后缀的命名规范。并不是所有语言都像 C# 那么规范。\n\n### 构造函数参数\n\n`Obsolete`\
  \ 属性可以接受构造函数参数。在代码编辑器中右键点击对象并查看属性定义。选择“转到定义”。你会发现属性接受 `System.String`。\n\n```csharp\n\
  public sealed class ObsoleteAttribute : Attribute\n\n{\n\npublic ObsoleteAttribute\
  \ (string message, bool error);\n\npublic ObsoleteAttribute(string message);\n\n\
  public ObsoleteAttribute();\n\npublic bool IsError { get; }\n\npublic string Message\
  \ { get; }\n\n}\n```\n\n记住，当你在属性使用构造函数参数时，它们应该首先被外部工具反射，以便属性能够分配内存。字符串信息将作为元数据存储在程序集中。现在我们有了这个过时的类，可以分配这样一个变体：\n\
  \n```csharp\nstatic void Main(string[] args)\n\n{\n\nHorseCarriage horse = new HorseCarriage();\n\
  }\n```\n\n你可以看到，当光标悬停在过时类型上时，字符串数据是如何在错误列表面板和问题代码行中被检索并显示的。\n\n我们可以得出以下结论：\n\n1.\
  \ 属性是作为 `System.Attribute` 一的类。\n2. 在对象或工具对它们进行反射之前，它们无法发挥作用。\n3. 它们创建了嵌入元数据。\n\
  4. 它们使用方括号应用。\n\n我们已经看了预定义的属性。让我们看看如何自定义属性并应用它们。\n\n### 创建和应用自定义属性\n\n要创建一个属性，我们必须首先定义一个派自\
  \ `System.Attribute` 的类。我们将通过坚持动物主题示例来说明本节重点，并构建一个名为 `AttributedAnimalLibrary` 的新库项目。我们将创建一个程序集，其目的是定义动物的数量。每个动物都将用自定义属性描述：\n\
  \n```csharp\npublic sealed class AnimalDescriptionAttribute : System.Attribute\n\
  \n{\n\npublic string Description { get; set; }\n\npublic AnimalDescriptionAttribute\
  \ (string animalDescription) =>\n\nDescription = animalDescription;\n\npublic AnimalDescriptionAttribute(){\
  \ }\n\n}\n```\n\n在示例中，`AnimalDescriptionAttribute` 持有通过 `Description`（一个自动属性）处理的部分字符串数据。该类派自\
  \ `System.Attribute`；定义上没有特殊之处。但由于潜在的安全风险，建议将所有自定义属性创建为 `sealed`。\n\n现在我们按照意愿对类型进行注释。让我们为刚刚创建的库添加一些类定义：\n\
  \n```csharp\n// 我们需要使用命名属性来分配描述。\n\n[Serializable] [AnimalDescription(Description\
  \ = \"My tired old horse\")]\n\npublic class Horse { }\n\n[Serializable] [Obsolete\
  \ (\"Get a car!\")]\n\n[VehicleDescription(\"My stallion is too old for this… \"\
  )]\n\npublic class Volvo { }\n\n[VehicleDescription(\"A brand new car packed with\
  \ new features\")]\n\npublic class Dodge { }\n```\n\n马的描述添加了一个基于属性的元素，其名为命名属性。\n\
  \n`Description` 属性被用作 `Vehicle Description` 属性的构造函数，在该其中准备字符串数据。当外部方面反射该属性时，值会被传递给\
  \ `Description` 属性。同样，有两个类型没有使用该属性，即 `Volvo` 和 `Dodge`。它们仅通过构造函数传递字符串数据。无论如何，当我们编译\
  \ `AttibutedAnimalLibrary` 时，我们可以使用 `ildasm.exe` 工具访问任何类型的元数据。这将显示所有类的嵌入描述。\n\n\
  ### 程序集级别的属性\n\n可以使用 `[assembly:]` 标签将属性应用于属于程序集的任何类型。假设我们需要保证属于公共类型的所有成员都定义在程序集中，并符合\
  \ CLS 规范。记住，符合 CLS 规范的程序集可以在每个 .NET 编程语言上运行。这意味着如果你有一些不符合 CLS 规范的公共成员，其他与 .NET 相关的语言将无法依赖它们。示例包括指针参数和无符号数据。在这种情况下，你需要通过验证\
  \ CLS 兼容性来确保你创建的库可以被其他语言使用。\n\n要检查兼容性，你需要在代码开头一个特定的程序集级属性。程序集级属性需要位于命名空间范围之外。以下是你遵循的模式：\n\
  \n```csharp\n// 首先我们需要创建一小部分 \"using\" 声明列表。\n\nusing System;\n\nusing System.Collections.Generic;\n\
  \nusing System.Linq;\n\nusing System.Text;\n\n// 下一步是声明程序集级属性。\n// 注意，此程序集中发现每一个公共类型\n\
  // 都必须强制执行 CLS 。\n\n[assembly: CLSCompliant(true)]\n\n// 接下来，我们需要类型和命名空间。\n\nnamespace\
  \ AttributedAnimalLibrary { // 类型... }\n```\n\n记住，如果你开始编写某些不符合 CLS 规范的代码，你将看到编译器警告。\n\
  \n```csharp\n// CLS 不支持 Ulong 类型。\n\npublic class Volvo { public ulong notCompliant;\
  \ }\n\n// 编译器警告。\n```\n\n当你导航到 Visual Studio 的解决方案管理器并展开属性选项卡时，你将看到所有项目都包含一个名为 `AssemblyInfo.cs`\
  \ 的文件。你可以使用它将所有想要放在程序集级别的属性放在其中。注意，程序文件（manifest）包含了来自以下属性的元数据：\n\n1. `AssemblyCompany`：此属性包含有关公司的所有信息。\n\
  2. `AssemblyCopyright`：此属性为特定项目提供版权信息。\n3. `AssemblyCulture`：此属性包含有关程序集支持的语言的信息。\n\
  4. `AssemblyDescription`：此属性描述产品。\n5. `AssemblyVersion`：此属性提供程序集的版本。版本格式如下：<major.minor.build.revision>。\n\
  \n还有许多属性。要了解它们的更多信息，请查阅文档。\n\n#### 使用早期绑定反射属性\n\n\n\n\n如果没有其他组件反射其属性值，那么该属性就没有太大用处。只有当属性已知时，软件组件才能对其进行利用或操作。尽管如此，软件元素通常可以通过之前讨论的技术找到该属性：晚期绑定和早期绑定。这意味着只要应用程序可以访问属性的编译时定义，你就可以使用早期绑定。`AttributedAnimalLibrary`\
  \ 程序集包含一个自定义属性的定义。这是因为该属性的定义方式类似于公共类。最好的方法是使用早期绑定。\n\n话虽如此，让我们创建一个名为 `AnimalDescriptionAttributeReader`\
  \ 的新项目，并引用 `AttributedAnimalLibrary`。我们首先将以下代码添加到原始的 `.cs` 文件中：\n\n```cs\n// 使用早期绑定来反射属性。\n\
  \nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\nusing System.Text;\n\
  using AttributedAnimalLibrary;\n\nnamespace AnimalDescriptionAttributeReader\n{\n\
  \nclass Program\n{      \nstatic void Main(string[] args)\n{      \nConsole.WriteLine\
  \ (\"*****AnimalDescriptionAttribute Value*****\\n\");\n\nReflectOnAttributesUsingEarlyBinding();\n\
  \nConsole.ReadLine();\n}\n\nprivate static void ReflectOnAttributesUsingEarlyBinding()\n\
  {      \n// 我们需要获取一个代表马的类型。\nType t = typeof(Horse);\n\n         // 获取所有马属性。   \
  \         \nobject[] customAtts = t.GetCustomAttributes(false);\n\n      // 打印描述。\n\
  foreach (AnimalDescriptionAttribute v in customAtts)      \nConsole.WriteLine(\"\
  -> {0}\\n\", v.Description);      \n}\n\n\n\n\n\n}\n}\n```\n\n值得注意的是 `Type.GetCustomAttributes`\
  \ 方法，它检索一个项数组，其中包含应用到成员的每个属性。成员由类型表示。在这种情况下，它是一个布尔参数，用于确定搜索范围。当检索到属性列表时，我们遍历类并打印来自\
  \ `description` 属性的值。\n\n## 使用晚期绑定反射属性\n\n在早的章节中，我们讨论了使用早期绑定来打印 `Horse` 的描述数据。我们能够做到这一点是因为\
  \ `AnimalDescriptionAttribute` 类被定义为 Attribute Animal Library 中的一个公共成员。但是，通过引入晚期绑定和动态加载来反射属性，我们可以实现更多功能。为了说明这一点，我们将创建一个名为\
  \ `AnimalDescriptionAttributeExploreLB` 的项目。对于此项目，我们需要复制 `AttributedAnimalLibrary`\
  \ 文件并将其粘贴到 `\\bin\\debug` 文件夹。让我们关注代码：\n\n```cs\nusing System;\nusing System.Collections.Generic;\n\
  using System.Linq;\nusing System.Text;\nusing System.Reflection;\n\nnamespace AnimalDescriptionAttributeExplorerLB\n\
  {\n\nclass Program\n{      \nstatic void Main(string[] args)      \n{      \nConsole.WriteLine(\"\
  *****AnimalDescriptionAttribute Value*****\\n\");\n\nReflectAttributesUsingLateBinding();\
  \            \nConsole.ReadLine();\n}\n\n    private static void ReflectAttributesUsingLateBinding()\n\
  {\ntry      \n{      \n// 我们需要加载 AttributedAnimalLibrary 的副本。\nAssembly asm = Assembly.Load(\"\
  AttributedAnimalLibrary\");\n\n         // 从 AnimalDescriptionAttribute 获取类型信息。\n\
  Type animalDesc =\nasm.GetType(\"AttributedAnimalLibrary.AnimalDescriptionAttribute\"\
  );\n// 从 Description 属性获取类型信息。\nPropertyInfo propDesc = animalDesc.GetProperty(\"\
  Description\");\n\n         // 从程序集检索类型。\nType[] types = asm.GetTypes();\n// 为了提取\
  \ AnimalDescriptionAttributes\n// 我们需要遍历每一个类型。\nforeach (Type t in types)\n{\nobject[]\
  \ objs = t.GetCustomAttributes(animalDesc, false);\n// 遍历所有 AnimalDescriptionAttribute\
  \ 并\n// 使用晚期绑定打印描述。\nforeach (object o in objs)\n{\nConsole.WriteLine(\"-> {0}:\
  \ {1}\\n\",\nt.Name, propDesc.GetValue(o, null));\n}\n}\n}\ncatch (Exception ex)\n\
  { Console.WriteLine(ex.Message); }}}}\n```\n\n如果你一直在跟着学习，这段代码中的一切都易于理解。代码是自解释的，所以如果你感到有些困惑，请再看几次。唯一不同的是用于激活属性访问器的\
  \ `GetValue` 方法。\n\n## 反射、晚期绑定和自定义属性\n\n到目前为止，我们已经通过许多示例探索了这些概念和技术，但你可能会好奇应该在什么场景下实现它们。产生这种疑问是完全正常的，因为我们一直在探索一些非常学术的编程方面。为了更好地理解这些内容如何帮助现实世界的项目，你需要回顾理论。假设你是一个大型团队的一员程序员，你正在编写一个需要满足以下条件的新程序。\n\
  \n该程序必须能够被其他外部工具扩展。考虑这意味着什么。考虑我们正在使用的 IDE：`Visual Studio`。当它最初被创建时，代码中留下了“门”，以允许第三方软件开发者添加他们自己的模块。在这种情况下，此\
  \ IDE 的开发者无法对尚未创建的外部程序集定义引用。他们是如何解决这些问题的？让我们看看：\n\n1. 首先要记住，任何可扩展的程序必须提供一个输入系统，使用户能够指示需要附加哪些模块。这部分需要动态加载。\n\
  2. 所有可扩展的程序都必须建立支持我们需要的功能的能力。例如，当我们需要连接到环境的接口时。这一步需要反射。\n3. 我们最后需要晚期绑定。可扩展程序必须提取对特定基础设施（如接口类型集合）的引用，并调用成员来触发它们的基本功能。\n\
  \n我们可以说，一个准备好查询某些接口的可扩展程序可以告诉该类型在运行时是否可以被激活。从本质上说，这是一个检查。一旦通过验证，特定类型将支持额外的接口，从而增强其基本功能。\n\
  \n## 总结\n\n在本章中，我们主要查看了属性以及基于属性编程的目的。我们查看了预定义属性以及如何创建和应用自定义属性。我们查看了早期绑定和晚期绑定在此背景下的应用方式。只需记住，当你使用属性时，你改进了基本功能程序集元数据。\n\
  \n# 第 5 章：\n\n## CIL 和动态程序集\n\n在开发 .NET 程序时，你最可能使用 `C#` 进行大部分编程。毕竟，这是你阅读此的原因，而且使用\
  \ `C#` 既简单高效。如果你还记得早期的课程，就会知道编译器的作用是将包含代码的 `.cs` 文件转换为 `CIL` 代码、元数据和程序集清单的集合。有趣的是，`CIL`\
  \ 是一种功能完整的编程语言，它有自己的语法和编译器。\n\n在本章中，我们将学习 `CIL`，它可以被认为是 .NET 的原生语言。我们将学习 `CIL` 指令、属性或操作码（opcode）之间的区别。我们还将探索程序集的反向工程和其他专注于\
  \ `CIL` 的工具。你将获得在 `CIL` 中声明和定义类型、命名空间和成员的基础知识。\n\n很少有程序员学习 `CIL`因为它并不经常使用，所以让我们探索一下为什么要学习它。\n\
  \n### 为什么要费心学习 CIL？\n\n如所述，`CIL` 是 .NET 的原生语言。每当你使用 visual basic、F# 或 `C#` 创建程序集时，编译器都会将其转换为\
  \ `CIL`。像任何语言一样，`CIL` 拥有自己的语法和标记，因为它是一种完整的编程语言。因此，你可以使用 `CIL` 创建程序集并使用 `ilasm.exe`（`CIL`\
  \ 的编译器）进行编译。\n\n\n\n尽管它并不流行，但 `CIL` 具有许多巨大的价值。你对 `CIL` 的了解越多，在高级编程方面的进展就越容易。以下是学习通过学习\
  \ `CIL` 能够获得的几个示例：\n\n1. 你将能够解构一个功能完备的汇编，编辑其代码并将新版本重新编译为自定义的 `.NET` 二进制文件。当你需要更改\
  \ `CIL` 以与各种 COM 功能进行互操作时，这非常有用。\n\n2. 备有 `CIL` 的知识将帮助你通过 `System.Reflection.Emit`\
  \ 命名空间创建动态程序集。该命名空间是一个允许你创建内存中程序集的 API，该程序集可以持久化到磁盘。如果你计划使用 C# 技能开发工具，这将非常有用，因为你将能够快速生成程序集。\n\
  \n3. 你将对 `CTS` 有深入的理解，特别是那些只能在 `CIL` 级别找到各种函数。请注意，`CIL` 是唯一与 `.NET` 相关的编程语言，它允许你控制\
  \ `CTS` 的每一个特性和功能。例如，你可以通过 `CIL` 定义全局成员和字段。记住，这在 C# 中是不允许的。\n\n如果你仍然确定要学习 `CIL`，没关系。如果你只是想精通\
  \ C# 和 `.NET` 基础库，你不必学习。然而，`CIL` 确实提供了对编程更深层的理解，你可能会发现这很有。你可以将 `CIL` 与 C 程序员对汇编语言的知识进行比较。优势在于，理解更深的程序员可以提出他们其他情况下无法想出的先进、原始的解决方案。为了有机会成为编程大师，你应该尝试一下\
  \ `CIL`。\n\n本章的目的是教你 `CIL` 的更高级的原理。我们不会从零开始探索语法。如果本章激发了你对该语言的兴趣，请查看此链接并下载官方文档：https://www.ecma-international.org/publications/standards/Ecma-335.htm\n\
  \n### CIL 指令、属性和操作码\n\n在探索像 `CIL` 这样的低级语言时，你会发现一些奇怪的术语和概念，即使是熟悉的想法看起来也极其复杂。为了说明，请看这个集合：\n\
  \n`{ new, private, public, get, enum, operator, this, unsafe}`\n\n你一看到它们，就知道它们是\
  \ C# 关键字。但，如果你深入挖掘一下，你会发现它们有不同的含义。例如，`enum` 定义了一个派自 `System.Enum` 的类型。`this` 关键字引用当前对象。`unsafe`\
  \ 决定了 `CLR` 是否可以直接观察代码块。`operator` 允许你创建一个隐藏方法，该方法只有在你使用特定运算符（如减号）时才会被调用。`CIL` 不仅仅定义了关键字。编译器理解的符号分为若干类别，这些类别根据其含义进一步分类。这些类别是\
  \ `CIL` 指令、属性和操作码（opcodes，称为操作代码）。所有这些类别都通过语法和标记表示。现在，让我们看看每个类别扮演的角色：\n\n1. **CIL\
  \ 指令 (CIL Directives)**：描述程序集架构的 `CIL` 标记被称为指令。它们的目的是通知编译器在程序集中应该如何定义类型、成员和命名空间。指令可以通过它们如何用点前缀隔开来识别，例如：`.namespace`、`.method`\
  \ 等。当编译器面对具有单个命名空间指令和两个类指令的 `CIL` 文件时，它将创建一个定义了一个包含两个类类型的命名空间的程序集。\n\n2. **CIL 属性\
  \ (CIL Attributes)**：通常，`CIL` 指令提供的描述数据不足以解释类型或成员的定义。因此，我们可以使用 `CIL` 属性指定许多指令，以确定它们应该如何被处理。例如，我们可以为类指令添加\
  \ `public` 属性，同时带有 `extends` 属性和 `implements` 属性。`public` 属性决定可见性类型，而 `extends`\
  \ 属性描述基类，`implements` 属性列出了类型支持的接口。不应将 `CIL` 属性与 `.NET` 属性混淆，因为它们在概念上不同。\n\n3. **CIL\
  \ 操作码 (CIL Opcodes)**：在用 `CIL` 指令和和属性定义命名空间和类型后，我们必须添加拼图最后的碎片：实现的逻辑。这就是为什么我们有操作代码。与其他低级编程语言类似，操作码在语言上很难理解。这意味着当你加载一个字符串变量时，你会使用一个名为\
  \ `LoadString` 的操作码，但在 `CIL` 中，它将是 `ldstr`。虽然可读性和发音可能是个问题，但操作码仅在实现范围内使用。\n\n正如提到的，像\
  \ `ldstr` 等操作码对于实现特定类型的成员是必要的。但，这些标记本质上是代表二进制操作码的 `CIL` 助记符。所以，假设我们有一个像这样写的 C# 方法：\n\
  \n```csharp\nstatic int Add (int x, int y)\n{\n    return x + y;\n}\n```\n\n两个数字之和的操作码是\
  \ `0X58`。使用 `0X59` 操作码减去两个值。编译器以二进制信息块的形式处理 `CIL` 代码。这听起来很复杂，但所有的二进制操作码都可以用助记符代替。例如，在加法操作的情况下，可以使用\
  \ `add` 助记符代替 `0X58` 来相加。现在你看到了二进制和助记符之间的区别，你应该知道 `CIL` 反编译器器会自动将二进制代码转换为相应的助记符。以下示例是我们的\
  \ `Add` 方法的 `CIL` 表示：\n\n```cil\n.method private hidebysig static int32 Add(int32\
  \ x, int32 y) cil managed\n{\n    .maxstack 2\n    .locals init ([0] int32 CS$1$0000)\n\
  \    IL_0000: nop\n    IL_0001: ldarg.0\n    IL_0002: ldarg.1\n    IL_0003: add\n\
  \    IL_0004: stloc.0\n    IL_0005: br.s\n    IL_0007\n    IL_0007: ldloc.0\n  \
  \  IL_0008: ret\n}\n```\n\n如你所见，很难理解。用 `CIL` 创建程序时，你不需要处理二进制操作码。当 `CIL` 程序员谈论使用\
  \ `CIL` 代码时，他们指的是助记符。\n\n\n\n当你看到此方法如何从 C# 编译器翻译为 CIL 时，你会发现该方法将依赖于 `.locals` 指令为变量定义一个存储区域。通过使用\
  \ `ldstr` 和 `stloc.o` CIL 操作码，字符串被加载并存储在变量内部。正如你所知的，第一个代表加载字符串（load string）。第二个则翻译为加载索引为\
  \ 0 的局部参数。该索引的值通过 `ldloc.o` 操作码加载到内存中，然后通过 `ret` 操作码返回函数。\n\n现在你已经理解了 CIL 指令、操作码和属性，让我们让我们结合实际应用来探索\
  \ CIL 编程吧。\n\n### 逆向工程 (Round Trip Engineering)\n\n我们已经知道 `ildasm.exe` 工具被用于检查生成的\
  \ CIL 代码，但你应该知道它还能从加载的程序集中将 CIL 代码转储到外部文件中。当你拥有 CIL 代码时，可以对其进行编辑并重新编译——这是一个非常实用的功能。这被称为逆向工程，它在以下情况下非常有用：\n\
  \n1. 你丢失了程序集的源代码，但你仍然需要修改它。\n2. 你遇到了错误的编译，导致翻译出了有错误的 CIL，但你需要编辑代码库。\n3. 你正在为 COM\
  \ 互操作性构建库，并且需要考虑各种 COM IDL 属性，但这些属性在翻译过程中消失了。\n\n为了说明这一点，我们将使用任何文本编辑器（记事本即可）创建一个名为\
  \ `HelloApp.cs` 的新文件，然后声明一个类类型。如果你愿意，可以在 Visual Studio 中创建一个控制台应用程序。如果是这样，你必须移除\
  \ `AssemblyInfo` 文件，因为它会生成我们不需要的 CIL 代码。让我们来看程序：\n\n```csharp\n// 一个基础的 C# 控制台程序。\n\
  using System;\n\n// 类将不会封装在命名空间内。\n// 这将导致更简单的 CIL 代码块。\nclass Program { \n    static\
  \ void Main(string[] args)\n    {\n        Console.WriteLine (\"Hello CILly!\");\n\
  \        Console.ReadLine();\n    }\n}\n```\n\n将文件保存到指定的目录中。然后使用以下命令编译应用程序：\n\n\
  ```bash\ncsc HelloApp.cs\n```\n\n使用 `ildasm` 工具运行该文件。导航到 File（文件）然后选择 Dump（转储）菜单，将\
  \ CIL 代码保存到扩展名为 `.il` 的单独文件中。将文件保存在你编译的地方。保持所有设置为默认值。此外，当转储程序集数据时，`ildasm` 工具会创建一个\
  \ `.res` 文件。这是一个资源文件，你可以删除它或忽略它——我们不需要它。它包含了 CLR 安全数据，与我们的目的无关。\n\n现在，我们可以用任何文本编辑器查看\
  \ CIL 文件。它看起来应该是这样的：\n\n```il\n// 这里有我们引用的外部程序集。\n.assembly extern mscorlib\n{\n\
  .publickeytoken = (B7 7A 5C 56 19 34 E0 89 )\n.ver 4:0:0:0\n}\n\n// 这里有我们自己的程序集。\n\
  .assembly HelloApp\n{\n/**** 为了清晰起删了 TargetFrameworkAttribute 数据！*****/\n.hash algorithm\
  \ 0x00008004\n.ver 0:0:0:0\n}\n\n.module HelloApp.exe\n.imagebase 0x00400000\n.file\
  \ alignment 0x00000200\n.stackreserve 0x00100000\n.subsystem 0x0003\n.corflags 0x00000003\n\
  \n// 定义 Program 类。\n.class private auto ansi beforefieldinit Program\nextends [mscorlib]System.Object\n\
  {\n.method private hidebysig static void Main(string[] args) cil managed\n{\n//\
  \ 该方法成为可执行文件的入口点。\n.entrypoint\n.maxstack 8\nIL_0000: nop\nIL_0001: ldstr \"Hello\
  \ CILly!\"\nIL_0006: call void [mscorlib]System.Console::WriteLine(string)\nIL_000b:\
  \ nop\nIL_000c: call string [mscorlib]System.Console::ReadLine()\nIL_0011: pop\n\
  IL_0012: ret\n}\n\n// 这里有构造函数.\n.method public hidebysig specialname rtspecialname\n\
  instance void .ctor() cil managed\n{\n.maxstack 8\nIL_0000: ldarg.0\nIL_0001: call\
  \ instance void [mscorlib]System.Object::.ctor()\nIL_0006: ret\n}\n}\n```\n\n当声明所有外部引用程序集后，就会打开\
  \ CIL 代码文件。在上面的示例中，我们为 `mscorlib` 声明了单一 `.assembly` 标记。记住，如果类库依赖于其他程序集中的类型，你必须添加额外的程序集指令。下一步是查找默认版本设置的程序集定义，因为我们从未提到过该值。在这种情况下，版本为\
  \ `0.0.0.0`。你可以使用 `AssemblyVersion` 属性来创建一个不同的版本。此外，程序集由如 `.module` 等多个指令描述。\n\n\
  一旦程序集被记录并定义，该定义就变成了 `Program` 类型的定义。注意类方向包含许多属性，这些属性是可选的。大部分 CIL 代码是 `Main` 方法和构造函数实现的表示。这两者都是通过被指示的方法定义的。请注意，当成员通过各种属性和指令定义时，它们是通过许多操作码来实现的。你需要确保理解了这一点。当你在\
  \ CIL 中处理 .NET 类型时，必须知道该类型的完全限定名称。此外，名称必须以程序集名称作为前缀。在下面的示例中，我们在 CIL 中实现了 `Main`\
  \ 方法：\n\n```il\n.method private hidebysig static void Main(string[] args) cil managed\n\
  {\n.entrypoint\n.maxstack 8\nIL_0000: nop\nIL_0001: ldstr \"Hello CILly!\"\nIL_0006:\
  \ call void [mscorlib]System.Console::WriteLine(string)\nIL_000b: nop IL_000c: call\
  \ string [mscorlib]System.Console::ReadLine()\nIL_0011: pop IL_0012: ret }\n```\n\
  \n注意 CIL 代码如何依赖于 `ldarg.0` 指令，在涉及构造函数实现时，它也是加载相关的。该值必须加载到栈上。但它不是自定义值；它是对当前对象的引用。此外，查看构造函数并观察它是如何调用基类构造函数的。\n\
  \n### 标签 (Labels)\n\n在之前的示例中，所有代码行都带有类似 `IL_xxxx` 的前缀。这些是代码标签。只要不被占用，它们可以取任何名称。当使用\
  \ `ildasm` 工具转储程序集时，代码标签会自动创建，并遵循特定的命名规范。这可能会导致不便；这就是为什么我们可以自定义它们。具有更描述性的标签将使我们的工作更轻松。让我们来看一个例子：\n\
  \n```il\n.method private hidebysig\nstatic void Main(string[] args) cil managed\n\
  {\n.entrypoint\n.maxstack 8\nNothing_1: nop\nLoad_String: ldstr \"Hello CILly!\"\
  \nPrintToConsole: call void [mscorlib]System.Console::WriteLine(string)\nNothing_2:\
  \ nop\nWaitFor_KeyPress: call string [mscorlib]System.Console::ReadLine()\nRemoveValueFromStack:\
  \ pop\nLeave_Function: ret\n}\n```\n\n标签不是强制性的。只有当我们编写依赖于某些循环结构的 CIL 代码时，并且必须使用它们来分配逻辑流，才需要它们。但在我们的示例中，我们可以完全移除标签，且不会发生任何变化。\n\
  \n\n\n请注意，分配给 `ver` 指令的值取决于你正在使用的 .NET 版本。要使用正确的版本，请导航到 GAC 并复制正确的值。接下来，我们必须修改 `Main()`\
  \ 的应用。该方法在我们 `.il` 文件中。我们应该使用以下代码移除现有实现：\n\n```il\n.method private hidebysig static\
  \ void Main(string[] args) cil managed\n{\n.entrypoint\n.maxstack 8\n// To do list:\
  \ Type some new CIL code!\n}\n```\n\n目标是强制将一个新的字符串推入栈，然后通过 `MessageBox.Show` 调用它。我们使用这种方法而不是\
  \ `Console.WriteLine`。记住，在输入外部类型的名称时，你必须使用完全限定名以及程序集名称。记住，在 CIL 中，所有方法都引用带有完全限定返回类型的元数据。现在，让我们回到\
  \ `Main` 方法并使用以下代码对其进行更新：\n\n```il\n.method private hidebysig static void Main(string[]\
  \ args) cil managed\n{\n.entrypoint\n.maxstack 8\n      ldstr \"I love CIL\"\ncall\
  \ valuetype [System.Windows.Forms]\nSystem.Windows.Forms.DialogResult\n[System.Windows.Forms]\n\
  System.Windows.Forms.MessageBox::Show(string) pop ret\n}\n```\n\n我们的 CIL 代码现在与此\
  \ C# 定义完美匹配：\n\n```csharp\nclass Program\n{\nstatic void Main(string[] args)\n{\n\
  System.Windows.Forms.MessageBox.Show(\"I love CIL\");\n}\n}\n```\n\n### 编译代码\n\n\
  一旦你保存了更新后的 `.il` 文件，你就可以使用 CIL 编译器 `ilasm.exe` 开始编译过程。该编译器有几个命令。我们将关注最重要的几个。如果你感兴趣想了解更多，请使用\
  \ `-?` 标记查看它们。如此，以下是基本选项：\n\n1. `/debug`:此命令行标记将添加调试信息。这包括变量、参数名和行号。\n2. `/dll`:为输出创建一个\
  \ `.dll` 文件。\n3. `/exe`: 与 `/dll` 类似，除非另有说明，否则具有默认设置。\n4. `/output`: 设置输出名称和扩展名。如果不使用此选项，文件名将与你的源代码文件名相同。\n\
  5. `/key`: 允许程序集使用强名称进行编译。\n\n现在我们已经有了更新的 `.il` 文件，可以使用以下命令进行编译：\n\n```bash\nilasm\
  \ /exe HelloApp.il /output=NewAssembly.exe\n```\n\n现在你可以启动新程序了，它将显示一个包含消息的消息框 own\
  \ 控制台。这是一个基础程序，但它演示了 CIL 的往返工程概念。记住，当你使用 CIL 而不是 C# 创建或编辑程序集时，你应该始终检查二进制映像编译是否转换为了正确的\
  \ .NET 映像。可以使用 `peverify.exe` 工具通过输入以下命令完成：\n\n```bash\npeverify NewAssembly.exe\n\
  ```\n\n此工具检查你程序集中的每一个操作码并寻找有效的 CIL。该工具关注语义，因此如果你在退出函数之前没有清理栈，它会在尝试运行代码时向你警告。\n\n\
  ### 动态程序集\n\n当你打算在 CIL 中创建一个复杂的应用程序时，你需要做好心理准备。一方面，CIL 具有很强的表达能力，允许你完全访问并控制 CTS\
  \ 允许的任何语言结构。另一方面，编写 CIL 是耗时且枯燥的，更不用出错概率很高。此时，你可能在想你应该记忆多少语法。没有标准答案，但你的大部分编程过程都不会涉及任何\
  \ CIL。理解 CIL 概念将使你能够探索一个全新的概念，即动态程序集。\n\n到目前为止，我们关注的是静态程序集，所以你可能好奇区别在哪里。记住，静态程序集只是硬盘上的\
  \ .NET 二进制文件。它们由 CLR 请求并从磁盘加载。每当你编译编写 C# 代码时，结果都是静态程序集。另一方面，动态程序集存在于内存中，有助于来自 `System.Reflection.Emit`\
  \ 命名空间的类型。该命名空间允许你构建带有定义、模块和运行时逻辑程序集。这种内存二进制文件可以保存到磁盘，从而另一个静态程序集。要创建动态程序集，你需要更深入理解操作码。\n\
  \n动态程序集需要高级编程。它们很少是常规编程目标的一部分，但可能非常有用。例如，在开发需要根据用户命令生成许多程序集的编程工具时，它们非常重要。当你想要加载静态程序集并动态向二进制文件添加新类型时，它们也有用。如此，让我们仔细观察\
  \ `System.Reflection.Emit` 命名空间。\n\n尽管开发动态程序集需要对操作码有更深入的理解，但属于 `System.Reflection.Emit`\
  \ 命名空间的类型隐藏了 CIL 的复杂性。例如，你可以尝试使用 `TypeBuilder` 类，而不是声明所有所需的指令和属性来定义类型。此外，你不需要使用\
  \ `Constructor Builder` 来定义构造函数。你也可以发射一个特殊的名称或 `ctor` 标记来代替。该命名空间下有多个成员，如果你想了解更多，请查阅文档。\n\
  \n通常情况下，属于此命名空间的类型允许你在构建动态程序集时以程序化的方式表示 CIL 代码。有很多这样的成员，但我们主要感兴趣的是 `ILGenerator`。该成员的作用是将\
  \ CIL 操作码引入另一个成员中。注意，你不能立即创建这种类型的对象，因为它不包含公共构造函数。要获取 `ILGenerator` 成员，你必须调用属于各种生成器关注类型的特定方法。这些类型是\
  \ `MethodBuilder` 和 `ConstructorBuilder`。让我们看看下面的代码：\n\n```csharp\n// 从 Constructor\
  \ Builder 中提取一个 ILGenerator。\n// 对象将被命名为 myConstructorBuilder。\nConstructorBuilder\
  \ myConstructorBuilder =\nnew ConstructorBuilder(/* ...insert arguments... */);\n\
  \nILGenerator myGen = myConstructorBuilder.GetILGenerator();\n```\n\n当 `ILGenerator`\
  \ 准备就绪后，无论你有多少方法都可以开始发射操作码。要了解更多关于属于 `ILGenerator` 的方法，请查看文档。我们将只关注通过反射操作的 `Emit`\
  \ 方法。\n\n### 发射动态程序集\n\n为了说明程序集如何在运行时定义，我们将设置一个单文件动态程序集。我们将将其命名为 `MyAssembly.dll`。模块内部有一个名为\
  \ `HelloWorld` 的类，它接受一个基础构造函数和一个自定义构造函数，我们将使用后者声明字符串类型私有变量的值。类支持一个名为 `SayHi` 的公共实例方法。该方法将消息打印到\
  \ I/O 流，并通过 `ReceiveMsg` 方法返回一个私有字符串。以下是示例：\n\n```csharp\n// 类在运行时使用 System.Reflection.Emit\
  \ 命名空间构建。\npublic class HelloWorld\n{\nprivate string myMessage;\n\nHelloWorld()\
  \ {}\n\nHelloWorld(string s) {myMessage = s;\n\npublic string ReceiveMsg()\n{return\
  \ myMessage;}\n\npublic void SayHi()\n{ \n    System.Console.WriteLine (\"The HelloWorld\
  \ class says Hi!\");\n}\n```\n\n现在，让我们来看一个涉及控制台应用程序的场景，我们称之为 `DynAsmBuilder`。我们将导入三个命名空间：`System.Reflection`、`System.Threading`\
  \ 和 `System.Reflection.Emit`。我们将声明一个名为 `CreateAsm` 的新静态方法，它属于 `Program` 类。该方法用于确定程序集的特征、实现新类型并将程序集保存到磁盘。此外，`CreateAsm`\
  \ 方法需要一个参数：`System.AppDomain` 类型。该参数用于访问程序集生成器。如此，让我们通过代码并分析每一步：\n\n\n\n\n```csharp\n\
  public static void CreateAsm(AppDomain curAppDomain)\n{\n    // 这里，我们声明程序集特征。\n\
  \    AssemblyName assemblyName = new AssemblyName();\n    assemblyName.Name = \"\
  MyAssembly\";\n    assemblyName.Version = new Version(\"1.0.0.0\");\n\n    // 在活跃\
  \ App 域内构建一个新的程序集。\n    AssemblyBuilder assembly = curAppDomain.DefineDynamicAssembly(assemblyName,\
  \ AssemblyBuilderAccess.Save);\n\n    // 记住我们正在创建一个单文件程序集。\n    // 模块名称将与程序集名称相同。\n\
  \    ModuleBuilder module = assembly.DefineDynamicModule(\"MyAssembly\", \"MyAssembly.dll\"\
  );\n\n    // 公名为 \"HelloWorld\" 的类。\n    TypeBuilder helloWorldClass = module.DefineType(\"\
  MyAssembly.HelloWorld\", TypeAttributes.Public);\n\n    // 声明私有 String 成员变量并命名为\
  \ \"theMessage\"。\n    FieldBuilder msgField = helloWorldClass.DefineField(\"theMessage\"\
  , Type.GetType(\"System.String\"), FieldAttributes.Private);\n\n    // 设置自定义构造函数。\n\
  \    Type[] constructorArgs = new Type[1];\n    constructorArgs[0] = typeof(string);\n\
  \    ConstructorBuilder constructor = helloWorldClass.DefineConstructor(MethodAttributes.Public,\
  \ CallingConventions.Standard, constructorArgs);\n    ILGenerator constructorIL\
  \ = constructor.GetILGenerator();\n    constructorIL.Emit(OpCodes.Ldarg_0);\n  \
  \  Type objectClass = typeof(object);\n    ConstructorInfo superConstructor = objectClass.GetConstructor(new\
  \ Type[0]);\n    constructorIL.Emit(OpCodes.Call, superConstructor);\n    constructorIL.Emit(OpCodes.Ldarg_0);\n\
  \    constructorIL.Emit(OpCodes.Ldarg_1);\n    constructorIL.Emit(OpCodes.Stfld,\
  \ msgField);\n    constructorIL.Emit(OpCodes.Ret);\n\n    // 构建默认构造函数。\n    helloWorldClass.DefineDefaultConstructor(MethodAttributes.Public);\n\
  \n    // 设置 ReceiveMsg() 方法。\n    MethodBuilder receiveMsgMethod = helloWorldClass.DefineMethod(\"\
  ReceiveMsg\", MethodAttributes.Public, typeof(string), null);\n    ILGenerator methodIL\
  \ = receiveMsgMethod.GetILGenerator();\n    methodIL.Emit(OpCodes.Ldarg_0);\n  \
  \  methodIL.Emit(OpCodes.Ldfld, msgField);\n    methodIL.Emit(OpCodes.Ret);\n\n\
  \    // 构建 SayHi 方法。\n    MethodBuilder sayHiMethod = helloWorldClass.DefineMethod(\"\
  SayHi\", MethodAttributes.Public, null, null);\n    methodIL = sayHiMethod.GetILGenerator();\n\
  \    methodIL.EmitWriteLine(\"HelloWorld class says hi!\");\n    methodIL.Emit(OpCodes.Ret);\n\
  \n    // 射类型，同时也\n    helloWorldClass.CreateType();\n}\n```\n\n进入 `CreateAsm(AppDomain\
  \ curAppDomain)`。\n\n在这里，我们声明了程序集特征。\n\n`AssemblyName assemblyName = new AssemblyName();`\n\
  `assemblyName.Name = \"MyAssembly\";`\n`assemblyName.Version = new Version(\"1.0.0.0\"\
  );`\n\n在活跃 App 域内构建新的程序集。\n\n`AssemblyBuilder assembly = curAppDomain.DefineDynamicAssembly(assemblyName,\
  \ AssemblyBuilderAccess.Save);`\n\n 记住我们正在创建一个单文件程序集。\n 模块名称将与程序集名称相同。\n`ModuleBuilder\
  \ module = assembly.DefineDynamicModule(\"MyAssembly\", \"MyAssembly.dll\");`\n\n\
  \ // 公名为 \"HelloWorld\" 的类。\n\n`TypeBuilder helloWorldClass = module.DefineType(\"\
  MyAssembly.HelloWorld\", TypeAttributes.Public);`\n\n 声明私有 String 成员变量并命名为 \"theMessage\"\
  。\n\n`FieldBuilder msgField = helloWorldClass.DefineField(\"theMessage\", Type.GetType(\"\
  System.String\"), FieldAttributes.Private);`\n\n 设置自定义构造函数。\n\n`Type[] constructorArgs\
  \ = new Type[1];`\n`constructorArgs[0] = typeof(string);`\n\n`ConstructorBuilder\
  \ constructor = helloWorldClass.DefineConstructor(MethodAttributes.Public, CallingConventions.Standard,\
  \ constructorArgs);`\n`ILGenerator constructorIL = constructor.GetILGenerator();`\n\
  `constructorIL.Emit(OpCodes.Ldarg_0);`\n`Type objectClass = typeof(object);`\n`ConstructorInfo\
  \ superConstructor = objectClass.GetConstructor(new Type[0]);`\n`constructorIL.Emit(OpCodes.Call,\
  \ superConstructor);`\n`constructorIL.Emit(OpCodes.Ldarg_0);`\n`constructorIL.Emit(OpCodes.Ldarg_1);`\n\
  `constructorIL.Emit(OpCodes.Stfld, msgField);`\n`constructorIL.Emit(OpCodes.Ret);`\n\
  \n 构建默认构造函数。\n\n`helloWorldClass.DefineDefaultConstructor(MethodAttributes.Public);`\n\
  \n 设置 `ReceiveMsg()` 方法。\n\n`MethodBuilder receiveMsgMethod = helloWorldClass.DefineMethod(\"\
  ReceiveMsg\", MethodAttributes.Public, typeof(string), null);`\n`ILGenerator methodIL\
  \ = receiveMsgMethod.GetILGenerator();`\n`methodIL.Emit(OpCodes.Ldarg_0);`\n`methodIL.Emit(OpCodes.Ldfld,\
  \ msgField);`\n`methodIL.Emit(OpCodes.Ret);`\n\n 构建 SayHi 方法。\n\n`MethodBuilder\
  \ sayHiMethod = helloWorldClass.DefineMethod(\"SayHi\", MethodAttributes.Public,\
  \ null, null);`\n`methodIL = sayHiMethod.GetILGenerator();`\n`methodIL.EmitWriteLine(\"\
  HelloWorld class says hi!\");`\n`methodIL.Emit(OpCodes.Ret);`\n\n 射类型，同时也\n\n`helloWorldClass.CreateType();`\n\
  \n\n\n\n\n3. 提供了一个支持各种主题的样式引擎。\n4. 使用矢量图形，从而允许开发者调整图形元素或屏幕的分辨率和大小，使所有内容与托管应用程序的系统匹配。\n\
  5. 完全支持 2D 和 3D 图形及动画。\n6. WPF 拥有一个排版 API，并完全支持集成如 `Windows Forms` 和 `ActiveX` 等旧\
  \ GUI 系统。\n\n既然你已经看到了使用 WPF 的用处，让我们来探索使用该 API 开发的程序类型。\n\n## WPF 程序集\n\nWPF 可以描述为集合在若干个\
  \ .NET 程序集中的类型。查看文档可以探索开发阶段必须引用的许多程序集；这些通常用于创建应用程序。Visual Studio 会自动处理引用。让我们几个几个程序集：\n\
  \n1. `PresentationCore`: 该程序集定义了一组构成图形界面层的命名空间。例如，`PresentationCore` 支持 `Ink API`、某些动画原始类型以及一组渲染类型。\n\
  2. `PresentationFramework`: 包含了大多数 WPF 控件，包括 `Application` 和 `Window` 类。包含交互交互图形的支持以及大量的数据绑定类型。\n\
  3. `SystemXaml`: 该程序集提供了在 XAML 文件上进行编程所需的命名空间。此库允许你开发各种支持工具，或在运行时对 XAML 拥有完全控制。\n\
  4. `WindowsBase`: 该程序集用于定义构成 WPF API 整个架构的类型。它包含了多个线程类型、安全类型和类型转换器。这些这些基础程序集构成了命名空间、数百个类、结构体、委托和枚举，共同组成了\
  \ WPF。让我们探索一下最常用的命名空间的用途：\n\n1. `System.Windows`: 被认为是 WPF 的基础命名空间。它包含了所有主类，包括 `Application`\
  \ 和 `Window`。这些类在每个项目中都是必须的。\n2. `System.Windows.Controls`: 该命名空间包含大多数控件，以及用于创建菜单和工具提示的类型。\n\
  3. `System.Windows.Data`: 该命名空间包含一组专门与数据绑定引擎协同工作的类型。\n4. `System.Windows.Documents`:\
  \ 该命名空间包含与文档 API 工作的类型。你需要此命名空间为你的应用程序添加 PDF 功能。它的实现是通过 XML 纸规范（XML Paper Specification）协议完成的。\n\
  5. `System.Windows.Ink`: 该命名空间提供对 Ink API 的支持。该 API 允许你记录来自控制器（如鼠标）的所有输入并相应做出响应。它最适用于以表格为中心的编程。\n\
  6. `System.Windows.Markup`: 该命名空间定义了处理 XAML 标记所需的类型。\n7. `System.Windows.Media`:\
  \ 核心命名空间，为许多关注媒体特性的命名空间提供根功能。这些命名空间内部包含了处理 3D 渲染、动画等内容的类型。\n8. `System.Windows.Shapes`:\
  \ 该命名空间定义了能够渲染响应鼠标输入的 2D 图形的类。\n\n我们先在此此停止，因为这些是最常用的命名空间。让我们开始探索 `Application` 和\
  \ `Window` 类。\n\n### Application 类\n\n`Application` 类是运行中的 WPF 程序的全局实例。该类有一个 `Run`\
  \ 方法来运行应用程序，以及一组如 `Startup` 和 `Exit` 等事件，包括其他处理浏览器应用程序的事件。查看 WPF 文档以更好地理解许多属性。同时，我们将探索核心属性：\n\
  \n1. `Current`: 这是一个静态属性，用于访问正在运行的 `Application` 对象。当窗口需要访问创建它的对象时，这个属性非常有用。\n2.\
  \ `MainWindow`: 此属性帮助我们获取或设置程序的主窗口。\n3. `Properties`: 此属性允许我们找到可以通过应用程序中的方法访问的数据。它包括窗口、对话框等。\n\
  4. `StartupUri`: 设置一个 URI 来指定程序运行时将打开哪个窗口。\n\n所有基于 WPF 的程序都需要定义一个扩展自 `Application`\
  \ 类的类。在其中，你将声明 `Main` 方法（启动点）。它将构建其子类的实例并管理 `Startup` 和 `Exit` 事件。让我们看下方的示例：\n\n\
  ```c\n// First，我们需要为 WPF 应用定义应用程序对象。\nclass MyApp : Application\n{\n    [STAThread]\
  \ static void Main(string[] args)\n    {\n      // 设置应用程序对象。\n      MyApp app =\
  \ new MyApp();\n\n      // Startup 和 Exit 事件。\n      app.Startup += (s, e) => {\
  \ /* Launch the app */ };\n      app.Exit += (s, e) => { /* Exit the app */ };\n\
  \    }\n}\n```\n\n在 `Startup` 声明中，所有传入的参数将被处理，应用程序将启动。相反，`Exit` 会退出应用程序。\n\n###\
  \ Window 类\n\n`Window` 类代表属于应用程序的任何类的窗口。它是 `PresentationFramework` 程序集的一部分。它包含了程序主窗口的所有对话框。注意，`Window`\
  \ 类包含了一组添加功能的类。查看文档以了解更多关于它们的信息。我们将讨论对初步理解 WPF 重要的类。\n\n`ContentControl` 类是 `Window`\
  \ 类的类。它是核心类之一，提供了派生类型，通过 `Content` 属性存储在控件表面区域内的一段视觉数据。内容模型允许我们自定义内容控件的视觉效果。例如，当你考虑到按钮控件的内容时，你想到的是一个字符串。\n\
  \n```xml\n<!-- 在起始元素内声明 Content 值 -->\n<Button Height=\"70\" Width=\"90\" Content=\"\
  OK\"/>\n```\n\n### 用于图形渲染的 WPF\n\n在这一节中，我们将讨论 WPF 的图形能力：渲染服务。WPF 提供了三种渲染图形信息的方法：形状（shapes）、绘制（drawings）和视觉（visuals）。一旦你理解了它们的优缺点，你对\
  \ WPF 的理解将会增加。你将体会到如何使用绘制和几何更灵活地渲染 2D 信息。此外，多个视觉层可以优化你项目的性能。\n\n\n\n\n\n你现在可能对创建复杂且图形密集型的程序并不感兴趣。尽管如此，这些过程背后的概念适用于各种服务。`WPF`\
  \ 依赖于一种被称为留存模式（retained-mode）的图形渲染。这意味着通过过程化代码来生成图形渲染。`WPF` 的作用是维护图形对象并确保它们得到适当的重绘和更新。因此，当图形信息被渲染时，即使当你将另一个窗口置于它上方或将其最小化时，它始终存在。作为对比，当微软的渲染\
  \ API 被限制在 `Windows Forms` 时，我们拥有的是即时模式（immediate mode）图形系统。程序员必须准备一个模型，以确保渲染的图形在应用程序运行期间得到良好的管理和定期更新。今天，`WPF`\
  \ 处理了这一切。一个渲染基本几何形状（如矩形）的 `Windows Forms` 程序需要一个 `Paint` 事件来创建一个绘制该形状的对象。必须包含架构设计以确保图像在最小化时保持完整。从即时模式图形到留存模式图形的转变是解放性的。程序员需要编写和更新的图形代码减少了。\n\
  \n话虽如此，`WPF` 的图形 API 与旧的渲染工具并没有区别。它们都支持特定类型的刷子（brush）、笔（pen）、命中测试技术、图形更改等。如果你熟悉\
  \ `Windows Forms` 渲染，那么学习 `WPF` 渲染将不会困难。\n\n## 渲染选项\n\n如前所述，`WPF` 具有适应性，提供了丰富的图形渲染选择。你的选择超出了\
  \ `XAML` 或过程化的 `C#` 代码。以下是 `WPF` 提供的三种方法：\n\n1. `Shapes`：`WPF` 提供的 `System.Windows.Shapes`\
  \ 命名空间定义了渲染 2D 几何对象（如矩形、多边形等）的类。这些是基本类型，但在过度使用时会消耗大量内存。\n2. `Drawings`：涉及 `System.Windows.Media.Drawing`\
  \ 命名空间的子类。你会发现如 `ImageDrawing` 和 `Geometry Drawing` 类的类用于渲染消耗系统资源的视觉数据，但也意味着功能较少。\n\
  3. `Visuals`：最快的图像渲染方法。`Visuals` 允许使用只能通过 `C#` 代码访问的视觉层，这意味着你将能够直接与 `WPF` 的图形系统交互。\n\
  \n所有这些方法执行的是相同的事情。区别在于细节。主要的区别因素是性能和内存使用。`WPF` 是一个密集型系统，对你的系统有很高要求。尽管如此，期望程序在一个窗口中渲染成千上万幅图像是合理的。这就是为什么选择形状、绘制或视觉效果会对你的应用程序性能产生影响。请注意，在大多数情况下，你不会只使用一种方法。开发者会结合这三者，为每种方法选择最合适的内容。开发者结合这三者是正常的。\n\
  \n接受的标准是在处理简单图形数据（如工具提示和鼠标输入）时使用 `Shapes` 命名空间。在处理用 `C#` 或 `XAML` 组合而成的矢量数据时，主要使用\
  \ `Drawings`。`Drawings` 也可以对鼠标事件和其他操作做出响应，但你必须自己编写该功能。\n\n`Visuals` 通常用于渲染大量的视觉数据，因为视觉层提供了最快、高效的渲染方法。例如，假设你正在制作一个显示数据图的应用程序。视觉层将优化地生成图点，而不会占用你的系统内存。\n\
  \n无论你使用哪种技术，你始终需要各种图形原语（如刷子和笔）以及变换对象。\n\n## 总结\n\n在本章中，我们向你介绍了 `Windows Presentation\
  \ Foundation`。虽然我们没有深入过细节，但你应该已经有足够的知识来独立上手。你探索了基本概念，例如让 `WPF` 运行起来的因素，以及在制定项目设计时的可用选项。现在你可以使用\
  \ `C#` 和 `WPF` 处理控制台应用程序以外的工作。\n\n# 第 7 章\n\n## ASP .NET\n\n在本章中，我们将学习 `ASP.MVC`，这是一个\
  \ Web 应用程序框架。该框架的出现由于需要，因为在线社区需要一个遵循 `HTTP` 且比之前的框架更容易测试的新框架。\n\n在第一部分，你将学习 `MVC`\
  \ 模式。\n\n### MVC 模式\n\n`MVC` 代表 `Model View Controller`（模型-视图控制器）。该模式最早出现在 70 年代。它是为\
  \ 1980 年推出的的面向对象的编程语言 `SmallTalk` 开发的。该模式再次出现是因为它现在可以在其他语言中实现，如 `Java`、`Ruby` 以及像\
  \ `Angular` 各种框架。在 2007 年左右，该模式以 `ASP.NET MVC` 的形式为 `.NET` 开发者实现。\n\n首先，我们有 `model`（模型）。它代表应用程序的数据，由一组基础\
  \ `CLR` 对象表示，这些对象与数据访问库中的对象是相同的。视图模型（view view models）由一个或多个为将利用它们的视图设计的模型组成。为了更好地理解它们，请将这些模型想象成数据库表。从学术角度来看，模型是纯洁的，因为它们不持有验证逻辑或类似的规则。从实践角度来看，模型是否包含此类逻辑取决于所使用的框架、编程语言以及项目需求。例如，`EF\
  \ Core` 包含了几个数据注解，作为数据库表建模的方法，并将验证方法包含在 `Core MVC` 内部。通常，数据验证和注释被放置在最合理的地方，以减少潜在的重复代码。\n\
  \n接下来是 `view`（视图），它代表应用程序的用户界面。视图将接受指令并将这些指令的结果显示给用户。注意，视图必须尽可能轻量，以便命令能够流畅执行。`controller`（控制器）必须处理所有繁重的工作。`controller`\
  \ 是操作背后的智能。它有两个主要目的：第一个是接受用户命令（称为 `actions`）并将它们推送到存储库（例如）；第二个是将任何更改传输给视图。记住，就像模型和视图一样，控制器也尽可能轻量。\n\
  \n这听起来并不复杂。但为什么要使用 `MVC` 而不是其他框架呢？\n\n`ASP.NET MVC` 发布于 2007 年，但 `ASP.NET Web Forms`\
  \ 在此之前已经增长六年。许多网站是用 `Web Forms` 创建的。这种趋势没有任何缓下的迹象。问题是：为什么微软要开发一个新的 Web 框架？在我们回答之前，请考虑以下因素。\n\
  \n当 `Web Forms` 发布时，Web 开发还没有像今天这样复杂。我们熟悉的无状态范式在当时还没有被很好地理解，特别是对于那些使用 `Visual Basic`\
  \ 开发计算机应用程序的人来说。这类开发者之间存在差距，因此必须进行填补。构建网站需要变得更容易，而 `Web Forms` 容纳了仅存在桌面开发的概念和技术。程序员和开发者对此表示庆祝，许多人直接转向了\
  \ Web 开发。因此，围绕 `Web Forms` 和其他 `.NET` 控件形成了一个新的生态系统。每个人都在尝试无状态 Web 编程、`HTTP` 协议和\
  \ `JavaScript`。\n\n\n\n\n这些开发者有了新的需求。他们不再需要大量的工具和实用程序来填补之前的空白，但他们需要对渲染视图有更多控制。随着每次\
  \ Web Forms 的更新，新功能被不断添加。每一个功能都显著改进了应用程序，并导致了更复杂的网站。但问题也出现了。例如，`viewstate` 在渲染页面中的位置对性能产生了不利影响。最终，这导致\
  \ `.NET`、`Ruby` 和 `Ruby on Rails` 中出现了更多问题。当时，微软无法简单地删除这项技术，因为很多内容都依赖它。必须找到新的解决方案，仅仅通过不断更新\
  \ Web Forms 来修复这些问题是不够的。微软必须弄清楚如何在让当前 Web 开发者的同时，为他们提供一个新的平台。\n\n这就是 ASP.NET MVC\
  \ 的诞生。这两种模型之间有很多区别。例如，后置代码文件（code-behind files）、`viewstate` 和控件支持被移除。此外，测试、依赖注入、控制分离和清洁代码技术得到了更好的支持。此外还开发了\
  \ `Razor` 视图引擎。几乎一切都得到了改进，但主要的缺点是 `ASP.NET MVC` 对 `HTML`、`JavaScript` 和 `HTTP` 函数具有一定的熟悉度。\n\
  \nMVC 框架配置被约定优配置所取代。换句话说，必须遵循命名约定和通用架构等约定，以便 MVC 项目减少所需的配置。\n\n## MVC 应用程序模板\n\n\
  现在我们已经了解了一些历史和理论，让我们来看一些代码。Visual Studio 自带了一个完整的项目模板，旨在帮助你构建 MVC 应用程序。导航到 `File`\
  \ 标签，选择 `New`，并点击项目。在左侧边栏的 `Visual C#` 下有 `Web` 选项。选择 `ASP.NET Web Application`\
  \ 并命名。当弹出下一个窗口时，遵循 `MVC` 模板。有一个预选的复选框，“添加文件夹和核心引用”（add folders and core references\
  \ for）。在此窗口中，如果你想创建一个与 `MVC` 和 `Web Forms` 同时工作的混合程序，可以勾选 `Web Forms`。为了本节的目的，请仅选择\
  \ `MVC`。另一个名为“添加单元测试”（add unit tests）的选项。如果你勾选了它，将创建一个设计用于单元测试的核心框架的新项目。我们不会探索单元测试，因为它对于本书来说太大了。尽管如此，在完成设置之前，请查看身份验证机制。\n\
  \n选择“更改身份验证”（change authentication）选项，将出现一个对话框。保持默认值（“身份验证设置为无身份验证”），并在提示时点击“确定”。完成后，将创建一组文件和文件夹。\n\
  \n请注意，从任何版本的 `MVC` 模板中修改 `Project_Readme.html` 文件都是一个项目概述功能。这意味着当项目最初加载时，将提供一组指向文档的链接，建立起多个服务之间的连接。许多\
  \ `MVC` 文件都有它们所属特定位置。尽管如此，仍然有一些文件可以存在根文件夹之外。让我们检查一些：\n\n1. `Global.asax.cs`：此文件允许我们连接到框架的工作流。默认模板依赖于一个名为\
  \ `application start` 的事件处理程序。然而，还有许多其他你可以连接的程序。\n2. `Models`：这是一个文件夹，是所有模型类的家园。当你编写复杂的应用程序时，数据访问库应该包含所有的模型。此文件夹通常用于持有视图模型，例如由\
  \ `Visual Studio` 为框架身份创建的类。\n3. `Controller`：包含你应用程序的所有控制器文件。\n4. `Views`：你所有的\
  \ `MVC` 视图将放在这里。该文件夹的架构有一个特定的约定。所有控制器都需要 `Views` 文件夹内部有它们自己的文件夹。它们会在与控制器标签相同的文件夹内搜索它们的视图。例如，`Views/Home`\
  \ 文件夹将包含用于 `HomeController` 控制器的视图。你会在主文件夹根目录下找到一个名为 `_ViewStart.cshtml` 的配置文件。该文件属于其文件夹结构内部的视图，并决定了页面类型。此外，配置文件将在视图渲染之前执行。\n\
  5. `Shared`：此文件夹属于视图文件夹。任何视图都可以访问它。它只持有两个文件：`Layout.cshtml` 文件和 `Error.cshtml` 文件。第一个表示由视图启动配置确定的布局。第二个包含项目的错误模板。\n\
  6. `ASP.NET`：有很多此类文件夹，例如 `App Data` 文件夹（`MVC` 模板的一部分）。该文件夹包含网站所需的所有基于文件的信息。还有其他生成的文件夹用于存储代码和其他资源。你可以通过右键点击项目并选择\
  \ `Add` 菜单中的 `ASP.NET Web Folder` 选项来添加新文件夹。这些文件夹不会显示在网站上。\n7. `App_Start`：旧版本的\
  \ `MVC` 框架将配置代码放在一个全局类中。补丁接补丁导致配置变得过于复杂，无法在一个类中处理。因此，开发被分为多个类。`App_Start` 文件夹包含所有这些类。里面的代码会自动编译。\n\
  \n现在让我们把注意力转向 `BundleConfig` 类。该类容纳了 `CSS` 和 `JavaScript` 文件的包（bundles）和最小化（minification）设置。通常，这些文件为了生产目的会被打包和压缩。这些过程在调试\
  \ 模式下是不可见的。你可以通过调整该类或 `web.config` 文件来控制所有这些操作。假设你想关闭打包和压缩。在这种情况下，你必须在配置文件的 web\
  \ 部分中输入以下行：\n\n```xml\n<system.web>\n<compilation debug=\"true\" targetFramework=\"\
  4.7\" />\n</system.web>\n```\n\n如果你不熟悉，打包（bundling）是将几个文件合并为一个。打包可以提高网站速度，因为 Web\
  \ 浏览器一次从服务器下载的文件数量是有限的。在你的网站上有许多小文件会降低性能。解决方案是将文件打包在一起以减少数量。另一种解决方案是将它们分散在多个内容分发网络中。无论你选择哪种方法，你都需要决定一个对你最好的方案。构建方法的缺点是产生一个巨大的文件，可能会减慢用户体验。因此，人们需要警惕。\n\
  \n另一边是最小化（minification）过程。这个过程可以加快网页的加载时间。`JavaScript` 和 `CSS` 文件仅包含变量和函数以提高可读性。然而，大小很重要，特别是当网站经常通过移动设备访问时。最小化解决了这个问题。它将长名称替换为短名称，删除额外的空格等。更改格式并让一切变短意味着传输的位更少，从而转化为更短的加载时间。因此，所有值得的框架都带有这些文件的两个版本：一个用于生产，另一个用于开发。\n\
  \n### 总结\n\n在本章中，我们引入了 `ASP.NET MVC` 框架，它已成为 `C#` Web Web 应用程序开发工作流的主流。它包含了一组库，为\
  \ `C#` 增加了一层抽象。`MVC` 模式将项目分为三个部分，使其更加高效。此外，我们还查看了该模式本身，以及为什么它对于逻辑应用与图形组件之间分离的用户界面是很有用的。拥有内部数据表示允许更高效地向用户展示和接受信息，使得复杂程序的开发成为可能。\n\
  \n# 第 8 章：\n\n\n\n\n## NET Core\n\n微软在 2016 年发布了一个名为 `.NET Core` 的新平台。该平台是跨平台的，可以在三大最大的操作系统：Windows、Linux\
  \ 和 macOS 上运行。它基于 `.NET` 和 `C#`，而你现在对它们已经非常熟悉了。该平台包含了 `.NET Core` 运行时、`ASP.NET Core`\
  \ 和 `Entity Framework Core`。在编写本文时（2020 年 1 月），`.NET Core` 的第五版本已经发布，扩展了跨平台部署功能并带来了许多其他值得探索的变更。\n\
  \n与其他技术不同，`.NET Core` 是完全开源的。你可以在这里检查代码并进行进行修改以查看会发生什么。你还可以根据自己对 `C#` 和 `.NET` 的知识为社区和开发团队做出贡献。这对于普通用户是有优势的，因为庞大的贡献者社区意味着更快的改进速度。此外，文档非常详尽，你可以从中学习很多知识。你可以在这里查看：[`docs.microsoft.com/en-us/`](https://docs.microsoft.com/en-us/)。\n\
  \n`.NET Core` 的理念诞生于开发者要求 `ASP.NET` 平台能够在其他平台运行，而不仅仅是其他 Windows 系统。这导致了一个名为 `Project\
  \ K` 的项目，目的是将 `.NET` 功能提供给其他平台。大部分工作集中在 `ASP.NET` 上，以便将其扩展到其他系统，因此任何对 `System.Web`\
  \ 的依赖都必须移除。正如你可以想象的，移除这样的组件并不会没有后果的。这意味着他们几乎必须从头开始编写框架，并重新决定是否添加许多必需的组件。因此，决定需要一个可以被所有基于网络的应用程序使用的框架。这导致了\
  \ `MVC` 平台和 `Web API` 的合并。引入 `Entity Framework` 是因为平台需要一个新的数据访问层。这个平台被命名为 `.NET\
  \ Core`。\n\n这让人不禁思考其他 `.NET` 框架会发生什么。对它们的支持会结束吗？你必须重写你的应用程序以被 `Core` 支持吗？答案是否定的。`C#`\
  \ 和 `.NET` 平台正在不断开发，尽管最近没有非常令人兴奋的进展。但所有这些技术都非常成熟，看起来短期内它们不会被取代。看看 `WinForms` 和 `Web\
  \ Forms`；即使很少关于它们的讨论，它们仍被许多产品使用。\n\n### NET Core 的目的\n\n`.NET Core` 不仅仅是为了扩展 `.NET`\
  \ 功能。请记住 `.NET` 自 2002 年以来一直存在。从那时起技术发生了巨大变化。开发者变得更有经验，计算机变得更强大，用户数量也增加了。这些都是自 2002\
  \ 年以来发生的变化。尽管如此，以下是 `.NET Core` 的目标和功能列表：\n\n1. 跨平台支持：在三个主流操作系统及其版本上运行核心功能。现在已增加了对\
  \ `Android`、`iOS` 和 `Xamarin` 的支持。\n2. 性能：性能仍然 `.NET Core` 最重要的目标之一。频繁的发布确保了框架保持不断改进。\n\
  3. 可移植类库：Core 现在包含了 `.NET Standard`。这是一个在 `.NET` 运行时中实现某些统一行为的规范。\n4. 部署：Core 应用程序是可移植的。它们也可以作为独立产品部署。换句话说，它们可以带有框架或\
  \ Core 安装程序。\n5. 命令行支持：该平台支持完整的命令行。\n\n由于 `Visual Studio` 现在可以在 Mac 上使用，因此可以在任何地方开发\
  \ `.NET Core` 应用程序。不需要虚拟化。你还可以使用 Core 开发的跨平台实用工具在任何系统上工作。同样吸引人的是广泛的部署选择，不再依赖于 Windows。例如，Linux\
  \ 服务器是标准选择，因为它们的运行和维护成本更低，尤其是在如今的云环境中。因此，直接将应用程序部署到云端的选项削减了成本。这可能解释了新初创公司的激增，因为它已变得具有成本效益。现在，小型开发者团队可以构建自己的产品了。\n\
  \nCore 还提供了容器化（Containerization），这是 Core 令人印象深刻的特性之一。Core 应用程序接收容器支持。这意味着像 `Docker`\
  \ 这样的容器可以简化应用程序从一个环境到另一个环境的发布。例如，Core 可以轻松将应用程序从开发环境移动到测试环境。项目文件被封装在一个容器中，因此被称为容器化。容器可以直接复制，无需安装。由于\
  \ Windows 支持 `Docker`，现在事情变得简单得多了。这意味着你将能够在容器中开发应用并在部署时移动容器，这意味着你不需要进行安装——不再有复杂的部署，也不再有反复的安装。\n\
  \n使用 `ASP.NET Core` 开发的大多数应用程序都能产生高基准测试分。如你所知，性能对开发者来说是最重要的事情之一。原始的 `.NET` 框架已经很老了，开发者已经尽可能地利用了它。这是他们编写\
  \ Core 的原因之一。重新开始让他们能够从一开始就进行优化。换句话说，性能变成了核心驱动力。\n\n### 组件\n\n以下是 `.NET Core` 的基本结构：\n\
  1. Core 运行时（Runtime）。\n2. 框架库（Framework libraries）。\n3. SDK 工具和 `dotnet` 应用程序主机。\n\
  4. 语言编译。\n\n运行时（称为 `CoreCLR`）是 `.NET Core` 的根库。它包含了垃圾回收器、基础 `.NET` 类型、`JIT` 编译器和许多库。它是连接所有这些库与操作系统的桥梁。只有类依赖于操作系统。类本身以独立的\
  \ `NuGet` 包的形式提供。运行时尝试减少代码量，将某些实现留给类。这些共同构成了一个可以快速更改和部署的灵活代码库。然而，`CoreCLR` 本身并不做什么。`CoreCLR`\
  \ 还提供了 `ILDASM` 和 `ILASM` 等工具。\n\n框架库（称为 `CoreFX`）是一组包含文件系统、集合、控制台、XML 等类的基础库。这些库构建了\
  \ `CoreCLR` 并为其他框架提供了材料。然而，除了库中包含的许多 `CoreCLR` 元素外，这些库专注于运行时。你可以得出结论：`CoreCLR` 和\
  \ `CoreFX` 构建了 .NET Core。\n\n我们还有 SDK 工具和 `dotnet` 主机（SDK 的一部分）。命令行界面集成在工具包中，因为创建\
  \ Core 类库和应用程序需要它。`dotnet`主机是操作 CLI 命令的引擎。主机的作用是启动命令和 Core 应用程序。你可以在任何命令行输入以下内容来检查你的：\n\
  \n```\ndotnet --version\n```\n\n该命令启动 `dotnet` 主机并显示已安装的 Core SDK 版本。CLI 有许多实用的命令。确保在微软文档中查看它们。\n\
  \n在 CLI 命令旁边的是提供许多其他命令行选项的框架。例如，`Entity framework` 增加了用于更新或迁移数据库的指令。\n\n\n\n\n记住，不要将\
  \ `.NET Core` 与完整的 `.NET` 框架混淆，因为它们之间存在许多区别特征，尽管它们有许多相同的 API 并且都依赖 `C#`。以下是其中一些因素：\n\
  \n1. `Core` 为每个系统提供了额外的平台支持。\n2. 尽管 `Core` 由 `Microsoft` 支持和维护，但它是开源的。\n3. 引入的应用模型较少。\n\
  4. `Core` 提供的 API 较少。\n\n我们已经讨论了前两个区别。值得注意的是，`Core` 并不支持完整框架中的每一个应用模型。对于基于 Windows\
  \ 技术创建的模型，这种说法甚至更为真实。此外，`Core` 应用可以被描述为控制台应用程序或类库。\n\n`Core` 的 API 较少是因为完整的 Framework\
  \ 极其庞大。因此，尝试更改所有的 API 是不现实的。`Core` 开发者遵循敏捷设计原则，因此他们的目标是提供精简的产品作为版本一，满足最小需求。虽然听起来很糟糕，但这并不意味着开发者很懒惰。随着每次版本的迭代，支持的\
  \ API 数量都会增加。例如，2.0 版本又引入了另外 32,000 个 API。\n\n尽管如此，`.NET Core` 是一项正在大力开发的新技术。尽管，它正迅速证明自己是不可或缺的。\n\
  \n## 总结\n\n在本章中，我们探索了 `.NET Core` 的结构和目标。我们学习了 `Core` 与完整 `.NET` 框架之间重要的区别特征。随着你的练习，你会发现创建\
  \ `Core` 应用与创建通用的 `.NET Framework` 应用没有太大区别。你只是框架和 API 的数量较少。一切仍然是 `C#` 编程。`Core`\
  \ 的优势在于它的开源性质，这意味着它从全球数千名开发者那里获益。这意味着 Bug 被修复，而且工具和新功能以越来越快的速度被实现。这看起来可能是一个缺点，因为开发者可能难以跟上，但这是积极的，因为它让你的工作变得更轻松。\n\
  \n# 结论\n\n多么一段旅程！你已经从初学者 `C#` 编程指南的起点开始，现在终于完成了高级课程。祝喜你。你已经走了很远的路。许多人在教育过程中并没有走到这一步。我们承认这个框架是令人敬畏的。这就是为什么这些指南的设计方式是为了辅助你的学习。\n\
  \n我们的目的是为你提供所需的基础工具，以开启成为高级 `C#` 程序员的旅程，使用如 `ASP .NET MVC`、`.NET Core` 等工具。你已经到了一个仅仅通过书籍是不够的阶段；你必须深入文档并进行学习。这不是你独自承担的旅程。在线上有许多共同目标的社区。与他们一起学习吧。所以，去外面吧，为项目贡献力量，永远停止学习。\n\
