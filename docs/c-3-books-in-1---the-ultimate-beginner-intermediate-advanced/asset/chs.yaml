  \           get;\n            set;\n        }\n        // Read write property\n\
  \        string Try\n        {\n            get;\n            set;\n        }\n\
  \        // Read only property\n        int PlayerID\n        {\n            get;\n\
  \        }\n    }\n    public class Player : Score\n    {\n        public int PlayerID;\n\
  \        public string PlayertName;\n        public int score // read-write instance\
  \ property\n        {\n            get\n            {\n                return marks;\n\
