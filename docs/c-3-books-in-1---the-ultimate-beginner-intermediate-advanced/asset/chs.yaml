  \ : Observer {\n    //在此处输入任何关键字段；\n    // 输入：（可选）\n    // 输出：无\n    // 效果：响应主体的更新数据\n\
  \    void Observer.update() {\n        //在此处对观察者的关键字段进行任何更改\n    }\n}\n```\n\n下面是主体类/接口对。\n\
  \n```csharp\n/*\n// 所有主体类实现 Subject 抽象\n// 它可以：\n// 通知观察者\n// 在其更新列表中添加/删除观察者\n\
  // 主体类还需要一个观察者列表来更新\n// (添加在 Subject 类上)\n*/\ninterface Subject {\n```\n\n\n\n\n\
  ```java\n    public void notifyObservers();\n\n    public void addObs(Observer o);\n\
  \n    public void deleteObs(Observer o);\n\n    //在此处输入任何其他方法\n}\n```\n\n```java\n\
  /*\n// Subject 类包含：\n// - 一个需要通知的 Observer 列表\n// - 一个可用的 notifyObservers() 版本\n\
  // - 任意任意额外字段和方法\n// Subject 类还需要一个 Observer 列表用于更新\n// （已添加到 Subject 类中）\n*/\n\
  ```\n\n```java\nclass SubjectClass : Subject {\n    // 在此处输入任何关键字段；   \n    private\
  \ List<Observer> obs = new List<Observer>();\n    // 输入：（可选）\n    // 输出：无\n    //\
  \ 效果：发生任何变化时更新列表中的所有观察者\n    public void notifyObservers(){\n        foreach (var\
  \ o in obs) {\n            o.update();\n        }\n    }\n    // 添加/删除方法：\n    //\
  \ 输入：-一个 Observer\n    // 输出：无\n    // 效果：响应主题更新数据    \n    public void addObs(Observer\
  \ o) {\n        obs.Add(o);\n        }\n    public void deleteObs(Observer o) {\n\
  \        obs.Remove(o);\n        }\n    }\n```\n\n现在，我们详细介绍如何实现观察者模式。\n\n### 实现观察者模式\n\
  \n使用你选择的 IDE 来实现代码。你可以使用在线的 IDE，如 [codechef.com](http://codechef.com)、[rextester.com](http://rextester.com)、[ideone.com](http://ideone.com)\
  \ 或 [codpad.org](http://codpad.org)。\n\n我们将使用一个你在现实世界中可能会遇到的示例。在这个示例中，你将扮演黑客专家。\n\
  \n#### 追捕\n\n想象你被 FBI 招募去抓一个恐怖组织。你可以轻松地追踪该组织，但现场的几十名特工需要实时信息。这意味着你必须更改他们设备上的软件。\n\
  \n你需要创建一个原型，当恐怖分子靠近时警报这些特工。\n\n### 第一步：识别观察者（Observers）和主题（Subjects）\n\n在这种语境下，谁是你的观察者，谁是主题？\n\
  \n恐怖分子是主题。你需要跟踪他们的位置。这就是你的代码将拥有的信息。它只有几行代码：\n\n```java\n// 单个恐怖分子拥有：\n// - 一个位置（字符串类型）\n\
  // - 一个 Observer 对象列表\nclass Terrorist{\npublic String location;\n}\n```\n\nFBI\
  \ 的设备是观察者。我们需要修改设备模块（Module），使其在出现关键进展时发送推送通知。设备模块如下：\n\n```java\n// 一个设备模块拥有：\n\
  // - 一个警报状态（布尔值）\n// - 通知更新（字符串形式）\n// - 一个位置（字符串类型）\n// 它可以：\n// - 推送警报\n// - 更新警报和通知\n\
  class Module{\n    public String location;\n    public boolean alert;\n    public\
  \ String notifications;\n//  效果：如果 alert 为 true，则打印警报通知\n    void sendAlerts(){\n\
  \        if (alert) {\n            Console.WriteLine(\"ALERT: \"\n             \
  \                         + notifications\n                                    \
  \  + \"Agents in \"\n                                      + this.location);\n \
  \       }\n    }\n}\n```\n\n#### 第二步：设置观察者和主题的抽象\n\n在 C# 中，我们两者的抽象将是接口（interfaces）。\n\
  \n它们看起来如下所示：\n\n```java\n/*\n// 所有观察类都实现 Observer 抽象\n// 它可以：\n// - 根据主题更新对象数据\n\
  // 观察类可能需要一个 Subject 列表来访问\n// （已添加到 Observer 类中）\n*/\ninterface Observer {    \
  \     \n    void update();\n}\n```\n\n```java\n/*\n// 所有主题类都实现 Subject 抽象\n// 它可以：\n\
  // - 通知观察者\n// - 在更新列表中添加/删除观察者\n// Subject 类还需要一个 Observer 列表用于更新\n// （已添加到 Subject\
  \ 类中）\n*/\ninterface Subject {\n    void notifyObservers();\n    void addObs(Observer\
  \ o);\n    void deleteObs(Observer o);\n}\n```\n\n#### 第三步：修改我们的主题类以实现功能\n\n告诉我们恐怖分子所在位置的对象就是主题类。因此，它将实现\
  \ Subject 接口。这意味着你需要添加并包含 Subject 接口中指定的方法。这还需要包含一个需要通知的观察者对象列表。为了防止黑客，此字段应保持私有（private）。\n\
  \n```java\n// 单个恐怖分子拥有：\n// - 一个位置（字符串类型）\n// - 一个 Observer 对象列表\n// 同时也实现了 Subject\
  \ 接口\n// （将需要实现其方法）\nclass Terrorist : Subject{\npublic String location;\nprivate\
  \ List<Observer> obs = new List<Observer>();\n// 新：来自 Subject 接口\npublic void notifyObservers()\
  \ {};\npublic void addObs(Observer o) {};\npublic void deleteObs(Observer o) {};\n\
  }\n```\n\n对于 `notifyObservers` 方法，我们需要遍历观察者列表并更新它们。因此，该方法应该修改为：\n\n```java\n// 新：来自\
  \ Subject 接口\npublic void notifyObservers() {\nforeach (var o in obs) {\no.update();\n\
  }\n}\n```\n\n我们不需要实现 `addObs()` 和 `deleteObs()` 方法，它们将根据需要添加和删除观察者。\n\n```java\n\
  public void addObs(Observer o) {\n        obs.Add(o);\n    };\npublic void deleteObs(Observer\
  \ o) {\n        obs.Remove(o);\n        }\n```\n\n完成所有更改后，`Terrorist` 类看起来如下：\n\n\
  ```java\nclass Terrorist implements{\nString location;\nprivate List<Observer> obs\
  \ = new ArrayList<Observer>();\n// 新：来自 Subject 接口\npublic void notifyObservers()\
  \ {\nforeach (var o in obs) {\no.update();\n}\n};\n\npublic void addObs(Observer\
  \ o) {\n obs.add(o);\n    };\n\npublic void deleteObs(Observer o) {\n      obs.remove(o);\n\
  \  };\n}\n```\n\n#### 第四步：修改我们的观察者类以实现功能\n\n我们的 `Module` 类将作为观察者，因此它将包含该方法。\n\n\
  ```java\n// 设备模块拥有：\n// - 一个警报状态（布尔值）\n// - 通知更新（字符串形式）\n// - 一个位置（字符串类型）\n// 它可以：\n\
  // - 推送警报\n// - 更新警报和通知\n// 也实现了 Observer 接口\n// （将需要实现其方法）\nclass Module : Observer{\n\
  \  public String location;\n    public boolean alert;\n    public String notifications;\n\
  \    public void update();\n  // 效果：如果 alert 为 true，则打印警报通知\n    void sendAlerts(){\n\
  \        if (alert) {\n            Console.WriteLine(\"ALERT: \"\n             \
  \                         + notifications\n                                    \
  \  + \"Agents in \"\n                                      + this.location);\n \
  \       }\n    }\n}\n```\n\n在添加 `update()` 方法之前，值得思考模块将如何工作。\n\n### 第五步：修改观察者类根据主题进行更新\n\
  \n当恐怖分子靠近时，`Module` 类必须发送更新和警报。\n\n恐怖子的本地字段是字符串，`Module` 也是。\n\n当 `Module` 的位置与恐怖分子匹配时，将发送警报，但在接收来自\
  \ `Terrorist` 类的数据之前，`update` 方法需要来自观察者的输入。\n\n// 输入：一个恐怖分子对象\n// 输出：无\n// 效果：如果\
  \ Terrorist 和此模块的位置相同，\n// 将 alert 设置为 true 并更新通知。\n// 之后发送警报\npublic void update(Terrorist\
  \ t) { };\n\n你需要对任何此此的代码进行相应的更新。`Observer` 接口需要修改以包含如下输入：\n\n```java\ninterface\
  \ Observer {         \n    void update(Terrorist t);\n}\n```\n\n`Terrorist` 类的通知方法也需要修改输入类型。它需要能够通知其类中的观察者。因此，类本身将是输入。\n\
  \n```java\nclass Terrorist : Subject{\n...\npublic void notifyObservers() {\nforeach\
  \ (var o in obs) {\no.update(this);\n}\n};\n}\n```\n\n#### 第五步：实现 update()\n\n下一步是让\
  \ `update()` 方法工作。我们将把代码放在 `Module` 类的 `update()` 方法中。\n\n// 输入：一个恐怖分子对象\n// 输出：无\n\
  \n\n\n\n\n```java\n    // EFFECT: 如果恐怖分子和此模块的地点相同，\n    // 将 Alert 设置为 true 并更新通知。\n\
  \    // 之后，发送报警\n    public void update(Terrorist t) {\n        if (this.location\
  \ == t.location) {\n            this.alert = true;\n            this.notifications\
  \ = \"Terrorist Nearby \";\n        }\n        else {\n            this.alert =\
  \ false;\n            this.notifications = \"\";\n        }\n        sendAlerts();\n\
  \    };\n```\n\n# 运行代码\n\n我们将在两种场景下运行代码。在这两种情况下，观察者类都根据其从主题类获得的信息发出警报。\n\n在这种场景下，观察者的数量多于主题。\n\
  \n（将以下代码复制并粘贴到你的 `Main()` 方法中）\n\n```java\n// Part 1: 创建所有数据对象\n    Terrorist t\
  \ = new Terrorist();\n    Module m1 = new Module();\n    Module m2 = new Module();\n\
  \    Module m3 = new Module();\n    Module m4 = new Module();\n\n    // Part 2:\
  \ 将所有观察者添加到主题列表\n    t.addObs(m1);\n    t.addObs(m2);\n    t.addObs(m3);\n    t.addObs(m4);\n\
  \n    // 创建所有地点\n    String[] locs = new String[10];\n    locs[0] = \"Los Angeles\"\
  ;\n    locs[1] = \"Chicago\";\n    locs[2] = \"New York\";\n    locs[3] = \"Seattle\"\
  ;\n    locs[4] = \"Cleveland\";\n    locs[5] = \"Boston\";\n    locs[6] = \"San\
  \ Francisco\";\n    locs[7] = \"Miami\";\n    locs[8] = \"St. Louis\";\n    locs[9]\
  \ = \"Dallas\"; \n\n    // Part 3: 设置观察者到它们的地点\n    m1.location = locs[1];\n   \
  \ m2.location = locs[4];\n    m3.location = locs[5];\n    m4.location = locs[9];\n\
  \n    // 当恐怖分子在全美移动时，\n    // 它将通知所有设备模块其位置。\n    // 当恐怖分子靠近时，模块将触发。\n    for(int\
  \ i = 0; i < 10; i++) {\n        t.location = locs[i];\n        t.notifyObservers();\n\
  \    }\n```\n\n当代码运行时，你将在控制台中得到以下内容：\n\nALERT: Terrorist Nearby Agents in Chicago\n\
  ALERT: Terrorist Nearby Agents in Cleveland\nALERT: Terrorist Nearby Agents in Boston\n\
  ALERT: Terrorist Nearby Agents in Dallas\n\n在这些场景中，主题的数量多于观察者。\n\n（将以下代码复制并粘贴到你的\
  \ `Main()` 方法中）\n\n```java\n// Part 1: 创建所有数据对象\n    Terrorist t1 = new Terrorist();\n\
  \    Terrorist t2 = new Terrorist();\n    Terrorist t3 = new Terrorist();\n    Terrorist\
  \ t4 = new Terrorist();\n    Terrorist t5 = new Terrorist();    \n    Module m =\
  \ new Module();\n\n    // Part 2: 将观察者添加到主题列表\n    t1.addObs(m);\n    t2.addObs(m);\n\
  \    t3.addObs(m);\n    t4.addObs(m);\n    t5.addObs(m);\n\n    // 创建所有地点\n    String[]\
  \ locs = new String[10];\n    locs[0] = \"Los Angeles\";\n    locs[1] = \"Chicago\"\
  ;\n    locs[2] = \"New York\";\n    locs[3] = \"Seattle\";\n    locs[4] = \"Cleveland\"\
  ;\n    locs[5] = \"Boston\";\n    locs[6] = \"San Francisco\";\n    locs[7] = \"\
  Miami\";\n    locs[8] = \"St. Louis\";\n    locs[9] = \"Dallas\";\n\n    // Part\
  \ 3: 设置观察者到它们的地点\n    t1.location = locs[1];\n    t2.location = locs[4];\n    t3.location\
  \ = locs[2];\n    t4.location = locs[7];\n    t5.location = locs[5];\n\n    // 带有设备模块的单个代理将遍布全美，\n\
  \    // 随后所有恐怖分子将通知观察者模块。\n    // 当恐怖分子靠近时，模块将触发。\n    for(int i = 0; i < 10; i++)\
  \ {\n        m.location = locs[i];\n        t1.notifyObservers();\n        t2.notifyObservers();\n\
  \        t3.notifyObservers();\n        t4.notifyObservers();\n        t5.notifyObservers();\n\
  \    }\n```\n\n你将在控制台中得到以下内容：\n\nALERT: Terrorist Nearby Agents in Chicago\nALERT:\
  \ Terrorist Nearby Agents in New York\nALERT: Terrorist Nearby Agents in Cleveland\n\
  ALERT: Terrorist Nearby Agents in Boston\nALERT: Terrorist Nearby Agents in Miami\n\
  \n# 第 16 章：\n\n## 外面模式 (Facade Pattern)\n\n开车很容易。要启动汽车，只需转动点火开关上的钥匙或按下按钮。加速时踩油门。减速或停止，踩刹车踏板，方向盘则允许你控制汽车的方向。\n\
  \n然而，汽车非常复杂。启动汽车需要大量的能量。它需要汽油。你的引擎需要足够的油来润滑活塞和其他所有部件。火花塞需要点燃发动机缸，并产生足够的能量让汽车移动。转向、加速和制动等功能需要一套不同的、复杂的组件协同工作。\n\
  \n从驾驶位来看，我们无法接触所有这些复杂性。我们只能看到面前简单的工具。简而言之，这就是**外观 (Facade)**。\n\n### 外面模式的工作原理\n\
  \n外观模式的工作原理相同。它提供了一个顶层组件，用于监督复杂系统的功能。这使得操作复杂系统变得简单得多，因为你只需要在外观中控制你面前的简单系统。我们的汽车案例就向我们展示了这一点。司机不需要自己操作每一个组件，不需要进入引擎内部，也不需要执行数十操作来让汽车移动。他只需要理解如何操作挡杆、踏板和方向盘。\n\
  \n#### 创建外观模式\n\n当你想要实现外观时，首先需要理解我们希望简化的核心程序/行为。\n\n使用接口，我们应遵循以下步骤：\n\n1. 创建一个 `Facade`\
  \ 接口。\n2. 创建一个执行 `Facade` 的通用客户端类。\n3. 通用客户端应该应用所有程序，并包含尽可能多的组件实例。\n4. 如果必要，创建多个\
  \ `Facade` 接口和客户端类。在此情况下，重复步骤 1 到 3。\n5. 需要时为客户端类创建子类。\n\n如果你使用包含类（encompassing\
  \ class），请遵循这些步骤：\n\n1. 创建通用的 `Facade` 类。该类实现前面提到的所有主要程序。\n2. 创建通用客户端类。它应该包含一个 `Facade`\
  \ 实例。\n3. 如果合适，创建多个 `Facade` 类并重复步骤 1 和 2。\n\n### C# 中的外观模式\n\n`==== ==== ==== ====\
  \ ====`\n\n为了充分理解外观模式，我们需要观察它的环境。请注意构成复杂系统的组件集合。\n\n下面是一个带有多个子组件的组件类示例，其方法可能依赖于它的子组件。\n\
  \n```csharp\n/*\n// 组件类，带有子组件\n// 方法：\n// - 一个访问子组件的方法\n*/\nclass ComponentOne {\n\
  \    SubcompOneOne sc11 = new SubcompOneOne();\n    SubcompOneTwo sc12 = new SubcompOneTwo();\n\
  \n    // IN & OUT: (由你选择)\n    // EFFECT: (由你选择)\n    public void distinctMethodOne()\
  \ {\n        sc11.distinctMethodOneOne();\n        sc12.distinctMethodOneTwo();\n\
  \    }\n}\n\nclass SubcompOneOne {\n    // IN & OUT: (由你选择)\n}\n```\n\n\n\n\n```csharp\n\
  \    // Effect: (由选择)\n\n    public void distinctMethodOneOne() {\n\n    }\n\n}\n\
  \nclass SubcompOneTwo {\n\n    // 输入 & 输出: (由选择)\n\n    // Effect: (由选择)\n    public\
  \ void distinctMethodOneTwo() {\n\n  }\n\n}\n```\n\n这是环境中另外两个组件的示例：\n\n```csharp\n\
  class ComponentTwo {\n\n    // 输入 & 输出: (由选择)\n    // Effect: (由选择)\n    public\
  \ void distinctMethodTwo() {\n\n        // (在此处添加实现代码)\n\n    }\n}\n\nclass ComponentN\
  \ {\n\n    // 输入 & 输出: (由选择)\n    // Effect: (由选择)\n    public void distinctMethodN()\
  \ {\n\n        // (在此处添加实现代码)\n\n    }\n\n}\n```\n\n所有组件都需要协调。\n\n下面是我们在 C# 中实现\
  \ Facade（外观）模式的方式。它看起来是这样：\n\n```csharp\n/*\n\n// 作为接口的 Facade\n// (包含所有利用\n// 环境内组件的主要过程)\n\
  */\ninterface Facade{\n    // 主要过程：\n    // 输入 & 输出: (由选择)\n    // Effect: (由选择)\n\
  \    // - 调用所有系统组件的方法\n    void activateA();\n\n    void activateB();\n}\n\n/*\n\
  \n//  类\n// (实现 Facade 接口中定义的所有过程)\n*/\nclass Client : Facade {\n ComponentOne c1\
  \ = new ComponentOne();\n\n    ComponentTwo c2 = new ComponentTwo();\n  ComponentN\
  \ cN = new ComponentN();\n\n    // 来自 Facade 接口的方法：\n    void Facade.activateA()\
  \ {\n        c1.distinctMethodOne();\n    }\n\n    void Facade.activateB() {\n \
  \       c2.distinctMethodTwo();\n        cN.distinctMethodN();\n    }\n}\n```\n\n\
  接口将由 `Client` 类实现：\n\n```csharp\n// Client 子类：\n// (根据需要随时添加)\nclass ClientA : Client\
  \ {\n\n}\n\nclass ClientB : Client {\n\n}\n```\n\n如果将 `Facade` 实现为一个大的超类，那么它看起来会是这样：\n\
  \n```csharp\n/*\n\n// 作为主要类的 Facade\n// - 包含环境中的每个组件的实例\n// - 包含利用\n// 环境内组件的主要过程\n\
  */\nclass Facade{\n ComponentOne c1 = new ComponentOne();\n\n    ComponentTwo c2\
  \ = new ComponentTwo();\n…\n\n    ComponentN cN = new ComponentN(); \n\n    // 主要过程：\n\
  \    // 输入 & 输出: (由选择)\n    // Effect: (由选择)\n    public void activateA() {\n  \
  \      c1.distinctMethodOne();\n    }\n\n    public void activateB() {\n       \
  \ c2.distinctMethodTwo();\n        cN.distinctMethodN();\n    }\n}\n```\n\n`Client`\
  \ 类拥有 `Facade` 实例：\n\n```csharp\n// Client 类：\n// (软件其余部分的访问)\nclass Client {\n\n\
  \    Facade f = new Facade();\n}\n\n// Client 子类：\n// (根据需要随时添加)\nclass ClientA\
  \ extends Client{}\nclass ClientB extends Client{}\n```\n\n### 应用 Facade 模式\n\n\
  使用你喜欢的 IDE 来实现这些代码。你可以使用在线工具，如 [codechef.com](http://codechef.com)、[rextester.com](http://rextester.com)、[ideone.com](http://ideone.com)\
  \ 或 [codpad.org](http://codpad.org)。\n\n\n\n\n\n```cs\nclass ClientB: Client {\n\
  \n}\n```\n\n你的客户端子类将像普通客户端一样访问 Facade 过程：\n\n```csharp\nClient ca = new ClientA();\n\
  Client cb = new ClientB();\n// 启动引擎：\nca.f.startEngine();\ncb.f.startEngine();\n\
  // 激活曲速驱动：\nca.f.activateWarpDrive();\ncb.f.activateWarpDrive();\n```\n\n我们可以看到\
  \ Facade 模式是如何创建一个简单的核心或功能的。因此，当面对此类问题时，可以考虑使用该模式。\n\n### 如果有多个 FACADE：\n\n如果程序需要你创建多个\
  \ Facade，让我们看看它是如何运作的。让我们用示例来展示这一点：\n\n```csharp\nclass EngineFacade {\n    PositronEngine\
  \ pe = new PositronEngine();\n    // 主要程序：\n    public void startEngine(){\n   \
  \     pe.startEngine();\n        // (其余的实现部分)\n    }\n}\n\nclass WarpDriveFacade\
  \ {\n    WarpDrive wd = new WarpDrive();\n    // 主要程序：\n    public void activateWarpDrive(){\n\
  \        wd.warpTo(new Coordinates(0, 0, 0));\n        // (其余的实现部分)\n    }\n}\n\
  ```\n\n即使是通用 Client 类也会反映这些变化：\n\n```csharp\n// Client 类：\n// (软件的其他部分访问此处)\nclass\
  \ Client {\n    EngineFacade ef = new EngineFacade();\n    WarpDriveFacade wdf =\
  \ new WarpDriveFacade();\n}\n```\n\n# 第 17 章：\n\n## 异步编程\n\nC# 允许你编写异步代码。假设你正在编写一个下载图像的\
  \ Windows 程序。点击按钮并下载图像将需要超过 30 秒，如果你尝试同步下载图像，你的程序将无响应。更好的方法是使用异步。\n\n我们将探索这意味着什么，以及我们如何在应用程序中使用它。\n\
  \n# 目录\n\n- 使用 async 和 await 进行异步编程\n\n我们可以通过使用两个关键字：`async` 和 `await` 来使用异步编程。让我们来看这两个关键字。\n\
  \n### Async\n\n如果在声明函数时在前面加上该关键字，该函数将成为异步函数。该关键字激活了 .NET 框架的资源，允许我们创建异步框架。该函数将被异步调用。语法如下：\n\
  \n```csharp\npublic async void MyProcess() { }\n```\n\n上面的函数将被异步地调用。\n\n### Await\n\
  \n在前面带有 `async` 的函数内部必须有一个 `await` 关键字。其语法如下：\n\n```csharp\npublic async void MyProcess()\n\
  {\n    // 执行异步工作\n    await Task.delay(5);\n}\n```\n\n上面的函数将在等待 5 秒后激活。\n\n下面的代码从网络上异步下载图像。\n\
  \n示例 1：\n\n```csharp\nprivate void button_Click(object sender, EventArgs e)\n{\n\
  \    WebClient image = new WebClient();\n    byte[] imageData = image.DownloadData('http://urlOfTheImage');\n\
  \    this.imageView.Image = Image.FromStream(new MemoryStream(imageData));\n}\n\
  ```\n\n在代码执行期间，你的应用程序将变得无响应，而这不是我们所的。我们可以使用 `async` 和 `await` 这样修复它：\n\n示例 2：\n\n\
  ```csharp\nprivate async void button_Click(object sender, EventArgs e)\n{\n    WebClient\
  \ image = new WebClient();\n    byte[] imageData = await image.DownloadDataTaskAsync('http://urlOfTheImage');\n\
  \    this.imageView.Image = Image.FromStream(new MemoryStream(imageData));\n}\n\
  ```\n\n如果你查看这两个代码块，你会发现三个区别：\n\n- 在函数之前添加了 `async` 关键字。\n- `await` 关键字位于图像下载方法之前。\n\
  - `DownloadDataAsync` 替换了 `DownloadData` 方法。\n\n`DownloadData` 方法同步下载数据。当它完成时，它会将控制权返回给调用者，这会导致程序无响应。`DownloadDataAsync`\
  \ 返回控制权并异步下载。`await` 方法在下载完成之前会释放 UI 线程。当遇到 `await` 关键字时，函数会在指定的进程完成后返回，然后函数从它停止的地方继续执行。\n\
  \n**注意：** 异步方法可以返回三种类型的值。\n\n- `Void`：不返回任何。\n- `Task`：它将执行一个操作。\n- `Task<T>`：将返回一个带有\
  \ `T` 类型参数的任务。\n\n**任务：** `Task` 将不返回任何值（假设它是 void），而 `Task<int>` 将返回一个 `int` 类型元素。我们可以将其称为泛型。\n\
  \n**注意：** 如果缺少 `await` 关键字，`async` 方法将同步运行。\n\n示例 3：\n\n```csharp\nusing System;\n\
  using System.IO;\nusing System.Threading.Tasks;\n\nclass Program\n{\n    static\
  \ void Main()\n    {\n        Task task = ProcesheData();\n        task.Wait();\n\
  \    }\n    static async void ProcesheData()\n    {\n        Task<int> task = HandleFile('1.txt');\n\
  \        Console.WriteLine('Wait something vital');\n        int x = await task;\n\
  \        Console.WriteLine('Count: ' + x);\n    }\n    static async Task<int> HandleFile(string\
  \ file)\n    {\n        Console.WriteLine('HandleFile');\n        int count = 0;\n\
  \        using (StreamReader reader = new StreamReader(file))\n        {\n     \
  \       string v = await reader.ReadToEndAsync();\n            for (int i = 0; i\
  \ < 10000; i++)\n            {\n                int x = v.HashCode();\n        \
  \        if (x == 0)\n                {\n                    Console.WriteLine('Wait\
  \ something vital');\n                    count--;\n                }\n        \
  \    }\n        }\n        Console.WriteLine('HandleFile');\n        return count;\n\
  \    }\n}\n```\n\n\n\n\n\n许多人认为编写视频游戏是学习编程的最佳方式之一。游戏将教你许多与编程整体相关的知识。你将遇到在其他情况下无法接触到的编程概念，这会扩展你的思维和逻辑推理能力。\n\
  \n2004 年，微软发布了一个名为 `XNA` 的游戏开发引擎。`Terraria` 这样的热门游戏就是使用该引擎开发的。XNA 现在已经过时了。它被集成到了另一个名为\
  \ `MonoGame` 的游戏引擎中，后者更流行，并允许程序员跨平台开发。XNA 只允许你为微软平台开发游戏，而 MonoGame 已为微软 (Xbox)、索尼\
  \ (Playstation)、苹果 (iPhone) 和谷歌 (Android) 构建过游戏。\n\nMonoGame 是免费开源的。你可以下载它并对代码进行修改，从而对软件拥有更大的自主权。你可以在网上轻松地找到\
  \ MonoGame。网上有很多关于 MonoGame 的教程。在本章中，我们将深入解释核心概念，以便你更容易跟上任何教程。\n\n### 内容流水线 (Content\
  \ Pipeline)\n\n所有游戏都需要内容。内容流水线是你用于向游戏提供内容的方法。MonoGame 内容流水线与 Visual Studio 并行运行，为你提供了一种创建和导入内容的简单方法。例如，如果你需要创建一个字体，你需要在内容流水线中创建一个新的\
  \ `SpriteFont`。如果你需要导入角色艺术，也将使用内容流水线来完成。\n\n### MonoGame 程序的结构\n\nMonoGame 项目在自动创建的主类中有几个方法。你会在其中发现\
  \ `Update`、`Initialize`、`LoadContent` 和 `UnloadContent` 类。了解它们的工作原理是非常重要的。\n\n所有这些类都是保护方法（protected\
  \ methods）。这意味着你可以通过从 `Game` 类创建的新类来重写（override）。你可以从新创建的 `Game` 类中调用 `LoadContent`\
  \ 和 `UnloadContent`。这是很有意义，因为移除特定的游戏资产以执行更符合你项目的操作是有用的。例如，如果一个敌人死亡了，并且是它们在游戏中最后一次出现，你就会使用重写的\
  \ `UnloadContent` 从从游戏中卸载该资产，从而提高性能。\n\n默认类是最重要且需要理解的类，因此我们将在下文中探索它们。\n\n`Draw()`\
  \ 用于在屏幕上绘制一帧。它被用于确定绘制逻辑。在某些情况下，你可能需要从保护方法派生出一个独立的绘制函数，并定义在相关类的规范中。然而，理解它在游戏语境下如何运作是非常重要的。\n\
  \n`Initialize()` 初始化你的内容。它在 `Game` 和 `GraphicsDevice` 对象创建之后、在调用 `LoadContent` 方法之前调用。你使用它来初始化游戏对象等。如果你想在游戏开始后初始化某些内容，也可以从派生类中调用它。\n\
  \n`LoadContent()` 加载所有的游戏图形资源。这些是 `SpriteFonts`、游戏精灵（sprites）等。我们稍后会详细讨论。\n\n`UnloadContent()`\
  \ 卸载所有游戏图形资源。它随时可以使用，例如正如我们之前讨论的那样，如果你不再需要特定的精灵。该方法可以在 `Game` 类或派生类中被调用。在处理较大的游戏时，知道这一点尤为重要。\n\
  \n`Update()` 更新你的游戏。该方法持续运行并包含你的游戏逻辑。这包括人工智能、单元碰撞等内容。它包含了你游戏中经常发生的任何内容。这是一个非常重要的部分。\n\
  \n以上都是在启动 `Game` 类的新实例时创建的五个主要方法。还有更多受保护的 `Game` 类方法。这些是你现阶段需要了解的。\n\n### 纹理 (Textures)\n\
  \n纹理指的是游戏用于表示数据的精灵图像。它们可以被不断更新。关于它们没有什么是最终的。纹理允许你制作角色动画和游戏物品的图形表示。\n\n纹理可以通过内容流水线导入。然后可以使用适当的方法将其导入到\
  \ `LoadContent` 中。这在使用 `Initialize` 方法进行初始化后完成。\n\n下面初始化了一个 2D 精灵：\n\n```\nprivate\
  \ Texture2D myTexture;\n```\n\n必须创建一个 `SpriteBatch` 对象来绘制你所有的纹理，因此这应该尽早完成。通常情况下，当你开始创建游戏项目时，标准模板已经创建了一个\
  \ `SpriteBatch`。\n\n你在 `LoadContent` 方法中编写以下代码：\n\n```\nmyTexture = Content.Load<Texture2D>(\"\
  textureName”);\n```\n\n完成后，你在 `Draw()` 方法中绘制精灵。\n\n你像如下所示开始绘制过程：\n\n```\nspriteBatch.Begin();\n\
  ```\n\n然后你绘制精灵：\n\n```\nspriteBatch.Draw(myTexture, new Vector2(0, 0), Color.White);\n\
  ```\n\n`new Vector2` 为你提供了绘制精灵时使用的 x 和 y 坐标。绘制从精灵的左上角开始。向右和向下移动的数字更大；向左和向上数字较小。\n\
  \n`Color.White` 为你的纹理提供了一个基础色调。正如你所指定的，你的精灵也加载了默认颜色。如果没有它，你的精灵将会有不同的颜色。\n\n`spriteBatch`\
  \ 进程如下结束：\n\n```\nspriteBatch.End();\n```\n\n你可以运行游戏来查看你的精灵是否加载正确。它应该加载在你的默认康乃花蓝（Cornflower\
  \ Blue）背景之上。如果成功了，恭喜！你现在理解了如何将图像加载到游戏中。这是一项极其实用的技能。\n\n### 从键盘和鼠标获取信息\n\n我们将查看键盘和鼠标输入如何工作。MonoGame\
  \ 支持各种输入，如游戏手柄和触摸屏，但对于我们的目的，如果使用你已经可以访问的工具将会简单得多。这是一个很好的起点之一。\n\nXNA 和 MonoGame\
  \ 简化了处理输入的操作。输入基于给定外设的状态：键盘、鼠标和游戏手柄。这部分的逻辑位于初始化后的 `update` 函数中。假设本部分的所有操作都发生在 `Update`\
  \ 函数中。\n\n要操作键盘，你需要创建一个 `KeyboardState` 并从键盘获取信息。因为 `Update` 方法持续运行，信息将始终被收集。\n\n\
  你需要创建一个 `KeyboardState` 对象。你可以给它起任何名字，但为了获取当前状态，你需要使用 `Keyboard` 类的 `GetState` 方法。\n\
  \n```\nKeyboardState state = Keyboard.GetState();\n```\n\n这里是检查某个键是否被按下的方法。假设每个精灵都有一个\
  \ X 和 Y 坐标，存储在内部的 2d 向量中，如下：\n\n```\nVector2 spritePosition = Vector2.Zero;\n```\n\
  \n精灵位置将使用 `Draw()` 进行绘制。它的位置将通过 `update()` 方法更新。如果我们想在按下键时将精灵移动到相应位置，我们将编写 `isKeyDown`\
  \ 检查。当按键按下时，位置就会改变。按键存储在 `Keys` 命名空间的枚举中，因此不需要担心映射问题。\n\n我们将在 `Update` 方法中放入以下逻辑：\n\
  \n```\nif (state.IsKeyDown(Keys.W))\nspritePosition.Y -= 5;\n\nif (state.IsKeyDown(Keys.A))\n\
  spritePosition.Y += 5;\n\nif (state.IsKeyDown(Keys.S))\nspritePosition.X -= 5;\n\
  \nif (state.IsKeyDown(Keys.D))\nspritePosition.X += 5;\n```\n\n在这个示例中，A 让精灵向左移动，W\
  \ 让它向上移动，S 让它向下，D 让它向右移动。因为 `Update()` 方法始终运行，这些条件会不断被检查，这意味着当按下按键时游戏会立即响应。我们可以实现一个\
  \ Escape 键检查，在按下时关闭游戏。\n\n```\nif (state.IsKeyDown(Keys.Escape))\nExit();\n```\n\
  \n\n\n\n自己调试并测试它。运行它，看看你导入的所有按键和纹理是否按照预期的方式移动。\n\n让我们来看看如何处理鼠标输入。它与键盘输入有相似之处，因为一切都基于鼠标的当前状态。删除键盘逻辑，并将其替换为以下代码。\n\
  \n```\nMouseState state = Mouse.GetState();\n```\n\n绘制你精灵的精灵，通过将其绘制到向量 `SpritePostion`\
  \ 中，让它随鼠标移动。使用鼠标状态返回的向量进行移动：\n\n```\nspritePosition.X = state.X;\nspritePosition.Y\
  \ = state.Y;\n```\n\n它们现在会相互对应了。当你移动鼠标时，精灵也应该跟着移动。自己测试并调试程序。\n\n这对于你开始学习输入已经足够了。现在你看到了它们在基础层面是如何运作的。这些知识可以很容易扩展到其他输入设备，如游戏手柄。\n\
  \n## 单位碰撞\n\n单位碰撞是游戏编程中最重要的功能之一。游戏中的一切内容都以纹理的形式呈现。即使游戏菜单也是纹理。如果你想检查诸如鼠标悬停之类的事件，就必须使用单位碰撞。\n\
  \n单位碰撞有许多形式。简化的形式称为边界盒碰撞（bounding box collision）。这是我们将关注的。边界盒基于这样一个想法：所有精灵都可以简化为具有宽度和高度的矩形。因此，如果一个矩形的线与另一个矩形相交，我们就可以判定它们正在发生碰撞。\n\
  \n记住，这是资源消耗最低的单位碰撞；它并不总是最好的。例如，如果你在游戏中有非常精细的东西需要检查碰撞（比如子弹），你将需要更精细的碰撞单元。对于我们的目的，这里是教授单位碰撞和检测基础的最佳方法。\n\
  \n`XNA` 中的矩形具有内置的碰撞检测属性，这意味着你不需要担心编写它。如果你愿意，可以尝试自己写一个。我们将涵盖定制的 XNA 矩形碰撞字典。\n\n我们做的第一件事是定义两个实体的矩形：\n\
  \n```\nRectangle(X_position, Y_position, Width, Height);\n```\n\n你可以创建两个：\n\n```\n\
  Rectangle playerRect = new Rectangle(playerPosition.X, playerPosition.Y, playerTexture.Width,\
  \ playerTexture.Height);\n```\n\n并对对手执行同样的操作：\n\n```\nRectangle enemyRect = new\
  \ Rectangle(enemyPosition.X, enemyPosition.Y, enemyTexture.Width, enemyTexture.Height);\n\
  ```\n\n然后为碰撞写一个 if 语句：\n\n```\nif (playerRect.collides(enemyRect)) {\n    // 碰撞检测逻辑位于其中\n\
  }\n```\n\n这背后的逻辑很简单。你不会遇到任何问题。你需要亲自动手来理解我的意思。随着你水平的提高，会变得有点困难，但你做得越多，你的表现就会越好。\n\
  \n## 人工智能\n\n视频游戏中的人工智能令人印象深刻。在我们处理它之前，我们会讨论一下。\n\n假设你正在制作一个人工智能系统，让游戏中的实体跟随玩家。有很多方法可以实现。这归结为路径寻找（pathfinding），即寻找两点之间的最短路径。它对于游戏和许多其他应用都很重要。\n\
  \n路径寻找有不同的形式。`A*` 方法和 `MaxDxDy` 是最流行的。`A*` 方法没有 `MaxDxDy` 算法精确。`MaxDxDy` 以其高精度但消耗大量系统资源而闻名。游戏已经对我们的系统提出了很高要求，因此我们将关注更简单、更节约的\
  \ `A*` 方法。保留 `A*` 方法的其他原因是它是简单且对初学者友好的，而且是最常见的路径寻找算法。\n\n`A*` 方法运行在系统节点上，这意味着我们不需要担心僵硬的算法结构。例如，某些路径寻找算法只适用于特定尺寸的元素。`A*`\
  \ 方法专注于游戏中事物之间的关系和接近性，无论设置如何。`A*` 路径寻找也是最高效、最快的。它预测两个点之间还剩下多少距离，并寻找向前的最佳路径，倾向于它认为会运行良好的路径。\n\
  \n`A*` 是一个完整的算法，这意味着只要问题适用于其应用，它总能找到问题的解决方案。\n\n路径寻找算法假设地图充满了节点。因此，最好在俯视角的瓦格游戏上练习它们，因为在尝试将其应用到更复杂的应用之前，这样更容易看到算法是如何运作的。\n\
  \n`A*` 算法搜索成本更低的路径；成本由到终点的距离、时间和其他因素定义。\n\n目标是最小化此值：\n\n```\nf(n) = g(n) + h(n)\n\
  ```\n\n`n` 可以定义为路径上的一个节点——最后一个被选中的节点——而 `g(n)` 是从程序的第一个节点到给定 `n` 的总开销，而 `h(n)` 是一种启发式方法，它对当前节点到终点的开销给出可靠的估计。\n\
  \n算法根据上一个节点和当前节点循环以最小化开销，以确定下一个最佳节点。比较节点的 `f(n)`，并将下一个与上一个 `f(n)` 进行比较。不是节点的东西、障碍物和困难地形不被认为是可行的。\n\
  \n你可以通过创建一个瓦块地图来实现该算法，其中你的精灵必须到达地图上的另一个位置。你甚至可以通过标记目标位置来测试不同的路径寻找算法。\n\n有两种方法可以应用启发式：欧几里得方法或哈顿方法。\n\
  \n最简单的是哈顿方法，但它没有给出最好的估计。它在数学上最简单，因此消耗资源少。\n\n哈顿距离可以这样应用：\n\n```\n|destination.X\
  \ - node.X| + |destination.Y - node.Y|\n```\n\n欧几里得距离可以这样应用：\n\n```\nsqrt((destination.X\
  \ - node.X)² + (destination.Y - node.Y²)\n```\n\n它们都能为给定的节点 `n` 给出 `h(n)`。这是你可以在游戏中实现的最简单的人工智能。那里有其他算法可以实现更多；我们选择这一个是因为它更容易理解。\n\
  \n你的下一步是使用你所学的一切知识。为了提高水平，请挑战自己。编程挑战是提高技能的好方法。如果你想构建某些东西，去看看是否有其他人做过，并学习他们是如何做的。不断学习尽可能多编程方面的知识，不要害怕实验或提问。\n\
  \n# 结\n\n我不会对你说谎；编程并不容易。在你面前有一段漫长而艰辛的旅程。如果你选择成为程序员，你必须接受自己永远无法掌握全部，并且必须保持开放学习的态度。这就是为什么我决定教你底层概念和方法。这些仅仅是基础，是一个工具包，你将对其进行磨练、成长并学会更好地使用它们。你准备好了。\n\
  \n\n\n\n\n有时，你会觉得想把头撞在桌子上然后直接放弃。“冒充者综合征”在科技领域是真实存在的；每个人都觉得自己像个骗子，但那是因为编程是一个巨大的领域，有太多需要学习的内容。唯一重要的是，要具备足够的能力在问题出现时修复它们，并构建你要求的东西。你会发现，大多数时候你必须制定计划或进行研究。极少有的时候你是直接知道该做什么。\n\
  \n你也可以尝试查看开源项目，或者继续阅读以提高自己。你在这里收获的是一个良好的基础，你可以将其扩展到其他 `C`-风格的编程语言。\n\n# 参考文献\n\n\
