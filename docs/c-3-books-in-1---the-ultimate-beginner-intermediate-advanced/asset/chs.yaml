  \            ar.Push(2);\n            ar.Push(3);\n            Console.WriteLine(\"\
  The number of elements on the stack is \" + ar.Count);\n            Console.Read();\n\
  \        }\n    }\n}\n```\n控制台将为我们输出内容：\n**The number of elements on the stack is\
  \ 3**\n\n#### Clear Function\n\n下面我们使用 `clear` 函数来移除栈中的元素。\n\n使用 `clear` 函数\n```cs\n\
