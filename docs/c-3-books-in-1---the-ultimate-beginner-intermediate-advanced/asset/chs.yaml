  \n\n\n与我们看过的集合一样，`SortedList` 集合也有自己的方法。\n\n### SortedList 操作\n\n以下是 `SortedList`\
  \ 方法的简要描述。\n\n| 函数 | 描述 |\n| :--- | :--- |\n| `Count` | 告诉我们 `SortedList` 中有多少个项\
  \ |\n| `Clears()` | 移除 `SortedList` 中的所有元素 |\n| `ContainsKey()` | 检查集合是否包含特定的键 |\n\
  | `ContainsValue()` | 检查 `SortedList` 是否包含特定的值 |\n| `IndexOfKey()` | 给出特定键的索引 |\n\
  | `IndexOfValue()` | 给出特定值的索引 |\n| `Remove()` | 从 `SortedList` 中移除一个项/位置 |\n| `RemoveAt()`\
  \ | 移除特定位置上的项/对象 |\n\n### Count 属性\n\n我们将使用 `Count` 方法来查找 `SortedList` 中有多少个项。\n\
  \n```csharp\nusing System;\n\nusing System.Collections;\n\nnamespace Demo\n{\n \
