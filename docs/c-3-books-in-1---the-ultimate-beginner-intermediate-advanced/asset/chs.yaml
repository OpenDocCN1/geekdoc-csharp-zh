  \ position 1 is 37\n\n### Reverse Function\n\n此方法反转 `ArrayList` 中的元素。\n\n使用 `reverse`\
  \ 方法\n\n```csharp\nusing System;\nusing System.Collections;\n\nnamespace Demo\n\
  {\n    class Program\n    {\n        // 主函数\n        static void Main(string[] args)\n\
