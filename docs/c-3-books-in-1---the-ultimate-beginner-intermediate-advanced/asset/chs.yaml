  \            // 在位置 2 插入值 4\n            ar.Insert(2, 4);\n            Console.WriteLine(\"\
  The value at index 2 is \" + ar[2]);\n            Console.Read();\n        }\n \
  \   }\n}\n```\n\n这是我们在控制台中应该看到的：\nThe index of value 37 is 2\nThe index of value\
  \ 2 is 4\n\n### Remove Function\n\n此方法从 `ArrayList` 中移除一个项。\n\n使用 `remove` 方法\n\n\
  ```csharp\nusing System;\nusing System.Collections;\n\nnamespace Demo\n{\n    class\
  \ Program\n    {\n        // 主函数\n        static void Main(string[] args)\n    \
