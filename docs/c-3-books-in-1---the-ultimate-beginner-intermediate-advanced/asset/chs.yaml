  \ \"Two\");\n            ar.Add(999, \"Three\");\n            Console.WriteLine(\"\
  The index of the key 999 is \" + ar.IndexOfKey(999) + \". :)\");\n            Console.Read();\n\
  \        }\n    }\n}\n```\n\n我们应该控制台中观察到以下结果：\nThe index of the key 999 is 2.\n\n\
  ### IndexOfValue 函数\n\n我们将使用 `IndexOfValue` 方法来查找我们感兴趣的值索引。此程序展示了如何使用 `IndexOfValue`\
  \ 函数。\n\n```csharp\nusing System;\n\nusing System.Collections;\n\nnamespace Demo\n\
  {\n    class Program\n    {\n        // 主函数\n        static void Main(string[] args)\n\
  \        {\n            // 定义 SortedList\n            SortedList ar = new SortedList();\n\
  \            // 向 SortedList 添加元素\n            ar.Add(1, \"One Ring To Them All\"\
  );\n            ar.Add(2, \"Sam helped Frodo\");\n            ar.Add(3, \"Sing along\"\
  );\n            Console.WriteLine(\"True or False, does the SortedList contain the\
  \ Value \\\"One Ring To Them All\\\"? \" + ar.IndexOfValue(\"One Ring To Them All\"\
  ));\n            Console.Read();\n        }\n    }\n}\n```\n\n### Remove 函数\n\n\
  此函数用于从 `SortedList` 中移除一个对象。\n\n```csharp\nusing System;\n\nusing System.Collections;\n\
  \nnamespace Demo\n{\n    class Program\n    {\n        // 主函数\n        static void\
  \ Main(string[] args)\n        {\n            // 定义 SortedList\n            SortedList\
  \ ar = new SortedList();\n            // ... (逻辑省略)\n        }\n    }\n}\n```\n\n\
  ### RemoveAt 函数\n\n我们将使用 `RemoveAt` 方法移除特定索引处的项。\n\n\n\n索引器（Indexers）允许自定义类像数组一样被索引。每个成员都通过数组访问运算符\
  \ `[]` 来访问，而不是属性（由于它是一个类，你可能会预期使用属性）（“C# 索引器”）。\n\n索引器的定义如下：\n\n```csharp\ntype\
  \ this[int index]\n{\n    get\n    {\n        //返回值\n    }\n    set\n    {\n   \
  \     //设置值\n    }\n}\n```\n\n以下是访问该类的方法：\n\n`Example[2];`\n\n在下面的示例中，我们将它用作专辑收藏搜索器，它可以告诉我们专辑是在哪一年发布的。\n\
  \n```csharp\nusing System;\nusing System.Collections.Generic;\nnamespace ConsoleApplication1\n\
  {\nclass Program\n{\n    static void Main()\n    {\n        Album main_floor = new\
  \ Album();\n        //添加项\n        main_floor.AddItem(new Item(\"The Crux\", 2012));\n\
  \        main_floor.AddItem(new Item(\"Chromatica\", 2020));\n        // 使用索引器获取年份\n\
  \        Console.WriteLine(\"The Crux by HURT was released in \" + main_floor[\"\
  The Crux\"] + \" and Chromatica by Lady Gaga in \" + main_floor[\"Chromatica\"]\
  \ + \".\");\n        Console.ReadKey();\n    }\n}\nclass Album\n{\n    List<Item>\
  \ Items = new List<Item>();\n    public void AddItem(Item item)\n    {\n       \
  \ Items.Add(item);\n    }\n    public double this[string index]\n    {\n       \
  \ get\n        {\n            foreach (Item item in Items)\n            {\n    \
  \            if (item.Name == index)\n                {\n                    return\
  \ item.Year;\n                }\n            }\n            // 用于表示没有该项\n      \
  \      return -1;\n        }\n        set\n        {\n            // 你也可以用它来设置值，就像在属性\n\
  \            // 中设置值一样\n        }\n    }\n}\n// 用于存储项目的简单类\nclass Item\n{\n    public\
  \ Item(string name, double year)\n    {\n        Name = name;\n        Year = year;\n\
  \    }\n    public string Name { get; }\n    public double Year { get; }\n}\n}\n\
  ```\n\n我们应该在控制台中得到以下结果：\nThe Crux by HURT was released in 2012 and Chromatica by\
  \ Lady Gaga in 2020.\n\n如果你难以看懂我的操作，请将代码复制并粘贴到你的 IDE 中。它将被正确高亮，代码也会更容易理解。\n\n# 第\
  \ 8 章：\n\n## 泛型\n\n泛型允许我们在不指定特定数据类型的情况下声明列表、类和其他元素。换句话说，你将能够创建可以处理任何数据类型的方法和类。参数将作为不同数据类型的占位符。编译器将根据提供的数据类型使用这些方法。泛型提高了代码的可重用性和灵活性。让我们来看下面的示例，这样你就能有一个更生动的例子来了解泛型的作用。\n\
  \n我们在这里使用 `Display`，稍后将展示它是如何工作的。\n\n在这个示例中，我们使用多个方法来显示整数。\n\n```csharp\nusing System;\n\
  using System.Collections;\nnamespace Demo\n{\n    class Program\n    {\n       \
  \ // 整数的显示方法\n        public static void Add(int i)\n        {\n            Console.WriteLine(“The\
  \ value is “ + i);\n        }\n        // 双浮型数的显示方法\n        public static void\
  \ Add(double i)\n        {\n            Console.WriteLine(“The value is “ + i);\n\
  \        }\n        // 主函数\n        static void Main(string[] args)\n        {\n\
  \            Display(1);\n            Display(1.1);\n            Console.Read();\n\
  \        }\n    }\n}\n```\n\n关于该程序，结果应该是这种格式的：\n**The value is 1**\n**The value\
  \ is 1.1**\n\n在在上一个示例中，我们创建了两个执行相同任务的方法。然而，我们需要一个用于整数，另一个用于双精度数据类型。我们可以使用‘泛型’数据类型让这个程序更通用。\n\
  \n示例：下一个程序展示了如何使用泛型数据类型。\n\n```csharp\nusing System;\nusing System.Collections.Generic;\n\
  namespace Demo\n{\n    class Program\n    {\n        // 泛型显示方法\n        public static\
  \ void Display<T>(T i)\n        {\n            Console.WriteLine(\" This is value\
  \ \" + i);\n        }\n        // 主函数\n        static void Main(string[] args)\n\
  \        {\n            // 使用数据类型调用泛型\n            Display<int>(1);\n          \
  \  Display<double>(1.1);\n            Console.Read();\n        }\n    }\n}\n```\n\
  \n程序将打印：\n**This is value 1**\n**The value 1.1**\n\n### 泛型类\n\n类也可以是泛型的。泛型类的语法如下：\n\
  `public class classname<T>`\n在此段代码中，`classname` 是类名。让我们来看一个泛型类的示例。\n示例：下面的程序展示了泛泛型类的方法。\n\
  \n```csharp\nusing System;\nusing System.Collections.Generic;\nnamespace Demo\n\
  {\n    // 泛型类\n    public class GenericSet<T>\n    {\n        private T[] array;\n\
  \        public GenericSet(int size)\n        {\n            array = new T[size\
  \ + 1];\n        }\n        public T getItem(int index)\n        {\n           \
  \ return array[index];\n        }\n        public void setItem(int index, T value)\n\
  \        {\n            array[index] = value;\n        }\n    }\n    class Program\n\
  \    {\n        // 主函数\n        static void Main(string[] args)\n        {\n   \
  \         GenericSet<int> gn = new GenericSet<int>(2);\n            gn.setItem(1,\
  \ 1);\n            gn.setItem(2, 2);\n            Console.WriteLine(\"Item one is\
  \ \" + gn.getItem(1));\n            Console.WriteLine(\"Item two is \" + gn.getItem(2));\n\
  \        }\n    }\n}\n```\n\n关于该程序，结果应该是这种格式的：\nItem one is 1\nItem two is 2\n\n\
  #### 泛型集合 List<T>\n\n泛型集合允许我们创建具有数组功能的集合。因此，它们更像数组。你必须声明并初始化它们，如下所示：\n\n示例 1：\n\n\
  ```csharp\nusing System;\nusing System.Collections.Generic;\nnamespace MyApplication\n\
  {\nclass Program\n{\n    public static void Main(string[] args)\n    {\n       \
  \ List<int> myRows = new List<int>();\n        myRows.Add(11);\n        myRows.Add(22);\n\
  \        myRows.Add(33);\n        foreach(int i in myRows)\n        {\n        \
  \    Console.WriteLine(\"Number \" + i + \" in the house!\");\n        }\n    }\n\
  }\n```\n\n`List` 类的类型签名是 `List<T>`，其中 `T` 可以任何数据类型：`string`、`int`、`double` 等。如果你定义一个\
  \ `int` 列表，它将包含 `int`，对于其他数据类型也是如此。在上面的示例中，列表只包含整数，因为我们这样定义的。此外，我们可以使用 `Add()` 方法添加任意数量的整数。列表允许我们对它们使用许多方法，如\
  \ `Contains`、`Remove`、`Count` 等。\n\n下面是上述示例的输出：\nNumber 11 in the house!\nNumber\
  \ 22 in the house!\nNumber 33 in the house!\n\n#### 泛型方法\n\n泛型方法和类在各种数据类型的情况下提供了很的代码重用性。泛型方法的神奇之处在于，它们可以在所在类不是泛型，或者类参数尚未定义的空间中使用。泛型方法始终遵循这种模式：`方法名\
  \ (类型参数语法)`。让我们来看下面的。\n\n示例 2：\n\n```csharp\nnamespace MySampleApplication\n{\n\
  public static class MathExp\n{\n    public static T Max<T>(T first, params T[] values)\n\
  \    where T : IComparable\n    {\n        T max = first;\n        foreach (T item\
  \ in values)\n        {\n            if (item.CompareTo(max) > 0)\n            {\n\
  \                max = item;\n            }\n        }\n        return max;\n  \
  \  }\n    public static T Min<T>(T first, params T[] values)\n    where T : IComparable\n\
  \    {\n        T mini = first;\n        foreach (T item in values)\n        {\n\
  \            if (item.CompareTo(mini) < 0)\n            {\n                mini\
  \ = item;\n            }\n        }\n        return mini;\n    }\n}\n}\n```\n\n\n\
  \n`MathExp` 类有两个泛型方法：`Min<T>` 和 `Max<T>`。这些方法的功能非常直观。`Min<T>` 查找并返回列表中的最小值。`Max<T>`\
  \ 查找并返回列表中的最大值。`<T>` 是任何数据类型的占位符，如 `int`、`strings`、`floats` 等。\n\n以下是这两种方法的示例：\n\
  \n```\nConsole.WriteLine (MathEx.Max<int> (63, 800, 700))\nConsole.WriteLine (MathEx.Max<string>\
  \ (“Almonds,” “Walnuts,” “Pistachios”))\n```\n\n我们的输出将是：\n\n800\nPistachios\n\n\
  在示例中，我们必须在 `<<>` 中指定列表中的数据类型。有趣的是，即使我们没有指定数据类型，C# 编译器仍然能够运行该方法，因为它可以找出列表中的数据类型是什么。这被称为类型接口（type\
  \ interfacing）。为了看到它的运行效果，我们需要再次尝试代码，如下：\n\n以下是这两种方法的示例：\n\n```\nConsole.WriteLine\
  \ (MathEx.Max(63, 800, 700))\nConsole.WriteLine (MathEx.Max(“Almonds,” “Walnuts,”\
  \ “Pistachios”))\n```\n\n我们的输出与之前相同：\n\n800\nPistachios\n\n即使我们没有在列表中指定数据类型，我们的输出也是一样的。这种方法唯一失败的情况是在一个列表中混合了不同的数据类型。例如，你不能在整数和浮点数的列表上运行它。\n\
  \n# 第 9 章：垃圾回收\n\n当你创建一个对象时，`CLR` 会从 `Heap` 分配内存。这个过程在每次新对象形成并创建时都会重复。但它不能永远持续，因为内存是有限的。系统有时必须清除未使用的对象并为新对象腾出空间。垃圾回收（Garbage\
  \ Collection，简称 `GC`）管理内存。它分配并回收内存。它为新对象分配内存，然后进入堆移除程序未使用的对象。这意味着仍然有足够的可用。\n\n###\
  \ 内存事实\n\n当过程被触发时，它会被赋予一段源自你物理内存的虚拟空间。物理内存是计算机使用的实际内存，`RAM`。程序处理虚拟空间——那是它们的工作内存。机器处理物理空间。\n\
  \n虚拟内存拥有被称为 `holes` 的空闲块。当对象请求内存时，`GC` 会寻找空块并将其分配给对象。虚拟内存是计算机提供给程序或代码运行范围的内存。\n\n\
  以下是虚拟内存中三种类型的块：\n\n* `Free`（空闲），空空间\n* `Reserved`（保留），已分配\n* `Committed`（已提交），保留给物理内存且无法分配\n\
  \n### GC 如何工作？\n\n`Heap` 是一个用于存储对象的内存块。当 `Heap` 中发生 `GC` 时，它会寻找并移除非活跃对象，然后压缩剩余对象以释放更多内存。\n\
  \n`Heap` 由一组代（generations）管理。这些代存储并处理短期和长期对象。这些代是：\n\n* `0 Generation`（0 代）——它持有持续时间不长的短期、临时对象。`GC`\
  \ 频繁激活。\n* `1 Generation`（1 代）——存在于短期和长期对象之间的缓冲区\n* `2 Generation`（2 代）——持有长期对象，例如\
  \ `static` 和全局变量，这些对象需要更久的时间，且程序可能依赖它们。当对象在 `0 generation` 中未被回收时，它会被移动到 `1 Generation`。该对象被称为\
  \ `survivor`（幸存者）。如果在 `1 generation` 中再次未被回收，它会被移动到 `2 Generation`，因为如果它仍然活跃，它一定很重要。\n\
  \n### GC 如何确定存活对象？\n\n要确定对象是否存活，`GC` 将检查以下信息：\n\n* 所有未由 `CLR` 或用户代码分配的对象句柄会被回收\n\
  * 被另一个对象引用的静态对象会被跟踪\n* `GC` 使用 `Stack Walker` 和 `JIT Stack`。\n\n### GC 何时被触发？\n\n\
  `GC` 的触发没有固定的时间。它在满足以下条件时被触发：\n\n* 当虚拟内存空间较低时\n* 当内存压缩超过某个阈值时。如果 `GC` 发现存活对象比例很高，它会增加分配\n\
  * 它也会通过专门地使用 `GC.Collect()` 方法被触发。这种情况很少见，因为 `GC` 始终处于激活状态并在需要时执行操作。\n\n### 什么是托管/非托管对象或资源？\n\
  \n简而言之：\n\n* 任何在 `CLR` 范围内创建、管理并运行的对象都是托管对象。如果它是不纯 .Net 代码、运行时管理的且在 `.NET` 范围内，它就是托管的。因此，`.NET`\
  \ 框架内的任何类都算托管对象。\n* 任何不受 `CLR` 管理的项目都是在 `.NET` 库外部创建的，不是托管对象。这些包括 `COM objects`、connect\
  \ objects、`interop objects` 以及所有的第三方库对象，即使它们在 `.NET` 框架内被引用。\n\n### 清理所有非托管资源\n\n\
  `GC` 无法清理非托管对象。在任务完成后显式移除它们是程序员的责任。非托管对象隐藏在操作系统资源周围，如数据库连接、文件流、`class handles`、`pointer`、注册表等。`GC`\
  \ 可以跟踪托管和非托管资源的生命周期，但移除非托管对象的责任在于程序员。\n\n```csharp\nclass MathExp {\n    public\
  \ static T Min<T>(params T[] items) { /* implementation */ }\n    public static\
  \ T Max<T>(params T[] items) { /* implementation */ }\n}\n\nclass testClass : IDisposable\
  \ {\n    public void Dispose() {\n        // implementation\n    }\n}\n\nclass Program\
  \ {\n    static void Main() {\n        using (testClass objClass = new testClass())\
  \ {\n            Console.WriteLine(01);\n        }\n        Console.WriteLine(02);\n\
  \    }\n}\n\nclass clsDisposeFin : IDisposable {\n    public void Dispose() {\n\
  \        // implementation\n    }\n}\n\n// Usage\n{\n    clsDisposeFin objClass\
  \ = new clsDisposeFin();\n    try {\n        // code\n    } finally {\n        if\
  \ (objClass != null)\n            ((IDisposable)objClass).Dispose();\n    }\n}\n\
  ```\n\n`MathExp` 类有两个泛型方法：`Min<T>` 和 `Max<T>`。这些方法的功能非常直观。`Min<T>` 查找并返回列表中的最小值。`Max<T>`\
  \ 查找并返回列表中的最大值。`<T>` 是任何数据类型的占位符，如 `int`、`strings`、`floats` 等。\n\n以下是这两种方法的示例：\n\
  \n```\nConsole.WriteLine (MathEx.Max<int> (63, 800, 700))\nConsole.WriteLine (MathEx.Max<string>\
  \ (“Almonds,” “Walnuts,” “Pistachios”))\n```\n\n我们的输出将是：\n\n800\nPistachios\n\n\
  在示例中，我们必须在 `<<>` 中指定列表中的数据类型。有趣的是，即使我们没有指定数据类型，C# 编译器仍然能够运行该方法，因为它可以找出列表中的数据类型是什么。这被称为类型接口（type\
  \ interfacing）。为了看到它的运行效果，我们需要再次尝试代码，如下：\n\n以下是这两种方法的示例：\n\n```\nConsole.WriteLine\
  \ (MathEx.Max(63, 800, 700))\nConsole.WriteLine (MathEx.Max(“Almonds,” “Walnuts,”\
  \ “Pistachios”))\n```\n\n我们的输出与之前相同：\n\n800\nPistachios\n\n即使我们没有在列表中指定数据类型，我们的输出也是一样的。这种方法唯一失败的情况是在一个列表中混合了不同的数据类型。例如，你不能在整数和浮点数的列表上运行它。\n\
