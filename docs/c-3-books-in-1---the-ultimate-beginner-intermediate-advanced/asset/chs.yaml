  **The value at position 1 is 37**\n\n### RemoveAt Function\n\n此方法将移除指定索引处的项。\n\n\
  此程序展示了如何使用 `RemoveAt` 方法。\n\n```csharp\nusing System;\nusing System.Collections;\n\
