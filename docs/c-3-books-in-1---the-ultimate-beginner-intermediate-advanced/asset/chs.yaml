  \nDoes the stack contain the element 800? True or False? True\n\n### Queue（队列）\n\
  \n`Queue` 集合先进先出的集合，与栈集合相反。以下是定义队列的语法：\n\n`Queue variablename=new Queue ():`\n\n\
  与之前一样，`variablename` 代表我们分配给 `Queue` 集合的任何变量。`Enqueue` 方法向队列添加一个元素。\n\n`Variablename.Enqueue\
  \ (element)`\n\n在上面的示例中，`element` 代表要添加到队列中的值。\n\n下面，我们将说明如何使用队列。\n\n这里有一个队列的应用示例。\n\
  \n```csharp\nusing System;\nusing System.Collections;\n\nnamespace Demo\n{\n   \
  \ class Program\n    {\n        // 主函数\n        static void Main(string[] args)\n\
  \        {\n            // 定义队列\n            Queue ar = new Queue();\n         \
  \   // 向队列中添加元素\n            ar.Enqueue(“apples”);\n            ar.Enqueue(“beans”);\n\
  \            ar.Enqueue(“carrots”);\n            Console.Read();\n        }\n  \
  \  }\n}\n```\n\n队列有很多可以对其执行的操作。下面我们将查看这些操作。\n\n### 队列操作 (Queue Operations)\n\n|\
  \ 功能 | 描述 |\n| :--- | :--- |\n| Count | 队列中元素的数量 |\n| Clear | 用于删除队列中的所有元素 |\n|\
  \ ToArray | 用于将元素存入数组 |\n| Dequeue | 用于从队列中移除元素（第一个元素） |\n| Contains | 用于查找队列是否包含特定元素\
  \ |\n\n### Count 属性\n\n获取队列中的元素数量至关重要。\n\n使用 `count` 属性\n\n```csharp\nusing System;\n\
  using System.Collections;\n\nnamespace Demo\n{\n    class Program\n    {\n     \
  \   // 主函数\n        static void Main(string[] args)\n        {\n            // 定义队列\n\
  \            Queue ar = new Queue();\n            // 向队列中添加元素\n            ar.Enqueue(1);\n\
  \            ar.Enqueue(2);\n            ar.Enqueue(3);\n            Console.WriteLine(\"\
  There are \" + ar.Count + “ elements in the queue.\");\n            Console.Read();\n\
  \        }\n    }\n}\n```\n\n这是我们预期在控制台中看到的的内容：\n\nThere are 3 elements in the queue.\n\
  \n#### DeQueue 函数\n\n这是一个 `dequeue` 的示例。\n\n使用 `DeQueue` 函数\n\n```csharp\nusing\
