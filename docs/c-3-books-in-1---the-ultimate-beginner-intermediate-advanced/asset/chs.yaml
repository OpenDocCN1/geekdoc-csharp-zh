  The value at index 0 is 22\nThe value at index 1 is 27\nThe value at index 2 is\
  \ 40\nThe value at index 0 is 40\nThe value at index 1 is **27**\nThe value at index\
  \ 2 is 22\n\n### Sort Function\n\n此方法对数组中的元素进行排序。\n\n下面的程序用于展示如何使用 `sort` 方法。\n\n\
  ```csharp\nusing System;\nusing System.Collections;\n\nnamespace Demo\n{\n    class\
  \ Program\n    {\n        // 主函数\n        static void Main(string[] args)\n    \
  \    {\n            // 定义 ArrayList\n            ArrayList ar = new ArrayList();\n\
