  ;\n        base.OnNavigatedTo(e);\n    }\n}\n```\n\n\n\n\n在软件开发领域，测试和调试是确保代码可靠性和稳定性的关键方面。单元测试允许我们孤立地验证代码中的单个单元，确保每个组件都能按预期工作。此外，调试是一项本质技能，可以帮助我们在代码行为不符合预期时识别并解决问题。在本章中，我们将使用\
  \ `xUnit` 探索单元测试的基础基础知识，`xUnit` 是一个流行的测试框架，它提供了一种稳健且高效的方法来编写单元测试。我们将学习如何创建测试用例、执行用例并解释结果，以确保我们的代码按预期运行。使用\
  \ Mock（模拟）是本章将涵盖的另一个核心概念。Mock 帮助我们模拟代码中某些组件或依赖项的行为，使我们能够关注被测试的单元。理解如何有效利用 Mock 对于编写全面且高效的单元测试至关重要。\n\
  \n最后，我们将讨论如何掌握调试。即使是最熟练的开发者也会经常遇到 bug。能够高效地识别、隔离并解决这些问题是优秀开发者脱颖而出的关键。我们将探索各种调试技术和工具，这些将使你成为一个更熟练的问题解决者。在本章结束时，你将获得编写健壮的单元测试、有效使用\
  \ Mock 以及自信应对调试过程所需的知识和技能。\n\n## 结构\n\n本章涵盖了以下主题：\n\n*   使用 `xUnit` 进行单元测试\n*  \
  \ Mock 的使用\n*   掌握调试\n*   应用 `xUnit` 和 Mock\n\n## 目标\n\n在本章中，我们将探索一段软件测试和调试的结构化旅程。探索单元测试的作用、`xUnit`\
  \ 框架以及编写高效测试。深入研究断言（assertions）、Mock 以及用于可扩展测试代码的高级技术。掌握调试基础、工具和最佳实践。将知识应用于真实场景。熟练掌握\
  \ `xUnit` 进行全面测试。精通调试，交付更高质量的软件。这一详尽的章节涵盖了从基础到高级策略的所有内容，确保你已准备好应对软件开发旅程中的任何测试或调试挑战。\n\
  \n## 使用 xUnit 进行单元测试\n\n*   在编写本书书时，`xUnit` 是 .NET 最常用的测试框架，它为开发者编写单元测试提供了一种简单且高效的方法。使用\
  \ `xUnit` 创建的单元测试旨在验证小段孤立的代码（例如类方法），无论执行单元测试多少次，都必须得到相同的结果。我们可以通过以下内容更好地了解使用 `xUnit`\
  \ 的单元测试及其主要功能：测试方法结构：`xUnit` 测试定义为测试类中的公共方法。这些方法根据命名约定识别为测试用例，其中方法名必须以 `Fact` 或\
  \ `Theory` 开始。`Fact_TestMethod1` 或 `Theory_TestMethod1` 是测试方法命名的示例。\n*   **断言（Assertions）**：`xUnit`\
  \ 拥有广泛的内置断言方法，使其更容易将你的预期结果与测试方法返回的真实结果进行验证。\n*   **Theory 和数据驱动测试**：`xUnit` 支持使用\
  \ `Theory` 特性进行数据驱动测试。这允许你使用不同的输入数据运行同一个测试方法，从而能够验证不同的场景。\n*   **测试固件（Test fixtures）**：你可以使用\
  \ `xUnit` 的测试固件，它们是在测试用例运行之前和/之后运行的代码块。这允许你在测试用例运行之前配置所需的依赖项，并在完成测试断言后清理使用的资源。\n\
  *   **测试集合（Test collections）**：`xUnit` 允许将相关的测试类分组到集合中。这在处理共享公共设置或需要按特定顺序运行测试时大有益。\n\
  *   **测试输出和日志（Test output and logging）**：`xUnit` 提供了捕捉和报告测试输出及日志的功能。这对于理解测试执行期间发生了什么很有用。\n\
  *   **并行测试执行（Parallel test execution）**：通过 `xUnit`，你可以并行运行不同的测试，提高测试执行速度，并在软件更改期间获得更快的输出。\n\
  *   **可扩展性（Extensibility）**：`xUnit` 设计为可扩展，允许你创建自定义测试运行器、报告器和其他扩展，以根据你的特定需求定制测试框架。\n\
  *   **测试发现与执行（Test discovery and execution）**：`xUnit` 使用反射自动发现并执行测试方法。测试发现定位测试程序集中的所有测试方法，测试执行则运行它们并报告结果。\n\
  *   **与持续集成（CI）集成**：`xUnit` 与 CI 工具集成良好，可以轻松地将自动化测试整合到你的开发流水线中。\n\n使用 `xUnit` 进行单元测试促进了测试驱动开发（TDD）方法，开发者在实现相应功能之前先编写测试。通过遵循这一实践，开发者可以确保他们的代码符合预期要求，并且更不容易产生\
  \ bug。`xUnit` 简洁直观的语法结合其强大的功能，使其成为希望为 .NET 应用创建可靠且可维护的单元测试开发者的绝佳选择。\n\n## 使用 Mock\n\
  \n在软件测试中，Mock 是在单元测试期间模拟真实依赖项（如外部服务、数据库或复杂组件）行为的对象。Mock 允许开发者隔离被测试的单元，并仅关注其行为，而无需涉及实际依赖项。以下是\
  \ Mock 在测试中如何使用的概述：\n\n*   **隔离依赖项（Isolating dependencies）**：在测试单元时，将其从依赖项中隔离出来是关重要的，以确保测试关注单元自身的逻辑。Mock\
  \ 充当这些依赖项的替代品，提供模拟真实依赖项行为的可控响应，而无需实际使用它们。\n*   **移除外部依赖项（Removing external dependencies）**：在单元测试中使用真实的依赖项（特别是外部服务或数据库）可能会导致测试缓慢、不可靠且难以控制。通过用\
  \ Mock 替换这些依赖项，测试将变得更快、具有确定性且不受外部因素影响。\n*   **可控行为（Controlled behavior）**：Mock 被配置为对特定输入提供预测响应，允许开发者控制被模拟依赖项的行为。这确保了被测试单元暴露在各种场景中，从而实现全面的覆盖。\n\
  *   **消除副作用（Eliminating side effects）**：某些依赖项在测试期间可能会产生不必要的副作用，例如发送实际电子邮件或写入真实数据库。Mock\
  \ 防止了这些副作用的发生，使测试更具预测性和可重复性。\n*   **测试驱动开发（Test-driven development）**：Mock 常用于 TDD\
  \ 实践，开发者在实现实际功能之前编写测试。通过使用 Mock，开发者可以为尚未开发的组件创建测试，从而增量地构建系统。\n*   **集成测试与单元测试（Integration\
  \ testing vs. unit testing）**：在集成测试中，通常使用真实的依赖项来验证不同组件之间的交互。但在单元测试中，倾向于使用 Mock 以关注单个孤立单元。\n\
  *   **Mock 框架（Mocking frameworks）**：为了方便创建和管理 Mock，开发者通常使用 Mock 框架，如用于 C# 的 `Moq`、用于\
  \ Java 的 `Mockito` 或用于 JavaScript 的 `Sinon`。这些框架提供了定义 Mock 行为并验证测试期间如何使用 Mock 的\
  \ API。\n\n\n\n\n- **验证调用**：除了设置行为外，mock（模拟对象）还可以用于验证某些方法是否被带有特定参数调用。这允许开发者确保被测试的单元与其依赖项正确交互。\n\
  - **测试代码简单性**：通过提供受控的响应并避免复杂的设置，mock 简化了测试代码，使其更易阅读、编写和维护。\n- **mock 的局限性**：虽然 mock\
  \ 是单元测试的强大工具，但它们确实存在局限性。过度使用 mock 会导致测试变得脆弱，并与实现细节紧密耦合，从而随着代码的演进而降低测试的有效性。\n\n使用得当，mock\
  \ 可以通过隔离单元、加快测试速度以及为依赖项提供受控行为来增强单元测试的有效性。通过在真实的单元测试中结合 mock，开发者可以实现全面的测试策略，从而提高软件的质量和稳定性。\n\
  \n# 精通调试\n\n调试是识别、分析和解决软件代码中问题或错误的过程。对于软件开发人员来说，确保应用程序的可靠性、正确性和性能是一项至关重要的技能。调试涉及系统地调查意外行为或错误的来源并寻找解决方案。调试过程概述如下：\n\
  \n* **识别问题**：调试的第一步是识别存在的问题。这可能是通过用户报告的问题、意外行为或失败的用例发现的。理解症状对于有效调试非常重要。\n* **重现问题**：一旦识别出问题，开发者需要一致地重现问题。这涉及识别触发\
  \ bug 的步骤或条件并在受控环境中复制，以验证可能的修复方案。\n* **检查代码**：问题可以重现后，开发者检查相关代码，寻找逻辑错误或意外后果。\n*\
  \ **使用调试工具**：调试通常通过使用集成开发环境 (IDE) 或特定语言的调试器来实现。这些工具允许开发者设置断点、检查变量值、逐步执行代码并观察运行状态。\n\
  * **设置断点**：断点是代码中的标记，用于在特定点暂停执行。当程序到达断点时，开发者可以检查变量的状态和调用栈，帮助理解程序的流程。\n* **逐步执行代码**：调试器允许开发者逐行执行代码，进入（step\
  \ into）或跳过（step over）函数调用。这有助于观察代码的行为并识别问题所在。\n* **检查变量**：在调试期间，开发者可以检查运行时的变量值，以识别可能导致问题的错误或数据。\n\
  * **修复问题**：一旦确定了问题的根源，开发者就可以实施。这可能涉及修正逻辑错误、调整算法或修复实现错误。\n* **回归测试**：修复完成后，开发者运行回归测试以确保更改没有引入新问题且原始问题已解决。\n\
  * **持续改进**：调试是一个迭代过程，开发者不断提高自己的调试技巧。他们从之前的调试经验中学习，并编写更健壮的代码以减少未来的问题。\n\n调试是软件开发生命周期中不可或的一部分，需要技术技能、分析思维和对细节的关注。有效的调试可以提高软件质量、减少维护工作并提高客户满意度。这是开发者不断完善和利用以创建可靠韧性系统的技能。\n\
  \n# 应用 xUnit 和 mock\n\n在这个实践示例中，我们将在《Visual Studio 2022 简介》创建的项目实现 xUnit 和 mock：\n\
  \n1. 让我们如图所示向解决方案添加 xUnit 项目：\n\n![](img/Figure_14.1.png)\n\n图 14.1：Visual Studio\
  \ xUnit 模板项目\n\n2. 现在向项目添加以下 NuGet 包：\n\n[`www.nuget.org/packages/Moq`](https://www.nuget.org/packages/Moq)\n\
  \n此外，原始项目中添加了如下接口：\n\n```csharp\npublic interface ICalculate\n{\n    int Sum();\n\
  }\n```\n\n我们的 `Calculate` 类更新为继承该接口，如下：\n\n```csharp\npublic class Calculate : ICalculate\n\
  {\n    public Calculate(int numberA, int numberB)\n    {\n        this.NumberA =\
  \ numberA;\n        this.NumberB = numberB;\n    }\n\n    private int NumberA {\
  \ get; set; }\n    private int NumberB { get; set; }\n\n    public int Sum() { return\
  \ NumberA + NumberB; }\n}\n```\n\n使用 xUnit 的单元测试如下：第一个单元测试是普通测试，我们创建了 `Calculate`\
  \ 类的实例。第二个使用 mock 模拟接口并设置预期输出。我们还使用了 `InlineData` 属性。单元测试类代码如下：\n\n```csharp\npublic\
  \ class UnitTest1\n{\n    [Fact]\n    public void Test()\n    {\n        //arrange\n\
  \        Calculate calculate = null;\n\n        //act\n        calculate = new Calculate(2,\
  \ 5);\n        var result = calculate.Sum();\n\n        //assert\n        Assert.Equal(7,\
  \ result);\n    }\n\n    [Theory]\n    [InlineData(1, 8)]\n    [InlineData(5, 2)]\n\
  \    public void Test2(int a, int b)\n    {\n        //arrange\n        Mock<ICalculate>\
  \ calculate = new Mock<ICalculate>();\n        calculate.Setup(x => x.Sum()).Returns(a\
  \ + b);\n\n        //act\n        var result = calculate.Object.Sum();\n\n     \
  \   //assert\n        Assert.Equal(a + b, result);\n    }\n}\n```\n\n3. 如果我们运行单元测试，将成功输出了以下图形：\n\
  \n![](img/Figure_14.2.png)\n\n图 14.2：Visual Studio 测试资源管理器窗口\n\n你也可以调试你的单元测试方法。在\
  \ Visual Studio 上，相应的快捷键是 `Ctrl R + T`。你可以如图所示看到正在调试的单元测试：\n\n![](img/Figure_14.3.png)\n\
  \n图 14.3：单元测试方法已调试\n\n# 总结\n\n我们希望这次在测试和调试世界的旅程让你感到既有启发性又有实用性。使用 xUnit 进行单元测试赋予了你编写自动化测试的能力，以验证代码中单个单元的正确性。你现在理解了测试在软件开发生命周期中的重要性，并拥有构建测试套件的工具，对代码库充满信心。\n\
  \n使用 mock 的知识扩展了你的测试视野，使你在编写单元测试时能够隔离组件和依赖。这种技术使你能够创建更专注、更高效的测试，以适应不同的场景。\n\n\n\n\
  \n随着你在软件开发征程中不断前行，请始终记住，可靠的代码是卓越软件产品的骨干。将测试和调试视为开发工作流中不可或缺的一部分，它们将成为你成功的支柱。\n\n\
