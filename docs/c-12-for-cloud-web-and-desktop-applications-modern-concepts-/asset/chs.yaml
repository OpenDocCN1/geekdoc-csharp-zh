  \ Hub 为输出。\n\n在此示例中，我们配置了 Event Hub 在存储账户中注册捕获（capture）：\n![](img/Figure_4.11..png)\n\
  \n图 4.11：Event Hub 捕获设置概述。\n\n在成功设置两个输出绑定后，你的 Azure Function 应该类似于下面的结构，如 图 4.12\
  \ 所示：\n\n\n图 4.12：添加两个输出后的 Azure Function 流。\n\n是时候更新我们的代码，以便我们可以创建 Blob 并发布事件了。以下是你的\
