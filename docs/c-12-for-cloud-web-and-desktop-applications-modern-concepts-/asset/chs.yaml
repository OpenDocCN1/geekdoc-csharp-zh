  \n表 8.1：热重载支持\n\n在 `C#` 中编写代码时，我们可以利用热重载功能进行更改并体验 `.NET` 热重载的优势。这种体验由“继续编辑”机制实现，该机制扩展了支持编辑的范围，超越了以往版本的\
  \ `Visual Studio`。改进包括：\n\n- 添加、更新或删除自定义属性（Custom Attributes）\n- 添加或更新 Record 结构体\n\
  - 添加或更新 `#line` 指令\n- 编辑 Switch 表达式\n- 编辑带有 `#line` 指令的文件，包括指令本身的更改\n- 编辑顶级语句\n\
  - 编辑使用任何 C# 10 特性的代码，例如全局使用指令、文件范围命名空间、改进的 lambda 以及无参数结构构造函数\n- 重命名 Lambda 参数\n\
  - 重命名方法的参数\n\n# 不支持的情况\n\n虽然热重载为开发过程中动态更新代码提供了方便高效的方法，但重要的是，某些场景不支持热重载。这些不支持的情况可能是由于代码更改的性质、特定的运行时条件或开发环境的限制。开发者了解这些情况对于确保顺畅有效的编码体验至关重要。通过理解热重载的局限性，开发者可以在需要时做出明智决策并利用替代方案。\n\
  \n- iOS 和 Android 场景下的 Xamarin.Forms，对 UWP 应用的部分支持。\n- 如果 `Visual Studio` 中禁用了“继续编辑”设置。\n\
  - 如果调试配置中的 `PublishTrimmed` 设置为 `True`。\n- 如果调试配置中的 `PublishReadyToRun` 设置为 `True`。\n\
  - 在 `LaunchSettings.json` 文件中未设置 `nativeDebugging` 属性或设置为 `true` 的 WinUI 3 应用程序。\n\
  \n# 配置热重载\n\n为你的开发环境设置热重载是一个简单且快速的过程。只需几个简单的步骤，你就可以启用热重载，并开始在编码工作流中利用其优势。热重载与流行的开发工具和框架无缝集成，可以轻松整合到现有设置中。通过遵循简单的设置说明，你将能够快速利用快速高效的热重载功能，增强你的开发体验并加速代码迭代。\n\
  \n\n\n\n\n要启用并配置热重载，请前往 `Tools | Options | Debbuging | .NET/C++ hot reload`，参考下图：\n\
  \n![](img/Figure_8.1..png)\n\n图 8.1：热重载配置窗口。\n\n如前所述，启用热重载的过程非常简单。热重载的设置包括：\n\n\
  * 在调试时启用热重载和“编辑并继续”。\n    * 此设置允许在附加调试器的情况下启动应用程序（`F5`）时启用热重载，允许在调试过程中即时更新代码。\n\
  * 在不调试的情况下启动时启用热重载。\n    * 此设置允许不附加调试器的情况下启动应用程序（`Ctrl+F5`）时启用热重载，即使在未活动调试状态下也能实时更新代码。\n\
  * 在保存文件时应用热重载。\n    * 此设置会在您保存文件时自动应用任何代码更改，确保更新立即生效。\n\n## 安全性\n\nBlazor Server\
  \ 和 Blazor WebAssembly 应用在安全考量上有所不同。在运行在服务器端的 `Blazor Server` 应用中，授权检查有能力确定用户可用的\
  \ UI 选项（例如菜单项），以及不同应用区域和组件的访问规则。\n\n相反，`Blazor WebAssembly` 应用运行在客户端，授权主要用于确定显示哪些\
  \ UI 选项。由于客户端检查可以被用户修改或绕过，`Blazor WebAssembly` 应用无法强制执行授权访问规则。\n\n在 `Razor Pages`\
  \ 的授权规范方面，它们并不直接适用于可路由的 `Razor components`。然而，如果一个不可路由的 `Razor component` 被嵌入到 `Razor\
  \ Pages` 应用的页面中，则该页面的授权规范将间接影响该 Razor 组件以及页面的其他内容。\n\n`ASP.NET Core Identity` 是为\
  \ HTTP 请求和响应通信设计的，与 `Blazor 应用客户端-服务器通信模型` 并不完美契合。因此，建议利用 `ASP.NET Core Identity`\
  \ 进行用户管理的 `ASP.NET Core` 应用应选择 `Razor Pages` 而不是 `Razor components` 来处理身份验证相关的 UI\
  \ 任务（如用户注册、登录、注销和用户管理）。虽然在某些场景下可以构建直接处理身份任务的 `Razor components`，但微软并不认可或提供对这种方法的支持。\n\
  \n需要注意的是，`ASP.NET Core` 抽象（如 `SignInManager<TUser>` 和 `UserManager<TUser>`）在 `Razor\
  \ components` 中不受支持。关于在 `Blazor` 中使用 `ASP.NET Core Identity` 的详细指南，你可以通过以下链接参考“[将\
  \ ASP.NET Core Identity 骨架到 Blazor Server 应用](https://learn.microsoft.com/en-us/aspnet/core/security/authentication/scaffold-identity)](https://learn.microsoft.com/en-us/aspnet/core/security/authentication/scaffold-identity)。\n\
  \n考虑这些安全因素并遵循推荐实践，将有助于确保在 Blazor 应用中有效实现授权和身份验证机制。\n\n`Blazor` 利用 `ASP.NET Core`\
  \ 中已有的身份验证机制来验证用户身份。所采用的具体机制取决于 `Blazor 应用` 的托管模型，是 `Blazor Server` 还是 `Blazor WebAssembly`。\n\
  \n### Blazor server 验证\n\n`Blazor Server` 通过与客户端的 `SignalR` 连接运行基于 `SignalR` 的应用身份验证在连接建立时处理。身份验证可以基于\
  \ Cookie 或或其他令牌令牌（bearer token），但身份验证完全通过 `SignalR hub` 在电路（circuit）内部管理。\n\n`Blazor\
  \ Server` 应用内置的 `AuthenticationStateProvider` 服务从 `ASP.NET Core` 的 `HttpContext.User`\
  \ 获取身份验证状态数据。这就是身份验证状态与现有 `ASP.NET Core` 身份验证机制集成的方式。\n\n### Blazor WebAssembly\
  \ 验证\n\n在 `Blazor WebAssembly` 中，重要的是承认身份验证检查可能会被绕过，因为所有客户端代码都可以被用户访问和修改。这一特性不仅适用于\
  \ `Blazor WebAssembly`，也适用于其他客户端应用技术，包括 JavaScript 单页应用（SPA）框架和跨操作系统的原生应用。开发者在 `Blazor\
  \ WebAssembly` 应用中实现身份验证机制时，应意识到这种固有本质。\n\n为了处理 `Blazor WebAssembly` 中的身份验证，我们必须使用内置或自定义的\
  \ `AuthenticationStateProvider` 服务。`AuthenticationStateProvider` 作为 `AuthorizeView`\
  \ 组件和 `CascadingAuthenticationState` 组件用于检索用户身份验证状态的底层服务。\n\n通常，你不会直接与 `AuthenticationStateProvider`\
  \ 交互。相反，建议使用 `AuthorizeView` 组件或 `Task<AuthenticationState>`。使用这些方法的优点是它们能够自动处理底层身份验证状态数据更改的通知。\n\
  \n直接使用 `AuthenticationStateProvider` 有一个缺点，当身份验证状态数据发生变化时，组件不会收到自动通知。因此，通常倾向于使用提供的高级组件或方法，来实现无缝且可靠的身份验证状态管理。\n\
  \n## 授权\n\n授权验证在用户成功身份验证后立即开始；如果用户无法身份验证，则不需要授权验证。授权是根据已验证的用户身份和分配的权限，控制对 `Blazor\
  \ 应用` 内特定组件、页面或操作的访问的过程。它涉及实施安全措施（如身份验证以验证用户身份）以及授权（确定用户是否拥有执行某些操作或查看特定内容的必要权限）。\n\
  \n`Blazor` 提供了内置的授权功能，包括 `AuthorizeView` 组件和 `Authorize` 特性，它们允许开发者轻松地应用授权规则并根据角色或策略限制访问。通过利用这些功能，开发者可以确保只有授权用户才能操作\
  \ `Blazor 应用` 中的敏感功能或查看机密信息，确保只有具有相应角色、声明或满足策略的已验证用户才能访问受限的功能。\n\n### AuthorizeView\
  \ 组件\n\n`Blazor` 中的 `AuthorizeView` 组件提供了根据用户的授权状态选择性显示或隐藏 UI 内容的功能。当不需要在过程逻辑中使用用户身份即可显示特定数据时，此功能非常有用。\n\
  \n通过在 `Razor 页面`中使用 `AuthorizeView` 组件，开发者可以访问类型为 `AuthenticationState` 的上下文变量（Razor\
  \ 语法中的 `@context`），该变量提供了有关当前登录用户的关键信息。\n\n### Authorize 特性\n\n在 `Razor components`\
  \ 中，你可以使用 `[Authorize]` 特性进行授权。该特性支持基于角色和基于策略的授权。要实现基于角色的授权，可以指定 `Roles` 参数，而 `Policy`\
  \ 参数则用于基于策略的授权。\n\n\n\n\n\n如果未指定角色或策略，`[Authorize]` 属性将应用默认策略，即已身份验证的用户被授权，而未身份验证的用户未被授权。在用户未获得授权且应用未使用\
  \ `Router` 组件自定义未授权内容的情况下，框架会自动显示回退消息“Not Authorized（未授权）”。\n\n## 数据绑定\n\nRazor\
  \ 组件通过使用 `@bind` Razor 指令属性提供了简便的数据绑定功能，该属性可以应用于字段、属性或 Razor 表达式。需要注意的是，UI 是在组件渲染时更新的，而不是在修改字段或属性值时立即更新。通常，字段和属性的更新会在事件处理程序代码执行后反映在\
  \ UI 上，因为组件会在事件触发后进行重新渲染。\n\n要将属性或字段绑定到其他文档对象模型 (DOM) 事件，可以包含 `@bind:event=\"{EVENT}\"\
  ` 属性，并将 `{EVENT}` 替换为所需的 DOM 事件。此外，您可以使用 `@bind:after=\"{EVENT}\"` 属性并配合 DOM 事件占位符，在绑定过程后执行异步逻辑。值得提到，分配的\
  \ C# 方法仅在绑定值被同步赋值时才会执行。\n\n对于双向数据绑定，组件支持定义一对参数：`@bind:get` 和 `@bind:set`。`@bind:get`\
  \ 指定要绑定的值，而 `@bind:set` 定义了处理值变化的回调。需要注意的是，`@bind:get` 和 `@bind:set` 修饰符应该始终一起使用。\n\
  \n请注意，使用事件回调参数配合 `@set`（例如 `[Parameter] public EventCallback<string> ValueChanged\
  \ { get; set; }`）是不支持的。相反，建议将一个返回 `Action` 或 `Task` 的方法传递给 `@bind:set`。\n\n最后，必须记住\
  \ Razor 属性绑定是区分大小写的。有效的属性包括 `@bind`、`@bind:event` 和 `@bind:after`。任何带有大写字母的变体，例如\
  \ `@Bind/@bind:Event/@bind:aftEr` 或 `@BIND/@BIND:EVENT/@BIND:AFTER` 都被视为无效。\n\n\
  ## 双向数据绑定\n\n除非使用 `@bind` 语法，Blazor 不会自动同步文档对象模型（DOM）元素与 .NET 变量之间的值。这是因为 Blazor\
  \ 无法感知在事件处理程序中修改 .NET 变量值的意图。在之前的 Blazor 版本中，双向数据绑定是通过将元素绑定到属性，并通过其设置器（setter）控制属性值来实现的。\n\
  \n为了在 Blazor 中实现有效的双向数据绑定，建议使用 `@bind:get` 和 `@bind:set` 修饰符代替事件处理程序。仅通过事件处理程序无法实现双向数据绑定。通过利用\
  \ `@bind:get` 和 `@bind:set` 修饰符，您可以无缝地建立双向绑定。\n\n通过使用 `@bind:get` 和 `@bind:set`\
  \ 修饰符，您不仅可以通过 `@bind:set` 管理 .NET 变量的底层值，还可以通过 `@bind:get` 将 .NET 变量的值绑定到元素的值。这种综合方法确保了您的\
  \ Blazor 应用中有效的双向数据绑定。\n\n## 链式数据绑定\n\n在需要将子组件的属性绑定到其父组件属性的场景下，常见的做法是建立链式绑定。这涉及多个级别的同步绑定。要实现这一点，您可以在父组件的参数中使用\
  \ `@bind-{PROPERTY}` 语法。只需将 `{PROPERTY}` 占位符替换为想要绑定的属性名称即可。\n\n然而，需要注意的是，链式绑定无法在子组件内部直接使用\
  \ `@bind` 语法实现。相反，您需要定义一个事件处理程序和一个单独的值，以便从子组件更新父组件的属性。\n\n尽管如此，父组件仍然可以使用 `@bind`\
  \ 语法与子组件建立数据绑定。\n\n按照命名规范，与参数关联的 `EventCallback<TValue>` 应该使用组件参数名称加上 \"Changed\"\
  \ 后缀进行命名。命名规范遵循 `{PARAMETER NAME}Changed` 语法，其中 `{PARAMETER NAME}` 代表实际的参数名称。\n\n\
  要触发与绑定关联的委托并通知更改，可以使用 `EventCallback.InvokeAsync`，它会使用提供的参数调用委托，并为更新后的属性派发事件通知。\n\
  \n## Blazor vs Razor\n\n将 Blazor 与 Razor 进行比较，类似于 Java 与 JavaScript 的比较，尽管它们在命名上有相似之处，但它们是完全不同的。\n\
  \nBlazor 是一个强大的框架，它将 Razor 组件的灵活性与直接在浏览器中运行 C# 代码以及利用 Razor 视图引擎的能力结合在一起。与主要侧重于基于服务器的架构和服务器端模板的\
  \ Razor 不同，Blazor 通过允许使用 C# 而不是 JavaScript 启用客户端逻辑来扩展功能。\n\nRazor 组件是任何 Blazor 应用的基础构建块，将标记和代码组合成内聚的单元。这些组件以\
  \ `.razor` 扩展名实现，允许开发者使用 Razor 语法创建动态用户界面。通过 Blazor 客户端托管模型，您可以在客户端充分利用 Razor 组件的所有潜力。\n\
  \n## 最佳实践\n\nBlazor 开发的最佳方法是遵循某些推荐的实践，以确保应用程序高效、可维护且高质量。这些最佳实践涵盖了 Blazor 开发的各个方面，包括代码组织、性能优化、安全性和用户体验。通过遵循这些最佳实践，开发者可以增强\
  \ Blazor 应用的可靠性、可扩展性和整体成功率。以下列出了最佳实践并按类别分组：\n\n### Blazor Server\n\n#### 避免使用 `IHttpContextAccessor`\
  \ 或 `HttpContext`。\n\n- 在 `IHttpContextAccessor` 中无法保证 `HttpContext` 的存在，即使可以访问\
  \ `HttpContext`，它也不一定持有启动 Blazor 应用的上下文。\n- 要将请求状态传递给 Blazor 应用，推荐的方法是在初始渲染期间使用根组件参数。这允许无缝集成并方便访问所需数据。或者，应用程序也可以在根组件的初始化周期事件期间将相关数据复制到作用域服务中。这确保了数据在整个应用程序中的可用性及一致性。\n\
  \n#### 避免使用单例服务共享状态\n\n- 在 Blazor 应用中传递请求状态时必须非常小心，因为可能会引入安全漏洞。例如，在 Blazor Server\
  \ 应用中，多个应用会话在同一个服务器进程中共存，存在跨电路（circuit）泄漏用户状态的风险。由于 Blazor Server 应用位于服务器内存中。\n\
  - 如果设计得当，可以在 Blazor 应用中使用状态化单例服务。通过遵循特定的设计考虑，这些服务可以有效地跨请求维护其状态并提供一致的功能。\n\n####\
  \ authorize 属性\n\n- 建议仅将该属性应用于通过 Blazor Router 访问的 `@page` 组件。\n\n\n\n\n\n要控制页面内特定部分的授权，应该使用\
  \ `AuthorizeView` 组件。通过遵循这一实践，开发者可以有效地在 Blazor 应用程序中管理并执行授权规则。\n\n## 双向绑定\n\n- 在对具有\
  \ get/set 访问器的属性实现双向绑定时，必须丢弃 `EventCallback.InvokeAsync` 返回的 `Task`。\n- 为了实现有效的双向数据绑定，强烈建议使用\
  \ `@bind:get` 和 `@bind:set` 饰符。\n\n## 实际案例研究\n\n在这个实际案例研究中，我们将深入探讨 Blazor Server\
  \ App 开发的世界。我们将涵盖关键主题，如创建 Blazor Server App 项目、利用热重载（hot reload）功能实现无缝代码更新、实现授权和身份验证，以及掌握数据绑定。\n\
  \n我们将从创建一个 Blazor Server App 项目开始，理解它的结构和配置。然后，我们将探索热重载功能，它允许在开发期间即时更新代码，使开发过程更快、更高效。\n\
  \n接下来，我们将深入 Blazor Server App 中的授权和身份验证。我们将探索如何建立用户身份、强制基于角色的访问以及验证用户声明（claims），以确保应用程序的安全。\n\
  \n最后，我们将揭示 Blazor Server 数据绑定的力量。我们将学习如何在数据和用户界面之间建立动态连接，实现自动更新和同步。\n\n加入我们这个实际案例研究，获得使用\
  \ Blazor Server 创建健壮且交互式 Web 应用程序的经验和最佳实践。\n\n## 创建 Blazor Server App 项目\n\n在本节中，我们将探索创建\
  \ Blazor Server App 项目的过程。我们将介绍设置 Blazor Server 应用程序所需的步骤，包括创建项目、理解项目结构以及配置基本设置。在本节结束时，你将为开始\
  \ Blazor Server 开发之旅奠下坚实的基础。让我们一起开始使用 Blazor Server 构建强大的 Web 应用程序吧！\n\n第一步是添加一个类型为\
  \ Blazor Server App 的项目，如图所示：\n\n![](img/Figure_8.2..png)\n\n图 8.2：创建一个类型为 Blazor\
  \ Server App 的新项目\n\n我们将项目命名为 `SampleBlazorApp`，因为 Visual Studio 创建了所有这些文件。\n\n\
