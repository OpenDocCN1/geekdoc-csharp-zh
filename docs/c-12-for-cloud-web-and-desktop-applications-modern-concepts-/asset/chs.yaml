  \n# 第 7 章使用 Azure Key Vault 保护应用程序\n\n## 引言\n\n在当今互互通的世界里，应用程序和敏感数据的安全至关重要。随着网络威胁和数据泄露的增加，采取稳健的安全措施来保护我们的贵资产已变得必不可少。`Azure\
  \ Key Vault` 是微软 Azure 提供的一项强大的云端服务，允许您保护应用程序所使用的加密密钥、机密和证书。\n\n在本章中，我们将讨论如何使用 `Azure\
  \ Key Vault` 保护您的应用程序。我们将从 `Azure Key Vault` 的概述开始，探索其功能和优势。您将全面理解为什么 `Azure Key\
  \ Vault` 是您应用程序安全策略中的关键组成部分。\n\n身份验证是任何安全系统的重要方面，`Azure Key Vault` 提供了多种身份验证机制以确保只有授权的才能访问。我们将详细探索这些身份验证选项，讨论如何有效地配置和管理它们。\n\
  \n访问策略（Access policies）在控制谁可以在 `Azure Key Vault` 资源上执行什么操作方面起着重要作用。我们将深入研究访问策略的复杂性，学习如何定义细粒度权限并管理它们以维持强大的安全态。\n\
  \n为了提供实践视角，我们将展示一个案例研究，演示如何在真实场景中逐步实施 `Azure Key Vault`。您将见证如何创建 `Azure Key Vault`、定义和管理访问策略，并利用其功能有效地保护您的应用程序。\n\
  \n最后，我们将展示一个如何通过 `.NET` 控制台应用程序访问存储在 `Azure Key Vault` 中的密钥示例。您将学习如何将应用程序与 `Azure\
  \ Key Vault` 集成，确保密钥的安全检索和利用。\n\n在本章结束时，您将获得使用 `Azure Key Vault` 保护应用程序所需的知识和技能。您将具备保护加密密钥、机密和证书的工具，使您能够构建稳健安全的应用程序以保护您的敏感数据。因此，让我们开启这段之旅，使用\
  \ `Azure Key Vault` 加固您的应用程序并防御潜在的安全威胁。\n\n## 结构\n\n本章涵盖了以下主题：\n\n*   Azure Key\
  \ Vault 概述\n*   Azure Key Vault 身份验证\n*   Azure Key Vault 访问策略\n*   案例研究\n    *\
  \   创建 Azure Key Vault\n    *   管理 Key Vault 访问策略\n    *   通过 .Net Web 应用程序访问密钥\n\
  \n## 目标\n\n本章使您对 `Azure Key Vault` 的核心概念有坚实的理解，强调其在保护应用程序方面的关键作用。导航 `Azure Key Vault`\
  \ 内的多种身份验证机制，优化配置以提高效率。掌握访问策略以定义细粒度权限，并遵循案例研究在真实场景中进行实施。将 `.NET` 控制台应用程序与 `Azure\
  \ Key Vault` 无缝集成以安全访问密钥。本章赋予您实用的技能和最佳实践，以加固您的应用程序，增强编写韧性安全策略的信心。应用这些见解通过 `Azure\
  \ Key Vault` 增强您的应用程序的安全性。\n\n## Azure Key Vault 概述\n\n`Azure Key Vault` 是微软 Azure\
  \ 提供的一项云端密钥库服务，允许您保护项目中的敏感数据，如连接字符串、证书和加密密钥。通过 Key Vault，您可以在不同应用程序之间共享相同的敏感信息，而这些信息对任何开发人员可见。\n\
  \nKey Vault 的主要功能和优势如下：\n\n*   集中密钥管理：`Azure Key Vault` 提供将您的密钥、机密和证书存储在集中位置，便于不同的应用程序访问相同的敏感信息。\n\
  *   安全存储：`Key Vault` 确保您的密钥、机密和证书是安全的，不会被未经许可的人访问。\n*   密钥生命周期管理：`Key Vault` 允许您生成、导入、轮换和删除密钥，使维护更加更加。\n\
  *   机密管理：应用程序连接字符串、API 密钥和密码被视为机密，您可以将其存储在 `Azure Key Vault` 中以便于其管理和安全。\n\n\n\n\
  \n- **访问控制**：Key Vault 通过访问策略提供访问控制。你可以为不同的用户、应用程序或组设置访问策略，通过特定的策略来管理对密钥、密码和证书的访问。访问控制遵循最小权限原则，有助于限制对敏感数据的访问。\n\
  \n- **审计与监控**：Key Vault 记录了在密钥、密码和证书上执行的所有交互和操作。这允许你监控和跟踪访问情况，确保合规性，并为安全事件提供审计轨迹。\n\
  \n- **与 Azure 服务集成**：Azure Key Vault 与其他 Azure 服务（如 `Azure Functions`、`Azure App\
  \ Service` 和 `Azure Virtual Machines`）集成了无缝衔接。这允许你可以在应用程序中安全地检索和使用密钥与密码，而不会将它们暴露在代码中。\n\
  \n- **对开发者友好的 API**：Key Vault 为各种编程语言提供了 `REST APIs`、`Azure SDKs` 和客户端库，使开发者能够轻松地在应用程序中与其进行交互并利用其功能。\n\
  \n通过利用 `Azure Key Vault`，你可以通过保护敏感信息、简化密钥管理以及实施严格的访问控制策略来增强应用程序的安全性。它为保护加密密钥、密码和证书提供了稳健且可扩展的解决方案，使你能够在\
  \ Azure 生态系统中构建安全可靠的应用程序。\n\n## Azure Key Vault 身份验证\n\nAzure Key Vault 提供了多种身份验证机制，以确保对存储的密钥、密码和证书的安全访问。这些身份验证方法为尝试访问\
  \ Azure Key Vault 的用户或应用程序提供了不同的验证和授权选项。以下是一些可用的关键身份验证机制：\n\n### Azure Active Directory\
  \ (Azure AD) 身份验证\n- `Azure AD` 身份验证是验证用户和应用程序访问 `Azure Key Vault` 的推荐方法。- 它利用 `Azure\
  \ AD` 标识和访问令牌授予对 Key Vault 资源的访问。\n- 用户或应用程序使用其 `Azure AD` 凭据进行身份验证`Azure Key Vault`\
  \ 使用 `Azure AD` 令牌验证其身份。\n- 此身份验证方法允许细粒度的访问控制，并支持基于角色的访问控制 (`RBAC`)。\n\n### 共享访问签名\
  \ (SAS) 身份验证\n- `SAS` 身份验证允许客户端直接与 Azure Key Vault 进行身份验证，而不依赖 `Azure AD`。\n- 它涉及生成具有特定权限和有效期的\
  \ `SAS` 令牌。\n- `SAS` 令牌被附加到 Key Vault URL 中，允许客户端进行身份验证并执行授权操作。\n- 此身份验证方法适用于无法或不希望直接与\
  \ `Azure AD` 进行身份验证的场景。\n\n### 托管标识身份验证\n- `Azure Key Vault` 支持 `Azure Managed Identity`，这消除了管理和存储凭据的需要。\n\
  - `Managed Identity` 允许部署在 Azure 服务上的应用程序（例如 `Azure Virtual Machines`、`Azure App\
  \ Service`）获取标识。\n- 应用程序的标识随后被用于向 `Azure Key Vault` 进行身份验证，并可以根据应用程序的标识授予访问权限。\n\
  \n### 服务主体身份验证\n- `Service principal` 身份验证允许应用程序使用 `service principal`（一种非人类标识）进行身份验证。\n\
  - `service principal` 代表应用程序，并被分配了访问 Key Vault 资源的特定权限。\n- 此身份验证方法通常用于应用程序或服务需要在没有用户交互的情况下进行程序化验证的场景。\n\
  \n### 证书身份验证\n- `Certificate` 身份验证涉及使用 `X.509` 证书来验证应用程序或用户。\n- 证书与 `Azure AD` 应用程序或用户关联，私钥被用于身份验证。\n\
  - 此方法适用于需要强客户端身份验证的场景。\n\n通过提供这些身份验证机制，`Azure Key Vault` 为访问存储的密钥、密码和证书提供了灵活性选项。你可以根据应用程序的需求、安全需求以及与\
  \ Key Vault 资源交互的客户端类型选择合适的身份验证方法。\n\n## Azure Key Vault 访问策略\n\nAzure Key Vault\
  \ 访问策略是控制和管理 Key Vault 资源访问不可组成部分。访问策略定义了授予用户、应用程序或安全主体的权限，允许他们对 Key Vault 中存储的密钥、密码和证书执行特定操作。以下是\
  \ `Azure Key Vault` 访问策略的关键方面：\n\n### 权限与操作\n- 访问策略决定了可以在 Key Vault 资源上执行的操作，例如读取、写入、删除和管理密钥、密码及证书。\n\
  - 权限可以在细粒度上授予，实现细粒度的访问控制。\n- 常见的权限包括 `get`、`list`、`set`、`update`、`delete`、`backup`、`restore`\
  \ 等。\n\n### 基于角色的访问控制 (RBAC)\n- `Azure Key Vault` 利用 `Azure RBAC` 来分配访问策略。\n- `RBAC`\
  \ 允许你向用户、组或应用程序分配角色，从而决定他们在 Key Vault 内的权限。\n- 内置角色包括 `Key Vault Administrator`、`Key\
  \ Vault Contributor` 和 `Key Vault Reader`，每个角色具有不同层级的访问权限。\n\n### 最小权限原则\n- 访问策略遵循最小权限原则，仅授予执行特定操作所需的必要权限。\n\
  - 通过按需分配权限，你可以最大限度地减少未经授权访问和对 Key Vault 资源的潜在滥用风险。\n\n### 多条访问策略\n- `Azure Key Vault`\
  \ 允许你定义多个访问策略，每种策略都有其自己的权限集。\n- 这允许你为不同的用户、应用程序或组设置不同级别的访问权限。\n- 当你需要为组织内的不同实体授予不同权限时，多个访问策略将非常有用。\n\
  \n### 访问策略管理\n- 可以通过 `Azure portal`、`Azure CLI`、`Azure PowerShell` 或 `Azure SDKs`\
  \ 管理和修改访问策略。\n- 你可以根据需要添加、删除或修改访问策略，确保访问权限始终是最新的并符合你的安全需求。\n\n### Azure AD 集成\n\
  - `Azure Key Vault` 与 `Azure Active Directory (Azure AD)` 集成以进行验证和授权。\n- 访问策略与 `Azure\
  \ AD` 标识绑定，允许你根据 Azure AD 成员向特定的用户、组或应用程序授予访问。\n\n通过有效管理 Azure Key Vault 中的访问策略，你可以控制并保护加密密钥、密码和证书的访问。通过遵循最小权限原则并根据特定的角色和职责分配权限，你可以确保只有授权的实体才能获得访问\
  \ Key Vault 资源的所需的权限。\n\n\n\n\n\n通过利用 `Azure Key Vault` 的安全存储和细粒度访问控制，我们将演示如何保护这些关键密钥免于在代码或配置文件中暴露。相反，我们的\
  \ Web 应用将遵循最小权限原则，与 `Azure Key Vault` 进行身份验证，并在需要时请求所需的密钥。\n\n在整个案例研究中，我们将展示该方法的分步实现过程，并强调在\
  \ `Azure Key Vault` 中保护密钥的最佳实践。通过本研究的最后，你将获得使用 `Azure Key Vault` 保护 Web 应用程序敏感信息的知识和实操技能，从而提升应用程序基础设施的整体安全性。\n\
  \n## 创建 Azure Key Vault\n\n创建 `Azure Key Vault` 涉及几个步骤。在接下来的章节中，概述了使用 Azure 门户创建\
  \ `Azure Key Vault` 的高层级流程：\n\n1. 登录 Azure 门户：访问 `https://portal.azure.com` 并使用您的\
  \ Azure 账户登录。\n2. 创建新资源：点击 Azure 门户左侧的 `+ Create a resource`（创建资源）按钮。\n3. 搜索 \"\
  Key Vault\"：在搜索栏中输入 \"Key Vault\"，并在结果列表中选择 \"Key Vault\"。\n4. 点击 \"Create\"：在 Key\
  \ Vault 概述页上，点击 `Create`（创建）按钮开始创建过程。\n5. 填写基本信息：\n    * Subscription（订阅）：选择您想要用于\
  \ Key Vault 的相应 Azure 订阅。\n    * Resource group（资源组）：创建一个新的资源组或选择现有资源组。资源组是 Azure\
  \ 中资源的逻辑容器。\n    * Key vault name（Key Vault 名称）：为您的 Key Vault 输入一个唯一名称。该名称在所有 Azure\
  \ Key Vault 实例中必须是全局唯一的。\n    * Region（区域）：选择您希望 Key Vault 所在的 Azure 区域。选择距离应用程序的区域以降低延迟。\n\
  6. 配置访问策略（可选）：您可以选择在创建期间或之后配置访问策略。访问策略控制谁可以访问 Key Vault 以及对其资源执行操作。现在，您可以跳过此步骤，并在稍后设置访问策略。\n\
  7. 配置高级设置（可选）：如果需要，您可以在创建期间设置高级配置，如启用软删除、删除保护和网络访问控制。否则，您可以使用默认设置。\n8. 审核并创建：审核配置详情并点击\
  \ `Create`（创建）按钮开始部署。\n9. 等待部署：Key Vault 的创建过程可能需要几分钟。等待部署完成。\n10. 访问您的 Key Vault：一旦成功创建\
  \ Key Vault，即可从 Azure 门户访问它。导航到“所有资源”（All resources）或搜索 Key Vault 名称以找到它。\n\n就是这样！您现在已创建一个\
  \ `Azure Key Vault`。创建 Key Vault 后，您可以开始安全地存储加密密钥、密钥和证书，并进一步配置访问策略以控制谁可以访问它们以及可以执行哪些操作。您可以在下方查看\
  \ Azure Key Vault 的概述页：\n\n![](img/Figure_7.1.png)\n\n图 7.1：最近创建的 Azure Key vault。\n\
  \n## 管理 Key Vault 访问策略\n\n为了确保 Azure Key Vault 内密钥的安全管理，您应该配置访问策略以向授权用户授予适当的权限。按照以下步骤为您的用户授予管理密钥的权限：\n\
  \n1. 导航到 Azure Key Vault：登录 Azure 门户，通过搜索名称或从“所有资源”菜单访问找到您的 Azure Key Vault。\n2.\
  \ 进入访问策略：在 Key Vault 内部，从左侧导航菜单中选择 `Access policies`（访问策略）选项卡。\n3. 添加访问策略：点击 `Add\
  \ Access policy`（添加访问策略）按钮，为您的用户定义新的访问策略。\n4. 定义权限：在 `Add Access policy` 面板中，指定您想要授予用户的必要权限。对于管理密钥，请确保选择了\
  \ `Get`（获取）和 `Set`（设置）权限。`Get`允许读取密钥，而 `Set`允许创建或更新密钥。\n5. 分配用户或组：在 `Select principal`（选择主体）下，搜索并选择要授予这些权限的用户或组。您可以从您的\
  \ Azure AD 用户或组中选择。\n6. 保存访问策略：点击 `Add`（添加）保存访问策略，并将权限应用于指定的用户或组。\n7. 验证访问：保存访问策略后，您的用户现在将拥有管理\
  \ Azure Key Vault 内密钥的必要权限。\n\n确保只向受信任的个人或组授予权限并遵循最小权限原则（为用户提供完成任务所需的最小权限至关重要。定期审查和管理访问策略以维护安全环境并有效保护您的敏感数据。您可以在下方查看为我的用户配置的访问策略图片：\n\
  \n![](img/Figure_7.2..png)\n\n图 7.2：我的用户的 Azure Key Vault 策略。\n\n## 访问密钥\n\n为了启动我们的项目，我们将创建一个\
  \ Web 应用程序，然后安装下面列出的所需 NuGet 包：\n\n* `Azure.Security.KeyVault.Secrets`\n* `Azure.Identity`\n\
  \n我们可以在下面的图片中看到我们最近创建的带有 NuGet 包的项目解决方案：\n\n![](img/Figure_7.3..png)\n\n图 7.3：Web\
  \ 应用程序项目解决方案。\n\n为了确保从 Visual Studio 无缝集成并访问 `Azure Key Vault`，务在于使用与创建 Key Vault\
  \ 相同的账户配置 Azure 服务身份验证。请按照以下步骤验证并设置配置：\n\n1. 验证 Azure 账户：确认您已使用用于创建 Key Vault 的\
  \ Azure 账户登录了 Visual Studio。\n2. 打开 Visual Studio：启动 Visual Studio 并进入 `Tools`（工具）菜单。\n\
  3. 选项：从 `Tools` 菜单选择 `Options`（选项）。\n4. Azure 服务身份验证：在 `Options` 窗口中，展开 Azure 类别下的\
  \ `Azure Service Authentication`。\n5. 选择账户：确保 `Account Selection`（账户选择）下拉菜单显示的是与\
  \ Key Vault 相同的账户。\n6. 验证凭据：如有需要，点击 `Manage Account`（管理账户）验证账户凭据，或在未列表的情况下添加正确的账户。\n\
  7. 身份验证：如果提示，使用 Azure 账户进行身份验证，以确保凭据最新有效。\n\n通过确认 Visual Studio 的 Azure 服务身份验证配置正确，将实现应用程序与\
  \ Key Vault 之间的顺畅通信。这种匹配确保了应用程序可以安全地从 Key Vault 获取和管理密钥。\n\n![](img/Figure_7.4..png)\n\
  \n图 7.4：使用我的账户进行 Azure 身份验证。\n\n现在，要在 Azure Key Vault 中安全地创建密钥，请按照以下步骤操作：\n\n1.\
  \ 导航到 Key Vault：登录 Azure 门户 (`https://portal.azure.com`) 并通过搜索名称或在“所有资源”列表中找到您的\
  \ Azure Key Vault。\n2. 密钥：在 Key Vault 内部，从左侧导航菜单中选择 `Secrets`（密钥）。\n3. 添加新密钥：点击\
  \ `+ Generate/Import`（生成/导入）按钮创建新密钥。\n4. 定义密钥详细信息：在 `Create a secret`（创建密钥）面板中，提供必要信息：\n\
  \    * Name（名称）：为密钥输入一个唯一名称。\n\n\n\n\n\n*   `Value`：输入想要安全存储的实际机密值。\n*   `Content\
  \ type`（可选）：如果需要，可以指定内容类型，例如 `\"text/plain\"` 或 `\"application/json\"`。\n5. 设置激活日期和过期时间（可选）：如果需要，可以为密钥设置激活日期和过期时间。这对于管理密钥的有效期非常有用。\n\
  6. 点击“创建”：填写详细信息后，点击“创建”按钮将密钥添加到您的密钥库（Key Vault）。\n\n现在，密钥已安全地存储在您的 Azure Key Vault\
  \ 中，并受到 Azure 力安全措施的保护。通过利用 Key Vault 进行密钥管理，您可以确保连接字符串、API 密钥和密码等敏感信息保持安全，且未经授权的用户无法访问。此外，您的\
  \ `Web Application` 现在可以使用 `Azure Key Vault APIs` 安全地检索此密钥，从而确保您的敏感数据的机密性和完整性。我们可以从下面的图片看到我们最近创建的密钥：\n\
  \n![](img/Figure_7.5..png)\n\n图 7.5：Azure Key Vault 中的新密钥。\n\n要从 `Web Application`\
  \ 检索我们的密钥，我们必须如下所示修改 `Index.cshtml.cs`：\n\n```cs\npublic class IndexModel : PageModel\n\
  {\n    private readonly ILogger<IndexModel> _logger;\n    public string Message\
  \ { get; set; }\n\n    public IndexModel(ILogger<IndexModel> logger)\n    {\n  \
  \      _logger = logger;\n    }\n\n    public void OnGet()\n    {\n        try\n\
  \        {\n            SecretClientOptions options = new SecretClientOptions()\n\
  \            {\n                Retry =\n                {\n                   \
  \ Delay= TimeSpan.FromSeconds(2),\n                    MaxDelay = TimeSpan.FromSeconds(16),\n\
  \                    MaxRetries = 5,\n                    Mode = RetryMode.Exponential\n\
  \                }\n            };\n            var client = new SecretClient(new\
  \ Uri(\"https://keyvaultthiago.vault.azure.net/\"), new DefaultAzureCredential(),\
  \ options);\n            KeyVaultSecret secret = client.GetSecret(\"thiagosecret\"\
  );\n            Message = secret.Value;\n        }\n        catch (Exception ex)\n\
  \        {\n            Message = \"An error ocurred while trying to retrieve the\
  \ secret\";\n        }\n    }\n}\n```\n\n为了显示我们的密钥消息，我们必须如下所示更新 `Index.cshtml`：\n\
  \n```razor\n@page\n@model IndexModel\n@{\n    ViewData[\"Title\"] = \"Home page\"\
  ;\n}\n\n<div class=\"text-center\">\n    <h1 class=\"display-4\">Welcome</h1>\n\
  \    <p>This is the secret message: @Model.Message</p>\n</div>\n```\n\n以下将是成功的输出：\n\
  \n![](img/Figure_7.6.png)\n\n图 7.6：显示从 Azure Key Vault 检索的密钥的 Web 应用程序。\n\n## 结论](#contents.xhtml_sc2_148a)\n\
  \n在本章中，我们探讨了使用 `Azure Key Vault` 保护应用程序的重要性，并讨论了其实现的各个方面。我们首先概述了 Azure Key Vault，了解了它在确保加密密钥、机密和证书安全方面的能力和优势。\n\
  \n身份验证是保护 Azure Key Vault 的关键因素，我们深入研究了各种身份验证机制，学习了如何有效地配置和管理它们。通过实施强有身份验证措施，您可以确保只有授权的实体才能访问您的敏感数据。\n\
  \n访问策略在控制对 Azure Key Vault 资源的访问方面起着重要作用，我们检查了如何通过访问策略定义和管理细粒度的权限。通过仔细管理这些策略，您可以维持强大的安全态势，并降低未经授权访问的风险。\n\
  \n为了提供实用的视角，我们研究了一个案例，展示了在现实场景中分步实现 Azure Key Vault 的过程。从创建和配置密钥库到定义和管理访问策略，该案例说明了\
  \ Azure Key Vault 在保护您的应用程序方面的实际应用。\n\n此外，我们展示了如何通过 `.NET` 控制台应用程序访问存储在 Azure Key\
  \ Vault 中的密钥示例。这演示了您的应用程序与 Azure Key Vault 的集成，实现了密钥的安全检索和利用。\n\n通过学习本章介绍的知识和技能，您现在拥有了使用\
  \ Azure Key Vault 有效保护应用程序的工具和理解。您学习了强效身份验证的重要性、访问策略的意义，以及如何利用 Azure Key Vault 的功能来增强应用程序安全性。\n\
  \n请记住遵守 Azure Key Vault 保护应用程序的最佳实践，并定期检查和更新您的安全措施，以应对潜在威胁。通过将 Azure Key Vault 作为应用程序安全策略不可或缺的一部分，您可以保护您的宝贵资产，确保数据机密性，并在用户之间建立信任。\n\
  \n祝喜你完成本章！你现在具备了相关的知识和技能，可以使用 Azure Key Vault 加固您的应用程序并防御潜在的安全威胁。在当今不断变化的数字格局中，请拥抱这种新的理解，并继续优先考虑应用程序的安全性。\n\
  \n\n\n\n\n在本章结束时，你将掌握关键方面的内容。探索热重载（Hot Reload），这一功能允许实时更改代码以获得即时结果，从而提高开发效率。浏览 Blazor\
  \ 和 ASP.NET Web 应用程序的安全要点，重点关注身份验证、数据保护和最佳实践。深入研究数据绑定（Data Binding），确保类型安全和代码的可维护性。区分\
  \ `azor` 和 `Razor`，理解它们的优势，以便做出明智的 Web 应用开发决策。本章以一个实用的案例研究结束，以强化相关概念。这种全面的理解将使你能够使用\
  \ `Blazor` 和 `ASP.NET` 构建动态 Web 应用，赋予开发交互式、功能丰富的应用程序的能力。\n\n# 使用 Blazor 和 .NET 构建\
  \ Web 应用\n\n`Blazor` 是一个允许使用 `.NET` 创建交互式客户端 Web 用户界面的框架。通过 `Blazor`，开发者可以使用 `C#`\
  \ 而不是 `JavaScript` 来构建丰富的 UI，从而获得更熟悉、更高效的开发体验。\n\n使用 `Blazor` 的主要优势之一是在服务器端和客户端之间共享应用程序逻辑，利用两个环境中的\
  \ `.NET` 力量。这允许在整个应用程序中实现代码重用和一致性。\n\n`Blazor` 将 UI 渲染为 `HTML` 和 `CSS`，确保了广泛的浏览器，包括移动浏览器。它还与\
  \ `Docker` 等现代托管平台无缝集成，实现了易于部署的扩展性。\n\n通过使用 `.NET` 进行客户端 Web 开发，开发者可以使用 `C#` 而不是\
  \ `JavaScript` 编写代码。他们可以利用庞大的 `.NET` 库生态系统，受益于 `.NET` 的性能、可靠性和安全性，并在 Windows 上的\
  \ `Visual Studio` 或 Windows、Linux 或 macOS 上的 `Visual Studio Code` 等流行的开发环境中工作。在客户端\
  \ Web 开发中采用 `Blazor` 和 `.NET` 为开发者提供了一套稳定、功能丰富且易于使用的语言、框架和工具。它为构建混合桌面和移动应用开辟了新的可能性，使其成为现代\
  \ Web 开发项目中非常有吸引力的选择。\n\n# 热重载\n\n通过 `.NET` 热重载，你可以将代码更改（包括对样式表的修改）应用到运行中的应用程序中，而无需重启程序或丢失程序的当前状态。此功能适用于所有\
  \ `ASP.NET Core 6.0` 及更高版本的项目。\n\n在进行代码更新时，在某些条件下更改将在运行的程序中生效。例如，仅运行一次的启动逻辑（例如 `middleware`（内联中间件委托除外）、已配置的服务以及路由的创建和配置）将重新运行以包含更改。内联中间件委托是在如\
  \ `asp.net core` 等框架的中间件函数上下文中使用的委托，这些委托在中间件管道线配置中完全以内联方式实现。这意味着语言开发者可以在中间件配置代码内部定义中间件将执行的逻辑，而无需为定义命名中间件创建单独的方法或类。\n\
  \n在 `Blazor` 应用程序中，`Razor` 组件的渲染由框架自动触发。相反，在 `MVC` 和 `Razor Pages` 应用程序中，热重载将自动刷新浏览器。需要注意的是，删除\
  \ `Razor` 组件参数属性不会导致组件重新渲染。要反映此类更改，则需要重启应用程序。\n\n`.NET` 热重载的引入通过在应用程序运行期间提供无缝且即时的代码更新，显著提升了开发体验。它赋予了开发者快速、高效迭代的能力，消除了频繁重启的需要，并让他们专注于构建和完善他们的应用程序。\n\
  \n# 支持的框架和应用程序类型\n\n下表提供了支持 `.NET` 热重载的应用程序类型概述。它强调了在附加调试器时（`F5`）或在不带调试器运行时运行（`Ctrl+F5`）时是否可以使用热重载。此外，它还指示了最低支持是否需要使用\
  \ `.NET 6`。值得注意的是，`Ctrl+F5` 支持始终需要 `.NET 6`。该表还包含了包含此热重载功能的 `Visual Studio` 最低版本。\n\
