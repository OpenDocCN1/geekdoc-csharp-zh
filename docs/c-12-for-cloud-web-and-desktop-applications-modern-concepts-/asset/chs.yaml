  \n数据库中创建的表负责管理用户账户、身份验证和授权：\n\n![](img/Figure_8.11.png)\n\n图 8.11：数据库中创建的表。\n\n\
  7. 修改 `FetchData` 组件，添加 `Authorize` 特性并尝试访问它。\n\n`FetchData` 组件中的代码：\n\n```razor\n\
  @page \"/fetchdata\"\n@attribute [Authorize]\n@using SampleBlazorApp.Data\n@inject\
  \ WeatherForecastService ForecastService\n\n<PageTitle>Weather forecast</PageTitle>\n\
  \n<h1>Weather forecast</h1>\n\n<p>此组件演示了从服务获取数据。</p>\n\n@if (forecasts == null)\n\
  {\n    <p><em>加载中...</em></p>\n}\nelse\n{\n    <table class=\"table\">\n       \
  \ <thead>\n            <tr>\n                <th>Date</th>\n                <th>Temp.\
  \ (C)</th>\n                <th>Temp. (F)</th>\n                <th>Summary</th>\n\
  \            </tr>\n        </thead>\n        <tbody>\n            @foreach (var\
  \ forecast in forecasts)\n            {\n                <tr>\n                \
  \    <td>@forecast.Date.ToShortDateString()</td>\n                    <td>@forecast.TemperatureC</td>\n\
  \                    <td>@forecast.TemperatureF</td>\n                    <td>@forecast.Summary</td>\n\
  \                </tr>\n            }\n        </tbody>\n    </table>\n}\n```\n\n\
  （注：此处代码块已根据要求保持不翻译）\n\n在尝试访问 `FetchData` 页面时，输出为“Not Authorized”（未授权）消息：\n\n![](img/Figure_8.12.png)\n\
  \n图 8.12：使用 `Authorize` 特性后的 Fetch 页面。\n\n注册新账户，前往：\n\n![](img/Figure_8.13.png)\n\
  \n图 8.13：注册新账户。\n\n我们成功创建了账户：\n\n![](img/Figure_8.14.png)\n\n图 8.14：账户已创建并准备好使用。\n\
  \n现在，我们可以再次访问 `FetchData` 页面：\n\n（注：此处代码块已根据要求保持不翻译）\n\n\n\n\n这是使用 C# 的 `get` 和\
  \ `set` 访问器后的 `Counter` 组件。请注意，我们没有使用输入框中的数字。我们始终从 0 开始递增之前的数字。你可以查看下面的完整代码块：\n\n\
  ```html\n@page \"/counter\"\n\n<PageTitle>Counter</PageTitle>\n\n<h1>Counter</h1>\n\
  \n<p>\n  <input @bind=\"IncrementCount\" />\n</p>\n\n<p>\n  <code>inputValue`: @currentCount\n\
  </p>\n\n@code {\n  private int currentCount = 0;\n\n  private int IncrementCount\n\
  \  {\n    get => currentCount;\n    set => currentCount = currentCount + 1;\n  }\n\
  }\n```\n\n运行代码后，我们得到：\n\n![](img/Figure_8.20.png)\n\n图 8.20：事件发生之前的计数器页面。值来自 C#\
  \ 对象。\n\n在更改输入值后，之前的数字得到了递增。我们没有考虑输入值，而是递增加了之前的 `inputValue`：\n\n![一张带有文本的图像、截图、字体、自动生成的数字描述](img/Image185677.png)\n\
  \n图 8.21：事件发生后的计数器页面。值来自 C# 对象。\n\n## 结论 (#contents.xhtml_sc2_173a)\n\n在本章，我们涵盖了使用\
  \ Blazor 和 ASP.NET 构建动态 Web 应用程序。我们介绍了许多对于创建交互和响应式 Web 应用至关重要的主题。\n\n我们探索了热重载（hot\
  \ reload）的便利性和生产力，允许开发者进行实时代码更改并立即看到影响。此功能加速了开发周期并减少了停机时间，带来了更高效、愉快的开发体验。\n\n我们强调了在\
  \ Web 应用程序中实施稳健安全措施的重要性。从身份验证和授权到保护敏感数据，我们强调了采用最佳实践的重要性，以确保我们的应用程序保持安全并免受潜在威胁的影响。\n\
  \n我们发现了数据绑定的益处，它促进了类型安全并增强了代码的可维护性。通过利用这一功能，我们可以放心地在组件之间进行数据绑定，并受益于编译时验证和 `IntelliSense`\
  \ 支持。\n\n我们探索了 `Blazor` 和 `Razor` 这两个用于 Web 应用开发的强大技术之间的区别。通过理解它们的独特优势和用例，我们对如何为特定的项目需求选择最合适的方法\
  \ string 了见解。\n\n通过掌握这些概念，我们现在具备了开发基于 Blazor 和 ASP.NET 的动态 Web 应用程序所需的知识和技能。`Blazor`\
  \ 的客户端能力与 `ASP.NET` 稳健的 Web 开发框架的结合，使我们能够创建高度交互且功能丰富的应用程序。\n\n在你继续 Web 应用开发之旅时，进一步探索并关注\
  \ Blazor 和 ASP.NET 不断演进的功能和进展至关重要。这些技术为构建提供引人用户体验的尖端 Web 应用提供了丰富的可能性。\n\n我们希望本章为你提供了宝贵的见解和实用知识，以开启你自己的动态\
  \ Web 应用项目。请记住利用这里涵盖的概念和技术，创建出满足用户需求的卓越 Web 应用程序。\n\n感谢加入我们这一关于使用 Blazor 和 ASP.NET\
  \ 构建动态 Web 应用程序的激动探索。在开启你的下一个项目时，请继续突破 Web 开发的边界并不断创新。\n\n在接下来的章节中，我们将沉浸在带有 `SignalR`\
  \ 和 `ASP.NET` 的实时通信世界中。这个主题标志着我们对 `SignalR` 的关键探索——`SignalR` 是一个用于实时 Web 功能的强大库，它与\
  \ `ASP.NET` 无缝集成，实现了客户端与服务器之间的动态双向通信。当我们处理实时通信的复杂之处时，读者将发现 `SignalR` 在创建交互和响应式 Web\
  \ 应用方面的强大之处。通过实际演示和见解，本章旨在赋予读者实现实时功能的知识，将传统的 Web 体验转变为动态且吸引人的平台。\n\n### 加入我们书籍的\
  \ Discord 空间\n\n加入书籍的 Discord 工作区以获取最新更新、优惠、全球科技动态、新版本发布以及与作者的交流会议：\n\nhttps://discord.bpbonline.com\n\
  \n![](img/fm1.png)\n\n# 第 9 章 使用 SignalR 和 ASP.NET 进行实时通信 #contents.xhtml_ch09a\n\
  \n## 引言 (#contents.xhtml_sc2_174a)\n\n在当今快速节奏的数字世界中，用户期望应用程序能够提供实时更新和交互。无论是实时聊天、协作编辑还是动态数据可视化，提供实时通信的能力对于构建吸引人且交互式的应用程序至关重要。\n\
  \n在本章中，我们将探索 `SignalR`，这是 `ASP.NET` 提供的一个强大框架，它简化了为你的应用程序添加实时功能的过程。通过 `SignalR`，你可以轻松地在服务器和客户端之间建立双向通信通道，实现无缝且瞬间的数据交换。\n\
  \n我们将首先深入研究 `SignalR` 的配置方面。你将学习如何在你的 `ASP.NET` 应用程序中设置和配置 `SignalR`，确保你有一个坚实的基础来构建构建。我们将探索各种选项和设置，允许你根据特定需求自定义\
  \ `SignalR` 的行为。\n\n接下来，我们将深入研究实时通信场景中身份验证和授权的关键方面。你将发现如何安全保护你的 `SignalR` 连接，确保只有授权用户才能访问并与你的实时功能进行交互。\n\
  \n一旦我们对基础知识有了固定的理解，我们将探索 `SignalR` 的流枢纽（Streaming Hub）功能。流 Hub 允许你构建实时流场景，客户端可以从服务器接收连续的数据流。我们将研究如何实现流\
  \ Hub、处理数据集以及优化以实现高效流。\n\n## 结构 (#contents.xhtml_sc2_175a)\n\n本章涵盖了以下主题：\n\n*  \
  \ 使用 SignalR 和 ASP.NET 进行实时通信\n*   配置\n*   身份验证与授权\n*   流 Hub (Streaming hub)\n\
  *   案例研究\n\n## 目标 (#contents.xhtml_sc2_176a)\n\n在本章结束时，你将掌握 `SignalR` 和 `ASP.NET`\
  \ 实时通信的关键方面，涵盖配置细节、身份验证和授权。配置见解包括 `SignalR` 的设置以及自定义选项的探索。身份验证和授权的重要性将指导实现安全的 `SignalR`\
  \ 连接。流 Hub 将揭秘，涵盖了客户端到服务器和服务器到客户端的流。在最后，一个全面的案例研究展示了真实世界的实现，为实际应用提供了分步指南。读者将深刻地理解\
  \ `SignalR` 的能力，从初始设置到安全通信以及实际应用集成。\n\n\n\n\n\n通过利用 SignalR，开发者可以构建交互式且响应式的 Web\
  \ 应用程序，为连接的客户端提供无缝且瞬时的更新。这种双向通信能力允许高效的数据交换，实现实时协作、实时更新和交互式用户体验。\n\n## 何时使用 SignalR\n\
  \nSignalR 非常适用于各种需要实时通信和频繁更新的应用程序。以下是 SignalR 可以发挥用处的一些示例：\n\n*   高频更新的应用：`SignalR`\
  \ 是涉及实时数据更新应用程序的理想选择，例如在线游戏、社交网络、地图和 GPS 应用。它允许向所有连接的客户端即时传递更新，提供平滑且交互式的用户体验。\n\
  *   协作应用：`SignalR` 能够在白板或团队会议应用等程序中实现实时协作。多个用户可以同时工作，实时查看对方的更改，并促进无缝协作。\n*   带有通知的应用：`SignalR`\
  \ 可用于向连接的客户端发送即时通知，适用于需要实时警报和更新的应用。这包括电子邮件应用程序、聊天系统以及任何其他即时通知至关重要的场景。\n*   任何需要即时通信的应用：`SignalR`\
  \ 可应用于服务器与客户端之间必须进行即时通信的广泛领域。这包括实时监控系统、金融交易平台、体育赛事直播等。\n\n总而言之，`SignalR` 是多用途的，适用于各种需要实时通信、频繁更新和即时内容交付的场景。它的功能赋予了开发者在不同领域创建交互和响应式应用程序的能力。\n\
  \n## 消息传输\n\nSignalR 支持多种传输方法，以便在客户端和服务器之间建立实时连接。`SignalR` 支持以下传输方法：\n\n*   WebSockets：它在客户端和服务器之间提供了一个全双工通信通道，允许低延迟的高效实时数据传输。\n\
  *   服务器发送事件 (SSE)：这是一种单向通信方法，服务器通过单个 HTTP 连接向客户端发送持续更新。\n*   长轮询 (Long polling)：长轮询是一种技术，客户端向服务器发送请求并保持连接开启状态，直到服务器有新数据要发送。一旦服务器响应数据或发生超时，客户端立即发送新请求。\n\
  \n## Hubs（中枢）\n\nHubs 是 `SignalR` 的核心组件，负责管理客户端与服务器之间的通信。当后端服务器接收到 Hub 的消息时，它会根据消息中提供的方法名自动调用相应的客户端代码。\n\
  \nSignalR 支持两种内置的 Hub 协议来传输消息：\n\n*   基于 JSON 的文本协议：消息在发送到客户端之前会被序列化为 JSON 格式。\n\
  *   基于 MessagePack 的二进制协议：消息使用高效的 MessagePack 格式进行序列化，这减小了负载大小并提升了性能。\n\n## SignalR\
  \ 方法\n\nSignalR 方法用于在服务器和连接的客户端之间发送消息。以下是一些常用方法：\n\n*   `Clients.All.SendAsync`：调用\
  \ Hub 上的指定方法并将对象发送给所有连接的客户端。\n*   `Clients.Caller.SendAsync`：调用 Hub 上的指定方法并将对象发送回调用者本身。\n\
  *   `Clients.Client({connectionId}).SendAsync`：根据连接 ID 调用 Hub 上的指定方法并将对象发送给指定的客户端。\n\
  *   `Groups.AddToGroupAsync`：将客户端添加到指定的组，允许向该组的客户端发送定向消息。\n*   `Clients.Group({group}).SendAsync`：调用\
  \ Hub 上的指定方法并将对象发送给指定组中的所有客户端。\n\n这些方法在各种场景下实现了服务器与客户端之间的高效通信和消息传递。\n\n总体而言，`SignalR`\
  \ 提供了灵活的消息传输方式、用于管理通信的强大 Hub，以及向特定客户端或组发送消息的便捷方法。\n\n## 配置\n\n配置对于充分发挥 SignalR 在实时通信中的潜力起着至关的作用。通过理解和利用各种配置选项，开发者可以微调\
  \ `SignalR` 的行为以符合应用程序的特定需求。从建立连接设置和管理 Hub 配置，到优化性能和可扩展性，掌握 `SignalR` 的配置允许在云、Web\
  \ 和桌面应用程序中实现无缝集成并高效利用实时能力。无论是调整消息大小限制、启用传输协议，还是配置连接超时，配置良好的 `SignalR` 环境都能确保服务器与客户端之间可靠且高性能的实时通信，创造出引人入胜且具有交互性的用户体验。\n\
  \nASP.NET Core SignalR 在编码消息时支持两种协议：JSON 和 MessagePack。每个协议都有自己的一套序列化配置选项，为适应特定需求和优化消息编码以实现高效通信提供了灵活性。\n\
  \n### JSON 编码\n\n在 SignalR 协议的 JSON 编码中中，每条消息都表示为一个独立的 JSON 对象，作为底层传输消息的唯一内容。需要注意的是，JSON\
  \ 对象中的所有属性名都是大小敏感的。文本编码和解码的责任由底层协议实现，这要求 JSON 字符串以所用特定传输预期的格式进行编码。例如，当采用 ASP.NET\
  \ Sockets 传输时，始终使用 UTF-8 编码进行文本表示。\n\n要在 `SignalR` 服务端配置 JSON 序列化，你可以利用 `AddJSONProtocol`\
  \ 扩展方法。该方法位于 `Startup` 类的 `ConfigureServices` 方法中 `AddSignalR` 方法之后。使用 `AddJSONProtocol`\
  \ 时，你可以传递一个接收选项对象的委托，并在该对象中访问 `PayloadSerializerOptions` 属性。该属性允许你使用 `System.Text.JSON.JsonSerializerOptions`\
  \ 对象配置参数和返回值的序列化。\n\n## MessagePack 编码\n\nMessagePack 是一种高效且紧凑的二进制序列化格式，适用于对性能和带宽优化要求高的场景。与\
  \ JSON 相比，MessagePack 产生的消息更小，有利于减少网络流量。然而，由于其二进制特性，除非通过 MessagePack 解析器处理，否则在检查网络跟踪和日志时消息是不可读的。SignalR\
  \ 意识到了 MessagePack 的重要性，并内置了对该格式的支持，为客户端和服务器提供了专门的 API 以无缝使用 MessagePack 序列化。\n\n\
  要在服务端启用 MessagePack Hub 协议，只需在应用程序中安装 `Microsoft.AspNetCore.SignalR.Protocols.MessagePack`\
  \ 包。在 `Startup.ConfigureServices` 方法中，调用 `AddSignalR` 时添加 `AddMessagePackProtocol`\
  \ 方法即可启用服务端的 MessagePack 支持。\n\n目前，在 JavaScript 客户端无法配置 MessagePack 序列化。\n\n\n\n\
  \n\n# 服务器配置选项\n\n本节探索了各种配置选项，允许开发者实现最佳性能和自定义。从控制传输协议到身份验证和授权设置，学习如何优化您的服务器应用程序以提高效率和适应性。通过下这些选项，您可以释放服务器配置选项的潜力，并将应用程序提升到控制和功能的新水平，下方的主要选项所示：\n\
  \n### `ClientTimeoutInterval`\n- 如果服务器在特定间隔内没有收到任何消息，则认为客户端已断开。建议将超时间隔设置为该间隔的两倍，以实现更可靠的断开检测。\n\
  - 默认值：`30s`\n\n### `HandshakeTimeout`\n- 仅在严重网络延迟导致握手超时错误的情况下，调整握手超时间隔。\n- 默认值：`15s`\n\
  \n### `KeepAliveInterval`\n- 为了确保连接保持开启，如果服务器在特定间隔内没有发送任何消息，则会自动发送 ping 消息。在调整 `KeepAliveInterval`\
  \ 时，建议同时更新客户端上的 `ServerTimeout` 或 `serverTimeoutInMilliseconds` 设置。`ServerTimeout`\
  \ 或 `serverTimeoutInMilliseconds` 的推荐值为 `KeepAliveInterval` 的两倍，以维持可靠且不中断的连接。\n\
  - 默认值：`15s`\n\n### `SupportedProtocols`\n- 枢支持多种协议，默认允许服务器上所有注册的协议。但是，可以通过从支持协议列表中移除特定协议，为单个枢禁用这些特定协议。这为根据每个特定枢的需要自定义协议支持提供了灵活性。\n\
  \n### `EnableDetailedErrors`\n- 默认情况下，`Hub` 方法不会向客户端返回详细的异常消息，以保护敏感信息。\n\n### `StreamBufferCapacity`\n\
  - 用于缓冲客户端上传流的缓冲区最大项目数决定了缓冲限制。当达到此限制时，调用的处理将被临时阻塞，直到服务器处理流项目。这有助于维持受控的数据流，并防止过量的缓存压垮服务器。\n\
  - 默认值：`10`\n\n### `MaximumReceiveMessageSize`\n- 单个入站枢 消息的最大尺寸是指对消息大小施加的限制。增加此值可能会增加拒绝服务\
  \ (DoS) 攻击的风险，因为较大的消息需要更多的处理资源。在容纳合法消息大小和缓解与大负载相关的潜在风险之间取得平衡至关重要。\n- 默认值：`32kb`\n\
  \n### `MaximumParallelInvocationsPerClient`\n- 在队列之前，从客户端并发调用枢方法的最大最大数量。\n- 默认值：`1`\n\
  \n### `DisableImplicitFromServicesParameters`\n- 如果枢方法所需的依赖项已在 DI 容器中注册，它们将在调用期间自动解析并作为参数提供给该方法。这简化了在枢方法内部访问和利用依赖项的过程，提升了应用程序的模块化和可维护性。\n\
  - 默认值：`false`\n\n# 高级 HTTP 配置\n\n要配置有关传输和内存缓冲区管理的高级设置，可以使用 `HttpConnectionDispatcherOptions`。通过在\
  \ `Program.cs` 文件中向 `MapHub` 方法传递委托，可以自定义这些选项。通过访问 `HttpConnectionDispatcherOptions`，您可以对应用程序行为的各个方面进行控制，允许根据特定需求进行微调和优化，下方的主要优化设置所示：\n\
  \n### `ApplicationMaxBufferSize`\n- 服务器在应用背压之前对客户端接收到的字节进行缓冲，由设置的最大字节数决定。如果增加此值，服务器可以更快的速度接收更大的消息而不产生背压，但可能导致更高的内存消耗。在快速接收大消息和高效管理内存之间取得平衡至关重要。\n\
  - 默认值：`64kb`\n\n### `TransportMaxBufferSize`\n- 服务器在观察背压之前对应用发送的字节进行缓冲，由设置的最大字节数决定。如果增加此值，服务器可以更快地缓冲更大的消息而无需等待背压，但可能导致更高的内存消耗。在高效缓冲大消息和有效管理内存消耗之间找到平衡至关重要。\n\
  - 默认值：`64kb`\n\n### `AuthorizationData`\n- `IAuthorizeData` 对象列表通过执行指定的授权要求，决定客户端连接到枢的授权权限。\n\
  \n### `Transports`\n- 默认启用所有传输，这意味着对客户端可以使用何种传输建立连接没有限制。\n\n### `LongPolling`\n\
  - SignalR 中的 `Long Polling`（轮轮）传输提供了特定选项。\n#### `PollTimeout`\n- 可以配置服务器在终止单个轮询请求之前向客户端发送消息的最大等待时间。减少此值会导致客户端更频繁地发出轮询请求，从而实现更快的消息传递。\n\
  - 默认值：`90s`\n\n### `WebSockets`\n- 默认值：\n### `CloseTimeout`\n- 当服务器关闭时，有一个指定的时间间隔，客户端应在此期间关闭连接。如果客户端未在此间隔内关闭，连接将由服务器终止。\n\
  - 默认值：`5s`\n#### `SubProtocolSelector`\n- 可以利用委托将 `Sec-WebSocket-Protocol` 头部设置为自定义值。此委托接收来自客户端的请求值作为输入，并负责返回\
  \ `Sec-WebSocket-Protocol` 头部所需的值。通过使用此委托，您可以灵活地根据特定需求自定义并控制 `Sec-WebSocket-Protocol`\
  \ 头部的值。\n- 默认值：`Null`\n\n### `MinimumProtocolVersion`\n- 指定最小协议版本，以限制客户端使用较新版本。\n\
  - 默认值：`0`\n\n### `CloseOnAuthenticationExpiration`\n- 启用身份验证过期跟踪可以在令牌过期时自动关闭连接。通过设置此选项，可以确保在身份验证令牌过期及时终止连接，增强安全性并防止未经授权的访问。\n\
  - 默认值：`false`\n\n# 客户端配置选项\n\n\n\n\n\n在 .NET Client 中，日志配置是通过 `ConfigureLogging`\
  \ 方法实现的。该方法允许你注册日志提供程序和过滤器，这与在服务器上的配置类似。通过利用 `ConfigureLogging`，你可以自定义客户端应用程序的日志行为，实现全面的监控、故障排除和分析。由于可以灵活地选择和配置日志提供程序及过滤器，你可以有效地管理和跟踪客户端的活动，确保最佳性能并解决潜在问题，如下所示的日志配置示例：\n\
  \n```csharp\nvar connection = new HubConnectionBuilder()\n  .WithUrl(\"https://example.com/chathub\"\
  )\n  .ConfigureLogging(logging => {\n    logging.SetMinimumLevel(LogLevel.Information);\n\
  \    logging.AddConsole();\n  })\n  .Build();\n```\n\n### 配置允许的传输方式\n\nSignalR 使用的传输方式可以在\
  \ `WithUrl` 调用期间（或 JavaScript 中的 `withUrl`）进行配置。通过对 `HttpTransportType` 的值进行按位或（OR）操作，你可以指定客户端允许使用的传输方式。默认情况下，所有传输方式都是启用的，提供了灵活性和兼容性。然而，通过自定义传输配置，你可以限制客户端仅使用指定的传输方式，从而根据你的应用程序需求确保最佳性能和针对性的网络通信，如下代码示例所示：\n\
  \n```csharp\nvar connection = new HubConnectionBuilder()\n  .WithUrl(\"https://example.com/chathub\"\
  ,\n    HttpTransportType.WebSockets | HttpTransportType.LongPolling)\n  .Build();\n\
  ```\n\n### 配置 Bearer 身份验证\n\n要在 SignalR 请求中包含身份验证数据，请使用 `AccessTokenProvider` 选项（JavaScript\
  \ 中的 `accessTokenFactory`）。在 .NET Client 中，访问令牌通过 `Authorization` 头部作为“Bearer Authentication”令牌传递。在\
  \ JavaScript Client 中，访问令牌作为 Bearer 令牌使用，除非浏览器 API 限制了头部的使用（例如 Server-Sent Events\
  \ 和 WebSockets 请求）。在这种情况下，访问令牌作为名为 `access_token` 的查询字符串参数提供，如下代码示例中的身份验证配置：\n\n\
  ```csharp\nvar connection = new HubConnectionBuilder()\n  .WithUrl(\"https://example.com/chathub\"\
  , options => {\n    options.AccessTokenProvider = async () => {\n      // 获取并返回访问令牌。\n\
  \    };\n  })\n  .Build();\n```\n\n### 其他选项\n\nSignalR 提供了一套全面的客户端选项，这些超了基础配置，允许你精调和增强\
  \ SignalR 客户端的行为。这些额外的客户端选项使你能够优化性能、自定义连接并适应特定需求，如下文所示的主要选项：\n\n- `ServerTimeout`：\n\
  \    - 为了建立稳健的连接，设置合适的服务器活动超时至关重要。应仔细选择此值，以留出足够的时间，让从服务器发送的 ping 消息在指定的超时间隔内成功传输并被接收。建议将服务器活动超时设置为至少是服务器\
  \ `KeepAliveInterval` 两倍的值。这个额外的缓冲区为 ping 消息到达客户端提供了充足的时间，最大限度地减少了过早断线的风险。\n   \
  \ - 默认值：30s\n- `HandshakeTimeout`：\n    - 修改初始服务器握手超时被认为是一种高级设置，仅适用于由于严重的网络延迟导致握手超时错误的情况。调整此超时时间时务必谨慎，并仅在必要时进行调整。\n\
  \    - 默认值：15s\n- `KeepAliveInterval`：\n    - 在 SignalR 中，客户端保活间隔决定了客户端向服务器发送 ping\
  \ 消息的频率。这些 ping 消息是维护连接健康的关键机制。每当客户端发送任何消息时，保活计时器重置并启动一个新的间隔。\n    - 默认值：15s\n-\
  \ `AccessTokenProvider`：\n    - 通过调用返回字符串的函数可以获取 HTTP 请求中的 Bearer 身份验证令牌。该字符串一旦作为身份令牌提供，即可对受保护资源进行安全授权的访问。\n\
  \    - 默认值：null\n- `SkipNegotiation`：\n    - 启用此选项将跳过协商步骤，直接使用 WebSockets 传输建立连接。需要注意的是，此功能仅在\
  \ WebSockets 传输是唯一启用传输时才可用。但请注意，在使用 Azure SignalR Service 时无法启用此设置。\n    - 默认值：false\n\
  - `ClientCertificates`：\n    - 一个可以包含以身份验证请求的 TLS 证书集合，确保通信安全且可靠。\n    - 默认值：空\n\
  - `Cookies`：\n    - 一个可以包含在每个 HTTP 请求中的 HTTP Cookie 集合，用于提供额外信息或维护状态通信。\n    - 默认值：空\n\
  - `Credentials`：\n    - 凭据可以随每个 HTTP 请求发送，以确保访问受保护资源的身份验证和授权。\n    - 默认值：空\n- `CloseTimeout`：\n\
  \    - 在 WebSockets 语文中，客户端可以指定在客户端启动关闭过程后服务器确认关闭请求的最大超时时间。如果服务器未在指定时间内确认关闭，客户端将与服务器断开连接。此超时设置有助于确保\
  \ WebSocket 连接的及时终止，防止长时间等待并允许实现顺畅高效的通信。\n    - 默认值：5s\n- `Headers`：\n    - 一个可以包含在每个\
  \ HTTP 请求中的额外 HTTP 头部映射，用于提供额外信息或进行定制。\n    - 默认值：空\n- `HttpMessageHandlerFactory`：\n\
  \    - `HttpMessageHandler` 委托用于配置或替换发送请求的 HTTP 消息处理器。它接收默认处理器作为参数，并必须返回一个非空值。你可以修改默认处理器的设置并返回它，或者创建一个新的处理器实例。请确保从提供的处理器中复制必要的设置到新处理器中，以确保功能正常。\n\
  \    - 默认值：null\n- `Proxy`：\n    - 要使用的代理。\n    - 默认值：null\n- `UseDefaultCredentials`：\n\
  \    - 如果要使用默认凭据，请启用 Windows 身份验证。\n    - 默认值：false\n- `WebSocketConfiguration`：\n\
  \    - 委托用于配置额外的 WebSocket 选项。它接收一个 `ClientWebSocketOptions` 实例，可以使用其对选项进行自定义。\n\
  \    - 默认值：null\n- `ApplicationMaxBufferSize`：\n    - 增加此值允许应用程序在应用背压之前缓冲从服务器接收的更多字节。这可以更更快地处理较大的消息，但可能会增加内存消耗。\n\
  \    - 默认值：1mb\n- `TransportMaxBufferSize`：\n    - 增加此值允许传输层在观察到背压之前缓冲用户应用程序发送的更多字节。这可以更更快地缓冲较大的消息，但可能会增加内存消耗。\n\
  \    - 默认值：1mb\n\n\n\n\nSignalR 可以利用 ASP.NET Core 身份验证建立连接与用户之间的关联。这允许从 hub 内部的\
  \ `HubConnectionContext.User` 属性访问身份验证数据。通过利用身份验证，hub 能够调用与特定用户关联的所有连接的方法。需要注意的是，多个连接可以关联到单个用户。\n\
  \n当 hub 方法需要授权时，SignalR 会为授权处理程序提供一个自定义资源。该资源由 `HubInvocationContext` 实例表示。`HubInvocationContext`\
  \ 提供了对各种信息的访问权限，包括 `HubCallerContext`，它包含了与与调用相关的连接和用户的详细信息。此外，它还包含了被调用的 hub 方法名称以及传递给该方法的参数。此上下文是在您的\
  \ SignalR 应用程序中执行授权检查并做出明智决策的宝贵资源。\n\n### Cookie 身份验证\n\n在基于浏览器的应用程序中，Cookie 身份验证能够将现有的用户凭据与\
  \ SignalR 连接无缝集成。当使用浏览器客户端时，不需要额外的配置。如果用户已登录应用程序，SignalR 连接将自动继承此身份验证。\n\nCookies\
  \ 是浏览器特定的传输访问令牌的机制，但它们也可以被非浏览器客户端使用。在 .NET Client 中，你可以在 `WithUrl` 方法中配置 `Cookies`\
  \ 属性以提供身份验证所需的 Cookie。然而，从 .NET 客户端使用 Cookie 身份验证需要应用程序提供一个 API 端点来交换身份验证数据以获取所需的\
  \ Cookie。这使得应用程序客户端和服务器组件之间无无缝身份验证。\n\n### Bearer 令牌身份验证\n\n服务器验证令牌并利用它来识别关联的用户。此验证过程仅在连接建立期间发生。一旦连接建立，服务器不会自动重新验证令牌以检查在连接寿命期间令牌是否被撤销。因此，确保访问令牌在整个连接期间保持有效至关重要，以维持不中断的身份验证，如下面的\
  \ SignalR 连接示例所示：\n\n```csharp\nvar connection = new HubConnectionBuilder()\n.WithUrl(\"\
  https://example.com/chathub\", options =>\n{\noptions.AccessTokenProvider = () =>\
  \ Task.FromResult(_myAccessToken);\n})\n.Build();\n```\n\n### Identity server JWT\
  \ 身份验证\n\n身份服务器配置在服务器上，并使用 JWT Bearer 中间件，如下例所示：\n\n```csharp\nbuilder.Services.AddAuthentication(options\
  \ =>\n{\noptions.DefaultAuthenticateScheme = JwtBearerDefaults.AuthenticationScheme;\n\
  options.DefaultChallengeScheme = JwtBearerDefaults.AuthenticationScheme;\n}).AddJwtBearer(options\
  \ =>\n{\noptions.Authority = \"Authority URL\";\noptions.Events = new JwtBearerEvents\n\
  {\nOnMessageReceived = context =>\n{\nvar accessToken = context.Request.Query[\"\
  access_token\"];\nvar path = context.HttpContext.Request.Path;\nif (!string.IsNullOrEmpty(accessToken)\
  \ &&\n(path.StartsWithSegments(\"/hubs/chat\")))\n{\ncontext.Token = accessToken;\n\
  }\nreturn Task.CompletedTask;\n}\n};\n});\n```\n\n### Windows 身份验证\n\n如果应用中配置了 Windows\
  \ 身份验证，SignalR 可以利用该身份保护 hub。然而，要向单个用户发送消息，需要添加自定义的用户 ID 提供程序。需要注意的是，Windows 身份验证系统不提供名称标识声明（name\
  \ identifier claim），SignalR 依赖它来确定用户名。\n\n请注意，虽然 Microsoft Edge 支持 Windows 身份验证，但并非所有浏览器都支持。例如，在\
  \ Chrome 和 Safari 中尝试使用 Windows 身份验证和 WebSockets 将失败。在这种情况下，客户端将尝试回退到可能起作用的其他传输方式，如下例所示：\n\
  \n```csharp\nvar connection = new HubConnectionBuilder()\n.WithUrl(\"https://example.com/chathub\"\
  , options =>\n{\noptions.UseDefaultCredentials = true;\n})\n.Build();\n```\n\n###\
  \ 声明 (Claims)\n\n在身份验证用户的应用程序中，要从用户声明中派导出 SignalR 用户 ID，你可以实现 `IUserIdProvider`\
  \ 接口并注册该实现。通过实现此接口，你可以指定 SignalR 如何根据用户的声明创建用户 ID，如下例所示，我们从用户声明中获取电子邮件值：\n\n```csharp\n\
  public class SampleEmailProvider : IUserIdProvider\n{\npublic virtual string GetUserId(HubConnectionContext\
  \ connection)\n{\nreturn connection.User?.FindFirst(ClaimTypes.Email)?.Value!;\n\
  }\n}\n```\n\n### hub 及其 hub 方法的授权策略\n\n要对 hub 中的方法强制身份验证，可以将 `[Authorize]` 特性应用到\
  \ hub 本身。默认情况下，hub 中的所有方法都需要身份验证才能被访问。此属性确保只有经过身份验证的用户才能调用 hub 方法。\n\n此外，你可以通过提供构造函数参数和属性来自定义\
  \ `[Authorize]` 特性，将访问限制为匹配特定策略的用户。例如，你可以指定一个名为 `SampleAuthorizationPolicy` 的自定义授权策略，只有符合该策略的用户才被允许访问\
  \ hub。\n\n此外，如果你想按方法应用授权，可以将 `[Authorize]` 特性应用到单个 hub 方法上。在这种情况下，如果当前用户不满足应用到方法的策略，则将向调用者返回错误，指示缺少权限。\n\
  \n通过利用 `[Authorize]` 特性，你可以强制执行身份验证和授权规则来控制对 hub 方法的访问，并确保经过授权的用户可以调用它们。\n\n```csharp\n\
  [Authorize(\"SampleAuthorizationPolicy\")]\npublic class SampleHub : Hub\n{\npublic\
  \ override async Task OnConnectedAsync()\n{\nawait Clients.All.SendAsync(\"ReceiveSystemMessage\"\
  , $\"{Context.UserIdentifier} joined.\");\nawait base.OnConnectedAsync();\n}\n\n\
  [Authorize(\"Administrators\")]\npublic void BanUser(string userName)\n{\n// ...\
  \ 将用户封出聊天室（只有管理员才能执行的操作） ...\n}\n}\n```\n\n### 授权处理程序\n\n默认情况下，SignalR 提供了一个健的内置授权框架，允许你对用户进行身份验证和授权。然而，在某些场景下，你可能需要实现自定义逻辑来执行额外的访问限制或业务规则。这就是自定义授权策略用用场。\n\
  \n自定义授权策略让你能够定义自己的规则和标准，以授予或拒绝对 SignalR 应用程序中特定功能或能力的访问。通过自定义策略，你可以灵活地控制谁可以执行某些操作，例如发送消息、加入特定组或访问敏感数据。\n\
  \n### 流式传输 hub (Streaming hub)\n\n\n\n\n\n在 ASP.NET Core SignalR 中，你可以利用流式（streaming）通过片段或块在客户端和服务器之间传输数据。流式传输在数据随时间逐渐到达的场景中特别有用，它允许在每个片段可用时立即将其发送到客户端或服务器。\n\
  \n通过流式传输，你不需要等待整个数据集准备好后再发送。相反，你可以在数据片段可用时就开始发送，从而提供更具响应性且更高效的通信机制。\n\n这种能力实现了实时数据流和处理，使其适用于实时更新、媒体流传输和处理大型数据集等各种用例。\n\
  \n通过利用 ASP.NET Core SignalR 的流式功能，你可以在应用程序中实现更高效的数据传输、改进的响应能力并增强实时能力。\n\n## 服务器到客户端的流式\
  \ hub\n\nASP.NET Core SignalR 允许你在服务器和客户端之间执行流式传输。你可以选择从流式 hub 方法返回 `IAsyncEnumerable<T>`\
  \ 或 `ChannelReader<T>`。\n\n要返回 `IAsyncEnumerable<T>`，你可以将 hub 方法编写为异步迭代器方法。这种方法简化了实现，并确保恰当地返回\
  \ `ChannelReader`。你还可以在异步迭代器方法中包含 `CancellationToken` 参数以处理客户端取消订阅。\n\n在使用服务器到客户端的流式\
  \ hub 方法时，处理客户端断开连接至关重要。通过接受 `CancellationToken` 参数，你可以检测客户端何时从流中取消订阅。你可以使用此令牌优雅地停止服务器操作并释放任何相关资源。\n\
  \n使用这些技术，你可以有效地在客户端和服务器之间传输数据，确保妥善处理客户端的订阅、取消订阅和断开。\n\n## 客户端到服务器的流式 hub\n\n当 hub\
  \ 方法接受一个或多个类型为 `ChannelReader<T>` 或 `IAsyncEnumerable<T>` 的对象时，它将自动变为客户端到服务器的流式\
  \ hub 方法。这允许客户端向服务器发送流式数据。\n\n在以下示例中，你可以看到如何读取从客户端发送的流式数据。客户端将数据写入 `ChannelWriter<T>`，而服务器上的\
  \ hub 方法从相应的 `ChannelReader<T>` 读取这些数据。\n\n通过利用此功能，你可以在客户端和服务器之间建立流式连接，实现高效且持续的数据传输。\n\
  \n## 案例研究\n\n欢迎来到案例研究，我们将在开发实时聊天应用程序应用于 SignalR 配置、身份验证与授权以及自定义策略的概念。本案例研究将为你提供一个实用的演示，展示这些元素如何结合创建一个安全且高效的实时通信平台。\n\
  \n在整个案例研究过程中，我们将专注于构建一个健壮的聊天应用程序，使用户能够实时交换消息。我们将从在 ASP.NET 应用程序中配置 SignalR 开始，为实时通信奠定坚实的基础。这包括设置必要的\
  \ hub、建立连接以及定义预期的行为。\n\n接下来，我们将处理身份验证和授权这一关键方面。我们将实现一个安全的登录系统，并探索 SignalR 可用的 Entity\
  \ Framework Identity 身份验证机制。我们还将深入研究自定义策略的创建，以控制对聊天应用程序的访问，确保只有经过身份验证的用户才能参与。\n\n\
  为了增强用户体验并保持聊的完整性，我们将实现一个示例自定义策略。我们将探索如何使用 SignalR 内置的授权框架来实现这些策略，使你能够根据特定需求定制聊天应用程序。\n\
  \n现在，让我们开启这段案例研究之旅程吧，我们将汇聚 SignalR、身份验证、授权和自定义策略的力量，创建一个安全且功能丰富的实时聊天应用程序。准备好进入带有\
  \ SignalR 的激人的实时通信世界吧！\n\n### 项目设置\n\n首先，我们创建一个类型为 Web Application 的项目，并添加客户端库 `@microsoft/signalr@latest`。\n\
  \n要执行此操作，你应该右键点击项目 | `Add` | `Client-side library`。如下所示所示搜索 SignalR 库：\n\n![](img/Figure_9.1.png)\n\
  \n图 9.1：添加 SignalR 客户端库。\n\n在成功添加客户端库后，你的项目应该如下图所示：\n\n![](img/Figure_9.2..png)\n\
  \n图 9.2：添加 SignalR 客户端库后的项目解决方案。\n\n### 创建 Hub\n\n现在，让我们创建一个负责客户端之间通信的 Hub。\n\n\
  添加一个新类，它必须继承自 `Hub`。示例 `Hub` 类如下：\n\n```csharp\npublic class SampleHub : Hub\n{\n\
  \    public async Task SendMessageToAll(string message)\n    {\n        await Clients.All.SendAsync(\"\
  ReceiveMessage\", message);\n    }\n    public async Task SendMessageToCaller(string\
  \ message)\n    {\n        await Clients.Caller.SendAsync(\"ReceiveMessage\", message);\n\
  \    }\n    public async Task SendMessageToUser(string connectionId, string message)\n\
  \    {\n        await Clients.Client(connectionId)\n        .SendAsync(\"ReceiveMessage\"\
  , message);\n    }\n    public async Task JoinGroup(string group)\n    {\n     \
  \   await Groups.AddToGroupAsync(Context.ConnectionId, group);\n    }\n    public\
  \ async Task SendMessageToGroup(string group, string message)\n    {\n        await\
  \ Clients.Group(group).SendAsync(\"ReceiveMessage\", message);\n    }\n    public\
  \ override async Task OnConnectedAsync()\n    {\n        await Clients.All.SendAsync(\"\
