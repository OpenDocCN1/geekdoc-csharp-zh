  \ `Create` 继续：\n![](img/Figure_4.3..png)\n\n图 4.3：为 Azure Function 选择触发器。\n\n创建函数后，您将看到输出，表示您的函数已成功创建。此时，您的函数已准备好运行，并且将将提供的样板代码作为起点。此代码是实现符合函数特定需求逻辑的基础。\n\
