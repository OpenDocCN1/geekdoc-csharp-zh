- "# C# 12 云端、Web 及桌面应用：使用 C# 12 进行软件开发的现代概念与技术\n\n\n\n![](img/cover.jpg)\n\n![封面](img/cover.jpg)\n\
  \n2024 年第一版\n\n\n\n\n\n\n\n\n\n献给\n\n我亲爱的父母：\n\nCarlos Roberto Coutinho de Araujo\n\
  \nSonia Maria Pereira Vivas\n\n# 关于作者\n\nThiago 是一位对软件开发以及构建可靠软件过程中的复杂性充满热情的巴西专家。Thiago\
  \ 拥有超过 12 年的软件开发经验，并曾在 Oi、Accenture、里约 2016 奥运会、Altice Portugal、Vodafone 和 Microsoft\
  \ 等大公司工作过。\n\n作为内容创作者，Thiago 已经发表了 60 多篇技术文章，帮助了超过 200 万知识寻求者，主要编写 C#、DevOps 和云开发。\n\
  \n# 关于审稿人\n\n*   Tomasz Kocurek 是一位 .NET 开发者。他毕业于克拉科夫 AGH 大学电气工程、自动化、计算机科学和电子学院的应用计算机科学专业。他曾在多个行业工作过：人工智能、机器人制作、加密货币、虚拟现实、医学、电子文档流通、数据保护、交通和导航。他对人工智能感兴趣，尤其是医疗领域。他的硕士论文是使用机器学习进行血液检测。他热爱阅读。他试图在科学的每个领域发现有趣之处。他喜欢谈论新技术。他创建了文档、维基以及一些带有项目信息的应用程序，因为数据是无价的。他对数学、打桥牌和足球感兴趣。\n\
  \n*   Denis Kazakov 在软件行业工作了超过 17 年，在不同的业务和环境中拥有丰富的经验，从大企业到初创公司以及自由职业者。\n\n他从开发者开始，担任过技术和开发领导职务。今天\
  \ Denis 的重点是云技术以及使用 Azure 和 .NET 进行开发。Denis 是教育初创公司 `Similearn.com` 的创始人，他现在在那里工作。Denis\
  \ 经常通过开发者论坛、开源项目和博客文章为 IT 社区做出贡献。Denis 曾四次获得微软授予的 Azure 类“最有价值专业人士 (MVP)”。\n\n*\
  \   Dirk Strauss 是一位经验软件开发者，拥有超过 19 年使用 C# 和 Visual Studio 的经验。他有幸与几家公司合作，并向行业内最有才华的人学习。除了专业经验外，他还出版了多本关于\
  \ C#、Visual Studio 和 ASP.NET Core 等主题的书。他对编程的热情坚定不，并致力于跟上最新技术，同时与他人分享他的专业知识。\n\n\
  # 致谢\n\n我非常感谢我亲爱的父母和姐姐对我的无条件支持。他们的鼓励支持我走过了这段旅程中的起起伏。尽管他们对软件开发的复杂性感到困惑，但他们对我坚定的信念一直是我的指路明灯。感谢一切；我爱你们。\n\
  \n感谢来自葡萄牙里斯本的朋友们，感谢你们理解我在沉浸于本书深处时偶尔的失踪。你们的耐心、情谊以及偶尔提供的啤酒让这段旅程变得更加忍忍，让深夜的时光更加愉快。感谢你们每位参与了这场冒险；下一轮酒我请客！\n\
  \n感谢来自巴西里约热内卢 Complexo da Chumbada 的童年朋友们，多年来你们不移的支持和情谊是我巨大力量和灵感的来源。从我们社区的街道到这本书的页面，你们的友谊一直是指路明灯。感谢那些无数的记忆、笑声和共同的冒险，它们塑造了今天的我。你们的友谊倍受珍惜，我对我们之间的纽带表示感激。\n\
  \n# 前言\n\n本书涵盖了网络爬虫的许多不同方面以及网络爬虫自动化的重要性。本书还介绍了网络爬虫在实时工业领域的重要性。它展示了数据对于行业是多么重要。本书解决了数据世界中网络爬虫/采集的基础理解问题。它还强调了学习\
  \ Python 的重要性，以便刷新 Python 的基本概念。本书提供了关于 Python 在网络爬虫中用处的信息。\n\n本书为网络爬虫学习者采取了实用的方法。它还涵盖了一些实时工业案例。它将涵盖如\
  \ Python 基本用于自动化、机器学习等信息。它可以用于轻松的数据处理和转换。被用于不同领域的数据挖掘之中。你可以为金融、零售等不同领域的端到端自动化设计\
  \ API 访问框架。\n\n本书分为 14 章。这些章节将涵盖 Python 基础、网络爬虫的基础和高级知识、为什么 Python 更适合网络爬虫、网络爬虫的实时示例等。因此，学习者也可以对网络爬虫工具产生更多兴趣。详细列表如下：\n\
  \n第 1 章：Visual Studio 2022 简介 - 读者将探索重新设计的界面、增强的代码分析工具以及新的调试和测试功能。本章旨在为开发者提供利用 Visual\
  \ Studio 最新功能提高生产力和效率所需的知识和工具。\n\n第 2 章：C# 12 的新功能 - 无论是经验丰富的还是刚接触 C#，本章都提供了关于不断发展的\
  \ C# 环境的宝贵见解，使开发者能够利用最新的工具和进展进行高效编码。\n\n第 3 章：精通 Entity Framework Core - 它探索了数据库优先和代码优先的方法，涵盖了架构创建和数据模型生成。解释了数据建模概念、数据注解和自定义。本章还处理了数据管理任务，如使用\
  \ LINQ to Entities 查询和修改数据，并附有示例。\n\n第 4 章：入门 Azure Functions - 涵盖了触发器和绑定，探索了 HTTP、计时、Blob\
  \ 和队列触发器，提供了详细的设置说明和最佳实践。本章还解释了绑定如何促进与 Blob Storage 和 Cosmos DB 等 Azure 服务交互，通过绑定示例演示数据访问和操作。\n\
  \n\n\n\n\n\n为每种服务提供分步骤的说明和核心概念。从创建和连接 `Azure SQL Database` 实例，到理解 `Cosmos DB` API\
  \ 以及处理 `Blob Storage` 容器，读者将获得如何在其 `.NET` 应用程序中有效利用这些服务的宝贵见解。\n\n探索了`队列、主题和订阅`等核心概念，为实现提供了实用的说明和最佳实践。从理解消息模式到配置消息会话（message\
  \ sessions）和死信队列（dead-letter queues）等高级功能，读者将获得使用 `Azure Service Bus` 构建健壮且可扩展的消息解决方案的宝贵见解。\n\
  \n重点关注身份验证，本章引导读者创建和配置 `Key Vault` 实例、存储密钥以及安全地访问敏感数据。通过分步骤的说明以及对身份验证选项（包括客户端证书和\
  \ `Azure Active Directory` 身份验证）的覆盖，为开发者提供了知识和工具，以确保其应用程序拥有稳健的安全措施。\n\n\n从概述 `SignalR`\
  \ 的优势开始，涵盖了使用 `ASP.NET` 和 `Visual Studio` 进行项目设置，探索了如 `WebSockets` 和服务器发送事件（Server-Sent\
  \ Events）等多种传输协议。\n\n涵盖了微服务架构以及使用 `Web APIs` 的优势。详细介绍了设计可扩展架构的方法，包括服务发现、负载均衡和容错机制。通过探索水平扩展、垂直扩展和自动扩展等扩展技术，提供了实用的说明、最佳实践以及需要避免的陷阱，使开发者能够创建健壮的微服务架构。\n\
  \n从概述 `Docker` 和 `Azure DevOps` 开始，演示了如何自动化 CI-CD 流程。涵盖了构建和部署容器化应用的 `Docker` 命令，解释了\
  \ CI-CD 概念及其在简化开发和部署中的作用。本章介绍了如何使用 `Azure DevOps` 配置构建流水线、发布流水线和环境管理。\n\n探索了其在创建各种平台应用方面的作用。本章介绍了\
  \ `Blazor Hybrid` 及其与 `.NET MAUI` 的集成，将其与 `Blazor` 进行对比，以突出它们各自的优缺点。解释了 `Blazor\
  \ Hybrid` 如何让能够构建与 `.NET MAUI` 无缝集成的响应式 `UIs`。\n\n从介绍 `WinUI` 开始，深入探讨它如何促进响应式桌面应用的开发。通过探索`Fluent\
  \ 设计系统（Fluent Design System）`的原理（包括深度和动态），演示了如何使用 `WinUI` 的`UI `来实现吸引人的用户界面。\n\n\
  使用 `nUnit` 和 `xUnit` 编写有效的单元测试以确保代码可靠性。发现自动化测试框架以提高代码质量。深入使用 `C#` 工具进行调试，掌握`断点（breakpoints）`和`变量检查（variable\
  \ inspection）`等技术以高效解决错误，最终提升开发者的效率。\n\n\n请点击链接下载书籍的`代码包`和`彩色插图片`：\n\n\n该书的代码包也托管在\
  \ GitHub 上：[`github.com/bpbpublications/CSharp12-For-Cloud-Web-and-Desktop-Applications`](https://github.com/bpbpublications/CSharp12-For-Cloud-Web-and-Desktop-Applications)。如果代码有更新，将在现有的\
  \ GitHub 仓库中更新。\n\n我们从丰富的书籍和视频目录中提供了代码包，地址为 [`https://github.com/bpbpublications`](https://github.com/bpbpublications)。欢迎去查看！\n\
  \n\n我们对 BPB Publications 的工作感到非常自豪，并遵循最佳实践以确保内容的准确性，为订阅者提供沉浸式的阅读体验。读者是我们的镜子，我们利用他们的反馈来反映并改进出版过程中可能出现的任何人为错误。为了便于我们维护质量并帮助可能因不可预见错误而遇到困难的读者，请通过以下邮箱联系我们：\n\
  \nerrata@bpbonline.com\n\nBPB Publications 全体非常感谢您的支持、建议和反馈。\n\n\n加入书籍的 Discord\
  \ 工作区，获取最新更新、优惠、全球技术动态、新书发布以及与作者交流的机会：\n\n[`discord.bpbonline.com`](https://discord.bpbonline.com)\n\
  \n![](img/fm1.png)\n\n\n\n本章探索了微软交互式开发环境的最新功能和改进。新版本的 `Visual Studio` 为开发者提供了更好的生产力和协作能力。章节涵盖了重大变化，包括引入\
  \ 64 位架构、性能提升以及与 `Azure` 服务的深度集成。\n\n本章介绍了 IDE 用户界面的重大更新，包括更新的启动窗口、重新设计的搜索体验以及全新的图标。本章还涵盖了增强的代码分析功能，包括代码建议、自动修复和智能代码完成。此外，本章深入探讨了新的调试和测试功能，包括实时单元测试、快照调试和时间旅行调试。\n\
  \n\n本章涵盖了以下主题：\n\n*   实时单元测试\n*   快照调试\n*   时间旅行调试\n## 目标](#contents.xhtml_sc2_3a)\n\
  \n在本章结束时，读者将牢固理解 Visual Studio 2022 引入的主要变化和新功能，包括实时单元测试、快照调试和时间旅行调试。他们将具备必要的知识，以便在云端、Web\
  \ 和桌面应用程序的 `C#` 开发流中有效利用这些工具。\n## Visual Studio 2019 的重大变化](#contents.xhtml_sc2_4a)\n\
  \n\n\nVisual Studio 2022 与 Visual Studio 2019 相比有了显著改进和增强。这些包括更现代、更直观的用户界面，刷新了视觉主题、简化的工具栏和菜单。性能得到了优化，提供了更快的操作，例如\
  \ .NET SDK 风格项目的生成加速、更快的“在文件中查找”功能以及改进的 Git 工具速度。Visual Studio 2022 现在是一个 64 位应用程序，能够更好地利用系统资源。新功能的引入，如代码文件的热重载（Hot\
  \ Reload）、增强的提交图以及对多个仓库更好的支持，提升了整体开发体验。此外，Razor 和 C# 体验也取得了进展，包括改进的代码导航、更智能的 IntelliCode\
  \ 建议以及更好的代码格式化。通过这些更改，Visual Studio 2022 为开发者提供了一个更高效、高生产力且愉快的开发环境。\n\n\nVisual\
  \ Studio 2022 引入了一系列性能改进，增强了开发者的开发体验。这些改进针对 IDE 的各个领域，包括 .NET SDK 风格项目的生成加速、外部源反编译、`Threads\
  \ Window`（线程窗口）、`Quick Add Item`（快速添加项）、代码覆盖以及 Razor 和 C# 体验。\n\n让我们深入探讨这些增强功能：\n\
  \n*   **.NET SDK 风格项目的生成加速**：Visual Studio 2022 整合了更快速生成时间的优化，特别是针对 `.NET SDK` 风格的项目。通过将生成过程提升了高达\
  \ 80%，开发者可以感受到等待时间的缩短，从而实现更快的迭代并提高生产力。\n*   **外部源反编译**：此改进允许即使在源文件是外部的情况下也能进行导航和调试，速度比\
  \ Visual Studio 2019 快 10 倍。\n*   **在文件中查找**：通过增强的搜索索引、并行处理、更智能的搜索算法、搜索结果预览和高级过滤选项，开发者可以在代码库中以\
  \ 3 倍的速度定位所需信息，减少了搜索时间并提高了整体生产力。\n*   **Git 工具**：Visual Studio 2022 引入了名为 `Commit\
  \ Graph`（提交图）的新功能，增强了 IDE 内 Git 提交的可视化和导航。Visual Studio 2022 中的 `Commit Graph` 显示出性能的显著提升，分支历史的平均加载时间减少了\
  \ 70%。\n*   **线程窗口**：Visual Studio 2022 中的 `Threads Window` 经过了性能改进，为具有许多线程的应用程序提供了更响应、更高效的调试。开发者现在可以轻松地分析和管理线程，对多线程应用程序获得更深的见解，并提高整体调试生产力。\n\
  *   **快速添加项**：Visual Studio 2022 引入了 `New Item`（新建项）菜单命令，加速了向项目添加新项的过程。有了此增强，开发者可以快速添加多个文件和文件夹，简化了项目的创建和修改过程。\n\
  *   **代码覆盖**：Visual Studio 2022 中的代码覆盖分析经过了优化，代码覆盖测试速度快了 35%。开发者现在可以更高效地衡量测试的代码覆盖率，允许他们识别缺乏测试覆盖的代码区域并提高整体代码质量。\n\
  \n凭借 Visual Studio 2022 的这些性能改进，开发者可以期望一个更高效、响应的开发环境。.NET SDK 风格项目的生成加速、外部源反编译、`Threads\
  \ Window` 的改进、`Quick Add Item` 功能、增强的代码覆盖分析以及优化的 Razor 和 C# 体验共同提升了生产力并简化了开发流程，使开发者能够更高效地交付高质量应用程序。\n\
  \n\nVisual Studio 2022 的重大增强之一是转变为 64 位应用程序。这种从 32 位到 64 位架构的转变为开发者带来了许多优势和益处。\n\
  \n\n*   **增加内存访问**：作为一种 64 位应用程序，Visual Studio 2022 可以利用 64 位系统提供的扩展内存地址空间。这允许 IDE\
  \ 访问大量内存，使开发者能够在不面对内存限制或性能问题的情况下处理更大、更复杂的项目。开发者现在可以处理包含更多项目的解决方案，利用 64 位架构提供的扩展内存支持。\n\
  *   **与 64 位工具和库的兼容性**：作为 64 位应用程序，Visual Studio 2022 与其他 64 位工具、库和组件无缝集成，确保了兼容性和互操作性。开发者可以充分利用开发生态系统中\
  \ 64 位技术提供的进步和优化。\n*   **面向未来**：转变为 64 位应用程序为 Visual Studio 2022 的未来增长和可扩展性奠定了基础。它符合行业向\
  \ 64 位计算的趋势，并确保 IDE 能够满足现代开发环境和技术不断变化的需求。\n\n\n\n基于示例的程序合成（PROSE）技术是微软研究院开发的一种自动化的程序合成框架。它允许开发者根据输入-输出示例自动生成代码，实现快速原型设计和开发。PROSE\
  \ 利用机器学习和编程语言技术来理解并泛化从提供的示例中提取的模式，减少编写代码所需的人工努力。它已应用于多个领域，包括数据整理、API 使用和代码重构。PROSE\
  \ 旨在通过基于示例的程序合成自动处理重复编码任务来提高开发者生产力。\n\nVisual Studio 2022 中的 `IntelliCode` 在你输入代码时积极分析代码更改，利用\
  \ PROSE 技术识别手动代码修改的常见模式。通过识别开发者通常如何执行可自动代码更改，`IntelliCode` 提供有用的建议以简化你的编码流程。当你执行代码修复或重构时，`IntelliCode`\
  \ 会在补全列表中显示建议，让你只需点击一下即可完成代码更改。`IntelliCode` 提供的这种智能帮助优化了你的编码体验，让你工作得更高效、更准确。\n\n\
  \n新的 Razor 编辑器引入了额外的代码修复和重构，包括流行的“添加缺失的命名空间”（Add missing usings）重构。它还提供了 Razor 特有的重构，如“将块提取到后台代码”（Extract\
  \ block to code behind），方便将代码块提取到单独的文件。\n\n导航支持通过组件的“转到定义”（Go to Definition）功能得到了改进，允许在文件内进行快速导航以更好地理解代码。\n\
  \n\n\n\n新的 Razor 编辑器支持最新的编译器功能，提供了更智能的 Razor 语法补全，例如 `<text>` 补全和自动完成。诊断信息经过精简，仅显示最重要的问题，并保持了编译器生成的诊断信息的预期保真度。\n\
  \n\n## 具有新功能的热重载\n`Hot Reload` 技术的引入带来了与 `XAML Hot Reload` 同时无缝代码文件更新，适用于使用 `XAML`\
  \ 构建 UI 的应用程序。无论您使用的是 `XAML` 还是 `.NET`，可以使用 `Hot Reload`，提供强大的开发体验。`Hot Reload`\
  \ 与断点、“编辑并继续”(EnC) 以及其他基本功能等熟悉的调试能力无缝集成。\n\n在此版本中，`Hot Reload` 兼容多种类型的应用程序。它可以轻松运行于基于\
  \ `XAML` 的应用程序，如 `WPF`、`.NET MAUI` 和 `WinUI 3`，以及其他框架，如 `Windows Forms`、`ASP.NET`\
  \ Web 应用程序、`Blazor Server`、控制台应用等。本质，只要在现代 `.NET` 运行时配合 `Visual Studio` 调试器使用，`Hot\
  \ Reload` 就能显著增强您的开发工作流。\n\n\n`Visual Studio 2022` 现在提供对多个仓库的支持，允许您同时处理多达 10 个活跃的\
  \ `Git` 仓库。此功能实现了跨多个仓库解决方案的无缝协作和高效管理。您可以在各个仓库之间并发执行 `Git` 操作，简化您的工作流。\n\n例如，在一个大型\
  \ Web 项目中，您可能为前端、`API`、数据库、文档以及各种库或依赖项拥有独立的仓库。以前，跨这些仓库的工作需要打开多个 `Visual Studio`\
  \ 实例。然而，有了多仓库支持，您现在可以在单个 `Visual Studio` 实例中处理、查看和调试所有这些仓库。这种能力通过消除在不同 IDE 实例之间切换的需要，提高了生产力，并允许在多个仓库之间获得统一且连贯的开发体验。\n\
  \n\n行级暂存（Line-staging）允许您将修改过的代码行划分到单独提交中，为管理更改提供了更高的灵活性。可以利用此功能在最终完成提交之前审查您的改动。通过选择性地暂存特定的代码行或区域，您可以将它们标记为已审核，确保在提交前进行彻底的核查。一旦您对暂存的更改感到满意，就可以继续进行提交，从而提供了一种受控且组织化的方法来将您的修改纳入代码库。\n\
  \n## 界面改进与自定义\n`Visual Studio 2022` 引入了全新且现代的外观和感受，提升了整体开发者体验。新设计带来了整洁且直观的界面，为软件开发提供了一个更精简、视觉上吸引力的环境，如下所示所示：\n\
