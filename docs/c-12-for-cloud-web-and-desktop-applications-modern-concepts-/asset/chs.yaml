  \n## 根据需求进行配置\n\n从“工具 | 选项”（Tools | Options）菜单中，你可以根据需求自定义实时单元测试：\n![](img/Figure_1.7..png)\n\
  \n图 1.7：配置实时单元测试的选项窗口\n\n\nApplication Insights 中提供的快照调试器（Snapshot Debugger）能够让你在发生异常时，轻松收集\
  \ Web 程序的调试快照。这一宝贵的快照揭示了异常发生准确时刻源代码和变量的精确状态，让你有机会模拟触发该异常的场景。\n\nApplication Insights\
  \ 中快照调试器的主要功能：\n\n- 监控来自 Web 应用的系统日志。\n- 提供在生产环境中诊断、模拟和解决问题所需的关键信息。\n\n## 使用快照调试\n\
  以下步骤说明了快照调试的局限性，并提供了如何无缝设置的完整说明。\n\n### 1. 在应用程序中安装 NuGet 包\n\n`Microsoft.ApplicationInsights.SnapshotCollector`\n\
  ### 2. 在应用程序中配置 Application Insights\n\n#### 针对 ASP.NET \n\n\n```xml\n<TelemetryProcessors>\n\
  \  <Add Type=\"Microsoft.ApplicationInsights.SnapshotCollector.SnapshotCollectorTelemetryProcessor,\
  \ Microsoft.ApplicationInsights.SnapshotCollector\">\n    <!-- 默认值为 true，但你可以通过设置为\
  \ false 来禁用快照调试 -->\n    <!-- 快照调试通常在开发模式下禁用，但你可以通过将其设置为 true 来启用它。 -->\n    <!--\
  \  DeveloperMode 是活动 TelemetryChannel 上的属性。 -->\n    <IsEnabledInDeveloperMode>false</IsEnabledInDeveloperMode>\n\
  \    <!-- 在请求快照之前，我们需要看到异常的多少次。 -->\n    <ThresholdForSnapshotting>1</ThresholdForSnapshotting>\n\
  \    <MaximumSnapshotsRequired>3</MaximumSnapshotsRequired>\n    <!-- 我们任何时候跟踪的问题最大数量。\
  \ -->\n    <MaximumCollectionPlanSize>50</MaximumCollectionPlanSize>\n    <!-- 重新连接到端点的频率。默认值为\
  \ 15 分钟。-->\n    <ReconnectInterval>00:15:00</ReconnectInterval>\n    <ProblemCounterResetInterval>1.00:00:00</ProblemCounterResetInterval>\n\
  \    <!-- 十分钟内允许的快照最大数量。默认值为 1\\。 -->\n    <SnapshotsPerTenMinutesLimit>3</SnapshotsPerTenMinutesLimit>\n\
  \    <!-- 每天允许的快照最大数量。 -->\n    <SnapshotsPerDayLimit>30</SnapshotsPerDayLimit>\n\
  \    <SnapshotInLowPriorityThread>true</SnapshotInLowPriorityThread>\n    <!-- 同意向微软发送匿名数据以改进此产品。\
  \ -->\n    <ProvideAnonymousTelemetry>true</ProvideAnonymousTelemetry>\n    <!--\
  \ 在遥测处理器被禁用之前，请求快照的失败请求限制。 -->\n    <FailedRequestLimit>3</FailedRequestLimit>\n\
  </TelemetryProcessors>\n```\n\n2. 针对 ASP.NET Core\n\n1. 创建一个名为 `SnapshotCollectorTelemetryFactory`\
  \ 的新类：\n```csharp\nusing Microsoft.ApplicationInsights.AspNetCore;\nusing Microsoft.ApplicationInsights.Extensibility;\n\
  using Microsoft.ApplicationInsights.SnapshotCollector;\nusing Microsoft.Extensions.Options;\n\
  internal class SnapshotCollectorTelemetryFactory : ITelemetryFactory\n{\n    private\
  \ readonly IServiceProvider _serviceProvider;\n    public SnapshotCollectorTelemetryFactory(IServiceProvider\
  \ serviceProvider) =>\n    _serviceProvider = serviceProvider;\n    public ITelemetry\
  \ Create(ITelemetryProcessor next)\n        IOptions<SnapshotCollectorConfiguration>\
  \ snapshotConfigurationOptions = _serviceProvider.GetRequiredService<IOptions<SnapshotCollectorConfiguration>>();\n\
  \        return new SnapshotCollectorTelemetryProcessor(next, configuration: snapshotConfigurationOptions.Value);\n\
  \    }\n}\n```\n\n\n```csharp\nusing Microsoft.ApplicationInsights.AspNetCore;\n\
  using Microsoft.ApplicationInsights.SnapshotCollector;\nvar builder = WebApplication.CreateBuilder(args);\n\
  builder.Services.AddApplicationInsightsTelemetry();\nbuilder.Services.AddSingleton<ITelemetryProcessorFactory>(sp\
  \ => new SnapshotCollectorTelemetryFactory(sp));\n```\n\n3. 如果你需要自定义，则需要更新 `appsettings.json`。以下是默认配置：\n\
  \n{\n  \"SnapshotCollectorConfiguration\": {\n    \"IsEnabledInDeveloperMode\":\
  \ false,\n    \"ThresholdForSnapshotting\": 1,\n    \"MaximumSnapshotsRequired\"\
  : 3,\n    \"MaximumCollectionPlanSize\": 50,\n    \"ProblemCounterResetInterval\"\
  : \"1.00:00:00\",\n    \"SnapshotsPerTenMinutesLimit\": 1,\n    \"SnapshotsPerDayLimit\"\
  : 30,\n    \"SnapshotInLowPriorityThread\": true,\n    \"ProvideAnonymousTelemetry\"\
  : true,\n    \"FailedRequestLimit\": 3\n  }\n```\n\n\n\n\n\n\n在本书出版时，以下框架和环境支持快照调试（Snapshot\
  \ debugging）：\n\n### 框架\n- `.NET Framework 4.6.2` 及更高版本。\n- Windows 上的 `.NET 6.0`\
  \ 或更高版本。\n### 环境\n- `Azure App Service`\n- `Azure Functions`\n- 运行操作系统 族 4 或更高版本的\
  \ `Azure Cloud Services`\n- 运行在 Windows Server 2012 R2 或更高版本上的 `Azure Service Fabric`\n\
  - 运行在 Windows Server 2012 R2 或更高版本的 `Azure Virtual Machines` 和 `Azure Virtual Machine\
  \ Scale Sets`\n\n# 所需权限和限制条件\n\n以下是所需的权限和限制条件：\n\n- 快照受 Azure 基于角色的访问控制 (`RBAC`)\
  \ 保护。若要检查快照，您必须被添加到 Application Insights 快照调试器角色中。\n- 快照可能包含敏感数据。\n- 快照默认存储 15 天。可以请求增加存储时间。\n\
  - 快照要求服务器上有可用符号文件，以便解码变量并在 `Visual Studio` 中启用调试。\n- 当使用优化后的构建时，可能无法使用本地变量。\n\n\
  # 时间旅行调试（Time Travelling Debugging）\n\n引入时间旅行调试 (`TTD`)，这是一项开创性的功能，允许您直接从生产环境在 `Visual\
  \ Studio` 中录制和重放代码执行过程。`TTD` 超越了传统的调试方法，能够在时间轴上进行无缝导航，类似于在本地进行“内层循环”调试。这意味着您可以轻松地在执行时间线上向前或向后移动，同时保留对本地变量（locals）和调用堆栈（call\
  \ stack）等核心调试功能的访问。\n传统的调试器即使带有如 `IntelliTrace` 等高级工具，通常也只允许在特定断点处停止并只能在时间向前移动。然而，`TTD`\
  \ 与快照、日志或崩溃转储文件（crash dump files）等方法相比具有显著优势。这些传统技术通常缺乏导致最终失败或 Bug 的执行路径精确细节。`TTD`\
  \ 通过捕获精确的执行路径填补了这一空白，为问题背景提供了前所未有的深度，超越了快照和其他方法的局限性。\n\n# 使用时间旅行调试\n\n以下步骤说明了时间旅行调试的局限性，并提供了关于如何轻松设置的全面指南。\n\
  \n\n在时间旅行调试中，录制快照是该过程的基本方面。时间旅行调试允许开发者重放和分析代码的执行情况，通过向前向后移动时间来识别并调试问题。录制快照能够在不同的时间点捕获并保存程序状态，便于探索程序行为和识别\
  \ Bug。\n\n通过 `Debug | Attach Snapshot debugger` 可以挂载（attach）快照调试器：\n\n![](img/Figure_1.8..png)\n\
  图 1.8: 挂载快照调试器的菜单\n\n选择您的虚拟机并勾选两个选项。不要忘记虚拟机的特殊性。\n\n![](img/Figure_1.9.png)\n\n\n\
  选择一个断点，并在断点设置中，您必须勾选“时间旅行跟踪”（time travel trace）选项。\n\n您将在`Diagnostic Tools`（诊断工具）窗口看到录制的快照。\n\
  \n## 查看快照\n一旦录制了快照，您就可以从 `Diagnostic Tools` 窗口播放它并正常使用调试器。\n\n# 时间旅行调试限制\n\n本书出版时，运行\
  \ `TTD` 的要求如下：\n\n- 运行 Windows 且安装了 `ASP.NET 4.8+` 的 `Azure Virtual Machine`\n-\
  \ `AMD64` Web Apps\n\n# 总结\n\n在本章中，我们深入介绍了 `Visual Studio 2022`，重点关注其主要变化。\n\n\n\
  \n通过清晰的解释和实际示例，我们致力于帮助开发者理解每个新特性的优势和应用，使他们编写出更整洁、高效且易于维护的代码。在本章结束时，读者将对 `C# 11`\
  \ 和 `C# 12` 的进展有坚实的理解，并掌握在项目中有效利用这些特性的知识和技能。\n\n# C# 11 更新\n本节将讨论 `C# 11` 中引入的重大更新，这些更新提升了开发能力和代码效率。从主构造函数的引入到内联数组，`C#\
  \ 11` 引入了旨在简化开发流程和提高代码可读性的特性。开发者将探索主构造函数、集合表达式、内联数组、Lambda 表达式中的可选参数、ref readonly\
  \ 参数、任何类型的别名以及内联数组的引入。理解这些变化使开发者能够利用最新的工具和技术在他们的 `C#` 项目中创建健壮、高效且易于维护的代码。\n\n##\
  \ 原始字符串字面量\n\n原始字符串字面量引入了表示字符串的新格式。它们可以包含任意文本，包括空格、换行、嵌入引号和其他特殊字符，而无需转义序列。原始字符串字面量的起始需要至少三个双引号（`\"\
  \"\"`），其结束也镜像对应相同数量的双引号。通常，一个原始字符串字面量使用单行的三个双引号来初始化字符串，并使用另一行的三个双引号来结束它。注意的是，紧跟起始引号之后且结束引号之前的换行符不被视为最终内容的一部分，如下例所示：\n\
  \n```cs\nThis represents a multiline text.\nIt spans across various lines.\nSome\
  \ lines have varying levels of indentation.\nA few start at the first column.\n\
  Quoted text is included within some lines.\n\"\"\";\n\n结束双引号左侧的领先空格会被排除在生成的字符串字面量之外。将原始字符串字面量与字符串插值结合使用，允许在输出文本中包含大括号。连续\
  \ `$` 字符的数量表示插值的开始和结束，决定了输出中大括号的范围，如下所示：\n\n```csharp\nvar locationInfo = $$\"\"\
  \"\nYour current location is at {{{Longitude}}, {{Latitude}}}\n```\n\n在上一个示例图中，两个连续的大括号标记了插值的开始和结束。第三组开启和关闭的大括号在重复时，将成为输出字符串的一部分。\n\
  \n## 泛型数学支持\n\n\n*   **接口中的静态虚拟成员**：你可以在接口中包含静态抽象或静态虚拟成员，允许定义具有可重载运算符、静态成员和属性的接口。这便于在泛型类型中使用数学运算符。例如，通过实现\
  \ `System.IAdditionOperators<TSelf, TOther, TResult>` 接口，一个类型可以支持加法运算符。额外的接口涵盖了各种数学运算或定义的值。语法细节可以在接口文章中查看。通常，带有静态虚拟方法的接口是泛型的，并对类型参数实施约束以实现声明的接口。\n\
  *   **泛型数学要求**：泛型数学的出现对语言提出了特定的要求。\n*   **无符号右移运算符**：`C# 11` 引入了 `>>>` 运算符，允许直接进行无符号右移。以前，实现无符号右移需要将有符号整数转换为无符号类型，执行移位，然后将结果转换回有符号类型。\n\
  *   **松散移位运算符要求**：`C# 11` 移除了第二个操作数必须是 `int` 或隐式转换为 `int` 的要求。此更改允许实现泛型数学接口的类型被用在这些移位运算符的位置。\n\
  *   **检查和未检查用户定义运算符**：开发者现在有能力定义检查（checked）和未检查（unchecked）的算术运算符。编译器根据当前上下文自动生成对相应变体的调用。关于检查运算符的更多详细信息可以在算术运算符的文章中查看。\n\
  这些增强共同为 `C# 11` 中的泛型数学操作提供了一种更通用、更具表现力的方法，如下代码所示：\n\n```csharp\npublic static TResult\
  \ CalculateSum<T, TResult>(IEnumerable<T> data)\n  where T : INumber<T>\n  where\
  \ TResult : INumber<TResult>\n{\n    foreach (var value in data)\n    {\n      result\
  \ += TResult.Create(value);\n    }\n    return result;\n}\n\n  where T : INumber<T>\n\
  \  where TResult : INumber<TResult>\n{\n    TResult sum = CalculateSum<T, TResult>(data);\n\
  \    return TResult.Create(sum) / TResult.Create(data.Count());\n}\npublic static\
  \ TResult CalculateStandardDeviation<T, TResult>(IEnumerable<T> data)\n  where T\
  \ : INumber<T>\n  where TResult : IFloatingPoint<TResult>\n{\n    TResult standardDeviation\
  \ = TResult.Zero;\n    if (data.Any())\n      TResult average = CalculateAverage<T,\
  \ TResult>(data);\n      TResult sum = CalculateSum<T, TResult>(data.Select((value)\
  \ => {\n        var deviation = TResult.Create(value) - average;\n        return\
  \ deviation * deviation;\n      }));\n      standardDeviation = TResult.Sqrt(sum\
  \ / TResult.Create(data.Count() - 1));\n    }\n}\n```\n\n## 泛型属性\n\n你可以现在定义一个基类为\
  \ `Attribute` 的泛型类。这简化了需要 `Type` 参数的属性的语法。类型参数必须遵守 `typeof` 运算符施加的约束。需要元数据标注的类型不允许。例如，以下类型不允许作为类型参数：\n\
  \n*   `dynamic`\n*   `string?`（或空引用类型）\n*   `(int X, int Y)`（或使用 C# 元组语法的任何元组）\n\
  在这种情况下，建议使用底层类型：\n\n*   用 `object` 替换 `dynamic`\n*   优于使用 `string?`\n*   用 `ValueTuple<int,\
  \ int>` 替换 `(int X, int Y)`\n\n\n```csharp\npublic class SampleAttribute : Attribute\n\
  {\n    public SampleAttribute(Type t) => ParamType = t;\n    public Type ParamType\
  \ { get; }\n```\n\n这是我们使用这种泛型属性的方式：\n\n```csharp\npublic class Class1\n    [SampleAttribute(typeof(string))]\n\
  \    public string SampleMethod() => default;\n}\n```\n\n在 `C# 11` 发生这些更改后，这是我们声明泛型属性的方式：\n\
  ```csharp\npublic class SampleAttribute<T> : Attribute { }\n```\n\n这是我们在 `C# 11`\
  \ 中使用泛型属性的方式：\n\npublic class Class1\n{\n    [SampleAttribute<string>()]\n    public\
  \ string Method() => default;\n}\n```\n## Unicode 转换格式-8 字符串字面量\n\n\n\n\n\n\n因此，我们可以在不引入额外代码复杂性的情况下获得最佳性能，而无需声明用于存储\
  \ UTF-8 表示的字段。\n\n通过在字符串字面量后附加 `u8` 后缀，结果类型将变为 `ReadOnlySpan<byte>`。编译器处理字符串数据发射到\
  \ DLL 的方式与之前示例涉及返回 `ReadOnlySpan<byte>` 的静态属性的示例完全相同。因此，我们获得了这种方式的性能优势，而不会带来任何相关的不便。\n\
  \n随着 C# 的变化，我们可以这样写代码：\n```csharp\nReadOnlySpan<byte> SampleStringLiteral = \"Sample\"\
  u8;\n```\n\n可选参数的默认值无法使用 UTF-8 字符串字面量设置，因为它们是运行时常量而非编译时常量。此外，不允许对 UTF-8 字符串字面量进行字符串插值，因为它们不能在同一个字符串表达式中与\
  \ `$` 标记和 `u8` 后缀结合使用。\n\n\n要将 UTF-8 字符串字面量存储为数组，你需要利用 `ReadOnlySpan<T>.ToArray()`\
  \ 将包含字面量的字节复制到可变数组中。\n\n### 字符串插值表达式中的换行\n\n现在，字符串插值由 `{` 和 `}` 包围的内容允许跨多行。`{` 和\
  \ `}` 标记之间的内容被解释为 C#。它接受任何有效的 C# 代码，包括换行符。这一增强简化了字符串插值的可读性，特别是当整合更复杂的 C# 表达式（如模式匹配\
  \ switch 表达式或语言集成查询 LINQ 查询）时。\n有了这些变化，现在是可以可能的：\n\n```csharp\nstring resultMessage\
  \ = $\"The safety guidelines for {score} are {\nscore switch\n{\n    > 80 => \"\
  General usage, with daily safety check\",\n    > 70 => \"Issues must be addressed\
  \ within 1 week\",\n    > 50 => \"Issues must be addressed within 1 day\",\n   \
  \ _ => \"Issues must be addressed before continued use\",\n}}\";\n```\n你可能会观察并认为坚持使用\
  \ `string.Format` 的传统字符串格式化风格更具可读性。我们可以看到在下方使用了相同示例的字符串格式化：\n\n```csharp\nstring\
  \ resultMessage = string.Format(\"The safety guidelines for {0} are {1}\",\nscore,\n\
  score switch\n    > 90 => \"Unlimited usage\",\n    > 80 => \"General usage, with\
  \ daily safety check\",\n    > 70 => \"Issues must be addressed within 1 week\"\
  ,\n    > 50 => \"Issues must be addressed within 1 day\",\n    _ => \"Issues must\
  \ be addressed before continued use\"\n});\n\n虽然你的观点有道理，但在某些情况下，字符串插值仍然是优的。值得注意的是，随着\
  \ C# 11 的引入，字符串插值经历了性能增强，导致了更短的执行时间和更低的内存消耗。我们在下方提供了字符串拼接方式的比较：\n\n*   在上述字符串拼接方法中效率最低的选项是\
  \ `string.Concat()`（接受对象的重载，而非字符串），主要因为它始终对结构体进行装箱（boxing）并生成中间字符串，这通过 ILSpy 的反编译可以观察到。\n\
  *   `+` 和 `string.Concat()`（接受字符串而非对象的重载）表现出略好的性能特征。尽管它们使用了中间字符串，但它们不涉及结构体的装箱。\n\
  *   接下来，`string.Format()` 通常比之前提到的方法高效。它不一定会对结构体装箱，并避免了创建中间字符串，特别是当结构体实现了 `ISpanFormattable`\
  \ 时，这是一个以前是 .NET 内部的性能增强功能。\n\n### 列表模式\n\nList 模式将模式匹配扩展到以适应列表或数组中的元素序列。例如，当条件序列\
  \ `[1, 2, 3]` 代表包含三个整数（1, 2, 和 3）的数组或列表时，该序列求值为为真。这允许使用各种模式匹配元素，例如常量、类型、属性和关系模式。丢弃模式\
  \ `_` 用于匹配任何单个元素，而新引入的范围模式 `..` 则用于匹配任何零或多个元素的序列。\n\n有了这些变化，我们可以得到如下代码：\n```csharp\n\
  int[] values = { 2, 4, 6 };\nConsole.WriteLine(values is [2, 4, 6]);  // True\n\
  Console.WriteLine(values is [2, 4, 8]);  // False\nConsole.WriteLine(values is [2,\
  \ 4, 6, 8]); // False (示例逻辑检查)\n```\n\n如上文所示，列表模式在每个嵌套模式与输入序列对齐时被视为匹配。列表模式内部，你可以灵活地使用任何模式。如果你的目标是匹配任何元素，可以使用丢弃模式。或者，如果你打算捕获该元素，可以使用\
  \ `var` 模式，如下所示：\n\n```csharp\nList<int> elements = new() { 7, 8, 9 };\n{\n    Console.WriteLine($\"\
  The lead element in a three-item collection is {initial}.\");\n}\n```\n\n让我们深入探讨这些模式的意义：\n\
  丢弃模式在匹配序列中的一个或多个元素时非常有用，前提是我们知道序列的长度。\n\n```csharp\nint[] fibonacciSequence = {\
  \ 1, 2, 3, 5, 8 };\nbool matchingResult = false; // 匹配失败，长度不匹配\nmatchingResult =\
  \ fibonacciSequence is [_, _, 3, _]; // 匹配失败，3 的位置不对\n```\nmatchingResult = fibonacciSequence\
  \ is [2, _, 3, _, _]; // 匹配成功，单个元素及其位置和长度匹配\nmatchingResult = fibonacciSequence\
  \ is [1, _, _, _, _]; // 匹配成功，多个元素及其位置和长度匹配\nmatchingResult = fibonacciSequence\
  \ is [1, _, 3, _, _]; // 匹配成功\n```\n\n\n\n\n\n\n对于待比较序列长度未知的的情况，范围模式（Range Pattern）变得非常有价值。该模式中的两个点（..）表示这两个点的位置可以存在任意数量的元素。需要注意的是，这两个点在序列中只能使用一次：\n\
  ```csharp\nint[] customFibonacci = { 1, 2, 3, 5, 8 };\nbool matchingResult = false;\n\
  \n// 匹配结果为 true，因为 customFibonacci 以元素 8 结尾\nmatchingResult = customFibonacci is\
  \ [.., 8];\n// 匹配结果为 false，3 不是倒数第二个元素\nmatchingResult = customFibonacci is [..,\
  \ 3, _];\n\n// 匹配结果为 true，因为序列以 1 开头并以 8 结尾\nmatchingResult = customFibonacci is\
  \ [1, .., 8];\n\nmatchingResult = customFibonacci is [1, ..];\n```\n\n示例所示模式是常量模式（constant\
  \ pattern），在序列中使用了直接数字。相反，可以使用关系模式（relational patterns），允许包含比较表达式，如下代码所示：\n\n```csharp\n\
  bool matchingResult = false;\n\n// 匹配结果为 false，因为 customFibonacci 以元素 8 结尾\nmatchingResult\
  \ = customFibonacci is [.., <8];\n\n// 匹配结果为 true，3 是倒数第三个元素\n\n// 匹配结果为 false，因为第一个元素不大于\
  \ 1\nmatchingResult = customFibonacci is [>1, .., 8];\n```\n\nVar 模式（Var Pattern）提供了使用\
  \ `var` 关键字后接变量名的灵活性，用于捕序列中该位置上的元素。该变量可以在同一作用域内用于各种用途，如下所示，它在模式匹配场景中提供了多灵活性：\n```csharp\n\
  int[] customFibonacci = { 1, 2, 3, 5, 8 };\n\n// 将两个元素赋值给两个变量\nif (customFibonacci\
  \ is [.., var penultimate, var last])\n{\n    Console.WriteLine($\"last = {last}\"\
  );\n}\nelse\n{\n    Console.WriteLine(\"Pattern did not match!\");\n}\n//-------------------------------------------------------\n\
  // Case - 模式不匹配\n//-------------------------------------------------------\nint[]\
  \ someNumbers = { 1 };\nif (someNumbers is [var firstValue, var secondValue, ..])\n\
  {\n    Console.WriteLine($\"secondValue = {secondValue}\");\n}\nelse\n{\n    Console.WriteLine(\"\
  Pattern did not match!\");\n}\n\n### 文件本地类型 (File-local types)\n\n`file` 修饰符将顶层类型的作用域和可见性限制在声明它的文件中。通常，`file`\
  \ 修饰符应用于源生成器（source generator）生成的类型。文件本地类型为源生成器提供了一个方便的解决方案，以防止生成类型之间的命名冲突。`file`\
  \ 修饰符将类型指定为文件本地，如下：\n\n```csharp\n{\n    // implementation\n}\n```\n\n嵌套在文件本地类型内的任何类型同样被限制在声明它的文件可见范围内。程序集中的其他类型可以与文件本地类型共享相同的名称，而不会引起命名冲突。\n\
  文件本地类型不能作为可见性大于文件作用域的成员的返回类型或参数类型。此外，文件本地类型不能作为可见性超过文件作用域的类型的成员。尽管如此，可见性更高的类型可以隐式实现文件本地接口类型。显式实现文件本地接口也是可能的，但此类实现只能在文件作用域内使用。\n\
  \n后续示例演示了一个公共类型使用文件内的机密类型来提供工作方法。此外，该公共类型隐式地实现了文件中定义的本地接口：\n\n```csharp\n// 在 CustomFile.cs\
  \ 中：\n{\n    int OfferSolution();\n}\n\nfile class RestrictedComponent\n{\n}\n\n\
  public class SpecialWidget : ICustomFeature\n{\n    public int OfferSolution()\n\
  \    {\n        return performer.PerformTask();\n    }\n}\n```\n\n在另一个源文件中，可以定义与文件本地类型名称相同的类型。然而，如下代码所示，文件本地类型仍然保持隐藏且不可访问：\n\
  ```csharp\n// 在 AnotherFile.cs 中：\npublic class RestrictedComponent\n{\n    // 这是一个同名的不同类\n\
  }\n\n\n\n\n\n[content]\n```cs\n14. // 使用 ToString 方法显示文章详情\n15. Console.WriteLine(article.ToString());\n\
  16. }\n17. }\n```\n我们遇到了如下错误，如图所示：\n\n![](img/Figure_2.1.png)\n\n图 2.1：尝试初始化未包含必要成员的类时的警告\n\
  \n\nC# 11 编译器保证在构造函数执行期间，将结构体类型中的所有字段初始化为它们的默认值。这一更改确保了任何没有通过构造函数显式初始化的字段或自动属性都会由编译器自动初始化。现在，带有未为所有字段显式赋值的构造函数的结构体可以成功编译，且任何未显式初始化的字段将会被设置为其默认值。\n\
  \n我们可以在下面的示例中看到 C# 11 的变化：\n\n```csharp\n{\n    public ResultInfo(double result)\n\
  \    {\n        ResultValue = result;\n    }\n\n    {\n        ResultValue = result;\n\
  \        Information = information;\n    }\n\n    public ResultInfo(string information)\n\
  \        ResultValue = 0; // double 的默认值\n        Information = information;\n \
  \   }\n\n    public double ResultValue { get; init; }\n    public string Information\
  \ { get; init; } = \"Default result\";\n    public override string ToString() =>\
  \ $\"{ResultValue} ({Information})\";\n}\n\npublic static void Main()\n{\n    var\
  \ data1 = new ResultInfo(8.5);\n\n    var data2 = new ResultInfo();\n    Console.WriteLine(data2);\
  \ // output: 0 (Default result)\n\n    var data3 = default(ResultInfo);\n    Console.WriteLine(data3);\
  \ // output: 0 (Default result)\n```\n\n每个结构体本质上都有一个公共无参数构造函数。如果你选择为结构体实现无参数构造函数，它必须被声明为\
  \ `public`。在结构体包含任何字段初始化器的情况下，则必须显式声明构造函数，该构造函数可以是无参数的，也可以是有参数的。如果结构体声明了字段初始化器但没有任何构造函数，编译器将报告编译错误。当结构体具有显式声明的构造函数（无论带参数还是无参数）时，该结构体的所有字段初始化器都会执行。缺少字段初始化器或未在构造函数中赋值的字段将自动设置为其默认值。\n\
  \n## 对常量字符串进行模式匹配 Span<char> \n\n在过去的多个版本中，模式匹配允许测试字符串是否持有某个特定的常量值。现在，这种模式匹配逻辑也可以应用于\
  \ `Span<char>` 或 `ReadOnlySpan<char>` 类型的变量。\n\n在引入 C# 11.0 之前，仔细研究使用 `Span<T>`\
  \ 和 `ReadOnlySpan<T>` 的原因是非常关重要的。这些类型提供了表示数据子集的有效手段。具体来说，如果你使用 `someString[4..10]`\
  \ 切分字符串的一部分，C# 编译器将生成代码来创建一个包含请求字符拷贝的新字符串对象。然而，当使用 `ReadOnlySpan<char>` 时，不会生成新的数据副本。相反，会创建一个新的\
  \ `ReadOnlySpan<char>`，它指向相同的底层数据，并引用略小的一部分。\n\n考虑一种情况：要检查的字符串是较大字符串的子字符串。在没有 C#\
  \ 11.0 的情况下，使用此类示例将需要编写显式管理子字符串的代码，如下所示：\n\nstring extractedName = document[startIndex..endIndex];\n\
  ```\n\n然而，随着 C# 11.0 的引入，你可以选择不同的方式来表达：\n\n```csharp\n```\n\n创建的 span 没有复制数据；相反，它直接指向\
  \ `doc` 字符串中的相关部分。C# 11.0 中的这一新发现的功能允许你在模式匹配中使用名为 `extractedName` 的 `ReadOnlySpan<char>`，如之前的示例所示。\n\
  \n`ReadOnlySpan<char>` 为处理子字符串提供了一种内存高效的方法。它允许你获取一个指向字符串部分或任何字符值序列的 `ReadOnlySpan<char>`，而无需分配新对象。凭借\
  \ C# 11.0 引入的增强功能，你可以无缝地在字符串常量模式中使用生成的 `ReadOnlySpan<char>`。\n\n\n类型参数名称和参数名称现在可以在方法属性声明的\
  \ `nameof` 表达式作用域内访问。这一增强允许使用 `nameof` 运算符来指示与方法或参数声明本身关联属性中的方法参数名称。这种能力对于结合与可空分析（nullable\
  \ analysis）相关的属性特别有价值。\n\n在更改之前，我们必须执行如下的操作：\n\n```csharp\n{\n    public void CustomMethod(string\
  \ customParam)\n    {\n        var className = nameof(CustomClass);\n        var\
  \ methodName = nameof(CustomMethod);\n        var paramName = nameof(customParam);\n\
  }\n```\n\n现在，我们可以这样做：\n\n```csharp\n{\n    [nameof(TGeneric)]\n    void LocalFunction<TGeneric>(TGeneric\
  \ parameter)\n    {\n        var customLambda = nameof(parameter);\n        Console.WriteLine(parameter);\n\
  }\n```\n\n## 数值 IntPtr 和 UIntPtr (Numeric IntPtr and UIntPtr)\n\n`nint` 和 `nuint`\
  \ 类型现在分别与 `System.IntPtr` 和 `System.UIntPtr` 同义：\n*   `nint` 是 `IntPtr` 的别名，就像 `int`\
  \ 是 `Int32` 的别名一样。\n*   `nuint` 是 `UIntPtr` 的别名，类似于 `uint` 是 `UInt32` 的别名。\n\n在本文编写时，C#\
  \ 支持以下预定义整数类型：\n\n![](img/Figure_2.2.png)\n图 2.2：整数类型比较\n\n## ref 字段和范围 ref (ref\
  \ fields and scoped ref)\n\n从 ref 字段开始，这一修改是底层结构改进的一部分。虽然在普通程序员的日常任务中可能不会频繁使用，但它对热路径（hot\
  \ paths）性能的影响将是可见的。\n\n\n在 C# 11 中，内部类型 `ByReference<T>` 将经历转变，通过将类型定义为 `ref struct`\
  \ 和 `ref field` 变得所有人可见。因此，在 C# 11 中，内部 `Span` 将采用目前类似于下面的的形式，如下代码所示：\n\n```csharp\n\
  readonly ref struct CustomSpan<T>\n{\n    readonly int _customLength;\n\n    public\
  \ CustomSpan(ref T customValue)\n    {\n        _customField = ref customValue;\n\
  \        _customLength = 1;\n}\n```\n\n\n\n\n关于 `scoped ref`，`ref` 参数具有包含 `scoped`\
  \ 修饰符的选项，这向编译器指示该引用被限于当前方法的生命周期。这种限制影响了引用的传递、存储或分配存储的方式。这些语言层面的改进使开发者能够编写更高效的代码，而无需诉助于不安全的特性。通过这些增强，编译器可以强制引用变量的生命周期规则，如下例所示：\n\
  \n```csharp\nCustomSpan<int> GenerateCustomSpan(scoped ref int customParameter)\n\
  {\n    // 方法正体\n```\n\n这使得我们能够通过引用传递整数，同时编译器确保它不会被存储在函数作用范围内的任何地方。目标是防止创建不必要的指针和处理程序。\n\
  \n在下面的代码中，我们可以看到这两项增强的进一步用法，同时使用了 `ref` 和 `scoped ref` 功能：\n\nref struct CustomRefStruct\n\
  {\n    public ref int InternalReference; // 一个 ref 字段\n\n    public CustomRefStruct(ref\
  \ int data)\n    {\n    }\n}\n\npublic class UsageExample\n{\n    public void Demonstrate()\n\
  \        int dataValue = 99;\n\n        using CustomRefStruct customStruct =\n \
  \           new CustomRefStruct(ref dataValue);\n        scoped ref int localReference\
  \ =\n            ref customStruct.InternalReference; // scoped ref 变量\n\n      \
  \  // 在此处使用 localReference\n    }\n}\n```\n\n\n关于方法组转换的 C# 标准现在涵盖了以下方面：\n\n允许（尽管并非强制）利用一个已经包含这些引用的现有委托实例。\n\
  \n在标准的较早版本中，编译器被限制不能重用为方法组转换生成的委托对象。在 C# 11 编译器中，从方法组转换产生的委托对象会被缓存，并随后作为单一委托对象重用。此功能最初作为预览特性在\
  \ Visual Studio 2022 版本 17.2 和 .NET 7 Preview 2 中引入。\n当满足某些条件时，会建立从方法组 (§12.2)到兼容委托类型\
  \ (§20.4)的隐式转换。如果 `D` 代表委托类型而 `E` 是被分类为方法组的表达式，则仅当 `E` 包含至少一个可以在其正常形式 (§12.6.4.2)\
  \ 下针对任何参数列表 (§12.6.2) 用的方法时，`D` 才与 `E` 兼容。参数列表的类型和修饰符必须与 `D` 的参数类型和修饰符匹配，详如下。\n\n\
  从方法组 `E` 到委托类型 `D` 转换的编译时应用涉及以下步骤：\n\n1. 选择一个与形式为 `E(A)` 的调用 (§12.8.9.2) 对应的单个方法\
  \ `M`，修改如下：\n    * 参数列表 `A` 由表达式组成，每个表达式都被分类为变量，并具有与 `D` 的 `formal_parameter_list`\
  \ 中对应参数相同的类型和修饰符（`in`、`out` 或 `ref`）。然而，对于 `dynamic` 类型的参数，对应的表达式类型为 `object` 而不是\
  \ `dynamic`。\n\n2. 通过考虑 §12.8.9.2 的算法来验证转换的存在，该算法应产生与 `D` 兼容 (§20.4) 的单个最佳方法 `M`。\n\
  \n3. 如果选定的方法 `M` 是实例方法，则与 `E` 关联的实例表达式标识委托的目标对象。\n\n4. 如果选定的方法 `M` 是通过实例表达式成员访问指定的扩展方法，则该实例表达式建立了委托的目标对象。\n\
  此转换的结果是一个类型为 `D` 的值，表示指向所选方法及其目标对象的委托。\n\n接接代码示例展示了方法组转换：\n\n```csharp\ndelegate\
  \ string CustomDelegate1(object data);\ndelegate object CustomDelegate3();\ndelegate\
  \ string CustomDelegate4(object data, params object[] args);\ndelegate string CustomDelegate5(int\
  \ value);\n\nclass CustomTestClass\n{\n    static void CustomMethodGroup()\n   \
  \ {\n        CustomDelegate1 delegate1 = CustomMethod; // OK\n        CustomDelegate2\
  \ delegate2 = CustomMethod; // OK\n        CustomDelegate3 delegate3 = CustomMethod;\
  \ // 错误\n        // 不适用\n        // 在正常形式下不适用\n        CustomDelegate5 delegate5\
  \ = CustomMethod; // 错误\n        // 适用但不兼容\n    }\n}\n```\n对 `delegate1` 的赋值涉及从方法组\
  \ `CustomMethod` 到类型 `CustomDelegate1` 值的隐式转换。\n\n对 `delegate2` 的赋值演示了为具有更少派生（逆变）参数类型和更多派生（协变）返回类型的方法创建委托。\n\
  \n相比之下，对 `delegate3` 的赋值强调了当方法不可时不不存在转换。\n\n\n最后，对 `delegate5` 的赋值示例了委托和方法的参数及返回类型允许仅在引用类型之间存在差异。\n\
  \n\n\n\n在本节中，我们将深入探讨 C# 12 中引入的重要更新，这些更新旨在提高开发者的效率和代码表达能力。从基于模式的接口到全局使用指令（global\
  \ using directives）的集成，C# 12 引入了多项简化开发工作流和提高代码可读性的特性。开发者将探索基于模式的接口，它允许更灵活的类型声明和改进的代码组织。此外，全局使用指令的集成简化了命名空间管理，减少了样板代码并增强了代码清晰度。理解这些变化使开发者能够有效利用最新的语言特性，在\
  \ C# 项目中编写更整洁、更简洁且易于维护的代码。\n\n## 主构造函数 (Primary constructors)\n\n现在，主构造函数不再是 record\
  \ 类型的特有；它们可以在任何类或 `struct` 中创建。这些构造函数允许参数在整个类体中可访问。显式定义的构造函数必须使用 `this()` 语法调用主构造函数，以确保所有参数都得到了明确赋值。在类中引入主构造函数将防止编译器生成隐式的无参数构造函数。在\
  \ `struct` 中，隐式的无参数构造函数会将所有字段（包括主构造函数参数）初始化为 0 位位模式。然而，编译器仅为 record 类型中的主构造函数参数生成公共属性，而在非\
  \ record 类或 `struct` 中则不会。\n\n\n```csharp\npublic class Client(string clientName)\n\
  {\n    public string Name { get; } = clientName; // 编译器警告\n    public string FullName\
  \ => clientName;\n}\n\n// Console app\nvar client = new Client(\"Thiago\");\nclient.ModifyName();\n\
  Console.WriteLine($\"Name: {client.Name}\"); // Thiago\n```\n\n## 集合表达式 (Collection\
  \ expressions)\n\n集合表达式允许简洁地创建常见的集合值。它是一种封装在 `[` 和 `]` 括号中的简洁语法，适用于赋值给各种集合类型。例如，考虑初始化一个代表月份字符串元素的\
  \ `System.Span<T>`：\n\nSpan<string> monthsOfYear = [\"Jan\", \"Feb\", \"Mar\", \"\
  Apr\", \"May\", \"Jun\", \"Jul\", \"Aug\", \"Sep\", \"Oct\", \"Nov\", \"Dec\"];\n\
  foreach (var month in monthsOfYear)\n{\n    Console.WriteLine(month);\n}\n```\n\
  在集合表达式中用 `..` 表示的扩展运算符（spread operator）将将其参数替换为该集合中的元素。该参数必须是集合类型。下面是说明扩展运算符功能的用例：\n\
  \n```csharp\nint[] evenNumbers = [2, 4, 6, 8];\nint[] oddNumbers = [1, 3, 5, 7,\
  \ 9];\nint[] allNumbers = [..evenNumbers, ..oddNumbers];\n{\n    Console.Write($\"\
  {number}, \");\n}\n// 输出:\n// 2, 4, 6, 8, 1, 3, 5, 7, 9,\n```\n## 内联数组 (Inline arrays)\n\
  \n内联数组通过在 `struct` 类型中创建固定大小的数组来增强应用程序性能。内联数组通常由运行时和库开发者使用，它们提供了与安全固定大小缓冲区相似的性能。虽然开发者可能不会直接声明内联数组，但当通过运行时\
  \ API 访问 `System.Span<T>` 或 `System.ReadOnlySpan<T>` 对象时，可以从中受益。以下是在 `struct` 中声明内联数组的示例：\n\
  \n```csharp\n[System.Runtime.CompilerServices.InlineArray(7)]\n{\n    private int\
  \ _element0;\n}\n```\n\n用法与标准数组相同：\n```csharp\nvar sampleArray = new SampleArray\
  \ ();\nfor (int i = 0; i < 7; i++)\n{\n    sampleArray[i] = i;\n}\n{\n    Console.WriteLine(i);\n\
  }\n```\n\n## 默认 lambda 参数 (Default lambda parameters)\nLambda 表达式现在支持默认参数值，并遵循与普通方法或本地函数参数相同的语法和约定，如下例示例所示：\n\
  \n```csharp\n// 定义一个 lambda 表达式按指定的增量增加数字（默认增量为 1）\nvar IncrementValue = (int number,\
  \ int amount = 1) => number + amount;\n\n// 结果\nConsole.WriteLine(IncrementValue(10));\
  \ // 输出: 11\nConsole.WriteLine(IncrementValue(10, 5)); // 输出: 15\n```\n\n你还可以使用\
  \ `params` 关键字定义带有参数数组的 lambda 表达式：\n```csharp\nvar calculateSum = (params int[]\
  \ numbers) =>\n{\n    int totalSum = 0;\n    foreach (var num in numbers)\n    \
  \    totalSum += num;\n};\n\nvar emptySum = calculateSum();\nConsole.WriteLine(emptySum);\n\
  \nvar sequenceNumbers = new[] { 1, 2, 3, 4, 5 };\nConsole.WriteLine(totalSum);\n\
  ```\n\n通过这些更新，当包含默认参数的方法组赋值给 lambda 表达式时，该 lambda 表达式也会继承该默认参数。同样，带有 params 数组的方法组也可以赋值给\
  \ lambda 表达式。具有默认参数或 params 数组的 lambda 表达式并不直接对应 `Func<>` 或 `Action<>`。但是，你可以定义包含默认值的委托类型：\n\
  \n```csharp\ndelegate int TotalDelegate(params int[] numbers);\n```\n\n或者你可以使用隐式类型变量\
  \ `var` 来定义委托类型。在这种情况下，编译器会确定委托类型。\n\n## ref readonly 参数 (ref readonly parameters)\n\
  `in` 修饰符允许编译器为参数生成临时变量并传递该变量的只读引用。当参数需要转换、涉及从参数类型的隐式转换或代表非变量的值（例如字面量值或属性访问器返回值）时，会生成此临时变量。在\
  \ API 强制通过引用传递的情况下，建议使用 `ref readonly` 修饰符代替 `in`。\n\n使用 `in` 参数的方法可能会从性能优化中受益，特别是对于大型\
  \ `struct` 类型参数。通过指示可以安全地通过引用传递，声明了 `in` 参数的方法避免了在密集循环或关键代码路径中进行昂贵的拷贝。在调用处显式指定 `in`\
  \ 可确保参数按引用而非按值传递，这具有两个主要优势：\n\n*   当多个方法仅在是否存在 `in` 上有所不同时，强制编译器选择带有匹配 `in` 参数的方法，从而优先选择按引用的重载。\n\
  *   声明按引用传递参数的意图，表明与 `in` 使用的参数必须代表一个可以直接引用的位置。\n在调用处遗漏 `in` 将提示编译器创建一个临时变量，以只读引的方式传递给方法，从而克服与\
  \ `in` 参数相关的限制，例如编译时常量、属性或需要从参数类型到参数类型隐式转换的表达式。\n\n\n\n\n`ref readonly` 修饰符在方法声明中是强制的，但在调用处是可选的。可以使用\
  \ `in` 或 `ref` 修饰符。然而，在调用处是不允许使用 `ref readonly` 修饰符的。调用处选择的修饰符可以阐明参数的特征。\n*   仅当参数为可写变量时，才使用\
  \ `ref`。\n*   当参数为变量时（无论其是可写的还是 `readonly` 的），请使用 `in`。\n*   如果参数不是变量而是表达式，则不能添加任何一种修饰符。\n\
  \n接后的示例说明了这些条件。考虑以下方法，它利用 `ref readonly` 修饰符表示出于性能考虑，应该通过引用传递大型结构体：\n\npublic static\
  \ void UpdateStruct(ref readonly OptionStruct target)\n{\n    // 省略了实现细节\n}\n```\n\
  \n\n```cs\nUpdateStruct(in struct);\nUpdateStruct(ref struct);\nUpdateStruct(struct);\n\
  // 警告变量应通过 `ref` 或 `in` 传递\n// 警告，但是一个表达式，所以没有变量可以引用\n```\n\n如果变量被声明为 `readonly`，则必须使用\
  \ `in` 修饰符；在此语境下使用 `ref` 修饰符会导致编译器错误。\n\n`ref readonly` 修饰符表示该方法期望参数是一个变量，而不是不是变量的表达式。非变量表达式包括常量、方法返回值和属性。当参数不是变量时，编译器会发出警告。\n\
  ## 别名 any\n\n在 C# 12 中，`using` 别名指令已增强，允许对任何类型设置别名，而不限于命名类型。这种灵活性允许对元组、指针、数组类型、泛型等设置别名。因此，你现在可以在整个代码库中使用简洁且具描述性的别名，而不是元组的完整结构表示。\n\
  \n考虑以下元组设置别名的示例。首先，声明别名：\n\nusing SampleTuple = (int x, int y);\n```\n\n随后，像使用任何其他类型一样使用它。将其作为返回类型、方法参数列表中的，甚至用于实例化该类型的新实例。这种可能性几乎是无限的。\n\
  \n这里是一个演示之前声明的元组别名使用的示例：\n```cs\nSampleTuple CopyTuple(SampleTuple input)\n{\n \
  \   return new SampleTuple(input.x, input.y);\n}\n```\n## 结论\n\n总之，本章深入探讨了 C# 11\
  \ 和 C# 12 中引入的主要变化。从主构造函数到内联数组，我们检查了广泛的旨在提高开发者效率和代码质量的增强。\n\n通过理解这些新特性及其应用，开发者可以释放\
  \ C# 的全部潜力，并在快速演进的软件开发格局中保持领先。无论是利用集合表达式编写简洁的代码，还是采用可选参数。\n\n\n\n`Entity Framework\
  \ Core` 中的数据库优先（Database First）方法用于当我们需要将现有的数据库模型反向工程变为可供应用程序使用的类时。它提供了一种将新项目与现有数据库无缝连接的宝贵能力，这在技术迁移期间特别有用。\n\
  \n数据库优先允许将数据库对象翻译为项目中的相应类。该方法受所有 Entity Framework Core 程序的支持，并能有效地将来自各种数据源的数据字段、数据类型和表关系反映到您项目的编程语言中。\n\
  \n\n## 使用数据库优先方法的益处\n\n数据库优先方法的主要优势之一是它能够将新项目与现有数据库进行无缝连接，无论之前使用了什么技术。此外，它还允许项目架构和数据库建模的并行开发，使不同的团队能够并发工作。随后，可以使用数据库优先方法将项目连接到已创建的数据库。\n\
  \n如果在使用数据库优先方法成功创建实体后，需要更新项目或数据库中的任何对象，您有以下选项：\n*   如果您对代码进行了更改并希望这些更改反映在数据库中，则应该使用\
  \ `Migration Commands`（迁移命令）功能。\n*   如果您对数据库进行了更改并希望这些更改反映在您的代码中，则需要重新对数据库进行脚架（scaffold）。\n\
  \n## 实施步骤\n\n在此实现中，我们正在使用一个现有的公共数据库——Northwind 数据库。您可以通过执行以下 SQL 脚本和步骤创建 Northwind\
  \ 数据库的副本，在本示例中我们将数据库命名为 `SampleThiagoDb`：\n[`raw.githubusercontent.com/microsoft/sql-server-samples/master/samples/databases/northwind-pubs/instnwnd.sql`](https://raw.githubusercontent.com/microsoft/sql-server-samples/master/samples/databases/northwind-pubs/instnwnd.sql)\n\
  \n1.  首先，创建一个针对 `.NET 8.0` 的控制台应用程序，并添加脚架和连接数据库所需的 Nuget 包：\n    *   `Microsoft.EntityFrameworkCore.Design`\n\
  \    *   `Microsoft.EntityFrameworkCore.Tools`\n    *   `Microsoft.EntityFrameworkCore.SqlServer`\n\
  2.  获取到 Northwind 数据库的连接字符串。您可以轻松地从 SQL Server 对象资源管理器窗口检索连接字符串，然后如图片所示进入您的数据库的属性：\n\
  \n![](img/Figure_3.1.png)\n\n图 3.1：如何找到您的连接字符串\n\n    ```bash\n    Scaffold-DbContext\
  \ {Your Connection String} Microsoft.EntityFrameworkCore.SqlServer\n    ```\n\n\
  \    输出如下，创建了 `DbContext` 并生成了脚架类：\n\n\n图 3.2：执行 `Scaffold` 命令后生成的脚架类\n\n## 代码优先（Code\
  \ First）\n\nEntity Framework Core 代码优先（Code First）通过允许您使用 `C#` 类定义数据模型，然后自动生成相应的数据库架构，简化了数据库开发。这种方法简化了应用程序创建和维护数据库的过程。\n\
  通过 `Entity Framework Core` 的代码优先方法，您可以使用熟悉的面向对象原则设计应用程序的实体和关系。通过利用特性（attributes）或流式\
  \ API 配置，您可以精细调整数据模型的各个方面，例如指定主键、定义关系和应用约束。\n\n## 使用代码优先方法的益处\n\n代码优先的益处不仅限于初始数据库创建。它提供了无缝的数据库迁移支持，允许您随时间推移演进数据模型而不丢失现有数据。您可以轻松地添加新实体、修改现有实体，并使用迁移（migrations）更新数据库架构以反映这些更改。\n\
  \n\n## 实施步骤\n\n在此实现中，我们正在使用 `Entity Framework Core` 通过代码优先设置一个包含少量实体的数据库。\n\n首先，创建一个针对\
