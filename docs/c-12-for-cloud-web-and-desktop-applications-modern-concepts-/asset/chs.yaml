  \n![](img/Figure_8.7..png)\n\n图 8.7：更改后的计数器页面。\n\n## 授权与身份验证\n\n在本示例中，我们使用由 `SQL\
  \ Server` 实例管理的 Identity 引擎，账户和角色存储在数据库中。以下是实现授权和身份验证所需的步骤：\n\n1. 需要的 Nuget 包：\n\
  \    * `Microsoft.AspNetCore.Identity.EntityFrameworkCore`\n    * `Microsoft.AspNetCore.Identity.UI`\n\
  \    * `Microsoft.EntityFrameworkCore`\n    * `Microsoft.EntityFrameworkCore.SqlServer`\n\
  \    * `Microsoft.EntityFrameworkCore.Tools`\n\n2. `Program.cs` 必须更新如下：\n\n```csharp\n\
  using Microsoft.AspNetCore.Components;\nusing Microsoft.AspNetCore.Components.Web;\n\
  using SampleBlazorApp.Data;\nusing Microsoft.AspNetCore.Identity;\nusing Microsoft.EntityFrameworkCore;\n\
  \nvar builder = WebApplication.CreateBuilder(args);\n\nbuilder.Services.AddDbContext<SampleBlazorAppContext>(\n\
  \    options => options.UseSqlServer(\"Data Source=DESKTOP-H20O12E;Initial Catalog=SampleThiagoIdentityDb;Integrated\
  \ Security=True;Connect Timeout=30;Encrypt=False;Trust Server Certificate=False;Application\
  \ Intent=ReadWrite;Multi Subnet Failover=False\"));\n\nbuilder.Services.AddDefaultIdentity<IdentityUser>(options\
  \ => options.SignIn.RequireConfirmedAccount = true).AddEntityFrameworkStores<SampleBlazorAppContext>();\n\
  \n// 将服务添加到容器。\nbuilder.Services.AddRazorPages();\nbuilder.Services.AddServerSideBlazor();\n\
  builder.Services.AddSingleton<WeatherForecastService>();\n\nvar app = builder.Build();\n\
  \n// 配置 HTTP 请求管道。\nif (!app.Environment.IsDevelopment())\n{\n    app.UseExceptionHandler(\"\
  /Error\");\n    // 默认的 HSTS 值为 30 天。你可能想在生产场景中更改它，请参见 https://aka.ms/aspnetcore-hsts。\n\
  \    app.UseHsts();\n}\n\napp.UseHttpsRedirection();\napp.UseStaticFiles();\napp.UseRouting();\n\
  app.UseAuthentication();\napp.UseAuthorization();\n\napp.MapBlazorHub();\napp.MapFallbackToPage(\"\
  /_Host\");\n\napp.Run();\n```\n\n3. `App` 组件也必须更新如下：\n\n```xml\n<CascadingAuthenticationState>\n\
  \    <Router AppAssembly=\"@typeof(App).Assembly\">\n        <Found Context=\"routeData\"\
  >\n            <AuthorizeRouteView RouteData=\"@routeData\" DefaultLayout=\"@typeof(MainLayout)\"\
  \ />\n            <FocusOnNavigate RouteData=\"@routeData\" Selector=\"h1\" />\n\
  \        </Found>\n        <NotFound>\n            <PageTitle>Not found</PageTitle>\n\
  \            <LayoutView Layout=\"@typeof(MainLayout)\">\n                <p role=\"\
  alert\">抱歉，此地址没有内容。</p>\n            </LayoutView>\n        </NotFound>\n    </Router>\n\
  </CascadingAuthenticationState>\n```\n\n4. 添加一个类型为 `Identity` 的新脚手架项。你可以在左侧的 Identity\
  \ 子菜单中找到它，如下所示：\n\n![](img/Figure_8.8..png)\n\n图 8.8：添加 Identity 脚手架项。\n\n5. 勾选“覆盖所有文件”选项并设置你的\
  \ `DbContext` 类：\n\n![](img/Figure_8.9.png)\n\n图 8.9：设置 Identity 脚手架项。\n\n结果是我们创建了以下类：\n\
