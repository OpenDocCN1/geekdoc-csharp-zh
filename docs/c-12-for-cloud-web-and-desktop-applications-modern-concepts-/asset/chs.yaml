  ## 目标](#contents.xhtml_sc2_250a)\n\n在本章中，我们将讨论 `.NET MAUI` 的核心知识，探索构建健壮跨平台应用的核心概念。区分\
  \ `Blazor` 和 `Blazor Hybrid`，理解 Web 框架及其在不同平台上的混合集成。通过逐步实施的案例研究来创建一个多平台应用，将 `.NET\
  \ MAUI` 与 `Blazor Hybrid UI` 无缝融合。在原生应用中利用 `HTML`、`CSS` 和 `C#` 等网络技术构建响应式界面。通过单一代码库，在\
  \ iOS、Android、macOS 和 Windows 上轻松地创建跨平台应用。发现 `.NET MAUI` 和 `Blazor Hybrid` 的力量，提升在各种平台上开发创新且功能丰富的应用的开发技能，激发创造力并保持在现代开发的前沿。\n\
  \n## .NET MAUI 概述](#contents.xhtml_sc2_251a)\n\n`.NET MAUI` 是一个由微软开发的强大框架，也是 `Xamarin.Forms`\
  \ 的下一次演进。它允许开发者通过单一代码库为 iOS、Android、macOS 和 Windows 构建原生应用。`.NET MAUI` 的主要目的是简化跨平台应用开发，并为各种平台提供一致且统一的开发体验。\n\
  \n`.NET MAUI` 的关键特性和组件：\n\n*   跨平台开发：通过 `.NET MAUI`，开发者可以编写一次代码并部署到多个平台，与为每个平台开发独立的原生应用相比，节省了时间和精力的。\n\
  *   统一 API：`.NET MAUI` 提供了统一的 `API` 层，这意味着开发者可以通过单一代码库访问特定平台的功能。这简化了开发过程，并允许跨平台提供无缝用户体验。\n\
  *   自适应 UI：`.NET MAUI` 提供了自适应 `UI` 能力，允许开发者创建能够自动适应不同屏幕尺寸和方向的用户界面。这确保了应用在各种设备上具有最佳外观和功能。\n\
  *   原生性能：`.NET MAUI` 应用在每个平台上以原生应用的形式运行，利用原生控件和 `APIs`。这产生了高性能且响应迅速的应用，为用户提供原生的外观和感受。\n\
  *   热重载（Hot reload）：`.NET MAUI` 支持热重载功能，允许开发者在开发期间立即查看更改而无需重启应用程序。这加速了开发过程并提高了生产力。\n\
  *   Xamarin 社区生态系统：作为 `Xamarin.Forms` 的继任者，`.NET MAUI` 得益强大的库、工具和社区支持生态系统，让开发者更容易为项目找到资源和解决方案。\n\
  *   支持 .NET 6：`.NET MAUI` 构建在 `.NET 6` 之上，为 `.NET` 生态系统带来了新功能、改进和优化。这确保开发者可以利用 `.NET`\
  \ 框架的最新进展。\n\n`.NET MAUI` 旨在提供多功能且精简的开发体验，允许开发者通过单一代码库目标多个平台接触更广泛的受众。无论你是资深 `.NET`\
  \ 开发者还是跨平台开发的新手，`.NET MAUI` 都提供了一个令人兴奋的机会，来创建现代且功能丰富的应用，满足各种设备上多样化的用户需求。\n\n## Blazor\
  \ 与 Blazor Hybrid 的区别](#contents.xhtml_sc2_252a)\n\n`Blazor` 和 `Blazor Hybrid` 是\
  \ `.NET` 生态系统中两种相关但不同的技术，允许开发者构建 Web 应用程序和混合跨平台应用。让我们探索 `Blazor` 和 `Blazor Hybrid`\
  \ 之间的主要区别：\n\n| 特性 | Blazor | Blazor Hybrid |\n| --- | --- | --- |\n| 应用类型 | Web\
  \ 应用 | 跨平台应用 (iOS, Android, macOS, Windows) |\n| 执行位置 | 客户端（WebAssembly 或使用 `SignalR`\
  \ 的服务端） | 与目标平台的类原生集成 |\n| 技术 | 使用 `HTML`、`CSS`、Razor 语法 | 在原生环境中使用网络技术和 Razor 语法\
  \ |\n| 应用样式 | 单页应用 (SPA) | 具有类原生用户体验的混合应用 |\n| 服务端依赖 | 服务端运行时需要 Web 服务器 | 与原生组件和\
  \ `APIs` 集成 |\n| 与 .NET MAUI 的集成 | 通常不与 `.NET MAUI` 相关 | 通常与 `.NET MAUI` 配合使用 |\n\
  | 代码共享 | 特定于 Web 代码，共享较少 | 促进不同平台之间的代码共享 |\n\n表 12.1：`Blazor` 与 `Blazor Hybrid`\
  \ 的区别。\n\n总结来说，`Blazor` 主要关注在浏览器中运行的 Web 应用，而 `Blazor Hybrid` 设计用于创建结合网络技术与原生应用开发的跨平台应用。`Blazor\
  \ Hybrid` 利用 `.NET MAUI` 将其范围扩展到各种平台，并为用户提供更类原生的体验。\n\n## 逐步实施的案例研究](#contents.xhtml_sc2_253a)\n\
