  \ Core) | 是 | 17.0 | 17.0 |\n| ASP.NET Razor (Blazor WASM) | 是 | 17.1 | 17.0 |\n\
  | WPF | 否 | 16.11 | 17.0 |\n| WinUI3 | 否 | 16.11 | -- |\n| WinForms | 否 | 16.11\
  \ | 17.0 |\n| Console | 否 | 16.11 | 17.0 |\n| .NET MAUI (WinUI 3) | 是 | 17.1 | --\
  \ |\n| .NET MAUI (Android) | 是 | 17.1 | -- |\n| .NET MAUI (iOS) | 是 | 17.1 | --\
