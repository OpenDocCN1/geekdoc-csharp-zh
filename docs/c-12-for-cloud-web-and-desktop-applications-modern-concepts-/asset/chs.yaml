  \ Docker desktop\n\n## 应用持续集成\n\n由于我们已经测试了 `Dockerfile` 并确认它现在运行正常，现在是时候应用持续集成，以确保我们每次向存储库推送更改时都有更新的镜像。要继续操作，读者需要将他们的项目上传到\
