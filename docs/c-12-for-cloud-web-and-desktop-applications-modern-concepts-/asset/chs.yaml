  4.  现在，我们必须在包管理器控制台中执行以下命令，它将负责创建数据库：\n    ```bash\n    update-database\n\n    成功完成后，您的数据库将已创建：\n\
  \n![](img/Figure_3.4.png)\n\n图 3.4：执行 `update-database` 命令后生成的数据库\n## LINQ to Entities\n\
  \nLINQ to Entities 允许开发者使用 `C#` 或 `Visual Basic` 等熟悉的编程语言编写查询，使得复杂的数据检索和操作变得更加简单。通过\
  \ LINQ to Entities，开发者可以利用 LINQ 的完整功能来编写表达式丰富且类型安全的查询。LINQ to Entities 支持广泛的操作，包括过滤、排序、分组和数据聚合。它还支持复杂的连接操作，并支持各种用于数据处理和转换的\
  \ LINQ 操作符和方法。\n\n\n\n\n当使用 LINQ to Entities 时，查询由 `IQueryable<T>` 对象表示。这些对象定义了可以在数据库上执行的查询。LINQ\
  \ to Entities 驱动程序会将 LINQ 表达式和操作转换为 SQL 查询，并在底层数据库上执行。\n\nLINQ to Entities 的核心优势之一是由于它与\
  \ Entity Framework Core 及其组件（如更改跟踪、事务管理和数据库更新）的集成。这种集成允许开发者编写高效且优化的查询，充分利用 Entity\
  \ Framework Core 的底层能力。\n\n以下是每次执行 LINQ to Entities 查询时在后台运行的逐步步骤：\n1.  从 `ObjectContext`\
  \ 创建一个 `ObjectQuery<T>` 对象的新实例。\n    `ObjectQuery` 对象表示一个类型化查询，其中 `T` 是结果中返回的实体类型。\n\
  \n2.  基于 `ObjectQuery<T>` 实例组合 LINQ To Entities 查询。\n    `ObjectQuery<T>` 类实现了 `IQueryable<T>`，充当\
  \ LINQ to Entities 查询的数据源，指定要检索所需的数据，并允许排序、分组和形状确定。查询存储在变量中，不会立即采取行动或返回数据。LINQ to\
  \ Entities 支持两种语法：查询表达式和基于方法的方法，LinQ 在 C# 3.0 和 Visual Basic 9.0 中引入。\n\n    首先，必须将\
  \ LINQ 代码转换为特定于框架的命令树表示。LINQ 查询由标准运算符和表达式组成，其中运算符是类上的方法，而表达式可以包含广泛的功能。Entity Framework\
  \ 将运算符和表达式统一到命令树内的单一类型层次结构中，然后用于查询执行。转换过程涉及对查询运算符和表达式均进行相应的转换。\n\n4.  针对数据源执行由命令树表示的查询。\n\
  \    在查询执行期间，所有的查询表达式或组件将根据上下文在客户端或服务器上进行求值。\n\n5.  查询具体化返回结果。\n\n## 数据注解 (Data\
  \ Annotations)\n\n数据注解是应用到类或类属性的属性，用于修改或覆盖源自模型构建约定的配置，而通过映射属性实现的配置可以使用 `OnModelCreating`\
  \ 中的模型构建 API 进一步覆盖。为了确保使用的清晰和简单，为 EF Core 设计的映射属性是 EF Core 特有的，避免了跨技术之间的任何语义差异。\n\
  \n数据注解的优先级高于约定，但 Fluent API 配置的优先级高于数据注解。因此，你的数据注解可以覆盖约定配置，但 Fluent API 配置可以覆盖数据注解。\n\
  ## 最常用的数据注解\n\n下面你可以找到最常用的数据注解列表：\n\n*   `Table`：为 `Entity` 设置表名。\n*   `Column`：设置列名、类型和列顺序。\n\
  *   `Required`：将属性设为必填。\n*   `ForeignKey`：设置实体之间的关系。\n*   `NotMapped`：将属性排除在数据库模型之外。\n\
  \n 应用数据注解\n\n\n```cs\npublic class Supermarket\n{\n    public int Id { get; set;\
  \ }\n    public string Address { get; set; }\n    public string City { get; set;\
  \ }\n    public ICollection<Product> Products { get; set; }\n}\n\npublic class Product\n\
  {\n    public string Name { get; set; }\n    [Column(TypeName = \"money\")]\n  \
  \  public double Price { get; set; }\n    [MaxLength(50, ErrorMessage =\"Max length\
  \ is 50!\")]\n    public string Description { get; set; }\n}\npublic class Customer\n\
  {\n    public int Id { get; set; }\n    [Column(\"CustomerName\", Order = 5)]\n\
  \    public string Name { get; set; }\n    public string Address { get; set; }\n\
  \    public int Age { get; set; }\n    public ICollection<Product> Products { get;\
  \ set; }\n}\n```\n\n为了看到这些更改反映在数据库中，我们必须运行 `add-migration` 命令，然后运行 `update-database`\
  \ 命令：\n![](img/FIgure_3.5.png)\n\n图 3.5：带有 EF Core 命令输出的程序管理器控制台\n\n在接下来的图中，数据库反映了代码中做的更改：\n\
  \n\n图 3.6：反映代码中更改的数据库\n\n## 数据建模 (Data Modeling)\n\n数据建模是一个基础方面，侧重于定义实体之间的关系。这些关系对于组织数据至关重要。本主题探讨了三种常见的关系：一对一、一对多和多对多。\n\
  理解这些关系及其在 Entity Framework 中的实现对于设计健壮的模型至关重要。下面描述了这些关系，并提供了它们在我们之前的项目中运行的实际示例。为了更好地演示这些关系，创建了\
  \ `ProductCategory` 类：\n\n```cs\npublic class ProductCategory\n{\n    public int\
  \ Id { get; set; }\n    public string Description { get; set; }\n}\n```\n\n## 一对一关系\
  \ (One-to-one relationship)\n\n\n### 必要的一对一 (Required one-to-one)\n\n在这种场景下，要求 `Product`\
  \ 必须与 `ProductCategory` 关联：\n\n```cs\npublic class Product\n{\n    public int Id\
  \ { get; set; }\n    public string Name { get; set; }\n    [Column(TypeName = \"\
  money\")]\n    public double Price { get; set; }\n    public string Description\
  \ { get; set; }\n    public ProductCategory? Category { get; set; }\n}\n\npublic\
  \ class ProductCategory\n{\n    public string Name { get; set; }\n    public string\
  \ Description { get; set; }\n    public int ProductId { get; set; }\n    public\
  \ Product Product { get; set; } = null!;\n}\n```\n在运行 `add-migration` 命令后紧运行 `update-database`\
  \ 命令，我们在数据库中得到了这些更改：\n\n![](img/Figure_3.7.png)\n\n图 3.7：反映代码中更改的数据库。\n\n\n\n\n\
  在强制的一对一关系中，主实体（principal entity）应该具有一个或多个主键或备用键属性，例如 `Product.Id`。另一方面，依赖实体（dependent\
  \ entity）应该具有一个或多个外键属性，例如 `ProductCategory.ProductId`。可选情况下，主实体可以有一个指向依赖实体的引用导航属性，如\
  \ `Product.Category`。同样，依赖实体也可以有一个指向主实体的可选引用导航属性，例如 `ProductCategory.Product`。这些组件共同在\
  \ Entity Framework Core 中定义并确立了实体之间的一对一关系。\n\n### 可选的一对一\n在这种场景下，我们可能有一个关联到 `ProductCategory`\
  \ 的 `Product`，同时也可能有一个未关联任何 `ProductCategory` 的 `Product`，从下面的代码中看到：\n\n```csharp\n\
  [Table(\"NewProductTable\")]\npublic class Product\n{\n    public string Name {\
  \ get; set; }\n    [Column(TypeName = \"money\")]\n    public double Price { get;\
  \ set; }\n    [MaxLength(50, ErrorMessage =\"Max length is 50!\")]\n    public string\
  \ Description { get; set; }\n    public ProductCategory? Category { get; set; }\n\
  \npublic class ProductCategory\n{\n    public int Id { get; set; }\n    public string\
  \ Name { get; set; }\n    public string Description { get; set; }\n    public Product?\
  \ Product { get; set; }\n}\n```\n\n在运行 `add-migration` 命令后执行 `update-database` 命令，数据库中发生了这些变化：\n\
  \n\n图 3.8：ProductId 字段反映了代码中的变化\n\n在可选的一对一关系中，实体之间存在可空导航属性。我们有 `ProductCategory.Product`、`ProductCategory.ProductId`\
  \ 以及 `Product.Category`。\n\n### 一对多关系\n一对多关系中，一个实体实例与另一个实体的多个实例相关。这种关系实现了高效的数据组织，因为“一”端实体可以维护来自“多”端实体的集合。\n\
  \n#### 强制一对多\n\n在这种场景下，一个 `Product` 关联到 N 个 `ProductCategory`：\n\n[Table(\"NewProductTable\"\
  )]\npublic class Product\n{\n    public int Id { get; set; }\n    public string\
  \ Name { get; set; }\n    [Column(TypeName = \"money\")]\n    [MaxLength(50, ErrorMessage\
  \ = \"Max length is 50!\")]\n    public string Description { get; set; }\n    public\
  \ ICollection<ProductCategory> Category { get; } = new List<ProductCategory>();\n\
  }\n\npublic class ProductCategory\n    public int Id { get; set; }\n    public string\
  \ Name { get; set; }\n    public string Description { get; set; }\n    public int\
  \ ProductId { get; set; }\n    public Product Product { get; set; } = null!;\n}\n\
  \n在运行 `add-migration` 命令后执行 `update-database` 命令，数据库中发生了这些变化：\n\n![](img/Figure_3.9.png)\n\
  \n图 3.9：数据库反映了代码中的变化\n在一一对多关系中，由主实体 `Product` 代表的“一”端应该具有一个或多个主键或备用键属性。另一方面，由依赖实体\
  \ `ProductCategory` 代表的“多”端应该具有一个或多个外键属性，如 `ProductCategory.ProductId`。可选情况下，主实体可以有一个如\
  \ `Product.ProductCategories` 的集合导航来引用依赖实体，而依赖实体可以有一个如 `ProductCategory.Product`\
  \ 的可选引用导航来引用主实体。这些组件在 Entity Framework Core 中定义并确立了一一对多的关系。\n\n#### 可选一对多\n\n在这种场景下，一个\
  \ `Product` 关联到 0 到 N 个 `ProductCategory`：\n\n[Table(\"NewProductTable\")]\npublic\
  \ class Product\n{\n    public int Id { get; set; }\n    public string Name { get;\
  \ set; }\n    [Column(TypeName = \"money\")]\n    [MaxLength(50, ErrorMessage =\
  \ \"Max length is 50!\")]\n    public string Description { get; set; }\n    public\
  \ ICollection<ProductCategory> Category { get; } = new List<ProductCategory>();\n\
  }\n\npublic class ProductCategory\n    public int Id { get; set; }\n    public string\
  \ Name { get; set; }\n    public string Description { get; set; }\n    public int?\
  \ ProductId { get; set; }\n    public Product? Product { get; set; } = null!;\n\
  }\n\n在运行 `add-migration` 命令后执行 `update-database` 命令，数据库中发生了这些变化：\n\n![](img/Figure_3.10..png)\n\
  \n图 3.10：数据库反映了代码中的变化\n在可选的一对多关系中，实体之间存在可空导航属性。我们有 `ProductCategory.ProductId` 和\
  \ `ProductCategory.Product`。\n\n### 多对多关系\n\n多对多关系表示一个实体的多个实例与另一个实体的多个实例关联。为了方便这种关系，使用了一个中间表。Entity\
  \ Framework Core 可以透明地处理这种关系，允许从任何侧添加或删除实体。然而，理解后台发生的情况（底层机制）有助于充分利用整体行为。\n\n\n\
  ```csharp\n[Table(\"NewProductTable\")]\npublic class Product\n{\n    public int\
  \ Id { get; set; }\n    [Column(TypeName = \"money\")]\n    public double Price\
  \ { get; set; }\n    [MaxLength(50, ErrorMessage = \"Max length is 50!\")]\n   \
  \ public string Description { get; set; }\n    public List<ProductCategory> ProductCategories\
  \ { get; } = new List<ProductCategory>();\n}\npublic class Supermarket\n{\n    public\
  \ int Id { get; set; }\n    public string Address { get; set; }\n    [Required(ErrorMessage\
  \ = \"The City is required.\")]\n    public string City { get; set; }\n}\n\npublic\
  \ class ProductCategory\n{\n    public int Id { get; set; }\n    public int? ProductId\
  \ { get; set; }\n    public Product? Product { get; set; } = null!;\n    public\
  \ Category? Category { get; set; } = null!;\n}\n```\n\n在运行 `add-migration` 命令后执行\
  \ `update-database` 命令，数据库中发生了这些变化：\n![](img/Figure_3.11.png)\n\n图 3.11：数据库反映了代码中的变化\n\
  \n## 数据管理\n\n\n对于以下实际示例，我们将继续使用之前为代码 First 方法创建并针对数据建模主题修改的项目。\n\n#### 常规用法\n\n\n\
  \n\n常规用法是指使用 Entity Framework Core 与数据库交互的常用实践和技术。它涉及对实体执行基础的增、删、改、删（CRUD）操作、使用集成语言的查询（LINQ）查询数据库，以及处理实体之间的关系。\n\
  \nEntity Framework Core 中的 `DbContext` 类充当应用程序与数据库之间的桥梁。它代表与数据库的会话，并提供了一组执行数据库操作的\
  \ API。开发者可以根据应用程序的需求创建特定的 `DbContext` 子类，并定义 `DbSet` 属性来表示实体集。\n\n创建了一个新的 Web API\
  \ 控制器来表示 Entity Framework Core 和 `DbContext` 的常规用法，如如下代码块所示，我们对 `Customer` 实体执行了\
  \ CRUD 操作：\n\n```csharp\n[Route(\"api/[controller]\")]\n[ApiController]\npublic\
  \ class CustomersNormalEFController : ControllerBase\n    private readonly SampleDbContext\
  \ sampleDbContext;\n    public CustomersNormalEFController(SampleDbContext dbContext)\n\
  \    {\n        sampleDbContext = dbContext;\n    }\n\n    public IActionResult\
  \ GetById(int id)\n    {\n        return new OkObjectResult(sampleDbContext.Customers.FirstOrDefault(x\
  \ => x.Id == id));\n    }\n\n    [HttpGet(\"Customers\")]\n    {\n        return\
  \ Ok(sampleDbContext.Customers.ToList());\n    }\n\n    [HttpPost(\"Customer\")]\n\
  \    public IActionResult PostSingle([FromBody] Customer customer)\n        sampleDbContext.Customers.Add(customer);\n\
  \        sampleDbContext.SaveChanges();\n        return CreatedAtAction(nameof(GetById),\
  \ new { id = customer.Id }, customer);\n    }\n\n    [HttpPut(\"Customer\")]\n \
  \   {\n        if (!sampleDbContext.Customers.Any(x => x.Id == customer.Id))\n \
  \           return NotFound();\n        sampleDbContext.Customers.Update(customer);\n\
  \        sampleDbContext.SaveChanges();\n        return NoContent();\n\n    [HttpDelete(\"\
  Customers/{id}\")]\n    public IActionResult Delete(int id)\n    {\n        var\
  \ obj = sampleDbContext.Customers.Include(x=>x.Products).FirstOrDefault(x => x.Id\
  \ == id);\n        if (obj ==null)\n        sampleDbContext.Products.RemoveRange(obj.Products);\n\
  \        sampleDbContext.Customers.Remove(obj);\n        sampleDbContext.SaveChanges();\n\
  \        return NoContent();\n    }\n}\n\n## 工作单元 (Unit of work)\n\n工作单元模式在软件开发中广泛用于管理事务，并确保在处理数据时的原子性和一致性。在\
  \ Entity Framework Core 中，可以使用 `DbContext` 类及其底层的更改跟踪机制来实现工作单元模式。\n\nEntity Framework\
  \ Core 跟踪 `DbContext` 实例内对实体进行的更改。这意味着对实体执行的任何修改、添加或删除都会保留在内存中，直到显式保存到数据库为止。工作单元模式利用这种更改跟踪机制来有效地管理事务。\n\
  通过工作单元模式，开发者可以将多个数据库操作组合为一个事务。通过使用 `DbContext` 的 `BeginTransaction` 以及 `Commit`/`Rollback`\
  \ 方法，可以对实体的更改作为一个整体提交，或者在发生错误或异常时完全回滚。\n\n创建了一个新的 Web API 控制器来表示使用 Entity Framework\
  \ Core 的工作单元，如如下代码块所示，我们对 `Customer` 实体执行了 CRUD 操作：\n\n```csharp\n[Route(\"api/[controller]\"\
  )]\npublic class CustomersUnitOfWorkController : ControllerBase\n{\n    private\
  \ readonly UnitOfWork unitOfWork;\n    public CustomersUnitOfWorkController(SampleDbContext\
  \ dbContext)\n    {\n        unitOfWork = new UnitOfWork(dbContext);\n\n    [HttpGet(\"\
  Customers/{id}\")]\n    public IActionResult GetById(int id)\n    {\n        return\
  \ new OkObjectResult(unitOfWork.CustomerRepository.GetByID(id));\n    }\n    [HttpGet(\"\
  Customers\")]\n    public IActionResult GetAll()\n    {\n        return Ok(unitOfWork.CustomerRepository.Get());\n\
  \    }\n\n    public IActionResult PostSingle([FromBody] Customer customer)\n  \
  \  {\n        unitOfWork.CustomerRepository.Insert(customer);\n        unitOfWork.Save();\n\
  \        return CreatedAtAction(nameof(GetById), new { id = customer.Id }, customer);\n\
  \    }\n    [HttpPut(\"Customer\")]\n    public IActionResult PutSingle([FromBody]\
  \ Customer customer)\n    {\n        unitOfWork.CustomerRepository.Update(customer);\n\
  \        unitOfWork.Save();\n        return NoContent();\n\n    [HttpDelete(\"Customers/{id}\"\
  )]\n    public IActionResult Delete(int id)\n    {\n        var customer = unitOfWork.CustomerRepository.Get(x\
  \ => x.Id.Equals(id), includeProperties: \"Products\").FirstOrDefault();\n     \
  \   foreach (var item in customer.Products)\n            unitOfWork.ProductRepository.Delete(item);\n\
  \        }\n        unitOfWork.CustomerRepository.Delete(id);\n        unitOfWork.Save();\n\
  \        return NoContent();\n    }\n```\n\n## 仓库模式 (Repository pattern)\n\n仓库模式是一种设计模式，它在应用程序和数据访问层之间提供了一个抽象层。\n\
  \n\n创建仓库接口的具体实现以与底层数据存储交互，在本例中是 Entity Framework Core。它们利用 `DbContext` 及其 `DbSet`\
  \ 属性来执行所需的操作。\n\n仓库模式通过将数据访问逻辑与应用程序的其他部分分离，促进了关注点分离。这使得可测试性、可维护性，以及在切换数据访问技术时的灵活性得到了提高。\n\
  \n创建了一个新的 Web API 控制器来表示 Entity Framework Core 的仓库模式，如下代码块所示，我们对 `Customer` 实体执行了\
  \ CRUD 操作：\n```csharp\n[Route(\"api/[controller]\")]\n[ApiController]\npublic class\
  \ CustomersRepoPatternController : ControllerBase\n{\n    private readonly GenericRepository<Customer>\
  \ customerRepository;\n    public CustomersRepoPatternController(GenericRepository<Customer>\
  \ customerRepository, GenericRepository<Product> productRepository)\n    {\n   \
  \     this.customerRepository = customerRepository;\n        this.productRepository\
  \ = productRepository;\n    }\n\n    public IActionResult GetById(int id)\n    {\n\
  \        return new OkObjectResult(customerRepository.GetByID(id));\n    }\n\n \
  \   [HttpGet(\"Customers\")]\n    {\n        return Ok(customerRepository.Get());\n\
  \    }\n\n    [HttpPost(\"Customer\")]\n    public IActionResult PostSingle([FromBody]\
  \ Customer customer)\n        customerRepository.Insert(customer);\n        customerRepository.context.SaveChanges();\n\
  \        return CreatedAtAction(nameof(GetById), new { id = customer.Id }, customer);\n\
  \    }\n\n    [HttpPut(\"Customer\")]\n    {\n        customerRepository.Update(customer);\n\
  \    }\n}\n```\n\n\n\n\n```csharp\n35. customerRepository.context.SaveChanges();\n\
