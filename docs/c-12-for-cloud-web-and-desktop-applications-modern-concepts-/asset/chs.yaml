  \ an appropriate binding)\n\n\n\n\n现在，让我们开始设置输出绑定，从存储账户（Storage Account）开始。一旦你配置了\
  \ Azure 存储账户，就可以在 Azure Function 中设置输出绑定了。输出绑定将允许你的函数在存储账户内的 Blob 容器（Container）中创建并存储数据。按照后续步骤配置输出绑定并建立与存储账户的连接，以下是我为此示例创建的存储账户：\n\
