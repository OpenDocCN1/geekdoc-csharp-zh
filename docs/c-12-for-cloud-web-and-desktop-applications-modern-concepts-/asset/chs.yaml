  ![](img/Figure_4.7..png)\n\n\n现在，让我们回到 Azure Function，是时候配置输出绑定了。如下所示，配置输出绑定允许你的函数与外部资源和服务进行无缝交互：\n\
  \n![](img/Figure_4.8..png)\n\n图 4.8：为 Azure Function 添加更多输出。\n让我们从设置 Blob 存储绑定开始。此绑定将允许你的\
