  \ `Azure Service Bus` 如何赋能应用程序执行异步操作，从而增强现代云架构的韧性和响应能力。\n\n# 第 6 章利用 Azure Service\
  \ Bus 释放异步操作的力量\n\n## 引言\n\n在当今动态的格局中，速度、扩展性和高效通信至关重要，掌握异步操作是必不可少的。本章将我们带浸在 `Azure\
  \ Service Bus` 的领域，这是由 Microsoft Azure 提供的一种健壮的云消息服务，提供了一系列对于有效异步操作至关重要的功能。\n\n\
  我们从探索`队列（Queues）` 开始，它是 `Azure Service Bus` 的基础，消息遵循先入先出（FIFO）方式。队列确保了消息的可靠投递，增强了系统的韧性。我们深入研究了创建队列、发送/接收消息以及处理各种消息处理场景。\n\
  \n转向`主题（Topics）`，我们发现了它们在启用发布/订阅模式方面的强大之处，该模式有助于向多个订阅者高效广播。主题提供了扩展性和灵活性，使我们能够创建和定义`订阅（Subscriptions）`、管理消息过滤并自定义路由。\n\
  \n一个全面的案例研究将引导我们分步实现 `Azure Service Bus`，提供手操作经验和真实世界的见解。我们进阶到高级功能，探索了可以简化与不同客户端交互的`消息会话（Message\
  \ sessions）`。`消息会话` 有助于管理复杂的工作流并保持消息顺序，从而优化系统性能。\n\n本章的最后高潮是解决错误处理和异常管理——这是分布式系统中的一个关键方面。我们讨论了处理异常的策略、重试消息处理以及实施健壮的错误处理机制。在本章结束时，读者将对\
  \ `Azure Service Bus` 有深深刻的理解，并具备构建能够处理大负载的韧性系统的技能。这段旅程有望释放使用 `Azure Service Bus`\
  \ 进行异步操作的全部潜力。\n\n## 结构\n\n本章涵盖了以下主题：\n\n*   使用 Service Bus 的异步操作\n*   `Azure Service\
  \ Bus 主题（Topics）`\n*   `Azure Service Bus 订阅（Subscriptions）`\n*   案例研究\n\n## 目标\n\
  \n在本章结束时，你将理解 `Azure Service Bus` 的核心概念，包括队列（Queues）、主题（Topics）和订阅（Subscriptions）。你将学习如何在\
  \ `Azure Service Bus` 中创建和管理队列，以实现可靠的消息投递和处理。探索主题和订阅的优势和能力，实现高效的发布/订阅消息模式。通过分步案例研究获得实用的见解，演示\
  \ `Azure Service Bus` 的实现。我们将创建主题、定义订阅，并探索消息过滤和路由技术。发现使用消息会话来处理与不同客户端的交互并维护每个会话中的消息顺序。探索高级功能和优化以增强\
  \ `Azure Service Bus` 的性能和扩展性。理解异常管理和错误处理策略，以确保应用程序的韧稳定性。学习处理异常、重试消息处理以及实施健壮错误处理机制的最佳实践。读者将获得使用\
  \ `Azure Service Bus` 进行异步操作来设计和构建高效可扩展系统所需的知识和技能。\n\n\n\n\nAzure Service Bus 是由\
  \ Microsoft Azure 提供的云端消息服务。它为构建分布式应用程序和系统提供了一个强大且可扩展的平台，这些系统要求组件之间进行异步且解耦的通信。Azure\
  \ Service Bus 多种消息模式，包括 `Queues`（队列）、`Topics`（主题）和 `Subscriptions`（订阅），允许开发者设计灵活且可靠的消息解决方案。\n\
  \nAzure Service Bus 的关键特性和组件包括：\n\n* `Queues`：Azure Service Bus `Queues` 提供了一种可靠的异步消息机制。它们遵循\
  \ FIFO（先入先）原则，确保消息按照接收到的顺序进行处理。`Queues` 提供了可靠的消息传递、消息持久性，并支持单向和请求/响应通信模式。\n* `Topics`\
  \ 和 `Subscriptions`：Azure Service Bus `Topics` 允许使用发布/订阅消息模式。发布到 `Topic` 的消息可以被多个订阅者（即\
  \ `Subscriptions`）接收。`Subscriptions` 可以设置特定的过滤器以仅接收相关的消息子集，实现高效的消息分发，并允许组件订阅特定的消息类型或感兴趣的\
  \ `Topics`。\n* `Relays`：Azure Service Bus `Relays` 提供了一种将本地服务暴露到云端的方法，或者安全地实现本地与云端服务之间的通信。`Relays`\
  \ 使用双向通信通道，允许客户端连接到中继端并与背后的服务进行通信。\n* `Message sessions`：Azure Service Bus 支持消息会话，允许将相关的消息分组在一起并按顺序处理。`Message\
  \ sessions` 对于那些维护顺序和一起处理相关消息至关重要的场景非常有用，例如涉及多个步骤的工作流或事务。\n* `Dead-lettering`：Azure\
  \ Service Bus 包含死信队列处理功能，可以将无法处理或超过最大交付尝试次数的消息移动到单独的死信 `Queue` 或 `Topic` 中。死信处理提供了一种单独处理失败或毒性消息的机制，使开发者能够有效地诊断并解决问题。\n\
  * `Message transactions`：Azure Service Bus 支持消息事务，允许将多个消息作为单个原子操作的一部分进行发送和处理。这确保了所有消息要么被成功处理，要么在失败时回滚，从而提供了消息处理的一致性和可靠性。\n\
  * `Auto-scaling and high availability`：Azure Service Bus 设计为具有高可用性和可扩展性。它提供跨多个节点的自动负载均衡和消息分区，确保高吞吐量和容错能力。Azure\
  \ Service Bus 还提供了自动扩展功能，根据工作负载需求动态调整资源。\n* `Management and monitoring`：Azure Service\
  \ Bus 通过 `Azure portal`、`Azure CLI`、`PowerShell` 和 `REST APIs` 提供全面的管理和监控功能。这些功能允许开发者监控消息吞吐量、管理\
  \ `Queues` 和 `Topics` 等实体，并配置消息处理和处理的各个方面。\n\nAzure Service Bus 广泛应用于各种场景，包括企业消息、分布式系统、物联网（IoT）消息、事件驱动架构和混合云集成。它的灵活性、扩展性和可靠性使其构建需要异步通信和不同组件间无缝集成的健壮响应应用程序的核心组件。\n\
  \n## Azure Service Bus Queues\n\nAzure Service Bus `Queues` 是 Azure Service Bus\
  \ 的核心组件，为构建分布式应用程序提供可靠的异步消息机制。`Queues` 实现了组件之间的解耦通信，允许它们以可靠且有序的方式交换消息。\n\nAzure\
  \ Service Bus Queues 的关键特性和特征包括：\n\n* `Reliable message delivery`：Azure Service\
  \ Bus `Queues` 通过遵循 FIFO 原则确保消息传递的可靠性。发送到 `Queue` 的消息按照接收顺序进行存储和处理，确保消息的完整性并保留操作顺序。\n\
  * `Asynchronous communication`：`Queues` 实现了发送者和接收者组件之间的异步通信。发送者组件可以将消息推送到 `Queue`\
  \ 而无需等待响应，接收者组件可以在准备好处理时从 `Queue` 中检索消息。这种异步模式允许松散耦合并提高系统响应能力。\n* `Message durability`：存储在\
  \ Azure Service Bus `Queues` 中的消息是持久的。它们以冗余方式存储在 Azure 基础设施内的多个节点上，确保了高可用性并防止数据丢失。即使组件故障或发生临时网络问题，消息也会保留在\
  \ `Queue` 中直到它们被成功处理。\n* `Scalability`：Azure Service Bus `Queues` 设计用于处理高消息吞吐量并实现无缝扩展。它们支持跨多个节点的自动负载均衡和消息分区，允许水平扩展并适应不断增长的工作负载。\n\
  * `One-way and request-response communication`：`Queues` 支持单向消息传递和请求/响应模式。在单向消息中，发送者组件将消息推送到\
  \ `Queue` 而不期望响应。在请求/响应场景中，发送者将请求消息放在 `Queue` 中并等待接收者组件的响应消息。\n* `Message Time-to-Live\
  \ (TTL)`：Azure Service Bus `Queues` 提供了设置消息生存时间（TTL）值的能力。`TTL` 决定了消息在过期并自动删除之前可以在\
  \ `Queue` 中留存多久。此功能有助于管理消息留存，并确保消息在指定的时间范围内被处理。\n* `Dead-lettering`：Azure Service\
  \ Bus `Queues` 包含死信处理功能。如果消息无法被成功处理或超过最大交付尝试次数，可以将其移动到单独的死信 `Queue` 进行进一步分析和处理。死信处理允许有效的错误处理和故障排除。\n\
  * `Management and monitoring`：Azure Service Bus `Queues` 可以通过 `Azure portal`、`Azure\
  \ CLI`、`PowerShell` 和 `REST APIs` 进行管理和监控。这些工具提供了创建和配置 `Queues`、监控消息吞吐量、跟踪 `Queue`\
  \ 指标以及管理访问控制和安全设置的功能。\n\nAzure Service Bus `Queues` 广泛应用于各种场景，例如任务卸载、负载均衡、事件驱动架构和分布式系统。它们的可靠性和异步特性使其非常适用于构建需要解耦和有序消息处理的健壮应用程序。\n\
  \n## Session Queues\n\n`Session Queues` 是 Azure Service Bus 中的一种特殊功能，允许将相关的消息分组在一起并由同一个接收者按顺序处理。在普通的\
  \ `Queues` 中，消息是独立处理的，它们之间没有内在联系。然而，`session Queues` 实现了 `message sessions`，将逻辑消息流与特定的\
  \ `session ID` 关联。\n\n`Session Queues` 对于那些维护消息顺序和分组至关重要的场景特别有用，例如多步骤工作流、事务处理，当任务的不同部分需要由同一个接收者按顺序处理时。\n\
  \n\n\n\n通过利用会话队列（Queues），开发者可以确保会话内的消息按照发送顺序进行处理，并在多个消息处理周期内维护会话状态。这确保了相关消息处理的一性和可靠性，并对复杂的工作流和处理场景提供了更大的控制。\n\
  \n# Azure Service Bus Topics（主题）\n\nAzure Service Bus Topics 是 Azure Service Bus\
  \ 提供的一项强大消息功能。Topics 支持发布/订阅消息模式，允许消息被发布一次并被多个订阅者接收。Topics 为向感兴趣的方广播消息提供了一种灵活且可扩展的解决方案。\n\
  \nAzure Service Bus Topics 的主要功能和特性包括：\n\n- **发布/订阅消息传递**：Azure Service Bus Topics\
  \ 遵循发布/订阅消息模式。发布到 `Topic` 的消息不会直接发送给订阅者，而是存储在 `Topic` 中。订阅者可以为 `Topic` 创建 `Subscriptions`（订阅），并根据特定标准或兴趣接收消息。这种解耦模型允许高效的消息分发和组件之间的灵活通信。\n\
  - **消息过滤**：Topics 支持根据用户定义的属性进行消息过滤。`Subscriptions` 可以定义过滤规则，仅接收符合特定标准的消息。此功能允许对递送到订阅者的消息进行精粒度控制，确保每个订阅者都能接收相关且针对性的消息。\n\
  - **消息路由**：Azure Service Bus Topics 提供消息路由能力。发布者可以定义路由规则，根据消息属性决定如何在不同的 `Subscriptions`\
  \ 之间分发消息。这实现了智能消息路由并选择性地交付给相应的订阅者。\n- **多个订阅**：Topics 支持多个 `Subscriptions`，允许不同的组件或订阅者独立接收消息。每个\
  \ `Subscription` 维护自己的游标，允许订阅者按照自己的节奏接收消息并独立管理其消息处理。\n- **有序消息传递**：在每个 `Subscription`\
  \ 中，消息按照发布顺序递递。这确保了订阅者以顺序且一致的方式接收消息，使 Topics 适用于需要有序消息处理的场景。\n- **消息会话**：Topics\
  \ 还支持消息会话，允许相关消息分组并按顺序处理。在维护消息顺序和共同处理相关消息重要的场景中，消息会话非常有用，例如多步骤工作流或涉及多消息的事务。\n- **可扩展性和性能**：Azure\
  \ Service Bus Topics 设计具有高度的可扩展性和性能。它们支持跨多个节点的消息自动负载均衡和分区，允许高吞吐量和水平扩展性。Topics 可以处理大量消息量并支持大量的数量\
  \ `Subscriptions`。\n- **管理与监控**：可以通过 Azure 门户、`Azure CLI`、`PowerShell` 和 `REST APIs`\
  \ 对 Azure Service Bus Topics 进行管理和监控。这些工具提供了创建和配置 `Topics` 及 `Subscriptions`、监控消息吞吐量和\
  \ `Subscription` 活动以及管理访问控制和安全设置的能力。\n\nAzure Service Bus Topics 广泛应用于各种场景，包括事件驱动架构、通知、内容分和微服务通信。它们为向多个订阅者广播消息提供了灵活且可扩展的解决方案，确保组件之间高效且解耦的通信。\n\
  \n# Azure Service Bus Subscriptions（订阅）\n\nAzure Service Bus Subscriptions 是 Azure\
  \ Service Bus Topics 的关键组件。订阅允许根据特定标准或兴趣从 `Topic` 接收并处理消息。它们为订阅者消费发布到 `Topic` 的消息提供了一种灵活且针对的方法。\n\
  \nAzure Service Bus Subscriptions 的主要功能和特性包括：\n\n- **消息过滤**：`Subscriptions` 允许根据用户定义的属性进行消息过滤。通过指定过滤规则，订阅者可以仅接收符合其标准或兴趣的消息。这种过滤能力允许订阅者消费相关消息并避免处理不必要的消息。\n\
  - **选择性消息传递**：Azure Service Bus Subscriptions 提供选择性消息传递。每个 `Subscription` 定义了自己的的一套过滤规则，允许订阅者仅接收符合其标准的消息。这确保了订阅者从\
  \ `Topic` 接收到自定义的消息子集。\n- **有序消息传递**：递送到 Azure Service Bus Topic 中 `Subscription`\
  \ 的消息保持其顺序。这意味着消息的递递和处理顺序与发布时的顺序相同。有序消息传递确保了一致性并帮助订阅者维护操作序列。\n- **多个订阅**：Topics\
  \ 支持多个 `Subscriptions`，允许不同的组件或订阅者独立接收消息。每个 `Subscription` 维护自己的游标，允许订阅者按照自己的节奏接收消息并独立管理其消息处理。\n\
  - **消息会话**：`Subscriptions` 也支持消息会话，允许相关消息分组并按顺序处理。在维护消息顺序和共同处理相关消息重要的场景中，消息会话非常有用，例如多步骤工作流或涉及多消息的事务。\n\
  - **自动伸缩与性能**：Azure Service Bus Subscriptions 设计具有可扩展性和性能。它们可以处理高消息吞吐量并支持大量的订阅者。`Subscriptions`\
  \ 得益于 Azure Service Bus 的自动负载均衡和分区功能，确保高效的消息分发。\n- **管理与监控**：可以通过 Azure 门户、`Azure\
  \ CLI`、`PowerShell` 和 `REST APIs` 对 Azure Service Bus Subscriptions 进行管理和监控。这些工具提供了创建和配置\
  \ `Subscriptions`、定义过滤规则、监控 `Subscription` 活动和消息吞吐量以及管理访问控制和安全设置的能力。\n\nAzure Service\
  \ Bus Subscriptions 通常用于涉及发布/订阅消息模式、事件驱动架构、通知和内容内容的场景。它们为组件根据特定标准消费发布在 `Topic` 上的消息提供了灵活且针对的方法，实现了组件之间解耦且高效的通信。\n\
  \n# Azure Service Bus vs Azure Queue Storage Queues\n\nAzure Service Bus 和 Azure\
  \ Queue Storage Queues 都充当消息代理，促进分布式系统中不同组件之间的通信。然而，它们具有不同的特性和能力，使它们适用于不同的场景，如下表所示：\n\
  \n| 功能 | Azure Service Bus | Azure Queue Storage Queues |\n| :--- | :--- | :---\
  \ |\n| 通信模式 | 发布/订阅、点对点 | 点对点 |\n| 消息排序 | 支持 | 支持 |\n| 消息过滤 | 支持 | 不支持 |\n| 呆信队列\
  \ | 支持 | 支持 |\n| 计划递递 | 支持 | 不支持 |\n| 消息会话 | 支持 | 不支持 |\n| 自动伸缩 | 支持 | 支持 |\n| 消息\
  \ TTL (生存时间) | 支持 | 支持 |\n| 消息事务 | 支持 | 不支持 |\n| 可靠性与持久性 | 高可靠 | 高可靠 |\n\n\n\n\n\
  \n| 高级功能与灵活性 | 是 | 有限 |\n| :--- | :--- | :--- |\n| 推荐复杂度 | 中/高 | 低 |\n\n表 6.1：Service\
  \ Bus 与 Queue 存储之间的功能概览\n\nAzure Service Bus 是一种强大且功能丰富的消息服务，支持发布/订阅（Publish/Subscribe）和点对点（Point-to-Point）通信模式。它提供了高级功能，如消息过滤、用于失败消息的死信队列（Dead-letter\
  \ Queues）、消息调度交付、用于分组相关消息的消息以及对消息事务的支持。对于需要复杂消息处理和通信模式的中高场景，建议使用 Azure Service Bus。\n\
  \n另一方面，Azure Queue Storage Queues 是更基础的消息代理，主要为点对点通信设计。虽然它们提供了可靠的消息投递并支持消息排序，但缺乏\
  \ Azure Service Bus 提供的一些高级功能，例如消息过滤、调度交付和消息会话。Azure Queue Storage Queues 更适用于基础消息队列和处理即可的低复杂度场景。\n\
  \n总而言之，Azure Service Bus 是中高复杂度和高性消息需求场景的稳健选择，而 Azure Queue Storage Queues 则为具有简单消息队列需求的低复杂度场景提供了更简单的解决方案。在两者之间选择取决于正在开发的应用程序或系统的特定需求和复杂度。\n\
  \n## 案例研究\n\n在案例研究中，我们正在处理 Azure Service Bus 的各种功能，并实现不同的组件以完成与消息处理和处理相关的任务。为了更好地理解，我们为每个消费者准备了一个控制台应用程序，同时也为发布者准备了一个控制台应用程序。以下是案例研究涉及的任务分解：\n\
  \n*   **发布消息**\n    * 实现一个发送组件向 Azure Service Bus 队列发布消息。\n    * 使用用于 .NET 的 `Azure\
  \ Service Bus SDK` 向 `Queue` 发送消息。\n*   **消费消息**\n    * 实现一个接收器组件以消费并处理来自 Azure\
  \ Service Bus 队列的消息。\n    * 处理消息逻辑并实现任何必要的业务逻辑。\n*   **消费消息批**\n    * 实现一个接收器组件以批处理消息。\n\
  \    * 通过分批处理消息来提高消息处理效率。\n*   **消息处理器**\n    * 实现一个负责处理消息处理逻辑的消息处理器组件。\n    * 消息处理器将由接收器用于处理单个消息或消息批。\n\
  *   **消费会话**\n    * 实现一个接收器组件以消费并处理来自 Azure Service Bus 会话的消息。\n    * 实现使用 `session\
  \ IDs` 将相关消息分组的逻辑。\n*   **会话处理器**\n    * 实现一个负责处理基于会话的消息的会话处理器组件。\n    * 会话处理器将由接收器按发送顺序处理会话内的消息。\n\
  *   **消费主题和订阅**\n    * 实现订阅组件以消费并处理来自 Azure Service Bus 主题（Topics）和订阅（Subscriptions）的消息。\n\
  \    * 根据不同的标准或兴趣定义多个 `Subscriptions`，并实现选择性消息传递的逻辑。\n*   **使用的 NuGet 包：**\n   \
  \ * `Azure.Messaging.ServiceBus`\n\n## 创建新的 Azure Service Bus\n\n我们实践案例研究的第一步是创建一个新的\
  \ Azure Service Bus 组件，我们需要按照以下步骤操作：\n\n1.  **登录 Azure 门户**：访问 [`https://portal.azure.com`](https://portal.azure.com)\
  \ 并使用您的 Microsoft Azure 账户登录。\n2.  **创建新资源**：登录后，点击 Azure 门户左侧的“创建资源”按钮 (+)。\n3.\
  \  **搜索“Service Bus”**：在搜索栏中输入“Service Bus”，从可用服务列表中选择“Service Bus”。\n4.  **点击“创建”**：在\
  \ Service Bus 页面上，点击“创建”按钮开始创建过程。\n5.  **基本信息**：\n    * **订阅**：选择您要创建 Service Bus\
  \ 命名空间的 `Azure Subscription`。\n    * **资源组**：选择现有的资源组或创建一个新组以包含 Service Bus 命名空间及相关资源。\n\
  \    * **命名空间名称**：为您的 Service Bus 命名空间输入唯一名称。该名称在所有 Azure Service Bus 命名空间中必须是全局唯一的。\n\
  \    * **区域**：选择您要部署 Service Bus 命名空间的区域。选择地理上靠近您的应用程序或服务的区域以获得最佳性能。\n    * **定价层级**：选择符合您需求的定价层级。Azure\
  \ Service Bus 提供具有不同功能和定价选项的不同层级。\n    * **虚拟网络**：如果需要，您可以选择启用虚拟网络规则，限制特定虚拟网络访问\
  \ Service Bus 命名空间。\n    * **标签**：可选地，您可以添加标签来帮助组织和分类您的 Azure 资源。\n6.  **查看 + 创建**：检查您的配置设置并点击“创建”按钮开始部署过程。\n\
  \nAzure Service Bus 命名空间的部署可能需要几分钟。一旦部署完成，您将在 Azure 门户中看到新的 Azure Service Bus 命名空间。现在您可以开始使用\
  \ Service Bus 进行消息队列、发布/订阅消息和其他消息模式来构建分布式应用程序。部署成功后，我们的 Service Bus 命名空间应如下所示：\n\
  \n![](img/Figure_6.1.png)\n\n图 6.1：Azure 门户中的 Service Bus 命名空间\n\n现在我们需要获取 Service\
  \ Bus 的连接字符串，请按照以下步骤操作：\n\n1.  **访问共享访问策略**：在 Service Bus 命名空间内部，导航到左侧菜单，在“设置”下点击“共享访问策略”。\n\
  2.  **创建或访问现有的共享访问策略**：默认会有一个 `RootManageSharedAccessKey` 策略，它具有完全访问权限。虽然可以使用此策略获取连接字符串，但建议创建一个具有特定权限的自定义策略。\n\
  3.  **创建自定义共享访问策略（可选）**：如果您想创建自定义策略，点击“添加”创建一个新的共享访问策略。赋予它一个名称并根据您的应用程序需求指定所需的权限（例如\
  \ `Send`、`Listen`、`Manage`）。\n4.  **获取连接字符串**：在创建或选择所需的共享访问策略后，点击策略名称查看详细信息。连接字符串将在\
  \ `Primary Connection String` 字段可用。此连接字符串包含您的应用程序身份验证并连接到 Azure Service Bus 命名空间所需的信息，如下所示：\n\
  \n![](img/Figure_6.2.png)\n\n图 6.2：Service Bus 连接字符串\n\n现在我们需要创建队列（Queue），后续步骤如下：\n\
  \n1.  在 Service Bus 命名空间内部，导航到左侧菜单，在“实体（Entities）”下点击“队列（Queues）”。\n2.  **创建新队列**：点击\
  \ `+ Queue` 按钮创建一个队列。\n3.  **配置队列**：\n    * **名称**：为队列输入唯一名称。该名称在 Azure Service\
  \ Bus 命名空间内必须是全局唯一的。\n    * **启用分区**：默认禁用分区，如果您预计会有高消息吞吐量，可以选择启用它以提高可扩展性。\n\n\n\n\
  \n\n- **重复检测**：你可以启用重复检测，以防止在指定的时间窗口内处理重复消息。\n- **生存时间 (TTL)**：可选地，你可以为 `Queue`\
  \ 中的消息设置一个 `TTL` 值。超过 `TTL` 的消息将自动从 `Queue` 中删除。\n4. **访问控制（可选）**：配置访问控制以为访问 `Queue`\
  \ 的不同用户或应用程序设置权限。\n5. **创建队列**：点击“创建（Create）”按钮创建 `Queue`。`Queue`将在 Azure Service\
  \ Bus 命名空间内配置，如下图所示：\n\n![](img/Figure_6.3..png)\n\n图 6.3：最近创建的 Service Bus 队列\n\
  \n现在我们来创建会话队列，请按照以下步骤操作：\n\n1. 在 Service Bus 命名空间中，导航到左侧菜单，在“实体（Entities）”下，点击“队列”。\n\
  2. **创建新队列**：点击 `+ Queue` 按钮创建一个新的 `Queue`。\n3. **配置队列**：\n    - **名称**：为 `Queue`\
  \ 输入一个唯一名称。该名称在 Azure Service Bus 命名空间内必须是全局唯一的。\n    - **启用分区**：默认禁用分区，但如果你预计会有高消息吞吐量，可以选择启用它以提高扩展性。\n\
  \    - **会话**：要创建一个启用会话的 `Queue`，请勾选“启用会话（Enable session）”复框。这将使 `Queue` 支持消息会话。\n\
  4. **访问控制（可选）**：配置访问控制以为访问 `Queue` 的不同用户或应用程序设置权限。\n5. **创建队列**：点击“创建（Create）”按钮创建启用会话的\
  \ `Queue`。`Queue`将在 Azure Service Bus 命名空间内配置，如下所示：\n\n![](img/Figure_6.4..png)\n\
  \n图 6.4：最近创建的 Service Bus 会话队列\n\n要创建主题，请遵循后续步骤：\n\n1. 在 Service Bus 命名空间中，导航到左侧菜单，在“实体（Entities）”下，点击“主题（Topics）”。\n\
  2. **创建新主题**：点击 `+ Topic` 按钮创建一个新的 `Topic`。\n3. **配置主题**：\n    - **名称**：为 `Topic`\
  \ 输入一个唯一名称。该名称在 Azure Service Bus 命名空间内必须是全局唯一的。\n    - **启用分区**：默认禁用分区，但如果你预计会有高消息吞吐量，可以选择启用它以提高扩展性。\n\
  4. **访问控制（可选）**：配置访问控制以为访问 `Topic` 的不同用户或应用程序设置权限。\n5. **创建主题**：点击“创建（Create）”按钮创建\
  \ `Topic`。`Topic`将在 Azure Service Bus 命名空间内配置，如下所示：\n\n![](img/Figure_6.5..png)\n\
  \n图 6.5：最近创建的 Service Bus 主题\n\n现在我们要创建订阅，请按照以下步骤操作：\n\n1. 在 Service Bus 命名空间中，导航到左侧菜单，在“实体（Entities）”下，点击“主题（Topics）”。\n\
  2. **选择主题**：点击你想要创建订阅的 `Topic`。\n3. **创建新订阅**：在选定的 `Topic` 内部，导航到左侧菜单，在“实体（Entities）”下，点击“订阅（Subscriptions）”。\n\
  4. **创建新订阅**：点击 `+ Subscription` 按钮创建一个新的 `Subscription`。\n5. **配置订阅**：\n    - **名称**：为\
  \ `Subscription` 输入一个唯一名称。该名称在选定的 `Topic` 内必须是唯一的。\n    - **过滤（可选）**：可选地，你可以为 `Subscription`\
  \ 设置过滤器，以便根据消息属性仅接收特定的消息。\n6. **访问控制（可选）**：配置访问控制以为访问 `Subscription` 的不同用户或应用程序设置权限。\n\
  7. **创建订阅**：点击“创建（Create）”按钮创建 `Subscription`。`Subscription`将在选定的 Azure Service\
  \ Bus `Topic` 内配置，如下所示：\n\n![](img/Figure_6.6..png)\n\n图 6.6：最近创建的 Service Bus 订阅\n\
  \n## 发布到 Azure Service Bus (#contents.xhtml_sc3_130a)\n\n发布者组件在我们的分布式应用程序中起着核心作用，利用\
  \ .NET 和 C# 结合 Azure Service Bus 来管理关键的消息模式。这个多功能组件在发布消息、传输消息批、处理主题工作以及处理消息会话方面表现出色。\n\
  \n在这个实际案例研究中，发布者组件使用了以下代码：\n\n```csharp\nusing Azure.Messaging.ServiceBus;\nusing\
  \ System;\nusing System.Threading.Tasks;\n\nstring connectionString = \"Endpoint=sb://your.servicebus.windows.net/;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=your-key\"\
  ;\nawait ServiceBusClient client = new ServiceBusClient(connectionString);\nServiceBusSender\
  \ sender = client.CreateSender(\"topicname\");\n\nServiceBusMessage message = new\
  \ ServiceBusMessage(\"Hello World!\");\nawait sender.SendMessageAsync(message);\n\
  ```\n\n以下是发送批消息的代码：\n\n```csharp\nusing Azure.Messaging.ServiceBus;\nusing System;\n\
  using System.Threading.Tasks;\n\nstring connectionString = \"Endpoint=sb://your.servicebus.windows.net/;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=your-key\"\
  ;\nawait ServiceBusClient client = new ServiceBusClient(connectionString);\nServiceBusSender\
  \ sender = client.CreateSender(\"topicname\");\n\nusing ServiceBusMessageBatch batch\
  \ = await sender.CreateMessageBatchAsync();\n\nfor (int i = 1; i < 10; i++)\n{\n\
  \    ServiceBusMessage message = new ServiceBusMessage($\"Message {i}\");\n    if\
  \ (!batch.TryAdd(message))\n    {\n        throw new Exception($\"The message {i}\
  \ is too large to fit in the batch.\");\n    }\n}\n\nawait sender.SendMessagesAsync(batch);\n\
  ```\n\n这是带会话发送消息的代码：\n\n```csharp\nusing Azure.Messaging.ServiceBus;\nusing System;\n\
  using System.Threading.Tasks;\n\nstring connectionString = \"Endpoint=sb://your.servicebus.windows.net/;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=your-key\"\
  ;\nawait ServiceBusClient client = new ServiceBusClient(connectionString);\nServiceBusSender\
  \ sender = client.CreateSender(\"topicname\");\n\nServiceBusMessage message = new\
  \ ServiceBusMessage(\"Hello World!\")\n{\n    SessionId = \"session1\"\n};\nawait\
  \ sender.SendMessageAsync(message);\n```\n\n这是从会话队列接收消息的代码：\n\n```csharp\nusing\
  \ Azure.Messaging.ServiceBus;\nusing System;\nusing System.Threading.Tasks;\n\n\
  string connectionString = \"Endpoint=sb://your.servicebus.windows.net/;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=your-key\"\
  ;\nawait ServiceBusClient client = new ServiceBusClient(connectionString);\nServiceBusReceiver\
  \ receiver = client.CreateReceiver(\"queuename\");\n\nawait ServiceBusSessionReceiver\
  \ processor = await receiver.AcceptNextSessionAsync(\"session1\");\n\nwhile (true)\n\
  {\n    ServiceBusMessage message = await processor.ReceiveMessageAsync();\n    Console.WriteLine(message.Body.ToString());\n\
  \    await processor.CompleteMessageAsync(message);\n}\n```\n\nConsole.WriteLine(\"\
  Messages Published!\");\n\n这是发布到队列和会话队列后的 Azure 门户：\n\n![](img/Figure_6.7..png)\n\
  \n图 6.7：带有消息的 Service Bus 队列\n\n这是发布到主题和订阅后的 Azure 门户：\n\n![](img/Figure_6.8..png)\n\
  \n\n\n\n\n# 图 6.8：带有消息的 Service Bus Topic\n\n## 消费消息\n\n在此过程中，接收器组件从 `Queue` 中检索消息：\n\
  \n```csharp\n// 更多信息请访问 https://aka.ms/new-console-template\n\nusing Azure.Messaging.ServiceBus;\n\
  \nstring connectionString = \"Endpoint=sb://thiagosample.servicebus.windows.net/;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=e6Bb5GnhuadJfa1W49kCxwfBztioIAHXU+ASbH7kjrc=\"\
  ;\nstring queueName = \"samplequeue\";\n\nawait using ServiceBusClient client =\
  \ new ServiceBusClient(connectionString);\n\n// 创建用于配置处理器的选项\nvar options = new\
  \ ServiceBusProcessorOptions\n{\n    // 默认情况下或当 AutoCompleteMessages 设置为 true 时，处理器将在执行处理程序后完成消息\n\
  \    // 将 AutoCompleteMessages 设置为 false 以自行[完成消息](https://docs.microsoft.com/en-us/azure/service-bus-messaging/message-transfers-locks-settlement#peeklock)\n\
  \    // 在两种情况下，如果消息处理程序在未完成消息的情况下抛出异常，处理器将放弃该消息\n    AutoCompleteMessages = false,\n\
  \n    // 我也可以允许多线程\n    MaxConcurrentCalls = 2\n};\n\n// 创建一个我们可以用于处理消息的处理器\nawait\
  \ using ServiceBusProcessor processor = client.CreateProcessor(queueName, options);\n\
  \n// 配置要使用的消息和错误处理程序\nprocessor.ProcessMessageAsync += MessageHandler;\nprocessor.ProcessErrorAsync\
  \ += ErrorHandler;\n\nasync Task MessageHandler(ProcessMessageEventArgs args)\n\
  {\n    string body = args.Message.Body.ToString();\n    Console.WriteLine(body);\n\
  \n    // 我们可以评估应用程序逻辑并用它来决定如何完成消息\n    await args.CompleteMessageAsync(args.Message);\n\
  }\n\nTask ErrorHandler(ProcessErrorEventArgs args)\n{\n    // 错误源告诉错误是在处理的哪个点发生的\n\
  \    Console.WriteLine(args.ErrorSource);\n    // 可完全限定命名空间\n    Console.WriteLine(args.FullyQualifiedNamespace);\n\
  \    // 还有实体路径\n    Console.WriteLine(args.EntityPath);\n    Console.WriteLine(args.Exception.ToString());\n\
  \    return Task.CompletedTask;\n}\n\n// 开始处理\nawait processor.StartProcessingAsync();\n\
  \n// 由于处理是在后台进行的，我们添加了 Console.ReadKey 以允许处理继续进行，直到按下键。\nConsole.ReadKey();\n```\n\
  \n在下方的图中，我们可以看到程序的输出：\n\n![](img/Figure_6.9..png)\n\n图 6.9：消费消息的控制台应用程序输出\n\n##\
  \ 消费消息批\n\n这种方法不是逐个消费消息，而是允许接收器组件一起处理多条消息，从而优化消息处理并减少通信开销。\n\n以下是本案例中用于消费消息批的代码：\n\
  \n```csharp\n// 更多信息请访问 https://aka.ms/new-console-template\n\nusing Azure.Messaging.ServiceBus;\n\
  \nstring connectionString = \"Endpoint=sb://thiagosample.servicebus.windows.net/;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=e6Bb5GnhuadJfa1W49kCxwfBztioIAHXU+ASbH7kjrc=\"\
  ;\nstring queueName = \"samplequeue\";\n\nawait using ServiceBusClient client =\
  \ new ServiceBusClient(connectionString);\n\n// 创建一个我们可以用于接收消息的接收器\nawait using\
  \ ServiceBusReceiver receiver = client.CreateReceiver(queueName);\n\n// 接收到的消息类型不同，因为它包含一些服务设置属性\n\
  // 接收了一批消息（在这种情况下最多为 4 条）\nIReadOnlyList<ServiceBusReceivedMessage> receivedMessages\
  \ = await receiver.ReceiveMessagesAsync(maxMessages: 4);\nConsole.WriteLine(\"批中的消息数量：\"\
  \ + receivedMessages.Count);\n\n// 遍历收到的每条消息\nforeach (ServiceBusReceivedMessage\
  \ receivedMessage in receivedMessages)\n{\n    // 获取消息正体的字符串形式\n    string body\
  \ = receivedMessage.Body.ToString();\n    Console.WriteLine(body);\n}\n```\n\n在我们的程序成功执行后，如图像所示，我们有如下输出：\n\
  \n![](img/Figure_6.10.png)\n\n图 6.10：消费消息批的控制台应用程序输出\n\n## 消息处理器\n\nAzure Bus 中消息处理器的概念围绕着构建可靠的机制，以处理来自队列或订阅的入站消息。消息处理器是接收消息、处理消息以及执行所需逻辑的基础组件。\n\
  \n\n\n\n\n要消费会话（session），我们需要以下代码，它将负责连接服务线并接收会话中的消息：\n\n```csharp\n// See https://aka.ms/new-console-template\
  \ for more information\n\nusing Azure.Messaging.ServiceBus;\n\nstring connectionString\
  \ = \"Endpoint=sb://thiagosample.servicebus.windows.net/;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=e6Bb5GnhuadJfa1W49kCxwfBztioIAHXU+ASbH7kjrc=\"\
  ;\nstring sessionQueueName = \"samplesessionqueue\";\n\nawait using ServiceBusClient\
  \ client = new ServiceBusClient(connectionString);\n\n// 创建一个指定会话的接收器\nawait using\
  \ ServiceBusSessionReceiver receiver = await client.AcceptSessionAsync(sessionQueueName,\
  \ \"sampleSessionId\");\n\n// 接收的消息类型不同，因为它包含一些服务设置属性\nServiceBusReceivedMessage\
  \ receivedMessage = await receiver.ReceiveMessageAsync();\nConsole.WriteLine(\"\
  Session Id: \" + receivedMessage.SessionId);\nConsole.WriteLine(\"Body\" + receivedMessage.Body);\n\
  \n// 我们也可以使用此接收器设置任意会话状态\n// 该状态特定于会话，而不是针对任何特定消息\nawait receiver.SetSessionStateAsync(new\
  \ BinaryData(\"brand new state\"));\n\n// 完成消息，从而从服务中删除它\nawait receiver.CompleteMessageAsync(receivedMessage);\n\
  ```\n\n在成功执行我们的会话接收器后，我们得到了以下输出：\n\n![](img/Figure_6.12..png)\n\n图 6.12：消费会话的控制台应用程序输出\n\
  \n## 会话处理器 (Session processor)\n\n会话处理器是一个关键组件，负责处理会话内的消息，确保操作的顺序性和协调性。\n\n以下代码负责创建并执行会话处理器：\n\
  \n```csharp\n// See https://aka.ms/new-console-template for more information\n\n\
  using Azure.Messaging.ServiceBus;\n\nstring connectionString = \"Endpoint=sb://thiagosample.servicebus.windows.net/;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=e6Bb5GnhuadJfa1W49kCxwfBztioIAHXU+ASbH7kjrc=\"\
  ;\nstring queueName = \"samplequeue\";\nstring sessionQueueName = \"samplesessionqueue\"\
  ;\nstring topicName = \"sampletopic\";\nstring subscriptionName = \"samplesubscription\"\
  ;\n\n// 由于 ServiceBusClient 实现 IAsyncDisposable，我们使用 \"await using\" 创建它\nawait\
  \ using ServiceBusClient client = new ServiceBusClient(connectionString);\n\n//\
  \ 创建用于配置处理器的选项\nvar options = new ServiceBusSessionProcessorOptions\n{\n    // 默认情况下，在消息处理器返回后，处理器将完成消息\n\
  \    // 如果我想对结算进行更细粒度的控制，可以将其设置为 false\n    AutoCompleteMessages = false,\n\n  \
  \  // 我也可以允许处理多个会话\n    MaxConcurrentSessions = 5,\n\n    // 默认或当 AutoCompleteMessages\
  \ 设置为 true 时，处理器将在执行消息处理器后完成消息\n    // 将 AutoCompleteMessages 设置为 false 以自行[结算消息](https://docs.microsoft.com/en-us/azure/service-bus-messaging/message-transfers-locks-settlement#peeklock)\n\
  \    // 在两种情况下，如果消息处理器在未结算消息的情况下抛出异常，处理器将放弃该消息\n    MaxConcurrentCallsPerSession\
  \ = 2,\n\n    // 处理可以可选限制为会话 ID 的子集\n    SessionIds = { \"sampleSessionId\", \"\
  sampleSessionId2\" },\n};\n\n// 创建一个用于处理消息的会话处理器\nawait using ServiceBusSessionProcessor\
  \ processor = client.CreateSessionProcessor(sessionQueueName, options);\n\n// 配置要使用的消息和错误处理器\n\
  processor.ProcessMessageAsync += MessageHandler;\nprocessor.ProcessErrorAsync +=\
  \ ErrorHandler;\n\nasync Task MessageHandler(ProcessSessionMessageEventArgs args)\n\
  {\n    var body = args.Message.Body.ToString();\n    Console.WriteLine(\"Session\
  \ Id: \" + args.Message.SessionId);\n    Console.WriteLine(\"Body\" + body);\n\n\
  \    // 我们可以评估应用程序逻辑并据此决定如何结算消息\n    await args.CompleteMessageAsync(args.Message);\n\
  \n    // 我们也可以使用此接收器设置任意会话状态\n    // 该状态特定于会话，而不是针对任何特定消息\n    await args.SetSessionStateAsync(new\
  \ BinaryData(\"sample state\"));\n}\n\nTask ErrorHandler(ProcessErrorEventArgs args)\n\
  {\n    // 错误源告诉我错误是在处理的哪个点发生的\n    Console.WriteLine(args.ErrorSource);\n    //\
  \ 可完全限定命名空间\n    Console.WriteLine(args.FullyQualifiedNamespace);\n    // 以及实体路径\n\
  \    Console.WriteLine(args.EntityPath);\n    // 异常详情\n    Console.WriteLine(args.Exception.ToString());\n\
  \    return Task.CompletedTask;\n}\n\n// 开始处理\nawait processor.StartProcessingAsync();\n\
  // 由于处理在后台进行，我们添加了 Console.ReadKey 以允许处理一直持续到按下键\nConsole.ReadKey();\n```\n\n在成功执行我们的会话处理器后，我们得到了以下输出：\n\
  \n（注：原文在此处缺少该部分的输出图像描述）\n\n## 消费主题与订阅 (Topics and Subscriptions)\n\n此模式允许多个订阅组件根据它们的兴趣或订阅标准从单个主题（Topic）接收消息。\n\
  \n要消费主题和订阅，我们需要以下代码：\n\n```csharp\n// See https://aka.ms/new-console-template for\
  \ more information\n\nusing Azure.Messaging.ServiceBus;\n\nstring connectionString\
  \ = \"Endpoint=sb://thiagosample.servicebus.windows.net/;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=e6Bb5GnhuadJfa1W49kCxwfBztioIAHXU+ASbH7kjrc=\"\
  ;\nstring topicName = \"sampletopic\";\nstring subscriptionName = \"samplesubscription\"\
  ;\n\nawait using ServiceBusClient client = new ServiceBusClient(connectionString);\n\
  \n// 为我们的订阅创建一个接收器，用于接收消息\nawait using ServiceBusReceiver receiver = client.CreateReceiver(topicName,\
  \ subscriptionName);\n\n// 接收的消息类型不同，因为它包含一些服务设置属性\nServiceBusReceivedMessage receivedMessage\
  \ = await receiver.ReceiveMessageAsync();\n\n// 获取消息体作为字符串\nstring body = receivedMessage.Body.ToString();\n\
  Console.WriteLine(body);\n```\n\n在成功执行我们的程序后，我们得到了以下输出：\n\n![](img/Figure_6.14.png)\n\
  \n图 6.14：消费主题和订阅的控制台应用程序输出\n\n最后，这就是我们的项目解决方案。每个消费者都有一个控制台应用程序，外，发布者也有一个控制台应用程序，如下所示：\n\
  \n![](img/Figure_6.15.png)\n\n图 6.15：带有控制台应用程序的项目解决方案\n\n\n\n\n接下来，我们深入研究了主题（Topics）和订阅（Subscriptions），这使我们能够实现发布/订阅模式。我们发现了如何创建主题、定义订阅，并利用消息过滤和路由技术高效地将消息分发给感兴趣的方。这种灵活性和可扩展性对于构建响应迅速且解耦的系统至关重要。\n\
  \n案例研究提供了宝贵的实操经验，指导我们逐步实施了 `Azure Service Bus`。我们创建了新的 `Azure Service Bus` 实例，定义了主题、订阅和通知，并获得了对真实场景的实践见解。该案例研究使我们具备了在项目中有效应用\
  \ `Azure Service Bus` 所需知识和技能。\n\n我们还探索了消息会话（message sessions）的使用，它允许我们处理与不同客户端的交互，并在每个会话内维护消息顺序。消息会话证明是管理复杂工作流和优化分布式系统性能的价值工具。\n\
  \n最后，我们讨论了异常管理和错误处理策略，承认了为意外情况和失败做好准备。我们学习了处理异常、重试消息处理以及实施稳健错误处理机制的最佳实践，以确保应用程序的韧性和稳定性。\n\
