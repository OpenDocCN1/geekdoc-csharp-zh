  \n\n本章概述了三种关键 Azure 存储服务，并解释了如何在 .NET 应用程序中使用它们。本章涵盖了 Azure SQL Database、Azure Cosmos\
  \ DB 和 Azure Blob Storage，并为每个服务提供了实用示例。\n\n\nAzure SQL 是由 Microsoft Azure 提供的全托管关系型数据库服务。它为云端存储和管理关系型数据提供了一个可靠且可扩展的平台。Azure\
  \ SQL 消除了了管理基础设施的需求，并提供了一系列功能和能力，使开发者能够专注于构建应用程序，而不是管理数据库服务器。\n\n该服务基于 Microsoft\
  \ SQL Server 引擎构建，支持 SQL Server 环境中使用的各种熟悉工具和技术。Azure SQL 与现有的 SQL Server 应用程序兼容，使得组织能够无缝地将其本地数据库迁移到云端。\n\
  \n### Azure SQL 的关键特性：\n*   **可扩展性**：Azure SQL 可以根据需求扩大或缩小规模，允许应用程序高效地处理不断变化的工作负载。\n\
  *   **高可用性**：它提供了内置的高可用性，具有自动故障转移和冗余功能，确保数据的持续访问。\n*   **安全性**：Azure SQL 提供了强大的安全功能，包括数据加密、威胁检测和身份管理，以保护敏感信息。\n\
  *   **托管服务**：Microsoft 管理底层基础设施，负责补丁、备份和维护等任务，因此使用户可以专注于应用程序开发。\n*   **集成**：Azure\
  \ SQL 与其他 Azure 服务无缝集成，允许在 Azure 生态系统中进行数据集成、分析和应用程序开发。\n\n\n*   **Web 应用程序**：Azure\
  \ SQL 常用于 Web 应用程序的后端数据库，提供可扩展且可靠的数据存储解决方案。\n*   **业务关键应用程序**：它适用于构建和管理需要安全且高可用数据存储的业务关键应用程序。\n\
  *   **数据仓库**：Azure SQL 可用于数据仓库，允许组织分析和处理海量结构化数据。\n*   **报告和分析**：它支持报告和分析解决方案，允许用户从数据中获取洞察并生成有意义的报告。\n\
  *   **软件即服务 (SaaS)**：Azure SQL 常被 SaaS 提供商用其多租户应用程序的数据库后端。\n通过利用 Azure SQL，组织可以从\
  \ Azure 云环境中全托管、可扩展且安全的关系型数据库服务的优势中受益。它提供了构建和管理高性能应用程序所需的工具和功能，而无需承担基础设施管理的开销，让业务专注于创新和增长。\n\
  \n## 扩展 Azure SQL Server\n\n扩展 Azure SQL Server 涉及调整分配给服务器的资源以满足应用程序和工作负载的需求。Azure\
  \ SQL Server 提供了多种扩展选项以适应不同的性能和容量需求。以下是扩展 Azure SQL Server 的主要方法：\n\n    *   Azure\
  \ SQL 提供了两种计算选项：预留（Provisioned）和无服务器（Serverless）。\n    *   预留计算：在此模式下，你为你的 SQL 服务器选择特定数量的计算资源（CPU\
  \ 和内存）。你可以根据需要扩大或缩小计算资源，但在扩展操作期间可能会涉及停机时间。\n    *   无服务器计算：此模式根据工作负载需求自动扩展计算资源。它允许在无空闲期间自动暂停和恢复服务器，以节省成本。\n\
  *   **扩展存储**\n    *   Azure SQL Server 支持自动存储扩展。存储容量将根据您的数据库大小和使用情况自动调整。您不需要担心手动管理存储。\n\
  *   **弹性池 (Elastic Pool)**\n    *   通过将具有相似资源要求的数据库分组到池中，您可以优化资源利用率和成本效益。\n    *\
  \   弹性池提供资源的自动扩展，以满足池内数据库的集体需求。\n*   **超大规模 (Hyperscale)**\n    *   Azure SQL Hyperscale\
  \ 专为大规模和高需求的工作负载设计。\n    *   它提供了近乎无限的存储容量，并支持动态扩展计算资源而无需任何停机。\n    *   Hyperscale\
  \ 实现了存储和计算的无缝扩展，以有效处理数据密集型工作负载。\n    *   Azure SQL Server 支持地理复制，允许你在不同的 Azure 区域创建数据库的只读副本。\n\
  \    *   复制提供了高可用性，并通过在多个区域之间分发读取工作负载来实现扩展。\n*   **托管实例 (Managed instance)**\n \
  \   *   Azure SQL 托管实例是云中的全托管 SQL Server 实例。\n    *   托管实例的扩展涉及选择适当的服务级别并指定所需的计算和存储资源。\n\
