  ## 结论\n\n在本章中，我们开启了探索 `Azure Functions` 的旅程，并开始使用这一强大的无服务器计算服务。我们首先理解了 `Azure Functions`\
  \ 的概念和目的，认识了它们的优势，并将其与其他无服务器产品进行了比较。随后，我们深入研究了 `Azure Functions` 的基础构建模块，即 `triggers`（触发器）和\
  \ `bindings`（绑定），它们在实现事件驱动的应用开发以及与外部资源的无缝集成方面起着至关重要的作用。\n\n为了巩固理解，我们深入研究了一个实际案例，演示了创建\
  \ `Azure Function`、选择合适的 `trigger` 以及配置 `binding` 的过程。这种实践经验让我们亲眼证了如何利用 `Azure Functions`\
  \ 来解决现实世界的挑战。\n\n\n到此时，你应该对 `Azure Functions` 有了坚实的基础，并具备了创建自己的函数所需的知识和技能。你理解了 `triggers`\
  \ 和 `bindings` 的强大和灵活，以及它们在构建可扩展的事件驱动应用中的作用。\n\n在接下来的章节中，我们将进入 Azure 强大的数据管理和存储服务的的核心。准备好探索\
  \ `Azure SQL` 在稳健的关系型数据管理方面的能力，深入 `Azure Cosmos DB` 构建的全球分布式 NoSQL 数据库世界，并发现 `Azure\
  \ Blob Storage` 处理非结构化数据的多功能性。本章将使你具备知识和实践技能，以利用这些 Azure 服务来高效地存储、管理和查询你的数据，将你的云应用提升新的高度。\n\
  \n## 要点回顾\n*   **Azure Functions 基础**：\n    *   `Azure Functions` 是无服务器计算资源，允许你响应各种事件运行代码。\n\
  \    *   它们具有高度的可扩展性且具有成本效益，因为你只需要为执行期间使用的资源付费。\n*   **触发器与绑定（Triggers and Bindings）**：\n\
  \    *   `Triggers` 根据事件或计划（如 `HTTP requests`、定时器或 `queue messages`）启动 `Azure Functions`\
  \ 的执行。\n    *   `Bindings` 促进与外部资源的交互，允许将输入和输出数据无缝集成到函数中。\n    *   你可以使用 `Azure\
  \ Portal`、`Visual Studio`、`Azure CLI` 或开发工具创建 `Azure Functions`。\n    *   根据应触发函数执行的事件选择合适的\
  \ `trigger` 类型。\n*   **函数配置**：\n    *   在函数内部配置 `input` 和 `output bindings`，以与 `Blob\
  \ Storage`、`Event Hub` 等多种 Azure 服务进行交互。\n*   **测试与调试**：\n    *   使用 `Azure Functions\
  \ Core Tools` 等工具在本地测试你的函数。\n*   **部署与扩展**：\n    *   将你的 `Azure Functions` 部署到 Azure\
  \ 云以供生产环境使用。\n    *   `Azure Functions` 根据需求自动扩展，确保资源效率。\n*   **用例**：\n    *   `Azure\
  \ Functions` 适用于广泛的用例，包括数据处理、`webhooks`、`IoT event handling` 等。\n\n\n1.  复现案例研究。\n\
