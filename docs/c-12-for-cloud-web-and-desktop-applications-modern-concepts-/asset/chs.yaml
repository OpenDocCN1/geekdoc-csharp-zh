  \n![](img/fm1.png)\n\n# 第 12 章：使用 .NET MAUI 和 Blazor Hybrid 构建多平台应用\n\n## 引言\n\n\
  欢迎来到使用 .NET Multiplatform App UI (MAUI) 和 Blazor Hybrid 构建多平台应用的精彩世界。在本章中，我们将开启一段结合\
  \ .NET MAUI 能力与 Blazor Hybrid 创新方法的旅程，创建出跨平台无缝运行的尖端应用。\n\n在第一部分中，我们将为您提供 .NET MAUI\
  \ 的全面概述，它是 Xamarin.Forms 的演进。我们将探索它的功能、优势以及它如何赋予开发者为 iOS、Android、macOS 和 Windows\
  \ 构建原生应用的能力。理解 .NET MAUI 的基础非常重要，因为它为我们后续的探索奠定了基础。\n\n接下来，我们将深入探讨 Blazor 和 Blazor\
  \ Hybrid 之间的区别。Blazor 允许开发者使用 C# 和 .NET 构建 Web 应用，而 Blazor Hybrid 引入了一种将 Web 技术与原生应用开发的革命性概念。通过理解这些差异，我们将了解到\
  \ Blazor Hybrid 如何增强我们的跨平台开发流程。\n\n本章的核心在于深度案例研究，我们将在引导你逐步实现使用 .NET MAUI 和 Blazor\
  \ Hybrid 构建的多平台应用。你将学习如何从零创建一个 .NET MAUI 项目并设置 Blazor Hybrid UI，我们将利用 Web 技术构建交互式界面。通过遵循这个实践示例，你将获得实践经验，并对\
  \ .NET MAUI 与 Blazor Hybrid 的集成有坚实的理解。\n\n因此，无论你是好奇最新进展的资深 .NET 开发者，还是渴望探索跨平台开发潜力的人，本章都将让你具备构建功能丰富的通用应用程序的能力，以适应不同的平台和受众。\n\
  \n让我们进入使用 .NET MAUI 和 Blazor Hybrid 构建多平台应用的世界，开启全球用户创造突破性体验的可能性。\n\n## 结构\n\n本章涵盖了以下主题：\n\
