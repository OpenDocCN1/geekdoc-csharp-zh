  \            {\"The Hunt for Red October\", \"Red Storm Rising\", \"Patriot Games\"\
  }\n        },\n        {\"Agatha Christie\",\n            new List<string>()\n \
  \           {\"The Mysterious Affair at Styles\", \"The Thirteen Problems\"}\n \
  \       },\n    };\n```\n\n字典的初始化代码包含三个键值对。键是作者名。值是初始化为存储书标题的 `List<string>` 对象。\n\
  \n当程序加载时，它使用以下代码显示作者名。\n\n```csharp\n// 显示作者。\nprivate void Form1_Load(object sender,\
