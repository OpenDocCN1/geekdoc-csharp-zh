  \ `Fighter` 专包括 `Knight`、`Ranger` 和 `Archer`。初始的 `MagicUser` 专才 `Illusionist`、`Witch`\
  \ 和 `Chemist`。你会如何修改 `Player` 类的定义？绘制类继承层次结构。\n\n7. 假设软件开发者被分配到不同的部门。他们可能被分配到一个主开发项目和最多两个次项目。你会如何设计\
  \ `Developer` 类来处理这些？\n\n8. 假设你正在为一所大学构建程序，你需要下表所示的类和属性。\n\n| 类 | 属性 |\n| :--- |\
  \ :--- |\n| `Student` | `Name`, `Address`, `StudentId`, `CurrentClasses`, `PastClasses`\
  \ |\n| `Instructor` | `Name`, `Address`, `EmployeeId`, `CurrentClasses`, `PastClasses`\
  \ |\n| `TeachingAssistant` | `Name`, `Address`, `StudentId`, `EmployeeId`, `CurrentClassesTaught`,\
  \ `PastClassesTaught` |\n| `ResearchAssistant` | `Name`, `Address`, `StudentId`,\
  \ `EmployeeId`, `Sponsor` |\n\n（`Sponsor` 属性是 `ResearchAssistant` 工作的 `Instructor`。）\n\
  \n如何实现这些类？绘制继承层次结构。（提示：如果有帮助，更改某些属性名称。）\n\n9. 构建一个程序，实现你在练习 8 中设计的层次结构。对于像 `CurrentClasses`\
  \ 等不明显数据类型的属性，使用 `string` 作为占位符。（如果你不确定如何构建类，请阅读下一章然后返回此练习。）让实现接口的类直接实现而不使用委托。\n\
  \n10. 修改你在练习 9 中构建的类，使其使用委托来实现 `IStudent` 接口。练习 9 和 10 使用的方法优缺点是什么？\n\n11. 在练习 10\
  \ 中，为什么不让 `Student` 类直接实现 `IStudent` 接口，然后让 `TeachingAssistant` 和 `ResearchAssistant`\
  \ 类将接口委托给 `Student` 对象？\n\n12. 在为练习 10 和 11 构建的模型中，假设你想从 `ResearchAssistant` 派生\
  \ `LabAssistant` 类。新类将如何处理 `IStudent` 接口？\n\n\n\n\n\n类和结构都是容器类型。它们将相关的数据值和方法分组到一个方便的程序包中，你可以作为一个整体对其进行操作。\n\
  \n例如，`Recipe`（食谱）类将包含有关食谱信息的字段或属性，如配料、温度、说明和份数。它还可能包括在英制和公制单位之间转换测量单位的方法、根据不同的份数缩放食谱的方法以及打印食谱的方法。\n\
  \n如果你创建一个 `Recipe` 类的实例并填充了特定食谱的数据，你就可以将该对象作为一个单元进行移动，而无需传递持有配料、温度、说明和份数的多个独立变量。该对象还包含了用于操作食谱的方法，因此你不需要编写一个包含转换测量单位、缩放食谱和打印方法的独立模块。类将所有这些内容保持在一起，因此它们易于查找。\n\
  \n本章将解释如何定义和实例化类与结构。它解释了类和结构之间的主要区别，并就**不同情况下应该使用哪一个提供了一些建议。\n\n类和结构提供的功能几乎完全相同。例如，两者都可以拥有属性、方法和事件。接下来的章节从描述类开始。在你阅读关于类的内容时，请注意大多数这些功能也适用于结构。本章后面的章节将解释它们之间的差异。\n\
  \n## Classes\n\n类封装了数据和相关的行为。之前描述的 `Recipe` 类就是一个例子。它包含了关于食谱的信息以及用于操作其数据的方法。\n\n\
  这里是是声明类的语法。\n\n```\n«attributes» «accessibility» «abstract|sealed|static» «partial»\n\
  \    class name «inheritance»\n{\n    statements\n}\n```\n\n所有类声明唯一要求的是 `class`\
  \ 子句（包括类名）。其他所有内容均为可选。下面的代码描述了一个有效的（尽管并不十分有趣的）类。\n\n```\nclass Person\n{\n}\n```\n\
  \n接下来的章节将详细描述通用声明的各个部分。\n\n### attributes\n\n可选的 `attributes` 部分是应用于该类的属性列表。属性进一步细化了类的定义，为编译器和运行时系统提供更多信息。\n\
  \n属性具有很强的特殊性，用于解决执行特定编程任务时出现的问题。例如，如果你需要将类的实例从一个应用程序复制到另一个应用程序，可以为类标记 `Serializable`\
  \ 属性。这并不是你对每个类都需要做的事情。实际上，某些属性非常特殊，你可能永远不会使用它们。\n\n由于属性非常特殊，在这里不再对其进行详细描述。（尽管第 25\
  \ 章，“序列化”中会有更多关于序列化的内容。）有关更多信息，请咨询互联网和在线帮助。\n\n有关属性的更多信息，请访问这些网页：\n\n* 属性 (C# 和\
  \ C#) ([msdn.microsoft.com/library/z0w1kczw.aspx](http://msdn.microsoft.com/library/z0w1kczw.aspx))\n\
  * 属性教程 ([msdn.microsoft.com/library/aa288454.aspx](http://msdn.microsoft.com/library/aa288454.aspx))\n\
  \n要查看可使用的 578 个属性列表，请访问 Microsoft 的“属性类”网页 [msdn.microsoft.com/system.attribute.aspx](http://msdn.microsoft.com/system.attribute.aspx)\
  \ 并查看底部的“继承层次结构”部分。\n\n### accessibility\n\n如果类直接声明在命名空间空间内，则其 `accessibility` 子句必须是\
  \ `public` 或 `internal`。你也可以省略 `accessibility`，在这种情况下默认是 `internal`。\n\n如果类声明在结构内部，则其\
  \ `accessibility` 子句可以是 `public`、`private` 或 `internal`。如果类声明在类内部，该子句还可以取 `protected`\
  \ 和 `protected internal` 的值。\n\n下表总结了这些值的含义以及允许的位置。\n\n| 关键字 | 允许位置 | 含义 |\n| :---\
  \ | :--- | :--- |\n| `public` | 命名空间 结构 类 | 类对类程序集内部或外部的所有代码可见。 |\n| `internal`\
  \ | 命名空间 结构 类 | 类仅对类程序集内部的代码可见。 |\n| `private` | 结构 类 | 类仅对包含它的命名空间、结构或类内部的代码可见。\
  \ |\n| `protected` | 结构 类 | 类仅对包含它的结构或类内部的代码，或派生自该类的类可见。 |\n| `protected internal`\
  \ | 结构 类 | 结合了 `protected` 和 `internal`。 |\n\n例如，下面的代码定义了一个 `Person` 类。\n\n```\n\
  namespace OrderProcessor\n{\n    public class Person\n    {\n        internal struct\
  \ Address\n        {\n            public string Street, City, State, Zip;\n    \
  \    }\n\n        public string FirstName, LastName;\n        internal Address PostalAddress;\n\
  \    }\n}\n```\n\n`Person` 类在命名空间级别定义。它被声明为 `public`，因此所有代码都可以看到它的定义。\n\n`Person`\
  \ 类定义了 `Address` 结构。它被声明为 `internal`，因此该结构对程序集内部的代码可见。如果你在另一个程序集的代码中使用 `Person`\
  \ 类，该代码将看不到 `Address` 结构的定义。\n\n在定义 `Address` 类之后，`Person` 类定义了 `FirstName`、`LastName`\
  \ 和 `PostalAddress` 字段。`PostalAddress` 字段声明为 `internal`，因此对程序集外部的代码可见。\n\n### abstract\
  \ | sealed | static\n\n如果类的声明包含 `abstract` 关键字，则你无法实例化。要使用该类的功能，你必须从它派生一个新类。\n\n\
  如果类的声明包含 `sealed` 关键字，则你不能从它派生其他类。\n\n如果类的声明包含 `static` 关键字，则你不能从它派生其他类，也不能创建实例。你通过类名而不是实例来调用静态类的成员。注意，静态类的所有成员也必须被声明为\
  \ `static`。\n\n例如，考虑以下 `LogTools` 类。\n\n```\npublic static class LogTools\n{\n \
  \   public static void RecordMessage(string message)\n    {\n        Console.WriteLine(message);\n\
  \    }\n}\n```\n\n下面的代码显示了程序如何调用 `RecordMessage` 方法。\n\n```\nLogTools.RecordMessage(\"\
  Started \" + DateTime.Now.ToString());\n```\n\n注意代码是如何使用类名调用方法的。\n\n### partial\n\
  \n`partial` 关键字告诉 C# 当前定义只定义了类的一部分。下面的代码显示了 `Person` 类拆分为两个部分。\n\n```\npartial class\
  \ Person\n{\n    public string FirstName, LastName;\n}\n\npartial class Person\n\
  {\n    public string Street, City, State, Zip;\n}\n```\n\n你可以将一个类拆分为任意数量的部分。（如果你确实将类拆分为多个部分，所有部分都必须包含\
  \ `partial` 关键字。）在编译时，C# 会找到这些部分并将它们合并以定义该类。\n\n通常情况下，你不会在一个模块内部拆分类。实际上，除非有必要，否则将类拆分为多个部分不是一个好主意。将类所有的代码保持在一个部分中更容易查找。\n\
  \n\n\n\n\n将所有部分组合在一起更容易找到这些部分，但在某些情况下，拆分类（class）是有意义的。这些情况包括：\n\n*   将自动生成的代码与开发者编写的代码分开\n\
  *   拆分一个大类，以便多个开发者可以同时对其进行工作\n*   将类拆分为若干部分，每个部分都关注该类行为的某个方面\n*   将不同接口的实现放在不同的文件中\n\
  \n类的所有部分必须具有相同的访问权限和父类。你只需要在其中一个部分中声明这些内容，但如果你声明了多次，那么它们的内容必须保持一致。例如，你不能让 `HonorStudent`\
  \ 类的一个部分继承自 `Student`，而让另一个部分继承自 `Person`。\n\n你可以让类的不同部分实现不同的接口。例如，以下代码是合。\n\n```java\n\
  public partial class Student : Person, Interface1\n{\n    ...\n}\n\npartial class\
  \ Student : Interface2\n{\n    ...\n}\n```\n\n## 继承\n\n如果包含了继承，类的 `inheritance`\
  \ 子句可以包含一个父类、一个或多个接口，或者同时包含父类和接口。如果声明中包含父类和接口，则父类必须放在第一。\n\n例如，以下代码定义了一个 `Student`\
  \ 类，它继承自 `Person` 类并实现了 `IComparable` 和 `IFormattable` 接口。\n\n```java\nclass Student\
  \ : Person, IComparable, IFormattable\n{\n    ...\n}\n```\n\n类会自动继承其父类的属性、方法和事件，但负责为其接口提供实现。（有关实现接口的更多信息，请参见第\
  \ 6 章中的“实现接口”部分。）\n\n回第 11 章“OOP 概念”，C# 允许类最多继承一个父类并实现任意数量的接口。更多信息请参见第 11 章中的侧边栏“多重继承”。\n\
  \n## 结构\n\n在许多方面，结构（structures）与类（classes）相似。它们允许将属性、方法、事件、字段和其他成员组合在一个包中，你可以作为一个整体对其进行操作。\n\
  \n结构和类之间最明显的区别之一是结构不支持继承。你不能从一个结构派生另一个结构。（你也不能从类派生一个结构，反之亦然。）\n\n结构可以像类一样实现接口。\n\
  \n结构不支持继承这一事实体现在以下声明语法中。\n\n```text\n«attributes» «accessibility» «partial» struct\
  \ name «interfaces»\n{\n    statements\n}\n```\n\n结构的 `attributes` 和 `accessibility`\
  \ 子句以及 `partial` 关键字的工作方式与类相同。`interfaces` 部分与类的 `inheritance` 部分相似，不同之处在于只支持接口而不支持继承。详情请参见之前讨论这些类声明组成部分的章节。\n\
  \n结构和类之间还有另一个巨大差异：结构是值类型（value types），而类是引用类型（reference types）。这是一个重要但令人困惑的问题，因此后续章节将花费大量时间来解释这种差异的含义。\n\
  \n### 值类型与引用类型\n\n结构和类之间最大的区别在于它们如何为其数据分配内存。类是引用类型。这意味着类的实例实际上是内存中其他部分对象存储的引用。\n\
  \n相比之下，结构是值类型。结构的实例包含结构内部的数据，而不是简单地指向它。图 12-1 说明了这种区别。\n\n接下来的章节描述了值类型和引用类型分配内存方式的一些更重要的后果。\n\
  \n![c12f001.eps](img/c12f001.png)\n\n图 12-1: 结构持有其数据，而类持有对其数据的引用。\n\n### 内存需求\n\n\
  当仅考虑单个对象时，类和结构所需的内存差异很小。在图 12-1 中，类只需要分配额外的内存位置来存放引用。（引用在 32 位系统上占用 4 字节，在 64 位系统上占用\
  \ 8 字节。）\n\n然而，这种差异在数组会被累积。结构数组只包含结构中的数据。对象数组除了对象使用的内存外，还需要引用。如果数组包含 1,000 个项目，那么它将额外多使用\
  \ 4,000 字节内存（假设为 32 位系统）。\n\n然而，当首次分配数组时，其条目最初设置为 `null`，因此它们不引用任何对象。此时，数组仅使用引用所需的内存。图\
  \ 12-2 将结构数组与空对象数组进行了比较。\n\n![c12f002.eps](img/c12f002.png)\n\n图 12-2: 结构数组在初始化之前就使用大量内存。对象数组在其条目引用对象之前使用极少内存。\n\
  \n例如，假设一个结构或对象需要 1 KB 内存。包含 1,000 个结构的数组占用 1 MB。当首次创建对象数组时，它会因其 `null` 引用占用 4 KB。当数组填满时，它占用\
  \ 1 MB 的数据空间加上 4 KB 的引用空间。\n\n### 堆和栈性能\n\nC# 程序从两个内存池（称为栈（stack）和堆（heap））中分配变量。值类型（如\
  \ `int` 和 `double`）的内存来自栈。引用类型的内存来自堆。\n\n任意数量的引用可以指向堆中的同一块内存。这使得垃圾回收和其他堆管理问题变得复杂，因此处理引用类型可能比处理值类型稍慢。\n\
  \n请注意，数组本身是派生自 `Array` 类的引用类型。这意味着即使数组包含的值来自栈，所有数组也是从堆中分配的。\n\n### 对象赋值\n\n结构和对象之间最重要的功能差异之一在于对象赋值。\n\
  \n当你将一个值变量赋值给另一个值变量时，程序将一个变量中的数据复制到另一个中。如果你更改了一个变量中的数据，另一个变量保持不变，因为它是存储在自己内存中的副本。\n\
  \n图 12-3 显示了这种情况。初始，变量 `A` 持有值 `Sherlock` 和 `Holmes`。变量 `B` 持空值。当你执行语句 `B = A` 时，程序将变量\
  \ `A` 中存储的值复制到变量 `B` 中。\n\n![c12f003.eps](img/c12f003.png)\n\n图 12-3: 当你将一个值类型变量赋值给另一个时，程序会复制数据。\n\
  \n相比此的是，当你将一个引用变量赋值给另一个引用变量时，程序使两个变量都指向同一块内存。如果你更改了一个引用中的数据，更改将反映在另一个中，因为它们都指向同一个对象。\n\
  \n\n\n\n\n图 12-4 显示了这种情况情况。最初，变量 `A` 持有 `Sherlock` 和 `Holmes`。变量 `B` 为 `null`。当你执行语句\
  \ `B = A` 时，程序使变量 `B` 指向由变量 `A` 指向的同一个对象。\n\n![c12f004.eps](img/c12f004.png)\n\n\
  图 12-4： 当你将一个引用类型变量赋值给另一个变量时，程序使它们都指向同一个对象。\n\n### 参数传递\n\n在考虑参数传递方法时，值类型和引用类型变量之间的区别可能会特别令人困惑。例如，假设\
  \ `Employee` 是一个类，并考虑以下方法声明。\n\n```c\npublic void SelectEmployee(Employee employee)\n\
  {\n    ...\n}\n```\n\n参数 `employee` 是按值传递的，因此它是调用代码中使用的参数的*拷贝*。（在这里，*参数*指的是方法内部的值，而*参数*指的是调用代码中传入方法的值。）参数的类型为\
  \ `Employee`，因此参数和参数都是引用类型。这意味着参数 `employee` 包含了指向实际 `Employee` 对象引用的拷贝。图 12-5 从概念上展示了实参和参数在内存中的排列方式。\n\
  \n![c12f005.eps](img/c12f005.png)\n\n图 12-5： 当你按值传递引用类型时，参数包含引用的拷贝。\n\n在这个示例中，参数与实参指向同一个对象。如果你使用参数来更改\
  \ `Employee` 对象的属性（例如，如果你执行语句 `employee.FirstName = \"Linda\"`），调用代码会看到该变化，因为实参指向同一个对象。\n\
  \n如果你更改参数使其指向一个新的 `Employee` 对象，参数和实参将指向两个独立的对象。调用代码将看不到该变化。\n\n现在考虑 `SelectEmployee`\
  \ 方法的以下修改版本。\n\n```csharp\npublic void SelectEmployee(ref Employee employee)\n{\n\
  \    ...\n}\n```\n\n在这里，`ref` 关键字意味着实参按引用传递到方法。（`out` 关键字也会按引用传递实参）。现在，`employee`\
  \ 参数是实参的引用，而实参是指向 `Employee` 对象的引用。图 12-6 从概念上展示了这种情况。\n\n![c12f006.eps](img/c12f006.png)\n\
  \n图 12-6： 当你按引用传递引用类型时，参数是该对象引用的引用。\n\n现在，参数是实参的引用，而不是 `Employee` 引用。如果你使用参数来更改\
  \ `Employee` 对象的属性（例如，如果你执行语句 `employee.FirstName = \"Linda\"`），调用代码会像以前一样看到该变化。\n\
  \n如果你更改参数使其指向一个新的 `Employee` 对象，你实际上是在更改实参。这意味着调用代码会看到该变化。\n\n由于结构体是值类型，当你按引用或按值将它们传入方法时，它们的行为与对象不同。例如，假设\
  \ `Address` 是一个结构，并考虑以下代码。\n\n```csharp\npublic void PrintAddress(Address address)\n\
  {\n    ...\n}\n```\n\n参数 `address` 是按值传递的，因此它是调用代码中参数的*拷贝*。因为结构体是值类型，结构中的所有数据都被拷贝到参数中。图\
  \ 12-7 从概念上展示了实参和参数在内存中的排列方式。\n\n![c12f007.eps](img/c12f007.png)\n\n图 12-7： 当你按值传递结构体时，参数包含结构及其所有数据的拷贝。\n\
  \n参数持有所有参数数据的一个完全独立的拷贝。如果你更改了参数的数据（例如，如果你执行语句 `address.Street = \"1337 Leet St\"\
  `），实参不受影响，所以调用代码看不到该变化。如果你将参数赋值为一个新的 `Address` 结构，实参仍然不受影响，因此调用代码也看不到该变化。\n\n基本上，你对参数所做的任何操作都不会影响调用代码。这与你将对象传入方法时得到的行为不同。在这种情况下，对对象属性的变化对调用代码是可见的。\n\
  \n现在考虑 `PrintAddress` 方法的以下修改版本。\n\n```csharp\npublic void PrintAddress(ref Address\
  \ address)\n{\n    ...\n}\n```\n\n在这里，`ref` 关键字意味着实参按引用传递到方法。现在，`address` 参数是实参的引用。图\
  \ 12-6 从概念上展示了这种情况。\n\n\n\n\n\n| 数组 (`Employee[]`) | 引用 |\n| --- | 对数组条目属性的修改在调用代码中是可见。将数组中的某个条目设置为新值会影响调用代码中的数组值。将参数指向新数组或\
  \ `null` 会更改调用代码中的数组。 |\n\n按值或按引用传递对象和结构也会影响性能。当你按值传递对象时，程序仅向方法传递该引用的副本。当你按值传递结构体时，程序必须复制结构体的所有数据。如果结构体很大，将花费更长的时间。\
  \ |\n\n### 装箱与拆箱箱（Boxing and Unboxing）\n\nC# 允许程序将任何变量视为对象。例如，考虑以下方法。\n\n```csharp\n\
  public void ShowStringValue(object obj)\n{\n    Console.WriteLine(obj.ToString());\n\
  }\n```\n\n此方法可以接受任何类型的对象作为参数。\n\n现在，假设你使用语句 `ShowStringValue(13)` 调用了此方法。数字 `13`\
  \ 是一个 `int`，而不是对象。为了让该方法能够工作，程序将值 `13` 包装在一个对象中并将该对象传递给方法。\n\n将 `int` 等值类型包装在对象中的过程被称为`装箱`（boxing）。随后，如果程序需要再次将\
  \ `int` 作为值类型使用，程序将对其进行`拆箱`（unboxing）。\n\n由于结构体是值类型，程序每当将其视为对象时，必须对其进行装箱和拆箱。\n\n\
  某些需要装箱并可能需要拆箱的操作包括将结构体赋值给对象变量、将结构体传递给接受对象作为参数的程序、或将结构体添加到持有对象的集合类中。注意，最后一种操作包括将结构体添加到控件或其他对象使用的集合中。例如，将结构体添加到\
  \ `ListBox` 控件的 `Items` 集合中需要装箱。\n\n由于数组是引用类型，将数组视为对象不需要装箱。\n\n装箱和拆箱会给程序增加一些开销。如果程序只需要对少数项目进行装箱和拆箱，差异很小。如果程序必须对大量项目进行装箱和拆箱，额外的时间就会累积起来。\n\
  \n### 构造函数\n\n第 4 章“数据类型、变量和常量”简要提到了构造函数。构造函数是一种特殊方法，它没有名称，并返回包含它的类或结构体的类型。（或者，你可以将构造函数认为具有与其类相同的名称且不返回任何类型，甚至不返回\
  \ `void`。）\n\n你可以通过给不同版本提供不同的签名来重载构造函数，就像你可以重载任何其他方法一样。例如，以下代码显示了一个具有两个构造函数的简单 `Person`\
  \ 类。\n\n```csharp\npublic class Person\n{\n    string FirstName { get; set; }\n\
  \    string LastName { get; set; }\npublic Person()\n    {\n        FirstName =\
  \ \"unknown\";\n        LastName = \"unknown\";\n    }\npublic Person(string firstName,\
  \ string lastName)\n    {\n        FirstName = firstName;\n        LastName = lastName;\n\
  \    }\n}\n```\n\n每当程序创建类或结构体的新实例时，程序都会调用构造函数。程序使用 `new` 语句中的参数来确定使用哪种构造函数。例如，以下代码创建了一个新的\
  \ `Person` 对象。由于 `new` 语句使用了两个字符串参数，程序使用了前一个代码中的第二个构造函数。\n\n```csharp\nPerson person\
  \ = new Person(\"Rufus\", \"Firefly\");\n```\n\n如果你没有为类或结构体提供任何构造函数，C# 会自动提供一个默认的无参数构造函数。如果你创建了任何自己的构造函数，C#\
  \ 就不会创建默认构造函数。\n\n你可以利用这一事实来确保程序使用所需的值初始化新对象或结构体。例如，如果之前的 `Person` 类不包含无参数构造函数，那么程序将被迫使用另一个构造函数，该构造函数接受姓和名作为参数。程序在不提供姓名值的情况下无法创建\
  \ `Person` 对象。（尽管它仍然可以通过将这些值设置为空字符串或 `null` 来搞乱事情。你可以修改构造函数来检查这一点。）\n\n你可以为类定义自己的无参数构造函数。结构体不能拥有显式定义的无参数构造函数。\n\
  \n与其他方法一样，你可以给构造函数提供可选参数。例如，以下构造函数可以接受零、一个或两个参数。\n\n```csharp\npublic Person(string\
  \ firstName = \"unknown\", string lastName = \"unknown\")\n{\n    FirstName = firstName;\n\
  \    LastName = lastName;\n}\n```\n\n构造函数还有两个普通方法没有的额外选项。首先，构造函数可以使用 `this` 关键字自动调用另一个构造函数。例如，考虑以下代码。\n\
  \n```csharp\npublic Person(string firstName, string lastName)\n{\n    FirstName\
  \ = firstName;\n    LastName = lastName;\n}\n\npublic Person()\n: this(\"(Unknown)\"\
  , \"(Unknown)\")\n{\n}\n```\n\n此代码定义了一个接受姓名作为参数的构造函数。该构造函数将其输入参数保存在对象的 `FirstName`\
  \ 和 `LastName` 属性中。\n\n代码接着定义了另一个构造函数。`this` 子句调用第一个构造函数，并将 `(Unknown)` 和 `(Unknown)`\
  \ 作为参数传递给它。\n\n在其他方法不可用的第二个选项中，构造函数使用 `base` 关键字调用父类中的构造函数。例如，考虑以下派自 `Person` 类的\
  \ `Employee` 类。\n\n```csharp\npublic class Employee : Person\n{\n    public int\
  \ EmployeeId { get; set; }\n\n    public Employee(string firstName, string lastName,\
  \ int employeeId)\n        : base(firstName, lastName)\n    {\n        EmployeeId\
  \ = employeeId;\n    }\n\n    public Employee(string firstName, string lastName)\n\
  \        : this(firstName, lastName, 0)\n    {\n    }\n}\n```\n\n第一个构造函数接受名、姓和员工\
  \ ID 作为参数。`base` 子句调用 `Person` 类构造函数，将姓名作为参数传递给它。构造函数随后保存员工 ID。\n\n`Employee` 类的第二个构造函数使用\
  \ `this` 调用第一个构造函数，并传递姓名和 0。\n\n### 结构体实例化细节\n\n结构体处理实例化的方式与类略有不同。当你声明引用变量时，C# 不会自动为变量指向的对象分配内存。相比之下，当你声明一个结构体之类的值类型时，C#\
  \ 会自动为变量的数据分配空间。这意味着你不需要使用 `new` 关键字来实例化结构体。\n\n例如，以下代码创建了一个 `Address` 结构体并初始化它的\
  \ `Street` 属性。\n\n```csharp\nAddress address;\naddress.Street = \"711 Maple Street\"\
  ;\n```\n\n虽然你不需要使用 `new` 关键字来实例化结构体，但如果你需要，可以使用。这是重新初始化结构体并将其数据设置为默认值的有用方法。例如，考虑以下代码。\n\
  \n```csharp\n// 创建一个 Address。\nAddress address;\naddress.Street = \"711 Maple Street\"\
  ;\n...\n// 重新初始化 Address。\naddress = new Address();\naddress.Street = \"742 Evergreen\
  \ Terrace\";\n...\n```\n\n此代码创建了一个 `Address` 结构体并设置它的 `Street` 属性。它使用结构体了一段时间，然后使用\
  \ `new` 重新初始化结构体。然后它将 `Street` 属性设置为新值并继续使用该结构体。\n\n如果你想使用初始化语法来初始化结构体，也可以 `new`\
  \ 关键字。例如，以下代码使用 `new` 创建一个 `Address` 结构体并设置它的 `Street` 属性。\n\n```csharp\nAddress\
  \ address = new Address() { Street = \"1313 Mockingbird Lane\" };\n```\n\n\n\n\n\
  \n## 垃圾回收\n\n当程序启动时，系统会为程序分配一块内存，称为`托管堆（managed heap）`。当为引用类型（类对象）分配数据时，`C#` 会使用此堆中的内存。\n\
  \n假设你的程序创建了一个 `Person` 对象，稍后将该对象的唯一引用设置为 `null`。程序将无法再次访问该对象，因此其堆中的内存就“丢失”了。\n\n\
  垃圾回收器（`GC`）负责回收这些丢失的内存。在之后的后的某个时间点，垃圾回收器的优化引擎可能会认为堆中丢失的内存过多，因此它决定进行清理。\n\n垃圾回收的具体工作原理相当复杂，而且对于大多数应用程序来说并不重要，因此本节仅提供概述。欲了解更精确的细节，请参阅\
  \ [msdn.microsoft.com/library/0xy59wtx.aspx](http://msdn.microsoft.com/library/0xy59wtx.aspx)\
  \ 上的“垃圾回收”网页。\n\n基本上，当垃圾回收器运行时，它会将所有堆内存标记为“未未使用”。然后，它会检查程序所有的引用变量、作为对象引用的参数、CPU\
  \ 寄存器以及可能指向堆对象的其他项。对于这些每一个引用，垃圾回收器会将引用所指向的对象标记为“正在使用”。\n\n接下来，垃圾回收器会对仍在使用的堆内存进行压缩，并更新程序引用，以便它们找到它所移动的任何项。然后，垃圾回收器会更新堆本身，以便程序从未使用的部分分配内存。\n\
  \n当销毁一个对象时，垃圾回收器会释放对象的内存及其包含的任何托管资源。然而，它可能不会释放未托管资源。你可以通过析构函数和 `Dispose` 方法来确定对象何时以及如何释放其托管和未托管资源。\n\
  \n### 析构函数\n\n当销毁一个对象时，垃圾回收器会自动释放该对象使用的任何托管资源。例如，假设一个未使用的对象包含对已打开的文件流的引用。当垃圾回收器运行时，它注意到程序无法访问该文件流，因此它会销毁该文件流以及引用该流的对象。\n\
  \n然而，假设该对象使用了 `C#` 理解的对象范围外的未托管资源。例如，假设该对象持有一个整数，代表文件句柄、网络连接或通往硬件设备的通道，而 `C#` 并不理解这些内容。在这种情况下，垃圾回收器不知道如何释放该资源。\n\
  \n在这种情况下，你可以为类提供一个析构函数，这是一种在对象销毁时运行的方法。在永久销毁一个对象之前，垃圾回收器会调用该对象的析构函数，以便析构函数清理未托管资源。\n\
  \n请注意，无法保证垃圾回收器具体何时调用此方法，也无法保证不同对象的析构函数的调用顺序。即使一个对象包含对另一个对象的引用，或者一个对象比另一个早得多被释放，两个对象的析构函数的调用顺序也可能是任意的。这意味着析构函数不能使用任何指向析构函数之外创建的对象的引用，因为这些对象可能不再存在。\n\
  \n要创建析构函数，请创建一个与类同名的方法，并在其前面加上 `~` 字符。例如，以下代码显示了 `Person` 类的析构函数。\n\n```c\n~Person()\n\
  {\n    // 在处释放未托管资源。\n    ...\n}\n```\n\n当程序正常结束时，它会调用所有创建对象的析构函数。如果程序崩溃或你异常停止了它（例如使用调试\
  \ 菜单中的“停止调试”命令），程序将不会运行析构函数。有时这可能会导致未托管资源被锁定，否则对操作系统不可用。例如，文件编辑程序在崩溃时可能会导致已打开的文件处于锁定状态。\n\
  \n### Dispose\n\n由于 `C#` 不跟踪对象在任何时刻是否是可达的，因此在程序结束或垃圾回收器回收它之前，它不知道何时可以永久销毁该对象。这意味着对象的内存和资源可能会很一段时间无法使用。\n\
  \n内存不可用本身并不是一个大问题。如果程序的堆空间耗尽，垃圾回收器就会运行回收未使用的内存。然而，如果一个对象包含对资源（托管或未托管）的引用，在对象被销毁之前，该资源不会被释放，这有时会产生严重的后果。你通常不希望将文件、网络连接、扫描仪或其他稀缺系统资源的控制权交给垃圾回收器的随性意欲。\n\
  \n按照惯例，`Dispose` 方法释放对象的资源。在程序释放包含重要资源的对象之前，可以调用该对象的 `Dispose` 方法来显式释放资源。\n\n为了处理程序未调用\
  \ `Dispose` 的情况，类还应该在析构函数中释放其持有的任何未托管资源。因为无论程序是否调用了 `Dispose`，析构函数都会执行，所以类必须能够无害地同时执行\
  \ `Dispose` 方法和析构函数。例如，如果程序关闭了某些异常硬件，它可能不应该关闭两次硬件。\n\n为了使 `Dispose` 方法更具一致性，`C#`\
  \ 定义了 `IDisposable` 接口，该接口声明了 `Dispose` 方法。如果一个类实现了此接口，那么 `using` 语句将自动调用对象的 `Dispose`\
  \ 方法，因此你不需要显式执行。\n\n最后，如果 `Dispose` 方法已经释放了对象的所有资源，那么当对象最终被销毁时，无需调用析构函数。你可以通过让 `Dispose`\
  \ 方法调用 `GC.SuppressFinalize` 来告诉垃圾回收器跳过该对象，从而提高销毁效率。\n\n\n\n\n\n`Dispose` 方法用于释放托管和未托管资源。然后它会调用\
  \ `GC.SuppressFinalize` 以防止析构函数运行并再次释放未托管资源。\n\n`GC.SuppressFinalize` 的参数是不应调用其析构函数的对象。代码将\
  \ `this` 传递给该方法，这样就不会调用当前对象的析构函数。\n\n在此类中，要么调用 `Dispose` 方法，要么调用析构函数，但两者不会都同时被调用。\n\
  \n## 事件\n\n第 4 章 解释了如何创建属性，第 6 章解释了如何创建方法。在某种意义上，属性和方法允许类外的程序代码与对象进行通信。属性允许程序查看和修改对象的数据。方法允许程序让对象执行某些操作。\n\
  \n事件则恰恰相反：当发生有趣的事情时，它们允许对象向程序传回信息。对象引发事件来通知主程序某种情况，以便主程序决定如何处理该情况。\n\n例如，最常见的事件是按钮和菜单的\
  \ `Click` 事件。当用户选择菜单项或点击按钮时，菜单项或按钮会引发一个 `Click` 事件。主程序捕获该事件并采取相应行动。\n\n接下来的章节描述了事件。它们解释了类如何声明事件，以及程序的其他部分如何捕获这些事件。\n\
  \n### 声明事件\n\n对象在需要通知程序情况变化时可以引发事件。类使用 `event` 关键字声明事件。下文显示了 `event` 语句的语法。\n\n\
  ```\n«attributes» «accessibility» «new|virtual|override|abstract|sealed» «static»\n\
  \    event delegate name;\n```\n\n以下列表描述了声明的各个部分。\n\n*   `attributes`—属性提供了有关事件的额外信息，供编译器、运行时系统和其他工具使用。\n\
  *   `accessibility`—这可以是 `public`、`private`、`protected`、`internal` 或 `protected\
  \ internal`，与类、属性和方法等项目的访问性相似。这些关键字具有以下含义：\n    *   `public`—事件可以被任何代码捕获。\n    *\
  \   `private`—事件只能被类内部的代码捕获。\n    *   `protected`—事件只能被类内部或派生类内部的代码捕获。\n    *  \
  \ `internal`—事件只能被类程序集内部的代码捕获。\n    *   `protected internal`—事件只能被类内部或类程序集内派生类内部的代码捕获。\n\
  *   `new`|`virtual`|`override`|`abstract`|`sealed`—这些与 第 6 章 中描述的方法使用的关键字相似。它们具有以下含义：\n\
  \    *   `new`—隐藏在祖先类中定义的同名事件。\n    *   `virtual`—如果你将事件标记为 `virtual`，稍后可以在派生类中通过重写来替换它。\n\
  \    *   `override`—如果祖先类定义了虚事件，你可以使用 `override` 关键字来重写它。\n    *   `abstract`—此关键字表示事件是抽象的，因此派生类必须重写该事件以提供其实现。与\
  \ `abstract` 方法一样，包含 `abstract` 事件的类必须是 `abstract` 的且不能实例化。\n    *   `sealed`—此关键字表示事件不再是\
  \ `virtual` 的，因此它在派生类中不能被重写。\n*   `static`—这表示由类本身引发事件，而不是由类的实例。\n*   `delegate`—这是一种委托类型，定义了传递给事件处理程序的参数。\n\
  *   `name`—这是你想要给事件命名的名称。\n\n由于在方法中使用过类似的关键字，这些内容大部分应该让你觉得很熟悉。事实上，事件看起来非常像方法。定义事件的类“调用”它的方式就像你调用方法一样，而捕获事件的事件处理器仅仅是一个方法。\n\
  \n然而，事件和方法之间存在一些主要区别。接下来的章节提供了关于事件的更多详细信息，并解释了为什么事件不仅仅是伪装的方法。这些章节还包含了一些示例，展示了如何声明、引发和捕获事件。\n\
  \n### 引发事件\n\n要引发事件，代码首先确定是否有其他代码段已注册以捕获该事件。它通过将事件与 `null` 进行比较来实现此。（这是一种相当奇怪的语法，但\
  \ C# 就是这么这么的。）\n\n如果事件处理器不是 `null`，代码就会“调用”它，并传递任何所需的参数。然后程序会顺序调用每个注册的事件处理器，并将这些参数传递给它们。\n\
  \n例如，假设 `Student` 类定义了一个 `GradeChanged` 事件。那么 `Student` 类内部的以下代码片段将引发事件，并将当前 `Student`\
  \ 对象作为参数传递。。\n\n```\nif (GradeChanged != null) GradeChanged(this);\n```\n\n### 捕获事件\n\
  \n要订阅事件，程序使用 `+=` 运算符将事件处理器“添加”到事件。\n\n例如，假设 `Person` 类定义了一个 `NameChanged` 事件。假设主程序创建了一个名为\
  \ `MyPerson` 的 `Person` 类实例。最后，假设主程序定义了一个名为 `MyPerson_NameChanged` 的事件处理器来处理该事件。那么主程序可以使用以下代码订阅该事件。\n\
  \n```\nMyPerson.NameChanged += MyPerson_NameChanged;\n```\n\n如果事件处理器不是 `null`，代码就会“调用”它，并传递任何所需的参数。然后程序会顺序调用每个注册的事件处理器，并将这些参数传递给它们。（等等，原文此处有重复/逻辑偏移，保留核心内容。）\n\
  \n取消订阅事件，使用 `-=` 运算符。以下代码显示了程序如何取消对 `Person` 类的 `NameChanged` 事件的订阅。\n\n```\nMyPerson.NameChanged\
  \ -= MyPerson_NameChanged;\n```\n\n（此示例将在下一节中进一步描述。）\n\n### 使用事件类型\n\n事件声明中的 `delegate`\
  \ 部分是一个委托类型，定义了处理器在捕获事件时所采取的参数。你可以创建自己的委托类型，使用预定义的 `Action` 委托类型，或使用特殊的 `EventHandler`\
  \ 委托类型。\n\n`EventHandler` 类型定义了一个给处理器两个参数的事件。第一个是代表引发事件对象的 `object`。第二个参数是另一个提供事件信息的项目。微软建议将第二个参数命名为以事件名称开头并以\
  \ `EventArgs` 结尾的对象。\n\n例如，PersonEvent 示例程序（可从本书的网站下载）定义了一个具有 `Name` 属性的 `Person`\
  \ 类。当 `Name` 属性发生变化时，`Person` 对象会引发 `NameChanged` 事件。该事件处理器的第二个参数是一个 `NameChangedEventArgs`\
  \ 对象。\n\n图 12-10 显示了 PersonEvent 程序的运行情况。在文本框中输入新名称并点击 Set Name。这将显示一个消息框，要求你确认更改名称。如果你点击\
  \ Yes，程序将更新名称并在底部的文本框中显示新名称。\n\n![c12f010.tif](img/c12f010.png)\n\n**图 12-10：**\
  \ PersonEvent 示例程序演示了事件处理。\n\n以下代码显示了示例中的 `NameChangedEventArgs` 类。\n\n```cs\npublic\
  \ class NameChangedEventArgs\n{\n    public string OldName, NewName;\n    public\
  \ bool Cancel;\n\n    public NameChangedEventArgs(string oldName, string newName)\n\
  \    {\n        OldName = oldName;\n        NewName = newName;\n        Cancel =\
  \ false;\n    }\n}\n```\n\n该类三个字段。`OldName` 和 `NewName` 字段告诉主程序 `Person` 对象的名称从什么变为什么。`Cancel`\
  \ 属性允许主程序取消名称更改。\n\n\n\n\n\n`NameChangedEventArgs` 类还定义了一个构造函数，`Person` 类可以使用该构造函数来初始化旧新两个名称值。\n\
  \n下面的代码显示了 `Person` 类。\n\n```sharp\nclass Person\n{\n    // 当人的姓名更改时触发事件。\n    public\
  \ event EventHandler<NameChangedEventArgs> NameChanged;\n    // Name 属性。\n    private\
  \ string _Name = \"\";\n    public string Name\n    {\n        get { return _Name;\
  \ }\n        set\n        {\n            // 准备参数对象。\n            NameChangedEventArgs\
  \ args =\n                new NameChangedEventArgs(_Name, value);\n\n          \
  \  // 如果有任何代码注册了接收事件，则引发事件。\n            if (NameChanged != null) NameChanged(this,\
  \ args);\n\n            // 如果代码没有取消更改，则执行更改。\n            if (!args.Cancel) _Name\
  \ = value;\n        }\n    }\n}\n```\n\n该类首先声明了它的 `NameChanged` 事件。声明中的 `EventHandler<NameChangedEventArgs>`\
  \ 部分表示此事件将向其事件处理器传递引发事件的对象以及一个 `NameChangedEventArgs` 对象。\n\n接下来，该类定义了一个 `Name`\
  \ 属性。`set` 访问器首先开始创建一个 `NameChangedEventArgs` 对象并初始化其名称值。\n\n要引发事件，代码必须首先确定是否有其他代码段注册了捕获该事件。它通过将事件与\
  \ `null` 进行比较来实现此点。\n\n如果事件处理器不是 `null`，代码就会“调用”它，并向其传递引发事件对象的引用（`this`）以及 `NameChangedEventArgs`\
  \ 对象。这使得程序为每个注册了捕获该事件的程序元素引发事件。同一个 `NameChangedEventArgs` 对象会按轮流传递给每个已注册的事件处理器。\n\
  \n接下来，访问器检查 `NameChangedEventArgs` 对象的 `Cancel` 字段，以查看事件处理器是否将该值设置为 `true`。如果 `Cancel`\
  \ 为 `false`，访问器将属性的备用字段 `_Name` 设置为新的名称值。程序的主表单使用以下代码声明并初始化一个 `Person` 对象。\n\n```csharp\n\
  // 一个 Person 实例。\nprivate Person MyPerson = new Person();\n```\n\n下面的代码显示了程序的 `NameChanged`\
  \ 事件处理器。\n\n```csharp\n// 事件处理器。\nprivate void MyPerson_NameChanged(object sender,\
  \ NameChangedEventArgs e)\n{\n    e.Cancel =\n        MessageBox.Show(\n       \
  \     \"要将名称从 \" + e.OldName + \" 更改为 \" + e.NewName + \"吗?\",\n            \"更改名称?\"\
  ,\n            MessageBoxButtons.YesNo)\n                == System.Windows.Forms.DialogResult.No;\n\
  }\n```\n\n事件处理器接收两个参数。第一个名为 `sender` 的对象，引用引发事件的 `Person` 对象。第二个参数是 `Person` 对象在引发事件时创建的\
  \ `NameChangedEventArgs` 对象。\n\n事件处理器显示消息框，告诉用户 `NameChangedEventArgs` 对象的旧名称和新名称，并询问是否允许更改。它设置\
  \ `NameChangedEventArgs` 对象的 `Cancel` 值来指示用户点击的是“是”还是“否”。\n\n下面的代码显示了程序的 `Load`\
  \ 事件处理器。\n\n```csharp\nprivate void Form1_Load(object sender, EventArgs e)\n{\n\
  \    // 设置并显示初始名称。\n    MyPerson.Name = \"Ann\";\n    nameTextBox.Text = MyPerson.Name;\n\
  \n    // 注册事件处理器。\n    MyPerson.NameChanged += MyPerson_NameChanged;\n}\n```\n\n\
  此代码初始化了 `Person` 对象的 `Name` 属性并在 `nameTextBox` 中显示名称。在那个点，对象上没有注册任何事件处理器，因此不会引发事件。\n\
  \n代码随后注册了 `MyPerson_NameChanged` 方法来捕获 `NameChanged` 事件。\n\n程序的最后一部分是下面的 `Click`\
  \ 事件处理器，它在用户点击“设置名称”按钮时执行。\n\n```csharp\n// 更改人的姓名。\nprivate void setNameButton_Click(object\
  \ sender, EventArgs e)\n{\n    MyPerson.Name = newNameTextBox.Text;\n    nameTextBox.Text\
  \ = MyPerson.Name;\n}\n```\n\n当用户点击按钮时，此代码将 `Person` 对象的 `Name` 属性设置为在 `nameTextBox`\
  \ 中输入的值。\n\n下面的列表显示了点击按钮时发生的事件序列：\n\n*   主程序将 `Person` 对象的 `Name` 属性设置为新值。\n*  \
  \ `Person` 对象的 `set` 访问器引发 `NameChanged` 事件。\n*   主程序的 `MyPerson_NameChanged` 事件处理器捕获该事件并显示消息框请求您确认更改。\n\
  *   `Person` 对象的 `set` 访问器检查 `NameChangedEventArgs` 对象的 `Cancel` 值，以查看是否应该取消名称更改。如果\
  \ `Cancel` 为 `false`，访问器保存新的名称值。\n\n### 使用静态事件\n\n静态事件与非静态事件非常相似，但事件是由类本身提供的，而不是类的实例。\n\
  \n`StaticEvent` 示例程序可以在本书的网站下载，它定义了一个 `ReportManager` 类，该类提供了一个静态的 `ReportError`\
  \ 事件。\n\n主程序使用以下代码订阅该事件。注意它是如何使用类而不是实例来标识事件的。\n\n```csharp\nReportManager.ReportError\
  \ += MyReportManager_ReportError;\n```\n\n静态事件与非静态事件的一个重要区别在于对象的销毁方式。当一个对象注册第二个对象的事件时，第二个对象持有第一个对象的引用。例如，假设\
  \ `Form1` 类注册了 `Person` 对象的 `NameChanged` 事件。在这种情况下，`Person` 对象持有 `Form1` 对象的引用。\n\
  \n现在如果程序删除了 `Form1` 和 `Person` 对象的引用，垃圾回收器可以正常地回收它们。\n\n然而，假设 `NameChanged` 是由 `Person`\
  \ 类提供的静态事件。在这种情况下，`Person` 对象接收了 `Form1` 对象的引用。后来程序不再需要 `Form1` 对象，垃圾回收器无法回收它。这会导致内存泄漏。\n\
  \n可以通过释放 `Form1` 对象之前使用 `-=` 运算符取消注册事件处理器来避免这种情况。（如果不使用静态事件，也可以避免这种情况。）\n\n### 隐藏和覆盖事件\n\
  \n事件有点特殊，因为它们不像属性和方法那样被继承。派生类无法引发基类定义的事件。\n\n例如，假设 `BankAccount` 类定义了 `Overdrawn`\
  \ 事件，假设 `OverdraftAccount` 类派自 `BankAccount` 类。那么 `OverdraftAccount` 类中的代码无法引发 `Overdrawn`\
  \ 事件。\n\n`OverdraftAccount` 类可以使用 `new` 关键字来隐藏 `Overdrawn` 事件的新新版本。\n\n如果 `BankAccount`\
  \ 类使用 `virtual` 关键字声明事件，那么 `OverdraftAccount` 类就可以使用 `override` 关键字来覆盖该事件的新版本。\n\
  \n`new`、`virtual` 和 `override` 关键字的工作方式与方法非常相似。更多信息请参阅第 6 章中的“`new`”和“`virtual`\
  \ 和 `override`”章节](#c06.xhtml)。\n\n### 引发基类事件\n\n正如前面的节提到的，派生类无法引发其祖先类的事件。然而，有时你可能想这样做。派生类无法调用祖先类的事件，但它可以调用祖先类中的代码，而该代码可以引发事件。\n\
  \n解决方案是为祖类提供一个引发事件的方法。派生类就可以调用该方法。按照习惯，该方法通常在事件名称前加上 `On` 来命名。\n\n\n\n接上一个例子，你可能希望\
  \ `OverdraftAccount` 类能够触发 `BankAccount` 类定义的 `Overdrawn` 方法，而不是创建一个自己的新事件来隐藏或覆盖\
  \ `BankAccount` 版本的事件。它无法直接触发该事件，但你可以添加一个 `OnOverdrawn` 方法来触发它。\n\n例如，你可以创建如下 `OnOverdrawn`\
  \ 方法。\n\n```cs\nprotected void OnOverdrawn(decimal value)\n{\n    if (Overdrawn\
  \ != null) Overdrawn(this, value);\n}\n```\n\n现在，当需要触发 `Overdrawn` 事件时，`OverdraftAccount`\
  \ 类就会调用 `OnOverdrawn` 方法。\n\n### 实现自定义事件\n\n你可以使用类似下面的代码来创建一个自动实现属性（auto-implemented\
  \ property）。\n\n```cs\npublic string Name { get; set; }\n```\n\n在底层，Visual Studio\
  \ 会创建 `get` 和 `set` 访问器来支持该属性。\n\n同样，以下语句声明了一个简单事件。\n\n```cs\npublic event EventHandler<NameChangedEventArgs>\
  \ NameChanged;\n```\n\n这一次，Visual Studio 创建了事件访问器，用于从事件处理程序列表中添加和删除事件处理程序。这些访问器与自动实现属性提供的\
  \ `get` 和 `set` 访问器类似，只是名称变为 `add` 和 `remove`。\n\n如果你想添加自动实现属性提供之外的额外功能，可以显式实现属性。同样，如果你需要，也可以显式实现\
  \ `add` 和 `remove` 事件访问器。如果你采用这种方法，必须编写代码来调用任何已注册的事件处理程序。\n\n例如，考虑以下代码。\n\n```cs\n\
  // 表示公共事件私有事件。\nprivate EventHandler<VoteEventArgs> VoteEvent;\n\n// 事件。\npublic\
  \ event EventHandler<VoteEventArgs> Vote\n{\n    add\n    {\n        VoteEvent +=\
  \ value;\n    }\n    remove\n    {\n        VoteEvent -= value;\n    }\n}\n```\n\
  \n这段代码声明了一个名为 `VoteEvent` 的私有事件。然后它定义了 `Vote` 事件。该事件的 `add` 和 `remove` 访问器将其工作委托给该私有事件。\n\
  \n随后，该类可以使用类似下面的代码来触发事件。\n\n```cs\n// 创建事件参数对象。\nVoteEventArgs args = new VoteEventArgs(this.Description);\n\
  \n// 调用事件处理程序。\nif (VoteEvent != null) VoteEvent(this, args);\n```\n\n这段代码创建了一个\
  \ `VoteEventArgs` 对象来提供有关事件的信息。（不用担心细节。重要的是它创建了这个对象。）然后它触发了名为 `VoteEvent` 的私有事件。由于\
  \ `add` 和 `remove` 访问器只是将添加和删除请求传递给私有事件，该事件会调用任何已注册的事件处理程序。\n\n这个示例仅仅是将事件请求传递给私有事件，因此实际上并没有增加任何功能。它本质上与自动实现的公共\
  \ `Vote` 事件的作用相同。\n\n然而，你可以修改程序来执行其他操作。例如，自定义事件可以委托给该类中包含的对象。假设 `Car` 类有一个 `Crashed`\
  \ 事件，假设 `Driver` 类有一个表示司机对应汽车的 `Car` 属性。那么 `Driver` 类就可以创建自己的 `Crashed` 事件，并将其委托给\
  \ `Car` 对象的事件。\n\n### 静态方法\n\n静态方法没有静态变量那么直观。和静态变量一样，你通过类本身而不是类的实例来访问静态方法。例如，考虑以下\
  \ `Student` 类。\n\n```cs\npublic class Student\n{\n    public int StudentId { get;\
  \ set; }\n    public string FirstName { get; set; }\n    public string LastName\
  \ { get; set; }\n    ...\n\n    // 创建一个学生。\n    public static Student LookupStudent(int\
  \ id)\n    {\n        // 在数据库中查找学生 ID 并创建对象 theStudent。\n        ...\n\n       \
  \ return theStudent;\n    }\n}\n```\n\n该类以一些属性声明开始。然后定义了静态方法 `LookupStudent`。该方法接受学生的\
  \ ID 作为参数，在数据库中查找学生（该代码未显示），并返回一个代表该学生的 `Student` 对象。\n\n这种创建类新实例的方法被称为**工厂方法**（factory\
  \ method），因为它充当按按创建对象的工厂。\n\n以下代码展示了程序如何使用 `LookupStudent` 方法。\n\n```cs\n// 获取 ID。\n\
  int id = int.Parse(lookupIdTextBox.Text);\n\n// 获取学生。\nStudent student = Student.LookupStudent(id);\n\
  if (student == null)\n{\n    firstNameTextBox.Clear();\n    lastNameTextBox.Clear();\n\
  \    idTextBox.Clear();\n}\nelse\n{\n    firstNameTextBox.Text = student.FirstName;\n\
  \    lastNameTextBox.Text = student.LastName;\n    idTextBox.Text = student.StudentId.ToString();\n\
  }\n```\n\n这段代码从文本框获取一个 ID。它调用 `LookupStudent` 方法在数据库中查找学生，然后清除其结果文本框，或者显示学生的 ID\
  \ 和姓名属性。\n\n你可以使用构造函数代替工厂方法。在这个示例中，构造函数将接受学生的 ID 作为参数，在数据库中查找学生记录，并初始化 `Student`\
  \ 对象的属性。\n\n遗憾的是，如果学生不在数据库中，构造函数可能会抛出异常，但它不能返回 `null` 值。工厂方法可以在适当的情况下返回 `null`。\n\
  \n\n\n\n1. 绘制一个与图 12-9 类似的图，显示以下 `Customer` 类所使用的内存布局，假设 `Address` 和 `Order` 是结构体。\n\
  \n```c\npublic class Customer\n{\n    public Address MailingAddress, BillingAddress;\n\
  \    public Order[] Orders;\n}\n```\n\n（你不需要显示它是如何传递到方法中的。只需显示对象的布局即可。）\n\n2. 假设\
  \ `Address` 和 `Order` 是类而不是结构体，重复练习 1。\n\n3. 考虑练习 1 和 2 中使用的 `Customer` 类。如果你按值传递一个\
  \ `Customer` 对象到方法中，这两种结构（类）之间的差异有多大？按引用传递呢？如果 `Customer` 是结构体而不是类，这种差异会变大还是变小？\n\
  \n4. 下载 `PersonEvent` 示例程序。如果 `Person` 类 `Name` 属性的 `set` 访问器不检查 `NameChanged` 是否为\
  \ `null` 并简单地“调用”事件处理程序，会发生什么？\n\n5. 创建一个具有 `Balance` 属性的 `BankAccount` 类。如果 `Balance`\
  \ 被设置为负值，`set` 访问器应该抛出一个 `Overdrawn` 事件且不保存新值。编写一个程序来测试该类。如果程序尝试将余额减少到 $0.00 以下，则显示消息框。\n\
  \n6. 创建一个派生自你为练习 5 构建的 `BankAccount` 类的 `OverdraftAccount` 类。重写 `Overdrawn` 事件。还要重写\
  \ `Balance` 属性，使得只有在设置为小于 –$100.00 值时才触发事件。\n\n7. 修改你为练习 6 编写的程序，使 `OverdraftAccount`\
  \ 类引发 `BankAccount` 类的 `Overdrawn` 事件，而不是重写该事件。\n\n8. 修改你为练习 6 编写的程序，使 `OverdraftAccount`\
  \ 类隐藏 `Overdrawn` 事件。让主程序使用类似下面的代码创建其 `OverdraftAccount` 对象。\n\n```c\nprivate BankAccount\
  \ Account = new OverdraftAccount();\n```\n\n运行程序时会发生什么？它为什么要这样做？\n\n9. 编写一个使用“实现自定义事件”节节描述的自定义事件处理程序的程序。创建一个提供\
  \ `Vote` 事件的 `BallotIssue` 类。该事件向事件处理程序传递一个具有名为 `IsVetoed` 的布尔字段的 `VoteEventArgs`\
  \ 对象。\n\n还给 `BallotIssue` 类一个布尔 `IsVetoed` 方法。当程序调用该方法时，该类应该引发其 `Vote` 事件。主意是任何注册的事件处理程序都可以否决\
  \ `BallotIssue`。\n\n为主程序提供三个不同的事件处理程序，使用消息框询问是否想要否决该问题。\n\n遗憾的是，`BallotIssue` 类委托事件的方式需要它即使有人否决了问题，也要调用每个事件处理程序。这意味着即使早期的事件处理程序将\
  \ `e.Cancel` 设置为 `true`，后面的事件处理程序也可以将其重置为 `false`。\n\n为了防止这种情况，让每个事件处理程序检查 `e.Cancel`。如果值为\
  \ `true`，则事件处理程序应该直接返回而不执行任何操作。\n\n10. 你为练习 9 编写的程序存在的问题是，后期的事件处理程序可以覆盖早期事件处理程序的否决选择，本质上否决了否决。\n\
  \n编写一个程序来避免这个问题，通过让 `BallotIssue` 类将其事件处理程序存储在私有的 `List<EventHandler<VoteEventArgs>>`\
  \ 中而不是委托给私有事件。\n\n为了引发事件，新版本应该遍历事件处理程序列表。在调用每个之后，代码可以检查 `e.Cancel`。如果 `e.Cancel`\
  \ 为 `true`，它可以跳出循环，以便后面的事件处理程序无法重置 `e.Cancel`。\n\n11. 编写一个程序定义 `Student` 类，该类具有类似于“静态方法”节节描述的\
  \ `LookupStudent` 工厂方法。不要使用数据库，而是在方法中放置包含名和姓名的数组，并使用学生的 ID 作为数组的索引。如果用户输入的 ID 在数组范围之外，则返回\
  \ `null`。最后，给该类一个私有构造函数，并让工厂方法使用它。\n\n## 第 13 章\n\n 命名空间\n\n### 本章内容\n\n* 命名空间冲突\n\
  * `using` 指令\n* 项目和项目模板\n* 创建和解析命名空间\n* 默认和全局命名空间\n\n## 本章的 Wrox.com 下载资源\n\n请注意，本章的所有代码示例都可以作为该章代码下载的一部分，位于书籍网站的\
  \ [www.wrox.com/go/csharp5programmersref](http://www.wrox.com/go/csharp5programmersref)\
  \ 的“Download Code”选项卡上。\n\n在大型应用程序中，名称冲突是非常常见的。一个开发账单系统的开发者可能会创建一个 `Customer` 类。同时，另一位开发客户投诉跟踪系统的开发者可能会定义不同的\
  \ `Customer` 类。每个类都将具有对其应用程序有用的不同属性、方法和事件。\n\n像这样两个同名的类在尝试整合这两个程序之前，不会导致任何问题。到那时，程序将无法在不同情况下确定要使用哪种\
  \ `Customer` 类。\n\n这种多个项目具有相同名称的情况被称为命名空间冲突或命名空间污染。\n\n命名空间允许你对代码进行分组，以便告诉程序在何处查找特定的类。例如，开发账单系统的开发者可能会使用\
  \ `Billing` 命名空间，而开发投诉跟踪系统的开发者可能会使用 `CustomerSatisfaction` 命名空间。\n\n现在当你把两个程序的代码缝合到一个大程序中时，可以将这两个类引用为\
  \ `Billing.Customer` 和 `CustomerSatisfaction.Customer`，这两个类就可以和平共存。\n\n命名空间可以包含其他命名空间，因此你可以构建一个对实体的层次结构。你可以将\
  \ `Billing` 命名空间划分为 `OverdueAccounts` 和 `PaidAccounts` 等部分，为该项目的开发者提供相互隔离。\n\n命名空间起初可能会令人混乱，但它们非常简单。它们只是将代码分组为易管理的部分，以便你区分不同的代码块。\n\
  \n本章介绍了命名空间。它解释了如何使用命名空间对编程项进行分类，以及如何使用它们选择相同项目的正确版本。\n\n## .NET 中的冲突\n\n.NET Framework\
  \ 中的冲突并不常见，因为设计人员仔细地为用途相似的类提供了不同的名称。如果没有两个类具有相同的名称，就没有问题。\n\n例如，`System.Data` 命名空间包含了多个子命名空间，如\
  \ `Odbc` 和 `OleDb`，用于处理不同数据库（在这种情况下是 ODBC 和 OLE DB 数据库）。这些命名空间包含类似的类，但它们的名称带有命名空间前缀，因此不会发生冲突。例如，这些命名空间包含\
  \ `OdbcConnection` 和 `OleDbConnection` 类。\n\n然而，在某些情况下，类具有完全相同的名称。例如，`System.Windows.Forms`、`System.Windows.Controls`\
  \ 和 `System.Web.UI.WebControls` 命名空间都定义了 `Label`、`TextBox` 和 `Button` 类。\n\n这些命名空间代表了构建用户界面的不同方式（Windows\
  \ Forms、WPF/XAML 和网页），因此程序很少包含其中一种类型的控件。但是，如果你确实这样做了，将需要使用命名空间来指示你在代码的不同部分使用的是哪种。\n\
  \n## using 指令\n\n\n\n\nVisual Studio 定义了数千个类、常量和其他实体，为你的应用程序提供工具。它将这些内容归类到命名空间，以防止命名冲突并让你更容易找到所需的项目。\n\
  \n.NET Framework 的根命名空间命名为 `Microsoft` 和 `System`。\n\n`Microsoft` 命名空间包含了支持不同编程语言和工具的命名空间。例如，典型的命名空间包括\
  \ `CSharp`、`JScript` 和 `VisualBasic`，包含了支持 C#、JScript 和 Visual Basic 语言的类型和工具。`Microsoft`\
  \ 命名空间还包括 `Win32` 命名空间，其中包含了处理操作系统和操作注册表的类。\n\n`System` 命名空间包含了大量的有用编程项，包括许多嵌套命名空间。例如，`System.Drawing`\
  \ 命名空间包含与绘图相关的类；`System.Data` 包含与数据库相关的类；`System.Threading` 存放处理线程的类；`System.Security`\
  \ 包含了用于安全和加密的类。\n\n请注意，这些命名空间并不总是对你的程序可用。例如，默认情况下，`Microsoft.JScript` 命名空间对 C# 程序是不可用的。要使用它，你必须先向\
  \ `Microsoft.JScript.dll` 库添加引用。\n\nVisual Studio 包含如此多的编程工具，以至于命名空间层次极其庞大。命名空间被细化为子命名空间，这些子空间可能会进一步拆分为更多命名空间，直到达到易于管理的大小。虽然这更容易区分所有不同的编程实体，但使得某些类的完全限定变得变得繁琐。\n\
  \n例如，以下代码绘制了一个带有虚线框的矩形。注意 `Dash` 枚举值（**加粗显示**）使用的一长系列命名空间。\n\n```\nprivate void\
  \ Form1_Paint(object sender, PaintEventArgs e)\n{\n    using (Pen pen = new Pen(Color.Blue))\n\
  \    {\n        pen.DashStyle = System.Drawing.Drawing2D.DashStyle.Dash;\n     \
  \   e.Graphics.DrawRectangle(pen, 10, 10, 100, 50);\n    }\n}\n```\n\n你可以在文件顶部使用\
  \ `using` 指令来方便使用命名空间。例如，假设程序开头有以下语句。\n\n```csharp\nusing System.Drawing.Drawing2D;\n\
  ```\n\n现在程序可以使用以下更简单的代码来绘制虚线矩形。\n\n```csharp\nprivate void Form1_Paint(object sender,\
  \ PaintEventArgs e)\n{\n    using (Pen pen = new Pen(Color.Blue))\n    {\n     \
  \   pen.DashStyle = DashStyle.Dash;\n        e.Graphics.DrawRectangle(pen, 10, 10,\
  \ 100, 50);\n    }\n}\n```\n\n`using` 指令告诉编译器去哪里查找未在本地定义的类、结构体、枚举和其他项。当它看到值 `DashStyle.Dash`\
  \ 时，编译器尝试在当前文件中查找 `DashStyle`。当没有找到时，编译器会搜索 `using` 指令中列出的命名空间。在这个例中，它最终在 `System.Drawing.Drawing2D`\
  \ 命名空间找到了 `DashStyle`。\n\n如果程序包含两个定义具有相同名称类的命名空间 `using` 指令，C# 可能会产生困惑并给你一个“歧义引用”（Ambiguous\
  \ Reference）错误。要解决此问题，代码必须使用完全限定名来选择正确的版本。\n\n例如，以下代码创建了两个 `Customer` 对象，一个使用 `Billing`\
  \ 命名空间中定义的类，另一个使用 `CustomerSatisfaction` 命名空间中定义的类。\n\n```csharp\nBilling.Customer\
  \ customer1 = new Billing.Customer();\nCustomerSatisfaction.Customer customer2 =\
  \ new CustomerSatisfaction.Customer();\n```\n\n有时，包含完全限定命名空间会导致代码变得难以处理和阅读。在这个例中，`CustomerSatisfaction`\
  \ 命名空间使得第二个语句非常长，几乎无法挤在一行内。在其他情况下，例如之前使用的 `System.Drawing.Drawing2D.DashStyle.Dash`\
  \ 值，深层嵌套的命名空间会让代码显得笨拙。\n\n除了包含编译器使用的命名空间外，`using` 指令还可以定义别名来方便使用长命名空间。例如，以下 `using`\
  \ 指令为 `System.Drawing.Drawing2D` 和 `CustomerSatisfaction` 命名空间定义了别名。\n\n```csharp\n\
  using D2D = System.Drawing.Drawing2D;\nusing CS = CustomerSatisfaction;\n```\n\n\
  以下代码显示了如何使用这些别名。\n\n```csharp\npen.DashStyle = D2D.DashStyle.Dash;\nCS.Customer\
  \ customer2 = new CS.Customer();\n```\n\n### 项目模板\n\n当你创建一个新项目时，Visual Studio 会包含项目模板中定义的任何\
  \ `using` 指令。包含的指令是由微软开发团队选择的，因为他们认为这些指令在许多常见情况下很有用，但结果可能不符合你的需求。\n\n如果模板的作用并不完全符合你，手动添加几个\
  \ `using` 指令也很容易。通过使用“删除未使用的引用”（Remove Unused Usings）右键菜单命令，删除不需要的指令更容易。\n\n然而，如果你构建了大量项目或添加了许多需要相同指令的模块，可以通过定义自己的模板来让过程变得简单一点。\n\
  \n要创建项目模板，请启动新项目。添加任何你希望模板拥有的表单、窗口或其他模块，并编辑它们以包含所需的 `using` 指令。当项目已达到你想要的样子时，使用“文件”（File）菜单打开“导出模板”（Export\
  \ Template）命令。\n\n### 项模板\n\n当你向项目添加新表单或其他模块时，Visual Studio 使用项模板来确定添加哪些代码和哪些 `using`\
  \ 指令。就像你可以定义新的项目模板一样，你也可以定义新的项模板。\n\n例如，创建一个包含你所需要的 `using` 指令的表单。\n\n\n\n检查你想要包含的引用，并点击“后续”显示图\
  \ 13-2 所示页面。像以前一样输入模板名称和描述，然后点击“完成”来创建模板。\n\n现在，当你选择 `Project` 菜单下的 `Add New Item`\
  \ 命令时，就可以选择你定义的项了。\n\n## 默认命名空间\n\n每个项目都有一个默认命名空间，项目中的每个项直接或间接地包含在该命名空间内。\n\n最初，默认命名空间的名称与项目名称相同。例如，如果你创建一个名为\
  \ `OrderExplorer` 的项目，那么每个模块的代码最初都包含在 `OrderExplorer` 命名空间中。\n\n要查看或更改项目的默认命名空间，使用\
  \ `Project ⇒ Properties` 打开项目属性页，并选择 `Application` 页，如图图 13-6 所示。你可以在 `Default Namespace`\
  \ 框中查看并更改默认命名空间。\n\n![c13f006.tif](img/c13f006.png)\n\n`图 13-6:`` 使用应用程序属性页更改应用程序的默认命名空间。\n\
  \n如果你更改了命名命名，将来向项目中添加任何模块都将使用该命名空间。\n\n## 创建命名空间\n\n你可以在默认命名空间内部创建新的嵌套命名空间，以便进一步对代码分类。只需在代码中添加\
  \ `namespace` 语句即可。\n\n你可以在任何其他命名空间之外创建命名空间。你也可以将命名空间放在另一个命名空间的顶层（即不在任何类、结构或其他代码项内部）。例如，考虑以下代码。\n\
  \n```\nnamespace OrderExplorer\n{\n    public class Person\n    {\n        public\
  \ CustomerData.Customer customer;\n    }\n\n    namespace CustomerData\n    {\n\
  \        public class Customer : Person\n        {\n            public Person person;\n\
  \        }\n    }\n}\n\nnamespace DrawingTools\n{\n    public class Shape\n    {\n\
  \        public OrderExplorer.CustomerData.Customer customer;\n    }\n}\n```\n\n\
  此代码定义了两个顶级命名空间：`OrderExplorer` 和 `DrawingTools`。`OrderExplorer` 命名空间包含 `CustomerData`\
  \ 命名空间。\n\n命名空间内部的代码可以引用该命名空间或任何包含命名空间中定义的项，而无需显式地给出命名空间路径。例如，在前面的代码中，`Customer`\
  \ 类可以引用 `Person` 类，而无需指示其完全限定命名空间路径为 `OrderExplorer.CustomerData`。\n\n相比之下，`Person`\
  \ 类必须通过 `CustomerData.Customer` 引用 `Customer` 类，因为 `Person` 类并不在 `CustomerData`\
  \ 命名空间中。同样，`Shape` 类必须通过 `OrderExplorer.CustomerData.Customer` 引用 `Customer` 类。\n\
  \n`using` 指令可以改变这种行为。例如，如果模块包含以下 `using` 指令，那么此示例中的所有类都可以在没有任何命名空间信息的情况下引用 `Customer`\
  \ 类。\n\n```\nusing OrderExplorer.CustomerData;\n```\n\n程序可以通过使用多个 `namespace` 语句在多个位置将代码置于命名空间中。例如，两个模块可以使用\
  \ `namespace DrawingTools` 语句向 `DrawingTools` 命名空间中添加代码。\n\n## 解析命名空间\n\n通常情况下，C#\
  \ 在解析命名空间方面做得很好，因此你不需要太担心这个过程。你可以插入一个 `using` 指令，然后在你使用的声明中省略命名空间。如果你没有包含 `using`\
  \ 指令，仍然可以使用完全限定声明。你甚至可以创建一个命名空间别名，这样你就可以在不输入完整的情况下指定命名空间。\n\n然而，存在一些中间情况可能会引起困惑。为了理解这些情况，多了解一些\
  \ C# 如何解析命名空间会有帮助。\n\n当编译器看到使用完全限定命名空间的引用时，它会在该命名空间中查找所需的项，就结束了。它成功或失败。例如，以下代码声明了一个类型为\
  \ `System.Collections.Hashtable` 的变量。编译器在 `System.Collections` 命名空间中查找并尝试寻找 `Hashtable`\
  \ 类。如果该类不存在，则声明失败。\n\n```\nSystem.Collections.Hashtable hashtable = new System.Collections.Hashtable();\n\
  ```\n\n当编译器找到指向限定命名空间的引用时，它最初假设该命名空间是完全限定的。如果它无法按照上一段所述解析该引用，它会假设引用是部分限定的，并在当前命名空间中查找解析。例如，假设你如下代码所示声明了一个变量。\n\
  \n```\nCustomerData.Customer customer;\n```\n\n在这种情况下，编译器在当前命名空间中搜索名为 `CustomerData`\
  \ 的嵌套命名空间。如果它找到了这样的命名空间，它会在该命名空间中查找 `Customer` 类。\n\n如果编译器无法通过这些方法解析命名空间，它将向上移动命名空间层次结构并重试。向上移动命名空间层次结构有时令人困惑。它可能会导致编译器在当前命名空间的祖先、某种“叔叔/姨妈”命名空间或堂表兄弟命名空间中解析引用。\n\
  \n例如，考虑图 13-7 所示的命名空间层次结构。云代表命名空间，框代表类。\n\n![c13f007.eps](img/c13f007.png)\n\n`图\
  \ 13-7:`` 为了解析命名空间引用，C# 编译器可能会跨命名空间搜索。\n\n假设 `Customer` 类包含了以下声明。\n\n```\npublic\
  \ Employee SalesRep { get; set; }\n```\n\n`Customer` 类位于 `BusinessClasses` 命名空间中。该命名空间定义了一个\
  \ `Employee` 类，这就是编译器用于 `SalesRep` 属性的类。\n\n现在假设 `Customer` 类使用以下声明代替之前的声明。\n\n\
  ```\npublic AssignmentTools.Employee SalesRep { get; set; }\n```\n\n在这种情况下，编译器首先假设\
  \ `AssignmentTools.Employee` 是完全限定名。它在命名空间层次结构的根部查找 `AssignmentTools` 命名空间，但没有找到。\n\
  \n接下来，编译器在当前命名空间 `BusinessClasses` 中查看是否包含 `AssignmentTools` 命名空间。编译器没有找到这样的命名空间，因此向上移动到\
  \ `ContractBuilder` 命名空间。\n\n编译器再次查找 `AssignmentTools` 命名空间，这次找到了。编译器在新命名空间中查找 `Employee`\
  \ 类并找到了它，因此搜索结束了。\n\n如果你理解编译器如何解析命名空间，你最终可以推出此示例中的属性类型为 `ContractBuilder.AssignmentTools.Employee`。如果你在代码中添加\
  \ `using` 指令，情况可能会变得更加复杂。\n\n假设程序包含了以下指令。\n\n```\nusing BusinessClasses;\nusing\
  \ AssignmentTools;\n```\n\n现在，如果 `ContractBuilder` 命名空间中的代码声明了一个类型为 `Employee` 的变量，编译器将不知道使用哪一个版本。此时它将放弃并报告歧义引用错误。\n\
  \n## 全局命名空间\n\n不同的命名空间可以包含名称相同的程序项。一个命名空间可能定义一个名为 `Shutdown` 的类；另一个可能创建一个名为 `Shutdown`\
  \ 的枚举；第三个可能定义一个名为 `Shutdown` 的结构。只要你使用正确的命名空间，就可以使用任何一个版本。\n\n\n\n\n这种情况导致问题的一种情况是：某个命名空间定义了一个隐藏全局命名空间中符号的符号。例如，假设你为一个游戏程序定义了以下\
  \ `Player` 类。\n\n```java\npublic class Player\n{\n    public string Name { get;\
  \ set; }\n    private ConsoleTyes Console { get; set; }\n\n    // 显示人的名字。\n    public\
  \ void ShowName()\n    {\n        Console.WriteLine(Name);\n    }\n}\n```\n\n本意是让\
  \ `Console` 属性存储玩家的控制类型。遗憾的是，当编译器在 `ShowName` 方法中看到 `Console` 时，它找到的是属性而不是在 Console\
  \ 窗口显示消息的类。\n\n如果你在命名空间前面加上 `global::`，编译器将开始在全球命名空间中查找符号，而不是在本地查找。这意味着你可以使用以下语句正确地找到\
  \ `Console.WriteLine` 方法。\n\n```java\nglobal::System.Console.WriteLine(Name);\n\
  ```\n\n通常最好避免与系统命名空间冲突的名称。例如，如果你将属性名称改为 `ConsoleType`，就不会有混淆了。\n\n## 总结\n\n命名空间在\
  \ C# 中无处不在。你写的每行代码都包含在某个命名空间中，即使它是应用程序的根命名空间。尽管命名空间无处可见，但许多开发者从未需要显式地使用它们，因此觉得它们有些神秘。\n\
  \n命名空间非常简单。它们仅仅是将编程项目划分为层次结构以防止名称冲突，并允许你对相关项目分组。\n\n`using` 指令允许程序在不使用完全限定名称的情况下引用命名空间中的项目。`using`\
  \ 指令还可以为命名空间定义别名，这样你就可以使用短缩写来引用它。这对于解决出现在程序使用的多个命名空间中的相同名称特别有用。\n\n.NET Framework\
  \ 包含了数百个命名空间，其中某些比其他的更有用。下一章将描述位于两个最有用的命名空间中的类：`System.Collections` 和 `System.Collections.Generic`。这些命名空间中的类允许你以特别有用的方式安排和管理对象，例如使用栈、队列、列表和字典。\n\
  \n## 练习\n\n1. 假设你正在编写一个使用 `System.Security.Cryptography.SHA512Managed` 类的程序，但你（可以理解）不想输入这一长串字符。给出两种在代码中缩短这种写法的方法。每种方法的优缺点是什么？\n\
  2. 假设你的程序需要使用 `System.Windows.Controls.Calendar` 控件和 `System.Globalization.Calendar`\
  \ 类。给出三种在代码中区分这两个类的方法。每种方法的优缺点是什么？\n\n对于练习 3 到 8，请使用在图 13-8 所示的命名空间层次结构。（不，我不推荐这种设计。）\n\
  \n![c13f008.eps](img/c13f008.png)\n\n**图 13-8：** 云表示命名空间，矩形表示类。\n\n3. 在没有任何 `using`\
  \ 指令的情况下，`Algorithms` 命名空间的代码引用 `OrderClasses` 和 `Fulfillment` 两个命名空间中的 `Order`\
  \ 类的最短方式是什么？\n4. 在没有任何 `using` 指令的情况下，`OrderTools` 命名空间的代码引用 `Fulfillment` 和 `OrderClasses`\
  \ 两个命名空间中的 `Order` 类的最短方式是什么？\n5. 你会创建哪些 `using` 指令来允许 `Algorithms` 命名空间的代码通过别名引用任一\
  \ `Order` 类？显示使用这些别名定义这两个类实例对象的代码。\n6. `Customer` 类包含两种类型 `Order` 对象的最简洁方式是什么？显示定义这两个类对象的代码。\n\
  7. 允许整个命名空间层次结构中的代码使用 `Invoice` 类最简单的方法是什么？\n8. 你如何改进图 13-8 所示的设计？\n\n## 第 14 章\n\
  \n## 集合类\n\n### 本章内容\n\n* 数组和数组对象\n* 集合类\n* 泛型集合\n* 集合初始化\n* 迭代器\n\n### Wrox.com\
  \ 本章下载资源\n\n请注意，本章的所有代码示例都可以作为本章代码下载的一部分，可以在书籍网站的 [www.wrox.com/go/csharp5programmersref](http://www.wrox.com/go/csharp5programmersref)\
  \ 的“下载代码”选项卡下载。\n\n许多应用程序必须存储和操作对象组。例如，一个应用程序可能需要管理一组 `Customers`（客户）、`Orders`（订单）、`Students`（学生）或\
  \ `Invoices`（发票）。\n\n数组允许你存储一组对象。遗憾的是，数组不允许你轻松重新排列对象。例如，要在 C# 数组末尾添加对象，你需要创建一个比旧数组大一个数组，将现有项复制到新数组中，添加新项，然后将旧数组的引用指向新数组。在数组开头或中间添加或删除项更为耗时。\n\
  \n由于此类操作常见，多年来已经设计了许多算法来让这些操作变得更容易。.NET Framework 包含了各种集合类，因此你不需要自己实现。本章描述了 Framework\
  \ 提供的集合类。它解释了你如何使用它们来存储对象组，并提供了选择正确集合的提示。下一节从描述最简单的集合开始：数组。\n\n## 数组\n\nC# 提供了两种基本的数组。首先，它提供了在使用\
  \ `new` 关键字并用括号括围数组应包含的项目数量时获得的普通数组。例如，以下代码声明了一个名为 `squares` 的 `int` 数组，并将其初始化为包含\
  \ 10 个条目。\n\n```java\nint[] squares = new int[10];\n```\n\nC# 的 `Array` 类提供了另一种数组。这种类型实际上是一个对象，提供了管理存储在数组中的项的方法。以下代码显示了使用\
  \ `Array` 对象重写了之前的版本代码：\n\n```java\nArray squares = Array.CreateInstance(typeof(int),\
  \ 10);\n```\n\n此版本通过向静态方法 `Array.CreateInstance` 传递数组应该包含的数据类型和它应该包含的项目数量来创建数组。\n\
  \n`Array` 类的一个很好的特性是它提供的方法也适用于普通数组。例如，如果 `values` 是一个普通的 `string` 数组，那么 `Array.Sort(values)`\
  \ 语句会对数组中的字符串进行排序。\n\n后续章节提供了有关数组和 `Array` 类的更多细节。\n\n### 维度\n\n普通数组和 `Array` 对象都支持多维度。以下`语句`声明了一个三维数组，第一维度有\
  \ 10 个项目，第二维度 5 个，第三维度 20 个。然后它设置了位置 (1, 2, 3) 项的值。\n\n```java\nint[, ,] values\
  \ = new int[10, 5, 20];\nvalues[1, 2, 3] = 123;\n```\n\n以下代码使用 `Array` 对象执行相同的操作。\n\
  \n```java\nArray values = Array.CreateInstance(typeof(int), 10, 5, 20);\nvalues.SetValue(123,\
  \ 1, 2, 3);\n```\n\n### 下界\n\n普通数组在每个维度上的下界始终为 0。例如，之前的数组维度为 0 到 9、0 到 4 以及 0 到\
  \ 19。\n\n你可以假装数组具有非零下界，但这需要你额外工作。你必须对每个索引加上或减去相应的量，以便将你想使用的索引映射到底层的零基索引。\n\n\n\n\
  \n\n`Array` 对象可以为你处理非零的起始下界。向 `CreateInstance` 方法传递数组的数据类型、一个给出每个维度长度的数组，以及一个给出每个维度下界的边界数组。\n\
  \n例如，假设你想存储 2001 年到 2010 年的季度销售数据。以下代码创建了一个二维数组，其第个维度的索引范围从 2001 到 2010，第二个维度的索引范围从\
  \ 1 到 4。\n\n```\nint[] lengths = {10, 4};\nint[] lowerBounds = {2001, 1};\nArray\
  \ sales = Array.CreateInstance(typeof(decimal), lengths, lowerBounds);\nsales.SetValue(10000m,\
  \ 2005, 3);\n```\n\n代码首先定义了一个包含每个维度元素数量的数组（第一个维度为 10 个，第二个维度为 4 个）。接下来，它创建了一个包含每个维度下界的边界数组。（第一个维度从索引\
  \ 2001 开始，第二个维度从索引 1 开始。）\n\n然后，代码调用 `Array.CreateInstance`，并传递了 `int` 数据类型、长度数组和下界数组。代码最后通过将\
  \ 2005 年第三季度的值设置为 10,000 完成。\n\n### 调整大小\n\n要调整数组的大小，你需要分配一个新数组，将你想要保留的任何项复制到其中，然后将原始数组的引用指向新数组。例如，以下代码在数组末尾添加了值\
  \ 5。\n\n```\n// 创建初始数组。\nint[] values = { 0, 1, 2, 3, 4 };\n\n// 在末尾添加值 5。\nint[]\
  \ newValues = new int[6];\nfor (int i = 0; i < values.Length; i++)\n    newValues[i]\
  \ = values[i];\nnewValues[5] = 5;\nvalues = newValues;\n```\n\n像普通数组一样，`Array` 对象不能调整大小。但是，`Array`\
  \ 类的 `CopyTo` 方法可以相对容易将项从一个 `Array` 拷贝到另一个 `Array`。例如，以下代码与之前的代码类似，但它使用的是 `Array`\
  \ 对象而不是普通数组。\n\n```\n// 创建初始数组。\nArray values = Array.CreateInstance(typeof(int),\
  \ 5);\nfor (int i = 0; i < values.Length; i++) values.SetValue(i, i);\n\n// 在末尾添加值\
  \ 5。\nArray newValues = Array.CreateInstance(typeof(int), 6);\nvalues.CopyTo(newValues,\
  \ 0);\nnewValues.SetValue(5, 5);\nvalues = newValues;\n```\n\n`Array` 类的静态方法 `Copy`\
  \ 允许你进行更大的控制。它允许你指定源数组中开始拷贝的索引、目标数组中拷贝项的索引以及要拷贝的项的数量。\n\n`Array` 类方法的一个优点点是，其中许多方法也适用于普通数组。例如，以下代码显示了之前扩展普通数组的代码，但这个版本使用了\
  \ `Array.Copy` 方法而不是使用 `for` 循环拷贝项。\n\n```\n// 创建初始数组。\nint[] values = { 0, 1, 2,\
  \ 3, 4 };\n\n// 在末尾添加值 5。\nint[] newValues = new int[6];\nArray.Copy(values, newValues,\
  \ 5);\nnewValues[5] = 5;\nvalues = newValues;\n```\n\n这段代码仍然相当长，但 `Array.Copy` 方法非常快，因此代码效率很高。\n\
  \n### 速度\n\n毫无疑问，变量数组比 `Array` 对象快得多。在一次测试中，在 `Array` 对象中设置和获取值所需的时间比在变量数组中执行相同操作的时间花了\
  \ 20 倍。\n\nMicrosoft 还优化了一维数组，因此它们比多维数组更快。然而，这种差异与数组与 `Array` 类之间的差异没有那么显著。\n\n\
  如果你的应用程序只执行几百次数组操作，那么这种差异并不重要。如果你的应用程序必须访问数百万次数组值，你可能需要考虑使用变量数组，即使 `Array` 类在其他方面（例如非零起始下界）会更方便。\n\
  \n示例程序 `ArraySpeeds` 可以在本书的网站下载，它比较了变量数组和 `Array` 对象的速度。输入你想在数组中使用的项数，并点击 Go。该程序构建持有相同数量整数的一维和二维数组以及\
  \ `Array` 对象。然后，它会在大量测试中填充数组并显示经过的时间。\n\n[图 14-1] 显示了结果。变量数组比 `Array` 对象快得多，且一维变量数组通常比二维数组稍快。\n\
  \n![c14f001.tif](img/c14f001.png)\n\n[图 14-1:] 变量数组比 `Array` 对象快。\n\n### 其他 Array\
  \ 类功能\n\n`Array` 类提供了其他几个实用的静态方法，同时适用于数组和 `Arrays`。例如，`IndexOf` 和 `LastIndexOf`\
  \ 方法返回特定项在 `Array` 中的位置。\n\n下表总结了一些最有用的 `Array` 类方法。\n\n| 属性/方法 | 目的 |\n| :--- |\
  \ :--- |\n| `BinarySearch` | 返回在排序数组中的项索引。项必须实现 `IComparable` 接口，或者你必须提供 `IComparer`\
  \ 对象。 |\n| `Clear` | 移除数组中的所有项。 |\n| `ConvertAll` | 将数组转换为另一种类型。 |\n| `Copy` | 将一个数组的部分或全部项拷贝到另一个数组的位置。\
  \ |\n| `Exists` | 数组是否包含特定项。 |\n| `IndexOf` | 返回指定值首次出现的索引。 |\n| `LastIndexOf` |\
  \ 返回指定值最后一次出现的索引。 |\n| `Resize` | 调整数组大小。 |\n| `Reverse` | 反转数组项的顺序。 |\n| `Sort`\
  \ | 对数组项进行排序。项必须实现 `IComparable` 接口，或者你必须提供 `IComparer` 对象。 |\n\n## System.Collections\n\
  \n`System.Collections` 命名空间下的集合类基本上持有项但没有提供很多功能。本章后面介绍的其他类更强大，你应该通常使用它们。\n\n以下章节描述了\
  \ `ArrayList`、`StringCollection` 和 `NameValueCollection` 类。\n\n### ArrayList\n\n\
  `System.Collections.ArrayList` 类表示内部作为列表的可调整数组。你可以在任何位置添加和删除项，它会自动调整大小。下表描述了该类一些有用的属性和方法。\n\
  \n| 属性/方法 | 目的 |\n| :--- | :--- |\n| `Add` | 在列表末尾添加项。 |\n| `AddRange` | 将实现 `ICollection`\
  \ 接口对象的项添加到列表末尾。 |\n| `BinarySearch` | 返回排序数组中的项索引。项必须实现 `IComparable` 接口，或者你必须向方法提供\
  \ `IComparer` 对象。 |\n| `Capacity` | 获取或设置列表可以容纳的的数量。 |\n| `Clear` | 移除列表中的所有项。 |\n\
  | `Contains` | 如果指定项在列表中，则返回 `true`。 |\n| `CopyTo` | 将列表的部分或全部拷贝到一个一维 `Array` 对象中。\
  \ |\n| `Count` | 返回列表中当前项的数量。此值始终小于或等于 `Capacity`。 |\n| `GetRange` | 返回一个包含列表部分项的\
  \ `ArrayList`。 |\n| `IndexOf` | 返回指定项在列表中首次出现的零基索引。 |\n| `Insert` | 在列表的特定位置添加项。\
  \ |\n| `InsertRange` | 将实现 `ICollection` 接口对象的项添加到列表的特定位置。 |\n| `Item` | 返回列表中特定位置的项。\
  \ |\n| `LastIndexOf` | 返回指定项在列表中最后一次出现的零基索引。 |\n\n\n\n\n\n| `Remove` | 从列表中移除第一个出现的指定项。\
  \ |\n| `RemoveAt` | 移除列表中指定位置的项。 |\n| `RemoveRange` | 移除列表中指定位置的项。 |\n| `Reverse`\
  \ | 反转列表中项的顺序。 |\n| `SetRange` | 使用来自 `ICollection` 对象的新项替换列表中的部分项。 |\n| `Sort`\
  \ | 对列表中的项进行排序。这些项必须实现 `IComparable` 接口，或者你必须为该方法提供一个 `IComparer` 对象。 |\n| `ToArray`\
  \ | 将列表的项复制到一维数组中。该数组可以是对象数组、特定类型的数组，或者一个 `Array` 对象（持有 `objects`）。 |\n| `TrimToSize`\
  \ | 减少列表分配的空间，使其大小恰好能够容纳其项。这会将 `Capacity` 设置为 `Count`。 |\n\n单个 `ArrayList` 对象可以包含许多不同类型的对象。例如，以下代码创建了一个\
  \ `ArrayList`，向其添加了几个不同类型的项，然后遍历列表并显示这些值。\n\n```\nArrayList list = new ArrayList();\n\
  list.Add(\"What?\");\nlist.Add(this);\nlist.Add(7331);\nlist.Add(new Bitmap(32,\
  \ 32));\nforeach (object obj in list)\n    Console.WriteLine(obj.ToString());\n\
  ```\n\n下文显示了结果。\n\n```\nWhat?\nWindowsFormsApplication1.Form1, Text: Form1\n7331\n\
  System.Drawing.Bitmap\n```\n\n### StringCollection\n\n`System.Collections.Specialized`\
  \ 命名空间下的 `StringCollection` 类与 `ArrayList` 类似，不同在于它只能包含字符串。由于它只处理字符串，该类提供了一些 `ArrayList`\
  \ 不具备的额外类型检查。例如，如果你的程序尝试向 `StringCollection` 添加一个 `Employee` 对象或 `Bitmap`，该集合将抛出异常。\n\
  \n`StringCollection` 可以包含重复的值和 `null` 值。\n\n以下代码展示了 UseStringCollection 示例程序（该程序可以在书籍网站上下载）是如何演示\
  \ `StringCollection` 的。\n\n```\n// 值集合。\nprivate StringCollection Values = new StringCollection();\n\
  \n// 向集合中添加一个值。\nprivate void addButton_Click(object sender, EventArgs e)\n{\n \
  \   Values.Add(valueTextBox.Text);\n    valueTextBox.Clear();\n    valueTextBox.Focus();\n\
  \    ListValues();\n}\n\n// 显示名称/值组。\nprivate void ListValues()\n{\n    valueListBox.Items.Clear();\n\
  \    foreach (string value in Values)\n    {\n        valueListBox.Items.Add(value);\n\
  \    }\n}\n```\n\n代码开始时创建一个新的 `StringCollection`。当你在 `TextBox` 中输入一个字符串并点击 Add 时，按钮的\
  \ `Click` 事件处理程序会将该值添加到 `StringCollection` 中，并调用 `ListValues` 方法显示集合的值。`ListValues`\
  \ 方法遍历集合中的值，并将它们显示在程序的 `ListBox` 中。\n\n为了利用这种额外的错误检查，如果你正在处理字符串，应该始终使用 `StringCollection`\
  \ 而不是 `ArrayList`。当然，如果你需要其他功能（例如 `Dictionary` 提供的快速查找），你应该使用在后续后续章节中描述的类之一。\n\n\
  ### NameValueCollection\n\n`System.Collections.Specialized` 命名空间下的 `NameValueCollection`\
  \ 类是一种集合，可以为特定的键（值的“名称”）持有多个 `string` 值。例如，你可能使用人的姓名作为键。与特定键关联的 `string`s 可能包括邮政地址、电话号码、电子邮件地址等。\n\
  \n当然，你也可以通过将邮政地址、电话号码、电子邮件地址和其他字段放入对象或结构中来存储相同的信息，然后将这些对象或结构存储在某种如 `ArrayList` 的集合类中。然而，如果你预先不知道每个键将关联多少个字符串，`NameValueCollection`\
  \ 就非常有用。\n\n以下代码展示了 UseNameValueCollection 示例程序（该程序可以在书籍网站上下载）是如何演示 `NameValueCollection`\
  \ 的。\n\n```\n// NameValueCollection 集合。\nprivate NameValueCollection Values = new\
  \ NameValueCollection();\n\n// 添加一个新的名称/值。\nprivate void addButton_Click(object\
  \ sender, EventArgs e)\n{\n    Values.Add(nameTextBox.Text, valueTextBox.Text);\n\
  \    valueTextBox.Clear();\n    valueTextBox.Focus();\n    ListValues();\n}\n\n\
  // 显示名称/值组。\nprivate void ListValues()\n{\n    valueListBox.Items.Clear();\n   \
  \ foreach (string key in Values.AllKeys)\n    {\n        valueListBox.Items.Add(key\
  \ + \": \" + Values[key]);\n    }\n}\n```\n\n代码开始时声明一个 `NameValueCollection`。如果你在程序的\
  \ `TextBox`es 中输入名称和值并点击 Add，程序的 `Click` 事件处理程序会将名称/值对添加到集合中。然后它调用 `ListValues`\
  \ 方法来显示当前的名称和值列表。\n\n`ListValues` 方法遍历集合中的键，并将它们与其值一起显示。值之间用逗号分隔显示。例如，如果你添加了一个名称，`ListBox`\
  \ 将显示 Breakfast,Toast,Juice。\n\n下表描述了 `NameValueCollection` 类的一些常用的属性和方法。\n\n| 属性/方法\
  \ | 描述 |\n| :--- | :--- |\n| `Add` | 向集合添加一个名称/值对。 |\n| `AllKeys` | 返回包含所有键的字符串数组。\
  \ |\n| `Clear` | 从集合中移除所有名称和值。 |\n| `CopyTo` | 从指定索引开始将项复制到一维 `Array` 对象中。这只复制键。\
  \ |\n| `Count` | 返回集合中键的数量。 |\n| `Get` | 获取指定索引或名称的项，作为逗号分隔列表。 |\n| `GetKey` | 获取指定索引的键。\
  \ |\n| `GetValues` | 返回特定名称的字符串数组。 |\n| `HasKeys` | 如果集合包含任何非 `null` 键，则返回 `true`。\
  \ |\n| `Keys` | 返回包含键的集合。 |\n| `Remove` | 移除特定的名称及其所有的值。 |\n| `Set` | 设置特定名称的项。\
  \ |\n\n注意，没有简单的方法可以从名称中移除特定的值。例如，如果一个人的姓名关联了邮政地址、电话号码和电子邮件地址，很难仅移除电话号码。相反，你必须移除名称并重新添加，同时忽略不需要的值。\n\
  \n### Dictionaries\n\n字典是一种将键与值关联的集合。你查找一个键，字典就会提供相应的值。这与 `NameValueCollection`\
  \ 的工作方式相似，但字典的键和值不需要是 `string`，且字典将每个键与单个值关联。\n\n`System.Collections.Specialized`\
  \ 命名空间包含几种不同类型的字典类，它们针对不同的用途进行了优化。它们的区别主要源于内部存储数据的方式。虽然你不需要理解字典内部如何工作的细节，但你确实需要了解它们的行为，以便为特定目的选择最合适的一个。\n\
  \n由于所有字典类提供相同的服务（将键与值关联），它们具有大致相同的属性和方法。下表描述了最有用的部分。\n\n| 属性/方法 | 描述 |\n| :--- |\
  \ :--- |\n| `Add` | 向字典添加键/值对。 |\n| `Clear` | 从字典中移除所有键/值对。 |\n| `Contains` | 如果字典包含特定键，则返回\
  \ `true`。 |\n\n\n\n\n\n| `CopyTo` | 将字典从特定位置开始的数据复制到 `DictionaryEntry` 对象的一维数组中。`DictionaryEntry`\
  \ 类具有 `Key` 和 `Value` 属性。 |\n| `Count` | 返回字典中键/值对的数量。 |\n| `Item` | 获取或设置与键关联的值。\
  \ |\n| `Keys` | 返回一个包含字典所有键的集合。 |\n| `Remove` | 具有特定键的键/值对。 |\n| `Values` | 返回一个包含字典所有值的集合。\
  \ |\n\n你可以像索引数组一样对字典进行索引。例如，以下代码创建了一个 `ListDictionary`，为键 `dessert` 添加了值 `Apple\
  \ pie`，然后在消息框中显示该值。\n\n```\nListDictionary dict = new ListDictionary();\ndict[\"\
  dessert\"] = \"Apple pie\";\nMessageBox.Show((string)dict[\"dessert\"]);\n```\n\n\
  注意代码是如何使用 `[\"dessert\"]` 作为字典的索引的。\n\n字典将其所有的键和值都视为普通的 `object`，因此在消息框中显示它之前，代码必须将结果转换为\
  \ `string`。\n\n接下来的章节将更详细地描述不同的字典类。\n\n### ListDictionary\n\n`ListDictionary` 是一种在链表列表中存储数据的字典。在链表中，每个项目都存储在一个对象中，该对象包含其数据以及指向列表中下一个项目的引用（或链接\
  \ `link`）。\n\n图 14-3 展示了一个链表。该列表包含以下键/值对：Appetizer/Salad、Entrée/Sandwich、Drink/Water\
  \ 和 Dessert/Cupcake。Dessert/Cupcake 项的链接被设置为 `null`，因此程序可以判断何时到达列表的末尾。`ListDictionary`\
  \ 类内部的一个引用变量（在图 14-3 中标记为 `Top`）指向列表中的第一个项目。\n\n![c14f003.eps](img/c14f003.png)\n\
  \n图 14-3: 链表中的每个项目都持有指向列表中下一个项目的引用。\n\n链表中的链接使得添加和删除项目变得相对简单。`ListDictionary` 只需重新排列链接来添加或删除对象。例如，要在列表顶部添加新项目，你会创建一个新项目，将其链接指向当前顶部的项目，然后让列表的\
  \ `Top` 变量指向新项目。其他的重排也几乎同样简单。（有关链表工作原理的更多信息，请参阅关于算法和数据结构的书籍，例如我的书籍 *Essential Algorithms:\
  \ A Practical Approach to Computer Algorithms*，Wiley, 2013。）\n\n遗憾的是，如果列表很长，在其中查找项目可能会花费很长时间。要查找列表中的项目，程序从顶部开始向下移动，遵循项目之间的链接，直到找到所需的项目为止。如果列表很短，这不需要花费很长时间。如果列表包含\
  \ 100,000 个项目，这意味着可能需要从头到尾进行 100,000 次项目的爬行搜索。这意味着如果 `ListDictionary` 对象包含过多的项目，其性能就会下降。\n\
  \n如果你只需要在字典中存储数百个项目，且不需要频繁访问它们，那么 `ListDictionary` 就可以了。如果你需要存储海量条目，或者你需要极其频繁地访问字典条目，使用更高级的类如\
  \ `Hashtable` 可能会获得更好的性能。`Hashtable` 比 `ListDictionary` 有更大的开销，但访问其条目的速度更快。\n\n\
  ### Hashtable\n\n`Hashtable` 外部看起来非常像 `ListDictionary`，但内部以不同的方式存储数据。该类没有使用链表，而是使用哈希表来存储数据。\n\
  \n哈希表是一种允许通过键极快访问项目的数据结构。哈希表的工作原理非常有趣，但超出了本书的范围。（更多信息，请参阅关于算法和数据结构的书籍，例如我的书籍 *Essential\
  \ Algorithms*。）\n\n你不需要知道如何创建自己的哈希表就可以使用，但为了有效使用哈希表，你确实需要了解一点工作原理。哈希表提供了极快的查找，但它们需要大量的额外空间。如果哈希表变得太满，它就会开始变慢，存储和检索值比比需要的时间。为了提高性能，哈希表必须调整自身的大小并重新排列其包含的项目。调整哈希表的大小需要一些时间，因此\
  \ `Hashtable` 类提供了一些额外工具帮助你避免调整大小。\n\n`Hashtable` 构造函数的一个重载版本接受一个参数，告诉表格初始应容纳多少项目。如果你知道你将向\
  \ `Hashtable` 加载 1,000 个项目，你可能会初始给它足够的空间容纳 1,500 个项目。这样程序就可以添加所有 1,000 个项目而不会让表格太满，从而仍保持良好的性能。如果你不设置初始大小，哈希表开始时可能太小，在能够容纳它之前可能需要调整多次大小。\n\
  \n构造函数的另一个版本允许你指定负载因子（load factor）。负载因子是 0.1 到 1.0 之间的一个数字，表示哈希表在调整大小之前可以使用的最大比例。例如，如果负载因子为\
  \ 0.8，那么当哈希表填充超过 80% 时就会调整大小。\n\n```\nHashtable dict = new Hashtable();\ndict[\"\
  dessert\"] = \"Apple pie\";\nMessageBox.Show((string)dict[\"dessert\"]);\n```\n\n\
  代码与之前演示 `ListDictionary` 的代码相同，只是使用了 `Hashtable`。\n\n### HybridDictionary\n\n`HybridDictionary`\
  \ 是 `ListDictionary` 和 `Hashtable` 的折中。如果字典较小，`HybridDictionary` 使用 `ListDictionary`\
  \ 存储数据。如果字典变得太大，`HybridDictionary` 就会切换到 `Hashtable`。\n\n如果你知道只需要少数项目，请使用 `ListDictionary`。如果你知道将需要大量项目，请使用\
  \ `Hashtable`。如果你不确定会有少量还是多个项目，可以使用 `HybridDictionary` 来对冲风险。如果你增加了大量项目，从列表切换到 `Hashtable`\
  \ 将需要一些额外时间，但如果列表确实变得非常巨大，从长远来看将节省时间。\n\n### StringDictionary\n\n`StringDictionary`\
  \ 类使用哈希表来管理字符串键和值。它的方法是强类型的，要求字符串，因此它们提供了额外的类型检查，这使得发现潜在错误变得容易得多。因此，如果你在处理字符串，应该使用\
  \ `StringDictionary` 而不是通用的 `ListDictionary` 或 `Hashtable`。\n\n### SortedList\n\n\
  `SortedList` 类作为 `Hashtable` 和 `Array` 的组合。当你通过键访问值时，它充当哈希表。当你通过索引访问值时，它充当按键值排序的数组。\n\
  \n例如，假设你向名为 `jobs` 的 `SortedList` 添加了多个 `Job` 对象，并使用优先级作为键。那么 `jobs.GetByIndex(0)`\
  \ 总是返回优先级值最小的任务。\n\n以下代码展示了 SortedJobs 示例程序（该程序可在书籍网站下载）是如何演示 `SortedList` 的。\n\n\
  \n\n\n\n```cpp\n// 任务列表。\nprivate SortedList Jobs = new SortedList();\n\n// 添加一个任务。\n\
  private void addButton_Click(object sender, EventArgs e)\n{\n    Jobs.Add(priorityNumericUpDown.Value,\
  \ jobTextBox.Text);\n    ListJobs();\n}\n\n// 按优先级顺序列出任务。\nprivate void ListJobs()\n\
  {\n    jobsListBox.Items.Clear();\n    for (int i = 0; i < Jobs.Count; i++)\n  \
  \  {\n        jobsListBox.Items.Add(Jobs.GetKey(i) + \": \" + Jobs.GetByIndex(i));\n\
  \    }\n}\n```\n\n输入一个任务名称，选择一个优先级，然后点击“添加”。程序会将新任务添加到 `SortedList` 中，并调用 `ListJobs()`\
  \ 方法按排序后的顺序列出任务。\n\n`ListJobs()` 方法遍历列表中项的索引，并显示它们的键和值。\n\n`SortedList` 比 `Hashtable`\
  \ 或数组更复杂（因此速度更慢），所以您只有在需要它的特殊属性时才使用它。\n\n## CollectionsUtil\n\n通常情况下，`Hashtable`\
  \ 和 `SortedList` 是区分大小写的。`CollectionsUtil` 类提供了两个共享方法：`CreateCaseInsensitiveHashtable()`\
  \ 和 `CreateCaseInsensitiveSortedList()`，它们可以创建不区分大小写的 `Hashtable` 和 `SortedList`。\n\
  \n如果您可以使用不区分大小写的 `Hashtable` 和 `SortedList`，使用它们可能会更好，因为它们可以防止程序无意中以不同的大小写重复添加同一项。\n\
  \n## Stacks and Queues\n\n栈和队列是特殊的数据结构，在许多需要按特定顺序添加和删除项的编程应用程序中非常有用。.NET Framework\
  \ 中的 `Stack` 和 `Queue` 类实现了栈和队列。\n\n栈和队列的区别在于它们返回存储其中项的顺序。以下两个部分描述了栈和队列，并解释了它们返回项的方式。\n\
  \n### Stack（栈）\n\n栈按照后进先出（LIFO，读作 life-o）的顺序返回项。由于其 LIFO 行为，栈有时被称为 LIFO 列表或简单称为\
  \ LIFO。\n\n向栈中添加项被称为“推入”（push），从栈中移除项被称为“弹出”（pop）。这些操作之所以被称为 push 和 pop，是因为栈就像食堂或自助餐处带弹簧的盘栈。你将新盘子推到栈的顶部，盘子就会没入柜台。你弹出顶部的盘子，栈就会上升为你提供下一个盘子。图\
  \ 14-4 展示了这种栈。\n\n![c14f004.eps](img/c14f004.png)\n\n图 14-4: `Stack` 让您能够按照后进先出（LIFO）顺序移除项。\n\
  \n您也可以将栈想象成桌子上的一叠纸。您可以在顶部添加东西，也可以从顶部取走，但如果不导致整叠纸倒塌，您无法从中间或底部抽出纸。\n\n通常，您使用 `Stack`\
  \ 类的 `Push()` 和 `Pop()` 方法从栈中添加和移除项，但该类还提供了几个方法，让您通过查看（peek）顶部项而不将其移除，或者通过将 `Stack`\
  \ 转换为数组来允许“作弊”。\n\n下表描述了 `Stack` 类最有用的属性和方法。\n\n| 属性/方法 | 目的 |\n| :--- | :--- |\n\
  | `Clear` | 移除所有项。 |\n| `Contains` | 如果 `Stack` 包含特定对象则返回 `true`。 |\n| `CopyTo`\
  \ | 将 `Stack` 部分或全部对象复制到一个一维数组中。 |\n| `Count` | 返回 `Stack` 中项的数量。 |\n| `Peek` |\
  \ 返回 `Stack` 类顶部项的引用，但不从 `Stack` 中移除。 |\n| `Pop` | 返回 `Stack` 类的顶部项并从 `Stack` 中移除。\
  \ |\n| `Push` | 将项添加到 `Stack` 的顶部。 |\n| `ToArray` | 返回一个包含 `Stack` 中对象引用的一维数组。`Stack`\
  \ 类的顶部项放在数组第一个。 |\n\n`Stack` 为存储其项分配内存。如果您向一个完全满的 `Stack` 上 `Push()` 一个对象，`Stack`\
  \ 必须调整大小以腾出更多空间，这会减慢速度。\n\n与 `Hashtable` 类一样，`Stack` 类提供了重载构造函数，允许您确定初始分配多少内存。第一个构造函数不接受参数，并分配默认数量的内存。\n\
  \n第二个构造函数将 `Stack` 初始包含的项数作为参数。如果您知道将向 `Stack` 添加 10,000 个项，可以通过初始分配 10,000 个项的空间来避免很多调整调整。\n\
  \n第三版本的构造函数接受一个实现 `ICollection` 接口的对象作为参数。构造函数分配足够的空间来存放 `ICollection` 中的项，并将它们复制到\
  \ `Stack` 中。\n\n下面的短示例演示了 `Stack`。\n\n```cpp\nStack stack = new Stack();\nstack.Push(\"\
  Apple\");\nstack.Push(\"Banana\");\nConsole.WriteLine(\"Cherry\");\nConsole.WriteLine(stack.Pop());\n\
  Console.WriteLine(stack.Pop());\nConsole.WriteLine(stack.Count);\n```\n\n这段代码创建了一个\
  \ `Stack`，推入 \"Apple\" 和 \"Banana\"，打印 \"Cherry\"，然后弹出两个项。最后打印计数。注意项按后进先出（LIFO）顺序弹出。\n\
  \n### Queue（队列）\n\n队列按照先入先出（FIFO，读作 fife-o）的顺序返回项。由于其 FIFO 行为，队列有时被称为 FIFO 列表或简单称为\
  \ FIFO。\n\n队列类似于客户服务处的排队。队列中的第一个先离开它。图 14-5 形象地展示了这种想法。\n\n![c14f004.eps](img/c14f004.png)\n\
  \n图 14-5: 客户按照先入先出（FIFO）顺序离开队列。\n\n队列对于按创建顺序处理项特别有用。例如，订单处理应用程序可以将订单放在队列中，以便先放置的订单先执行。\n\
  \n历史上，向队列添加和移除项的程序被称为 `enqueue()` 和 `dequeue()`。下表描述了 `Queue` 类有用的属性和方法。\n\n| 属性/方法\
  \ | 目的 |\n| :--- | :--- |\n| `Clear` | 移除所有项。 |\n| `Contains` | 如果 `Queue` 包含特定对象则返回\
  \ `true`。 |\n| `CopyTo` | 将 `Queue` 部分或全部对象复制到一个一维数组中。 |\n| `Count` | 返回 `Queue`\
  \ 中项的数量。 |\n| `Dequeue()` | 返回并移除队列前端的项。 |\n| `Enqueue()` | 将项添加到队列的末尾。 |\n| `Peek()`\
  \ | 返回队列前端项的引用但不将其移除。 |\n| `ToArray` | 返回一个包含 `Queue` 中对象引用的一维数组。 |\n| `TrimToSize()`\
  \ | 释放 `Queue` 中的任何空空间。 |\n\n像 `Stack` 一样，`Queue` 在满时必须调整大小，这会减慢速度。同样像 `Stack` 一样，`Queue`\
  \ 重载构造函数，允许您确定初始大小。\n\n第一个构造函数不接受参数，并分配默认初始容量。如果 `Queue` 满了，它会按默认增长因子增大。\n\n第二个构造函数将\
  \ `Queue` 的初始容量作为参数。如果您知道将向 `Queue` 添加 1,000 个项，通过初始分配 1,000 个项的空间可以节省一些时间。使用此构造函数时，`Queue`\
  \ 也使用默认增长因子。\n\n\n\n\n第三个构造函数接收一个实现了 `ICollection` 接口的对象作为参数。该构造函数分配足够的空间来存放 `ICollection`\
  \ 中的项，并将它们复制到 `Queue` 中。此版本还使用了默认的增长因子。\n\n构造函数的最终版本接收一个初始容量和一个介于 1.0 到 10.0 之间的增长因子作为参数。较大的增长因子意味着\
  \ `Queue` 调整大小的频率更低，但也意味着它可能包含许多未使用的空间。\n\n下面的短示例演示了 `Queue`。\n\n```\nQueue queue\
  \ = new Queue();\nqueue.Enqueue(\"Apple\");\nqueue.Enqueue(\"Banana\");\nqueue.Enqueue(\"\
  Cherry\");\nConsole.WriteLine(queue.Dequeue());\nConsole.WriteLine(queue.Dequeue());\n\
  Console.WriteLine(queue.Dequeue());\n```\n\n这段代码创建了一个 `Queue` 并向其添加了三个字符串。然后出队列这三个值，并在控制台窗口中显示结果。下面的文本显示了结果。\n\
  \n```\nApple\nBanana\nCherry\n```\n\n注意项是按照先进先出的顺序从 `Queue` 中移除的。\n\n`UseQueue`\
  \ 示例程序允许你交互式地入队和出队项。下载示例以查看其工作原理。\n\n## 泛型集合\n\n泛型类或方法是指接受数据类型作为参数的方法。该类或方法就可以像使用任何其他类型一样使用该类型。\n\
  \n例如，`Dictionary` 类是一个泛型集合类。它接收两个类型参数，分别给出字典的键和值的类型。\n\n在 C# 中，你在类名后使用尖括号括起来来指定类的泛型参数。下面的代码声明并实例化了一个使用\
  \ `string` 作为键、`int` 作为值的 `Dictionary`。然后，它将键“Mark”的值设置为 23。最后，通过从 `Dictionary`\
  \ 中获取键“Mark”的值并将其存储在 `int` 变量中完成操作。\n\n```\nDictionary<string, int> ages = new Dictionary<string,\
  \ int>();\nages[\"Mark\"] = 23;\nint age = ages[\"Mark\"];\n```\n\n`System.Collections.Generic`\
  \ 命名空间包含了若干泛型集合类，你可以使用它们来构建强类型集合。这些集合与你在变量声明中提供的一个或多个特定数据类型一起（如前面的代码所示）。\n\n你不能直接修改泛型集合类，但可以为它添加扩展方法。例如，假设你定义了一个\
  \ `Person` 类。那么下面的代码为泛型 `List<Person>` 类创建了一个 `AddPerson` 扩展方法。该方法接收姓和名作为参数，使用这些值创建一个\
  \ `Person` 对象，将其添加到列表中，并返回新的 `Person`。\n\n```\nstatic class GenericExtensions\n\
  {\n    public static Person AddPerson(this List<Person> list,\n        string firstName,\
  \ string lastName)\n    {\n        Person person = new Person()\n            { FirstName\
  \ = firstName, LastName = lastName };\n        list.Add(person);\n        return\
  \ person;\n    }\n}\n```\n\n下面的代码显示了程序如何使用此扩展方法。\n\n```\nList<Person> people = new\
  \ List<Person>();\npeople.AddPerson(\"Rod\", \"Stephens\");\n```\n\n（有关扩展方法的更多信息，请参阅第\
  \ 6 章 中的“扩展方法”部分。）\n\n你也可以从泛型类派生类。例如，下面的代码定义了一个继承自泛型 `List<Employee>` 类的 `EmployeeList`\
  \ 类。代码添加了一个重载版本的 `Add` 方法，它接收姓和名作为参数。\n\n```sharp\npublic class EmployeeList : List<Employee>\n\
  {\n    public Employee Add(string firstName, string lastName)\n    {\n        Employee\
  \ employee = new Employee()\n            { FirstName = firstName, LastName = lastName};\n\
  \        base.Add(employee);\n        return employee;\n    }\n}\n```\n\n下面的表列出了\
  \ `System.Collections.Generic` 命名空间定义的一些最有用的集合类。\n\n| 集合 | 目的 |\n| :--- | :--- |\n\
  | `Comparer` | 比较特定类型的两个对象并返回 `–1`、`0` 或 `1`，表示第一个小于、等于或大于第二个 |\n| `Dictionary`\
  \ | 强类型字典 |\n| `LinkedList` | 强类型链表 |\n| `LinkedListNode` | 链表中的强类型节点 |\n| `List`\
  \ | 强类型列表 |\n| `Queue` | 强类型队列 |\n| `SortedDictionary` | 强类型排序字典 |\n| `SortedList`\
  \ | 强类型排序列表 |\n| `Stack` | 强类型栈 |\n\n## 集合初始化\n\n初始化器允许你轻松地向具有 `Add` 方法的集合类添加项。要初始化集合，在变量实例化后，用大括号括起你想要添加的项。\n\
  \n例如，假设你定义了一个 `Author` 类，它有一个带接受姓和名作为参数的构造函数。那么下面的代码创建并初始化了一个 `List<Author>`。\n\n\
  ```\nList<Author> authors = new List<Author>()\n{\n    new Author(\"Terry\", \"\
  Pratchett\"),\n    new Author(\"Jasper\", \"Fforde\"),\n    new Author(\"Tom\",\
  \ \"Holt\"),\n};\n```\n\n如果集合的 `Add` 方法接收多个参数，只需在每个项自己的大括号内包含相应的值即可。例如，`Dictionary`\
  \ 类的每个条目都包含一个键和一个值。下面的代码初始化了一个匹配名称与电话号码的字典。\n\n```\nDictionary<string, string> phoneNumbers\
  \ = new Dictionary<string, string>()\n{\n    {\"Arthur\", \"808-567-1543\"},\n \
  \   {\"Betty\", \"808-291-9838\"},\n    {\"Charles\", \"808-521-0129\"},\n    {\"\
  Debbie\", \"808-317-3918\"},\n};\n```\n\n相同的技术也适用于需要两个值的集合，如 `ListDictionary`、`Hashtable`、`HybridDictionary`、`StringDictionary`\
  \ 和 `SortedList`。\n\n遗憾的是，你不能使用这种方法初始化 `Stack` 和 `Queue` 类，因为这种初始化要求类具有 `Add` 方法。由于历史原因，这些类中添加新项的方法是\
  \ `Push` 和 `Enqueue`而不是 `Add`。\n\n幸运的是，这些类拥有可以 `IEnumerable` 对象作为参数的构造函数。这意味着例如，你可以向构造函数传递持有应添加到集合中的对象的数组。下面的代码使用该技术初始化了包含\
  \ `Author` 对象的 `Stack` 和 `Queue`。\n\n```\nStack<Author> authorStack = new Stack<Author>(\n\
  \    new Author[]\n    {\n        new Author(\"Terry\", \"Pratchett\"),\n      \
  \  new Author(\"Jasper\", \"Fforde\"),\n        new Author(\"Tom\", \"Holt\"),\n\
  \    }\n);\n\nQueue<Author> authorQueue = new Queue<Author>(\n    new Author[]\n\
  \    {\n        new Author(\"Terry\", \"Pratchett\"),\n        new Author(\"Jasper\"\
  , \"Fforde\"),\n        new Author(\"Tom\", \"Holt\"),\n    }\n);\n```\n\n## 迭代器\n\
  \n集合类的一个优势是你可以使用 `foreach` 循环遍历它们的项。\n\nC# 还允许你编写迭代器。迭代器是一个产生结果序列的方法。程序可以使用 `foreach`\
  \ 循环遍历迭代器产生的值。在某种意义上，迭代器类似于集合；尽管它们不需要将项存储在某种数据结构中。\n\n制作迭代器最简单的方法是创建一个返回 `IEnumerable`\
  \ 或泛型类型（如 `IEnumerable<String>`）的方法。该方法应该生成其值并使用 `yield return` 语句将它们返回给正在进行枚举的代码。\n\
  \n例如，下面的迭代器产生介于 `startNumber` 和 `stopNumber` 之间的质数列表。\n\n\n\n\n\n```cs\n// 枚举 startNumber\
  \ 和 stopNumber 之间的质数。\npublic IEnumerable Primes(int startNumber, int stopNumber)\n\
  {\n    // 定义一个测试是否为质数的 lambda 表达式。\n    Func<int, bool> isPrime = x =>\n    {\n\
  \        if (x == 1) return false;       // 1 不是质数。\n        if (x == 2) return\
  \ true;        // 2 是质数。\n        if (x % 2 == 0) return false;   // 偶数不是质数。\n \
  \       for (int i = 3; i * i <= x; i += 2)\n            if (x % i == 0) return\
  \ false;\n        return true;\n    };\n\n    for (int i = startNumber; i <= stopNumber;\
  \ i++)\n    {\n        // 如果这个数字是质数，则枚举它。\n        if (isPrime(i)) yield return\
  \ i;\n    }\n}\n```\n\n这段代码创建了一个名为 `isPrime` 的委托变量，用于存储一个 lambda 表达式在数字为质数时返回 `true`。随后，迭代器遍历\
  \ `startNumber` 和 `stopNumber` 之间的数字，对每个数字都调用 `isPrime`，并使用 `yield return` 返回质数值。\n\
  \n以下代码显示了程序如何使用迭代器显示质数。\n\n```cs\nforeach (int i in Primes(1, 100)) primesListBox.Items.Add(i);\n\
  ```\n\n这段代码遍历了调用 `Primes(1, 100)` 生成的序列。该调用触发了迭代器并使其产生 1 到 100 之间的质数序列。程序将序列中的每个值添加到\
  \ `primesListBox` 控件的项中。\n\n有关迭代器的更多信息，请参阅 `msdn.microsoft.com/library/dscyy5s0.aspx`\
  \ 中的“Iterators (C# and Visual Basic)”。\n\n## 总结\n\n本章解释了多种集合类。即使是这些类中最简单的——变量数组，也可以极其有用。数组本身没有提供很多功能，但\
  \ `Array` 类有许多有用方法，例如 `Reverse` 和 `Sort`，它们可以操作数组。\n\n`Array` 类还允许你构建具有非零下界的多维数组。其性能不如值数组，但在某些应用程序中，便利性可能比性能下降更有价值。\n\
  \n其他集合类以不同的方式存储数据。`StringCollection` 是一个简单的字符串集合。`NameValueCollection` 将字符串键与多个字符串值关联。`Dictionary`\
  \ 将键（任何类型）与每个单独的值（也是任何类型）关联。\n\n`Stack` 提供按后进先出（LIFO）顺序访问项的能力。`Queue` 提供按先入后出（FIFO）顺序访问项的能力。\n\
  \n尽管这些类在添加、删除、查找和排序对象方面具有不同的功能，但它们具有一些共同特征。例如，提供 `Add` 方法的类支持集合初始化，并且所有类都支持通过 `foreach`\
  \ 语句进行枚举。它们还支持 LINQ 使用的方法，以使查询成为可能。\n\n本章解释了如何使用 `System.Collections.Generic` 命名空间提供的泛型集合类。下一章将解释如何构建自己的泛型类。泛型允许你构建可以操作任何数据类型对象的强类型类。\n\
  \n## 练习题\n\n1. 回文是一个正读和反读都相同的字符串，忽略大小写和标点符号：例如“Taco cat”和“nurses run”。编写一个程序，指示用户输入的字符串是否为回文。（提示：不要使用循环。相反使用以下事实。）\n\
  \n    *   你可以将字符串视为 `IEnumerable<char>`。\n    *   `IEnumerable` 提供了 `Reverse` 方法。\n\
  \    *   `IEnumerable` 提供了 `ToArray` 方法。\n    *   `string` 类的构造函数有一个版本可以接受 `char[]`\
  \ 作为参数。\n    *   将其转换为小写并删除空格，但假设用户不会输入任何其他标点符号。\n\n2. 编写一个程序，使用列表字典来按作者分组存储书名。（字典的键应该是作者名。其值应该是书名列表。）使用初始化代码为至少三位作者创建数据，每个作者两本书。当用户输入或选择作者时，显示该作者的书。（提示：使用\
  \ LINQ 获取你需要的值。在 Windows Forms 应用程序中，你可以将 `ListBox` 的 `DataSource` 属性设置为数组。）\n\n\
  3. 修改你为练习题 2 编写的程序，使其使用 `NameValueCollection` 代替列表字典。（提示：你可能会发现 `string` 类的 `Split`\
  \ 方法很有用。）\n\n4. 编写一个类似于 图 14-6 所示的程序，列出汽车信息。\n\n    1. 首先，创建一个 `Car` 类，具有属性 `Name`、`Price`、`Horsepower`\
  \ 和 `SixtyTime`（从 0 运行到 60 英里所需的秒数）。创建并初始化一个 `Car` 对象的数组。（在互联网上查找数据，或者如果你愿意，就随便编一些。）重写类的\
  \ `ToString` 方法，使其返回对象的拼接值。\n    2. 在 `ListBox` 中显示汽车数据。\n    3. 在表单上放置四个标记为 Name、Price、Horsepower\
  \ 和 0–60 的 `RadioButton`。\n    4. 为了对数据排序，创建一个实现 `IComparer<Car>` 的 `CarComparer`\
  \ 类。为类提供一个类型为 `ComparisonTypes` 的 `ComparisonType` 属性，以告诉如何比较两个 `Car` 对象。\n    5.\
  \ 最后，为了将一切整合在一起，当用户点击其中一个 `RadioButton` 时，让程序创建一个 `CarComparer`，设置其 `ComparisonType`\
  \ 属性，并使用比较器对数据进行排序。然后让 `ListBox` 显示排序后的数据。\n\n\n\n\n\n请注意，本章的所有代码示例已作为本书源代码的一部分，可以在书籍网站的\
  \ [www.wrox.com/go/csharp5programmersref](http://www.wrox.com/go/csharp5programmersref)\
  \ 的“Download Code”选项卡上下载。\n\n第 11 章“OOP 概念”将类比为创建对象的蓝图或饼干模具。定义一个类后，你可以使用它来创建许多具有相似特征但细节不同的对象。\n\
  \n类似地，泛型（generic）就像是创建类的饼干模具。定义一个泛型后，你可以使用它来创建许多具有相似特征的类。\n\n例如，前一节描述的 `System.Collections.Generic`\
  \ 命名空间定义了一个泛型 `List` 类。该类允许你创建字符串列表、整数列表、`Employee` 对象列表，或几乎任何其他类型的列表。\n\n本章将解释你如何定义和使用自己的泛型类。\n\
  \n## 泛型的优势\n\n泛型类接受一个或多个数据类型作为参数。当你创建泛型类的实例时，这些参数将被填充为特定的数据类型，如 `string`、`int` 或\
  \ `Employee`。将类与特定数据类型绑定与非泛型类相比具有以下几个优势：\n\n*   **强类型**——方法可以接收并返回具有类实例类型的参数和值，而不是通用的\
  \ `object` 类型。例如，`List<string>` 只能包含 `string` 值；它的 `Add` 方法只能向列表添加 `string`；它的 `Item`\
  \ 方法返回 `string` 值。这使得无意中向列表添加 `int`、`Employee` 或其他错误类型的对象变得更加困难。\n\n*   **IntelliSense（智能提示）**——通过提供强类型，基于泛型构建的类可以让\
  \ Visual Studio 提供 IntelliSense。如果你创建了一个 `List<Employee>`，Visual Studio 知道集合中的项是\
  \ `Employee` 对象，因此它可以为你提供适当的智能 Sense 提示。\n\n*   **无装箱（No boxing）**——由于类操作的是具有特定数据类型的对象，因此你的程序不需要在项与通用的\
  \ `object` 数据类型之间进行转换。例如，如果程序在非泛型集合中存储 `TextBox` 控件，程序在添加和使用集合中的项时，必须在 `TextBox`\
  \ 控件和 `object` 类之间进行转换。避免这些步骤可以使代码更高效。\n\n*   **代码复用**——你可以使用带有多个数据类型的泛型类。例如，如果你已经构建了一个泛型\
  \ `PriorityQueue` 类，你可以创建持有 `Student`、`Applicant`、`MotorVehicle` 或 `Donor` 对象的 `PriorityQueue`。如果没有泛型，你需要构建四个单独的类来为每种类型的对象构建强类型的优先队列。复用这些代码可以使编写、测试、调试和维护代码更容易。\n\
  \n泛型的主要缺点是它们比非泛型类稍微复杂且更令人困惑。如果你确定自己只需要提供一个与单一类型协作的类，可以通过不使用泛型类来稍微简化问题。如果你认为你以后可能想为另一种数据类型复用代码，那么从开始就用泛型方式构建类会更容易。\n\
  \n## 定义泛型\n\nC# 允许你定义泛型类、结构体、接口、方法和委托。所有这些内容的语法都是相似的，因此当你知道如何创建泛型类后，创建泛型结构体、接口等就很容易。\n\
  \n要定义泛型类，像往常一样进行类声明。在类名之后，添加一个或多个用括号括起来的数据类型类型名称。这些类型名称与你为方法定义的参数名称相似，但它们是类型而不是简单的值。类代码可以使用这些名称来引用与泛型类实例关联的类型。这听起来可能很困惑，但一个示例应该会非常容易理解。\n\
  \n假设你想构建一个可以在节点中存储任何类型数据的二叉树。以下代码展示了你如何定义一个 `BinaryNode` 类来存储树的数据。类型名称 `T` 在其出现的地方已**加粗**显示。\n\
  \n```\npublic class BinaryNode<T>\n{\n    public T Value;\n    public BinaryNode<T>\
  \ LeftChild, RightChild;\n}\n```\n\n类的声明接受一个名为 `T` 的类型参数。（许多开发者使用 `T` 作为类型参数名称。如果类接受多个由逗号分隔的类型参数，它们会将每个名称都以\
  \ `T` 开头，例如 `TKey` 和 `TData`。）\n\n该类定义了一个名为 `Value` 的公有字段，其类型为 `T`。这是存储在节点中的数据。\n\
  \n该类还定义了两个字段，指向二叉树中的左节点和右节点。这些字段是引用该类类对象的引用：`BinaryNode<T>`。\n\n以下代码显示了程序如何使用该类构建一个包含\
  \ `Employee` 对象的小型二叉树。\n\n```csharp\n// 定义树的根节点。\nBinaryNode<Employee> root = new\
  \ BinaryNode<Employee>();\nroot.Value = new Employee(\"Ben\", \"Baker\");\n\n//\
  \ 创建根节点的左节点。\nroot.LeftChild = new BinaryNode<Employee>();\nroot.LeftChild.Value\
  \ = new Employee(\"Ann\", \"Archer\");\n\n// 创建根节点的右节点。\nroot.RightChild = new BinaryNode<Employee>();\n\
  root.RightChild.Value = new Employee(\"Cindy\", \"Carter\");\n```\n\n这段代码首先创建了一个新的\
  \ `BinaryNode<Employee>` 来表示树的根。它将该节点的 `Value` 属性设置为新的 `Employee` 对象。\n\n接下来，创建了根节点的左节点。`root.LeftChild`\
  \ 是一个新的 `BinaryNode<Employee>`。`root.LeftChild.Value` 设置为新的 `Employee` 对象。\n\n最后，创建了根节点的右节点。`root.RightChild`\
  \ 是一个新的 `BinaryNode<Employee>`。`root.RightChild.Value` 设置为新的 `Employee` 对象。\n\n\
  ### 泛型构造函数\n\n与任何类一样，泛型类也可以有构造函数。例如，下面的构造函数初始化了 `BinaryNode` 对象的 `LeftChild` 和 `RightChild`\
  \ 。\n\n```csharp\n// 设置此节点的值和节点。\npublic BinaryNode(T value,\n    BinaryNode<T>\
  \ leftChild = null,\n    BinaryNode<T> rightChild = null)\n{\n    Value = value;\n\
  \    LeftChild = leftChild;\n    RightChild = rightChild;\n}\n```\n\n注意这段代码如何在没有定义的情况下使用\
  \ `T`。该类型已经在类声明中定义，因此可以在类代码中使用。\n\n要使用构造函数，主程序在对象声明的类型参数之后添加了普通参数。以下代码使用新的构造函数创建一个与之前一个类似的二叉树。\n\
  \n```csharp\n// 定义子节点。\nBinaryNode<Employee> leftChild =\n    new BinaryNode<Employee>(new\
  \ Employee(\"Ann\", \"Archer\"));\nBinaryNode<Employee> rightChild =\n    new BinaryNode<Employee>(new\
  \ Employee(\"Cindy\", \"Carter\"));\n\n// 定义树的根节点。\nBinaryNode<Employee> root =\
  \ new BinaryNode<Employee>\n(\n    new Employee(\"Ben\", \"Baker\"),\n    leftChild,\n\
  \    rightChild\n);\n```\n\n这段代码使用构造函数创建了左、右子节点。它在这些构造函数调用没有传递节点，因此子节点的左和右节点被设置为\
  \ `null`。\n\n代码随后创建了根节点，这次向构造函数传递了根的左和右节点。\n\n### 多类型\n\n如果你想让类与多个类型一起工作，可以在声明中用逗号分隔并添加其他类型。例如，假设你想创建一个将键与数据项对关联的字典。示例程序\
  \ `GenericPairDictionary` 使用以下代码来定义泛型 `PairDictionary` 类。该类作为一个字典，将键值与一对数据值关联起来。类声明包含了名为\
  \ `TKey`、`TValue1` 和 `TValue2` 的三个数据类型。\n\n\n\n\n\n```\n// 一个字典，将每个键对应的一对数据值关联起来。\n\
  public class PairDictionary<TKey, TValue1, TValue2>\n{\n    // 用于存储成对数据的结构体。\n \
  \   public struct ValuePair\n    {\n        public TValue1 Value1;\n        public\
  \ TValue2 Value2;\n        public ValuePair(TValue1 value1, TValue2 value2)\n  \
  \      {\n            Value1 = value1;\n            Value2 = value2;\n        }\n\
  \    }\n\n    // 用于存储成对数据的字典。\n    private Dictionary<TKey, ValuePair> ValueDictionary\
  \ =\n        new Dictionary<TKey, ValuePair>();\n\n    // 返回数据对的数量。\n    public\
  \ int Count\n    {\n        get { return ValueDictionary.Count; }\n    }\n\n   \
  \ // 添加一个键和值值对。\n    public void Add(TKey key, TValue1 value1, TValue2 value2)\n\
  \    {\n        ValueDictionary.Add(key, new ValuePair(value1, value2));\n    }\n\
  \n    // 所有数据。\n    public void Clear()\n    {\n        ValueDictionary.Clear();\n\
  \    }\n\n    // 如果 PairDictionary 包含此键则返回 True。\n    public bool ContainsKey(TKey\
  \ key)\n    {\n        return ValueDictionary.ContainsKey(key);\n    }\n\n    //\
  \ 返回一个数据对。\n    public void GetValues(TKey key, out TValue1 value1, out TValue2\
  \ value2)\n    {\n        ValuePair pair = ValueDictionary[key];\n        value1\
  \ = pair.Value1;\n        value2 = pair.Value2;\n    }\n\n    // 设置一个数据对。\n    public\
  \ void SetValues(TKey key, TValue1 value1, TValue2 value2)\n    {\n        ValueDictionary[key]\
  \ = new ValuePair(value1, value2);\n    }\n\n    // 返回包含键的集合。\n    public Dictionary<TKey,\
  \ ValuePair>.KeyCollection Keys\n    {\n        get { return ValueDictionary.Keys;\
  \ }\n    }\n    // 删除特定条目。\n    public void Remove(TKey key)\n    {\n        ValueDictionary.Remove(key);\n\
  \    }\n}\n```\n\n`PairDictionary` 类定义了一个 `ValuePair` 类来存储成对的数据值。`ValuePair` 类有两个类型为\
  \ `TValue1` 和 `TValue2` 的公共字段。它唯一的方法是一个构造函数，使得初始化值变得更加容易。\n\n注意，`ValuePair` 类不是泛型的。它使用了\
  \ `PairDictionary` 类声明中定义的 `TValue1` 和 `TValue2` 类型，但它本身没有定义任何泛型类型。\n\n接下来，`PairDictionary`\
  \ 类声明了一个名为 `ValueDictionary` 的泛型 `Dictionary<TKey, ValuePair>` 对象。该类将其 `Count`、`Add`、`Clear`、`ContainsKey`、`GetValues`、`SetValues`、`Keys`\
  \ 和 `Remove` 方法委托给 `ValueDictionary`。\n\n以下代码创建了泛型 `PairDictionary` 类实例，使用整数作为键，字符串两个数据值。它向\
  \ `PairDictionary` 添加了三个条目，然后检索并显示了键值为 82 的条目。\n\n```\n// 创建 PairDictionary 并添加一些数据。\n\
  PairDictionary<int, string, string> dictionary =\n    new PairDictionary<int, string,\
  \ string>();\ndictionary.Add(21, \"Arthur\", \"Ash\");\ndictionary.Add(82, \"Betty\"\
  , \"Barter\");\ndictionary.Add(13, \"Charlie\", \"Carruthers\");\n\n// 显示键值 82 的值。\n\
  string value1, value2;\ndictionary.GetValues(82, out value1, out value2);\nConsole.WriteLine(value1\
  \ + \" \" + value2);\n```\n\n### 约束类型\n\n为了充分利用泛型类的优势，你应该尽可能让它们具有通用性。然而，根据类的用途，你可能需要对类的泛型类型进行约束。\n\
  \n例如，假设你想创建一个泛型的 `SortedBinaryNode` 类，它与之前描述的 `BinaryNode` 类相似，但它能保持其值是排序的。该节点的\
  \ `Add` 方法应该在树的适当位置插入新值。\n\n当你调用一个节点的 `Add` 方法时，该方法会将节点的值与新值进行比较。然后，根据新值是大于还是小于节点的值，将新值传递给它的左孩子或右子节点。\n\
  \n例如，假设节点 A 包含值 20，你向它的 `Add` 方法传递了新值 15。值 15 小于 20，因此节点 A 将新值发送到左子树。\n\n如果节点 A\
  \ 有左孩子，它将调用该子节点的 `Add` 方法将孩子添加到该子树的某处。\n\n如果节点 A 没有左孩子，它将创建一个新节点来存储值 15，并将该节点作为其新的左孩子。\n\
  \n如果节点持有 `int` 或 `string`，确定新值属于节点的左子树还是右子树是简单的，但目前没有明显的方法来确定一个 `Employee` 对象是否应该放在另一个对象之前。`SortedBinaryNode`\
  \ 类只有在其对象的数据类型允许比较时才能正常工作。\n\n确保可以比较对象的一种方法是要求项的类型实现 `IComparable` 接口。这样程序就可以使用\
  \ `CompareTo` 方法判断一个项目是大于还是小于另一个。\n\n程序使用了实现了 `IComparable` 的 `Employee` 类。它的 `CompareTo`\
  \ 方法是接口要求的，用于比较两个 `Employee` 对象的姓名并返回指示哪个在前。\n\nSortedBinaryTree 示例使用以下代码构建一个 `Employee`\
  \ 对象的排序树。\n\n```c\n\nclass SortedBinaryNode<T> where T : IComparable<T>\n{\n   \
  \ public T Value;\n    public SortedBinaryNode<T> LeftChild, RightChild;\n\n   \
  \ // 设置节点的值和孩子。\n    public SortedBinaryNode(T value, SortedBinaryNode<T> leftChild\
  \ = null, SortedBinaryNode<T> rightChild = null)\n    {\n        Value = value;\n\
  \        LeftChild = leftChild;\n        RightChild = rightChild;\n    }\n\n   \
  \ // 向此节点的子树添加新值。\n    public void Add(T newValue)\n    {\n        // 查看它属于左子树还是右子树。\n\
  \        if (newValue.CompareTo(Value) < 0)\n        {\n            // 左子树。\n  \
  \          if (LeftChild == null)\n            {\n                // 创建一个新的左孩子。\n\
  \                LeftChild = new SortedBinaryNode<T>(newValue);\n            }\n\
  \            else\n            {\n                // 将其添加到现有的左子树。\n            \
  \    LeftChild.Add(newValue);\n            }\n        }\n        else\n        {\n\
  \            // 右子树。\n            if (RightChild == null)\n            {\n     \
  \           // 创建一个新的右孩子。\n                RightChild = new SortedBinaryNode<T>(newValue);\n\
  \            }\n            else\n            {\n                // 将其添加到现有的右子树。\n\
  \                RightChild.Add(newValue);\n            }\n        }\n    }\n}\n\
  ```\n\nSortedBinaryTree 示例的主程序使用以下代码。\n\n```c\n// 创建一些 Employee。\nEmployee jody\
  \ = new Employee(\"Jody\", \"Adams\");\nEmployee wanda = new Employee(\"Wanda\"\
  , \"Cortez\");\nEmployee george = new Employee(\"George\", \"McGee\");\nEmployee\
  \ dom = new Employee(\"Dom\", \"Hall\");\nEmployee linda = new Employee(\"Linda\"\
  , \"Brock\");\n\n// 创建根节点。\nSortedBinaryNode<Employee> root = new SortedBinaryNode<Employee>(jody);\n\
  \n// 将其他 Employee 添加到树中。\nroot.Add(wanda);\nroot.Add(george);\nroot.Add(dom);\n\
  root.Add(linda);\n```\n\n\n\n\n\n图 15-1: 示例程序 `SortedBinaryTree` 构建了此 `Employee`\
  \ 对象的树。\n\n泛型类型的 `where` 子句可以包含以下元素的一个或多个。\n\n| 元素 | 含义 |\n| :--- | :--- |\n| `struct`\
  \ | 该类型必须是值类型。 |\n| `class` | 该类型必须是引用类型。 |\n| `new()` | 该类型必须有一个无参数构造函数。 |\n| «`baseclass`»\
  \ | 该类型必须继承自 `baseclass`。 |\n| «`interface`» | 该类型必须实现 `interface`。 |\n| «`typeparameter`»\
  \ | 该类型必须继承自 `typeparameter`。 |\n\n例如，以下代码定义了 `StrangeGeneric` 类。该类接受三个类型参数。类型 `T1`\
  \ 必须实现 `IComparable<T1>` 接口并且提供无参数构造函数。类型 `T3` 必须继承自 `Control` 类。类型 `T2` 必须继承自类型\
  \ `T3`。\n\n```csharp\npublic class StrangeGeneric<T1, T2, T3>\n    where T1 : IComparable<T1>,\
  \ new()\n    where T3 : Control\n    where T2 : T3\n{\n\n}\n```\n\n以下代码创建了 `StrangeGeneric`\
  \ 类的实例。\n\n```csharp\nStrangeGeneric<int, Panel, ScrollableControl> strange =\n\
  \    new StrangeGeneric<int, Panel, ScrollableControl>();\n```\n\n`int` 类实现了 `IComparable<int>`\
  \ 并有一个无参数构造函数。`ScrollableControl` 继承自 `Control`，而 `Panel` 继承自 `ScrollableControl`。`Panel`\
  \ 类的完整继承层次结构如下：\n\n```\nSystem.Object \n  System.MarshalByRefObject\n    System.ComponentModel.Component\n\
  \      System.Windows.Forms.Control\n        System.Windows.Forms.ScrollableControl\n\
  \          System.Windows.Forms.Panel\n```\n\n对类型约束为 C# 提供了更多关于该类型的信息，因此允许你使用任何已知的属性和方法。例如，在之前的代码中，`StrangeGeneric`\
  \ 类知道类型 `T3` 继承自 `Control` 类，因此你可以安全地使用 `Control` 的属性和方法，如 `Anchor`、`BackColor`\
  \ 和 `Font`。\n\n### 默认值\n\n`new()` 约束要求泛型类型提供无参数构造函数，以便类代码创建该类型的新实例。例如，如果类型名称为 `T`，类可以执行以下语句。\n\
  \n```csharp\nT newValue = new T();\n```\n\n除了创建类型 `T` 的实例外，将类型为 `T` 的变量设置为默认值可能有用。遗憾的是，在确定类型之前，你无法知道类型的默认值是什么。例如，`int`\
  \ 的默认值为 0，`struct` 的默认值是一个未初始化的结构，而 `string` 或其他引用类型的默认值为 `null`。\n\n幸运的是，C# 提供了\
  \ `default` 关键字，让泛型类分配默认值。以下语句创建了一个类型为 `T` 的新变量，并将其设置为该类型的默认值。\n\n```csharp\nT newValue\
  \ = default(T);\n```\n\n### 实例化泛型类\n\n之前的章节已经展示了如何实例化泛型类的示例。程序声明该类，并在括号内包含所需的任何数据类型。以下代码展示了程序如何创建一个字符串的泛型列表。\n\
  \n```csharp\nList<string> names = new List<string>();\n```\n\n向泛型类的构造函数传递普通参数，只需将它们添加到括号后的括号内即可。\n\
  \n### 泛型集合类\n\n`System.Collections.Generic` 命名空间定义了多个泛型类。这些基本上是使用泛型来处理特定数据类型的集合类。更多信息请参阅第\
  \ 14 章 中的“集合类”部分以及更多有用的预定义泛型集合类列表。\n\n### 泛型方法\n\n泛型通常用于构建非特定数据类型的类，例如泛型集合类。你也可以给类（泛型或其他类型）提供泛型方法。正如泛型类不绑定到特定的数据类型一样，泛型方法的参数也没有绑定到特定的数据类型。\n\
  \n要创建一个泛型方法，请包含与你用于泛型类时类似的类型参数。\n\n示例程序 `Switcher` 使用以下代码定义了一个泛型 `Switch` 方法。\n\n\
  ```csharp\npublic static class Switcher\n{\n    // 交换两个值。\n    public static void\
  \ Switch<T>(ref T value1, ref T value2)\n    {\n        T temp = value1;\n     \
  \   value1 = value2;\n        value2 = temp;\n    }\n}\n```\n\n`Switch` 方法接收一个泛型类型\
  \ `T`。它还接受两个类型为 `T` 的参数。它创建了一个类型为 `T` 的临时变量并用它交换两个值。\n\n以下代码展示了主程序如何使用 `Switch`\
  \ 方法。\n\n```csharp\nstring value1 = value1TextBox.Text;\nstring value2 = value2TextBox.Text;\n\
  Switcher.Switch<string>(ref value1, ref value2);\nvalue1TextBox.Text = value1;\n\
  value2TextBox.Text = value2;\n```\n\n此代码从 `TextBox` 获取两个 `string` 值。它使用 `Switch`\
  \ 方法交换它们的值并显示结果。\n\n注意，`Switcher` 类不是泛型的，但它包含一个泛型方法。\n\n### 泛型与扩展方法\n\n扩展方法允许你为现有类添加新功能，无论这些类是泛型的还是非泛型的。例如，假设你有一个使用\
  \ `List<Student>` 的应用程序。该类是 `System.Collections.Generic` 命名空间中的泛型集合类。它在你的代码中定义，但你可以为其添加扩展方法。\n\
  \n以下代码为 `List<Student>` 添加了 `AddStudent` 方法，该方法接受姓名作为参数，创建一个 `Student` 对象并将其添加到列表中。\n\
  \n```csharp\npublic static class ListExtensions\n{\n    public static void AddStudent(this\
  \ List<Student> students,\n        string firstName,string lastName)\n    {\n  \
  \      students.Add(new Student()\n            { FirstName = firstName, LastName\
  \ = lastName });\n    }\n}\n```\n\n此示例专门适用于 `Student` 类型。它依赖于。\n\n有时，你可以创建一个适用于更通用类的泛型扩展方法。例如，以下代码为泛型\
  \ `List<T>` 类添加了泛型 `NumDistinct` 方法。\n\n```csharp\npublic static int NumDistinct<T>(this\
  \ List<T> list)\n{\n    return list.Distinct().Count();\n}\n```\n\n该方法不需要知道列表包含什么。它调用列表的\
  \ `Distinct` 方法，对结果调用 `Count` 方法并返回 `Count` 给出的值。\n\n更多关于扩展方法的信息，请参阅第 6 章 中的“扩展方法”部分。\n\
  \n## 总结\n\n类是一种抽象，定义了类实例应该提供的属性、方法和事件。在定义类之后，你可以创建该类的任意实例，它们都将具有类定义的特征。\n\n泛型将抽象又提升了一层。泛型类抽象了一组类的特征。当你定义了一个泛型类后，你可以创建许多具有相似行为但可能处理不同数据类型的对象。同样，你可以创建可以处理多种数据类型的泛型结构、接口、方法和委托。\n\
  \n泛型允许你在处理不同数据类型时重复使用相同的代码。它们提供了强类型检查，允许你避免装箱和拆箱。它们还让 Visual Studio 提供 IntelliSense\
  \ 支持，使编写代码变得更容易更快速。\n\n\n\n\n到目前为止的章节主要关注相对独立的程序。这些程序生成自己的数据或从用户获取输入，执行某些计算，并在程序的用户界面或控制台（Console）窗口中显示结果。\n\
  \n本书的下一部分描述了程序可以用来与外部系统交互的技巧。它们解释了如何打印文档、保存当程序未运行时仍然持续的设置、处理文件和目录以及与网络进行交互。下一章将开始新的关注重点，解释如何在打印机上生成输出。\n\
  \n## 练习题\n\n1. 创建一个泛型 `PriorityQueue` 类，将键（keys）与对象关联起来。它的 `Dequeue` 方法应该返回键值最小的键/对象对，并从队列中移除该值。编写一个使用\
  \ `PriorityQueue<int, string>` 的程序。（提示：使用 `List<KeyValuePair>` 来存储项。让 `Dequeue`\
  \ 方法遍历列表以找到最小的键值。）\n\n2. 创建一个泛型 `IncreasingQueue` 类，它将对象存储在队列中，并要求每个对象都大于队列中的上一个对象。让该类的构造函数接收所有条目的下界作为参数。（换句话说，所有条目必须大于下界，并按递增顺序添加。）编写一个演示\
  \ `IncreasingQueue<float>` 的测试程序。\n\n3. 编写一个泛型 `BoundValues` 方法，它接收数组作为参数并确保其所有值都在下限和上限之间。例如，如果\
  \ `prices` 是一个 `decimal` 数组，那么 `BoundValues(prices, 0, 1000)` 将把数组中任何小于 0 的值设为 0，将任何大于\
  \ 1000 的值设为 1000。\n\n4. 重复练习题 3，但这次让 `BoundValues` 方法处理 `IEnumerable` 而不是数组，并返回一个\
  \ `List`。\n\n5. 编写一个泛型 `MiddleValue` 方法，接收三个值作为参数并返回中间的那个。\n\n6. 创建一个 `CircularQueue`\
  \ 类。`Enqueue` 方法将项添加到队列末尾。`NextItem` 方法返回队列中的下一个项。如果对象到达队列末尾，它将从头开始。例如，如果队列包含值 A、B\
  \ 和 C，反复调用 `NextItem` 将反复返回 A、B、C、A、B、C、A、B、C 等等类推。（提示：使用 `List` 来持有队列的值。）\n\n7.\
  \ 创建一个 `Bundle` 类，它使用 `List` 来持有项。创建一个 `Add` 方法，以便程序可以将项添加到 `Bundle` 中。重写它的 `ToString`\
  \ 方法以返回一个包含由分号隔开的 bundle 中项的字符串。例如，如果 bundle 包含值“hello”和 13，`ToString` 方法应该返回 `hello;13`。\n\
  \n8. 你为练习题 7 构建的 `Bundle` 类可以将方法委托给它包含的 `List` 对象。你至少需要给它提供一个 `Add` 方法，以便程序可以将项放入\
  \ `Bundle` 中。遗憾的是，`List<T>` 类支持超过 80 多个你可以委托的属性和方法。委托所有这些方法将是一项巨大的工作。\n\n幸运的是，有一个更简单的解决方案：让\
  \ `Bundle<T>` 继承自 `List<T>`。使用这种技术重复练习题 7。\n\n# 第四部分：与环境交互\n\n* 第 16 章: 打印\n* 第\
