  \n4. 构建一个程序，实现你在练习 3 中设计的层次结构。对于像 `Pets` 和 `Classes` 等具有不明显数据类型的属性，使用 `string` 作为占位符。（如果你不确定如何构建这些类，请阅读下一章然后返回此练习。）\n\
