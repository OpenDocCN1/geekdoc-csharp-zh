  \ 对象（正如你为练习 2 编写的程序一样）。\n\n\n\n类的类型提供了属性和方法，这些内容提供了关于该类的丰富信息。你可以通过 `typeof(TheClass)`\
  \ 或通过在类的实例上调用 `GetType` 方法来获取类的类型。\n\n`System.Type` 类提供了许多属性和方法，用于提供有关类型的信息。其中大多数内容都是相当通俗易懂的。一个可能并不显而易见的细节是，其中某些属性和方法返回的是描述你想要的信息的对象，而不是该本身本身。它们之所以这样做是因为这些项目中的许多比你起初认为的要复杂得多。\n\
  \n例如，假设 `MusicalInstrument` 类定义在某个 DLL 中。你可以使用反射来确定定义类的模块（module）。你可能简单地将模块认为包含该类的\
  \ DLL 名称，但 `Type` 类的 `Module` 属性返回的是一个 `Module` 对象，该对象包含了关于模块的大量信息，包括它的名称、程序集（它也是一个包含大量信息的对象）、自定义特性、全限定名、全局字段和类型（包括类、枚举、委托类型以及在模块中定义的任何类型）。\n\
  \n一些更有实用的信息类包括顾名其实义的 `FieldInfo`、`PropertyInfo`、`ConstructorInfo`、`MethodInfo` 和\
  \ `EventInfo` 类。某些反射方法返回的另外两个类是 `MethodBase`（`MemberInfo` 和 `ConstructorInfo` 的父类）和\
  \ `MemberInfo`（`FieldInfo`、`PropertyInfo`、`MethodBase` 和 `EventInfo` 的父类）。\n\n`CustomerClassInformation`\
  \ 程序可以在本书的网站下载，它演示了许多实用的反射属性和方法，用于显示 `Customer` 类的信息。该类继承自 `Person` 类，并包含 `Order`\
  \ 对象的列表。下面的代码显示了 `Person`、`Customer` 和 `Order` 类。\n\n```\npublic class Person\n\
  {\n    public string FirstName, LastName;\n}\n\npublic sealed class Customer : Person\n\
  {\n    public struct Address\n    {\n        public string Street, City, State,\
  \ Zip;\n    }\n\n    public string EmailAddress { get; set; }\n    public Address\
  \ MailingAddress { get; set; }\n    public List<Order> Orders = new List<Order>();\n\
  \n    public Customer() { }\n    public Customer(string firstName, string lastName,\
  \ params Order[] orders)\n    {\n        FirstName = firstName;\n        LastName\
  \ = lastName;\n        foreach (Order order in orders) Orders.Add(order);\n    }\n\
  \n    public delegate void PaymentReceivedDelegate(decimal amount);\n    public\
  \ event PaymentReceivedDelegate PaymentReceived;\n\n    public void SendEmail(string\
  \ message) { }\n}\n\npublic class Order\n{\n}\n```\n\n`Person` 类几乎是空的。它的存在仅仅是为了\
  \ `Customer` 类的父类。\n\n`Customer` 类包含嵌套的 `Address` 结构体、属性（`EmailAddress` 和 `MailingAddress`）、字段（`Orders`\
  \ 以及继承的 `FirstName` 和 `LastName` 字段）、两个构造函数、一个委托类型、一个事件以及 `SendEmail` 方法。\n\n`Order`\
  \ 类是空的。它的存在是为了让 `Customer` 类包含一个 `List<Order>`。\n\n程序使用以下代码显示关于 `Customer` 类的信息。\n\
  \n```\n// Display information about the Customer class.\nprivate void Form1_Load(object\
  \ sender, EventArgs e)\n{\n    Type type = typeof(Customer);\n    AddItem(\"Name:\
  \ \", type.Name);\n    AddItem(\"Assembly: \", type.Assembly.FullName);\n    AddItem(\"\
  Attributes: \", type.Attributes.ToString());\n    AddItem(\"BaseType: \", type.BaseType.Name);\n\
  \    AddItem(\"FullName: \", type.FullName);\n    AddItem(\"IsAbstract: \", type.IsAbstract.ToString());\n\
  \    AddItem(\"IsAutoLayout: \", type.IsAutoLayout.ToString());\n    AddItem(\"\
  IsClass: \", type.IsClass.ToString());\n    AddItem(\"IsNested: \", type.IsNested.ToString());\n\
  \    AddItem(\"IsNotPublic: \", type.IsNotPublic.ToString());\n    AddItem(\"IsPrimitive:\
  \ \", type.IsPrimitive.ToString());\n    AddItem(\"IsPublic: \", type.IsPublic.ToString());\n\
  \    AddItem(\"IsSealed: \", type.IsSealed.ToString());\n    AddItem(\"IsSerializable:\
  \ \", type.IsSerializable.ToString());\n    AddItem(\"IsSubclassOf(Person): \",\n\
  \        type.IsSubclassOf(typeof(Person)).ToString());\n    AddItem(\"IsValueType:\
  \ \", type.IsValueType.ToString());\n    AddItem(\"IsVisible: \", type.IsVisible.ToString());\n\
  \    AddItem(\"Module: \", type.Module.Name);\n    AddItem(\"Namespace: \", type.Namespace);\n\
  \n    AddItem(\"NestedTypes:\", \"\");\n    foreach (Type nestedType in type.GetNestedTypes())\n\
  \    {\n        AddItem(\"    \", nestedType.ToString());\n    }\n\n    AddItem(\"\
  Fields:\", \"\");\n    foreach (FieldInfo info in type.GetFields())\n    {\n   \
  \     AddItem(\"    \", info.ToString());\n    }\n    AddItem(\"Properties:\", \"\
  \");\n    foreach (PropertyInfo info in type.GetProperties())\n    {\n        AddItem(\"\
  \    \", info.ToString());\n    }\n\n    AddItem(\"Constructors:\", \"\");\n   \
  \ foreach (ConstructorInfo info in type.GetConstructors())\n    {\n        AddItem(\"\
  \    \", info.ToString());\n    }\n    AddItem(\"Methods:\", \"\");\n    foreach\
  \ (MethodInfo method in type.GetMethods())\n    {\n        AddItem(\"    \", method.Name);\n\
  \    }\n\n    AddItem(\"Events:\", \"\");\n    foreach (EventInfo info in type.GetEvents())\n\
  \    {\n        AddItem(\"    \", info.ToString());\n    }\n\n    // Size the ListView.\n\
  \    infoListView.Columns[0].Width = -1;\n    infoListView.Columns[1].Width = -1;\n\
  }\n```\n\n程序首先获取代表 `Customer` 类的对象。然后它调用该对象的系列属性来显示关于 `Customer` 类的信息。它使用 `AddItem`\
  \ 方法（稍后描述）将值显示在程序的 `ListView` 控件中。\n\n```c\n// Add an item and value to the ListView.\n\
  private void AddItem(string item, string value)\n{\n    ListViewItem newItem = infoListView.Items.Add(item);\n\
  \    newItem.SubItems.Add(value);\n}\n```\n\n此方法简单地向程序的 `ListView` 控件添加一个新的项目和子项。图\
  \ 26-1 显示了 CustomerClassInformation 程序向下滚动到显示 `Customer` 类的属性、构造函数和方法的部分。此示例仅列出了名称。\n\
  \n## 获取和设置属性\n\nCustomerClassInformation 程序只是列出它找到的字段、属性、方法和其他复杂项目的名称。然而，程序可以使用这些项目做更多事情。例如，它可以使用\
  \ `PropertyInfo` 对象来获取或设置其属性的值，或者可以使用 `MethodInfo` 对象来调用其方法。\n\n`GetSetPersonProperties`\
  \ 程序如图 26-2 中所示并在本书的网站下载，它使用反射来获取和设置 `Person` 类的字段和属性。程序使用以下简单的 `Person` 类。\n\n\
  ```csharp\npublic class Person\n{\n    public string FirstName { get; set; }\n \
  \   public string LastName { get; set; }\n    public string Street, City, State,\
  \ Zip;\n}\n```\n\n\n\n\n程序的大部分代码负责创建用于显示属性和字段值的 `Label` 和 `TextBox`。以下代码展示了程序如何获取值。为了节省空间，我删除了创建\
  \ `Label` 和 `TextBox` 的代码。请下载示例以查看所有细节。\n\n```csharp\n// Person 对象。\nprivate Person\
  \ ThePerson = new Person()\n{\n    FirstName = \"Rufus\",\n    LastName = \"Firefly\"\
  ,\n    Street = \"1933 Duck Soup Pl\",\n    City = \"Hollywood\",\n    State = \"\
  CA\",\n    Zip = \"90027\"\n};\n\n// 我们创建的 Labels 和 TextBoxes。\nprivate List<Label>\
  \ Labels;\nprivate List<TextBox> TextBoxes;\n\n// 显示对象的字段和属性。\nprivate void getValuesButton_Click(object\
  \ sender, EventArgs e)\n{\n    // 列出字段和属性。\n    foreach (MemberInfo info in ThePerson.GetType().FindMembers(\n\
  \        MemberTypes.Field | MemberTypes.Property,\n        BindingFlags.Public\
  \ | BindingFlags.Instance,\n        new MemberFilter((x, y) => true),\n        null))\n\
  \    {\n        // 创建 Label 和 TextBox。\n        ...\n        Labels.Add(label);\n\
  \        ...\n        textBox.Tag = info;\n        TextBoxes.Add(textBox);\n   \
  \     ...\n\n        // 获取值。\n        if (info is FieldInfo)\n        {\n      \
  \      FieldInfo fieldInfo = info as FieldInfo;\n            textBox.Text = fieldInfo.GetValue(ThePerson).ToString();\n\
  \            label.BackColor = Color.LightGray;\n        }\n        else if (info\
  \ is PropertyInfo)\n        {\n            PropertyInfo propertyInfo = info as PropertyInfo;\n\
  \            textBox.Text = propertyInfo.GetValue(ThePerson).ToString();\n     \
  \       label.BackColor = Color.White;\n        }\n    }\n\n    setValuesButton.Enabled\
  \ = true;\n}\n```\n\n代码首先开始创建一个 `Person` 对象，并声明用于持有 `Label` 和 `TextBox` 的列表。\n\n\
  当你点击“Get Values”按钮时，程序使用 `ThePerson.GetType().FindMembers` 来获取关于 `Person` 类字段和属性的信息。该方法接受四个参数，在示例中，这些参数具有以下值：\n\
  \n*   `MemberTypes.Field | MemberTypes.Property`——这告诉方法选择关于字段和属性的信息。\n*   `BindingFlags.Public\
  \ | BindingFlags.Instance`——这使方法返回关于 `public` 实例成员的信息（与 `private` 或 `static` 成员相比）。\n\
  *   `new MemberFilter((x, y) => true)`——此参数是一个 `MemberFilter` 委托，它检查由 `FindMembers`\
  \ 发现的对象并返回 `true` 以选择你想要的对象。它接受的参数是一个 `MemberInfo` 对象和一个可以设置以给方法提供额外信息的对象。此示例使用\
  \ lambda 表达式，它对任何输入都返回 `true`，因此会选择每个字段和属性。\n*   `null`——这是传递给第三参数方法的额外值。在示例中，此值意味着\
  \ lambda 表达式接收 `null` 作为其第二个参数。\n\n程序遍历 `FindMembers` 调用返回的 `MemberInfo` 对象。对于每个项目，它都会创建一个\
  \ `Label` 和 `TextBox`。它将新控件存储在 `Labels` 和 `TextBoxes` 列表中。它还将 `MemberInfo` 对象存储在\
  \ `TextBox` 的 `Tag` 属性中以备后用。\n\n接下来，代码在 `TextBox` 中显示成员的值。它还会更改 `Label` 的背景颜色，以指示该成员是字段（较深）还是属性（较浅）。\n\
  \n在程序显示值之后，你可以通过在 `TextBox` 中输入字来修改它们。如果你随后点击“Set Values”按钮，将执行以下代码。\n\n```csharp\n\
  // 设置值。\nprivate void setValuesButton_Click(object sender, EventArgs e)\n{\n   \
  \ 删除 删除所有 Labels。\n    foreach (Label label in Labels) label.Parent = null;\n\n\
  \    // 保存 TextBox 的值。\n    foreach (TextBox textBox in TextBoxes)\n    {\n    \
  \    // 检查此 TextBox 是否代表字段或属性。\n        MemberInfo info = textBox.Tag as MemberInfo;\n\
  \        if (info is FieldInfo)\n        {\n            // 保存字段的值。\n           \
  \ FieldInfo fieldInfo = info as FieldInfo;\n            fieldInfo.SetValue(ThePerson,\
  \ textBox.Text);\n        }\n        else\n        {\n            // 保存属性的值。\n \
  \           PropertyInfo propertyInfo = info as PropertyInfo;\n            propertyInfo.SetValue(ThePerson,\
  \ textBox.Text);\n        }\n\n        //  TextBox。\n        textBox.Parent = null;\n\
  \    }\n\n    setValuesButton.Enabled = false;\n}\n```\n\n此代码首先遍历它创建的 `Label` 并将它们从表单中移除。然后它遍历\
  \ `TextBox` 并获取每个 `TextBox` 的 `MemberInfo` 对象。它将该对象转换为适当的子类 `FieldInfo` 或 `PropertyInfo`，并使用该对象的\
  \ `SetValue` 方法更新成员的值。然后代码从表单中移除 `TextBox`。\n\n## 获取程序集信息\n\n程序集（Assembly）是 Visual\
  \ Studio 中部署和版本控制的基本单元。程序集可以包含可执行应用程序、`动态链接库 (DLL)` 或控件库。通常，一个项目包含在一个程序集中。\n\n程序集信息对话框允许你设置程序集信息。对话框中的大多数项目（例如应用程序的标题和描述）都是自言自明的。它们只是程序集携带用于标识的字符串。程序集和文件版本被\
  \ Visual Studio 用于验证应用程序组件之间的兼容性。包括公司名称、版权、商标、产品名称、标题和版本（包括主版本、次版本、修订版本和生成版本）。GUID（代表全局唯一标识符，读音与“squid”押韵）唯一标识程序集并由\
  \ Visual Studio 生成。Make Assembly-Visible 复选框允许你决定程序集是否应让程序集中定义的类型对 COM 可见。有关此对话框的更多信息，请参见\
  \ `msdn.microsoft.com/1h52t681.aspx`。\n\n对话框中的大多数项目……与程序集相关。\n\n不幸的是，在运行时学习这些值并不容易。要获取大多数这些值，你需要遵循以下步骤：\n\
  \n1.  使用 `Assembly.GetExecutingAssembly` 获取一个代表当前运行程序集的 `Assembly` 对象。\n2.  调用 `Assembly`\
  \ 对象的 `GetCustomAttributes` 方法，并将程序集属性类型（如 `AssemblyTitleAttribute`）作为参数传递。`GetCustomAttributes`\
  \ 方法返回请求类型的属性对象数组。\n3.  使用返回属性的适当属性。例如，使用 `AssemblyTitleAttribute` 对象的 `Title` 属性。\n\
  \n不幸的是，某些属性对象可能并不总是定义的，因此你的代码必须注意 `null` 对象引用。\n\n一个 C# 程序使用不同的方法来获取程序集版本信息。要获取该信息，程序调用\
  \ `Assembly` 对象的 `GetName` 方法，然后使用返回对象的 `Version` 属性。\n\nShowAssemblyInformation\
  \ 示例程序使用以下 `GetAssemblyAttribute` 方法使获取程序集属性更容易。\n\n```csharp\n// 返回特定的程序集属性值。\n\
  public static T GetAssemblyAttribute<T>(Assembly assembly) where T : Attribute\n\
  {\n    // 获取此类型的属性。\n    object[] attributes = assembly.GetCustomAttributes(typeof(T),\
  \ true);\n\n    // 如果没有获取到任何，返回 null。\n    if ((attributes == null) || (attributes.Length\
  \ == 0)) return null;\n\n    // 将第一个属性值转换为所需的类型并返回它。\n    return (T)attributes[0];\n\
  }\n```\n\n\n\n该方法接受一个类型作为泛型参数。该类型应该是你想要检索的属性类型。该方法还接收你想要使用的程序集作为参数。\n\n该代码调用了 `Assembly`\
  \ 对象的 `GetCustomAttributes` 方法来获取一个包含程序集属性对象的数组，这些对象具有正确的类型。如果结果为 `null` 或空数组，则该方法返回\
  \ `null`。\n\n如果代码获取到一个非空数组，它将其中的第一个元素转换为所需的属性类型并返回它。\n\n以下代码显示了 `ShowAssemblyInformation`\
  \ 程序如何使用 `GetAssemblyAttribute` 方法显示属性信息。\n\n```csharp\nprivate void Form1_Load(object\
  \ sender, EventArgs e)\n{\n    // 获取正在运行的程序集。\n    Assembly assembly = Assembly.GetExecutingAssembly();\n\
  \n    // 从程序集中获取值。\n    AssemblyTitleAttribute titleAttr =\n        GetAssemblyAttribute<AssemblyTitleAttribute>(assembly);\n\
  \    if (titleAttr != null) titleTextBox.Text = titleAttr.Title;\n\n    AssemblyDescriptionAttribute\
  \ descrAttr =\n        GetAssemblyAttribute<AssemblyDescriptionAttribute>(assembly);\n\
  \    if (descrAttr != null) descriptionTextBox.Text = descrAttr.Description;\n\n\
  \    ... Code omitted ...\n\n    assemblyVersionTextBox.Text = assembly.GetName().Version.ToString();\n\
  \n    ... Code omitted ...\n}\n```\n\n代码使用 `Assembly.GetExecutingAssembly` 获取一个表示正在执行的程序集的对象。然后，它使用\
  \ `GetAssemblyAttribute` 方法获取表示程序集属性的属性对象。在检查每个结果不为 `null` 后，代码显示了属性值。\n\n唯一的异常是程序集版本信息。要获取该值，代码只需地调用\
  \ `assembly.GetName().Version.ToString()`。\n\n## 调用方法\n\n反射提供了允许你加载和检查程序集的对象。在加载程序集后，你就可以深入研究它定义的类型，并使用由这些类型定义的属性、方法和其他特性。\n\
  \n本节描述了 `InvokeEchoer` 示例程序，该程序可以在本书的网站上下载。该示例演示了处理在运行时加载的程序集时的几项重要技术。\n\n`InvokeEchoer`\
  \ 程序执行的任务包括：\n\n* 在运行时加载程序集。\n* 获取有关程序集定义的 `Echoer` 类的信息。\n* 创建 `Echoer` 类的实例。\n\
  * 为实例设置字段值。\n* 调用对象的 `ShowMessage` 方法。\n\n`EchoDll` 示例也可以在本书的网站上下载，它创建一个 `InvokeEchoer`\
  \ 程序可以加载的控件库（DLL）。（`EchoDll` 示例必须编译后 `InvokeEchoer` 示例才能正常工作。）它使用以下代码定义 `Echoer`\
  \ 类。\n\n```csharp\npublic class Echoer\n{\n    // 对象的 own。\n    public string Message\
  \ = \"Message not set\";\n\n    // 在消息框中显示消息。\n    public void ShowMessage(string\
  \ caption)\n    {\n        MessageBox.Show(Message, caption);\n    }\n}\n```\n\n\
  该类具有一个名为 `Message` 的公共 `string` 字段和一个名为 `ShowMessage` 的公共方法。\n\n以下代码显示了 `InvokeEchoer`\
  \ 程序如何加载和使用 `EchoDll` 库。\n\n```csharp\n// 加载 DLL，创建 Echoer，并调用 ShowMessage 方法。\n\
  private void invokeButton_Click(object sender, EventArgs e)\n{\n    // 加载 DLL 程序集。\n\
  \    Assembly dll = Assembly.LoadFile(dllTextBox.Text);\n\n    // 找到 Echoer 类的 Type。\n\
  \    Type echoer = dll.GetType(\"EchoDll.Echoer\");\n\n    // 创建 Echoer 对象。\n  \
  \  object myEchoer = Activator.CreateInstance(echoer);\n\n    // 设置 Message 字段。\n\
  \    FieldInfo fieldInfo = echoer.GetField(\"Message\");\n    fieldInfo.SetValue(myEchoer,\
  \ messageTextBox.Text);\n\n    // 获取 ShowMessage 方法的 MethodInfo。\n    MethodInfo\
  \ methodInfo = echoer.GetMethod(\"ShowMessage\");\n\n    // 在对象上调用方法。\n    object[]\
  \ args = { captionTextBox.Text };\n    methodInfo.Invoke(myEchoer, args);\n}\n```\n\
  \n程序首先使用 `Assembly.LoadFile` 方法加载 `EchoDll` 程序集。\n\n然后，它使用 `Assembly` 的 `GetType`\
  \ 方法获取一个表示 `Echoer` 类类型的 `Type` 对象。\n\n接接，代码使用 `System.Activator` 类创建 `Echoer` 类型的实例。如果你向\
  \ `Activator` 类的 `CreateInstance` 方法传递额外参数，它将调用与参数最匹配的类构造函数。在这个示例中，`Echoer` 类没有构造函数，因此代码没有向\
  \ `CreateInstance` 方法传递任何额外参数。\n\n程序随后设置 `Echoer` 对象的 `Message` 字段的值。它使用 `Echoer`\
  \ 类型的 `GetField` 方法获取表示该字段的 `FieldInfo` 对象。然后使用 `FieldInfo` 对象的 `SetValue` 方法为 `Echoer`\
  \ 实例设置字段值。\n\n程序必须执行的最后一个任务是调用 `Echoer` 对象的 `ShowMessage` 方法。为了实现这一点，它调用 `Echoer`\
  \ 类型的 `GetMethod` 方法获取表示 `ShowMessage` 方法的 `MethodInfo` 对象。它创建了一个对象数组来存放传递给 `ShowMessage`\
  \ 的参数。最后，它调用 `MethodInfo` 对象的 `Invoke` 方法，传递 `Echoer` 实例和参数数组。\n\n## 运行脚本\n\n反射允许程序了解现有代码。`System.CodeDom.Compiler`\
  \ 命名空间中的类允许程序在运行时编译新代码。可以使用反射来执行新编译的代码。\n\n要编译代码，程序创建了一个代码提供程序。它设置提供程序所需的任何参数，并添加了脚本使用的任何程序集的引用。然后，它调用提供程序的\
  \ `CompileAssemblyFromSource` 方法来编译脚本。如果编译成功，程序可以使用反射来使用脚本定义的方法。\n\nTurtleScript\
  \ 示例程序如图 26-4 所示并可在本书网站上下载，它允许用户编写控制绘图龟的脚本，该龟与第 3 章“程序和代码文件结构”中描述的类似。\n\n**图 26-4:**](#c26.xhtml_figureanchor26-4)\
  \ TurtleScript 示例程序编译并执行运行时输入的代码。\n\n\n\n\n\n```cs\n// Run the script.\nprivate\
  \ void RunScript()\n{\n    // Make a C# code provider.\n    CodeDomProvider codeProvider\
  \ = CodeDomProvider.CreateProvider(\"C#\");\n    // Generate a non-executable assembly\
  \ in memory.\n    CompilerParameters parameters = new CompilerParameters();\n  \
  \  parameters.GenerateInMemory = true;\n    parameters.GenerateExecutable = false;\n\
  \n    // Add references to the assemblies used by the program.\n    var query =\n\
  \        from Assembly assembly in AppDomain.CurrentDomain.GetAssemblies()\n   \
  \     where !assembly.IsDynamic\n        select assembly.Location;\n    parameters.ReferencedAssemblies.AddRange(query.ToArray());\n\
  \n    // Compile the code.\n    CompilerResults results =\n        codeProvider.CompileAssemblyFromSource(parameters,\
  \ scriptTextBox.Text);\n\n    // See if there are errors.\n    if (results.Errors.Count\
  \ > 0)\n    {\n        string errors = \"\";\n        foreach (CompilerError error\
  \ in results.Errors)\n        {\n            errors +=\n                \"Error:\\\
  r\\n\" +\n                \"    Line: \" + error.Line + \"\\r\\n\" +\n         \
  \       \"    Error Number: \" + error.ErrorNumber + \"\\r\\n\" +\n            \
  \    \"    Text: \" + error.ErrorText + \"\\r\\n\";\n        }\n        throw new\
  \ ApplicationException(errors);\n    }\n\n    // Get the Scripter class.\n    Type\
  \ scripterType = results.CompiledAssembly.GetType(\"Scripter\");\n    if (scripterType\
  \ == null)\n        throw new MissingMethodException(\"Cannot find class Scripter\"\
  );\n\n    // Get a MethodInfo object describing the Draw method.\n    MethodInfo\
  \ methodInfo = scripterType.GetMethod(\"Draw\");\n    if (methodInfo == null)\n\
  \        throw new MissingMethodException(\n            \"Cannot find method Draw(Turtle\
  \ turtle)\");\n\n    // Make sure the method takes a single Turtle as a parameter.\n\
  \    ParameterInfo[] paramInfos = methodInfo.GetParameters();\n    if ((paramInfos.Length\
  \ != 1) ||\n        (paramInfos[0].ParameterType.Name != \"Turtle\"))\n        \
  \    throw new ArgumentException(\n                \"The Draw method must take a\
  \ single Turtle parameter.\");\n\n    // Make the parameter list.\n    object[]\
  \ methodParams = new object[] { TheTurtle };\n\n    // Execute the method.\n   \
  \ methodInfo.Invoke(null, methodParams);\n}\n```\n\n代码首先为 C# 创建一个 `CodeDomProvider`。（.NET\
  \ 框架还包含了 JScript 和 Visual Basic 编译器。）紧接着，它创建了一个 `CompilerParameters` 对象并设置其属性，指示编译器应将脚本编译到内存中（而不是编译为\
  \ DLL 文件），并且不要创建可执行程序。\n\n接下来，程序必须为脚本所需的任何程序集添加引用。你可以编写代码来逐个添加特定的引用。此示例采用了一种稍微粗暴的方法，简单地为主程序引用的每个程序集添加引用。为了实现这一点，它使用\
  \ LINQ 查询，从 `AppDomain.CurrentDomain.GetAssemblies` 返回的程序集中进行选择。它选择了非动态程序集（在运行时未加载的程序集）并选择了它们的位置。\n\
  \n然后，程序将选中的程序集添加到 `CompilerParameters` 对象的 `ReferencedAssemblies` 集合中。\n\n程序随后调用代码提供程序的\
  \ `CompileAssemblyFromSource` 方法，使用所选的编译器编译脚本。如果编译过程中出现错误，程序将组合错误消息并显示给用户。\n\n接下来，程序使用反射找到脚本的\
  \ `Scripter` 类以及该类的 `Draw` 方法，该方法必须接受一个 `Turtle` 对象作为参数。如果成功找到此方法，程序将调用它，并将类级变量\
  \ `TheTurtle` 作为参数传递给它。\n\n## 总结\n\n大多数程序是不需要反射的。通常情况下，你知道程序需要做什么，因此你可以在设计时编写必要的代码。然而，反射在探索程序集时偶尔会很有用。它允许你在运行时查找属性、字段和方法。它让你能够发现未在说明的库中隐藏了什么内容。它甚至允许你通过在\
  \ DLL 内部搜索插件类和方法来实现插件功能。插件与在运行时编译和执行脚本的能力相结合，使你能够创建出即使在编译后也具有扩展性的应用程序。\n\n插件和脚本的一个问题是，黑客可能会利用它们来让你的程序执行不安全的代码。总的一性之，你不应该允许不受信任的用户安装\
  \ DLL 或编写并执行脚本。\n\n即使没有插件和脚本，许多应用程序仍面临黑客问题。这些问题中最大的之一就是黑客获取了关键数据。每年有数百万（甚至数亿）客户记录被盗，其中通常包括用户名、密码或信用卡号等敏感信息。\n\
  \n你可以保护这类数据的一种方法对其进行加密。如果数据窃贼偷了你的密码文件，只要该文件经过正确的加密，你的数据仍然是安全的。\n\n.NET 框架包含了用于加密和解密文件、计算文件哈希值、对文档进行数字签名以及执行其他加密任务的工具。下一章将描述这些工具中最常用的一些，并解释你如何使用它们来保护你的数据。\n\
  \n## 练习\n\n1. `PropertyGrid` 控件使用反射允许用户查看和编辑对象的属性，这就像属性窗口允许你在设计时查看和编辑属性一样。编写一个程序，使用\
  \ `PropertyGrid` 让用户查看和编辑 `Person` 对象的属性。\n\n   创建一个具有 `FirstName`、`LastName`、`Street`、`City`、`State`、`PostalCode`\
  \ 和 `EmailAddress` 属性的 `Person` 类。使用 `PropertyGrid` 让用户查看和编辑 `Person` 对象的属性。为每个属性添加一个\
  \ `Description` 特性来解释其用途，以及一个 `Category` 特性将其与其他属性分组。例如，以下代码显示了如何声明 `PostalCode`\
  \ 属性：\n\n   ```\n   [Category(\"Address\")]\n   [Description(\"The address's postal\
  \ code.\")]\n   public string PostalCode { get; set; }\n   ```\n\n   提示：`Description`\
  \ 和 `Category` 特性类定义在 `System.ComponentModel` 命名空间。\n\n   当程序启动时，创建并初始化一个 `Person`\
  \ 对象。然后将 `PropertyGrid` 控件的 `SelectedObject` 属性设置为该 `Person` 对象。\n\n运行程序时，`Description`\
  \ 和 `Category` 特性起什么作用？点击 `PropertyGrid` 的字母排序按钮会发生什么？\n\n2. 通过为 `Person` 类添加 `ContactTypes`\
  \ 枚举来修改你为练习 1 编写的程序。赋予其值 `Personal`、`Billing`、`Shipping` 和 `Admin`。然后为类添加一个具有该类型的\
  \ `ContactType` 属性。`PropertyGrid` 如何显示该属性？\n\n3. 编写一个类似的程序。（如果你不想编写图形程序，可以创建不同的工具来显示消息，以便你知道哪个工具被调用了。）\n\
  \n   ![c26f005.tif](img/c26f005.png)\n\n   图 26-5： DrawingAddIns 示例程序在运行时加载插件。\n\
  \n   运行时，此程序应执行以下操作：\n\n   * 搜索当前目录下的 DLL。\n   * 搜索每个 DLL 中具有 `Graphics` 对象作为参数的静态\
  \ `Draw` 方法的类。\n   * 对于每个此类类，程序应在工具菜单中添加一个项。该项的名称由类的 `DisplayName` 特性指定。（如果类没有该特性，则使用该类名。）\n\
  \   * 每个 `Draw` 方法都应该在它接收的 `Graphics` 对象上绘制内容。\n\n   提示：要获取类的 `DisplayName` 特性值，请获取类的类型并使用该类型的\
  \ `GetCustomAttribute` 方法。将返回的 `Attribute` 转换为 `DisplayNameAttribute` 并使用其 `DisplayName`\
  \ 属性。\n\n\n\n\n以下代码显示了一个插件方法的示例。\n\n```csharp\n[DisplayName(\"Rectangle\")]\npublic\
  \ static class RectangleDrawer\n{\n    public static void Draw(Graphics gr)\n  \
  \  {\n        // 绘制内容...\n    }\n}\n```\n\n提示：当你找到一个合适的 `Draw` 方法时，将其 `MethodInfo`\
  \ 对象存储在对应菜单项的 `Tag` 属性中。这样，当用户点击该项时，你就可以找到对应的 `MethodInfo` 来调用该方法。\n\n4. 你为练习 3\
  \ 编写的程序会查找包含定义单个 `Draw` 方法的类的 DLL。或者，你可以允许类包含任意数量的插件方法。修改你为练习 3 编写的程序以实现该功能。它应该使用任何以\
  \ `Graphics` 对象作为参数且具有 `DisplayName` 特性的方法。\n\n5. 你为练习 4 编写的程序假设任何以 `Graphics` 对象作为参数且具有\
  \ `DisplayName` 特性的方法都是绘制插件。这种方法行得通，但具有一定的局限性，因为它阻止了你拥有任何其他不是插件的类似方法。另一种方法是定义你自己的自定义属性类，并将其应用于作为插件的方法。\n\
  \n修改你为练习 4 编写的程序和 DLL DLL，以使用这种方法。在 DLL 中，创建一个 `DrawingAddInAttribute` 属性类。将其放置在\
  \ `DrawingAddIn` 命名空间内。（DLL 的其他部分不需要在该命名空间内）。以下代码显示了如何创建此属性。\n\n```csharp\nnamespace\
  \ DrawingAddIn\n{\n    // 一种标记方法为绘制插件工具的属性。\n    [AttributeUsage(AttributeTargets.Method)]\n\
  \    public class DrawingAddInAttribute : Attribute\n    {\n    }\n}\n```\n\n这里的重点是\
  \ `AttributeUsage` 属性（它指示新属性仅适用于方法）以及该类位于 `DrawingAddIn` 命名空间内。\n\n接下来，修改使用 DLL\
  \ 的程序。当它处理 DLL 时，让它使用以下代码从 DLL 获取新属性的类型。\n\n```csharp\nType addInType = dll.GetType(\"\
  DrawingAddIn.DrawingAddInAttribute\");\n```\n\n（这就是为什么你需要将 `DrawingAddInAttribute`\
  \ 类放在 `DrawingAddIn` 命名空间中，这样该语句才能找到类的类型。）\n\n当代码考虑一个方法时，让它使用类似下面的代码检查该方法是否具有此属性。\n\
  \n```csharp\n// 确保方法具有 DrawingAddIn 属性。\nAttribute drawingAttribute = methodInfo.GetCustomAttribute(addInType);\n\
  if (drawingAttribute == null) continue;\n```\n\n6. 练习 5 的描述说 `DrawingAddInAttribute`\
  \ 类应该定义在 `DrawingAddIn` 命名空间中，以便你之后找到它。你能避免这个限制吗？\n\n# 第 27 章：密码学\n\n### 本章内容\n\n\
  * 对称密钥加密与解密\n* 非对称密钥加密与解密\n* 公钥和私钥的创建、保存和检索\n* 随机数\n* 生成密钥、初始化向量和盐\n\n## 本章 Wrox.com\
  \ 下载\n\n请注意，本章的所有代码示例都可以作为书籍网站上 [www.wrox.com/go/csharp5programmersref](http://www.wrox.com/go/csharp5programmersref)\
  \ 上“Download Code”选项卡中本章代码下载的一部分。\n\n密码学研究在存在想要拦截通信的攻击者的情况下，保护两人之间通信的方法。几千年前使用的早期密码形式使用了重新排列字母或用字母替换字母等技术。例如，在凯撒替换密码中（以\
  \ 2000 多年前使用过它的尤利斯·凯撒命名），你通过某个固定量移动字母。如果位移 3 位，A 变成 D，B 变成 E，C 变成 F，以此此类推。\n\n这些加密方案有趣且值得实验，但使用现代技术相对很容易破解。我的书籍\
  \ *Essential Algorithms: A Practical Approach to Computer Algorithms*（John Wiley\
  \ and Sons, 2013）包含一个章节，描述了其中一些历史方法以及如何破解它们（主要为了娱乐价值）。\n\n其他书籍如 *Applied Cryptography:\
  \ Protocols, Algorithms, and Source Code in C*（Bruce Schneier 著，John Wiley and Sons,\
  \ 1996）解释了现代加密技术，这些技术即使是今天的计算机也无法轻易破解。\n\n本章仅描述了 .NET Framework 提供的少数实用的密码学方法。这些包括生成密码学安全的随机数、对称加密和非对称加密。\n\
  \n本章仅解释了如何使用 .NET Framework 工具来执行这些任务，但对于让你开始学习密码学应该足够了。遗憾的是，这里没有空间解释执行即使是有限任务的所有方法，或者解释这些方法的工作原理。请参阅关于密码学的书籍（如\
  \ Bruce Schneier 的书）获取有关其中某些算法工作原理的细节。\n\n密码学最初用于安全地从一个人向另一个人发送消息。现代密码学已扩展到其他安全通信。下一节描述了现代密码程序执行的一些操作。随后的章节解释了你可以在\
  \ C# 程序中使用的某些密码工具。\n\n## 密码操作\n\n以下列表描述了一些最常见的密码操作。\n\n* 对称密钥加密（私钥加密）——这种技术使用密钥对消息进行加密和解密。你使用密钥加密消息，然后将结果发送给另一个知道密钥的人。那人使用密钥解密消息。\n\
  * 非对称加密（公钥加密）——这种技术使用两个密钥（公钥和私钥）来加密和解密消息。都知道用于加密消息的公钥。只有知道私钥的人（通常是一个）可以解密消息。（这就像门上的投信口。任何人都可以通过投信口递信，但只有拥有钥匙的人才能打开门并阅读消息。）\n\
  * 哈希——这种技术使用文件内容生成一个代表文件的哈希值，类似于指纹。哈希值具有这样一个特性：两个文件极不可能具有相同的哈希值。如果你知道一个文件的哈希值，就可以重新哈希文件以查看它是否具有相同的哈希值。如果不一致，则文件自计算原始代码以来已被修改过。\n\
  * 身份验证——这是验证个人身份的过程。例如，如果有人给你发送消息，身份验证可以让你确定该消息是由你认为的人发送的，而不是冒充者。\n* 消息签名——数字消息签名的作用与物理世界中签署文档类似：它能让你验证签名者创建了该消息。例如，如果微软向你发送软件更新，其数字签名保证了该更新确实来自微软，而不是冒充者。\n\
  * 随机数生成——这是生成密码学强随机数的过程。\n\n最后一项，随机数生成需要更多的解释。\n\n## 随机性\n\n\n\n\n加密技术并非都使用随机数生成器，但随机性与密码学紧密相连。如果你有一个良好的随机数源，就可以用它来加密消息。相反，如果你有一个良好的加密方案，就可以用它来生成随机数。因为你可以使用随机数进行加密，反之亦然，这两者在某种意义上是等价的。\n\
  \n接下来的两个章节将解释这种等价性。随后的章节将解释密码学上安全的随机性。\n\n### 使用随机数进行加密\n\n假设你有一个良好的随机数生成器。（稍后我将详细说明“良好”意味着什么。）要使用随机数来加密消息，请为消息中的每个字节\
  \ `P` 生成一个新的随机字节 `R`。该字节的加密值为 `C = P ^ R`。\n\n这里是按位逻辑异或（XOR）操作。（在 C# 中，异或运算符是 `^`。）如果两个输入字节的对应位中恰好有一个位为\
  \ 1，则结果中的该位为 1。例如，`1 0 = 1`，因为输入位中恰好有一个 1。相比之下，`1 1 = 0`，因为两个输入位都是 1。\n\n要解密消息，只需重复之前的步骤，因为\
  \ `(P ^ R) ^ R = P`，这恢复了原始明文字节。\n\n注意，消息接收者必须使用与发送者加密消息时相同的字节序列。产生相同字节序列所需的信息形成了系统的私钥，由发送者和接收者共享。例如，密钥可以是发送者和接收者都可以用于初始化其随机数生成器的密码或数字序列。\n\
  \n### 使用加密生成随机数\n\n假设你有一个良好的加密算法，可以将明文字节转换为不可预测的密文。那么，要生成随机数，只需加密值 1、1、1 等，直到达到你需要的字节数为止。如果加密算法是良好的，这应该产生一个看起来是随机的字节流。\n\
  \n如果生成的字节流看起来并不随机，那么该算法就不是良好的安全加密算法。\n\n### 密码学安全的随机性\n\n在密码学中，一个“良好的”随机数流大致意味着不可预测的。如果我给你一个由随机数生成器产生的数字序列，你不应该能够任何把握地预测下一个数字是什么。\n\
  \n“良好的”加密算法还会产生不确定性。密文消息的字节对攻击者来说应该是随机的。\n\n.NET Framework 包含一个 `Random` 类，你可以用它生成随机数，但它使用的算法并不是密码学安全的。要了解为什么，你需要知道，可以通过向其构造函数传递一个\
  \ 32 位整数作为种子值来初始化 `Random` 对象。如果你使用 `Random` 对象来加密消息，种子值基本上就是密钥。\n\n一个 32 位整数可以包含\
  \ `2³²`（43 亿）个不同的值，因此你大约有 43 亿种方式可以初始化 `Random` 对象。从另一个角度想，大约有 43 亿种可能的密钥。这看起来可能有很多密钥，但对于计算机来说，这其实并不多。编写一个尝试所有可能的种子值的程序并不难。\n\
  \n对于每个种子值，程序都会尝试解密消息。如果结果看起来像英语（或你使用的任何语言），那么该种子很可能是正确的。例如，在英语中，某些字母（如 `E`）出现的频率比其他字母高。如果种子是正确的，某些字母出现的频率应该比其他字母高。如果种子是错误的，所有字母出现的频率应该大致相同。\n\
  \n### 生成随机数\n\n在 C# 中生成密码学强度的随机数实际上相当简单。只需创建一个加密随机数生成器对象，并使用其方法生成数字即可。.NET Framework\
  \ 的 `RNGCryptoServiceProvider` 类提供了这种随机数生成器。（类名开头的“RNG”代表“random number generator”，即随机数生成器。）\n\
  \nRandomNumbers 示例可以在书籍网站下载，它使用代码生成随机数列表。\n\n```csharp\n// 生成随机数。\nprivate void\
  \ generateButton_Click(object sender, EventArgs e)\n{\n    numbersListBox.Items.Clear();\n\
  \    int numNumbers = int.Parse(numNumbersTextBox.Text);\n\n    // 创建 RNG。\n   \
  \ RNGCryptoServiceProvider rand = new RNGCryptoServiceProvider();\n\n    // 创建一个缓冲区来存放\
  \ 4 个随机字节。\n    byte[] bytes = new byte[4];\n\n    // 生成随机数。\n    for (int i = 0;\
  \ i < numNumbers; i++)\n    {\n        // 获取 4 个随机字节。\n        rand.GetBytes(bytes);\n\
  \n        // 将字节转换为整数。\n        int number = BitConverter.ToInt32(bytes, 0);\n\n\
  \        // 显示数字。\n        numbersListBox.Items.Add(number);\n    }\n}\n```\n\n\
  程序首先清空其输出 `ListBox` 并解析它应该生成的随机数数量。\n\n代码随后创建了一个 `RNGCryptoServiceProvider` 对象。该对象生成随机字节，但此程序需要显示随机数。为了将字节转换为数字，程序创建了一个足够大的\
  \ `byte` 数组来容纳所需的字节。此程序生成 `int` 值（即 4 字节整数），因此它创建了一个包含 4 个字节的数组。\n\n然后程序进入循环生成这些值。对于每个值，它使用\
  \ `RNGCryptoServiceProvider` 对象的 `GetBytes` 方法用随机字节填充 `byte` 数组。然后它使用 `BitConverter`\
  \ 类的 `ToInt32` 方法将字节转换为整数。最后，将结果添加到 `numbersListBox` 中。\n\n程序从清空输出 `ListBox` 并解析其应生成的随机数数量开始。\n\
  \n代码随后创建了一个 `RNGCryptoServiceProvider` 对象。该对象生成随机字节，但此程序需要显示随机数。为了将字节转换为数字，程序创建了一个足够大的\
  \ `byte` 数组来容纳所需的字节。此程序生成 `int` 值（即 4 字节整数），因此它创建了一个包含 4 个字节的数组。\n\n程序然后进入循环生成这些值。对于每个值，它使用\
  \ `RNGCryptoServiceProvider` 对象的 `GetBytes` 方法用随机字节填充 `byte` 数组。然后它使用 `BitConverter`\
  \ 类的 `ToInt32` 方法将字节转换为整数。最后，将结果添加到 `numbersListBox` 中。\n\n此示例使用四个随机字节生成整数值，因此它可以产生任何可能的值。如果你想在边界之间生成值，你需要做一些工作。\n\
  \n第一步是生成一个随机浮点值。以下代码片段显示了如何生成 0（包含）到 1（不包含）范围内的值。\n\n```csharp\nRNGCryptoServiceProvider\
  \ rand = new RNGCryptoServiceProvider();\nbyte[] bytes = new byte[8];\nrand.GetBytes(bytes);\n\
  UInt32 randomInt = BitConverter.ToUInt32(bytes, 0);\nfloat randomFloat = randomInt\
  \ / (1.0 + UInt32.MaxValue);\n```\n\n代码创建一个 `RNGCryptoServiceProvider` 并使用它用随机字节填充\
  \ 4 字节数组。然后它将结果转换为 `UInt32`。\n\n接下来，代码将随机 `UInt32` 除以最大可能的 `UInt32` 加一。由于随机 `UInt32`\
  \ 在 0 到最大可能值之间，除法的结果在 0 到略小于 1 之间。\n\n现在你可以生成随机浮点值，就可以使用这些值生成范围内的整数。以下代码显示了如何生成\
  \ `min, max)` 范围内的整数。\n\n```csharp\nint randomInRange = (int)(min + (randomFloat\
  \ * (max - min)));\n```\n\n## 对称加密\n\n加密最明显的用途之一是加密和解密字符串或文件。.NET Framework 的加密服务处理流，你可以可以使用它们来加密和解密任何可以视为流的内容。这包括字符串、文件、字节数组、序列化或任何其他数据。\n\
  \n基本思想相当直观：创建一个加密服务提供者对象，并使用其方法将数据写入输出流。当数据通过提供者时，会被加密或解密。遗憾的是，这些细节相当复杂，因此将在接下来的章节中进行描述。\n\
  \n### 简单的加密与解密\n\nDefaultKeyAndIV 示例程序如图 27-1 所示并可以在书籍网站下载，它是你可以编写的加密和解密字符串的最简单的程序之一。\n\
  \n\n\n\n当你输入一个字符串并点击加密（Encrypt）时，程序会对该字符串进行加密然后解密。下面的代码展示了程序如何加密字符串。\n\n```python\n\
  private void encryptButton_Click(object sender, EventArgs e)\n{\n    // 获取明文。\n\
  \    string plaintext = plaintextTextBox.Text;\n    // 创建一个 AesManaged 者。\n    using\
  \ (AesManaged provider = new AesManaged())\n    {\n        // 创建一个字节数组来存储加密结果。\n\
  \        byte[] cipherbytes;\n\n        // 加密。创建一个加密器。\n        using (ICryptoTransform\
  \ encryptor =\n            provider.CreateEncryptor(provider.Key, provider.IV))\n\
  \        {\n            // 创建一个内存流来存储结果。\n            using (MemoryStream ms = new\
  \ MemoryStream())\n            {\n                // 创建一个关联的 CryptoStream。\n   \
  \             using (CryptoStream cs =\n                    new CryptoStream(ms,\
  \ encryptor, CryptoStreamMode.Write))\n                {\n                    //\
  \ 创建一个与 CryptoStream 关联的 StreamWriter\n                    // 我们可以向其中写入数据。\n   \
  \                 using (StreamWriter writer = new StreamWriter(cs))\n         \
  \           {\n                        // 将消息写入写入器。\n                        writer.Write(plaintext);\n\
  \                    }\n\n                    // 保存结果的密文字节。\n                  \
  \  cipherbytes = ms.ToArray();\n\n                    // 显示密钥、IV 和加密后的字节。\n    \
  \                keyTextBox.Text = BitConverter.ToString(provider.Key);\n      \
  \              ivTextBox.Text = BitConverter.ToString(provider.IV);\n          \
  \          cipherbytesTextBox.Text = BitConverter.ToString(cipherbytes);\n     \
  \           }\n            }\n        }\n    }\n}\n```\n\n![c27f001.tif](img/c27f001.png)\n\
  \n图 27-1: DefaultKeyAndIV 示例程序加密并解密了一个字符串。\n\n代码获取消息文本，然后创建一个 `AesManaged` 对象。这是一个托管对象，让\
  \ C# 程序能够轻松地与高级加密标准 (AES) 服务提供程序进行交互。\n\n接下来，代码创建变量 `cipherbytes` 用于稍后存储加密数据。然后它创建了一个可以用于加密字符串的加密器对象。\n\
  \n为了使用该加密器，程序必须创建一个用于读取数据的流和一个用于写入结果的第二个流。程序创建了一个 `MemoryStream` 来存储结果。\n\n程序随后创建了一个\
  \ `CryptoStream` 对象，用于转换写入输入流的任何数据。它将内存流和加密器传递给 `CryptoStream` 的构造函数，这样它就知道将结果写入哪里，以及使用哪个加密器来转换数据。它还向构造函数传递了值\
  \ `CryptoStreamMode.Write`，以便 `CryptoStream` 知道它将向内存流写入内容。\n\n接下来，代码创建了一个 `StreamWriter`，可以向其中写入明文数据。它将该写入器与\
  \ `CryptoStream` 关联。\n\n最后，代码调用 `StreamWriter` 的 `Write` 方法来写入字符串。\n\n图 27-2 显示了该过程的示意图。明文被写入\
  \ `StreamWriter` 中。`StreamWriter` 将数据写入 `CryptoStream`。`CryptoStream` 使用关联的加密器转换数据，并将结果写入\
  \ `MemoryStream`。\n\n![c27f002.eps](img/c27f002.png)\n\n图 27-2: 为了加密消息，`StreamWriter`\
  \ 将数据写入 `CryptoStream`，由后者转换数据并将结果写入 `MemoryStream`。\n\n在程序写入数据后，它将 `MemoryStream`\
  \ 的内容保存在 `byte` 数组中。\n\n接下来，程序显示了 `AesManaged` 对象的 `Key` 和 `IV` 值以及加密后的字节。（接下来的章节将会有更多关于\
  \ `Key` 和 `IV` 值的说明。）它使用 `BitConverter.ToString` 方法将这些每一个值（它们都是 `byte` 数组）转换为字符串，以十六进制数字序列的形式显示字节。\n\
  \n在加密完消息字符串后，程序使用以下代码解密加密后的字节。\n\n```python\n // 解密。创建一个解密器。\n        using (ICryptoTransform\
  \ decryptor =\n            provider.CreateDecryptor(provider.Key, provider.IV))\n\
  \        {\n            // 创建一个内存流用于读取加密后的字节。\n            using (MemoryStream ms\
  \ = new MemoryStream(cipherbytes))\n            {\n                // 创建一个关联的 CryptoStream。\n\
  \                using (CryptoStream cs =\n                    new CryptoStream(ms,\
  \ decryptor, CryptoStreamMode.Read))\n                {\n                    //\
  \ 创建一个与 CryptoStream 关联的 StreamReader\n                    // 我们可以从这里读取数据。\n   \
  \                 using (StreamReader reader = new StreamReader(cs))\n         \
  \           {\n                        // 从读取器中读取消息。\n                        string\
  \ decrypted = reader.ReadToEnd();\n\n                        // 显示结果。\n        \
  \                decryptedTextBox.Text = decrypted;\n                    }\n   \
  \             }\n            }\n        }\n    }\n}\n```\n\n这段代码的通用模式与加密字符串的代码相似。最大的区别在于这段代码使用了解密器而不是加密器。\n\
  \n代码首先创建解密器，向其构造函数传递了用于加密消息的 `Key` 和 `IV` 值。然后它创建了一个与加密字节关联的 `MemoryStream`。\n\n\
  程序随后创建一个与 `MemoryStream` 关联的 `CryptoStream`，这次向构造函数传递了 `CryptoStreamMode.Read` 参数，`CryptoStream`\
  \ 知道它将从流中读取数据。\n\n代码创建一个 `StreamReader` 来从 `CryptoStream` 读取数据，并使用其 `ReadToEnd`\
  \ 方法读取数据。最后，程序显示结果。\n\n图 27-3 显示了解密过程的示意图。`StreamReader` 的 `ReadToEnd` 方法从 `CryptoStream`\
  \ 获取数据。`CryptoStream` 从 `MemoryStream` 获取数据并使用关联的解密器进行解密。\n\n### 密钥与初始化向量\n\n回顾之前关于随机性的讨论，只有\
  \ 43 亿个种子可以初始化 `Random` 对象。这意味着该类无法为你提供非常安全的加密方案，因为攻击者可以尝试所有可能的种子值直到找到正确的那一个。\n\n\
  为了避免这个问题，加密服务提供程序允许比 `Random` 类多得初始化值。这些值被分为两个部分：密钥和初始化向量 (IV)。密钥和 IV 都是字节数组，因此它们无法直接对应容易记忆的密码。\n\
  \n如果你不在乎密钥和 IV 的具体值，可以像前一节示例那样创建一个 `AesManaged` 对象，它会为你随机生成这些值。\n\n\n\n\n一种解决方案是让加密程序将\
  \ `Key` 和 `IV` 值写入优 盘或纸上。（你甚至可以将这些值写在微缩点上并隐藏在戒指的秘密隔层中，让你感觉自己置身于汤姆·克拉克西的小说之中。）然后，你可以通过安全手段将这些值传输给接收者。例如，你可以让快递员将优\
  \ 盘或纸（或戒指）交给接收者。\n\n在这个例子中，这看起来可能并不不划算。如果你仔细观察图 27-1，你会发现 `Key` 包含 32 字节，而 `IV`\
  \ 包含 16 字节，而整个加密消息仅包含 32 字节。你完全可以让快递员将原始明文交给接收者，从而跳过加密。\n\n然而，相同的 `Key` 和 `IV` 值可以用于加密任何大小的消息。只要快递员安全地将这些值交给接收者，你就可以安全地加密并传输整部百科全书。\n\
  \n另一种方法是生成一组 `Key` 和 `IV` 值，并提前安全地发送给接收者。这样当你需要发送加密消息时，接收者可以使用集合中的下一个 `Key` 和 `IV`\
  \ 值来解密消息。\n\n### 生成 Key 和 IV 值\n\n这些方法运行得相当不错（假设你可以安全地将 `Key` 和 `IV` 值带给接收者），但除非你有惊人的记忆力，否则你很难记住\
  \ `Key` 和 `IV` 值。\n\n通常，大型伪随机字节数组是很好的密钥和 IV。但是，如果你真的想使用密码，可以使用密码来生成密钥和 `IV`。\n\n\
  `Rfc2898DeriveBytes` 类提供了一个 `GetBytes` 方法，该方法返回一个包含指定数量字节的数组。\n\n下面的代码显示了使用该类初始化密钥和\
  \ IV 数组的方法。\n\n```\n// 使用密码生成密钥和 IV 字节。\nprivate static void MakeKeyAndIV(string\
  \ password, byte[] salt,\n    int iterations, int numKeyBytes, int numIVbytes, out\
  \ byte[] key, out byte[] iv)\n{\n    Rfc2898DeriveBytes deriver =\n        new Rfc2898DeriveBytes(password,\
  \ salt, iterations);\n\n    key = deriver.GetBytes(numKeyBytes);\n    iv = deriver.GetBytes(numIVbytes);\n\
  }\n```\n\n该方法首先通过创建一个新的 `Rfc2898DeriveBytes` 对象，向其构造函数传递密码、盐（salt）和迭代次数。\n\n盐（salt）是一个你指定的字节数组，其目的是让攻击者更难构建一个包含所有可能密码的密钥和\
  \ IV 字典。基本上，它充当了 `Rfc2898DeriveBytes` 对象的初始化向量。\n\n迭代次数告诉对象要应用其内部算法多少次。这个数字目的是减慢操作速度。如果你知道正确的密码，重复该算法\
  \ 1,000 次左右只会让你变慢几毫秒。然而，如果你是一个试图猜测所有可能密码的攻击者，那么对每个可能的密码执行所有这些迭代将累积并减慢你的攻击速度。（微软建议你至少使用\
  \ 1,000 次迭代。）\n\n在初始化 `Rfc2898DeriveBytes` 对象后，代码简单地调用其 `GetBytes` 方法来生成密钥和 IV 值所需的任意数量字节。\n\
  \n### 非对称密钥加密\n\n非对称密钥加密使用所有人已知（或至少是你想要发送消息的人已知）的公钥和只有消息接收者已知的私钥。任何人都可以加密消息，但只有接收者可以解密它们。\n\
  \n广为人知的非对称算法是 RSA，它以三位首次公布它的人命名：Ron Rivest、Adi Shamir 和 Leonard Adleman。RSA 很有趣，但它也相当复杂，因此这里没有解释它的工作原理。本节的其余部分提供了如何在\
  \ C# 程序中使用 RSA 的概述。接下来的章节将显示执行这些步骤的代码。\n\n目前，你需要了解的是 RSA 使用一组数字来加密和解密数据。其中两个数字称为\
  \ `Exponent`（指数）和 `Modulus`（模数），组成公钥。其他的数字 `D`、`DP`、`DQ`、`InverseQ`、`P` 和 `Q`组成私钥。\n\
  \nNET Framework 的 `RSACryptoServiceProvider` 类使用 RSA 来加密和解密数据。它使用 `RSAParameters`\
  \ 结构来存储公钥和私钥数据。\n\n从 `RSACryptoServiceProvider` 对象检索密钥数据，你调用对象的 `ExportParameters`\
  \ 方法，如果你只需要对象的公共参数，则传递参数 `false`；如果你也需要对象的私参数，则传递 `true`。\n\n将密钥值加载到 `RSACryptoServiceProvider`\
  \ 对象中，你调用对象的 `ImportParameters` 方法，传递一个持有必要参数的 `RSAParameters` 结构。\n\n与 AES 算法使用的密钥和\
  \ IV 数据不同，RSA 密钥中使用的字节不是随机的。它们是经过仔细选择的大整数，满足特定的数学关系。这些数字也是巨大的（64 字节或更长），因此找到有效的数字并不像生成随机字节那么简单。\n\
  \n你可以通过实例化 `RSACryptoServiceProvider` 类来创建一组新的密钥参数。然后你可以发布公共参数并保存私钥。微软正确指出，永远不要将密钥值存储在明文中，这样黑客就找不到它们。为了解决这个问题，微软建议将密钥信息存储在密钥容器中，这样不容易被窃取。\n\
  \n如果这看起来很复杂，你是正确的。\n\n以下列表总结了在 C# 程序中创建 RSA 的步骤：\n\n1. 创建一个新的 `RSACryptoServiceProvider`\
  \ 对象。（它带有一组可用的密钥值。）\n2. 使用对象的 `ExportParameters` 方法提取密钥值。\n3. 将密钥值保存在密钥容器中供以后使用。\n\
  4. 发布公钥值 `Exponent` 和 `Modulus`。\n\n以下列表总结了在 C# 程序中使用 RSA 加密数据的步骤：\n\n1. 创建一个新的\
  \ `RSAParameters` 结构。\n2. 用公共值初始化结构的 `Exponent` 和 `Modulus` 参数。\n3. 创建一个 `RSACryptoServiceProvider`\
  \ 对象。\n4. 调用对象的 `ImportParameters` 方法设置其公钥参数。\n5. 调用对象的 `Encrypt` 方法，传递要加密的字节。\n\
  \n后续章节将显示执行这些步骤的代码。\n\n### 创建、保存和检索密钥\n\n下面的代码显示了程序如何创建新的 RSA 密钥并将其保存到密钥容器中。\n\n\
  ```csharp\n// 创建参数对象并设置容器名称。\nCspParameters parameters = new CspParameters();\n\
  parameters.KeyContainerName = \"TestKey\";\n\n// 创建使用这些参数的 RSACryptoServiceProvider。\n\
  return new RSACryptoServiceProvider(parameters);\n```\n\n代码首先创建一个 `CspParameters`\
  \ 对象，并将 `KeyContainerName` 属性设置为密钥容器的名称。然后创建一个新的 `RSACryptoServiceProvider` 对象，向其构造函数传递\
  \ `CspParameters` 对象。\n\n\n\n\n\n如果密钥容器已存在，新的 `RSACryptoServiceProvider` 对象将加载保存的密钥信息。\n\
  \n如果容器不存在，则 `RSACryptoServiceProvider` 对象将加载一组新的有效 RSA 密钥，并将它们保存一个新的密钥容器中。\n\n###\
  \ 加密数据\n\n以下 `RSAEncrypt` 方法使用 RSA 对数据进行加密。\n\n```\nprivate byte[] RSAEncrypt(byte[]\
  \ plainbytes, RSAParameters publicParams)\n{\n    // Create a RSACryptoServiceProvider.\
  \ \n    using (RSACryptoServiceProvider provider = new RSACryptoServiceProvider())\n\
  \    {\n        // Import the public key information.\n        provider.ImportParameters(publicParams);\n\
  \n        // Encrypt the data and return the result. (Don't use OAEP padding.)\n\
  \        return provider.Encrypt(plainbytes, false);\n    }\n}\n```\n\n该方法首先创建一个\
  \ `RSACryptoServiceProvider` 对象。然后调用对象的 `ImportSettings` 方法导入作为参数的 `RSAParameters`\
  \ 结构中的公钥信息。\n\n该方法通过调用提供者的 `Encrypt` 方法结束。它将要加密的数据传递给该方法，并返回生成的加密数据。\n\n### 解密数据\n\
  \n以下 `RSADecrypt` 方法使用 RSA 对数据进行解密。\n\n```\nprivate byte[] RSADecrypt(byte[] cipherbytes,\
  \ RSAParameters privateParams)\n{\n    // Create a RSACryptoServiceProvider. \n\
  \    using (RSACryptoServiceProvider provider = new RSACryptoServiceProvider())\n\
  \    {\n        // Import the private key information.\n        provider.ImportParameters(privateParams);\n\
  \n        // Decrypt the data and return the result. (Don't use OAEP padding.)\n\
  \        return provider.Decrypt(cipherbytes, false);\n    }\n}\n```\n\n该方法与 `RSAEncrypt`\
  \ 方法类似。不同之处在于它的 `privateParams` 参数包含 RSA 私钥参数而不是公钥参数，并且该方法调用的是提供者的 `Decrypt` 方法而不是\
  \ `Encrypt` 方法。\n\n### 示例加密\n\n`RSAEncryptDecrypt` 示例程序如图 27-4 所示并可以在书籍网站下载，它演示了\
  \ RSA 加密和解密。从图中可以看到，除了 `Exponent` 之外，所有的密钥值都很大。在我计算机上运行的这个示例中，`Exponent` 是 3 字节整数，`D`\
  \ 和 `Modulus` 是 128 字节整数，其他值是 64 字节整数。\n\n![c27f004.tif](img/c27f004.png)\n\n**图\
  \ 27-4:** `RSAEncryptDecrypt` 示例程序使用 RSA 对字符串进行加密和解密。\n\n以下代码显示了点击“加密”按钮时，示例是如何加密和解密数据的。\n\
  \n```\nprivate void encryptButton_Click(object sender, EventArgs e)\n{\n    // Get\
  \ the plaintext.\n    string plaintext = plaintextTextBox.Text;\n\n    // Create\
  \ a UnicodeEncoding object to convert between byte array and string.\n    UnicodeEncoding\
  \ converter = new UnicodeEncoding();\n\n    // Make byte arrays to hold the original,\
  \ encrypted, and decrypted data.\n    byte[] plainbytes = converter.GetBytes(plaintextTextBox.Text);\n\
  \    byte[] cipherbytes;\n    byte[] decryptedbytes;\n\n    // Create an RSA provider.\n\
  \    using (RSACryptoServiceProvider provider = new RSACryptoServiceProvider())\n\
  \    {\n        // Get the provider's public key properties.\n        RSAParameters\
  \ publicParams = provider.ExportParameters(false);\n\n        // Use the public\
  \ parameters to encrypt the data.\n        cipherbytes = RSAEncrypt(plainbytes,\
  \ publicParams);\n\n        // Display the encrypted bytes.\n        cipherbytesTextBox.Text\
  \ = BitConverter.ToString(cipherbytes);\n\n        // Display public properties.\n\
  \        exponentTextBox.Text = BitConverter.ToString(publicParams.Exponent);\n\
  \        modulusTextBox.Text = BitConverter.ToString(publicParams.Modulus);\n\n\
  \        // Decrypt.\n        // Get the provider's private key properties.\n  \
  \      RSAParameters privateParams = provider.ExportParameters(true);\n\n      \
  \  // Use the private parameters to decrypt the data.\n        decryptedbytes =\
  \ RSADecrypt(cipherbytes, privateParams);\n\n        // Display private properties.\n\
  \        DTextBox.Text = BitConverter.ToString(privateParams.D);\n        DPTextBox.Text\
  \ = BitConverter.ToString(privateParams.DP);\n        DQTextBox.Text = BitConverter.ToString(privateParams.DQ);\n\
  \        inverseQTextBox.Text = BitConverter.ToString(privateParams.InverseQ);\n\
  \        PTextBox.Text = BitConverter.ToString(privateParams.P);\n        QTextBox.Text\
  \ = BitConverter.ToString(privateParams.Q);\n\n        // Display the result.\n\
  \        decryptedTextBox.Text = converter.GetString(decryptedbytes);\n    }\n}\n\
  ```\n\n代码首先获取要加密的明文。然后创建一个 `UnicideEncoding` 对象在 `string` 和 `byte` 数组之间进行转换。它将明文转换为\
  \ `byte`，并创建另外两个 `byte` 数组来存储加密和解密后的数据。\n\n程序随后创建一个 `RSACryptoServiceProvider` 对象。该对象用新的\
  \ RSA 密钥信息进行初始化。\n\n程序调用提供者的 `ExportParameters` 方法获取其公钥值。它将这些参数和要加密的数据传递给 `RSAEncrypt`\
  \ 方法。\n\n程序随后显示加密后的数据和公钥参数。\n\n接下来，程序调用提供者的 `ExportParameters` 方法，这次是获取私钥值。它将这些参数和加密数据传递给\
  \ `RSADecrypt` 方法进行解密。\n\n程序最后通过显示私钥参数和解密的消息结束。\n\n## 总结\n\n密码学是一个引人入胜的话题。现代加密工具使用复杂的数学来让你执行诸如加密解密文件和字符串、对文件进行哈希处理以检查是否被修改、数字签名文件以及生成安全的随机数。\n\
  \n没有空间涵盖所有这些主题，本章重点介绍了三个实用的任务：生成安全的随机数、对称加密和非对称加密。这应该为你继续学习提供足够的介绍。\n\n有关 .NET Framework\
  \ 中加密工具的更多信息，请参阅 MSDN 上的[加密服务](https://msdn.microsoft.com/Cryptographic Services)。\n\
  \n## 练习题\n\n1.  编写一个使用 `Random` 类来加密和解密消息的程序。\n\n    遗憾的是，如果你使用异或运算符 `^` 将字母与随机字节结合，结果可能不是字母，因此很难可视化结果。为了方便可视化，请假设消息仅包含\
  \ A 到 Z 的大写字母。（加分项使用字符串方法和 LINQ 明文。）要加密一个字母，将其移动 0 到 25 之间的随机字母数量。例如，A + 1 = B，A\
  \ + 2 = C，以此此类推。\n\n    使用该程序加密消息，然后解密结果以确保其正常工作。（为了测试目的，密钥为 123456 的消息“This is\
  \ a test”应该是 ZJIBDEFDSNV。）\n\n2.  编写一个类似于图 27-5 所示的程序，破解你在练习 1 中使用的加密方法。\n\n   \
