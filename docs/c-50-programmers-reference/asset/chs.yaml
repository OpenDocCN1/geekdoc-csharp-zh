  \ 命名空间定义别名。\n\n```\nusing Crypto = System.Security.Cryptography;\n```\n\n然后你可以你可以\
  \ `Crypto.SHA512Managed` 来引用该类。\n\n其次，你可以使用以下指令：\n\n```\nusing System.Security.Cryptography;\n\
  ```\n\n然后你可以使用 `SHA512Managed` 来引用该类。\n\n第二种方案更简洁，但第一种更具自文档性，因为它告诉了该类的定义位置。当类的名称非常不符合直觉时，这非常有用。\n\
  \n2. 首先，你可以对每个类使用完全限定的命名空间。这样做虽然是显式的，但很冗长。\n\n其次，你可以包含如下 `using` 指令，以便方便使用其中一个命名空间。\n\
  \n```\nusing System.Windows.Controls;\n```\n\n现在你可以在不需要任何命名空间前缀的情况下使用 `System.Windows.Controls`\
  \ 版本的类。但你需要对 `System.Globalization` 版本的类进行完全限定。这种方法比之前的版本更简洁，但在不使用命名空间空间的情况下使用 `System.Windows.Controls`\
  \ 版本的类可能会引起混淆，因为你需要记住哪个命名空间带有 `using` 指令。\n\n第三，你可以使用以下代码为两个命名空间都定义别名。\n\n```\n\
  using Global = System.Globalization;\nusing Control = System.Windows.Controls;\n\
  ```\n\n现在你可以使用这些缩写来引用这两个类。这比完全限定的命名空间更简洁，但仍然提醒了你每个类的命名空间。\n\n`OrderTracker` 示例程序演示了练习\
  \ 3 到 8 的解决方案。请注意，每个练习可能有多个有效的解决方案。\n\n3. `Algorithms` 命名空间中的代码可以使用以下代码：\n\n```\n\
  public OrderClasses.Order order1;\npublic CustomerTools.Fulfillment.Order order2;\n\
