  \n12. 如果一个 `Task` 没有对它已锁的对象调用 `Monitor.Exit`，会发生什么？\n\n# 第 23 章：ADO.NET\n\n### 本章内容\n\
  \n- 连接到数据库\n- 绑定控件\n- `DataGridView`、`DataGrid` 和详细信息接口\n- `DataSet`\n- ADO.NET\n\
  \n## Wrox.com 本章下载内容\n\n请注意，本章的所有代码示例均作为本章代码下载的一部分可以在书籍网站的 [www.wrox.com/go/csharp5programmersref](http://www.wrox.com/go/csharp5programmersref)\
  \ 的“Download Code”选项卡中获取。\n\n数据库在许多软件应用程序中起着重要作用。大量的业务应用程序使用数据库来存储、安排和其他方式处理数据。\n\
  \n由于数据库在许多程序中起着如此重要的作用，像微软这样的公司花费了大量时间构建数据库工具。因此，你有几种方法可以与数据库进行工作。一些最新的方法包括 Entity\
  \ Framework 和 `LINQ` to ADO.NET，其中包含了 `LINQ` to SQL、`LINQ` to Entities 以及 `LINQ`\
  \ to `DataSet`。这些技术在第 8 章“LINQ”中曾简要介绍过。\n\n本章将要介绍 ADO.NET，这是一组提供更直接访问底层数据库的类。它还展示了你如何使用使用绑定的数据库组件和控件来快速构建简单的应用程序，让你能够创建、编辑和删除数据库记录。\n\
  \n第 8 章中的示例也可以适用于程序代码内部构建的数据库，但它们不适用于存储在计算机硬盘上的数据库。本章中的示例展示了你如何加载和查询存储在磁盘上的数据库。当你知道如何从数据库加载数据时，你可以修改第\
  \ 8 章描述的示例以从数据库中选择数据。本章不会让你成为数据库专家，但它至少能让你开始编写数据库程序，并使你能够使用 `LINQ` 查询数据库。\n\n##\
  \ 选择数据库\n\n由于数据库应用程序如此重要，许多公司已经创建了数据库和数据库工具。数据库的一个小样本包括 Microsoft SQL Server、Microsoft\
  \ SQL Server Express、Microsoft Access、MySQL、MariaDB、PostgreSQL、SQLite、Oracle、SAP、dBase、FoxPro、IBM\
  \ DB2、LibreOffice Base 和 FileMaker Pro。其中一些昂贵，而另一些是免费的。某些是为大量数据和许多并发用户设计的，而另一些则是为单用户更有限的使用设计的。你可以在互联网上搜索数据库的比较和推荐。\n\
  \n我在 C# 程序中四种数据库是 SQL Server、SQL Server Express、MySQL Community 版和 Access。SQL Server\
  \ 和 MySQL 设计用于处理大量数据和并发用户。它们都带有具有功能限制的免费版本（SQL Server Express 和 MySQL Community\
  \ Edition）。全功能版本与免费版相似，因此许多开发者从免费版开始，并在必要时以后升级。\n\nAccess 更适用于较小的桌面应用程序。它相比 SQL\
  \ Server 的一个优势是 Access 数据库存储在简单文件中，C# 程序可以在不需要任何额外工具（除驱动外）的情况下打开它们。相比之下，由于 Access\
  \ 使用数据库文件，即使没有安装 Access，C# 程序也可以打开它们。但要使用 SQL Server，你需要在计算机上安装并运行数据库服务器。你可以将程序分发到其他计算机，而无需在目标计算机上安装\
  \ Access。\n\n由于这些原因，本章的示例使用了 Access 数据库文件。你可以从书籍网站下载它们并在程序中使用。你确实需要驱动来让程序连接数据库，但它们可能已经由\
  \ Visual Studio 安装，如果缺失则很容易安装。本章后面“创建数据源”部分的“连接拒绝”功能有更多关于安装驱动的信息。\n\n\n\n\n\n6.\
  \ 魔向导的下一页（如图 23-1 所示）允许你选择数据库连接。如果 Visual Studio 已经知道数据库连接，你可以从下拉列表中选择其中一个![c23f001.tif](img/c23f001.png)\n\
  \n**图 23-1:** 数据源配置向导中的此页允许你选择一个数据连接。\n\n7. 如果你需要创建一个新连接，请按照以下步骤操作。\n\n    1. 点击`New\
  \ Connection` 显示图 23-2 所示的对话框。选择你想要使用的数据源类型![c23f002.tif](img/c23f002.png)\n\n**图\
  \ 23-2:** “选择数据源”对话框让你选择将要使用的数据库类型。\n\n    2. 对于此示例，选择`Microsoft Access Database\
  \ File`。（注意说明提到该数据源将使用 OLE DB 数据提供程序。）点击`Continue`显示图 23-3 所示的对话框。\n\n    3. 输入或选择数据库文件的名称。如果数据库受密码保护，请输入用户名和密码。\n\
  \n    4. 点击`Test Connection`检查 Visual Studio 是否可以连接到数据库。\n\n    5. 如果连接测试成功，点击`OK`。\n\
  \n8. 创建连接后，对话框会显示以下自明易懂的消息：\n\n你选择的连接使用了一个不在当前项目中的本地数据文件。你是否要将该文件复制到项目中并修改连接？\n\n\
  如果你将数据文件复制到你的项目，则在每次运行应用程序时，它都会被复制到项目的输出目录。按`F1`获取控制此行为的信息。\n\n将数据库文件复制到程序的执行文件位置对测试很有帮助。你的程序可以修改数据，当你再次运行它时，它将从数据库的新副本开始。\n\
