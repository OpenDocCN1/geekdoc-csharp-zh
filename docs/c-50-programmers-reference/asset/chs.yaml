  这与练习 5 中使用的代码相似，不同之处它从表而不是 `XElement` 对象中选择数据。\n\n### 10. 示例程序 `VolleyballTeamsRankings`\
  \ 执行了此操作。它使用一个名为 `pointsFor` 的查询，该查询与练习 9 解决方案中使用的相似，用于选择团队名称、胜利次数和“正得分”。\n\n接下来，程序使用第二个名为\
  \ `pointsAgainst` 的查询来选择团队名称、失败次数和“负得分”。该查询与第一个相似，但它将 `Teams` 表的 `TeamName` 字段匹配到\
  \ `Matches` 表的 `VersusTeamName` 字段。\n\n然后，程序使用以下查询连接 `pointsFor` 和 `pointsAgainst`\
  \ 查询的结果。\n\n```sharp\n// Join the win and loss data.\nvar combined =\n    from dataFor\
  \ in pointsFor\n    join dataAgainst in pointsAgainst\n        on dataFor.Team equals\
  \ dataAgainst.Team\n    orderby\n        100 * (dataFor.Wins / (float)dataAgainst.Losses)\
  \ descending,\n        dataFor.PointsFor - dataAgainst.PointsAgainst descending\n\
  \    select new\n    {\n        Team = dataFor.Team,\n        Wins = dataFor.Wins,\n\
  \        Losses = dataAgainst.Losses,\n        WinPercent = 100 *\n            (dataFor.Wins\
  \ / (float)(dataFor.Wins + dataAgainst.Losses)),\n        PointsFor = dataFor.PointsFor,\n\
  \        PointsAgainst = dataAgainst.PointsAgainst,\n        PointDifferential =\
  \ dataFor.PointsFor - dataAgainst.PointsAgainst\n    };\n```\n\n最后，程序遍历所选数据并显示结果。\n\
  \n### 11. 示例程序 `AddStandingsToXml` 以两种不同的方式执行了此操作。\n\n第一种使用了与练习 10 解决方案相同的查询。在构建了\
  \ `combined` 查询后，程序使用以下代码构建新的 XML 元素。\n\n```csharp\n// Add the results to a new\
  \ Standings XML element.\nXElement standings = new XElement(\"Standings\");\nroot.Add(standings);\n\
  foreach (var results in combined)\n{\n    standings.Add(\n        new XElement(\"\
  Team\",\n            new XAttribute(\"Name\", results.Team),\n            new XAttribute(\"\
  Wins\", results.Wins),\n            new XAttribute(\"Losses\", results.Losses),\n\
  \            new XAttribute(\"WinPercent\", results.WinPercent),\n            new\
  \ XAttribute(\"PointsFor\", results.PointsFor),\n            new XAttribute(\"PointsAgainst\"\
  , results.PointsAgainst),\n            new XAttribute(\"PointDifferential\", results.PointDifferential)\n\
  \        )\n    );\n}\n```\n\n此代码首先创建一个新的 `Standings XElement` 并将其添加到 `root` 元素。然后它遍历\
  \ `combined` 查询。对于查询结果中的每个项，程序使用该项的属性创建一个新的 `Team` 元素并将该元素添加到 `Standings` 元素中。\n\
  \n程序的第二种方法使用了以下代码。\n\n```sharp\n// Join the win and loss data.\nvar combined =\n\
  \    from dataFor in pointsFor\n    join dataAgainst in pointsAgainst\n        on\
  \ dataFor.Team equals dataAgainst.Team\n    orderby\n        100 * (dataFor.Wins\
  \ / (float)dataAgainst.Losses) descending,\n        dataFor.PointsFor - dataAgainst.PointsAgainst\
  \ descending\n    select new XElement(\"Team\",\n        new XAttribute(\"Name\"\
  , dataFor.Team),\n        new XAttribute(\"Wins\", dataFor.Wins),\n        new XAttribute(\"\
  Losses\", dataAgainst.Losses),\n        new XAttribute(\"WinPercent\",\n       \
  \     100 * (dataFor.Wins / (float)(dataFor.Wins + dataAgainst.Losses))),\n    \
  \    new XAttribute(\"PointsFor\", dataFor.PointsFor),\n        new XAttribute(\"\
  PointsAgainst\", dataAgainst.PointsAgainst),\n        new XAttribute(\"PointDifferential\"\
  ,\n            dataFor.PointsFor - dataAgainst.PointsAgainst));\n\n// Add the results\
  \ to a new Standings XML element.\nroot.Add(new XElement(\"Standings\", combined));\n\
  ```\n\n此版本让 LINQ 查询创建表示排名数据的 `XElement` 对象。然后它创建 `Standings` 元素并将查询传递给该元素的构造函数。由于查询返回包含\
  \ `XElement` 的 `IEnumerable`，构造函数使这些元素变为 `Standings` 元素的子元素。\n\n第一种方法使用查询选择程序所需的数据，然后遍历查询结果创建\
  \ `XElements`。第二种方法让 LINQ 查询创建 `XElements`。通常情况下，你应该使用你认为更直观的方法。\n\n\n\n\n```csharp\n\
  public class Student\n{\n    private string _Name;\n    public string Name\n   \
