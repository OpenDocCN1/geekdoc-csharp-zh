  \ 8 章\n\n## LINQ\n\n### 本章内容\n\n* LINQ 查询语法\n* 结果的分组与聚合\n* 创建新的 LINQ 扩展方法\n* 基于方法的查询\n\
  * LINQ to Objects, LINQ to XML 和 LINQ to ADO.NET\n* 并行 LINQ\n\n### 本章的 Wrox.com\
  \ 下载\n\n请注意，本章的所有代码示例均作为书中章节代码下载的一部分提供。\n\n### 语言集成查询\n\n语言集成查询（Language Integrated\
  \ Query，简称 LINQ，读音为“link”）是一种数据检索机制，允许程序从列表、集合、数组和其他数据结构中选择、过滤和分组数据。LINQ 允许从所有数据源进行查询，而不仅仅是数据库。其区别在于，例如，假设你想搜索客户集合，找到逾期至少\
  \ 30 天的客户并列出。你可以编写代码遍历集合以找到这些客户并复制到新集合中。然后编写代码对该集合进行排序。这并不困难，但需要编写大量的代码，增加了出错的机会。\n\
  \n相比之下，LINQ 查询可以简洁地定义这种搜索和排序操作。结果可能没有优化的 C# 代码快，但 LINQ 通常简单且更容易实现。LINQ 提供了许多扩展方法，适用于所有存储数据的对象，如数组、字典和列表。有关扩展方法的更多信息，请参见第\
  \ 6 章的“扩展方法”部分。例如，整数数组本身只是存储数字的内存块。LINQ 为整数数组增加了扩展方法，让你执行此类任务：\n\n* 寻找最小值、最大值和平均值\n\
  * 将数组转换为 `float` 或其他类型的可枚举列表\n* 将数组与其他数组\n* 判断数组是否包含特定值\n* 统计符合条件的数值数量\n* 返回符合条件的第一个值\n\
  * 返回唯一值（无重复的值）\n* 根据某些标准对值分组\n* 找到数组中同时也另一个数组中的项\n* 对数组项进行排序\n* 反转数组项的顺序\n* 返回数组项之和\n\
  \nC# 提供了一种语法，将查询转换为 LINQ 扩展方法调用，以选择、排序并处理数据并返回结果。标准的 LINQ 工具分为以下三大类：\n\n* LINQ to\
  \ Objects——与数组、字典和列表等 C# 对象交互的 LINQ 方法。\n* LINQ to XML——用于读写 XML 数据的特性。LINQ 让你轻松地在\
  \ XML 层次结构和其他 C# 对象之间移动数据。\n* LINQ to ADO.NET——允许你编写 LINQ 风格查询从关系型数据库中提取数据的特性。\n\
  \n\n\nThe `where` clause is used to filter the data returned by the query. Its basic\
  \ form is\n\n```\nwhere condition\n```\n\nThe `condition` is a boolean expression\
  \ that evaluates to true or false for each item. If the expression is true, the\
  \ item is included in the results; if it is false, the item is excluded.\n\nFor\
  \ example, the following query uses the `where` clause to select only those customers\
  \ with a negative balance:\n\n```\nvar overdue =\n    from customer in customers\n\
  \    where customer.Balance < 0\n    orderby customer.Balance ascending\n    select\
  \ new { customer.Name, customer.Balance };\n```\n\nYou can also use multiple `where`\
  \ clauses to perform more complex filtering. This is equivalent to using the logical\
  \ AND operator (`&&`) in a single `where` clause:\n\n```c\nvar overdue =\n    from\
  \ customer in customers\n    where customer.Balance < 0\n    where customer.State\
  \ == \"WA\"\n    orderby customer.Balance ascending\n    select new { customer.Name,\
  \ customer.Balance };\n```\n\nSimilarly, you can use the logical OR operator (`||`)\
  \ to include items that meet any of several criteria:\n\n```\nvar overdue =\n  \
  \  from customer in customers\n    where customer.Balance < 0 || customer.State\
  \ == \"WA\"\n    orderby customer.Balance ascending\n    select new { customer.Name,\
  \ customer.Balance };\n```\n\n### orderby\n\nThe `orderby` clause is used to sort\
  \ the results of the query. Its basic form is\n\n```\norderby expression [ascending\
  \ | descending]\n```\n\nThe `expression` is the property or value you want to sort\
  \ by. The default order is `ascending`, so you can omit it if that is what you need.\n\
  \nFor example, the following query sorts customers by balance in descending order:\n\
  \n```\nvar topCustomers =\n    from customer in customers\n    where customer.Balance\
  \ > 0\n    orderby customer.Balance descending\n    select new { customer.Name,\
  \ customer.Balance };\n```\n\nYou can also use multiple `orderby` clauses to sort\
  \ by multiple criteria. For example, the following query sorts customers by state,\
  \ and then by name within each state:\n\n```\nvar sortedCustomers =\n    from customer\
  \ in customers\n    orderby customer.State ascending\n    orderby customer.Name\
  \ ascending\n    select new { customer.State, customer.Name };\n```\n\n### select\n\
  \nThe `select` clause is used to specify what data should be returned by the query.\
  \ Its basic form is\n\n```\nselect expression\n```\n\nThe `expression` can be a\
  \ single property, a collection of properties, or even a new object of an anonymous\
  \ type.\n\nFor example, the following query selects only the names of customers\
  \ with a negative balance:\n\n```\nvar overdueNames =\n    from customer in customers\n\
  \    where customer.Balance < 0\n    select customer.Name;\n```\n\nYou can also\
  \ use an anonymous type to return multiple pieces of information:\n\n```\nvar customerDetails\
  \ =\n    from customer in customers\n    where customer.Balance < 0\n    select\
  \ new { Name = customer.Name, Balance = customer.Balance };\n```\n\n\n\n\n`where`\
  \ 子句用于过滤由 `from` 子句选择的记录。它可以包含涉及所选对象以及这些对象属性的测试。前一节中的最后一个示例展示了一种特别实用的查询类型，通过 `joins`\
  \ 连接两个由公共属性值相关的数据源中的对象。`where` 子句通常执行简单的测试和比较，但也可以在所选对象和属性上执行方法，以决定它们是否应该包含在结果中。\n\
  \n例如，假设 `Customer` 类具有 `Balance` 和 `PaymentIsLate` 属性，并假设 `PreferredCustomer` 类继承自\
  \ `Customer`。此外，假设 `customers` 数组同时包含 `Customer` 和 `PreferredCustomer` 对象。\n\n以下代码中定义的\
  \ `OwesALot` 方法在 `Customer` 欠至少 50 美元时返回 `true`。接下来的查询从 `customers` 中选择对象，其条件是：该对象不是\
  \ `PreferredCustomer`、`PaymentIsLate` 值为 `true`，且函数 `OwesALot` 返回 `true`。\n\n```\n\
  private bool OwesALot(Customer customer)\n{\n    return customer.Balance <= -50m;\n\
  }\n...\nvar query =\n    from customer in customers\n    where !(customer is PreferredCustomer)\
  \ &&\n        customer.PaymentIsLate &&\n        OwesALot(customer)\n    select\
  \ customer;\n```\n\n`where` 子句可以包含几乎任何布尔表达式，通常涉及所选对象及其属性。如前一个示例所示，它可以包含 `!`、`is`、`&&`\
  \ 和方法调用。\n\n表达式可以使用任何算术、日期、字符串或其他比较操作符。以下查询从 `orders` 数组中选择 `Order` 对象，其 `OrderDate`\
  \ 属性在 2015 年 4 月 1 日之后：\n\n```\nvar query =\n    from order in orders\n    where\
  \ order.OrderDate > new DateTime(2015, 4, 1)\n    select order;\n```\n\n### orderby\n\
  \n`orderby` 子句对查询结果进行排序。通常，用于对结果排序的值是所选对象的属性。例如，接下来的查询从 `customers` 数组中选择 `Customer`\
  \ 对象，并根据它们的 `Balance` 属性对其进行排序：\n\n```var\nvar query =\n    from customer in customers\n\
  \    orderby customer.Balance\n    select customer;\n```\n\n此查询按 `Balance` 属性升序排列对客户进行排序。\n\
  \n如果 `orderby` 子句包含多个字段，则结果先按第一个值排序，任何相同项将由剩余字段打破。例如，接下来的查询按 `Balance` 排序客户。如果两个客户的\
  \ `Balance` 相同，则根据 `LastName` 排序。如果两个客户的 `Balance` 和 `LastName` 都相同，则根据 `FirstName`\
  \ 排序。\n\n```\nvar query =\n    from customer in customers\n    orderby customer.Balance,\
  \ customer.LastName, customer.FirstName\n    select customer;\n```\n\n若要按降序排列项目，只需在排序表达式后添加\
  \ `descending` 关键字。每个表达式都可以有其自己的 `descending` 关键字，因此你可以独立地安排它们。例如，你可以按 `Balance`\
  \ 升序、`FirstName` 降序和 `LastName` 降序对客户进行排序。\n\n`orderby` 子句可以包含计算值。例如，假设 `Order`\
  \ 类具有 `Subtotal`、`Tax` 和 `Shipping` 属性。接下来的查询按这些值的总和对其结果进行排序。\n\n```\nvar query\
  \ =\n    from order in orders\n    orderby order.Subtotal + order.Tax + order.Shipping\n\
  \    select order;\n```\n\n注意，用于结果排序的值并不一定是查询选择的值。例如，前一个查询选择了 `orders` 数组中的所有 `Order`\
  \ 对象，而不是这些对象的总成本。下一节将解释 `select` 子句。\n\n### select\n\n`select` 子句列出了查询应选择到其结果中的字段。这可以是从数据源获取的整个对象，也可以是从多个数据源获取的一个或多个字段。它可以包含在对象字段上执行的方法的结果或计算结果。它甚至可以包含更复杂的内容，例如嵌套查询的结果。\n\
  \n接下来的查询选择 `customers` 数组中 `Customer` 对象拼接后的名和姓。\n\n```\nvar query =\n    from customer\
  \ in customers\n    orderby customer.FirstName + \" \" + customer.LastName\n   \
  \ select customer.FirstName + \" \" + customer.LastName;\n```\n\n如果你想从查询对象中选择多个字段，请使用\
  \ `new` 关键字并后跟大括号包含的值。例如，接下来的查询选择了 `Customer` 对象拼接后的名、姓以及它们的 `Balance` 值。\n\n```\n\
  var query =\n    from customer in customers\n    orderby customer.FirstName + \"\
  \ \" + customer.LastName\n    select new\n    {\n        Name = customer.FirstName\
  \ + \" \" + customer.LastName,\n        customer.Balance\n    };\n```\n\n这种技术创建了匿名类型的对象，该类型具有持有所选值的属性。\n\
  \n如果你从查询对象中选择一个简单属性，匿名类型的属性将具有相同的名称。在这个示例中，值 `customer.Balance` 存储在匿名对象的 `Balance`\
  \ 属性中。\n\n如果你选择一个计算值，必须为匿名类型的属性指定一个名称。在这个示例中，计算值 `customer.FirstName + \" \" + customer.LastName`\
  \ 存储在名为 `Name` 的属性中。\n\n稍后你可以在处理结果时使用匿名类型的属性名。以下代码显示了程序如何显示从上一个查询的结果。\n\n```\nforeach\
  \ (var obj in query)\n    Console.WriteLine(obj.Name + \": \" + obj.Balance);\n\
  ```\n\n到为止显示的查询返回的是匿名类型的对象。如果你愿意，可以定义一个类型来持有结果，然后创建该类型的对象。例如，假设 `BalanceInfo` 类具有\
  \ `Name` 和 `Balance` 属性。接下来的查询选择了与上一个查询相同的数据，但这次将结果保存在 `BalanceInfo` 对象中：\n\n```\n\
  var query =\n    from customer in customers\n    orderby customer.FirstName + \"\
  \ \" + customer.LastName\n    select new BalanceInfo\n    {\n        Name = customer.FirstName\
  \ + \" \" + customer.LastName,\n        Balance = customer.Balance\n    };\n```\n\
  \n结果包含 `BalanceInfo` 对象，而不是匿名类型的对象。这意味着程序可以使用显式类型的 `BalanceInfo` 对象来循环遍历结果，如下面代码所示。\n\
  \n```\nforeach (BalanceInfo info in query)\n    Console.WriteLine(info.Name + \"\
  : \" + info.Balance);\n```\n\n你还可以使用类的构造函数来选择类的新实例。例如，假设 `BalanceInfo` 类有一个接受名称和账户余额作为参数的构造函数。以下代码显示了你可以如何修改之前的查询以使用该构造函数。\n\
  \n```\nvar query =\n    from customer in customers\n    orderby customer.FirstName\
  \ + \" \" + customer.LastName\n    select new BalanceInfo(\n        customer.FirstName\
  \ + \" \" + customer.LastName,\n        customer.Balance);\n```\n\n### 使用 LINQ 结果\n\
  \nLINQ 查询表达式返回包含查询结果的 `IEnumerable`。程序可以遍历此结果并处理其中包含的项。\n\n要确定 `IEnumerable` 结果包含哪些对象，你需要仔细查看\
  \ `select` 子句。如果此子句选择了如 `string` 或 `int` 等简单值，则结果包含这些简单值。\n\n例如，接下来的查询拼接了单个字符串的客户名和姓。结果是\
  \ `string`，因此查询的 `IEnumerable` 结果包含 `string`，`foreach` 循环可以将其视为 `string`。\n\n```\n\
  var query =\n    from customer in customers\n    select customer.FirstName + \"\
  \ \" + customer.LastName;\n\nforeach (string name in query)\n    Console.WriteLine(name);\n\
  ```\n\n\n\n\n通常 `select` 子句会选取某种类型的对象。以下查询选择了 `customers` 数组中包含的 `Customer` 对象。结果包含\
  \ `Customer` 对象，因此代码可以使用显式类型 `Customer` 作为其循环变量。\n\n```\nvar query =\n    from customer\
  \ in customers\n    select customer;\n\nforeach (Customer customer in query)\n \
  \   Console.WriteLine(customer.FirstName + \" \" + customer.LastName);\n```\n\n\
  ## 高级 LINQ 查询语法\n\n到目前为止，本章描述了你可能经常使用的基础 LINQ 命令，但 LINQ 的功能远不止这些简单的查询。接下来的章节描述了一些不那么直观、且你可能不需要频繁使用的的高级\
  \ LINQ 命令。\n\n## join\n\n`join` 关键字从多个数据源中选择并匹配相应字段的数据。以下伪代码显示了 `join` 子句的语法：\n\n\
  ```\nfrom variable1 in dataSource1\njoin variable2 in dataSource2\n  on variable1.field1\
  \ equals variable2.field2\n```\n\n例如，以下查询从 `customers` 数组中选择了 `Customer` 对象。对于每个\
  \ `Customer` 对象，它从 `orders` 数组中选择了 `Order` 对象，且两条记录具有相同的 `CustomerId` 值。\n\n```\n\
  var query =\n    from customer in customers\n    join order in orders on customer.CustomerId\
  \ equals order.CustomerId\n    select new { customer, order };\n```\n\n## join into\n\
  \n你可以向 `join` 子句添加 `into` 子句，将连接后的值分组到一个带有指定新名称的列表中。例如，考虑以下查询。（新元素已**加粗**显示。）\n\n\
  ```\nvar query =\n    from customer in customers\n    join order in orders on customer.CustomerId\
  \ equals order.CustomerId\ninto CustomerOrders\n    select new { customer, CustomerOrders\
  \ };\n```\n\n此查询选取 `Customer` 和 `Order` 数据的方式与之前的查询相似。然而，这次，`join` 子句选取的 `Order`\
  \ 项被放在一个名为 `CustomerOrders` 的列表中。随后，`select` 子句选取每个 `Customer` 对象加上其 `CustomerOrders`\
  \ 列表。\n\n以下代码显示了程序如何遍历结果。\n\n```\nforeach (var group in query)\n{\n    Console.WriteLine(group.customer.FirstName\
  \ + \" \" + group.customer.LastName);\n    foreach (Order order in group.CustomerOrders)\n\
  \        Console.WriteLine(\"    Order: \" + order.OrderId);\n}\n```\n\n对于结果中的每个组对象，程序显示该组的客户名称。然后它遍历组的\
  \ `CustomerOrders` 列表，显示每个 `Order` 对象的 `OrderId`。以下文本显示了一些示例输出。\n\n```\nArt Anderson\n\
  \    Order: 1\n    Order: 2\nBetty Baker\n    Order: 3\nCarl Carter\n```\n\n在这个示例中，客户\
  \ Art Anderson 拥有两个 `OrderId` 值为 1 和 2 的订单，Betty Baker 有一个 `OrderId` 为 3 的订单，而 Carl\
  \ Carter 没有订单。\n\n## group by\n\n与 `join into` 类似，`group by` 允许程序将相关值聚集在一起形成组。它还返回一个包含对象的\
  \ `IEnumerable`，其中每个对象都包含另一个 `IEnumerable`。\n\n以下代码显示了一个示例。\n\n```\nvar query =\n\
  \    from order in orders\n    group order by order.CustomerId;\n```\n\n此查询从 `orders`\
  \ 数组中选取 `Order` 对象。查询中的 `group order` 部分意味着你想选取 `order` 对象并对其进行分组。查询中的 `by order.CustomerId`\
  \ 部分意味着对象应该根据它们的 `CustomerId` 属性进行分组。\n\n结果是一个表示组的列表列表。这些对象每个都有一个 `Key` 属性，该属性提供了用于构建该组的值。在示例中，`Key`\
  \ 是对象 `CustomerId` 值的值。\n\n每个对象也是可枚举的，因此程序可以遍历其所在组中的对象。\n\n以下代码显示了程序如何显示此查询的结果。\n\
  \n```\nforeach (var group in query)\n{\n    Console.WriteLine(\"Customer \" + group.Key\
  \ + \":\");\n    foreach (Order order in group)\n        Console.WriteLine(\"  \
  \  Order: \" + order.OrderId);\n}\n```\n\n此代码遍历查询结果中的组。对于每个组对象，程序显示该组的 `Key`。然后它遍历该组并显示其\
  \ `Order` 对象。\n\n如果你在 `group by` 之后添加 `into` 子句，你可以为组数据指定一个名称，并在稍后的 `select` 子句中使用该名称。例如，考虑以下查询。\n\
  \n```\nvar query =\n    from order in orders\n    group order by order.CustomerId\
  \ into CustomerOrders\n    select new { ID = CustomerOrders.Key, Orders = CustomerOrders\
  \ };\n```\n\n与上一个示例类似，此查询按 `CustomerId` 分组选取 `Order` 对象。它将分组数据命名为 `CustomerOrders`。`select`\
  \ 子句随后使用该名称选取分组数据的 `Key` 和分组数据本身。\n\n以下代码显示了程序如何显示结果。\n\n```\nforeach (var group\
  \ in query)\n{\n    Console.WriteLine(\"Customer \" + group.ID + \":\");\n    foreach\
  \ (Order order in group.Orders)\n        Console.WriteLine(\"    Order: \" + order.OrderId);\n\
  }\n```\n\n此代码与之前的版本相似，但它使用了 `select` 子句用于命名所选数据的 `ID` 和 `Orders` 名称。\n\n## 聚合值\n\
  \n当你对数据进行分组时，可以使用聚合方法来选取值。例如，假设你按 `CustomerId` 分组 `Order` 对象，以便结果中的每个组都包含订单。以下查询显示了一个**加粗**了\
  \ `Sum` 方法的示例。\n\n```\nvar query =\n    from order in orders\n    group order by\
  \ order.CustomerId into CustomerOrders\n    select new\n    {\n        ID = CustomerOrders.Key,\n\
  \        Orders,\n        TotalPrice = Orders.Sum(order => order.Price)\n    };\n\
  ```\n\n此查询从 `orders` 数组中选取 `Order` 对象，按 `CustomerId` 进行分组，并将组命名为 `Orders`。`select`\
  \ 子句选取每个组的 `Key`（创建该组的 `CustomerId`）以及组本身。\n\n在最后的选取中，查询获取 `Orders` 组并调用其 `Sum`\
  \ 扩展方法。`Sum` 方法接收一个参数，用于从遍历的对象中选取数值，在本例中为 `Order` 对象的 `Price` 属性。（有关 Lambda 表达式的信息，请参见“Lambda\
  \ 表达式”章节）。\n\n以下代码显示了程序如何显示结果。\n\n```\nforeach (var group in query)\n{\n    Console.WriteLine(\"\
  Customer \" + group.ID + \": \" +\n        group.TotalPrice.ToString(\"C\"));\n\
  \    foreach (Order order in group.Orders)\n    {\n        Console.WriteLine(\"\
  \    Order \" + order.OrderId + \": \" +\n            order.Price.ToString(\"C\"\
  ));\n    }\n}\n```\n\n以下列表汇总了 LINQ 的聚合方法。\n\n*   `Aggregate`—使用你指定的方法对值执行某些计算。\n\
  \n*   `Average`—返回值的平均值。\n\n*   `Count`—返回符合条件的项数。\n\n*   `Sum`—返回值的和。\n\n*   `LongCount`—作为\
  \ `long` 类型返回符合条件的项数。\n\n\n\n\n\n*   `Max`—返回最大值\n*   `Min`—返回最小值\n\n### Set 方法\n\
  \n集合方法修改项目集合。例如，`Union` 方法创建两个集合的并集。`C#` 没有提供特殊的语法来将这些方法包含在 LINQ 查询中，因此你必须直接调用这些方法。幸运的是，这些方法易于使用。\n\
  \n例如，假设 `ordersPaid` 和 `ordersDue` 数组分别包含 `Order` 对象，分别代表已支付的客户订单和到期的客户订单。以下语句使用\
  \ `Union` 方法创建一个包含两个数组中所有订单的新数组。\n\n```\nOrder[] allOrders = ordersPaid.Union(ordersDue).ToArray();\n\
  ```\n\n`Union` 方法的结果是一个迭代器，你可以使用 `foreach` 语句对它进行循环。此示例调用了结果的 `ToArray` 方法将其转换为数组。\n\
  \n你可以将这些方法应用于查询结果。例如，接下来的查询检查 `orders` 数组并选择 `Order` 对象的 `CustomerId` 值。代码随后使用 `Distinct`\
  \ 方法将结果限制为唯一值。接下来的 `foreach` 语句显示这些唯一值。\n\n```\nvar query =\n    (from order in\
  \ orders select order.CustomerId).Distinct();\nforeach (int id in query)\n    Console.WriteLine(id);\n\
  ```\n\n以下列表总结了 LINQ 的集合方法。\n\n*   `Concat`—返回两个连接后的结果集\n*   `Distinct`—返回一个没有重复的集合\n\
  *   `Except`—返回第一个集合中的项目，但不属于第二个集合中的项目\n*   `Intersect`—返回两个集合中都存在的项目\n*   `Union`—返回位于两个集合中任一侧的项目\n\
  \n### 限制结果\n\n以下列表总结了 LINQ 提供的限制查询返回结果的方法。\n\n*   `First`—返回第一个结果并丢弃其余。如果结果不包含值，将抛出异常。\n\
  *   `FirstOrDefault`—返回第一个结果并丢弃其余。如果查询不包含结果，则返回默认值。\n*   `Last`—返回最后一个结果并丢弃其余。如果结果不包含值，将抛出异常。\n\
  *   `LastOrDefault`—返回最后一个结果并丢弃其余。如果查询不包含结果，则返回默认值。\n*   `Single`—返回查询选择的单个项目。如果查询不恰好有一个结果，将抛出异常。\n\
  *   `SingleOrDefault`—返回查询选择的单个项目。如果查询不包含结果，则返回默认值。如果查询包含多个项目，将抛出异常。\n*   `Skip`—丢弃指定数量的结果并保留其余。\n\
  *   `SkipWhile`—只要某个条件为 `true` 就一直丢弃结果，然后保留其余。（条件由方法提供，通常是 lambda 表达式。）\n*   `Take`—保留指定数量的结果并丢弃其余。\n\
  *   `TakeWhile`—只要某个条件为 `true` 就一直保留结果，然后丢弃其余。\n\n例如，接下来的查询按 `Balance` 属性递增的顺序选择\
  \ `Customer` 对象。表达式 `Take(10)` 选择了前 10 个值并丢弃其余。（如果结果少于 10 个值，则语句将获取所有值。）结果是余额最小的\
  \ 10 个客户的列表。\n\n```\nvar query =\n    (from customer in customers\n     orderby\
  \ customer.Balance\n     select customer).Take(10);\n```\n\n接下来的查询使用 `TakeWhile`\
  \ 方法选择所有 `Balance` 属性小于 –50 的 `Customer` 对象。\n\n```\nvar query =\n    (from customer\
  \ in customers\n     orderby customer.Balance\n     select customer).TakeWhile(customer\
  \ => customer.Balance < -50m);\n```\n\n### 其他 LINQ 方法\n\nLINQ 提供了几种其他不受 `C#` 查询语法支持的扩展方法。你不能在查询中使用它们，但可以将它们应用于查询结果。\n\
  \n以下列表描述了一些未受 `C#` 查询语法支持的更有用的剩余 LINQ 扩展。\n\n*   `Contains`—如果结果包含特定值，则返回 `true`。\n\
  *   `DefaultIfEmpty`—如果查询结果不为空，则返回结果。如果结果为空，则返回一个包含默认值的 `IEnumerable`。\n*   `ElementAt`—返回查询结果中特定位置的元素。如果该位置没有元素，将抛出异常。\n\
  *   `ElementAtOrDefault`—返回查询结果中特定位置的元素。如果该位置没有元素，则返回默认值。\n*   `Empty`—创建一个空的 `IEnumerable`。\n\
  *   `Range`—创建一个包含整数范围的 `IEnumerable`。例如，`Enumerable.Range(100, 5)` 返回从 100 开始的五个数字：100,\
  \ 101, 102, 103 和 104。\n*   `Repeat`—创建一个包含指定次数重复值的 `IEnumerable`。\n*   `SequenceEqual`—如果两个序列相同，则返回\
  \ `true`。\n\nLINQ 还提供了将结果转换为新数据类型的方法。以下列表总结了这些方法。\n\n*   `AsEnumerable`—将结果转换为泛型\
  \ `IEnumerable<T>`\n*   `AsQueryable`—将 `IEnumerable` 转换为 `IQueryable`\n*   `OfType`—移除无法转换为指定类型的项目\n\
  *   `ToArray`—返回数组\n*   `ToDictionary`—使用选择器函数作为键将结果放入 `Dictionary`\n*   `ToList`—返回\
  \ `List<T>`\n*   `ToLookup`—使用选择器函数作为键将结果放入 `System.Linq.Lookup`（一对多字典）\n\n注意 `ToArray`、`ToDictionary`、`ToList`\
  \ 和 `ToLookup` 函数会强制执行查询。\n\n### 扩展方法\n\n正如本章早期提到的，`C#` 并不实际上执行 LINQ 查询。相反，它将查询转换为由扩展方法提供的系列方法调用。虽然\
  \ `C#` 的查询语法通常更易用，但了解这些方法调的形式有时会有帮助。\n\n以下章节解释了这些方法调用的通用形式。它们解释了如何构建方法调用、如何在代码中直接使用这些方法，以及如何扩展\
  \ LINQ 以添加自己的查询方法。\n\n### 基于方法的查询\n\n假设程序定义了一个名为 `customers` 的 `Customer` 对象数组，然后定义了以下查询。\n\
  \n```\nvar query =\n    from customer in customers\n    where customer.Balance <\
  \ 0\n    orderby customer.Balance\n    select new\n    {\n        CustName = customer.FirstName\
  \ + \" \" + customer.LastName,\n        CustBalance = customer.Balance\n    };\n\
  ```\n\n该查询查找余额小于 0 的客户，按 `Balance` 排序，并返回一个可以枚举其名称和余额的结果。\n\n为了执行此选择，`C#` 将查询转换为一系列函数调用，形成一个基于方法的查询，该查询与原始查询执行相同的任务。例如，下面的基于方法的查询返回的结果与原始\
  \ LINQ 查询大致相同：\n\n```\nvar query =\n    customers.Where(OwesMoney).\n    OrderBy(OrderByAmount).\n\
  \    Select(MakeObject);\n```\n\n\n\n\nC# 生成用于评估 LINQ 查询的精确方法调用序列与此处显示的略有不同。此处显示的版本使用了程序中定义的\
  \ `OwesMoney`、`OrderByAmount` 和 `MakeObject` 方法来帮助过滤、排序和选择数据。C# 生成的基于方法的查询使用自动生成的匿名类型和\
  \ lambda 表达式，因此看起来要糟糕得多。\n\n下面的代码显示了 `OwesMoney`、`OrderByAmount` 和 `MakeObject`\
  \ 方法。\n\n```csharp\n// 如果此 Customer 的余额 小于 0，则返回 true。\nprivate bool OwesMoney(Customer\
  \ customer)\n{\n    return customer.Balance < 0;\n}\n\n// 返回 Customer 的余额。这用于结果结果。\n\
  private decimal OrderByAmount(Customer customer)\n{\n    return customer.Balance;\n\
  }\n\n// 用于存储所选 Customer 信息的类。\nclass CustInfo \n{\n    public string CustName {\
  \ get; set; }\n    public decimal CustBalance{ get; set; }\n}\n\n// 创建一个新的 CustInfo\
  \ 对象。\nprivate CustInfo MakeObject(Customer customer, int index)\n{\n    return\
  \ new CustInfo()\n    {\n        CustName = customer.FirstName + customer.LastName,\n\
  \        CustBalance = customer.Balance\n    };\n}\n```\n\n这段代码定义了作为参数传递给查询的 `Where`、`OrderBy`\
  \ 和 `Select` 调用的方法，但 `Where`、`OrderBy` 和 `Select` 是如何定义的呢？它们的调用方式就像是由 `customers`\
  \ 提供的方法，但 `customers` 只是一个 `Customer` 对象的数组，并没有定义这些方法。\n\n事实证明 `Where`、`OrderBy`\
  \ 和 `Select` 是 LINQ 库为 `IEnumerable` 接口添加的扩展方法。数组实现了该接口，因此获得了这些扩展方法。\n\n同样，LINQ\
  \ 为 `IEnumerable` 接口添加了其他扩展方法，如 `Any`、`All`、`Average`、`Count`、`Distinct`、`First`、`GroupBy`、`OfType`、`Repeat`、`Sum`、`Union`\
  \ 等。\n\n### 使用 Lambda 函数的基于查询\n\nLambda 表达式使得构建基于方法的查询变得容易。当你使用 lambda 表达式时，不需要定义单独的方法作为\
  \ `Where`、`OrderBy` 和 `Select` 等 LINQ 方法的参数。相反，你可以直接将 lambda 表达式传递到方法中。\n\n下面的代码显示了之前基于方法的查询的修订版本。在这里，方法体以\
  \ lambda 表达式的形式包含。\n\n```csharp\nvar query =\n    customers.Where(customer => customer.Balance\
  \ < 0).\n    OrderBy(customer => customer.Balance).\n    Select(customer => new\
  \ CustInfo()\n        {\n            CustName = customer.FirstName + \" \" + customer.LastName,\n\
  \            CustBalance = customer.Balance\n        }\n    );\n```\n\n这种方式更加简洁，因为它不需要你构建单独的方法，但它可能更难阅读和理解。向\
  \ `Where` 或 `OrderBy` 方法传递简单的 lambda 表达式可能不会太令人困惑，但如果你需要执行复杂的测试，可能编写单独的方法会更好。\n\n\
  无论你使用方法还是 lambda 表达式，标准的 LINQ 查询语法通常更容易理解，因此你可能更倾向于尽可能使用该版本。遗憾的是，许多参考资料描述 LINQ 扩展方法时，就像你将在基于方法的查询中使用它们一样，而不是在\
  \ LINQ 查询中使用。例如，在 [msdn.microsoft.com/library/bb534966.aspx](http://msdn.microsoft.com/library/bb534966.aspx)\
  \ 对 `OrderBy` 方法的描述包含了以下定义：\n\n```csharp\npublic static IOrderedEnumerable<TSource>\
  \ OrderBy<TSource, TKey>(\n        this IEnumerable<TSource> source,\n        Func<TSource,\
  \ TKey> keySelector\n)\n```\n\n这个声明非常令人困惑，但如果你必须这样做，你可以理解它的。在这种情况下，该声明意味着：\n\n*\
  \   方法名为 `OrderBy`。\n*   它接受两个泛型类型参数：`TSource` 和 `TKey`。\n*   方法的返回值类型为 `IOrderedEnumerable<TSource>`。\n\
  *   方法扩展了 `IEnumerable<TSource>`。\n*   方法接受一个参数 `Func<TSource, TKey>`。\n\n关于扩展方法的更多信息，请参见\
  \ 第 6 章 中的“扩展方法”部分。关于泛型的更多信息，请参见 第 15 章。\n\n如前所述，C# 的 LINQ 查询语法通常更容易理解。你唯一需要使用这种更困惑的方法样式语法的场景是你想要添加自己的\
  \ LINQ 扩展。下一节解释了如何编写扩展方法来为 LINQ 添加新功能。\n\n### 扩展 LINQ\n\nLINQ 查询返回某种 `IEnumerable`\
  \ 对象。（实际上，它们返回某种 `SelectIterator` 实体，但结果实现了 `IEnumerable`。）结果中的项目可能可能是简单类型，如 `int`、`string`\
  \ 或 `Customer` 对象，也可能是某种将多个所选字段分组在一起的奇特匿名类型。无论项目是什么，结果都是某种 `IEnumerable`。\n\n由于结果是\
  \ `IEnumerable`，你可以通过为 `IEnumerable` 创建扩展方法来向结果中添加新方法。\n\n例如，下面的代码定义了一个标准差函数。它扩展了\
  \ `IEnumerable<decimal>` 接口，因此它适用于获取 `decimal` 值的 LINQ 查询结果。\n\n```csharp\npublic\
  \ static class MyLinqExtensions\n{\n    // 返回 IEnumerable<decimal> 中值的标准差。\n   \
  \ public static decimal StdDev(this IEnumerable<decimal> source)\n    {\n      \
  \  // 获取总和。\n        decimal total = source.Sum();\n\n        // 计算平均值。\n      \
  \  decimal mean = total / source.Count();\n\n        // 计算偏差的和。\n        var deviationsSquared\
  \ =\n            from value in source\n            select (value - mean) * (value\
  \ - mean);\n        decimal totalDeviationsSquared = deviationsSquared.Sum();\n\
  \        // 返回标准差。\n        return (decimal)Math.Sqrt((double)\n            totalDeviationsSquared\
  \ / (source.Count() - 1));\n    }\n}\n```\n\n现在可以将此方法应用于 LINQ 查询的结果。下面的代码使用 LINQ\
  \ 查询从 `customers` 数组中选择小于 0 的 `Balance`。然后它调用 `StdDev` 扩展方法并显示结果。\n\n```csharp\n\
  var query =\n    from customer in customers\n    where customer.Balance < 0\n  \
  \  select customer.Balance;\nConsole.WriteLine(query.StdDev());\n```\n\n下面的代码在不存储中间变量的情况下执行相同的操作：\n\
  \n```csharp\nConsole.WriteLine(\n    (from customer in customers\n     where customer.Balance\
  \ < 0\n     select customer.Balance).StdDev());\n```\n\n### LINQ to Objects\n\n\
  LINQ to Objects 是指从 LINQ 扩展的对象提取数据的方法。这些方法扩展了 `IEnumerable`，因此适用于实现 `IEnumerable`\
  \ 的任何类，包括数组、`Dictionary`、`HashSet`、`LinkedList`、`Queue`、`SortedDictionary`、`SortedList`、`Stack`\
  \ 等。\n\n本章之前的所有示例都使用了 LINQ to Objects，因此本节不再对其进行详细说明。请参见之前的章节获取更多信息。\n\n### LINQ\
  \ to XML\n\nLinq to XML 是指在 XML 对象和其他数据包含对象之间移动数据的方法。例如，使用 LINQ to XML 可以从数组中选择客户数据并用它构建\
  \ XML 文档。第 24 章 解释了 C# 程序处理 XML 的通用方法。接下来的部分描述了 LINQ to XML 方法。\n\nLINQ 自带一套 XML\
  \ 元素。这些类位于 `System.Xml.Linq` 命名空间，与 `System.Xml` 命名空间中的类似类对应；尽管它们的名称是以 `X` 而不是 `Xml`\
  \ 开头。例如，`System.Xml.Linq.XElement` 类对应于 `System.Xml.XmlElement`。\n\n\n\n\nLINQ 的\
  \ XML 类提供了与 `System.Xml` 版本许多相同的功能，同时它们提供了对 LINQ 特性的支持。\n\n本节将解释如何轻松地在程序中包含 XML\
  \ 数据。随后的两个部分描述了使用 LINQ 将数据移入和移出 XML 对象的方法。\n\n### XML 字面量 (XML Literals)\n\nC# 不支持\
  \ XML 字面量，因此你无法直接在程序中输入 XML 数据。然而，你可以向 XML 对象的 `Parse` 方法传递一个包含 XML 数据的字符串。如果你在字符串前加上\
  \ `@` 字符，该字符串甚至可以跨多行。\n\n例如，以下代码创建了一个包含 `<Employees>` 元素的 `XElement` 对象，该元素内部有三个\
  \ `<Employee>` 元素。\n\n```\n// Read the XElement.\nXElement xelement = XElement.Parse(\n\
  @\"<Employees>\n    <Employee FirstName=\"\"Ann\"\" LastName=\"\"Archer\"\"/>\n\
  \    <Employee FirstName='Ben' LastName='Baker'/>\n    <Employee>\n      <FirstName>Cindy</FirstName>\n\
  \      <LastName>Cant</LastName>\n    </Employee>\n  </Employees>\n\");\n```\n\n\
  这三个 `<Employee>` 元素演示了三种为元素 `FirstName` 和 `LastName` 赋值的方法。第一种使用两对双引号来表示数据中的引号。当\
  \ C# 编译器在引引字符串内部看到两对双引号时，它会在字符串数据中放置一个单双引号。\n\n第二个 `<Employee>` 使用单引号来界定其名称值。XML\
  \ 数据可以使用单引号或双引号来界定值。使用单引号比使用双引号对会让 C# 代码更易读得多。\n\n前两个 `<Employee>` 元素将它们的 `FirstName`\
  \ 和 `LastName` 值存储在属性中。第三个 `<Employee>` 则将其值存储在子元素中。\n\n使用 `System.Xml` 对象构建相同的\
  \ XML 层级结构将花费更多工作。你需要编写代码来创建 `<Employees>` 元素。然后你需要编写代码来创建每个 `<Employee>` 元素。你需要添加代码来设置前两个\
  \ `<Employees>` 元素的 `FirstName` 和 `LastName` 属性，并且需要添加代码创建最后一个 `<Employee>` 元素的\
  \ `FirstName` 和 `LastName` 子元素。\n\n这些操作都相当直观，但很繁琐。解析字符串要简单得多。因为字符串展示了 XML 数据的结构，所以解析也更加直观。\n\
  \n### LINQ 到 XML (LINQ into XML)\n\nLINQ 的 XML 类提供了构造函数，让你能够容易地构建 XML 文档。每个构造函数的参数列表都以参数数组结束，因此你可以传递任意数量的项目。\n\
  \n构造函数还知道如何处理不同类型的参数。例如，如果你将一个 `XElement` 传递给另一个 `XElement` 的构造函数，那么第一个元素就会第二个元素的元素。如果你将一个\
  \ `XAttribute` 对象传递给 `XElement` 的构造函数，那么该 `XAttribute` 对象就会成为该 `XElement` 的属性。\n\
  \n这让你能够以相当直观的方式构建 XML 结构。以下代码展示了如何使用构造函数构建之前的 XML 片段。\n\n```\nXElement employees\
  \ = new XElement(\"Employees\",\n    new XElement(\"Employee\",\n        new XAttribute(\"\
  FirstName\", \"Ann\"),\n        new XAttribute(\"LastName\", \"Archer\")\n    ),\n\
  \    new XElement(\"Employee\",\n        new XAttribute(\"FirstName\", \"Ben\"),\n\
  \        new XAttribute(\"LastName\", \"Baker\")\n    ),\n    new XElement(\"Employee\"\
  ,\n        new XElement(\"FirstName\", \"Cindy\"),\n        new XElement(\"LastName\"\
  , \"Cant\")\n    )\n);\n```\n\n代码首先创建 `<Employees>` 元素。它向该对象的构造函数传递了三个 `<Employee>`\
  \ `XElement` 对象，使它们成为 XML 文档中的子元素。\n\n代码向第一个和第二个 `<Employee>` 元素的构造函数传递了两个 `XAttribute`\
  \ 对象，这些对象这些元素的属性。\n\n第三个 `<Employee>` 元素的构造函数接收两个额外的 `XElement` 对象作为参数，以便该元素以独立的元素形式存储其\
  \ `FirstName` 和 `LastName` 值。\n\n这种使用构造函数构建 XML 文档的技术被称为**函数式构造 (functional construction)**。\n\
  \n结果与上一节中解析 XML 文本得到的结果相同。图 8-1 显示了一个显示 `employees` 对象 `ToString` 方法结果的对话框。\n\n\
  ![c08f001.tif](img/c08f001.png)\n\n图 8-1: 函数式构造让你能够相对容易且直观地构建 XML 文档。\n\n函数式构造相当直观，但正如上一节所示，它仍然没有解析\
  \ XML 文本简单。然而，函数式构造有一个优势：如果你向 XML 类的构造函数传递一个实现了 `IEnumerable` 的对象，构造函数会枚举该对象并将其包含的所有项目以适当的方式添加到\
  \ XML 层级结构中。这意味着你可以使用 LINQ 查询来创建 XML 结构的片段。\n\n例如，假设程序有一个名为 `employees` 的数组，其中包含\
  \ `Employee` 对象。以下代码使用 LINQ 和函数式构造构建了一个包含每个 `Employee` 对象元素的 XML 片段。\n\n```\n//\
  \ Use LINQ to create a list of <Employee> elements.\nvar makeEmployees =\n    from\
  \ employee in employees\n    select new XElement(\"Employee\",\n        new XAttribute(\"\
  FirstName\", employee.FirstName),\n        new XAttribute(\"LastName\", employee.LastName));\n\
  \n// Create the XML document.\nXElement document = new XElement(\"Employees\", makeEmployees);\n\
  ```\n\n代码从一个 LINQ 查询开始，从 `employees` 数组中选择信息。数组中的每个 `Employee`，查询创建一个 `XElement`。它使用\
  \ `Employee` 对象的 `FirstName` 和 `LastName` 属性创建 `XAttribute` 对象。\n\n你甚至可以将 LINQ 查询直接包含在顶层构造函数内部，如下所示。\n\
  \n```\nXElement document2 = new XElement(\"Employees\",\n    from employee in employees\n\
  \    select new XElement(\"Employee\",\n        new XAttribute(\"FirstName\", employee.FirstName),\n\
  \        new XAttribute(\"LastName\", employee.LastName)));\n```\n\n### LINQ 出 XML\
  \ (LINQ out of XML)\n\nLINQ XML 对象提供了标准的 LINQ 方法，使得将这些对象移动到 `IEnumerable` 对象变得简单。使用这些函数，从\
  \ XML 对象中选择数据变得从数组和列表等 `IEnumerable` 对象中简单。\n\nXML 对象表示层级数据。为了方便使用这些数据，XML 类还提供了帮助你搜索这些数据层级的方法。例如，`XElement`\
  \ 对象提供了 `Descendants` 方法，用于在对象的后代中搜索特定类型的元素。\n\n例如，以下代码搜索名为 `document` 的 `XElement`\
  \ 中名为“Employee”的后代，并显示它们的 `FirstName` 和 `LastName` 属性。\n\n```\nvar selectEmployee\
  \ =\n    from employee in document.Descendants(\"Employee\")\n    select new\n \
  \   {\n        FirstName = employee.Attribute(\"FirstName\").Value,\n        LastName\
  \ = employee.Attribute(\"LastName\").Value\n    };\nforeach (var obj in selectEmployee)\n\
  \    Console.WriteLine(obj.FirstName + \" \" + obj.LastName);\n```\n\n\n\n\n\n下表描述了\
  \ `XElement` 支持的其他方法，程序可以使用这些方法遍历 XML 层次结构。这些方法中的大多数返回 `IEnumerable` 对象，你可以在 LINQ\
  \ 查询中使用这些对象。\n\n| 函数 | 返回值 |\n| :--- | :--- |\n| `Ancestors` | 包含元素所有祖先的 `IEnumerable`。\
  \ |\n| `AncestorsAndSelf` | 包含此元素及其所有祖先的 `IEnumerable`。 |\n| `Attribute` | 具有特定名称元素的属性。\
  \ |\n| `Attributes` | 包含元素属性的 `IEnumerable`。 |\n| `Descendants` | 包含元素所有后代的 `IEnumerable`。\
  \ |\n| `DescendantsAndSelf` | 包含此元素及其所有后代的 `IEnumerable`。 |\n| `DescendantNodes`\
  \ | 包含元素所有后代节点的 `IEnumerable`。这些节点包括如 `XElement` 和 `XText` 等。 |\n| `DescendantNodesAndSelf`\
  \ | 包含此元素及其所有后代节点的 `IEnumerable`。 |\n| `Element` | 具有特定名称的子元素。 |\n| `Elements` |\
  \ 包含元素直接子元素的 `IEnumerable`。 |\n| `ElementsAfterSelf` | 包含位于此元素之后的兄弟元素的 `IEnumerable`。\
  \ |\n| `ElementsBeforeSelf` | 包含位于此元素之前的兄弟元素的 `IEnumerable`。 |\n| `Nodes` | 包含元素直接子节点的\
  \ `IEnumerable`。这些节点包括如 `XElement` 和 `XText` 等。 |\n| `NodesAfterSelf` | 包含位于此元素之后的兄弟节点的\
  \ `IEnumerable`。 |\n| `NodesBeforeSelf` | 包含位于此元素之前的兄弟节点的 `IEnumerable`。 |\n\n大多数返回\
  \ `IEnumerable` 的方法都接受一个可选参数，指示要选择的元素名称。例如，如果你向 `Descendants` 函数传递参数“Customer”，该函数将仅返回名为“Customer”的元素后代。\n\
  \n## LINQ to ADO.NET\n\nLINQ to ADO.NET 提供了相关工具，允许你将 LINQ 风格的查询应用于用于 ADO.NET 存储和交互关系数据的对象上。LINQ\
  \ to ADO.NET 包含三个组件：LINQ to SQL、LINQ to Entities 和 LINQ to DataSet。接下来的章节简要介绍了这三个部分的额外详细信息。\n\
  \n### LINQ to SQL and LINQ to Entities\n\nLINQ to SQL 和 LINQ to Entities 是对象关系映射（O/RM）工具，用于构建构建数据库的强类型类。它们生成类来表示数据库及其包含的表。这些类提供的\
  \ LINQ 功能允许程序查询数据模型对象。\n\n例如，要为 LINQ to SQL 构建一个数据库模型，请选择 `Project ⇒ Add New Item`\
  \ 命令并添加新的 LINQ to SQL Classes 项。这将打开一个设计器，你可以在其中定义数据库的结构。\n\n如果你安装并运行了 SQL Server，可以从服务器资源管理器（Server\
  \ Explorer）拖放 SQL Server 数据库对象来构建数据库模型。如果你将数据库的所有表拖到设计器中，你应该能看到所有的表及其字段、主键、关系和其他结构信息。（或者，你也可以使用设计器的工具自己构建数据模型，而不是从数据库结构开始构建模型。）\n\
  \n当你创建数据模型时，LINQ to SQL 会创建相应的类来表示数据库及其表。例如，它定义了一个继承自 `DataContext` 的类来表示数据库。如果你将数据模型命名为\
  \ `SalesInfo`，LINQ to SQL 会定义类 `SalesInfoDataContext` 来表示数据库。\n\n现在，假设程序创建了该类的实例并命名为\
  \ `db`。下面的代码将从数据库的 `Customers` 表中所有按名称排序的记录：\n\n```\nvar query =\n    from customer\
  \ in db.Customers\n    orderby customer.FirstName, customer.LastName\n    select\
  \ new { customer.FirstName, customer.LastName };\n```\n\nMicrosoft 的意图让 LINQ to\
  \ SQL 成为快速构建用于 SQL Server 数据库的启用 LINQ 类工具。设计器可以获取一个 SQL Server 数据库，为其构建模型，然后创建必要的类。\n\
  \nLINQ to Entities 支持针对 Entity Framework 数据模型编写查询。Entity Framework 旨在用于比 LINQ to\
  \ SQL 更复杂的企业级场景。它允许额外的抽象，从而将数据对象模型与底层数据库解耦。例如，Entity Framework 允许将单个概念对象的各个部分存储在多个数据库表中。\n\
  \n构建和管理 SQL Server 数据库以及 Entity Framework 的主题过于广泛，本书无法涵盖，因此此处不再详细描述 LINQ to SQL\
  \ 和 LINQ to Entities。有关更多信息，请参阅在线帮助或 Microsoft 网站。Microsoft 的相关网页包括：\n\n*   LINQ\
  \ to SQL ([msdn.microsoft.com/bb386976.aspx](http://msdn.microsoft.com/bb386976.aspx))\n\
  *   LINQ to Entities ([msdn.microsoft.com/library/bb386964.aspx](http://msdn.microsoft.com/library/bb386964.aspx))\n\
  *   LINQ to SQL: .NET Language-Integrated Query for Relational Data ([msdn.microsoft.com/bb425822.aspx](http://msdn.microsoft.com/bb425822.aspx))\n\
  *   Data Developer Center ⇒ Learn ⇒ Entity Framework ([msdn.microsoft.com/en-US/data/ef](http://msdn.microsoft.com/en-US/data/ef))\n\
  \n### LINQ to DataSet\n\nLINQ to DataSet 让程序可以使用 LINQ 风格的查询从 `DataSet` 对象中选择数据。`DataSet`\
  \ 包含关系型表中包含数据的内存表示。`DataSet` 对象本身并没有提供许多 LINQ 功能。它之所以有用，是因为它持有 `DataTable` 对象来表示项目的的分组，就像\
  \ `IEnumerable` 对象一样。\n\n`DataTable` 类也不直接支持 LINQ，但它有一个 `AsEnumerable` 方法，可以将 `DataTable`\
  \ 转换为 `IEnumerable`，而你已经知道它是支持 LINQ 的。\n\n在书籍网站上下载的 `LinqToDataSetScores` 示例程序演示了几种\
  \ LINQ to `DataSet` 技术。该程序构建了一个包含两个表的 `DataSet`。`Students` 表具有 `StudentId`、`FirstName`\
  \ 和 `LastName` 字段。`TestScores` 表具有 `StudentId`、`TestNumber` 和 `Score` 字段。表的 `StudentId`\
  \ 字段提供了两个表之间的链接。\n\n该程序使用以下代码获取表示表的 `DataTable` 对象的引用。\n\n```c\n// 获取表的引用。\nDataTable\
  \ studentsTable = testScoresDataSet.Tables[\"Students\"];\nDataTable scoresTable\
  \ = testScoresDataSet.Tables[\"TestScores\"];\n```\n\n然后，程序使用以下代码按字母顺序中 `LastName`\
  \ 在“F”之前的学生名称：\n\n```csharp\nvar namesBeforeFQuery =\n    from student in studentsTable.AsEnumerable()\n\
  \    where (student.Field<string>(\"LastName\").CompareTo(\"F\") < 0)\n    orderby\
  \ student.Field<string>(\"LastName\")\n    select new\n    {\n        FirstName\
  \ = student.Field<string>(\"FirstName\"),\n        LastName = student.Field<string>(\"\
  LastName\")\n    };\nnamesBeforeDDataGrid.DataSource = namesBeforeFQuery.ToList();\n\
  ```\n\n此查询与之前的 LINQ 查询相比只有几处不同。首先，`from` 子句调用了 `DataTable` 对象的 `AsEnumerable` 方法将表转换为支持\
  \ LINQ 的类型。\n\n其次，`student.Field<string>(\"FirstName\")` 语法允许查询访问 `student` 对象中的\
  \ `LastName` 字段。（`student` 对象是 `DataTable` 中的一个 `DataRow`。）\n\n\n\n\n最后，示例中的最后一行代码将\
  \ `DataGrid` 控件的 `DataSource` 属性设置为查询返回的结果，以便控件显示结果。`DataGrid` 控件无法显示 `IEnumerable`\
  \ 结果，因此代码调用了 `ToList` 方法将结果转换为列表，`DataGrid` 即可使用该列表。\n\n以下列表总结了 LINQ to DataSet\
  \ 查询与普通 LINQ to Objects 查询之间的主要区别：\n\n- LINQ to DataSet 查询必须使用 `DataTable` 对象的 `AsEnumerable`\
  \ 方法使对象变为可查询。\n- 代码可以访问 `DataRow` 中的字段，如 `student.Field<string>(\"LastName\")`。\n\
  - 如果你想在绑定控件（如 `DataGrid` 或 `ListBox`）中显示查询结果，请使用查询的 `ToList` 方法。\n\n如果你理解了这些差异，查询的其余部分与\
  \ LINQ to Objects 使用的类似。下面的代码展示了程序演示的第二个查询：\n\n```\n// 选择所有学生及其分数。\nvar allScoresQuery\
  \ =\n    from student in studentsTable.AsEnumerable()\n    join score in scoresTable.AsEnumerable()\n\
  \        on student.Field<int>(\"StudentId\") equals score.Field<int>(\"StudentId\"\
  )\n    orderby student.Field<int>(\"StudentId\"), score.Field<int>(\"TestNumber\"\
  )\n    select new\n    {\n        ID = student.Field<int>(\"StudentId\"),\n    \
  \    Name = student.Field<string>(\"FirstName\") + \" \" +\n            student.Field<string>(\"\
  LastName\"),\n        Test = score.Field<int>(\"TestNumber\"),\n        Score =\
  \ score.Field<int>(\"Score\")\n    };\nallScoresDataGrid.DataSource = allScoresQuery.ToList();\n\
  ```\n\n该查询从 `Students` 表中选择记录，将其与 `TestScores` 表中相应记录连接，并按学生 ID 和测试编号对结果进行排序。它选择了学生\
  \ ID、名、姓、测试编号和分数。然后将查询结果显示在 `allScoresDataGrid` 控件中。\n\n下面的代码展示了一个更复杂的示例。\n\n```\n\
  // 创建一个函数将数字成绩转换为字母等级成绩。\nFunc<double, string> letterGrade = score =>\n{\n    if\
  \ (score >= 90) return \"A\";\n    if (score >= 80) return \"B\";\n    if (score\
  \ >= 70) return \"C\";\n    if (score >= 60) return \"D\";\n    return \"F\";\n\
  };\n\n// 显示 A 等学生的姓名、平均分和等级。\nvar aStudents =\n    from student in studentsTable.AsEnumerable()\n\
  \    join score in scoresTable.AsEnumerable()\n        on student.Field<int>(\"\
  StudentId\") equals score.Field<int>(\"StudentId\")\n    group score by student\
  \ into studentGroup\n    where studentGroup.Average(s => s.Field<int>(\"Score\"\
  )) >= 90\n    orderby studentGroup.Average(s => s.Field<int>(\"Score\")) descending\n\
  \    select new\n    {\n        Name = studentGroup.Key.Field<string>(\"FirstName\"\
  ) + \" \" +\n               studentGroup.Key.Field<string>(\"LastName\"),\n    \
  \    Average = studentGroup.Average(s => s.Field<int>(\"Score\")),\n        Grade\
  \ = letterGrade(studentGroup.Average(s => s.Field<int>(\"Score\")))\n    };\naStudentsDataGrid.DataSource\
  \ = aStudents.ToList();\n```\n\n这段代码首先定义了一个 `Func<double, string>` 委托，并将其赋值一个将数字成绩转换为字母等级成绩的\
  \ Lambda 表达式。\n\n接下来，代码定义了一个查询，从 `Students` 和 `TestScores` 表中选择相应的记录。它按 `student`\
  \ 对记录进行分组，因此特定 `student` 的记录被收集到一个名为 `studentGroup` 的组中。\n\n`where` 子句使用 `studentGroup`\
  \ 的 `Average` 方法计算组内 `Score` 值的平均值。（`studentGroup` 中的项是某个 `student` 的 `TestScore`\
  \ 记录。该语句取这些 `TestScore` 对象中 `Score` 字段的平均值。）`where` 子句随后筛选出测试成绩平均分至少 90 的记录。\n\n\
  `orderby` 子句按学生的平均分对结果进行排序。\n\n最后，`select` 子句选择了学生的名、姓、平均测试分数，以及转换为字母等级成绩的平均测试分数。\n\
  \n代码段以在 `aStudentsDataGrid` 控件中显示结果而结束。图 8-2 显示了程序显示这些信息。\n\n![c08f002.tif](img/c08f002.png)\n\
  \n图 8-2: 示例程序 LinqToDataSetScores 显示了（包括）A 等学生的姓名、测试平均分和字母等级。\n\nLINQ to DataSet\
  \ 不仅允许你从 `DataSet` 中提取数据，还提供了将数据放入 `DataSet` 的方法。如果查询选择了 `DataRow` 对象，查询的 `CopyToDataTable`\
  \ 方法会将查询结果转换为一个新的 `DataTable` 对象，然后你可以将其添加到 `DataSet`。下面的代码演示了这种技术。\n\n```\n// 创建一个新表。\n\
  var newTableQuery =\n    from student in studentsTable.AsEnumerable()\n    where\
  \ student.Field<string>(\"LastName\").CompareTo(\"D\") < 0\n    select student;\n\
  DataTable newTable = newTableQuery.CopyToDataTable();\nnewTable.TableName = \"NewTable\"\
  ;\nDataSet testDataSet = new DataSet();\ntestDataSet.Tables.Add(newTable);\nnewTableDataGrid.DataSource\
  \ = newTable;\n```\n\n## PLINQ\n\n并行 LINQ（PLINQ，读作“plink”）允许程序跨多个处理器或核心执行 LINQ 查询。如果你有多个核心且查询是良好并行的，PLINQ\
  \ 可能会提高你的性能。\n\n什么样的查询是“良好并行的”？简单短的回答是，“这其实并不重要。”微软已尽力减少 LINQ 的开销，因此使用 PLINQ 对某些查询可能有帮助且不会对你产生太大影响。\n\
  \n从数据源选择简单查询通常并行良好。如果项可以独立地检查、选择和处理，那么该查询是可以并行的。\n\n必须同时使用多个项的查询并行效率不高。例如，在查询中添加\
  \ `orderby` 子句会强制程序收集所有结果并排序，这部分查询无法从 PLINQ 中受益。\n\n在 LINQ 中添加并行非常简单。只需对要搜索的可枚举对象添加\
  \ `AsParallel` 调用。FindPrimes 示例程序（可以在书籍网站下载）使用 PLINQ 寻找素数。程序使用了以下 `IsPrime` 方法：\n\
  \n```c\nprivate static bool IsPrime(int number)\n{\n    if (number % 2 == 0) return\
  \ false;\n    for (int i = 3; i * i <= number; i += 2)\n        if (number % i ==\
  \ 0) return false;\n    return true;\n}\n```\n\n程序在下面的 PLINQ 查询中使用 `IsPrime` 方法。对\
  \ `AsParallel` 的调用已**加粗**。\n\n```csharp\nvar primes =\n    from number in Enumerable.Range(2,\
  \ maxNumber).AsParallel()\n    where IsPrime(number)\n    select number;\n```\n\n\
  程序对带有和不带 `AsParallel` 的查询进行了计时。在我的双核系统上，没有 `AsParallel` 的查询查找 2 到 1000 万之间的所有素数大约需要\
  \ 12.38 秒。使用 PLINQ，程序仅需 7.34 秒。由于管理并行线程存在某些开销，这比非并行版本快了一半，但对于很少额外的代码输入来说，这仍然是一个不错的速度提升。\n\
  \n\n\nLINQ to Objects 允许你对数组、列表以及其他实现 `IEnumerable` 接口的对象查询。\n\nLINQ to XML 和 `LINQ\
  \ XML` 类允许你使用 LINQ 从 XML 层次结构中提取数据。你可以通过解析文本或使用函数式构造来生成 XML 文档。\n\nLINQ to ADO.NET（包含\
  \ `LINQ to SQL`、`LINQ to Entities` 和 `LINQ to DataSet`）允许程序对表示关系数据库中数据的对象执行查询。这些\
  \ LINQ 工具共同让程序能够以强大的新方式选择数据。\n\n如果你拥有一个多核系统，`PLINQ` 有时可以在你只需付出极少努力的情况下加速你的 LINQ\
  \ 查询。\n\n有关各种 LINQ 技术的更多信息，请参阅在线帮助和 Web 上的资源。以下列表包含了一些有用的 Microsoft 网页，你可以访问这些页面以学习更多关于\
