  \ `A = A | B`。\n\n如果 `&&=` 存在，它将是一个条件 `And` 运算符。假设 `A` 和 `B` 是 `bool` 类型。那么 `A &&=\
  \ B` 将检查 `A`。如果 `A` 为 `false`，则保持不变。如果 `A` 为 `true`，程序将设置 `A = A & B`。\n\n这将提供一些好处，因为它们在必要之前不会评估\
