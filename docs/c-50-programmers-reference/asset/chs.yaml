  \ | 返回驱动器上的总可用空间大小（字节）。 | True |\n| `TotalSize` | 返回驱动器上的总空间大小（字节）。 | True |\n|\
  \ `VolumeLabel` | 获取或设置驱动器的卷标。 | True |\n\n### DirectoryInfo\n\n`DirectoryInfo`\
  \ 对象代表一个目录。下表总结了它最用的属性和方法。\n\n| Property or Method | Purpose |\n| :--- | :--- |\n\
