  \ `FileStream`。 |\n| `OpenText` | 返回一个带有 UTF-8 编码并附加到文件的 `StreamReader` 用于读取。 |\n\
  | `OpenWrite` | 返回一个附加到该文件的只写 `FileStream`。 |\n| `Refresh` | 刷新 `FileInfo` 对象的数据。例如，如果文件在对象创建后被访问过，则你必须调用\
  \ `Refresh` 来加载新的 `LastAccessTime` 值。 |\n| `Replace` | 用此文件替换目标文件，并将旧目标重命名为备份副本。如果备份文件已存在，则将其将其删除并替换为目标文件。\
  \ |\n| `ToString` | 返回文件的完整名称。 |\n\n### FileSystemWatcher\n\n`FileSystemWatcher`\
  \ 类允许应用程序监控文件或目录的变化。下表总结了它最有用的属性。\n\n| **属性** | **用途** |\n| :--- | :--- |\n| `EnableRaisingEvents`\
  \ | 确定组件是否启用。注意，此属性默认为 `false`，因此在将其设置为 `true` 之前，监视器不会引发任何事件。 |\n| `Filter` | 确定监视器报告事件的文件。你不能像\
  \ `*.txt` 和 `*.dat` 那样监控多种文件类型。相反，请使用多个 `FileSystemWatcher`。如果你愿意，可以使用 `AddHandler`\
  \ 让所有 `FileSystemWatcher` 使用相同的事件处理程序。 |\n| `IncludeSubdirectories` | 确定对象是否监控主路径下的子目录。\
  \ |\n| `InternalBufferSize` | 确定内部缓冲区的大小。如果监视器正在监控一个活动目录，较小的缓冲区可能会溢出。 |\n| `NotifyFilter`\
  \ | 确定监视器报告的变化类型。这是 `NotifyFilters` 枚举定义的值的组合，可以包括 `Attributes`、`CreationTime`、`DirectoryName`、`FileName`、`LastAccess`、`LastWrite`、`Security`\
  \ 和 `Size`。 |\n| `Path` | 确定要监控的路径。 |\n\n下表总结了 `FileSystemWatcher` 类两个最有用的方法。\n\n\
  | **方法** | **用途** |\n| :--- | :--- |\n| `Dispose` | 释放对象使用的资源。 |\n| `WaitForChanged`\
  \ | 同步等待目标文件或目录的变化。 |\n\n下表总结了类的事件。\n\n| **名称** | **描述** |\n| :--- | :--- |\n| `Changed`\
  \ | 文件或子目录发生了变化。 |\n| `Created` | 创建了文件或子目录。 |\n| `Deleted` | 删除了文件或子目录。 |\n| `Error`\
  \ | 监视器的内部缓冲区溢出。 |\n| `Renamed` | 文件或子目录被重命名了。 |\n\n### Path\n\n`Path` 类提供了静态属性和方法，你可以用它们处理路径。下表总结了它最有用的公共属性。\n\
  \n| **属性** | **用途** |\n| :--- | :--- |\n| `AltDirectorySeparatorChar` | 返回用于在层次路径中分隔目录层级的替代字符（通常为\
  \ `/`）。 |\n| `DirectorySeparatorChar` | 返回用于在层次路径中分隔目录层级的字符（通常为 `\\`，如 `C:\\Tests\\\
  Billing\\2010q2.dat`）。 |\n| `InvalidPathChars` | 返回一个字符数组，包含路径字符串中不允许的字符。通常，此数组包含如\
  \ `\"`、`<`、`>` 和 `&#124;` 等字符，以及 ASCII 值在 0 到 31 之间的不可打印字符。 |\n| `PathSeparator`\
  \ | 返回用于在环境变量分隔分隔字符串的字符（通常为 `;`）。 |\n| `VolumeSeparatorChar` | 返回卷号和路径其余部分之间的字符（通常为\
  \ `:`，如 `C:\\Tests\\Billing\\2010q2.dat`）。 |\n\n下表总结了 `Path` 类最有用的方法。\n\n| **方法**\
  \ | **用途** |\n| :--- | :--- |\n| `ChangeExtension` | 更改路径的扩展名。 |\n| `Combine` |\
  \ 返回连接后的两个路径字符串。这不会像 `GetFullPath` 方法那样简化结果。 |\n| `GetDirectoryName` | 返回路径的目录。\
  \ |\n| `GetExtension` | 返回路径的扩展名。 |\n| `GetFileName` | 返回路径的文件名和扩展名。 |\n| `GetFileNameWithoutExtension`\
  \ | 返回不带扩展名的文件名。 |\n| `GetFullPath` | 返回路径的完整值。这对于将部分相对路径转换为绝对路径特别有用。例如，语句 `Path.GetFullPath(\"\
  C:\\Tests\\OldTests\\Software\\..\\New\\Code\")` 返回 `C:\\Tests\\New\\Code`。 |\n\
  | `GetInvalidFileNameChars` | 返回一个字符数组，包含文件名中不允许的字符。 |\n| `GetPathRoot` | 返回路径的根目录字符串。例如，语句\
  \ `Path.GetPathRoot(\"C:\\Invoices\\Unpaid\\Deadbeats\")` 返回 `C:\\`。 |\n| `GetRandomFileName`\
  \ | 返回一个随机文件名。 |\n| `GetTempFileName` | 创建一个唯一命名的空临时文件并返回其完整路径。程序可以打开该文件作为临时空间，执行需要的操作，关闭文件然后将其删除。典型的文件名可能是\
  \ `C:\\Users\\Rod\\AppData\\Local\\Temp\\tmpFCC6.tmp`。 |\n| `GetTempPath` | 返回系统临时文件夹的路径。这是\
  \ `GetTempFileName` 返回的文件名的路径部分。 |\n| `HasExtension` | 如果路径包含扩展名则返回 `true`。 |\n\
  | `IsPathRooted` | 如果路径是绝对路径则返回 `true`。包括 `\\Temp\\Wherever` 和 `C:\\Clients\\Litigation`，但不包括\
  \ `Temp\\Wherever` 或 `..\\Uncle`。 |\n\n### SpecialFolders\n\n`System.Environment.SpecialFolder`\
  \ 枚举定义了 `SpecialFolder` 对象，代表 `MyDocuments`、`History` 和 `CommonProgramFiles` 等文件夹。使用\
  \ `SpecialFolder` 对象的 `ToString` 方法获取文件夹的名称。使用 `Environment.GetFolderPath` 获取目录的路径。\n\
  \n以下代码列出了特殊文件夹。\n\n\n\n\n\n```cs\nforeach (Environment.SpecialFolder folderType\n\
  \    in Enum.GetValues(typeof(Environment.SpecialFolder)))\n{\n    Console.WriteLine(\n\
  \        String.Format(\"{0,-25}{1}\",\n            folderType.ToString(),\n   \
  \         Environment.GetFolderPath(folderType)\n        )\n    );\n}\n```\n\n##\
  \ 回收站\n\nC# 没有提供用于处理回收站的工具，但你可以通过使用三种技术的组合来管理回收站：使用 `FileIO.FileSystem` 类、使用 API\
  \ 函数以及使用 `Shell32.Shell`。\n\n### FileIO.FileSystem\n\n`Microsoft.VisualBasic.FileIO`\
  \ 命名空间包含一个 `FileSystem` 类，该类提供了 `DeleteDirectory` 和 `DeleteFile` 方法。这些方法可以接受一个可选参数，用于指示你是想将目录或文件移动到回收站，还是永久删除该目录或文件。（它们还可以接受一个参数，让你决定方法是否应该显示进度对话框。）\n\
  \n要使用 `FileSystem` 类将文件和目录移动到回收站，请添加对 `Microsoft.VisualBasic` 库的引用。然后使用该类的静态方法 `DeleteFile`\
  \ 和 `DeleteDirectory`。\n\n### API 函数\n\n`SHEmptyRecycleBin` API 函数允许你清空回收站。要使用此函数，请在任何方法之外的类添加以下代码。\n\
  \n```cs\n[Flags]\nprivate enum RecycleFlags : uint\n{\n    SHERB_NOCONFIRMATION\
  \ = 0x1,\n    SHERB_NOPROGRESSUI = 0x2,\n    SHERB_NOSOUND = 0x4\n}\n[DllImport(\"\
  shell32.dll\")]\nstatic extern int SHEmptyRecycleBin(\n    IntPtr hWnd, string pszRootPath,\
  \ uint dwFlags);\n```\n\n此代码定义了 `RecycleFlags` 枚举和 `SHEmptyRecycleBin` API 函数。\n\
  \n现在你可以调用函数并传递适当的参数。下面的 `EmptyRecycleBin` 方法对 API 函数的调用进行了封装，使其更易于使用。\n\n```cs\n\
  public static void EmptyRecycleBin(bool showProgress, bool playSound,\n    bool\
  \ confirm)\n{\n    RecycleFlags options = 0;\n    if (!showProgress) options |=\
  \ RecycleFlags.SHERB_NOPROGRESSUI;\n    if (!playSound) options |= RecycleFlags.SHERB_NOSOUND;\n\
  \    if (!confirm) options |= RecycleFlags.SHERB_NOCONFIRMATION;\n\n    SHEmptyRecycleBin(IntPtr.Zero,\
  \ null, (uint)options);\n}\n```\n\n该方法使用其参数值组合成相应的 `RecycleFlags` 值，然后调用 API 函数。\n\
  \n### Shell32.Shell\n\n`Shell32.Shell` 是一个用于与 Windows 外壳交互的接口。它允许你与代表回收站等的虚拟对象进行交互。\n\
  \n要使用 `Shell32.Shell`，首先在引用管理器的 COM 选项卡上添加“Microsoft Shell Controls And Automation”的引用。为了方便使用\
  \ `Shell` 类，请在程序中添加以下 `using` 指令。\n\n```cs\nusing Shell32;\n```\n\n现在你可以使用类似下面的代码来枚举回收站中的文件。\n\
  \n```cs\nconst int RECYCLE_BIN_NAMESPACE = 10;\n\nShell shell = new Shell();\nFolder\
  \ bin = shell.NameSpace(RECYCLE_BIN_NAMESPACE);\n\n// 列出文件。\nforeach (FolderItem\
  \ item in bin.Items())\n{\n    Console.WriteLine(item.Name + \"\\n    \" + item.Path);\n\
  }\n```\n\n此代码创建了一个新的 `Shell` 对象，并使用该对象的 `NameSpace` 方法获取一个代表回收站的 `Folder` 对象。然后它遍历\
  \ `Folder` 的 `Items` 方法返回的项目，显示每个项目的名称和路径。\n\n# 附 T\n\n## 正则表达式\n\n本附总结了创建和使用正则表达式的方法。\n\
  \n### 创建正则表达式\n\n本节描述了你可以用于定义正则表达式的字符。\n\n### 字符转义\n\n字符转义是匹配特殊字符的字符序列。下表总结了有用的字符转义。\n\
  \n| 转义 | 含义 |\n| :--- | :--- |\n| `\\t` | 匹配制表符 |\n| `\\r` | 匹配回车符 |\n| `\\n` |\
  \ 匹配换行符 |\n| `\\nnn` | 匹配由两个或三个八进制数字 `nnn` 给出的 ASCII 码的字符 |\n| `\\xnn` | 匹配由两个十六进制数字\
  \ `nn` 给出的 ASCII 码的字符 |\n| `\\unnnn` | 匹配由四个十六进制数字 `nnnn` 给出的 Unicode 表示形式的字符 |\n\
  \n### 字符类\n\n字符类匹配一组字符中的任意一个。下表总结了有用的字符类构造。\n\n| 构造 | 含义 |\n| :--- | :--- |\n| `[`chars`]`\
  \ | 匹配括号内的字符之一。例如，`[aeiou]` 匹配单个小写元音。 |\n| `[^chars`]` | 匹配不在括号内的字符。例如，`[^aeiouAEIOU]`\
  \ 匹配单个非元音字符，如 `Q`、`?` 或 `3`。 |\n| `[`first`-last`]` | 匹配位于字符 `first` 和字符 `last`\
  \ 之间的字符。例如，`[a–z]` 匹配从 `a` 到 `z` 之间的任何小写字母。你可以像 `[a-zA-Z]` 那样组合多个范围。 |\n\n### 表达式表达式\n\
  \n正则表达式选项可以有三种方式来指定：\n\n*   向 `Regex` 对象的构造函数传递 `RegexOptions` 参数。\n*   在正则表达式中使用\
  \ `(?options)` 包含内联选项。选项包括 `i`、`m`、`n`、`s` 和 `x`。如果列表以 `-` 字符开头，则关闭后续选项。\n*   在正则表达式中使用\
  \ `(?options:subexpression)`。在这种情况下，`options` 如前所述，`subexpression` 是选项应用的正则表达式部分。\n\
  \n下表列出了所有可用选项。\n\n| 选项 | 含义 |\n| :--- | :--- |\n| `i` | 忽略大小写。 |\n| `m` | 多行模式。在这里\
  \ `^` 和 `$` 匹配行的开始和结束，而不是整个输入字符串的开始和结束。 |\n| `s` | 单行模式。在这里 `.` 匹配所有字符包括 `\\n`。\
  \ |\n| `n` | 显式捕获。这使得方法不捕获未命名的组。请参见后续章节“分组构造”获取更多信息。 |\n| `x` | 忽略模式中未转义的空白，并启用\
  \ `#` 字符后的注释。 |\n\n### 锚点\n\n锚点匹配输入的一部分，但不读取任何字符。下表总结了有用的锚点。\n\n| 锚点 | 含义 |\n| :---\
  \ | :--- |\n| `^` | 匹配行的开始 |\n| `$` | 匹配字符串的结束或字符串结束前的 `\\n` 之前 |\n| `\\A` | 匹配字符串的开始\
  \ |\n| `\\Z` | 匹配字符串的结束或字符串结束前的 `\\n` 之前 |\n| `\\z` | 匹配字符串的结束 |\n| `\\G` | 匹配上一次匹配结束的地方\
  \ |\n| `\\B` | 匹配非单词边界 |\n\n### 分组构造\n\n分组构造允许你在字符串的匹配片段中定义捕获组。括号创建组。有几种组，其中某些非常特殊且令人困惑。最常见的是编号组和命名组。\n\
  \n\n\n\n\n要创建一个编号分组，只需将一个子表达式括在括号中，例如 `(\\w)\\1`。此表达式中的 `\\w` 匹配单个单词字符。括号表示该字符位于第一个编号分组中。紧随其后的\
  \ `\\1` 匹配第 1 组中的任何内容，在本例中，即一个单个单词字符。这意味着该表达式匹配出现两次的单个单词字符。\n\n要创建一个命名分组，请使用语法 `(?<name>subexpression)`，其中\
  \ `name` 是你想要分配给该组的名称，`subexpression` 是一个子表达式。使用语法 `\\k<name>` 来引用命名分组。\n\n例如，表达式\
  \ `(?<twice>\\w)\\k<twice>` 与之前的表达式 `(\\w)\\1` 等效，不同之处在于该组被命名为 `twice`。\n\n### 量词\n\
  \n量词使正则表达式引擎按照指定的次数匹配前一个元素。下表描述了正则表达式量词。\n\n| 量词 | 含义 |\n| :--- | :--- |\n| `*`\
  \ | 匹配前一个元素 0 次或多次 |\n| `+` | 匹配前一个元素 1 次或多次 |\n| `?` | 匹配前一个元素 0 次或 1 次 |\n| `{n}`\
  \ | 恰好匹配前一个元素 `n` 次 |\n| `{n,}` | 匹配前一个元素 `n` 次或多次 |\n| `{n,m}` | 匹配前一个元素 `n` 到\
  \ `m` 次（包含边界） |\n\n如果在这些量词后面紧跟 `?`，则模式将尽可能少地匹配前面的表达式。例如，模式 `BO+` 匹配 `B` 后跟 1 个或多个\
  \ `O`，因此它会匹配 `BOOK` 中的 `BOO`。模式 `BO+?` 也匹配 `B` 后跟 1 个或多个 `O`，但它尽可能少地匹配 `O`，因此它只会匹配\
  \ `BOOK` 中的 `BO`。\n\n### 分支结构\n\n分支结构使用使用字符 `|` 允许模式匹配两个子表达式中的任意一个。例如，表达式 `^(true|yes)$`\
  \ 匹配 `true` 或 `yes`。\n\n### 示例正则表达式\n\n以下列表显示了几个实用的正则表达式。\n\n*   `^\\d{3}-\\d{4}$`—匹配简单的\
  \ 7 位电话号码。\n*   `^[2-9][0-9]{2}-\\d{4}$`—匹配更精确的 7 位电话号码。\n*   `^[2-9][0-8]\\d-[2-9][0-9]{2}-\\\
  d{4}$`—匹配格式为 NPA-NXX-XXXX 的 10 位美国电话号码，其中 `N` 是数字 2-9，`P` 是数字 0-8，`A` 是任意 0-9 之间的数字，而\
  \ `X` 是任意 0-9 之间的数字。\n*   `^([2-9][0-8]\\d-)?[2-9][0-9]{2}-\\d{4}$`—匹配带有可选区区的美国电话号码，例如\
  \ 202-234-5678 或 234-5678。\n*   `^\\d{5}(-\\d{4})?$`—匹配带有可选 +4 位的美国邮政编码，例如 12345\
  \ 或 12345-6789。\n*   `^[A-Z]\\d[A-Z] \\d[A-Z]\\d$`—匹配格式为 A1A 1A1 的加拿大邮政编码，其中 `A`\
  \ 是任意大写字母，`1` 是任意数字。\n*   `^[a-zA-Z0-9._-]{3,16}$`—匹配 3 到 16 个字符的用户名，可以是破折线、字母、数字、点或下划线。\n\
  *   `^[a-zA-Z][a-zA-Z0-9._-]{2,15}$`—匹配以字母开头、后跟 2 到 15 个破折线、字母、数字、点或下划线的用户名。\n*\
  \   `^[a-zA-Z0-9._%+-]+@[a-zA-Z0-9._%+-]+\\.[a-zA-Z]{2,4}$`—匹配电子邮件地址。（此模式并不完美，但它能匹配大多数有效的电子邮件地址。）\n\
  *   `^[+-]?[a-fA-Z0-9]{3}$`—匹配带有可选符号 + 或 – 的 3 位十六进制值，例如 +A1F。\n*   `^(https?://)?([\\\
  w-]+\\.)+[\\w-]+$`—匹配顶层 HTTP 网络地址，如 `http://www.csharphelper.com`。（此模式并不完美。特别是它没有验证域名的最后部分，因此它会匹配\
  \ `www.something.whatever`）。\n*   `^(https?://)?([\\w-]+\\.)+[\\w-]+(/(([\\w-]+)(\\\
  .[\\w-]+)*)*)*$$`—匹配 HTTP 网络 URI，如 `http://www.csharphelper.com/howto_index.html`。（同样此模式并不完美，无法处理某些更复杂的\
  \ URL，例如包含 `=`、`?` 和 `#` 字符的 URL，但它可以处理许多典型的 URL。）\n\n## 使用正则表达式\n\n`Regex` 类提供了你可以用于处理正则表达式的对象。下表总结了\
  \ `Regex` 类最有用的方法。\n\n| 方法 | 目的 |\n| :--- | :--- |\n| `IsMatch` | 如果字符串满足正则表达式，则返回\
  \ `true`。 |\n| `Match` | 在字符串中搜索满足正则表达式的第一部分。 |\n| `Matches` | 返回一个集合，提供关于字符串中满足正则表达式的所有部分的信息。\
  \ |\n| `Replace` | 将字符串中匹配正则表达式的部分或全部替换为新值。（这比 `string` 类的 `Replace` 方法强大得多。） |\n\
  | `Split` | 分割字符串。 |\n\n\n\n\nParallel LINQ（PLINQ，读作 “plink”）允许允许程序在多核系统中的多个处理器或核心上执行\
  \ LINQ 查询。只需在从查询选择数据的枚举对象上添加对 `AsParallel` 扩展方法的调用即可。\n\n以下代码使用 PLINQ 查询来选择数组 `numbers`\
  \ 中的偶数。`AsParallel` 的调用已**加粗**显示。\n\n```\nvar evens =\n    from int number in numbers.AsParallel()\n\
  \    where number % 2 == 0\n    select number;\n\nforeach (int number in evens)\
  \ Console.WriteLine(number);\n```\n\n此代码组合了查询并包含了对 `AsParallel` 的调用。然后它会遍历查询结果并将其显示。\n\
  \n## BackgroundWorker\n\n`BackgroundWorker` 组件提供了一种运行独立执行线程的相对简单的方法。它提供了事件来向主 UI\
  \ 线程提供反馈，这样你就可以显示结果，而无需使用 `InvokeRequired` 和 `Invoke` 方法。\n\n以下是基本流程。\n\n1. 在设计时或运行时创建\
  \ `BackgroundWorker`。\n2. 调用其 `RunWorkerAsync` 方法。这会启动一个新线程并在该线程上引发工作器的 `DoWork`\
  \ 事件处理程序。\n3. 捕获 `DoWork` 事件，并让其事件处理程序执行你想在新线程上运行的代码。\n\n要提供反馈，请在上述列表描述的基础上添加这些步骤：\n\
  \n1. 在启动 `BackgroundWorker` 之前，将其 `WorkerReportsProgress` 属性设置为 `true`。\n2. 捕获工作器的\
  \ `ProgressChanged` 事件。此事件处理程序在 UI 线程中运行，因此它可以操作用户界面控件而无需处理 `InvokeRequired` 和 `Invoke`。\n\
  \n如果你想让主程序停止工作器，请遵循以下步骤。\n\n1. 在启动 `BackgroundWorker` 之前，将其 `WorkerSupportsCancellation`\
  \ 属性设置为 `true`。\n2. 停止工作器，调用其 `CancelAsync` 方法。\n3. 在 `DoWork` 事件处理程序，定期检查工作器的 `CancellationPending`\
  \ 属性。如果该属性为 `true`，则事件处理程序应该退出。如果需要，可以设置 `e.Cancel` 参数以指示工作已取消。\n\n## TPL\n\n任务并行库（TPL）提供了在单独线程上执行多个计算并等待它们全部完成的方法。这些方法是\
  \ `Parallel.For`、`Parallel.ForEach` 和 `Parallel.Invoke`。\n\n由于这三个方法都调用可能在单独线程上执行的委托，因此调用可能不会按特定顺序完成。\n\
  \n### Parallel.For\n\n`Parallel.For` 方法接受一个起始值、结束值和一个委托作为参数。它为起始值（包含该值）和结束值（不包含该值）之间的每个值调用委托。该方法会阻塞，直到对委托的所有调用都完成，然后继续执行。\n\
  \n以下代码显示了程序如何使用参数 0、1、2 和 3 调用 `FindFibonacci` 方法。\n\n```\nParallel.For(0, 4, FindFibonacci);\n\
  ```\n\n### Parallel.ForEach\n\n`Parallel.ForEach` 方法接受一个值的枚举集合和一个委托作为参数。`ForEach`\
  \ 方法会调用委托，并将每个参数值传递给它。该方法会阻塞，直到对委托的所有调用都完成。\n\n以下代码显示了程序如何调用 `FindFibonacci` 方法，传递输入参数\
  \ 0, 2, 4, 6 和 8。\n\n```\nint[] numbers = {0, 2, 4, 6, 8};\nParallel.ForEach(numbers,\
  \ FindFibonacci);\n```\n\n### Parallel.Invoke\n\n`Parallel.Invoke` 方法允许你调用一个或多个可能不同的委托。它执行这些委托（可能在不同的线程上），并阻塞直到它们全部完成。\n\
  \n以下代码显示了程序如何使用 `Parallel.Invoke` 并行执行 `ResetParameters`、`LoadGame` 和 `BuildWorld`\
  \ 方法。\n\n```\nParallel.Invoke(ResetParameters, LoadGame, BuildWorld);\n```\n\n##\
  \ Tasks\n\n`System.Threading.Tasks.Task` 类允许你创建线程并异步运行。下表总结了 `Task` 类最有用的属性。\n\n\
  | 属性 | 目的 |\n| :--- | :--- |\n| `Exception` | 返回一个包含信息的 `AggregateException` 对象\
  \ |\n| `Factory` | 提供对 `TaskFactory` 的访问 |\n| `IsCanceled` | 如果 `Task` 被取消则返回 `true`\
  \ |\n| `IsCompleted` | 如果 `Task` 已完成则返回 `true` |\n| `IsFaulted` | 如果 `Task` 因为未处理的异常而停止则返回\
  \ `true` |\n| `Status` | 返回 `Task` 的状态 |\n\n下表列出了 `Task` 类最有用的方法。\n\n| 方法 | 目的 |\n\
  | :--- | :--- |\n| `ConfigureAwait` | 配置一个你可以配合 `await` 关键字使用的“等待器”对象 |\n| `ContinueWith`\
  \ | 创建一个在 `Task` 完成时执行的延续 `Task` |\n| `Delay` | 在指定时间过去后创建一个 `Task` |\n| `Run` |\
  \ 此静态方法创建并队列一个 `Task` |\n| `Start` | 启动一个之前创建的 `Task` |\n| `Wait` | 等待 `Task` 完成\
  \ |\n| `WaitAll` | 此静态方法等待集合中的所有 `Task` 完成 |\n| `WaitAny` | 此静态方法等待集合中的任何一一个 `Task`\
  \ 完成 |\n| `WhenAll` | 创建一个在所有 `Task` 完成后即完成的 `Task` |\n| `WhenAny` | 创建一个在任何一一个\
  \ `Task` 完成后即完成的 `Task` |\n\n以下列表描述了你可以用来创建和启动 `Task` 的不同方法。\n\n* 使用 `Task` 类的构造函数创建\
  \ `Task`，然后调用其 `Start` 方法启动它。\n* 使用 `TaskFactory` 对象。`Task` 类的 `Factory` 方法返回一个\
  \ `TaskFactory` 对象，可以使用它创建不同的 `Task`。`Task.Factory.StartNew` 方法在一个步骤中创建并启动一个 `Task`。\n\
  * 调用 `Task.Run`。这基本上是 `Task.Factory.StartNew` 的简化版本。\n* 调用 `TaskFactory` 类的 `ContinueWhenAll`\
  \ 或 `ContinueWhenAny` 方法，创建在某些或所有之前的 `Task` 完成后启动的 `Task`。\n\n以下代码显示了程序启动四个 `Task`\
  \ 然后等待它们全部完成的最简单用例之一。\n\n```\n// 启动四个任务。\nTask task0 = new Task(FindFibonacci, 0);\n\
  task0.Start();\nTask task1 = new Task(FindFibonacci, 1);\ntask1.Start();\nTask task2\
  \ = new Task(FindFibonacci, 2);\ntask2.Start();\nTask task3 = new Task(FindFibonacci,\
  \ 3);\ntask3.Start();\n\n// 等待任务完成。\ntask0.Wait();\ntask1.Wait();\ntask2.Wait();\n\
  task3.Wait();\n```\n\n## Threads\n\n`System.Threading.Thread` 类比本附录中描述的其他技术提供了更多对线程的控制，但使用它更复杂。下表列出了\
  \ `Thread` 类最有用的属性。\n\n| 属性 | 含义 |\n| :--- | :--- |\n| `IsAlive` | 如果线程已启动且未结束或终止则返回\
  \ `true` |\n| `IsBackground` | 确定线程是否为后台线程 |\n| `Priority` | 确定线程的优先级。可以是 `Highest`、`AboveNormal`、`Normal`、`BelowNormal`\
  \ 或 `Lowest` |\n\n\n\n\n| `ThreadState` | 返回线程的状态。可以是 `Aborted`、`AbortRequested`、`Background`、`Running`、`Stopped`、`StopRequested`、`Suspended`、`SuspendRequested`、`Unstarted`\
  \ 和 `WaitSleepJoin` 值的组合。 |\n\n下表列出了 `Thread` 类最常用的方法。\n\n| Method | Purpose |\n\
  | :--- | :--- |\n| `Abort` | 在线程上抛出 `ThreadAbortException` 以终止它。 |\n| `Join` | 阻塞调用方法的线程直到该线程终止。（程序通常等待线程结束的方式。）\
  \ |\n| `ResetAbort` | 取消当前线程的 `Abort` 操作。 |\n| `Sleep` | 此静态方法使线程挂起指定的时间。 |\n| `Start`\
  \ | 启动线程。 |\n| `Yield` | 如果有就绪线程准备运行，则将执行权让给它。 |\n\n使用简单线程通常涉及以下步骤：\n\n1. 创建 `Thread`\
  \ 对象。\n2. 调用 `Start` 方法启动线程。\n3. 若要停止线程，调用其 `Abort` 方法。\n4. 若要等待线程，调用其 `Join` 方法。\n\
  \n# 附录 V：XML\n\n本附录总结了实用的 XML 主和技术。\n\n## 特殊字符\n\n下表列出了在 XML 文件中定义的五个特殊字符。\n\n|\
  \ Character | Code |\n| :--- | :--- |\n| `<` | `<` |\n| `>` | `>` |\n| `&` | `&`\
  \ |\n| `'` | `'` |\n| `\"` | `\"` |\n\n你也可以在 CDATA 节中包含特殊字符。CDATA 节以 `<![CDATA[`\
  \ 开始，并包含直到遇到结束序列 `]]>` 的所有文本。CDATA 可以包含换行符、和、引号和其他特殊字符。\n\n### 写入 XML 数据\n\n.NET\
  \ Framework 提供了两种写入 XML 数据的主要方法：`XmlWriter` 类和 XML 文档对象模型。接下来的两个部分描述了这些方法。\n\n###\
  \ XmlWriter\n\n`XmlWriter` 类提供了写入 XML 文件片段的方法。要使用 `XmlWriter` 将 XML 数据写入文件，请调用该类的\
  \ `Create` 方法创建文件。然后使用其他方法将 XML 文档的片段写入文件。\n\n下表列出了最常用的 `XmlWriter` 方法。\n\n| Method\
  \ | Purpose |\n| :--- | :--- |\n| `Close` | 关闭写入器的底层流。 |\n| `Create` | 创建与文件、流、`StringBuilder`\
  \ 或其他对象关联的 `XmlWriter`。 |\n| `Dispose` | 释放写入器的资源。（可以使用 `using` 语句确保写入器被销置。） |\n\
  | `Flush` | 将输出刷新到底层流。 |\n| `WriteAttributeString` | 写入具有指定名称和值的属性。 |\n| `WriteCData`\
  \ | 写入 CDATA。 |\n| `WriteComment` | 写入注释。 |\n| `WriteElementString` | 写入具有指定名称和文本值的元素。\
  \ |\n| `WriteEndAttribute` | 结束由 `WriteStartAttribute` 开始的属性。 |\n| `WriteEndDocument`\
  \ | 结束文档。 |\n| `WriteName` | 写入名称。 |\n| `WriteStartAttribute` | 开始一个属性。 |\n| `WriteStartDocument`\
  \ | 开始文档。 |\n| `WriteStartElement` | 开始一个元素。 |\n| `WriteString` | 写入字符串，必要时转义 `<`\
  \ 和 `>` 等特殊字符。 |\n| `WriteValue` | 写入如 `bool`、`int` 或 `double` 等值。 |\n\n`XmlTextWriter`\
  \ 类继承自 `XmlWriter`，其工作原理与 `XmlWriter` 基本，但它可以产生良好的缩进输出。只需创建一个 `XmlTextWriter` 而不是\
  \ `XmlWriter`，将其 `Formatting` 属性设置为 `Indented`，并使用上表描述的方法创建 XML 文件即可。\n\n### 文档对象模型\n\
  \nXML 文档对象模型 (DOM) 提供了一种更结构化 XML 文档的方法。它使用对象创建 XML 文档的内存模型。你可以操作模型并将结果保存为 XML 文件或字符串。\n\
  \n操作 DOM 的两个重要类是 `XDocument` 和 `XElement`。`XDocument` 类表示 XML 文档。最重要的属性是 `Declaration`、`Root`\
  \ 和 `Nodes`。`XElement` 类表示文档中的一个元素。\n\n下表列出了 `XDocument` 类最常用的方法。\n\n| Method |\
  \ Purpose |\n| :--- | :--- |\n| `Add` | 向文档添加项。 |\n| `DescendantNodes` | 返回文档后代\
  \ `XNode` 对象的集合。 |\n| `Descendants` | 返回文档后代 `XElement` 对象的集合。 |\n| `Load` | 从文件名、流或\
  \ `XmlReader` 加载文档。 |\n| `Parse` | 从字符串创建新的 `XDocument`。 |\n| `Save` | 将文档保存到文件、流或写入器。\
  \ |\n| `ToString` | 返回缩进后的文档代码。 |\n| `WriteTo` | 将文档写入 `XmlWriter`。 |\n\n下表列出了 `XDocument`\
  \ 类最常用的属性。\n\n| Property | Purpose |\n| :--- | :--- |\n| `Document` | 返回文档。 |\n\
  | `FirstAttribute` | 获取第一个属性。 |\n| `FirstNode` | 获取第一个子节点。 |\n| `HasAttributes`\
  \ | 如果文档有属性，则返回 `true`。 |\n| `HasElements` | 如果文档有元素，则返回 `true`。 |\n| `IsEmpty`\
  \ | 如果文档不包含内容，则返回 `true`。 |\n| `LastAttribute` | 获取最后一个属性。 |\n| `LastNode` | 获取最后一个子节点。\
  \ |\n| `Name` | 获取或设置文档名称。 |\n| `NextNode` | 返回文档子列表中的下一个节点。 |\n| `NodeType` | 获取节点类型。\
  \ |\n| `Parent` | 获取父元素。 |\n| `PreviousNode` | 返回文档子列表中的上一个节点。 |\n| `Value` | 获取或设置节点文本内容。\
  \ |\n\n下表列出了 `XElement` 类最常用的方法。\n\n| Method | Purpose |\n| :--- | :--- |\n| `Add`\
  \ | 在元素子集合的末尾添加项。 |\n| `AddAfterSelf` | 在此元素之后向父级子集合中添加项。 |\n| `AddBeforeSelf` |\
  \ 在此元素之前向父级子集合中添加项。 |\n| `AddFirst` | 在元素子集合的开头添加项。 |\n| `Ancestors` | 返回元素的祖先 `XElement`\
  \ 对象的集合。如果指定了名称，则方法仅返回具有该名称的元素。 |\n| `Attribute` | 返回具有特定名称的属性。 |\n| `Attributes`\
  \ | 返回包含此元素属性的集合。如果指定了名称，则集合仅包含具有该名称的属性。 |\n| `DescendantNodes` | 返回元素的后代 `XNode`\
  \ 对象的集合。 |\n| `Descendants` | 返回元素的后代 `XElement` 对象的集合。如果指定了名称，则方法仅返回具有该名称的元素。 |\n\
  | `DescendantsAndSelf` | 返回包含此元素及其后代的 `XElement` 对象的集合。如果指定了名称，则方法仅返回具有该名称的元素。 |\n\
  | `Element` | 返回具有指定名称的第一个子元素。 |\n| `Elements` | 返回持有元素元素的集合。如果指定了名称，则方法仅返回具有该名称的元素。\
  \ |\n| `ElementsAfterSelf` | 返回位于此元素之后的兄弟元素的集合。如果指定了名称，则方法仅返回具有该名称的元素。 |\n| `ElementsBeforeSelf`\
  \ | 返回位于此元素之前的兄弟元素的集合。如果指定了名称，则方法仅返回具有该名称的元素。 |\n\n下表列出了 `XElement` 类最常用的属性。\n\n\
  | Property | Purpose |\n| :--- | :--- |\n| `Document` | 返回文档。 |\n| `FirstAttribute`\
  \ | 获取第一个属性。 |\n| `FirstNode` | 获取第一个子节点。 |\n| `HasAttributes` | 如果元素有属性，则返回 `true`。\
  \ |\n| `HasElements` | 如果元素有元素，则返回 `true`。 |\n| `IsEmpty` | 如果元素不包含内容，则返回 `true`。\
  \ |\n| `LastAttribute` | 获取最后一个属性。 |\n| `LastNode` | 获取最后一个子节点。 |\n| `Name` | 获取或设置元素名称。\
  \ |\n| `NextNode` | 返回元素子列表中的下一个节点。 |\n| `NodeType` | 获取节点类型。 |\n| `Parent` | 获取父元素。\
  \ |\n| `PreviousNode` | 返回元素子列表中的上一个节点。 |\n| `Value` | 获取或设置节点文本内容。 |\n\n\n\n\n\n\
  | `IsAfter` | 如果此节点在文档中位于另一个指定节点之后，则返回 `true`。 |\n| `IsBefore` | 如果此节点在文档中位于另一个指定节点之前，则返回\
  \ `true`。 |\n| `Load` | 从文件名、流或读取器加载元素。 |\n| `Nodes` | 返回一个包含此元素子节点的集合。 |\n| `NodesAfterSelf`\
  \ | 返回一个包含该节点之后的兄弟节点的集合。 |\n| `NodesBeforeSelf` | 返回一个包含该节点之前的兄弟节点的集合。 |\n| `Parse`\
  \ | 从 XML 字符串创建 `XElement`。 |\n| `Remove` | 从其父节点中移除此元素。 |\n| `RemoveAll` | 移除该元素中的所有节点和属性。\
  \ |\n| `RemoveAttributes` | 移除该元素的属性。 |\n| `RemoveNodes` | 移除该元素的子节点。 |\n| `ReplaceAll`\
  \ | 用指定的新节点替换元素的子节点和属性。 |\n| `ReplaceAttributes` | 用指定的新属性替换元素的属性。 |\n| `ReplaceNodes`\
  \ | 用指定的新节点替换元素的子节点。 |\n| `ReplaceWith` | 用指定的新内容替换此节点。 |\n| `Save` | 将元素保存到文件、流或写入器。\
  \ |\n| `SetAttributeValue` | 设置、添加或删除属性。 |\n| `SetElementValue` | 设置、添加或删除子元素。 |\n\
  | `SetValue` | 设置元素的值。 |\n| `ToString` | 返回元素的缩进 XML 代码。 |\n| `WriteTo` | 将元素写入\
  \ `XmlWriter`。 |\n\n### XML 字面量\n\nC# 不支持 XML 字面量，但它支持多行字符串字面量，且它们的效果几乎相同。只需简单使用\
  \ `XElement.Parse` 方法来解析包含 XML 代码的多行字符串，如下例所示。\n\n```\nXElement student = XElement.Parse(\n\
  \    @\"<Student>\n        <FirstName>Arthur</FirstName>\n        <LastName>Andrews</LastName>\n\
  \        <StudentID>83746</StudentID>\n    </Student>\");\n```\n\n## 读取 XML 数据\n\
  \n以下两个部分解释了如何使用 `XmlTextReader` 类和文档对象模型（DOM）来读取 XML 代码。\n\n### XmlTextReader\n\n\
  `XmlTextReader` 类提供了快速、仅向、非缓存的方法，用于读取 XML 数据。它提供了逐个节点在 XML 文件中移动，并检查每个节点提供的数据的方法。\n\
  \n要使用 `XmlTextReader`，请使用该类的构造函数或 `XmlReader` 类的静态 `Create` 方法创建一个与您想要读取的文件或输入流关联的对象。使用该对象的\
  \ `Read` 方法从 XML 数据中读取下一个节点。在读取一个节点后，您可以使用读取器的属性和方法来确定节点的名称、类型、属性、内容和其他属性。\n\n下表列出了最常用的\
  \ `XmlReader` 属性。\n\n| 属性 | 含义 |\n| :--- | :--- |\n| `AttributeCount` | 返回节点拥有的属性数量。\
  \ |\n| `Depth` | 返回当前节点在 XML 层次结构中的深度。 |\n| `EOF` | 当读取器到达 XML 数据的末尾时，返回 `true`。\
  \ |\n| `HasAttributes` | 如果节点具有属性，则返回 `true`。 |\n| `HasValue` | 如果节点可以拥有值，则返回 `true`。\
  \ |\n| `IsEmptyElement` | 如果节点是一个空元素（如 `<Overdue />`），则返回 `true`。 |\n| `Item` |\
  \ 根据索引或名称获取节点属性。（这是该类的索引器，因此您应该这样使用 `reader[0]`，而不是显式调用 `Item` 属性。） |\n| `Name`\
  \ | 返回节点的名称。 |\n| `Value` | 返回当前节点的文本值。 |\n\n下表列出了 `XmlReader` 类最常用的方法。\n\n| 方法\
  \ | 目的 |\n| :--- | :--- |\n| `Create` | 创建一个与字符串、流、文件或其他数据源关联的新读取器。 |\n| `Dispose`\
  \ | 释放对象的资源。您可以包含 `using` 语句来自动调用 `Dispose`。 |\n| `GetAttribute` | 根据索引或名称获取当前节点的属性。（类似于\
  \ `Item` 属性。） |\n| `IsName` | 如果其参数为有效的 XML 名称，则返回 `true`。 |\n| `MoveToAttribute`\
  \ | 将读取器移动到由索引或名称指定的属性。 |\n| `MoveToContent` | 将读取器移动到当前节点的内容。 |\n| `MoveToElement`\
  \ | 将读取器移动到包含读取器当前位置元素。例如，如果您移动读取器以检查元素的属性，该方法会将读取器移动回到元素节点。 |\n| `MoveToFirstAttribute`\
  \ | 将读取器移动到当前节点的第一个属性节点。 |\n| `MoveToNextAttribute` | 将读取器移动到当前节点的下一个属性节点。 |\n|\
  \ `Read` | 从 XML 数据中读取下一个节点。 |\n| `ReadInnerXml` | 将当前节点的后代作为 XML 字符串返回。 |\n| `ReadOuterXml`\
  \ | 将当前节点的子树（包括当前节点）作为 XML 字符串返回。 |\n| `ReadToDescendant` | 将读取器移动到当前节点。 |\n| `ReadToNextSibling`\
  \ | 将读取器移动到下一个兄弟节点。 |\n| `Skip` | 跳过当前节点。 |\n\n### 文档对象模型\n\n可以使用 DOM 加载 XML 文件。\n\
  \n### 相关技术\n\n以下列表总结了一些 XML 相关的技术。\n\n- `XSL`（可扩展样式语言）——语言族。\n- `XSLT`（XSL 转换）——用于将\
  \ XML 转换为其他格式的语言。\n- `XSL FO`（XSL 格式对象）——用于将 XML 格式化为屏幕、PDF、打印机等输出内容的语言。\n- `DTD`（文档类型定义）——一种\
  \ XML 文件验证语言。 \n- `XSD`（XML 架构定义）——另一种 XML 数据验证语言。\n- `XLink`——用于在 XML 数据中定义超链接的语言。\n\
  - `SOAP`（简单对象访问协议）——一种允许应用程序（通常运行在不同的计算机上）交换数据的协议。\n- `WSDL`（Web 服务定义语言）——用于描述 Web\
  \ 语言。\n- `RSS`（真正简单聚合）——用于 XML 新闻订阅和发布新闻类条目的格式。\n\n后续章节提供了关于 XPath 和 XSLT 的更多信息。\n\
  \n### XPath\n\nXPath 是一种用于识别 XML 数据中项目的语言。XPath 查询类似于目录层次结构中的文件路径。查询还可以包含作为通配符、过滤结果以及指定节点关系的运算符。\n\
  \n下表列出了您在 XPath 查询中可以常用的运算符。\n\n| 运算符 | 含义 |\n| :--- | :--- |\n| `/` | 选择直接子节点。\
  \ |\n| `//` | 选择后代。 |\n| `.` | 当前节点。 |\n| `..` | 当前节点的父节点。 |\n| `*` | 匹配任何内容。 |\n\
  | `@` | 匹配属性的属性标记。例如，`@Cost` 匹配名为 `Cost` 的属性。 |\n| `@*` | 选择所有属性。 |\n| `()` | 分组操作。\
  \ |\n| `[ ]` | 应用过滤器。例如，`//Planet[@Name=\"Earth\"]` 匹配具有值为 `Earth` Name 属性的 `Planet`\
  \ 元素。 |\n| `[ ]` | 用于访问集合中项目的下标运算符。 |\n| `+` | 加法。 |\n| `-` | 减法。 |\n| `Div` | 浮点除法。\
  \ |\n| `*` | 乘法。 |\n| `Mod` | 取模。 |\n\n当查询过滤结果时，可以包含下表列出的布尔运算符和比较运算符。\n\n| 运算符 |\
  \ 含义 |\n| :--- | :--- |\n| `And` | 逻辑与 |\n\n\n\n\n\n| `Or` | 逻辑或 |\n| `not()` |\
  \ 逻辑非 |\n| `=` | 等于 |\n| `!=` | 不等于 |\n| `<` | 小于 |\n| `<=` | 小于或等于 |\n| `>` | 大于\
  \ |\n| `>=` | 大于或等于 |\n\n关于 XPath 的更多信息，请参考以下链接。\n\n*   [msdn.microsoft.com/library/ms256115.aspx](http://msdn.microsoft.com/library/ms256115.aspx)\
  \ 上的“XPath 引用”\n*   [msdn.microsoft.com/library/ms256086.aspx](http://msdn.microsoft.com/library/ms256086.aspx)\
  \ 上的“XPath 示例”\n\n### XSLT\n\nXSLT 是一种用于将 XML 数据转换为新格式的语言。它是一种相当复杂的语言，因此在这里无法对其进行深入介绍。要学习该语言，请参考以下链接。\n\
  \n*   [www.w3schools.com/xsl/default.asp](http://www.w3schools.com/xsl/default.asp)\
  \ 上的“XSLT 教程”\n*   [www.w3schools.com/xsl/xsl_w3celementref.asp](http://www.w3schools.com/xsl/xsl_w3celementref.asp)\
  \ 上的“XSLT 元素引用”\n*   [www.w3.org/TR/xslt](http://www.w3.org/TR/xslt) 上的“XSL 转换 (XSLT)\
  \ 版本 1.0”\n\n示例请参见 第 24 章，“XML”中的“XSLT”章节。\n\n# 附录 W\n\n## 序列化\n\n本附录总结了有序列化主题和技术。\n\
  \n## XML 序列化\n\n要在 XML 格式下序列化和反序列化对象，可以使用 `XmlSerializer` 类的 `Serialize` 和 `Deserialize`\
  \ 方法。这些方法仅适用于具有无参数构造函数的类（无论是默认构造函数还是你创建的）。它们也仅适用于公共属性和字段。所有其他属性和字段都会被忽略。\n\n要序列化一个对象，请遵循以下步骤。\n\
  \n1.  创建一个 `XmlSerializer`，通过其构造函数传递对象的类型。\n2.  创建一个 `TextWriter` 来存储序列化结果。\n3.\
  \  调用序列化器的 `Serialize` 方法，向其传递 `TextWriter` 和要序列化的对象。\n\n以下代码显示了程序如何序列化一个 `Customer`\
  \ 对象。\n\n```\n// 创建一个适用于 Customer 类的序列器。\nXmlSerializer serializer = new XmlSerializer(typeof(Customer));\n\
  \n// 创建一个 TextWriter 来存储序列化结果。\nstring serialization;\nusing (TextWriter writer\
  \ = new StringWriter())\n{\n    // 序列化 Customer。\n    serializer.Serialize(writer,\
  \ customer);\n    serialization = writer.ToString();\n}\n\n// 显示序列化结果。\nserializationTextBox.Text\
  \ = serialization;\n```\n\n要反序列化一个序列化结果，请遵循以下步骤。\n\n1.  创建一个 `XmlSerializer`，通过其构造函数传递对象的类型。\n\
  2.  创建一个 `TextReader` 用于从中读取序列化结果。\n3.  调用序列化器的 `Deserialize` 方法，向其传递 `TextReader`。将结果转换为对象的类型。\n\
  \n以下代码显示了程序如何反序列化 `Customer` 对象的序列化结果。\n\n```\n// 创建一个适用于 Customer 类的序列器。\nXmlSerializer\
  \ serializer = new XmlSerializer(typeof(Customer));\n\n// 创建一个用于读取序列化结果的流。\nusing\
  \ (TextReader reader = new StringReader(serialization))\n{\n    // 反序列化。\n    Customer\
  \ newCustomer = (Customer)serializer.Deserialize(reader);\n\n    // 显示反序列化结果。\n\
  \    DisplayCustomer(deserializedTextBox, newCustomer);\n}\n```\n\n## 控制序列化\n\n\
  下表列出了你可以用于控制序列化的最常用属性。（实现这些属性的类名都以 `Attribute` 结尾。例如，第一个 `XmlArray` 属性由 `XmlArrayAttribute`\
  \ 类实现。如果你想在网上查找这些属性的任何一个，请使用它们的完整类名。）\n\n| **属性** | **用途** |\n| :--- | :--- |\n\
  | `XmlArray` | 更改数组或列表序列化时的名称。 |\n| `XmlArrayItem` | 指明可以于数组的类型。例如，假设 `People` 数组包含\
  \ `Person` 对象，其中一些对象可能来自 `Author` 子类。那么你需要使用两次 `XmlArrayItem` 来指明数组可能包含 `Person`\
  \ 和 `Author` 对象。 |\n| `XmlAttribute` | 将字段作为属性而非元素进行序列化。可选设置属性的名称。 |\n| `XmlElement`\
  \ | 特别指明该字段将序列化为 XML 元素。此属性允许你更改 XML 元素的名称。 |\n| `XmlEnum` | 允许你指定枚举值序列化时的名称。例如，假设枚举\
  \ `MealSize` 定义了值 `Small`、`Medium` 和 `Large`。你可以使用此属性使序列化调用这些值为 `Tall`、`Grande`\
  \ 和 `Brobdignagian`。 |\n| `XmlIgnore` | 让序列器在序列化时忽略某个字段。 |\n| `XmlRoot` | 控制为序列化根元素生成的元素名称和命名空间。例如，`Customer`\
  \ 类前面的 `[XmlRoot(\"Client\")]` 属性将使序列器将根元素命名为 `Client`。这不会影响不是根元素的 `Customer` 对象。（参见\
  \ `XmlType`。） |\n| `XmlText` | 让序列器将值存储为 XML 文本。一个对象只能有一个文本值。（序列器无法在对象的开始和结束标签之间放置多个文本值。）\
  \ |\n| `XmlType` | 控制为类生成的元素名称和命名空间。例如，如果你将 `[XmlType(\"Item\")]` 属性放置在 `OrderItem`\
  \ 类前面，那么所有 `OrderItem` 对象都将被序列化为 `Item` 元素。 |\n\n`DataContractSerializer` 类也可以使用\
  \ XML 来序列化和反序列化对象。该过程与使用 `DataContractJsonSerializer` 类相似，后者将在下一节中进行总结。\n\n## JSON\
  \ 序列化\n\nJavaScript 对象表示 (JSON) 是一种数据存储语言，主要由键:值对组成，其中键是文本，值可以是以下数据类型之一。\n\n*  \
  \ 数字\n*   字符串\n*   布尔值\n*   数组（用逗号分隔并括在方括号 [ ] 中的值序列）\n*   对象（键:值对的集合，对用逗号分隔，整个集合由花括号\
  \ } 包围）\n*   Null\n\n下一节总结了基本的 JSON 序列化和反序列化过程。随后的章节描述了你可以用于控制序列化的属性。\n\n### 执行序列化\n\
  \n`DataContractJsonSerializer` 类使用 JSON 格式序列化和反序列化对象。该类的 `WriteObject` 方法序列化一个对象。其\
  \ `ReadObject` 方法反序列化一个对象。\n\n以下代码以 JSON 格式序列化并反序列化一个 `Customer` 对象。\n\n```\n//\
  \ 创建一个适用于 Customer 类的序列器。\nDataContractJsonSerializer serializer =\n    new DataContractJsonSerializer(typeof(Customer));\
  \ \n\n// 创建一个用于存储序列化结果的流。\nusing (MemoryStream stream = new MemoryStream())\n{\n\
  \    // 序列化 Customer。\n    serializer.WriteObject(stream, customer);\n\n    // 将流转换为字符串。\n\
  \    stream.Seek(0, SeekOrigin.Begin);\n    string serialization;\n    using (StreamReader\
  \ reader = new StreamReader(stream))\n    {\n        serialization = reader.ReadToEnd();\n\
  \n        // 显示序列化结果。\n        serializationTextBox.Text = serialization;\n\n  \
  \      // 从流反序列化。\n        stream.Position = 0;\n        Customer newCustomer =\
  \ (Customer)serializer.ReadObject(stream);\n\n        // 显示反序列化结果。\n        DisplayCustomer(deserializedTextBox,\
  \ newCustomer);\n    }\n}\n```\n\n## 控制序列化\n\n下表列出了在执行 JSON 序列化时非常有用的属性。\n\n| **属性**\
  \ | **用途** |\n| :--- | :--- |\n| `CollectionDataContract` | 允许控制集合的序列化 |\n| `DataContract`\
  \ | 表明该类型可以如 `DataContractSerializer` 等序列器序列化 |\n| `DataMember` | 表明该属性应该被序列化 |\n\
  \n\n\n\n\n| `EnumMember` | 表示该属性是一个枚举并且应该被序列化 |\n| `IgnoreDataMember` | 表示该属性不应包含在序列化中\
  \ |\n| `OptionalField` | 表示该属性在序列化是可选的 |\n\n## 二进制序列化\n\nXML 和 JSON 序列化器无法处理某些数据类型，也无法序列化包含引用循环的数据结构。然而，`BinaryFormatter`\
  \ 类可以处理这两个问题。\n\n`BinaryFormatter` 只能与装饰了 `Serializable` 特性的类一起。\n\n以下代码显示了程序如何使用\
  \ `BinaryFormatter` 来序列化和反序列化一个 `Department` 对象。\n\n```csharp\n// 创建一个 BinaryFormatter。\n\
  IFormatter formatter = new BinaryFormatter();\n\n// 创建一个用于序列化的流。\nusing (MemoryStream\
  \ stream = new MemoryStream())\n{\n    // 序列化。\n    formatter.Serialize(stream,\
  \ department);\n\n    // 显示序列化的文本表示形式。\n    byte[] bytes = stream.ToArray();\n \
  \   string serialization = BitConverter.ToString(bytes).Replace(\"-\", \" \");\n\
  \n    // 显示序列化结果。\n    serializationTextBox.Text = serialization;\n\n    // 反序列化。\n\
  \    stream.Seek(0, SeekOrigin.Begin);\n    Department newDepartment = (Department)formatter.Deserialize(stream);\n\
  \n    // 显示新 Department 的数据。\n    deserializedPictureBox.Image = newDepartment.Logo;\n\
  \    deserializedTextBox.Text = DisplayDepartment(newDepartment);\n}\n```\n\n# 附录\
  \ X\n\n## 反射\n\n类的类型提供了关于该类的丰富信息的属性和方法。你可以通过使用 `typeof(TheClass)` 或通过调用类实例的 `GetType`\
  \ 方法来获取表示该类的 `Type` 对象。\n\n下节总结了 `Type` 类最常用的属性和方法。后续章节总结了其他常用的反射类。\n\n### Type\n\
  \n下表列出了 `Type` 类最常用的属性。\n\n| 属性 | 说明 |\n| :--- | :--- |\n| `Assembly` | 获取声明类型的程序集。\
  \ |\n| `Attributes` | 获取类的特性。 |\n| `BaseType` | 获取类的父类。 |\n| `ContainsGenericParameters`\
  \ | 表示类型是否具有泛型类型参数。 |\n| `CustomAttributes` | 获取类的自定义特性。 |\n| `FullName` | 获取类型的完全限定名，包括类型的命名空间但不包括其程序集。\
  \ |\n| `IsAbstract` | 如果类型是抽象的，则返回 `true`。 |\n| `IsArray` | 如果类型是数组，则返回 `true`。\
  \ |\n| `IsAutoLayout` | 如果类型的字段由 CLR 自动布局，则返回 `true`。 |\n| `IsByRef` | 如果类型通过引用传递，则返回\
  \ `true`。 |\n| `IsClass` | 如果类型是类，则返回 `true`。 |\n| `IsCOMObject` | 如果类型是 COM 对象，则返回\
  \ `true`。 |\n| `IsEnum` | 如果类型是枚举，则返回 `true`。 |\n| `IsExplicitLayout` | 如果类型的字段是显式布局，则返回\
  \ `true`。 |\n| `IsGenericType` | 获取指示当前类型是否为泛型的值。 |\n| `IsImport` | 如果类型是从 COM 库导入的，则返回\
  \ `true`。 |\n| `IsInterface` | 如果类型是接口，则返回 `true`。 |\n| `IsLayoutSequential` | 如果类型的字段是顺序布局的，则返回\
  \ `true`。 |\n| `IsMarshalByRef` | 如果类型通过引用封化，则返回 `true`。 |\n| `IsNested` | 如果类型的定义包含在另一个类型的定义内部，则返回\
  \ `true`。 |\n| `IsNestedAssembly` | 如果类型是嵌套的且仅在其程序集内可见，则返回 `true`。 |\n| `IsNestedFamANDAssem`\
  \ | 如果类型是嵌套的且仅对同族（其类及其派生类）及其程序集可见，则返回 `true`。 |\n| `IsNestedFamily` | 如果类型是嵌套的且仅对同族中的类可见，则返回\
  \ `true`。 |\n| `IsNestedFamORAssem` | 如果类型是嵌套的且仅对同族或程序集中的类可见，则返回 `true`。 |\n| `IsNestedPrivate`\
  \ | 如果类型是嵌套且私有的，则返回 `true`。 |\n| `IsNestedPublic` | 如果类型是嵌套且公共的，则返回 `true`。 |\n\
  | `IsNotPublic` | 如果类型不是公共的，则返回 `true`。 |\n| `IsPointer` | 如果类型是指针，则返回 `true`。 |\n\
  | `IsPrimitive` | 如果类型是原始类型，则返回 `true`。 |\n| `IsPublic` | 如果类型是公共的，则返回 `true`。 |\n\
  | `IsSealed` | 如果类型是密封的，则返回 `true`。 |\n| `IsSerializable` | 如果类型是可以序列化的，则返回 `true`。\
  \ |\n| `IsValueType` | 如果类型是值类型，则返回 `true`。 |\n| `IsVisible` | 如果类型对程序集外的代码可见，则返回\
  \ `true`。 |\n| `Module` | 返回定义类型的模块。 |\n| `Name` | 返回类型的名称。 |\n| `Namespace` | 返回类型的命名空间。\
  \ |\n| `StructLayoutAttribute` | 返回一个描述类型布局的 `StructLayoutAttribute`。 |\n| `TypeInitializer`\
  \ | 获取类的初始化器。 |\n\n下表列出了 `Type` 类最常用的方法。\n\n| 方法 | 说明 |\n| :--- | :--- |\n| `FindInterfaces`\
  \ | 返回该类型实现的接口的过滤列表。 |\n| `FindMembers` | 返回指定成员类型的过滤后的 `MemberInfo` 对象数组。成员类型可以是\
  \ `All`、`Constructor`、`Custom`、`Event`、`Field`、`Method`、`NestedType`、`Property`\
  \ 或 `TypeInfo`。 |\n| `GetArrayRank` | 返回数组的维度。 |\n| `GetConstructor` | 返回匹配特定参数类型的构造函数信息。\
  \ |\n| `GetConstructors` | 返回类型所有的公共构造函数。 |\n| `GetCustomAttributes` | 返回类的自定义特性的数组。\
  \ |\n| `GetDefaultMembers` | 返回类的默认成员。 |\n| `GetElementType` | 对于数组、指针或引用类型，返回该类型包含的项的类型。\
  \ |\n| `GetEnumName` | 对于枚举类型，返回对应特定值的名称。（例如，如果 `Desserts` 枚举表示整数值为 3 的 `Cookie`，则\
  \ `GetEnumName(3)` 返回 `Cookie`。） |\n| `GetEnumNames` | 对于枚举类型，返回枚举值的名称。 |\n| `GetEnumUnderlyingType`\
  \ | 对于枚举类型，返回用于存储枚举值的整数数据类型。 |\n| `GetEnumValues` | 对于枚举类型，返回用于存储枚举值的整数数组。 |\n|\
  \ `GetEvent` | 返回表示指定公共事件的 `EventInfo` 对象。 |\n| `GetEvents` | 返回表示类型所有公共事件的 `EventInfo`\
  \ 对象。 |\n| `GetField` | 返回表示指定公共字段的 `FieldInfo` 对象。 |\n| `GetFields` | 返回表示类型所有公共字段的\
  \ `FieldInfo` 对象。 |\n| `GetGenericArguments` | 返回表示类型泛型参数的类型对象数组。 |\n| `GetGenericParameterConstraints`\
  \ | 返回表示泛型类型参数约束的类型对象数组。 |\n| `GetInterface` | 返回表示类型实现的接口类型。 |\n| `GetInterfaces`\
  \ | 返回表示该类型实现的接口的类型数组。 |\n| `GetMember` | 返回包含匹配搜索标准的类型公共成员信息的 `MemberInfo` 对象数组。\
  \ |\n| `GetMembers` | 返回包含类型所有公共成员信息的 `MemberInfo` 对象数组。 |\n| `GetMethod` | 返回表示匹配搜索标准的公共方法的\
  \ `MethodInfo` 对象。 |\n| `GetMethods` | 返回表示类型所有公共方法的 `MethodInfo` 对象数组。 |\n| `GetNestedType`\
  \ | 返回表示匹配搜索标准的嵌套类型的类型信息。 |\n| `GetNestedTypes` | 返回表示类型所有嵌套类型的类型信息数组。 |\n\n\n\n\
  \n\n| `GetProperties` | 返回一个 `PropertyInfo` 对象的数组，用于表示匹配搜索标准的属性。 |\n| `GetProperty`\
  \ | 返回一个表示匹配搜索标准的属性的 `PropertyInfo` 对象。 |\n| `GetType` | 此静态方法返回一个表示匹配搜索标准的类型的 `Type`\
  \ 对象。 |\n| `GetTypeArray` | 为数组中的对象返回 `Type` 对象的数组。 |\n| `GetTypeFromCLSID` | 返回具有以\
  \ `GUID` 指定的给定类标识符 (`CLSID`) 的类型。 |\n| `InvokeMember` | 调用一个成员。 |\n| `IsAssignableFrom`\
  \ | 如果可以从另一个指定类型的实例赋值给该类型的实例，则返回 `true`。 |\n| `IsEnumDefined` | 对于枚举类型，如果该枚举定义了特定值，则返回\
  \ `true`。 |\n| `IsInstanceOfType` | 如果特定对象是该类型的实例，则返回 `true`。 |\n| `IsSubclassOf`\
  \ | 如果该类型是另一个类型的子类，则返回 `true`。 |\n| `MakeArrayType` | 返回一个表示当前类型数组的新 `Type` 对象。\
  \ |\n| `MakeByRefType` | 返回一个表示按引用传递的当前类型的新 `Type` 对象。 |\n| `MakeGenericType` |\
  \ 返回一个表示当前泛型类型的新 `Type` 对象，用特定类型替换泛型参数。 |\n| `MakePointerType` | 返回一个表示指向当前类型指针的新\
  \ `Type` 对象。 |\n\n## MemberInfo\n\n`MemberInfo` 类是 `EventInfo`、`MethodInfo`、`FieldInfo`\
  \ 和 `PropertyInfo` 的父类。下表列出了常用的 `MemberInfo` 属性。\n\n| Property | Description |\n\
  | `CustomAttributes` | 返回一个包含成员自定义属性信息的集合 |\n| `DeclaringType` | 返回包含此成员的类 |\n|\
  \ `MemberType` | 返回成员的类型 |\n| `Module` | 返回包含定义此成员的类型的模块 |\n| `Name` | 返回成员名称 |\n\
  | `ReflectedType` | 返回用于获取此 `MemberInfo` 对象的对象 |\n\n后续章节描述了 `EventInfo`、`MethodInfo`、`FieldInfo`\
  \ 和 `PropertyInfo` 类提供的最实用的属性和方法。\n\n## EventInfo\n\n`EventInfo` 对象包含有关事件的信息。下表列出了未从\
  \ `MemberInfo` 类继承的最实用的 `EventInfo` 属性。\n\n| Property | Description |\n| `AddMethod`\
  \ | 返回用于向事件添加委托的方法 |\n| `Attributes` | 返回事件的属性 |\n| `EventHandlerType` | 返回一个表示事件处理程序委托的\
  \ `Type` |\n| `RaiseMethod` | 返回在事件触发时被调用的方法 |\n| `RemoveMethod` | 返回从事件处理程序中移除委托的方法\
  \ |\n\n下表列出了未从 `MemberInfo` 类继承的最实用的 `EventInfo` 方法。\n\n| Method | Description |\n\
  | `AddEventHandler` | 向事件添加一个事件处理程序 |\n| `GetAddMethod` | 返回用于向事件添加委托的方法 |\n| `GetRaiseMethod`\
  \ | 返回在事件触发时被调用的方法 |\n| `GetRemoveMethod` | 返回从事件处理程序中移除委托的方法 |\n| `RemoveEventHandler`\
  \ | 从事件中移除一个事件处理程序 |\n\n## MethodInfo\n\n`MethodInfo` 对象包含有关方法的信息。该类派自 `MethodBase`，而\
  \ `MethodBase` 又派自 `MemberInfo`。\n\n下表列出了未从 `MemberInfo` 类继承的最实用的 `MethodInfo` 属性。（其中某些属性继承自\
  \ `MethodBase`，但该类是抽象的，因此本附录未单独描述它。）\n\n| Property | Description |\n| `ContainsGenericParameters`\
  \ | 如果方法具有泛型参数，则返回 `true`。 |\n| `IsAbstract` | 如果方法是抽象的，则返回 `true`。 |\n| `IsAssembly`\
  \ | 如果仅对同一程序集内的代码可见，则返回 `true`。 |\n| `IsConstructor` | 如果方法是构造函数，则返回 `true`。 |\n\
  | `IsFamily` | 如果仅在该类及其派生类中可见，则返回 `true`。 |\n| `IsFamilyAndAssembly` | 如果仅对其家族（类及其派生类）且仅在同一程序集内可见，则返回\
  \ `true`。 |\n| `IsFamilyOrAssembly` | 如果对家族（类及其派生类）以及同一程序集内的代码可见，则返回 `true`。 |\n\
  | `IsFinal` | 如果方法是最终的（final），则返回 `true`。 |\n| `IsGenericMethod` | 如果方法是泛型方法的实例，则返回\
  \ `true`。 |\n| `IsGenericMethodDefinition` | 如果方法是泛型方法定义，则返回 `true`。 |\n| `IsPrivate`\
  \ | 如果方法是私有的，则返回 `true`。 |\n| `IsPublic` | 如果方法是公共的，则返回 `true`。 |\n| `IsStatic`\
  \ | 如果方法是静态的，则返回 `true`。 |\n| `IsVirtual` | 如果方法是虚方法的，则返回 `true`。 |\n| `ReturnParameter`\
  \ | 返回一个表示方法返回类型的 `ParameterInfo` 对象。 |\n| `ReturnType` | 返回方法的类型 |\n\n下表列出了未从 `MemberInfo`\
  \ 类继承的最实用的 `MethodInfo` 方法。\n\n| Method | Description |\n| `CreateDelegate` | 返回方法的委托。\
  \ |\n| `GetGenericArguments` | 返回一个表示方法泛型参数的 `Type` 对象数组。 |\n| `GetGenericMethodDefinition`\
  \ | 对于泛型方法的实例，返回一个表示该方法泛型定义的 `MethodInfo` 对象。 |\n| `GetParameters` | 返回有关方法参数的信息。\
  \ |\n| `Invoke` | 调用方法并传递指定的参数。 |\n| `MakeGenericMethod` | 对于泛型方法定义，返回一个用特定类型替换泛型参数后的方法\
  \ `MethodInfo`。 |\n\n## FieldInfo\n\n`FieldInfo` 对象包含有关字段的信息。下表列出了未从 `MemberInfo`\
  \ 类继承的最实用的 `FieldInfo` 属性。\n\n| Property | Description |\n| `Attributes` | 返回字段的属性\
  \ |\n| `FieldType` | 返回字段的类型 |\n| `IsAssembly` | 如果字段仅对程序集内的代码可见，则返回 `true` |\n\
  | `IsFamily` | 如果字段仅对其家族（类及其派生类）中的代码可见，则返回 `true` |\n| `IsFamilyAndAssembly` | 如果字段仅对同一程序集内家族中的代码可见，则返回\
  \ `true` |\n| `IsFamilyOrAssembly` | 如果字段对家族代码以及同一程序集内的代码可见，则返回 `true` |\n| `IsInitOnly`\
  \ | 如果字段的值只能在类的构造函数中设置，则返回 `true` |\n| `IsLiteral` | 如果字段在编译时初始化且以后无法更改，则返回 `true`\
  \ |\n| `IsNotSerialized` | 如果字段被标记了 `NotSerialized` 属性，则返回 `true` |\n| `IsPrivate`\
  \ | 如果字段是私有的，则返回 `true` |\n| `IsPublic` | 如果字段是公共的，则返回 `true` |\n| `IsStatic` |\
  \ 如果字段是静态的，则返回 `true` |\n\n下表列出了 `FieldInfo` 类最实用的方法。\n\n| Method | Description\
  \ |\n| `GetValue` | 返回字段的值 |\n| `GetValueDirect` | 返回由给定对象支持的字段的值 |\n| `SetValue`\
  \ | 设置字段的值\n\n## PropertyInfo\n\n`PropertyInfo` 对象包含有关属性的信息。下表列出了未从 `MemberInfo`\
  \ 类继承的最实用的 `PropertyInfo` 属性。\n\n| Property | Description |\n| `Attributes` | 返回属性的属性\
  \ |\n| `CanRead` | 如果属性可以读取，则返回 `true` |\n| `CanWrite` | 如果属性可以写入，则返回 `true` |\n\
  | `GetMethod` | 返回属性的 `get` 访问器 |\n| `PropertyType` | 返回属性的类型\n\n\n\n\n| `SetMethod`\
  \ | 返回属性的 `set` 访问器 |\n| :--- | :--- |\n| `GetAccessors` | 返回表示属性访问器的 `MethodInfo`\
  \ 对象的数组 |\n| `GetMethod` | 返回一个表示属性的 `get` 访问器的 `MethodInfo` 对象 |\n| `GetIndexParameters`\
  \ | 对于索引属性，返回一个包含索引信息的 `ParameterInfo` 对象的数组 |\n| `GetSetMethod` | 返回一个表示属性的 `set`\
  \ 访问器的 `MethodInfo` 对象 |\n| `GetValue` | 返回属性的值 |\n| `SetValue` | 设置属性的值 |\n\n**ParameterInfo**\n\
  \n一个 `ParameterInfo` 对象包含有关参数的信息。下表列出了常用的 `ParameterInfo` 属性。\n\n| 属性 | 描述 |\n|\
  \ :--- | :--- |\n| `Attributes` | 返回参数的属性 |\n| `CustomAttributes` | 返回参数的自定义属性 |\n\
  | `DefaultValue` | 如果有，则返回参数的默认值 |\n| `HasDefaultValue` | 如果参数有默认值，则返回 `true` |\n\
  | `IsIn` | 如果参数是输入，则返回 `true` |\n| `IsOptional` | 如果参数是可选的，则返回 `true` |\n| `IsOut`\
  \ | 如果参数是输出，则返回 `true` |\n| `Member` | 返回使用参数的成员 |\n| `Name` | 返回参数名称 |\n| `ParameterType`\
  \ | 返回参数的类型 |\n| `Position` | 返回参数在列表中的位置（从 0 开始计数） |\n\n`ParameterInfo` 类最常用的方法是\
  \ `GetCustomAttributes`，它返回有关参数自定义属性的信息。\n\n## C# 5.0 程序员参考\n\n由 John Wiley & Sons,\
