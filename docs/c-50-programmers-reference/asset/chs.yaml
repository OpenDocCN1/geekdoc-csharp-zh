  \ 对象数组。可选参数提供一个用于匹配的模式。 |\n| `GetFiles` | 返回代表目录内文件的 `FileInfo` 对象数组。可选参数提供匹配模式。\
  \ |\n| `GetFileSystemInfos` | 返回代表 `DirectoryInfo` 和 `FileInfo` 对象的强类型 `FileSystemInfo`\
  \ 数组（它们都继承自 `FileSystemInfo`）。可选参数提供匹配模式。 |\n| `LastAccessTime` | 获取或设置目录的最后访问时间。\
  \ |\n| `LastAccessTimeUtc` | 获取或设置 UTC 目录最后访问时间。 |\n| `LastWriteTime` | 获取或设置目录的最后写入时间。\
  \ |\n| `LastWriteTimeUtc` | 获取或设置 UTC 目录最后写入时间。 |\n| `MoveTo` | 将目录移动到新路径。 |\n|\
  \ `Name` | 不带路径信息的目录名称。 |\n| `Parent` | 返回代表目录父目录的 `DirectoryInfo` 对象。如果目录是文件系统的根（例如\
  \ `C:\\`），则返回 `null`。 |\n| `Refresh` | 刷新 `DirectoryInfo` 对象的数据。 |\n| `Root` | 返回代表目录文件系统根的\
  \ `DirectoryInfo` 对象。 |\n| `ToString` | 返回目录的全限定路径和名称。 |\n\n### FileInfo\n\n`FileInfo`\
  \ 对象代表一个文件。你可以使用它的属性和方法来创建和删除文件。下表描述了 `FileInfo` 类最常用的公共属性和方法。\n\n| 属性或方法 | 用途 |\n\
  | :--- | :--- |\n| `AppendText` | 返回一个向文件追加文本的 `StreamWriter`。 |\n| `Attributes`\
  \ | 获取或设置文件的属性。这是 `FileAttributes` 标志的组合，可以 `Archive`、`Compressed`、`Device`、`Directory`、`Encrypted`、`IntegrityStream`、`Hidden`、`Normal`、`NoScrubData`、`NotContextIndexed`、`Offline`、`ReadOnly`、`ReparsePoint`、`SparseFile`、`System`\
  \ 和 `Temporary`。 |\n| `CopyTo` | 复制文件并返回代表新文件的 `FileInfo` 对象。一个参数允许你指示是否覆盖现有文件。如果目标路径是相对的，它相对于应用程序的当前目录，而不是\
  \ `FileInfo` 对象的目录。 |\n| `Create` | 创建文件并返回一个附加到该文件的 `FileStream` 对象。（创建一个 `FileInfo`\
  \ 对象，向其构造函数传递一个不存在的文件名，然后使用 `Create` 方法创建文件。） |\n| `CreateText` | 创建文件并返回一个附加到该文件的\
  \ `StreamWriter`。（创建一个 `FileInfo` 对象，向其构造函数传递一个不存在的文件名，然后调用 `CreateText` 方法创建文件。）\
  \ |\n| `CreationTime` | 获取或设置文件的创建时间。 |\n| `CreationTimeUtc` | 获取或设置 UTC 文件的创建时间。\
  \ |\n| `LastAccessTime` | 获取或设置文件的最后访问时间。 |\n| `LastAccessTimeUtc` | 获取或设置 UTC 文件的最后访问时间。\
  \ |\n| `LastWriteTime` | 获取或设置文件的最后写入时间。 |\n| `LastWriteTimeUtc` | 获取或设置 UTC 文件的最后写入时间。\
  \ |\n\n\n\n\n\n| 方法 |set |\n| :--- | :--- |\n| `Delete` | 删除文件。 |\n| `Directory`\
  \ | 返回一个表示文件目录的 `DirectoryInfo` 对象。 |\n| `DirectoryName` | 返回文件目录的名称。 |\n| `Exists`\
  \ | 如果文件存在，则返回 `true`。 |\n| `Extension` | 返回文件名的扩展名部分。例如，`scores.txt` 的扩展名为 `.txt`。\
  \ |\n| `FullName` | 返回文件的完全路径和名称。 |\n| `IsReadOnly` | 如果文件被标记为只读，则返回 `true`。 |\n\
  | `LastAccessTime` | 获取或设置文件的最后访问时间。 |\n| `LastAccessTimeUtc` | 获取或设置 UTC 格式下的文件最后访问时间。\
  \ |\n| `LastWriteTime` | 获取或设置文件的最后写入时间。 |\n| `LastWriteTimeUtc` | 获取或设置 UTC 格式下的文件最后写入时间。\
  \ |\n| `Length` | 返回文件的字节数。 |\n| `MoveTo` | 将文件移动到新位置。如果目标使用相对路径，则它是相对于应用程序当前目录的，而不是\
  \ `FileInfo` 对象的目录。此方法完成后，`FileInfo` 对象将更新为指向文件的新位置。 |\n| `Name` | 不带路径信息的文件名。 |\n\
  | `Open` | 使用各种模式（`Append`、`Create`、`CreateNew`、`Open`、`OpenOrCreate` 或 `Truncate`）、访问（`Read`、`Write`\
  \ 或 `ReadWrite`）和共享（`Read`、`Write`、`ReadWrite` 或 `None`）设置打开文件。此方法返回一个附加到文件的 `FileStream`\
  \ 对象。 |\n| `OpenRead` | 返回一个附加到文件的只读 `FileStream`。 |\n| `OpenText` | 返回一个附加到文件的\
  \ UTF-8 编码 `StreamReader`。 |\n| `OpenWrite` | 返回一个附加到文件的写 `FileStream`。 |\n| `Refresh`\
  \ | 刷新 `FileInfo` 对象的数据。 |\n| `Replace` | 接收三个文件路径作为参数，代表源文件、目标文件和备份文件。如果备份文件存在，此方法将永久删除它。然后将目标文件移动到备份文件，并将源文件移动到目标文件。\
  \ |\n| `ToString` | 返回文件的完全限定名称。 |\n\n### FileSystemWatcher\n\n`FileSystemWatcher`\
  \ 类监控文件系统的一部分，并触发事件以让你的程序知道发生了变化。例如，`FileSystemWatcher` 可以监控目录，并在新文件出现时触发事件，以便你的程序处理该文件。\n\
  \n`FileSystemWatcher` 类的构造函数接收参数，用于告诉它要监控哪个目录，并为它提供一个选择要监控文件的过滤器。例如，过滤器 `*.txt`\
  \ 使其监控文本文件的更改。默认过滤器为 `*.*`，它可以捕获所有带有扩展名的文件更改。\n\n下表描述了 `FileSystemWatcher` 类最有用的属性。\n\
  \n| 属性 | 目的 |\n| :--- | :--- |\n| `EnableRaisingEvents` | 决定监听器是否启用。（此属性默认为 `false`，因此在你将其设置为\
  \ `true` 之前，监听器不会触发任何事件。） |\n| `Filter` | 决定监听器报告事件的文件。（你不能像像 `*.txt` 和 `*.dat`\
  \ 那样监控多种文件类型。请使用多个 `FileSystemWatcher`。） |\n| `IncludeSubdirectories` | 决定对象是否监控主目录下的子目录。\
  \ |\n| `InternalBufferSize` | 决定内部缓冲区的大小。如果监听器正在监控一个非常的目录，小的缓冲区可能会溢出。 |\n| `NotifyFilter`\
  \ | 决定监听器报告的更改类型。这是由 `NotifyFilters` 枚举定义的值的组合，可以包括 `Attributes`、`CreationTime`、`DirectoryName`、`FileName`、`LastAccess`、`LastWrite`、`Security`\
  \ 和 `Size`。 |\n| `Path` | 确定要监控的目录的路径。 |\n\n`Path` 确定了要监控的目录路径。\n\n`FileSystemWatcher`\
  \ 类提供了两个有用的方法。第一个方法 `Dispose` 释放资源。第二个方法 `WaitForChanged` 同步等待变化（带有一个可选的超时时间）。\n\
  \n当发生变化时，`FileSystemWatcher` 会检测它并触发事件通知程序发生了什么。\n\n下表描述了 `FileSystemWatcher` 的事件。\n\
  \n| 名称 | 描述 |\n| :--- | :--- |\n| `Changed` | 文件发生了变化。 |\n| `Created` | 文件被创建。 |\n\
  | `Deleted` | 文件被删除。 |\n| `Error` | 缓冲区溢出。 |\n| `Renamed` | 文件被重命名。 |\n\n### Path\n\
  \n`Path` 类提供了静态属性和方法，用于操作路径。\n\n这些方法返回文件名、扩展名、目录名等。\n\n`Path` 类提供了有关系统路径的值。\n\n\
  下表描述了 `Path` 类最有用的公共属性。\n\n| 属性 | 目的 |\n| :--- | :--- |\n| `AltDirectorySeparatorChar`\
  \ | 返回用于分隔目录的备用字符。通常是 `/`。 |\n| `DirectorySeparatorChar` | 返回通常用于分隔目录的字符。通常是 `\\\
  `（如 `C:\\`）。 |\n| `InvalidPathChars` | 返回路径字符串中不允许的字符数组。该数组包括 `“`、`>` 以及 ASCII 值在\
  \ 0 到 31 之间的不可打印字符。 |\n| `PathSeparator` | 返回环境变量中用于分隔字符串的字符。通常是分号（`;`）。 |\n| `VolumeSeparatorChar`\
  \ | 返回卷器字母和路径其余部分之间的字符。通常是冒号（`:`），如 `C:`。 |\n\n下表描述了 `Path` 类最有用的方法。\n\n| 方法 | 目的\
  \ |\n| :--- | :--- |\n| `ChangeExtension` | 修改路径的扩展名。 |\n| `Combine` | 返回合并后的路径字符串。\
  \ |\n| `GetDirectoryName` | 返回目录。 |\n| `GetExtension` | 返回路径的扩展名。 |\n| `GetFileName`\
  \ | 返回文件名和扩展名。 |\n| `GetFileNameWithoutExtension` | 返回不带扩展名的文件名。 |\n| `GetFullPath`\
  \ | 返回完全限定路径。 |\n| `GetInvalidFileNameChars` | 返回文件名中无效字符的数组。 |\n| `GetInvalidPathChars`\
  \ | 返回路径中无效字符的数组。 |\n| `GetPathRoot` | 返回根目录字符串。 |\n| `GetRandomFileName` | 返回随机文件名。\
  \ |\n| `GetTempFileName` | 创建唯一的临时文件并返回其完全路径。你的程序可以打开该文件作为临时空间，执行需要的操作，关闭文件然后删除它。典型的文件名可能是\
  \ `C:\\Users\\Rod\\AppData\\Local\\Temp\\tmpD4F0.tmp`。 |\n| `GetTempPath` | 返回系统临时文件夹的路径。这是\
  \ `GetTempFileName` 返回的文件名的路径部分。 |\n| `HasExtension` | 如果路径包含扩展名，则返回 `true`。 |\n\
  | `IsPathRooted` | 如果路径是绝对路径，则返回 `true`。这包括 `C:\\Tests\\Logs.txt` 和 `\\Clients\\\
  Litigation`，但不包括 `LostFiles\\Peter.txt` 或 `.\\Jokes`。 |\n\n## 使用回收桶\n\n遗憾的是，C# 并不包含处理回收桶的方法。然而，你可以结合使用不同的技术：使用\
  \ `FileIO.FileSystem` 类、使用 API 函数以及使用 `Shell32.Shell`。\n\n\n\n\n\n`ManageRecycleBin`\
  \ 示例程序可以在本书的网站上下载，它演示了后续章节中描述的技术。输入文件或目录名称并点击相应的 `Delete` 按钮可将该项目移动到回收站。点击 `Refresh`\
  \ 刷新回收站中的文件列表。点击 `Empty` 从回收站中永久删除所有文件。最后，右键点击回收站中的文件，可以查看右键菜单，其中提供了你可以应用于该文件的命令，如图\
  \ 19-1 所示。\n\n![c19f001.tif](img/c19f001.png)\n\n`图 19-1: `ManageRecycleBin` 示例程序允许你查看和操作回收站中的文件。\n\
  \n你可能想要下载 `ManageRecycleBin` 示例程序，以便在阅读后续章节时进行参考。\n\n### 使用 `FileIO.FileSystem`\
  \ 类\n\n`Microsoft.VisualBasic.FileIO` 命名空间包含一个 `FileSystem` 类，该类提供了 `DeleteDirectory`\
  \ 和 `DeleteFile` 方法。这些方法可以接受一个可选参数，指示你是想将目录或文件移动到回收站，还是想永久删除该目录或文件。（它们还可以接受一个参数，让你决定方法是否应该显示进度对话框。）\n\
  \n一些 C# 开发者倾向于不使用 `Microsoft.VisualBasic` 命名空间定义的类，认为它们在某种程度上不够“C# 化”。我个人认为这简直是愚蠢。如果\
  \ `Microsoft.VisualBasic` 命名空间包含了你可以让生活变得更轻松的工具，那么忽略它们只会是在伤害自己。这个类位于 .NET Framework\
  \ 中，所以你并不是在偷偷使用某种非标的“后巷代码”。\n\n下面的代码显示了 `ManageRecycleBin` 程序在你点击其任一 `Delete` 按钮时执行的事件处理程序。\n\
  \n```csharp\n// 删除文件。\nprivate void deleteFileButton_Click(object sender, EventArgs\
  \ e)\n{\n    FileSystem.DeleteFile(fileTextBox.Text,\n        UIOption.OnlyErrorDialogs,\
  \ RecycleOption.SendToRecycleBin);\n    fileTextBox.Clear();\n    ListFiles();\n\
  }\n\n// 删除目录。\nprivate void deleteDirectoryButton_Click(object sender, EventArgs\
  \ e)\n{\n    FileSystem.DeleteDirectory(directoryTextBox.Text,\n        UIOption.OnlyErrorDialogs,\
  \ RecycleOption.SendToRecycleBin);\n    directoryTextBox.Clear();\n    ListFiles();\n\
  }\n```\n\n第一个事件处理程序删除一个文件。它调用 `FileSystem` 类的 `DeleteFile` 方法，传递了要删除的文件名、一个指示方法应仅显示错误消息（不显示动画或确认对话框）的\
  \ `UIOption` 标志，以及一个指示文件应移动到回收站的 `RecycleOption` 值。\n\n代码随后清除了持有文件名的 `TextBox`，并调用\
  \ `ListFiles` 方法。`ListFiles` 方法使用了 `Shell32.Shell`，该类将在稍后的“使用 `Shell32.Shell`”章节中进行描述。\n\
  \n### 使用 API 函数\n\n`FileIO.FileSystem` 类允许你轻松地将目录和文件移动到回收站，但它没有提供任何其他处理回收站的工具。它不能让你确定回收站中项目的数量或大小，无法从回收站中恢复项目，也无法清空回收站。\n\
  \n幸运的是，你可以使用 `SHEmptyRecycleBin` API 函数相对容易地清空回收站。此 API 函数接受一个 `RecycleFlags` 枚举类型的参数。（实际上，函数本身接受一个\
  \ `uint` 作为参数，但枚举使得你的代码能够更容易地指定所需的选项。）下面的代码显示了该枚举的定义。\n\n```csharp\n[Flags]\nprivate\
  \ enum RecycleFlags : uint\n{\n    SHERB_NOCONFIRMATION = 0x1,\n    SHERB_NOPROGRESSUI\
  \ = 0x2,\n    SHERB_NOSSOUND = 0x4\n}\n```\n\n下面的代码显示了 API 函数的声明。\n\n```csharp\n\
  [DllImport(\"shell32.dll\")]\nstatic extern int SHEmptyRecycleBin(\n    IntPtr hWnd,\
  \ string pszRootPath, uint dwFlags);\n```\n\n这里的 `shell32.dll` 是包含 `SHEmptyRecycleBin`\
  \ API 函数的库。这与下一节中描述的 `Shell32.Shell` 技术不同。\n\n`ManageRecycleBin` 程序使用了以下 `EmptyRecycleBin`\
  \ 方法，该方法封装了对 `SHEmptyRecycleBin` 的调用。\n\n```csharp\npublic static void EmptyRecycleBin(bool\
  \ showProgress, bool playSound,\n    bool confirm)\n{\n    RecycleFlags options\
  \ = 0;\n    if (!showProgress) options |= RecycleFlags.SHERB_NOPROGRESSUI;\n   \
  \ if (!playSound) options |= RecycleFlags.SHERB_NOSOUND;\n    if (!confirm) options\
  \ |= RecycleFlags.SHERB_NOCONFIRMATION;\n\n    SHEmptyRecycleBin(IntPtr.Zero, null,\
  \ (uint)options);\n}\n```\n\n该方法使用其参数创建一个适当的 `RecycleFlags` 值。然后简单地调用 API 函数。\n\n\
  当你点击 Empty 按钮时，程序使用以下代码调用 `EmptyRecycleBin` 方法。\n\n```csharp\n// 清空回收站。\nprivate\
  \ void emptyButton_Click(object sender, EventArgs e)\n{\n    // 带声音并让用户确认。\n   \
  \ EmptyRecycleBin(false, true, true);\n\n    // 刷新。\n    ListFiles();\n}\n```\n\n\
  ### 使用 `Shell32.Shell`\n\n`Shell32.Shell` 是用于操作 Windows shell 的接口。通过 `Shell` 你可以执行之一包括与远程打印机和回收站等虚拟对象进行交互。\n\
  \n回收站中的文件由 `FolderItem` 表示。为了处理文件，`ManageRecycleBin` 程序需要跟踪这些 `FolderItem`。为了这样做，它在以下\
  \ `RecycleItemInfo` 类中存储信息。\n\n```csharp\n// 持有 FolderItem 并返回其名称类。\nprivate class\
  \ RecycleItemInfo\n{\n    public FolderItem Item;\n    public RecycleItemInfo(FolderItem\
  \ item)\n    {\n        Item = item;\n    }\n    public override string ToString()\n\
  \    {\n        return Item.Name;\n    }\n}\n```\n\n下面的代码显示了 `ManageRecycleBin`\
  \ 程序的 `ListFiles` 方法。\n\n```csharp\n// 列出回收站中的文件。\nprivate void ListFiles()\n{\n\
  \    const int RECYCLE_BIN_NAMESPACE = 10;\n\n    Shell shell = new Shell();\n \
  \   Folder bin = shell.NameSpace(RECYCLE_BIN_NAMESPACE);\n\n    // 列出文件。\n    filesListBox.Items.Clear();\n\
  \    foreach (FolderItem item in bin.Items())\n    {\n        filesListBox.Items.Add(new\
  \ RecycleItemInfo(item));\n    }\n}\n```\n\n下面的代码显示了当右键点击 `ListBox` 中的文件条目时程序是如何响应的。\n\
  \n```csharp\n// 显示右键菜单。\nprivate void filesListBox_MouseDown(object sender, MouseEventArgs\
  \ e)\n{\n    if (e.Button == MouseButtons.Right)\n    {\n        int index = filesListBox.TestHit(e.Location);\n\
  \        if (index != -1)\n        {\n            RecycleItemInfo info = (RecycleItemInfo)filesListBox.Items[index];\n\
  \            FolderItem item = info.Item;\n\n            // 显示右键菜单。\n          \
  \  ShowContextMenu(item);\n        }\n    }\n}\n```\n\n\n\n\n\n```c\n// 在右键点击时，在菜单中显示项的动词。\n\
  private void filesListBox_MouseDown(object sender, MouseEventArgs e)\n{\n    //\
  \ 确保是右键。\n    if (e.Button != MouseButtons.Right) return;\n\n    // 找到鼠标下的项。\n \
  \   int index = filesListBox.IndexFromPoint(e.Location);\n    if (index < 0) return;\n\
  \n    // 选中该项。\n    filesListBox.SelectedIndex = index;\n\n    // 获取项的 RecycleItemInfo。\n\
  \    RecycleItemInfo info = filesListBox.SelectedItem as RecycleItemInfo;\n\n  \
  \  // 获取项的 FolderInfo 对象。\n    FolderItem item = info.Item;\n\n    // 创建上下文菜单。\n\
  \    ContextMenu menu = new ContextMenu();\n    foreach (FolderItemVerb verb in\
  \ item.Verbs())\n    {\n        MenuItem menuItem = new MenuItem(verb.Name, ContextMenuItem_Click);\n\
  \        menuItem.Tag = verb;\n        menu.MenuItems.Add(menuItem);\n    }\n  \
  \  menu.Show(filesListBox, e.Location);\n}\n```\n\n这段代码为用户右键点击的项创建了一个相应的上下文菜单。首先，如果按下的按钮不是右鼠标键，方法将退出。\n\
  \n接下来，程序使用 `ListBox` 的 `IndexFromPoint` 方法获取鼠标下项的索引。如果该处没有项，方法将退出。如果鼠标下方有一个项，代码将选中它。\n\
  \n代码随后选中的项转换为存储在 `ListBox` 中的 `RecycleItemInfo` 对象，并获取存储在该对象内部的 `FolderItem`。\n\n\
  该方法随后创建一个 `ContextMenu` 并遍历由 `FolderItem` 的 `Verbs` 方法返回的列表。这些项中的每一个都是 `FolderItemVerb`\
  \ 接口，代表 `FolderItem` 可以执行的操作。\n\n代码为每个动词创建了一个新的 `MenuItem`。`MenuItem` 显示动词名称，并与\
  \ `ContextMenuItem_Click` 事件处理程序关联。代码将 `FolderItemVerb` 存储在 `MenuItem` 的 `Tag` 属性中。\n\
  \n在创建了 `ContextMenu` 和动词的 `MenuItem` 之后，程序显示 `ContextMenu`。\n\n下面的代码显示了 `ContextMenuItem_Click`\
  \ 事件处理程序。\n\n```c\n// 对文件执行某些操作。\nprivate void ContextMenuItem_Click(object sender,\
  \ EventArgs e)\n{\n    // 获取 MenuItem。\n    MenuItem menuItem = sender as MenuItem;\n\
  \n    // 获取动词。\n    FolderItemVerb verb = menuItem.Tag as FolderItemVerb;\n\n  \
  \  // 调用动词。\n    verb.DoIt();\n\n    // 重新显示文件。\n    ListFiles();\n}\n```\n\n首先，这段代码获取了点击的\
  \ `MenuItem`。它从 `MenuItem` 的 `Tag` 属性中获取相应的 `FolderItemVerb`。代码调用 `FolderItemVerb`\
  \ 的 `DoIt` 方法来使其执行应该执行的任何操作。最后通过调用 `ListFiles` 来刷新文件列表，以防动词更改了回收站中的文件（例如，通过还原一个文件）。\n\
  \n下载 `ManageRecycleBin` 程序以查看更多细节。该程序并不简单，但它确实演示了你可以用于处理回收站的技术。\n\n## 总结\n\n`System.IO`\
  \ 命名空间提供了许多允许你操作文件和目录的类。如 `Directory`、`DirectoryInfo`、`File` 和 `FileInfo` 等类可以轻松创建、检查、移动、重命名和删除目录及文件。`File`\
  \ 类的 `ReadAllText` 和 `WriteAllText` 方法使得读取或写入整个文件变得特别简单。\n\n`FileSystemWatcher`\
  \ 类允许应用程序监控文件或目录，并在其发生变化时采取行动。例如，程序可以监控一个打印缓存目录，并在其中出现新文件时采取行动。\n\n`Path` 类提供了用于处理路径的各种杂项支持。例如，它提供了你可以用于组合路径和解析相对路径的方法。\n\
  \n这些工具之间存在相当的重叠，因此你不需要觉得必须使用它们中的全部。仔细观察以了解哪些可用工具，然后选择你认为最顺手的工具即可。\n\n最后，本章解释了你可以用于管理回收站的技术。其中某些技术相当复杂，但至少\
  \ `FileIO.FileSystem` 类让将文件或目录移动到回收站的操作变得相当简单。\n\n到目前为止，书中的章节已经解释了如何在用户的本地计算机上执行操作。下一章将解释程序如何离开本地计算机，从\
  \ Internet 网上下载文件。\n\n## 练习题\n\n1. 编写一个程序，允许用户选择一个目录并显示其创建时间、最后访问时间和最后写入时间。\n\n\
  2. 编写一个程序，允许用户选择一个文件并显示其创建时间、最后访问时间和最后写入时间。允许用户更改这些时间并将它们应用于文件。\n\n3. 编写一个程序，允许用户获取和设置文件的属性。使用\
  \ `CheckBox` 显示并让用户指定属性。\n\n4. 编写一个程序，使用 `File.ReadAllText` 和 `File.WriteAllText`\
  \ 在启动和停止时保存并还原文本的内容。将你的解决方案与练习 18-3 的解决方案进行比较。\n\n5. 编写一个对文件中的行进行排序的程序。（提示：使用 `File.ReadAllLines`\
  \ 获取行并排序，然后使用 `File.WriteLines` 将它们写回文件。）\n\n6. 编写一个程序，列出驱动器以及来自 `DriveInfo` 的可用驱动器信息。\n\
  \n7. 修改你为练习 6 编写的程序，根据情况显示 KB、MB、GB 或 TB。\n\n8. 编写一个程序，显示程序执行所在目录高出两级的目录名称。如果你在目录顶部运行程序（例如在\
  \ `C:\\` 中），会发生什么？\n\n9. 编写一个程序，允许用户输入目录路径和模式。当用户点击搜索按钮时，程序应在该目录及其子目录中搜索匹配模式的文件。\n\
  \n10. 修改你为练习 9 编写的程序，使其显示文件名（不带路径）及其大小。\n\n11. 编写一个程序，使用 `FileSystemWatcher` 监控程序执行所在目录的变化。当发生更改时，程序应显示日期和时间、更改类型以及更改的文件的文件。\n\
  \n12. 编写一个程序，允许用户输入文件名，然后使用 `FileIO` 类将文件移动到回收站。（这正是许多程序需要需要的操作。你可以使用桌面上的回收站来管理其内容。）\n\
