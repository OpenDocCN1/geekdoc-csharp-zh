  d\")\n\"4/1/2015\"\nDateTime.Now.ToString(\"%d\")\n```\n\n## 附录：其他格式说明符\n\n其他格式说明符\n\
  \n后续章节描述了标准和自定义说明符。\n\n### 标准数字说明符\n\n标准数字说明符允许你轻松地显示常用格式。下表列出了标准说明符。\n\n| 说明符 |\
  \ 含义 |\n| :--- | :--- |\n| `C` 或 `c` | 货币。如果 `C` 后面跟着精度说明符，它表示小数点后数字的位数。在美国的标准系统上，使用说明符\
  \ `C3` 的值 –1234.5678 将产生 ($1,234.568)。 |\n| `D` 或 `d` | 十进制（整数）。此说明符仅适用于整数类型。它仅显示数字数位。如果\
  \ `D` 后面跟着精度说明符，它表示结果应有的位数，必要时在左侧填充。如果值为负数，结果左侧有一个负号。使用说明符 `D6` 的值 –1234 将产生 –001234。\
  \ |\n| `E` 或 `e` | 科学计数法。结果小数点左侧始终有一个数字，后面是更多数字、一个 E 或 e、正负号以及至少三位指数（必要时在左侧补零）。如果\
  \ `E` 后面跟着精度说明符，它表示结果小数点后应有的位数。使用说明符 `e2` 的值 –1234.5678 将产生 –1.23e+003。 |\n| `F`\
  \ 或 `f` | 固定点法。值为负数时结果包含负号、数字、小数点，然后是更多数字。如果 `F` 后面跟着精度说明符，它表示结果小数点后应有的位数。使用说明符\
  \ `f3` 的值 –1234.5678 将产生 –1234.568。 |\n| `G` 或 `g` | 通用。根据哪种方式更紧凑采用科学计数法或固定点法。 |\n\
  | `N` 或 `n` | 数字。值为负数时结果包含负号、带有千分位分隔符的数字、小数点以及更多数字。如果 `N` 后面跟着精度说明符，它表示结果小数点后应有的位数。使用说明符\
  \ `N3` 的值 –1234.5678 将产生 –1,234.568。 |\n\n\n\n\n\n| `P` 或 `p` | 百分比。该值乘以 100，然后根据计算机设置进行格式化。如果\
  \ `P` 后面跟随精度指定符，它表示数小数点后的数字位数。值 `1.2345678` 配合指定符 `P` 产生 `123.46%`。 |\n\n| `R` 或\
  \ `r` | 往返舍（Round trip）。该值的格式化方式使得结果可以转换回其原始值。取决于数据类型和值，这可能需要 17 位精度。值 `1/7` 配合指定符\
  \ `R` 产生 `0.14285714285714285`。 |\n\n| `X` 或 `x` | 十六进制。这仅适用于整数类型。该值被转换为十六进制。`X`\
  \ 或 `x` 的大小写决定了 9 之上的十六进制数字是用大写还是小写字母。如果 `X` 后面跟随精度指定符，它表示结果应具有的位数，必要时在左侧补零。值 `183`\
  \ 配合指定符 `x4` 产生 `00b7`。 |\n\n## 自定义数值格式指定符\n\n下表列出了用于构建自定义数值格式的字符。\n\n| **指定符**\
  \ | **含义** |\n\n| `0` | 数字或 0。如果数字在该位置没有数字，则该指定符会添加一个 `0`。值 `12` 配合指定符 `000.00`\
  \ 产生 `012.00`。 |\n| `#` | 数字。如果数字在该位置没有数字，则不打印任何内容。 |\n| `,` | 如果在两个数字（`0` 或 `#`）之间使用，则会在结果中添加千分位分隔符。注意，它会根据需要添加尽可能的分隔符。值\
  \ `1234567` 配合指定符 `#,#` 产生 `1,234,567`。 |\n| `,` | 如果紧邻小数点左侧使用，则每有一个逗号，数字除以 1000。值\
  \ `1234567` 配合指定符 `#,#,.` 产生 `1,235`。 |\n| `%` | 将数字乘以 100，并在指定符中其出现的地方插入 `%` 符号。值\
  \ `0.123` 配合指定符 `.00%` 产生 `12.30%`。 |\n| `E0` 或 `e0` | 以科学计数法显示数字，在数字和指数之间插入 `E`\
  \ 或 `e`。使用 `#` 和 `0` 在指数前对数字进行格式化。`E` 之后 `0` 的数量决定了指数的位数。如果你在 `E` 和 `0` 之间放置 `+`\
  \ 号，则结果的指数将包含 `+` 或负号。如果你省略了 `+` 号，则仅在指数为负时才包含符号。值 `1234.5678` 配合指定符 `00.000E+000`\
  \ 产生 `12.346E+002`。 |\n| `\\` | 原样显示随后的字符，而不进行解释。使用 `\\\\` 显示 `\\` 字符。值 `12` 配合指定符\
  \ `#\\%` 产生 `12%`。相同的值配合指定符 `#%` 产生 `1200%`。 |\n| `'ABC'` 或 `\"ABC\"` | 原样显示引号中的字符。值\
  \ `12` 配合指定符 `#'%'` 产生 `12%`。 |\n\n## 数值格式化区域\n\n数值格式指定符可能包含由分号分隔的一个、两个或三个部分。如果指定符包含一个部分，则该指定符将用于所有的数值。\n\
  \n如果指定符包含两个部分，第一部分用于格式化正值或零值，第二部分用于格式化负值。\n\n如果指定符包含三个部分，第一部分用于格式化正值，第二部分用于格式化负值，第三部分用于格式化零值。\n\
  \n以下文本显示了使用指定符 `#,#.00;<#,#.00>;ZERO` 处理三个值的立即窗口（Immediate window）中的输出。\n\n```\n\
  (1234.5678).ToString(\"#,#.00; <#,#.00>;ZERO\")\n\"1,234.57\"\n(-1234.5678).ToString(\"\
  #,#.00; <#,#.00>;ZERO\")\n\" <1,234.57>\"\n(0).ToString(\"#,#.00; <#,#.00>;ZERO\"\
  )\n\"ZERO\"\n```\n\n## 复合格式化\n\n`String.Format`、`Console.WriteLine` 和 `TextWriter.WriteLine`\
  \ 方法提供了格式化字符串的不同方法。这些例程可以接受一个复合格式化字符串参数，该参数包含字面字符加上值的占位符。方法的其他参数提供这些值。\n\n值占位符具有以下格式。\n\
  \n```\n{index«,alignment»«:format_specifier»}\n```\n\n`index` 值给出了参数的索引（从 0 开始编号），该参数应插入到此占位符的位置。\n\
  \n可选的 `alignment` 值告诉我们该项目应使用的最小字符数，并在时将用空格填充结果。如果该值为负数，则结果左对齐。如果该值为正数，则结果右对齐。\n\
  \n`format_specifier` 指明如何对项目进行格式化。\n\n例如，考虑以下代码。\n\n```\nstring name = \"Crazy Bob\"\
  ;\ndecimal sales = -12345.67m;\nMessageBox.Show(String.Format(\"{0} {1:earned;lost}\
  \ {1:c} this year\", name, sales));\n```\n\n第一个占位符引用参数数字 `0`。格式指定符后的第一个参数是变量 `name`，其值为\
  \ `Crazy Bob`。\n\n第二个占位符引用参数数字 `1`，并包含一个包含两部分的格式指定符，该指定符在值为正数或零时显示 `earned`，在值为负数时显示\
  \ `lost`。第三个占位符再次引用参数数字 `1`，这次显示以货币格式格式化的其值。\n\n以下显示了结果。\n\n```\nCrazy Bob lost\
  \ ($12,345.67) this year\n```\n\n## 枚举类型格式化\n\n枚举值以字符串表示的形式格式化，而不是以表示它们的整数值格式化。例如，考虑以下代码。\n\
  \n```csharp\npublic enum Dessert\n{\n    Cake = 1,\n    Pie = 2,\n}\n...\nDessert\
  \ selection = Cake;\nMessageBox.Show(selection.ToString());\n```\n\n这段代码显示了字符串 `Cake`。\n\
  \n对于枚举类型的变量（如 `selection`），`ToString` 方法可以接受一个指定符来决定如何格式化值。\n\n指定符 `G` 或 `g` 将值格式化为字符串。如果值在枚举中未定义，则结果为数值。例如，如果你将\
  \ `selection` 设置为 7，`selection.ToString(\"G\")` 返回 `7`。\n\n如果你定义带有 `Flags` 属性的枚举类型，则该类型的变量可以是值的组合，如下所示。\n\
  \n```csharp\n[Flags()]\npublic enum Dessert\n{\n    Cake = 1,\n    Pie = 2,\n  \
  \  Cookie = 3,\n    IceCream = 4,\n}\n...\nDessert selection = IceCream | Pie;\n\
  Console.WriteLine(selection.ToString(\"G\"));\n```\n\n在这种情况下，`G` 格式指定符返回一个由逗号分隔的标志字符串。在示例中，结果是\
  \ `Pie, IceCream`。注意值的顺序是枚举定义的顺序，而不是赋值给变量的顺序。\n\n如果在定义枚举类型时未使用 `Flags` 属性，当变量是值的组合而非列表中的单个值时，`G`\
  \ 格式指定符始终返回变量的数值值。相比之下，`F` 指定符在合理时返回逗号分隔的值列表。例如，如果你从之前的代码中省略 `Flags` 属性，`selection.ToString(\"\
  G\")` 返回 `6`（因为 `Pie` + `IceCream` = 2 + 4 = 6），但 `selection.ToString(\"F\")` 返回\
  \ `Pie, IceCream`。\n\n`D` 或 `d` 指定符始终将变量格式化为数字。\n\n指定符 `X` 或 `x` 将值格式化为十六进制数字。下表总结了枚举格式指定符。\n\
  \n| **指定符** | **含义** |\n| `G` 或 `g` | （默认。）如果可能则返回字符串值。如果值包含多个枚举值且枚举标记了 `Flags`\
  \ 属性，则返回返回用逗号分隔的值。如果值在枚举中未定义，或者它包含多个枚举值但枚举没有 `Flags` 属性，则返回数值值。 |\n\n\n\n\n\n| 参数\
  \ | 说明 |\n| :--- | :--- |\n| `F` 或 `f` | 如果可能，返回字符串值。如果该值包含多个枚举值，则返回由逗号分隔的值。如果该值未由枚举定义，则返回数值。\
  \ |\n| `D` 或 `d` | 始终返回数值结果。 |\n| `X` 或 `x` | 始终返回十六进制数值结果。 |\n\n等待，让我提供完整的格式化文本：\n\
  \n# 附录 R\n\n## 流 (Streams)\n\n.NET Framework 提供了几个将数据视为流（有序字节序列）的类。这些类并不难使用，但它们之间的相似之处容易引起混淆。本附录总结了流类，并描述了它们的属性和方法。有关流的更多信息，请参见第\
  \ 18 章“流”。\n\n### 流类摘要\n\n下表列出了 .NET Framework 的流类。\n\n| 类 | 目的 |\n| :--- | :---\
  \ |\n| `BinaryReader`, `BinaryWriter` | 使用管理特定数据类型的程序（如 `ReadDouble` 和 `ReadUInt16`）从底层流读取和写入数据。\
  \ |\n| `BufferedStream` | 为另一种流类型添加缓冲区。这有时可以提高相对较慢的底层设备上的性能。 |\n| `CryptoStream`\
  \ | 对其数据应用加密转换。 |\n| `FileStream` | 将文件表示为流。通常，你可以使用 `BinaryReader` 或 `TextWriter`\
  \ 等辅助类使操作 `FileStream` 变得更容易。 |\n| `MemoryStream` | 允许你在内存中读写流数据。当你需要流但不想读取或写入文件时，这非常有用。\
  \ |\n| `NetworkStream` | 跨网络连接发送和接收数据。 |\n| `Stream` | 通用流类。这是一个抽象类，因此你不能直接创建它。相反，你必须实例化它的子类之一。\
  \ |\n| `StreamReader`, `StreamWriter` | 这些类继承自 `TextReader` 和 `TextWriter`。它们提供了向底层流（通常是\
  \ `FileStream`）读取和写入文本的方法。 |\n| `StringReader`, `StringWriter` | 这些类继承自 `TextReader`\
  \ 和 `TextWriter`。它们提供了向底层字符串读取和写入文本的方法。 |\n| `TextReader`, `TextWriter` | 这些抽象类定义了使在底层流上处理文本变得更容易的方法。\
  \ |\n\n后续章节将更详细地描述流类。\n\n### Stream 类\n\n下表描述了 `Stream` 类最有用的属性。\n\n| 属性 | 目的 |\n\
  | :--- | :--- |\n| `CanRead` | 如果流支持读取，返回 `true`。 |\n| `CanSeek` | 如果流支持跳转到特定位置，返回\
  \ `true`。 |\n| `CanTimeout` | 如果流支持超时，返回 `true`。 |\n| `CanWrite` | 如果流支持写入，返回 `true`。\
  \ |\n| `Length` | 返回流中的字节数。 |\n| `Position` | 返回流在字节中的当前位置。对于支持跳转的流，程序可以设置此值移动到特定位置。\
  \ |\n| `ReadTimeout` | 决定流的读取超时时间（单位毫秒）。 |\n| `WriteTimeout` | 决定流的写入超时时间（单位毫秒）。\
  \ |\n\n下表描述了 `Stream` 类最有用的方法。\n\n| 方法 | 目的 |\n| :--- | :--- |\n| `BeginRead` |\
  \ 开始异步读取。 |\n| `BeginWrite` | 开始异步写入。 |\n| `Close` | 关闭流并释放其使用的任何资源（如文件句柄）。 |\n\
  | `EndRead` | 等待异步读取完成。 |\n| `EndWrite` | 结束异步写入。 |\n| `Flush` | 将流缓冲区中的数据刷新到底层存储介质（设备、文件等）。\
  \ |\n| `Read` | 从流中读取字节并将其位置移动相应的字节数。 |\n| `ReadByte` | 从流中读取一个字节并将位置移动 1 个字节。 |\n\
  | `Seek` | 如果流支持跳转，则设置流的位置。 |\n| `SetLength` | 设置流的长度。如果流当前长度大于新长度，则对其截断。如果流短于新长度，则对其扩大。该流必须同时支持写入和跳转才能使用此方法。\
  \ |\n| `Write` | 向流中写入字节并将当前位置移动相应的字节数。 |\n| `WriteByte` | 向流中写入 1 个字节并将当前位置移动 1\
  \ 个字节。 |\n\n`FileStream` 和 `MemoryStream` 类仅在 `Stream` 类定义的方法的基础上增加了少量方法。其中最重要的是针对特定流类型的新构造函数。例如，`FileStream`\
  \ 类提供了用于以各种模式（追加、新建等）打开文件的构造函数。\n\n###### BinaryReader 和 BinaryWriter\n\n这些是流辅助类，使得能够更方便地以特定格式向底层流读取和读写数据。下表描述了\
  \ `BinaryReader` 类最有用的方法。\n\n| 方法 | 目的 |\n| :--- | :--- |\n| `Close` | 关闭 `BinaryReader`\
  \ 及其底层流。 |\n| `PeekChar` | 读取读取器的下一个字符但不移动读取器的位置，因此其他方法以后仍然读取该字符。 |\n| `Read` |\
  \ 从流中读取字符并移动读取器位置。 |\n| `ReadBoolean` | 从流中读取一个 `bool` 并移动读取器位置 1 个字节。 |\n| `ReadByte`\
  \ | 从流中读取一个 `byte` 并移动读取器位置 1 个字节。 |\n| `ReadBytes` | 从流中读取数量的 `byte` 到 `byte` 数组中，并移动读取器位置相应的字节数。\
  \ |\n| `ReadChar` | 从流中读取一个字符并根据流的编码和字符移动读取器位置。 |\n| `ReadChars` | 从流中读取数量的字符，以\
  \ `char` 数组返回结果，并根据流的编码和字符数量移动读取器位置。 |\n| `ReadDecimal` | 从流中读取一个 `decimal` 值并移动读取器位置\
  \ 16 字节。 |\n| `ReadDouble` | 从流中读取一个 64 位双精度浮点值 (`double`) 并移动读取器位置 8 字节。 |\n| `ReadInt16`\
  \ | 从流中读取一个 16 位有符号整数 (`short`) 并移动读取器位置 2 字节。 |\n| `ReadInt32` | 从流中读取一个 32 位有符号整数\
  \ (`int`) 并移动读取器位置 4 字节。 |\n| `ReadInt64` | 从流中读取一个 64 位有符号整数 (`long`) 并移动读取器位置\
  \ 8 字节。 |\n| `ReadSByte` | 从流中读取一个有符号的字节 (`sbyte`) 并移动读取器位置 1 个字节。 |\n| `ReadSingle`\
  \ | 从流中读取一个 32 位单精度浮点值 (`float`) 并移动读取器位置 4 字节。 |\n| `ReadString` | 从流中读取一个 `string`\
  \ 并移动读取器位置越过它。字符串以长度开头。 |\n| `ReadUInt16` | 从流中读取一个 16 位无符号整数 (`ushort`) 并移动读取器位置\
  \ 2 字节。 |\n| `ReadUInt32` | 从流中读取一个 32 位无符号整数 (`uint`) 并移动读取器位置 4 字节。 |\n| `ReadUInt64`\
  \ | 从流中读取一个 64 位无符号整数 (`ulong`) 并移动读取器位置 8 字节。 |\n\n下表描述了 `BinaryWriter` 类最有用的方法。\n\
  \n| 方法 | 说明 |\n| :--- | :--- |\n| `Close` | 关闭 `BinaryWriter` 及其底层流。 |\n| `Flush`\
  \ | 将任何缓冲区数据写入底层流。 |\n| `Seek` | 设置流中的位置。 |\n| `Write` | 向流中写入值。该方法有许多重载版本，可以写入字符、字符数组、整数、字符串、无符号\
  \ 64 位整数等。 |\n\n### TextReader 和 TextWriter\n\n这些是流辅助类，使得能够更方便地向底层流读和写入文本数据。下表描述了\
  \ `TextReader` 类最有用的方法。\n\n\n\n\n\n| 方法 | 目的 |\n| :--- | :--- |\n| `Close` | 关闭读取器并释放其正在使用的任何资源。\
  \ |\n| `Peek` | 从文本中读取下一个字符而不改变读取器的状态，以便其他方法稍后读取该字符。 |\n| `Read` | 从输入中读取数据。该方法的重载版本可以读取单个字符或长度到指定长度的字符数组。\
  \ |\n| `ReadBlock` | 从输入中读取数据到字符数组中。 |\n| `ReadLine` | 从输入中读取一行字符并以字符串形式返回数据。 |\n\
  | `ReadToEnd` | 读取输入流中的所有剩余字符并以字符串形式返回。 |\n\n下表描述了 `TextWriter` 类最实用的属性。\n\n| 属性\
  \ | 目的 |\n| :--- | :--- |\n| `Encoding` | 指定数据的编码（ASCII、UTF-8、Unicode 等）。 |\n| `FormatProvider`\
  \ | 返回一个控制格式化的对象。 |\n| `NewLine` | 获取或设置流的换行序列。 |\n\n下表描述了 `TextWriter` 类最实用的方法。\n\
  \n| 方法 | 目的 |\n| :--- | :--- |\n| `Close` | 关闭写入器并释放其正在使用的任何资源。 |\n| `Flush` | 将任何缓冲区数据写入底层输出中。\
  \ |\n| `Write` | 将值写入输出中。该方法有许多重载版本，可以写入字符、字符数组、整数、字符串、无符号 64 位整数等。 |\n| `WriteLine`\
  \ | 将数据写入输出，并在随后加上换行序列。 |\n\n## StringReader 和 StringWriter\n\n`StringReader` 和\
  \ `StringWriter` 类允许程序在字符串中读取和写入文本。它们实现了其父类 `TextReader` 和 `TextWriter` 定义的功能。请参阅本附录前面的“TextReader\
  \ and TextWriter”部分以获取这些功能的列表。\n\n## StreamReader 和 StreamWriter\n\n`StreamReader`\
  \ 和 `StreamWriter` 类允许程序在底层流（通常是 `FileStream`）中读取和写入数据。它们实现了其父类 `TextReader` 和 `TextWriter`\
  \ 定义的功能。请参阅本附录前面的“TextReader and TextWriter”部分以获取这些功能的列表。\n\n## 文本文件流方法\n\n`System.IO.File`\
  \ 类提供了几个用于处理文本文件的方便方法。下表总结了这些方法。\n\n| 方法 | 目的 |\n| :--- | :--- |\n| `AppendText`\
  \ | 创建文本文件，或如果文件已存在则打开它以追加模式。返回一个用于写入文件的 `StreamWriter`。 |\n| `CreateText` | 创建一个文本文件，如果文件已存在则则覆盖它。返回一个用于写入文件的\
  \ `StreamWriter`。 |\n| `Exists` | 如果文件存在则返回 `true`。一种良好的做法（而且速度快得多）是只在 `Exists`\
  \ 返回 `true` 时才尝试打开文件，而不是直接尝试打开文件并使用 `try-catch-finally` 块捕获错误。 |\n| `OpenText` |\
  \ 打开现有的文本文件并返回一个用于从其读取的 `StreamReader`。如果文件不存在，此方法将抛出 `FileNotFoundException`。 |\n\
  \n# 附录 S\n\n### 文件系统类\n\n本附录描述了 .NET Framework 的文件系统类。它还总结了你可以用于管理回收站的方法。\n\n##\
  \ 框架类\n\n`System.IO` 命名空间提供了几个用于处理文件系统的类。以下章节描述了这些类提供的属性、方法和事件。\n\n### Directory\n\
  \n`Directory` 类提供了用于处理目录的静态方法。下表总结了这些静态方法。\n\n| 方法 | 目的 |\n| :--- | :--- |\n| `CreateDirectory`\
  \ | 创建目录以及该路径上任何缺失的目录。 |\n| `Delete` | 删除目录及其内容。它可以递归地删除所有子目录。 |\n| `Exists` | 如果路径指向现有的目录则返回\
  \ `true`。 |\n| `GetCreationTime` | 返回目录的创建日期和时间。 |\n| `GetCreationTimeUtc` | 返回协调世界时\
  \ (UTC) 格式的目录创建日期和时间。 |\n| `GetCurrentDirectory` | 返回应用程序当前的工作目录。 |\n| `GetDirectories`\
  \ | 返回一个字符串数组，包含目录子目录的完全限定名。 |\n| `GetDirectoryRoot` | 返回路径的目录根，该路径可能不存在（例如 `C:\\\
  `）。 |\n| `GetFiles` | 返回一个字符串数组，包含目录下文件的完全限定名。 |\n| `GetFileSystemEntries` | 返回一个字符串数组，包含目录下文件和子目录的完全限定名。\
  \ |\n| `GetLastAccessTime` | 返回目录的最后访问日期和时间。 |\n| `GetLastAccessTimeUtc` | 返回 UTC\
  \ 格式的目录最后访问日期和时间。 |\n| `GetLastWriteTime` | 返回目录最后修改的日期和时间。 |\n| `GetLastWriteTimeUtc`\
  \ | 返回 UTC 格式的目录最后修改的日期和时间。 |\n| `GetLogicalDrives` | 返回一个字符串数组，列出逻辑驱动器如 `A:\\`。列表包含了已连接的驱动器。例如，它会列出一个空软盘器和一个连接的闪存盘，但在你断开闪存盘后不会列出它。\
  \ |\n| `GetParent` | 返回表示目录父目录的 `DirectoryInfo` 对象。 |\n| `Move` | 将目录移动到磁盘卷的新位置。\
  \ |\n| `SetCreationTime` | 设置目录的创建日期和时间。 |\n| `SetCreationTimeUtc` | 设置 UTC 格式的目录创建日期和时间。\
  \ |\n| `SetCurrentDirectory` | 设置当前的工作目录。 |\n| `SetLastAccessTime` | 设置目录的最后访问日期和时间。\
  \ |\n| `SetLastAccessTimeUtc` | 设置 UTC 格式的目录最后访问日期和时间。 |\n| `SetLastWriteTime` |\
  \ 设置目录的最后修改日期和时间。 |\n| `SetLastWriteTimeUtc` | 设置 UTC 格式的目录最后修改日期和时间。 |\n\n### File\n\
  \n`File` 类提供了处理文件的静态方法。下表总结了其最实用的静态方法。\n\n| 方法 | 目的 |\n| :--- | :--- |\n| `AppendAllText`\
  \ | 将文本添加到文件末尾，如果文件不存在则创建，然后关闭文件。 |\n| `AppendText` | 以追加模式打开 UTF-8 编码的文件并返回关联的\
  \ `StreamWriter`。 |\n| `Copy` | 复制文件。 |\n| `Create` | 创建新文件并返回关联的 `FileStream`。\
  \ |\n| `CreateText` | 创建或打开 UTF-8 编码的文件进行写入，并返回关联的 `StreamWriter`。 |\n| `Delete`\
  \ | 永久删除文件。 |\n| `Exists` | 如果指定的文件存在则返回 `true`。 |\n| `GetAttributes` | 获取文件的属性。这是由\
  \ `FileAttributes` 枚举定义的标志组合，包含 `Archive`、`Compressed`、`Device`、`Directory`、`Encrypted`、`Hidden`、`Normal`、`NotContextIndexed`、`Offline`、`ReadOnly`、`ReparsePoint`、`SparseFile`、`System`\
  \ 和 `Temporary`。 |\n| `GetCreationTime` | 返回文件的创建日期和时间。 |\n| `GetCreationTimeUtc`\
  \ | 返回 UTC 格式的文件创建日期和时间。 |\n| `GetLastAccessTime` | 返回文件的最后访问日期和时间。 |\n| `GetLastAccessTimeUtc`\
  \ | 返回 UTC 格式的文件最后访问日期和时间。 |\n| `GetLastWriteTime` | 返回文件的最后修改日期和时间。 |\n| `GetLastWriteTimeUtc`\
  \ | 返回 UTC 格式的文件最后修改日期和时间。 |\n| `Move` | 将文件移动到新位置。 |\n| `Open` | 打开文件并返回关联的 `FileStream`。参数允许指定模式（`Append`、`Create`、`CreateNew`、`Open`、`OpenOrCreate`\
  \ 或 `Truncate`）、访问权限（`Read`、`Write` 或 `ReadWrite`）以及共享设置（`Read`、`Write`、`ReadWrite`\
  \ 或 `None`）。 |\n| `OpenRead` | 以读取模式打开文件并返回关联的 `FileStream`。 |\n| `OpenText` | 以读取模式打开\
  \ UTF-8 编码文本文件并返回关联的 `StreamReader`。 |\n\n\n\n\n\n| `OpenWrite` | 打开文件进行写入并返回一个附加到它的\
  \ `FileStream`。 |\n| `ReadAllBytes` | 以 `byte` 数组的形式返回文件的内容。 |\n| `ReadAllLines`\
  \ | 以 `string` 数组的形式返回文件的行。 |\n| `ReadAllText` | 以 `string` 形式返回文件的内容。 |\n| `Replace`\
  \ | 此方法接受三个文件路径作为参数，分别代表源文件、目标文件和备份文件。如果备份文件存在，该方法将其永久删除。然后将目标文件移动到备份文件位置，并将源文件移动到目标文件位置。如果源文件或目标文件不存在，则此方法会抛出异常。\
  \ |\n| `SetAttributes` | 设置文件的属性。这是由 `FileAttributes` 枚举定义的标志组合，该枚举定义了 `Archive`、`Compressed`、`Device`、`Directory`、`Encrypted`、`Hidden`、`Normal`、`NotContextIndexed`、`Offline`、`ReadOnly`、`ReparsePoint`、`SparseFile`、`System`\
  \ 和 `Temporary` 值。 |\n| `SetCreationTime` | 设置文件的创建日期和时间。 |\n| `SetCreationTimeUtc`\
  \ | 设置 UTC 格式的文件创建日期和时间。 |\n| `SetLastAccessTime` | 设置文件的最后访问日期和时间。 |\n| `SetLastAccessTimeUtc`\
  \ | 设置 UTC 格式的文件最后访问日期和时间。 |\n| `SetLastWriteTime` | 设置文件的最后写入日期和时间。 |\n| `SetLastWriteTimeUtc`\
  \ | 设置 UTC 格式的文件最后写入日期和时间。 |\n| `WriteAllBytes` | 创建或覆盖文件，向其中写入一个 `byte` 数组并关闭文件。\
  \ |\n| `WriteAllLines` | 创建或覆盖文件，向其中写入一个 `string` 数组并关闭文件。 |\n| `WriteAllText` |\
  \ 创建或覆盖文件，向其中写入一个 `string` 并关闭文件。 |\n\n### DriveInfo\n\n`DriveInfo` 对象代表计算机驱动器之一。下表描述了该类提供的属性。表格中的最后一列指示驱动器是否必须处于就绪状态才能使该属性工作且不抛出异常。使用\
  \ `IsReady` 属性在使用这些属性之前检查驱动器是否已就绪。\n\n| Property | Purpose | Must Be Ready? |\n\
  | :--- | :--- | :--- |\n| `AvailableFreeSpace` | 返回驱动器上可用的可用空间大小（字节）。此值考虑了配额，因此可能与\
  \ `TotalFreeSpace` 不匹配。 | True |\n| `DriveFormat` | 返回文件系统类型，例如 NTFS 或 FAT32。（有关\
  \ NTFS 和 FAT 文件系统的更多信息，请访问网络。例如，页面 [www.ntfs.com/ntfs_vs_fat.htm](http://www.ntfs.com/ntfs_vs_fat.htm)\
  \ 比较 FAT、FAT32 和 NTFS 文件系统。） | True |\n| `DriveType` | 返回指示驱动器类型的 `DriveType` 枚举值。此值可以是\
  \ `CDRom`、`Fixed`、`Network`、`NoRootDirectory`、`Ram`、`Removable` 或 `Unknown`。 | False\
  \ |\n| `IsReady` | 如果驱动器就绪则返回 `true`。如果在驱动器未就绪时访问许多 `DriveInfo` 属性，将不可用并抛出异常。 |\
  \ False |\n| `Name` | 返回驱动器名称。这是驱动器的根名称，例如 `A:\\` 或 `C:\\`。 | False |\n| `RootDirectory`\
