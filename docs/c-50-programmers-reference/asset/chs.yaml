  \ message 1\");\n    Trace.WriteLine(DateTime.Now.ToString() + \": Trace message\
  \ 1\");\n    Console.WriteLine(DateTime.Now.ToString() + \": Console message 1\"\
  );\n\n    Debug.WriteLine(DateTime.Now.ToString() + \": Debug message 2\");\n  \
  \  Trace.WriteLine(DateTime.Now.ToString() + \": Trace message 2\");\n    Console.WriteLine(DateTime.Now.ToString()\
