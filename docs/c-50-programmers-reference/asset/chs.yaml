  824. xl\n825. xli\n\n\n- 第一章: C# 环境\n- 第二章: 编写第一个程序\n\n\n### 本章内容\n- IL 和 CLR\n\
  - JIT 编译\n- 程序与程序集\n- .NET Framework\n\n### Wrox.com 下载资源\n请注意，本章的所有代码示例均可在 `www.wrox.com/go/csharpmers`\
  \ 的下载标签中找到。\n\nC# 程序无法独立存在。没有工具，你就无法编写 C# 程序。没有提供运行时的库，你甚至无法运行编译后的 C# 程序。本章描述了在\
  \ Windows 环境中编写、编译和执行 C# 程序所需的工具。大多数时候，这些工具都在后台工作，因此你不需要感知它们的存在。但了解它们仍然是有用的，这样你就能知道各个部分是如何组合的。\n\
  \n### Visual Studio\n你可以在文本编辑器中编写 C# 程序并使用命令行界面编译程序（例如，更多信息请参见 `http://msdn.microsoft.com/library/ms7953.aspx`\
  \ 中的“C# 2.0 命令行”）。这种方法非常麻烦，因此大多数 C# 程序员使用 Visual Studio。\n\nVisual Studio 是一个强大的开发环境\
  \ (IDE)，包含了代码编辑器、表单设计器和灵活的调试工具。某些版本还包含测试和分析工具。Visual Studio 代码编辑器提供了 `IntelliSense`\
  \ 帮助，显示你需要输入到代码中的提示和描述。`IntelliSense` 等功能让编写正确的 C# 程序比使用文本编辑器容易得多。如果你还没有安装 Visual\
  \ Studio，现在应该去安装。这需要一些时间，请确保网络连接。了解并下载 Visual Studio 版本，请访问 `www.visualstudio.com/products/visual-vs`。了解其他版本，请访问\
  \ `www.microsoft.com/visualstudio/compare`。在下载和安装期间，你可以继续阅读。最重要的工具是编译器，它将 C# 代码转换为编译后的可执行程序——某种意义上如此。\n\
  \n## C# 编译器\nC# 编译器并没有将代码编译成真正的可执行程序。相反，它将你的 C# 代码转换为一种类似于汇集的语言，称为中间语言 (`IL`)。考虑以下\
  \ C# 代码：\n\n```csharp\nstatic void Main(string[] args)\n{\n    foreach (string arg\
  \ in args) Console.WriteLine(arg);\n    Console.WriteLine(\"Press Enter to continue\"\
  );\n    Console.ReadLine();\n}\n```\n\nC# 编译器将其翻译为以下 IL 代码：\n\n```il\n.method private\
  \ hidebysig static void Main(string[] args) cil managed\n{\n  .entrypoint\n  //\
  \ Code size       51 (0x33)\n  .maxstack  2\n  .locals init ([0] string arg,\n \
  \          [1] string[] CS$6$000,\n           [2] int32 CS$7$0001,\n           [3]\
  \ bool CS$4$0002)\n  IL_0000:  nop\n  IL_0001:  nop\n  IL_0002:  ldarg.0\n  IL_0003:\
  \  stloc.1\n  IL_0004:  ldc.i4.0\n  IL_0005:  stloc.2\n  IL_0006:  br.s       IL_0017\n\
  \  IL_0008:  ldloc.1\n  IL_0009:  ldloc.2\n  IL_000a:  ldelem.ref\n  IL_000b:  stloc.0\n\
  \  IL_000c:  ldloc.0\n  IL_000d:  call       void [mscorlib]System.Console::WriteLine(string)\n\
  \  IL_0012:  nop\n  IL_0013:  ldloc.2\n  IL_0014:  ldc.i4.1\n  IL_0015:  add\n \
  \ IL_0016:  stloc.2\n  IL_0017:  ldloc.2\n  IL_0018:  ldloc.1\n  IL_0019:  ldlen\n\
  \  IL_001a:  conv.i4\n  IL_001b:  clt\n  IL_001d:  stloc.3\n  IL_001e:  ldloc.3\n\
  \  IL_001f:  brtrue.s   IL_0008\n  IL_0021:  ldstr      \"Press Enter to continue\"\
  \n  IL_0026:  call       void [mscorlib]System.Console::WriteLine(string)\n  IL_002b:\
  \  nop\n  IL_002c:  call       string [mscorlib]System.Console::ReadLine()\n  IL_0031:\
  \  pop\n  IL_0032:  ret\n} // end of method Program::Main\n```\n\n## CLR\nCLR 是\
  \ .NET Framework 的一个虚拟机组件，当你运行 C# 程序时，它会将 IL 翻译成原生机器码。\n\nCLR 使用即时编译器（JIT 编译器）在需要时才编译\
  \ IL 代码的片段。当程序加载时，加载器会为每个方法创建一个存根（stub）。初始情况下，该存根指向方法的 IL 代码。\n\n\n\n\n\n当程序调用方法时，JIT\
  \ 编译器会将 IL 代码翻译成机器码，使存根（stub）指向该代码，然后运行机器码。如果程序稍后再次调用该方法，存根已经指向了机器码，因此该方法不需要再次编译。\n\
  \n图 1-1 以图形式展示了这一过程。\n\n通常情况下，编译一个方法所需的时间很短，因此你不会注意到每个方法第一次被调用时所消耗的微小额外时间。方法编译完成后，以后再次调用它时运行速度会快一点。\n\
  \n如果程序从未调用过某个方法，JIT 编译器就不会对其进行编译，这样编译器就节省了一些时间。\n\n![c01f001.eps](img/c01f001.png)\n\
  \n**图 1-1:** 编译器将 C# 代码（以及其他语言的代码）翻译成 IL 代码。在运行时，JIT 编译器根据需要将方法从 IL 代码翻译成机器码。\n\n\
  除了提供 JIT 编译外，CLR 还提供了程序使用的一些底层服务，例如内存管理、线程管理和异常处理。（第 12 章“类与结构体”描述了 .NET 内存管理模型。第\
  \ 6 章“方法”和第 22 章“并行编程”讨论了多线程的使用。第 9 章“错误处理”描述了 C# 中的异常处理。）\n\n\n.NET Framework 包含\
  \ CLR 和一个强大的工具库，使得 C# 编程变得更加简单。这些工具几乎包含了你在 C# 程序中正常使用的所有不属于 C# 语言本身的内容。.NET Framework\
  \ 包含的一些工具允许你：\n\n*   为类及其成员添加特性（attributes），以向运行时工具提供额外信息。\n*   使用集合，如列表（lists）、字典（dictionaries）和哈表（hash\
  \ tables）。\n*   与数据库交互。\n*   使用 GPS、Wi-Fi 三角定位和基站三角定位等方法查找计算机的物理位置。\n*   与系统进程、事件日志和性能数据交互。\n\
  *   创建复杂的二维图形。\n*   与 Active Directory 交互。\n*   提供全球化支持，使程序在不同区域使用适当的文本和图像。\n* \
  \  使用 LINQ（在第 8 章“LINQ”中进行了描述）。\n*   创建并使用消息队列。\n*   与文件系统交互。\n*   播放音频和视频。\n* \
  \  获取设备信息并管理设备。\n*   与网络和互联网交互。\n*   打印文档。\n*   检查程序或其他编译程序集定义的代码实体。\n*   序列化和反序列化对象。\n\
  *   控制程序安全性。\n*   支持语音识别。\n*   同时运行多个执行线程。\n*   处理 XML 和 JSON 文件。\n*   加密和解密文件。\n\
  *   更多功能。\n\n通过使用所有这些工具，你可以构建独立的程序，运行在桌面系统、手机或平板电脑应用程序、网站、网络应用程序以及各种其他程序上。\n\n编译后的\
  \ C# 程序需要 CLR 来执行，大多数程序还需要 .NET Framework。这意味着要运行程序，计算机必须安装 .NET Framework。\n\n\
  如果计算机上安装了 Visual Studio，则也安装了 .NET Framework。这意味着你通常可以将编译好的 C# 应用程序复制到计算机上并运行。（当然，你永远不应该从一个你不信任的来源拷贝编译后的程序！如果你想和朋友分享程序，这种方法是有效的，但不要随便从互联网上获取任何旧的\
  \ C# 程序。）\n\n大多数安装程序在需要时也会安装 .NET Framework，因此如果你使用安装程序，如果机器上尚未安装 .NET Framework，它将被安装。例如，ClickOnce\
  \ 部署会在必要安装 .NET Framework。\n\n你也可以通过下载安装程序或使用网络安装程序手动安装 .NET Framework。要找到最新的安装程序，请访问微软的下载中心\
  \ [www.microsoft.com/download/default.aspx](http://www.microsoft.com/download/default.aspx)\
  \ 并搜索 `.NET Framework`。\n\n.NET Framework 的大多数功能都是向后兼容的，因此通常你可以安装最新版本，用旧版本构建的程序仍然可以运行。如果你确实需要特定版本的\
  \ .NET Framework，请在下载中心搜索所需的版本。\n\n\nC# 程序无法完全独立存在。要创建、编译和运行 C# 程序，你需要多种工具。你可以在文本编辑器中创建\
  \ C# 程序，但使用 Visual Studio 编写和调试程序要容易得多。在你写完程序后，C# 编译器会将 C# 代码翻译成 IL 代码。在运行时，CLR（.NET\
  \ Framework 的一部分）使用 JIT 编译将 IL 代码翻译成原生机器码以执行。\n\n你可以使用 `NGen` 预编译程序集并将其安装在 `GAC`\
  \ 中，这样它们就不需要在运行时由 JIT 编译器进行编译。但在许多情况下，这并不能多少时间。如果程序的方法在用户执行点击按钮和调用菜单项等操作时被调用，那么这种微小的额外开销可能不会被察觉。\n\
  \n这就是在你构建 C# 程序时后台发生的所有事情。\n\n\n1.  画出 Visual Studio 在你编写 C# 程序并按 F5 时执行的主要步骤。\n\
  2.  假设你有两个应用程序。第一个在用户选择时使用 50 个方法；第二个在启动时使用这 50 个方法。这两个应用程序的性能会有何不同？`NGen` 和 `GAC`\
  \ 如何适用于它们？\n3.  对于以下哪些场景，`NGen` 和 `GAC` 最为有用？\n    *   显示表单的交互式应用程序\n    *   定义程序使用的方法的代码库\n\
  \    *   定义自定义按钮、滚动条和其他控件的控件库\n    *   向控制台窗口输出内容的控制台应用程序\n4.  假设你的程序在用户执行各种操作时使用\
  \ 100 个方法。你为每个方法添加了一个参数，以便让其返回。那么当程序启动时（显示启动界面时），代码调用每个方法并返回。CLR 如何处理这些方法？\n\n\n\
  \n\n*   解决方案与项目\n*   创建控制台、Windows Forms、WPF 和 Windows Store 应用程序\n*   CLR 如何启动程序\n\
  \n\n请注意，本章的所有代码示例都可以通过 [www.wrox.com/go/csharp5programmersref](http://www.wrox.com/go/csharp5programmersref)\
  \ 下载 Code 选项卡作为本章代码的一部分下载。\n\n除非你计划在文本编辑器中编辑 C# 文件并使用命令行界面进行编译，否则你可能会使用 Visual Studio\
  \ 来编写和构建程序。因如此，本书会在一定程度上涉及 Visual Studio。\n\n\n\n\n\n\nVisual Studio 允许你构建许多不同类型的应用程序。本章将解释如何开始创建其中四种类型：控制台程序（console）、Windows\
  \ Forms、WPF 和 Windows Store 应用程序。\n\n\nVisual Studio 解决方案（solution）包含了你创建某种结果所需的文件。通常，结果是单个可执行应用程序；尽管它也可能是一系列相关的应用程序以及文档和其他相关项目。\n\
  \n解决方案由两个扩展名为 `.sln` 和 `.suo` 的文件定义。`.sln` 文件存储定义解决方案及其包含的项目的信息。`.suo` 文件用于跟踪 Visual\
  \ Studio IDE 的自定义设置。\n\n一个解决方案通常包含一个或多个项目。一个项目通常定义一个编译结果，例如程序、库或自定义控件。\n\n简单的应用程序通常由包含单个项目的解决方案组成，该项目定义了一个可执行程序。\n\
  \n要在新解决方案中创建新项目，选择 `文件（File）` ⇒ `新建项目（New Project）` 显示新建项目对话框。（要向现有解决方案添加新项目，请选择\
  \ `文件（File）` ⇒ `添加（Add）` ⇒ `新建项目（New Project）`。）\n\n新建项目对话框在左侧显示层级分类，右侧显示相关的项目模板。对话框的外观及其包含的模板取决于你运行的\
  \ Visual Studio 版本。图 2-1 显示了 Windows 桌面版 Visual Studio Express 2012 的新建项目对话框。在图\
  \ 2-1 中，选定的分类是 `已安装（Installed）` ⇒ `模板（Templates）` ⇒ `Visual C#`，该分类仅四个模板可用。\n\n\
  ![c02f001.tif](img/c02f001.png)\n**图 2-1：** Windows 桌面版 Visual Studio Express 2012\
  \ 仅包含几个 C# 项目模板。\n\n\n*   **Windows Forms**——使用 Windows Forms 控件并运行在 Windows 桌面上的程序。\n\
  *   **WPF (Windows Presentation Foundation)**——使用 WPF 控件并同样运行在 Windows 桌面上的程序。\n\
  *   **Console（控制台）**——读取文本输入并在控制台窗口中显示文本输出的程序。\n*   **Windows Store**——Windows Store\
  \ 应用程序。\n\nWPF 和 Windows Store 应用程序都使用扩展标记语言 (XAML) 代码来定义构成用户界面的 WPF 控件。WPF 控件比\
  \ Windows Forms 控件更灵活、图形功能更强大。例如，WPF 控件可以显示渐变背景、缩放或旋转图像、播放视频并使用动画随时间改变外观，这些都是 Windows\
  \ Forms 控件难以实现的。\n\n然而，WPF 控件使用的资源比 Windows Forms 控件多，因此让你编辑 WPF 和 Windows Store\
  \ 应用程序的设计器速度较慢。充分利用 WPF 功能还需要投入大量精力，因此 Windows Forms 应用程序通常更容易构建。\n\n\n如图 2-1 所示，Windows\
  \ 桌面版 Visual Studio Express 2012 允许你制作 Windows Forms、WPF 和控制台应用程序。\n\nWindows 8\
  \ 版 Visual Studio Express 2012 允许你制作 Windows Store 应用程序，但不能制作 Windows Forms、WPF\
  \ 桌面版或控制台应用程序。（这两个版本都包含了一些其他项目类型，如类库和控件库。）\n\n如果你拥有比 Express 版本功能更全的 Visual Studio，可以看到其他项目模板。图\
  \ 2-2 显示了 Visual Studio 2012 Ultimate 版的新建项目对话框。如果你仔细观察，会发现对话框包含了 Express 版提供的所有模板以及更多模板。\n\
  \n![c02f002.tif](img/c02f002.png)\n\n**图 2-2：** Visual Studio Ultimate 2012 包含比\
  \ Express 版多多的项目模板。\n\n本书侧重于 C# 语言而不是用户界面设计，因此关于创建全功能应用程序没有说太多。然而，稍微了解一下不同类型项目的工作原理是值得的。以下章节提供了关于四种主要应用程序项目类型：控制台、Windows\
  \ Forms、WPF 和 Windows Store 的更多信息。\n\n\n当你制作控制台应用程序时，Visual Studio 会创建一个名为 `Program.cs`\
  \ 的文件，该文件定义了一个名为 `Program` 的类。下面的代码显示了 Windows 桌面版 Visual Studio Express 2012 创建的初始\
  \ `Program` 类。\n\n```\nusing System;\nusing System.Collections.Generic;\nusing System.Linq;\n\
  using System.Text;\nusing System.Threading.Tasks;\n\nnamespace MyConsoleApplication\n\
  {\n    class Program\n    {\n        static void Main(string[] args)\n        {\n\
  \        }\n    }\n}\n```\n\n默认情况下，当你运行程序时，Visual Studio 会搜索名为 `Main` 的 `static`\
  \ 方法并执行它。起初只有一个这样的方法，所以没有问题。\n\n然而，如果你创建另一个类并给它一个名为 `Main` 的静态方法，Visual Studio 将无法确定启动哪一个。你可以通过两种方法解决这个问题。首先，你可以重命名除一个以外的所有\
  \ `Main` 方法，这样 Visual Studio 就能确定启动哪一个。另一种方法是选择 `项目（Project）` ⇒ `属性（Properties）`\
  \ 打开应用程序属性，如图 2-3 所示。打开 `启动对象（Startup Object）` 下拉列表，选择包含 `Main` 方法的类。\n\n![c02f003.tif](img/c02f003.png)\n\
  \n**图 2-3：** 属性允许指定启动类。\n\n在 `Main` 方法内部，你可以添加程序执行所需的任何代码。例如，下面的代码显示一条消息，然后等待用户按回车。\n\
  \nstatic void Main(string[] args)\n{\n    Console.WriteLine(\"Press Enter to continue\"\
  );\n    Console.ReadLine();\n}\n```\n\n\n![c02f004.tif](img/c02f004.png)\n\n\n由于控制台应用程序没有用户界面，许多\
  \ C# 书籍所有的示例都写成控制台程序。然而，Windows Forms 应用程序看起来更好且更灵活。例如，Windows Forms 应用程序可以显示图像、绘制图形并在组合框或列表等控件中显示结果。\n\
  \n\n图 2-5 显示了 Windows 桌面版 Visual Studio Express 2012 在创建新的 Windows Forms 应用程序之后。\n\
  \n![c02f005.eps](img/c02f005.png)\n\n\n以下列表描述了图 2-5 中 Visual Studio 的编号区域：\n\n1.\
  \ **解决方案管理器（Solution Explorer）**——此区域列出了与项目相关的文件。双击文件即可在设计器区域打开它。\n2. **设计器（Designer）**——此区域包含允许编辑不同类型文件的设计器。例如，代码编辑器（Code\
  \ Editor）允许编辑 C# 代码，表单设计器（Form Designer）允许你编辑表单。图 2-5 显示了表单设计器正在编辑由文件 `Form1.cs`\
  \ 定义表单的用户界面。\n\n\n\n\n### 3. 工具箱\n在编辑表单时，你可以点击 `Toolbox` 中的控件来选择它。然后，你可以点击并拖动将该控件的实例放置在表单上。\n\
  \n### 4. 属性\n如果你在 `Window Designer` 中选择一个控件，此区域将显示该控件的属性并允许你进行编辑。在图 2-5 中，选中了表单，因此此区域正在显示表单的属性。例如，你可以在\
  \ `Properties Window` 中看到表单的 `Text` 属性被设置为 `Form1`。在 `Form Designer` 中，你可以看到表单在其顶部显示了文本。\n\
  \n### 5. 其他窗口\n\n本书的目标是让你构建出一个足够完善的程序，以便在后台执行 C# 代码。在 Windows Forms 应用程序中，控件等对象可以在事件发生时执行代码。例如，当用户点击按钮时，程序可以执行\
  \ `Click` 事件处理程序。\n\n要创建一个按钮，点击 `Toolbox` 中的 `Button` 工具。然后并在 `Window Designer`\
  \ 中点击并拖动以在窗口上放置一个按钮。如果你愿意，可以使用 `Properties window` 设置按钮的属性。例如，你可以通过将 `Text` 属性设置为\
  \ `Click Me` 等内容来设置其标题。\n\n\n要为按钮创建一个 `Click` 事件处理程序，请在 `Form Designer` 中双击它。当你这样操作时，Visual\
  \ Studio 会创建以下空白的 `Click` 事件处理程序并在 `Code Editor` 中打开它。\n\n```\nprivate void clickMeButton_Click(object\
  \ sender, EventArgs e)\n{\n\n```\n\n现在，你可以在大括号内添加任何你想让事件处理程序执行的代码。例如，以下代码将按钮的标题更改为\
  \ Clicked。\n\n```\nprivate void clickMeButton_Click(object sender, EventArgs e)\n\
  {\n    clickMeButton.Text = \"Clicked\";\n}\n```\n\n回想上一节，控制台应用程序通过执行 `Program`\
  \ 类的 `Main` 方法开始运行。如果你仔细查看 图 2-5，你可以看到 Windows Forms 程序也包含一个名为 `Program.cs` 的文件。如果你双击该文件，`Code\
  \ Editor` 将打开并显示以下代码。\n\nusing System;\nusing System.Collections.Generic;\nusing\
  \ System.Linq;\nusing System.Threading.Tasks;\nusing System.Windows.Forms;\n\nnamespace\
  \ MyWindowsFormsApplication\n{\n    static class Program\n    {\n        /// 应用程序的入口点。\n\
  \        /// </summary>\n        [STAThread]\n        static void Main()\n     \
  \   {\n            Application.EnableVisualStyles();\n            Application.SetCompatibleTextRenderingDefault(false);\n\
  \            Application.Run(new Form1());\n        }\n    }\n}\n```\n\n如果你向下滚动到第一行缩进的代码，你可以看到该文件定义了一个\
  \ `Program` 类，它与为控制台应用程序创建的类相似。与控制台应用程序使用的版本一样，这个 `Program` 类定义了一个 `static Main`\
  \ 方法。与之前一样，当你运行程序时，Visual Studio 会执行此方法。\n\n在 Windows Forms 应用程序中，`Main` 方法初始化了一些视觉样式文本渲染属性。然后它执行\
  \ `Application.Run` 方法，并传递一个新的 `Form1` 类实例。这就是程序显示其主表单的方式。`Application.Run` 方法显示作为参数传递的表单，并进入事件循环，在其中处理消息直到表单关闭。\n\
  \n当表单关闭时，对 `Application.Run` 的调用结束。这是 `Main` 方法中的最后一个语句，因此 `Main` 退出。与控制台应用程序一样，当\
  \ `Main` 方法退出时，应用程序结束。\n\n\n创建一个 WPF 应用程序与创建 Windows Forms 应用程序类似。选择 File  ⇒ New\
  \ Project，选择 WPF Application 模板并输入项目名称。如果你没有使用 Visual Studio Express 2012 for Windows\
  \ Desktop，请输入项目位置。然后点击 OK 创建项目。\n图 2-6 显示了一个新创建的 WPF 应用程序。如果你对比图 2-6 和 2-5，你可以看到许多相同的窗口。Visual\
  \ Studio 的中心包含一个与图 2-5 中的 `Form Designer` 类似的 `Window Designer`。`Solution Explorer`\
  \ 和 `Properties Window` 位于右侧。（尽管这两个版本的 Properties Window 之间有很多差异。）`Error List` 出现在两张图的底部。\n\
  \n这两个显示之间的一个显著区别是 `Window Designer` 底部的 XAML 代码窗口。窗口的控件和外观由此区域的 XAML 代码决定。当你向窗口添加控件时，XAML\
  \ 代码会更新以反映新添加的控件。\n\n相反，如果你修改 XAML 代码，`Window Designer` 将更新以显示你的更改。\n\n图 2-5 和 2-6\
  \ 之间的第二个主要区别是 `Window Designer` 左侧的 `Document Outline`。\n\n\n\n\n`App.xaml` 文件被标记为只读，因此你不应该通过编辑它来更改启动窗口。相反，请像处理\
  \ Windows Forms 应用程序一样选择“项目 ⇒ 属性”。这将打开一个应用程序属性窗口，其外观与图 2-3 中所示的类似。使用“启动对象”下拉菜单选择你想要在启动时显示的窗口。\n\
  \n\nWindows Store 应用程序是为在 Windows 8 中运行设计的程序。它们支持 Windows 8 应用程序的外观。例如，它们可以在开始屏幕上显示磁贴，并在运行时更新这些磁贴以告诉用户它们正在做什么。（有关关于\
  \ Windows Store 的更多信息，请访问 [www.windowsstore.com](http://www.windowsstore.com)。）\n\
  \n要创建一个 Windows Store 应用程序，选择“文件 ⇒ 新建项目”，选择一个 Windows Store 模板，输入项目名称和位置。然后点击“确定”创建项目。\n\
  \n图 2-7 显示了在 Visual Studio Express 2012 for Windows 8 中新创建的 Windows Store 应用程序。最初，`App.xaml.cs`\
  \ 文件在代码编辑器中显示。\n\n要向应用程序添加按钮，在解决方案资源管理器中双击 `MainPage.xaml` 以在设计器中打开 `MainPage` 类。`MainPage`\
  \ 类与上一节描述的 WPF 应用程序中使用的 `MainWindow` 类似，你可以类似地使用设计器来编辑它们。使用“工具箱”在页面上放置按钮。使用“属性”窗口设置按钮的属性。双击按钮为按钮创建一个事件处理程序，并向其中添加你喜欢的任何代码。\n\
  \n![c02f007.tif](img/c02f007.png)\n\n图 2-7: 创建新的 Windows Store 应用程序后，Visual Studio\
  \ 显示 `App.xaml.cs`。\n\n\n```\nprotected override void OnLaunched(LaunchActivatedEventArgs\
  \ args)\n{\n    Frame rootFrame = Window.Current.Content as Frame;\n\n    // 当窗口已包含内容，不要重复初始化应用程序，\n\
  \    // 只确保窗口处于激活状态\n    if (rootFrame == null)\n        // 创建一个 Frame 作为导航上下文并导航到第一页\n\
  \        rootFrame = new Frame();\n\n        if (args.PreviousExecutionState ==\
  \ ApplicationExecutionState.Terminated)\n        {\n        }\n        // 将 frame\
  \ 放在当前窗口中\n        Window.Current.Content = rootFrame;\n    }\n\n    if (rootFrame.Content\
  \ == null)\n    {\n        // 当导航栈未恢复时，导航到第一页，\n        // 通过传递必要信息作为导航参数来配置新页面\n\
  \        if (!rootFrame.Navigate(typeof(MainPage), args.Arguments))\n        {\n\
  \            throw new Exception(\"Failed to create initial page\");\n        }\n\
  \    }\n    // 确保当前窗口处于激活状态\n    Window.Current.Activate();\n}\n```\n\n如果应用程序的 `Frame`\
  \ 为 `null`，代码将创建一个新的 `Frame`。\n\n然后，如果 `Frame` 的内容为 `null`，加粗的代码行将使用 `Frame` 的 `Navigate`\
  \ 方法导航到 `MainPage` 类的一个新实例。（如果 `Frame` 的内容不是 `null`，则它是之前创建的 `MainPage` 类实例，并会被重用。）\n\
  \n最后，代码会激活当前窗口，此时 `MainPage` 出现。\n\n\n除非你计划在文本编辑器中编辑 C# 文件，然后使用命令行界面编译它们，否则你最终将使用\
