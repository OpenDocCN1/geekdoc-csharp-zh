  \ bug。第 9 章“错误处理”解释了你如何保护应用程序免受意外错误的影响，并让它采取行动纠正问题，或者至少避免崩溃。\n\n## 练习\n\n1. 编写一个程序，使用函数式构造构建一个代表以下\
