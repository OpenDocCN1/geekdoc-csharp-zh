  d+` 匹配一个小数点，后跟一个或多个数字。该组后面跟着 `?`，因此它可以出现零次或一次，所以该表达式不会匹配包含多个小数点的字符串。\n\n### 8. 下面的文本显示了一个匹配此类浮点数的正则表达式。\n\
  \n```\n^[-+]?\\d{1,3}(,\\d{3})*(\\.\\d+)?$\n```\n\n`[-+]?` 匹配零次或一次的 `-` 或 `+` 号。\n\
  \n`\\d{1,3}` 匹配一到三个数字。\n\n下一个组包含 `,\\d{3}`，它匹配一个逗号，后跟恰好三个数字。该组后面跟着 `*`，因此它可以出现零次或多次。\n\
  \n`\\.\\d+` 匹配一个小数点后跟一个或多个数字。该组后面跟着 `?`，因此它可以出现零次或一次。\n\n### 9. RearrangeNames 示例程序使用以下代码来实现此操作。\n\
  \n```csharp\n// 重新排列名称。\nprivate void rearrangeButton_Click(object sender, EventArgs\
  \ e)\n{\n    resultTextBox.Text = Regex.Replace(\n        namesTextBox.Text,\n \
  \       @\"^(\\w*)\\s*(\\w*)(\\s*)$\",\n        @\"$2, $1$3\",\n        RegexOptions.Multiline);\n\
  }\n```\n\n下面的文本显示了匹配表达式。\n\n```\n^(\\w*)\\s*(\\w*)(\\s*)\n```\n\n此表达式包含三个组。第一组使用\
  \ `\\w*` 匹配零或多个单词字符。（这是人的第一个名。）\n\n在第一组之后，表达式使用 `\\s*` 匹配零或多个空白字符。这不在一个组内，因此在此处匹配到的任何内容都会丢失。\n\
  \n第二个组再次使用 `\\w*` 匹配零或多个单词字符。（这是人的姓氏。）\n\n最后一个组使用 `\\s*` 匹配行末尾的零或多个空白字符。（这是 `[Return]`\
  \ 字符。）\n\n下面的文本显示了替换表达式。\n\n```\n$2, $1$3\n```\n\n这会将整个匹配项替换为第二个组，后面跟着逗号和空格，然后是第一组，最后是第三组。结果是姓、逗号和空格、名、以及末尾的\
  \ `[Return]`。\n\n# 第 22 章\n\n### 1. ThreadTimer 示例程序使用以下代码来实现此操作。\n\n```csharp\n\
